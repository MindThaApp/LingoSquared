teaching:
  fa.a1.unit15.lesson01.teach.in_word:
    title: 这个
    gloss: 这个
    note: این 的意思是“这个”。
    example_gloss: 这个比那个大。
  fa.a1.unit15.lesson01.teach.oon_word:
    title: 那个
    gloss: 那个
    note: اون 的意思是“那个”(آن 的口语形式)。
    example_gloss: 那个比这个小。
  fa.a1.unit15.lesson01.teach.bozorgtare_word:
    title: 它更大
    gloss: 它更大
    note: بزرگ‌تره 是 بزرگ‌تر است(它更大)的口语缩略形式。بزرگ‌تر 是 بزرگ(大)的比较级。
    example_gloss: 这个比那个大。
  fa.a1.unit15.lesson01.teach.koochiktare_word:
    title: 它更小
    gloss: 它更小
    note: کوچیک‌تره 是 کوچیک‌تر است(它更小)的口语缩略形式。
    example_gloss: 那个比这个小。
  fa.a1.unit15.lesson01.teach.az_word:
    title: 比
    gloss: 比
    note: از 标示比较的对象:X از Y بزرگ‌تره 的意思是“X比Y大”。
    target_text: از(比)
  fa.a1.unit15.lesson02.teach.geroontare_word:
    title: 它更贵
    gloss: 它更贵
    note: گرون‌تره 是 گرون‌تر است 的口语缩略形式。گرون‌تر 是 گرون(贵)的比较级。
    example_gloss: 这个比那个贵。
  fa.a1.unit15.lesson02.teach.arzoontare_word:
    title: 它更便宜
    gloss: 它更便宜
    note: ارزون‌تره 是 ارزون‌تر است 的口语缩略形式。ارزون‌تر 是 ارزون(便宜)的比较级。
    example_gloss: 那个比这个便宜。
  fa.a1.unit15.lesson03.teach.names:
    title: 尼马和萨拉
    gloss: 尼马、萨拉
    note: 本课程中常用的伊朗人名。
    example_gloss:
    - 尼马比萨拉高。
    - 萨拉比尼马年轻。
  fa.a1.unit15.lesson03.teach.ghad_bolandtare_phrase:
    title: 更高
    gloss: 更高/他(她)更高
    note: '*قد بلندتره* 字面意思是“个子更长”:*قد*(身高)+ *بلندتر*(更高,*بلند* 高/长的比较级)+ *است*(是),缩略为 *-ه*。'
  fa.a1.unit15.lesson03.teach.javoontare_word:
    title: 更年轻
    gloss: 更年轻/他(她)更年轻
    note: جوون‌تره 是 جوون‌تر است 的口语缩略形式。جوون‌تر 是 جوون(年轻)的比较级。
    example_gloss: 萨拉比尼马年轻。
  fa.a1.unit15.lesson04.teach.behtare_word:
    title: 它更好
    gloss: 它更好
    note: '*بهتره* 是 *بهتر است* 的口语缩略形式。*بهتر*(更好)是 *خوب*(好)的不规则比较级。'
    example_gloss: 这个比那个好。
  fa.a1.unit15.lesson04.teach.badtare_word:
    title: 它更差
    gloss: 它更差
    note: '*بدتره* 是 *بدتر است* 的口语缩略形式。*بدتر*(更差)是 *بد*(坏)的规则比较级:就是在原词后加普通的 *تر*,不像 *بهتر* 那样不规则。'
    example_gloss: 那个比这个差。
  fa.a1.unit15.lesson04.teach.choon_word:
    title: 因为
    gloss: 因为
    note: چون 引出原因,意思是“因为”。
    target_text: چون(因为)
  fa.a1.unit15.lesson04.teach.va_word:
    title: 和
    gloss: 和
    note: و 的意思是“和”,用来连接两个分句或两个事物。
    target_text: و(和)
  fa.a1.unit15.lesson05.teach.reading_text:
    title: 比较短文示例
    gloss: 尼马比萨拉高。萨拉比尼马年轻。
    note: 一段简短的第三人称比较,综合运用了本单元的词汇。
  fa.a1.unit15.lesson06.teach.names:
    title: 尼马和萨拉
    gloss: 尼马、萨拉
    example_gloss:
    - 尼马说这个更贵。
    - 萨拉说那个更便宜。
  fa.a1.unit15.lesson06.teach.vali_word:
    title: 但是
    gloss: 但是
    note: ولی 的意思是“但是”,表示转折。
    target_text: ولی(但是)
  fa.a1.unit15.lesson06.teach.aare_word:
    title: 嗯
    gloss: 嗯
    note: آره 是 بله(是)的口语形式。
    example_gloss: 嗯,没错。
  fa.a1.unit15.lesson06.teach.dialogue_line1:
    title: 尼马说
    gloss: 这个比那个贵,但是更好。
  fa.a1.unit15.lesson06.teach.dialogue_line2:
    title: 萨拉回答
    gloss: 嗯,但是那个更便宜。
