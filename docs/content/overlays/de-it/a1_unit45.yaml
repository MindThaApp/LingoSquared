    title: in + Verkehrsmittel, a piedi = zu Fuß
    gloss: 'Bei Verkehrsmitteln sagt man im Italienischen in: in treno, in bicicletta, in macchina. Zu Fuß heißt a piedi: vado a piedi.'
    note: 'Im Deutschen sagt man „mit dem Zug“, im Italienischen *in treno*, ohne Artikel: *in treno*, nicht *nel treno*.'
