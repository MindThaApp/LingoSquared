  it.a1.unit45.lesson05.teach.giulia_viaggia_ogni:
    title: Wer fährt wie?
    gloss: Giulia fährt jeden Tag mit dem Zug zur Arbeit. Marco fährt normalerweise mit dem Fahrrad, aber wenn es regnet, nimmt er auch den Zug. Luca fährt lieber mit dem Auto. Chiara wohnt in der Nähe und geht zu Fuß zur Arbeit. Wie kommen Sie zur Arbeit?
    note: 'Gegenübergestellt werden vier Fortbewegungsarten und eine Bedingung (*quando piove*, wenn es regnet). *Andare* (gehen, fahren) ist unregelmäßig: *vado*, *va*.'
    glosses:
      viaggia: reist, fährt
      ogni: jeder
      giorno: Tag
      treno: der Zug
      lavoro: arbeiten
      bicicletta: Fahrrad (in bicicletta = mit dem Fahrrad)
      solito: üblich (di solito = normalerweise)
      piove: regnet
      prende: nimmt
      andare: gehen, fahren (andare in macchina = Auto fahren)
      preferisce: bevorzugt, zieht vor
      macchina: das Auto
      abita: wohnt
      vicino: in der Nähe
      piedi: Füße (a piedi = zu Fuß)
      vai: du gehst
  it.a1.unit45.lesson05.teach.chiara_abita_vicino:
    title: Chiara wohnt in der Nähe und geht zu Fuß zur Arbeit
    gloss: Chiara wohnt in der Nähe und geht zu Fuß zur Arbeit.
  it.a1.unit45.lesson06.teach.giulia_andiamo_insieme:
    title: Giulia macht einen Vorschlag
    gloss: 'Giulia: Fahren wir zusammen mit dem Fahrrad zum Sprachcafé?'
  it.a1.unit45.lesson06.teach.luca_preferisco_andare:
    title: Luca fährt lieber Auto
    gloss: 'Luca: Ich fahre lieber mit dem Auto.'
  it.a1.unit45.lesson06.teach.chiara_io_vado:
    title: Chiara geht zu Fuß
    gloss: 'Chiara: Ich gehe zu Fuß, es ist ja in der Nähe.'
  it.a1.unit45.lesson06.teach.marco_bene_allora:
