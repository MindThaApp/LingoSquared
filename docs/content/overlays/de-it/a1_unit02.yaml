course:
  title: Italienisch A1
  description: Lernen Sie Italienisch auf A1-Niveau für alltägliche Begrüßungen und kurze Gespräche, mit ausführlichen deutschen Erklärungen.
units:
  it.a1.unit02.origin_nationality_language:
    title: Woher Sie kommen, Nationalität und Sprache
lessons:
  it.a1.unit02.lesson01.di_dove_sei:
    title: Woher kommst du? Die Herkunft erfragen und nennen
  it.a1.unit02.lesson02.parlare_italiano:
    title: 'Italienisch sprechen: Niveau und Sprachen'
  it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto:
    title: Beruf und Willkommen in Mailand
teaching:
  it.a1.unit02.lesson01.teach.di_dove:
    title: di dove
    gloss: woher
    note: '*di dove* ist der Grundbaustein, um nach der Herkunft zu fragen oder sie zu nennen. Es steht zusammen mit *sei* (informell) oder *è* (formell).'
    example_gloss:
    - Sam, woher kommst du?
    - Elena, woher kommen Sie? (formell)
  it.a1.unit02.lesson01.teach.di_dove_sei:
    title: Di dove sei?
    gloss: Woher kommen Sie?
    note: Die informelle Frage, die man an Gleichaltrige oder Freunde richtet; sie passt zu *tu* aus Lektion 1.
  it.a1.unit02.lesson01.teach.di_dov_e_lei:
    title: Di dov'è, Lei?
    gloss: Woher kommen Sie? (formell)
    note: Die formelle Frage; sie passt zu *Lei* aus Lektion 1.
  it.a1.unit02.lesson01.teach.sono_americano_chicago:
    title: Sono americano, di Chicago.
    gloss: Ich bin Amerikaner, aus Chicago.
    note: Nennt Nationalität und Herkunftsstadt zusammen.
  it.a1.unit02.lesson01.teach.sono_italiana_milano:
    title: Sono italiana, di Milano.
    gloss: Ich bin Italienerin, aus Mailand.
    note: '*italiana* ist die weibliche Form der Nationalität, weil Elena eine Frau ist.'
  it.a1.unit02.lesson01.teach.nationalities:
    title: americano/americana, italiano/italiana
    gloss: Amerikaner/Amerikanerin, Italiener/Italienerin
    note: 'Italienische Nationalitätswörter ändern ihre Endung je nach Geschlecht der Person: *-o* für einen Mann, *-a* für eine Frau (*Sam è americano*, *Elena è italiana*).'
    example_gloss:
    - Sam ist Amerikaner.
    - Elena ist Italienerin.
  it.a1.unit02.lesson02.teach.parli_italiano:
    title: Parli italiano?
    gloss: Sprichst du Italienisch?
    note: Die informelle Frage mit der *tu*-Form von *parlare* (sprechen).
  it.a1.unit02.lesson02.teach.parla_italiano:
    title: Parla italiano?
    gloss: Sprechen Sie Italienisch? (formell)
    note: Die formelle Frage mit der *Lei*-Form von *parlare*.
  it.a1.unit02.lesson02.teach.parlo_un_po:
    title: Parlo un po' d'italiano
    gloss: Ich spreche ein bisschen Italienisch
    note: Eine bescheidene, gängige Art, das eigene Niveau zu beschreiben. *un po'* bedeutet „ein bisschen“.
    example_gloss: Ich spreche ein bisschen Italienisch, ich lerne es seit einem Jahr.
  it.a1.unit02.lesson02.teach.parlo_inglese:
    title: Parlo inglese.
    gloss: Ich spreche Englisch.
    note: Dieselbe Konstruktion mit *parlo* (ich spreche) und einer anderen Sprache.
  it.a1.unit02.lesson02.teach.studio_da_un_anno:
    title: Studio italiano da un anno.
    gloss: Ich lerne seit einem Jahr Italienisch.
    note: '*da un anno* bedeutet „seit einem Jahr“ und beschreibt eine Handlung, die in der Vergangenheit begonnen hat und jetzt noch andauert.'
  it.a1.unit02.lesson02.teach.da_quanto_studi:
    title: Da quanto studi?
    gloss: Seit wann lernst du (schon)?
    note: '*Da quanto* (seit wann) + Präsens *studi* (du lernst, informell) fragt, wie lange eine Tätigkeit schon andauert. Antworten Sie mit demselben Muster: *Studio da un anno.*'
  it.a1.unit02.lesson02.teach.parla_bene:
    title: Parli italiano bene!
    gloss: Du sprichst gut Italienisch!
    note: Ein freundliches Kompliment zum Sprachniveau, in der informellen *tu*-Form.
  it.a1.unit02.lesson03.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: Was machst du beruflich?
    note: Die informelle Frage mit der *tu*-Form von *fare* (machen, tun).
  it.a1.unit02.lesson03.teach.che_lavoro_fa:
    title: Che lavoro fa, Lei?
    gloss: Was machen Sie beruflich? (formell)
    note: Die formelle Frage mit der *Lei*-Form von *fare*.
  it.a1.unit02.lesson03.teach.sono_ingegnere:
    title: Sono ingegnere
    gloss: Ich bin Ingenieur
    note: 'Berufsbezeichnungen stehen im Italienischen meist ohne Artikel: *sono ingegnere*, nicht *sono un ingegnere*.'
    example_gloss: Ich bin Ingenieur und arbeite in Mailand.
  it.a1.unit02.lesson03.teach.sono_qui_per_lavoro:
    title: Sono qui per lavoro.
    gloss: Ich bin beruflich hier.
    note: '*per lavoro* nennt den Grund des Aufenthalts: Arbeit, nicht Tourismus.'
  it.a1.unit02.lesson03.teach.per_due_anni:
    title: Sono qui per due anni.
    gloss: Ich bin für zwei Jahre hier.
    note: Dieselbe Konstruktion wie *per lavoro*, hier aber mit einer Dauer statt eines Grundes.
  it.a1.unit02.lesson03.teach.che_bello_benvenuto:
    title: Che bello, benvenuto a Milano!
    gloss: Wie schön, willkommen in Mailand!
    note: '*Che bello* ist eine gängige, begeisterte Reaktion und bedeutet „wie schön/toll“.'
  it.a1.unit02.lesson03.teach.grazie_mille_reprise:
    title: Grazie mille!
    gloss: Vielen Dank!
    note: Derselbe nachdrückliche Dank wie in Lektion 1, hier als Antwort auf einen herzlichen Empfang.
