teaching:
  it.a1.unit22.lesson01.teach_felice_triste:
    title: felice, triste
    gloss: glücklich, traurig
    note: '*Felice* und *triste* enden auf *-e*, daher gilt dieselbe Form für Maskulinum und Femininum (*Sam è felice*, *Elena è felice*).'
    example_gloss:
    - Ich bin heute glücklich.
    - Ich bin heute traurig.
  it.a1.unit22.lesson01.teach_stanco_nervoso:
    title: stanco, nervoso
    gloss: müde, nervös
    note: Diese Adjektive können ihre Endung ändern; in dieser Lektion lernen Sie die maskulinen Grundformen kennen.
    example_gloss:
    - Sam ist müde.
    - Ich bin heute nervös.
  it.a1.unit22.lesson01.teach_come_ti_senti:
    title: Come ti senti?
    gloss: Wie fühlst du dich?
    note: '*Ti senti* ist die informelle Form für „du fühlst dich“, die man unter Freunden verwendet.'
    example_gloss:
    - Wie fühlst du dich heute?
  it.a1.unit22.lesson01.teach_sono_felice:
    title: Sono felice.
    gloss: Ich bin glücklich.
    note: Verwenden Sie *sono* mit einem Adjektiv für ein Gefühl.
    example_gloss:
    - Ich bin heute glücklich.
  it.a1.unit22.lesson02.teach_perche:
    title: perché
    gloss: weil / warum
    note: In dieser Lektion nennt *perché* den Grund für ein Gefühl.
    example_gloss:
    - Ich bin glücklich, weil heute die Sonne scheint.
  it.a1.unit22.lesson02.teach_sono_felice_perche:
    title: Sono felice perché oggi c'è il sole.
    gloss: Ich bin glücklich, weil heute die Sonne scheint.
    note: Das ist ein vollständiger Satz mit Gefühl und Grund.
    example_gloss:
    - In Mailand bin ich glücklich, weil heute die Sonne scheint.
  it.a1.unit22.lesson02.teach_sono_un_poco_stanca:
    title: Sono un po' stanca.
    gloss: Ich bin ein bisschen müde.
    note: '*Stanca* ist hier weiblich, weil Elena spricht.'
    example_gloss:
