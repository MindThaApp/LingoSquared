  it.a1.unit23.lesson02.teach_ti_mando_un_messaggio:
    title: Ti mando un messaggio.
    gloss: Ich schicke dir eine Nachricht.
    note: '*Ti mando* bedeutet in der Umgangssprache „ich schicke dir“.'
    example_gloss:
    - Hallo Sam, ich schicke dir eine Nachricht.
  it.a1.unit23.lesson02.teach_si_sono_elena:
    title: Sì, sono Elena.
    gloss: Ja, ich bin Elena.
    note: '*Sì* hat einen Akzent; schreiben Sie für „ja“ nicht *si* ohne Akzent.'
    example_gloss:
