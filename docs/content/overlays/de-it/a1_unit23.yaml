teaching:
  it.a1.unit23.lesson01.teach_pronto_chi_parla:
    title: Pronto, chi parla?
    gloss: Hallo? Wer spricht da?
    note: '*Pronto* ist auf Italienisch die übliche Art, ans Telefon zu gehen, nicht *ciao*.'
    example_gloss:
    - Hallo, hier ist Elena.
  it.a1.unit23.lesson01.teach_telefono_messaggio:
    title: il telefono, un messaggio
    gloss: das Telefon, eine Nachricht
    note: '*Messaggio* ist maskulin; sagen Sie *un messaggio*.'
    example_gloss:
    - Ich schicke dir eine Nachricht.
  it.a1.unit23.lesson01.teach_sono_elena:
    title: Sono Elena.
    gloss: Ich bin Elena.
    note: Am Telefon meldet man sich im Italienischen üblicherweise mit *sono* („ich bin“).
    example_gloss:
    - Hallo, hier ist Elena.
  it.a1.unit23.lesson01.teach_ciao_sam:
    title: Ciao Sam, sono Elena.
    gloss: Hallo Sam, hier ist Elena.
    note: '*Sono Elena* ist am Telefon die natürliche Art zu sagen: „Hier ist Elena.“'
    example_gloss:
    - Hallo Sam, hier ist Elena am Telefon.
  it.a1.unit23.lesson02.teach_puoi_ripetere:
    title: Puoi ripetere, per favore?
    gloss: Kannst du das bitte wiederholen?
    note: '*Puoi* ist die informelle Form und passt zwischen Elena und Sam.'
    example_gloss:
