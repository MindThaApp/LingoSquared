  it.a1.unit23.lesson02.teach_piu_piano:
    title: Più piano, per favore.
    gloss: Bitte langsamer.
    note: '*Più piano* bedeutet „langsamer“; so bittet man üblicherweise jemanden, langsamer zu sprechen.'
    example_gloss:
