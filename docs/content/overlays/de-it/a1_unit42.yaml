course:
  title: Italienisch A1
  description: 'Italienisch für Anfänger, um das grundlegende Aussehen einer Person zu beschreiben: Größe und Alterseindruck, Haar- und Augenfarbe, die Kernfrage Com''è? und der Vergleich des Aussehens zweier Personen.'
