teaching:
  it.a1.unit42.lesson01.teach.alto_basso:
    title: Groß und klein
    gloss: groß / klein
    note: '*Alto* beschreibt eine große Person, *basso* eine kleine. Italienische Adjektive richten sich nach der Person: *alto/alta*, *basso/bassa*.'
    example_gloss:
    - Chiara ist groß.
    - Luca ist klein.
  it.a1.unit42.lesson01.teach.anziano_giovane:
    title: Alt und jung
    gloss: alt / jung
    note: '*Anziano* (alt) und *giovane* (jung) geben einen allgemeinen Eindruck wieder, keine genaue Zahl an Jahren. *Giovane* endet auf -e und ist daher für Männer und Frauen gleich.'
    example_gloss:
    - Opa ist alt.
    - Marco ist jung.
  it.a1.unit42.lesson01.teach.per_l_eta:
    title: 'Alter: avere anni oder anziano'
    gloss: 'Für ein genaues Alter verwendet das Italienische avere + anni: Quanti anni hai? Für einen allgemeinen Eindruck verwendet es ein Adjektiv: Il nonno è anziano.'
    note: Im Deutschen sagt man „Ich bin 30“; im Italienischen heißt es wörtlich „Ich habe 30 Jahre“ (*ho trent'anni*). Das Adjektiv *anziano* drückt aus, wie alt jemand wirkt.
  it.a1.unit42.lesson01.teach.chiara_e_alta:
    title: Chiara ist groß und Luca ist klein
    gloss: Chiara ist groß und Luca ist klein.
    note: 'Zwei Adjektive, verbunden mit *e* (und). Jedes richtet sich nach seiner Person: *alta* (feminin) und *basso* (maskulin).'
  it.a1.unit42.lesson02.teach.i_capelli:
    title: Haare
    gloss: die Haare
    note: '*I capelli* steht im Italienischen im Plural (wörtlich „die Haare“). Der Singular *il capello* bezeichnet ein einzelnes Haar.'
    example_gloss: Marco hat kurze schwarze Haare.
  it.a1.unit42.lesson02.teach.biondi_castani_grigi:
    title: Blond, braun und grau
    gloss: blond / braun / grau
    note: 'Drei Haarfarben im Maskulin Plural, passend zu *capelli*: *biondi*, *castani*, *grigi*. Auch *neri* (schwarz) wird für Haare verwendet.'
    example_gloss:
    - Giulia hat blonde Haare.
    - Luca hat braune Haare.
    - Opa hat graue Haare.
  it.a1.unit42.lesson02.teach.lunghi_corti:
    title: Lang und kurz (Haare)
    gloss: lang / kurz (Haare)
    note: '*Lunghi* (lang) und *corti* (kurz) stehen wie *capelli* im Plural. Das Wort *alto* (groß) gilt nur für Personen, nicht für Haare.'
    example_gloss:
    - Chiara hat lange Haare.
    - Luca hat kurze Haare.
  it.a1.unit42.lesson02.teach.i_capelli_sono:
    title: Capelli steht im Plural
    gloss: 'Capelli steht im Plural, daher steht auch das Adjektiv im Plural: i capelli biondi, castani, grigi, neri, lunghi, corti.'
    note: 'Das Adjektiv steht nach dem Nomen und richtet sich in Genus und Numerus danach: *capelli lunghi* (Maskulin Plural), *occhi azzurri*.'
  it.a1.unit42.lesson02.teach.per_descrivere_una:
    title: Haare und Augen stehen mit avere
    gloss: 'Um eine Person zu beschreiben, verwendet das Italienische avere mit Haaren und Augen: Giulia ha i capelli biondi e gli occhi azzurri.'
    note: 'Im Italienischen steht dabei immer der Artikel, im Deutschen sagt man dagegen „hat blonde Haare“ ohne Artikel: *i capelli*, *gli occhi*. Man kann auch *è bionda* sagen, aber hier lernen Sie das Muster mit *avere*.'
  it.a1.unit42.lesson02.teach.marco_ha_i:
    title: Marco hat kurze schwarze Haare
    gloss: Marco hat kurze schwarze Haare.
    note: '*Neri* (schwarz) ist der Maskulin Plural und richtet sich nach *capelli*.'
  it.a1.unit42.lesson02.teach.giulia_ha_i:
    title: Giulia hat lange blonde Haare
    gloss: Giulia hat lange blonde Haare.
    note: Verbindet Länge und Farbe aus dieser Lektion in einem natürlichen Satz.
  it.a1.unit42.lesson03.teach.gli_occhi:
    title: Augen
    gloss: die Augen
    note: '*Occhio* (Auge) ist maskulin; der Plural lautet *occhi* und hat den Artikel *gli*, weil das Wort mit einem Vokal beginnt.'
    example_gloss: Marco hat braune Augen.
  it.a1.unit42.lesson03.teach.azzurri_marroni_verdi:
    title: Blau, braun und grün
    gloss: blau / braun / grün
    note: 'Augenfarben: *azzurri* (blau), *marroni* (braun), *verdi* (grün). Diese Pluralformen gelten für beide Geschlechter.'
    example_gloss:
    - Giulia hat blaue Augen.
    - Luca hat braune Augen.
    - Chiara hat grüne Augen.
  it.a1.unit42.lesson03.teach.anche_gli_occhi:
    title: Farben stehen im Plural
    gloss: 'Augenfarben stehen im Plural passend zu occhi: occhi azzurri, marroni, verdi.'
    note: 'Adjektive, die im Singular auf -e enden (*verde*, *marrone*), enden im Plural auf -i: *verdi*, *marroni*.'
  it.a1.unit42.lesson03.teach.com_e_giulia:
    title: Wie sieht Giulia aus?
    gloss: Wie sieht Giulia aus?
    note: '*Com''è?* ist die Grundfrage nach dem Aussehen. *Com''è* ist *come è*; das e fällt weg und wird durch einen Apostroph ersetzt.'
  it.a1.unit42.lesson03.teach.giulia_ha_i:
    title: Giulia hat lange blonde Haare und blaue Augen
    gloss: Giulia hat lange blonde Haare und blaue Augen.
    note: 'Eine Musterantwort: *avere* + Haare + *e* + Augen in einem Satz.'
  it.a1.unit42.lesson04.teach.giulia_al_caffe:
    title: Giulia stellt Nina vor
    gloss: 'Giulia: Ins Sprachcafé kommt ein neues Mädchen. Sie heißt Nina.'
    note: '*Viene* (kommt) führt jemand Neues ein. *Si chiama* bedeutet „sie heißt“, wörtlich „sie nennt sich“.'
  it.a1.unit42.lesson04.teach.marco_va_bene:
    title: Marco fragt, wie sie aussieht
    gloss: 'Marco: Gut! Wie sieht sie aus?'
    note: 'Wieder dieselbe Frage, aber ohne Namen: Das Subjekt ergibt sich aus dem Zusammenhang.'
  it.a1.unit42.lesson04.teach.giulia_e_bassa:
    title: Giulia beschreibt Ninas Größe und Haare
    gloss: 'Giulia: Sie ist klein und hat kurze blonde Haare.'
    note: '*È bassa* (sie ist klein) verwendet die weibliche Form *bassa*; die Beschreibung der Haare folgt mit *ha*.'
  it.a1.unit42.lesson04.teach.marco_e_gli:
    title: Marco fragt nach ihren Augen
    gloss: 'Marco: Und die Augen?'
    note: '*E gli occhi?* lässt das Verb weg. Im Italienischen werden oft Wörter weggelassen, die sich aus dem Zusammenhang ergeben.'
  it.a1.unit42.lesson04.teach.giulia_ha_gli:
    title: Giulia beschreibt Ninas Augen
    gloss: 'Giulia: Sie hat grüne Augen.'
    note: '*Ha gli occhi verdi*: Ein Subjektpronomen ist nicht nötig, weil die Verbendung schon zeigt, dass es „sie“ ist.'
  it.a1.unit42.lesson04.teach.marco_grazie_allora:
    title: Marco wird sie erkennen
    gloss: 'Marco: Danke! Dann erkenne ich sie.'
    note: '*La riconosco* (ich erkenne sie): Das Objektpronomen *la* steht vor dem Verb.'
  it.a1.unit42.lesson05.teach.luca_e_chiara:
    title: Luca und Chiara im Vergleich
    gloss: Luca und Chiara sind Bruder und Schwester, aber sie sehen sehr unterschiedlich aus. Luca ist klein und hat kurze braune Haare und braune Augen. Chiara ist größer als Luca und hat lange braune Haare und grüne Augen. Wie sehen Sie aus?
    note: Ein kurzer Vergleich mit allen bisher gelernten Farb- und Längenwörtern; am Ende steht die Kernfrage der Einheit an die Leserin bzw. den Leser.
    glosses:
      fratello: Bruder
      sorella: Schwester
      sembrano: sie wirken / scheinen
      diversi: verschieden
      basso: klein
      corti: klein
      castani: braun
      capelli: Haare
      marroni: braun
      occhi: Augen
      alta: groß (più alta = größer)
      lunghi: lang
      verdi: grün
      come: wie (Tu come sei? = Wie siehst du aus?)
  it.a1.unit42.lesson05.teach.il_comparativo_si:
    title: 'Vergleichen: più ... di'
    gloss: 'Im Italienischen vergleicht man mit più + Adjektiv + di: Chiara è più alta di Luca.'
    note: 'Setzen Sie *più* vor das Adjektiv und *di* vor die Person, mit der Sie vergleichen. Das Adjektiv behält sein Geschlecht: *più alta*, *più alto*.'
  it.a1.unit42.lesson05.teach.chiara_ha_i:
    title: Chiara hat längere Haare als Luca
    gloss: Chiara hat längere Haare als Luca.
    note: '*I capelli più lunghi di Luca*: Das Adjektiv bleibt im Plural, um sich an *capelli* anzupassen.'
  it.a1.unit42.lesson05.teach.ho_i_capelli:
    title: Ich habe kurze braune Haare
    gloss: Ich habe kurze braune Haare.
    note: '*Ho i capelli corti e castani*: Mit *avere* beschreiben Sie Ihr eigenes Aussehen.'
  it.a1.unit42.lesson06.teach.marco_guarda_e:
    title: Marco entdeckt Nina
    gloss: 'Marco: Schau, ist das Nina? Sie hat kurze blonde Haare und grüne Augen.'
    note: '*Guarda* (schau) ist der Imperativ der *tu*-Form. *Quella* bedeutet „die da“ für eine Frau oder ein Mädchen.'
  it.a1.unit42.lesson06.teach.giulia_si_e:
    title: Giulia bestätigt
    gloss: 'Giulia: Ja, das ist Nina!'
    note: Eine kurze, natürliche Bestätigung.
  it.a1.unit42.lesson06.teach.nina_ciao_sei:
    title: Nina begrüßt Marco
    gloss: 'Nina: Hallo, bist du Marco?'
    note: '*Sei Marco?* ist die informelle Frage: *sei* ist die *tu*-Form von *essere*, daher braucht man kein *tu*.'
  it.a1.unit42.lesson06.teach.marco_si_piacere:
    title: Marco begrüßt Nina zurück
    gloss: 'Marco: Ja! Freut mich, dich kennenzulernen, Nina.'
    note: '*Piacere di conoscerti* sagt man, wenn man jemanden zum ersten Mal trifft; *-ti* bedeutet „dich“.'
  it.a1.unit42.lesson06.teach.nina_piacere_mio:
    title: Nina erwidert die Begrüßung
    gloss: 'Nina: Freut mich auch, dich kennenzulernen!'
    note: 'Der Dialog endet: Marco hat Nina anhand von Giulias Beschreibung erkannt.'
