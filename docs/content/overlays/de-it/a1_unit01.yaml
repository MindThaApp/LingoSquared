teaching:
  it.a1.unit01.lesson01.teach.ciao_buongiorno:
    title: Ciao, Buongiorno
    gloss: hallo, guten Morgen
    note: '*Ciao* ist ein lockerer Gruß für alle Tageszeiten unter Freunden und Gleichaltrigen. *Buongiorno* ist der übliche, förmlichere Gruß für den Tag – vom Morgen bis in den Nachmittag hinein.'
    example_gloss:
    - Hallo, wie geht's?
    - Guten Morgen, wie geht es Ihnen?
  it.a1.unit01.lesson01.teach.come_stai_sta:
    title: come stai, come sta
    gloss: wie geht es dir, wie geht es Ihnen
    note: '*come stai* gehört zu *tu* (Freund, Gleichaltrige); *come sta* gehört zu *Lei* (Fremde, Vorgesetzte, Personen, denen man Respekt zeigt). Dieselbe Frage, ein anderes Register – ähnlich wie „Wie geht es dir?“ und „Wie geht es Ihnen?“.'
    example_gloss:
    - Hallo, wie geht es dir heute?
    - Guten Morgen, wie geht es Ihnen heute?
  it.a1.unit01.lesson01.teach.ciao_come_stai:
    title: Ciao, come stai?
    gloss: Hallo, wie geht's?
    note: Die lockere, informelle Begrüßung mit Frage – unter Freunden, Mitschülern oder Gleichaltrigen.
  it.a1.unit01.lesson01.teach.buongiorno_come_sta:
    title: Buongiorno, come sta?
    gloss: Guten Morgen, wie geht es Ihnen?
    note: Das formelle Gegenstück, für Personen, die man respektvoll anspricht, etwa den Vorgesetzten eines neuen Kollegen.
  it.a1.unit01.lesson01.teach.register_rule:
    title: 'tu: informale · Lei: formale o rispettoso'
    gloss: 'tu: informell · Lei: formell oder respektvoll'
    note: '*tu* ist das alltägliche „du“ unter Freunden, Mitschülern und Gleichaltrigen. *Lei* ist die höfliche Anrede („Sie“) für Fremde, in der Arbeitshierarchie oder bei der ersten Begegnung – sie hat eigene Verbformen (vergleichen Sie *tu stai* mit *Lei sta*).'
  it.a1.unit01.lesson02.teach.bene_grazie:
    title: Bene, grazie
    gloss: Gut, danke
    note: Eine einfache, neutrale Antwort auf „Wie geht es dir?“, die in beiden Registern passt, wenn man *e tu?* oder *e Lei?* ergänzt.
    example_gloss:
    - Gut, danke, und dir?
    - Gut, danke, und Ihnen?
  it.a1.unit01.lesson02.teach.e_tu:
    title: E tu?
    gloss: Und dir? (informell)
    note: So gibt man die Frage informell an einen Freund oder Gleichaltrigen zurück.
  it.a1.unit01.lesson02.teach.e_lei:
    title: E Lei?
    gloss: Und Ihnen? (formell)
    note: So gibt man die Frage formell zurück, passend zum Register von *Lei*.
  it.a1.unit01.lesson02.teach.bene_grazie_e_tu:
    title: Bene, grazie, e tu?
    gloss: Gut, danke, und dir?
    note: Die vollständige informelle Antwort mit Rückfrage, an einen Freund oder Gleichaltrigen gerichtet.
  it.a1.unit01.lesson02.teach.bene_grazie_e_lei:
    title: Bene, grazie, e Lei?
    gloss: Gut, danke, und dir?
    note: Die vollständige formelle Antwort mit Rückfrage, an eine Person gerichtet, die man respektvoll anspricht.
  it.a1.unit01.lesson02.teach.buonasera_buonanotte:
    title: Buonasera, Buonanotte
    gloss: guten Abend, gute Nacht
    note: '*Buonasera* ist ein Gruß, wenn man abends irgendwo ankommt. *Buonanotte* ist ein Abschiedsgruß, wenn jemand schlafen geht oder den Tag beendet – als Begrüßung wird es nie verwendet.'
    example_gloss:
    - Guten Abend, wie geht's?
    - Gute Nacht, bis morgen.
  it.a1.unit01.lesson02.teach.arrivederla:
    title: Arrivederla, a domani.
    gloss: Auf Wiedersehen, bis morgen.
    note: '*Arrivederla* ist der formelle Abschied mit *Lei*, passend für den Arbeitsplatz oder gegenüber Fremden.'
  it.a1.unit01.lesson02.teach.ci_vediamo:
    title: Ciao, ci vediamo domani!
    gloss: Tschüss, bis morgen!
    note: Der lockere Abschied unter Freunden und Gleichaltrigen, die man am nächsten Tag wiedersieht.
  it.a1.unit01.lesson03.teach.come_si_chiama:
    title: Come si chiama, scusi?
    gloss: Entschuldigung, wie heißen Sie? (formell)
    note: '*Come si chiama?* fragt wörtlich „wie nennen Sie sich“ im formellen Register von *Lei*; mit *scusi* („Entschuldigung“) klingt die Frage an einen Fremden besonders höflich.'
  it.a1.unit01.lesson03.teach.come_ti_chiami:
    title: Come ti chiami?
    gloss: Wie heißt du? (informell)
    note: Die informelle Version, für Freunde, Gleichaltrige oder Personen in Ihrem Alter.
  it.a1.unit01.lesson03.teach.mi_chiamo_elena:
    title: Mi chiamo Elena.
    gloss: Ich heiße Elena.
    note: '*chiamarsi* bedeutet wörtlich „sich nennen“ – so sagt man in beiden Registern seinen Namen.'
  it.a1.unit01.lesson03.teach.io_sono_sam:
    title: Io sono Sam.
    gloss: Ich bin Sam.
    note: Eine einfache Alternative zu *mi chiamo* mit *essere* („sein“) und direkt dem Namen.
  it.a1.unit01.lesson03.teach.piacere:
    title: Piacere, Piacere di conoscerla
    gloss: freut mich, sehr erfreut (formell)
    note: '*Piacere* allein ist eine kurze, gängige Art, „freut mich“ zu sagen, in beiden Registern. *Piacere di conoscerla* ist die ausführlichere, formelle Version mit *Lei*.'
    example_gloss:
    - Freut mich, Sam!
    - Sehr erfreut, Frau Elena.
  it.a1.unit01.lesson03.teach.benvenuto:
    title: Benvenuto in ufficio!
    gloss: Willkommen im Büro!
    note: '*Benvenuto* ist die männliche Form von „willkommen“ (für einen Mann; eine Frau begrüßt man mit *Benvenuta*).'
  it.a1.unit01.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: Vielen Dank.
    note: Eine stärkere, nachdrücklichere Art zu danken als ein einfaches *Grazie*.
