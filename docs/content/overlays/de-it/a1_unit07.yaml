teaching:
  it.a1.unit07.lesson01.teach.caffe_cornetto:
    title: il caffè, il cornetto
    gloss: der Kaffee, das Croissant
    note: 'Beide Nomen sind maskulin (*il*): *caffè* ist der übliche italienische Espresso, *cornetto* das typische Frühstücksgebäck.'
    example_gloss:
    - Ich möchte bitte einen Kaffee.
    - Ich möchte bitte ein Croissant.
  it.a1.unit07.lesson01.teach.panino_acqua:
    title: il panino, l'acqua
    gloss: das Sandwich, das Wasser
    note: '*panino* ist maskulin (*il*); *acqua* ist feminin, steht aber vor einem Vokal mit *l''*.'
    example_gloss:
    - Ich möchte bitte ein Sandwich.
    - Ich möchte bitte ein Wasser.
  it.a1.unit07.lesson01.teach.cosa_desidera:
    title: Cosa desidera?
    gloss: Was möchten Sie?
    note: Die höfliche Frage in der *Lei*-Form, die ein Barista einem Gast stellt.
  it.a1.unit07.lesson01.teach.vorrei_un_caffe:
    title: Vorrei un caffè e un cornetto, per favore.
    gloss: Ich möchte bitte einen Kaffee und ein Croissant.
    note: '*Vorrei* (ich möchte) ist die höfliche Art zu bestellen; mit *e* (und) fügt man ein zweites Produkt hinzu.'
  it.a1.unit07.lesson02.teach.vorrei_due_caffe:
    title: Vorrei due caffè, per favore.
    gloss: Ich möchte bitte zwei Kaffee.
    note: '*due* (zwei) steht anstelle des Artikels, wenn man mehr als eines bestellt.'
  it.a1.unit07.lesson02.teach.per_lei:
    title: E per Lei?
    gloss: Und für Sie?
    note: '*E per Lei?* fragt den zweiten Gast in der höflichen *Lei*-Form, was er möchte.'
  it.a1.unit07.lesson02.teach.basta_cosi:
    title: Basta così, grazie.
    gloss: Das ist alles, danke.
    note: Die übliche Art, eine Bestellung abzuschließen, wenn man nichts mehr möchte.
  it.a1.unit07.lesson03.teach.il_menu_il_conto:
    title: il menù, il conto
    gloss: die Speisekarte, die Rechnung
    note: Beide Nomen sind maskulin (*il*).
    example_gloss:
    - Die Rechnung, bitte.
  it.a1.unit07.lesson03.teach.panino_acqua_conto:
    title: Un panino e un'acqua, per favore.
    gloss: Ein Sandwich und ein Wasser, bitte.
    note: '*un''acqua* verwendet vor dem mit Vokal beginnenden *acqua* die Form von *una* mit Apostroph.'
