course:
  title: Italienisch A1
  description: 'Italienisch für Anfänger zum Thema Freizeitaktivitäten: Hobbywortschatz, Häufigkeitsausdrücke, Fragen und Antworten dazu, was jemand in der Freizeit macht, und der Vergleich der Hobbys zweier Personen.'
