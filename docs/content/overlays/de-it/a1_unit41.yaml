    title: Ein gemeinsames Wochenende planen
teaching:
  it.a1.unit41.lesson01.teach.leggere_fare_sport:
    title: Lesen, Sport, Kochen
    gloss: lesen, Sport treiben, kochen
    note: 'Drei häufige Hobbyverben im Infinitiv: *leggere* (lesen), *fare sport* (Sport treiben) und *cucinare* (kochen). Italienische Infinitive enden auf -are, -ere oder -ire.'
    example_gloss:
    - Ich lese gern ein Buch.
    - Ich treibe samstags Sport.
    - Ich koche gern für Freunde.
  it.a1.unit41.lesson01.teach.il_tempo_libero:
    title: Freizeit
    gloss: Freizeit
    note: '*Il tempo libero* ist ein maskulines Nomen, daher steht *il* davor. Es ist der Schlüsselausdruck, um über Hobbys zu sprechen.'
    example_gloss: In meiner Freizeit lese ich gern.
  it.a1.unit41.lesson01.teach.nel_mio_tempo:
    title: Sagen, was man in der Freizeit macht
    gloss: In meiner Freizeit lese ich gern.
    note: '*Leggo* ist die *io*-Form von *leggere* (lesen). Das Subjektpronomen entfällt im Italienischen: Man sagt *Leggo*, nicht *Io leggo*.'
  it.a1.unit41.lesson02.teach.ascoltare_musica_disegnare:
    title: Musik, Zeichnen, Gaming
    gloss: Musik hören, zeichnen, Videospiele spielen
    note: 'Drei weitere Hobbys: *ascoltare musica* (Musik hören), *disegnare* (zeichnen) und *giocare ai videogiochi* (Videospiele spielen).'
    example_gloss:
    - Ich höre gern Musik.
    - Ich zeichne oft.
    - Ich spiele gern mit Freunden Videospiele.
  it.a1.unit41.lesson02.teach.ascolto_volentieri_musica:
    title: Sagen, dass man gern Musik hört
    gloss: Ich höre gern Musik.
    note: '*Ascoltare* wird direkt mit dem Objekt verbunden: *ascolto musica*, ohne Präposition dazwischen.'
  it.a1.unit41.lesson02.teach.gioco_volentieri_ai:
    title: Sagen, dass man gern mit Freunden Videospiele spielt
    gloss: Ich spiele gern mit Freunden Videospiele.
    note: '*Con gli amici* bedeutet „mit Freunden“. *Gli* ist der Pluralartikel vor einem maskulinen Nomen, das mit einem Vokal beginnt.'
  it.a1.unit41.lesson03.teach.sempre_spesso_a:
    title: Immer, oft, manchmal, nie
    gloss: immer, oft, manchmal, nie
    note: 'Vier Häufigkeitswörter. *Mai* (nie) verlangt *non* vor dem Verb: *non gioco mai*.'
    example_gloss:
    - Ich treibe immer samstags Sport.
    - Ich lese oft ein Buch.
    - Ich zeichne manchmal.
    - Ich spiele nie Videospiele.
  it.a1.unit41.lesson03.teach.ogni_settimana_ogni:
    title: Jede Woche, jedes Wochenende
    gloss: jede Woche, jedes Wochenende
    note: '*Ogni* (jede/jeden/jedes) bleibt immer gleich: *ogni settimana*, *ogni fine settimana*. Siehe die nächste Karte.'
    example_gloss:
    - Ich koche jede Woche für Freunde.
    - Ich treibe jedes Wochenende Sport.
  it.a1.unit41.lesson03.teach.con_mai_il:
    title: Mai braucht non; ogni bleibt unverändert
    gloss: 'Mit mai steht beim Verb auch non: Non gioco mai. Ogni bleibt bei jedem Nomen gleich: ogni settimana, ogni fine settimana.'
    note: 'Im Deutschen sagt man „ich spiele nie“, im Italienischen heißt es *non gioco mai* (wörtlich: „ich spiele nicht nie“). Nach *ogni* steht immer ein Nomen im Singular.'
  it.a1.unit41.lesson03.teach.cosa_fai_nel:
    title: Nach der Freizeit fragen
    gloss: Was machst du in deiner Freizeit?
    note: Das ist die Kernfrage dieser Lektion – mit ihr können Sie jeden nach seinen Hobbys fragen.
  it.a1.unit41.lesson04.teach.giulia_passeggiamo_spesso:
    title: Giulia spricht über Hobbys
    gloss: 'Giulia: Wir gehen oft zusammen spazieren. Aber was machst du sonst noch in deiner Freizeit, Marco?'
    note: '*Passeggiamo* ist die *noi*-Form (wir) von *passeggiare*. *Spesso* steht nach dem Verb.'
  it.a1.unit41.lesson04.teach.marco_cucino_volentieri:
    title: Marcos Hobbys
    gloss: 'Marco: Ich koche gern, auch zu Hause. Und ich treibe oft Sport.'
    note: '*Anche a casa* (auch zu Hause) zeigt, dass Marco aus Spaß kocht, nicht nur bei der Arbeit. *A casa* bedeutet „zu Hause“, ohne Artikel.'
  it.a1.unit41.lesson04.teach.giulia_cucini_anche:
    title: Giulia ist überrascht
    gloss: 'Giulia: Du kochst auch zu Hause? Du kochst doch schon den ganzen Tag bei der Arbeit!'
    note: '*Già* (schon) und *tutto il giorno* (den ganzen Tag) zeigen, wie viel Marco bei der Arbeit ohnehin schon kocht.'
  it.a1.unit41.lesson04.teach.marco_si_ma:
    title: Marco erklärt
    gloss: 'Marco: Ja, aber Kochen entspannt mich. Und du, was machst du gern?'
    note: '*Cucinare mi rilassa* bedeutet wörtlich „Kochen entspannt mich“: Die Tätigkeit ist das Subjekt und *mi* (mich) das Objekt.'
  it.a1.unit41.lesson04.teach.giulia_leggo_volentieri:
    title: Giulias Hobbys
    gloss: 'Giulia: Ich lese gern und höre oft Musik.'
    note: 'Zwei Hobbys, mit *e* (und) verbunden. Beide Verben stehen in der *io*-Form: *leggo* und *ascolto*.'
  it.a1.unit41.lesson04.teach.marco_giochi_anche:
    title: Marco fragt nach dem Gaming
    gloss: 'Marco: Spielst du auch Videospiele?'
    note: 'Eine Ja-/Nein-Frage behält die Satzstellung der Aussage, nur die Intonation steigt: *Giochi anche ai videogiochi?* *Anche* bedeutet „auch“.'
  it.a1.unit41.lesson04.teach.giulia_no_non:
    title: Giulia antwortet
    gloss: 'Giulia: Nein, ich spiele nie Videospiele. Aber ich zeichne manchmal!'
    note: '*Non ... mai* (nie) und *a volte* (manchmal) stehen in einer Antwort im Kontrast. *Ma* bedeutet „aber“.'
  it.a1.unit41.lesson05.teach.marco_e_io:
    title: Hobbys im Vergleich
    gloss: Marco und ich gehen oft zusammen spazieren. Aber wir haben auch andere Hobbys. Marco kocht gern, auch zu Hause, und treibt oft Sport. Ich lese gern und höre oft Musik. Ich zeichne manchmal, aber ich spiele nie Videospiele. Was machst du gern in deiner Freizeit?
    note: Giulias Nachricht fasst die bisherigen Informationen zusammen und endet mit der Kernfrage der Lektion an den Leser.
    glosses:
      passeggiamo: wir gehen spazieren
      spesso: oft
      insieme: zusammen
      altri: andere
      cucina: kocht
      volentieri: gern
      casa: Haus (a casa = zu Hause)
      sport: Sport (fa sport = treibt Sport)
      leggo: lesen
      ascolto: hören
      musica: Musik
      disegno: zeichne
      volte: Mal (a volte = manchmal)
      videogiochi: Videospiele
      mai: nie
      libero: frei
      tempo: Zeit
  it.a1.unit41.lesson06.teach.marco_cosa_fai:
    title: Marco fragt nach dem Wochenende
    gloss: 'Marco: Was machst du dieses Wochenende?'
    note: '*Questo fine settimana* (dieses Wochenende) ist maskulin, deshalb heißt es *questo*. *Fai* ist die *tu*-Form von *fare* (machen).'
  it.a1.unit41.lesson06.teach.giulia_non_lo:
    title: Giulia ist unentschlossen
    gloss: 'Giulia: Ich weiß es noch nicht. Ich lese gern, aber ich möchte auch rausgehen.'
    note: '*Non lo so ancora* (ich weiß es noch nicht): *lo* steht für das, was man nicht weiß, und steht vor dem Verb. *Uscire* bedeutet „ausgehen, rausgehen“.'
  it.a1.unit41.lesson06.teach.marco_facciamo_una:
    title: Marco macht einen Vorschlag
    gloss: 'Marco: Machen wir zusammen einen Spaziergang? Danach koche ich für uns.'
    note: '*Poi* (dann, danach) bringt die Pläne in eine Reihenfolge. *Cucino io* (mit *io* nach dem Verb) betont „ich koche“.'
  it.a1.unit41.lesson06.teach.giulia_buona_idea:
    title: Giulia stimmt zu
    gloss: 'Giulia: Gute Idee! Ich mag sowohl Spazierengehen als auch Kochen.'
    note: '*Sia ... sia ...* bedeutet „sowohl ... als auch ...“: *mi piace sia passeggiare sia cucinare*.'
  it.a1.unit41.lesson06.teach.marco_perfetto_allora:
    title: Marco bestätigt
    gloss: 'Marco: Perfekt. Dann sehen wir uns Samstag!'
    note: '*Ci vediamo sabato* (bis Samstag): Vor dem Wochentag steht kein Artikel, wenn der kommende gemeint ist.'
