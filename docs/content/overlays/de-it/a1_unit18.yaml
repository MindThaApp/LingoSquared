teaching:
  it.a1.unit18.lesson01.teach.la_cucina_il_soggiorno:
    title: la cucina, il soggiorno
    gloss: die Küche, das Wohnzimmer
    note: '*la cucina* (Küche) ist feminin; *il soggiorno* (Wohnzimmer) ist maskulin.'
    example_gloss:
    - Die Küche ist groß.
    - Das Wohnzimmer ist gemütlich.
  it.a1.unit18.lesson01.teach.la_camera_da_letto_il_bagno:
    title: la camera da letto, il bagno
    gloss: das Schlafzimmer, das Badezimmer
    note: '*la camera da letto* heißt wörtlich „das Zimmer für das Bett“ (*letto* = Bett); *il bagno* ist das Badezimmer.'
    example_gloss:
    - Das Schlafzimmer ist klein.
    - Das Badezimmer ist sauber.
  it.a1.unit18.lesson01.teach.questa_e_la_mia_casa:
    title: Questa è la mia casa.
    gloss: Das ist mein Haus.
    note: '*Questa* (diese, feminin) richtet sich nach *casa* (Haus), das im Italienischen feminin ist.'
  it.a1.unit18.lesson01.teach.ci_sono_quattro_stanze:
    title: Ci sono quattro stanze.
    gloss: Es gibt vier Zimmer.
    note: '*Ci sono* (es gibt) steht mit einer Zahl und *stanze* (Zimmer); *quattro* (vier) wurde in Lektion 3 gelernt.'
  it.a1.unit18.lesson02.teach.il_letto_il_tavolo:
    title: il letto, il tavolo
    gloss: das Bett, der Tisch
    note: '*il letto* (Bett) und *il tavolo* (Tisch) sind beide maskulin.'
    example_gloss:
    - Das Bett ist im Schlafzimmer.
    - Der Tisch ist in der Küche.
  it.a1.unit18.lesson02.teach.la_sedia_il_divano:
    title: la sedia, il divano
    gloss: der Stuhl, das Sofa
    note: '*la sedia* (Stuhl) ist feminin; *il divano* (Sofa) ist maskulin.'
    example_gloss:
    - Der Stuhl ist nahe beim Tisch.
    - Das Sofa ist im Wohnzimmer.
  it.a1.unit18.lesson02.teach.il_letto_e_nella_camera_da_letto:
    title: Il letto è nella camera da letto.
    gloss: Das Bett ist im Schlafzimmer.
    note: '*nella* verbindet *in* + *la* zu „in der“.'
  it.a1.unit18.lesson02.teach.il_divano_e_nel_soggiorno:
    title: Il divano è nel soggiorno.
    gloss: Das Sofa ist im Wohnzimmer.
    note: '*nel* verbindet *in* + *il* (maskulin) zu „im“.'
  it.a1.unit18.lesson03.teach.vicino_a_davanti:
    title: vicino a, davanti a
    gloss: nahe bei, vor
    note: Beide sind zweiteilige Präpositionen, die auf *a* enden und mit einem folgenden Artikel verschmelzen (*al*, *alla*).
    example_gloss:
    - Der Stuhl ist nahe beim Tisch.
    - Das Bett steht vor dem Fenster.
  it.a1.unit18.lesson03.teach.dietro_sopra_sotto:
    title: dietro, sopra, sotto
    gloss: hinter, über / auf, unter
    note: 'Drei weitere Ortsangaben: *dietro* (hinter), *sopra* (über/auf), *sotto* (unter) – keines davon braucht ein *a* vor dem Artikel.'
    example_gloss:
    - Das Sofa steht hinter dem Tisch.
    - Das Buch liegt auf dem Tisch.
    - Die Katze ist unter dem Bett.
  it.a1.unit18.lesson03.teach.dove_il_letto:
    title: Dov'è il letto?
    gloss: Wo ist das Bett?
    note: '*Dov''è* ist die Verkürzung von *dove* (wo) + *è* (ist).'
  it.a1.unit18.lesson03.teach.il_letto_e_vicino_alla_finestra:
    title: Il letto è vicino alla finestra.
    gloss: Das Bett ist nahe beim Fenster.
    note: '*vicino alla finestra* besteht aus *vicino a* + *la finestra* (das Fenster), zu *alla* verschmolzen.'
