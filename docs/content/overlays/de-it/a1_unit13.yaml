teaching:
  it.a1.unit13.lesson01.teach.ieri_stamattina:
    title: ieri, stamattina
    gloss: gestern, heute Morgen
    note: '*ieri* (gestern) und *stamattina* (heute Morgen) sind die beiden Zeitangaben, mit denen man von kürzlich Geschehenem erzählt.'
    example_gloss:
    - Gestern war ich zu Hause.
  it.a1.unit13.lesson01.teach.sono_andato:
    title: sono andato, sono andata
    gloss: ich bin gegangen (männlich), ich bin gegangen (weiblich)
    note: '*sono andato/andata* ist das passato prossimo von *andare* mit dem Hilfsverb *essere*; das Partizip richtet sich nach dem Geschlecht des Subjekts.'
    example_gloss:
    - Heute Morgen bin ich zur Arbeit gegangen.
  it.a1.unit13.lesson01.teach.sono_andato_al_cinema_ieri:
    title: Sono andato al cinema ieri.
    gloss: Ich bin gestern ins Kino gegangen.
    note: '*Sono andato* (ein Mann spricht) plus *al cinema* (ins Kino) plus *ieri* (gestern) beschreibt ein abgeschlossenes Ereignis in der Vergangenheit.'
  it.a1.unit13.lesson01.teach.ho_visto_un_bel_film:
    title: Ho visto un bel film!
    gloss: Ich habe einen schönen Film gesehen!
    note: '*Ho visto* wird mit dem Hilfsverb *avere* und dem unregelmäßigen Partizip *visto* (von *vedere*, sehen) gebildet.'
  it.a1.unit13.lesson02.teach.ho_mangiato_un_panino:
    title: Ho mangiato un panino a pranzo.
    gloss: Ich habe mittags ein Sandwich gegessen.
    note: '*Ho mangiato* besteht aus *avere* und dem regelmäßigen Partizip *mangiato* (von *mangiare*, essen); *a pranzo* bedeutet „mittags“.'
  it.a1.unit13.lesson02.teach.cosa_hai_fatto_ieri:
    title: Cosa hai fatto ieri?
    gloss: Was hast du gestern gemacht?
    note: '*hai fatto* ist das passato prossimo von *fare* (machen) und fragt hier nach einem kürzlich vergangenen Ereignis.'
    example_gloss:
    - Was hast du heute Morgen gemacht?
  it.a1.unit13.lesson02.teach.ieri_sera:
    title: ieri sera
    gloss: gestern Abend
    note: '*ieri sera* verbindet *ieri* (gestern) mit *sera* (Abend) und nennt so einen bestimmten Zeitpunkt in der Vergangenheit.'
    example_gloss:
    - Ich bin gestern Abend ins Kino gegangen.
  it.a1.unit13.lesson03.teach.sono_andata_al_lavoro:
    title: Stamattina sono andata al lavoro, come sempre.
    gloss: Heute Morgen bin ich wie immer zur Arbeit gegangen.
    note: '*sono andata* (eine Frau spricht) plus *come sempre* (wie immer) beschreibt eine gewohnte Handlung in der Vergangenheit.'
  it.a1.unit13.lesson03.teach.e_tu_cosa_hai_fatto:
    title: E tu, cosa hai fatto stamattina?
    gloss: Und du, was hast du heute Morgen gemacht?
    note: '*E tu* (und du) gibt die Frage an das Gegenüber zurück.'
    example_gloss:
    - Und du, was hast du gestern Abend gemacht?
