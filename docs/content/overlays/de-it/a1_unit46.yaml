      chiama: ruft an
      ogni: jeder
      giorno: Tag
      usa: benutzt
      telefono: Handy
      app: App
      computer: Computer
      casa: zu Hause (a casa = zu Hause)
      internet: Internet
      cerca: schaut nach
      mattina: Morgen
