  it.a1.unit46.lesson06.teach.giulia_vedo_il:
    title: Giulia bestätigt den Plan
    gloss: 'Giulia: Ich sehe die Nachricht. Machen wir am Samstag um zehn im Park Sport?'
  it.a1.unit46.lesson06.teach.marco_si_e:
    title: Marco bestätigt das Wetter
    gloss: 'Marco: Ja, und am Samstag scheint die Sonne!'
  it.a1.unit46.lesson06.teach.luca_io_corro:
    title: Lucas Plan
    gloss: 'Luca: Ich laufe. Danach spiele ich auch Fußball.'
    note: '*Poi* (danach) bringt die Handlungen in eine Reihenfolge. *Gioco a calcio*: *giocare a* + Sportart.'
  it.a1.unit46.lesson06.teach.chiara_io_preferisco:
    title: Chiaras Plan
    gloss: 'Chiara: Ich schwimme lieber, aber ich komme auch in den Park.'
    note: '*Preferisco nuotare* (ich schwimme lieber) ist die direkte Art, eine Vorliebe zu nennen. *Anch''io* (ich auch) ist ein einziges Wort mit Apostroph.'
  it.a1.unit46.lesson06.teach.giulia_bello_a:
    title: Giulia beendet das Gespräch
    gloss: 'Giulia: Schön! Bis Samstag im Park!'
    note: Schließt in einer Zeile den Nachrichtenverlauf dieser Lektion und den Plan aus der Sport-Lektion ab.
