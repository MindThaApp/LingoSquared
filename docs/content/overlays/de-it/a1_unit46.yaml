    gloss: nachschauen; suchen
    example_gloss: Ich schaue die Wettervorhersage nach.
  it.a1.unit46.lesson03.teach.cercare_e_un:
    title: Cercare und usare sind regelmäßig
    gloss: 'Cercare und usare sind regelmäßige Verben auf -are: io cerco, tu cerchi; io uso, tu usi. Bei cercare kommt vor dem i ein h hinzu.'
    note: 'Das h in *cerchi* bewahrt den harten c-Laut: Vergleichen Sie *cerco* (io) und *cerchi* (tu).'
  it.a1.unit46.lesson03.teach.luca_cerca_le:
    title: Luca sucht die Wettervorhersage
    gloss: Luca sucht die Wettervorhersage.
  it.a1.unit46.lesson03.teach.poi_va_a:
    title: Danach geht er joggen
    gloss: Danach geht er joggen.
    note: '*Poi va a correre*: *andare a* + Infinitiv bedeutet, dass man hingeht, um etwas zu tun. *Va* kommt von *andare*.'
  it.a1.unit46.lesson04.teach.giulia_facciamo_sport:
    title: Giulia macht einen Vorschlag
    gloss: 'Giulia: Machen wir am Samstag um zehn Sport?'
  it.a1.unit46.lesson04.teach.marco_buona_idea:
    title: Marco sagt zu
    gloss: 'Marco: Gute Idee! Ich suche die Wettervorhersage.'
    note: '*Buona idea!* steht in der weiblichen Form *buona*, weil *idea* weiblich ist. *Cerco* ist die *io*-Form von *cercare*.'
  it.a1.unit46.lesson04.teach.marco_sabato_c:
    title: Marco prüft das Wetter
    gloss: 'Marco: Am Samstag scheint die Sonne!'
    note: '*C''è il sole* (die Sonne scheint) heißt wörtlich „da ist die Sonne“. *C''è* ist *ci è*.'
  it.a1.unit46.lesson04.teach.luca_vedo_il:
    title: Luca sieht die Nachricht
    gloss: 'Luca: Ich sehe die Nachricht. Bis Samstag!'
  it.a1.unit46.lesson04.teach.conosci_gia_arrivederci:
    title: A + Wochentag
    gloss: 'Arrivederci! kennen Sie schon. Sie können auch einen Tag nennen: A sabato!, A domani!'
    note: Überträgt das Verabschiedungsmuster aus der Begrüßungs-Lektion auf einen bestimmten Tag.
  it.a1.unit46.lesson05.teach.giulia_chiama_marco:
    title: Wer nutzt was?
    gloss: Giulia ruft Marco jeden Tag an. Sie benutzt das Telefon und keine App. Marco hat zu Hause keinen Computer, aber er nutzt das Internet auf dem Telefon. Luca sucht jeden Morgen die Wettervorhersage. Dann geht er joggen. Chiara schickt Giulia oft eine Nachricht. Benutzt du dein Telefon auch jeden Tag?
    note: Vergleicht die Gewohnheiten aller vier Figuren mit Geräten, ähnlich wie der Vergleichstext in der Sport-Lektion.
