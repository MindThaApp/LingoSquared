    title: 'Messaggio: senden oder lesen'
    gloss: Le previsioni del tempo kennen Sie schon. Eine Nachricht kann man senden (io mando, lui manda) oder lesen (io leggo, lui legge).
    note: Verbindet das neue Wort mit dem bereits gelernten zusammengesetzten Nomen aus der Wetter-Lektion.
  it.a1.unit46.lesson02.teach.giulia_manda_un:
    title: Giulia schickt eine Nachricht über die App
    gloss: Giulia schickt eine Nachricht über die App.
