teaching:
  it.a1.unit10.lesson01.teach.a_destra_a_sinistra:
    title: a destra, a sinistra
    gloss: nach rechts, nach links
    note: '*a destra* (nach rechts) und *a sinistra* (nach links) sind die beiden grundlegenden Richtungsangaben zum Abbiegen.'
    example_gloss:
    - Biegen Sie bitte rechts ab.
  it.a1.unit10.lesson01.teach.sempre_dritto_incrocio:
    title: sempre dritto, all'incrocio
    gloss: geradeaus, an der Kreuzung
    note: '*sempre dritto* (geradeaus) und *all''incrocio* (an der Kreuzung) beschreiben, wie und wo man abbiegt.'
    example_gloss:
    - Gehen Sie geradeaus bis zur Kreuzung.
  it.a1.unit10.lesson01.teach.scusi_come_arrivo_al_museo:
    title: Scusi, come arrivo al museo?
    gloss: Entschuldigung, wie komme ich zum Museum?
    note: '*Scusi* (Entschuldigen Sie, höfliche Form) eröffnet die Frage vor *come arrivo* (wie komme ich) plus Ziel.'
  it.a1.unit10.lesson01.teach.vada_sempre_dritto:
    title: Vada sempre dritto, poi giri a destra all'incrocio.
    gloss: Gehen Sie immer geradeaus und biegen Sie dann an der Kreuzung rechts ab.
    note: '*Vada* und *giri* sind Imperative der Höflichkeitsform (Lei), also die höfliche Art, wie man Fremden den Weg erklärt.'
  it.a1.unit10.lesson02.teach.e_lontano_da_qui:
    title: È lontano da qui?
    gloss: Ist es weit von hier?
    note: '*È lontano* (ist es weit) plus *da qui* (von hier) fragt nach der Entfernung.'
  it.a1.unit10.lesson02.teach.no_cinque_minuti:
    title: No, sono solo cinque minuti a piedi.
    gloss: Nein, es sind nur fünf Minuten zu Fuß.
    note: '*a piedi* (zu Fuß) gibt an, wie die Entfernung zurückgelegt wird.'
  it.a1.unit10.lesson02.teach.molto_gentile:
    title: Grazie mille, molto gentile.
    gloss: Vielen Dank, sehr freundlich.
    note: '*molto gentile* (sehr freundlich) verleiht dem Dank für eine Hilfe Wärme.'
    example_gloss:
    - Sehr freundlich, nochmals danke.
  it.a1.unit10.lesson03.teach.vada_giri_continui:
    title: Vada, giri, continui.
    gloss: Gehen Sie, biegen Sie ab, gehen Sie weiter.
    note: Drei Verben im Imperativ der Höflichkeitsform (Lei), die bei Wegbeschreibungen oft zusammen vorkommen.
  it.a1.unit10.lesson03.teach.dove_e_il_museo:
    title: Dov'è il museo?
    gloss: Wo ist das Museum?
    note: '*Dov''è* (wo ist) mit folgendem Substantiv fragt nach dem Ort von etwas.'
    example_gloss:
    - Das Museum ist weit von hier.
