course:
  title: Italienisch A1
  description: 'Italienisch für Anfänger, um über Haustiere und gängige Tiere zu sprechen: sie benennen, grundlegende Pflege (Gassi gehen, füttern, spielen), sagen, welche Tiere man liebt, auch ohne eines zu besitzen, und der italienische Plural.'
