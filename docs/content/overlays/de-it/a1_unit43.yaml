teaching:
  it.a1.unit43.lesson01.teach.l_animale_un:
    title: Tier, Haustier
    gloss: das Tier / ein Haustier
    note: '*Animale* ist das allgemeine Wort; *animale domestico* bedeutet Haustier (wörtlich: domestiziertes Tier).'
    example_gloss:
    - Ein Hund ist ein Tier.
    - Ein Hund ist auch ein Haustier.
  it.a1.unit43.lesson01.teach.il_cane_il:
    title: Hund und Katze
    gloss: der Hund / die Katze
    example_gloss:
    - Giulia hat einen Hund.
    - Luca hat eine Katze.
  it.a1.unit43.lesson01.teach.il_pesce_l:
    title: Fisch und Vogel
    gloss: der Fisch / der Vogel
    example_gloss:
    - Opa hat einen Fisch.
    - Nina hat einen Vogel.
  it.a1.unit43.lesson01.teach.hai_un_animale:
    title: Hast du ein Haustier?
    gloss: Hast du ein Haustier?
    note: '*Hai ...?* ist die *tu*-Form von *avere*. Nur die Intonation macht aus der Aussage eine Frage.'
  it.a1.unit43.lesson01.teach.si_ho_un:
    title: Ja, ich habe einen Hund
    gloss: Ja, ich habe einen Hund.
    note: Eine einfache bejahende Antwort mit dem neuen Wortschatz dieser Lektion.
  it.a1.unit43.lesson01.teach.no_non_ho:
    title: Nein, ich habe kein Haustier
    gloss: Nein, ich habe kein Haustier.
    note: 'Um zu sagen, dass Sie etwas nicht haben, setzen Sie *non* vor das Verb: *non ho*. Siehe Grammatikhinweis.'
  it.a1.unit43.lesson01.teach.per_dire_che:
    title: Non vor dem Verb
    gloss: 'Um zu sagen, dass Sie etwas nicht haben, setzen Sie non vor das Verb: Non ho tempo, Non ho animali domestici.'
    note: 'Nach *non ho* steht das Nomen meist ohne Artikel: *non ho tempo*, *non ho animali*. Ähnlich wie im Deutschen mit „keine“ oder „kein“ entfällt der Artikel.'
  it.a1.unit43.lesson02.teach.portare_a_spasso:
    title: (Ein Tier) ausführen
    gloss: (ein Tier) ausführen, mit dem Hund rausgehen
    note: '*Portare a spasso* ist eine feste Wendung für „ein Tier ausführen“. Das Pronomen steht vor dem Verb: *lo porto a spasso*.'
    example_gloss: Ich gehe jeden Tag mit dem Hund spazieren.
  it.a1.unit43.lesson02.teach.il_pronome_lo:
    title: Pronomen stehen vor dem Verb
    gloss: 'Das Pronomen lo ersetzt den Hund und steht vor dem Verb: lo porto a spasso, gli do da mangiare.'
    note: 'Im Italienischen stehen *lo* und *gli* vor dem konjugierten Verb: *lo porto*, *gli do*. Im Deutschen steht das Pronomen dagegen meist nach dem Verb („ich führe ihn aus“).'
  it.a1.unit43.lesson02.teach.dare_da_mangiare:
    title: Füttern
    gloss: füttern
    example_gloss: Ich füttere jeden Tag die Katze.
  it.a1.unit43.lesson02.teach.giocare_con:
    title: Spielen mit
    gloss: spielen mit
    example_gloss: Luca spielt mit seiner Katze.
  it.a1.unit43.lesson02.teach.porto_a_spasso:
    title: Ich gehe jeden Tag mit dem Hund spazieren
    gloss: Ich gehe jeden Tag mit dem Hund spazieren.
    note: '*Ogni giorno* (jeden Tag) steht am Satzende, wie in *porto a spasso il cane ogni giorno*.'
  it.a1.unit43.lesson02.teach.do_da_mangiare:
    title: Ich füttere jeden Tag die Katze
    gloss: Ich füttere jeden Tag die Katze.
    note: '*Dare da mangiare* (füttern) heißt wörtlich „zu essen geben“. *Do* ist die *io*-Form von *dare*.'
  it.a1.unit43.lesson03.teach.il_plurale_cambia:
    title: 'Plural: il cane -> i cani'
    gloss: 'Der Plural ändert den Endvokal und den Artikel: il cane -> i cani, il gatto -> i gatti, l''uccello -> gli uccelli, il pesce -> i pesci.'
    note: Das regelmäßige italienische Pluralmuster, hier zum ersten Mal mit Tiernamen als Beispielen eingeführt.
  it.a1.unit43.lesson03.teach.i_cani_i:
    title: Hunde und Katzen
    gloss: Hunde / Katzen
    example_gloss:
    - Marco liebt Hunde.
    - Chiara liebt Katzen.
  it.a1.unit43.lesson03.teach.i_pesci_gli:
    title: Fische und Vögel (Plural)
    gloss: Fische / Vögel
    example_gloss:
    - Ich liebe Fische.
    - Opa liebt Vögel.
  it.a1.unit43.lesson03.teach.amo_gli_animali:
    title: Ich liebe Tiere
    gloss: Ich liebe Tiere.
    note: '*Amare* (lieben) hat ein direktes Objekt: *amo gli animali*. Das Nomen im Plural braucht den Pluralartikel *gli*.'
  it.a1.unit43.lesson03.teach.chiara_ama_i:
    title: Chiara liebt Katzen, hat aber kein Haustier
    gloss: Chiara liebt Katzen, aber sie hat kein Haustier.
    note: Bereitet den Gegensatz vor, um den sich der Lesetext der Lektion dreht.
  it.a1.unit43.lesson04.teach.marco_hai_un:
    title: Marco fragt nach einem Haustier
    gloss: 'Marco: Hast du ein Haustier, Giulia?'
  it.a1.unit43.lesson04.teach.giulia_si_ho:
    title: Giulia hat einen Hund
    gloss: 'Giulia: Ja, ich habe einen Hund.'
  it.a1.unit43.lesson04.teach.marco_com_e:
    title: Marco fragt, wie er aussieht
    gloss: 'Marco: Wie ist er?'
    note: '*Com''è?* funktioniert auch für Tiere. Die Antwort enthält *è* oder *ha*: *è piccolo*, *ha il pelo castano*.'
  it.a1.unit43.lesson04.teach.giulia_ha_il:
    title: Giulia beschreibt ihren Hund
    gloss: 'Giulia: Er hat braunes Fell und ist klein.'
    note: Greift Wortschatz zu Haarfarbe und Größe aus der Lektion zum Aussehen wieder auf, hier für das Fell eines Tieres statt für die Haare eines Menschen.
  it.a1.unit43.lesson04.teach.un_animale_e:
    title: Tiere sind maskulin oder feminin
    gloss: 'Ein Tier ist maskulin oder feminin wie eine Person: il cane ist lui, la gatta ist lei.'
    note: 'Im Italienischen ist jedes Nomen maskulin oder feminin, ähnlich wie im Deutschen: Ein Hund ist *lui*, eine Katze ist *lei*, und die Pronomen richten sich danach (*lo*, *la*).'
  it.a1.unit43.lesson04.teach.marco_lo_porti:
    title: Marco fragt nach dem Spazierengehen
    gloss: 'Marco: Gehst du jeden Tag mit ihm spazieren?'
  it.a1.unit43.lesson04.teach.giulia_si_lo:
    title: Giulia beschreibt ihre Routine
    gloss: 'Giulia: Ja, ich gehe jeden Tag mit ihm spazieren und gebe ihm zu fressen.'
  it.a1.unit43.lesson05.teach.marco_e_chiara:
    title: Marco, Chiara und Luca über Tiere
    gloss: 'Marco und Chiara lieben beide Tiere, aber keiner von beiden hat ein Haustier. Marco liebt Hunde und Chiara liebt Katzen. Luca dagegen hat ein Haustier: eine Katze. Er spielt oft mit seiner Katze und füttert sie jeden Tag. Hast du ein Haustier?'
    note: Stellt gegenüber, ein Tier zu lieben und es wirklich zu besitzen – das ist der kommunikative Kern dieser Lektion.
    glosses:
      amano: lieben
      entrambi: beide
      animali: Tiere
      due: zwei (nessuno dei due = keiner von beiden)
      domestico: häuslich (animale domestico = Haustier)
      cani: Hunde
      gatti: Katzen
      gatto: Katze
      gioca: spielt
      dà: gibt
      ogni: jeder
      mangiare: essen (dare da mangiare = füttern)
  it.a1.unit43.lesson05.teach.luca_gioca_spesso:
    title: Luca spielt oft mit seiner Katze
    gloss: Luca spielt oft mit seiner Katze.
    note: '*Spesso* (oft) steht nach dem Verb: *gioca spesso*. *Giocare con* bedeutet „spielen mit“.'
  it.a1.unit43.lesson05.teach.amo_i_cani:
    title: Ich liebe Hunde. Ich habe kein Haustier.
    gloss: Ich liebe Hunde. Ich habe kein Haustier.
    note: Eine Muster-Antwort in zwei Sätzen, die Sie für die Schreibaufgabe der Lektion übernehmen können.
  it.a1.unit43.lesson06.teach.giulia_nina_hai:
    title: Giulia fragt Nina
    gloss: 'Giulia: Nina, hast du auch ein Haustier?'
  it.a1.unit43.lesson06.teach.nina_si_ho:
    title: Nina hat einen Vogel namens Pico
    gloss: 'Nina: Ja, ich habe einen Vogel. Er heißt Pico.'
    note: '*Si chiama Pico* bedeutet „Er heißt Pico“, wörtlich „er nennt sich Pico“.'
  it.a1.unit43.lesson06.teach.marco_che_bello:
    title: Marco reagiert
    gloss: 'Marco: Wie schön! Was machst du jeden Tag mit ihm?'
  it.a1.unit43.lesson06.teach.nina_gli_do:
    title: Nina füttert ihn jeden Tag
    gloss: 'Nina: Ich füttere ihn jeden Tag.'
  it.a1.unit43.lesson06.teach.marco_anch_io:
    title: Marco liebt auch Vögel
    gloss: 'Marco: Ich liebe auch Vögel.'
  it.a1.unit43.lesson06.teach.giulia_che_bello:
    title: Giulia beendet das Gespräch
    gloss: 'Giulia: Wie schön, dass wir drei Tiere lieben!'
    note: Ein Schlusssatz, der die Tierthemen aller drei Figuren zusammenfasst.
