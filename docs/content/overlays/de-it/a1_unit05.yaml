teaching:
  it.a1.unit05.lesson01.teach.che_ore_sono:
    title: Che ore sono?
    gloss: Wie spät ist es?
    note: Die Standardfrage nach der Uhrzeit im Italienischen; wörtlich „welche Stunden sind es“.
  it.a1.unit05.lesson01.teach.sono_le_tre:
    title: Sono le tre.
    gloss: Es ist drei Uhr.
    note: '*Sono le* + Zahl nennt die Uhrzeit für jede Stunde außer ein Uhr.'
  it.a1.unit05.lesson01.teach.ore_una_dodici:
    title: l'una, le due, le tre, le dodici
    gloss: ein Uhr, zwei Uhr, drei Uhr, zwölf Uhr
    note: Nur bei ein Uhr heißt es *è l'una* (Singular) statt *sono le* (Plural), weil „eins“ im Singular steht.
    example_gloss:
    - Es ist ein Uhr.
    - Es ist zwölf Uhr.
  it.a1.unit05.lesson01.teach.ore_quattro_sei:
    title: le quattro, le cinque, le sei
    gloss: vier Uhr, fünf Uhr, sechs Uhr
    note: Sie folgen demselben Muster *sono le* + Zahl wie bei drei Uhr.
    example_gloss:
    - Es ist vier Uhr.
    - Es ist sechs Uhr.
  it.a1.unit05.lesson02.teach.sono_le_tre_e_mezzo:
    title: Sono le tre e mezzo.
    gloss: Es ist drei Uhr dreißig.
    note: '*e mezzo* (und eine halbe) fügt der vollen Stunde dreißig Minuten hinzu.'
  it.a1.unit05.lesson02.teach.sono_le_tre_e_un_quarto:
    title: Sono le tre e un quarto.
    gloss: Es ist Viertel nach drei.
    note: '*e un quarto* (und ein Viertel) fügt der vollen Stunde fünfzehn Minuten hinzu.'
  it.a1.unit05.lesson02.teach.sono_le_quattro_meno_un_quarto:
    title: Sono le quattro meno un quarto.
    gloss: Es ist Viertel vor vier.
    note: '*meno un quarto* (minus ein Viertel) zählt von der NÄCHSTEN vollen Stunde zurück – wie im Deutschen bei „Viertel vor vier“.'
  it.a1.unit05.lesson03.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: Um wie viel Uhr wollen wir uns treffen?
    note: '*A che ora* fragt, um wie viel Uhr etwas stattfindet; *ci vediamo* bedeutet „wir sehen uns“.'
  it.a1.unit05.lesson03.teach.ci_vediamo_alle_tre_e_mezzo:
    title: Ci vediamo alle tre e mezzo.
    gloss: Wir treffen uns um drei Uhr dreißig.
    note: '*alle* (um die) steht vor einer bestimmten Uhrzeit, während *sono le* die Uhrzeit nur angibt.'
  it.a1.unit05.lesson03.teach.parti_del_giorno:
    title: di mattina, di pomeriggio, di sera
    gloss: morgens, nachmittags, abends
    note: Diese Wendungen geben an, zu welcher Tageszeit eine Uhrzeit gehört, da man im italienischen Alltag meist die 12-Stunden-Zählung verwendet.
    example_gloss:
    - Ist es ein Treffen am Morgen oder am Abend?
    - Es ist nachmittags, um drei Uhr dreißig.
  it.a1.unit05.lesson03.teach.e_di_pomeriggio:
    title: È di pomeriggio, alle tre e mezzo.
    gloss: Es ist nachmittags, um drei Uhr dreißig.
    note: Verbindet die Tageszeit mit der genauen Uhrzeit, damit keine Verwechslung zwischen vormittags und nachmittags entsteht.
