teaching:
  it.a1.unit15.lesson01.teach.piu_meno:
    title: più, meno
    gloss: mehr, weniger
    note: '*più* („mehr“) und *meno* („weniger“) sind die grundlegenden Vergleichswörter; sie stehen vor einem Adjektiv oder mit *di*, um zu vergleichen.'
    example_gloss:
    - Ich möchte mehr Kaffee, weniger Tee.
  it.a1.unit15.lesson01.teach.di:
    title: di
    gloss: als / von
    note: 'Nach *più*/*meno* bedeutet *di* („von“) „als“ (*più di due euro*); vor dem bestimmten Artikel verschmilzt es: *di* + *i* = *dei*, *di* + *le* = *delle*.'
    example_gloss:
    - Der Kaffee kostet mehr als zwei Euro.
  it.a1.unit15.lesson01.teach.le_mele_costano_piu_dei_pomodori:
    title: Le mele costano più dei pomodori.
    gloss: Äpfel kosten mehr als Tomaten.
    note: '*più dei pomodori* verwendet *di* + *i* (verschmolzen zu *dei*), um mit *i pomodori* zu vergleichen.'
  it.a1.unit15.lesson01.teach.i_pomodori_costano_meno_delle_mele:
    title: I pomodori costano meno delle mele.
    gloss: Tomaten kosten weniger als Äpfel.
    note: '*meno delle mele* verwendet *di* + *le* (verschmolzen zu *delle*), um mit *le mele* zu vergleichen.'
  it.a1.unit15.lesson02.teach.quale_preferisci:
    title: Quale preferisci, le mele o i pomodori?
    gloss: Welche bevorzugst du, Äpfel oder Tomaten?
    note: '*Quale* („welche/welcher“) bittet das Gegenüber, zwischen den beiden eben genannten Dingen zu wählen.'
  it.a1.unit15.lesson02.teach.preferisco_le_mele:
    title: Preferisco le mele.
    gloss: Ich bevorzuge Äpfel.
    note: '*Preferisco* („ich bevorzuge“) plus *le mele* („die Äpfel“) beantwortet die Frage mit einer Wahl.'
    example_gloss:
    - Ich bevorzuge Tomaten.
  it.a1.unit15.lesson03.teach.come:
    title: come
    gloss: wie
    note: '*come* („wie“) steht mit *buono/a*, um zwei Dinge als gleichwertig zu vergleichen.'
    example_gloss:
    - Tee ist so gut wie Kaffee.
  it.a1.unit15.lesson03.teach.le_mele_sono_buone_come_i_pomodori:
    title: Le mele sono buone come i pomodori.
    gloss: Äpfel sind so gut wie Tomaten.
    note: '*sono buone* („sind gut“, Femininum Plural) richtet sich nach *le mele*; *come* leitet den Gleichheitsvergleich ein.'
