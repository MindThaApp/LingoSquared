      trovi: du findest
      dice: sagt
      estate: der Sommer
      piace: gefällt (mi piace = ich mag)
      nuotiamo: wir schwimmen
      inverno: der Winter
      pattiniamo: wir laufen Schlittschuh (sul ghiaccio = auf dem Eis)
