    title: Ein Gespräch über die Jahreszeiten
    gloss: 'Jetzt ist Frühling. Die Tulpen sind schön. Nina fragt: Welche Jahreszeit findest du am schönsten? Marco sagt: Mir gefällt der Sommer. Im Sommer schwimmen wir. Giulia sagt: Mir gefällt der Winter. Im Winter laufen wir Schlittschuh.'
    note: Der Text fasst das Gespräch im Sprachcafé zusammen und gibt die Aussagen der Personen in wörtlicher Rede wieder.
