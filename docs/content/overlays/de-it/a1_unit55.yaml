  it.a1.unit55.lesson03.teach.mi_piace_stagione:
    title: Mi piace + Jahreszeit
    gloss: 'Mi piace + Jahreszeit sagt, was Sie von einer Jahreszeit halten: Mi piace l''estate. Bei zwei Jahreszeiten verwendet man mi piacciono: Mi piacciono l''estate e l''inverno.'
    note: 'Im Italienischen ist das, was einem gefällt, das grammatische Subjekt, deshalb richtet sich das Verb danach: mi piace l''estate (eine Jahreszeit), mi piacciono l''estate e l''inverno (zwei). Das ist wie im Deutschen bei „gefallen“: Der Sommer gefällt mir, Sommer und Winter gefallen mir.'
