    title: Nina erfährt etwas über alle
    gloss: Nina ist neu im Sprachcafé. Sie fragt Marco, wie die anderen sind. Marco erzählt. Giulia ist freundlich und geduldig; sie arbeitet als Krankenschwester. Luca ist lustig und besucht einen Spanischkurs. Chiara ist neugierig; sie lernt gern neue Dinge. Marco selbst ist ruhig.
    note: Fasst die Charaktereigenschaften der Gruppe zusammen, im Aufbau ähnlich wie die Vergleichstexte der Einheiten zu Haushalt, Nachbarschaft, Post und Kochen.
    glosses:
      nuova: neu (feminin)
      caffè: Café (caffè linguistico = Sprachcafé)
      Chiede: fragt
      altri: andere
      racconta: erzählt
      gentile: nett / freundlich
      paziente: geduldig
      lavora: arbeitet
      infermiera: Krankenschwester
      divertente: lustig
      segue: besucht
      corso: Kurs
      spagnolo: Spanisch
      curiosa: neugierig (feminin)
      imparare: lernen
      piace: gefällt (le piace = sie mag)
      nuove: neu (Plural)
      cose: Dinge
      stesso: selbst (stesso)
      calmo: ruhig
