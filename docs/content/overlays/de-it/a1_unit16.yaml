teaching:
  it.a1.unit16.lesson01.teach.mi_fa_male:
    title: mi fa male
    gloss: es tut weh / … tut weh
    note: '*mi fa male* entspricht „mir tut … weh“ – danach nennen Sie den Körperteil, der schmerzt.'
    example_gloss:
    - Mir tut der Kopf weh.
  it.a1.unit16.lesson01.teach.la_testa_la_pancia_la_gola:
    title: la testa, la pancia, la gola
    gloss: Kopf, Bauch, Hals
    note: Drei häufige Körperteile, die man mit *mi fa male* verwendet, um Schmerzen zu beschreiben.
    example_gloss:
    - Mir tut der Bauch weh.
    - Mir tut der Hals weh.
  it.a1.unit16.lesson01.teach.cosa_hai:
    title: Cosa hai?
    gloss: Was hast du?
    note: '*Cosa hai?* (wörtlich „Was hast du?“) fragt man, wenn man wissen möchte, was jemandem fehlt.'
  it.a1.unit16.lesson01.teach.mi_fa_male_la_testa:
    title: Mi fa male la testa.
    gloss: Mir tut der Kopf weh.
    note: '*la testa* (der Kopf) ist feminin, deshalb steht *la*.'
  it.a1.unit16.lesson02.teach.non_mi_sento_bene:
    title: non mi sento bene
    gloss: Ich fühle mich nicht gut
    note: '*mi sento* (ich fühle mich) plus *bene* (gut); mit *non* wird es verneint: Man fühlt sich nicht gut.'
    example_gloss:
    - Ich fühle mich heute nicht gut.
  it.a1.unit16.lesson02.teach.la_febbre_la_tosse:
    title: la febbre, la tosse
    gloss: Fieber, Husten
    note: 'Häufige Symptome, die mit *avere* (haben) verwendet werden: *Ho la febbre* (Ich habe Fieber).'
    example_gloss:
    - Ich habe Fieber.
    - Ich habe Husten.
  it.a1.unit16.lesson02.teach.non_mi_sento_bene_phrase:
    title: Non mi sento bene.
    gloss: Ich fühle mich nicht gut.
    note: Eine allgemeine Wendung, um zu sagen, dass es einem nicht gut geht – nützlich, bevor Sie ein bestimmtes Symptom nennen.
  it.a1.unit16.lesson02.teach.ho_la_febbre_e_la_tosse:
    title: Ho la febbre e la tosse.
    gloss: Ich habe Fieber und Husten.
    note: '*Ho* (ich habe) plus zwei Symptome, verbunden mit *e* (und).'
  it.a1.unit16.lesson03.teach.il_dottore_la_dottoressa:
    title: il dottore, la dottoressa
    gloss: Arzt, Ärztin
    note: '*il dottore* und *la dottoressa* sind die männliche und die weibliche Form von „Arzt“.'
    example_gloss:
    - Ich muss zum Arzt gehen.
    - Ich muss zur Ärztin gehen.
  it.a1.unit16.lesson03.teach.riposa_la_medicina:
    title: riposa, la medicina
    gloss: ruh dich aus!, Medikament
    note: '*riposa* ist der informelle Imperativ von *riposare* (sich ausruhen); *la medicina* ist das Medikament.'
    example_gloss:
    - Ruh dich heute aus.
    - Nimm dieses Medikament.
  it.a1.unit16.lesson03.teach.devo_andare_dal_dottore:
    title: Devo andare dal dottore.
    gloss: Ich muss zum Arzt gehen.
    note: '*Devo* (ich muss) plus *andare dal dottore* (zum Arzt gehen); *dal* setzt sich aus *da* + *il* zusammen.'
  it.a1.unit16.lesson03.teach.prendi_questa_medicina_e_riposa:
    title: Prendi questa medicina e riposa.
    gloss: Nimm dieses Medikament und ruh dich aus.
    note: '*Prendi* (nimm, informeller Imperativ) plus *questa medicina* (dieses Medikament) und *riposa* (ruh dich aus).'
