teaching:
  it.a1.unit24.lesson01.teach_soldi_carta:
    title: i soldi, la carta
    gloss: Geld, Karte
    note: '*Soldi* steht im Italienischen im Plural; *carta* ist die übliche Kurzform für eine Zahlungskarte.'
    example_gloss:
    - Ich habe Geld.
    - Ich bezahle mit Karte.
  it.a1.unit24.lesson01.teach_contanti_scontrino:
    title: i contanti, lo scontrino
    gloss: Bargeld, Kassenbon
    note: '*Contanti* steht im Plural; *scontrino* ist der alltägliche Kassenbon im Geschäft.'
    example_gloss:
    - Ich bezahle bar.
    - Hier ist der Kassenbon.
  it.a1.unit24.lesson01.teach_pago_con_la_carta:
    title: Pago con la carta.
    gloss: Ich bezahle mit Karte.
    note: Mit *con la carta* sagt man, dass man mit Karte bezahlt.
    example_gloss:
    - Im Café bezahle ich mit Karte.
  it.a1.unit24.lesson01.teach_pago_in_contanti:
    title: Pago in contanti.
    gloss: Ich bezahle bar.
    note: Mit *in contanti* sagt man, dass man bar bezahlt.
    example_gloss:
    - Heute bezahle ich bar.
  it.a1.unit24.lesson02.teach_posso_pagare_carta:
    title: Posso pagare con la carta?
    gloss: Kann ich mit Karte bezahlen?
    note: Mit *Posso pagare...?* fragt man, ob eine Zahlungsart akzeptiert wird.
    example_gloss:
    - Kann ich heute mit Karte bezahlen?
  it.a1.unit24.lesson02.teach_sono_dieci_euro:
    title: Sono dieci euro.
    gloss: Es sind zehn Euro.
    note: Bei Preisen steht im Italienischen oft *sono* (Plural).
    example_gloss:
    - Das T-Shirt kostet zehn Euro.
  it.a1.unit24.lesson02.teach_si_certo:
    title: Sì, certo.
    gloss: Ja, sicher.
    note: Für „ja“ schreibt man *Sì* mit Akzent; *si* ohne Akzent bedeutet etwas anderes.
    example_gloss:
    - Ja, klar, ich bezahle mit Karte.
  it.a1.unit24.lesson02.teach_ecco_scontrino:
    title: Ecco lo scontrino.
    gloss: Hier ist der Kassenbon.
    note: 'Mit *Ecco* zeigt man etwas: hier ist / hier sind.'
    example_gloss:
    - Danke, hier ist der Kassenbon.
