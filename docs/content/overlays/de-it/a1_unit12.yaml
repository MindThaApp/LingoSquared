teaching:
  it.a1.unit12.lesson01.teach.stasera_domani:
    title: stasera, domani
    gloss: heute Abend, morgen
    note: '*stasera* (heute Abend) und *domani* (morgen) sind die zwei Zeitangaben, mit denen man einen Plan vorschlägt.'
    example_gloss:
    - Hast du heute Abend Zeit?
  it.a1.unit12.lesson01.teach.va_bene_andiamo:
    title: va bene, andiamo
    gloss: in Ordnung / okay, gehen wir
    note: '*va bene* (in Ordnung) nimmt einen Vorschlag an; *andiamo* (gehen wir) ist die Wir-Form von *andare* und dient als Einladung.'
    example_gloss:
    - Okay, gehen wir zusammen.
  it.a1.unit12.lesson01.teach.andiamo_al_cinema_stasera:
    title: Andiamo al cinema stasera?
    gloss: Gehen wir heute Abend ins Kino?
    note: '*Andiamo* als Frage schlägt vor, etwas gemeinsam zu tun.'
  it.a1.unit12.lesson01.teach.va_bene_andiamo_phrase:
    title: Va bene, andiamo!
    gloss: Okay, gehen wir!
    note: '*Va bene* nimmt den Vorschlag an, danach wiederholt *andiamo* die Einladung mit Begeisterung.'
  it.a1.unit12.lesson02.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: Um wie viel Uhr treffen wir uns?
    note: '*ci vediamo* (wir sehen uns / wir treffen uns) ist die reziproke Form von *vedersi*.'
  it.a1.unit12.lesson02.teach.ci_vediamo_alle_otto:
    title: Ci vediamo alle otto, davanti al cinema.
    gloss: Wir treffen uns um acht vor dem Kino.
    note: '*davanti a* (vor) plus Artikel nennt den Treffpunkt.'
  it.a1.unit12.lesson02.teach.perfetto_a_stasera:
    title: Perfetto, a stasera allora!
    gloss: Perfekt, dann bis heute Abend!
    note: '*a stasera* (bis heute Abend) ist ein Abschiedsgruß, der die vereinbarte Zeit nennt.'
    example_gloss:
    - Perfekt, dann bis morgen!
  it.a1.unit12.lesson03.teach.se_stasera_non_va_bene:
    title: Se stasera non va bene, andiamo domani.
    gloss: Wenn es heute Abend nicht passt, gehen wir morgen.
    note: '*Se* (wenn) leitet einen Alternativplan ein, falls der erste nicht klappt.'
  it.a1.unit12.lesson03.teach.domani_va_bene:
    title: Sì, domani va bene.
    gloss: Ja, morgen passt.
    note: '*va bene* (passt / ist in Ordnung) bestätigt, dass der alternative Tag in Ordnung ist.'
    example_gloss:
    - Ja, morgen passt mir sehr gut.
