teaching:
  it.a1.unit14.lesson01.teach.preferire:
    title: preferire, preferisco
    gloss: bevorzugen, ich bevorzuge
    note: '*preferire* (bevorzugen) ist ein Verb auf -ire, das in den meisten Präsensformen ein -isc- einschiebt; *preferisco* heißt „ich bevorzuge“.'
    example_gloss:
    - Ich bevorzuge Tee statt Kaffee.
  it.a1.unit14.lesson01.teach.preferisci_il_caffe_o_il_te:
    title: Preferisci il caffè o il tè?
    gloss: Bevorzugst du Kaffee oder Tee?
    note: '*Preferisci* (du bevorzugst) und *o* (oder) bieten die Wahl zwischen zwei Dingen.'
  it.a1.unit14.lesson01.teach.preferisco_il_caffe:
    title: Preferisco il caffè.
    gloss: Ich bevorzuge Kaffee.
    note: '*Preferisco* (ich bevorzuge) und *il caffè* (der Kaffee) drücken eine Vorliebe aus.'
  it.a1.unit14.lesson02.teach.mi_piace_il_cornetto:
    title: Mi piace molto il cornetto.
    gloss: Ich mag das Croissant sehr.
    note: '*Mi piace* (es gefällt mir / ich mag) und *molto* (sehr) drücken eine starke Vorliebe aus.'
  it.a1.unit14.lesson02.teach.non_mi_piace:
    title: Non mi piace il tè la mattina.
    gloss: Ich mag morgens keinen Tee.
    note: '*Non mi piace* (ich mag nicht / gefällt mir nicht) verneint die Konstruktion des Gefallens; *la mattina* bedeutet „morgens“.'
    example_gloss:
    - Ich mag abends keinen Kaffee.
  it.a1.unit14.lesson02.teach.e_a_te:
    title: E a te?
    gloss: Und du?
    note: '*E a te?* (und dir?) fragt die andere Person nach ihrer eigenen Vorliebe.'
  it.a1.unit14.lesson03.teach.anch_io_preferisco_il_caffe:
    title: Anch'io preferisco il caffè!
    gloss: Ich auch, ich bevorzuge Kaffee!
    note: '*Anch''io* (ich auch) stimmt einer Vorliebe zu, die jemand gerade mit *preferisco* geäußert hat. (Um einer Aussage mit *mi piace* zuzustimmen, sagt man auf Italienisch *Anche a me*.)'
  it.a1.unit14.lesson03.teach.a_me_no:
    title: A me no, preferisco il tè.
    gloss: Ich nicht, ich bevorzuge Tee.
    note: '*A me no* (ich nicht) widerspricht einer Aussage mit *mi piace* (es greift das *a me* der Konstruktion des Gefallens auf), bevor man die eigene Vorliebe nennt. Um einer Aussage mit *preferisco* zu widersprechen, sagt man im Italienischen stattdessen *Io no*.'
    example_gloss:
    - Ich nicht, ich bevorzuge Kaffee.
