teaching:
  it.a1.unit17.lesson01.teach.il_lavoro:
    title: il lavoro
    gloss: Beruf / Arbeit
    note: '*il lavoro* ist ein maskulines Substantiv und bedeutet sowohl „Beruf“ als auch „Arbeit“ im Allgemeinen.'
    example_gloss:
    - Meine Arbeit ist interessant.
  it.a1.unit17.lesson01.teach.insegnante_commesso:
    title: insegnante, commesso
    gloss: Lehrer/in, Verkäufer
    note: '*insegnante* (Lehrer/in) hat für Männer und Frauen dieselbe Form; *commesso* (Verkäufer) ist maskulin – die feminine Form ist *commessa*.'
    example_gloss:
    - Ich bin Lehrer, nicht Verkäufer.
  it.a1.unit17.lesson01.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: Was machst du beruflich?
    note: '*Che lavoro fai?* (wörtlich „Welche Arbeit machst du?“) ist die übliche Art, nach dem Beruf zu fragen.'
  it.a1.unit17.lesson01.teach.sono_insegnante:
    title: Sono insegnante.
    gloss: Ich bin Lehrer.
    note: 'Vor einem Beruf ohne Zusatz steht im Italienischen kein Artikel, wie im Deutschen: *Sono insegnante*, nicht *Sono un insegnante*.'
  it.a1.unit17.lesson01.teach.sono_commesso:
    title: Sono commesso.
    gloss: Ich bin Verkäufer.
    note: Dasselbe Muster ohne Artikel wie bei *Sono insegnante*.
  it.a1.unit17.lesson02.teach.ufficio_scuola:
    title: l'ufficio, la scuola
    gloss: Büro, Schule
    note: Bei *l'ufficio* (Büro) wird der Artikel vor einem Vokal verkürzt; *la scuola* (Schule) ist feminin.
    example_gloss:
    - Ich arbeite in einem Büro.
    - Ich arbeite in einer Schule.
  it.a1.unit17.lesson02.teach.dove_lavori:
    title: Dove lavori?
    gloss: Wo arbeitest du?
    note: '*Dove* (wo) plus *lavori* (du arbeitest, informell).'
  it.a1.unit17.lesson02.teach.lavoro_in_un_ufficio:
    title: Lavoro in un ufficio.
    gloss: Ich arbeite in einem Büro.
    note: '*Lavoro in* (ich arbeite in) plus *un ufficio* (ein Büro).'
  it.a1.unit17.lesson02.teach.lavoro_in_una_scuola:
    title: Lavoro in una scuola.
    gloss: Ich arbeite in einer Schule.
    note: Dasselbe Muster mit *una scuola* (eine Schule).
  it.a1.unit17.lesson03.teach.inizio_finisco:
    title: inizio, finisco
    gloss: ich fange an, ich höre auf
    note: '*inizio* (ich fange an) und *finisco* (ich höre auf) sind die Formen der 1. Person Singular Präsens von *iniziare* und *finire*.'
    example_gloss:
    - Ich fange um neun an.
    - Ich höre um fünf auf.
  it.a1.unit17.lesson03.teach.a_che_ora_inizi:
    title: A che ora inizi?
    gloss: Um wie viel Uhr fängst du an?
    note: '*A che ora* (um wie viel Uhr) plus *inizi* (du fängst an, informell).'
  it.a1.unit17.lesson03.teach.inizio_alle_nove_e_finisco_alle_cinque:
    title: Inizio alle nove e finisco alle cinque.
    gloss: Ich fange um neun an und höre um fünf auf.
    note: '*alle nove* / *alle cinque* (um neun / um fünf): Vor der Uhrzeit steht *alle*, wie in den Uhrzeit-Wendungen aus Lektion 5.'
