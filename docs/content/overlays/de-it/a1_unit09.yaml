  it.a1.unit09.lesson02.teach.ce_una_banca_qui_vicino:
    title: C'è una banca qui vicino?
    gloss: Gibt es hier in der Nähe eine Bank?
    note: Mit *C'è* (es gibt) fragt man, ob etwas vorhanden ist; danach folgt *qui vicino* (in der Nähe).
  it.a1.unit09.lesson02.teach.si_ce_ne_una:
    title: Sì, ce n'è una qui vicino.
    gloss: Ja, hier in der Nähe gibt es eine.
    note: '*ce n''è una* (es gibt eine davon) antwortet auf Fragen mit *c''è* und bezieht sich auf das feminine Nomen *banca*.'
  it.a1.unit09.lesson02.teach.accanto_alla_stazione:
    title: Accanto alla stazione.
    gloss: Neben dem Bahnhof.
    note: '*accanto a* (neben) mit dem Artikel gibt eine genaue Lage in Bezug auf einen Orientierungspunkt an.'
  it.a1.unit09.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: Vielen Dank.
    note: Wörtlich „tausend Dank“, eine stärkere Art, sich zu bedanken, als das einfache *grazie*.
  it.a1.unit09.lesson03.teach.dove_e_la_stazione:
    title: Dov'è la stazione?
    gloss: Wo ist der Bahnhof?
    note: '*Dov''è* (wo ist) mit einem Nomen fragt nach dem Ort eines bestimmten Platzes.'
    example_gloss:
    - Der Bahnhof ist neben der Bank.
