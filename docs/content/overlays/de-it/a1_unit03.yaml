teaching:
  it.a1.unit03.lesson01.teach.numeri_zero_cinque:
    title: zero, uno, due, tre, quattro, cinque
    gloss: null, eins, zwei, drei, vier, fünf
    note: Die ersten sechs Zahlen sind die Bausteine für Preise, Alter und Telefonnummern in dieser Lektion.
    example_gloss:
    - Ich habe zwei Brüder.
    - Es ist fünf Uhr.
  it.a1.unit03.lesson01.teach.numeri_sei_dieci:
    title: sei, sette, otto, nove, dieci
    gloss: sechs, sieben, acht, neun, zehn
    note: Die Zahlen von sechs bis zehn; damit ist der Zahlenraum 0–10 vollständig.
    example_gloss:
    - Ich arbeite acht Stunden am Tag.
    - Das Geschäft öffnet um zehn.
  it.a1.unit03.lesson01.teach.quanti_anni:
    title: Quanti anni hai?
    gloss: Wie alt bist du?
    note: Wörtlich „Wie viele Jahre hast du?“ – Im Italienischen fragt man nach dem Alter mit *avere* (haben).
  it.a1.unit03.lesson01.teach.ho_trent_anni:
    title: Ho trent'anni.
    gloss: Ich bin dreißig Jahre alt.
    note: 'Eine feste Wendung, um das Alter anzugeben, mit *avere* (wörtlich „ich habe dreißig Jahre“). „Dreißig“ wird hier nicht als Zählzahl gelernt: Der Zahlenraum dieser Einheit bleibt 0–10, dazu kommen 30 und 50 nur in dieser festen Wendung und in Preisen.'
  it.a1.unit03.lesson02.teach.quanto_costa:
    title: Quanto costa un caffè?
    gloss: Wie viel kostet ein Kaffee?
    note: '*Quanto costa* ist die übliche Art, nach dem Preis einer einzelnen Sache zu fragen.'
  it.a1.unit03.lesson02.teach.costa_un_euro:
    title: un euro, due euro
    gloss: ein Euro, zwei Euro
    note: '*euro* bleibt im Italienischen im Plural unverändert – sowohl *un euro* als auch *due euro* verwenden *euro*.'
    example_gloss:
    - Es kostet einen Euro.
    - Das macht zwei Euro fünfzig.
  it.a1.unit03.lesson02.teach.un_cornetto:
    title: E un cornetto?
    gloss: Und ein Hörnchen?
    note: Eine kurze Anschlussfrage nach dem Preis einer zweiten Sache, eines *cornetto* (das italienische Frühstückshörnchen).
  it.a1.unit03.lesson02.teach.due_euro_cinquanta:
    title: Sono due euro e cinquanta.
    gloss: Das macht zwei Euro fünfzig.
    note: '*e cinquanta* fügt die Cent hinzu – wörtlich „und fünfzig“; so sagt man es bei jedem Preis mit fünfzig Cent.'
  it.a1.unit03.lesson02.teach.quanti_ne_vuole:
    title: Quanti ne vuole?
    gloss: Wie viele möchten Sie?
    note: So fragt höflich ein Barista oder Verkäufer, wie viele Stück Sie möchten; *ne* ersetzt die bereits genannte Sache.
  it.a1.unit03.lesson02.teach.ne_vorrei_tre:
    title: Ne vorrei tre, grazie.
    gloss: Ich hätte gern drei, danke.
    note: '*Ne vorrei* + Zahl ist die höfliche Art, eine Menge zu bestellen; auch hier verweist *ne* auf die bereits genannte Sache.'
  it.a1.unit03.lesson03.teach.qual_e_il_tuo_numero:
    title: Qual è il tuo numero di telefono?
    gloss: Wie lautet deine Telefonnummer?
    note: So fragt man informell nach der Telefonnummer von jemandem, mit *tuo* (dein, informell).
  it.a1.unit03.lesson03.teach.ti_chiamo_domani:
    title: Ti chiamo domani!
    gloss: Ich rufe dich morgen an!
    note: Eine freundliche Art, das Gespräch zu beenden, nachdem man die Nummer bekommen hat.
  it.a1.unit03.lesson03.teach.il_mio_numero:
    title: il mio numero
    gloss: meine Nummer
    note: Italienische Telefonnummern werden normalerweise Ziffer für Ziffer genannt, mit den Zahlen aus Lektion 1.
    example_gloss: Meine Nummer ist null, drei, vier, zwei, eins.
  it.a1.unit03.lesson03.teach.numero_sam:
    title: Il mio numero è zero, tre, quattro, due, uno.
    gloss: Meine Nummer ist null, drei, vier, zwei, eins.
    note: Sam nennt seine Telefonnummer Ziffer für Ziffer – so liest man im Italienischen üblicherweise eine Telefonnummer vor.
  it.a1.unit03.lesson03.teach.perfetto_grazie:
    title: Perfetto, grazie!
    gloss: Perfekt, danke!
    note: Eine kurze, fröhliche Art, ein Gespräch abzuschließen, nachdem man die gewünschte Information erhalten hat.
