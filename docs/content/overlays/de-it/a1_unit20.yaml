teaching:
  it.a1.unit20.lesson01.teach.fa_caldo_freddo:
    title: fa caldo, fa freddo
    gloss: es ist heiß, es ist kalt
    note: Im Italienischen sagt man für die Temperatur *fa caldo/freddo* – wörtlich „es macht warm/kalt“ –, nicht „es ist warm/kalt“.
    example_gloss:
    - Heute ist es heiß.
    - Heute ist es kalt.
  it.a1.unit20.lesson01.teach.piove_sole:
    title: piove, c'è il sole
    gloss: es regnet, die Sonne scheint
    note: '*Piove* ist ein Wettersatz aus einem Wort; *c''è il sole* heißt wörtlich „da ist die Sonne“.'
    example_gloss:
    - Heute regnet es.
    - Heute scheint die Sonne.
  it.a1.unit20.lesson01.teach.che_tempo_fa:
    title: Che tempo fa oggi?
    gloss: Wie ist das Wetter heute?
    note: '*Che tempo fa?* ist die Standardfrage nach dem Wetter.'
    example_gloss:
    - Wie ist das Wetter heute?
  it.a1.unit20.lesson01.teach_oggi_piove:
    title: Oggi piove.
    gloss: Heute regnet es.
    note: '*Oggi* steht oft am Anfang, aber auch *Piove oggi.* ist richtig.'
    example_gloss:
    - Heute regnet es.
  it.a1.unit20.lesson02.teach_oggi_piove_freddo:
    title: Oggi piove e fa freddo.
    gloss: Heute regnet es und es ist kalt.
    note: Zwei Wetterangaben verbindet man mit *e*.
    example_gloss:
    - Heute regnet es und es ist kalt.
  it.a1.unit20.lesson02.teach_restiamo_a_casa:
    title: Restiamo a casa.
    gloss: Bleiben wir zu Hause.
    note: '*Restiamo* ist eine „wir“-Form, die als einfacher Vorschlag dient.'
    example_gloss:
    - Bleiben wir zu Hause.
  it.a1.unit20.lesson02.teach_andiamo_al_museo:
    title: Andiamo al museo.
    gloss: Gehen wir ins Museum.
    note: '*Andiamo* kann „wir gehen“ oder „gehen wir“ als Vorschlag bedeuten.'
    example_gloss:
    - Gehen wir ins Museum.
  it.a1.unit20.lesson02.teach_allora:
    title: Allora restiamo a casa?
    gloss: Bleiben wir also zu Hause?
    note: '*Allora* verbindet das Wetter mit dem Plan.'
    example_gloss:
    - Bleiben wir also zu Hause?
