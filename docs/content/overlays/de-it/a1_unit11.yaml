    title: Torno a casa alle sei e trenta, di solito.
    gloss: Ich komme normalerweise um halb sieben nach Hause.
    note: '*alle sei e trenta* (um sechs Uhr dreißig) fügt die Minuten nach der Stunde mit *e* an.'
