teaching:
  it.a1.unit06.lesson01.teach.madre_padre:
    title: la madre, il padre
    gloss: die Mutter, der Vater
    note: Italienische Nomen haben einen Artikel mit Geschlecht – *la* für feminin, *il* für maskulin.
    example_gloss:
    - Das ist mein Vater.
    - Das ist meine Mutter.
  it.a1.unit06.lesson01.teach.fratello_sorella:
    title: il fratello, la sorella
    gloss: der Bruder, die Schwester
    note: '*fratello* ist maskulin (*il*) und *sorella* ist feminin (*la*).'
    example_gloss:
    - Ich habe einen Bruder und eine Schwester.
  it.a1.unit06.lesson01.teach.questo_e_mio_padre:
    title: Questo è mio padre. Questa è mia madre.
    gloss: Das ist mein Vater. Das ist meine Mutter.
    note: '*Questo/Questa* (dieser/diese) richtet sich im Geschlecht nach der Person, auf die man zeigt: *questo* bei einem Mann, *questa* bei einer Frau.'
  it.a1.unit06.lesson01.teach.nonno_nonna:
    title: il nonno, la nonna
    gloss: der Großvater, die Großmutter
    note: Dasselbe Muster mit maskulinem und femininem Artikel wie bei *padre/madre*.
    example_gloss:
    - Mein Großvater wohnt in Rom.
    - Meine Großmutter kocht sehr gut.
  it.a1.unit06.lesson02.teach.hai_fratelli_o_sorelle:
    title: Hai fratelli o sorelle?
    gloss: Haben Sie Geschwister?
    note: '*Hai* (du hast) + Familienwort + *o* (oder) ist die übliche Art, nach Geschwistern zu fragen.'
  it.a1.unit06.lesson02.teach.ho_un_fratello_e_una_sorella:
    title: Ho un fratello e una sorella.
    gloss: Ich habe einen Bruder und eine Schwester.
    note: '*Ho* (ich habe) beantwortet die Frage, mit *un* (ein, maskulin) und *una* (eine, feminin).'
  it.a1.unit06.lesson02.teach.moglie_marito:
    title: il marito, la moglie
    gloss: der Ehemann, die Ehefrau
    note: Ein weiteres Paar aus maskulin und feminin mit demselben Artikelmuster.
    example_gloss:
    - Sam hat eine Frau.
  it.a1.unit06.lesson03.teach.hai_figli:
    title: Hai figli?
    gloss: Haben Sie Kinder?
    note: '*figli* (Kinder) ist der Plural, den man bei allgemeinen Fragen verwendet, unabhängig von Anzahl und Geschlecht.'
  it.a1.unit06.lesson03.teach.ho_due_figli:
    title: Sì, ho due figli. Un maschio e una femmina.
    gloss: Ja, ich habe zwei Kinder. Einen Jungen und ein Mädchen.
    note: '*maschio* (männlich/Junge) und *femmina* (weiblich/Mädchen) geben nach der Gesamtzahl das Geschlecht der Kinder an.'
  it.a1.unit06.lesson03.teach.figlio_figlia:
    title: il figlio, la figlia
    gloss: der Sohn, die Tochter
    note: Die Singularformen von *figli* mit dem üblichen Muster aus maskulinem und femininem Artikel.
    example_gloss:
    - Elena hat einen Sohn und eine Tochter.
