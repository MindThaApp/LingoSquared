    example_gloss:
    - Die Fahrkarte ist für Rom.
  it.a1.unit19.lesson01.teach.parte_alle_otto:
    title: Parte alle otto.
    gloss: Er fährt um acht ab.
    note: '*parte* bedeutet bei Verkehrsmitteln „fährt ab“.'
    example_gloss:
    - Der Zug fährt um acht Uhr ab.
  it.a1.unit19.lesson01.teach.dal_binario_tre:
    title: dal binario tre
    gloss: von Gleis drei
    note: '*dal* setzt sich aus *da* + *il* zusammen: von dem (vom).'
    example_gloss:
    - Er fährt von Gleis drei ab.
  it.a1.unit19.lesson02.teach.a_che_ora_parte:
    title: A che ora parte il treno?
    gloss: Um wie viel Uhr fährt der Zug ab?
    note: '*A che ora...?* verwendet man bei planmäßigen Abfahrtszeiten.'
    example_gloss:
    - Um wie viel Uhr fährt der Zug nach Rom ab?
  it.a1.unit19.lesson02.teach.vorrei_un_biglietto:
    title: Vorrei un biglietto per Roma alle otto, per favore.
    gloss: Ich hätte gern eine Fahrkarte nach Rom um acht Uhr, bitte.
    note: '*Vorrei* ist eine höfliche Form für Kauf und Bitte; *alle otto* ergänzt die Uhrzeit der Fahrt.'
    example_gloss:
    - Guten Morgen, ich hätte gern eine Fahrkarte nach Rom, bitte.
  it.a1.unit19.lesson02.teach.il_treno_per_roma:
    title: il treno per Roma
    gloss: der Zug nach Rom
    note: Für das Reiseziel verwendet man *per*.
    example_gloss:
    - Der Zug nach Rom fährt um acht Uhr ab.
  it.a1.unit19.lesson02.teach.hai_il_biglietto:
