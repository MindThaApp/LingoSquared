teaching:
  it.a1.unit04.lesson01.teach.giorni_lun_mer:
    title: lunedì, martedì, mercoledì
    gloss: Montag, Dienstag, Mittwoch
    note: Die ersten drei Tage der italienischen Woche. Die italienische Woche beginnt am Montag.
    example_gloss:
    - Am Montag arbeite ich im Büro.
  it.a1.unit04.lesson01.teach.giorni_gio_dom:
    title: giovedì, venerdì, sabato, domenica
    gloss: Donnerstag, Freitag, Samstag, Sonntag
    note: Die übrigen vier Wochentage; damit ist die ganze Liste vollständig.
    example_gloss:
    - Sonntags arbeite ich nicht.
  it.a1.unit04.lesson01.teach.che_giorno_e_oggi:
    title: Che giorno è oggi?
    gloss: Welcher Tag ist heute?
    note: So fragt man üblicherweise, welcher Wochentag es ist.
  it.a1.unit04.lesson01.teach.oggi_e_giovedi:
    title: Oggi è giovedì.
    gloss: Heute ist Donnerstag.
    note: '*Oggi* (heute) + *è* (ist) + Name des Tages beantwortet die Frage direkt.'
  it.a1.unit04.lesson01.teach.domani_e_venerdi:
    title: Domani è venerdì.
    gloss: Morgen ist Freitag.
    note: '*Domani* (morgen) folgt demselben Muster wie *oggi*, um einen Tag zu nennen.'
  it.a1.unit04.lesson02.teach.che_data_e_oggi:
    title: Che data è oggi?
    gloss: Welches Datum ist heute?
    note: '*Che data* (welches Datum) verwendet man statt *che giorno*, wenn man nach dem Kalenderdatum fragt und nicht nach dem Wochentag.'
  it.a1.unit04.lesson02.teach.mesi_gen_apr:
    title: gennaio, febbraio, marzo, aprile
    gloss: Januar, Februar, März, April
    note: Die ersten vier Monate des Jahres auf Italienisch; Monatsnamen schreibt man im Italienischen klein.
    example_gloss:
    - Heute ist der fünfte Januar.
  it.a1.unit04.lesson02.teach.oggi_e_cinque_gennaio:
    title: Oggi è il cinque gennaio.
    gloss: Heute ist der fünfte Januar.
    note: Das Datum wird im Italienischen mit *il* + Tageszahl + Monatsname gebildet. Man verwendet die einfache Grundzahl *cinque* und keine Ordnungszahl wie im Deutschen („der fünfte“). Die Ausnahme ist der Monatserste, der die Ordnungszahl *primo* verwendet (*il primo gennaio*).
  it.a1.unit04.lesson02.teach.il_giorno_del_mese:
    title: il quindici marzo
    gloss: der fünfzehnte März
    note: Ein weiteres Beispiel für das Muster Tag + Monat; es funktioniert bei jedem Datum gleich.
  it.a1.unit04.lesson03.teach.quando_arrivi:
    title: Quando arrivi a Roma?
    gloss: Wann kommst du in Rom an?
    note: '*Quando* (wann) + *arrivi* (du kommst an, informell) fragt nach einer künftigen Ankunft.'
  it.a1.unit04.lesson03.teach.arrivo_giovedi_pomeriggio:
    title: Arrivo giovedì pomeriggio.
    gloss: Ich komme Donnerstagnachmittag an.
    note: '*Arrivo* (ich komme an) + Tag + Tageszeit ergibt eine vollständige Antwort darauf, wann man ankommt.'
  it.a1.unit04.lesson03.teach.parti_di_domani:
    title: oggi, domani, dopodomani
    gloss: heute, morgen, übermorgen
    note: '*Dopodomani* ist ein einziges Wort für „übermorgen“ – wörtlich *dopo* (nach) + *domani* (morgen).'
    example_gloss:
    - Übermorgen ist Samstag.
  it.a1.unit04.lesson03.teach.ci_vediamo_giovedi:
    title: Ci vediamo giovedì!
    gloss: Bis Donnerstag!
    note: Eine freundliche Art, ein Gespräch abzuschließen, nachdem man einen Tag für ein Treffen vereinbart hat.
