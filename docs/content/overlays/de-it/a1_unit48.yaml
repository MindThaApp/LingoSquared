    example_gloss: Die Party ist am Samstag.
  it.a1.unit48.lesson02.teach.il_compleanno_di:
    title: Chiaras Geburtstag ist am Samstag, dem 18.
    gloss: Chiaras Geburtstag ist am Samstag, dem 18. April.
    note: 'Im Italienischen steht der Besitzer nach *di*: *il compleanno di Chiara* (wie „der Geburtstag von Chiara“). Ein Genitiv-s wie in „Chiaras Geburtstag“ gibt es nicht.'
  it.a1.unit48.lesson03.teach.invitare:
    title: Einladen
    gloss: einladen
    example_gloss: Ich lade dich ein.
  it.a1.unit48.lesson03.teach.con_invitare_il:
    title: 'Invitare: Das Pronomen steht zuerst'
    gloss: 'Bei invitare steht das Pronomen vor dem Verb: ti invito, vi invito, lo invito.'
    note: Im Deutschen folgt das Pronomen dem konjugierten Verb („ich lade dich ein“); im Italienischen stehen *ti*, *vi*, *lo* davor.
  it.a1.unit48.lesson03.teach.vieni_alla_festa:
    title: Kommst du zur Party?
    gloss: Kommst du zur Party?
