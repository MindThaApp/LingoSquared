    title: Ich habe am achtzehnten April Geburtstag
    gloss: Ich habe am achtzehnten April Geburtstag.
    note: 'Italienische Datumsangaben bestehen aus *il* + Grundzahl + Monat: *il diciotto aprile*, nicht mit einer Ordnungszahl wie im Deutschen („der 18. April“). Nur der Erste des Monats heißt *il primo*.'
  it.a1.unit48.lesson02.teach.festeggiare:
    title: Feiern
    gloss: feiern
    example_gloss: Wir feiern Chiaras Geburtstag.
  it.a1.unit48.lesson02.teach.la_festa:
