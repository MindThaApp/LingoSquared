    title: Wer macht was für die Party?
    gloss: Am Samstag hat Chiara Geburtstag. Wir feiern mit einer Party. Marco lädt Luca und Giulia zur Party ein. Luca feiert gern mit Freunden. Auch Giulia kommt zur Party. Alle freuen sich für Chiara.
    note: Fasst den Plan für die Party zusammen.
