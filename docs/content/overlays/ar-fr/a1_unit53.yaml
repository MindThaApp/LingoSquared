teaching:
  fr.a1.unit53.lesson01.teach.grand_petit:
    title: طويل وقصير
    gloss: طويل / قصير
    note: 'تصف *Grand* الشخص الطويل و*petit* الشخص القصير. وتتبعان الشخص في الجنس: *grand/grande*، *petit/petite*.'
    example_gloss:
    - Léa طويلة.
    - Thomas قصير.
  fr.a1.unit53.lesson01.teach.vieux_jeune:
    title: كبير في السن وشاب
    gloss: كبير في السن / شاب
    note: تعطي *Vieux* و*jeune* هنا انطباعًا عامًا عن العمر، لا عددًا دقيقًا من السنوات.
    example_gloss:
    - الجد كبير في السن.
    - Mathieu شاب.
  fr.a1.unit53.lesson01.teach.pour_un_age:
    title: 'العمر: رقم أم انطباع'
    gloss: لذكر العمر بالضبط تستعمل الفرنسية الفعل *avoir* (*Il a vingt ans*)، أما *être vieux* فيعطي انطباعًا عامًا (*Mon grand-père est vieux*).
    note: تعرف *Quel âge as-tu ?* للسؤال عن العمر بالضبط. أما *vieux* فتصف هنا كيف يبدو الشخص من حيث العمر، دون ذكر رقم.
  fr.a1.unit53.lesson01.teach.lea_est_grande:
    title: Léa طويلة وThomas قصير
    gloss: Léa طويلة وThomas قصير.
    note: جملة مركبة بسيطة باستعمال *et* (و)، وهي تمهّد للمقارنة المباشرة في الدرس 5.
  fr.a1.unit53.lesson02.teach.les_cheveux:
    title: الشعر
    gloss: الشعر
    note: '*Les cheveux* جمع مذكر دائمًا في الفرنسية، بينما نقول في العربية «الشعر» بصيغة المفرد.'
    example_gloss: Mathieu شعره قصير وأسود.
  fr.a1.unit53.lesson02.teach.blonds_bruns_gris:
    title: أشقر وبني ورمادي
    gloss: أشقر / بني / رمادي
    note: 'ثلاثة ألوان للشعر. مع *cheveux* يأخذ اللون *s* الجمع: *blonds*، *bruns*. أما *gris* فينتهي أصلًا بـ *s*، و*noirs* (أسود) سبق في وحدة الملابس.'
    example_gloss:
    - Camille شعرها أشقر.
    - Thomas شعره بني.
    - شعر الجد رمادي.
  fr.a1.unit53.lesson02.teach.longs_courts:
    title: طويل وقصير (للشعر)
    gloss: طويل / قصير (للشعر)
    note: '*Longs* (طويل) يعيد فكرة الطول من الدرس 1، وهو هنا يصف طول الشعر. أما *courts* (قصير) فجديدة هنا، وكلتاهما تأخذ *s* الجمع مع *cheveux*.'
    example_gloss:
    - Léa شعرها طويل.
    - Thomas شعره قصير.
  fr.a1.unit53.lesson02.teach.cheveux_est_toujours:
    title: Cheveux مع صفة بصيغة الجمع
    gloss: '*Cheveux* جمع دائمًا، لذا تأخذ الصفة *s*: *longs*، *courts*، *blonds*، *bruns*، *noirs*. أما *gris* فينتهي أصلًا بـ *s*.'
    note: 'تتبع الألوان والأطوال *cheveux* في الجمع: *les cheveux longs*. قارن مع *yeux* في الدرس 3، حيث لا يتغير *marron*.'
  fr.a1.unit53.lesson02.teach.ses_est_le:
    title: 'Ses: له أو لها'
    gloss: 'تدل *ses* على الملكية (له/لها) قبل اسم جمع: *ses cheveux*، *ses yeux*. وهي تتبع الشيء المملوك لا المالك.'
    note: في العربية نفرّق بين «عيناه» و«عيناها»، أما الفرنسية فتستعمل *ses yeux* في الحالتين، والسياق يبيّن المقصود.
  fr.a1.unit53.lesson02.teach.mathieu_a_les:
    title: Mathieu شعره قصير وأسود
    gloss: Mathieu شعره قصير وأسود.
    note: يعيد استعمال *noirs* (أسود) من وحدة الملابس.
  fr.a1.unit53.lesson02.teach.camille_a_les:
    title: Camille شعرها طويل وأشقر
    gloss: Camille شعرها طويل وأشقر.
    note: تجمع في جملة طبيعية واحدة مفردات الطول والألوان من هذا الدرس.
  fr.a1.unit53.lesson03.teach.les_yeux:
    title: العيون
    gloss: العيون
    note: '*Les yeux* جمع *l''œil* (العين)؛ وتنتهي *yeux* بحرف *x* لا *s*.'
    example_gloss: Mathieu عيناه بنيتان.
  fr.a1.unit53.lesson03.teach.bleus_marron_verts:
    title: أزرق وبني وأخضر
    gloss: أزرق / بني / أخضر
    note: '*Bleus* (أزرق) مرّت سابقًا في الملابس؛ و*marron* (بني) لا يتغير أبدًا؛ أما *verts* (أخضر) فجديدة.'
    example_gloss:
    - Camille عيناها زرقاوان.
    - Thomas عيناه بنيتان.
    - Léa عيناها خضراوان.
  fr.a1.unit53.lesson03.teach.avec_yeux_pluriel:
    title: Yeux تأخذ s وmarron لا يتغير
    gloss: 'مع *yeux* (جمع) تأخذ الصفة *s*: *yeux bleus*، *yeux verts*. أما *marron* فلا يتغير أبدًا: *yeux marron*.'
    note: 'قارن مع *cheveux* في الدرس 2: الاسم الجمع يستلزم صفة بصيغة الجمع، إلا الألوان المأخوذة من أسماء مثل *marron*.'
  fr.a1.unit53.lesson03.teach.comment_est_camille:
    title: كيف تبدو Camille؟
    gloss: كيف تبدو Camille؟
    note: '*Comment est ... ?* هو السؤال الأساسي في هذه الوحدة؛ استعمله للسؤال عن مظهر أي شخص.'
  fr.a1.unit53.lesson03.teach.camille_a_les:
    title: Camille شعرها طويل وأشقر وعيناها زرقاوان
    gloss: Camille شعرها طويل وأشقر وعيناها زرقاوان.
    note: جواب نموذجي يجمع الشعر والعينين في جملة واحدة بواسطة *et*.
  fr.a1.unit53.lesson04.teach.camille_une_nouvelle:
    title: Camille تقدّم Nina
    gloss: 'Camille: ستأتي فتاة جديدة إلى مقهى اللغات. اسمها Nina.'
    note: تقدّم *Une nouvelle fille vient* شخصًا جديدًا في المشهد؛ و*vient* من الفعل *venir* (جاء).
  fr.a1.unit53.lesson04.teach.mathieu_d_accord:
    title: Mathieu يسأل عن مظهرها
    gloss: 'Mathieu: حسنًا! كيف تبدو؟'
    note: 'يعيد السؤال الأساسي مع *elle* (هي) بدل الاسم: *Comment est-elle ?* وتربط الشرطة بين الفعل والضمير.'
  fr.a1.unit53.lesson04.teach.camille_elle_est:
    title: Camille تصف طول Nina وشعرها
    gloss: 'Camille: هي قصيرة وشعرها قصير وأشقر.'
    note: يجمع *petite* من الدرس 1 مع مفردات الشعر من الدرس 2؛ وتأخذ *petite* حرف *e* للمؤنث.
  fr.a1.unit53.lesson04.teach.mathieu_et_ses:
    title: Mathieu يسأل عن عينيها
    gloss: 'Mathieu: وعيناها؟'
    note: 'تعني *Ses yeux* هنا «عينيها»: فـ *ses* تتبع *yeux* لا الفتاة.'
  fr.a1.unit53.lesson04.teach.camille_elle_a:
    title: Camille تصف عيني Nina
    gloss: 'Camille: عيناها خضراوان.'
    note: يعيد استعمال *yeux verts* من الدرس 3.
  fr.a1.unit53.lesson04.teach.mathieu_merci_alors:
    title: Mathieu سيتعرّف عليها
    gloss: 'Mathieu: شكرًا! إذن سأتعرّف عليها.'
    note: تستعمل *Je vais la reconnaître* الفعل *aller* + المصدر للمستقبل القريب، وتعني *la* «ها».
  fr.a1.unit53.lesson05.teach.thomas_et_lea:
    title: مقارنة بين Thomas وLéa
    gloss: Thomas وLéa أخ وأخت، لكنهما لا يتشابهان. Thomas قصير، شعره قصير وبني وعيناه بنيتان. Léa أطول من Thomas، شعرها طويل وبني وعيناها خضراوان. وأنت، كيف تبدو؟
    note: مقارنة قصيرة تعيد استعمال كل كلمات الألوان والطول التي تعلمناها، وتنتهي بسؤال الوحدة الأساسي موجهًا إلى القارئ.
    glosses:
      frère: أخ
      sœur: أخت
      ressemblent: مظهر
      différents: مختلف
      petit: قصير
      courts: قصير
      bruns: بني
      cheveux: الشعر
      marron: بني
      yeux: العيون
      grande: أطول
      longs: طويل
      verts: أخضر
      se: يتشابهان
  fr.a1.unit53.lesson05.teach.tu_connais_deja:
    title: Plus ... que مع الأشخاص
    gloss: 'تعرف أصلًا البنية *plus* + صفة + *que*. وهنا تستعملها مع الأشخاص: Léa أطول من Thomas.'
    note: البنية *plus ... que* نفسها التي مرّت في وحدة التسوق، لكن مع الأشخاص بدل الأشياء. وتتبع *grande* الاسم *Léa* لأنها أنثى.
  fr.a1.unit53.lesson05.teach.lea_a_les:
    title: شعر Léa أطول من شعر Thomas
    gloss: شعر Léa أطول من شعر Thomas.
    note: 'تتبع *Plus longs que* كلمة *cheveux* (جمع): *les cheveux plus longs que Thomas*.'
  fr.a1.unit53.lesson05.teach.j_ai_les:
    title: لدي شعر قصير بني
    gloss: لدي شعر قصير بني.
    note: جملة نموذجية بضمير المتكلم باستعمال *J'ai ...*، جاهزة للاستعمال عند وصف مظهرك.
  fr.a1.unit53.lesson06.teach.mathieu_regarde_c:
    title: Mathieu يلمح Nina
    gloss: 'Mathieu: انظري، هل هذه Nina؟ شعرها قصير وأشقر وعيناها خضراوان.'
    note: '*Regarde* (انظر) هي صيغة الأمر مع *tu* من الفعل *regarder*، وقد استُعملت بالطريقة نفسها في حوار سابق.'
  fr.a1.unit53.lesson06.teach.camille_oui_c:
    title: Camille تؤكد
    gloss: 'Camille: نعم، إنها Nina!'
    note: تأكيد قصير وطبيعي.
  fr.a1.unit53.lesson06.teach.nina_salut_tu:
    title: Nina تحيّي Mathieu
    gloss: 'Nina: مرحبًا، هل أنت Mathieu؟'
    note: 'سؤال تحية بسيط وغير رسمي: *Tu es ... ?*'
  fr.a1.unit53.lesson06.teach.mathieu_oui_ravi:
    title: Mathieu يردّ التحية على Nina
    gloss: 'Mathieu: نعم! تشرّفت بمعرفتك يا Nina.'
    note: '*Ravi de te rencontrer* عبارة معتادة عند اللقاء الأول فعلًا (*ravi* للرجل و*ravie* للمرأة)، وليست *content de te revoir* التي تقال لمن تعرفه من قبل.'
  fr.a1.unit53.lesson06.teach.nina_ravie_de:
    title: Nina تردّ التحية
    gloss: 'Nina: تشرفت بمعرفتك أنا أيضًا!'
    note: 'يختم الحوار: فقد تعرّف Mathieu على Nina بفضل وصف Camille السابق.'
