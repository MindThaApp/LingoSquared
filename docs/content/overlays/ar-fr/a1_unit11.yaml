course:
  title: الفرنسية A1
  description: اقتراح خطة بسيطة وقبولها ورفضها وتحديد موعدها، مع متابعة قصة ورشة الطبخ لدى إينيس وماتيو وهما يرتبان للتسوق معًا لشراء المكونات قبل حصة السبت. ومن النقاط البارزة أن *se retrouver* فعل انعكاسي تبادلي (يلتقي كل طرف بالآخر)، وأن *vers* مع الوقت تدل على موعد تقريبي لا دقيق.
