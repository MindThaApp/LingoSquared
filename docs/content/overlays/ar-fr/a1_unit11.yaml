teaching:
  fr.a1.unit11.lesson01.teach.libre:
    title: متاح / فارغ
    gloss: متاح / غير مشغول
    note: تصف *libre* هنا توفّر الشخص؛ أما ما لا يُدفع ثمنه فتستعمل الفرنسية له *gratuit*.
    example_gloss: هل أنت متفرغ يوم السبت؟
  fr.a1.unit11.lesson01.teach.occupe:
    title: مشغول
    gloss: مشغول
    note: 'نقيض *libre* مباشرة. ويتفق مع الجنس: *occupé* / *occupée*.'
    example_gloss: أنا مشغول مساء الجمعة.
  fr.a1.unit11.lesson01.teach.se_retrouver:
    title: يلتقي بـ
    gloss: يلتقي / يتقابل
    note: بهذا المعنى يكون *se retrouver* تبادليًا، أي يلتقي شخصان أو أكثر ببعضهم، بخلاف *trouver* (يجد).
    example_gloss: أين نلتقي هذا المساء؟
  fr.a1.unit11.lesson01.teach.vers:
    title: نحو (وقت ما)
    gloss: نحو / قرابة (وقت ما)
    note: تعبّر *Vers* مع الوقت عن ساعة تقريبية، وهي أخف من ذكر الساعة بدقة.
    example_gloss: سأمرّ نحو الساعة السابعة.
  fr.a1.unit11.lesson01.teach.ca_te_dit_de:
    title: ما رأيك في ...؟
    gloss: ما رأيك أن نتسوق معًا؟
    note: '*Ça te dit de... ?* مع الفعل في المصدر طريقة شائعة وعفوية لاقتراح نشاط، وهي أكثر استرخاءً من *Voulez-vous... ?*'
  fr.a1.unit11.lesson01.teach.venir_chercher:
    title: المجيء لاصطحاب شخص
    gloss: هل ستأتي لتقلّني نحو السادسة مساءً؟
    note: تعني *Venir chercher quelqu'un* المجيء لاصطحاب شخص، وليس مجرد «البحث».
  fr.a1.unit11.lesson01.teach.daccord_a_tout_a_lheure:
    title: موافق، أراك قريبًا
    gloss: حسنًا، أراك بعد قليل!
    note: '*D''accord* (موافق) تؤكد الخطة؛ و*à tout à l''heure* تُقال عند لقاء الشخص مجددًا في اليوم نفسه.'
  fr.a1.unit11.lesson02.teach.je_ne_peux_pas:
    title: رفض خطة
    gloss: لا أستطيع، أنا مشغول.
    note: '*Je ne peux pas* (لا أستطيع) مع ذكر السبب طريقة بسيطة ومهذبة للرفض.'
  fr.a1.unit11.lesson02.teach.avec_plaisir:
    title: القبول بسرور
    gloss: بكل سرور!
    note: '*Avec plaisir* (حرفيًا «بسرور») طريقة دافئة ومتحمسة لقبول دعوة.'
  fr.a1.unit11.lesson02.teach.a_quelle_heure_on_se_voit:
    title: السؤال عن الوقت
    gloss: في أي ساعة نلتقي؟
    note: '*On se voit* (حرفيًا «نرى بعضنا») بديل شائع وعفوي لـ *se retrouver* عند الاتفاق على لقاء.'
  fr.a1.unit11.lesson02.teach.devant_le_marche:
    title: اقتراح مكان
    gloss: أمام السوق، هل يناسبك ذلك؟
    note: تسأل *Ça te va ?* (هل يناسبك ذلك؟) الطرف الآخر إن كان التفصيل المقترح مقبولًا لديه.
  fr.a1.unit11.lesson02.teach.parfait_alors:
    title: تأكيد الخطة
    gloss: ممتاز، إذن إلى الجمعة!
    note: تعني *Alors* هنا «إذن» لتأكيد ما تم الاتفاق عليه وإنهاء ترتيب الموعد.
  fr.a1.unit11.lesson03.teach.line01:
    title: اقتراح التسوق معًا
    gloss: تسأل إينيس ماتيو إن كان يرغب في التسوق معًا قبل الورشة.
    note: يفتتح *Ça te dit de... ?* الحوار باقتراح عفوي.
  fr.a1.unit11.lesson03.teach.line02:
    title: القبول والسؤال عن المكان
    gloss: يقول ماتيو بكل سرور، ويسأل أين سيلتقيان.
    note: يجمع بين *Avec plaisir* (بكل سرور) و*se retrouver* (يلتقي).
  fr.a1.unit11.lesson03.teach.line03:
    title: اقتراح مكان ويوم
    gloss: تقترح إينيس اللقاء أمام السوق مساء الجمعة.
    note: اقتراح قصير يجمع المكان (*devant le marché*) واليوم (*vendredi soir*).
  fr.a1.unit11.lesson03.teach.line04:
    title: القبول والسؤال عن الساعة
    gloss: يوافق ماتيو ويسأل عن الساعة.
    note: '*D''accord* تؤكد المكان واليوم؛ ويحدد سؤال المتابعة الساعة بدقة.'
  fr.a1.unit11.lesson03.teach.line05:
    title: اقتراح ساعة محددة
    gloss: تسأل إينيس ماتيو إن كان سيأتي لاصطحابها نحو السادسة مساءً.
    note: تُستعمل *venir chercher* مع *vers* وساعة محددة.
  fr.a1.unit11.lesson03.teach.line06:
    title: تأكيد كل شيء
    gloss: يقول ماتيو ممتاز، إلى الجمعة إذن، السادسة مساءً أمام السوق.
    note: يعيد ذكر تفاصيل الخطة الثلاثة (اليوم والساعة والمكان) معًا لإنهاء الحوار بوضوح.
