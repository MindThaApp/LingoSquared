teaching:
  fr.a1.unit49.lesson01.teach.content_triste_en:
    title: سعيد وحزين وغاضب
    gloss: سعيد، حزين، غاضب
    note: ثلاث كلمات أساسية للمشاعر تُستعمل مع الفعل *être* (يكون)؛ لكلمة *content* مؤنث هو *contente*، أما *triste* و*en colère* فلا تتغيران.
    example_gloss:
    - أنا سعيد.
    - أنا حزين.
    - أنا غاضب.
  fr.a1.unit49.lesson01.teach.je_suis_content:
    title: قول إنك سعيد
    gloss: أنا سعيد.
    note: النمط الأساسي في الفرنسية هو الفعل *Être* (يكون) + صفة تدل على الشعور، وهو يُستعمل دائمًا، بخلاف العربية التي تكتفي فيها الجملة الاسمية بالمبتدأ والخبر دون فعل.
  fr.a1.unit49.lesson01.teach.je_ne_suis:
    title: المقارنة بين مشاعر
    gloss: لست غاضبًا، أنا حزين.
    note: تحيط *Ne ... pas* بالفعل؛ ثم تذكر الجملة الثانية الشعور الحقيقي.
  fr.a1.unit49.lesson02.teach.pourquoi_es_tu:
    title: السؤال عن السبب
    gloss: لماذا أنت سعيد؟
    note: '*Pourquoi* (لماذا) هي أداة الاستفهام المعتادة للسؤال عن السبب.'
  fr.a1.unit49.lesson02.teach.je_suis_content:
    title: ذكر السبب
    gloss: أنا سعيد لأن لدي شقة جديدة.
    note: تُدخل *Parce que* (لأن) جملة السبب؛ وقبل *il* تُختصر إلى *parce qu'*.
  fr.a1.unit49.lesson02.teach.je_suis_triste:
    title: سبب سلبي
    gloss: أنا حزين لأن المطر يهطل.
    note: نعيد استعمال *il pleut* (تمطر) من وحدة الطقس لتكون جملة السبب.
  fr.a1.unit49.lesson03.teach.nerveux:
    title: متوتر
    gloss: متوتر
    note: الكلمة المعتادة للتعبير عن التوتر.
    example_gloss: أنا متوتر قبل أول مناوبة لي.
  fr.a1.unit49.lesson03.teach.je_suis_nerveux:
    title: ذكر سبب توترك
    gloss: أنا متوتر قبل أول مناوبة لي.
    note: تُستعمل *Avant* (وتعني حرفيًا «قبل») لتحديد ما يُسبب التوتر، بينما نقول في العربية عادةً «من» أو «بسبب».
  fr.a1.unit49.lesson03.teach.ne_t_inquiete:
    title: طمأنة شخص ما
    gloss: لا تقلق.
    note: '*Ne t''inquiète pas* (حرفيًا «لا تقلق نفسك») عبارة ثابتة معتادة للطمأنة؛ والفعل *s''inquiéter* فعل انعكاسي.'
  fr.a1.unit49.lesson04.teach.comment_se_sent:
    title: السؤال عن شعور شخص ما
    gloss: كيف يشعر ماتيو؟
    note: '*Se sentir* (يشعر، فعل انعكاسي) هو الطريقة المعتادة للسؤال عن الحالة الشعورية أو وصفها؛ ويظهر أيضًا في وحدة الصحة.'
  fr.a1.unit49.lesson04.teach.il_se_sent:
    title: وصف شعور شخص ما
    gloss: إنه يشعر بالتوتر.
    note: '*Se* ضمير انعكاسي للغائب المفرد، ويأتي مع *sent*.'
  fr.a1.unit49.lesson04.teach.pourquoi_se_sent:
    title: السؤال عن سبب شعور شخص ما
    gloss: لماذا يشعر بالتوتر؟
    note: تجمع الجملة بين *pourquoi* و*se sentir* من *Il se sent nerveux*؛ وتُكتب *sent-il* بواصلة.
  fr.a1.unit49.lesson05.teach.salut_camille_je:
    title: اقرأ رسالة عن المشاعر
    gloss: مرحبًا كاميل، أنا متوتر قليلًا قبل أول مناوبة لي وحدي. لكنني سعيد أيضًا، لأن لدي عملًا جديدًا وشقة جديدة. أظن أن كل شيء سيكون على ما يرام.
    note: تتبّع سبب توتر الكاتب، وما يسعده، ونظرته العامة.
    glosses:
      peu: قليلًا
      nerveux: متوتر
      premier: أول
      service: مناوبة
      seul: وحده
      content: سعيد
      car: لأن
      nouveau: جديد
      travail: عمل
      nouvel: جديد
      appartement: شقة
      pense: يظن
      aller: سيكون على ما يرام
  fr.a1.unit49.lesson06.teach.camille_salut_mathieu:
    title: كاميل تسأل ماتيو عن شعوره
    gloss: 'كاميل: مرحبًا ماتيو، كيف تشعر قبل أول مناوبة لك؟'
    note: تعيد *Avant ton premier service* (قبل أول مناوبة لك) استعمال نمط *avant* + اسم من الدرس 3.
  fr.a1.unit49.lesson06.teach.mathieu_je_suis:
    title: ماتيو يعترف بأنه متوتر
    gloss: 'ماتيو: أنا متوتر قليلًا، بصراحة.'
    note: تُخفف *Honnêtement* (بصراحة) من وقع الاعتراف.
  fr.a1.unit49.lesson06.teach.camille_ne_t:
    title: كاميل تطمئنه
    gloss: 'كاميل: لا تقلق، ستنجح في ذلك!'
    note: '*Tu vas y arriver* (حرفيًا «ستصل إلى هناك») عبارة ثابتة للتشجيع؛ و*aller* + المصدر يشكّلان المستقبل القريب.'
  fr.a1.unit49.lesson06.teach.mathieu_merci_ca:
    title: ماتيو يشكرها
    gloss: 'ماتيو: شكرًا، هذا يساعدني حقًا.'
    note: '*Aide* هي صيغة *il/elle* من الفعل *aider* (يساعد)؛ و*m''* تقوم مقام *me*.'
  fr.a1.unit49.lesson06.teach.camille_et_apres:
    title: كاميل تتوقع النتيجة
    gloss: 'كاميل: وبعد ذلك ستكون بالتأكيد سعيدًا جدًا وفخورًا.'
    note: تعبّر *Sûrement* (بالتأكيد) عن توقع واثق؛ و*fier* (فخور) صفة جديدة ومفيدة.
  fr.a1.unit49.lesson06.teach.mathieu_oui_je:
    title: ماتيو يوافق
    gloss: 'ماتيو: نعم، أظن ذلك أيضًا.'
    note: '*Je pense aussi* هي الطريقة الطبيعية للموافقة على رأي شخص ما.'
  fr.a1.unit49.lesson06.teach.il_remplace_mathieu:
    title: التلخيص باستعمال il وelle وl'
    gloss: ماتيو متوتر قبل أول مناوبة له. كاميل تساعده.
    note: '*Il* يحل محل اسم رجل (*il est nerveux*)، و*elle* يحل محل اسم امرأة، و*l''* (*elle l''aide*) تعني «إياه»: ثلاث كلمات صغيرة لكنها أساسية للحديث عن شخص آخر.'
