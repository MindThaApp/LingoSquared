teaching:
  fr.a1.unit05.lesson01.teach.poulet:
    title: الدجاج
    gloss: دجاج
    note: كلمة *poulet* مذكّرة.
    example_gloss: أودّ بعض الدجاج.
  fr.a1.unit05.lesson01.teach.poisson:
    title: السمك
    gloss: سمك
    note: كلمة *poisson* مذكّرة.
    example_gloss: السمك طازج اليوم.
  fr.a1.unit05.lesson01.teach.salade:
    title: السلطة
    gloss: سلطة
    note: كلمة *salade* مؤنّثة.
    example_gloss: إنها تأكل سلطة.
  fr.a1.unit05.lesson01.teach.riz:
    title: الأرز
    gloss: أرز
    note: كلمة *riz* مذكّرة وثابتة الشكل، فكتابتها واحدة في المفرد والجمع، مثل *prix*.
    example_gloss: الأرز يلائم الدجاج جيدًا.
  fr.a1.unit05.lesson01.teach.eau:
    title: الماء
    gloss: ماء
    note: كلمة *eau* مؤنّثة، وتُحذف حركة أداة التعريف *l'* قبل صوتها المتحرك، على النمط نفسه في *l'addition* لاحقًا في هذه الوحدة.
    example_gloss: أودّ بعض الماء من فضلك.
  fr.a1.unit05.lesson01.teach.vin:
    title: النبيذ
    gloss: نبيذ
    note: كلمة *vin* مذكّرة.
    example_gloss: النبيذ الأحمر لذيذ.
  fr.a1.unit05.lesson01.teach.je_voudrais_poulet_salade:
    title: اطلب الدجاج والسلطة
    gloss: أودّ دجاجًا وسلطة.
    note: '*Du poulet* (مذكّر) و*de la salade* (مؤنّث) أداتا تبعيض تدلّان على «بعض» وتتوافقان مع جنس الاسم، بخلاف ما بعد الكمية (*un kilo de*) حيث تُستعمل *de* وحدها.'
  fr.a1.unit05.lesson02.teach.dessert:
    title: Dessert
    gloss: الحلوى
    note: كلمة *dessert* مذكّرة.
    example_gloss: الحلوى مجانية اليوم.
  fr.a1.unit05.lesson02.teach.addition:
    title: الفاتورة
    gloss: الحساب؛ الفاتورة
    note: كلمة *addition* مؤنّثة، وتُحذف حركة *l'* قبل صوتها المتحرك. هذا هو التعبير المعتاد في المطاعم الفرنسية، وليس *facture* التي تعني فاتورة رسمية.
    example_gloss: الحساب من فضلك.
  fr.a1.unit05.lesson02.teach.vous_avez_choisi:
    title: اسأل إن كانوا قد اختاروا
    gloss: هل اخترتم؟
    note: سؤال النادل المعتاد عند اقترابه من الطاولة لأخذ الطلب، وهو بصيغة الماضي المركّب من الفعل *choisir* (اختار).
  fr.a1.unit05.lesson02.teach.je_voudrais_un_cafe:
    title: اطلب قهوة
    gloss: أودّ قهوة من فضلك.
    note: '*Je voudrais* + الشيء المطلوب، هو النمط نفسه المستعمل عند التسوّق، وهنا للطعام والشراب.'
  fr.a1.unit05.lesson02.teach.qcq_comme_dessert:
    title: اسأل عمّا هو متوفر
    gloss: ماذا لديكم من الحلويات؟
    note: '*Qu''est-ce que vous avez comme...?* طريقة طبيعية وشائعة للسؤال عن الخيارات ضمن صنف معيّن.'
  fr.a1.unit05.lesson02.teach.cest_delicieux:
    title: قل إن الطعام لذيذ
    gloss: إنه لذيذ!
    note: ردّ فعل شائع ومتحمّس تجاه الطعام. كلمة *délicieux* لا تتغيّر هنا لأن *c'est* لا تتبعها كلمة لها جنس.
  fr.a1.unit05.lesson03.teach.line01:
    title: التحية وسؤال الاستعداد للطلب
    gloss: يحيّيهما النادل ويسأل إن كانا قد اختارا.
    note: يبدأ بكلمة *Bonjour*، وهي التحية المهذّبة عند التعامل مع الخدمة.
  fr.a1.unit05.lesson03.teach.line02:
    title: طلب سلطة وماء
    gloss: تطلب إينيس سلطة وماءً.
    note: تجمع *je voudrais* مع *et* لربط عنصرين مطلوبين في جملة واحدة.
  fr.a1.unit05.lesson03.teach.line03:
    title: طلب الدجاج مع الأرز
    gloss: يطلب ماتيو دجاجًا مع أرز.
    note: تربط *Avec* (مع) الطبق الرئيسي بما يرافقه، وهي صيغة بسيطة وشائعة في الطلب.
  fr.a1.unit05.lesson03.teach.line04:
    title: التأكيد والسؤال عن المشروبات
    gloss: يؤكّد النادل الطلب ويسأل عن المشروبات.
    note: تعيد *Et comme boisson pour vous ?* استعمال النمط *comme* من *Qu'est-ce que vous avez comme dessert ?*، وهنا للمشروبات.
  fr.a1.unit05.lesson03.teach.line05:
    title: طلب كأس نبيذ
    gloss: يطلب ماتيو كأسًا من النبيذ الأحمر.
    note: '*Un verre de* (كأس من) هي الطريقة المعتادة لطلب النبيذ بالكأس.'
  fr.a1.unit05.lesson03.teach.line06:
    title: التعليق على الطعام
    gloss: تقول إينيس إن السلطة لذيذة.
    note: تعيد استعمال *C'est délicieux !* لكن على طبق محدّد (*cette salade*). تبقى *Délicieux* مذكّرة بعد *c'est* مع أن *salade* مؤنّثة، والبديل المتوافق هو *Elle est délicieuse, cette salade !*.
  fr.a1.unit05.lesson03.teach.line07:
    title: يشرح جوعهما ويطلب الحساب
    gloss: يقول ماتيو إن الورشة أجاعتهما ويطلب الحساب.
    note: عبارة *Nous a donné faim* (حرفيًا «أعطتنا جوعًا») هي الطريقة الفرنسية الطبيعية للقول إن شيئًا ما أجاعنا.
  fr.a1.unit05.lesson03.teach.line08:
    title: تأكيد قرب إحضار الحساب
    gloss: يؤكّد النادل أنه سيحضره فورًا.
    note: '*Tout de suite* (فورًا) عبارة شائعة ومطمئنة عند التعامل مع الخدمة.'
