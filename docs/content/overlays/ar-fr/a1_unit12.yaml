teaching:
  fr.a1.unit12.lesson01.teach.jai_prepare:
    title: حضّرتُ
    gloss: حضّرتُ / صنعتُ
    note: 'تكوّن أفعال -ER المنتظمة اسم المفعول في passé composé بإضافة *-é*: *préparer* ← *préparé*، مع الفعل المساعد *avoir*.'
    example_gloss: صنعتُ كعكة للورشة.
  fr.a1.unit12.lesson01.teach.jai_achete:
    title: اشتريتُ
    gloss: اشتريتُ
    note: يتبع *Acheter* النمط نفسه *avoir* + *-é* مثل *préparer*.
    example_gloss: اشتريتُ خضراوات من السوق.
  fr.a1.unit12.lesson01.teach.jai_oublie:
    title: نسيتُ
    gloss: نسيتُ
    note: '*Oublier* ← *oublié*، النمط المنتظم نفسه مرة أخرى.'
    example_gloss: نسيتُ الزبدة في البيت!
  fr.a1.unit12.lesson01.teach.tu_as_aime:
    title: أحببتَ
    gloss: أحببتَ
    note: '*Tu as* + اسم المفعول هي صيغة المخاطب *tu* من البناء نفسه مع *avoir*.'
    example_gloss: هل أعجبتك الكعكة؟
  fr.a1.unit12.lesson01.teach.il_a_goute:
    title: تذوّق
    gloss: تذوّق
    note: '*Il a* + اسم المفعول هي صيغة الغائب *il*؛ يتغيّر الفعل المساعد *avoir* بحسب الفاعل، ويبقى اسم المفعول كما هو.'
    example_gloss: تذوّق ماتيو الصلصة.
  fr.a1.unit12.lesson01.teach.grammar_avoir_participe:
    title: avoir + اسم المفعول
    gloss: avoir + اسم المفعول (-é)
    note: تكوّن معظم الأفعال الفرنسية الـ passé composé بالفعل المساعد *avoir* متبوعًا باسم مفعول ينتهي بـ *-é* في أفعال -ER المنتظمة.
  fr.a1.unit12.lesson01.teach.la_semaine_derniere:
    title: الأسبوع الماضي
    gloss: الأسبوع الماضي
    note: تتطابق *Dernière* (الماضية) مع *semaine* المؤنثة؛ أما صيغة المذكر فهي *dernier*، كما في *samedi dernier* (السبت الماضي).
    example_gloss: الأسبوع الماضي، صنعتُ كعكة.
  fr.a1.unit12.lesson02.teach.je_suis_arrive:
    title: وصلتُ
    gloss: وصلتُ
    note: '*Arriver* من مجموعة صغيرة من الأفعال (معظمها أفعال حركة) تأخذ *être* بدل *avoir* فعلًا مساعدًا.'
    example_gloss: وصلتُ متأخرًا إلى الورشة.
  fr.a1.unit12.lesson02.teach.je_suis_alle:
    title: ذهبتُ
    gloss: ذهبتُ
    note: 'يأخذ *Aller* أيضًا *être*. ويتطابق اسم المفعول مع الفاعل: *allé* للمذكر أو *allée* للمؤنث، كما ستقول إينيس.'
    example_gloss: ذهبتُ إلى السوق قبل الورشة.
  fr.a1.unit12.lesson02.teach.il_est_reste:
    title: بقي
    gloss: بقي
    note: '*Rester* (بقي) فعل آخر يأخذ *être* فعلًا مساعدًا، ويتبع نمط التطابق نفسه.'
    example_gloss: بقي ماتيو لتنظيف المطبخ.
  fr.a1.unit12.lesson02.teach.grammar_etre_accord:
    title: être + تطابق اسم المفعول
    gloss: être + اسم المفعول (يتطابق مع الفاعل)
    note: مع الأفعال التي تأخذ *être* فعلًا مساعدًا، يتطابق اسم المفعول مع الفاعل في الجنس والعدد، بخلاف الأفعال التي تأخذ *avoir*.
  fr.a1.unit12.lesson02.teach.en_retard:
    title: متأخرًا
    gloss: متأخرًا
    note: تصف *En retard* الوصول بعد الموعد المتوقع، وكثيرًا ما تأتي مع *arriver*.
    example_gloss: وصلت الحافلة متأخرة.
  fr.a1.unit12.lesson02.teach.finalement:
    title: أخيرًا / في النهاية
    gloss: أخيرًا / في النهاية
    note: تختم *Finalement* قصة قصيرة وتشير إلى النتيجة النهائية بعد المشكلات السابقة.
    example_gloss: في النهاية، كانت الكعكة لذيذة.
  fr.a1.unit12.lesson02.teach.quest_ce_qui_sest_passe:
    title: ماذا حدث؟
    gloss: ماذا حدث؟
    note: '*Qu''est-ce qui s''est passé ?* هي الطريقة المعتادة لسؤال «ماذا حدث؟».'
    example_gloss: ماذا حدث في الورشة؟
  fr.a1.unit12.lesson03.teach.line01:
    title: اسأل عمّا حدث
    gloss: تسأل إينيس عمّا حدث في ورشة السبت الماضي، فهي لم تتمكّن من الحضور.
    note: '*Qu''est-ce qui s''est passé ?* (ماذا حدث؟) هي الطريقة المعتادة للسؤال عن حدث ماضٍ.'
  fr.a1.unit12.lesson03.teach.line02:
    title: احكِ ما جرى من خلل
    gloss: 'يقول ماتيو: يا للهول! لقد وصل متأخرًا ونسي الزبدة في البيت!'
    note: 'صيغتان من passé composé في جملة واحدة: مع *être* (*je suis arrivé*) ومع *avoir* (*j''ai oublié*).'
  fr.a1.unit12.lesson03.teach.line03:
    title: اسأل عمّا فعل
    gloss: تسأل إينيس عمّا فعله بعد ذلك.
    note: '*Qu''est-ce que tu as fait ?* (ماذا فعلتَ؟) تستعمل صيغة passé composé الشاذة للفعل *faire*.'
  fr.a1.unit12.lesson03.teach.line04:
    title: صِف الحل
    gloss: يقول ماتيو إنه ذهب بسرعة إلى البقالة القريبة.
    note: تستعمل *L'épicerie du coin* (البقالة القريبة) كلمة *coin* (الزاوية) كما في *au coin de la rue*.
  fr.a1.unit12.lesson03.teach.line05:
    title: اسأل هل نجح الأمر
    gloss: تسأل إينيس هل وجد زبدة هناك.
    note: '*Tu as trouvé... ?* (هل وجدتَ...؟) سؤال منتظم آخر مع الفعل المساعد *avoir*.'
  fr.a1.unit12.lesson03.teach.line06:
    title: النهاية السعيدة
    gloss: 'يقول ماتيو: نعم، وفي النهاية كانت الكعكة لذيذة!'
    note: يختم القصة بنبرة إيجابية باستعمال *finalement*، فتُحَلّ المشكلة السابقة.
