course:
  title: الفرنسية A1
  description: سرد موجز لحدث وقع مؤخرًا وانتهى، باستعمال passé composé مع الفعلين المساعدين avoir و être، ومتابعةً لحكاية ورشة الطبخ بين إينيس وماتيو، إذ يروي ماتيو ما وقع من خلل في حصة السبت الماضي. تتميّز الفرنسية بفعلين مساعدين مختلفين (avoir لمعظم الأفعال، و être لمجموعة صغيرة منها مثل aller/arriver/rester)، بينما يُصاغ الماضي في العربية بفعل واحد مصرَّف دون فعل مساعد، مثل «وصلتُ». ويتطابق اسم المفعول مع الفاعل في الجنس عند استعمال être (arrivé/arrivée).
units:
