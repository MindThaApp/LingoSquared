teaching:
  fr.a1.unit04.lesson01.teach.marche:
    title: السوق
    gloss: السوق
    note: كلمة *marché* مذكّرة.
    example_gloss: السوق مفتوح أيام السبت.
  fr.a1.unit04.lesson01.teach.boulangerie:
    title: المخبز
    gloss: المخبز
    note: كلمة *boulangerie* مؤنّثة؛ وهي المحلّ المخصّص للخبز تحديدًا، وتختلف عن *pâtisserie* (محلّ الحلويات).
    example_gloss: توجد مخبزة جيّدة قريبة من هنا.
  fr.a1.unit04.lesson01.teach.legumes:
    title: الخضروات
    gloss: خضروات
    note: كلمة *légumes* مذكّرة وجمع.
    example_gloss: أشتري خضروات طازجة للورشة.
  fr.a1.unit04.lesson01.teach.fruits:
    title: الفاكهة
    gloss: فواكه
    note: كلمة *fruits* مذكّرة وجمع. تستعمل الفرنسية الجمع (*les fruits*) في الحديث عن الفاكهة عمومًا، بينما تستعمل العربية غالبًا الاسم الجمعي المفرد «الفاكهة».
    example_gloss: الفاكهة غالية هذا الشهر.
  fr.a1.unit04.lesson01.teach.prix:
    title: السعر
    gloss: السعر
    note: 'كلمة *prix* مذكّرة وثابتة الشكل: تُكتب بالطريقة نفسها في المفرد والجمع.'
    example_gloss: كم سعر الخبز؟
  fr.a1.unit04.lesson01.teach.cher:
    title: غالٍ
    gloss: غالٍ
    note: '*Cher* هو صيغة المذكّر؛ و*chère* للمؤنّث، و*chers*/*chères* للجمع، وتتبع الصفةُ الاسمَ الذي تصفه.'
    example_gloss: هذه الجبنة غالية جدًّا.
  fr.a1.unit04.lesson01.teach.pas_cher:
    title: ليست غالية اليوم
    gloss: الخضروات ليست غالية اليوم.
    note: عبارة *pas cher(s)* (بحذف *ne*) هي الطريقة الشائعة في الكلام للقول إن الشيء رخيص؛ أمّا الصيغة الكاملة في الكتابة فهي *ne sont pas chers*.
  fr.a1.unit04.lesson02.teach.un_kilo_de:
    title: كيلوغرام من
    gloss: كيلوغرام من
    note: تأتي *de* بعد الكمّية مباشرةً دون أداة تعريف؛ انظر ملاحظة *de after quantity* في القواعد أدناه.
    example_gloss: أودّ كيلوغرامًا من الطماطم.
  fr.a1.unit04.lesson02.teach.un_litre_de:
    title: لتر من
    gloss: لتر من
    note: كلمة *Litre* مذكّرة، وتُستعمل للسوائل كما تُستعمل *kilo* للمواد الصلبة.
    example_gloss: لترًا من الحليب، من فضلك.
  fr.a1.unit04.lesson02.teach.euro:
    title: يورو واحد
    gloss: يورو واحد
    note: 'تُجمع كلمة *Euro* جمعًا عاديًّا بإضافة s: *deux euros*، *cinq euros*.'
    example_gloss: هذا يكلّف خمسة يورو.
  fr.a1.unit04.lesson02.teach.de_after_quantity:
    title: de بعد الكمّية
    gloss: من
    note: 'بعد كلمة تدلّ على كمّية صريحة (*un kilo*، *un litre*، *beaucoup* كما في *beaucoup de cousins*) تستعمل الفرنسية *de* وحدها، وتحذف *du*/*de la*/*des* تمامًا: نقول *un kilo de tomates* ولا نقول أبدًا *un kilo des tomates*.'
  fr.a1.unit04.lesson02.teach.combien_ca_coute:
    title: اسأل عن السعر
    gloss: كم يكلّف؟
    note: تركيب *Combien* (كم) مع *ça coûte* (يكلّف) هو الطريقة العامة للسؤال عن أيّ سعر.
  fr.a1.unit04.lesson02.teach.cest_combien_pain:
    title: السؤال عن سعر سلعة محدّدة
    gloss: بكم الخبز؟
    note: تذكر صيغة *C'est combien, [item] ?* السلعة المقصودة بالاسم، وهي بديل شائع من *Combien ça coûte ?*.
  fr.a1.unit04.lesson02.teach.ca_fait_combien:
    title: السؤال عن المجموع
    gloss: كم يبلغ المجموع؟
    note: يُسأل بـ*Ça fait combien ?* عن الحساب الإجمالي، وعادةً ما يكون ذلك في نهاية الشراء لا عن سلعة واحدة.
  fr.a1.unit04.lesson03.teach.line01:
    title: طلب الطماطم
    gloss: تُحيّي إينيس البائع وتطلب كيلوغرامًا من الطماطم.
    note: تجمع بين *Bonjour* ونمط *je voudrais* + الكمّية.
  fr.a1.unit04.lesson03.teach.line02:
    title: اسأل إن كان يلزم شيء آخر
    gloss: يوافق البائع ويسألها إن كانت تريد شيئًا آخر.
    note: '*Autre chose ?* (أيّ شيء آخر؟) هو السؤال المعتاد الذي يطرحه البائع بعد الطلب.'
  fr.a1.unit04.lesson03.teach.line03:
    title: إضافة الجبنة والسؤال عن سعرها
    gloss: تضيف إينيس قليلًا من الجبنة وتسأل عن سعرها.
    note: 'تستعمل عبارة *Un peu de fromage* (قليل من الجبنة) النمط نفسه الذي في *un kilo de*: *de* وحدها دون أداة.'
  fr.a1.unit04.lesson03.teach.line04:
    title: ذكر السعر للكيلوغرام
    gloss: يقول البائع إن سعر الكيلوغرام ثمانية يورو.
    note: صيغة *X euros le kilo* هي الطريقة الفرنسية الطبيعية لذكر سعر الوحدة، وتعني *le* هنا «لكلّ» لا أداة التعريف.
  fr.a1.unit04.lesson03.teach.line05:
    title: شرح سبب حاجته إلى الخبز هنا
    gloss: يقول ماتيو إنه يريد خبزًا أيضًا، لكن المخبزة مغلقة اليوم.
    note: '*Fermée* (مغلقة) صيغة المؤنّث، لأنها تتبع *la boulangerie*.'
  fr.a1.unit04.lesson03.teach.line06:
    title: اقتراح بديل
    gloss: تطمئنه إينيس بأنه يمكن شراء الخبز من هنا أيضًا.
    note: '*On peut* (يمكننا) + المصدر طريقة شائعة وغير رسمية للتعبير عن الإمكانية.'
  fr.a1.unit04.lesson03.teach.line07:
    title: التأكيد وذكر المجموع
    gloss: يؤكّد البائع أن عنده خبزًا طازجًا، ويحسب المجموع، ثم يقول إنه ثلاثة عشر يورو وخمسون سنتًا.
    note: '*Ça fait combien en tout ?* هنا يقولها البائع وهو يحسب بصوت مسموع قبل ذكر المجموع، وليس سؤالًا موجّهًا إلى إينيس.'
  fr.a1.unit04.lesson03.teach.line08:
    title: اشكر البائع
    gloss: تشكره إينيس بحرارة وهي تدفع.
    note: تُقال *Voilà* هنا عند تسليم المبلغ، وهي كلمة تصاحب هذه الحركة عادةً.
