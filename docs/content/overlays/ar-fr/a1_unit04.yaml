course:
  title: الفرنسية A1
  description: 'مفردات السوق، والسؤال عن الأسعار والكميات باستعمال combien/kilo/litre، والتباين بين du/de la وde وحدها بعد عبارات الكمية، مع متابعة قصة ورشة الطبخ لدى Inès وMathieu في مشهد تسوّق من السوق. تحذف الفرنسية أداة التبعيض تماماً بعد كمية صريحة: un kilo de tomates وليس un kilo des tomates.'
