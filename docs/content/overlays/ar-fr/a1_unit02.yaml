course:
  title: الفرنسية A1
  description: الأعداد من 0 إلى 100 (بما فيها صيغ soixante-dix وquatre-vingts وquatre-vingt-dix)، والأعمار، وأرقام الهاتف، ومقادير الوصفات، استكمالًا لقصة إينيس وماتيو في ورشة الطبخ من الوحدة الأولى. ويركّز الشرح على التعبير عن العمر بالفعل avoir، وبقايا العدّ بالعشرين في الأعداد الفرنسية، والمطابقة في الجنس داخل عبارات الكمية.
units:
  fr.a1.unit02.numbers:
    title: الأعداد في المطبخ
