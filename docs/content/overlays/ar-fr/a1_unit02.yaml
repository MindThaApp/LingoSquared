  fr.a1.unit02.lesson06.recipe_count_dialogue:
    title: عدّ المكوّنات مع إينيس وماتيو
teaching:
  fr.a1.unit02.lesson01.teach.zero:
    title: صفر
    gloss: صفر
    note: تُستخدم *Zéro* عددًا قائمًا بذاته ورقمًا عند قراءة سلسلة أرقام بصوت عالٍ.
  fr.a1.unit02.lesson01.teach.un:
    title: واحد
    gloss: واحد
    note: '*Un* مذكر؛ وتظهر صيغة المؤنث *une* قبل اسم مؤنث (*une tasse*، أي فنجان واحد). وعند العدّ المجرد تبقى *un*.'
  fr.a1.unit02.lesson01.teach.deux:
    title: اثنان
    gloss: اثنان
    note: لا تتغير *Deux* مهما كان جنس الاسم.
  fr.a1.unit02.lesson01.teach.trois:
    title: ثلاثة
    gloss: ثلاثة
    note: '*Trois* ثابتة لا تتغير.'
  fr.a1.unit02.lesson01.teach.quatre:
    title: أربعة
    gloss: أربعة
    note: '*Quatre* ثابتة لا تتغير.'
  fr.a1.unit02.lesson01.teach.cinq:
    title: خمسة
    gloss: خمسة
    note: '*Cinq* ثابتة لا تتغير. وعادةً يُنطق حرف q الأخير، بخلاف الحروف الساكنة الأخيرة في عدة أعداد فرنسية أخرى.'
  fr.a1.unit02.lesson01.teach.six:
    title: Six
    gloss: ستة
    note: تُنطق *Six* بصوت /s/ في آخرها حين تُقال وحدها، لكن هذا الحرف الأخير يسقط قبل اسم يبدأ بحرف ساكن (تُنطق *six livres* مثل "si livres").
  fr.a1.unit02.lesson01.teach.sept:
    title: سبعة
    gloss: سبعة
    note: '*Sept* ثابتة لا تتغير؛ حرف p صامت ولا يُنطق إلا حرف t الأخير.'
  fr.a1.unit02.lesson01.teach.huit:
    title: ثمانية
    gloss: ثمانية
    note: '*Huit* ثابتة لا تتغير. وحرف h صامت، كما في معظم الكلمات الفرنسية.'
  fr.a1.unit02.lesson01.teach.neuf:
    title: تسعة
    gloss: تسعة
    note: '*Neuf* ثابتة لا تتغير.'
  fr.a1.unit02.lesson01.teach.dix:
    title: عشرة
    gloss: عشرة
    note: تُنطق *Dix* بصوت /s/ في آخرها حين تُقال وحدها، وتتبع نمط *six* نفسه في سقوط الحرف الأخير قبل حرف ساكن.
  fr.a1.unit02.lesson02.teach.onze:
    title: أحد عشر
    gloss: أحد عشر
    note: الأعداد من *Onze* إلى *seize* (11-16) كلمات مستقلة، وليست مبنيّة على *dix* كما تعيد الأعداد من واحد وعشرين فصاعدًا استخدام *vingt*.
  fr.a1.unit02.lesson02.teach.douze:
    title: اثنا عشر
    gloss: اثنا عشر
    note: '*Douze* كلمة واحدة. تشبه *deux* في بدايتها، لكن لا أثر ظاهرًا لـ *dix* فيها.'
  fr.a1.unit02.lesson02.teach.treize:
    title: ثلاثة عشر
    gloss: ثلاثة عشر
    note: '*Treize* كلمة واحدة. تُذكّر بـ*trois* في بدايتها، لكن لا يظهر فيها *dix* بوضوح.'
  fr.a1.unit02.lesson02.teach.quatorze:
    title: أربعة عشر
    gloss: أربعة عشر
    note: '*Quatorze* كلمة واحدة. تُذكّر بـ*quatre* في بدايتها، لكن لا يظهر فيها *dix* بوضوح.'
  fr.a1.unit02.lesson02.teach.quinze:
    title: خمسة عشر
    gloss: خمسة عشر
    note: '*Quinze* كلمة واحدة، وهي مرتبطة من بعيد بـ*cinq*، لكن لا يظهر فيها *dix* بوضوح.'
  fr.a1.unit02.lesson02.teach.seize:
    title: ستة عشر
    gloss: ستة عشر
    note: '*Seize* هي آخر الأعداد المندمجة من هذا النوع؛ ابتداءً من *dix-sept* (17) يعود *dix* إلى الظهور بوضوح مركّبًا مع الآحاد.'
  fr.a1.unit02.lesson02.teach.vingt:
    title: عشرون
    gloss: عشرون
    note: '*Vingt* كلمة قائمة بذاتها. ابتداءً من الواحد والعشرين تُركَّب العشرات مع الآحاد (*vingt et un*، *vingt-deux*) وفق نمط سنعود إليه لاحقًا.'
  fr.a1.unit02.lesson02.teach.trente:
    title: ثلاثون
    gloss: ثلاثون
    note: يرتبط *Trente* بالوحدة التي تليه بواصلة (*trente-quatre*)، إلا الواحد فيأخذ *et* بدلًا منها (*trente et un*).
  fr.a1.unit02.lesson02.teach.trente_quatre:
    title: أربعة وثلاثون
    gloss: أربعة وثلاثون
    note: تُكتب *Trente-quatre* بواصلة بين جزأيها.
  fr.a1.unit02.lesson02.teach.soixante:
    title: ستون
    gloss: ستون
    note: يسلك *Soixante* سلوك العشرات العادية (*soixante-quatre*، 64) حتى التاسع والستين؛ أما الجزء غير المنتظم فيبدأ من السبعين، وهو موضوع الدرس التالي.
  fr.a1.unit02.lesson02.teach.soixante_dix:
    title: سبعون
    gloss: سبعون
    note: 'هذه أكبر مفاجأة في الأعداد الفرنسية: لا توجد كلمة مستقلة للسبعين. تعني *Soixante-dix* حرفيًا «ستون وعشرة» (60 + 10). ويستمر العدّ بهذه الطريقة حتى *soixante-dix-neuf* (79، «ستون وتسعة عشر») ثم يبدأ *quatre-vingts* أساسًا جديدًا عند الثمانين.'
  fr.a1.unit02.lesson02.teach.quatre_vingts:
    title: ثمانون
    gloss: ثمانون
    note: تعني *Quatre-vingts* حرفيًا «أربع عشرينات» (4 × 20)، وهي بقية من نظام عدّ قديم أساسه 20. وتأخذ s في آخرها فقط حين تأتي وحدها أو في نهاية العدد (*quatre-vingts*، 80)؛ وتسقط s حين تليها وحدة (*quatre-vingt-un*، 81).
  fr.a1.unit02.lesson02.teach.quatre_vingt_dix:
    title: تسعون
    gloss: تسعون
    note: تعني *Quatre-vingt-dix* حرفيًا «أربع عشرينات وعشرة» (4×20 + 10)، وتتبع نمط العدّ نفسه القائم على 20 كما في السبعين، حتى *quatre-vingt-dix-neuf* (99).
  fr.a1.unit02.lesson02.teach.cent:
    title: مئة
    gloss: مئة
    note: '*Cent* هي الصيغة المستعملة للمئة بالضبط حين تأتي وحدها، دون أداة تنكير (لا نقول «*un cent*»).'
  fr.a1.unit02.lesson03.teach.quel_age_as_tu:
    title: السؤال عن العمر بصيغة غير رسمية
    gloss: كم عمرك؟
    note: تسأل الفرنسية حرفيًا عن العمر الذي «تملكه» باستعمال *avoir* (يملك)، لا باستعمال *être* (يكون).
  fr.a1.unit02.lesson03.teach.jai_vingt_huit_ans:
    title: ذكر عمرك
    gloss: عمري ثمانٍ وعشرون سنة.
    note: '*Ai* هي صيغة *avoir* مع je. ولا بدّ من ذكر *ans* (سنوات) في الجملة.'
  fr.a1.unit02.lesson03.teach.quel_age_avez_vous:
    title: السؤال عن العمر بصيغة رسمية
    gloss: كم عمرك؟
    note: يستعمل *Avez-vous* صيغة *vous* من *avoir*، بما يوافق الأسلوب الرسمي الذي ورد في الوحدة 1.
  fr.a1.unit02.lesson03.teach.jai_trente_et_un_ans:
    title: ذكر عمر مركّب
    gloss: عمري واحد وثلاثون عامًا.
    note: 'يستعمل *Trente et un* الحرف *et* (و) لا الواصلة، وهذا خاص بصيغ «الواحد» في الثلاثين والأربعين والخمسين والستين (*trente et un*، *quarante et un*، *cinquante et un*، *soixante et un*). أما الواحد والسبعون فيخرج عن هذا النمط: يُقال *soixante et onze* (ستون + أحد عشر) لا *soixante et un*، لأن السبعينات تواصل العدّ بصيغ *dix* حتى *soixante-dix-neuf* (79).'
  fr.a1.unit02.lesson03.teach.et_toi_quel_age:
    title: إعادة سؤال العمر
    gloss: وأنت، كم عمرك؟
    note: تفتتح *Et toi* السؤال المقابل؛ و*toi* (لا *tu*) هو الضمير المنفصل المؤكِّد الذي يُستعمل بعد *et*.
  fr.a1.unit02.lesson04.teach.quel_est_ton_numero:
    title: طلب رقم هاتف
    gloss: ما رقم هاتفك؟
    note: يتفق *Quel* مع الاسم المذكر *numéro*؛ أما الاسم المؤنث فيحتاج إلى *quelle*.
  fr.a1.unit02.lesson04.teach.numero_ines:
    title: رقم يُقرأ رقمًا رقمًا
    gloss: صفر، ستة، واحد، خمسة، صفر، اثنان، تسعة، سبعة، أربعة، ثلاثة
    note: أرقام الهاتف الفرنسية الحقيقية من عشرة أرقام، وتُقرأ عادةً مثنى مثنى (*zéro six*، *quinze*، *zéro deux*...). والأرقام في هذه الوحدة على الصيغة الحقيقية ذات الأرقام العشرة (06 15 02 97 43) لكنها تُقرأ رقمًا رقمًا لتتدرّب أولًا على الأرقام المفردة.
  fr.a1.unit02.lesson04.teach.cest_le:
    title: تقديم الرقم
    gloss: إنه...
    note: تُستعمل *Le* (أداة التعريف للمذكر) لأن *numéro* اسم مذكر.
  fr.a1.unit02.lesson04.teach.tu_peux_repeter:
    title: طلب التكرار
    gloss: هل يمكنك أن تكرر ذلك، من فضلك؟
    note: '*Peux* هي صيغة *tu* من *pouvoir* (يستطيع)، وهي مفيدة كلما مرّ رقم منطوق بسرعة فلم تلتقطه.'
  fr.a1.unit02.lesson04.teach.bien_sur:
    title: الموافقة بسرعة
    gloss: بالتأكيد؛ طبعًا
    note: '*Bien sûr* طريقة شائعة ودودة للموافقة على طلب.'
  fr.a1.unit02.lesson05.teach.jai_besoin_trois_oeufs:
    title: ذكر كمية مطلوبة
    gloss: أحتاج إلى ثلاث بيضات.
    note: '*J''ai besoin de* (حرفيًا «عندي حاجة إلى») هي طريقة الفرنسية للتعبير عن الحاجة، إذ تستعمل *avoir* بدل فعل واحد مخصّص.'
  fr.a1.unit02.lesson05.teach.combien_oeufs:
    title: السؤال عن عدد المطلوب
    gloss: كم بيضة تحتاج؟
    note: في *De combien d'œufs* تأتي *de combien* («كم من») قبل الاسم المعدود.
  fr.a1.unit02.lesson05.teach.deux_tasses_farine:
    title: ذكر كمية مقيسة
    gloss: كوبان من الدقيق
    note: 'تربط *De* وحدة القياس (*tasses*، أكواب) بما يُقاس (*farine*، الطحين)، وتقابل «من» في العربية: «كوبان من الطحين».'
  fr.a1.unit02.lesson05.teach.demi_tasse:
    title: ذكر نصف كمية
    gloss: نصف كوب من السكر
    note: تبقى *Demi-* ثابتة بوصفها سابقة قبل الاسم (*une demi-tasse*)، بخلاف الصفة *demi* بعد الاسم فهي تتفق معه (*une heure et demie*).
  fr.a1.unit02.lesson05.teach.jai_quatre_oeufs:
    title: ذكر ما هو متوفر
    gloss: لدي أربع بيضات على الطاولة.
    note: تخبر *J'ai* (عندي) بما هو متوفر بالفعل، وتختلف عن *j'ai besoin de* (أحتاج إلى) التي تخبر بما ما زال ناقصًا.
  fr.a1.unit02.lesson06.teach.line01:
    title: السؤال عن عدد البيض
    gloss: تسأل إينيس ماتيو كم بيضة يحتاج إليها لتحضير الوصفة.
    note: 'تستعمل إينيس وماتيو الآن *tu* بدل *vous* التي وردت في الوحدة 1: فبصفتهما زميلين في الورشة انتقلا سريعًا إلى الأسلوب غير الرسمي.'
  fr.a1.unit02.lesson06.teach.line02:
    title: ذكر المكونات
    gloss: يقول ماتيو إنه يحتاج إلى ثلاث بيضات وكوبين من الطحين.
    note: تذكر *J'ai besoin de* ما ما زال مطلوبًا للوصفة.
  fr.a1.unit02.lesson06.teach.line03:
    title: عرض ما هو متوفر
    gloss: تقول إينيس إن عندها أربع بيضات على الطاولة، وتسأله هل يحتاج إلى سكر أيضًا.
    note: تخبر *J'ai* بما لدى إينيس بالفعل، وهذا منفصل عمّا قال ماتيو إنه يحتاجه.
  fr.a1.unit02.lesson06.teach.line04:
    title: تأكيد كمية صغيرة
    gloss: يقول ماتيو نعم، قليلًا — نحو نصف كوب.
    note: تعني *Environ* هنا «نحو» أو «تقريبًا»، وهي تخفّف دقّة الكمية.
  fr.a1.unit02.lesson06.teach.line05:
    title: طلب رقم هاتف
    gloss: تقول إينيس ممتاز، ثم تسأل عن رقم هاتف ماتيو لتراسله بخصوص الدرس القادم.
    note: تشرح *Comme ça je t'écris* («حتى أراسلك») سبب السؤال، وهي عادة طبيعية في الحديث قبل طلب معلومات الاتصال.
  fr.a1.unit02.lesson06.teach.line06:
    title: ذكر رقم الهاتف
    gloss: يقرأ ماتيو رقمه رقمًا رقمًا.
    note: تقدّم *C'est le* الرقم، وتوافق الاسم المذكر *numéro*.
  fr.a1.unit02.lesson06.teach.line07:
    title: شكره وسؤاله عن عمره
    gloss: 'تشكره إينيس ثم تطرح سؤالًا أخيرًا: كم عمره.'
    note: تشير *Une dernière question* («سؤال أخير») إلى انتقال طبيعي إلى موضوع آخر داخل المحادثة نفسها.
  fr.a1.unit02.lesson06.teach.line08:
    title: ذكر عمره
    gloss: يقول ماتيو إن عمره ثمانية وعشرون عامًا، ويسأل إينيس السؤال نفسه.
    note: تستعمل *J'ai vingt-huit ans* الصيغة المركّبة المربوطة بواصلة، كما في نمط هذا الدرس.
  fr.a1.unit02.lesson06.teach.line09:
    title: ذكر عمرها
    gloss: تقول إينيس إن عمرها واحد وثلاثون عامًا.
    note: تستعمل *J'ai trente et un ans* الحرف *et* (و) بدل الواصلة، لأن الواحد والثلاثين من صيغ «الواحد» التي سبق شرحها.
