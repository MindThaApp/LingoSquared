teaching:
  fr.a1.unit51.lesson01.teach.combien_ca_coute:
    title: السؤال عن السعر الإجمالي
    gloss: كم يكلّف في المجموع؟
    note: توضّح *En tout* (في المجموع) أنك تريد السعر الإجمالي، لا سعر قطعة واحدة.
  fr.a1.unit51.lesson01.teach.ca_coute_vingt:
    title: ذكر السعر الإجمالي
    gloss: يكلّف خمسة وعشرين يورو في المجموع.
    note: '*Ça coûte* تستعمل *ça* (هذا) مع *coûte*، وهي صيغة *coûter* (يكلّف) المستعملة مع شيء واحد.'
  fr.a1.unit51.lesson02.teach.payer_par_carte:
    title: الدفع بالبطاقة أو نقدًا
    gloss: يدفع بالبطاقة، يدفع نقدًا
    note: '*Payer par carte* هي الطريقة المعتادة للقول إنك تدفع بالبطاقة، و*payer en espèces* تعني الدفع نقدًا. استعمل *par* مع *carte* و*en* مع *espèces*.'
    example_gloss:
    - هل يمكنني الدفع بالبطاقة هنا؟
    - أنا أدفع نقدًا.
  fr.a1.unit51.lesson02.teach.je_peux_payer:
    title: السؤال عن إمكانية الدفع بالبطاقة
    gloss: هل يمكنني الدفع بالبطاقة هنا؟
    note: '*Ici* (هنا) تحدد أن السؤال يُطرح عند الصندوق الذي تقف أمامه.'
  fr.a1.unit51.lesson02.teach.vous_voulez_payer:
    title: السؤال عن طريقة الدفع المفضّلة
    gloss: هل تريد الدفع نقدًا أم بالبطاقة؟
    note: '*Vous voulez ... ?* هي الصيغة الرسمية للسؤال، يستعملها أمين الصندوق الذي لا تعرفه؛ أما الأصدقاء فيقولون *tu veux ... ?*.'
  fr.a1.unit51.lesson03.teach.l_addition:
    title: الفاتورة
    gloss: الفاتورة
    note: '*Addition* مؤنثة: *l''addition*. وتُختصر *La* إلى *l''* قبل الحرف المتحرك.'
    example_gloss: هل نقسّم الفاتورة؟
  fr.a1.unit51.lesson03.teach.on_partage_l:
    title: اقتراح تقسيم الفاتورة
    gloss: هل نقسّم الفاتورة؟
    note: '*On ... ?* تقترح القيام بشيء معًا، كما في *On partage ?*. و*Partager* (يتقاسم) تُستعمل مع *l''addition*.'
  fr.a1.unit51.lesson03.teach.je_peux_payer:
    title: طلب الدفع على حدة
    gloss: هل يمكنني الدفع على حدة؟
    note: '*Séparément* (على حدة) تأتي مباشرة بعد *payer*؛ وهي طريقة مهذبة لطلب دفع حصتك وحدك من الفاتورة.'
  fr.a1.unit51.lesson04.teach.la_monnaie:
    title: الباقي
    gloss: الباقي
    note: '*Monnaie* مؤنثة: *la monnaie*. وتعني القطع النقدية والأوراق النقدية التي تستردّها.'
    example_gloss: تفضّل، هذا هو الباقي.
  fr.a1.unit51.lesson04.teach.voici_votre_monnaie:
    title: تسليم الباقي
    gloss: تفضّل، هذا هو الباقي.
    note: '*Votre* هي صيغة الاحترام للملكية («ـكم»)، وتتوافق مع صيغة *vous* عند الصندوق.'
  fr.a1.unit51.lesson04.teach.je_n_ai:
    title: رفض أخذ الباقي
    gloss: لا أحتاج إلى الباقي.
    note: '*Avoir besoin de* (يحتاج إلى) يليها اسم: *Je n''ai pas besoin de monnaie.* بعد *ne ... pas* تحلّ *de* محل *de la*.'
  fr.a1.unit51.lesson05.teach.trente_cinq:
    title: خمسة وثلاثون
    gloss: خمسة وثلاثون
    note: '*Trente-cinq* تُكتب بشرطة وتبدأ بالعشرات: ثلاثون + خمسة.'
    example_gloss: يكلّف خمسة وثلاثين يورو.
  fr.a1.unit51.lesson05.teach.addition_deux_plats:
    title: اقرأ فاتورة مطعم
    gloss: 'الفاتورة: طبقان رئيسيان وقهوتان. المجموع: خمسة وثلاثون يورو. مدفوعة بالبطاقة.'
    note: تتبّع ما طُلب، والمجموع، وطريقة الدفع.
    glosses:
      Addition: فاتورة
      deux: اثنان
      plats: أطباق رئيسية
      cafés: قهوتان
      Total: المجموع
      trente-cinq: خمسة وثلاثون
      euros: يورو
      Payé: مدفوعة
      carte: بطاقة
  fr.a1.unit51.lesson06.teach.camille_on_demande:
    title: Camille تطلب الفاتورة
    gloss: 'Camille: هل نطلب الفاتورة؟'
    note: يأخذ الفعل *demander* (طلب) العبارة *l'addition* مفعولًا به مباشرًا، دون أي كلمة إضافية.
  fr.a1.unit51.lesson06.teach.mathieu_oui_bonne:
    title: ماتيو يسأل عن المبلغ الإجمالي
    gloss: 'ماتيو: نعم، فكرة جيدة. كم الثمن في المجموع؟'
    note: يعيد استخدام السؤال *Combien ça coûte en tout ?* من الدرس الأول.
  fr.a1.unit51.lesson06.teach.camille_ca_fait:
    title: كاميل تذكر المجموع
    gloss: 'كاميل: المجموع خمسة وثلاثون يورو. هل نتقاسمه؟'
    note: تُستعمل *Ça fait* مع مبلغ لذكر المجموع، ويشير الفعل *partager* إلى الفاتورة.
  fr.a1.unit51.lesson06.teach.mathieu_non_laisse:
    title: ماتيو يصرّ على الدفع
    gloss: 'ماتيو: لا، دعيني أدفع اليوم. لقد ساعدتِني كثيرًا.'
    note: تُستعمل *Laisse-moi* + المصدر لعرض القيام بشيء، و*aidé* هو اسم المفعول من الفعل *aider* (ساعد).
  fr.a1.unit51.lesson06.teach.camille_c_est:
    title: كاميل متأثرة
    gloss: 'كاميل: هذا لطف منك! شكرًا.'
    note: '*C''est gentil de ta part* (هذا لطف منك) عبارة دافئة وشائعة تُقال عند موقف كريم.'
  fr.a1.unit51.lesson06.teach.mathieu_je_peux:
    title: ماتيو يسأل عن الدفع بالبطاقة
    gloss: 'ماتيو: هل يمكنني الدفع بالبطاقة هنا؟'
    note: يعيد استخدام *Je peux payer par carte ici ?* من الدرس الثاني، لكن الآن في المطعم نفسه.
  fr.a1.unit51.lesson06.teach.mathieu_paie_l:
    title: 'Paie: صيغة الغائب'
    gloss: ماتيو يدفع الفاتورة.
    note: '*Paie* هي صيغة *il/elle* من الفعل *payer* (دفع): *je paie, tu paies, il paie*.'
