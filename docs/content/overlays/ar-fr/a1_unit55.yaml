    note: تعاد هنا كلمة *souvent* (كثيرًا) التي سبق تقديمها للحديث عن الروتين في وحدة سابقة.
  fr.a1.unit55.lesson03.teach.tu_connais_deja:
    title: Faire du sport مقابل faire de la + اسم الرياضة
    gloss: 'تعرف *faire du sport* من درس الهوايات (*Je fais du sport le samedi*). أما *Faire de la* + اسم الرياضة فتسمّي رياضة محددة: *Je fais de la natation*. كلاهما صحيح في الفرنسية.'
    note: '*Faire du sport* سبق تعلّمها في وحدة الهوايات وليست جديدة. وهنا تقابَل بتسمية رياضة محددة: طريقة عامة وأخرى محددة للحديث عن التمارين.'
