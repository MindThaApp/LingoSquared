  fr.a1.unit55.lesson01.teach.faire_du_de:
    title: Faire du / de la + sport
    gloss: '*Faire du* أو *de la* أو *de l''* + اسم الرياضة يحدد الرياضة التي تمارسها: *faire du yoga* و*faire de la natation* و*faire de la course à pied*. أما كرة القدم فتقول *jouer au football*.'
    note: بنية واحدة تشمل كل الرياضات، فلا حاجة إلى تعلّم فعل مستقل لكل رياضة في هذا المستوى.
