  fr.a1.unit55.lesson02.teach.tu_connais_deja:
    title: Fois par semaine مقابل tous les jours/souvent
    gloss: تعرف سابقًا *tous les jours* (كل يوم) و*souvent* (كثيرًا). أما *Deux fois par semaine* (مرتين في الأسبوع) فطريقة جديدة أدق للتعبير عن عدد المرات.
    note: توسّع مفردات التكرار التي تعلمتها في وحدة الهوايات.
  fr.a1.unit55.lesson02.teach.je_fais_du:
