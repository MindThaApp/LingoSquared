teaching:
  fr.a1.unit50.lesson01.teach.appeler:
    title: الاتصال
    gloss: يتصل
    note: صيغة المصدر للفعل الذي يُستخدم لإجراء مكالمة هاتفية.
    example_gloss: عليّ أن أتصل بك.
  fr.a1.unit50.lesson01.teach.je_t_appelle:
    title: قول إنك ستتصل
    gloss: سأتصل بك.
    note: '*Appelle* هي صيغة *je* من الفعل *appeler*؛ وتستعمل الفرنسية هنا المضارع للتعبير عن فعل سيحدث قريبًا.'
  fr.a1.unit50.lesson01.teach.allo_c_est:
    title: الرد على الهاتف
    gloss: مرحبًا، أنا كاميل.
    note: '*C''est* + الاسم هي الطريقة الفرنسية المعتادة للتعريف بنفسك على الهاتف.'
  fr.a1.unit50.lesson01.teach.allo_c_est_2:
    title: ماتيو يجيب بالطريقة نفسها
    gloss: مرحبًا، أنا ماتيو.
    note: النمط نفسه *c'est* + الاسم كما في *Allô, c'est Camille*.
  fr.a1.unit50.lesson02.teach.qui_est_a:
    title: السؤال عن هوية المتصل
    gloss: مع من أتحدث؟
    note: '*Qui est à l''appareil ?* هي الطريقة المعتادة لسؤال متصل لا تعرفه عن هويته.'
  fr.a1.unit50.lesson02.teach.vous_parlez_avec:
    title: التعريف بنفسك بصيغة رسمية
    gloss: أنت تتحدث مع كاميل.
    note: '*Vous parlez avec* + الاسم هي الصيغة الرسمية المقابلة لـ *c''est* + الاسم.'
  fr.a1.unit50.lesson03.teach.tu_peux_repeter:
    title: طلب الإعادة
    gloss: هل يمكنك إعادة ذلك؟
    note: '*Tu peux ...* (هل يمكنك ...؟) متبوعة بالمصدر *répéter* (يكرر).'
  fr.a1.unit50.lesson03.teach.ne_parle_pas:
    title: طلب التحدث ببطء
    gloss: لا تتكلم بهذه السرعة، من فضلك.
    note: '*Ne parle pas si vite* جملة نفي: يحيط *ne ... pas* بالفعل *parle*، وتعني *si* «إلى هذا الحد».'
  fr.a1.unit50.lesson03.teach.je_ne_t:
    title: قول إنك لا تسمع جيداً
    gloss: لا أسمعك جيداً.
    note: '*Entendre* (يسمع) مع *ne ... pas bien* تعبّر عن مشكلة في السمع، وتختلف عن *comprendre* (يفهم).'
  fr.a1.unit50.lesson04.teach.le_sms:
    title: رسالة نصية
    gloss: الرسالة النصية
    note: 'كلمة *SMS* مذكرة: *un SMS*، وهي اختصار دولي مقترض كما هو.'
    example_gloss: الرسالة النصية من كاميل.
  fr.a1.unit50.lesson04.teach.je_t_envoie:
    title: قول إنك سترسل رسالة
    gloss: سأرسل لك رسالة.
    note: يأتي الضمير *te* (هنا *t'*) قبل الفعل *Envoyer* (يرسل)، ثم *un SMS*.
  fr.a1.unit50.lesson04.teach.je_te_rappelle:
    title: قول إنك ستعاود الاتصال
    gloss: سأتصل بك لاحقاً.
    note: '*Rappeler* (يعاود الاتصال) تحمل فكرة «الإعادة» في البادئة *re-*؛ و*plus tard* تعني «لاحقًا».'
  fr.a1.unit50.lesson05.teach.mathieu_salut_camille:
    title: قراءة محادثة نصية
    gloss: 'Mathieu: مرحبًا Camille، هل يمكنك أن تتصلي بي؟ عليّ أن أخبرك بشيء. Camille: نعم بالطبع، سأعاود الاتصال بك بعد خمس دقائق.'
    note: تتبّع ما يطلبه Mathieu، ولماذا يطلبه، ومتى تقول Camille إنها ستعاود الاتصال.
    glosses:
      Salut: مرحباً
      peux: تستطيع
      m'appeler: الاتصال
      dois: يجب أن / عليّ
      truc: شيء ما
      dire: أخبر
      évidemment: بالطبع
      rappelle: أعيد
      cinq: خمسة
      minutes: دقائق
  fr.a1.unit50.lesson06.teach.mathieu_allo_c:
    title: Mathieu يردّ على المكالمة
    gloss: 'Mathieu: ألو، معك Mathieu.'
    note: 'نمط *c''est* + الاسم نفسه الذي رأيته في الدرس الأول، يُستعمل الآن في مكالمة هاتفية فعلية: من يردّ على الهاتف يتكلم أولًا ويذكر اسمه.'
  fr.a1.unit50.lesson06.teach.camille_salut_mathieu:
    title: Camille تعرّف بنفسها
    gloss: 'Camille: مرحبًا Mathieu، معك Camille. Mathieu: من اللطيف أنكِ تتصلين!'
    note: '*C''est sympa que* ... (من اللطيف أن ...) تعبّر عن ردّ فعل إيجابي تجاه حدث ما؛ أما *appelles* فصيغة خاصة يمكنك حفظها هنا ببساطة.'
  fr.a1.unit50.lesson06.teach.camille_comment_s:
    title: Camille تسأل عن المناوبة
    gloss: 'Camille: كيف كانت مناوبتك الأولى؟'
    note: '*Comment s''est passé ... ?* تستعمل الماضي المركّب للفعل *se passer* (يحدث / يجري)، ويُصاغ مع *être*، للسؤال عن كيفية سير أمر ما.'
  fr.a1.unit50.lesson06.teach.mathieu_ca_s:
    title: Mathieu يروي خبرًا سارًّا
    gloss: 'Mathieu: سارت الأمور على ما يرام، أفضل مما توقعت.'
    note: '*Ça s''est très bien passé* و*je pensais* عبارتان ثابتتان هنا؛ و*je pensais* هو الماضي الناقص للفعل *penser* (يفكّر / يظن).'
  fr.a1.unit50.lesson06.teach.au_passe_compose:
    title: الماضي المركّب مع avoir و être
    gloss: s'est passé → حدث، j'ai pensé → فكّر، je suis allé → ذهب
    note: 'يستعمل الماضي المركّب *avoir* أو *être* + اسم المفعول: *j''ai pensé*، *je suis allé*. أما *Ça s''est passé* فعبارة ثابتة بمعنى «جرى الأمر»؛ احفظها الآن في السياقات التي ترد فيها في هذا الدرس.'
  fr.a1.unit50.lesson06.teach.camille_ca_fait:
    title: Camille فخورة
    gloss: 'Camille: يسعدني سماع ذلك! أنا فخورة بك.'
    note: '*Fière de* (فخورة بـ) تركيب ثابت؛ يلزم *de* وليس *pour*؛ و*fière* مؤنث هنا.'
  fr.a1.unit50.lesson06.teach.mathieu_merci_beaucoup:
    title: Mathieu متأثر
    gloss: 'Mathieu: شكرًا جزيلًا، هذا يعني لي الكثير.'
    note: '*Compter* تعني هنا «أن يكون ذا أهمية»: *ça compte pour moi* (هذا مهم بالنسبة إليّ)؛ و*pour moi* تبيّن لمن يهمّ الأمر.'
  fr.a1.unit50.lesson06.teach.son_premier_service:
    title: 'الملكية: su'
    gloss: سارت مناوبته الأولى بشكل جيد جداً.
    note: '*Son* هنا صفة ملكية بمعنى «ـه» (للغائب المذكر) وليست فعلًا: *son premier service* (مناوبته الأولى)؛ و*son* يتوافق مع الاسم المذكر *service*.'
