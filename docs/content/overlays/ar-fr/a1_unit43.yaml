teaching:
  fr.a1.unit43.lesson01.teach.le_billet:
    title: التذكرة
    gloss: التذكرة
    note: '*Billet* اسم مذكر: *le billet*، *un billet*.'
    example_gloss: أودّ تذكرة إلى ليون.
  fr.a1.unit43.lesson01.teach.je_voudrais_un:
    title: طلب تذكرة
    gloss: أودّ تذكرة إلى ليون.
    note: '*Je voudrais* تلطّف الطلب؛ فهي أكثر أدبًا من *je veux*.'
  fr.a1.unit43.lesson01.teach.voulez_vous_un:
    title: الموظف يسأل عن النوع
    gloss: هل تريد تذكرة ذهاب فقط أم ذهاب وعودة؟
    note: '*Voulez-vous* هي صيغة *vous* الرسمية من *vouloir*، وتُستعمل هنا مع موظف محطة لا نعرفه.'
  fr.a1.unit43.lesson01.teach.un_aller_retour:
    title: الإجابة بلباقة
    gloss: ذهاب وعودة، من فضلك.
    note: '*S''il vous plaît* هي «من فضلك» الرسمية، وتناسب صيغة *vous* في هذا الحوار.'
  fr.a1.unit43.lesson01.teach.au_guichet_on:
    title: مستوى الكلام عند الشباك
    gloss: عند الشباك نستعمل عادةً صيغة الاحترام *vous*.
    note: نخاطب الغرباء الذين يؤدون خدمة بـ *vous*، أما الأصدقاء والعائلة فنخاطبهم بـ *tu*.
  fr.a1.unit43.lesson02.teach.le_quai:
    title: الرصيف
    gloss: الرصيف
    note: '*Quai* اسم مذكر: *le quai*.'
    example_gloss: من أي رصيف يغادر القطار المتجه إلى ليون؟
  fr.a1.unit43.lesson02.teach.de_quel_quai:
    title: السؤال عن الرصيف
    gloss: من أي رصيف يغادر القطار المتجه إلى ليون؟
    note: '*De quel quai* تسأل تحديدًا عن الرصيف؛ و *quel* يتفق مع الاسم المذكر *quai*.'
  fr.a1.unit43.lesson02.teach.le_train_part:
    title: ذكر تفاصيل المغادرة
    gloss: يغادر القطار في العاشرة إلا ربعًا من الرصيف الخامس.
    note: '*Dix heures moins le quart* تعني العاشرة إلا ربعًا؛ والفرنسية تقول *moins* (ناقص) للوقت الذي يسبق الساعة، وهذا يشبه «إلا» في العربية.'
  fr.a1.unit43.lesson02.teach.a_quelle_heure:
    title: السؤال عن وقت الوصول
    gloss: في أي ساعة يصل القطار؟
    note: '*À quelle heure arrive ... ?* تسأل عن الوقت؛ و *arriver* فعل منتظم من فعل *-er*: *le train arrive*.'
  fr.a1.unit43.lesson02.teach.le_train_arrive:
    title: ذكر وقت الوصول
    gloss: يصل القطار في الساعة الحادية عشرة.
    note: '*Arrive* هي صيغة *il/elle* من *arriver*؛ وأفعال *-er* تنتهي بـ *-e* مع *il* و *elle*.'
  fr.a1.unit43.lesson03.teach.a_l_heure:
    title: في الوقت المحدد / التأخير
    gloss: في الوقت المحدد؛ التأخير
    note: '*À l''heure* عبارة ثابتة تدل على حدوث الشيء في موعده. و *le retard* (التأخير) اسم مذكر.'
    example_gloss:
    - لا يغادر القطار في الوقت المحدد.
    - 'انتباه: القطار المتجه إلى ليون متأخر.'
  fr.a1.unit43.lesson03.teach.attention_le_train:
    title: إعلان
    gloss: 'انتباه: القطار المتجه إلى ليون متأخر.'
    note: '*Attention* تفتتح إعلانات المحطة، مثل «انتباه، أيها المسافرون».'
  fr.a1.unit43.lesson03.teach.le_train_ne:
    title: نفي الالتزام بالوقت
    gloss: لا يغادر القطار في الوقت المحدد.
    note: '*Ne ... pas* تحيط بالفعل: *ne part pas à l''heure*.'
  fr.a1.unit43.lesson03.teach.le_train_part:
    title: تغيير الرصيف
    gloss: يغادر القطار من الرصيف الثالث بدلًا من الرصيف الخامس.
    note: '*Au lieu du* تعني «بدلًا من»؛ و *de* + *le* تندمجان في *du*.'
  fr.a1.unit43.lesson03.teach.le_train_a:
    title: ذكر مدة التأخير
    gloss: القطار متأخر عشر دقائق.
    note: '*A ... de retard* (حرفيًا «لديه ... من التأخير») هي الطريقة الطبيعية لقول إن شيئًا متأخر؛ وتستعمل الفعل *avoir*.'
  fr.a1.unit43.lesson04.teach.l_entree_la:
    title: المدخل والمخرج وقاعة الانتظار
    gloss: المدخل؛ المخرج؛ قاعة الانتظار
    note: '*L''entrée* تفقد حرف *e* في *l''* قبل الحرف المتحرك؛ و *la sortie* و *la salle d''attente* اسمان مؤنثان.'
    example_gloss:
    - أين المدخل؟
    - أين المخرج؟
    - أين قاعة الانتظار؟
  fr.a1.unit43.lesson04.teach.ou_est_le:
    title: السؤال عن مكان الرصيف
    gloss: أين الرصيف السابع؟
    note: '*Où est ... ?* تسأل عن مكان شيء ما؛ و *le quai sept* اسم مذكر.'
  fr.a1.unit43.lesson04.teach.tout_droit_puis:
    title: إعطاء الاتجاهات
    gloss: استمر مباشرة ثم انعطف يمينًا.
    note: '*Tout droit* و *à droite* كلمتان للاتجاهات؛ و *à* تأتي قبل *droite*.'
  fr.a1.unit43.lesson04.teach.ou_est_la:
    title: السؤال عن قاعة الانتظار
    gloss: أين قاعة الانتظار؟
    note: نمط السؤال نفسه مطبّق على مكان جديد.
  fr.a1.unit43.lesson05.teach.billet_paris_gare:
    title: قراءة تذكرة مطبوعة
    gloss: 'تذكرة: من باريس غار دو ليون إلى ليون بار-ديو. المغادرة: العاشرة وعشر دقائق، الرصيف سبعة. الوصول: الحادية عشرة إلا عشر دقائق. ذهاب وإياب. السعر: اثنا عشر يورو وأربعون سنتًا.'
    note: انتبه إلى وقت المغادرة والرصيف، ووقت الوصول، ونوع التذكرة، والسعر.
    glosses:
      Billet: تذكرة
      Départ: مغادرة
      dix: عشرة
      quai: رصيف
      sept: سبع
      Arrivée: وصول
      onze: إحدى عشرة
      Aller-retour: تذكرة ذهاب وإياب
      Prix: سعر
      douze: اثنا عشر
      euros: يورو
      quarante: أربعون
  fr.a1.unit43.lesson06.teach.mathieu_on_doit:
    title: ماتيو يعرض الخطة
    gloss: 'ماتيو: علينا الذهاب إلى الرصيف سبعة. القطار يغادر في العاشرة وعشر دقائق.'
    note: '*On doit* (من *devoir*) تعبّر هنا عن حاجة عملية، لا عن إلزام صارم.'
  fr.a1.unit43.lesson06.teach.camille_regarde_voila:
    title: كاميل تقرأ اللوحة
    gloss: 'كاميل: انظر، هذه هي اللوحة: تأخير، عشر دقائق.'
    note: '*Voilà* تشير إلى ما هو موجود أمامنا: *voilà le panneau*.'
  fr.a1.unit43.lesson06.teach.mathieu_pas_de:
    title: ماتيو يحافظ على هدوئه
    gloss: 'ماتيو: لا مشكلة، لا يزال لدينا وقت لتناول قهوة.'
    note: '*Pas de problème* عبارة شائعة وغير رسمية للتطمين.'
  fr.a1.unit43.lesson06.teach.camille_bonne_idee:
    title: يصل القطار
    gloss: 'كاميل: فكرة جيدة. آه، ها هو القطار قد وصل بالفعل. الرصيف سبعة، في الموعد تمامًا!'
    note: '*Déjà* (بالفعل) تدل على أن القطار وصل أبكر من المتوقع، بعد التأخير الذي أُعلن للتو.'
  fr.a1.unit43.lesson06.teach.mathieu_allez_on:
    title: يصعدون إلى القطار
    gloss: 'ماتيو: هيا، لنصعد. ليون، ها نحن قادمون!'
    note: '*On* ضمير يُستعمل في الحديث اليومي بمعنى *نحن*، ويأتي معه الفعل بصيغة *il*: *on monte*. أما *On arrive !* فهي الطريقة الطبيعية لقول «ها نحن قادمون»، والترجمة الحرفية لها ستبدو غريبة.'
