course:
  title: الفرنسية A1
  description: أيام الأسبوع وذكر التاريخ (le + عدد أصلي + الشهر، مع le premier كاستثناء وحيد يُستعمل فيه العدد الترتيبي)، مع متابعة قصة ورشة الطبخ لدى إينيس وماتيو والتخطيط للجلسة الأخيرة. يوضّح الدرس أن التاريخ في الفرنسية يُقال بالأعداد الأصلية دائمًا، مثل le quinze mars، ما عدا اليوم الأول من الشهر.
