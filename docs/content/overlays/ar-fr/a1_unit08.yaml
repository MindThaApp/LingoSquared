teaching:
  fr.a1.unit08.lesson01.teach.lundi:
    title: الاثنين
    gloss: الاثنين
    note: أيام الأسبوع في الفرنسية مذكّرة، وتُكتب بحرف صغير في أول الكلمة، وهذا يوافق العربية التي لا تعرف الحروف الكبيرة.
    example_gloss: لا تجتمع الورشة أبدًا يوم الاثنين.
  fr.a1.unit08.lesson01.teach.samedi:
    title: السبت
    gloss: السبت
    note: '*Le samedi* (مع أداة التعريف) تعني «كل يوم سبت» على سبيل العادة، أما *samedi* وحدها فتعني يوم سبت محدّدًا، وهو أقرب سبت قادم أو ماضٍ بحسب زمن الفعل.'
    example_gloss: تجتمع الورشة أيام السبت.
  fr.a1.unit08.lesson01.teach.dimanche:
    title: الأحد
    gloss: الأحد
    note: 'النمط نفسه كبقية الأيام: مذكّر ويُكتب بحرف صغير.'
    example_gloss: المخبز مغلق أيام الأحد.
  fr.a1.unit08.lesson01.teach.aujourdhui:
    title: اليوم
    gloss: اليوم
    note: '*Aujourd''hui* كلمة واحدة ثابتة، مع أنها تبدو مركّبة من عدة أجزاء في أصلها التاريخي.'
    example_gloss: اليوم هو السبت.
  fr.a1.unit08.lesson01.teach.demain:
    title: غدًا
    gloss: غدًا
    note: '*Demain* كلمة ثابتة لا تتغير، وتُستعمل بالطريقة نفسها في كل سياق.'
    example_gloss: تفتح الصيدلية غدًا.
  fr.a1.unit08.lesson01.teach.hier:
    title: أمس
    gloss: أمس
    note: '*Hier* هي عكس *demain* تمامًا.'
    example_gloss: أكلتُ السمك أمس.
  fr.a1.unit08.lesson01.teach.quel_jour_sommes_nous:
    title: السؤال عن اليوم
    gloss: ما اليوم؟
    note: '*Quel jour sommes-nous ?* (حرفيًا «أيّ يوم نحن») هي الطريقة المعتادة للسؤال عن يوم الأسبوع.'
  fr.a1.unit08.lesson02.teach.mars:
    title: مارس
    gloss: مارس
    note: أسماء الأشهر في الفرنسية مذكّرة مثل أسماء الأيام، وتُكتب بحرف صغير.
    example_gloss: تنتهي الورشة في مارس.
  fr.a1.unit08.lesson02.teach.quelle_est_la_date:
    title: السؤال عن التاريخ
    gloss: ما تاريخ اليوم؟
    note: '*Quelle est la date... ?* هي الطريقة المعتادة للسؤال عن التاريخ الكامل، بخلاف *Quel jour sommes-nous ?* التي تسأل عن يوم الأسبوع فقط.'
  fr.a1.unit08.lesson02.teach.cest_le_quinze_mars:
    title: ذكر التاريخ
    gloss: إنه الخامس عشر من مارس.
    note: نمط التاريخ المعتاد في الفرنسية هو *le* + عدد أصلي + الشهر، فنقول *quinze* (خمسة عشر) وليس عددًا ترتيبيًا.
  fr.a1.unit08.lesson02.teach.nous_sommes_le:
    title: ذكر تاريخ اليوم
    gloss: اليوم هو الخامس عشر من مارس.
    note: '*Nous sommes le...* بديل شائع بالقدر نفسه من *C''est le...* لذكر تاريخ اليوم.'
  fr.a1.unit08.lesson02.teach.le_premier:
    title: الأول (من الشهر)
    gloss: الأول
    note: '*Le premier* هو الاستثناء الوحيد من قاعدة العدد الأصلي؛ فكل يوم آخر من الشهر يُقال بعدد أصلي عادي (*le deux* و*le trois*...)، أما اليوم الأول فيُستعمل فيه العدد الترتيبي *premier*.'
  fr.a1.unit08.lesson02.teach.le_vingt_deux:
    title: ذكر تاريخ الانتهاء
    gloss: تنتهي الورشة في الثاني والعشرين من مارس.
    note: '*Se termine* (تنتهي) فعل انعكاسي، و*vingt-deux* عدد أصلي عادي، وفق القاعدة نفسها في *le quinze mars*.'
  fr.a1.unit08.lesson03.teach.line01:
    title: السؤال عن موعد الجلسة الأخيرة
    gloss: تسأل إينيس متى تكون الجلسة الأخيرة من الورشة.
    note: '*C''est quand... ?* (متى هو؟) طريقة بسيطة وطبيعية للسؤال عن الموعد.'
  fr.a1.unit08.lesson03.teach.line02:
    title: ذكر التاريخ واليوم
    gloss: يقول ماتيو إنها في الثاني والعشرين من مارس، على ما يظن، وهو يوم سبت.
    note: '*Un samedi* (يوم سبت، من دون *le*) تذكر ببساطة أي يوم من الأسبوع يوافقه ذلك التاريخ.'
  fr.a1.unit08.lesson03.teach.line03:
    title: السؤال عن تاريخ اليوم
    gloss: تسأل إينيس عن تاريخ اليوم.
    note: هي الجملة نفسها *Quelle est la date aujourd'hui ?* التي تعلمتها للسؤال عن التاريخ.
  fr.a1.unit08.lesson03.teach.line04:
    title: ذكر تاريخ اليوم والمدة المتبقية
    gloss: يقول ماتيو إن اليوم هو الخامس عشر من مارس، أي بعد أسبوع.
    note: '*Dans une semaine* (بعد أسبوع) تعبّر عن مسافة زمنية تبدأ من اليوم.'
  fr.a1.unit08.lesson03.teach.line05:
    title: الرد بخطة
    gloss: تقول إينيس إن هذا ممتاز، فلديها الوقت لتحضير حلوى لهذه المناسبة.
    note: '*J''ai le temps de* + المصدر (لديّ الوقت لـ) تعبير شائع للدلالة على أن الوقت كافٍ لفعل شيء ما.'
  fr.a1.unit08.lesson03.teach.line06:
    title: تأكيد الخطة
    gloss: يقول ماتيو إنها فكرة جيدة، وإذن نلتقي يوم السبت القادم، الثاني والعشرين.
    note: '*Samedi prochain* (السبت القادم) تؤكد اسم اليوم والتاريخ معًا، وبها يُختتم الحوار.'
