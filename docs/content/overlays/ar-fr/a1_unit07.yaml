course:
  title: الفرنسية A1
  description: أماكن شائعة في الحي، وطلب الاتجاهات البسيطة وإعطاؤها (en face de, à côté de, près de, loin de)، مع متابعة بحث ماتيو عن صيدلية قرب الورشة. تنتهي هذه العبارات المكانية كلها بـ de، وتصبح du/des قبل الاسم المذكر أو الجمع (du café, des arbres).
