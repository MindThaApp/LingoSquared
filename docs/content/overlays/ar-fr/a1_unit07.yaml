  fr.a1.unit07.lesson01.teach.gare:
    title: محطة القطار
    gloss: محطة القطار
    note: '*Gare* اسم مؤنث.'
    example_gloss: محطة القطار كبيرة.
  fr.a1.unit07.lesson01.teach.pharmacie:
    title: الصيدلية
    gloss: الصيدلية
    note: '*Pharmacie* اسم مؤنث.'
    example_gloss: تفتح الصيدلية في التاسعة.
  fr.a1.unit07.lesson01.teach.banque:
    title: البنك
    gloss: البنك
    note: '*Banque* اسم مؤنث.'
    example_gloss: البنك مغلق أيام الأحد.
  fr.a1.unit07.lesson01.teach.ecole:
    title: المدرسة
    gloss: المدرسة
    note: '*École* اسم مؤنث؛ ويظهر *l''* بدل la لأن الكلمة تبدأ بصوت متحرك.'
    example_gloss: المدرسة بجانب الحديقة.
  fr.a1.unit07.lesson01.teach.cafe:
    title: المقهى
    gloss: المقهى
    note: '*Café* اسم مذكر؛ ويعني أيضًا «القهوة» في سياقات أخرى.'
    example_gloss: المقهى مفتوح طوال اليوم.
  fr.a1.unit07.lesson01.teach.poste:
    title: مكتب البريد
    gloss: مكتب البريد
    note: '*Poste* (مؤنث) تعني هنا «مكتب البريد»؛ أما *le poste* (مذكر، بمعنى مختلف) فقد تعني «الوظيفة» أو «المنصب» — فالجنس النحوي يغيّر المعنى.'
    example_gloss: يُغلق مكتب البريد عند الساعة السادسة.
  fr.a1.unit07.lesson01.teach.la_gare_est_grande:
    title: مقارنة بين مكانين
    gloss: محطة القطار كبيرة والصيدلية صغيرة.
    note: تتفق *grande* و*petite* هنا مع الاسمين المؤنثين (*la gare*، *la pharmacie*).
  fr.a1.unit07.lesson02.teach.ou_est_la_gare:
    title: السؤال عن مكان ما
    gloss: أين محطة القطار، من فضلك؟
    note: '*Où est... ?* هي الطريقة المعتادة العامة للسؤال عن موقع مكان ما.'
  fr.a1.unit07.lesson02.teach.en_face_de:
    title: القول إن شيئًا ما مقابل مكان آخر
    gloss: البنك مقابل محطة القطار.
    note: 'تنتهي *En face de* (مقابل) بـ *de* ويليها المكان المرجعي: *en face de la banque*. وقبل الاسم المذكر تُدمج: *en face du café*.'
  fr.a1.unit07.lesson02.teach.a_cote_de:
    title: القول إن شيئًا ما بجانب مكان آخر
    gloss: الصيدلية بجانب البنك.
    note: تتبع *À côté de* (بجانب) نمط الربط بـ *de* نفسه الذي في *en face de*.
  fr.a1.unit07.lesson02.teach.pres_de:
    title: القول إن شيئًا ما قريب
    gloss: المدرسة قريبة من هنا.
    note: تصبح *Près de* (قريب من) *près d'* قبل الصوت المتحرك، كما في *près d'ici* (قريب من هنا).
  fr.a1.unit07.lesson02.teach.loin_de:
    title: القول إن شيئًا ما بعيد
    gloss: مكتب البريد بعيد من هنا.
    note: '*Loin de* (بعيد عن) هي عكس *près de* تمامًا.'
  fr.a1.unit07.lesson02.teach.cest_loin:
    title: السؤال عمّا إذا كان المكان بعيدًا
    gloss: هل هو بعيد من هنا؟ — لا، ليس بعيدًا.
    note: '*C''est loin d''ici ?* هو السؤال الطبيعي الذي يلي معرفة الاتجاه. وللنفي ضع *ne... pas* حول الفعل: *ce n''est pas loin* (ليس بعيدًا).'
  fr.a1.unit07.lesson03.teach.line01:
    title: سؤال شخص غريب عن الطريق
    gloss: يسأل ماتيو أحد المارة بأدب عن مكان الصيدلية.
    note: '*Excusez-moi* (المعذرة) عبارة افتتاحية مهذبة معتادة عند مخاطبة شخص غريب، وتُستعمل مع *vous*.'
  fr.a1.unit07.lesson03.teach.line02:
    title: تحديد الموقع
    gloss: تقول إنها مقابل البنك وبجانب المقهى.
    note: تجمع بين *en face de* و*à côté de* في جملة واحدة لتحديد الموقع بدقة. و*De* + *le café* تصبح *du café*.
  fr.a1.unit07.lesson03.teach.line03:
    title: اسأل هل هو بعيد
    gloss: يسأل ماتيو إن كان المكان بعيدًا من هنا.
    note: هو نفسه *C'est loin d'ici ?* الذي تعلمته للسؤال عن المسافة.
  fr.a1.unit07.lesson03.teach.line04:
    title: التطمين بأن المكان قريب
    gloss: تقول لا، إنه قريب جدًا — خمس دقائق سيرًا على الأقدام.
    note: '*À pied* (سيرًا على الأقدام) هي الطريقة المعتادة للدلالة على المشي وسيلةً للتنقل.'
  fr.a1.unit07.lesson03.teach.line05:
    title: شكرها
    gloss: يشكرها ماتيو بحرارة.
    note: '*Merci beaucoup* تقوّي *merci* التي تعرفها من الوحدات السابقة.'
  fr.a1.unit07.lesson03.teach.line06:
    title: الرد على الشكر
    gloss: 'تردّ قائلة: عفوًا.'
    note: '*Je vous en prie* صيغة «عفوًا» الأكثر رسمية، وتناسب *vous* المستعملة مع الغريب؛ أما *De rien* فبديل أقل رسمية ومتداول في الحياة اليومية.'
