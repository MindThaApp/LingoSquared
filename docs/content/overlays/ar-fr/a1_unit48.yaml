teaching:
  fr.a1.unit48.lesson01.teach.le_manteau_le:
    title: معطف، سترة صوفية
    gloss: المعطف، السترة الصوفية
    note: كلمتا *Le manteau* و*le pull* كلتاهما مذكّرة.
    example_gloss:
    - أبحث عن معطف.
    - عندي سترة صوفية.
  fr.a1.unit48.lesson01.teach.le_pantalon_les:
    title: سروال، أحذية
    gloss: السروال، الأحذية
    note: 'كلمة *pantalon* مفرد في الفرنسية: *un pantalon* لقطعة واحدة. أما *chaussures* فهي جمع *chaussure*، وغالبًا ما يُذكر الحذاء بصيغة الجمع.'
    example_gloss:
    - أنا أبحث عن بنطال.
    - أبحث عن أحذية.
  fr.a1.unit48.lesson01.teach.je_cherche_un:
    title: قول ما تبحث عنه
    gloss: أبحث عن معطف.
    note: 'يتعدّى الفعل *chercher* (بحث عن) إلى مفعوله مباشرة دون حرف جر، بخلاف العربية التي تقول «بحث عن»: *je cherche un manteau*.'
  fr.a1.unit48.lesson02.teach.la_taille:
    title: المقاس
    gloss: المقاس
    note: 'كلمة *taille* مؤنّث: *la taille*.'
    example_gloss: ما مقاسك؟
  fr.a1.unit48.lesson02.teach.quelle_taille_faites:
    title: السؤال عن المقاس
    gloss: ما مقاسك؟
    note: نستعمل *quelle* (أيّ) في *Quelle taille ?* لأن *taille* مؤنّث، ولأن الأجوبة المتوقعة محدودة (S أو M أو L أو رقم).
  fr.a1.unit48.lesson02.teach.je_fais_du:
    title: ذكر مقاسك
    gloss: مقاسي M.
    note: 'معنى *Faire du M* أن مقاسك M: تستعمل الفرنسية الفعل *faire* (صنع/فعل) للتعبير عن المقاس، بينما نقول في العربية «مقاسي M».'
  fr.a1.unit48.lesson03.teach.noir_bleu:
    title: أسود، أزرق
    gloss: أسود، أزرق
    note: صفتا اللون الأساسيتان في هذا الدرس.
    example_gloss:
    - أريد المعطف باللون الأسود.
    - هل لديكم هذا أيضًا باللون الأزرق؟
  fr.a1.unit48.lesson03.teach.je_veux_le:
    title: طلب لون معيّن
    gloss: أريد المعطف باللون الأسود.
    note: '*En* + اللون هي الطريقة المعتادة لتحديد لون القطعة عند طلبها.'
  fr.a1.unit48.lesson03.teach.avez_vous_aussi:
    title: السؤال عن لون آخر
    gloss: هل لديكم هذا أيضًا باللون الأزرق؟
    note: تُستعمل *Aussi* (أيضًا) للسؤال عن توفّر لون آخر، وهنا بصيغة المخاطبة الرسمية *vous*.
  fr.a1.unit48.lesson04.teach.est_ce_que:
    title: السؤال عن مناسبة المقاس
    gloss: هل يناسبك هذا المعطف؟
    note: 'الفعل *Aller* (ذهب) هو الفعل الطبيعي للكلام عن ملاءمة الملابس: *il me va bien*، أي حرفيًا «يذهب عليّ جيدًا».'
  fr.a1.unit48.lesson04.teach.il_me_va:
    title: تأكيد أن المقاس مناسب
    gloss: يناسبني تمامًا.
    note: تصف *Bien* (جيدًا) كيف تناسب القطعة صاحبها.
  fr.a1.unit48.lesson04.teach.c_est_trop:
    title: صغير جدًا
    gloss: إنه صغير جدًا.
    note: تأتي *Trop* (أكثر من اللازم) قبل الصفة للتعبير عن الإفراط.
  fr.a1.unit48.lesson04.teach.c_est_trop_2:
    title: كبير جدًا
    gloss: إنه كبير جدًا.
    note: 'النمط نفسه: *trop* + صفة، كما في *trop petit* في البطاقة السابقة.'
  fr.a1.unit48.lesson05.teach.quatre_vingt_dix:
    title: تسعون
    gloss: تسعون
    note: '*Quatre-vingt-dix* هو العدد 90 (حرفيًا «أربعة عشرينات وعشرة»)، ويُستعمل هنا في سعر المعطف.'
    example_gloss: يكلّف المعطف تسعين يورو.
  fr.a1.unit48.lesson05.teach.le_manteau_coute:
    title: ذكر السعر
    gloss: يكلّف المعطف تسعين يورو.
    note: '*Coûte* هي صيغة الغائب *il* من الفعل *coûter* (كلّف).'
  fr.a1.unit48.lesson05.teach.parka_taille_m:
    title: اقرأ إيصال متجر
    gloss: 'معطف شتوي: المقاس M، اللون أسود. السعر: تسعون يورو. هذا المعطف يناسبني وهو دافئ.'
    note: تتبّع المقاس واللون والسعر والصفتين المذكورتين عن المعطف.
    glosses:
      Parka: معطف شتوي
      taille: المقاس
      couleur: لون
      noire: أسود
      Prix: سعر
      quatre-vingt-dix: تسعون
      euros: يورو
      manteau: معطف
      va: يناسب
      chaud: دافئ
  fr.a1.unit48.lesson06.teach.camille_ce_manteau:
    title: كاميل تلاحظ المعطف
    gloss: 'كاميل: هذا المعطف جميل! ما مقاسك؟'
    note: '*Joli* (جميل) ردّ فعل إيجابي عام؛ وهو هنا مذكّر لأنه يتبع *manteau*.'
  fr.a1.unit48.lesson06.teach.mathieu_je_fais:
    title: ماتيو يطلب تجربته
    gloss: 'ماتيو: مقاسي M. هل يمكنني تجربته؟'
    note: '*Je peux ... ?* هي الطريقة المعتادة لطلب الإذن؛ و*l''essayer* تعني «يجرّبه»، والضمير *l''* يعود إلى المعطف.'
  fr.a1.unit48.lesson06.teach.camille_bien_sur:
    title: كاميل تسأل عن مناسبته
    gloss: 'كاميل: بالطبع. هل يناسبك؟'
    note: يعود الضمير *Il* (هو) إلى *le manteau*، وهو اسم مذكّر.
  fr.a1.unit48.lesson06.teach.mathieu_oui_il:
    title: ماتيو يؤكّد
    gloss: 'ماتيو: نعم، يناسبني وهو دافئ.'
    note: يطابق تمامًا الإيصال الذي قرأته سابقًا، فهذا هو المعطف نفسه.
  fr.a1.unit48.lesson06.teach.camille_super_tu:
    title: كاميل تسأل عن اللون
    gloss: 'كاميل: رائع! هل تريده باللون الأسود أم الأزرق؟'
    note: '*Tu le veux en ... ou en ... ?* تعرض خيارين؛ والضمير *le* يعود إلى المعطف.'
  fr.a1.unit48.lesson06.teach.mathieu_je_le:
    title: ماتيو يقرّر
    gloss: 'ماتيو: سآخذه باللون الأسود.'
    note: الفعل *Prendre* (أخذ) هو الفعل الطبيعي لحسم خيار الشراء، واللون المختار يطابق ما في الإيصال.
  fr.a1.unit48.lesson06.teach.on_ecrit_prends:
    title: Prends أم prend
    gloss: '*Prends* صيغة المتكلم وصيغة المخاطب للفعل *prendre* (أخذ)؛ أما *prend* فصيغة الغائب والغائبة.'
    note: 'تصريف *prendre*: *je prends, tu prends, il/elle prend*.'
