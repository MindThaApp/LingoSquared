teaching:
  fr.a1.unit52.lesson01.teach.lire_faire_du:
    title: القراءة، ممارسة الرياضة، الطبخ
    gloss: يقرأ، يمارس الرياضة، يطبخ
    note: 'ثلاثة أفعال شائعة للهوايات: *lire* (يقرأ)، و*faire du sport* (يمارس الرياضة)، و*cuisiner* (يطبخ).'
    example_gloss:
    - أحب قراءة كتاب.
    - أمارس الرياضة أيام السبت.
    - أحب الطبخ للأصدقاء.
  fr.a1.unit52.lesson01.teach.le_temps_libre:
    title: وقت الفراغ
    gloss: وقت الفراغ
    note: '*Temps libre* مذكّر: *le temps libre*. وهي العبارة الأساسية للحديث عن الهوايات.'
    example_gloss: في وقت فراغي، أحب القراءة.
  fr.a1.unit52.lesson01.teach.pendant_mon_temps:
    title: قول ما تفعله في وقت فراغك
    gloss: في وقت فراغي، أحب القراءة.
    note: '*Lis* هي صيغة *je* من الفعل *lire* (يقرأ)؛ والحرف الأخير *s* لا يُنطق.'
  fr.a1.unit52.lesson02.teach.ecouter_de_la:
    title: الموسيقى، الرسم، ألعاب الفيديو
    gloss: يستمع إلى الموسيقى، يرسم، يلعب ألعاب الفيديو
    note: 'ثلاث هوايات أخرى: *écouter de la musique* و*dessiner* و*jouer aux jeux vidéo*. مع الألعاب، يصبح *jouer à* + *les* هكذا: *jouer aux*.'
    example_gloss:
    - أحب الاستماع إلى الموسيقى.
    - أرسم كثيرًا.
    - أحب لعب ألعاب الفيديو مع الأصدقاء.
  fr.a1.unit52.lesson02.teach.j_aime_ecouter:
    title: قول إنك تحب الاستماع إلى الموسيقى
    gloss: أحب الاستماع إلى الموسيقى.
    note: 'يأخذ *Écouter* مفعوله مباشرة دون كلمة إضافية: *écouter de la musique*.'
  fr.a1.unit52.lesson02.teach.j_aime_jouer:
    title: قول إنك تحب لعب ألعاب الفيديو مع الأصدقاء
    gloss: أحب لعب ألعاب الفيديو مع الأصدقاء.
    note: تعيد *Avec des amis* (مع أصدقاء) استخدام *amis* من الدرس الأول؛ و*des* أداة الجمع بمعنى «بعض».
  fr.a1.unit52.lesson03.teach.toujours_souvent_parfois:
    title: دائمًا، غالبًا، أحيانًا، أبدًا
    gloss: دائمًا، غالبًا، أحيانًا، أبدًا
    note: أربعة ظروف أساسية للتكرار. قد تكون *Souvent* مألوفة لك؛ أما *toujours* و*parfois* و*jamais* فجديدة. تحتاج *Jamais* إلى *ne* قبل الفعل.
    example_gloss:
    - أمارس الرياضة دائمًا أيام السبت.
    - غالبًا ما أقرأ كتابًا.
    - أرسم أحيانًا.
    - لا ألعب ألعاب الفيديو أبدًا.
  fr.a1.unit52.lesson03.teach.chaque_semaine_chaque:
    title: كل أسبوع، كل عطلة أسبوع
    gloss: كل أسبوع، كل عطلة أسبوع
    note: تعني *Chaque semaine* و*chaque week-end* كلتاهما «كل». لا تتغير *Chaque* أبدًا مهما كان جنس الاسم.
    example_gloss:
    - أطبخ للأصدقاء كل أسبوع.
    - أمارس الرياضة كل عطلة أسبوع.
  fr.a1.unit52.lesson03.teach.chaque_ne_change:
    title: Chaque لا تتغير أبدًا
    gloss: 'تبقى *Chaque* كما هي قبل الأسماء المذكّرة والمؤنثة: *chaque semaine*، *chaque week-end*.'
    note: '*Semaine* مؤنثة و*week-end* مذكّر، ومع ذلك *chaque* هي نفسها في الحالتين. قارن مع *tous les* / *toutes les* اللتين تتغيران.'
  fr.a1.unit52.lesson03.teach.qu_est_ce:
    title: السؤال عن وقت الفراغ
    gloss: ماذا تفعل في وقت فراغك؟
    note: هذا هو السؤال الأساسي في هذه الوحدة، استخدمه لتسأل أي شخص عن هواياته.
  fr.a1.unit52.lesson04.teach.camille_on_se:
    title: كاميل تفتح موضوع الهوايات
    gloss: 'كاميل: نتمشى معًا كثيرًا. لكن ماذا تفعل غير ذلك في وقت فراغك يا ماتيو؟'
    note: تستعمل *On se promène souvent* الضمير *on* بمعنى «نحن»، وتأتي *souvent* بعد الفعل مباشرة.
  fr.a1.unit52.lesson04.teach.mathieu_j_aime:
    title: هوايات ماتيو
    gloss: 'ماتيو: أحب الطبخ، حتى في البيت. وأمارس الرياضة كثيرًا.'
    note: توضّح *Même à la maison* (حتى في البيت) أن ماتيو يطبخ للمتعة، وليس لأجل عمله فقط.
  fr.a1.unit52.lesson04.teach.camille_tu_cuisines:
    title: كاميل متفاجئة
    gloss: 'كاميل: أنت تطبخ في البيت أيضًا؟ أنت تطبخ أصلًا طوال اليوم في العمل!'
    note: تؤكد *Toute la journée* (طوال اليوم) كم يطبخ ماتيو أصلًا في العمل.
  fr.a1.unit52.lesson04.teach.mathieu_oui_mais:
    title: ماتيو يشرح
    gloss: 'ماتيو: نعم، لكنني أجد الطبخ مريحًا. وأنتِ، ماذا تحبين أن تفعلي؟'
    note: 'تضع *Cuisiner, je trouve ça relaxant* كلمة *cuisiner* في البداية للتأكيد: حرفيًا «الطبخ، أجده مريحًا».'
  fr.a1.unit52.lesson04.teach.camille_j_aime:
    title: هوايات كاميل
    gloss: 'كاميل: أحب القراءة، وأستمع كثيرًا إلى الموسيقى.'
    note: تجمع هذه الجملة بين هوايتين من الدرسين 1 و2 بواسطة *et* (و).
  fr.a1.unit52.lesson04.teach.mathieu_tu_joues:
    title: ماتيو يسأل عن ألعاب الفيديو
    gloss: 'ماتيو: هل تلعب ألعاب الفيديو أيضًا؟'
    note: 'سؤال قصير جوابه نعم أو لا: *Tu joues aussi aux jeux vidéo ?* نغمة الصوت الصاعدة تجعل الجملة سؤالًا.'
  fr.a1.unit52.lesson04.teach.camille_non_je:
    title: كاميل تجيب
    gloss: 'كاميل: لا، أنا لا ألعب ألعاب الفيديو أبدًا. لكنني أرسم أحيانًا!'
    note: '*Jamais* (أبدًا) و*parfois* (أحيانًا) من الدرس 3، في جواب واحد يقابل بينهما.'
  fr.a1.unit52.lesson05.teach.mathieu_et_moi:
    title: مقارنة الهوايات
    gloss: ماتيو وأنا نتمشى معًا كثيرًا. لكن لدينا هوايات أخرى أيضًا. ماتيو يحب الطبخ، حتى في البيت، ويمارس الرياضة كثيرًا. أنا أحب القراءة وأستمع كثيرًا إلى الموسيقى. أرسم أحيانًا، لكنني لا ألعب ألعاب الفيديو أبدًا. ماذا تحب أن تفعل في وقت فراغك؟
    note: تلخّص رسالة كاميل معلومات من الدرس 4، وتنتهي بسؤال القارئ السؤال الرئيسي في هذه الوحدة.
    glosses:
      promène: يتنزه
      souvent: غالبًا
      ensemble: معًا
      d'autres: أخرى
      cuisiner: يطبخ
      aime: يحب
      maison: في البيت
      sport: يمارس الرياضة
      lire: القراءة
      j'écoute: أستمع
      musique: موسيقى
      dessine: أرسم
      parfois: أحيانًا
      jeux: ألعب ألعاب الفيديو
      jamais: أبدًا
      libre: فراغ
      temps: وقت
  fr.a1.unit52.lesson06.teach.mathieu_qu_est:
    title: ماتيو يسأل عن عطلة نهاية الأسبوع
    gloss: 'ماتيو: ماذا ستفعلين في عطلة نهاية الأسبوع هذه؟'
    note: تُستعمل *ce* في *Ce week-end* (عطلة نهاية الأسبوع هذه) لأن *week-end* اسم مذكر.
  fr.a1.unit52.lesson06.teach.camille_je_ne:
    title: كاميل لم تقرر بعد
    gloss: 'كاميل: لا أعرف بعد. أحب القراءة، لكنني أريد أيضًا أن أخرج.'
    note: '*Sortir* (يخرج) فعل شائع للتعبير عن الرغبة في مغادرة البيت.'
  fr.a1.unit52.lesson06.teach.mathieu_on_se:
    title: ماتيو يقترح خطة
    gloss: 'ماتيو: هل نتمشى معًا؟ وبعد ذلك أطبخ لنا.'
    note: تُرتّب *Après* (بعد ذلك) خطتين الواحدة بعد الأخرى، مثل *d'abord* و*ensuite*.
  fr.a1.unit52.lesson06.teach.camille_bonne_idee:
    title: كاميل توافق
    gloss: 'كاميل: فكرة جيدة! أحب التمشي والطبخ على حد سواء.'
    note: يدل *Autant ... que* (بقدر ... مثل) على أن كاميل تحب الأمرين بالقدر نفسه، دون تفضيل أحدهما.
  fr.a1.unit52.lesson06.teach.mathieu_parfait_alors:
    title: ماتيو يؤكد الموعد
    gloss: 'ماتيو: ممتاز. إذن أراك يوم السبت!'
    note: جملة ختامية ودية تؤكد الخطة ليوم *samedi* (السبت).
