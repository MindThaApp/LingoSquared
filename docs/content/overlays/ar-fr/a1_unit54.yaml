  fr.a1.unit54.lesson06.teach.nina_oui_j:
    title: نينا لديها طائر اسمه بيكو
    gloss: 'نينا: نعم، لدي طائر. اسمه بيكو.'
    note: تعيد *Il s'appelle* (اسمه) استعمال فعل التعارف من الوحدة الأولى.
  fr.a1.unit54.lesson06.teach.mathieu_comme_c:
    title: ردّ ماتيو
    gloss: 'ماتيو: ما أجمل هذا! ماذا تفعلين معه كل يوم؟'
  fr.a1.unit54.lesson06.teach.nina_je_lui:
    title: نينا تُطعمه كل يوم
    gloss: 'نينا: أُطعمه كل يوم.'
