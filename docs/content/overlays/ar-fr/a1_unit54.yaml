    title: هل لديك حيوان أليف؟
    gloss: هل لديك حيوان أليف؟
    note: نمط السؤال *Tu as ... ?* نفسه الذي تعرفه من الوحدات السابقة.
  fr.a1.unit54.lesson01.teach.oui_j_ai:
    title: نعم، لدي كلب
    gloss: نعم، لدي كلب.
    note: إجابة بسيطة بالإيجاب باستخدام مفردات هذه الوحدة الجديدة.
  fr.a1.unit54.lesson01.teach.non_je_n:
    title: لا، ليس لدي حيوان أليف
    gloss: لا، ليس لدي حيوان أليف.
    note: 'تحلّ *Pas d''* محلّ *un* بعد النفي: *Je n''ai pas d''animal de compagnie.* انظر ملاحظة القواعد.'
  fr.a1.unit54.lesson01.teach.apres_ne_pas:
    title: 'Pas de: نفي un/une/des'
    gloss: بعد *ne ... pas* تتحول *un* و*une* و*des* إلى *de* أو *d'*، كما في *Je n'ai pas de temps* (التي تعرفها) وهنا *Je n'ai pas d'animal de compagnie*.
    note: 'هذا هو النمط نفسه الذي تعلمته في *Je n''ai pas de temps*: ليست قاعدة جديدة، بل اسم جديد تطبّقها عليه.'
  fr.a1.unit54.lesson02.teach.promener:
    title: يُخرج حيوانًا للتنزه
    gloss: يُخرج (حيوانًا) للتنزه
    note: '*Promener* (يخرّج للنزهة) فعل منتظم من أفعال *-er*؛ انظر ملاحظة القواعد.'
    example_gloss: أُخرج الكلب للتنزه كل يوم.
  fr.a1.unit54.lesson02.teach.promener_est_un:
    title: Promener فعل منتظم من أفعال -er
    gloss: '*Promener* فعل منتظم من أفعال *-er* مثل *cuisiner*: *je promène, tu promènes, il promène le chien*. الحركة فوق الحرف *e* تدل على أنه يُنطق.'
    note: يبقى الفعل دائمًا كتلة واحدة، كما في أفعال *-er* الأخرى التي تعرفها.
  fr.a1.unit54.lesson02.teach.donner_a_manger:
    title: يُطعم
    gloss: يُطعم
    example_gloss: أُطعم القط كل يوم.
  fr.a1.unit54.lesson02.teach.jouer_avec:
    title: يلعب مع
