teaching:
  fr.a1.unit54.lesson01.teach.l_animal_un:
    title: حيوان، حيوان أليف
    gloss: الحيوان / الحيوان الأليف
    note: '*Un animal* هي الكلمة العامة؛ أما *un animal de compagnie* (حرفيًا «حيوان للصحبة») فتعني تحديدًا حيوانًا أليفًا.'
    example_gloss:
    - الكلب حيوان.
    - الكلب أيضًا حيوان أليف.
