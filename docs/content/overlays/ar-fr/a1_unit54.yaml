    gloss: 'كاميل: فروه بنّي وهو صغير.'
    note: يعيد مفردات لون الشعر والحجم من وحدة المظهر، وهنا لوصف فرو حيوان بدل شعر شخص.
  fr.a1.unit54.lesson04.teach.il_et_le:
    title: Il/le للحيوانات
    gloss: يُستعمل *Il* (هو) و*le* (ه) أيضًا للحيوان المذكر، وليس للشخص فقط.
    note: كانت كل استعمالات *il* و*le* السابقة في هذه الدورة تخص شخصًا؛ وهذه الملاحظة تنبّه صراحةً إلى امتدادهما إلى الحيوانات.
