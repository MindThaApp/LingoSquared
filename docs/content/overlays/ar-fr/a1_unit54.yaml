    gloss: 'كاميل: نعم، أُخرجه للنزهة كل يوم وأُطعمه.'
  fr.a1.unit54.lesson05.teach.mathieu_et_lea:
    title: ماتيو وليا وتوما والحيوانات
    gloss: 'ماتيو وليا كلاهما يحب الحيوانات، لكن لا أحد منهما لديه حيوان أليف. ماتيو يحب الكلاب وليا تحب القطط. أما توما فلديه حيوان أليف: قط. يلعب كثيرًا مع قطه ويطعمه كل يوم. وأنت، هل لديك حيوان أليف؟'
    note: يقابل بين حب الحيوان وامتلاكه فعلًا، وهذا هو الهدف التواصلي للوحدة.
    glosses:
      adorent: يحب
      tous: كلاهما
      animaux: حيوانات
      deux: كلاهما
      compagnie: حيوان أليف
      chiens: كلاب
      chats: قطط
      chat: قط
      joue: يلعب
      donne: يعطي
      chaque: كل
      manger: طعام
