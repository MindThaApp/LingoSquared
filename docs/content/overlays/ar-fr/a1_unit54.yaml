  fr.a1.unit54.lesson03.teach.au_pluriel_on:
    title: 'الجمع: chien -> chiens'
    gloss: 'يُضاف إلى الجمع عادةً حرف *s* لا يُسمع: *chien -> chiens*، *chat -> chats*. وتتحول الأسماء المنتهية بـ *-al* إلى *-aux*: *animal -> animaux*.'
    note: نمط الجمع المنتظم في الفرنسية، يُقدَّم هنا لأول مرة بأسماء الحيوانات مثالًا.
