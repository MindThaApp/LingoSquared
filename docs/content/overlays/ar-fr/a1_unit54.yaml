    note: تأتي *Souvent* (كثيرًا) بعد الفعل مباشرةً، كما في الروتينات السابقة.
  fr.a1.unit54.lesson05.teach.j_adore_les:
    title: أحب الكلاب. ليس لدي حيوان أليف.
