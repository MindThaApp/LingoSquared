    title: ماتيو يحب الطيور أيضًا
    gloss: 'ماتيو: وأنا أيضًا أحب الطيور.'
  fr.a1.unit54.lesson06.teach.camille_c_est:
    title: كاميل تختم الحديث
    gloss: 'كاميل: رائع، نحن الثلاثة نحب الحيوانات!'
    note: يختم الحديث بجمع المعلومات عن الحيوانات لدى الشخصيات الثلاث في هذه الوحدة.
