course:
  title: الفرنسية A1
  description: 'التعبير عن الأذواق والتفضيلات الأساسية والسؤال عنها، مع متابعة قصة ورشة الطبخ لدى إينيس وماتيو وهما يختاران بين وصفتين ليوم السبت. نقطة مهمة: في *préférer X à Y* (فضّل X على Y) تُستعمل *à* وليس *que*، وهي تقابل «على» في العربية.'
