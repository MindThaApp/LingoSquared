teaching:
  fr.a1.unit13.lesson01.teach.preferer:
    title: يفضّل
    gloss: يفضّل
    note: '*Préférer* فعل من الفئة -ER يتغيّر فيه حرف العلّة: *je préfère*، لكن *nous préférons* (لا يتغيّر الحرف المشدَّد في صيغتي *nous/vous*).'
    example_gloss: أفضّل تارت الشوكولاتة.
  fr.a1.unit13.lesson01.teach.aimer_mieux:
    title: يحبّ أكثر
    gloss: يحبّ أكثر
    note: '*Aimer mieux* بديل شائع لـ *préférer*، لكنه يقارن بـ *que* (*aimer mieux X que Y*)، بينما يستعمل *préférer* حرف *à* (*préférer X à Y*).'
    example_gloss: أحبّ الأطباق المالحة أكثر من الأطباق الحلوة.
  fr.a1.unit13.lesson01.teach.detester:
    title: يكره
    gloss: يكره
    note: '*Détester* يعبّر عن كره شديد، وهو أقوى من *ne pas aimer* (لا يحبّ).'
    example_gloss: يكره ماتيو التوابل الحارّة جدًا؛ ويفضّل الأطباق الخفيفة.
  fr.a1.unit13.lesson01.teach.plutot:
    title: بالأحرى
    gloss: بالأحرى
    note: '*Plutôt* تخفّف من حدّة التفضيل: هذا الخيار بالأحرى، دون استبعاد الخيار الآخر تمامًا.'
    example_gloss: آخذ جبنًا بالأحرى.
  fr.a1.unit13.lesson01.teach.sucre:
    title: حلو
    gloss: حلو
    note: '*Sucré* يصف الطعام الذي فيه سكر، ويختلف عن *doux* (لطيف/معتدل)؛ فلا تخلط بينهما.'
    example_gloss: هذه الحلوى حلوة جدًا.
  fr.a1.unit13.lesson01.teach.sale:
    title: مالح
    gloss: مالح
    note: '*Salé* هو الضد المعتاد لـ *sucré* في مفردات الطعام الفرنسية، ويشمل معنيي «المالح» و«غير الحلو».'
    example_gloss: الجبن مالح.
  fr.a1.unit13.lesson01.teach.la_recette:
    title: الوصفة
    gloss: الوصفة
    note: '*La recette* مؤنث دائمًا.'
    example_gloss: هذه الوصفة سهلة.
  fr.a1.unit13.lesson02.teach.quest_ce_que_tu_preferes:
    title: السؤال عن التفضيل
    gloss: ماذا تفضّل؟
    note: '*Qu''est-ce que...* هي الطريقة المعتادة لصياغة سؤال مفتوح بـ «ماذا» في الفرنسية المحكية.'
  fr.a1.unit13.lesson02.teach.je_prefere_x_a_y:
    title: التعبير عن تفضيل شيء على آخر
    gloss: أفضّل التارت على الكيش.
    note: في *Préférer X à Y* تُستعمل *à* قبل الخيار الأقل تفضيلًا، وليس *que*؛ وهي تقابل «على» في العربية.
  fr.a1.unit13.lesson02.teach.tu_aimes_plutot:
    title: السؤال عن الميل العام
    gloss: هل تميل إلى الحلو أم إلى المالح؟
    note: تجمع بين *plutôt* (من الدرس الأول) وسؤال اختيار بـ *ou* (أو).
  fr.a1.unit13.lesson02.teach.moi_aussi_moi_non:
    title: الموافقة أو المخالفة
    gloss: وأنا كذلك. / أنا لا.
    note: '*Moi aussi* للموافقة على كلام مثبت؛ و*moi non* للمخالفة أو للتعبير عن التفضيل المعاكس.'
  fr.a1.unit13.lesson02.teach.ca_ne_me_derange_pas:
    title: قول إن الأمر لا يهمّك
    gloss: لا يهمّني.
    note: '*Ça ne me dérange pas* عبارة مفيدة ومحايدة لقبول أيٍّ من الخيارين عند الطلب منك أن تختار.'
  fr.a1.unit13.lesson02.teach.on_pourrait_faire:
    title: اقتراح خيار
    gloss: يمكننا أن نصنع كيش، أليس كذلك؟
    note: '*On pourrait* (يمكننا) + المصدر تقترح خيارًا بلطف، و*non ?* في النهاية تطلب الموافقة.'
  fr.a1.unit13.lesson03.teach.line01:
    title: السؤال عمّا سيُحضَّر
    gloss: 'يسأل ماتيو ماذا سيحضّران يوم السبت: تارت أم كيش؟'
    note: '*Qu''est-ce qu''on prépare... ?* (ماذا نحضّر) تستعمل *on* بمعنى «نحن»، كما هو معتاد في الكلام العفوي.'
  fr.a1.unit13.lesson03.teach.line02:
    title: التعبير عن تفضيل ثم سؤال الآخر
    gloss: تقول إينيس إنها تفضّل التارت الحلو نوعًا ما، وتسأل ماتيو عن رأيه.
    note: '*Et toi ?* (وأنت؟) أبسط طريقة لتحويل عبارة إلى سؤال موجَّه للطرف الآخر.'
  fr.a1.unit13.lesson03.teach.line03:
    title: التعبير عن تفضيل معاكس
    gloss: يقول ماتيو إنه يحبّ المالح أكثر، ويفضّل الكيش على التارت.
    note: يعيد استعمال بنية *préférer X à Y* من الدرس الثاني مباشرة.
  fr.a1.unit13.lesson03.teach.line04:
    title: اقتراح حلّ وسط
    gloss: تقترح إينيس أن يصنعا الاثنين معًا، أليس كذلك؟
    note: '*Les deux* (الاثنان) تحلّ الخلاف باقتراح صنع الوصفتين معًا.'
  fr.a1.unit13.lesson03.teach.line05:
    title: قبول الحلّ الوسط
    gloss: يقول ماتيو إنها فكرة جيدة وإن الأمر لا يهمّه إطلاقًا.
    note: '*Ça ne me dérange pas du tout* تقوّي عبارة الدرس الثاني بإضافة *du tout* (إطلاقًا).'
  fr.a1.unit13.lesson03.teach.line06:
    title: تأكيد القرار
    gloss: 'تقول إينيس: ممتاز، تارت حلو وكيش مالح ليوم السبت.'
    note: تعيد صياغة القرار النهائي بوضوح، وبذلك يُختتم الحوار.
