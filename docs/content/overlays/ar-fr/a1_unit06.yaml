course:
  title: الفرنسية A1
  description: أجزاء اليوم وقول الوقت على الساعة (heure(s)، et quart، et demie، moins le quart)، مع متابعة قصة ورشة الطبخ لدى إينيس وماتيو حتى تحديد موعد جلستهما القادمة. تستعمل الفرنسية نظام الأربع والعشرين ساعة في المواعيد والسياقات الرسمية (dix-huit heures trente) إلى جانب الصيغ غير الرسمية التي تعلمتها في هذه الوحدة.
