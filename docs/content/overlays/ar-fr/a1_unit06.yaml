teaching:
  fr.a1.unit06.lesson01.teach.heure:
    title: الساعة؛ الوقت
    gloss: الساعة؛ الوقت
    note: كلمة *Heure* مؤنثة، وهي أيضًا الوحدة المستعملة لقول الوقت (*dix heures* = الساعة العاشرة).
    example_gloss: كم الساعة؟
  fr.a1.unit06.lesson01.teach.matin:
    title: الصباح
    gloss: الصباح
    note: كلمة *Matin* مذكرة.
    example_gloss: السوق مفتوح في الصباح.
  fr.a1.unit06.lesson01.teach.apres_midi:
    title: بعد الظهر
    gloss: بعد الظهر
    note: يمكن أن تكون *Après-midi* مذكرة أو مؤنثة (والتذكير أشيع)، وتُحذف حركة أداة التعريف فتصبح *l'* قبل صوتها المتحرك.
    example_gloss: أعمل بعد الظهر.
  fr.a1.unit06.lesson01.teach.soir:
    title: المساء
    gloss: المساء
    note: كلمة *Soir* مذكرة.
    example_gloss: ورشة الطبخ في المساء.
  fr.a1.unit06.lesson01.teach.midi:
    title: الظهر
    gloss: ظهر
    note: لا تأتي *Midi* مع أداة تعريف عند استعمالها لتحديد الوقت (*à midi* وليس *au midi*).
    example_gloss: نأكل عند الظهر.
  fr.a1.unit06.lesson01.teach.minuit:
    title: منتصف الليل
    gloss: منتصف الليل
    note: تتبع *Minuit* النمط نفسه الذي تتبعه *midi* في غياب أداة التعريف.
    example_gloss: لا تستمر الورشة أبدًا بعد منتصف الليل.
  fr.a1.unit06.lesson01.teach.latelier_commence_le_soir:
    title: قول وقت الورشة
    gloss: تبدأ الورشة في المساء لا في الصباح.
    note: تقابل الجملة بين *le soir* و*le matin* مباشرة، وتعيد استعمال الاسمين من مفردات هذا الدرس.
  fr.a1.unit06.lesson02.teach.quelle_heure_est_il:
    title: السؤال عن الوقت
    gloss: كم الساعة؟
    note: '*Quelle heure est-il ?* هي الطريقة المعتادة العامة لسؤال الوقت؛ والضمير *-il* يأتي بعد الفعل علامةً على السؤال.'
  fr.a1.unit06.lesson02.teach.il_est_dix_heures:
    title: قول الساعة
    gloss: الساعة العاشرة.
    note: النمط الأساسي لقول أي ساعة هو *Il est* + العدد + *heures*؛ وتبقى *heures* بصيغة الجمع إلا في *une heure* (الساعة الواحدة).
  fr.a1.unit06.lesson02.teach.et_quart:
    title: قول الساعة والربع
    gloss: الساعة العاشرة والربع.
    note: تضيف *Et quart* (والربع) خمس عشرة دقيقة إلى الساعة المذكورة.
  fr.a1.unit06.lesson02.teach.et_demie:
    title: قول الساعة والنصف
    gloss: الساعة العاشرة والنصف.
    note: تضيف *Et demie* (والنصف) ثلاثين دقيقة؛ وتأخذ *demie* علامة التأنيث -e لتطابق *heure*.
  fr.a1.unit06.lesson02.teach.moins_le_quart:
    title: قول الساعة إلا ربعًا
    gloss: الساعة الحادية عشرة إلا ربعًا.
    note: تُحسب *Moins le quart* (إلا الربع) من الساعة التالية لا من الساعة الحالية، وهذا يشبه «إلا ربعًا» في العربية.
  fr.a1.unit06.lesson02.teach.a_quelle_heure:
    title: السؤال عن وقت البدء
    gloss: في أي ساعة تبدأ الورشة؟
    note: تُستعمل *À quelle heure ?* (في أي ساعة) للسؤال عن موعد حدث مقرر، وتختلف عن السؤال العام *Quelle heure est-il ?*.
  fr.a1.unit06.lesson03.teach.line01:
    title: السؤال عن موعد بدء الأسبوع القادم
    gloss: تسأل إينيس عن موعد ورشة الأسبوع القادم.
    note: تُستعمل *La semaine prochaine* (الأسبوع القادم) مع نمط السؤال *à quelle heure* الذي تعلمته في هذا الدرس.
  fr.a1.unit06.lesson03.teach.line02:
    title: قول موعد البدء
    gloss: يقول ماتيو إنها تبدأ في الثامنة عشرة والنصف (6:30 مساءً) على ما يظن.
    note: تستعمل *Dix-huit heures trente* نظام الأربع والعشرين ساعة الشائع في المواعيد، وتختلف عن الصيغ غير الرسمية مثل *et demie*.
  fr.a1.unit06.lesson03.teach.line03:
    title: التأكد من أنه المساء
    gloss: 'تتأكد إينيس: في المساء وليس في الصباح؟'
    note: سؤال قصير للتأكيد يقابل بين *le soir* و*le matin*.
  fr.a1.unit06.lesson03.teach.line04:
    title: التأكيد وذكر السبب
    gloss: يؤكد ماتيو أنه في المساء، فهو أنسب بعد العمل.
    note: تقدم *Après le travail* (بعد العمل) سببًا عمليًا بسيطًا.
  fr.a1.unit06.lesson03.teach.line05:
    title: السؤال عن موعد الانتهاء
    gloss: تسأل إينيس في أي ساعة تنتهي.
    note: تقابل *Finit* (تنتهي) مباشرة كلمة *commence* (تبدأ) في السطر الثاني.
  fr.a1.unit06.lesson03.teach.line06:
    title: قول موعد الانتهاء
    gloss: يقول ماتيو إنها تنتهي نحو العشرين والربع (8:15 مساءً) كالعادة.
    note: تدل *Vers* (نحو، حوالي) على وقت تقريبي، وهي أخف من *à* الدقيقة.
  fr.a1.unit06.lesson03.teach.line07:
    title: تأكيد الخطة
    gloss: 'تؤكد إينيس: إلى اللقاء الأسبوع القادم في الثامنة عشرة والنصف!'
    note: تُختتم المحادثة بإعادة الوقت المتفق عليه، وهي طريقة طبيعية لتأكيد خطة في الفرنسية.
