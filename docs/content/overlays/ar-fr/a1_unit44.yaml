teaching:
  fr.a1.unit44.lesson01.teach.je_ne_me:
    title: الشعور بالتوعك
    gloss: لا أشعر أنني بخير.
    note: الفعل *se sentir* انعكاسي (*je me sens*)؛ و*ne ... pas bien* طريقة عامة وخفيفة للقول إنّ هناك شيئًا غير طبيعي.
  fr.a1.unit44.lesson01.teach.malade:
    title: مريض
    gloss: مريض
    note: 'الصفة الأساسية، وتُستعمل مع *être*: *je suis malade*.'
    example_gloss: أنا مريض.
  fr.a1.unit44.lesson01.teach.je_suis_malade:
    title: أن تكون مريضًا
    gloss: أنا مريض.
    note: '*Malade* تصف حالة أعمّ وأقوى من *pas bien*.'
  fr.a1.unit44.lesson01.teach.mal_a_la:
    title: صداع
    gloss: صداع
    note: '*Mal à la tête* تأتي مع *avoir*: *j''ai mal à la tête*؛ ونقول *à la* لأنّ *tête* مؤنثة.'
    example_gloss: أعاني من صداع.
  fr.a1.unit44.lesson01.teach.j_ai_mal:
    title: الإصابة بصداع
    gloss: أعاني من صداع.
    note: 'تأتي أعراض المرض مع *avoir* (يملك): *j''ai mal*.'
  fr.a1.unit44.lesson01.teach.mal_au_ventre:
    title: وجع المعدة
    gloss: وجع في المعدة
    note: '*Mal au ventre*: *au* هي اندماج *à* + *le*، لأنّ *ventre* مذكر.'
    example_gloss: أعاني من وجع في المعدة.
  fr.a1.unit44.lesson01.teach.j_ai_mal_2:
    title: الإصابة بوجع في المعدة
    gloss: أعاني من وجع في المعدة.
    note: النمط نفسه مع *avoir* كما في *mal à la tête*، لكن بـ *au* بدل *à la*.
  fr.a1.unit44.lesson02.teach.qu_est_ce:
    title: سؤال عام
    gloss: ما الأمر؟
    note: طريقة عامة تصلح لسؤال الشخص إن كان هناك مشكلة.
  fr.a1.unit44.lesson02.teach.qu_est_ce_2:
    title: تعبير شائع
    gloss: ما بك؟
    note: '*Qu''est-ce qui ne va pas ?* سؤال ثابت، معناه الحرفي «ما الذي لا يسير على ما يرام»؛ فلا تترجمه كلمة بكلمة.'
  fr.a1.unit44.lesson02.teach.mal_a_la:
    title: التهاب الحلق
    gloss: التهاب في الحلق
    note: '*Mal à la gorge* مثل *mal à la tête*: *gorge* مؤنثة، لذلك نقول *à la*.'
    example_gloss: أعاني من التهاب في الحلق.
  fr.a1.unit44.lesson02.teach.j_ai_mal:
    title: الإصابة بالتهاب الحلق
    gloss: أعاني من التهاب في الحلق.
    note: النمط نفسه مع *avoir* كما في بقية الأعراض.
  fr.a1.unit44.lesson02.teach.ca_va_non:
    title: الاطمئنان على شخص
    gloss: هل أنت بخير؟ لا، لا أشعر أنني بخير.
    note: '*Ça va ?* سؤال شائع وغير رسمي للاطمئنان بين الأصدقاء.'
  fr.a1.unit44.lesson03.teach.la_fievre:
    title: الحمّى
    gloss: حمّى
    note: '*La fièvre* مؤنثة؛ وبعد *avoir* نستعمل *de la*: *j''ai de la fièvre*.'
    example_gloss: عندي حمّى.
  fr.a1.unit44.lesson03.teach.j_ai_de:
    title: الإصابة بالحمّى
    gloss: عندي حمّى.
    note: النمط نفسه مع *avoir*، مع أداة التبعيض *de la*.
  fr.a1.unit44.lesson03.teach.le_rhume:
    title: الإصابة بنزلة برد
    gloss: مصاب بنزلة برد
    note: '*Le rhume* اسم مذكر يُستعمل مع *avoir*، وليس صفة تُستعمل مع *être*.'
    example_gloss: أنا مصاب بنزلة برد.
  fr.a1.unit44.lesson03.teach.j_ai_un:
    title: قول إنك مصاب بنزلة برد
    gloss: أنا مصاب بنزلة برد.
    note: في الفرنسية نقول *j'ai un rhume* («عندي زكام»)؛ ولا نقول *je suis rhume*.
  fr.a1.unit44.lesson03.teach.malade_se_dit:
    title: Être أم avoir؟
    gloss: '*Malade* صفة وتُستعمل مع *être*: أنا مريض. أمّا *mal* و*fièvre* و*rhume* فأسماء وتُستعمل مع *avoir*: أنا مصاب بزكام.'
    note: 'يتبع الاختيار بين *être* و*avoir* نوع الكلمة: الصفة مثل *malade* تأتي مع *être*، والاسم مثل *fièvre* يأتي مع *avoir*، مهما كان المرض خفيفًا.'
  fr.a1.unit44.lesson04.teach.la_pharmacie:
    title: الصيدلية
    gloss: الصيدلية
    note: '*Pharmacie* مؤنثة: *la pharmacie*.'
    example_gloss: أنا ذاهب إلى الصيدلية.
  fr.a1.unit44.lesson04.teach.je_peux_vous:
    title: تحية الصيدلاني
    gloss: كيف أستطيع مساعدتك؟
    note: '*Je peux vous aider ?* عبارة ترحيب رسمية معتادة في الخدمات؛ و*vous* هي صيغة الاحترام.'
  fr.a1.unit44.lesson04.teach.avez_vous_quelque:
    title: طلب شيء لعَرَض معين
    gloss: هل لديك شيء لعلاج الصداع؟
    note: '*Quelque chose contre* + العرَض هي الطريقة الطبيعية لطلب دواء.'
  fr.a1.unit44.lesson04.teach.un_comprime:
    title: قرص
    gloss: قرص دواء
    note: '*Comprimé* مذكر: *un comprimé*.'
    example_gloss: أتناول قرصًا.
  fr.a1.unit44.lesson04.teach.prenez_un_comprime:
    title: تعليمات الجرعة
    gloss: تناول قرصًا مرتين في اليوم.
    note: '*Prenez* هي صيغة الأمر مع *vous* من الفعل *prendre* (يأخذ)، وتُستعمل في التعليمات.'
  fr.a1.unit44.lesson04.teach.a_la_pharmacie:
    title: أسلوب الكلام في الصيدلية
    gloss: في الصيدلية نستعمل صيغة الاحترام *vous*.
    note: الصيدلاني شخص بالغ لا تعرفه ويؤدي خدمة، لذلك تقول *vous*، كما في شباك التذاكر.
  fr.a1.unit44.lesson05.teach.conseil_prends_un:
    title: اقرأ نصيحة في صيدلية
    gloss: 'نصيحة: تناول حبة مرتين في اليوم مع الماء. ارتح جيدًا واشرب كثيرًا من الماء. هل ما زلت لا تشعر بتحسن بعد ثلاثة أيام؟ إذن اذهب إلى الطبيب.'
    note: انتبه إلى الجرعة، والنصيحتين الأخريين غير الدواء، ومتى تذهب إلى الطبيب.
    glosses:
      Conseil: نصيحة
      prends: تناول
      fois: مرات
      jour: يوم
      comprimé: حبة دواء
      Repose-toi: ارتح
      bois: اشرب
      sens: تشعر
      toujours: ما زال
      bien: جيدًا
      médecin: طبيب
  fr.a1.unit44.lesson06.teach.camille_salut_mathieu:
    title: كاميل تطمئن على ماتيو
    gloss: 'كاميل: أهلًا ماتيو، كيف حالك؟ هل تشعر بتحسّن الآن؟'
    note: تدل *Déjà* (مسبقًا) على أنّ كاميل تسأل هل تحسّن ماتيو منذ آخر مرة تحدثا فيها.
  fr.a1.unit44.lesson06.teach.mathieu_pas_encore:
    title: ماتيو ما زال متعبًا
    gloss: 'ماتيو: لست بخير بعد. ما زال رأسي يؤلمني وأنا متعب.'
    note: تدل *Toujours* (ما زال) على أنّ الصداع لم يزُل؛ و*fatigué* (متعب) صفة جديدة ومفيدة.
  fr.a1.unit44.lesson06.teach.camille_tu_as:
    title: كاميل تسأل عن الدواء
    gloss: 'كاميل: هل تناولت قرصًا؟'
    note: '*Pris* هو اسم المفعول من الفعل *prendre*، ويأتي مع *as* من *avoir*: *tu as pris*.'
  fr.a1.unit44.lesson06.teach.mathieu_oui_j:
    title: ماتيو يؤكد
    gloss: 'ماتيو: نعم، تناولت قرصًا. سأرتاح الآن.'
    note: '*Je vais me reposer* (سأرتاح) تستعمل *aller* + المصدر للتعبير عن المستقبل القريب.'
  fr.a1.unit44.lesson06.teach.camille_bonne_idee:
    title: كاميل تتمنى له الشفاء
    gloss: 'كاميل: فكرة جيدة. ارتح جيدًا. شفاك الله!'
    note: '*Bon rétablissement !* عبارة ثابتة معتادة لتمنّي الشفاء العاجل لأحدهم.'
  fr.a1.unit44.lesson06.teach.mathieu_merci_a:
    title: ماتيو يودّع
    gloss: 'ماتيو: شكرًا، إلى الغد!'
    note: '*À demain !* تستعمل *à* + الزمن في التوديع: *à demain*، *à bientôt*.'
