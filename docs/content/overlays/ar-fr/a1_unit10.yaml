course:
  title: الفرنسية A1
  description: وصف روتين يومي بسيط باستخدام الأفعال الانعكاسية (se réveiller, se lever, se coucher) وكلمات الترتيب (d'abord, ensuite)، مع متابعة حكاية ورشة الطبخ بين إينيس وماتيو حين تسأل إينيس عن يوم السبت عند ماتيو. يركّز الدرس على أن الأفعال الانعكاسية في الفرنسية تحتاج دائمًا إلى ضمير انعكاسي يطابق الفاعل (je me réveille).
