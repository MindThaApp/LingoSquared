teaching:
  fr.a1.unit10.lesson01.teach.se_reveiller:
    title: الاستيقاظ
    gloss: يستيقظ
    note: 'فعل انعكاسي: *je me réveille*، *tu te réveilles*. يطابق الضمير *me/te/se* الفاعل دائمًا.'
    example_gloss: أستيقظ في الساعة السابعة.
  fr.a1.unit10.lesson01.teach.se_lever:
    title: النهوض من السرير
    gloss: يستيقظ / ينهض من النوم
    note: يختلف عن *se réveiller* (الاستيقاظ من النوم)؛ فالفعل *se lever* يعني النهوض فعليًا من السرير.
    example_gloss: أنهض مباشرةً بعد ذلك.
  fr.a1.unit10.lesson01.teach.prendre_une_douche:
    title: الاستحمام
    gloss: يستحم
    note: تستعمل العبارة *prendre une douche* (حرفيًا «أخذ دش») الفعل *prendre* نفسه المستعمل مع الوجبات ووسائل النقل.
    example_gloss: أستحم في الصباح.
  fr.a1.unit10.lesson01.teach.shabiller:
    title: ارتداء الملابس
    gloss: يرتدي ملابسه
    note: 'فعل انعكاسي آخر: *je m''habille*، حيث يُحذف حرف الضمير ويصير *m''* قبل الحرف الصائت.'
    example_gloss: أرتدي ملابسي قبل الفطور.
  fr.a1.unit10.lesson01.teach.le_petit_dejeuner:
    title: الإفطار
    gloss: الإفطار
    note: تعني *Prendre le petit-déjeuner* «تناول الفطور»، وتستعمل نمط *prendre* نفسه الموجود في *prendre une douche*.
    example_gloss: أتناول الفطور في الساعة الثامنة.
  fr.a1.unit10.lesson01.teach.quitter_la_maison:
    title: مغادرة البيت
    gloss: يغادر البيت
    note: يعني *Quitter* هنا «يغادر (مكانًا)»؛ ولا يُخلط بينه وبين *partir* الذي لا يأتي بعده مفعول به مباشر.
    example_gloss: أغادر البيت في الساعة التاسعة.
  fr.a1.unit10.lesson01.teach.dabord_ensuite:
    title: أولًا... ثم...
    gloss: أنهض أولًا، ثم أرتدي ملابسي.
    note: '*D''abord* (أولًا) و*ensuite* (ثم) من كلمات الترتيب الأساسية لوصف الروتين خطوة بخطوة.'
  fr.a1.unit10.lesson02.teach.rentrer:
    title: العودة إلى البيت
    gloss: يعود إلى البيت
    note: يدل *Rentrer* على العودة إلى بيت المرء نفسه، بخلاف *retourner* الأعم (العودة إلى مكان ما).
    example_gloss: أعود إلى البيت بعد العمل.
  fr.a1.unit10.lesson02.teach.diner:
    title: تناول العشاء
    gloss: يتناول العشاء
    note: قد تكون *Dîner* فعلًا (تناول العشاء) أو اسمًا (*le dîner*، العشاء)، ويحدد السياق المقصود.
    example_gloss: نتناول العشاء معًا مساء كل سبت.
  fr.a1.unit10.lesson02.teach.se_coucher:
    title: الذهاب إلى النوم
    gloss: يذهب إلى النوم
    note: هي الخطوة الطبيعية الأخيرة في تسلسل الروتين اليومي، وتقابل *se lever* في البداية.
    example_gloss: أذهب إلى النوم نحو الساعة الحادية عشرة ليلًا.
  fr.a1.unit10.lesson02.teach.le_weekend:
    title: عطلة نهاية الأسبوع
    gloss: عطلة نهاية الأسبوع
    note: كلمة *Le week-end* شائعة في الفرنسية، وتُكتب بشرطة بين جزأيها.
    example_gloss: تُقام الورشة في عطلة نهاية الأسبوع.
  fr.a1.unit10.lesson02.teach.dhabitude:
    title: عادةً
    gloss: عادةً
    note: تمهّد *D'habitude* لروتين معتاد، بخلاف *aujourd'hui* (اليوم) الذي يدل على حدث لمرة واحدة.
    example_gloss: عادةً أنهض في الساعة السابعة.
  fr.a1.unit10.lesson02.teach.ma_routine_du_samedi:
    title: وصف يوم السبت
    gloss: أنهض متأخرًا يوم السبت، ثم أذهب إلى السوق قبل الورشة.
    note: تجمع الجملة تسلسلًا شبيهًا بـ *d'abord/ensuite*، وهنا باستعمال *puis* («ثم»)، لوصف يوم السبت.
  fr.a1.unit10.lesson02.teach.quest_ce_que_tu_fais:
    title: ماذا تفعل؟
    gloss: ماذا تفعل يوم السبت؟
    note: '*Qu''est-ce que tu fais... ?* هي الطريقة العادية غير الرسمية للسؤال عما يفعله شخص ما.'
  fr.a1.unit10.lesson03.teach.line01:
    title: السؤال عن يوم السبت
    gloss: تسأل إينيس ماتيو عمّا يفعله يوم السبت قبل الورشة.
    note: '*Tu fais quoi... ?* طريقة طبيعية غير رسمية للسؤال «ماذا تفعل...؟»، وهي أكثر عفوية من *Qu''est-ce que tu fais ?*'
  fr.a1.unit10.lesson03.teach.line02:
    title: وصف الاستيقاظ
    gloss: يقول ماتيو إنه يستيقظ أولًا متأخرًا، نحو الساعة التاسعة.
    note: تعيد *Vers neuf heures* (نحو الساعة التاسعة) نمط *vers* + الوقت للدلالة على وقت تقريبي.
  fr.a1.unit10.lesson03.teach.line03:
    title: السؤال عمّا بعد ذلك
    gloss: تسأل إينيس عمّا يحدث بعد ذلك.
    note: سؤال متابعة قصير وطبيعي لمواصلة وصف الروتين.
  fr.a1.unit10.lesson03.teach.line04:
    title: وصف الفطور والسوق
    gloss: يقول ماتيو إنه بعد ذلك يتناول الفطور ويذهب إلى السوق.
    note: فعلان مترابطان بحرف العطف *et*، يتابعان التسلسل الذي بدأ بـ *d'abord*.
  fr.a1.unit10.lesson03.teach.line05:
    title: السؤال عن وقت العودة إلى البيت
    gloss: تسأل إينيس في أي ساعة يعود ماتيو.
    note: تستعمل *Tu rentres à quelle heure ?* الفعل *rentrer* من هذه الوحدة في سؤال مباشر.
  fr.a1.unit10.lesson03.teach.line06:
    title: وصف فترة ما بعد الظهر
    gloss: يقول ماتيو إنه يعود نحو الظهر، وإنه يرتاح بعد الظهر قبل ورشة المساء.
    note: '*Se reposer* (يرتاح) فعل انعكاسي آخر: *je me repose*.'
