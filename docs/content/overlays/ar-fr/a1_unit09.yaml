course:
  title: الفرنسية A1
  description: السؤال عن الاتجاهات الأساسية في الشارع وإعطاؤها (à gauche/à droite, tout droit, au coin de la rue, traverser)، مع متابعة قصة ورشة الطبخ لدى إينيس وماتيو بينما تبحث إينيس عن متجر لأدوات المطبخ. يوضّح الدرس أن الاتجاهات بالفرنسية تُعطى بصيغة الأمر مع vous («Tournez à gauche») أو بالمضارع («Tu tournes à gauche»).
