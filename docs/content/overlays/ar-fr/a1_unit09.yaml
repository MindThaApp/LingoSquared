teaching:
  fr.a1.unit09.lesson01.teach.a_gauche:
    title: على اليسار
    gloss: على اليسار / إلى اليسار
    note: تُستعمل *À gauche* للدلالة على المكان («إنه على اليسار») وعلى الاتجاه («انعطف يسارًا») معًا.
    example_gloss: انعطف يسارًا بعد المخبز.
  fr.a1.unit09.lesson01.teach.a_droite:
    title: على اليمين
    gloss: على اليمين / إلى اليمين
    note: هي عكس *à gauche* تمامًا، وتُستعمل بالطريقة نفسها.
    example_gloss: الصيدلية على يمين المقهى.
  fr.a1.unit09.lesson01.teach.tout_droit:
    title: إلى الأمام مباشرة
    gloss: إلى الأمام مباشرة
    note: تعني *Tout droit* «إلى الأمام مباشرة»، فلا تخلطها مع *à droite* («إلى اليمين») التي تشبهها في الشكل لكنها تختلف في المعنى.
    example_gloss: واصل السير إلى الأمام مباشرة حتى السوق.
  fr.a1.unit09.lesson01.teach.au_coin_de_la_rue:
    title: عند زاوية الشارع
    gloss: عند زاوية الشارع
    note: تعني *Au coin de* «عند زاوية»، و*au coin de la rue* («عند زاوية الشارع») عبارة شائعة جدًا لتحديد المعالم.
    example_gloss: المتجر عند زاوية الشارع.
  fr.a1.unit09.lesson01.teach.traverser:
    title: يعبر
    gloss: يعبر
    note: '*Traverser* فعل منتظم من أفعال المجموعة الأولى: *je traverse*، *tu traverses*، وهكذا.'
    example_gloss: عليك أن تعبر الشارع لتصل إلى المتجر.
  fr.a1.unit09.lesson01.teach.la_boutique:
    title: المتجر
    gloss: المتجر
    note: تعني *La boutique* في الغالب متجرًا صغيرًا متخصصًا، وتختلف عن المتجر الكبير.
    example_gloss: المتجر عند زاوية الشارع، على اليمين.
  fr.a1.unit09.lesson01.teach.le_carrefour:
    title: التقاطع
    gloss: التقاطع / مفترق الطرق
    note: '*Le carrefour* هو المكان الذي يتقاطع فيه شارعان، وهو معلم شائع في الاتجاهات المنطوقة.'
    example_gloss: انعطف يسارًا عند التقاطع.
  fr.a1.unit09.lesson02.teach.pour_aller_a:
    title: اسأل عن طريق الوصول إلى مكان
    gloss: المعذرة، كيف أصل إلى المتجر من فضلك؟
    note: '*Pour aller à... ?* (حرفيًا «من أجل الذهاب إلى...») هي الطريقة المهذبة المعتادة للسؤال عن الطريق إلى مكان ما.'
  fr.a1.unit09.lesson02.teach.tournez_a_gauche:
    title: انعطف يسارًا
    gloss: انعطف يسارًا بعد الصيدلية.
    note: '*Tournez* هي صيغة الأمر مع *vous* من الفعل *tourner* (ينعطف)، وهي الصيغة المعتادة عند إرشاد شخص لا تعرفه جيدًا.'
  fr.a1.unit09.lesson02.teach.continuez_tout_droit:
    title: واصل السير إلى الأمام
    gloss: واصل السير إلى الأمام حتى التقاطع.
    note: '*Continuez* («واصل») + *tout droit* («إلى الأمام مباشرة») هي الطريقة المعتادة لتطلب من أحد أن يواصل المشي دون أن ينعطف.'
  fr.a1.unit09.lesson02.teach.cest_au_coin:
    title: تحديد المكان
    gloss: إنه عند زاوية الشارع، على اليمين.
    note: تجمع بين *au coin de la rue* و*à droite* لتحديد المكان بدقة.
  fr.a1.unit09.lesson02.teach.cest_loin:
    title: قل إنه ليس بعيدًا
    gloss: ليس بعيدًا، يبعد خمس دقائق سيرًا على الأقدام.
    note: '*À cinq minutes à pied* («خمس دقائق سيرًا على الأقدام») هي صيغة تقدير مدة المشي نفسها التي رأيتها حين سأل ماتيو عن الصيدلية.'
  fr.a1.unit09.lesson03.teach.line01:
    title: السؤال عن متجر
    gloss: تسأل إينيس ماتيو إن كان يعرف متجرًا لشراء أدوات المطبخ.
    note: '*Tu connais... ?* («هل تعرف...؟») هي الطريقة العفوية المعتادة للسؤال عمّا إذا كان الشخص يعرف مكانًا ما.'
  fr.a1.unit09.lesson03.teach.line02:
    title: اذكر الخطوة الأولى
    gloss: يقول ماتيو نعم، يوجد متجر قريب من هنا؛ تنعطف يسارًا عند التقاطع.
    note: تستعمل *Il y en a une* («يوجد واحد») الضمير *en* لتجنّب تكرار *boutique*، وهذا اختصار شائع في الفرنسية المنطوقة.
  fr.a1.unit09.lesson03.teach.line03:
    title: التأكيد وطلب المزيد
    gloss: تؤكد إينيس أن عليها الانعطاف يسارًا عند التقاطع، وتسأل عمّا بعد ذلك.
    note: '*Et ensuite ?* («وبعد ذلك؟») طريقة بسيطة وطبيعية لطلب الخطوة التالية في الطريق.'
  fr.a1.unit09.lesson03.teach.line04:
    title: اذكر الخطوة الثانية
    gloss: 'يقول ماتيو: بعد ذلك تواصل السير إلى الأمام وتعبر الشارع.'
    note: فعلان للاتجاه مرتبطان بالحرف *et*، وهي طريقة طبيعية لوصف طريق قصير.
  fr.a1.unit09.lesson03.teach.line05:
    title: السؤال عن المكان بدقة
    gloss: تسأل إينيس أين يقع المتجر بالضبط.
    note: تطلب *Exactement* («بالضبط») جوابًا أدق من مجرد اتجاه عام.
  fr.a1.unit09.lesson03.teach.line06:
    title: تحديد المكان بدقة
    gloss: يقول ماتيو إنه عند زاوية الشارع، قبالة المخبز مباشرة.
    note: تحدد *En face de* («قبالة») المكان بالنسبة إلى معلم قريب، وهي طريقة طبيعية لإنهاء شرح الطريق.
