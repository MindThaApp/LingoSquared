teaching:
  fr.a1.unit45.lesson01.teach.tu_fais_quoi:
    title: السؤال عن مهنة شخص ما
    gloss: ماذا تعمل؟
    note: طريقة معتادة وغير رسمية للسؤال عن مهنة شخص ما.
  fr.a1.unit45.lesson01.teach.le_metier_cuisinier:
    title: المهنة / طبّاخ
    gloss: المهنة؛ طبّاخ
    note: '*Métier* (مهنة) مذكّر: *le métier*. وتتغيّر *Cuisinier* للمرأة: *un cuisinier*، *une cuisinière*.'
    example_gloss:
    - ما مهنتك؟
    - أعمل طبّاخًا.
  fr.a1.unit45.lesson01.teach.je_travaille_comme:
    title: أن تقول إنك طبّاخ
    gloss: أعمل طبّاخًا.
    note: '*Travailler comme* + المهنة هي الصيغة المعتادة للتعبير عن المهنة، دون أداة قبل اسم المهنة.'
  fr.a1.unit45.lesson01.teach.infirmiere:
    title: ممرّضة
    gloss: ممرّضة
    note: هو المصطلح الحديث المحايد لهذه المهنة، ويُستعمل لأي جنس.
    example_gloss: أعمل ممرّضًا.
  fr.a1.unit45.lesson01.teach.je_travaille_comme_2:
    title: أن تقول إنك ممرّض
    gloss: أعمل ممرّضًا.
    note: يتبع النمط نفسه *travailler comme* كما في *cuisinier*؛ ومؤنث الكلمة هو *infirmière*.
  fr.a1.unit45.lesson02.teach.ou_travailles_tu:
    title: السؤال عن مكان العمل
    gloss: أين تعمل؟
    note: سؤال مباشر يأتي بعد *Tu fais quoi dans la vie ?*
  fr.a1.unit45.lesson02.teach.je_travaille_dans:
    title: العمل في مطعم
    gloss: أعمل في مطعم.
    note: يأتي *Un restaurant* مع أداة التنكير هنا لأنه واحد من مطاعم كثيرة.
  fr.a1.unit45.lesson02.teach.l_hopital:
    title: المستشفى
    gloss: المستشفى
    note: '*Hôpital* مذكّر ويبدأ بصوت متحرّك: *l''hôpital*.'
    example_gloss: أعمل في المستشفى.
  fr.a1.unit45.lesson02.teach.je_travaille_a:
    title: العمل في المستشفى
    gloss: أعمل في المستشفى.
    note: تأتي *À l'hôpital* مع أداة التعريف لأنه مكان محدد معروف؛ ويصبح *le* إلى *l'* قبل الصوت المتحرّك.
  fr.a1.unit45.lesson02.teach.certaines_personnes_travaillent:
    title: العمل في مكتب
    gloss: يعمل بعض الناس في مكتب.
    note: يأتي *Dans un bureau* (في مكتب) مع أداة، مثل *dans un restaurant*.
  fr.a1.unit45.lesson03.teach.je_commence_a:
    title: موعد البدء
    gloss: أبدأ في الساعة التاسعة.
    note: '*Commence* هي صيغة *je* من الفعل *commencer* (بدأ)، و*à neuf heures* تحدد الساعة.'
  fr.a1.unit45.lesson03.teach.je_travaille_du:
    title: أيام العمل
    gloss: أعمل من الاثنين إلى الجمعة.
    note: تعني *Du lundi au vendredi* من الاثنين إلى الجمعة؛ و*du* هي *de* + *le*، و*au* هي *à* + *le*.
  fr.a1.unit45.lesson03.teach.la_pause:
    title: الاستراحة
    gloss: الاستراحة
    note: 'كلمة *Pause* مؤنثة: *la pause*.'
    example_gloss: لديّ استراحة في الساعة الثانية عشرة.
  fr.a1.unit45.lesson03.teach.j_ai_une:
    title: أخذ استراحة
    gloss: لديّ استراحة في الساعة الثانية عشرة.
    note: '*Avoir une pause* (أخذ استراحة) تركيب ثابت وطبيعي.'
  fr.a1.unit45.lesson03.teach.je_finis_a:
    title: موعد الانتهاء
    gloss: أنتهي في الساعة الخامسة.
    note: '*Finis* هي صيغة *je* من الفعل *finir* (أنهى).'
  fr.a1.unit45.lesson03.teach.je_commence_a_2:
    title: يوم عمل كامل
    gloss: أبدأ في الساعة التاسعة وأنتهي في الساعة الخامسة.
    note: تجمع *je commence* و*je finis* بالحرف *et* في جملة واحدة تصف يوم عمل كاملًا.
  fr.a1.unit45.lesson04.teach.avec_il_ou:
    title: نهايات الأفعال مع il وelle
    gloss: 'مع «هو» أو «هي»، تحتفظ الأفعال المنتظمة المنتهية بـ -er بصيغة «أنا» نفسها: أنا أعمل، هو يعمل، هي تعمل.'
    note: 'تبقى *Travaille* نفسها مع *je* و*il* و*elle*: فالأفعال المنتظمة المنتهية بـ *-er* لا تضيف شيئًا في صيغة الغائب.'
  fr.a1.unit45.lesson04.teach.camille_travaille_comme:
    title: مهنة كاميل
    gloss: تعمل كاميل ممرضة.
    note: 'تُستعمل *Travaille* مع *je* و*il* و*elle*: النهاية صامتة، فتُنطق الصيغ الثلاث بالطريقة نفسها.'
  fr.a1.unit45.lesson04.teach.mathieu_travaille_comme:
    title: مهنة ماتيو
    gloss: يعمل ماتيو طبّاخًا.
    note: النهاية نفسها كما في *Camille travaille comme infirmière*.
  fr.a1.unit45.lesson04.teach.elle_travaille_a:
    title: استعمال الضمائر
    gloss: هي تعمل في المستشفى. هو يعمل في مطعم.
    note: يحلّ *Elle* و*il* محل الاسمين كاميل وماتيو مع بقاء صيغة الفعل نفسها.
  fr.a1.unit45.lesson05.teach.camille_travaille_comme:
    title: اقرأ نبذتين عن العمل
    gloss: تعمل كاميل ممرضة في المستشفى. تبدأ في الساعة السابعة وتعمل من الاثنين إلى الجمعة. يعمل ماتيو طبّاخًا في مطعم. يبدأ في الساعة الحادية عشرة ويأخذ استراحة في الساعة الرابعة.
    note: تتبّع مهنة كل شخص ومكان عمله وجدوله على حدة.
    glosses:
      travaille: يعمل
      infirmière: ممرضة
      l'hôpital: المستشفى
      commence: يبدأ
      sept: سبع
      lundi: الاثنين
      vendredi: الجمعة
      cuisinier: طبّاخ
      restaurant: مطعم
      onze: إحدى عشرة
      pause: استراحة
  fr.a1.unit45.lesson06.teach.camille_salut_mathieu:
    title: كاميل تسأل عن العمل
    gloss: 'كاميل: مرحبًا ماتيو! أنا فضولية، ماذا تعمل بالمناسبة؟'
    note: تُلطّف *Au fait* (بالمناسبة) السؤال فيبدو فضولًا ودّيًا لا استجوابًا.
  fr.a1.unit45.lesson06.teach.mathieu_je_travaille:
    title: ماتيو يجيب
    gloss: 'ماتيو: أعمل طبّاخًا في مطعم. وأنتِ؟'
    note: '*Et toi ?* هي الطريقة المعتادة لإعادة السؤال إلى الطرف الآخر.'
  fr.a1.unit45.lesson06.teach.camille_je_travaille:
    title: كاميل تجيب
    gloss: 'كاميل: أعمل ممرضة في المستشفى.'
    note: تتوافق مع المهنة ومكان العمل المذكورين سابقًا.
  fr.a1.unit45.lesson06.teach.mathieu_tu_fais:
    title: ماتيو يسأل عن ساعات العمل
    gloss: 'ماتيو: ما ساعات عملك؟'
    note: '*Tu fais quels horaires ?* طريقة طبيعية للسؤال عن جدول عمل شخص ما؛ و*quels* يتوافق مع الجمع *horaires*.'
  fr.a1.unit45.lesson06.teach.camille_je_commence:
    title: كاميل تذكر ساعات عملها
    gloss: 'كاميل: أبدأ في الساعة السابعة وأعمل من الاثنين إلى الجمعة.'
    note: يتوافق مع الجدول المذكور سابقًا في نص القراءة.
  fr.a1.unit45.lesson06.teach.mathieu_c_est:
    title: ردّ فعل ماتيو
    gloss: 'ماتيو: هذا مبكّر! أما أنا فأبدأ لاحقًا، في الساعة الحادية عشرة.'
    note: يتوافق مع موعد بدء ماتيو المذكور سابقًا.
  fr.a1.unit45.lesson06.teach.camille_chaque_metier:
    title: كاميل تختم الحديث
    gloss: 'كاميل: لكل مهنة إيقاعها الخاص، على ما أظن.'
    note: عبارة ختامية طبيعية فيها شيء من التأمل؛ يكفي أن تفهم معناها دون الحاجة إلى إعادتها بالنص نفسه.
