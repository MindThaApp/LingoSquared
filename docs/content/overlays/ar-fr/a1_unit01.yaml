teaching:
  fr.a1.unit01.lesson01.teach.bonjour:
    title: تحية محايدة
    gloss: مرحبًا؛ صباح الخير
    note: Bonjour مناسبة مع الغرباء والزملاء والأصدقاء خلال النهار. وهي تحمل أيضًا معنى «يومًا سعيدًا»، فلا تقتصر على التحية وحدها.
  fr.a1.unit01.lesson01.teach.salut:
    title: تحية غير رسمية
    gloss: أهلًا؛ إلى اللقاء
    note: Salut تُستعمل في العلاقات غير الرسمية. يمكن أن تفتتح الحديث أو تختمه، لكنها ليست الخيار الأسلم مع شخص بالغ لا تعرفه.
  fr.a1.unit01.lesson01.teach.au_revoir:
    title: وداع محايد
    gloss: مع السلامة
    note: Au revoir تصلح في المواقف الرسمية وغير الرسمية معًا.
  fr.a1.unit01.lesson01.teach.tu:
    title: ضمير المخاطب المفرد غير الرسمي
    gloss: أنتَ/أنتِ (للمفرد في المقام غير الرسمي)
    note: في الفرنسية يُخاطَب بـ tu صديقٌ واحد أو طفل أو شخص تربطك به علاقة ودّية صريحة، وله صيغ تصريف خاصة به. أما مع غير هؤلاء فيُستعمل vous.
  fr.a1.unit01.lesson01.teach.vous:
    title: ضمير المخاطب المهذّب أو الجمع
    gloss: أنتَ/أنتِ للتوقير، أو أنتم
    note: Vous هو الخيار الآمن مع شخص بالغ لا تعرفه، وهو أيضًا الصيغة المستعملة مع أي مجموعة. فالضمير نفسه يدل على التهذيب وعلى الجمع، ولذلك يُفهم المقصود من سياق العلاقة.
  fr.a1.unit01.lesson01.teach.comment_allez_vous:
    title: سؤال رسمي عن الحال
    gloss: كيف حالك؟
    note: Allez هي صيغة vous من الفعل aller. يُقلب ترتيب الفعل والضمير ويُوصلان بشرطة. هذا سؤال مجاملة معتاد، وليس استفسارًا حرفيًا عن وجهة الشخص.
  fr.a1.unit01.lesson01.teach.comment_vas_tu:
    title: سؤال غير رسمي عن الحال
    gloss: كيف حالك؟
    note: Vas هي صيغة tu من الفعل aller. حين تصبح العلاقة غير رسمية تتحول allez-vous إلى vas-tu، فيتغيّر الفعل والضمير معًا.
  fr.a1.unit01.lesson01.teach.register_choice:
    title: مطابقة التحية للعلاقة
    gloss: Bonjour مع vous؛ وsalut مع tu
    note: هذه الاقترانات قواعد افتراضية مفيدة، وليست قوانين مطلقة. يمكن استعمال bonjour مع الأصدقاء أيضًا، أما salut مع vous فيعطي عادةً إشارتين اجتماعيتين متعارضتين.
  fr.a1.unit01.lesson02.teach.je_mappelle:
    title: قل اسمك
    gloss: اسمي كاميل.
    note: Je m’appelle تعني حرفيًا «أسمّي نفسي». يلزم في الفرنسية عادةً ذكر الفاعل je، بينما يكفي في العربية الفعل وحده. وتسقط حركة e في me قبل appelle، فيصبح m’appelle.
  fr.a1.unit01.lesson02.teach.comment_appelez_vous:
    title: السؤال عن الاسم بتهذيب
    gloss: ما اسمك؟
    note: 'Appelez هي صيغة vous من الفعل appeler. ويأتي vous الثاني بعد الفعل لأن السؤال مبني على قلب الترتيب: vous appelez-vous.'
  fr.a1.unit01.lesson02.teach.tu_tappelles:
    title: السؤال عن الاسم بصيغة غير رسمية
    gloss: ما اسمك؟
    note: T’appelles هي صيغة tu، وقد اختُصر فيها الضمير الانعكاسي te قبل الحرف المتحرك. يُبقي هذا السؤال اليومي tu قبل الفعل، ويضع comment في آخر الجملة.
  fr.a1.unit01.lesson02.teach.moi_cest:
    title: تقديم النفس في الحديث العادي
    gloss: أنا نوريه.
    note: Moi, c’est عبارة شائعة في التعارف الشفهي، وهي أقرب إلى لغة الحديث من ترجمة «أنا» حرفيًا.
  fr.a1.unit01.lesson02.teach.enchante:
    title: المطابقة بصيغة المذكر
    gloss: تشرفنا.
    note: يكتب المتحدث الذكر عادةً enchanté. وكما يتغيّر الوصف في العربية بحسب الجنس (مسرور/مسرورة)، فإن هذا الوصف في الفرنسية يتبع جنس المتحدث أيضًا.
  fr.a1.unit01.lesson02.teach.enchantee:
    title: المطابقة بصيغة المؤنث
    gloss: تشرفنا.
    note: تكتب المتحدثة الأنثى عادةً enchantée بإضافة e في آخرها. وتُنطق enchanté وenchantée عمومًا بالطريقة نفسها، فالفرق أوضح في الكتابة منه في النطق.
  fr.a1.unit01.lesson02.teach.et_vous:
    title: إعادة السؤال بتهذيب
    gloss: وأنت؟
    note: استعمل vous للحفاظ على المستوى المهذّب أو لمخاطبة مجموعة.
  fr.a1.unit01.lesson02.teach.et_toi:
    title: إعادة السؤال بصيغة غير رسمية
    gloss: وأنت؟
    note: Toi هو الضمير المنفصل المقابل لـ tu. بعد et يُستعمل toi لا tu.
  fr.a1.unit01.lesson03.teach.elision_jhabite:
    title: الحذف الصوتي قبل الحرف المتحرك
    gloss: أسكن
    note: 'يفقد je حركته قبل habite، وتدل الفاصلة العليا على هذا الحذف: j’habite. ولا يمنع حرف h في habiter حدوث الحذف.'
  fr.a1.unit01.lesson03.teach.liaison_vous_etes:
    title: الوصل بعد vous
    gloss: أنتم؛ أنتَ (للتوقير)
    note: حرف s الأخير في vous صامت عادةً، لكنه قبل الصوت المتحرك في êtes يتصل بصوت z، فتُنطق vous êtes تقريبًا «فو-زيت». فالوصل خاصية النطق في العبارة، وليس من الإملاء.
  fr.a1.unit01.lesson03.teach.liaison_un_atelier:
    title: الوصل بعد un
    gloss: ورشة
    note: تتصل النون الأخيرة في un بكلمة atelier. تجنّب وضع وقفة قوية بين الكلمتين.
  fr.a1.unit01.lesson03.teach.final_e_enchante:
    title: الكتابة بصيغة المذكر
    gloss: سررتُ بلقائك (المتحدث)
    note: تنتهي enchanté بحرف é عندما يكون المتحدث ذكرًا. والمقطع -an- صائت أنفي، فلا تنطق صوت n مستقلًا بعده.
  fr.a1.unit01.lesson03.teach.final_e_enchantee:
    title: الكتابة بصيغة المؤنث
    gloss: سررتُ بلقائك (المتحدثة)
    note: تضيف enchantée حرف e للمطابقة مع المؤنث، لكن هذا الحرف الإضافي لا يضيف عادةً مقطعًا منطوقًا آخر.
  fr.a1.unit01.lesson03.teach.question_liaison:
    title: قراءة سؤال مبني على قلب الترتيب
    gloss: كيف حالك؟
    note: اقرأ allez-vous وحدةً واحدة متصلة. حرف z المكتوب في allez لا يُنطق هنا صوتَ z إضافيًا؛ فالنطق المعياري تقريبًا «آلي فو».
  fr.a1.unit01.lesson04.teach.ca_va:
    title: سؤال يومي عن الحال
    gloss: كيف الحال؟؛ هل أنتَ بخير؟
    note: يحتوي ça على سيديّ (ç)، وهي تجعل حرف c يُنطق س قبل a. يمكن أن تكون العبارة نفسها سؤالًا أو جوابًا بحسب التنغيم.
  fr.a1.unit01.lesson04.teach.tres_bien:
    title: رد إيجابي جدًا
    gloss: بخير جدًا، شكرًا.
    note: تقوّي très معنى bien. وحرف s الأخير فيها صامت.
  fr.a1.unit01.lesson04.teach.ca_va_bien:
    title: رد إيجابي
    gloss: أنا بخير.
    note: لا تحتاج الفرنسية في هذا الرد الثابت إلى ضمير مقابل لـ «أنا»، وهذا يشبه العربية.
  fr.a1.unit01.lesson04.teach.pas_mal:
    title: رد إيجابي بدرجة معتدلة
    gloss: لا بأس.
    note: Pas mal غالبًا إيجابية بدرجة خفيفة، مثل «لا بأس» في العربية.
  fr.a1.unit01.lesson04.teach.fatigue:
    title: مطابقة الصفة بصيغة المذكر
    gloss: أنا متعب قليلًا.
    note: Suis هي صيغة je من الفعل être. يكتب المتحدث الذكر fatigué. وتتغيّر الصفة بحسب جنس المتحدث، كما في العربية (متعب/متعبة).
  fr.a1.unit01.lesson04.teach.fatiguee:
    title: مطابقة الصفة بصيغة المؤنث
    gloss: أنا متعبة قليلًا.
    note: تكتب المتحدثة الأنثى fatiguée بحرف e في آخرها. وتُنطق صيغتا المذكر والمؤنث عادةً بالطريقة نفسها.
  fr.a1.unit01.lesson04.teach.et_vous:
    title: إعادة السؤال بتهذيب
    gloss: وأنت؟
    note: يحافظ vous على الاحترام المناسب مع شخص بالغ لا تعرفه.
  fr.a1.unit01.lesson04.teach.et_toi:
    title: إعادة السؤال بصيغة غير رسمية
    gloss: وأنت؟
    note: استعمل toi بعد et عند مخاطبة صديق واحد أو زميل بصيغة غير رسمية.
  fr.a1.unit01.lesson05.teach.here_for_workshop:
    title: التأكد من سبب وجود الشخص
    gloss: هل أنتم هنا من أجل الورشة؟
    note: Êtes هي صيغة vous من الفعل être. لا تحتاج الفرنسية هنا إلى أداة استفهام؛ فالتنغيم الصاعد يجعل الجملة سؤالًا.
  fr.a1.unit01.lesson05.teach.yes_thats_it:
    title: تأكيد افتراض
    gloss: نعم، هذا صحيح.
    note: C’est ça تأكيد طبيعي يعني «هذا صحيح»، وليست ترجمة حرفية لعبارة «هو ذلك».
  fr.a1.unit01.lesson05.teach.live_neighborhood:
    title: السؤال عن مكان السكن
    gloss: هل تسكنون في هذا الحي؟
    note: Habitez هي صيغة vous من الفعل habiter. يمكن في الفرنسية الإبقاء على ترتيب الجملة الخبرية مع تنغيم الاستفهام، دون أداة استفهام.
  fr.a1.unit01.lesson05.teach.i_live:
    title: قل أين تسكن
    gloss: أسكن في مونتروي.
    note: J’habite هي صيغة je من الفعل habiter مع الحذف الصوتي. وتدل À على موقع في مدينة، ولا تُخلط بـ a، وهي صيغة الفعل التي تعني «يملك».
  fr.a1.unit01.lesson05.teach.from_here:
    title: السؤال عن الأصل المحلي
    gloss: هل أنتم من هنا؟
    note: تجمع D’ici بين de وici بالحذف الصوتي. ويبقى êtes صيغة vous من الفعل être.
  fr.a1.unit01.lesson05.teach.from_lille:
    title: قل من أين أنت
    gloss: أنا من ليل.
    note: Suis هي صيغة je من الفعل être. تستعمل الفرنسية de قبل اسم المدينة عند ذكر الأصل.
  fr.a1.unit01.lesson05.teach.workshop_starts:
    title: بدء النشاط
    gloss: تبدأ الورشة الآن.
    note: كلمة atelier مذكّرة، ولذلك أداة التعريف معها في المفرد هي le. وقبل الحرف المتحرك يصبح le إلى l’. أما commence فهي صيغة الغائب المفرد.
  fr.a1.unit01.lesson05.teach.see_you_shortly:
    title: وداع لوقت قريب
    gloss: أراك بعد قليل؛ أراك لاحقًا اليوم
    note: تدل À tout à l’heure على لقاء آخر في اليوم نفسه، بخلاف وداع عام لا يُنتظر فيه موعد.
  fr.a1.unit01.lesson06.teach.line01:
    title: افتتاح اللقاء
    gloss: تحيّي إينيس ماتيو وتتأكد من أنه هنا من أجل ورشة الطبخ.
    note: يبدأ المتحدثان بـ vous لأن كلًّا منهما بالغ لا يعرف الآخر.
  fr.a1.unit01.lesson06.teach.line02:
    title: 'افتتاح اللقاء: الرد'
    gloss: يؤكد ماتيو ويذكر اسمه، ثم يسألها عن اسمها.
    note: Je m’appelle هي الطريقة المعتادة لذكر الاسم.
  fr.a1.unit01.lesson06.teach.line03:
    title: تبادل الأسماء
    gloss: تذكر إينيس اسمها وتقول إنها سعيدة بلقائه.
    note: تتطابق enchantée مع إينيس (مؤنث)؛ يُكتب حرف e في آخرها لكنه لا يُسمع عادةً.
  fr.a1.unit01.lesson06.teach.line04:
    title: تبادل الأسماء، الردّ
    gloss: يردّ ماتيو المجاملة ويسألها هل تسكن في الجوار.
    note: تتطابق enchanté مع ماتيو (مذكر)، وهي الكلمة نفسها التي قالتها إينيس للتو من دون حرف e الصامت.
  fr.a1.unit01.lesson06.teach.line05:
    title: تبادل معلومات عن الحي
    gloss: تؤكد إينيس وتذكر اسم شارعها، ثم تسأل ماتيو السؤال نفسه.
    note: عند ذكر اسم شارع مع J’habite لا يُستعمل حرف جر قبل rue.
  fr.a1.unit01.lesson06.teach.line06:
    title: 'تبادل معلومات عن الحي: الرد'
    gloss: يقول ماتيو إنه يسكن في سان-ويان ويسألها هل هي من هنا أصلًا.
    note: تستعمل J’habite à حرف à قبل اسم المكان، بخلاف تعبير الشارع الذي استعملته إينيس للتو.
  fr.a1.unit01.lesson06.teach.line07:
    title: تبادل معلومات عن الأصل
    gloss: تقول إينيس إنها ليست من هنا وإنها من ليل، ثم تسأل ماتيو.
    note: 'Je suis de + اسم مدينة: عبارة تذكر المكان الذي ينحدر منه الشخص.'
  fr.a1.unit01.lesson06.teach.line08:
    title: تبادل بلدان الأصل، الرد
    gloss: يقول ماتيو إنه من ليون.
    note: هي نفس بنية je suis de التي استخدمتها إينيس للتو.
  fr.a1.unit01.lesson06.teach.line09:
    title: إيقاف المحادثة مؤقتًا
    gloss: تلاحظ إينيس أن الورشة تبدأ، فتقول له إنها ستراه بعد قليل.
    note: تناسب عبارة À tout à l’heure هذا الموقف لأن الشخصين سيبقيان في الفعالية نفسها.
  fr.a1.unit01.lesson06.teach.line10:
    title: إيقاف المحادثة مؤقتًا، الرد
    gloss: يردد ماتيو عبارة الوداع نفسها.
    note: إعادة À tout à l’heure هي الطريقة الطبيعية لتأكيد اللقاء القريب.
exercises:
  fr.a1.unit01.lesson01.exercise01.listen_bonjour:
    instruction: استمع واختر العبارة التي تسمعها.
    correct_option: Bonjour.
    distractors:
    - Salut !
    - Au revoir.
    accepted_answers:
    - Bonjour.
    - Bonjour
  fr.a1.unit01.lesson01.exercise02.choose_informal:
    instruction: أي ضمير يناسب هذه التحية غير الرسمية؟
    correct_option: tu
    distractors:
    - vous
    accepted_answers:
    - tu
    feedback: Salut وtu يشكلان معًا ثنائيًا منسجمًا في الأسلوب غير الرسمي.
  fr.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: أكمل التحية الموجهة إلى شخص بالغ واحد لا تعرفه.
    accepted_answers:
    - vous
    feedback: Vous هو الاختيار الآمن والمحترم مع شخص بالغ لا تعرفه.
  fr.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: رتّب سؤال السلام المهذب.
    correct_response:
    - Comment
    - allez-vous
  fr.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: اكتب السؤال غير الرسمي الذي تسمعه.
    accepted_answers:
    - Comment vas-tu ?
    - Comment vas-tu?
    - Comment vas tu ?
    - Comment vas tu?
  fr.a1.unit01.lesson01.exercise06.match_register:
    instruction: طابق كل تحية مع مستوى الرسمية المعتاد لها عند المبتدئين.
    correct_response:
      Bonjour: vous
      Salut: أنتَ (للمخاطب المقرَّب)
    pairs:
    - left: Bonjour
      right: vous
    - left: Salut
      right: أنتَ (للمخاطب المقرَّب)
  fr.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: أكمل عبارة الوداع المحايدة.
    accepted_answers:
