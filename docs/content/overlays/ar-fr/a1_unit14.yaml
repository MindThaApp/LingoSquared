course:
  title: الفرنسية A1
  description: تكوين مقارنات بسيطة (plus/moins/aussi... que) وصيغ التفضيل (le/la plus...)، مع متابعة قصة ورشة الطبخ لإينيس وماتيو وهما يقارنان بين نوعين من الجبن أثناء التسوّق. يبيّن الدرس أنّ *meilleur* (أفضل) و*le meilleur* (الأفضل) شاذّان، بخلاف نمط *plus... que* المنتظم المستعمل مع معظم الصفات الأخرى.
units:
  fr.a1.unit14.comparisons:
    title: أكثر أم أقل؟
lessons:
  fr.a1.unit14.lesson01.vocabulaire_comparaisons:
    title: أكثر، أقل، بقدر
  fr.a1.unit14.lesson02.superlatifs:
