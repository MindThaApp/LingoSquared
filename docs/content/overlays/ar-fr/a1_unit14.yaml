  fr.a1.unit14.lesson03.dialogue_comparer_fromages:
    title: مقارنة نوعين من الجبن في السوق
teaching:
  fr.a1.unit14.lesson01.teach.plus_que:
    title: أكثر ... من
    gloss: أكثر ... من
    note: تُكوَّن المقارنة في الفرنسية بالتركيب *plus + صفة + que* دون أي تغيير في شكل الصفة.
    example_gloss: هذا الجبن أغلى من الجبن الآخر.
  fr.a1.unit14.lesson01.teach.moins_que:
    title: أقل ... من
    gloss: أقل ... من
    note: '*Moins* هي عكس *plus* مباشرة في نمط المقارنة نفسه.'
    example_gloss: هذه الوصفة أقل صعوبة من الوصفة الأخرى.
  fr.a1.unit14.lesson01.teach.aussi_que:
    title: بقدر ... / مثل ...
    gloss: بقدر ... / مثل ...
    note: تعبّر البنية *Aussi + adjective + que* عن المساواة بين شيئين.
    example_gloss: التارت جيدة بقدر الكيش.
  fr.a1.unit14.lesson01.teach.meilleur_que:
    title: أفضل من
    gloss: أفضل من
    note: '*Meilleur* هي صيغة المقارنة الشاذة للصفة *bon* (جيد)؛ ولا يقول الفرنسيون *plus bon*.'
    example_gloss: هذه الكعكة أفضل من الأولى.
  fr.a1.unit14.lesson01.teach.cher_bon_marche:
    title: غالٍ، رخيص
    gloss: غالٍ، رخيص / اقتصادي
    note: '*Bon marché* ثابتة لا يتغيّر شكلها، رغم أنها تبدو كأنها ستتطابق مع الموصوف كبقية الصفات.'
    example_gloss:
    - الجبن غالٍ.
    - الخضروات رخيصة.
  fr.a1.unit14.lesson01.teach.facile_difficile:
    title: سهل، صعب
    gloss: سهل، صعب
    note: زوج صفات شائع لوصف الوصفات؛ شكلاهما واحد في المذكر والمؤنث، ويُضاف -s في الجمع (*faciles*, *difficiles*).
    example_gloss:
    - هذه الوصفة سهلة.
    - الكيش صعبة قليلًا.
  fr.a1.unit14.lesson02.teach.le_plus_cher:
    title: الأغلى
    gloss: الأغلى
    note: يُكوَّن التفضيل بالتركيب *le/la plus + صفة*، وأداة التعريف فيه إلزامية بخلاف المقارنة.
    example_gloss: إنه أغلى جبن في السوق.
  fr.a1.unit14.lesson02.teach.la_moins_chere:
    title: الأرخص
    gloss: الأرخص
    note: تتطابق *La moins chère* مع الاسم المؤنث *recette*؛ أما صيغة المذكر فهي *le moins cher*.
    example_gloss: إنها الوصفة الأرخص.
  fr.a1.unit14.lesson02.teach.le_meilleur:
    title: الأفضل
    gloss: الأفضل
    note: '*Le meilleur* هو صيغة التفضيل الشاذة للصفة *bon*، ويقابل *meilleur* في المقارنة.'
    example_gloss: إنها أفضل كعكة في الورشة!
  fr.a1.unit14.lesson02.teach.la_plus_facile:
    title: الأسهل
    gloss: الأسهل
    note: صيغة تفضيل منتظمة تتبع النمط *le/la plus + صفة* مباشرة.
    example_gloss: إنها أسهل وصفة للتحضير.
  fr.a1.unit14.lesson02.teach.grammar_superlative_note:
    title: نمط التفضيل
    gloss: le/la plus + صفة؛ و meilleur شاذ
    note: معظم صيغ التفضيل في الفرنسية منتظمة (*le/la plus + صفة*)، لكن *bon* ← *meilleur* ← *le meilleur* استثناء يجب حفظه.
  fr.a1.unit14.lesson02.teach.comparer_les_prix:
    title: اقتراح مقارنة الأسعار
    gloss: لنقارن الأسعار قبل الشراء.
    note: '*Comparons* هي صيغة الأمر مع *nous* من الفعل *comparer*، أي «لنقارن»، وهي عبارة طبيعية عند التسوّق.'
  fr.a1.unit14.lesson03.teach.line01:
    title: ملاحظة وجود خيارين
    gloss: 'تقول إينيس: انظر، هناك نوعان من الجبن، فأيّهما نأخذ؟'
    note: تُستعمل *Lequel* («أيّهما») لتطلب من الشخص الآخر الاختيار بين خيارين سبق ذكرهما.
  fr.a1.unit14.lesson03.teach.line02:
    title: المقارنة وذكر الجودة
    gloss: يقول ماتيو إنّ هذا أغلى من الآخر، لكنه يبدو أفضل.
    note: يخفّف التركيب *Avoir l'air* + صفة («يبدو») من حدّة الحكم على جودة لم تُجرَّب بعد.
  fr.a1.unit14.lesson03.teach.line03:
    title: الاختلاف في المقارنة
    gloss: تسأله إينيس إن كان متأكدًا، وتقول إنها ترى الآخر جيدًا بالقدر نفسه وأرخص.
    note: تجمع إينيس بين *aussi* و*moins* في ردّ واحد لتخالفه بأدب؛ وقد حُذفت *que* لأنّ الجبن المقارَن به (جبن ماتيو) واضح من السياق.
  fr.a1.unit14.lesson03.teach.line04:
    title: التسليم بمسألة السعر
    gloss: 'يوافق ماتيو قائلًا: هذا صحيح، إنه الأرخص بين الاثنين.'
    note: تحصر *Des deux* («بين الاثنين») التفضيل في هذين النوعين فقط، لا في السوق كله.
  fr.a1.unit14.lesson03.teach.line05:
    title: اتخاذ القرار النهائي
    gloss: 'تقول إينيس: إذن لنأخذ ذلك، فهو أفضل خيار للورشة.'
    note: تعود *Celui-là* («ذلك») إلى الجبن الأرخص الذي جرى الحديث عنه للتو.
  fr.a1.unit14.lesson03.teach.line06:
    title: ذكر الفائدة
    gloss: يوافق ماتيو ويقول إنه سيبقى لديهما مال أكثر للحلوى!
    note: '*Il nous reste* (حرفيًا: يبقى لنا) طريقة شائعة للتعبير عن «بقي لدينا ...».'
