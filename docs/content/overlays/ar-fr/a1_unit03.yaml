course:
  title: الفرنسية A1
  description: مفردات العائلة القريبة والممتدة، ونظام صفات الملكية mon/ma/mes، ووصف الأسرة، مع متابعة قصة ورشة الطبخ لإينيس وماتيو من الوحدتين 01-02. وتبرز الدورة أن صفات الملكية في الفرنسية تتفق مع جنس الاسم المملوك لا مع جنس المالك.
units:
  fr.a1.unit03.family:
    title: عائلتا إينيس وماتيو
lessons:
  fr.a1.unit03.lesson01.immediate_family:
    title: العائلة القريبة
  fr.a1.unit03.lesson02.possessives_mon_ma_mes:
    title: 'صفات الملكية: mon, ma, mes'
  fr.a1.unit03.lesson03.extended_family:
    title: العائلة الممتدة
  fr.a1.unit03.lesson04.describing_family_size:
    title: كم فردًا في البيت
  fr.a1.unit03.lesson05.reading_a_family_profile:
    title: قراءة تعريف بعائلة
  fr.a1.unit03.lesson06.family_photos_dialogue:
    title: صور عائلية مع إينيس وماتيو
teaching:
  fr.a1.unit03.lesson01.teach.mere:
    title: الأم
    gloss: أم
    note: '*Mère* مؤنث. وكلمة *Maman* أشيع في الاستعمال اليومي بين أفراد العائلة، أما *mère* فمحايدة وتُستعمل في قوائم مفردات هذه الدورة.'
  fr.a1.unit03.lesson01.teach.pere:
    title: الأب
    gloss: أب
    note: '*Père* مذكر. و*Papa* هي المقابل اليومي، على غرار *mère*/*maman*.'
  fr.a1.unit03.lesson01.teach.frere:
    title: الأخ
    gloss: أخ
    note: '*Frère* اسم مذكر مفرد.'
  fr.a1.unit03.lesson01.teach.soeur:
    title: الأخت
    gloss: أخت
    note: '*Sœur* اسم مؤنث مفرد. والرمز œ حرف واحد في الإملاء الفرنسي، لا حرفان منفصلان.'
  fr.a1.unit03.lesson01.teach.fils:
    title: الابن
    gloss: ابن
    note: '*Fils* مذكر؛ لاحظ أن حرف s الأخير يُنطق هنا (استثناء)، بينما لا يُنطق حرف l.'
  fr.a1.unit03.lesson01.teach.fille:
    title: الابنة
    gloss: ابنة
    note: '*Fille* مؤنث مفرد؛ وتعني الكلمة نفسها أيضًا «بنت» في سياقات أخرى.'
  fr.a1.unit03.lesson01.teach.parents:
    title: Parents
    gloss: الوالدان
    note: '*Parents* مذكر جمع، وتشمل الأم والأب معًا.'
  fr.a1.unit03.lesson01.teach.freres_et_soeurs:
    title: الإخوة
    gloss: إخوة وأخوات
    note: ليس في الفرنسية كلمة واحدة محايدة للدلالة على الإخوة والأخوات معًا؛ فتذكر *frères et sœurs* الجنسين صراحةً.
  fr.a1.unit03.lesson02.teach.ma_mere:
    title: أمي
    gloss: أمي
    note: '*Ma* هي صفة الملكية للمفرد المؤنث بمعنى «ـي»، وتُستعمل لأن *mère* مؤنثة.'
  fr.a1.unit03.lesson02.teach.mon_pere:
    title: أبي
    gloss: أبي
    note: '*Mon* هي صفة الملكية للمفرد المذكر بمعنى «ـي»، وتُستعمل لأن *père* مذكر.'
  fr.a1.unit03.lesson02.teach.mes_freres_et_soeurs:
    title: إخوتي
    gloss: إخوتي
    note: '*Mes* هي صفة الملكية للجمع، وتُستعمل مع أي اسم جمع مهما كان جنسه. وهي تتبع نمط التطابق نفسه في *ma*/*mon* لكن بحسب العدد لا الجنس.'
  fr.a1.unit03.lesson02.teach.as_tu_des_freres_et_soeurs:
    title: السؤال عن الإخوة
    gloss: هل لديك إخوة؟
    note: '*As-tu* هي صيغة السؤال بالقلب من *tu as* (لديك)، وهي صيغة سؤال شائعة في المستوى A1.'
  fr.a1.unit03.lesson02.teach.jai_deux_soeurs:
    title: ذكر عدد الإخوة
    gloss: لديّ أختان.
    note: '*J''ai* (لديّ) مع عدد واسم من أسماء العائلة هي الطريقة المعتادة لوصف الإخوة والأخوات.'
  fr.a1.unit03.lesson02.teach.ta_famille_est_grande:
    title: السؤال عن كِبَر العائلة
    gloss: هل عائلتك كبيرة؟
    note: '*Ta* هي صفة الملكية للمفرد المؤنث في مخاطبة المقرَّب بمعنى «ـكَ/ـكِ»، وتتطابق مع الاسم المؤنث *famille*.'
  fr.a1.unit03.lesson02.teach.ma_famille_est_petite:
    title: وصف عائلة صغيرة
    gloss: عائلتي صغيرة.
    note: تتطابق *Petite* مع الاسم المؤنث *famille*؛ أما مع الاسم المذكر فتظهر الصيغة المذكرة *petit*. وهذا محور تطابق مختلف عن *mon*/*ma*/*mes*، فتلك تتطابق مع الاسم أيضاً لكنها تدل على الملكية، لا على وصف صفة.
  fr.a1.unit03.lesson03.teach.grand_pere:
    title: الجد
    gloss: جد
    note: '*Grand-père* كلمة مركبة بشرطة، وهي مذكرة.'
  fr.a1.unit03.lesson03.teach.grand_mere:
    title: الجدة
    gloss: جدة
    note: '*Grand-mère* كلمة مركبة بشرطة، وهي مؤنثة. لاحظ أن *grand-* يبقى ثابتاً هنا ولا يصبح *grande-mère*.'
  fr.a1.unit03.lesson03.teach.grands_parents:
    title: الأجداد
    gloss: الأجداد (الجدّ والجدّة)
    note: في *Grands-parents* يُجمع جزءا المركب (*grands* وليس *grand-*)، بخلاف *grand-mère*/*grand-père* حيث يبقى الجزء *grand-* ثابتاً في المفرد.
  fr.a1.unit03.lesson03.teach.oncle:
    title: العم / الخال
    gloss: عم / خال
    note: '*Oncle* كلمة مذكرة.'
  fr.a1.unit03.lesson03.teach.tante:
    title: العمة / الخالة
    gloss: عمة / خالة
    note: '*Tante* كلمة مؤنثة.'
  fr.a1.unit03.lesson03.teach.cousin:
    title: ابن العم / ابن الخال
    gloss: ابن عم / ابن خال
    note: '*Cousin* مذكر مفرد؛ فالفرنسية تُبيّن جنس القريب كما تفعل العربية في «ابن العم» و«بنت العم»: cousin للذكر وcousine للأنثى.'
  fr.a1.unit03.lesson03.teach.cousine:
    title: بنت العم / بنت الخال
    gloss: بنت عم / بنت خال
    note: '*Cousine* مؤنث مفرد، وتتكوّن بإضافة -e إلى *cousin*.'
  fr.a1.unit03.lesson03.teach.mes_grands_parents:
    title: أجدادي
    gloss: أجدادي
    note: تُستعمل *Mes* لأن *grands-parents* جمع، حتى وإن كان المركب يضم فرداً مذكراً وآخر مؤنثاً ضمناً.
  fr.a1.unit03.lesson04.teach.combien_de_freres_et_soeurs:
    title: السؤال عن عدد الإخوة
    gloss: كم أخًا وأختًا لديك؟
    note: تأتي *Combien de* (كم) قبل الاسم مباشرة في الفرنسية، ثم يُقلب الفعل مع الضمير (as-tu) دون أي أداة مساعدة.
  fr.a1.unit03.lesson04.teach.on_est_cinq:
    title: ذكر عدد أفراد الأسرة
    gloss: نحن ستة في البيت.
    note: '*On est* (حرفياً «المرء يكون»، لكنها تؤدي معنى «نحن») هي الطريقة الطبيعية الشائعة للتعبير عن العدد الإجمالي لأفراد البيت في الكلام الفرنسي المحكي؛ أما *nous sommes* فأكثر رسمية وتُستعمل في الكتابة.'
  fr.a1.unit03.lesson04.teach.ma_famille_est_grande:
    title: وصف أسرة كبيرة
    gloss: أسرتي كبيرة.
    note: تتطابق *Grande* مع الاسم المؤنث *famille*؛ أما مع الاسم المذكر فتظهر الصيغة المذكرة *grand*.
  fr.a1.unit03.lesson04.teach.jai_beaucoup_de_cousins:
    title: ذكر أن لديك أبناء عم كثيرين
    gloss: لدي أبناء عم كثيرون.
    note: تأتي *Beaucoup de* (كثير من) قبل الاسم؛ ولا تتحول *de* إلى *du*/*des* هنا لأن *beaucoup* تحدد الكمية أصلاً.
  fr.a1.unit03.lesson04.teach.tu_habites_pres_de_tes_parents:
    title: السؤال عن السكن قرب الوالدين
    gloss: هل تسكن قرب والديك؟
    note: '*Tes* هي صفة الملكية للجمع في مخاطبة المقرَّب بمعنى «ـكَ/ـكِ»، وهي لازمة لأن *parents* جمع.'
  fr.a1.unit03.lesson04.teach.jhabite_avec_mes_grands_parents:
    title: ذكر من تعيش معه
    gloss: أعيش مع أجدادي.
    note: تُدخل *Avec* (مع) الأشخاص الذين يسكن المرء معهم؛ و*j'habite* هي صيغة *je* من *habiter*، وقد مرّت في الوحدة 1 في *j'habite à Montreuil*.
  fr.a1.unit03.lesson05.teach.profile_reading:
    title: ملف Inès عن عائلتها
    gloss: 'اسمي Inès. عمري واحد وثلاثون عاماً، وأسكن مع جدّي وجدّتي في Paris. أمي وأبي يسكنان في Lille. لديّ أختان وأخ: نحن ستة في البيت. اسم أختي الصغرى Camille وعمرها عشرون عاماً.'
    note: يعيد هذا الملف استخدام مفردات وتراكيب الدروس من 1 إلى 4 في نص قصير متصل بدل الجمل المنفصلة، وهي مهارة القراءة نفسها (معرفة مَن هو مَن) التي يركز عليها تقييم القراءة في هذه الوحدة.
    glosses:
      trente: ثلاثون
      ans: عامًا (من العمر)
      grands-parents: الأجداد
      mère: أم
      père: أب
      habitent: أسكن (من habiter)
      deux: اثنان
      sœurs: أخوات
      frère: أخ
      six: ستة
      maison: بيت
      petite: صغرى / صغيرة
      sœur: أخت
      vingt: عشرون
  fr.a1.unit03.lesson05.teach.petite_soeur:
    title: الأخت الصغرى
    gloss: أختي الصغرى
    note: تأتي *Petite* (مؤنث *petit*) قبل الاسم هنا، كما تفعل أغلب الصفات الفرنسية القصيرة الشائعة، بينما تأتي معظم الصفات الأخرى بعد الاسم.
  fr.a1.unit03.lesson05.teach.habite_third_person:
    title: يعيش (الغائب)
    gloss: يعيش
    note: '*Habite* هي صيغة الغائب المفرد من *habiter*، وتُستعمل للحديث عن شخص آخر (*Inès habite...*) لا عن النفس (*j''habite*، التي مرّت في الوحدة 1 وفي الدرس الرابع من هذه الوحدة).'
  fr.a1.unit03.lesson05.teach.ses_third_person_plural:
    title: له / لها / لهم (مع اسم جمع)
    gloss: له / لها / لهم
    note: '*Ses* هي صيغة الجمع من *sa*/*son*، وكما تغطي *sa*/*son* معنى «ـه/ـها» مع الاسم المفرد، تغطيه ses مع الاسم الجمع. فـ*ses grands-parents* تعني «جدّها وجدّتها» عند الحديث عن Inès بصيغة الغائب.'
  fr.a1.unit03.lesson05.teach.a_third_person_avoir:
    title: لديه / لديها (الغائب)
    gloss: لديه / لديها
    note: '*A* هي صيغة الغائب المفرد من *avoir*، وتُستعمل للحديث عن شخص آخر (*elle a vingt ans*) لا عن النفس (*j''ai* / *as-tu*، اللتان مرّتا في الدروس من 2 إلى 4 من هذه الوحدة).'
  fr.a1.unit03.lesson06.teach.line01:
    title: عرض صور العائلة
    gloss: تُري Inès صديقها Mathieu صورة، وتقدّم له والديها وأختها الصغرى.
    note: تُستعمل *Voici* (ها هو / ها هي) لتقديم شيء يُشار إليه، وهي عبارة طبيعية عند عرض صورة.
  fr.a1.unit03.lesson06.teach.line02:
    title: التعليق على الصورة والسؤال عن الإخوة
    gloss: يُبدي Mathieu إعجابه بدفء ويسأل إن كان لديها إخوة وأخوات آخرون.
    note: '*C''est adorable* ردّ فعل طبيعي ودافئ عند رؤية صورة أخ أو أخت صغيرة.'
  fr.a1.unit03.lesson06.teach.line03:
    title: ذكر عدد أفراد الأسرة وردّ السؤال
    gloss: تقول Inès إن لديها أختين وأخاً، وإنهم ستة في البيت، ثم تسأل عن عائلة Mathieu.
    note: تذكر *On est six à la maison* العدد الإجمالي لأفراد البيت، متابِعةً نمط الدرس الرابع.
  fr.a1.unit03.lesson06.teach.line04:
    title: وصف أسرة أصغر
    gloss: 'يقول Mathieu إن عائلته أصغر، فهم ثلاثة فقط: والداه وهو، لكن لديه أقارب كثيرين من أبناء العمومة.'
    note: تُشير *Mais* (لكن) إلى التباين بين الأسرة الصغيرة والأقارب الكثيرين.
  fr.a1.unit03.lesson06.teach.line05:
    title: السؤال عن القرب من الوالدين
    gloss: تسأل Inès إن كان Mathieu يسكن قرب والديه.
    note: '*Près de* (قرب) طريقة شائعة لوصف القرب المكاني.'
  fr.a1.unit03.lesson06.teach.line06:
    title: شرح البعد والبقاء على تواصل
    gloss: يجيب Mathieu بلا، فهما يسكنان في Lyon، ويتحدثان عبر الهاتف كل أسبوع.
    note: 'يتابع هذا ما تقرر في الوحدة 1 من أن Mathieu من Lyon: بقي والداه هناك بينما يسكن هو في Saint-Ouen.'
  fr.a1.unit03.lesson06.teach.line07:
    title: إبداء التفهّم وذكر وضعك
    gloss: تقول Inès إنها تفهم، وإنها تسكن مع جدّها وجدّتها هنا في Paris.
    note: '*Je comprends* (أفهم) طريقة قصيرة وطبيعية للتفاعل مع ما قاله الآخر قبل إضافة تفصيل مشابه من عندك.'
  fr.a1.unit03.lesson06.teach.line08:
    title: الختام بعبارة دافئة
    gloss: يقول Mathieu إنه من الجميل أن تكون العائلة قريبة.
    note: تختم *C'est bien d'avoir sa famille près de soi* الحوار بنبرة دافئة متأملة، وتردد نمط *près de* من الدرس الرابع.
