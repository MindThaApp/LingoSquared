teaching:
  fr.a1.unit47.lesson01.teach.le_temps:
    title: الطقس
    gloss: الطقس
    note: تعني *Le temps* «الطقس» و«الوقت» معًا، وهي اسم مذكّر.
    example_gloss: كيف حال الطقس؟
  fr.a1.unit47.lesson01.teach.quel_temps_fait:
    title: السؤال عن الطقس
    gloss: كيف حال الطقس؟
    note: '*Quel temps fait-il ?* هو السؤال المعتاد عن الطقس؛ وتتفق *quel* مع الاسم المذكّر *temps*.'
  fr.a1.unit47.lesson01.teach.le_temps_est:
    title: مشمس
    gloss: الطقس مشمس.
    note: '*Le temps est* + صفة نمط شائع؛ وتتفق الصفة مع الاسم المذكّر *temps*.'
  fr.a1.unit47.lesson01.teach.il_pleut:
    title: تمطر
    gloss: إنها تمطر.
    note: 'يُستعمل الفعل *pleuvoir* (أمطر) بصيغة غير شخصية: *il pleut*، دون حاجة إلى صفة.'
  fr.a1.unit47.lesson01.teach.le_temps_est_2:
    title: غائم
    gloss: الطقس غائم.
    note: يتبع النمط نفسه *le temps est* + صفة كما في *ensoleillé*.
  fr.a1.unit47.lesson02.teach.il_fait_froid:
    title: بارد
    gloss: الطقس بارد اليوم.
    note: تحدّد *Aujourd'hui* (اليوم) زمن حالة الطقس؛ وتستعمل *il fait froid* الفعل *faire* لا *être*.
  fr.a1.unit47.lesson02.teach.il_fait_chaud:
    title: دافئ
    gloss: الطقس دافئ اليوم.
    note: تدلّ *Il fait chaud* على «دافئ» و«حارّ» معًا في الحديث اليومي عن الطقس.
  fr.a1.unit47.lesson02.teach.il_ne_fait:
    title: مقابلة بين درجات الحرارة
    gloss: الطقس ليس باردًا، بل دافئ.
    note: 'تحيط *Ne ... pas* بالفعل: *il ne fait pas froid*.'
  fr.a1.unit47.lesson03.teach.la_meteo:
    title: النشرة الجوية
    gloss: النشرة الجوية
    note: '*La météo* اسم مؤنّث، وهي اختصار لـ *la météorologie*.'
    example_gloss: ما هي النشرة الجوية؟
  fr.a1.unit47.lesson03.teach.demain_le_temps:
    title: طقس الغد
    gloss: غدًا الطقس مشمس.
    note: تأتي *Demain* في بداية الجملة تتبعها فاصلة، ويبقى بقية الترتيب كما هو.
  fr.a1.unit47.lesson03.teach.samedi_le_temps:
    title: نشرة جوية ليومين
    gloss: يوم السبت الطقس مشمس ودافئ، لكن يوم الأحد تمطر السماء طوال اليوم.
    note: تؤكّد *Toute la journée* (طوال اليوم) مدة هطول المطر.
  fr.a1.unit47.lesson04.teach.la_promenade:
    title: النزهة
    gloss: النزهة
    note: '*Promenade* مؤنّثة: *la promenade*.'
    example_gloss: هل نذهب في نزهة؟
  fr.a1.unit47.lesson04.teach.on_fait_une:
    title: اقتراح نزهة
    gloss: هل نذهب في نزهة؟
    note: '*On fait une promenade ?* طريقة ودّية لاقتراح خطة؛ و*faire une promenade* هي الصيغة الثابتة للتعبير عن «الذهاب في نزهة».'
  fr.a1.unit47.lesson04.teach.s_il_pleut:
    title: خطة مشروطة
    gloss: إذا أمطرت السماء، نبقى في الداخل.
    note: '*S''il pleut* (إذا أمطرت): تصبح *si* + *il* هكذا *s''il*؛ ثم تذكر *on reste à l''intérieur* ما سنفعله.'
  fr.a1.unit47.lesson04.teach.bonne_idee_faisons:
    title: الموافقة والاقتراح
    gloss: فكرة جيدة! لنذهب في نزهة.
    note: '*Faisons ...* (لنفعل ...) طريقة شائعة أخرى لاقتراح نشاط، إلى جانب *On ... ?*'
  fr.a1.unit47.lesson05.teach.meteo_samedi_le:
    title: قراءة نشرة جوية ليومين
    gloss: 'النشرة الجوية: يوم السبت الطقس مشمس ودافئ. يوم الأحد تمطر السماء طوال اليوم.'
    note: تتبّع حالة الطقس في كل يوم.
    glosses:
      Météo: نشرة جوية
      samedi: السبت
      ensoleillé: مشمس
      chaud: دافئ
      Dimanche: الأحد
      pleut: تمطر
      toute: كامل
      journée: يوم
  fr.a1.unit47.lesson06.teach.camille_quel_temps:
    title: كاميل تسأل عن عطلة نهاية الأسبوع
    gloss: 'كاميل: كيف سيكون الطقس في عطلة نهاية الأسبوع هذه؟'
    note: تضع *Ce week-end* (نهاية الأسبوع هذه) السؤال في المستقبل القريب.
  fr.a1.unit47.lesson06.teach.mathieu_samedi_le:
    title: ماتيو يذكر النشرة الجوية
    gloss: 'ماتيو: يوم السبت الطقس مشمس ودافئ، لكن يوم الأحد تمطر السماء طوال اليوم.'
    note: هذه هي الجملة نفسها التي وردت في النشرة الجوية التي قرأتها.
  fr.a1.unit47.lesson06.teach.camille_alors_on:
    title: كاميل تقترح خطة
    gloss: 'كاميل: إذن هل نذهب في نزهة يوم السبت؟'
    note: تربط *Alors* (إذن) الاقتراح مباشرة بالطقس الجميل الذي وصفه ماتيو.
  fr.a1.unit47.lesson06.teach.mathieu_bonne_idee:
    title: ماتيو يوافق ويخطط ليوم الأحد
    gloss: 'ماتيو: فكرة جيدة. ويوم الأحد نبقى في الداخل بهدوء.'
    note: تعني *Tranquillement* هنا «بهدوء ودون استعجال»، وتجعل البقاء في الداخل أمرًا مريحًا.
  fr.a1.unit47.lesson06.teach.camille_parfait_alors:
    title: كاميل تحسم الخطة
    gloss: 'كاميل: ممتاز، إذن سنشاهد فيلمًا.'
    note: يرتبط الفعل *regarder* (شاهد) بطبيعية مع *un film* (فيلم).
