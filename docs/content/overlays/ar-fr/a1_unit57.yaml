  fr.a1.unit57.lesson05.teach.camille_appelle_mathieu:
    title: من يستخدم ماذا؟
    gloss: كاميل تتصل بماتيو كل يوم. تستخدم هاتفها، لا تطبيقًا. ماتيو ليس لديه حاسوب في المنزل، لكنه يستخدم الإنترنت على هاتفه. توما يبحث عن حالة الطقس كل صباح. بعد ذلك يذهب للجري. ليا ترسل رسالة إلى كاميل كثيرًا. وأنت، هل تستخدم هاتفك كل يوم أيضًا؟
