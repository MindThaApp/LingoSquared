    title: À vélo, en train
    gloss: تستخدم الفرنسية *à* مع وسائل النقل التي تركبها أو تمشي بها (*à vélo*، *à pied*)، وتستخدم *en* مع وسائل النقل التي تجلس داخلها (*en train*، *en voiture*).
    note: يخطئ المتعلمون أحيانًا فيستخدمون حرف جر آخر، مثل *par vélo* أو *dans le train*. تعامل *à vélo* و*à pied* و*en train* و*en voiture* على أنها تعابير ثابتة.
