teaching:
  fr.a1.unit46.lesson01.teach.l_appartement_le:
    title: الشقة وغرفة الجلوس وغرفة النوم
    gloss: الشقة، غرفة الجلوس، غرفة النوم
    note: '*L''appartement* مذكر ويحذف حرف *e* من *le*؛ و*le salon* مذكر، و*la chambre* مؤنث.'
    example_gloss:
    - لديّ شقة.
    - لديّ غرفة جلوس.
    - لديّ غرفة نوم.
  fr.a1.unit46.lesson01.teach.la_cuisine_la:
    title: المطبخ والحمّام
    gloss: المطبخ، الحمّام
    note: '*La cuisine* و*la salle de bains* كلاهما مؤنث.'
    example_gloss:
    - لديّ مطبخ.
    - لديّ حمّام.
  fr.a1.unit46.lesson01.teach.j_ai_un:
    title: قول إنّ لديك شقة
    gloss: لديّ شقة.
    note: الفعل *avoir* (يملك / لدى) هو الفعل الطبيعي للتعبير عمّا تملكه من مسكن، وهو يقابل في العربية «لدى» أو «عندي». هذا مثال عامّ؛ أمّا شقة ماتيو في ليون فتأتي لاحقًا في هذه الوحدة.
  fr.a1.unit46.lesson01.teach.j_ai_un_2:
    title: سرد جميع الغرف
    gloss: لديّ صالون وغرفة نوم ومطبخ وحمّام.
    note: تجمع هذه الجملة الغرف الأربع من مفردات الدرس، وتفصل بينها بفواصل قبل *et* الأخيرة.
  fr.a1.unit46.lesson02.teach.tu_as_combien:
    title: السؤال عن عدد الغرف
    gloss: كم غرفة لديك؟
    note: 'يأتي بعد *combien de* (كم) اسم في صيغة الجمع: *combien de pièces*.'
  fr.a1.unit46.lesson02.teach.j_ai_deux:
    title: ذكر عدد غرف النوم
    gloss: لديّ غرفتا نوم.
    note: '*Chambres* جمع *chambre*، ويُصاغ بإضافة *-s* صامتة في الكتابة.'
  fr.a1.unit46.lesson02.teach.l_appartement_a:
    title: ذكر العدد الإجمالي للغرف
    gloss: تضمّ الشقة ثلاث غرف.
    note: '*Pièces* كلمة عامّة تعني الغرف، ولا تقتصر على غرف النوم.'
  fr.a1.unit46.lesson03.teach.le_balcon_le:
    title: شرفة، حديقة
    gloss: الشرفة، الحديقة
    note: كلمتا *le balcon* و*le jardin* كلتاهما مذكّر.
    example_gloss:
    - توجد شرفة.
    - لا توجد حديقة.
  fr.a1.unit46.lesson03.teach.il_y_a:
    title: قول إنّ شيئًا موجود
    gloss: توجد شرفة.
    note: '*Il y a* هو التركيب المعتاد للدلالة على الوجود، ويقابل «يوجد / توجد» في العربية.'
  fr.a1.unit46.lesson03.teach.il_n_y:
    title: قول إنّ شيئًا غير موجود
    gloss: لا توجد حديقة.
    note: 'تُستعمل *pas de* لنفي الاسم النكرة: *pas de jardin* وليس *pas un jardin*.'
  fr.a1.unit46.lesson04.teach.cosy:
    title: مريح ودافئ
    gloss: مريح ودافئ
    note: صفة فرنسية شائعة جدًّا تصف أجواءً دافئة ولطيفة، ولا يقابلها في العربية لفظ واحد بعينه.
    example_gloss: الشقة صغيرة لكنها مريحة ودافئة.
  fr.a1.unit46.lesson04.teach.l_appartement_est:
    title: نمط شائع في الوصف
    gloss: الشقة صغيرة لكنها مريحة ودافئة.
    note: عبارة *petit mais cosy* طريقة طبيعية جدًّا يصف بها الفرنسيون مسكنًا صغيرًا وصفًا إيجابيًّا.
  fr.a1.unit46.lesson04.teach.le_salon_est:
    title: وصف حجم الغرفة
    gloss: الصالون كبير.
    note: تصف *grand* غرفة واحدة محدّدة لا المسكن كلّه، وتتفق مع *le salon* لأنه مذكّر.
  fr.a1.unit46.lesson04.teach.la_cuisine_est:
    title: وصف حجم غرفة أخرى
    gloss: المطبخ صغير.
    note: 'النمط نفسه كما في كلمة *grand* في البطاقة السابقة، لكن مع غرفة أخرى: *la cuisine* مؤنثة، لذلك نقول *petite*.'
  fr.a1.unit46.lesson05.teach.appartement_a_lyon:
    title: قراءة إعلان عن سكن
    gloss: 'شقة في ليون: غرفة نوم، وصالون، ومطبخ، وحمّام. توجد شرفة لكن لا توجد حديقة. الشقة صغيرة لكنها مريحة ودافئة.'
    note: انتبه إلى عدد الغرف، وإلى المرافق الموجودة وغير الموجودة، وإلى الانطباع العامّ.
    glosses:
      Appartement: شقة
      chambre: غرفة نوم
      salon: غرفة جلوس
      cuisine: المطبخ
      bains: حمّام
      balcon: شرفة
      jardin: حديقة
      petit: صغير
      cosy: مريح ودافئ
  fr.a1.unit46.lesson06.teach.camille_salut_mathieu:
    title: كميل تسأل عن الشقة
    gloss: 'كميل: مرحبًا ماتيو، كيف هي شقتك الجديدة في ليون؟'
    note: '*Nouvel* هي صيغة *nouveau* (جديد) قبل اسم مذكّر يبدأ بحرف علّة: *un nouvel appartement*.'
  fr.a1.unit46.lesson06.teach.mathieu_il_est:
    title: ماتيو يصف شقته
    gloss: 'ماتيو: إنها صغيرة لكنها مريحة ودافئة. لديّ غرفة نوم وصالون ومطبخ وحمّام.'
    note: يطابق تمامًا إعلان السكن الذي قُرئ في الدرس الخامس، فهذه هي شقة ماتيو فعلًا.
  fr.a1.unit46.lesson06.teach.camille_tu_as:
    title: كميل تسأل عن الشرفة
    gloss: 'كميل: هل لديك شرفة؟'
    note: سؤال مباشر جوابه نعم أو لا باستعمال *Tu as ... ?*
  fr.a1.unit46.lesson06.teach.mathieu_oui_j:
    title: ماتيو يجيب
    gloss: 'ماتيو: نعم، لديّ شرفة لكن لا توجد حديقة.'
    note: يطابق ما ورد في إعلان الدرس الخامس عن الشرفة وغياب الحديقة.
  fr.a1.unit46.lesson06.teach.balcon_est_masculin:
    title: جنس كلمة balcon
    gloss: 'كلمة *Balcon* مذكّر: شرفة، هي صغيرة.'
    note: 'الضمير *Il* (هو) يحلّ محلّ اسم مذكّر مثل *balcon*، لذا تكون الصفة مذكّرة أيضًا: *il est petit*.'
  fr.a1.unit46.lesson06.teach.camille_ca_a:
    title: كميل تُبدي إعجابها
    gloss: 'كميل: يبدو أنها لطيفة! سأمرّ لزيارتك قريبًا.'
    note: تتكوّن *Je passerai te voir* (سأمرّ لزيارتك) من الفعل في المستقبل *passerai* ثم *te voir* أي «أن أراك».
  fr.a1.unit46.lesson06.teach.mathieu_super_tu:
    title: ماتيو يرحّب بها
    gloss: 'ماتيو: رائع، أنتِ دائمًا موضع ترحيب.'
    note: '*Toujours la bienvenue* (دائمًا موضع ترحيب) طريقة ودودة لدعوة شخص إلى العودة؛ وكلمة *bienvenue* مؤنّثة هنا لأنها تصف كميل.'
