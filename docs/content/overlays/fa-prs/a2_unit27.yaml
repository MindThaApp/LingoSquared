course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستان در سطح پیش‌متوسط: گفتن کارهایی که به‌زودی برنامه دارید و کارهایی که بعداً قصد انجامشان را دارید. زمان حال همراه با قید زمان برای برنامه‌ها (فردا، هفتهٔ آینده، در تابستان)، «می‌خواهم» به‌علاوهٔ وجه التزامی و «تصمیم دارم» برای قصد و نیت، همراه با موضوع تعطیلات، دوره‌ها و اسباب‌کشی.'
units:
  prs.a2.unit27.my_plans:
    title: برنامه‌های من
lessons:
  prs.a2.unit27.lesson01.tomorrow_and_next_week:
    title: 'فردا و هفتهٔ آینده: زمان حال برای برنامه‌ها'
  prs.a2.unit27.lesson02.everyone_and_holiday:
