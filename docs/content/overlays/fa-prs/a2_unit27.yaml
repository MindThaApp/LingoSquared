    - value: من هفتهٔ آینده به کابل می‌روم
      status: correct
    - value: به کابل هفتهٔ آینده می‌روم.
      status: correct
    - value: به کابل هفتهٔ آینده می‌روم
      status: correct
    feedback: '*هفتهٔ آینده به کابل می‌روم.* یعنی هفتهٔ آینده می‌روم کابل. *من* اختیاری است و واژهٔ زمانی می‌تواند جابه‌جا شود.'
  prs.a2.unit27.lesson02.exercise01.recognize_holiday_travel:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: او در تعطیلات به بامیان سفر می‌کند
    distractors:
    - او در تعطیلات به بامیان سفر کرد
    - او در بامیان زندگی می‌کند
    - او نمی‌خواهد به بامیان برود
    accepted_answers:
    - value: او در تعطیلات به بامیان سفر می‌کند
      status: correct
    feedback: '*سفر می‌کند* حال ساده‌ٔ *سفر کردن* برای *او* است. با *در رخصتی* یک برنامه برای تعطیلات است.'
  prs.a2.unit27.lesson02.exercise02.recognize_friday_negative:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: جمعه به مدرسه نمی‌روم
    distractors:
    - جمعه به مدرسه رفتم
    - جمعه می‌خواهم به مدرسه بروم
    - فردا به مدرسه می‌روم
    accepted_answers:
    - value: جمعه به مدرسه نمی‌روم
      status: correct
    feedback: '*نمی‌روم* منفی *می‌روم* است: نمی‌روم.'
  prs.a2.unit27.lesson02.exercise03.match_persons_and_words:
    instruction: هر کلمهٔ دری را با معنی‌اش جفت کنید.
    accepted_answers:
    - value:
        می‌روم: می‌روم
        می‌روی: تو می‌روی (به دوست)
        می‌رود: او می‌رود
        می‌رویم: می‌رویم
        می‌روین: شما می‌روید (رسمی یا جمع)
        می‌روند: آن‌ها می‌روند
        رخصتی: تعطیلات
        سفر کردن: سفر کردن
        هوتل: هتل
      status: correct
    feedback: 'فقط پایانه با شخص عوض می‌شود: *-م* من، *-ی* تو، *-د* او، *-یم* ما، *-ین* شما (رسمی یا جمع)، *-ند* آنها.'
    pairs:
    - left: می‌روم
      right: می‌روم
    - left: می‌روی
      right: تو می‌روی (به دوست)
    - left: می‌رود
      right: او می‌رود
    - left: می‌رویم
      right: می‌رویم
    - left: می‌روین
      right: شما می‌روید (رسمی یا جمع)
    - left: می‌روند
      right: آن‌ها می‌روند
    - left: رخصتی
      right: تعطیلات
    - left: سفر کردن
      right: سفر کردن
    - left: هوتل
      right: هتل
