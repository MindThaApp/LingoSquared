  prs.a2.unit27.lesson04.decisions_and_moving:
    title: تصمیم‌ها، کلاس‌ها و اسباب‌کشی
  prs.a2.unit27.lesson05.reading_and_listening:
    title: خواندن و شنیدن دربارهٔ برنامه‌ها
  prs.a2.unit27.lesson06.conversation_and_writing:
    title: گفتگو دربارهٔ یک خانهٔ جدید، و نوشتن
teaching:
  prs.a2.unit27.lesson01.teach.names:
    title: مهتاب و لطیف
    gloss: مهتاب و لطیف دوست هستند.
    note: دو دوست، *مهتاب* (یک خانم) و *لطیف* (یک آقا)، در این درس برنامه‌هایشان را تعریف می‌کنند. آن‌ها مثل دوست با هم صحبت می‌کنند، برای همین از *تو* استفاده می‌کنند.
  prs.a2.unit27.lesson01.teach.tomorrow:
    title: فردا
    gloss: فردا
    note: '*فردا* یعنی روز بعد از امروز. این پرکاربردترین کلمهٔ زمانی برای گفتن برنامه است.'
    example_gloss: فردا به کابل می‌روم.
  prs.a2.unit27.lesson01.teach.next_week:
    title: هفته‌ی بعد
    gloss: هفتهٔ آینده
    note: '*هفتهٔ آینده* یعنی هفتهٔ بعد. *آینده* یعنی بعدی و با کلمه‌های زمانی دیگر هم می‌آید: *ماه آینده* (ماه بعد)، *سال آینده* (سال بعد).'
    example_gloss: هفتهٔ بعد به هرات می‌روم.
  prs.a2.unit27.lesson01.teach.next_month:
    title: ماه آینده
    gloss: ماه آینده
    note: '*ماه آینده* یعنی ماه بعد. ساختارش مثل *هفتهٔ آینده* است.'
    example_gloss: ماه بعد به مزار می‌روم.
  prs.a2.unit27.lesson01.teach.next_year:
    title: سال آینده
    gloss: سال آینده
    note: '*سال آینده* یعنی سال بعد.'
    example_gloss: سال بعد به کابل می‌آیم.
  prs.a2.unit27.lesson01.teach.summer:
    title: تابستان
    gloss: تابستان، در تابستان
    note: '*تابستان* یعنی فصل تابستان و همچنین «در تابستان». برای «در» به کلمهٔ دیگری نیاز ندارید.'
    example_gloss: تابستان به بامیان می‌روم.
  prs.a2.unit27.lesson01.teach.plan:
    title: برنامه
    gloss: برنامه
    note: '*برنامه* یعنی طرح و برنامه. *برنامه دارم* یعنی «برنامه دارم» و راه معمول گفتن این است که برای کاری برنامه دارید.'
    example_gloss: برای تابستان برنامه دارم.
  prs.a2.unit27.lesson01.teach.rule:
    title: زمان حال همراه با کلمهٔ زمانی، برنامه را می‌گوید
    gloss: فردا می‌روم. هفتهٔ بعد می‌روم. تابستان می‌روم.
    note: 'در دری برای برنامه از همان زمان حال معمولی استفاده می‌شود، یعنی *می‌* و ریشهٔ حال، و یک کلمهٔ زمانی که به آینده اشاره کند اضافه می‌شود: *فردا می‌روم* یعنی فردا می‌روم، *هفتهٔ آینده می‌روم* یعنی هفتهٔ بعد می‌روم. کلمهٔ زمانی است که نشان می‌دهد برنامه مربوط به آینده است. بدون کلمهٔ زمانی، *می‌روم* یعنی «می‌روم» یا «دارم می‌روم». این در فارسی ایران هم شبیه است، مثل «فردا می‌روم». ترتیب کلمه‌ها آزاد است: کلمهٔ زمانی معمولاً اول می‌آید، ولی *به هرات فردا می‌روم* هم درست است.'
  prs.a2.unit27.lesson01.teach.paradigm:
    title: زمان حال رفتن برای همهٔ شخص‌ها
    gloss: می‌روم، می‌روی، می‌رود، می‌رویم، می‌روید (محترمانه یا جمع)، می‌روند
    note: 'زمان حال با پیشوند *می‌* (با نیم‌فاصله) به‌همراه ریشهٔ حال *رو* و شناسه ساخته می‌شود: *می‌روم* (من)، *می‌روی* (تو، دوست)، *می‌رود* (او)، *می‌رویم* (ما)، *می‌روین* (شما، محترمانه یا جمع)، *می‌روند* (آن‌ها). ضمیر اختیاری است چون شناسه شخص را نشان می‌دهد. شناسهٔ دوم شخص جمع در این دوره *-ین* است.'
  prs.a2.unit27.lesson01.teach.sentence:
    title: فردا به هرات می‌روم
    gloss: فردا به هرات می‌روم.
    note: 'این الگوی اصلی این درس است: کلمهٔ زمانی، بعد مکان با *به*، و در آخر فعل حال.'
  prs.a2.unit27.lesson02.teach.holiday:
    title: تعطیلات
    gloss: تعطیلات، مرخصی
    note: '*رخصتی* یعنی تعطیلات یا مرخصی از کار یا مکتب. این کلمهٔ افغانستانی است که بیشتر می‌شنوید.'
    example_gloss: در تعطیلات به هرات می‌روم.
  prs.a2.unit27.lesson02.teach.travel:
    title: سفر کردن
    gloss: سفر کردن، به مسافرت رفتن
    note: '*سفر کردن* یعنی مسافرت کردن. مقصد را با *به* می‌گویید: *به بامیان سفر می‌کنم* یعنی به بامیان سفر می‌کنم. شناسه به *کردن* وصل می‌شود و مثل هر فعل حال تغییر می‌کند: *سفر می‌کنم، سفر می‌کنی، سفر می‌کند*.'
    example_gloss: در تعطیلات او به بامیان سفر می‌کند.
  prs.a2.unit27.lesson02.teach.hotel:
    title: هتل رزرو کردن
    gloss: هتل رزرو کردن
    note: '*رزرو کردن* یعنی رزرو کردن و *هوتل* یعنی هتل. رزرو یک برنامهٔ معمول است، پس زمان حال با کلمهٔ زمانی مناسب است: *فردا هوتل رزرو می‌کنم*.'
    example_gloss: فردا یک هتل رزرو می‌کنم.
  prs.a2.unit27.lesson02.teach.buy:
    title: خریدن
    gloss: خریدن
    note: '*خریدن* یعنی خرید کردن. ریشهٔ حال آن *خر* است: *می‌خرم، می‌خری، می‌خرد*.'
    example_gloss: فردا میوه می‌خرم.
  prs.a2.unit27.lesson02.teach.more_verbs:
    title: زمان حال آمدن
    gloss: می‌آیم، می‌آیی، می‌آید، می‌آییم، می‌آیید (محترمانه یا جمع)، می‌آیند
    note: 'ریشهٔ حال *آمدن* *آی* است، پس فعل این‌طور می‌شود: *می‌آیم، می‌آیی، می‌آید، می‌آییم، می‌آیین، می‌آیند*. همین شناسه‌ها برای همهٔ فعل‌ها کار می‌کنند: *می‌مانم* (می‌مانم)، *می‌گیرم* (می‌گیرم)، *می‌خرم* (می‌خرم)، *می‌کنم* (می‌کنم). هرکدام با کلمهٔ زمانی می‌تواند برنامه باشد: *هفتهٔ آینده می‌آیم* یعنی هفتهٔ بعد می‌آیم.'
  prs.a2.unit27.lesson02.teach.negative:
    title: 'منفی: نمی‌ برای همهٔ شخص‌ها'
    gloss: نمی‌روم، نمی‌روی، نمی‌رود، نمی‌رویم، نمی‌روید، نمی‌روند
    note: 'برای گفتن اینکه کاری را نمی‌کنید، *ن* را جلوی *می‌* بگذارید: *می‌روم* می‌شود *نمی‌روم*. شناسه‌ها همان می‌مانند. *جمعه به مکتب نمی‌روم* یعنی جمعه به مدرسه نمی‌روم. نیم‌فاصله بین *نمی‌* و ریشه را فراموش نکنید.'
  prs.a2.unit27.lesson02.teach.questions:
    title: پرسیدن دربارهٔ برنامهٔ کسی
    gloss: فردا چه‌کار می‌کنی؟ هفتهٔ بعد کجا می‌روی؟ با کی می‌روی؟
    note: 'دربارهٔ برنامه با همان زمان حال می‌پرسید: *فردا چه می‌کنی؟* یعنی فردا چه‌کار می‌کنی، *کجا می‌روی؟* یعنی کجا می‌روی، *با کی می‌روی؟* یعنی با کی می‌روی. جواب هم با زمان حال است، پس برای گفتگو دربارهٔ برنامه به شکل فعل تازه‌ای نیاز نیست.'
  prs.a2.unit27.lesson02.teach.stay:
    title: یک هفته آنجا می‌مانم
    gloss: یک هفته آنجا می‌مانم.
    note: '*می‌مانم* یعنی می‌مانم. مدت زمان مثل *یک هفته* پیش از فعل می‌آید و به کلمهٔ اضافه برای «به مدت» نیازی نیست.'
  prs.a2.unit27.lesson03.teach.pattern:
    title: 'قصد: می‌خواهم به‌همراه فعل التزامی'
    gloss: می‌خواهم به هرات بروم. می‌خواهم بیایم. می‌خواهم یک کتاب بخرم.
    note: 'برای گفتن کاری که قصد دارید یا می‌خواهید بکنید، *می‌خواهم* می‌گویید و بعد فعل دوم را به شکل التزامی می‌آورید: *می‌خواهم بروم* یعنی می‌خواهم بروم. این درست مثل فارسی ایران است: فعل دوم شناسهٔ شخصی دارد. هر دو فعل یک شخص دارند: *می‌خواهم بروم*، *می‌خواهیم برویم*. بعد از *می‌خواهم* مصدر نمی‌آید. کلمهٔ *که* هم لازم نیست.'
  prs.a2.unit27.lesson03.teach.subjunctive:
    title: 'فعل التزامی: بـ به‌همراه ریشهٔ حال'
    gloss: که بروم، که بروی، که برود، که برویم، که بروید، که بروند
    note: 'فعل التزامی از *بـ* و ریشهٔ حال و همان شناسه‌های زمان حال ساخته می‌شود: *رو* می‌شود *بروم، بروی، برود، برویم، بروین، بروند*. فعل‌های دیگر: *بخرم*، *بگیرم*، *بمانم*، *بخورم*. *آمدن* استثناست: *بیایم*. این شکل را بعد از *می‌خواهم* و بعد از *باید* می‌بینید.'
  prs.a2.unit27.lesson03.teach.want_paradigm:
    title: زمان حال خواستن
    gloss: می‌خواهم، می‌خواهی، می‌خواهد، می‌خواهیم، می‌خواهید (محترمانه یا جمع)، می‌خواهند
    note: 'ریشهٔ حال *خواستن* *خواه* است: *می‌خواهم، می‌خواهی، می‌خواهد، می‌خواهیم، می‌خواهین، می‌خواهند*. فعل دوم همان شخص را دارد: *او می‌خواهد برود*، *ما می‌خواهیم برویم*.'
  prs.a2.unit27.lesson03.teach.want_negative:
    title: نمی‌خواهم
    gloss: نمی‌خواهم بروم. نمی‌خواهیم بیاییم.
    note: 'برای گفتن اینکه نمی‌خواهید، *ن* را به *می‌خواهم* اضافه کنید: *نمی‌خواهم بروم* یعنی نمی‌خواهم بروم. فعل دوم التزامی می‌ماند و نفی دیگری نمی‌گیرد.'
  prs.a2.unit27.lesson03.teach.plan_vs_intention:
    title: برنامه و قصد
    gloss: فردا به هرات می‌روم. می‌خواهم به هرات بروم.
    note: 'این دو را مقایسه کنید. *فردا به هرات می‌روم* برنامه است: قطعی است، زمان دارد و با زمان حال گفته می‌شود. *می‌خواهم به هرات بروم* قصد یا آرزو است: دلتان می‌خواهد ولی هنوز قطعی نیست، پس اغلب زمان دقیقی ندارد. وقتی زمان مشخص و همه‌چیز هماهنگ است، برنامه را بگویید. وقتی فقط می‌خواهید، *می‌خواهم* بگویید.'
  prs.a2.unit27.lesson03.teach.course:
    title: کلاس
    gloss: کلاس، دوره
    note: '*کورس* یعنی دوره یا کلاس آموزشی، مثلاً کلاس زبان یا کامپیوتر. با *گرفتن* می‌گویید: *کورس گرفتن* یعنی در یک دوره ثبت‌نام کردن.'
    example_gloss: می‌خواهم یک کلاس انگلیسی بگیرم.
  prs.a2.unit27.lesson03.teach.start:
    title: شروع شدن
    gloss: شروع شدن، آغاز شدن
    note: '*شروع شدن* یعنی آغاز شدن. برای چیزی به کار می‌رود که شروع می‌شود، مثل کلاس، جلسه یا درس: *شروع می‌شود* یعنی شروع می‌شود. با کلمهٔ زمانی این هم یک برنامه است.'
    example_gloss: کلاس از هفتهٔ بعد شروع می‌شود.
  prs.a2.unit27.lesson03.teach.university:
    title: دانشگاه
    gloss: دانشگاه
    note: '*پوهنتون* یعنی دانشگاه. این کلمهٔ افغانستانی است و با *به* به آنجا می‌روید.'
    example_gloss: می‌خواهم به دانشگاه بروم.
  prs.a2.unit27.lesson04.teach.move:
    title: اسباب‌کشی کردن
    gloss: اسباب‌کشی کردن، خانه عوض کردن
    note: '*عوض کردن* یعنی تغییر دادن، پس *خانه عوض کردن* یعنی اسباب‌کشی کردن. *خانه را عوض می‌کنم* هم درست است. شناسه به *کردن* وصل می‌شود: *خانه عوض می‌کنم، خانه عوض می‌کنی*.'
    example_gloss: ماه بعد اسباب‌کشی می‌کنم.
  prs.a2.unit27.lesson04.teach.rent:
    title: اجاره کردن
    gloss: اجاره کردن (خانه)
    note: '*کرایه* یعنی اجاره. *کرایه گرفتن* یعنی برای خودتان خانه‌ای اجاره کردن، مثلاً *یک خانه کرایه می‌گیرم*. با *می‌خواهم* فعل دوم *بگیرم* است.'
    example_gloss: می‌خواهم یک خانهٔ جدید اجاره کنم.
  prs.a2.unit27.lesson04.teach.near:
    title: نزدیک
    gloss: نزدیک
    note: '*نزدیک* یعنی نزدیک. بلافاصله بعد از آن می‌گویید نزدیک چه چیزی: *نزدیک مکتب* یعنی نزدیک مدرسه.'
    example_gloss: خانهٔ جدید نزدیک مدرسه است.
  prs.a2.unit27.lesson04.teach.decide:
    title: 'تصمیم دارم: تصمیم گرفته‌ام که'
    gloss: تصمیم دارم سال بعد به دانشگاه بروم.
    note: '*تصمیم دارم* یعنی تصمیم گرفته‌ام، قصد دارم. کمی قوی‌تر از *می‌خواهم* است: دربارهٔ آن فکر کرده‌اید. مثل *می‌خواهم* بعد از آن فعل التزامی می‌آید: *تصمیم دارم بروم* یعنی تصمیم دارم بروم. *قصد دارم* را از درس تعطیلات می‌شناسید که همین معنی را دارد و آن هم پذیرفته می‌شود. فعل التزامی در آخر جمله می‌آید، بعد از کلمهٔ زمانی و مکان.'
  prs.a2.unit27.lesson04.teach.written_future:
    title: 'آیندهٔ نوشتاری: خواهم رفت'
    gloss: فردا به هرات خواهم رفت. (نوشتاری)
    note: 'در اطلاعیه‌ها، خبرها و نوشته‌های رسمی *خواهم رفت*، *خواهد رفت*، *خواهیم رفت* را می‌بینید: *خواه-* به‌همراه شناسه و بعد ریشهٔ گذشته *رفت*. معنایش «خواهم رفت» است، درست مثل فارسی ایران. فقط باید آن را بشناسید. در گفتار از زمان حال با کلمهٔ زمانی استفاده کنید: *فردا به هرات می‌روم*.'
  prs.a2.unit27.lesson04.teach.because:
    title: چون خانهٔ من کوچک است
    gloss: چون خانهٔ من کوچک است.
    note: '*چون* یعنی چون یا زیرا. بعد از آن یک دلیل کوتاه می‌آید، اینجا با فعل ربطی *است*.'
  prs.a2.unit27.lesson05.teach.morning:
    title: صبح
    gloss: صبح، در صبح
    note: '*صبح* یعنی صبح. *فردا صبح* یعنی فردا صبح.'
    example_gloss: فردا صبح به بامیان می‌روم.
  prs.a2.unit27.lesson05.teach.holiday_turn01:
    title: مهتاب دربارهٔ تعطیلات می‌پرسد
    gloss: لطیف، برای تعطیلات برنامه داری؟
    note: مهتاب از لطیف دربارهٔ برنامهٔ تعطیلاتش می‌پرسد. *برنامه داری؟* یعنی برنامه داری؟ و او *تو* می‌گوید چون لطیف دوستش است.
  prs.a2.unit27.lesson05.teach.holiday_turn02:
    title: لطیف برنامه‌اش را می‌گوید
    gloss: بله. هفتهٔ بعد به هرات می‌روم. یک هفته آنجا می‌مانم.
    note: 'لطیف با *بلی* (بله) جواب می‌دهد. برنامه‌اش کلمهٔ زمانی دارد، *هفتهٔ آینده*، و زمان حال: *می‌روم*. *یک هفته آنجا می‌مانم* برنامهٔ دوم با زمان حال است.'
  prs.a2.unit27.lesson05.teach.holiday_turn03:
    title: مهتاب دربارهٔ بعد از آن می‌پرسد
    gloss: چه خوب! بعد از آن چه‌کار می‌کنی؟
    note: '*بعد از آن* یعنی بعد از آن. سؤال مثل همیشه برای برنامه در زمان حال است.'
  prs.a2.unit27.lesson05.teach.holiday_turn04:
    title: لطیف می‌گوید چه می‌خواهد
    gloss: می‌خواهم یک کلاس انگلیسی بگیرم.
    note: 'لطیف تاریخ دقیقی ندارد، برای همین از قصد و نیت استفاده می‌کند: *می‌خواهم* به‌علاوهٔ وجه التزامی *بگیرم*.'
  prs.a2.unit27.lesson05.teach.holiday_turn05:
    title: مهتاب می‌پرسد دوره کی شروع می‌شود
    gloss: عالیه! کلاس کی شروع می‌شه؟
    note: '*کورس کی شروع می‌شود؟* می‌پرسد یک دوره کی شروع می‌شود. حال ساده، *شروع می‌شود*، دربارهٔ یک تاریخ در آینده است.'
  prs.a2.unit27.lesson05.teach.holiday_turn06:
    title: لطیف ماه را می‌گوید
    gloss: از ماه آینده.
    note: '*از ماه آینده* یعنی از ماه بعد. یک جواب کوتاه کافی است.'
  prs.a2.unit27.lesson05.teach.message:
    title: یک پیام دربارهٔ برنامه‌ها
    gloss: سلام مهتاب. فردا صبح می‌روم بامیان و دو روز آنجا می‌مانم. هفتهٔ آینده توی دفتر کار می‌کنم. سال آینده قصد دارم بروم دانشگاه.
    note: یک پیام کوتاه نوشتاری. در آن یک برنامه برای فردا، یک برنامه برای هفتهٔ آینده و یک قصد برای سال آینده هست. همهٔ برنامه‌ها با حال ساده و یک واژهٔ زمانی گفته می‌شوند و قصد با *تصمیم دارم* به‌علاوهٔ وجه التزامی بیان می‌شود.
  prs.a2.unit27.lesson06.teach.help:
    title: کمک کردن
    gloss: کمک کردن
    note: '*کمک* یعنی یاری و مساعدت. *کمک کردن* یعنی کمک کردن: *فردا کمک می‌کنم* یعنی فردا کمک می‌کنم. پایان صرف به *کردن* اضافه می‌شود.'
    example_gloss: فردا به دوستم کمک می‌کنم.
  prs.a2.unit27.lesson06.teach.house_turn01:
    title: لطیف دربارهٔ ماه آینده می‌پرسد
    gloss: مهتاب، ماه آینده چه کار می‌کنی؟
    note: لطیف با یک واژهٔ زمانی، *ماه آینده*، و حال ساده دربارهٔ یک برنامه می‌پرسد.
  prs.a2.unit27.lesson06.teach.house_turn02:
    title: مهتاب برنامه‌اش را می‌گوید
    gloss: ماه بعد اسباب‌کشی می‌کنم.
    note: '*خانه عوض می‌کنم* یعنی اسباب‌کشی می‌کنم. این یک برنامه است، برای همین با واژهٔ زمانی از حال ساده استفاده می‌شود.'
  prs.a2.unit27.lesson06.teach.house_turn03:
    title: لطیف دلیلش را می‌پرسد
    gloss: چرا؟
    note: '*چرا؟* یعنی چرا. بین دوستان یک سؤال تک‌کلمه‌ای طبیعی است.'
  prs.a2.unit27.lesson06.teach.house_turn04:
    title: مهتاب توضیح می‌دهد
    gloss: چون خانهٔ من کوچک است. می‌خواهم یک خانهٔ نو اجاره کنم، نزدیک مدرسه.
    note: '*چون* دلیل را با *است* می‌آورد. بعد یک قصد می‌آید، *می‌خواهم* به‌علاوهٔ وجه التزامی *بگیرم*، چون او هنوز خانه را پیدا نکرده است.'
  prs.a2.unit27.lesson06.teach.house_turn05:
    title: لطیف پیشنهاد کمک می‌دهد
    gloss: خوبه! فردا می‌آیم و کمک می‌کنم.
    note: 'لطیف در همان لحظه با *فردا* و حال ساده برنامه می‌ریزد: *می‌آیم* و *کمک می‌کنم*. *کمک کردن* یعنی کمک کردن.'
  prs.a2.unit27.lesson06.teach.house_turn06:
    title: مهتاب از او تشکر می‌کند
    gloss: مرسی!
    note: '*تشکر!* راه کوتاهی برای تشکر از یک دوست است.'
exercises:
  prs.a2.unit27.lesson01.exercise01.recognize_tomorrow:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: فردا می‌روم کابل
    distractors:
    - دیروز رفتم کابل
    - همیشه می‌روم کابل
    - می‌خواهم بروم کابل
    accepted_answers:
    - value: فردا می‌روم کابل
      status: correct
    feedback: '*فردا* به آینده اشاره دارد و *می‌روم* حال ساده است، پس این یک برنامه است: فردا می‌روم کابل.'
  prs.a2.unit27.lesson01.exercise02.recognize_we_next_week:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: هفتهٔ آینده می‌رویم هرات
    distractors:
    - هفتهٔ پیش رفتیم هرات
    - هر هفته می‌رویم هرات
    - الان در هرات هستیم
    accepted_answers:
    - value: هفتهٔ آینده می‌رویم هرات
      status: correct
    feedback: '*هفتهٔ آینده* یعنی هفتهٔ بعد و *می‌رویم* یعنی می‌رویم، پس هفتهٔ آینده می‌رویم هرات.'
  prs.a2.unit27.lesson01.exercise03.match_time_words:
