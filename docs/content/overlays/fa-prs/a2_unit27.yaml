      status: correct
    feedback: '*می‌کنی* حال ساده‌ٔ *کردن* برای *تو* است: پایانهٔ *-ی* یعنی تو.'
  prs.a2.unit27.lesson02.exercise06.answer_tomorrow_fruit:
    instruction: 'مهتاب می‌پرسد: فردا چه می‌کنی؟ (فردا چه کار می‌کنی؟) مثل لطیف به دری جواب بدهید: فردا میوه می‌خرم.'
