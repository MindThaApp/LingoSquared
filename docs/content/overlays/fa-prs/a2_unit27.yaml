      - رزرو
      - می‌کنم
      status: correct
    feedback: '*هفتهٔ آینده یک هوتل رزرو می‌کنم.* *رزرو* جلوی *می‌کنم* می‌ماند و عبارت زمانی می‌تواند به ابتدا یا وسط جمله برود.'
  prs.a2.unit27.lesson02.exercise05.complete_you_do:
    instruction: 'سؤال را کامل کنید: فردا چه کار می‌کنی؟'
