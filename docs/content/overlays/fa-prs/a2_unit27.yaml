        ماه آینده: ماه آینده
        سال آینده: سال آینده
        تابستان: تابستان
        امروز: امروز
        دیروز: دیروز
      status: correct
    feedback: واژه‌هایی که *آینده* دارند به آینده اشاره می‌کنند. *امروز* و *دیروز* واژهٔ زمانی آینده نیستند.
    pairs:
    - left: فردا
      right: فردا
    - left: هفتهٔ آینده
      right: هفتهٔ آینده
    - left: ماه آینده
      right: ماه آینده
    - left: سال آینده
      right: سال آینده
    - left: تابستان
      right: تابستان
    - left: امروز
      right: امروز
    - left: دیروز
      right: دیروز
  prs.a2.unit27.lesson01.exercise04.order_tomorrow_herat:
    instruction: 'کلمات را مرتب کنید تا بگویید: فردا می‌روم هرات.'
    accepted_answers:
    - value:
      - فردا
      - به
      - هرات
      - می‌روم
      status: correct
    - value:
      - به
      - هرات
      - فردا
      - می‌روم
      status: correct
    feedback: '*فردا به هرات می‌روم.* واژهٔ زمانی اول می‌آید و فعل آخر. *به هرات فردا می‌روم* هم ممکن است.'
  prs.a2.unit27.lesson01.exercise05.complete_we_go:
    instruction: 'جمله را کامل کنید: فردا می‌رویم هرات.'
    accepted_answers:
    - value: می‌رویم
      status: correct
    feedback: '*می‌رویم* حال ساده‌ٔ *رفتن* برای *ما* است: پایانهٔ *-یم* یعنی ما.'
  prs.a2.unit27.lesson01.exercise06.translate_next_week_kabul:
    instruction: 'با حال ساده به دری ترجمه کنید: هفتهٔ آینده می‌روم کابل.'
    accepted_answers:
    - value: هفتهٔ آینده به کابل می‌روم.
      status: correct
    - value: هفتهٔ آینده به کابل می‌روم
