teaching:
  prs.a2.unit26.lesson01.teach.bus:
    title: اتوبوس
    gloss: اتوبوس
    note: '*بس* همان اتوبوس است و در افغانستان معمول‌ترین راه سفر بین شهرهاست. این واژه در درس حمل‌ونقل هم آمده بود.'
    example_gloss: اتوبوس به مزار می‌رود.
  prs.a2.unit26.lesson01.teach.station:
    title: ایستگاه
    gloss: ایستگاه
    note: '*ایستگاه* یعنی ایستگاه یا توقفگاه. *ایستگاه بس* یعنی ایستگاه اتوبوس.'
    example_gloss: ایستگاه اتوبوس در کابل است.
  prs.a2.unit26.lesson01.teach.plane:
    title: هواپیما
    gloss: هواپیما
    note: '*طیاره* واژه‌ی افغانستانی برای هواپیماست.'
    example_gloss: هواپیما به کابل می‌آید.
  prs.a2.unit26.lesson01.teach.airport:
    title: فرودگاه
    gloss: فرودگاه
    note: '*میدان هوایی* یعنی فرودگاه. هواپیماها از *میدان هوایی* حرکت می‌کنند و اتوبوس‌ها از *ایستگاه*.'
    example_gloss: فرودگاه در کابل است.
  prs.a2.unit26.lesson01.teach.car:
    title: ماشین
    gloss: ماشین
    note: '*موتر* واژه‌ی افغانستانی برای ماشین است. با افزودن *-م* می‌شود «ماشینِ من»: *موترم*.'
    example_gloss: ماشینم نو است.
  prs.a2.unit26.lesson01.teach.arrive:
    title: رسیدن
    gloss: رسیدن
    note: '*رسیدن* یعنی رسیدن به جایی. مقصد را با *به* می‌گویید: *به ایستگاه رسیدم* یعنی «به ایستگاه رسیدم». بن گذشته *رسید* است و می‌شود: *رسیدم، رسیدی، رسید، رسیدیم*.'
    example_gloss: ما به ایستگاه رسیدیم.
  prs.a2.unit26.lesson01.teach.return:
    title: برگشتن
    gloss: برگشتن
    note: '*برگشتن* یعنی برگشتن یا بازگشتن. بن گذشته *برگشت* است: *برگشتم* یعنی «برگشتم».'
    example_gloss: دیروز به خانه برگشتم.
  prs.a2.unit26.lesson01.teach.passport:
    title: پاسپورت
    gloss: پاسپورت
    note: '*پاسپورت* یعنی گذرنامه. با افزودن *-م* می‌شود «مالِ من»: *پاسپورتم*.'
    example_gloss: پاسپورتم در خانه است.
  prs.a2.unit26.lesson01.teach.key:
    title: کلید
    gloss: کلید
    note: '*کلید* یعنی کلید. *کلیدم* یعنی «کلید من».'
    example_gloss: کلیدم در خانه است.
  prs.a2.unit26.lesson01.teach.phone:
    title: تلفن
    gloss: تلفن
    note: '*تیلفون* یعنی تلفن. *تیلفونم* یعنی «تلفن من». *تیلفون کردن* یعنی تلفن زدن.'
    example_gloss: تلفنم نو است.
  prs.a2.unit26.lesson01.teach.lose:
    title: گم کردن
    gloss: گم کردن
    note: '*گم کردن* یعنی چیزی را گم کردن. *گم* یعنی ناپیدا و *کردن* فعل «انجام دادن» است. چیزی را که گم کرده‌اید با *را* پیش از فعل می‌آورید، مثل *کلیدم را گم کردم* (کلیدم را گم کردم).'
    example_gloss: دیروز کلیدم را گم کردم.
  prs.a2.unit26.lesson01.teach.when:
    title: کی / چه موقع
    gloss: وقتی که
    note: '*وقتی* بندی را شروع می‌کند که یک نقطه‌ی زمانی را می‌گوید، اینجا نقطه‌ای در گذشته: *وقتی رسیدم* یعنی «وقتی رسیدم». این بند، نقطه‌ی مرجع کل این درس است.'
    example_gloss: وقتی به خانه رسیدم، صبحانه خوردم.
  prs.a2.unit26.lesson01.teach.participle:
    title: 'صفت مفعولی: بن گذشته به‌اضافه‌ی ه'
    gloss: رفته، خورده، دیده، رسیده، آمده، کرده، شده (صفت‌های مفعولی)
    note: 'ماضی بعید از صفت مفعولی ساخته می‌شود، پس اول آن را یاد بگیرید. مصدر را بردارید، *ن* آخرش را بیندازید تا ریشهٔ گذشته به دست بیاید و *ه* اضافه کنید: *رفتن* ریشهٔ *رفت* دارد، پس صفت مفعولی‌اش *رفته* می‌شود. همین قاعده برای *خوردن* می‌شود *خورده*، *دیدن* می‌شود *دیده*، *رسیدن* می‌شود *رسیده*، *آمدن* می‌شود *آمده*، *کردن* می‌شود *کرده*، *شدن* می‌شود *شده*. صفت مفعولی با شخص عوض نمی‌شود: برای من، تو، او و آن‌ها یکی است. همین بخش در *رفته‌ام* (رفته‌ام) هم هست که در درس تجربه‌های زندگی می‌بینید؛ در این درس فقط همراه گذشتهٔ *بودن* به کار می‌رود.'
  prs.a2.unit26.lesson01.teach.paradigm:
    title: 'گذشته‌ی بعید: صفت مفعولی به‌اضافه‌ی گذشته‌ی بودن'
    gloss: من رفته بودم، تو رفته بودی، او رفته بود، ما رفته بودیم، شما رفته بودید (محترمانه یا جمع)، آن‌ها رفته بودند
    note: 'گذشته‌ی بعید می‌گوید چیزی پیش از لحظه‌ای دیگر در گذشته اتفاق افتاده بود. ساختش صفت مفعولی به‌اضافه‌ی گذشته‌ی *بودن* است: *بودم، بودی، بود، بودیم، بودین، بودند*. پس *رفته بودم* یعنی «رفته بودم»، *رفته بودی* یعنی «رفته بودی» (به دوست)، *رفته بود* یعنی «او رفته بود» (*بود* تنها شناسه ندارد)، *رفته بودیم* یعنی «رفته بودیم»، *رفته بودین* یعنی «رفته بودید» (محترمانه یا جمع)، *رفته بودند* یعنی «رفته بودند». ضمیر اختیاری است، چون شناسه نشان می‌دهد چه کسی است. صفت مفعولی و *بود-* جدا نوشته می‌شوند.'
  prs.a2.unit26.lesson01.teach.sentence:
    title: وقتی به ایستگاه رسیدم، اتوبوس رفته بود
    gloss: وقتی به ایستگاه رسیدم، اتوبوس رفته بود.
    note: 'این الگوی کل درس است. *وقتی به ایستگاه رسیدم* لحظه‌ی رسیدن شماست (گذشته‌ی ساده). *بس رفته بود* چیزی است که پیش از آن لحظه اتفاق افتاده بود (گذشته‌ی بعید): اول اتوبوس رفت، بعد شما رسیدید.'
  prs.a2.unit26.lesson02.teach.more_participles:
    title: یک قاعده برای همه‌ی فعل‌ها
    gloss: خورده بودم، دیده بودی، او رسیده بود، آمده بودیم، کرده بودید، برگشته بودند
    note: 'قاعده‌ی *رفتن* برای همه‌ی فعل‌ها کار می‌کند: بن گذشته به‌اضافه‌ی *ه*، بعد *بودم، بودی، بود، بودیم، بودین، بودند*. *خورده بودم* یعنی «خورده بودم»، *دیده بودی* «دیده بودی»، *رسیده بود* «او رسیده بود»، *آمده بودیم* «آمده بودیم»، *کرده بودین* «کرده بودید»، *برگشته بودند* «برگشته بودند». فقط *بود-* تغییر می‌کند، نه صفت مفعولی.'
  prs.a2.unit26.lesson02.teach.compound_verbs:
    title: فعل‌های دو بخشی
    gloss: گم کرده بودم؛ بسته شده بود؛ خراب شده بود
    note: 'بسیاری از فعل‌ها یک واژه به‌اضافه‌ی *کردن* یا *شدن* هستند. صفت مفعولی از بخش دوم ساخته می‌شود و بخش اول جلوی آن می‌ماند: *گم کردن* می‌شود *گم کرده بودم* (گم کرده بودم)، *بسته شدن* می‌شود *بسته شده بود* (بسته شده بود)، *خراب شدن* می‌شود *خراب شده بود* (خراب شده بود). *شدن* وقتی به کار می‌آید که اتفاقی برای یک چیز افتاده باشد: دروازه، ماشین، دفتر.'
  prs.a2.unit26.lesson02.teach.gate:
    title: دروازه، در
    gloss: دروازه، در
    note: '*دروازه* یعنی دروازه یا در بزرگ، مثلاً دروازه‌ی فرودگاه یا در یک دفتر.'
    example_gloss: دروازه باز است.
  prs.a2.unit26.lesson02.teach.gate_closed:
    title: دروازه بسته شده بود
    gloss: دروازه بسته شده بود.
    note: '*بسته شده بود* می‌گوید دروازه پیش از آمدن شما بسته بود. این گذشته‌ی بعید *بسته شدن* است.'
  prs.a2.unit26.lesson02.teach.break_down:
    title: خراب شدن
    gloss: خراب شدن
    note: '*خراب* یعنی شکسته یا فاسد و *شدن* یعنی «گشتن»، پس *خراب شدن* یعنی خراب شدن. گذشته‌ی ساده‌اش *خراب شد* است: *موترم خراب شد* یعنی «ماشینم خراب شد».'
    example_gloss: ماشینم خراب شد.
  prs.a2.unit26.lesson02.teach.ate_breakfast:
    title: صبحانه خورده بودم
    gloss: صبحانه خورده بودم.
    note: '*صبحانه خورده بودم* می‌گوید صبحانه پیش از لحظه‌ای که درباره‌اش حرف می‌زنید تمام شده بود.'
  prs.a2.unit26.lesson02.teach.meeting:
    title: قرار ملاقات
    gloss: جلسه
    note: '*جلسه* یعنی جلسه. نوعی قرار دیگر است که ممکن است از دستش بدهید یا دیر برسید.'
    example_gloss: جلسه ساعت نه شروع شد.
  prs.a2.unit26.lesson02.teach.manager:
    title: مدیر
    gloss: مدیر
    note: '*مدیر* یعنی مدیر یک دفتر.'
    example_gloss: مدیر در دفتر است.
  prs.a2.unit26.lesson03.teach.contrast:
    title: گذشته‌ی بعید در برابر گذشته‌ی ساده
    gloss: وقتی رسیدم، اتوبوس رفته بود. / وقتی رسیدم، اتوبوس رفت.
    note: 'وقتی دو رویداد گذشته را با هم می‌گویید، رویدادی که اول اتفاق افتاده در گذشته‌ی بعید می‌آید و رویداد بعدی، یعنی نقطه‌ی مرجع، در گذشته‌ی ساده. در *وقتی رسیدم، بس رفته بود* شما دوم رسیدید و اتوبوس اول رفت، پس دیگر اتوبوسی نیست. در *وقتی رسیدم، بس رفت* هر دو فعل گذشته‌ی ساده‌اند، پس اتوبوس بعد از رسیدن شما یا همزمان با آن رفت. دو بند را می‌شود برعکس هم آورد: *بس رفته بود، وقتی رسیدم*.'
  prs.a2.unit26.lesson03.teach.bus_left_simple:
    title: وقتی رسیدم، اتوبوس رفت
    gloss: وقتی رسیدم، اتوبوس رفت.
    note: این را با *بس رفته بود* مقایسه کنید. اینجا اتوبوس بعد از رسیدن شما رفت و شاید می‌شد دوان‌دوان به آن برسید. با *رفته بود* اتوبوس از قبل رفته بود.
  prs.a2.unit26.lesson03.teach.manager_left:
    title: وقتی رسیدم، مدیر رفته بود
    gloss: وقتی رسیدم، مدیر رفته بود.
    note: 'همان الگوی اتوبوس: *وقتی رسیدم* لحظه‌ی رسیدن است و *مدیر رفته بود* رویداد قبلی. این را وقتی می‌گویید که به قرار می‌رسید و آن شخص رفته است.'
  prs.a2.unit26.lesson03.teach.negative:
    title: 'منفی: ن روی صفت مفعولی'
    gloss: نرفته بودم، نرفته بودی، او نرفته بود، نرفته بودیم، نرفته بودید، نرفته بودند
    note: 'برای اینکه بگویید چیزی هنوز اتفاق نیفتاده بود، *ن* را جلوی صفت مفعولی بگذارید، نه روی *بود*: *رفته بودم* می‌شود *نرفته بودم* (نرفته بودم). *بود-* همان شناسه‌ها را نگه می‌دارد: *نرفته بودم، نرفته بودی، نرفته بود، نرفته بودیم، نرفته بودین، نرفته بودند*. برای این معنا *رفته نبودم* ننویسید.'
  prs.a2.unit26.lesson03.teach.negative_more:
    title: صفت‌های مفعولی منفی فعل‌های دیگر
    gloss: نخورده بودم، ندیده بودم، نرسیده بودم، نیامده بودم
    note: 'همان *ن* روی هر صفت مفعولی می‌آید: *نخورده* (نخورده)، *ندیده* (ندیده)، *نرسیده* (نرسیده). فعل *آمدن* استثنایی است که باید به یاد بسپارید: صفت مفعولی‌اش *آمده* با *نیـ* می‌آید و منفی‌اش *نیامده* است (نیامده)، مثل *نیامده بودم*. فعل‌های دو بخشی *ن* را روی بخش دوم می‌گذارند: *گم نکرده بودم* (گمش نکرده بودم).'
  prs.a2.unit26.lesson04.teach.already:
    title: قبلاً
    gloss: قبلاً، پیش‌تر
    note: '*قبلاً* یعنی پیش از حالا یا پیش‌تر. تأکید می‌کند که کار قبلاً انجام شده بود و پیش از صفت مفعولی یا اول جمله می‌آید.'
    example_gloss: من قبلاً صبحانه خورده بودم.
  prs.a2.unit26.lesson04.teach.from_before:
    title: از قبل
    gloss: از قبل، از پیش
    note: '*از قبل* یعنی از پیش یا از زمانی زودتر. پیش از صفت مفعولی می‌نشیند: *از قبل رفته بود* یعنی «از قبل رفته بود». با گذشته‌ی بعید خیلی رایج است.'
    example_gloss: اتوبوس از قبل رفته بود.
  prs.a2.unit26.lesson04.teach.not_yet:
    title: هنوز، هنوز نه
    gloss: 'هنوز؛ با فعل منفی: هنوز نه'
    note: '*هنوز* با فعل منفی یعنی «هنوز نه». *هنوز نیامده بود* یعنی «هنوز نیامده بود». گذشته‌ی بعید منفی و *هنوز* با هم می‌آیند: چیزی که انتظارش را داشتید تا آن لحظه اتفاق نیفتاده بود.'
    example_gloss: او هنوز نیامده بود.
  prs.a2.unit26.lesson04.teach.before_clause:
    title: 'قبل از اینکه: پیش از اینکه برسم'
    gloss: پیش از اینکه من برسم، هواپیما رفته بود. / پیش از اینکه ما برسیم، هواپیما رفته بود.
    note: '*قبل از اینکه* یعنی «پیش از اینکه» و بعدش یک جملهٔ جدا با فعل خودش می‌آید. فعلِ بعد از آن التزامی است، همان شکلی که بعد از *باید* به کار می‌برید: *برسم* (که برسم)، *برسیم* (که برسیم). با اینکه ماجرا در گذشته است، این فعل گذشته نیست. جملهٔ اصلی بعدش می‌گوید چه چیزی قبلاً اتفاق افتاده بود: *طیاره رفته بود*. پس *قبل از اینکه من برسم، طیاره رفته بود* همان معنای *وقتی رسیدم، طیاره رفته بود* را دارد: اول هواپیما رفته است. جای دو جمله را می‌شود عوض کرد.'
  prs.a2.unit26.lesson04.teach.friend_not_yet:
    title: وقتی رسیدم، دوستم هنوز نیامده بود
    gloss: وقتی رسیدم، دوستم هنوز نیامده بود.
    note: اینجا کاری که باید قبلاً اتفاق می‌افتاد هنوز اتفاق نیفتاده بود. *هنوز نیامده بود* این رویدادِ نیامده را پیش از نقطهٔ مرجع *وقتی رسیدم* قرار می‌دهد.
  prs.a2.unit26.lesson04.teach.what_happened:
    title: وقتی به ایستگاه رسیدی، چه شد؟
    gloss: وقتی به ایستگاه رسیدی، چه شد؟
    note: '*چه شد؟* می‌پرسد چه اتفاقی افتاد. جواب معمولاً ماضی بعید است: *بس از قبل رفته بود* (اتوبوس از قبل رفته بود).'
  prs.a2.unit26.lesson05.teach.four:
    title: چهار
    gloss: چهار
    note: '*چهار* همان عدد چهار است. برای ساعت هم به کار می‌رود: *ساعت چهار* یعنی ساعت چهار.'
    example_gloss: ساعت چهار به خانه رسیدم.
  prs.a2.unit26.lesson05.teach.staff:
    title: کارکنان
    gloss: کارکنان، کارمندان
    note: '*کارمندان* جمعِ *کارمند* است. پسوند *-ان* برای جمع بستنِ اسم‌های انسان به کار می‌رود.'
    example_gloss: کارکنان در دفتر هستند.
  prs.a2.unit26.lesson05.teach.passport_office:
    title: دفتر گذرنامه
    gloss: دفتر گذرنامه
    note: '*دفتر پاسپورت* دفتری است که در آن گذرنامه می‌گیرند یا تمدید می‌کنند. هر دو کلمه را از قبل بلدید.'
    example_gloss: دفتر گذرنامه در کابل است.
  prs.a2.unit26.lesson05.teach.bus_turn01:
    title: شکیبا از نعمت دربارهٔ دیروز می‌پرسد
    gloss: نعمت، دیروز به مزار رفتی؟
    note: شکیبا دربارهٔ کاری که تمام شده یک سؤال بله/خیر می‌پرسد و از گذشتهٔ ساده *رفتی* استفاده می‌کند. مخاطب دوست اوست، برای همین *تو* به کار می‌برد.
  prs.a2.unit26.lesson05.teach.bus_turn02:
    title: نعمت می‌گوید چه دیده
    gloss: نه. وقتی به ایستگاه رسیدم، اتوبوس رفته بود.
    note: 'نعمت با *نخیر* جواب می‌دهد، بعد نقطهٔ مرجع را با گذشتهٔ ساده می‌گوید: *وقتی به ایستگاه رسیدم*، و رویداد قبلی را با ماضی بعید: *بس رفته بود*.'
  prs.a2.unit26.lesson05.teach.bus_turn03:
    title: شکیبا دربارهٔ ساعت می‌پرسد
    gloss: اتوبوس ساعت چند حرکت کرد؟
    note: '*ساعت چند* ساعت را می‌پرسد. *حرکت کرد* گذشتهٔ ساده‌ی *حرکت کردن* است، یعنی راه افتادن.'
  prs.a2.unit26.lesson05.teach.bus_turn04:
    title: نعمت دو ساعت را می‌گوید
    gloss: ساعت هشت. من ساعت نه رسیدم.
    note: 'دو زمان و دو رویداد: اتوبوس *ساعت هشت* رفت و نعمت *ساعت نه* رسید. هشت زودتر از نه است، پس اتوبوس اول رفته است.'
  prs.a2.unit26.lesson05.teach.bus_turn05:
    title: شکیبا می‌پرسد بعد چه شد
    gloss: بعد چه کردی؟
    note: '*بعد چه کردی؟* می‌پرسد بعد چه کردی. گذشتهٔ ساده به کار رفته، چون رویدادی تازه بعد از رسیدن است.'
  prs.a2.unit26.lesson05.teach.bus_turn06:
    title: نعمت به خانه برگشت
    gloss: به خانه برگشتم.
    note: '*برگشتم* گذشتهٔ ساده‌ی *برگشتن* است: او به خانه برگشت.'
  prs.a2.unit26.lesson05.teach.message:
    title: پیامی دربارهٔ دیر رسیدن
    gloss: سلام شکیبا. امروز ساعت چهار به دفتر گذرنامه رسیدم، ولی دفتر بسته شده بود. کارکنان رفته بودند. ماشینم خراب شده بود، برای همین دیر رسیدم. فردا صبح دوباره می‌روم.
    note: 'یک پیام کوتاه نوشتاری با ماضی بعید. نویسنده می‌گوید هنگام رسیدن چه دیده: دفتر بسته شده بود و کارکنان رفته بودند. دلیل قبلیِ دیر رسیدن را هم می‌گوید: ماشین خراب شده بود.'
  prs.a2.unit26.lesson06.teach.herat:
    title: هرات
    gloss: هرات (شهری در غرب افغانستان)
    note: '*هرات* شهری در غرب افغانستان است. مردم از کابل با هواپیما به آنجا می‌روند.'
    example_gloss: هواپیما به هرات می‌رود.
  prs.a2.unit26.lesson06.teach.find:
    title: پیدا کردن
    gloss: پیدا کردن
    note: '*پیدا کردن* یعنی چیزی را که دنبالش بودید پیدا کنید. چیز مورد نظر با *را* قبل از فعل می‌آید: *کلیدم را پیدا کردم* یعنی کلیدم را پیدا کردم. منفی‌اش *پیدا نکردم* است (پیدایش نکردم).'
    example_gloss: کلیدم را پیدا کردم.
  prs.a2.unit26.lesson06.teach.bad:
    title: بد
    gloss: بد
    note: '*بد* یعنی بد. *چه بد!* واکنشی دوستانه به خبر بد است، برعکسِ *چه خوب!*.'
    example_gloss: چه بد! (چه حیف!)
  prs.a2.unit26.lesson06.teach.airport_turn01:
    title: نعمت می‌پرسد چرا شکیبا نرفت
    gloss: شکیبا، چرا هفتهٔ پیش به هرات نرفتی؟
    note: نعمت با گذشتهٔ ساده‌ی منفی *نرفتی* می‌پرسد *چرا*. او دوست است، برای همین *تو* به کار می‌برد.
  prs.a2.unit26.lesson06.teach.airport_turn02:
    title: شکیبا دلیلش را می‌گوید
    gloss: چون گذرنامه‌ام را گم کرده بودم. تا ساعت ده پیدایش نکردم.
    note: '*چون* (زیرا) دلیل را می‌آورد و دلیل رویداد قبلی است، پس ماضی بعید به کار رفته: *گم کرده بودم*. *آن را* (آن را) به پاسپورت برمی‌گردد.'
  prs.a2.unit26.lesson06.teach.airport_turn03:
    title: نعمت می‌پرسد در میدان هوایی چه شد
    gloss: وقتی به فرودگاه رسیدی، چه شد؟
    note: نقطهٔ مرجع *وقتی به میدان هوایی رسیدی* است، با گذشتهٔ ساده. *چه شد؟* می‌پرسد چه وضعی از قبل بوده است.
  prs.a2.unit26.lesson06.teach.airport_turn04:
    title: شکیبا می‌گوید چه دید و چه کرد
    gloss: هواپیما رفته بود. بعد به خانه برگشتم و زنگ زدم.
    note: '*طیاره رفته بود* رویداد قبلی است، با ماضی بعید. بعدش دو رویداد تازه با گذشتهٔ ساده می‌آید: *برگشتم* و *تیلفون کردم*.'
  prs.a2.unit26.lesson06.teach.airport_turn05:
    title: نعمت واکنش نشان می‌دهد
    gloss: چه حیف!
    note: '*چه بد!* واکنشی کوتاه و دوستانه به خبر بد است.'
exercises:
  prs.a2.unit26.lesson01.exercise01.recognize_plane_left:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: هواپیما رفته بود
    distractors:
    - هواپیما دارد می‌رود
    - هواپیما خواهد رفت
    - هواپیما در فرودگاه است
    accepted_answers:
    - value: هواپیما رفته بود
      status: correct
    feedback: '*طیاره رفته بود* یعنی هواپیما رفته بود: صفت مفعولی *رفته* به‌اضافهٔ *بود*.'
  prs.a2.unit26.lesson01.exercise02.recognize_lost_passport:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: پاسپورتم را گم کرده بودم
    distractors:
    - گذرنامه‌ام را پیدا کردم
    - گذرنامه‌ام در خانه است
    - گذرنامه می‌خواهم
    accepted_answers:
    - value: پاسپورتم را گم کرده بودم
      status: correct
    feedback: '*گم کرده بودم* یعنی گم کرده بودم: صفت مفعولی *گم کرده* به‌اضافهٔ *بودم*.'
  prs.a2.unit26.lesson01.exercise03.recognize_we_arrived:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: ما رسیده بودیم
    distractors:
    - آن‌ها رسیده بودند
    - رسیده بودم
    - ما هر روز می‌رسیم
    accepted_answers:
    - value: ما رسیده بودیم
      status: correct
    feedback: 'پایانهٔ *بودیم* یعنی «ما»: *ما رسیده بودیم* یعنی ما رسیده بودیم.'
  prs.a2.unit26.lesson01.exercise04.match_form_and_words:
    instruction: هر کلمهٔ دری را با معنی‌اش جفت کنید.
    accepted_answers:
    - value:
        رفته بودم: رفته بودم
        رفته بودی: رفته بودی (به دوست)
        رفته بود: او رفته بود
        رفته بودیم: رفته بودیم
        رفته بودین: رفته بودید (رسمی یا جمع)
        رفته بودند: آن‌ها رفته بودند
        طیاره: هواپیما
        میدان هوایی: فرودگاه
        ایستگاه: ایستگاه
      status: correct
    feedback: 'فقط *بود-* با شخص عوض می‌شود: *بودم* من، *بودی* تو (دوست)، *بود* او، *بودیم* ما، *بودین* شما (رسمی یا جمع)، *بودند* آن‌ها.'
    pairs:
    - left: رفته بودم
      right: رفته بودم
    - left: رفته بودی
      right: رفته بودی (به دوست)
    - left: رفته بود
      right: او رفته بود
    - left: رفته بودیم
      right: رفته بودیم
    - left: رفته بودین
      right: رفته بودید (رسمی یا جمع)
    - left: رفته بودند
      right: آن‌ها رفته بودند
    - left: طیاره
      right: هواپیما
    - left: میدان هوایی
      right: فرودگاه
    - left: ایستگاه
      right: ایستگاه
  prs.a2.unit26.lesson01.exercise05.order_we_arrived_station:
    instruction: 'کلمات را مرتب کنید تا بگویید: ما به ایستگاه رسیده بودیم.'
    accepted_answers:
    - value:
      - ما
      - به
      - ایستگاه
      - رسیده
      - بودیم
      status: correct
    feedback: '*ما به ایستگاه رسیده بودیم* صفت مفعولی را اول و *بودیم* را آخر می‌آورد.'
  prs.a2.unit26.lesson01.exercise06.translate_bus_left:
    instruction: 'به دری ترجمه کنید و از ماضی بعیدِ رفتن استفاده کنید: اتوبوس رفته بود.'
    accepted_answers:
    - value: بس رفته بود.
      status: correct
    - value: آن بس رفته بود.
      status: correct
    feedback: '*بس رفته بود* یعنی اتوبوس رفته بود. *آن* (آن) اختیاری است.'
  prs.a2.unit26.lesson02.exercise01.recognize_had_eaten:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: صبحانه خورده بودم
    distractors:
    - صبحانه خواهم خورد
    - دارم صبحانه می‌خورم
    - صبحانه نمی‌خواهم
    accepted_answers:
    - value: صبحانه خورده بودم
      status: correct
    feedback: '*خورده بودم* یعنی خورده بودم: صفت مفعولی *خورده* به‌اضافهٔ *بودم*.'
  prs.a2.unit26.lesson02.exercise02.recognize_gate_closed:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: دروازه بسته شده بود
    distractors:
    - دروازه باز است
    - دروازه فردا بسته می‌شود
    - دروازه در فرودگاه است
    accepted_answers:
    - value: دروازه بسته شده بود
      status: correct
    feedback: '*بسته شده بود* ماضی بعیدِ *بسته شدن* است: دروازه بسته شده بود.'
  prs.a2.unit26.lesson02.exercise03.match_participles:
    instruction: هر فعل ماضی بعید را با معنایش جفت کنید.
    accepted_answers:
    - value:
        رفته بود: او رفته بود
        خورده بود: او خورده بود
        دیده بود: او دیده بود
        رسیده بود: او رسیده بود
        آمده بود: او آمده بود
        کرده بود: او انجام داده بود
        برگشته بود: او برگشته بود
        گم کرده بود: او گم کرده بود
        خراب شده بود: خراب شده بود
      status: correct
    feedback: 'همهٔ این‌ها صفت مفعولیِ دارای *ه* به‌اضافهٔ *بود* هستند. در فعل‌های دو کلمه‌ای کلمهٔ اول سر جایش می‌ماند: *گم کرده بود*، *خراب شده بود*.'
    pairs:
    - left: رفته بود
      right: او رفته بود
    - left: خورده بود
      right: او خورده بود
    - left: دیده بود
      right: او دیده بود
    - left: رسیده بود
      right: او رسیده بود
    - left: آمده بود
      right: او آمده بود
    - left: کرده بود
      right: او انجام داده بود
    - left: برگشته بود
      right: او برگشته بود
    - left: گم کرده بود
      right: او گم کرده بود
    - left: خراب شده بود
      right: خراب شده بود
  prs.a2.unit26.lesson02.exercise04.order_lost_key:
    instruction: 'کلمات را مرتب کنید تا بگویید: کلیدم را گم کرده بودم.'
    accepted_answers:
    - value:
      - کلیدم
      - را
      - گم
      - کرده
      - بودم
      status: correct
    feedback: '*کلیدم را گم کرده بودم* *را* را بعد از چیزِ گم‌شده نگه می‌دارد و فعل را آخر می‌آورد.'
  prs.a2.unit26.lesson02.exercise05.complete_gate:
    instruction: 'جمله را کامل کنید: دروازه بسته شده بود.'
    accepted_answers:
    - value: بود
      status: correct
    feedback: '*بود* گذشتهٔ *بودن* است. با *بسته شده* ماضی بعید می‌سازد.'
  prs.a2.unit26.lesson02.exercise06.translate_car_broke_down:
    instruction: 'به دری ترجمه کنید و از ماضی بعیدِ خراب شدن استفاده کنید: ماشینم خراب شده بود.'
    accepted_answers:
    - value: موترم خراب شده بود.
      status: correct
    - value: موتر من خراب شده بود.
      status: correct
    feedback: '*موترم خراب شده بود* یعنی ماشینم خراب شده بود. *موتر من* همان است، فقط با ضمیر جدا.'
  prs.a2.unit26.lesson03.exercise01.which_first:
    instruction: جمله را بخوانید. اول چه اتفاقی افتاد؟
    correct_option: اتوبوس رفت
    distractors:
    - رسیدم
    - من به خانه رفتم
    - من بلیت خریدم
    accepted_answers:
    - value: اتوبوس رفت
      status: correct
    feedback: '*بس رفته بود* رویداد قبلی است، پس اتوبوس اول رفته است. *وقتی رسیدم* نقطهٔ مرجعِ بعدی است.'
  prs.a2.unit26.lesson03.exercise02.bus_left_after:
    instruction: جمله را بخوانید. کدام گزاره درست است؟
    correct_option: اتوبوس بعد از رسیدن من رفت
    distractors:
    - اتوبوس قبل از رسیدن من رفت
    - اتوبوس هرگز نرفت
    - من نرسیدم
    accepted_answers:
    - value: اتوبوس بعد از رسیدن من رفت
      status: correct
    feedback: 'هر دو فعل گذشتهٔ ساده‌اند، پس ترتیب همان ترتیب کلمات است: اول *رسیدم*، بعد *بس رفت*.'
  prs.a2.unit26.lesson03.exercise03.match_simple_perfect:
    instruction: هر فعل دری را به معنی‌اش وصل کنید.
    accepted_answers:
    - value:
        رسیدم: رسیدم
        رسیده بودم: رسیده بودم
        رفت: او رفت
        رفته بود: او رفته بود
        دیدم: دیدم
        دیده بودم: دیده بودم
        گم کردم: گم کردم
        گم کرده بودم: گم کرده بودم
        نرفته بودم: نرفته بودم
      status: correct
    feedback: گذشتهٔ ساده از ریشهٔ گذشته و یک شناسه ساخته می‌شود. ماضی بعید صفت مفعولی و *بود-* را اضافه می‌کند، پس دو کلمه است.
    pairs:
    - left: رسیدم
      right: رسیدم
    - left: رسیده بودم
      right: رسیده بودم
    - left: رفت
      right: او رفت
    - left: رفته بود
      right: او رفته بود
    - left: دیدم
      right: دیدم
    - left: دیده بودم
      right: دیده بودم
    - left: گم کردم
      right: گم کردم
    - left: گم کرده بودم
      right: گم کرده بودم
    - left: نرفته بودم
      right: نرفته بودم
  prs.a2.unit26.lesson03.exercise04.order_plane_left:
    instruction: 'کلمات را مرتب کنید تا بگویید: وقتی رسیدم، هواپیما رفته بود.'
    accepted_answers:
    - value:
      - وقتی
      - رسیدم
      - طیاره
      - رفته
      - بود
      status: correct
    - value:
      - طیاره
      - رفته
      - بود
      - وقتی
