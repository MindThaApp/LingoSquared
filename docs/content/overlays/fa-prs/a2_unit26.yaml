course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری سطح پیش‌متوسط: گفتن اینکه چیزی پیش از یک نقطه در گذشته اتفاق افتاده بود، مثلاً اینکه اتوبوس پیش از رسیدن شما رفته بود. گذشته‌ی بعید (صفت مفعولی به‌اضافه‌ی گذشته‌ی «بودن»)، منفی آن و تفاوتش با گذشته‌ی ساده.'
units:
