teaching:
  prs.a1.unit04.lesson01.teach.one_to_three:
    title: یک، دو، سه
    gloss: 1, 2, 3
    note: یک، دو، سه عددهای پایه‌اند و در دری و فارسی یکسان‌اند.
    example_gloss:
    - من یک برادر دارم.
    - من دو تا کتاب دارم.
    - من سه تا خواهر دارم.
  prs.a1.unit04.lesson01.teach.four_to_six:
    title: چهار، پنج، شش
    gloss: 4, 5, 6
    note: چهار شکل نوشتاری معیار است؛ در گفتار روزمره بعضی‌ها آن را کوتاه می‌کنند و چار می‌گویند، ولی این دوره املای معیار را به کار می‌برد.
    example_gloss:
    - من چهار کتاب دارم.
    - پنج دقیقه صبر کن.
    - او شش تا کتاب دارد.
  prs.a1.unit04.lesson01.teach.seven_eight:
    title: هفت، هشت
    gloss: 7, 8
    note: هفت، هشت ادامهٔ همین ردیف عددها هستند.
    example_gloss:
    - هفته هفت روز دارد.
    - ساعت هشت می‌آیم.
  prs.a1.unit04.lesson01.teach.nine_ten:
    title: نه، ده
    gloss: 9, 10
    note: نه، ده عددهای یک تا ده را کامل می‌کنند.
    example_gloss:
    - توی کلاس نه نفر هستند.
    - من ده انگشت دارم.
  prs.a1.unit04.lesson02.teach.eleven_thirteen:
    title: یازده، دوازده، سیزده
    gloss: 11, 12, 13
    note: یازده، دوازده، سیزده واژه‌های جداگانه‌اند و ترکیب ساده‌ای از یکان‌ها نیستند.
    example_gloss:
    - ساعت یازده کلاس دارم.
    - سال دوازده ماه دارد.
    - او سیزده سال دارد.
  prs.a1.unit04.lesson02.teach.fourteen_sixteen:
    title: چهارده، پانزده، شانزده
    gloss: 14, 15, 16
    note: چهارده، پانزده، شانزده ادامهٔ عددهای یازده تا نوزده‌اند.
    example_gloss:
    - چهارده روز دیگر می‌آیم.
    - او پانزده تا کتاب دارد.
    - او شانزده سال دارد.
  prs.a1.unit04.lesson02.teach.seventeen_nineteen:
    title: هفده، هجده، نوزده
    gloss: 17, 18, 19
    note: هفده، هجده، نوزده عددهای یازده تا نوزده را کامل می‌کنند.
    example_gloss:
    - او هفده تا کتاب دارد.
    - او هجده سال دارد.
    - نوزده روز مانده است.
  prs.a1.unit04.lesson02.teach.twenty:
    title: بیست
    gloss: '20'
    note: بیست اولین دهگان است و در درس بعد کامل بررسی می‌شود.
    example_gloss: من بیست تا کتاب دارم.
  prs.a1.unit04.lesson03.teach.twenty_thirty_forty:
    title: بیست، سی، چهل
    gloss: 20, 30, 40
    note: بیست، سی، چهل واژه‌های دهگان هستند و هرکدام شکل جداگانه‌ای دارد، نه الگویی قابل پیش‌بینی.
    example_gloss:
    - من بیست سال دارم.
    - این ماه سی روز دارد.
    - او چهل سال دارد.
  prs.a1.unit04.lesson03.teach.fifty_sixty:
    title: پنجاه، شصت
    gloss: 50, 60
    note: پنجاه، شصت ادامهٔ دهگان‌ها هستند.
    example_gloss:
    - او پنجاه تا کتاب دارد.
    - شصت دقیقه یک ساعت است.
  prs.a1.unit04.lesson03.teach.seventy_eighty:
    title: هفتاد، هشتاد
    gloss: 70, 80
    note: هفتاد، هشتاد ادامهٔ دهگان‌ها هستند.
    example_gloss:
    - این کتاب هفتاد صفحه دارد.
    - او هشتاد تا کتاب دارد.
  prs.a1.unit04.lesson03.teach.ninety_hundred:
    title: نود، صد
    gloss: 90, 100
    note: نود، صد عددهای تا صد را کامل می‌کنند.
    example_gloss:
    - او نود سال دارد.
    - او صد تا کتاب دارد.
  prs.a1.unit04.lesson03.teach.combining_tens:
    title: ترکیب دهگان و یکان
    gloss: ۲۵ در اصل یعنی «بیست و پنج».
    note: دهگان و یکان با و به هم وصل می‌شوند، همان حرف ربطی که در جاهای دیگر این دوره هم می‌بینید، مثل بیست و پنج (25).
  prs.a1.unit04.lesson04.teach.chand:
    title: چند / چقدر
    gloss: چند / چقدر
    note: چند برای پرسیدن دربارهٔ مقدار به کار می‌رود، از جمله دربارهٔ سن.
    example_gloss: چند سالتونه؟
  prs.a1.unit04.lesson04.teach.sal_word:
    title: سال
    gloss: سال
    note: سال هنگام گفتن سن به کار می‌رود، یعنی «سال‌ها».
    example_gloss: من بیست سال دارم.
  prs.a1.unit04.lesson04.teach.age_question_polite:
    title: پرسیدنِ مؤدبانهٔ سن
    gloss: چند سالته؟
    note: چند ساله استین؟ یعنی «چند ساله هستید؟» و شکل محترمانهٔ استین را برای کسی به کار می‌برید که خوب نمی‌شناسید.
  prs.a1.unit04.lesson04.teach.age_question_informal:
    title: پرسیدنِ سنِ یک دوست نزدیک
    gloss: چند سالته؟
    note: چند ساله استی؟ شکل صمیمی استی را دارد؛ فقط برای دوست نزدیک یا هم‌سن‌وسال به کار می‌رود، همان قاعدهٔ احترام و صمیمیت که در جاهای دیگر این دوره هم آمده است.
  prs.a1.unit04.lesson04.teach.age_answer:
    title: گفتن سن
    gloss: من ۲۵ سالمه.
    note: بیست و پنج ساله استم از عدد، ساله (یعنی «سال‌دار») و استم ساخته شده است.
  prs.a1.unit04.lesson05.teach.number_word:
    title: شماره
    gloss: شماره
    note: در دریِ افغانستان برای «شماره»، به‌ویژه شمارهٔ تلفن، در گفتار روزمره بسیار از نمبر استفاده می‌شود.
    example_gloss: این شمارهٔ تلفن منه.
  prs.a1.unit04.lesson05.teach.telephone_word:
    title: تلفن
    gloss: تلفن
    note: تلفن کلمهٔ معیار برای «تلفن» است.
    example_gloss: تلفنم خراب شده.
  prs.a1.unit04.lesson05.teach.phone_question:
    title: پرسیدنِ شماره تلفن
    gloss: شمارهٔ تلفنت چیست؟
    note: نمبر تلفن‌تان چند است؟ همان الگوی چند در پرسش سن را برای شمارهٔ تلفن به کار می‌برد.
  prs.a1.unit04.lesson05.teach.zero_word:
    title: صفر
    gloss: صفر
    note: صفر برای خواندن بیشتر شماره‌های تلفن افغانستان لازم است.
    example_gloss: صفر یک عدد است.
  prs.a1.unit04.lesson05.teach.phone_answer:
    title: گفتنِ شمارهٔ تلفن
    gloss: شمارهٔ تلفنم ۰۷۹-۳۴۵-۶۷۸ است.
    note: شماره‌های تلفن افغانستان معمولاً به‌صورت گروه‌های کوتاه خوانده می‌شوند، نه رقم‌به‌رقم؛ همان‌طور که اینجا می‌بینید.
  prs.a1.unit04.lesson06.teach.turn01:
    title: همایون به بشیر سلام می‌کند
    gloss: همایون با لحن صمیمیِ مناسبِ دوست نزدیک از بشیر احوال‌پرسی می‌کند.
    note: جور استی؟ نشان می‌دهد این دو نفر دوست نزدیک‌اند؛ پس در سراسر این گفت‌وگو لحن صمیمی مناسب است.
  prs.a1.unit04.lesson06.teach.turn02:
    title: بشیر جواب می‌دهد و سن همایون را می‌پرسد
    gloss: بشیر می‌گوید خوب است و می‌پرسد همایون چند ساله است.
    note: چند ساله استی؟ مطابق دوستیِ آن‌ها از لحن صمیمی استفاده می‌کند.
  prs.a1.unit04.lesson06.teach.turn03:
    title: همایون جواب می‌دهد و همان پرسش را برمی‌گرداند
    gloss: همایون می‌گوید ۲۸ سال دارد و همین را از بشیر می‌پرسد.
    note: الگوی جواب دادن به سن از درس چهارم دوباره به‌کار رفته است.
  prs.a1.unit04.lesson06.teach.turn04:
    title: بشیر جواب می‌دهد
    gloss: بشیر می‌گوید ۲۶ سال دارد.
    note: گفت‌وگوی مربوط به سن اینجا کامل می‌شود.
  prs.a1.unit04.lesson06.teach.turn05:
    title: همایون شمارهٔ تلفن بشیر را می‌خواهد
    gloss: همایون شمارهٔ تلفن بشیر را می‌پرسد.
    note: تلفنت پسوند مالکیتِ صمیمی را دارد و با لحن بقیهٔ این گفت‌وگو می‌خواند.
  prs.a1.unit04.lesson06.teach.turn06:
    title: بشیر شمارهٔ تلفنش را می‌گوید
    gloss: بشیر شمارهٔ تلفنش را در گروه‌های کوتاه می‌خواند.
    note: شماره همان‌طور گروه‌گروه خوانده می‌شود که در مثال درس پنجم بود.
  prs.a1.unit04.lesson06.teach.turn07:
    title: همایون تأیید می‌کند که ذخیره کرده است
    gloss: همایون تشکر می‌کند و می‌گوید همین الان ذخیره‌اش می‌کند.
    note: سیف می‌کنم در دریِ گفتاریِ افغانستان رایج است و یعنی «ذخیره می‌کنم»؛ این واژهٔ وام‌گرفته در حوزهٔ فناوری برای گفت‌وگوی غیررسمی بین دوستان مناسب است.
