    gloss: تلفن / ندارم / اما / شما (رسمی)
    note: تلفن، ندارم، اما و شما کلمه‌های مروری هستند که برای مقایسه‌ی یک نیاز با یک محدودیت و پرسیدنِ یک سؤالِ رسمی به کار می‌روند.
