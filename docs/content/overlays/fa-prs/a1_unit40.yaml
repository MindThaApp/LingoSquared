    gloss: زنگ بزنید
    note: زنگ بزنین شکل امرِ مؤدبانه‌ی زنگ زدن است و بر پایه‌ی زنگ می‌زنم (زنگ می‌زنم) که قبلاً یاد گرفته‌اید ساخته شده است.
    example_gloss: به پلیس زنگ بزنید!
  prs.a1.unit40.lesson02.teach.come_word:
    title: بیایید! (امر)
    gloss: بیایید
    note: بیایین شکل امرِ مؤدبانه‌ی آمدن است.
    example_gloss: زود بیایید!
  prs.a1.unit40.lesson02.teach.call_ambulance_phrase:
    title: به آمبولانس زنگ بزنید!
    gloss: به آمبولانس زنگ بزنید!
    note: به (به/برای) به‌علاوه‌ی امبولانس (آمبولانس) به‌علاوه‌ی فعل امرِ زنگ بزنین.
  prs.a1.unit40.lesson03.teach.review_he_she_has:
