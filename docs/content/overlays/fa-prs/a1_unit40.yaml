teaching:
  prs.a1.unit40.lesson01.teach.review_help_want:
    title: 'مرور: کمک، می‌خواهم'
    gloss: کمک / می‌خواهم
    note: کمک و می‌خواهم کلمه‌های مرور هستند که در این درس برای گفتنِ نوعِ کمکِ موردنیاز به کار می‌روند.
    target_text: کمک (یاری) / می‌خواهم (من می‌خواهم)
  prs.a1.unit40.lesson01.teach.review_this_is:
    title: 'مرور: این، است'
    gloss: این / است
    note: این و است کلمه‌های مروریِ ابتدایی هستند که برای گفتنِ نوعِ موقعیت به کار می‌روند.
    target_text: این (این) / است (هست)
  prs.a1.unit40.lesson01.teach.emergency_word:
    title: اضطراری
    gloss: اضطراری
    note: اضطراری یعنی اورژانسی و فوری.
    example_gloss: این اضطراری است.
  prs.a1.unit40.lesson01.teach.police_word:
    title: پلیس
    gloss: پلیس
    note: پولیس در دریِ افغانستان کلمه‌ی استاندارد برای «پلیس» است؛ در فارسیِ ایران «پلیس» می‌گوییم، ولی در دری «پولیس» به کار می‌رود.
    example_gloss: پلیس می‌خواهم.
  prs.a1.unit40.lesson01.teach.ambulance_word:
    title: آمبولانس
    gloss: آمبولانس
    note: امبولانس یعنی آمبولانس.
    example_gloss: آمبولانس می‌خواهم.
  prs.a1.unit40.lesson01.teach.fire_word:
    title: آتش
    gloss: آتش‌سوزی
    note: آتش یعنی آتش.
    example_gloss: آتش‌سوزی شده است.
  prs.a1.unit40.lesson01.teach.fire_brigade_word:
    title: آتش‌نشانی
    gloss: آتش‌نشانی
    note: اطفائیه واژه‌ی رایج در کابل برای آتش‌نشانی است.
    example_gloss: آتش‌نشانی می‌خواهم.
  prs.a1.unit40.lesson01.teach.emergency_help_phrase:
    title: این اضطراری است! پلیس می‌خواهم!
    gloss: این اضطراری است! پلیس می‌خواهم!
    note: این اضطراری است از «این» (این)، «اضطراری» (اضطراری) و «است» (است) ساخته شده است.
  prs.a1.unit40.lesson02.teach.review_can_you_do:
    title: 'مرور: می‌توانید، بکنید (امر مؤدبانه)، به/برای، زود'
    gloss: می‌توانید / بکنید / به/برای / زود
    note: می‌توانین، کنین، به و زود (از درس‌های قبل) با کلمه‌های دیگر ترکیب می‌شوند و درخواست‌ها و دستورهای مؤدبانه می‌سازند.
    target_text: می‌توانین (می‌توانید) / کنین (کنید -- امر مؤدبانه) / به (به/برای) / زود (سریع)
  prs.a1.unit40.lesson02.teach.mera_word:
    title: مرا
    gloss: مرا
    note: 'مه ره در دریِ کابلیِ محاوره‌ای معادلِ «مرا» (مفعول) است: مه شکل محاوره‌ایِ «من» و ره شکل محاوره‌ایِ نشانه‌ی مفعولی «را» است. در نوشتار معمولاً مرا می‌بینید که آن هم پذیرفته است.'
    example_gloss: می‌تونی به من کمک کنی؟
  prs.a1.unit40.lesson02.teach.can_you_help_me_phrase:
    title: می‌توانید به من کمک کنید؟
    gloss: می‌توانید به من کمک کنید؟
    note: جمله‌ای واقعی و پرکاربرد در دری برای درخواستِ مستقیمِ کمک.
  prs.a1.unit40.lesson02.teach.call_word:
