teaching:
  prs.a1.unit07.lesson01.teach.alo:
    title: الو (پشت تلفن)
    gloss: الو (پشت تلفن)
    note: «الو» مخصوص جواب دادن یا شروع کردن تماس تلفنی است و با «سلام» که حضوری گفته می‌شود فرق دارد.
    example_gloss: الو، کریم صحبت می‌کند.
  prs.a1.unit07.lesson01.teach.goosh_astam:
    title: دعوت از تماس‌گیرنده برای ادامه صحبت
    gloss: بله، بفرمایید.
    note: «بلی، بفرمایین» پاسخ طبیعی بعد از برداشتن تلفن است و از همان «بفرمایین» مؤدبانه‌ای استفاده می‌کند که در جاهای دیگر این دوره هم آمده است؛ ترجمهٔ تحت‌اللفظی «گوش می‌کنم» نیست.
  prs.a1.unit07.lesson01.teach.telephone_review:
    title: تلفن (مرور)
    gloss: تلفن
    note: «تلفن» در درس اعداد معرفی شد و اینجا فضای کلی این واحد است.
    example_gloss: تلفن من خراب است.
  prs.a1.unit07.lesson02.teach.who_speaking:
    title: پرسیدن اینکه کی زنگ زده
    gloss: ببخشید، شما؟ (چه کسی صحبت می‌کند؟)
    note: «ببخشین، کی صحبت می‌کند؟» مؤدبانه از هویت تماس‌گیرنده می‌پرسد.
  prs.a1.unit07.lesson02.teach.this_is_speaking:
    title: معرفی خود
    gloss: من فرید هستم.
    note: «من فرید استم» مستقیم می‌گوید چه کسی زنگ زده و از همان الگوی «استم» واحدهای قبلی استفاده می‌کند.
  prs.a1.unit07.lesson02.teach.colleague_context:
    title: توضیح رابطهٔ خود با کسی که با او تماس گرفته‌اید
    gloss: من همکار همایون هستم.
    note: «همکار همایون استم» دلیل تماس شما را روشن می‌کند و وقتی کسی که گوشی را برمی‌دارد شما را نمی‌شناسد، به کار می‌آید.
  prs.a1.unit07.lesson03.teach.speak_slowly:
    title: خواستن از کسی که آهسته صحبت کند
    gloss: لطفاً آهسته صحبت کنید.
    note: «لطفاً آهسته صحبت کنین» درخواستی مؤدبانه و طبیعی است، وقتی خط ضعیف است یا شما زبان را تازه یاد می‌گیرید.
  prs.a1.unit07.lesson03.teach.repeat_review:
    title: خواستن تکرار (مرور)
    gloss: می‌شود دوباره بگویید؟
    note: «می‌توانین دوباره بگویین؟» در واحد معرفی آمده بود و پشت تلفن هم به همان اندازه طبیعی است.
  prs.a1.unit07.lesson03.teach.combined_request:
    title: ترکیب دو درخواست
    gloss: لطفاً آهسته صحبت کنید و دوباره بگویید.
    note: «و» دو درخواست را در یک جملهٔ طبیعی به هم وصل می‌کند.
  prs.a1.unit07.lesson04.teach.payam_word:
    title: پیام
    gloss: پیام
    note: «پیام» واژهٔ کلی برای پیام است، چه گفتاری و چه نوشتاری.
    example_gloss: یک پیام برای شما دارم.
  prs.a1.unit07.lesson04.teach.want_to_leave_message:
    title: گفتن اینکه می‌خواهید پیام بگذارید
    gloss: می‌خواهم یک پیام بگذارم.
    note: «می‌خواهم یک پیام بگذارم» را وقتی می‌گویید که کسی که با او تماس گرفته‌اید در دسترس نیست.
  prs.a1.unit07.lesson04.teach.will_call_later:
    title: گفتن اینکه بعداً زنگ می‌زنید
    gloss: بعداً زنگ می‌زنم.
    note: «بعد زنگ می‌زنم» راه ساده‌ای به جای گذاشتن پیام است.
  prs.a1.unit07.lesson05.teach.short_message:
    title: پیامک
    gloss: پیامک (پیام کوتاه)
    note: «پیام کوتاه» یعنی همان «پیامک»؛ تعبیر رایج برای اس‌ام‌اس.
  prs.a1.unit07.lesson05.teach.meeting_tomorrow:
    title: یک پیام نمونه
    gloss: فردا جلسه ساعت نه است.
    note: «فردا جلسه ساعت نه است» اطلاعاتی کامل و طبیعی است که می‌توان در یک پیام رساند.
  prs.a1.unit07.lesson05.teach.will_deliver:
    title: تأیید اینکه پیام را می‌رسانید
    gloss: می‌رسانم.
    note: «می‌رسانم» تأیید می‌کند که پیام به گیرنده می‌رسد.
  prs.a1.unit07.lesson06.teach.turn01:
    title: لیما تلفن را جواب می‌دهد
    gloss: لیما با «الو» جواب می‌دهد.
    note: «الو؟» روش معمول جواب دادن به تماس ورودی است.
  prs.a1.unit07.lesson06.teach.turn02:
    title: فرید سلام می‌کند و مطمئن می‌شود که با لیما صحبت می‌کند
    gloss: فرید سلام می‌کند و می‌پرسد که آیا او لیماست.
    note: «الو، سلام» «الو» پشت تلفن را با سلام معمولی ترکیب می‌کند.
  prs.a1.unit07.lesson06.teach.turn03:
    title: لیما از او می‌خواهد ادامه بدهد و می‌پرسد کی زنگ زده
    gloss: لیما از او می‌خواهد ادامه بدهد و می‌پرسد چه کسی زنگ زده.
    note: «بلی، بفرمایین» و «کی صحبت می‌کند؟» هر دو از درس اول و دوم آمده‌اند.
  prs.a1.unit07.lesson06.teach.turn04:
    title: فرید خودش را معرفی می‌کند
    gloss: فرید می‌گوید همکار همایون است.
    note: این جمله الگوی معرفی با «همکار» از درس دوم را تکرار می‌کند و به لیما دلیلی برای اعتماد به تماس می‌دهد.
  prs.a1.unit07.lesson06.teach.turn05:
    title: لیما از او می‌خواهد آهسته صحبت کند
    gloss: لیما به فرید سلام می‌کند و از او می‌خواهد آهسته صحبت کند.
    note: «آهسته صحبت کنین، لطفاً» همان درخواست درس سوم را تکرار می‌کند.
  prs.a1.unit07.lesson06.teach.turn06:
    title: فرید قبول می‌کند و می‌خواهد پیام بگذارد
    gloss: فرید قبول می‌کند و می‌گوید می‌خواهد برای همایون پیام بگذارد.
    note: این جمله الگوی «پیام» درس چهارم را با ذکر گیرندهٔ مشخص («برای همایون») گسترش می‌دهد.
  prs.a1.unit07.lesson06.teach.turn07:
    title: لیما قبول می‌کند که پیام را بنویسد
    gloss: لیما از او می‌خواهد بگوید و می‌گوید دارد می‌نویسد.
    note: «بفرمایین» اینجا فرید را دعوت می‌کند که به صحبت ادامه بدهد.
  prs.a1.unit07.lesson06.teach.turn08:
    title: فرید متن پیام را می‌گوید
    gloss: فرید از او می‌خواهد بگوید جلسه فردا ساعت نه است.
    note: این جمله مستقیماً متن پیام نمونهٔ درس پنجم را تکرار می‌کند.
  prs.a1.unit07.lesson06.teach.turn09:
    title: لیما تأیید می‌کند و قول می‌دهد پیام را برساند
    gloss: لیما جزئیات را تأیید می‌کند و می‌گوید پیام را می‌رساند.
    note: «می‌رسانم» بخش گرفتن پیام را در تماس تمام می‌کند، همان‌طور که در درس پنجم آمد.
  prs.a1.unit07.lesson06.teach.turn10:
    title: فرید تشکر می‌کند و خداحافظی می‌کند
    gloss: فرید خیلی تشکر می‌کند و خداحافظی می‌کند.
    note: «تشکر زیاد» و «خدا حافظ» هر دو از واحدهای قبلی تکرار شده‌اند.
  prs.a1.unit07.lesson06.teach.turn11:
    title: لیما خداحافظی می‌کند
    gloss: لیما خداحافظی می‌کند.
    note: «خدا حافظ» تماس را تمام می‌کند.
  prs.a1.unit07.lesson06.teach.past_tense_left:
    title: گفتن اینکه کسی پیام گذاشت (گذشتهٔ ساده)
    gloss: فرید پیام گذاشت.
    note: «گذاشت» گذشتهٔ ساده (گذاشت) فعلی است که در «می‌خواهم یک پیام بگذارم» در درس چهارم آمد و «بگذارم» یعنی «بگذارم». از آن برای خلاصه کردن آنچه بعد از تماس اتفاق افتاد استفاده کنید.
    target_text: فرید پیام گذاشت (فرید پیام گذاشت)
