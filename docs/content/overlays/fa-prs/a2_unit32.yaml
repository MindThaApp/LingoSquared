teaching:
  prs.a2.unit32.lesson01.teach.doctor:
    title: دکتر
    gloss: دکتر
    note: '*داکتر* در دری افغانستان یعنی دکتر. برای رفتن پیش دکتر می‌گویید *به داکتر رفتن*: *به داکتر می‌روم* یعنی «پیش دکتر می‌روم».'
    example_gloss: دکتر امروز در دفتر است.
  prs.a2.unit32.lesson01.teach.medicine:
    title: دارو
    gloss: دارو
    note: '*دوا* یعنی دارو. در دری برای آن فعل «خوردن» می‌آید: *دوا خوردن*. *دوا را می‌خورم* یعنی «دارو را می‌خورم».'
    example_gloss: دارو را بعد از غذا می‌خورم.
  prs.a2.unit32.lesson01.teach.sick:
    title: بیمار
    gloss: بیمار، مریض
    note: '*مریض* یعنی بیمار. *مریض استم* یعنی «بیمارم» و *او مریض است* یعنی «او بیمار است».'
    example_gloss: برادرم بیمار است.
  prs.a2.unit32.lesson01.teach.rest:
    title: استراحت کردن
    gloss: استراحت کردن
    note: '*استراحت کردن* یعنی استراحت کردن. فعل دوکلمه‌ای است: *استراحت* ثابت می‌ماند و فقط *کردن* صرف می‌شود، مثل *استراحت می‌کنم* (استراحت می‌کنم).'
    example_gloss: بعد از کار استراحت می‌کنم.
  prs.a2.unit32.lesson01.teach.sleep:
    title: خوابیدن
    gloss: خوابیدن، به رختخواب رفتن
    note: '*خوابیدن* یعنی خوابیدن یا به رختخواب رفتن. *شب‌ها* یعنی شب‌ها: *شب‌ها زود می‌خوابم* یعنی «شب‌ها زود می‌خوابم». *دیر خوابیدن* یعنی دیر خوابیدن.'
    example_gloss: زود خوابیدن مهم است.
  prs.a2.unit32.lesson01.teach.head:
    title: سرم درد می‌کند
    gloss: سرم درد می‌کند.
    note: 'برای گفتن اینکه عضوی از بدن درد می‌کند، *-م* را به عضو اضافه می‌کنید و *درد می‌کند* می‌آورید: *سرم درد می‌کند* (سرم درد می‌کند). این همان مشکل معمولی است که باعث می‌شود دوستی به شما توصیه کند.'
  prs.a2.unit32.lesson01.teach.stem:
    title: 'توصیه با فعل التزامی: امر + ی'
    gloss: 'برو: که بروی؛ بخور: که بخوری؛ بخواب: که بخوابی؛ استراحت کن: که استراحت کنی'
    note: 'برای توصیه کردن از شکلی از فعل به نام التزامی استفاده می‌کنید. برای دوست (*تو*) ساده است: امری را که به دوست می‌گویید بگیرید و *ی* اضافه کنید. *برو* می‌شود *بروی*، *بخور* می‌شود *بخوری*، *بخواب* می‌شود *بخوابی*، *استراحت کن* می‌شود *استراحت کنی*. در بیشتر فعل‌ها امر با *ب-* شروع می‌شود؛ فعل‌های ساخته‌شده با *کردن* در این واحد *ب-* ندارند (*کن*، نه *بکن*).'
  prs.a2.unit32.lesson01.teach.paradigm:
    title: 'التزامی رفتن: هر شش شخص'
    gloss: که من بروم، که تو بروی (دوست)، که او برود، که ما برویم، که شما بروید (رسمی یا جمع)، که آن‌ها بروند
    note: 'ریشهٔ فعل امری *برو* این شناسه‌ها را می‌گیرد: *بروم* (من)، *بروی* (تو، برای دوست)، *برود* (او)، *برویم* (ما)، *بروین* (شما، رسمی یا جمع)، *بروند* (آن‌ها). شناسه‌ها این‌هاست: *-م، -ی، -د، -یم، -ین، -ند*. در این درس، مثل بقیهٔ دوره، شناسهٔ دوم‌شخص جمع به شکل *-ین* نوشته می‌شود. وجه التزامی زمان را نشان نمی‌دهد؛ معنای آن از توصیه یا فعل اصلیِ اطرافش می‌آید.'
  prs.a2.unit32.lesson01.teach.better:
    title: توصیه کردن با بهتر است که
    gloss: بهتر است پیش دکتر بروید. (بهتر است که پیش دکتر بروی.)
    note: '*بهتر است* + *که* + وجه التزامی، روش ملایم و دوستانهٔ توصیه کردن است: *بهتر است که به داکتر بروی* یعنی «بهتر است پیش دکتر بروی». *که* را می‌شود حذف کرد: *بهتر است به داکتر بروی* همین معنی را دارد. در این درس همیشه *است* کامل نوشته می‌شود و شکل کوتاه‌تری در دری نوشتاری این دوره نیست. کسی که باید کاری را بکند فقط با شناسهٔ فعل التزامی مشخص می‌شود: *بروی* یعنی «تو».'
  prs.a2.unit32.lesson01.teach.better_more:
    title: توصیه‌های بیشتر برای دوستِ بیمار
    gloss: بهتر است دارو بخوری. بهتر است بخوابی. بهتر است استراحت کنی.
    note: 'همین الگو با فعل‌های دیگر: *دوا بخوری* (که دارو بخوری)، *بخوابی* (که بخوابی)، *استراحت کنی* (که استراحت کنی). فقط فعل آخر جمله عوض می‌شود؛ *بهتر است که* ثابت می‌ماند.'
  prs.a2.unit32.lesson01.teach.neg:
    title: 'منفی: ن به جای ب'
    gloss: بهتر است نروی. بهتر است دیر نخوابی.
    note: 'برای گفتن کاری که دوست شما نباید بکند، *ن-* را به جای *ب-* بگذارید: *بروی* می‌شود *نروی*، *بخوری* می‌شود *نخوری*، *بخوابی* می‌شود *نخوابی*. با فعل‌های *کردن* منفی‌اش *نکنی* است. پس *بهتر است که دیر نخوابی* یعنی «بهتر است دیر نخوابی».'
  prs.a2.unit32.lesson01.teach.formal:
    title: 'توصیه به فردی که به او احترام می‌گذارید: ین'
    gloss: بهتر است پیش دکتر بروید. (رسمی یا جمع)
    note: 'برای کسی که به او احترام می‌گذارید، مثل فرد مسن، غریبه یا چند نفر، از *شما* و شناسهٔ *-ین* استفاده کنید: *بروین، بخورین، بخوابین، کنین*. *بهتر است که شما به داکتر بروین* یعنی «بهتر است شما پیش دکتر بروید». با دوست می‌گویید *بروی*.'
  prs.a2.unit32.lesson01.teach.water:
    title: آب زیاد بنوشید
    gloss: بهتر است که آب زیاد بخوری.
    note: 'در دری مثل دارو، برای آب هم فعل «خوردن» می‌آید: *آب خوردن* یعنی «آب نوشیدن». *آب زیاد* یعنی «آب فراوان». این توصیه برای دوست بیمار خیلی رایج است.'
  prs.a2.unit32.lesson02.teach.lesson:
    title: درس، مطالعه
    gloss: درس، تکلیف مدرسه
    note: '*درس* یعنی «درس» یا «تکلیف مدرسه». *درس خواندن* یعنی «درس خواندن» (در اصل: خواندن درس): *درس می‌خوانم* یعنی «درس می‌خوانم».'
    example_gloss: هر روز درس می‌خوانم.
  prs.a2.unit32.lesson02.teach.exam:
    title: امتحان
    gloss: امتحان، آزمون
    note: '*امتحان* یعنی «امتحان» یا «آزمون». توصیه دربارهٔ درس خواندن اغلب به یک *امتحان* نزدیک مربوط است.'
    example_gloss: امتحان من فردا است.
  prs.a2.unit32.lesson02.teach.book:
    title: کتاب
    gloss: کتاب
    note: '*کتاب* یعنی «کتاب». با افزودن *-م* می‌شود «من»: *کتابم*. جمع آن *کتاب‌ها* نوشته می‌شود.'
    example_gloss: کتابم در مدرسه است.
  prs.a2.unit32.lesson02.teach.review:
    title: تکرار کردن، مرور کردن
    gloss: تکرار کردن، دوباره مرور کردن
    note: '*تکرار کردن* یعنی «تکرار کردن» یا «چیزی را دوباره مرور کردن». توصیهٔ معمول پیش از امتحان است: *درس را تکرار کن*.'
    example_gloss: هر شب درس را مرور می‌کنم.
  prs.a2.unit32.lesson02.teach.early:
    title: زود، به‌زودی
    gloss: زود، به‌زودی
    note: '*زود* یعنی «زود» یا «به‌زودی». *زود خوابیدن* یعنی «زود خوابیدن» و *صبح زود* یعنی «صبح زود».'
    example_gloss: صبح زود به مدرسه می‌روم.
  prs.a2.unit32.lesson02.teach.late:
    title: دیر
    gloss: دیر
    note: '*دیر* یعنی «دیر»؛ مخالف *زود* است. *دیر خوابیدن* یعنی «دیر خوابیدن».'
    example_gloss: او امروز دیر آمد.
  prs.a2.unit32.lesson02.teach.must:
    title: 'باید + وجه التزامی: «باید»'
    gloss: باید هر روز درس بخوانی.
    note: 'بعد از *باید* (لازم است) هم وجه التزامی می‌آید: *باید هر روز درس بخوانی* یعنی «باید هر روز درس بخوانی». *باید* هیچ‌وقت تغییر نمی‌کند؛ شناسهٔ فعل التزامی نشان می‌دهد چه کسی. *باید* از *بهتر است که* قوی‌تر است: یعنی وظیفه یا نیازی روشن. ترتیب کلمات آزاد است: *هر روز باید درس بخوانی* هم درست است.'
  prs.a2.unit32.lesson02.teach.must_paradigm:
    title: باید با هر شش شخص
    gloss: باید بروم، باید بروی، باید برود، باید برویم، باید بروید (رسمی یا جمع)، باید بروند
    note: 'فقط شناسهٔ فعل التزامی عوض می‌شود: *باید بروم* (من باید بروم)، *باید بروی* (تو باید بروی)، *باید برود* (او باید برود)، *باید برویم* (ما باید برویم)، *باید بروین* (شما باید بروید، رسمی یا جمع)، *باید بروند* (آن‌ها باید بروند).'
  prs.a2.unit32.lesson02.teach.must_not:
    title: 'نباید: «نباید»'
    gloss: نباید دیر بخوابی.
    note: '*نباید* همان *باید* است با *ن-* در ابتدا. فعل بعد از آن مثبت می‌ماند: *نباید دیر بخوابی* یعنی «نباید دیر بخوابی». *ن-* دوم اضافه نکنید: درست *نباید بخوابی* است، نه *نباید نخوابی*.'
  prs.a2.unit32.lesson02.teach.soft_strong:
    title: توصیهٔ ملایم و توصیهٔ جدی
    gloss: بهتر است زود بخوابی. باید زود بخوابی.
    note: هر دو جمله همان توصیه را می‌دهند، اما با شدت متفاوت. *بهتر است که زود بخوابی* دوستانه و ملایم است، مثل «بهتر است...». *باید زود بخوابی* قاطع است، مثل «واقعاً باید...». وقتی فقط توصیه می‌کنید با دوست از *بهتر است که* استفاده کنید و وقتی موضوع مهم است، مثلاً پیش از امتحان، از *باید*.
  prs.a2.unit32.lesson02.teach.review_adv:
    title: توصیه پیش از امتحان
    gloss: بهتر است درس را مرور کنی.
    note: 'چیزی که رویش کار می‌کنید همراه *را* پیش از فعل می‌آید: *درس را تکرار کنی* (که درس را مرور کنی). توصیهٔ خوبی برای درس خواندن است.'
  prs.a2.unit32.lesson03.teach.money:
    title: پول
    gloss: پول
    note: '*پول* یعنی «پول». *پولم* یعنی «پول من». *پولم کم است* یعنی «پول زیادی ندارم».'
    example_gloss: پول زیادی ندارم.
  prs.a2.unit32.lesson03.teach.spend:
    title: خرج کردن
    gloss: خرج کردن
    note: '*خرج کردن* یعنی «پول خرج کردن». پول پیش از فعل می‌آید: *پول خرج کردن*. *زیاد خرج کردن* یعنی «زیاد خرج کردن».'
    example_gloss: او هر ماه پول زیادی خرج می‌کند.
  prs.a2.unit32.lesson03.teach.save:
    title: پس‌انداز کردن
    gloss: پس‌انداز کردن (پول)
    note: '*پس‌انداز کردن* یعنی «پول پس‌انداز کردن». مثل *خرج کردن* فعلی دو‌بخشی است. *پس‌انداز* با فاصلهٔ کوچک (نیم‌فاصله) بین *پس* و *انداز* نوشته می‌شود.'
    example_gloss: هر ماه کمی پول پس‌انداز می‌کنم.
  prs.a2.unit32.lesson03.teach.expensive:
    title: گران
    gloss: گران
    note: '*گران* یعنی «گران». متضادش *ارزان* است.'
    example_gloss: این ماشین گران است.
  prs.a2.unit32.lesson03.teach.cheap:
    title: ارزان
    gloss: ارزان
    note: '*ارزان* یعنی «ارزان». متضادش *گران* است.'
    example_gloss: این کتاب ارزان است.
  prs.a2.unit32.lesson03.teach.month:
    title: ماه
    gloss: ماه
    note: '*ماه* یعنی «ماه (از سال)». *هر ماه* یعنی «هر ماه». وقتی دربارهٔ پول حرف می‌زنید کلمهٔ مفیدی است، چون خیلی‌ها هر ماه پول می‌گیرند و خرج می‌کنند.'
    example_gloss: هر ماه به بانک می‌روم.
  prs.a2.unit32.lesson03.teach.suggest:
    title: پیشنهاد می‌کنم که + وجه التزامی
    gloss: پیشنهاد می‌کنم هر ماه پول پس‌انداز کنی.
    note: '*پیشنهاد می‌کنم* یعنی «پیشنهاد می‌کنم» و *که* + وجه التزامی می‌گوید چه پیشنهاد می‌کنید: *پیشنهاد می‌کنم که هر ماه پول پس‌انداز کنی* یعنی «پیشنهاد می‌کنم هر ماه پول پس‌انداز کنی». فعل *می‌کنم* هم *می‌* دارد و هم شناسهٔ *-م* (من). فعل بعد از *که* دوباره التزامی است: *پس‌انداز کنی*. برای پیشنهادی که برای خودتان با هم دارید، بگویید *پیشنهاد می‌کنیم که* (پیشنهاد می‌کنیم که).'
  prs.a2.unit32.lesson03.teach.three:
    title: سه روش برای دادن یک توصیه
    gloss: بهتر است پول پس‌انداز کنی. باید پول پس‌انداز کنی. پیشنهاد می‌کنم پول پس‌انداز کنی.
    note: اکنون سه الگو می‌دانید که همه وجه التزامی می‌گیرند. *بهتر است که* لحن دوستانه و ملایم دارد. *باید* قاطع است. *پیشنهاد می‌کنم که* مؤدبانه و روشن است؛ مثل پیشنهاد از کسی که به شما احترام می‌گذارد، و وقتی با طرف صمیمی نیستید همین را به کار ببرید.
  prs.a2.unit32.lesson03.teach.we_suggest:
    title: پیشنهاد می‌کنیم
    gloss: پیشنهاد می‌کنیم زود بخوابی.
    note: 'برای «ما»، شناسهٔ *می‌کنم* به *-یم* تبدیل می‌شود: *پیشنهاد می‌کنیم* یعنی «پیشنهاد می‌کنیم». وقتی از طرف یک گروه صحبت می‌کنید، مثلاً خانواده یا تیم، از آن استفاده کنید.'
  prs.a2.unit32.lesson03.teach.suggest_neg:
    title: پیشنهاد کاری که نباید کرد
    gloss: پیشنهاد می‌کنم پول زیادی خرج نکنی.
    note: 'بعد از *پیشنهاد می‌کنم که* برای کاری که نباید کرد، التزامی منفی بیاورید: *نکنی* از *کردن*، *نخری* از *خریدن*. بخش *می‌کنم* مثبت می‌ماند: شما پیشنهاد می‌کنید، و چیزی که پیشنهاد می‌کنید منفی است.'
  prs.a2.unit32.lesson03.teach.expensive_things:
    title: چیزهای گران نخر
    gloss: پیشنهاد می‌کنم چیزهای گران نخری.
    note: '*چیزهای گران* یعنی «چیزهای گران»: جمع *چیز* می‌شود *چیزها* و یک *-ی* پیوندی آن را به صفتِ بعدی وصل می‌کند. *نخری* منفی *بخری* (که بخری) از *خریدن* است.'
  prs.a2.unit32.lesson04.teach.what_do:
    title: چه کار کنم؟
    gloss: چه کار کنم؟
    note: 'برای پرسیدن توصیه هم از وجه التزامی استفاده می‌شود: *چه کار کنم؟* یعنی «چه کار کنم؟» (نه «چه کار می‌کنم»). جمع آن *چه کار کنیم؟* است. اول مشکل را بگویید، بعد بپرسید: *سرم درد می‌کند. چه کار کنم؟*'
  prs.a2.unit32.lesson04.teach.your_view:
    title: به کسی که به او احترام می‌گذارید
    gloss: به نظر شما چه کار کنم؟
    note: '*به نظر شما* یعنی «به نظر شما». با فرد مسن یا غریبه، روش مؤدبانهٔ توصیه خواستن است: *به نظر شما چه کار کنم؟*. بعد طرف مقابل می‌تواند با *بهتر است که* یا *پیشنهاد می‌کنم که* جواب بدهد.'
  prs.a2.unit32.lesson04.teach.what_suggest:
    title: شما چه پیشنهاد می‌کنید؟
    gloss: شما چه پیشنهاد می‌کنید؟
    note: '*شما چه پیشنهاد می‌کنین؟* را از کسی که به او احترام می‌گذارید می‌پرسید. شناسهٔ *-ین* مخصوص *شما* را دارد. با دوست می‌گویید *تو چه پیشنهاد می‌کنی؟*.'
  prs.a2.unit32.lesson04.teach.accept:
    title: پذیرفتن توصیه
    gloss: فکر خوبی است. همین کار را می‌کنم.
    note: '*فکر خوبی است* یعنی «فکر خوبی است». *همین کار را می‌کنم* یعنی «همین کار را می‌کنم». زمان حال *می‌کنم* برای گفتن تصمیمی که می‌گیرید هم به کار می‌رود. وقتی می‌خواهید توصیه را بپذیرید این دو جمله را بگویید.'
  prs.a2.unit32.lesson04.teach.thanks:
    title: تشکر برای توصیه
    gloss: از پیشنهادت ممنونم.
    note: '*از پیشنهادت ممنون* یعنی «از پیشنهادت ممنون». *پیشنهادت* همان *پیشنهاد* با *-ت* به معنی «تو» است. پایان دوستانه‌ای برای گفت‌وگو بعد از هر توصیه است.'
  prs.a2.unit32.lesson04.teach.decline:
    title: گفتن اینکه نمی‌توانید
    gloss: نمی‌توانم، چون وقت ندارم.
    note: 'وقتی نمی‌توانید توصیه را انجام دهید، همین را بگویید و دلیلش را بیاورید: *نمی‌توانم، چون وقت ندارم* یعنی «نمی‌توانم، چون وقت ندارم». *می‌توانم* یعنی «می‌توانم» و *نمی‌توانم* یعنی «نمی‌توانم». دلیل بعد از *چون* می‌آید.'
  prs.a2.unit32.lesson04.teach.maybe:
    title: توصیهٔ ملایم‌تر با شاید و التزامی بودن
    gloss: شاید بهتر باشد استراحت کنی. شاید درست باشد.
    note: 'بعد از *شاید* وجه التزامی می‌آید. التزامی *بودن* این است: *باشم، باشی، باشد، باشیم، باشین، باشند*. پس *شاید بهتر باشد که استراحت کنی* یعنی «شاید بهتر باشد استراحت کنی»: توصیه‌ای بسیار ملایم. وقتی هنوز مطمئن نیستید می‌توانید به توصیه با *شاید درست باشد* (شاید درست باشد) جواب بدهید. *ممکن است درست باشد* (ممکن است درست باشد) تقریباً همین معنی را دارد.'
  prs.a2.unit32.lesson04.teach.agree:
    title: موافقت کردن
    gloss: درست است. همین کار را می‌کنم.
    note: '*درست است* یعنی «درست است». بعد از توصیه یعنی موافقید. همراه *همین کار را می‌کنم* یک «بله»ی روشن است.'
  prs.a2.unit32.lesson05.teach.three:
    title: سه
    gloss: سه
    note: '*سه* یعنی «سه». *سه روز* یعنی «سه روز». دکتر اغلب می‌گوید چند روز باید استراحت کنید.'
    example_gloss: سه روز در کابل بودم.
  prs.a2.unit32.lesson05.teach.said:
    title: او گفت
    gloss: او گفت
    note: '*گفت* ماضی *گفتن* برای «او» است. بعد از *گفت* جملهٔ کوتاهی می‌آید، مثل *داکتر گفت: ...* (دکتر گفت: ...).'
    example_gloss: 'او گفت: فردا می‌آیم.'
  prs.a2.unit32.lesson05.teach.please_wait:
    title: صبر کردن، حوصله داشتن
    gloss: صبر کردن، حوصله داشتن
    note: '*صبر کردن* یعنی «صبر کردن» یا «حوصله داشتن». *نباید صبر کنی* یعنی «نباید صبر کنی»، یعنی همان لحظه انجامش بده.'
    example_gloss: کمی صبر کن.
  prs.a2.unit32.lesson05.teach.dlg1_turn01:
    title: جمیله می‌گوید چه مشکلی دارد
    gloss: ذکریا، سرم درد می‌کند و شب‌ها خوب نمی‌خوابم. چه کار کنم؟
    note: جمیله مشکل را با *سرم درد می‌کند* و *خوب نمی‌خوابم* (خوب نمی‌خوابم) توضیح می‌دهد، بعد با *چه کار کنم؟* توصیه می‌خواهد.
  prs.a2.unit32.lesson05.teach.dlg1_turn02:
    title: ذکریا دو توصیه می‌کند
    gloss: بهتر است که پیش دکتر بروی. باید آب زیاد بخوری.
    note: ذکریا اول با عبارت ملایم *بهتر است که به داکتر بروی* شروع می‌کند، بعد با عبارت قاطع‌تر *باید آب زیاد بخوری*. او با دوستش حرف می‌زند، برای همین پایانه‌ی فعل *-ی* است.
  prs.a2.unit32.lesson05.teach.dlg1_turn03:
    title: جمیله می‌پذیرد و برای فردا برنامه می‌ریزد
    gloss: فکر خوبی است. فردا پیش دکتر می‌روم.
    note: 'جمیله با *فکر خوبی است* می‌پذیرد. او قصد دارد فردا برود: *فردا به داکتر می‌روم*؛ یعنی حال ساده همراه با قید زمان.'
  prs.a2.unit32.lesson05.teach.dlg1_turn04:
    title: ذکریا می‌گوید امروز برو
    gloss: پیشنهاد می‌کنم امروز بروی. نباید صبر کنی.
    note: 'ذکریا می‌گوید موضوع فوری است: *پیشنهاد می‌کنم که امروز بروی*، و با *نباید صبر کنی* اضافه می‌کند که معطل نکن. دقت کنید که او *به داکتر* را دوباره تکرار نمی‌کند، چون روشن است.'
  prs.a2.unit32.lesson05.teach.dlg1_turn05:
    title: جمیله موافقت می‌کند
    gloss: باشه، امروز می‌روم. ممنون.
    note: 'جمیله برنامه‌اش را به امروز تغییر می‌دهد: *امروز می‌روم*. او مؤدبانه با *ممنون* تمام می‌کند.'
  prs.a2.unit32.lesson05.teach.message:
    title: پیامی بعد از رفتن پیش دکتر
    gloss: 'سلام ذکریا. از پیشنهادت ممنون. امروز پیش دکتر رفتم. دکتر گفت: بهتر است که سه روز استراحت کنی و باید دارو بخوری. نباید شب‌ها دیر بخوابی. فردا به مدرسه نمی‌روم.'
    note: 'جمیله پیام بعدی را می‌نویسد. دکتر با همان سه الگو توصیه کرده است: *بهتر است که* (سه روز استراحت)، *باید* (خوردن دارو) و *نباید* (دیر نخوابیدن). توصیه‌ها بعد از *گفت:* با همان شکل نقل می‌شوند.'
  prs.a2.unit32.lesson06.teach.start:
    title: شروع کردن
    gloss: شروع کردن، آغاز کردن
    note: '*شروع کردن* یعنی آغاز کردن. *از امروز شروع می‌کنم* یعنی از امروز شروع می‌کنم؛ قولی که بعد از پذیرفتن توصیه می‌دهید.'
    example_gloss: از فردا شروع می‌کنم.
  prs.a2.unit32.lesson06.teach.only:
    title: فقط، تنها
    gloss: فقط
    note: '*فقط* یعنی تنها یا صرفاً. *فقط چیزهای مهم* یعنی فقط چیزهای مهم.'
    example_gloss: من فقط یک کتاب دارم.
  prs.a2.unit32.lesson06.teach.dlg2_turn01:
    title: ذکریا مشکلش را می‌گوید
    gloss: جمیله، پولم کم است و هر ماه زیاد خرج می‌کنم. چه کار کنم؟
    note: 'ذکریا مشکل را در دو بخش می‌گوید: *پولم کم است* و *هر ماه زیاد خرج می‌کنم*. بعد توصیه می‌خواهد: *چه کار کنم؟*.'
  prs.a2.unit32.lesson06.teach.dlg2_turn02:
    title: جمیله پس‌انداز کردن را پیشنهاد می‌کند
    gloss: پیشنهاد می‌کنم هر ماه کمی پول پس‌انداز کنی.
    note: جمیله از الگوی مؤدبانه‌ی *پیشنهاد می‌کنم که* به‌همراه فعل التزامی *پس‌انداز کنی* استفاده می‌کند. *کمی* یعنی مقدار کم.
  prs.a2.unit32.lesson06.teach.dlg2_turn03:
    title: ذکریا می‌گوید نمی‌تواند
    gloss: فکر خوبی است، ولی نمی‌توانم. همه‌چیز گران است.
    note: 'ذکریا می‌گوید ایده خوب است، ولی دلیل می‌آورد که چرا نمی‌تواند عمل کند: *همه چیز گران است* (همه‌چیز گران است).'
  prs.a2.unit32.lesson06.teach.dlg2_turn04:
    title: جمیله می‌گوید چه چیزهایی نخرد
    gloss: پس نباید چیزهای گران بخری. بهتر است فقط چیزهای مهم بخری.
    note: 'جمیله توصیه را عوض می‌کند: *نباید چیزهای گران بخری* (یک قاعده‌ی قاطع) و *بهتر است که فقط چیزهای مهم بخری* (یک پیشنهاد ملایم).'
  prs.a2.unit32.lesson06.teach.dlg2_turn05:
    title: ذکریا موافقت می‌کند و شروع می‌کند
    gloss: درست است. از امروز شروع می‌کنم. ممنون.
    note: 'ذکریا با *درست است* موافقت می‌کند و قول می‌دهد: *از امروز شروع می‌کنم*.'
exercises:
  prs.a2.unit32.lesson01.exercise01.recognize_go_doctor:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: بهتر است پیش دکتر بروی
    distractors:
    - پیش دکتر رفتی
    - پیش دکتر خواهم رفت
    - دکتر اینجاست
    accepted_answers:
    - value: بهتر است پیش دکتر بروی
      status: correct
    feedback: '*بهتر است که به داکتر بروی* یعنی بهتر است پیش دکتر بروی: *بهتر است که* به‌همراه فعل التزامی *بروی*.'
  prs.a2.unit32.lesson01.exercise02.recognize_rest:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: بهتر است استراحت کنی
    distractors:
    - بعد از کار استراحت می‌کنم
    - الان داری استراحت می‌کنی
    - باقی‌اش بهتر است
    accepted_answers:
    - value: بهتر است استراحت کنی
      status: correct
    feedback: '*بهتر است که استراحت کنی* یعنی بهتر است استراحت کنی. *کنی* همان امر *کن* به‌علاوه‌ی *ی* است.'
  prs.a2.unit32.lesson01.exercise03.match_subjunctive:
    instruction: هر کلمهٔ دری را با معنی‌اش جفت کنید.
    accepted_answers:
    - value:
        بروم: که من بروم
        بروی: که تو بروی (به دوست)
        برود: که او برود
        برویم: که ما برویم
        بروین: که شما بروید (رسمی یا جمع)
        بروند: که آن‌ها بروند
        داکتر: دکتر
        دوا: دارو
        مریض: بیمار
      status: correct
    feedback: 'فقط پایانه با شخص عوض می‌شود: *-م* من، *-ی* تو (دوست)، *-د* او، *-یم* ما، *-ین* شما (رسمی یا جمع)، *-ند* آن‌ها.'
    pairs:
    - left: بروم
      right: که من بروم
    - left: بروی
      right: که تو بروی (به دوست)
    - left: برود
      right: که او برود
    - left: برویم
      right: که ما برویم
    - left: بروین
      right: که شما بروید (رسمی یا جمع)
    - left: بروند
      right: که آن‌ها بروند
    - left: داکتر
      right: دکتر
    - left: دوا
      right: دارو
    - left: مریض
      right: بیمار
  prs.a2.unit32.lesson01.exercise04.order_sleep_early:
    instruction: 'کلمه‌ها را مرتب کنید تا بگویید: بهتر است زود بخوابی.'
    accepted_answers:
    - value:
      - بهتر
      - است
      - که
      - زود
      - بخوابی
      status: correct
    feedback: در *بهتر است که زود بخوابی* فعل التزامی *بخوابی* آخر جمله می‌آید.
  prs.a2.unit32.lesson01.exercise05.complete_medicine:
    instruction: 'جمله را کامل کنید: بهتر است دارو را بخوری.'
    accepted_answers:
    - value: بخوری
      status: correct
    feedback: '*بخوری* همان امر *بخور* به‌علاوه‌ی *ی* است. *بهتر است که دوا بخوری* یعنی بهتر است دارو را بخوری.'
  prs.a2.unit32.lesson01.exercise06.translate_go_doctor:
    instruction: 'با دوستتان صحبت می‌کنید؛ به دری (افغانستان) ترجمه کنید: بهتر است پیش دکتر بروی.'
    accepted_answers:
    - value: بهتر است که به داکتر بروی.
      status: correct
    - value: بهتر است که پیش داکتر بروی.
      status: correct
    - value: بهتر است که تو به داکتر بروی.
      status: correct
    - value: بهتر است که تو پیش داکتر بروی.
      status: correct
    - value: بهتر است به داکتر بروی.
      status: correct
    - value: بهتر است پیش داکتر بروی.
      status: correct
    - value: بهتر است تو به داکتر بروی.
      status: correct
    - value: بهتر است تو پیش داکتر بروی.
      status: correct
    feedback: '*بهتر است که به داکتر بروی.* *که* و *تو* اختیاری هستند، و برای «پیش دکتر» *پیش داکتر* هم گفته می‌شود.'
  prs.a2.unit32.lesson02.exercise01.recognize_must_study:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: باید هر روز درس بخوانی
    distractors:
    - هر روز درس خواندی
    - بهتر است هر روز درس بخوانی
    - من هر روز درس می‌خوانم
    accepted_answers:
    - value: باید هر روز درس بخوانی
      status: correct
    feedback: '*باید هر روز درس بخوانی* یعنی باید هر روز درس بخوانی: *باید* به‌همراه فعل التزامی *بخوانی*.'
  prs.a2.unit32.lesson02.exercise02.recognize_must_not:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: نباید دیر بخوابی
    distractors:
    - باید دیر بخوابی
    - نخوابیدی
    - بهتر است دیر بخوابی
    accepted_answers:
    - value: نباید دیر بخوابی
      status: correct
    feedback: '*نباید دیر بخوابی* یعنی نباید دیر بخوابی: *نباید* منفی «باید» است و *بخوابی* فعل التزامی.'
  prs.a2.unit32.lesson02.exercise03.match_must:
    instruction: هر کلمهٔ دری را با معنی‌اش جفت کنید.
    accepted_answers:
    - value:
        باید بروم: من باید بروم
        باید بروی: تو باید بروی (به دوست)
        باید برود: او باید برود
        باید برویم: ما باید برویم
        باید بروین: شما باید بروید (رسمی یا جمع)
        باید بروند: آن‌ها باید بروند
        نباید بروی: تو نباید بروی
        درس: درس
        امتحان: امتحان
        زود: زود
        دیر: دیر
      status: correct
    feedback: '*باید* ثابت می‌ماند؛ پایانه‌ی فعل التزامی شخص را نشان می‌دهد. *نباید* منفی آن است: نباید.'
    pairs:
    - left: باید بروم
