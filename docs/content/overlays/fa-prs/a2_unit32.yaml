course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستان در سطح پیش‌متوسطه: دادن و پاسخ دادن به توصیه‌های ساده دربارهٔ سلامتی، درس و پول با فعل التزامی. توصیهٔ ملایم با بهتر است که، توصیهٔ قاطع با باید و نباید، پیشنهاد مؤدبانه با پیشنهاد می‌کنم که، پرسیدن اینکه چه کار کنید، و پذیرفتن، تردید کردن یا رد کردن توصیه.'
