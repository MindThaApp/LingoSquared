  prs.a2.unit18.lesson04.teach.turn06:
    title: کریم تأیید می‌کند که رسید دارد
    gloss: بله، این هم رسیدش.
    note: '*اینه* در گفتار محاوره‌ای یعنی «بفرمایید، این هم»؛ موقع دادن چیزی به کسی گفته می‌شود و در درس ۱۱ آمده بود.'
  prs.a2.unit18.lesson04.teach.turn07:
    title: فروشنده دو گزینه پیشنهاد می‌کند
    gloss: فروشنده می‌تواند آن را تعویض کند یا پولش را پس بدهد. کدام را ترجیح می‌دهد؟
