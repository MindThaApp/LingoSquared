  prs.a2.unit18.lesson04.teach.turn01:
    title: فروشنده به کریم خوشامد می‌گوید
    gloss: فروشنده می‌پرسد چه کمکی از دستش برمی‌آید.
    note: یک احوال‌پرسی رسمی مثل جملهٔ کارمند اداره در درس ۹ (*بفرمایین، چه خدمتی...*)، اینجا با *کمکی* («کمک») به‌جای *خدمتی*.
  prs.a2.unit18.lesson04.teach.turn02:
    title: کریم مشکل را می‌گوید
    gloss: کریم می‌گوید بخاری‌ای که دیروز خریده، خراب است.
    note: دقیقاً همان جملهٔ درس دوم تکرار شده است.
