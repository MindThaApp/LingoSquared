teaching:
  prs.a1.unit09.lesson01.teach.shanbe_yakshanbe:
    title: شنبه و یکشنبه
    gloss: شنبه، یکشنبه
    note: شنبه اولین روز هفته در افغانستان است و یکشنبه بعد از آن می‌آید.
    example_gloss:
    - امروز شنبه است.
    - فردا یکشنبه است.
  prs.a1.unit09.lesson01.teach.doshanbe_seshanbe:
    title: دوشنبه و سه‌شنبه
    gloss: دوشنبه، سه‌شنبه
    note: دوشنبه و سه‌شنبه در اصل یعنی «روز دوم» و «روز سوم» بعد از شنبه.
    example_gloss:
    - دوشنبه کلاس دارم.
    - سه‌شنبه وقت ملاقات دارم.
  prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe:
    title: چهارشنبه و پنجشنبه
    gloss: چهارشنبه، پنجشنبه
    note: چهارشنبه و پنجشنبه همان الگوی «روز چهارم» و «روز پنجم» را ادامه می‌دهند.
    example_gloss:
    - چهارشنبه کار می‌کنم.
    - پنجشنبه می‌بینمتان.
  prs.a1.unit09.lesson01.teach.jomeh:
    title: جمعه
    gloss: جمعه
    note: جمعه تعطیلی هفتگی در افغانستان است، مثل جمعه در ایران.
    example_gloss: جمعه تعطیل است.
  prs.a1.unit09.lesson01.teach.tarikh_word:
    title: تاریخ
    gloss: تاریخ
    note: تاریخ واژه‌ی کلی برای تاریخ تقویمی است.
    example_gloss: تاریخ امروز چنده؟
  prs.a1.unit09.lesson01.teach.va_word:
    title: و
    gloss: و
    note: و حرف ربط رایجی است که در سراسر این واحد به کار می‌رود.
    target_text: و (حرف ربط)
  prs.a1.unit09.lesson01.teach.weekend_note:
    title: تعطیلی هفتگی
    gloss: جمعه تعطیلی هفتگی است.
    note: در افغانستان هم مثل ایران، تعطیلی اصلی هفته *جمعه* است؛ پنجشنبه هم اغلب نیم‌روز کاری است.
  prs.a1.unit09.lesson02.teach.hamal:
    title: حمل (ماه اول)
    gloss: فروردین، ماه اول تقویم هجری شمسی (تقریباً اواخر مارس تا آوریل)
    note: حمل سال خورشیدی افغانستان را شروع می‌کند و با عید نوروز هم‌زمان است.
    example_gloss: فروردین ماه اول سال است.
  prs.a1.unit09.lesson02.teach.sawr:
    title: ثور (ماه دوم)
    gloss: اردیبهشت، ماه دوم (تقریباً آوریل تا مه)
    note: ثور بعد از حمل می‌آید.
    example_gloss: در اردیبهشت هوا خوب است.
  prs.a1.unit09.lesson02.teach.jawza:
    title: جوزا (ماه سوم)
    gloss: خرداد، ماه سوم (تقریباً مه تا ژوئن)
    note: جوزا بعد از ثور می‌آید.
    example_gloss: من در خرداد به دنیا آمدم.
  prs.a1.unit09.lesson02.teach.calendar_note:
    title: تقویم افغانستان
    gloss: افغانستان از تقویم هجری شمسی (خورشیدی) استفاده می‌کند.
    note: این همان تقویم خورشیدی‌ای است که در ایران هم استفاده می‌شود و با تقویم میلادی و هجری قمری فرق دارد. فقط نام ماه‌ها فرق می‌کند.
  prs.a1.unit09.lesson03.teach.what_day_today:
    title: پرسیدن اینکه امروز چه روزی است
    gloss: امروز چه روزیه؟
    note: امروز چند شنبه است؟ یعنی «امروز چندمین شنبه است»؛ روش طبیعی برای پرسیدن روز هفته.
  prs.a1.unit09.lesson03.teach.today_word:
    title: امروز
    gloss: امروز
    note: امروز یعنی روزی که در آن هستیم.
    example_gloss: امروز چندم است؟
  prs.a1.unit09.lesson04.teach.give_full_date:
    title: گفتن تاریخ کامل
    gloss: امروز پنجشنبه، پانزدهم فروردین است.
    note: امروز پنجشنبه، پانزدهم حمل است روز هفته، تاریخ ترتیبی و نام ماه را کنار هم می‌آورد.
  prs.a1.unit09.lesson05.teach.which_day_meeting:
    title: پرسیدن روز یک رویداد
    gloss: جلسه چه روزیه؟
    note: جلسه کدام روز است؟ برای پرسیدن روز یک رویداد از کدام (کدام‌یک) استفاده می‌کند.
  prs.a1.unit09.lesson05.teach.which_date:
    title: پرسیدن تاریخ مشخص
    gloss: دوشنبه چندم فروردین است؟
    note: دوشنبه چندم حمل است؟ می‌پرسد دوشنبه چندمِ ماه است.
  prs.a1.unit09.lesson06.teach.nozdahom:
    title: نوزدهم
    gloss: نوزدهم
    note: '*نوزدهم* شکل ترتیبی عدد نوزده است و مثل *پانزدهم* (پانزدهم) ساخته می‌شود.'
    example_gloss: امروز نوزدهم است.
  prs.a1.unit09.lesson06.teach.turn01:
    title: همایون درباره روز جلسه می‌پرسد
    gloss: همایون از بشیر می‌پرسد جلسه چه روزی است.
    note: جلسه کدام روز است؟ را پیش‌تر در درس‌های قبل دیده‌اید.
  prs.a1.unit09.lesson06.teach.turn02:
    title: بشیر جواب می‌دهد
    gloss: بشیر می‌گوید فکر می‌کند دوشنبه است.
    note: فکر می‌کنم (فکر می‌کنم) جواب را ملایم‌تر می‌کند، چون بشیر کاملاً مطمئن نیست.
  prs.a1.unit09.lesson06.teach.turn03:
    title: همایون تاریخ دقیق را می‌پرسد
    gloss: همایون می‌پرسد دوشنبه چندم فروردین است.
    note: دوشنبه چندم حمل است؟ را پیش‌تر در درس‌های قبل دیده‌اید.
  prs.a1.unit09.lesson06.teach.turn04:
    title: بشیر تاریخ دقیق را می‌گوید
    gloss: بشیر می‌گوید دوشنبه نوزدهم فروردین است.
    note: '*دوشنبه نوزدهم حمل است* روز، تاریخ ترتیبی و نام ماه را با همان الگوی قبلی کنار هم می‌آورد.'
  prs.a1.unit09.lesson06.teach.turn05:
    title: همایون درباره جمعه می‌پرسد
    gloss: همایون موافقت می‌کند و می‌پرسد بشیر جمعه وقت دارد یا نه.
    note: وقت داری؟ (وقت داری؟) روش طبیعی برای پرسیدن از آزاد بودن کسی است.
  prs.a1.unit09.lesson06.teach.turn06:
    title: بشیر می‌گوید سرش شلوغ است
    gloss: بشیر می‌گوید نه، جمعه کار دارد.
    note: مصروف استم (سرم شلوغ است) دلیل نشدنِ جمعه را توضیح می‌دهد.
  prs.a1.unit09.lesson06.teach.turn07:
    title: همایون دوشنبه را تأیید می‌کند
    gloss: همایون می‌گوید مشکلی نیست و دوشنبه بشیر را می‌بیند.
    note: مشکل نیست (مشکلی نیست) تداخل برنامه را آرام می‌کند و بعد قرار اصلی دوشنبه تأیید می‌شود.
