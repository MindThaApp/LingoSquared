teaching:
  prs.a2.unit33.lesson01.teach.gym:
    title: باشگاه
    gloss: باشگاه ورزشی
    note: '*باشگاه* یعنی باشگاه ورزشی. برای رفتن به آن از *به* استفاده می‌کنید: *به باشگاه می‌روم* یعنی «به باشگاه می‌روم».'
    example_gloss: باشگاه نزدیک خانه است.
  prs.a2.unit33.lesson01.teach.run:
    title: دویدن
    gloss: دویدن
    note: '*دویدن* یعنی دویدن. ریشه‌ی مضارع آن *دو* است، پس *می‌دوم* یعنی «می‌دوم». *دویدن* مثل هر مصدر دیگر به *-ن* ختم می‌شود و در این درس همین شکل با *-ن* را بعد از *به* به کار می‌برید.'
    example_gloss: من هر صبح می‌دوم.
  prs.a2.unit33.lesson01.teach.exercise:
    title: ورزش کردن
    gloss: ورزش کردن
    note: '*ورزش کردن* یعنی ورزش کردن. این فعل دو بخشی است: *ورزش* همان‌طور جلوی فعل می‌ماند و فقط *کردن* صرف می‌شود، مثل *ورزش می‌کنم* (ورزش می‌کنم) و *ورزش کردم* (ورزش کردم).'
    example_gloss: من هر روز ورزش می‌کنم.
  prs.a2.unit33.lesson01.teach.half_hour:
    title: نیم ساعت
    gloss: نیم ساعت
    note: '*نیم ساعت* یعنی نصف ساعت. *نیم* یعنی نصف و قبل از اسم می‌آید، مثل *نیم ساعت* و *نیم ساعت ورزش*.'
    example_gloss: هر صبح نیم ساعت ورزش می‌کنم.
  prs.a2.unit33.lesson01.teach.habit:
    title: عادت
    gloss: عادت
    note: '*عادت* یعنی عادت. کل این درس درباره‌ی عادت‌هاست: شروع یک عادت خوب، ترک یک عادت بد، تلاش برای حفظ یک عادت و فراموش کردن یک عادت.'
    example_gloss: ورزش یک عادت خوب است.
  prs.a2.unit33.lesson01.teach.start_noun:
    title: 'شروع کردن یک کار: چیزی + را + شروع کردن'
    gloss: ورزش را شروع کردم. دویدن را شروع کردی. او کار را شروع کرد.
    note: 'برای اینکه بگویید چیزی را شروع کرده‌اید، آن چیز را قبل از *را* بگذارید و بعد از *شروع کردن* استفاده کنید: *ورزش را شروع کردم* یعنی «ورزش را شروع کردم». این فعل مثل *ورزش کردن* دو بخشی است، پس فقط *کردن* صرف می‌شود: *شروع کردم، شروع کردی، شروع کرد، شروع کردیم، شروع کردین، شروع کردند*. چیزی که شروع می‌کنید می‌تواند اسم باشد (*کار*) یا مصدر (*دویدن*). ضمیر اختیاری است، چون شناسه فاعل را نشان می‌دهد.'
  prs.a2.unit33.lesson01.teach.month_ago:
    title: یک ماه پیش ورزش را شروع کردم
    gloss: یک ماه پیش ورزش را شروع کردم.
    note: '*پیش* بعد از کلمه‌ی زمان یعنی «قبل»: *یک ماه پیش* یعنی یک ماه قبل و *دو هفته پیش* یعنی دو هفته قبل. کلمه‌ی زمان معمولاً اول جمله می‌آید.'
  prs.a2.unit33.lesson01.teach.start_to:
    title: 'شروع کردن یک کار: به + مصدر + شروع کردن'
    gloss: شروع به دویدن کردم. شروع به ورزش کردن کردی. او شروع به خواندن کرد.
    note: 'برای اینکه بگویید شروع به انجام کاری کرده‌اید، *به* و مصدر (فعل با پایان *-ن*) را قبل از *شروع کردن* بگذارید: *به دویدن شروع کردم* یعنی «شروع به دویدن کردم». در فعل دو بخشی هر دو بخش در مصدر می‌مانند: *به ورزش کردن شروع کردم*. ترتیب *شروع کردم به دویدن* را هم می‌شنوید و همان معنی را دارد. این دو الگو را مقایسه کنید: *ورزش را شروع کردم* یک چیز را نام می‌برد و *به ورزش کردن شروع کردم* یک عمل را.'
  prs.a2.unit33.lesson01.teach.read_start:
    title: او دو هفته پیش شروع به کتاب خواندن کرد
    gloss: او دو هفته پیش شروع به کتاب خواندن کرد.
    note: '*خواندن* یعنی خواندن (و درس خواندن). مصدر *خواندن* بعد از *به* می‌آید و مفعولش *کتاب* می‌تواند بعد از آن بیاید: *به خواندن کتاب شروع کرد*.'
  prs.a2.unit33.lesson02.teach.sleep:
    title: خوابیدن، به رختخواب رفتن
    gloss: خوابیدن، به رختخواب رفتن
    note: '*خوابیدن* یعنی خوابیدن یا به رختخواب رفتن. ریشه‌ی حال آن *خواب* است: *می‌خوابم* یعنی «می‌خوابم». *شب‌ها* به عنوان قید زمان یعنی شب‌ها یا عصرها.'
    example_gloss: شب‌ها زود می‌خوابم.
  prs.a2.unit33.lesson02.teach.try:
    title: تلاش کردن
    gloss: تلاش کردن، کوشیدن
    note: '*کوشش* یعنی تلاش و *کوشش کردن* یعنی تلاش کردن. این فعل دو بخشی است: *کوشش می‌کنم* یعنی «تلاش می‌کنم» و *کوشش کردم* یعنی «تلاش کردم». کاری که می‌خواهید انجام دهید بعد از *که* و به شکل التزامی می‌آید.'
    example_gloss: تلاش می‌کنم زود بیدار شوم.
  prs.a2.unit33.lesson02.teach.subjunctive:
    title: 'التزامی: ب + ریشه‌ی حال + شناسه'
    gloss: که بدوم، که بخوابم، که بخوانم، که بخورم، که بروم، که ببینم؛ که ورزش کنم، که بیدار شوم
    note: 'التزامی شکلی از فعل است که برای کاری به کار می‌برید که شروع می‌کنید، سعی می‌کنید انجام دهید یا فراموش می‌کنید. آن را از *باید* می‌شناسید، مثل *باید بروم*. برای ساختن آن، *ب-* را جلوی ریشه‌ی حال بگذارید و شناسه‌های *-م، -ی، -د، -یم، -ین، -ند* را اضافه کنید. برای *دویدن* (ریشه‌ی *دو*): *بدوم، بدوی، بدود، بدویم، بدوین، بدوند*. فعل‌های دیگر: *خوابیدن* می‌شود *بخوابم*، *خواندن* می‌شود *بخوانم*، *خوردن* می‌شود *بخورم*، *رفتن* می‌شود *بروم*، *دیدن* می‌شود *ببینم*. فعل دو بخشی *ب-* نمی‌گیرد: بخش اول می‌ماند و فقط *کردن* یا *شدن* تغییر می‌کند، پس *ورزش کنم* و *بیدار شوم*.'
  prs.a2.unit33.lesson02.teach.che_pattern:
    title: شروع کردن و کوشش کردن با که
    gloss: شروع کردم بدوم. تلاش می‌کنم زود بخوابم. تلاش کردم ورزش کنم.
    note: 'بعد از *شروع کردن* و *کوشش کردن*، *که* و یک فعل التزامی می‌آید. *شروع کردم که بدوم* همان معنی *به دویدن شروع کردم* را دارد. *کوشش می‌کنم که زود بخوابم* یعنی «تلاش می‌کنم زود بخوابم». فاعل معمولاً یکی است، پس شناسه‌ی فعل التزامی همان شخص فعل اصلی را نشان می‌دهد: *کوشش کردم که بروم*، *کوشش کردی که بروی*، *کوشش کرد که برود*. زمان را فعل اول مشخص می‌کند؛ خود التزامی زمان مستقل ندارد.'
  prs.a2.unit33.lesson02.teach.negative_subj:
    title: 'التزامی منفی: ن به جای ب'
    gloss: تلاش می‌کنم شیرینی نخورم. تلاش می‌کنم دیر نخوابم.
    note: 'برای گفتن «تلاش می‌کنم که ... نکنم»، *ن-* را به جای *ب-* بگذارید: *بخورم* می‌شود *نخورم*، *بخوابم* می‌شود *نخوابم*، *بروم* می‌شود *نروم*. *نبخورم* نمی‌نویسند. فعل دو بخشی *ن-* را روی بخش فعلی‌اش می‌گیرد: *ورزش نکنم*.'
  prs.a2.unit33.lesson02.teach.he_tried:
    title: او تلاش کرد زود بیدار شود
    gloss: او تلاش کرد زود بیدار شود.
    note: 'شناسه‌ی فعل التزامی فاعل را نشان می‌دهد: *شود* یعنی او، پس *او کوشش کرد که زود بیدار شود* یعنی «او تلاش کرد زود بیدار شود».'
  prs.a2.unit33.lesson02.teach.we_started:
    title: ما شروع کردیم هر روز ورزش کنیم
    gloss: ما شروع کردیم هر روز ورزش کنیم.
    note: 'شناسه‌ی *-یم* در هر دو فعل یعنی «ما»: *شروع کردیم* و *ورزش کنیم*.'
  prs.a2.unit33.lesson03.teach.quit:
    title: ترک کردن
    gloss: ترک کردن
    note: '*ترک کردن* یعنی ترک کردن یک عادت. این فعل دو بخشی است: *ترک کردم* یعنی «ترک کردم» و *ترک می‌کنم* یعنی «ترک می‌کنم».'
    example_gloss: او شیرینی خوردن را ترک کرد.
  prs.a2.unit33.lesson03.teach.sweets:
    title: شیرینی
    gloss: شیرینی، کیک، تنقلات شیرین
    note: '*شیرینی* یعنی شیرینی‌جات و کیک. مثال خوبی از عادتی است که مردم می‌خواهند ترکش کنند.'
    example_gloss: من شیرینی دوست دارم.
  prs.a2.unit33.lesson03.teach.for_hours:
    title: ساعت‌ها
    gloss: ساعت‌ها
    note: '*ساعت‌ها* جمع *ساعت* است و یعنی ساعت‌ها، مدت طولانی. برای صحبت از وقتی که پای صفحه‌ی نمایش می‌گذرانید به کار می‌رود: *ساعت‌ها ویدیو دیدم* یعنی «ساعت‌ها ویدیو دیدم».'
    example_gloss: او ساعت‌ها ویدیو می‌بیند.
  prs.a2.unit33.lesson03.teach.sometimes:
    title: گاهی
    gloss: گاهی
    note: '*گاهی* یعنی گاهی اوقات. اول جمله یا قبل از فعل می‌آید و ضد *همیشه* و *هرگز* است.'
    example_gloss: گاهی ویدیو می‌بینم.
  prs.a2.unit33.lesson03.teach.quit_pattern:
    title: 'ترک یک عادت: عادت + را + ترک کردن'
    gloss: خوردن شیرینی را ترک کردم. دیر خوابیدن را ترک کردی. او ویدیو دیدن را ترک کرد.
    note: 'برای اینکه بگویید عادتی را ترک کرده‌اید، عادت را قبل از *را* بگذارید و بعد *ترک کردن* را بیاورید. عادت یک عبارت مصدری است: *شیرینی خوردن*، *دیر خوابیدن*، *ویدیو دیدن*. الگو همان *ورزش را شروع کردم* است: چیز، *را*، بعد فعل. می‌توانید بگویید *عادت بد را ترک کردم* هم.'
  prs.a2.unit33.lesson03.teach.no_longer:
    title: 'دیگر نه: دیگر + فعل منفی'
    gloss: دیگر شیرینی نمی‌خورم. دیگر ویدیو نمی‌بینم. دیگر دیر نمی‌خوابم.
    note: '*دیگر* با فعل منفی یعنی «دیگر ... نه»: *دیگر شیرینی نمی‌خورم* یعنی «دیگر شیرینی نمی‌خورم». این جمله وضعیت فعلی را بعد از ترک کردن چیزی توصیف می‌کند. در داستانی در گذشته می‌توانید *دیگر* را با ماضی ساده‌ی منفی بیاورید: *از آن روز دیگر شیرینی نخوردم* یعنی «از آن روز دیگر شیرینی نخوردم». در زمان حال، *ترک کردم* تصمیم را می‌گوید و *دیگر نمی‌خورم* نتیجه را.'
  prs.a2.unit33.lesson03.teach.from_today:
    title: از امروز دیگر دیر نمی‌خوابم
    gloss: از امروز دیگر دیر نمی‌خوابم.
    note: '*از امروز* یعنی از امروز. با *دیگر* و فعل منفی، شروع یک عادت تازه را اعلام می‌کند.'
  prs.a2.unit33.lesson03.teach.bad_habit:
    title: یک عادت بد را ترک کردم
    gloss: یک عادت بد را ترک کردم.
    note: '*عادت بد* یعنی عادت بد. صفت *بد* بعد از اسم می‌آید.'
  prs.a2.unit33.lesson03.teach.less_phone:
    title: شب‌ها کمتر از تلفن استفاده می‌کنم
    gloss: شب‌ها کمتر از تلفن استفاده می‌کنم.
    note: '*کمتر* یعنی کمتر. کم کردن زمان پای صفحه‌ی نمایش راه دیگری برای کنار گذاشتن یک عادت است: ترک نمی‌کنید، فقط کمتر انجامش می‌دهید.'
  prs.a2.unit33.lesson04.teach.forget:
    title: فراموش کردن
    gloss: فراموش کردن
    note: '*فراموش کردن* یعنی فراموش کردن. این فعل دو بخشی است: *فراموش کردم* یعنی «فراموش کردم» و *فراموش نکردم* یعنی «فراموش نکردم».'
    example_gloss: ببخشید، فراموش کردم.
  prs.a2.unit33.lesson04.teach.why_not_come:
    title: چرا دیروز نیامدی؟
    gloss: چرا دیروز نیامدی؟
    note: '*نیامدی* ماضی ساده‌ی منفی *آمدن* برای یک دوست است: نیامدی. *چرا* دلیل را می‌پرسد.'
  prs.a2.unit33.lesson04.teach.forget_pattern:
    title: 'فراموش کردن کاری: فراموش کردن که + التزامی'
    gloss: فراموش کردم تلفن کنم. فراموش کردم کتابم را بیاورم. فراموش کردم زود بخوابم.
    note: 'برای اینکه بگویید انجام کاری را فراموش کرده‌اید، *فراموش کردن* را با *که* و یک فعل التزامی به کار ببرید: *فراموش کردم که تیلفون کنم* یعنی «فراموش کردم تلفن کنم»، پس تماس انجام نشد. این همان التزامی درس‌های قبل است و فاعل معمولاً یکی است. *فراموش کردم* گذشته است، پس درباره‌ی لحظه‌ای صحبت می‌کنید که گذشته؛ التزامی بعد از *که* زمان مستقل ندارد.'
  prs.a2.unit33.lesson04.teach.not_forget:
    title: فراموش نکردم که
    gloss: فراموش نکردم تلفن کنم. فراموش نکردم کتابم را بیاورم.
    note: '*فراموش نکردم* منفی را روی *کردم* می‌گذارد: فراموش نکردم. بعد از آن، کار انجام شده است: *فراموش نکردم که کتابم را بیاورم* یعنی «فراموش نکردم کتابم را بیاورم»، پس آوردمش. مقایسه کنید با *فراموش کردم که کتابم را بیاورم* (فراموش کردم کتابم را بیاورم، پس نیاوردم).'
  prs.a2.unit33.lesson04.teach.four_verbs:
    title: چهار فعل، چهار الگو
    gloss: شروع کردم. ترک کردم. تلاش کردم. فراموش کردم.
    note: 'هر چهار فعل به *کردن* ختم می‌شوند، پس شناسه‌ها همیشه یکی است (*کردم، کردی، کرد، کردیم، کردین، کردند*). آنچه بعد می‌آید فرق می‌کند. *شروع کردن*: چیز و *را*، یا *به* و مصدر، یا *که* و التزامی. *ترک کردن*: عادت و *را*. *کوشش کردن*: *که* و التزامی. *فراموش کردن*: *که* و التزامی. برای اینکه بگویید دیگر کاری را انجام نمی‌دهید، از *دیگر* و فعل حال منفی استفاده کنید.'
  prs.a2.unit33.lesson04.teach.sorry_forgot_sleep:
    title: فراموش کردم زود بخوابم
    gloss: فراموش کردم زود بخوابم.
    note: این جمله‌ای است که وقتی به خاطر عادتی که رعایتش نکرده‌اید مشکلی پیش آمده، می‌گویید.
  prs.a2.unit33.lesson05.teach.read_book:
    title: کتاب خواندن
    gloss: کتاب خواندن
    note: '*کتاب خواندن* یعنی کتاب خواندن. حال آن *کتاب می‌خوانم* است؛ *خواندن* یعنی درس خواندن هم.'
    example_gloss: هر شب نیم ساعت کتاب می‌خوانم.
  prs.a2.unit33.lesson05.teach.two_weeks:
    title: دو هفته پیش شروع به کتاب خواندن کردم
    gloss: دو هفته پیش شروع به کتاب خواندن کردم.
    note: 'الگو همان درس اول است: کلمه‌ی زمان با *پیش*، بعد *به* و مصدر، بعد *شروع کردم*.'
  prs.a2.unit33.lesson05.teach.dlg_turn01:
    title: نجیبه از یاسین می‌پرسد کی شروع کرده
    gloss: یاسین، ورزش را کی شروع کردی؟
    note: '*ورزش را کی شروع کردی؟* از الگوی چیز + *را* + *شروع کردی* استفاده می‌کند. *کی* زمان را می‌پرسد. گوینده‌ها دوست هستند، برای همین از *تو* استفاده می‌کنند.'
  prs.a2.unit33.lesson05.teach.dlg_turn02:
    title: یاسین می‌گوید کی و چقدر
    gloss: یک ماه پیش. حالا هر صبح نیم ساعت در باشگاه می‌دوم.
    note: '*یک ماه پیش* نقطه‌ی شروع است. *حالا هر صبح نیم ساعت در باشگاه می‌دوم* عادتی است که حالا دارد.'
  prs.a2.unit33.lesson05.teach.dlg_turn03:
    title: نجیبه درباره‌ی شیرینی می‌پرسد
    gloss: خیلی خوب! شیرینی هم می‌خوری؟
    note: '*خیلی خوب* واکنشی دوستانه است. *شیرینی هم می‌خوری؟* می‌پرسد که آیا او شیرینی هم می‌خورد.'
  prs.a2.unit33.lesson05.teach.dlg_turn04:
    title: یاسین می‌گوید شیرینی را ترک کرده
    gloss: نه، خوردن شیرینی را ترک کردم. دیگر شیرینی نمی‌خورم.
    note: '*شیرینی خوردن را ترک کردم* تصمیم را می‌گوید و *دیگر شیرینی نمی‌خورم* نتیجه را.'
  prs.a2.unit33.lesson05.teach.dlg_turn05:
    title: نجیبه درباره‌ی ویدیو می‌پرسد
    gloss: شب‌ها ویدیو می‌بینی؟
    note: '*شب‌ها* قید زمان برای «هر شب» است و *می‌بینی* یعنی «می‌بینی» یا «تماشا می‌کنی».'
  prs.a2.unit33.lesson05.teach.dlg_turn06:
    title: یاسین می‌گوید تلاش می‌کند کمتر ببیند
    gloss: بله، ولی تلاش می‌کنم کمتر ببینم.
    note: '*کوشش می‌کنم که کمتر ببینم* از *کوشش کردن* با التزامی *ببینم* استفاده می‌کند. او ویدیو را ترک نکرده: دارد تلاش می‌کند.'
  prs.a2.unit33.lesson05.teach.khalida_message:
    title: پیامی درباره‌ی عادت‌های تازه
    gloss: سلام نجیبه. دو هفته پیش شروع به کتاب خواندن کردم. هر شب نیم ساعت کتاب می‌خوانم. ویدیو دیدن را ترک کردم، پس دیگر شب‌ها ویدیو نمی‌بینم. تلاش می‌کنم زود بخوابم. دیروز فراموش کردم به تو تلفن کنم. خالده
    note: 'یک پیام کوتاه نوشتاری که هر چهار الگو را به کار می‌برد: شروع کردن (*به خواندن کتاب شروع کردم*)، ترک کردن (*ویدیو دیدن را ترک کردم*)، تلاش کردن (*کوشش می‌کنم که زود بخوابم*) و فراموش کردن (*فراموش کردم که تیلفون کنم*). نویسنده فرد دیگری است، نه یاسین.'
  prs.a2.unit33.lesson06.teach.late_wake:
    title: صبح دیر بیدار شدم
    gloss: صبح دیر از خواب بیدار شدم.
    note: '*بیدار شدن* یعنی از خواب بیدار شدن. *دیر* یعنی دیر و *زود* یعنی زود: *صبح زود بیدار شدم* یعنی صبح زود از خواب بیدار شدم.'
  prs.a2.unit33.lesson06.teach.every_night:
    title: سعی می‌کنم هر شب زود بخوابم
    gloss: سعی می‌کنم هر شب زود بخوابم.
    note: '*هر شب* یعنی هر شب. قید زمان مثل *هر شب* می‌تواند قبل یا بعد از *زود* بیاید؛ اینجا بعد از *که* آمده است.'
  prs.a2.unit33.lesson06.teach.dlg_turn01:
    title: یاسین می‌پرسد نجیبه چرا نیامده است
    gloss: نجیبه، دیروز چرا به باشگاه نیامدی؟
    note: '*چرا* یعنی «چرا» و *نیامدی* یعنی «نیامدی». *به باشگاه* یعنی «به باشگاه».'
  prs.a2.unit33.lesson06.teach.dlg_turn02:
    title: نجیبه می‌گوید چه چیزی را فراموش کرده است
    gloss: یادم رفت زود بخوابم، برای همین صبح دیر بیدار شدم.
    note: '*فراموش کردم که زود بخوابم* دلیل است و *بخوابم* وجه التزامی است. *پس* (برای همین) نتیجه را می‌آورد: *صبح دیر بیدار شدم*.'
  prs.a2.unit33.lesson06.teach.dlg_turn03:
    title: یاسین درباره‌ی امروز می‌پرسد
    gloss: امروز می‌آیی؟
    note: '*می‌آیی* یعنی «می‌آیی» برای یک دوست. در دری، حال ساده همراه با قید زمان می‌تواند به آینده‌ی نزدیک هم اشاره کند.'
  prs.a2.unit33.lesson06.teach.dlg_turn04:
    title: نجیبه می‌گوید می‌آید و می‌گوید سعی می‌کند چه کار کند
    gloss: بله، امروز ساعت شش می‌آیم. سعی می‌کنم هر شب زود بخوابم.
    note: '*امروز ساعت شش می‌آیم* حال ساده همراه با قید زمان است. *کوشش می‌کنم که هر شب زود بخوابم* عادت تازه‌ای است که می‌خواهد نگه دارد.'
  prs.a2.unit33.lesson06.teach.dlg_turn05:
    title: واکنش یاسین
    gloss: عالیه!
    note: '*خیلی خوب* واکنشی کوتاه و دوستانه است.'
exercises:
  prs.a2.unit33.lesson01.exercise01.recognize_started_running:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: شروع کردم به دویدن
    distractors:
    - دویدن را ترک کردم
    - فردا می‌دوم
    - دیروز دویدم
    accepted_answers:
    - value: شروع کردم به دویدن
      status: correct
    feedback: '*به دویدن شروع کردم* یعنی «شروع کردم به دویدن»: *به* به‌اضافه‌ی مصدر *دویدن* و بعد *شروع کردم*.'
  prs.a2.unit33.lesson01.exercise02.recognize_started_exercise_month:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: یک ماه پیش ورزش را شروع کردم
    distractors:
    - ماه بعد ورزش را شروع می‌کنم
    - یک ماه پیش ورزش را ترک کردم
    - یک ماه است که ورزش می‌کنم
    accepted_answers:
    - value: یک ماه پیش ورزش را شروع کردم
      status: correct
    feedback: '*یک ماه پیش* یعنی «یک ماه پیش» و *ورزش را شروع کردم* یعنی «ورزش را شروع کردم».'
  prs.a2.unit33.lesson01.exercise03.match_start_words:
    instruction: هر واژه یا عبارت دری را به معنی‌اش وصل کنید.
    accepted_answers:
    - value:
        باشگاه: باشگاه ورزشی
        دویدن: دویدن
        ورزش کردن: ورزش کردن
        نیم ساعت: نیم ساعت
        عادت: عادت
        شروع کردم: شروع کردم
        شروع کردی: شروع کردی (به دوست)
        شروع کرد: او شروع کرد
        یک ماه پیش: یک ماه پیش
      status: correct
    feedback: 'فقط پایان فعل *کردن* با شخص تغییر می‌کند: *شروع کردم* (شروع کردم)، *شروع کردی* (شروع کردی)، *شروع کرد* (او شروع کرد).'
    pairs:
    - left: باشگاه
      right: باشگاه ورزشی
    - left: دویدن
      right: دویدن
    - left: ورزش کردن
      right: ورزش کردن
    - left: نیم ساعت
      right: نیم ساعت
    - left: عادت
      right: عادت
    - left: شروع کردم
      right: شروع کردم
    - left: شروع کردی
      right: شروع کردی (به دوست)
    - left: شروع کرد
      right: او شروع کرد
    - left: یک ماه پیش
      right: یک ماه پیش
  prs.a2.unit33.lesson01.exercise04.order_started_exercising:
    instruction: 'کلمه‌ها را مرتب کنید تا بگویید: شروع کردم به ورزش کردن.'
    accepted_answers:
    - value:
      - به
      - ورزش
      - کردن
      - شروع
      - کردم
      status: correct
    - value:
      - شروع
      - کردم
      - به
      - ورزش
      - کردن
      status: correct
    feedback: '*به ورزش کردن شروع کردم.* مصدر *ورزش کردن* بعد از *به* می‌آید. ترتیب *شروع کردم به ورزش کردن* هم درست است.'
  prs.a2.unit33.lesson01.exercise05.complete_started_running:
    instruction: 'جمله را کامل کنید: یک ماه پیش شروع کردم به دویدن.'
    accepted_answers:
    - value: شروع
      status: correct
    feedback: '*شروع* بخش اول فعل مرکب *شروع کردن* است: *به دویدن شروع کردم*.'
  prs.a2.unit33.lesson01.exercise06.translate_started_running:
    instruction: 'با استفاده از شروع کردن به دری ترجمه کنید: شروع کردم به دویدن.'
    accepted_answers:
    - value: به دویدن شروع کردم.
      status: correct
    - value: من به دویدن شروع کردم.
      status: correct
    - value: شروع کردم به دویدن.
      status: correct
    - value: من شروع کردم به دویدن.
      status: correct
    - value: دویدن را شروع کردم.
      status: correct
    - value: من دویدن را شروع کردم.
      status: correct
    - value: شروع کردم که بدوم.
      status: correct
    - value: من شروع کردم که بدوم.
      status: correct
    feedback: '*به دویدن شروع کردم.* یعنی «شروع کردم به دویدن». *دویدن را شروع کردم* (چیز موردنظر و *را*) و *شروع کردم که بدوم* (با *که*، درس بعد) هم درست‌اند.'
  prs.a2.unit33.lesson02.exercise01.recognize_started_that_run:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: شروع کردم بدوم
    distractors:
    - یادم رفت بدوم
    - دویدن را ترک کردم
    - می‌خواهم فردا بدوم
    accepted_answers:
    - value: شروع کردم بدوم
      status: correct
    feedback: '*شروع کردم که بدوم* یعنی «شروع کردم بدوم»: *که* به‌اضافه‌ی وجه التزامی *بدوم*.'
  prs.a2.unit33.lesson02.exercise02.recognize_try_sleep_early:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: سعی می‌کنم زود بخوابم
    distractors:
    - فراموش کردم زود بخوابم
    - می‌خواهم تمام روز بخوابم
    - زود خوابیدن را ترک کردم
    accepted_answers:
    - value: سعی می‌کنم زود بخوابم
      status: correct
    feedback: '*کوشش می‌کنم* یعنی «سعی می‌کنم» و *که زود بخوابم* یعنی «زود بخوابم».'
  prs.a2.unit33.lesson02.exercise03.match_subjunctives:
    instruction: هر فعل التزامی دری را با معنایش جفت کنید.
    accepted_answers:
    - value:
        بدوم: که بدوم
        بخوابم: که بخوابم
        بخوانم: که بخوانم
        بخورم: که بخورم
        بروم: که بروم
        ببینم: که ببینم
        ورزش کنم: که ورزش کنم
        بیدار شوم: که بیدار شوم
      status: correct
    feedback: 'هر کدام از *ب-* به‌اضافه‌ی ریشه‌ی حال و *-م* ساخته شده است. فعل‌های مرکب *ب-* ندارند: *ورزش کنم*، *بیدار شوم*.'
    pairs:
    - left: بدوم
      right: که بدوم
    - left: بخوابم
      right: که بخوابم
    - left: بخوانم
      right: که بخوانم
    - left: بخورم
      right: که بخورم
    - left: بروم
      right: که بروم
    - left: ببینم
      right: که ببینم
    - left: ورزش کنم
      right: که ورزش کنم
    - left: بیدار شوم
      right: که بیدار شوم
  prs.a2.unit33.lesson02.exercise04.order_try_sleep_early:
    instruction: 'کلمه‌ها را مرتب کنید تا بگویید: سعی می‌کنم زود بخوابم.'
    accepted_answers:
    - value:
      - کوشش
      - می‌کنم
      - که
      - زود
      - بخوابم
      status: correct
    feedback: '*کوشش می‌کنم که زود بخوابم.* فعل التزامی بعد از *که* و در آخر می‌آید.'
  prs.a2.unit33.lesson02.exercise05.complete_started_exercise_that:
    instruction: 'جمله را کامل کنید: شروع کردم ورزش کنم.'
    accepted_answers:
    - value: کنم
      status: correct
    feedback: '*کنم* وجه التزامی *کردن* است: *ورزش کنم*. فعل مرکب *ب-* نمی‌گیرد.'
  prs.a2.unit33.lesson02.exercise06.translate_try_wake_early:
    instruction: 'با استفاده از کوشش کردن به دری ترجمه کنید: سعی می‌کنم زود بیدار شوم.'
    accepted_answers:
    - value: کوشش می‌کنم که زود بیدار شوم.
      status: correct
    - value: کوشش می‌کنم زود بیدار شوم.
      status: correct
    - value: سعی می‌کنم که زود بیدار شوم.
      status: correct
    - value: سعی می‌کنم زود بیدار شوم.
      status: correct
    - value: من کوشش می‌کنم که زود بیدار شوم.
      status: correct
    - value: من کوشش می‌کنم زود بیدار شوم.
      status: correct
    - value: من سعی می‌کنم که زود بیدار شوم.
      status: correct
    - value: من سعی می‌کنم زود بیدار شوم.
      status: correct
    feedback: '*کوشش می‌کنم که زود بیدار شوم.* *کوشش* و *که* با هم می‌آیند؛ *من* اختیاری است.'
  prs.a2.unit33.lesson03.exercise01.recognize_quit_sweets:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: شیرینی خوردن را ترک کردم
    distractors:
    - شروع کردم به خوردن شیرینی
    - یادم رفت شیرینی بخورم
    - شیرینی دوست دارم
    accepted_answers:
    - value: شیرینی خوردن را ترک کردم
      status: correct
    feedback: '*شیرینی خوردن را ترک کردم* یعنی «شیرینی خوردن را ترک کردم»: عادت، بعد *را*، بعد *ترک کردم*.'
  prs.a2.unit33.lesson03.exercise02.recognize_no_longer_video:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: دیگر ویدیو نمی‌بینم
    distractors:
    - هر روز ویدیو می‌بینم
    - بعداً ویدیو می‌بینم
    - یادم رفت ویدیو ببینم
    accepted_answers:
    - value: دیگر ویدیو نمی‌بینم
      status: correct
    feedback: '*دیگر* با فعل منفی *نمی‌بینم* یعنی «دیگر ویدیو نمی‌بینم».'
  prs.a2.unit33.lesson03.exercise03.match_stopping_words:
    instruction: هر واژه یا عبارت دری را به معنی‌اش وصل کنید.
    accepted_answers:
    - value:
        ترک کردم: ترک کردم، کنار گذاشتم
        دیگر: دیگر (نه)
        شیرینی: شیرینی
        ساعت‌ها: ساعت‌ها
        گاهی: گاهی
        ویدیو: ویدئو
        عادت بد: یک عادت بد
        تیلفون: گوشی
        کمتر: کمتر
      status: correct
    feedback: '*ترک کردم* یعنی «ترک کردم»، *دیگر* یعنی «دیگر» و *کمتر* یعنی «کمتر»: سه راه برای گفتن اینکه کاری را متفاوت انجام می‌دهید.'
    pairs:
    - left: ترک کردم
      right: ترک کردم، کنار گذاشتم
    - left: دیگر
      right: دیگر (نه)
    - left: شیرینی
      right: شیرینی
    - left: ساعت‌ها
      right: ساعت‌ها
