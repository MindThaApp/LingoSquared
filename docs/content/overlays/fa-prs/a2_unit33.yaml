course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستان در سطح پیش‌متوسطه: گفتن اینکه چه کاری را شروع کرده‌اید، ترک کرده‌اید، سعی کرده‌اید انجام دهید یا یادتان رفته انجام دهید. شروع کردن با مفعول و را، با به و مصدر یا با که و فعل التزامی؛ ترک کردن یک عادت با ترک کردن و دیگر؛ سعی کردن و فراموش کردن با که و فعل التزامی.'
