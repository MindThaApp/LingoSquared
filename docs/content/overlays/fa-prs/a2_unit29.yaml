teaching:
  prs.a2.unit29.lesson01.teach.library:
    title: کتابخانه
    gloss: کتابخانه
    note: '*کتابخانه* یعنی کتابخانه. مقصد را با *به* می‌گویید: *به کتابخانه می‌روم* یعنی «به کتابخانه می‌روم». موضوع این واحد قوانین یک مرکز اجتماعی است که کتابخانه، استخر و باشگاه ورزشی دارد.'
    example_gloss: کتابخانه نزدیک خانه‌ام است.
  prs.a2.unit29.lesson01.teach.pool:
    title: استخر
    gloss: استخر
    note: '*حوض آب‌بازی* یعنی استخر. این همان واژه‌ای است که در واحد استخر یاد گرفتید.'
    example_gloss: من هر هفته به استخر می‌روم.
  prs.a2.unit29.lesson01.teach.gym:
    title: باشگاه
    gloss: باشگاه، باشگاه ورزشی
    note: '*باشگاه* یعنی باشگاه ورزشی. این همان واژه‌ای است که در واحد باشگاه یاد گرفتید.'
    example_gloss: باشگاه ساعت شش باز است.
  prs.a2.unit29.lesson01.teach.rules:
    title: قوانین
    gloss: 'قوانین (مفرد: قانون)'
    note: '*قانون* یعنی قانون یا مقررات و *قانون‌ها* یعنی قوانین. مکان با *-ی* بعد از آن می‌آید: *قانون‌های کتابخانه* یعنی قوانین کتابخانه. نشانهٔ جمع «‌ها» با نیم‌فاصله جدا از اسم نوشته می‌شود.'
    example_gloss: قوانین باشگاه در دفتر است.
  prs.a2.unit29.lesson01.teach.membership:
    title: کارت عضویت
    gloss: کارت عضویت
    note: '*کارت عضویت* کارتی است که با آن می‌توانید کتاب امانت بگیرید یا از باشگاه استفاده کنید. *کارت* واژه‌ای است که از قبل می‌دانید.'
    example_gloss: کارت عضویت من در خانه است.
  prs.a2.unit29.lesson01.teach.sports_shoes:
    title: کفش ورزشی
    gloss: کفش ورزشی
    note: '*کفش* یعنی کفش و *ورزشی* یعنی مخصوص ورزش، از *ورزش*. پس *کفش ورزشی* یعنی کفش ورزشی.'
    example_gloss: کفش ورزشی من نو است.
  prs.a2.unit29.lesson01.teach.must:
    title: 'باید: باید به‌علاوهٔ وجه التزامی'
    gloss: باید بروم، باید بروی (به دوست)، او باید برود، باید برویم، باید بروید (محترمانه یا جمع)، آن‌ها باید بروند
    note: '*باید* یعنی «باید» و هرگز تغییر نمی‌کند. شخص در فعلی که بعد از آن می‌آید دیده می‌شود و آن فعل در وجه التزامی است: *بروم، بروی، برود، برویم، بروین، بروند*. شناسه‌ها مثل حال ساده‌اند، یعنی *-م، -ی، -د، -یم، -ین، -ند*، اما فعل به‌جای *می‌* با *ب-* شروع می‌شود. این شکل را قبلاً بعد از *می‌خواهم* دیده‌اید (*می‌خواهم یک تکت بگیرم*). ترتیب جمله این است: اول *باید* و آخر فعل: *من باید به کتابخانه بروم*. ضمیر *من* اختیاری است، چون شناسه شخص را نشان می‌دهد.'
  prs.a2.unit29.lesson01.teach.formation:
    title: وجه التزامی چطور ساخته می‌شود
    gloss: 'می‌روم: بروم. می‌آیم: بیایم. می‌کنم: کنم. می‌گیرم: بگیرم. می‌دهم: بدهم. می‌برم: ببرم.'
    note: 'از حال ساده، *می‌* را بردارید و *ب-* را اول فعل بگذارید: *می‌روم* می‌شود *بروم*، *می‌گیرم* می‌شود *بگیرم*، *می‌دهم* می‌شود *بدهم* و *می‌برم* می‌شود *ببرم*. دو فعل استثنا هستند. *آمدن* می‌شود *بیایم* (نه *بآیم*) و *کردن* بدون *ب-* می‌شود *کنم* (*بکنم* هم شنیده می‌شود و درست است). در فعل‌های دوکلمه‌ای فقط بخش فعلی تغییر می‌کند: *پس بدهم*، *کار کنم*، *دوش بگیرم*. شخص‌های دیگر همین شناسه‌ها را می‌گیرند: *بگیری، بگیرد، بگیریم، بگیرین، بگیرند*.'
  prs.a2.unit29.lesson01.teach.wear:
    title: پوشیدن
    gloss: پوشیدن، به تن کردن
    note: '*پوشیدن* یعنی پوشیدن لباس و کفش. وجه التزامی آن *بپوشم، بپوشی، بپوشد، بپوشیم، بپوشین، بپوشند* است، پس *باید کفش بپوشم* یعنی «باید کفش بپوشم».'
    example_gloss: در باشگاه باید کفش نو بپوشم.
  prs.a2.unit29.lesson01.teach.more_verbs:
    title: باید با فعل‌های بیشتر
    gloss: باید کارت بگیرم. باید دوش بگیری. باید کتاب را پس بدهیم. باید کفش ورزشی بپوشید. آن‌ها باید به باشگاه بیایند.
    note: 'الگو برای همهٔ فعل‌ها یکی است: *باید* و بعد وجه التزامی با شناسهٔ درست. *دوش گرفتن* یعنی دوش گرفتن و *پس دادن* یعنی برگرداندن، پس *باید کتاب را پس بدهیم* یعنی «باید کتاب را پس بدهیم». چیزی که می‌دهید یا می‌گیرید پیش از فعل می‌آید و اگر معین باشد با *را*: *کتاب را*.'
  prs.a2.unit29.lesson01.teach.sentence:
    title: باید به کتابخانه بروم
    gloss: باید به کتابخانه بروم.
    note: این الگوی کل این واحد است. *باید* نشان می‌دهد که قانون یا وظیفه‌ای در کار است و *بروم* شخص را نشان می‌دهد. همهٔ افراد در مرکز از همین قوانین پیروی می‌کنند.
  prs.a2.unit29.lesson02.teach.quiet:
    title: کم‌حرف
    gloss: ساکت، آرام
    note: '*ساکت* یعنی ساکت یا آرام. *ساکت باشین* یعنی «لطفاً ساکت باشید» (به چند نفر یا به کسی که به او احترام می‌گذارید).'
    example_gloss: کتابخانه ساکت است.
  prs.a2.unit29.lesson02.teach.be_paradigm:
    title: 'باید باشم: باشم'
    gloss: باید ساکت باشم، باید ساکت باشی، او باید ساکت باشد، باید ساکت باشیم، باید ساکت باشید (محترمانه یا جمع)، آن‌ها باید ساکت باشند
    note: 'وجه التزامی *بودن* این‌هاست: *باشم، باشی، باشد، باشیم، باشین، باشند*. بعد از *باید* می‌گوید که کسی باید در حالتی باشد: *باید ساکت باشین* یعنی «باید ساکت باشید». *باشد* و *باشین* را قبلاً دیده‌اید و *باشم، باشی، باشیم* مجموعه را کامل می‌کنند.'
  prs.a2.unit29.lesson02.teach.food:
    title: غذا
    gloss: غذا، وعدهٔ غذا
    note: '*غذا* یعنی خوراک یا وعدهٔ غذایی. *غذا خوردن* یعنی غذا خوردن، و *غذا بخورم* شکل التزامی آن است.'
    example_gloss: ما در خانه غذا می‌خوریم.
  prs.a2.unit29.lesson02.teach.cigarette:
    title: سیگار
    gloss: سیگار
    note: '*سگرت* یعنی سیگار. *سگرت کشیدن* یعنی سیگار کشیدن، با فعل *کشیدن*.'
    example_gloss: او هر روز سیگار می‌کشد.
  prs.a2.unit29.lesson02.teach.forbidden:
    title: ممنوع
    gloss: ممنوع، غیرمجاز
    note: '*ممنوع* یعنی ممنوع و چیزی است که روی تابلوها می‌خوانید: *غذا خوردن ممنوع است* یعنی خوردن غذا مجاز نیست. اول کار به شکل مصدر می‌آید (*کشیدن، خوردن، گرفتن*)، بعد *ممنوع است*.'
    example_gloss: سیگار کشیدن در باشگاه ممنوع است.
  prs.a2.unit29.lesson02.teach.loud:
    title: بلند، با صدای بلند
    gloss: 'بلند، با صدای بلند (همچنین: قدبلند، مرتفع)'
    note: 'وقتی بگویید کسی چطور حرف می‌زند، *بلند* یعنی با صدای بلند: *بلند صحبت کردن* یعنی بلند حرف زدن. *صحبت کردن* فعلی است که قبلاً یاد گرفته‌اید.'
    example_gloss: او بلند حرف می‌زند.
  prs.a2.unit29.lesson02.teach.must_not:
    title: 'نباید: «نباید» به‌اضافهٔ فعل التزامی'
    gloss: من نباید غذا بخورم، تو نباید غذا بخوری، او نباید غذا بخورد، ما نباید غذا بخوریم، شما نباید غذا بخورید (محترمانه یا جمع)، آن‌ها نباید غذا بخورند
    note: '*نباید* منفی *باید* است و یعنی «نباید». *ن* به *باید* می‌چسبد و فعلِ بعد از آن مثبت می‌ماند: *نباید غذا بخورین* یعنی «نباید غذا بخورید». فعل همان شناسه‌های التزامیِ بعد از *باید* را می‌گیرد. *نباید* برای قانون یا توصیهٔ جدی است، برای همین کارکنان کتابخانه یا استخر از آن استفاده می‌کنند.'
  prs.a2.unit29.lesson02.teach.forbidden_same:
    title: دو راه برای گفتن اینکه چیزی مجاز نیست
    gloss: غذا خوردن ممنوع است. نباید غذا بخورید.
    note: '*ممنوع است* و *نباید* یک معنی دارند. تابلو مصدر را به کار می‌برد: *غذا خوردن ممنوع است*. کسی که با شما صحبت می‌کند *نباید* را با فعل التزامی می‌گوید: *نباید غذا بخورین*.'
  prs.a2.unit29.lesson02.teach.no_eat_library:
    title: در کتابخانه نباید غذا بخورید
    gloss: در کتابخانه نباید غذا بخورید.
    note: اول مکان می‌آید، بعد *نباید*، بعد چیز مورد نظر و فعل در آخر.
  prs.a2.unit29.lesson02.teach.quiet_library:
    title: در کتابخانه باید ساکت باشید
    gloss: در کتابخانه باید ساکت باشید.
    note: '*باید ساکت باشین* قانونی است که می‌گوید چه کار کنید، ولی *نباید* می‌گوید چه کار نکنید.'
  prs.a2.unit29.lesson02.teach.phone_forms:
    title: نباید با افراد مختلف
    gloss: من نباید تلفنی صحبت کنم. تو نباید تلفنی صحبت کنی (به دوست). شما نباید تلفنی صحبت کنید (محترمانه یا جمع).
    note: 'در فعل دوبخشی مثل *صحبت کردن* فقط بخش فعل تغییر می‌کند: *صحبت کنم، صحبت کنی، صحبت کنین*. به دوست می‌گویید *نباید ... کنی* و به چند نفر یا کسی که به او احترام می‌گذارید *نباید ... کنین*.'
  prs.a2.unit29.lesson02.teach.no_phone_gym:
    title: در باشگاه نباید تلفنی صحبت کنید
    gloss: در باشگاه نباید تلفنی صحبت کنید.
    note: '*با تیلفون صحبت کردن* یعنی تلفنی صحبت کردن. *صحبت کنین* شکل التزامی *صحبت کردن* برای *شما* است.'
  prs.a2.unit29.lesson03.teach.here:
    title: اینجا
    gloss: اینجا
    note: '*اینجا* یعنی اینجا. *آنجا* را قبلاً یاد گرفته‌اید: *اینجا* همان نزدیک است.'
    example_gloss: کتابخانه اینجاست.
  prs.a2.unit29.lesson03.teach.permission:
    title: اجازه
    gloss: اجازه
    note: '*اجازه* یعنی اجازه. *اجازه دارم* یعنی «اجازه دارم» و *اجازه ندارم* یعنی «اجازه ندارم». برای دیگران می‌گویید *اجازه دارین* (اجازه دارید) یا *اجازه ندارین* (اجازه ندارید).'
    example_gloss: شما اینجا اجازه دارید.
  prs.a2.unit29.lesson03.teach.photo:
    title: عکس
    gloss: عکس
    note: '*عکس* یعنی عکس. *عکس گرفتن* یعنی عکس گرفتن، با فعل *گرفتن*.'
    example_gloss: عکس‌های من توی گوشی‌ام است.
  prs.a2.unit29.lesson03.teach.ask_allowed:
    title: اجازه هست؟ «اجازه دارم» به‌اضافهٔ فعل التزامی
    gloss: می‌توانم اینجا عکس بگیرم؟ می‌توانم کتاب را به خانه ببرم؟ می‌توانم از تلفن استفاده کنم؟
    note: 'برای پرسیدن اینکه اجازه دارید کاری بکنید، *اجازه دارم* و بعد فعل التزامی را بگویید: *اجازه دارم اینجا عکس بگیرم؟* یعنی «می‌توانم اینجا عکس بگیرم؟». برای مؤدب بودن با *ببخشین* شروع کنید. شخص در فعلِ بعد از *اجازه دارم* مشخص می‌شود، پس برای شخص دیگر هر دو را عوض می‌کنید: *اجازه دارین عکس بگیرین* یعنی «اجازه دارید عکس بگیرید».'
  prs.a2.unit29.lesson03.teach.can_paradigm:
    title: 'توانستن: می‌توانم'
    gloss: من می‌توانم، تو می‌توانی (به دوست)، او می‌تواند، ما می‌توانیم، شما می‌توانید (محترمانه یا جمع)، آن‌ها می‌توانند
    note: '*می‌توانم* یعنی «می‌توانم». بین *می* و *توانم* نیم‌فاصله می‌آید. شکل‌ها این‌هاست: *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. بعد از آن فعل التزامی می‌آید: *می‌توانم اینجا عکس بگیرم؟* یعنی «می‌توانم اینجا عکس بگیرم؟». پرسیدن با *می‌توانم ...؟* راه دیگری برای اجازه گرفتن است و به اندازهٔ *اجازه دارم ...؟* رایج است.'
  prs.a2.unit29.lesson03.teach.answers:
    title: بله یا نه گفتن
    gloss: بله، اجازه دارید. بله، می‌توانید. نه، اجازه ندارید. نه، نمی‌توانید. نه، ممنوع است.
    note: 'با همان فعلی که از شما پرسیده شده جواب بدهید: به *اجازه دارم؟* می‌گویند *اجازه دارین / اجازه ندارین* و به *می‌توانم؟* می‌گویند *می‌توانین / نمی‌توانین*. وقتی قانون چیزی را ممنوع کرده، می‌توانید *ممنوع است* هم بگویید. می‌توانید *بلی، البته* (بله، البته) هم اضافه کنید.'
  prs.a2.unit29.lesson03.teach.polite_ask:
    title: ببخشید، می‌توانم این کتاب را به خانه ببرم؟
    gloss: ببخشید، می‌توانم این کتاب را به خانه ببرم؟
    note: '*ببخشین* سؤال را مؤدبانه شروع می‌کند. *به خانه ببرم* یعنی «به خانه ببرم».'
  prs.a2.unit29.lesson03.teach.answer_yes:
    title: بله، اجازه دارید
    gloss: بله، اجازه دارید.
    note: یک «بله»ی کوتاه و مؤدبانه به سؤالی با *اجازه دارم*.
  prs.a2.unit29.lesson03.teach.answer_no_photo:
    title: نه، عکس گرفتن اینجا ممنوع است
    gloss: نه، عکس گرفتن اینجا ممنوع است.
    note: 'یک «نه» که با *ممنوع* دلیلش را می‌گوید: *عکس گرفتن ممنوع است*.'
  prs.a2.unit29.lesson04.teach.no_need:
    title: 'لازم نیست: «لازم نیست» به‌اضافهٔ فعل التزامی'
    gloss: لازم نیست بیاییم. لازم نیست پول بدهید.
    note: '*لازم نیست* یعنی ضرورتی ندارد، پس مجبور نیستید. فعل بعد از آن التزامی است، درست مثل *باید*: *لازم نیست پول بدهین* یعنی «لازم نیست پول بدهید». *لازم نیست* چیزی را ممنوع نمی‌کند. فقط می‌گوید که به خودتان بستگی دارد.'
  prs.a2.unit29.lesson04.teach.no_need_formal:
    title: 'رسمی‌تر: ضرورت ندارد'
    gloss: آوردن کارت ضرورتی ندارد.
    note: '*ضرورت ندارد* همان معنی *لازم نیست* را دارد، ولی کمی رسمی‌تر است و روی اطلاعیه‌ها دیده می‌شود: *ضرورت ندارد کارت بیاورین* یعنی «آوردن کارت لازم نیست». فعل بعد از آن دوباره التزامی است. در گفتار روزمره معمولاً *لازم نیست* می‌گویند.'
  prs.a2.unit29.lesson04.teach.three_meanings:
    title: سه معنی متفاوت
    gloss: باید بیایم. نباید بیایم. لازم نیست بیایم.
    note: '*باید بیایم* یک وظیفه است، *نباید بیایم* یک ممنوعیت است و *لازم نیست بیایم* آزادی است: می‌توانم بیایم ولی مجبور نیستم. *نباید* و *لازم نیست* را با هم اشتباه نگیرید: *نباید* ممنوع می‌کند، *لازم نیست* نه.'
  prs.a2.unit29.lesson04.teach.towel:
    title: حوله
    gloss: حوله
    note: '*حوله* یعنی حوله. *حوله‌ام* یعنی حولهٔ من.'
    example_gloss: حولهٔ من در باشگاه است.
  prs.a2.unit29.lesson04.teach.everyone:
    title: همه
    gloss: همه
    note: '*همه* یعنی همه یا همگی. برای قانون‌هایی که برای همه است کاربرد دارد: *همه باید ساکت باشند* یعنی همه باید ساکت باشند.'
    example_gloss: همه در کتابخانه ساکت‌اند.
  prs.a2.unit29.lesson04.teach.bring:
    title: آوردن
    gloss: آوردن
    note: '*آوردن* یعنی آوردن. شکل التزامی: *بیاورم، بیاوری، بیاورد، بیاوریم، بیاورین، بیاورند*. *بیاورم* را قبلاً یاد گرفته‌اید: *لازم نیست حوله بیاوری* یعنی «لازم نیست حوله بیاوری».'
    example_gloss: فردا باید کتاب‌های من را بیاوری.
  prs.a2.unit29.lesson04.teach.towel_phrase:
    title: در باشگاه لازم نیست حوله بیاورید
    gloss: در باشگاه لازم نیست حوله بیاورید.
    note: 'باشگاه حولهٔ خودش را دارد، پس آوردن حوله لازم نیست. این مثال خوبی برای *لازم نیست* است: ممنوع نیست، فقط لازم نیست.'
  prs.a2.unit29.lesson04.teach.pay_phrase:
    title: لازم نیست پول بدهید
    gloss: لازم نیست پول بدهید.
    note: عضویت کتابخانه رایگان است، پس لازم نیست برایش پول بدهید. *پول بدهین* شکل التزامی *پول دادن* است.
  prs.a2.unit29.lesson05.teach.centre:
    title: مرکز
    gloss: مرکز
    note: '*مرکز اجتماعی* یعنی مرکز اجتماعی، ساختمانی با کتابخانه، استخر و باشگاه. *اجتماعی* را از درس‌های قبلی می‌شناسید.'
    example_gloss: مرکز اجتماعی نزدیک خانهٔ من است.
  prs.a2.unit29.lesson05.teach.rubbish:
    title: زباله، سطل
    gloss: 'زباله (و: سطل زباله)'
    note: '*زباله* یعنی زباله و *سطل* یعنی سطل زباله. هر دو کلمه از درس زباله هستند. فعل *انداختن* است، یعنی انداختن: *زباله را در سطل بیندازین* یعنی «زباله را در سطل بیندازید».'
    example_gloss: زباله در سطل است.
  prs.a2.unit29.lesson05.teach.run:
    title: دویدن
    gloss: دویدن
    note: '*دویدن* یعنی دویدن. شکل التزامی: *بدوم، بدوی، بدود، بدویم، بدوین، بدوند*، پس *نباید بدوین* یعنی «نباید بدوید».'
    example_gloss: در استخر نباید بدوید.
  prs.a2.unit29.lesson05.teach.throw:
    title: انداختن
    gloss: انداختن، ریختن توی
    note: '*انداختن* یعنی انداختن. شکل التزامی: *بیندازم، بیندازی، بیندازد، بیندازیم، بیندازین، بیندازند*، پس *باید زباله را در سطل بیندازین* یعنی «باید زباله را در سطل بیندازید».'
    example_gloss: زباله را در سطل بیندازید.
  prs.a2.unit29.lesson05.teach.library_turn01:
    title: شکیلا اجازه می‌خواهد کتاب را به خانه ببرد
    gloss: ببخشید، می‌توانم این کتاب را به خانه ببرم؟
    note: شکیلا تازه به کتابخانه آمده و با *اجازه دارم* و فعل التزامی *ببرم* می‌پرسد. او برای مؤدب بودن *ببخشین* می‌گوید.
  prs.a2.unit29.lesson05.teach.library_turn02:
    title: ناصر می‌گوید اول باید کارت بگیرد
    gloss: بله، ولی اول باید کارت عضویت بگیرید.
    note: 'ناصر کتابدار است، برای همین *شما* را با شکل *-ین* می‌گوید: *بگیرین*. *اول باید* یعنی «اول باید».'
  prs.a2.unit29.lesson05.teach.library_turn03:
    title: شکیلا دربارهٔ پرداخت می‌پرسد
    gloss: باید پول بدهم؟
    note: '*باید پول بدهم؟* سؤالی با *باید* است: «باید پول بدهم؟»'
  prs.a2.unit29.lesson05.teach.library_turn04:
    title: ناصر می‌گوید پرداخت لازم نیست، ولی کتاب را پس بدهید
    gloss: نه، لازم نیست پول بدهید. باید کتاب را تا دو هفته پس بدهید.
    note: '*لازم نیست* می‌گوید پرداخت لازم نیست. *باید کتاب را تا دو هفته پس بدهین* یک وظیفه است: کتاب باید ظرف دو هفته برگردد.'
  prs.a2.unit29.lesson05.teach.library_turn05:
    title: شکیلا دربارهٔ غذا خوردن می‌پرسد
    gloss: می‌توانم اینجا غذا بخورم؟
    note: '*می‌توانم ...؟* می‌پرسد که اجازه هست یا نه. فعل التزامی *بخورم* است.'
  prs.a2.unit29.lesson05.teach.library_turn06:
    title: ناصر می‌گوید غذا نخورید و ساکت باشید
    gloss: نه، نباید غذا بخورید. باید ساکت هم باشید.
    note: '*نباید غذا بخورین* یک ممنوعیت است و *باید ساکت هم باشین* یک وظیفه. *هم* یعنی «همچنین».'
  prs.a2.unit29.lesson05.teach.notice:
    title: اطلاعیه دربارهٔ قوانین مرکز
    gloss: 'اطلاعیه. قوانین مرکز اجتماعی. کتابخانه: در کتابخانه نباید غذا بخورید و باید ساکت باشید. استخر: قبل از رفتن به استخر باید دوش بگیرید. در استخر نباید بدوید. باشگاه: در باشگاه باید کفش ورزشی بپوشید. لازم نیست حوله بیاورید. زباله را باید در سطل بیندازید.'
    note: 'یک اطلاعیهٔ واقعی هر سه نوع قانون را با هم دارد: *باید* برای کاری که باید بکنید، *نباید* برای کاری که نباید بکنید و *لازم نیست* برای چیزی که ضروری نیست. اطلاعیه با همه صحبت می‌کند، برای همین از شکل *-ین* استفاده می‌کند.'
  prs.a2.unit29.lesson06.teach.first_time:
    title: بار اول
    gloss: بار اول
    note: '*اولین بار* یعنی «بار اول». *اولین* یعنی «اول» و *بار* یعنی «دفعه»، مثل *هر بار* (هر دفعه).'
    example_gloss: من برای اولین بار به این کتابخانه می‌روم.
  prs.a2.unit29.lesson06.teach.what_must_i:
    title: چه کار باید بکنم؟
    gloss: چه کار باید بکنم؟
    note: 'یک سؤال کاربردی: *چه* (چه چیز)، *باید* و فعل التزامی *بکنم*. هم *بکنم* و هم *کنم* درست است.'
  prs.a2.unit29.lesson06.teach.gym_turn01:
    title: نظیله می‌پرسد چه کار باید بکند
    gloss: فهیم، فردا برای اولین بار به باشگاه می‌روم. چه کار باید بکنم؟
    note: نازیلا با دوستش از *تو* استفاده می‌کند. *فردا ... می‌روم* همان زمان حال ساده است که برای فردا به کار رفته است.
  prs.a2.unit29.lesson06.teach.gym_turn02:
    title: فهیم یک وظیفه و یک چیزِ غیرضروری را می‌گوید
    gloss: باید کفش ورزشی بپوشی. لازم نیست حوله بیاوری، باشگاه حوله دارد.
    note: 'فهیم با دوستش صحبت می‌کند، برای همین فعل‌ها به *-ی* ختم می‌شوند: *بپوشی، بیاوری*. *باید* یعنی وظیفه و *لازم نیست* یعنی ضرورتی ندارد.'
  prs.a2.unit29.lesson06.teach.gym_turn03:
    title: نظیله دربارهٔ استخر می‌پرسد
    gloss: بعد از باشگاه می‌توانم به استخر بروم؟
    note: '*می‌توانم ... بروم؟* می‌پرسد که آیا اجازه دارد برود.'
  prs.a2.unit29.lesson06.teach.gym_turn04:
    title: فهیم بله می‌گوید، با دو قانون
    gloss: بله، ولی اول باید دوش بگیری. در استخر هم نباید بدوی.
    note: '*اول باید دوش بگیری* یک وظیفه است و *نباید بدوی* یک ممنوعیت. هر دو برای دوست از پایانهٔ *-ی* استفاده می‌کنند.'
  prs.a2.unit29.lesson06.teach.gym_turn05:
    title: نظیله از او تشکر می‌کند
    gloss: خوب است! ممنون.
    note: یک پایان کوتاه و دوستانه. *تشکر* یعنی «ممنونی».
exercises:
  prs.a2.unit29.lesson01.exercise01.recognize_must_go:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: باید بروم
    distractors:
    - من می‌خواهم بروم
    - من دیروز رفتم
    - من نمی‌خواهم بروم
    accepted_answers:
    - value: باید بروم
      status: correct
    feedback: '*من باید بروم* یعنی «من باید بروم»: *باید* به‌اضافهٔ فعل التزامی *بروم*.'
  prs.a2.unit29.lesson01.exercise02.recognize_get_card:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: شما باید کارت عضویت بگیرید
    distractors:
    - شما کارت عضویت دارید
    - شما باید کارت را پس بدهید
    - من باید کارت بگیرم
    accepted_answers:
    - value: شما باید کارت عضویت بگیرید
      status: correct
    feedback: '*بگیرین* فعل التزامی برای *شما* است، پس *شما باید کارت عضویت بگیرین* یعنی «شما باید کارت عضویت بگیرید».'
  prs.a2.unit29.lesson01.exercise03.match_places_and_must:
    instruction: هر واژه یا عبارت دری را به معنی‌اش وصل کنید.
    accepted_answers:
    - value:
        کتابخانه: کتابخانه
        حوض آب‌بازی: استخر
        باشگاه: باشگاه ورزشی
        قانون: قانون
        کارت عضویت: کارت عضویت
        کفش ورزشی: کفش ورزشی
        باید بروم: باید بروم
        باید بروی: باید بروی (به دوست)
        باید برود: او باید برود
        باید برویم: باید برویم
        باید بروین: باید بروید (محترمانه یا جمع)
        باید بروند: آن‌ها باید بروند
      status: correct
    feedback: 'فقط پایانهٔ فعل با شخص عوض می‌شود: *بروم* من، *بروی* تو (دوست)، *برود* او، *برویم* ما، *بروین* شما (محترمانه یا جمع)، *بروند* آن‌ها.'
    pairs:
    - left: کتابخانه
      right: کتابخانه
    - left: حوض آب‌بازی
      right: استخر
    - left: باشگاه
      right: باشگاه ورزشی
    - left: قانون
      right: قانون
    - left: کارت عضویت
      right: کارت عضویت
    - left: کفش ورزشی
      right: کفش ورزشی
    - left: باید بروم
      right: باید بروم
    - left: باید بروی
      right: باید بروی (به دوست)
    - left: باید برود
      right: او باید برود
    - left: باید برویم
      right: باید برویم
    - left: باید بروین
      right: باید بروید (محترمانه یا جمع)
    - left: باید بروند
      right: آن‌ها باید بروند
  prs.a2.unit29.lesson01.exercise04.order_go_library:
    instruction: 'کلمه‌ها را مرتب کنید تا بگویید: من باید به کتابخانه بروم.'
    accepted_answers:
    - value:
      - من
      - باید
      - به
      - کتابخانه
      - بروم
      status: correct
    - value:
      - من
      - به
      - کتابخانه
      - باید
      - بروم
      status: correct
    feedback: '*من باید به کتابخانه بروم.* فعل *بروم* آخر می‌آید. *به کتابخانه* را می‌شود قبل از *باید* هم گذاشت.'
  prs.a2.unit29.lesson01.exercise05.complete_go_gym:
    instruction: 'جمله را کامل کنید: ما باید به باشگاه برویم.'
    accepted_answers:
    - value: برویم
      status: correct
    feedback: '*برویم* فعل التزامی *رفتن* برای *ما* است. *ما باید به باشگاه برویم* یعنی «ما باید به باشگاه برویم».'
  prs.a2.unit29.lesson01.exercise06.translate_get_card:
    instruction: 'با استفاده از باید به دری ترجمه کنید: من باید کارت عضویت بگیرم.'
    accepted_answers:
    - value: من باید کارت عضویت بگیرم.
      status: correct
    - value: باید کارت عضویت بگیرم.
      status: correct
    - value: من باید یک کارت عضویت بگیرم.
      status: correct
    - value: باید یک کارت عضویت بگیرم.
      status: correct
    - value: من کارت عضویت باید بگیرم.
      status: correct
    - value: کارت عضویت باید بگیرم.
      status: correct
    feedback: '*من باید کارت عضویت بگیرم.* یعنی «من باید کارت عضویت بگیرم». گفتن *من* اختیاری است و *یک* قبل از *کارت* هم درست است.'
  prs.a2.unit29.lesson02.exercise01.recognize_no_eat:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: در کتابخانه نباید غذا بخورید
    distractors:
    - در کتابخانه باید غذا بخورید
    - در کتابخانه می‌توانید غذا بخورید
    - غذا در کتابخانه است
    accepted_answers:
    - value: در کتابخانه نباید غذا بخورید
      status: correct
    feedback: '*نباید غذا بخورین* یعنی «نباید غذا بخورید»: *نباید* به‌اضافهٔ فعل التزامی *بخورین*.'
  prs.a2.unit29.lesson02.exercise02.recognize_no_smoking:
    instruction: این تابلو چه معنایی دارد؟
    correct_option: سیگار کشیدن ممنوع است
    distractors:
    - سیگار کشیدن اینجا آزاد است
    - باید اینجا سیگار بکشید
    - سیگار نو است
    accepted_answers:
    - value: سیگار کشیدن ممنوع است
      status: correct
    feedback: '*ممنوع است* یعنی «ممنوع است»، پس *سگرت کشیدن ممنوع است* یعنی «سیگار کشیدن ممنوع است».'
  prs.a2.unit29.lesson02.exercise03.match_not_rules:
    instruction: هر واژه یا عبارت دری را به معنی‌اش وصل کنید.
    accepted_answers:
    - value:
        ساکت: کم‌حرف
        غذا: غذا
        سگرت: سیگار
        ممنوع: ممنوع
        بلند: بلند، با صدای بلند
        نباید غذا بخورم: نباید غذا بخورم
        نباید غذا بخوری: نباید غذا بخوری (به دوست)
        باید ساکت باشم: باید ساکت باشم
        باید ساکت باشین: باید ساکت باشید (محترمانه یا جمع)
        نباید غذا بخورند: آن‌ها نباید غذا بخورند
      status: correct
    feedback: '*باید* می‌گوید «باید» و *نباید* می‌گوید «نباید». پایانهٔ فعل همچنان شخص را نشان می‌دهد.'
    pairs:
    - left: ساکت
      right: کم‌حرف
    - left: غذا
      right: غذا
    - left: سگرت
      right: سیگار
    - left: ممنوع
      right: ممنوع
    - left: بلند
      right: بلند، با صدای بلند
    - left: نباید غذا بخورم
      right: نباید غذا بخورم
    - left: نباید غذا بخوری
      right: نباید غذا بخوری (به دوست)
