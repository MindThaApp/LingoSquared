course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستان در سطح پیش‌متوسطه: گفتن اینکه چه کاری باید، نباید یا لازم نیست انجام دهید و پرسیدن اینکه آیا کاری مجاز است. قوانین یک کتابخانه، یک استخر و یک باشگاه ورزشی با باید، نباید، لازم نیست، اجازه دارم و می‌توانم.'
