    title: مرور
teaching:
  prs.a1.unit28.lesson01.teach.animal_word:
    title: حیوان
    gloss: حیوان
    note: حیوان یعنی موجود زنده‌ی چهارپا و غیره؛ واژه‌ای کلی که حیوانات خانگی و بقیه‌ی جانوران را شامل می‌شود.
    example_gloss: سگ یک حیوان است.
  prs.a1.unit28.lesson01.teach.dog_word:
    title: سگ
    gloss: سگ
    note: سگ یعنی همان سگ.
    example_gloss: من سگ دارم.
  prs.a1.unit28.lesson01.teach.cat_word:
    title: گربه
    gloss: گربه
    note: پشک یعنی گربه؛ این واژه‌ی رایج روزمره در دری افغانستان است و در فارسی ایران به‌جای آن «گربه» می‌گویند.
    example_gloss: من یک گربه دارم.
  prs.a1.unit28.lesson01.teach.bird_word:
    title: پرنده
    gloss: پرنده
    note: «پرنده» یعنی پرنده.
    example_gloss: من یک پرنده دارم.
  prs.a1.unit28.lesson01.teach.fish_word:
    title: ماهی
    gloss: ماهی
    note: «ماهی» یعنی ماهی.
    example_gloss: من یک ماهی دارم.
  prs.a1.unit28.lesson01.teach.pet_phrase:
    title: حیوان خانگی
    gloss: حیوان خانگی
    note: «حیوان خانگی» در اصل یعنی «حیوان خانه»؛ از حیوان (که قبلاً یاد گرفتید) + خانگی (اهلی و مربوط به خانه) ساخته شده است.
    example_gloss: سگ، حیوان خانگی من است.
  prs.a1.unit28.lesson01.teach.review_daram_dast:
    title: من دارم / شما دارید (محترمانه) / است
    gloss: دارم / دارید (محترمانه) / است
    note: «دارم»، «دارین» (دارید، محترمانه) و «است» را از درس‌های قبلی می‌شناسید و در این واحد برای صحبت درباره‌ی حیوان‌های خانگی از آن‌ها استفاده می‌کنیم.
    target_text: دارم (دارم) / دارین (دارید، محترمانه) / است (است)
  prs.a1.unit28.lesson02.teach.pet_question:
    title: حیوان خانگی دارید؟
    gloss: حیوان خانگی داری؟
    note: «حیوان خانگی دارین؟» روش مؤدبانه و رسمی برای پرسیدن این است که آیا کسی حیوان خانگی دارد.
  prs.a1.unit28.lesson02.teach.yes_answer:
    title: بله، من یک سگ دارم
    gloss: بله، یک سگ دارم.
    note: «بلی» (بله، از واحد ۳) همراه با «سگ دارم» که در این واحد یاد گرفتید.
  prs.a1.unit28.lesson02.teach.no_answer:
    title: نه، من حیوان خانگی ندارم
    gloss: نه، من حیوان خانگی ندارم.
    note: «نخیر» (نه، به شکل رسمی، از واحد ۳) همراه با «حیوان خانگی ندارم».
  prs.a1.unit28.lesson02.teach.review_bali_nakhair:
    title: بله / نه / ندارم
    gloss: بله / نه / ندارم
    note: «بلی»، «نخیر» و «ندارم» را از گفت‌وگوی اعضای خانواده در واحد ۳ می‌شناسید و اینجا برای داشتن حیوان خانگی دوباره به کار رفته‌اند.
    target_text: بلی (بله) / نخیر (نه) / ندارم (ندارم)
  prs.a1.unit28.lesson03.teach.review_rang:
    title: رنگ
    gloss: رنگ
    note: «رنگ» یعنی رنگ (از واحد ۲۱، لباس‌ها).
    target_text: رنگ (رنگ)
  prs.a1.unit28.lesson03.teach.black_word:
    title: سیاه
    gloss: سیاه
    note: «سیاه» یعنی سیاه.
    example_gloss: سگ من سیاه است.
  prs.a1.unit28.lesson03.teach.white_word:
    title: سفید
    gloss: سفید
    note: «سفید» یعنی سفید.
    example_gloss: گربه‌ی من سفید است.
  prs.a1.unit28.lesson03.teach.small_word:
    title: کوچیک
    gloss: کوچیک
    note: «کوچک» یعنی کوچک (از واحد ۱۵، مقایسه‌ها).
    example_gloss: گربه‌ی من کوچک است.
  prs.a1.unit28.lesson03.teach.big_word:
    title: بزرگ
    gloss: بزرگ
    note: «بزرگ» یعنی بزرگ (از واحد ۱۵، مقایسه‌ها).
    example_gloss: سگ من بزرگ است.
  prs.a1.unit28.lesson03.teach.combined_sentence:
    title: سگ من سیاه و بزرگ است
    gloss: سگ من سیاه و بزرگ است.
    note: دو ویژگی با «و» به هم وصل شده‌اند.
  prs.a1.unit28.lesson04.teach.review_to_dari:
    title: تو (خودمانی) / تو داری (خودمانی)
    gloss: تو (دوستانه) / داری (دوستانه)
    note: «تو» و «داری» را از قبل می‌شناسید و در گفت‌وگوی دوستانه‌ی این درس بین دو دوست صمیمی به کار می‌روند.
    target_text: تو (تو) / داری (داری)
  prs.a1.unit28.lesson04.teach.review_che_har_roz:
    title: چه / چی / هر روز
    gloss: چه / کدام / هر روز
    note: «چه» (از «چه رنگ» در واحد ۲۱) و «هر روز» (از واحد ۲۴) اینجا کنار هم برای پرسیدن درباره‌ی مراقبت از حیوان خانگی به کار رفته‌اند.
    target_text: چه (چه / کدام) / هر روز (هر روز)
  prs.a1.unit28.lesson04.teach.dialogue_line1:
    title: 'همایون: زرمینه، تو حیوان خانگی داری؟'
    gloss: 'همایون: زرمینه، تو حیوان خانگی داری؟'
    note: یک سؤال دوستانه بین دوستان که از شکل «داری» استفاده می‌کند.
  prs.a1.unit28.lesson04.teach.dialogue_line2:
    title: 'زرمینه: بله، یک گربه دارم'
    gloss: 'زرمینه: بله، یک گربه دارم.'
    note: با «بلی» و «یک پشک دارم» جواب می‌دهد.
  prs.a1.unit28.lesson04.teach.dialogue_line3:
    title: 'همایون: گربه‌ات چه رنگی است؟'
    gloss: 'همایون: گربه‌ات چه رنگی است؟'
    note: از «چه رنگ» استفاده می‌کند، همان الگوی سؤال خرید در واحد ۲۱.
  prs.a1.unit28.lesson04.teach.dialogue_line4:
    title: 'زرمینه: سفید است'
    gloss: 'زرمینه: سفید است.'
    note: 'یک جواب کوتاه: فقط رنگ به اضافه‌ی «است». گربه از سؤال معلوم است، برای همین «پشک» تکرار نمی‌شود.'
  prs.a1.unit28.lesson04.teach.dialogue_line5:
    title: 'همایون: هر روز به او غذا می‌دهی؟'
    gloss: 'همایون: هر روز به او غذا می‌دهی؟'
    note: «غذا می‌دهی» (غذا می‌دهی، دوستانه) را معرفی می‌کند؛ از «غذا» + «می‌دهی» ساخته شده و شکل دوستانه‌ی «می‌دهد» در واحد ۱۸ است.
  prs.a1.unit28.lesson04.teach.dialogue_line6:
    title: 'زرمینه: بله، هر روز غذا می‌دهم'
    gloss: 'زرمینه: بله، هر روز غذا می‌دهم.'
    note: «هر روز» با «می‌دهم» (غذا می‌دهم، اول شخص) به کار رفته است.
  prs.a1.unit28.lesson05.teach.reading_passage:
    title: خواندن درباره‌ی یک حیوان خانگی
    gloss: زرمینه یک گربه دارد. گربه‌ی او سفید و کوچک است. زرمینه هر روز به گربه غذا می‌دهد.
    note: یک متن کوتاه که واژه‌های این واحد درباره‌ی حیوان‌های خانگی را مرور می‌کند و «دارد» (سوم شخص، از واحد ۲۶ و ۲۷) و «می‌دهد» (سوم شخص، از واحد ۱۸) را معرفی می‌کند.
  prs.a1.unit28.lesson06.teach.review_ama:
    title: ولی
    gloss: ولی
    note: «اما» یعنی ولی (از واحدهای قبلی).
    target_text: اما (اما)
  prs.a1.unit28.lesson06.teach.review_astam:
    title: من هستم
    gloss: هستم
    note: «استم» (هستم) را از درس‌های قبلی می‌شناسید.
    target_text: استم (هستم)
  prs.a1.unit28.lesson06.teach.wrap_summary:
    title: من یک سگ دارم اما گربه ندارم
    gloss: من یک سگ دارم، اما گربه ندارم.
    note: دو واقعیت درباره‌ی داشتن حیوان خانگی با «اما» به هم وصل شده‌اند.
