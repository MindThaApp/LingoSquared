course:
  title: دری افغانستان A1
  description: 'دری کابلی در سطح مقدماتی: واژه‌های حیوانات و حیوانات خانگی (سگ، گربه، پرنده، ماهی)، پرسیدن و پاسخ دادن به اینکه حیوان خانگی دارید یا نه با «حیوان خانگی دارین؟»، توصیف اندازه و رنگ حیوان خانگی، و گفت‌وگوی زرمینه و همایون درباره‌ی نگهداری و غذا دادن به یک گربه.'
units:
  prs.a1.unit28.animals:
    title: حیوانات
    description: درباره‌ی حیوانات خانگی و حیوانات رایج صحبت کنید، از جمله اینکه حیوانی دارید یا نه و مراقبت‌های ساده از آن.
