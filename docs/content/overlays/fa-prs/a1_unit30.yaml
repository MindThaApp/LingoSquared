teaching:
  prs.a1.unit30.lesson01.teach.tech_word:
    title: تکنولوژی
    gloss: تکنولوژی
    note: تکنالوژی یعنی تکنولوژی؛ املای رایج افغانستانی است و با املای ایرانی تکنولوژی فرق دارد.
    example_gloss: تکنولوژی خوب است.
  prs.a1.unit30.lesson01.teach.mobile_word:
    title: گوشی موبایل
    gloss: گوشی موبایل
    note: موبایل یعنی گوشی همراه؛ با تلفن که معنی کلی‌تری دارد (مرور درس ۷) فرق دارد.
    example_gloss: من گوشی موبایل دارم.
  prs.a1.unit30.lesson01.teach.computer_word:
    title: کامپیوتر
    gloss: کامپیوتر
    note: کمپیوتر یعنی کامپیوتر؛ واژه‌ای قرضی که در فارسی ایران و دری مشترک است، فقط املایش کمی فرق دارد.
    example_gloss: کامپیوتر در دفتر است.
  prs.a1.unit30.lesson01.teach.internet_word:
    title: اینترنت
    gloss: اینترنت
    note: انترنت یعنی اینترنت؛ واژه‌ای قرضی که در فارسی ایران و دری مشترک است، فقط املایش کمی فرق دارد.
    example_gloss: اینترنت کند است.
  prs.a1.unit30.lesson01.teach.app_word:
    title: اپلیکیشن
    gloss: اپلیکیشن
    note: اپلیکیشن یعنی اپ (برنامه کاربردی)؛ واژه‌ای قرضی که در فارسی ایران و دری مشترک است.
    example_gloss: این اپلیکیشن خوب است.
  prs.a1.unit30.lesson01.teach.photo_word:
    title: عکس
    gloss: عکس
    note: عکس یعنی عکس یا تصویر.
    example_gloss: این عکس خوب است.
