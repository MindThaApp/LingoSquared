    gloss: استفاده + کردن ← استفاده می‌کنم
    note: استفاده با کردن ترکیب می‌شود و استفاده می‌کنم (من استفاده می‌کنم) را می‌سازد؛ همان الگوی فعل ترکیبی که در این دوره بارها دیده‌اید، مثل بازی می‌کنم (درس ۲۹) و ورزش می‌کنم (درس ۲۹).
    target_text: استفاده (به‌کار بردن) + کردن (انجام دادن) = استفاده می‌کنم (من استفاده می‌کنم)
  prs.a1.unit30.lesson01.teach.combined_sentence:
    title: از اینترنت استفاده می‌کنم
    gloss: من از اینترنت استفاده می‌کنم.
    note: ترکیب من (مرور)، از (مرور)، انترنت و استفاده می‌کنم.
  prs.a1.unit30.lesson02.teach.review_peyam:
    title: پیام
    gloss: پیام
    note: پیام یعنی پیام.
