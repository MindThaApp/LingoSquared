course:
  title: دری افغانستان A1
  description: 'دری کابلی در سطح مبتدی: واژگان فناوری و دستگاه‌ها (موبایل، کامپیوتر، اینترنت، اپلیکیشن، عکس)، عبارت‌های کار با تلفن (پیام فرستادن، زنگ زدن، عکس گرفتن، دانلود کردن اپلیکیشن)، پرسیدن و جواب دادن دربارهٔ اینکه روزی چند بار از موبایل استفاده می‌کنید، و یک گفتگوی زرمینه و همایون دربارهٔ استفاده از موبایل، کامپیوتر و اینترنت.'
units:
  prs.a1.unit30.technology:
    title: فناوری
    description: دربارهٔ موبایل، کامپیوتر، اینترنت و اپلیکیشن‌ها حرف بزنید -- و اینکه چند بار از آن‌ها استفاده می‌کنید.
