    note: می‌فرستم یعنی «می‌فرستم»؛ فعلی تازه است و با فعل بگذارم (پیام گذاشتن) در درس ۷ فرق دارد.
  prs.a1.unit30.lesson02.teach.review_zang_mizanam:
    title: زنگ می‌زنم
    gloss: زنگ می‌زنم
    note: زنگ می‌زنم یعنی «زنگ می‌زنم».
    target_text: زنگ می‌زنم (من زنگ می‌زنم)
