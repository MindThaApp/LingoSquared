    note: این‌ها واژه‌های مرور هستند که برای پرسیدن و گفتن سفارش به کار می‌روند.
    target_text: شما (شما، رسمی) / چیست (چیست) / من (من) / می‌خواهم (می‌خواهم) / یک (یک)
