    example_gloss: این منو است.
  prs.a1.unit51.lesson02.teach.kabab_word:
    title: کباب
    gloss: کباب
    note: این واژهٔ دری برای کباب است؛ غذایی محبوب از گوشت کبابی در افغانستان.
