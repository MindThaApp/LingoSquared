teaching:
  prs.a2.unit21.lesson01.teach.tghr_dadn_lghw:
    title: عوض کردن وقت
    gloss: عوض کردن (وقت) / لغو کردن
    note: '*قرار را تغییر دادن* یعنی آن را به زمان دیگری بردن. *لغو کردن* یعنی آن را کاملاً کنسل کردن.'
    example_gloss:
    - می‌خواهم وقتم را عوض کنم.
    - باید وقتم را لغو کنم.
  prs.a2.unit21.lesson01.teach.mtasfanh_bbkhshn:
    title: عذرخواهی کردن
    gloss: متأسفانه / ببخشید
    note: '*متأسفانه* روشی مؤدبانه برای گفتن خبر بد است. *ببخشین* عذرخواهی روزمره است.'
    example_gloss:
    - متأسفانه نمی‌توانم بیایم.
    - ببخشید، خیلی دیر کردم.
  prs.a2.unit21.lesson01.teach.slman:
    title: آرایشگاه
    gloss: آرایشگاه (مردانه)
    note: '*سلمانی* مغازهٔ آرایشگری است، یعنی خود مکان. *دلاک* واژهٔ قدیمی برای خود آرایشگر است.'
    example_gloss: آرایشگاه از ساعت نه تا شش باز است.
  prs.a2.unit21.lesson01.teach.mtwanm_qrarm_ra:
    title: درخواست عوض کردن وقت
    gloss: می‌توانم وقتم را عوض کنم؟
    note: 'در جملهٔ سؤالیِ بله/نه ترتیب کلمات مثل جملهٔ خبری می‌ماند و فقط لحن بالا می‌رود: *می‌توانم قرارم را تغییر بدهم؟* فعل دوم، *تغییر بدهم*، آخر جمله می‌آید.'
  prs.a2.unit21.lesson01.teach.mn_mtasfanh_nmtwanm:
    title: گفتن اینکه نمی‌توانید بیایید
    gloss: متأسفانه نمی‌توانم بیایم.
  prs.a2.unit21.lesson01.teach.njshnbh_nmtwanm_bam:
    title: می‌توانم + وجه التزامی
    gloss: پنجشنبه نمی‌توانم بیایم. می‌توانم وقت را عوض کنم؟
    note: 'بعد از *می‌توانم* (می‌توانم) فعل دوم به شکل التزامی می‌آید و آخر جمله قرار می‌گیرد: *می‌توانم بیایم*. برای منفی، *ن* به فعل کمکی اضافه می‌شود، یعنی *نمی‌توانم*: *نمی‌توانم بیایم*. کلمهٔ روز اول می‌آید: *پنجشنبه نمی‌توانم بیایم*. جملهٔ پرسشی ترتیب کلمات یکسانی دارد و فقط آهنگ صدا بالا می‌رود: *می‌توانم قرار را تغییر بدهم؟*'
  prs.a2.unit21.lesson02.teach.rwz_dr:
    title: یک روز دیگر
    gloss: یک روز دیگر
    note: '*دیگر* یعنی «غیر از این» و بعد از اسم می‌آید: *یک روز دیگر*.'
    example_gloss: در یک روز دیگر هم می‌شود؟
  prs.a2.unit21.lesson02.teach.dwshnbh_hm_mmn:
    title: پیشنهاد دادن یک روز
    gloss: دوشنبه هم می‌شود؟
    note: 'قبل از نام روز هفته حرف اضافه لازم نیست: *دوشنبه هم ممکن است؟* *هم* یعنی «همچنین» و بعد از روز می‌آید.'
  prs.a2.unit21.lesson02.teach.jmah_bra_shma:
    title: برای شما مناسب است؟
    gloss: جمعه برای شما مناسب است؟ (رسمی)
    note: '*مناسب* یعنی «درخور». *برای شما مناسب است* روش مؤدبانه برای پرسیدن است که آیا زمانی برای کسی که خوب نمی‌شناسید مناسب است. *برایم* شکل کوتاه *برای من* است.'
  prs.a2.unit21.lesson02.teach.bl_bram_mnasb:
    title: گفتن بله
    gloss: بله، برای من خوب است.
  prs.a2.unit21.lesson02.teach.mtasfanh_nh:
    title: مؤدبانه نه گفتن
    gloss: متأسفانه نه.
  prs.a2.unit21.lesson02.teach.jmah_bra_shma_2:
    title: برای شما مناسب است؟
    gloss: جمعه برای شما مناسب است؟ بله، برای من خوب است. نه، متأسفانه نه.
    note: برای پرسیدن اینکه زمانی برای کسی مناسب است یا نه، از *برای شما مناسب است؟* با *شمای* مؤدبانه استفاده کنید. برای تأیید بگویید *بلی، برایم مناسب است* و برای رد مؤدبانه، *متأسفانه نه*. *برای* همراه با شناسهٔ ضمیری (*برایم*، *برایتان*) یعنی «برای من»، «برای شما».
  prs.a2.unit21.lesson03.teach.wn_mtasfm:
    title: چون و متأسفم
    gloss: چون / متأسفم
    note: '*چون* دو جملهٔ کامل را به هم وصل می‌کند و دلیل را می‌گوید. *متأسفم* عذرخواهی محتاطانه‌تری از *ببخشین* است.'
    example_gloss:
    - نمی‌توانم بیایم، چون مریض هستم.
    - متأسفم.
  prs.a2.unit21.lesson03.teach.zhmt:
    title: زحمت
    gloss: زحمت
    note: '*بابت زحمت ببخشین* عبارتی مؤدبانه است برای وقتی که برای کسی زحمت اضافه درست کرده‌اید. *زحمت* یعنی «دردسر» یا «تلاش».'
    example_gloss: بابت زحمت ببخشید.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn:
    title: 'دلیل: کار'
    gloss: نمی‌توانم بیایم، چون باید کار کنم.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn_2:
    title: 'دلیل: قرار دیگر'
    gloss: نمی‌توانم بیایم، چون یک قرار دیگر دارم.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn_3:
    title: 'چون: دلیل'
    gloss: نمی‌توانم بیایم، چون مریض هستم.
    note: 'بعد از *چون* جمله مثل یک جملهٔ معمولی است و فعلش آخر می‌آید. قبل از آن ویرگول بگذارید: *نمی‌توانم بیایم، چون مریض استم.* شکل *استم* صورت اول‌شخص مفرد، یعنی *من*، برای *است* است.'
  prs.a2.unit21.lesson04.teach.qrar_dhashtn_az:
    title: قرار گذاشتن و از قبل
    gloss: قرار گذاشتن / از قبل
    note: '*قرار گذاشتن* یعنی با هم دربارهٔ زمان یا مکان توافق کردن. *از قبل* یعنی پیشاپیش.'
    example_gloss:
    - قراری بگذاریم؟
    - یک روز قبل زنگ بزنید.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh:
    title: پذیرفتن یک زمان
    gloss: دوشنبه ساعت ده خوب است.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh_2:
    title: پرسیدن مناسب بودن زمان
    gloss: دوشنبه ساعت ده می‌توانید بیایید؟ (رسمی)
    note: '*می‌توانین* شکل مؤدبانهٔ *تو* یعنی *می‌توانی* است؛ شناسهٔ جمع *-ین* با *شما* می‌آید. فعل دوم، *بیایین*، آخر جمله است.'
  prs.a2.unit21.lesson04.teach.s_shma_ra:
    title: نهایی کردن قرار
    gloss: پس شما را دوشنبه می‌بینم.
  prs.a2.unit21.lesson04.teach.s_qrar_jdd:
    title: گذاشتن قرار جدید
    gloss: پس یک قرار جدید می‌گذارم.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh_3:
    title: اول روز، بعد ساعت
    gloss: دوشنبه ساعت ده خوبه. دوشنبه ساعت ده می‌تونید بیایید؟
    note: 'وقتی روز و ساعت را با هم می‌گویید، اول روز می‌آید و بعد *ساعت* + عدد: *دوشنبه ساعت ده*. در سؤال مؤدبانه از *می‌توانین ...؟* استفاده می‌شود و فعل آخر جمله می‌آید.'
  prs.a2.unit21.lesson05.teach.hmawn_azz_qrartan:
    title: پیامی از آرایشگاه
    gloss: همایون عزیز، قرار شما تغییر کرد. قرار جدیدتان دوشنبه ساعت ده است. این برایتان مناسب نیست؟ پس یک روز قبل با ما تماس بگیرید. بعد ما یک قرار جدید می‌گذاریم. تا دوشنبه! آرایشگاه آریانا
    note: این یک پیام کوتاه و معمول از طرف یک کسب‌وکار است، برای همین از پسوند مؤدبانهٔ *-تان* استفاده شده (*قرارتان*، *برایتان*). *تغییر داده شد* یعنی عوض شد.
    glosses:
      عزیز: عزیز
      همایون: همایون
      قرارتان: مال شما (رسمی)
      قرار: وقت ملاقات
      تغییر: عوض شد
      جدیدتان: جدید
      دوشنبه: دوشنبه
      ده: ده
      ساعت: ساعت
      مناسب: مناسب
      این: این
      نیست: نه / نیست
      برایتان: برای شما (رسمی)
      تماس: زنگ زدن
      با: با ما
      پس: پس، بعد
      قبل: از قبل
      می‌گذاریم: می‌گذاریم
      ما: ما
      تا: تا، به امید دیدار
      سلمانی: آرایشگاه مردانه
      آریانا: آریانا
  prs.a2.unit21.lesson06.teach.slman_arana_rwz:
    title: آرایشگاه جواب می‌دهد
    gloss: 'آرایشگر: آرایشگاه آریانا، روز بخیر.'
  prs.a2.unit21.lesson06.teach.rwz_bkhr_hmawn:
    title: همایون توضیح می‌دهد و سؤال می‌کند
    gloss: 'همایون: روز بخیر، همایون صحبت می‌کنم. پنجشنبه وقت دارم، ولی متأسفانه نمی‌تونم بیام. می‌تونم قرار را عوض کنم؟'
  prs.a2.unit21.lesson06.teach.albth_jmah_bra:
    title: آرایشگر جمعه را پیشنهاد می‌کند
    gloss: 'آرایشگر: البته. جمعه برای شما مناسبه؟'
  prs.a2.unit21.lesson06.teach.mtasfanh_nh_wn:
    title: همایون دوشنبه را پیشنهاد می‌کند
    gloss: 'همایون: متأسفانه نه، چون باید کار کنم. دوشنبه هم میشه؟'
  prs.a2.unit21.lesson06.teach.dwshnbh_saat_dh:
    title: آرایشگر موافقت می‌کند
    gloss: 'آرایشگر: دوشنبه ساعت ده خوبه.'
  prs.a2.unit21.lesson06.teach.bram_mnasb_ast:
    title: همایون قبول می‌کند و عذرخواهی می‌کند
    gloss: 'همایون: برای من خوبه. خیلی ممنون و بابت زحمت ببخشید.'
  prs.a2.unit21.lesson06.teach.mshl_nst_ta:
    title: آرایشگر مکالمه را تمام می‌کند
    gloss: 'آرایشگر: مشکلی نیست. تا دوشنبه!'
