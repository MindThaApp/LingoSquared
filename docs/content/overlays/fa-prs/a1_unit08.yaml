teaching:
  prs.a1.unit08.lesson01.teach.naan:
    title: نان
    gloss: نان
    note: نان بخش اصلی هر وعده غذایی در افغانستان است.
    example_gloss: نان تازه‌ست.
  prs.a1.unit08.lesson01.teach.palaw:
    title: پلو
    gloss: پلو
    note: پلو غذای برنجی افغانی است که ادویه مخصوص خودش را دارد و اغلب با گوشت، هویج یا کشمش پخته می‌شود؛ فقط برنج ساده نیست.
    example_gloss: پلو خوشمزه است.
  prs.a1.unit08.lesson01.teach.qorma:
    title: خورشت گوشت و سبزی
    gloss: خورشت گوشت و سبزی
    note: قورمه اسم کلی یک خورشت پخته از گوشت و سبزی است که معمولاً با پلو سرو می‌شود.
    example_gloss: خورشت را با پلو می‌خورم.
  prs.a1.unit08.lesson01.teach.chai_review:
    title: چای (مرور)
    gloss: چای
    note: چای نوشیدنی همیشگی است که تقریباً در هر جای افغانستان تعارف می‌شود.
    example_gloss: یک چای، لطفاً.
  prs.a1.unit08.lesson01.teach.ab_water:
    title: آب
    gloss: آب
    note: آب کلمهٔ معمولی برای «آب» است.
    example_gloss: یک آب، لطفاً.
  prs.a1.unit08.lesson01.teach.va_word:
    title: و
    gloss: و
    note: و حرف ربط رایج برای وصل کردن اسم غذاها در یک فهرست است.
    target_text: و (و)
  prs.a1.unit08.lesson02.teach.mikham_chai:
    title: سفارش مؤدبانهٔ چای
    gloss: یک چای می‌خوام.
    note: یک چای می‌خواهم روشی خنثی و مؤدبانه برای سفارش دادن است که مستقیماً از می‌خواهم (می‌خوام) استفاده می‌کند، نه یک ساختار غیرمستقیم‌تر.
  prs.a1.unit08.lesson02.teach.lotfan:
    title: لطفاً
    gloss: لطفاً
    note: لطفاً را می‌شود به تقریباً هر درخواستی اضافه کرد تا لحنش ملایم‌تر شود.
    example_gloss: لطفاً کمک کنید.
  prs.a1.unit08.lesson02.teach.mikham_naan:
    title: سفارش مؤدبانهٔ نان
    gloss: یک نان می‌خوام.
    note: همین الگوی یک [چیز] می‌خواهم برای هر اسم غذا یا نوشیدنی به کار می‌رود.
  prs.a1.unit08.lesson03.teach.what_do_you_have:
    title: پرسیدن اینکه چه چیزهایی هست
    gloss: چی دارید؟
    note: چی دارین؟ روش طبیعی برای پرسیدن از مغازه‌دار یا گارسون است که چه غذایی موجود است.
  prs.a1.unit08.lesson03.teach.we_have_both:
    title: پاسخ دادن دربارهٔ غذاهای موجود
    gloss: پلو و قورمه داریم.
    note: پلو و قورمه داریم از داریم (ما داریم)، شکل «ما» از دارم، استفاده می‌کند. مغازه‌دار وقتی از طرف کل مغازه حرف می‌زند، «ما» می‌گوید.
  prs.a1.unit08.lesson03.teach.fresh_word:
    title: تازه
    gloss: تازه
    note: تازه برای غذایی گفته می‌شود که همین حالا تهیه شده است.
    example_gloss: این نان تازه است.
  prs.a1.unit08.lesson04.teach.yek_boshghab:
    title: یک بشقاب پلو
    gloss: یک بشقاب پلو
    note: بشقاب شمارنده‌ای برای غذایی است که در بشقاب سرو می‌شود.
  prs.a1.unit08.lesson04.teach.do_ta_naan:
    title: دو نان
    gloss: دو تا نان
    note: تا شمارندهٔ عمومی است که بعد از عدد برای بیشتر چیزهای شمردنی می‌آید؛ اینجا یعنی دو تکه نان.
  prs.a1.unit08.lesson04.teach.combined_order:
    title: سفارش کامل
    gloss: یک بشقاب پلو و دو تا نان، لطفاً.
    note: چند مقدار را می‌شود با و در یک سفارش به هم وصل کرد.
  prs.a1.unit08.lesson05.teach.bill_word:
    title: صورت‌حساب
    gloss: صورتحساب
    note: بل (از واژهٔ انگلیسی bill) کلمهٔ رایج افغانستانی برای صورتحساب رستوران است؛ در فارسی ایران بیشتر «صورتحساب» یا «حساب» می‌گویند.
    example_gloss: صورت‌حساب، لطفاً.
  prs.a1.unit08.lesson05.teach.bill_request:
    title: پرسیدن جمع صورتحساب
    gloss: حساب چند می‌شه؟
    note: بل چند می‌شه؟ در اصل می‌پرسد «صورتحساب چند می‌شود»؛ روش طبیعی و روزمره برای پرسیدن مبلغ کل. می‌شه شکل گفتاری می‌شود است و در مغازه همین را می‌شنوید، ولی در نوشتار می‌شود به کار می‌رود.
  prs.a1.unit08.lesson05.teach.khoshmaze:
    title: گفتن اینکه غذا خوشمزه بود
    gloss: خیلی خوشمزه بود.
    note: خیلی خوش‌مزه بود تعریف طبیعی بعد از غذاست.
  prs.a1.unit08.lesson05.teach.chaikhana:
    title: چایخانه
    gloss: چایخانه / غذاخوری ساده
    note: چایخانه در افغانستان، به‌ویژه در کابل، نوعی غذاخوری ساده و رایج است که چای و غذاهای ساده سرو می‌کند.
  prs.a1.unit08.lesson06.teach.welcome_review:
    title: خوش آمدید (مرور)
    gloss: خوش آمدید
    note: خوش آمدین در درس احوال‌پرسی معرفی شد؛ اینجا به‌عنوان خوشامدگویی مغازه‌دار به کار رفته است.
  prs.a1.unit08.lesson06.teach.turn01:
    title: مغازه‌دار به مشتری خوشامد می‌گوید
    gloss: مغازه‌دار به مشتری خوشامد می‌گوید و می‌پرسد چه میل دارد.
    note: چی میل دارین؟ پرسش مؤدبانهٔ شروع است و کارکردی شبیه چی دارین؟ دارد، اما از دید میل و خواستهٔ مشتری مطرح می‌شود.
  prs.a1.unit08.lesson06.teach.turn02:
    title: مشتری می‌پرسد چه چیزی موجود است
    gloss: مشتری به مغازه‌دار سلام می‌کند و می‌پرسد چه چیزی موجود است.
    note: چی دارین؟ گفتگوی سفارش را شروع می‌کند؛ از درس سوم.
  prs.a1.unit08.lesson06.teach.turn03:
    title: مغازه‌دار غذاهای موجود را می‌گوید
    gloss: مغازه‌دار می‌گوید پلو و قورمه دارند و هر دو تازه است.
    note: هردو تازه بودن هر دو غذای نام‌برده را تأیید می‌کند.
  prs.a1.unit08.lesson06.teach.turn04:
    title: مشتری سفارش کامل می‌دهد
    gloss: مشتری موافقت می‌کند و یک بشقاب پلو با قورمه و یک چای هم سفارش می‌دهد.
    note: این جمله الگوی مقدار از درس چهارم را با واژگان غذا از درس اول ترکیب می‌کند.
  prs.a1.unit08.lesson06.teach.turn05:
    title: مغازه‌دار سفارش را تأیید می‌کند
    gloss: مغازه‌دار می‌گوید همین الان می‌آورد.
    note: چشم که در اصل یعنی «روی چشمم»، روشی محترمانه برای گفتن «حتماً» است. می‌آرم شکل گفتاری می‌آورم است و همین حالا یعنی «همین الان».
  prs.a1.unit08.lesson06.teach.turn06:
    title: مشتری از غذا تعریف می‌کند و صورتحساب می‌خواهد
    gloss: مشتری می‌گوید خوشمزه بود و صورتحساب را می‌پرسد.
    note: هر دو عبارت مستقیماً واژگان درس پنجم را دوباره به کار می‌برند.
  prs.a1.unit08.lesson06.teach.turn07:
    title: مغازه‌دار مبلغ کل را می‌گوید
    gloss: مغازه‌دار تشکر می‌کند و می‌گوید دویست افغانی می‌شود.
    note: افغانی واحد پول افغانستان است؛ دوصد (دویست) با نام پول می‌آید تا قیمت را بگوید.
