  description: 'دری افغانستان در سطح مقدماتی: واژگان غذا و نوشیدنی، سفارش مؤدبانه، پرسیدن اینکه چه چیزی موجود است، مقدارها و آداب رستوران از جمله خواستن صورت‌حساب.'
