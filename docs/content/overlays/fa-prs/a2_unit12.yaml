teaching:
  prs.a2.unit12.lesson01.teach.symptom_word:
    title: نشانهٔ بیماری
    gloss: نشانهٔ بیماری
    note: '*علامت* واژهٔ عمومی برای نشانهٔ بیماری است.'
    example_gloss: نشانهٔ بیماری بشیر سردرد است.
  prs.a2.unit12.lesson01.teach.duration_word:
    title: بازهٔ زمانی
    gloss: بازهٔ زمانی / مدت‌زمان
    note: '*مدت* می‌پرسد یا بیان می‌کند که چیزی چه مدت طول کشیده است.'
    example_gloss: دو روز است که مریضم.
  prs.a2.unit12.lesson01.teach.severe_word:
    title: حاد
    gloss: حاد / شدید
    note: '*شدید* نشانهٔ بیماری‌ای را توصیف می‌کند که قوی و حاد است.'
    example_gloss: سردردم خیلی شدید است.
  prs.a2.unit12.lesson01.teach.exam_word:
    title: آزمایش پزشکی
    gloss: آزمایش / تست پزشکی
    note: '*آزمایش* یک تست پزشکی است، مثل آزمایش خون.'
    example_gloss: دکتر آزمایش خون می‌خواهد.
  prs.a2.unit12.lesson01.teach.prescription_slip_word:
    title: نسخه
    gloss: نسخه (برگهٔ نوشته‌شده)
    note: '*نسخه* همان برگهٔ نوشته‌شدهٔ نسخه است.'
    example_gloss: دکتر برایم نسخه نوشت.
  prs.a2.unit12.lesson01.teach.prescribe_word:
    title: تجویز کردن
    gloss: نسخه نوشتن
    note: '*تجویز* یعنی دکتر دارو یا درمانی را برای بیمار مشخص می‌کند.'
    example_gloss: دکتر یک داروی جدید تجویز کرد.
  prs.a2.unit12.lesson01.teach.since_ago_grammar:
    title: «از ... پیش» برای بیان «از ... قبل»
    gloss: از دو روز پیش
    note: '*از ... پیش* یعنی «از ... قبل تا حالا» و برای گفتن مدت ادامهٔ یک علامت به کار می‌رود.'
    target_text: از دو روز پیش (از دو روز قبل)
  prs.a2.unit12.lesson02.teach.headache_severe_since:
    title: توصیف یک علامت شدید و ادامه‌دار
    gloss: سردردم خیلی شدید است و از دو روز پیش شروع شده.
    note: '*شدید* را با الگوی مدت *از ... پیش* ترکیب می‌کند.'
  prs.a2.unit12.lesson02.teach.need_test_question:
    title: پرسیدن اینکه آزمایش لازم است یا نه
    gloss: برای این مشکل باید آزمایش بدهم؟
    note: '*آیا* برای سؤال بله/خیر می‌آید؛ *باید* یعنی «لازم است».'
  prs.a2.unit12.lesson02.teach.take_medicine_twice:
    title: گفتن طرز مصرف دارو
    gloss: باید این دارو را روزی دو بار بخورم.
    note: '*روزی دو بار* یعنی «دو بار در روز»؛ در اصل یعنی «دو بار برای هر روز».'
  prs.a2.unit12.lesson03.teach.confirmation_word:
    title: تأییدیه
    gloss: تأییدیه
    note: '*تاییدی* تأییدیهٔ کتبی است، مثلاً برای نوبت دکتر.'
    example_gloss: تأییدیهٔ نوبتم رسید.
  prs.a2.unit12.lesson03.teach.checkup_word:
    title: معاینه / چکاپ
    gloss: معاینه / چکاپ
    note: '*معاینه* خود معاینهٔ جسمی بیمار توسط دکتر است.'
    example_gloss: دکتر یک معاینهٔ کوتاه انجام داد.
  prs.a2.unit12.lesson03.teach.notice_text:
    title: اطلاعیهٔ تأیید نوبت دکتر
    gloss: نوبت دکتر شما روز چهارشنبه ساعت نه صبح است. لطفاً شناسنامه‌تان (تذکره) را بیاورید. اگر نمی‌توانید بیایید، یک روز قبل زنگ بزنید.
    note: یک اطلاعیهٔ کوتاه و رسمی دربارهٔ نوبت، به زبان رسمی و نوشتاری که این درس آموزش می‌دهد.
  prs.a2.unit12.lesson04.teach.turn01:
    title: دکتر به بشیر سلام می‌کند
    gloss: دکتر به او سلام می‌کند و می‌پرسد چه مشکلی دارد.
    note: '*چطور استین؟* یعنی «حال شما چطور است؟» و پرسش مؤدبانهٔ احوال‌پرسی است.'
  prs.a2.unit12.lesson04.teach.turn02:
    title: بشیر جواب سلام می‌دهد و علامتش را می‌گوید
    gloss: او با احترام به دکتر سلام می‌کند و می‌گوید سردردش خیلی شدید است.
    note: '*داکتر صاحب* در افغانستان شکل محترمانهٔ خطاب به دکتر است.'
  prs.a2.unit12.lesson04.teach.turn03:
    title: دکتر می‌پرسد از کی
    gloss: دکتر می‌پرسد از کی شروع شده است.
    note: '*از کی...؟* یعنی «از چه زمانی؟».'
  prs.a2.unit12.lesson04.teach.turn04:
    title: بشیر جواب می‌دهد
    gloss: از دو روز پیش.
    note: از الگوی مدت *از ... پیش* استفاده می‌کند.
  prs.a2.unit12.lesson04.teach.turn05:
    title: دکتر دربارهٔ تب می‌پرسد
    gloss: دکتر می‌پرسد آیا تب هم دارد.
    note: '*آیا ... هم ...؟* یعنی «آیا ... هم هست؟».'
  prs.a2.unit12.lesson04.teach.turn06:
    title: بشیر تأیید می‌کند که کمی تب دارد
    gloss: بله، کمی تب دارد.
    note: '*یک‌کمی* یعنی «کمی».'
  prs.a2.unit12.lesson04.teach.turn07:
    title: دکتر دستور می‌دهد
    gloss: باید این دارو را روزی دو بار بخورد. اگر بهتر نشد، دوباره بیاید.
    note: '*اگر بهتر نشدین، دوباره بیایین* یعنی «اگر بهتر نشدید، دوباره بیایید» و از الگوی شرطی *اگر* استفاده می‌کند.'
  prs.a2.unit12.lesson04.teach.turn08:
    title: بشیر از دکتر تشکر می‌کند
    gloss: بشیر با احترام از دکتر تشکر می‌کند.
    note: '*داکتر صاحب* دوباره با احترام دکتر را خطاب می‌کند.'
