course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستانی در سطح پیش‌متوسط: شرح گام‌به‌گام اینکه یک صبح یا یک سفر چطور گذشت، از جمله مرحله‌ای که انجام ندادید. فعل‌های مرکب در گذشتهٔ ساده، منفی‌کردن آن‌ها روی فعل کمکی، جای را و حرف‌های ربط اول، بعد، بعد از آن، در آخر.'
