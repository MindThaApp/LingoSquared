teaching:
  prs.a2.unit22.lesson01.teach.this_morning:
    title: امروز صبح
    gloss: امروز صبح
    note: '*امروز* یعنی امروز و *صبح* یعنی صبح. *امروز صبح* با هم یعنی «امروز صبح»، چارچوب زمانی این واحد. در جملهٔ دری، کلمهٔ زمان اول می‌آید و فعل آخر.'
    example_gloss: امروز صبح به دفتر رفتم.
  prs.a2.unit22.lesson01.teach.late_early:
    title: دیر، زود
    gloss: دیر، زود
    note: '*دیر* یعنی دیر و *زود* یعنی زود. هر دو پیش از بخش فعلی جمله می‌آیند، درست مثل فارسی ایران.'
    example_gloss:
    - امروز صبح دیر بیدار شدم.
    - امروز زود بیدار شد.
  prs.a2.unit22.lesson01.teach.office:
    title: دفتر
    gloss: دفتر
    note: '*دفتر* یعنی اداره، جایی که بسیاری از مردم کابل صبح‌های روزهای کاری در آن کار می‌کنند.'
    example_gloss: صبح به اداره رفتم.
  prs.a2.unit22.lesson01.teach.school:
    title: مدرسه
    gloss: مدرسه
    note: '*مکتب* واژهٔ رایج افغانستانی برای مدرسه است. با *به* به آن می‌روید، مثل *به مکتب رفتم*.'
    example_gloss: صبح به مدرسه رفت.
  prs.a2.unit22.lesson01.teach.by_bus_car:
    title: با اتوبوس، با ماشین
    gloss: با اتوبوس، با ماشین
    note: '*با* یعنی با یا به‌وسیلهٔ. *با بس* یعنی با اتوبوس و *با موتر* یعنی با ماشین. *بس* همان اتوبوس است و *موتر* واژهٔ افغانستانی برای ماشین.'
    example_gloss:
    - با اتوبوس به اداره رفتم.
    - با ماشین به مدرسه رفتیم.
  prs.a2.unit22.lesson01.teach.on_foot:
    title: پیاده
    gloss: پیاده
    note: '*پیاده* یعنی پیاده. *پیاده رفتن* یعنی پیاده به جایی رفتن، و *پیاده* درست پیش از فعل می‌آید.'
    example_gloss: پیاده به مدرسه رفتم.
  prs.a2.unit22.lesson01.teach.bus_stop:
    title: ایستگاه اتوبوس، ایستگاه
    gloss: ایستگاه اتوبوس، ایستگاه
    note: '*ایستگاه* یعنی ایستگاه. *ایستگاه بس* یعنی ایستگاه اتوبوس.'
    example_gloss: به ایستگاه اتوبوس رفتم.
  prs.a2.unit22.lesson01.teach.gate:
    title: دروازه، در حیاط
    gloss: دروازه، در ورودی خانه
    note: '*دروازه* دروازه یا در ورودی خانه است. هر صبح بازش می‌کنید، پس در درس‌های بعد با کلمهٔ کوچک *را* دوباره با آن روبه‌رو می‌شوید.'
    example_gloss: دروازه را باز کردم.
  prs.a2.unit22.lesson01.teach.clothes:
    title: لباس‌هایم
    gloss: لباس‌هایم
    note: '*لباس* یعنی پوشاک، *لباس‌ها* یعنی لباس‌ها (نشانهٔ جمع *-ها* با نیم‌فاصله نوشته می‌شود) و *-م* یعنی «من»: *لباس‌هایم* یعنی لباس‌های من.'
    example_gloss: لباس‌هایم را پوشیدم.
  prs.a2.unit22.lesson01.teach.shower:
    title: دوش
    gloss: دوش
    note: '*دوش* یعنی دوش. فعلش مثل فارسی ایران *گرفتن* است: دوش گرفتن. این فعل را در درس بعد می‌بینید.'
    example_gloss: صبح دوش گرفتم.
  prs.a2.unit22.lesson01.teach.tea:
    title: چای
    gloss: چای
    note: '*چای* یعنی چای، نوشیدنی همیشگی صبح. مثل فارسی، فعل آن *خوردن* است.'
    example_gloss: صبح چای خوردم.
  prs.a2.unit22.lesson01.teach.breakfast:
    title: صبحانه
    gloss: صبحانه
    note: '*صبحانه* یعنی صبحانه. در کابل برای همین وعده *ناشتا* هم می‌شنوید؛ این دوره *صبحانه* را به کار می‌برد.'
    example_gloss: برای صبحانه نان و چای خوردم.
  prs.a2.unit22.lesson01.teach.wake_up:
    title: بیدار شدن
    gloss: 'بیدار شدن (تحت‌اللفظی: بیدار گشتن)'
    note: '*بیدار* یعنی بیدار و *شدن* یعنی شدن. *بیدار شدن* با هم یعنی از خواب بیدار شدن. این یک فعل مرکب است: کلمه‌ای که فعل نیست (اینجا صفت) به‌علاوهٔ یک فعل کمکی.'
    example_gloss: امروز صبح بیدار شدم.
  prs.a2.unit22.lesson01.teach.get_ready:
    title: آماده شدن
    gloss: 'آماده شدن (تحت‌اللفظی: آماده گشتن)'
    note: '*آماده* یعنی آماده و *شدن* یعنی شدن. *آماده شدن* یعنی آماده شدن برای کاری، دومین فعل مرکب که با *شدن* ساخته می‌شود.'
    example_gloss: امروز صبح آماده شدم.
  prs.a2.unit22.lesson01.teach.open:
    title: باز کردن
    gloss: 'باز کردن (تحت‌اللفظی: باز ساختن)'
    note: '*باز* یعنی باز و *کردن* یعنی انجام دادن یا ساختن. *باز کردن* یعنی گشودن. این یک فعل مرکب است که با *کردن* ساخته می‌شود: چیزی را باز می‌کنید.'
    example_gloss: دروازه را باز کردم.
  prs.a2.unit22.lesson01.teach.went_office:
    title: به اداره رفتم
    gloss: رفتم دفتر.
    note: '*رفتم* گذشتهٔ ساده‌ی *رفتن* از واحد ۱۹ است: ریشهٔ گذشته *رفت* به‌علاوهٔ *-م*. *به* یعنی «به»، پس *به دفتر رفتم* یعنی به اداره رفتم.'
  prs.a2.unit22.lesson01.teach.opened_gate:
    title: دروازه را باز کردم
    gloss: دروازه را باز کردم.
    note: '*را* کلمهٔ کوچکی است که مفعول مشخص را نشان می‌دهد، اینجا دروازه. فعلاً کل جمله را یاد بگیرید. درس ۳ دقیقاً توضیح می‌دهد *را* کجا می‌آید.'
  prs.a2.unit22.lesson01.teach.compound_rule:
    title: 'فعل‌های مرکب در گذشته: شناسه روی فعل کمکی می‌آید'
    gloss: من بیدار شدم، تو بیدار شدی، او بیدار شد، ما بیدار شدیم، شما بیدار شدید (رسمی یا جمع)، آن‌ها بیدار شدند
    note: 'بسیاری از فعل‌های رایج در دری فعل مرکب هستند: یک اسم یا صفت به‌اضافهٔ یک فعل سبک مثل *شدن* یا *کردن*. *بیدار شدن* (از خواب بیدار شدن)، *آماده شدن* (آماده شدن) و *باز کردن* (باز کردن) همه فعل مرکب‌اند. در گذشتهٔ ساده بخش اول هیچ‌وقت تغییر نمی‌کند. فقط فعل سبک شناسه‌ای را می‌گیرد که از *رفتم* می‌شناسید: مصدر را بردارید، *ن* را بیندازید (*شدن* می‌شود *شد*) و بعد *-م، -ی، nothing، -یم، -ین، -ند* را اضافه کنید. پس *بیدار شدم* یعنی «بیدار شدم»، *بیدار شدی* یعنی «بیدار شدی» (به دوست)، *بیدار شد* یعنی «او بیدار شد»، *بیدار شدیم* یعنی «بیدار شدیم»، *بیدار شدین* یعنی «بیدار شدید» (رسمی یا جمع) و *بیدار شدند* یعنی «بیدار شدند». آوردن ضمیر اختیاری است، چون شناسه نشان می‌دهد کار را چه کسی انجام داده است.'
  prs.a2.unit22.lesson02.teach.take_shower:
    title: دوش گرفتن
    gloss: دوش گرفتن
    note: '*دوش گرفتن* یعنی دوش گرفتن. فعل سبک در اینجا *گرفتن* است. ریشهٔ ماضی آن *گرفت* است، پس «دوش گرفتم» می‌شود *دوش گرفتم*.'
    example_gloss: امروز صبح دوش گرفتم.
  prs.a2.unit22.lesson02.teach.take_walk:
    title: قدم زدن
    gloss: قدم زدن، پیاده‌روی کردن
    note: '*قدم* یعنی گام. *قدم زدن* یعنی برای تفریح و بدون مقصد راه رفتن. فعل سبک *زدن* است و ریشهٔ ماضی آن *زد*: *قدم زدم* یعنی «قدم زدم». با *پیاده رفتن* مقایسه کنید که یعنی پیاده به جایی رفتن.'
    example_gloss: در پارک قدم زدم.
  prs.a2.unit22.lesson02.teach.talk:
    title: حرف زدن
    gloss: حرف زدن، صحبت کردن
    note: '*حرف* یعنی کلمه یا سخن. *حرف زدن* یعنی صحبت کردن، باز هم با *زدن*: *حرف زدم* یعنی «حرف زدم».'
    example_gloss: با دوستم حرف زدم.
  prs.a2.unit22.lesson02.teach.my_friend:
    title: دوستم
    gloss: دوستم
    note: '*دوست* یعنی دوست و *-م* معنی «من» (مالکیت) را اضافه می‌کند: *دوستم* یعنی «دوستم». وقتی به او تلفن می‌زنید، *به* را پیش از آن می‌آورید: *به دوستم*.'
    example_gloss: امروز صبح با دوستم حرف زدم.
  prs.a2.unit22.lesson02.teach.phone:
    title: تلفن کردن
    gloss: تلفن کردن، تلفن زدن
    note: '*تیلفون* یعنی تلفن. *تیلفون کردن* یعنی تلفن زدن، فعل مرکب دیگری با *کردن*. کسی که به او تلفن می‌کنید با *به* می‌آید: *به دوستم تیلفون کردم*.'
    example_gloss: به دوستم تلفن کردم.
  prs.a2.unit22.lesson02.teach.wait:
    title: منتظر ماندن
    gloss: 'منتظر شدن، منتظر ماندن (تحت‌اللفظی: انتظار کشیدن)'
    note: '*انتظار* یعنی چشم‌به‌راه بودن. *انتظار کشیدن* یعنی منتظر ماندن. فعل سبک *کشیدن* است، به معنی کشیدن، و ریشهٔ ماضی آن *کشید*: *انتظار کشیدم* یعنی «منتظر ماندم».'
    example_gloss: در ایستگاه منتظر ماندم.
  prs.a2.unit22.lesson02.teach.get_on:
    title: سوار شدن
    gloss: سوار شدن (به اتوبوس، ماشین)
    note: '*سوار* یعنی بر چیزی نشسته یا در وسیله حاضر، و *شدن* یعنی شدن. *سوار شدن* یعنی سوار اتوبوس یا ماشین شدن. وسیله‌ای که سوارش می‌شوید با *به* می‌آید: *به بس سوار شدم*.'
    example_gloss: سوار اتوبوس شدم.
  prs.a2.unit22.lesson02.teach.get_off:
    title: پیاده شدن
    gloss: پیاده شدن (از وسیله)
    note: '*پیاده شدن* یعنی از اتوبوس یا ماشین پیاده شدن. دقت کنید: *پیاده رفتم* یعنی «پیاده رفتم» و *پیاده شدم* یعنی «پیاده شدم (از وسیله)». وسیله‌ای که از آن پیاده می‌شوید با *از* می‌آید: *از بس پیاده شدم*.'
    example_gloss: از اتوبوس پیاده شدم.
  prs.a2.unit22.lesson02.teach.put_on:
    title: پوشیدن
    gloss: پوشیدن (لباس)
    note: '*پوشیدن* یعنی لباس پوشیدن. فعل ساده است، نه مرکب: ریشهٔ ماضی آن *پوشید* است، پس *پوشیدم* یعنی «پوشیدم».'
    example_gloss: لباس‌هایم را پوشیدم.
  prs.a2.unit22.lesson02.teach.close:
    title: بستن
    gloss: بستن
    note: '*بستن* یعنی بستن. فعل ساده‌ای با ریشهٔ ماضی *بست* است، پس *بستم* یعنی «بستم». متضاد *باز کردن* است.'
    example_gloss: در را بستم.
  prs.a2.unit22.lesson02.teach.arrive:
    title: رسیدن
    gloss: رسیدن
    note: '*رسیدن* یعنی رسیدن. جایی که به آن می‌رسید با *به* می‌آید و ریشهٔ ماضی *رسید* است: *به دفتر رسیدم* یعنی «به دفتر رسیدم».'
    example_gloss: به دفتر رسیدم.
  prs.a2.unit22.lesson02.teach.light_verbs:
    title: پنج فعل سبک و ریشه‌های ماضی آن‌ها
    gloss: بیدار شدم، باز کردم، دوش گرفتم، قدم زدم، منتظر ماندم
    note: 'فعل مرکب معنایش را از هر دو بخش می‌گیرد، پس فعل سبک و بخش اول را با هم یاد بگیرید. این پنج فعل سبک بیشتر فعل‌های مرکب یک صبح را می‌سازند. *شدن* (ریشهٔ ماضی *شد*) یعنی شدن: *بیدار شدم*، *سوار شدم*. *کردن* (*کرد*) یعنی انجام دادن یا ساختن: *باز کردم*، *تیلفون کردم*. *گرفتن* (*گرفت*) یعنی گرفتن: *دوش گرفتم*. *زدن* (*زد*) یعنی ضربه زدن، ولی در فعل‌های مرکب فقط حامل کار است: *قدم زدم*، *حرف زدم*. *کشیدن* (*کشید*) یعنی کشیدن: *انتظار کشیدم*. شناسه مثل *رفتم* به ریشهٔ فعل سبک اضافه می‌شود. فعل‌های ساده‌ای مثل *پوشیدن* (*پوشیدم*)، *بستن* (*بستم*) و *رسیدن* (*رسیدم*) هم همین شناسه‌ها را می‌گیرند.'
  prs.a2.unit22.lesson03.teach.neg_rule:
    title: 'منفی کردن فعل مرکب: ن روی فعل سبک می‌آید'
    gloss: بیدار نشدم، بیدار نشدی، او بیدار نشد، بیدار نشدیم، بیدار نشدید (رسمی یا جمع)، بیدار نشدند
    note: 'در درس ۱۹ *ن* را پیش از فعل ماضی ساده گذاشتید: *رفتم* شد *نرفتم*. فعل مرکب دو بخش دارد و *ن* روی فعل سبک می‌آید، نه روی بخش اول. *بیدار شدم* (بیدار شدم) می‌شود *بیدار نشدم* (بیدار نشدم) و شش صورت آن این است: *بیدار نشدم، بیدار نشدی، بیدار نشد، بیدار نشدیم، بیدار نشدین، بیدار نشدند*. همین قاعده برای هر فعل سبک کار می‌کند: *نکردم، نگرفتم، نزدم، نکشیدم*. نوشتن *نبیدار شدم* غلط است. فعل‌های ساده مثل قبل‌اند: *نپوشیدم، نبستم، نرسیدم*. در ماضی ساده منفی هنوز *نمی* نداریم.'
  prs.a2.unit22.lesson03.teach.neg_phone_walk:
    title: همان ن با پنج فعل سبک
    gloss: تلفن نکردم، قدم نزدم، منتظر نماندم، دوش نگرفتم، باز نکردم
    note: 'به پنج فعل سبک درس قبل نگاه کنید و روی هر کدام *ن* بگذارید: *کردم* می‌شود *نکردم* (*تیلفون نکردم*، *باز نکردم*)، *زدم* می‌شود *نزدم* (*قدم نزدم*)، *کشیدم* می‌شود *نکشیدم* (*انتظار نکشیدم*)، *گرفتم* می‌شود *نگرفتم* (*دوش نگرفتم*). بخش اول سر جایش می‌ماند و فعلِ بعد از آن منفی می‌شود.'
  prs.a2.unit22.lesson03.teach.no_breakfast:
    title: صبحانه نخوردم
    gloss: صبحانه نخوردم.
    note: '*نخوردم* یعنی *ن* به‌علاوهٔ *خوردم*. *خوردن* فعل ساده است، پس *ن* پیش از کل فعل می‌آید. در درس ۱۹ *خوردی* را دیدید، یعنی «خوردی» (به دوست): *صبحانه خوردی؟* یعنی «صبحانه خوردی؟»'
  prs.a2.unit22.lesson03.teach.on_time:
    title: سر وقت
    gloss: سر وقت
    note: '*وقت* یعنی زمان. *به وقت* یعنی سر وقت. پیش از فعل می‌آید، پس *به وقت بیدار نشدم* یعنی «سر وقت بیدار نشدم».'
    example_gloss: امروز صبح سر وقت بیدار نشدم.
  prs.a2.unit22.lesson03.teach.make_tea:
    title: درست کردن
    gloss: 'درست کردن، آماده کردن (تحت‌اللفظی: درست کردن)'
    note: '*درست* یعنی صحیح، و *درست کردن* یعنی چیزی مثل چای یا غذا را آماده کردن. فعل مرکب با *کردن* است. مفعول جلوتر می‌آید: *چای درست کردم*.'
    example_gloss: چای درست کردم.
  prs.a2.unit22.lesson03.teach.ra_rule:
    title: جای را در فعل مرکب
    gloss: در را باز کردم. در را باز نکردم. لباس‌هایم را نپوشیدم. چای درست کردم.
    note: 'وقتی مفعول فعل چیزی معین و مشخص باشد (*دروازه*، همان دروازه‌ای که هر صبح باز می‌کنید، یا *لباس‌هایم*، لباس‌های خودتان)، در دری با *را* نشان داده می‌شود. در فعل مرکب *را* بلافاصله بعد از مفعول و پیش از بخش اول فعل می‌آید: *دروازه را باز کردم*، نه وسط *باز کردم*. فعل مرکب یک‌جا می‌ماند و منفی هم همان قاعدهٔ قبل را دارد: *دروازه را باز نکردم*. وقتی مفعول معین نیست، مثل *چای درست کردم* (چای درست کردم، مقداری چای)، *را* نمی‌آید.'
  prs.a2.unit22.lesson04.teach.first:
    title: اول
    gloss: اول
    note: '*اول* شروع یک ترتیب را نشان می‌دهد. در ابتدای جملهٔ اول می‌آید.'
    example_gloss: اول دوش گرفتم.
  prs.a2.unit22.lesson04.teach.then:
    title: بعد
    gloss: بعد، سپس
    note: '*بعد* ترتیب را بعد از *اول* ادامه می‌دهد. در ابتدای جمله‌ای که معرفی می‌کند می‌آید.'
    example_gloss: بعد لباس‌هایم را پوشیدم.
  prs.a2.unit22.lesson04.teach.after_that:
    title: بعد از آن
    gloss: بعد از آن
    note: '*بعد از آن* یعنی بعد از آن. کمی کامل‌تر از *بعد* است و وقتی یک بار *بعد* گفته‌اید و مرحلهٔ سومی دارید به کار می‌آید.'
    example_gloss: بعد از آن در را بستم.
  prs.a2.unit22.lesson04.teach.finally:
    title: در آخر
    gloss: در آخر، سرانجام
    note: '*در آخر* یک ترتیب را بعد از *اول*، *بعد* و *بعد از آن* می‌بندد. *آخر* یعنی پایان.'
    example_gloss: در آخر به دفتر رسیدم.
  prs.a2.unit22.lesson04.teach.but:
    title: اما
    gloss: ولی
    note: '*ولی* کاری را که انجام داده‌اید در برابر کاری که انجام نداده‌اید قرار می‌دهد، یا برعکس.'
    example_gloss: صبحانه نخوردم، ولی چای خوردم.
  prs.a2.unit22.lesson04.teach.no:
    title: نه
    gloss: نه
    note: '*نخیر* «نه»ی مؤدبانه و روزمره برای جواب دادن به پرسش بله‌/نه است. بین دوستان ممکن است *نی* را هم که کوتاه‌تر است بشنوید.'
    example_gloss: نه، تلفن نکردم.
  prs.a2.unit22.lesson04.teach.start_work:
    title: شروع کردن
    gloss: شروع کردن
    note: '*شروع* یعنی آغاز و *شروع کردن* یعنی آغاز کردن. فعل مرکب با *کردن* است و *کار* یعنی کار: *کار را شروع کردم* یعنی «کار را شروع کردم».'
    example_gloss: کار را شروع کردم.
  prs.a2.unit22.lesson04.teach.order_rule:
    title: تعریف کردن یک صبح به ترتیب
    gloss: اول دوش گرفتم، بعد لباس‌هایم را پوشیدم، بعد از آن در را باز کردم و در آخر پیاده به دفتر رفتم.
    note: 'برای تعریف کردن یک صبح، برای هر مرحلهٔ تمام‌شده یک فعل ماضی بیاورید و ترتیب را با *اول*، *بعد*، *بعد از آن* و *در آخر* نشان دهید. مرحله‌ها به همان ترتیبی که اتفاق افتاده‌اند می‌آیند. آن‌ها را با ویرگول، نقطه یا *و* به هم وصل می‌کنید: *اول دوش گرفتم، بعد لباس‌هایم را پوشیدم.* برای مرحله‌ای که اتفاق نیفتاده، فعل مرکب منفی بیاورید: *بعد از آن تیلفون نکردم.* کلمهٔ ربط در ابتدای جملهٔ خودش می‌آید و فعل آخر جمله می‌ماند.'
  prs.a2.unit22.lesson05.teach.way:
    title: راه
    gloss: راه، مسیر؛ در راه (با در)
    note: '*راه* یعنی راه یا مسیر. *در راه* یعنی در مسیر. نشان می‌دهد در کجای سفر اتفاقی افتاده است.'
    example_gloss: در راه حرف زدیم.
  prs.a2.unit22.lesson05.teach.we_form:
    title: 'با هم انجام دادن: شناسهٔ ما -یم'
    gloss: با دوستم پیاده به مدرسه رفتیم. در راه حرف زدیم. در آخر به مدرسه رسیدیم.
    note: 'وقتی دوستی کارها را با شما انجام می‌دهد، شناسه را از *-م* به *-یم* تغییر دهید: *رفتیم* (رفتیم)، *حرف زدیم* (حرف زدیم)، *رسیدیم* (رسیدیم). در فعل مرکب هم شناسه فقط به فعل سبک می‌چسبد: *حرف زدیم*، نه *حرف‌یم زد*. منفی هم همین‌طور است: *حرف نزدیم* یعنی «حرف نزدیم».'
  prs.a2.unit22.lesson05.teach.message:
    title: ثریا دربارهٔ صبحش می‌نویسد
    gloss: امروز صبح زود بیدار شدم. اول دوش گرفتم و لباس‌هایم را پوشیدم. بعد صبحانه خوردم، ولی چای درست نکردم. بعد از آن در را باز کردم. با دوستم پیاده به مدرسه رفتیم. در راه حرف زدیم. در آخر به مدرسه رسیدیم.
    note: 'یک گزارش کوتاه نوشتاری، به ترتیب. هر مرحله کاری تمام‌شده است با فعل ماضی؛ در فعل‌های مرکب *بیدار شدم*، *دوش گرفتم*، *حرف زدیم* و منفی *درست نکردم* فعل سبک همیشه آخر می‌آید. یک مرحله اتفاق نیفتاده است: *چای درست نکردم*.'
  prs.a2.unit22.lesson05.teach.exchange_q:
    title: نوید از ثریا دربارهٔ چای می‌پرسد
    gloss: ثریا، امروز صبح چای درست کردی؟
    note: 'نوید با ماضی یک فعل مرکب می‌پرسد، *درست کردی*، صورت «تو» (دوست): شناسهٔ *-ی* روی فعل سبک می‌نشیند.'
  prs.a2.unit22.lesson05.teach.exchange_a:
    title: ثریا جواب می‌دهد
    gloss: نه، چای درست نکردم. صبحانه خوردم.
    note: ثریا اول می‌گوید چه کاری نشده، *چای درست نکردم*، و بعد چه کاری شده، *صبحانه خوردم*.
  prs.a2.unit22.lesson06.teach.turn01:
    title: ثریا از نوید دربارهٔ صبحش می‌پرسد
    gloss: نوید، امروز صبح چه کار کردی؟
    note: '*چه کار کردی؟* یعنی «چه کار کردی؟» دربارهٔ کاری تمام‌شده می‌پرسد، پس ماضی *کردی* را به کار می‌برد.'
  prs.a2.unit22.lesson06.teach.turn02:
    title: نوید مرحله‌های اول و مرحله‌ای را که انجام نداده می‌گوید
    gloss: اول دیر بیدار شدم، بعد دوش گرفتم و لباس‌هایم را پوشیدم. صبحانه نخوردم.
    note: نوید برای ترتیب از *اول* و *بعد* استفاده می‌کند و با یک مرحلهٔ منفی تمام می‌کند، *صبحانه نخوردم*.
  prs.a2.unit22.lesson06.teach.turn03:
    title: ثریا می‌پرسد بعدش چه شد
    gloss: بعد از آن چه کار کردی؟
    note: '*بعد از آن* یعنی «بعد از آن»، پس مرحلهٔ بعدی را می‌پرسد.'
  prs.a2.unit22.lesson06.teach.turn04:
    title: نوید می‌گوید چطور به سر کار رفته است
    gloss: در را باز کردم و پیاده به ایستگاه رفتم. در ایستگاه منتظر ماندم و سوار اتوبوس شدم.
    note: 'چهار مرحلهٔ تمام‌شده با چهار فعل ماضی: *باز کردم، رفتم، انتظار کشیدم، سوار شدم*. به *دروازه را باز کردم* دقت کنید: *را* بلافاصله بعد از مفعول می‌آید.'
  prs.a2.unit22.lesson06.teach.turn05:
    title: ثریا دربارهٔ تلفن می‌پرسد
    gloss: به من تلفن کردی؟
    note: یک پرسش بله‌/نه دربارهٔ کاری تمام‌شده. *به من* یعنی «به من».
  prs.a2.unit22.lesson06.teach.turn06:
    title: نوید «نه» می‌گوید و گزارشش را تمام می‌کند
    gloss: نه، تلفن نکردم. ولی در آخر به دفتر رسیدم.
    note: '*نخیر، تیلفون نکردم* با فعل مرکب منفی جواب می‌دهد. بعد *ولی در آخر* گزارش را می‌بندد.'
exercises:
  prs.a2.unit22.lesson01.exercise01.recognize_woke_late:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: امروز صبح دیر از خواب بیدار شدم
    distractors:
    - امروز صبح زود از خواب بیدار شدم
    - امروز صبح دیر آماده شدم
    - دیروز صبح دیر از خواب بیدار شدم
    accepted_answers:
    - value: امروز صبح دیر از خواب بیدار شدم
      status: correct
    feedback: '*بیدار شدم* یعنی «از خواب بیدار شدم» و *دیر* یعنی «دیر»: *امروز صبح دیر بیدار شدم* یعنی «امروز صبح دیر از خواب بیدار شدم».'
  prs.a2.unit22.lesson01.exercise02.recognize_opened_gate:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: دروازه را باز کردم
    distractors:
    - در حیاط را بستم
    - به طرف در حیاط رفتم
    - در حیاط را باز نکردم
    accepted_answers:
    - value: دروازه را باز کردم
      status: correct
    feedback: '*باز کردم* یعنی «باز کردم»: *باز* به‌علاوهٔ گذشتهٔ *کردن* با شناسهٔ *-م*.'
  prs.a2.unit22.lesson01.exercise03.recognize_by_bus:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: با اتوبوس به دفتر رفتم
    distractors:
    - پیاده به دفتر رفتم
    - با ماشین به دفتر رفتم
    - با اتوبوس به مدرسه رفتم
    accepted_answers:
    - value: با اتوبوس به دفتر رفتم
      status: correct
    feedback: '*با بس* یعنی «با اتوبوس». *پیاده* یعنی «پیاده» و *با موتر* یعنی «با ماشین».'
  prs.a2.unit22.lesson01.exercise04.match_morning_words:
    instruction: هر کلمهٔ دری را با معنی‌اش جفت کنید.
    accepted_answers:
    - value:
        بس: اتوبوس
        موتر: ماشین
        پیاده: پیاده
        ایستگاه: ایستگاه اتوبوس
        دفتر: دفتر
        مکتب: مدرسه
        دروازه: دروازه
        لباس‌هایم: لباس‌هایم
        دوش: دوش
        چای: چای
      status: correct
    feedback: این‌ها مکان‌ها، راه‌های رفت‌وآمد و کارهای صبح هستند که در بقیهٔ درس به کار می‌روند.
    pairs:
    - left: بس
      right: اتوبوس
    - left: موتر
      right: ماشین
    - left: پیاده
      right: پیاده
    - left: ایستگاه
      right: ایستگاه اتوبوس
    - left: دفتر
      right: دفتر
    - left: مکتب
      right: مدرسه
    - left: دروازه
      right: دروازه
    - left: لباس‌هایم
      right: لباس‌هایم
    - left: دوش
      right: دوش
    - left: چای
      right: چای
  prs.a2.unit22.lesson01.exercise05.order_woke_late:
    instruction: 'کلمه‌ها را مرتب کنید تا بگویید: امروز صبح دیر از خواب بیدار شدم.'
    accepted_answers:
    - value:
      - امروز
      - صبح
      - دیر
      - بیدار
      - شدم
      status: correct
    feedback: در *امروز صبح دیر بیدار شدم* زمان اول می‌آید و فعل مرکب آخر جمله.
  prs.a2.unit22.lesson01.exercise06.translate_got_ready:
    instruction: 'به دری ترجمه کنید و از گذشتهٔ آماده شدن استفاده کنید: امروز صبح آماده شدم.'
    accepted_answers:
    - value: امروز صبح آماده شدم
      status: correct
    - value: من امروز صبح آماده شدم
      status: correct
    - value: صبح آماده شدم
      status: correct
    - value: من صبح آماده شدم
      status: correct
    - value: امروز صبح من آماده شدم
      status: correct
    feedback: '*امروز صبح آماده شدم* یعنی «امروز صبح آماده شدم». آوردن *من* اختیاری است، چون شناسهٔ *-م* خودش «من» را نشان می‌دهد.'
  prs.a2.unit22.lesson02.exercise01.recognize_waited:
    instruction: این فعل چه معنی‌ای دارد؟
    correct_option: منتظر شدم
    distractors:
    - قدم زدم
    - حرف زدم
    - تلفن کردم
    accepted_answers:
    - value: منتظر شدم
      status: correct
    feedback: '*انتظار کشیدم* یعنی «منتظر ماندم»: *انتظار* به‌علاوهٔ گذشتهٔ *کشیدن* با شناسهٔ *-م*.'
  prs.a2.unit22.lesson02.exercise02.recognize_got_on:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: سوار اتوبوس شدم
    distractors:
    - از اتوبوس پیاده شدم
    - منتظر اتوبوس ماندم
    - به ایستگاه اتوبوس رفتم
    accepted_answers:
    - value: سوار اتوبوس شدم
      status: correct
    feedback: '*سوار شدم* یعنی «سوار شدم». «پیاده شدن» می‌شود *پیاده شدم*.'
  prs.a2.unit22.lesson02.exercise03.match_compound_verbs:
    instruction: هر فعل دری را به معنی‌اش وصل کنید.
    accepted_answers:
    - value:
        بیدار شدم: بیدار شدم
        دوش گرفتم: دوش گرفتم
        قدم زدم: قدم زدم
        حرف زدم: حرف زدم
        تیلفون کردم: تلفن کردم
        انتظار کشیدم: منتظر شدم
        سوار شدم: سوار شدم
        پیاده شدم: پیاده شدم
        باز کردم: باز کردم
        بستم: بستم
        رسیدم: رسیدم
      status: correct
    feedback: در همهٔ فعل‌های مرکب، بخش اول ثابت می‌ماند و فقط فعل کمکی شناسهٔ گذشته می‌گیرد.
    pairs:
    - left: بیدار شدم
      right: بیدار شدم
    - left: دوش گرفتم
      right: دوش گرفتم
    - left: قدم زدم
      right: قدم زدم
    - left: حرف زدم
      right: حرف زدم
    - left: تیلفون کردم
      right: تلفن کردم
    - left: انتظار کشیدم
      right: منتظر شدم
    - left: سوار شدم
      right: سوار شدم
    - left: پیاده شدم
      right: پیاده شدم
    - left: باز کردم
      right: باز کردم
    - left: بستم
      right: بستم
    - left: رسیدم
      right: رسیدم
  prs.a2.unit22.lesson02.exercise04.order_waited_got_on:
    instruction: 'کلمه‌ها را مرتب کنید تا بگویید: در ایستگاه منتظر ماندم و سوار اتوبوس شدم.'
    accepted_answers:
    - value:
      - در
      - ایستگاه
      - انتظار
      - کشیدم
      - و
      - به
      - بس
      - سوار
      - شدم
      status: correct
    feedback: '*در ایستگاه انتظار کشیدم و به بس سوار شدم* دو کار تمام‌شده دارد که هرکدام فعل گذشتهٔ خودش را دارد و با *و* به هم وصل شده‌اند.'
  prs.a2.unit22.lesson02.exercise05.complete_took_shower:
    instruction: 'جمله را کامل کنید: امروز صبح دوش گرفتم.'
    accepted_answers:
    - value: گرفتم
      status: correct
