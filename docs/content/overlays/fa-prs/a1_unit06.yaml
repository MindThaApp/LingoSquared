teaching:
  prs.a1.unit06.lesson01.teach.straight:
    title: مستقیم
    gloss: مستقیم
    note: مستقیم برای رفتن به سمت جلو و بدون پیچیدن به کار می‌رود.
    example_gloss: مستقیم بروید.
  prs.a1.unit06.lesson01.teach.left:
    title: چپ
    gloss: چپ
    note: چپ یکی از جهت‌هاست.
    example_gloss: به چپ بپیچید.
  prs.a1.unit06.lesson01.teach.right:
    title: راست
    gloss: راست
    note: راست یکی از جهت‌هاست.
    example_gloss: به راست بپیچید.
  prs.a1.unit06.lesson01.teach.turn_verb:
    title: بپیچید (امر محترمانه)
    gloss: بپیچید
    note: بپیچین شکل امر محترمانهٔ فعل «پیچیدن» است و وقتی به کسی آدرس می‌دهید به کار می‌رود.
    example_gloss: به راست بپیچید.
  prs.a1.unit06.lesson01.teach.to_word:
    title: به / به سمت
    gloss: به / به سمت
    note: به همراه یک واژهٔ جهت می‌آید، مثل به چپ (به سمت چپ).
    target_text: به (به سمت)
  prs.a1.unit06.lesson02.teach.go_straight:
    title: گفتن «مستقیم بروید» به کسی
    gloss: مستقیم برو.
    note: مستقیم بروین دستور پایهٔ آدرس‌دادن است، به شکل امر محترمانه.
  prs.a1.unit06.lesson02.teach.turn_left:
    title: گفتن «به چپ بپیچید» به کسی
    gloss: به چپ بپیچ.
    note: به چپ بپیچین یعنی «به سمت چپ بپیچید».
  prs.a1.unit06.lesson02.teach.turn_right:
    title: گفتن «به راست بپیچید» به کسی
    gloss: به راست بپیچ.
    note: به راست بپیچین همان الگو را دارد، فقط به‌جای چپ، راست می‌آید.
  prs.a1.unit06.lesson03.teach.first_word:
    title: اول
    gloss: اول
    note: اول مرحلهٔ نخست را در یک آدرس چندمرحله‌ای نشان می‌دهد.
    example_gloss: اول مستقیم بروید.
  prs.a1.unit06.lesson03.teach.then_word:
    title: بعد
    gloss: بعد / آن موقع
    note: بعد مرحلهٔ بعدی را بعد از مرحلهٔ اول نشان می‌دهد.
    example_gloss: بعد به چپ بپیچ.
  prs.a1.unit06.lesson03.teach.sequenced_example:
    title: ترکیب دو مرحله از آدرس
    gloss: اول مستقیم بروید، بعد به راست بپیچید.
    note: با اول و بعد می‌توانید چند مرحله از آدرس را در یک جمله پشت سر هم بگویید.
  prs.a1.unit06.lesson04.teach.polite_ask:
    title: مؤدبانه پرسیدن راه رسیدن به یک جا
    gloss: می‌توانید بگویید چطور به بازار بروم؟
    note: می‌توانین بگویین...؟ روش مؤدبانه برای پرسیدن «می‌توانید بگویید...؟» است و برای پرسیدن آدرس از یک غریبه مناسب است. بروم یعنی «بروم»، پس کل جمله می‌پرسد چطور می‌توانم به آن‌جا برسم.
  prs.a1.unit06.lesson04.teach.bebakhshid_review:
    title: پرسیدن جای یک مکان (مرور)
    gloss: ببخشید، داروخانه کجاست؟
    note: ببخشین، [مکان] کجاست؟ در درس مکان‌ها آمد؛ شروع طبیعی‌ای است پیش از پرسیدن آدرس.
  prs.a1.unit06.lesson04.teach.fahmidam:
    title: تأیید کردن این‌که فهمیده‌اید
    gloss: خیلی ممنون، فهمیدم.
    note: تشکر زیاد، فهمیدم گفتگو را مؤدبانه تمام می‌کند و نشان می‌دهد آدرس را فهمیده‌اید.
  prs.a1.unit06.lesson04.teach.daftar_review:
    title: دفتر (مرور)
    gloss: دفتر (محل کار)
    note: دفتر قبلاً در یک واحد پیشین آمده بود؛ این‌جا به‌عنوان مقصد برای تمرین الگوی مؤدبانهٔ آدرس‌پرسی به کار رفته است.
    example_gloss: دفتر نزدیک است.
  prs.a1.unit06.lesson05.teach.after_word:
    title: بعد از
    gloss: بعد از
    note: بعد از نشانه‌ای را مشخص می‌کند که پیش از مقصد قرار دارد.
    example_gloss: بعد از مسجد، بانک است.
  prs.a1.unit06.lesson05.teach.opposite_review:
    title: روبه‌رو / مقابل
    gloss: روبه‌رو / مقابل
    note: روبه‌رو هم‌معنی تازه‌ای برای مقابل است که در درس مکان‌ها آمد؛ هر دو در دریِ روزمره برای «مقابل» به کار می‌روند.
    example_gloss: بانک روبه‌روی مسجد است.
  prs.a1.unit06.lesson05.teach.landmark_example:
    title: آدرس دادن با نشانه
    gloss: بعد از مسجد، بانک روبه‌روی شماست.
    note: بعد از مسجد، بانک روبه‌روی شماست یک نشانه (بعد از مسجد) را با یک موقعیت نسبی (روبه‌روی شماست) ترکیب می‌کند.
  prs.a1.unit06.lesson05.teach.maktab_review:
    title: مدرسه (مرور)
    gloss: مدرسه
    note: مکتب در درس مکان‌ها آمد؛ این‌جا به‌عنوان نشانه در جملهٔ تمرین به کار رفته است.
    example_gloss: مدرسه نزدیک است.
  prs.a1.unit06.lesson06.teach.turn01:
    title: سهیلا آدرس می‌پرسد
    gloss: سهیلا مؤدبانه از یک مغازه‌دار می‌پرسد چطور به داروخانه برود.
    note: ببخشین سؤال را محترمانه شروع می‌کند و می‌توانین بگویین؟ عبارت مؤدبانهٔ آدرس‌پرسی از درس چهارم است.
  prs.a1.unit06.lesson06.teach.turn02:
    title: مغازه‌دار مرحلهٔ اول را می‌گوید
    gloss: مغازه‌دار تأیید می‌کند و می‌گوید اول مستقیم بروید.
    note: اول مستقیم بروین آغاز ترتیب راهنمایی‌هاست.
  prs.a1.unit06.lesson06.teach.turn03:
    title: سهیلا تأیید می‌کند و می‌پرسد بعدش چه؟
    gloss: سهیلا برای اطمینان «مستقیم» را تکرار می‌کند و بعد می‌پرسد مرحلهٔ بعد چیست.
    note: بعد چطور؟ راه طبیعی و کوتاه برای پرسیدن مرحلهٔ بعدی است.
  prs.a1.unit06.lesson06.teach.turn04:
    title: مغازه‌دار مرحلهٔ دوم و نشانه را می‌گوید
    gloss: مغازه‌دار می‌گوید به چپ بپیچید، بعد با مسجد و بانک به‌عنوان نشانه جای داروخانه را مشخص می‌کند.
    note: این جمله دستور پیچیدن از درس دوم را با الگوی نشانه از درس پنجم ترکیب می‌کند.
  prs.a1.unit06.lesson06.teach.turn05:
    title: سهیلا تشکر می‌کند و می‌گوید فهمید
    gloss: سهیلا خیلی تشکر می‌کند و می‌گوید فهمید.
    note: تشکر زیاد، فهمیدم گفتگو را تمام می‌کند، همان‌طور که در درس چهارم یاد گرفتید.
  prs.a1.unit06.lesson06.teach.turn06:
    title: پاسخ فروتنانه و خداحافظی مغازه‌دار
    gloss: مغازه‌دار تشکر را ردّ می‌کند و برایش سفر خوش آرزو می‌کند.
    note: قابلی نداره در درس مکان‌ها آمد؛ سفر خوش (سفر بخیر) خداحافظی طبیعی برای کسی است که می‌خواهد پیاده جایی برود.
