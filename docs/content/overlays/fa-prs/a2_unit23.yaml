  prs.a2.unit23.lesson02.exercise05.complete_tea:
    instruction: 'جمله را با ماضی استمراری کامل کنید: هر روز صبح چای می‌خوردم.'
    accepted_answers:
    - value: می‌خوردم
      status: correct
    feedback: '*می‌خوردم* ماضی استمراری *خوردن* با پایان *-م* است. *می‌* عادت را نشان می‌دهد و *-م* «من» را.'
  prs.a2.unit23.lesson02.exercise06.translate_read:
    instruction: 'به دری ترجمه کنید، با می‌ و ریشهٔ گذشتهٔ خواندن: هر شب کتاب می‌خواندم.'
    accepted_answers:
    - value: هر شب کتاب می‌خواندم.
      status: correct
    - value: من هر شب کتاب می‌خواندم.
      status: correct
    - value: هر شب یک کتاب می‌خواندم.
      status: correct
    - value: من هر شب یک کتاب می‌خواندم.
      status: correct
    feedback: '*هر شب کتاب می‌خواندم.* یعنی «هر شب کتاب می‌خواندم.» *من* و *یک* اختیاری هستند.'
  prs.a2.unit23.lesson03.exercise01.recognize_one_day:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: یک روز به بازار رفتم
    distractors:
    - هر روز به بازار می‌رفتم
