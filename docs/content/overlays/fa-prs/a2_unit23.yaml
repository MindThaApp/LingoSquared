    - left: می‌کردم
      right: می‌کردم
    - left: می‌دیدم
      right: می‌دیدم
    - left: می‌آمدم
      right: می‌آمدم
    - left: می‌خواندم
      right: می‌خواندم
    - left: بودم
      right: بودم
    - left: داشتم
      right: داشتم
    - left: می‌خوردی
      right: تو می‌خوردی (به دوست)
    - left: می‌آمد
      right: او می‌آمد
    - left: می‌کردند
      right: آن‌ها می‌کردند
