teaching:
  prs.a2.unit23.lesson01.teach.before:
    title: قبلاً، در گذشته
    gloss: قبلاً، در گذشته، سابقاً
    note: '*قبلاً* به زمانی پیش‌تر از زندگی شما برمی‌گردد. این واژه شروع بیشتر جمله‌های «زندگی قبلاً چطور بود» است: *قبلاً در هرات زندگی می‌کردم.* خود قبلاً فعل را استمراری نمی‌کند؛ این کار را خود فعل می‌کند، چنان‌که پایین‌تر می‌بینید.'
    example_gloss: قبلاً در هرات زندگی می‌کردم.
  prs.a2.unit23.lesson01.teach.now:
    title: الان
    gloss: حالا، اکنون
    note: '*حالا* یعنی اکنون و نیمهٔ دیگر هر مقایسهٔ «قبلاً و حالا» است. فعل بعد از *حالا* حال ساده است: *حالا در کابل زندگی می‌کنم.*'
    example_gloss: حالا در کابل زندگی می‌کنم.
  prs.a2.unit23.lesson01.teach.every_day:
    title: هر روز
    gloss: هر روز
    note: '*هر* یعنی همه و *روز* یعنی روز. *هر روز* روشن‌ترین عبارت زمانی برای کار تکراری است، هم در گذشته و هم در حال.'
    example_gloss: هر روز به مدرسه می‌رفتم.
  prs.a2.unit23.lesson01.teach.always:
    title: همیشه
    gloss: همیشه
    note: '*همیشه* یعنی در همهٔ زمان‌ها. مثل *هر روز* به‌طور طبیعی با عادت می‌آید و به شنونده می‌فهماند که کاری بارها و بارها تکرار می‌شد.'
    example_gloss: همیشه با دوستانم بازی می‌کردم.
  prs.a2.unit23.lesson01.teach.when_small:
    title: وقتی کوچک بودم
    gloss: وقتی کوچک بودم، وقتی بچه بودم
    note: '*وقتی* یعنی هنگامی که، *کوچک* یعنی خُرد و *بودم* یعنی «بودم». *وقتی کوچک بودم* با هم، راه معمول شروع یک داستان از دوران کودکی است.'
  prs.a2.unit23.lesson01.teach.school:
    title: مدرسه
    gloss: مدرسه
    note: '*مکتب* در افغانستان واژهٔ رایج برای مدرسه است. به دانش‌آموز *شاگرد* می‌گویند، ولی اینجا فقط به *مکتب* نیاز دارید.'
    example_gloss: من هر روز به مدرسه می‌روم.
  prs.a2.unit23.lesson01.teach.on_foot:
    title: پیاده
    gloss: پیاده
    note: '*پیاده* یعنی با پا. قبل از فعل می‌آید: *پیاده به مکتب می‌رفتم* یعنی «پیاده به مدرسه می‌رفتم».'
    example_gloss: پیاده به مدرسه می‌روم.
  prs.a2.unit23.lesson01.teach.cities:
    title: هرات، کابل
    gloss: هرات، کابل
    note: '*هرات* و *کابل* دو شهر افغانستان هستند. قبل از اسم شهر *در* می‌آید: *در هرات* یعنی در هرات، *در کابل* یعنی در کابل.'
    example_gloss:
    - او در هرات است.
    - ما در کابل هستیم.
  prs.a2.unit23.lesson01.teach.to_live:
    title: زندگی کردن
    gloss: زندگی کردن، سکونت داشتن
    note: '*زندگی کردن* یعنی زندگی کردن در یک مکان. *زندگی* همان زندگی است و *کردن* فعلی است که شناسه می‌گیرد: *زندگی می‌کنم* یعنی «زندگی می‌کنم».'
    example_gloss: ما در کابل زندگی می‌کنیم.
  prs.a2.unit23.lesson01.teach.go_paradigm:
    title: 'ماضی استمراری: می‌ + ریشهٔ گذشته + شناسه‌ها'
    gloss: می‌رفتم، می‌رفتی، می‌رفت، می‌رفتیم، می‌رفتید (محترمانه یا جمع)، می‌رفتند
    note: 'برای گفتن کارهایی که در گذشته بارها تکرار می‌شدند، *می‌* را پیش از ریشهٔ گذشته می‌آورید و همان شناسه‌های گذشتهٔ ساده را اضافه می‌کنید. ریشهٔ گذشتهٔ *رفتن* «رفتن» است: *رفت* (با حذف *ن* آخر). پس: *می‌رفتم* (من می‌رفتم)، *می‌رفتی* (تو، با دوست)، *می‌رفت* (او)، *می‌رفتیم* (ما)، *می‌رفتین* (شما، رسمی یا جمع) و *می‌رفتند* (آن‌ها). این را با گذشتهٔ ساده *رفتم* که یک اتفاق تمام‌شده است، و با حال *می‌روم* که از ریشهٔ حال *رو* ساخته می‌شود، مقایسه کنید. ماضی استمراری را می‌شود «می‌رفتم» یا «داشتم می‌رفتم» هم ترجمه کرد. ضمیر (*من، تو، او*) اختیاری است، چون شناسه نشان می‌دهد فاعل کیست. *می‌رفتم* را با *می‌روم* اشتباه نگیرید: فقط یک حرف پیش از شناسه فرق می‌کند، ولی اولی گذشته است و دومی حال.'
  prs.a2.unit23.lesson01.teach.do_forms:
    title: 'همان قاعده، فعل تازه: کردن'
    gloss: می‌کردم، می‌کردی، می‌کرد، می‌کردیم، می‌کردید (محترمانه یا جمع)، می‌کردند
    note: 'ریشهٔ گذشتهٔ *کردن* برابر *کرد* است. ماضی استمراری آن این است: *می‌کردم، می‌کردی، می‌کرد، می‌کردیم، می‌کردین، می‌کردند*. این فعل خیلی کاربردی است، چون بسیاری از فعل‌های دری از اسم + *کردن* ساخته می‌شوند: *زندگی کردن*، *بازی کردن*، *کار کردن*. *می‌* و شناسه همیشه به *کردن* می‌چسبند، نه به اسم: *زندگی می‌کردم* یعنی «زندگی می‌کردم».'
  prs.a2.unit23.lesson01.teach.zwnj:
    title: 'املا: بعد از می‌ و نمی‌ نیم‌فاصله می‌آید'
    gloss: می‌رفتم و نمی‌رفتم
    note: 'در نوشتار، *می‌* و *نمی‌* پیشوندهای جدا هستند و بعد از آن‌ها نیم‌فاصله (ZWNJ) می‌آید: *می‌رفتم*، *نمی‌رفتم*. به فعل نمی‌چسبند و با فاصلهٔ کامل هم جدا نمی‌شوند. اگر با کیبورد فارسی تایپ می‌کنید، بعد از *می* و *نمی* کلید نیم‌فاصله (معمولاً شیفت + اسپیس) را بزنید. همین نیم‌فاصله در جمع *ها* و در *آن‌ها* هم به کار می‌رود.'
  prs.a2.unit23.lesson02.teach.eat_paradigm:
    title: 'همان قاعده، فعل تازه: خوردن'
    gloss: می‌خوردم، می‌خوردی، می‌خورد، می‌خوردیم، می‌خوردید (محترمانه یا جمع)، می‌خوردند
    note: 'قاعدهٔ *رفتن* برای فعل‌های باقاعده کار می‌کند. *خوردن* با حذف *ن* ریشهٔ گذشتهٔ *خورد* را می‌دهد. *می‌* را جلوی آن بگذارید و شناسه‌ها را اضافه کنید: *می‌خوردم، می‌خوردی، می‌خورد، می‌خوردیم، می‌خوردین، می‌خوردند*. شکل سوم شخص مفرد همان ریشه با *می‌* است، پس *می‌خورد* یعنی «او می‌خورد (عادتاً می‌خورد)».'
  prs.a2.unit23.lesson02.teach.tea:
    title: چای
    gloss: چای
    note: '*چای* همان چای است؛ نوشیدنی‌ای که افغان‌ها تقریباً با هر وعده می‌خورند. با فعل *خوردن* می‌گویید *چای می‌خوری*، یعنی «چای می‌خوری».'
    example_gloss: هر روز صبح چای می‌خوردم.
  prs.a2.unit23.lesson02.teach.morning:
    title: صبح
    gloss: صبح
    note: '*صبح* یعنی صبح. *هر روز صبح* یعنی هر روز صبح و *هر شب* یعنی هر شب.'
    example_gloss: هر روز صبح به مدرسه می‌رفتم.
  prs.a2.unit23.lesson02.teach.night:
    title: شب
    gloss: شب
    note: '*شب* یعنی شب یا عصر. *هر شب* یعنی هر شب. این کلمه در درس‌های برنامهٔ روزانه هم آمده بود.'
    example_gloss: هر شب کتاب می‌خواندم.
  prs.a2.unit23.lesson02.teach.book:
    title: کتاب
    gloss: کتاب
    note: '*کتاب* یعنی کتاب. با *خواندن* می‌گویید *کتاب خواندن*، یعنی کتاب خواندن. با همین فعل *درس خواندن* هم می‌گویید، یعنی درس خواندن.'
    example_gloss: کتاب می‌خواندم.
  prs.a2.unit23.lesson02.teach.football:
    title: فوتبال بازی کردن
    gloss: فوتبال بازی کردن
    note: '*بازی کردن* یعنی بازی کردن و *فوتبال* همان فوتبال است. مثل بقیهٔ فعل‌های «اسم + *کردن*»، *می‌* و شناسه به *کردن* می‌چسبند: *فوتبال بازی می‌کردم*.'
    example_gloss: با دوستانم فوتبال بازی می‌کردم.
  prs.a2.unit23.lesson02.teach.after_school:
    title: بعد از مدرسه
    gloss: بعد از مدرسه
    note: '*بعد از* یعنی بعد از و بعدش اسم می‌آید: *بعد از مکتب* یعنی بعد از مدرسه.'
    example_gloss: بعد از مدرسه به خانه می‌آمدم.
  prs.a2.unit23.lesson02.teach.friends:
    title: دوستانم
    gloss: دوستانم
    note: '*دوستان* یعنی دوست‌ها و *-م* یعنی «من‌»: *دوستانم* یعنی دوستان من؛ این کلمه را قبلاً دیده‌اید. «با» در دری *با* است: *با دوستانم*.'
    example_gloss: دوستانم به خانهٔ ما می‌آمدند.
  prs.a2.unit23.lesson02.teach.more_verbs:
    title: چهار فعل دیگر، یک قاعده
    gloss: دیدن، کردن، آمدن و خواندن در ماضی استمراری
    note: 'همهٔ فعل‌های باقاعده یک شکل دارند: *ن* را از مصدر حذف کنید و *می‌* را پیش از ریشهٔ گذشته با شناسه‌ها بیاورید. *دیدن* می‌شود *می‌دیدم*. *کردن* می‌شود *می‌کردم*. *آمدن* می‌شود *می‌آمدم*؛ ریشهٔ گذشتهٔ *آمد* بعد از *می‌* هم *آ* را نگه می‌دارد، پس *می‌آمدم* می‌نویسید، نه *می‌امدم*. *خواندن* می‌شود *می‌خواندم*. دری گفتاری و نوشتاری هر دو از همین شکل استفاده می‌کنند.'
  prs.a2.unit23.lesson02.teach.be_have:
    title: بودن و داشتن در گذشته
    gloss: بودم، بودی، بود، بودیم، بودید (محترمانه یا جمع)، بودند؛ داشتم، داشتی، ...
    note: 'گذشتهٔ *بودن* این است: *بودم، بودی، بود، بودیم، بودین، بودند* و گذشتهٔ *داشتن* این است: *داشتم، داشتی، داشت، داشتیم، داشتین، داشتند*. این دو فعل حالت را بیان می‌کنند، پس خودشان معنای «بودم» و «داشتم» (در گذشتهٔ مستمر) را دارند و معمولاً *می‌* نمی‌گیرند: *وقتی کوچک بودم، یک بایسکل داشتم* یعنی «وقتی کوچک بودم، یک دوچرخه داشتم».'
  prs.a2.unit23.lesson02.teach.bicycle:
    title: دوچرخه
    gloss: دوچرخه
    note: '*بایسکل* در دری یعنی دوچرخه. *یک* یعنی یک.'
    example_gloss: وقتی کوچک بودم، یک دوچرخه داشتم.
  prs.a2.unit23.lesson03.teach.contrast:
    title: یک رویداد، یک عادت، یا اکنون
    gloss: یک روز به بازار رفتم. هر روز به مدرسه می‌رفتم. حالا به دفتر می‌روم.
    note: 'سه شکل فعل شبیه هم به نظر می‌رسند، پس ببینید جمله چه می‌گوید. اگر یک رویداد تمام‌شده است، ماضی ساده می‌آید: *یک روز به بازار رفتم* (یک روز به بازار رفتم). اگر چیزی در گذشته بارها تکرار می‌شد، *می‌* + ریشهٔ گذشته می‌آید: *هر روز به مکتب می‌رفتم* (هر روز به مدرسه می‌رفتم). اگر الان درست است، *می‌* + ریشهٔ حال می‌آید: *حالا به دفتر می‌روم* (حالا به دفتر می‌روم). قیدهای زمان کمک می‌کنند: *یک روز، دیروز* با ماضی ساده می‌آیند؛ *هر روز، همیشه، قبلاً* با ماضی استمراری؛ *حالا* با حال.'
  prs.a2.unit23.lesson03.teach.one_day:
    title: یک روز
    gloss: یک روز، یک بار
    note: '*یک روز* یعنی یک روز. یک رویداد در گذشته را شروع می‌کند، پس فعل ماضی ساده است و *می‌* ندارد.'
    example_gloss: یک روز به بازار رفتم.
  prs.a2.unit23.lesson03.teach.yesterday:
    title: دیروز
    gloss: دیروز
    note: '*دیروز* یعنی دیروز. به یک روز تمام‌شده اشاره دارد، پس فعل ماضی ساده است: *دیروز به دفتر رفتم*.'
    example_gloss: دیروز به دفتر رفتم.
  prs.a2.unit23.lesson03.teach.office:
    title: دفتر
    gloss: دفتر (محل کار)
    note: '*دفتر* یعنی دفتر کار، محل کار. با *به* به آن می‌روید.'
    example_gloss: حالا هر روز به دفتر می‌روم.
  prs.a2.unit23.lesson03.teach.bus:
    title: اتوبوس
    gloss: اتوبوس
    note: '*بس* در دری یعنی اتوبوس. «با» *با* است: *با بس* یعنی با اتوبوس.'
    example_gloss: با اتوبوس به دفتر می‌روم.
  prs.a2.unit23.lesson03.teach.neg_paradigm:
    title: 'ماضی استمراری منفی: نمی + ریشهٔ گذشته'
    gloss: نمی‌رفتم، نمی‌رفتی، نمی‌رفت، نمی‌رفتیم، نمی‌رفتید (محترمانه یا جمع)، نمی‌رفتند
    note: 'برای اینکه بگویید کاری عادت نبود، به جای *می‌* از *نمی‌* استفاده کنید: *نمی‌رفتم* (نمی‌رفتم، هیچ‌وقت نمی‌رفتم)، *نمی‌رفتی، نمی‌رفت، نمی‌رفتیم، نمی‌رفتین، نمی‌رفتند*. آن را با ماضی ساده منفی *نرفتم* اشتباه نگیرید که می‌گوید یک رویداد تمام‌شده اتفاق نیفتاد. مقایسه کنید: *دیروز به مکتب نرفتم* (دیروز به مدرسه نرفتم) و *جمعه به مکتب نمی‌رفتم* (جمعه‌ها به مدرسه نمی‌رفتم، به‌عنوان عادت). با نیم‌فاصله بنویسید: *نمی‌*.'
  prs.a2.unit23.lesson03.teach.no_longer:
    title: 'دیگر نه: دیگر + منفی'
    gloss: دیگر فوتبال بازی نمی‌کنم.
    note: '*دیگر* با فعل منفی یعنی «دیگر ... نه» یا «دیگر ... نمی‌کنم»: *دیگر فوتبال بازی نمی‌کنم* یعنی «دیگر فوتبال بازی نمی‌کنم». فعل حال منفی *نمی‌کنم* است، چون جمله دربارهٔ اکنون است. برای کاری که قبلاً می‌کردید و ترک کرده‌اید، اغلب دو نیمه را کنار هم می‌آورند: *قبلاً هر روز فوتبال بازی می‌کردم، ولی دیگر بازی نمی‌کنم* (قبلاً هر روز فوتبال بازی می‌کردم، ولی دیگر بازی نمی‌کنم).'
  prs.a2.unit23.lesson04.teach.neighbourhood:
    title: محله
    gloss: محله، بخشی از شهر
    note: '*محله* همان محله است، بخشی از شهر که در آن زندگی می‌کنید. *قدیمی* یعنی کهنه و قدیمی.'
    example_gloss: خانهٔ ما در یک محلهٔ قدیمی بود.
  prs.a2.unit23.lesson04.teach.old:
    title: پیر
    gloss: قدیمی (دربارهٔ مکان یا چیز)
    note: '*قدیمی* یعنی قدیمی، برای چیزها و جاهایی که مدت‌ها وجود داشته‌اند. بعد از اسم می‌آید: *محلهٔ قدیمی*.'
    example_gloss: یک خانهٔ قدیمی داشتیم.
  prs.a2.unit23.lesson04.teach.neighbours:
    title: همسایه‌ها
    gloss: همسایه‌ها
    note: '*همسایه* یعنی همسایه. جمعش نیم‌فاصله می‌گیرد: *همسایه‌ها*. همسایه‌ها بخش مهمی از زندگی در محله‌های افغانستان هستند.'
    example_gloss: همسایه‌ها همیشه به خانهٔ ما می‌آمدند.
  prs.a2.unit23.lesson04.teach.grandmother:
    title: مادربزرگ
    gloss: مادربزرگ
    note: '*مادرکلان* در دری یعنی مادربزرگ، و کلمهٔ معیار همین است. *-م* یعنی «من‌»: *مادرکلانم* یعنی مادربزرگ من.'
    example_gloss: جمعه‌ها به دیدن مادربزرگم می‌رفتیم.
  prs.a2.unit23.lesson04.teach.fridays:
    title: جمعه‌ها
    gloss: جمعه‌ها، هر جمعه
    note: '*جمعه‌ها* (با نیم‌فاصله) یعنی هر جمعه. راه دیگری برای گفتن کاری است که بارها تکرار می‌شد.'
    example_gloss: جمعه‌ها به پارک می‌رفتیم.
  prs.a2.unit23.lesson04.teach.shop:
    title: مغازه
    gloss: مغازه
    note: '*دوکان* در دری یعنی مغازه. *در دوکان کار کردن* یعنی در مغازه کار کردن.'
    example_gloss: قبلاً در یک مغازه کار می‌کردم.
  prs.a2.unit23.lesson04.teach.where_before:
    title: قبلاً کجا زندگی می‌کردی؟
    gloss: قبلاً کجا زندگی می‌کردی؟
    note: '*کجا* یعنی کجا. دوست می‌پرسد *قبلاً کجا زندگی می‌کردی؟* با ماضی استمراری و شکل «تو». برای کسی که خوب نمی‌شناسید، *می‌کردین* بگویید.'
  prs.a2.unit23.lesson05.teach.street:
    title: خیابان
    gloss: خیابان، جاده
    note: '*سرک* در دری یعنی خیابان یا جاده. *در سرک* بازی می‌کنید یا راه می‌روید، یعنی در خیابان.'
    example_gloss: ما در خیابان بازی می‌کردیم.
  prs.a2.unit23.lesson05.teach.yes:
    title: بله
    gloss: بله
    note: '*بلی* در دری یعنی بله و ضدش *نخیر* (نه) است. برای جواب دادن به سؤال بله/خیر از *بلی* استفاده کنید.'
    example_gloss: بله، هر روز می‌رفتم.
  prs.a2.unit23.lesson05.teach.but:
    title: اما
    gloss: ولی
    note: '*ولی* دو چیز را در برابر هم می‌گذارد. در روایت «آن زمان و حالا» اغلب آنچه را قبلاً بود به آنچه فرق کرده وصل می‌کند.'
    example_gloss: قبلاً می‌رفتم، ولی حالا نمی‌روم.
  prs.a2.unit23.lesson05.teach.read_text:
    title: یک کودکی در هرات
    gloss: وقتی کوچک بودم، در هرات زندگی می‌کردیم. خانهٔ ما در یک محلهٔ قدیمی بود. هر روز صبح پیاده به مدرسه می‌رفتم. بعد از مدرسه با دوستانم در خیابان فوتبال بازی می‌کردم. جمعه‌ها به دیدن مادربزرگم می‌رفتیم. حالا در کابل زندگی می‌کنم و با اتوبوس به دفتر می‌روم. دیگر فوتبال بازی نمی‌کنم.
    note: 'یک متن کوتاه دربارهٔ کودکی در هرات. به تغییر دقت کنید: ماضی استمراری (*می‌رفتم، بازی می‌کردم، می‌رفتیم*) زندگی قدیم را توصیف می‌کند و حال (*زندگی می‌کنم، می‌روم*) اکنون را. جملهٔ آخر، *دیگر فوتبال بازی نمی‌کنم*، می‌گوید چه چیزی تمام شده است.'
  prs.a2.unit23.lesson05.teach.audio_q:
    title: سلیمه از جاوید دربارهٔ مدرسه می‌پرسد
    gloss: جاوید، هر روز به مدرسه می‌رفتی؟
    note: سلیمه با ماضی استمراری و شکل «تو»، *می‌رفتی*، دربارهٔ یک عادت گذشته می‌پرسد. این یک سؤال بله/خیر است.
  prs.a2.unit23.lesson05.teach.audio_a:
    title: جاوید جواب می‌دهد
    gloss: بله، هر روز پیاده می‌رفتم، ولی جمعه نمی‌رفتم.
    note: 'جاوید اول می‌گوید چه می‌کرد، بعد چه نمی‌کرد: *جمعه نمی‌رفتم*. ماضی استمراری منفی *نمی‌رفتم* نشان می‌دهد که او جمعه‌ها هیچ‌وقت نمی‌رفت.'
  prs.a2.unit23.lesson06.teach.turn01:
    title: سلیمه می‌پرسد جاوید قبلاً کجا زندگی می‌کرد
    gloss: جاوید، قبلاً کجا زندگی می‌کردی؟
    note: سلیمه با *می‌کردی*، ماضی استمراری و شکل «تو»، دربارهٔ گذشته می‌پرسد.
  prs.a2.unit23.lesson06.teach.turn02:
    title: جاوید کودکی‌اش را توصیف می‌کند
    gloss: وقتی کوچک بودم، در هرات زندگی می‌کردیم. هر روز پیاده به مدرسه می‌رفتم و بعد از مدرسه با دوستانم فوتبال بازی می‌کردم.
    note: 'جاوید برای هر چیزی که بارها تکرار می‌شد، ماضی استمراری به کار می‌برد: *زندگی می‌کردیم، می‌رفتم، بازی می‌کردم*.'
  prs.a2.unit23.lesson06.teach.turn03:
    title: سلیمه دربارهٔ اکنون می‌پرسد
    gloss: الان هم فوتبال بازی می‌کنی؟
    note: '*حالا هم* دربارهٔ زمان حال می‌پرسد: الان هم؟ فعل به *می‌کنی* (حال، تو) تغییر می‌کند.'
  prs.a2.unit23.lesson06.teach.turn04:
    title: جاوید می‌گوید چه چیزی عوض شده
    gloss: نه، دیگر فوتبال بازی نمی‌کنم. الان در کابل زندگی می‌کنم و با اتوبوس به اداره می‌روم. تو چطوری؟
    note: '*دیگر ... نمی‌کنم* یعنی «دیگر ... نمی‌کنم». بقیهٔ جواب او حال است، چون دربارهٔ الان است. *تو چطور؟* شکل کوتاه «تو چطوری؟» است.'
  prs.a2.unit23.lesson06.teach.turn05:
    title: سلیمه دربارهٔ کار قبلی‌اش می‌گوید
    gloss: قبلاً در یک مغازه کار می‌کردم، ولی الان در یک اداره کار می‌کنم.
    note: سلیمه ماضی استمراری *کار می‌کردم* را با حال *کار می‌کنم* مقایسه می‌کند و با *ولی* به هم وصلشان می‌کند.
  prs.a2.unit23.lesson06.teach.turn06:
    title: جاوید واکنش نشان می‌دهد
    gloss: چه خوب!
    note: '*چه خوب!* واکنشی دوستانه به یک خبر خوب است.'
exercises:
  prs.a2.unit23.lesson01.exercise01.recognize_every_day:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: هر روز به مدرسه می‌رفتم
    distractors:
    - دیروز به مدرسه رفتم
    - الان هر روز به مدرسه می‌روم
    - به مدرسه نرفتم
    accepted_answers:
    - value: هر روز به مدرسه می‌رفتم
      status: correct
    feedback: '*هر روز به مکتب می‌رفتم* یعنی «هر روز به مدرسه می‌رفتم»: *می‌* + ریشهٔ گذشته *رفت* + *-م*.'
  prs.a2.unit23.lesson01.exercise02.recognize_used_to_live:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: قبلاً در هرات زندگی می‌کردم
    distractors:
    - الان در هرات زندگی می‌کنم
    - در هرات زندگی خواهم کرد
    - در هرات زندگی نمی‌کردم
    accepted_answers:
    - value: قبلاً در هرات زندگی می‌کردم
      status: correct
    feedback: '*قبلاً در هرات زندگی می‌کردم* یعنی «قبلاً در هرات زندگی می‌کردم»: *می‌کردم* ماضی استمراری *کردن* است.'
  prs.a2.unit23.lesson01.exercise03.recognize_always_played:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: همیشه با دوستانم بازی می‌کردم
    distractors:
    - دیروز با دوستانم بازی کردم
    - هیچ‌وقت با دوستانم بازی نمی‌کردم
    - الان با دوستانم بازی می‌کنم
    accepted_answers:
    - value: همیشه با دوستانم بازی می‌کردم
      status: correct
    feedback: '*همیشه* با ماضی استمراری می‌آید: *بازی می‌کردم* یعنی «بازی می‌کردم».'
  prs.a2.unit23.lesson01.exercise04.match_go_forms:
    instruction: هر کلمهٔ دری را با معنی‌اش جفت کنید.
    accepted_answers:
    - value:
        می‌رفتم: می‌رفتم
        می‌رفتی: تو می‌رفتی (به دوست)
        می‌رفت: او می‌رفت
        می‌رفتیم: ما می‌رفتیم
        می‌رفتین: شما می‌رفتید (محترمانه یا جمع)
        می‌رفتند: آن‌ها می‌رفتند
        قبلاً: قبلاً، در گذشته
        حالا: حالا
        هر روز: هر روز
        همیشه: همیشه
      status: correct
    feedback: 'هر پایان نشان می‌دهد فاعل کیست: *-م* من، *-ی* تو (دوست)، بدون پایان او، *-یم* ما، *-ین* شما (محترمانه یا جمع)، *-ند* آن‌ها. *می‌* در ابتدا فعل گذشته را استمراری می‌کند.'
    pairs:
    - left: می‌رفتم
      right: می‌رفتم
    - left: می‌رفتی
      right: تو می‌رفتی (به دوست)
    - left: می‌رفت
      right: او می‌رفت
    - left: می‌رفتیم
      right: ما می‌رفتیم
    - left: می‌رفتین
      right: شما می‌رفتید (محترمانه یا جمع)
    - left: می‌رفتند
      right: آن‌ها می‌رفتند
    - left: قبلاً
      right: قبلاً، در گذشته
    - left: حالا
      right: حالا
    - left: هر روز
      right: هر روز
    - left: همیشه
      right: همیشه
  prs.a2.unit23.lesson01.exercise05.order_walked_school:
    instruction: 'کلمات را مرتب کنید تا بگویید: هر روز پیاده به مدرسه می‌رفتم.'
    accepted_answers:
    - value:
      - هر روز
      - پیاده
      - به
      - مکتب
      - می‌رفتم
      status: correct
    - value:
      - پیاده
      - هر روز
      - به
      - مکتب
      - می‌رفتم
      status: correct
    - value:
      - هر روز
      - به
      - مکتب
      - پیاده
      - می‌رفتم
      status: correct
    feedback: '*هر روز پیاده به مکتب می‌رفتم* اول زمان، بعد شیوه و آخر فعل استمراری را می‌آورد.'
  prs.a2.unit23.lesson01.exercise06.translate_used_to_live:
    instruction: 'به دری ترجمه کنید، با می‌ و ریشهٔ گذشته: قبلاً در هرات زندگی می‌کردم.'
    accepted_answers:
    - value: قبلاً در هرات زندگی می‌کردم.
      status: correct
    - value: در هرات زندگی می‌کردم.
      status: correct
    - value: من قبلاً در هرات زندگی می‌کردم.
      status: correct
    - value: من در هرات زندگی می‌کردم.
      status: correct
    feedback: '*قبلاً در هرات زندگی می‌کردم.* یعنی «قبلاً در هرات زندگی می‌کردم.» *قبلاً* و *من* هر دو اختیاری هستند.'
  prs.a2.unit23.lesson02.exercise01.recognize_ate:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: هر روز صبح چای می‌خوردم
    distractors:
    - امروز صبح چای خوردم
    - هر روز صبح چای می‌خورم
    - فردا صبح چای خواهم خورد
    accepted_answers:
    - value: هر روز صبح چای می‌خوردم
      status: correct
    feedback: '*می‌خوردم* ماضی استمراری *خوردن* است: *چای می‌خوردم* یعنی «چای می‌خوردم».'
  prs.a2.unit23.lesson02.exercise02.recognize_friends_came:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: دوستانم به خانهٔ ما می‌آمدند
    distractors:
    - دوستانم دیروز به خانهٔ ما آمدند
    - دوستانم دارند به خانهٔ ما می‌آیند
    - دوستانم به خانهٔ ما نیامدند
    accepted_answers:
    - value: دوستانم به خانهٔ ما می‌آمدند
      status: correct
    feedback: '*می‌آمدند* یعنی «می‌آمدند»: پایان *-ند* نشان می‌دهد که بیش از یک نفر هستند.'
  prs.a2.unit23.lesson02.exercise03.match_habitual_verbs:
    instruction: هر فعل گذشته را به معنی‌اش وصل کنید.
    accepted_answers:
    - value:
        می‌خوردم: می‌خوردم
        می‌کردم: می‌کردم
        می‌دیدم: می‌دیدم
        می‌آمدم: می‌آمدم
        می‌خواندم: می‌خواندم
        بودم: بودم
        داشتم: داشتم
        می‌خوردی: تو می‌خوردی (به دوست)
        می‌آمد: او می‌آمد
        می‌کردند: آن‌ها می‌کردند
      status: correct
    feedback: بیشتر این‌ها *می‌* + ریشهٔ گذشته + پایان هستند. *بودم* و *داشتم* حالت را نشان می‌دهند و *می‌* نمی‌گیرند.
