course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستان در سطح پیش‌میانی: توصیف اینکه زندگی قبلاً چطور بود، در کودکی، در خانه یا کار قبلی، و حالا چطور است. گذشتهٔ استمراری (می‌ به‌اضافهٔ ریشهٔ گذشته)، منفی آن، و تفاوتش با گذشتهٔ ساده و حال.'
units:
