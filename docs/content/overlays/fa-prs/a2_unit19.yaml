teaching:
  prs.a2.unit19.lesson01.teach.last_weekend:
    title: آخر هفتهٔ گذشته
    gloss: آخر هفتهٔ گذشته
    note: '*آخر هفته* یعنی پایان هفته و *گذشته* یعنی قبلی. با هم، *آخر هفتهٔ گذشته* یعنی آخر هفتهٔ پیش؛ چارچوب زمانی کل این درس.'
    example_gloss: آخر هفتهٔ گذشته به بازار رفتم.
  prs.a2.unit19.lesson01.teach.thursday_friday:
    title: پنجشنبه، جمعه
    gloss: پنجشنبه، جمعه
    note: در افغانستان جمعه تعطیل هفتگی است و بسیاری از مردم از بعدازظهر پنجشنبه آخر هفته‌شان را شروع می‌کنند؛ پس *پنجشنبه* و *جمعه* دو روزی هستند که بیشتر برای تعریف کردن آخر هفته به کار می‌برید.
    example_gloss:
    - پنجشنبه بعدازظهر به بانک رفتم.
    - جمعه به پارک رفتم.
  prs.a2.unit19.lesson01.teach.afternoon:
    title: عصر
    gloss: عصر، اواخر بعدازظهر
    note: '*عصر* یعنی اواخر بعدازظهر. بعد از نام روز می‌آید: *پنجشنبه عصر* یعنی عصر پنجشنبه.'
    example_gloss: پنجشنبه بعدازظهر به بانک رفتم.
  prs.a2.unit19.lesson01.teach.yesterday:
    title: دیروز
    gloss: دیروز
    note: '*دیروز* واژه‌ای است که در درس رویدادهای گذشته خوانده‌اید. با همان فعل ماضی‌ای می‌آید که در این درس می‌سازید.'
    example_gloss: دیروز صبحانه خوردم.
  prs.a2.unit19.lesson01.teach.in_bazaar:
    title: در بازار
    gloss: در بازار
    note: '*در* یعنی «در» یا «توی» و *بازار* همان بازار است؛ جایی برای کارهای متفرقهٔ آخر هفته.'
    example_gloss: در بازار نان و میوه خریدم.
  prs.a2.unit19.lesson01.teach.bank:
    title: بانک
    gloss: بانک
    note: '*بانک* همان بانک است. جای دیگری که مردم برای کارهایشان می‌روند.'
    example_gloss: عصر به بانک رفتم.
  prs.a2.unit19.lesson01.teach.park:
    title: پارک
    gloss: پارک
    note: '*پارک* همان پارک است؛ واژه‌ای که از درس‌های گردش و بیرون رفتن می‌شناسید.'
    example_gloss: جمعه با دوستانم به پارک رفتم.
  prs.a2.unit19.lesson01.teach.shopping:
    title: خرید کردن
    gloss: خرید کردن
    note: '*خرید کردن* راه معمول گفتن این است که خرید کرده‌اید. *خرید* همان خرید است و *کردن* فعل «انجام دادن» است.'
    example_gloss: در بازار خرید کردم.
  prs.a2.unit19.lesson01.teach.visiting:
    title: به دیدن کسی رفتن
    gloss: به دیدن کسی رفتن
    note: '*به دیدن* به‌علاوهٔ یک شخص و *رفتن* یعنی به دیدن آن شخص رفتن: *به دیدن فامیلم رفتم* یعنی به دیدن خانواده‌ام رفتم. دید و بازدید دومین موضوع بزرگ این درس است.'
    example_gloss: جمعه به دیدن خانواده‌ام رفتم.
  prs.a2.unit19.lesson01.teach.family:
    title: فامیل، خانواده و اقوام
    gloss: فامیل، خانواده و اقوام
    note: '*فامیل* یعنی خانواده و اقوام شما. با افزودن *-م* می‌شود «من‌ی»: *فامیلم* یعنی خانواده‌ام. در دری، فامیل برای خانواده و خویشاوندان به کار می‌رود.'
    example_gloss: خانواده‌ام در کابل است.
  prs.a2.unit19.lesson01.teach.errands:
    title: کار داشتن
    gloss: کار داشتن، چند کار برای انجام دادن داشتن
    note: '*کار* یعنی شغل، ولی یعنی وظیفه و کار متفرقه هم هست. *کار داشتن* یعنی چند کار برای انجام دادن داشتن. *چند* یعنی «چند تا»، «بعضی» یا «چقدر/چند».'
    example_gloss: پنجشنبه عصر چند کار داشتم.
  prs.a2.unit19.lesson01.teach.go_paradigm:
    title: 'ماضی ساده: ریشهٔ ماضی به‌علاوهٔ شناسه‌ها'
    gloss: من رفتم، تو رفتی، او رفت، ما رفتیم، شما رفتید (رسمی یا جمع)، آن‌ها رفتند
    note: 'ماضی ساده یک نظام است، نه فهرستی از واژه‌ها برای حفظ کردن. مصدر *رفتن* را بردارید و *ن* آخر را بیندازید: ریشهٔ ماضی *رفت* است. بعد شناسه را اضافه کنید: *-م* برای «من» (*رفتم*)، *-ی* برای «تو» به دوست (*رفتی*)، بدون شناسه برای «او» (*رفت*)، *-یم* برای «ما» (*رفتیم*)، *-ین* برای «شما» رسمی یا جمع (*رفتین*)، *-ند* برای «آن‌ها» (*رفتند*). ضمیر (*من، تو، او*) اختیاری است، چون شناسه نشان می‌دهد چه کسی کار را کرده. توجه کنید که ماضی *می* ندارد، ولی حال می دارد.'
  prs.a2.unit19.lesson02.teach.eat_paradigm:
    title: 'همان قاعده، فعل تازه: خوردن'
    gloss: من خوردم، تو خوردی، او خورد، ما خوردیم، شما خوردید (رسمی یا جمع)، آن‌ها خوردند
    note: 'قاعدهٔ *رفتن* تقریباً برای همهٔ فعل‌ها کار می‌کند. *خوردن* با افتادن *ن* ریشهٔ ماضی *خورد* را می‌دهد و همان شش شناسه می‌آید: *خوردم، خوردی، خورد، خوردیم، خوردین، خوردند*. صورت «او» فقط خود ریشه است، پس *خورد* یعنی او خورد.'
  prs.a2.unit19.lesson02.teach.breakfast:
    title: دیروز صبحانه خوردم
    gloss: دیروز صبحانه خوردم.
    note: '*صبحانه* همان صبحانه است؛ واژه‌ای از درس‌های برنامهٔ روزانه. *خوردم* ماضی *خوردن* با شناسهٔ *-م* است.'
  prs.a2.unit19.lesson02.teach.bread_fruit:
    title: نان و میوه
    gloss: نان و میوه
    note: '*نان* همان نان و *میوه* همان میوه است. *و* یعنی «و».'
    example_gloss: در بازار نان و میوه خریدم.
  prs.a2.unit19.lesson02.teach.more_verbs:
    title: پنج فعل دیگر، یک قاعده
    gloss: دیدن، خریدن، کردن، شدن، داشتن در ماضی
    note: 'همهٔ فعل‌های این‌جا از یک قاعده پیروی می‌کنند: *ن* را بیندازید، بعد شناسه را بیفزایید. *دیدن* *دیدم* (دیدم) و *دیدی* (دیدی) را می‌دهد. *خریدن* *خریدم* (خریدم) را می‌دهد. *کردن* *کردم* (کردم) و *کردی* (کردی) را می‌دهد. *شدن* *شدم* (شدم) را می‌دهد. *داشتن* *داشتم* (داشتم) را می‌دهد. فقط بخش آخر فعل تغییر می‌کند، نه ریشه. توجه کنید که *خرید* هم ریشهٔ ماضی *خریدن* است و هم اسم «خرید»، مثل *خرید کردن*.'
  prs.a2.unit19.lesson02.teach.movie:
    title: فیلم دیدم
    gloss: فیلم دیدم.
    note: '*فلم* یعنی فیلم. در دری می‌گویند *فلم دیدن*، یعنی فیلم دیدن، پس *دیدم* فعل است.'
  prs.a2.unit19.lesson02.teach.exercise:
    title: ورزش کردم
    gloss: ورزش کردم.
    note: '*ورزش* همان ورزش است. *ورزش کردن* یعنی ورزش کردن و شناسه به *کردن* می‌چسبد: *ورزش کردم*.'
  prs.a2.unit19.lesson02.teach.woke_late:
    title: دیر بیدار شدم
    gloss: دیر بیدار شدم.
    note: '*دیر* یعنی دیر و *بیدار شدن* یعنی از خواب بیدار شدن. *بیدار شدم* یعنی بیدار شدم و *دیر* پیش از آن می‌آید.'
  prs.a2.unit19.lesson03.teach.neg_paradigm:
    title: 'ماضی منفی: ن به‌علاوهٔ فعل ماضی'
    gloss: من نرفتم، تو نرفتی، او نرفت، ما نرفتیم، شما نرفتید (رسمی یا جمع)، آن‌ها نرفتند
    note: 'برای گفتن اینکه کاری را نکرده‌اید، *ن* را درست اول فعل ماضی بگذارید: *رفتم* می‌شود *نرفتم*. چیز دیگری تغییر نمی‌کند و همان شش شناسه می‌آید: *نرفتم، نرفتی، نرفت، نرفتیم، نرفتین، نرفتند*. در ماضی ساده منفی *نمی* نداریم. کاری که انجام نشده فقط *ن* به‌علاوهٔ فعل ماضی است.'
  prs.a2.unit19.lesson03.teach.neg_breakfast:
    title: صبحانه نخوردم
    gloss: صبحانه نخوردم.
    note: '*نخوردم* یعنی *ن* به‌علاوهٔ *خوردم*: نخوردم.'
  prs.a2.unit19.lesson03.teach.neg_more:
    title: همان ن با فعل‌های دیگر
    gloss: ندیدم، نخریدم، نداشتم، نکردم
    note: 'این قاعده برای همهٔ فعل‌هایی که تا حالا دیده‌اید کار می‌کند: *ندیدم* (ندیدم)، *نخریدم* (نخریدم)، *نداشتم* (نداشتم)، *نکردم* (نکردم). همیشه اول *ن*، بعد فعل ماضی. در چند فعلی که با آ شروع می‌شوند، املا تغییر می‌کند: *آمدم* (آمدم) می‌شود *نیامدم* (نیامدم).'
  prs.a2.unit19.lesson03.teach.neg_compound:
    title: منفی کردن فعل‌هایی که با کردن ساخته می‌شوند
    gloss: در بازار خرید نکردم. ورزش نکردم.
    note: 'بعضی فعل‌ها از یک اسم به‌علاوهٔ *کردن* ساخته می‌شوند، مثل *خرید کردن* و *ورزش کردن*. *ن* را به *کردن* بچسبانید، نه به اسم: *خرید نکردم*، *ورزش نکردم*. نوشتن *نخرید کردم* غلط است.'
  prs.a2.unit19.lesson03.teach.past_vs_present:
    title: ماضی در برابر حال
    gloss: به بازار می‌روم. / به بازار رفتم. / به بازار نرفتم.
    note: 'حال این فعل *می‌روم* (می‌روم، دارم می‌روم) است: *می* به‌علاوهٔ ریشهٔ حال *رو* به‌علاوهٔ شناسه. ماضی *رفتم* است، بدون *می*. برای منفی کردن حال *نمی‌روم* می‌گویید، ولی برای منفی کردن ماضی فقط *ن* می‌آید: *نرفتم*. ماضی را برای کار تمام‌شده، مثل آخر هفتهٔ گذشته، و حال را برای کاری که همیشه یا همین حالا انجام می‌دهید به کار ببرید.'
  prs.a2.unit19.lesson04.teach.first:
    title: اول
    gloss: اول
    note: '*اول* آغاز یک ترتیب را نشان می‌دهد. واژه‌ای است که در درس برنامهٔ هفتگی خوانده‌اید.'
    example_gloss: اول صبحانه خوردم.
  prs.a2.unit19.lesson04.teach.then:
    title: بعد، پس از آن
    gloss: بعد، پس از آن
    note: '*بعد* ترتیب را بعد از *اول* ادامه می‌دهد.'
    example_gloss: بعد به بانک رفتم.
  prs.a2.unit19.lesson04.teach.but:
    title: اما
    gloss: ولی
    note: '*ولی* کاری را که کرده‌اید به کاری که نکرده‌اید وصل می‌کند و این دو را در برابر هم می‌گذارد.'
    example_gloss: به بازار رفتم، ولی خرید نکردم.
  prs.a2.unit19.lesson04.teach.no:
    title: نه
    gloss: نه
    note: '*نخیر* «نه»ی مؤدبانه و رایج در دری است که در جواب سؤال بله/نه به کار می‌رود.'
    example_gloss: نه، فیلم ندیدم.
  prs.a2.unit19.lesson04.teach.finally:
    title: سرانجام
    gloss: سرانجام، در پایان
    note: '*در آخر* ترتیب را بعد از *اول* و *بعد* می‌بندد. هر دو واژهٔ درون آن را از قبل می‌شناسید.'
    example_gloss: در آخر به دیدن خانواده‌ام رفتم.
  prs.a2.unit19.lesson04.teach.home:
    title: خانه
    gloss: خانه
    note: '*خانه* همان خانه است؛ واژه‌ای از درس مسکن.'
    example_gloss: در آخر به خانه رفتم.
  prs.a2.unit19.lesson04.teach.order_grammar:
    title: تعریف کردن آخر هفته به ترتیب
    gloss: پنجشنبه اول به بانک رفتم، بعد در بازار خرید کردم و آخرش به خانه رفتم.
    note: 'برای گفتن کارهایی که به ترتیب انجام داده‌اید، برای هر کارِ تمام‌شده یک فعل گذشتهٔ جدا بیاورید و با *اول، بعد، در آخر* ترتیب را نشان بدهید. کارها به همان ترتیبی که اتفاق افتاده‌اند می‌آیند: *اول به بانک رفتم، بعد در بازار خرید کردم و در آخر به خانه رفتم.* می‌توانید بخش‌ها را با ویرگول، نقطه یا *و* به هم وصل کنید. برای گفتن کاری که انجام نداده‌اید، از *ولی* و فعل گذشتهٔ منفی استفاده کنید: *به بازار رفتم، ولی خرید نکردم.*'
  prs.a2.unit19.lesson05.teach.also:
    title: هم
    gloss: هم
    note: '*هم* یعنی «نیز» و بعد از چیزی می‌آید که به جمله اضافه می‌کند: *فلم هم ندیدم* یعنی «فیلم هم ندیدم».'
    example_gloss: من هم به بازار رفتم.
  prs.a2.unit19.lesson05.teach.my_friend:
    title: دوستم
    gloss: دوستم
    note: '*دوست* یعنی «دوست» و *-م* معنی «من» را اضافه می‌کند: *دوستم* یعنی «دوستم».'
    example_gloss: جمعه به دیدن دوستم رفتم.
  prs.a2.unit19.lesson05.teach.my_friends:
    title: دوستانم
    gloss: دوستانم
    note: '*دوستان* جمع *دوست* است و *-م* معنی «من» را اضافه می‌کند: *دوستانم* یعنی «دوستانم».'
    example_gloss: جمعه با دوستانم به پارک رفتم.
  prs.a2.unit19.lesson05.teach.with:
    title: با
    gloss: با
    note: '*با* یعنی «با». قبل از شخص می‌آید: *با دوستانم* یعنی «با دوستانم».'
    example_gloss: با دوستانم به بازار رفتم.
  prs.a2.unit19.lesson05.teach.message:
    title: یک پیام دربارهٔ آخر هفتهٔ گذشته
    gloss: آخر هفتهٔ گذشته، پنجشنبه عصر چند کار داشتم. اول به بانک رفتم، بعد در بازار نان و میوه خریدم. جمعه دیر بیدار شدم و صبحانه خوردم، بعد به دیدن فامیلم رفتم. ورزش نکردم و فیلم هم ندیدم.
    note: 'یک گزارش کوتاه از آخر هفته، به ترتیبی که کارها اتفاق افتاده‌اند. دو کار انجام نشده و هر کدام فعل گذشتهٔ منفی است: *ورزش نکردم* و *فلم ندیدم*.'
  prs.a2.unit19.lesson05.teach.exchange_q:
    title: همایون از زرمینه دربارهٔ پنجشنبه می‌پرسد
    gloss: زرمینه، پنجشنبه به بانک رفتی؟
    note: همایون با فعل گذشتهٔ *رفتی*، شکل «تو» (برای دوست)، می‌پرسد. این یک سؤال بله/خیر دربارهٔ کاری تمام‌شده است.
  prs.a2.unit19.lesson05.teach.exchange_a:
    title: زرمینه جواب می‌دهد
    gloss: نه، به بانک نرفتم. فیلم دیدم.
    note: زرمینه اول می‌گوید چه کاری انجام نشده، *به بانک نرفتم*، و بعد می‌گوید چه کاری انجام شده، *فلم دیدم*.
  prs.a2.unit19.lesson06.teach.turn01:
    title: زرمینه دربارهٔ آخر هفتهٔ گذشته می‌پرسد
    gloss: همایون، آخر هفتهٔ گذشته چه کار کردی؟
    note: '*چه کار کردی؟* یعنی «چه کار کردی؟». دربارهٔ کاری تمام‌شده می‌پرسد، برای همین فعل گذشتهٔ *کردی* را دارد.'
  prs.a2.unit19.lesson06.teach.turn02:
    title: همایون از کارها و دیدارش تعریف می‌کند
    gloss: پنجشنبه عصر چند کار داشتم. اول به بانک رفتم، بعد در بازار نان و میوه خریدم. جمعه به دیدن فامیلم رفتم.
    note: همایون کارها را با *اول* و *بعد* به ترتیب می‌گوید و بعد سراغ جمعه می‌رود.
  prs.a2.unit19.lesson06.teach.turn03:
    title: زرمینه دربارهٔ ورزش می‌پرسد
    gloss: ورزش کردی؟
    note: یک سؤال بله/خیر دربارهٔ کاری تمام‌شده، با فعل گذشتهٔ *کردی*.
  prs.a2.unit19.lesson06.teach.turn04:
    title: همایون جواب منفی می‌دهد و می‌پرسد
    gloss: نه، ورزش نکردم. تو چطور؟
    note: '*نخیر، ورزش نکردم* با گذشتهٔ منفی جواب می‌دهد. *تو چطور؟* راه کوتاهی برای پرسیدن «تو چطور؟» است.'
  prs.a2.unit19.lesson06.teach.turn05:
    title: زرمینه از آخر هفته‌اش تعریف می‌کند
    gloss: پنجشنبه فیلم دیدم. جمعه با دوستانم به بازار رفتم، ولی خرید نکردم.
    note: زرمینه با *ولی* کاری را که کرده، یعنی رفتن به بازار، در مقابل کاری که نکرده، *خرید نکردم*، می‌گذارد.
  prs.a2.unit19.lesson06.teach.turn06:
    title: واکنش همایون
    gloss: چه خوب!
    note: '*چه خوب!* یعنی «چه خوب!»، واکنشی دوستانه به یک خبر خوب.'
