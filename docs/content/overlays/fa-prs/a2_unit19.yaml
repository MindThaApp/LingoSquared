  description: 'دری افغانستان در سطح پیش‌متوسط: تعریف کردن کارهایی که آخر هفتهٔ گذشته انجام دادید، به ترتیب، همراه با کارهایی که نکردید. ماضی ساده به‌عنوان یک نظام (ریشهٔ ماضی به‌علاوهٔ شناسه‌ها)، ماضی منفی و تفاوت آن با حال.'
units:
