  description: 'دری افغانستان در سطح پیش‌متوسطه: گزارش یک مشکل خانه به صاحب‌خانه — واژگان، توصیف مشکل، خواندن اطلاعیه‌ی تعمیرات و خودِ تماس تلفنی.'
units:
