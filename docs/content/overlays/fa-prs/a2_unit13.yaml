teaching:
  prs.a2.unit13.lesson01.teach.malfunction_word:
    title: خرابی / مشکل
    gloss: خرابی
    note: '*خرابی* واژه‌ی کلی برای چیزی است که خراب شده یا درست کار نمی‌کند.'
    example_gloss: خرابی لوله را گزارش دادم.
  prs.a2.unit13.lesson01.teach.pipe_word:
    title: لوله
    gloss: لوله
    note: '*لوله* واژه‌ی رایج برای لوله است.'
    example_gloss: لوله‌ی آشپزخانه چکه می‌کند.
  prs.a2.unit13.lesson01.teach.electricity_word:
    title: برق
    gloss: برق
    note: '*برق* یعنی جریان برق یا برق‌رسانی.'
    example_gloss: برق اتاق‌خوابم کار نمی‌کند.
  prs.a2.unit13.lesson01.teach.leak_word:
    title: چکه / نشتی
    gloss: چکه / نشتی
    note: '*چکه* برای نشت‌کردن یا چکیدن آب به کار می‌رود.'
    example_gloss: نشتی لوله هر شب بدتر می‌شود.
  prs.a2.unit13.lesson01.teach.repair_word:
    title: تعمیر
    gloss: تعمیر
    note: '*تعمیر* واژه‌ی کلی برای تعمیر کردن است.'
    example_gloss: تعمیر لوله فردا انجام می‌شود.
  prs.a2.unit13.lesson01.teach.worker_word:
    title: تعمیرکار
    gloss: تعمیرکار / کارگر
    note: '*کارگر* در کل یعنی کارگر؛ اینجا مشخصاً یعنی تعمیرکار.'
    example_gloss: صاحب‌خانه یک تعمیرکار می‌فرستد.
  prs.a2.unit13.lesson01.teach.asap_grammar:
    title: در اسرع وقت، با هر چه زودتر
    gloss: هر چه زودتر
    note: '*هر چه زودتر* -- ساختاری برای بیان فوریت؛ تحت‌اللفظی یعنی «هر چه زودتر».'
    target_text: هر چه زودتر (در اسرع وقت)
  prs.a2.unit13.lesson02.teach.pipe_leaking_asap:
    title: گزارش لوله‌ی چکه‌کننده، با فوریت
    gloss: لوله‌ی آشپزخانه‌ام چکه می‌کند و باید هر چه زودتر تعمیر شود.
    note: '*چکه می‌کند* (نشت می‌کند) را با *هر چه زودتر* و *باید* (لازم است) ترکیب می‌کند.'
  prs.a2.unit13.lesson02.teach.when_send_worker:
    title: پرسیدن اینکه تعمیرکار کی می‌تواند بیاید
    gloss: کی می‌توانید تعمیرکار بفرستید؟
    note: '*کی می‌توانین...؟* یعنی «کی می‌توانید ...؟».'
  prs.a2.unit13.lesson02.teach.bedroom_electricity_not_working:
    title: گزارش مشکل دوم
    gloss: برق اتاق‌خوابم کار نمی‌کند.
    note: '*کار نمی‌کند* یعنی «کار نمی‌کند»؛ برای وسیله یا خدماتی مثل برق به کار می‌رود.'
  prs.a2.unit13.lesson03.teach.cost_word:
    title: هزینه
    gloss: هزینه
    note: '*هزینه* واژه‌ی کلی برای پول خرج‌شده یا مخارج است.'
    example_gloss: تعمیر برق هزینه دارد.
  prs.a2.unit13.lesson03.teach.free_word:
    title: رایگان
    gloss: رایگان
    note: '*رایگان* یعنی مجانی، بدون هزینه.'
    example_gloss: تعمیر لوله رایگان است.
  prs.a2.unit13.lesson03.teach.notice_text:
    title: اطلاعیه‌ی تعمیرات ساختمان
    gloss: تعمیرکار ساختمان روز پنج‌شنبه ساعت ده می‌آید. تعمیر لوله رایگان است، اما تعمیر برق هزینه دارد.
    note: یک اطلاعیه‌ی کلی ساختمان به زبان رسمی و نوشتاری -- جدا از تماس تلفنی کریم در ادامه‌ی درس، و مربوط به همان مراجعه نیست.
  prs.a2.unit13.lesson04.teach.turn01:
    title: صاحب‌خانه تلفن را جواب می‌دهد
    gloss: 'صاحب‌خانه جواب می‌دهد: «الو، بفرمایید.»'
    note: '*الو* همان چیزی است که موقع جواب‌دادن تلفن می‌گویند؛ *بفرمایین* اینجا یعنی «بفرمایید، بگویید» و به معنی معمولی‌اش، «بفرمایید داخل»، نیست.'
  prs.a2.unit13.lesson04.teach.turn02:
    title: کریم خودش را معرفی می‌کند و نشتی را گزارش می‌دهد
    gloss: سلام می‌کند، می‌گوید کریم است و می‌گوید لوله‌ی آشپزخانه‌اش چکه می‌کند.
    note: '*استم* فعل ربطی «هستم» است: *من کریم استم* یعنی «من کریم هستم».'
  prs.a2.unit13.lesson04.teach.turn03:
    title: صاحب‌خانه می‌پرسد از کی
    gloss: صاحب‌خانه می‌پرسد از کی شروع شده است.
    note: '*از کی شروع شده؟* یعنی «از کی شروع شده؟».'
  prs.a2.unit13.lesson04.teach.turn04:
    title: کریم با تأکید بر فوریت جواب می‌دهد
    gloss: از دیشب. باید هر چه زودتر تعمیر شود.
    note: '*دیشب* یعنی «دیشب».'
  prs.a2.unit13.lesson04.teach.turn05:
    title: صاحب‌خانه زمان را تأیید می‌کند
    gloss: باشه، فردا ساعت نه تعمیرکار را می‌فرستم.
    note: '*باشد* یعنی «باشه» یا «بسیار خوب».'
  prs.a2.unit13.lesson04.teach.turn06:
    title: کریم تشکر می‌کند و مشکل دوم را می‌گوید
    gloss: از صاحب‌خانه تشکر می‌کند و می‌گوید برق اتاق‌خوابش هم کار نمی‌کند.
    note: '*هم* اینجا یعنی «همچنین» و مشکل دوم را اضافه می‌کند.'
  prs.a2.unit13.lesson04.teach.turn07:
    title: صاحب‌خانه قول می‌دهد موضوع را منتقل کند
    gloss: صاحب‌خانه می‌گوید آن را هم به تعمیرکار می‌گوید.
    note: '*آن را هم به کارگر می‌گویم* -- «آن را هم به تعمیرکار می‌گویم» -- به مشکل برق برمی‌گردد.'
