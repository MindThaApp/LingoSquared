course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستان، سطح پیش‌متوسط: گفتن اینکه وقتی اتفاق دیگری افتاد، چه کاری در جریان بود. گذشته‌ی استمراری با می‌ و بن گذشته، «در حال ... بودم» (اختیاری)، گذشته‌ی ساده برای اتفاقِ ناگهانی، و پیوند دادن جمله‌ها با وقتی که، ناگهان و همان وقت.'
units:
