teaching:
  prs.a2.unit24.lesson01.teach.sarak:
    title: خیابان
    gloss: خیابان، جاده
    note: '*سرک* یعنی خیابان یا جاده. با *در* یعنی توی خیابان: *در سرک*. درس را از خیابان شروع می‌کنیم، چون بیشترِ اتفاق‌های کوچکِ ما آنجا می‌افتد.'
    example_gloss: اداره‌ی ما نزدیک خیابان است.
  prs.a2.unit24.lesson01.teach.piyada:
    title: پیاده
    gloss: پیاده، با پای پیاده
    note: '*پیاده* یعنی با پای پیاده. *پیاده می‌روم* یعنی پیاده می‌روم، راه می‌روم. اینجا فعل، حال است (*می‌روم*)؛ در این درس گذشته‌ی همین الگو را یاد می‌گیرید.'
    example_gloss: هر روز پیاده به اداره می‌روم.
  prs.a2.unit24.lesson01.teach.rain:
    title: باران
    gloss: باران
    note: '*باران* یعنی باران. *شروع شد* یعنی آغاز شد: *باران شروع شد* یعنی باران شروع به باریدن کرد. در سرتاسر این درس از همین دو کلمه برای اتفاقِ ناگهانی استفاده می‌کنید.'
    example_gloss: باران شروع شد.
  prs.a2.unit24.lesson01.teach.snow:
    title: باران می‌آید، برف می‌آید
    gloss: باران می‌آید، برف می‌آید
    note: '*برف* یعنی برف. فعل *باریدن* هم برای باران و هم برای برف به کار می‌رود: *باران می‌بارد* یعنی باران می‌آید و *برف می‌بارد* یعنی برف می‌آید. هر دو شکل حال و با *می* هستند.'
    example_gloss:
    - امروز باران می‌آید.
    - توی کابل برف می‌آید.
  prs.a2.unit24.lesson01.teach.wind:
    title: باد
    gloss: باد
    note: '*باد* یعنی باد. برای گفتن «هوا بادی است» می‌گویند باد زیاد است: *باد زیاد است*.'
    example_gloss: امروز خیلی باد می‌آید.
  prs.a2.unit24.lesson01.teach.traffic:
    title: ترافیک
    gloss: ترافیک
    note: '*ترافیک* یعنی ترافیک. *ترافیک زیاد* یعنی ترافیک سنگین، که دلیلِ خیلی رایجی برای دیر رسیدن است.'
    example_gloss: توی خیابان ترافیک سنگینی هست.
  prs.a2.unit24.lesson01.teach.imperfect_paradigm:
    title: 'می‌رفتم: می + بن گذشته + شناسه‌ها'
    gloss: داشتم می‌رفتم، داشتی می‌رفتی، او داشت می‌رفت، داشتیم می‌رفتیم، شما (محترمانه یا جمع) داشتید می‌رفتید، آن‌ها داشتند می‌رفتند
    note: 'گذشته‌ی ساده را برای کارِ تمام‌شده می‌شناسید: *رفتم* یعنی رفتم. برای گفتن اینکه در یک لحظه‌ی گذشته چه کاری در جریان بود، *می‌* را جلوی فعل گذشته بگذارید: *می‌رفتم* یعنی داشتم می‌رفتم. الگو این است: *می‌* + بن گذشته (*رفت*) + همان شناسه‌ها: *می‌رفتم، می‌رفتی، می‌رفت، می‌رفتیم، می‌رفتین، می‌رفتند*. ضمیرهای *من، تو، او، ما، شما، آن‌ها* اختیاری‌اند. هوا هم همین‌طور است: *باران می‌بارید* یعنی باران می‌آمد و *برف می‌بارید* یعنی برف می‌آمد. حالِ *می‌روم* را مقایسه کنید: فقط بن و شناسه عوض می‌شود. همین شکل *می‌رفتم* می‌تواند معنی «عادت داشتم بروم» هم بدهد، مثل *هر روز پیاده می‌رفتم*؛ جمله‌ی اطرافش معلوم می‌کند کدام معنی است. در این درس بیشتر به معنی «داشتم می‌رفتم» است.'
  prs.a2.unit24.lesson02.teach.car:
    title: ماشین
    gloss: ماشین
    note: '*موتر* واژه‌ی روزمره‌ی افغانی برای ماشین است. *در موتر* یعنی توی ماشین.'
    example_gloss: ماشین ما نو است.
  prs.a2.unit24.lesson02.teach.phone:
    title: تلفن
    gloss: تلفن، گوشی
    note: '*تیلفون* یعنی تلفن. با اضافه کردن *-م* معنی «من» می‌دهد: *تیلفونم* یعنی تلفنم.'
    example_gloss: تلفنم روشن است.
  prs.a2.unit24.lesson02.teach.umbrella:
    title: چتر
    gloss: چتر
    note: '*چتر* یعنی چتر. باران و چتر با هم‌اند: *چتر دارم* یعنی چتر دارم و *چتر ندارم* یعنی چتر ندارم.'
    example_gloss: امروز باران می‌آید، چتر دارم.
  prs.a2.unit24.lesson02.teach.wet:
    title: خیس شدن
    gloss: خیس شدن، تر شدن
    note: '*خیس* یعنی تر و *خیس شدن* یعنی تر شدن. *خیس شدم* یعنی خیس شدم، که نتیجه‌ی رایجِ باران است.'
    example_gloss: اگر باران ببارد، خیس می‌شوم.
  prs.a2.unit24.lesson02.teach.ring:
    title: زنگ خوردن، زنگ زدن
    gloss: زنگ خوردن، به کسی زنگ زدن
    note: '*زنگ زدن* دو کاربرد دارد. تلفن می‌تواند زنگ بخورد: *تیلفونم زنگ زد* (تلفنم زنگ خورد). آدم هم می‌تواند به کسی زنگ بزند: *دوستم به من زنگ زد* (دوستم به من زنگ زد). بن گذشته *زد* است، از *زدن*.'
    example_gloss: دوستم به من زنگ زد.
  prs.a2.unit24.lesson02.teach.driving:
    title: رانندگی کردن
    gloss: رانندگی کردن، ماشین راندن
    note: '*رانندگی کردن* یعنی رانندگی کردن. *رانندگی* خودِ کارِ راندن است و *کردن* فعلِ انجام دادن، مثل *خرید کردن*. این فعل ترکیبی از اسم و *کردن* است، پس بخشی که عوض می‌شود خودِ فعل است: *رانندگی کردم*.'
    example_gloss: هر روز رانندگی می‌کنم.
  prs.a2.unit24.lesson02.teach.more_verbs:
    title: همین الگو با فعل‌های دیگر
    gloss: داشتم انجام می‌دادم، داشتی انجام می‌دادی، داشتم می‌خوردم، داشتم می‌دیدم یا تماشا می‌کردم، داشتم می‌آمدم
    note: 'همه‌ی فعل‌ها از یک قاعده پیروی می‌کنند: *می‌* + بن گذشته + شناسه. *کردن* می‌شود *می‌کردم* (داشتم انجام می‌دادم) و *می‌کردی* (داشتی انجام می‌دادی). *خوردن* می‌شود *می‌خوردم* (داشتم می‌خوردم). *دیدن* می‌شود *می‌دیدم* (داشتم می‌دیدم؛ درباره‌ی فیلم یعنی داشتم تماشا می‌کردم). *آمدن* می‌شود *می‌آمدم* (داشتم می‌آمدم). با فعلی مثل *آشپزی کردن* فقط بخش فعلی تغییر می‌کند: *آشپزی می‌کردم* یعنی داشتم آشپزی می‌کردم، نه *می‌آشپزی*. بن هیچ‌وقت عوض نمی‌شود، فقط شناسه‌ها عوض می‌شوند.'
  prs.a2.unit24.lesson02.teach.cooking:
    title: داشتم آشپزی می‌کردم
    gloss: داشتم غذا درست می‌کردم.
    note: '*آشپزی* یعنی آشپزی، واژه‌ای که از درس‌های برنامه‌ی روزانه مرور می‌شود. *آشپزی می‌کردم* یعنی وسطِ آشپزی بودید.'
  prs.a2.unit24.lesson02.teach.watching:
    title: توی خانه فیلم تماشا می‌کردم
    gloss: توی خانه داشتم فیلم تماشا می‌کردم.
    note: '*فلم دیدن* یعنی فیلم تماشا کردن، پس گذشته‌ی استمراری‌اش *فلم می‌دیدم* است. *در خانه* یعنی توی خانه.'
  prs.a2.unit24.lesson02.teach.driving_car:
    title: توی ماشین رانندگی می‌کردم
    gloss: توی ماشین داشتم رانندگی می‌کردم.
    note: '*در موتر* یعنی توی ماشین و *رانندگی می‌کردم* یعنی داشتم رانندگی می‌کردم.'
  prs.a2.unit24.lesson03.teach.was_paradigm:
    title: بودن در گذشته
    gloss: من بودم، تو بودی، او بود، ما بودیم، شما (محترمانه یا جمع) بودید، آن‌ها بودند
    note: '*بودن* یعنی بودن. گذشته‌اش مثل هر گذشته‌ی دیگر ساخته می‌شود: بن *بود* به‌اضافه‌ی شناسه‌های *بودم، بودی، بود، بودیم، بودین، بودند*. با آن می‌گویید «بودم» یا «بودیم»: *در موتر بودم* (توی ماشین بودم)، *ترافیک زیاد بود* (ترافیک سنگین بود). آن را با حالِ *استم، استی، است* اشتباه نگیرید. حالتی مثل جایی بودن یا منتظر بودن به *می‌* نیاز ندارد، چون *بودم* خودش وضعیتی در آن زمانِ گذشته را توصیف می‌کند.'
  prs.a2.unit24.lesson03.teach.waiting:
    title: منتظر ماندن
    gloss: منتظر ماندن، انتظار کشیدن
    note: '*منتظر بودن* یعنی انتظار کشیدن. انتظار یک حالت است، پس گذشته‌اش فقط *منتظر بودم* است، بدون *می‌*. چیزی که منتظرش هستید پیش از *منتظر* می‌آید: *منتظر بس بودم*.'
    example_gloss: توی ایستگاه منتظر اتوبوس بودم.
  prs.a2.unit24.lesson03.teach.negative_continuing:
    title: 'نمی‌رفتم: نمی + بن گذشته'
    gloss: نمی‌رفتم، غذا نمی‌خوردم، نمی‌دیدم، انجام نمی‌دادم
    note: 'برای گفتن اینکه در آن لحظه کاری را انجام نمی‌دادید، به‌جای *می‌* بگویید *نمی‌* جلوی بن گذشته: *نمی‌رفتم* (نمی‌رفتم)، *نمی‌خوردم* (نمی‌خوردم)، *نمی‌دیدم* (نمی‌دیدم)، *نمی‌کردم* (انجام نمی‌دادم). با منفیِ گذشته‌ی ساده از درس آخر هفته مقایسه کنید: *نرفتم* یعنی نرفتم (یک واقعیتِ تمام‌شده: اتفاق نیفتاد)، ولی *نمی‌رفتم* یعنی نمی‌رفتم (در آن زمان در جریان نبود، یا عادت نداشتم بروم).'
  prs.a2.unit24.lesson03.teach.finished_vs_ongoing:
    title: رفتم در برابر می‌رفتم
    gloss: به خانه رفتم. / داشتم به خانه می‌رفتم.
    note: 'این دو شکل تقریباً شبیه هم‌اند، ولی دو ماجرای متفاوت می‌گویند. *به خانه رفتم* یعنی به خانه رفتم: سفر تمام شده است. *به خانه می‌رفتم* یعنی داشتم به خانه می‌رفتم: در راه بودم، هنوز نرسیده بودم و ممکن بود در راه اتفاقی بیفتد. وقتی می‌گویید چه اتفاقی در جریان بود، کارِ طولانیِ پس‌زمینه با *می‌* می‌آید و اتفاقِ ناگهانی با گذشته‌ی ساده و بدون *می‌*.'
  prs.a2.unit24.lesson03.teach.when_two_pasts:
    title: وقتی + گذشته‌ی ساده یا وقتی + می
    gloss: وقتی به خانه رسیدم، باران شروع شد. / وقتی توی خیابان می‌رفتم، باران شروع شد.
    note: 'هر دو جمله *وقتی که* دارند، ولی فعلِ بعد از آن معنی را مشخص می‌کند. با گذشته‌ی ساده، *وقتی که به خانه رسیدم، باران شروع شد*، اتفاقِ اول تمام شده و دومی بعد از آن می‌آید: بعد از رسیدن به خانه باران شروع شد. با *می‌*، *وقتی که در سرک می‌رفتم، باران شروع شد*، کارِ اول هنوز در جریان بود و باران وسطِ آن شروع شد. برای گفتن اینکه چه اتفاقی در جریان بود، الگوی دوم لازم است.'
  prs.a2.unit24.lesson03.teach.in_progress_emphasis:
    title: 'اختیاری: در حال … بودم'
    gloss: وسطِ رفتن بودم. / وسطِ آشپزی کردن بودم. / الان وسطِ رفتن هستم.
    note: 'دری راه دومی هم دارد، کمی قوی‌تر، برای گفتن اینکه کاری در جریان بود: *در حال* + مصدر + *بودم*. *در حال رفتن بودم* یعنی وسطِ رفتن بودم، و با اسم به‌اضافه‌ی *کردن*، کل مصدر می‌آید: *در حال آشپزی کردن بودم*. معنی‌اش با *می‌رفتم* و *آشپزی می‌کردم* یکی است؛ فقط بیشتر روی در جریان بودنِ کار تأکید می‌کند. هیچ‌وقت مجبور نیستید از آن استفاده کنید و هر دو شکل در همه‌ی این درس درست‌اند. حال هم شکلِ تأکیدی دارد: *در حال رفتن استم* یعنی الان وسطِ رفتن هستم، ولی مردم معمولاً همان *می‌روم* ساده را می‌گویند.'
  prs.a2.unit24.lesson04.teach.when_pattern:
    title: 'الگو: وقتی که + می، بعد اتفاق'
    gloss: وقتی توی خیابان می‌رفتم، باران شروع شد.
    note: 'برای گفتن اینکه وقتی اتفاقی افتاد چه کاری در جریان بود، جمله را در دو بخش بسازید. اول پس‌زمینه: *وقتی که* + کارِ در جریان با *می‌*: *وقتی که در سرک می‌رفتم*. بعد ویرگول و اتفاقی که وسطش آمد، در گذشته‌ی ساده و بدون *می‌*: *باران شروع شد*. نتیجه این است: *وقتی که در سرک می‌رفتم، باران شروع شد.* کارِ طولانی (*می‌رفتم*) از قبل در جریان بود و اتفاقِ کوتاه (*شروع شد*) وسطش آمد. با شکلِ تأکیدیِ اختیاری هم همین‌طور است: *وقتی که در حال رفتن بودم، باران شروع شد*. می‌توانید *که* را حذف کنید و فقط *وقتی* بگویید.'
  prs.a2.unit24.lesson04.teach.suddenly:
    title: یک‌دفعه
    gloss: یک‌دفعه، ناگهانی
    note: '*ناگهان* یعنی یک‌دفعه. درست قبل از فعلِ اتفاقِ ناگهانی می‌آید، مثل *ناگهان باران شروع شد*. با فعلِ وسط‌پرنده که در گذشته‌ی ساده است، خوب می‌نشیند.'
    example_gloss: یک‌دفعه باران شروع شد.
  prs.a2.unit24.lesson04.teach.same_time:
    title: همان لحظه
    gloss: همان لحظه
    note: '*همان وقت* یعنی همان لحظه. اول یک جمله‌ی تازه می‌آید تا اتفاق دومی را که هم‌زمان افتاد اضافه کنید: *همان وقت تیلفونم زنگ زد*.'
    example_gloss: همان لحظه گوشی‌ام زنگ خورد.
  prs.a2.unit24.lesson04.teach.power_cut:
    title: برق قطع شد
    gloss: برق قطع شد
    note: '*برق* یعنی برق. *برق رفت* یعنی برق قطع شد (برق رفت)، اتفاقی کوچک که هر کاری را متوقف می‌کند.'
    example_gloss: یک‌دفعه برق قطع شد.
  prs.a2.unit24.lesson04.teach.event_vs_background:
    title: کدام فعل می دارد و کدام ندارد
    gloss: وقتی داشتم فیلم تماشا می‌کردم، یک‌دفعه برق قطع شد. همان لحظه گوشی‌ام زنگ خورد.
    note: 'هر جمله را از نظر دو نوع فعل بررسی کنید. کارِ پس‌زمینه *می‌* دارد: *فلم می‌دیدم* (داشتم فیلم تماشا می‌کردم)، چون مدتی طول می‌کشد. اتفاقِ ناگهانی *می‌* ندارد: *برق رفت* (برق قطع شد)، چون یک بار اتفاق می‌افتد و تمام می‌شود. *ناگهان* یا *همان وقت* همراه اتفاق می‌آیند، نه پس‌زمینه. اگر هر دو فعل *می‌* داشتند یا هیچ‌کدام نداشتند، جمله دیگر نشان نمی‌داد کدام یک وسطِ دیگری آمد.'
  prs.a2.unit24.lesson05.teach.got_wet_we:
    title: ما خیس شدیم
    gloss: تر شدیم
    note: '*شدیم* یعنی شدیم، گذشته‌ی ساده‌ی *شدن* با شناسه‌ی *-یم*. *خیس شدیم* یعنی خیس شدیم.'
    example_gloss: توی خیابان باران شروع شد و ما خیس شدیم.
  prs.a2.unit24.lesson05.teach.friend_pl:
    title: با دوست‌هایم
    gloss: با دوست‌هایم
    note: '*دوستانم* یعنی دوستانم و *با* یعنی با: *با دوستانم* یعنی با دوستانم. در گفتگوی بعدی آن را می‌شنوید.'
    example_gloss: جمعه با دوستانم توی بازار بودم.
  prs.a2.unit24.lesson05.teach.message:
    title: پیامی درباره‌ی دیروز صبح
    gloss: دیروز صبح داشتم به اداره می‌رفتم. توی خیابان ترافیک سنگینی بود. وقتی توی اتوبوس منتظر بودم، باران شروع شد. همان لحظه گوشی‌ام زنگ خورد. دوستم بود. دیر به اداره رسیدم.
    note: 'شرحی کوتاه و نوشتاری از یک اتفاقِ کوچک. پس‌زمینه *می‌* دارد: *به دفتر می‌رفتم*. منتظر ماندن یک حالت است: *منتظر بودم*. دو اتفاق در گذشته‌ی ساده‌اند: *باران شروع شد* و *تیلفونم زنگ زد*.'
  prs.a2.unit24.lesson05.teach.exchange_q:
    title: همایون از زرمینه درباره‌ی جمعه می‌پرسد
    gloss: زرمینه، جمعه توی بازار چه شد؟
    note: همایون با *چه شد؟* می‌پرسد، یعنی چه اتفاقی افتاد؟ این راهِ معمول برای پرسیدنِ ماجرای یک اتفاقِ کوچک است.
  prs.a2.unit24.lesson05.teach.exchange_a:
    title: زرمینه می‌گوید چه شد
    gloss: وقتی با دوستانم توی بازار می‌رفتم، باران شروع شد. چتر نداشتم و همه‌مان خیس شدیم.
    note: زرمینه پس‌زمینه را با *می‌* می‌گوید (*می‌رفتم*) و بعد اتفاق را (*باران شروع شد*). نتیجه‌اش، *خیس شدیم*، هم در گذشته‌ی ساده است.
  prs.a2.unit24.lesson06.teach.turn01:
    title: همایون می‌پرسد زرمینه چه کار می‌کرده
    gloss: زرمینه، دیشب چه کار می‌کردی؟
    note: '*چه کار می‌کردی؟* یعنی «داشتی چه کار می‌کردی؟». این جمله درباره‌ی کاری است که در جریان بوده، برای همین *می‌کردی* می‌آید، نه *کردی* که برای کار تمام‌شده است.'
  prs.a2.unit24.lesson06.teach.turn02:
    title: زرمینه می‌گوید چه کار می‌کرده و چه اتفاقی افتاده
    gloss: وقتی داشتم فیلم می‌دیدم، ناگهان برق رفت.
    note: کار در جریان، یعنی *فلم می‌دیدم*، پس‌زمینه است. بعد اتفاق *برق رفت* با *ناگهان* می‌آید.
  prs.a2.unit24.lesson06.teach.turn03:
    title: همایون می‌پرسد بعد چه کار کرده
    gloss: بعدش چه کار کردی؟
    note: '*چه کار کردی؟* با گذشته‌ی ساده از کاری تمام‌شده می‌پرسد: چه کار کردی؟'
  prs.a2.unit24.lesson06.teach.turn04:
    title: زرمینه از تماس تلفنی می‌گوید و بعد از همایون می‌پرسد
    gloss: همان لحظه گوشی‌ام زنگ خورد. دوستم بود. باهاش حرف زدم. تو چطور؟
    note: '*همان وقت* اتفاق دوم را اضافه می‌کند. *با او صحبت کردم* یعنی «باهاش حرف زدم» و *تو چطور؟* یعنی «تو چی؟».'
  prs.a2.unit24.lesson06.teach.turn05:
    title: همایون از اتوبوس و هوا می‌گوید
    gloss: از اداره به خانه می‌آمدم. توی اتوبوس بودم. ترافیک سنگین بود و باران هم می‌بارید.
    note: او برای مسیر از *می‌آمدم*، برای وضعیت از *بودم* و *زیاد بود* و برای بارانِ در جریان از *می‌بارید* استفاده می‌کند.
  prs.a2.unit24.lesson06.teach.bad:
    title: ای وای!
    gloss: بد؛ ای وای!
    note: '*بد* یعنی «بد». *چه بد!* یعنی «چه بد!» یا «چه حیف!»، واکنشی دوستانه به یک بدشانسی کوچک.'
    example_gloss: امروز باران می‌بارد و ترافیک بد است.
  prs.a2.unit24.lesson06.teach.turn06:
    title: زرمینه واکنش نشان می‌دهد
    gloss: ای وای!
    note: '*چه بد!* واکنشی دوستانه به خبر بد است و نقطه‌ی مقابل *چه خوب!*.'
