  prs.a1.unit03.lesson02.teach.grandfather:
    title: پدربزرگ
    gloss: پدربزرگ
    note: «پدرکلان» واژه‌ی معمول دری افغانستان است؛ در اصل یعنی پدر بزرگ.
    example_gloss: پدربزرگم پیر است.
  prs.a1.unit03.lesson02.teach.grandmother:
    title: مادربزرگ
    gloss: مادربزرگ
    note: «مادرکلان» واژه‌ی معمول دری افغانستان است؛ در اصل یعنی مادر بزرگ.
    example_gloss: مادربزرگم مهربان است.
  prs.a1.unit03.lesson02.teach.paternal_uncle:
    title: برادر پدر
    gloss: عموی پدری
    note: «کاکا» مشخصاً برادر پدر شما را می‌رساند.
    example_gloss: عمویم در هرات زندگی می‌کند.
  prs.a1.unit03.lesson02.teach.paternal_aunt:
    title: خواهر پدر
    gloss: عمه
    note: «عمه» مشخصاً خواهر پدر شما را می‌رساند.
    example_gloss: عمه‌ام معلم است.
  prs.a1.unit03.lesson02.teach.maternal_uncle:
    title: برادر مادر
    gloss: دایی
    note: «ماما» در دری مشخصاً برادر مادر شما را می‌رساند.
    example_gloss: دایی‌ام مهندس است.
  prs.a1.unit03.lesson02.teach.maternal_aunt:
    title: خواهر مادر
    gloss: خاله
    note: «خاله» مشخصاً خواهر مادر شما را می‌رساند.
    example_gloss: خاله‌ام در کابل زندگی می‌کند.
  prs.a1.unit03.lesson02.teach.side_distinction:
    title: دو طرف فامیل را از هم جدا نگه دارید
    gloss: کاکا و عمه از طرف پدر هستند؛ ماما و خاله از طرف مادر.
    note: در دری، مثل فارسی، برای عمو، عمه، دایی و خاله چهار واژه‌ی جدا هست که طرف پدری یا مادری را مشخص می‌کنند؛ فقط به جای «عمو» و «دایی» در دری «کاکا» و «ماما» می‌گویند.
  prs.a1.unit03.lesson03.teach.family:
    title: خانواده
    gloss: خانواده
    note: «فامیل» واژه‌ی معمول دری افغانستان برای خانواده است.
    example_gloss: خانواده‌ام بزرگ است.
  prs.a1.unit03.lesson03.teach.how_many_people:
    title: محترمانه اندازه‌ی خانواده را بپرسید
    gloss: خانواده‌تان چند نفر است؟
    note: «ـتان» برای «تان/شما»ی محترمانه است؛ «نفر» شمارنده‌ی آدم‌هاست.
  prs.a1.unit03.lesson03.teach.five_people:
    title: اندازه‌ی خانواده را بگویید
    gloss: خانواده‌ی ما پنج نفر است.
    note: در دری خانواده را با تعداد نفرات و «نفر است» بیان می‌کنند.
  prs.a1.unit03.lesson03.teach.have_siblings:
    title: تعداد خواهر و برادرهایتان را بگویید
    gloss: من یک برادر و دو خواهر دارم.
    note: «دارم» یعنی «دارم». اسم بعد از عدد مفرد می‌ماند.
  prs.a1.unit03.lesson03.teach.only_child:
    title: تک‌فرزند
    gloss: من تک‌فرزند هستم.
    note: «استم» شکل اول‌شخص دری کابلی است که در این دوره آموزش داده می‌شود.
  prs.a1.unit03.lesson03.teach.possession:
    title: شکل‌های فعل «داشتن»
    gloss: دارم؛ داریم؛ دارید
    note: «دارین» در دری کابلیِ محاوره‌ای تحصیل‌کرده‌ها، «شما دارید» به شکل محترمانه یا جمع است.
  prs.a1.unit03.lesson04.teach.have_siblings_question:
    title: پرسیدن دربارهٔ خواهر و برادر
    gloss: برادر و خواهر دارید؟
    note: «دارین» این جمله را محترمانه یا جمع می‌کند.
  prs.a1.unit03.lesson04.teach.how_many_siblings:
    title: پرسیدن تعداد خواهر و برادر
    gloss: چند برادر و خواهر دارید؟
    note: «چند» یعنی «چند تا / چقدر» و برای پرسیدن تعداد است.
  prs.a1.unit03.lesson04.teach.parents_well:
    title: احوال پدر و مادر کسی را بپرسید
    gloss: پدر و مادرتان خوب‌اند؟
    note: «جور استند» شیوه‌ی آشنا و رایج افغانی برای گفتن «حالشان خوب است» است.
  prs.a1.unit03.lesson04.teach.yes_answer:
    title: پاسخ مثبت
    gloss: بله، یک برادر دارم.
    note: «بلی» پاسخ مثبت مؤدبانه‌ی استاندارد در افغانستان است.
  prs.a1.unit03.lesson04.teach.no_answer:
    title: پاسخ منفی
    gloss: نه، خواهر ندارم.
    note: «نخیر» پاسخ منفیِ محترمانه است؛ «ندارم» یعنی «ندارم».
  prs.a1.unit03.lesson04.teach.polite_your:
    title: «تان»ِ محترمانه
    gloss: خانواده‌تان؛ مادرتان؛ پدرتان
    note: پسوند مالکیت «ـتان» محترمانه یا جمع است. در این دوره با نیم‌فاصله به کلمه وصل می‌شود.
  prs.a1.unit03.lesson05.teach.married:
    title: متأهل
    gloss: متأهل
    note: «متأهل» واژه‌ای خنثی برای وضعیت تأهل است.
    example_gloss: او متأهل است.
  prs.a1.unit03.lesson05.teach.single:
    title: مجرد
    gloss: بدون همسر
    note: مجرد در اینجا یعنی بدون همسر.
    example_gloss: من مجرد هستم.
  prs.a1.unit03.lesson05.teach.husband:
    title: شوهر
    gloss: همسر (مرد)
    note: شوهر واژهٔ رایج و معمولی برای همسرِ مرد است.
    example_gloss: شوهرم مهندس است.
  prs.a1.unit03.lesson05.teach.wife:
    title: همسر
    gloss: همسر (زن)
    note: خانم هم به معنی همسرِ زن است و هم برای خطاب محترمانه به یک زن به کار می‌رود؛ از روی بافت جمله فرقشان را می‌فهمید.
    example_gloss: همسرم معلم است.
  prs.a1.unit03.lesson05.teach.marriage_question:
    title: پرسیدن محترمانه دربارهٔ ازدواج
    gloss: ازدواج کرده‌اید؟
    note: در اصل یعنی «ازدواج کرده‌اید؟». پایانهٔ ـین شکل محترمانهٔ کابلی است.
  prs.a1.unit03.lesson05.teach.married_answer:
    title: گفتن اینکه متأهل هستید
    gloss: بله، متأهل هستم.
    note: استم شکل «هستم» در دریِ افغانستان است.
  prs.a1.unit03.lesson05.teach.children:
    title: پرسیدن دربارهٔ فرزندان
    gloss: بچه دارید؟
    note: اولاد واژهٔ رایجی است که برای یک فرزند یا چند فرزند به کار می‌رود.
  prs.a1.unit03.lesson06.teach.turn01:
    title: مریم دربارهٔ تعداد اعضای خانواده می‌پرسد
    gloss: خانواده‌تان چند نفر است؟
    note: مریم از ـتان محترمانه استفاده می‌کند.
  prs.a1.unit03.lesson06.teach.turn02:
    title: فرشته از برادر و خواهرش می‌گوید
    gloss: پنج نفر هستیم. یک برادر و یک خواهر دارم.
    note: اعضای خانواده با نفر شمرده می‌شوند.
  prs.a1.unit03.lesson06.teach.turn03:
    title: مریم دربارهٔ ازدواج می‌پرسد
    gloss: ازدواج کرده‌اید؟
    note: این پرسش از نظر شکل، محترمانه و بی‌طرف است.
  prs.a1.unit03.lesson06.teach.turn04:
    title: فرشته از شوهرش می‌گوید
    gloss: بله، متأهل هستم. همسرم دانشجوست.
    note: محصل واژهٔ جاافتادهٔ دریِ افغانستان برای «دانشجو» است (در ایران «دانشجو» می‌گویند).
  prs.a1.unit03.lesson06.teach.turn05:
    title: مریم دربارهٔ فرزندان می‌پرسد
    gloss: بچه دارید؟
    note: دارین خطاب محترمانه را حفظ می‌کند.
  prs.a1.unit03.lesson06.teach.turn06:
    title: فرشته پاسخ می‌دهد
    gloss: نه، هنوز بچه نداریم.
    note: نخیر «نه»ی محترمانه است؛ نداریم یعنی نداریم.
