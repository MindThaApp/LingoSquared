  prs.a2.unit38.lesson06.station_conversation:
    title: گفتگو در ایستگاه
teaching:
  prs.a2.unit38.lesson01.teach.station:
    title: ایستگاه
    gloss: ایستگاه
    note: '*ایستگاه* جای توقف اتوبوس یا قطار است. در این واحد دربارهٔ جای مکان‌ها می‌پرسیم و ایستگاه اولین آن‌هاست: *ایستگاه بس* یعنی ایستگاه اتوبوس.'
    example_gloss: ایستگاه در کابل است.
  prs.a2.unit38.lesson01.teach.museum:
    title: موزه
    gloss: موزه
    note: '*موزیم* یعنی موزه. موزهٔ ملی افغانستان در کابل است.'
    example_gloss: موزه در کابل است.
  prs.a2.unit38.lesson01.teach.office:
    title: دفتر
    gloss: دفتر
    note: '*دفتر* یعنی اداره، مثلاً اداره پاسپورت یا دفتر یک شرکت اتوبوسرانی.'
    example_gloss: اداره نزدیک است.
  prs.a2.unit38.lesson01.teach.library:
    title: کتابخانه
    gloss: کتابخانه
    note: '*کتابخانه* همان کتابخانه است. *نزدیک* یعنی نزدیک.'
    example_gloss: کتابخانه نزدیک است.
  prs.a2.unit38.lesson01.teach.where:
    title: کجاست؟
    gloss: کجاست؟
    note: '*کجا* یعنی کجا و *کجاست* یعنی «کجا است»: *کجا* به‌علاوهٔ شکل کوتاه *است*. اول جا را بگویید: *ایستگاه کجاست؟* یعنی ایستگاه کجاست؟'
    example_gloss: موزه کجاست؟
  prs.a2.unit38.lesson01.teach.know:
    title: دانستن
    gloss: من می‌دانم
    note: '*دانستن* یعنی از یک واقعیت خبر داشتن: *می‌دانم* یعنی «می‌دانم». برای واقعیت‌ها (جای یک مکان، ساعت حرکت اتوبوس) به کار می‌رود، نه برای شناختن یک آدم.'
    example_gloss: می‌دانم.
  prs.a2.unit38.lesson01.teach.know_paradigm:
    title: 'دانستن: می‌دانم'
    gloss: می‌دانم، می‌دانی، می‌داند، می‌دانیم، می‌دانید (محترمانه یا جمع)، می‌دانند
    note: 'حال *دانستن* از *می‌* و شناسه ساخته می‌شود: *می‌دانم، می‌دانی، می‌داند، می‌دانیم، می‌دانین، می‌دانند*. شناسهٔ «شما» در دری *-ین* است (در فارسی ایران -ید). با غریبه، آدم بزرگ‌تر یا یک گروه *می‌دانین* می‌گویید؛ با دوست نزدیک *می‌دانی*. ضمیر اختیاری است.'
  prs.a2.unit38.lesson01.teach.direct_to_indirect:
    title: از پرسش مستقیم به پرسش غیرمستقیم
    gloss: ایستگاه کجاست؟ می‌دانید ایستگاه کجاست؟
    note: 'پرسش غیرمستقیم نرم‌تر و مؤدبانه‌تر از پرسش مستقیم است. با *می‌دانین که* (می‌دانید که) شروع کنید و بعد پرسش مستقیم را بدون هیچ تغییری بیاورید: *ایستگاه کجاست؟* می‌شود *می‌دانین که ایستگاه کجاست؟*. واژهٔ پرسشی *کجا* سر جای خودش می‌ماند و ترتیب کلمات همان ترتیب جملهٔ خبری است.'
  prs.a2.unit38.lesson01.teach.do_you_know_museum:
    title: می‌دانید موزه کجاست؟
    gloss: می‌دانید موزه کجاست؟
    note: 'این جملهٔ نمونهٔ واحد است. *که* اختیاری است: *می‌دانین موزیم کجاست؟* هم درست است. علامت سؤال فقط یک بار، در آخر می‌آید، چون کل جمله یک پرسش است.'
  prs.a2.unit38.lesson01.teach.friend_or_polite:
    title: دوست یا مؤدبانه
    gloss: 'با دوست: می‌دانی کتابخانه کجاست؟ مؤدبانه: می‌دانید کتابخانه کجاست؟'
    note: 'فقط شناسهٔ *دانستن* بسته به مخاطب عوض می‌شود: *می‌دانی* برای دوست، *می‌دانین* برای کسی که مؤدبانه با او صحبت می‌کنید. هر چه بعد از *که* می‌آید یکی است.'
  prs.a2.unit38.lesson02.teach.know_not_know:
    title: می‌دانم / نمی‌دانم
    gloss: می‌دانم موزه کجاست. نمی‌دانم موزه کجاست.
    note: 'همین الگو برای جملهٔ خبری هم کار می‌کند. *می‌دانم که* یعنی «می‌دانم که» و *نمی‌دانم که* یعنی «نمی‌دانم که»، با *ن* پیش از فعل. پرسش جاسازی‌شده بدون تغییر می‌آید: *نمی‌دانم که موزیم کجاست.* این بار جمله با نقطه تمام می‌شود، چون جملهٔ خبری است.'
  prs.a2.unit38.lesson02.teach.order_unchanged:
    title: فعل مثل پرسش مستقیم می‌ماند
    gloss: موزه کی باز می‌شود؟ نمی‌دانم موزه کی باز می‌شود.
    note: 'هیچ چیز درون پرسش جاسازی‌شده عوض نمی‌شود. واژهٔ پرسشی جای خودش را نگه می‌دارد، فعل زمان خودش را حفظ می‌کند و به فعل التزامی نیازی نیست. در دری ترتیب کلمات جابه‌جا نمی‌شود: پرسش مستقیم و پرسش جاسازی‌شده یکسان نوشته می‌شوند.'
  prs.a2.unit38.lesson02.teach.when:
    title: کی / چه موقع
    gloss: کی، چه ساعتی
    note: '*کی* یعنی چه وقت. با *ساعت چند* هم می‌توانید ساعت را بپرسید: *بس ساعت چند حرکت می‌کند؟*'
    example_gloss: اتوبوس کی حرکت می‌کند؟
  prs.a2.unit38.lesson02.teach.opens:
    title: باز شدن
    gloss: باز می‌شود
    note: '*باز* یعنی باز و *شدن* یعنی گردیدن، پس *باز می‌شود* یعنی باز می‌شود. برای ادارات، موزه‌ها، بانک‌ها و مغازه‌ها به کار می‌رود.'
    example_gloss: اداره ساعت نه باز می‌شود.
  prs.a2.unit38.lesson02.teach.closes:
    title: بستن
    gloss: بسته می‌شود
    note: '*بسته* یعنی بسته. *بسته می‌شود* یعنی بسته می‌شود. این فعل متضاد *باز می‌شود* است.'
    example_gloss: اداره ساعت چهار بسته می‌شود.
  prs.a2.unit38.lesson02.teach.leaves:
    title: حرکت کردن
    gloss: حرکت می‌کند، راه می‌افتد
    note: '*حرکت کردن* یعنی راه افتادن. برای اتوبوس، قطار و هواپیما به کار می‌رود: *بس حرکت می‌کند* یعنی اتوبوس راه می‌افتد.'
    example_gloss: اتوبوس ساعت هشت حرکت می‌کند.
  prs.a2.unit38.lesson02.teach.ticket:
    title: بلیت
    gloss: بلیت
    note: '*بلیت* برگه‌ای برای اتوبوس، هواپیما یا موزه است.'
    example_gloss: بلیت در اداره است.
  prs.a2.unit38.lesson02.teach.why:
    title: چرا
    gloss: چرا
    note: '*چرا* یعنی «برای چه». در جمله‌ی پرسشیِ غیرمستقیم هم سر جای خودش می‌ماند: *نمی‌دانم که چرا دفتر بسته است.*'
    example_gloss: چرا دفتر بسته است؟
  prs.a2.unit38.lesson02.teach.which:
    title: کدام
    gloss: کدام
    note: '*کدام* یعنی «کدام» و پیش از اسم می‌آید: *کدام بس* یعنی «کدام اتوبوس».'
    example_gloss: کدام اتوبوس به مزار می‌رود؟
  prs.a2.unit38.lesson02.teach.question_words:
    title: کلمه‌های پرسشی بعد از که
    gloss: نمی‌دانم بلیت چند است. نمی‌دانم چرا دفتر بسته است. نمی‌دانم کدام اتوبوس به مزار می‌رود.
    note: 'هر کلمه‌ی پرسشیِ جمله‌ی پرسشیِ مستقیم می‌تواند بعد از *که* بیاید: *کجا*، *کی*، *ساعت چند*، *چند*، *چرا*، *کدام*. هر کدام سر جای خودش می‌ماند و بقیه‌ی جمله یک جمله‌ی خبریِ معمولی است.'
  prs.a2.unit38.lesson03.teach.open:
    title: باز
    gloss: باز
    note: '*باز* یعنی «باز». *باز است* یعنی «باز است».'
    example_gloss: موزه امروز باز است.
  prs.a2.unit38.lesson03.teach.closed:
    title: بسته
    gloss: بسته
    note: '*بسته* یعنی «بسته». *بانک* همان بانک است.'
    example_gloss: بانک امروز بسته است.
  prs.a2.unit38.lesson03.teach.market:
    title: بازار
    gloss: بازار
    note: '*بازار* یعنی بازار.'
    example_gloss: بازار نزدیک است.
  prs.a2.unit38.lesson03.teach.yes_no:
    title: 'سؤال بله/خیر: یا نه'
    gloss: دفتر باز است؟ می‌دانید که دفتر باز است یا نه؟
    note: 'سؤال بله/خیر کلمه‌ی پرسشی ندارد؛ پس در شکل غیرمستقیم، در آخر *یا نه* اضافه می‌شود: *می‌دانین که دفتر باز است یا نه؟* یعنی «می‌دانید دفتر باز است یا نه؟». اینجا *که* و *یا نه* جمله را در میان می‌گیرند. در دری، *یا نه* روش معمول برای گفتن «آیا» در این جمله‌هاست.'
  prs.a2.unit38.lesson03.teach.yes_no_negative:
    title: نمی‌دانم که ... یا نه
    gloss: نمی‌دانم دفتر باز است یا نه.
    note: 'شکل خبری هم همین است: *نمی‌دانم که دفتر باز است یا نه.* هر چیزی که بین *که* و *یا نه* است، همان جمله‌ی عادیِ *دفتر باز است* است.'
  prs.a2.unit38.lesson03.teach.aya:
    title: آیا
    gloss: موزه باز است؟ نمی‌دانم موزه باز است یا نه.
    note: '*آیا* کلمه‌ای رسمی است که سؤال بله/خیر را نشان می‌دهد: *آیا موزیم باز است؟* در جمله‌ی پرسشیِ غیرمستقیم می‌توانید آن را بعد از *که* هم بیاورید، مثل *که آیا موزیم باز است یا نه*، ولی لازم نیست: *یا نه* کافی است.'
  prs.a2.unit38.lesson03.teach.answer_yes_no:
    title: بله، باز است. نه، بسته است.
    gloss: بله، باز است. نه، بسته است.
    note: '*بلی* یعنی «بله» و *نخیر* یعنی «نه». در پاسخ کوتاه، صفت تکرار می‌شود: *باز است* یا *بسته است*.'
  prs.a2.unit38.lesson03.teach.know_open_today:
    title: می‌دانید امروز باز است یا نه؟
    gloss: می‌دانید امروز باز است یا نه؟
    note: 'وقتی مکان قبلاً گفته شده، می‌توانید آن را نیاورید: *امروز باز است* یعنی «امروز باز است».'
  prs.a2.unit38.lesson04.teach.excuse:
    title: ببخشید
    gloss: ببخشید، معذرت می‌خواهم
    note: '*ببخشین* یعنی «ببخشید». قبل از اینکه از یک غریبه چیزی بپرسید، آن را می‌گویید.'
    example_gloss: ببخشید، دفتر کجاست؟
  prs.a2.unit38.lesson04.teach.staff:
    title: کارمند
    gloss: کارمند
    note: '*کارمند* یعنی کارمند. پشت باجه یا گیشه‌ی بلیت معمولاً از یک *کارمند* می‌پرسید.'
    example_gloss: کارمند در دفتر است.
  prs.a2.unit38.lesson04.teach.polite_request:
    title: می‌توانید بگویید ...؟
    gloss: ببخشید، می‌توانید بگویید ایستگاه کجاست؟
    note: برای اینکه از یک غریبه مؤدبانه بپرسید، از *می‌توانین بگویین که* استفاده کنید و بعدش سؤال مستقیم را بیاورید. این یک درخواست است و ملایم‌تر از *می‌دانین که* است. *بگویین* شکل امریِ محترمانه‌ی *گفتن* است.
  prs.a2.unit38.lesson04.teach.polite_more:
    title: درخواست با سؤال‌های دیگر
    gloss: می‌توانید بگویید بلیت چند است؟ می‌توانید بگویید دفتر باز است یا نه؟
    note: 'همین درخواست با همه‌ی سؤال‌های غیرمستقیمِ این درس کار می‌کند: *چند*، *کی*، *کجا*، *چرا* و شکل بله/خیر با *یا نه*.'
  prs.a2.unit38.lesson04.teach.answer_politely:
    title: جواب مؤدبانه دادن
    gloss: بله، می‌دانم. ایستگاه نزدیک است. ببخشید، نمی‌دانم.
    note: برای پاسخ به *می‌دانین که ...؟* بگویید *بلی، می‌دانم* و اطلاعات را بدهید، یا اگر نمی‌دانید بگویید *ببخشین، نمی‌دانم*. می‌توانید بگویید *من هم نمی‌دانم* هم.
  prs.a2.unit38.lesson04.teach.me_neither:
    title: من هم نمی‌دانم
    gloss: من هم نمی‌دانم.
    note: '*هم* یعنی «نیز». با فعل منفی یعنی «هم ... نه»: *من هم نمی‌دانم* یعنی «من هم نمی‌دانم».'
  prs.a2.unit38.lesson05.teach.first:
    title: اول
    gloss: اول، ابتدا
    note: '*اول* یعنی «اول». *اول ... بعد ...* یعنی «اول ... بعد ...».'
    example_gloss: اول به بانک می‌روم.
  prs.a2.unit38.lesson05.teach.then:
    title: بعد، سپس
    gloss: بعد، سپس
    note: '*بعد* یعنی «بعد» یا «سپس».'
    example_gloss: بعد به کتابخانه می‌روم.
  prs.a2.unit38.lesson05.teach.museum_turn01:
    title: سمیر از ثمینه می‌پرسد موزه کجاست
    gloss: ثمینه، می‌دانی موزه کجاست؟
    note: سمیر از یک دوست می‌پرسد، برای همین از *می‌دانی* استفاده می‌کند. سؤال غیرمستقیم *موزیم کجاست؟* است.
  prs.a2.unit38.lesson05.teach.museum_turn02:
    title: ثمینه جواب می‌دهد
    gloss: بله، موزه نزدیک ایستگاه است.
    note: 'ثمینه می‌گوید *بلی* و اطلاعات می‌دهد: *نزدیک ایستگاه است*.'
  prs.a2.unit38.lesson05.teach.museum_turn03:
    title: سمیر ساعت باز شدن را می‌پرسد
    gloss: می‌دانی ساعت چند باز می‌شود؟
    note: قبلاً از موزه حرف زده‌اند، برای همین سمیر اسم آن را نمی‌آورد. *ساعت چند باز می‌شود* سؤال غیرمستقیم است.
  prs.a2.unit38.lesson05.teach.museum_turn04:
    title: ثمینه نمی‌داند
    gloss: نه، نمی‌دانم ساعت چند باز می‌شود.
    note: ثمینه بعد از *نمی‌دانم که* سؤال غیرمستقیم را تکرار می‌کند. *نه* یک «نه»ی دوستانه است.
  prs.a2.unit38.lesson05.teach.museum_turn05:
    title: سمیر می‌پرسد فردا باز است یا نه
    gloss: می‌دانی فردا باز است یا نه؟
    note: یک سؤال بله/خیر با *یا نه*. *فردا* یعنی «فردا».
  prs.a2.unit38.lesson05.teach.museum_turn06:
    title: ثمینه اول تلفن می‌کند
    gloss: نمی‌دانم. اول تلفن می‌کنم.
    note: '*تیلفون می‌کنم* یعنی «تلفن می‌کنم». *اول* یعنی «ابتدا». او پیش از جواب دادن تلفن می‌کند.'
  prs.a2.unit38.lesson05.teach.message:
    title: پیامی از بازار
    gloss: سلام ثمینه. امروز در بازار هستم. می‌دانی بانک کجاست؟ نمی‌دانم بانک نزدیک بازار است یا نه. می‌دانی بانک امروز باز است یا نه؟ بعد به کتابخانه می‌روم.
    note: 'یک پیام کوتاه که سه سؤال غیرمستقیم دارد: بانک کجاست، نزدیک است یا نه و باز است یا نه. دقت کنید که سؤال اول از یک دوست پرسیده می‌شود (*می‌دانی*) و دومی جمله‌ی خبری است (*نمی‌دانم که ... یا نه*).'
  prs.a2.unit38.lesson06.teach.gate:
    title: دروازه، در
    gloss: دروازه، در
    note: '*دروازه* یعنی دروازه یا در بزرگ، مثلاً دروازه‌ی ایستگاه یا دفتر.'
    example_gloss: دروازه باز است.
  prs.a2.unit38.lesson06.teach.thousand:
    title: هزار
    gloss: هزار
    note: '*هزار* یعنی هزار. *افغانی* پول افغانستان است: *هزار افغانی* یعنی هزار افغانی.'
    example_gloss: بلیت هزار افغانی است.
  prs.a2.unit38.lesson06.teach.station_turn01:
    title: سمیر از کارمند می‌پرسد
    gloss: ببخشید، می‌دانید اتوبوس مزار کی حرکت می‌کند؟
    note: سمیر با یک غریبه حرف می‌زند، برای همین از *ببخشین* و *می‌دانین* استفاده می‌کند. *بس به مزار* یعنی «اتوبوسِ مزار».
  prs.a2.unit38.lesson06.teach.station_turn02:
    title: فروشنده‌ی بلیت جواب می‌دهد
    gloss: بله، می‌دانم. اتوبوس ساعت هشت حرکت می‌کند.
    note: کارمند می‌گوید *بلی، می‌دانم* و ساعت را می‌گوید.
  prs.a2.unit38.lesson06.teach.station_turn03:
    title: سمیر قیمت را می‌پرسد
    gloss: می‌توانید بگویید بلیت چند است؟
    note: 'یک درخواست مؤدبانه: *می‌توانین بگویین که* به‌علاوه‌ی *بلیت چند است؟*.'
  prs.a2.unit38.lesson06.teach.station_turn04:
    title: کارمند قیمت را می‌گوید
    gloss: بلیت هزار افغانی است.
    note: یک پاسخ مستقیم بدون سؤال غیرمستقیم.
  prs.a2.unit38.lesson06.teach.station_turn05:
    title: سمیر درباره‌ی دفتر می‌پرسد
    gloss: متشکرم. می‌دانید دفتر کجاست؟
    note: '*تشکر* یعنی «متشکرم».'
  prs.a2.unit38.lesson06.teach.station_turn06:
    title: کارمند می‌گوید دفتر کجاست
    gloss: دفتر نزدیک دروازه است.
    note: '*نزدیک دروازه است* یعنی «نزدیک دروازه است».'
