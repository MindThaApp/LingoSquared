course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستان در سطح پیش‌متوسط: پرسیدن غیرمستقیم و مؤدبانهٔ اطلاعات، مثلاً «می‌دانید ایستگاه کجاست؟». الگوی می‌دانین که ... با پرسش جاسازی‌شدهٔ بدون تغییر (کجا، کی، چرا، کدام، چند)، «نمی‌دانم که ...»، بله یا نه با یا نه، و درخواست مؤدبانهٔ می‌توانین بگویین که ... .'
units:
  prs.a2.unit38.asking_indirectly:
    title: پرسیدن غیرمستقیم
