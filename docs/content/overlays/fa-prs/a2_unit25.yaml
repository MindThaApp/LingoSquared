teaching:
  prs.a2.unit25.lesson01.teach.ever:
    title: تا حالا
    gloss: تا حالا، تاکنون
    note: '*تا حال* یعنی تا همین لحظه. در پرسش، دربارهٔ کل زندگی تا امروز می‌پرسد: *آیا تا حال به هرات رفته‌ای؟* یعنی «تا حالا به هرات رفته‌اید؟» *آیا* پرسش بله/خیر را شروع می‌کند.'
    example_gloss: تا حالا به هرات رفته‌اید؟
  prs.a2.unit25.lesson01.teach.herat:
    title: هرات
    gloss: هرات
    note: '*هرات* شهر بزرگی در غرب افغانستان است که به ارگ قدیمی و بازارهایش معروف است.'
    example_gloss: دوستم اهل هرات است.
  prs.a2.unit25.lesson01.teach.mazar:
    title: مزار شریف
    gloss: مزار شریف
    note: '*مزار شریف* شهر بزرگ شمال افغانستان است که به خاطر زیارتگاه کاشی‌کاری‌شده‌ی آبی‌اش معروف است.'
    example_gloss: دوستم در مزار شریف زندگی می‌کند.
  prs.a2.unit25.lesson01.teach.bamyan:
    title: بامیان
    gloss: بامیان
    note: '*بامیان* دره‌ای در ارتفاعات مرکزی افغانستان است که به خاطر منظره‌های کوهستانی‌اش معروف است.'
    example_gloss: دوستم بامیان رفته است.
  prs.a2.unit25.lesson01.teach.qabili:
    title: قابلی پلو
    gloss: پلوی افغانی با گوشت، هویج و کشمش
    note: '*قابلی پلو* برنجی است که با گوشت، هویج و کشمش پخته می‌شود و از غذاهای محبوب افغانی است.'
    example_gloss: قابلی پلو خیلی خوشمزه است.
  prs.a2.unit25.lesson01.teach.mantu:
    title: منتو
    gloss: پیراشکی بخارپز با گوشت و پیاز
    note: '*منتو* نوعی خمیرپیچ بخارپز است که داخلش گوشت و پیاز می‌ریزند.'
    example_gloss: من منتو دوست دارم.
  prs.a2.unit25.lesson01.teach.plane:
    title: هواپیما
    gloss: هواپیما
    note: '*طیاره* کلمه‌ی افغانی برای هواپیماست.'
    example_gloss: هواپیما به کابل رسید.
  prs.a2.unit25.lesson01.teach.travel:
    title: سفر کردن
    gloss: سفر کردن
    note: '*سفر کردن* یعنی مسافرت کردن. وسیله‌ی سفر را با *با* می‌گویید: *با بس سفر کردن* یعنی با اتوبوس سفر کردن.'
    example_gloss: دوستم با اتوبوس سفر کرد.
  prs.a2.unit25.lesson01.teach.been_herat:
    title: من به هرات رفته‌ام
    gloss: من به هرات رفته‌ام.
    note: '*به* یعنی «به» یا «تا». این اولین جمله‌ی ماضی نقلی این درس است: *رفته‌ام* می‌گوید که در زندگی‌تان یک بار به جایی رفته‌اید، بدون این‌که بگویید کِی.'
  prs.a2.unit25.lesson01.teach.formal_paradigm:
    title: 'ماضی نقلی در شکل نوشتاری: صفت مفعولی + شناسه'
    gloss: من رفته‌ام، تو رفته‌ای، او رفته است، ما رفته‌ایم، شما رفته‌اید (رسمی یا جمع)، آن‌ها رفته‌اند
    note: 'ماضی نقلی می‌گوید تا حالا در زندگی چه کاری کرده‌اید یا نکرده‌اید، بدون این‌که زمانش را بگویید. دو بخش دارد. اول صفت مفعولی: بن ماضی را بگیرید و *ه* اضافه کنید. بن ماضی *رفتن* می‌شود *رفت*، پس صفت مفعولی می‌شود *رفته*. بعد یک شناسه‌ی کوتاه که با شخص جور است: *رفته‌ام* (من)، *رفته‌ای* (تو، به دوست)، *رفته است* (او)، *رفته‌ایم* (ما)، *رفته‌این* (شما، رسمی یا جمع؛ *رفته‌اید* هم قبول است)، *رفته‌اند* (آن‌ها). در نوشتار، شناسه‌ها با نیم‌فاصله به صفت مفعولی وصل می‌شوند. ضمیر (*من، تو، او*) اختیاری است، چون شناسه خودش شخص را نشان می‌دهد. این شکل رسمی و نوشتاری است که در نامه، خبر و کتاب می‌بینید. در فارسی ایران هم همین ساختار را دارید، فقط در دری افغانستان شناسه‌ی «شما» به شکل -ین است.'
  prs.a2.unit25.lesson01.teach.spoken_paradigm:
    title: ماضی نقلی در شکل گفتاریِ کابلی
    gloss: من رفته‌ام، تو رفته‌ای، او رفته است، ما رفته‌ایم، شما رفته‌اید (رسمی یا جمع)، آن‌ها رفته‌اند
    note: 'در صحبت روزمره‌ی کابل، صفت مفعولی و شناسه در یک کلمه‌ی کوتاه ادغام می‌شوند که از بن ماضی ساخته می‌شود: *رفتیم* (من رفته‌ام)، *رفتی* (تو، به دوست)، *رفته* (او)، *رفتیم* (ما)، *رفتین* (شما، جمع)، *رفتن* (آن‌ها). سوم شخص مفرد فقط خود صفت مفعولی است: *رفته*. مواظب اول شخص باشید: *رفتیم* گفتاری (من رفته‌ام) همان ماضی ساده‌ی *رفتم* (من رفتم) نیست؛ آخرش *-یم* دارد و املایش با جمع *رفتیم* (ما رفته‌ایم) یکی است. بافت فرق را نشان می‌دهد: *تا حال، هرگز، هنوز، قبلا* و پرسش درباره‌ی تجربه به ماضی نقلی اشاره می‌کنند (*تا حال رفتیم* = تا حالا رفته‌ام)، ولی زمان مشخصی مثل *پارسال* یا *دیروز* ماضی ساده می‌خواهد (*پارسال رفتم*). شکل‌های رسمی و وصل‌شده (*رفته‌ام*) هم آموزش داده می‌شوند و این دوره در هر پاسخ هر دو را قبول می‌کند: در نوشتار و صحبت رسمی از شکل وصل‌شده و با دوستان و خانواده از شکل گفتاری استفاده کنید. شناسه‌ی «شما» در هر دو *-ین* است: *رفته‌این* و *رفتین*.'
  prs.a2.unit25.lesson02.teach.participle_rule:
    title: 'صفت مفعولی: بن ماضی + ه'
    gloss: رفته، خورده، دیده، پخته، کرده
    note: 'با یک قاعده تقریباً برای هر فعل صفت مفعولی می‌سازید: از مصدر شروع کنید، *ن* را بیندازید تا بن ماضی به دست بیاید و *ه* اضافه کنید. *رفتن* می‌شود *رفت* و بعد *رفته*. *خوردن* می‌شود *خورد* و *خورده*. *دیدن* می‌شود *دید* و *دیده*. *پختن* می‌شود *پخت* و *پخته*. *کردن* می‌شود *کرد* و *کرده*. صفت مفعولی با شخص تغییر نمی‌کند؛ فقط شناسه‌ی بعد از آن عوض می‌شود.'
  prs.a2.unit25.lesson02.teach.eat_paradigm:
    title: 'همان شناسه‌ها، فعلی تازه: خوردن'
    gloss: من خورده‌ام، تو خورده‌ای، او خورده است، ما خورده‌ایم، شما خورده‌اید (رسمی یا جمع)، آن‌ها خورده‌اند
    note: 'شناسه‌هایی که با *رفته* یاد گرفتید با هر صفت مفعولی کار می‌کنند: *خورده‌ام، خورده‌ای، خورده است، خورده‌ایم، خورده‌این، خورده‌اند*. در گفتار هم همین صفت مفعولی ادغام می‌شود: *خوردیم، خوردی، خورده، خوردیم، خوردین، خوردن*. پس برای این‌که بگویید فیلمی دیده‌اید، می‌توانید بنویسید *فلم دیده‌ام* یا بگویید *فلم دیدیم*.'
  prs.a2.unit25.lesson02.teach.spoken_more:
    title: شکل‌های گفتاریِ همین فعل‌ها
    gloss: من خورده‌ام، تو خورده‌ای، او خورده است، شما خورده‌اید (جمع)، آن‌ها خورده‌اند؛ من دیده‌ام، تو دیده‌ای؛ من پخته‌ام، تو پخته‌ای؛ من کرده‌ام، تو کرده‌ای
    note: 'شکل‌های گفتاری برای هر فعل به یک شکل ساخته می‌شوند: بن ماضی را بگیرید و شناسه را اضافه کنید. *خورد* می‌شود *خوردیم، خوردی، خورده، خوردین، خوردن*؛ *دید* می‌شود *دیدیم، دیدی*؛ *پخت* می‌شود *پختیم، پختی*؛ *کرد* می‌شود *کردیم، کردی*. یادتان باشد *خوردیم* گفتاری (من خورده‌ام) همان ماضی ساده‌ی *خوردم* (من خوردم) نیست؛ کلمه‌ای مثل *تا حال* یا *هرگز*، یا نبودنِ زمان مشخص، ماضی نقلی را نشان می‌دهد.'
  prs.a2.unit25.lesson02.teach.movie:
    title: فیلم
    gloss: فیلم
    note: '*فلم* کلمه‌ی افغانی برای فیلم است. فیلم را با فعل *دیدن* می‌گویید: *فلم دیدن* یعنی فیلم تماشا کردن.'
    example_gloss: دیشب فیلم دیدم.
  prs.a2.unit25.lesson02.teach.kebab:
    title: کباب
    gloss: کباب، گوشت کبابی
    note: '*کباب* گوشت کبابی است، یکی از رایج‌ترین غذاهایی که در افغانستان می‌توانید امتحان کنید.'
    example_gloss: دیروز کباب خوردم.
  prs.a2.unit25.lesson02.teach.mantu_qabili:
    title: من منتو و قابلی پلو خورده‌ام
    gloss: من منتو و قابلی پلو خورده‌ام.
    note: '*و* یعنی «و». یک صفت مفعولی در آخر جمله، *خورده‌ام*، هر دو غذا را پوشش می‌دهد.'
  prs.a2.unit25.lesson02.teach.seen_herat:
    title: من هرات را دیده‌ام
    gloss: من هرات را دیده‌ام.
    note: '*را* بعد از چیز معین، مثل نام یک شهر، می‌آید که مفعول کار است: *هرات را* یعنی شهر هرات. *دیده‌ام* صفت مفعولی *دیدن* به‌اضافه‌ی *-ام* است.'
  prs.a2.unit25.lesson02.teach.cooked:
    title: من قابلی پلو پخته‌ام
    gloss: من قابلی پلو پخته‌ام.
    note: '*پخته‌ام* صفت مفعولی *پختن* (پختن غذا) به‌اضافه‌ی *-ام* است. در گفتار: *قابلی پلو پختیم*.'
  prs.a2.unit25.lesson03.teach.last_year:
    title: پارسال
    gloss: پارسال
    note: '*پارسال* یعنی سال گذشته. کلمه‌ای مثل این، رویداد را در یک زمان مشخص ثابت می‌کند، پس فعل بعدش ماضی ساده است، نه ماضی نقلی.'
    example_gloss: پارسال به کابل رفتم.
  prs.a2.unit25.lesson03.teach.two_years_ago:
    title: دو سال پیش
    gloss: دو سال پیش
    note: '*پیش* بعد از یک مدت یعنی «قبل»: *دو سال پیش* یعنی دو سال قبل. این هم کلمه‌ی زمانی دیگری است که ماضی ساده می‌خواهد.'
    example_gloss: دو سال پیش به مزار شریف رفتم.
  prs.a2.unit25.lesson03.teach.never:
    title: هرگز
    gloss: هرگز، هیچ‌وقت
    note: '*هرگز* یعنی هرگز. با فعل منفی می‌آید، پس جمله با *ن* همچنان منفی است: *به بامیان هرگز نرفته‌ام* یعنی هرگز به بامیان نرفته‌ام.'
    example_gloss: هرگز به بامیان نرفته‌ام.
  prs.a2.unit25.lesson03.teach.never_alt:
    title: هرگز (کلمه‌ی دیگر)
    gloss: هرگز، هیچ‌وقت
    note: '*هیچ‌وقت* در اینجا هم‌معنی *هرگز* است و آن هم فعل منفی می‌خواهد: *هیچ‌وقت فلم ندیده‌ام* یعنی هیچ‌وقت فیلم ندیده‌ام. کمی روزمره‌تر از *هرگز* است.'
    example_gloss: هرگز به بامیان نرفته‌ام.
  prs.a2.unit25.lesson03.teach.neg_formal:
    title: 'منفی: ن روی صفت مفعولی'
    gloss: من نرفته‌ام، تو نرفته‌ای، او نرفته است، ما نرفته‌ایم، شما نرفته‌اید (رسمی یا جمع)، آن‌ها نرفته‌اند
    note: 'برای گفتن این‌که کاری را نکرده‌اید، *ن* را جلوی صفت مفعولی بگذارید و همان شناسه‌ها را نگه دارید: *رفته‌ام* می‌شود *نرفته‌ام*. مجموعه‌ی کامل: *نرفته‌ام، نرفته‌ای، نرفته است، نرفته‌ایم، نرفته‌این، نرفته‌اند*. *ن* به صفت مفعولی تعلق دارد، نه به شناسه.'
  prs.a2.unit25.lesson03.teach.neg_spoken:
    title: منفی در شکل گفتاری
    gloss: من نرفته‌ام، تو نرفته‌ای، او نرفته است، ما نرفته‌ایم، شما نرفته‌اید (رسمی یا جمع)، آن‌ها نرفته‌اند
    note: 'منفی گفتاری هم همین‌طور است: *ن* روی شکل ادغام‌شده می‌آید: *نرفتیم، نرفتی، نرفته، نرفتیم، نرفتین، نرفتن*. هم *نرفته‌ام* و هم *نرفتیم* درست‌اند و یعنی «نرفته‌ام». *نرفتیم* گفتاری (نرفته‌ام) را با منفی ماضی ساده، *نرفتم* (نرفتم)، اشتباه نگیرید: زمان مشخصی مثل *دیروز* با *نرفتم* می‌آید.'
  prs.a2.unit25.lesson03.teach.neg_more:
    title: همان ن با فعل‌های دیگر
    gloss: نخورده‌ام، ندیده‌ام، نپخته‌ام، نکرده‌ام
    note: 'قاعده برای همه‌ی فعل‌ها یکی است: *نخورده‌ام* (نخورده‌ام)، *ندیده‌ام* (ندیده‌ام)، *نپخته‌ام* (نپخته‌ام)، *نکرده‌ام* (نکرده‌ام). در فعل‌هایی که از یک کلمه به‌اضافه‌ی *کردن* ساخته شده‌اند، *ن* روی *کرده* می‌آید: *سفر نکرده‌ام* (سفر نکرده‌ام)، نه *نسفر کرده‌ام*. در گفتار: *نخوردیم، ندیدیم، نپختیم، نکردیم*.'
  prs.a2.unit25.lesson03.teach.contrast:
    title: ماضی نقلی یا ماضی ساده؟
    gloss: پارسال به هرات رفتم. / به هرات رفته‌ام. / به هرات می‌روم.
    note: 'وقتی زمان رویداد را می‌گویید ماضی ساده به کار ببرید: *پارسال به هرات رفتم* یا *دو سال پیش رفتم*. وقتی زمان گفته نمی‌شود و فقط می‌گویید این بخشی از تجربه‌ی شماست، ماضی نقلی بگویید: *به هرات رفته‌ام*. حال هم باز فرق دارد: *به هرات می‌روم* (به هرات می‌روم یا دارم می‌روم). پس کلمه‌ی زمانی مثل *پارسال* یا *دیروز* با *رفتم* می‌آید، ولی *تا حال* و *هرگز* با *رفته‌ام* و *نرفته‌ام*.'
  prs.a2.unit25.lesson04.teach.already:
    title: قبلاً
    gloss: قبلاً، پیش‌تر
    note: '*قبلا* یعنی پیش از حالا یا قبلاً. با ماضی نقلی مثبت می‌آید: *قبلا به هرات رفته‌ام* یعنی قبلاً به هرات رفته‌ام.'
    example_gloss: قبلاً به هرات رفته‌ام.
  prs.a2.unit25.lesson04.teach.not_yet:
    title: هنوز
    gloss: هنوز
    note: '*هنوز* با ماضی نقلی منفی یعنی «هنوز نه»: *هنوز به هرات نرفته‌ام* یعنی هنوز به هرات نرفته‌ام.'
    example_gloss: هنوز به هرات نرفته‌ام.
  prs.a2.unit25.lesson04.teach.times:
    title: یک بار، دو بار
    gloss: یک بار، دو بار
    note: '*بار* یعنی دفعه. *یک بار* یعنی یک دفعه و *دو بار* یعنی دو دفعه. عدد قبل از *بار* می‌آید و جمله همچنان ماضی نقلی است.'
    example_gloss:
    - دو بار به مزار شریف رفته‌ام.
    - یک بار با هواپیما سفر کرده‌ام.
  prs.a2.unit25.lesson04.teach.how_many:
    title: چند بار رفته‌اید؟
    gloss: چند بار به مزار شریف رفته‌ای؟
    note: '*چند* یعنی «چند». *چند بار* می‌پرسد چند دفعه، و جواب یک عدد به‌اضافه‌ی *بار* است: *دو بار*.'
  prs.a2.unit25.lesson04.teach.yes_no:
    title: بله، نه
    gloss: بله، نه
    note: '*بلی* یعنی بله و *نخیر* «نه»ی مؤدبانه‌ی روزمره است. در پاسخ کوتاه صفت مفعولی تکرار می‌شود: *بلی، رفته‌ام* یا *نخیر، نرفته‌ام*.'
    example_gloss:
    - بله، به هرات رفته‌ام.
    - نه، هنوز به هرات نرفته‌ام.
  prs.a2.unit25.lesson04.teach.but:
    title: اما
    gloss: ولی
    note: '*ولی* کاری را که کرده‌اید به کاری که نکرده‌اید وصل می‌کند: *به مزار شریف رفته‌ام، ولی به هرات نرفته‌ام*.'
    example_gloss: به مزار شریف رفته‌ام، ولی به هرات نرفته‌ام.
  prs.a2.unit25.lesson04.teach.qa:
    title: پرسیدن و پاسخ دادن درباره‌ی تجربه
    gloss: تا حالا به هرات رفته‌ای؟ بله، رفته‌ام. نه، تا حالا نرفته‌ام.
    note: 'برای پرسیدن این‌که کسی تا حالا کاری کرده یا نه، *آیا* و *تا حال* را با ماضی نقلی به کار ببرید: *آیا تا حال به هرات رفته‌ای؟* با دوست می‌توانید شکل گفتاری را هم بگویید: *آیا تا حال به هرات رفتی؟* با *بلی* و صفت مفعولی جواب بدهید (*بلی، رفته‌ام*) یا با *نخیر* و منفی (*نخیر، تا حال نرفته‌ام*). می‌توانید تعداد را هم اضافه کنید: *بلی، دو بار رفته‌ام*. در گفتار می‌شود *آیا* را انداخت، چون لحن صدا پرسشی بودن را نشان می‌دهد.'
  prs.a2.unit25.lesson04.teach.adverbs:
    title: قبلاً، هنوز نه، هرگز
    gloss: قبلاً رفته‌ام. هنوز نرفته‌ام. هرگز نرفته‌ام.
    note: 'سه کلمه‌ی کوچک به این پرسش جواب می‌دهند که آیا کاری را قبلاً انجام داده‌اید یا نه. *قبلا رفته‌ام* یعنی قبلاً رفته‌ام. *هنوز نرفته‌ام* یعنی هنوز نرفته‌ام و نشان می‌دهد شاید باز هم بروید. *هرگز نرفته‌ام* یعنی هرگز نرفته‌ام، بدون چنین اشاره‌ای. *قبلا* با صفت مفعولی مثبت می‌آید؛ *هنوز* و *هرگز* با صفت مفعولی منفی. هر سه پیش از صفت مفعولی می‌آیند، معمولاً بعد از نام مکان: *به هرات هنوز نرفته‌ام*. شکل‌های گفتاری هم همین‌طورند: *هنوز نرفتیم*.'
  prs.a2.unit25.lesson05.teach.also:
    title: هم، همچنین
    gloss: هم، همچنین
    note: '*هم* یعنی «هم» یا «همچنین». درست بعد از چیزی که اضافه می‌کند می‌آید: *قابلی پلو هم پخته‌ام* یعنی قابلی پلو هم پخته‌ام.'
    example_gloss: قابلی پلو هم پخته‌ام.
  prs.a2.unit25.lesson05.teach.profile:
    title: زرمینه درباره‌ی تجربه‌هایش می‌نویسد
    gloss: من زرمینه هستم. تا حالا به هرات و مزار شریف رفته‌ام، ولی به بامیان نرفته‌ام. منتو و قابلی پلو خورده‌ام. قابلی پلو هم پخته‌ام. با هواپیما سفر نکرده‌ام.
    note: 'یک معرفی‌نامهٔ کوتاه به زبان نوشتاری رسمی. چهار کاری که انجام داده و دو کاری که انجام نداده: *به بامیان نرفته‌ام* و *با طیاره سفر نکرده‌ام*.'
  prs.a2.unit25.lesson05.teach.ex_q:
    title: همایون از زرمینه دربارهٔ پرواز با هواپیما می‌پرسد
    gloss: زرمینه، تا حالا با هواپیما سفر کرده‌ای؟
    note: همایون با دوستش از شکل گفتاری *سفر کردی* استفاده می‌کند. سؤال با *آیا تا حال* شروع می‌شود.
  prs.a2.unit25.lesson05.teach.ex_a:
    title: زرمینه می‌گوید هرگز سفر نکرده است
    gloss: نه، من هرگز با هواپیما سفر نکرده‌ام. شما چطور؟
    note: '*هرگز* قبل از صفت مفعولی منفی *نکردیم* می‌آید. *تو چطور؟* راه کوتاهی برای پرسیدن «و تو؟» است.'
  prs.a2.unit25.lesson05.teach.ex_a2:
    title: همایون می‌گوید یک بار
    gloss: بله، یک بار سفر کرده‌ام.
    note: '*بلی* یعنی بله و *یک بار* تعداد دفعات را می‌گوید. مکان حذف شده، چون از سؤال معلوم است.'
  prs.a2.unit25.lesson06.teach.turn01:
    title: زرمینه از همایون دربارهٔ مزار شریف می‌پرسد
    gloss: همایون، تا حالا به مزار شریف رفته‌ای؟
    note: زرمینه با دوستش از شکل گفتاری *رفتی* استفاده می‌کند. سؤال با *آیا تا حال* شروع می‌شود.
  prs.a2.unit25.lesson06.teach.turn02:
    title: همایون می‌گوید دو بار، بعد می‌گوید هنوز نه
    gloss: بله، دو بار رفته‌ام. ولی هنوز به هرات نرفته‌ام. تو چطور؟
    note: '*دو بار* تعداد دفعات را می‌گوید. *ولی هنوز به هرات نرفتیم* جایی را که هنوز نرفته در برابر جایی که رفته قرار می‌دهد.'
  prs.a2.unit25.lesson06.teach.turn03:
    title: زرمینه از هرات و بامیان می‌گوید
    gloss: من یک بار به هرات رفته‌ام، ولی هرگز به بامیان نرفته‌ام.
    note: '*یک بار* یعنی یک دفعه و *به بامیان هرگز نرفتیم* یعنی هیچ‌وقت. *هرگز* با صفت مفعولی منفی می‌آید.'
  prs.a2.unit25.lesson06.teach.turn04:
    title: همایون دربارهٔ آشپزی می‌پرسد
    gloss: تا حالا قابلی پلو پخته‌ای؟
    note: سؤال بله/نه دربارهٔ تجربه، با *تا حال* و شکل گفتاری *پختی*.
  prs.a2.unit25.lesson06.teach.turn05:
    title: زرمینه قبلاً آن را پخته است
    gloss: بله، قبلاً پخته‌ام. تو چطور؟
    note: '*قبلا پختیم* یعنی «قبلاً پخته‌ام». نام غذا حذف شده، چون هر دو گوینده آن را می‌دانند.'
  prs.a2.unit25.lesson06.teach.turn06:
    title: همایون هنوز آن را نپخته است
    gloss: نه، هنوز نپخته‌ام. ولی خورده‌ام.
    note: '*هنوز نپختیم* یعنی هنوز نه، با *ن* روی صفت مفعولی. *ولی خوردیم* کاری را که انجام داده اضافه می‌کند.'
  prs.a2.unit25.lesson06.teach.turn07:
    title: واکنش زرمینه
    gloss: چه خوب!
    note: '*چه خوب!* واکنشی دوستانه به خبر خوب است.'
exercises:
  prs.a2.unit25.lesson01.exercise01.recognize_been_herat:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: من به هرات رفته‌ام
    distractors:
    - دارم به هرات می‌روم
    - هرگز به هرات نرفته‌ام
    - او به هرات رفته است
    accepted_answers:
    - value: من به هرات رفته‌ام
      status: correct
    feedback: '*رفته‌ام* از صفت مفعولی *رفته* به‌اضافهٔ شناسهٔ *-ام* ساخته می‌شود: *به هرات رفته‌ام* یعنی «به هرات رفته‌ام».'
  prs.a2.unit25.lesson01.exercise02.recognize_we_bamyan:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: ما به بامیان رفته‌ایم
    distractors:
    - من به بامیان رفته‌ام
    - آن‌ها به بامیان رفته‌اند
    - او به بامیان رفته است
    accepted_answers:
    - value: ما به بامیان رفته‌ایم
      status: correct
    feedback: 'شناسهٔ *-ایم* در *رفته‌ایم* یعنی «ما»: *ما به بامیان رفته‌ایم* یعنی «ما به بامیان رفته‌ایم».'
  prs.a2.unit25.lesson01.exercise03.recognize_spoken_you:
    instruction: این جملهٔ گفتاری چه معنایی دارد؟
    correct_option: تو به هرات رفته‌ای (خطاب به دوست)
    distractors:
    - من به هرات رفته‌ام
    - او به هرات رفته است
    - ما به هرات رفته‌ایم
    accepted_answers:
    - value: تو به هرات رفته‌ای (خطاب به دوست)
      status: correct
    feedback: 'در شکل گفتاری، *-ی* شناسهٔ «تو» (دوست) است: *تو به هرات رفتی* یعنی «تو به هرات رفته‌ای».'
  prs.a2.unit25.lesson01.exercise04.match_perfect_forms:
    instruction: هر کلمهٔ دری را با معنی‌اش جفت کنید.
    accepted_answers:
    - value:
        رفته‌ام: من رفته‌ام
        رفته‌ای: تو رفته‌ای (به دوست)
        رفته است: او رفته است
        رفته‌ایم: ما رفته‌ایم
        رفته‌این: شما رفته‌اید (محترمانه یا جمع)
        رفته‌اند: آن‌ها رفته‌اند
        هرات: هرات
        بامیان: بامیان
        مزار شریف: مزار شریف
      status: correct
    feedback: 'هر شناسه نشان می‌دهد چه کسی رفته است: *-ام* من، *-ای* تو (دوست)، *است* او، *-ایم* ما، *-این* شما (رسمی یا جمع)، *-اند* آن‌ها.'
    pairs:
    - left: رفته‌ام
      right: من رفته‌ام
    - left: رفته‌ای
      right: تو رفته‌ای (به دوست)
    - left: رفته است
      right: او رفته است
    - left: رفته‌ایم
      right: ما رفته‌ایم
    - left: رفته‌این
      right: شما رفته‌اید (محترمانه یا جمع)
    - left: رفته‌اند
      right: آن‌ها رفته‌اند
    - left: هرات
      right: هرات
    - left: بامیان
      right: بامیان
    - left: مزار شریف
      right: مزار شریف
  prs.a2.unit25.lesson01.exercise05.order_ever_herat:
    instruction: 'کلمات را مرتب کنید تا از یک دوست بپرسید: تا حالا به هرات رفته‌ای؟'
    accepted_answers:
    - value:
      - آیا
      - تا
      - حال
      - به
      - هرات
      - رفته‌ای
      status: correct
    feedback: '*آیا تا حال به هرات رفته‌ای؟* با *آیا* شروع می‌شود و صفت مفعولی همراه شناسه آخر می‌آید.'
  prs.a2.unit25.lesson01.exercise06.translate_been_herat:
    instruction: 'به دری ترجمه کنید و از ماضی نقلی «رفتن» استفاده کنید: من به هرات رفته‌ام.'
    accepted_answers:
    - value: به هرات رفته‌ام
      status: correct
    - value: من به هرات رفته‌ام
      status: correct
    - value: به هرات رفتیم
      status: correct
    - value: من به هرات رفتیم
      status: correct
    feedback: '*به هرات رفته‌ام* یعنی «به هرات رفته‌ام». شکل گفتاری *به هرات رفتیم* هم درست است و *من* اختیاری است.'
  prs.a2.unit25.lesson02.exercise01.recognize_eaten:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: من قابلی پلو خورده‌ام
    distractors:
    - من قابلی پلو پخته‌ام
    - قابلی پلو دیده‌ام
    - قابلی پلو خریده‌ام
    accepted_answers:
    - value: من قابلی پلو خورده‌ام
      status: correct
    feedback: '*خورده‌ام* صفت مفعولی *خوردن* به‌اضافهٔ *-ام* است: *قابلی پلو خورده‌ام* یعنی «قابلی پلو خورده‌ام».'
  prs.a2.unit25.lesson02.exercise02.recognize_seen_herat:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: تو هرات را دیده‌ای
    distractors:
    - من هرات را دیده‌ام
    - او هرات را دیده است
    - ما هرات را دیده‌ایم
    accepted_answers:
    - value: تو هرات را دیده‌ای
      status: correct
    feedback: '*دیده‌ای* از *دیده* به‌اضافهٔ شناسهٔ *-ای* برای «تو» ساخته می‌شود: *هرات را دیده‌ای* یعنی «هرات را دیده‌ای».'
  prs.a2.unit25.lesson02.exercise03.match_participles:
    instruction: هر شکل دری را به معنی‌اش وصل کنید.
    accepted_answers:
    - value:
        رفته: رفته
        خورده: خورده
        دیده: دیده
        پخته: پخته
        کرده: کرده
        خوردیم: من خورده‌ام
        دیدی: تو دیده‌ای (به دوست)
        پختیم: ما پخته‌ایم
        کردن: آن‌ها کرده‌اند
        رفتین: شما رفته‌اید (محترمانه یا جمع)
      status: correct
    feedback: صفت مفعولی به‌تنهایی شخص ندارد. شناسهٔ گفتاری که در خود فعل است، *-یم، -ی، -یم، -ین، -ن*، نشان می‌دهد چه کسی است و سوم شخص مفرد اصلاً شناسه ندارد.
    pairs:
    - left: رفته
      right: رفته
    - left: خورده
      right: خورده
    - left: دیده
      right: دیده
    - left: پخته
      right: پخته
    - left: کرده
      right: کرده
    - left: خوردیم
      right: من خورده‌ام
    - left: دیدی
      right: تو دیده‌ای (به دوست)
    - left: پختیم
      right: ما پخته‌ایم
    - left: کردن
      right: آن‌ها کرده‌اند
    - left: رفتین
      right: شما رفته‌اید (محترمانه یا جمع)
  prs.a2.unit25.lesson02.exercise04.order_mantu_qabili:
    instruction: 'کلمات را مرتب کنید تا بگویید: من مانتو و قابلی پلو خورده‌ام.'
    accepted_answers:
    - value:
      - منتو
      - و
      - قابلی
      - پلو
      - خورده‌ام
      status: correct
    - value:
      - قابلی
      - پلو
      - و
      - منتو
      - خورده‌ام
      status: correct
    feedback: '*منتو و قابلی پلو خورده‌ام* هر دو غذا را اول و صفت مفعولی همراه شناسه را آخر می‌آورد. جای دو غذا می‌تواند عوض شود.'
  prs.a2.unit25.lesson02.exercise05.complete_eaten:
    instruction: 'جمله را با ماضی نقلی «خوردن» کامل کنید: من مانتو خورده‌ام.'
    accepted_answers:
    - value: خورده‌ام
      status: correct
    - value: خوردیم
      status: correct
    feedback: '*خورده‌ام* از صفت مفعولی *خورده* به‌اضافهٔ *-ام* ساخته می‌شود. شکل گفتاری *خوردیم* هم درست است.'
  prs.a2.unit25.lesson02.exercise06.translate_seen_movie:
    instruction: 'به دری ترجمه کنید و از ماضی نقلی «دیدن» استفاده کنید: من یک فیلم دیده‌ام.'
    accepted_answers:
    - value: فلم دیده‌ام
      status: correct
    - value: یک فلم دیده‌ام
      status: correct
    - value: من فلم دیده‌ام
      status: correct
    - value: من یک فلم دیده‌ام
      status: correct
    - value: فلم دیدیم
      status: correct
    - value: یک فلم دیدیم
      status: correct
    - value: من فلم دیدیم
      status: correct
    - value: من یک فلم دیدیم
      status: correct
    feedback: '*فلم دیده‌ام* یعنی «فیلم دیده‌ام». *من* و *یک* اختیاری هستند و *فلم دیدیم* شکل گفتاری است.'
  prs.a2.unit25.lesson03.exercise01.recognize_negative:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: من به بامیان نرفته‌ام
    distractors:
    - من به بامیان رفته‌ام
    - به بامیان نمی‌روم
    - او به بامیان نرفته است
    accepted_answers:
    - value: من به بامیان نرفته‌ام
      status: correct
    feedback: '*نرفته‌ام* از *ن* به‌اضافهٔ *رفته‌ام* ساخته می‌شود: *به بامیان نرفته‌ام* یعنی «به بامیان نرفته‌ام».'
  prs.a2.unit25.lesson03.exercise02.recognize_last_year:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: پارسال به هرات رفتم
    distractors:
    - یک زمانی به هرات رفته‌ام
    - هرگز به هرات نرفته‌ام
    - پارسال به هرات نرفتم
    accepted_answers:
    - value: پارسال به هرات رفتم
      status: correct
    feedback: '*پارسال* زمان را مشخص می‌کند، پس فعل ماضی ساده *رفتم* است: پارسال به هرات رفتم.'
  prs.a2.unit25.lesson03.exercise03.choose_experience_form:
    instruction: کدام جمله می‌گوید در عمرتان یک بار به هرات رفته‌اید، بدون ذکر زمان؟
    correct_option: به هرات رفته‌ام
    distractors:
