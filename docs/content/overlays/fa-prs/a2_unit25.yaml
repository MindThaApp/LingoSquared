course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستان در سطح پیش‌متوسطه: گفتن و پرسیدن دربارهٔ کارهایی که انجام داده‌اید یا هرگز انجام نداده‌اید. ماضی نقلی (اسم مفعول به‌اضافهٔ فعل ربطی کوتاه) در شکل نوشتاری رفته‌ام و شکل گفتاری کابلی رفتیم، شکل منفی، و تفاوت آن با گذشتهٔ ساده.'
