teaching:
  prs.a1.unit27.lesson01.teach.tall_phrase:
    title: قدبلند
    gloss: قدبلند
    note: قد بلند در اصل یعنی «قد بلند» -- قد + بلند.
    example_gloss: او قدبلند است.
  prs.a1.unit27.lesson01.teach.short_phrase:
    title: قدکوتاه
    gloss: قدکوتاه
    note: قد کوتاه در اصل یعنی «قد کوتاه» -- قد (مرور) + کوتاه.
    example_gloss: او قدکوتاه است.
  prs.a1.unit27.lesson01.teach.hair_word:
    title: مو
    gloss: مو
    note: مو یعنی مو؛ موی همان واژه است در حالت اضافه، پیش از واژهٔ بعدی (مثلاً موی سیاه).
    example_gloss: موی او سیاه است.
  prs.a1.unit27.lesson01.teach.eye_word:
    title: چشم
    gloss: چشم
    note: چشم یعنی «چشم» (عضو بینایی). برای توصیف رنگ چشم، همین شکل مفرد در گفتار روزمره رایج است.
    example_gloss: چشم‌هایش سیاه است.
  prs.a1.unit27.lesson01.teach.beard_word:
    title: ریش
    gloss: ریش
    note: ریش یعنی موی صورت مردان.
    example_gloss: او ریش دارد.
  prs.a1.unit27.lesson01.teach.glasses_word:
    title: عینک
    gloss: عینک
    note: عینک یعنی وسیله‌ای که روی چشم می‌گذارند تا بهتر ببینند.
    example_gloss: او عینک دارد.
  prs.a1.unit27.lesson01.teach.review_ast_dast:
    title: است / دارد (سوم شخص)
    gloss: است / دارد (سوم شخص)
    note: «است» و «دارد» (سوم شخص) را قبلاً در درس‌های پیشین دیده‌اید. در این واحد برای توصیف ظاهر یک نفر به کار می‌روند.
    target_text: است (هست) / دارد (سوم شخص)
  prs.a1.unit27.lesson02.teach.qiyafa_word:
    title: قیافه / ظاهر
    gloss: قیافه / ظاهر
    note: قیافه یعنی ظاهر و چهرهٔ آدم (مثلاً خوش قیافه، یعنی «خوش‌چهره»).
    example_gloss: قیافه‌اش خوب است.
  prs.a1.unit27.lesson02.teach.review_chetor:
    title: چطور
    gloss: چطور
    note: چطور یعنی «چطور / چگونه». قبلاً در احوال‌پرسی‌هایی مثل چطور استین؟ آمده بود.
    target_text: چطور (چطور)
  prs.a1.unit27.lesson02.teach.qiyafash_word:
    title: قیافه‌اش
    gloss: قیافه‌اش
    note: قیافه‌اش از قیافه (ظاهر) و شناسهٔ مالکیت ‌اش (مال «او») ساخته شده است.
  prs.a1.unit27.lesson02.teach.question_appearance:
    title: قیافه‌اش چه شکلی است؟
    gloss: قیافه‌اش چه شکلی است؟
    note: قیافه‌اش چطور است؟ راه طبیعی پرسیدن از ظاهر یک نفر است. عمداً فقط چطور است؟ گفته نشده، چون به‌تنهایی یعنی «حالش چطور است؟» (احوال‌پرسی).
  prs.a1.unit27.lesson02.teach.answer_tall:
    title: او قدبلند است
    gloss: او قدبلند است.
    note: او (که قبلاً یاد گرفته‌اید) با قد بلند است که در این واحد آمده، ترکیب می‌شود.
  prs.a1.unit27.lesson02.teach.answer_black_hair:
    title: او موی سیاه دارد
    gloss: او موی سیاه دارد.
    note: موی (مو) را با سیاه و دارد ترکیب می‌کند.
  prs.a1.unit27.lesson02.teach.answer_beard:
    title: او ریش دارد
    gloss: او ریش دارد.
    note: ریش دارد همان الگوی «داشتن» در موی سیاه دارد بالا است.
  prs.a1.unit27.lesson03.teach.review_rang:
    title: رنگ
    gloss: رنگ
    note: رنگ یعنی «رنگ». قبلاً در واحد ۲۱ (لباس‌ها) آمده بود.
    target_text: رنگ (رنگ)
  prs.a1.unit27.lesson03.teach.blue_word:
    title: آبی
    gloss: آبی
    note: آبی یعنی رنگ آبی.
    example_gloss: چشم‌هایش آبی است.
  prs.a1.unit27.lesson03.teach.brown_word:
    title: قهوه‌ای
    gloss: قهوه‌ای
    note: قهوه‌ای یعنی رنگ قهوه‌ای (برای رنگ مو یا چشم).
    example_gloss: موهایش قهوه‌ای است.
  prs.a1.unit27.lesson03.teach.eye_color_phrase:
    title: رنگ چشم
    gloss: رنگ چشم
    note: رنگ چشم از رنگ + چشم ساخته شده و دقیقاً «رنگِ چشم» معنی می‌دهد.
  prs.a1.unit27.lesson03.teach.hair_color_phrase:
    title: رنگ مو
    gloss: رنگ مو
    note: رنگ مو از رنگ + مو ساخته شده و دقیقاً «رنگِ مو» معنی می‌دهد.
  prs.a1.unit27.lesson03.teach.eye_blue_sentence:
    title: چشم‌هایش آبی است
    gloss: چشم‌هایش آبی است.
    note: آبیِ این درس را برای چشم به کار می‌برد.
  prs.a1.unit27.lesson03.teach.hair_brown_sentence:
    title: موهایش قهوه‌ای است
    gloss: موهایش قهوه‌ای است.
    note: قهوه‌ایِ این درس را برای موی به کار می‌برد.
  prs.a1.unit27.lesson04.teach.review_baradar:
    title: برادر / برادرت
    gloss: برادر / برادرت (خودمانی)
    note: برادر را قبلاً در واحد ۳ دیده‌اید. برادرت با شناسهٔ ‌ت (مال «تو») ساخته می‌شود، مثل لحن خودمانی تو که تا اینجا یاد گرفته‌اید.
    target_text: برادر (برادر) / برادرت (برادرت، محاوره‌ای)
  prs.a1.unit27.lesson04.teach.review_bali_tashakor:
    title: بله / ممنون / هم
    gloss: بله / ممنون / هم / نیز
    note: بلی (بله)، تشکر (ممنون) و هم (نیز) را قبلاً در درس‌های پیشین دیده‌اید.
    target_text: بلی (بله) / تشکر (ممنون) / هم (هم)
  prs.a1.unit27.lesson04.teach.dialogue_line1:
    title: 'همایون: زرمینه، برادرت چه شکلی است؟'
    gloss: 'همایون: زرمینه، برادرت چه شکلی است؟'
    note: پرسشی خودمانی بین دوستان، با شناسهٔ ‌ت روی برادر.
  prs.a1.unit27.lesson04.teach.dialogue_line2:
    title: 'زرمینه: قدبلند است و موی سیاه دارد'
    gloss: 'زرمینه: قدبلند است و موهای سیاه دارد.'
    note: دو ویژگی را با و (و) به هم وصل می‌کند.
  prs.a1.unit27.lesson04.teach.dialogue_line3:
    title: 'همایون: ریش دارد؟'
    gloss: 'همایون: ریش دارد؟'
    note: پرسش بله/خیر فقط با آهنگ بالارونده روی ریش دارد ساخته می‌شود.
  prs.a1.unit27.lesson04.teach.dialogue_line4:
    title: 'زرمینه: بله، ریش دارد و عینک هم دارد'
    gloss: 'زرمینه: بله، ریش دارد و عینک هم دارد.'
    note: هم (نیز) را برای ویژگی دوم به کار می‌برد.
  prs.a1.unit27.lesson04.teach.dialogue_line5:
    title: 'همایون: خوب است، ممنون'
    gloss: 'همایون: خوب است، ممنون.'
    note: خوب (خوب) کلمهٔ تازه و ساده برای پایان گفتگو است؛ تشکر (ممنون) را قبلاً دیده‌اید.
  prs.a1.unit27.lesson05.teach.reading_passage:
    title: متنی دربارهٔ ظاهر
    gloss: کریم قدبلند است. موی سیاه و چشم قهوه‌ای دارد. ریش ندارد، اما عینک دارد.
    note: متنی کوتاه که واژه‌های ظاهر این واحد را مرور می‌کند. نام کریم (همان شخصیت واحد مقایسه‌ها) و ندارد (منفی سوم شخص دارد) در آن آمده است.
  prs.a1.unit27.lesson06.teach.review_ama:
    title: ولی
    gloss: ولی
    note: اما یعنی «اما / ولی». در متن درس پنجم همین واحد آمده بود و از واحدهای پیشین هم آشناست.
    target_text: اما (اما)
  prs.a1.unit27.lesson06.teach.review_astam:
    title: من هستم / من دارم
    gloss: هستم / دارم
    note: استم (هستم) و دارم را قبلاً در درس‌های پیشین دیده‌اید. اینجا برای توصیف ظاهر خود شخص به کار می‌روند.
    target_text: استم (هستم) / دارم (دارم)
  prs.a1.unit27.lesson06.teach.wrap_summary:
    title: من قدکوتاه هستم، اما موی سیاه دارم
    gloss: من قدکوتاه هستم، اما موی سیاه دارم.
    note: دو ویژگی ظاهری را با اما به هم وصل می‌کند.
