course:
  title: دری افغانستان A1
  description: 'دری کابلی مقدماتی: واژه‌های ظاهر و چهره (قدبلند، قدکوتاه، مو، چشم، ریش، عینک)، پرسیدن اینکه کسی چه شکلی است با قیافه‌اش چطور است؟، رنگ مو و رنگ چشم (رنگ مو/رنگ چشم) و یک گفت‌وگوی زرمینه و همایون دربارهٔ شناختن کسی از روی ظاهرش.'
