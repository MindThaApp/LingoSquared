teaching:
  prs.a2.unit39.lesson01.teach.message:
    title: پیام
    gloss: پیام
    note: '*پیام* یعنی پیغام، مثلاً پیام تلفنی یا پیامک. در این درس شما یک پیام را می‌رسانید: به نفر دوم می‌گویید که نفر اول چه گفت، چه پرسید یا چه خواست.'
    example_gloss: یک پیام برای شما دارم.
  prs.a2.unit39.lesson01.teach.says:
    title: او می‌گوید
    gloss: می‌گوید
    note: '*می‌گوید* یعنی «او می‌گوید»، حال ساده‌ی *گفتن*. *می‌گویم* (من می‌گویم) را قبلاً بلدید. پایان *-د* پایان سوم شخص مفرد است، مثل *می‌آید*.'
    example_gloss: او می‌گوید که فردا می‌آید.
  prs.a2.unit39.lesson01.teach.pattern:
    title: 'رساندن گفته‌ی کسی: می‌گوید که + جمله'
    gloss: مدیر می‌گوید که جلسه ساعت ده است. او می‌گوید که فردا می‌آید.
    note: 'برای رساندن چیزی که کسی همین حالا می‌گوید، *می‌گوید که* و بعد خود جمله را بیاورید. *که* یعنی «که». جمله زمان حال خودش را نگه می‌دارد: *جلسه ساعت ده است*. در این درس فقط پیام‌ها را در زمان حال می‌رسانید. پیام‌های گذشته بعداً در دوره می‌آید.'
  prs.a2.unit39.lesson01.teach.person:
    title: وقتی پیام را می‌رسانید، «من» می‌شود «او»
    gloss: 'مینا: من فردا می‌آیم. مینا می‌گوید که فردا می‌آید.'
    note: 'وقتی مینا می‌گوید *من فردا می‌آیم* و شما آن را می‌رسانید، شخص عوض می‌شود: مینا حالا برای شما *او* است، برای همین پایان فعل از *-م* به *-د* تبدیل می‌شود: *مینا می‌گوید که فردا می‌آید*. گفتن *او* اختیاری است چون پایان فعل خودش شخص را نشان می‌دهد.'
  prs.a2.unit39.lesson01.teach.they_say:
    title: آن‌ها می‌گویند
    gloss: آن‌ها می‌گویند
    note: '*می‌گویند* یعنی «آن‌ها می‌گویند». پایان *-ند* به ریشه اضافه می‌شود: *می‌گویند* شکل *آن‌ها* از *می‌گوید* است.'
    example_gloss: آن‌ها می‌گویند که جلسه ساعت ده است.
  prs.a2.unit39.lesson01.teach.hashmat:
    title: حشمت می‌گوید که مینا فردا می‌آید
    gloss: حشمت می‌گوید که مینا فردا می‌آید.
    note: اینجا کسی که می‌گوید (*حشمت*) و کسی که می‌آید (*مینا*) فرق دارند و جمله هر دو را نام می‌برد. هر وقت پیامی می‌خوانید، دقت کنید چه کسی می‌گوید و چه کسی می‌آید.
  prs.a2.unit39.lesson02.teach.asks:
    title: او می‌پرسد
    gloss: می‌پرسد
    note: '*می‌پرسد* یعنی «او می‌پرسد»، حال ساده‌ی *پرسیدن*. پایان آن مثل *می‌گوید* *-د* است.'
    example_gloss: او می‌پرسد که مدیر کجاست.
  prs.a2.unit39.lesson02.teach.wh:
    title: 'رساندن یک پرسش: می‌پرسد که + پرسش'
    gloss: حشمت می‌پرسد که تو کجایی. مینا می‌پرسد که ساعت چند است.
    note: برای رساندن یک پرسش، *می‌پرسد که* و بعد خود پرسش را با کلمه‌ی پرسشی‌اش بیاورید (*کجا*، *ساعت چند*، *چه*، *کی*، *چرا*). ترتیب کلمات پرسش عوض نمی‌شود. *استی* یعنی «هستی» (به دوست)، شکل *تو* از *است*. وقتی به همان کسی که از او پرسیده شده می‌گویید، *تو* همان *تو* می‌ماند.
  prs.a2.unit39.lesson02.teach.yesno:
    title: رساندن یک پرسش بلی یا نخیر
    gloss: او می‌پرسد که تو فردا می‌آیی یا نه.
    note: 'در این درس پرسش را همان‌طور که گفته می‌شود نگه می‌داریم، بدون نشانه‌ی اضافه (می‌توانید مثل درس ۳۸ *آیا* یا *یا نه* هم اضافه کنید). پرسش بلی یا نخیر با *می‌پرسد که* رسانده می‌شود: *او می‌پرسد که تو فردا می‌آیی*. جواب *بلی* یا *نخیر* است. *می‌آیی* یعنی «می‌آیی» (به دوست)، شکل *تو* از *می‌آید*.'
  prs.a2.unit39.lesson02.teach.id:
    title: مدیر می‌پرسد که شما کارت شناسایی دارید یا نه
    gloss: مدیر می‌پرسد که شما کارت شناسایی دارید یا نه.
    note: یک پرسش بلی یا نخیر دیگر. *تذکره* کارت شناسایی افغانستان است و *داری* یعنی «داری».
  prs.a2.unit39.lesson02.teach.person:
    title: کسی که از او پرسیده می‌شود، ضمیر را عوض می‌کند
    gloss: مینا می‌پرسد که تو کجایی. مینا می‌پرسد که حشمت کجاست.
    note: 'مینا از حشمت می‌پرسد: *تو کجا استی؟* (کجایی؟). اگر به خود حشمت بگویید، می‌گویید *مینا می‌پرسد که تو کجا استی* و *تو* می‌ماند. اگر به کس دیگری بگویید، حشمت سوم شخص می‌شود: *مینا می‌پرسد که حشمت کجا است*.'
  prs.a2.unit39.lesson03.teach.pattern:
    title: 'رساندن یک خواسته: می‌خواهد که + وجه التزامی'
    gloss: او می‌خواهد که تو بیایی. او می‌خواهد که من بروم.
    note: 'برای رساندن چیزی که کسی از دیگری می‌خواهد، *می‌خواهد که* و بعد وجه التزامی را بیاورید: *او می‌خواهد که تو بیایی*. این همان شکلی است که بعد از *باید* به کار می‌رود و در *بروم* (که من بروم) هم هست. این شکل حال ساده با *می‌* نیست: در *بیایی* هیچ *می‌* نیست.'
  prs.a2.unit39.lesson03.teach.go:
    title: وجه التزامی رفتن
    gloss: که من بروم، که تو بروی، که او برود، که ما برویم، که شما بروید (رسمی یا جمع)، که آن‌ها بروند
    note: 'وجه التزامی از *ب* به‌علاوه‌ی ریشه‌ی حال و پایان ساخته می‌شود: *ب + رو + م* می‌شود *بروم*. پایان‌ها *-م، -ی، -د، -یم، -ین، -ند* هستند. پس: *بروم، بروی، برود، برویم، بروین، بروند*. *بروم* را قبلاً بلدید؛ این کارت بقیه‌ی شکل‌ها را اضافه می‌کند.'
  prs.a2.unit39.lesson03.teach.come:
    title: وجه التزامی آمدن
    gloss: که من بیایم، که تو بیایی، که او بیاید، که ما بیاییم، که شما بیایید (رسمی یا جمع)، که آن‌ها بیایند
    note: '*آمدن* بی‌قاعده است: ریشه‌ی وجه التزامی آن *بیای-* است. پایان‌ها همان‌هاست: *بیایم، بیایی، بیاید، بیاییم، بیایین، بیایند*. *بیایم* و *بیایین* را قبلاً بلدید.'
  prs.a2.unit39.lesson03.teach.do:
    title: وجه التزامی کردن و آوردن
    gloss: که من انجام بدهم، که تو انجام بدهی، که او انجام بدهد، که ما انجام بدهیم، که شما انجام بدهید، که آن‌ها انجام بدهند. که من بیاورم، که تو بیاوری، که او بیاورد.
    note: '*کردن* *ب* نمی‌گیرد: *کنم، کنی، کند، کنیم، کنین، کنند*. پس *تیلفون کردن* می‌شود *تیلفون کنی* (که تلفن کنی). *آوردن* مثل *آمدن* با *بیاور-* ساخته می‌شود: *بیاورم، بیاوری، بیاورد*.'
  prs.a2.unit39.lesson03.teach.tell:
    title: وجه التزامی گفتن
    gloss: که من بگویم، که تو بگویی، که او بگوید
    note: '*گفتن* در وجه التزامی ریشه‌ی *گوی-* دارد: *بگویم، بگویی، بگوید*. الگو *ب* به‌علاوه‌ی ریشه و پایان است، مثل *بروم*.'
  prs.a2.unit39.lesson03.teach.phone:
    title: مدیر می‌خواهد که تو تلفن کنی
    gloss: مدیر می‌خواهد که تو تلفن کنی.
    note: کسی که می‌خواهد *مدیر* است، کسی که باید کاری بکند *تو* است و فعل بعد از *که* *کنی* است.
  prs.a2.unit39.lesson03.teach.computer:
    title: او می‌خواهد که تو کامپیوتر را بیاوری
    gloss: او می‌خواهد که تو کامپیوتر را بیاوری.
    note: '*را* بعد از چیزی می‌آید که آورده می‌شود، مثل هر جمله‌ی دیگری که مفعول دارد.'
  prs.a2.unit39.lesson03.teach.same:
    title: همان وجه التزامی وقتی خواهنده خودش هم می‌رود
    gloss: من می‌خواهم بروم. او می‌خواهد برود.
    note: 'اگر کسی که می‌خواهد و کسی که کار را انجام می‌دهد یکی باشد، باز هم وجه التزامی به کار می‌رود: *من می‌خواهم که بروم*. پایان مناسب را بگذارید: *-م* برای من، *-د* برای او. این درس بیشتر خواسته‌ی برای دیگری را می‌رساند، مثل *او می‌خواهد که تو بیایی*.'
  prs.a2.unit39.lesson04.teach.note:
    title: یادداشت
    gloss: یادداشت
    note: '*یادداشت* یک نوشته‌ی کوتاه است، مثلاً کاغذی که روی میز یا در گذاشته می‌شود. وقتی کسی آنجا نیست، راهی برای رساندن پیام هم هست.'
    example_gloss: یادداشت در دفتر کار است.
  prs.a2.unit39.lesson04.teach.writes:
    title: او می‌نویسد
    gloss: می‌نویسد
    note: '*می‌نویسد* یعنی «او می‌نویسد»، حال ساده‌ی *نوشتن*. *می‌نویسم* یعنی «من می‌نویسم».'
    example_gloss: حشمت یک یادداشت می‌نویسد.
  prs.a2.unit39.lesson04.teach.sends:
    title: او می‌فرستد
    gloss: می‌فرستد
    note: '*می‌فرستد* یعنی «او می‌فرستد». *می‌فرستم* (من می‌فرستم) را بلدید.'
    example_gloss: مدیر یک پیام می‌فرستد.
  prs.a2.unit39.lesson04.teach.written:
    title: 'یک پیام نوشته‌شده: می‌نویسد که'
    gloss: در یادداشت می‌نویسد که جلسه ساعت نه است.
    note: 'پیام نوشته‌شده مثل پیام گفتاری رسانده می‌شود: *می‌نویسد که* و بعد خود جمله. *در یادداشت* یعنی «در یادداشت». ترتیب همان *می‌گوید که* است.'
  prs.a2.unit39.lesson04.teach.tell_him:
    title: 'گفتن اینکه به چه کسی می‌گویید: به'
    gloss: من به او می‌گویم که جلسه ساعت نه است. مدیر به مینا می‌گوید که جلسه فردا است.
    note: '*به* و شنونده را پیش از فعل بیاورید تا معلوم شود به چه کسی گفته می‌شود: *به او می‌گویم*، *به مینا می‌گوید*. بقیه‌ی الگو همان می‌ماند: *که* و بعد پیام.'
  prs.a2.unit39.lesson04.teach.phone_says:
    title: او تلفن می‌کند و می‌گوید که فردا می‌آید
    gloss: او تلفن می‌کند و می‌گوید که فردا می‌آید.
    note: 'یک پیام تلفنی اغلب دو فعل پشت سر هم دارد: *تیلفون می‌کند* و *می‌گوید که ...*، که با *و* به هم وصل می‌شوند.'
  prs.a2.unit39.lesson04.teach.i_write:
    title: من یک یادداشت می‌نویسم
    gloss: من یک یادداشت می‌نویسم.
    note: وقتی نمی‌توانید پیام را حضوری برسانید، یادداشت می‌نویسید.
  prs.a2.unit39.lesson05.teach.not_come:
    title: او نمی‌آید
    gloss: نمی‌آید
    note: '*نمی‌آید* یعنی «او نمی‌آید»: *ن* جلوی *می‌آید*. *نمی‌روم* (من نمی‌روم) را بلدید.'
    example_gloss: او فردا نمی‌آید.
  prs.a2.unit39.lesson05.teach.call_turn01:
    title: نوبت اول
    gloss: حشمت، چه کسی تلفن کرد؟
    note: مینا به خانه می‌آید و می‌پرسد چه کسی تلفن کرده است.
  prs.a2.unit39.lesson05.teach.call_turn02:
    title: نوبت دوم
    gloss: مدیر تلفن کرد. می‌گوید که جلسه فردا ساعت نه است.
    note: حشمت جواب می‌دهد و بخش اول پیام را با *می‌گوید که* می‌رساند.
  prs.a2.unit39.lesson05.teach.call_turn03:
    title: نوبت سوم
    gloss: ساعت نه؟ دیگر چه می‌گوید؟
    note: مینا بیشتر می‌پرسد. *چه می‌گوید* یعنی «چه می‌گوید؟».
  prs.a2.unit39.lesson05.teach.call_turn04:
    title: نوبت چهارم
    gloss: می‌پرسد که شما فردا می‌آیید یا نه. و می‌خواهد که کامپیوتر را بیاورید.
    note: 'دو بخش دیگر پیام: یک پرسش با *می‌پرسد که* و یک خواسته با *می‌خواهد که* و فعل التزامی *بیاوری*.'
  prs.a2.unit39.lesson05.teach.call_turn05:
    title: نوبت پنجم
    gloss: بله، فردا می‌آیم و کامپیوتر را می‌آورم.
    note: مینا به پرسش و خواسته با صرف اول شخص جواب می‌دهد.
  prs.a2.unit39.lesson05.teach.call_turn06:
    title: نوبت ششم
    gloss: خوب. پس من به او تلفن می‌کنم.
    note: حشمت جواب مینا را تلفنی به او می‌رساند. *به او تیلفون می‌کنم* یعنی «به او تلفن می‌کنم».
  prs.a2.unit39.lesson05.teach.note_read:
    title: یادداشتی از حشمت
    gloss: سلام مینا. امروز ساعت چهار دوست شما تلفن کرد. می‌گوید که فردا نمی‌آید، چون کار دارد. می‌پرسد که جمعه وقت دارید یا نه. می‌خواهد که به او تلفن کنید. شماره‌اش در این یادداشت است. حشمت
    note: 'پیامی نوشته‌شده که یک تماس تلفنی را با سه فعل این درس نقل می‌کند: *می‌گوید که*، *می‌پرسد که* و *می‌خواهد که*. تماس دوست، غیر از تماس مدیر در گفت‌وگوست.'
  prs.a2.unit39.lesson06.teach.office_turn01:
    title: نوبت اول
    gloss: راحله، یک پیام برای شما دارم.
    note: 'بهزاد شروع می‌کند: او پیامی دارد که باید برساند.'
  prs.a2.unit39.lesson06.teach.office_turn02:
    title: نوبت دوم
    gloss: از طرف کی است؟
    note: راحله می‌پرسد پیام از طرف کیست.
  prs.a2.unit39.lesson06.teach.office_turn03:
    title: نوبت سوم
    gloss: از مطب دکتر. یکی از کارمندها تلفن کرد. می‌گوید که وقت شما پنجشنبه ساعت دو است.
    note: بهزاد بخش اول را با *می‌گوید که* می‌رساند.
  prs.a2.unit39.lesson06.teach.office_turn04:
    title: نوبت چهارم
    gloss: پنجشنبه ساعت دو؟ دیگر چه می‌گوید؟
    note: راحله بقیهٔ پیام را می‌پرسد.
  prs.a2.unit39.lesson06.teach.office_turn05:
    title: نوبت پنجم
    gloss: می‌پرسد که کارت شناسایی دارید یا نه. و می‌خواهد که ساعت یک بیایید.
    note: یک پرسش با *می‌پرسد که* و یک خواسته با *می‌خواهد که* و فعل التزامی *بیایی*.
  prs.a2.unit39.lesson06.teach.office_turn06:
    title: نوبت ششم
    gloss: بله، دارم. من یک یادداشت می‌نویسم. خیلی ممنون.
    note: راحله به پرسش جواب می‌دهد، می‌گوید که یادداشت می‌نویسد تا فراموش نکند، و از بهزاد تشکر می‌کند.
  prs.a2.unit39.lesson06.teach.summary:
    title: سه فعل، سه نوع پیام
    gloss: می‌گوید که وقت پنجشنبه است. می‌پرسد که کارت شناسایی دارید یا نه. می‌خواهد که ساعت یک بیایید.
    note: پیام معمولاً یک خبر، یک پرسش یا یک خواسته است. بعد از *می‌گوید که* خبر می‌آید، بعد از *می‌پرسد که* پرسش، و بعد از *می‌خواهد که* فعل التزامی. شناسهٔ فعل نشان می‌دهد چه کسی حرف می‌زند، و پیام زمان حال را نگه می‌دارد.
