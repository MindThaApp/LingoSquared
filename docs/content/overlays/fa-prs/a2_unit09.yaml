teaching:
  prs.a2.unit09.lesson01.teach.vaght_word:
    title: قرار (وقت ملاقات)
    gloss: وقت ملاقات / نوبت
    note: '*وقت* در اصل یعنی «زمان»؛ *وقت گرفتن* (نوبت گرفتن) تعبیر رایج برای «قرار ملاقات گرفتن» است.'
  prs.a2.unit09.lesson01.teach.sanad_word:
    title: سند
    gloss: سند
    note: '*سند* واژهٔ عمومی برای مدرک رسمی است.'
  prs.a2.unit09.lesson01.teach.address_word:
    title: نشانی
    gloss: نشانی
    note: '*آدرس* واژهٔ رایج برای نشانی خانه است.'
  prs.a2.unit09.lesson01.teach.tazkira_word:
    title: شناسنامهٔ ملی افغانستان
    gloss: شناسنامهٔ ملی افغانستان (تذکره)
    note: '*تذکره* — مدرکی که در این درس به‌روز می‌شود — شناسنامهٔ ملی افغانستان است و با *کارت ملی* ایران فرق دارد.'
  prs.a2.unit09.lesson01.teach.municipality_word:
    title: شهرداری
    gloss: شهرداری
    note: '*شاروالی* در افغانستان به اداره‌ای می‌گویند که در فارسی ایران *شهرداری* نام دارد.'
  prs.a2.unit09.lesson01.teach.va_word:
    title: و
    gloss: و
    note: '*و* حرف ربط رایجی است که در سراسر این درس به کار می‌رود.'
    target_text: 'و (و / «and» در فارسی: «و»)'
  prs.a2.unit09.lesson02.teach.request_appointment:
    title: درخواست وقت گرفتن
    gloss: می‌خواستم برای تغییر نشانی‌ام وقت بگیرم.
    note: '*می‌خواستم* (در اصل «می‌خواستم») درخواست را مؤدبانه‌تر می‌کند.'
  prs.a2.unit09.lesson02.teach.because_moved:
    title: دلیل آوردن با چون
    gloss: چون خانه‌ام را عوض کرده‌ام، باید نشانی‌ام را عوض کنم.
    note: '*چون* بند دلیل را شروع می‌کند و بعد از آن نتیجه می‌آید.'
  prs.a2.unit09.lesson02.teach.what_should_i_bring:
    title: مؤدبانه پرسیدن که چه چیزی بیاورید
    gloss: ممکن است بفرمایید چه چیزی باید بیاورم؟
    note: '*می‌شود بگویین...؟* («ممکن است بگویید...؟») شکلی مؤدبانه برای پرسش غیرمستقیم است.'
  prs.a2.unit09.lesson03.teach.rent_receipt_word:
    title: رسید اجارهٔ خانه
    gloss: رسید اجارهٔ خانه
    note: '*رسید کرایه خانه* رسید پرداخت اجارهٔ خانه است و یکی از مدارک پذیرفته‌شده برای اثبات محل سکونت است.'
  prs.a2.unit09.lesson03.teach.deadline_word:
    title: مهلت
    gloss: مهلت
    note: '*مهلت* واژهٔ عمومی برای زمان مقرر یا حد نهایی زمان است.'
  prs.a2.unit09.lesson03.teach.notice_text:
    title: اطلاعیهٔ اداره دربارهٔ تغییر نشانی
    gloss: برای تغییر نشانی، لطفاً تذکره و یک رسید اجارهٔ خانه بیاورید. مهلت ثبت تا آخر همین ماه است.
    note: یک اطلاعیهٔ رسمی کوتاه، به زبان نوشتاری رسمی که این درس آموزش می‌دهد.
  prs.a2.unit09.lesson03.teach.i_will_bring_receipt:
    title: گفتن اینکه چه چیزی می‌آورید
    gloss: رسید اجارهٔ خانه را می‌آورم.
    note: '*می‌آورم* یعنی «می‌آورم».'
  prs.a2.unit09.lesson04.teach.turn01:
    title: کارمند به کریم خوش‌آمد می‌گوید
    gloss: کارمند او را دعوت می‌کند جلو بیاید و می‌پرسد چه کاری می‌تواند برایش انجام دهد.
    note: '*بفرمایین* او را دعوت می‌کند جلو بیاید؛ *چه خدمتی می‌توانم برایتان انجام بدهم؟* شکل مؤدبانه و رسمی است که کارمند برای کمک پیشنهاد می‌کند.'
  prs.a2.unit09.lesson04.teach.turn02:
    title: کریم وقت می‌خواهد
    gloss: کریم می‌گوید می‌خواهد برای تغییر نشانی‌اش وقت بگیرد.
    note: همان الگوی مؤدبانهٔ *می‌خواستم* که قبلاً دیدید.
  prs.a2.unit09.lesson04.teach.turn03:
    title: کارمند می‌پرسد از کی
    gloss: کارمند می‌پرسد از کی در خانهٔ جدید زندگی می‌کند.
    note: '*از کی...؟* یعنی «از چه زمانی؟».'
  prs.a2.unit09.lesson04.teach.turn04:
    title: کریم جواب می‌دهد و می‌پرسد چه چیزی بیاورد
    gloss: می‌گوید از ماه گذشته و می‌پرسد چه چیزی باید بیاورد.
    note: '*از ماه گذشته* با پرسش مؤدبانهٔ *می‌شود بگویین...؟* ترکیب شده است.'
  prs.a2.unit09.lesson04.teach.turn05:
    title: کارمند مدارک را می‌گوید
    gloss: کارمند می‌گوید تذکره و یک رسید اجارهٔ خانه کافی است.
    note: '*کافی است* یعنی «کافی است».'
  prs.a2.unit09.lesson04.teach.turn06:
    title: کریم یک روز پیشنهاد می‌کند
    gloss: می‌پرسد می‌تواند روز سه‌شنبه بیاید یا نه.
    note: '*می‌توانم...؟* دربارهٔ توانایی یا اجازه می‌پرسد.'
  prs.a2.unit09.lesson04.teach.turn07:
    title: کارمند تأیید می‌کند و شمارهٔ پیگیری می‌دهد
    gloss: کارمند سه‌شنبه ساعت ده را تأیید می‌کند و شمارهٔ پیگیری سه هزار و پنجاه را می‌دهد.
    note: '*نمبر پیگیری* شمارهٔ پیگیری وقت است؛ در دری افغانستان به‌جای «شماره» معمولاً *نمبر* می‌گویند و *پیگیری* همان پیگیری است؛ *بلی* در دری یعنی «بله».'
