teaching:
  prs.a1.unit31.lesson01.teach.education_word:
    title: تحصیل
    gloss: تحصیل / درس و دانشگاه
    note: تحصیل یعنی آموزش و درس خواندن به‌طور کلی؛ واژهٔ اصلی این واحد.
    example_gloss: تحصیل خوب است.
  prs.a1.unit31.lesson01.teach.university_word:
    title: دانشگاه
    gloss: دانشگاه
    note: پوهنتون یعنی دانشگاه. این واژهٔ رایج در افغانستان است (مثل نام پوهنتون کابل) و با «دانشگاه» در ایران فرق دارد.
    example_gloss: دانشگاه در کابل است.
  prs.a1.unit31.lesson01.teach.school_word:
    title: مدرسه
    gloss: مدرسه
    note: مکتب یعنی مدرسه.
    example_gloss: این مدرسه خوب است.
  prs.a1.unit31.lesson01.teach.field_word:
    title: رشتهٔ تحصیلی
    gloss: رشتهٔ تحصیلی
    note: رشته یعنی رشتهٔ تحصیلی در دانشگاه؛ واژه‌ای مشترک در فارسی و دری.
    example_gloss: رشتهٔ من پزشکی است.
  prs.a1.unit31.lesson01.teach.student_word:
    title: دانشجو
    gloss: دانشجو
    note: محصل یعنی دانشجو. این واژهٔ رایج در دری افغانستان است و با «دانشجو» در ایران فرق دارد.
    example_gloss: او دانشجو است.
  prs.a1.unit31.lesson01.teach.lesson_word:
    title: درس
    gloss: درس
    note: درس یعنی درس؛ با خواندن ترکیب می‌شود و عبارت «درس خواندن» را می‌سازد.
    example_gloss: هر روز درس می‌خوانم.
  prs.a1.unit31.lesson01.teach.review_khandan:
    title: درس خواندن
    gloss: درس + خواندن ← درس می‌خوانم
    note: درس با خواندن ترکیب می‌شود و «درس می‌خوانم» را می‌سازد. در فارسی هم همین ساختار هست، ولی اینجا به‌عنوان الگوی فعل مرکب در این دوره تازه است.
    target_text: درس (درس) + خواندن (خواندن) = درس می‌خوانم (درس می‌خوانم)
  prs.a1.unit31.lesson01.teach.combined_sentence:
    title: من در دانشگاه درس می‌خوانم
    gloss: من در دانشگاه درس می‌خوانم.
    note: ترکیب من (مرور)، در (مرور)، پوهنتون و درس می‌خوانم.
  prs.a1.unit31.lesson02.teach.medicine_word:
    title: دارو
    gloss: دارو
    note: طب یعنی پزشکی به‌عنوان رشتهٔ تحصیلی؛ واژه‌ای مشترک در فارسی و دری.
    example_gloss: پزشکی سخت است.
  prs.a1.unit31.lesson02.teach.law_word:
