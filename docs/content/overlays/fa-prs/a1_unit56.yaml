    accepted_answers:
    - کارت روزانه صد افغانی است، اما عضویت ماهانه یک هزار افغانی است
    - کارت روزانه صد افغانی است، اما عضویت ماهانه یک هزار افغانی است.
    - کارت روزانه صد افغانی است اما عضویت ماهانه یک هزار افغانی است
    - کارت روزانه صد افغانی است. اما عضویت ماهانه یک هزار افغانی است.
    - کارت روزانه صد افغانی است و عضویت ماهانه یک هزار افغانی است
    feedback: کارت روزانه صد افغانی است، اما عضویت ماهانه یک هزار افغانی است. یعنی «کارت روزانه صد افغانی است، ولی عضویت ماهانه هزار افغانی است.»
