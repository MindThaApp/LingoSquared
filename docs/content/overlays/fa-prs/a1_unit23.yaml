teaching:
  prs.a1.unit23.lesson01.teach.pul:
    title: پول
    gloss: پول
    note: پول یعنی «پول» (money)؛ در فارسی ایران هم همین را می‌گوییم.
    example_gloss: من پول دارم.
  prs.a1.unit23.lesson01.teach.naqd:
    title: نقد
    gloss: نقد
    note: نقد یعنی پول نقد.
    example_gloss: نقد پرداخت می‌کنم.
  prs.a1.unit23.lesson01.teach.kart:
    title: کارت
    gloss: کارت
    note: کارت یعنی کارت بانکی (کارت پرداخت).
    example_gloss: من کارت دارم.
  prs.a1.unit23.lesson01.teach.dollar:
    title: دلار
    gloss: دلار
    note: دالر یعنی دلار (USD)؛ در تبدیل ارز روزمره در افغانستان کاربرد زیادی دارد و کنار افغانی قیمت‌گذاری می‌شود.
    example_gloss: من صد دلار دارم.
  prs.a1.unit23.lesson01.teach.review_dorom:
    title: من دارم
    gloss: دارم
    note: دارم یعنی «دارم» (قبلاً در درس خرید، واحد ۱۰ آمده بود).
    example_gloss: من پول دارم.
  prs.a1.unit23.lesson01.teach.review_sad:
    title: صد
    gloss: صد
    note: صد یعنی عدد صد؛ قبلاً در درس عددها (واحد ۴) آمد و در درس خرید (واحد ۱۰) هم به کار رفت.
    example_gloss: من صد دلار دارم.
  prs.a1.unit23.lesson02.teach.mipardazam:
    title: پرداخت می‌کنم
    gloss: پرداخت می‌کنم
    note: می‌پردازم یعنی «پرداخت می‌کنم».
    example_gloss: نقد پرداخت می‌کنم.
  prs.a1.unit23.lesson02.teach.ya:
    title: یا
    gloss: یا
    note: یا یعنی «یا».
    example_gloss: نقد یا با کارت پرداخت می‌کنم.
  prs.a1.unit23.lesson02.teach.naqdi_ya_karti:
    title: نقد یا کارت؟
    gloss: نقد پرداخت می‌کنید یا با کارت؟
    note: پرسشی رایج در فروشگاه یا باجه‌ی صرافی.
  prs.a1.unit23.lesson02.teach.review_mitanom:
    title: می‌توانم
    gloss: می‌توانم
    note: می‌توانم یعنی «می‌توانم» (قبلاً در همین دوره آمده است).
    example_gloss: می‌توانم نقد پرداخت کنم.
  prs.a1.unit23.lesson02.teach.bepardazam:
    title: پرداخت کنم
    gloss: پرداخت کنم
    note: بپردازم شکل التزامی «پرداختن» است و بعد از می‌توانم می‌آید؛ می‌توانم نقد بپردازم یعنی «می‌توانم نقد پرداخت کنم».
    example_gloss: می‌توانم نقد پرداخت کنم.
  prs.a1.unit23.lesson03.teach.sarafi:
    title: صرافی
    gloss: صرافی
    note: صرافی در افغانستان نهادی واقعی و رایج برای تبدیل ارز است و با بانک رسمی فرق دارد.
    example_gloss: به صرافی می‌روم.
  prs.a1.unit23.lesson03.teach.tabdil_kardan:
    title: تبدیل کردن
    gloss: تبدیل کردن
    note: تبدیل کردن یعنی تبدیل کردن ارز.
    example_gloss: دلار را به افغانی تبدیل می‌کنم.
  prs.a1.unit23.lesson03.teach.narkh:
    title: نرخ ارز
    gloss: نرخ ارز
    note: نرخ یعنی نرخ تبدیل ارز.
    example_gloss: نرخ دلار امروز چند است؟
  prs.a1.unit23.lesson03.teach.narkh_chand_ast:
    title: نرخ امروز چند است؟
    gloss: نرخ دلار امروز چند است؟
    note: روش معمول برای پرسیدن نرخ ارز.
  prs.a1.unit23.lesson03.teach.review_afghani:
    title: افغانی
    gloss: افغانی
    note: افغانی واحد پول افغانستان است (قبلاً در درس خرید، واحد ۱۰، آمده بود؛ مثلاً «صد افغانی»).
    example_gloss: من صد افغانی دارم.
  prs.a1.unit23.lesson03.teach.review_ast_emroz_chand:
    title: 'مرور: است، امروز، چند'
    gloss: است / امروز / چند
    note: است، امروز و چند واژه‌های مرورین (قبلاً در دوره آمده‌اند) که در پرسش نرخ این درس کنار هم می‌آیند.
    example_gloss: نرخ دلار امروز چند است؟
  prs.a1.unit23.lesson03.teach.review_ba_ra_mikonam:
    title: 'مرور: به، نشانه‌ی مفعول، انجام می‌دهم، انجام بده، می‌خواهم'
    gloss: به / نشانه‌ی مفعول / انجام می‌دهم / انجام بدهم / می‌خواهم
    note: به، را، می‌کنم، کنم و می‌خواهم واژه‌های مرورین (قبلاً در دوره آمده‌اند) که در جمله‌های تبدیل ارز این درس کنار هم می‌آیند.
    example_gloss: می‌خواهم دلار را به افغانی تبدیل کنم.
  prs.a1.unit23.lesson04.teach.review_mikhaham:
    title: می‌خواهم
    gloss: می‌خوام
    note: می‌خواهم یعنی «می‌خواهم» (قبلاً در درس‌های پیشین آمده است).
    example_gloss: می‌خواهم دلار تبدیل کنم.
  prs.a1.unit23.lesson04.teach.chand_darin:
    title: چند تا دارید؟
    gloss: چند دلار دارید؟
    note: دارین شکل محترمانه/جمع «دارید» است و برای خطاب به مشتری به کار می‌رود.
  prs.a1.unit23.lesson04.teach.bufarmayin:
    title: بفرمایید
    gloss: بفرمایید
    note: بفرمایین عبارتی مؤدبانه است که هنگام دادن چیزی به کسی گفته می‌شود.
    example_gloss: بفرمایید، هفت هزار افغانی.
  prs.a1.unit23.lesson04.teach.hazar:
    title: هزار
    gloss: هزار
    note: هزار یعنی هزار.
    example_gloss: هفت هزار افغانی.
  prs.a1.unit23.lesson04.teach.review_zarmina:
    title: زرمینه
    gloss: زرمینه
    note: زرمینه، شخصیت ثابتِ داستان‌های دوره.
    example_gloss: زرمینه به صرافی می‌رود.
  prs.a1.unit23.lesson04.teach.review_besyar_khub:
    title: بسیار خوب
    gloss: بسیار خوب
    note: بسیار خوب قبلاً آمده است و اینجا برای پذیرفتن یک پیشنهاد به کار می‌رود.
    example_gloss: بسیار خوب، ممنون.
  prs.a1.unit23.lesson04.teach.review_haftad_tashakor_kard:
    title: 'مرور: هفتاد، تشکر، کرد'
    gloss: هفتاد / ممنون / کرد (او)
    note: هفتاد و تشکر واژه‌های مرورین؛ کرد سوم‌شخص گذشته‌ی «کردن» است که در درس گذشته (واحد ۲۰) آمده بود و اینجا برای جمع‌بندی گفت‌وگو به کار رفته است.
    example_gloss: زرمینه صد دلار را به افغانی تبدیل کرد.
  prs.a1.unit23.lesson04.teach.turn01:
    title: 'زرمینه: سلام، می‌خواهم دلار را به افغانی تبدیل کنم.'
    gloss: سلام، می‌خواهم دلار را به افغانی تبدیل کنم.
  prs.a1.unit23.lesson04.teach.turn02:
    title: 'صراف: چند دلار دارید؟'
    gloss: چند دلار دارید؟
  prs.a1.unit23.lesson04.teach.turn03:
    title: 'زرمینه: صد دلار دارم. نرخ امروز چند است؟'
    gloss: صد دلار دارم. نرخ امروز چند است؟
  prs.a1.unit23.lesson04.teach.turn04:
    title: 'صراف: امروز هر دلار هفتاد افغانی است.'
    gloss: امروز هر دلار هفتاد افغانی است.
  prs.a1.unit23.lesson04.teach.turn05:
    title: 'زرمینه: بسیار خوب، تبدیل کنید.'
    gloss: بسیار خوب، لطفاً تبدیل کنید.
    note: تبدیل کنین امر مؤدبانه است، یعنی «(لطفاً) تبدیل کنید».
  prs.a1.unit23.lesson04.teach.turn06:
    title: 'صراف: بفرمایید، هفت هزار افغانی.'
    gloss: بفرمایید، هفت هزار افغانی.
  prs.a1.unit23.lesson04.teach.turn07:
    title: 'زرمینه: ممنون.'
    gloss: ممنون.
  prs.a1.unit23.lesson05.teach.rasid:
    title: رسید
    gloss: رسید
    note: رسید یعنی رسید (سند دریافت پول).
    example_gloss: رسید می‌گیرم.
  prs.a1.unit23.lesson05.teach.migiram:
    title: می‌گیرم
    gloss: می‌گیرم / دریافت می‌کنم
    note: می‌گیرم یعنی «می‌گیرم / دریافت می‌کنم».
    example_gloss: پول را می‌گیرم.
  prs.a1.unit23.lesson05.teach.reading_text:
    title: متن خواندنی
    gloss: زرمینه به صرافی رفت. او صد دلار داشت و می‌خواست دلار را به افغانی تبدیل کند. نرخ آن روز هر دلار هفتاد افغانی بود. زرمینه هفت هزار افغانی گرفت و رسید هم گرفت.
  prs.a1.unit23.lesson05.teach.review_raft:
    title: رفت
    gloss: رفت
    note: رفت یعنی «رفت» (گذشته، سوم شخص مفرد).
    example_gloss: زرمینه به صرافی رفت.
  prs.a1.unit23.lesson05.teach.review_haft_gereft:
    title: 'مرور: هفت، گرفت (او)، گرفتم (من)'
    gloss: هفت / گرفت (او) / گرفتم (من)
    note: هفت یک عدد مرورکردنی است؛ گرفت و گرفتم گذشتهٔ سوم شخص و اول شخص مصدر گرفتن هستند و اینجا برای مبلغی که زرمینه دریافت کرد به کار رفته‌اند.
    example_gloss: زرمینه هفت هزار افغانی گرفت.
  prs.a1.unit23.lesson06.teach.review_summary:
    title: خلاصهٔ پایان درس
    gloss: 'پول دارم: نقد و کارت. می‌توانم دلار را در صرافی به افغانی تبدیل کنم. نرخ امروز هر دلار هفتاد افغانی است.'
  prs.a1.unit23.lesson06.teach.review_bara:
    title: برای
    gloss: برای
    note: برای یعنی «برای».
    example_gloss: هفتاد افغانی برای هر دلار.
  prs.a1.unit23.lesson06.teach.review_va:
    title: و
    gloss: و
    note: و یعنی «و» و از درس‌های قبلی آشناست.
    example_gloss: 'پول دارم: نقد و کارت.'
