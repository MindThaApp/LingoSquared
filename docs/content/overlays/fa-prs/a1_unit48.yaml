    note: این‌ها واژه‌های مرورشده برای درخواست کرایه هستند.
    target_text: می‌خواهم (می‌خواهم) / بگیرم (تا بگیرم) / کرایه (کرایه) / دوچرخه (دوچرخه) / یک (یک)
