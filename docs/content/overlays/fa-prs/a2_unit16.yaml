teaching:
  prs.a2.unit16.lesson01.teach.social_media_word:
    title: شبکه‌ی اجتماعی
    gloss: شبکه‌ی اجتماعی
    note: '*شبکهٔ اجتماعی* یعنی «شبکه‌ی اجتماعی» و ترکیب آن مثل فارسی ایران است.'
    example_gloss: زرمینه هر روز شبکه‌ی اجتماعی را نگاه می‌کند.
  prs.a2.unit16.lesson01.teach.video_word:
    title: ویدیو
    gloss: ویدیو
    note: '*ویدیو* واژه‌ای قرضی است و مثل فارسی ایران به کار می‌رود.'
    example_gloss: همایون دوست دارد ویدیو تماشا کند.
  prs.a2.unit16.lesson01.teach.download_word:
    title: دانلود
    gloss: دانلود کردن
    note: '*دانلود کردن* — *دانلود* واژه‌ای قرضی است که با *کردن* («انجام دادن») ساخته می‌شود.'
    example_gloss: من موسیقی دانلود می‌کنم.
  prs.a2.unit16.lesson01.teach.messaging_app_word:
    title: پیام‌رسان
    gloss: پیام‌رسان
    note: '*پیام‌رسان* در اصل یعنی «رساننده‌ی پیام».'
    example_gloss: با پیام‌رسان برای دوستانم پیام می‌فرستم.
  prs.a2.unit16.lesson01.teach.computer_game_word:
    title: بازی کامپیوتری
    gloss: بازی کامپیوتری
    note: '*بازی کمپیوتری* — *بازی* یعنی «بازی» و *کمپیوتری* یعنی «مربوط به کامپیوتر».'
    example_gloss: همایون بازی کامپیوتری می‌کند.
  prs.a2.unit16.lesson01.teach.free_time_word:
    title: اوقات فراغت
    gloss: اوقات فراغت
    note: '*وقت آزاد* — *وقت* یعنی «زمان» و *آزاد* یعنی «خالی، بدون کار».'
    example_gloss: در وقت آزادم شبکه‌های اجتماعی را نگاه می‌کنم.
  prs.a2.unit16.lesson01.teach.usually_grammar:
    title: «معمولاً» و کاربرد آن
    gloss: من معمولاً در وقت آزادم شبکه‌های اجتماعی را نگاه می‌کنم.
    note: '*معمولاً* («معمولاً») اولین قید تکرار سطح A2 در این درس است.'
  prs.a2.unit16.lesson01.teach.sometimes_grammar:
    title: «بعضی اوقات» و کاربرد آن
    gloss: بعضی وقت‌ها خیلی وقت می‌گیرد.
    note: '*بعضی اوقات* («گاهی») دومین قید تکرار این درس است و در برابر *معمولاً* قرار می‌گیرد.'
  prs.a2.unit16.lesson01.teach.va_word:
    title: و
    gloss: و
    note: '*و* حرف ربطی رایج است که در این درس برای وصل کردن جمله‌ها به کار می‌رود.'
    target_text: و (و)
  prs.a2.unit16.lesson01.teach.every_day_grammar:
    title: «هر روز» و کاربرد آن
    gloss: من هر روز شبکه‌های اجتماعی را نگاه می‌کنم.
    note: '*هر روز* یعنی «هر روز» — *روز* به تنهایی یعنی «روز».'
  prs.a2.unit16.lesson02.teach.ask_how_much_time:
    title: پرسیدن اینکه کسی چقدر وقت صرف می‌کند
    gloss: چقدر وقت را در شبکه‌های اجتماعی می‌گذرانی؟
    note: '*تو* ضمیر غیررسمی میان دوستان است، برخلاف *شما* و شناسه‌ی -*ین* که در بخش‌های دیگر این دوره برای غریبه‌ها به کار رفته است.'
  prs.a2.unit16.lesson02.teach.opinion_phrase:
    title: بیان یک نظر ساده
    gloss: به نظر من اینترنت مفید است، ولی بعضی وقت‌ها خیلی وقت می‌گیرد.
    note: از الگوی *به نظر من* («به نظر من») که در درس ۱۰ آمده بود دوباره استفاده شده است.
  prs.a2.unit16.lesson02.teach.limit_use_phrase:
    title: گفتن اینکه باید استفاده را محدود کرد
    gloss: باید وقتمان را محدود کنیم.
    note: '*محدود کردن* یعنی «محدود کردن».'
  prs.a2.unit16.lesson02.teach.mostly_word:
    title: Mostly
    gloss: بیشتر
    note: '*بیشتر* اینجا یعنی «بیشتر» به معنی «اغلب» یا «بیشتر از همه».'
    target_text: بیشتر (بیشتر)
  prs.a2.unit16.lesson03.teach.user_word:
    title: کاربر
    gloss: کاربر
    note: '*کاربر* واژه‌ی عمومی برای استفاده‌کننده‌ی یک اپلیکیشن، دستگاه یا سرویس است.'
    example_gloss: بسیاری از کاربران هر روز از گوشی استفاده می‌کنند.
  prs.a2.unit16.lesson03.teach.limit_word:
    title: محدود کردن
    gloss: محدود کردن
    note: '*محدود کردن* — همان عبارت درس دوم، اینجا در یک جمله‌ی کلی درباره‌ی مردم و نه درباره‌ی «ما» به کار رفته است.'
    example_gloss: بعضی‌ها وقتشان را محدود می‌کنند.
  prs.a2.unit16.lesson03.teach.article_text:
    title: متنی کوتاه درباره‌ی زمان استفاده از صفحه‌نمایش
    gloss: بسیاری از مردم روزانه چند ساعت از شبکه‌های اجتماعی استفاده می‌کنند. بعضی‌ها وقتشان را محدود می‌کنند تا وقت بیشتری برای خانواده و دوستانشان داشته باشند.
    note: متنی کوتاه و آموزشی، به سبک نوشتاری که این درس آموزش می‌دهد.
  prs.a2.unit16.lesson04.teach.turn01:
    title: همایون از زرمینه درباره‌ی وقتی که آنلاین می‌گذراند می‌پرسد
    gloss: همایون از زرمینه می‌پرسد چقدر وقت در شبکه‌های اجتماعی می‌گذراند.
    note: همان سؤال درس دوم و همان لحن غیررسمی *تو* که برای این دو دوست آمده است.
  prs.a2.unit16.lesson04.teach.turn02:
    title: زرمینه جواب می‌دهد و می‌پرسد
    gloss: معمولاً روزی یک ساعت. او همین را از همایون می‌پرسد.
    note: '*چطور* اینجا یعنی «تو چطور؟»'
  prs.a2.unit16.lesson04.teach.turn03:
    title: همایون عادت خودش را توضیح می‌دهد
    gloss: او بیشتر ویدیو تماشا می‌کند. شاید روزی دو ساعت.
    note: '*بیشتر* اینجا یعنی «بیشتر اوقات».'
  prs.a2.unit16.lesson04.teach.turn04:
    title: زرمینه نظرش را می‌گوید
    gloss: به نظر او این خیلی زیاد است.
    note: از الگوی نظر دادن *به نظر من* در درس دوم دوباره استفاده شده است.
  prs.a2.unit16.lesson04.teach.turn05:
    title: همایون موافقت می‌کند ولی می‌گوید لذت می‌برد
    gloss: شاید، ولی او از آن لذت می‌برد.
    note: '*لذت می‌برم* یعنی «لذت می‌برم».'
  prs.a2.unit16.lesson04.teach.turn06:
    title: زرمینه پیشنهاد می‌کند استفاده را محدود کنند
    gloss: او می‌گوید بعضی وقت‌ها باید وقتمان را محدود کنیم.
    note: '*محدود کنیم* دقیقاً از درس دوم تکرار شده است.'
  prs.a2.unit16.lesson04.teach.turn07:
    title: همایون قبول می‌کند کمتر استفاده کند
    gloss: درست است. او از فردا کمتر استفاده می‌کند.
    note: '*کمتر* یعنی «کمتر».'
  prs.a2.unit16.lesson04.teach.turn08:
    title: زرمینه تأیید می‌کند
    gloss: زرمینه می‌گوید عالی است.
    note: '*عالی است!* روش رایج برای گفتن «عالیه!» است.'
