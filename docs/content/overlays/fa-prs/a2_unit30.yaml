    feedback: '*من می‌توانم آشپزی کنم.* گفتن *من* اختیاری است.'
  prs.a2.unit30.lesson02.exercise01.recognize_he_drive:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: او می‌تواند رانندگی کند
    distractors:
    - او رانندگی کرد
    - می‌توانم رانندگی کنم
    - آن‌ها می‌توانند رانندگی کنند
    accepted_answers:
    - value: او می‌تواند رانندگی کند
      status: correct
    feedback: '*می‌تواند* شکل «او»ی فعل کمکی است و *کند* وجه التزامی هم‌خوان با آن است.'
  prs.a2.unit30.lesson02.exercise02.match_paradigm:
    instruction: هر شکل دری را به معنی‌اش وصل کنید.
    accepted_answers:
    - value:
