      right: می‌توانم شنا کنم
    - left: می‌توانم آشپزی کنم
      right: می‌توانم آشپزی کنم
    - left: می‌توانم رانندگی کنم
      right: می‌توانم رانندگی کنم
    - left: می‌توانم نقاشی کنم
      right: می‌توانم نقاشی کنم
    - left: می‌توانم نامه بنویسم
      right: می‌توانم نامه بنویسم
    - left: می‌توانم دری صحبت کنم
      right: می‌توانم دری صحبت کنم
    - left: می‌توانم انگلیسی صحبت کنم
      right: می‌توانم انگلیسی صحبت کنم
    - left: می‌توانم کتاب بخوانم
