      status: correct
    feedback: '*می‌توانم شنا کنم* یعنی می‌توانم شنا کنم: *می‌توانم* به‌اضافه‌ی وجه التزامی *کنم*.'
  prs.a2.unit30.lesson01.exercise02.recognize_letter:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: می‌توانم نامه بنویسم
    distractors:
    - نامه نوشتم
