      - صحبت
      - کنم
      status: correct
    feedback: در *من می‌توانم دری صحبت کنم*، *می‌توانم* بعد از فاعل می‌آید و وجه التزامی *کنم* آخر جمله قرار می‌گیرد.
  prs.a2.unit30.lesson01.exercise05.complete_drive:
    instruction: 'جمله را کامل کنید: من می‌توانم رانندگی کنم.'
    accepted_answers:
