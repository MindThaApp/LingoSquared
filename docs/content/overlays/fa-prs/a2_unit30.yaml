        می‌توانی بروی: می‌توانی بروی (به دوست)
        می‌تواند برود: او می‌تواند برود
        می‌توانیم برویم: می‌توانیم برویم
        می‌توانین بروین: می‌توانید بروید (محترمانه یا جمع)
        می‌توانند بروند: آن‌ها می‌توانند بروند
        نمی‌توانم بروم: نمی‌توانم بروم
        نمی‌توانند بروند: آن‌ها نمی‌توانند بروند
      status: correct
    feedback: 'هر دو فعل با شخص تغییر می‌کنند: *-م* من، *-ی* تو (دوست)، *-د* او، *-یم* ما، *-ین* شما (رسمی یا جمع)، *-ند* آن‌ها. در منفی، *ن* فقط به *می‌توانم* اضافه می‌شود.'
    pairs:
    - left: می‌توانم بروم
      right: می‌توانم بروم
    - left: می‌توانی بروی
      right: می‌توانی بروی (به دوست)
    - left: می‌تواند برود
      right: او می‌تواند برود
    - left: می‌توانیم برویم
