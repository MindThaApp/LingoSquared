course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستان در سطح پیش‌متوسطه: گفتن اینکه چه کاری می‌توانید یا نمی‌توانید انجام دهید، کی آزاد یا مشغول هستید و چه چیزی ممکن است اتفاق بیفتد. فعل کمکی می‌توانم با وجه التزامی، ممکن است و شاید با وجه التزامی، و تعیین زمانی که می‌توانید بیایید.'
units:
