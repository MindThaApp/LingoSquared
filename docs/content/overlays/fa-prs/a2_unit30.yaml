        می‌توانم آشپزی کنم: می‌توانم آشپزی کنم
        می‌توانم رانندگی کنم: می‌توانم رانندگی کنم
        می‌توانم نقاشی کنم: می‌توانم نقاشی کنم
        می‌توانم نامه بنویسم: می‌توانم نامه بنویسم
        می‌توانم دری صحبت کنم: می‌توانم دری صحبت کنم
        می‌توانم انگلیسی صحبت کنم: می‌توانم انگلیسی صحبت کنم
        می‌توانم کتاب بخوانم: می‌توانم کتاب بخوانم
      status: correct
    feedback: 'هر جمله از *می‌توانم* + یک مهارت + وجه التزامی ساخته شده است: برای فعل‌های دوکلمه‌ای *کنم* و برای فعل‌های ساده *بنویسم* و *بخوانم*.'
