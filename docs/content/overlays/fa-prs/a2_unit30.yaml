      status: correct
    - value: بکنم
      status: acceptable_with_note
      note: این شکل هم وجود دارد، اما برای فعل دوکلمه‌ای در این درس از کنم استفاده می‌شود.
    feedback: '*رانندگی کنم* وجه التزامی *رانندگی کردن* است. فعل دوکلمه‌ای *کنم* می‌گیرد.'
  prs.a2.unit30.lesson01.exercise06.translate_cook:
    instruction: 'به دری ترجمه کنید: من می‌توانم آشپزی کنم.'
    accepted_answers:
