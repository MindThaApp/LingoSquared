    - left: می‌توانند بروند
      right: آن‌ها می‌توانند بروند
    - left: نمی‌توانم بروم
      right: نمی‌توانم بروم
    - left: نمی‌توانند بروند
      right: آن‌ها نمی‌توانند بروند
