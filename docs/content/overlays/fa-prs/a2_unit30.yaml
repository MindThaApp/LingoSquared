      status: correct
    feedback: '*می‌توانم نامه بنویسم* یعنی «می‌توانم نامه بنویسم»: *نامه* همان نامه است و *بنویسم* وجه التزامی *نوشتن* است.'
  prs.a2.unit30.lesson01.exercise03.match_skills:
