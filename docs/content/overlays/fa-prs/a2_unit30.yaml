teaching:
  prs.a2.unit30.lesson01.teach.swim:
    title: شنا کردن
    gloss: شنا کردن
    note: '*شنا کردن* یعنی شنا کردن. فعل دوکلمه‌ای است: اسم *شنا* به‌علاوهٔ *کردن*. بسیاری از مهارت‌ها این‌طور ساخته می‌شوند: *آشپزی کردن* (آشپزی کردن)، *رانندگی کردن* (رانندگی کردن)، *صحبت کردن* (صحبت کردن).'
    example_gloss: من خوب شنا می‌کنم.
  prs.a2.unit30.lesson01.teach.paint:
    title: نقاشی کردن
    gloss: نقاشی کردن
    note: '*نقاشی کردن* یعنی نقاشی کشیدن. مثل *شنا کردن*، اسم به‌علاوهٔ *کردن* است.'
    example_gloss: دوستم نقاشی می‌کند.
  prs.a2.unit30.lesson01.teach.letter:
    title: نامه
    gloss: نامه
    note: '*نامه* یعنی نامه. فعل نوشتن در دری *نوشتن* است و نامه چیزی است که می‌نویسید: *نامه نوشتن* یعنی نامه نوشتن.'
    example_gloss: نامه در خانه است.
  prs.a2.unit30.lesson01.teach.dari:
    title: دری
    gloss: دری (زبان)
    note: '*دری* نام زبانی است که یاد می‌گیرید. آن را با *صحبت کردن* به کار می‌برید: *دری صحبت کردن*، و *انگلیسی صحبت کردن* یعنی انگلیسی حرف زدن.'
    example_gloss: من کمی دری صحبت می‌کنم.
  prs.a2.unit30.lesson01.teach.can:
    title: 'می‌توانم: می‌توانم'
    gloss: می‌توانم بروم. می‌توانم بیایم. می‌توانم آشپزی کنم.
    note: '*می‌توانم* یعنی می‌توانم، قادرم. همیشه بعد از آن فعل دوم به شکل التزامی می‌آید: *می‌توانم بروم* (می‌توانم بروم)، *می‌توانم بیایم* (می‌توانم بیایم)، *می‌توانم آشپزی کنم* (می‌توانم آشپزی کنم). دو فعل کنار هم می‌آیند و هر دو اول‌شخص هستند. *می‌توانم* را با نیم‌فاصله (ZWNJ) بین *می* و *توانم* بنویسید، نه با فاصلهٔ کامل.'
  prs.a2.unit30.lesson01.teach.subjunctive:
    title: 'وجه التزامی: ب + ریشهٔ حال + م'
    gloss: (بخواهم) بروم، بخورم، بخوانم، بنویسم، بپزم، بخرم، ببینم، بگویم
    note: 'وجه التزامی از سه بخش ساخته می‌شود: *ب* + ریشهٔ حال + شناسه. برای «من» شناسه *-م* است. ریشهٔ حال *رفتن* می‌شود *رو*، پس *بروم*. با همین قاعده *خوردن* می‌شود *بخورم*، *خواندن* می‌شود *بخوانم*، *نوشتن* می‌شود *بنویسم*، *پختن* می‌شود *بپزم*، *خریدن* می‌شود *بخرم*، *دیدن* می‌شود *ببینم*، *گفتن* می‌شود *بگویم*. این شکل را بعد از *باید* دیده‌اید. بعد از *می‌توانم* فعل دوم است. *آمدن* بی‌قاعده است: *بیایم*.'
  prs.a2.unit30.lesson01.teach.compound:
    title: فعل‌های دوکلمه‌ای ب ندارند
    gloss: می‌توانم آشپزی، رانندگی، شنا، صحبت و نقاشی کنم
    note: 'فعلی که از یک اسم و *کردن* ساخته می‌شود، *ب* نمی‌گیرد. فقط فعل کمکی تغییر می‌کند: *کنم*. شکل استاندارد نوشتاری *آشپزی کنم* است؛ *آشپزی بکنم* هم در گفتار شنیده می‌شود. *می‌توانم آشپزی کنم* را با *می‌توانم بروم* مقایسه کنید. همین الگو برای *رانندگی کنم*، *شنا کنم*، *صحبت کنم* و *نقاشی کنم* هم کاربرد دارد. فعل ساده‌ی *کردن* به تنهایی *بکنم* می‌شود.'
  prs.a2.unit30.lesson01.teach.cook:
    title: می‌توانم آشپزی کنم
    gloss: من می‌توانم آشپزی کنم.
    note: 'این الگوی پایه است: فاعل (اختیاری)، *می‌توانم*، مهارت و وجه التزامی *کردن*.'
  prs.a2.unit30.lesson01.teach.speak_dari:
    title: می‌توانم دری صحبت کنم
    gloss: می‌توانم دری صحبت کنم.
    note: فاعل *من* را می‌شود حذف کرد، چون *می‌توانم* خودش نشان می‌دهد چه کسی صحبت می‌کند. فعل *صحبت کنم* در آخر جمله می‌آید.
  prs.a2.unit30.lesson02.teach.paradigm:
    title: صرف کامل
    gloss: می‌توانم بروم، می‌توانی بروی، او می‌تواند برود، می‌توانیم برویم، شما (رسمی یا جمع) می‌توانید بروید، آن‌ها می‌توانند بروند
    note: 'هر دو فعل با شخص تغییر می‌کنند. فعل کمکی: *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. وجه التزامی: *بروم، بروی، برود، برویم، بروین، بروند*. پس *می‌توانی بروی* یعنی «تو می‌توانی بروی» (به دوست)، *می‌تواند برود* یعنی «او می‌تواند برود»، *می‌توانیم برویم* یعنی «ما می‌توانیم برویم»، *می‌توانین بروین* یعنی «شما می‌توانید بروید» (رسمی، برای کسی که به او احترام می‌گذارید، یا برای چند نفر)، *می‌توانند بروند* یعنی «آن‌ها می‌توانند بروند». پایان شخص دوم جمع در هر دو فعل *-ین* است.'
  prs.a2.unit30.lesson02.teach.agreement:
    title: 'فعل‌های دوکلمه‌ای: فقط کنم تغییر می‌کند'
    gloss: او می‌تواند رانندگی کند. شما می‌توانید رانندگی کنید. ما می‌توانیم آشپزی کنیم.
    note: 'در فعل‌های دوکلمه‌ای اسم ثابت می‌ماند و فقط *کنم* تغییر می‌کند: *کنم، کنی، کند، کنیم، کنین، کنند*. پس: *می‌توانم رانندگی کنم*، *می‌توانی رانندگی کنی*، *می‌تواند رانندگی کند*، *می‌توانیم رانندگی کنیم*، *می‌توانین رانندگی کنین*، *می‌توانند رانندگی کنند*. شخص باید در هر دو فعل یکی باشد.'
  prs.a2.unit30.lesson02.teach.negative:
    title: 'منفی: نمی‌توانم'
    gloss: نمی‌توانم بروم، نمی‌توانی بروی، او نمی‌تواند برود، نمی‌توانیم برویم، شما نمی‌توانید بروید، آن‌ها نمی‌توانند بروند
    note: 'برای گفتن اینکه نمی‌توانید کاری را انجام دهید، *ن* را به فعل کمکی اضافه کنید: *می‌توانم* می‌شود *نمی‌توانم*. فعل دوم مثبت می‌ماند: *نمی‌توانم بروم* (نمی‌توانم بروم)، نه *نمی‌توانم نروم*. همه‌ی پایان‌ها مثل صرف مثبت است.'
  prs.a2.unit30.lesson02.teach.help_q:
    title: می‌توانید به من کمک کنید؟
    gloss: می‌توانید به من کمک کنید؟
    note: 'این‌طور می‌پرسید که دوستتان می‌تواند کاری را انجام دهد یا نه: *می‌توانی* به‌اضافه‌ی وجه التزامی. برای کسی که به او احترام می‌گذارید یا برای چند نفر بگویید *می‌توانین به من کمک کنین؟*.'
  prs.a2.unit30.lesson02.teach.no_drive:
    title: او نمی‌تواند رانندگی کند
    gloss: او نمی‌تواند رانندگی کند.
    note: '*او* هم «he» و هم «she» را می‌رساند، پس این جمله درباره‌ی یک نفر است که نمی‌تواند رانندگی کند. *نمی‌تواند* منفی است؛ *کند* وجه التزامی *کردن* برای او (سوم شخص مفرد) است.'
  prs.a2.unit30.lesson03.teach.busy:
    title: مشغول
    gloss: مشغول، سرگرم
    note: '*مشغول* یعنی گرفتار و سرگرم. می‌گویید *مشغول استم* (من مشغولم)، برعکس *آزاد استم* (من آزادم).'
    example_gloss: امروز مشغولم.
  prs.a2.unit30.lesson03.teach.tonight:
    title: امشب
    gloss: امشب، این شب
    note: '*امشب* یعنی همین شب. مثل *فردا* و *امروز*، قید زمان است و پیش از فعل می‌آید.'
    example_gloss: امشب خانه‌ام.
  prs.a2.unit30.lesson03.teach.five:
    title: پنج
    gloss: پنج
    note: '*پنج* عدد ۵ است. *ساعت پنج* یعنی ساعت پنج و *بعد از ساعت پنج* یعنی بعد از ساعت پنج.'
    example_gloss: ساعت پنج به خانه می‌روم.
  prs.a2.unit30.lesson03.teach.time_word:
    title: قید زمان به‌اضافه‌ی می‌توانم
    gloss: فردا می‌توانم بیایم. امشب نمی‌توانم بیایم. روز جمعه می‌توانم بیایم.
    note: 'برای گفتن اینکه چه زمانی می‌توانید کاری را انجام دهید، یک قید زمان در جمله بگذارید: *فردا*، *امشب*، *روز جمعه*. فعل‌ها همان می‌مانند، *می‌توانم بیایم*؛ قید زمان نشان می‌دهد که درباره‌ی آینده است، پس به شکل دیگری برای آینده نیاز نیست. قید زمان می‌تواند اول بیاید (*فردا می‌توانم بیایم*) یا بعد از فعل کمکی (*می‌توانم فردا بیایم*). سؤال این است: *فردا می‌توانی بیایی؟* (فردا می‌توانی بیایی؟).'
  prs.a2.unit30.lesson03.teach.reply:
    title: بله، نه، چون، ولی
    gloss: بله، می‌توانم بیایم. نه، نمی‌توانم بیایم، چون مشغولم. ولی روز جمعه آزادم.
    note: 'برای پذیرفتن بگویید *بلی* و فعل کمکی را تکرار کنید: *بلی، می‌توانم بیایم*. برای نپذیرفتن بگویید *نخیر* و دلیل را با *چون* بگویید: *نخیر، نمی‌توانم بیایم، چون مشغول استم*. بعد *ولی* زمان دیگری پیشنهاد می‌دهد: *ولی روز جمعه آزاد استم*. *آزاد استم* یعنی آزادم و *مشغول استم* یعنی مشغولم. می‌توانید بگویید *کار دارم* (کار دارم) هم.'
  prs.a2.unit30.lesson03.teach.after_five:
    title: بعد از پنج آزادم
    gloss: بعد از ساعت پنج آزادم.
    note: این جمله به طرف مقابل می‌گوید چه زمانی آزادید. *بعد از ساعت پنج* یعنی بعد از ساعت پنج.
  prs.a2.unit30.lesson03.teach.when_q:
    title: کی می‌توانی بیایی؟
    gloss: کی می‌توانی بیایی؟
    note: '*کی* درباره‌ی زمان می‌پرسد. جواب با قید زمان و همین الگو داده می‌شود: *فردا می‌توانم بیایم* یا *بعد از ساعت پنج می‌توانم بیایم*.'
  prs.a2.unit30.lesson04.teach.possible:
    title: ممکن است، شاید
    gloss: ممکن است، احتمال دارد که
    note: '*ممکن است* یعنی احتمال دارد. بعد از آن بندی می‌آید که فعلش وجه التزامی است: *ممکن است باران ببارد* (ممکن است باران ببارد). *ممکن* هرگز تغییر نمی‌کند؛ فعل بعد از آن شخص را نشان می‌دهد.'
    example_gloss: ممکن است فردا باران بیاید.
  prs.a2.unit30.lesson04.teach.maybe:
    title: شاید
    gloss: شاید، احتمالاً
    note: '*شاید* یعنی شاید. مثل *ممکن است* بعد از آن وجه التزامی می‌آید: *شاید بیایم* (شاید بیایم)، *شاید او بیاید* (شاید او بیاید). *شاید* کوتاه‌تر است و در گفتار بیشتر به کار می‌رود.'
    example_gloss: شاید او بیاید.
  prs.a2.unit30.lesson04.teach.rain:
    title: باران
    gloss: باران
    note: '*باران* یعنی باران. فعلش *باریدن* است: *باران ببارد* (ممکن است باران ببارد)، *باران نبارد* (ممکن است باران نبارد). وجه التزامی *باریدن* *ببارد* است.'
    example_gloss: امروز باران می‌بارد.
  prs.a2.unit30.lesson04.teach.sure:
    title: حتماً
    gloss: مطمئن، یقین
    note: '*مطمئن* یعنی مطمئن. *مطمئن نیستم* یعنی مطمئن نیستم. طبیعی است که پیش از *شاید* یا *ممکن است* این را بگویید.'
    example_gloss: مطمئن نیستم.
  prs.a2.unit30.lesson04.teach.possible_subj:
    title: ممکن است به‌اضافه‌ی وجه التزامی
    gloss: ممکن است دیر بیایم. ممکن است او بیاید. ممکن است باران ببارد.
    note: 'بعد از *ممکن است* فعل به وجه التزامی و به شخص موردنظر می‌آید: *بیایم* (من بیایم)، *بیایی* (تو بیایی)، *بیاید* (او بیاید)، *بیاییم* (ما بیاییم)، *بیایین* (شما بیایید)، *بیایند* (آن‌ها بیایند). منفی با *ن* روی فعل التزامی ساخته می‌شود: *ممکن است نیاید* (ممکن است نیاید). با *می‌توانم* مقایسه کنید: آن توانایی را می‌رساند؛ *ممکن است* می‌گوید احتمال دارد اتفاق بیفتد.'
  prs.a2.unit30.lesson04.teach.maybe_subj:
    title: شاید به‌اضافه‌ی وجه التزامی
    gloss: شاید بیایم. شاید بیایی. شاید او بیاید. شاید نیایند.
    note: '*شاید* دقیقاً مثل *ممکن است* کار می‌کند: بعد از آن وجه التزامی می‌آید و شخص با پایان فعل نشان داده می‌شود: *شاید بیایم، شاید بیایی، شاید بیاید، شاید بیاییم، شاید بیایین، شاید بیایند*. منفی با *ن* روی فعل است: *شاید نیایند* (شاید نیایند). قید زمان می‌تواند جلوتر بیاید: *شاید فردا بیایم*.'
  prs.a2.unit30.lesson04.teach.can_maybe:
    title: 'شاید بتوانم: شاید بتوانم'
    gloss: شاید بتوانم بیایم. شاید نتوانم بیایم. ممکن است او بتواند بیاید.
    note: 'می‌توانید این دو را کنار هم بگذارید: *شاید* یا *ممکن است* به‌اضافه‌ی وجه التزامی *توانستن* که *بتوانم، بتوانی، بتواند، بتوانیم، بتوانین، بتوانند* است، به‌اضافه‌ی فعل دوم. پس *شاید بتوانم بیایم* یعنی شاید بتوانم بیایم. منفی آن *نتوانم* است: *شاید نتوانم بیایم* یعنی شاید نتوانم بیایم. وقتی هنوز نمی‌دانید آزاد هستید یا نه، این به کار می‌آید.'
  prs.a2.unit30.lesson04.teach.maybe_tomorrow:
    title: شاید فردا بتوانم بیایم
    gloss: شاید فردا بتوانم بیایم.
    note: مطمئن نیستید، ولی امکانش هست. قید زمان *فردا* بعد از *شاید* می‌آید.
  prs.a2.unit30.lesson04.teach.rain_phrase:
    title: ممکن است باران بیاید
    gloss: ممکن است باران ببارد.
    note: '*ممکن است* به‌اضافه‌ی *ببارد*: یک احتمال، نه یک قول.'
  prs.a2.unit30.lesson05.teach.fix:
    title: تعمیر کردن
    gloss: تعمیر کردن، درست کردن
    note: '*درست کردن* یعنی تعمیر کردن چیزی، و همچنین ساختن و تهیه کردن، مثل *چای درست کردن* (چای دم کردن). چیزی که درست می‌شود اول و با *را* می‌آید: *کمپیوترم را درست می‌کنم*.'
    example_gloss: دوستم ماشینم را تعمیر می‌کند.
  prs.a2.unit30.lesson05.teach.problem:
    title: مشکل
    gloss: مشکل، دردسر
    note: '*مشکل* یعنی مشکل. *مشکل کوچک* یعنی یک مشکل کوچک.'
    example_gloss: مشکل کوچک است.
  prs.a2.unit30.lesson05.teach.turn01:
    title: وحیده می‌پرسد سخی می‌تواند بیاید یا نه
    gloss: سخی، فردا می‌توانی به خانه‌ی ما بیایی؟
    note: 'وحیده از دوستش می‌پرسد فردا آزاد است یا نه: *فردا می‌توانی ... بیایی؟*. او *تو* به کار می‌برد، چون سخی دوست اوست.'
  prs.a2.unit30.lesson05.teach.turn02:
    title: سخی زمانش را می‌گوید
    gloss: صبح نمی‌توانم، چون در دفتر کار دارم. ولی بعد از ساعت پنج آزادم.
    note: سخی صبح را با *نمی‌توانم* رد می‌کند و دلیلش را با *چون* می‌گوید. در *نمی‌توانم* فعل دوم حذف شده، چون *بیایم* از سؤال معلوم است. بعد با *ولی* زمان دیگری پیشنهاد می‌دهد.
  prs.a2.unit30.lesson05.teach.turn03:
    title: وحیده کمک می‌خواهد
    gloss: خوب است. کمپیوترم خراب است. می‌توانی آن را درست کنی؟
    note: '*می‌توانی ... درست کنی؟* می‌پرسد که آیا او می‌تواند آن را تعمیر کند. *آن را* به کمپیوتر برمی‌گردد.'
  prs.a2.unit30.lesson05.teach.turn04:
    title: سخی مطمئن نیست
    gloss: شاید بتوانم. ممکن است مشکل کوچک باشد.
    note: سخی مطمئن نیست، برای همین می‌گوید *شاید بتوانم* (شاید بتوانم) و *ممکن است ... باشد* (ممکن است باشد). بعد از هر دو وجه التزامی می‌آید.
  prs.a2.unit30.lesson05.teach.message:
    title: پیامی از یک دوست
    gloss: سلام دوست من. فردا نمی‌توانم بیایم، چون صبح در دفتر کار دارم. بعد از ساعت پنج آزادم، ولی ممکن است دیر برسم. شاید پنجشنبه بتوانم بیایم. تو پنجشنبه آزادی؟
    note: 'پیام کوتاهی که هر سه مفهوم این درس را دارد: کاری که نویسنده نمی‌تواند بکند (*نمی‌توانم بیایم*)، زمانی که آزاد است (*بعد از ساعت پنج آزاد استم*) و آنچه ممکن است اتفاق بیفتد (*ممکن است دیر برسم، شاید ... بتوانم*).'
  prs.a2.unit30.lesson06.teach.park:
    title: پارک
    gloss: پارک
    note: '*پارک* یعنی پارک. می‌گویید *به پارک* (به پارک) می‌روید و *در پارک* (در پارک) می‌مانید.'
    example_gloss: پارک در کابل است.
  prs.a2.unit30.lesson06.teach.tea:
    title: چای
    gloss: چای
    note: '*چای* یعنی چای. *چای درست کردن* یعنی چای دم کردن، با همان فعلی که در درس قبل یاد گرفتید.'
    example_gloss: چای داغ است.
  prs.a2.unit30.lesson06.teach.turn01:
    title: حمید درباره‌ی جمعه می‌پرسد
    gloss: پلوشه، جمعه به پارک می‌روی؟
    note: '*جمعه به پارک می‌روی؟* درباره‌ی یک برنامه با حال ساده‌ی *می‌روی* و قید زمان می‌پرسد. پلوشه دوست اوست، پس *تو* به کار می‌برد.'
  prs.a2.unit30.lesson06.teach.turn02:
    title: پلوشه مطمئن نیست
    gloss: شاید بروم. ممکن است باران ببارد.
    note: پلوشه مطمئن نیست. *شاید بروم* یعنی شاید بروم و *ممکن است باران ببارد* یعنی ممکن است باران ببارد. هر دو فعل التزامی هستند.
  prs.a2.unit30.lesson06.teach.turn03:
    title: حمید پیشنهاد می‌دهد و می‌پرسد
    gloss: من می‌توانم غذا بپزم. تو می‌توانی چای درست کنی؟
    note: حمید می‌گوید چه کاری از دستش برمی‌آید (*می‌توانم غذا بپزم*) و می‌پرسد پلوشه چه کاری می‌تواند بکند (*می‌توانی چای درست کنی؟*).
  prs.a2.unit30.lesson06.teach.turn04:
    title: پلوشه با یک شرط قبول می‌کند
    gloss: بله، می‌توانم. ولی اگر باران ببارد، نمی‌توانیم در پارک بمانیم.
    note: '*بلی، می‌توانم* یعنی قبول کردن. بعد *اگر باران ببارد* (اگر باران ببارد) شرط را می‌گوید و *نمی‌توانیم ... بمانیم* می‌گوید آن دو چه کاری نمی‌توانند بکنند. بعد از *اگر* هم وجه التزامی می‌آید.'
  prs.a2.unit30.lesson06.teach.turn05:
    title: حمید فکر دیگری دارد
    gloss: پس شاید در خانه‌ی من غذا بخوریم.
    note: '*شاید ... بخوریم* پیشنهادی است که ممکن است درست باشد: شاید در خانه‌ی من غذا بخوریم. *پس* (در نتیجه) از مشکل باران می‌آید.'
exercises:
  prs.a2.unit30.lesson01.exercise01.recognize_swim:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: می‌توانم شنا کنم
    distractors:
