course:
  title: دری افغانستان A1
  description: 'دری افغانستان در سطح مقدماتی: نام بردن از مکان‌های رایج شهر، پرسیدن جای چیزی، دادن پاسخ‌های ساده دربارهٔ مکان و دنبال کردن مسیرهای ساده تا رسیدن به یک مکان.'
units:
