teaching:
  prs.a1.unit05.lesson01.teach.bazaar:
    title: بازار
    gloss: بازار
    note: بازار واژهٔ رایج برای محوطه‌ای از مغازه‌هاست که اغلب یک خیابان یا یک محلهٔ کامل را در بر می‌گیرد.
    example_gloss: بازار نزدیک است.
  prs.a1.unit05.lesson01.teach.bank:
    title: بانک
    gloss: بانک
    note: بانک در دری هم مثل فارسی ایران همین واژهٔ دخیل است و به همان شکل به کار می‌رود.
    example_gloss: بانک کجاست؟
  prs.a1.unit05.lesson01.teach.mosque:
    title: مسجد
    gloss: مسجد
    note: مسجد واژهٔ معمول برای مسجد است.
    example_gloss: مسجد بزرگ است.
  prs.a1.unit05.lesson01.teach.hospital:
    title: بیمارستان
    gloss: بیمارستان
    note: شفاخانه واژهٔ روزمرهٔ دری افغانستان برای بیمارستان است؛ دری‌زبانان بیمارستان را می‌فهمند، ولی خودشان معمولاً آن را به کار نمی‌برند.
    example_gloss: بیمارستان دور است.
  prs.a1.unit05.lesson01.teach.school:
    title: مدرسه
    gloss: مدرسه
    note: مکتب واژهٔ روزمرهٔ دری افغانستان برای مدرسه است؛ در دری «مدرسه» معمولاً به‌طور خاص یعنی مدرسهٔ دینی.
    example_gloss: مدرسه نزدیک خانه است.
  prs.a1.unit05.lesson01.teach.pharmacy:
    title: داروخانه
    gloss: داروخانه
    note: دواخانه واژهٔ روزمرهٔ دری افغانستان برای داروخانه است (از دوا، به معنی دارو)؛ در فارسی ایران می‌گویند داروخانه.
    example_gloss: داروخانه کجاست؟
  prs.a1.unit05.lesson01.teach.va_word:
    title: و
    gloss: و
    note: و حرف ربطی رایج برای وصل کردن چند مکان در یک فهرست است.
    target_text: و (حرف ربط)
  prs.a1.unit05.lesson02.teach.post_office:
    title: اداره‌ی پست
    gloss: اداره‌ی پست
    note: پوسته خانه از پوسته (پست، نامه) و خانه (ساختمان) ساخته شده است.
    example_gloss: اداره پست بسته است.
  prs.a1.unit05.lesson02.teach.embassy:
    title: سفارت
    gloss: سفارت
    note: سفارت واژهٔ معمول برای سفارتخانه است.
    example_gloss: سفارت در کابل است.
  prs.a1.unit05.lesson02.teach.airport:
    title: فرودگاه
    gloss: فرودگاه
    note: میدان هوایی واژهٔ روزمرهٔ دری افغانستان برای فرودگاه است (در اصل «میدان هوا»)؛ در فارسی ایران می‌گویند فرودگاه.
    example_gloss: فرودگاه دور است.
  prs.a1.unit05.lesson02.teach.office_review:
    title: دفتر (مرور)
    gloss: دفتر (محل کار)
    note: دفتر را قبلاً در یک واحد پیشین یاد گرفته‌اید؛ این‌جا کنار بقیهٔ مکان‌های اداری دوباره آمده است.
    example_gloss: دفتر من نزدیک است.
  prs.a1.unit05.lesson03.teach.kojast_bazaar:
    title: پرسیدن جای بازار
    gloss: بازار کجاست؟
    note: بازار کجاست؟ الگوی پایه برای پرسیدن جای هر مکانی است.
  prs.a1.unit05.lesson03.teach.kojast_hospital:
    title: پرسیدن جای بیمارستان
    gloss: بیمارستان کجاست؟
    note: همین الگوی کجاست با اسم هر مکانی به کار می‌رود.
  prs.a1.unit05.lesson03.teach.bebakhshid:
    title: جلب توجه مؤدبانهٔ کسی
    gloss: ببخشید، داروخانه کجاست؟
    note: ببخشین برای شروع مؤدبانهٔ سؤال از یک غریبه به کار می‌رود، مثل «ببخشید» در فارسی ایران؛ فقط شکل فعلش در دری «ببخشین» است.
  prs.a1.unit05.lesson03.teach.kojast_grammar:
    title: کجاست چطور ساخته می‌شود
    gloss: کجاست از کجا (کجا) و است (است) ساخته شده که به هم چسبیده‌اند.
    note: دانستن این ساختار کمک می‌کند الگو را ببینید و کجاست را فقط به‌عنوان یک تکهٔ جدا و بی‌تجزیه حفظ نکنید.
  prs.a1.unit05.lesson04.teach.near:
    title: نزدیک
    gloss: نزدیکِ
    note: نزدیک برای چیزی است که در همین حوالی است.
    example_gloss: بانک نزدیک است.
  prs.a1.unit05.lesson04.teach.far:
    title: دور
    gloss: دور
    note: دور برای چیزی است که فاصله دارد.
    example_gloss: بیمارستان دور است.
  prs.a1.unit05.lesson04.teach.here:
    title: اینجا
    gloss: اینجا
    note: این‌جا به جایی اشاره می‌کند که گوینده همین حالا در آن است.
    example_gloss: بانک اینجاست.
  prs.a1.unit05.lesson04.teach.there:
    title: آن‌جا
    gloss: آنجا
    note: آن‌جا به جایی اشاره می‌کند که از گوینده دور است.
    example_gloss: داروخانه آن‌جاست.
  prs.a1.unit05.lesson04.teach.bazaar_near:
    title: گفتن اینکه بازار نزدیک است
    gloss: بازار نزدیک است.
    note: بازار نزدیک است از همان فعل ربطی است که در سراسر این دوره دیده‌اید.
  prs.a1.unit05.lesson04.teach.airport_far:
    title: گفتن اینکه فرودگاه دور است
    gloss: فرودگاه دور است.
    note: میدان هوایی دور است همان الگو را دارد، فقط به‌جای نزدیک، دور آمده است.
  prs.a1.unit05.lesson05.teach.next_to:
    title: کنار
    gloss: کنارِ
    note: در کنار در اصل یعنی «در پهلوی».
  prs.a1.unit05.lesson05.teach.behind:
    title: پشت
    gloss: پشتِ
    note: پشت نشان می‌دهد که چیزی پشت مکان دیگری قرار دارد.
    example_gloss: داروخانه پشت مدرسه است.
  prs.a1.unit05.lesson05.teach.opposite:
    title: روبه‌رو
    gloss: روبه‌رو / مقابلِ
    note: مقابل نشان می‌دهد که چیزی دقیقاً روبه‌روی جای دیگری قرار دارد.
    example_gloss: بانک روبه‌روی مسجد است.
  prs.a1.unit05.lesson05.teach.hospital_next_to_mosque:
    title: جای بیمارستان را نسبت به مسجد مشخص کنید
    gloss: بیمارستان کنار مسجد است.
    note: شفاخانه در کنار مسجد است از یک مکان، حرف اضافهٔ «در کنار» و فعل ربطی «است» ساخته شده است.
  prs.a1.unit05.lesson06.teach.tashakor_ziad:
    title: خیلی ممنون
    gloss: خیلی ممنون.
    note: تشکر زیاد شکل تأکیدی «تشکر» است که قبلاً یاد گرفته‌اید.
  prs.a1.unit05.lesson06.teach.turn01:
    title: زرمینه داروخانه را می‌پرسد
    gloss: زرمینه مؤدبانه از یک رهگذر می‌پرسد داروخانه کجاست.
    note: ببخشین سؤال را محترمانه شروع می‌کند و برای صحبت با یک غریبه مناسب است.
  prs.a1.unit05.lesson06.teach.turn02:
    title: رهگذر آدرس می‌دهد
    gloss: رهگذر می‌گوید داروخانه دور نیست، مستقیم بروید و داروخانه کنار مدرسه است.
    note: 'این جمله چند الگوی این درس را کنار هم دارد: دور نیست (منفی دور)، مستقیم بروین و در کنار.'
  prs.a1.unit05.lesson06.teach.turn03:
    title: زرمینه از رهگذر تشکر می‌کند
    gloss: زرمینه خیلی از او تشکر می‌کند.
    note: تشکر زیاد گفتگو را مؤدبانه تمام می‌کند.
  prs.a1.unit05.lesson06.teach.turn04:
    title: پاسخ فروتنانهٔ رهگذر
    gloss: قابلی ندارد / چیزی نیست.
    note: قابلی نداره در دری افغانستان در گفتار روزمره راهی فروتنانه برای جواب تشکر است و از نظر کاربرد شبیه «خواهش می‌کنم» است، ولی خودمانی‌تر. نداره شکل گفتاری ندارد است؛ در صحبت نداره را می‌شنوید، ولی در نوشتار دقیق ندارد نوشته می‌شود.
