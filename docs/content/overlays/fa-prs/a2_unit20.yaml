teaching:
  prs.a2.unit20.lesson01.teach.rkhst_rkhst_tabstan:
    title: تعطیلات
    gloss: تعطیلات / تعطیلات تابستان
    note: '*رخصتی* کلمه‌ی رایج برای تعطیلات یا مرخصی است و *رخصتی تابستان* تعطیلات طولانی تابستان است. *تابستان* همان تابستان است.'
    example_gloss:
    - در ماه اوت تعطیلات دارم.
    - تعطیلات تابستان از ماه ژوئیه شروع می‌شود.
  prs.a2.unit20.lesson01.teach.hfth_andh_sal:
    title: زمان وقوع کار
    gloss: هفته‌ی آینده / سال آینده / به‌زودی
    note: '*آینده* یعنی بعدی و بعد از اسم می‌آید: *هفته آینده* یعنی هفته‌ی بعد و *سال آینده* یعنی سال بعد. *به‌زودی* یعنی در آینده‌ی نزدیک.'
    example_gloss:
    - هفته‌ی آینده یک قرار ملاقات دارم.
    - سال آینده می‌خواهم به بلژیک بروم.
    - به‌زودی تعطیلات دارم.
  prs.a2.unit20.lesson01.teach.sfr_rdn_rzrw:
    title: سه فعل سفر
    gloss: سفر کردن / رزرو کردن / ماندن
    note: '*سفر کردن* یعنی سفر به‌اضافه‌ی *کردن* و *رزرو کردن* یعنی رزرو به‌اضافه‌ی *کردن*. در جمله فقط *کردن* تغییر می‌کند: *سفر می‌کنم*، *رزرو می‌کنم*. *ماندن* یعنی باقی ماندن.'
    example_gloss:
    - دوست دارم با قطار سفر کنم.
    - می‌خواهم یک اتاق رزرو کنم.
    - یک هفته می‌مانم.
  prs.a2.unit20.lesson01.teach.hwtl_m:
    title: محل اقامت
    gloss: هتل / کمپ
    note: '*هوتل* املای رایج افغانی کلمه‌ی هتل است. *کمپ* محل کمپینگ است. می‌گویید *در هوتل* یا *در کمپ* می‌خوابید.'
    example_gloss:
    - هتل نزدیک ساحل است.
    - ما در کمپ می‌خوابیم.
  prs.a2.unit20.lesson01.teach.dr_rkhst_tabstan:
    title: پرسیدن درباره‌ی برنامه‌ی تعطیلات
    gloss: در تعطیلات تابستان چه کار می‌کنی؟
    note: 'در دری برای برنامه‌های نزدیک فعل کمکی خاصی نیست: همان زمان حال ساده *می‌کنی* به کار می‌رود و کلمه‌ی پرسشی *چه* قبل از فعل، در آخر جمله می‌آید.'
  prs.a2.unit20.lesson01.teach.dr_mah_ast:
    title: 'برنامه‌های نزدیک: زمان حال'
    gloss: در ماه اوت به آلمان سفر می‌کنم. یک هتل رزرو می‌کنم.
    note: 'برای گفتن کاری که به‌زودی انجام می‌دهید، دری زمان حال را با قید زمان به کار می‌برد: *می‌روم* (می‌روم، خواهم رفت) با *در ماه اگست*. پیشوند حال *می‌* و شناسه‌ی *-م* را به ریشه اضافه کنید: *رزرو می‌کنم*. فعل آخر جمله می‌ماند و قید زمان می‌تواند اول بیاید: *هفته آینده یک هوتل رزرو می‌کنم*. بدون قید زمان، همین شکل می‌تواند عادت همیشگی هم باشد.'
  prs.a2.unit20.lesson01.teach.mn_hwtl_rzrw:
    title: رزرو هتل
    gloss: یک هتل رزرو می‌کنم.
  prs.a2.unit20.lesson02.teach.wrs_rftn_w:
    title: سه برنامه برای بعد
    gloss: دوره دیدن / اسباب‌کشی کردن / پس‌انداز کردن
    note: '*کورس گرفتن* عبارت ثابت برای شرکت در یک دوره است. *کوچ کردن* یعنی رفتن به خانه‌ی جدید.'
    example_gloss:
    - می‌خواهم در یک دوره شرکت کنم.
    - عمویم می‌خواهد اسباب‌کشی کند.
    - می‌خواهم برای یک دوچرخه‌ی جدید پس‌انداز کنم.
  prs.a2.unit20.lesson02.teach.bad_bad_az:
    title: زمان‌های دورتر
    gloss: بعداً / یک ماه دیگر
    note: '*بعد از یک ماه* یعنی «یک ماه دیگر». با مدت‌های دیگر هم کار می‌کند: *بعد از یک هفته*.'
    example_gloss:
    - بعداً می‌خواهم یک خانه بخرم.
    - یک ماه دیگر دورهٔ من شروع می‌شود.
  prs.a2.unit20.lesson02.teach.bad_az_mah:
    title: دوره‌ای که شروع می‌شود
    gloss: یک ماه دیگر دورهٔ من شروع می‌شود.
  prs.a2.unit20.lesson02.teach.mn_qsd_darm:
    title: 'نیت: قصد دارم + وجه التزامی'
    gloss: قصد دارم در یک دوره شرکت کنم.
    note: 'برای گفتن کاری که قصد انجامش را دارید، از *قصد دارم* استفاده کنید و فعل دوم را در وجه التزامی بیاورید: *قصد دارم یک کورس بگیرم*. وجه التزامی از پیشوند *بـ* + ریشه + شناسه ساخته می‌شود: *بـ* + *گیر* + *-م* = *بگیرم*. فعل‌های مرکب با *کردن* پیشوند *بـ* نمی‌گیرند: *پس‌انداز کنم*. این را برای کارهایی به کار ببرید که دوست دارید انجام دهید، نه برای قرارهای قطعی.'
  prs.a2.unit20.lesson02.teach.mn_qsd_darm_2:
    title: قصد اسباب‌کشی
    gloss: قصد دارم خانه عوض کنم.
  prs.a2.unit20.lesson02.teach.mn_qsd_darm_3:
    title: قصد پس‌انداز
    gloss: قصد دارم پول پس‌انداز کنم.
  prs.a2.unit20.lesson02.teach.frda_bh_bazar:
    title: زمان حال یا قصد دارم؟
    gloss: فردا به بازار می‌روم. بعداً قصد دارم اسباب‌کشی کنم.
    note: 'برای آینده‌ی نزدیک و قطعی، زمان حال را با قید زمان به کار ببرید: *فردا به بازار می‌روم*. برای نیتی که دورتر یا کم‌یقین‌تر است، *قصد دارم* + وجه التزامی را به کار ببرید: *بعد قصد دارم کوچ کنم*.'
  prs.a2.unit20.lesson03.teach.shad_htma:
    title: شاید و حتماً
    gloss: شاید / حتماً
    note: '*شاید* تردید را نشان می‌دهد و بعدش وجه التزامی می‌آید. *حتما* یعنی «قطعاً» یا «بدون شک».'
    example_gloss:
    - شاید فردا باران ببارد.
    - این حتماً خیلی خوش می‌گذرد.
  prs.a2.unit20.lesson03.teach.amsal_an_tabstan:
    title: امسال، این تابستان
    gloss: امسال / این تابستان
    note: '*امسال* یک کلمه برای «این سال» است. *این تابستان* یعنی همین تابستان: *این* قبل از اسم می‌آید.'
    example_gloss:
    - امسال به تعطیلات نمی‌روم.
    - این تابستان در خانه می‌مانم.
    - امسال به تعطیلات می‌روی؟
  prs.a2.unit20.lesson03.teach.an_tabstan_dr:
    title: ماندن در خانه
    gloss: این تابستان در خانه می‌مانم.
  prs.a2.unit20.lesson03.teach.frda_ar_mnm:
    title: شاید و وجه التزامی
    gloss: فردا کار می‌کنم. شاید بعداً به سینما بروم.
    note: 'بعد از *شاید* فعل در وجه التزامی می‌آید: *شاید بعد به سینما بروم* (*بـ* + ریشه‌ی *رو* + *-م*)، نه *می‌روم*. فعل آخر جمله می‌ماند. بعد از یک قید زمان ساده، زمان حال معمولی به کار می‌رود: *فردا کار می‌کنم*.'
  prs.a2.unit20.lesson03.teach.bh_rkhst_nmrwm:
    title: گفتن اینکه قصد انجام کاری را ندارید
    gloss: به تعطیلات نمی‌روم. قصد ندارم اسباب‌کشی کنم.
    note: 'زمان حال را با گذاشتن *ن* قبل از پیشوند فعل منفی کنید: *می‌روم* می‌شود *نمی‌روم*: *به رخصتی نمی‌روم*. برای منفی کردن قصد، *دارم* را منفی کنید: *قصد ندارم کوچ کنم* (قصد اسباب‌کشی ندارم)؛ فعل دوم در وجه التزامی می‌ماند.'
  prs.a2.unit20.lesson04.teach.ba_h_mdt:
    title: دو عبارت پرسشی
    gloss: با چه کسی / چه مدت
    note: '*با کی* می‌پرسد که کاری را با چه کسی انجام می‌دهید؛ *با* یعنی همراه. *چه مدت* درباره‌ی یک بازه‌ی زمانی می‌پرسد.'
    example_gloss:
    - با چه کسی به ساحل می‌روی؟
    - چه مدت می‌مانی؟
  prs.a2.unit20.lesson04.teach.ja_mrw:
    title: کجا می‌روی؟
    gloss: کجا می‌روی؟
    note: '*کجا* با فعل حرکت یعنی «به کجا» هم هست: *کجا می‌روی؟* کلمه‌ی پرسشی وسط جمله و درست قبل از فعل می‌آید.'
  prs.a2.unit20.lesson04.teach.ba_bh_rkhst:
    title: با چه کسی؟
    gloss: با کی به تعطیلات می‌روی؟
  prs.a2.unit20.lesson04.teach.h_mdt_anja:
    title: چه مدت؟
    gloss: چه مدت آنجا می‌مانی؟
  prs.a2.unit20.lesson04.teach.ba_khwahrm_mrwm:
    title: جواب دادن
    gloss: با خواهرم می‌روم.
  prs.a2.unit20.lesson04.teach.hfth_dw_hfth:
    title: هفته‌ها
    gloss: یک هفته / دو هفته
    note: 'در دری بعد از عدد، اسم مفرد می‌ماند: *دو هفته*، نه *دو هفته‌ها*.'
    example_gloss:
    - یک هفته می‌مانم.
    - ما دو هفته می‌مانیم.
  prs.a2.unit20.lesson04.teach.ja_mrw_ba:
    title: سؤال درباره‌ی برنامه‌ها
    gloss: کجا می‌روی؟ با چه کسی می‌روی؟ چه مدت می‌مانی؟
    note: 'جمله‌ی پرسشی در دری ترتیب عادی کلمات را حفظ می‌کند: کلمه‌ی پرسشی را جای پاسخ بگذارید و فعل را آخر نگه دارید: *با کی به رخصتی می‌روی؟*، *چه مدت می‌مانی؟*. برای دوست، فعل با *-ی* تمام می‌شود: *می‌روی*، *می‌مانی*.'
  prs.a2.unit20.lesson05.teach.slam_zrmnh_bhzwd:
    title: پیامی از مریم
    gloss: سلام زرمینه! به‌زودی تعطیلات دارم. در ماه اوت با خواهرم به بلژیک می‌روم و یک هفته در هتل می‌مانیم. بعد دو روز پیش پدر و مادرم می‌روم. سال آینده قصد دارم در یک دوره شرکت کنم و شاید اسباب‌کشی هم بکنم. تو چه می‌کنی؟
    note: 'مریم برنامه‌های نزدیک را با زمان حال و قصد درازمدت را با *قصد دارم* بیان می‌کند. دقت کنید که فعل هر جمله آخر آن است: *می‌مانیم*، *بگیرم*، *کنم*.'
    glosses:
      به‌زودی: به‌زودی
      رخصتی: تعطیلات
      اگست: اوت
      خواهرم: خواهر
      به: به
      بلجیم: بلژیک
      هوتل: هتل
      می‌مانیم: ماندن
      بعد: بعد از اون
      والدینم: پدر و مادر
      روز: روزها
      آینده: بعدی
      سال: سال
      قصد: قصد (قصد دارم = قصد دارم که)
      کورس: دوره
      بگیرم: گذراندن (یک کلاس/دوره)
      شاید: شاید
      کوچ: اسباب‌کشی کردن
      آن‌وقت: بعد
      هم: همچنین
  prs.a2.unit20.lesson06.teach.slam_hmawn_bra:
    title: زرمینه از همایون درباره‌ی برنامه‌هایش می‌پرسد
    gloss: 'زرمینه: سلام همایون! برای تعطیلات تابستان برنامه‌ای داری؟'
  prs.a2.unit20.lesson06.teach.bl_dr_mah:
    title: همایون جواب می‌دهد
    gloss: 'همایون: بله! ماه اوت به آلمان می‌روم. یک هتل رزرو می‌کنم.'
  prs.a2.unit20.lesson06.teach.aal_ba_mrw:
    title: زرمینه می‌پرسد با چه کسی می‌رود
    gloss: 'زرمینه: عالیه! با کی می‌روی؟'
  prs.a2.unit20.lesson06.teach.ba_aam_ma:
    title: همایون می‌گوید با چه کسی و چقدر
    gloss: 'همایون: با عمویم. یک هفته آنجا می‌مانیم.'
  prs.a2.unit20.lesson06.teach.w_bad_h:
    title: زرمینه درباره‌ی بعدش می‌پرسد
    gloss: 'زرمینه: بعدش چی؟ چه قصدی داری؟'
  prs.a2.unit20.lesson06.teach.sal_andh_qsd:
    title: همایون قصدش را می‌گوید و سؤال را برمی‌گرداند
    gloss: 'همایون: سال آینده قصد دارم یک کلاس بروم. تو چی؟'
  prs.a2.unit20.lesson06.teach.dr_mah_jwla:
    title: زرمینه جواب می‌دهد
    gloss: 'زرمینه: ماه ژوئیه کار می‌کنم. شاید بعدش پیش پدر و مادرم بروم.'
