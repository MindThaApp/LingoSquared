    gloss: حقوق
    note: '*حقوق* یعنی دستمزدی که ماهانه می‌گیرید.'
    example_gloss: حقوق این سمت سی‌هزار افغانی است.
  prs.a2.unit14.lesson01.teach.position_word:
    title: سمت / شغل
    gloss: سمت / شغل
    note: '*وظیفه* واژهٔ عمومی برای شغل یا سمت است و با *بست* (جای خالی رسمی استخدام) که رسمی‌تر است فرق دارد.'
    example_gloss: این سمت در یک دفتر است.
  prs.a2.unit14.lesson01.teach.resume_word:
    title: رزومه
    gloss: رزومه
    note: '*رزومه* واژه‌ای قرضی (از «resume») برای سابقهٔ کاری مکتوب است.'
    example_gloss: رزومه‌ام را برای مصاحبه‌کننده فرستادم.
  prs.a2.unit14.lesson01.teach.interview_word:
    title: مصاحبه
    gloss: مصاحبه
    note: '*مصاحبه* یعنی مصاحبهٔ کاری.'
    example_gloss: مصاحبهٔ لیمه فردا است.
