    note: '*از هفتهٔ آینده* یعنی «از هفتهٔ بعد»؛ *می‌توانم* یعنی «می‌توانم».'
  prs.a2.unit14.lesson02.teach.ask_salary:
    title: پرسیدن دربارهٔ حقوق
    gloss: حقوق این سمت چقدر است؟
    note: '*چقدر؟* یعنی «چه مقدار؟».'
