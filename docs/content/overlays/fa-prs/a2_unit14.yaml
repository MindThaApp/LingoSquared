    gloss: جای خالی استخدام / پست رسمی
    note: '*بست* واژه‌ای است که در آگهی‌های استخدام افغانستان برای پست رسمی به کار می‌رود و از *وظیفه* رسمی‌تر است.'
    example_gloss: این پست در یک دفتر است.
  prs.a2.unit14.lesson03.teach.requirements_word:
