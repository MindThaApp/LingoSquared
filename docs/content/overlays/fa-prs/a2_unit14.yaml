    gloss: شرایط
    note: '*شرایط* نیازمندی‌ها یا ضوابط یک سمت را فهرست می‌کند.'
    example_gloss: شرایط این پست مهارت کامپیوتر است.
  prs.a2.unit14.lesson03.teach.notice_text:
    title: یک آگهی استخدام
    gloss: 'برای این سمت، حداقل دو سال سابقهٔ کار لازم است. شرایط: مهارت کامپیوتر و زبان انگلیسی. حقوق: ماهانه سی‌هزار افغانی.'
    note: یک آگهی استخدام کوتاه و رسمی، به همان سبکی که این درس آموزش می‌دهد.
  prs.a2.unit14.lesson04.teach.turn01:
    title: مصاحبه‌کننده به لیمه خوش‌آمد می‌گوید
    gloss: مصاحبه‌کننده به او خوش‌آمد می‌گوید و از او می‌خواهد دربارهٔ تجربه‌اش بگوید.
    note: '*خوش آمدین* یک «خوش آمدید» رسمی است.'
  prs.a2.unit14.lesson04.teach.turn02:
    title: لیمه تجربه‌اش را می‌گوید
    gloss: او می‌گوید در این سمت سه سال سابقهٔ کار دارد.
    note: همان عبارتی که پیش‌تر برای گفتن سال‌های تجربه آمد.
  prs.a2.unit14.lesson04.teach.turn03:
    title: مصاحبه‌کننده دربارهٔ مهارت‌ها می‌پرسد
    gloss: مصاحبه‌کننده می‌پرسد مهارت‌های او چیست.
    note: '*مهارت‌های شما چیست؟* -- یعنی «مهارت‌هایتان چیست؟».'
  prs.a2.unit14.lesson04.teach.turn04:
    title: لیمه مهارت‌هایش را می‌گوید
    gloss: مهارت کامپیوتر و زبان انگلیسی دارد.
    note: دو مهارت را با *و* به هم وصل می‌کند.
  prs.a2.unit14.lesson04.teach.turn05:
    title: مصاحبه‌کننده دربارهٔ تاریخ شروع کار می‌پرسد
    gloss: مصاحبه‌کننده می‌پرسد که او از کی می‌تواند شروع کند.
    note: '*از کی می‌توانین شروع کنین؟* -- یعنی «از کی می‌توانید شروع کنید؟».'
  prs.a2.unit14.lesson04.teach.turn06:
    title: لیمه جواب می‌دهد و دربارهٔ حقوق می‌پرسد
    gloss: او از هفتهٔ آینده می‌تواند شروع کند و می‌پرسد حقوق این شغل چقدر است.
    note: عبارت *از هفتهٔ آینده می‌توانم شروع کنم* با سؤال دربارهٔ حقوق ترکیب شده است.
  prs.a2.unit14.lesson04.teach.turn07:
    title: مصاحبه‌کننده حقوق را می‌گوید
    gloss: مصاحبه‌کننده می‌گوید ماهی ۳۰ هزار افغانی.
    note: حقوق با آگهی استخدامی که قبلاً خوانده‌اید یکی است.
