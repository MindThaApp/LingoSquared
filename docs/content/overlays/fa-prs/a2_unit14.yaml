    title: پرسیدن «چند سال» با چند سال
    gloss: چند سال سابقهٔ کار دارید؟
    note: '*چند سال...؟* -- الگوی پرسش دربارهٔ مقدار، برای پرسیدن از سال‌های تجربه.'
    target_text: چند سال تجربه دارین؟ (چند سال سابقهٔ کار دارید؟)
