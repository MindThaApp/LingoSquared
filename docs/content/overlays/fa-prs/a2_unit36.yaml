  description: 'دری افغانستان در سطح پیش‌متوسطه: گفتن اینکه کاری را برای چه انجام می‌دهید. بیان هدف با «برای» و اسم یا مصدر، «برای اینکه» و «تا» با فعل التزامی، و شکل منفی (تا ... نکنم)، همراه با کارهای بیرون از خانه، یادگیری و پس‌انداز پول.'
