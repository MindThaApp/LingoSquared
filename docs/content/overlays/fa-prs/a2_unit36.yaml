  prs.a2.unit36.lesson02.for_that_subjunctive.exercise02.choose_subjunctive:
    instruction: 'فعلی را انتخاب کنید که جمله را کامل می‌کند: برای اینکه پول بگیرم، به بانک می‌روم.'
