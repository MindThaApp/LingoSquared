teaching:
  prs.a2.unit36.lesson01.errands_and_for.teach.friends:
    title: فروزان و عارف
    gloss: این فروزان است. این عارف است. آن‌ها دوست هستند.
    note: '*فروزان* و *عارف* دو دوست‌اند که در گفتگوها و مثال‌های این درس می‌آیند. فروزان یک زن است و عارف یک مرد.'
  prs.a2.unit36.lesson01.errands_and_for.teach.post:
    title: اداره‌ی پست
    gloss: اداره پست
    note: '*پُسته خانه* یعنی اداره پست. مردم برای فرستادن نامه یا بسته به آنجا می‌روند.'
    example_gloss: پستخانه نزدیکه.
  prs.a2.unit36.lesson01.errands_and_for.teach.letter:
    title: نامه
    gloss: نامه
    note: '*نامه* یعنی نامه. برای «نامه فرستادن» از *را* استفاده می‌شود: *نامه را می‌فرستم*.'
    example_gloss: نامه در اداره پست است.
  prs.a2.unit36.lesson01.errands_and_for.teach.bank:
    title: بانک
    gloss: بانک
    note: '*بانک* یعنی بانک. به آنجا می‌روید تا پول (*پول*) بگیرید یا پول بگذارید.'
    example_gloss: بانک در بازار است.
  prs.a2.unit36.lesson01.errands_and_for.teach.send:
    title: فرستادن
    gloss: فرستادن
    note: '*فرستادن* یعنی فرستادن. مصدری است که بعد از *برای* می‌آید: *برای فرستادن نامه* یعنی «برای فرستادن نامه».'
    example_gloss: فرستادن نامه آسان است.
  prs.a2.unit36.lesson01.errands_and_for.teach.shopping:
    title: خرید
    gloss: خرید
    note: '*خرید* یعنی چیزهایی که می‌خرید. *خرید دارم* یعنی «خرید دارم، باید خرید کنم».'
    example_gloss: امروز خرید زیادی دارم.
  prs.a2.unit36.lesson01.errands_and_for.teach.for_noun:
    title: 'برای + اسم: کاری را برای چه انجام می‌دهید'
    gloss: برای خرید به بازار می‌روم. برای کار به کابل می‌آیم. برای استراحت به خانه می‌روم.
    note: '*برای* را پیش از اسم بگذارید تا بگویید کاری را برای چه انجام می‌دهید: *برای خرید*، *برای کار*، *برای استراحت*. مکان همچنان با *به* می‌آید: *به بازار می‌روم*. در دری، اسمی که بعد از *برای* می‌آید خودش هدف را نشان می‌دهد.'
  prs.a2.unit36.lesson01.errands_and_for.teach.for_inf:
    title: 'برای + مصدر: برای انجام دادن کاری'
    gloss: برای فرستادن نامه به اداره پست می‌روم. برای خریدن نان به دکان می‌روم. برای گرفتن پول به بانک می‌روم.
    note: 'برای گفتن هدفِ کاری، مصدر را بعد از *برای* بگذارید: *فرستادن*، *خریدن*، *گرفتن*. مصدر به *ن* ختم می‌شود. چیزی که می‌فرستید، می‌خرید یا می‌گیرید بعد از مصدر می‌آید: *فرستادن نامه*، *خریدن نان*، *گرفتن پول*.'
  prs.a2.unit36.lesson01.errands_and_for.teach.order_question:
    title: هدف می‌تواند آخر جمله بیاید؛ پرسیدن «برای چه»
    gloss: به بانک می‌روم برای گرفتن پول. برای چه به بانک می‌روی؟
    note: 'هدف می‌تواند آخر جمله هم بیاید: *به بانک می‌روم برای گرفتن پول*. برای پرسیدن «برای چه»، بگویید *برای چه؟*: *برای چه به بانک می‌روی؟* یعنی «برای چه به بانک می‌روی؟» جواب را با *برای* و یک اسم یا مصدر می‌دهید.'
  prs.a2.unit36.lesson01.errands_and_for.teach.sentence:
    title: برای فرستادن نامه به اداره پست می‌روم
    gloss: برای فرستادن نامه به اداره پست می‌روم.
    note: 'این الگوی درس اول است: اول *برای* + مصدر، بعد مکان با *به*، و در آخر فعل.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.subj_form:
    title: 'فعل التزامی: ب + ریشهٔ حال + شناسه'
    gloss: که بخرم، که بروم، که بگیرم، که بفرستم، که بخوانم، که ببینم، که بیایم، که بیاورم
    note: 'فعل التزامی شکلی از فعل است که بعد از *برای اینکه* و *تا* می‌آید. آن را از ریشهٔ حال می‌سازید: *ب-* در ابتدا و شناسهٔ شخص در انتها. برای «من» شناسه *-م* است: *بخرم*، *بروم*، *بگیرم*. این همان شکلی است که در *می‌خواهم بروم* و *باید بیایم* هم می‌شناسید. دو شکل املای دیگری دارند و بهتر است همین‌طور یاد گرفته شوند: *بیایم* (از *آمدن*) و *بیاورم* (از *آوردن*).'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.subj_paradigm:
    title: شش شخص فعل التزامی
    gloss: که من بخرم، که تو بخری، که او بخرد، که ما بخریم، که شما بخرید (محترمانه یا جمع)، که آن‌ها بخرند
    note: 'شناسه‌ها این‌ها هستند: *-م، -ی، -د، -یم، -ین، -ند*. شناسهٔ «شما» (محترمانه یا جمع) *-ین* است، مثل همه‌جای این دوره. در وجه التزامی *می‌* نمی‌آید: *می‌خرم* (می‌خرم) را با *بخرم* (که بخرم) مقایسه کنید.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.for_that:
    title: 'برای اینکه + التزامی: تا من کاری بکنم'
    gloss: برای اینکه نان بخرم، به دکان می‌روم. برای اینکه پول بگیرم، به بانک می‌روم.
    note: '*برای اینکه* یعنی «برای این‌که» یا «تا». بعد از آن یک جملهٔ جدا با فعل التزامی خودش می‌آید و فعل شخص را نشان می‌دهد: *برای اینکه نان بخرم* یعنی «برای این‌که نان بخرم». جملهٔ اصلی می‌گوید چه کار می‌کنید. در فارسی ایران هم می‌شود گفت «برای این‌که نان بخرم»، و در دری هم همین ساختار با فعل صرف‌شده به کار می‌رود، نه با مصدر. جای دو جمله را می‌شود عوض کرد: *به دوکان می‌روم برای اینکه نان بخرم*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.more_verbs:
    title: مثال‌های بیشتر و فعل‌های دوکلمه‌ای
    gloss: برای اینکه نامه بفرستم، به اداره پست می‌روم. برای اینکه دوستم را ببینم، به کابل می‌روم. برای اینکه پس‌انداز کنم، پیاده می‌روم.
    note: 'همین قاعده برای همهٔ فعل‌ها کار می‌کند. در فعل‌های دوکلمه‌ای مثل *پس‌انداز کردن* فقط بخش فعلی تغییر می‌کند و *ب-* نمی‌آید: *پس‌انداز کنم*، *کار کنم*. چیزی را که می‌بینید یا می‌گیرید با *را* پیش از فعل بیاورید: *دوستم را ببینم*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.sentence:
    title: برای اینکه نان بخرم، به دکان می‌روم
    gloss: برای اینکه نان بخرم، به دکان می‌روم.
    note: 'با درس اول مقایسه کنید: *برای خریدن نان* (مصدر) و *برای اینکه نان بخرم* (بند التزامی) یک معنا دارند.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.ta:
    title: 'تا + التزامی: شکل کوتاه'
    gloss: به دکان می‌روم تا نان بخرم. به بانک می‌روم تا پول بگیرم. به اداره پست می‌روم تا نامه بفرستم.
    note: '*تا* شکل کوتاه‌شدهٔ *برای اینکه* است. بعد از جملهٔ اصلی می‌آید و پس از آن فعل التزامی می‌آید: *به دوکان می‌روم تا نان بخرم*. *تا* معنی‌های دیگری هم دارد، مثلاً «تا» به معنی «until» در *تا ساعت ده*. اگر بعد از آن فعل التزامی با *ب-* بیاید، یعنی «برای این‌که».'
  prs.a2.unit36.lesson03.ta_and_negative.teach.persons:
    title: 'شخص‌های دیگر: ما، او، آن‌ها'
    gloss: ما می‌رویم تا نان بخریم. او می‌رود تا نامه بفرستد. آن‌ها می‌روند تا پول بگیرند.
    note: 'وقتی فاعل یکی است، هر دو فعل یک شخص دارند: *می‌رویم* و *بخریم* هر دو به *-یم* (ما) ختم می‌شوند. شناسه‌های فعل التزامی *-م، -ی، -د، -یم، -ین، -ند* هستند، پس *بفرستد* یعنی «که او بفرستد» و *بگیرند* یعنی «که آن‌ها بگیرند».'
  prs.a2.unit36.lesson03.ta_and_negative.teach.negative:
    title: 'منفی: ن + ریشه'
    gloss: زود می‌روم تا دیر نرسم. برای اینکه دیر نرسم، زود می‌روم.
    note: 'برای گفتن چیزی که نمی‌خواهید، *ن-* را پیش از ریشه بگذارید و *ب-* را بردارید: *برسم* به *نرسم* تبدیل می‌شود. جملهٔ اصلی می‌گوید برای جلوگیری از آن چه می‌کنید: *زود می‌روم*.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.negative_two_word:
    title: منفی فعل‌های دوکلمه‌ای
    gloss: پولم را در بانک می‌گذارم تا آن را گم نکنم.
    note: 'در فعل دوکلمه‌ای، *ن-* بر بخش فعلی می‌آید: *گم کنم* به *گم نکنم* تبدیل می‌شود. *آن را* به پول برمی‌گردد.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.sentence:
    title: زود می‌روم تا دیر نرسم
    gloss: زود می‌روم تا دیر نرسم.
    note: '*تا دیر نرسم* چیزی را می‌گوید که نمی‌خواهید، و *زود می‌روم* کاری است که برایش می‌کنید.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.lesson:
    title: درس، درس خواندن
    gloss: درس، کلاس
    note: '*درس* یعنی درس یا کلاس. با *خواندن* یعنی درس خواندن: *درس خواندن*.'
    example_gloss: کلاس انگلیسی ساعت چهار است.
  prs.a2.unit36.lesson04.learning_and_saving.teach.exam:
    title: امتحان
    gloss: امتحان
    note: '*امتحان* یعنی امتحان. امتحان می‌دهید و نمره (*نمبر*) می‌گیرید.'
    example_gloss: امتحان فردا است.
  prs.a2.unit36.lesson04.learning_and_saving.teach.learn:
    title: یاد گرفتن
    gloss: یاد گرفتن
    note: '*یاد گرفتن* یعنی یاد گرفتن. *یاد* بخش اول و *گرفتن* فعل است. التزامی برای «من» *یاد بگیرم* است، با *ب-* پیش از *گیر*.'
    example_gloss: دارم انگلیسی یاد می‌گیرم.
  prs.a2.unit36.lesson04.learning_and_saving.teach.study:
    title: درس خواندن
    gloss: درس خواندن
    note: '*درس خواندن* یعنی درس خواندن. *می‌خوانم* یعنی «می‌خوانم» یا «درس می‌خوانم». درس مثل *درس می‌خوانم* پیش از فعل می‌ماند.'
    example_gloss: هر شب درس می‌خوانم.
  prs.a2.unit36.lesson04.learning_and_saving.teach.expensive:
    title: گران
    gloss: گران
    note: '*گران* یعنی گران. متضادش *ارزان* است.'
    example_gloss: کورس گران است.
  prs.a2.unit36.lesson04.learning_and_saving.teach.cheap:
    title: ارزان
    gloss: ارزان
    note: '*ارزان* یعنی ارزان. چیزهای *ارزان* به پس‌انداز پول کمک می‌کنند.'
    example_gloss: دوچرخه ارزان است.
  prs.a2.unit36.lesson04.learning_and_saving.teach.spend:
    title: خرج کردن پول
    gloss: خرج کردن (پول)
    note: '*خرج کردن* یعنی پول خرج کردن. در منفیِ این فعل دوکلمه‌ای *ن* بر *کردن* می‌آید: *خرج نکنم*.'
    example_gloss: من پول زیادی خرج نمی‌کنم.
  prs.a2.unit36.lesson04.learning_and_saving.teach.for_noun2:
    title: برای + اسم با واژه‌های یادگیری و پس‌انداز
    gloss: برای امتحان درس می‌خونم. برای کلاس پول پس‌انداز می‌کنم.
    note: 'الگوی درس اول با این واژه‌ها هم جواب می‌ده: *برای امتحان*، *برای کورس*. اسمی که بعد از *برای* می‌آید راه کوتاهی است برای گفتن اینکه این تلاش برای چیست.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.learn_clause:
    title: جمله‌های هدف درباره‌ی یادگیری
    gloss: برای اینکه انگلیسی یاد بگیرم، هر شب کتاب می‌خونم. برای اینکه تو امتحان نمره‌ی خوب بگیرم، خیلی درس می‌خونم.
    note: 'برای گفتن هدفِ درس خواندن، *برای اینکه* یا *تا* را با فعل التزامی به کار ببرید: *یاد بگیرم*، *نمبر خوب بگیرم* (نمره‌ی خوب بگیرم). جای دو بخشِ جمله را می‌شود عوض کرد.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.save_clause:
    title: جمله‌های هدف درباره‌ی پس‌انداز کردن
    gloss: پس‌انداز می‌کنم تا یک دوچرخه بخرم. کتاب ارزان می‌خرم تا پول زیادی خرج نکنم.
    note: در جمله‌های مربوط به پس‌انداز، بخش اصلی می‌گوید چه کار می‌کنید و بخش *تا* می‌گوید برای چه. منفیِ *خرج نکنم* چیزی را می‌گوید که نمی‌خواهید اتفاق بیفتد.
  prs.a2.unit36.lesson04.learning_and_saving.teach.sentence:
    title: پس‌انداز می‌کنم تا دوچرخه بخرم
    gloss: پول پس‌انداز می‌کنم تا یک دوچرخه بخرم.
    note: جمله‌ای کوتاه که اول کار را می‌گوید و آخر هدف را.
  prs.a2.unit36.lesson05.reading_and_listening.teach.narges:
    title: فوزیه
    gloss: فوزیه دوست فروزان است.
    note: '*فوزیه* دوست سومی است. او در این درس پیام را می‌نویسد. او همان فروزان نیست.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.fare:
    title: کرایه دادن
    gloss: کرایه می‌دم. کرایه نمی‌دم. برای اینکه کرایه ندم، پیاده می‌رم.
    note: '*کرایه دادن* یعنی پرداختن کرایه‌ی تاکسی یا اتوبوس. حال ساده‌اش *می‌دهم* است، منفی‌اش *نمی‌دهم* و منفیِ التزامی‌اش *ندهم* (که ندهم). *پیاده می‌روم* یعنی با پای پیاده می‌روم.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn01:
    title: فروزان می‌پرسد عارف کجا می‌رود
    gloss: عارف، امروز کجا می‌ری؟
    note: 'فروزان با فعل حال *می‌روی* می‌پرسد: *به کجا می‌روی؟* او دوست است، برای همین از *تو* استفاده می‌کند.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn02:
    title: عارف دو کار را می‌گوید
    gloss: اول می‌رم پست‌خانه تا این نامه را بفرستم. بعدش می‌رم بانک.
    note: 'کار اول هدف دارد: *تا این نامه را بفرستم*. *اول* و *بعد* دو کار را پشت سر هم می‌آورند.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn03:
    title: فروزان درباره‌ی بانک می‌پرسد
    gloss: تو بانک چه کار داری؟
    note: '*چه کار داری؟* می‌پرسد جایی چه کاری داری.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn04:
    title: عارف می‌گوید برای چه
    gloss: می‌رم پول بگیرم.
    note: پاسخ کوتاهِ *می‌روم تا پول بگیرم* هدف را با *تا* و فعل التزامی *بگیرم* می‌گوید.
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn05:
    title: فروزان می‌پرسد چطور می‌رود
    gloss: با ماشین می‌ری؟
    note: '*با موتر* یعنی با ماشین.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn06:
    title: عارف برای صرفه‌جویی در کرایه پیاده می‌رود
    gloss: نه، پیاده می‌رم که کرایه ندم.
    note: '*نخیر* یعنی نه. *تا کرایه ندهم* هدفِ منفی است: او پیاده می‌رود تا پول پس‌انداز کند.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.message:
    title: پیامی درباره‌ی پس‌انداز پول
    gloss: سلام فروزان. من هر ماه دو هزار افغانی پس‌انداز می‌کنم تا یک دوچرخه بخرم. برای اینکه کرایه ندم، می‌خوام با دوچرخه برم مدرسه. فردا می‌رم بانک تا پولم را بگیرم. فوزیه
    note: 'پیامی کوتاه با سه هدف: *تا یک بایسکل بخرم*، *برای اینکه کرایه ندهم* و *تا پولم را بگیرم*. فوزیه برای برنامه‌اش حال ساده‌ی *می‌روم* را همراه *فردا* به کار می‌برد.'
  prs.a2.unit36.lesson06.english_conversation.teach.give_book:
    title: 'دو فاعل متفاوت: من می‌دهم، تا تو خرج نکنی'
    gloss: کتابم را به تو می‌دم. کتابم را به تو می‌دم که تو پول خرج نکنی.
    note: 'دو فعل می‌توانند فاعل‌های متفاوت داشته باشند. در *کتابم را به تو می‌دهم تا پول خرج نکنی* دهنده «من» است (*می‌دهم*) و کسی که خرج نمی‌کند «تو» است (*نکنی*). فعل التزامی با فاعل خودش هماهنگ می‌شود: برای «تو» پایانِ *-ی*.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn01:
    title: عارف می‌پرسد فروزان چرا هر شب کتاب می‌خواند
    gloss: فروزان، چرا هر شب کتاب می‌خونی؟
    note: '*می‌خوانی* یعنی تو می‌خوانی. *چرا* دلیل یا هدف می‌پرسد.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn02:
    title: فروزان می‌گوید برای چه درس می‌خواند
    gloss: برای اینکه انگلیسی یاد بگیرم.
    note: 'پاسخی کوتاه که فقط جمله‌ی هدف است: *برای اینکه انگلیسی یاد بگیرم*. بخش اصلی حذف شده چون پرسش آن را گفته است.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn03:
    title: عارف هدفِ عمیق‌تر را می‌پرسد
    gloss: برای چی؟
    note: '*برای چه؟* هدفِ بعدی را که پشت هدف اول است می‌پرسد.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn04:
    title: فروزان هدفِ بعدی را می‌گوید
    gloss: که تو امتحان نمره‌ی خوب بگیرم.
    note: '*تا در امتحان نمبر خوب بگیرم* خودش یک جمله‌ی *تا* است. *نمبر* یعنی نمره.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn05:
    title: عارف هم می‌خواهد درس بخواند
    gloss: من هم می‌خوام انگلیسی بخونم، ولی کلاسش گرونه.
    note: '*می‌خواهم انگلیسی بخوانم* بعد از *می‌خواهم* فعل التزامی *بخوانم* را به کار می‌برد.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn06:
    title: فروزان کتابش را پیشنهاد می‌دهد
    gloss: من کتابم را به تو می‌دم که پول خرج نکنی.
    note: '*تا پول خرج نکنی* فاعلی متفاوت از فعل اصلی دارد: کتاب را «من» می‌دهم، پول را «تو» خرج نمی‌کنی.'
