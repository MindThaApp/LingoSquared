course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستان در سطح پیش‌متوسطه: صحبت دربارهٔ چیزی که در صورت برقرار بودن یک شرط اتفاق می‌افتد یا خواهد افتاد، مثلاً اگر فردا باران ببارد یا اگر رسید را داشته باشید. «اگر» به‌علاوهٔ فعل التزامی، با جملهٔ اصلی در زمان حال یا امر؛ برنامه‌های مربوط به هوا و قوانین فروشگاه.'
