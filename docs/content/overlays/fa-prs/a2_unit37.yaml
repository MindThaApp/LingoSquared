teaching:
  prs.a2.unit37.lesson01.teach.weather:
    title: آب‌وهوا
    gloss: هوا
    note: '*هوا* هم به معنی وضع هوا است و هم به معنی هوای تنفس. *هوا خوب است* یعنی هوا خوب است و *هوا بد است* یعنی هوا بد است.'
    example_gloss: امروز هوا خوب است.
  prs.a2.unit37.lesson01.teach.cold:
    title: سرد
    gloss: سرد
    note: '*سرد* یعنی سرد. متضادش *گرم* است که قبلاً یاد گرفته‌اید.'
    example_gloss: امروز هوا سرد است.
  prs.a2.unit37.lesson01.teach.outside:
    title: بیرون
    gloss: بیرون
    note: '*بیرون* یعنی بیرون. *بیرون می‌روم* یعنی می‌روم بیرون و *بیرون از خانه* یعنی بیرون خانه.'
    example_gloss: من بیرون خانه هستم.
  prs.a2.unit37.lesson01.teach.if_pattern:
    title: 'اگر: شرط واقعی'
    gloss: اگر هوا خوب باشد، به پارک می‌روم. اگر باران ببارد، در خانه می‌مانم.
    note: '*اگر* یعنی «اگر». شرطی را شروع می‌کند که ممکن است واقعاً اتفاق بیفتد و فعل شرط به شکل التزامی می‌آید: *باشد*، *ببارد*. این همان شکلی است که بعد از *باید* می‌بینید: فعل با *ب-* پیش از ریشهٔ حال (*ببارد*) و برای *بودن* فقط *باشد* بدون *ب-*. جملهٔ اصلی می‌گوید چه اتفاقی می‌افتد و با حال ساده با *می‌* ساخته می‌شود: *به پارک می‌روم*. حال با *می‌* آینده را هم می‌رساند، پس شکل خاصی برای آینده لازم نیست. بعد از شرط ویرگول بگذارید.'
  prs.a2.unit37.lesson01.teach.paradigm_ro:
    title: شکل التزامی رفتن بعد از اگر
    gloss: اگر بروم، اگر بروی، اگر برود، اگر برویم، اگر بروید (رسمی یا جمع)، اگر بروند
    note: 'ریشهٔ حال فعل *رفتن* «*رو*» است. *ب-* را جلوی آن می‌گذارید و شناسه‌ها را اضافه می‌کنید: *بروم* (من)، *بروی* (تو، برای دوست)، *برود* (او)، *برویم* (ما)، *بروین* (شما، رسمی یا جمع)، *بروند* (آن‌ها). همهٔ فعل‌ها همین شش شناسه را می‌گیرند: *-م، -ی، -د، -یم، -ین، -ند*. شناسهٔ «شما» (رسمی یا جمع) *-ین* است. شکل‌های با *-ید* هم فهمیده می‌شوند، ولی در این دوره *-ین* نوشته می‌شود.'
  prs.a2.unit37.lesson01.teach.snow_phrase:
    title: اگر برف ببارد، بیرون نمی‌روم
    gloss: اگر برف ببارد، بیرون نمی‌روم.
    note: 'جملهٔ اصلی می‌تواند منفی باشد. *نمی‌* را جلوی ریشهٔ حال بگذارید: *نمی‌روم* یعنی نمی‌روم. شرط تغییری نمی‌کند: *اگر برف ببارد* یعنی اگر برف بیاید.'
  prs.a2.unit37.lesson01.teach.cold_phrase:
    title: اگر هوا سرد باشد، در خانه می‌مانم
    gloss: اگر هوا سرد باشد، در خانه می‌مانم.
    note: '*اگر هوا سرد باشد* یعنی اگر هوا سرد باشد. وقتی *هوا* با یک صفت می‌آید، شرط همیشه با *باشد* تمام می‌شود.'
  prs.a2.unit37.lesson02.teach.weekend:
    title: آخر هفته
    gloss: آخر هفته
    note: '*آخر هفته* یعنی آخر هفته. *آخر* یعنی پایان و *هفته* همان هفته است.'
    example_gloss: آخر هفته به پارک می‌رویم.
  prs.a2.unit37.lesson02.teach.tonight:
    title: امشب
    gloss: امشب، همین شب
    note: '*امشب* یعنی امشب. قید زمان است، پس جملهٔ اصلی با *می‌* می‌تواند آن را بگیرد: *امشب می‌روم* یعنی امشب می‌روم.'
    example_gloss: امشب به سینما می‌روم.
  prs.a2.unit37.lesson02.teach.formation:
    title: شکل التزامی فعل‌های دیگر
    gloss: که بخرم، که بگیرم، که بدهم، که بیایم، که بمانم، که بخورم
    note: 'قاعدهٔ *رفتن* برای همهٔ فعل‌ها کار می‌کند: ریشهٔ حال با *ب-* در ابتدا و بعد شناسه‌ها. *خر* می‌شود *بخرم* (می‌خرم)، *گیر* می‌شود *بگیرم* (بگیرم)، *ده* می‌شود *بدهم* (بدهم)، *مان* می‌شود *بمانم* (بمانم)، *خور* می‌شود *بخورم* (بخورم). *آمدن* را باید جدا یاد بگیرید: التزامی آن *بیایم، بیایی، بیاید، بیاییم، بیایین، بیایند* است، با یک *ی* اضافه. بعد از *اگر* هر کدام یعنی اگر بخرم، اگر بگیرم و غیره.'
  prs.a2.unit37.lesson02.teach.be_have:
    title: شکل التزامی بودن و داشتن
    gloss: که باشم، که باشی، که باشد، که باشیم، که باشید (رسمی یا جمع)، که باشند
    note: '*باشم، باشی، باشد، باشیم، باشین، باشند* شش شکل التزامی *بودن* هستند و *ب-* نمی‌گیرند. برای گفتن «اگر داشته باشم»، دری از *داشته باشم* استفاده می‌کند: صفت مفعولی *داشته* به‌اضافهٔ *باشم*. پس *اگر وقت داشته باشم* یعنی اگر وقت داشته باشم و *اگر پول داشته باشی* یعنی اگر پول داشته باشی. برای موقعیت احتمالی در آینده، این شکل معمول است.'
  prs.a2.unit37.lesson02.teach.money_phrase:
    title: اگر پول داشته باشم، کتاب می‌خرم
    gloss: اگر پول داشته باشم، کتاب می‌خرم.
    note: '*اگر پول داشته باشم* یعنی اگر پول داشته باشم. جملهٔ اصلی حال ساده است: *کتاب می‌خرم* یعنی کتاب می‌خرم یا کتاب خواهم خرید.'
  prs.a2.unit37.lesson02.teach.negative:
    title: 'منفی: ن به جای ب'
    gloss: اگر نروم، اگر نیایم، اگر نخرم، اگر نباشد، اگر نبارد
    note: 'برای منفی کردن شرط، *ب-* را با *ن-* عوض کنید: *بروم* می‌شود *نروم*، *بخرم* می‌شود *نخرم* و *بیایم* می‌شود *نیایم*. *باشد* و *ببارد* هم *نباشد* و *نبارد* می‌شوند. پس *اگر باران نبارد* یعنی اگر باران نبارد.'
  prs.a2.unit37.lesson02.teach.friend_phrase:
    title: اگر دوستم بیاید، با هم فوتبال بازی می‌کنیم
    gloss: اگر دوستم بیاید، با هم فوتبال بازی می‌کنیم.
    note: 'در شرط *بیاید* آمده است (التزامی *آمدن* برای او). جملهٔ اصلی این بار «ما» است: *می‌کنیم* یعنی می‌کنیم یا بازی می‌کنیم و *می‌رویم* یعنی می‌رویم. *با هم* یعنی با هم.'
  prs.a2.unit37.lesson02.teach.norain_phrase:
    title: اگر باران نبارد، به پارک می‌رویم
    gloss: اگر باران نبارد، به پارک می‌رویم.
    note: '*اگر باران نبارد* یعنی اگر باران نبارد. جملهٔ اصلی مثبت است و *می‌رویم* یعنی می‌رویم.'
  prs.a2.unit37.lesson02.teach.time_phrase:
    title: اگر وقت داشته باشم، امشب به سینما می‌روم
    gloss: اگر وقت داشته باشم، امشب به سینما می‌روم.
    note: شرط دربارهٔ وقت داشتن با *داشته باشم* ساخته می‌شود. قید *امشب* در جملهٔ اصلی نشان می‌دهد که برنامه برای امشب است.
  prs.a2.unit37.lesson03.teach.clothes:
    title: لباس‌ها
    gloss: لباس
    note: '*لباس* یعنی لباس یا یک تکه لباس. *لباس گرم* یعنی لباس گرم، برای هوای سرد.'
    example_gloss: لباس گرم دارم.
  prs.a2.unit37.lesson03.teach.imperative:
    title: 'امر: بعد از اگر، جملهٔ اصلی می‌تواند دستور باشد'
    gloss: بگیر (دوست، رسمی یا جمع)، بپوش، بیا، تلفن کن
    note: 'جملهٔ اصلی می‌تواند دستور هم باشد. برای دوست، دستور یعنی *ب-* به‌اضافهٔ ریشهٔ حال بدون شناسه: *بگیر*، *بپوش*، *بیا*. برای فرد رسمی یا چند نفر، *-ین* اضافه می‌شود: *بگیرین، بپوشین، بیایین*. فعل‌های دوکلمه‌ای *ب-* نمی‌گیرند: *تیلفون کن* (دوست)، *تیلفون کنین* (رسمی یا جمع). پس *اگر باران ببارد، چتر بگیر* یعنی اگر باران بیاید، چتر بردار.'
  prs.a2.unit37.lesson03.teach.neg_imperative:
    title: امر منفی
    gloss: نرو، نیا، نکن (دوست، رسمی یا جمع)
    note: 'امر منفی به جای *ب-* از *ن-* استفاده می‌کند: *نرو*، *نیا*، *نکن*. شکل رسمی یا جمع *-ین* می‌گیرد: *نروین، نیایین، نکنین*. برای مثال *اگر باران ببارد، بیرون نرو* یعنی اگر باران بیاید، بیرون نرو.'
  prs.a2.unit37.lesson03.teach.present_state:
    title: 'حال در شرط: آنچه همین حالا درست است'
    gloss: اگر وقت داری، بیا. اگر سردت است، لباس گرم بپوش.
    note: 'وقتی شرط چیزی است که همین الان درست است، می‌توان به جای التزامی از حال ساده استفاده کرد: *اگر وقت داری* (اگر الان وقت داری) و *اگر سردت است* (اگر سردت است). *اگر وقت داشته باشی* هم درست است و بیشتر شبیه موقعیتی احتمالی در آینده است. کسی که سردش است می‌گوید *سردم است*؛ *سردت است* یعنی تو سردت است.'
  prs.a2.unit37.lesson03.teach.rain_umbrella:
    title: اگر باران ببارد، چتر بگیر
    gloss: اگر باران ببارد، چتر بردار.
    note: 'شرط، التزامی *ببارد* است و جملهٔ اصلی دستور به یک دوست است: *بگیر*.'
  prs.a2.unit37.lesson03.teach.late_phone:
    title: اگر دیر شوی، تیلفون کن
    gloss: اگر دیرت شد، تلفن کن.
    note: '*دیر شوی* التزامی *دیر شدن* برای تو (دوست) است: اگر دیر بشوی. *تیلفون کن* دستور به یک دوست است.'
  prs.a2.unit37.lesson03.teach.problem_phone:
    title: اگر مشکلی دارین، تیلفون کنین
    gloss: اگر مشکلی دارید، تلفن کنید.
    note: 'وقتی با مشتری یا چند نفر صحبت می‌کنید، در هر دو جمله *-ین* می‌آید: *دارین* (دارید) و *کنین* (تلفن کنید). یک فروشگاه این را در اطلاعیه می‌نویسد.'
  prs.a2.unit37.lesson04.teach.item:
    title: کالا
    gloss: کالا، جنس
    note: '*کالا* یعنی جنسی که از مغازه می‌خرید.'
    example_gloss: این کالا خراب است.
  prs.a2.unit37.lesson04.teach.customer:
    title: مشتری
    gloss: مشتری
    note: '*مشتری* یعنی مشتری. جمعش *مشتریان* است، با پایانهٔ *-ان* برای آدم‌ها.'
    example_gloss: مشتری در مغازه است.
  prs.a2.unit37.lesson04.teach.receipt:
    title: رسید
    gloss: رسید
    note: '*رسید* یعنی رسید خرید، کاغذی که نشان می‌دهد چه پرداخته‌اید. شبیه گذشتهٔ *رسیدن* (او رسید) است، اما در مغازه یعنی رسید.'
    example_gloss: رسید همراهتان است؟
  prs.a2.unit37.lesson04.teach.exchange:
    title: تبدیل کردن
    gloss: عوض کردن
    note: '*عوض کردن* یعنی چیزی را عوض کردن یا تعویض کردن. چیز و بعد *را* پیش از آن می‌آید: *کالا را عوض می‌کنم* یعنی کالا را عوض می‌کنم.'
    example_gloss: می‌خواهم کتاب را عوض کنم.
  prs.a2.unit37.lesson04.teach.give_back:
    title: پس دادن
    gloss: پس دادن، برگرداندن، بازپرداخت
    note: '*پس دادن* یعنی برگرداندن. مغازه‌ای که پول را برمی‌گرداند می‌گوید *پول را پس می‌دهیم* (پول را پس می‌دهیم).'
    example_gloss: پول را پس می‌دهیم.
  prs.a2.unit37.lesson04.teach.modal:
    title: 'توانستن: می‌توانم'
    gloss: می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانید (رسمی یا جمع)، می‌توانند
    note: '*می‌توانم* یعنی می‌توانم و همیشه با *می‌* و نیم‌فاصله نوشته می‌شود. شش شکل آن *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند* است. فعل بعدی التزامی و با همان شخص است: *می‌توانیم عوض کنیم* یعنی می‌توانیم عوض کنیم. برای منفی، *ن* جلوی آن بگذارید: *نمی‌توانیم* یعنی نمی‌توانیم.'
  prs.a2.unit37.lesson04.teach.shop_if:
    title: قوانین مغازه با اگر
    gloss: اگر کالا خراب باشد، آن را عوض می‌کنیم. اگر رسید همراهتان باشد، می‌توانیم کالا را عوض کنیم.
    note: 'مغازه‌ها با *اگر* می‌گویند در هر حالت چه می‌کنند. شرط *باشد* دارد (*خراب باشد*، *همراه‌تان باشد*) و جملهٔ اصلی حال ساده است (*عوض می‌کنیم*) یا *می‌توانیم* با التزامی. *همراه‌تان باشد* یعنی همراهتان باشد (تحت‌اللفظی: همراه شما باشد).'
  prs.a2.unit37.lesson04.teach.no_receipt:
    title: 'قانونی با منفی: بدون رسید'
    gloss: اگر رسید نداشته باشید، نمی‌توانیم پول را پس بدهیم.
    note: '*نداشته باشین* منفی *داشته باشین* (اگر داشته باشید) است. جملهٔ اصلی هم منفی است: *نمی‌توانیم پول را پس بدهیم* یعنی نمی‌توانیم پول را پس بدهیم. مغازه هنگام صحبت با مشتری از *-ین* استفاده می‌کند.'
  prs.a2.unit37.lesson04.teach.seven_days:
    title: اگر تا هفت روز بیاورین، کالا را عوض می‌کنیم
    gloss: اگر تا هفت روز بیاورید، کالا را عوض می‌کنیم.
    note: '*تا هفت روز* یعنی تا هفت روز. *بیاورین* التزامی *آوردن* برای شما (رسمی یا جمع) است: اگر بیاورید.'
  prs.a2.unit37.lesson05.teach.notice:
    title: اطلاعیهٔ یک مغازه
    gloss: اطلاعیهٔ مغازه برای مشتریان دربارهٔ عوض کردن کالا و پس گرفتن پول.
    note: 'این همان نوع اطلاعیه‌ای است که در مغازه می‌بینید. به شرط‌ها دقت کنید: مغازه چه می‌کند اگر رسید داشته باشید، اگر کالا خراب باشد، اگر رسید نداشته باشید و اگر مشکلی داشته باشید. هر قانون یک جملهٔ *اگر* به‌اضافهٔ یک جملهٔ اصلی است.'
  prs.a2.unit37.lesson05.teach.weather_turn01:
    title: زینب دربارهٔ فردا می‌پرسد
    gloss: شاهین، فردا چه کار می‌کنی؟
    note: زینب با پرسش *فردا چه می‌کنی؟* (فردا چه کار می‌کنی؟) از دوستش دربارهٔ برنامه‌هایش می‌پرسد و برای آینده از حال استفاده می‌کند.
  prs.a2.unit37.lesson05.teach.weather_turn02:
    title: شاهین دو برنامه می‌گوید
    gloss: اگر هوا خوب باشد، با دوستانم به پارک می‌روم. اگر باران ببارد، در خانه می‌مانم.
    note: شاهین دو شرط با دو برنامه دارد. هر دو شرط التزامی دارند (*باشد، ببارد*) و هر دو جملهٔ اصلی حال (*می‌روم، می‌مانم*).
  prs.a2.unit37.lesson05.teach.weather_turn03:
    title: زینب شاید بیاید
    gloss: اگر وقت داشته باشم، من هم می‌آیم.
    note: '*داشته باشم* التزامی برای «اگر داشته باشم» است. *من هم* یعنی من هم.'
  prs.a2.unit37.lesson05.teach.weather_turn04:
    title: شاهین او را دعوت می‌کند
    gloss: عالی! اگر بیایی، فوتبال هم بازی می‌کنیم.
    note: '*بیایی* التزامی *آمدن* برای تو (دوست) است. جملهٔ اصلی «ما» را می‌گوید: *می‌کنیم*.'
  prs.a2.unit37.lesson05.teach.weather_turn05:
    title: زینب دربارهٔ ساعت می‌پرسد
    gloss: ساعت چند می‌روید؟
    note: '*می‌روین* یعنی می‌روید (رسمی یا جمع): زینب دربارهٔ کل گروه می‌پرسد.'
  prs.a2.unit37.lesson05.teach.weather_turn06:
    title: شاهین می‌خواهد تلفن کند
    gloss: ساعت ده. اگر دیرت شد، تلفن کن.
    note: شرط، *دیر شوی* است و جملهٔ اصلی، فعل امر *تیلفون کن*.
  prs.a2.unit37.lesson05.teach.weather_turn07:
    title: زینب خودش پیشنهاد می‌دهد
    gloss: باشه. اگه باران ببارد، تلفن می‌کنم.
    note: 'زینب هم *اگر* را با *ببارد* به کار می‌برد و جملهٔ اصلی را در زمان حال می‌آورد: *تیلفون می‌کنم*.'
  prs.a2.unit37.lesson06.teach.shop_turn01:
    title: فریبا مشکلش را توضیح می‌دهد
    gloss: ببخشید، دیروز از این مغازه یک چتر خریدم. چتر خراب است.
    note: فریبا مؤدبانه با *ببخشین* شروع می‌کند. می‌گوید چتر *خراب* است و آن را *دیروز* خریده است.
  prs.a2.unit37.lesson06.teach.shop_turn02:
    title: فروشنده شرطی را مطرح می‌کند
    gloss: اگر رسید همراهتان باشد، می‌توانیم آن را عوض کنیم.
    note: 'فروشگاه همان الگوی اطلاعیه را به کار می‌برد: شرطی با *باشد* و *می‌توانیم* همراه با وجه التزامی. *آن را* یعنی «آن را»، به معنی همان کالا.'
  prs.a2.unit37.lesson06.teach.shop_turn03:
    title: فریبا رسید را دارد
    gloss: بله، این هم رسید.
    note: '*رسید این است* یعنی «این هم رسید». *بلی* یعنی «بله».'
  prs.a2.unit37.lesson06.teach.shop_turn04:
    title: فروشنده دو انتخاب پیشنهاد می‌دهد
    gloss: بسیار خوب. اگر چتر دیگری می‌خواهید، بردارید. اگر نمی‌خواهید، پولتان را پس می‌دهیم.
    note: 'دو شرط، هر دو با زمان حال: *اگر ... می‌خواهین* (اگر می‌خواهید) با فعل امر *بگیرین*، و *اگر نمی‌خواهین* (اگر نمی‌خواهید) با *پس می‌دهیم*.'
  prs.a2.unit37.lesson06.teach.shop_turn05:
    title: فریبا انتخاب می‌کند
    gloss: من چتر دیگری برمی‌دارم. ممنون.
    note: 'فریبا با زمان حال جواب می‌دهد: *می‌گیرم* یعنی «برمی‌دارم» و نشان می‌دهد تصمیمش را گرفته است.'
  prs.a2.unit37.lesson06.teach.want:
    title: اگر چتر دیگری نمی‌خواهید، پولتان را پس می‌دهیم
    gloss: اگر چتر دیگری نمی‌خواهید، پولتان را پس می‌دهیم.
    note: 'برای خواستهٔ فعلی، شرط می‌تواند با زمان حال ساده بیاید: *می‌خواهین* یعنی «می‌خواهید» و *نمی‌خواهین* یعنی «نمی‌خواهید». جملهٔ اصلی می‌گوید فروشگاه چه کار می‌کند.'
