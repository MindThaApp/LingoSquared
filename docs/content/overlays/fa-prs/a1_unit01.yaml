course:
  title: دری افغانستان A1
  description: دریِ افغانستان برای مبتدی‌ها با تمرکز بر خواندن خط فارسی-عربی، فهم گفتار روزمرهٔ افغانستانی، احوال‌پرسی‌های طولانی و یک آشنایی محترمانه در محل کار در کابل.
units:
  prs.a1.unit01.greetings:
    title: سلام و اولین دیدار
lessons:
  prs.a1.unit01.lesson01.script_ramp:
    title: خواندن حروفی که در این درس آمده‌اند
  prs.a1.unit01.lesson02.everyday_greetings:
    title: احوال‌پرسی‌های روزمره
  prs.a1.unit01.lesson03.time_and_farewells:
    title: سلام و خداحافظی در ساعت‌های مختلف
  prs.a1.unit01.lesson04.formal_informal_small_talk:
    title: گفتگوی کوتاه مؤدبانه و صمیمی
  prs.a1.unit01.lesson05.afghan_hospitality:
    title: پرسیدن از خانواده و احترام به مهمان
  prs.a1.unit01.lesson06.first_meeting_dialogue:
    title: شروع اولین روز کار در یک دفتر در کابل
teaching:
  prs.a1.unit01.lesson01.teach.alef_be_te_dal:
    title: حروف ا، ب، ت و د
    gloss: a/ā، b، t و d
    note: دری از راست به چپ نوشته می‌شود. د به حرف بعد از خودش (سمت چپ) وصل نمی‌شود.
  prs.a1.unit01.lesson01.teach.re_ze:
    title: حروف ر و ز
    gloss: r و z
    note: هیچ‌کدام از این دو حرف به حرف بعدی وصل نمی‌شوند.
  prs.a1.unit01.lesson01.teach.sin_shin_sad:
    title: حروف س، ش و ص
    gloss: s، sh و s
    note: س و ص هر دو در دریِ معمولی صدای s می‌دهند؛ ش صدای sh دارد.
  prs.a1.unit01.lesson01.teach.jim_che_he_khe:
    title: حروف ج، چ، ح و خ
    gloss: j، ch، h و kh
    note: چ همان ch است. خ صدایی است که معمولاً kh نوشته می‌شود.
  prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf:
    title: حروف ع، غ، ف و ق
    gloss: ʿ، gh، f و q
    note: تلفظ دقیق غ و ق بین دری‌زبان‌ها فرق می‌کند؛ در املا آن‌ها را از هم جدا نگه دارید.
  prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim:
    title: حروف ک، گ، ل و م
    gloss: k، g، l و m
    note: ک همان کاف فارسی است؛ در دری هم برای k همین شکل به کار می‌رود. ل و م از دو طرف به حروف کناری وصل می‌شوند.
  prs.a1.unit01.lesson01.teach.nun_vav_he_ye:
    title: حروف ن، و، ه و ی
    gloss: n، w/v/o/u، h و y / i بلند
    note: ی همان «ی» فارسی است و برای y و مصوت بلند ee به کار می‌رود. و می‌تواند صامت (w/v) یا مصوت بلند (o/oo) باشد.
  prs.a1.unit01.lesson01.teach.connected_salam:
    title: خواندن یک کلمهٔ وصل‌شده
    gloss: سلام
    note: حروف به هم وصل می‌شوند و سلام را می‌سازند. مصوت‌های کوتاه معمولاً نوشته نمی‌شوند.
    example_gloss: سلام! من کریم هستم.
  prs.a1.unit01.lesson02.teach.salam_alaikum:
    title: یک سلام محترمانهٔ روزمره
    gloss: سلام؛ درود بر شما
    note: سلام علیکم در افغانستان رایج است و هم برای دیدار با آشنایان و هم برای دیدار محترمانه مناسب است.
  prs.a1.unit01.lesson02.teach.wa_alaikum_salam:
    title: جواب دادن به سلام
    gloss: و بر شما هم سلام
    note: وعلیکم سلام معمولاً جواب سلام علیکم است. شکل‌هایی که السلام دارند هم پذیرفته می‌شوند.
  prs.a1.unit01.lesson02.teach.salam:
    title: یک سلام کوتاه
    gloss: سلام
    note: سلام یک احوال‌پرسی کوتاه و منعطف است.
    example_gloss: سلام، حالتان چطور است؟
  prs.a1.unit01.lesson02.teach.khosh_amadeed:
    title: خوش آمدید
    gloss: خوش آمدید
    note: خوش آمدین خوشامدگویی محترمانهٔ محاوره‌ای است و هم برای یک نفر و هم برای چند نفر به کار می‌رود.
  prs.a1.unit01.lesson02.teach.tashakor:
    title: متشکرم
    gloss: متشکرم
    note: تشکر در این دوره شکل ترجیحی دریِ افغانستان است. ممنون و ممنونم هم فهمیده می‌شوند و شکل‌های فرعی‌اند.
    example_gloss: خیلی متشکرم.
  prs.a1.unit01.lesson02.teach.khahesh:
    title: یک جواب رسمی به تشکر
    gloss: خواهش می‌کنم
    note: خواهش می‌کنم جواب مؤدبانه‌ای است که در همهٔ مناطق فارسی‌زبان رایج است. به‌عنوان کاربرد محاوره‌ای مخصوص افغانستان معرفی نمی‌شود.
  prs.a1.unit01.lesson02.teach.khoda_hafez:
    title: خداحافظی
    gloss: خداحافظ
    note: خدا حافظ خداحافظی رایج در دریِ افغانستان است و اغلب دو کلمه‌ای نوشته می‌شود.
  prs.a1.unit01.lesson03.teach.sobh_bekheyr:
    title: سلام صبح
    gloss: صبح بخیر
    note: صبح بخیر صبح‌ها گفته می‌شود.
  prs.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: سلام روزانه
    gloss: روز بخیر
    note: روز بخیر یک سلام مؤدبانهٔ روزانه است.
  prs.a1.unit01.lesson03.teach.asr_bekheyr:
    title: سلام آخر روز
    gloss: عصر بخیر
    note: عصر بخیر برای ساعت‌های پایانی روز مناسب است.
  prs.a1.unit01.lesson03.teach.shab_bekheyr:
    title: عبارتی برای شب
    gloss: شب بخیر
    note: شب بخیر معمولاً برای پایان دادن به یک عصر گفته می‌شود، نه برای شروع یک دیدار معمولی در طول روز.
  prs.a1.unit01.lesson03.teach.rooz_khosh:
    title: یک خداحافظی مؤدبانهٔ روزانه
    gloss: روز خوبی داشته باشید
    note: روز خوش خداحافظی مؤدبانه و تا حدی رسمی است که در مناطق مختلف رایج است و محاوره‌ای مخصوص افغانستان نیست.
  prs.a1.unit01.lesson03.teach.be_omide_didar:
    title: تا دیدار بعدی
    gloss: به امید دیدار دوباره
    note: به امید دیدار خداحافظی گرم ولی محترمانه‌ای است.
  prs.a1.unit01.lesson04.teach.polite_question:
    title: مؤدبانه حال کسی را بپرسید
    gloss: حال شما چطوره؟
    note: استین شکل محاوره‌ای مؤدبانهٔ رایج در دریِ افغانستان است که با شما به کار می‌رود.
  prs.a1.unit01.lesson04.teach.informal_question:
    title: از هم‌سن‌وسال یا دوست نزدیک حال بپرسید
    gloss: حال شما چطوره؟
    note: تو و استی صمیمی و مفرد هستند؛ این ترکیب را خودکار برای بزرگ‌تر یا آشنای تازه به کار نبرید.
  prs.a1.unit01.lesson04.teach.good_answer:
    title: بگویید که حالتان خوب است
    gloss: خوبم، ممنون.
    note: استم یعنی هستم. این شکل محاوره‌ای دریِ افغانستان است که در سراسر این دوره به کار می‌رود.
  prs.a1.unit01.lesson04.teach.jor_answer:
    title: بگویید که سالم و خوب هستید
    gloss: خوبم.
    note: جور معنای خوب و سالم بودن را دارد و در احوال‌پرسی‌های افغانستانی زیاد شنیده می‌شود.
  prs.a1.unit01.lesson04.teach.not_bad:
    title: یک جواب محتاطانه
    gloss: بد نیستم.
    note: بد نیستم جواب خنثی است.
  prs.a1.unit01.lesson04.teach.and_you:
    title: سؤال را برگردانید
    gloss: شما چطور؟
    note: و شما؟ گفتگو را محترمانه و کوتاه نگه می‌دارد.
  prs.a1.unit01.lesson04.teach.everyone_well:
    title: احوال‌پرسی را ادامه بدهید
    gloss: همه خوب‌اند؟
    note: در احوال‌پرسی افغانستانی ممکن است پیش از شروع کار، پرسیدن از اهل خانه هم ادامه پیدا کند.
  prs.a1.unit01.lesson05.teach.family_well:
    title: از خانوادهٔ کسی بپرسید
    gloss: خانواده‌تان خوب است؟
    note: پرسیدن از خانواده بخش رایجی از احوال‌پرسی طولانی افغانستانی است. در این دوره شکل ملکی به صورت فامیل‌تان نوشته می‌شود.
  prs.a1.unit01.lesson05.teach.household_well:
    title: از اهل خانه بپرسید
    gloss: همهٔ اهل خانه خوب‌اند؟
    note: اهل خانه به‌طور جمعی به اعضای خانواده اشاره دارد.
  prs.a1.unit01.lesson05.teach.everyone_well:
    title: به سؤال دربارهٔ خانواده جواب بدهید
    gloss: خدا را شکر، همه خوب‌اند.
    note: شکر در اینجا شکل کوتاه‌شدهٔ سپاسگزاری است، نه شکر به معنای خوراکی.
  prs.a1.unit01.lesson05.teach.zenda_bashin:
    title: یک جواب گرم و مؤدبانه بدهید
    gloss: زنده باشید؛ ممنون.
    note: زنده باشین عبارت مؤدبانهٔ رایجی در افغانستان است که اغلب در جواب تشکر یا حرف محبت‌آمیز گفته می‌شود. باشین شکل محاوره‌ای محترمانه برای «شما» است.
  prs.a1.unit01.lesson05.teach.own_home:
    title: از مهمان گرم استقبال کنید
    gloss: اینجا خانهٔ خودتان است.
    note: خانهٔ خودتان است به مهمان اطمینان می‌دهد که خوش آمده است.
  prs.a1.unit01.lesson05.teach.seat_of_honor:
    title: جای محترم را تعارف کنید
    gloss: لطفاً بالای مجلس بنشینید.
    note: در مهمان‌خانه، بالا بفرمایین مهمان را به سمت جای محترم‌تر، دور از در ورودی، دعوت می‌کند. لزوماً به معنای طبقهٔ بالا نیست.
  prs.a1.unit01.lesson05.teach.elders_first:
    title: اول به بزرگ‌ترها سلام کنید
    gloss: اول به بزرگ‌ترها سلام می‌کنیم.
    note: اول سلام کردن به بزرگ‌ترها نشانهٔ احترام است. دست دادن یا تماس بدنی به نوع رابطه، جنسیت و نشانه‌های هر فرد بستگی دارد؛ یادگیرنده نباید فرض کند که دست دادن مناسب است.
  prs.a1.unit01.lesson06.teach.daftar:
    title: دفتر
    gloss: دفتر (محل کار)
    note: دفتر به اداره یا محل کار گفته می‌شود.
    example_gloss: دفتر من در کابل است.
  prs.a1.unit01.lesson06.teach.kabul:
    title: کابل
    gloss: کابل
    note: کابل پایتخت افغانستان است و صحنهٔ این گفت‌وگو هم همین‌جاست.
    example_gloss: من در کابل زندگی می‌کنم.
  prs.a1.unit01.lesson06.teach.line01:
    title: حامد خودش را به‌عنوان همکار جدید معرفی می‌کند
    gloss: حامد می‌گوید همکار جدید است.
    note: هر دو گوینده همکارانِ مرد و بزرگ‌سال‌اند که در یک دفتر در کابل همدیگر را می‌بینند.
  prs.a1.unit01.lesson06.teach.line02:
    title: نجیب به او خوش‌آمد می‌گوید و اسمش را می‌پرسد
    gloss: نجیب به او خوش‌آمد می‌گوید و اسمش را می‌پرسد.
    note: خوش آمدین در دریِ محاوره‌ای یک خوش‌آمدگویی محترمانه است و برای یک نفر یا چند نفر به کار می‌رود.
  prs.a1.unit01.lesson06.teach.line03:
    title: حامد اسمش را می‌گوید
    gloss: حامد اسمش را می‌گوید.
    note: نامم حامد است (اسمم حامد است) شکل رایج محاوره‌ای است؛ نامم یعنی نام + ـم (مال من). در نوشتار نام من حامد است را هم می‌بینید. هر دو درست است.
  prs.a1.unit01.lesson06.teach.line04:
    title: نجیب خودش را معرفی می‌کند و می‌گوید از آشنایی با او خوشحال است
    gloss: نجیب خودش را معرفی می‌کند و می‌گوید از آشنایی با او خوشحال است.
    note: از آشنایی با شما خوش شدم صریحاً به آشنا شدن اشاره دارد، برای همین برای اولین دیدار مناسب است.
  prs.a1.unit01.lesson06.teach.line05:
    title: حامد هم ابراز خوشحالی می‌کند و از نجیب حالش را می‌پرسد
    gloss: حامد هم ابراز خوشحالی می‌کند و از نجیب حالش را می‌پرسد.
    note: بین همکاران تازه‌آشنا، «شما» و استین رعایت می‌شود تا لحن محترمانه بماند.
  prs.a1.unit01.lesson06.teach.line06:
    title: نجیب جواب می‌دهد
    gloss: نجیب می‌گوید خوب است و تشکر می‌کند.
    note: جور استم، تشکر جواب پرسش حال‌واحوال است، همان‌طور که پیش‌تر در این واحد آمد.
  prs.a1.unit01.lesson06.teach.line07:
    title: نجیب از خانوادهٔ حامد احوال می‌پرسد
    gloss: نجیب از خانوادهٔ حامد احوال می‌پرسد.
    note: احوال‌پرسی از اهل خانه، احوال‌پرسی را کامل می‌کند، قبل از اینکه سراغ کار بروند.
  prs.a1.unit01.lesson06.teach.line08:
    title: حامد می‌گوید همه خوب‌اند
    gloss: حامد می‌گوید همه خوب‌اند.
    note: شکر، همه جور استند جواب پرسش دربارهٔ خانواده است، همان‌طور که پیش‌تر در این واحد آمد.
  prs.a1.unit01.lesson06.teach.line09:
    title: نجیب پیشنهاد می‌کند بقیهٔ همکاران را معرفی کند
    gloss: نجیب پیشنهاد می‌کند بقیهٔ همکاران را معرفی کند.
    note: بفرمایین اینجا حامد را دعوت می‌کند همراهش بیاید، نه اینکه بنشیند یا چیزی بردارد.
  prs.a1.unit01.lesson06.teach.line10:
    title: حامد با تشکر موافقت می‌کند
    gloss: حامد با تشکر موافقت می‌کند.
    note: بسیار خوب در اینجا به‌عنوان یک پاسخ مثبت و روشن معرفی می‌شود.
  prs.a1.unit01.lesson06.teach.line11:
    title: نجیب با گرمی جواب می‌دهد و میز حامد را نشان می‌دهد
    gloss: نجیب با گرمی جواب می‌دهد و میز حامد را نشان می‌دهد.
    note: گفت‌وگو با شروع کار روزانه تمام می‌شود، نه با تکرار خداحافظی‌های مهمانی.
  prs.a1.unit01.lesson06.teach.line12:
    title: حامد از او تشکر می‌کند
    gloss: حامد از او تشکر می‌کند.
    note: تشکر گفت‌وگو را ساده تمام می‌کند.
exercises:
  prs.a1.unit01.lesson01.exercise01.recognize_sin:
    instruction: سلام با کدام حرف شروع می‌شود؟
    correct_option: س
    distractors:
    - ش
    - ص
    - چ
    accepted_answers:
    - value: س
      status: correct
    feedback: سلام با س شروع می‌شود. این سؤال املای همین کلمه را می‌سنجد، نه اینکه کدام حرف‌ها می‌توانند صدای «س» را نشان بدهند.
  prs.a1.unit01.lesson01.exercise02.recognize_che:
    instruction: کدام حرف نشان‌دهندهٔ «چ» است؟
    correct_option: چ
    distractors:
    - ج
    - خ
    - ش
    accepted_answers:
    - value: چ
      status: correct
    feedback: چ نشان‌دهندهٔ صدای «چ» است.
    prompt_blocks:
    - ch
