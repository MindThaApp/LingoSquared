teaching:
  prs.a2.unit11.lesson01.teach.bank_word:
    title: بانک
    gloss: بانک
    note: '*بانک* واژهٔ رایج برای بانک است؛ مانند فارسی ایران.'
    example_gloss: بانک نزدیک خانهٔ همایون است.
  prs.a2.unit11.lesson01.teach.account_word:
    title: حساب بانکی
    gloss: حساب بانکی
    note: '*حساب بانکی* -- *حساب* به‌تنهایی هم در موقعیت‌های عمومی به معنی «حساب» است.'
    example_gloss: همایون یک حساب بانکی می‌خواهد.
  prs.a2.unit11.lesson01.teach.card_word:
    title: کارت بانکی
    gloss: کارت بانکی
    note: '*کارت بانکی* -- *کارت* به‌تنهایی واژهٔ عمومی برای «کارت» است.'
    example_gloss: کارت بانکی‌ام را گم کردم.
  prs.a2.unit11.lesson01.teach.pin_word:
    title: رمز
    gloss: رمز کارت / رمز عبور
    note: '*رمز* هم برای رمز کارت بانکی به کار می‌رود و هم برای رمز عبور به‌طور کلی.'
    example_gloss: رمز کارت بانکی‌ام را فراموش کردم.
  prs.a2.unit11.lesson01.teach.balance_word:
    title: موجودی
    gloss: موجودی
    note: '*موجودی* مقدار پولی است که اکنون در حساب هست.'
    example_gloss: موجودی حسابم کم است.
  prs.a2.unit11.lesson01.teach.signature_word:
    title: امضا
    gloss: امضا
    note: '*امضا* هم به معنی امضا کردن است و هم به معنی خود امضا.'
    example_gloss: لطفاً اینجا را امضا کنید.
  prs.a2.unit11.lesson01.teach.if_grammar:
    title: اگر (شرط)
    gloss: اگر شناسنامه یا کارت هویت داشته باشید، می‌توانید حساب باز کنید.
    note: '*اگر* جملهٔ شرطی می‌سازد -- نوع تازه‌ای از جملهٔ پیرو در کنار *چون* (زیرا).'
  prs.a2.unit11.lesson01.teach.open_account_word:
    title: باز کردن حساب
    gloss: باز کردن حساب
    note: '*باز کردن حساب* -- *باز کردن* یعنی «گشودن».'
  prs.a2.unit11.lesson01.teach.va_word:
    title: و
    gloss: و
    note: '*و* حرف ربط رایجی است که در سراسر این واحد به کار می‌رود.'
    target_text: و (و)
  prs.a2.unit11.lesson02.teach.request_account:
    title: درخواست باز کردن حساب
    gloss: می‌خواستم یک حساب بانکی باز کنم.
    note: الگوی مؤدبانهٔ *می‌خواستم* که قبلاً یاد گرفته‌اید دوباره به کار رفته است.
  prs.a2.unit11.lesson02.teach.if_documents:
    title: گفتن شرط، با اگر
    gloss: اگر شناسنامه و رسید اجارهٔ خانه داشته باشید، می‌توانید حساب باز کنید.
    note: '*اگر... داشته باشین* -- «اگر ... داشته باشید» -- جملهٔ شرطی تازه را با *رسید کرایه خانه* (رسید اجارهٔ خانه) ترکیب می‌کند.'
  prs.a2.unit11.lesson02.teach.card_ready_timeline:
    title: گفتن اینکه کارت چه زمانی آماده می‌شود
    gloss: کارت بانکی‌تان تا سه روز دیگر آماده می‌شود.
    note: '*تا سه روز دیگر* یعنی «ظرف سه روز دیگر».'
  prs.a2.unit11.lesson03.teach.fee_word:
    title: کارمزد
    gloss: کارمزد
    note: '*کارمزد* هزینهٔ خدمات یا تراکنش است.'
    example_gloss: این حساب کارمزد ندارد.
  prs.a2.unit11.lesson03.teach.minimum_word:
    title: حداقل
    gloss: حداقل
    note: '*حداقل* یعنی «کمترین مقدار» یا «دست‌کم».'
    example_gloss: حداقل موجودی حساب ۵۰۰ افغانی است.
  prs.a2.unit11.lesson03.teach.notice_text:
    title: اطلاعیهٔ بانک دربارهٔ باز کردن حساب
    gloss: برای باز کردن حساب، لطفاً شناسنامه یا کارت هویت و رسید اجارهٔ خانه را همراه بیاورید. حداقل موجودی حساب ۵۰۰ افغانی است. کارمزد ماهانه ندارد.
    note: یک اطلاعیهٔ رسمی کوتاه از بانک، به سبک نوشتاری رسمی که این واحد آموزش می‌دهد.
  prs.a2.unit11.lesson04.teach.turn01:
    title: کارمند بانک به همایون خوشامد می‌گوید
    gloss: کارمند از او دعوت می‌کند و می‌پرسد چه خدمتی می‌تواند برایش انجام دهد.
    note: همان احوال‌پرسی رسمی‌ای که کارمند اداره هنگام پیشنهاد کمک به کار می‌برد.
  prs.a2.unit11.lesson04.teach.turn02:
    title: همایون می‌خواهد حساب باز کند
    gloss: همایون می‌گوید می‌خواهد یک حساب بانکی باز کند.
    note: همان الگوی درخواست مؤدبانهٔ *می‌خواستم* که قبلاً دیدید.
  prs.a2.unit11.lesson04.teach.turn03:
    title: کارمند بانک مدارک را می‌خواهد
    gloss: کارمند می‌پرسد که کارت شناسایی ملی و رسید اجارهٔ خانه را دارد یا نه.
    note: '*دارین؟* -- «دارید؟» -- شکل مؤدبانهٔ پرسش.'
  prs.a2.unit11.lesson04.teach.turn04:
    title: همایون تأیید می‌کند که مدارک را دارد
    gloss: بله، این هم کارت شناسایی ملی و رسید اجارهٔ خانه‌اش.
    note: '*این هم ...* («بفرمایید، این ...») را وقتی می‌گویند که چیزی را به کسی تحویل می‌دهند.'
  prs.a2.unit11.lesson04.teach.turn05:
    title: کارمند تأیید می‌کند و زمان را می‌گوید
    gloss: خوب است. کارت بانکی‌اش تا سه روز دیگر آماده می‌شود.
    note: 'باز هم زمان را می‌گوید: *تا سه روز دیگر آماده می‌شود* («تا سه روز دیگر آماده می‌شود»).'
  prs.a2.unit11.lesson04.teach.turn06:
    title: همایون دربارهٔ رمز می‌پرسد
    gloss: می‌پرسد رمز را کی می‌گیرد.
    note: '*رمزش* -- «رمز آن» -- ضمیر ملکی *-ش* به *رمز* چسبیده است.'
  prs.a2.unit11.lesson04.teach.turn07:
    title: فروشنده‌ی بلیت جواب می‌دهد
    gloss: کارمند می‌گوید همان روزی که کارت را تحویل بگیرد.
    note: '*همان روزی که ...* یعنی «همان روزی که ...».'
  prs.a2.unit11.lesson04.teach.turn08:
    title: همایون از کارمند تشکر می‌کند
    gloss: همایون بابت وقتی که کارمند گذاشته تشکر می‌کند.
    note: '*تشکر از وقت‌تان* («ممنون از وقتی که گذاشتید») یک جملهٔ مؤدبانهٔ پایان گفتگوست.'
