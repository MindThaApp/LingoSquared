  prs.a1.unit02.lesson06.gathering_dialogue:
    title: آشنا شدن با آدم‌ها در یک مهمانی
teaching:
  prs.a1.unit02.lesson01.teach.name_question_polite:
    title: پرسیدن مؤدبانهٔ نام کسی
    gloss: اسم شما چیه؟
    note: «نام‌تان چیست؟» شکل محترمانه برای یک آشنای تازهٔ بزرگسال است و همان لحن شما/استین درس اول را ادامه می‌دهد.
  prs.a1.unit02.lesson01.teach.name_answer:
    title: گفتن نام با است
    gloss: اسم من فریدون است.
    note: «نام من ... است» شکل نوشتاری گفتن نام است. در گفتگو معمولاً می‌گویند «نامم ... است» (نامم = نام + -م، یعنی اسم من). هر دو درست‌اند.
  prs.a1.unit02.lesson01.teach.i_am_name:
    title: گفتن نام با استم
    gloss: من فریدون هستم.
    note: «استم» درست بعد از نام می‌آید؛ همان فعل ربطی اول‌شخص دری از درس اول.
  prs.a1.unit02.lesson01.teach.name_question_informal:
    title: پرسیدن نام یک دوست نزدیک
    gloss: اسمت چیه؟
    note: «نامت چیست؟» از -ت غیررسمی استفاده می‌کند. آن را فقط برای هم‌سن‌وسال یا دوست نزدیک به کار ببرید، درست مثل تو/استی در درس اول.
  prs.a1.unit02.lesson01.teach.what_is_your_name_word:
    title: واژهٔ «نام»
    gloss: اسم
    note: «نام» اسمی مستقل است که هم در پرسش محترمانه و هم در پرسش دوستانه به کار می‌رود.
    example_gloss: اسمت چیست؟
  prs.a1.unit02.lesson01.teach.register_note:
    title: ضمیر ملکی محترمانه و دوستانه
    gloss: -تان برای کسی که با احترام مخاطبش می‌کنید؛ -ت برای دوست نزدیک.
    note: همان تفاوت لحن درس اول (شما/تو) در پسوندهای مالکیت روی «نام» هم دیده می‌شود.
  prs.a1.unit02.lesson02.teach.where_from_polite:
    title: پرسیدن اینکه کسی اهل کجاست
    gloss: شما اهل کجایید؟
    note: «شما از کجا استین؟» همان جفت محترمانهٔ شما/استین را نگه می‌دارد.
  prs.a1.unit02.lesson02.teach.from_kabul:
    title: بگویید اهل کابل هستید
    gloss: من اهل کابل هستم.
    note: «من از کابل استم» از الگوی «من از [مکان] استم» پیروی می‌کند که برای هر شهری کاربرد دارد.
  prs.a1.unit02.lesson02.teach.from_herat:
    title: بگویید اهل هرات هستید
    gloss: من اهل هرات هستم.
    note: هرات یکی از شهرهای بزرگ غرب افغانستان است.
  prs.a1.unit02.lesson02.teach.from_mazar:
    title: بگویید اهل مزار شریف هستید
    gloss: من اهل مزار شریف هستم.
    note: «مزار شریف» دو کلمه جدا نوشته می‌شود و یکی از شهرهای بزرگ شمال افغانستان است.
  prs.a1.unit02.lesson02.teach.country:
    title: افغانستان
    gloss: افغانستان
    note: «افغانستان» بعد از «از» درست مثل نام یک شهر به کار می‌رود.
    example_gloss: من اهل افغانستان هستم.
  prs.a1.unit02.lesson02.teach.city_word:
    title: واژهٔ «شهر»
    gloss: شهر
    note: «شهر» به طور کلی برای شهر گفته می‌شود و با نام یک شهر مشخص فرق دارد.
    example_gloss: کابل یک شهر بزرگ است.
  prs.a1.unit02.lesson03.teach.occupation_question:
    title: پرسیدن شغل کسی
    gloss: شغل شما چیست؟
    note: «کار شما چیست؟» تحت‌اللفظی یعنی «کارتان چیست؟»؛ راه معمول پرسیدن دربارهٔ شغل.
  prs.a1.unit02.lesson03.teach.doctor:
    title: دکتر
    gloss: دکتر
    note: «داکتر» واژهٔ رایج دری برای پزشک است و به‌طور غیررسمی برای کسانی که مدرک دکترا دارند هم به کار می‌رود.
    example_gloss: او دکتر است.
  prs.a1.unit02.lesson03.teach.teacher:
    title: معلم
    gloss: معلم
    note: «معلم» واژه‌ای عام برای معلم در هر مقطع تحصیلی است.
    example_gloss: او معلم است.
  prs.a1.unit02.lesson03.teach.engineer:
    title: مهندس
    gloss: مهندس
    note: «مهندس» به‌طور کلی برای مهندس‌ها به کار می‌رود، نه برای یک رشتهٔ مهندسی خاص.
    example_gloss: او مهندس است.
  prs.a1.unit02.lesson03.teach.shopkeeper:
    title: مغازه‌دار
    gloss: مغازه‌دار
    note: «دوکاندار» (از «دوکان» به معنی مغازه) واژهٔ روزمرهٔ کابل است؛ این دوره املای دری «دوکان» را به کار می‌برد، نه «مغازه» را که در فارسی ایران رایج است.
    example_gloss: او مغازه‌دار است.
  prs.a1.unit02.lesson03.teach.i_am_teacher:
    title: گفتن شغل
    gloss: من معلم هستم.
    note: «من [شغل] استم» الگوی بیان هر شغلی است که در این درس آمده.
  prs.a1.unit02.lesson04.teach.introduce_formal:
    title: معرفی رسمی یک نفر
    gloss: اجازه بدهید همکارم را معرفی کنم.
    note: «اجازه بدهین همکارم را معرفی کنم» راهی محترمانه برای وارد کردن نفر سوم در گفتگو است.
  prs.a1.unit02.lesson04.teach.this_is:
    title: نام کسی را که معرفی می‌کنید بگویید
    gloss: این همکارم آرزو است.
    note: «این [شخص] است» مستقیماً می‌گوید چه کسی معرفی می‌شود.
  prs.a1.unit02.lesson04.teach.pleased_after_intro:
    title: بگویید از آشنایی با کسی خوشحال شده‌اید
    gloss: خوشبختم.
    note: «از آشنایی با شما خوش شدم» همان عبارت اولین دیدار در درس اول است که اینجا بعد از معرفی نفر سوم دوباره به کار می‌رود.
  prs.a1.unit02.lesson04.teach.pleased_reply:
    title: جواب بدهید که شما هم خوشحال شده‌اید
    gloss: من هم خوشحال شدم.
    note: «من هم خوش شدم» پاسخ کوتاه و طبیعی است.
  prs.a1.unit02.lesson04.teach.friend_word:
    title: دوست
    gloss: دوست
    note: «دوست» واژه‌ای عام برای دوست است و درجهٔ صمیمیت را مشخص نمی‌کند.
    example_gloss: او دوست من است.
  prs.a1.unit02.lesson04.teach.colleague_word:
    title: همکار
    gloss: همکار
    note: «همکار» یعنی کسی که با شما کار می‌کند؛ پیش‌تر در گفتگوی محل کار درس اول دیده‌اید.
    example_gloss: او همکار من است.
  prs.a1.unit02.lesson05.teach.title_jenab:
    title: آقا / جناب
    gloss: آقا / جناب
    note: «جناب» پیش از نام یا عنوان یک مرد، به‌عنوان خطاب محترمانه می‌آید و در گفتار روزمرهٔ شهری افغانستان رایج است.
    example_gloss: جناب، بفرمایید.
  prs.a1.unit02.lesson05.teach.title_khanom:
    title: خانم
    gloss: خانم
    note: «خانم» پیش از نام یک زن می‌آید و بدون توجه به متأهل بودن یا نبودن او به کار می‌رود.
    example_gloss: خانم، بفرمایید.
  prs.a1.unit02.lesson05.teach.title_with_name:
    title: خطاب مؤدبانه به یک مرد
    gloss: جناب فریدون
    note: «جناب» به‌همراه نام کوچک خطابی محترمانه و رایج است و لزوماً به نام خانوادگی نیاز ندارد.
  prs.a1.unit02.lesson05.teach.title_with_name_female:
    title: خطاب مؤدبانه به یک زن
    gloss: خانم آرزو
    note: «خانم» به‌همراه نام کوچک درست مثل «جناب» برای مردان به کار می‌رود.
  prs.a1.unit02.lesson05.teach.register_reminder:
    title: کِی کدام لحن را به کار ببریم
    gloss: با کسی که تازه با او آشنا شده‌اید از شما و استین استفاده کنید؛ تو و استی را فقط با دوست نزدیک به کار ببرید.
    note: این بخش قاعدهٔ لحن درس اول را مستقیماً برای موقعیت معرفی دوباره بیان می‌کند.
  prs.a1.unit02.lesson05.teach.polite_could_you:
    title: خواهش مؤدبانه از کسی که نامش را تکرار کند
    gloss: می‌شود لطفاً اسمتان را دوباره بگویید؟
    note: «می‌توانین نام‌تان را دوباره بگویین؟» راهی طبیعی و مؤدبانه برای خواستن تکرار است، بدون اینکه موقعیت ناجور شود.
  prs.a1.unit02.lesson06.teach.gathering_word:
    title: مهمانی
    gloss: مهمانی
    note: «مهمانی» یک گردهمایی دوستانه و غیررسمی است و فضای گفتگوی این درس است.
    example_gloss: مهمانی خوب است.
  prs.a1.unit02.lesson06.teach.turn01:
    title: لیلا معرفی را شروع می‌کند
    gloss: لیلا به فریدون سلام می‌کند و با احترام و با خطاب «جناب» اسمش را می‌پرسد.
    note: لیلا و فریدون همدیگر را نمی‌شناسند، برای همین لیلا از همان ابتدا لحن محترمانه را به کار می‌برد.
  prs.a1.unit02.lesson06.teach.turn02:
    title: فریدون نامش را می‌گوید
    gloss: فریدون جواب سلام را می‌دهد و نامش را می‌گوید.
    note: «سلام علیکم» سلام کامل‌تری از درس اول است و برای اولین دیدار مناسب است. در گفتگو فریدون می‌گوید «نامم فریدون است» (نامم = نام من، یعنی اسم من)، که شکل رایج گفتاری است.
  prs.a1.unit02.lesson06.teach.turn03:
    title: لیلا می‌پرسد او اهل کجاست
    gloss: لیلا می‌گوید از آشنایی با او خوشحال شده و می‌پرسد اهل کجاست.
    note: همین عبارت «از آشنایی با شما خوش شدم» از گفتگوی محل کار درس اول اینجا هم آمده است.
  prs.a1.unit02.lesson06.teach.turn04:
    title: فریدون جواب می‌دهد و همان پرسش را برمی‌گرداند
    gloss: فریدون می‌گوید اهل هرات است و همین را از لیلا می‌پرسد.
    note: «و شما؟» کوتاه و مختصر پرسش را برمی‌گرداند، همان‌طور که در درس اول دیدید.
  prs.a1.unit02.lesson06.teach.turn05:
    title: لیلا جواب می‌دهد و دربارهٔ شغل می‌پرسد
    gloss: لیلا می‌گوید اهل کابل است و شغل فریدون را می‌پرسد.
    note: گفتگو به‌طور طبیعی از محل اصلی به شغل می‌رسد.
  prs.a1.unit02.lesson06.teach.turn06:
    title: فریدون جواب می‌دهد و همان پرسش را برمی‌گرداند
    gloss: فریدون می‌گوید مهندس است و همین را از لیلا می‌پرسد.
    note: «شما چطور؟» راهی کوتاه برای برگرداندن پرسشی است که از متن معلوم است.
  prs.a1.unit02.lesson06.teach.turn07:
    title: لیلا شغلش را می‌گوید
    gloss: لیلا می‌گوید معلم است.
    note: این جمله، تبادل دربارهٔ شغل را با الگویی که پیش‌تر در همین درس آمد کامل می‌کند.
  prs.a1.unit02.lesson06.teach.turn08:
    title: فریدون نفر سوم را معرفی می‌کند
    gloss: فریدون همکارش آرزو را معرفی می‌کند.
    note: این جمله با عبارت معرفی رسمی که پیش‌تر آمد، نفر سوم را وارد گفتگو می‌کند.
  prs.a1.unit02.lesson06.teach.turn09:
    title: لیلا به آرزو خوشامد می‌گوید
    gloss: لیلا به آرزو خوشامد می‌گوید و با احترام او را «خانم» خطاب می‌کند.
    note: «خوش آمدین» همان عبارت خوشامدگویی درس ۱ است، اینجا خطاب به شخصی که تازه معرفی شده.
  prs.a1.unit02.lesson06.teach.turn10:
    title: پاسخ آرزو
    gloss: آرزو از لیلا تشکر می‌کند و می‌گوید از دیدنش خوشحال شده.
    note: «از دیدن شما خوشحال شدم» شکل دیگرِ طبیعی «از آشنایی خوشحال شدم» است که به‌جای «آشنایی» از «دیدن» استفاده می‌کند.
exercises:
  prs.a1.unit02.lesson01.exercise01.recognize_name_question:
    instruction: کدام عبارت نام کسی را محترمانه می‌پرسد؟
    correct_option: اسم شما چیست؟ (محترمانه)
    distractors:
    - اسمت چیه؟ (خودمانی)
    - شغل شما چیست؟
    - شما اهل کجا هستید؟
    accepted_answers:
    - value: اسم شما چیست؟ (محترمانه)
      status: correct
    feedback: «نام‌تان چیست؟» شکل محترمانه برای کسی است که تازه با او آشنا شده‌اید.
  prs.a1.unit02.lesson01.exercise02.recognize_polite_vs_informal:
    instruction: «نامت چیست؟» را وقتی می‌پرسید که مخاطب شما ... باشد.
    correct_option: یک دوست نزدیک
    distractors:
    - غریبه‌ای که تازه دیده‌اید
    - یک بزرگ‌تر در یک مراسم رسمی
    - مشتری مغازه‌تان
    accepted_answers:
    - value: یک دوست نزدیک
      status: correct
    feedback: ضمیر ملکی خودمانی «-ت» در «نامت» فقط برای دوست نزدیک یا هم‌سن‌وسال مناسب است؛ همان قاعده‌ی «تو/استی» در درس ۱.
  prs.a1.unit02.lesson01.exercise03.recognize_name_question_reading:
    instruction: این سؤال چه می‌پرسد؟
    correct_option: اسم شما چیست؟
    distractors:
    - شغل شما چیست؟
    - شما اهل کجا هستید؟
    - و شما؟
    accepted_answers:
    - value: اسم شما چیست؟
      status: correct
    feedback: «نام‌تان چیست؟» اسم شما را می‌پرسد.
  prs.a1.unit02.lesson01.exercise04.match_name_forms:
    instruction: هر عبارت را با معنی‌اش جفت کنید.
    accepted_answers:
    - value:
        نام‌تان چیست؟: اسم شما چیست؟ (محترمانه)
        نامت چیست؟: اسمت چیست؟ (غیررسمی)
        نام: اسم
      status: correct
    feedback: «نام‌تان» و «نامت» فقط در سطح رسمی‌بودن فرق دارند، نه در معنی.
    pairs:
    - left: نام‌تان چیست؟
      right: اسم شما چیست؟ (محترمانه)
    - left: نامت چیست؟
      right: اسمت چیست؟ (غیررسمی)
    - left: نام
      right: اسم
  prs.a1.unit02.lesson01.exercise05.order_name_answer:
    instruction: 'کلمه‌ها را طوری مرتب کنید که بگویید: اسم من فریدون است.'
    accepted_answers:
    - value:
      - نام
      - من
      - فریدون
      - است
      status: correct
    feedback: «نام من فریدون است» از الگوی اسم + «است» پیروی می‌کند.
  prs.a1.unit02.lesson01.exercise06.translate_name_answer:
    instruction: 'به دری ترجمه کنید: اسم من فریدون است.'
    accepted_answers:
    - value: نام من فریدون است
      status: correct
    - value: فریدون استم
      status: correct
    - value: من فریدون استم
      status: correct
    - value: نامم فریدون است
      status: correct
    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
