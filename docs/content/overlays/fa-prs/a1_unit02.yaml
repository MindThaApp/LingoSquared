course:
  title: دری افغانستان A1
  description: 'دری افغانستان در سطح مقدماتی: گفتن اسم، گفتن اینکه اهل کجا هستید و چه کار می‌کنید، معرفی فرد سوم، و استفاده درست از عنوان‌ها و سطح رسمیت در اولین دیدار.'
units:
  prs.a1.unit02.introductions:
    title: معرفی و آشنایی
lessons:
  prs.a1.unit02.lesson01.name_exchange:
    title: پرسیدن و گفتن نام
  prs.a1.unit02.lesson02.origin_and_hometown:
    title: پرسیدن درباره شهر و کشور
  prs.a1.unit02.lesson03.occupation:
    title: دربارهٔ شغل کسی بپرسید
  prs.a1.unit02.lesson04.introducing_others:
