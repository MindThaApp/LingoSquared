teaching:
  prs.a1.unit26.lesson01.teach.hobby_word:
    title: سرگرمی
    gloss: سرگرمی
    note: «سرگرمی» یعنی همان سرگرمی (کاری که برای تفریح انجام می‌دهید).
    example_gloss: پیاده‌روی سرگرمی من است.
  prs.a1.unit26.lesson01.teach.reading_word:
    title: کتاب خواندن
    gloss: کتاب خواندن
    note: '«کتاب خواندن» از دو بخش ساخته شده است: کتاب + خواندن.'
    example_gloss: کتاب خواندن سرگرمی من است.
  prs.a1.unit26.lesson01.teach.music_word:
    title: گوش دادن به موسیقی
    gloss: گوش دادن به موسیقی
    note: '«موسیقی گوش کردن» از این بخش‌ها ساخته شده است: موسیقی (که پیش‌تر در درس‌ها آمده) + گوش + کردن. در دری برای «گوش دادن» از «گوش کردن» استفاده می‌شود.'
    example_gloss: گوش دادن به موسیقی سرگرمی من است.
  prs.a1.unit26.lesson01.teach.movie_word:
    title: فیلم دیدن
    gloss: فیلم دیدن
    note: '«فلم دیدن» از دو بخش ساخته شده است: فلم (فیلم) + دیدن. دقت کنید که در دری «فلم» گفته می‌شود.'
    example_gloss: فیلم دیدن سرگرمی من است.
  prs.a1.unit26.lesson01.teach.walking_word:
    title: پیاده‌روی
    gloss: پیاده‌روی
    note: «پیاده‌روی» یعنی راه رفتن به‌عنوان یک فعالیت یا ورزش.
    example_gloss: پیاده‌روی سرگرمی من است.
  prs.a1.unit26.lesson01.teach.cooking_word:
    title: آشپزی
    gloss: آشپزی
    note: «آشپزی» یعنی پختن غذا.
    example_gloss: آشپزی سرگرمی من است.
  prs.a1.unit26.lesson02.teach.free_word:
    title: آزاد
    gloss: آزاد (بیکار، غیرمشغول)
    note: آزاد در اینجا یعنی «وقت‌خالی، غیرمشغول»، نه «رایگان».
    example_gloss: امروز آزادم.
  prs.a1.unit26.lesson02.teach.review_waqt:
