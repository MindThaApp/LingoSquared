    title: خواندن دربارهٔ سرگرمی‌ها
    gloss: زرمینه کتاب خواندن را دوست دارد. همایون در وقت آزادش پیاده‌روی می‌کند. او گاهی هم آشپزی می‌کند.
    note: یک متن کوتاه که واژه‌های سرگرمی این درس را مرور می‌کند، او را مرور می‌کند و شکل‌های پرکاربرد سوم‌شخص می‌کند و دارد را معرفی می‌کند.
