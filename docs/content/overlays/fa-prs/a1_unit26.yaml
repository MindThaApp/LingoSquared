course:
  title: دری افغانستان A1
  description: 'دری کابلی سطح مبتدی: واژه‌های سرگرمی و اوقات فراغت (کتاب خواندن، گوش دادن به موسیقی، فیلم دیدن، پیاده‌روی، آشپزی)، پرسیدن اینکه کسی در وقت آزادش چه کاری را دوست دارد با «دوست دارین»، بیان تکرار با «هر هفته/آخر هفته» و یک گفت‌وگوی زرمینه و همایون دربارهٔ گذراندن وقت آزاد.'
