    gloss: سرگرمی
    note: سرگرمی یعنی سرگرمی (مرور از درس اول).
    example_gloss: آشپزی سرگرمی من است.
  prs.a1.unit26.lesson06.teach.wrap_summary:
    title: در وقت آزادم پیاده‌روی می‌کنم، اما گاهی کتاب خواندن را هم دوست دارم
