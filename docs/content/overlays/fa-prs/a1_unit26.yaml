  prs.a1.unit26.lesson04.teach.dialogue_line2:
    title: 'زرمینه: کتاب خواندن را دوست دارم و گاهی هم موسیقی گوش می‌کنم.'
    gloss: 'زرمینه: کتاب خواندن را دوست دارم و گاهی هم موسیقی گوش می‌کنم.'
    note: دو فعالیت را با و به هم وصل می‌کند.
