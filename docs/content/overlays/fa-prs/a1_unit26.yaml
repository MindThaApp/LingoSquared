    title: 'همایون: من هر هفته پیاده‌روی می‌کنم'
    gloss: 'همایون: من هر هفته پیاده‌روی می‌کنم.'
    note: جملهٔ *من هر هفته پیاده‌روی می‌کنم* (هر هفته پیاده‌روی می‌کنم) از درس سوم دوباره آمده است.
  prs.a1.unit26.lesson04.teach.dialogue_line4:
    title: 'زرمینه: خوبه! من هم فیلم دیدن را دوست دارم.'
    gloss: 'زرمینه: خوبه! من هم فیلم دیدن را دوست دارم.'
    note: هم را برای یک فعالیت تازه به کار می‌برد.
  prs.a1.unit26.lesson04.teach.dialogue_line5:
    title: 'همایون: من هم گاهی آشپزی می‌کنم.'
    gloss: 'همایون: من هم گاهی آشپزی می‌کنم.'
    note: گاهی و می‌کنم را برای آشپزی به کار می‌برد.
