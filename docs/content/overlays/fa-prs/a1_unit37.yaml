    gloss: و / ولی
    note: و و اما واژه‌های مرور هستند که برای کنار هم گذاشتن یا مقابل هم قرار دادن ویژگی‌ها به کار می‌روند.
    target_text: و (و) / اما (ولی)
  prs.a1.unit37.lesson02.teach.funny_and_honest_phrase:
    title: او شوخ و راستگو است
    gloss: او شوخ و راستگو است.
    note: دو ویژگی خوب را با و کنار هم می‌آورد.
  prs.a1.unit37.lesson02.teach.quiet_but_kind_phrase:
