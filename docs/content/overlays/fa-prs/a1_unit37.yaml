  prs.a1.unit37.lesson06.teach.formal_question_phrase:
    title: شما چه‌جور آدمی هستید؟
    gloss: شما چه‌جور آدمی هستید؟
    note: شما (شکل محترمانه) و استین (هستید) به همان ساختار سؤال درس سوم اضافه شده‌اند، این بار مستقیم خطاب به شما.
