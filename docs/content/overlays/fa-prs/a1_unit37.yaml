    gloss: چطور، چه جور / چون / کمک
    note: چطور، چون و کمک واژه‌های مرور هستند که برای پرسیدن دربارهٔ شخصیت و دلیل آوردن به کار می‌روند.
    target_text: چطور (چطور، چه جور) / چون (چون) / کمک (کمک)
  prs.a1.unit37.lesson03.teach.what_kind_person_question:
