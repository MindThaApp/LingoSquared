  prs.a1.unit37.lesson01.teach.zahmatkash_word:
    title: زحمتکش
    gloss: زحمتکش، پرتلاش
    note: زحمتکش در اصل یعنی کسی که زحمت می‌کشد؛ یعنی آدمی پرتلاش.
    example_gloss: او زحمتکش است.
  prs.a1.unit37.lesson01.teach.bahosh_word:
    title: باهوش
    gloss: باهوش
    note: باهوش از با (همراه) و هوش ساخته شده است؛ یعنی آدمی زرنگ و باهوش.
    example_gloss: او باهوش است.
  prs.a1.unit37.lesson01.teach.tambal_word:
    title: تنبل
    gloss: تنبل
    note: تنبل یعنی کسی که کار کردن را دوست ندارد و بی‌حوصله است.
    example_gloss: او تنبل است.
  prs.a1.unit37.lesson01.teach.review_basics:
    title: 'مرور: او، هست، و، اما'
    gloss: او / هست / و / ولی
    note: او، است، و، و اما در جمله‌های این واحد دربارهٔ شخصیت مرور می‌شوند و مدام به کار می‌روند.
    target_text: او (او) / است (هست) / و (و) / اما (ولی)
  prs.a1.unit37.lesson01.teach.kind_and_hardworking_phrase:
    title: او مهربان و زحمتکش است
    gloss: او مهربان و زحمتکش است.
    note: و دو ویژگی را در یک جمله به هم وصل می‌کند.
  prs.a1.unit37.lesson01.teach.smart_but_lazy_phrase:
    title: او باهوش است، اما تنبل
    gloss: او باهوش است، اما تنبل است.
    note: اما دو ویژگی متضاد را در یک جمله کنار هم می‌آورد.
  prs.a1.unit37.lesson02.teach.shokh_word:
    title: بامزه
    gloss: شوخ، بذله‌گو
    note: شوخ یعنی کسی که شوخی می‌کند و بازیگوش است.
    example_gloss: او شوخ است.
  prs.a1.unit37.lesson02.teach.kamharf_word:
    title: کم‌حرف
    gloss: کم‌حرف، کم‌صحبت
    note: کم‌حرف در اصل یعنی کم‌سخن؛ آدمی ساکت و کم‌صحبت.
    example_gloss: او کم‌حرف است.
  prs.a1.unit37.lesson02.teach.rastgoo_word:
    title: راستگو
    gloss: راستگو
    note: راستگو از راست (درست) و گو (گوینده) ساخته شده است؛ یعنی آدمی که حقیقت را می‌گوید.
    example_gloss: او راستگو است.
  prs.a1.unit37.lesson02.teach.review_and_but:
