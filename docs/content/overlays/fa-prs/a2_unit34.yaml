course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستان در سطح پیش‌متوسط: گفتن دلیل و نتیجه در یک پیام. دلیل با چون (و زیرا برای متن‌های نوشتاری)، نتیجه با به همین دلیل / برای همین و بنابراین، و به دلیل همراه با اسم، به‌همراه واژه‌هایی برای بهانه‌ها و تغییر برنامه.'
units:
  prs.a2.unit34.because_so:
    title: چون و پس
lessons:
  prs.a2.unit34.lesson01.ask_and_give_reasons:
    title: چرا؟ چون…
  prs.a2.unit34.lesson02.order_and_not_coming:
    title: ترتیب جمله‌ها و «نیامدم»
  prs.a2.unit34.lesson03.because_of_this:
    title: 'برای همین: به همین دلیل و برای همین'
  prs.a2.unit34.lesson04.because_of_and_therefore:
    title: به دلیل، بنابراین و زیرا
  prs.a2.unit34.lesson05.reading_and_listening:
    title: خواندن و شنیدن درباره دلیل‌ها
  prs.a2.unit34.lesson06.change_of_plan:
    title: گفت‌وگو درباره تغییر برنامه
teaching:
  prs.a2.unit34.lesson01.teach.headache:
    title: سردرد
    gloss: سردرد
    note: '*سردرد* یعنی «سردرد». می‌گویید *سردرد دارم* (سردرد دارم) و *سردرد داشتم* (سردرد داشتم). وقتی نمی‌توانید کاری را انجام بدهید، این دلیل خیلی رایجی است.'
    example_gloss: دیروز سردرد داشتم.
  prs.a2.unit34.lesson01.teach.tired:
    title: خسته
    gloss: خسته
    note: '*خسته* یعنی «خسته». صفت است، پس با *استم* (هستم) و *بودم* می‌آید: *خسته بودم* یعنی «خسته بودم».'
    example_gloss: امروز خیلی خسته‌ام.
  prs.a2.unit34.lesson01.teach.busy:
    title: مشغول
    gloss: مشغول، گرفتار
    note: '*مصروف* یعنی «مشغول». *مصروف بودم* یعنی «مشغول بودم». این دلیل کوتاه و معمول برای نرفتن به جلسه یا دیدار است.'
    example_gloss: این هفته سرم شلوغ است.
  prs.a2.unit34.lesson01.teach.weather:
    title: آب‌وهوا
    gloss: هوا
    note: '*هوا* هم یعنی وضعیت جوی و هم یعنی هوایی که تنفس می‌کنیم. *هوا خوب است* یعنی «هوا خوب است».'
    example_gloss: امروز هوا خوب است.
  prs.a2.unit34.lesson01.teach.cold:
    title: سرد
    gloss: سرد
    note: '*سرد* یعنی «سرد». *هوا سرد است* را درباره‌ی وضعیت هوا می‌گویند.'
    example_gloss: شب‌ها هوا سرد است.
  prs.a2.unit34.lesson01.teach.excuse:
    title: بهانه
    gloss: بهانه، دلیلی که می‌آورید
    note: '*عذر* دلیلی است که برای انجام ندادن کاری می‌آورید، یعنی «بهانه». یک *عذر* خوب جواب سؤال *چرا؟* است.'
    example_gloss: بهانه‌ی او سردرد بود.
  prs.a2.unit34.lesson01.teach.why_because:
    title: پرسیدن «چرا» و جواب دادن با «چون»
    gloss: چرا به اداره نرفتی؟ چون خسته بودم.
    note: '*چرا* دلیل را می‌پرسد و *چون* آن را می‌گوید. جواب می‌تواند یک جمله‌ی کامل باشد: *چون خسته بودم* (چون خسته بودم). در جواب کوتاه بقیه‌ی سؤال را تکرار نمی‌کنید. بعد از *چون* چیزی در جمله عوض نمی‌شود: فعل در آخر می‌آید، مثل هر جمله‌ی دری.'
  prs.a2.unit34.lesson01.teach.reason_sentence:
    title: به اداره نرفتم چون مریض بودم
    gloss: به اداره نرفتم چون مریض بودم.
    note: 'این الگوی اصلی این درس است: اول آنچه اتفاق افتاده، بعد ویرگول، بعد *چون* و دلیل. دو بخش جمله می‌توانند جایشان را هم عوض کنند: *چون مریض بودم، به دفتر نرفتم*.'
  prs.a2.unit34.lesson02.teach.friends:
    title: مرجان و هارون
    gloss: مرجان و هارون دوست هستند.
    note: 'مرجان و هارون دو دوست این درس‌اند. آن‌ها با هم با *تو* حرف می‌زنند. پایان *-ند* در *استند* نشانه‌ی جمع *است* است: یعنی «هستند».'
  prs.a2.unit34.lesson02.teach.came:
    title: 'آمدن: گذشته‌ی ساده'
    gloss: آمدم، آمدی، آمد، آمدیم، آمدید (رسمی یا جمع)، آمدند
    note: 'گذشته‌ی *آمدن* این است: *آمدم، آمدی، آمد، آمدیم، آمدین، آمدند*. مقصد را با *به* می‌گویید: *به جلسه آمدم* یعنی «به جلسه آمدم». شناسه‌ها همان شناسه‌های همه‌ی فعل‌های گذشته‌ای است که می‌شناسید.'
  prs.a2.unit34.lesson02.teach.did_not_come:
    title: 'نیامدم: ن + یامد'
    gloss: نیامدم، نیامدی، نیامد، نیامدیم، نیامدید، نیامدند
    note: 'منفی *آمدن* در گذشته *نیامدم* است. *ن* را قبل از فعل می‌گذارید: *نـ + آمدم* می‌شود *نیامدم*، با یک *ی* میان دو صدای *ا*. شکل‌های دیگر: *نیامدی، نیامد، نیامدیم، نیامدین، نیامدند*. برای *رفتن* ساده است: *نرفتم، نرفتی، نرفت*.'
  prs.a2.unit34.lesson02.teach.stay:
    title: ماندن
    gloss: ماندن، باقی ماندن
    note: '*ماندن* یعنی «ماندن». گذشته‌اش *ماندم، ماندی، ماندیم* و حال‌اش *می‌مانم، می‌مانی، می‌مانیم* است. *در خانه ماندم* یعنی «در خانه ماندم»؛ وقتی هوا بد است یا مریض هستید، خیلی به کار می‌رود.'
    example_gloss: امروز در خانه می‌مانم.
  prs.a2.unit34.lesson02.teach.either_order:
    title: دلیل می‌تواند اول بیاید یا آخر
    gloss: چون هوا سرد است، در خانه می‌مانم. / در خانه می‌مانم، چون هوا سرد است.
    note: 'جمله‌ای که با *چون* شروع می‌شود، می‌تواند قبل یا بعد از جملهٔ اصلی بیاید و معنی فرقی نمی‌کند. وقتی اول می‌آید، بعدش ویرگول می‌گذارند: *چون هوا سرد است، در خانه می‌مانم*. فعل در دری در هر دو حالت آخر هر جمله می‌ماند، پس ترتیب کلمات داخل جمله‌ها عوض نمی‌شود.'
  prs.a2.unit34.lesson02.teach.sorry:
    title: متأسفم، به جلسه نیامدم
    gloss: متأسفم، به جلسه نیامدم.
    note: '*متأسفم* یعنی «متأسفم». معمولاً اول این را می‌گویند و بعد با *چون* دلیل را بیان می‌کنند.'
  prs.a2.unit34.lesson02.teach.stayed_home:
    title: چون خسته بودم، در خانه ماندم
    gloss: چون خسته بودم، در خانه ماندم.
    note: دلیل (*خسته بودم*) در گذشته است و نتیجه (*در خانه ماندم*) هم در گذشته است.
  prs.a2.unit34.lesson03.teach.so_dalil:
    title: 'به همین دلیل: برای همین، بنابراین'
    gloss: سرم شلوغ بود. برای همین نیامدم.
    note: '*به همین دلیل* نتیجهٔ چیزی را می‌گوید که همین الان گفته‌اید. یعنی «به همین دلیل، برای همین». جملهٔ دوم را شروع می‌کند: اول دلیل (*مصروف بودم*)، بعد نتیجه (*به همین دلیل نیامدم*). این عبارت قرینهٔ *چون* است: *چون* دلیل را می‌آورد و *به همین دلیل* نتیجه را.'
  prs.a2.unit34.lesson03.teach.so_hamin:
    title: 'برای همین: به همین خاطر'
    gloss: هوا سرد بود. برای همین در خانه ماندیم.
    note: '*برای همین* هم‌معنی *به همین دلیل* و کوتاه‌تر است. در گفتگو زیاد به کار می‌رود و *به همین دلیل* کمی رسمی‌تر است. می‌توانید قبل از هر دو *و* بگذارید: *هوا سرد بود و برای همین در خانه ماندیم*.'
  prs.a2.unit34.lesson03.teach.because_vs_so:
    title: دو راه برای گفتن یک چیز
    gloss: چون مریض بودم، نیامدم. / مریض بودم. برای همین نیامدم.
    note: 'این دو جمله یک چیز را می‌گویند. با *چون* دلیل در یک جمله اول یا آخر می‌آید. با *به همین دلیل* دو جمله دارید: اول دلیل، بعد نتیجه. معنی دلیل همیشه یکی است. برای یک ارتباط فقط یک حرف ربط به کار ببرید: *چون* و *به همین دلیل* را در یک جمله با هم نیاورید.'
  prs.a2.unit34.lesson03.teach.busy_not_come:
    title: سرم شلوغ بود. برای همین نیامدم
    gloss: سرم شلوغ بود. برای همین نیامدم.
    note: 'یک پیام کوتاه برای توضیح دادن غیبت: اول دلیل، بعد نتیجه.'
  prs.a2.unit34.lesson03.teach.cold_stayed:
    title: هوا سرد بود. برای همین در خانه ماندیم
    gloss: هوا سرد بود. برای همین در خانه ماندیم.
    note: همین الگو با *برای همین*. *ماندیم* یعنی «ماندیم».
  prs.a2.unit34.lesson03.teach.car_broken:
    title: ماشینم خراب بود. برای همین دیر رسیدم
    gloss: ماشینم خراب بود. برای همین دیر رسیدم.
    note: 'نتیجه می‌تواند کاری دیگر باشد: نه فقط در خانه ماندن، بلکه دیر رسیدن.'
  prs.a2.unit34.lesson04.teach.be_dalil:
    title: 'به دلیل + اسم: به خاطر'
    gloss: به خاطر برف، به خاطر سردرد، به خاطر کار
    note: '*به دلیل* یعنی «به خاطر» و بعدش اسم می‌آید، نه یک جملهٔ کامل: *به دلیل برف*، *به دلیل سردرد*. جملهٔ بعدی نتیجه است. *به دلیل برف* همان کار *چون برف می‌بارید* را با کلمات کمتر می‌کند. وقتی فعل دارید از *چون* و وقتی فقط اسم دارید از *به دلیل* استفاده کنید.'
  prs.a2.unit34.lesson04.teach.snow_cancel:
    title: به خاطر برف، جلسه لغو شد
    gloss: به خاطر برف، جلسه لغو شد.
    note: '*لغو شد* یعنی «لغو شد». عبارت *به دلیل* اغلب اول جمله می‌آید و بعدش ویرگول می‌آید.'
  prs.a2.unit34.lesson04.teach.headache_office:
    title: به خاطر سردرد، به دفتر نرفتم
    gloss: به خاطر سردرد، به دفتر نرفتم.
    note: 'همین الگو با اسمی دیگر. می‌توانید آن را آخر هم بیاورید: *به دفتر نرفتم، به دلیل سردرد*.'
  prs.a2.unit34.lesson04.teach.change_plan:
    title: تغییر دادن
    gloss: تغییر دادن
    note: '*تغییر دادن* یعنی چیزی را عوض کردن. چیزی که تغییر می‌دهید با *را* قبل از فعل می‌آید: *برنامه را تغییر دادیم* یعنی «برنامه را عوض کردیم». گذشته *دادم، دادی، دادیم* و حال *می‌دهیم* است: *برنامه را تغییر می‌دهیم* یعنی «برنامه را عوض می‌کنیم».'
    example_gloss: برنامه را تغییر دادیم.
  prs.a2.unit34.lesson04.teach.banabarin:
    title: 'بنابراین: در نتیجه'
    gloss: راه بسته بود. در نتیجه اتوبوس نرفت.
    note: '*بنابراین* یعنی «در نتیجه» و جمله‌ای را شروع می‌کند که نتیجه را می‌گوید: اول دلیل، بعد *بنابراین* و نتیجه. کارش مثل *به همین دلیل* است، اما رسمی‌تر است. بیشتر در پیام‌های نوشتاری، اطلاعیه‌ها و گزارش‌ها دیده می‌شود. در گفتار بیشتر *برای همین* یا *به همین دلیل* می‌گویند.'
  prs.a2.unit34.lesson04.teach.zira:
    title: 'زیرا: چون (در نوشتار)'
    gloss: جلسه لغو شد، زیرا مدیر نیامد.
    note: '*زیرا* هم یعنی «چون»، اما در نوشتار دیده می‌شود، نه در گفتار. معمولاً بعد از نتیجه و ویرگول می‌آید: اول نتیجه، بعد *زیرا* و دلیل. وقتی صحبت می‌کنید یا برای دوستتان پیام می‌نویسید، از *چون* استفاده کنید. *زیرا* را فقط باید بشناسید.'
  prs.a2.unit34.lesson04.teach.connectors:
    title: کلمات دلیل و کلمات نتیجه
    gloss: 'چون، زیرا، به خاطر: دلیل. به همین دلیل، برای همین، بنابراین: نتیجه.'
    note: کلمات را بر اساس کارشان دسته‌بندی کنید. *چون*، *زیرا* و *به دلیل* همراه دلیل می‌آیند. *به همین دلیل*، *برای همین* و *بنابراین* همراه نتیجه می‌آیند. در گفتگو از *چون* و *برای همین* استفاده کنید. در پیام رسمی از *زیرا*، *به دلیل* و *بنابراین* استفاده کنید.
  prs.a2.unit34.lesson05.teach.meeting_today:
    title: جلسه (شکل اضافه)
    gloss: جلسهٔ ... (شکل اضافه)
    note: 'وقتی بعد از *جلسه* کلمهٔ دیگری بیاید که آن را توصیف می‌کند، نشانهٔ کوچکی (همزه روی *ه* پایانی) این دو را به هم وصل می‌کند: *جلسهٔ امروز* یعنی «جلسهٔ امروز». در نوشتار روزمره این نشانه را اغلب نمی‌نویسند.'
    example_gloss: جلسهٔ امروز ساعت ده است.
  prs.a2.unit34.lesson05.teach.niloufar:
    title: نیلوفر (اسم)
    gloss: نیلوفر (اسم زن)
    note: '*نیلوفر* اسم یک زن است. او پیامی را که می‌خوانید نوشته است.'
    example_gloss: نیلوفر در دفتر کار می‌کند.
  prs.a2.unit34.lesson05.teach.d1_t1:
    title: مرجان از هارون می‌پرسد چرا نیامده است
    gloss: هارون، چرا دیروز به جلسه نیامدی؟
    note: مرجان با *چرا* و گذشتهٔ ساده منفی *نیامدی* می‌پرسد. او با دوستش صحبت می‌کند، برای همین از *تو* استفاده می‌کند.
  prs.a2.unit34.lesson05.teach.d1_t2:
    title: هارون توضیح می‌دهد
    gloss: متأسفم. سردرد داشتم، برای همین در خانه ماندم.
    note: هارون عذرخواهی می‌کند و در دو جملهٔ کوتاه دلیل (*سردرد داشتم*) و نتیجه (*به همین دلیل در خانه ماندم*) را می‌گوید.
  prs.a2.unit34.lesson05.teach.d1_t3:
    title: مرجان دربارهٔ تماس تلفنی می‌پرسد
    gloss: چرا تلفن نکردی؟
    note: '*تیلفون نکردی* یعنی «تلفن نکردی». او با *چرا* یک دلیل دیگر می‌پرسد.'
  prs.a2.unit34.lesson05.teach.d1_t4:
    title: هارون دلیل دوم را می‌گوید
    gloss: چون گوشی‌ام خراب بود.
    note: 'یک پاسخ کوتاه: *چون* و دلیل، بدون چیز دیگری.'
  prs.a2.unit34.lesson05.teach.d1_t5:
    title: مرجان واکنش نشان می‌دهد
    gloss: چه بد! الان حالت خوب است؟
    note: '*چه بد!* واکنشی دوستانه به خبر بد است. *استی* شکل دوستانهٔ «هستی» است.'
  prs.a2.unit34.lesson05.teach.d1_t6:
    title: هارون جواب می‌دهد
    gloss: بله، الان خوبم.
    note: '*استم* یعنی «هستم».'
  prs.a2.unit34.lesson05.teach.message:
    title: پیامی از نیلوفر
    gloss: سلام مرجان. متأسفم، جلسهٔ امروز لغو شد، چون مدیر به دفتر نیامد. به خاطر برف، راه بسته بود. در نتیجه جلسه پنجشنبه است. نیلوفر
    note: 'یک پیام کوتاه نوشتاری. در آن از کلمات دلیلِ نوشتاری استفاده شده است: *زیرا* برای دلیل، *به دلیل برف* برای علتی که اسم است و *بنابراین* برای نتیجه.'
  prs.a2.unit34.lesson06.teach.d2_t1:
    title: هارون یک روز پیشنهاد می‌کند
    gloss: مرجان، چهارشنبه به پارک برویم؟
    note: 'حال ساده *می‌رویم* همراه با نام یک روز هفته یعنی یک برنامه: چهارشنبه می‌رویم. در آخر پرسش صدا بالا می‌رود.'
  prs.a2.unit34.lesson06.teach.d2_t2:
    title: مرجان دلیل می‌آورد
    gloss: چهارشنبه نه، چون برف می‌بارد.
    note: مرجان با *نه* رد می‌کند و با *چون* دلیل را می‌گوید. حال *برف می‌بارد* برای صحبت دربارهٔ آب‌وهوای فردا هم به کار می‌رود.
  prs.a2.unit34.lesson06.teach.d2_t3:
    title: هارون برنامه را تغییر می‌دهد
    gloss: پس برنامه را عوض می‌کنیم. پنجشنبه برویم؟
    note: '*پس* یعنی «پس، در این صورت». *برنامه را تغییر می‌دهیم* یعنی «برنامه را عوض می‌کنیم».'
  prs.a2.unit34.lesson06.teach.d2_t4:
    title: مرجان پنجشنبه نمی‌تواند بیاید
    gloss: پنجشنبه جلسه دارم، برای همین نمی‌توانم.
    note: دلیل (*جلسه دارم*) و نتیجه (*به همین دلیل نمی‌توانم*) در یک جمله با ویرگول به هم وصل شده‌اند. *نمی‌توانم* یعنی «نمی‌توانم».
  prs.a2.unit34.lesson06.teach.d2_t5:
    title: هارون روز دیگری را انتخاب می‌کند
    gloss: خوب، پس جمعه می‌رویم.
    note: '*پس* در اینجا یعنی «در این صورت»: موضوع حل شد.'
  prs.a2.unit34.lesson06.teach.d2_t6:
    title: مرجان موافقت می‌کند
    gloss: بله، جمعه خوب است.
    note: '*جمعه خوب است* یعنی «جمعه خوب است»؛ برای موافقت با یک برنامه گفته می‌شود.'
