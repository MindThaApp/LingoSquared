course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستانی در سطح پیش‌متوسطه: مرتب کردن رویدادها با جمله‌های زمانی، مثلاً «قبل از اینکه بروم»، «بعد از اینکه رسیدم» و «وقتی که آب جوش آمد». قبل از و بعد از با اسم، بعد از اینکه با گذشته، قبل از اینکه با فعل التزامی و وقتی که.'
units:
