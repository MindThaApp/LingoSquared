teaching:
  prs.a2.unit35.lesson01.teach.before:
    title: قبل
    gloss: قبل از (با اسم)
    note: '*قبل از* یعنی «قبل از». بعد از آن اسم می‌آید و فعل جداگانه‌ای ندارد: *قبل از صبحانه* یعنی «قبل از صبحانه».'
    example_gloss: قبل از صبحانه دوش می‌گیرم.
  prs.a2.unit35.lesson01.teach.after:
    title: بعد از
    gloss: بعد از (با اسم)
    note: '*بعد از* یعنی «بعد از» و آن هم اسم می‌گیرد: *بعد از مکتب* یعنی «بعد از مدرسه».'
    example_gloss: بعد از مدرسه به خانه می‌روم.
  prs.a2.unit35.lesson01.teach.dinner:
    title: شام
    gloss: شام، غذای شب
    note: '*شام* یعنی غذای شب. *می‌خورم* هم «می‌خورم» و هم «می‌نوشم» است: *شام می‌خورم* یعنی «شام می‌خورم» و *چای می‌خورم* یعنی «چای می‌نوشم». در دری برای هر دو یک فعل به کار می‌رود.'
    example_gloss: بعد از شام چای می‌خورم.
  prs.a2.unit35.lesson01.teach.get_dressed:
    title: لباس پوشیدن
    gloss: لباس پوشیدن
    note: '*لباس* یعنی «لباس» و *پوشیدن* یعنی «پوشیدن». *لباس می‌پوشم* یعنی «لباسم را می‌پوشم»؛ *می‌پوشم* حال ساده برای «من» است.'
    example_gloss: هر صبح لباس می‌پوشم.
  prs.a2.unit35.lesson01.teach.wake_up:
    title: بیدار شدن
    gloss: بیدار شدن
    note: '*بیدار شدن* یعنی «بیدار شدن». *شدن* یعنی «شدن»، پس *بیدار می‌شوم* یعنی «بیدار می‌شوم».'
    example_gloss: ساعت شش بیدار می‌شوم.
  prs.a2.unit35.lesson01.teach.noun_pattern:
    title: قبل از و بعد از با اسم
    gloss: قبل از صبحانه، بعد از صبحانه، قبل از مدرسه، بعد از مدرسه، قبل از شام، بعد از شام
    note: 'برای گفتن زمان یک کار، اسم را مستقیم بعد از *قبل از* یا *بعد از* بگذارید: *قبل از صبحانه*، *بعد از مکتب*. این عبارت فعل جداگانه ندارد؛ فعل در بخش اصلی جمله می‌آید. این عبارت می‌تواند اول جمله بیاید (*بعد از شام چای می‌خورم*) یا آخر جمله (*چای می‌خورم بعد از شام*).'
  prs.a2.unit35.lesson01.teach.sequence_words:
    title: اول، بعد، بعد از آن، در آخر
    gloss: اول بیدار می‌شوم. بعد دوش می‌گیرم. بعد از آن صبحانه می‌خورم. در آخر به مدرسه می‌روم.
    note: 'برای تعریف کردن یک روز به ترتیب، از واژه‌های پیوندی کوتاه استفاده کنید: *اول*، *بعد*، *بعد از آن* و *در آخر*. *بعد از آن* همان *بعد از* است و *آن* اسمش است، پس به مرحلهٔ قبلی اشاره می‌کند.'
  prs.a2.unit35.lesson01.teach.phrase_school:
    title: بعد از صبحانه به مدرسه می‌روم
    gloss: بعد از صبحانه به مدرسه می‌روم.
    note: اسم *صبحانه* بعد از *بعد از* می‌آید و فعل *می‌روم* آخر جمله است. این ساده‌ترین راه برای گفتن ترتیب کارهاست.
  prs.a2.unit35.lesson02.teach.ticket:
    title: بلیت
    gloss: بلیت (هواپیما یا بس)
    note: '*تکت* بلیت هواپیما یا بس است. *تکت گرفتن* یعنی بلیت گرفتن یا خریدن.'
    example_gloss: بلیت هواپیما را گرفتم.
  prs.a2.unit35.lesson02.teach.suitcase:
    title: چمدان
    gloss: چمدان
    note: '*چمدان* یعنی «چمدان». با افزودن *-م* می‌شود «چمدانِ من»: *چمدانم*.'
    example_gloss: چمدانم در خانه است.
  prs.a2.unit35.lesson02.teach.pack:
    title: چمدانم را بستم
    gloss: چمدانم را بستم.
    note: '*چمدان را بستن* یعنی چمدان را بستن و جمع کردن (فعل *بستن* همان است که در *دروازه بسته است* هست). اول چمدان می‌آید، بعد *را*، بعد فعل: *بستم* گذشتهٔ ساده برای «من» است.'
  prs.a2.unit35.lesson02.teach.after_past:
    title: بعد از اینکه + گذشته
    gloss: بعد از اینکه بلیت را گرفتم، چمدانم را بستم.
    note: '*بعد از اینکه* یعنی «بعد از اینکه» و جمله‌ای با فعل خودش آغاز می‌کند. وقتی ماجرایی را در گذشته تعریف می‌کنید، این فعل گذشتهٔ ساده است: *بعد از اینکه تکت را گرفتم* یعنی «بعد از اینکه بلیت را گرفتم». جملهٔ اصلی می‌گوید بعد چه شد: *چمدانم را بستم*. کاری که در جملهٔ *بعد از اینکه* آمده اول اتفاق افتاده است.'
  prs.a2.unit35.lesson02.teach.after_habit:
    title: بعد از اینکه برای عادت‌ها
    gloss: بعد از اینکه به ایستگاه می‌رسم، بلیت می‌گیرم.
    note: 'برای کاری که بارها تکرار می‌شود، فعل را در حال با *می‌* بیاورید: *بعد از اینکه به ایستگاه می‌رسم* یعنی «بعد از اینکه به ایستگاه می‌رسم» و *تکت می‌گیرم* یعنی «بلیت می‌گیرم». *می‌رسم* حال *رسیدن* برای «من» است.'
  prs.a2.unit35.lesson02.teach.swap:
    title: جمله‌ها می‌توانند جابه‌جا شوند
    gloss: چمدانم را بستم، بعد از اینکه بلیت را گرفتم.
    note: 'می‌توانید جملهٔ *بعد از اینکه* را دوم بگویید. معنا عوض نمی‌شود: کاری که در جملهٔ *بعد از اینکه* آمده باز هم اول اتفاق افتاده است. فقط ترتیب کلمه‌ها عوض می‌شود، نه ترتیب رویدادها.'
  prs.a2.unit35.lesson02.teach.noun_or_clause:
    title: اسم یا جمله
    gloss: بعد از شام / بعد از اینکه شام خوردم
    note: '*بعد از* را با اسم و *بعد از اینکه* را با یک جملهٔ کامل به کار ببرید. *بعد از شام* یعنی «بعد از شام». *بعد از اینکه شام خوردم* یعنی «بعد از اینکه شام خوردم». دومی فعل دارد، پس می‌تواند نشان بدهد چه کسی آن کار را کرده است.'
  prs.a2.unit35.lesson02.teach.phrase_station:
    title: بعد از اینکه به ایستگاه رسیدم، تلفن زدم
    gloss: بعد از اینکه به ایستگاه رسیدم، تلفن زدم.
    note: 'یک توالی واقعی در سفر: اول *رسیدم* (رسیدن)، بعد *تیلفون کردم* (تلفن زدن). *تیلفون کردن* راه معمول گفتن «تلفن زدن» است.'
  prs.a2.unit35.lesson03.teach.subjunctive_forms:
    title: قبل از اینکه + فعل التزامی
    gloss: قبل از اینکه برسم، قبل از اینکه بروم، قبل از اینکه بخورم، قبل از اینکه بیایم، قبل از اینکه بخرم
    note: '*قبل از اینکه* یعنی «قبل از اینکه» و جمله‌ای با فعل خودش آغاز می‌کند. این فعل گذشته نیست، التزامی است، همان شکلی که بعد از *باید* می‌آید: *ب-* + بن مضارع + شناسه. *رسیدن* می‌شود *برسم*، *رفتن* می‌شود *بروم*، *خوردن* می‌شود *بخورم*، *آمدن* می‌شود *بیایم*، *خریدن* می‌شود *بخرم*.'
  prs.a2.unit35.lesson03.teach.subjunctive_paradigm:
    title: شناسه‌های فعل التزامی
    gloss: که من برسم، که تو برسی، که او برسد، که ما برسیم، که شما برسید (رسمی یا جمع)، که آن‌ها برسند
    note: 'شناسه‌ها این‌هاست: *-م، -ی، -د، -یم، -ین، -ند*. پس *قبل از اینکه من برسم* یعنی «قبل از اینکه من برسم»، *قبل از اینکه تو برسی* «قبل از اینکه تو برسی» (به دوست)، *قبل از اینکه او برسد* «قبل از اینکه او برسد»، *قبل از اینکه ما برسیم* «قبل از اینکه ما برسیم»، *قبل از اینکه شما برسین* «قبل از اینکه شما برسید» (رسمی یا جمع)، *قبل از اینکه آن‌ها برسند* «قبل از اینکه آن‌ها برسند». در دری شناسهٔ دوم شخص جمع *-ین* است؛ شکل نوشتاری *-ید* هم فهمیده می‌شود.'
  prs.a2.unit35.lesson03.teach.past_story:
    title: حتی در ماجرای گذشته
    gloss: قبل از اینکه از خانه بروم، چمدانم را بستم.
    note: 'ماجرا در گذشته است، پس انتظار دارید بعد از *قبل از اینکه* فعل گذشته بیاید. اما فعل التزامی می‌آید: *بروم*، نه *رفتم*. دلیلش این است که در لحظهٔ بستن چمدان هنوز رفتن اتفاق نیفتاده بود. برای این مورد نگویید *قبل از اینکه رفتم* یا *قبل از اینکه می‌روم*. جملهٔ اصلی گذشتهٔ ساده است: *چمدانم را بستم*.'
  prs.a2.unit35.lesson03.teach.noun_or_clause:
    title: اسم یا جمله
    gloss: قبل از شام / قبل از اینکه شام بخورم
    note: 'با اسم از *قبل از* استفاده کنید: *قبل از شام*. با جمله، *اینکه* را اضافه کنید و فعل را التزامی بیاورید: *قبل از اینکه شام بخورم*. این شبیه *بعد از شام* و *بعد از اینکه شام خوردم* است، با این تفاوت که بعد از *بعد از اینکه* فعل گذشته است و بعد از *قبل از اینکه* التزامی.'
  prs.a2.unit35.lesson03.teach.rice:
    title: برنج
    gloss: برنج
    note: '*برنج* یعنی «برنج». در آشپزی افغانی یکی از غذاهای اصلی است.'
    example_gloss: من برنج می‌خورم.
  prs.a2.unit35.lesson03.teach.onion:
    title: پیاز
    gloss: پیاز
    note: '*پیاز* یعنی «پیاز». خیلی از غذاها با پیاز شروع می‌شوند.'
    example_gloss: در خانه پیاز هست.
  prs.a2.unit35.lesson03.teach.chop:
    title: خرد کردن
    gloss: خرد کردن، ریز کردن
    note: '*خرد کردن* یعنی چیزی را ریز ریز کردن. مفعول با *را* اول می‌آید: *پیاز را خرد می‌کنم* یعنی «پیاز را خرد می‌کنم».'
    example_gloss: پیاز را خرد می‌کنم.
  prs.a2.unit35.lesson03.teach.cook:
    title: پختن
    gloss: پختن
    note: '*پختن* یعنی غذا پختن. ریشهٔ حال آن *پز* است: *می‌پزم* یعنی «می‌پزم»، *بپزم* یعنی «بپزم» (وجه التزامی که بعد از *قبل از اینکه* می‌آید) و *پختم* یعنی «پختم».'
    example_gloss: برنج می‌پزم.
  prs.a2.unit35.lesson03.teach.sleep:
    title: خوابیدن
    gloss: خوابیدن، به رختخواب رفتن
    note: '*خوابیدن* یعنی خواب بودن یا به رختخواب رفتن. *می‌خوابم* یعنی «می‌خوابم» و *بخوابم* یعنی «بخوابم» (وجه التزامی).'
    example_gloss: ساعت ده می‌خوابم.
  prs.a2.unit35.lesson03.teach.phrase_cook:
    title: قبل از اینکه برنج را بپزم، پیاز را خرد می‌کنم
    gloss: قبل از اینکه برنج را بپزم، پیاز را خرد می‌کنم.
    note: 'مراحل پخت به ترتیب. *بپزم* بعد از *قبل از اینکه* به وجه التزامی می‌آید؛ *خرد می‌کنم* مضارع برای عادت یا دستور پخت است: اول پیاز، بعد برنج.'
  prs.a2.unit35.lesson04.teach.when_past:
    title: وقتی که برای یک اتفاق در گذشته
    gloss: وقتی به خانه رسیدم، شام خوردم.
    note: '*وقتی که* یعنی «وقتی» و جمله‌ای با فعل خودش شروع می‌کند. برای یک اتفاق در گذشته، در هر دو بخش ماضی ساده می‌آید: *وقتی که به خانه رسیدم* (وقتی به خانه رسیدم)، *شام خوردم* (شام خوردم). دو اتفاق تقریباً هم‌زمان یا پشت سر هم رخ می‌دهند.'
  prs.a2.unit35.lesson04.teach.when_habit:
    title: وقتی که برای یک عادت
    gloss: وقتی به خانه می‌رسم، چای می‌خورم.
    note: 'برای کاری که هر بار اتفاق می‌افتد، در هر دو بخش مضارع با *می‌* می‌آید: *وقتی که به خانه می‌رسم، چای می‌خورم* یعنی «وقتی به خانه می‌رسم، چای می‌خورم».'
  prs.a2.unit35.lesson04.teach.when_future:
    title: وقتی که برای کاری که هنوز نیامده
    gloss: فردا وقتی به هرات برسم، تلفن می‌کنم.
    note: 'وقتی زمان هنوز نیامده، فعل بعد از *وقتی که* وجه التزامی است (*برسم*) و فعل اصلی مضارع با *می‌* همراه یک قید زمان است: *فردا ... تیلفون می‌کنم* (یعنی «فردا تلفن می‌کنم»). به شکل آینده‌ٔ جداگانه‌ای نیازی نیست.'
  prs.a2.unit35.lesson04.teach.water:
    title: آب
    gloss: آب
    note: '*آب* یعنی «آب». آب سرد می‌شود *آب سرد*؛ برای آب گرم می‌گویند *آب گرم*.'
    example_gloss: آب گرم است.
  prs.a2.unit35.lesson04.teach.boil:
    title: جوش آمدن
    gloss: جوش آمدن (دربارهٔ آب)
    note: '*جوش شدن* یعنی جوش آمدن. ماضی ساده‌اش *جوش شد* و مضارعش *جوش می‌شود* است: *آب جوش می‌شود* یعنی «آب می‌جوشد».'
    example_gloss: آب به جوش آمد.
  prs.a2.unit35.lesson04.teach.salt:
    title: نمک
    gloss: نمک
    note: '*نمک* یعنی «نمک». در یک دستور پخت ساده با *برنج* و *آب* می‌آید.'
    example_gloss: در خانه نمک و برنج هست.
  prs.a2.unit35.lesson04.teach.throw_in:
    title: ریختن
    gloss: انداختن، ریختن توی چیزی
    note: '*انداختن* یعنی چیزی را انداختن یا داخل چیزی ریختن. در آشپزی فعل معمول برای اضافه کردن است: *نمک را می‌اندازم* یعنی «نمک را می‌ریزم». ماضی ساده‌اش *انداختم* است.'
    example_gloss: نمک را در آب می‌ریزم.
  prs.a2.unit35.lesson04.teach.phrase_boil:
    title: وقتی آب به جوش بیاید، برنج را می‌ریزم
    gloss: وقتی آب جوش می‌آید، برنج را می‌ریزم.
    note: 'یک عادت در دستور پخت: هر دو فعل مضارع با *می‌* هستند.'
  prs.a2.unit35.lesson04.teach.when_short:
    title: وقتی که یا فقط وقتی
    gloss: وقتی رسیدم / وقتی رسیدم
    note: هر دو شکل درست است. *وقتی که* کمی کامل‌تر و *وقتی* کوتاه‌تر است و معنی یکی است. در این دوره اول *وقتی که* می‌آید؛ می‌توانید هر کدام را بنویسید.
  prs.a2.unit35.lesson04.teach.phrase_ready:
    title: وقتی برنج آماده شد، آن را خوردم
    gloss: وقتی برنج آماده شد، آن را خوردم.
    note: '*آماده شد* یعنی «آماده شد». *آن را* (آن، با *را*) به برنج برمی‌گردد.'
  prs.a2.unit35.lesson05.teach.pack_present:
    title: چمدان بستن
    gloss: چمدان بستن
    note: '*چمدان بستن* یعنی چمدان را بستن. مضارع برای «من» *می‌بندم* است: *چمدانم را می‌بندم* یعنی «چمدانم را می‌بندم». ماضی ساده‌اش *بستم* است.'
    example_gloss: قبل از سفر چمدانم را می‌بندم.
  prs.a2.unit35.lesson05.teach.travel_turn01:
    title: نرگس دربارهٔ ساعت پرواز می‌پرسد
    gloss: اکبر، هواپیما فردا ساعت چند حرکت می‌کند؟
    note: نرگس با *ساعت چند* دربارهٔ زمان می‌پرسد. *حرکت می‌کند* مضارع *حرکت کردن* است؛ با *فردا* می‌گوید فردا چه اتفاقی می‌افتد.
  prs.a2.unit35.lesson05.teach.travel_turn02:
    title: اکبر ساعت و اولین کار را می‌گوید
    gloss: ساعت ده. قبل از اینکه به فرودگاه بروم، چمدانم را می‌بندم.
    note: اکبر ساعت را می‌گوید، بعد با جملهٔ *قبل از اینکه* می‌گوید اول چه کار می‌کند. *بروم* وجه التزامی است و *می‌بندم* مضارع با معنی آینده است.
  prs.a2.unit35.lesson05.teach.travel_turn03:
    title: نرگس دربارهٔ بلیت می‌پرسد
    gloss: بلیت داری؟
    note: '*تکت داری؟* پرسشی دوستانه از یک دوست است: *داری* یعنی «داری» به شکل صمیمی مفرد.'
  prs.a2.unit35.lesson05.teach.travel_turn04:
    title: اکبر می‌گوید بلیت دارد
    gloss: بله، دیروز بلیت را گرفتم.
    note: '*گرفتم* ماضی ساده است: دیروز بلیت را گرفته است. *بلی* یعنی «بله».'
  prs.a2.unit35.lesson05.teach.travel_turn05:
    title: نرگس از او می‌خواهد وقتی رسید تلفن کند
    gloss: وقتی به هرات برسی، به من تلفن می‌کنی؟
    note: جملهٔ *وقتی که به هرات برسی* هنوز در آینده است، پس فعل وجه التزامی *برسی* است. *به من تیلفون می‌کنی؟* یعنی «به من تلفن می‌کنی؟».
  prs.a2.unit35.lesson05.teach.travel_turn06:
    title: اکبر قول می‌دهد
    gloss: بله. وقتی برسم، تلفن می‌کنم.
    note: 'اکبر از همان ساختار استفاده می‌کند: *وقتی که برسم*، وجه التزامی برای «من»، بعد *تیلفون می‌کنم*.'
  prs.a2.unit35.lesson05.teach.message:
    title: پیامی دربارهٔ پختن برنج
    gloss: سلام اکبر. دیروز در خانه برنج پختم. اول پیاز را خرد کردم. بعد از اینکه آب به جوش آمد، نمک و برنج را ریختم. وقتی برنج آماده شد، آن را خوردم. قبل از اینکه بخوابم، چای خوردم.
    note: 'پیامی کوتاه که هر سه حرف ربط را برای گفتن مراحل به ترتیب به کار می‌برد: *اول*، *بعد از اینکه*، *وقتی که* و *قبل از اینکه*.'
  prs.a2.unit35.lesson06.teach.work_my:
    title: کار من
    gloss: کارم، شغلم
    note: '*کار* یعنی «کار» و *کارم* یعنی «کارم». *کارم را شروع می‌کنم* یعنی «کارم را شروع می‌کنم».'
    example_gloss: کارم در دفتر است.
  prs.a2.unit35.lesson06.teach.morning_turn01:
    title: نسرین می‌پرسد یوسف کی بیدار می‌شود
    gloss: یوسف، هر صبح چه ساعتی بیدار می‌شوی؟
    note: '*هر صبح* یعنی «هر صبح». *چه وقت* یعنی «کی» و *بیدار می‌شوی* یعنی «بیدار می‌شوی» (به یک دوست).'
  prs.a2.unit35.lesson06.teach.morning_turn02:
    title: یوسف ساعت و اولین کار را می‌گوید
    gloss: ساعت شش. بعد از اینکه بیدار می‌شوم، دوش می‌گیرم.
    note: 'عادت است، پس فعل‌های بعد از *بعد از اینکه* مضارع با *می‌* هستند: *بیدار می‌شوم*، بعد *دوش می‌گیرم*.'
  prs.a2.unit35.lesson06.teach.morning_turn03:
    title: نسرین می‌پرسد بعدش چه می‌کند
    gloss: بعد از آن چه کار می‌کنی؟
    note: '*بعد از آن* یعنی «بعد از آن». به کاری که همین الان گفته شد برمی‌گردد.'
  prs.a2.unit35.lesson06.teach.morning_turn04:
    title: یوسف کارهای بعدی را می‌گوید
    gloss: لباس می‌پوشم. قبل از اینکه به دفتر بروم، صبحانه می‌خورم.
    note: '*لباس می‌پوشم* کار بعدی است. بعد جملهٔ *قبل از اینکه*: *بروم* وجه التزامی و *صبحانه می‌خورم* فعل اصلی است.'
  prs.a2.unit35.lesson06.teach.morning_turn05:
    title: نسرین دربارهٔ ساعت رفتن به دفتر می‌پرسد
    gloss: ساعت چند به دفتر می‌روی؟
    note: '*ساعت چند* ساعت را می‌پرسد و *می‌روی* یعنی «می‌روی».'
  prs.a2.unit35.lesson06.teach.morning_turn06:
    title: یوسف می‌گوید در دفتر چه می‌کند
    gloss: ساعت هشت. وقتی می‌رسم، اول کارم را شروع می‌کنم.
    note: '*وقتی که می‌رسم* یعنی «وقتی می‌رسم» (عادت: هر روز) و *اول کارم را شروع می‌کنم* یعنی «اول کارم را شروع می‌کنم».'
  prs.a2.unit35.lesson06.teach.summary:
    title: هر سه حرف ربط با هم
    gloss: قبل از اینکه بروم؛ بعد از اینکه رسیدم؛ وقتی که رسیدم
    note: 'سه حرف ربط، سه ساختار. *قبل از اینکه* + وجه التزامی (*بروم*): فعل با *ب-* می‌آید. *بعد از اینکه* + ماضی ساده (*رسیدم*) در روایت، یا مضارع برای عادت (*بیدار می‌شوم*): کار اول تمام شده است. *وقتی که* + ماضی ساده، مضارع یا وجه التزامی: زمان فعل نشان می‌دهد یک بار بوده، عادت است یا هنوز نیامده. با اسم، *قبل از* یا *بعد از* تنها می‌آید.'
