teaching:
  prs.a2.unit28.lesson01.teach.weather:
    title: آب‌وهوا
    gloss: هوا
    note: '*هوا* هم یعنی وضع هوا و هم یعنی هوای تنفس. *هوای کابل* یعنی وضع هوای کابل: پیش از نام جا، *-ی* اضافه می‌شود تا دو کلمه به هم وصل شوند.'
    example_gloss: امروز هوای کابل سرد است.
  prs.a2.unit28.lesson01.teach.cold:
    title: سرد
    gloss: سرد
    note: '*سرد* یعنی خنک و یخ. متضادش *گرم* است که آن را می‌دانید. *هوا سرد است* یعنی الان سرد است؛ *هوا سرد می‌شود* یعنی سرد خواهد شد.'
    example_gloss: فردا صبح هوا سرد می‌شود.
  prs.a2.unit28.lesson01.teach.sunny:
    title: آفتابی
    gloss: آفتابی
    note: '*آفتابی* یعنی هوای آفتابی: *هوا آفتابی است* یعنی هوا آفتابی است.'
    example_gloss: امروز هوا آفتابی است.
  prs.a2.unit28.lesson01.teach.cloudy:
    title: ابری
    gloss: ابری
    note: '*ابری* یعنی پر از ابر. ابر اغلب پیش از *باران* و *برف* می‌آید.'
    example_gloss: امشب هوا ابری می‌شود.
  prs.a2.unit28.lesson01.teach.forecast:
    title: پیش‌بینی
    gloss: پیش‌بینی
    note: '*پیش‌بینی* یعنی گفتن چیزی که قرار است اتفاق بیفتد. *پیش‌بینی هوا* یعنی پیش‌بینی وضع هوا. این واژه را در رادیو، تلویزیون و تلفن پیش از برنامه‌ریزی سفر می‌شنوید.'
    example_gloss: پیش‌بینی هوا را دیدم.
  prs.a2.unit28.lesson01.teach.tonight:
    title: امشب
    gloss: امشب، همین شب
    note: '*امشب* یعنی همین شب. یک قید زمان است، مثل *فردا* و *امروز*. این اولین قید زمانی است که برای گفتن از آینده به کار می‌برید.'
    example_gloss: امشب باران می‌بارد.
  prs.a2.unit28.lesson01.teach.dayafter:
    title: پس‌فردا
    gloss: پس‌فردا
    note: '*پس‌فردا* یعنی روز بعد از فردا. این کلمه با یک فاصلهٔ کوچک (نیم‌فاصله) در وسطش نوشته می‌شود، مثل *می‌شود*.'
    example_gloss: پس‌فردا هوا گرم می‌شود.
  prs.a2.unit28.lesson01.teach.predict_form:
    title: 'پیش‌بینی: «می‌» به‌علاوهٔ قید زمان'
    gloss: فردا باران می‌بارد. امشب هوا سرد می‌شود. پس‌فردا هوا آفتابی می‌شود.
    note: 'برای گفتن اینکه چه اتفاقی می‌افتد، از حال ساده با *می‌* استفاده می‌کنید و یک قید زمان در جمله می‌گذارید. فعل تغییر نمی‌کند: *می‌بارد* (می‌بارد) و *فردا باران می‌بارد* (فردا باران خواهد بارید) یک فعل‌اند. قید زمانِ *فردا*، *امشب* یا *پس‌فردا* به شنونده نشان می‌دهد که حرف از آینده است. برای آب‌وهوا اغلب از *می‌شود* استفاده می‌کنید: *فردا هوا سرد می‌شود* یعنی فردا هوا سرد خواهد شد. این راه عادی گفتاری برای پیش‌بینی چیزی است که تقریباً از آن مطمئنید.'
  prs.a2.unit28.lesson01.teach.plans_form:
    title: یک شکل برای برنامه‌ها و اتفاق‌ها
    gloss: فردا به بازار می‌روم. هفتهٔ آینده به بامیان می‌رویم.
    note: 'همین حال با *می‌* و یک قید زمان برای آدم‌ها هم کار می‌کند: *فردا به بازار می‌روم* یعنی فردا به بازار خواهم رفت، و *هفتهٔ آینده به بامیان می‌رویم* یعنی هفتهٔ آینده به بامیان خواهیم رفت. اینجا شکل *ما* را یاد بگیرید: *می‌رویم* (می‌رویم). قیدهای زمان دیگر: *امسال* (امسال)، *هفتهٔ آینده* (هفتهٔ بعد)، *بعد* (بعداً).'
  prs.a2.unit28.lesson01.teach.sentence:
    title: فردا هوا سرد می‌شود
    gloss: فردا هوا سرد می‌شود.
    note: 'این الگوی کل این درس است: یک قید زمان، یک نهاد و یک فعل ساده با *می‌*. به هیچ پایان ویژهٔ آینده نیازی ندارید.'
  prs.a2.unit28.lesson02.teach.maybe:
    title: شاید
    gloss: شاید، ممکن است
    note: '*شاید* یعنی «احتمالاً ممکن است». این کلمه اول جمله می‌آید و فعلِ بعد از آن به وجه التزامی است (همان شکلی که بعد از *باید* به کار می‌رود)، چون گوینده مطمئن نیست: *شاید برف ببارد* یعنی شاید برف ببارد. *ممکن است برف ببارد* هم همین معنی را دارد.'
    example_gloss: شاید فردا باران ببارد.
  prs.a2.unit28.lesson02.teach.probably:
    title: احتمالاً
    gloss: احتمالاً، به‌احتمال زیاد
    note: '*احتمالاً* از *شاید* قوی‌تر است: فکر می‌کنید بیشتر احتمال دارد که اتفاق بیفتد. بعد از آن حال ساده می‌آید، نه التزامی: *احتمالاً امشب برف می‌بارد*.'
    example_gloss: امشب احتمالاً برف می‌بارد.
  prs.a2.unit28.lesson02.teach.possible:
    title: ممکن است برف ببارد
    gloss: ممکن است برف ببارد.
    note: '*ممکن است* یعنی «امکان دارد که». مثل *شاید*، بعد از آن فعل التزامی می‌آید: *ممکن است برف ببارد*.'
  prs.a2.unit28.lesson02.teach.subj_form:
    title: 'وجه التزامی: «ب» به‌علاوهٔ ریشهٔ حال'
    gloss: که من بروم، که تو بروی، که او برود، که ما برویم، که شما بروید (محترمانه یا جمع)، که آن‌ها بروند
    note: 'وجه التزامی از ریشهٔ حال ساخته می‌شود که *ب* جلوی آن می‌آید و شناسه‌ها همان شناسه‌های حال‌اند: *می‌روم* (می‌روم) می‌شود *بروم* (که بروم). شناسه‌ها *-م، -ی، -د، -یم، -ین، -ند* هستند، پس می‌شود *بروم، بروی، برود، برویم، بروین، بروند*. این شکل را از *باید* می‌شناسید؛ *شاید* هم همین را به کار می‌برد. جلوی آن *می‌* نگذارید.'
  prs.a2.unit28.lesson02.teach.subj_more:
    title: وجه التزامی فعل‌های دیگر
    gloss: شاید او بیاید. شاید اتوبوس برسد. شاید برف ببارد. شاید خراب شود.
    note: 'همین قاعده برای هر فعلی کار می‌کند: *آمدن* می‌شود *بیاید* (که بیاید)، *رسیدن* می‌شود *برسد* (که برسد)، *باریدن* می‌شود *ببارد* (که ببارد). *شدن* شکل کوتاه *شود* را دارد، پس می‌گویید *شاید خراب شود*. با *بودن* التزامی *باشد* است: *شاید در خانه باشد*.'
  prs.a2.unit28.lesson02.teach.subj_negative:
    title: 'منفی: «ن» جلوی وجه التزامی'
    gloss: شاید او نیاید. شاید ما نرویم. شاید برف نبارد.
    note: 'برای «شاید نه»، *ن* را جلوی فعل التزامی بگذارید و *ب* را بردارید: *بروم* می‌شود *نروم*، *برویم* می‌شود *نرویم*، *ببارد* می‌شود *نبارد*. فعل *آمدن* را باید به خاطر بسپارید: منفی آن *نیاید* است (نه *نبیاید*).'
  prs.a2.unit28.lesson02.teach.sentence:
    title: شاید فردا برف ببارد
    gloss: شاید فردا برف ببارد.
    note: با *فردا برف می‌بارد* مقایسه کنید. آن جمله می‌گوید برف خواهد بارید؛ این جمله می‌گوید ممکن است ببارد.
  prs.a2.unit28.lesson02.teach.sure_vs_maybe:
    title: مطمئن یا نامطمئن
    gloss: فردا می‌آید. شاید فردا بیاید.
    note: 'فعل به شنونده نشان می‌دهد چقدر مطمئنید. با *می‌* مطمئنید: *فردا می‌آید* یعنی فردا می‌آید. با *شاید* فعل التزامی است و مطمئن نیستید: *شاید فردا بیاید* یعنی شاید فردا بیاید.'
  prs.a2.unit28.lesson03.teach.surely:
    title: حتماً
    gloss: حتماً، قطعاً
    note: '*حتماً* یعنی قطعاً. آن را جلوی یک فعل ساده با *می‌* بگذارید تا قول یا تصمیم قطعی بدهید: *حتماً می‌آیم* یعنی حتماً می‌آیم.'
    example_gloss: فردا حتماً می‌آیم.
  prs.a2.unit28.lesson03.teach.promise_word:
    title: قول
    gloss: قول، وعده
    note: '*قول* یعنی وعده. *قول می‌دهم* یعنی قول می‌دهم؛ در اصل یعنی «قول می‌دهم». می‌توانید *که* و یک جمله هم اضافه کنید: *قول می‌دهم که می‌آیم*.'
    example_gloss: قول می‌دهم که می‌آیم.
  prs.a2.unit28.lesson03.teach.give_promise:
    title: قول می‌دهم
    gloss: قول می‌دهم.
    note: '*می‌دهم* یعنی می‌دهم. *می‌دهین* (می‌دهید) را از قبل می‌شناسید؛ این شکل *من* است. وقتی می‌خواهید طرف مقابل به شما اعتماد کند، بگویید *قول می‌دهم*.'
  prs.a2.unit28.lesson03.teach.forget:
    title: فراموش
    gloss: فراموش‌شده؛ فراموش کردن
    note: '*فراموش کردن* یعنی از یاد بردن. قول اغلب با *فراموش نمی‌کنم* (فراموش نمی‌کنم) تمام می‌شود.'
    example_gloss: کلیدم را فراموش نمی‌کنم.
  prs.a2.unit28.lesson03.teach.later:
    title: بعداً
    gloss: بعداً، پس از آن
    note: '*بعداً* یعنی دیرتر. قید زمانی است برای قولی که به‌زودی، ولی نه همین حالا، به آن عمل می‌کنید.'
    example_gloss: بعداً تلفن می‌کنم.
  prs.a2.unit28.lesson03.teach.promise_form:
    title: 'قول: «حتماً» به‌علاوهٔ حال ساده'
    gloss: حتماً می‌آیم. حتماً تلفن می‌کنم. حتماً کمک می‌کنم. حتماً می‌فرستم.
    note: 'قول دو بخش دارد: *حتماً* و یک فعل ساده با *می‌* در شکل *من*. شکل ویژه‌ای وجود ندارد. قید زمان می‌تواند باشد یا نباشد: *حتماً امشب تیلفون می‌کنم* یعنی حتماً امشب تلفن می‌کنم. برای قول دادن به کسی می‌توانید اول *قول می‌دهم* را هم بگویید.'
  prs.a2.unit28.lesson03.teach.you_come_q:
    title: می‌آیید؟
    gloss: می‌آیی؟ خواهی آمد؟
    note: '*می‌آیی* یعنی «تو می‌آیی»، خطاب به دوست. حال با *می‌* همان‌طور که دربارهٔ آینده خبر می‌دهد، دربارهٔ آینده سؤال هم می‌کند: *تو می‌آیی؟* یعنی می‌آیی؟ جواب اغلب یک قول است: *حتماً می‌آیم*.'
  prs.a2.unit28.lesson03.teach.negative_promise:
    title: قول دادن برای انجام ندادن کاری
    gloss: دیگر دیر نمی‌آیم. هرگز فراموش نمی‌کنم.
    note: 'برای قول دادن که کاری را انجام نمی‌دهید، با همین الگو از *نمی‌* استفاده کنید: *دیگر دیر نمی‌آیم* یعنی دیگر دیر نمی‌آیم، و *هرگز فراموش نمی‌کنم* یعنی هرگز فراموش نمی‌کنم. *دیگر* با فعل منفی یعنی «دیگر نه».'
  prs.a2.unit28.lesson03.teach.sentence:
    title: حتماً امشب تلفن می‌کنم
    gloss: حتماً امشب تلفن می‌کنم.
    note: 'قول همراه با قید زمان: *حتماً*، *امشب* و *تیلفون می‌کنم*.'
  prs.a2.unit28.lesson04.teach.important:
    title: مهم
    gloss: مهم
    note: '*مهم* یعنی مهم. *جلسه مهم* جلسه‌ای مهم است که قول می‌دهید در آن شرکت کنید.'
    example_gloss: امروز یک جلسهٔ مهم داریم.
  prs.a2.unit28.lesson04.teach.ladder:
    title: از مطمئن تا نامطمئن
    gloss: او حتماً می‌آید. او احتمالاً می‌آید. شاید بیاید. ممکن است نیاید.
    note: 'کلمه را بر اساس میزان اطمینانتان انتخاب کنید. *حتماً* و فعل ساده با *می‌*: مطمئن. *احتمالاً* و فعل حال ساده: احتمالاً. *شاید* و فعل التزامی: شاید. *ممکن است* و فعل التزامی: ممکن است، و منفی هم می‌شود: *ممکن است نیاید* (ممکن است نیاید).'
  prs.a2.unit28.lesson04.teach.maybe_but:
    title: شاید دیر برسم، ولی قول می‌دهم
    gloss: شاید دیر برسم، ولی حتماً می‌آیم.
    note: 'می‌توانید «شاید» و «قول» را با *ولی* به هم وصل کنید: *شاید دیر برسم، ولی حتماً می‌آیم*. بخش اول چیزی را می‌گوید که نمی‌توانید از آن مطمئن باشید، بخش دوم همان است که قول می‌دهید. برای بخشی که در کنترل شما نیست *شاید* و برای بخشی که در دست شماست *حتماً* به کار ببرید.'
  prs.a2.unit28.lesson04.teach.meeting_tomorrow:
    title: فردا جلسه داریم
    gloss: فردا جلسه است. می‌آیی؟
    note: سؤال دربارهٔ فردا حال ساده را با یک قید زمان به کار می‌برد. بهترین جواب یک قول با *حتماً* است.
  prs.a2.unit28.lesson05.teach.future_written:
    title: 'آیندهٔ نوشتاری: فقط برای شناختن'
    gloss: هوا سرد خواهد بود. برف خواهد بارید. اتوبوس حرکت خواهد کرد. اتوبوس نخواهد رفت.
    note: 'در خبرها، پیش‌بینی‌ها و اطلاعیه‌ها یک آیندهٔ نوشتاری می‌خوانید: *خواهد* به‌علاوهٔ مصدر کوتاه، مثل *سرد خواهد بود* (سرد خواهد بود)، *خواهد بارید* (خواهد بارید) و *حرکت خواهد کرد* (حرکت خواهد کرد). منفی آن *نخواهد* است: *نخواهد رفت* (نخواهد رفت). این شکل در فارسی ایران هم هست و فقط باید هنگام خواندن آن را بفهمید. وقتی با دوست حرف می‌زنید یا برایش می‌نویسید، از شکلی استفاده کنید که یاد گرفته‌اید: *فردا برف می‌بارد* و *حتماً می‌روم*.'
  prs.a2.unit28.lesson05.teach.forecast_reading:
    title: پیش‌بینی وضع هوا
    gloss: 'پیش‌بینی هوا: جمعه هوای بامیان سرد خواهد بود. شاید برف ببارد. هفتهٔ آینده هوا آفتابی می‌شود.'
    note: یک پیش‌بینی کوتاه از رادیو. جملهٔ اول آیندهٔ نوشتاری *خواهد بود* را دارد. جملهٔ دوم *شاید* و التزامی دارد، چون بارش برف قطعی نیست. جملهٔ سوم *می‌شود* ساده را با یک قید زمان دارد. با هم نشان می‌دهند پیش‌بینی چطور قطعی، نامطمئن و هفتهٔ بعد را می‌گوید.
  prs.a2.unit28.lesson05.teach.notice_reading:
    title: اطلاعیه برای مسافران
    gloss: 'اطلاعیه برای مسافران بامیان: اتوبوس هفتهٔ آینده، جمعه ساعت هشت، از ایستگاه حرکت خواهد کرد. لطفاً ساعت هفت در ایستگاه باشید. اتوبوس دیر حرکت نخواهد کرد.'
    note: 'یک اطلاعیه در ایستگاه اتوبوس. برای برنامه از آیندهٔ نوشتاری *حرکت خواهد کرد* و منفی *حرکت نخواهد کرد* استفاده کرده است، و برای درخواست مؤدبانه از *لطفاً* و التزامی *باشین* (باشید). ساعت *ساعت هشت* است: اتوبوس ساعت هشت حرکت می‌کند و مسافران باید یک ساعت زودتر بیایند.'
  prs.a2.unit28.lesson05.teach.d1_t1:
    title: بصیره دربارهٔ پیش‌بینی هوا می‌پرسد
    gloss: نادر، پیش‌بینی هوای جمعه را دیدی؟
    note: بصیره با ماضی ساده *دیدی* دربارهٔ پیش‌بینی می‌پرسد. *هوای جمعه* یعنی هوای روز جمعه.
  prs.a2.unit28.lesson05.teach.d1_t2:
    title: نادر پیش‌بینی را می‌گوید
    gloss: بله. جمعه هوا سرد می‌شود و شاید برف ببارد.
    note: 'نادر هر دو شکل را در یک جمله به کار می‌برد: *می‌شود* ساده برای سرما که قطعی است، و *شاید* با *ببارد* برای برف که قطعی نیست.'
  prs.a2.unit28.lesson05.teach.d1_t3:
    title: بصیره فکر می‌کند شاید بهتر است نروند
    gloss: پس شاید ما جمعه به بامیان نرویم.
    note: '*شاید* با التزامی منفی *نرویم* یعنی شاید نرویم.'
  prs.a2.unit28.lesson05.teach.d1_t4:
    title: نادر هفتهٔ بعد را پیشنهاد می‌کند
    gloss: بله. هفتهٔ آینده می‌رویم. هوا آفتابی می‌شود.
    note: نادر سفر را با *می‌رویم* ساده و یک قید زمان به *هفتهٔ آینده* می‌برد.
  prs.a2.unit28.lesson05.teach.d1_t5:
    title: بصیره موافقت می‌کند
    gloss: خوب است. هفتهٔ آینده حتماً می‌رویم.
    note: 'بصیره با *حتماً* جواب می‌دهد: او دربارهٔ هفتهٔ بعد مطمئن است.'
  prs.a2.unit28.lesson05.teach.d1_t6:
    title: نادر قول می‌دهد
    gloss: قول می‌دهم.
    note: نادر با *قول می‌دهم* حرفش را تمام می‌کند، یعنی یک قول.
  prs.a2.unit28.lesson06.teach.d2_t1:
    title: بصیره از نادر می‌پرسد
    gloss: نادر، فردا جلسهٔ مهمی داریم. می‌آیی؟
    note: بصیره برای پرسیدن دربارهٔ فردا حال را با *فردا* به کار می‌برد. جلسه *مهم* است، پس او جواب قطعی می‌خواهد.
  prs.a2.unit28.lesson06.teach.d2_t2:
    title: نادر قول می‌دهد، با کمی تردید
    gloss: حتماً می‌آیم. ولی شاید دیر برسم، چون ترافیک زیاد است.
    note: نادر با *حتماً می‌آیم* قول می‌دهد و بعد با *شاید دیر برسم* چیزی را می‌گوید که از آن مطمئن نیست. *چون* دلیل را می‌گوید.
  prs.a2.unit28.lesson06.teach.d2_t3:
    title: بصیره تماس تلفنی می‌خواهد
    gloss: مشکلی نیست. امشب تلفن می‌کنی؟
    note: 'بصیره با *مشکلی نیست* خطر دیر رسیدن را می‌پذیرد و یک قول دیگر می‌خواهد: یک تماس تلفنی امشب.'
  prs.a2.unit28.lesson06.teach.d2_t4:
    title: نادر قول می‌دهد تلفن کند
    gloss: قول می‌دهم. حتماً امشب تلفن می‌کنم. فراموش نمی‌کنم.
    note: 'سه قول پشت سر هم: *قول می‌دهم*، *حتماً امشب تیلفون می‌کنم* و *فراموش نمی‌کنم*.'
