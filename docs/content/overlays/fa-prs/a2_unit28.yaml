course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستان، سطح پیش‌متوسط: پیش‌بینی اتفاق‌های آینده و قول دادن. زمان حال ساده با قید زمان (فردا باران می‌بارد)، «شاید» و «احتمالاً» با وجه التزامی، قول دادن با «حتماً» و «قول می‌دهم»، و آیندهٔ نوشتاری برای خواندن پیش‌بینی‌ها و اطلاعیه‌ها.'
