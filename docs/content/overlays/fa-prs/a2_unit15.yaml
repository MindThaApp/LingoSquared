teaching:
  prs.a2.unit15.lesson01.teach.delay_word:
    title: تأخیر
    gloss: تأخیر
    note: '*تأخیر* یعنی دیر شدن به‌طور کلی؛ اتوبوس، جلسه یا هر چیز دیگری که دیر می‌رسد.'
    example_gloss: اتوبوس امروز یک ساعت تأخیر دارد.
  prs.a2.unit15.lesson01.teach.cancellation_word:
    title: لغو
    gloss: لغو
    note: '*لغو* با *شدن* به کار می‌رود (*لغو شده*، یعنی «لغو شده است»).'
    example_gloss: اتوبوس ساعت ۹ لغو شده است.
  prs.a2.unit15.lesson01.teach.closed_word:
    title: بسته
    gloss: بسته
    note: '*بسته* دربارهٔ جاده، مغازه یا اداره‌ای به کار می‌رود که باز نیست.'
    example_gloss: جادهٔ کابل-مزار شریف بسته است.
  prs.a2.unit15.lesson01.teach.alternative_route_word:
    title: مسیر جایگزین
    gloss: مسیر جایگزین
    note: '*مسیر بدیل* -- *مسیر* یعنی «راه» و *بدیل* یعنی «جایگزین».'
    example_gloss: مسیر جایگزینی وجود ندارد.
  prs.a2.unit15.lesson01.teach.snowfall_word:
    title: بارش برف
    gloss: بارش برف
    note: '*برفباری* -- از *برف* به‌اضافهٔ پسوندی ساخته شده که آن را به «بارش برف» تبدیل می‌کند.'
    example_gloss: به‌خاطر بارش برف، جاده بسته است.
  prs.a2.unit15.lesson01.teach.notice_word:
    title: اطلاعیه
    gloss: اطلاعیه
    note: '*اطلاعیه* همان برگهٔ اعلامی است که به دیوار نصب می‌شود، مثل اطلاعیه‌هایی که روی دیوار ایستگاه می‌بینید.'
    example_gloss: اطلاعیهٔ ایستگاه را خواندم.
  prs.a2.unit15.lesson01.teach.due_to_grammar:
    title: به دلیل، برای بیان علت
    gloss: به دلیل برف‌باری، اتوبوس لغو شده است.
    note: '*به دلیل* + اسم، علت را بیان می‌کند. این گام دستوری سطح A2 این درس است و یک حرف ربط علّی تازه است، علاوه بر *چون* در درس ۱۰ که بعد از آن یک جملهٔ کامل می‌آید.'
  prs.a2.unit15.lesson01.teach.wait_phrase:
    title: بگویید باید صبر کنید
    gloss: باید تا فردا صبح صبر کنید.
    note: '*باید ... صبر کنین* یعنی «باید صبر کنید»؛ شناسهٔ جمعِ محترمانه که برای شخص غریبه به کار می‌رود.'
  prs.a2.unit15.lesson01.teach.va_word:
    title: و
    gloss: و
    note: '*و* حرف ربط رایجی است که در این درس برای وصل کردن جمله‌ها به کار می‌رود.'
    target_text: و (حرف ربط)
  prs.a2.unit15.lesson01.teach.first_person_wait:
    title: من هم باید صبر کنم
    gloss: من هم باید صبر کنم.
    note: '*من هم باید صبر کنم* التزامیِ اول شخص *کنم* («انجام بدهم») را معرفی می‌کند که بعد از *باید* بدون *می‌* می‌آید.'
  prs.a2.unit15.lesson02.teach.ask_next_bus:
    title: بپرسید اتوبوس بعدی کی حرکت می‌کند
    gloss: اتوبوس بعدی کی حرکت می‌کند؟
    note: '*بعدی* یعنی «بعدی» یا «بعد از این».'
  prs.a2.unit15.lesson02.teach.ask_alternative_route:
    title: دربارهٔ مسیر جایگزین بپرسید
    gloss: مسیر جایگزین هست؟
    note: '*وجود دارد؟* یعنی «وجود دارد؟»؛ روشی رایج برای پرسیدن اینکه چیزی در دسترس هست یا نه.'
  prs.a2.unit15.lesson02.teach.tomorrow_departure:
    title: ساعت حرکت فردا را بگویید
    gloss: اتوبوس فردا ساعت هشت صبح حرکت می‌کند.
    note: الگوی *ساعت* که قبلاً یاد گرفته‌اید دوباره به کار رفته است.
  prs.a2.unit15.lesson03.teach.station_word:
    title: ایستگاه
    gloss: ایستگاه قطار
    note: '*ایستگاه* هم برای ایستگاه اتوبوس به کار می‌رود و هم برای ایستگاه قطار.'
    example_gloss: همایون به ایستگاه اتوبوس رفت.
  prs.a2.unit15.lesson03.teach.passengers_word:
    title: مسافران
    gloss: مسافران
    note: '*مسافران* جمع *مسافر* است.'
    example_gloss: مسافران باید صبر کنند.
  prs.a2.unit15.lesson03.teach.notice_text:
    title: اطلاعیهٔ ایستگاه دربارهٔ اتوبوس لغوشده
    gloss: اتوبوس ساعت ۹ امروز به مزار شریف به دلیل برف‌باری لغو شده است. راه کابل-مزار شریف بسته است. مسافران باید تا فردا صبح صبر کنند. اتوبوس بعدی فردا ساعت هشت صبح حرکت می‌کند.
    note: یک اطلاعیهٔ رسمی کوتاه در ایستگاه، به زبان نوشتاری و رسمی که این درس آموزش می‌دهد.
  prs.a2.unit15.lesson04.teach.turn01:
    title: کارمند ایستگاه به همایون خوشامد می‌گوید
    gloss: کارمند ایستگاه می‌پرسد چه کمکی می‌تواند به او بکند.
    note: یک احوال‌پرسی رسمی مثل حرف کارمند دفتر در درس ۹ (*بفرمایین، چه خدمتی...*)، اینجا با *کمکی* («کمک») به جای *خدمتی* («خدمت»).
  prs.a2.unit15.lesson04.teach.turn02:
    title: همایون دربارهٔ اتوبوس ساعت ۹ می‌پرسد
    gloss: همایون می‌پرسد اتوبوس ساعت ۹ مزار شریف کی حرکت می‌کند.
    note: الگوی پرسشی *کی ... می‌کند؟* که در درس دوم آمده بود دوباره به کار رفته است.
  prs.a2.unit15.lesson04.teach.turn03:
    title: کارمند ایستگاه دلیل لغو را توضیح می‌دهد
    gloss: کارمند ایستگاه عذرخواهی می‌کند و می‌گوید آن اتوبوس به دلیل برف‌باری لغو شده است.
    note: '*متأسفم* یعنی «متأسفم».'
  prs.a2.unit15.lesson04.teach.turn04:
    title: همایون دربارهٔ مسیر جایگزین می‌پرسد
    gloss: همایون می‌پرسد مسیر جایگزینی هست یا نه.
    note: دقیقاً همان پرسش درس دوم دوباره آمده است.
  prs.a2.unit15.lesson04.teach.turn05:
    title: کارمند ایستگاه جواب می‌دهد و زمان انتظار را می‌گوید
    gloss: نه، راه بسته است. باید تا فردا صبح صبر کنید.
    note: '*نخیر* یک «نه»ی رسمی‌تر است که در این مجموعه همراه *بلی* به کار می‌رود.'
  prs.a2.unit15.lesson04.teach.turn06:
    title: همایون دربارهٔ اتوبوس فردا می‌پرسد
    gloss: همایون می‌پرسد اتوبوس فردا چه ساعتی حرکت می‌کند.
    note: '*چند* در اینجا یعنی «چه (ساعتی)».'
  prs.a2.unit15.lesson04.teach.turn07:
    title: کارمند ایستگاه ساعت را می‌گوید
    gloss: اتوبوس فردا ساعت هشت صبح حرکت می‌کند.
    note: دقیقاً همان اطلاعات درس دوم دوباره آمده است، چون جزئیات واقعی یکسانی است.
  prs.a2.unit15.lesson04.teach.turn08:
    title: همایون از کارمند تشکر می‌کند
    gloss: همایون بابت اطلاعات تشکر می‌کند.
    note: '*معلومات‌تان* یعنی «اطلاعات شما»؛ پسوند ملکی رسمی *-تان* به آن اضافه شده است.'
