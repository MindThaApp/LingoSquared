  prs.a2.unit15.lesson01.disruption_vocabulary:
    title: واژه‌های اختلال در سفر
  prs.a2.unit15.lesson02.asking_about_alternatives:
    title: پرسیدن دربارهٔ گزینه‌های جایگزین
  prs.a2.unit15.lesson03.reading_a_station_notice:
