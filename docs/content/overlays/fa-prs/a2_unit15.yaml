course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستان در سطح پیش‌متوسط: برخورد با اختلال در سفر؛ لغو شدن اتوبوس بین‌شهری، پرسیدن دربارهٔ گزینه‌های جایگزین، خواندن اطلاعیهٔ ایستگاه و گفت‌وگو با کارکنان ایستگاه.'
units:
