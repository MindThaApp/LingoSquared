  prs.a1.unit49.lesson02.teach.review_want_object_wash:
    title: 'مرور: می‌خواهم، نشانهٔ مفعول، که بشویم'
    gloss: می‌خواهم / (نشانهٔ مفعول) / که بشویم
    note: «که بشویم» شکل انتظارشدهٔ وجه التزامی فعل آموخته‌شدهٔ «شستن» است و درست مثل بقیهٔ وجه‌های التزامی این دوره ساخته می‌شود (که بگیرم، که بردارم).
    target_text: می‌خواهم (می‌خواهم) / را (نشانهٔ مفعول) / بشویم (که بشویم — وجه التزامی شستن)
  prs.a1.unit49.lesson02.teach.review_clothes_plural:
    title: 'مرور: لباس‌ها'
    gloss: لباس‌ها
    note: این شکل جمع «لباس» است و درست مثل جمع «سیب» که پیش‌تر در این دوره ساختیم، ساخته می‌شود.
    target_text: لباس‌ها (لباس‌ها — جمع لباس)
  prs.a1.unit49.lesson02.teach.want_to_wash_phrase:
    title: می‌خواهم لباس‌ها را بشویم
    gloss: می‌خواهم لباس‌ها را بشویم.
