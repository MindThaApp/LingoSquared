    title: شستن و اتو می‌خواهم
    gloss: شستن و اتو می‌خواهم.
    note: این جمله «شستن»، «و» و «اتو» را ترکیب می‌کند.
  prs.a1.unit49.lesson03.teach.ready_word:
    title: آماده
    gloss: آماده
    note: این واژهٔ رایج دری برای «آماده» است که اینجا برای پرسیدن یا گفتن زمان تحویل به کار می‌رود.
    example_gloss: فردا آماده می‌شود.
  prs.a1.unit49.lesson03.teach.review_when_hour_five:
    title: 'مرور: کی، فردا، ساعت، پنج'
    gloss: کی / فردا / ساعت / پنج
    note: این‌ها واژه‌های مرورینِ (از واحد 9، واحد 16، واحد 48 و واحدهای قبلی) برای پرسیدن و گفتن زمان تحویل هستند.
    target_text: کی (کی) / فردا (فردا) / ساعت (ساعت) / پنج (پنج)
  prs.a1.unit49.lesson03.teach.ask_when_ready_phrase:
    title: کی آماده می‌شود؟
    gloss: کی آماده می‌شود؟
