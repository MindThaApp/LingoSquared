teaching:
  prs.a1.unit49.lesson01.teach.review_this_is_in:
    title: 'مرور: این، است، در'
    gloss: این / است / در
    note: این‌ها واژه‌های مرورینِ (به‌کاررفته در سراسر این دوره) برای صحبت دربارهٔ لباس‌شویی هستند.
