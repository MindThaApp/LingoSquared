    title: قیمت هر کیلو چند است؟
    gloss: قیمت هر کیلو چند است؟
    note: این جمله واژه‌هایی را که پیش‌تر در همین درس آموختید ترکیب می‌کند.
  prs.a1.unit49.lesson02.teach.price_per_kilo_answer_phrase:
    title: کیلویی سی افغانی است
    gloss: کیلویی سی افغانی است.
    note: این جمله قیمت را با اعداد و واحد پولی که پیش‌تر آموخته‌اید می‌گوید.
  prs.a1.unit49.lesson03.teach.iron_word:
    title: اتو / اتو کردن
    gloss: اتو / اتو کردن
    note: این واژهٔ رایج دری برای اتو کردن لباس است که اینجا برای خدمت شستن و اتوی لباس‌شویی به کار رفته است.
    example_gloss: لباس‌ها را اتو می‌کنم.
  prs.a1.unit49.lesson03.teach.review_wash_and:
    title: 'مرور: شستن، و'
    gloss: شستن / و
    note: این‌ها واژه‌های مرورینِ برای نام بردن از دو نوع خدمات هستند.
    target_text: شستن (شستن) / و (و)
