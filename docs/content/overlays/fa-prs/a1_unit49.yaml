  prs.a1.unit49.lesson01.teach.review_clothes_shop_shopkeeper:
    title: 'مرور: لباس، مغازه، مغازه‌دار'
    gloss: لباس / مغازه / مغازه‌دار
    note: «لباس» واژهٔ مرورینِ واحد 21 است؛ «مغازه» و «مغازه‌دار» واژه‌های مرورینِ واحد 10 هستند.
    target_text: لباس (لباس) / دوکان (مغازه) / دوکاندار (مغازه‌دار)
  prs.a1.unit49.lesson01.teach.laundry_word:
    title: لباس‌شویی
    gloss: لباس‌شویی
    note: این واژه از واژهٔ «لباس» همین دوره و ریشهٔ فعل شستن ساخته شده و واژهٔ رایج دری برای مغازه یا خدمات لباس‌شویی است.
    example_gloss: این مغازه لباس‌شویی است.
  prs.a1.unit49.lesson01.teach.this_is_laundry_shop_phrase:
    title: این مغازه لباس‌شویی است
    gloss: این مغازه لباس‌شویی است.
    note: این جمله «این»، «مغازه» و «لباس‌شویی» را کنار هم می‌گذارد، همان‌طور که در این دوره پیش‌تر دو اسم را بدون واژهٔ ربط کنار هم گذاشتیم.
  prs.a1.unit49.lesson01.teach.shopkeeper_at_shop_phrase:
    title: مغازه‌دار در مغازه است
    gloss: مغازه‌دار در مغازه است.
