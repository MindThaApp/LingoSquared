  prs.a1.unit49.lesson02.teach.review_price_per_kilo_price:
    title: 'مرور: قیمتش، به، کیلو، چند، افغانی، سی'
    gloss: قیمتش / به ازای / کیلو / چند / افغانی / سی
    note: این‌ها واژه‌های مرورینِ (از واحد 4، واحد 10 و واحدهای قبلی دیگر) برای پرسیدن قیمت هر کیلو هستند.
    target_text: قیمتش (قیمتش) / به (به ازای / کیلویی) / کیلو (کیلو) / چند (چند) / افغانی (افغانی) / سی (سی)
