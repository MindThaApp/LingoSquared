  prs.a1.unit43.lesson04.teach.dialogue_line5:
    title: 'همایون: خیلی خوب. خیلی ممنون.'
    gloss: خیلی خوب. خیلی ممنون.
  prs.a1.unit43.lesson04.teach.dialogue_line6:
    title: 'کتابدار: خواهش می‌کنم.'
    gloss: خواهش می‌کنم.
