teaching:
  prs.a1.unit43.lesson01.teach.review_book_have_is_in:
    title: 'مرور: کتاب، دارم، است، در'
    gloss: کتاب / دارم / است / در
    note: کتاب، دارم، است و در واژه‌های مرورین که برای صحبت دربارهٔ یک کتاب به کار می‌روند.
    target_text: کتاب (کتاب) / دارم (دارم) / است (است) / در (در)
  prs.a1.unit43.lesson01.teach.review_want_one:
    title: 'مرور: می‌خواهم، یک'
    gloss: می‌خواهم / یک
    note: می‌خواهم و یک کنار هم می‌آیند تا بگویید چه چیزی می‌خواهید.
    target_text: می‌خواهم (می‌خواهم) / یک (یک)
  prs.a1.unit43.lesson01.teach.library_word:
    title: کتابخانه
    gloss: کتابخانه
    note: کتابخانه واژهٔ معیار دری برای کتابخانه است و از کتاب و خانه ساخته شده است.
    example_gloss: کتاب در کتابخانه است.
  prs.a1.unit43.lesson01.teach.librarian_word:
    title: کتابدار
    gloss: کتابدار
    note: کتابدار یعنی «کسی که کتاب‌ها را نگه می‌دارد» (مسئول کتاب‌ها) و درست مثل دوکاندار («مغازه‌دار»، درس ۸) ساخته شده است.
    example_gloss: کتابدار در کتابخانه است.
  prs.a1.unit43.lesson01.teach.want_book_phrase:
    title: یک کتاب می‌خواهم
    gloss: یک کتاب می‌خواهم.
    note: یک کتاب می‌خواهم از یک (یک)، کتاب (کتاب) و می‌خواهم (می‌خواهم) ساخته شده است.
  prs.a1.unit43.lesson01.teach.review_from_object_marker:
    title: 'مرور: از، نشانهٔ مفعول'
    gloss: از / «را» (نشانهٔ مفعول)
    note: از و را (که مفعول جمله را نشان می‌دهد؛ درس ۱۴ و ۲۶) واژه‌های مرورین.
    target_text: از (از) / را (نشانهٔ مفعول)
  prs.a1.unit43.lesson01.teach.want_book_from_librarian_phrase:
    title: کتاب را از کتابدار می‌خواهم
    gloss: کتاب را از کتابدار می‌خواهم.
    note: از کتابدار به کتاب را می‌خواهم اضافه شده است.
  prs.a1.unit43.lesson01.teach.want_one_book_from_librarian_phrase:
    title: یک کتاب از کتابدار می‌خواهم
    gloss: یک کتاب از کتابدار می‌خواهم.
    note: یک را با کتاب را از کتابدار می‌خواهم ترکیب می‌کند.
  prs.a1.unit43.lesson02.teach.review_date_day_monday:
    title: 'مرور: تاریخ، روز، دوشنبه'
    gloss: تاریخ / روز / دوشنبه
    note: تاریخ، روز و دوشنبه (همه از درس ۹) واژه‌های مرورین که برای پرسیدن دربارهٔ تاریخ پس دادن به کار می‌روند.
    target_text: تاریخ (تاریخ) / روز (روز) / دوشنبه (دوشنبه)
  prs.a1.unit43.lesson02.teach.review_which_is:
    title: 'مرور: کدام، است'
    gloss: کدام / است
    note: کدام و است واژه‌های مرورین که برای پرسیدن سؤال به کار می‌روند.
    target_text: کدام (کدام) / است (است)
  prs.a1.unit43.lesson02.teach.return_giving_back_word:
    title: پس دادن
    gloss: پس دادن
    note: پس دادن یعنی «برگرداندن»؛ پس (برگشت) با دادن (دادن) ترکیب شده است.
    example_gloss: تاریخ پس دادن دوشنبه است.
  prs.a1.unit43.lesson02.teach.ask_return_date_phrase:
    title: تاریخ پس دادن کدام روز است؟
    gloss: تاریخ پس دادن کتاب چه روزی است؟
    note: تاریخ پس دادن کتاب کدام روز است؟ می‌پرسد که کتاب امانتی کی باید برگردانده شود.
  prs.a1.unit43.lesson02.teach.return_date_answer_phrase:
    title: تاریخ پس دادن دوشنبه است
    gloss: تاریخ پس دادن دوشنبه است.
    note: تاریخ پس دادن دوشنبه است با یک روز مشخص به پرسش جواب می‌دهد.
  prs.a1.unit43.lesson03.teach.review_want_book_one_this:
    title: 'مرور: می‌خواهم، کتاب، یک، این'
    gloss: می‌خواهم / کتاب / یک / این
    note: می‌خواهم، کتاب، یک و این واژه‌های مرورین که برای درخواست یک کتاب مشخص به کار می‌روند.
    target_text: می‌خواهم (می‌خواهم) / کتاب (کتاب) / یک (یک) / این (این)
