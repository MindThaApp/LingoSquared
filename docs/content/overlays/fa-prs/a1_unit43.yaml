    title: گرفتن
    gloss: گرفتن
    note: بگیرم شکل التزامی («که بگیرم») است، همان شکلی که در درس ۴۲ با می‌خواهم آمد و یعنی «می‌خواهم بگیرم».
    example_gloss: می‌خواهم یک کتاب بگیرم.
  prs.a1.unit43.lesson03.teach.loan_word:
    title: قرض
    gloss: قرض
    note: قرض یعنی وام یا امانت؛ قرض گرفتن («به‌عنوان قرض گرفتن») راه رایج دری برای گفتن «امانت گرفتن» است.
    example_gloss: این کتاب امانتی است.
  prs.a1.unit43.lesson03.teach.want_borrow_book_phrase:
    title: می‌خواهم کتاب را قرض بگیرم
    gloss: می‌خواهم کتاب را قرض بگیرم.
    note: می‌خواهم کتاب را قرض بگیرم از می‌خواهم، کتاب را، قرض و شکل التزامی بگیرم ساخته شده است.
  prs.a1.unit43.lesson03.teach.give_back_word:
    title: پس دادن
    gloss: پس دادن
    note: بدهم شکل وجه التزامی فعل دادن است؛ با پس یعنی «پس دادن / برگرداندن».
    example_gloss: می‌خوام پسش بدم.
  prs.a1.unit43.lesson03.teach.want_return_book_phrase:
    title: می‌خواهم کتاب را پس بدهم
    gloss: می‌خوام کتاب را پس بدم.
    note: می‌خواهم کتاب را پس بدهم از می‌خواهم، کتاب را، پس و فعل التزامی بدهم ساخته شده است.
  prs.a1.unit43.lesson03.teach.review_very_good:
