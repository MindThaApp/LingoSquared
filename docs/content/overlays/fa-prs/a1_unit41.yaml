  description: 'دری کابلیِ مقدماتی: گم شدن وسیله شخصی را اعلام کنید، بپرسید پیدا شده یا نه، وسیله را با رنگ و اندازه توصیف کنید و یک متن کوتاه درباره یک وسیله گم‌شده و پیدا‌شده بخوانید.'
units:
