teaching:
  prs.a1.unit41.lesson01.teach.review_this_is:
    title: 'مرور: این، است'
    gloss: این / است
    note: «این» و «است» از واژه‌های اولیهٔ مرور هستند که برای گفتن اینکه چیزی چیست به کار می‌روند.
    target_text: این (این) / است (است)
  prs.a1.unit41.lesson01.teach.review_have:
    title: 'مرور: دارم'
    gloss: دارم
    note: «دارم» واژهٔ مرور است و برای گفتن اینکه چه وسیله‌ای دارید یا همراهتان است به کار می‌رود.
    target_text: دارم (من دارم)
  prs.a1.unit41.lesson01.teach.bag_word:
    title: کیف
    gloss: کیف
    note: «خریطه» واژهٔ رایج دری برای کیف است.
    example_gloss: من یک کیف دارم.
  prs.a1.unit41.lesson01.teach.wallet_word:
    title: کیف پول
    gloss: کیف پول
    note: «کیف پول» همان کیف پول است و از «کیف» و «پول» ساخته شده است.
    example_gloss: من کیف پول دارم.
  prs.a1.unit41.lesson01.teach.key_word:
    title: کلید
    gloss: کلید
    note: «کلید» یعنی کلید.
    example_gloss: من کلید دارم.
  prs.a1.unit41.lesson01.teach.glasses_word:
    title: عینک
    gloss: عینک
    note: «عینک» یعنی عینک.
    example_gloss: من عینک دارم.
  prs.a1.unit41.lesson01.teach.lost_word:
    title: گم شده است
    gloss: گم شده است
    note: «گم شده» از «گم» و «شده» ساخته می‌شود؛ روش معمول گفتن اینکه چیزی گم شده است، مثل «زخمی است» در درس ۴۰.
    example_gloss: کیفم گم شده است.
  prs.a1.unit41.lesson01.teach.wallet_lost_phrase:
    title: کیف پولم گم شده!
    gloss: کیف پولم گم شده!
    note: «کیف پولم» از «کیف پول» و نشانهٔ مالکیت «-م» ساخته شده، مثل «خانه‌ام» در درس‌های قبل.
  prs.a1.unit41.lesson02.teach.review_can_help:
    title: 'مرور: می‌توانید، من را، کمک، کنید (امر مؤدبانه)'
    gloss: می‌توانید / من را / کمک / کنید
    note: این واژه‌ها کنار هم برای درخواست کمک به کار می‌روند.
    target_text: می‌توانین (می‌تونید) / مه ره (به من) / کمک (کمک) / کنین (کنید -- امر مؤدبانه)
  prs.a1.unit41.lesson02.teach.review_ra:
    title: 'مرور: (نشانهٔ مفعول)'
    gloss: (نشانهٔ مفعول)
