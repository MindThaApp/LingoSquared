  prs.a2.unit31.lesson03.exercise01.recognize_bag_offer:
    instruction: منظور مغازه‌دار چیست؟
    correct_option: یک کیسه هم بدهم؟
    distractors:
    - لطفاً یک کیسه هم به من بدهید
    - من به شما کیسه دادم
    - کیسه کجاست؟
    accepted_answers:
    - value: یک کیسه هم بدهم؟
      status: correct
    feedback: '*بدهم* به *-م* ختم می‌شود، پس مغازه‌دار پیشنهاد می‌دهد: بدهم؟'
  prs.a2.unit31.lesson03.exercise02.accept_tea:
    instruction: 'کسی می‌پرسد: چای بیاورم؟ کدام جواب پیشنهاد را قبول می‌کند؟'
