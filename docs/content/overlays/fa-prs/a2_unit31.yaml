    - value: لطفاً کیسه را بیاورین.
      status: correct
    - value: کیسه را بیاورین، لطفاً.
      status: correct
    - value: لطفاً کیسه را بیارید.
      status: correct
    - value: کیسه را بیارید، لطفاً.
      status: correct
    - value: لطفاً کیسه را بیاورید.
      status: correct
    - value: کیسه را بیاورید، لطفاً.
      status: correct
    feedback: '*لطفاً کیسه را بیاورین.* *را* بعد از کیسه می‌آید و دستور در آخر است. *لطفاً* می‌تواند آخر جمله هم بیاید.'
  prs.a2.unit31.lesson02.exercise07.write_table:
    instruction: 'به دری (افغانستان) بنویسید، خطاب به همسایه و با «لطفاً»: لطفاً این میز را به اتاق ببرید.'
