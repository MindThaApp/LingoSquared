    accepted_answers:
    - value: بلی، لطفاً.
      status: correct
    feedback: '*بلی، لطفاً.* قبول می‌کند. سه تای دیگر رد می‌کنند.'
  prs.a2.unit31.lesson03.exercise03.match_offers_replies:
    instruction: هر پیشنهاد یا جواب را با معنی‌اش جور کنید.
    accepted_answers:
