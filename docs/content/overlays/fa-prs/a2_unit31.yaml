course:
  title: دری افغانستان در فارسی ایران A2
  description: 'دری افغانستانی در سطح پیش‌متوسط: درخواست مؤدبانه با «می‌شود که» و «لطفاً»، پیشنهاد کمک، پذیرفتن یا رد مؤدبانه و خواستن از کسی که کاری را نکند با امر منفی (نکنین).'
units:
