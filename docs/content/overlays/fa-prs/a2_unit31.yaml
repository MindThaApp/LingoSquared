teaching:
  prs.a2.unit31.lesson01.teach.neighbour:
    title: همسایه
    gloss: همسایه
    note: '*همسایه* یعنی کسی که نزدیک خانه شما زندگی می‌کند. همسایه‌ها اغلب از هم کارهای کوچک می‌خواهند، پس او اولین کسی است که به او درخواست مؤدبانه می‌کنید.'
    example_gloss: همسایه ما خیلی خوب است.
  prs.a2.unit31.lesson01.teach.shopkeeper:
    title: مغازه‌دار
    gloss: مغازه‌دار
    note: '*دوکاندار* کسی است که در *دوکان* (مغازه) کار می‌کند. از *دوکاندار* چیزی را که لازم دارید می‌خواهید و او ممکن است چیز بیشتری پیشنهاد کند.'
    example_gloss: مغازه‌دار در مغازه است.
  prs.a2.unit31.lesson01.teach.milk:
    title: شیر
    gloss: شیر
    note: '*شیر* همان شیر خوراکی است. در مغازه چیز رایجی برای خواستن است، مثل *نان*.'
    example_gloss: من هر روز شیر می‌خورم.
  prs.a2.unit31.lesson01.teach.bag:
    title: کیف
    gloss: کیسه، پلاستیک خرید
    note: '*کیسه* یعنی کیسه‌ای که مثلاً مغازه‌دار خریدتان را در آن می‌گذارد.'
    example_gloss: یک کیسه نان خریدم.
  prs.a2.unit31.lesson01.teach.frame:
    title: 'درخواست مؤدبانه: می‌شود که ...؟'
    gloss: 'می‌شود کمی نان به من بدهید؟ (تحت‌اللفظی: ممکن است که کمی نان بدهید؟)'
    note: 'برای اینکه مؤدبانه از کسی چیزی بخواهید، با *می‌شود که* شروع کنید و فعل را در وجه التزامی بیاورید: *می‌شود که کمی نان بدهین؟* فعلِ بعد از *که* همان شکلی است که بعد از *باید* می‌آید و وقتی با یک نفر مؤدب هستید یا با چند نفر (*شما*) صحبت می‌کنید، به *-ین* ختم می‌شود. درخواست یک پرسش است، پس جمله با *؟* تمام می‌شود. در گفتار کوتاه‌تر *که* حذف می‌شود: *می‌شود کمی نان بدهین؟*. همچنین می‌توانید با *می‌توانین* بپرسید: *می‌توانین کمی نان بدهین؟*'
  prs.a2.unit31.lesson01.teach.subj:
    title: وجه التزامی «دادن»
    gloss: که من بدهم، که تو بدهی، که او بدهد، که ما بدهیم، که شما بدهید (مؤدبانه یا جمع)، که آنها بدهند
    note: وجه التزامی از *ب* + ریشهٔ حال + شناسه‌های *-م، -ی، -د، -یم، -ین، -ند* ساخته می‌شود. برای *دادن* ریشه *ده* است و می‌شود *بدهم، بدهی، بدهد، بدهیم، بدهین، بدهند*. برای درخواست از همسایه یا دکاندار باید شکل *-ین* یعنی *بدهین* را به کار ببرید.
  prs.a2.unit31.lesson01.teach.subj_more:
    title: درخواست با فعل‌های دیگر
    gloss: دادن، آوردن، فرستادن، گرفتن، بردن، گفتن، کردن
    note: 'همین وجه التزامی با *-ین* را بعد از *می‌شود که* با هر فعلی بگذارید: *بیاورین* (بیاورید)، *بفرستین* (بفرستید)، *بگیرین* (بگیرید)، *ببرین* (چیزی را به جایی ببرید)، *بگویین* (بگویید) و *کنین* (بکنید). فعل‌های ساخته‌شده با *کردن* بعد از جزء اول *کنین* می‌گیرند: *کمک کنین* (کمک کنید)، *صبر کنین* (صبر کنید)، *تیلفون کنین* (تلفن کنید)، *باز کنین* (باز کنید).'
  prs.a2.unit31.lesson01.teach.help_req:
    title: می‌شود کمک کنید؟
    gloss: می‌شود کمک کنید؟
    note: '*می‌شود که کمک کنین؟* راه معمول خواستن کمک از همسایه است. اگر آن شخص را خوب نمی‌شناسید، با *ببخشین* (ببخشید) شروع کنید.'
  prs.a2.unit31.lesson01.teach.bag_req:
    title: ببخشید، می‌شود یک کیسه به من بدهید؟
    gloss: ببخشید، می‌شود یک کیسه به من بدهید؟
    note: '*ببخشین* شروع مؤدبانه است و عذرخواهی واقعی نیست. بعد خود درخواست می‌آید: *می‌شود که یک کیسه بدهین؟*'
  prs.a2.unit31.lesson01.teach.yes_sure:
    title: بله، حتماً
    gloss: بله، حتماً.
    note: '*بلی، حتماً.* جواب مثبت مؤدبانه به یک درخواست است. *البته.* هم همین معنی را دارد.'
  prs.a2.unit31.lesson02.teach.table:
    title: میز
    gloss: میز
    note: '*میز* یعنی میز. ممکن است برای بردن یا جابه‌جا کردنش کمک لازم داشته باشید.'
    example_gloss: میز در اتاق است.
  prs.a2.unit31.lesson02.teach.here:
    title: اینجا
    gloss: اینجا
    note: '*اینجا* یعنی همین جا، در این مکان. ضدش *آنجا* است.'
    example_gloss: کلید اینجاست.
  prs.a2.unit31.lesson02.teach.imp_pl:
    title: امر مؤدبانه با -ین
    gloss: بیایید، بروید، بدهید، بگویید، بگیرید، بیاورید، بکنید (به همسایه یا به چند نفر)
    note: 'امر برای *شما* (همسایه، فرد مسن‌تر یا چند نفر) به *-ین* ختم می‌شود: *بیایین* (بیایید)، *بروین* (بروید)، *بدهین* (بدهید)، *بگویین* (بگویید)، *بگیرین* (بگیرید)، *بیاورین* (بیاورید)، *کنین* (بکنید). این همان شکلی است که بعد از *می‌شود که* به کار بردید.'
  prs.a2.unit31.lesson02.teach.imp_sg:
    title: امر برای دوست (بدون شناسه)
    gloss: بیا، برو، بده، بگو، بگیر، بیاور، بکن (به دوست یا بچه)
    note: 'برای یک دوست یا یک بچه، *-ین* را بردارید: *بیا، برو، بده، بگو، بگیر، بیاور، کن*. این شکل ساده به‌تنهایی تند است، پس فقط با کسانی به کار ببرید که به آنها *تو* می‌گویید. برای همسایه یا مغازه‌دار همیشه شکل *-ین* را بگویید.'
  prs.a2.unit31.lesson02.teach.imp_rule:
    title: امر چطور ساخته می‌شود
    gloss: 'الگو: ب + ریشه حال'
    note: امر از *ب* به‌علاوه ریشه حال (*رو، ده، گو، گیر*) ساخته می‌شود و برای *شما* *-ین* اضافه می‌شود. فعل *کردن* *ب* ندارد (*کن، کنین*) و *آمدن* *بیا، بیایین* دارد. *آوردن* برای دوست *بیاور* و در شکل مؤدبانه *بیاورین* است.
  prs.a2.unit31.lesson02.teach.please_wait:
    title: لطفاً کمی صبر کنید
    gloss: لطفاً کمی صبر کنید.
    note: '*لطفاً* اول جمله امر می‌آید و آن را مؤدبانه می‌کند: *لطفاً کمی صبر کنین.*'
  prs.a2.unit31.lesson02.teach.please_bring:
    title: لطفاً کیسه را بیاورید
    gloss: لطفاً کیسه را بیاورید.
    note: 'مفعول قبل از فعل می‌آید و وقتی چیز مشخصی است، *را* می‌گیرد: *کیسه را بیاورین*.'
  prs.a2.unit31.lesson02.teach.please_table:
    title: لطفاً این میز را به اتاق ببرید
    gloss: لطفاً این میز را به اتاق ببرید.
    note: '*ببرین* یعنی چیزی را به جایی بردن. *به اتاق* مکان را می‌گوید.'
  prs.a2.unit31.lesson02.teach.two_ways:
    title: دو راه برای خواستن
    gloss: لطفاً دروازه را باز کنین. / ببخشین، می‌شود دروازه را باز کنین؟
    note: '*لطفاً* همراه با فعل امر کوتاه و مستقیم است و وقتی انتظار می‌رود طرف مقابل کار را انجام بدهد، مثلاً دکان‌دار، اشکالی ندارد. *می‌شود که ...؟* ملایم‌تر است و برای خواهش از همسایه بهتر است. هر دو مؤدبانه‌اند.'
  prs.a2.unit31.lesson03.teach.offer_forms:
    title: 'پیشنهاد کمک: فعل با -م'
    gloss: کمک کنم؟ چای بیاورم؟ کیسه هم بدهم؟ چای هم بفرستم؟
    note: 'برای پیشنهاد دادن چیزی، با شکل *من* در وجه التزامی سؤال می‌کنند: *کنم* (که انجام بدهم)، *بیاورم* (که بیاورم)، *بدهم* (که بدهم)، *بفرستم* (که بفرستم). *کمک کنم؟* یعنی «کمک کنم؟». می‌توانید *هم* (همچنین) هم اضافه کنید: *کیسه هم بدهم؟*'
  prs.a2.unit31.lesson03.teach.want_that:
    title: می‌خواهید کمک کنم؟
    gloss: می‌خواهید کمک کنم؟
    note: '*می‌خواهین که ...؟* راه دیگری برای پیشنهاد دادن است. می‌پرسد که طرف مقابل آن را می‌خواهد یا نه، و فعل بعد از *که* دوباره به شکل *-م* می‌آید.'
  prs.a2.unit31.lesson03.teach.offer_vs_request:
    title: پیشنهاد یا خواهش؟
    gloss: چای بیاورم؟ / لطفاً چای بیاورید.
    note: 'شناسهٔ آخر فعل نشان می‌دهد چه کسی کار را انجام می‌دهد. *بیاورم* (من بیاورم) پیشنهاد است: من برایتان انجام می‌دهم. *بیاورین* (شما بیاورید) خواهش است: شما برای من انجام بدهید. پس *کیسه هم بدهم؟* پیشنهاد دکان‌دار است و *کیسه بدهین* خواستهٔ مشتری.'
  prs.a2.unit31.lesson03.teach.sugar:
    title: شکر
    gloss: شکر
    note: '*قند* همان قند است. مردم در افغانستان چای را با *قند* یا بدون قند می‌نوشند.'
    example_gloss: چای با قند خوب است.
  prs.a2.unit31.lesson03.teach.kindness:
    title: لطف
    gloss: لطف، محبت
    note: '*لطف* یعنی مهربانی. *لطف می‌کنین* یک تشکر مؤدبانه است: شما لطف دارید.'
    example_gloss: از لطف شما تشکر.
  prs.a2.unit31.lesson03.teach.self:
    title: خودم
    gloss: خودم، به‌تنهایی
    note: '*خودم* یعنی خودم. *خودم می‌کنم* یعنی خودم انجامش می‌دهم.'
    example_gloss: کار را خودم انجام می‌دهم.
  prs.a2.unit31.lesson03.teach.yes_please:
    title: بله، لطفاً
    gloss: بله، لطفاً.
    note: با این جمله پیشنهادی را می‌پذیرید. بعد از *بلی* می‌توانید *تشکر* هم اضافه کنید.
  prs.a2.unit31.lesson03.teach.yes_kind:
    title: بله، ممنون، لطف دارید
    gloss: بله، لطفاً. لطف می‌کنید.
    note: راه گرم‌تری برای پذیرفتن. *لطف می‌کنین* می‌گوید که طرف مقابل لطف می‌کند.
  prs.a2.unit31.lesson03.teach.no_thanks:
    title: نه، ممنون
    gloss: نه، ممنون.
    note: ساده‌ترین رد مؤدبانه. همیشه *تشکر* را اضافه کنید؛ *نه* به‌تنهایی تند است.
  prs.a2.unit31.lesson03.teach.no_need:
    title: لازم نیست
    gloss: لازم نیست.
    note: '*لازم نیست* یعنی ضرورتی ندارد. با آن پیشنهادی را مهربانانه رد می‌کنید. می‌توانید بگویید *نه، تشکر. لازم نیست.* یا *خودم می‌کنم.*'
  prs.a2.unit31.lesson04.teach.neg_pl:
    title: 'نهی: امر منفی با نـ'
    gloss: نکنید، نروید، نگویید، ندهید، نگیرید، نیایید
    note: 'برای نهی کردن، به‌جای *بـ* در فعل امر، *نـ* می‌آید: *بروین* می‌شود *نروین*، *بگویین* می‌شود *نگویین*، *بدهین* می‌شود *ندهین*، *بگیرین* می‌شود *نگیرین*. *کنین* *بـ* ندارد، برای همین فقط *نـ* به اولش اضافه می‌شود: *نکنین*. *بیایین* را باید خوب یاد بگیرید: می‌شود *نیایین*.'
  prs.a2.unit31.lesson04.teach.neg_sg:
    title: نهی برای دوست
    gloss: نکن، نرو، نگو، نده، نیا، نگیر
    note: 'برای دوست همین قاعده بدون شناسه به کار می‌رود: *نکن، نرو، نگو، نده، نیا، نگیر*. *نکن* به‌تنهایی تند است، پس آن را برای دوستان و بچه‌ها نگه دارید. به همسایه همیشه بگویید *نکنین* و *لطفاً* هم اضافه کنید.'
  prs.a2.unit31.lesson04.teach.leave:
    title: 'گذاشتن: بگذارین و نگذارین'
    gloss: بگذار/بگذارید؛ نگذار/نگذارید
    note: '*گذاشتن* یعنی چیزی را جایی گذاشتن یا رها کردن. *دروازه را باز بگذارین* یعنی دروازه را باز بگذارید؛ *دروازه را باز نگذارین* یعنی دروازه را باز نگذارید.'
  prs.a2.unit31.lesson04.teach.dont_late:
    title: لطفاً دیر نکنید
    gloss: لطفاً دیر نکنید.
    note: '*دیر کردن* یعنی تأخیر کردن یا طولش دادن. *لطفاً دیر نکنین* یادآوری مؤدبانه‌ای است پیش از آنکه کسی چیزی بیاورد یا بفرستد.'
  prs.a2.unit31.lesson04.teach.dont_go:
    title: لطفاً فردا نروید
    gloss: لطفاً فردا نروید.
    note: '*لطفاً* همراه با نهی، مؤدبانه از کسی می‌خواهد کاری را نکند.'
  prs.a2.unit31.lesson04.teach.dont_come_late:
    title: لطفاً دیر نیایید
    gloss: لطفاً دیر نیایید.
    note: '*نیایین* شکل منفی *بیایین* (بیایید) است.'
  prs.a2.unit31.lesson04.teach.gate_open:
    title: لطفاً در را باز نگذارید
    gloss: لطفاً دروازه را باز نگذارید.
    note: خواهشی رایج از همسایه یا کسی که به دکان می‌آید.
  prs.a2.unit31.lesson04.teach.park:
    title: لطفاً اینجا ماشین نگذارید
    gloss: لطفاً اینجا ماشین نگذارید.
    note: 'یک کاربرد روزمرهٔ دیگر *نگذارین*: لطفاً اینجا پارک نکنید.'
  prs.a2.unit31.lesson04.teach.no_trouble:
    title: لطفاً زحمت نکشید
    gloss: لطفاً زحمت نکشید.
    note: '*زحمت کشیدن* یعنی خودت را به زحمت انداختن. وقتی کسی چای یا کمک پیشنهاد می‌کند، مردم می‌گویند *لطفاً زحمت نکشین* تا مؤدبانه و با تشکر رد کنند.'
  prs.a2.unit31.lesson04.teach.better_not:
    title: بهتر است فردا نروید
    gloss: بهتر است فردا نروید.
    note: '*بهتر است* راه ملایم‌تری برای نهی کردن است. توصیه است، نه دستور.'
  prs.a2.unit31.lesson05.teach.mrs:
    title: خانم
    gloss: خانم
    note: '*خانم* به‌عنوان عنوان مؤدبانه پیش از نام زن می‌آید: *خانم رحیمه*.'
    example_gloss: خانم رحیمه همسایهٔ ما است.
  prs.a2.unit31.lesson05.teach.mr:
    title: آقا
    gloss: آقا
    note: '*آقای* پیش از نام مرد می‌آید: *آقای مسعود*.'
    example_gloss: آقای مسعود در دکان است.
  prs.a2.unit31.lesson05.teach.flower:
    title: گل
    gloss: گل
    note: '*گل* یعنی گل. برای جمع *‌ها* و برای «من» *-م* اضافه کنید: *گل‌هایم* (گل‌هایم).'
    example_gloss: گل‌هایم در خانه‌اند.
  prs.a2.unit31.lesson05.teach.water:
    title: آب
    gloss: آب
    note: '*آب* یعنی آب. *آب دادن* یعنی آب دادن به گیاه: *به گل‌ها آب بدهین*.'
    example_gloss: من آب می‌خورم.
  prs.a2.unit31.lesson05.teach.not_home:
    title: تا جمعه در خانه نیستم
    gloss: تا جمعه در خانه نیستم.
    note: '*نیستم* یعنی نیستم. *تا جمعه* یعنی تا روز جمعه.'
  prs.a2.unit31.lesson05.teach.may_i:
    title: اجازه هست ...؟
    gloss: می‌شود کلید را پیش شما بگذارم؟
    note: 'با شکل *-م*، *می‌شود که ...؟* برای اجازه گرفتن است: *می‌شود که کلید را پیش شما بگذارم؟* یعنی «می‌توانم کلید را پیش شما بگذارم؟». با شکل *-ین* درخواستی از طرف مقابل است. *می‌شود که کمک کنم؟* (می‌توانم کمک کنم؟) را با *می‌شود که کمک کنین؟* (می‌شود شما کمک کنید؟) مقایسه کنید.'
  prs.a2.unit31.lesson05.teach.people:
    title: ماجده و شفیق همسایه‌اند
    gloss: ماجده و شفیق همسایه‌اند.
    note: در متن زیر ماجده برای همسایه‌اش شفیق یادداشتی می‌گذارد.
  prs.a2.unit31.lesson05.teach.d1_t1:
    title: مسعود کمک می‌خواهد
    gloss: سلام خانم رحیمه. ببخشید، می‌شود امروز کمی کمکم کنید؟
    note: مسعود با سلام و *ببخشین* شروع می‌کند، بعد با *می‌شود که* و شکل *-ین* یعنی *کنین* درخواستش را مطرح می‌کند.
  prs.a2.unit31.lesson05.teach.d1_t2:
    title: رحیمه قبول می‌کند
    gloss: سلام آقای مسعود. البته. چه کار کنم؟
    note: '*البته* یک «بله»ی مؤدبانه است. *چه کار کنم؟* با شکل *-م* می‌پرسد که او چه کاری باید انجام بدهد.'
  prs.a2.unit31.lesson05.teach.d1_t3:
    title: مسعود می‌گوید چه لازم دارد
    gloss: می‌شود این میز را با من به اتاق ببرید؟
    note: خواهش دوم، این بار برای یک چیز مشخص. *با من* یعنی با من.
  prs.a2.unit31.lesson05.teach.d1_t4:
    title: رحیمه می‌پذیرد
    gloss: بله، حتماً.
    note: پذیرفتنی کوتاه و گرم.
  prs.a2.unit31.lesson05.teach.d1_t5:
    title: مسعود چای تعارف می‌کند
    gloss: خیلی ممنون. چای بیاورم؟
    note: '*خیلی تشکر* یعنی «خیلی ممنون». *چای بیاورم؟* یک پیشنهاد با شکل *-م* است.'
  prs.a2.unit31.lesson05.teach.d1_t6:
    title: رحیمه رد می‌کند
    gloss: نه، ممنون. لطفاً زحمت نکشید.
    note: رحیمه با *نه، تشکر* رد می‌کند و بعد با نهی *نکشین* می‌گوید زحمت نکشید.
  prs.a2.unit31.lesson05.teach.message:
    title: یادداشتی برای همسایه
    gloss: سلام آقای شفیق. من فردا به مزار می‌روم و تا جمعه در خانه نیستم. می‌شود کلید خانه‌ام را پیش شما بگذارم؟ لطفاً هر روز به گل‌هایم آب بدهید. لطفاً دروازه را باز نگذارید. از لطف شما ممنون. ماجده
    note: یادداشتی کوتاه با یک اجازه‌خواهی، یک خواهش و یک خواهش منفی. توجه کنید که از همان الگوهای گفت‌وگو استفاده شده است.
  prs.a2.unit31.lesson06.teach.d2_t1:
    title: فرزانه به دکان زنگ می‌زند
    gloss: الو، سلام. می‌شود دو نان و یک شیر به خانهٔ ما بفرستید؟
    note: فرزانه به دکان زنگ می‌زند. *الو* یعنی الو در تلفن. *بفرستین* شکل مؤدبانهٔ خواهش از *فرستادن* است.
  prs.a2.unit31.lesson06.teach.d2_t2:
    title: دکان‌دار قبول می‌کند و ساعت را می‌پرسد
    gloss: بله، حتماً. ساعت چند بفرستم؟
    note: مغازه‌دار قبول می‌کند و با شکل *-م* یعنی *بفرستم* می‌پرسد چه ساعتی بفرستد.
  prs.a2.unit31.lesson06.teach.d2_t3:
    title: فرزانه ساعت را می‌گوید
    gloss: ساعت پنج. لطفاً دیر نکنید.
    note: فرزانه ساعت را می‌گوید و یک نهی اضافه می‌کند.
  prs.a2.unit31.lesson06.teach.d2_t4:
    title: دکان‌دار قول می‌دهد و چای تعارف می‌کند
    gloss: نه، دیر نمی‌کنم. چای هم بفرستم؟
    note: '*نه* اینجا با خواهش منفی موافقت می‌کند: نه، دیر نمی‌کنم. بعد چای تعارف می‌کند.'
  prs.a2.unit31.lesson06.teach.d2_t5:
    title: فرزانه رد می‌کند
    gloss: نه، ممنون. چای دارم.
    note: 'او رد می‌کند و دلیل می‌آورد: چای دارد.'
  prs.a2.unit31.lesson06.teach.d2_t6:
    title: دکان‌دار گفت‌وگو را تمام می‌کند
    gloss: بسیار خوب.
    note: پایانی کوتاه.
  prs.a2.unit31.lesson06.teach.cannot:
    title: ببخشید، الان نمی‌تونم
    gloss: ببخشید، الان نمی‌تونم.
    note: 'برای جواب منفی دادن به یک درخواست، اول با *متأسفم* یا *ببخشین* عذرخواهی کنید و بعد دلیل یا زمانش را بگویید: *متأسفم، فردا نمی‌توانم.*'
  prs.a2.unit31.lesson06.teach.summary:
    title: کل ساختار
    gloss: درخواست، دستور مؤدبانه، دستور منفی، پیشنهاد
    note: 'درخواست: *می‌شود که ... بدهین؟* یا *لطفاً ... بدهین*. درخواست برای انجام ندادن کاری: *لطفاً ... نکنین*. پیشنهاد: *... بدهم؟* یا *می‌خواهین که ... کنم؟*. جواب‌ها: *بلی، لطفاً.* یا *نه، تشکر.* رد کردن یک درخواست: *متأسفم، نمی‌توانم.*'
exercises:
  prs.a2.unit31.lesson01.exercise01.recognize_bread:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: ممکن است کمی نان به من بدهید؟
    distractors:
    - من به شما نان دادم
    - نان روی میز است
    - من خیلی نان می‌خواهم
    accepted_answers:
    - value: ممکن است کمی نان به من بدهید؟
      status: correct
    feedback: '*می‌شود که* شروع یک درخواست مؤدبانه است و *بدهین* فعل آن است: می‌شود بدهید.'
  prs.a2.unit31.lesson01.exercise02.recognize_help:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: ببخشید، می‌توانید به من کمک کنید؟
    distractors:
    - ببخشید، من به شما کمک می‌کنم
    - ببخشید، مغازه کجاست؟
    - ببخشید، من یک کیسه لازم دارم
    accepted_answers:
    - value: ببخشید، می‌توانید به من کمک کنید؟
      status: correct
    feedback: '*ببخشین* یعنی ببخشید و *می‌شود که کمک کنین؟* یعنی می‌توانید کمک کنید؟'
  prs.a2.unit31.lesson01.exercise03.match_requests:
    instruction: هر درخواست را با معنی‌اش جور کنید. هر کدام می‌تواند بعد از می‌شود که بیاید.
    accepted_answers:
    - value:
        کمی نان بدهین: کمی نان به من بدهید
        یک شیر بدهین: یک بسته شیر به من بدهید
        یک کیسه بدهین: یک کیسه به من بدهید
        کمک کنین: به من کمک کنید
        صبر کنین: صبر کنید
        تیلفون کنین: به من تلفن کنید
        به خانه بفرستین: آن را به خانه بفرستید
        دروازه را باز کنین: در را باز کنید
      status: correct
    feedback: 'بعد از *می‌شود که* همهٔ این‌ها فعل التزامی با پایان *-ین* هستند. فعل‌های دو بخشی بخش اول را نگه می‌دارند: *کمک کنین، صبر کنین، تیلفون کنین، باز کنین*.'
    pairs:
    - left: کمی نان بدهین
      right: کمی نان به من بدهید
    - left: یک شیر بدهین
      right: یک بسته شیر به من بدهید
    - left: یک کیسه بدهین
      right: یک کیسه به من بدهید
    - left: کمک کنین
      right: به من کمک کنید
    - left: صبر کنین
      right: صبر کنید
    - left: تیلفون کنین
      right: به من تلفن کنید
    - left: به خانه بفرستین
      right: آن را به خانه بفرستید
    - left: دروازه را باز کنین
      right: در را باز کنید
  prs.a2.unit31.lesson01.exercise04.order_bread:
    instruction: 'کلمه‌ها را مرتب کنید تا بگویید: ممکن است کمی نان به من بدهید؟'
    accepted_answers:
    - value:
      - می‌شود
      - که
      - کمی
      - نان
      - بدهین
      status: correct
    feedback: '*می‌شود که کمی نان بدهین؟* فعل را در آخر می‌آورد.'
  prs.a2.unit31.lesson01.exercise05.complete_milk:
    instruction: 'درخواست را کامل کنید: می‌شود یک پاکت شیر به من بدهید؟'
    accepted_answers:
    - value: بدهین
      status: correct
    feedback: '*بدهین* شکل التزامی مؤدبانهٔ *دادن* است: *می‌شود که یک شیر بدهین؟*'
  prs.a2.unit31.lesson01.exercise06.translate_bag:
    instruction: 'به دری (افغانستان) ترجمه کنید: می‌شود یک کیسه به من بدهید؟'
    accepted_answers:
    - value: می‌شود که یک کیسه بدهین؟
      status: correct
    - value: ببخشین، می‌شود که یک کیسه بدهین؟
      status: correct
    - value: می‌شود یک کیسه بدهین؟
      status: correct
    - value: ببخشین، می‌شود یک کیسه بدهین؟
      status: correct
    - value: می‌توانین یک کیسه بدهین؟
      status: correct
    - value: ببخشین، می‌توانین یک کیسه بدهین؟
      status: correct
    - value: ممکن است که یک کیسه بدهین؟
      status: correct
    feedback: '*می‌شود که یک کیسه بدهین؟* یعنی می‌شود یک کیسه بدهید؟ می‌توانید *ببخشین* هم اضافه کنید، *که* را نگویید یا با *می‌توانین* بپرسید.'
  prs.a2.unit31.lesson02.exercise01.recognize_come_here:
    instruction: این جمله چه معنی‌ای دارد؟
    correct_option: لطفاً بیایید اینجا
    distractors:
    - لطفاً بروید آنجا
    - من دارم می‌آیم اینجا
    - لطفاً کلید را به من بدهید
    accepted_answers:
    - value: لطفاً بیایید اینجا
      status: correct
    feedback: '*بیایین* دستور مؤدبانهٔ بیایید است و *اینجا* یعنی همین‌جا.'
  prs.a2.unit31.lesson02.exercise02.which_polite:
    instruction: شما با همسایه‌تان صحبت می‌کنید و به او «شما» می‌گویید. کدام جمله درست است؟
    correct_option: لطفاً بیایین.
    distractors:
    - لطفاً بیا.
    - لطفاً می‌آیم.
    - لطفاً آمد.
    accepted_answers:
    - value: لطفاً بیایین.
      status: correct
    feedback: 'به همسایه با دستور *-ین* می‌گویید: *لطفاً بیایین.* شکل ساده *بیا* برای دوست است.'
  prs.a2.unit31.lesson02.exercise03.match_commands:
    instruction: هر دستور را با معنی‌اش جور کنید.
    accepted_answers:
    - value:
        بیا: بیا (به دوست)
        بروین: بروید (به همسایه)
        بده: بده (به دوست)
        بگویین: بگویید (محترمانه)
        بگیرین: بگیرید (محترمانه)
        بیاورین: بیاورید (محترمانه)
        کنین: بکنید (مؤدبانه)
        ببرین: ببرید به یک جا (محترمانه)
      status: correct
    feedback: شکل‌های ساده *بیا، بده* برای دوست‌اند. شکل‌های با *-ین* (*بروین، بگویین، بگیرین، بیاورین، کنین، ببرین*) برای همسایه یا چند نفرند.
    pairs:
    - left: بیا
      right: بیا (به دوست)
    - left: بروین
      right: بروید (به همسایه)
    - left: بده
      right: بده (به دوست)
    - left: بگویین
      right: بگویید (محترمانه)
    - left: بگیرین
      right: بگیرید (محترمانه)
    - left: بیاورین
      right: بیاورید (محترمانه)
    - left: کنین
      right: بکنید (مؤدبانه)
    - left: ببرین
      right: ببرید به یک جا (محترمانه)
  prs.a2.unit31.lesson02.exercise04.order_wait:
    instruction: 'کلمه‌ها را مرتب کنید تا بگویید: لطفاً کمی صبر کنید.'
    accepted_answers:
    - value:
      - لطفاً
      - کمی
      - صبر
      - کنین
      status: correct
    feedback: '*لطفاً کمی صبر کنین.* *لطفاً* اول می‌آید و فعل آخر.'
  prs.a2.unit31.lesson02.exercise05.complete_wait:
    instruction: 'جمله را کامل کنید: لطفاً کمی صبر کنید.'
    accepted_answers:
    - value: کنین
      status: correct
    - value: کنید
      status: correct
    feedback: '*صبر کنین* یعنی صبر کنید. دستور مؤدبانهٔ *کردن*، *کنین* است.'
  prs.a2.unit31.lesson02.exercise06.translate_bring:
