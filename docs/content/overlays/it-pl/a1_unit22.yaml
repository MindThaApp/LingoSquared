teaching:
  pl.a1.unit22.lesson01.teach.dzwonic:
    title: Chiamare
    gloss: chiamare
    note: L'infinito del verbo per fare una telefonata.
    example_gloss: Devo chiamarti.
  pl.a1.unit22.lesson01.teach.zadzwonie_do_ciebie:
    title: Dire che chiamerai
    gloss: Ti chiamo io.
    note: '*Zadzwonię* è il futuro perfettivo di *zadzwonić* (telefonare, una volta). In polacco si usa per una promessa, come in italiano «ti chiamo».'
  pl.a1.unit22.lesson01.teach.halo_tu_ewa:
    title: Rispondere al telefono
    gloss: Pronto, sono Ewa.
    note: '*Tu* + nome (letteralmente «qui ...») è il modo standard di presentarsi al telefono; in italiano si dice «sono ...».'
  pl.a1.unit22.lesson01.teach.halo_tu_marek:
    title: Marek risponde allo stesso modo
    gloss: Pronto, sono Marek.
    note: Stessa struttura *tu* + nome di *Halo, tu Ewa*.
  pl.a1.unit22.lesson02.teach.z_kim_rozmawiam:
    title: Chiedere chi sta chiamando
    gloss: Con chi parlo?
    note: '*Z kim rozmawiam?* (letteralmente «con chi sto parlando?») è la frase standard per un chiamante sconosciuto; *kim* è lo strumentale dopo *z*.'
  pl.a1.unit22.lesson02.teach.rozmawia_pan_z:
    title: Presentarsi in modo formale
    gloss: Sta parlando con Ewa.
    note: '*Rozmawia pan z Ewą* è la forma formale: *pan* (a un uomo) o *pani* (a una donna) con il verbo alla terza persona, e *z* + strumentale.'
  pl.a1.unit22.lesson03.teach.mozesz_to_powtorzyc:
    title: Chiedere di ripetere
    gloss: Puoi ripetere?
    note: '*Możesz* (puoi, da *móc*) + l''infinito *powtórzyć* (ripetere) + *to* (questo).'
  pl.a1.unit22.lesson03.teach.nie_mow_tak:
    title: Chiedere a qualcuno di rallentare
    gloss: Non parlare così in fretta, per favore.
    note: '*Nie mów* è l''imperativo negativo (non parlare); *tak szybko* significa «così in fretta».'
  pl.a1.unit22.lesson03.teach.nie_slysze_cie:
    title: Dire che non senti bene
    gloss: Non ti sento bene.
    note: '*Nie słyszę cię dobrze* indica un problema di ascolto; *cię* è l''accusativo di *ty* e *dobrze* significa «bene».'
  pl.a1.unit22.lesson04.teach.sms:
    title: Messaggio
    gloss: il messaggio
    note: '*SMS* è un sostantivo maschile preso in prestito dall''inglese: *ten SMS*. In italiano, invece, si dice «un SMS» al maschile come in polacco, ma in polacco il genere si vede anche nel dimostrativo ten.'
    example_gloss: L'SMS è di Ewa.
  pl.a1.unit22.lesson04.teach.wysle_ci_sms:
    title: Dire che manderai un messaggio
    gloss: Ti mando un messaggio.
    note: '*Wysłać* (inviare) vuole il dativo *ci* (a te) per la persona e l''accusativo per la cosa inviata: *Wyślę ci SMS*.'
  pl.a1.unit22.lesson04.teach.oddzwonie_pozniej:
    title: Dire che richiamerai
    gloss: Ti chiamo più tardi.
    note: '*Oddzwonić* (richiamare) in polacco è un unico verbo: *oddzwonię później*.'
  pl.a1.unit22.lesson05.teach.marek_czesc_ewo:
    title: Leggi uno scambio di messaggi
    gloss: 'Marek: Ciao Ewa, puoi chiamarmi? Devo dirti una cosa. Ewa: Sì, certo, ti richiamo tra cinque minuti.'
    note: Individua cosa chiede Marek, perché e quando Ewa dice che richiamerà.
    glosses:
      Cześć: ciao
      możesz: puoi
      zadzwonić: chiamare
      Muszę: devo
      coś: qualcosa
      powiedzieć: raccontare
      oczywiście: certo
      oddzwonię: chiamare
      pięć: cinque
      minut: minuti
      za: restituire
  pl.a1.unit22.lesson06.teach.marek_halo_tu:
    title: Marek risponde alla chiamata
    gloss: 'Marek: Pronto, sono Marek.'
    note: 'La stessa struttura *tu* + nome della lezione 1, ora usata in una vera telefonata: chi risponde parla per primo e dice il proprio nome.'
  pl.a1.unit22.lesson06.teach.ewa_czesc_marku:
    title: Ewa si presenta
    gloss: 'Ewa: Ciao Marek, sono Ewa. Marek: Che bello che chiami!'
    note: '*Fajnie, że* ... (che bello che ...) esprime una reazione positiva a un fatto; *że* introduce la proposizione.'
  pl.a1.unit22.lesson06.teach.ewa_jak_ci:
    title: Ewa chiede del turno
    gloss: 'Ewa: Com''è andato il tuo primo turno?'
    note: '*Jak ci poszła ...?* (letteralmente «come ti è andata ...?») chiede di qualcosa già accaduto. *Ci* è il dativo di *ty*, e *poszła* concorda con il sostantivo femminile *zmiana*.'
  pl.a1.unit22.lesson06.teach.marek_poszlo_bardzo:
    title: Marek dà una bella notizia
    gloss: 'Marek: È andata benissimo, meglio di quanto pensassi.'
    note: '*Poszło* è il passato di *iść* con la desinenza *-o* («esso»; qui nel senso di «andare a finire»); *myślałem* è il passato di *myśleć* (pensare), con la desinenza di chi parla al maschile.'
  pl.a1.unit22.lesson06.teach.czas_przeszly_bylo:
    title: 'Passato: było, poszło, myślałem'
    gloss: 'Passato: *było* (era/è stato) da *być* (essere), *poszło* (è andato) da *iść* (andare), *myślałem* (pensavo) da *myśleć* (pensare).'
    note: 'Il passato polacco si forma con *-ł-* più una desinenza di genere: *myślał* (lui), *myślała* (lei), *było* (neutro). Per ora impara *było*, *poszło* e *myślałem* come forme fisse nei contesti in cui compaiono in questa lezione.'
  pl.a1.unit22.lesson06.teach.ewa_jak_milo:
    title: Ewa è orgogliosa
    gloss: 'Ewa: Che bello sentirlo! Sono fiera di te.'
    note: '*Dumny z* (fiero di) è una combinazione fissa: *z* + genitivo, quindi *z ciebie*. Ewa è una donna, perciò dice *dumna*.'
  pl.a1.unit22.lesson06.teach.marek_dziekuje_ci:
    title: Marek è commosso
    gloss: 'Marek: Grazie mille, per me significa molto.'
    note: '*Znaczy* è la forma di *on/ona/ono* di *znaczyć* (significare); *dla mnie* (per me) indica per chi conta.'
  pl.a1.unit22.lesson06.teach.jego_pierwsza_zmiana:
    title: Il suo
    gloss: Il suo primo turno è andato molto bene.
    note: '*Jego* («suo», di lui) non cambia mai e sta prima del sostantivo: *jego pierwsza zmiana*; il sostantivo femminile non lo influenza.'
