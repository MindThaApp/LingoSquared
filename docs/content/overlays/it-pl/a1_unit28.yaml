  pl.a1.unit28.lesson05.teach.ewa_co_dzien:
    title: Chi viaggia come?
    gloss: Ewa viaggia in treno per andare al lavoro ogni giorno. Marek di solito va in bicicletta, ma quando piove prende anche lui il treno. Tomek preferisce andare in macchina. Kasia abita vicino e va al lavoro a piedi. Tu come vai al lavoro?
    note: Mette a confronto quattro modi diversi di andare al lavoro e una condizione (la pioggia) in una breve lettura.
