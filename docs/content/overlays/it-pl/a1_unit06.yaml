answer_policy:
  diacritics: 'Same standing policy as unit01-05: display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa).
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or diacritics.
