teaching:
  pl.a1.unit06.lesson01.teach.chleb:
    title: Pane
    gloss: pane
    note: 'Una parola base per il cibo: la senti continuamente a ogni pasto.'
    example_gloss: Questo è pane.
  pl.a1.unit06.lesson01.teach.maslo_ser:
    title: Burro, formaggio
    gloss: burro; formaggio
    note: 'Il primo è un sostantivo neutro, il secondo un maschile inanimato: nessuno dei due cambia desinenza dopo proszę o, come spiega la nota di grammatica di questa lezione.'
    example_gloss:
    - Questo è burro.
    - Questo è formaggio.
  pl.a1.unit06.lesson01.teach.woda_mleko:
    title: Acqua, latte
    gloss: acqua; latte
    note: Woda è femminile (l'accusativo wodę compare nella nota di grammatica di questa lezione); mleko è neutro e non cambia mai.
    example_gloss:
    - Questa è acqua.
    - Questo è latte.
  pl.a1.unit06.lesson01.teach.kawa_herbata:
    title: Caffè, tè
    gloss: caffè; tè
    note: 'Entrambi femminili: le forme all''accusativo kawę/herbatę sono quelle che usi davvero quando ordini, come spiega la nota di grammatica di questa lezione.'
    example_gloss:
    - Questo è caffè.
    - Questo è tè.
  pl.a1.unit06.lesson01.teach.prosze_o_note:
    title: 'Ordinare: proszę o + accusativo'
    gloss: 'Mi porti/vorrei + accusativo: caffè -> kawę, tè -> herbatę, acqua -> wodę. Pane, formaggio e latte non cambiano.'
    note: Dopo *Proszę o* ("mi dia, vorrei", letteralmente "chiedo di") si usa l'accusativo. I sostantivi femminili come *kawa*, *herbata* e *woda* sostituiscono la *-a* finale con *-ę*. I maschili inanimati come *chleb* e *ser* e i neutri come *mleko* mantengono esattamente la forma del dizionario.
  pl.a1.unit06.lesson01.teach.prosze_o_kawe:
    title: Un caffè, per favore
    gloss: Un caffè, per favore.
    note: 'Il modo educato e quotidiano per ordinare una sola cosa: applica lo schema della nota di grammatica in una richiesta completa.'
  pl.a1.unit06.lesson02.teach.zupa:
    title: Zuppa
    gloss: zuppa
    note: Un piatto comune a pranzo o a cena, spesso anche il piatto del giorno, come nella scena al ristorante di questa unità.
    example_gloss: Questa è zuppa.
  pl.a1.unit06.lesson02.teach.sok:
    title: Succo
    gloss: succo
    note: 'Maschile inanimato, come chleb e ser: la desinenza non cambia quando lo ordini.'
    example_gloss: Questo è succo.
  pl.a1.unit06.lesson02.teach.cukier:
    title: Zucchero
    gloss: zucchero
    note: Utile per il caffè o il tè; anche questo è maschile inanimato, quindi la desinenza non cambia.
    example_gloss: Questo è zucchero.
  pl.a1.unit06.lesson02.teach.rachunek:
    title: Il conto
    gloss: il conto
    note: 'Quello che chiedi alla fine del pasto: proszę o rachunek è il modo standard e cortese per chiederlo.'
    example_gloss: Il conto, per favore.
  pl.a1.unit06.lesson02.teach.lubic_note:
    title: 'Piacere: lubię, lubi'
    gloss: 'amare/gradire, piacere: mi piace, gli/le piace -- Mi piace il caffè. A lui piace la zuppa.'
    note: '*Lubić* è il verbo che usiamo per dire «mi piace» o «gli piace». Qui si studiano solo la 1ª persona (*lubię*) e la 3ª persona (*lubi*). In polacco *Lubić* regge l''accusativo, come *proszę o*. Si dice *lubię kawę*, non *lubię kawa*.'
  pl.a1.unit06.lesson02.teach.lubie_zupe:
    title: Mi piace la zuppa
    gloss: Mi piace la zuppa.
    note: 'Zupa diventa zupę all''accusativo: è lo stesso passaggio femminile -a -> -ę visto nella nota di grammatica della lezione 1.'
  pl.a1.unit06.lesson03.teach.danie_dnia:
    title: Il piatto del giorno
    gloss: Il piatto del giorno è la zuppa.
    note: '*Dnia* è il genitivo di *dzień* (giorno): *danie dnia* significa letteralmente "il piatto del giorno", proprio come si legge su un menu.'
  pl.a1.unit06.lesson03.teach.polecac_note:
    title: 'Consigliare: polecam, poleca'
    gloss: 'consigliare: consiglio, consiglia -- Consiglio il caffè. Lui consiglia la zuppa.'
    note: '*Polecać* è il verbo "consigliare": il cameriere lo usa per suggerire un piatto e il cliente lo usa per chiedere un consiglio. Anche questo verbo vuole l''accusativo, come *proszę o* e *lubić*.'
  pl.a1.unit06.lesson03.teach.co_pan_poleca:
    title: Che cosa consiglia?
    gloss: Che cosa consiglia?
    note: '*Co* (che cosa) più il *pan* di cortesia: la domanda naturale da rivolgere a un cameriere, con lo stesso appellativo formale dell''unità 1.'
  pl.a1.unit06.lesson03.teach.prosze_bardzo:
    title: Ecco a Lei / prego
    gloss: Ecco a Lei.
    note: 'Una formula flessibile e quotidiana: si dice quando si serve qualcosa ed è altrettanto naturale come risposta a dziękuję (grazie).'
  pl.a1.unit06.lesson03.teach.juz_podaje:
    title: Subito
    gloss: Subito.
    note: 'Letteralmente "già servo": è la risposta standard del cameriere per confermare di aver sentito l''ordinazione.'
  pl.a1.unit06.lesson03.teach.dialogue.line01:
    title: Il cameriere annuncia il piatto del giorno
    gloss: Il cameriere saluta e annuncia che il piatto del giorno è la zuppa.
    note: Dzień dobry, già visto tra i saluti dell'unità 1.
  pl.a1.unit06.lesson03.teach.dialogue.line02:
    title: Ewa chiede un consiglio
    gloss: Ewa chiede al cameriere che cosa consiglia.
    note: 'Una domanda cortese e formale: con pan ci si rivolge al cameriere con rispetto.'
  pl.a1.unit06.lesson03.teach.dialogue.line03:
    title: Il cameriere consiglia il caffè
    gloss: Il cameriere consiglia il caffè.
    note: 'Polecam: la forma della 1ª persona vista nella nota di grammatica di questa lezione.'
  pl.a1.unit06.lesson03.teach.dialogue.line04:
    title: Ewa ordina
    gloss: Ewa dice va bene e ordina un caffè e una zuppa.
    note: Unisce proszę o alla congiunzione i (e) dell'unità sulla famiglia, riprendendo lo schema di ordinazione della lezione 1 e il lessico della zuppa della lezione 2.
  pl.a1.unit06.lesson03.teach.dialogue.line05:
    title: Il cameriere conferma
    gloss: Il cameriere dice che l'ordinazione arriva subito.
    note: Una breve e naturale conferma prima che arrivi il cibo.
  pl.a1.unit06.lesson03.teach.dialogue.line06:
    title: Ewa chiede il conto
    gloss: Ewa ringrazia e chiede il conto.
    note: Riprende dziękuję dell'unità 1 e proszę o + rachunek della lezione 2.
  pl.a1.unit06.lesson03.teach.dialogue.line07:
    title: Il cameriere porta il conto
    gloss: 'Il cameriere dice: ecco a Lei.'
    note: Lo stesso proszę bardzo visto prima in questa lezione, qui usato per consegnare il conto.
