teaching:
  pl.a1.unit23.lesson01.teach.ile_to_kosztuje:
    title: Chiedere il prezzo totale
    gloss: Quanto costa in totale?
    note: '*W sumie* (in tutto) chiarisce che vuoi il prezzo complessivo, non quello di un singolo articolo.'
  pl.a1.unit23.lesson01.teach.w_sumie_to:
    title: Dire il prezzo totale
    gloss: Costa cento złoty in tutto.
    note: '*Kosztuje* è la forma *on/ona/ono* di *kosztować* (costare). I numeri dal 5 in su vogliono il genitivo plurale: *sto złotych*.'
  pl.a1.unit23.lesson02.teach.placic_karta_placic:
    title: Pagare con la carta o in contanti
    gloss: pagare con la carta, pagare in contanti
    note: '*Płacić kartą* (pagare con la carta) e *płacić gotówką* (pagare in contanti) usano entrambi lo strumentale dopo *płacić*: *kartą*, *gotówką*.'
    example_gloss:
    - Posso pagare con la carta qui?
    - Pago in contanti.
  pl.a1.unit23.lesson02.teach.czy_moge_tu:
    title: Chiedere se si può pagare con la carta
    gloss: Posso pagare con la carta qui?
    note: '*Tu* (qui) colloca la domanda nel luogo in cui ti trovi; *czy* introduce una domanda sì/no e *mogę* significa «posso».'
  pl.a1.unit23.lesson02.teach.czy_chce_pan:
    title: Chiedere come si preferisce pagare
    gloss: Preferisce pagare in contanti o con la carta?
    note: '*Czy chce pan ...?* è la versione formale di *Czy chcesz ...?*, usata qui da un cassiere sconosciuto (*pan* per un uomo, *pani* per una donna).'
  pl.a1.unit23.lesson03.teach.rachunek:
    title: Il conto
    gloss: il conto
    note: 'Un sostantivo maschile: *rachunek* (genitivo *rachunku*).'
    example_gloss: Dividiamo il conto?
  pl.a1.unit23.lesson03.teach.moze_podzielimy_rachunek:
    title: Proporre di dividere il conto
    gloss: Dividiamo il conto?
    note: '*Może podzielimy ...?* è un modo cortese per proporre qualcosa insieme; *podzielimy* è la forma di *my* di *podzielić*.'
  pl.a1.unit23.lesson03.teach.czy_moge_zaplacic:
    title: Chiedere di pagare separatamente
    gloss: Posso pagare separatamente?
    note: '*Osobno* (separatamente) si abbina a *zapłacić* (pagare, perfettivo: un unico pagamento concluso).'
  pl.a1.unit23.lesson04.teach.reszta:
    title: Il resto
    gloss: il resto
    note: 'Un sostantivo femminile: *reszta* (genitivo *reszty*, come in *nie potrzebuję reszty*).'
    example_gloss: Ecco il suo resto.
  pl.a1.unit23.lesson04.teach.oto_pana_reszta:
    title: Dare il resto
    gloss: Ecco il suo resto.
    note: '*Pana* è il «suo» formale (rivolto a un uomo; *pani* per una donna), in linea con il registro formale al banco.'
  pl.a1.unit23.lesson04.teach.nie_potrzebuje_reszty:
    title: Rifiutare il resto
    gloss: Non mi serve il resto.
    note: '*Nie potrzebuję* + genitivo: la negazione mette il complemento oggetto al genitivo, quindi *reszty*.'
  pl.a1.unit23.lesson05.teach.trzydziesci_piec:
    title: Trentacinque
    gloss: trentacinque
    note: '*Trzydzieści pięć* si scrive in due parole: prima le decine, poi le unità (30 + 5).'
    example_gloss: Costa centoquaranta złoty.
  pl.a1.unit23.lesson05.teach.rachunek_dwa_dania:
    title: Leggere un conto del ristorante
    gloss: 'Conto: due piatti principali e due caffè. Totale: centoquaranta złoty. Pagato con carta.'
    note: Individua che cosa è stato ordinato, il totale e come è stato pagato.
    glosses:
      Rachunek: conto
      dwa: due
      dania: piatti principali (dania główne)
      kawy: caffè
      Razem: totale
      złotych: złoty
      Zapłacono: pagato
      kartą: carta
      sto: cento
      czterdzieści: quaranta
  pl.a1.unit23.lesson06.teach.ewa_moze_poprosimy:
    title: Ewa chiede il conto
    gloss: 'Ewa: Chiediamo il conto?'
    note: '*Poprosić o* (chiedere) è seguito dall''accusativo: *o rachunek*. *Poprosimy* è il futuro perfettivo.'
  pl.a1.unit23.lesson06.teach.marek_tak_dobry:
    title: Marek chiede il totale
    gloss: 'Marek: Sì, buona idea. Quanto costa in tutto?'
    note: Riprende la domanda *Ile to kosztuje w sumie?* della lezione 1.
  pl.a1.unit23.lesson06.teach.ewa_to_trzydziesci:
    title: Ewa dice il totale
    gloss: 'Ewa: Sono centoquaranta złoty. Dividiamo?'
    note: '*Podzielimy się?* (letteralmente «ci dividiamo?») usa il riflessivo *się* per indicare che si divide il conto.'
  pl.a1.unit23.lesson06.teach.marek_nie_dzisiaj:
    title: Marek insiste per pagare
    gloss: 'Marek: No, oggi pago io. Mi hai aiutato tanto!'
    note: '*Dzisiaj ja płacę* (letteralmente «oggi io pago») è il modo standard per offrirsi di pagare; *pomogłaś* è il passato femminile di *pomóc* (aiutare), perché Marek parla a Ewa.'
  pl.a1.unit23.lesson06.teach.ewa_jak_milo:
    title: Ewa è commossa
    gloss: 'Ewa: Che gentile da parte tua! Grazie.'
    note: '*Miło z twojej strony* (gentile da parte tua) è un complimento caloroso e comune per un gesto generoso; *z* + genitivo: *z twojej strony*.'
  pl.a1.unit23.lesson06.teach.marek_czy_moge:
    title: Marek chiede se può pagare con la carta
    gloss: 'Marek: Posso pagare con la carta qui?'
    note: Riprende la domanda *Czy mogę tu zapłacić kartą?* della lezione 2, ora nel ristorante vero e proprio.
  pl.a1.unit23.lesson06.teach.marek_placi_rachunek:
    title: 'Płaci: la forma di lui/lei'
    gloss: Marek paga il conto.
    note: '*Płaci* è la forma *on/ona/ono* di *płacić* (pagare).'
