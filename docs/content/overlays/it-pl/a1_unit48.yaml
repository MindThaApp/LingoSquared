  pl.a1.unit48.lesson04.exercise01.listen_jaki_film_chce:
    instruction: Ascolta e scegli che cosa chiede Iga.
    correct_option: Buon pomeriggio! Quale film vuole vedere?
    distractors:
    - Buon pomeriggio! Quale posto desidera?
    - Buonasera! Il film è esaurito?
    - Buongiorno! Desidera i popcorn?
