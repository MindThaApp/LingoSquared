  pl.a1.unit48.lesson04.exercise02.comprehend_nowy_film:
    instruction: Ascolta il dialogo e scegli quale film vuole vedere Nina.
    correct_option: Il film nuovo.
    distractors:
    - La proiezione per bambini.
    - Va bene qualsiasi film.
    - Non lo dice.
    accepted_answers:
    - value: Il film nuovo.
      status: correct
    feedback: Nina vuole *nowy film*. L'aggettivo *nowy* concorda con *film*, maschile; essendo un oggetto inanimato, all'accusativo resta uguale.
    prompt_blocks:
    - Che film vuole vedere Nina?
  pl.a1.unit48.lesson04.exercise03.comprehend_a_na_ktora:
    instruction: Ascolta il dialogo e scegli che cosa chiede poi Iga a Nina.
    correct_option: Per che ora vuole la proiezione.
    distractors:
    - Se vuole i popcorn.
    - Se vuole lo scontrino.
    - Non chiede nulla.
    accepted_answers:
    - value: Per che ora vuole la proiezione.
      status: correct
    feedback: Iga chiede *a na którą godzinę?* *Na* + accusativo si usa per l'ora per cui si prenota uno spettacolo, e *którą* concorda con *godzina*, femminile.
    prompt_blocks:
    - Che cosa chiede poi Iga a Nina?
  pl.a1.unit48.lesson04.exercise04.comprehend_na_osma:
    instruction: Ascolta il dialogo e scegli a che ora vuole la proiezione Nina.
    correct_option: Alle otto.
    distractors:
    - Alle sette.
    - Alle sei.
    - Il dialogo non lo dice.
    accepted_answers:
    - value: Alle otto.
      status: correct
    feedback: Nina dice *na ósmą* («per le otto»). Il numerale ordinale *ósma* concorda con *godzina*, femminile, e dopo *na* è all'accusativo.
    prompt_blocks:
    - A che ora vuole la proiezione Nina?
