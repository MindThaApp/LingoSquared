teaching:
  pl.a1.unit04.lesson01.teach.pierwsza_druga_trzecia:
    title: L'una, le due, le tre
    gloss: l'una; le due; le tre
    note: 'In polacco l''ora si dice con i numeri ordinali femminili, che concordano con il sostantivo femminile sottinteso *godzina* («ora»): *pierwsza* significa letteralmente «la prima (ora)».'
    example_gloss:
    - È l'una.
    - Sono le due.
    - Sono le tre.
  pl.a1.unit04.lesson01.teach.czwarta_piata_szosta:
    title: Le quattro, le cinque, le sei
    gloss: le quattro; le cinque; le sei
    note: Stesso schema degli ordinali femminili di *pierwsza*, *druga*, *trzecia*.
    example_gloss:
    - Sono le quattro.
    - Sono le cinque.
    - Sono le sei.
  pl.a1.unit04.lesson01.teach.siodma_osma_dziewiata:
    title: Le sette, le otto, le nove
    gloss: le sette; le otto; le nove
    note: Le tre ore centrali delle dodici, con lo stesso schema.
    example_gloss:
    - Sono le sette.
    - Sono le otto.
    - Sono le nove.
  pl.a1.unit04.lesson01.teach.dziesiata_jedenasta_dwunasta:
    title: Le dieci, le undici, le dodici
    gloss: le dieci; le undici; le dodici
    note: Le ultime tre ore, che completano la serie completa da 1 a 12.
    example_gloss:
    - Sono le dieci.
    - Sono le undici.
    - Sono le dodici.
  pl.a1.unit04.lesson01.teach.ktora_jest_godzina:
    title: Chiedere l'ora
    gloss: Che ore sono?
    note: 'Letteralmente «quale è l''ora?»: *która* concorda con il femminile *godzina*, lo stesso accordo che incontrerai in tutta l''unità.'
  pl.a1.unit04.lesson01.teach.godzina_note:
    title: Godzina è femminile
    gloss: Si dice pierwsza, druga, trzecia, non pierwszy, drugi, trzeci.
    note: '*Pierwszy*, *drugi*, *trzeci* sono le forme maschili degli stessi numeri ordinali, usate altrove in polacco con i nomi maschili, ma mai per dire l''ora, perché *godzina* è femminile.'
  pl.a1.unit04.lesson02.teach.rano_poludnie_popoludniu:
    title: Mattina, mezzogiorno, pomeriggio
    gloss: di mattina; a mezzogiorno; di pomeriggio
    note: '*Rano* sta da solo (senza preposizione); *w południe* e *po południu* mantengono ciascuno la propria preposizione fissa: conviene memorizzare queste tre espressioni come formule fisse, invece di ricavarle da una regola generale.'
    example_gloss:
    - La mattina bevo il caffè.
    - Pranzo a mezzogiorno.
    - Lavoro il pomeriggio.
  pl.a1.unit04.lesson02.teach.wieczorem_w_nocy:
    title: Sera, notte
    gloss: di sera; di notte
    note: '*Wieczorem* è una forma avverbiale fissa (non serve la preposizione); *w nocy* unisce *w* al locativo di *noc* (notte).'
    example_gloss:
    - La sera guardo la TV.
    - Di notte dormo.
  pl.a1.unit04.lesson02.teach.o_ktorej_godzinie:
    title: Chiedere a che ora
    gloss: A che ora?
    note: Si usa al posto di *Która jest godzina?* quando si chiede a che ora avverrà qualcosa, e non che ora è adesso.
  pl.a1.unit04.lesson02.teach.locative_hour_note:
    title: Dire «a» una certa ora
    gloss: Le quattro, le sette, le dieci -- ma alle quattro, alle sette, alle dieci.
    note: 'Dopo *o* («a», «alle»), la *-a* finale della parola dell''ora diventa *-ej*: *czwarta* → *o czwartej*, *siódma* → *o siódmej*, *dziesiąta* → *o dziesiątej*. Tutte le ore seguono questo schema; l''unica particolarità ortografica è *druga* → *o drugiej*, che aggiunge una *i* dopo la *g*.'
  pl.a1.unit04.lesson02.teach.ewa_wstaje:
    title: Ewa si alza presto
    gloss: Ewa si alza alle 7 di mattina.
    note: '*Wstaje* è la terza persona singolare di *wstawać* (alzarsi).'
  pl.a1.unit04.lesson02.teach.pociag_odjezdza:
    title: L'orario di partenza del treno
    gloss: Il treno parte alle 4 del pomeriggio.
    note: '*Odjeżdża* è la terza persona singolare di *odjeżdżać* (partire).'
  pl.a1.unit04.lesson03.teach.spotkanie:
    title: Incontro
    gloss: riunione
    note: È la stessa parola incontrata nell'unità 3 (*Kiedy jest spotkanie?*), quando Ewa e Marek si sono accordati su un giorno e una data per rivedersi.
    example_gloss: L'incontro è venerdì.
  pl.a1.unit04.lesson03.teach.o_ktorej_mozemy_sie_spotkac:
    title: Chiedere a che ora incontrarsi
    gloss: A che ora possiamo incontrarci venerdì 15 maggio?
    note: 'Unisce *o której godzinie* di questa unità al giorno e alla data dell''unità 3: Ewa e Marek hanno già stabilito venerdì 15 maggio e ora devono fissare l''ora esatta.'
  pl.a1.unit04.lesson03.teach.moze_o_czwartej:
    title: Proporre un orario
    gloss: Magari alle 4 del pomeriggio?
    note: '*Może* da solo significa «magari», «forse»: un modo naturale e morbido di proporre un orario.'
  pl.a1.unit04.lesson03.teach.czwarta_mi_odpowiada:
    title: Confermare che l'orario va bene
    gloss: Le 4 del pomeriggio vanno bene per me.
    note: 'Stesso schema *[time] + mi + odpowiada* di *Piątek mi odpowiada* dell''unità 3: l''orario stesso è il soggetto grammaticale, e *odpowiadać* vuole sempre la persona al dativo (*mi*, «a me»).'
  pl.a1.unit04.lesson03.teach.do_zobaczenia_o_czwartej:
    title: Confermare il programma completo
    gloss: A presto, il 15 maggio alle 4!
    note: Riprende il saluto *Do zobaczenia* dell'unità 1, ora insieme a una data e a un'ora.
  pl.a1.unit04.lesson03.teach.dialogue.line01:
    title: Ewa chiede un orario
    gloss: Ewa chiede a Marek a che ora possono incontrarsi venerdì 15 maggio.
    note: Riprende esattamente la domanda iniziale di questa lezione.
  pl.a1.unit04.lesson03.teach.dialogue.line02:
    title: Marek propone le 4 del pomeriggio
    gloss: Marek propone le 4 del pomeriggio.
    note: 'Un suggerimento morbido, non un''affermazione decisa: è questo che segnala *może*.'
  pl.a1.unit04.lesson03.teach.dialogue.line03:
    title: Ewa conferma
    gloss: Ewa dice che le 4 del pomeriggio vanno bene per lei.
    note: La stessa costruzione con il dativo dello scambio sul venerdì nell'unità 3.
  pl.a1.unit04.lesson03.teach.dialogue.line04:
    title: Marek chiude il programma
    gloss: Marek dice «perfetto» e «a presto, il 15 maggio alle 4!»
    note: '*Świetnie* riprende l''esclamazione di entusiasmo dell''unità 3.'
  pl.a1.unit04.lesson03.teach.dialogue.line05:
    title: Ewa saluta
    gloss: Ewa ricambia il saluto.
    note: 'La chiusura più breve possibile: solo il saluto.'
