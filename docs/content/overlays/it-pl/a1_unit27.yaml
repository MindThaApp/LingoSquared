    - Kasia va a nuotare.
  pl.a1.unit27.lesson01.teach.jaki_sport_uprawiasz:
    title: Che sport pratichi?
    gloss: Che sport pratichi?
  pl.a1.unit27.lesson01.teach.gram_w_pilke:
    title: Gioco a calcio
    gloss: Gioco a calcio.
    note: '*Gram w piłkę nożną* (letteralmente «gioco in calcio») usa *grać w* + accusativo; gli altri sport usano altri verbi. Vedi la nota di grammatica.'
  pl.a1.unit27.lesson01.teach.kazdy_sport_ma:
    title: Un verbo per ogni sport
    gloss: 'Ogni sport ha il suo verbo: *gram w piłkę nożną*, *biegam*, *pływam*, *ćwiczę jogę*.'
    note: 'Una sola costruzione vale per tutti gli sport: a questo livello non serve imparare un verbo diverso per ogni sport.'
  pl.a1.unit27.lesson02.teach.razy_w_tygodniu:
    title: Volte a settimana
    gloss: volte a settimana
    example_gloss: Faccio yoga due volte a settimana.
  pl.a1.unit27.lesson02.teach.dwa_razy_w:
    title: Razy w tygodniu
    gloss: Conosci già *codziennie* (ogni giorno) e *często* (spesso). *Dwa razy w tygodniu* (due volte a settimana) è un modo nuovo e più preciso per dire quanto spesso.
    note: Amplia il lessico della frequenza già introdotto nell'unità sugli hobby.
  pl.a1.unit27.lesson02.teach.dwa_razy_w_2:
    title: Faccio yoga due volte a settimana
    gloss: Faccio yoga due volte a settimana.
  pl.a1.unit27.lesson02.teach.marek_czesto_gra:
    title: Marek gioca spesso a calcio
    gloss: Marek gioca spesso a calcio.
    note: '*Często* (spesso) è l''avverbio di frequenza e di solito sta prima del verbo: *Marek często gra w piłkę nożną.*'
  pl.a1.unit27.lesson03.teach.uprawiam_sport_tak:
    title: Uprawiać sport e gram w
    gloss: '*Uprawiam sport* dice in generale che fai sport. Un verbo come *gram w piłkę nożną* indica lo sport specifico. Entrambe le forme sono corrette in polacco.'
    note: '*Uprawiać sport* è il verbo generico della lezione sugli hobby; verbi come *grać w* indicano lo sport specifico. Uno è generico, l''altro specifico.'
  pl.a1.unit27.lesson03.teach.uprawiac_sport:
