    gloss: 'Tomek: Nel parco, vicino a casa mia.'
  pl.a1.unit27.lesson04.teach.biegac_biegam_biegasz:
    title: Biegać cambia con la persona
    gloss: '*Biegać* (correre) cambia la desinenza secondo la persona: *biegam* (io corro), *biegasz* (tu corri), *biega* (lui corre).'
    note: 'I verbi polacchi hanno una desinenza diversa per ogni persona, perciò il pronome soggetto di solito si omette, come in italiano: *biegam*, *biegasz*, *biega*.'
  pl.a1.unit27.lesson04.teach.marek_fajnie_czesto:
    title: Marek reagisce
    gloss: 'Marek: Che bello, io ci gioco spesso a calcio.'
  pl.a1.unit27.lesson05.teach.ewa_cwiczy_joge:
    title: Ewa e Kasia parlano di sport
    gloss: Ewa fa yoga due volte a settimana. Adora il movimento tranquillo. Kasia non fa yoga, ma adora nuotare. Kasia nuota spesso, quasi ogni settimana. Tu che sport pratichi?
    note: In una breve lettura mette a confronto due sport diversi e due espressioni di frequenza diverse.
    glosses:
      ćwiczy: fa
      dwa: due
      razy: volte
      tygodniu: settimana
      jogę: yoga
      uwielbia: adora
      spokojny: con calma
      ruch: muoversi
      pływać: nuotare
      pływa: nuota
      często: spesso
      prawie: quasi
      jaki: quale
      sport: sport
  pl.a1.unit27.lesson05.teach.kasia_czesto_plywa:
    title: Kasia nuota spesso, quasi ogni settimana
    gloss: Kasia nuota spesso, quasi ogni settimana.
