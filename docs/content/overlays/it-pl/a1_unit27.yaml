  pl.a1.unit27.lesson06.teach.ewa_moze_pocwiczymy:
    title: Ewa propone
    gloss: 'Ewa: Perché non ci alleniamo insieme?'
  pl.a1.unit27.lesson06.teach.moze_pocwiczymy_razem:
    title: Może poćwiczymy ...?
    gloss: '*Może poćwiczymy ...?* (letteralmente «forse ci alleniamo?») serve a proporre di fare qualcosa insieme; forse conosci già questo schema da una lezione precedente.'
    note: Riprende esattamente la costruzione usata per proporre dei programmi nell'unità sui programmi.
  pl.a1.unit27.lesson06.teach.kasia_tak_fajnie:
    title: Kasia accetta
    gloss: 'Kasia: Sì, che bello! Adoro nuotare.'
  pl.a1.unit27.lesson06.teach.marek_wole_grac:
    title: Marek preferisce il calcio
    gloss: 'Marek: Io preferisco giocare a calcio.'
  pl.a1.unit27.lesson06.teach.tomek_a_ja:
