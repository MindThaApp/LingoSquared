    title: Nina sente parlare di tutti
    gloss: Nina è nuova al caffè linguistico. Chiede a Marek com'è il resto del gruppo. Marek le racconta. Ewa è gentile e paziente; lavora come infermiera. Tomek è divertente e frequenta un corso di spagnolo. Kasia è curiosa; le piace imparare cose nuove. Marek, lui, è calmo.
    note: Riepiloga i tratti di personalità del gruppo, come le letture di confronto delle unità sulla casa, il quartiere, la posta e la cucina.
