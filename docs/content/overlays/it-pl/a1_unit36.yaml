      lubi: piace
      nowych: nuovo
      rzeczy: cose
      Sam: stesso
      spokojny: tranquillo
  pl.a1.unit36.lesson05.teach.wszyscy_w_kawiarni:
    title: Ognuno è diverso, ed è bello
    gloss: Al caffè delle lingue sono tutti diversi, ed è bello.
