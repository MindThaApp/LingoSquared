teaching:
  pl.a1.unit17.lesson01.teach.jestem_zawod_note:
    title: Sono ingegnere / insegnante
    gloss: Sono ingegnere. Sono insegnante. -- 'inżynier' e 'nauczycielka' cambiano desinenza dopo 'Jestem'.
    note: 'È la prima volta, in questo corso, che la desinenza di una parola cambia per indicare la professione: per ora vale solo per queste due parole.'
  pl.a1.unit17.lesson01.teach.inzynier:
    title: Ingegnere
    gloss: ingegnere
    note: Nel polacco di tutti i giorni questa parola resta *inżynier* anche per una donna.
    example_gloss: Marek è ingegnere.
  pl.a1.unit17.lesson01.teach.nauczyciel_nauczycielka:
    title: Insegnante
    gloss: insegnante (maschile) / insegnante (femminile)
    note: 'A differenza di *inżynier*, questa professione cambia secondo il genere: *nauczyciel* per un uomo, *nauczycielka* per una donna.'
    example_gloss:
    - Lui è insegnante.
    - Ewa è insegnante.
  pl.a1.unit17.lesson01.teach.marek_ewa_recap:
    title: Ancora Marek ed Ewa
    gloss: Marek, Ewa -- conosci già questi nomi dalle lezioni precedenti.
    note: Un breve ripasso prima di questa lezione, che li usa entrambi.
  pl.a1.unit17.lesson01.teach.jest_recap:
    title: È -- ancora
    gloss: Jest -- conosci già questa parola dalle lezioni precedenti, per esempio 'Dom jest tam' (la casa è là).
    note: Un breve ripasso prima che questa lezione la usi per parlare del lavoro di qualcuno.
  pl.a1.unit17.lesson01.teach.marek_jest_inzynierem:
    title: Il lavoro di Marek
    gloss: Marek è ingegnere.
    note: Il dato su Marek da cui parte tutta questa unità.
  pl.a1.unit17.lesson01.teach.ewa_jest_nauczycielka:
    title: Il lavoro di Ewa
    gloss: Ewa è insegnante.
    note: Il dato su Ewa da cui parte tutta questa unità.
  pl.a1.unit17.lesson02.teach.pracowac_recap_pracujesz:
    title: Lavorare -- tu lavori
    gloss: 'Pracować (conosci già pracuję dalle lezioni precedenti): pracuję (io), pracujesz (tu). Dove lavori?'
    note: 'Per ora solo due forme: *pracuję* per parlare di te, *pracujesz* per chiederlo a un altro; lo stesso schema di *czuć się* nell''unità precedente.'
  pl.a1.unit17.lesson02.teach.szkola:
    title: Scuola
    gloss: scuola
    note: Il posto dove lavora un'insegnante come Ewa.
    example_gloss: Lavoro in una scuola.
  pl.a1.unit17.lesson02.teach.biuro:
    title: Ufficio
    gloss: ufficio
    note: Il posto dove lavora un ingegnere come Marek.
    example_gloss: Lavoro in un ufficio.
  pl.a1.unit17.lesson02.teach.w_miejsce_pracy_note:
    title: A scuola, in ufficio
    gloss: 'W + luogo di lavoro: w szkole, w biurze -- come w Warszawie o w Krakowie.'
    note: 'Stessa idea dei nomi di città che hai già imparato (*w Warszawie*, *w Krakowie*): la desinenza cambia un po'' per dire *in/a* quel luogo.'
  pl.a1.unit17.lesson02.teach.gdzie_pracujesz_phrase:
    title: Dove lavori?
    gloss: Dove lavori?
    note: La domanda naturale per chiedere del lavoro di qualcuno.
  pl.a1.unit17.lesson03.teach.a_ty_recap:
    title: E tu -- ancora
    gloss: A ty -- conosci già questa espressione dalle lezioni precedenti.
    note: Un breve ripasso prima del dialogo di questa lezione.
  pl.a1.unit17.lesson03.teach.dialogue.line01:
    title: Marek chiede a Ewa del lavoro
    gloss: Dove lavori, Ewa?
    note: Marek apre la conversazione con una domanda diretta.
  pl.a1.unit17.lesson03.teach.dialogue.line02:
    title: Risponde Ewa
    gloss: Lavoro in una scuola. Sono insegnante.
    note: Ewa dice sia dove lavora sia che lavoro fa, gli stessi dati visti prima in questa unità.
  pl.a1.unit17.lesson03.teach.dialogue.line03:
    title: Ewa chiede a Marek
    gloss: E tu, Marek? Dove lavori?
    note: Ewa rigira la domanda a Marek.
  pl.a1.unit17.lesson03.teach.dialogue.line04:
    title: Risponde Marek
    gloss: Lavoro in un ufficio. Sono ingegnere.
    note: Marek dice sia dove lavora sia che lavoro fa, gli stessi dati visti prima in questa unità.
