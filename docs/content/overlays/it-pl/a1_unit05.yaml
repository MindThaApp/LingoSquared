teaching:
  pl.a1.unit05.lesson01.teach.rodzina:
    title: La famiglia
    gloss: famiglia
    note: 'La parola generica per «famiglia»: indica l''intero nucleo familiare, non un solo rapporto di parentela.'
    example_gloss: Questa è la mia famiglia.
  pl.a1.unit05.lesson01.teach.matka_ojciec:
    title: Madre, padre
    gloss: madre; padre
    note: Le due parole base per i genitori. Nel parlato quotidiano sentirai anche le forme affettuose mama e tata, ma matka e ojciec sono le forme neutre e standard che si imparano qui.
    example_gloss:
    - Questa è mia madre.
    - Questo è mio padre.
  pl.a1.unit05.lesson01.teach.brat_siostra:
    title: Fratello, sorella
    gloss: fratello; sorella
    note: 'Sono entrambi sostantivi regolari: brat è maschile, siostra è femminile, e questo conta per l''accordo mój/moja della nota di grammatica di questa lezione.'
    example_gloss:
    - Questo è mio fratello.
    - Questa è mia sorella.
  pl.a1.unit05.lesson01.teach.rodzice:
    title: Genitori
    gloss: genitori
    note: 'Rodzice è un plurale maschile personale: ha una propria forma del possessivo, moi (non mój/moja), che vedrai nell''esempio e nella nota di grammatica di questa lezione.'
    example_gloss: I miei genitori abitano a Varsavia.
  pl.a1.unit05.lesson01.teach.moj_moja_note:
    title: 'Mio/mia/miei: mój, moja, moi'
    gloss: mio padre, mio fratello -- mia madre, mia sorella -- i miei genitori.
    note: 'I possessivi polacchi concordano con il genere del sostantivo a cui si riferiscono: *mój* davanti a un sostantivo maschile (*mój ojciec*, *mój brat*), *moja* davanti a un sostantivo femminile (*moja matka*, *moja siostra*), e la forma irregolare a parte *moi* davanti al plurale maschile personale *rodzice*.'
  pl.a1.unit05.lesson01.teach.to_jest_moj_ojciec:
    title: Questo è mio padre
    gloss: Questo è mio padre.
    note: '*To jest* (questo è) resta uguale qualunque sia il genere del sostantivo: cambia solo il possessivo mój/moja.'
  pl.a1.unit05.lesson02.teach.dziadek_babcia:
    title: Nonno, nonna
    gloss: nonno; nonna
    note: Le parole standard di uso quotidiano per nonno e nonna, usate sia dai bambini sia dagli adulti.
    example_gloss:
    - Questo è mio nonno.
    - Questa è mia nonna.
  pl.a1.unit05.lesson02.teach.wujek_ciotka:
    title: Zio, zia
    gloss: zio; zia
    note: Si usano sia per il fratello/la sorella di un genitore sia per il coniuge di un fratello o di una sorella del genitore, proprio come "zio"/"zia" in italiano.
    example_gloss:
    - Questo è mio zio.
    - Questa è mia zia.
  pl.a1.unit05.lesson02.teach.syn_corka:
    title: Figlio, figlia
    gloss: figlio; figlia
    note: 'Gli esempi mostrano l''accusativo necessario dopo *mieć* (avere): *syn* diventa *syna*, *córka* diventa *córkę*. Le note di grammatica che seguono spiegano perché la desinenza cambia.'
    example_gloss:
    - Ho un figlio.
    - Ho una figlia.
  pl.a1.unit05.lesson02.teach.miec_note:
    title: 'Avere: mam, masz, ma'
    gloss: 'avere: io ho, tu hai, lui/lei ha -- io ho un fratello, tu hai una sorella, lui/lei ha un figlio.'
    note: '*Mieć* è il verbo "avere". *Mam* (io ho) e *ma* (lui/lei ha) sono le forme nuove principali di questa lezione; *masz* (tu hai) l''hai già incontrato chiedendo l''età a qualcuno nell''unità 2.'
  pl.a1.unit05.lesson02.teach.accusative_note:
    title: Dire che cosa si ha
    gloss: 'Dopo «avere» il sostantivo cambia desinenza: brat -> brata, siostra -> siostrę, syn -> syna, córka -> córkę.'
    note: Questo è l'accusativo, la forma che il sostantivo assume come complemento oggetto di un verbo come *mieć*. I sostantivi maschili che indicano persone (e animali), come *brat* e *syn*, aggiungono *-a*; i sostantivi femminili come *siostra* e *córka* sostituiscono la *-a* finale con *-ę*.
  pl.a1.unit05.lesson02.teach.mam_brata_siostre:
    title: Ho un fratello e una sorella
    gloss: Ho un fratello e una sorella.
    note: Mette in pratica in una frase completa le desinenze dell'accusativo della nota di grammatica, con in più la nuova congiunzione *i* (e).
  pl.a1.unit05.lesson03.teach.lub:
    title: O
    gloss: o
    note: Si usa come la "o" italiana in una domanda sì/no che propone due alternative.
    example_gloss: Hai un fratello o una sorella?
  pl.a1.unit05.lesson03.teach.tylko:
    title: Solo
    gloss: solo
    note: Si mette subito prima della parola che limita, una posizione possibile anche per "solo" in italiano.
    example_gloss: Ho solo una sorella.
  pl.a1.unit05.lesson03.teach.gdzie:
    title: Dove
    gloss: dove
    note: 'Una parola interrogativa di base: si abbina naturalmente a mieszkać (abitare), come nel dialogo di questa lezione.'
    example_gloss: Dove abita tuo fratello?
  pl.a1.unit05.lesson03.teach.on_ona_mieszka_note:
    title: Lui, lei -- e «abitare»
    gloss: 'lui, lei -- abitare: io abito, lui/lei abita. Lui abita a Danzica. Lei abita a Cracovia.'
    note: '*On* (lui) e *ona* (lei) sono i pronomi di terza persona. *Mieszkać* (abitare) segue lo stesso schema di 1ª/3ª persona di *mieć*: *mieszkam* (io abito, dal *Mieszkam w Warszawie* dell''unità 1) e *mieszka* (lui/lei abita). I nomi di luogo dopo *w* vogliono il locativo: *Gdańsk* diventa *w Gdańsku*, *Kraków* diventa *w Krakowie*, lo stesso schema w + locativo di *Mieszkam w Warszawie* dell''unità 1.'
  pl.a1.unit05.lesson03.teach.dialogue.line01:
    title: Marek chiede dei fratelli
    gloss: Marek chiede a Ewa se ha un fratello o una sorella.
    note: Una domanda sì/no con *Czy*, lo stesso segnale di domanda dell'unità 1. Ewa e Marek ormai si conoscono bene, quindi sono passati dal formale *pan*/*pani* al informale *ty* (*masz*, *A ty?*, *twój*).
  pl.a1.unit05.lesson03.teach.dialogue.line02:
    title: Ewa risponde e restituisce la domanda
    gloss: Ewa dice che ha un fratello e una sorella, poi rivolge la stessa domanda a Marek.
    note: '*A ty?* («E tu?») è un modo breve e naturale per rigirare la domanda a chi l''ha fatta.'
  pl.a1.unit05.lesson03.teach.dialogue.line03:
    title: Marek risponde
    gloss: Marek dice che ha solo una sorella, che abita a Cracovia, poi chiede a Ewa di suo fratello.
    note: 'Marek non ha fratelli: ha *tylko siostrę* (solo una sorella). Può chiedere del fratello di Ewa senza problemi, perché Ewa ha già detto di averne uno.'
  pl.a1.unit05.lesson03.teach.dialogue.line04:
    title: Ewa risponde
    gloss: Ewa dice che suo fratello abita a Danzica e ha un figlio e una figlia.
    note: Riprende lo schema dell'accusativo di syn/córka visto nella lezione 2 di questa unità.
  pl.a1.unit05.lesson03.teach.dialogue.line05:
    title: Marek reagisce
    gloss: 'Marek dice: che bella famiglia!'
    note: '*Fajna* è una parola informale e di uso quotidiano per «bella»/«forte»: una reazione finale naturale, dello stesso registro di *Świetnie!* dell''unità 4.'
