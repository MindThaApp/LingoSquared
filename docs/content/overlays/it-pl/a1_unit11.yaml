teaching:
  pl.a1.unit11.lesson01.teach.chciec_chce:
    title: Volere, voglio
    gloss: volere; voglio
    note: Chcieć è l'infinito; chcę è la forma di uso quotidiano alla prima persona che userai per dire che cosa vuoi.
    example_gloss: Voglio andare al cinema.
  pl.a1.unit11.lesson01.teach.chcesz:
    title: Tu vuoi
    gloss: tu vuoi (informale)
    note: 'Chcesz è la forma informale per «tu», usata come masz e jesteś: è proprio quella che userai per chiedere a un amico che cosa vuole.'
    example_gloss: Vuoi un caffè?
  pl.a1.unit11.lesson01.teach.chciec_osoba_note:
    title: Voglio, vuoi
    gloss: 'Chcę, chcesz -- lo stesso schema di masz (avere) e jesteś (essere): chcesz è la forma per «tu» (seconda persona), che si usa quando chiedi a qualcun altro che cosa vuole.'
    note: 'Questa unità richiede qualcosa in più di «io»: *chcę* (voglio) e *chcesz* (vuoi) seguono lo stesso schema di persona che già conosci da *masz* e *jesteś*, applicato a un verbo nuovo.'
  pl.a1.unit11.lesson01.teach.kino:
    title: Il cinema
    gloss: cinema
    note: 'La parola di tutti i giorni per indicare il cinema: ricorre continuamente quando si fanno programmi.'
    example_gloss: Questo è il cinema.
  pl.a1.unit11.lesson01.teach.razem:
    title: Insieme
    gloss: insieme
    note: Razem significa anche «totale» quando si fa la spesa (forse lo ricordi dall'unità sugli acquisti); qui è usato nell'altro senso comune, «insieme».
    example_gloss: Vuoi andare insieme?
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_do_kina:
    title: Vuoi andare al cinema?
    gloss: Vuoi andare al cinema?
    note: 'Czy introduce una domanda a cui si risponde sì o no; chcesz iść do kina chiede all''altra persona che cosa vuole fare: è il modo base per proporre un programma.'
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_razem_do_kina_w_piatek:
    title: Vuoi andare al cinema insieme venerdì?
    gloss: Vuoi andare al cinema insieme venerdì?
    note: 'La proposta completa: razem (insieme) e w piątek (venerdì) si aggiungono alla domanda che hai appena imparato.'
  pl.a1.unit11.lesson02.teach.moc_moge:
    title: Potere, posso
    gloss: potere; posso
    note: 'Móc è l''infinito; mogę è la prima persona singolare. Forse ricordi możemy («possiamo») dalle unità su date e orari: è lo stesso verbo, al singolare.'
    example_gloss: Posso venire venerdì.
  pl.a1.unit11.lesson02.teach.mozesz:
    title: Puoi
    gloss: puoi (informale)
    note: Możesz è la forma informale del «tu», con la stessa desinenza di seconda persona di chcesz; si usa per chiedere se qualcuno è in grado di fare qualcosa.
    example_gloss: Puoi sabato?
  pl.a1.unit11.lesson02.teach.przyjsc:
    title: Venire
    gloss: venire
    note: Il verbo per venire a un incontro; si abbina naturalmente a mogę/możesz per dire chi può o non può esserci.
    example_gloss: Voglio venire venerdì.
  pl.a1.unit11.lesson02.teach.moc_note:
    title: Posso, puoi
    gloss: 'Móc: mogę, możesz: la stessa seconda persona (tu) di chcesz. Mogę più un infinito dice che cosa puoi fare: mogę przyjść (posso venire), mogę iść (posso andare).'
    note: '*Mogę* + un verbo all''infinito dice che cosa sei in grado di fare: *mogę przyjść* («posso venire») e *mogę iść* («posso andare») seguono lo stesso semplice schema.'
  pl.a1.unit11.lesson02.teach.chetnie:
    title: Volentieri
    gloss: volentieri
    note: Un modo caloroso ed entusiasta di accettare un invito; spesso si abbina a tak (sì) o bardzo (molto) per renderlo ancora più caloroso.
    example_gloss: Sì, molto volentieri!
  pl.a1.unit11.lesson02.teach.niestety:
    title: Purtroppo
    gloss: purtroppo
    note: Il modo naturale per attenuare un rifiuto e declinare con garbo; quasi sempre è seguito da nie mogę (non posso).
    example_gloss: Purtroppo non posso.
  pl.a1.unit11.lesson02.teach.w_sobote_note:
    title: Di sabato
    gloss: 'W + giorno della settimana: i giorni maschili (piątek, poniedziałek, czwartek) non cambiano la desinenza: w piątek. I giorni femminili (sobota, środa, niedziela) prendono la desinenza dell''accusativo -ę, come kawa -> kawę: w sobotę.'
    note: 'Dopo *w* non tutti i giorni si comportano allo stesso modo: i nomi femminili come *sobota* diventano *sobotę*, la stessa desinenza *-a* -> *-ę* che hai già visto in *kawa* -> *kawę* e *herbata* -> *herbatę*. I giorni maschili come *piątek* restano invariati.'
  pl.a1.unit11.lesson02.teach.czy_mozesz_przyjsc_w_sobote:
    title: Puoi venire sabato?
    gloss: Puoi venire sabato?
    note: 'Unisce możesz, przyjść e la nuova forma w sobotę: un modo completo per chiedere di un giorno alternativo.'
  pl.a1.unit11.lesson03.teach.moze:
    title: Forse, che ne dici di
    gloss: forse / che ne dici di
    note: 'La parola per proporre un''alternativa: serve ogni volta che il primo programma salta e vuoi suggerire altro.'
    example_gloss: Che ne dici di sabato?
  pl.a1.unit11.lesson03.teach.moze_vs_moge_note:
    title: Może e mogę
    gloss: 'Może e mogę si assomigliano, ma significano cose diverse: może («forse») propone qualcosa di nuovo; mogę (la forma «io» del verbo, «posso») dice che cosa sei in grado di fare.'
    note: 'Sulla pagina è facile confonderli: *może* («forse», qui usato per suggerire qualcosa) e *mogę* («posso», il verbo alla prima persona) hanno funzioni diverse nella frase, pur avendo la stessa radice: guarda l''ultima lettera.'
  pl.a1.unit11.lesson03.teach.o_ktorej_godzinie:
    title: A che ora?
    gloss: A che ora?
    note: Il modo standard per chiedere un orario preciso quando il giorno è già stabilito; forse ricordi o której dall'unità sull'ora.
  pl.a1.unit11.lesson03.teach.dialogue.line01:
    title: Ewa propone il cinema
    gloss: Ewa chiede a Marek se vuole andare al cinema venerdì.
    note: Riprende la prima domanda insegnata in questa unità, ora dentro una vera conversazione.
  pl.a1.unit11.lesson03.teach.dialogue.line02:
    title: Marek non può venerdì
    gloss: Marek dice che purtroppo venerdì non può.
    note: Niestety attenua il rifiuto prima che nie mogę lo dica chiaramente.
  pl.a1.unit11.lesson03.teach.dialogue.line03:
    title: Marek propone sabato
    gloss: 'Marek chiede: che ne dici di sabato?'
    note: Może offre un'alternativa invece di chiudere la conversazione con un semplice rifiuto.
  pl.a1.unit11.lesson03.teach.dialogue.line04:
    title: Ewa accetta volentieri
    gloss: 'Ewa dice: Sabato? Volentieri!'
    note: Ripete il giorno proposto (mantenendo la forma w sobotę) prima di accettare con chętnie.
  pl.a1.unit11.lesson03.teach.dialogue.line05:
    title: Ewa chiede l'ora
    gloss: 'Ewa chiede: A che ora?'
    note: Stabilito il giorno, l'ultimo dettaglio da fissare è l'ora.
  pl.a1.unit11.lesson03.teach.dialogue.line06:
    title: Marek conferma l'ora
    gloss: 'Marek dice: Alle quattro del pomeriggio.'
    note: Conclude la trattativa con un orario preciso, riprendendo lo schema delle ore delle unità su orari e routine.
