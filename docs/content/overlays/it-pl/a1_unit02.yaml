teaching:
  pl.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: zero
    note: È il punto di partenza per tutti i numeri che seguono in questa unità.
    example_gloss: Oggi ci sono zero gradi.
  pl.a1.unit02.lesson01.teach.jeden:
    title: Uno
    gloss: uno
    note: '*Jeden* vuole dopo di sé un normale sostantivo singolare, a differenza di tutti gli altri numeri di questa lezione.'
    example_gloss: Ho un telefono.
  pl.a1.unit02.lesson01.teach.dwa:
    title: Due
    gloss: due
    note: '*Dwa*, *trzy* e *cztery* vogliono una forma speciale del plurale (come *psy*, "cani"), diversa da quella usata da *pięć* in poi.'
    example_gloss: Ho due cani.
  pl.a1.unit02.lesson01.teach.trzy:
    title: Tre
    gloss: tre
    note: 'Stesso schema del plurale di *dwa*: *trzy złote* (tre zloty), non *trzy złotych*.'
    example_gloss: Il caffè costa tre zloty.
  pl.a1.unit02.lesson01.teach.cztery:
    title: Quattro
    gloss: quattro
    note: L'ultimo dei tre numeri (*dwa*, *trzy*, *cztery*) che condividono questo schema del plurale.
    example_gloss: Ho quattro libri.
  pl.a1.unit02.lesson01.teach.piec:
    title: Cinque
    gloss: cinque
    note: 'Da *pięć* in poi, i numeri vogliono un''altra forma del plurale (il genitivo plurale, ad esempio *minut* e non *minuty*): vedrai questo schema anche nel resto dell''unità.'
    example_gloss: Ho cinque minuti.
  pl.a1.unit02.lesson01.teach.szesc:
    title: Sei
    gloss: sei
    note: 'Stesso schema del genitivo plurale di *pięć*: *sześć jabłek* (sei mele).'
    example_gloss: Ho sei mele.
  pl.a1.unit02.lesson01.teach.siedem:
    title: Sette
    gloss: sette
    note: Un numero utile per parlare dei giorni della settimana.
    example_gloss: In una settimana ci sono sette giorni.
  pl.a1.unit02.lesson01.teach.osiem:
    title: Otto
    gloss: otto
    note: '*Mam osiem lat* significa letteralmente "ho otto anni": come in italiano, l''età si dice con *mieć* ("avere"). Eserciterai questo schema nella lezione 3.'
    example_gloss: Ho otto anni.
  pl.a1.unit02.lesson01.teach.dziewiec:
    title: Nove
    gloss: nove
    note: 'Ancora il genitivo plurale: *dziewięć osób* (nove persone).'
    example_gloss: Nove persone aspettano in fila.
  pl.a1.unit02.lesson01.teach.dziesiec:
    title: Dieci
    gloss: dieci
    note: 'L''ultimo dei numeri a una cifra: la lezione 2 prosegue con i numeri da undici in poi e con le decine.'
    example_gloss: Ho dieci dita.
  pl.a1.unit02.lesson02.teach.jedenascie:
    title: Undici
    gloss: undici
    note: 'I numeri da 11 a 19 terminano in *-naście*, un po'' come i nostri numeri in "-dici" (da undici a sedici). Come *pięć* e i successivi, vogliono il genitivo plurale: *jedenaście osób*.'
    example_gloss: La classe ha undici persone.
  pl.a1.unit02.lesson02.teach.dwanascie:
    title: Dodici
    gloss: dodici
    note: Stesso schema in *-naście* di *jedenaście*.
    example_gloss: In un anno ci sono dodici mesi.
  pl.a1.unit02.lesson02.teach.pietnascie:
    title: Quindici
    gloss: quindici
    note: 'Sempre lo schema dei numeri in *-naście*: *piętnaście minut* (quindici minuti).'
    example_gloss: Ho una pausa di quindici minuti.
  pl.a1.unit02.lesson02.teach.dwadziescia:
    title: Venti
    gloss: venti
    note: I numeri da 20 a 40 terminano in *-dzieści*, uno schema diverso da quello in *-naście*. *Dwadzieścia* vuole ancora il genitivo plurale (*dwadzieścia lat*), ma nella lezione 3 vedrai cosa succede quando si aggiunge una cifra delle unità.
    example_gloss: Ho vent'anni.
  pl.a1.unit02.lesson02.teach.dwadziescia_jeden:
    title: Ventuno
    gloss: ventuno
    note: 'I numeri composti si formano come in italiano: prima la decina, poi l''unità, senza parole di collegamento.'
  pl.a1.unit02.lesson02.teach.trzydziesci:
    title: Trenta
    gloss: trenta
    note: Sempre lo schema in *-dzieści* visto con *dwadzieścia*.
    example_gloss: Il biglietto costa trenta zloty.
  pl.a1.unit02.lesson02.teach.piecdziesiat:
    title: Cinquanta
    gloss: cinquanta
    note: I numeri da 50 a 90 seguono un terzo schema, in *-dziesiąt*, invece di *-dzieści*.
    example_gloss: Ho cinquanta zloty.
  pl.a1.unit02.lesson02.teach.sto:
    title: Cento
    gloss: cento
    note: Un numero tondo, senza terminazioni composte di cui preoccuparsi.
    example_gloss: Costa cento zloty.
  pl.a1.unit02.lesson02.teach.ile:
    title: Quanto / quanti
    gloss: quanto; quanti
    note: La parola interrogativa per chiedere qualsiasi quantità o prezzo.
    example_gloss: Quanto costa?
  pl.a1.unit02.lesson02.teach.ile_to_kosztuje:
    title: Chiedere un prezzo
    gloss: Quanto costa questo?
    note: '*Kosztować* ("costare") è il verbo; *to* ("questo/ciò") è il soggetto. L''intera domanda è una formula fissa molto comune.'
  pl.a1.unit02.lesson02.teach.to_kosztuje_dwadziescia:
    title: Dire un prezzo
    gloss: Questo costa venti zloty.
    note: '*Złotych* è il genitivo plurale di *złoty* (la valuta polacca), lo stesso plurale che vuole anche *dwadzieścia*.'
  pl.a1.unit02.lesson03.teach.jaki_jest_pana_numer:
    title: Chiedere il numero di telefono a un uomo
    gloss: Qual è il suo numero di telefono? (a un uomo, formale)
    note: 'Letteralmente "qual è il numero di telefono del signore". *Pana* è la forma di possesso (genitivo) di *pan*: "del signore", cioè "suo".'
  pl.a1.unit02.lesson03.teach.jaki_jest_pani_numer:
    title: Chiedere il numero di telefono a una donna
    gloss: Qual è il suo numero di telefono? (a una donna, formale)
    note: Sostituisci *pana* con *pani* per rivolgerti a una donna in modo formale, come nello schema dell'unità 1.
  pl.a1.unit02.lesson03.teach.jaki_jest_twoj_numer:
    title: Chiedere il numero di telefono in modo informale
    gloss: Qual è il tuo numero di telefono? (informale)
    note: '*Twój* (tuo, informale) sostituisce *pana*/*pani* quando parli con un amico o un coetaneo.'
  pl.a1.unit02.lesson03.teach.numer_to:
    title: 'Dare un numero: l''introduzione'
    gloss: Il numero è...
    note: 'Una breve formula naturale prima di dire le cifre una per una: è il modo normale in cui i polacchi dettano un numero di telefono.'
  pl.a1.unit02.lesson03.teach.przykladowy_numer:
    title: Un numero di telefono di esempio
    gloss: Sei, uno, cinque, zero, due.
    note: In Polonia i numeri di telefono si leggono cifra per cifra, e ogni cifra qui riprende un numero già studiato in questa unità.
  pl.a1.unit02.lesson03.teach.ile_masz_lat:
    title: Chiedere l'età in modo informale
    gloss: Quanti anni hai? (informale)
    note: 'Letteralmente "quanti anni hai": in polacco l''età si dice con *mieć* ("avere"), lo schema anticipato nella scheda di *osiem* nella lezione 1.'
  pl.a1.unit02.lesson03.teach.ile_pan_ma_lat:
    title: Chiedere l'età in modo formale
    gloss: Quanti anni ha? (a un uomo, formale)
    note: '*Ma* è la stessa forma di terza persona già vista con *pan jest*/*pan ma* nell''unità 1: grammaticalmente *pan* si comporta come "il signore", un soggetto di terza persona.'
  pl.a1.unit02.lesson03.teach.mam_dwadziescia_osiem_lat:
    title: Dire la propria età
    gloss: Ho ventotto anni.
    note: '*Mam* è la prima persona di *mieć* ("avere"). *Dwadzieścia osiem* termina in *osiem* (otto), quindi, come ogni numero che termina in 5-9, vuole *lat*: nel dialogo della lezione 3 vedrai un numero che termina diversamente.'
  pl.a1.unit02.lesson03.teach.dialogue.line01:
    title: Ewa chiede il numero di Marek
    gloss: Ewa chiede a Marek il numero di telefono, in modo formale.
    note: Riprende esattamente la domanda formale sul numero di telefono di questa lezione.
  pl.a1.unit02.lesson03.teach.dialogue.line02:
    title: Marek dà il suo numero
    gloss: Marek dice il suo numero di telefono, cifra per cifra.
    note: Tutte le cifre qui sono già state insegnate nelle lezioni 1-2 di questa unità.
  pl.a1.unit02.lesson03.teach.dialogue.line03:
    title: Ewa chiede l'età di Marek
    gloss: Ewa lo ringrazia e gli chiede l'età, in modo formale.
    note: '*Dziękuję* ("grazie") e *A* ("e") non cambiano con il registro, come la scheda *dziękuję* dell''unità 1.'
  pl.a1.unit02.lesson03.teach.dialogue.line04:
    title: Marek dice la sua età e rigira la domanda
    gloss: Marek dice di avere ventotto anni e chiede a Ewa la sua età, in modo formale.
    note: '*A pani?* rigira la domanda a una donna in modo formale, lo stesso schema breve insegnato nell''unità 1 con *A pan?*.'
  pl.a1.unit02.lesson03.teach.dialogue.line05:
    title: Ewa dice la sua età
    gloss: Ewa dice di avere trentadue anni.
    note: '*Trzydzieści dwa* termina in *dwa* (due), quindi, a differenza di *dwadzieścia osiem* (che termina in otto e vuole *lat*), questo numero vuole *lata*: i numeri che terminano in 2, 3 o 4 (tranne le forme da 12 a 14) usano questa forma di plurale diversa. È una sfumatura grammaticale reale: *lat* e *lata* non sono intercambiabili, e la forma corretta dipende dall''ultima cifra del numero.'
  pl.a1.unit02.lesson03.teach.dialogue.line06:
    title: Marek chiude la conversazione
    gloss: Marek dice che è stato un piacere parlare con lei e la saluta.
    note: '*Do zobaczenia* riprende il saluto "a presto" dell''unità 1.'
