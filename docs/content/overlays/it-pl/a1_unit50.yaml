  pl.a1.unit50.lesson04.exercise01.listen_czy_chce_pani:
    instruction: Ascolta e scegli che cosa chiede Jan.
    correct_option: Buonasera! Desidera un biglietto per il concerto?
    distractors:
    - Buonasera! Desidera un tavolo?
    - Buon pomeriggio! Il concerto è esaurito?
