  pl.a1.unit50.lesson04.exercise02.comprehend_bilet_na_koncert:
    instruction: Ascolta il dialogo e scegli per che cosa vuole il biglietto Nina.
    correct_option: La band.
    distractors:
    - Una guida.
    - Un programma.
    - Non lo dice.
    accepted_answers:
    - value: La band.
      status: correct
    feedback: Nina vuole *bilet na koncert zespołu*. *Zespołu* è il genitivo («del gruppo»), che il polacco usa per indicare l'appartenenza.
    prompt_blocks:
    - Per che cosa vuole un biglietto Nina?
  pl.a1.unit50.lesson04.exercise03.comprehend_czy_chce_pani:
    instruction: Ascolta il dialogo e scegli che cosa Jan chiede poi a Nina.
    correct_option: Se vuole un programma.
    distractors:
    - Se vuole una guida.
    - Se vuole un tavolo.
    - Non chiede niente.
    accepted_answers:
    - value: Se vuole un programma.
      status: correct
    feedback: Jan chiede *czy chce pani też program?* *Program* è maschile ma non indica una persona, quindi l'accusativo è uguale al nominativo.
    prompt_blocks:
    - Che cosa chiede Jan a Nina?
  pl.a1.unit50.lesson04.exercise04.comprehend_nie_trzeba:
    instruction: Ascolta il dialogo e scegli se Nina vuole un programma.
    correct_option: No, dice che non serve.
    distractors:
    - Sì, ne vuole una.
    - Non risponde.
    - Chiede due programmi.
    accepted_answers:
    - value: No, dice che non serve.
      status: correct
    feedback: Nina dice *Nie, dziękuję, nie trzeba.* *Nie trzeba* significa «non serve», e *dziękuję* significa «grazie».
    prompt_blocks:
    - Nina vuole un programma?
