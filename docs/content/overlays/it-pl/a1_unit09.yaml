teaching:
  pl.a1.unit09.lesson01.teach.isc_dojsc:
    title: Andare, arrivare
    gloss: andare; arrivare (a)
    note: 'Due verbi di movimento strettamente legati: iść è il generico «andare/camminare», dojść è specificamente «raggiungere/arrivare a» una meta, e si usa nella domanda che questa lezione insegna.'
    example_gloss:
    - Vada dritto, per favore.
    - Come si arriva alla banca?
  pl.a1.unit09.lesson01.teach.prosto:
    title: Dritto
    gloss: dritto
    note: 'La parola di direzione più semplice: si usa subito dopo iść per dire «vada dritto».'
    example_gloss: Vada dritto fino al parco, per favore.
  pl.a1.unit09.lesson01.teach.tam_potem:
    title: Là, poi
    gloss: là; poi
    note: 'Tam indica un luogo; potem ordina i passaggi («prima questo, poi quello»): entrambe indispensabili per concatenare le indicazioni.'
    example_gloss:
    - La banca è là.
    - Poi vada dritto, per favore.
  pl.a1.unit09.lesson01.teach.prosze_bezokolicznik:
    title: Please + infinitive
    gloss: 'Proszę + infinito -- Proszę (per favore) seguito da un verbo all''infinito è il modo cortese e quotidiano di dare un''indicazione, senza bisogno di una forma d''imperativo: Vada dritto, per favore.'
    note: '*Proszę* seguito da un verbo all''infinito è il modo in cui il polacco invita cortesemente a fare qualcosa -- *Proszę iść prosto* («Vada dritto, per favore»). È la scelta sicura e cortese con uno sconosciuto, quindi non serve l''imperativo per dare o capire le indicazioni. (Tra amici si usa di solito proprio l''imperativo: lo incontrerai più avanti.)'
  pl.a1.unit09.lesson01.teach.jak_dojsc_note:
    title: Come si arriva a + [luogo]?
    gloss: 'Jak dojść do + [luogo]? -- Jak (come) più dojść (arrivare a) chiede la strada per un luogo: Come si arriva alla banca? Come si arriva all''hotel? Come si arriva al parco? Il nome dopo ''do'' prende la stessa desinenza di genitivo -u che hai visto dopo ''accanto a''/''di fronte a'' nell''unità precedente: bank -> banku, hotel -> hotelu, park -> parku.'
    note: '*Jak dojść do...?* è la domanda di uso quotidiano per chiedere come raggiungere un luogo. Il nome del luogo che segue *do* prende la stessa desinenza di genitivo *-u* che hai già imparato dopo *obok*/*naprzeciwko* -- *bank* diventa *banku*, *hotel* diventa *hotelu*, *park* diventa *parku*, esattamente lo stesso schema, solo dopo una nuova preposizione.'
  pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku:
    title: Come si arriva alla banca?
    gloss: Come arrivo in banca?
    note: Lo schema della nota di grammatica messo in pratica con la prima destinazione della lezione.
  pl.a1.unit09.lesson02.teach.prawo_lewo:
    title: Destra, sinistra
    gloss: destra; sinistra
    note: Si usano dopo na per dire dove si trova qualcosa o da che parte svoltare -- na prawo (a destra), na lewo (a sinistra).
    example_gloss:
    - La banca è a destra.
    - Il parco è a sinistra.
  pl.a1.unit09.lesson02.teach.skrecic:
    title: Svoltare
    gloss: svoltare
    note: 'Il verbo per cambiare direzione: abbinato a na prawo/na lewo significa «svoltare a destra»/«svoltare a sinistra».'
    example_gloss: Svolti a destra, per favore.
  pl.a1.unit09.lesson02.teach.skrecic_na_lewo:
    title: Svolti a sinistra, per favore
    gloss: Svolti a sinistra, per favore.
    note: Lo stesso schema Proszę + infinito, questa volta con skręcić e na lewo.
  pl.a1.unit09.lesson02.teach.ulica:
    title: Strada
    gloss: strada, via
    note: Una parola comune per qualsiasi strada, utile quando le indicazioni nominano una via specifica.
    example_gloss: La strada è là.
  pl.a1.unit09.lesson02.teach.multi_step_note:
    title: Concatenare le indicazioni con potem
    gloss: 'Vada dritto, poi svolti a destra. -- Più indicazioni si possono concatenare con una virgola e la parola potem (poi): prima un''azione, poi la successiva.'
    note: 'Per dare più indicazioni di seguito, basta unirle con una virgola e *potem*: *Proszę iść prosto, potem skręcić na prawo* («Vada dritto, poi svolti a destra»). Le indicazioni reali in più passaggi si costruiscono esattamente così.'
  pl.a1.unit09.lesson03.teach.rozumiem:
    title: Capisco
    gloss: capisco
    note: Un modo utile per confermare di aver seguito le indicazioni prima di fare un'altra domanda.
    example_gloss: Capisco, grazie.
  pl.a1.unit09.lesson03.teach.dialogue.line01:
    title: Ewa chiede come si arriva al parco
    gloss: Ewa dice «scusi» e chiede come si arriva al parco.
    note: Przepraszam apre la domanda, la stessa abitudine cortese del dialogo sui luoghi dell'unità precedente.
  pl.a1.unit09.lesson03.teach.dialogue.line02:
    title: Un passante spiega la strada per il parco
    gloss: Il passante dice di andare dritto e poi di girare a sinistra. Il parco è lì.
    note: Due indicazioni in sequenza con potem, proprio come descrive la nota di grammatica di questa lezione.
  pl.a1.unit09.lesson03.teach.dialogue.line03:
    title: Ewa conferma e chiede della banca
    gloss: Ewa dice che ha capito e chiede come arrivare alla banca.
    note: Rozumiem conferma che ha seguito le prime indicazioni, prima di fare una nuova domanda.
  pl.a1.unit09.lesson03.teach.dialogue.line04:
    title: Il passante dà le indicazioni per la banca
    gloss: Il passante dice di girare a destra e poi di andare dritto. La banca è a destra.
    note: Un percorso in due tappe diverso da quello del parco, con lo stesso schema Proszę + infinito.
  pl.a1.unit09.lesson03.teach.dialogue.line05:
    title: Ewa ringrazia
    gloss: Ewa dice grazie mille.
    note: Dziękuję bardzo, già incontrato nelle unità sugli acquisti e sui luoghi.
  pl.a1.unit09.lesson03.teach.dialogue.line06:
    title: Il passante risponde
    gloss: Il passante dice prego.
    note: Proszę bardzo, la risposta abituale a un ringraziamento, già vista nelle unità precedenti.
