teaching:
  pl.a1.unit12.lesson01.teach.wczoraj:
    title: Ieri
    gloss: ieri
    note: 'La parola di base per parlare di un giorno recente e concluso: si abbina naturalmente ai tempi passati di questa unità.'
    example_gloss: Ieri sono stato al cinema.
  pl.a1.unit12.lesson01.teach.co_bylo_wczoraj:
    title: Che cosa è successo ieri?
    gloss: Che cosa è successo ieri?
    note: 'Il modo naturale per chiedere a qualcuno di raccontare un fatto recente: było non cambia in base a chi risponde, quindi la domanda va bene con chiunque.'
  pl.a1.unit12.lesson01.teach.bylo_note:
    title: Było
    gloss: 'Było è la forma del passato di być (essere) al neutro: concorda con co (che cosa), quindi si usa quando si chiede in generale che cosa è successo: Co było wczoraj? È sempre la stessa parola, chiunque risponda.'
    note: '*Było* è la forma neutra del passato («era / c''era»): concorda con *co* (che cosa) e non con la persona a cui parli, quindi in una domanda aperta come *Co było wczoraj?* equivale a «che cosa è successo?».'
  pl.a1.unit12.lesson01.teach.bylem_bylam:
    title: Io ero (uomo / donna)
    gloss: io ero (detto da un uomo) / io ero (detto da una donna)
    note: 'Nel passato polacco la forma indica il genere di chi parla: byłem se parla un uomo, byłam se parla una donna. Entrambe significano «io ero / sono stato/a».'
    example_gloss:
    - Ieri sono stato al cinema.
    - Ieri sono stato al cinema.
  pl.a1.unit12.lesson01.teach.gender_past_note:
    title: 'Passato: -em o -am'
    gloss: 'I verbi al passato cambiano desinenza in base al genere di chi parla: -em se parla un uomo (byłem), -am se parla una donna (byłam). Vale per ogni verbo al passato, non solo per być.'
    note: 'Fai attenzione alle ultime lettere: *-em* indica che parla un uomo, *-am* che parla una donna. Ritroverai lo stesso schema in ogni verbo al passato di questa unità.'
  pl.a1.unit12.lesson01.teach.w_kinie_locative_note:
    title: Al cinema
    gloss: 'Kino cambia desinenza dopo w: idę do kina (verso dove?) usa una forma diversa da jestem w kinie (dove?). W kinie è il locativo: dice DOVE succede qualcosa, non verso dove va qualcuno.'
    note: 'Due desinenze diverse, due domande diverse: *do kina* risponde a «verso dove?» (l''hai visto nell''unità sui programmi), mentre *w kinie* risponde a «dove?». Non confonderle.'
  pl.a1.unit12.lesson01.teach.bylem_w_kinie:
    title: Ieri sono stato al cinema (uomo)
    gloss: Ieri sono stato al cinema.
    note: 'Unisce byłem, wczoraj e w kinie: così un uomo dice dove è stato.'
  pl.a1.unit12.lesson01.teach.bylam_w_kinie:
    title: Ieri sono stata al cinema (donna)
    gloss: Ieri sono stata al cinema.
    note: 'La stessa frase con byłam: così una donna dice dove è stata.'
  pl.a1.unit12.lesson02.teach.film:
    title: Film
    gloss: film
    note: 'Una parola di uso quotidiano per dire che cosa hai guardato: torna di continuo quando racconti una serata al cinema.'
    example_gloss: Ho visto un bel film.
  pl.a1.unit12.lesson02.teach.dobry:
    title: Buono / Bello
    gloss: buono / bello
    note: 'Hai già incontrato dobry in dzień dobry (buongiorno): qui è usato da solo, come un normale aggettivo, «buono / bello».'
    example_gloss: Un film molto bello!
  pl.a1.unit12.lesson02.teach.zobaczylem_zobaczylam:
    title: Ho visto (uomo / donna)
    gloss: ho visto (detto da un uomo) / ho visto (detto da una donna)
    note: 'Zobaczyć indica un singolo atto di vedere concluso (a differenza di widzieć, il vedere in corso): zobaczyłem se parla un uomo, zobaczyłam se parla una donna, con lo stesso schema -em/-am di byłem/byłam.'
    example_gloss:
    - Ho visto un bel film.
    - Ho visto un bel film.
  pl.a1.unit12.lesson02.teach.zobaczyc_pattern_note:
    title: Lo stesso schema di byłem/byłam
    gloss: 'Lo stesso schema di byłem/byłam: zobaczyłem lo dice un uomo, zobaczyłam una donna. Zobaczyć è un verbo perfettivo: indica un evento singolo e concluso.'
    note: 'Stessa desinenza, verbo nuovo: *zobaczyłem/zobaczyłam* segue lo stesso schema appena imparato con *byłem/byłam*.'
  pl.a1.unit12.lesson02.teach.zrobilem_zrobilam:
    title: Ho fatto (uomo / donna)
    gloss: ho fatto (detto da un uomo) / ho fatto (detto da una donna)
    note: 'Zrobić significa sia «fare» sia «preparare» per un''azione singola e conclusa: zrobiłem per un uomo, zrobiłam per una donna, sempre lo stesso schema.'
    example_gloss:
    - Ho preparato il pranzo.
    - Ho preparato il pranzo.
  pl.a1.unit12.lesson02.teach.obiad:
    title: Pranzo
    gloss: pranzo
    note: 'Forse ricordi obiad dall''unità sulla routine: qui è il pasto principale della giornata che prepara Marek.'
    example_gloss: Questo è un pranzo buonissimo.
  pl.a1.unit12.lesson02.teach.pyszny:
    title: Buono
    gloss: gustoso / buonissimo
    note: 'Un modo caloroso e quotidiano per fare un complimento al cibo: viene naturale subito dopo obiad.'
    example_gloss: Questo è un pranzo buonissimo.
  pl.a1.unit12.lesson03.teach.jaki:
    title: Che tipo di / quale
    gloss: che tipo di / quale
    note: 'Hai già visto jaki per chiedere i numeri di telefono e i giorni della settimana: qui si usa allo stesso modo per chiedere un dettaglio preciso, cioè quale film.'
    example_gloss: Che film è?
  pl.a1.unit12.lesson03.teach.elliptical_note:
    title: Domande brevi di una parola
    gloss: In una conversazione puoi fare una domanda breve con una sola parola, per esempio Pyszny? al posto della domanda completa Czy obiad był pyszny? Suona naturale e veloce, proprio come nel parlato di ogni giorno.
    note: 'Nella conversazione reale si salta la frase completa quando il contesto è già chiaro: *Pyszny?* da solo significa «Era buono?».'
  pl.a1.unit12.lesson03.teach.dialogue.line01:
    title: Marek chiede che cosa è successo
    gloss: Ciao Ewa! Che cosa è successo ieri?
    note: Riprende la prima domanda insegnata in questa unità, ora all'inizio di una vera conversazione.
  pl.a1.unit12.lesson03.teach.dialogue.line02:
    title: Ewa è stata al cinema
    gloss: Sono stata al cinema! Ho visto un bel film.
    note: Byłam (femminile) e zobaczyłam (femminile) indicano entrambi che parla Ewa.
  pl.a1.unit12.lesson03.teach.dialogue.line03:
    title: Marek chiede quale film
    gloss: Che film?
    note: Una breve domanda di approfondimento, naturale, con jaki.
  pl.a1.unit12.lesson03.teach.dialogue.line04:
    title: Ewa risponde e rilancia la domanda
    gloss: Molto bello! E tu?
    note: A ty? (e tu?) restituisce la parola a Marek senza bisogno di grammatica nuova.
  pl.a1.unit12.lesson03.teach.dialogue.line05:
    title: Marek ha preparato il pranzo
    gloss: Ho preparato il pranzo!
    note: 'Zrobiłem (maschile) indica che parla Marek: è ciò che ha fatto lui nella giornata.'
  pl.a1.unit12.lesson03.teach.dialogue.line06:
    title: Ewa chiede se era buono
    gloss: Buono?
    note: Una domanda di una sola parola, proprio lo schema della nota di grammatica di questa lezione.
