teaching:
  pl.a1.unit15.lesson01.teach.dworzec:
    title: Stazione
    gloss: stazione
    note: Il luogo da cui partono e in cui arrivano treni e autobus -- il punto di partenza di tutta questa unità.
    example_gloss: La stazione è vicina all'hotel.
  pl.a1.unit15.lesson01.teach.bilet:
    title: Biglietto
    gloss: biglietto
    note: Ti serve prima di salire su un treno o su un autobus.
    example_gloss: Il biglietto costa venti złoty.
  pl.a1.unit15.lesson01.teach.peron:
    title: Binario
    gloss: binario
    note: Il posto dove aspetti il tuo treno.
    example_gloss: Il binario numero uno è là.
  pl.a1.unit15.lesson01.teach.peron_numer_note:
    title: Binario numero uno, due...
    gloss: 'Per dire il numero di un binario, puoi dire Peron numer + numero: Peron numer jeden, Peron numer dwa.'
    note: 'Più semplice di quanto sembri: basta *peron* + *numer* + un normale numero che conosci già. (Gli annunci in stazione usano spesso i numeri ordinali, come *peron pierwszy* -- «binario uno» -- ma *peron numer jeden* si capisce sempre.)'
  pl.a1.unit15.lesson01.teach.pociag_recap:
    title: Di nuovo il treno
    gloss: Pociąg odjeżdża o czwartej po południu -- questa frase la conosci già dalla lezione sull'ora.
    note: Lo stesso identico dato dell'unità sull'ora, ora usato in una scena di viaggio.
  pl.a1.unit15.lesson01.teach.krakow:
    title: Cracovia
    gloss: Cracovia
    note: Una vera città polacca -- la prima destinazione di questa unità.
    example_gloss: Cracovia è lontana.
  pl.a1.unit15.lesson01.teach.do_krakowa_note:
    title: A Cracovia
    gloss: 'Quando si va da qualche parte, si dice do + un''altra forma del nome della città: do Krakowa (non do Kraków). Memorizza questa forma come un blocco unico.'
    note: 'Non cercare di ricavare *Krakowa* da una regola: per ora impara *do Krakowa* come espressione fissa.'
  pl.a1.unit15.lesson01.teach.bilet_do_krakowa:
    title: Un biglietto per Cracovia, per favore
    gloss: Un biglietto per Cracovia, per favore.
    note: La frase esatta da dire alla biglietteria.
  pl.a1.unit15.lesson01.teach.jechac_note:
    title: To go (by vehicle)
    gloss: 'Jechać (andare con un mezzo): jadę (io vado), jedzie (lui/lei va). Domani vado a Cracovia. Marek va a Cracovia.'
    note: 'Per ora solo due forme: *jadę* per te stesso, *jedzie* per un''altra persona.'
  pl.a1.unit15.lesson01.teach.marek_jedzie:
    title: Marek va a Cracovia
    gloss: Marek va a Cracovia domani.
    note: Il viaggio di Marek -- la sua storia continua nel dialogo di questa unità.
  pl.a1.unit15.lesson02.teach.autobus:
    title: Autobus
    gloss: autobus
    note: L'altro mezzo comune per spostarsi tra città.
    example_gloss: L'autobus è alla stazione.
  pl.a1.unit15.lesson02.teach.warszawa:
    title: Varsavia
    gloss: Varsavia
    note: La capitale della Polonia -- la seconda destinazione di questa unità.
    example_gloss: Varsavia è lontana.
  pl.a1.unit15.lesson02.teach.do_warszawy_note:
    title: A Varsavia
    gloss: 'Warszawa cambia in modo diverso da Kraków: do Warszawy (non do Warszawa). Ogni città ha la sua forma: memorizza le due forme separatamente.'
    note: '*Krakowa* e *Warszawy* non seguono lo stesso schema: per questo ciascuna si memorizza da sola, non come un''unica regola comune.'
  pl.a1.unit15.lesson02.teach.dokad:
    title: Verso dove
    gloss: verso dove, dove (con moto)
    note: 'Chiede la destinazione, non il luogo in cui qualcosa si trova: è diverso dal chiedere «dove» è già qualcosa.'
    example_gloss: Dove va l'autobus?
  pl.a1.unit15.lesson02.teach.godzina_recap:
    title: Alle sette, ancora
    gloss: 'Siódmej: questa forma dell''ora la conosci già dalla lezione sul tempo (o siódmej = alle sette).'
    note: Lo stesso schema della forma locativa dell'ora, qui riutilizzato per un orario di partenza.
  pl.a1.unit15.lesson02.teach.autobus_odjezdza:
    title: L'autobus per Varsavia parte alle sette
    gloss: L'autobus per Varsavia parte alle sette.
    note: Unisce in un'unica frase reale gli schemi della destinazione e dell'ora di questa lezione.
  pl.a1.unit15.lesson02.teach.kiedy_recap:
    title: Quando, ancora
    gloss: 'Kiedy: questa parola la conosci già dalla lezione sulle date. Quando parte l''autobus?'
    note: La domanda naturale da fare prima di un viaggio.
  pl.a1.unit15.lesson02.teach.ewa_jedzie:
    title: Ewa va a Varsavia
    gloss: Ewa va a Varsavia domani.
    note: 'Il viaggio di Ewa: la sua storia continua nel dialogo di questa unità, insieme a quella di Marek.'
  pl.a1.unit15.lesson03.teach.ja_recap:
    title: Io, ancora
    gloss: 'Ja: questa parola la conosci già dalle lezioni precedenti.'
    note: Un breve ripasso prima del dialogo di questa lezione.
  pl.a1.unit15.lesson03.teach.moj_recap:
    title: Mio, ancora
    gloss: 'Mój: questa parola la conosci già dalla lezione sulla famiglia.'
    note: Un breve ripasso prima del dialogo di questa lezione.
  pl.a1.unit15.lesson03.teach.dziesiatej_rano_note:
    title: Alle dieci del mattino, ancora
    gloss: 'Dziesiątej e rano: conosci già entrambe le forme dalla lezione sul tempo (o dziesiątej rano = alle dieci del mattino).'
    note: Un breve ripasso prima del dialogo di questa lezione.
  pl.a1.unit15.lesson03.teach.dziekuje_recap:
    title: Grazie e arrivederci
    gloss: 'Dziękuję e Do zobaczenia: li conosci già dalle lezioni precedenti.'
    note: Un breve ripasso prima del dialogo di questa lezione.
  pl.a1.unit15.lesson03.teach.mila_podrozy_note:
    title: Buon viaggio!
    gloss: 'Miłej podróży! è il modo di augurare a qualcuno buon viaggio: si usa come espressione intera, non si traduce parola per parola.'
    note: 'Un saluto fisso e idiomatico: impara tutta l''espressione in blocco, come hai già fatto con *Dzień dobry*.'
  pl.a1.unit15.lesson03.teach.dialogue.line01:
    title: Marek va a Cracovia domani
    gloss: Domani vado a Cracovia. Il mio treno parte alle quattro del pomeriggio.
    note: 'Marek comincia parlando del suo programma di viaggio: lo stesso fatto che la Lezione 1 ci aveva già detto di lui.'
  pl.a1.unit15.lesson03.teach.dialogue.line02:
    title: Ewa va a Varsavia domani
    gloss: Io vado a Varsavia. Il mio autobus parte alle dieci del mattino.
    note: 'Ewa racconta il suo programma: lo stesso fatto che la Lezione 2 ci aveva già detto di lei.'
  pl.a1.unit15.lesson03.teach.dialogue.line03:
    title: Marek augura buon viaggio a Ewa
    gloss: Buon viaggio!
    note: Marek usa l'espressione nuova di questa lezione per fare gli auguri a Ewa.
  pl.a1.unit15.lesson03.teach.dialogue.line04:
    title: Ewa ringrazia Marek e lo saluta
    gloss: Grazie! Arrivederci!
    note: Una conclusione semplice e familiare della conversazione.
