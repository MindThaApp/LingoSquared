answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Polacco A1
  description: Impara a salutare, a chiedere come sta qualcuno, a presentarti e a scambiare informazioni personali di base in polacco. Le indicazioni si concentrano sul sistema di cortesia pan/pani/ty (una distinzione grammaticale reale in polacco, simile a quella tra Lei e tu in italiano), sulla concordanza delle desinenze verbali e sulla scelta del registro più naturale.
units:
  pl.a1.unit01.greetings:
    title: Saluti e primi incontri
lessons:
  pl.a1.unit01.lesson01.address_and_wellbeing:
    title: 'Pan, pani e ty: come chiedere come va'
  pl.a1.unit01.lesson02.greetings_by_time:
    title: Saluti e commiati nei diversi momenti della giornata
  pl.a1.unit01.lesson03.names_origin_and_smalltalk:
    title: Nome, cognome e di dove sei
teaching:
  pl.a1.unit01.lesson01.teach.pan:
    title: Forma di cortesia, rivolta a un uomo
    gloss: signore (forma di cortesia per un uomo)
    note: 'In italiano la forma di cortesia è il Lei, che usa la terza persona singolare. In polacco la scelta è espressa con parole precise: *pan* si usa per un uomo che non conosci bene o che rispetti per il suo ruolo. Grammaticalmente *pan* funziona come soggetto di terza persona: "pan jest" significa letteralmente "il signore è", non è una vera forma di seconda persona, anche se si usa per dire "Lei".'
  pl.a1.unit01.lesson01.teach.pani:
    title: Forma di cortesia, rivolta a una donna
    gloss: signora (forma di cortesia per una donna)
    note: 'È il corrispondente femminile di *pan*. Usa *pani* con una donna che non conosci o che rispetti per il suo ruolo. Qualsiasi donna adulta si chiama *pani*, indipendentemente dallo stato civile: in polacco non esiste la distinzione tra signora e signorina nel trattamento quotidiano.'
  pl.a1.unit01.lesson01.teach.ty:
    title: Il «tu» informale
    gloss: tu (informale, singolare)
    note: '*Ty* si usa con un amico, un coetaneo, un familiare, un bambino o chiunque abbia con te un rapporto informale. A differenza di *pan*/*pani*, *ty* richiede vere desinenze verbali di seconda persona, per esempio *masz* ("hai/stai"), non quelle di terza persona.'
  pl.a1.unit01.lesson01.teach.jak_sie_pan_ma:
    title: Domanda di cortesia sul benessere, a un uomo
    gloss: Come sta? (a un uomo, formale)
    note: Letteralmente "come si sente il signore". *Ma* è la forma di terza persona del verbo (concorda con *pan* come soggetto grammaticale), la stessa desinenza usata per *on* ("lui").
  pl.a1.unit01.lesson01.teach.jak_sie_pani_ma:
    title: Domanda di cortesia sul benessere, a una donna
    gloss: Come sta? (a una donna, formale)
    note: 'Stessa struttura di *Jak się pan ma?*, con *pani* al posto di *pan*. La forma verbale *ma* non cambia: è sempre la stessa desinenza di terza persona, qualunque sia il genere della persona a cui ti rivolgi.'
  pl.a1.unit01.lesson01.teach.jak_sie_masz:
    title: Domanda informale sul benessere
    gloss: Come va? (informale)
    note: 'Con *ty* il verbo prende la vera desinenza di seconda persona *masz*, non *ma*. Confronta il formale *Jak się pan/pani ma?* con l''informale *Jak się masz?*: è la coppia minima più utile per sentire nel verbo stesso la differenza tra pan/pani e ty.'
  pl.a1.unit01.lesson01.teach.dobrze_dziekuje:
    title: Una risposta standard
    gloss: Bene, grazie.
    note: '*Dziękuję* ("grazie") non cambia con il registro: è la stessa parola sia che tu risponda a *pan*, a *pani* o a *ty*. Solo la domanda indica il grado di formalità.'
  pl.a1.unit01.lesson01.teach.a_pan:
    title: Restituire la domanda di cortesia
    gloss: E Lei? (a un uomo, formale)
    note: Un modo breve per restituire la domanda a un uomo a cui dai del Lei. Sostituisci *pan* con *pani* ("A pani?") quando la restituisci a una donna.
  pl.a1.unit01.lesson01.teach.a_ty:
    title: Restituire la domanda informale
    gloss: E tu? (informale)
    note: Usa *ty* per restituire la domanda a un amico o a un coetaneo.
  pl.a1.unit01.lesson02.teach.czesc:
    title: Saluto informale per incontrarsi e salutarsi
    gloss: ciao (informale, per salutare e per congedarsi)
    note: '*Cześć* è particolare tra i saluti polacchi: funziona sia come "ciao" all''incontro sia come "ciao" al congedo, sempre in registro informale, proprio come l''italiano "ciao". Si usa solo nei rapporti da *ty*, mai con *pan*/*pani*.'
    example_gloss: Ciao, come stai?
  pl.a1.unit01.lesson02.teach.dzien_dobry:
    title: Saluto per tutto il giorno
    gloss: buongiorno
    note: '*Dzień dobry* si usa in qualsiasi momento prima di sera e, a differenza di *cześć*, è neutro quanto al registro: va bene con *pan*, *pani* o *ty*. È il saluto più sicuro con qualcuno che non conosci bene.'
  pl.a1.unit01.lesson02.teach.dobry_wieczor:
    title: Saluto serale
    gloss: buonasera
    note: Prende il posto di *dzień dobry* quando è sera. Stesso uso neutro quanto al registro.
  pl.a1.unit01.lesson02.teach.dobranoc:
    title: Saluto della buonanotte
    gloss: buonanotte
    note: 'A differenza di *dzień dobry*/*dobry wieczór*, *dobranoc* è un congedo, non un saluto di incontro: si dice quando qualcuno se ne va per la notte o va a dormire, mai per iniziare una conversazione.'
    example_gloss: Buonanotte, Piotr!
  pl.a1.unit01.lesson02.teach.do_widzenia:
    title: Congedo standard
    gloss: arrivederci; addio
    note: 'Il modo neutro, adatto a ogni registro, per dire arrivederci: va bene con *pan*, *pani* o *ty*. Suona più definitivo di *do zobaczenia*.'
  pl.a1.unit01.lesson02.teach.do_zobaczenia:
    title: Congedo "a presto"
    gloss: ci vediamo
    note: Letteralmente "fino a [quando ci] vedremo". Sottintende che vi aspettate di rivedervi, a differenza del più neutro *do widzenia*.
  pl.a1.unit01.lesson02.teach.milego_dnia:
    title: Augurio di congedo cortese
    gloss: Buona giornata!
    note: '*Miłego dnia* usa il genitivo in un augurio, come *smacznego* ("buon appetito"): è una costruzione fissa, da imparare come espressione intera senza analizzare i casi per ora.'
  pl.a1.unit01.lesson03.teach.jak_sie_pan_nazywa:
    title: Chiedere il nome, in modo formale
    gloss: Come si chiama? (a un uomo, formale)
    note: 'Letteralmente "come si chiama il signore": *nazywać się* è un verbo riflessivo che significa "chiamarsi". Sostituisci *pan* con *pani* se ti rivolgi a una donna.'
  pl.a1.unit01.lesson03.teach.jak_masz_na_imie:
    title: Chiedere il nome di battesimo, in modo informale
    gloss: Come ti chiami? (nome di battesimo)
    note: 'Usa un''altra espressione, *mieć na imię* ("avere come nome"), e chiede specificamente il nome di battesimo, non il nome completo né il cognome: è il modo naturale e informale di chiedere il nome a un coetaneo.'
  pl.a1.unit01.lesson03.teach.nazywam_sie:
    title: Dire il proprio nome completo
    gloss: Mi chiamo Anna Kowalska.
    note: 'È la forma di prima persona di *nazywać się*, seguita naturalmente da nome e cognome insieme: il modo più formale o completo di presentarsi.'
  pl.a1.unit01.lesson03.teach.mam_na_imie:
    title: Dire il proprio nome di battesimo
    gloss: Mi chiamo Anna.
    note: 'È la forma di prima persona di *mieć na imię*, seguita naturalmente dal solo nome: la versione informale di *Nazywam się...*.'
  pl.a1.unit01.lesson03.teach.bardzo_mi_milo:
    title: Piacere di conoscere qualcuno
    gloss: Molto piacere.
    note: Espressione fissa, molto usata quando si conosce qualcuno, adatta sia a contesti formali sia informali.
  pl.a1.unit01.lesson03.teach.skad_jestes:
    title: Chiedere la provenienza, in modo informale
    gloss: Di dov'è Lei?
    note: '*Skąd* significa "da dove". Qui vedi la forma informale con *ty*; la forma di cortesia *Skąd pan/pani jest?* compare nel dialogo finale di questa lezione.'
  pl.a1.unit01.lesson03.teach.jestem_z:
    title: Dire la propria provenienza
    gloss: Sono del Canada.
    note: '*Z* ("da") vuole il genitivo, perciò *Kanada* diventa *Kanady*. La maggior parte dei nomi di paesi segue lo stesso schema dopo *z*.'
  pl.a1.unit01.lesson03.teach.mieszkam_w:
    title: Dire dove si vive
    gloss: Abito a Varsavia.
    note: '*W* ("in") qui vuole il locativo, perciò *Warszawa* diventa *Warszawie*. La provenienza (con *z*) e la residenza attuale (con *w*) usano casi diversi per il nome del luogo: è uno schema da notare, non un''eccezione da memorizzare.'
  pl.a1.unit01.lesson03.teach.dialogue.line01:
    title: L'inizio dell'incontro
    gloss: Ewa saluta Marek e gli chiede il nome in modo formale.
    note: 'Ewa usa il registro formale con *pan* con una persona appena conosciuta: è la scelta più sicura in un primo incontro professionale o tra sconosciuti.'
  pl.a1.unit01.lesson03.teach.dialogue.line02:
    title: L'inizio dell'incontro, risposta
    gloss: Marek dice il suo nome completo e che è un piacere conoscerla.
    note: '*Nazywam się* seguito dal nome completo è il modo naturale e completo di rispondere a una domanda formale sul nome.'
  pl.a1.unit01.lesson03.teach.dialogue.line03:
    title: Chiedere la provenienza
    gloss: Ewa ricambia la cortesia e chiede a Marek, in modo formale, di dove sia.
    note: '*Skąd pan jest?*, la forma di cortesia di *Skąd jesteś?* di questa lezione, usa *jest*, la stessa terza persona già vista con *pan jest*/*pan ma*.'
  pl.a1.unit01.lesson03.teach.dialogue.line04:
    title: Chiedere la provenienza, risposta
    gloss: Marek dice che è del Canada ma abita a Varsavia.
    note: '*Ale* ("ma") collega il contrasto tra il luogo d''origine di Marek e quello in cui vive ora: la stessa distinzione che esprimono *jestem z* e *mieszkam w*.'
  pl.a1.unit01.lesson03.teach.dialogue.line05:
    title: Chiedere della conoscenza di una lingua
    gloss: Ewa chiede a Marek, in modo formale, se parla polacco.
    note: '*Czy* introduce una domanda a cui si risponde sì o no. In polacco non serve altro: *czy* da solo segnala che segue una domanda, anche se in italiano basta l''intonazione.'
  pl.a1.unit01.lesson03.teach.dialogue.line06:
    title: Chiedere della conoscenza di una lingua, rispondere e congedarsi
    gloss: Marek dice che parla un po' e che sta ancora imparando, poi saluta.
    note: '*Jeszcze się uczę* ("sto ancora imparando") è un modo naturale e umile di descrivere uno sforzo in corso: utile anche a te per parlare di te stesso.'
