  pl.a1.unit37.lesson03.teach.poprosze_kolor_mowi:
    title: La costruzione Poproszę
    gloss: '*Poproszę* + colore indica quale colore scegli: *Poproszę różowe.* Il colore termina in *-e* perché i tulipani sono al plurale.'
    note: '*Poproszę* («vorrei, per favore») è un modo pratico per ordinare o scegliere qualcosa. I colori sono aggettivi e concordano con il nome: *tulipany* è plurale, quindi la desinenza è *-e* (*różowe*, *czerwone*). Da solo, il nome del colore è maschile singolare (*różowy*), perché concorda con *kolor*.'
