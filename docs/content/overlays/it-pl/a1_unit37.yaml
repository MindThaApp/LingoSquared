    gloss: Sabato Nina ed Ewa vanno al mercato dei fiori. Che colore vuole Ewa? Ewa vorrebbe il rosso. Che colore vuole Nina? Nina vorrebbe il giallo. Comprano cinque tulipani. Costa venticinque złoty. I tulipani sono bellissimi!
    note: Riassume la gita del sabato al mercato dei fiori.
