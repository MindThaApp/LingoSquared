teaching:
  pl.a1.unit19.lesson01.teach.recap_jaka_jest_dzis_nie:
    title: Che, è, oggi, non -- di nuovo
    gloss: Jaka, jest, Dziś, nie -- conosci già queste parole dalle lezioni precedenti.
    note: Un breve ripasso prima che questa lezione le usi per parlare del tempo.
  pl.a1.unit19.lesson01.teach.pogoda:
    title: Il tempo
    gloss: tempo (meteorologico)
    note: La parola generica per indicare il tempo atmosferico o le condizioni meteo.
    example_gloss: Che tempo fa?
  pl.a1.unit19.lesson01.teach.zimno:
    title: Freddo
    gloss: freddo
    note: 'Descrive la temperatura: non cambia forma in base al genere.'
    example_gloss: Fa freddo.
  pl.a1.unit19.lesson01.teach.goraco:
    title: Caldo
    gloss: caldo
    note: 'Il contrario di ''*zimno*'': anch''esso non cambia forma in base al genere.'
    example_gloss: Fa caldo.
  pl.a1.unit19.lesson01.teach.jest_pogoda_note:
    title: Fa freddo, fa caldo
    gloss: 'Jest zimno. Jest gorąco. -- così si descrive il tempo in polacco: ''*jest*'' più una parola meteorologica, senza concordanza di genere.'
    note: Lo stesso schema semplice vale per tutte le parole del tempo di questa unità.
  pl.a1.unit19.lesson01.teach.jaka_jest_pogoda_phrase:
    title: Che tempo fa?
    gloss: Che tempo fa?
    note: Un modo naturale per chiedere che tempo fa in questo momento.
  pl.a1.unit19.lesson01.teach.dzis_jest_zimno_phrase:
    title: Oggi fa freddo
    gloss: Oggi fa freddo.
    note: La frase su cui si basa tutta questa unità per parlare del tempo di oggi.
  pl.a1.unit19.lesson02.teach.pada:
    title: Piove
    gloss: piove
    note: 'Si usa da solo, senza soggetto: è il modo normale per dire «piove» in polacco.'
    example_gloss: Oggi piove.
  pl.a1.unit19.lesson02.teach.snieg:
    title: Neve
    gloss: neve
    note: 'La parola per «neve»: insieme a ''*pada*'' significa «nevica».'
    example_gloss: Nevica.
  pl.a1.unit19.lesson02.teach.mgla:
    title: Nebbia
    gloss: nebbia
    note: Un'altra condizione meteo comune.
    example_gloss: C'è nebbia.
  pl.a1.unit19.lesson02.teach.dobra_note:
    title: Buona
    gloss: Pogoda jest dobra. -- '*dobra*' concorda con i sostantivi femminili, come '*pogoda*'.
    note: 'La forma femminile di ''*dobry*'' (come in ''*Dzień dobry*''): lo stesso schema -y/-a di *chory/chora*.'
  pl.a1.unit19.lesson02.teach.straszna_note:
    title: Terribile
    gloss: Jaka straszna pogoda! -- anche '*straszna*' concorda con '*pogoda*', proprio come '*dobra*'.
    note: 'Una parola forte: usala per un tempo davvero brutto.'
  pl.a1.unit19.lesson02.teach.jaka_straszna_pogoda_phrase:
    title: Che tempo orribile!
    gloss: Che tempo orribile!
    note: Un'esclamazione naturale sul maltempo.
  pl.a1.unit19.lesson02.teach.pogoda_dobra_phrase:
    title: Il tempo è bello
    gloss: Il tempo è bello.
    note: Riprende la parola del tempo vista all'inizio di questa lezione.
  pl.a1.unit19.lesson03.teach.recap_words:
    title: Sì, e, io, anche -- di nuovo
    gloss: Tak, A, ja, też, chcę, iść, idę, do, parku, tam, bardzo -- conosci già queste parole dalle lezioni precedenti.
    note: Un breve ripasso prima del dialogo di questa lezione.
  pl.a1.unit19.lesson03.teach.bo:
    title: Perché
    gloss: perché
    note: Collega un programma al motivo legato al tempo.
    example_gloss: Non vado al parco, perché piove.
  pl.a1.unit19.lesson03.teach.nie_chce_isc_bo_pada_phrase:
    title: Non voglio andare, perché piove
    gloss: Non voglio andare al parco, perché piove.
    note: 'Una descrizione del tempo unita a un programma concreto: esattamente l''obiettivo di questa unità.'
  pl.a1.unit19.lesson03.teach.w_krakowie_recap:
    title: A Cracovia -- di nuovo
    gloss: W Krakowie -- lo conosci già dalle lezioni precedenti, per esempio 'Ona mieszka w Krakowie' (Abita a Cracovia).
    note: Un breve ripasso prima che il dialogo di questa lezione confronti il tempo in due luoghi.
  pl.a1.unit19.lesson03.teach.dialogue.line01:
    title: Marek chiede del tempo
    gloss: Che tempo fa oggi?
    note: Marek apre la conversazione chiedendo che tempo fa oggi.
  pl.a1.unit19.lesson03.teach.dialogue.line02:
    title: Ewa risponde
    gloss: Piove. Fa freddo.
    note: Ewa descrive il tempo che fa davvero oggi.
  pl.a1.unit19.lesson03.teach.dialogue.line03:
    title: Marek reagisce e fa un programma
    gloss: Che tempo orribile! Non voglio andare al parco, perché piove.
    note: Marek reagisce al tempo e dice cosa farà di conseguenza.
  pl.a1.unit19.lesson03.teach.dialogue.line04:
    title: Ewa è d'accordo
    gloss: Neanch'io vado al parco.
    note: Ewa fa lo stesso programma di Marek.
  pl.a1.unit19.lesson03.teach.dialogue.line05:
    title: Marek chiede di Cracovia
    gloss: E a Cracovia? Che tempo fa lì?
    note: Marek sposta la conversazione sul tempo di un'altra città.
  pl.a1.unit19.lesson03.teach.dialogue.line06:
    title: Ewa risponde
    gloss: A Cracovia nevica. Lì fa molto freddo.
    note: Ewa descrive una condizione diversa e più fredda a Cracovia.
