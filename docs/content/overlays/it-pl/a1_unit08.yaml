teaching:
  pl.a1.unit08.lesson01.teach.bank_poczta:
    title: Banca, ufficio postale
    gloss: banca; ufficio postale
    note: 'Due commissioni quotidiane: bank è molto simile all''italiano «banca»; poczta è dove vai a spedire una lettera o un pacco.'
    example_gloss:
    - Questa è una banca.
    - Questo è un ufficio postale.
  pl.a1.unit08.lesson01.teach.apteka_restauracja:
    title: Farmacia, ristorante
    gloss: farmacia; ristorante
    note: Apteka è dove compri le medicine (non un negozio generico); restauracja è quasi identica all'italiano «ristorante».
    example_gloss:
    - Questa è una farmacia.
    - Questo è un ristorante.
  pl.a1.unit08.lesson01.teach.hotel_park:
    title: Hotel, park
    gloss: hotel; parco
    note: 'Entrambe sono molto simili all''italiano: facili da riconoscere, sia scritte sia parlate.'
    example_gloss:
    - Questo è un hotel.
    - Questo è un parco.
  pl.a1.unit08.lesson01.teach.gdzie_jest_note:
    title: Dov'è + [luogo]?
    gloss: 'Dov''è + [luogo]? -- Gdzie («dove») più jest («è») chiede la posizione: Dov''è la banca? Dov''è la farmacia?'
    note: '*Gdzie* significa «dove» e *jest* significa «è»: insieme, *Gdzie jest...?* è la struttura quotidiana per chiedere dove si trova un luogo. Usala così com''è quando chiedi di un solo luogo; per più luoghi il polacco usa invece *są* («sono»).'
  pl.a1.unit08.lesson01.teach.gdzie_jest_bank:
    title: Dov'è la banca?
    gloss: Dov'è la banca?
    note: Lo schema della nota di grammatica messo in pratica con la prima parola di luogo della lezione.
  pl.a1.unit08.lesson02.teach.blisko_daleko:
    title: Vicino, lontano
    gloss: vicino; lontano
    note: Una semplice coppia di contrari, usata direttamente dopo jest per dire quanto un luogo è vicino o lontano.
    example_gloss:
    - Il parco è vicino.
    - L'hotel è lontano.
  pl.a1.unit08.lesson02.teach.niedaleko:
    title: Non lontano
    gloss: non lontano
    note: 'Alla lettera *nie* («non») più *daleko* («lontano») fusi in una sola parola: un modo più morbido e molto comune per rassicurare qualcuno che il luogo è facile da raggiungere.'
    example_gloss: La farmacia non è lontana.
  pl.a1.unit08.lesson02.teach.obok_naprzeciwko:
    title: Accanto a, di fronte a
    gloss: accanto a; di fronte a
    note: 'Entrambe indicano la posizione di un luogo rispetto a un punto di riferimento, non solo la sua vicinanza. Entrambe richiedono che il nome seguente vada al genitivo: vedi la nota di grammatica di questa lezione.'
    example_gloss:
    - La farmacia è accanto alla banca.
    - Il ristorante è di fronte all'hotel.
  pl.a1.unit08.lesson02.teach.genitive_note:
    title: 'Dopo ''obok''/''naprzeciwko''/''blisko + nome'': il genitivo'
    gloss: 'Dopo «accanto a»/«di fronte a»/«vicino a + luogo»: caso genitivo -- bank -> banku, hotel -> hotelu, park -> parku. La farmacia è accanto alla banca. Il ristorante è di fronte all''hotel. Il ristorante è vicino al parco.'
    note: '*Obok*, *naprzeciwko* e *blisko* (quando è seguito da un luogo e non è da solo) reggono il genitivo, quindi il nome che segue cambia desinenza. Per questi tre nomi maschili regolari si aggiunge *-u*: *bank* diventa *banku*, *hotel* diventa *hotelu*, *park* diventa *parku*. Da solo, *blisko* non richiede il genitivo: *To jest blisko* («È vicino») è corretto quanto *blisko parku* («vicino al parco»).'
  pl.a1.unit08.lesson02.teach.apteka_obok_banku:
    title: La farmacia è accanto alla banca
    gloss: La farmacia è accanto alla banca.
    note: 'Mette in pratica in una frase vera lo schema in -u della nota di grammatica: bank diventa banku dopo obok.'
  pl.a1.unit08.lesson03.teach.przepraszam:
    title: Scusi
    gloss: scusi / scusa
    note: 'Il modo quotidiano di attirare l''attenzione di un estraneo prima di fare una domanda: si dice prima della domanda, non dopo.'
    example_gloss: Scusi, dov'è la banca?
  pl.a1.unit08.lesson03.teach.dialogue.line01:
    title: Ewa chiede della farmacia
    gloss: Ewa chiede scusa e domanda dov'è la farmacia.
    note: 'Przepraszam apre la domanda, come spiega la nota di vocabolario di questa lezione: anche con qualcuno che conosce, come Marek, è il modo educato di interrompere prima di chiedere qualcosa.'
  pl.a1.unit08.lesson03.teach.dialogue.line02:
    title: Marek indica dov'è la farmacia
    gloss: Marek dice che la farmacia non è lontana, accanto alla banca.
    note: Unisce niedaleko e obok + banku, entrambi dalla nota di grammatica della lezione 2.
  pl.a1.unit08.lesson03.teach.dialogue.line03:
    title: Ewa ringrazia Marek e chiede del ristorante
    gloss: Ewa ringrazia e chiede dov'è il ristorante.
    note: Dziękuję, già visto nelle unità precedenti; A («e») collega la nuova domanda alla precedente.
  pl.a1.unit08.lesson03.teach.dialogue.line04:
    title: Marek indica dov'è il ristorante
    gloss: Marek dice che il ristorante è di fronte all'hotel, vicino al parco.
    note: Naprzeciwko + hotelu (genitivo, stesso schema di banku) più blisko per un secondo punto di riferimento.
  pl.a1.unit08.lesson03.teach.dialogue.line05:
    title: Ewa ringrazia di nuovo Marek
    gloss: Ewa dice grazie mille.
    note: Bardzo (molto) rafforza dziękuję, proprio come in proszę bardzo.
  pl.a1.unit08.lesson03.teach.dialogue.line06:
    title: Marek risponde
    gloss: Marek dice «prego».
    note: Proszę bardzo, la risposta standard a un ringraziamento, già incontrata nell'unità sugli acquisti.
