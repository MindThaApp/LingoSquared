teaching:
  pl.a1.unit07.lesson01.teach.banan:
    title: Banana
    gloss: banana
    note: Un frutto molto comune, venduto a pezzo o a peso in qualsiasi mercato o negozio.
    example_gloss: Questa è una banana.
  pl.a1.unit07.lesson01.teach.pomidor_ogorek:
    title: Pomodoro, cetriolo
    gloss: pomodoro; cetriolo
    note: 'Entrambi sono maschili inanimati: i loro genitivi plurali (pomidorów, ogórków) ti serviranno quando li comprerai a chili, più avanti in questa unità.'
    example_gloss:
    - Questo è un pomodoro.
    - Questo è un cetriolo.
  pl.a1.unit07.lesson01.teach.ziemniak_cebula:
    title: Patata, cipolla
    gloss: patata; cipolla
    note: Ziemniak è maschile inanimato (stessa famiglia del genitivo plurale in -ów di banan e pomidor); cebula è femminile.
    example_gloss:
    - Questa è una patata.
    - Questa è una cipolla.
  pl.a1.unit07.lesson01.teach.tanio_drogo:
    title: Economico, caro
    gloss: a buon prezzo; caro
    note: '*Tanio* e *drogo* sono avverbi, e in polacco si usano direttamente con *kosztować* («costare»): *To kosztuje drogo* significa letteralmente «questo costa caramente», cioè «è caro». In italiano, invece, di solito si dice «costa poco» o «costa tanto».'
    example_gloss:
    - Molto economico!
    - Molto caro!
  pl.a1.unit07.lesson01.teach.kosztuje_kosztuja_note:
    title: 'Costare: kosztuje, kosztują'
    gloss: 'costare: costa (una cosa), costano (più cose) -- La banana costa poco. Le banane costano poco.'
    note: '*Kosztować* è il verbo «costare». Usa *kosztuje* per un solo oggetto e *kosztują* per più oggetti, proprio come *jest*/*są* («è»/«sono»), ma per i prezzi. Concordare bene è importante: al mercato ti capiranno comunque, ma *banany kosztują* è ciò che dice davvero un madrelingua.'
  pl.a1.unit07.lesson01.teach.ile_kosztuje_banan:
    title: Quanto costa una banana?
    gloss: Quanto costa una banana?
    note: 'La domanda quotidiana per iniziare a trattare il prezzo: *Ile* («quanto») più *kosztuje* al singolare, perché si chiede di una sola banana.'
  pl.a1.unit07.lesson02.teach.grejpfrut:
    title: Pompelmo
    gloss: pompelmo
    note: 'Maschile inanimato, come pomidor e ziemniak: la desinenza non cambia dopo proszę o.'
    example_gloss: Questo è un pompelmo.
  pl.a1.unit07.lesson02.teach.mandarynka_pomarancza:
    title: Mandarino, arancia
    gloss: mandarino; arancia
    note: 'Entrambi femminili, come kawa e herbata nell''unità sul cibo: all''accusativo cambierebbero -a in -ę, ma in questa lezione ti serve solo la forma base del dizionario.'
    example_gloss:
    - Questo è un mandarino.
    - Questa è un'arancia.
  pl.a1.unit07.lesson02.teach.kilo_pol_kilo:
    title: Un chilo, mezzo chilo
    gloss: un chilo; mezzo chilo
    note: '*Kilo* non cambia mai la propria desinenza, qualunque cosa tu pesi e in qualunque quantità: è il nome che segue *kilo* a cambiare, come spiega la nota di grammatica di questa lezione.'
    example_gloss:
    - Un chilo di pomodori, per favore.
    - Mezzo chilo di banane, per favore.
  pl.a1.unit07.lesson02.teach.poprosze:
    title: Vorrei (per favore)
    gloss: vorrei / mi dia, per favore
    note: '*Poproszę* è un''alternativa un po'' più curata ma quotidiana a *proszę o* dell''unità sul cibo: entrambi significano più o meno «vorrei», e i polacchi passano liberamente dall''uno all''altro. *Poproszę* è seguito direttamente da ciò che vuoi, senza *o*.'
    example_gloss: Vorrei un pompelmo, per favore.
  pl.a1.unit07.lesson02.teach.genitive_ow_note:
    title: 'Dopo «kilo»: la desinenza -ów'
    gloss: 'Genitivo plurale dopo «kilo»: banan -> di banane, pomidor -> di pomodori, ziemniak -> di patate.'
    note: 'Quando indichi una quantità a peso (*kilo*, *pół kilo*), il nome che segue assume un''altra forma, il genitivo plurale. Per questi tre nomi maschili regolari basta aggiungere *-ów*: *banan* diventa *bananów*, *pomidor* diventa *pomidorów*, *ziemniak* diventa *ziemniaków*.'
  pl.a1.unit07.lesson02.teach.poprosze_kilo_pomidorow:
    title: Un chilo di pomodori, per favore
    gloss: Un chilo di pomodori, per favore.
    note: 'Mette in pratica lo schema in -ów della nota di grammatica in una richiesta reale: pomidor diventa pomidorów dopo kilo.'
  pl.a1.unit07.lesson03.teach.dla:
    title: Per
    gloss: per
    note: 'Una semplice preposizione che significa «per»: il venditore la usa in *Co dla pani?* (letteralmente «che cosa per Lei?») per chiedere con cortesia alla cliente che cosa desidera.'
    example_gloss: Questo è per te.
  pl.a1.unit07.lesson03.teach.swieze_bardzo:
    title: Fresco, molto
    gloss: fresco; molto
    note: Due parole che il venditore al mercato usa di continuo, per lodare la freschezza della merce o per dire quanto costa poco o tanto.
    example_gloss:
    - I pomodori sono freschi.
    - Molto economico!
  pl.a1.unit07.lesson03.teach.trochę:
    title: Un po'
    gloss: un po' / un poco
    note: 'Attenua educatamente una lamentela: trochę drogo («un po'' caro») è molto più naturale in una trattativa amichevole del solo drogo.'
    example_gloss: Un po' caro.
  pl.a1.unit07.lesson03.teach.razem:
    title: In totale / insieme
    gloss: in totale / insieme
    note: Ciò che dice il venditore subito prima di indicare l'importo finale da pagare.
    example_gloss: Dieci złoty in totale.
  pl.a1.unit07.lesson03.teach.co_dla_pani:
    title: Che cosa desidera?
    gloss: Che cosa desidera?
    note: 'Letteralmente «che cosa per Lei» (forma di cortesia): è la domanda con cui il venditore si rivolge naturalmente a un cliente.'
  pl.a1.unit07.lesson03.teach.dialogue.line01:
    title: Il venditore saluta Ewa
    gloss: Il venditore saluta e chiede a Ewa che cosa desidera.
    note: Dzień dobry, già visto nei saluti dell'unità 1.
  pl.a1.unit07.lesson03.teach.dialogue.line02:
    title: Ewa chiede delle banane
    gloss: Ewa chiede quanto costano le banane.
    note: 'Kosztują: la forma plurale della nota di grammatica di questa unità, perché si chiede delle banane in generale.'
  pl.a1.unit07.lesson03.teach.dialogue.line03:
    title: Il venditore dice il prezzo
    gloss: Il venditore dice che costano cinque złoty al chilo e che sono freschissime.
    note: 'Una naturale frase ellittica sul prezzo: «[prezzo] kilo» è il modo in cui un venditore polacco indica il prezzo al chilo, senza bisogno di una parola per «al».'
  pl.a1.unit07.lesson03.teach.dialogue.line04:
    title: Ewa ordina le banane
    gloss: Ewa dice va bene e chiede un chilo di banane.
    note: Combina poproszę con kilo + bananów, esattamente lo schema della nota di grammatica della lezione 2.
  pl.a1.unit07.lesson03.teach.dialogue.line05:
    title: Il venditore parla dei pomodori
    gloss: Il venditore chiede anche dei pomodori e dice che costano otto złoty al chilo.
    note: Lo stesso schema ellittico del prezzo della battuta 3, ora per un altro prodotto.
  pl.a1.unit07.lesson03.teach.dialogue.line06:
    title: Ewa tratta con garbo e ordina
    gloss: Ewa dice che è un po' caro, ma prende mezzo chilo.
    note: 'Trochę drogo attenua la lamentela: Ewa compra comunque, solo una quantità minore.'
  pl.a1.unit07.lesson03.teach.dialogue.line07:
    title: Il venditore dice il totale
    gloss: Il venditore dice «ecco a Lei» e che il totale è nove złoty.
    note: '5 złoty per le banane più 4 złoty per mezzo chilo di pomodori: nove złoty in totale, in linea con tutti i prezzi detti prima nella scena.'
