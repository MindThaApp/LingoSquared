teaching:
  pl.a1.unit26.lesson01.teach.zwierze_zwierzak:
    title: Animale, animale domestico
    gloss: l'animale / un animale domestico
    note: '*Zwierzę* è la parola generica per «animale»; *zwierzak* è la parola di uso quotidiano per l''animale domestico.'
    example_gloss:
    - Il cane è un animale.
    - Il cane è anche un animale domestico.
  pl.a1.unit26.lesson01.teach.pies_kot:
    title: Cane e gatto
    gloss: il cane / il gatto
    example_gloss:
    - Ewa ha un cane.
    - Tomek ha un gatto.
  pl.a1.unit26.lesson01.teach.ryba_ptak:
    title: Pesce e uccello
    gloss: il pesce / l'uccello
    example_gloss:
    - Il nonno ha un pesce.
    - Nina ha un uccellino.
  pl.a1.unit26.lesson01.teach.masz_zwierzaka:
    title: Hai un animale domestico?
    gloss: Hai un animale domestico?
    note: È lo stesso schema di domanda *Masz ...?* che conosci dalle unità precedenti; *masz* è la forma di *ty* di *mieć*.
  pl.a1.unit26.lesson01.teach.tak_mam_psa:
    title: Sì, ho un cane
    gloss: Sì, ho un cane.
    note: Una semplice risposta affermativa con il lessico nuovo di questa unità.
  pl.a1.unit26.lesson01.teach.nie_nie_mam:
    title: No, non ho un animale domestico
    gloss: No, non ho un animale domestico.
    note: '*Nie mam* + genitivo nega ciò che non hai: *zwierzaka*. Vedi la nota di grammatica.'
  pl.a1.unit26.lesson01.teach.nie_mam_czasu:
    title: Nie mam + genitivo
    gloss: 'Dopo *nie mam* l''oggetto va al genitivo: *Nie mam czasu* (non ho tempo) e qui *Nie mam zwierzaka* (non ho un animale domestico).'
    note: Riprende lo schema di *Nie mam czasu*; cambia solo il sostantivo. I sostantivi maschili animati come *zwierzak* hanno la stessa forma all'accusativo e al genitivo, mentre quelli femminili mostrano il cambiamento (*Mam rybę* diventa *Nie mam ryby*).
  pl.a1.unit26.lesson02.teach.wyprowadzac_na_spacer:
    title: Portare a spasso (un animale)
    gloss: portare a spasso (un animale)
    note: '*Wyprowadzać na spacer* è l''espressione fissa per portare fuori un animale a passeggio; il verbo è imperfettivo perché indica un''abitudine. Vedi la nota di grammatica.'
    example_gloss: Porto a spasso il cane ogni giorno.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa:
    title: Imperfettivo per le abitudini
    gloss: '*Wyprowadzać* (imperfettivo) descrive un''abitudine: *Codziennie wyprowadzam psa.* Il perfettivo *wyprowadzić* si usa per una singola passeggiata conclusa.'
    note: 'Coppie aspettuali: l''imperfettivo (*wyprowadzać*) indica un''azione ripetuta, il perfettivo (*wyprowadzić*) un''azione singola e conclusa.'
  pl.a1.unit26.lesson02.teach.karmic:
    title: Dare da mangiare
    gloss: dare da mangiare
    example_gloss: Do da mangiare al gatto ogni giorno.
  pl.a1.unit26.lesson02.teach.bawic_sie_z:
    title: Giocare con
    gloss: giocare con
    example_gloss: Tomek gioca con il suo gatto.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa_2:
    title: Porto a spasso il cane ogni giorno
    gloss: Porto a spasso il cane ogni giorno.
    note: Unisce *wyprowadzać na spacer* a *codziennie* (ogni giorno); l'oggetto *psa* è all'accusativo.
  pl.a1.unit26.lesson02.teach.codziennie_karmie_kota:
    title: Do da mangiare al gatto ogni giorno
    gloss: Do da mangiare al gatto ogni giorno.
    note: '*Karmić* (dare da mangiare) vuole l''accusativo dell''animale: *karmię kota*. Qui è unito a *codziennie*.'
  pl.a1.unit26.lesson03.teach.liczba_mnoga_pies:
    title: 'Plurale: pies, psy'
    gloss: 'Plurale: *pies* diventa *psy*, *kot* diventa *koty*, *ryba* diventa *ryby*, *ptak* diventa *ptaki*. La maggior parte dei plurali termina in *-y*, oppure in *-i* dopo k e g.'
    note: Lo schema regolare del plurale polacco, presentato qui per la prima volta con i nomi di animali come esempi.
  pl.a1.unit26.lesson03.teach.psy_koty:
    title: Cani e gatti
    gloss: cani / gatti
    example_gloss:
    - Marek ama i cani.
    - Kasia ama i gatti.
  pl.a1.unit26.lesson03.teach.ryby_ptaki:
    title: Pesci e uccelli (plurale)
    gloss: pesci / uccelli
    example_gloss:
    - Adoro i pesci.
    - Il nonno adora gli uccelli.
  pl.a1.unit26.lesson03.teach.kocham_zwierzeta:
    title: Adoro gli animali
    gloss: Adoro gli animali.
    note: '*Kocham* è la forma di *ja* di *kochać*; il suo oggetto *zwierzęta* è all''accusativo plurale.'
  pl.a1.unit26.lesson03.teach.kasia_kocha_koty:
    title: Kasia ama i gatti, ma non ha un animale
    gloss: Kasia ama i gatti, ma non ha un animale domestico.
    note: Prepara il contrasto su cui è costruita la lettura della lezione 5.
  pl.a1.unit26.lesson04.teach.marek_masz_zwierzaka:
    title: Marek chiede di un animale domestico
    gloss: 'Marek: Hai un animale domestico, Ewa?'
  pl.a1.unit26.lesson04.teach.ewa_tak_mam:
    title: Ewa ha un cane
    gloss: 'Ewa: Sì, ho un cane.'
  pl.a1.unit26.lesson04.teach.marek_jak_on:
    title: Marek chiede com'è
    gloss: 'Marek: Com''è?'
    note: Riprende la domanda *Jak wygląda ...?* di una lezione precedente, ora riferita a un animale; *on* può riferirsi a un cane.
  pl.a1.unit26.lesson04.teach.ewa_ma_brazowa:
    title: Ewa descrive il suo cane
    gloss: 'Ewa: Ha il pelo marrone ed è piccolo.'
    note: Riprende il lessico dei colori dei capelli e delle dimensioni dell'unità sull'aspetto fisico, ora per descrivere il pelo di un animale invece dei capelli di una persona.
  pl.a1.unit26.lesson04.teach.zwierzeta_maja_rodzaj:
    title: On e ona per gli animali
    gloss: 'Gli animali hanno un genere grammaticale: *on* (lui) per *pies* e *kot*, *ona* (lei) per *ryba*. Questi pronomi possono riferirsi a un animale, non solo a una persona.'
    note: 'Il pronome segue il genere del sostantivo: *pies* e *ptak* vogliono *on*, *ryba* vuole *ona* e *zwierzę* vuole *ono*.'
  pl.a1.unit26.lesson04.teach.marek_codziennie_wyprowadzasz:
    title: Marek chiede delle passeggiate
    gloss: 'Marek: Lo porti a passeggio ogni giorno?'
  pl.a1.unit26.lesson04.teach.ewa_tak_codziennie:
    title: Ewa descrive la sua routine
    gloss: 'Ewa: Sì, lo porto a passeggio ogni giorno e gli do da mangiare.'
  pl.a1.unit26.lesson05.teach.marek_i_kasia:
    title: Marek, Kasia e Tomek parlano di animali
    gloss: 'Marek e Kasia amano entrambi gli animali, ma nessuno dei due ha un animale domestico. Marek ama i cani e Kasia ama i gatti. Tomek, invece, ha un animale: un gatto. Gioca spesso con il suo gatto e gli dà da mangiare ogni giorno. E tu, hai un animale domestico?'
    note: 'Contrappone l''amare gli animali all''averne davvero uno: è lo scopo comunicativo dell''obiettivo.'
    glosses:
      kochają: adorare / piacere molto
      oboje: entrambi
      zwierzęta: animali
      zwierzaka: animale domestico
      psy: cani
      koty: gatti
      kota: gatto
      bawi: gioca
      daje: dà
      co: ogni / tutti
      jeść: cibo
  pl.a1.unit26.lesson05.teach.tomek_czesto_bawi:
    title: Tomek gioca spesso con il suo gatto
    gloss: Tomek gioca spesso con il suo gatto.
    note: '*Bawić się z* (giocare con) vuole lo strumentale: *z kotem*. *Często* è l''avverbio di frequenza per «spesso».'
  pl.a1.unit26.lesson05.teach.kocham_psy_nie:
    title: Adoro i cani. Non ho un animale domestico.
    gloss: Adoro i cani. Non ho un animale domestico.
    note: Una risposta modello di due frasi, da riutilizzare per l'esercizio di scrittura dell'unità.
  pl.a1.unit26.lesson06.teach.ewa_nino_ty:
    title: Ewa chiede a Nina
    gloss: 'Ewa: Nina, hai un animale anche tu?'
  pl.a1.unit26.lesson06.teach.nina_tak_mam:
    title: Nina ha un uccellino di nome Pico
    gloss: 'Nina: Sì, ho un uccellino. Si chiama Pico.'
    note: '*Ma na imię* (si chiama) è la stessa espressione usata prima per presentare un nome.'
  pl.a1.unit26.lesson06.teach.marek_jak_milo:
    title: Marek reagisce
    gloss: 'Marek: Che bello! Che cosa fai con lui ogni giorno?'
  pl.a1.unit26.lesson06.teach.nina_codziennie_go:
    title: Nina gli dà da mangiare ogni giorno
    gloss: 'Nina: Gli do da mangiare ogni giorno.'
  pl.a1.unit26.lesson06.teach.marek_ja_tez:
    title: Anche Marek ama gli uccelli
    gloss: 'Marek: Anch''io amo gli uccelli.'
  pl.a1.unit26.lesson06.teach.ewa_fajnie_ze:
    title: Ewa chiude la conversazione
    gloss: 'Ewa: Che bello che tutti e tre amiamo gli animali!'
    note: Chiude il cerchio sulle informazioni sugli animali dei tre personaggi di questa unità.
