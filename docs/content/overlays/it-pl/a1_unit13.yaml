teaching:
  pl.a1.unit13.lesson01.teach.muzyka:
    title: La musica
    gloss: musica
    note: Un argomento comune per parlare di ciò che piace e non piace. È una parola facile da riconoscere, perché è molto simile all'italiano.
    example_gloss: Mi piace la musica.
  pl.a1.unit13.lesson01.teach.muzyke_accusative_note:
    title: Muzyka -> muzykę
    gloss: 'Con lubić (piacere) + complemento oggetto, muzyka diventa muzykę, come kawa diventa kawę. Lubię muzykę, non: Lubię muzyka.'
    note: 'Lo schema è lo stesso che già conosci: *muzyka* diventa *muzykę* come complemento oggetto di *lubię*, proprio come *kawa* diventa *kawę*.'
  pl.a1.unit13.lesson01.teach.lubisz:
    title: Ti piace
    gloss: ti piace (informale, ty)
    note: 'La forma «ty» di lubić: serve per chiedere direttamente a un amico se gli piace qualcosa.'
    example_gloss: Ti piace la musica?
  pl.a1.unit13.lesson01.teach.lubic_paradigm_note:
    title: 'Lubić: lubię, lubisz, lubi'
    gloss: 'Lubić (piacere): lubię (io), lubisz (tu), lubi (lui/lei). Lubię e lubi le conosci già: lubisz è la forma nuova, per la persona con cui parli.'
    note: '*Lubię* e *lubi* ormai sono vecchie conoscenze: *lubisz* aggiunge la forma mancante, quella per «tu», dello stesso verbo.'
  pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke:
    title: Ti piace la musica?
    gloss: Ti piace la musica?
    note: 'Czy apre una domanda sì/no: è il modo naturale per chiedere a un amico che cosa preferisce.'
  pl.a1.unit13.lesson01.teach.tak_lubie:
    title: Sì, mi piace.
    gloss: Sì, mi piace.
    note: 'Una risposta breve e naturale: non serve ripetere la parola muzykę.'
  pl.a1.unit13.lesson01.teach.nie_nie_lubie:
    title: No, non mi piace.
    gloss: No, non mi piace.
    note: 'Nie nie lubię sembra un raddoppio, ma non è un errore: il primo nie risponde alla domanda, il secondo nie nega lubię.'
  pl.a1.unit13.lesson01.teach.ellipsis_note:
    title: Risposte brevi
    gloss: 'Risposta breve: Tak, lubię. / Nie, nie lubię. -- non serve ripetere la parola muzykę, perché dalla domanda è già chiaro di che cosa si parla.'
    note: 'Come *Pyszny?* poteva stare da solo, anche *Tak, lubię.* non ha bisogno di ripetere l''argomento: lo fornisce già il contesto.'
  pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke:
    title: Mi piace molto la musica
    gloss: Mi piace molto la musica.
    note: 'Bardzo (molto) rafforza una semplice preferenza: bardzo l''hai già incontrato fin dalla prima unità.'
  pl.a1.unit13.lesson02.teach.wole:
    title: preferisco
    gloss: preferisco
    note: 'Un verbo completamente nuovo in questa unità, woleć (preferire): qui si impara solo la forma «io», come per lubię.'
    example_gloss: Preferisco il tè.
  pl.a1.unit13.lesson02.teach.wolec_scope_note:
    title: 'Woleć: in questa unità solo wolę'
    gloss: 'Woleć (preferire): wolę (io) -- in questa lezione si impara solo la forma «io», come per lubię. Wolę kawę. = Preferisco il caffè.'
    note: Per ora solo la forma *ja* (io) di *woleć*, esattamente come è successo per *lubię* quando è stato introdotto.
  pl.a1.unit13.lesson02.teach.kawa_herbata_recap:
    title: Ancora caffè e tè
    gloss: 'Wolę + complemento oggetto: kawa diventa kawę, herbata diventa herbatę -- lo stesso schema che già conosci.'
    note: 'Stesso schema dell''accusativo di prima, solo con un verbo nuovo: *wolę kawę*, *wolę herbatę*.'
  pl.a1.unit13.lesson02.teach.wole_kawe:
    title: Preferisco il caffè
    gloss: Preferisco il caffè.
    note: Una semplice affermazione di preferenza con wolę.
  pl.a1.unit13.lesson02.teach.wole_herbate:
    title: Preferisco il tè
    gloss: Preferisco il tè.
    note: Lo stesso schema con herbatę al posto di kawę.
  pl.a1.unit13.lesson02.teach.czy_or_note:
    title: Czy come «o»
    gloss: 'Il czy di Kawa czy herbata? non è lo stesso czy che apre una domanda sì/no: qui collega due scelte, come la «o» italiana. Kawa czy herbata? = Caffè o tè?'
    note: 'Attenzione: *czy* di solito apre una domanda sì/no, ma tra due sostantivi come qui significa semplicemente «o».'
  pl.a1.unit13.lesson02.teach.kawa_czy_herbata:
    title: Caffè o tè?
    gloss: Caffè o tè?
    note: Un modo breve e naturale per offrire una scelta a qualcuno.
  pl.a1.unit13.lesson03.teach.ja_tez:
    title: Anch'io
    gloss: anch'io
    note: Un modo breve per dire che sei d'accordo con ciò che qualcuno ha appena detto.
  pl.a1.unit13.lesson03.teach.ja_tez_note:
    title: Di nuovo Ja też
    gloss: 'Ja też significa «anch''io»: lo conosci già dalla lezione sulla routine (Ja też wstaję o siódmej, «anch''io mi alzo alle sette»).'
    note: 'Un rapido promemoria: questa espressione è già comparsa prima.'
  pl.a1.unit13.lesson03.teach.elliptical_reminder_note:
    title: Kawa czy herbata? non ha bisogno del verbo
    gloss: 'Come Pyszny? nell''unità precedente, anche la breve domanda Kawa czy herbata? non ha bisogno di un verbo: il contesto basta.'
    note: 'Stesso schema di *Pyszny?*: una domanda breve, senza verbo, resa perfettamente chiara dal contesto.'
  pl.a1.unit13.lesson03.teach.dialogue.line01:
    title: Marek chiede a Ewa se le piace la musica
    gloss: Ti piace la musica?
    note: Marek apre la conversazione con la domanda appena imparata in questa unità.
  pl.a1.unit13.lesson03.teach.dialogue.line02:
    title: A Ewa piace e rilancia la domanda
    gloss: Sì, mi piace molto! E a te?
    note: A ty? (e tu?) rimanda la domanda a Marek, con lo stesso schema visto nelle unità precedenti.
  pl.a1.unit13.lesson03.teach.dialogue.line03:
    title: Marek è d'accordo e chiede delle bevande
    gloss: Anche a me. Caffè o tè?
    note: Ja też lubię conferma la risposta di Marek stesso, prima che cambi argomento con una nuova domanda a scelta.
  pl.a1.unit13.lesson03.teach.dialogue.line04:
    title: Ewa preferisce il caffè
    gloss: Preferisco il caffè.
    note: 'La preferenza di Ewa, espressa con wolę: è la stessa amante del caffè incontrata nell''unità sulla routine.'
  pl.a1.unit13.lesson03.teach.dialogue.line05:
    title: Marek preferisce il tè
    gloss: Io preferisco il tè.
    note: 'La preferenza di Marek: la scelta opposta a quella di Ewa.'
