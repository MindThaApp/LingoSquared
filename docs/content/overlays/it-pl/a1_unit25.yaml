answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Polacco A1
  description: 'Polacco di base per descrivere l''aspetto fisico di una persona: impressioni su altezza ed età, colore di capelli e occhi, la domanda fondamentale Jak wygląda ...? e il confronto tra l''aspetto di due persone.'
units:
  pl.a1.unit25.wyglad:
    title: Descrivere l'aspetto
lessons:
  pl.a1.unit25.lesson01.wysoki_niski_stary_i:
    title: Alto, basso, anziano e giovane
  pl.a1.unit25.lesson02.opisywanie_wlosow:
    title: Descrivere i capelli
  pl.a1.unit25.lesson03.oczy_i_jak_ktos:
    title: Gli occhi e «Com'è?»
  pl.a1.unit25.lesson04.ewa_opisuje_nine:
    title: Ewa descrive Nina
  pl.a1.unit25.lesson05.porownanie_tomka_i_kasi:
    title: Confronto tra Tomek e Kasia
  pl.a1.unit25.lesson06.marek_rozpoznaje_nine:
    title: Marek riconosce Nina
teaching:
  pl.a1.unit25.lesson01.teach.wysoki_niski:
    title: Alto e basso
    gloss: alto / basso
    note: '*Wysoki* descrive una persona alta e *niski* una persona bassa. Una donna è *wysoka* o *niska*.'
    example_gloss:
    - Kasia è alta.
    - Tomek è basso.
  pl.a1.unit25.lesson01.teach.stary_mlody:
    title: Anziano e giovane
    gloss: anziano / giovane
    note: '*Stary* e *młody* qui descrivono un''impressione generale, non un numero esatto di anni.'
    example_gloss:
    - Il nonno è anziano.
    - Marek è giovane.
  pl.a1.unit25.lesson01.teach.dziadek_jest_stary:
    title: 'Stary: impressione o età'
    gloss: '*Stary* descrive un''impressione generale, come in *Dziadek jest stary*. Per dire l''età esatta, il polacco usa un''altra struttura: *Ile masz lat?*'
    note: Per dire quanti anni sembra avere qualcuno si usa *stary* o *młody*; per l'età esatta si chiede *Ile masz lat?* e si risponde con *mam ... lat* (ho ... anni).
  pl.a1.unit25.lesson01.teach.kasia_jest_wysoka:
    title: Kasia è alta e Tomek è basso
    gloss: Kasia è alta e Tomek è basso.
    note: Una semplice frase composta con *a* («e», con valore di contrasto). *Wysoka* e *niski* concordano con un soggetto femminile e uno maschile, e preparano il confronto della lezione 5.
  pl.a1.unit25.lesson02.teach.wlosy:
    title: I capelli
    gloss: i capelli
    note: '*Włosy* in polacco è sempre plurale: *długie włosy* (capelli lunghi).'
    example_gloss: Marek ha i capelli neri e corti.
  pl.a1.unit25.lesson02.teach.blond_brazowe_siwe:
    title: Biondo, castano e grigio
    gloss: biondo / castano / grigio
    note: Tre colori di capelli. *Blond* non cambia mai; *brązowe* e *siwe* sono forme plurali che concordano con *włosy*.
    example_gloss:
    - Ewa ha i capelli biondi.
    - Tomek ha i capelli castani.
    - Il nonno ha i capelli grigi.
  pl.a1.unit25.lesson02.teach.dlugie_krotkie:
    title: Lunghi e corti (capelli)
    gloss: lungo / corto (capelli)
    note: '*Długie* (lunghi) e *krótkie* (corti) sono forme plurali che concordano con *włosy*.'
    example_gloss:
    - Kasia ha i capelli lunghi.
    - Tomek ha i capelli corti.
  pl.a1.unit25.lesson02.teach.wlosy_sa_w:
    title: Włosy vuole l'aggettivo al plurale
    gloss: '*Włosy* è plurale, quindi anche l''aggettivo è plurale: capelli lunghi, capelli corti, capelli castani, capelli neri.'
    note: 'I sostantivi plurali che non indicano uomini prendono aggettivi in *-e*: *długie włosy*. *Blond* è l''eccezione: non cambia mai (*blond włosy*).'
  pl.a1.unit25.lesson02.teach.wlosy_maja_tylko:
    title: 'Włosy: sempre plurale'
    gloss: '*Włosy* (i capelli) è sempre plurale: *jej włosy są długie* (i suoi capelli sono lunghi, alla lettera «i suoi capelli sono lunghi» con verbo al plurale). *Jej* significa «suo/sua» (di lei).'
    note: In polacco włosy è un sostantivo plurale, quindi verbi e aggettivi concordano al plurale. *Jej* («di lei») non cambia mai, per quante cose le appartengano.
  pl.a1.unit25.lesson02.teach.marek_ma_krotkie:
    title: Marek ha i capelli neri e corti
    gloss: Marek ha i capelli neri e corti.
    note: '*Czarne* (neri) è la forma plurale che concorda con *włosy*.'
  pl.a1.unit25.lesson02.teach.ewa_ma_dlugie:
    title: Ewa ha i capelli biondi e lunghi
    gloss: Ewa ha i capelli lunghi e biondi.
    note: Unisce in un'unica frase naturale il lessico di lunghezza e colore di questa lezione.
  pl.a1.unit25.lesson03.teach.oczy:
    title: Gli occhi
    gloss: gli occhi
    note: '*Oczy* è il plurale di *oko*; in polacco di solito si parla di entrambi gli occhi al plurale.'
    example_gloss: Marek ha gli occhi castani.
  pl.a1.unit25.lesson03.teach.niebieski_brazowy_zielony:
    title: Azzurro, marrone e verde
    gloss: azzurro / marrone / verde
    note: 'Tre colori degli occhi, al plurale per concordare con *oczy*: *niebieskie*, *brązowe*, *zielone*.'
    example_gloss:
    - Ewa ha gli occhi azzurri.
    - Tomek ha gli occhi castani.
    - Kasia ha gli occhi verdi.
  pl.a1.unit25.lesson03.teach.oczy_sa_w:
    title: Oczy vuole -e
    gloss: '*Oczy* è plurale, quindi l''aggettivo termina in *-e*: occhi azzurri, occhi castani, occhi verdi.'
    note: 'È la stessa desinenza del plurale usata con *włosy* nella lezione 2: *niebieskie oczy*, *brązowe oczy*, *zielone oczy*.'
  pl.a1.unit25.lesson03.teach.jak_wyglada_ewa:
    title: Che aspetto ha Ewa?
    gloss: Che aspetto ha Ewa?
    note: '*Jak wygląda ...?* è la domanda centrale di questa unità: riusala per chiedere l''aspetto di chiunque.'
  pl.a1.unit25.lesson03.teach.ewa_ma_dlugie:
    title: Ewa ha i capelli lunghi e biondi e gli occhi azzurri
    gloss: Ewa ha i capelli lunghi e biondi e gli occhi azzurri.
    note: Una risposta modello che unisce capelli e occhi in una sola frase con *i* (e).
  pl.a1.unit25.lesson04.teach.ewa_do_kawiarni:
    title: Ewa presenta Nina
    gloss: 'Ewa: Al caffè linguistico viene una ragazza nuova. Si chiama Nina.'
    note: '*Przychodzi* (viene) introduce una persona nuova nella scena; *do kawiarni językowej* usa *do* + genitivo.'
  pl.a1.unit25.lesson04.teach.marek_okej_jak:
    title: Marek chiede che aspetto ha
    gloss: 'Marek: Va bene! Che aspetto ha?'
    note: Riprende la domanda centrale di questa unità, ora con *ona* (lei) al posto di un nome.
  pl.a1.unit25.lesson04.teach.ewa_jest_niska:
    title: Ewa descrive l'altezza e i capelli di Nina
    gloss: 'Ewa: È bassa e ha i capelli corti e biondi.'
    note: Unisce *niska* (il femminile di *niski*) della lezione 1 con il lessico dei capelli della lezione 2.
  pl.a1.unit25.lesson04.teach.marek_a_jej:
    title: Marek chiede dei suoi occhi
    gloss: 'Marek: E i suoi occhi?'
    note: '*Jej* qui è il possessivo «suo/sua» (di lei), quindi *jej oczy* significa «i suoi occhi»; *jej* non cambia mai.'
  pl.a1.unit25.lesson04.teach.ewa_ma_zielone:
    title: Ewa descrive gli occhi di Nina
    gloss: 'Ewa: Ha gli occhi verdi.'
    note: Riprende *zielone oczy* dalla lezione 3.
  pl.a1.unit25.lesson04.teach.marek_dzieki_wtedy:
    title: Marek la riconoscerà
    gloss: 'Marek: Grazie! Allora la riconoscerò.'
    note: '*Rozpoznam* è il futuro perfettivo («riconoscerò»); *ją* è l''accusativo di *ona* (lei, la).'
  pl.a1.unit25.lesson05.teach.tomek_i_kasia:
    title: Confronto tra Tomek e Kasia
    gloss: Tomek e Kasia sono fratello e sorella, ma hanno un aspetto diverso. Tomek è basso, ha i capelli corti e castani e gli occhi castani. Kasia è più alta di Tomek e ha i capelli lunghi e castani e gli occhi verdi. E tu, che aspetto hai?
    note: Un breve confronto che riprende tutte le parole di colore e lunghezza viste finora e termina con la domanda chiave dell'unità rivolta a chi legge.
    glosses:
      brat: fratello
      siostra: sorella
      wyglądają: essere (di aspetto)
      inaczej: diverso
      niski: basso
      krótkie: basso
      brązowe: castano
      włosy: i capelli
      oczy: gli occhi
      wyższa: più alto
      długie: lungo
      zielone: verde
      wyglądasz: hai l'aspetto (tu), cioè come appare qualcuno
  pl.a1.unit25.lesson05.teach.stopien_wyzszy_wysoki:
    title: Ancora il comparativo
    gloss: 'Comparativo: *wysoki* (alto) diventa *wyższy* (più alto) e la persona con cui si confronta segue *niż* (di/che): Kasia è più alta di Tomek.'
    note: 'In polacco il comparativo si forma cambiando la desinenza dell''aggettivo, che concorda comunque nel genere: *wyższa* per Kasia (femminile).'
  pl.a1.unit25.lesson05.teach.kasia_ma_dluzsze:
    title: Kasia ha i capelli più lunghi di Tomek
    gloss: Kasia ha i capelli più lunghi di Tomek.
    note: '*Dłuższe* (più lunghi) è al plurale per concordare con *włosy*, e *niż* (di/che) introduce il confronto.'
  pl.a1.unit25.lesson05.teach.mam_krotkie_brazowe:
    title: Ho i capelli corti e castani
    gloss: Ho i capelli corti e castani.
    note: Una frase modello in prima persona con *Mam ...*, pronta da riusare per descrivere il tuo aspetto.
  pl.a1.unit25.lesson06.teach.marek_patrz_czy:
    title: Marek nota Nina
    gloss: 'Marek: Guarda, è Nina? Ha i capelli corti e biondi e gli occhi verdi.'
    note: '*Patrz* (guarda) è l''imperativo di *patrzeć*. *Czy to Nina?* significa «è Nina?».'
  pl.a1.unit25.lesson06.teach.ewa_tak_to:
    title: Ewa conferma
    gloss: 'Ewa: Sì, è Nina!'
    note: Una conferma breve e naturale.
  pl.a1.unit25.lesson06.teach.nina_czesc_jestes:
    title: Nina saluta Marek
    gloss: 'Nina: Ciao, sei Marek?'
    note: 'Una semplice domanda di saluto informale. Dopo *być*, un nome va allo strumentale: *jesteś Markiem?*'
  pl.a1.unit25.lesson06.teach.marek_tak_milo:
    title: Marek saluta Nina a sua volta
    gloss: 'Marek: Sì! Piacere di conoscerti, Nina.'
    note: '*Miło cię poznać* è la formula standard per un primo incontro («piacere di conoscerti»; *poznać* significa «conoscere, fare la conoscenza»). Nina è al vocativo: *Nino*.'
  pl.a1.unit25.lesson06.teach.nina_ciebie_tez:
    title: Nina ricambia il saluto
    gloss: 'Nina: Piacere di conoscerti anch''io!'
    note: 'Chiude il dialogo: Marek ha riconosciuto Nina grazie alla descrizione di Ewa.'
