    title: Uso il cellulare tutti i giorni
    gloss: Uso il cellulare ogni giorno.
    note: '*Codziennie* significa «ogni giorno» e può stare dopo il verbo: *Używam telefonu codziennie.*'
  pl.a1.unit29.lesson02.teach.aplikacja:
    title: L'app
    gloss: l'app
    example_gloss: Ho un'app per le previsioni del tempo.
  pl.a1.unit29.lesson02.teach.wiadomosc:
    title: Il messaggio
    gloss: il messaggio
    example_gloss: Mando un messaggio con l'app.
  pl.a1.unit29.lesson02.teach.znasz_juz_prognoze:
    title: 'Verbi per i messaggi: inviare e leggere'
    gloss: Conosci già *prognoza pogody* (le previsioni del tempo). *Wiadomość* è un messaggio che puoi inviare (*wysyłam*, *wysyłasz*) o leggere (*czytam*, *czytasz*).
    note: Collega la parola nuova al sostantivo composto già visto nell'unità sul tempo atmosferico.
  pl.a1.unit29.lesson02.teach.ewa_wysyla_wiadomosc:
    title: Ewa invia un messaggio tramite l'app
    gloss: Ewa invia un messaggio tramite l'app.
    note: '*Wysyłać* (inviare) usa *przez* + accusativo per il canale: *przez aplikację*.'
  pl.a1.unit29.lesson02.teach.marek_czyta_wiadomosc:
    title: Marek legge il messaggio
    gloss: Marek legge il messaggio.
  pl.a1.unit29.lesson03.teach.sprawdzac:
    title: Cercare
    gloss: cercare (informazioni)
    example_gloss: Cerco le previsioni del tempo.
  pl.a1.unit29.lesson03.teach.po_sprawdzam_stoi:
    title: Due verbi, due casi
    gloss: '*Sprawdzam* vuole l''accusativo: *prognozę pogody*. *Używam* vuole il genitivo: *telefonu*.'
    note: La maggior parte dei verbi regge l'accusativo, ma *używać* è un'eccezione e richiede il genitivo.
  pl.a1.unit29.lesson03.teach.tomek_sprawdza_prognoze:
    title: Tomek controlla le previsioni del tempo
    gloss: Tomek controlla le previsioni del tempo.
  pl.a1.unit29.lesson03.teach.potem_idzie_biegac:
    title: Poi va a correre
    gloss: Poi va a correre.
    note: '*Idzie biegać* significa «va a correre»: *iść* + infinito.'
  pl.a1.unit29.lesson04.teach.ewa_pocwiczymy_w:
    title: Ewa propone
    gloss: 'Ewa: Ci alleniamo sabato alle dieci?'
  pl.a1.unit29.lesson04.teach.marek_dobry_pomysl:
    title: Marek accetta
    gloss: 'Marek: Buona idea! Controllo le previsioni del tempo.'
    note: '*Dobry pomysł!* è una risposta breve a una proposta; l''aggettivo *dobry* concorda con *pomysł*, maschile.'
  pl.a1.unit29.lesson04.teach.marek_w_sobote:
    title: Marek controlla il tempo
    gloss: 'Marek: Sabato c''è il sole!'
    note: '*Słonecznie* è un avverbio: *jest słonecznie* significa «c''è il sole» e non serve il soggetto.'
  pl.a1.unit29.lesson04.teach.tomek_widze_wiadomosc:
    title: Tomek vede il messaggio
    gloss: 'Tomek: Vedo il messaggio. A sabato!'
  pl.a1.unit29.lesson04.teach.znasz_juz_do:
    title: Do widzenia e do + un giorno
    gloss: 'Conosci già *Do widzenia!* Puoi anche nominare un giorno: *Do soboty!*, *Do jutra!* (dopo *do* si usa il genitivo).'
    note: Estende lo schema di saluto dell'unità sui saluti a un giorno preciso.
  pl.a1.unit29.lesson05.teach.ewa_dzwoni_do:
    title: Chi usa cosa?
    gloss: Ewa chiama Marek ogni giorno. Usa il telefono, non un'app. Marek non ha un computer a casa, ma usa internet sul telefono. Tomek ogni mattina controlla le previsioni del tempo. Poi va a correre. Kasia manda spesso un messaggio a Ewa. E tu, usi il telefono ogni giorno?
    note: Confronta le abitudini dei quattro personaggi con i dispositivi, come la lettura di confronto dell'unità sullo sport.
    glosses:
      dzwoni: chiama
      każdego: ogni / tutti
      dnia: giorno
      używa: usa
      telefonu: cellulare
      aplikacji: app
      komputera: computer
      domu: a casa
      internetu: internet
      sprawdza: cerca
      ranka: mattina
      prognozę: previsioni del tempo
      idzie: va
      biegać: correre
      wysyła: manda
      często: spesso
      wiadomość: messaggio
      używasz: uso
  pl.a1.unit29.lesson05.teach.tomek_kazdego_ranka:
    title: Tomek controlla le previsioni ogni mattina
    gloss: Tomek controlla le previsioni del tempo ogni mattina.
  pl.a1.unit29.lesson05.teach.kasia_czesto_wysyla:
    title: Kasia scrive spesso a Ewa
    gloss: Kasia manda spesso un messaggio a Ewa.
  pl.a1.unit29.lesson06.teach.ewa_widze_wiadomosc:
    title: Ewa conferma il programma
    gloss: 'Ewa: Vedo il messaggio. Ci alleniamo sabato alle dieci al parco?'
  pl.a1.unit29.lesson06.teach.marek_tak_a:
    title: Marek conferma il tempo
    gloss: 'Marek: Sì, e sabato c''è il sole!'
  pl.a1.unit29.lesson06.teach.tomek_wtedy_pobiegam:
    title: Il programma di Tomek
    gloss: 'Tomek: Allora correrò un po''. Dopo giocherò anche a calcio.'
    note: '*Wtedy* (allora) e *potem* (dopo) indicano l''ordine degli eventi; *pobiegam* e *zagram* sono perfettivi, quindi suonano come progetti.'
  pl.a1.unit29.lesson06.teach.kasia_wole_plywac:
    title: Il piano di Kasia
    gloss: 'Kasia: Preferisco nuotare, ma verrò anch''io al parco.'
    note: '*Wolę* significa «preferisco» ed è seguito dall''infinito: *wolę pływać*.'
  pl.a1.unit29.lesson06.teach.ewa_super_do:
    title: Ewa chiude la conversazione
    gloss: 'Ewa: Fantastico! A sabato al parco!'
    note: Chiude in una sola battuta la conversazione di questa unità e il programma dell'unità sullo sport.
