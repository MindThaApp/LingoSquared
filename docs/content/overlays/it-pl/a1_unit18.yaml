teaching:
  pl.a1.unit18.lesson01.teach.dom_jest_ma_recap:
    title: 'Casa, è, ha: di nuovo'
    gloss: 'Dom, jest, ma, Marek, Ewa: conosci già queste parole dalle lezioni precedenti, ad esempio Dom jest tam (la casa è lì).'
    note: Un breve ripasso prima che la lezione le usi per parlare della tua casa.
  pl.a1.unit18.lesson01.teach.mieszkanie:
    title: Appartamento
    gloss: appartamento
    note: Un appartamento, non una casa intera.
    example_gloss: Ewa ha un appartamento.
  pl.a1.unit18.lesson01.teach.duzy_note:
    title: Grande
    gloss: La casa è grande. – *duży* si accorda con i nomi maschili, come *dom*.
    note: 'È la prima volta in questo corso che una parola descrive la dimensione: per ora si usa solo con *dom*.'
  pl.a1.unit18.lesson01.teach.marek_ma_dom_duzy:
    title: La casa di Marek
    gloss: Marek ha una casa. La casa è grande.
    note: Il dato su cui si basa tutta questa unità per Marek.
  pl.a1.unit18.lesson01.teach.ewa_ma_mieszkanie:
    title: La casa di Ewa
    gloss: Ewa ha un appartamento.
    note: Il dato su cui si basa tutta questa unità per Ewa.
  pl.a1.unit18.lesson01.teach.pokoj:
    title: Stanza
    gloss: stanza
    note: Una parola generica per qualsiasi stanza di una casa.
    example_gloss: Dov'è la stanza?
  pl.a1.unit18.lesson01.teach.ile_pokoi_note:
    title: Quante stanze?
    gloss: Quante stanze hai? Ho due stanze. – conosci già Ile, i numeri e mam/masz dalle lezioni precedenti; *pokoi* e *pokoje* sono forme della parola *pokój*.
    note: '*Pokoi* si usa subito dopo *Ile*; *pokoje* si usa dopo *dwa*, *trzy* o *cztery* (due, tre, quattro).'
  pl.a1.unit18.lesson01.teach.ile_pokoi_masz_phrase:
    title: Quante stanze hai?
    gloss: Quante stanze hai?
    note: Una domanda naturale da fare sulla casa di qualcuno.
  pl.a1.unit18.lesson01.teach.mam_dwa_pokoje_phrase:
    title: Ho due stanze
    gloss: Ho due stanze.
    note: Una risposta naturale alla domanda precedente.
  pl.a1.unit18.lesson02.teach.kuchnia:
    title: Cucina
    gloss: cucina
    note: Una delle stanze più comuni di una casa.
    example_gloss: La cucina è piccola.
  pl.a1.unit18.lesson02.teach.mala_note:
    title: Piccolo
    gloss: La cucina è piccola. – *mała* si accorda con i nomi femminili, come *kuchnia*.
    note: 'È una parola diversa da *duży* (grande): per ora si usa solo con *kuchnia*.'
  pl.a1.unit18.lesson02.teach.sypialnia:
    title: Camera da letto
    gloss: camera da letto
    note: La stanza in cui si dorme.
    example_gloss: Dov'è la camera da letto?
  pl.a1.unit18.lesson02.teach.lazienka:
    title: Bagno
    gloss: bagno
    note: La stanza con la doccia e il water.
    example_gloss: Dov'è il bagno?
  pl.a1.unit18.lesson02.teach.gdzie_tam_recap:
    title: 'Dove, lì: di nuovo'
    gloss: 'Gdzie, tam: conosci già queste parole dalle lezioni precedenti, ad esempio Bank jest tam (la banca è lì).'
    note: Un breve ripasso prima che la lezione le usi per parlare delle stanze.
  pl.a1.unit18.lesson02.teach.w_pokoje_locative_note:
    title: Nella stanza, in cucina...
    gloss: 'W + stanza, cucina, camera da letto, bagno: w pokoju, w kuchni, w sypialni, w łazience – lo stesso schema di w szkole (a scuola) o w biurze (in ufficio).'
    note: 'Stessa idea dei nomi dei luoghi di lavoro che hai già imparato: la desinenza cambia un po'' per dire «in» quella stanza.'
  pl.a1.unit18.lesson02.teach.gdzie_jest_lazienka_phrase:
    title: Dov'è il bagno?
    gloss: Dov'è il bagno? Il bagno è lì.
    note: Uno scambio naturale per trovare una stanza in casa di qualcuno.
  pl.a1.unit18.lesson02.teach.kuchnia_jest_mala_phrase:
    title: La cucina è piccola
    gloss: La cucina è piccola.
    note: Riprende l'aggettivo di dimensione visto prima in questa lezione.
  pl.a1.unit18.lesson03.teach.recap_words:
    title: 'Sì, e, sono: di nuovo'
    gloss: 'Tak, i, są, A, ja, jeden: conosci già queste parole dalle lezioni precedenti.'
    note: Un breve ripasso prima del dialogo di questa lezione.
  pl.a1.unit18.lesson03.teach.lodowka:
    title: Frigorifero
    gloss: frigorifero
    note: Un elettrodomestico comune in cucina.
    example_gloss: In cucina c'è un frigorifero.
  pl.a1.unit18.lesson03.teach.piekarnik:
    title: Forno
    gloss: forno
    note: Un altro elettrodomestico comune in cucina.
    example_gloss: In cucina c'è un forno.
  pl.a1.unit18.lesson03.teach.dialogue.line01:
    title: Marek descrive la sua casa
    gloss: Ho una casa. La casa è grande.
    note: Marek apre la conversazione descrivendo la sua casa.
  pl.a1.unit18.lesson03.teach.dialogue.line02:
    title: Ewa chiede delle stanze
    gloss: Quante stanze hai?
    note: Ewa fa una naturale domanda di seguito.
  pl.a1.unit18.lesson03.teach.dialogue.line03:
    title: Risponde Marek
    gloss: Ho due stanze. In casa ci sono una cucina, una camera da letto e un bagno.
    note: Marek dice quante stanze ha ed elenca le stanze della sua casa.
  pl.a1.unit18.lesson03.teach.dialogue.line04:
    title: Ewa descrive la sua casa
    gloss: E io ho un appartamento. Ho una stanza.
    note: Ewa passa a descrivere la sua casa, più piccola.
  pl.a1.unit18.lesson03.teach.dialogue.line05:
    title: Ewa chiede della cucina
    gloss: La cucina è piccola?
    note: Ewa fa a Marek un'altra domanda sulla sua cucina.
  pl.a1.unit18.lesson03.teach.dialogue.line06:
    title: Risponde Marek
    gloss: Sì, la cucina è piccola. In cucina ci sono un frigorifero e un forno.
    note: Marek conferma la dimensione della cucina e nomina due oggetti che ci sono.
