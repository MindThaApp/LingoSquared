teaching:
  pl.a1.unit14.lesson01.teach.mlody:
    title: Giovane
    gloss: giovane
    note: 'Un aggettivo descrittivo di base: il punto di partenza per i comparativi di questa unità.'
    example_gloss: Marek è giovane.
  pl.a1.unit14.lesson01.teach.stary:
    title: Vecchio
    gloss: vecchio
    note: 'Il contrario di młody: un altro aggettivo che in questa unità trasformeremo in comparativo.'
    example_gloss: Il nonno è anziano.
  pl.a1.unit14.lesson01.teach.comparative_formation_note:
    title: 'Fare un confronto: si aggiunge -szy'
    gloss: 'Negli aggettivi brevi come stary e młody la desinenza -y cambia in -szy: stary diventa starszy, młody diventa młodszy. Non tutti gli aggettivi funzionano così.'
    note: 'Uno schema semplice per queste due parole: togli la *-y* finale e aggiungi *-szy* per ottenere il comparativo. Molti altri aggettivi usano una desinenza diversa, quindi non applicarlo ovunque.'
  pl.a1.unit14.lesson01.teach.starszy_starsza:
    title: Più vecchio
    gloss: più vecchio
    note: 'Starszy si usa per un uomo (o on); starsza per una donna (o ona): è il comparativo di stary.'
    example_gloss:
    - Il nonno è più vecchio del padre.
    - La nonna è più vecchia della madre.
  pl.a1.unit14.lesson01.teach.mlodszy_mlodsza:
    title: Più giovane
    gloss: più giovane
    note: 'Młodszy per un uomo, młodsza per una donna: è il comparativo di młody.'
    example_gloss:
    - Il padre è più giovane del nonno.
    - La madre è più giovane della nonna.
  pl.a1.unit14.lesson01.teach.niz:
    title: Di / che (nel confronto)
    gloss: di / che (nel confronto)
    note: 'Niż collega le due cose confrontate: la parola dopo niż resta nella sua forma base, normale.'
    example_gloss: Il figlio è più giovane del padre.
  pl.a1.unit14.lesson01.teach.gender_agreement_note:
    title: I comparativi concordano con il genere
    gloss: Starszy/starsza e młodszy/młodsza cambiano secondo il genere, proprio come byłem/byłam. Starszy, młodszy per un uomo (on); starsza, młodsza per una donna (ona).
    note: 'Lo stesso schema di *byłem*/*byłam*: la desinenza cambia a seconda che si parli di un uomo o di una donna.'
  pl.a1.unit14.lesson01.teach.ewa_starsza:
    title: Ewa è più grande di Marek
    gloss: Ewa è più grande di Marek.
    note: 'Un dato reale sui nostri due personaggi: Ewa ha 32 anni, Marek 28.'
  pl.a1.unit14.lesson01.teach.marek_mlodszy:
    title: Marek è più giovane di Ewa
    gloss: Marek è più giovane di Ewa.
    note: Lo stesso fatto, detto al contrario.
  pl.a1.unit14.lesson02.teach.dobry_recap:
    title: Buono, di nuovo
    gloss: 'Dobry («buono»): lo conosci già da Dzień dobry.'
    note: Lo stesso aggettivo che vedi fin dalla prima unità, ora usato per formare un comparativo.
  pl.a1.unit14.lesson02.teach.zly:
    title: Cattivo
    gloss: cattivo
    note: 'Il contrario di dobry: una parola nuova di questa unità.'
    example_gloss: Questa è una brutta giornata.
  pl.a1.unit14.lesson02.teach.irregular_comparative_note:
    title: Dobry e zły sono irregolari
    gloss: 'Dobry e zły sono irregolari: dobry diventa lepszy, zły diventa gorszy; non si aggiunge -szy.'
    note: 'A differenza di *stary*/*młody*, questi due non seguono lo schema regolare in *-szy*: i loro comparativi vanno semplicemente imparati.'
  pl.a1.unit14.lesson02.teach.lepszy_lepsza:
    title: Meglio
    gloss: meglio
    note: 'Lepszy per un uomo, lepsza per una donna (o per una parola femminile come kawa): è il comparativo irregolare di dobry.'
    example_gloss:
    - Lui è meglio di me.
    - Il caffè è meglio del tè.
  pl.a1.unit14.lesson02.teach.gorszy_gorsza:
    title: Peggiore
    gloss: peggio / peggiore
    note: 'Gorszy/gorsza: il comparativo irregolare di zły.'
    example_gloss:
    - Lui è peggio di me.
    - Il tè è peggio del caffè.
  pl.a1.unit14.lesson02.teach.kawa_herbata_recap:
    title: Caffè e tè, di nuovo
    gloss: 'Kawa e herbata: conosci già queste parole dalla lezione precedente sulle bevande.'
    note: Un breve ripasso prima di usarle in un confronto in questa lezione.
  pl.a1.unit14.lesson02.teach.gender_note_recap:
    title: Lo stesso schema di prima
    gloss: Lepszy/lepsza e gorszy/gorsza cambiano secondo il genere come starszy/starsza nella lezione precedente.
    note: La stessa distinzione tra maschile e femminile appena imparata, applicata a una nuova coppia di parole.
  pl.a1.unit14.lesson03.teach.pronouns_recap:
    title: Io, io sono, tu
    gloss: 'Ja, jestem, ty: conosci già queste parole dalle lezioni precedenti.'
    note: Un breve ripasso prima del dialogo di questa lezione.
  pl.a1.unit14.lesson03.teach.tak_nie_dobrze_recap:
    title: Sì, no, bene
    gloss: 'Tak, nie e dobrze: anche queste ti sono già familiari.'
    note: Un altro breve ripasso prima del dialogo.
  pl.a1.unit14.lesson03.teach.ale_recap:
    title: Ma, di nuovo
    gloss: Ale (ma) -- lo conosci già dalle lezioni precedenti. Collega due frasi in contrasto.
    note: Un breve connettore che introduce un contrasto, come «ma» in italiano.
  pl.a1.unit14.lesson03.teach.dialogue.line01:
    title: Marek dice che il tè è meglio
    gloss: Il tè è meglio del caffè!
    note: Marek apre con la sua opinione, in linea con quanto ha già detto nella lezione sulle preferenze.
  pl.a1.unit14.lesson03.teach.dialogue.line02:
    title: Ewa non è d'accordo
    gloss: No, no! Il caffè è meglio del tè!
    note: Ewa ribatte con la sua opinione, anche questa coerente con quanto ha detto prima.
  pl.a1.unit14.lesson03.teach.dialogue.line03:
    title: Marek cambia argomento e passa all'età
    gloss: Va bene, va bene. Ma io sono più giovane di te!
    note: Marek lascia perdere la discussione sulle bevande e tira fuori qualcosa di cui è sicuro.
  pl.a1.unit14.lesson03.teach.dialogue.line04:
    title: Ewa è d'accordo e ribadisce la sua opinione
    gloss: Sì, sono più grande. Ma il caffè è meglio!
    note: Ewa conferma il dato sull'età, poi torna alla sua opinione sul caffè.
