    gloss: 'Marek: Mi piace l''estate. In estate nuotiamo!'
  pl.a1.unit38.lesson05.teach.teraz_jest_wiosna:
    title: Una conversazione sulle stagioni
    gloss: 'Adesso è primavera. I tulipani sono belli. Nina chiede: Quale stagione trovi bella? Marek dice: Mi piace l''estate. In estate nuotiamo. Ewa dice: Mi piace l''inverno. In inverno pattiniamo.'
    note: Riassume la conversazione al caffè linguistico riportando le parole dirette dei personaggi.
    glosses:
      wiosna: primavera
      Tulipany: tulipani
      ładne: belli
      pyta: chiede
      porę: stagione
      uważasz: trovare / ritenere
      mówi: dice
      lato: estate
      Lubię: divertente
      pływamy: nuotiamo
      zimę: inverno
      łyżwach: pattiniamo
  pl.a1.unit38.lesson05.teach.rozmowa_o_porach:
    title: La conversazione è divertente
    gloss: La conversazione sulle stagioni è divertente.
  pl.a1.unit38.lesson06.teach.tomek_czesc_wszystkim:
