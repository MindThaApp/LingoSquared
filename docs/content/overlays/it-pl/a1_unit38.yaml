  pl.a1.unit38.lesson03.teach.lubie_pora_roku:
    title: La costruzione con Lubię
    gloss: '*Lubię* + stagione indica quale stagione ti piace: *Lubię lato.* La stagione è all''accusativo: *wiosnę*, *zimę*.'
    note: '*Lubię* («mi piace») vuole l''accusativo: i nomi femminili in *-a* cambiano in *-ę* (*zima* -> *zimę*, *wiosna* -> *wiosnę*), mentre *jesień* e *lato* (nome in *-o*) restano uguali. Per dire che cosa pensi di una stagione, usa *Uważam* + accusativo + *za* + aggettivo: *Uważam jesień za ładną*.'
  pl.a1.unit38.lesson03.teach.jezdzic_na_lyzwach:
    title: Pattinare
    gloss: pattinare
    example_gloss: In inverno pattiniamo.
  pl.a1.unit38.lesson03.teach.lubie_lato:
    title: Mi piace l'estate
    gloss: Mi piace l'estate.
  pl.a1.unit38.lesson04.teach.nina_jaka_jest:
