teaching:
  pl.a1.unit03.lesson01.teach.poniedzialek:
    title: lunedì
    gloss: lunedì
    note: Il primo giorno della settimana in polacco, come nella convenzione italiana.
    example_gloss: Oggi è lunedì.
  pl.a1.unit03.lesson01.teach.wtorek:
    title: Martedì
    gloss: martedì
    note: 'Attenzione: per dire «di martedì / martedì» *wtorek* vuole la preposizione *we*, non *w*. Ne parleremo meglio più avanti in questa lezione.'
    example_gloss: Oggi è martedì.
  pl.a1.unit03.lesson01.teach.sroda:
    title: Mercoledì
    gloss: mercoledì
    note: Un sostantivo femminile, a differenza della maggior parte degli altri giorni della settimana.
    example_gloss: Oggi è mercoledì.
  pl.a1.unit03.lesson01.teach.czwartek:
    title: Giovedì
    gloss: giovedì
    note: Stesso schema maschile di *poniedziałek*, *wtorek* e *piątek*.
    example_gloss: Oggi è giovedì.
  pl.a1.unit03.lesson01.teach.piatek:
    title: Venerdì
    gloss: venerdì
    note: 'Rivedrai questo giorno più avanti nell''unità: è il giorno in cui Ewa e Marek progettano di rivedersi.'
    example_gloss: Oggi è venerdì.
  pl.a1.unit03.lesson01.teach.sobota:
    title: sabato
    gloss: sabato
    note: Fa parte del fine settimana, in polacco anche *weekend* (parola inglese presa in prestito che molti polacchi usano).
    example_gloss: Oggi è sabato.
  pl.a1.unit03.lesson01.teach.niedziela:
    title: domenica
    gloss: domenica
    note: L'ultimo dei sette giorni della settimana presentati in questa lezione.
    example_gloss: Oggi è domenica.
  pl.a1.unit03.lesson01.teach.jaki_dzien:
    title: Chiedere che giorno è
    gloss: Che giorno della settimana è oggi?
    note: 'Una domanda diretta: *dzień tygodnia* significa letteralmente «giorno della settimana».'
  pl.a1.unit03.lesson01.teach.we_wtorek_note:
    title: L'eccezione w/we
    gloss: Lunedì, giovedì, venerdì -- ma martedì (per una pronuncia più facile).
    note: 'La maggior parte dei giorni segue lo schema «*w* + [giorno]» per dire «di/il [giorno]». *Wtorek* è la vera eccezione: i polacchi dicono *we wtorek*, non *w wtorek*, solo perché è più facile da pronunciare. È un''irregolarità reale, non un errore di battitura.'
  pl.a1.unit03.lesson01.teach.w_piatek_kino:
    title: Venerdì vado al cinema
    gloss: Venerdì vado al cinema.
    note: '*Piątek* non cambia dopo *w*; cambierebbero solo *środa*, *sobota* e *niedziela* (non trattati in questa lezione per semplicità a livello A1).'
  pl.a1.unit03.lesson02.teach.styczen_luty_marzec:
    title: Gennaio, febbraio, marzo
    gloss: gennaio; febbraio; marzo
    note: '*Luty* è l''eccezione dal punto di vista grammaticale: si comporta come un aggettivo e non come un normale sostantivo (lo rivedrai nella forma «a febbraio» più avanti nell''unità).'
    example_gloss:
    - Il mio compleanno è a gennaio.
    - A febbraio vado a Varsavia.
    - Il mio compleanno è a marzo.
  pl.a1.unit03.lesson02.teach.kwiecien_maj_czerwiec:
    title: Aprile, maggio, giugno
    gloss: aprile; maggio; giugno
    note: '*Maj* è il mese che troverai in entrambe le date della storia di questa unità.'
    example_gloss:
    - Ad aprile vado a Varsavia.
    - Il mio compleanno è a maggio.
    - A giugno vado a Varsavia.
  pl.a1.unit03.lesson02.teach.lipiec_sierpien_wrzesien:
    title: Luglio, agosto, settembre
    gloss: luglio; agosto; settembre
    note: 'Ecco un''altra vera irregolarità: «a settembre» si dice *we wrześniu*, non *w wrześniu*, con lo stesso scambio *we* per facilitare la pronuncia che hai già visto con *wtorek*.'
    example_gloss:
    - A luglio sono in vacanza.
    - Ad agosto vado a Varsavia.
    - Il mio compleanno è a settembre.
  pl.a1.unit03.lesson02.teach.pazdziernik_listopad_grudzien:
    title: Ottobre, novembre, dicembre
    gloss: ottobre; novembre; dicembre
    note: Gli ultimi tre mesi dell'anno, che completano la serie dei dodici.
    example_gloss:
    - A ottobre vado a Varsavia.
    - Il mio compleanno è a novembre.
    - A dicembre sono in vacanza.
  pl.a1.unit03.lesson02.teach.urodziny:
    title: Compleanno
    gloss: compleanno
    note: '*Urodziny* in polacco è sempre plurale dal punto di vista grammaticale, anche per il compleanno di una sola persona: si usa con *są* («sono»), mai con *jest* («è»). Eserciterai proprio questo punto in un esercizio più avanti in questa lezione.'
    example_gloss: Il mio compleanno è a maggio.
  pl.a1.unit03.lesson02.teach.kiedy:
    title: Quando
    gloss: quando
    note: La parola interrogativa per chiedere di qualsiasi momento nel tempo.
    example_gloss: Quando è la riunione?
  pl.a1.unit03.lesson02.teach.kiedy_sa_twoje_urodziny:
    title: Chiedere il compleanno a qualcuno
    gloss: Quando è il tuo compleanno?
    note: '*Są*, non *jest*, per concordare con *urodziny* al plurale: lo schema segnalato nella scheda di *urodziny*.'
  pl.a1.unit03.lesson02.teach.moje_urodziny_sa_dziesiatego_maja:
    title: Dire la data del compleanno
    gloss: Il mio compleanno è il 10 maggio.
    note: '*Dziesiątego maja*: il giorno termina in *-ego* e il mese in *-a*, senza alcuna preposizione. È il modo standard in polacco di dire una data precisa; vedi la nota di grammatica più avanti in questa lezione per lo schema completo.'
  pl.a1.unit03.lesson02.teach.kiedy_jest_spotkanie:
    title: Chiedere quando è la riunione
    gloss: Quando è la riunione?
    note: '*Spotkanie* (incontro, riunione): una parola che rivedrai nel dialogo della lezione 3.'
  pl.a1.unit03.lesson02.teach.spotkanie_jest_pietnastego_maja:
    title: Dire la data della riunione
    gloss: La riunione è il 15 maggio.
    note: Stesso schema di data *-ego* + *-a* di *dziesiątego maja*, solo con un altro numero di giorno.
  pl.a1.unit03.lesson02.teach.date_pattern_note:
    title: Come si dice la data in polacco
    gloss: 'Una data: il giorno termina in -ego, il mese in -a (ma febbraio è lutego), senza preposizione -- 10 maggio, 15 maggio.'
    note: 'Confrontalo con «venerdì» (*w piątek*, che richiede la preposizione *w*): per indicare una data precisa del calendario si fa diversamente e non si usa mai alcuna preposizione.'
  pl.a1.unit03.lesson03.teach.kiedy_mozemy_sie_spotkac:
    title: Proporre di rivedersi
    gloss: Quando possiamo rivederci?
    note: '*Znowu* significa «di nuovo»: un modo naturale per iniziare a parlare di un altro incontro.'
  pl.a1.unit03.lesson03.teach.czy_piatek_panu:
    title: Chiedere a un uomo se venerdì va bene, in modo formale
    gloss: Venerdì va bene per Lei? (a un uomo, formale)
    note: '*Panu* è il dativo di *pan*: il verbo *odpowiadać* («andare bene», «convenire») vuole sempre il complemento di termine al dativo, un po'' come in italiano diciamo «il venerdì va bene *a* me».'
  pl.a1.unit03.lesson03.teach.czy_piatek_pani:
    title: Chiedere a una donna se venerdì va bene, in modo formale
    gloss: Venerdì va bene per Lei? (a una donna, formale)
    note: 'Sostituisci *panu* con *pani* per rivolgerti a una donna in modo formale: *pani* resta uguale sia al nominativo sia al dativo, a differenza di *pan*/*panu*.'
  pl.a1.unit03.lesson03.teach.czy_piatek_ci:
    title: Chiedere a un amico se venerdì va bene, in modo informale
    gloss: Venerdì ti va bene? (informale)
    note: '*Ci* sostituisce *panu*/*pani* quando parli con un amico o un coetaneo: è il «ti» dativo informale.'
  pl.a1.unit03.lesson03.teach.piatek_mi_odpowiada:
    title: Dire che venerdì va bene
    gloss: Venerdì mi va bene.
    note: '*Mi* è il dativo di prima persona: lo stesso schema di caso di *panu*/*pani*/*ci*, ma per «mi» invece di «ti/Le».'
  pl.a1.unit03.lesson03.teach.data:
    title: Data
    gloss: data (del calendario)
    note: 'Quasi identica alla parola italiana «data»: facile da riconoscere.'
    example_gloss: Che data sarà?
  pl.a1.unit03.lesson03.teach.jaka_to_bedzie_data:
    title: Chiedere che data sarà
    gloss: Che data sarà?
    note: Un seguito naturale quando due persone si sono accordate sul giorno della settimana ma non ancora sulla data esatta.
  pl.a1.unit03.lesson03.teach.dialogue.line01:
    title: Ewa propone di rivedersi
    gloss: Ewa chiede a Marek quando possono rivedersi.
    note: Riprende esattamente la domanda con cui si apre la lezione.
  pl.a1.unit03.lesson03.teach.dialogue.line02:
    title: Marek propone venerdì, in modo formale
    gloss: Marek chiede a Ewa, in modo formale, se venerdì le va bene.
    note: Si rivolge a Ewa con *pani*, mantenendo il registro formale usato fin dalla prima unità.
  pl.a1.unit03.lesson03.teach.dialogue.line03:
    title: Ewa accetta e chiede la data
    gloss: Ewa dice che venerdì le va bene, poi chiede quale sarà la data esatta.
    note: '*Tak* («sì»), incontrato nell''unità 1, apre la risposta di Ewa prima che chieda la data esatta.'
  pl.a1.unit03.lesson03.teach.dialogue.line04:
    title: Marek dice la data
    gloss: Marek dice il 15 maggio.
    note: Entrambe le parole sono già state insegnate nella lezione 2 di questa unità.
  pl.a1.unit03.lesson03.teach.dialogue.line05:
    title: Ewa conferma e saluta
    gloss: Ewa dice che è perfetto e che ci vediamo il 15 maggio.
    note: '*Do zobaczenia* riprende il saluto della prima unità, ora unito a una data precisa.'
  pl.a1.unit03.lesson03.teach.dialogue.line06:
    title: Marek chiude la conversazione
    gloss: Marek ricambia il saluto.
    note: 'La chiusura più breve possibile: solo il saluto.'
