answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Polacco A1
  description: 'Polacco di base per parlare delle attività del tempo libero: lessico degli hobby, espressioni di frequenza, come chiedere e dire che cosa si fa nel tempo libero e come confrontare gli hobby di due persone.'
units:
  pl.a1.unit24.hobby:
    title: Hobby e tempo libero
lessons:
  pl.a1.unit24.lesson01.czytanie_sport_i_gotowanie:
    title: Leggere, fare sport e cucinare
  pl.a1.unit24.lesson02.muzyka_rysowanie_i_gry:
    title: Musica, disegno e videogiochi
  pl.a1.unit24.lesson03.co_robisz_w_wolnym:
    title: Che cosa fai nel tempo libero?
  pl.a1.unit24.lesson04.ewa_i_marek_rozmawiaja:
    title: Ewa e Marek parlano degli hobby
  pl.a1.unit24.lesson05.marek_i_ewa_porownuja:
    title: Marek ed Ewa confrontano i loro hobby
  pl.a1.unit24.lesson06.wspolne_planowanie_weekendu:
    title: Programmare un fine settimana insieme
teaching:
  pl.a1.unit24.lesson01.teach.czytac_uprawiac_sport:
    title: Leggere, fare sport, cucinare
    gloss: leggere, fare sport, cucinare
    note: 'Tre verbi comuni per gli hobby: *czytać* (leggere), *uprawiać sport* (fare sport) e *gotować* (cucinare).'
    example_gloss:
    - Mi piace leggere un libro.
    - Faccio sport il sabato.
    - Mi piace cucinare per gli amici.
  pl.a1.unit24.lesson01.teach.wolny_czas:
    title: Tempo libero
    gloss: tempo libero
    note: '*Wolny czas* è l''espressione chiave per parlare degli hobby. L''aggettivo *wolny* (libero) concorda con il sostantivo maschile *czas*; in *w wolnym czasie* entrambi sono al locativo.'
    example_gloss: Nel mio tempo libero mi piace leggere.
  pl.a1.unit24.lesson01.teach.w_wolnym_czasie:
    title: Dire che cosa fai nel tempo libero
    gloss: Nel mio tempo libero mi piace leggere.
    note: '*Lubię* (mi piace) è seguito dall''infinito: *lubię czytać*. *W wolnym czasie* usa *w* + locativo.'
  pl.a1.unit24.lesson02.teach.sluchac_muzyki_rysowac:
    title: Musica, disegno, videogiochi
    gloss: ascoltare musica, disegnare, giocare ai videogiochi
    note: 'Altri tre hobby: *słuchać muzyki* (ascoltare musica), *rysować* (disegnare) e *grać w gry* (giocare ai videogiochi).'
    example_gloss:
    - Mi piace ascoltare musica.
    - Disegno spesso.
    - Mi piace giocare ai videogiochi con gli amici.
  pl.a1.unit24.lesson02.teach.lubie_sluchac_muzyki:
    title: Dire che ti piace ascoltare musica
    gloss: Mi piace ascoltare musica.
    note: '*Słuchać* vuole sempre il genitivo: *słucham muzyki*, non *muzyka*.'
  pl.a1.unit24.lesson02.teach.lubie_grac_w:
    title: Dire che ti piace giocare ai videogiochi con gli amici
    gloss: Mi piace giocare ai videogiochi con gli amici.
    note: '*Z przyjaciółmi* (con gli amici) usa *z* + strumentale plurale.'
  pl.a1.unit24.lesson03.teach.zawsze_czesto_czasami:
    title: Sempre, spesso, a volte, mai
    gloss: sempre, spesso, a volte, mai
    note: 'I quattro avverbi di frequenza fondamentali: *zawsze*, *często*, *czasami*, *nigdy*. Non cambiano mai forma, e *nigdy* richiede *nie* davanti al verbo: *Nigdy nie gram.*'
    example_gloss:
    - Faccio sempre sport il sabato.
    - Leggo spesso un libro.
    - A volte disegno.
    - Non gioco mai ai videogiochi.
  pl.a1.unit24.lesson03.teach.co_tydzien_co:
    title: Ogni settimana, ogni fine settimana
    gloss: ogni settimana, ogni fine settimana
    note: '*Co tydzień* e *co weekend* significano entrambi «ogni ...»; *co* è seguito dall''accusativo e non cambia mai: vedi la scheda successiva.'
    example_gloss:
    - Cucino per gli amici ogni settimana.
    - Faccio sport ogni fine settimana.
  pl.a1.unit24.lesson03.teach.co_biernik_co:
    title: Co + accusativo
    gloss: '*Co* + accusativo significa «ogni»: ogni settimana, ogni fine settimana, ogni mese.'
    note: '*Co* è una parola fissa per «ogni», qualunque sia il sostantivo. I sostantivi maschili inanimati come *tydzień*, *weekend* e *miesiąc* hanno la stessa forma al nominativo e all''accusativo.'
  pl.a1.unit24.lesson03.teach.co_robisz_w:
    title: Chiedere del tempo libero
    gloss: Che cosa fai nel tempo libero?
    note: 'Questa è la domanda chiave dell''unità: usala per chiedere a chiunque dei suoi hobby.'
  pl.a1.unit24.lesson04.teach.ewa_czesto_razem:
    title: Ewa introduce il tema degli hobby
    gloss: 'Ewa: Passeggiamo spesso insieme. Ma che altro fai nel tempo libero, Marek?'
    note: '*Spacerujemy* è la forma di *my* (noi) di *spacerować*; *Marku* è il vocativo, usato quando ci si rivolge direttamente a qualcuno.'
  pl.a1.unit24.lesson04.teach.marek_lubie_gotowac:
    title: Gli hobby di Marek
    gloss: 'Marek: Mi piace cucinare, anche a casa. E faccio sport spesso.'
    note: '*Także w domu* (anche a casa) mostra che Marek cucina per piacere, non solo per il suo lavoro al ristorante; *w domu* è il locativo.'
  pl.a1.unit24.lesson04.teach.ewa_gotujesz_tez:
    title: Ewa è sorpresa
    gloss: 'Ewa: Cucini anche a casa? Ma se cucini già tutto il giorno al lavoro!'
    note: '*Cały dzień* (tutto il giorno) sottolinea quanto Marek cucini già al lavoro; *przecież* aggiunge un «ma se» / «ma scusa».'
  pl.a1.unit24.lesson04.teach.marek_tak_ale:
    title: Marek spiega
    gloss: 'Marek: Sì, ma cucinare mi rilassa. E tu, che cosa ti piace fare?'
    note: '*Gotowanie mnie odpręża* significa letteralmente «cucinare mi rilassa»: il polacco spesso fa dell''attività il soggetto e mette *mnie* (mi) all''accusativo.'
  pl.a1.unit24.lesson04.teach.ewa_lubie_czytac:
    title: Gli hobby di Ewa
    gloss: 'Ewa: Mi piace leggere e ascolto spesso musica.'
    note: Unisce in una sola frase, con *i* (e), due verbi di hobby delle lezioni 1 e 2.
  pl.a1.unit24.lesson04.teach.marek_grasz_tez:
    title: Marek chiede dei videogiochi
    gloss: 'Marek: Giochi anche ai videogiochi?'
    note: Una breve domanda sì/no con *grać w gry* della lezione 2; *też* significa «anche».
  pl.a1.unit24.lesson04.teach.ewa_nie_nigdy:
    title: Ewa risponde
    gloss: 'Ewa: No, non gioco mai ai videogiochi. Ma ogni tanto disegno!'
    note: '*Nigdy* (mai) e *czasami* (ogni tanto) dalla lezione 3, messi a confronto in una sola risposta. Nota la doppia negazione: *nigdy nie gram*.'
  pl.a1.unit24.lesson05.teach.marek_i_ja:
    title: Confronto tra hobby
    gloss: Marek e io passeggiamo spesso insieme. Ma abbiamo anche altri hobby. A Marek piace cucinare, anche a casa, e fa sport spesso. A me piace leggere e ascolto spesso musica. Ogni tanto disegno, ma non gioco mai ai videogiochi. E a te, che cosa piace fare nel tempo libero?
    note: Il messaggio di Ewa riprende le informazioni della lezione 4 e finisce ponendo al lettore la domanda centrale dell'unità.
    glosses:
      spacerujemy: passeggiamo
      często: spesso
      razem: insieme
      inne: altri
      gotować: cucina
      lubi: piace
      domu: a casa
      uprawia: fa sport
      czytać: leggere
      słucham: ascolto
      muzyki: musica
      rysuję: disegno
      czasami: a volte
      gram: gioco ai videogiochi
      nigdy: mai
      wolnym: libero
      czasie: tempo
  pl.a1.unit24.lesson06.teach.marek_co_robisz:
    title: Marek chiede del fine settimana
    gloss: 'Marek: Che cosa fai questo fine settimana?'
    note: '*W ten weekend* (questo fine settimana) usa *w* + accusativo per un''espressione di tempo.'
  pl.a1.unit24.lesson06.teach.ewa_jeszcze_nie:
    title: Ewa è indecisa
    gloss: 'Ewa: Non lo so ancora. Mi piace leggere, ma voglio anche uscire all''aria aperta.'
    note: '*Wyjść na dwór* (uscire all''aperto) è un modo comune per dire che si vuole uscire di casa; *chcę* + infinito significa «voglio».'
  pl.a1.unit24.lesson06.teach.marek_pojdziemy_razem:
    title: Marek propone un programma
    gloss: 'Marek: Andiamo a fare una passeggiata insieme? Poi cucino qualcosa per noi.'
    note: '*Potem* (poi) è la parola che indica la sequenza; *ugotuję* è perfettivo perché la cucina è un risultato compiuto.'
  pl.a1.unit24.lesson06.teach.ewa_dobry_pomysl:
    title: Ewa accetta
    gloss: 'Ewa: Bella idea! Mi piace sia passeggiare sia cucinare.'
    note: '*Lubię i ..., i ...* («sia ... sia ...») mostra che a Ewa piacciono due cose allo stesso modo, senza preferirne una.'
  pl.a1.unit24.lesson06.teach.marek_swietnie_to:
    title: Marek conferma
    gloss: 'Marek: Perfetto. Allora ci vediamo sabato!'
    note: Una battuta finale amichevole che conferma il programma per sabato; *w sobotę* è *w* + accusativo per un giorno della settimana.
