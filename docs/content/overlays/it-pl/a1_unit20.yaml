teaching:
  pl.a1.unit20.lesson01.teach.recap_jest_sa_to_poprosze:
    title: 'C''è, ci sono, questo, vorrei: ancora'
    gloss: 'Jest, są, To, Poproszę, Ile, kosztuje, złotych, chcę, do: conosci già queste parole dalle lezioni precedenti.'
    note: Un breve ripasso prima che la lezione le usi per parlare di acquisti di vestiti.
  pl.a1.unit20.lesson01.teach.sklep:
    title: Negozio
    gloss: negozio
    note: La parola generica per indicare un negozio.
    example_gloss: Vado al negozio.
  pl.a1.unit20.lesson01.teach.koszula:
    title: Camicia
    gloss: camicia
    note: 'Un sostantivo femminile: richiede le forme femminili dell''aggettivo.'
    example_gloss: Questa è una camicia.
  pl.a1.unit20.lesson01.teach.spodnie:
    title: Pantaloni
    gloss: pantaloni
    note: 'In polacco è sempre plurale, anche per un solo paio: non esiste il singolare.'
    example_gloss: Questi sono dei pantaloni.
  pl.a1.unit20.lesson01.teach.kupic:
    title: Comprare
    gloss: comprare
    note: 'Si usa dopo «*chcę*» (voglio), proprio come «*iść*» (andare) in una lezione precedente: «*chcę kupić*» significa «voglio comprare».'
    example_gloss: Voglio comprare una camicia.
  pl.a1.unit20.lesson01.teach.chce_kupic_spodnie_phrase:
    title: Voglio comprare dei pantaloni
    gloss: Voglio comprare dei pantaloni.
    note: Lo stesso schema chcę + infinito, applicato ai pantaloni.
  pl.a1.unit20.lesson01.teach.ile_kosztuje_koszula_phrase:
    title: Quanto costa la camicia?
    gloss: Quanto costa la camicia?
    note: Un modo naturale per chiedere il prezzo di un articolo preciso, riprendendo «*Ile kosztuje*» dalla lezione sugli acquisti.
  pl.a1.unit20.lesson02.teach.jaki_note:
    title: 'Che tipo di: forma maschile'
    gloss: 'Jaki, Jaka: «*Jaki*» si usa con i sostantivi maschili, «*Jaka*» con i femminili (conosci già «*Jaka*» dalla lezione sul tempo).'
    note: «*Kolor*» (colore) è maschile, quindi va con «*Jaki*», non con «*Jaka*».
  pl.a1.unit20.lesson02.teach.kolor:
    title: Colore
    gloss: colore
    note: Un sostantivo maschile.
    example_gloss: Di che colore?
  pl.a1.unit20.lesson02.teach.sukienka:
    title: Vestito
    gloss: vestito
    note: Un altro sostantivo femminile, come «*koszula*».
    example_gloss: Questo è un vestito.
  pl.a1.unit20.lesson02.teach.niebieska_note:
    title: Blu
    gloss: Koszula jest niebieska. «*niebieska*» concorda con i sostantivi femminili, come «*koszula*».
    note: 'Solo questa forma: finora nel corso è legata a «*koszula*».'
  pl.a1.unit20.lesson02.teach.czerwona_note:
    title: Rosso
    gloss: Sukienka jest czerwona. «*czerwona*» concorda anch'essa con i sostantivi femminili, proprio come «*niebieska*».
    note: Qui questa forma è legata a «*sukienka*», così come «*niebieska*» è legata a «*koszula*».
  pl.a1.unit20.lesson02.teach.koszula_niebieska_phrase:
    title: La camicia è blu
    gloss: La camicia è blu.
    note: Un'informazione che l'unità riprenderà più avanti, quando Marek cercherà una camicia.
  pl.a1.unit20.lesson02.teach.sukienka_czerwona_phrase:
    title: Il vestito è rosso
    gloss: Il vestito è rosso.
    note: Lo stesso schema jest + colore, per un altro capo.
  pl.a1.unit20.lesson03.teach.recap_words:
    title: 'Buongiorno, per favore, molto: ancora'
    gloss: 'Dzień, dobry, Proszę, bardzo, i, Dobrze, Co: conosci già queste parole dalle lezioni precedenti.'
    note: Un breve ripasso prima del dialogo in negozio di questa lezione.
  pl.a1.unit20.lesson03.teach.rozmiar:
    title: Taglia
    gloss: taglia
    note: In Polonia le taglie dei vestiti sono spesso semplicemente le lettere S, M e L, come in Italia.
    example_gloss: Che taglia?
  pl.a1.unit20.lesson03.teach.pan_chce_note:
    title: Signore, vuole
    gloss: Co pan chce kupić? «*pan*» è il modo cortese per rivolgersi a un uomo, come «*pani*» per una donna (conosci già «*pani*» dalla lezione sugli acquisti).
    note: '«*chce*» è la forma di terza persona singolare di «*chcieć*»: conosci già «*chcę*» (voglio) e «*chcesz*» (vuoi).'
  pl.a1.unit20.lesson03.teach.co_pan_chce_kupic_phrase:
    title: Che cosa desidera comprare, signore?
    gloss: Che cosa desidera comprare, signore?
    note: Il modo in cui un commesso inizia con cortesia la conversazione con un cliente uomo.
  pl.a1.unit20.lesson03.teach.dialogue.line01:
    title: Il commesso saluta Marek
    gloss: Buongiorno! Che cosa desidera comprare, signore?
    note: Sprzedawca (il commesso) esordisce con lo stesso registro cortese usato dal negoziante del mercato nell'unità sugli acquisti.
  pl.a1.unit20.lesson03.teach.dialogue.line02:
    title: Marek dice che cosa vuole
    gloss: Voglio comprare una camicia e dei pantaloni.
    note: Marek indica i due capi che cerca.
  pl.a1.unit20.lesson03.teach.dialogue.line03:
    title: Il commesso chiede la taglia
    gloss: Che taglia?
    note: Una breve domanda di seguito, del tutto naturale.
  pl.a1.unit20.lesson03.teach.dialogue.line04:
    title: Marek dice la sua taglia
    gloss: Taglia M.
    note: Marek risponde solo con la lettera della taglia, com'è naturale.
  pl.a1.unit20.lesson03.teach.dialogue.line05:
    title: Il commesso conferma la disponibilità e il prezzo
    gloss: Abbiamo una camicia blu e dei pantaloni. In totale sono cento zloty.
    note: «*Mamy*» significa «abbiamo» (come «*mam*»/«*masz*»). Dopo di esso «*koszula*» diventa «*koszulę*» e «*niebieska*» diventa «*niebieską*», lo stesso cambiamento visto in «*Chcę kupić koszulę*». Il colore corrisponde alla camicia blu della Lezione 2.
  pl.a1.unit20.lesson03.teach.dialogue.line06:
    title: Marek accetta
    gloss: Va bene, la prendo.
    note: Marek conferma l'acquisto e chiude lo scambio.
