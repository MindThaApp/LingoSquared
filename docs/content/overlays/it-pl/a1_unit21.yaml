teaching:
  pl.a1.unit21.lesson01.teach.szczesliwy_smutny_zly:
    title: Felice, triste e arrabbiato
    gloss: contento, triste, arrabbiato
    note: Tre parole di base per i sentimenti, usate con *jestem* (sono). Sono forme maschili; una donna dice *szczęśliwa, smutna, zła*.
    example_gloss:
    - Sono contento.
    - Sono triste.
    - Sono arrabbiato.
  pl.a1.unit21.lesson01.teach.jestem_szczesliwy:
    title: Dire che si è contenti
    gloss: Sono contento.
    note: '*Jestem* (sono, da *być*) + aggettivo è lo schema di base, come in italiano «sono ...». L''aggettivo concorda con chi parla: *szczęśliwy* (uomo), *szczęśliwa* (donna).'
  pl.a1.unit21.lesson01.teach.nie_jestem_zly:
    title: Contrapporre le emozioni
    gloss: Non sono arrabbiato, sono triste.
    note: '*Nie* va subito prima del verbo: *Nie jestem zły*. La seconda frase indica poi il sentimento reale.'
  pl.a1.unit21.lesson02.teach.dlaczego_jestes_szczesliwy:
    title: Chiedere perché
    gloss: Perché sei contento?
    note: '*Dlaczego* (perché) è la parola interrogativa standard per chiedere un motivo.'
  pl.a1.unit21.lesson02.teach.jestem_szczesliwy_bo:
    title: Dare un motivo
    gloss: Sono contento perché ho un nuovo appartamento.
    note: '*Bo* (perché, poiché) introduce il motivo; dopo *mam* (ho) il sostantivo è all''accusativo: *nowe mieszkanie*.'
  pl.a1.unit21.lesson02.teach.jestem_smutny_bo:
    title: Un motivo negativo
    gloss: Sono triste perché piove.
    note: '*Pada deszcz* (piove, letteralmente «la pioggia cade») è l''espressione abituale per il tempo, qui usata come motivo.'
  pl.a1.unit21.lesson03.teach.zdenerwowany:
    title: Nervoso
    gloss: nervoso
    note: La parola standard per indicare il nervosismo.
    example_gloss: Sono agitato per il mio primo turno.
  pl.a1.unit21.lesson03.teach.jestem_zdenerwowany_przed:
    title: Dire per che cosa si è agitati
    gloss: Sono agitato per il mio primo turno.
    note: '*Przed* (letteralmente «davanti a, prima di») + strumentale indica la causa del nervosismo, dove in italiano si dice «per»: *przed pierwszą zmianą*.'
  pl.a1.unit21.lesson03.teach.nie_martw_sie:
    title: Rassicurare qualcuno
    gloss: Non ti preoccupare.
    note: '*Nie martw się* (letteralmente «non preoccuparti») è la formula abituale per rassicurare; *się* è il pronome riflessivo.'
  pl.a1.unit21.lesson04.teach.jak_czuje_sie:
    title: Chiedere come si sente qualcuno
    gloss: Come si sente Marek?
    note: '*Czuć się* (sentirsi, riflessivo) è il modo standard per chiedere o descrivere uno stato d''animo: *Jak czuje się Marek?*'
  pl.a1.unit21.lesson04.teach.on_czuje_sie:
    title: Descrivere come si sente qualcuno
    gloss: Si sente agitato.
    note: '*Się* resta con il verbo: *on czuje się*. L''aggettivo è maschile e concorda con *on*: *zdenerwowany*.'
  pl.a1.unit21.lesson04.teach.dlaczego_on_czuje:
    title: Chiedere perché qualcuno si sente in un certo modo
    gloss: Perché si sente agitato?
    note: Unisce *dlaczego* (perché) allo schema *czuje się* di *On czuje się zdenerwowany*.
  pl.a1.unit21.lesson05.teach.czesc_ewo_jestem:
    title: Leggi un messaggio sulle emozioni
    gloss: Ciao Ewa, sono un po' nervoso per il mio primo turno da solo. Ma sono anche felice, perché ho un nuovo lavoro e un nuovo appartamento. Penso che andrà bene.
    note: Cerca di capire per che cosa è agitato chi scrive, che cosa lo rende contento e come vede la situazione nel complesso.
    glosses:
      trochę: un po'
      zdenerwowany: nervoso
      pierwszą: primo
      zmianą: turno
      samodzielną: da solo
      szczęśliwy: contento
      bo: perché
      nową: nuovo
      pracę: lavoro
      nowe: nuovo
      mieszkanie: appartamento
      myślę: pensare
      będzie: 'andare (qui: andrà bene)'
  pl.a1.unit21.lesson06.teach.ewa_czesc_marku:
    title: Ewa chiede a Marek come si sente
    gloss: 'Ewa: Ciao Marek, come ti senti per il tuo primo turno?'
    note: '*Przed pierwszą zmianą* (per il tuo primo turno) riprende lo schema *przed* + strumentale della lezione 3. *Czujesz się* è la forma di *ty*.'
  pl.a1.unit21.lesson06.teach.marek_szczerze_mowiac:
    title: Marek ammette di essere nervoso
    gloss: 'Marek: A dire il vero, sono un po'' nervoso.'
    note: '*Szczerze mówiąc* (a dire il vero, letteralmente «parlando sinceramente») attenua l''ammissione.'
  pl.a1.unit21.lesson06.teach.ewa_nie_martw:
    title: Ewa lo rassicura
    gloss: 'Ewa: Non preoccuparti, te la caverai bene!'
    note: '*Dobrze sobie poradzisz* (letteralmente «te la caverai bene») è un''espressione fissa di incoraggiamento; *poradzisz* è il futuro di *ty* di *poradzić sobie*.'
  pl.a1.unit21.lesson06.teach.marek_dzieki_to:
    title: Marek la ringrazia
    gloss: 'Marek: Grazie, mi aiuta davvero.'
    note: '*Pomaga* è la forma di *on/ona/ono* di *pomagać* (aiutare); *dzięki* è il «grazie» informale.'
  pl.a1.unit21.lesson06.teach.ewa_a_potem:
    title: Ewa prevede come andrà
    gloss: 'Ewa: E poi sarai sicuramente molto felice e orgoglioso.'
    note: '*Na pewno* (sicuramente) esprime una previsione sicura; *dumny* (orgoglioso) è un aggettivo nuovo e utile. *Będziesz* è il futuro di *być*.'
  pl.a1.unit21.lesson06.teach.marek_tak_ja:
    title: Marek è d'accordo
    gloss: 'Marek: Sì, lo penso anch''io.'
    note: '*Ja też tak myślę* (letteralmente «io anche così penso») è il modo naturale per essere d''accordo; qui *ja* è aggiunto per dare enfasi.'
  pl.a1.unit21.lesson06.teach.marek_jest_zdenerwowany:
    title: Riassumere con jest e mu
    gloss: Marek è nervoso per il suo primo turno. Ewa lo aiuta.
    note: '*Jest* è la forma di *on/ona* di *być* (essere); *mu* significa «gli, lo» (dativo, perché *pomagać* vuole il dativo). Sono parole piccole, ma essenziali per parlare di un''altra persona.'
