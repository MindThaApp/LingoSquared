teaching:
  pl.a1.unit10.lesson01.teach.wstawac_wstaje:
    title: Alzarsi, mi alzo
    gloss: alzarsi; mi alzo
    note: Wstawać è l'infinito; wstaję è la forma della prima persona di uso quotidiano, quella che userai per parlare della tua routine.
    example_gloss: Mi alzo alle sette del mattino.
  pl.a1.unit10.lesson01.teach.jesc_jem:
    title: Mangiare, mangio
    gloss: mangiare; mangio
    note: 'Jeść è un po'' irregolare, ma jem («mangio») è la forma che userai più spesso: è così che un polacco dice «mangio» per qualsiasi pasto.'
    example_gloss: La mattina faccio colazione.
  pl.a1.unit10.lesson01.teach.sniadanie:
    title: La colazione
    gloss: colazione
    note: 'Śniadanie non cambia forma dopo jem: «faccio colazione» è semplicemente jem śniadanie, senza nessuna desinenza in più da imparare.'
    example_gloss: La mattina faccio colazione.
  pl.a1.unit10.lesson01.teach.pic_pije:
    title: Bere, bevo
    gloss: bere; bevo
    note: Pić è l'infinito; piję è la forma della prima persona, usata come jem e wstaję.
    example_gloss: La mattina bevo il caffè.
  pl.a1.unit10.lesson01.teach.pierwsza_osoba_note:
    title: Parlare di sé
    gloss: Wstaję, jem, piję -- in questa unità parliamo solo di noi stessi, alla prima persona (io), come quando descrivi la tua giornata.
    note: Questa intera unità usa di proposito solo la forma «io» di ogni verbo -- *wstaję* (mi alzo), *jem* (mangio), *piję* (bevo) -- così puoi concentrarti sulla descrizione della tua routine, senza dover imparare nello stesso tempo come ogni verbo cambia per «tu», «lui» o «lei».
  pl.a1.unit10.lesson01.teach.o_siodmej_rano:
    title: Mi alzo alle sette del mattino
    gloss: Mi alzo alle sette del mattino.
    note: 'Lo schema della nota di grammatica in azione: o + il locativo dell''ora (siódmej) significa «a» quell''ora, come nell''unità sull''ora.'
  pl.a1.unit10.lesson01.teach.sniadanie_kawa:
    title: Faccio colazione e bevo il caffè
    gloss: Faccio colazione e bevo il caffè.
    note: 'Due verbi alla prima persona uniti da i (e): un modo naturale per elencare le tue attività del mattino.'
  pl.a1.unit10.lesson02.teach.obiad:
    title: Il pranzo
    gloss: pranzo / pasto di mezzogiorno
    note: 'Come śniadanie, obiad non cambia forma dopo jem: jem obiad significa semplicemente «pranzo».'
    example_gloss: Pranzo a mezzogiorno.
  pl.a1.unit10.lesson02.teach.pracowac_pracuje:
    title: Lavorare, lavoro
    gloss: lavorare; lavoro
    note: Pracować segue lo stesso schema -ować -> -uję di kosztować -> kosztuje dell'unità sugli acquisti, questa volta alla prima persona.
    example_gloss: Lavoro il pomeriggio.
  pl.a1.unit10.lesson02.teach.dom:
    title: La casa
    gloss: casa
    note: 'La parola di uso quotidiano per «casa»: ricorre di continuo nell''espressione «andare/tornare a casa».'
    example_gloss: La casa è lì.
  pl.a1.unit10.lesson02.teach.do_domu_note:
    title: A casa
    gloss: 'A casa -- do richiede il genitivo, e il genitivo di dom termina in -u: domu, esattamente come bank -> banku, park -> parku, hotel -> hotelu.'
    note: '*Do domu* («a casa», come in «vado a casa») riprende la stessa desinenza di genitivo *-u* che hai già imparato dopo *do* con bank, hotel e park: un altro nome che segue lo stesso schema.'
  pl.a1.unit10.lesson02.teach.wracac_wracam:
    title: Tornare, torno
    gloss: tornare / rientrare; torno / rientro
    note: 'Usato con do domu per dire «vado a casa» o «torno a casa»: una delle espressioni quotidiane più comuni in polacco.'
    example_gloss: La sera torno a casa.
  pl.a1.unit10.lesson02.teach.pory_dnia:
    title: A mezzogiorno, nel pomeriggio, la sera
    gloss: a mezzogiorno; nel pomeriggio; la sera
    note: 'Ripasso dell''unità precedente sull''orario: insieme a rano e w nocy, queste espressioni coprono l''intera giornata.'
    example_gloss:
    - Pranzo a mezzogiorno.
    - Lavoro il pomeriggio.
    - La sera torno a casa.
  pl.a1.unit10.lesson02.teach.praca_dom_phrase:
    title: Lavoro nel pomeriggio, poi torno a casa
    gloss: Lavoro nel pomeriggio, poi torno a casa.
    note: Lo stesso schema con virgola + potem visto nell'unità sulle indicazioni stradali, ora usato per collegare due momenti della giornata.
  pl.a1.unit10.lesson03.teach.spac_spie:
    title: Dormire, dormo
    gloss: dormire; dormo
    note: Śpię presenta un cambio di vocale che sembra irregolare rispetto all'infinito spać, ma è un verbo molto comune e frequente, da memorizzare così com'è.
    example_gloss: Di notte dormo.
  pl.a1.unit10.lesson03.teach.a_ty_ja_tez:
    title: E tu? Anch'io.
    gloss: E tu? / Anch'io.
    note: A ty? è il modo più semplice per ridare la parola all'altra persona; ja też significa «anch'io». Due espressioni che ricorrono di continuo nelle chiacchiere di tutti i giorni.
    example_gloss: Anch'io faccio colazione la mattina.
  pl.a1.unit10.lesson03.teach.ale_nie_herbata:
    title: Ma, tè, non
    gloss: ma; tè (complemento oggetto); non
    note: 'Ale introduce un contrasto; nie messo subito prima di una parola (e non prima di un verbo) significa «non [quella cosa]»: piję herbatę, nie kawę vuol dire «bevo tè, non caffè».'
    example_gloss: Bevo tè, ma non caffè.
  pl.a1.unit10.lesson03.teach.dziesiatej_wczesnie_note:
    title: Presto, alle dieci
    gloss: presto; alle dieci -- la stessa desinenza -ej nelle ore dopo 'o', come czwartej, siódmej della lezione precedente.
    note: '*O dziesiątej* («alle dieci») riprende lo stesso schema delle ore che hai già imparato: *dziesiąta* diventa *dziesiątej* dopo *o*, proprio come *czwarta* -> *czwartej* e *siódma* -> *siódmej*.'
  pl.a1.unit10.lesson03.teach.dialogue.line01:
    title: Ewa racconta la sua mattina
    gloss: Ewa dice che si alza alle sette del mattino e beve il caffè.
    note: Riprende la prima frase modello dell'unità, ora inserita in una vera conversazione.
  pl.a1.unit10.lesson03.teach.dialogue.line02:
    title: Ewa continua a raccontare la sua giornata
    gloss: Ewa dice che fa colazione, poi lavora nel pomeriggio.
    note: Collega due attività alla prima persona con potem, lo stesso schema della lezione 2.
  pl.a1.unit10.lesson03.teach.dialogue.line03:
    title: Ewa finisce e chiede a Marek
    gloss: Ewa dice che la sera torna a casa. E tu?
    note: A ty? passa la parola a Marek senza bisogno di nuova grammatica per le domande.
  pl.a1.unit10.lesson03.teach.dialogue.line04:
    title: Marek racconta la sua mattina
    gloss: Marek dice che anche lui si alza alle sette! Ma beve tè, non caffè.
    note: Ja też conferma un dettaglio in comune (l'ora della sveglia) prima del contrasto con ale...nie per la bevanda.
  pl.a1.unit10.lesson03.teach.dialogue.line05:
    title: Marek descrive la sua giornata
    gloss: Marek dice che lavora la mattina, poi pranza a mezzogiorno.
    note: 'Un ordine diverso da quello di Ewa: prima il lavoro, poi il pasto di mezzogiorno.'
  pl.a1.unit10.lesson03.teach.dialogue.line06:
    title: Marek parla del sonno
    gloss: Marek dice che dorme presto, alle dieci di sera.
    note: Chiude la conversazione con il nuovo verbo spać/śpię e con lo schema delle ore ripreso in questa lezione.
