teaching:
  pl.a1.unit16.lesson01.teach.boli_note:
    title: Fa male
    gloss: 'Boleć (far male), presente: boli (lui/lei/esso) e bolą (loro). Głowa mnie boli significa «mi fa male la testa», letteralmente «la testa mi fa male».'
    note: 'Per dolori e malanni il presente di *boleć* si usa solo in queste due forme: la parte del corpo è il soggetto e *mnie* indica a chi appartiene, quindi qui non c''è una forma «io faccio male» da imparare.'
  pl.a1.unit16.lesson01.teach.glowa:
    title: Testa
    gloss: testa
    note: È la cosa che si dice più spesso quando si ha dolore.
    example_gloss: Mi fa male la testa.
  pl.a1.unit16.lesson01.teach.gardlo:
    title: Gola
    gloss: gola
    note: Utile per descrivere un raffreddore o il mal di gola.
    example_gloss: Mi fa male la gola.
  pl.a1.unit16.lesson01.teach.brzuch:
    title: Stomaco
    gloss: pancia
    note: Utile dopo un pasto abbondante o quando qualcosa non ti va giù.
    example_gloss: Mi fa male la pancia.
  pl.a1.unit16.lesson01.teach.zeby:
    title: Denti
    gloss: denti
    note: 'Qui si usa sempre al plurale, proprio come direbbe un madrelingua polacco: per questo con questa parola si usa *bolą* (e non *boli*).'
    example_gloss: Mi fanno male i denti.
  pl.a1.unit16.lesson01.teach.co_cie_boli:
    title: Cosa Le fa male?
    gloss: Che cosa ti fa male?
    note: È la domanda naturale da rivolgere a qualcuno che non si sente bene.
  pl.a1.unit16.lesson02.teach.czuc_sie_note:
    title: Come ti senti?
    gloss: 'Czuć się (sentirsi): czuję się (io), czujesz się (tu). Come ti senti?'
    note: 'Per ora solo due forme: *czuję* per parlare di sé, *czujesz* per chiedere a un''altra persona.'
  pl.a1.unit16.lesson02.teach.dobrze_zle_contrast:
    title: Bene e male
    gloss: Mi sento bene. Mi sento male. -- dobrze lo conosci già, źle è il suo contrario.
    note: Lo stesso *dobrze* che usi fin dalla prima lezione, ora accanto al suo contrario.
  pl.a1.unit16.lesson02.teach.zle:
    title: Male
    gloss: male
    note: La parola che ti serve per dire che non ti senti bene.
    example_gloss: Mi sento male.
  pl.a1.unit16.lesson02.teach.goraczka:
    title: Febbre
    gloss: febbre
    note: Un sintomo comune e basilare da saper nominare.
    example_gloss: Ho la febbre.
  pl.a1.unit16.lesson02.teach.ewa_ma_recap:
    title: Ewa, ha -- di nuovo
    gloss: Ewa, ma -- conosci già questo nome e questa forma del verbo mieć (avere) dalle lezioni precedenti (Mam, masz, ma).
    note: Un breve ripasso prima di una lezione che usa entrambi.
  pl.a1.unit16.lesson02.teach.chory_chora:
    title: Malato
    gloss: malato / malata
    note: 'Lo stesso schema -y/-a che hai già visto con *młodszy/starsza*: *chory* per un uomo, *chora* per una donna.'
    example_gloss:
    - Lui è malato.
    - Lei è malata.
  pl.a1.unit16.lesson02.teach.ewa_line_preview:
    title: Ewa non si sente bene
    gloss: Mi sento male. Ho la febbre.
    note: 'Ewa descrive i suoi sintomi: le stesse parole che dirà di nuovo nel dialogo di questa unità.'
  pl.a1.unit16.lesson03.teach.marek_recap:
    title: Marek, di nuovo
    gloss: Marek -- conosci già questo nome dalle lezioni precedenti.
    note: Un breve ripasso prima del dialogo di questa lezione.
  pl.a1.unit16.lesson03.teach.i_recap:
    title: E, di nuovo
    gloss: I -- conosci già questa parola dalle lezioni precedenti.
    note: Un breve ripasso prima del dialogo di questa lezione.
  pl.a1.unit16.lesson03.teach.prosze_wode_recap:
    title: Prego e acqua, di nuovo
    gloss: Proszę e wodę -- conosci già entrambe le parole dalle lezioni precedenti.
    note: Un breve ripasso prima del dialogo di questa lezione.
  pl.a1.unit16.lesson03.teach.dziekuje_recap:
    title: Grazie, di nuovo
    gloss: Dziękuję -- conosci già questa parola dalle lezioni precedenti.
    note: Un breve ripasso prima del dialogo di questa lezione.
  pl.a1.unit16.lesson03.teach.odpoczac:
    title: Riposarsi
    gloss: riposarsi
    note: 'Si usa con *Proszę* come hai già visto per chiedere a qualcuno di andare dritto o di girare in una certa direzione: *Proszę* + infinito, senza bisogno dell''imperativo.'
    example_gloss: Si riposi, per favore.
  pl.a1.unit16.lesson03.teach.pic:
    title: Bere
    gloss: bere
    note: Un altro infinito che segue *Proszę* nello stesso modo.
    example_gloss: Beva acqua, per favore.
  pl.a1.unit16.lesson03.teach.dialogue.line01:
    title: Marek chiede a Ewa come sta
    gloss: Ewa, come ti senti?
    note: Marek nota che qualcosa non va e chiede direttamente.
  pl.a1.unit16.lesson03.teach.dialogue.line02:
    title: Ewa descrive i suoi sintomi
    gloss: Mi sento male. Mi fa male la gola e ho la febbre.
    note: 'Ewa dice chiaramente due sintomi: gli stessi che ci ha già detto prima in questa unità.'
  pl.a1.unit16.lesson03.teach.dialogue.line03:
    title: Marek dà un semplice consiglio
    gloss: Si riposi e beva acqua, per favore.
    note: 'Un consiglio semplice, senza diagnosi: non è un''indicazione medica, solo buon senso.'
  pl.a1.unit16.lesson03.teach.dialogue.line04:
    title: Ewa ringrazia Marek
    gloss: Va bene, grazie, Marek.
    note: Una chiusura semplice e familiare della conversazione.
