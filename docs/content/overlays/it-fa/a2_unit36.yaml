    - value: من رفتم پست برای اینکه یه بسته بفرستم
      status: acceptable_with_note
      note: '*من* è corretto ma di solito si omette.'
    feedback: 'Modello: *رفتم پست برای اینکه یه بسته بفرستم.*'
  fa.a2.unit36.lesson01.exercise07.recognize_travel_documents:
    instruction: Che cosa significano queste parole?
    correct_option: passaporto e documenti
    distractors:
