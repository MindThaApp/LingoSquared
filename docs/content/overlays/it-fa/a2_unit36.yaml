teaching:
  fa.a2.unit36.lesson01.teach.going:
    title: Andare in giro
    gloss: sono andato, vado, ieri, oggi
    note: '*رفتم* è il passato semplice (sono andato); *می‌رم* è il presente parlato (vado / sto andando).'
    example_gloss:
    - Ieri sono andato/a al mercato.
    - Oggi vado in banca.
  fa.a2.unit36.lesson01.teach.places:
    title: Luoghi delle commissioni
    gloss: banca, posta, mercato
    note: Il persiano parlato dice *رفتم بانک* senza alcuna preposizione per «a / in».
    example_gloss:
    - Ieri sono andato in banca.
    - Oggi vado alla posta.
    - Ieri sono andato/a al mercato.
  fa.a2.unit36.lesson01.teach.things:
    title: Cose per le commissioni
    gloss: soldi, pacco, lettera, libro, un / uno
    note: '*یه* è la forma parlata normale di «un / uno».'
    example_gloss:
    - Ho dei soldi.
    - Ho un pacco.
    - Ho una lettera.
    - Ho un libro.
  fa.a2.unit36.lesson01.teach.connectors:
    title: Due modi per dire «per / al fine di»
    gloss: per / affinché, per / affinché (breve, parlato)
    note: '*برای اینکه* è il connettivo completo; *تا* è quello più breve e molto comune nel parlato. Entrambi sono seguiti dalla stessa forma del verbo.'
    example_gloss:
    - Sono andato in banca per prelevare dei soldi.
    - Sono andato in banca a prelevare dei soldi.
  fa.a2.unit36.lesson01.teach.purpose_verbs:
    title: I verbi dello scopo
    gloss: (che) io prenda, (che) io compri, (che) io spedisca
    note: Queste forme (*بـ* + radice + *م*) sono il congiuntivo. Indicano lo scopo, che non si è ancora realizzato.
    example_gloss:
    - Sono andato in banca a prelevare dei soldi.
    - Sono andato al mercato per comprare un libro.
    - Sono andato alla posta per spedire una lettera.
  fa.a2.unit36.lesson01.teach.post_items:
    title: Posta e documenti di viaggio
    gloss: busta, francobollo, passaporto, documenti
    note: '*پاکت* e *تمبر* sono utili alla posta; *پاسپورت* e *مدارک* sono cose da preparare prima di un viaggio.'
    example_gloss:
    - Ho una busta e un francobollo.
    - Ho il passaporto e i documenti.
  fa.a2.unit36.lesson01.teach.travel_items:
    title: Preparare il viaggio
    gloss: valigia, valuta estera, elenco, destinazione
    note: '*چمدون* è la forma parlata di tutti i giorni per «valigia». *مقصد* è il luogo che vuoi raggiungere.'
    example_gloss:
    - Ho una valigia.
    - Ho valuta estera e un elenco.
    - Andare a destinazione.
  fa.a2.unit36.lesson01.teach.purpose_clause:
    title: برای اینکه + congiuntivo
    gloss: Sono andato in banca per prelevare dei soldi
    note: 'Di'' che cosa hai fatto, poi *برای اینکه*, poi lo scopo al congiuntivo: *رفتم بانک برای اینکه پول بگیرم*. Il verbo dello scopo non indica il passato: guarda avanti, verso l''obiettivo.'
  fa.a2.unit36.lesson02.teach.learning_words:
    title: Parole per imparare
    gloss: corso, inglese, (che) io impari, (che) io parli
    note: '*یاد بگیرم* e *حرف بزنم* sono verbi composti da due parti; il *بـ* del congiuntivo si trova sulla parte verbale (*بگیرم*, *بزنم*).'
    example_gloss:
    - Vado a lezione per imparare l'inglese.
    - Leggo libri per parlare inglese.
  fa.a2.unit36.lesson02.teach.saving_words:
    title: Parole per risparmiare e leggere
    gloss: metto da parte dei soldi, macchina, (che) io legga
    note: '*پول جمع می‌کنم* è l''espressione di tutti i giorni per «risparmiare». *جمع کنم* ne è il congiuntivo.'
    example_gloss:
    - Metto da parte dei soldi per comprare una macchina.
    - Leggo libri per imparare l'inglese.
  fa.a2.unit36.lesson02.teach.subjunctive_shape:
    title: Costruire il congiuntivo
    gloss: prendo, affinché io prenda; compro, affinché io compri
    note: 'Togli *می‌* e metti *بـ* davanti alla radice: *می‌گیرم* diventa *بگیرم*, *می‌خرم* diventa *بخرم*. Con *کردن* il *بـ* di norma si omette: *جمع می‌کنم* diventa *جمع کنم*. Le desinenze restano uguali (*-م* per «io»).'
  fa.a2.unit36.lesson02.teach.ta_connector:
    title: تا + congiuntivo (e تا بتونم)
    gloss: per prelevare dei soldi; per poter parlare inglese
    note: '*تا* funziona come *برای اینکه*: *رفتم بانک تا پول بگیرم*. Usa *تا بتونم* («per poter») quando lo scopo è riuscire a fare qualcosa; *بتونم* è a sua volta un congiuntivo e anche il verbo seguente lo è.'
  fa.a2.unit36.lesson02.teach.baraye_noun:
    title: برای + nome o nome verbale
    gloss: per fare la spesa; per spedire una lettera
    note: Dopo *برای* puoi mettere un semplice nome (*خرید*, spesa) o un nome verbale in *-ن* (*فرستادن*, spedire). In questo caso non ci sono né il congiuntivo né *اینکه*.
  fa.a2.unit36.lesson03.teach.reason_words:
    title: Parole di causa
    gloss: perché, perché (interrogativo), che cosa, avevo bisogno di, mi piace
    note: '*چون* dà una causa. *لازم داشتم* («avevo bisogno di») e *دوست دارم* («mi piace») sono verbi normali, non congiuntivi.'
    example_gloss:
    - Sono andato in banca perché avevo bisogno di soldi.
    - Vado a lezione perché mi piace l'inglese.
  fa.a2.unit36.lesson03.teach.reason_vs_purpose:
    title: Causa (چون) e scopo (تا)
    gloss: perché avevo bisogno di soldi / per prelevare dei soldi
    note: '*چون* guarda indietro alla causa e usa un verbo normale: *چون پول لازم داشتم*. *تا* e *برای اینکه* guardano avanti allo scopo e usano il congiuntivo: *تا پول بگیرم*.'
  fa.a2.unit36.lesson03.teach.which_verb_form:
    title: Guarda il verbo per distinguerli
    gloss: perché avevo bisogno di soldi / per avere dei soldi
    note: Se la frase ha un tempo normale (*داشتم*, *دارم*), il connettore è *چون*. Se ha il congiuntivo (*بگیرم*, *بخرم*), il connettore è *برای اینکه* oppure *تا*.
  fa.a2.unit36.lesson04.teach.purpose_questions:
    title: Chiedere a che scopo
    gloss: Per che cosa sei andato in banca? Per che cosa vuoi dei soldi? Per che cosa vai a lezione?
    note: '*برای چی؟* chiede lo scopo. La risposta è una finalità con *تا* o *برای اینکه*.'
  fa.a2.unit36.lesson04.teach.answer_pattern:
    title: Domanda e risposta
    gloss: Perché sei andato in banca? Sono andato a prelevare dei soldi.
    note: A *برای چی؟* si risponde con l'azione più *تا* o *برای اینکه* più il congiuntivo. Anche una risposta breve, solo *تا پول بگیرم*, è naturale.
  fa.a2.unit36.lesson05.teach.reading:
    title: Una giornata di commissioni
    gloss: Oggi avevo da fare. Prima sono andato/a in banca per prelevare dei soldi. Poi sono andato/a alla posta per spedire una lettera. Alla fine sono andato/a al mercato per fare la spesa. Metto da parte dei soldi per comprare una macchina.
    note: Leggi una prima volta per trovare le tre commissioni, poi una seconda volta per capire lo scopo di ciascuna.
  fa.a2.unit36.lesson06.teach.turn01:
    title: Sara chiede a Nima perché è in ritardo
    gloss: 'Sara chiede: Nima, perché sei in ritardo?'
    note: '*چرا* chiede il motivo.'
  fa.a2.unit36.lesson06.teach.turn02:
    title: Nima spiega il motivo
    gloss: 'Nima: Perché la banca era affollata.'
    note: '*چون* più un normale verbo al passato indica un motivo.'
  fa.a2.unit36.lesson06.teach.turn03:
    title: Sara chiede a che scopo
    gloss: 'Sara: Per che cosa sei andato in banca?'
    note: Ora *برای چی* chiede lo scopo.
  fa.a2.unit36.lesson06.teach.turn04:
    title: Due commissioni con i loro scopi
    gloss: 'Nima: Sono andato in banca per prelevare dei soldi. Poi sono andato alla posta per spedire un pacco.'
    note: Uno scopo usa *تا* più il congiuntivo; l'altro usa *برای* più un nome verbale.
  fa.a2.unit36.lesson06.teach.turn05:
    title: Sara chiede dei soldi
    gloss: 'Sara: Per che cosa vuoi dei soldi?'
    note: Un'altra domanda con *برای چی* su uno scopo.
  fa.a2.unit36.lesson06.teach.turn06:
    title: Nima indica lo scopo
    gloss: 'Nima: Metto da parte dei soldi per comprare una macchina.'
    note: '*تا ماشین بخرم* indica lo scopo.'
exercises:
