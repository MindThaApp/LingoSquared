  fa.a2.unit36.lesson01.exercise06.translate_post_purpose:
    instruction: 'Traduci in persiano usando برای اینکه e un congiuntivo: Sono andato/a alla posta per spedire un pacco.'
    accepted_answers:
    - value: رفتم پست برای اینکه یه بسته بفرستم
      status: correct
    - value: برای اینکه یه بسته بفرستم رفتم پست
      status: correct
    - value: رفتم پست برای اینکه بسته بفرستم
      status: acceptable_with_note
