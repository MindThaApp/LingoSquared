    feedback: '*پاسپورت و مدارک* significa «passaporto e documenti».'
  fa.a2.unit36.lesson01.exercise08.recognize_travel_goal:
    instruction: Quali significati corrispondono, in ordine, a queste parole di viaggio?
    correct_option: destinazione, valigia, valuta estera, elenco
    distractors:
    - valigia, destinazione, elenco, valuta estera
    - documenti, passaporto, francobollo, busta
    - mercato, banca, posta, lezione
    accepted_answers:
    - value: destinazione, valigia, valuta estera, elenco
      status: correct
    feedback: '*مقصد، چمدون، ارز، فهرست* indicano la destinazione e i preparativi di viaggio.'
  fa.a2.unit36.lesson02.exercise01.recognize_subjunctive_ending:
    instruction: Che cosa indica la desinenza di یاد بگیرم in questa frase?
    correct_option: Uno scopo, «per imparare».
    distractors:
    - Un'azione conclusa, «ho imparato».
    - Un'abitudine, «imparo ogni giorno».
    - Un ordine, «impara!».
    accepted_answers:
    - value: Uno scopo, «per imparare».
      status: correct
    feedback: Dopo *تا*, *بگیرم* è al congiuntivo e indica lo scopo.
  fa.a2.unit36.lesson02.exercise02.recognize_baraye_noun:
