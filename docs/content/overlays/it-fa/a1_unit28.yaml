course:
  title: Persiano A1
  description: 'Persiano iraniano per principianti: nominare i mezzi per spostarsi (autobus, metropolitana, auto, bicicletta, a piedi, taxi), dire come ti sposti abitualmente (ogni giorno in autobus al lavoro), chiedere quale mezzo sia meglio (اتوبوس یا مترو، کدوم بهتره؟), chiedere il prezzo di un biglietto locale e leggere una breve frase sugli orari dei mezzi, un brano sugli spostamenti abituali di نیما e سارا e un dialogo finale tra نیما e سارا che confrontano come si spostano.'
