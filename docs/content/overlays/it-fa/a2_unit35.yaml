teaching:
  fa.a2.unit35.lesson01.teach.connectors:
    title: Tre connettori di tempo
    gloss: prima che, dopo che, quando
    note: '*قبل از اینکه* significa «prima che», *بعد از اینکه* significa «dopo che» e *وقتی* significa «quando». Ognuno introduce una proposizione che dice quando avviene qualcosa.'
    example_gloss:
    - Prima di uscire, chiudo la porta.
    - Dopo che sono arrivato/a, ho chiamato Sara.
    - Quando sono arrivato/a, ho chiamato Sara.
  fa.a2.unit35.lesson01.teach.home_words:
    title: Parole di casa e di ogni giorno
    gloss: casa, porta, luce, spazzolino, colazione, cibo, tè
    note: 'Nel parlato *رو* segna un complemento oggetto determinato: *در رو* è «la porta». *مسواک* indica lo spazzolino e anche l''azione in *مسواک می‌زنم*.'
    example_gloss:
    - Chiudo la porta.
    - Spengo la luce.
    - Ho mangiato e ho preso un tè.
  fa.a2.unit35.lesson01.teach.subjunctive_verbs:
    title: Verbi dopo «prima che»
    gloss: io esco, io dormo, io arrivo, io compro, io cucino, io salgo
    note: 'Dopo *قبل از اینکه* il verbo è al congiuntivo: *ب* + radice + desinenza (*برم، بخوابم، برسم*). In questo verbo non c''è *می‌*. Il verbo principale esprime l''abitudine: *می‌بندم، می‌زنم*.'
    example_gloss:
    - Prima di dormire, mi lavo i denti.
    - Prima di arrivare, chiamo Sara.
    - Prima di salire, compro un biglietto.
    - Prima di cucinare, lavo la verdura.
  fa.a2.unit35.lesson01.teach.past_verbs:
    title: Verbi al passato semplice
    gloss: sono arrivato/a, ho chiamato, ho mangiato
    note: Sono normali verbi al passato semplice. Dopo *بعد از اینکه* e *وقتی*, in un racconto al passato, si usa il passato semplice.
    example_gloss:
    - Sono arrivato/a alla stazione.
    - Ho chiamato Sara.
    - Ho mangiato.
  fa.a2.unit35.lesson01.teach.before_subjunctive:
    title: قبل از اینکه + congiuntivo
    gloss: Prima di uscire, chiudo la porta
    note: 'Dopo *قبل از اینکه* il verbo è al congiuntivo: *برم، بخوابم، برسم*. L''azione della proposizione con *قبل از اینکه* avviene per seconda; quella della principale avviene per prima. In *قبل از اینکه برم، در رو می‌بندم* prima si chiude la porta, poi si esce.'
  fa.a2.unit35.lesson02.teach.travel_words:
    title: Parole di viaggio
    gloss: treno, biglietto, stazione, sono salito/a, ho comprato
    note: '*سوار شدم* è l''azione intera «sono salito/a» (su un treno, un autobus). *بلیت* è il biglietto.'
    example_gloss:
    - Ho comprato un biglietto.
    - Sono salito/a sul treno.
    - Sono arrivato/a alla stazione.
  fa.a2.unit35.lesson02.teach.cook_and_day_verbs:
    title: Altri verbi al passato
    gloss: ho lavato, ho cucinato, ho dormito, ho preso
    note: Queste forme del passato semplice (*شستم، پختم، خوابیدم، گرفتم*) sono i verbi che si usano dopo *بعد از اینکه*.
    example_gloss:
    - Ho lavato la verdura.
    - Ho cucinato.
    - Ho fatto la doccia.
    - Ho dormito.
  fa.a2.unit35.lesson02.teach.after_past:
    title: بعد از اینکه + passato semplice
    gloss: Dopo che sono arrivato/a, ho chiamato
    note: 'Dopo *بعد از اینکه* si usa il passato semplice: *رسیدم، خریدم، شستم*. La proposizione con *بعد از اینکه* è avvenuta per prima. Esempio: *بعد از اینکه بلیت خریدم، سوار قطار شدم* significa che prima hai comprato il biglietto, poi sei salito/a. Qui non c''è il congiuntivo.'
  fa.a2.unit35.lesson03.teach.contrast_verbs:
    title: Andare e chiudere, passato e presente
    gloss: sono andato/a, ho chiuso, vado
    note: 'Sono le forme che confrontiamo: *رفتم* (sono andato/a) e *می‌رم* (vado) rispetto al congiuntivo *برم*.'
    example_gloss:
    - Sono uscito/a di casa.
    - Ho chiuso la porta.
    - Sto andando.
  fa.a2.unit35.lesson03.teach.contrast_forms:
    title: Congiuntivo dopo قبل, passato dopo بعد
    gloss: prima che io esca / dopo che sono uscito/a
    note: 'I due connettori richiedono due forme verbali diverse. *قبل از اینکه برم* (prima che io esca): congiuntivo, l''evento non è ancora avvenuto. *بعد از اینکه رفتم* (dopo che sono uscito/a): passato semplice, l''evento è concluso. Confronta *برم / رفتم*, *بخرم / خریدم*, *برسم / رسیدم*.'
  fa.a2.unit35.lesson03.teach.before_any_tense:
    title: Il verbo dopo قبل resta al congiuntivo
    gloss: Prima di uscire, ho chiuso la porta
    note: 'Il verbo dopo *قبل از اینکه* è al congiuntivo anche quando il verbo principale è al passato: *قبل از اینکه برم، در رو بستم* significa «Prima di uscire, ho chiuso la porta». Non mettere mai *رفتم* dopo *قبل از اینکه*.'
  fa.a2.unit35.lesson04.teach.when_words:
    title: Parole per «quando»
    gloss: musica, ascolto, è venuto/a, io arrivo, io cucino
    note: '*گوش می‌دم* significa «ascolto». *اومد* è il passato parlato di «è venuto/a». *رسیدی* significa «sei arrivato/a» e *چیکار کردی؟* significa «cosa hai fatto?».'
    example_gloss:
    - Quando cucino, ascolto musica.
    - Quando è arrivato il treno, sono salito/a.
    - Quando arrivo, chiamo Sara.
  fa.a2.unit35.lesson04.teach.when_forms:
    title: وقتی + passato o presente
    gloss: Quando sono arrivato/a, ho chiamato; quando arrivo, chiamo
    note: '*وقتی* richiede la forma verbale adatta al tempo. Un evento concluso usa il passato semplice: *وقتی رسیدم، زنگ زدم* (quando sono arrivato/a, ho chiamato). Un''abitudine o un programma usa il presente con *می‌*: *وقتی می‌رسم، زنگ می‌زنم* (quando arrivo, chiamo). *وقتی* non dice quale azione viene prima, quindi per un ordine preciso usa *قبل از اینکه* o *بعد از اینکه*.'
  fa.a2.unit35.lesson05.teach.yesterday_words:
    title: Parole per la lettura
    gloss: ieri, mattina, ho spento
    note: '*خاموش کردم* è il passato semplice di «ho spento». *دیروز صبح* significa «ieri mattina».'
    example_gloss:
    - Ieri mattina ho fatto la doccia.
    - Ho spento la luce.
  fa.a2.unit35.lesson05.teach.reading:
    title: Una mattina e un treno
    gloss: Ieri mattina, dopo aver fatto la doccia, ho fatto colazione. Prima di uscire di casa, ho spento la luce e ho chiuso la porta. Quando sono arrivato/a alla stazione, ho comprato un biglietto. Dopo che è arrivato il treno, sono salito/a.
    note: 'Leggi una prima volta per capire l''ordine degli eventi, poi trova i tre connettori: *بعد از اینکه، قبل از اینکه، وقتی*.'
  fa.a2.unit35.lesson06.teach.dialogue_words:
    title: Parole per la conversazione
    gloss: domani, a me, tu arrivi, abbiamo mangiato, beviamo
    note: '*بهم* significa «a me» e *بهت* significa «a te». *برسی* è il congiuntivo «tu arrivi». *خوردیم* significa «abbiamo mangiato» e *می‌خوریم* significa «mangiamo/beviamo».'
    example_gloss:
    - Mi chiami domani?
    - Sì, ti chiamo.
    - Abbiamo mangiato e prenderemo un tè.
  fa.a2.unit35.lesson06.teach.turn01:
    title: Sara chiede di ieri
    gloss: 'Sara chiede a Nima: Ieri, dopo che sei arrivato alla stazione, cosa hai fatto?'
    note: Sara usa *بعد از اینکه* con il passato.
  fa.a2.unit35.lesson06.teach.turn02:
    title: Nima racconta la sequenza
    gloss: Dopo che sono arrivato, ho comprato un biglietto. Quando è arrivato il treno, sono salito.
    note: Nima risponde con *بعد از اینکه* e *وقتی*, entrambi con verbi al passato.
  fa.a2.unit35.lesson06.teach.turn03:
    title: Sara chiede di domani
    gloss: Domani, prima di arrivare, mi chiami?
    note: Sara usa *قبل از اینکه* con il congiuntivo *برسی*.
  fa.a2.unit35.lesson06.teach.turn04:
    title: Nima è d'accordo
    gloss: Sì, prima di arrivare ti chiamo.
    note: 'Nima ripete il congiuntivo con la propria desinenza: *برسم*.'
  fa.a2.unit35.lesson06.teach.turn05:
    title: Sara organizza la cena
    gloss: Bene. Prima che tu arrivi, cucino.
    note: 'Ognuno dei due ha il proprio soggetto: *من* e *تو*.'
  fa.a2.unit35.lesson06.teach.turn06:
    title: Nima organizza il tè
    gloss: Perfetto! Dopo aver mangiato, prenderemo il tè.
    note: Qui la subordinata con *بعد از اینکه* è al passato e la principale esprime il programma.
exercises:
  fa.a2.unit35.lesson01.exercise01.recognize_before:
    instruction: Quale ordine degli eventi descrive questa frase?
    correct_option: Prima chiudo la porta, poi esco.
    distractors:
    - Prima esco, poi chiudo la porta.
    - Chiudo la porta mentre esco.
    - Non chiudo la porta.
    accepted_answers:
    - value: Prima chiudo la porta, poi esco.
      status: correct
    feedback: In *قبل از اینکه برم، در رو می‌بندم* l'azione principale (chiudere la porta) avviene prima di uscire.
  fa.a2.unit35.lesson01.exercise02.recognize_after:
    instruction: Quale ordine degli eventi descrive questa frase?
    correct_option: Prima sono arrivato, poi ho chiamato Sara.
    distractors:
    - Prima ho chiamato Sara, poi sono arrivato.
    - Ho chiamato Sara mentre arrivavo.
    - Non ho chiamato Sara.
    accepted_answers:
    - value: Prima sono arrivato, poi ho chiamato Sara.
      status: correct
    feedback: La subordinata con *بعد از اینکه* (arrivare) avviene per prima; la telefonata viene dopo.
