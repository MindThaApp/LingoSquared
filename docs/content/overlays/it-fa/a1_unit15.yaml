teaching:
  fa.a1.unit15.lesson01.teach.in_word:
    title: Questo
    gloss: questo
    note: این significa «questo».
    example_gloss: Questo è più grande di quello.
  fa.a1.unit15.lesson01.teach.oon_word:
    title: Quello
    gloss: quello
    note: اون significa «quello» (forma colloquiale di آن).
    example_gloss: Quello è più piccolo di questo.
  fa.a1.unit15.lesson01.teach.bozorgtare_word:
    title: È più grande
    gloss: è più grande
    note: بزرگ‌تره è la contrazione colloquiale di بزرگ‌تر است («è più grande»); بزرگ‌تر è il comparativo di بزرگ (grande).
    example_gloss: Questo è più grande di quello.
  fa.a1.unit15.lesson01.teach.koochiktare_word:
    title: È più piccolo
    gloss: è più piccolo
    note: کوچیک‌تره è la contrazione colloquiale di کوچیک‌تر است («è più piccolo»).
    example_gloss: Quello è più piccolo di questo.
  fa.a1.unit15.lesson01.teach.az_word:
    title: Di (nei confronti)
    gloss: di / che (nel confronto)
    note: 'از indica il termine di paragone: X از Y بزرگ‌تره significa «X è più grande di Y».'
    target_text: 'از (di, che: nei paragoni)'
  fa.a1.unit15.lesson02.teach.geroontare_word:
    title: Costa di più
    gloss: costa di più
    note: گرون‌تره è la contrazione colloquiale di گرون‌تر است; گرون‌تر è il comparativo di گرون (caro).
    example_gloss: Questo costa più di quello.
  fa.a1.unit15.lesson02.teach.arzoontare_word:
    title: Costa di meno
    gloss: costa di meno
    note: ارزون‌تره è la contrazione colloquiale di ارزون‌تر است; ارزون‌تر è il comparativo di ارزون (economico).
    example_gloss: Quello costa meno di questo.
  fa.a1.unit15.lesson03.teach.names:
    title: Nima e Sara
    gloss: Nima, Sara
    note: Nomi iraniani comuni usati in tutto il corso.
    example_gloss:
    - Nima è più alto di Sara.
    - Sara è più giovane di Nima.
  fa.a1.unit15.lesson03.teach.ghad_bolandtare_phrase:
    title: Più alto
    gloss: più alto / è più alto/alta
    note: '*قد بلندتره* significa letteralmente «la statura è più alta»: *قد* (statura) + *بلندتر* (più alto, comparativo di *بلند*, alto/lungo) + *است* (è), contratto in *-ه*.'
  fa.a1.unit15.lesson03.teach.javoontare_word:
    title: Più giovane
    gloss: più giovane / è più giovane
    note: جوون‌تره è la contrazione colloquiale di جوون‌تر است; جوون‌تر è il comparativo di جوون (giovane).
    example_gloss: Sara è più giovane di Nima.
  fa.a1.unit15.lesson04.teach.behtare_word:
    title: È meglio
    gloss: è meglio
    note: '*بهتره* è la contrazione colloquiale di *بهتر است*. *بهتر* (migliore) è il comparativo irregolare di *خوب* (buono).'
    example_gloss: Questo è meglio di quello.
  fa.a1.unit15.lesson04.teach.badtare_word:
    title: È peggio
    gloss: è peggio
    note: '*بدتره* è la contrazione colloquiale di *بدتر است*. *بدتر* (peggiore) è il comparativo regolare di *بد* (cattivo): la stessa parola più la normale desinenza *تر*, a differenza di *بهتر*, che è irregolare.'
    example_gloss: Quello è peggio di questo.
  fa.a1.unit15.lesson04.teach.choon_word:
    title: Perché (perché)
    gloss: perché
    note: چون introduce una causa o un motivo.
    target_text: چون (perché)
  fa.a1.unit15.lesson04.teach.va_word:
    title: E
    gloss: e
    note: و significa «e» e unisce due frasi o due elementi.
    target_text: و (e)
  fa.a1.unit15.lesson05.teach.reading_text:
    title: Testo di esempio con confronti
    gloss: Nima è più alto di Sara. Sara è più giovane di Nima.
    note: Un breve confronto in terza persona che unisce il lessico di questa unità.
  fa.a1.unit15.lesson06.teach.names:
    title: Nima e Sara
    gloss: Nima, Sara
    example_gloss:
    - Nima ha detto che questo è più caro.
    - Sara ha detto che quello costa meno.
  fa.a1.unit15.lesson06.teach.vali_word:
    title: Ma
    gloss: ma
    note: ولی significa «ma» e introduce un contrasto.
    target_text: ولی (ma)
  fa.a1.unit15.lesson06.teach.aare_word:
    title: Sì
    gloss: sì
    note: آره è la forma colloquiale di بله («sì»).
    example_gloss: Sì, è vero.
  fa.a1.unit15.lesson06.teach.dialogue_line1:
    title: Nima dice
    gloss: Questo costa più di quello, ma è migliore.
  fa.a1.unit15.lesson06.teach.dialogue_line2:
    title: Sara risponde
    gloss: Sì, ma quello costa meno.
