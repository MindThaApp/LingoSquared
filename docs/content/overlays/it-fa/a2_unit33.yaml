teaching:
  fa.a2.unit33.lesson01.teach.people:
    title: Persone
    gloss: io, Sara, Nima
    note: Sara e Nima sono amici e parlano delle loro abitudini. *من* di solito si omette perché la desinenza del verbo indica già «io».
    example_gloss:
    - Ho visto Nima.
    - Sara e Nima sono amici.
  fa.a2.unit33.lesson01.teach.sport_words:
    title: Parole di sport e hobby
    gloss: correre, nuotare, fare sport, leggere libri, palestra, parco
    note: 'Le attività si indicano con un nome verbale che termina in *-ن*: *دویدن* (correre), *خوندن* (leggere). I composti usano *کردن*: *شنا کردن*, *ورزش کردن*.'
    example_gloss:
    - Ho iniziato a correre nel parco.
    - Faccio sport in palestra.
  fa.a2.unit33.lesson01.teach.screen_food:
    title: Parole su schermi e cibo
    gloss: telefono, televisione, bibita gassata, dolci, acqua, ora
    note: '*نگاه کردن* è il normale verbo parlato per guardare la tv: *تلویزیون نگاه کردن*. Il plurale *شب‌ها* come abitudine significa «la sera, di sera».'
    example_gloss:
    - La sera guardo la tv per un'ora.
    - Uso il telefono per un'ora.
  fa.a2.unit33.lesson01.teach.time_words:
    title: Parole di tempo e abitudine
    gloss: ogni giorno, mese, settimana, fa, da, più (non... più), presto, tardi, meno
    note: '*از ماه پیش* significa «da un mese fa»; *پیش* dopo un''espressione di tempo significa «fa». *دیگه* con un verbo negativo significa «non... più».'
    example_gloss:
    - Da un mese corro ogni giorno.
    - Dalla settimana scorsa la sera vado a letto presto.
  fa.a2.unit33.lesson01.teach.start_form:
    title: 'Iniziare: شروع کردم به + nome verbale'
    gloss: Ho iniziato a correre; ho iniziato a nuotare
    note: 'Per dire che hai iniziato un''abitudine, usa *شروع کردم به* seguito dal nome verbale (la forma in *-ن*): *شروع کردم به دویدن*. Il secondo verbo non si coniuga.'
  fa.a2.unit33.lesson01.teach.stop_form:
    title: 'Smettere: دیگه ... نمی‌کنم e ترک کردم'
    gloss: Non bevo più bibite gassate; ho smesso di mangiare dolci
    note: 'Due modi naturali per smettere: *دیگه* più un verbo al presente negativo (*دیگه نمی‌دوم* = non corro più), oppure *X رو ترک کردم* (ho smesso con X) con il marcatore dell''oggetto determinato *رو*.'
  fa.a2.unit33.lesson02.teach.subjunctive_verbs:
    title: Verbi nella forma del «desiderio»
    gloss: che io dorma, mi svegli, corra, mangi/beva, telefoni, vada, faccia
    note: 'Queste desinenze (*-م*) si usano dopo *سعی* e *یادم رفت*. I composti mantengono il nome e cambiano il verbo leggero: *ورزش کنم*, *زنگ بزنم*, *بیدار شم*.'
    example_gloss:
    - Voglio correre ogni giorno.
    - Devo svegliarmi presto.
  fa.a2.unit33.lesson02.teach.try_forget_words:
    title: Provare e dimenticare
    gloss: provare, mi sono dimenticato/a, che, ieri, oggi
    note: '*یادم رفت* è formato da *یاد* (memoria) + *م* + *رفت*: «mi è uscito dalla memoria». Lo stesso schema vale per ogni persona: *یادش رفت*, *یادت رفت*.'
    example_gloss:
    - Ieri mi sono dimenticato di bere acqua.
    - Oggi cerco di andare a letto presto.
  fa.a2.unit33.lesson02.teach.try_form:
    title: 'Provare: سعی می‌کنم / سعی کردم + congiuntivo'
    gloss: Cerco di dormire presto; ho cercato di svegliarmi presto
    note: '*سعی می‌کنم* significa «cerco / sto cercando di» e *سعی کردم* significa «ho cercato di». Il secondo verbo è sempre nella forma con *ب-* e con la stessa desinenza personale, senza *به*: *سعی کردم زود بیدار شم*.'
  fa.a2.unit33.lesson02.teach.forget_form:
    title: 'Dimenticare: یادم رفت (که) + congiuntivo'
    gloss: Mi sono dimenticato/a di telefonare; mi sono dimenticato/a di bere acqua
    note: '*یادم رفت* seguito dalla forma con *ب-* significa «mi sono dimenticato/a di fare qualcosa». La parola *که* è facoltativa nel parlato: *یادم رفت زنگ بزنم* = *یادم رفت که زنگ بزنم*.'
  fa.a2.unit33.lesson02.teach.subjunctive_shape:
    title: Come si forma la forma del «desiderio»
    gloss: ب + radice + desinenza personale
    note: 'La maggior parte dei verbi aggiunge *ب-* davanti alla radice: *بدوم*, *بخورم*, *بخوابم*. I verbi composti lo mettono sul verbo leggero (*زنگ بزنم*) oppure usano *کنم* e *شم*. Nel parlato *بیدار بشم* viene spesso abbreviato in *بیدار شم*.'
  fa.a2.unit33.lesson03.teach.four_frames:
    title: Quattro schemi, quattro significati
    gloss: ho iniziato a correre / ho cercato di correre / mi sono dimenticato/a di correre / non corro più
    note: 'La stessa attività cambia significato con lo schema: *شروع کردم به دویدن* (ho iniziato), *سعی کردم بدوم* (ho cercato di), *یادم رفت بدوم* (mi sono dimenticato/a di), *دیگه نمی‌دوم* (non … più).'
  fa.a2.unit33.lesson03.teach.noun_or_subjunctive:
    title: Nome verbale o forma del «desiderio»?
    gloss: به + nome verbale vs. forma con ب-
    note: 'Dopo *شروع کردم به* si usa il nome verbale (*شنا کردن*). Dopo *سعی کردم* e *یادم رفت* si usa la forma personale in *-م* (*شنا کنم*). Non mescolarli: *سعی کردم به شنا کردن* è sbagliato.'
  fa.a2.unit33.lesson03.teach.dige_negative:
    title: دیگه + negativo significa «non più»
    gloss: La sera non guardo più la TV
    note: '*دیگه* davanti a un verbo negativo indica che qualcosa accadeva e ora non accade più. Senza *دیگه*, *نوشابه نمی‌خورم* è un fatto generale («non bevo bibite gassate»), non un cambiamento.'
  fa.a2.unit33.lesson04.teach.questions:
    title: Domande sulle abitudini
    gloss: Da quando hai iniziato? Che cosa hai smesso?
    note: 'La domanda termina con la forma in *-ی* per «tu»: *شروع کردی* = hai iniziato, *ترک کردی* = hai smesso. Rispondi con la forma in *-م*.'
    example_gloss:
    - Da quando hai iniziato?
    - Che cosa hai smesso?
  fa.a2.unit33.lesson04.teach.answer_since:
    title: Rispondere indicando quando si è iniziato
    gloss: da un mese fa ho iniziato a correre
    note: 'Metti prima il tempo: *از ماه پیش شروع کردم به دویدن*. Per dire che hai smesso, metti prima l''oggetto e usa *رو*: *نوشابه رو ترک کردم*.'
  fa.a2.unit33.lesson05.teach.link_words:
    title: Parole di collegamento
    gloss: ma, anche, spento
    note: '*هم* dopo un nome o un sintagma verbale significa «anche». *خاموش کردن* è «spegnere» e prende *رو* con un oggetto determinato.'
    example_gloss:
    - Ho spento il telefono.
    - Ho provato, ma me ne sono dimenticato/a.
  fa.a2.unit33.lesson05.teach.reading_note:
    title: Un testo sulle abitudini cambiate
    gloss: ''
    note: Leggi una prima volta per trovare i due cambiamenti (un'abitudine iniziata, due abbandonate), poi di nuovo per capire che cosa cerca di fare chi parla e di che cosa si è dimenticato.
  fa.a2.unit33.lesson06.teach.chat_words:
    title: Parole da chiacchierata
    gloss: come va, va bene, bravo, scusa, allora, perché, no, bevi, non hai telefonato
    note: '*آفرین* serve a fare i complimenti a un amico («bravo»). *ببخش* è il «scusa» informale; con gli sconosciuti usa *ببخشید*.'
    example_gloss:
    - Come va con l'esercizio fisico? Bene!
    - Allora, perché non hai telefonato?
  fa.a2.unit33.lesson06.teach.turn01:
    title: Sara chiede dell'esercizio fisico
    gloss: 'Sara chiede a Nima: Come va con l''esercizio fisico?'
    note: La domanda apre la conversazione sulle sue nuove abitudini.
  fa.a2.unit33.lesson06.teach.turn02:
    title: Nima dice che cosa ha iniziato
    gloss: 'Nima: Bene! Un mese fa ho iniziato a correre.'
    note: '*شروع کردم به* più il nome verbale *دویدن*.'
  fa.a2.unit33.lesson06.teach.turn03:
    title: Sara fa i complimenti e chiede
    gloss: 'Sara: Bravo! Bevi ancora bibite gassate?'
    note: '*هم* significa «anche».'
  fa.a2.unit33.lesson06.teach.turn04:
    title: Nima ha smesso con le bibite gassate
    gloss: 'Nima: No, ho smesso con le bibite gassate. Cerco anche di usare meno il telefono.'
    note: Un'abitudine abbandonata (*ترک کردم*) e uno sforzo (*سعی می‌کنم*).
  fa.a2.unit33.lesson06.teach.turn05:
    title: Sara chiede perché non ha telefonato
    gloss: 'Sara: Allora, perché ieri non hai telefonato?'
    note: La domanda usa la forma in *-ی* per «tu».
  fa.a2.unit33.lesson06.teach.turn06:
    title: Nima ammette di essersi dimenticato
    gloss: 'Nima: Scusa, mi sono dimenticato di telefonare.'
    note: '*یادم رفت* più la forma con *ب-*.'
