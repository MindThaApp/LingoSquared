course:
  title: Persiano A1
  description: 'Persiano iraniano per principianti: nominare le parole dell''università e dello studio (università, studente, lezione/materia, lingua), dire quale materia studi o stai imparando (matematica, un corso di studi, l''inglese come materia), chiedere e dire dove studi (*کجا درس می‌خونی؟*) e quanto spesso ci vai, un brano sugli studi di *نیما* e *سارا* e un dialogo finale tra *نیما* e *سارا* sulle loro materie e su cosa ne pensano (difficili ma interessanti).'
