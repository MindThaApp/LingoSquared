  fa.a1.unit30.lesson02.teach.question_what_study:
    title: Che cosa studi?
    gloss: Che cosa studi?
    note: '*چی درس می‌خونی؟* mette insieme tutti gli elementi di questa lezione.'
  fa.a1.unit30.lesson02.teach.answer_major:
    title: Il mio indirizzo di studi è matematica. Sto imparando anche l'inglese.
    gloss: Il mio indirizzo è matematica. Imparo anche l'inglese.
    note: '*رشته‌ی من ریاضیه. زبان انگلیسی رو هم یاد می‌گیرم* indica il tuo indirizzo di studi e una materia in più, con il marcatore dell''oggetto *رو* e *هم* («anche»).'
