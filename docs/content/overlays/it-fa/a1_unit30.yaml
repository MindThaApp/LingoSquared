    title: 'Lettura: gli studi di Nima e di Sara'
    gloss: Nima studia matematica all'università. La matematica è difficile ma interessante. Sara studia inglese. Lei va all'università ogni giorno.
    note: Questa lettura racconta di nuovo il dialogo alla terza persona. Quasi non ci sono parole nuove, quindi è un esercizio per riconoscere le parole in un testo continuo.
