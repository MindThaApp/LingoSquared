teaching:
  fa.a1.unit30.lesson01.teach.daneshgah_word:
    title: Università
    gloss: università
    note: '*دانشگاه* è la parola standard e di uso quotidiano per «università».'
    example_gloss: Questa università è buona.
  fa.a1.unit30.lesson01.teach.daneshjoo_word:
    title: Studente
    gloss: studente
    note: '*دانشجو* significa «studente universitario». *من دانشجو هستم* («Sono uno studente») usa la forma *هستم* che già conosci.'
    example_gloss: Sono studente.
  fa.a1.unit30.lesson01.teach.dars_word:
    title: Lezione / materia
    gloss: lezione / materia
    note: '*درس* significa sia «lezione» sia, in senso più ampio, «materia di studio».'
    example_gloss: Questa materia è interessante.
  fa.a1.unit30.lesson01.teach.zaban_word:
    title: Lingua
    gloss: lingua
    note: '*زبان* è la parola standard per «lingua».'
    example_gloss: Il persiano è una lingua.
  fa.a1.unit30.lesson01.teach.review_man_in:
    title: Io / questo
    gloss: io / questo
    note: '*من* e *این* ritornano qui per parlare dei tuoi studi.'
    target_text: من (io) / این (questo)
  fa.a1.unit30.lesson01.teach.review_dar:
    title: In / a
    gloss: in / a
    note: '*در* significa «in» o «a» ed è usato qui per «all''università».'
    target_text: در (in / a)
  fa.a1.unit30.lesson01.teach.mikhonam_pattern:
    title: Studiare/leggere + io faccio = io studio/leggo
    gloss: studiare/leggere + io = studio/leggo
    note: '*خوندن* («leggere» o «studiare», come in *کتاب خوندن*) prende la stessa desinenza del presente *-م* di *می‌کنم* e dà *می‌خونم*, «studio» o «leggo».'
    target_text: خوندن (studiare/leggere) + م = می‌خونم (studio/leggo)
  fa.a1.unit30.lesson01.teach.combined_sentence:
    title: Studio all'università
    gloss: Studio all'università
    note: '*من در دانشگاه درس می‌خونم* unisce *من* + *در* + *دانشگاه* + *درس* + *می‌خونم*.'
  fa.a1.unit30.lesson02.teach.riazi_word:
    title: Matematica
    gloss: matematica
    note: '*ریاضی* è la parola standard per «matematica».'
    example_gloss: La matematica è interessante.
  fa.a1.unit30.lesson02.teach.reshte_word:
    title: Corso di studi
    gloss: corso di studi
    note: '*رشته* significa «indirizzo di studi» o «corso di laurea». In *رشته‌ی من* («il mio indirizzo di studi») la *ی* in più collega il nome a *من*.'
    example_gloss: Il mio corso di studi è lingue.
  fa.a1.unit30.lesson02.teach.review_engelisi:
    title: Inglese
    gloss: inglese
    note: '*انگلیسی* («inglese») ritorna qui per indicare una materia che puoi studiare.'
    target_text: انگلیسی (inglese)
  fa.a1.unit30.lesson02.teach.yad_migiram_pattern:
    title: Imparare + io = sto imparando
    gloss: imparare + io = sto imparando
    note: '*یاد گرفتن* significa «imparare». La sua forma del presente *یاد می‌گیرم* usa lo stesso verbo *گرفتن* di *عکس می‌گیرم* («faccio una foto»), ma con un altro significato.'
    target_text: یاد گرفتن (imparare) + م = یاد می‌گیرم (imparo)
  fa.a1.unit30.lesson02.teach.mikhoni_pattern:
    title: Tu studi/leggi (informale)
    gloss: tu studi / leggi (informale)
    note: '*می‌خونی* è la forma informale della 2ª persona di *می‌خونم*, usata per chiedere direttamente a qualcuno.'
    target_text: می‌خونی (studi/leggi, informale)
  fa.a1.unit30.lesson02.teach.review_chi:
