teaching:
  fa.a2.unit23.lesson01.teach.time_words:
    title: Espressioni di tempo dell'infanzia
    gloss: un tempo, allora, quando ero bambino/a, ogni giorno, ogni estate
    note: '*قبلا* e *اون موقع* introducono una scena passata. *هر روز* e *هر تابستون* indicano ripetizione, quindi si abbinano naturalmente al passato abituale con *می‌*.'
    example_gloss:
    - Andavo a scuola a piedi ogni giorno.
    - Allora ero un bambino.
    - Ogni estate giocavamo al parco.
  fa.a2.unit23.lesson01.teach.places:
    title: Luoghi di casa e del quartiere
    gloss: casa, cortile, quartiere, scuola, parco
    note: '*توی* è la forma parlata abituale per «in». Con *رفتن* si può mantenere o omettere *به*: *به مدرسه می‌رفتم* e *می‌رفتم مدرسه*.'
    example_gloss:
    - La nostra casa aveva un cortile.
    - Il nostro quartiere era tranquillo.
    - Andavo a scuola a piedi.
    - Giocavamo al parco.
  fa.a2.unit23.lesson01.teach.descriptions:
    title: Descrivere i luoghi
    gloss: tranquillo, affollato, grande, vicino, lontano
    note: Usali con il passato *بود* per descrivere com'era un luogo. Nel persiano parlato *دوره* significa «è lontano».
    example_gloss:
    - Il quartiere era tranquillo.
    - La scuola era affollata.
    - Il cortile era grande.
    - La scuola era vicina.
    - Ora il parco è lontano.
  fa.a2.unit23.lesson01.teach.activities:
    title: Attività dell'infanzia
    gloss: a piedi, libro, calcio, giocare, leggere, costruire
    note: '*بازی کردن* è un verbo composto. Nel passato abituale *می‌* si mette su *کردن*: *بازی می‌کردم*.'
    example_gloss:
    - Andavo a scuola a piedi.
    - Leggevo libri.
    - Giocavo a calcio.
    - Costruivano qualcosa in cortile.
  fa.a2.unit23.lesson01.teach.habit_shape:
    title: La forma del passato abituale
    gloss: andavo, leggevo, facevo, costruivano
    note: 'Per un''abitudine ripetuta nel passato, metti *می‌* davanti al tema del passato e aggiungi la desinenza della persona: *می‌رفت + م* → *می‌رفتم*. Mantieni lo ZWNJ dopo *می‌*.'
  fa.a2.unit23.lesson02.teach.people_and_links:
    title: Persone e collegamenti utili
    gloss: io, noi, loro, con, un/una, qualcosa, il pomeriggio
    note: Nel persiano parlato si omettono spesso i pronomi soggetto; queste parole rendono esplicita la persona o la situazione quando serve.
    example_gloss:
    - Leggevo un libro ogni giorno.
    - Giocavamo al parco.
    - Costruivano qualcosa.
    - Giocavo a calcio con Nima.
    - Avevamo un grande cortile.
    - Il pomeriggio giocavamo.
  fa.a2.unit23.lesson02.teach.now_words:
    title: Ora e non più
    gloss: ora, non più, no, lì, come
    note: '*دیگه* con un verbo negativo significa «non più»: *دیگه بازی نمی‌کنم*.'
    example_gloss:
    - Ora il quartiere è affollato.
    - Lì non gioco più.
    - No, la scuola non era lontana.
    - Com'era il tuo quartiere?
  fa.a2.unit23.lesson02.teach.full_forms:
    title: Le desinenze di persona con می‌رفت
    gloss: andavo, andavi, andava, andavamo, andavano (abitudine nel passato)
    note: 'Le desinenze del passato restano le stesse: *-م، -ی،* nessuna desinenza, *-یم، -ن*. Nel parlato la terza persona plurale è *می‌رفتن*.'
  fa.a2.unit23.lesson02.teach.other_habits:
    title: Abitudini di lettura e di gioco
    gloss: leggevi/leggeva/leggevamo; giocavo/giocavamo
    note: 'Lo stesso schema vale con altri temi del passato. Un verbo composto mantiene il nome separato: *بازی می‌کردیم*.'
  fa.a2.unit23.lesson02.teach.past_states:
    title: Stati nel passato con بودن e داشتن
    gloss: ero un bambino; il quartiere era tranquillo; avevamo un grande cortile
    note: Usa *بودن* e *داشتن* al passato per le descrizioni di sfondo. Sono stati, quindi qui le forme naturali sono *بودم، بود، داشتیم*, senza il *می‌* abituale.
  fa.a2.unit23.lesson03.teach.simple_contrast:
    title: Abitudine o evento singolo
    gloss: Andavo a scuola ogni giorno. Ieri sono andato a scuola.
    note: '*هر روز می‌رفتم* indica un passato ripetuto. *دیروز رفتم* è un solo viaggio concluso. L''espressione di tempo e la presenza o assenza di *می‌* lavorano insieme.'
  fa.a2.unit23.lesson03.teach.negative_habit:
    title: Passato abituale negativo
    gloss: non andavo; non leggevo; non giocavo
    note: 'Metti *نـ* davanti a *می‌*: *نمی‌رفتم، نمی‌خوندم، بازی نمی‌کردم*. Scrivi *نمی‌* unito con uno ZWNJ davanti al tema.'
  fa.a2.unit23.lesson04.teach.then_now:
    title: Prima e adesso
    gloss: Prima il nostro quartiere era tranquillo; adesso è affollato.
    note: Abbina *قبلا* o *اون موقع* alla descrizione al passato, poi *حالا* al contrasto con il presente.
  fa.a2.unit23.lesson05.teach.reading:
    title: Il quartiere dell'infanzia
    gloss: Quando ero bambino, il nostro quartiere era tranquillo. Avevamo una casa con un grande cortile. Andavo a scuola a piedi ogni giorno. Il pomeriggio giocavo a calcio nel cortile. Ora il quartiere è affollato e non ci gioco più.
    note: Il brano unisce uno stato passato, abitudini ripetute e un contrasto con il presente.
  fa.a2.unit23.lesson06.teach.names:
    title: Sara e Nima
    gloss: Sara, Nima
    note: Sara e Nima sono gli amici che già conosci in questa conversazione.
    example_gloss:
    - Sara parla della sua infanzia.
    - Nima parla del suo quartiere.
  fa.a2.unit23.lesson06.teach.turn01:
    title: Sara chiede del vecchio quartiere
    gloss: Quando eri bambino, com'era il vostro quartiere?
    note: Sara chiede di uno stato passato usando una forma passata del verbo essere.
  fa.a2.unit23.lesson06.teach.turn02:
    title: Nima descrive la sua infanzia
    gloss: Il nostro quartiere era tranquillo. Avevamo una casa con un grande cortile. Ogni giorno andavo a scuola a piedi e il pomeriggio giocavo a calcio nel cortile. E tu?
    note: Nima mescola stati passati (era, avevamo) e abitudini ripetute (andavo a piedi, giocavo).
  fa.a2.unit23.lesson06.teach.turn03:
    title: Sara aggiunge un contrasto tra prima e adesso
    gloss: La nostra scuola era vicina. Ogni estate giocavamo nel parco. Ora il parco è lontano e non ci gioco più.
    note: Sara conclude con *حالا ... دیگه ... نمی‌کنم* per contrapporre il presente al passato.
