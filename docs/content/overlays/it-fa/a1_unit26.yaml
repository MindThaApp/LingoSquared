    title: È il mio cane
    gloss: è il mio cane
    note: '*سگمه* unisce *سگم* (il mio cane) della lezione 3 e la stessa desinenza *-ه* «è» di *منه*: «è il mio cane».'
  fa.a1.unit26.lesson06.teach.khoshgel_word:
