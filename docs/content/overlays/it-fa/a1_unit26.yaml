teaching:
  fa.a1.unit26.lesson01.teach.man_review:
    title: io
    gloss: io
    note: '*من*, ormai ben noto, ricompare qui per parlare del proprio animale.'
  fa.a1.unit26.lesson01.teach.oo_review:
    title: Lui / lei
    gloss: lui / lei
    note: '*او* ricompare qui.'
  fa.a1.unit26.lesson01.teach.daram_family_review:
    title: Ho / ha / non ho
    gloss: ho / ha / non ho
    note: '*دارم*/*داره* funzionano allo stesso modo con un animale. *ندارم* (non ho) e *نداره* (non ha) sono le forme negative corrispondenti: li hai già visti insieme nel dialogo sulla famiglia dell''unità 4.'
  fa.a1.unit26.lesson01.teach.heyvan_word:
    title: Animale
    gloss: animale
    note: '*حیوان* significa «animale».'
    example_gloss: Il gatto è un animale.
  fa.a1.unit26.lesson01.teach.heyvane_khoonegi_phrase:
    title: Animale domestico
    gloss: animale domestico
    note: '*حیوان خونگی* significa letteralmente «animale di casa»: il modo standard per dire «animale domestico».'
  fa.a1.unit26.lesson01.teach.sag_word:
    title: Cane
    gloss: cane
    note: '*سگ* significa «cane».'
    example_gloss: Ho un cane.
  fa.a1.unit26.lesson01.teach.gorbe_word:
    title: Gatto
    gloss: gatto
    note: '*گربه* significa «gatto».'
    example_gloss: Ha un gatto.
  fa.a1.unit26.lesson02.teach.parande_word:
    title: Uccello
    gloss: uccello
    note: '*پرنده* significa «uccello».'
    example_gloss: Lei ha un uccellino.
  fa.a1.unit26.lesson02.teach.mahi_word:
    title: Il pesce
    gloss: pesce
    note: '*ماهی* significa «pesce».'
    example_gloss: Ho un pesce.
  fa.a1.unit26.lesson02.teach.dari_review:
    title: Tu hai
    gloss: hai
    note: '*داری* ricompare qui, nella stessa forma informale della seconda persona.'
  fa.a1.unit26.lesson02.teach.have_a_pet_question:
    title: Hai un animale domestico?
    gloss: hai un animale domestico?
    note: '*حیوان خونگی داری؟* unisce *حیوان خونگی* della lezione 1 e *داری*: il modo naturale per chiedere a qualcuno se ha un animale domestico.'
  fa.a1.unit26.lesson02.teach.are_review:
    title: Sì
    gloss: sì
    note: '*آره* è la parola colloquiale di uso comune per «sì».'
  fa.a1.unit26.lesson03.teach.esm_review:
    title: Nome
    gloss: nome
    note: '*اسم* funziona allo stesso modo per il nome di un animale.'
  fa.a1.unit26.lesson03.teach.esmesh_chiye_phrase:
    title: Come si chiama?
    gloss: come si chiama?
    note: '*اسمش چیه؟* unisce il suffisso possessivo *-ش* (già visto in *قدش*/*موهاش* nell''unità 25) e *چیه؟* dell''unità 2: «come si chiama?»'
  fa.a1.unit26.lesson03.teach.ghaza_word:
    title: Il cibo
    gloss: cibo
    note: '*غذا* è la stessa parola usata per il cibo degli animali.'
    example_gloss: Mi piace il cibo.
  fa.a1.unit26.lesson03.teach.midam_word:
    title: Do / do da mangiare
    gloss: do / do da mangiare
    note: '*می‌دم* (letteralmente «do»), già intravisto in *گوش می‌دم* dell''unità 24, è il verbo naturale per dare da mangiare a un animale insieme a *غذا*.'
  fa.a1.unit26.lesson03.teach.sagam_word:
    title: Il mio cane
    gloss: il mio cane
    note: '*سگم* unisce *سگ* al suffisso possessivo *-م*: «il mio cane», con lo stesso schema fuso di *اسمم* dell''unità 2.'
  fa.a1.unit26.lesson03.teach.feed_my_dog_phrase:
    title: Do da mangiare al mio cane.
    gloss: Do da mangiare al mio cane.
    note: '*سگم رو غذا می‌دم* usa *رو* (il marcatore dell''oggetto, già visto in *قهوه رو بیشتر دوست دارم* nell''unità 14) per indicare *سگم* come chi riceve il cibo.'
  fa.a1.unit26.lesson04.teach.che_rangiye_review:
    title: Di che colore è?
    gloss: di che colore è?
    note: '*چه رنگیه؟* si usa allo stesso modo per descrivere il colore di un animale.'
  fa.a1.unit26.lesson04.teach.sefid_word:
    title: Bianco
    gloss: bianco
    note: '*سفید* ricompare qui per il colore di un animale. *گربه‌ی* è la forma con ezafe di *گربه* usata davanti al possessore, come in *گربه‌ی من* (il mio gatto), con lo stesso schema di *خونه‌ی من* dell''unità 19, usato per i nomi che finiscono in vocale invece di un suffisso fuso.'
    example_gloss: Il mio gatto è bianco.
  fa.a1.unit26.lesson04.teach.koochik_word:
