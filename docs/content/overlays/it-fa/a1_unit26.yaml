    gloss: uno / un
    note: '*یک* è usato qui come articolo indeterminativo «un/una».'
  fa.a1.unit26.lesson05.teach.va_review:
    title: E
    gloss: e
    note: '*و* significa «e», già usato così nelle unità 14, 24 e 25.'
  fa.a1.unit26.lesson05.teach.pashmak_name:
    title: Pashmak
    gloss: Pashmak
    note: '*پشمک* (letteralmente «zucchero filato») è un nome davvero comune per gli animali domestici in Iran: è il nome del gatto di Sara.'
    example_gloss: Il gatto di Sara si chiama Pashmak.
  fa.a1.unit26.lesson05.teach.har_rooz_review:
