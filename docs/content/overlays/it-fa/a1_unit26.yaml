    title: Ringraziare
    gloss: grazie
    note: '*ممنون* ricompare qui come naturale frase di chiusura.'
  fa.a1.unit26.lesson06.teach.dialogue_line1:
    title: 'Nima: Di chi è questo gatto?'
    gloss: Di chi è questo gatto?
  fa.a1.unit26.lesson06.teach.dialogue_line2:
    title: 'Sara: È il mio gatto. Si chiama Pashmak.'
    gloss: È il mio gatto. Si chiama Pashmak.
  fa.a1.unit26.lesson06.teach.dialogue_line3:
    title: 'Nima: Che colore è?'
    gloss: Di che colore è?
  fa.a1.unit26.lesson06.teach.dialogue_line4:
    title: 'Sara: Bianco e piccolo.'
    gloss: Bianco e piccolo.
  fa.a1.unit26.lesson06.teach.dialogue_line5:
    title: 'Nima: Molto carino!'
    gloss: Molto carino!
  fa.a1.unit26.lesson06.teach.dialogue_line6:
    title: 'Sara: Grazie!'
    gloss: Grazie!
