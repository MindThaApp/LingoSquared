    title: Lui/lei dà / dà da mangiare
    gloss: lui/lei dà / dà da mangiare
    note: '*می‌ده* è la forma colloquiale della terza persona dello stesso verbo di *می‌دم* della lezione 3 (do/dò da mangiare).'
  fa.a1.unit26.lesson05.teach.reading_text:
    title: 'Lettura: il gatto di Sara'
    gloss: Sara ha un gatto. Si chiama Pashmak. Pashmak è bianco e piccolo. Sara dà da mangiare a Pashmak ogni giorno.
    note: 'Questo brano riutilizza tutte le strutture delle lezioni 1-4, quasi senza vocaboli nuovi: devi solo riconoscerle in un testo continuo.'
  fa.a1.unit26.lesson06.teach.in_word:
