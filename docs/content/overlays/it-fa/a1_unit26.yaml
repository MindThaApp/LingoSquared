course:
  title: Persiano A1
  description: 'Persiano iraniano per principianti: nominare i più comuni animali domestici (cane, gatto, uccello, pesce), chiedere «Hai un animale?», dire il nome di un animale e dargli da mangiare, descriverne colore e dimensioni, un breve brano di lettura sul gatto di سارا, پشمک, e un dialogo finale tra سارا e نیما che ammirano پشمک.'
