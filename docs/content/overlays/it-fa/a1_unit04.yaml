teaching:
  fa.a1.unit04.lesson01.teach.madar:
    title: Madre
    gloss: madre
    note: مادر è la parola neutra, scritta e formale, per «madre».
    example_gloss: Mia madre è gentile.
  fa.a1.unit04.lesson01.teach.maman:
    title: Mamma
    gloss: mamma
    note: مامان è la parola parlata di tutti i giorni, quella che usa la maggior parte delle famiglie.
    example_gloss: Mamma, ho fame.
  fa.a1.unit04.lesson01.teach.pedar:
    title: Padre
    gloss: padre
    note: پدر è la parola neutra, scritta e formale, per «padre».
    example_gloss: Mio padre è medico.
  fa.a1.unit04.lesson01.teach.baba:
    title: Papà
    gloss: papà
    note: بابا è la parola parlata di tutti i giorni, quella che usa la maggior parte delle famiglie.
    example_gloss: Papà, dove sei?
  fa.a1.unit04.lesson01.teach.baradar:
    title: Fratello
    gloss: fratello
    note: برادر; la forma parlata e affettuosa داداش compare più avanti in questa unità.
    example_gloss: Ho un fratello.
  fa.a1.unit04.lesson01.teach.khahar:
    title: Sorella
    gloss: sorella
    note: خواهر, la parola standard per «sorella».
    example_gloss: Mia sorella è studentessa.
  fa.a1.unit04.lesson01.teach.register_note:
    title: Parole formali e parole di tutti i giorni
    gloss: Mamma e papà sono come madre e padre, ma più familiari.
    note: 'Il persiano ha due registri reali per i genitori, non una rigida divisione formale/informale: مامان/بابا sono i modi in cui la maggior parte delle persone chiama i propri genitori, anche in situazioni di cortesia.'
  fa.a1.unit04.lesson02.teach.daram:
    title: Ho
    gloss: ho
    note: '*دارم* è la prima persona di *داشتن* («avere»), il verbo fondamentale per parlare della famiglia.'
  fa.a1.unit04.lesson02.teach.yek:
    title: Uno
    gloss: uno
    note: یک, usato davanti a un nome contato, per esempio یک برادر (un fratello).
    example_gloss: Ho una sorella.
  fa.a1.unit04.lesson02.teach.one_brother:
    title: Ho un fratello.
    gloss: Ho un fratello.
    note: 'Ordine delle parole: soggetto, quantità + nome, verbo, il tipico ordine SOV del persiano.'
  fa.a1.unit04.lesson02.teach.no_sister:
    title: Non ho sorelle.
    gloss: Non ho sorelle.
    note: ندارم è la forma negativa di دارم; non serve nessuna parola per «una».
  fa.a1.unit04.lesson02.teach.family_big:
    title: La mia famiglia è grande.
    gloss: La mia famiglia è grande.
    note: بزرگه è la forma parlata contratta di «بزرگ است» (è grande).
  fa.a1.unit04.lesson02.teach.family_small:
    title: La nostra famiglia è piccola.
    gloss: La nostra famiglia è piccola.
    note: کوچیکه è la forma parlata contratta di «کوچک است» (è piccolo), con la pronuncia colloquiale کوچیک al posto di کوچک scritto.
  fa.a1.unit04.lesson03.teach.pedarbozorg:
    title: Nonno
    gloss: nonno
    note: پدربزرگ, letteralmente «padre grande», si usa per entrambi i lati della famiglia.
    example_gloss: Mio nonno è anziano.
  fa.a1.unit04.lesson03.teach.madarbozorg:
    title: Nonna
    gloss: nonna
    note: مادربزرگ, letteralmente «madre grande», si usa per entrambi i lati della famiglia.
    example_gloss: Mia nonna è gentile.
  fa.a1.unit04.lesson03.teach.amoo:
    title: Zio paterno
    gloss: zio (fratello del padre)
    note: عمو indica specificamente il fratello del padre, non è una parola generica per «zio».
    example_gloss: Mio zio vive a Teheran.
  fa.a1.unit04.lesson03.teach.amme:
    title: Zia paterna
    gloss: zia (sorella del padre)
    note: عمه indica specificamente la sorella del padre.
    example_gloss: Mia zia è insegnante.
  fa.a1.unit04.lesson03.teach.dayi:
    title: Zio materno
    gloss: zio (fratello della madre)
    note: 'دایی indica specificamente il fratello della madre: il persiano distingue da quale lato della famiglia viene ogni zio e ogni zia.'
    example_gloss: Mio zio (materno) è ingegnere.
  fa.a1.unit04.lesson03.teach.khale:
    title: Zia materna
    gloss: zia (sorella della madre)
    note: خاله indica specificamente la sorella della madre.
    example_gloss: Mia zia (materna) vive a Isfahan.
  fa.a1.unit04.lesson03.teach.register_note:
    title: Lato paterno e lato materno
    gloss: Lo zio e la zia paterni sono dal lato del padre; lo zio e la zia materni sono dal lato della madre.
    note: 'Questa distinzione a quattro (عمو/عمه contro دایی/خاله) non ha un''unica parola corrispondente in italiano: in italiano si dice semplicemente «zio»/«zia» per entrambi i lati.'
  fa.a1.unit04.lesson04.teach.chand_ta:
    title: Quanti
    gloss: quanti
    note: چند تا si usa, in modo informale, prima di contare persone o cose.
    example_gloss: Quante sorelle hai?
  fa.a1.unit04.lesson04.teach.polite_question:
    title: Quanti fratelli e sorelle ha? (formale)
    gloss: Quanti fratelli hai?
    note: دارید è la forma di cortesia/plurale di «avere», in accordo con شما.
  fa.a1.unit04.lesson04.teach.spoken_question:
    title: Quanti fratelli e sorelle hai? (informale)
    gloss: Quanti fratelli hai?
    note: داری è la forma informale singolare, usata con un coetaneo o con qualcuno più giovane.
  fa.a1.unit04.lesson04.teach.family_size_question:
    title: Quante persone ci sono nella tua famiglia?
    gloss: Quante persone ci sono nella tua famiglia?
    note: نفر è il classificatore per le persone; نفرن è la forma contratta parlata di «نفر هستند» (sono ... persone).
  fa.a1.unit04.lesson04.teach.answer_example:
    title: 'Siamo in quattro: io, mia mamma, mio papà e mio fratello.'
    gloss: 'Siamo in quattro: io, mia mamma, mio papà e mio fratello.'
    note: نفریم = «نفر هستیم» (siamo in ... persone) contratto, registro parlato.
  fa.a1.unit04.lesson05.teach.showhar:
    title: Marito
    gloss: marito
    note: شوهر è la parola standard per «marito».
    example_gloss: Mio marito è ingegnere.
  fa.a1.unit04.lesson05.teach.zan:
    title: Moglie
    gloss: moglie
    note: زن significa anche «donna» in generale; il contesto chiarisce il significato.
    example_gloss: Mia moglie è insegnante.
  fa.a1.unit04.lesson05.teach.motahel:
    title: Sposato
    gloss: sposato/a
    note: متأهل è un aggettivo neutro e di uso comune per lo stato civile.
    example_gloss: Lui/lei è sposato/a.
  fa.a1.unit04.lesson05.teach.mojarad:
    title: Single
    gloss: single (non sposato)
    note: مجرد è la parola standard per «non sposato».
    example_gloss: Sono single.
  fa.a1.unit04.lesson05.teach.i_am_single:
    title: Sono single.
    gloss: Sono single.
    note: مجردم = مجرد + م («sono»), lo stesso schema del suffisso di prima persona di خوبم («sto bene»).
  fa.a1.unit04.lesson05.teach.i_am_married:
    title: Sono sposato/a.
    gloss: Sono sposato/a.
    note: متأهلم = متأهل + م («sono»), lo stesso schema di مجردم.
  fa.a1.unit04.lesson05.teach.nave:
    title: Nipote (di nonni)
    gloss: nipote (di nonni)
    note: 'نوه vale sia per il nipote maschio sia per la nipote femmina: in persiano qui non si specifica il genere.'
    example_gloss: Ha un nipote.
  fa.a1.unit04.lesson05.teach.example:
    title: Mio fratello è sposato; ha un figlio maschio.
    gloss: Mio fratello è sposato; ha un figlio maschio.
    note: متأهله = «متأهل است» (è sposato) contratto, registro parlato; داره = «دارد» (ha) nel registro parlato.
  fa.a1.unit04.lesson06.teach.in_photo:
    title: È questa la foto della tua famiglia?
    gloss: È questa la foto della tua famiglia?
    note: 'خانواده‌ته = «خانواده‌ی تو است» (è la tua famiglia) contratto: è un schema parlato molto comune.'
  fa.a1.unit04.lesson06.teach.yes_mom_dad:
    title: Sì. Questa è mia mamma, questo è mio papà.
    gloss: Sì. Questa è mia mamma, questo è mio papà.
    note: '*آره* è il «sì» del parlato (contro il formale *بله*). *مامانمه* è *مامانم* («la mia mamma») più la terminazione «è» del parlato.'
  fa.a1.unit04.lesson06.teach.who_is_he:
    title: Chi è questo signore?
    gloss: Chi è questo signore?
    note: کیه = «کی است» (chi è) contratto, registro parlato.
  fa.a1.unit04.lesson06.teach.brother_answer:
    title: È mio fratello. Ho un fratello, non ho sorelle.
    gloss: È mio fratello. Ho un fratello, non ho sorelle.
    note: داداش è la parola affettuosa e quotidiana per «fratello», usata qui al posto del più neutro برادر della lezione 1.
  fa.a1.unit04.lesson06.teach.opposite_family:
    title: 'La mia famiglia è l''opposto: ho due sorelle, non ho fratelli.'
    gloss: 'La mia famiglia è l''opposto: ho due sorelle, non ho fratelli.'
    note: برعکسه = «برعکس است» (è l'opposto) contratto.
  fa.a1.unit04.lesson06.teach.closing:
    title: Allora anche la tua famiglia è vivace!
    gloss: Allora anche la tua famiglia è vivace!
    note: 'شلوغه = «شلوغ است» (è affollata/vivace) contratto: un modo caloroso e comune per descrivere una famiglia con diversi figli.'
  fa.a1.unit04.lesson06.teach.formal_register_note:
    title: 'Registro formale: ha / non ha / è'
    gloss: 'Parlato: ha, non ha. Scritto formale: ha, non ha; è mio fratello.'
    note: دارد/ندارد/است sono le forme scritte formali delle forme parlate داره/نداره usate in tutto questo dialogo; nello scritto formale anche l'affettuoso داداش lascia il posto al neutro برادر.
