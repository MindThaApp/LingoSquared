teaching:
  fa.a2.unit50.changing_arrangement.lesson01.teach.arrangement_words:
    title: Un appuntamento e come cambiarlo
    gloss: appuntamento, il nostro appuntamento, cambiare, domani
    note: '*قرار* è un appuntamento per incontrarsi. *قرارمون* significa «il nostro appuntamento» (*ـمون* significa «nostro»). *عوض کردن* significa «cambiare» e si usa con *رو*.'
    example_gloss:
    - Domani ho un appuntamento con Nima.
    - Stiamo cambiando il nostro appuntamento.
    - Oggi abbiamo cambiato il nostro appuntamento.
  fa.a2.unit50.changing_arrangement.lesson01.teach.sorry_words:
    title: Scusa, purtroppo, non posso
    gloss: scusa / mi scusi, purtroppo, non posso, non possiamo
    note: '*ببخشید* e *متأسفانه* addolciscono una cattiva notizia. *نمی‌تونم* significa «non posso» e *نمی‌تونیم* significa «non possiamo».'
    example_gloss:
    - Scusa, domani non posso venire.
    - Purtroppo domani ho da lavorare.
    - Purtroppo domani Nima non può venire.
  fa.a2.unit50.changing_arrangement.lesson01.teach.delay_words:
    title: Ritardi e impegni
    gloss: ritardo, sono impegnato/a, urgente
    note: '*تأخیر دارم* dice che sei in ritardo. *گرفتارم* significa che sei impegnato/a, e *فوری* descrive qualcosa di urgente.'
    example_gloss:
    - Sono in ritardo.
    - Sono impegnato/a; non posso venire.
    - Ho del lavoro urgente.
  fa.a2.unit50.changing_arrangement.lesson01.teach.polite_change:
    title: Una richiesta cortese di cambiare
    gloss: Scusa, possiamo cambiare il nostro appuntamento?
    note: '*می‌شه … ؟* chiede con cortesia se una cosa è possibile. Il verbo termina in *ـیم* («noi») perché la richiesta è fatta con «noi».'
  fa.a2.unit50.changing_arrangement.lesson01.teach.ask_to_change:
    title: 'Due modi per chiedere: می‌شه e می‌تونیم'
    gloss: È possibile cambiare il nostro appuntamento? Possiamo cambiare il nostro appuntamento?
    note: Entrambe le domande sono cortesi. *می‌شه* è la forma parlata più usuale; *می‌تونیم* suona un po' più diretta. Dopo entrambe, il verbo è nella forma *کنیم*, non *می‌کنیم*.
  fa.a2.unit50.changing_arrangement.lesson02.teach.reason_words:
    title: Dare un motivo
    gloss: perché, devo / dobbiamo (dovere), lavoro, sono malato/a
    note: '*چون* introduce il motivo e può stare all''inizio o dopo la frase principale. *باید کار کنم* significa «devo lavorare».'
    example_gloss:
    - Non posso venire perché sto male.
    - Dato che devo lavorare, arrivo tardi.
    - Dato che ho da lavorare, non posso.
  fa.a2.unit50.changing_arrangement.lesson02.teach.so_phrase:
    title: 'Prima il motivo, poi il risultato: برای همین'
    gloss: Sto male, perciò non posso venire.
    note: '*برای همین* significa «per questo». Si usa dopo il motivo al posto di *چون*; non mettere entrambi nella stessa frase.'
  fa.a2.unit50.changing_arrangement.lesson02.teach.new_time:
    title: Giorni e ore per un nuovo orario
    gloss: giovedì, venerdì, le quattro, le sei
    note: Di' prima il giorno e poi *ساعت* più il numero.
    example_gloss:
    - Venerdì alle quattro ho tempo.
    - Giovedì alle sei posso venire.
    - Domani alle sei ho da lavorare.
  fa.a2.unit50.changing_arrangement.lesson02.teach.is_it_good:
    title: Proporre un orario
    gloss: Venerdì alle quattro ti va bene? Puoi venire?
    note: '*برات خوبه؟* chiede se un orario va bene a una persona che conosci bene. A qualcuno a cui dai del *شما*, si dice *براتون خوبه؟*.'
  fa.a2.unit50.changing_arrangement.lesson02.teach.reason_then_time:
    title: Spostare un appuntamento in tre passi
    gloss: Domani non posso venire perché devo lavorare. Venerdì alle quattro ti va bene?
    note: Prima dì che non puoi venire, poi dai il motivo con *چون*, poi proponi un nuovo giorno e un nuovo orario. Un motivo rende la richiesta più cortese.
  fa.a2.unit50.changing_arrangement.lesson03.teach.finish_words:
    title: Finire e telefonare
    gloss: è finito, finisce / sarà finito, ti chiamo, chiamami
    note: '*تموم شد* è al passato («è finito»); *تموم بشه* è la forma usata dopo *وقتی* quando si parla del futuro.'
    example_gloss:
    - Il mio lavoro è finito.
    - Il mio lavoro finisce alle sei.
    - Ti chiamo domani.
    - Chiamami, per favore.
  fa.a2.unit50.changing_arrangement.lesson03.teach.confirm_or_postpone:
    title: Confermare o rimandare
    gloss: confermato, indietro / più tardi, rimandiamo (mettiamo)
    note: '*قطعی* dice che un appuntamento è confermato. *عقب بندازیم* è il modo parlato naturale per dire «rimandiamolo».'
    example_gloss:
    - Il nostro appuntamento è stato confermato.
    - Rimandiamo il nostro appuntamento.
  fa.a2.unit50.changing_arrangement.lesson03.teach.when_clause:
    title: وقتی con il futuro e con il passato
    gloss: Quando avrò finito di lavorare, ti chiamerò. Quando ho finito di lavorare, ti ho chiamato.
    note: Per il futuro, la frase dopo *وقتی* usa la forma con *ب* (*تموم بشه*) e il verbo principale è al presente semplice (*زنگ می‌زنم*). Per il passato, entrambi i verbi sono al passato.
  fa.a2.unit50.changing_arrangement.lesson03.teach.before_after:
    title: قبل از اینکه e بعد از اینکه
    gloss: Prima di partire, ti chiamo. Dopo che sarò arrivato/a, ti chiamo.
    note: '*قبل از اینکه* («prima che») e *بعد از اینکه* («dopo che») sono seguiti da un verbo con *ب* quando il progetto è nel futuro: *برم*, *برسم*.'
  fa.a2.unit50.changing_arrangement.lesson03.teach.time_phrases:
    title: Lo stesso schema al passato
    gloss: Quando sono arrivato/a, ti ho chiamato. Dopo che sono arrivato/a, ti ho chiamato.
    note: 'Al passato, la frase usa un normale verbo al passato: *رسیدم*. Confrontalo con il futuro, *برسم*.'
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_words:
    title: Se, adatto, che ne dici, parrucchiere, bicicletta
    gloss: se, non va bene, che ne dici di...?, parrucchiere, bicicletta
    note: '*چطوره؟* propone un''alternativa: *دوشنبه چطوره؟* significa «Che ne dici di lunedì?»'
    example_gloss:
    - Che ne dici di lunedì?
    - Sabato non ti va bene?
    - Giovedì ho un appuntamento dal parrucchiere.
    - Voglio una bicicletta.
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_clause:
    title: اگه per una situazione possibile
    gloss: Se hai tempo, possiamo andare sabato. Se piove, cambiamo il nostro appuntamento.
    note: Dopo *اگه* si usa la forma con *ب* oppure *داشته باشی*; la frase principale è al presente semplice. Metti prima la parte con *اگه*, seguita da una virgola.
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_cant:
    title: Piano B con اگه
    gloss: Se non puoi venire, chiamami. Se sabato non ti va bene, che ne dici di lunedì?
    note: '*اگه … نمی‌تونی* offre all''altra persona una via d''uscita, e *چطوره؟* propone un nuovo giorno.'
  fa.a2.unit50.changing_arrangement.lesson04.teach.polite_please:
    title: Richieste cortesi a un'attività
    gloss: Per favore, mi dia un altro appuntamento. Posso cambiare il mio appuntamento?
    note: Con un parrucchiere, un negozio o un noleggio usa *لطفا* e il verbo alla forma *شما* (*بدید*). *می‌شه … ؟* va bene sia con *شما* sia con *تو*.
  fa.a2.unit50.changing_arrangement.lesson05.teach.reading:
    title: Un messaggio per spostare un incontro
    gloss: Sara, ciao! Purtroppo domani non posso venire, perché devo lavorare. Possiamo cambiare il nostro appuntamento? Venerdì alle quattro ti va bene? Se venerdì non puoi, sabato alle dieci posso. Quando avrò finito di lavorare, ti chiamo.
    note: Leggi una prima volta per cercare il motivo, poi una seconda volta per i due orari proposti.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn01:
    title: Sara ricorda l'appuntamento a Nima
    gloss: Nima, domani alle dieci abbiamo il nostro appuntamento.
    note: Sara parla dell'appuntamento.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn02:
    title: Nima chiede di cambiare
    gloss: Scusa, Sara, purtroppo domani non posso venire, perché devo lavorare. Possiamo cambiare il nostro appuntamento?
    note: Nima si scusa, dà il motivo e chiede con cortesia.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn03:
    title: Sara accetta e propone venerdì
    gloss: Sì, non c'è problema. Venerdì alle dieci ti va bene?
    note: Sara accetta e propone un nuovo orario.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn04:
    title: Nima rifiuta e propone sabato
    gloss: Venerdì non posso, perché ho un appuntamento dal dottore. Che ne dici di sabato?
    note: Nima dà un motivo e un'alternativa.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn05:
    title: Sara accetta sabato
    gloss: Sabato alle dieci va bene. Prenoto le biciclette per sabato.
    note: Anche le biciclette passano al nuovo giorno.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn06:
    title: Nima ringrazia Sara
    gloss: Perfetto, grazie! Quando avrò finito di lavorare, ti chiamo.
    note: Nima chiude con una frase temporale.
