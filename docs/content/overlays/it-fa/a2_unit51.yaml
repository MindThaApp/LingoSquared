teaching:
  fa.a2.unit51.short_story.lesson01.teach.place_words:
    title: Luoghi e dolcezze per una gita
    gloss: zoo, barca, parco divertimenti, gelato
    note: '*سوار قایق شدن* significa «salire su una barca / fare un giro in barca».'
    example_gloss:
    - Ieri siamo andati allo zoo.
    - Siamo saliti su una barca.
    - Domani andiamo al parco divertimenti.
    - Abbiamo mangiato il gelato.
  fa.a2.unit51.short_story.lesson01.teach.we_past_verbs:
    title: 'Che cosa abbiamo fatto: il passato con ـیم'
    gloss: siamo andati, abbiamo visto, abbiamo comprato, abbiamo mangiato, abbiamo preso, siamo diventati / siamo saliti
    note: La desinenza del passato per «noi» è *ـیم*. Di solito il verbo sta alla fine della frase.
    example_gloss:
    - Abbiamo visto leoni ed elefanti.
    - Abbiamo comprato i biglietti.
    - Abbiamo fatto delle foto.
    - Siamo saliti su una barca.
  fa.a2.unit51.short_story.lesson01.teach.order_words:
    title: Parole per mettere in ordine gli eventi
    gloss: prima, poi / dopo, dopo di che, alla fine
    note: '*بعدش* e *بعد* significano entrambi «poi, dopo di che». *آخرش* significa «alla fine» e introduce l''ultimo evento.'
    example_gloss:
    - Prima abbiamo comprato i biglietti.
    - Poi abbiamo visto un leone.
    - Dopo abbiamo fatto delle foto.
    - Alla fine abbiamo mangiato il gelato.
  fa.a2.unit51.short_story.lesson01.teach.tell_in_order:
    title: Raccontare una giornata in ordine
    gloss: Prima siamo andati allo zoo, poi siamo saliti su una barca, alla fine siamo andati al parco divertimenti.
    note: Un racconto segue l'ordine degli eventi. Metti *اول*, *بعدش* o *بعد*, e *آخرش* all'inizio di ogni parte, con un verbo al passato in ciascuna. Puoi omettere *ما* perché la desinenza *ـیم* indica già «noi».
  fa.a2.unit51.short_story.lesson02.teach.they_past_verbs:
    title: 'Che cosa hanno fatto loro: il passato con ـن'
    gloss: sono andati, hanno visto, hanno comprato, hanno mangiato, sono arrivati, sono tornati
    note: Al passato «loro» termina in *ـن* (*رفتن*) e «noi» termina in *ـیم* (*رفتیم*). Nel parlato la desinenza *ـن* ha la stessa forma dell'infinito, quindi è la frase a dirti di chi si tratta.
    example_gloss:
    - Sara e Nima ieri sono andati allo zoo.
    - Hanno visto un leone.
    - Hanno comprato i biglietti.
    - Alla fine sono tornati a casa.
  fa.a2.unit51.short_story.lesson02.teach.feeling_verbs:
    title: Ebbe paura, rise
    gloss: lui/lei ha avuto paura, lui/lei ha riso, loro hanno avuto paura, loro hanno riso
    note: '*ترسید* e *خندید* sono forme per «lui/lei»; *ترسیدن* e *خندیدن* sono le forme per «loro».'
    example_gloss:
    - Nima ha avuto paura.
    - Sara ha riso.
    - Sara e Nima hanno riso molto.
    - Hanno avuto paura.
  fa.a2.unit51.short_story.lesson02.teach.when_past:
    title: وقتی in un racconto
    gloss: Quando sono arrivati, hanno comprato i biglietti. Quando sono saliti sulla barca, Nima ha avuto paura.
    note: In un racconto, *وقتی* è seguito da un verbo al passato e poi dal verbo principale al passato. La parte con *وقتی* indica il momento, e la principale dice che cosa è successo allora.
  fa.a2.unit51.short_story.lesson02.teach.people_events:
    title: Iniziare un racconto
    gloss: Sara e Nima ieri sono andati allo zoo.
    note: Di solito un racconto comincia dicendo chi, quando e dove.
  fa.a2.unit51.short_story.lesson03.teach.progressive_forms:
    title: Che cosa era in corso
    gloss: stavamo andando, lui/lei stava andando, stavano mangiando, lui/lei stava facendo foto
    note: '*داشت* più un verbo con *می‌* indica un''azione che era in corso. Usalo per ciò che stava succedendo mentre accadeva qualcos''altro.'
    example_gloss:
    - Stavamo andando allo zoo.
    - Sara stava facendo foto.
    - Stavano mangiando il gelato.
    - Stavo facendo foto.
    - La barca stava avanzando.
  fa.a2.unit51.short_story.lesson03.teach.progressive_note:
    title: Due cose che accadono insieme
    gloss: Mentre la barca avanzava, Sara stava facendo foto.
    note: La prima parte descrive la scena (*قایق داشت می‌رفت*); la seconda dice che cos'altro stava succedendo (*سارا داشت عکس می‌گرفت*). Usa questa forma solo nelle frasi affermative, non in quelle negative.
  fa.a2.unit51.short_story.lesson03.teach.past_perfect_forms:
    title: Che cosa era già successo
    gloss: lui/lei aveva comprato, eravamo andati, erano arrivati, avevo visto
    note: '*بود/بودیم/بودن/بودم* dopo la forma in *ـه* del verbo significa «aveva/eravamo/avevano…», cioè il trapassato.'
    example_gloss:
    - Nima aveva comprato i biglietti.
    - C'eravamo già stati prima.
    - Erano arrivati.
    - Avevo già visto un leone.
  fa.a2.unit51.short_story.lesson03.teach.past_perfect_note:
    title: Qualcosa accaduto prima
    gloss: Quando siamo arrivati, Nima aveva già comprato i biglietti.
    note: Il trapassato mostra che un evento passato è avvenuto prima di un altro. I due eventi sono *رسیدیم* (dopo) e *خریده بود* (prima).
  fa.a2.unit51.short_story.lesson04.teach.habit_words:
    title: Ogni anno, quando ero bambino
    gloss: ogni anno, ero un bambino / ero una bambina, mia mamma
    note: '*هر سال* e *وقتی بچه بودم* indicano che qualcosa accadeva ripetutamente nel passato.'
    example_gloss:
    - Ogni anno andavamo al parco divertimenti.
    - Quando ero piccolo/a, siamo andati con mia mamma.
    - A mia mamma piacciono i parchi dei divertimenti.
  fa.a2.unit51.short_story.lesson04.teach.perfect_forms:
    title: Ci sei mai stato?
    gloss: finora / mai, sono stato, non sono stato, siamo stati, sei diventato / sei salito
    note: '*تا حالا* chiede o dice se qualcosa è successo fino a ora. Nel parlato si può usare anche il passato semplice: *تا حالا سوار قایق شدی؟*'
    example_gloss:
    - Non sono mai stato in un parco dei divertimenti.
    - Sei mai salito su una barca?
    - Siamo stati allo zoo.
  fa.a2.unit51.short_story.lesson04.teach.tense_choice:
    title: Quale passato per quale racconto?
    gloss: Siamo andati ieri; andavamo ogni anno; eravamo andati; finora siamo stati.
    note: Usa il passato semplice per un evento concluso, il passato con *می‌ـ* per un'abitudine, *بود* per il trapassato («avevo fatto») e *تا حالا* con la forma in *ـه* per l'esperienza fino a ora.
  fa.a2.unit51.short_story.lesson04.teach.ever_phrase:
    title: Chiedere di un'esperienza
    gloss: Sei mai salito su una barca? Sì, una volta.
    note: 'Una domanda breve e una risposta breve: *یه بار* significa «una volta».'
  fa.a2.unit51.short_story.lesson05.teach.reading:
    title: Una giornata fuori
    gloss: Ieri Sara e Nima sono andati allo zoo. Quando sono arrivati, Nima aveva già comprato i biglietti. Per prima cosa hanno visto i leoni e gli elefanti. Poi sono saliti su una barca. Mentre la barca andava, Nima aveva paura, ma Sara faceva delle foto. Dopo sono andati al parco dei divertimenti e hanno riso tanto. Alla fine hanno mangiato un gelato e sono tornati a casa.
    note: Leggi una prima volta per l'ordine dei luoghi, poi di nuovo per capire chi ha fatto cosa.
  fa.a2.unit51.short_story.lesson06.teach.turn01:
    title: Nima comincia
    gloss: Sara, ieri ci siamo divertiti moltissimo!
    note: Nima apre parlando di com'è andata la giornata.
  fa.a2.unit51.short_story.lesson06.teach.turn02:
    title: Sara inizia il racconto
    gloss: Sì! Prima siamo andati allo zoo e abbiamo visto i leoni e gli elefanti.
    note: '*اول* dà inizio al racconto.'
  fa.a2.unit51.short_story.lesson06.teach.turn03:
    title: Nima continua
    gloss: Poi siamo saliti su una barca. Mentre la barca andava, io avevo paura.
    note: '*بعدش* continua la sequenza; *داشت می‌رفت* è lo sfondo.'
  fa.a2.unit51.short_story.lesson06.teach.turn04:
    title: Sara aggiunge
    gloss: Ma io ridevo e facevo foto! Dopo siamo andati al parco dei divertimenti.
    note: '*بعد* fa avanzare il racconto.'
  fa.a2.unit51.short_story.lesson06.teach.turn05:
    title: Nima conclude
    gloss: Alla fine abbiamo mangiato un gelato. Prima non ero mai stato in un parco dei divertimenti.
    note: '*نرفته بودم* guarda a qualcosa di precedente.'
  fa.a2.unit51.short_story.lesson06.teach.turn06:
    title: Sara organizza un'altra gita
    gloss: Allora la settimana prossima ci torniamo!
    note: Un programma espresso con il presente semplice.
