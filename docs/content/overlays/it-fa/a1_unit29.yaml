  description: 'Persiano iraniano per principianti: nominare i dispositivi di uso quotidiano (telefono, computer, internet, app), le azioni con il telefono (mandare un messaggio, chiamare, fare una foto, scaricare un''app), chiedere e dire quante volte usi il telefono (*هر روز چند بار از گوشیت استفاده می‌کنی؟*), un brano sulle abitudini di *نیما* e *سارا* con i dispositivi e un dialogo finale tra *نیما* e *سارا* su come usano la tecnologia.'
