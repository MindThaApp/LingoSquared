teaching:
  fa.a2.unit22.lesson01.teach.people_time:
    title: Persone e tempo
    gloss: io, tu, Sara, Nima, oggi, mattina, tardi
    note: '*امروز صبح* significa «stamattina». In persiano spesso si omette *من* perché la desinenza del verbo indica già «io».'
    example_gloss:
    - Stamattina mi sono svegliato tardi.
    - Oggi Sara ha chiamato Nima.
  fa.a2.unit22.lesson01.teach.morning_nouns:
    title: Parole del mattino e degli spostamenti
    gloss: casa, doccia, vestiti, colazione, chiave, porta, macchina, autobus
    note: '*صبحونه* è la forma parlata abituale di «colazione»; nello scritto curato si usa *صبحانه*.'
    example_gloss:
    - Ho fatto la doccia a casa.
    - Ho fatto colazione e mi sono vestito.
    - La mia chiave era in macchina.
  fa.a2.unit22.lesson01.teach.actions:
    title: Quattro azioni del mattino
    gloss: mi sono svegliato, ho fatto la doccia, mi sono vestito, ho fatto colazione
    note: Ogni espressione termina con un verbo leggero al passato semplice. Impara l'intera espressione come un'unica azione.
    example_gloss:
    - Stamattina mi sono svegliato.
    - Poi ho fatto la doccia.
    - Mi sono vestito e ho fatto colazione.
  fa.a2.unit22.lesson01.teach.compound_shape:
    title: I verbi composti al passato
    gloss: mi sono svegliato, ho fatto la doccia, mi sono vestito
    note: 'Molte azioni in persiano hanno due parti: un nome o un aggettivo più un verbo leggero. La seconda parte porta il tempo passato: *بیدار شدم*, *دوش گرفتم*, *لباس پوشیدم*.'
  fa.a2.unit22.lesson02.teach.more_actions:
    title: Porte, macchine, telefonate e lettere
    gloss: ho aperto la porta, ho chiuso la porta, ho avviato la macchina, ho telefonato, ho scritto una lettera
    note: '*رو* segna un complemento oggetto determinato nel parlato: *در رو* è «la porta» e *ماشین رو* è «la macchina».'
    example_gloss:
    - Ho aperto la porta e poi l'ho richiusa.
    - Ho avviato la macchina.
    - Ho chiamato Sara e ho scritto una lettera.
  fa.a2.unit22.lesson02.teach.small_words:
    title: Piccole parole utili
    gloss: a, un, e, ma, che cosa, sono arrivato
    note: '*یه* è la forma parlata normale di «un/uno». *رسیدم* chiude il racconto di uno spostamento: «sono arrivato».'
    example_gloss:
    - Ho chiamato Sara.
    - Ho scritto una lettera ma sono arrivato tardi.
  fa.a2.unit22.lesson02.teach.sequence:
    title: Parole per raccontare passo dopo passo
    gloss: prima, poi, dopo, alla fine, fino ad allora
    note: 'Usa queste parole per rendere chiaro l''ordine. *تا اون موقع* significa «per allora». Con questa espressione, l''evento precedente usa il trapassato (participio + بود): *اتوبوس رفته بود* = l''autobus era già partito. Eserciterai questa forma in un''unità successiva.'
    example_gloss:
    - Prima ho aperto la porta.
    - Dopo ho avviato la macchina.
    - Ormai era tardi; alla fine sono arrivato.
  fa.a2.unit22.lesson02.teach.light_verbs:
    title: Il verbo leggero porta il tempo
    gloss: ho aperto, ho acceso, ho telefonato, mi sono svegliato
    note: 'Il primo elemento indica l''azione; il secondo cambia in base al tempo e alla persona: *باز کردم*, *روشن کردم*, *زنگ زدم*, *بیدار شدم*.'
  fa.a2.unit22.lesson02.teach.ro_rule:
    title: رو per il determinato, یه per l'indeterminato
    gloss: Ho aperto la porta; ho scritto una lettera
    note: 'Usa *رو* parlato dopo un oggetto determinato: *در رو باز کردم*. Un oggetto indeterminato con *یه* di norma non ha *رو*: *یه نامه نوشتم*.'
  fa.a2.unit22.lesson03.teach.negative_forms:
    title: I verbi composti alla forma negativa
    gloss: non ho lavorato, non ho telefonato, non ho fatto colazione, non ho aperto la porta
    note: 'Metti *نـ* sul verbo leggero coniugato: *کار نکردم*, *زنگ نزدم*, *صبحونه نخوردم*. Il nome non cambia.'
  fa.a2.unit22.lesson03.teach.negative_place:
    title: Si nega il verbo leggero, non il nome
    gloss: نـ si attacca al verbo leggero
    note: Si dice *کار نکردم* e *زنگ نزدم*. Spostare la negazione sul nome dà una forma sbagliata.
  fa.a2.unit22.lesson03.teach.definite_indefinite:
    title: رو presente o assente
    gloss: Ho chiuso la porta; ho scritto una lettera
    note: '*در* è una porta nota, determinata, quindi prende *رو*. *یه نامه* è indeterminato, quindi non lo prende.'
  fa.a2.unit22.lesson04.teach.problem_actions:
    title: Quando la mattina va storta
    gloss: l'ho trovato, non l'ho trovato, mi sono dimenticato, ho perso l'autobus
    note: '*از دستم رفت* dice letteralmente che qualcosa «è uscito dalla mia mano»; riferito a un autobus significa «l''ho perso».'
    example_gloss:
    - Ho trovato la mia chiave.
    - Non ho trovato la mia chiave e ho perso l'autobus.
    - Mi sono dimenticato della lettera.
  fa.a2.unit22.lesson04.teach.question:
    title: E poi cos'è successo?
    gloss: Cos'è successo stamattina? E dopo cos'è successo?
    note: 'Queste domande invitano a un racconto ordinato: rispondi con parole che indicano la sequenza e con forme del passato.'
  fa.a2.unit22.lesson05.teach.reading:
    title: Una mattina andata storta
    gloss: Stamattina mi sono svegliato tardi. Prima ho fatto la doccia e mi sono vestito. Non ho fatto colazione. Dopo ho chiuso la porta, ma non sono riuscito a trovare la chiave. Ormai l'autobus era partito. Alla fine ho chiamato Sara e sono arrivato in macchina.
    note: Leggi una prima volta per cogliere l'ordine delle azioni, poi di nuovo per individuare i due passaggi che non sono andati come previsto.
  fa.a2.unit22.lesson06.teach.turn01:
    title: Sara chiede cos'è successo
    gloss: 'Sara chiede a Nima: Cos''è successo stamattina?'
    note: L'apertura chiede l'intera sequenza.
  fa.a2.unit22.lesson06.teach.turn02:
    title: Nima comincia il racconto
    gloss: Nima si è svegliato tardi
    showered and dressed: null
    but did not eat breakfast.: null
    note: Il passaggio negativo fa contrasto con quelli portati a termine.
  fa.a2.unit22.lesson06.teach.turn03:
    title: Sara chiede il passaggio successivo
    gloss: 'Sara chiede: E dopo cos''è successo?'
    note: '*بعدش* fa andare avanti il racconto.'
  fa.a2.unit22.lesson06.teach.turn04:
    title: Il problema dello spostamento
    gloss: Nima non ha trovato la chiave e ormai l'autobus era partito.
    note: I due fatti spiegano dove la mattina è andata storta.
  fa.a2.unit22.lesson06.teach.turn05:
    title: Sara chiede come è finita
    gloss: 'Sara chiede: Alla fine che cosa hai fatto?'
    note: '*آخرش* segnala l''ultimo passaggio.'
  fa.a2.unit22.lesson06.teach.turn06:
    title: Nima conclude il racconto
    gloss: Nima ha chiamato Sara
    started the car: null
    and finally arrived.: null
    note: Le ultime due azioni portate a termine risolvono il problema dello spostamento.
