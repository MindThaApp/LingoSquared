  fa.a2.unit12.lesson04.teach.turn01:
    title: Il dottor Rezaei chiede che cosa non va
    gloss: Il dottor Rezaei lo invita a parlare e gli chiede che cosa succede.
    note: Riprende la frase di apertura di questa lezione.
  fa.a2.unit12.lesson04.teach.turn02:
    title: Nima descrive il suo sintomo
    gloss: Nima dice di avere un forte mal di testa da tre giorni.
    note: 'Riprende lo schema della lezione 2: sintomo con durata e intensità.'
  fa.a2.unit12.lesson04.teach.turn03:
