    gloss: Il dottor Rezaei gli chiede se ha anche la febbre.
    note: '*تب هم دارید؟* chiede di un sintomo in più.'
  fa.a2.unit12.lesson04.teach.turn04:
    title: Nima risponde sulla febbre
    gloss: Nima dice di no, è solo mal di testa, ma forte.
    note: '*فقط ... ولی ...* (solo... ma...) restringe e contrappone.'
  fa.a2.unit12.lesson04.teach.turn05:
    title: Il dottor Rezaei dà le indicazioni
    gloss: 'Il dottor Rezaei dice: va bene, prenda questa ricetta e riposi per qualche giorno.'
    note: 'L''indicazione di cura del medico: ricetta e riposo.'
  fa.a2.unit12.lesson04.teach.turn06:
    title: Nima ringrazia il dottore
    gloss: 'Nima dice: certamente, grazie dottore.'
    note: '*چشم* è un modo cortese e deferente per dire «certamente» o «sarà fatto» a una persona con autorità.'
