teaching:
  fa.a2.unit42.lesson01.teach.clothes:
    title: Vestiti e borse
    gloss: camicia, scarpe, borsa, pantaloni, cappotto
    note: '*کفش* significa «scarpe» (una sola parola per il paio).'
    example_gloss:
    - Ho una camicia.
    - Ho un paio di scarpe.
    - Ho una borsa.
    - Ho un paio di pantaloni.
    - Ho un cappotto.
  fa.a2.unit42.lesson01.teach.colours:
    title: I colori
    gloss: bianco, nero, rosso, blu, verde
    note: I colori sono aggettivi e vanno dopo il nome.
    example_gloss:
    - La mia camicia è bianca.
    - La mia borsa è nera.
    - Le mie scarpe sono rosse.
    - I miei pantaloni sono blu.
    - Il mio cappotto è verde.
  fa.a2.unit42.lesson01.teach.size_age:
    title: Grande, piccolo, nuovo, vecchio
    gloss: grande, piccolo, nuovo, vecchio
    note: '*نو* e *قدیمی* indicano quanto qualcosa è nuovo o vecchio.'
    example_gloss:
    - La mia borsa è grande.
    - Le mie scarpe sono piccole.
    - Il mio cappotto non è nuovo.
    - La mia camicia è vecchia.
  fa.a2.unit42.lesson01.teach.ezafe:
    title: 'Nome + aggettivo: il suono di legame'
    gloss: una borsa rossa; una camicia bianca; scarpe nuove
    note: 'In persiano l''aggettivo segue il nome. Quando si parla, una breve vocale di legame *-e* (l''ezafe) li unisce: *کیف قرمز* si pronuncia «kif-e qermez». Dopo una consonante questa vocale non si scrive.'
  fa.a2.unit42.lesson02.teach.owners:
    title: I possessori
    gloss: Sara, Nima, chi, di chi è
    note: '*کیه؟* significa «chi è?» oppure «di chi è?».'
    example_gloss:
    - Di chi è questa borsa?
    - Di chi sono queste scarpe?
  fa.a2.unit42.lesson02.teach.owner_rule:
    title: Nome + possessore
    gloss: la borsa di Sara; le scarpe di Nima; la camicia del direttore
    note: 'Il possessore viene dopo la cosa posseduta, unito dalla stessa vocale di legame *-e*: *کیف سارا* si dice «kif-e Sara». Come in italiano («la borsa di Sara»), la cosa posseduta viene per prima, ma in persiano non c''è la preposizione «di»: c''è solo il legame -e.'
  fa.a2.unit42.lesson02.teach.whose:
    title: Di chi è?
    gloss: Di chi è questa borsa? La borsa di Sara.
    note: 'Chiedi con *این ... کیه؟* e rispondi con la cosa e il suo possessore. Per dire «è di Nima», attacca *است* al nome: *این کفش نیماست*.'
  fa.a2.unit42.lesson03.teach.things:
    title: Casa e abbigliamento
    gloss: casa, cappotto, sedia, tavolo
    note: '*خونه* finisce con una *ه* muta; *پالتو* finisce con la vocale *و*; *صندلی* finisce con *ی*.'
    example_gloss:
    - La casa è grande.
    - Il cappotto è nero.
    - La sedia è qui.
    - Il tavolo è laggiù.
  fa.a2.unit42.lesson03.teach.rule_h:
    title: 'Dopo una ه muta: ه‌ی'
    gloss: la casa grande; la casa di Nima
    note: 'Dopo una *ه* muta la vocale di legame si scrive *ی* con un mezzo spazio: *خونه‌ی بزرگ*, *خونه‌ی نیما*.'
  fa.a2.unit42.lesson03.teach.rule_v:
    title: Dopo و e ی
    gloss: il cappotto nero; il cappotto di Sara; la sedia di Nima
    note: 'Dopo *و* la vocale di legame si scrive *ی*: *پالتوی سیاه*. Dopo *ی* si pronuncia «-ye», ma non si scrive nulla in più: *صندلی نیما*.'
  fa.a2.unit42.lesson04.teach.materials:
    title: Materiali e un divano
    gloss: di pelle (agg.), di legno, divano
    note: '*چرمی* significa «fatto di pelle», *چوبی* «fatto di legno».'
    example_gloss:
    - La mia borsa è di pelle.
    - Il tavolo è di legno.
    - Il divano è qui.
  fa.a2.unit42.lesson04.teach.chain1:
    title: Nome + aggettivo + possessore
    gloss: la borsa rossa di Sara; il cappotto nero di Nima; la casa grande di Nima
    note: 'Puoi continuare ad aggiungere parole dopo il nome, ciascuna unita dalla vocale di legame. Il possessore viene per ultimo: *کیف قرمز سارا* (kif-e qermez-e Sara). Il possessore è l''ultimo anello.'
  fa.a2.unit42.lesson04.teach.chain2:
    title: Nome + due aggettivi
    gloss: una borsa di pelle nera; un grande tavolo di legno; un divano rosso nuovo
    note: 'Due aggettivi seguono lo stesso schema. Si trovano entrambi gli ordini; il materiale prima del colore o della misura è un po'' più comune: *کیف چرمی سیاه*, *میز چوبی بزرگ*.'
  fa.a2.unit42.lesson05.teach.reading:
    title: Una borsa smarrita
    gloss: Ho perso la mia borsa. La mia borsa è rossa, di pelle e piccola. Nella borsa c'è un telefono nero. Il mio telefono nero è vecchio. Nella borsa ci sono anche degli occhiali blu. Gli occhiali blu sono di Nima.
    note: Leggi una volta pensando alla borsa, poi di nuovo pensando alle cose che ci sono dentro.
  fa.a2.unit42.lesson06.teach.turn01:
    title: Il commesso mostra un cappotto
    gloss: 'Commesso: Mi scusi, questo cappotto nero è suo?'
    note: '*مال شماست* è la forma cortese di «è suo (di Lei)».'
  fa.a2.unit42.lesson06.teach.turn02:
    title: Nima descrive il suo cappotto
    gloss: 'Nima: No, il mio cappotto è blu. Il mio cappotto blu è grande.'
    note: '*پالتوی آبی من*: nome + aggettivo + possessore.'
  fa.a2.unit42.lesson06.teach.turn03:
    title: Il commesso propone una borsa
    gloss: 'Commesso: Non ho un cappotto blu grande. Che ne dice di questa borsa rossa di pelle?'
    note: '*کیف قرمز چرمی*: nome + colore + materiale (anche *کیف چرمی قرمز* è corretto).'
  fa.a2.unit42.lesson06.teach.turn04:
    title: Nima indica la proprietaria
    gloss: 'Nima: Quella è la borsa di Sara. La borsa di Sara è rossa.'
    note: '*ساراست* è la forma parlata di *سارا است*.'
