teaching:
  fa.a1.unit09.lesson01.teach.hour_word:
    title: Ora / orologio
    gloss: ora / orologio
    note: ساعت significa sia «ora» sia «orologio» ed è la parola base per dire l'ora.
    example_gloss: Che ore sono?
  fa.a1.unit09.lesson01.teach.minute_word:
    title: Minuto
    gloss: minuto
    note: دقیقه è la parola per «minuto».
    example_gloss: Aspetta cinque minuti.
  fa.a1.unit09.lesson01.teach.half_word:
    title: Mezza
    gloss: mezzo
    note: نیم significa «mezzo» e si usa per la mezz'ora.
    example_gloss: Sono le sette e mezza.
  fa.a1.unit09.lesson01.teach.quarter_word:
    title: Quarto
    gloss: quarto
    note: ربع significa «quarto» e si usa per il quarto d'ora.
    example_gloss: Sono le otto meno un quarto.
  fa.a1.unit09.lesson01.teach.va_word:
    title: E
    gloss: e
    note: و è la congiunzione più comune e viene usata in tutta questa unità.
    target_text: و (e)
  fa.a1.unit09.lesson02.teach.what_time_question:
    title: Chiedere che ore sono
    gloss: Che ore sono?
    note: ساعت چنده؟ è il modo colloquiale di uso quotidiano per chiedere l'ora.
  fa.a1.unit09.lesson02.teach.contraction_note:
    title: La contrazione colloquiale in -e (ripasso)
    gloss: چنده è la contrazione parlata di uso quotidiano di چند است.
    note: È la stessa contrazione già vista con parole del meteo e degli acquisti come آفتابیه e تومنه.
  fa.a1.unit09.lesson03.teach.three_oclock_half:
    title: Dire che sono le tre e mezza
    gloss: Sono le tre e mezza.
    note: ساعت سه و نیمه unisce l'ora, و (e) e la forma contratta نیمه (mezza).
  fa.a1.unit09.lesson03.teach.contraction_note2:
    title: La contrazione colloquiale in -e applicata a نیم
    gloss: نیمه è la contrazione parlata di uso quotidiano di نیم است.
    note: Stesso schema di چنده, applicato a نیم invece che a چند.
  fa.a1.unit09.lesson04.teach.sobh:
    title: Mattina
    gloss: mattina
    note: صبح indica la mattina.
    example_gloss: La mattina mi alzo presto.
  fa.a1.unit09.lesson04.teach.zohr:
    title: Mezzogiorno
    gloss: mezzogiorno
    note: ظهر indica mezzogiorno.
    example_gloss: Pranzo a mezzogiorno.
  fa.a1.unit09.lesson04.teach.asr:
    title: Pomeriggio
    gloss: pomeriggio
    note: عصر indica il pomeriggio e il primo tardo pomeriggio.
    example_gloss: Lavoro il pomeriggio.
  fa.a1.unit09.lesson04.teach.shab:
    title: Notte
    gloss: notte
    note: شب indica la notte.
    example_gloss: La sera vado a dormire presto.
  fa.a1.unit09.lesson05.teach.appointment_word:
    title: Appuntamento
    gloss: appuntamento
    note: قرار è la parola generica per un appuntamento o un incontro stabilito.
    example_gloss: Ho un appuntamento.
  fa.a1.unit09.lesson05.teach.appointment_question:
    title: Chiedere a che ora è un appuntamento
    gloss: A che ora è l'appuntamento?
    note: قرار ساعت چنده؟ applica la domanda sull'ora della lezione 2 a un appuntamento preciso.
  fa.a1.unit09.lesson05.teach.four_oclock:
    title: Dire un'ora con la parte del giorno
    gloss: le quattro del pomeriggio
    note: ساعت چهار عصر unisce l'ora a عصر per distinguere la mattina dal pomeriggio.
  fa.a1.unit09.lesson06.teach.tomorrow_review:
    title: Domani (ripasso)
    gloss: domani
    note: فردا è stato introdotto in un'unità precedente; qui serve a impostare l'appuntamento.
    example_gloss: Domani ho un appuntamento.
  fa.a1.unit09.lesson06.teach.late_word:
    title: Dire che farai un po' tardi
    gloss: Farò un po' tardi.
    note: '*یکم دیر می‌شه* usa il colloquiale *یکم* («un po''») e *دیر* («tardi»).'
  fa.a1.unit09.lesson06.teach.turn01:
    title: Negar chiede a che ora è l'appuntamento di domani
    gloss: Negar chiede a che ora è l'appuntamento di domani.
    note: قرار فردا ساعت چنده؟ unisce la domanda sull'appuntamento della lezione 5 con فردا (domani).
  fa.a1.unit09.lesson06.teach.turn02:
    title: Arash risponde, non è sicuro
    gloss: Arash dice che pensa siano le quattro.
    note: فکر کنم (penso) attenua la risposta, perché Arash non è del tutto sicuro.
  fa.a1.unit09.lesson06.teach.turn03:
    title: Negar chiede se sono le quattro del mattino o del pomeriggio
    gloss: Negar chiede se le quattro sono del pomeriggio o del mattino.
    note: Chiarisce una possibile ambiguità, perché ساعت چهار da solo non dice di quali quattro si tratti.
  fa.a1.unit09.lesson06.teach.turn04:
    title: Arash precisa
    gloss: 'Arash dice: del pomeriggio.'
    note: Una risposta di una sola parola è naturale quando la domanda ha già stabilito il contesto.
  fa.a1.unit09.lesson06.teach.turn05:
    title: Negar accetta e cambia l'orario del suo arrivo
    gloss: Negar accetta e dice che arriverà alle quattro e un quarto.
    note: ساعت چهار و ربع unisce l'ora a ربع (quarto).
  fa.a1.unit09.lesson06.teach.turn06:
    title: Arash chiede perché quel quarto d'ora in più
    gloss: Arash chiede perché dice «e un quarto».
    note: '*چرا ربع؟* è un modo breve per chiedere «Perché il quarto?»'
  fa.a1.unit09.lesson06.teach.turn07:
    title: Negar spiega che farà un po' tardi
    gloss: Negar spiega che uscirà un po' tardi dal lavoro.
    note: '*چون* («perché») introduce il motivo, con *یکم دیر می‌شه* («farò un po'' tardi»), che hai appena imparato in questa lezione.'
  fa.a1.unit09.lesson06.teach.turn08:
    title: Arash la rassicura
    gloss: 'Arash dice: va bene, nessun problema.'
    note: 'مشکلی نیست (nessun problema) rassicura Negar: il piccolo ritardo non è un problema.'
