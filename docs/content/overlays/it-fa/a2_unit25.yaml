teaching:
  fa.a2.unit25.lesson01.teach.time_words:
    title: Mai, ancora, prima, una volta
    gloss: mai / finora; mai (con negazione); ancora; prima, già; una volta
    note: '*تا حالا* introduce l''esperienza di vita. Usa *هیچ‌وقت* con un verbo negativo per dire «mai» e *هنوز* con un verbo negativo per dire «non ancora».'
    example_gloss:
    - Sei mai stato a Shiraz?
    - Non ho mai mangiato cibo indiano.
    - Non sono ancora stato a Isfahan.
    - Ho già visto questo film.
    - Sono salito a cavallo una volta.
  fa.a2.unit25.lesson01.teach.people_places:
    title: Persone e luoghi
    gloss: io, tu, Sara, Nima, Shiraz, Isfahan
    note: In persiano *من* e *تو* si omettono spesso, perché la desinenza del verbo indica la persona, come in italiano. Sara e Nima sono amici già presentati.
    example_gloss:
    - Sono stato a Shiraz.
    - Sei stato a Isfahan?
    - Sara è già stata a Shiraz.
    - Nima non è ancora stato a Isfahan.
    - Sono stato a Shiraz.
    - Non sono stato a Isfahan.
  fa.a2.unit25.lesson01.teach.experiences:
    title: Cibo, film e cavalcate
    gloss: cibo indiano, cibo coreano, film, a cavallo
    note: '*رو* è il segnalatore dell''oggetto nel parlato, come in *این فیلم رو دیده‌م*. L''espressione *سوار اسب شدن* significa andare a cavallo.'
    example_gloss:
    - Ho mangiato cibo indiano.
    - Non ho mangiato cibo coreano.
    - Ho visto questo film.
    - Sono andato a cavallo.
  fa.a2.unit25.lesson01.teach.perfect_shape:
    title: Il passato prossimo parlato
    gloss: sono andato, ho mangiato, ho visto, sono diventato / sono salito (a cavallo)
    note: 'Il passato prossimo si forma con il participio passato in *-ه* più una breve desinenza personale. Per «io», nel persiano parlato si aggiunge *-م*: *رفت + ه + م* → *رفته‌م*.'
  fa.a2.unit25.lesson01.teach.negative_shape:
    title: Passato prossimo negativo
    gloss: non sono andato, non ho mangiato, non ho visto, non sono diventato / non sono salito (a cavallo)
    note: 'Metti *نـ* all''inizio del participio: *رفته‌م* → *نرفته‌م*. Con *هیچ‌وقت* il verbo resta negativo.'
  fa.a2.unit25.lesson01.teach.written_recognition:
    title: 'Forma scritta: solo da riconoscere'
    gloss: رفته‌ام è l'equivalente scritto di رفته‌م parlato
    note: Nello scritto curato puoi trovare *رفته‌ام*. Riconoscila, ma in questa unità usa nella produzione la forma colloquiale *رفته‌م*.
  fa.a2.unit25.lesson02.teach.verbs:
    title: Quattro verbi di esperienza
    gloss: andare, mangiare, vedere, diventare
    note: I loro participi sono *رفته، خورده، دیده، شده*. Con *سوار اسب*, *شدن* esprime l'esperienza «andare a cavallo».
    example_gloss:
    - Andare a Shiraz è bello.
    - Mangiare cibo indiano è bello.
    - Vedere questo film è bello.
    - Andare a cavallo è bello.
  fa.a2.unit25.lesson02.teach.pronouns:
    title: Lui/lei, noi, voi, loro
    gloss: lui/lei, noi, voi (plurale/forma di cortesia), loro
    note: Questi pronomi rendono visibili le desinenze personali. Nella conversazione normale si omette il pronome quando il contesto è già chiaro.
    example_gloss:
    - Lui/lei è stato a Shiraz.
    - Siamo stati a Shiraz.
    - Siete stati a Shiraz?
    - Loro sono stati a Shiraz.
  fa.a2.unit25.lesson02.teach.clitics:
    title: Le desinenze personali
    gloss: 'io, tu, lui/lei, noi, voi, loro: sono andato/a, sei andato/a, è andato/a, siamo andati/e, siete andati/e, sono andati/e'
    note: Il parlato usa *-م، -ای،* nessuna desinenza, *-ایم، -این، -ن*. In questa unità si esercitano solo le forme qui mostrate.
  fa.a2.unit25.lesson02.teach.other_participles:
    title: Le stesse desinenze su altri participi
    gloss: tu hai mangiato / lui/lei ha mangiato, hai visto / ha visto, sei andato a cavallo / è andato a cavallo
    note: 'La desinenza personale si aggiunge a ogni participio allo stesso modo: *خورده‌ای، دیده‌ای، شده‌ای*.'
  fa.a2.unit25.lesson03.teach.specific_time:
    title: L'anno scorso, ieri
    gloss: l'anno scorso, ieri
    note: Indicano un tempo concluso, quindi si usa il passato semplice e non il passato prossimo di esperienza.
    example_gloss:
    - L'anno scorso sono andato a Shiraz.
    - Ieri ho mangiato cibo indiano.
  fa.a2.unit25.lesson03.teach.simple_past:
    title: Evento concluso ed esperienza
    gloss: L'anno scorso sono andato a Shiraz. Sono stato a Shiraz.
    note: '*پارسال* indica quando è successo, quindi si usa *رفتم*. Con *تا حالا* e senza un tempo concluso, si usa *رفته‌م* per l''esperienza di vita.'
  fa.a2.unit25.lesson04.teach.responses:
    title: Sì; anch'io
    gloss: sì; anch'io
    note: A una domanda sull'esperienza si risponde con la stessa forma del passato prossimo. *منم* significa «anch'io».
    example_gloss:
    - Sì, ci sono stato una volta.
    - Neanch'io l'ho ancora mangiato.
  fa.a2.unit25.lesson04.teach.question_pattern:
    title: Sei mai stato a Shiraz?
    gloss: Sei mai stato a Shiraz?
    note: 'Per chiedere di un''esperienza si usa *تا حالا* con il passato prossimo di seconda persona *رفته‌ای؟*. Nel parlato quotidiano si usa spesso anche il passato semplice con *تا حالا*: *تا حالا رفتی؟*. Vanno bene entrambi.'
  fa.a2.unit25.lesson05.teach.reading:
    title: Un messaggio sulle esperienze
    gloss: Sono stato a Shiraz e ho già mangiato cibo indiano. Non sono mai andato a cavallo e non ho ancora mangiato cibo coreano. Tu sei mai stato a Shiraz?
    note: Leggi una prima volta per trovare le esperienze fatte, poi una seconda volta per quelle mai fatte o non ancora fatte.
  fa.a2.unit25.lesson06.teach.turn01:
    title: Sara chiede a Nima
    gloss: Nima, sei mai stato a Shiraz?
    note: Sara fa una domanda sull'esperienza con *تا حالا*.
  fa.a2.unit25.lesson06.teach.turn02:
    title: Nima risponde e domanda
    gloss: Sì, ci sono stato una volta. Tu hai mai mangiato cibo indiano?
    note: Nima racconta un'esperienza e ne chiede una nuova.
  fa.a2.unit25.lesson06.teach.turn03:
    title: Sara mette a confronto due cibi
    gloss: Sì, l'ho già mangiato, ma non ho mai mangiato cibo coreano.
    note: '*ولی* contrappone un''esperienza fatta a qualcosa che Sara non ha mai fatto.'
  fa.a2.unit25.lesson06.teach.turn04:
    title: Nima è d'accordo
    gloss: Neanch'io l'ho ancora mangiato.
    note: '*هنوز نخورده‌م* significa che finora non è successo.'
