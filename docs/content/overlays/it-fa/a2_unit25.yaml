    - Ha vissuto a Shiraz.
    - È andato a Shiraz ieri.
    accepted_answers:
    - value: È stato a Shiraz una volta.
      status: correct
    feedback: Nima dice *آره، یه بار رفته‌م*.
  fa.a2.unit25.lesson06.exercise02.comprehend_sara:
    instruction: Che cosa non ha mai mangiato Sara?
    correct_option: cibo coreano
    distractors:
