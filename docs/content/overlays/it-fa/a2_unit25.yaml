  fa.a2.unit25.lesson05.exercise04.listen_travel:
    instruction: Ascolta. Quale affermazione è corretta?
    correct_option: Chi parla è stato a Shiraz ma non a Isfahan.
    distractors:
    - Chi parla è stato in entrambe le città.
    - Chi parla è stato solo a Isfahan.
    - Chi parla non ha mai viaggiato.
    accepted_answers:
    - value: Chi parla è stato a Shiraz ma non a Isfahan.
      status: correct
    feedback: L'audio mette in contrasto *شیراز رفته‌م* con *اصفهان نرفته‌م*.
  fa.a2.unit25.lesson05.exercise05.listen_food:
    instruction: Ascolta. Quale affermazione è corretta?
    correct_option: Chi parla ha mangiato cibo indiano ma non ancora cibo coreano.
    distractors:
    - Chi parla ha mangiato entrambi i cibi.
    - Chi parla ha mangiato solo cibo coreano.
    - Chi parla non ha mai mangiato nessuno dei due cibi.
    accepted_answers:
    - value: Chi parla ha mangiato cibo indiano ma non ancora cibo coreano.
      status: correct
    feedback: L'audio dice *قبلا* per il cibo indiano e *هنوز ... نخورده‌م* per il cibo coreano.
  fa.a2.unit25.lesson05.exercise06.dictation_horse:
    instruction: Ascolta e scrivi esattamente la frase in farsi.
    correct_response: هیچ‌وقت سوار اسب نشده‌م
    orthography_strict: true
    feedback: La frase significa «Non sono mai andato a cavallo».
  fa.a2.unit25.lesson06.exercise01.comprehend_nima:
    instruction: Quale esperienza racconta Nima?
    correct_option: È stato a Shiraz una volta.
    distractors:
