  fa.a2.unit25.lesson06.exercise06.write_experience_message:
    instruction: 'Scrivi questo messaggio in quattro parti con il passato prossimo colloquiale del persiano: Sono stato a Shiraz; Non sono mai stato a Isfahan; Ho già mangiato cibo indiano; chiedi a un amico se è mai stato a Shiraz.'
