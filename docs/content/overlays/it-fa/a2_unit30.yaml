teaching:
  fa.a2.unit30.lesson01.teach.people_time:
    title: Persone e tempo
    gloss: io, tu, Sara, Nima, stasera, domani
    note: '*امشب* significa «stasera» e *فردا* significa «domani». In persiano di solito si omette *من*, perché la desinenza del verbo indica già la persona.'
    example_gloss:
    - Domani posso venire.
    - Sara stasera non può venire.
  fa.a2.unit30.lesson01.teach.skills:
    title: Abilità
    gloss: suonare la chitarra, guidare, cucinare, nuotare, parlare inglese
    note: Sono abilità. Ognuna è formata da un nome e un verbo leggero, e il verbo leggero cambia in base alla persona.
    example_gloss:
    - So suonare la chitarra.
    - Non so guidare.
    - Nima sa parlare inglese.
  fa.a2.unit30.lesson01.teach.verbs_after:
    title: Verbi dopo «potere»
    gloss: che io venga, che io vada, che io suoni, che io legga, che io faccia
    note: Sono le forme verbali del tipo «che io...» (il congiuntivo). Nel persiano parlato una di queste forme segue *می‌تونم*.
    example_gloss:
    - Posso venire.
    - Non posso andare.
    - So parlare inglese.
  fa.a2.unit30.lesson01.teach.can_forms:
    title: Potere e non potere
    gloss: posso, puoi, può; non posso, non puoi, non può
    note: 'Il verbo parlato per «potere» è *می‌تونم* (posso), *می‌تونی* (puoi), *می‌تونه* (può). Metti *نـ* davanti per «non potere»: *نمی‌تونم*.'
  fa.a2.unit30.lesson01.teach.can_plus_subjunctive:
    title: Potere + il verbo «che io...»
    gloss: posso venire; non posso parlare
    note: 'Dopo *می‌تونم* il secondo verbo è al congiuntivo, non all''infinito: *می‌تونم بیام*, *نمی‌تونم صحبت کنم*. Il secondo verbo ha la stessa desinenza di persona di *می‌تونم*.'
  fa.a2.unit30.lesson02.teach.person_word:
    title: Tu e lui/lei
    gloss: tu, lui o lei
    note: '*اون* significa «lui» o «lei» nel persiano parlato; la desinenza del verbo indica a chi ci si riferisce.'
    example_gloss:
    - Lui o lei può venire.
    - Puoi andare.
  fa.a2.unit30.lesson02.teach.endings:
    title: Tre persone
    gloss: che io/tu/lui venga, vada, suoni
    note: 'La desinenza del congiuntivo segue la persona: -م (io), -ی (tu), -ه o -د (lui/lei). Lo stesso schema vale per ogni verbo.'
    example_gloss:
    - Sai suonare la chitarra.
    - Lui o lei può andare.
  fa.a2.unit30.lesson02.teach.work_tech:
    title: Abilità di lavoro e tecnologia
    gloss: mandare un'email, fare una foto, leggere il persiano, lavorare al computer, con il telefono
    note: Sono abilità legate al lavoro e alla tecnologia. *با* significa «con» o «a/su».
    example_gloss:
    - Nima sa lavorare al computer.
    - Posso mandare un'email.
    - Puoi fare foto con il telefono.
  fa.a2.unit30.lesson02.teach.person_agreement:
    title: Entrambi i verbi concordano
    gloss: posso venire, puoi venire, può venire
    note: 'Cambia la persona su tutti e due i verbi insieme: *می‌تونم بیام*, *می‌تونی بیای*, *می‌تونه بیاد*. Un''incongruenza come *می‌تونی بیام* è sbagliata.'
  fa.a2.unit30.lesson03.teach.three_words:
    title: Dovere, potere, forse
    gloss: devo/si deve, è possibile che, forse
    note: '*باید* indica necessità. *ممکنه* e *شاید* esprimono entrambi possibilità. Tutti e tre sono seguiti dal congiuntivo.'
    example_gloss:
    - Devo andare.
    - Potrei venire.
    - Forse andrò.
  fa.a2.unit30.lesson03.teach.late_rain:
    title: Tardi, pioggia, non venire
    gloss: tardi, che io arrivi, pioggia, che io non vada, che io non venga
    note: '*نیام* e *نرم* sono congiuntivi negativi: *نـ* viene prima del verbo.'
    example_gloss:
    - Potrei arrivare tardi.
    - Potrebbe piovere.
    - Potrei non venire.
  fa.a2.unit30.lesson03.teach.can_must_might:
    title: Potere, dovere, forse
    gloss: posso andare; devo andare; potrei andare
    note: 'Il verbo che segue è lo stesso, ma la prima parola cambia il significato: *می‌تونم برم* (sono in grado di o libero di), *باید برم* (devo), *ممکنه برم* (è possibile che io vada).'
  fa.a2.unit30.lesson03.teach.possibility_rule:
    title: 'Possibilità: ممکنه / شاید + congiuntivo'
    gloss: potrei arrivare tardi; forse pioverà; potrei non venire
    note: '*ممکنه* non cambia in base alla persona; il verbo che segue sì: *ممکنه دیر برسم*, *ممکنه نیما نیاد*. *شاید* funziona allo stesso modo. Per dire «potrei non», nega il secondo verbo: *ممکنه نیام*.'
  fa.a2.unit30.lesson04.teach.availability:
    title: Disponibilità
    gloss: ho tempo, non ho tempo, sono libero/a, sono occupato/a, ho una riunione, il fine settimana
    note: '*وقت دارم* e *آزادم* dicono che sei disponibile; *وقت ندارم* e *مشغولم* dicono che non lo sei.'
    example_gloss:
    - Domani ho tempo.
    - Stasera sono occupato.
    - Il fine settimana sono libero.
  fa.a2.unit30.lesson04.teach.linkers:
    title: Perché, ma, no, e
    gloss: perché, ma, no, e
    note: '*چون* dà una ragione e *ولی* aggiunge un contrasto.'
    example_gloss:
    - Stasera non posso venire perché ho una riunione.
    - Domani sono libero, ma potrei fare tardi.
  fa.a2.unit30.lesson04.teach.maybe_able:
    title: 'Forse potrò: شاید بتونم'
    gloss: forse potrò venire
    note: 'Per dire «forse posso», metti *شاید* davanti a *بتونم* (il congiuntivo di «potere») e poi un secondo verbo al congiuntivo: *شاید بتونم بیام*. Questo corso insegna *شاید بتونم* come modello.'
  fa.a2.unit30.lesson04.teach.reason_for_no:
    title: Non potere + motivo
    gloss: Stasera non posso venire perché ho una riunione
    note: 'Un rifiuto suona naturale se accompagnato da un motivo: *نمی‌تونم بیام، چون ...*. Il motivo è una semplice affermazione al presente.'
  fa.a2.unit30.lesson05.teach.reading:
    title: Un messaggio di Nima
    gloss: Ciao Sara! Stasera non posso venire, perché ho una riunione. Domani sono libero e posso venire, ma potrei fare tardi. So lavorare al computer, ma non so suonare la chitarra. Forse potrò anche fare delle foto.
    note: Leggi una prima volta per capire cosa sa e cosa non sa fare Nima, poi una seconda volta per capire cosa potrebbe succedere.
  fa.a2.unit30.lesson06.teach.dialogue_words:
    title: Parole per rispondere
    gloss: sì, va bene, nessun problema, prima
    note: '*اشکالی نداره* è una risposta cordiale che significa «nessun problema». *زودتر* significa «prima» (più presto).'
    example_gloss:
    - Va bene, nessun problema.
    - Forse potrò venire prima.
  fa.a2.unit30.lesson06.teach.turn01:
    title: Sara invita Nima
    gloss: 'Sara chiede: Nima, stasera puoi venire?'
    note: L'inizio chiede della capacità e della disponibilità.
  fa.a2.unit30.lesson06.teach.turn02:
    title: Nima rifiuta
    gloss: 'Nima: No, stasera non posso venire. Ho una riunione.'
    note: Un rifiuto con un motivo.
  fa.a2.unit30.lesson06.teach.turn03:
    title: Sara chiede di domani
    gloss: 'Sara: E domani? Domani hai tempo?'
    note: '*فردا چی؟* sposta la conversazione su un altro momento.'
  fa.a2.unit30.lesson06.teach.turn04:
    title: 'Nima: posso, ma potrei fare tardi'
    gloss: 'Nima: Sì, domani sono libero. Posso venire, ma potrei fare tardi.'
    note: Capacità e possibilità in una sola risposta.
  fa.a2.unit30.lesson06.teach.turn05:
    title: Sara chiede delle foto
    gloss: 'Sara: Va bene, nessun problema. Riesci a fare foto con il telefono?'
    note: Una nuova domanda sulla capacità.
  fa.a2.unit30.lesson06.teach.turn06:
    title: Nima conclude la conversazione
    gloss: 'Nima: Sì, posso. Forse potrò venire prima.'
    note: Capacità, poi una possibilità sperata.
