teaching:
  fa.a2.unit27.lesson01.teach.time_words:
    title: Espressioni di tempo per i programmi
    gloss: domani, il fine settimana, la settimana prossima, il mese prossimo, l'anno prossimo, oggi, adesso
    note: '*هفته‌ی بعد*, *ماه دیگه* e *سال دیگه* sono i modi di dire quotidiani per «la settimana prossima / il mese prossimo / l''anno prossimo». *آخر هفته* è «il fine settimana»; il contesto chiarisce di quale si parla.'
    example_gloss:
    - Domani ho lezione.
    - Il mese prossimo viaggio.
    - L'anno prossimo avrò una casa nuova.
  fa.a2.unit27.lesson01.teach.course_house:
    title: Corsi e trasloco
    gloss: corso, lezione, lingua, iscrizione, casa, scatola
    note: '*ثبت‌نام* significa «iscrizione / iscriversi». Userai queste parole per il corso di lingua di Sara e per il trasloco di Nima.'
    example_gloss:
    - Ho un corso di lingua.
    - Ho una lezione di lingua.
    - Ho delle scatole.
  fa.a2.unit27.lesson01.teach.plan_verbs:
    title: Verbi per i progetti
    gloss: vado, comincio, mi iscrivo, cambio casa, compro delle scatole
    note: '*خونه عوض کردن* è il modo parlato per dire «traslocare» (letteralmente «cambiare casa»).'
    example_gloss:
    - Domani vado a lezione.
    - La settimana prossima comincio il corso.
    - Domani mi iscrivo.
    - Il mese prossimo cambio casa.
    - Domani compro delle scatole.
  fa.a2.unit27.lesson01.teach.things_to_buy:
    title: Cose da comprare
    gloss: tappeto, tenda, torta
    note: Usa questi sostantivi di uso quotidiano quando parli di commissioni e di cose che hai in programma di comprare.
    example_gloss:
    - Domani compro un tappeto.
    - Domani compro delle tende.
    - Domani compro una torta.
  fa.a2.unit27.lesson01.teach.places_and_events:
    title: Luoghi ed eventi
    gloss: ristorante, caffè, festa
    note: '*مهمونی* è la forma parlata abituale per «festa».'
    example_gloss:
    - Domani vado al ristorante.
    - Domani vado al caffè.
    - Nel weekend ho una festa.
  fa.a2.unit27.lesson01.teach.present_for_future:
    title: Il presente può esprimere un progetto
    gloss: Domani vado; la settimana prossima comincio
    note: Il persiano parlato usa il normale presente (*می‌رم*, *شروع می‌کنم*) per un progetto. Un'espressione di tempo come *فردا* o *هفته‌ی بعد* indica che l'azione è nel futuro. Nel parlato quotidiano non c'è un verbo al futuro distinto.
  fa.a2.unit27.lesson02.teach.i_want:
    title: Voglio, vuoi
    gloss: voglio, vuoi, un/uno/una
    note: '*یه* è il normale «un / uno / una» del parlato. *تو چی می‌خوای؟* significa «Tu che cosa vuoi?»'
    example_gloss:
    - Voglio comprare una casa.
    - Che cosa vuoi?
  fa.a2.unit27.lesson02.teach.short_verbs:
    title: Forme verbali brevi
    gloss: andare, comprare, cominciare, iscriversi, trovare, imparare
    note: 'Queste sono le forme verbali brevi che seguono *می‌خوام*. Nei verbi composti cambia la seconda parte: *شروع کنم*, *ثبت‌نام کنم*, *پیدا کنم*.'
    example_gloss:
    - Voglio andare a lezione.
    - Voglio comprare delle scatole.
    - Voglio trovare una casa.
    - Voglio imparare una lingua.
  fa.a2.unit27.lesson02.teach.want_plus_short:
    title: می‌خوام + verbo breve
    gloss: Voglio andare; voglio comprare; voglio cominciare
    note: 'Per dire che cosa vuoi o hai intenzione di fare, usa *می‌خوام* più una forma verbale breve. Il secondo verbo non ha *می‌*: si dice *می‌خوام برم*, mai *می‌خوام می‌رم*. La desinenza del secondo verbo corrisponde alla persona che vuole.'
  fa.a2.unit27.lesson02.teach.person_endings:
    title: Il secondo verbo segue la persona
    gloss: Voglio andare; vuoi andare; vuole andare
    note: 'Il verbo breve cambia con la persona: *برم* (io), *بری* (tu), *بره* (lui/lei). Lo stesso schema vale per *بخرم / بخری / بخره*. In questa unità produrrai soprattutto le forme di *من*.'
  fa.a2.unit27.lesson03.teach.habit_words:
    title: Parole per le abitudini
    gloss: ogni giorno, ogni settimana, sempre, di solito
    note: 'Queste parole indicano un''abitudine. Il verbo è lo stesso presente usato per un progetto: è l''espressione di tempo a dirti quale significato ha.'
    example_gloss:
    - Vado a lezione ogni giorno.
    - Vado sempre a lezione.
    - Di solito resto a casa.
    - Ho lezione due giorni a settimana.
  fa.a2.unit27.lesson03.teach.habit_vs_plan:
    title: Stesso verbo, diversa espressione di tempo
    gloss: Vado ogni giorno; domani vado
    note: '*می‌رم* può indicare un''abitudine o un progetto. *هر روز* e *همیشه* ne fanno un''abitudine; *فردا*, *هفته‌ی بعد* e *ماه دیگه* ne fanno un progetto. Guarda sempre prima l''espressione di tempo.'
  fa.a2.unit27.lesson03.teach.plan_vs_want:
    title: Progetto o intenzione?
    gloss: Domani vado; voglio andare
    note: '*فردا می‌رم* annuncia un progetto con un''espressione di tempo. *می‌خوام برم* dice ciò che vuoi o intendi fare e non richiede un''espressione di tempo. Ricorda: dopo *می‌خوام* il secondo verbo perde *می‌*.'
  fa.a2.unit27.lesson03.teach.decided:
    title: Ho deciso, ho intenzione
    gloss: ho deciso, ho intenzione
    note: '*تصمیم گرفتم* e *قصد دارم* sono altri due modi per parlare di un''intenzione. Entrambi sono seguiti da una forma verbale breve.'
    example_gloss:
    - Ho deciso di cambiare casa.
    - Ho intenzione di imparare una lingua.
  fa.a2.unit27.lesson03.teach.decided_plus_short:
    title: تصمیم گرفتم + verbo breve
    gloss: Ho deciso di andare; ho deciso di cominciare
    note: '*گرفتم* è al passato perché la decisione è presa, ma il verbo che segue è la forma breve (*برم*, *شروع کنم*) perché l''azione è ancora da compiere. Non metterci *می‌*.'
  fa.a2.unit27.lesson04.teach.plan_questions:
    title: Chiedere dei progetti
    gloss: Che cosa fai domani? Che cosa vuoi fare? E tu?
    note: Per chiedere di un progetto usa il presente con un'espressione di tempo. Per chiedere di un'intenzione usa *می‌خوای ... کنی؟*.
    example_gloss:
    - Che cosa fai nel weekend?
    - Che cosa vuoi fare l'anno prossimo?
    - Io comincio il corso; e tu?
  fa.a2.unit27.lesson04.teach.answer_mirrors_question:
    title: La risposta rispecchia la domanda
    gloss: Tu fai → io faccio; tu vuoi fare → io voglio fare
    note: 'A una domanda su un progetto rispondi con il presente e la stessa espressione di tempo: *فردا جعبه می‌خرم*. A una domanda su un''intenzione rispondi con *می‌خوام* e un verbo breve la cui desinenza passa da «tu» a «io»: *می‌خوای چیکار کنی؟* diventa *می‌خوام ... کنم*.'
  fa.a2.unit27.lesson05.teach.reading_words:
    title: Parole per un messaggio
    gloss: ciao, lavoro, non vado, viaggio
    note: '*نمی‌رم* è la forma negativa di *می‌رم*: «non vado». *برم سفر* significa «andare in viaggio».'
    example_gloss:
    - Ciao Sara!
    - Vado al lavoro ogni giorno.
    - Domani non vado a lezione.
    - L'anno prossimo faccio un viaggio.
  fa.a2.unit27.lesson05.teach.reading:
    title: Un messaggio di Nima
    gloss: Ciao Sara! Ogni giorno vado al lavoro, ma domani non vado. Domani compro delle scatole. Il mese prossimo cambio casa. Ho deciso di fare un viaggio l'anno prossimo.
    note: Leggi una volta pensando all'abitudine, ai progetti vicini e all'intenzione più lontana.
  fa.a2.unit27.lesson06.teach.nice:
    title: Che bella notizia!
    gloss: che bello
    note: '*چه خوب!* è una reazione cordiale ai progetti di qualcuno.'
    example_gloss:
    - Che bello! Ti iscrivi domani?
  fa.a2.unit27.lesson06.teach.turn01:
    title: Sara chiede di domani
    gloss: 'Sara chiede a Nima: Che cosa fai domani?'
    note: La domanda usa il presente e un'espressione di tempo.
  fa.a2.unit27.lesson06.teach.turn02:
    title: Nima parla di due progetti
    gloss: 'Nima: Domani compro delle scatole. Il mese prossimo cambio casa. E tu?'
    note: Due progetti con due espressioni di tempo.
  fa.a2.unit27.lesson06.teach.turn03:
    title: Sara parla dei suoi progetti
    gloss: 'Sara: Domani mi iscrivo. La settimana prossima comincio il corso di lingua.'
    note: Qui *من* è espresso per rispondere a *تو چی؟*.
  fa.a2.unit27.lesson06.teach.turn04:
    title: Nima chiede delle intenzioni
    gloss: 'Nima: Che bello! Che cosa vuoi fare l''anno prossimo?'
    note: La domanda usa *می‌خوای ... کنی؟*.
  fa.a2.unit27.lesson06.teach.turn05:
    title: Sara parla di una decisione
    gloss: 'Sara: Ho deciso di imparare una lingua. E tu?'
    note: '*تصمیم گرفتم* è seguito da una forma verbale breve.'
  fa.a2.unit27.lesson06.teach.turn06:
    title: Nima esprime un'intenzione
    gloss: 'Nima: Voglio fare un viaggio.'
    note: '*می‌خوام برم* esprime l''intenzione.'
