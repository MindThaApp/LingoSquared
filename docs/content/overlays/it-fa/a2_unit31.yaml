teaching:
  fa.a2.unit31.lesson01.teach.polite_words:
    title: Parole di cortesia per iniziare
    gloss: salve, scusi, si può / potrebbe, per favore, grazie
    note: '*ببخشید* serve per attirare l''attenzione con garbo, e *لطفا* significa «per favore». *می‌شه* chiede letteralmente «è possibile?»'
    example_gloss:
    - Salve, scusi.
    - Grazie, per favore.
  fa.a2.unit31.lesson01.teach.things:
    title: Cose che si chiedono
    gloss: porta, finestra, acqua, bicchiere, pane, (marcatore dell'oggetto), un/una
    note: '*رو* segna un complemento oggetto determinato nel parlato: *در رو*, *پنجره رو*. *یه* è l''«un/una» del parlato.'
    example_gloss:
    - Un bicchiere d'acqua.
    - Una pagnotta.
    - La porta e la finestra.
  fa.a2.unit31.lesson01.teach.request_verbs:
    title: Verbi per le richieste di cortesia
    gloss: chiudere, aprire, portare, dare, aiutare
    note: Sono forme di cortesia, al plurale, che terminano in *-ید*. Si usano con i vicini, i negozianti e gli altri sconosciuti.
    example_gloss:
    - Chiuda la porta.
    - Apra la finestra.
    - Porti un bicchiere d'acqua.
    - Mi aiuti.
  fa.a2.unit31.lesson01.teach.mishe_subjunctive:
    title: می‌شه + congiuntivo
    gloss: Potrebbe chiudere la porta? Potrebbe aiutarmi?
    note: 'Per chiedere con cortesia, di'' *می‌شه* e poi un verbo al congiuntivo con *ب-*: *می‌شه در رو ببندید؟* Con un verbo composto cambia il verbo leggero: *می‌شه کمکم کنید؟*, *می‌شه پنجره رو باز کنید؟* Il complemento oggetto sta prima del verbo.'
  fa.a2.unit31.lesson02.teach.offer_words:
    title: Offrire aiuto
    gloss: Vuole una mano? Lasci che io ...
    note: '*کمک می‌خواید؟* chiede se qualcuno vuole aiuto. *بذارید من ...* significa «lasciate che io ...» (o «lasci che io ...») ed è seguito da un verbo nella forma *io*: *بیارم*, *بخرم*, *ببندم*, *کنم*.'
    example_gloss:
    - Vuoi una mano?
    - Lasci che porti l'acqua.
    - Lasci che compri il pane.
    - Lasci che chiuda la porta.
    - Lasci che l'aiuti.
    - Potrebbe comprare il pane?
  fa.a2.unit31.lesson02.teach.reply_words:
    title: Accettare e rifiutare
    gloss: sì, no, certo, io stesso, faccio, prego
    note: '*بله، لطفا* accetta un''offerta. *نه، ممنون* la rifiuta, e *خودم انجام می‌دم* aggiunge «faccio da solo». *خواهش می‌کنم* si risponde a un ringraziamento.'
    example_gloss:
    - Sì, grazie.
    - No, grazie, faccio da solo.
    - Prego.
  fa.a2.unit31.lesson02.teach.offer_pattern:
    title: 'Richiesta e offerta: tu o io'
    gloss: Lasci che chiuda la porta.
    note: Una richiesta con *می‌شه* usa la desinenza *Lei/voi* (*ببندید*), perché ti rivolgi all'altra persona. Un'offerta con *بذارید من* usa la desinenza *io* (*ببندم*), perché sarai tu a fare l'azione. Confronta *می‌شه در رو ببندید؟* con *بذارید من در رو ببندم*.
  fa.a2.unit31.lesson02.teach.reply_pattern:
    title: Una risposta cortese ha due parti
    gloss: Sì, grazie. No, grazie, faccio da solo.
    note: Si accetta con *بله* più *لطفا*. Si rifiuta con *نه، ممنون*, e si aggiunge *خودم انجام می‌دم* per dire che ce la fai da solo.
  fa.a2.unit31.lesson03.teach.positive_imperatives:
    title: Imperativo affermativo
    gloss: va', vieni, fa'; andate (cortesia), fate (cortesia)
    note: 'A un amico si usa la forma breve: *برو*, *بیا*, *بکن*. Agli sconosciuti e ai gruppi si usa la forma in *-ید*: *برید*, *بکنید*.'
    example_gloss:
    - Vai là.
    - Vieni qui.
    - Fa' questo.
    - Vada là (cortesia).
  fa.a2.unit31.lesson03.teach.negative_imperatives:
    title: Imperativo negativo
    gloss: non andare, non venire, non fare; forme di cortesia e plurali
    note: 'Sostituisci *ب-* con *نـ*: *برو* diventa *نرو*, *بکن* diventa *نکن*, *بیا* diventa *نیا*. Le forme di cortesia sono *نرید*, *نکنید*, e l''espressione fissa *دست نزنید* (non toccare).'
    example_gloss:
    - Non andare là.
    - Non venire qui.
    - Non fare questo.
    - Non vada là (cortesia).
    - Non faccia questo (cortesia).
    - Non tocchi (cortesia).
  fa.a2.unit31.lesson03.teach.negative_rule:
    title: نـ al posto di ب-
    gloss: برو e نرو, بیا e نیا, بکن e نکن
    note: 'L''imperativo affermativo comincia con *ب-* e quello negativo con *نـ*. *بیا* e *نیا* funzionano allo stesso modo: differiscono solo per la prima lettera. Solo la forma negativa cambia il senso in «non fare».'
  fa.a2.unit31.lesson03.teach.polite_plural:
    title: Amico o plurale di cortesia
    gloss: non andare (amico) e non andate / non vada (cortesia)
    note: 'Aggiungi *-ید* per uno sconosciuto o per più persone: *نرو* diventa *نرید* e *نکن* diventa *نکنید*. Cartelli e negozianti usano le forme in *-ید*: *لطفا دست نزنید*.'
  fa.a2.unit31.lesson04.teach.places_people:
    title: Vicini e negozi
    gloss: vicino di casa, negozio, negoziante, borsa, tè
    note: '*کیفم* significa «la mia borsa»; la desinenza *-م* significa «mio/mia». *تو مغازه* significa «nel negozio».'
    example_gloss:
    - Scusi, potrebbe darmi un tè?
    - Scusi, potrebbe darmi la mia borsa?
    - Salve, vicino, vuole una mano?
    - Non tocchi nulla nel negozio.
  fa.a2.unit31.lesson04.teach.shop_request:
    title: Una richiesta cortese in negozio
    gloss: Scusi, potrebbe darmi un tè? Grazie.
    note: Comincia con *ببخشید*, chiedi con *می‌شه* e un verbo di cortesia, e concludi con *ممنون*.
  fa.a2.unit31.lesson05.teach.reading:
    title: Un biglietto per il vicino
    gloss: Salve, scusi. Potrebbe comprare una pagnotta oggi? Non sono a casa. Per favore chiuda la porta e non tocchi la mia borsa. Grazie.
    note: Leggi una prima volta per la richiesta, poi una seconda per l'indicazione di non toccare la borsa.
  fa.a2.unit31.lesson06.teach.turn01:
    title: Sara chiede aiuto
    gloss: 'Sara: Scusi, potrebbe aiutarmi?'
    note: Una richiesta cortese con *می‌شه* e la desinenza *Lei/voi*.
  fa.a2.unit31.lesson06.teach.turn02:
    title: Il vicino accetta
    gloss: 'Vicino: Sì, certo. Che cosa devo fare?'
    note: '*چیکار کنم؟* chiede che cosa fare.'
  fa.a2.unit31.lesson06.teach.turn03:
    title: Una richiesta precisa
    gloss: 'Sara: Potrebbe aprire la porta?'
    note: L'oggetto *در رو* sta prima del verbo di cortesia.
  fa.a2.unit31.lesson06.teach.turn04:
    title: La vicina si offre di fare di più
    gloss: 'Vicina: Sì. Mi lasci portare la sua borsa.'
    note: '*بذارید من ... ببرم* usa la desinenza della prima persona (*io*).'
  fa.a2.unit31.lesson06.teach.turn05:
    title: Sara rifiuta
    gloss: 'Sara: No, grazie, faccio da me.'
    note: Un rifiuto cortese, con una motivazione.
  fa.a2.unit31.lesson06.teach.turn06:
    title: La vicina risponde
    gloss: 'Vicina: Prego.'
    note: '*خواهش می‌کنم* è la risposta standard a un ringraziamento.'
