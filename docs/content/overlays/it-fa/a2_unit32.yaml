teaching:
  fa.a2.unit32.lesson01.teach.problems:
    title: Piccoli problemi
    gloss: Mi fa male la testa, sto male, ho un esame, non ho soldi
    note: 'Sono i problemi per cui l''unità dà consigli: salute, studio e soldi. *سرم درد می‌کنه* dice letteralmente «la mia testa fa male».'
    example_gloss:
    - Oggi mi fa male la testa.
    - Domani ho un esame.
    - Sto male e non ho soldi.
  fa.a2.unit32.lesson01.teach.helpers:
    title: Parole di salute, studio e soldi
    gloss: riposo, dottore, farmacia, medicina, acqua, caffè, lezione/studio, spesa
    note: '*داروخونه* è la forma parlata abituale di «farmacia». *درس* è «lezione» ed è anche l''oggetto di «studiare»: *درس بخونی*.'
    example_gloss:
    - Ho acqua e caffè.
    - Stasera ho lezione.
    - Il dottore e la farmacia.
  fa.a2.unit32.lesson01.teach.advice_verbs:
    title: Forme verbali per i consigli
    gloss: tu ti riposi, tu vai, tu bevi, tu studi, tu dormi, tu spendi; presto, di più, meno
    note: 'Sono le forme di *تو* in *-ی*: *کنی، بری، بخوری، بخونی، بخوابی*. Sono il congiuntivo e seguono *بهتره*.'
    example_gloss:
    - (che) tu vada a letto presto.
    - (che) tu studi di più.
    - (che) tu spenda meno.
  fa.a2.unit32.lesson01.teach.bahtare:
    title: بهتره + congiuntivo
    gloss: È meglio che tu vada dal dottore; è meglio che tu ti riposi
    note: '*بهتره* significa «è meglio (che)…» e dà un consiglio con delicatezza. Il verbo che segue è al congiuntivo, qui con la desinenza di *تو* *-ی*: *بهتره بری*, *بهتره استراحت کنی*. Tra *بهتره* e il verbo non c''è nessuna parola in più, nemmeno un equivalente di «che».'
  fa.a2.unit32.lesson02.teach.my_opinion:
    title: Secondo me
    gloss: penso, secondo me
    note: '*به نظرم* dice letteralmente «al mio parere» ed è il modo usuale per addolcire un consiglio.'
    example_gloss:
    - Secondo me faresti meglio a bere acqua.
    - Secondo me faresti meglio ad andare dal dottore.
  fa.a2.unit32.lesson02.teach.opinion_rule:
    title: به نظرم prima di بهتره
    gloss: Secondo me faresti meglio a studiare di più
    note: 'Metti *به نظرم* all''inizio e mantieni la stessa struttura dopo: *به نظرم بهتره + subjunctive*. Così il consiglio suona come la tua opinione, non come un ordine.'
  fa.a2.unit32.lesson03.teach.negative_verbs:
    title: Forme verbali negative
    gloss: (che) tu non beva, non vada, non dorma, non faccia; tardi, molto, molto
    note: 'Il negativo di ogni forma di congiuntivo di *تو* si ottiene aggiungendo *نـ* davanti: *بخوری → نخوری*, *بری → نری*, *بخوابی → نخوابی*, *کنی → نکنی*.'
    example_gloss:
    - (che) tu non beva il caffè.
    - (che) tu non vada a letto tardi.
    - (che) tu non spenda molto.
  fa.a2.unit32.lesson03.teach.must:
    title: Dovere
    gloss: dovere, bisogna
    note: '*باید* indica un obbligo forte: *باید بری دکتر* = «devi andare dal dottore».'
    example_gloss:
    - Domani devi studiare di più.
    - Oggi devi andare dal dottore.
  fa.a2.unit32.lesson03.teach.negative_rule:
    title: Consigli negativi
    gloss: Faresti meglio a non bere il caffè; faresti meglio a non andare a letto tardi
    note: 'Per dire «faresti meglio a non», mantieni *بهتره* e metti *نـ* sul verbo: *بهتره قهوه نخوری*. Non mettere la negazione su *بهتره* stesso.'
  fa.a2.unit32.lesson03.teach.must_vs_better:
    title: باید è più forte di بهتره
    gloss: Devi andare dal dottore; faresti meglio ad andare dal dottore
    note: Usa *بهتره* per un consiglio amichevole che si può anche non seguire e *باید* quando è davvero necessario. Entrambi sono seguiti dalla stessa forma verbale del tipo *بری*.
  fa.a2.unit32.lesson04.teach.question:
    title: Che cosa devo fare?
    gloss: Che cosa devo fare?
    note: '*چیکار کنم؟* è il modo parlato abituale per chiedere un consiglio. Il verbo *کنم* è la forma di congiuntivo di *من*.'
  fa.a2.unit32.lesson04.teach.responses:
    title: Rispondere a un consiglio
    gloss: sì, hai ragione, è una buona idea, non so, forse, no
    note: '*حق با توئه* significa letteralmente «la ragione è con te». Sono modi amichevoli per accettare un consiglio, esitare o rifiutare.'
    example_gloss:
    - Sì, hai ragione.
    - È una buona idea.
    - Non so, forse.
  fa.a2.unit32.lesson04.teach.respond_rule:
    title: Tre modi di rispondere a un consiglio
    gloss: Sì, buona idea; non so, forse
    note: Per essere d'accordo di' *آره، حق با توئه* oppure *فکر خوبیه*. Se non sei sicuro, di' *نمی‌دونم، شاید*. Un semplice *نه* è possibile, ma suona brusco.
  fa.a2.unit32.lesson05.teach.reading:
    title: Un messaggio e una risposta
    gloss: Ciao Sara. Domani ho un esame, ma mi fa male la testa e sto male. Che cosa devo fare? Ciao Nima. Secondo me stasera è meglio che tu riposi e beva acqua. È meglio che non bevi caffè e che vada a letto presto.
    note: Le prime tre frasi sono il messaggio di Nima; il resto è la risposta di Sara. Trova prima il problema, poi i tre consigli.
  fa.a2.unit32.lesson06.teach.turn01:
    title: Battuta 1
    gloss: Nima descrive il suo problema e chiede che cosa fare.
    note: Dà due informazioni, poi chiede un consiglio.
  fa.a2.unit32.lesson06.teach.turn02:
    title: Battuta 2
    gloss: Sara dà due consigli.
    note: '*به نظرم* attenua il consiglio.'
  fa.a2.unit32.lesson06.teach.turn03:
    title: Battuta 3
    gloss: Nima accetta il consiglio, ma dice che deve studiare.
    note: Qui *باید* esprime un forte obbligo personale di Nima.
  fa.a2.unit32.lesson06.teach.turn04:
    title: Battuta 4
    gloss: Sara gli consiglia di non studiare stasera e di andare a letto presto.
    note: Prima un consiglio negativo, poi uno positivo.
  fa.a2.unit32.lesson06.teach.turn05:
    title: Battuta 5
    gloss: Nima è incerto, ma ammette che lei potrebbe avere ragione.
    note: Una risposta esitante a un consiglio.
  fa.a2.unit32.lesson06.teach.turn06:
    title: Battuta 6
    gloss: 'Sara aggiunge: allora è meglio che domani tu vada dal medico.'
    note: '*پس* significa «quindi, allora».'
