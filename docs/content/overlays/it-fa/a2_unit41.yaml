teaching:
  fa.a2.unit41.lesson01.teach.phones:
    title: Parole sul telefono
    gloss: telefono, fotocamera, batteria
    note: '*گوشی* è la parola comune per indicare il telefono cellulare.'
    example_gloss:
    - Il mio telefono ha una fotocamera.
    - Questo telefono ha una batteria.
    - Questo è il telefono.
  fa.a2.unit41.lesson01.teach.adjs:
    title: Economico, caro, buono, cattivo
    gloss: economico, caro, buono, cattivo
    note: '*ارزون* e *گرون* sono le forme parlate usuali.'
    example_gloss:
    - Questo telefono è economico.
    - Quel telefono è caro.
    - Questo telefono è buono.
    - Quel telefono è pessimo.
  fa.a2.unit41.lesson01.teach.comparative:
    title: 'Ripasso del comparativo: -تر'
    gloss: più economico, più caro, migliore, peggiore
    note: 'Conosci già *-تر* per esprimere «più»: *ارزون‌تر*. *بهتر* e *بدتر* sono le forme comparative di «buono» e «cattivo».'
  fa.a2.unit41.lesson01.teach.superlative:
    title: 'Il superlativo: -ترین prima del nome'
    gloss: il telefono più economico, il telefono più caro, il telefono migliore, il telefono peggiore
    note: 'Aggiungi *-ین* al comparativo e mettilo prima del nome: *ارزون‌تر* diventa *ارزون‌ترین گوشی*. Tra le due parole non c''è l''ezafe (*ـِ*).'
  fa.a2.unit41.lesson02.teach.housing:
    title: Parole sulla casa
    gloss: appartamento, stanza, casa, stazione
    note: '*خونه* è la forma parlata di *خانه*.'
    example_gloss:
    - L'appartamento è qui.
    - La stanza è laggiù.
    - La casa è qui.
    - La stazione è laggiù.
  fa.a2.unit41.lesson02.teach.size:
    title: Grande, piccolo, vicino, lontano, carino
    gloss: grande, piccolo, vicino, lontano, carino
    note: '*کوچیک* è la forma parlata usuale di *کوچک*.'
    example_gloss:
    - L'appartamento è grande.
    - La stanza è piccola.
    - La stazione è vicina.
    - La casa è lontana.
    - La casa è carina.
  fa.a2.unit41.lesson02.teach.forms:
    title: Qualsiasi aggettivo + ترین
    gloss: l'appartamento più grande; la stanza più piccola; la stazione più vicina; la casa più bella
    note: 'Lo schema è lo stesso per ogni aggettivo: aggettivo + *‌ترین* (con un piccolo spazio, scritto con il semispazio) davanti al nome.'
  fa.a2.unit41.lesson02.teach.spoken:
    title: 'Nel parlato: از همه + comparativo'
    gloss: Questo appartamento è il più grande (più grande di tutti); questa stanza è la più piccola
    note: 'Quando il superlativo è il predicato, nel parlato si dice spesso «più grande di tutti»: *از همه بزرگ‌تره*. Significa «il più grande». Anche un superlativo può essere il predicato: *این بزرگ‌ترینه* («questo è il più grande»).'
  fa.a2.unit41.lesson03.teach.holiday:
    title: Parole per le vacanze
    gloss: hotel, viaggio, mare, montagna
    note: '*سفر* significa viaggio.'
    example_gloss:
    - L'hotel è qui.
    - Il viaggio è bellissimo.
    - Il mare è laggiù.
    - La montagna è lontana.
  fa.a2.unit41.lesson03.teach.opinion:
    title: Secondo me, quale
    gloss: secondo me, quale, qual è
    note: '*به نظر من* introduce la tua opinione. *کدومه؟* chiede «qual è?».'
    example_gloss:
    - Secondo me questo hotel è buono.
    - Quale hotel?
  fa.a2.unit41.lesson03.teach.choose:
    title: Chiedere qual è il migliore
    gloss: Quale hotel è il più economico? L'hotel in montagna è il più economico.
    note: Per sceglierne uno fra tre opzioni, chiedi *کدوم ... از همه ...؟* e rispondi con lo stesso schema.
  fa.a2.unit41.lesson04.teach.asas:
    title: Tanto ... quanto
    gloss: quanto, non è
    note: '*به اندازه‌ی* è seguito da ciò con cui si fa il confronto.'
    example_gloss:
    - Questo telefono è economico quanto quel telefono.
    - Quel telefono non è buono come questo telefono.
  fa.a2.unit41.lesson04.teach.asas_rule:
    title: Uguale e non uguale
    gloss: Questa casa è grande quanto quella casa; questa stanza non è grande come quella stanza
    note: '*به اندازه‌ی* + nome + aggettivo indica che due cose sono uguali. Per «non ... come», termina con *نیست*. Nella forma affermativa l''aggettivo prende la copula parlata (*بزرگه* = *بزرگ* + *است*). Nella negativa la copula è sostituita da *نیست*, quindi si dice *بزرگ نیست*, non *بزرگه نیست*.'
  fa.a2.unit41.lesson05.teach.reading:
    title: Tre appartamenti
    gloss: Voglio prendere un appartamento. Ho visto tre appartamenti. Il primo appartamento era il più economico, ma era il più piccolo. Il secondo appartamento era il più grande, ma era molto lontano. Il terzo appartamento non era grande come il secondo, ma era il più vicino. Secondo me il terzo appartamento è il migliore.
    note: Leggi una prima volta per capire i tre appartamenti, poi rileggi facendo attenzione alle parole che finiscono in *-ترین*.
  fa.a2.unit41.lesson06.teach.turn01:
    title: Sara chiede quale telefono sia meglio
    gloss: 'Sara: Nima, quale telefono è meglio?'
    note: '*بهتره* è il comparativo «meglio».'
  fa.a2.unit41.lesson06.teach.turn02:
    title: Nima dà la sua opinione
    gloss: 'Nima: Secondo me questo telefono è il migliore.'
    note: '*بهترین گوشی* usa il superlativo prima del nome.'
  fa.a2.unit41.lesson06.teach.turn03:
    title: Sara fa notare il prezzo
    gloss: 'Sara: Ma questo telefono è il più caro.'
    note: '*از همه گرون‌تره* è il modo parlato per dire «il più caro».'
  fa.a2.unit41.lesson06.teach.turn04:
    title: Nima fa un confronto
    gloss: 'Nima: Sì. Quel telefono è il più economico, ma non è buono come questo.'
    note: '*ارزون‌ترینه* è il superlativo usato come predicato.'
  fa.a2.unit41.lesson06.teach.turn05:
    title: Sara decide
    gloss: 'Sara: Allora compro questo.'
    note: Nel parlato *می‌خرم* significa anche «comprerò».
