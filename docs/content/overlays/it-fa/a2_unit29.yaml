teaching:
  fa.a2.unit29.lesson01.teach.places:
    title: Regole e luoghi
    gloss: regole, regole di casa, biblioteca, piscina, palestra
    note: '*قانون* significa «regola». Una casa, una biblioteca, una piscina e una palestra hanno tutte delle *قانون‌ها* (regole).'
    example_gloss:
    - La biblioteca ha delle regole.
    - Anche la piscina e la palestra hanno delle regole.
    - Anche una casa ha delle regole.
  fa.a2.unit29.lesson01.teach.must:
    title: 'باید: qualcosa è obbligatorio'
    gloss: devi andare; devi fare la doccia; devi portare una tessera
    note: '*باید* + congiuntivo = «dovere». Il verbo segue *باید* nella forma del congiuntivo (*بری*, *بگیری*, *بیاری*), senza *می‌*.'
  fa.a2.unit29.lesson01.teach.must_not:
    title: 'نباید: qualcosa è vietato'
    gloss: non devi mangiare; non devi urlare
    note: '*نباید* + congiuntivo = «non dovere». Indica che l''azione è vietata. Il verbo che segue è affermativo: *بخوری*, *بزنی*.'
  fa.a2.unit29.lesson01.teach.not_needed:
    title: 'لازم نیست: non è necessario'
    gloss: non c'è bisogno che tu venga; non c'è bisogno che tu paghi
    note: '*لازم نیست* + congiuntivo = «non c''è bisogno di». L''azione è facoltativa, non vietata.'
  fa.a2.unit29.lesson02.teach.rule_phrases:
    title: Espressioni delle regole
    gloss: stare zitto, restituire il libro, portare un asciugamano, mettere le scarpe da ginnastica, correre
    note: Ogni espressione è un congiuntivo che termina in *-ی*, per un amico (tu). Usala dopo *باید* o *نباید*.
    example_gloss:
    - Devi stare zitto.
    - Devi restituire il libro.
    - Devi mettere le scarpe da ginnastica.
  fa.a2.unit29.lesson02.teach.where:
    title: Dove e quando vale una regola
    gloss: in biblioteca, in piscina, in palestra, prima della piscina
    note: '*توی* significa «in» e *قبل از* significa «prima di». Di solito stanno all''inizio della regola.'
    example_gloss:
    - In biblioteca devi fare silenzio.
    - Prima della piscina devi fare la doccia.
    - In palestra devi indossare le scarpe sportive.
  fa.a2.unit29.lesson02.teach.polite:
    title: 'Sconosciuti e avvisi: la desinenza di شما'
    gloss: dovete fare silenzio / deve fare silenzio (forma di cortesia o plurale); dovete fare la doccia / deve fare la doccia (forma di cortesia o plurale)
    note: 'Con sconosciuti, persone ufficiali o più persone, la desinenza passa da *-ی* a *-ید*: *باشی* diventa *باشید*, *بگیری* diventa *بگیرید*. Gli avvisi usano questa forma.'
  fa.a2.unit29.lesson02.teach.no_mi:
    title: Niente می‌ dopo باید
    gloss: devi andare; non devi andare
    note: Dopo *باید*, *نباید* e *لازم نیست* il verbo è al congiuntivo semplice (*بری*), non alla forma del presente con *می‌*.
  fa.a2.unit29.lesson03.teach.contrast:
    title: نباید non è لازم نیست
    gloss: non devi venire (è vietato); non hai bisogno di venire
    note: In italiano «non devi» e «non serve che» sono diversi, e lo stesso vale in persiano. *نباید بیای* = venire è vietato. *لازم نیست بیای* = puoi venire, ma non sei obbligato.
  fa.a2.unit29.lesson03.teach.notice_form:
    title: 'Gli avvisi: ممنوعه'
    gloss: mangiare è vietato; correre è vietato
    note: 'Cartelli e avvisi spesso nominano l''azione e aggiungono *ممنوعه* («vietato»): *غذا خوردن ممنوعه*. A un amico si dice *نباید غذا بخوری*.'
  fa.a2.unit29.lesson03.teach.extra_rules:
    title: Altre due regole
    gloss: comprare il biglietto, lavare i piatti
    note: 'Negli esercizi queste espressioni seguono *لازم نیست*: puoi farlo, ma non è obbligatorio.'
    example_gloss:
    - Non hai bisogno di comprare il biglietto.
    - Non hai bisogno di lavare i piatti.
    - Non devi mangiare in piscina.
  fa.a2.unit29.lesson04.teach.permission:
    title: Chiedere il permesso
    gloss: Posso entrare? Ti dispiace se mi siedo qui?
    note: '*می‌تونم* + congiuntivo chiede «Posso?» (*می‌تونم بیام؟*). *مشکلی نداره* + congiuntivo chiede «Va bene se...?» (*مشکلی نداره بشینم؟*).'
  fa.a2.unit29.lesson04.teach.answers:
    title: Rispondere a una richiesta di permesso
    gloss: Sì, puoi. No, non puoi. Sì, nessun problema. No, è vietato.
    note: Per dire sì usa *آره، می‌تونی* oppure *آره، مشکلی نداره*. Per dire no usa *نه، نمی‌تونی* oppure *نه، ممنوعه*.
  fa.a2.unit29.lesson04.teach.ejaze:
    title: Un'altra domanda cortese
    gloss: Posso entrare?
    note: '*اجازه هست؟* è un modo cortese per chiedere se si può fare qualcosa. In questa unità devi solo riconoscerlo.'
  fa.a2.unit29.lesson04.teach.house:
    title: 'Regole di casa: la raccolta differenziata'
    gloss: fare la raccolta differenziata, buttare la plastica nel bidone della carta
    note: '*زباله رو جدا کردن* significa fare la raccolta differenziata. La regola dice che la plastica non va nel bidone della carta.'
    example_gloss:
    - Devi fare la raccolta differenziata.
    - Non devi buttare la plastica nel bidone della carta.
  fa.a2.unit29.lesson04.teach.night:
    title: Una regola sul silenzio notturno
    gloss: Di notte non devi parlare ad alta voce
    note: '*بلند حرف زدن* significa parlare ad alta voce. *شب* («di notte») viene per primo.'
    example_gloss:
    - Di notte non devi parlare ad alta voce.
  fa.a2.unit29.lesson05.teach.notice:
    title: Un avviso con le regole
    gloss: Regole. In biblioteca dovete fare silenzio. È vietato mangiare. Prima della piscina dovete fare la doccia. In piscina è vietato correre. In palestra dovete indossare le scarpe sportive, ma non serve portare l'asciugamano. Dovete fare la raccolta differenziata.
    note: Un avviso si rivolge a sconosciuti, quindi usa la desinenza *-ید*. Leggi una volta per capire cosa è obbligatorio, vietato e facoltativo.
  fa.a2.unit29.lesson06.teach.turn01:
    title: Sara chiede il permesso
    gloss: Sara chiede se può venire anche lei in piscina.
    note: '*مشکلی نداره* + congiuntivo chiede il permesso.'
  fa.a2.unit29.lesson06.teach.turn02:
    title: Permesso e obbligo
    gloss: Nima dice di sì e che prima deve fare la doccia.
    note: La risposta dà il permesso, poi aggiunge un obbligo.
  fa.a2.unit29.lesson06.teach.turn03:
    title: Sara chiede cosa è richiesto
    gloss: Sara chiede se deve portare l'asciugamano.
    note: '*باید* + *بیارم* chiede di un obbligo.'
  fa.a2.unit29.lesson06.teach.turn04:
    title: Facoltativo e vietato
    gloss: Nima dice che non serve portare l'asciugamano, ma che in piscina non deve correre.
    note: '*لازم نیست* indica ciò che è facoltativo; *نباید* ciò che è vietato.'
  fa.a2.unit29.lesson06.teach.turn05:
    title: Una seconda domanda
    gloss: Sara chiede se dopo può andare in palestra.
    note: '*می‌تونم* + congiuntivo chiede «Posso?»'
  fa.a2.unit29.lesson06.teach.turn06:
    title: Un'ultima regola
    gloss: Nima dice di sì, ma che deve indossare le scarpe sportive.
    note: 'Di nuovo: prima il permesso, poi la regola.'
