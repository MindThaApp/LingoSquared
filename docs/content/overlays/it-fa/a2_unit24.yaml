    note: Leggi una prima volta per le azioni di sfondo e una seconda volta per l'unica interruzione.
  fa.a2.unit24.lesson06.teach.question:
    title: Cosa stavi facendo?
    gloss: Cosa stavi facendo?
    note: '*داشتی چیکار می‌کردی؟* chiede a un amico quale attività fosse in corso.'
  fa.a2.unit24.lesson06.teach.turn01:
    title: Sara chiede della pioggia
    gloss: Ieri, quando ha iniziato a piovere, cosa stavi facendo?
    note: Sara chiede quale azione di sfondo fosse in corso.
  fa.a2.unit24.lesson06.teach.turn02:
    title: Nima risponde
    gloss: Stavo andando a casa. E tu?
    note: Nima risponde con il passato progressivo alla prima persona.
  fa.a2.unit24.lesson06.teach.turn03:
    title: Sara racconta il blackout
    gloss: Stavo preparando la cena quando è andata via la luce.
