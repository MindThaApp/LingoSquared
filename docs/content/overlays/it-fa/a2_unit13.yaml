course:
  title: Persiano A2
  description: 'Persiano iraniano di livello pre-intermedio: segnalare una perdita d''acqua al portiere del palazzo, leggere la conferma di una richiesta di manutenzione e seguire la telefonata che organizza la riparazione.'
units:
  fa.a2.unit13.maintenance:
    title: Segnalare un problema in casa
lessons:
  fa.a2.unit13.lesson01.maintenance_vocabulary:
    title: Parole sui problemi domestici
  fa.a2.unit13.lesson02.reporting_the_problem:
    title: Segnalare il problema
  fa.a2.unit13.lesson03.reading_a_maintenance_notice:
    title: Leggere un avviso di manutenzione
  fa.a2.unit13.lesson04.maintenance_call_dialogue:
    title: La telefonata
teaching:
  fa.a2.unit13.lesson01.teach.pipe_word:
    title: Tubo
    gloss: tubo
    note: '*لوله* è la parola generica per indicare un tubo.'
    example_gloss: Il tubo del bagno perde.
  fa.a2.unit13.lesson01.teach.leak_word:
    title: Perdita
    gloss: perdita / gocciolio
    note: '*چکه* significa perdita o gocciolio e si usa con *کردن* in *چکه کردن* (perdere, gocciolare).'
    example_gloss: Il tubo perde.
  fa.a2.unit13.lesson01.teach.radiator_word:
    title: Termosifone
    gloss: termosifone / calorifero
    note: '*شوفاژ* è la parola persiana comune per indicare il termosifone o il calorifero.'
    example_gloss: Il termosifone si è rotto.
  fa.a2.unit13.lesson01.teach.broken_word:
    title: Rotto
    gloss: rotto
    note: '*خراب* significa rotto e si usa con *شدن* nella forma *خراب شدن* (rompersi, guastarsi).'
    example_gloss: Il termosifone si è rotto.
  fa.a2.unit13.lesson01.teach.super_word:
    title: Portinaio
    gloss: portinaio / custode
    note: '*سرایدار* è la persona che gestisce e si occupa della manutenzione di un condominio.'
    example_gloss: Ho chiamato il portinaio.
  fa.a2.unit13.lesson01.teach.repair_word:
    title: Riparazione
    gloss: riparazione
    note: '*تعمیر* è la parola generica per indicare una riparazione.'
    example_gloss: Quando viene a ripararlo?
  fa.a2.unit13.lesson01.teach.va_word:
    title: E
    gloss: e
    note: '*و* è la congiunzione di uso comune che compare in tutta questa unità.'
    target_text: و (e)
  fa.a2.unit13.lesson01.teach.ra_note:
    title: Object marker
    gloss: (segna un complemento oggetto determinato)
    note: '*رو* (forma colloquiale di *را*) segna un complemento oggetto determinato e si colloca subito dopo ciò su cui ricade l''azione.'
    target_text: رو (marcatore dell'oggetto)
  fa.a2.unit13.lesson02.teach.pipe_leaking:
    title: Descrivere il problema
    gloss: Il tubo del bagno perde.
    note: '*داره چکه می‌کنه* usa la forma progressiva *داره + verbo* per descrivere un problema in corso, non un fatto isolato.'
  fa.a2.unit13.lesson02.teach.when_can_repair:
    title: Chiedere quando verrà fatta la riparazione
    gloss: Quando può venire a ripararlo?
    note: '*کی می‌تونید ...؟* chiede con cortesia quando qualcuno può fare qualcosa.'
  fa.a2.unit13.lesson02.teach.full_report_and_question:
    title: Unire la segnalazione e la domanda
    gloss: Il tubo del bagno sta perdendo. Quando può venire a ripararlo?
    note: Lo schema completo di segnalazione più domanda su cui si basa questa lezione.
  fa.a2.unit13.lesson03.teach.request_word:
    title: Richiesta
    gloss: richiesta
    note: '*درخواست* è la parola generica per indicare una richiesta; qui è usata con *ثبت شد* (è stata registrata).'
    example_gloss: La sua richiesta di riparazione è stata registrata.
  fa.a2.unit13.lesson03.teach.repairman_word:
    title: Riparatore
    gloss: riparatore / tecnico
    note: '*تعمیرکار* è la persona che viene a fare una riparazione.'
    example_gloss: Il tecnico viene domani.
  fa.a2.unit13.lesson03.teach.notice_text:
    title: Conferma di una richiesta di manutenzione
    gloss: La sua richiesta di riparazione è stata registrata. Il tecnico verrà domani alle 10 del mattino. Si prega di essere in casa.
    note: Una breve conferma ufficiale in stile scritto neutro, che però usa comunque *میاد* e *خونه*, tipici del parlato quotidiano.
  fa.a2.unit13.lesson04.teach.since_when:
    title: Chiedere da quanto tempo
    gloss: Da quanto tempo è così?
    note: '*از کی این‌طوریه؟* chiede da quanto tempo dura un problema.'
  fa.a2.unit13.lesson04.teach.turn01:
    title: سارا segnala il problema
    gloss: سارا saluta e dice che il tubo del suo bagno sta perdendo.
    note: Riprende la forma progressiva della lezione 2.
  fa.a2.unit13.lesson04.teach.turn02:
    title: Il سرایدار chiede da quanto tempo
    gloss: Il portinaio chiede da quanto tempo è così.
    note: Riprende la domanda iniziale di questa stessa lezione.
  fa.a2.unit13.lesson04.teach.turn03:
    title: سارا indica da quanto tempo e aggiunge un dettaglio
    gloss: سارا dice che è da ieri. L'acqua sta finendo sul pavimento.
    note: '*از دیروز* (da ieri) indica la durata; una seconda frase aggiunge un dettaglio.'
  fa.a2.unit13.lesson04.teach.turn04:
    title: Il سرایدار accetta di venire
    gloss: Il portinaio dice che va bene, domani mattina verrà a ripararlo.
    note: '*میام* (forma colloquiale di *می‌آیم*, io vengo) esprime il suo programma.'
  fa.a2.unit13.lesson04.teach.turn05:
    title: سارا conferma che sarà in casa
    gloss: سارا ringrazia e dice che è in casa fino alle 11.
    note: '*خونه‌ام* (forma colloquiale di *خانه هستم*, sono in casa) esprime la sua disponibilità.'
  fa.a2.unit13.lesson04.teach.turn06:
    title: Il سرایدار conferma
    gloss: Il portinaio dice che va benissimo, a domani.
    note: '*می‌بینمتون* (ci vediamo) chiude la telefonata con cortesia.'
