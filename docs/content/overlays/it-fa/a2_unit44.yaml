teaching:
  fa.a2.unit44.lesson01.teach.orders:
    title: Ordini e prenotazioni
    gloss: ordine, camera, prenotazione, pronto
    note: '*سفارش دادن* significa «ordinare»; *رزرو کردن* significa «prenotare».'
    example_gloss:
    - L'ordine è qui.
    - La camera è qui.
    - La prenotazione è qui.
    - La camera è pronta.
  fa.a2.unit44.lesson01.teach.neg:
    title: Non ancora
    gloss: non ancora, non è ancora arrivato, non ho dato, non ho fatto
    note: '*هنوز* con un verbo negativo significa «non ancora».'
    example_gloss:
    - Il mio ordine non è ancora arrivato.
    - Non ho ancora ordinato.
    - Non ho ancora prenotato.
    - La camera non è ancora pronta.
  fa.a2.unit44.lesson01.teach.rule:
    title: هنوز + negazione = non ancora
    gloss: Il mio ordine non è ancora arrivato; non ho ancora ordinato; la camera non è ancora pronta
    note: 'Metti *هنوز* prima di un verbo negativo per dire che qualcosa non è ancora successo. Funzionano sia il passato prossimo (*نیومده*) sia il passato semplice (*ندادم*). Con un verbo affermativo *هنوز* significa «ancora»: *اتاق هنوز اینجاست* (la camera è ancora qui).'
  fa.a2.unit44.lesson02.teach.appointments:
    title: Appuntamenti
    gloss: appuntamento (fascia oraria), medico, libero, lavoro
    note: '*وقت* è un appuntamento o una fascia oraria libera.'
    example_gloss:
    - L'appuntamento dal medico è qui.
    - Il medico è qui.
    - Questo orario è libero.
  fa.a2.unit44.lesson02.teach.dige:
    title: Non più
    gloss: più, non voglio, non (lavora)
    note: '*دیگه* con un verbo negativo significa «non più».'
    example_gloss:
    - Non lo voglio più.
    - Il medico non lavora più qui.
    - Questo orario non è più libero.
  fa.a2.unit44.lesson02.teach.rule:
    title: دیگه + negazione = non più
    gloss: Non voglio più il caffè; il medico non lavora più qui; questo orario non è più libero
    note: Metti *دیگه* prima di un verbo negativo per dire che qualcosa prima era vero ma ora non lo è più. In altre frasi *دیگه* significa anche «un altro / altro», ma con un verbo negativo significa «non più».
  fa.a2.unit44.lesson03.teach.hich_words:
    title: Niente, nessuno, nessun ...
    gloss: niente, nessuno, nessun
    note: '*هیچ* con un verbo negativo significa «nessuno / niente».'
    example_gloss:
    - Non voglio niente.
    - Non c'è nessuno qui.
    - Nessun tavolo è libero.
    - Il tavolo è qui.
  fa.a2.unit44.lesson03.teach.rule:
    title: هیچ + verbo negativo
    gloss: Non voglio niente; non è venuto nessuno; nessun tavolo è libero; nessuna camera è pronta
    note: 'Il persiano usa *هیچ* insieme a un verbo negativo: *هیچی نمی‌خوام*, proprio come in italiano «non voglio niente». Con un nome si aggiunge *ی*: *هیچ میزی*, *هیچ اتاقی*. A differenza dell''italiano, *هیچ* può stare dopo il verbo solo in modo diverso: in persiano il verbo resta sempre negativo, anche quando هیچ viene prima.'
  fa.a2.unit44.lesson04.teach.answers:
    title: Risposte brevi
    gloss: Avete ordinato? No, non ancora. Volete del caffè? No, non più. Volete qualcosa? No, niente.
    note: 'Per correggere rapidamente un errore, inizia con *نه* e poi una parola breve: *هنوز نه*, *دیگه نه*, *هیچی*. Poi puoi aggiungere la frase completa.'
  fa.a2.unit44.lesson04.teach.phrases:
    title: Verificare e correggere
    gloss: è giusto, solo, acqua
    note: '*درسته؟* significa «è giusto?».'
    example_gloss:
    - Due caffè, giusto?
    - Voglio solo acqua.
  fa.a2.unit44.lesson05.teach.reading:
    title: Un problema con la prenotazione
    gloss: 'Nima ha prenotato una camera per due notti. Oggi è andato in albergo, ma la camera non era ancora pronta. L''impiegato ha detto: «Non c''è nessuna camera libera». Nima ha detto: «Allora non voglio più questo albergo».'
    note: Leggi una volta per capire cos'è successo, poi rileggi facendo attenzione a *هنوز*, *هیچ* e *دیگه*.
  fa.a2.unit44.lesson06.teach.turn01:
    title: Il cameriere porta un ordine
    gloss: 'Cameriere: Mi scusi, il suo ordine è pronto. Due caffè, giusto?'
    note: '*درسته؟* chiede una conferma.'
  fa.a2.unit44.lesson06.teach.turn02:
    title: 'Nima corregge: non ancora'
    gloss: 'Nima: No, non ho ancora ordinato.'
    note: '*هنوز ... ندادم* significa «non ancora».'
  fa.a2.unit44.lesson06.teach.turn03:
    title: Il cameriere capisce
    gloss: 'Cameriere: Allora questi caffè non sono suoi.'
    note: '*مال شما نیست* è la forma negativa di *مال شماست*.'
  fa.a2.unit44.lesson06.teach.turn04:
    title: Nima corregge di nuovo
    gloss: 'Nima: Oggi ho già preso il caffè, quindi non voglio più caffè. Non voglio niente, solo acqua.'
    note: '*دیگه* e *هیچی* si usano entrambi con un verbo negativo.'
