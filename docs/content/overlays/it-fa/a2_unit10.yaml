  fa.a2.unit10.lesson01.teach.remote_work_word:
    title: Lavoro da remoto
    gloss: lavoro da remoto / lavoro da casa
    note: '*دورکاری* è la parola persiana moderna di uso comune per il lavoro da remoto.'
  fa.a2.unit10.lesson01.teach.traffic_word:
    title: Traffico
    gloss: traffico
    note: '*ترافیک* è la parola di tutti i giorni per il traffico, un argomento quotidiano ben noto a Teheran.'
  fa.a2.unit10.lesson01.teach.focus_word:
    title: Concentrazione
    gloss: concentrazione
    note: '*تمرکز* è la parola generica per concentrazione.'
  fa.a2.unit10.lesson01.teach.office_word:
    title: Ufficio
    gloss: ufficio
    note: '*دفتر* è la parola generica per ufficio, l''alternativa a *دورکاری* discussa in questa unità.'
  fa.a2.unit10.lesson01.teach.va_word:
    title: E
    gloss: e
    note: '*و* è la comune parola di collegamento usata in tutta questa unità.'
  fa.a2.unit10.lesson02.teach.in_my_opinion_better:
    title: Esprimere un'opinione
    gloss: Secondo me, il lavoro da remoto è meglio.
    note: '*به نظر من ...* (secondo me...) è il modo standard per introdurre un''opinione in persiano.'
  fa.a2.unit10.lesson02.teach.because_traffic_wastes_time:
    title: Dare un motivo con چون (perché)
    gloss: Perché nel traffico di Teheran si perde un sacco di tempo.
    note: '*چون* introduce il motivo a sostegno, un passo avanti rispetto alle semplici frasi dell''A1.'
  fa.a2.unit10.lesson02.teach.full_opinion_with_reason:
    title: Unire opinione e motivo
    gloss: Secondo me, il lavoro da remoto è meglio, perché nel traffico di Teheran si perde un sacco di tempo.
    note: Questo è lo schema completo به نظر من ... چون ... su cui si basa questa unità.
  fa.a2.unit10.lesson03.teach.message_word:
    title: Messaggio
    gloss: messaggio
    note: '*پیام* è la parola generica per messaggio, parlato o scritto.'
  fa.a2.unit10.lesson03.teach.family_word:
    title: La famiglia
    gloss: famiglia
    note: '*خانواده* è la parola generica per famiglia.'
  fa.a2.unit10.lesson03.teach.message_text:
    title: Un messaggio scritto che esprime un'opinione
    gloss: Secondo me il lavoro da remoto è molto meglio, perché nel traffico di Teheran si perde un sacco di tempo e posso stare di più con la mia famiglia.
    note: Una breve opinione scritta con due motivi uniti da *و* (e), nello stile informale e parlato che si usa nei messaggi ai colleghi.
  fa.a2.unit10.lesson04.teach.i_dont_agree:
    title: Dissentire con garbo
    gloss: Non sono d'accordo.
    note: '*من موافق نیستم* è un modo semplice e cortese di dissentire -- non è scortese, solo diretto.'
  fa.a2.unit10.lesson04.teach.turn01:
    title: نگار esprime la sua opinione
    gloss: نگار dice che secondo lei il lavoro da remoto è meglio.
    note: Riprende lo schema *به نظر من ... بهتره* della lezione 2.
  fa.a2.unit10.lesson04.teach.turn02:
    title: آرش dissente
    gloss: آرش dice che non è d'accordo.
    note: '*من موافق نیستم* visto prima in questa lezione.'
  fa.a2.unit10.lesson04.teach.turn03:
    title: نگار chiede perché
    gloss: نگار chiede perché.
    note: '*چرا؟* è la parola di tutti i giorni per "perché?".'
  fa.a2.unit10.lesson04.teach.turn04:
    title: آرش spiega i suoi motivi
    gloss: آرش dice che a casa non riesce a concentrarsi e che gli piace vedere i colleghi.
    note: Due motivi uniti da *و* (e).
  fa.a2.unit10.lesson04.teach.turn05:
    title: نگار concede il punto ma ribadisce il suo motivo
    gloss: نگار dice va bene, ma secondo lei il traffico fa perdere molto tempo.
    note: '*باشه، ولی...* (va bene, ma...) concede educatamente un punto prima di ribadire il proprio.'
  fa.a2.unit10.lesson04.teach.turn06:
    title: آرش è d'accordo ma spiega
    gloss: آرش ammette che è vero, ma dice che ci è abituato.
    note: '*درسته، ولی...* (è vero, ma...) riconosce il punto dell''altra persona.'
