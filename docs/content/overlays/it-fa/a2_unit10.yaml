course:
  title: Persiano A2
  description: 'Persiano dell''Iran pre-intermedio: esprimere un''opinione con una motivazione, leggere un''opinione scritta e rispondere a chi la pensa diversamente -- un dibattito in ufficio sul lavoro da remoto.'
units:
