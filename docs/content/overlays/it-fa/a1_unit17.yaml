teaching:
  fa.a1.unit17.lesson01.teach.halam_khoob_nist_phrase:
    title: Non mi sento bene
    gloss: Non mi sento bene
    note: 'حالم خوب نیست significa letteralmente «il mio stato non è buono»: è il modo standard per dire che non ti senti bene.'
  fa.a1.unit17.lesson01.teach.sardard_word:
    title: Mal di testa
    gloss: mal di testa
    note: سردرد significa «mal di testa».
    example_gloss: Ho mal di testa.
  fa.a1.unit17.lesson01.teach.daram_word:
    title: Io ho
    gloss: ho
    note: دارم significa «ho» e si usa con un sostantivo che indica un sintomo (سردرد دارم = ho mal di testa).
    target_text: دارم (ho)
  fa.a1.unit17.lesson01.teach.tab_word:
    title: Febbre
    gloss: febbre
    note: تب significa «febbre».
    example_gloss: Ho la febbre.
  fa.a1.unit17.lesson02.teach.delam_dard_mikone_phrase:
    title: Ho mal di stomaco
    gloss: ho mal di stomaco
    note: 'دلم درد می‌کنه significa letteralmente «il mio stomaco fa male»: è il modo colloquiale per dire che hai mal di stomaco.'
  fa.a1.unit17.lesson02.teach.khastam_word:
    title: Sono stanco
    gloss: sono stanco/a
    note: '*خسته‌ام* significa sono stanco/a: la desinenza *-ام* è la forma breve di *هستم* (sono) attaccata a *خسته* (stanco).'
    example_gloss: Oggi sono stanco/a.
  fa.a1.unit17.lesson03.teach.komak_word:
    title: Aiuto
    gloss: aiuto
    note: کمک significa aiuto.
    example_gloss: Puoi aiutarmi?
  fa.a1.unit17.lesson03.teach.mitooni_word:
    title: Tu puoi
    gloss: puoi
    note: می‌تونی è la contrazione colloquiale di می‌توانی (puoi), seconda persona informale.
    target_text: می‌تونی (puoi, informale)
  fa.a1.unit17.lesson03.teach.komakam_koni_phrase:
    title: Può aiutarmi?
    gloss: Può aiutarmi?
    note: '*می‌تونی کمکم کنی؟* unisce *می‌تونی* (puoi) con *کمکم کنی* (letteralmente «fai il mio aiuto», cioè mi aiuti).'
  fa.a1.unit17.lesson04.teach.doctor_word:
    title: Medico
    gloss: medico
    note: دکتر significa medico, dottore.
    example_gloss: Il dottore ha detto di riposare.
  fa.a1.unit17.lesson04.teach.daroo_word:
    title: Medicina
    gloss: medicina
    note: دارو significa medicina, farmaco.
    example_gloss: Prendi questa medicina.
  fa.a1.unit17.lesson04.teach.esterahat_kon_phrase:
    title: Riposa (imperativo)
    gloss: riposarsi
    note: 'استراحت کن è l''imperativo informale: riposa!'
  fa.a1.unit17.lesson04.teach.ab_bokhor_phrase:
    title: Bevi acqua (imperativo)
    gloss: bere acqua
    note: 'آب بخور è l''imperativo informale: bevi acqua!'
  fa.a1.unit17.lesson04.teach.va_word:
    title: E
    gloss: e
    note: و significa «e» e unisce due frasi o due elementi.
    target_text: و (e)
  fa.a1.unit17.lesson05.teach.reading_text:
    title: Esempio di nota sui sintomi
    gloss: Ho mal di testa e ho la febbre. Sono stanco/a.
    note: Una breve nota in prima persona che combina il lessico dei sintomi di questa unità.
  fa.a1.unit17.lesson06.teach.names:
    title: Nima e Sara
    gloss: Nima, Sara
    note: Nomi iraniani comuni usati in tutto il corso.
    example_gloss:
    - Nima ha mal di testa.
    - Sara aiuta Nima.
  fa.a1.unit17.lesson06.teach.ham_word:
    title: Anche
    gloss: anche
    note: هم significa anche, e si mette dopo la parola a cui si riferisce (آب هم بخور = bevi anche l'acqua).
    target_text: هم (anche)
  fa.a1.unit17.lesson06.teach.bashe_word:
    title: Bene
    gloss: bene
    note: باشه è la forma colloquiale contratta di باشد («va bene», «d'accordo»).
    example_gloss: Va bene, mi riposo.
  fa.a1.unit17.lesson06.teach.mamnoon_word:
    title: Ringraziare
    gloss: grazie
    note: ممنون significa «grazie».
    example_gloss: Grazie per il tuo aiuto.
  fa.a1.unit17.lesson06.teach.dareh_grammar:
    title: Lui/lei ha
    gloss: ha
    note: داره è la forma colloquiale della terza persona di دارد (ha), parallela a دارم alla prima persona.
    target_text: داره (ha, terza persona colloquiale)
  fa.a1.unit17.lesson06.teach.dialogue_line1:
    title: Nima dice
    gloss: Non mi sento bene. Ho mal di testa e ho la febbre.
  fa.a1.unit17.lesson06.teach.dialogue_line2:
    title: Sara consiglia
    gloss: Riposa. Bevi anche dell'acqua.
  fa.a1.unit17.lesson06.teach.dialogue_line3:
    title: Nima risponde
    gloss: Va bene, grazie.
