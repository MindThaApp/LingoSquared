teaching:
  fa.a2.unit49.lesson01.teach.event_words:
    title: Luoghi ed eventi a cui invitare qualcuno
    gloss: cinema, concerto, teatro, compleanno, biglietto
    note: '*کنسرت* è il concerto e *تئاتر* è lo spettacolo teatrale o il teatro. *بلیت* è il biglietto che puoi avere per un evento.'
    example_gloss:
    - Ho due biglietti per il concerto.
    - Lo spettacolo era molto bello.
    - Venerdì vado al cinema.
    - Ho comprato un regalo per il compleanno del mio amico.
  fa.a2.unit49.lesson01.teach.invite_words:
    title: Invito e «andiamo?»
    gloss: invito, andiamo / andiamo?
    note: '*دعوت* è l''invito. *بریم* («andiamo / andiamo?») chiude una proposta amichevole, spesso con *با هم* («insieme»).'
    example_gloss:
    - Grazie per l'invito.
    - Nima invita Sara.
    - Andiamo al cinema insieme?
    - Andiamo al parco stasera?
  fa.a2.unit49.lesson01.teach.more_events:
    title: Altri tipi di ritrovo
    gloss: festa, picnic, ritrovo tra amici, celebrazione
    note: '*مهمونی* è la festa, *پیک‌نیک* è il picnic, *دورهمی* è un ritrovo informale tra amici e *جشن* è una celebrazione.'
    example_gloss:
    - Stasera facciamo una festa.
    - Venerdì andiamo a fare un picnic.
    - Sabato facciamo una celebrazione e un ritrovo tra amici.
  fa.a2.unit49.lesson01.teach.invitation_extras:
    title: Altre parole per gli inviti
    gloss: pranzo, gita, biglietto d'invito
    note: '*ناهار* è il pranzo, *گردش* è una gita o passeggiata e *دعوتنامه* è un biglietto d''invito o un invito scritto.'
    example_gloss:
    - Venerdì pranziamo insieme.
    - Andiamo a fare una gita insieme?
    - Ho un biglietto d'invito.
  fa.a2.unit49.lesson01.teach.invite_forms:
    title: Tre modi semplici per invitare
    gloss: Vuoi venire a un concerto? Vieni a teatro con me? Andiamo al cinema insieme?
    note: Tutte e tre sono domande. *می‌خوای بیای ...؟* chiede se l'altra persona vuole venire. *با من میای ...؟* chiede in modo diretto. *با هم بریم ...؟* propone di andare insieme. Aggiungi prima un'indicazione di tempo (*فردا*, *جمعه شب*) per rendere chiaro l'invito.
  fa.a2.unit49.lesson02.teach.accept_words:
    title: Parole per dire di sì
    gloss: sì, certo, che bello, ottimo, va bene, vengo
    note: '*آره* e *باشه* dicono sì. *حتما* aggiunge «certamente». *چه خوب* e *عالیه* mostrano che sei contento.'
    example_gloss:
    - Sì, vengo di sicuro.
    - Che bello! Grazie.
    - Va bene, le otto vanno bene.
    - Ottimo! Sabato vengo.
  fa.a2.unit49.lesson02.teach.detail_words:
    title: Chiedere i dettagli
    gloss: a che ora, dove, quando
    note: 'Dopo aver accettato, chiedi il dettaglio che ti serve: *ساعت چند؟* (a che ora), *کجا؟* (dove), *کی؟* (quando).'
    example_gloss:
    - A che ora andiamo?
    - Dove andiamo?
    - Quando andiamo?
  fa.a2.unit49.lesson02.teach.accept_forms:
    title: Dire di sì e dire forse
    gloss: Grazie per l'invito! Vengo di sicuro; posso venire; forse posso venire
    note: 'Un sì sicuro è *حتما میام*. *می‌تونم بیام* dice che sei in grado di venire. *شاید بتونم بیام* è un «forse» prudente: non è una promessa. Per essere educato, comincia con *ممنون از دعوت*.'
  fa.a2.unit49.lesson03.teach.decline_words:
    title: Parole per dire di no con garbo
    gloss: purtroppo, scusa, non posso, ma
    note: Attenua il rifiuto con *متاسفانه* o *ببخشید* prima di *نمی‌تونم بیام*.
    example_gloss:
    - Purtroppo non posso venire.
    - Scusa, venerdì non posso.
    - Grazie, ma non posso.
  fa.a2.unit49.lesson03.teach.reason_words:
    title: Motivi per dire di no
    gloss: ho da lavorare, ho un appuntamento, ho una riunione, sono malato, devo studiare, devo andare a lezione
    note: '*باید* («dovere») sta prima di un verbo breve: *باید درس بخونم*, *باید برم کلاس*. Gli altri motivi usano *دارم*: *کار دارم*, *قرار دارم*.'
    example_gloss:
    - Venerdì ho da lavorare.
    - Stasera ho un appuntamento.
    - Domani ho una riunione.
    - Oggi sono malato.
    - Devo studiare.
    - Devo andare a lezione.
  fa.a2.unit49.lesson03.teach.future_reasons:
    title: Un motivo legato ai tuoi programmi
    gloss: perché domani vado al nord, perché nel fine settimana vado a Teheran
    note: 'Un motivo può essere un programma: *چون* seguito da *می‌خوام برم* e un luogo.'
    example_gloss:
    - Perché domani vado al nord.
    - Perché nel weekend vado a Teheran.
  fa.a2.unit49.lesson03.teach.host_schedule:
    title: Ospitare e i tuoi impegni
    gloss: padrone di casa, ospite, occupato, libero
    note: '*میزبان* è chi ospita (il padrone di casa) e *مهمون* è un ospite. Usa *مشغولم* quando sei occupato/a e *آزادم* quando sei libero/a.'
    example_gloss:
    - Sara organizza la festa a casa sua.
    - Stasera ho un ospite.
    - Venerdì sono occupato e sabato sono libero.
  fa.a2.unit49.lesson03.teach.hosting_extras:
    title: Ospitare e avere tempo
    gloss: ospitalità, accoglienza degli ospiti, occasione / tempo
    note: '*میزبانی* è l''atto di ospitare. *پذیرایی* è accogliere e servire gli ospiti. *فرصت* significa occasione o tempo sufficiente per fare qualcosa.'
    example_gloss:
    - Sara fa gli onori di casa.
    - Sara accoglie e serve l'ospite.
    - Sabato ho tempo.
  fa.a2.unit49.lesson03.teach.decline_pattern:
    title: Dire di no spiegando il motivo
    gloss: Scusa, non posso venire, perché devo studiare
    note: 'Un rifiuto cortese ha tre parti: le scuse (*ببخشید* o *متاسفانه*), il rifiuto (*نمی‌تونم بیام*) e il motivo con *چون*. Il motivo può anche venire per primo: *چون باید درس بخونم، نمی‌تونم بیام*.'
  fa.a2.unit49.lesson04.teach.alt_words:
    title: Proporre un altro giorno
    gloss: ma, che ne dici di sabato, la settimana prossima, un'altra volta
    note: '*ولی* («ma») collega il rifiuto alla nuova proposta. *شنبه چطوره؟* propone un giorno diverso.'
    example_gloss:
    - Venerdì non posso, ma sabato posso.
    - Che ne dici di sabato?
    - La settimana prossima posso.
    - Andremo un'altra volta.
  fa.a2.unit49.lesson04.teach.if_plan:
    title: Se hai tempo
    gloss: se hai tempo
    note: '*اگه* («se») seguito dal presente esprime una condizione amichevole: *اگه وقت داری، با هم می‌ریم*.'
    example_gloss:
    - Se hai tempo, andiamo insieme.
    - Se sabato hai tempo, vieni.
  fa.a2.unit49.lesson04.teach.alt_pattern:
    title: No, con un motivo e un'altra idea
    gloss: Non posso venire, perché ho da fare. Ma sabato posso
    note: 'Un buon rifiuto non si ferma al no. Dai il motivo con *چون*, poi proponi un altro momento con *ولی*: *ولی شنبه می‌تونم*. Puoi anche chiedere *شنبه چطوره؟*'
  fa.a2.unit49.lesson05.teach.reading_invite:
    title: L'invito di Sara
    gloss: Ciao Nima! Venerdì sera ho due biglietti per un concerto. Vuoi venire con me? Andiamo alle otto. A presto, Sara
    note: Trova l'evento, il giorno e l'ora.
  fa.a2.unit49.lesson05.teach.reading_reply:
    title: La risposta di Nima
    gloss: Ciao Sara! Grazie dell'invito. Purtroppo venerdì non posso venire, perché devo studiare. Ma sabato posso. Sabato sera andiamo a teatro insieme? A presto, Nima
    note: Trova il ringraziamento, il rifiuto, il motivo e la nuova proposta.
  fa.a2.unit49.lesson06.teach.turn01:
    title: Sara invita Nima
    gloss: Ciao Nima! Venerdì sera vuoi venire a un concerto con me?
    note: Sara invita con *می‌خوای*.
  fa.a2.unit49.lesson06.teach.turn02:
    title: Nima ringrazia e rifiuta
    gloss: Grazie dell'invito! Ma purtroppo venerdì non posso, perché devo studiare.
    note: Ringraziamento, rifiuto e motivo in una sola battuta.
  fa.a2.unit49.lesson06.teach.turn03:
    title: Sara propone un altro giorno
    gloss: Che ne dici di sabato? Vuoi andare a teatro?
    note: Un nuovo giorno e un nuovo evento.
  fa.a2.unit49.lesson06.teach.turn04:
    title: Nima accetta e chiede l'ora
    gloss: Sì, sabato posso. A che ora?
    note: Nima accetta e chiede un dettaglio.
  fa.a2.unit49.lesson06.teach.turn05:
    title: Sara dice l'ora
    gloss: Alle otto.
    note: Una risposta breve.
  fa.a2.unit49.lesson06.teach.turn06:
    title: Nima conferma
    gloss: Perfetto! Allora sabato vengo. A presto!
    note: '*پس* («allora») conferma il programma.'
