course:
  title: Persiano A1
  description: 'Persiano iraniano per principianti: descrivere l''altezza di una persona (alto/basso), i capelli (lunghezza e colore: neri, biondi), il colore degli occhi (castani, verdi, azzurri) e se porta gli occhiali, chiedere «Com''è fisicamente?», un breve brano di lettura sull''aspetto di نیما e un dialogo finale tra نیما e سارا per riconoscere مریم, amica di سارا.'
