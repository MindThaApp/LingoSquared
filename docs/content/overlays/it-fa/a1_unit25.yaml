  fa.a1.unit25.lesson06.new_friend_dialogue:
    title: 'Dialogo: una nuova amica'
teaching:
  fa.a1.unit25.lesson01.teach.oo_review:
    title: Lui / lei
    gloss: lui / lei
    note: '*او* ricompare qui come soggetto delle descrizioni fisiche.'
  fa.a1.unit25.lesson01.teach.ghad_review:
    title: Altezza
    gloss: altezza
    note: '*قد* ricompare qui da solo. *قدش* aggiunge il suffisso possessivo *-ش* (la sua altezza), con lo stesso schema di *امتحانش* nell''unità 20.'
    example_gloss: Nima è alto.
  fa.a1.unit25.lesson01.teach.boland_word:
    title: Alto
    gloss: alto
    note: '*بلند* significa «alto» (o «lungo»). *قدش بلنده* significa letteralmente «la sua altezza è alta»: il modo colloquiale naturale per dire che qualcuno è alto.'
    example_gloss: È alto.
  fa.a1.unit25.lesson01.teach.kotah_word:
    title: Basso
    gloss: basso
    note: '*کوتاه* significa «basso» (o «corto»).'
    example_gloss: È basso.
  fa.a1.unit25.lesson02.teach.mo_word:
    title: I capelli
    gloss: capelli
    note: '*مو* significa «capelli». *موی* è la forma con ezafe (di collegamento) usata davanti a un aggettivo, come in *موی بلند* (capelli lunghi).'
    example_gloss: Ha i capelli lunghi.
  fa.a1.unit25.lesson02.teach.moohash_word:
    title: I suoi capelli
    gloss: i suoi capelli
    note: '*موهاش* unisce il plurale *موها* (capelli) al suffisso possessivo *-ش*: «i suoi capelli».'
  fa.a1.unit25.lesson02.teach.meshki_word:
    title: Nero
    gloss: nero
    note: '*مشکی* è la parola colloquiale di uso comune per capelli/occhi neri, più naturale qui di *سیاه* (unità 20), che si addice di più ai vestiti che ai capelli.'
    example_gloss: Ha i capelli neri.
  fa.a1.unit25.lesson02.teach.bolond_word:
    title: Biondo
    gloss: biondo
    note: '*بلوند* (un prestito) significa «biondo».'
    example_gloss: Ha i capelli biondi.
  fa.a1.unit25.lesson03.teach.cheshm_word:
    title: Occhio
    gloss: occhio
    note: '*چشم* significa «occhio». *چشمای* è la forma colloquiale del plurale con ezafe (occhi di...), come in *چشمای آبی* (occhi azzurri).'
    example_gloss: Ha gli occhi castani.
  fa.a1.unit25.lesson03.teach.cheshmash_word:
    title: I suoi occhi
    gloss: i suoi occhi
    note: '*چشماش* unisce il plurale colloquiale *چشما* al suffisso possessivo *-ش*: «i suoi occhi». Nota che *چشماش آبیه* usa la desinenza singolare *-ه* anche se *چشما* è plurale: in persiano è normale, perché i plurali di cose non umane di solito vogliono il verbo al singolare.'
  fa.a1.unit25.lesson03.teach.ghahveei_word:
    title: Marrone
    gloss: marrone
    note: '*قهوه‌ای* (letteralmente «color caffè») significa «marrone/castano».'
    example_gloss: Ha gli occhi castani.
  fa.a1.unit25.lesson03.teach.sabz_word:
    title: Verde
    gloss: verde
    note: '*سبز* significa «verde».'
    example_gloss: Ha gli occhi verdi.
  fa.a1.unit25.lesson03.teach.abi_review:
    title: Blu
    gloss: blu
    note: '*آبی* ricompare qui per il colore degli occhi.'
    example_gloss: Ha gli occhi azzurri.
  fa.a1.unit25.lesson04.teach.man_review:
    title: io
    gloss: io
    note: '*من*, ormai ben noto, ricompare qui per descrivere se stessi.'
    example_gloss: Ho i capelli castani.
  fa.a1.unit25.lesson04.teach.daram_review:
    title: Ho / ha
    gloss: ho / ha
    note: '*دارم*/*داره* funzionano allo stesso modo con un tratto fisico: *موی مشکی دارم* significa «Ho i capelli neri».'
  fa.a1.unit25.lesson04.teach.eynak_word:
    title: Occhiali
    gloss: occhiali
    note: '*عینک* significa «occhiali».'
    example_gloss: Porta gli occhiali.
  fa.a1.unit25.lesson04.teach.mizane_word:
    title: Lui/lei porta
    gloss: lui/lei porta
    note: '*می‌زنه* (letteralmente «colpisce») è il verbo naturale per dire che si portano gli occhiali: *عینک می‌زنه* significa «porta gli occhiali», un verbo diverso da *می‌کنم* (faccio) delle unità 8 e 24.'
  fa.a1.unit25.lesson04.teach.che_shekliye_phrase:
    title: Che aspetto ha?
    gloss: com'è (fisicamente)?
    note: '*چه شکلیه؟* significa letteralmente «che forma ha?»: il modo colloquiale standard per chiedere com''è fisicamente qualcuno.'
  fa.a1.unit25.lesson04.teach.va_review:
    title: E
    gloss: e
    note: '*و* significa «e», già usato così nelle unità 14 e 24.'
    example_gloss: È alto e ha i capelli neri.
  fa.a1.unit25.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, personaggio presentato già nell''unità 11, ricompare qui.'
    example_gloss: Nima è amico di Sara.
  fa.a1.unit25.lesson05.teach.reading_text:
    title: 'Lettura: l''aspetto di Nima'
    gloss: Nima è alto. Ha i capelli neri e gli occhi castani. Porta gli occhiali.
    note: 'Questo brano riutilizza tutte le strutture delle lezioni 1-4, quasi senza vocaboli nuovi: devi solo riconoscerle in un testo continuo.'
  fa.a1.unit25.lesson06.teach.maryam_name:
    title: Maryam
    gloss: Maryam
    note: '*مریم* è un nuovo personaggio: un''amica di سارا che نیما non ha ancora conosciuto.'
    example_gloss: Maryam è amica di Sara.
  fa.a1.unit25.lesson06.teach.alan_review:
    title: Adesso
    gloss: adesso, ora
    note: '*الان* ricompare qui.'
    example_gloss: Maryam arriva adesso.
  fa.a1.unit25.lesson06.teach.miad_word:
    title: Sta venendo
    gloss: sta venendo
    note: '*میاد* è la forma colloquiale del presente di *آمدن* (venire).'
    example_gloss: Maryam arriva adesso.
  fa.a1.unit25.lesson06.teach.rangiye_phrase:
    title: Di che colore è?
    gloss: di che colore è?
    note: '*چه رنگیه؟* unisce *چه* (che, dalla lezione 4), *رنگی* (colorato, da *رنگ* + *-ی*) e *-ه* (è): «di che colore è?»'
  fa.a1.unit25.lesson06.teach.bashe_mamnoon_review:
    title: Va bene, grazie
    gloss: va bene, grazie
    note: '*باشه* e *ممنون*, entrambi già visti, si uniscono qui in una naturale battuta di chiusura.'
  fa.a1.unit25.lesson06.teach.dialogue_line1:
    title: 'Sara: Maryam arriva adesso.'
    gloss: Maryam arriva adesso.
  fa.a1.unit25.lesson06.teach.dialogue_line2:
    title: 'Nima: Com''è Maryam?'
    gloss: Com'è Maryam?
  fa.a1.unit25.lesson06.teach.dialogue_line3:
    title: 'Sara: È alta e ha i capelli neri.'
    gloss: È alta e ha i capelli neri.
  fa.a1.unit25.lesson06.teach.dialogue_line4:
    title: 'Nima: Di che colore sono i suoi occhi?'
    gloss: Di che colore sono i suoi occhi?
  fa.a1.unit25.lesson06.teach.dialogue_line5:
    title: 'Sara: Ha gli occhi castani.'
    gloss: Ha gli occhi castani.
  fa.a1.unit25.lesson06.teach.dialogue_line6:
    title: 'Nima: Va bene, grazie.'
    gloss: Va bene, grazie.
