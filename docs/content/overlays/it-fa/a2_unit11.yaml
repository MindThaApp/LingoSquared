course:
  title: Persiano A2
  description: 'Farsi iraniano di livello pre-intermedio: aprire un conto in banca, chiedere quali documenti servono, fare una richiesta cortese con il condizionale e seguire una conversazione allo sportello, dalla richiesta al ritiro della carta.'
units:
  fa.a2.unit11.banking:
    title: Aprire un conto in banca
lessons:
  fa.a2.unit11.lesson01.banking_vocabulary:
    title: Parole della banca
  fa.a2.unit11.lesson02.requesting_an_account:
    title: Richiedere un conto
  fa.a2.unit11.lesson03.reading_a_bank_notice:
    title: Leggere un avviso della banca
  fa.a2.unit11.lesson04.bank_counter_dialogue:
    title: Allo sportello della banca
teaching:
  fa.a2.unit11.lesson01.teach.bank_word:
    title: Banca
    gloss: banca
    note: '*بانک* è la parola generica per «banca».'
    example_gloss: La banca è vicino alla mia nuova casa.
  fa.a2.unit11.lesson01.teach.account_word:
    title: Conto
    gloss: conto
    note: '*حساب* è la parola generica per «conto».'
    example_gloss: Voglio aprire un conto.
  fa.a2.unit11.lesson01.teach.bank_card_word:
    title: Carta bancaria
    gloss: carta bancaria
    note: '*کارت بانکی* è la normale carta di debito/bancomat che viene rilasciata quando si apre un conto.'
    example_gloss: La mia carta bancaria ha un codice PIN.
  fa.a2.unit11.lesson01.teach.pin_word:
    title: codice PIN
    gloss: codice PIN / password
    note: '*رمز* è la parola per «codice PIN» o «password».'
    example_gloss: Non dimenticare il PIN della tua carta.
  fa.a2.unit11.lesson01.teach.balance_word:
    title: Saldo
    gloss: saldo
    note: '*موجودی* è la parola per il saldo di un conto.'
    example_gloss: Il saldo del mio conto è basso.
  fa.a2.unit11.lesson01.teach.document_word:
    title: Documento
    gloss: documento
    note: '*مدرک* è la parola generica per «documento», già vista nell''unità precedente sulla registrazione.'
    example_gloss: Per aprire un conto serve un documento.
  fa.a2.unit11.lesson01.teach.baz_kardan_note:
    title: Aprire (verbo con verbo leggero)
    gloss: aprire
    note: '*باز کردن* significa letteralmente «aperto fare»: il persiano forma molti verbi così, con un nome o un aggettivo più un verbo leggero come *کردن*.'
  fa.a2.unit11.lesson01.teach.ra_note:
    title: Marcatore dell'oggetto
    gloss: (segna un complemento oggetto determinato)
    note: '*رو* (forma colloquiale di *را*) segna un complemento oggetto determinato: si mette subito dopo ciò su cui ricade l''azione.'
  fa.a2.unit11.lesson01.teach.recap_registration_terms:
    title: Carta d'identità nazionale e prova di residenza
    gloss: carta d'identità nazionale e documento che attesta l'indirizzo
    note: '*کارت ملی* e *مدرک آدرس* sono i due documenti necessari per la visita in banca di questa unità, già visti nell''unità precedente sulla registrazione.'
  fa.a2.unit11.lesson02.teach.i_want_to_open_account:
    title: Richiesta di aprire un conto
    gloss: Vorrei aprire un conto in banca.
    note: '*می‌خواستم ...* è la stessa forma di richiesta cortese attenuata vista nell''unità precedente sulla registrazione.'
  fa.a2.unit11.lesson02.teach.if_bring_documents:
    title: Esprimere una condizione con اگر (se)
    gloss: Se porta i documenti, può aprire un conto oggi stesso.
    note: '*اگر ...، ...* è il passo avanti di livello A2 con il periodo ipotetico: prima si dà la condizione, poi il risultato.'
  fa.a2.unit11.lesson02.teach.full_request_with_condition:
    title: Unire la richiesta e la condizione
    gloss: Vorrei aprire un conto in banca. Se porta i documenti, si può fare oggi stesso.
    note: Lo schema completo di richiesta più condizione su cui si basa questa lezione.
  fa.a2.unit11.lesson03.teach.necessary_word:
    title: Necessario
    gloss: necessario / che serve
    note: '*لازم* è la parola generica per «necessario» o «che serve».'
    example_gloss: Per aprire un conto serve la carta d'identità nazionale.
  fa.a2.unit11.lesson03.teach.working_hours_word:
    title: Orario di lavoro
    gloss: orario di lavoro
    note: '*ساعت کاری* è l''espressione standard per l''orario di lavoro di un''attività.'
    example_gloss: L'orario di lavoro della banca va dalle 8 del mattino alle 2 del pomeriggio.
  fa.a2.unit11.lesson03.teach.notice_text:
    title: Un avviso della banca sull'apertura di un conto
    gloss: Per aprire un conto servono la carta d'identità nazionale e un documento che attesti l'indirizzo. L'orario di lavoro della banca va dalle 8 del mattino alle 2 del pomeriggio.
    note: Un breve avviso ufficiale in stile scritto neutro, che usa comunque il *لازمه* della lingua parlata di tutti i giorni.
  fa.a2.unit11.lesson04.teach.how_can_i_help:
    title: Come posso aiutarla?
    gloss: Prego, come posso aiutarla?
    note: '*بفرمایید، چه کمکی می‌تونم بکنم؟* è la tipica formula di cortesia con cui si apre una conversazione a uno sportello.'
  fa.a2.unit11.lesson04.teach.turn01:
    title: L'impiegato (کارمند) saluta سارا
    gloss: L'impiegato saluta e chiede come può aiutare.
    note: Riprende la formula di apertura di questa lezione.
  fa.a2.unit11.lesson04.teach.turn02:
    title: سارا espone la sua richiesta
    gloss: سارا dice che vorrebbe aprire un conto in banca.
    note: Riprende lo schema *می‌خواستم ...* della lezione 2.
  fa.a2.unit11.lesson04.teach.turn03:
    title: L'impiegato (کارمند) chiede i documenti
    gloss: L'impiegata chiede se ha con sé la carta d'identità nazionale e un documento che attesti l'indirizzo.
    note: '*کارت ملی* e *مدرک آدرس* sono già stati introdotti nell''unità precedente sull''iscrizione.'
  fa.a2.unit11.lesson04.teach.turn04:
    title: سارا conferma ciò che ha portato
    gloss: 'سارا dice di sì: ha portato la carta d''identità nazionale e la bolletta della luce della sua nuova casa.'
    note: '*قبض برق* (bolletta della luce) riprende il vocabolario di *قبض* dell''unità precedente sull''iscrizione.'
  fa.a2.unit11.lesson04.teach.turn05:
    title: کارمند conferma i tempi
    gloss: 'L''impiegata dice che va benissimo: la sua carta bancaria sarà pronta entro tre giorni.'
    note: '*تا سه روز دیگه* (entro tre giorni) indica i tempi di consegna.'
  fa.a2.unit11.lesson04.teach.turn06:
    title: سارا chiede del PIN
    gloss: سارا chiede quando riceverà il codice PIN.
    note: Qui *کی* significa «quando»; la stessa parola significa anche «chi», e il contesto aiuta a distinguerli.
  fa.a2.unit11.lesson04.teach.turn07:
    title: کارمند risponde sul PIN
    gloss: L'impiegata dice che lo riceverà lo stesso giorno in cui ritirerà la carta.
    note: '*همون روزی که ...* significa «lo stesso giorno in cui ...».'
