  fa.a1.unit05.lesson01.teach.dastshooyi:
    title: Bagno
    gloss: bagno
    note: دستشویی è la parola di uso quotidiano per indicare il bagno (la toilette).
    example_gloss: Dov'è il bagno?
  fa.a1.unit05.lesson01.teach.inja_oonja:
    title: Qui, lì
    gloss: qui, lì
    note: اینجا (qui) e اونجا (lì; forma colloquiale parlata di آنجا) sono le forme parlate di uso quotidiano.
  fa.a1.unit05.lesson01.teach.kojast:
    title: Dov'è l'hotel?
    gloss: Dov'è l'hotel?
    note: کجاست unisce کجا (dove) e است (è).
  fa.a1.unit05.lesson01.teach.bebakhshid:
    title: Scusi, dov'è l'hotel?
    gloss: Scusi, dov'è l'hotel?
    note: ببخشید (scusi) è il modo educato e standard per rivolgere una domanda a uno sconosciuto.
  fa.a1.unit05.lesson02.teach.samt:
    title: Lato, direzione
    gloss: lato, direzione
    note: سمت si usa con راست/چپ per dire «il lato destro/sinistro».
    example_gloss: L'hotel è da questa parte.
  fa.a1.unit05.lesson02.teach.rast:
    title: Destra
    gloss: destra
    note: راست significa anche «vero/giusto» in altri contesti, ma qui indica la direzione.
    example_gloss: Andate a destra.
  fa.a1.unit05.lesson02.teach.chap:
    title: Sinistra
    gloss: sinistra
    note: چپ, la direzione.
    example_gloss: Andate a sinistra.
  fa.a1.unit05.lesson02.teach.samte_rast:
    title: È sulla destra
    gloss: È sulla destra.
    note: Nel parlato quotidiano, سمت راست است diventa سمت راسته.
  fa.a1.unit05.lesson02.teach.samte_chap:
    title: È sulla sinistra
    gloss: È sulla sinistra.
    note: Nel parlato quotidiano, سمت چپ است diventa سمت چپه.
  fa.a1.unit05.lesson02.teach.restoran_samte_rast:
    title: Il ristorante è sulla destra
    gloss: Il ristorante è sulla destra.
    note: Unisce رستوران alla frase di luogo di questa lezione.
  fa.a1.unit05.lesson03.teach.mostaghim:
    title: Dritto
    gloss: dritto
    note: مستقیم, la parola di uso quotidiano per dire «dritto».
    example_gloss: Vada dritto.
  fa.a1.unit05.lesson03.teach.berid:
    title: Andate (forma di cortesia)
    gloss: andate (forma di cortesia)
    note: برید è la forma rispettosa da usare quando si indica a uno sconosciuto di andare in un luogo.
    example_gloss: Vada a destra.
  fa.a1.unit05.lesson03.teach.mostaghim_berid:
    title: Vai dritto
    gloss: Vai dritto.
    note: مستقیم برید — l'indicazione standard e cortese.
  fa.a1.unit05.lesson03.teach.bad:
    title: Dopo, poi
    gloss: dopo, poi
    note: بعد collega due passaggi di un'indicazione stradale.
    example_gloss: Poi andate a sinistra.
  fa.a1.unit05.lesson03.teach.mostaghim_bad_samte_rast:
    title: Andate dritto; c'è un ristorante sulla destra
    gloss: Andate dritto. Poi c'è un ristorante sulla destra.
    note: Riprende سمت راست (sulla destra) dalla lezione precedente e lo completa con un punto di riferimento.
  fa.a1.unit05.lesson03.teach.mamnoon:
    title: Grazie. Prego.
    gloss: Grazie. Prego.
    note: ممنون / خواهش می‌کنم è lo scambio di cortesia standard, già visto nell'Unità 1.
  fa.a1.unit05.lesson04.teach.kenar:
    title: Accanto a
    gloss: accanto a, vicino a
    note: 'کنار mette una cosa accanto a un''altra: هتل کنار رستورانه significa «l''hotel è accanto al ristorante».'
    example_gloss: L'hotel è accanto al ristorante.
  fa.a1.unit05.lesson04.teach.azadi:
    title: Azadi (nome)
    gloss: Azadi (libertà)
    note: آزادی è molto usato nei nomi di luoghi e attività in Iran, perciò هتل آزادی suona come un nome d'hotel naturale.
    example_gloss: Piazza Azadi è famosa.
  fa.a1.unit05.lesson04.teach.hamoon:
    title: Proprio quello
    gloss: proprio quello
    note: همون è la forma parlata quotidiana di همان e rimanda al ristorante appena menzionato.
    example_gloss: Quel ristorante è buono.
  fa.a1.unit05.lesson04.teach.dialogue_line1:
    title: Scusi, dov'è l'hotel Azadi?
    gloss: 'Sara: Scusi, dov''è l''hotel Azadi?'
    note: Sara è il personaggio già incontrato nell'Unità 2.
  fa.a1.unit05.lesson04.teach.dialogue_line2:
    title: Vada dritto; l'hotel è accanto al ristorante
    gloss: 'Passante: Vada dritto. Poi sulla destra c''è un ristorante. L''hotel è accanto a quel ristorante.'
    note: کنار significa «accanto a»; همون رستورانه rimanda al ristorante appena menzionato.
  fa.a1.unit05.lesson04.teach.dialogue_line3:
    title: Grazie
    gloss: 'Sara: Grazie.'
    note: Sara ringrazia il passante.
  fa.a1.unit05.lesson04.teach.dialogue_line4:
    title: Prego
    gloss: 'Passante: Prego.'
    note: Il passante chiude lo scambio con cortesia.
