teaching:
  fa.a1.unit05.lesson01.teach.hotel:
    title: Hotel
    gloss: hotel
    note: هتل è la parola persiana usuale per «hotel».
    example_gloss: Il nostro hotel è vicino.
  fa.a1.unit05.lesson01.teach.restoran:
    title: Ristorante
    gloss: ristorante
    note: رستوران è un prestito comune usato per «ristorante».
