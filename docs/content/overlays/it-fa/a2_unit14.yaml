  fa.a2.unit14.lesson04.interview_dialogue:
    title: Il colloquio
teaching:
  fa.a2.unit14.lesson01.teach.interview_word:
    title: Colloquio
    gloss: colloquio
    note: '*مصاحبه* è la parola generica per indicare un colloquio.'
    example_gloss: Domani ho un colloquio.
  fa.a2.unit14.lesson01.teach.experience_word:
    title: Esperienza
    gloss: esperienza
    note: '*تجربه* è la parola generica per indicare l''esperienza.'
    example_gloss: Ho tre anni di esperienza lavorativa.
  fa.a2.unit14.lesson01.teach.skill_word:
    title: Competenza
    gloss: competenza
    note: '*مهارت* è la parola generica per indicare una competenza.'
    example_gloss: Quali competenze ha?
  fa.a2.unit14.lesson01.teach.salary_word:
    title: Stipendio
    gloss: stipendio
    note: '*حقوق* significa stipendio.'
    example_gloss: Quanto è lo stipendio per questo lavoro?
  fa.a2.unit14.lesson01.teach.job_opportunity_word:
    title: Opportunità di lavoro
    gloss: opportunità di lavoro
    note: '*فرصت شغلی* significa opportunità di lavoro.'
    example_gloss: È una buona opportunità di lavoro.
  fa.a2.unit14.lesson01.teach.resume_word:
    title: Curriculum
    gloss: curriculum / CV
    note: '*رزومه* è la parola persiana standard (di origine francese) per indicare il curriculum.'
    example_gloss: Ho inviato il mio curriculum.
  fa.a2.unit14.lesson01.teach.va_word:
    title: E
    gloss: e
    note: '*و* è la congiunzione di uso comune che trovi in tutta questa unità.'
    target_text: و (e)
  fa.a2.unit14.lesson01.teach.ra_note:
    title: Object marker
    gloss: (segna un complemento oggetto determinato)
    note: '*رو* (forma colloquiale del formale *را*) segna un complemento oggetto determinato: si mette subito dopo ciò su cui ricade l''azione.'
    target_text: رو (marca dell'oggetto)
  fa.a2.unit14.lesson02.teach.three_years_experience:
    title: Indicare l'esperienza lavorativa con una durata
    gloss: Ho tre anni di esperienza lavorativa.
    note: '*سه سال تجربه‌ی کار* indica la durata dell''esperienza: è un passo avanti rispetto al semplice nominare il lavoro del livello A1.'
  fa.a2.unit14.lesson02.teach.can_start_next_week:
    title: Indicare la disponibilità
    gloss: Posso iniziare la settimana prossima.
    note: '*از هفته‌ی دیگه* (dalla settimana prossima) indica da quando sei disponibile a iniziare.'
  fa.a2.unit14.lesson02.teach.clarifying_question:
    title: Fare una domanda di chiarimento
    gloss: Com'è l'orario di lavoro per questo impiego?
    note: '*ساعت کاری این شغل چطوره؟* è una domanda di chiarimento naturale da rivolgere a chi ti fa il colloquio.'
  fa.a2.unit14.lesson03.teach.salesperson_word:
    title: Commesso
    gloss: commesso
    note: '*فروشنده* è la parola generica per indicare un venditore o un commesso.'
    example_gloss: Il negozio ha bisogno di un commesso.
  fa.a2.unit14.lesson03.teach.at_least_word:
    title: Almeno
    gloss: almeno / minimo
    note: '*حداقل* significa almeno o minimo.'
    example_gloss: Serve almeno un anno di esperienza.
  fa.a2.unit14.lesson03.teach.posting_text:
    title: Un annuncio di lavoro
    gloss: Il negozio cerca un commesso con almeno un anno di esperienza. Stipendio adeguato. I colloqui si svolgono questa settimana.
    note: Un breve annuncio di lavoro in stile scritto neutro, che però usa ancora le forme parlate di tutti i giorni *داره* e *می‌شه*.
  fa.a2.unit14.lesson04.teach.tell_me_about_experience:
    title: Parlami della tua esperienza
    gloss: Ci parli, per favore, della sua esperienza lavorativa.
    note: '*لطفاً از تجربه‌ی کاریتون بگید.* è una tipica frase con cui l''intervistatore apre il colloquio.'
  fa.a2.unit14.lesson04.teach.turn01:
    title: مصاحبه‌کننده chiede dell'esperienza
    gloss: L'intervistatore chiede a آرش di parlare della sua esperienza lavorativa.
    note: Riprende la frase di apertura di questa stessa lezione.
  fa.a2.unit14.lesson04.teach.turn02:
    title: آرش descrive la sua esperienza
    gloss: آرش dice di aver lavorato in un ufficio per tre anni.
    note: Riprende in una forma leggermente diversa lo schema della durata dell'esperienza della lezione 2.
  fa.a2.unit14.lesson04.teach.turn03:
    title: مصاحبه‌کننده chiede delle competenze
    gloss: L'intervistatore gli chiede quali competenze abbia.
    note: '*چه مهارت‌هایی دارید؟* chiede nello specifico delle competenze.'
  fa.a2.unit14.lesson04.teach.turn04:
    title: آرش descrive le sue competenze
    gloss: آرش dice di essere bravo nel lavoro di squadra e nella risoluzione dei problemi.
    note: '*تو ... خوبم* (sono bravo in ...) indica una competenza.'
  fa.a2.unit14.lesson04.teach.turn05:
    title: مصاحبه‌کننده chiede della disponibilità
    gloss: L'intervistatore gli chiede se può iniziare la settimana prossima.
    note: Riprende in forma di domanda lo schema della disponibilità della lezione 2.
  fa.a2.unit14.lesson04.teach.turn06:
    title: آرش conferma
    gloss: آرش dice di sì, può.
    note: Una conferma breve e diretta.
