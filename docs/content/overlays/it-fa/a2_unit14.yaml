course:
  title: Persiano A2
  description: 'Persiano dell''Iran di livello pre-intermedio: descrivere l''esperienza lavorativa e la disponibilità, leggere un annuncio di lavoro e seguire un semplice colloquio di lavoro, dalla domanda alla risposta.'
units:
  fa.a2.unit14.job_interview:
    title: Il colloquio di lavoro
lessons:
  fa.a2.unit14.lesson01.interview_vocabulary:
    title: Parole del colloquio
  fa.a2.unit14.lesson02.describing_experience_and_availability:
    title: Descrivere esperienza e disponibilità
  fa.a2.unit14.lesson03.reading_a_job_posting:
