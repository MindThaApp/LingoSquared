    note: '*مبارک* si usa in espressioni come *تولدت مبارک* («buon compleanno»).'
    example_gloss: Buon compleanno!
  fa.a1.unit31.lesson04.teach.review_dialogue_words:
    title: Domani / grazie / che bello
    gloss: domani / grazie / che bello
    note: '*فردا*, *ممنون* e *چه خوب* ritornano qui.'
    target_text: فردا (domani) / ممنون (grazie) / چه خوب (che bello)
  fa.a1.unit31.lesson04.teach.dialogue_line1:
    title: 'Nima: Sara, domani è il mio compleanno!'
    gloss: Sara, domani è il mio compleanno!
  fa.a1.unit31.lesson04.teach.dialogue_line2:
    title: 'Sara: Buon compleanno, Nima!'
    gloss: Buon compleanno, Nima!
  fa.a1.unit31.lesson04.teach.dialogue_line3:
    title: 'Nima: Grazie! Vieni alla festa?'
    gloss: Grazie! Vieni alla festa?
  fa.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'Sara: Sì, vengo sicuramente. Ti compro un regalo.'
    gloss: Sì, vengo sicuramente. Ti compro un regalo.
  fa.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'Nima: Che bello! Grazie, Sara.'
    gloss: Che bello! Grazie, Sara.
  fa.a1.unit31.lesson05.teach.review_migire:
    title: Ricevo / prendo -> lui/lei riceve / prende
    gloss: io prendo -> lui/lei prende
    note: '*می‌گیره* è la forma colloquiale della 3ª persona di *می‌گیرم*, proprio come *می‌خونه* deriva da *می‌خونم*.'
    target_text: می‌گیرم (prendo) -> می‌گیره (lui/lei prende)
  fa.a1.unit31.lesson05.teach.review_barash:
    title: Per te -> per lui/lei
    gloss: per te -> per lui/lei
    note: '*براش* («per lui/lei») è la versione alla 3ª persona di *برات* («per te»).'
    target_text: برات (per te) -> براش (per lui/lei)
  fa.a1.unit31.lesson05.teach.review_reading_words:
    title: Lui/lei / è di Nima / lui/lei viene
    gloss: lui/lei / è di Nima / lui/lei viene
    note: '*او* e *میاد* servono per parlare di *نیما* alla 3ª persona; *نیماست* unisce *نیما* + *است* («è»).'
    target_text: او (lui/lei) / نیماست (è di Nima) / میاد (lui/lei viene)
  fa.a1.unit31.lesson05.teach.reading_text:
    title: 'Lettura: il compleanno di Nima'
    gloss: Domani è il compleanno di Nima. Sara gli compra un regalo e viene alla festa.
    note: Questa lettura racconta il dialogo alla terza persona.
