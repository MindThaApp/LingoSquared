course:
  title: Persiano A1
  description: 'Persiano iraniano per principianti: nominare le parole di feste e compleanni (compleanno, festa, torta, regalo), chiedere e dire quando è il tuo compleanno (*تولدت کِیه؟*) con il vocabolario già studiato di mesi e ordinali, invitare qualcuno a una festa e accettare un invito (*میای به مهمونی؟* / *آره، حتماً میام*), un dialogo di compleanno tra Nima e Sara che introduce *تولدت مبارک* («buon compleanno»), un brano sul compleanno di Nima e un ripasso finale per nominare le feste che ti piacciono e scrivere un tuo invito o messaggio di auguri.'
