teaching:
  fa.a1.unit31.lesson01.teach.tavallod_word:
    title: Compleanno
    gloss: compleanno
    note: '*تولد* è la parola standard per «compleanno».'
    example_gloss: Oggi è il mio compleanno.
  fa.a1.unit31.lesson01.teach.mehmooni_word:
    title: Festa
    gloss: festa
    note: '*مهمونی* è la parola parlata di tutti i giorni per «festa» o «ritrovo»; la forma scritta è *مهمانی*.'
    example_gloss: La festa è oggi.
  fa.a1.unit31.lesson01.teach.keik_word:
    title: Torta
    gloss: torta
    note: '*کیک* è la parola standard per «torta».'
    example_gloss: Questa torta è deliziosa.
  fa.a1.unit31.lesson01.teach.hedye_word:
    title: Regalo
    gloss: regalo
    note: '*هدیه* significa «regalo».'
    example_gloss: Mi piace il regalo.
  fa.a1.unit31.lesson01.teach.review_words:
    title: Oggi / anno / ho / e
    gloss: oggi / anno / ho / e
    note: '*امروز*, *سال*, *دارم* e *و* sono parole già note che ritornano qui per parlare di feste.'
    target_text: امروز (oggi) / سال (anno) / دارم (ho) / و (e)
  fa.a1.unit31.lesson01.teach.tavallodam_pattern:
    title: Compleanno + mio + è = è il mio compleanno
    gloss: compleanno + mio + è = è il mio compleanno
    note: '*تولد* + la desinenza possessiva *-م* («mio») + la copula colloquiale *-ه* («è») dà *تولدمه*, «è il mio compleanno».'
    target_text: تولد (compleanno) + م + ه = تولدمه (è il mio compleanno)
  fa.a1.unit31.lesson01.teach.combined_sentence:
    title: Oggi è il mio compleanno e ho una festa
    gloss: Oggi è il mio compleanno e ho una festa
    note: '*امروز تولدمه و مهمونی دارم* combina *امروز* + *تولدمه* + *و* + *مهمونی* + *دارم*.'
  fa.a1.unit31.lesson02.teach.key_word:
    title: Quando
    gloss: quando
    note: '*کِی* significa «quando»: nota il segno della kasre che lo distingue da *کی* («chi»).'
    example_gloss: Quand'è la festa?
  fa.a1.unit31.lesson02.teach.question_when_birthday:
    title: Quand'è il tuo compleanno?
    gloss: Quand'è il tuo compleanno?
    note: '*تولدت کِیه؟* combina *تولد* + il possessivo informale *-ت* («tuo», come in *چند سالته؟*) + *کِیه* (*کِی* + la copula colloquiale *-ه*, «è»).'
  fa.a1.unit31.lesson02.teach.review_dahom_ordibehesht:
    title: 10 / Ordibehesht
    gloss: decimo / Ordibehesht (secondo mese iraniano)
    note: '*دهم* e *اردیبهشت* ritornano qui per indicare una data vera e propria.'
    target_text: دهم (decimo) / اردیبهشت (Ordibehesht, 2º mese iraniano)
  fa.a1.unit31.lesson02.teach.answer_birthday_date:
    title: Il mio compleanno è il 10 di Ordibehesht
    gloss: Il mio compleanno è il 10 di Ordibehesht
    note: '*تولدم دهم اردیبهشته* aggiunge la copula colloquiale *-ه* («è») al nome del mese, come nelle altre date che hai visto.'
  fa.a1.unit31.lesson03.teach.review_davat_hatman_miam:
    title: Invito / sicuramente / vengo
    gloss: invito / sicuramente / io vengo
    note: '*دعوت*, *حتماً* e *میام* ritornano qui per parlare di feste.'
    target_text: دعوت (invito) / حتماً (sicuramente) / میام (vengo)
  fa.a1.unit31.lesson03.teach.miai_pattern:
    title: Vengo -> vieni (informale)
    gloss: io vengo -> tu vieni (informale)
    note: '*میای* è la forma informale di «tu» di *میام* («vengo»), così come *می‌خونی* corrisponde a *می‌خونم*.'
    target_text: میام (vengo) -> میای (vieni, informale)
  fa.a1.unit31.lesson03.teach.review_be:
    title: A
    gloss: a / per
    note: '*به* («a») ritorna qui in «alla festa».'
    target_text: به (a)
  fa.a1.unit31.lesson03.teach.question_invite:
    title: Vieni alla mia festa di compleanno?
    gloss: Vieni alla mia festa di compleanno?
    note: '*میای به مهمونی تولدم؟* riunisce tutti gli elementi di questa lezione.'
  fa.a1.unit31.lesson03.teach.review_are:
    title: Sì
    gloss: sì
    note: '*آره* («sì») ritorna qui.'
    target_text: آره (sì)
  fa.a1.unit31.lesson03.teach.answer_accept_invite:
