    gloss: celebrazioni / compleanni
    note: '*جشن‌ها* e *تولدها* aggiungono il suffisso del plurale *-ها* direttamente a *جشن*/*تولد*.'
    target_text: جشن‌ها (feste) / تولدها (compleanni)
  fa.a1.unit31.lesson06.teach.review_man_ro_doost:
    title: Io / segno dell'oggetto / mi piace
    gloss: io / segno dell'oggetto / mi piace
    note: '*من*, *رو* e *دوست* si combinano qui in una frase sulle preferenze riguardo alle feste.'
    target_text: من (io) / رو (marcatore dell'oggetto) / دوست دارم (mi piace)
  fa.a1.unit31.lesson06.teach.wrap_summary:
    title: Mi piacciono le feste e i compleanni
    gloss: Mi piacciono le feste e i compleanni
    note: '*من جشن‌ها و تولدها رو دوست دارم* usa lo schema già noto con *دوست دارم* e *رو*.'
