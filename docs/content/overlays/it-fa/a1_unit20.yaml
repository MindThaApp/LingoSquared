teaching:
  fa.a1.unit20.lesson01.teach.shirt_word:
    title: Camicia
    gloss: camicia
    note: پیراهن è una parola generica per «camicia».
    example_gloss: Voglio una camicia.
  fa.a1.unit20.lesson01.teach.pants_word:
    title: Pantaloni
    gloss: pantaloni
    note: شلوار significa «pantaloni».
    example_gloss: Quanto costano questi pantaloni?
  fa.a1.unit20.lesson01.teach.shoes_word:
    title: Scarpe
    gloss: scarpe
    note: کفش significa «scarpe».
    example_gloss: Avete delle scarpe?
  fa.a1.unit20.lesson01.teach.jacket_word:
    title: Giacca
    gloss: giacca
    note: کت significa «giacca» (come la giacca di un completo o un blazer); un cappotto pesante invernale di solito ha un altro nome.
    example_gloss: Voglio una giacca.
  fa.a1.unit20.lesson01.teach.nice_word:
    title: Bello / carino
    gloss: bello
    note: قشنگ è una parola comune di uso quotidiano per «bello/carino», spesso usata con la contrazione -e (قشنگه).
    example_gloss: Questa giacca è bella.
  fa.a1.unit20.lesson01.teach.want_word:
    title: Voglio (ripasso)
    gloss: voglio
    note: '*می‌خوام* è la forma parlata di uso quotidiano di *می‌خواهم*. L''hai già incontrata in un''unità precedente e qui si usa sempre per chiedere capi di abbigliamento.'
    target_text: می‌خوام (voglio)
  fa.a1.unit20.lesson01.teach.va_word:
    title: E (ripasso)
    gloss: e
    note: '*و* è la congiunzione comune per «e», ripassata da un''unità precedente.'
    target_text: و (e)
  fa.a1.unit20.lesson02.teach.color_word:
    title: Colore
    gloss: colore
    note: رنگ è la parola generica per «colore».
    example_gloss: Che colore vuole?
  fa.a1.unit20.lesson02.teach.red_word:
    title: Rosso
    gloss: rosso
    note: قرمز significa «rosso».
    example_gloss: Questa camicia è rossa.
  fa.a1.unit20.lesson02.teach.blue_word:
    title: Blu
    gloss: blu
    note: آبی significa «blu» (azzurro); con la contrazione -e (آبیه) significa «è blu».
    example_gloss: I miei pantaloni sono blu.
  fa.a1.unit20.lesson02.teach.black_word:
    title: Nero
    gloss: nero
    note: سیاه significa «nero».
    example_gloss: Le scarpe nere sono belle.
  fa.a1.unit20.lesson02.teach.white_word:
    title: Bianco
    gloss: bianco
    note: سفید significa «bianco».
    example_gloss: Voglio una giacca bianca.
  fa.a1.unit20.lesson03.teach.size_word:
    title: Taglia
    gloss: taglia
    note: سایز è la parola di uso quotidiano per la taglia dei vestiti.
    example_gloss: Che taglia vuole?
  fa.a1.unit20.lesson03.teach.big_word:
    title: Grande
    gloss: grande
    note: بزرگ significa «grande».
    example_gloss: Voglio una taglia grande.
  fa.a1.unit20.lesson03.teach.small_word:
    title: Piccolo
    gloss: piccolo
    note: کوچیک significa «piccolo»; con la contrazione -e (کوچیکه) significa «è piccolo».
    example_gloss: Queste scarpe sono piccole.
  fa.a1.unit20.lesson03.teach.medium_word:
    title: Media
    gloss: media
    note: متوسط significa «medio» (taglia media).
    example_gloss: Avete una taglia media?
  fa.a1.unit20.lesson04.teach.try_on_question:
    title: Chiedere di provare qualcosa
    gloss: Posso provarlo?
    note: می‌تونم امتحانش کنم؟ è il modo colloquiale di uso quotidiano per chiedere di provare un capo.
  fa.a1.unit20.lesson04.teach.yes_go_ahead:
    title: Sì, prego
    gloss: Sì, prego.
    note: '*بله، بفرمایید* è un modo cortese con cui il negoziante acconsente, riprendendo *بفرمایید* da un''unità precedente.'
  fa.a1.unit20.lesson04.teach.contraction_note:
    title: La contrazione colloquiale می‌تونم (ripasso)
    gloss: posso (forma parlata)
    note: 'Nel parlato quotidiano il gruppo scritto -ان- diventa spesso -ون-: *می‌توانم* diventa *می‌تونم* (posso). Hai già visto lo stesso cambiamento in *تومن*, la forma parlata di *تومان*.'
  fa.a1.unit20.lesson05.teach.label_text:
    title: Un'etichetta di abbigliamento
    gloss: 'Taglia: grande. Colore: rosso.'
    note: Una breve etichetta di un capo, nello stesso formato che vedresti sui vestiti veri.
  fa.a1.unit20.lesson06.teach.please_review:
    title: Prego / si accomodi (ripasso)
    gloss: prego / si accomodi
