  fa.a1.unit02.lesson02.exercise08.speak_name:
    instruction: Di' che ti chiami Sara.
    accepted_answers:
    - value: اسمم ساراست
      status: correct
    - value: من سارا هستم
      status: correct
    - value: سارا هستم
      status: correct
    - value: اسم من ساراست
      status: correct
    - value: من سارام
      status: correct
    - value: سارام
      status: correct
    - value: سارا
      status: correct
    - value: اسمم سارا است
      status: acceptable_with_note
      note: Grafia comprensibile, con la copula staccata.
    - value: اسم من سارا است
      status: acceptable_with_note
      note: Corretto, ma più formale della domanda.
    feedback: Tutte queste forme esprimono in modo naturale il nome di Sara.
  fa.a1.unit02.lesson03.exercise01.pronoun_i:
    instruction: Seleziona il pronome persiano che significa «io».
    correct_option: من
    distractors:
    - تو
    - او
    - شما
    accepted_answers:
    - value: من
      status: correct
    feedback: من significa «io».
  fa.a1.unit02.lesson03.exercise02.pronoun_you:
    instruction: Seleziona «tu» informale singolare.
    correct_option: تو
    distractors:
    - من
    - او
    - شما
    accepted_answers:
    - value: تو
      status: correct
    feedback: تو è il «tu» informale singolare.
  fa.a1.unit02.lesson03.exercise03.pronoun_gender:
    instruction: او può riferirsi sia a un uomo sia a una donna?
    options:
    - Sì
    - 'No'
    accepted_answers:
    - value: Sì
      status: correct
    feedback: I pronomi persiani di terza persona singolare non indicano il genere grammaticale.
  fa.a1.unit02.lesson03.exercise04.order_i_am:
    instruction: Metti in ordine le parole per dire «io sono».
    accepted_answers:
    - value:
      - من
      - هستم
      status: correct
    feedback: من هستم significa «io sono».
  fa.a1.unit02.lesson03.exercise05.order_you_are:
    instruction: Metti in ordine le parole per dire «tu sei» (singolare informale).
    accepted_answers:
    - value:
      - تو
      - هستی
      status: correct
    feedback: تو هستی usa la forma singolare informale.
  fa.a1.unit02.lesson03.exercise06.order_forms:
    instruction: Metti in ordine le parole per dire «io sono, tu sei, lui/lei è».
    accepted_answers:
    - value:
      - من
      - هستم
      - تو
      - هستی
      - او
      - هست
      status: correct
    feedback: Questa sequenza dà le tre forme complete del singolare, in ordine di persona.
    prompt_blocks:
    - io sono, tu sei, lui/lei è
  fa.a1.unit02.lesson03.exercise07.formal_third_person:
    instruction: Quale registro descrive meglio او ایرانی است؟
    correct_option: persiano formale o scritto
    distractors:
    - persiano parlato informale
    - solo plurale
    - non grammaticale
    accepted_answers:
    - value: persiano formale o scritto
      status: correct
    feedback: است è la normale copula di terza persona nel registro formale scritto.
  fa.a1.unit02.lesson03.exercise08.spoken_third_person:
    instruction: Scegli il significato di او ایرانیه.
    correct_option: Lui o lei è iraniano/a.
    distractors:
    - Io sono iraniano/a.
    - Tu sei iraniano/a.
    - Lui o lei è in Iran.
    accepted_answers:
    - value: Lui o lei è iraniano/a.
      status: correct
    feedback: او non indica il genere e ایرانیه è il predicato nella forma parlata.
