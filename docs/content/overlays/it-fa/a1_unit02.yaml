course:
  title: Persiano A1
  description: Persiano iraniano per principianti, incentrato sulla lettura della scrittura, sulla comprensione del parlato quotidiano e su conversazioni pratiche da gestire con cortesia.
units:
  fa.a1.unit02.introductions:
    title: Nomi, origini e presentazioni
lessons:
  fa.a1.unit02.lesson01.script_ramp:
    title: Leggi le lettere usate nelle presentazioni
  fa.a1.unit02.lesson02.names:
    title: Chiedere e dire un nome
  fa.a1.unit02.lesson03.pronouns_and_boodan:
    title: Pronomi singolari e il verbo essere
  fa.a1.unit02.lesson04.countries_nationalities:
    title: Paesi e nazionalità
  fa.a1.unit02.lesson05.origin:
    title: Chiedere di dove è qualcuno
  fa.a1.unit02.lesson06.language_class_dialogue:
    title: Incontro a un corso di farsi
teaching:
  fa.a1.unit02.lesson01.teach.noon_te:
    title: Le lettere ن e ت
    gloss: n e t
    note: ن rappresenta n. ت rappresenta t; entrambe si legano da entrambi i lati.
  fa.a1.unit02.lesson01.teach.sheen_che:
    title: Le lettere ش e چ
    gloss: sh e ch
    note: ش rappresenta sh e چ rappresenta ch.
  fa.a1.unit02.lesson01.teach.ye_he:
    title: Le lettere ی e ه
    gloss: y/i lunga e h
    note: ی suona come y o come una ī lunga. ه è h e cambia forma quando si lega.
  fa.a1.unit02.lesson01.teach.ke_gaf:
    title: Le lettere ک e گ
    gloss: k e g
    note: ک rappresenta k; quando scrivi con la tastiera, usa la ک persiana, non la lettera araba simile. گ aggiunge un tratto extra a ک e rappresenta g.
  fa.a1.unit02.lesson01.teach.jim_dal:
    title: Le lettere ج e د
    gloss: j (come in «gioco») e d
    note: ج rappresenta j. د rappresenta d e non si lega alla lettera successiva a sinistra.
  fa.a1.unit02.lesson01.teach.re_fe:
    title: Le lettere ر e ف
    gloss: r e f
    note: ر rappresenta r e non si lega alla lettera successiva; ف rappresenta f.
  fa.a1.unit02.lesson01.teach.vav_be:
    title: Le lettere و e ب
    gloss: v/o/u e b
    note: و può rappresentare v o una vocale e non si lega alla lettera successiva. ب rappresenta b.
  fa.a1.unit02.lesson01.teach.khe_ze:
    title: Le lettere خ e ز
    gloss: kh e z
    note: خ è il suono comunemente scritto kh; ز rappresenta z.
  fa.a1.unit02.lesson02.teach.esm:
    title: Nome
    gloss: nome
    note: اسم si legge esm nel persiano ordinario dell'Iran.
    example_gloss: Mi chiamo Sara.
  fa.a1.unit02.lesson02.teach.man:
    title: io
    gloss: io
    note: من è il pronome di prima persona singolare.
  fa.a1.unit02.lesson02.teach.sara:
    title: Sara
    gloss: Sara
    note: سارا è un nome proprio iraniano molto comune.
    example_gloss: Sara è la mia amica.
  fa.a1.unit02.lesson02.teach.formal_name:
    title: Presentazione formale o scritta
    gloss: Mi chiamo Sara.
    note: '*اسم من سارا است* è corretto ma formale; lo vedrai soprattutto per iscritto.'
  fa.a1.unit02.lesson02.teach.spoken_name:
    title: Presentazione parlata naturale
    gloss: Mi chiamo Sara.
    note: اسمم contrae اسم من, mentre ساراست unisce سارا e است.
  fa.a1.unit02.lesson02.teach.polite_question:
    title: Chiedere il nome con cortesia
    gloss: Come ti chiami?
    note: اسم شما چیه؟ è persiano iraniano parlato ordinario, neutro e cortese.
  fa.a1.unit02.lesson02.teach.informal_question:
    title: Chiedere il nome in modo informale
    gloss: Come ti chiami?
    note: اسمت چیه؟ è singolare e informale; usalo solo quando il rapporto lo permette.
  fa.a1.unit02.lesson03.teach.man:
    title: io
    gloss: io
    note: من non ha genere grammaticale.
  fa.a1.unit02.lesson03.teach.to:
    title: Tu, singolare informale
    gloss: Lei (forma di cortesia)
    note: تو è singolare informale; per rivolgersi con cortesia si usa normalmente شما.
  fa.a1.unit02.lesson03.teach.oo:
    title: Lui o lei
    gloss: lui / lei
    note: او non ha genere e può riferirsi sia a «lui» sia a «lei».
  fa.a1.unit02.lesson03.teach.man_hastam:
    title: Io sono
    gloss: sono
    note: هستم è la forma piena della prima persona singolare di بودن.
  fa.a1.unit02.lesson03.teach.to_hasti:
    title: Tu sei
    gloss: voi siete; Lei è
    note: هستی concorda con تو, singolare informale.
  fa.a1.unit02.lesson03.teach.oo_hast:
    title: Lui o lei è
    gloss: lui/lei è; lui/lei è presente
    note: هست è la forma piena della terza persona singolare e spesso indica esistenza o enfasi.
  fa.a1.unit02.lesson03.teach.oo_ast:
    title: Predicato di identità formale
    gloss: Lui o lei è iraniano/a.
    note: In una frase di identità neutra e formale scritta, است è la normale copula di terza persona.
  fa.a1.unit02.lesson03.teach.spoken_copula:
    title: Predicato di identità parlato
    gloss: Lui o lei è iraniano/a.
    note: ایرانیه è la contrazione parlata naturale di ایرانی است.
  fa.a1.unit02.lesson04.teach.iran:
    title: Iran
    gloss: Iran
    note: ایران è il nome di un paese.
    example_gloss: Sono dell'Iran.
  fa.a1.unit02.lesson04.teach.iranian:
    title: Iraniano
    gloss: iraniano
    note: ایرانی può indicare la nazionalità o l'origine.
    example_gloss: Sono iraniano/iraniana.
  fa.a1.unit02.lesson04.teach.england:
    title: Inghilterra
    gloss: Inghilterra
    note: '*انگلیس* di solito indica l''Inghilterra; nel parlato quotidiano gli iraniani lo usano spesso per tutto il Regno Unito.'
    example_gloss: Sono dell'Inghilterra.
  fa.a1.unit02.lesson04.teach.english:
    title: inglese
    gloss: inglese
    note: انگلیسی può indicare la nazionalità, la lingua o qualcosa legato all'Inghilterra; il significato dipende dal contesto.
    example_gloss: Sono inglese.
  fa.a1.unit02.lesson04.teach.france:
    title: Francia
    gloss: Francia
    note: فرانسه è il nome del paese Francia.
    example_gloss: Sono della Francia.
  fa.a1.unit02.lesson04.teach.french:
    title: francese
    gloss: francese
    note: فرانسوی può indicare la nazionalità o qualcosa legato alla Francia.
    example_gloss: Sono francese.
  fa.a1.unit02.lesson04.teach.country:
    title: Paese
    gloss: paese
    note: کشور è la parola generale per «paese».
    example_gloss: L'Iran è un paese.
  fa.a1.unit02.lesson04.teach.nationality:
    title: Nazionalità
    gloss: nazionalità
    note: ملیت è il sostantivo formale per «nazionalità».
    example_gloss: Qual è la tua nazionalità?
  fa.a1.unit02.lesson05.teach.ahl:
    title: Di (origine)
    gloss: di / originario di
    note: اهل collega una persona al suo luogo di origine; non significa semplicemente che ci vive adesso.
    example_gloss: Lui/lei è dell'Inghilterra.
  fa.a1.unit02.lesson05.teach.koja:
    title: Dove
    gloss: dove
    note: کجا serve a chiedere di un luogo.
    example_gloss: Di dove è Lei?
  fa.a1.unit02.lesson05.teach.formal_question:
    title: Domanda standard formale
    gloss: Di dov'è Lei?
    note: اهل کجا هستید؟ è persiano standard e cortese, adatto al discorso formale o alla lettura accurata.
  fa.a1.unit02.lesson05.teach.polite_spoken_question:
    title: Domanda parlata, neutra e cortese
    gloss: Di dov'è Lei?
    note: اهل کجا هستین؟ è la forma cortese abituale del parlato nel persiano dell'Iran.
  fa.a1.unit02.lesson05.teach.informal_question:
    title: Domanda informale
    gloss: Di dov'è Lei?
    note: اهل کجایی؟ è la forma informale al singolare.
  fa.a1.unit02.lesson05.teach.origin_answer:
    title: Dire il proprio luogo di origine
    gloss: Sono dell'Iran.
    note: من اهل ایران هستم indica l'origine, non il luogo in cui si vive ora.
  fa.a1.unit02.lesson05.teach.nationality_answer:
    title: Risposta breve sulla nazionalità
    gloss: Sono iraniano/iraniana.
    note: '*ایرانی‌ام* aggiunge la desinenza *ـام* («sono») a *ایرانی*, scritta con un piccolo mezzo spazio prima della desinenza.'
  fa.a1.unit02.lesson06.teach.arrival:
    title: Verificare il luogo
    gloss: Sara chiede se questa è la classe di persiano.
    note: ببخشید serve a richiamare gentilmente l'attenzione prima di una domanda pratica.
  fa.a1.unit02.lesson06.teach.yes:
    title: Sì
    gloss: sì
    note: بله è la parola neutra e cortese per «sì».
    example_gloss: Sì, certo.
  fa.a1.unit02.lesson06.teach.meet_mina:
    title: Mina si presenta
    gloss: Mina conferma il luogo, si presenta e chiede il nome di Sara.
    note: La domanda cortese del parlato è adatta a due adulti che si incontrano a lezione.
  fa.a1.unit02.lesson06.teach.sara_name:
    title: Sara dice il suo nome
    gloss: Mi chiamo Sara.
    note: Sara usa la forma compatta del parlato vista in precedenza.
  fa.a1.unit02.lesson06.teach.ask_origin:
    title: Mina chiede la provenienza
    gloss: Di dov'è Lei?
    note: هستین mantiene lo scambio cortese ma colloquiale.
  fa.a1.unit02.lesson06.teach.exchange_origins_sara:
    title: Scambiarsi informazioni sulla provenienza
    gloss: Sara dice di essere dell'Inghilterra e chiede a Mina se è dell'Iran.
    note: I due interlocutori mantengono le forme di cortesia perché si sono appena conosciuti.
  fa.a1.unit02.lesson06.teach.exchange_origins_mina:
    title: Scambiarsi le origini, risposta
    gloss: Mina conferma di essere iraniana.
    note: '*ایرانی‌ام* è la forma breve di *ایرانی هستم* («sono iraniano/a»).'
  fa.a1.unit02.lesson06.teach.pleased:
    title: Rispondere alla presentazione
    gloss: Sara dice di essere lieta di conoscere Mina.
    note: از آشنایی با شما خوشوقتم chiude in modo naturale il loro scambio.
  fa.a1.unit02.lesson06.teach.pleased_and_enter:
    title: Ricambiare il saluto ed entrare in classe
    gloss: Mina dice di essere lieta anche lei e invita Sara a entrare.
    note: من هم همین‌طور ricambia il saluto cortese di Sara, poi بفرمایید داخل fa proseguire la scena in classe.
exercises:
  fa.a1.unit02.lesson01.exercise01.recognize_noon:
    instruction: Quale lettera rappresenta il suono n?
    correct_option: ن
    distractors:
    - ت
    - ر
    - و
    accepted_answers:
    - value: ن
      status: correct
    feedback: ن rappresenta il suono n.
  fa.a1.unit02.lesson01.exercise02.recognize_che:
    instruction: Quale lettera rappresenta il suono ch (come in «ciao»)?
    correct_option: چ
    distractors:
    - ش
    - ج
    - خ
    accepted_answers:
    - value: چ
      status: correct
    feedback: چ rappresenta il suono ch (come in «ciao»).
  fa.a1.unit02.lesson01.exercise03.match_ye_he:
    instruction: Abbina ogni lettera al suono corrispondente approssimativo.
    accepted_answers:
    - value:
        ی: y (i)
        ه: h
        ک: k
        گ: g
        و: v / o
        ب: b
        خ: kh
        ز: z
      status: correct
    feedback: ی può rappresentare y o i lunga; ه è h; ک è k e گ è g; و può rappresentare v o una vocale, e ب è b; خ si traslittera di solito kh e ز è z.
    pairs:
    - left: ی
      right: y (i)
    - left: ه
      right: h
    - left: ک
      right: k
    - left: گ
      right: g
    - left: و
      right: v / o
    - left: ب
      right: b
    - left: خ
      right: kh
    - left: ز
      right: z
  fa.a1.unit02.lesson01.exercise04.choose_persian_ke:
    instruction: Seleziona la lettera persiana k.
    correct_option: ک
    distractors:
    - گ
    - ج
    - ف
    accepted_answers:
    - value: ک
      status: correct
    feedback: La lettera persiana ک rappresenta il suono k.
  fa.a1.unit02.lesson01.exercise06.recognize_fe:
    instruction: Quale lettera rappresenta il suono f?
    correct_option: ف
    distractors:
    - و
    - ب
    - ت
    accepted_answers:
    - value: ف
      status: correct
    feedback: ف rappresenta il suono f.
  fa.a1.unit02.lesson02.exercise01.recognize_esme_shoma_reading:
    instruction: Che informazione chiede questa domanda?
    correct_option: il nome dell'interlocutore
    distractors:
    - il paese dell'interlocutore
    - l'ora
    - il lavoro di chi parla
    accepted_answers:
    - value: il nome dell'interlocutore
      status: correct
    feedback: اسم شما چیه؟ chiede il nome dell'interlocutore.
  fa.a1.unit02.lesson02.exercise02.name_meaning:
    instruction: Seleziona il significato di اسم.
    correct_option: nome
    distractors:
    - paese
    - corso
    - lingua
    accepted_answers:
    - value: nome
      status: correct
    feedback: اسم significa «nome».
  fa.a1.unit02.lesson02.exercise03.formal_name:
    instruction: Riordina la presentazione in stile scritto formale.
    accepted_answers:
    - value:
      - اسم
      - من
      - سارا
      - است
      status: correct
    feedback: اسم من سارا است è la forma volutamente formale, tipica dello scritto.
