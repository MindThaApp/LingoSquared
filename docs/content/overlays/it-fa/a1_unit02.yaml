  fa.a1.unit02.lesson04.exercise04.order_countries:
    instruction: Metti in ordine le parole per dire «Iran, Inghilterra, Francia».
    accepted_answers:
    - value:
      - ایران
      - انگلیس
      - فرانسه
      status: correct
    feedback: L'ordine è ایران، انگلیس، فرانسه.
    prompt_blocks:
    - Iran, Inghilterra, Francia
