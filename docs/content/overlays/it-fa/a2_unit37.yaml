  fa.a2.unit37.lesson01.exercise05.fill_rain_verb:
    instruction: 'Completa la condizione con il verbo al congiuntivo per «piove» (3ª persona): Se piove, restiamo a casa.'
    accepted_answers:
    - value: بیاد
      status: correct
    feedback: La frase completa è *اگه بارون بیاد، تو خونه می‌مونیم*.
  fa.a2.unit37.lesson01.exercise06.translate_warm_outside:
    instruction: 'Traduci usando اگه e باشه: Se il tempo è caldo, andiamo fuori.'
    accepted_answers:
    - value: اگه هوا گرم باشه، می‌ریم بیرون
      status: correct
    - value: اگه هوا گرم باشه می‌ریم بیرون
      status: correct
    - value: می‌ریم بیرون اگه هوا گرم باشه
      status: acceptable_with_note
      note: Il risultato può venire per primo, ma l'ordine abituale pone prima la condizione.
    feedback: 'Modello: *اگه هوا گرم باشه، می‌ریم بیرون.*'
  fa.a2.unit37.lesson02.exercise01.recognize_time_condition:
    instruction: Che cosa significa questa frase?
    correct_option: Se ho tempo, vengo.
    distractors:
    - Se hai tempo, vengo.
    - Ho tempo, quindi sono venuto.
    - Se vengo, avrò tempo.
    accepted_answers:
    - value: Se ho tempo, vengo.
      status: correct
    feedback: '*باشم* è la desinenza di «io», e *میام* è il risultato al presente «verrò».'
  fa.a2.unit37.lesson02.exercise02.recognize_tired_condition:
    instruction: Che cosa significa questa frase?
    correct_option: Se sei stanco, non usciamo.
    distractors:
    - Se sono stanco, non usciamo.
    - Se siamo stanchi, tu non esci.
    - Sei stanco, quindi siamo usciti.
    accepted_answers:
    - value: Se sei stanco, non usciamo.
      status: correct
    feedback: '*باشی* è la desinenza di «tu» nella condizione.'
