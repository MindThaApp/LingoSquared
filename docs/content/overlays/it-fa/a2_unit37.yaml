teaching:
  fa.a2.unit37.lesson01.teach.weather_words:
    title: Parole del meteo
    gloss: tempo atmosferico, pioggia, neve, soleggiato, freddo, caldo, domani, oggi
    note: '*بارون* è la forma parlata comune per «pioggia»; nello scritto curato si usa *باران*. Le forme parlate *آفتابیه*, *سرده* e *گرمه* terminano in *-ه* per «è».'
    example_gloss:
    - Domani c'è il sole.
    - Oggi fa freddo.
    - Fa caldo.
  fa.a2.unit37.lesson01.teach.plan_words:
    title: Luoghi e verbi di programma
    gloss: parco, casa, mercato, cinema, fuori, dentro, andiamo, non andiamo, restiamo
    note: 'Per i programmi si usa il presente: *می‌ریم* è «andiamo» o «stiamo andando», e *نمی‌ریم* è «non andiamo».'
    example_gloss:
    - Domani andiamo al parco.
    - Restiamo a casa.
    - Oggi non usciamo.
  fa.a2.unit37.lesson01.teach.if_words:
    title: اگه e i verbi della condizione
    gloss: se, viene (la pioggia viene), è, viene (presente)
    note: '*اگه* è la forma parlata di *اگر* («se»). *بارون بیاد* significa letteralmente «la pioggia venga», ed è così che il persiano dice «piove».'
    example_gloss:
    - Se nevica, non usciamo.
    - Se fa freddo, non andiamo al parco.
  fa.a2.unit37.lesson01.teach.subjunctive_condition:
    title: اگه più il congiuntivo
    gloss: Se piove, non andiamo al parco.
    note: 'Per una condizione possibile, dopo *اگه* il verbo va al congiuntivo: *بیاد*, *باشه*. Il risultato è al normale presente: *نمی‌ریم*. Tra le due parti si mette una virgola.'
  fa.a2.unit37.lesson01.teach.present_condition:
    title: اگه più il presente
    gloss: Se domani piove, restiamo a casa.
    note: 'Dopo *اگه* sentirai anche il presente: *اگه بارون میاد*. Ha lo stesso significato di condizione reale. In questa unità produrrai il congiuntivo (*بیاد*); il presente serve a riconoscere ciò che senti.'
  fa.a2.unit37.lesson02.teach.time_tired:
    title: Tempo, stanco, lavoro
    gloss: tempo, stanco, lavoro, io, noi
    note: '*وقت دارم* significa «ho tempo». Non indica l''ora dell''orologio.'
    example_gloss:
    - Domani ho tempo.
    - Oggi non ho tempo.
    - Oggi abbiamo da lavorare.
  fa.a2.unit37.lesson02.teach.come_forms:
    title: Forme di «venire» e «avere tempo»
    gloss: vengo, vieni, non vengo, io abbia, tu abbia, noi siamo (congiuntivo)
    note: '*میام* è la forma parlata di «vengo / verrò». In una condizione si usano *داشته باشم*, *داشته باشی*, *خسته باشیم*: sono le forme del congiuntivo.'
    example_gloss:
    - Vieni domani?
    - Oggi non vengo.
  fa.a2.unit37.lesson02.teach.person_endings:
    title: Abbina la desinenza alla persona
    gloss: io ho, tu hai, lui o lei ha, noi abbiamo
    note: 'La desinenza dopo *داشته* cambia con la persona: *باشم* (io), *باشی* (tu), *باشه* (lui/lei), *باشیم* (noi). Il persiano di solito omette il pronome, perché la desinenza indica già la persona.'
  fa.a2.unit37.lesson02.teach.result_tense:
    title: Il risultato è al presente
    gloss: Se ho tempo, vengo.
    note: Qui il persiano non ha bisogno di un futuro a parte. Il presente nel risultato, *میام*, significa già «verrò».
  fa.a2.unit37.lesson03.teach.time_clause_words:
    title: Quando, arrivare, finire il lavoro, negozio
    gloss: quando, io arrivi, il mio lavoro, finito, diventa, negozio, aperto, a, ti chiamo
    note: '*وقتی* significa «quando». *کارم تموم بشه* è «il mio lavoro è finito». *بهت زنگ می‌زنم* è «ti chiamo».'
    example_gloss:
    - Quando ho finito di lavorare, vengo.
    - Domani ti chiamo.
  fa.a2.unit37.lesson03.teach.negative_forms:
    title: Forme della condizione negativa e andare/restare
    gloss: tu non venga, non venga (lui/esso), non sia, io non abbia, da solo, vado, resto
    note: 'Aggiungi *نـ* al verbo al congiuntivo per rendere negativa la condizione: *نیای*, *نیاد*, *نباشه*, *نداشته باشم*.'
    example_gloss:
    - Vado da solo.
    - Oggi resto a casa.
  fa.a2.unit37.lesson03.teach.negative_condition:
    title: Una condizione negativa
    gloss: Se non vieni, vado da solo. Se non piove, andiamo al parco.
    note: 'Una condizione negativa è comunque una condizione possibile. Rendi negativo il verbo al congiuntivo con *نـ*: *اگه نیای*, *اگه بارون نیاد*. Il risultato può essere affermativo o negativo.'
  fa.a2.unit37.lesson03.teach.if_vs_when:
    title: اگه indica «forse», وقتی indica «di sicuro»
    gloss: Quando ho finito di lavorare, vengo. Se ho tempo, vengo.
    note: Usa *وقتی* quando l'evento accadrà di certo e indichi solo quando. Usa *اگه* quando potrebbe non accadere. Entrambi possono essere seguiti da un verbo al congiuntivo e da un risultato al presente.
  fa.a2.unit37.lesson04.teach.shop_words:
    title: Parole del negozio
    gloss: scontrino, soldi, merce, difettoso, sconto, questo, avete, è aperto
    note: '*جنس* indica la merce o l''articolo che compri. *رسید دارید؟* è una domanda cortese rivolta a un cliente.'
    example_gloss:
    - Questo articolo è difettoso.
    - Ha lo scontrino?
    - Oggi il negozio è aperto.
  fa.a2.unit37.lesson04.teach.policy_verbs:
    title: Verbi delle regole del negozio
    gloss: lo cambiamo, restituiamo, voi comprate, voi ricevete, voi abbiate, i vostri soldi
    note: 'Il personale del negozio si rivolge ai clienti con le desinenze di cortesia di *شما*: *داشته باشید*, *بخرید*, *می‌گیرید*, e con *-تون* in *پولتون*. *رو* segue un complemento oggetto determinato.'
    example_gloss:
    - Cambiamo questo articolo.
    - Oggi ricevete uno sconto.
  fa.a2.unit37.lesson04.teach.shop_pattern:
    title: Una regola del negozio con اگه
    gloss: Se avete lo scontrino, vi restituiamo i soldi.
    note: 'Una regola del negozio ha la stessa struttura di un programma: *اگه* più una condizione al congiuntivo, poi un risultato al presente. Con i clienti si usano le desinenze di cortesia *-ید* e *-تون*.'
  fa.a2.unit37.lesson04.teach.what_if_phrase:
    title: E se...?
    gloss: E se piove? E se non ho lo scontrino?
    note: Aggiungi *چی؟* dopo la condizione per chiedere «e se...?».
  fa.a2.unit37.lesson04.teach.what_if_question:
    title: اگه ... چی؟
    gloss: E se piove?
    note: 'La condizione mantiene il verbo al congiuntivo e *چی؟* viene alla fine, senza proposizione di risultato. L''altra persona risponde con il risultato: *اگه بارون بیاد، می‌ریم سینما.*'
  fa.a2.unit37.lesson05.teach.reading_words:
    title: Parole per messaggi e avvisi
    gloss: ciao, bene, vieni (imperativo), non puoi, venire, a me, chiama (imperativo), avviso
    note: '*بیا* e *بزن* sono imperativi amichevoli. *بهم زنگ بزن* significa «chiamami».'
    example_gloss:
    - Ciao! Il tempo è bello.
    - Se non puoi venire, chiamami.
  fa.a2.unit37.lesson05.teach.message:
    title: Un messaggio su domani
    gloss: Ciao Nima! Domani, se c'è il sole, andiamo al parco. Se piove, andiamo al cinema. Se hai tempo, vieni. Se non puoi venire, chiamami.
    note: Leggi cercando ogni condizione e il suo risultato.
  fa.a2.unit37.lesson05.teach.notice:
    title: Un avviso del negozio
    gloss: 'Avviso del negozio: se l''articolo è difettoso, lo cambiamo. Se avete lo scontrino, vi restituiamo i soldi. Se non avete lo scontrino, non restituiamo i soldi. Se comprate oggi, ricevete uno sconto.'
    note: Ogni frase è una regola con una condizione e un risultato.
  fa.a2.unit37.lesson06.teach.dialogue_words:
    title: Sì, bene, dopo
    gloss: sì, bene, dopo di che
    note: '*آره* è il normale «sì» parlato. *بعدش* significa «dopo di che».'
    example_gloss:
    - Sì, domani andiamo.
    - Bene! Dopo andiamo al mercato.
  fa.a2.unit37.lesson06.teach.turn01:
    title: Sara propone il parco
    gloss: 'Sara chiede: Nima, domani andiamo al parco?'
    note: Una domanda al presente può riguardare un programma.
  fa.a2.unit37.lesson06.teach.turn02:
    title: Nima pone una condizione
    gloss: 'Nima risponde: Sì, se non piove.'
    note: 'Una condizione negativa può essere l''intera risposta: *اگه بارون نیاد، آره.*'
  fa.a2.unit37.lesson06.teach.turn03:
    title: Sara chiede «e se...»
    gloss: 'Sara chiede: E se piove?'
    note: '*اگه ... چی؟* chiede dell''altra possibilità.'
  fa.a2.unit37.lesson06.teach.turn04:
    title: Nima propone l'altro programma
    gloss: 'Nima risponde: Se piove, andiamo al cinema.'
    note: La risposta è una condizione più un risultato al presente.
  fa.a2.unit37.lesson06.teach.turn05:
    title: Sara aggiunge un secondo programma
    gloss: 'Sara dice: Bene. Se hai tempo, dopo andiamo al mercato.'
    note: Il secondo programma dipende da una nuova condizione.
  fa.a2.unit37.lesson06.teach.turn06:
    title: Nima distingue «se» e «quando»
    gloss: 'Nima dice: Se ho tempo, vengo. Quando ho finito di lavorare, ti chiamo.'
    note: '*اگه* indica una possibilità; *وقتی* indica qualcosa che accadrà.'
exercises:
  fa.a2.unit37.lesson01.exercise01.recognize_rain_condition:
    instruction: Che cosa significa questa frase?
    correct_option: Se piove, non andiamo al parco.
    distractors:
    - Quando piove, andiamo sempre al parco.
    - Sta piovendo, quindi andiamo al parco.
    - Che piova o no, andiamo al parco.
    accepted_answers:
    - value: Se piove, non andiamo al parco.
      status: correct
    feedback: '*اگه بارون بیاد* è la condizione «se piove»; *نمی‌ریم پارک* è il risultato.'
  fa.a2.unit37.lesson01.exercise02.recognize_present_condition:
    instruction: Che cosa significa questa frase? Dopo اگه usa il presente.
    correct_option: Se domani piove, restiamo a casa.
    distractors:
    - Se ieri è piovuto, siamo rimasti a casa.
    - Domani pioverà e usciremo.
    - Se restiamo a casa, pioverà.
    accepted_answers:
    - value: Se domani piove, restiamo a casa.
      status: correct
    feedback: '*اگه بارون میاد* è il modo con il presente per esprimere la stessa condizione reale.'
