teaching:
  fa.a2.unit47.lesson01.teach.now:
    title: In questo momento
    gloss: adesso, proprio ora, libro, che cosa stai facendo
    note: '*الان* significa «adesso»; *همین الان* significa «proprio ora, in questo preciso momento».'
    example_gloss:
    - Adesso sto leggendo un libro.
    - In questo momento sto leggendo un libro.
    - Che cosa stai facendo adesso?
  fa.a2.unit47.lesson01.teach.persons:
    title: Essere nel bel mezzo dell'azione
    gloss: sto (facendo), stai, sta, stiamo, state, stanno
    note: Metti *دارم* (o *داری, داره …*) prima del verbo al presente. Indica che sei nel mezzo dell'azione proprio ora.
    example_gloss:
    - Sto leggendo un libro.
    - Stai leggendo un libro.
    - Sta leggendo un libro.
    - Stiamo leggendo un libro.
    - State leggendo un libro.
    - Stanno leggendo un libro.
  fa.a2.unit47.lesson01.teach.verbs:
    title: Il presente di خوندن
    gloss: leggo, leggi, legge, leggiamo, leggete, leggono
    note: 'Entrambe le parti della forma progressiva prendono la stessa persona: *دارم … می‌خونم*, *داری … می‌خونی*.'
    example_gloss:
    - Leggo ogni giorno.
    - Leggi ogni giorno.
    - Legge ogni giorno.
    - Leggiamo ogni giorno.
    - Leggete ogni giorno.
    - Leggono ogni giorno.
  fa.a2.unit47.lesson01.teach.shape:
    title: دارم più il presente
    gloss: Sto leggendo un libro; lui sta leggendo un libro
    note: 'Prendi il presente parlato (*می‌خونم*) e metti *دارم* davanti. Cambia entrambi secondo la persona: *دارم … می‌خونم*, *داره … می‌خونه*. L''oggetto resta in mezzo.'
  fa.a2.unit47.lesson02.teach.habit:
    title: Parole per le abitudini
    gloss: ogni, giorno, di notte, lavoro
    note: '*هر روز* e *شب‌ها* indicano che l''azione è un''abitudine, non qualcosa che accade proprio ora.'
    example_gloss:
    - Lavoro ogni giorno.
    - La sera leggo libri.
  fa.a2.unit47.lesson02.teach.work:
    title: Lavorare
    gloss: lavoro, sto lavorando
    note: '*کار می‌کنم* può indicare un''abitudine («lavoro»); *دارم کار می‌کنم* dice che stai lavorando in questo momento.'
    example_gloss:
    - In questo momento sto lavorando.
    - Lavoro ogni giorno.
  fa.a2.unit47.lesson02.teach.contrast:
    title: Abitudine o momento presente
    gloss: Lavoro ogni giorno; in questo momento sto lavorando
    note: Il presente semplice (*کار می‌کنم*) si usa per abitudini e fatti. Con *دارم* lo stesso verbo dice che sei nel mezzo dell'azione ora. Nel parlato il presente semplice si può usare anche per l'ora, ma *دارم* lo rende chiaro.
  fa.a2.unit47.lesson02.teach.negative:
    title: Dire che non lo stai facendo
    gloss: Ora non sto leggendo un libro
    note: 'Per la negazione non si usa *دارم*. Si usa il presente negativo semplice: *الان کتاب نمی‌خونم*.'
    example_gloss:
    - Ora non sto leggendo un libro.
  fa.a2.unit47.lesson03.teach.things:
    title: Parole delle faccende di casa
    gloss: i vestiti, i piatti, passare la scopa (scopa), la cena
    note: '*لباس‌ها* e *ظرف‌ها* sono nomi plurali; con *رو* sono le cose che si lavano.'
    example_gloss:
    - Adesso sto lavando i vestiti.
    - Adesso sto lavando i piatti.
    - Adesso sto spazzando.
    - Adesso sto preparando la cena.
  fa.a2.unit47.lesson03.teach.verbs:
    title: I verbi delle faccende di casa
    gloss: lavo, spazzo, preparo
    note: '*شستن* dà *می‌شورم*; *جارو کردن* e *درست کردن* sono coppie formate da nome più verbo.'
    example_gloss:
    - Sto lavando i vestiti.
    - Sto spazzando.
    - Sto preparando la cena.
  fa.a2.unit47.lesson03.teach.others:
    title: Un'altra persona
    gloss: Nima, lui lava, lui fa
    note: 'Per un''altra persona cambiano sia *دارم* sia il verbo: *داره … می‌شوره*.'
    example_gloss:
    - Nima sta lavando i piatti.
    - Nima sta spazzando.
  fa.a2.unit47.lesson03.teach.rule:
    title: L'oggetto tra le due parti
    gloss: Sto lavando i piatti; Nima sta lavando i piatti
    note: L'oggetto con *رو* va tra *دارم* e il verbo. Con una coppia nome più verbo come *جارو می‌کنم*, *دارم* va prima di tutta l'espressione.
  fa.a2.unit47.lesson04.teach.calls:
    title: Iniziare una telefonata
    gloss: pronto (al telefono), dove sei, cosa fai
    note: '*الو* si usa per rispondere al telefono o per iniziare una telefonata.'
    example_gloss:
    - Pronto, dove sei?
    - Pronto, cosa stai facendo adesso?
  fa.a2.unit47.lesson04.teach.arrive:
    title: Sto arrivando
    gloss: sto venendo, sto arrivando
    note: '*دارم میام* significa «sono in arrivo»; *دارم می‌رسم* significa «sto per arrivare».'
    example_gloss:
    - Sto venendo.
    - Sto arrivando.
  fa.a2.unit47.lesson04.teach.talk:
    title: Parlare e chiamare
    gloss: con, mia madre, parlare, parlo, chiamare, lui / lei chiama
    note: '*حرف زدن* significa «parlare» e *زنگ زدن* significa «telefonare».'
    example_gloss:
    - Sto parlando con mia madre.
    - Mia madre sta chiamando.
  fa.a2.unit47.lesson04.teach.rule:
    title: Il progressivo al telefono
    gloss: Sto arrivando; sto parlando con mia madre
    note: 'Al telefono si usa molto il progressivo: dice all''altra persona cosa stai facendo in quel momento. *میام* è la forma parlata normale di «vengo»; *دارم میام* dice che sei in arrivo.'
  fa.a2.unit47.lesson05.teach.words:
    title: Parole per il testo
    gloss: è sera/notte, tutti, siamo a casa, i bambini, la TV, guardano, anche
    note: '*شبه* significa «è notte»; *خونه‌ایم* significa «siamo a casa».'
    example_gloss:
    - Ora è notte e siamo tutti a casa.
    - I bambini stanno guardando la TV.
    - Anche mia madre sta chiamando.
  fa.a2.unit47.lesson05.teach.reading:
    title: Una sera a casa
    gloss: Ora è notte e siamo tutti a casa. Sto preparando la cena. Nima sta lavando i piatti. I bambini stanno guardando la TV. Anche mia madre sta chiamando.
    note: Leggi una prima volta per capire chi fa cosa, poi una seconda volta per le forme verbali con *دارم, داره, دارن*.
  fa.a2.unit47.lesson06.teach.turn01:
    title: Sara chiama Nima
    gloss: 'Sara: Pronto Nima, dove sei?'
    note: '*کجایی؟* chiede dove ti trovi.'
  fa.a2.unit47.lesson06.teach.turn02:
    title: Nima è in arrivo
    gloss: 'Nima: Sto arrivando. Tu cosa stai facendo?'
    note: '*دارم میام* dice che sta arrivando.'
  fa.a2.unit47.lesson06.teach.turn03:
    title: Sara sta cucinando
    gloss: 'Sara: Sto preparando la cena.'
    note: '*دارم … درست می‌کنم* è il progressivo.'
  fa.a2.unit47.lesson06.teach.turn04:
    title: Nima chiede dei bambini
    gloss: 'Nima: E i bambini?'
    note: Una domanda breve che riprende l'argomento.
  fa.a2.unit47.lesson06.teach.turn05:
    title: Sara risponde
    gloss: 'Sara: Stanno guardando la TV.'
    note: '*دارن … می‌بینن* è la forma per «loro».'
  fa.a2.unit47.lesson06.teach.turn06:
    title: Nima sta per arrivare
    gloss: 'Nima: Bene. Sto arrivando.'
    note: '*دارم می‌رسم* dice che è quasi arrivato.'
