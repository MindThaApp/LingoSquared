course:
  title: Persiano A1
  description: Persiano iraniano per principianti, incentrato sulla lettura della scrittura, sulla comprensione del parlato quotidiano e su conversazioni pratiche da gestire con cortesia.
units:
  fa.a1.unit03.numbers:
    title: I numeri
lessons:
  fa.a1.unit03.lesson01.zero_to_ten:
    title: Da zero a dieci
  fa.a1.unit03.lesson02.eleven_to_ninety_nine:
    title: Da undici a novantanove
  fa.a1.unit03.lesson03.phone_numbers:
    title: I numeri di telefono
  fa.a1.unit03.lesson04.ages_and_quantities:
    title: Età e quantità
  fa.a1.unit03.lesson05.prices:
    title: I prezzi in toman
  fa.a1.unit03.lesson06.dialogue_phone_numbers:
    title: Scambiarsi il numero di telefono
teaching:
  fa.a1.unit03.lesson01.teach.adad:
    title: Numero
    gloss: numero
    note: عدد è la parola generica per «numero».
    example_gloss: Questo è un numero.
  fa.a1.unit03.lesson01.teach.zero:
    title: Zero
    gloss: 0 — zero
    note: صفر si usa per lo zero, anche come cifra dentro un numero più lungo, come un numero di telefono.
    example_gloss: Lo zero è un numero.
  fa.a1.unit03.lesson01.teach.one:
    title: Uno
    gloss: 1 — uno
    note: یک significa «uno».
    example_gloss: Ho un libro.
  fa.a1.unit03.lesson01.teach.two:
    title: Due
    gloss: 2 — due
    note: دو significa «due».
    example_gloss: Ho due mele.
  fa.a1.unit03.lesson01.teach.three:
    title: Tre
    gloss: 3 — tre
    note: سه significa «tre».
    example_gloss: Ha tre fratelli.
  fa.a1.unit03.lesson01.teach.four:
    title: Quattro
    gloss: 4 — quattro
    note: چهار significa «quattro».
    example_gloss: Sono le quattro.
  fa.a1.unit03.lesson01.teach.five:
    title: Cinque
    gloss: 5 — cinque
    note: پنج significa «cinque».
    example_gloss: Aspetta cinque minuti.
  fa.a1.unit03.lesson01.teach.six:
    title: Sei
    gloss: 6 — sei
    note: شش significa «sei».
    example_gloss: Ci sono sei sedie.
  fa.a1.unit03.lesson01.teach.seven:
    title: Sette
    gloss: 7 — sette
    note: هفت significa «sette».
    example_gloss: In una settimana ci sono sette giorni.
  fa.a1.unit03.lesson01.teach.eight:
    title: Otto
    gloss: 8 — otto
    note: هشت significa «otto».
    example_gloss: Ci vediamo alle otto.
  fa.a1.unit03.lesson01.teach.nine:
    title: Nove
    gloss: 9 — nove
    note: 'نه significa «nove». È anche la parola normale per «no»: il contesto (per esempio se compare in un conteggio o in un numero) chiarisce quale significato sia.'
    example_gloss: Qui ci sono nove studenti.
  fa.a1.unit03.lesson01.teach.ten:
    title: Dieci
    gloss: 10 — dieci
    note: ده significa «dieci».
    example_gloss: Ho dieci dita.
  fa.a1.unit03.lesson02.teach.eleven:
    title: Undici
    gloss: 11 — undici
    note: یازده significa «undici».
    example_gloss: Ho lezione alle undici.
  fa.a1.unit03.lesson02.teach.twelve:
    title: Dodici
    gloss: 12 — dodici
    note: دوازده significa «dodici».
    example_gloss: In un anno ci sono dodici mesi.
  fa.a1.unit03.lesson02.teach.thirteen:
    title: Tredici
    gloss: 13 — tredici
    note: سیزده significa «tredici».
    example_gloss: Ha tredici anni.
  fa.a1.unit03.lesson02.teach.fourteen:
    title: Quattordici
    gloss: 14 — quattordici
    note: چهارده significa «quattordici».
    example_gloss: Verrò tra quattordici giorni.
  fa.a1.unit03.lesson02.teach.fifteen:
    title: Quindici
    gloss: 15 — quindici
    note: پانزده significa «quindici».
    example_gloss: Ha quindici libri.
  fa.a1.unit03.lesson02.teach.sixteen:
    title: Sedici
    gloss: 16 — sedici
    note: 'شانزده significa «sedici»: non si deduce da شش (sei) + ده (dieci), quindi conviene impararlo come parola a sé.'
    example_gloss: Ha sedici anni.
  fa.a1.unit03.lesson02.teach.seventeen:
    title: Diciassette
    gloss: 17 — diciassette
    note: هفده significa «diciassette».
    example_gloss: Sono venute diciassette persone.
  fa.a1.unit03.lesson02.teach.eighteen:
    title: Diciotto
    gloss: 18 — diciotto
    note: هجده significa «diciotto».
    example_gloss: Ha diciotto anni.
  fa.a1.unit03.lesson02.teach.nineteen:
    title: Diciannove
    gloss: 19 — diciannove
    note: نوزده significa «diciannove».
    example_gloss: Mancano diciannove giorni.
  fa.a1.unit03.lesson02.teach.twenty:
    title: Venti
    gloss: 20 — venti
    note: بیست significa «venti».
    example_gloss: Ho venti libri.
  fa.a1.unit03.lesson02.teach.thirty:
    title: Trenta
    gloss: 30 — trenta
    note: سی significa «trenta».
    example_gloss: Questo mese ha trenta giorni.
  fa.a1.unit03.lesson02.teach.forty_to_ninety:
    title: Da quaranta a novanta
    gloss: 40, 50, 60, 70, 80, 90
    note: چهل، پنجاه، شصت، هفتاد، هشتاد، نود sono le altre decine.
    example_gloss:
    - Ha quarant'anni.
    - Ci sono cinquanta sedie.
    - Sessanta minuti sono un'ora.
    - Questo libro ha settanta pagine.
    - Ha ottanta libri.
    - Ha novant'anni.
  fa.a1.unit03.lesson02.teach.combining:
    title: Unire decine e unità
    gloss: venticinque
    note: 'بیست و پنج significa letteralmente «venti e cinque»: parola della decina, و, parola dell''unità.'
  fa.a1.unit03.lesson03.teach.shomare:
    title: Numero (di qualcosa)
    gloss: numero
    note: شماره si usa per un numero identificativo, come un numero di telefono o un numero civico; è diverso dal senso generale di «numero» di عدد.
    example_gloss: Questo è il mio numero di telefono.
  fa.a1.unit03.lesson03.teach.telefon:
    title: Telefono
    gloss: telefono
    note: تلفن indica i telefoni in generale, compresi i cellulari.
    example_gloss: Non ho il telefono.
  fa.a1.unit03.lesson03.teach.digit_by_digit:
    title: Chiedere il numero di telefono
    gloss: Qual è il tuo numero di telefono?
    note: شماره تلفنتون چنده؟ è il modo educato e normale per chiedere un numero di telefono. Leggere un numero cifra per cifra è sempre comprensibile ed è il metodo più sicuro per iniziare; raggruppare le cifre è normale nel parlato reale, ma in questa lezione si esercita prima la forma più semplice, cifra per cifra.
  fa.a1.unit03.lesson03.teach.chande:
    title: Quanto / qual è?
    gloss: qual è? / quanto costa?
    note: چنده؟ è la forma contratta di چند است e chiede un numero, una quantità o un prezzo, a seconda del contesto.
  fa.a1.unit03.lesson03.teach.read_number:
    title: Leggere un numero cifra per cifra
    gloss: zero, nove, uno, due, tre, quattro, cinque, sei, sette, otto, otto
    note: In questa lezione si esercita la lettura dei numeri cifra per cifra. Un vero numero di cellulare iraniano ha 11 cifre e inizia con 0, per esempio 0912 345 6788.
  fa.a1.unit03.lesson04.teach.sal:
    title: Anno
    gloss: anno
    note: سال si usa sia per gli anni del calendario sia per dire l'età di qualcuno.
    example_gloss: Ho vent'anni.
  fa.a1.unit03.lesson04.teach.man_recap:
    title: Io (ripasso)
    gloss: io
    note: Un rapido ripasso di من, che serve qui per dire la tua età in una frase completa.
  fa.a1.unit03.lesson04.teach.chand_saale:
    title: Chiedere l'età a qualcuno (informale)
    gloss: Quanti anni hai?
    note: چند سالته؟ è la forma informale singolare; چند سالتونه؟ è l'equivalente di cortesia.
  fa.a1.unit03.lesson04.teach.salame:
    title: Dire la propria età
    gloss: Ho 25 anni.
    note: 'سالمه unisce direttamente a سال la desinenza possessiva ـم («mio») e poi aggiunge la copula colloquiale ـه («è»): letteralmente «il-mio-anno-è».'
  fa.a1.unit03.lesson04.teach.ta:
    title: Classificatore numerale
    gloss: (parola di conteggio, senza equivalente diretto in italiano)
    note: 'تا è il classificatore generico usato per contare la maggior parte degli oggetti: numero + تا + nome.'
  fa.a1.unit03.lesson04.teach.sib:
    title: Mela
    gloss: mela
    note: سیب significa «mela».
    example_gloss: Mi piacciono le mele.
  fa.a1.unit03.lesson04.teach.ketab:
    title: Libro
    gloss: libro
    note: کتاب significa «libro».
    example_gloss: Questo è un bel libro.
  fa.a1.unit03.lesson04.teach.do_ta_sib:
    title: Chiedere una quantità
    gloss: Vorrei due mele.
    note: دو تا سیب می‌خوام mette la quantità contata prima del nome, come di norma con تا.
  fa.a1.unit03.lesson05.teach.gheymat:
    title: Prezzo
    gloss: prezzo
    note: قیمت è la parola generica per «prezzo».
    example_gloss: Quanto costa questo?
  fa.a1.unit03.lesson05.teach.toman:
    title: Toman
    gloss: toman (valuta iraniana, uso quotidiano)
    note: La valuta ufficiale dell'Iran è il rial, ma nel parlare di tutti i giorni i prezzi si dicono quasi sempre in toman (1 toman = 10 rial).
    example_gloss: Questo costa diecimila toman.
  fa.a1.unit03.lesson05.teach.hezar:
    title: Mille
    gloss: mille
    note: هزار significa «mille»; di solito i prezzi si dicono in migliaia di toman.
    example_gloss: Ho mille toman.
  fa.a1.unit03.lesson05.teach.ask_price:
    title: Chiedere il prezzo
    gloss: Quanto costa questo?
    note: این چنده؟ è il modo normale per chiedere il prezzo di qualcosa che hai davanti.
  fa.a1.unit03.lesson05.teach.price_answer:
    title: Dire un prezzo
    gloss: Costa 30.000 toman.
    note: تومنه è la forma contratta di تومن است; lo schema completo è numero + هزار + تومنه.
  fa.a1.unit03.lesson06.teach.practice_together:
    title: Sara propone di esercitarsi insieme
    gloss: Sara dice che vuole esercitarsi con Mina a parlare farsi e le chiede il numero di telefono.
    note: باهم significa «insieme»; می‌خوام ... تمرین کنیم significa «voglio che ci esercitiamo». Da solo, تمرین کنیم detto come domanda può significare anche «ci esercitiamo?»
  fa.a1.unit03.lesson06.teach.mina_gives_number:
    title: Mina dà il suo numero
    gloss: Mina accetta e legge il suo numero di 11 cifre una cifra alla volta.
    note: شماره‌ام è la forma contratta di شماره من; هشته è la contrazione di هشت است e chiude il numero.
  fa.a1.unit03.lesson06.teach.sara_confirms:
    title: Sara controlla di aver scritto bene il numero
    gloss: Sara chiede a Mina di aspettare mentre scrive il numero, poi lo rilegge per conferma.
    note: درسته؟ («è giusto?») è un modo comune per verificare un numero o un'informazione appena sentita.
  fa.a1.unit03.lesson06.teach.mina_confirms_asks:
    title: Mina conferma e chiede a sua volta
    gloss: Mina conferma che è giusto e chiede il numero di Sara.
    note: آره è un «sì» informale, più colloquiale di بله.
  fa.a1.unit03.lesson06.teach.sara_gives_number:
    title: Sara dà il suo numero
    gloss: Sara legge il proprio numero di 11 cifre, una cifra alla volta.
    note: یکه è la contrazione di یک است e chiude il numero, come هشته ha chiuso quello di Mina.
  fa.a1.unit03.lesson06.teach.mina_will_call:
    title: Mina accetta di chiamare
    gloss: Mina dice che domani chiamerà Sara.
    note: زنگ می‌زنم بهت significa «ti chiamo»; letteralmente «batto il campanello a te».
exercises:
  fa.a1.unit03.lesson01.exercise01.recognize_yek:
    instruction: Seleziona il significato di یک.
    correct_option: una
    distractors:
    - due
    - cinque
    - dieci
    accepted_answers:
