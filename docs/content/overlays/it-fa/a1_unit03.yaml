    pairs:
    - left: صفر
      right: '0'
    - left: یک
      right: '1'
    - left: دو
      right: '2'
    - left: سه
      right: '3'
    - left: چهار
      right: '4'
    - left: پنج
      right: '5'
    - left: شش
      right: '6'
  fa.a1.unit03.lesson01.exercise05.match_high:
    instruction: Abbina ogni parola al suo significato.
    accepted_answers:
    - value:
        هفت: '7'
        هشت: '8'
        نه: '9'
        ده: '10'
        عدد: numero
        صفر: '0'
      status: correct
    feedback: هفت، هشت، نه، ده sono i numeri da 7 a 10; عدد è la parola per «numero»; صفر è zero.
    pairs:
    - left: هفت
      right: '7'
    - left: هشت
      right: '8'
    - left: نه
      right: '9'
    - left: ده
      right: '10'
    - left: عدد
      right: numero
    - left: صفر
      right: '0'
  fa.a1.unit03.lesson01.exercise06.order_ascending:
    instruction: Disponi i numeri dal più piccolo al più grande.
    accepted_answers:
    - value:
      - یک
      - دو
      - سه
      status: correct
    feedback: یک، دو، سه è l'ordine crescente corretto.
  fa.a1.unit03.lesson01.exercise07.fill_seven:
    instruction: Completa con la parola persiana per 7.
    accepted_answers:
    - value: هفت
      status: correct
    feedback: ۷ è هفت.
  fa.a1.unit03.lesson01.exercise08.translate_nine:
    instruction: 'Traduci in farsi: nove.'
    accepted_answers:
    - value: نه
      status: correct
    feedback: نه significa nove.
  fa.a1.unit03.lesson02.exercise01.recognize_bist:
    instruction: Seleziona il significato di بیست.
    correct_option: venti
    distractors:
    - dodici
    - dieci
    - due
