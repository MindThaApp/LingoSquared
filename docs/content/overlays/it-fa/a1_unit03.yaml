  fa.a1.unit03.lesson03.exercise01.shomare_meaning:
    instruction: Seleziona il significato di شماره.
    correct_option: numero (di identificazione, ad es. di telefono o civico)
    distractors:
    - un prezzo (quanto costa)
    - un'età (quanti anni)
    - una quantità (quanti)
    accepted_answers:
    - value: numero (di identificazione, ad es. di telefono o civico)
      status: correct
    feedback: شماره si usa per un numero di identificazione, come un numero di telefono o un numero civico.
  fa.a1.unit03.lesson03.exercise02.telefon_meaning:
    instruction: Seleziona il significato di تلفن.
    correct_option: telefono
    distractors:
    - numero
    - indirizzo
    - messaggio
    accepted_answers:
    - value: telefono
      status: correct
    feedback: تلفن significa telefono.
  fa.a1.unit03.lesson03.exercise03.recognize_ask_reading:
    instruction: Che cosa chiede questa domanda?
    correct_option: il numero di telefono di chi ascolta
    distractors:
    - l'età di chi ascolta
