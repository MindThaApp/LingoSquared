course:
  title: Persiano A2
  description: 'Persiano iraniano di livello pre-intermedio con un filo conduttore grammaticale: banca, opinioni, appuntamenti e altro. Ora si sposta un appuntamento: dire che non puoi venire, proporre un altro giorno, dare un motivo e concordare un nuovo orario.'
