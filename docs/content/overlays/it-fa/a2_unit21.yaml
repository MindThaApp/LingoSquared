teaching:
  fa.a2.unit21.lesson01.teach.appointment:
    title: Appuntamento, parrucchiere
    gloss: appuntamento, parrucchiere (salone)
    note: '*وقت* significa sia «tempo» sia «appuntamento»: *وقت دارم* = «ho un appuntamento» (oppure «ho tempo»). *آرایشگاه* è il parrucchiere o il salone di bellezza.'
    example_gloss:
    - Giovedì ho un appuntamento dal parrucchiere.
    - Ho un appuntamento dal medico.
  fa.a2.unit21.lesson01.teach.change_cancel:
    title: Cambiare, annullare
    gloss: cambiare (un appuntamento), annullare
    note: 'Sono entrambi verbi con *کردن*. L''oggetto *وقتم* prende *رو*: *وقتم رو عوض می‌کنم*. *کنسل کردن* è la parola di uso quotidiano per «annullare».'
    example_gloss:
    - Sto cambiando il mio appuntamento.
    - Sto annullando il mio appuntamento.
  fa.a2.unit21.lesson01.teach.sorry:
    title: Purtroppo, scusa
    gloss: purtroppo, scusa
    note: '*متأسفانه* introduce un rifiuto cortese o una cattiva notizia. *ببخشید* è il «scusa / scusi» di tutti i giorni. *متأسفانه* si scrive spesso *متاسفانه* senza hamza; entrambe le forme sono accettate.'
    example_gloss:
    - Purtroppo non posso.
    - Scusi, posso entrare?
  fa.a2.unit21.lesson01.teach.cant_come_phrase:
    title: Purtroppo giovedì non posso venire.
    gloss: Purtroppo giovedì non posso venire.
    note: '*نمی‌تونم* («non posso») è seguito dal verbo breve *بیام* (da *اومدن*, «venire»). Il giorno va prima del verbo: *پنجشنبه نمی‌تونم بیام*.'
  fa.a2.unit21.lesson01.teach.can_change:
    title: Posso cambiare il mio appuntamento?
    gloss: Posso cambiare il mio appuntamento?
    note: '*می‌تونم* («posso») + il verbo breve *کنم*. È il modo cortese di chiedere di spostare l''appuntamento.'
  fa.a2.unit21.lesson01.teach.can_rule:
    title: Potere e non potere + verbo breve
    gloss: posso venire, non posso venire, posso cambiare
    note: '*می‌تونم* (posso) e *نمی‌تونم* (non posso) sono seguiti dalla forma breve del verbo con *be-*: *بیام* (venire), *کنم* (fare). Entrambi i verbi hanno la stessa desinenza (*-م*): *نمی‌تونم بیام*. Per il *Lei* (forma di cortesia) entrambi prendono *-ید*: *می‌تونید بیاید؟*'
  fa.a2.unit21.lesson02.teach.days:
    title: Un altro giorno, sabato, lunedì
    gloss: un altro giorno, sabato, lunedì
    note: '*دیگه* dopo un nome significa «altro» o «ancora»: *یه روز دیگه* è «un altro giorno». In Iran la settimana inizia di *شنبه* (sabato).'
    example_gloss:
    - Ho un appuntamento un altro giorno.
    - Sabato non posso.
    - Lunedì ho tempo.
  fa.a2.unit21.lesson02.teach.can_it_be:
    title: Può essere lunedì?
    gloss: Può essere lunedì?
    note: '*می‌شه* («è possibile») + il giorno + *باشه* («che sia»). È il modo abituale di proporre un altro giorno: *می‌شه شنبه باشه؟*'
  fa.a2.unit21.lesson02.teach.suits_you:
    title: Il sabato va bene per Lei?
    gloss: Il sabato va bene per Lei? (formale)
    note: '*براتون مناسبه؟* chiede se qualcosa va bene a te. *براتون* è la forma di cortesia del *Lei*; con un amico diresti *برات مناسبه؟*'
  fa.a2.unit21.lesson02.teach.yes_fine:
    title: Sì, va bene.
    gloss: Sì, va bene.
    note: '*خوبه* («va bene») è un modo breve per accettare un orario.'
  fa.a2.unit21.lesson02.teach.no_sorry:
    title: No, purtroppo no.
    gloss: No, purtroppo no.
    note: 'Un modo cortese di rifiutare: *نه* più *متأسفانه* attenua la risposta.'
  fa.a2.unit21.lesson02.teach.you_rule:
    title: Il tu e il Lei
    gloss: Ti / Le va bene? (amico / formale)
    note: 'Con un amico la desinenza è *-ت*: *برات*. Per uno sportello o una persona che non conosci si usa *-تون*: *براتون*. In questa unità il salone usa la forma formale.'
  fa.a2.unit21.lesson03.teach.because:
    title: Perché, sono malato
    gloss: perché, sono malato
    note: '*چون* («perché») collega il motivo alla frase principale: *نمی‌تونم بیام چون مریضم*. *مریضم* è *مریض* («malato») + *-م* («sono»).'
    example_gloss:
    - Non posso venire perché sono malato.
    - Perché ho da lavorare, non posso.
  fa.a2.unit21.lesson03.teach.reason_work:
    title: Perché devo lavorare.
    gloss: Perché devo lavorare.
    note: '*باید* («devo») + il verbo breve *کنم*: *باید کار کنم*.'
  fa.a2.unit21.lesson03.teach.reason_other:
    title: Perché ho un altro appuntamento.
    gloss: Perché ho un altro appuntamento.
    note: '*یه وقت دیگه* significa «un altro appuntamento».'
  fa.a2.unit21.lesson03.teach.reason_ill:
    title: Perché non puoi? Perché sono malato.
    gloss: Perché non puoi? Perché sono malato.
    note: '*چرا؟* chiede il motivo; una risposta breve che comincia con *چون* può stare da sola. *نمی‌تونی* è la forma del *tu* di *نمی‌تونم*.'
  fa.a2.unit21.lesson03.teach.sorry_trouble:
    title: Scusa per il disturbo.
    gloss: Scusa per il disturbo.
    note: '*بابت زحمت* significa «per il disturbo». Si dice quando si dà un lavoro in più a qualcuno, per esempio spostando un appuntamento.'
  fa.a2.unit21.lesson03.teach.reason_rule:
    title: Frase principale, poi il motivo
    gloss: Non posso venire perché devo lavorare.
    note: 'Prima il rifiuto, poi il motivo dopo *چون*. Una risposta breve può iniziare con *چون*: *چرا نمی‌تونی؟* *چون مریضم.*'
  fa.a2.unit21.lesson04.teach.time_words:
    title: Alle dieci, un giorno prima
    gloss: le dieci, un giorno prima
    note: 'Per dire l''ora usa *ساعت* + il numero: *ساعت ده* (le dieci). *قبل* significa «prima»: *یه روز قبل* è «un giorno prima».'
    example_gloss:
    - Lunedì alle dieci va bene.
    - Telefonerò un giorno prima.
  fa.a2.unit21.lesson04.teach.monday_ten:
    title: Lunedì alle dieci va bene.
    gloss: Lunedì alle dieci va bene.
    note: 'Prima il giorno, poi l''ora: *دوشنبه ساعت ده*.'
  fa.a2.unit21.lesson04.teach.can_you_come:
    title: Può venire lunedì alle dieci?
    gloss: Può venire lunedì alle dieci? (formale)
    note: '*می‌تونید* e *بیاید* hanno la desinenza di cortesia del *voi* *-ید*.'
  fa.a2.unit21.lesson04.teach.see_you:
    title: Allora ci vediamo lunedì.
    gloss: Allora ci vediamo lunedì. (formale)
    note: '*پس* (allora) chiude l''accordo; *می‌بینمتون* significa «ci vediamo / la vedo» (formale).'
  fa.a2.unit21.lesson04.teach.new_appointment:
    title: Prenderò un nuovo appuntamento.
    gloss: Prenderò un nuovo appuntamento.
    note: '*وقت گرفتن* (letteralmente «prendere un tempo») è il modo abituale per dire che si prenota un appuntamento.'
  fa.a2.unit21.lesson04.teach.time_rule:
    title: Prima il giorno, poi l'ora
    gloss: lunedì alle dieci
    note: 'Si dice prima il giorno e poi l''ora, senza preposizione: *دوشنبه ساعت ده*. Se aggiungi il verbo, va alla fine: *دوشنبه ساعت ده بیاید*.'
  fa.a2.unit21.lesson05.teach.spot_time:
    title: Individua il giorno e l'ora
    gloss: Lunedì alle dieci, un giorno prima
    note: Quando leggi un messaggio su un appuntamento, cerca il giorno, l'ora e che cosa devi fare se l'orario non ti va bene.
  fa.a2.unit21.lesson05.teach.reading_sms:
    title: Un messaggio dal salone
    gloss: Buongiorno signor Nima! Il suo appuntamento è stato spostato a lunedì alle dieci. Se quest'orario non va bene, la preghiamo di telefonare un giorno prima. Fisseremo un nuovo appuntamento.
    note: Un breve messaggio dal salone. Leggilo una prima volta per l'orario nuovo, poi di nuovo per capire che cosa fare se non va bene.
  fa.a2.unit21.lesson06.teach.names:
    title: Nima, il salone
    gloss: Nima, il salone
    note: Nima, l'amico delle unità precedenti, telefona dal parrucchiere. Chi risponde per il salone è indicato con *آرایشگاه*.
    example_gloss:
    - Nima telefona al salone.
  fa.a2.unit21.lesson06.teach.please_great:
    title: Prego (dica), certo, grazie, prego (risposta a grazie)
    gloss: prego (dica), certo, grazie, prego
    note: '*بفرمایید* è ciò che dice chi risponde al telefono per invitarti a parlare. *البته* significa «certo», *ممنون* significa «grazie» e *خواهش می‌کنم* risponde a «grazie».'
    example_gloss:
    - Salone, prego, dica.
    - Sì, certo.
    - Grazie. Prego.
  fa.a2.unit21.lesson06.teach.dlg1:
    title: Il salone risponde
    gloss: Il salone risponde al telefono.
    note: 'Un modo cortese di rispondere: il nome del posto e *بفرمایید*.'
  fa.a2.unit21.lesson06.teach.dlg2:
    title: Nima spiega e chiede
    gloss: Nima dice che giovedì ha un appuntamento ma purtroppo non può venire, e chiede se può cambiarlo.
    note: '*ولی* collega l''appuntamento e il problema.'
  fa.a2.unit21.lesson06.teach.dlg3:
    title: Il salone propone sabato
    gloss: Il salone dice di sì, certo, e chiede se sabato va bene.
    note: Il *براتون* di cortesia.
  fa.a2.unit21.lesson06.teach.dlg4:
    title: Nima rifiuta e propone lunedì
    gloss: Nima dice che purtroppo no, perché deve lavorare, e chiede se può essere lunedì.
    note: Un rifiuto, un motivo e una nuova proposta.
  fa.a2.unit21.lesson06.teach.dlg5:
    title: Il salone accetta
    gloss: Il salone dice che lunedì alle dieci va bene.
    note: Prima il giorno, poi l'ora.
  fa.a2.unit21.lesson06.teach.dlg6:
    title: Nima ringrazia e si scusa
    gloss: Nima dice che è perfetto, grazie, e si scusa per il disturbo.
    note: '*ببخشید بابت زحمت* è la cortese scusa di chiusura.'
  fa.a2.unit21.lesson06.teach.dlg7:
    title: Il salone chiude la conversazione
    gloss: Il salone dice prego, e a lunedì.
    note: '*خواهش می‌کنم* risponde a «grazie».'
  fa.a2.unit21.lesson06.teach.third_person:
    title: Non può venire, dice lei/lui
    gloss: lui/lei non può venire, lui/lei dice, lui/lei vuole
    note: 'Per riferire ciò che un''altra persona dice o può fare si usano le desinenze del *lui/lei*: *نمی‌تونه* (non può), *می‌گه* (dice), *می‌خواد* (vuole) e il verbo breve *بیاد* (venire).'
    example_gloss:
    - Nima giovedì non può venire.
    - Il salone dice che lunedì alle dieci va bene.
