teaching:
  fa.a2.unit16.lesson01.teach.social_media_word:
    title: Social network
    gloss: social network
    note: '*شبکه‌ی اجتماعی* è l''espressione standard per indicare i social network.'
    example_gloss: Uso i social ogni giorno.
  fa.a2.unit16.lesson01.teach.app_word:
    title: App
    gloss: app
    note: '*اپلیکیشن* è il prestito comune per indicare un''app del telefono o del computer.'
    example_gloss: La mia app preferita è Instagram.
  fa.a2.unit16.lesson01.teach.screen_word:
    title: Schermo
    gloss: schermo
    note: '*صفحه* è la parola per indicare uno schermo, per esempio quello di un telefono o di un computer.'
    example_gloss: Lo schermo del mio telefono è grande.
  fa.a2.unit16.lesson01.teach.useful_word:
    title: Utile
    gloss: utile
    note: '*مفید* significa utile; *مفیده* è la sua forma colloquiale parlata (*مفید* + *است*).'
    example_gloss: Leggere le notizie è utile.
  fa.a2.unit16.lesson01.teach.news_word:
    title: Notizie
    gloss: notizie
    note: '*خبر* è la parola generica per indicare le notizie.'
    example_gloss: Leggo le notizie ogni giorno.
  fa.a2.unit16.lesson01.teach.entertaining_word:
    title: Divertente
    gloss: divertente
    note: '*سرگرم‌کننده* descrive qualcosa di divertente o piacevole da usare.'
    example_gloss: Questa app è molto divertente.
  fa.a2.unit16.lesson01.teach.waste_time_note:
    title: Perdere tempo (verbo composto)
    gloss: perdere tempo
    note: '*وقت تلف کردن* significa letteralmente «tempo spreco fare»: è un''altra costruzione con verbo leggero, come *باز کردن* dell''unità sulla banca.'
    target_text: وقت تلف کردن (perdere tempo, verbo composto)
  fa.a2.unit16.lesson01.teach.recap_opinion_pattern:
    title: Secondo me ... perché ...
    gloss: secondo me ... perché ...
    note: Ripasso della struttura *به نظر من ... چون ...* dell'unità sulle opinioni, qui riutilizzata per esprimere un'abitudine insieme a un'opinione.
  fa.a2.unit16.lesson02.teach.about_word:
    title: Circa / più o meno
    gloss: circa / più o meno
    note: '*حدود* precede una quantità e significa «circa» o «approssimativamente».'
    example_gloss: Avevo circa due ore.
  fa.a2.unit16.lesson02.teach.how_much_word:
    title: Quanto usi i social ogni giorno?
    gloss: Quanto usi i social ogni giorno?
    note: '*چقدر* significa «quanto»; qui si riferisce al tempo dedicato a un''attività.'
  fa.a2.unit16.lesson02.teach.my_habit_sentence:
    title: Esprimere la propria abitudine con una frequenza
    gloss: Uso i social per circa due ore ogni giorno.
    note: Unisce *هر روز* (ogni giorno) e *حدود دو ساعت* (circa due ore) per esprimere un'abitudine con la sua durata.
  fa.a2.unit16.lesson03.teach.world_word:
    title: Mondo
    gloss: mondo
    note: '*دنیا* è la parola generica per «mondo».'
    example_gloss: Mi piace sapere cosa succede nel mondo.
  fa.a2.unit16.lesson03.teach.message_text:
    title: Un messaggio sulla lettura delle notizie online
    gloss: Ciao! Ogni giorno leggo le notizie per circa un'ora. Secondo me leggere le notizie è utile, perché so cosa succede nel mondo.
    note: Un breve messaggio scritto che usa la struttura *به نظر من ... چون ...*, nello stile colloquiale che si usa nei messaggi agli amici.
  fa.a2.unit16.lesson04.teach.favorite_word:
    title: Preferito
    gloss: preferito
    note: '*مورد علاقه* significa «preferito»; in *علاقه‌ام* si attacca il suffisso possessivo di «mio».'
    example_gloss: Il mio colore preferito è il blu.
  fa.a2.unit16.lesson04.teach.turn01:
    title: نیما chiede a سارا come usa i social
    gloss: نیما chiede a سارا quanto usa i social ogni giorno.
    note: Riprende la domanda «quanto» già vista nella lezione 2.
  fa.a2.unit16.lesson04.teach.turn02:
    title: سارا dice qual è la sua abitudine
    gloss: سارا dice circa due ore; la sua app preferita è Instagram.
    note: Riprende la struttura con *حدود* (circa) della lezione 2.
  fa.a2.unit16.lesson04.teach.turn03:
    title: نیما le chiede cosa ne pensa
    gloss: نیما le chiede se secondo lei è utile.
    note: '*به نظرت* («secondo te») è la forma della seconda persona di *به نظر من*.'
  fa.a2.unit16.lesson04.teach.turn04:
    title: سارا dà la sua opinione
    gloss: سارا dice che secondo lei è sia divertente sia, a volte, una perdita di tempo.
    note: '*هم ... هم ...* («sia ... sia ...») collega due qualità della stessa cosa, qui una positiva e una negativa.'
  fa.a2.unit16.lesson04.teach.turn05:
    title: نیما contrappone la propria abitudine
    gloss: نیما dice che legge soprattutto le notizie, non i social.
    note: '*بیشتر ..., نه ...* («soprattutto ..., non ...») esprime una preferenza per contrasto.'
  fa.a2.unit16.lesson04.teach.turn06:
    title: سارا reagisce
    gloss: 'سارا dice: che bello!'
    note: 'Una breve reazione quotidiana: *چه خوب!* significa «che bello!».'
