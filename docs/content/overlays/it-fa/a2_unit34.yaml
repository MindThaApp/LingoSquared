teaching:
  fa.a2.unit34.lesson01.teach.reason_nouns:
    title: Parole per dare un motivo
    gloss: pioggia, traffico, lavoro, malato, ieri, oggi
    note: '*بارون* è la forma parlata di «pioggia». Sono i motivi di tutti i giorni dietro scuse e cambi di programma.'
    example_gloss:
    - Ieri pioveva.
    - Oggi c'è traffico.
    - Oggi ho da lavorare.
    - Ieri avevo da lavorare.
    - Ieri ero malato.
  fa.a2.unit34.lesson01.teach.past_actions:
    title: Risultati
    gloss: è piovuto, non sono venuto, non vengo, sono arrivato in ritardo
    note: 'Queste forme brevi sono i risultati che collegherai a un motivo (passato: *نیومدم*; presente: *نمیام*). *نیومدم* è la forma negativa di *اومدم* (sono venuto).'
    example_gloss:
    - Ieri è piovuto.
    - Ieri non sono venuto.
    - Oggi non vengo.
    - Oggi sono arrivato in ritardo.
  fa.a2.unit34.lesson01.teach.connectors:
    title: Tre connettivi
    gloss: perché, quindi / per questo, a causa di
    note: Tre modi per collegare una causa e un risultato. *چون* e *به خاطر* introducono la causa; *برای همین* introduce il risultato.
    example_gloss:
    - Siccome ha piovuto, non sono venuto.
    - Ha piovuto, quindi non sono venuto.
    - Non sono venuto a causa della pioggia.
  fa.a2.unit34.lesson01.teach.weather_causes:
    title: Cause legate al tempo
    gloss: caldo, freddo
    note: Usa questi sostantivi legati al tempo dopo *به خاطر* per dare una causa.
    example_gloss:
    - Sono stato male a causa del caldo.
    - Sono stato male a causa del freddo.
  fa.a2.unit34.lesson01.teach.everyday_causes:
    title: Cause quotidiane
    gloss: stanchezza, sonno, straordinari, progetto
    note: Questi sostantivi indicano cause comuni legate alla stanchezza e al lavoro.
    example_gloss:
    - Sono arrivato in ritardo per la stanchezza.
    - Sono arrivato in ritardo per il sonno.
    - Ho fatto gli straordinari a causa del progetto.
  fa.a2.unit34.lesson01.teach.chon:
    title: چون introduce la causa
    gloss: Siccome ha piovuto, non sono venuto.
    note: '*چون* + una frase completa (con il suo verbo) indica la causa, e il risultato segue dopo la virgola: *چون بارون اومد، نیومدم*.'
  fa.a2.unit34.lesson01.teach.baraye_hamin:
    title: برای همین introduce il risultato
    gloss: Ha piovuto, quindi non sono venuto.
    note: 'Di'' prima la causa come frase a sé, poi *برای همین* + il risultato: *بارون اومد، برای همین نیومدم*. Significa «per questo».'
  fa.a2.unit34.lesson02.teach.plan_changes:
    title: Scuse e cambi di programma
    gloss: la mia macchina si è guastata, non sono andato al lavoro, non sono potuto venire, abbiamo cambiato il nostro appuntamento
    note: '*قرار* è un appuntamento o un impegno preso. *سر کار نرفتم* = «non sono andato al lavoro». *نتونستم بیام* = «non sono potuto venire».'
    example_gloss:
    - La mia macchina si è guastata.
    - Ieri non sono andato al lavoro.
    - Oggi non sono potuto venire.
    - Abbiamo cambiato il nostro appuntamento.
  fa.a2.unit34.lesson02.teach.khater:
    title: به خاطر + sostantivo
    gloss: Non sono venuto a causa della pioggia.
    note: '*به خاطر* è seguito da un sostantivo, senza un verbo proprio: *به خاطر بارون*, *به خاطر ترافیک*, *به خاطر کار*. Il resto della frase dà il risultato: *به خاطر ترافیک دیر رسیدم*.'
  fa.a2.unit34.lesson02.teach.khater_vs_chon:
    title: Stesso significato, due forme
    gloss: a causa del traffico = perché c'era traffico
    note: '*به خاطر ترافیک* e *چون ترافیک بود* indicano la stessa causa. Usa *به خاطر* quando la causa è solo un sostantivo, e *چون* quando dici una frase intera.'
  fa.a2.unit34.lesson03.teach.order:
    title: Prima la causa, poi il risultato
    gloss: Siccome avevo da fare, non sono venuto / Avevo da fare, quindi non sono venuto
    note: Con *چون*, la frase di causa apre la frase e il risultato la chiude. Con *برای همین*, la causa è prima una frase separata e il risultato viene dopo *برای همین*. In entrambi i casi la causa si dice prima del risultato.
  fa.a2.unit34.lesson03.teach.clause_vs_noun:
    title: Frase o sostantivo
    gloss: چون + frase, به خاطر + sostantivo
    note: Dopo *چون* serve un verbo (*بارون اومد*, *ترافیک بود*). Dopo *به خاطر* si usa solo un sostantivo (*بارون*, *ترافیک*). Non dire *به خاطر بارون اومد* per «perché ha piovuto».
  fa.a2.unit34.lesson03.teach.one_connector:
    title: Un solo connettivo per ogni legame
    gloss: Non combinare چون e برای همین nello stesso legame
    note: Usa *چون ... ،* oppure *... ، برای همین ...* per una sola causa e un solo risultato. Dirli entrambi nello stesso legame ripete il significato e suona sbagliato.
  fa.a2.unit34.lesson04.teach.excuse_questions:
    title: Chiedere perché
    gloss: perché (domanda), scusa, sei arrivato, non sei venuto, e
    note: '*چرا* chiede una causa. *ببخشید* apre una scusa. *و* unisce due fatti.'
    example_gloss:
    - Perché ieri non sei venuto?
    - Perché sei arrivato in ritardo?
    - Scusa, sono arrivato in ritardo.
    - Ha piovuto e c'era traffico.
  fa.a2.unit34.lesson04.teach.answer_chon:
    title: Rispondere a چرا
    gloss: La risposta a چرا comincia con چون
    note: 'La risposta naturale a *چرا* comincia con *چون* e dà solo la causa: *چون ترافیک بود*. Se vuoi, aggiungi il risultato con una seconda frase.'
  fa.a2.unit34.lesson05.teach.message:
    title: Un messaggio su un appuntamento saltato
    gloss: Ciao Sara. Ieri non sono potuto venire, perché la mia macchina si è guastata. A causa della pioggia c'era anche traffico. Oggi sono malato, quindi ho cambiato il nostro appuntamento.
    note: Leggi una volta per trovare le tre cause, poi di nuovo per vedere cosa ne è seguito.
  fa.a2.unit34.lesson06.teach.dialogue_words:
    title: Parole per la conversazione
    gloss: noi, sì, beh, no, avevamo un appuntamento, vieni, vengo, non vengo
    note: '*آره* è la forma parlata di «sì». *میای؟* chiede «vieni?»; le risposte sono *میام* e *نمیام*.'
    example_gloss:
    - Ieri avevamo un appuntamento.
    - Sì, vengo.
    - Beh, oggi vieni?
    - No, oggi non vengo.
  fa.a2.unit34.lesson06.teach.turn01:
    title: Sara chiede perché
    gloss: 'Sara chiede a Nima: Nima, perché ieri non sei venuto?'
    note: La domanda *چرا* chiede una causa.
  fa.a2.unit34.lesson06.teach.turn02:
    title: Nima dà la causa
    gloss: 'Nima: Perché ha piovuto.'
    note: Una risposta breve a *چرا* comincia con *چون*.
  fa.a2.unit34.lesson06.teach.turn03:
    title: Sara gli ricorda l'impegno
    gloss: 'Sara: Ma avevamo un appuntamento.'
    note: '*قرار داشتیم* significa «avevamo un appuntamento».'
  fa.a2.unit34.lesson06.teach.turn04:
    title: Nima spiega il risultato
    gloss: 'Nima: Sì, ha piovuto e c''era traffico, per questo non sono potuto venire.'
    note: Due cause sono unite con *و*, poi *برای همین* dà il risultato.
  fa.a2.unit34.lesson06.teach.turn05:
    title: Sara chiede di oggi
    gloss: 'Sara: Beh, oggi vieni?'
    note: Una domanda al presente sul programma.
  fa.a2.unit34.lesson06.teach.turn06:
    title: Nima dà una causa al presente
    gloss: 'Nima: No, siccome oggi ho da fare, non vengo.'
    note: Una causa al presente con *چون*, poi il risultato.
