teaching:
  fa.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: mi piace
    gloss: mi piace
    note: دوست دارم significa letteralmente «ho amicizia (con questo)» ed è il modo normale per dire «mi piace».
  fa.a1.unit14.lesson01.teach.ghahve_word:
    title: Caffè
    gloss: caffè
    note: قهوه significa «caffè».
    example_gloss: Mi piace il caffè.
  fa.a1.unit14.lesson01.teach.chay_word:
    title: Tè
    gloss: tè
    note: چای significa «tè».
    example_gloss: Non mi piace il tè.
  fa.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: non mi piace
    gloss: non mi piace
    note: دوست ندارم è la forma negativa di دوست دارم.
  fa.a1.unit14.lesson01.teach.man_word:
    title: io
    gloss: io
    note: 'من significa «io»: spesso è facoltativo perché la desinenza del verbo indica già il soggetto, ma si può aggiungere per dare enfasi.'
    example_gloss: Mi piace la musica.
  fa.a1.unit14.lesson02.teach.kodum_word:
    title: Quale
    gloss: quale
    note: کدوم significa «quale».
    example_gloss: Quale ti piace?
  fa.a1.unit14.lesson02.teach.moosighi_word:
    title: La musica
    gloss: musica
    note: موسیقی significa «musica».
    example_gloss: Mi piace la musica.
  fa.a1.unit14.lesson02.teach.mikhay_word:
    title: Tu vuoi
    gloss: tu vuoi
    note: می‌خوای è la forma colloquiale informale della seconda persona di می‌خواهی («tu vuoi»).
    target_text: می‌خوای (vuoi, informale)
  fa.a1.unit14.lesson02.teach.kodum_ro_question:
    title: Quale ti piace?
    gloss: Quale ti piace?
    note: کدوم رو دوست داری؟ -- رو indica il complemento oggetto (nella lingua formale را), داری è la seconda persona di داشتن («avere»).
  fa.a1.unit14.lesson03.teach.bishtar_word:
    title: Più
    gloss: più
    note: بیشتر significa «di più».
    example_gloss: Mi piace di più il caffè.
  fa.a1.unit14.lesson03.teach.ya_word:
    title: O
    gloss: o
    note: یا significa «o» e si usa per proporre una scelta tra due cose.
    target_text: یا (o)
  fa.a1.unit14.lesson03.teach.ghahve_ya_chay_question:
    title: Caffè o tè?
    gloss: Caffè o tè?
    note: قهوه یا چای؟ propone una scelta tra le due bevande della lezione 1.
  fa.a1.unit14.lesson04.teach.choon_word:
    title: Perché (perché)
    gloss: perché
    note: چون introduce una causa o un motivo.
    target_text: چون (perché)
  fa.a1.unit14.lesson04.teach.khoshmaze_word:
    title: È delizioso
    gloss: è delizioso
    note: خوشمزه‌ست è la contrazione colloquiale di خوشمزه است («è buono, gustoso»).
    example_gloss: Il caffè è buono.
  fa.a1.unit14.lesson04.teach.jaleb_word:
    title: È interessante
    gloss: è interessante
    note: جالبه è la contrazione colloquiale di جالب است («è interessante»).
    example_gloss: Questa musica è interessante.
  fa.a1.unit14.lesson04.teach.va_word:
    title: E
    gloss: e
    note: '*و* significa «e» e può collegare due brevi affermazioni, ad esempio dire che qualcosa piace e descriverlo. È più generico di *چون* (perché), che dà direttamente il motivo.'
    target_text: و (e)
  fa.a1.unit14.lesson05.teach.sara_name:
    title: Sara
    gloss: Sara
    note: Un comune nome femminile iraniano.
    example_gloss: A Sara piace il tè.
  fa.a1.unit14.lesson05.teach.dareh_grammar:
    title: A lui/lei piace
    gloss: gli/le piace
    note: 'داره è la forma colloquiale della terza persona di دارد («ha»): دوست داره significa «le/gli piace», come il modello دوست دارم alla prima persona.'
    target_text: دوست داره (gli/le piace, terza persona colloquiale)
  fa.a1.unit14.lesson05.teach.nadareh_grammar:
    title: A lui/lei non piace
    gloss: non gli/le piace
    note: 'نداره è la forma negativa colloquiale della terza persona: دوست نداره significa «non le/gli piace».'
    target_text: دوست نداره (non gli/le piace, terza persona colloquiale)
  fa.a1.unit14.lesson05.teach.garme_word:
    title: È caldo
    gloss: è caldo
    note: گرمه è la contrazione colloquiale di گرم است («è caldo»).
    example_gloss: Il tè è caldo.
  fa.a1.unit14.lesson05.teach.reading_text:
    title: Testo di esempio sulle preferenze
    gloss: A Sara piace il tè perché è caldo. A Sara non piace la musica.
    note: Un breve racconto in terza persona che riunisce il lessico delle preferenze di questa unità.
  fa.a1.unit14.lesson06.teach.names:
    title: Nima e Sara
    gloss: Nima, Sara
    note: Nomi iraniani comuni usati in tutto il corso.
    example_gloss:
    - A Nima piace il tè.
    - A Sara piace il caffè.
  fa.a1.unit14.lesson06.teach.to_chi_phrase:
    title: E tu?
    gloss: E tu?
    note: تو چی؟ è un modo breve e comune per rigirare la domanda all'altra persona.
  fa.a1.unit14.lesson06.teach.aalie_word:
    title: È ottimo
    gloss: è ottimo
    note: عالیه è la contrazione colloquiale di عالی است («è fantastico»).
    example_gloss: Questo è fantastico.
  fa.a1.unit14.lesson06.teach.dialogue_line1:
    title: Nima chiede
    gloss: 'Tè o caffè: quale Le piace di più?'
  fa.a1.unit14.lesson06.teach.dialogue_line2:
    title: Sara risponde
    gloss: Mi piace di più il caffè perché è delizioso. E Lei?
  fa.a1.unit14.lesson06.teach.dialogue_line3:
    title: Nima risponde
    gloss: A me piace il tè perché è caldo.
  fa.a1.unit14.lesson06.teach.dialogue_line4:
    title: Sara reagisce
    gloss: Ottimo!
