course:
  title: Persiano A1
  description: 'Persiano iraniano per principianti: esprimere ciò che piace e non piace, chiedere preferenze, scegliere tra opzioni, dare semplici motivi e una breve lettura/dialogo sulle preferenze di due persone.'
units:
