    title: Arrabbiato
    gloss: arrabbiato
    note: عصبانی significa «arrabbiato».
    example_gloss: Perché sei arrabbiato/a?
  fa.a1.unit23.lesson03.teach.negaran_word:
    title: Preoccupato
    gloss: preoccupato
    note: نگران significa «preoccupato».
    example_gloss: Sono preoccupato.
  fa.a1.unit23.lesson03.teach.chera_word:
    title: Perché
    gloss: perché (domanda)
    note: '*چرا* significa «perché»; *هستی* è la forma informale di «tu sei» e si contrae in *-ی*: *نگران هستی* diventa *نگرانی*.'
    target_text: چرا (perché)
  fa.a1.unit23.lesson04.teach.kar_kardam_phrase:
    title: Ho lavorato
    gloss: ho lavorato
    note: کار کردم significa letteralmente «lavoro ho fatto».
  fa.a1.unit23.lesson04.teach.tatile_word:
