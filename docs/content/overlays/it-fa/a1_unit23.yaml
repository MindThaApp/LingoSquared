    title: Non sto bene
    gloss: non sto bene
    note: خوب نیستم nega la forma già studiata خوبم (sto bene) usando نیستم, il negativo di هستم.
  fa.a1.unit23.lesson02.teach.goshne_word:
    title: Affamato/a
    gloss: affamato/a
    note: '*گشنه* significa «affamato». È la forma parlata di uso quotidiano di *گرسنه*, che hai visto nell''unità 4.'
    example_gloss: Ho fame.
  fa.a1.unit23.lesson02.teach.yekam_word:
    title: Un po'
    gloss: un po'
    note: یکم attenua un sentimento, come «un po'» in italiano.
    example_gloss: Sono un po' stanco/a.
