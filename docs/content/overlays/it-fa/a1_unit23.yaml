    title: Io sono (forma contratta)
    gloss: sono (forma contratta con un aggettivo)
    note: '*خوشحالم* è *خوشحال* + *هستم* contratto in *-م*. Dopo una *-ه* muta la stessa desinenza si scrive *-ام*, come in *خسته‌ام*.'
    target_text: خوشحالم = خوشحال + هستم (sono contento/a, forma contratta)
  fa.a1.unit23.lesson01.teach.khaste_word:
    title: Stanco
    gloss: stanco
