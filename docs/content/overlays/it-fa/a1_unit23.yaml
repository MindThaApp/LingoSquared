    title: 'Nima: Sara, come stai?'
    gloss: Sara, come stai?
  fa.a1.unit23.lesson06.teach.dialogue_line2:
    title: 'Sara: Sono un po'' stanca...'
    gloss: Oggi sono un po' stanca perché ho lavorato molto. E tu?
  fa.a1.unit23.lesson06.teach.dialogue_line3:
    title: 'Nima: Sono felice...'
    gloss: Sono felice perché oggi è festa.
  fa.a1.unit23.lesson06.teach.dialogue_line4:
    title: 'Sara: Che bello!'
    gloss: Che bello!
