teaching:
  fa.a2.unit46.lesson01.teach.things:
    title: Cose di cui parlare
    gloss: libro, regalo, borsa
    note: '*یه* è il «un / uno / una» della lingua parlata.'
    example_gloss:
    - Ho un libro.
    - Ho un regalo.
    - Ho una borsa.
  fa.a2.unit46.lesson01.teach.verbs:
    title: Verbi al passato
    gloss: ho comprato, ho visto, ho letto, ho preso, (marcatore dell'oggetto)
    note: '*رو* viene dopo ciò su cui ricade l''azione del verbo. Le desinenze del passato sono *-م* (io), *-ی* (tu) e nessuna (lui / lei).'
    example_gloss:
    - Ho comprato il libro.
    - Ho visto il regalo.
    - Ho letto il libro.
    - Ho preso la borsa.
  fa.a2.unit46.lesson01.teach.clitic:
    title: Verbo più ش
    gloss: l'ho comprato, l'ho visto, l'ho letto, l'ho preso
    note: 'La desinenza *-ش* sostituisce la cosa o la persona già nominata: «lo», «la» o «lui / lei». Si aggiunge proprio alla fine del verbo.'
    example_gloss:
    - Ieri l'ho comprato.
    - Ieri l'ho visto.
    - Ieri l'ho letto.
    - Ieri l'ho preso.
  fa.a2.unit46.lesson01.teach.you:
    title: Chiedere «l'hai visto?»
    gloss: hai visto, l'hai visto, hai preso
    note: '*دیدی* significa «hai visto»; aggiungendo *-ش* diventa «l''hai visto».'
    example_gloss:
    - Hai visto il regalo?
    - Dove l'hai visto?
    - Hai preso la borsa?
  fa.a2.unit46.lesson01.teach.rule:
    title: Nominalo una volta, poi usa ش
    gloss: Ho comprato il libro; l'ho comprato
    note: 'La prima volta nomina la cosa, con *رو*. Dopo, togli il nome e *رو* e aggiungi *-ش* al verbo: *کتاب رو خریدم*, poi *خریدمش*.'
  fa.a2.unit46.lesson02.teach.people:
    title: Persone
    gloss: il mio amico, i miei amici, i bambini
    note: '*دوستم* significa «il mio amico» e *دوستام* «i miei amici».'
    example_gloss:
    - Ho visto il mio amico.
    - Ho visto i miei amici.
    - Ho visto i bambini.
  fa.a2.unit46.lesson02.teach.them:
    title: Dire «loro» e «te»
    gloss: li ho visti, ti ho visto
    note: La desinenza *-شون* significa «loro»; *-ت* significa «te / ti». Entrambe si aggiungono al verbo, come *-ش*.
    example_gloss:
    - Ieri li ho visti.
    - Ieri ti ho visto.
  fa.a2.unit46.lesson02.teach.when:
    title: Ieri e dove
    gloss: ieri, dove
    note: '*دیروز* significa «ieri»; *کجا* significa «dove».'
    example_gloss:
    - Ieri ti ho visto.
    - Dove l'hai visto?
  fa.a2.unit46.lesson02.teach.three:
    title: Tre desinenze
    gloss: l'ho visto / l'ho vista; li ho visti; ti ho visto
    note: '*-ش* indica una sola persona o cosa, *-شون* più di una, e *-ت* è «te / ti». Usa *-شون* per più di una persona o cosa.'
  fa.a2.unit46.lesson03.teach.actions:
    title: Dare, restituire, prendere in prestito
    gloss: ho dato, indietro, ho preso in prestito
    note: '*پس دادم* significa «ho restituito»; *قرض گرفتم* significa «ho preso in prestito».'
    example_gloss:
    - Ho dato il libro.
    - Ho restituito il libro.
    - Ho preso in prestito il libro.
  fa.a2.unit46.lesson03.teach.fused:
    title: Preposizione più ش
    gloss: a lui / a lei, da lui / da lei, per lui / per lei, con lui / con lei
    note: 'Nella lingua parlata *به، از، برای، با* si uniscono alla desinenza della persona: *بهش, ازش, براش, باهاش*. Rimandano a una persona già nominata.'
    example_gloss:
    - Gli / le ho dato il libro.
    - L'ho preso in prestito da lui / da lei.
    - Ho comprato il regalo per lui / per lei.
    - Sono andato con lui / con lei.
  fa.a2.unit46.lesson03.teach.me:
    title: A me, per me
    gloss: a me, per me
    note: Con *-م* le stesse parole significano «a me» e «per me».
    example_gloss:
    - Me l'ha dato.
    - Me l'ha comprato.
  fa.a2.unit46.lesson03.teach.names:
    title: Nominare prima la persona
    gloss: Nima, Sara, sono andato
    note: 'Prima nomina la persona, poi rimanda a lei: *از نیما قرض گرفتم*, poi *ازش*.'
    example_gloss:
    - L'ho preso in prestito da Nima.
    - Sono andato con Sara.
  fa.a2.unit46.lesson03.teach.rule:
    title: Preposizioni con clitico
    gloss: Ho preso in prestito da Nima; ho preso in prestito da lui
    note: Sostituisci *از نیما* con *ازش*, *با سارا* con *باهاش*, *برای مینا* con *براش*. La persona è già nota, quindi non serve il nome.
  fa.a2.unit46.lesson04.teach.questions:
    title: Chiedere di qualcosa
    gloss: l'hai comprato, l'hai letto, l'hai preso
    note: 'Per «tu» la desinenza del passato è *-ی*, seguita da *-ش*: *خریدی* diventa *خریدیش*.'
    example_gloss:
    - Hai comprato il regalo?
    - L'hai comprato ieri?
    - L'hai letto ieri?
    - L'hai preso ieri?
  fa.a2.unit46.lesson04.teach.negative:
    title: Dire di no
    gloss: non l'ho visto, non l'ho comprato, non l'ho letto, non l'ho preso
    note: 'Metti *ن* davanti al verbo al passato: *دیدم* diventa *ندیدم*, e *-ش* resta alla fine: *ندیدمش*.'
    example_gloss:
    - Ieri non l'ho visto.
    - Ieri non l'ho comprato.
    - Ieri non l'ho letto.
    - Ieri non l'ho preso.
  fa.a2.unit46.lesson04.teach.answers:
    title: Sì e no
    gloss: sì, no
    note: '*آره* è il «sì» della lingua parlata.'
    example_gloss:
    - Sì, l'ho visto.
    - No, non l'ho visto.
  fa.a2.unit46.lesson04.teach.rule:
    title: Risposte brevi
    gloss: Hai letto il libro? Sì, l'ho letto. No, non l'ho letto.
    note: 'Una risposta breve non ha bisogno del nome. Ripeti il verbo con *-ش*: *آره، خوندمش* oppure *نه، نخوندمش*.'
  fa.a2.unit46.lesson05.teach.words:
    title: Parole per il testo
    gloss: compleanno, era, negozio, in, poi, felice, è diventato, anche, ha dato
    note: '*خوشحال شد* significa «è diventato felice». *هم* significa «anche».'
    example_gloss:
    - Ieri era il compleanno di Nima.
    - Nel negozio ho visto un libro.
    - Poi gli ho dato il libro.
    - È diventato molto felice.
    - Anche Nima mi ha dato una borsa.
  fa.a2.unit46.lesson05.teach.reading:
    title: Il compleanno di Nima
    gloss: Ieri era il compleanno di Nima. Nel negozio ho visto un libro e l'ho comprato. Poi gliel'ho dato. Era molto felice. Anche Nima mi ha dato una borsa.
    note: Leggi una prima volta per capire cosa è successo, poi una seconda per trovare a cosa si riferisce ogni ش.
  fa.a2.unit46.lesson06.teach.turn01:
    title: Sara chiede del libro
    gloss: 'Sara: Nima, hai letto il libro?'
    note: Il nome *کتاب* compare una sola volta, con *رو*.
  fa.a2.unit46.lesson06.teach.turn02:
    title: Nima risponde
    gloss: 'Nima: Sì, l''ho letto. Era molto bello.'
    note: '*خوندمش* si riferisce al libro.'
  fa.a2.unit46.lesson06.teach.turn03:
    title: Sara chiede del regalo
    gloss: 'Sara: Hai comprato il regalo per Mina?'
    note: '*مینا* è un nome; il regalo viene nominato una sola volta.'
  fa.a2.unit46.lesson06.teach.turn04:
    title: Nima risponde
    gloss: 'Nima: Sì, l''ho comprato e ieri gliel''ho dato.'
    note: '*خریدمش* si riferisce al regalo e *بهش* si riferisce a Mina.'
  fa.a2.unit46.lesson06.teach.turn05:
    title: Sara chiede di Mina
    gloss: 'Sara: È stata contenta?'
    note: Il soggetto si capisce dalla conversazione.
  fa.a2.unit46.lesson06.teach.turn06:
    title: Nima risponde
    gloss: 'Nima: Sì, è stata molto contenta.'
    note: Una risposta breve e naturale.
