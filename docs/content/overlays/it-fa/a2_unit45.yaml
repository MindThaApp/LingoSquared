teaching:
  fa.a2.unit45.lesson01.teach.time:
    title: Oggi e il grado
    gloss: oggi, molto, un po'
    note: امروز dice quando; *خیلی* e *یکم* dicono quanto.
    example_gloss:
    - Oggi sono molto felice.
    - Oggi sono un po' stanco/a.
  fa.a2.unit45.lesson01.teach.feel:
    title: I sentimenti
    gloss: sono felice, sono dispiaciuto/a, sono stanco/a, sono arrabbiato/a, sono preoccupato/a
    note: 'La desinenza parlata *-م* significa «io sono»: *خسته‌م* è «sono stanco/a».'
    example_gloss:
    - Oggi sono felice.
    - Oggi sono dispiaciuto/a.
    - Oggi sono stanco/a.
    - Oggi sono arrabbiato/a.
    - Oggi sono preoccupato/a.
  fa.a2.unit45.lesson01.teach.hal:
    title: Come ti senti
    gloss: il mio stato, il tuo stato, è buono, è cattivo, com'è
    note: '*حال* è lo stato in cui ti trovi, quindi *حالم* è «come sto» e *حالت* è «come stai». *حالم خوبه* significa «sto bene»; *حالم بده* significa «sto male».'
    example_gloss:
    - Sto bene.
    - Mi sento male.
    - Come stai?
  fa.a2.unit45.lesson01.teach.shape:
    title: Due modi per dire come stai
    gloss: sono stanco/a; sto male; come stai?
    note: 'Puoi aggiungere *-م* alla parola che indica il sentimento (*خسته‌م*, *نگرانم*), oppure dire *حالم* più *خوبه* o *بده*. Per chiedere, cambia la desinenza: *حالت چطوره؟*'
  fa.a2.unit45.lesson02.teach.care:
    title: Cura e «da»
    gloss: cura, da
    note: '*مراقبت می‌کنم* significa «mi prendo cura di». La persona di cui ti prendi cura viene dopo *از*.'
    example_gloss:
    - Mi prendo cura del mio amico.
  fa.a2.unit45.lesson02.teach.verbs:
    title: Il presente di کردن
    gloss: io faccio, tu fai, lui / lei fa, noi facciamo, voi fate, loro fanno
    note: 'Queste sono le desinenze del presente parlato: *-م, -ی, -ه, -یم, -ین, -ن*.'
    example_gloss:
    - Mi prendo cura.
    - Ti prendi cura.
    - Lui / lei si prende cura.
    - Ci prendiamo cura.
    - Vi prendete cura.
    - Si prendono cura.
  fa.a2.unit45.lesson02.teach.self_sg:
    title: Me stesso/a, te stesso/a, se stesso/a
    gloss: me stesso/a, te stesso/a, se stesso/a
    note: '*خود* significa «sé». Prende le stesse desinenze degli altri nomi: *-م* (mio), *-ت* (tuo), *-ش* (suo).'
    example_gloss:
    - Mi prendo cura di me.
    - Ti prendi cura di te.
    - Lui / lei si prende cura di sé.
  fa.a2.unit45.lesson02.teach.self_pl:
    title: Noi stessi, voi stessi, se stessi
    gloss: noi stessi, voi stessi (o Lei, forma di cortesia), se stessi
    note: Nel parlato le desinenze del plurale sono *-مون, -تون, -شون*. *خودتون* è anche la forma di cortesia per una sola persona.
    example_gloss:
    - Ci prendiamo cura di noi.
    - Vi prendete cura di voi.
    - Si prendono cura di sé.
  fa.a2.unit45.lesson02.teach.careful:
    title: Abbi cura di te
    gloss: attento/a, sii (a un amico), siate (a più persone, o forma di cortesia)
    note: '*مواظب خودت باش* si dice a un amico che parte o che sta male. Per più persone, o per cortesia, si dice *مواظب خودتون باشین*.'
    example_gloss:
    - Abbi cura di te.
    - Abbiate cura di voi.
  fa.a2.unit45.lesson02.teach.agree:
    title: خود concorda con il soggetto
    gloss: mi prendo cura di me; ti prendi cura di te
    note: 'La desinenza di *خود* corrisponde al soggetto, e così il verbo: *من* va con *خودم* e *می‌کنم*; *تو* va con *خودت* e *می‌کنی*; *ما* va con *خودمون* e *می‌کنیم*.'
  fa.a2.unit45.lesson03.teach.when:
    title: Quando lo fai
    gloss: la mattina, di sera / la notte, ogni giorno
    note: La desinenza *-ها* su *صبح* e *شب* dà «la mattina» e «la sera / la notte» come abitudini.
    example_gloss:
    - La mattina faccio la doccia.
    - La sera mi lavo i denti.
    - Ogni giorno faccio sport.
  fa.a2.unit45.lesson03.teach.body:
    title: Lavarsi e pulirsi
    gloss: doccia, lavaggio dei denti, le mie mani, la mia faccia
    note: '*دوش* è la doccia e *مسواک* è lo spazzolino; *دست‌هام* significa «le mie mani» e *صورتم* significa «la mia faccia».'
    example_gloss:
    - Faccio la doccia.
    - Mi lavo i denti.
    - Mi lavo le mani.
    - Mi lavo la faccia.
  fa.a2.unit45.lesson03.teach.verbs:
    title: Verbi della cura di sé
    gloss: faccio (la doccia), mi lavo (i denti), lavo
    note: 'In persiano si usa un verbo diverso per ciascuna azione: *دوش می‌گیرم* (faccio la doccia, letteralmente «prendo»), *مسواک می‌زنم* (mi lavo i denti, letteralmente «colpisco» lo spazzolino), *می‌شورم* (lavo).'
    example_gloss:
    - Faccio la doccia.
    - Mi lavo i denti.
    - Mi lavo la faccia.
  fa.a2.unit45.lesson03.teach.rest:
    title: Sport e riposo
    gloss: attività fisica, riposo, dormo, presto
    note: '*ورزش* e *استراحت* si usano con *می‌کنم*: *ورزش می‌کنم* e *استراحت می‌کنم*.'
    example_gloss:
    - Faccio sport ogni giorno.
    - Mi riposo un po'.
    - Vado a dormire presto.
  fa.a2.unit45.lesson03.teach.light:
    title: Nome più verbo
    gloss: faccio la doccia; mi lavo i denti; faccio attività fisica; mi riposo
    note: La maggior parte delle azioni di cura di sé è formata da un nome più un verbo. Il nome resta invariato; cambia solo il verbo in base alla persona. Il verbo è fisso per ogni nome, quindi impara le coppie intere.
  fa.a2.unit45.lesson03.teach.ask:
    title: Chiedere come
    gloss: Come ti prendi cura di te?
    note: '*چطور* significa «come».'
  fa.a2.unit45.lesson03.teach.phrase:
    title: Prendersi cura di sé
    gloss: Mi prendo cura di me (del mio aspetto e del mio benessere)
    note: '*به خودم می‌رسم* è un''espressione fissa di uso quotidiano per dire che dedichi tempo a prenderti cura di te. Impara­la come un blocco unico.'
  fa.a2.unit45.lesson04.teach.state:
    title: Prepararsi, stancarsi
    gloss: pronto, stanco, (segno dell'oggetto), ho fatto / ho reso
    note: '*آماده کردم* è «ho reso pronto» e *خسته کردم* è «ho reso stanco»; con *خودم رو* diventano «mi sono preparato» e «mi sono stancato». *رو* segna ciò su cui ricade l''azione.'
    example_gloss:
    - Mi sono preparato.
    - Mi sono stancato.
  fa.a2.unit45.lesson04.teach.time:
    title: Questa settimana
    gloss: questo, settimana
    note: '*این هفته* significa «questa settimana».'
    example_gloss:
    - Questa settimana mi sono stancato.
  fa.a2.unit45.lesson04.teach.make:
    title: Preparare la cena
    gloss: cena, preparare, hai fatto
    note: '*درست کردم* significa «ho preparato»: *شام درست کردم* è «ho preparato la cena».'
    example_gloss:
    - Ho preparato la cena da solo.
    - L'hai fatto tu stesso?
  fa.a2.unit45.lesson04.teach.reflexive:
    title: خود come complemento oggetto
    gloss: mi sono preparato; mi sono stancato
    note: 'Quando l''azione ricade su di te, *خود* con la sua desinenza prende *رو* e sta prima del verbo: *خودم رو آماده کردم*. Nel parlato veloce *خودم رو* diventa spesso *خودمو*.'
  fa.a2.unit45.lesson04.teach.emphatic:
    title: خود per enfasi
    gloss: Ho preparato la cena da solo; l'hai preparata tu stesso?
    note: '*خود* prima del verbo, senza *رو*, sottolinea che l''hai fatto tu e non un altro. La frase è costruita esattamente come senza *خودم*.'
  fa.a2.unit45.lesson05.teach.words:
    title: Parole per il testo
    gloss: lavoro, avevo, ero, era, brutto, venerdì, prima, dopo, un / uno, ora (unità di tempo), adesso, e
    note: '*بودم* è «ero» e *بود* è «era»; *داشتم* è «avevo».'
    example_gloss:
    - Questa settimana ho avuto da lavorare.
    - Ero stanco e stavo male.
    - Venerdì per prima cosa ho fatto la doccia.
    - Poi mi sono riposato per un'ora.
    - Ora sono contento.
  fa.a2.unit45.lesson05.teach.reading:
    title: Una settimana e un venerdì
    gloss: Questa settimana ho avuto molto lavoro. Ero stanco e stavo male. Venerdì mi sono preso cura di me. Prima ho fatto la doccia. Poi mi sono riposato per un'ora. Adesso sono contento e sto bene.
    note: Leggi una prima volta per capire le emozioni, poi di nuovo per capire che cosa ha fatto chi parla per stare meglio.
  fa.a2.unit45.lesson06.teach.turn01:
    title: Sara chiede a Nima come sta
    gloss: 'Sara: Nima, come stai?'
    note: '*حالت چطوره؟* serve a chiedere come stai.'
  fa.a2.unit45.lesson06.teach.turn02:
    title: Nima dice di essere stanco
    gloss: 'Nima: Sono molto stanco. Questa settimana mi sono stancato troppo.'
    note: '*خودم رو خسته کردم* mostra la struttura riflessiva.'
  fa.a2.unit45.lesson06.teach.turn03:
    title: Sara dà un consiglio
    gloss: 'Sara: Devi prenderti cura di te.'
    note: '*باید* più *کنی* dice che cosa qualcuno deve fare.'
  fa.a2.unit45.lesson06.teach.turn04:
    title: Nima descrive la sua routine
    gloss: 'Nima: Sì. La mattina faccio la doccia, ma non faccio sport.'
    note: '*ولی* significa «ma»; *نمی‌کنم* è la forma negativa di *می‌کنم*.'
  fa.a2.unit45.lesson06.teach.turn05:
    title: Sara dice di stare attento
    gloss: 'Sara: Abbi cura di te! Riposati un po''.'
    note: '*استراحت کن* è l''imperativo informale: si toglie *می‌* e la desinenza personale.'
  fa.a2.unit45.lesson06.teach.turn06:
    title: Nima è d'accordo
    gloss: 'Nima: Va bene. Stasera vado a dormire presto.'
    note: '*باشه* significa «va bene».'
