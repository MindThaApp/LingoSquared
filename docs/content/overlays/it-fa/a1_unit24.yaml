    title: Guardo / Vedo
    gloss: guardo / vedo
    note: '*می‌بینم* è il presente del verbo di cui hai già visto il passato (*دیدم*, «ho visto»).'
  fa.a1.unit24.lesson03.teach.varzesh_word:
    title: Sport / esercizio fisico
    gloss: sport / esercizio fisico
    note: '*ورزش* indica sia «sport» sia «esercizio fisico» in generale.'
    example_gloss: Faccio sport.
  fa.a1.unit24.lesson03.teach.mikonam_review:
    title: Faccio
    gloss: faccio
    note: '*می‌کنم* è il verbo generico «faccio» usato nei verbi composti come *ورزش می‌کنم* (faccio sport).'
  fa.a1.unit24.lesson03.teach.footbal_word:
    title: Calcio
    gloss: calcio
    note: '*فوتبال* significa «calcio».'
    example_gloss: Mi piace il calcio.
