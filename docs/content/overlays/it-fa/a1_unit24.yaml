course:
  title: Persiano A1
  description: 'Persiano iraniano per principianti: il concetto di hobby/tempo libero, quattro attività quotidiane (leggere, ascoltare musica, guardare film, sport/calcio), parlare della frequenza con cui le si fa, chiedere a qualcuno che cosa fa nel tempo libero, un breve brano di lettura sugli hobby di نیما e un dialogo finale tra نیما e سارا.'
