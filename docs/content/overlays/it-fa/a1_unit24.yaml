    example_gloss: Mi piace guardare film.
  fa.a1.unit24.lesson06.teach.sinama_miram_phrase:
    title: Vado al cinema
    gloss: vado al cinema
    note: '*سینما* è stato visto prima; *می‌رم* (vado) compariva in *می‌رم سر کار* (vado al lavoro).'
  fa.a1.unit24.lesson06.teach.chi_word:
    title: Che cosa
    gloss: che cosa
    note: '*چی* significa «che cosa», già usato così in *تو چی؟* (E tu?) nell''unità 14.'
    example_gloss: E tu?
  fa.a1.unit24.lesson06.teach.va_word:
    title: E
    gloss: e
    note: '*و* significa «e», già usato così nell''unità 14.'
    example_gloss: Mi piace leggere e mi piace il calcio.
