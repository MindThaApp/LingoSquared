    title: Ascolto
    gloss: ascolto
    note: '*گوش می‌دم* significa letteralmente «do orecchio»: è il modo naturale per dire «ascolto» in persiano.'
  fa.a1.unit24.lesson02.teach.film_review:
    title: Film
    gloss: film
    note: '*فیلم* ricompare qui.'
    example_gloss: Guardo film.
