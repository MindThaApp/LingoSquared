    title: 'Lettura: il tempo libero di Nima'
    gloss: A Nima piace leggere libri. Ogni settimana legge alcuni libri. A volte gioca anche a calcio.
    note: '*چند تا* davanti a *کتاب* significa «alcuni libri»; *می‌خونه* e *می‌کنه* sono le forme colloquiali della terza persona, usate per parlare di un''altra persona.'
  fa.a1.unit24.lesson06.teach.sara_review:
    title: Sara
    gloss: Sara
    note: '*سارا*, personaggio presentato già nell''unità 14, ricompare qui.'
