    title: Mi piace...
    gloss: mi piace
    note: '*دوست دارم* funziona allo stesso modo con un''attività come con una cosa: *کتاب خوندن دوست دارم* significa «Mi piace leggere libri».'
  fa.a1.unit24.lesson02.teach.musiqi_review:
    title: La musica
    gloss: musica
    note: '*موسیقی* ricompare qui.'
    example_gloss: Ascolto musica.
