    title: Che bello!
    gloss: che bello!
    note: '*چه خوب!* è stato visto prima: è una reazione positiva molto comune, come «che bello!»'
  fa.a1.unit24.lesson06.teach.dialogue_line1:
    title: 'Nima: Sara, cosa fai nel tempo libero?'
    gloss: Sara, cosa fai nel tempo libero?
  fa.a1.unit24.lesson06.teach.dialogue_line2:
    title: 'Sara: Mi piace guardare film...'
    gloss: Mi piace guardare film. Ogni settimana vado al cinema. E tu?
  fa.a1.unit24.lesson06.teach.dialogue_line3:
    title: 'Nima: Mi piace leggere libri...'
    gloss: Mi piace leggere libri. A volte gioco anche a calcio.
  fa.a1.unit24.lesson06.teach.dialogue_line4:
    title: 'Sara: Che bello!'
    gloss: Che bello!
