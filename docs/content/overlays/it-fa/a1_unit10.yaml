course:
  title: Persiano A1
  description: 'Persiano iraniano per principianti: i giorni della settimana, i nomi dei mesi del calendario solare iraniano, chiedere e dire la data di oggi, chiedere una data futura e fissare la data di un incontro in conversazione.'
