teaching:
  fa.a1.unit10.lesson01.teach.shanbe_yekshanbe:
    title: Sabato, domenica
    gloss: Sabato, domenica
    note: شنبه e یکشنبه sono i primi due giorni della settimana iraniana, che inizia di sabato.
    example_gloss:
    - Oggi è sabato.
    - Domani è domenica.
  fa.a1.unit10.lesson01.teach.doshanbe_seshanbe:
    title: Lunedì, martedì
    gloss: lunedì, martedì
    note: دوشنبه e سه‌شنبه vengono dopo شنبه e یکشنبه.
    example_gloss:
    - Lunedì ho lezione.
    - Martedì ho un appuntamento.
  fa.a1.unit10.lesson01.teach.chaharshanbe_panjshanbe:
    title: Mercoledì, giovedì
    gloss: mercoledì, giovedì
    note: چهارشنبه e پنجشنبه sono i giorni dalla metà alla fine della settimana.
    example_gloss:
    - Il mercoledì lavoro.
    - Ci vediamo giovedì.
  fa.a1.unit10.lesson01.teach.jome:
    title: Venerdì
    gloss: venerdì
    note: جمعه è l'ultimo giorno della settimana e il tradizionale giorno di riposo settimanale in Iran.
    example_gloss: Il venerdì è giorno di riposo.
  fa.a1.unit10.lesson01.teach.weekend_note:
    title: Il giorno di riposo settimanale
    gloss: Il venerdì è il giorno libero della settimana.
    note: جمعه (venerdì) è il tradizionale giorno di riposo settimanale in Iran, anche se oggi alcuni luoghi di lavoro moderni chiudono anche il giovedì pomeriggio.
  fa.a1.unit10.lesson02.teach.farvardin:
    title: Farvardin (1º mese)
    gloss: Farvardin, il primo mese dell'anno solare iraniano
    note: فروردین apre l'anno solare iraniano, più o meno a fine marzo (intorno all'equinozio di primavera e al Nowruz).
    example_gloss: Farvardin è il primo mese dell'anno.
  fa.a1.unit10.lesson02.teach.ordibehesht:
    title: Ordibehesht (2º mese)
    gloss: Ordibehesht, il secondo mese
    note: اردیبهشت viene dopo فروردین, più o meno tra aprile e maggio.
    example_gloss: In Ordibehesht il tempo è bello.
  fa.a1.unit10.lesson02.teach.khordad:
    title: Khordad (3º mese)
    gloss: Khordad, il terzo mese
    note: خرداد viene dopo اردیبهشت, più o meno tra maggio e giugno.
    example_gloss: Sono nato/a in Khordad.
  fa.a1.unit10.lesson02.teach.calendar_note:
    title: Il calendario solare iraniano
    gloss: L'Iran usa il calendario solare hijri (persiano).
    note: '*ایران از تقویم هجری شمسی استفاده می‌کنه* afferma che l''Iran usa questo calendario per le date di tutti i giorni: è lo stesso sistema usato in Afghanistan, ma con nomi dei mesi di origine persiana invece di quelli di origine araba usati in Afghanistan.'
  fa.a1.unit10.lesson03.teach.what_day_today:
    title: Che giorno è oggi?
    gloss: Che giorno della settimana è oggi?
    note: 'امروز چندشنبه‌ست؟ chiede letteralmente «oggi, che giorno della settimana è?»: è la contrazione colloquiale in -e di چندشنبه است.'
  fa.a1.unit10.lesson03.teach.today_word:
    title: Oggi
    gloss: oggi
    note: امروز significa «oggi».
    example_gloss: Che data è oggi?
  fa.a1.unit10.lesson04.teach.give_full_date:
    title: Oggi è giovedì, 10 Ordibehesht.
    gloss: Oggi è giovedì, 10 Ordibehesht.
    note: امروز پنجشنبه، دهم اردیبهشته riunisce in una frase il giorno della settimana, la data in numero ordinale e il mese, con la contrazione colloquiale in -e (اردیبهشته = اردیبهشت است).
  fa.a1.unit10.lesson04.teach.tarikh_word:
    title: Data
    gloss: data
    note: '*تاریخ* significa «data»: la parola generale per una data del calendario, come in *تاریخ جلسه* (la data della riunione).'
    example_gloss: Qual è la data di oggi?
  fa.a1.unit10.lesson05.teach.which_day_meeting:
    title: Che giorno è la riunione?
    gloss: Che giorno è la riunione?
    note: جلسه کدوم روزه؟ chiede in quale giorno della settimana si terrà un evento.
  fa.a1.unit10.lesson05.teach.which_date:
    title: Che data è martedì in Ordibehesht?
    gloss: Che data è martedì in Ordibehesht?
    note: سه‌شنبه چندم اردیبهشته؟ chiede la data numerica precisa di un giorno indicato.
  fa.a1.unit10.lesson06.teach.hashtom:
    title: 8º
    gloss: 8º
    note: '*هشتم* significa «l''8 (del mese)».'
    example_gloss: Oggi è l'8.
  fa.a1.unit10.lesson06.teach.turn01:
    title: Reza, che giorno è la riunione?
    gloss: Reza, che giorno è la riunione?
    note: Maryam apre chiedendo direttamente a Reza, chiamandolo per nome.
  fa.a1.unit10.lesson06.teach.turn02:
    title: Credo martedì.
    gloss: Credo martedì.
    note: فکر کنم («credo») attenua la risposta di Reza, che non è del tutto sicuro.
  fa.a1.unit10.lesson06.teach.turn03:
    title: Che data è martedì in Ordibehesht?
    gloss: Che data è martedì in Ordibehesht?
    note: Maryam prosegue chiedendo la data numerica precisa.
  fa.a1.unit10.lesson06.teach.turn04:
    title: Martedì è l'8 Ordibehesht.
    gloss: Martedì è l'8 Ordibehesht.
    note: Reza dà la data precisa.
  fa.a1.unit10.lesson06.teach.turn05:
    title: Va bene, ottimo. Venerdì invece, hai tempo?
    gloss: Va bene, ottimo. Venerdì invece, hai tempo?
    note: Maryam conferma la data e poi chiede di un altro giorno.
  fa.a1.unit10.lesson06.teach.turn06:
    title: No, venerdì sono occupato.
    gloss: No, venerdì sono occupato.
    note: سرم شلوغه (letteralmente «la mia testa è affollata») è il modo colloquiale più naturale in Iran per dire che si è occupati.
  fa.a1.unit10.lesson06.teach.turn07:
    title: Nessun problema, ci vediamo martedì.
    gloss: Nessun problema, ci vediamo martedì.
    note: مشکلی نیست («nessun problema») accetta con cortesia il rifiuto di Reza, e می‌بینمت significa «ci vediamo», confermando martedì come giorno dell'incontro, in coerenza con le battute 02 e 04.
  fa.a1.unit10.lesson06.teach.va_and:
    title: E
    gloss: e
    note: '*و* significa «e». Può unire due giorni, come in *دوشنبه و سه‌شنبه*, o due domande collegate, come in *جلسه کدوم روزه و چندم اردیبهشته؟*'
    example_gloss: Il lunedì e il martedì ho lezione.
