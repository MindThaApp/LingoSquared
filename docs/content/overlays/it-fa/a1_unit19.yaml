teaching:
  fa.a1.unit19.lesson01.teach.khoone_word:
    title: Casa
    gloss: casa
    note: خونه significa casa (forma colloquiale di خانه).
    example_gloss: La mia casa è grande.
  fa.a1.unit19.lesson01.teach.otagh_khab_word:
    title: Camera da letto
    gloss: camera da letto
    note: اتاق خواب significa letteralmente «stanza del sonno», cioè camera da letto.
    example_gloss: Ha due camere da letto.
  fa.a1.unit19.lesson01.teach.ashpazkhone_word:
    title: Cucina
    gloss: cucina
    note: آشپزخانه significa cucina.
    example_gloss: La cucina è grande.
  fa.a1.unit19.lesson01.teach.hamoom_word:
    title: Bagno
    gloss: bagno
    note: حموم significa bagno (forma colloquiale di حمام).
    example_gloss: Il bagno è pulito.
  fa.a1.unit19.lesson02.teach.chand_ta_word:
    title: Quanti
    gloss: quanti
    note: چند تا significa «quanti/quante» e si usa con i nomi numerabili.
    target_text: چند تا (quanti)
  fa.a1.unit19.lesson02.teach.do_ta_word:
    title: Due
    gloss: due
    note: دو تا significa «due» (di cose numerabili).
    example_gloss: Ha due bagni.
  fa.a1.unit19.lesson02.teach.dare_word:
    title: Ha
    gloss: ha
    note: داره è la contrazione colloquiale di دارد (ha), usata per descrivere ciò che c'è in una casa.
    target_text: داره (ha, colloquiale)
  fa.a1.unit19.lesson03.teach.takht_word:
    title: Letto
    gloss: letto
    note: تخت significa letto.
    example_gloss: Il letto è in camera da letto.
  fa.a1.unit19.lesson03.teach.miz_word:
    title: Tavolo
    gloss: tavolo
    note: میز significa tavolo.
    example_gloss: Il tavolo è accanto alla finestra.
  fa.a1.unit19.lesson03.teach.sandali_word:
    title: Sedia
    gloss: sedia
    note: صندلی significa sedia.
    example_gloss: C'è una sedia accanto al tavolo.
  fa.a1.unit19.lesson03.teach.ye_word:
    title: Un/uno/una
    gloss: un / uno
    note: یه è la contrazione colloquiale di یک (un/uno/una).
    target_text: یه (un/uno, colloquiale)
  fa.a1.unit19.lesson03.teach.va_word:
    title: E
    gloss: e
    note: و significa «e» e unisce due frasi o due elementi.
    target_text: و (e)
  fa.a1.unit19.lesson04.teach.too_word:
    title: In / dentro
    gloss: in / dentro
    note: تو significa «in/dentro» e indica un luogo all'interno di una stanza.
    target_text: تو (in/dentro)
  fa.a1.unit19.lesson04.teach.kenar_word:
    title: Accanto a
    gloss: accanto a
    note: کنار significa «accanto a».
    target_text: کنار (accanto a)
  fa.a1.unit19.lesson04.teach.balaye_word:
    title: Sopra
    gloss: sopra / in cima a
    note: بالای significa «sopra/in cima a».
    target_text: بالای (sopra)
  fa.a1.unit19.lesson04.teach.takhte_word:
    title: È il letto
    gloss: è il letto
    note: '*تخته* è *تخت* (letto) più la -e colloquiale per «è» (da *است*). In *میز کنار تخته* la -e finale rende la frase completa: il tavolo [è] accanto al letto.'
    target_text: تخته (è il letto, colloquiale)
  fa.a1.unit19.lesson04.teach.ashpazkhones_word:
    title: È la cucina
    gloss: è la cucina
    note: '*آشپزخانه‌س* è *آشپزخانه* (cucina) più il «è» colloquiale dopo vocale (da *است*). In *صندلی تو آشپزخانه‌س* chiude la frase: la sedia [è] in cucina.'
    target_text: آشپزخانه‌س (è la cucina, colloquiale)
  fa.a1.unit19.lesson05.teach.ham_word:
    title: Anche
    gloss: anche
    note: هم significa «anche» e si mette dopo la parola a cui si riferisce.
    target_text: هم (anche)
  fa.a1.unit19.lesson05.teach.man_word:
    title: io
    gloss: io
    note: من significa «io».
    example_gloss: La mia casa ha due camere da letto.
  fa.a1.unit19.lesson05.teach.khoonye_word:
    title: Casa di / casa mia
    gloss: casa di / casa mia
    note: خونه‌ی è la forma con ezafe di خونه, usata davanti al possessore (خونه‌ی من = casa mia).
    target_text: خونه‌ی (casa di / casa mia, forma con ezafe)
  fa.a1.unit19.lesson05.teach.reading_text:
    title: Esempio di descrizione di una casa
    gloss: La mia casa ha due camere da letto. Ha anche una cucina e un bagno.
    note: Una breve descrizione in prima persona che combina il lessico della casa di questa unità.
  fa.a1.unit19.lesson06.teach.names:
    title: Nima e Sara
    gloss: Nima, Sara
    note: Nomi iraniani comuni usati in tutto il corso.
    example_gloss:
    - La casa di Nima è grande.
    - La casa di Sara è piccola.
  fa.a1.unit19.lesson06.teach.khoonet_chetore_phrase:
    title: Com'è la tua casa?
    gloss: Com'è la tua casa?
    note: خونه‌ت چطوره؟ unisce خونه‌ت (la tua casa) e چطوره؟ (com'è?).
  fa.a1.unit19.lesson06.teach.khoobe_word:
    title: È buona
    gloss: è buono/a
    note: خوبه è la contrazione colloquiale di خوب است (è buono/a).
    example_gloss: Questa casa è bella.
  fa.a1.unit19.lesson06.teach.aare_word:
    title: Sì
    gloss: sì
    note: آره è la forma colloquiale di بله («sì»).
    example_gloss: Sì, è bella.
  fa.a1.unit19.lesson06.teach.dialogue_line1:
    title: Nima chiede
    gloss: Com'è la tua casa?
  fa.a1.unit19.lesson06.teach.dialogue_line2:
    title: Sara risponde
    gloss: È bella. Ha due camere da letto e una cucina.
  fa.a1.unit19.lesson06.teach.dialogue_line3:
    title: Nima chiede
    gloss: Ha anche un bagno?
  fa.a1.unit19.lesson06.teach.dialogue_line4:
    title: Sara risponde
    gloss: Sì, ha anche un bagno.
