course:
  title: Persiano A1
  description: 'Persiano iraniano per principianti: nominare gli sport (calcio, basket, pallavolo, nuoto), chiedere «Che sport ti piace?», dire dove pratichi uno sport (palestra, piscina, parco), parlare di quanto spesso (ogni giorno, ogni settimana, qualche volta, N volte), un breve brano sulla routine sportiva di نیما e un dialogo finale tra نیما e سارا che confrontano quali sport praticano, quanto spesso e dove.'
