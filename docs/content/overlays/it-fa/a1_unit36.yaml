teaching:
  fa.a1.unit36.lesson01.teach.mehrabun:
    title: Simpatico
    gloss: gentile / affettuoso/a
    note: '*مهربون* descrive una persona gentile o dal cuore buono.'
    example_gloss: Sara è molto gentile.
  fa.a1.unit36.lesson01.teach.bamaze:
    title: Divertente
    gloss: divertente
    note: '*بامزه* descrive una persona divertente o simpatica.'
    example_gloss: Nima è simpatico.
  fa.a1.unit36.lesson01.teach.khejalati:
    title: Timido
    gloss: timido
    note: '*خجالتی* descrive una persona timida.'
    example_gloss: È un po' timido/a.
  fa.a1.unit36.lesson01.teach.jeddi:
    title: Serio
    gloss: serio/a
    note: '*جدی* descrive una persona seria.'
    example_gloss: Il nostro insegnante è serio.
  fa.a1.unit36.lesson01.teach.review_copula_fusion:
    title: Come si unisce il «è» fuso alle parole sul carattere
    gloss: è gentile / simpatico/a / timido/a (copula fusa)
    note: '*مهربونه* unisce direttamente *مهربون* + *است*, perché *مهربون* termina con una consonante. *بامزه‌ست* usa uno ZWNJ scritto prima di *ست*, perché *بامزه* termina già con la vocale *ه*. *خجالتیه* aggiunge *ه* direttamente a una parola che termina in *ی*, lo stesso schema di *قهوه‌ایه* dell''unità sull''aspetto.'
    target_text: مهربونه = مهربون + است (forma fusa di «è», dopo consonante) / بامزه‌ست = بامزه + است (dopo vocale, con ZWNJ) / خجالتیه = خجالتی + ه (dopo ی)
  fa.a1.unit36.lesson02.teach.zerang:
    title: Intelligente
    gloss: sveglio/a / furbo/a
    note: '*زرنگ* descrive una persona intelligente, in particolare sveglia e piena di risorse nelle cose pratiche.'
    example_gloss: Maryam è molto sveglia.
  fa.a1.unit36.lesson02.teach.tanbal:
    title: Pigro
    gloss: pigro
    note: '*تنبل* descrive una persona pigra.'
    example_gloss: Oggi sono un po' pigro/a.
  fa.a1.unit36.lesson02.teach.zahmatkesh:
    title: Laborioso
    gloss: laborioso
    note: '*زحمت‌کش* descrive una persona che lavora sodo e si impegna davvero.'
    example_gloss: Mio padre è molto laborioso.
  fa.a1.unit36.lesson02.teach.sabur:
    title: Paziente
    gloss: paziente
    note: '*صبور* descrive una persona paziente.'
    example_gloss: La nostra insegnante è molto paziente.
  fa.a1.unit36.lesson02.teach.review_negation:
    title: Negare un tratto del carattere
    gloss: non è pigro/a
    note: '*نیست* nega la copula unita: *تنبل نیست* significa «non è pigro/a», lo stesso *نیست* già visto per negare i sentimenti.'
    target_text: تنبل نیست (non è pigro/pigra) -- نیست nega la copula fusa
  fa.a1.unit36.lesson03.teach.shakhsiat_word:
    title: Personalità
    gloss: carattere
    note: '*شخصیت* significa «personalità» o «carattere».'
    example_gloss: Ha un carattere molto buono.
  fa.a1.unit36.lesson03.teach.ask_shakhsiat:
    title: Che carattere ha?
    gloss: Che carattere ha?
    note: '*چطوره؟* («com''è...?») è già stato presentato nell''unità sui saluti; *ش* è il suffisso possessivo «suo/sua», attaccato a *شخصیت* («personalità»).'
  fa.a1.unit36.lesson03.teach.answer_mehrabun_zerang:
    title: È molto gentile e sveglio/a
    gloss: È molto gentile e sveglio/a
    note: '*و* significa «e» e unisce due parole che descrivono la personalità.'
  fa.a1.unit36.lesson03.teach.che_joriye:
    title: Com'è?
    gloss: Com'è?
    note: '*چه جوریه؟* è un modo informale e molto comune per chiedere «com''è (di carattere)?», alternativo a *شخصیتش چطوره؟*.'
  fa.a1.unit36.lesson03.teach.review_shakhsiat_words:
    title: Personalità / com'è...? / che tipo è...?
    gloss: carattere / come è...? / com'è...?
    note: Queste tre espressioni ti permettono di chiedere e di dire com'è una persona.
    target_text: شخصیت (personalità) / چطوره؟ (com'è?) / چه جوریه؟ (che tipo è?)
  fa.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Nima / Sara / Maryam / per niente / solo / simpatico
    gloss: Nima / Sara / Maryam / per niente / solo / simpatico
    note: '*مریم* è l''amica di *سارا*, già presentata nell''unità sull''aspetto fisico. *اصلاً* significa «per niente». *فقط* significa «solo». *باحال* significa «simpatico/forte».'
  fa.a1.unit36.lesson04.teach.get_to_know:
    title: Mi piacerebbe conoscerla meglio
    gloss: Mi piacerebbe conoscerla meglio
    note: '*بیشتر* significa «di più». *باهاش* significa «con lui/lei». *آشنا بشم* significa «che io faccia conoscenza / che io arrivi a conoscere».'
  fa.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Nima: Sara, com''è Maryam?'
    gloss: Sara, com'è Maryam?
  fa.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Sara: È molto gentile e sveglia.'
    gloss: È molto gentile e sveglia.
  fa.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Nima: Non è pigra?'
    gloss: Non è pigra?
  fa.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Sara: No, per niente, anzi è molto laboriosa. È solo un po'' timida.'
    gloss: No, per niente, anzi è molto laboriosa. È solo un po' timida.
  fa.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Nima: Che bello, mi piacerebbe conoscerla meglio.'
    gloss: Che bello, mi piacerebbe conoscerla meglio.
  fa.a1.unit36.lesson05.teach.reading_text:
    title: 'Lettura: il carattere di Maryam'
    gloss: Maryam è un'amica di Sara. È molto gentile e sveglia. Anche nel lavoro è laboriosa e non è mai pigra. È solo un po' timida, per questo nei grandi gruppi non parla molto.
    note: La lettura descrive il carattere di Maryam in terza persona, con gli stessi tratti usati nel dialogo.
  fa.a1.unit36.lesson05.teach.reading_note:
    title: Mai (con un verbo negativo)
    gloss: mai
    note: '*هیچ‌وقت* si usa con un verbo negativo (*نیست*, *نمی‌زنه*) e significa «mai». In italiano succede lo stesso con «non... mai»: la negazione si ripete.'
  fa.a1.unit36.lesson06.teach.self_description:
    title: Penso di essere molto laborioso/a, ma sono anche un po' pigro/a
    gloss: Penso di essere molto laborioso/a, ma sono anche un po' pigro/a
    note: '*فکر می‌کنم* significa «penso». *زحمت‌کشم* unisce *زحمت‌کش* + *هستم* («sono»). *هستم* è la forma piena, non unita, di «sono», usata qui dopo *هم* («anche») per dare enfasi.'
  fa.a1.unit36.lesson06.teach.friend_request:
    title: Che carattere hai?
    gloss: Che carattere hai?
    note: '*شخصیتت* aggiunge a *شخصیت* il suffisso possessivo informale *ت* («tuo»): è la versione del registro *تو* di *شخصیتش*.'
  fa.a1.unit36.lesson06.teach.review_trait_words:
    title: Gentile / simpatico / timido / serio / sveglio / pigro / laborioso / paziente
    gloss: gentile / simpatico / timido / serio / sveglio / pigro / laborioso / paziente
    note: Queste sono le otto parole fondamentali sul carattere di questa unità.
