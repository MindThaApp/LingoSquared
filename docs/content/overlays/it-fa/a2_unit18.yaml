course:
  title: Persiano A2
  description: 'Farsi iraniano di livello pre-intermedio: restituire un acquisto difettoso, cioè spiegare qual è il problema, leggere l''avviso sulla politica dei resi di un negozio e scegliere tra cambio e rimborso.'
units:
  fa.a2.unit18.shopping_complaint:
    title: Un reclamo in negozio
lessons:
  fa.a2.unit18.lesson01.shopping_complaint_vocabulary:
    title: 'Restituire un articolo: parole'
  fa.a2.unit18.lesson02.explaining_the_problem:
    title: Spiegare il problema
  fa.a2.unit18.lesson03.reading_a_return_policy:
