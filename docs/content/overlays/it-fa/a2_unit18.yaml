teaching:
  fa.a2.unit18.lesson01.teach.broken_word:
    title: Rotto
    gloss: rotto
    note: '*خراب* è la parola generica per «rotto» o «difettoso»; *خرابه* è la sua forma colloquiale parlata (*خراب* + *است*).'
    example_gloss: Queste cuffie sono rotte.
  fa.a2.unit18.lesson01.teach.receipt_word:
    title: Ricevuta
    gloss: scontrino
    note: '*رسید* è la parola per lo scontrino di un acquisto.'
    example_gloss: Ho perso lo scontrino.
  fa.a2.unit18.lesson01.teach.return_item_note:
    title: Restituire un articolo (verbo leggero)
    gloss: restituire (un articolo)
    note: '*پس دادن* significa letteralmente «dare indietro»: un''altra costruzione con verbo leggero, come *باز کردن* nell''unità precedente sulla banca.'
  fa.a2.unit18.lesson01.teach.exchange_word:
    title: Cambio
    gloss: cambio
    note: '*تعویض* è la parola per «cambio, sostituzione»; *تعویض کردن* (cambiare, sostituire) è la forma con verbo leggero.'
    example_gloss: Voglio cambiare questo articolo.
  fa.a2.unit18.lesson01.teach.refund_word:
    title: Rimborso
    gloss: rimborso
    note: '*بازپرداخت* è la parola standard per il rimborso di denaro.'
    example_gloss: Il rimborso richiede due giorni.
  fa.a2.unit18.lesson01.teach.deadline_word:
    title: Scadenza / termine
    gloss: scadenza / termine
    note: '*مهلت* è la parola generica per una scadenza o un periodo di tempo concesso.'
    example_gloss: Il termine per il reso è di sette giorni.
  fa.a2.unit18.lesson01.teach.recap_headphones:
    title: Ho comprato queste cuffie
    gloss: Ho comprato queste cuffie
    note: Frase di riepilogo che introduce *هدفون* (cuffie), l'articolo attorno a cui è costruita la situazione di questa unità.
  fa.a2.unit18.lesson02.teach.no_sound_word:
    title: Non ha audio
    gloss: non ha audio
    note: '*صدا نداره* (letteralmente «suono non ha») descrive un dispositivo che non emette alcun suono.'
    example_gloss: Queste cuffie non hanno audio.
  fa.a2.unit18.lesson02.teach.i_want_to_exchange_or_refund:
    title: Voglio cambiarle o riavere i miei soldi
    gloss: Voglio cambiare queste cuffie o riavere i miei soldi.
    note: '*یا* (o) lascia al negozio la scelta tra le due soluzioni che questa richiesta prevede.'
  fa.a2.unit18.lesson02.teach.full_complaint_sentence:
    title: Esporre il problema e la richiesta insieme
    gloss: Ho comprato queste cuffie ma non hanno audio. Voglio cambiarle o riavere i miei soldi.
    note: 'Lo schema completo del reclamo su cui è costruita questa lezione: prima il problema, poi la richiesta.'
  fa.a2.unit18.lesson03.teach.purchase_date_word:
    title: Data di acquisto
    gloss: data di acquisto
    note: '*تاریخ خرید* è l''espressione standard per la data in cui si è comprato qualcosa.'
    example_gloss: La data di acquisto è sullo scontrino.
  fa.a2.unit18.lesson03.teach.policy_notice_text:
    title: L'avviso sui resi di un negozio
    gloss: 'Termine per il reso della merce: sette giorni dalla data di acquisto, con lo scontrino.'
    note: Un breve avviso ufficiale di un negozio, il registro scritto che questa lezione insegna.
  fa.a2.unit18.lesson04.teach.please_word:
    title: Per favore
    gloss: per favore
    note: '*لطفاً* è una parola di cortesia che si mette alla fine di una richiesta.'
    example_gloss: Lo cambi, per favore.
  fa.a2.unit18.lesson04.teach.turn01:
    title: نیما espone il problema
    gloss: نیما dice con gentilezza che ha comprato queste cuffie ma non hanno audio.
    note: Combina la frase di riepilogo della lezione 1 con *صدا نداره* della lezione 2.
  fa.a2.unit18.lesson04.teach.turn02:
    title: فروشنده chiede lo scontrino e la data
    gloss: Il commesso gli chiede se ha lo scontrino e in che giorno l'ha comprato.
    note: '*خریدینش* è la forma parlata e cortese di «lo ha comprato» (in forma scritta *خریدید*, più il pronome *-ش* per «lo»).'
  fa.a2.unit18.lesson04.teach.turn03:
    title: نیما conferma e dice la data
    gloss: 'نیما dice di sì, ecco lo scontrino: le ha comprate tre giorni fa.'
    note: '*بفرمایید* qui significa «prego, tenga» mentre si porge qualcosa.'
  fa.a2.unit18.lesson04.teach.turn04:
    title: فروشنده conferma che è nei termini e propone una scelta
    gloss: Il commesso dice che non c'è problema, è entro il termine di sette giorni, e chiede se vuole il cambio o il rimborso.
    note: '*تو مهلت هفت روزه هستید* (è entro il termine di sette giorni) conferma che ne ha diritto.'
  fa.a2.unit18.lesson04.teach.turn05:
    title: نیما chiede il cambio
    gloss: نیما chiede con gentilezza il cambio.
    note: '*کنید* è la forma imperativa di cortesia di *کردن* (fare).'
  fa.a2.unit18.lesson04.teach.turn06:
    title: فروشنده completa il cambio
    gloss: Il commesso dice va bene, gli dà subito un paio di cuffie nuove.
    note: '*بهتون می‌دم* (le do a Lei) conclude il cambio.'
