teaching:
  fa.a2.unit40.lesson01.teach.things:
    title: Cose di tutti i giorni
    gloss: libro, borsa, chiave, telefono, orologio
    note: '*ساعت* significa sia «orologio» sia «ora» (nel dire l''ora); è la frase a chiarire quale dei due.'
    example_gloss:
    - Ho un libro.
    - Ho una borsa.
    - Ho una chiave.
    - Ho un telefono.
    - Ho un orologio.
  fa.a2.unit40.lesson01.teach.verbs:
    title: Comprato, perso, trovato
    gloss: ho comprato, ho perso, ho trovato
    note: 'Tutti e tre sono al passato semplice, prima persona singolare. *گم کردم* e *پیدا کردم* sono verbi composti da due parole: prima viene il nome.'
    example_gloss:
    - Ieri ho comprato un libro.
    - Ieri ho perso una chiave.
    - Ieri ho trovato un telefono.
  fa.a2.unit40.lesson01.teach.rel1:
    title: 'Nome + ی + که: «il/la ... che ...»'
    gloss: il libro che ho comprato; la borsa che ho perso; la chiave che ho trovato
    note: 'Per dire a quale cosa ti riferisci, aggiungi *ی* al nome, poi *که* e una breve frase: *کتاب* + *ی* + *که خریدم*. Tutto il gruppo funziona come un unico nome. A differenza dell''italiano, in alcuni casi, nella frase non si aggiunge nessun pronome che riprenda il nome: si dice *کتابی که خریدم*, mai «il libro che lo ho comprato».'
  fa.a2.unit40.lesson01.teach.rel2:
    title: Il gruppo è il soggetto della frase
    gloss: Il libro che ho comprato è bello; la borsa che ho perso era piccola
    note: 'Il gruppo *کتابی که خریدم* può stare all''inizio della frase come un qualsiasi nome; poi seguono il verbo o l''aggettivo: *کتابی که خریدم خوبه*.'
  fa.a2.unit40.lesson02.teach.people:
    title: Persone al lavoro
    gloss: collega, direttore, cliente, uomo, signora
    note: '*همکارم* significa «il mio collega / la mia collega». *خانم* è anche il titolo di cortesia «signora».'
    example_gloss:
    - Il mio collega è qui.
    - Il direttore è laggiù.
    - Il cliente è qui.
    - Quell'uomo è laggiù.
    - Quella signora è qui.
  fa.a2.unit40.lesson02.teach.verbs:
    title: Lavora, è seduto, ha telefonato
    gloss: lui/lei lavora, è seduto/a, ha telefonato
    note: '*نشسته* significa «è seduto/a» (uno stato). *زنگ زد* significa «ha telefonato».'
    example_gloss:
    - Il mio collega lavora in banca.
    - Il direttore è seduto laggiù.
    - Il cliente ha telefonato ieri.
  fa.a2.unit40.lesson02.teach.rel_subject:
    title: 'Chi: lo stesso schema per le persone'
    gloss: l'uomo che è seduto là; il collega che lavora in banca; il cliente che ha telefonato
    note: Per le persone il persiano usa lo stesso *که* delle cose; non esiste una parola separata per «chi». La persona è chi compie l'azione del verbo nella frase.
  fa.a2.unit40.lesson02.teach.rel_spelling:
    title: Come si scrive la ی dopo ه e ی
    gloss: 'dopo una consonante: ی; dopo una ه muta o una ی finale: ‌ای'
    note: 'Dopo una consonante la terminazione è *ی* (*کتابی*). Dopo una *ه* muta o dopo una *ی* si scrive *ای* con un piccolo spazio: *خونه‌ای*, *مشتری‌ای*. Nella pronuncia si sente sempre lo stesso suono «i».'
  fa.a2.unit40.lesson03.teach.which:
    title: Quale, quello, proprio quello
    gloss: quale, quello, proprio quello
    note: '*کدوم؟* significa «quale?». *اون* indica qualcosa; *همون* significa «proprio quello».'
    example_gloss:
    - Quale libro?
    - Quel libro è bello.
    - Proprio quel libro è qui.
  fa.a2.unit40.lesson03.teach.answer:
    title: Rispondere a «quale?» con un gruppo relativo
    gloss: Quale borsa? La borsa che ho perso.
    note: 'La risposta più semplice a *کدوم؟* è un gruppo relativo. Puoi aggiungere davanti *اون* o *همون*: *همون کیفی که گم کردم* (proprio la borsa che ho perso).'
  fa.a2.unit40.lesson03.teach.time:
    title: Più parole dentro il gruppo
    gloss: il libro che ho comprato ieri; l'orologio che ho trovato oggi
    note: 'La frase relativa può contenere altre parole (un''indicazione di tempo, un luogo) prima del verbo. Il verbo resta sempre alla fine: *کتابی که دیروز خریدم*.'
  fa.a2.unit40.lesson04.teach.lost_things:
    title: Cose che si perdono
    gloss: occhiali, portafoglio, colore
    note: '*کیف پول* significa «portafoglio»: *کیف* (borsa) + *پول* (denaro).'
    example_gloss:
    - I miei occhiali sono qui.
    - Il mio portafoglio è laggiù.
    - Questo colore è bello.
  fa.a2.unit40.lesson04.teach.colours:
    title: I colori e «di che colore?»
    gloss: nero, rosso, blu, che/quale
    note: '*چه رنگیه؟* significa «di che colore è?».'
    example_gloss:
    - La mia borsa è nera.
    - I miei occhiali sono rossi.
    - Il mio telefono è blu.
    - Di che colore è la tua borsa?
  fa.a2.unit40.lesson04.teach.describe:
    title: Descrivere ciò che hai perso
    gloss: Di che colore è la borsa che ha perso? La borsa che ho perso è nera.
    note: 'All''ufficio oggetti smarriti l''impiegato chiede dell''oggetto con un gruppo relativo e tu rispondi con un altro gruppo o solo con il colore: *سیاهه*. L''impiegato usa *شما* (*گم کردید*).'
  fa.a2.unit40.lesson05.teach.reading:
    title: Una borsa smarrita
    gloss: 'Ieri Sara ha perso la borsa. La borsa che ha perso era nera. Nella borsa c''erano un telefono e una chiave. Oggi Sara è andata all''ufficio oggetti smarriti. L''impiegato che lavora lì ha detto: «La borsa che abbiamo trovato è nera». Sara era contenta.'
    note: Leggi una prima volta per capire cosa è successo, poi di nuovo per osservare i gruppi con *که*.
  fa.a2.unit40.lesson06.teach.turn01:
    title: Nima denuncia lo smarrimento di una borsa
    gloss: 'Nima: Scusi, ho perso una borsa.'
    note: '*گم کردم* significa «ho perso».'
  fa.a2.unit40.lesson06.teach.turn02:
    title: L'impiegato chiede una descrizione
    gloss: 'Impiegato: Di che colore è la borsa che ha perso?'
    note: 'L''impiegato usa *شما*: *گم کردید*.'
  fa.a2.unit40.lesson06.teach.turn03:
    title: Nima risponde
    gloss: 'Nima: È nera.'
    note: Basta una risposta breve.
  fa.a2.unit40.lesson06.teach.turn04:
    title: L'impiegato chiede quale
    gloss: 'Impiegato: Quale borsa? Quella piccola?'
    note: '*اونی که کوچیکه* significa «quella che è piccola»: *اونی* sostituisce il nome.'
  fa.a2.unit40.lesson06.teach.turn05:
    title: Nima conferma
    gloss: 'Nima: Sì, proprio la borsa piccola.'
    note: '*همون کیفی که کوچیکه* ripete la descrizione.'
  fa.a2.unit40.lesson06.teach.turn06:
    title: L'impiegato indica un collega
    gloss: 'Impiegato: Il collega che è seduto là ha trovato la borsa. La borsa che ha trovato è nera.'
    note: '*پیدا کرده* è il passato prossimo: «ha trovato».'
