  fa.a2.unit26.lesson05.reading_listening:
    title: Leggi e ascolta
    objective: Individuare l'evento precedente senza partire dalla trascrizione.
  fa.a2.unit26.lesson06.dialogue_production:
    title: Spiegare che cos'era successo
    objective: Dare spiegazioni orali e scritte.
teaching:
  fa.a2.unit26.lesson04.teach.arrived:
    title: Lui o lei è arrivato/a
    gloss: lui/lei è arrivato/a
    note: '*رسید* è la terza persona del passato di *رسیدن*: *نیما رسید* = Nima è arrivato. Confronta con *رسیدم* = sono arrivato/a.'
    example_gloss:
    - Quando Nima è arrivato, il negozio era già chiuso.
  fa.a2.unit26.lesson01.teach.time_words:
    title: Indicatori di tempo
    gloss: quando, entro il momento in cui, prima/già, non più/già, ancora/finora, appena
    note: '*قبلا* e *دیگه* spesso rafforzano l''idea che l''evento fosse già concluso; *هنوز* con un verbo negativo significa non ancora.'
    example_gloss:
    - Quando sono arrivato, il treno era partito.
    - Quando sono arrivato, il negozio era già chiuso.
    - Avevo già comprato un biglietto.
    - Il treno era già partito.
    - Non avevo ancora mangiato.
    - Ero appena arrivato.
  fa.a2.unit26.lesson01.teach.travel:
    title: Parole di viaggio
    gloss: treno, biglietto, stazione, sono arrivato, tardi
    note: Parole fondamentali per i treni persi e gli arrivi in ritardo.
    example_gloss:
    - Il treno era partito.
    - Avevo comprato un biglietto.
    - Sono arrivato alla stazione.
    - Sono arrivato tardi.
  fa.a2.unit26.lesson01.teach.places_items:
    title: Luoghi e oggetti dimenticati
    gloss: negozio, casa, chiavi, cibo
    note: Parole fondamentali per le situazioni dell'unità.
    example_gloss:
    - Il negozio aveva chiuso.
    - Sono tornato a casa.
    - Avevo lasciato le chiavi a casa.
    - Avevo mangiato.
  fa.a2.unit26.lesson01.teach.grammar_shape:
    title: La forma del trapassato prossimo
    gloss: participio passato + passato di بودن
    note: '*رفته بودم* è letteralmente il participio *رفته* più *بودم*. Colloca l''andare prima di un altro momento nel passato.'
  fa.a2.unit26.lesson02.teach.actions:
    title: Participi utili
    gloss: comprato, mangiato, chiuso, lasciato (dimenticato), sono tornato
    note: Queste forme si combinano con *بودم / بود / بودن*.
    example_gloss:
    - Avevo comprato un biglietto.
    - Avevo mangiato.
    - Il negozio aveva chiuso.
    - Avevo lasciato le chiavi a casa.
    - Sono tornato a casa.
  fa.a2.unit26.lesson02.teach.people_forms:
    title: Persone e connettivi
    gloss: io, tu, loro, Nima, Sara, segno dell'oggetto, a, e, ma, anche
    note: Nima e Sara sono amici già noti.
    example_gloss:
    - Sono arrivato tardi.
    - Avevi comprato un biglietto.
    - Avevano mangiato.
    - Nima è arrivato alla stazione.
    - Sara era a casa.
  fa.a2.unit26.lesson02.teach.grammar_endings:
    title: Desinenze del parlato
    gloss: io/tu/lui o lei/noi/voi/loro ero/eri/era/eravamo/eravate/erano andato
    note: Le forme plurali del parlato colloquiale usano *بودین* e *بودن*.
  fa.a2.unit26.lesson03.teach.contrast_note:
    title: Sequenza ed evento precedente
    gloss: passato semplice e trapassato prossimo
    note: '*رسیدم و قطار رفت* racconta due eventi in successione. *وقتی رسیدم، قطار رفته بود* indica che la partenza del treno è avvenuta prima.'
  fa.a2.unit26.lesson03.teach.perfect_contrast:
    title: Passato prossimo e trapassato prossimo
    gloss: رفته‌م e رفته بودم
    note: '*رفته‌م* collega un evento passato al presente; *رفته بودم* lo colloca prima di un altro momento nel passato.'
  fa.a2.unit26.lesson05.teach.reading:
    title: Nima ha perso il treno
    gloss: Nima è arrivato tardi alla stazione. Quando è arrivato, il treno era partito. Aveva già comprato il biglietto, ma aveva lasciato le chiavi a casa ed era tornato indietro.
    note: Individua quali eventi sono avvenuti prima dell'arrivo alla stazione.
  fa.a2.unit26.lesson06.teach.line1:
    title: Sara chiede perché
    gloss: Perché sei arrivato in ritardo?
    note: Sara chiede una spiegazione.
  fa.a2.unit26.lesson06.teach.line2:
    title: Nima spiega
    gloss: Quando sono arrivato, il treno era partito.
    note: La partenza del treno è avvenuta prima.
  fa.a2.unit26.lesson06.teach.line3:
    title: Sara chiede del biglietto
    gloss: Avevi comprato il biglietto?
    note: Una domanda al trapassato prossimo.
  fa.a2.unit26.lesson06.teach.line4:
    title: Nima spiega il ritardo
    gloss: Sì, ma avevo lasciato le chiavi a casa e sono tornato indietro.
    note: Le chiavi erano state lasciate prima del suo ritorno.
  fa.a2.unit26.lesson06.teach.line5:
    title: Sara chiede cos'è successo dopo
    gloss: Che cos'è successo dopo?
    note: Una domanda di seguito naturale e informale.
  fa.a2.unit26.lesson06.teach.line6:
    title: Il negozio era chiuso
    gloss: Quando sono arrivato, anche il negozio aveva chiuso.
    note: La chiusura è avvenuta prima dell'arrivo.
