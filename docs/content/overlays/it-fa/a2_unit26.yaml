units:
  fa.a2.unit26.already_happened:
    title: Era già successo
    description: Capire e produrre in modo semplice il trapassato prossimo per un evento precedente a un momento di riferimento nel passato.
lessons:
  fa.a2.unit26.lesson01.form_recognition:
    title: Riconoscere l'evento precedente
    objective: Riconoscere le forme del trapassato prossimo.
  fa.a2.unit26.lesson02.building_the_form:
    title: Costruire la forma
    objective: Abbina i participi alle forme del passato di بودن.
  fa.a2.unit26.lesson03.contrasts:
    title: Passato semplice, passato prossimo o trapassato prossimo?
    objective: Distinguere le forme più facili da confondere.
  fa.a2.unit26.lesson04.scenario_production:
    title: Arrivi in ritardo
