course:
  title: Persiano A2
  description: 'Persiano iraniano di livello pre-intermedio: descrivere una settimana tipo, ordinare le attività con اول/بعد/در آخر e confrontare i giorni feriali con la vera settimana lavorativa iraniana شنبه-چهارشنبه e il fine settimana پنجشنبه/جمعه.'
