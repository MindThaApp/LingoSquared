teaching:
  fa.a2.unit17.lesson01.teach.week_word:
    title: Settimana
    gloss: settimana
    note: '*هفته* è la parola generica per «settimana».'
    example_gloss: Questa settimana è molto piena.
  fa.a2.unit17.lesson01.teach.weekend_word:
    title: Fine settimana
    gloss: weekend
    note: '*آخر هفته* significa letteralmente «fine della settimana»: in Iran corrisponde a *پنجشنبه*/*جمعه* (giovedì/venerdì), non a sabato/domenica.'
    example_gloss: Nel fine settimana non lavoro.
  fa.a2.unit17.lesson01.teach.rest_word:
    title: Riposo
    gloss: riposo
    note: '*استراحت کردن* (riposarsi) è una costruzione con verbo leggero, come *باز کردن* dell''unità precedente sulla banca.'
    example_gloss: Il venerdì mi riposo.
  fa.a2.unit17.lesson01.teach.first_word:
    title: Prima
    gloss: prima
    note: '*اول* apre una sequenza di attività.'
    example_gloss: Prima faccio colazione.
  fa.a2.unit17.lesson01.teach.then_word:
    title: Poi
    gloss: poi
    note: '*بعد* continua una sequenza; *بعدش* (poi / dopo di che) è la sua forma colloquiale più comune.'
    example_gloss: Poi vado al lavoro.
  fa.a2.unit17.lesson01.teach.finally_word:
    title: Infine
    gloss: infine / alla fine
    note: '*در آخر* chiude una sequenza di attività.'
    example_gloss: Infine mi riposo.
  fa.a2.unit17.lesson01.teach.recap_weekdays:
    title: I giorni della settimana
    gloss: sabato, domenica, lunedì, martedì, mercoledì, giovedì, venerdì
    note: Riepilogo dei nomi dei giorni della settimana dell'unità sulle date, riutilizzati qui per il programma settimanale.
  fa.a2.unit17.lesson02.teach.until_word:
    title: Fino a / da… a (intervallo di giorni)
    gloss: fino a / da… a
    note: '*تا* collega due giorni in un intervallo, ad esempio *شنبه تا چهارشنبه* (da sabato a mercoledì).'
  fa.a2.unit17.lesson02.teach.work_days_sentence:
    title: Indicare i giorni di lavoro come intervallo
    gloss: Lavoro da sabato a mercoledì.
    note: È una settimana lavorativa iraniana molto comune (molti uffici e negozi lavorano da sabato a mercoledì), diversa dal modello da lunedì a venerdì.
  fa.a2.unit17.lesson02.teach.thursdays_habitual_note:
    title: Il suffisso abituale -ها su un nome di giorno
    gloss: il giovedì (ogni settimana)
    note: '*پنجشنبه‌ها* (giovedì + -ها) significa «il giovedì» come abitudine ripetuta, non un giovedì preciso.'
  fa.a2.unit17.lesson02.teach.during_vs_weekend_sentence:
    title: Contrapporre la settimana al fine settimana
    gloss: Durante la settimana lavoro, ma nel fine settimana mi riposo.
    note: '*در طول هفته* (durante la settimana) si contrappone a *آخر هفته* (il fine settimana), uniti da *ولی* (ma).'
  fa.a2.unit17.lesson03.teach.clean_word:
    title: Pulire
    gloss: pulire
    note: '*تمیز کردن* è un''altra costruzione con verbo leggero: *تمیز* (pulito) + *کردن* (fare).'
    example_gloss: Il giovedì pulisco casa.
  fa.a2.unit17.lesson03.teach.schedule_note_text:
    title: Il programma settimanale scritto da سارا
    gloss: 'Il mio programma della settimana: lavoro da sabato a mercoledì. Il giovedì faccio la spesa e pulisco casa. Il venerdì, nel fine settimana, vedo i miei amici e mi riposo.'
    note: Una breve nota di agenda settimanale scritta nello stile parlato e rilassato (*خونه*, *دوستامو*).
  fa.a2.unit17.lesson04.teach.good_week_phrase:
    title: Che bella settimana hai!
    gloss: Che bella settimana hai!
    note: Un commento cordiale dopo aver sentito il programma settimanale di qualcuno. Riguarda la settimana che la persona ha; non è l'augurio di congedo «buona settimana».
  fa.a2.unit17.lesson04.teach.turn01:
    title: نیما chiede della settimana di سارا
    gloss: نیما chiede a سارا come va la sua settimana e qual è il suo programma.
    note: '*چطوره* e *چیه* sono le forme colloquiali contratte, ormai consolidate, di «com''è» e «che cos''è».'
  fa.a2.unit17.lesson04.teach.turn02:
    title: سارا comincia dai giorni di lavoro
    gloss: سارا dice che prima va al lavoro da sabato a mercoledì.
    note: '*سر کار می‌رم* (vado al lavoro) riprende l''espressione già vista per «andare al lavoro».'
  fa.a2.unit17.lesson04.teach.turn03:
    title: نیما chiede cosa viene dopo
    gloss: 'نیما chiede: e poi?'
    note: '*بعدش چی؟* è un modo breve e naturale per chiedere cosa viene dopo.'
  fa.a2.unit17.lesson04.teach.turn04:
    title: سارا descrive i giovedì
    gloss: سارا dice che poi, il giovedì, fa la spesa e pulisce casa.
    note: Riprende la frase sul giovedì della lezione 3.
  fa.a2.unit17.lesson04.teach.turn05:
    title: سارا descrive i venerdì
    gloss: سارا dice che infine, il venerdì, si riposa e vede i suoi amici.
    note: Chiude la sequenza con *در آخر* (infine).
  fa.a2.unit17.lesson04.teach.turn06:
    title: نیما chiude la conversazione
    gloss: 'نیما dice: che bella settimana hai!'
    note: Riprende la frase di chiusura di questa lezione.
