teaching:
  fa.a2.unit28.lesson01.teach.weather_words:
    title: Parole del meteo per le previsioni
    gloss: domani, tempo, pioggia, neve, freddo, caldo, soleggiato
    note: '*بارون* è la forma parlata di «pioggia»; nello scritto accurato si usa *باران*. *آفتابیه* significa «c''è il sole».'
    example_gloss:
    - Domani ci sarà il sole.
    - Domani pioverà.
    - Domani nevicherà.
  fa.a2.unit28.lesson01.teach.forecast_verbs:
    title: Due verbi per le previsioni
    gloss: piove, diventa
    note: '*می‌باره* significa «piove/nevica». *می‌شه* significa «diventa» e si usa con un aggettivo: *سرد می‌شه* = «farà freddo».'
    example_gloss:
    - Domani farà freddo.
    - Domani farà caldo.
  fa.a2.unit28.lesson01.teach.present_for_future:
    title: Il presente parlato per il futuro
    gloss: Domani pioverà. Domani farà freddo.
    note: 'In persiano si fanno previsioni con il normale presente più un''espressione di tempo. *فردا بارون می‌باره* significa «Domani pioverà». Nel parlato non esiste un tempo futuro a sé: è *فردا* a indicare che si parla del futuro.'
  fa.a2.unit28.lesson02.teach.possibility_words:
    title: Forse e probabilmente
    gloss: forse, probabilmente, Nima, Sara
    note: '*شاید* significa «forse» e *احتمالا* significa «probabilmente». Nima e Sara sono gli amici fissi del corso.'
    example_gloss:
    - Forse verrà Nima.
    - Probabilmente pioverà.
  fa.a2.unit28.lesson02.teach.subjunctive_verbs:
    title: I verbi dopo شاید
    gloss: viene, non viene, diventa
    note: 'Dopo *شاید* il verbo è al congiuntivo: *بیاد* (viene), *نیاد* (non viene), *بشه* (diventa). Il congiuntivo ha *ب-* e non ha *می‌*.'
    example_gloss:
    - Forse pioverà.
    - Forse non pioverà.
    - Forse farà freddo.
  fa.a2.unit28.lesson02.teach.shayad_note:
    title: شاید + congiuntivo
    gloss: Forse pioverà. Forse farà freddo. Forse non pioverà.
    note: 'Usa *شاید* quando qualcosa è solo possibile. Il verbo è al congiuntivo, senza *می‌*: *شاید بارون بیاد*. Negativo: *شاید بارون نیاد*. Confrontalo con la semplice previsione *بارون می‌باره*, che ha *می‌*.'
  fa.a2.unit28.lesson02.teach.ehtemalan_note:
    title: احتمالا + presente
    gloss: Probabilmente pioverà. Probabilmente farà freddo.
    note: 'Usa *احتمالا* quando qualcosa è probabile. Il verbo resta al normale presente, esattamente come in una semplice previsione: *احتمالا بارون می‌باره*. È la sola parola *احتمالا* a cambiare il grado di certezza.'
  fa.a2.unit28.lesson03.teach.negative_forecast:
    title: Previsione negativa
    gloss: non piove
    note: '*نمی‌باره* è il negativo di *می‌باره*: *فردا بارون نمی‌باره* = «Domani non pioverà».'
    example_gloss:
    - Domani non pioverà.
    - Domani probabilmente non pioverà.
  fa.a2.unit28.lesson03.teach.certainty_contrast:
    title: Certo, probabile o possibile?
    gloss: Pioverà. Probabilmente pioverà. Forse pioverà.
    note: 'Tre livelli. Previsione semplice: *بارون می‌باره* (presente, *می‌*). Probabile: *احتمالا بارون می‌باره* (presente, *می‌*). Solo possibile: *شاید بارون بیاد* (congiuntivo, senza *می‌*). Qui non usare *شاید* con un semplice *می‌باره*.'
  fa.a2.unit28.lesson03.teach.negative_contrast:
    title: I negativi a confronto
    gloss: Non pioverà. Forse non pioverà.
    note: 'Negativo semplice: *نمی‌باره* (presente, *نمی‌*). Negativo possibile: *شاید بارون نیاد* (congiuntivo *نیاد*). Entrambi hanno *ن-*, ma solo il secondo non ha *می‌*.'
  fa.a2.unit28.lesson04.teach.promise_words:
    title: Parole per le promesse
    gloss: prometto, di sicuro, tardi, telefonata, ti aiuto, quindi, non (lo) farai
    note: '*قول می‌دم* = «prometto». *حتما* = «di sicuro». *زنگ* con *زدن* significa «telefonare». *کمکت* è *کمک* + *ت*, «aiutarti». *دیر* = «tardi».'
    example_gloss:
    - Telefonerò di sicuro.
    - Prometto di aiutarti.
  fa.a2.unit28.lesson04.teach.promise_verbs:
    title: Verbi per le promesse
    gloss: non faccio (congiuntivo), telefono (congiuntivo), faccio (congiuntivo), vengo (congiuntivo), telefono, telefoni
    note: 'Dopo *قول می‌دم* il verbo è al congiuntivo: *نکنم*, *بزنم*, *کنم*, *بیام*. Il presente semplice *می‌زنم* si usa con *حتما*.'
    example_gloss:
    - Prometto che non farò tardi.
    - Prometto di telefonare.
    - Prometto di venire.
  fa.a2.unit28.lesson04.teach.promise_note:
    title: قول می‌دم + congiuntivo
    gloss: Prometto che non farò tardi. Prometto di telefonare. Prometto di venire.
    note: 'Una promessa si fa con *قول می‌دم* seguito da un verbo al congiuntivo (senza *می‌*): *قول می‌دم دیر نکنم*. La negazione *ن-* si mette sul congiuntivo. In persiano qui non si usa il futuro: il congiuntivo indica ciò che ti impegni a fare.'
  fa.a2.unit28.lesson04.teach.hatman_note:
    title: حتما + presente, شاید + congiuntivo
    gloss: Telefonerò di sicuro. Forse telefonerò.
    note: Per una promessa sicura puoi dire *حتما زنگ می‌زنم* (presente con *می‌*). Per qualcosa di incerto, *شاید زنگ بزنم* (congiuntivo, senza *می‌*). È lo stesso contrasto visto per il meteo.
  fa.a2.unit28.lesson05.teach.message_words:
    title: Parole per un messaggio
    gloss: ciao, dopo, da, lavoro, appuntamento, abbiamo, ultimo, settimana, a te, e, ma, ora, dieci, anche, come va
    note: '*قرار داریم* significa «abbiamo un appuntamento». *بعد از کار* è «dopo il lavoro». *آخر هفته* è «il weekend». *بهت* è la forma parlata di «a te».'
    example_gloss:
    - Domani dopo il lavoro abbiamo un appuntamento.
    - Nel weekend ci sarà il sole.
    - Ti telefonerò sicuramente.
  fa.a2.unit28.lesson05.teach.bulletin_words:
    title: Parole di bollettini e avvisi
    gloss: meteorologia, pioggia (scritto), nuvoloso, avviso, ufficio, chiuso, sarà/avverrà (futuro), sarà/essere, ha piovuto, è diventato
    note: Queste parole appartengono ai bollettini meteo e agli avvisi scritti. *باران* è la forma scritta del parlato *بارون*. *خواهد* è il «futuro» scritto, in *خواهد بود* e *خواهد شد*.
    example_gloss:
    - Avviso meteo
    - Domani l'ufficio sarà chiuso.
  fa.a2.unit28.lesson05.teach.formal_future_note:
    title: Futuro scritto con خواهد (solo da riconoscere)
    gloss: Il cielo diventerà nuvoloso. Pioverà. L'ufficio sarà chiuso.
    note: 'Solo scritto/formale. I bollettini meteo e gli avvisi usano un futuro scritto: *خواهد* + una forma verbale breve, come in *خواهد شد* (diventerà), *خواهد بارید* (pioverà), *خواهد بود* (sarà). Devi solo RICONOSCERLO quando leggi. Nel parlato e nei messaggi agli amici si dice *می‌شه*, *می‌باره*, *هست*: non usare *خواهد* tu stesso.'
  fa.a2.unit28.lesson05.teach.reading_message:
    title: Un messaggio di Sara
    gloss: Ciao Nima! Domani dopo il lavoro abbiamo un appuntamento. Domani farà freddo e probabilmente pioverà. Forse nel weekend nevicherà. Ti prometto che non farò tardi e ti telefonerò sicuramente.
    note: Leggi una prima volta per la semplice previsione, poi per ciò che è solo probabile o possibile, infine per la promessa.
  fa.a2.unit28.lesson05.teach.reading_bulletin:
    title: Un bollettino meteo
    gloss: 'Bollettino meteo: domani il cielo si farà nuvoloso e pioverà. Nel weekend farà freddo.'
    note: Questo è un bollettino scritto. Le forme con *خواهد* sono solo da riconoscere.
  fa.a2.unit28.lesson06.teach.turn01:
    title: Sara chiede di domani
    gloss: 'Sara chiede a Nima: Che tempo farà domani?'
    note: La domanda chiede una previsione.
  fa.a2.unit28.lesson06.teach.turn02:
    title: Nima fa una previsione
    gloss: 'Nima: Probabilmente pioverà. Forse nevicherà anche.'
    note: '*احتمالا* indica una cosa probabile; *شاید* solo una cosa possibile.'
  fa.a2.unit28.lesson06.teach.turn03:
    title: Sara controlla il programma
    gloss: 'Sara: Domani alle dieci abbiamo un appuntamento. Non farai tardi, vero?'
    note: Sara chiede un impegno con *دیر نمی‌کنی؟*
  fa.a2.unit28.lesson06.teach.turn04:
    title: Nima promette
    gloss: 'Nima: Ti prometto che non farò tardi.'
    note: '*قول می‌دم* + congiuntivo.'
  fa.a2.unit28.lesson06.teach.turn05:
    title: Sara chiede della telefonata
    gloss: 'Sara: Allora telefoni?'
    note: Il presente con *می‌* chiede di un programma sicuro.
  fa.a2.unit28.lesson06.teach.turn06:
    title: Nima si impegna
    gloss: 'Nima: Telefono sicuramente.'
    note: '*حتما* + presente dà una promessa ferma.'
