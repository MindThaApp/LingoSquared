teaching:
  fa.a1.unit01.lesson01.teach.rtl:
    title: Il persiano si scrive da destra a sinistra
    gloss: Il persiano si scrive da destra a sinistra.
    note: Leggi il persiano partendo dal margine destro verso sinistra.
  fa.a1.unit01.lesson01.teach.seen:
    title: La lettera س
    gloss: s
    note: س rappresenta normalmente il suono s.
  fa.a1.unit01.lesson01.teach.lam:
    title: La lettera ل
    gloss: l
    note: ل rappresenta il suono l e si unisce alle lettere vicine.
  fa.a1.unit01.lesson01.teach.alef:
    title: La lettera ا
    gloss: ā / a
    note: ا indica spesso la ā lunga e non si unisce alla lettera successiva.
  fa.a1.unit01.lesson01.teach.mim:
    title: La lettera م
    gloss: m
    note: م rappresenta il suono m e cambia forma quando è unita ad altre lettere.
  fa.a1.unit01.lesson01.teach.salam_shape:
    title: Costruisci سلام
    gloss: ciao
    note: سلام si legge salâm. In persiano le vocali brevi di solito non si scrivono.
    example_gloss: Ciao! Sono Nima.
  fa.a1.unit01.lesson02.teach.salam:
    title: Ciao
    gloss: ciao
    note: سلام va bene sia in situazioni formali che informali.
    example_gloss: Ciao, come stai?
  fa.a1.unit01.lesson02.teach.sobh_bekheyr:
    title: Buongiorno
    gloss: buongiorno
    note: صبح بخیر è un saluto del mattino neutro e cortese.
  fa.a1.unit01.lesson02.teach.asr_bekheyr:
    title: Buon pomeriggio o buonasera
    gloss: buon pomeriggio / buonasera
    note: عصر بخیر si usa dal tardo pomeriggio fino alla sera.
  fa.a1.unit01.lesson02.teach.khodahafez:
    title: Arrivederci
    gloss: arrivederci; addio
    note: خداحافظ si legge khodâhâfez ed è il saluto di congedo generico standard.
    example_gloss: Arrivederci, a dopo!
  fa.a1.unit01.lesson02.teach.mamnoon:
    title: Grazie
    gloss: grazie
    note: ممنون è comune e naturale; متشکرم è un po' più formale.
    example_gloss: Grazie mille.
  fa.a1.unit01.lesson02.teach.khahesh_mikonam:
    title: Prego
    gloss: prego / di nulla
    note: خواهش می‌کنم è la risposta convenzionale a un ringraziamento.
  fa.a1.unit01.lesson02.teach.hale_shoma:
    title: Come sta? Forma parlata di cortesia
    gloss: Come sta?
    note: حالتون چطوره؟ è la forma parlata neutra e cortese del persiano iraniano. حال شما چطور است؟ è la variante più formale o scritta.
  fa.a1.unit01.lesson02.teach.khoobam:
    title: Sto bene
    gloss: sto bene
    note: خوبم unisce خوب alla desinenza di prima persona ـم.
  fa.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Buongiorno
    gloss: buongiorno
    note: روز بخیر è cortese, ma nel parlato informale è meno frequente di سلام.
  fa.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Buonanotte
    gloss: buonanotte
    note: شب بخیر è normalmente un saluto di congedo o un augurio prima di andare a dormire, non un saluto di apertura.
  fa.a1.unit01.lesson03.teach.khosh_amadeed:
    title: Benvenuto
    gloss: benvenuto
    note: خوش آمدید è la forma cortese usata per uno o più ospiti.
  fa.a1.unit01.lesson03.teach.be_omide_didar:
    title: Spero di rivederti
    gloss: spero di rivederla / alla prossima
    note: به امید دیدار è un congedo ricercato, neutro e cortese.
  fa.a1.unit01.lesson03.teach.fealan:
    title: Ciao per ora
    gloss: a presto, ciao
    note: فعلاً è colloquiale e meno formale di خداحافظ.
  fa.a1.unit01.lesson03.teach.rooze_khoobi:
    title: Buona giornata
    gloss: buona giornata
    note: باشید indica la forma di cortesia in questo saluto fisso.
  fa.a1.unit01.lesson04.teach.formal_question:
    title: Forma parlata neutra e cortese
    gloss: Come sta?
    note: Usa حالتون چطوره؟ con un adulto che non conosci o in una conversazione cortese normale. La forma esplicitamente formale o scritta è حال شما چطور است؟
  fa.a1.unit01.lesson04.teach.informal_question:
    title: Informale
    gloss: Come sta?
    note: چطوری؟ è colloquiale e adatto con amici, familiari e coetanei, quando il rapporto lo permette.
  fa.a1.unit01.lesson04.teach.to:
    title: Il «tu» informale
    gloss: Lei (forma di cortesia)
    note: تو è singolare e informale; non usarlo di default con un adulto che non conosci.
  fa.a1.unit01.lesson04.teach.very_well:
    title: Molto bene
    gloss: sto molto bene
    note: خیلی rafforza خوبم.
  fa.a1.unit01.lesson04.teach.not_bad:
    title: Non male
    gloss: non c'è male, grazie
    note: بد نیستم è una risposta naturale e moderata, non un lamento.
  fa.a1.unit01.lesson04.teach.and_you_formal:
    title: E Lei? Forma di cortesia
    gloss: E Lei?
    note: Usa شما چطور؟ per restituire la domanda in modo cortese.
  fa.a1.unit01.lesson04.teach.and_you_informal:
    title: E tu? Informale
    gloss: E Lei?
    note: تو چطور؟ si adatta a un rapporto informale.
  fa.a1.unit01.lesson05.teach.chai:
    title: Tè
    gloss: tè
    note: '*چای* è la bevanda. La sentirai nell''offerta *چای بفرمایید* (prendi un tè / prenda un tè).'
    example_gloss: Prego, gradisce del tè?
  fa.a1.unit01.lesson05.teach.befarmaeed:
    title: Prego, si accomodi
    gloss: prego / si accomodi / ecco a Lei
    note: '*بفرمایید* cambia a seconda della situazione: può significare «ecco a te» (offrendo il tè), «prego, entra» (a una porta) oppure «prima tu / dopo di te».'
  fa.a1.unit01.lesson05.teach.lotf_dareed:
    title: Lei è gentile
    gloss: è molto gentile
    note: لطف دارید restituisce con cortesia un complimento.
  fa.a1.unit01.lesson05.teach.zahmat_nakeshid:
    title: Non si disturbi, la prego
    gloss: la prego, non si disturbi
    note: زحمت نکشید può essere un rifiuto sincero oppure una prima risposta cortese a un'offerta concreta.
  fa.a1.unit01.lesson05.teach.mamnoon_lotf:
    title: Grazie per la sua gentilezza
    gloss: grazie per la sua gentilezza
    note: È più caloroso ed esplicito del semplice ممنون.
  fa.a1.unit01.lesson05.teach.cultural_pattern:
    title: Taarof
    gloss: convenzioni iraniane di cortesia che dipendono dal contesto
    note: Il taarof indica le convenzioni, legate al contesto, per offrire, rifiutare, ringraziare e mostrare riguardo. La pratica varia secondo il rapporto, la generazione, la regione e la situazione; nessun numero fisso di rifiuti o di ripetizioni stabilisce se un'offerta sia sincera.
  fa.a1.unit01.lesson06.teach.line01:
    title: Benvenuto
    gloss: Ali dà il benvenuto a Narges.
    note: Lo scambio inizia con il saluto, prima delle presentazioni.
  fa.a1.unit01.lesson06.teach.line02:
    title: Benvenuto, risposta
    gloss: Narges lo saluta a sua volta e lo ringrazia.
    note: ممنون (grazie) è una risposta naturale a un benvenuto.
  fa.a1.unit01.lesson06.teach.line03:
    title: Scambiarsi i nomi
    gloss: Ali dice chi è.
    note: '*من علی هستم* significa «Io sono Ali». *هستم* («sono») sta alla fine della frase.'
  fa.a1.unit01.lesson06.teach.line04:
    title: Scambiarsi i nomi, risposta
    gloss: Narges dice chi è.
    note: Lo stesso schema *من ... هستم* appena usato da Ali.
  fa.a1.unit01.lesson06.teach.line05:
    title: Piacere
    gloss: Ali dice di essere lieto di conoscerla.
    note: '*خوشوقتم* significa «sono lieto/a». Insieme a *از آشنایی با شما* è la formula di cortesia standard quando si conosce qualcuno.'
  fa.a1.unit01.lesson06.teach.line06:
    title: Piacere di conoscerti, risposta
    gloss: Narges ricambia il sentimento.
    note: همین‌طور in questa risposta significa «allo stesso modo».
  fa.a1.unit01.lesson06.teach.line07:
    title: Chiedere come sta qualcuno
    gloss: Ali le chiede con cortesia come sta.
    note: Ali usa la forma parlata neutra e cortese in ـتون perché è un primo incontro formale.
  fa.a1.unit01.lesson06.teach.line08:
    title: Chiedere come sta qualcuno, risposta
    gloss: Narges risponde e restituisce la domanda.
    note: شما چطور؟ riprende la domanda per rivolgerla all'altro, una scorciatoia comune.
  fa.a1.unit01.lesson06.teach.line09:
    title: Invito
    gloss: Ali dice di stare bene anche lui e invita Narges a entrare.
    note: '*بفرمایید داخل* significa «prego, entra / si accomodi». *داخل* («dentro») indica che cosa viene offerto.'
  fa.a1.unit01.lesson06.teach.line10:
    title: Rifiuto cortese
    gloss: Narges lo ringrazia ma spiega che deve andare.
    note: Un rifiuto cortese inizia comunque con un ringraziamento, prima del no. *ولی باید برم* significa «ma devo andare».
  fa.a1.unit01.lesson06.teach.line11:
    title: Chiudere la conversazione
    gloss: Ali prende atto della risposta e spera di rivederla.
    note: L'invito rifiutato porta ora naturalmente al congedo.
  fa.a1.unit01.lesson06.teach.line12:
    title: Chiudere la conversazione, risposta
    gloss: Narges saluta.
    note: '*خداحافظ* è il saluto di congedo generico più comune.'
exercises:
