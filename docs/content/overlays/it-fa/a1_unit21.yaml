teaching:
  fa.a1.unit21.lesson01.teach.money_word:
    title: Il denaro
    gloss: denaro
    note: پول è la parola generica per «soldi» o «denaro».
    example_gloss: Dove sono i miei soldi?
  fa.a1.unit21.lesson01.teach.bank_word:
    title: Banca
    gloss: banca
    note: بانک è la parola generica per «banca».
    example_gloss: La banca è vicina.
  fa.a1.unit21.lesson01.teach.dollar_word:
    title: Dollaro
    gloss: dollaro
    note: دلار è la parola per «dollaro» (statunitense), la valuta straniera più citata nelle conversazioni quotidiane sul cambio.
    example_gloss: Ho dei dollari.
  fa.a1.unit21.lesson01.teach.exchange_word:
    title: Cambio
    gloss: cambio
    note: تبدیل significa «cambio, conversione» e si usa con کردن (fare) nella forma تبدیل کردن.
    example_gloss: Voglio cambiare (dei soldi).
  fa.a1.unit21.lesson01.teach.va_word:
    title: E
    gloss: e
    note: و è la congiunzione più comune, che significa «e»; l'hai già vista nelle unità precedenti.
    target_text: و (e)
  fa.a1.unit21.lesson02.teach.want_exchange:
    title: Dire che vuoi cambiare valuta
    gloss: Voglio cambiare dollari in toman.
    note: می‌خوام دلار به تومن تبدیل کنم usa به («in», «a») per indicare la valuta di arrivo.
  fa.a1.unit21.lesson02.teach.how_much_dollar:
    title: Chiedere quanti dollari ha
    gloss: Quanti dollari ha?
    note: '*چقدر دلار دارید؟* usa *چقدر* (quanto/quanti), una parola che hai già visto nelle domande sulla quantità delle unità precedenti.'
  fa.a1.unit21.lesson03.teach.atm_word:
    title: Bancomat
    gloss: bancomat
    note: خودپرداز significa letteralmente «che paga da sé»; è la parola standard per indicare il bancomat.
    example_gloss: Il bancomat è lì.
  fa.a1.unit21.lesson03.teach.withdraw_phrase:
    title: Dire che vuoi prelevare dei soldi
    gloss: Voglio prelevare dei soldi dal bancomat.
    note: می‌خوام از خودپرداز پول بردارم usa از («da») e بردارم («prelevo», «prendo»).
  fa.a1.unit21.lesson04.teach.change_question:
    title: Chiedere gli spiccioli
    gloss: Ha moneta spicciola?
    note: پول خرد دارید؟ usa خرد («piccolo», «spiccioli») dopo پول («soldi»).
  fa.a1.unit21.lesson04.teach.here_you_are:
    title: Ecco a Lei (ripasso)
    gloss: prego, ecco / si accomodi
    note: '*بفرمایید* è stato introdotto in un''unità precedente; qui si usa quando si porge qualcosa.'
  fa.a1.unit21.lesson05.teach.rate_word:
    title: Tasso
    gloss: tasso di cambio
    note: نرخ è la parola per «tasso» (di cambio).
    example_gloss: Qual è il cambio di oggi?
  fa.a1.unit21.lesson05.teach.per_dollar_rate:
    title: Dire il cambio per dollaro
    gloss: Ogni dollaro vale 30 toman.
    note: هر دلار سی تومنه usa هر (ogni) e la contrazione colloquiale in -e (*تومنه* = *تومن است*) che hai già incontrato.
  fa.a1.unit21.lesson06.teach.hundred_word:
    title: Cento
    gloss: cento
    note: صد è il numero 100.
    example_gloss: Ho cento dollari.
  fa.a1.unit21.lesson06.teach.please_do:
    title: Per favore, lo faccia
    gloss: per favore, cambi pure
    note: لطفاً تبدیل کنید è l'imperativo di cortesia di تبدیل کردن.
  fa.a1.unit21.lesson06.teach.turn01:
    title: Sara chiede di cambiare valuta
    gloss: Sara saluta l'impiegato e dice che vuole cambiare dollari in toman.
    note: Riprende می‌خوام دلار به تومن تبدیل کنم della lezione 2.
  fa.a1.unit21.lesson06.teach.turn02:
    title: L'impiegato chiede quanti dollari ha
    gloss: L'impiegato saluta Sara e le chiede quanti dollari ha.
    note: Riprende چقدر دلار دارید؟ della lezione 2.
  fa.a1.unit21.lesson06.teach.turn03:
    title: Sara dice la cifra e chiede il cambio
    gloss: Sara dice di avere cento dollari e chiede il cambio di oggi.
    note: صد («cento») è nuovo; نرخ امروز چنده؟ riprende la domanda sul cambio della lezione 5.
  fa.a1.unit21.lesson06.teach.turn04:
    title: L'impiegato dice il cambio
    gloss: L'impiegato dice che ogni dollaro vale 30 toman.
    note: Riprende هر دلار سی تومنه della lezione 5.
  fa.a1.unit21.lesson06.teach.turn05:
    title: Sara accetta e chiede all'impiegato di procedere
    gloss: Sara accetta e chiede all'impiegato di cambiare, per favore.
    note: لطفاً تبدیل کنید, visto prima in questa lezione.
  fa.a1.unit21.lesson06.teach.turn06:
    title: L'impiegato consegna il totale
    gloss: Prego, tremila toman.
    note: '*سه هزار تومن* = 100 dollari x 30 toman al dollaro. *هزار* (mille) è ripreso dall''unità sui numeri.'
  fa.a1.unit21.lesson06.teach.turn07:
    title: Sara ringrazia l'impiegato e chiede anche gli spiccioli
    gloss: Grazie. Ha anche moneta spicciola?
    note: Riprende پول خرد دارید؟ della lezione 4 con هم («anche»).
  fa.a1.unit21.lesson06.teach.turn08:
    title: L'impiegato conferma e consegna
    gloss: Sì, prego.
    note: بله («sì») è una parola di ripasso; بفرمایید chiude lo scambio.
