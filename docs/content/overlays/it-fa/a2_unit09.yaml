course:
  title: Persiano A2
  description: 'Persiano iraniano di livello pre-intermedio: come gestire un appuntamento formale per aggiornare il tuo indirizzo presso un ufficio dei servizi pubblici – lessico, prenotazione dell''appuntamento, lettura di un avviso ufficiale e appuntamento vero e proprio.'
units:
  fa.a2.unit09.bureaucracy:
    title: Pratiche burocratiche
lessons:
  fa.a2.unit09.lesson01.bureaucracy_vocabulary:
    title: Parole per rivolgersi a un ufficio
  fa.a2.unit09.lesson02.making_an_appointment:
    title: Fissare un appuntamento
  fa.a2.unit09.lesson03.reading_the_notice:
    title: Leggere l'avviso
  fa.a2.unit09.lesson04.at_the_registry_office:
    title: All'ufficio dei servizi pubblici
teaching:
  fa.a2.unit09.lesson01.teach.vaght_word:
    title: Appuntamento
    gloss: appuntamento / orario
    note: '*وقت* significa letteralmente «tempo»; *وقت گرفتن* (prendere un appuntamento) è il modo comune per dire «fissare un appuntamento» in persiano.'
  fa.a2.unit09.lesson01.teach.madrak_word:
    title: Documento
    gloss: documento
    note: '*مدرک* è la parola generica per indicare un documento ufficiale o di identità.'
  fa.a2.unit09.lesson01.teach.address_word:
    title: Indirizzo
    gloss: indirizzo
    note: '*آدرس* è la parola di uso comune per l''indirizzo di casa o postale.'
  fa.a2.unit09.lesson01.teach.ghabz_word:
    title: Bolletta
    gloss: bolletta
    note: '*قبض* indica una bolletta (acqua, luce, gas), di solito accettata come prova di residenza.'
  fa.a2.unit09.lesson01.teach.national_id_word:
    title: Carta d'identità nazionale
    gloss: carta d'identità nazionale
    note: '*کارت ملی* è la carta d''identità nazionale iraniana, il documento che in questa unità viene aggiornato.'
  fa.a2.unit09.lesson01.teach.va_word:
    title: E
    gloss: e
    note: '*و* è la congiunzione di uso comune che ricorre in tutta questa unità.'
  fa.a2.unit09.lesson02.teach.request_appointment:
    title: Chiedere un appuntamento
    gloss: Vorrei fissare un appuntamento per cambiare il mio indirizzo.
    note: '*می‌خواستم* (letteralmente «volevo») attenua la richiesta, come in italiano il condizionale o l''imperfetto di cortesia («vorrei», «volevo chiedere…»).'
  fa.a2.unit09.lesson02.teach.because_moved:
    title: Spiegare il motivo con چون (perché)
    gloss: Poiché ho cambiato casa, devo cambiare il mio indirizzo.
    note: '*چون* introduce la causa: è una proposizione subordinata, un passo avanti rispetto alle semplici frasi dell''A1.'
  fa.a2.unit09.lesson02.teach.what_should_i_bring:
    title: Chiedere cosa portare, con cortesia
    gloss: Può dirmi cosa devo portare?
    note: '*می‌شه...؟* («sarebbe possibile...?») è una forma di domanda indiretta e cortese.'
  fa.a2.unit09.lesson03.teach.lease_word:
    title: Contratto d'affitto
    gloss: contratto d'affitto
    note: '*اجاره‌نامه* è il contratto di locazione, uno dei possibili documenti che provano la residenza.'
  fa.a2.unit09.lesson03.teach.deadline_word:
    title: Scadenza
    gloss: scadenza
    note: '*مهلت* è la parola generica per indicare una scadenza o un termine.'
  fa.a2.unit09.lesson03.teach.notice_text:
    title: Un avviso dell'ufficio sull'aggiornamento dell'indirizzo
    gloss: Per cambiare l'indirizzo, portate la vecchia carta d'identità nazionale e una bolletta dell'acqua o della luce. La scadenza per la registrazione è la fine di questo mese.
    note: Un breve avviso ufficiale in stile scritto neutro. Usa comunque *بیارید*, la forma parlata di uso comune (invece di *بیاورید*), come spesso accade in questi avvisi.
  fa.a2.unit09.lesson03.teach.i_will_bring_bill:
    title: Dire cosa porterai
    gloss: Porto la bolletta dell'acqua.
    note: '*میارم* è la contrazione parlata di uso comune di *می‌آورم* (porto).'
  fa.a2.unit09.lesson04.teach.turn01:
    title: L'impiegato accoglie سارا
    gloss: L'impiegato la invita ad avvicinarsi e le chiede come può aiutarla.
    note: '*بفرمایید* la invita ad avvicinarsi; *چه کمکی از دستم برمیاد؟* è un modo cortese e normale con cui un impiegato offre aiuto.'
  fa.a2.unit09.lesson04.teach.turn02:
    title: سارا chiede un appuntamento
    gloss: سارا dice che vorrebbe fissare un appuntamento per cambiare il suo indirizzo.
    note: Riprende la formula di richiesta *می‌خواستم* della lezione 2.
  fa.a2.unit09.lesson04.teach.turn03:
    title: L'impiegato chiede da quando
    gloss: L'impiegato le chiede da quando vive al nuovo indirizzo.
    note: '*از کی...؟* significa «da quando...?».'
  fa.a2.unit09.lesson04.teach.turn04:
    title: سارا risponde e chiede cosa portare
    gloss: Dice che vive lì dal mese scorso e chiede cosa deve portare.
    note: Unisce l'informazione *از ماه پیش* alla domanda *می‌شه بگید...؟* della lezione 2.
  fa.a2.unit09.lesson04.teach.turn05:
    title: L'impiegato elenca i documenti
    gloss: L'impiegato dice che bastano la vecchia carta d'identità nazionale e una bolletta dell'acqua o della luce.
    note: '*کافیه* (forma colloquiale di *کافی است*) significa «basta».'
  fa.a2.unit09.lesson04.teach.turn06:
    title: سارا propone un giorno
    gloss: Chiede se può venire martedì.
    note: '*می‌تونم...؟* chiede se è possibile o permesso; è la forma colloquiale di *می‌توانم*.'
  fa.a2.unit09.lesson04.teach.turn07:
    title: L'impiegato conferma e dà un codice di tracciamento
    gloss: L'impiegato conferma martedì alle dieci e dà il codice di tracciamento 2214.
    note: '*کد پیگیری* è il codice di riferimento per seguire l''appuntamento.'
