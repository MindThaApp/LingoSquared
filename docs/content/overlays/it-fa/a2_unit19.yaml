course:
  title: Persiano A2
  description: 'Persiano dell''Iran di livello pre-intermedio con una struttura grammaticale solida: banca, opinioni, appuntamenti e altro, e ora si inizia il passato semplice come sistema (temi, desinenze e passato negativo).'
units:
  fa.a2.unit19.last_weekend:
    title: Lo scorso fine settimana
lessons:
  fa.a2.unit19.lesson01.weekend_words:
    title: Parole del weekend e le prime forme del passato
  fa.a2.unit19.lesson02.past_stem_and_endings:
    title: Come si forma il passato semplice
  fa.a2.unit19.lesson03.negative_past:
    title: Il passato negativo, e passato e presente a confronto
  fa.a2.unit19.lesson04.saying_what_you_did:
