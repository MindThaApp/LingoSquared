  fa.a2.unit19.lesson06.weekend_conversation:
    title: Una conversazione sul weekend
teaching:
  fa.a2.unit19.lesson01.teach.weekend_phrase:
    title: Lo scorso fine settimana
    gloss: lo scorso fine settimana
    note: '*آخر هفته‌ی پیش* significa letteralmente «la fine della settimana scorsa», ed è il modo in cui il persiano dice «lo scorso fine settimana». In Iran il fine settimana è giovedì e venerdì.'
    example_gloss: Lo scorso fine settimana sono rimasto a casa.
  fa.a2.unit19.lesson01.teach.days:
    title: Giovedì, venerdì
    gloss: Giovedì, venerdì
    note: Questi due giorni formano il fine settimana iraniano, quindi di solito sono quelli di cui si parla quando si racconta il weekend.
    example_gloss:
    - Giovedì sono andato al parco.
    - Venerdì sono rimasto a casa.
  fa.a2.unit19.lesson01.teach.parts_of_day:
    title: Mattina, mezzogiorno, tardo pomeriggio
    gloss: mattina, mezzogiorno, tardo pomeriggio
    note: '*عصر* indica il tardo pomeriggio e l''inizio della sera. Il momento della giornata si mette subito dopo il giorno: *پنجشنبه صبح* «giovedì mattina».'
    example_gloss:
    - Giovedì mattina sono andato a fare shopping.
    - Ho dormito fino a mezzogiorno.
    - Nel tardo pomeriggio sono andato al parco.
  fa.a2.unit19.lesson01.teach.places:
    title: Parco, cinema, banca
    gloss: parco, cinema, banca
    note: 'Con *رفتن* («andare») nel parlato *به* («a») spesso cade: *به پارک رفتم* e *رفتم پارک* significano entrambi «sono andato al parco».'
    example_gloss:
    - Giovedì sono andato al parco.
    - Venerdì sono andato al cinema.
    - Giovedì sono andato in banca.
  fa.a2.unit19.lesson01.teach.errands:
    title: Fare la spesa
    gloss: shopping
    note: '*رفتم خرید* significa «sono andato a fare shopping». La stessa parola *خرید* è anche la forma del passato di *خریدن* per «lui/lei»: «ha comprato».'
    example_gloss: Giovedì mattina sono andato a fare shopping.
  fa.a2.unit19.lesson01.teach.home_book_film:
    title: Casa, libro, film
    gloss: casa, libro, film
    note: '*خونه* è la forma parlata di *خانه* (casa). Nel parlato *یه کتاب* («un libro») è la forma abituale di *یک کتاب*; vanno bene entrambe.'
    example_gloss:
    - Venerdì sono rimasto a casa.
    - Ho letto un libro.
    - Ho guardato un film.
  fa.a2.unit19.lesson01.teach.people:
    title: Il mio amico, mia nonna
    gloss: il mio amico, mia nonna
    note: 'La desinenza *-م* su un nome significa «mio/mia»: *دوست* (amico) diventa *دوستم* (il mio amico).'
    example_gloss:
    - Giovedì è venuto il mio amico.
    - Venerdì è venuta mia nonna.
  fa.a2.unit19.lesson01.teach.visit:
    title: Fare visita
    gloss: fare visita / vedere
    note: '*رفتن دیدن* più una persona significa andare a trovarla: *رفتم دیدن دوستم* «sono andato a trovare il mio amico». La stessa parola *دیدن* significa anche «vedere».'
    example_gloss: Sono andato a trovare mia nonna.
  fa.a2.unit19.lesson01.teach.verbs_go_stay:
    title: Sono andato, sono venuto, sono rimasto
    gloss: Sono andato, sono venuto, sono rimasto
    note: Queste sono le forme della prima persona singolare (*io*) del passato semplice. Il persiano parlato dice *اومدم* e *موندم* dove la lingua scritta accurata ha *آمدم* e *ماندم*.
    example_gloss:
    - Giovedì sono andato al parco.
    - Venerdì sono tornato a casa.
    - Lo scorso fine settimana sono rimasto a casa.
  fa.a2.unit19.lesson01.teach.verbs_eat_see:
    title: Ho mangiato, ho visto, ho letto, ho dormito
    gloss: Ho mangiato, ho visto, ho letto, ho dormito
    note: Altre quattro forme della prima persona singolare (*io*) del passato semplice. *خوندم* è la forma parlata di *خواندم*.
    example_gloss:
    - Ho pranzato.
    - Ho guardato un film.
    - Ho letto un libro.
    - Venerdì ho dormito.
  fa.a2.unit19.lesson02.teach.pronouns:
    title: Io, tu, lui/lei, noi
    gloss: io, tu (informale), lui / lei, noi
    note: Il persiano parlato di solito omette il pronome, perché la desinenza del verbo indica già chi compie l'azione, proprio come in italiano. Lo si aggiunge per enfasi o contrasto. *اون* significa «lui» o «lei».
    example_gloss:
    - Giovedì sono andato al parco.
    - Sei rimasto a casa?
    - Venerdì è venuto.
    - Giovedì siamo andati al parco.
  fa.a2.unit19.lesson02.teach.stem_rule:
    title: La radice del passato
    gloss: 'Radici del passato: andò, mangiò, vide, lesse, rimase, venne, dormì'
    note: 'La forma del dizionario (infinito) di un verbo termina in *-ن*. Se la togli, ottieni la radice del passato: *رفتن* → *رفت*, *خوردن* → *خورد*, *دیدن* → *دید*, *خوندن* → *خوند*, *موندن* → *موند*, *اومدن* → *اومد*, *خوابیدن* → *خوابید*. Tutto il passato semplice si costruisce su questa radice.'
  fa.a2.unit19.lesson02.teach.endings:
    title: Le desinenze sulla radice del passato
    gloss: io sono andato/a, tu sei andato/a, lui/lei è andato/a, noi siamo andati/e, voi siete andati/e, loro sono andati/e
    note: 'Aggiungi la desinenza alla radice: *-م* (io), *-ی* (tu), nessuna desinenza (lui/lei), *-یم* (noi), *-ین* (voi o forma di cortesia, nel parlato: *رفتین*), *-ن* (loro). Nello scritto accurato si usa *-ید* per «voi» (*رفتید*) e *-ند* per «loro» (*رفتند*). Nota che *رفتن* significa anche «andare»: lo capisci dal contesto. E non confondere i due *-م*: su un nome significa «mio/mia» (*دوستم*), su un verbo al passato significa «io» (*رفتم*).'
  fa.a2.unit19.lesson02.teach.eat_forms:
    title: Le stesse desinenze su خورد
    gloss: io ho mangiato, tu hai mangiato, lui/lei ha mangiato, noi abbiamo mangiato
    note: 'Stesse desinenze, radice diversa: *خورد* + *-م*, *-ی*, niente, *-یم*.'
  fa.a2.unit19.lesson02.teach.stay_forms:
    title: Le stesse desinenze su موند
    gloss: io sono rimasto/a, tu sei rimasto/a, lui/lei è rimasto/a, noi siamo rimasti/e
    note: 'La radice *موند* prende le stesse desinenze. Nella forma «lui/lei» non si aggiunge nulla: *اون خونه موند*.'
  fa.a2.unit19.lesson03.teach.and_but:
    title: Ma, e
    gloss: ma, e
    note: '*ولی* collega due frasi in contrasto; *و* aggiunge semplicemente un''altra cosa.'
    example_gloss:
    - Sono andato al parco, ma non sono andato al cinema.
    - Venerdì sono rimasto a casa e ho letto un libro.
  fa.a2.unit19.lesson03.teach.time_words:
    title: Ieri, oggi, ogni giorno
    gloss: ieri, oggi, ogni giorno
    note: 'Le parole di tempo ti aiutano a scegliere il tempo verbale: *دیروز* rimanda al passato e *هر روز* (un''abitudine) al presente. *امروز* può andare con entrambi: *امروز نمی‌رم پارک* «oggi non vado al parco», ma *امروز رفتم پارک* «oggi sono andato al parco» quando è già successo.'
    example_gloss:
    - Ieri sono andato/a al parco.
    - Oggi non vado al parco.
    - Ogni giorno vado al parco.
  fa.a2.unit19.lesson03.teach.negative_rule:
    title: 'Passato negativo: نـ + verbo'
    gloss: non sono andato/a, non ho mangiato, non ho visto, non ho letto, non sono rimasto/a
    note: 'Per dire che NON hai fatto qualcosa, metti *نـ* direttamente davanti al verbo al passato e non cambiare nient''altro: *رفتم* → *نرفتم*, *خوردم* → *نخوردم*, *ندیدم*, *نخوندم*, *نموندم*. Le desinenze restano le stesse: *نرفتم*, *نرفتی*, *نرفت*, *نرفتیم*. Scrivi *نـ* attaccato al verbo: non è la parola separata *نه* («no»): *نه، نرفتم* significa «No, non sono andato».'
  fa.a2.unit19.lesson03.teach.neg_aamad:
    title: 'L''eccezione: اومدن'
    gloss: non sono venuto/a, non sei venuto/a, non è venuto/a, non siamo venuti/e
    note: '*اومدن* («venire») inizia con una vocale, quindi *نـ* + *ا* diventa *نی*: *اومدم* → *نیومدم* (mai *ناومدم*). Le altre desinenze seguono lo schema abituale: *نیومدی*, *نیومد*, *نیومدیم*. Nello scritto accurato si ha *آمدم* → *نیامدم*.'
  fa.a2.unit19.lesson03.teach.past_vs_present:
    title: Passato o presente?
    gloss: vado, sono andato/a, non vado, non sono andato/a
    note: 'Il passato semplice non ha *می‌* e usa la radice del passato (*رفتم*); il presente ha *می‌* più la radice del presente (*می‌رم*). Radice e *می‌* insieme indicano il tempo. Le forme negative funzionano allo stesso modo: *نرفتم* «non sono andato» ma *نمی‌رم* «non vado / non sto andando». Pronuncia: il negativo del passato è *na-* (*نرفتم*, «na-raftam»), mentre *نمی‌* è *ne-* (*نمی‌رم*, «ne-miram»).'
  fa.a2.unit19.lesson04.teach.sequence_words:
    title: Prima, poi, alla fine
    gloss: prima, poi / dopo, alla fine
    note: '*اول* apre una sequenza, *بعد* la continua (puoi ripeterlo) e *آخرش* la chiude.'
    example_gloss:
    - Prima sono andato in banca.
    - Poi sono andato a fare shopping.
    - Alla fine sono tornato a casa.
  fa.a2.unit19.lesson04.teach.sequence_note:
    title: Raccontare gli eventi in ordine
    gloss: Prima sono andato in banca, poi sono andato a fare shopping, alla fine sono tornato a casa.
    note: 'Racconta gli eventi nell''ordine in cui sono accaduti. Ogni frase ha il proprio verbo al passato (con *رفتن* il verbo spesso precede il luogo: *رفتم بانک*). Unisci le frasi con una virgola o con *و*: *اول رفتم بانک و بعد رفتم خرید*. Metti l''evento negativo al suo posto nel racconto: *بعد رفتم پارک، ولی سینما نرفتم* oppure *بعد رفتم خرید، ولی ورزش نکردم*. *اومدم خونه* («sono tornato a casa») è un modo naturale per chiudere una giornata.'
  fa.a2.unit19.lesson04.teach.question:
    title: Che cosa hai fatto lo scorso fine settimana?
    gloss: Che cosa hai fatto lo scorso fine settimana?
    note: '*چیکار کردی؟* (letteralmente «che cosa hai fatto?») è il modo standard di chiederlo. Rispondi con verbi al passato, una frase per ogni cosa che hai fatto.'
  fa.a2.unit19.lesson04.teach.sport:
    title: Sport
    gloss: sport / esercizio fisico
    note: '*ورزش کردن* significa fare sport o fare esercizio fisico.'
    example_gloss: Giovedì ho fatto sport.
  fa.a2.unit19.lesson04.teach.compound_negative:
    title: La negazione dei verbi come خرید کردن
    gloss: ho fatto shopping, non ho fatto shopping, ho fatto sport, non ho fatto sport
    note: 'Verbi come *خرید کردن* («fare shopping») e *ورزش کردن* sono formati da un nome più *کردن* («fare»). Metti *نـ* sul verbo, non sul nome: *خرید نکردم*, mai *نخرید کردم*. La forma «lui/lei» è *نکرد*: *ورزش نکرد*.'
  fa.a2.unit19.lesson04.teach.no_answer:
    title: Rispondere a una domanda sì/no al passato
    gloss: Sei andato al cinema? No, non ci sono andato.
    note: 'Per rispondere di no a una domanda sul passato, ripeti il verbo con *نـ*: *نرفتم*. Aggiungere davanti *نه* («no») è molto comune. Per dire di sì, ripeti il verbo senza: *رفتم*.'
  fa.a2.unit19.lesson05.teach.spot_negative:
    title: Riconoscere il negativo
    gloss: non ho fatto, non sono andato/a, non ho visto
    note: 'Quando leggi o ascolti, controlla l''inizio di ogni verbo. Una piccola *نـ* ribalta completamente il significato: *رفتم* «sono andato» ma *نرفتم* «non sono andato». In un racconto sul fine settimana, i negativi ti dicono che cosa NON è successo, quindi prestaci la stessa attenzione che dai alle attività.'
  fa.a2.unit19.lesson05.teach.reading_message:
    title: Il messaggio di Sara a un'amica
    gloss: Ciao! Lo scorso fine settimana, giovedì mattina, sono andata a fare shopping. Poi sono andata al parco. Nel tardo pomeriggio sono andata a trovare mia nonna. Venerdì sono rimasta a casa e ho letto un libro. Ma non ho fatto sport e non sono andata al cinema.
    note: Un breve racconto scritto del fine settimana. Leggilo una prima volta per le attività e il loro ordine, poi di nuovo per le due cose che NON ha fatto.
  fa.a2.unit19.lesson06.teach.names:
    title: Sara, Nima
    gloss: Sara, Nima
    note: I due amici delle unità precedenti.
    example_gloss:
    - Giovedì Sara è andata al parco.
    - Nima è venuto venerdì.
  fa.a2.unit19.lesson06.teach.until:
    title: Fino a
    gloss: fino a
    note: '*تا* davanti a un orario o a un giorno significa «fino a»: *تا ظهر* «fino a mezzogiorno».'
    example_gloss: Ho dormito fino a mezzogiorno.
  fa.a2.unit19.lesson06.teach.what_about:
    title: E...?
    gloss: E venerdì? E tu?
    note: '*چی؟* dopo una parola chiede «e per quanto riguarda quello?»: un modo rapido per far procedere la conversazione.'
  fa.a2.unit19.lesson06.teach.how_nice:
    title: Che bello!
    gloss: Che bello!
    note: Una reazione cordiale a una bella notizia.
  fa.a2.unit19.lesson06.teach.turn01:
    title: Sara chiede del fine settimana scorso
    gloss: Sara chiede a Nima che cosa ha fatto lo scorso fine settimana.
    note: La domanda standard per raccontare il fine settimana appena trascorso.
  fa.a2.unit19.lesson06.teach.turn02:
    title: Il giovedì di Nima
    gloss: Nima dice che giovedì prima è andato in banca, poi a fare shopping.
    note: '*اول ... بعد ...* mette in ordine le due commissioni.'
  fa.a2.unit19.lesson06.teach.turn03:
    title: Sara chiede del venerdì
    gloss: 'Sara chiede: e venerdì? Hai fatto sport?'
    note: '*ورزش کردی؟* è una domanda sì/no su un''azione passata.'
  fa.a2.unit19.lesson06.teach.turn04:
    title: Il venerdì di Nima
    gloss: 'Nima dice di no, non ha fatto sport. Ha dormito fino a mezzogiorno e nel tardo pomeriggio è andato a trovare un amico. Chiede a Sara: e tu?'
    note: '*ورزش نکردم*: la *نـ* va sul verbo. Il resto del suo venerdì è affermativo.'
  fa.a2.unit19.lesson06.teach.turn05:
    title: Il fine settimana di Sara
    gloss: Sara dice che giovedì è andata al parco e venerdì è rimasta a casa e ha letto un libro.
    note: 'Sara usa *من* per rispondere a *تو چی؟*: un caso in cui il pronome è naturale.'
  fa.a2.unit19.lesson06.teach.turn06:
    title: Nima reagisce
    gloss: 'Nima dice: che bello!'
    note: Una breve reazione cordiale per chiudere.
  fa.a2.unit19.lesson06.teach.third_person:
    title: Parlare di altre persone
    gloss: Nima è andato, Sara è rimasta, Nima non è andato, Sara non ha fatto
    note: 'Quando riferisci ciò che ha fatto un''altra persona, usa la radice nuda per «lui/lei»: *نیما رفت بانک*, *سارا خونه موند*. Il negativo resta *نـ* + radice: *نیما نرفت*, *سارا ورزش نکرد*. Non si aggiunge nessuna desinenza, quindi è il nome (o *اون*) a dirti chi ha agito.'
