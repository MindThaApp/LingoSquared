course:
  title: Persiano A1
  description: 'Persiano iraniano per principianti: i tre servizi di emergenza (polizia, ambulanza, vigili del fuoco), dire che cosa serve, chiedere aiuto con gli imperativi di cortesia, un dialogo con una chiamata di emergenza e la lettura di un breve avviso di emergenza.'
