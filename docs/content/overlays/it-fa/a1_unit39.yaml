    title: Su questo avviso
    gloss: Incidente / pericolo / fuoco
    note: Nell'avviso, ogni tipo di emergenza è seguito da un punto interrogativo, come se si chiedesse «In caso di incidente?». Il servizio da chiamare viene subito dopo.
