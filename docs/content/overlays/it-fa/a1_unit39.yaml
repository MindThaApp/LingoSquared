  fa.a1.unit39.lesson02.teach.khatar:
    title: Pericolo
    gloss: pericolo
    note: '*خطر* significa «pericolo».'
    example_gloss: Pericolo! Serve la polizia!
  fa.a1.unit39.lesson03.teach.review_ken_konid:
    title: 'Ripasso: imperativo formale e informale'
    gloss: fa'! (formale) / fa'! (informale)
    note: '*کنید* è la desinenza dell''imperativo formale o plurale. La forma informale *کن*, che hai usato con gli amici in *استراحت کن* («riposati!»), si usa per una sola persona che conosci bene.'
  fa.a1.unit39.lesson03.teach.komak_konid:
    title: Aiuto!
    gloss: Aiuto!
    note: '*کمک کنید!* è il modo cortese per chiedere aiuto, adatto a sconosciuti e soccorritori.'
