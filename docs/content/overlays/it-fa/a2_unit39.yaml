teaching:
  fa.a2.unit39.lesson01.teach.basic_words:
    title: Persone, giorni e parole piccole
    gloss: io, tu, lui/lei, loro, Sara, Nima, oggi, domani, tardi, un/una, e, o, no
    note: '*اون* significa «lui/lei/quello» e *اونا* significa «loro». In persiano non esistono parole distinte per «lui» e «lei».'
    example_gloss:
    - Tu e io.
    - Sara e Nima.
    - Oggi o domani.
  fa.a2.unit39.lesson01.teach.have_forms:
    title: Avere da fare o avere tempo
    gloss: ho da fare, hai tempo, ha tempo
    note: '*کار دارم* significa «ho da fare / sono impegnato/a». La desinenza cambia con la persona: *دارم*, *داری*, *داره*.'
    example_gloss:
    - Oggi ho da fare.
    - Domani hai tempo?
    - Sara domani ha tempo.
  fa.a2.unit39.lesson01.teach.message_words:
    title: Messaggi e appunti
    gloss: messaggio, appunto, telefono, il mio collega / la mia collega, il mio amico / la mia amica
    note: Un messaggio telefonico è un *پیغام*; uno scritto può essere una *یادداشت*. *همکارم* e *دوستم* non indicano se la persona è uomo o donna.
    example_gloss:
    - Il mio amico ha un messaggio.
    - Il mio collega ha un appunto.
    - Sara ha il telefono.
  fa.a2.unit39.lesson01.teach.home_forms:
    title: Essere a casa
    gloss: casa, è, non è, sei
    note: '*خونه هست* significa «è a casa». *هستی* è la forma per «tu» e *هست* quella per «lui/lei».'
    example_gloss:
    - Nima è a casa.
    - Sara non è a casa.
    - Sei a casa?
  fa.a2.unit39.lesson01.teach.say_verbs:
    title: Verbi per riferire un messaggio
    gloss: dice, dicono, chiede, vuole
    note: Ogni verbo è al presente, terza persona. Usa *می‌گه* per riferire un'affermazione, *می‌پرسه* per una domanda e *می‌خواد* per una richiesta.
    example_gloss:
    - Il mio amico dice.
    - Dicono.
    - Il mio collega chiede.
    - Sara vuole.
  fa.a2.unit39.lesson01.teach.arrive_forms:
    title: Arrivare tardi
    gloss: arrivo tardi, arriva tardi
    note: Lo stesso verbo *می‌رسه* vale sia per «lui» sia per «lei».
    example_gloss:
    - Oggi arrivo tardi.
    - Sara arriva tardi.
  fa.a2.unit39.lesson01.teach.say_that:
    title: 'Riferire un''affermazione: می‌گه که'
    gloss: Arrivo tardi. Sara dice che arriva tardi.
    note: 'Per riferire un''affermazione, si dice chi parla, poi *می‌گه که*, poi ciò che è stato detto. Il verbo resta al presente. Cambia la persona: *دیر می‌رسم* (io) diventa *دیر می‌رسه* (lui/lei). *که* («che») nel parlato si può omettere, ma rende chiaro il discorso riportato.'
  fa.a2.unit39.lesson02.teach.object_pronouns:
    title: A me, a te, a lui/lei, per te
    gloss: a me, a te, a lui/lei, per te
    note: 'Queste forme brevi legano la persona al verbo: *بهم* (a me), *بهت* (a te), *بهش* (a lui/lei).'
    example_gloss:
    - Ho un messaggio per Lei.
    - Sara ha un messaggio per lui/lei.
    - Nima ha un messaggio per me.
  fa.a2.unit39.lesson02.teach.request_verbs:
    title: Che cosa vuole che tu faccia
    gloss: chiamare, venire, rispondere, leggere
    note: 'Dopo *می‌خواد که* il secondo verbo è una forma di «tu» con *ب*: *بزنی*, *بیای*, *بدی*, *بخونی*.'
    example_gloss:
    - Sara vuole che tu la chiami.
    - Nima vuole che tu venga domani.
    - Il mio collega vuole che tu risponda.
    - Il mio amico vuole che tu legga il biglietto.
  fa.a2.unit39.lesson02.teach.call_forms:
    title: Chiamo, lui/lei chiama
    gloss: Chiamo, lui/lei chiama
    note: 'Il presente si usa anche per un progetto: *فردا زنگ می‌زنم* può significare «Domani chiamo / telefonerò domani».'
    example_gloss:
    - Domani chiamo.
    - Sara chiama domani.
  fa.a2.unit39.lesson02.teach.when_forms:
    title: Quando? Arrivi
    gloss: quando, arrivi
    note: '*کی* è una parola interrogativa. In una domanda riportata resta invariata: *می‌پرسه که کی می‌رسی*.'
    example_gloss:
    - Quando arrivi domani?
    - Il mio collega chiede quando arrivi.
    - Quando sei a casa?
  fa.a2.unit39.lesson02.teach.asks_whether:
    title: 'Riferire una domanda: می‌پرسه'
    gloss: Chiede se hai tempo. Chiede quando arrivi.
    note: 'Una domanda sì/no diventa *می‌پرسه که … یا نه*: *می‌پرسه که وقت داری یا نه*. La parola interrogativa resta al suo posto: *می‌پرسه که کی می‌رسی*. Il punto interrogativo scompare e il verbo resta al presente.'
  fa.a2.unit39.lesson02.teach.wants_you_to:
    title: 'Riferire una richiesta: می‌خواد که + forma con ب'
    gloss: Vuole che tu lo/la chiami.
    note: 'Per riferire una richiesta si usa *می‌خواد که* con un verbo con *ب*: *می‌خواد که بهش زنگ بزنی*. Non significa «vuole chiamare»: la desinenza *ـی* di «tu» indica che sei tu a dover agire. Il *که* si può omettere: *می‌خواد بهش زنگ بزنی*.'
  fa.a2.unit39.lesson03.teach.key_car:
    title: Chiave e auto
    gloss: chiave, auto, la mia chiave, la sua chiave, è l'auto
    note: 'Aggiungi *ـم* per «mio» e *ـش* per «suo»: *کلیدم*, *کلیدش*. In *تو ماشینه*, *تو* significa «dentro» e *ـه* significa «è».'
    example_gloss:
    - La mia chiave è in auto.
    - La sua chiave è in auto.
    - Sara ha un'auto.
  fa.a2.unit39.lesson03.teach.they_forms:
    title: Arrivano, hanno
    gloss: arrivano, hanno
    note: 'La desinenza di «loro» è *ـن*: *می‌رسن*, *دارن*, *می‌گن*.'
    example_gloss:
    - Arrivano tardi.
    - Domani hanno da lavorare.
  fa.a2.unit39.lesson03.teach.three_verbs:
    title: Affermazione, domanda o richiesta?
    gloss: Dice che domani ha tempo. Chiede se domani hai tempo. Vuole che tu lo/la chiami.
    note: Il verbo ti dice che tipo di messaggio è. *می‌گه* introduce un'affermazione e finisce con un verbo alla terza persona (*داره*). *می‌پرسه* introduce una domanda e il suo verbo riguarda «tu» (*داری*). *می‌خواد* introduce una richiesta ed è seguito da un verbo con *ب* (*بزنی*).
  fa.a2.unit39.lesson03.teach.person_shift:
    title: Cosa cambia quando riferisci
    gloss: Ho da lavorare. Dice che ha da lavorare. La mia chiave. La sua chiave.
    note: 'Quando riferisci, «io» del messaggio originale diventa «lui/lei». La desinenza verbale *ـم* diventa *ـه* (*دارم* → *داره*) e il possessivo *ـم* diventa *ـش* (*کلیدم* → *کلیدش*). Il persiano non distingue il genere, quindi *داره* significa sia «lui ha» sia «lei ha». Il tempo non cambia, come invece accade spesso in italiano: il presente resta presente.'
  fa.a2.unit39.lesson03.teach.says_vs_they_say:
    title: 'Una persona o più: می‌گه e می‌گن'
    gloss: Dice che arriva tardi. Dicono che arrivano tardi.
    note: 'Una sola lettera distingue una persona da più persone: *می‌گه … می‌رسه* (lui/lei) e *می‌گن … می‌رسن* (loro). Entrambi i verbi del discorso riportato devono concordare.'
  fa.a2.unit39.lesson04.teach.time_words:
    title: Adesso, stasera, riunione
    gloss: adesso, stasera, riunione
    note: '*جلسه* è una riunione, spesso di lavoro.'
    example_gloss:
    - Adesso ho una riunione.
    - Stasera sei a casa?
    - Stasera il mio collega ha una riunione.
  fa.a2.unit39.lesson04.teach.phone_phrases:
    title: Frasi per i messaggi al telefono
    gloss: Cosa dice il tuo collega? Cos'altro? Da parte di chi? Sì.
    note: Queste brevi frasi fanno andare avanti una conversazione sui messaggi.
  fa.a2.unit39.lesson04.teach.note_pattern:
    title: Un biglietto con un'affermazione e una domanda
    gloss: Il mio collega dice che oggi arriva tardi e chiede se sei a casa.
    note: 'In un biglietto scritto, unisci i due messaggi riportati con *و* e ripeti il verbo per ciascuno: *می‌گه که …* e *می‌پرسه که … یا نه*. Chi parla viene prima e non si ripete.'
  fa.a2.unit39.lesson05.teach.reading:
    title: Un biglietto per Nima
    gloss: Nima, ho un messaggio per te. Il tuo collega dice che oggi ha una riunione e arriva tardi. Chiede se domani hai tempo e vuole che tu lo/la chiami.
    note: Leggi una prima volta per capire chi manda il messaggio, poi una seconda per distinguere l'affermazione, la domanda e la richiesta.
  fa.a2.unit39.lesson06.teach.turn01:
    title: Sara ha un messaggio
    gloss: Sara dice a Nima che ha un messaggio per lui.
    note: L'apertura annuncia il messaggio.
  fa.a2.unit39.lesson06.teach.turn02:
    title: Nima chiede da parte di chi è
    gloss: Da parte di chi?
    note: Una breve domanda chiede chi è il mittente.
  fa.a2.unit39.lesson06.teach.turn03:
    title: Sara dice chi è il mittente e la prima affermazione
    gloss: Del tuo collega. Dice che oggi arriva tardi.
    note: Sara riferisce un'affermazione con *می‌گه که*.
  fa.a2.unit39.lesson06.teach.turn04:
    title: Nima chiede altro
    gloss: Cos'altro dice?
    note: '*دیگه چی* chiede la parte successiva.'
  fa.a2.unit39.lesson06.teach.turn05:
    title: Sara riferisce una domanda e una richiesta
    gloss: Chiede se domani hai tempo e vuole che tu lo/la chiami.
    note: Un messaggio riportato è una domanda; l'altro è una richiesta.
  fa.a2.unit39.lesson06.teach.turn06:
    title: Nima risponde
    gloss: Sì, domani ho tempo. Adesso lo/la chiamo.
    note: Nima risponde alla prima persona, perché parla per sé.
