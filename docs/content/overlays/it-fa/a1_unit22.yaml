teaching:
  fa.a1.unit22.lesson01.teach.phone_word:
    title: Telefono
    gloss: telefono
    note: تلفن è la parola generica per «telefono».
    example_gloss: Dov'è il mio telefono?
  fa.a1.unit22.lesson01.teach.message_word:
    title: Messaggio
    gloss: messaggio
    note: پیام è un messaggio scritto, un SMS.
    example_gloss: Ho un messaggio.
  fa.a1.unit22.lesson01.teach.call_word:
    title: Chiamare
    gloss: chiamare
    note: زنگ زدن (letteralmente «suonare») è il verbo di uso quotidiano per chiamare qualcuno.
    example_gloss: Chiamami.
  fa.a1.unit22.lesson01.teach.voice_word:
    title: Voce
    gloss: voce
    note: صدا significa voce e si usa per descrivere come si sente qualcuno al telefono.
    example_gloss: La tua voce va bene.
  fa.a1.unit22.lesson01.teach.va_word:
    title: E
    gloss: e
    note: و è la congiunzione più comune, che significa «e»; l'hai già vista nelle unità precedenti.
    target_text: و (e)
  fa.a1.unit22.lesson02.teach.hello_phone:
    title: Pronto (al telefono)
    gloss: pronto, dica
    note: الو è il saluto tipico del telefono (non si usa di persona); qui بفرمایید vuol dire più o meno «dica, ti ascolto».
  fa.a1.unit22.lesson02.teach.its_me:
    title: Sono io, Narges
    gloss: ciao, sono Narges
    note: '*منم* è *من* (io) più la desinenza verbale -م («sono»), quindi significa «sono io»: un modo molto comune di presentarsi al telefono. (La stessa grafia può anche significare «anch''io», cioè *من هم*; qui il contesto è chiaro.)'
  fa.a1.unit22.lesson03.teach.can_you_repeat:
    title: Puoi ripetere?
    gloss: può ripetere?
    note: می‌شه (forma colloquiale di می‌شود, «è possibile») + تکرار کنید (ripetere) è la forma standard e cortese per fare questa richiesta.
  fa.a1.unit22.lesson03.teach.speak_slower:
    title: Parli più lentamente, per favore
    gloss: per favore, parli più lentamente
    note: 'آهسته‌تر è il comparativo di آهسته (lentamente): «più lentamente».'
  fa.a1.unit22.lesson04.teach.message_for_you:
    title: Ho un messaggio per te
    gloss: ho un messaggio per te
    note: برات è la contrazione di برای (per) + ت («te», forma informale).
  fa.a1.unit22.lesson04.teach.tomorrow_four:
    title: Domani alle quattro vieni al bar
    gloss: domani alle quattro vieni al bar
    note: بیا è l'imperativo informale di آمدن (venire), formato dal solo radicale, come gli altri imperativi già visti nell'A1.
  fa.a1.unit22.lesson05.teach.goodbye_call:
    title: Ciao, ci sentiamo dopo
    gloss: ciao, ci sentiamo dopo
    note: 'بعداً significa dopo; صحبت می‌کنیم è il presente che indica anche il futuro: «parliamo / parleremo».'
  fa.a1.unit22.lesson05.teach.better_now:
    title: Ora va meglio?
    gloss: ora va meglio?
    note: الان significa «adesso»; بهتر شد significa letteralmente «è diventato migliore», la formulazione al passato che il persiano usa naturalmente per questa verifica, mentre in italiano si usa il presente («va meglio adesso?»).
  fa.a1.unit22.lesson06.teach.how_are_you:
    title: Ciao Narges, come stai?
    gloss: ciao Narges, come stai?
    note: '*چطوری* è il «come stai» informale, adatto qui perché Ali e Narges sono amici.'
  fa.a1.unit22.lesson06.teach.cutting_out:
    title: La tua voce va e viene
    gloss: la tua voce va e viene
    note: 'قطع و وصل می‌شه significa letteralmente «si interrompe e si collega»: è l''espressione persiana naturale per una linea che disturba.'
  fa.a1.unit22.lesson06.teach.turn01:
    title: Ali risponde
    gloss: 'Ali: Pronto, dica.'
  fa.a1.unit22.lesson06.teach.turn02:
    title: Narges si presenta
    gloss: 'Narges: Ciao Ali, sono Narges.'
  fa.a1.unit22.lesson06.teach.turn03:
    title: Ali ricambia il saluto
    gloss: 'Ali: Ciao Narges, come stai?'
  fa.a1.unit22.lesson06.teach.turn04:
    title: Narges gli chiede di parlare più lentamente
    gloss: 'Narges: Sto bene, grazie. Potresti parlare più lentamente, per favore? La tua voce va e viene.'
  fa.a1.unit22.lesson06.teach.turn05:
    title: Ali controlla
    gloss: 'Ali: Va bene, ora va meglio?'
  fa.a1.unit22.lesson06.teach.turn06:
    title: Narges dà il messaggio
    gloss: 'Narges: Sì, meglio. Ho un messaggio per te: domani alle quattro vieni al bar.'
  fa.a1.unit22.lesson06.teach.they_go:
    title: Loro vanno (informale)
    gloss: loro vanno (forma parlata)
    note: '*می‌رن* è la forma parlata informale di *می‌روند* (vanno), nello stesso registro colloquiale del resto del corso.'
    target_text: می‌رن (vanno, informale/colloquiale)
  fa.a1.unit22.lesson06.teach.turn07:
    title: Ali conferma
    gloss: 'Ali: Va bene, vengo di sicuro.'
  fa.a1.unit22.lesson06.teach.turn08:
    title: Narges chiude la chiamata
    gloss: 'Narges: Ciao, ci sentiamo dopo.'
  fa.a1.unit22.lesson06.teach.turn09:
    title: Ali saluta
    gloss: 'Ali: Ciao.'
