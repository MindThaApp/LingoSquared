teaching:
  fa.a2.unit43.lesson01.teach.foods:
    title: Al mercato
    gloss: mela, arancia, pane, dolce
    note: '*نون* è la forma parlata di *نان*.'
    example_gloss:
    - La mela costa poco.
    - L'arancia è cara.
    - Il pane è qui.
    - Il dolce è laggiù.
  fa.a2.unit43.lesson01.teach.pointing:
    title: Questo, quello, uno, quanto costa
    gloss: questo, quello, uno (tra questi), quanto costa
    note: '*این یکی* significa «questo», *اون یکی* «quello».'
    example_gloss:
    - Quanto costa questa mela?
    - Quell'arancia costa poco.
    - Questo è caro.
    - Quello costa poco.
  fa.a2.unit43.lesson01.teach.oneword:
    title: این e اون vanno prima del nome
    gloss: questa mela; quell'arancia; questo; quello
    note: '*این* indica qualcosa di vicino, *اون* qualcosa di lontano. Stanno prima del nome, senza cambiare con il genere. Per non ripetere il nome si usa *یکی*: *این یکی*, *اون یکی*.'
  fa.a2.unit43.lesson01.teach.want:
    title: 'Scegliere: voglio quello'
    gloss: Voglio quello; voglio questo
    note: 'Quando scegli una cosa precisa, dopo di essa va *رو*: *اون یکی رو می‌خوام*.'
  fa.a2.unit43.lesson02.teach.flowers:
    title: Fiori e libri
    gloss: fiore, libro, romanzo
    note: '*گل* significa fiore.'
    example_gloss:
    - Il fiore è bello.
    - Il libro è qui.
    - Il romanzo è laggiù.
  fa.a2.unit43.lesson02.teach.plural:
    title: این / اون + plurale
    gloss: queste mele; quei fiori; questi libri; quelle arance
    note: 'Aggiungi *‌ها* (con mezzo spazio) al nome e lascia *این* o *اون* davanti: *این سیب‌ها* significa «queste mele». Nel parlato *-ها* diventa spesso *-ا* (*سیبا*).'
  fa.a2.unit43.lesson02.teach.plural_use:
    title: Chiedere e scegliere al plurale
    gloss: Quanto costano queste mele? Voglio quei fiori.
    note: Anche un plurale che scegli prende *رو*. Dopo *این* o *اون* + plurale, la domanda con *چنده؟* è il modo abituale di chiedere il prezzo.
  fa.a2.unit43.lesson03.teach.bookshop:
    title: In libreria
    gloss: voglio, avete, datemi / mi dia
    note: '*دارید؟* è il «avete? / ha?» di cortesia e *بدید* il «mi dia» di cortesia.'
    example_gloss:
    - Voglio un libro.
    - Avete un romanzo?
    - Mi dia quel libro.
  fa.a2.unit43.lesson03.teach.indef:
    title: 'La desinenza -ی: un / un certo'
    gloss: Voglio un libro (uno qualsiasi); avete un romanzo?
    note: 'Aggiungi *ی* al nome quando intendi «un / uno qualunque» e non importa quale. Di solito non c''è *رو*: *کتابی می‌خوام*.'
  fa.a2.unit43.lesson03.teach.indef_def:
    title: Indeterminato o determinato?
    gloss: Voglio un libro. Voglio quel libro.
    note: 'Confronta: *کتابی* è un libro qualsiasi (senza *رو*); *اون کتاب رو* è un libro preciso (con *رو*).'
  fa.a2.unit43.lesson04.teach.shopwords:
    title: Qualcosa, panetteria, fioraio
    gloss: qualcosa, panetteria, fioraio
    note: '*چیزی* significa «qualcosa»; contiene già la *ی* indefinita finale.'
    example_gloss:
    - Voglio qualcosa.
    - La panetteria è laggiù.
    - Il fioraio è qui.
  fa.a2.unit43.lesson04.teach.yeh:
    title: 'یه ... ی: un po'' di, un certo'
    gloss: un po' di pane; un fiore; un dolce; qualcosa
    note: 'Nel parlato si combina spesso *یه* prima del nome con *ی* dopo di esso: *یه نونی*, *یه گلی*. Suona come «un qualche... / uno qualsiasi». Dopo una *ی* finale la desinenza si scrive *ای*: *یه شیرینی‌ای*.'
  fa.a2.unit43.lesson04.teach.yeh_use:
    title: Chiedere qualcosa di non specifico
    gloss: Mi dia un po' di pane. Voglio un fiore.
    note: Usa *یه ... ی* quando chiedi qualcosa e non importa quale, per esempio in panetteria o dal fioraio.
  fa.a2.unit43.lesson05.teach.reading:
    title: Una gita al mercato
    gloss: Oggi sono andato al mercato. Prima sono andato in panetteria. Ho comprato del pane. Poi sono andato dal fioraio. Ho visto quei fiori rossi. Questi fiori costavano poco, ma quelli costavano tanto. Ho comprato due fiori. Poi ho comprato anche un libro.
    note: Leggi una prima volta per i negozi, poi di nuovo per *این*, *اون* e le desinenze *-ی*.
  fa.a2.unit43.lesson06.teach.turn01:
    title: Il venditore saluta Sara
    gloss: 'Venditore: Prego. Che cosa desidera?'
    note: '*می‌خواید* è il «desidera / volete» di cortesia.'
  fa.a2.unit43.lesson06.teach.turn02:
    title: Sara chiede un fiore
    gloss: 'Sara: Vorrei un fiore. Quanto costano questi fiori?'
    note: '*یه گلی* è indeterminato; *این گل‌ها* indica «questi».'
  fa.a2.unit43.lesson06.teach.turn03:
    title: La venditrice confronta
    gloss: 'Venditore: Quei fiori rossi costano poco. Questo costa caro.'
    note: '*گل‌های قرمز*: nome plurale + aggettivo, uniti dall''ezafe (il suono di collegamento *-e*, scritto qui *ی* dopo la vocale).'
  fa.a2.unit43.lesson06.teach.turn04:
    title: Sara sceglie
    gloss: 'Sara: Voglio quello. Me ne dia due.'
    note: '*دو تا* significa «due (di essi)».'
  fa.a2.unit43.lesson06.teach.turn05:
    title: Il venditore consegna i fiori
    gloss: 'Venditore: Ecco a Lei.'
    note: '*بفرمایید* si dice quando si porge qualcosa.'
