teaching:
  fa.a2.unit38.lesson01.teach.polite_words:
    title: Formule di cortesia
    gloss: scusi, sa (forma di cortesia), non lo so
    note: '*ببخشید* introduce una domanda cortese a uno sconosciuto. *می‌دونید* è la forma di cortesia, con *شما*, di «sa».'
    example_gloss:
    - Scusi, sa che ore sono?
    - Non lo so, mi dispiace.
  fa.a2.unit38.lesson01.teach.places:
    title: Luoghi e un biglietto
    gloss: stazione, ufficio, museo, biblioteca, biglietto
    note: '*کتابخونه* è la forma parlata comune di «biblioteca»; nello scritto curato si usa *کتابخانه*.'
    example_gloss:
    - La stazione è lì.
    - L'ufficio è qui.
    - Il museo è lì.
    - La biblioteca è qui.
    - Il biglietto è qui.
  fa.a2.unit38.lesson01.teach.where_time:
    title: Dov'è? Che ore sono?
    gloss: dov'è, che ore sono, è qui, è lì
    note: '*ساعت چنده* serve a chiedere l''ora. *اینجاست* e *اونجاست* sono risposte brevi tipiche per indicare un luogo.'
    example_gloss:
    - Dov'è l'ufficio?
    - Che ore sono?
    - La biblioteca è qui.
  fa.a2.unit38.lesson01.teach.frame:
    title: 'La formula di cortesia: می‌دونید + domanda'
    gloss: Scusi, sa dov'è la stazione? Scusi, sa che ore sono?
    note: 'Per chiedere con cortesia a uno sconosciuto, metti *ببخشید، می‌دونید* davanti alla domanda normale. La domanda in sé non cambia: *ایستگاه کجاست؟* diventa *ببخشید، می‌دونید ایستگاه کجاست؟*.'
  fa.a2.unit38.lesson02.teach.open_closed:
    title: Aperto, chiuso, oggi, domani
    gloss: aperto, chiuso, oggi, domani
    note: '*باز* significa «aperto» e *بسته* significa «chiuso». *هست* afferma che una cosa è così.'
    example_gloss:
    - Oggi il museo è aperto.
    - Oggi l'ufficio è chiuso.
    - Domani il museo è aperto.
    - Domani la biblioteca è chiusa.
  fa.a2.unit38.lesson02.teach.when_or_not:
    title: Quando, o, no, sì
    gloss: quando, diventa / avviene, o, no / non, sì
    note: '*باز می‌شه* significa «apre»; *بسته می‌شه* significa «chiude». *نه* è «no» e chiude anche la coppia *یا نه* («o no»).'
    example_gloss:
    - Quando apre il museo?
    - È aperto o no?
    - Sì, è aperto.
  fa.a2.unit38.lesson02.teach.when_pattern:
    title: '«Quando» in una domanda indiretta: la parola interrogativa resta al suo posto'
    gloss: Sa quando apre il museo?
    note: 'In persiano non si sposta nulla: *موزه کی باز می‌شه؟* segue semplicemente *می‌دونید*, con lo stesso ordine delle parole della domanda diretta. La parola interrogativa *کی* resta esattamente dov''è nella domanda diretta.'
  fa.a2.unit38.lesson02.teach.whether_pattern:
    title: 'Sì/no in una domanda indiretta: ... یا نه'
    gloss: Sa se il museo è aperto (o no)?
    note: Per esprimere «se», prendi la frase semplice *موزه باز هست* e chiudila con *یا نه*. In italiano si aggiunge «se» davanti; in persiano si aggiunge *یا نه* alla fine.
  fa.a2.unit38.lesson03.teach.you_forms:
    title: Tu a un amico, Lei a uno sconosciuto
    gloss: tu (amico), Lei (cortesia), sai (amico)
    note: Sara e Nima sono amici, quindi dicono *تو* e *می‌دونی*. A uno sconosciuto si dice *شما* e *می‌دونید*.
    example_gloss:
    - Sara, sai dov'è l'ufficio?
    - Sa dov'è l'ufficio? (a uno sconosciuto)
  fa.a2.unit38.lesson03.teach.same_order:
    title: L'ordine delle parole non cambia
    gloss: Dov'è la stazione? Sa dov'è la stazione?
    note: 'La domanda diretta e quella indiretta hanno esattamente le stesse parole nello stesso ordine: *ایستگاه کجاست؟* / *می‌دونید ایستگاه کجاست؟*. Si aggiunge solo la formula di cortesia. In persiano la domanda non viene riorganizzata.'
  fa.a2.unit38.lesson03.teach.friend_stranger:
    title: می‌دونی o می‌دونید?
    gloss: sai (amico); sa (sconosciuto)
    note: Usa *می‌دونی* con un amico e *می‌دونید* con uno sconosciuto, un impiegato o chiunque si tratti con cortesia. Una domanda cortese a uno sconosciuto inizia anche con *ببخشید*.
  fa.a2.unit38.lesson03.teach.dont_know:
    title: 'Non so ...: un''affermazione, non una domanda'
    gloss: Non so dov'è la stazione; non so dov'è la stazione
    note: '*نمی‌دونم* regge la stessa domanda indiretta: *نمی‌دونم موزه کی باز می‌شه*. È un''affermazione, quindi non ha il punto interrogativo. Puoi aggiungere *که* dopo (*نمی‌دونم که ...*), ma il persiano parlato di solito lo omette.'
  fa.a2.unit38.lesson03.teach.ke:
    title: که (parola di collegamento facoltativa)
    gloss: che (parola di collegamento facoltativa)
    note: Qui *که* collega semplicemente *نمی‌دونم* alla domanda. Non aggiunge nulla al significato e di solito si omette.
    example_gloss:
    - Non so dov'è l'ufficio.
  fa.a2.unit38.lesson04.teach.directions:
    title: Indicazioni che puoi sentire
    gloss: dritto, vada (cortesia), lato/direzione, destra, sinistra, poi, e
    note: 'Uno sconosciuto risponde con imperativi di cortesia: *مستقیم برید* «vada dritto». *سمت راست* è «a destra» e *سمت چپ* «a sinistra».'
    example_gloss:
    - Vada dritto.
    - Vada a destra.
    - Vada dritto e poi a sinistra.
  fa.a2.unit38.lesson04.teach.times_thanks:
    title: Ore e ringraziamenti
    gloss: le otto, le cinque, grazie
    note: '*ساعت هشت* significa «alle otto». Di'' *ممنون* dopo ogni risposta.'
    example_gloss:
    - Il museo apre alle otto.
    - L'ufficio chiude alle cinque.
    - Grazie!
  fa.a2.unit38.lesson04.teach.package:
    title: Un unico pacchetto di cortesia
    gloss: Scusi, sa quando chiude l'ufficio?
    note: 'Costruisci ogni richiesta cortese in tre passi: *ببخشید*, poi *می‌دونید*, poi la domanda normale con la sua parola interrogativa (*کجاست*, *کی ... می‌شه*, *... هست یا نه*). Dentro la domanda non si sposta nulla.'
  fa.a2.unit38.lesson05.teach.greeting:
    title: Ciao e io
    gloss: salve, io
    note: '*من* serve raramente perché la desinenza del verbo significa già «io». Si aggiunge per dare risalto.'
    example_gloss:
    - Salve, io non lo so.
    - Domani io vado al museo.
  fa.a2.unit38.lesson05.teach.reading:
    title: Un breve messaggio per chiedere informazioni
    gloss: Salve. Scusi, sa dov'è l'ufficio? Sa se domani è aperto? Io non lo so. Grazie. Nima
    note: Leggi una prima volta per trovare le due domande, poi rileggi per vedere la formula di cortesia in ciascuna.
  fa.a2.unit38.lesson06.teach.passerby:
    title: Passante
    gloss: passante (uno sconosciuto per strada)
    note: 'Nota che la domanda indiretta segue allo stesso modo *می‌دونه* («lui/lei sa»): non si sposta nulla.'
    example_gloss:
    - Il passante sa dov'è l'ufficio.
  fa.a2.unit38.lesson06.teach.turn01:
    title: Sara chiede al suo amico
    gloss: 'Sara chiede a Nima, usando la forma per gli amici: Sai dov''è l''ufficio?'
    note: Usa *می‌دونی* perché sono amici.
  fa.a2.unit38.lesson06.teach.turn02:
    title: Nima chiede a uno sconosciuto
    gloss: Nima non lo sa, quindi chiede a un passante con la formula di cortesia.
    note: Passa a *می‌دونید* perché si rivolge a uno sconosciuto.
  fa.a2.unit38.lesson06.teach.turn03:
    title: Il passante gli dà indicazioni
    gloss: 'Sì: vada dritto. L''ufficio è sulla destra.'
    note: La risposta usa imperativi di cortesia.
  fa.a2.unit38.lesson06.teach.turn04:
    title: Nima chiede se è aperto
    gloss: Grazie. Sa se l'ufficio è aperto?
    note: La seconda domanda usa *یا نه*.
  fa.a2.unit38.lesson06.teach.turn05:
    title: È aperto e chiude alle cinque
    gloss: Sì, è aperto. Chiude alle cinque.
    note: 'Due informazioni: aperto adesso, chiude alle cinque.'
  fa.a2.unit38.lesson06.teach.turn06:
    title: Nima lo ringrazia e lo dice a Sara
    gloss: Grazie. Sara, l'ufficio è lì.
    note: Ringrazia lo sconosciuto e lo racconta al suo amico.
