      status: correct
    - value: قهوه
      status: correct
    feedback: Sono accettate sia چای sia قهوه.
  fa.a1.unit06.lesson02.exercise01.recognize_polite_order:
    instruction: Che cosa significa questa espressione?
    correct_option: Vorrei un tè. (cortese)
    distractors:
    - Voglio un tè. (informale)
    - Avete del tè?
    - Il tè è buono.
    accepted_answers:
    - value: Vorrei un tè. (cortese)
      status: correct
    feedback: می‌خواستم è la forma cortese per ordinare con qualcuno che non conosci bene.
  fa.a1.unit06.lesson02.exercise02.recognize_informal_order:
    instruction: یه چای می‌خوام va bene da dire a...
    correct_option: un caro amico che prepara il tè a casa
    distractors:
    - un cameriere appena conosciuto
    - un negoziante che non conosci
    - una persona anziana a una cena formale
    accepted_answers:
    - value: un caro amico che prepara il tè a casa
      status: correct
    feedback: می‌خوام è informale e colloquiale, riservato a contesti di confidenza.
  fa.a1.unit06.lesson02.exercise03.recognize_polite_order_reading:
