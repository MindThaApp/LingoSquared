    - Avete il menù?
    - Che cosa consigliate?
    accepted_answers:
    - value: Vorrei un tè, per favore. (cortese)
      status: correct
    feedback: یک چای می‌خواستم، لطفاً significa «Vorrei un tè, per favore» (cortese).
  fa.a1.unit06.lesson02.exercise04.match_register:
    instruction: Abbina ogni verbo per ordinare alla situazione in cui si usa.
    accepted_answers:
    - value:
        می‌خواستم: vorrei (cortese)
        می‌خوام: voglio (informale)
      status: correct
