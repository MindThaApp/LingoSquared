course:
  title: Persiano A1
  description: 'Persiano iraniano per principianti: cibi e bevande, ordinare con cortesia al ristorante, chiedere del menù e dei consigli, le quantità e l''etichetta al ristorante, compreso chiedere il conto.'
units:
  fa.a1.unit06.food:
    title: Il cibo e come ordinare un pasto
lessons:
  fa.a1.unit06.lesson01.food_and_drink_vocabulary:
    title: Cibo e bevande
  fa.a1.unit06.lesson02.polite_ordering_register:
    title: Ordinare con cortesia
  fa.a1.unit06.lesson03.menu_and_recommendation:
    title: Chiedere il menù e farsi consigliare
  fa.a1.unit06.lesson04.quantities:
    title: Ordinare quantità precise
  fa.a1.unit06.lesson05.restaurant_etiquette:
    title: Buone maniere al ristorante e il conto
  fa.a1.unit06.lesson06.restaurant_dialogue:
    title: Una conversazione completa al ristorante
teaching:
  fa.a1.unit06.lesson01.teach.naan:
    title: Pane
    gloss: pane
    note: 'نان è alla base di ogni pasto iraniano: di solito è pane piatto, servito con quasi tutto.'
    example_gloss: Mi piace il pane.
  fa.a1.unit06.lesson01.teach.berenj:
    title: Il riso
    gloss: riso
    note: برنج è al centro della maggior parte dei piatti principali iraniani.
    example_gloss: Il riso con il pollo è delizioso.
  fa.a1.unit06.lesson01.teach.morgh:
    title: Il pollo
    gloss: pollo
    note: مرغ significa sia l'animale sia la sua carne.
    example_gloss: Mangio il pollo.
  fa.a1.unit06.lesson01.teach.ab:
    title: L'acqua
    gloss: acqua
    note: آب è la parola comune per «acqua».
    example_gloss: Voglio dell'acqua.
  fa.a1.unit06.lesson01.teach.chai:
    title: Tè
    gloss: tè
    note: چای è la bevanda che si offre di default quasi ovunque in Iran, già incontrata nella lezione sul taarof dell'Unità 1.
    example_gloss: Un tè, per favore.
  fa.a1.unit06.lesson01.teach.ghahve:
    title: Caffè
    gloss: caffè
    note: قهوه è sempre più diffuso nelle città iraniane, accanto al tè.
    example_gloss: Il caffè è caldo.
  fa.a1.unit06.lesson01.teach.mive:
    title: La frutta
    gloss: frutta
    note: میوه è una parola generica che indica qualsiasi frutto.
    example_gloss: Mi piace la frutta.
  fa.a1.unit06.lesson01.teach.va_ya:
    title: E / o
    gloss: و (e), یا (o)
    note: Sono due congiunzioni comuni, usate per unire cibi e bevande in un'ordinazione.
    target_text: و (e)، یا (o)
  fa.a1.unit06.lesson02.teach.mikhastam_chai:
    title: Ordinare un tè con cortesia
    gloss: Vorrei un tè.
    note: می‌خواستم è letteralmente un passato di «volere», ma funziona come richiesta cortese e attenuata, il registro naturale con un cameriere o un negoziante che non conosci.
  fa.a1.unit06.lesson02.teach.lotfan:
    title: Per favore
    gloss: per favore
    note: لطفاً si può aggiungere a quasi ogni richiesta per renderla più gentile.
    example_gloss: Mi aiuti, per favore.
  fa.a1.unit06.lesson02.teach.mikham_informal:
    title: Ordinare un tè in modo informale
    gloss: Voglio un tè.
    note: 'یه چای می‌خوام usa یه (un/uno), forma colloquiale informale, e می‌خوام (voglio): riservalo a un amico stretto o a un familiare, non a un cameriere appena conosciuto.'
  fa.a1.unit06.lesson02.teach.register_note:
    title: Scegliere il verbo giusto per ordinare
    gloss: Usa می‌خواستم con uno sconosciuto o un cameriere; usa می‌خوام solo con un amico stretto.
    note: È la versione, applicata alle ordinazioni, della distinzione di registro già vista per i saluti nell'Unità 1.
  fa.a1.unit06.lesson02.teach.mikhastam_naan:
    title: Ordinare il pane con cortesia
    gloss: Vorrei del pane.
    note: Lo stesso schema con می‌خواستم vale per qualsiasi nome di cibo o bevanda.
  fa.a1.unit06.lesson03.teach.menu_word:
    title: Menù
    gloss: menù
    note: منو è un prestito e si usa come in italiano.
    example_gloss: Il menù, per favore.
  fa.a1.unit06.lesson03.teach.menu_question:
    title: Chiedere il menù
    gloss: Avete un menù?
    note: منو دارید؟ significa letteralmente «avete il menù?», il modo normale per chiederlo.
  fa.a1.unit06.lesson03.teach.recommend_question:
    title: Chiedere un consiglio
    gloss: Che cosa consiglia?
    note: چی توصیه می‌کنید؟ è una domanda naturale e comune da rivolgere al cameriere.
  fa.a1.unit06.lesson03.teach.waiter_question:
    title: Ciò che ti chiede il cameriere
    gloss: Che cosa desidera?
    note: چی میل دارید؟ è il modo cortese e standard con cui il cameriere apre lo scambio per l'ordinazione.
  fa.a1.unit06.lesson03.teach.jooje_kabab:
    title: Pollo kebab
    gloss: pollo kebab
    note: جوجه‌کباب (pollo marinato alla griglia) è uno dei piatti più comuni nei menù iraniani.
    example_gloss: Ordino il pollo kebab.
  fa.a1.unit06.lesson03.teach.khoobe:
    title: Il cameriere consiglia il piatto
    gloss: Oggi il pollo kebab è molto buono.
    note: خوبه è la contrazione parlata informale di خوب است, naturale in un consiglio detto con disinvoltura da un cameriere.
  fa.a1.unit06.lesson03.teach.bale_befarmaeed:
    title: Sì, prego
    gloss: Sì, prego.
    note: بله significa «sì»; بفرمایید (già visto nella lezione sul taarof dell'Unità 1) si usa di nuovo qui quando si porge qualcosa, come un menù.
  fa.a1.unit06.lesson04.teach.yek_livan:
    title: Un bicchiere di tè
    gloss: un bicchiere di tè
    note: لیوان (bicchiere) è il classificatore usato per le bevande servite in un bicchiere.
  fa.a1.unit06.lesson04.teach.do_ta_naan:
    title: Due pezzi di pane
    gloss: due pezzi di pane
    note: تا è un classificatore che segue il numero quando si contano la maggior parte delle cose numerabili, qui due pezzi di pane.
  fa.a1.unit06.lesson04.teach.yek_boshghab:
    title: Un piatto di riso
    gloss: un piatto di riso
    note: بشقاب (piatto) è la parola di conteggio per il cibo servito in un piatto.
  fa.a1.unit06.lesson04.teach.combined_order:
    title: Fare un ordine completo
    gloss: Un piatto di riso e due pezzi di pane, per favore.
    note: In un solo ordine si possono unire più quantità con و (e).
  fa.a1.unit06.lesson04.teach.se_ta:
    title: Il classificatore تا
    gloss: 'تا segue il numero con le cose numerabili: دو تا (due), سه تا (tre).'
    note: È lo stesso schema generale di conteggio studiato con i numeri nell'Unità 3, applicato qui alle ordinazioni di cibo.
  fa.a1.unit06.lesson05.teach.hesab_word:
    title: Il conto
    gloss: il conto
    note: صورت‌حساب è la parola standard per il conto del ristorante.
    example_gloss: Il conto, per favore.
  fa.a1.unit06.lesson05.teach.bill_request:
    title: Chiedere il conto
    gloss: Può portarmi il conto, per favore?
    note: صورت‌حساب رو لطف می‌کنید؟ è un modo cortese e naturale di chiedere il conto al ristorante.
  fa.a1.unit06.lesson05.teach.khoshmaze:
    title: Dire che il cibo era delizioso
    gloss: Era buonissimo.
    note: خیلی خوشمزه بود è un complimento naturale da fare al cameriere o a chi ti ospita dopo un pasto.
  fa.a1.unit06.lesson05.teach.nooshe_jan:
    title: Buon appetito
    gloss: Buon appetito
    note: نوش جان si dice a chi sta mangiando o sta per mangiare, più o meno come «buon appetito»; non lo dice chi mangia a proposito del proprio cibo.
  fa.a1.unit06.lesson05.teach.chashm:
    title: La risposta cortese del cameriere
    gloss: Subito.
    note: چشم، الان میارم è il modo rispettoso con cui il personale accoglie una richiesta e dice che la porterà subito.
  fa.a1.unit06.lesson06.teach.restaurant_word:
    title: Ristorante
    gloss: ristorante
    note: رستوران è la parola normale per «ristorante», l'ambientazione del dialogo di questa unità.
    example_gloss: Questo ristorante è buono.
  fa.a1.unit06.lesson06.teach.turn01:
    title: Il cameriere accoglie il cliente
    gloss: Il cameriere dà il benvenuto al cliente e gli chiede che cosa desidera.
    note: چی میل دارید؟ è la stessa domanda cortese di apertura della lezione 3.
  fa.a1.unit06.lesson06.teach.turn02:
    title: Il cliente chiede il menù
    gloss: Il cliente saluta il cameriere e chiede il menù.
    note: منو دارید؟ apre lo scambio per l'ordinazione.
  fa.a1.unit06.lesson06.teach.turn03:
    title: Il cameriere porge il menù
    gloss: Il cameriere conferma e porge il menù.
    note: بفرمایید è la stessa parola cortese di offerta dell'Unità 1, qui usata mentre si porge qualcosa a qualcuno.
  fa.a1.unit06.lesson06.teach.turn04:
    title: Il cliente chiede un consiglio
    gloss: Il cliente chiede che cosa consiglia il cameriere.
    note: چی توصیه می‌کنید؟ dalla lezione 3.
  fa.a1.unit06.lesson06.teach.turn05:
    title: Il cameriere consiglia un piatto
    gloss: Il cameriere dice che oggi il pollo kebab è molto buono.
    note: جوجه‌کباب امروز خیلی خوبه usa la forma informale خوبه, naturale nei consigli detti a voce.
  fa.a1.unit06.lesson06.teach.turn06:
    title: Il cliente fa un ordine completo
    gloss: Il cliente accetta e ordina un kebab di pollo con riso e anche un tè.
    note: می‌خواستم qui è usato perché è appropriato con un cameriere che il cliente non conosce di persona.
  fa.a1.unit06.lesson06.teach.turn07:
    title: Il cameriere conferma l'ordinazione
    gloss: Il cameriere dice che porta subito l'ordinazione.
    note: چشم، الان میارم dalla lezione 5.
  fa.a1.unit06.lesson06.teach.turn08:
    title: Il cliente fa un complimento al cibo e chiede il conto
    gloss: Il cliente dice che era buonissimo e chiede il conto.
    note: Entrambe le frasi riprendono direttamente il lessico della lezione 5.
  fa.a1.unit06.lesson06.teach.turn09:
    title: Il cameriere porta il conto
    gloss: Il cameriere acconsente e dice che lo porta subito.
    note: البته (certo) è una risposta affermativa cortese e naturale in questo caso.
