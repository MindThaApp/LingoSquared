  fa.a2.unit48.lesson02.exercise01.recognize_birthday:
    instruction: Che cosa significa questa frase?
    correct_option: Venerdì sono andato al compleanno di un mio amico.
    distractors:
    - Venerdì il mio amico è venuto al mio compleanno.
    - Venerdì vado al compleanno del mio amico.
    - Venerdì non sono andato al compleanno del mio amico.
    accepted_answers:
