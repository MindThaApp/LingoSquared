teaching:
  fa.a2.unit48.lesson01.teach.greet_words:
    title: Parole per aprire e chiudere
    gloss: ciao, come stai, che novità, scusa, a dopo
    note: Un messaggio amichevole inizia con *سلام* e il nome, poi spesso *خوبی؟* o *چه خبر؟*. *ببخش که ...* è una breve richiesta di scusa. *فعلا* chiude un messaggio come «a presto» o «ci sentiamo».
    example_gloss:
    - Ciao Nima, come stai?
    - Che novità?
    - Scusa se non ho chiamato.
    - A dopo, Sara
  fa.a2.unit48.lesson01.teach.time_words:
    title: Parole di tempo per un messaggio
    gloss: ieri, il fine settimana, venerdì, sabato, domani, più tardi
    note: 'Metti la parola di tempo all''inizio: dice al tuo amico se parli di ciò che è successo o di ciò che verrà dopo.'
    example_gloss:
    - Ieri ero stanco.
    - Nel fine settimana avevo da lavorare.
    - Venerdì sono andato al parco.
    - Ti chiamo domani.
    - Vengo sabato.
    - Ti chiamo più tardi.
  fa.a2.unit48.lesson01.teach.message_shape:
    title: La struttura di un messaggio amichevole
    gloss: Ciao Sara, come stai? Venerdì sono andato al parco. Domani voglio andare al cinema. A dopo, Nima
    note: 'Un messaggio informale ha quattro parti: saluto, cosa è successo (passato), cosa succederà (futuro) e chiusura. Frasi brevi e le forme parlate *می‌خوام* e *بهت* sono normali; non serve un''apertura da lettera formale.'
  fa.a2.unit48.lesson02.teach.birthday_gift:
    title: Compleanno e regalo
    gloss: compleanno (festa), regalo
    note: '*تولد* è il compleanno e, nel parlato, *رفتم تولد دوستم* significa anche «sono andato alla festa di compleanno del mio amico».'
    example_gloss:
    - Venerdì sono andato al compleanno di un mio amico.
    - Ho comprato un regalo per il mio amico.
    - Sara ha un regalo.
  fa.a2.unit48.lesson02.teach.celebration_words:
    title: Feste e congratulazioni
    gloss: festa, matrimonio, congratulazioni, felice / buon
    note: '*جشن* è una festa, *عروسی* è un matrimonio e *مبارک* segue l''occasione nelle brevi congratulazioni tra amici.'
    example_gloss:
    - Venerdì sono andato a una festa.
    - Il matrimonio era venerdì.
    - Buon compleanno, congratulazioni!
  fa.a2.unit48.lesson02.teach.message_news:
    title: Condividere notizie in un messaggio
    gloss: ho inviato, ho sentito, successo, grazie
    note: Usa queste parole per dire cosa hai inviato o sentito e per reagire al successo di un amico.
    example_gloss:
    - Ho inviato un messaggio.
    - Ho sentito la notizia.
    - Congratulazioni per il tuo successo!
  fa.a2.unit48.lesson02.teach.past_verbs:
    title: Verbi al passato per raccontare cos'è successo
    gloss: sono andato, ho visto, ho mangiato, sono venuto, sono rimasto, ho comprato, ho scritto, siamo andati
    note: 'La desinenza del passato è *ـم* per «io» e *ـیم* per «noi». Il negativo aggiunge *ن*: *نرفتم*, *نیومدم*, *نزدم*.'
    example_gloss:
    - Ieri sono andato al cinema.
    - Ho visto un film.
    - Ho cenato e sono tornato a casa.
    - Sabato sono rimasto a casa.
    - Ti ho scritto un messaggio.
    - Io e Sara siamo andati al parco.
  fa.a2.unit48.lesson02.teach.past_story:
    title: Raccontare gli eventi in ordine
    gloss: Venerdì sono andato al compleanno di un amico e ho comprato un regalo; siamo andati al cinema e poi abbiamo cenato
    note: Di' prima il tempo, poi gli eventi nell'ordine in cui sono accaduti. Uniscili con *و* e usa *بعدش* («dopo») per segnare il passo successivo. Ogni verbo resta al passato semplice.
  fa.a2.unit48.lesson03.teach.want_to:
    title: Dire cosa farai
    gloss: voglio andare, voglio venire, voglio comprare, voglio mangiare
    note: '*می‌خوام* più un verbo breve (*برم*, *بیام*, *بخرم*, *بخورم*) è il modo usuale per dire cosa farai. In un messaggio suona come un programma, non solo come un desiderio.'
    example_gloss:
    - Domani voglio andare al cinema.
    - Sabato voglio venire.
    - Voglio comprare un regalo.
    - Dopo il cinema voglio cenare.
  fa.a2.unit48.lesson03.teach.feelings_and_memories:
    title: Sentimenti e ricordi
    gloss: ricordo, triste/giù di morale, nostalgia di qualcuno, interessante
    note: '*ناراحت* dice che sei dispiaciuto o giù di morale, mentre *دلتنگ* dice che senti la mancanza di qualcuno. *جالب* descrive qualcosa di interessante.'
    example_gloss:
    - Il ricordo era interessante.
    - Ieri ero giù di morale.
    - Mi mancavi.
  fa.a2.unit48.lesson03.teach.plain_present:
    title: Il presente semplice per i programmi
    gloss: verrò, andrò, comprerò, ti chiamo
    note: Con una parola di tempo come *فردا* o *بعدا*, il presente semplice vale anche come futuro, come in italiano. Sia *می‌خوام برم* sia *می‌رم* vanno bene in un messaggio.
    example_gloss:
    - Vengo sabato.
    - Domani vado al parco.
    - Più tardi compro un regalo.
    - Ti chiamo domani.
  fa.a2.unit48.lesson03.teach.next_pattern:
    title: Cosa succederà dopo
    gloss: Domani voglio andare al cinema; dopo il cinema ti chiamo
    note: Metti prima la parola di tempo, poi il programma. Usa *بعد از* con un luogo o un evento (*بعد از سینما*) e *بعدش* quando il passo precedente è già chiaro.
  fa.a2.unit48.lesson04.teach.reasons:
    title: Motivi al passato
    gloss: ero stanco, avevo da lavorare, ero malato, il tempo era bello
    note: 'I motivi riferiti al passato usano il passato: *بودم*, *داشتم*. Il tempo atmosferico è alla terza persona: *هوا خوب بود*.'
    example_gloss:
    - Ieri ero stanco.
    - Nel fine settimana avevo da lavorare.
    - Sabato ero malato.
    - Venerdì il tempo era bello.
  fa.a2.unit48.lesson04.teach.because_so:
    title: Perché e quindi
    gloss: Siccome ero stanco, non sono venuto; ero stanco, quindi non sono venuto
    note: '*چون* introduce il motivo: *چون خسته بودم، نیومدم* oppure *نیومدم، چون خسته بودم*. *برای همین* introduce la conseguenza e viene dopo il motivo: *خسته بودم، برای همین نیومدم*. Non usare entrambi nella stessa frase.'
  fa.a2.unit48.lesson05.teach.reading:
    title: Un messaggio di Nima
    gloss: Ciao Sara, come stai? Scusa se non ho chiamato, ma nel fine settimana ho avuto molto da fare. Venerdì sono andato al compleanno di un amico e ho comprato un regalo. La festa è stata molto bella, ma sono tornato a casa tardi ed ero stanco. Per questo sabato non sono andato a lezione. Domani voglio andare al cinema e dopo il cinema ti chiamo. A dopo, Nima
    note: Leggi una prima volta per trovare le quattro parti (saluto, cosa è successo, cosa succederà, chiusura), poi una seconda volta per i motivi.
  fa.a2.unit48.lesson06.teach.turn01:
    title: Sara chiede novità
    gloss: Ciao Nima! Che novità? Cosa hai fatto nel fine settimana?
    note: Sara saluta Nima e gli chiede cosa ha fatto.
  fa.a2.unit48.lesson06.teach.turn02:
    title: Nima racconta cos'è successo
    gloss: Ciao Sara! Venerdì sono andato al compleanno di un mio amico. Ho comprato un regalo ed è stato molto bello.
    note: Nima usa il passato semplice per gli eventi.
  fa.a2.unit48.lesson06.teach.turn03:
    title: Sara chiede del sabato
    gloss: Fantastico! E sabato?
    note: Una breve domanda di seguito.
  fa.a2.unit48.lesson06.teach.turn04:
    title: Nima dà un motivo
    gloss: Sabato sono rimasto a casa, perché ero stanco.
    note: '*چون* dà il motivo.'
  fa.a2.unit48.lesson06.teach.turn05:
    title: Sara chiede di domani
    gloss: Cosa vuoi fare domani?
    note: Sara chiede del programma.
  fa.a2.unit48.lesson06.teach.turn06:
    title: Nima dice cosa farà dopo
    gloss: Domani voglio andare al cinema. Dopo il cinema ti chiamo.
    note: I programmi usano *می‌خوام* e il presente semplice.
  fa.a2.unit48.lesson06.teach.turn07:
    title: Sara chiude la conversazione
    gloss: Va bene. A dopo!
    note: La conversazione finisce con *فعلا*.
