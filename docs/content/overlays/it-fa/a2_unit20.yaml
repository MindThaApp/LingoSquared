course:
  title: Persiano A2
  description: 'Persiano dell''Iran di livello pre-intermedio con una struttura grammaticale solida: banca, opinioni, appuntamenti e altro ancora; ora impari a dire cosa farai: piani vicini, intenzioni, forse e di sicuro.'
units:
