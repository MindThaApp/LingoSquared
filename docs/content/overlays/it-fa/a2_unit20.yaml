    title: Progetti per le vacanze
lessons:
  fa.a2.unit20.lesson01.near_plans:
    title: 'Piani vicini: il presente con می‌'
  fa.a2.unit20.lesson02.intentions:
    title: 'Intenzioni: می‌خوام e قصد دارم'
  fa.a2.unit20.lesson03.maybe_and_certain:
    title: Forse, di sicuro e come dire di no
  fa.a2.unit20.lesson04.asking_about_plans:
    title: Chiedere dei progetti
  fa.a2.unit20.lesson05.reading_and_listening:
    title: Lettura e ascolto
  fa.a2.unit20.lesson06.holiday_conversation:
    title: Una conversazione sulle vacanze
teaching:
  fa.a2.unit20.lesson01.teach.holiday:
    title: Vacanza, estate
    gloss: vacanze, estate
    note: Nella lingua parlata *تابستون* è la forma abituale di *تابستان* (estate). *تعطیلات* sembra un plurale, ma è la parola normale per dire «una vacanza».
    example_gloss:
    - In estate ho le vacanze.
    - La vacanza è bellissima.
  fa.a2.unit20.lesson01.teach.when:
    title: La settimana prossima, l'anno prossimo, agosto
    gloss: la settimana prossima, l'anno prossimo, agosto (Mordad)
    note: '*بعد* dopo una parola di tempo significa «prossimo»: *هفته‌ی بعد*, *سال بعد*. *مرداد* è il mese iraniano che cade soprattutto in agosto.'
    example_gloss:
    - La settimana prossima ho un appuntamento.
    - L'anno prossimo vado a Isfahan.
    - A Mordad ho le vacanze.
  fa.a2.unit20.lesson01.teach.travel_verbs:
    title: Viaggiare, prenotare
    gloss: viaggiare, prenotare
    note: 'Entrambi sono nome + *کردن*: *سفر* (un viaggio) + *کردن* = viaggiare; *رزرو* (una prenotazione) + *کردن* = prenotare. Al presente il *می‌* va su *کردن*: *سفر می‌کنم*, *رزرو می‌کنم*.'
    example_gloss:
    - La settimana prossima viaggio.
    - Prenoto un hotel.
  fa.a2.unit20.lesson01.teach.north:
    title: Il nord, hotel
    gloss: il nord (la costa del Caspio), hotel
    note: '*شمال* (nord) è anche il nome con cui gli iraniani indicano la costa del Caspio, la classica meta delle vacanze estive: *می‌رم شمال* = «vado al nord (in vacanza)».'
    example_gloss:
    - In estate vado al nord.
    - Al nord prenoto un hotel.
  fa.a2.unit20.lesson01.teach.sister_mom:
    title: Con, mia sorella, mia mamma, mio fratello
    gloss: con, mia sorella, mia mamma, mio fratello
    note: 'La desinenza *-م* significa «mio/mia»: *خواهر* (sorella) diventa *خواهرم*, *مامان* diventa *مامانم*, *برادر* diventa *برادرم*.'
    example_gloss:
    - Vado al nord con mia sorella.
    - Sto a casa di mia mamma.
    - Viaggio con mio fratello.
  fa.a2.unit20.lesson01.teach.question:
    title: Cosa fai d'estate?
    gloss: Cosa fai d'estate?
    note: 'La stessa domanda che chiede «che cosa stai facendo?» chiede anche «che cosa farai?»: la parola di tempo (*تابستون*) mostra che si parla del futuro.'
  fa.a2.unit20.lesson01.teach.present_for_plans:
    title: I piani vicini usano il presente
    gloss: A Mordad vado al nord, prenoto un hotel.
    note: 'Il persiano non ha un tempo futuro d''uso quotidiano. Per i piani già stabiliti o vicini si usa il presente con *می‌* e si aggiunge una parola di tempo: *مرداد می‌رم شمال* è alla lettera «a Mordad vado al nord» e significa «andrò al nord a Mordad». La parola di tempo fa capire a chi ascolta che si parla del futuro. In italiano succede qualcosa di simile con il presente usato per il futuro.'
  fa.a2.unit20.lesson02.teach.course_money:
    title: Corso, soldi
    gloss: corso, soldi
    note: '*دوره* è un corso o una serie di lezioni: *یه دوره‌ی زبان* (un corso di lingua). *دوره‌ی* con *-ی* lo collega al nome che segue.'
    example_gloss:
    - Ho un corso di lingua.
    - Non ho soldi.
  fa.a2.unit20.lesson02.teach.later:
    title: Più tardi, tra un mese
    gloss: più tardi, tra un mese
    note: '*یه ماه دیگه* è alla lettera «ancora un mese» e significa «tra un mese». *بعدا* è un generico «più tardi».'
    example_gloss:
    - Più tardi vado al nord.
    - Tra un mese viaggio.
  fa.a2.unit20.lesson02.teach.want_course:
    title: Voglio seguire un corso.
    gloss: Voglio seguire un corso. / Ho intenzione di seguire un corso.
    note: '*می‌خوام* (voglio) più un secondo verbo nella forma breve con *be-*: *بگیرم* (da *گرفتن*, prendere). Entrambi i verbi hanno la desinenza *-م*: *می‌خوام بگیرم*. Lo stesso schema con *رفتن* (andare) dà *می‌خوام برم*.'
  fa.a2.unit20.lesson02.teach.want_house:
    title: Voglio cambiare casa.
    gloss: Voglio cambiare casa. / Ho intenzione di cambiare casa.
    note: '*خونه عوض کردن* significa cambiare casa. Nello schema con *می‌خوام* il verbo diventa *کنم*: *می‌خوام خونه عوض کنم*.'
  fa.a2.unit20.lesson02.teach.want_save:
    title: Voglio risparmiare.
    gloss: Voglio risparmiare. / Ho intenzione di risparmiare.
    note: '*پول جمع کردن* significa risparmiare (alla lettera «raccogliere soldi»). Stesso schema: *می‌خوام پول جمع کنم*.'
  fa.a2.unit20.lesson02.teach.qasd:
    title: Ho intenzione di seguire un corso.
    gloss: Ho intenzione di seguire un corso.
    note: '*قصد دارم* (ho intenzione di) è un po'' più formale di *می‌خوام*, ma è seguito dallo stesso verbo breve: *قصد دارم بگیرم*.'
  fa.a2.unit20.lesson02.teach.want_pattern:
    title: می‌خوام + un verbo breve
    gloss: voglio andare, voglio prendere, voglio risparmiare
    note: 'Per i progetti più lontani nel tempo o per i desideri, usa *می‌خوام* + un secondo verbo nella forma breve con *be-*: *برم* (andare), *بگیرم* (prendere), *بخرم* (comprare) e *کنم* (fare, come in *پول جمع کنم*). Entrambi i verbi hanno la stessa desinenza (*-م* per «io»): *می‌خوام برم*. Per i progetti vicini e già decisi usa invece il semplice presente: *فردا می‌رم*, ma *سال بعد می‌خوام یه دوره بگیرم*.'
  fa.a2.unit20.lesson03.teach.maybe_certain:
    title: Forse, sicuramente
    gloss: forse, sicuramente
    note: '*شاید* e *حتما* stanno all''inizio della frase e indicano quanto sei sicuro.'
    example_gloss:
    - Forse vado al cinema.
    - Ci vado di sicuro.
  fa.a2.unit20.lesson03.teach.this_year:
    title: Quest'anno, quest'estate
    gloss: quest'anno, quest'estate
    note: '*این* davanti a una parola di tempo significa «questo/questa»: *این تابستون*. *امسال* è una sola parola per «quest''anno».'
    example_gloss:
    - Quest'anno resto a casa.
    - Quest'estate lavoro.
  fa.a2.unit20.lesson03.teach.maybe_rule:
    title: «Forse» vuole il verbo breve
    gloss: Forse vado, ci vado di sicuro
    note: 'Dopo *شاید* si usa la forma breve con *be-* (*برم*), perché il progetto è solo una possibilità. Dopo *حتما* si usa il normale presente (*می‌رم*), perché il progetto è certo: *شاید برم سینما* ma *حتما می‌رم سینما*.'
  fa.a2.unit20.lesson03.teach.not_want:
    title: Non voglio
    gloss: Non voglio
    note: 'Metti *نـ* davanti a *می‌خوام* per dire che non vuoi o non hai intenzione di fare qualcosa: *نمی‌خوام برم*. Per un semplice progetto negativo, nega il presente: *می‌رم* diventa *نمی‌رم*.'
    example_gloss:
    - Non voglio cambiare casa.
    - Quest'anno non vado al nord.
    - Quest'estate non viaggio.
  fa.a2.unit20.lesson03.teach.later_cinema:
    title: Forse più tardi vado al cinema.
    gloss: Forse più tardi vado al cinema.
    note: La parola di tempo *بعدا* può stare tra *شاید* e il verbo.
  fa.a2.unit20.lesson04.teach.q_words:
    title: Dove, con chi, quante settimane
    gloss: dove, con chi, quante settimane
    note: '*با کی* significa letteralmente «con chi»: serve a chiedere con chi vai. *چند هفته* chiede la durata (quante settimane).'
    example_gloss:
    - Dove vai?
    - Con chi vai?
    - Quante settimane ti fermi?
  fa.a2.unit20.lesson04.teach.q_where:
    title: Dove vai?
    gloss: Dove vai?
    note: 'La parola interrogativa viene per prima e il verbo ha la desinenza *-ی* (tu): *می‌ری* (tu vai).'
  fa.a2.unit20.lesson04.teach.q_who:
    title: Con chi vai?
    gloss: Con chi vai?
    note: 'Rispondi con *با* + la persona + il verbo: *با خواهرم می‌رم*.'
  fa.a2.unit20.lesson04.teach.q_howlong:
    title: Quante settimane ti fermi?
    gloss: Quante settimane ti fermi?
    note: '*می‌مونی* è la forma per *tu* di *می‌مونم* (io resto).'
  fa.a2.unit20.lesson04.teach.durations:
    title: Una settimana, due settimane, due giorni
    gloss: una settimana, due settimane, due giorni
    note: 'Dopo un numero il nome resta al singolare: *دو هفته*, *دو روز*. *یه هفته* è «una settimana» nella lingua parlata.'
    example_gloss:
    - Resto una settimana.
    - Viaggio per due settimane.
    - Resto lì due giorni.
  fa.a2.unit20.lesson04.teach.you_forms:
    title: Tu vuoi, tu fai (forma breve)
    gloss: tu vuoi, tu fai (forma breve)
    note: '*می‌خوای* è la forma per *tu* di *می‌خوام*; anche il verbo breve che segue prende la desinenza di *tu*: *کنی* (da *کنم*), *بری* (da *برم*).'
    example_gloss:
    - Che cosa vuoi fare?
    - Vuoi andare?
  fa.a2.unit20.lesson04.teach.answer_pair:
    title: Tu vai / io vado
    gloss: Vai? Vado.
    note: Le domande usano la desinenza di *tu* *-ی* (*می‌ری*, *می‌مونی*, *می‌کنی*); la tua risposta usa la desinenza di *io* *-م* (*می‌رم*, *می‌مونم*, *می‌کنم*). Il tempo e il verbo restano gli stessi.
  fa.a2.unit20.lesson05.teach.spot_plans:
    title: Riconoscere il tipo di progetto
    gloss: vado, voglio, forse vado
    note: 'Quando leggi, fai attenzione a quanto è sicuro ogni progetto: un semplice presente con *می‌* (*می‌رم*) indica un progetto deciso, *می‌خوام* un''intenzione e *شاید* solo una possibilità.'
  fa.a2.unit20.lesson05.teach.reading_message:
    title: Un messaggio sulle vacanze
    gloss: Ciao! In estate ho le vacanze. A Mordad vado al nord con mia sorella. Restiamo una settimana in hotel. Poi vado due giorni a casa di mia mamma. L'anno prossimo voglio seguire un corso. Forse vado anche a Isfahan.
    note: Un breve messaggio sui progetti per l'estate. Leggilo una prima volta per capire i progetti, poi di nuovo per vedere quanto è certo ciascuno.
  fa.a2.unit20.lesson06.teach.names:
    title: Sara, Nima
    gloss: Sara, Nima
    note: I due amici delle unità precedenti.
    example_gloss:
    - Sara lavora a Tir.
    - Nima va in Turchia a Mordad.
  fa.a2.unit20.lesson06.teach.dlg1:
    title: Sara chiede delle vacanze
    gloss: Sara chiede a Nima cosa fa per le vacanze estive.
    note: La domanda tipica sui progetti per le vacanze.
  fa.a2.unit20.lesson06.teach.dlg2:
    title: Il progetto di Nima
    gloss: Nima dice che a Mordad va in Turchia e prenota un hotel.
    note: Due progetti già decisi, entrambi al presente con *می‌*.
  fa.a2.unit20.lesson06.teach.dlg3:
    title: Sara chiede con chi
    gloss: Sara dice che bello e chiede con chi va.
    note: '*با کی* chiede con chi va.'
  fa.a2.unit20.lesson06.teach.dlg4:
    title: Con chi e per quanto tempo
    gloss: Nima dice che va con suo fratello e che restano lì una settimana.
    note: 'Nella risposta si può omettere il verbo: basta *با برادرم*.'
  fa.a2.unit20.lesson06.teach.dlg5:
    title: Sara chiede dell'anno prossimo
    gloss: 'Sara chiede: e l''anno prossimo? Che cosa vuoi fare?'
    note: '*می‌خوای* è la forma per *tu* di *می‌خوام*; *کنی* è il verbo breve con la desinenza di *tu*.'
  fa.a2.unit20.lesson06.teach.dlg6:
    title: L'intenzione di Nima
    gloss: 'Nima dice che vuole seguire un corso e chiede a Sara: e tu?'
    note: Un'intenzione con *می‌خوام* e un verbo breve.
  fa.a2.unit20.lesson06.teach.dlg7:
    title: I progetti di Sara
    gloss: Sara dice che a Tir lavora e che forse dopo andrà da sua mamma.
    note: Un progetto deciso al presente e una possibilità con *شاید*.
  fa.a2.unit20.lesson06.teach.third_person:
    title: Lui/lei va, resta, fa, vuole
    gloss: lui/lei va, resta, fa, vuole
    note: 'Per riferire il progetto di un''altra persona si usa la desinenza di *lui/lei* *-ه* al presente (*می‌ره*, *می‌مونه*, *می‌کنه*). *می‌خواد* è la forma di *lui/lei* di *می‌خوام*, e anche il verbo breve che segue termina in *-ه*: *می‌خواد بره*, *می‌خواد بگیره*.'
    example_gloss:
    - Nima vuole seguire un corso.
    - Sara vuole andare a casa di sua mamma.
