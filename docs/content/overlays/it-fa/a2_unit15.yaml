course:
  title: Persiano A2
  description: 'Farsi iraniano di livello pre-intermedio: gestire il ritardo di un treno, cioè capire un annuncio di disservizio, chiedere con cortesia a un dipendente della stazione un percorso alternativo e leggere un avviso scritto sullo stesso ritardo.'
units:
  fa.a2.unit15.travel_disruption:
    title: Problemi di viaggio
