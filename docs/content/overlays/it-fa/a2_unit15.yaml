  fa.a2.unit15.lesson01.travel_disruption_vocabulary:
    title: Parole del ritardo
  fa.a2.unit15.lesson02.asking_about_alternatives:
    title: Chiedere di un percorso alternativo
  fa.a2.unit15.lesson03.reading_a_station_notice:
    title: Leggere un avviso di stazione
  fa.a2.unit15.lesson04.station_counter_dialogue:
    title: Allo sportello della stazione
teaching:
  fa.a2.unit15.lesson01.teach.train_word:
    title: Treno
    gloss: il treno
    note: '*قطار* è la parola generica per «treno».'
    example_gloss: Il mio treno parte alle nove.
  fa.a2.unit15.lesson01.teach.delay_word:
    title: Il ritardo
    gloss: ritardo
    note: '*تاخیر* è la parola generica per «ritardo».'
    example_gloss: Oggi il treno è in ritardo.
  fa.a2.unit15.lesson01.teach.platform_word:
    title: Binario
    gloss: binario
    note: '*سکو* è la parola per «binario» (banchina); *سکوی* è la sua forma con ezafe davanti a un numero, ad es. *سکوی سه* (binario tre).'
    example_gloss: Il treno parte dal binario tre.
  fa.a2.unit15.lesson01.teach.cancel_word:
    title: Cancellato
    gloss: cancellato
    note: '*لغو* è la parola per «cancellato»; *لغو شدن* (essere cancellato) è il verbo composto formato con essa.'
    example_gloss: Il biglietto del treno è stato cancellato.
  fa.a2.unit15.lesson01.teach.announcement_word:
    title: Annuncio
    gloss: annuncio
    note: '*اعلامیه* è la parola per un annuncio o avviso scritto.'
    example_gloss: Questo annuncio è molto importante.
  fa.a2.unit15.lesson01.teach.alternative_route_word:
    title: Percorso alternativo
    gloss: percorso alternativo
    note: '*مسیر جایگزین* unisce *مسیر* (percorso) e *جایگزین* (alternativo/sostitutivo).'
    example_gloss: Il percorso alternativo parte dal binario cinque.
  fa.a2.unit15.lesson01.teach.recap_numbers_time:
    title: Orari e numeri di questa unità
    gloss: le nove, le dieci, tre, cinque
    note: Riepilogo dei numeri e degli orari necessari per la situazione di questa unità.
  fa.a2.unit15.lesson02.teach.when_does_it_leave:
    title: Scusi, quando parte il treno?
    gloss: Scusi, quando parte il treno?
    note: '*ببخشید* introduce con cortesia una domanda a uno sconosciuto o a un dipendente.'
  fa.a2.unit15.lesson02.teach.is_there_an_alternative:
    title: C'è un percorso alternativo?
    gloss: C'è un percorso alternativo?
    note: '*هست؟* («c''è?») è la domanda di base sull''esistenza, usata per chiedere se qualcosa è disponibile.'
  fa.a2.unit15.lesson02.teach.full_alternative_question:
    title: Chiedere con cortesia di un'alternativa più rapida
    gloss: Scusi, c'è un percorso alternativo per arrivare prima?
    note: '*که زودتر برسم* («per arrivare prima») aggiunge lo scopo alla semplice domanda sull''esistenza.'
  fa.a2.unit15.lesson03.teach.because_of_note:
    title: A causa di (+ nome)
    gloss: a causa di ...
    note: '*به خاطر* è seguito direttamente da un NOME (*به خاطر مشکل فنی*, a causa di un problema tecnico), a differenza di *چون*, che introduce una frase completa.'
  fa.a2.unit15.lesson03.teach.technical_problem_word:
    title: Problema tecnico
    gloss: problema tecnico
    note: '*مشکل فنی* è l''espressione standard per «problema tecnico», frequente negli annunci di viaggio.'
    example_gloss: Il treno è in ritardo a causa di un problema tecnico.
  fa.a2.unit15.lesson03.teach.notice_text:
    title: Un avviso di stazione su un ritardo
    gloss: 'Attenzione: il treno delle nove per Isfahan è in ritardo di un''ora a causa di un problema tecnico e parte alle dieci dal binario tre. L''autobus sostitutivo parte alle nove e mezza dal binario cinque.'
    note: Un breve avviso ufficiale di stazione in stile scritto neutro, che però usa ancora le desinenze verbali del parlato quotidiano (*داره*, *می‌کنه*).
  fa.a2.unit15.lesson04.teach.i_will_wait:
    title: Aspetto il treno
    gloss: Aspetto il treno.
    note: '*منتظر ... می‌مونم* (resto in attesa di ...) è il modo standard per dire che aspetterai qualcosa.'
  fa.a2.unit15.lesson04.teach.turn01:
    title: نیما chiede quando parte il treno
    gloss: نیما chiede con cortesia quando parte il treno delle nove per Isfahan.
    note: Riutilizza la frase di apertura di questa lezione.
  fa.a2.unit15.lesson04.teach.turn02:
    title: Il کارمند spiega il ritardo
    gloss: L'impiegato dice che purtroppo, a causa di un problema tecnico, il treno ha un'ora di ritardo e ora parte alle dieci dal binario tre.
    note: '*متاسفانه* («purtroppo») attenua la comunicazione di una cattiva notizia.'
  fa.a2.unit15.lesson04.teach.turn03:
    title: نیما chiede di un'alternativa
    gloss: نیما chiede se c'è un percorso alternativo per arrivare prima.
    note: Riprende la domanda completa sul percorso alternativo della lezione 2.
  fa.a2.unit15.lesson04.teach.turn04:
    title: کارمند propone il bus alternativo
    gloss: 'L''impiegato dice di sì: un autobus parte alle nove e mezza dal binario cinque, ma Nima dovrebbe comprare un nuovo biglietto.'
    note: '*باید ... بخرید* (dovrebbe comprare) indica il costo reale dell''alternativa.'
  fa.a2.unit15.lesson04.teach.turn05:
    title: نیما rifiuta e aspetta
    gloss: 'نیما dice di no, non c''è problema: aspetterà il treno.'
    note: '*مشکلی نیست* (non c''è problema / va bene così) è un modo cortese per rifiutare l''offerta.'
  fa.a2.unit15.lesson04.teach.turn06:
    title: کارمند conferma il programma
    gloss: 'L''impiegato dice: d''accordo, allora alle dieci aspetti al binario tre.'
    note: '*پس* (quindi / allora) trae la conclusione da ciò che نیما ha appena deciso.'
