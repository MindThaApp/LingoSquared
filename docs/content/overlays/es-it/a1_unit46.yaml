    title: Cercare y usare son regulares
    gloss: 'Cercare y usare son verbos regulares en -are: io cerco, tu cerchi; io uso, tu usi. Cercare añade una h delante de la i.'
    note: La h de *cerchi* mantiene el sonido duro de la c; en español pasa algo parecido con c/qu (busco, busqué). Compara *cerco* (io) y *cerchi* (tu).
  it.a1.unit46.lesson03.teach.luca_cerca_le:
