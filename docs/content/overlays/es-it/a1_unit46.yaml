    gloss: 'Marco: ¡Sí, y el sábado hace sol!'
  it.a1.unit46.lesson06.teach.luca_io_corro:
    title: El plan de Luca
    gloss: 'Luca: Yo correré. Luego también jugaré al fútbol.'
    note: '*Poi* (luego) ordena las acciones. *Gioco a calcio*: *giocare a* + deporte.'
  it.a1.unit46.lesson06.teach.chiara_io_preferisco:
    title: El plan de Chiara
    gloss: 'Chiara: Yo prefiero nadar, pero yo también vengo al parque.'
    note: '*Preferisco nuotare* (prefiero nadar) es la forma directa de expresar una preferencia. *Anch''io* (yo también) es una sola palabra con apóstrofo.'
  it.a1.unit46.lesson06.teach.giulia_bello_a:
    title: Giulia cierra la conversación
    gloss: 'Giulia: ¡Qué bien! ¡Hasta el sábado en el parque!'
    note: Cierra en una sola línea el hilo de mensajes de esta unidad y el plan de la unidad de deportes.
