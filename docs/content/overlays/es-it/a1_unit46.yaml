    note: Amplía la fórmula de despedida de la unidad de saludos a un día concreto.
  it.a1.unit46.lesson05.teach.giulia_chiama_marco:
    title: ¿Quién usa qué?
    gloss: Giulia llama a Marco todos los días. Usa el teléfono y ninguna app. Marco no tiene computadora en casa, pero usa internet en el teléfono. Luca busca el pronóstico del tiempo cada mañana. Luego va a correr. Chiara envía a menudo un mensaje a Giulia. ¿Tú usas el teléfono todos los días?
    note: Compara los hábitos tecnológicos de los cuatro personajes, con la misma forma que la lectura comparativa de la unidad de deportes.
