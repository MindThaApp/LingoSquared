teaching:
  it.a1.unit42.lesson01.teach.alto_basso:
    title: Alto y bajo
    gloss: alto / bajo
    note: '*Alto* describe a una persona alta y *basso* a una baja. Como en español, los adjetivos italianos concuerdan con la persona: *alto/alta*, *basso/bassa*.'
    example_gloss:
    - Chiara es alta.
    - Luca es bajo.
  it.a1.unit42.lesson01.teach.anziano_giovane:
    title: Viejo y joven
    gloss: viejo / joven
    note: '*Anziano* (mayor, anciano) y *giovane* (joven) dan una impresión general, no un número exacto de años. *Giovane* termina en -e, así que es igual para hombres y mujeres.'
    example_gloss:
    - El abuelo es viejo.
    - Marco es joven.
  it.a1.unit42.lesson01.teach.per_l_eta:
    title: 'Edad: avere anni o anziano'
    gloss: 'Para la edad exacta el italiano usa avere + anni, como el español «tener + años»: Quanti anni hai? Para una impresión general usa un adjetivo: Il nonno è anziano.'
    note: Igual que en español («tengo 30 años»), el italiano dice *ho trent'anni*, literalmente «tengo treinta años». El adjetivo *anziano* sirve para cómo parece una persona de edad.
  it.a1.unit42.lesson01.teach.chiara_e_alta:
    title: Chiara es alta y Luca es bajo
    gloss: Chiara es alta y Luca es bajo.
    note: 'Dos adjetivos unidos con *e* (y). Cada uno concuerda con su persona: *alta* (femenino) y *basso* (masculino).'
  it.a1.unit42.lesson02.teach.i_capelli:
    title: El pelo
    gloss: el pelo
    note: A diferencia del español («el pelo»), *i capelli* es plural en italiano, como «los cabellos». El singular *il capello* es un solo cabello.
    example_gloss: Marco tiene el pelo corto y negro.
  it.a1.unit42.lesson02.teach.biondi_castani_grigi:
    title: Rubio, castaño y gris
    gloss: rubio / castaño / gris
    note: 'Tres colores de pelo en masculino plural para concordar con *capelli*: *biondi*, *castani*, *grigi*. *Neri* (negro) también se usa para el pelo.'
    example_gloss:
    - Giulia tiene el pelo rubio.
    - Luca tiene el pelo castaño.
    - El abuelo tiene el pelo gris.
  it.a1.unit42.lesson02.teach.lunghi_corti:
    title: Largo y corto (pelo)
    gloss: largo / corto (pelo)
    note: '*Lunghi* (largo) y *corti* (corto) son plurales como *capelli*. La palabra *alto* se usa solo para personas, no para el pelo.'
    example_gloss:
    - Chiara tiene el pelo largo.
    - Luca tiene el pelo corto.
  it.a1.unit42.lesson02.teach.i_capelli_sono:
    title: Capelli es plural
    gloss: 'Capelli es plural, así que el adjetivo también va en plural: i capelli biondi, castani, grigi, neri, lunghi, corti.'
    note: 'El adjetivo va después del sustantivo y concuerda en género y número: *capelli lunghi* (masculino plural), *occhi azzurri*.'
  it.a1.unit42.lesson02.teach.per_descrivere_una:
    title: El pelo y los ojos llevan avere
    gloss: 'Para describir a una persona el italiano usa avere con el pelo y los ojos: Giulia ha i capelli biondi e gli occhi azzurri.'
    note: 'Como en español («tiene el pelo rubio»), el italiano también lleva artículo: *i capelli*, *gli occhi*. También se puede decir *è bionda*, pero aquí lo que hay que aprender es el patrón con *avere*.'
  it.a1.unit42.lesson02.teach.marco_ha_i:
    title: Marco tiene el pelo corto y negro
    gloss: Marco tiene el pelo corto y negro.
    note: '*Neri* (negro) es masculino plural y concuerda con *capelli*.'
  it.a1.unit42.lesson02.teach.giulia_ha_i:
    title: Giulia tiene el pelo largo y rubio
    gloss: Giulia tiene el pelo largo y rubio.
    note: Combina el vocabulario de longitud y de color de esta lección en una frase natural.
  it.a1.unit42.lesson03.teach.gli_occhi:
    title: Los ojos
    gloss: los ojos
    note: '*Occhio* (ojo) es masculino; el plural es *occhi* y lleva *gli* porque empieza por vocal.'
    example_gloss: Marco tiene los ojos marrones.
  it.a1.unit42.lesson03.teach.azzurri_marroni_verdi:
    title: Azul, marrón y verde
    gloss: azul / marrón / verde
    note: 'Colores de ojos: *azzurri* (azules), *marroni* (marrones), *verdi* (verdes). Estas formas plurales sirven para los dos géneros.'
    example_gloss:
    - Giulia tiene los ojos azules.
    - Luca tiene los ojos marrones.
    - Chiara tiene los ojos verdes.
  it.a1.unit42.lesson03.teach.anche_gli_occhi:
    title: Los colores concuerdan en plural
    gloss: 'Los colores de los ojos van en plural para concordar con occhi: occhi azzurri, marroni, verdi.'
    note: 'Los adjetivos que terminan en -e en singular (*verde*, *marrone*) terminan en -i en plural: *verdi*, *marroni*.'
  it.a1.unit42.lesson03.teach.com_e_giulia:
    title: ¿Cómo es Giulia?
    gloss: ¿Cómo es Giulia?
    note: '*Com''è?* es la pregunta clave para el aspecto. *Com''è* es *come è* con un apóstrofo en lugar de la e.'
  it.a1.unit42.lesson03.teach.giulia_ha_i:
    title: Giulia tiene el pelo largo y rubio y los ojos azules
    gloss: Giulia tiene el pelo largo y rubio y los ojos azules.
    note: 'Una respuesta modelo: *avere* + pelo + *e* + ojos en una sola frase.'
  it.a1.unit42.lesson04.teach.giulia_al_caffe:
    title: Giulia presenta a Nina
    gloss: 'Giulia: Viene una chica nueva al café de idiomas. Se llama Nina.'
    note: '*Viene* (viene) presenta a alguien nuevo. *Si chiama* significa «se llama», igual que en español.'
  it.a1.unit42.lesson04.teach.marco_va_bene:
    title: Marco pregunta cómo es
    gloss: 'Marco: ¡Vale! ¿Cómo es?'
    note: 'La misma pregunta otra vez, sin nombre: el sujeto se entiende por el contexto.'
  it.a1.unit42.lesson04.teach.giulia_e_bassa:
    title: Giulia describe la estatura y el pelo de Nina
    gloss: 'Giulia: Es baja y tiene el pelo corto y rubio.'
    note: '*È bassa* (es baja) usa el femenino *bassa*; la descripción del pelo sigue con *ha*.'
  it.a1.unit42.lesson04.teach.marco_e_gli:
    title: Marco pregunta por los ojos
    gloss: 'Marco: ¿Y los ojos?'
    note: Como en español («¿Y los ojos?»), *E gli occhi?* omite el verbo. El italiano suele dejar fuera las palabras que el contexto aclara.
  it.a1.unit42.lesson04.teach.giulia_ha_gli:
    title: Giulia describe los ojos de Nina
    gloss: 'Giulia: Tiene los ojos verdes.'
    note: '*Ha gli occhi verdi*: no hace falta pronombre sujeto porque la terminación del verbo ya indica que es «ella», como en español.'
  it.a1.unit42.lesson04.teach.marco_grazie_allora:
    title: Marco la reconocerá
    gloss: 'Marco: ¡Gracias! Entonces la reconoceré.'
    note: '*La riconosco* (la reconozco): el pronombre de objeto *la* va delante del verbo, como en español.'
  it.a1.unit42.lesson05.teach.luca_e_chiara:
    title: Comparamos a Luca y Chiara
    gloss: Luca y Chiara son hermanos, pero se ven muy diferentes. Luca es bajo y tiene el pelo corto y castaño y los ojos marrones. Chiara es más alta que Luca y tiene el pelo largo y castaño y los ojos verdes. ¿Cómo eres tú?
    note: Una breve comparación que reúne todas las palabras de color y de longitud vistas hasta ahora y termina con la pregunta clave de la unidad dirigida al lector.
    glosses:
      fratello: hermano
      sorella: hermana
      sembrano: parecen
      diversi: diferentes
      basso: bajo
      corti: bajo
      castani: castaño
      capelli: pelo
      marroni: castaño
      occhi: ojos
      alta: alta (più alta = más alta)
      lunghi: largo
      verdi: verdes
      come: cómo (Tu come sei? = ¿Cómo eres tú?)
  it.a1.unit42.lesson05.teach.il_comparativo_si:
    title: 'Comparar: più ... di'
    gloss: 'A diferencia del español («más alta que Luca»), el italiano compara con più + adjetivo + di: Chiara è più alta di Luca.'
    note: 'Pon *più* delante del adjetivo y *di* delante de la persona con la que comparas. El adjetivo conserva su género: *più alta*, *più alto*.'
  it.a1.unit42.lesson05.teach.chiara_ha_i:
    title: Chiara tiene el pelo más largo que Luca
    gloss: Chiara tiene el pelo más largo que Luca.
    note: '*I capelli più lunghi di Luca*: el adjetivo sigue en plural para concordar con *capelli*.'
  it.a1.unit42.lesson05.teach.ho_i_capelli:
    title: Tengo el pelo corto y castaño
    gloss: Tengo el pelo corto y castaño.
    note: '*Ho i capelli corti e castani*: usa *avere* para describir tu propio aspecto.'
  it.a1.unit42.lesson06.teach.marco_guarda_e:
    title: Marco ve a Nina
    gloss: 'Marco: Mira, ¿esa es Nina? Tiene el pelo corto y rubio y los ojos verdes.'
    note: '*Guarda* (mira) es el imperativo de *tu*. *Quella* significa «esa» o «aquella» cuando se habla de una mujer o una chica.'
  it.a1.unit42.lesson06.teach.giulia_si_e:
    title: Giulia lo confirma
    gloss: 'Giulia: ¡Sí, es Nina!'
    note: Una confirmación breve y natural.
  it.a1.unit42.lesson06.teach.nina_ciao_sei:
    title: Nina saluda a Marco
    gloss: 'Nina: Hola, ¿eres Marco?'
    note: '*Sei Marco?* es la pregunta informal: *sei* es la forma de *tu* de *essere*, así que no hace falta *tu*.'
  it.a1.unit42.lesson06.teach.marco_si_piacere:
    title: Marco saluda a Nina
    gloss: 'Marco: ¡Sí! Encantado de conocerte, Nina.'
    note: '*Piacere di conoscerti* es la fórmula para conocer a alguien por primera vez; *-ti* significa «te».'
  it.a1.unit42.lesson06.teach.nina_piacere_mio:
    title: Nina responde al saludo
    gloss: 'Nina: ¡Encantada de conocerte también!'
    note: 'Cierra el diálogo: Marco reconoció a Nina gracias a la descripción que hizo Giulia antes.'
