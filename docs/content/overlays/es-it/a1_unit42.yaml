course:
  title: Italiano A1
  description: 'Italiano para principiantes para describir el aspecto físico básico de una persona: impresiones de estatura y edad, color del pelo y de los ojos, la pregunta clave Com''è? y la comparación del aspecto de dos personas.'
units:
