teaching:
  it.a1.unit22.lesson01.teach_felice_triste:
    title: felice, triste
    gloss: feliz, triste
    note: '*Felice* y *triste* terminan en *-e*, así que la misma forma sirve para masculino y femenino (*Sam è felice*, *Elena è felice*), como «feliz» y «triste» en español.'
    example_gloss:
    - Hoy estoy feliz.
    - Hoy estoy triste.
  it.a1.unit22.lesson01.teach_stanco_nervoso:
    title: stanco, nervoso
    gloss: cansado, nervioso
    note: Como en español («cansado/cansada»), estos adjetivos cambian de terminación; en esta unidad se presentan las formas masculinas del diccionario.
    example_gloss:
    - Sam está cansado.
    - Hoy estoy nervioso.
  it.a1.unit22.lesson01.teach_come_ti_senti:
    title: Come ti senti?
    gloss: ¿Cómo te sientes?
    note: '*Ti senti* es la forma informal de «te sientes», la que se usa con un amigo.'
    example_gloss:
    - ¿Cómo te sientes hoy?
  it.a1.unit22.lesson01.teach_sono_felice:
    title: Sono felice.
    gloss: Estoy contento.
    note: Se usa *sono* seguido de un adjetivo de sentimiento.
    example_gloss:
    - Hoy estoy feliz.
  it.a1.unit22.lesson02.teach_perche:
    title: perché
    gloss: porque / por qué
    note: En esta unidad *perché* da la causa de un sentimiento.
    example_gloss:
    - Estoy feliz porque hoy hace sol.
  it.a1.unit22.lesson02.teach_sono_felice_perche:
    title: Sono felice perché oggi c'è il sole.
    gloss: Estoy feliz porque hoy hace sol.
    note: Es una oración completa con un sentimiento y su causa.
    example_gloss:
    - En Milán, estoy feliz porque hoy hace sol.
  it.a1.unit22.lesson02.teach_sono_un_poco_stanca:
    title: Sono un po' stanca.
    gloss: Estoy un poco cansado.
    note: '*Stanca* es femenino aquí porque lo dice Elena.'
    example_gloss:
    - Hoy estoy un poco cansada.
  it.a1.unit22.lesson02.teach_ma_sto_bene:
    title: ma sto bene
    gloss: pero estoy bien
    note: '*Ma* contrasta el cansancio con encontrarse bien.'
    example_gloss:
    - Estoy cansado, pero estoy bien.
