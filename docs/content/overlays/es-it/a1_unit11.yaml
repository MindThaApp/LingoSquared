teaching:
  it.a1.unit11.lesson01.teach.faccio_colazione:
    title: faccio colazione, vado al lavoro
    gloss: Desayuno, voy al trabajo
    note: '*faccio colazione* (desayuno) y *vado al lavoro* (voy al trabajo) son dos verbos habituales de la rutina diaria.'
    example_gloss:
    - Desayuno a las siete.
  it.a1.unit11.lesson01.teach.torno_a_casa_vado_a_letto:
    title: torno a casa, vado a letto
    gloss: vuelvo a casa, me acuesto
    note: '*torno a casa* (vuelvo a casa) y *vado a letto* (me voy a la cama) describen el final del día.'
    example_gloss:
    - Por la noche vuelvo a casa.
  it.a1.unit11.lesson01.teach.a_che_ora_fai_colazione:
    title: A che ora fai colazione di solito?
    gloss: ¿A qué hora desayunas normalmente?
    note: '*A che ora* (a qué hora) más *di solito* (normalmente) pregunta por una rutina habitual.'
  it.a1.unit11.lesson01.teach.faccio_colazione_alle_sette:
    title: Faccio colazione alle sette e poi vado al lavoro.
    gloss: Desayuno a las siete y luego voy al trabajo.
    note: '*alle sette* (a las siete) usa *alle* + la hora, como el español ''a las''.'
  it.a1.unit11.lesson02.teach.a_che_ora_torni_a_casa:
    title: A che ora torni a casa la sera?
    gloss: ¿A qué hora vuelves a casa por la tarde?
    note: '*torni* es la forma de *tu* de *tornare* (volver), aquí en una pregunta sobre la rutina de la tarde.'
  it.a1.unit11.lesson02.teach.torno_alle_sei_e_trenta:
    title: Torno a casa alle sei e trenta, di solito.
    gloss: Normalmente vuelvo a casa a las seis y media.
    note: '*alle sei e trenta* (a las seis y treinta) añade los minutos después de la hora con *e*.'
  it.a1.unit11.lesson02.teach.vado_a_letto_presto:
    title: Vado a letto presto.
    gloss: Me acuesto temprano.
    note: '*presto* (temprano) modifica a *vado a letto* (me acuesto).'
    example_gloss:
    - Por la noche me acuesto temprano.
  it.a1.unit11.lesson03.teach.anche_io:
    title: Anch'io faccio colazione alle sette.
    gloss: Yo también desayuno a las siete.
    note: '*Anch''io* (yo también) expresa que estás de acuerdo con lo que otra persona acaba de decir.'
  it.a1.unit11.lesson03.teach.e_tu:
