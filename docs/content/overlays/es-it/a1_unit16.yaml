  it.a1.unit16.lesson01.teach.mi_fa_male_la_testa:
    title: Mi fa male la testa.
    gloss: Me duele la cabeza.
    note: '*la testa* (la cabeza) es femenino, por eso lleva *la*.'
  it.a1.unit16.lesson02.teach.non_mi_sento_bene:
    title: non mi sento bene
    gloss: No me siento bien
    note: '*mi sento* (me siento) más *bene* (bien); *non* lo niega para decir que no te sientes bien.'
    example_gloss:
