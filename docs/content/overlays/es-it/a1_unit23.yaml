teaching:
  it.a1.unit23.lesson01.teach_pronto_chi_parla:
    title: Pronto, chi parla?
    gloss: ¿Diga? ¿Quién habla?
    note: En italiano se contesta al teléfono con *Pronto*, no con *ciao*.
    example_gloss:
    - Hola, soy Elena.
  it.a1.unit23.lesson01.teach_telefono_messaggio:
    title: il telefono, un messaggio
    gloss: el teléfono, un mensaje
    note: '*Messaggio* es masculino; se dice *un messaggio*.'
    example_gloss:
    - Te mando un mensaje.
  it.a1.unit23.lesson01.teach_sono_elena:
    title: Sono Elena.
    gloss: Soy Elena.
    note: Como en español («Soy Elena»), en italiano se usa *sono* para identificarse por teléfono.
    example_gloss:
    - Hola, soy Elena.
  it.a1.unit23.lesson01.teach_ciao_sam:
    title: Ciao Sam, sono Elena.
    gloss: Hola, Sam, soy Elena.
    note: '*Sono Elena* es la forma natural de decir «soy Elena» en una llamada.'
    example_gloss:
    - Hola, Sam, soy Elena por teléfono.
  it.a1.unit23.lesson02.teach_puoi_ripetere:
    title: Puoi ripetere, per favore?
    gloss: ¿Puedes repetir, por favor?
    note: '*Puoi* es informal, adecuado entre Elena y Sam.'
    example_gloss:
    - Sam, ¿puedes repetir, por favor?
  it.a1.unit23.lesson02.teach_piu_piano:
    title: Più piano, per favore.
    gloss: Más despacio, por favor.
    note: '*Più piano* significa «más despacio»; es la forma habitual de pedir a alguien que vaya más lento.'
    example_gloss:
    - Habla más despacio, por favor.
  it.a1.unit23.lesson02.teach_ti_mando_un_messaggio:
    title: Ti mando un messaggio.
    gloss: Te mando un mensaje.
    note: '*Ti mando* significa «te mando» en lenguaje informal.'
    example_gloss:
    - Hola, Sam, te mando un mensaje.
  it.a1.unit23.lesson02.teach_si_sono_elena:
    title: Sì, sono Elena.
    gloss: Sí, soy Elena.
    note: '*Sì* lleva acento, como «sí» en español; no escribas *si* sin acento para decir «sí».'
    example_gloss:
    - Sí, soy Elena por teléfono.
