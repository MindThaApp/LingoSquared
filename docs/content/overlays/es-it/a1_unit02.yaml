teaching:
  it.a1.unit02.lesson01.teach.di_dove:
    title: di dove
    gloss: de dónde
    note: '*di dove* es la pieza básica para preguntar o decir el origen; va con *sei* (informal) o *è* (formal).'
    example_gloss:
    - Sam, ¿de dónde eres?
    - Elena, ¿de dónde es usted?
  it.a1.unit02.lesson01.teach.di_dove_sei:
    title: Di dove sei?
    gloss: ¿De dónde eres?
    note: La pregunta informal, para un compañero o un amigo, acorde con *tu* de la Unidad 1.
  it.a1.unit02.lesson01.teach.di_dov_e_lei:
    title: Di dov'è, Lei?
    gloss: ¿De dónde es usted?
    note: La pregunta formal, acorde con *Lei* de la Unidad 1.
  it.a1.unit02.lesson01.teach.sono_americano_chicago:
    title: Sono americano, di Chicago.
    gloss: Soy estadounidense, de Chicago.
    note: Dice a la vez la nacionalidad y la ciudad de origen.
  it.a1.unit02.lesson01.teach.sono_italiana_milano:
    title: Sono italiana, di Milano.
    gloss: Soy italiana, de Milán.
    note: '*italiana* es la forma femenina de la nacionalidad, usada porque Elena es una mujer.'
  it.a1.unit02.lesson01.teach.nationalities:
    title: americano/americana, italiano/italiana
    gloss: estadounidense, italiano/italiana
    note: 'Las nacionalidades italianas cambian de terminación según el género de la persona: *-o* para un hombre, *-a* para una mujer (*Sam è americano*, *Elena è italiana*). En español pasa igual con italiano/italiana, pero no con palabras como «estadounidense».'
    example_gloss:
    - Sam es estadounidense.
    - Elena es italiana.
  it.a1.unit02.lesson02.teach.parli_italiano:
    title: Parli italiano?
    gloss: ¿Hablas italiano?
    note: La pregunta informal, con la forma de *tu* de *parlare* (hablar).
  it.a1.unit02.lesson02.teach.parla_italiano:
    title: Parla italiano?
    gloss: ¿Habla usted italiano?
    note: La pregunta formal, con la forma de *Lei* de *parlare*.
  it.a1.unit02.lesson02.teach.parlo_un_po:
    title: Parlo un po' d'italiano
    gloss: Hablo un poco de italiano
    note: Una manera modesta y común de describir tu nivel; *un po'* significa «un poco».
    example_gloss: Hablo un poco de italiano, llevo un año estudiando.
  it.a1.unit02.lesson02.teach.parlo_inglese:
    title: Parlo inglese.
    gloss: Hablo inglés.
    note: La misma construcción con *parlo* (hablo) y otro idioma.
  it.a1.unit02.lesson02.teach.studio_da_un_anno:
    title: Studio italiano da un anno.
    gloss: Llevo un año estudiando italiano.
    note: '*da un anno* significa «desde hace un año» y describe una acción que empezó en el pasado y continúa ahora.'
  it.a1.unit02.lesson02.teach.da_quanto_studi:
    title: Da quanto studi?
    gloss: ¿Cuánto tiempo llevas estudiando?
    note: '*Da quanto* (desde cuánto) + el presente *studi* (estudias, informal) pregunta cuánto tiempo lleva en marcha una actividad. Se responde con el mismo esquema: *Studio da un anno.* En español también se usa el presente: «estudio desde hace un año».'
  it.a1.unit02.lesson02.teach.parla_bene:
    title: Parli italiano bene!
    gloss: ¡Hablas muy bien italiano!
    note: Un cumplido amistoso sobre el nivel de idioma de alguien, con la forma informal de *tu*.
  it.a1.unit02.lesson03.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: ¿A qué te dedicas?
    note: La pregunta informal, con la forma de *tu* de *fare* (hacer).
  it.a1.unit02.lesson03.teach.che_lavoro_fa:
    title: Che lavoro fa, Lei?
    gloss: ¿A qué se dedica usted?
    note: La pregunta formal, con la forma de *Lei* de *fare*.
  it.a1.unit02.lesson03.teach.sono_ingegnere:
    title: Sono ingegnere
    gloss: Soy ingeniero
    note: 'Los nombres de profesión en italiano suelen omitir el artículo: *sono ingegnere*, no *sono un ingegnere*. En español ocurre lo mismo: «soy ingeniero».'
    example_gloss: Soy ingeniero, trabajo en Milán.
  it.a1.unit02.lesson03.teach.sono_qui_per_lavoro:
    title: Sono qui per lavoro.
    gloss: Estoy aquí por trabajo.
    note: '*per lavoro* explica el motivo de estar en un sitio: trabajo, no turismo.'
  it.a1.unit02.lesson03.teach.per_due_anni:
    title: Sono qui per due anni.
    gloss: Estoy aquí por dos años.
    note: La misma construcción que *per lavoro*, ahora con una duración en lugar de un motivo.
  it.a1.unit02.lesson03.teach.che_bello_benvenuto:
    title: Che bello, benvenuto a Milano!
    gloss: ¡Qué bien, bienvenido a Milán!
    note: '*Che bello* es una reacción común y entusiasta que significa «qué bien» o «qué bonito».'
  it.a1.unit02.lesson03.teach.grazie_mille_reprise:
    title: Grazie mille!
    gloss: ¡Muchas gracias!
    note: El mismo agradecimiento enfático de la Unidad 1, dicho aquí como respuesta a una cálida bienvenida.
