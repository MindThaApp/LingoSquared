teaching:
  it.a1.unit07.lesson01.teach.caffe_cornetto:
    title: il caffè, il cornetto
    gloss: el café, el cruasán
    note: 'Ambos sustantivos son masculinos (*il*), como en español: *caffè* es el espresso de todos los días en Italia y *cornetto* es el bollo típico del desayuno.'
    example_gloss:
    - Quisiera un café, por favor.
    - Quisiera un cruasán, por favor.
  it.a1.unit07.lesson01.teach.panino_acqua:
    title: il panino, l'acqua
    gloss: el bocadillo, el agua
    note: '*panino* es masculino (*il*); *acqua* es femenino pero lleva *l''* ante vocal, algo parecido a «el agua» en español.'
    example_gloss:
    - Quisiera un bocadillo, por favor.
    - Quisiera un agua, por favor.
  it.a1.unit07.lesson01.teach.cosa_desidera:
    title: Cosa desidera?
    gloss: ¿Qué desea?
    note: La pregunta de cortesía, con la forma *Lei*, que hace un camarero a un cliente.
  it.a1.unit07.lesson01.teach.vorrei_un_caffe:
    title: Vorrei un caffè e un cornetto, per favore.
    gloss: Quisiera un café y un cruasán, por favor.
    note: '*Vorrei* (quisiera) es la forma cortés de pedir, seguida de *e* (y) para añadir un segundo producto.'
  it.a1.unit07.lesson02.teach.vorrei_due_caffe:
    title: Vorrei due caffè, per favore.
    gloss: Quisiera dos cafés, por favor.
    note: '*due* (dos) sustituye al artículo cuando se piden varias unidades.'
  it.a1.unit07.lesson02.teach.per_lei:
    title: E per Lei?
    gloss: ¿Y para usted?
    note: '*E per Lei?* pregunta al segundo cliente qué desea, con la forma de cortesía *Lei*.'
  it.a1.unit07.lesson02.teach.basta_cosi:
    title: Basta così, grazie.
    gloss: Eso es todo, gracias.
    note: La forma habitual de cerrar un pedido cuando no quieres nada más.
  it.a1.unit07.lesson03.teach.il_menu_il_conto:
    title: il menù, il conto
    gloss: el menú, la cuenta
    note: Ambos sustantivos son masculinos (*il*), aunque en español «la cuenta» es femenino.
    example_gloss:
    - Un bocadillo y un agua, por favor.
  it.a1.unit07.lesson03.teach.panino_acqua_conto:
    title: Un panino e un'acqua, per favore.
    gloss: Un bocadillo y un agua, por favor.
    note: '*un''acqua* usa la forma con apóstrofo de *una* ante la vocal inicial de *acqua*.'
