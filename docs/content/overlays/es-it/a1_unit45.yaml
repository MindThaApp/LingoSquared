    title: In + medio de transporte, a piedi para ir a pie
    gloss: 'Con los medios de transporte, el italiano usa in: in treno, in bicicletta, in macchina. Para ir a pie se dice a piedi: vado a piedi.'
    note: 'Como en español («en tren»), el italiano dice *in treno* sin artículo: *in treno*, no *nel treno*.'
  it.a1.unit45.lesson04.teach.marco_allora_prendo:
    title: Marco responde
    gloss: 'Marco: Entonces tomo el tren, junto con Giulia.'
  it.a1.unit45.lesson05.teach.giulia_viaggia_ogni:
    title: ¿Quién viaja cómo?
    gloss: Giulia viaja todos los días en tren al trabajo. Marco normalmente va en bici, pero cuando llueve también toma el tren. Luca prefiere ir en coche. Chiara vive cerca y va a pie al trabajo. ¿Y tú, cómo vas al trabajo?
    note: 'Contrasta cuatro formas de desplazarse y una condición (*quando piove*, cuando llueve). *Andare* (ir) es irregular: *vado*, *va*.'
    glosses:
      viaggia: viaja
      ogni: cada
      giorno: día
      treno: tren
      lavoro: trabajo
      bicicletta: bici (in bicicletta = en bici)
      solito: habitual (di solito = normalmente)
      piove: llueve
      prende: coge
      andare: ir (andare in macchina = ir en coche)
      preferisce: prefiere
      macchina: coche
      abita: vive
      vicino: cerca
      piedi: pies (a piedi = a pie)
      vai: tú vas
  it.a1.unit45.lesson05.teach.chiara_abita_vicino:
    title: Chiara vive cerca y va a pie al trabajo
    gloss: Chiara vive cerca y va a pie al trabajo.
  it.a1.unit45.lesson06.teach.giulia_andiamo_insieme:
    title: Giulia propone
    gloss: 'Giulia: ¿Vamos juntos en bici al café de idiomas?'
  it.a1.unit45.lesson06.teach.luca_preferisco_andare:
