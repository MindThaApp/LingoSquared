teaching:
  it.a1.unit20.lesson01.teach.fa_caldo_freddo:
    title: fa caldo, fa freddo
    gloss: hace calor, hace frío
    note: Como en español («hace calor», «hace frío»), el italiano usa *fa caldo/freddo* para hablar de la temperatura.
    example_gloss:
    - Hoy hace calor.
    - Hoy hace frío.
  it.a1.unit20.lesson01.teach.piove_sole:
    title: piove, c'è il sole
    gloss: está lloviendo, hace sol
    note: '*Piove* es una oración completa de una sola palabra; *c''è il sole* significa literalmente «hay el sol».'
    example_gloss:
    - Hoy llueve.
    - Hoy hace sol.
  it.a1.unit20.lesson01.teach.che_tempo_fa:
    title: Che tempo fa oggi?
    gloss: ¿Qué tiempo hace hoy?
    note: '*Che tempo fa?* es la pregunta habitual sobre el tiempo.'
    example_gloss:
    - ¿Qué tiempo hace hoy?
  it.a1.unit20.lesson01.teach_oggi_piove:
    title: Oggi piove.
    gloss: Hoy llueve.
    note: '*Oggi* suele ir al principio, pero *Piove oggi.* también es correcto.'
    example_gloss:
    - Hoy llueve.
  it.a1.unit20.lesson02.teach_oggi_piove_freddo:
    title: Oggi piove e fa freddo.
    gloss: Hoy llueve y hace frío.
    note: Para unir dos datos del tiempo se usa *e*.
