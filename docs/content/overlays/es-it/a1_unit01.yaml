teaching:
  it.a1.unit01.lesson01.teach.ciao_buongiorno:
    title: Ciao, Buongiorno
    gloss: hola, buenos días
    note: '*Ciao* es un saludo informal y comodín que se usa entre amigos y compañeros a cualquier hora del día. *Buongiorno* es el saludo estándar, más formal, de día: se puede usar desde la mañana hasta la tarde.'
    example_gloss:
    - Hola, ¿cómo estás?
    - Buenos días, ¿cómo está usted?
  it.a1.unit01.lesson01.teach.come_stai_sta:
    title: come stai, come sta
    gloss: cómo estás, cómo está usted (formal)
    note: '*come stai* va con *tu* (un amigo, un compañero); *come sta* va con *Lei* (un desconocido, un jefe, alguien a quien muestras respeto). Es la misma pregunta con distinto registro, como «¿cómo estás?» y «¿cómo está usted?» en español.'
    example_gloss:
    - Hola, ¿cómo estás hoy?
    - Buenos días, ¿cómo está usted hoy?
  it.a1.unit01.lesson01.teach.ciao_come_stai:
    title: Ciao, come stai?
    gloss: Hola, ¿cómo estás?
    note: El saludo con pregunta, informal, que se usa con amigos, compañeros de clase o iguales.
  it.a1.unit01.lesson01.teach.buongiorno_come_sta:
    title: Buongiorno, come sta?
    gloss: Buenos días, ¿cómo está usted?
    note: La versión formal, para alguien a quien tratas con respeto, como el jefe de un nuevo compañero.
  it.a1.unit01.lesson01.teach.register_rule:
    title: 'tu: informale · Lei: formale o rispettoso'
    gloss: 'tu: informal · Lei: formal o respetuoso'
    note: '*tu* es el «tú» de todos los días entre amigos, compañeros de clase e iguales. *Lei* es el trato de cortesía, como el «usted» español, para desconocidos, la jerarquía laboral o alguien a quien conoces por primera vez. Lleva sus propias formas verbales (compara *tu stai* con *Lei sta*).'
  it.a1.unit01.lesson02.teach.bene_grazie:
    title: Bene, grazie
    gloss: Bien, gracias
    note: Una respuesta sencilla y neutra a «¿cómo estás?», válida en ambos registros si la acompañas de *e tu?* o *e Lei?*
    example_gloss:
    - Bien, gracias, ¿y tú?
    - Bien, gracias, ¿y usted?
  it.a1.unit01.lesson02.teach.e_tu:
    title: E tu?
    gloss: ¿Y tú?
    note: La forma informal de devolver la pregunta a un amigo o compañero.
  it.a1.unit01.lesson02.teach.e_lei:
    title: E Lei?
    gloss: ¿Y usted?
    note: La forma formal de devolver la pregunta, acorde con el registro de *Lei*.
  it.a1.unit01.lesson02.teach.bene_grazie_e_tu:
    title: Bene, grazie, e tu?
    gloss: Bien, gracias, ¿y tú?
    note: La respuesta completa con pregunta de vuelta, informal, que se dice a un amigo o compañero.
  it.a1.unit01.lesson02.teach.bene_grazie_e_lei:
    title: Bene, grazie, e Lei?
    gloss: Bien, gracias, ¿y tú?
    note: La respuesta completa con pregunta de vuelta, formal, que se dice a alguien a quien tratas con respeto.
  it.a1.unit01.lesson02.teach.buonasera_buonanotte:
    title: Buonasera, Buonanotte
    gloss: buenas tardes (al anochecer), buenas noches (al despedirse)
    note: '*Buonasera* es un saludo para cuando llegas a algún sitio al caer la tarde o por la noche. *Buonanotte* es una despedida que se dice al irse a dormir o al terminar el día: nunca se usa para saludar. En español «buenas noches» sirve para las dos cosas, pero en italiano se distinguen.'
    example_gloss:
    - Buenas tardes, ¿cómo estás?
    - Buenas noches, hasta mañana.
  it.a1.unit01.lesson02.teach.arrivederla:
    title: Arrivederla, a domani.
    gloss: Adiós, hasta mañana.
    note: '*Arrivederla* es la despedida formal, que se usa con *Lei*, propia del trabajo o de un desconocido.'
  it.a1.unit01.lesson02.teach.ci_vediamo:
    title: Ciao, ci vediamo domani!
    gloss: ¡Chao, hasta mañana!
    note: La despedida informal, para amigos y compañeros a quienes verás al día siguiente.
  it.a1.unit01.lesson03.teach.come_si_chiama:
    title: Come si chiama, scusi?
    gloss: ¿Cómo se llama usted, disculpe?
    note: '*Come si chiama?* pregunta literalmente «¿cómo se llama?» en el registro formal de *Lei*; añadir *scusi* («disculpe») es un detalle cortés al preguntar a un desconocido.'
  it.a1.unit01.lesson03.teach.come_ti_chiami:
    title: Come ti chiami?
    gloss: ¿Cómo te llamas?
    note: La versión informal, para un amigo, un compañero o alguien de tu edad.
  it.a1.unit01.lesson03.teach.mi_chiamo_elena:
    title: Mi chiamo Elena.
    gloss: Me llamo Elena.
    note: '*chiamarsi* significa «llamarse»: es la forma habitual de decir tu nombre, válida en ambos registros, igual que en español.'
  it.a1.unit01.lesson03.teach.io_sono_sam:
    title: Io sono Sam.
    gloss: Yo soy Sam.
    note: Una alternativa sencilla a *mi chiamo*, con *essere* (ser) más tu nombre directamente.
  it.a1.unit01.lesson03.teach.piacere:
    title: Piacere, Piacere di conoscerla
    gloss: mucho gusto, encantado de conocerla (formal)
    note: '*Piacere* solo es una forma corta y muy común de decir «mucho gusto» en ambos registros. *Piacere di conoscerla* es la versión más completa y formal, que se usa con *Lei*.'
    example_gloss:
    - ¡Mucho gusto, Sam!
    - Encantado de conocerla, señora Elena.
  it.a1.unit01.lesson03.teach.benvenuto:
    title: Benvenuto in ufficio!
    gloss: ¡Bienvenido a la oficina!
    note: '*Benvenuto* es la forma masculina de «bienvenido» (para un hombre; a una mujer se le diría *Benvenuta*), como en español.'
  it.a1.unit01.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: Muchas gracias.
    note: Una manera más fuerte y enfática de dar las gracias que un simple *Grazie*.
