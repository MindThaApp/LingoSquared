teaching:
  it.a1.unit14.lesson01.teach.preferire:
    title: preferire, preferisco
    gloss: preferir, prefiero
    note: '*preferire* (preferir) es un verbo en -ire que intercala -isc- en la mayoría de las formas del presente; *preferisco* es ''prefiero''.'
    example_gloss:
    - Prefiero el té al café.
  it.a1.unit14.lesson01.teach.preferisci_il_caffe_o_il_te:
    title: Preferisci il caffè o il tè?
    gloss: ¿Prefieres café o té?
    note: '*Preferisci* (prefieres) más *o* (o) ofrece una elección entre dos cosas.'
  it.a1.unit14.lesson01.teach.preferisco_il_caffe:
    title: Preferisco il caffè.
    gloss: Prefiero el café.
    note: '*Preferisco* (prefiero) más *il caffè* (el café) expresa una preferencia.'
  it.a1.unit14.lesson02.teach.mi_piace_il_cornetto:
    title: Mi piace molto il cornetto.
    gloss: Me gusta mucho el cruasán.
    note: '*Mi piace* (me gusta, literalmente ''me agrada'') más *molto* (mucho) expresa un gusto fuerte.'
  it.a1.unit14.lesson02.teach.non_mi_piace:
    title: Non mi piace il tè la mattina.
    gloss: No me gusta el té por la mañana.
    note: '*Non mi piace* (no me gusta) niega la construcción de gusto; *la mattina* significa ''por la mañana''.'
    example_gloss:
    - No me gusta el café por la noche.
  it.a1.unit14.lesson02.teach.e_a_te:
    title: E a te?
    gloss: ¿Y usted?
    note: '*E a te?* (¿y a ti?) pide a la otra persona su propia preferencia.'
  it.a1.unit14.lesson03.teach.anch_io_preferisco_il_caffe:
    title: Anch'io preferisco il caffè!
    gloss: ¡A mí también, prefiero el café!
    note: '*Anch''io* (yo también) coincide con una preferencia que alguien acaba de expresar con *preferisco*. (Para coincidir con un *mi piace*, el italiano dice *Anche a me*, como el español ''a mí también''.)'
  it.a1.unit14.lesson03.teach.a_me_no:
    title: A me no, preferisco il tè.
    gloss: A mí no, prefiero el té.
    note: '*A me no* (a mí no) muestra desacuerdo con una frase con *mi piace* (repite el *a me* de la construcción de gusto, como en español ''a mí no'') antes de dar la propia preferencia. Para discrepar de una frase con *preferisco*, el italiano dice *Io no* (yo no).'
    example_gloss:
    - A mí no, prefiero el café.
