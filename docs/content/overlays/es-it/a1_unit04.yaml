  it.a1.unit04.lesson01.teach.giorni_lun_mer:
    title: lunedì, martedì, mercoledì
    gloss: lunes, martes, miércoles
    note: Los tres primeros días de la semana italiana. La semana italiana empieza el lunes.
    example_gloss:
    - El lunes trabajo en la oficina.
  it.a1.unit04.lesson01.teach.giorni_gio_dom:
    title: giovedì, venerdì, sabato, domenica
    gloss: jueves, viernes, sábado, domingo
    note: Los otros cuatro días de la semana, que completan la lista.
    example_gloss:
    - Los domingos no trabajo.
  it.a1.unit04.lesson01.teach.che_giorno_e_oggi:
    title: Che giorno è oggi?
    gloss: ¿Qué día es hoy?
    note: La forma habitual de preguntar qué día de la semana es.
  it.a1.unit04.lesson01.teach.oggi_e_giovedi:
    title: Oggi è giovedì.
    gloss: Hoy es jueves.
    note: '*Oggi* (hoy) + *è* (es) + el nombre del día responde directamente.'
  it.a1.unit04.lesson01.teach.domani_e_venerdi:
    title: Domani è venerdì.
    gloss: Mañana es viernes.
    note: '*Domani* (mañana) sigue el mismo esquema que *oggi* para nombrar un día.'
  it.a1.unit04.lesson02.teach.che_data_e_oggi:
    title: Che data è oggi?
    gloss: ¿Qué fecha es hoy?
    note: '*Che data* (qué fecha) se usa en lugar de *che giorno* cuando se pregunta por la fecha del calendario y no por el día de la semana.'
  it.a1.unit04.lesson02.teach.mesi_gen_apr:
    title: gennaio, febbraio, marzo, aprile
    gloss: enero, febrero, marzo, abril
    note: Los cuatro primeros meses del año en italiano; como en español, todos los meses se escriben con minúscula.
    example_gloss:
    - Hoy es cinco de enero.
  it.a1.unit04.lesson02.teach.oggi_e_cinque_gennaio:
    title: Oggi è il cinque gennaio.
    gloss: Hoy es cinco de enero.
    note: 'Las fechas italianas usan *il* + el número del día + el mes, sin el «de» del español («cinco de enero»): solo el número cardinal *cinque*. La excepción es el día 1, que lleva el ordinal *primo* (*il primo gennaio*).'
  it.a1.unit04.lesson02.teach.il_giorno_del_mese:
    title: il quindici marzo
    gloss: quince de marzo
    note: Otro ejemplo del esquema día + mes, que funciona igual para cualquier fecha.
  it.a1.unit04.lesson03.teach.quando_arrivi:
    title: Quando arrivi a Roma?
    gloss: ¿Cuándo llegas a Roma?
    note: '*Quando* (cuándo) + *arrivi* (llegas, informal) pregunta por una llegada futura.'
  it.a1.unit04.lesson03.teach.arrivo_giovedi_pomeriggio:
    title: Arrivo giovedì pomeriggio.
    gloss: Llego el jueves por la tarde.
    note: '*Arrivo* (llego) + día + momento del día da una respuesta completa sobre cuándo llegarás.'
  it.a1.unit04.lesson03.teach.parti_di_domani:
    title: oggi, domani, dopodomani
    gloss: hoy, mañana, pasado mañana
    note: '*Dopodomani* es una sola palabra para «pasado mañana»: literalmente *dopo* (después) + *domani* (mañana).'
    example_gloss:
    - Pasado mañana es sábado.
