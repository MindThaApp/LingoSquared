teaching:
  it.a1.unit06.lesson01.teach.madre_padre:
    title: la madre, il padre
    gloss: la madre, el padre
    note: 'Los sustantivos italianos llevan un artículo según el género: *la* para el femenino, *il* para el masculino, como «la» y «el» en español.'
    example_gloss:
    - Este es mi padre.
    - Esta es mi madre.
  it.a1.unit06.lesson01.teach.fratello_sorella:
    title: il fratello, la sorella
    gloss: el hermano, la hermana
    note: '*fratello* es masculino (*il*) y *sorella* es femenino (*la*).'
    example_gloss:
    - Tengo un hermano y una hermana.
  it.a1.unit06.lesson01.teach.questo_e_mio_padre:
    title: Questo è mio padre. Questa è mia madre.
    gloss: Este es mi padre. Esta es mi madre.
    note: '*Questo/Questa* (este/esta) concuerda en género con la persona a la que señala: *questo* para un hombre, *questa* para una mujer.'
  it.a1.unit06.lesson01.teach.nonno_nonna:
    title: il nonno, la nonna
    gloss: el abuelo, la abuela
    note: Sigue el mismo esquema de artículo masculino/femenino que *padre/madre*.
    example_gloss:
    - Mi abuelo vive en Roma.
    - Mi abuela cocina muy bien.
  it.a1.unit06.lesson02.teach.hai_fratelli_o_sorelle:
    title: Hai fratelli o sorelle?
    gloss: ¿Tienes hermanos o hermanas?
    note: '*Hai* (tienes) + la palabra de familia + *o* es la forma habitual de preguntar por los hermanos.'
  it.a1.unit06.lesson02.teach.ho_un_fratello_e_una_sorella:
    title: Ho un fratello e una sorella.
    gloss: Tengo un hermano y una hermana.
    note: '*Ho* (tengo) responde a la pregunta, con *un* (masculino) y *una* (femenino).'
  it.a1.unit06.lesson02.teach.moglie_marito:
    title: il marito, la moglie
    gloss: el marido, la esposa
    note: Otra pareja masculino/femenino, con el mismo esquema de artículos.
    example_gloss:
    - Sam tiene esposa.
  it.a1.unit06.lesson03.teach.hai_figli:
    title: Hai figli?
    gloss: ¿Tienes hijos?
    note: '*figli* (hijos) es el plural que se usa al preguntar en general, sin importar cuántos hay ni de qué sexo son.'
  it.a1.unit06.lesson03.teach.ho_due_figli:
    title: Sì, ho due figli. Un maschio e una femmina.
    gloss: Sí, tengo dos hijos. Un niño y una niña.
    note: '*maschio* (varón) y *femmina* (mujer) precisan el sexo de los hijos después de dar el total.'
  it.a1.unit06.lesson03.teach.figlio_figlia:
    title: il figlio, la figlia
    gloss: el hijo, la hija
    note: Las formas singulares de *figli*, con el esquema habitual de artículos masculino/femenino.
    example_gloss:
    - Elena tiene un hijo y una hija.
