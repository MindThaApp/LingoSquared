teaching:
  it.a1.unit12.lesson01.teach.stasera_domani:
    title: stasera, domani
    gloss: esta noche, mañana
    note: '*stasera* (esta noche) y *domani* (mañana) son los dos momentos que se usan para proponer un plan.'
    example_gloss:
    - ¿Estás libre esta noche?
  it.a1.unit12.lesson01.teach.va_bene_andiamo:
    title: va bene, andiamo
    gloss: de acuerdo, vamos
    note: '*va bene* (de acuerdo) acepta una propuesta; *andiamo* (vamos) es la forma de ''nosotros'' de *andare* usada como invitación.'
    example_gloss:
    - De acuerdo, vamos juntos.
  it.a1.unit12.lesson01.teach.andiamo_al_cinema_stasera:
    title: Andiamo al cinema stasera?
    gloss: ¿Vamos al cine esta noche?
    note: '*Andiamo* dicho como pregunta propone hacer algo juntos.'
  it.a1.unit12.lesson01.teach.va_bene_andiamo_phrase:
    title: Va bene, andiamo!
    gloss: ¡De acuerdo, vamos!
    note: '*Va bene* acepta la propuesta y *andiamo* repite la invitación con entusiasmo.'
  it.a1.unit12.lesson02.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: ¿A qué hora quedamos?
    note: '*ci vediamo* (nos vemos / quedamos) es la forma recíproca de *vedersi*.'
  it.a1.unit12.lesson02.teach.ci_vediamo_alle_otto:
    title: Ci vediamo alle otto, davanti al cinema.
    gloss: Quedamos a las ocho, delante del cine.
    note: '*davanti a* (delante de) más el artículo indica el lugar de encuentro.'
  it.a1.unit12.lesson02.teach.perfetto_a_stasera:
    title: Perfetto, a stasera allora!
    gloss: Perfecto, ¡hasta esta noche entonces!
    note: '*a stasera* (hasta esta noche) es una despedida que nombra el momento acordado.'
    example_gloss:
    - Perfecto, ¡hasta mañana entonces!
  it.a1.unit12.lesson03.teach.se_stasera_non_va_bene:
    title: Se stasera non va bene, andiamo domani.
    gloss: Si esta noche no te viene bien, vamos mañana.
    note: '*Se* (si) introduce un plan alternativo por si el primero no funciona.'
  it.a1.unit12.lesson03.teach.domani_va_bene:
    title: Sì, domani va bene.
    gloss: Sí, mañana me viene bien.
    note: '*va bene* (viene bien / está bien) confirma que el otro día es aceptable.'
    example_gloss:
    - Sí, mañana me viene muy bien.
