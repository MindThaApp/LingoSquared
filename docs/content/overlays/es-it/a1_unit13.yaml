teaching:
  it.a1.unit13.lesson01.teach.ieri_stamattina:
    title: ieri, stamattina
    gloss: ayer, esta mañana
    note: '*ieri* (ayer) y *stamattina* (esta mañana) son los dos momentos que se usan para hablar de hechos recientes.'
    example_gloss:
    - Ayer estuve en casa.
  it.a1.unit13.lesson01.teach.sono_andato:
    title: sono andato, sono andata
    gloss: fui (masculino), fui (femenino)
    note: '*sono andato/andata* es el passato prossimo de *andare*, formado con el auxiliar *essere*; el participio concuerda en género con el sujeto. En español el auxiliar es siempre haber y el participio no cambia.'
    example_gloss:
    - Esta mañana fui al trabajo.
  it.a1.unit13.lesson01.teach.sono_andato_al_cinema_ieri:
    title: Sono andato al cinema ieri.
    gloss: Ayer fui al cine.
    note: '*Sono andato* (quien habla es hombre) más *al cinema* (al cine) más *ieri* (ayer) describe un hecho pasado ya terminado.'
  it.a1.unit13.lesson01.teach.ho_visto_un_bel_film:
    title: Ho visto un bel film!
    gloss: ¡Vi una buena película!
    note: '*Ho visto* usa el auxiliar *avere* con el participio irregular *visto* (de *vedere*, ver).'
  it.a1.unit13.lesson02.teach.ho_mangiato_un_panino:
    title: Ho mangiato un panino a pranzo.
    gloss: Comí un bocadillo a mediodía.
    note: '*Ho mangiato* usa *avere* más el participio regular *mangiato* (de *mangiare*, comer); *a pranzo* significa ''a mediodía''.'
  it.a1.unit13.lesson02.teach.cosa_hai_fatto_ieri:
    title: Cosa hai fatto ieri?
    gloss: ¿Qué hiciste ayer?
    note: '*hai fatto* es el passato prossimo de *fare* (hacer), usado aquí para preguntar por un hecho pasado reciente.'
    example_gloss:
    - ¿Qué hiciste esta mañana?
  it.a1.unit13.lesson02.teach.ieri_sera:
    title: ieri sera
    gloss: anoche
    note: '*ieri sera* une *ieri* (ayer) con *sera* (tarde-noche) para nombrar un momento pasado concreto.'
    example_gloss:
    - Anoche fui al cine.
  it.a1.unit13.lesson03.teach.sono_andata_al_lavoro:
    title: Stamattina sono andata al lavoro, come sempre.
    gloss: Esta mañana fui al trabajo, como siempre.
    note: '*sono andata* (quien habla es mujer) más *come sempre* (como siempre) describe una acción pasada habitual.'
  it.a1.unit13.lesson03.teach.e_tu_cosa_hai_fatto:
    title: E tu, cosa hai fatto stamattina?
    gloss: Y tú, ¿qué hiciste esta mañana?
    note: '*E tu* (y tú) devuelve la pregunta a la otra persona.'
    example_gloss:
    - Y tú, ¿qué hiciste anoche?
