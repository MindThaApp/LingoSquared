teaching:
  it.a1.unit24.lesson01.teach_soldi_carta:
    title: i soldi, la carta
    gloss: dinero, tarjeta
    note: A diferencia del español («el dinero»), *soldi* es plural en italiano; *carta* es la forma corta habitual para la tarjeta de pago.
    example_gloss:
    - Tengo dinero.
    - Pago con tarjeta.
  it.a1.unit24.lesson01.teach_contanti_scontrino:
    title: i contanti, lo scontrino
    gloss: efectivo, tique
    note: '*Contanti* es plural; *scontrino* es el tique de compra de uso diario.'
    example_gloss:
    - Pago en efectivo.
    - Aquí está el tique.
  it.a1.unit24.lesson01.teach_pago_con_la_carta:
    title: Pago con la carta.
    gloss: Pago con tarjeta.
    note: Se usa *con la carta* para pagar con tarjeta.
    example_gloss:
    - Pago con tarjeta en la cafetería.
  it.a1.unit24.lesson01.teach_pago_in_contanti:
    title: Pago in contanti.
    gloss: Pago en efectivo.
    note: Se usa *in contanti* para pagar en efectivo.
    example_gloss:
    - Hoy pago en efectivo.
  it.a1.unit24.lesson02.teach_posso_pagare_carta:
    title: Posso pagare con la carta?
    gloss: ¿Puedo pagar con tarjeta?
    note: '*Posso pagare...?* pregunta si se acepta una forma de pago.'
    example_gloss:
    - ¿Puedo pagar con tarjeta hoy?
  it.a1.unit24.lesson02.teach_sono_dieci_euro:
    title: Sono dieci euro.
    gloss: Son diez euros.
    note: Como en español («son diez euros»), el italiano suele usar *sono* en plural con los precios.
    example_gloss:
    - La camiseta cuesta diez euros.
  it.a1.unit24.lesson02.teach_si_certo:
    title: Sì, certo.
    gloss: Sí, claro.
    note: Se escribe *Sì* con acento para decir «sí»; *si* sin acento significa otra cosa.
    example_gloss:
    - Sí, por supuesto, pago con tarjeta.
  it.a1.unit24.lesson02.teach_ecco_scontrino:
    title: Ecco lo scontrino.
    gloss: Aquí está el tique.
    note: '*Ecco* presenta algo: aquí está / aquí están.'
    example_gloss:
    - Gracias, aquí está el tique.
