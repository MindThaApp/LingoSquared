teaching:
  it.a1.unit19.lesson01.teach.treno_stazione:
    title: il treno, la stazione
    gloss: tren, estación
    note: '*il treno* es masculino; *la stazione* es femenino.'
    example_gloss:
    - El tren está en la estación.
  it.a1.unit19.lesson01.teach.binario_biglietto:
    title: il binario, il biglietto
    gloss: andén, billete
    note: '*binario* es el andén (la vía); *biglietto* es el billete.'
    example_gloss:
    - El billete es para Roma.
  it.a1.unit19.lesson01.teach.parte_alle_otto:
    title: Parte alle otto.
    gloss: Sale a las ocho.
    note: '*parte* significa «sale» cuando se habla de un medio de transporte.'
    example_gloss:
    - El tren sale a las ocho.
  it.a1.unit19.lesson01.teach.dal_binario_tre:
    title: dal binario tre
    gloss: del andén tres
    note: '*dal* une *da* + *il*: es decir, «del» (de + el).'
    example_gloss:
    - Sale del andén tres.
  it.a1.unit19.lesson02.teach.a_che_ora_parte:
    title: A che ora parte il treno?
    gloss: ¿A qué hora sale el tren?
    note: Para preguntar la hora de salida de un horario se usa *A che ora...?*
    example_gloss:
    - ¿A qué hora sale el tren a Roma?
  it.a1.unit19.lesson02.teach.vorrei_un_biglietto:
    title: Vorrei un biglietto per Roma alle otto, per favore.
    gloss: Quisiera un billete a Roma a las ocho, por favor.
    note: '*Vorrei* es una forma cortés para pedir o comprar algo; *alle otto* añade la hora del viaje.'
    example_gloss:
    - Buenos días, quisiera un billete a Roma, por favor.
  it.a1.unit19.lesson02.teach.il_treno_per_roma:
    title: il treno per Roma
    gloss: el tren a Roma
    note: Para el destino de un viaje se usa *per*.
    example_gloss:
    - El tren a Roma sale a las ocho.
  it.a1.unit19.lesson02.teach.hai_il_biglietto:
    title: Hai il biglietto?
    gloss: ¿Tienes el billete?
    note: '*Hai...?* es el «¿tienes...?» informal entre Elena y Sam.'
    example_gloss:
    - ¿Tienes el billete para Roma?
