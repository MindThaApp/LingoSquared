teaching:
  it.a1.unit41.lesson01.teach.leggere_fare_sport:
    title: Leer, hacer deporte, cocinar
    gloss: leer, hacer deporte, cocinar
    note: 'Tres verbos de pasatiempos habituales en infinitivo: *leggere* (leer), *fare sport* (hacer deporte) y *cucinare* (cocinar). Los infinitivos italianos terminan en -are, -ere o -ire, como los españoles en -ar, -er o -ir.'
    example_gloss:
    - Me gusta leer un libro.
    - Hago deporte los sábados.
    - Me gusta cocinar para mis amigos.
  it.a1.unit41.lesson01.teach.il_tempo_libero:
    title: El tiempo libre
    gloss: tiempo libre
    note: '*Il tempo libero* es un sustantivo masculino, por eso lleva *il*. Es la expresión clave para hablar de pasatiempos.'
    example_gloss: En mi tiempo libre me gusta leer.
  it.a1.unit41.lesson01.teach.nel_mio_tempo:
    title: Decir qué haces en tu tiempo libre
    gloss: En mi tiempo libre me gusta leer.
    note: '*Leggo* es la forma de *io* de *leggere* (leer). Como en español, el italiano omite el pronombre sujeto: se dice *Leggo*, no *Io leggo*.'
  it.a1.unit41.lesson02.teach.ascoltare_musica_disegnare:
    title: Música, dibujo y videojuegos
    gloss: escuchar música, dibujar, jugar a videojuegos
    note: 'Tres pasatiempos más: *ascoltare musica* (escuchar música), *disegnare* (dibujar) y *giocare ai videogiochi* (jugar a los videojuegos).'
    example_gloss:
    - Me gusta escuchar música.
    - Dibujo a menudo.
    - Me gusta jugar a videojuegos con amigos.
  it.a1.unit41.lesson02.teach.ascolto_volentieri_musica:
    title: Decir que te gusta escuchar música
    gloss: Me gusta escuchar música.
    note: '*Ascoltare* lleva su complemento directamente: *ascolto musica*, sin preposición, igual que «escucho música» en español.'
  it.a1.unit41.lesson02.teach.gioco_volentieri_ai:
    title: Decir que te gusta jugar a videojuegos con amigos
    gloss: Me gusta jugar a videojuegos con amigos.
    note: '*Con gli amici* significa «con los amigos». *Gli* es el artículo plural delante de un sustantivo masculino que empieza por vocal.'
  it.a1.unit41.lesson03.teach.sempre_spesso_a:
    title: Siempre, a menudo, a veces, nunca
    gloss: siempre, a menudo, a veces, nunca
    note: 'Cuatro palabras de frecuencia. *Mai* (nunca) exige *non* delante del verbo: *non gioco mai*.'
    example_gloss:
    - Siempre hago deporte los sábados.
    - A menudo leo un libro.
    - A veces dibujo.
    - Nunca juego a videojuegos.
  it.a1.unit41.lesson03.teach.ogni_settimana_ogni:
    title: Cada semana, cada fin de semana
    gloss: cada semana, cada fin de semana
    note: '*Ogni* (cada) nunca cambia: *ogni settimana*, *ogni fine settimana*. Mira la tarjeta siguiente.'
    example_gloss:
    - Cocino para mis amigos cada semana.
    - Hago deporte cada fin de semana.
  it.a1.unit41.lesson03.teach.con_mai_il:
    title: Mai pide non; ogni nunca cambia
    gloss: 'Con mai el verbo también lleva non: Non gioco mai. Ogni es igual con cualquier sustantivo: ogni settimana, ogni fine settimana.'
    note: 'Como en español («no juego nunca»), el italiano pone non delante del verbo cuando mai va detrás: *non gioco mai*. Igual que «cada» en español, *ogni* va siempre seguido de un sustantivo en singular.'
  it.a1.unit41.lesson03.teach.cosa_fai_nel:
    title: Preguntar por el tiempo libre
    gloss: ¿Qué haces en tu tiempo libre?
    note: 'Esta es la pregunta central de la unidad: úsala para preguntar a cualquiera por sus aficiones.'
  it.a1.unit41.lesson04.teach.giulia_passeggiamo_spesso:
    title: Giulia saca el tema de los pasatiempos
    gloss: 'Giulia: A menudo paseamos juntos. Pero ¿qué más haces tú en tu tiempo libre, Marco?'
    note: '*Passeggiamo* es la forma de *noi* (nosotros) de *passeggiare*. *Spesso* va después del verbo.'
  it.a1.unit41.lesson04.teach.marco_cucino_volentieri:
    title: Los pasatiempos de Marco
    gloss: 'Marco: Cocino con gusto, también en casa. Y hago deporte a menudo.'
    note: '*Anche a casa* (también en casa) muestra que Marco cocina por gusto, no solo en el trabajo. *A casa* significa «en casa», sin artículo, como en español.'
  it.a1.unit41.lesson04.teach.giulia_cucini_anche:
    title: Giulia se sorprende
    gloss: 'Giulia: ¿Cocinas también en casa? ¡Si ya cocinas todo el día en el trabajo!'
    note: '*Già* (ya) y *tutto il giorno* (todo el día) muestran lo mucho que Marco ya cocina en el trabajo.'
  it.a1.unit41.lesson04.teach.marco_si_ma:
    title: Marco lo explica
    gloss: 'Marco: Sí, pero cocinar me relaja. Y tú, ¿qué te gusta hacer?'
    note: '*Cucinare mi rilassa* significa literalmente «cocinar me relaja», igual que en español: la actividad es el sujeto y *mi* (me) es el complemento.'
  it.a1.unit41.lesson04.teach.giulia_leggo_volentieri:
    title: Los pasatiempos de Giulia
    gloss: 'Giulia: Leo con gusto y escucho música a menudo.'
    note: 'Dos pasatiempos unidos con *e* (y). Los dos verbos quedan en la forma de *io*: *leggo* y *ascolto*.'
  it.a1.unit41.lesson04.teach.marco_giochi_anche:
    title: Marco pregunta por los videojuegos
    gloss: 'Marco: ¿Tú también juegas a videojuegos?'
    note: 'Una pregunta de sí o no mantiene el orden de la afirmación y solo cambia la entonación: *Giochi anche ai videogiochi?* *Anche* significa «también».'
  it.a1.unit41.lesson04.teach.giulia_no_non:
    title: Giulia responde
    gloss: 'Giulia: No, nunca juego a videojuegos. ¡Pero a veces dibujo!'
    note: '*Non ... mai* (nunca) y *a volte* (a veces) se contraponen en una misma respuesta. *Ma* significa «pero».'
  it.a1.unit41.lesson05.teach.marco_e_io:
    title: Comparar aficiones
    gloss: Marco y yo paseamos a menudo juntos. Pero también tenemos otros pasatiempos. A Marco le gusta cocinar, también en casa, y hace deporte a menudo. A mí me gusta leer y escucho música a menudo. A veces dibujo, pero nunca juego a videojuegos. ¿Qué te gusta hacer en tu tiempo libre?
    note: El mensaje de Giulia repasa datos de la lección 4 y termina haciendo al lector la pregunta central de la unidad.
    glosses:
      passeggiamo: damos un paseo
      spesso: a menudo
      insieme: juntos
      altri: otros
      cucina: cocina
      volentieri: con gusto
      casa: casa (a casa = en casa)
      sport: deporte (fa sport = hace deporte)
      leggo: leer
      ascolto: escucho
      musica: música
      disegno: dibujo
      volte: veces (a volte = a veces)
      videogiochi: videojuegos
      mai: nunca
      libero: libre
      tempo: tiempo
  it.a1.unit41.lesson06.teach.marco_cosa_fai:
    title: Marco pregunta por el fin de semana
    gloss: 'Marco: ¿Qué haces este fin de semana?'
    note: '*Questo fine settimana* (este fin de semana) es masculino, por eso es *questo*. *Fai* es la forma de *tu* de *fare* (hacer).'
  it.a1.unit41.lesson06.teach.giulia_non_lo:
    title: Giulia está indecisa
    gloss: 'Giulia: Todavía no lo sé. Me gusta leer, pero también quiero salir.'
    note: '*Non lo so ancora* (todavía no lo sé): *lo* representa lo que no sabes y va delante del verbo, como en español. *Uscire* significa «salir».'
  it.a1.unit41.lesson06.teach.marco_facciamo_una:
    title: Marco propone un plan
    gloss: 'Marco: ¿Damos un paseo juntos? Después cocino yo para nosotros.'
    note: '*Poi* (luego, después) ordena los planes. *Cucino io* (con *io* después del verbo) subraya «cocino yo».'
  it.a1.unit41.lesson06.teach.giulia_buona_idea:
    title: Giulia acepta
    gloss: 'Giulia: ¡Buena idea! Me gusta tanto pasear como cocinar.'
    note: '*Sia ... sia ...* significa «tanto ... como ...»: *mi piace sia passeggiare sia cucinare*.'
  it.a1.unit41.lesson06.teach.marco_perfetto_allora:
    title: Marco lo confirma
    gloss: 'Marco: Perfecto. ¡Entonces nos vemos el sábado!'
    note: '*Ci vediamo sabato* (nos vemos el sábado): no se pone artículo delante del día cuando se habla del próximo.'
