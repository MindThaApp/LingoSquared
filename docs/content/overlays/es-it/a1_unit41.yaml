course:
  title: Italiano A1
  description: 'Italiano para principiantes para hablar de las actividades del tiempo libre: vocabulario de pasatiempos, expresiones de frecuencia, preguntar y contestar qué hace alguien en su tiempo libre y comparar los pasatiempos de dos personas.'
