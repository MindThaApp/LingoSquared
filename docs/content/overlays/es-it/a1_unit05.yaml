teaching:
  it.a1.unit05.lesson01.teach.che_ore_sono:
    title: Che ore sono?
    gloss: ¿Qué hora es?
    note: 'La forma habitual de preguntar la hora en italiano; literalmente «qué horas son» (en español se pregunta en singular: «qué hora es»).'
  it.a1.unit05.lesson01.teach.sono_le_tre:
    title: Sono le tre.
    gloss: Son las tres.
    note: '*Sono le* + un número dice la hora para cualquier hora salvo la una, como en español («son las…»).'
  it.a1.unit05.lesson01.teach.ore_una_dodici:
    title: l'una, le due, le tre, le dodici
    gloss: la una, las dos, las tres, las doce
    note: 'La una es la única hora que usa *è l''una* (singular) en lugar de *sono le* (plural), porque «una» es singular; en español pasa igual: «es la una».'
    example_gloss:
    - Es la una.
    - Son las doce.
  it.a1.unit05.lesson01.teach.ore_quattro_sei:
    title: le quattro, le cinque, le sei
    gloss: las cuatro, las cinco, las seis
    note: Siguen el mismo esquema *sono le* + número que se usó para las tres.
    example_gloss:
    - Son las cuatro.
    - Son las seis.
  it.a1.unit05.lesson02.teach.sono_le_tre_e_mezzo:
    title: Sono le tre e mezzo.
    gloss: Son las tres y media.
    note: '*e mezzo* («y medio») suma treinta minutos a la hora.'
  it.a1.unit05.lesson02.teach.sono_le_tre_e_un_quarto:
    title: Sono le tre e un quarto.
    gloss: Son las tres y cuarto.
    note: '*e un quarto* («y un cuarto») suma quince minutos a la hora.'
  it.a1.unit05.lesson02.teach.sono_le_quattro_meno_un_quarto:
    title: Sono le quattro meno un quarto.
    gloss: Son las cuatro menos cuarto.
    note: '*meno un quarto* (menos un cuarto) cuenta hacia atrás desde la hora SIGUIENTE, igual que el español «las cuatro menos cuarto».'
  it.a1.unit05.lesson03.teach.a_che_ora_ci_vediamo:
    title: A che ora ci vediamo?
    gloss: ¿A qué hora quedamos?
    note: '*A che ora* pregunta a qué hora ocurre algo; *ci vediamo* significa «nos vemos».'
  it.a1.unit05.lesson03.teach.ci_vediamo_alle_tre_e_mezzo:
    title: Ci vediamo alle tre e mezzo.
    gloss: Quedamos a las tres y media.
    note: '*alle* («a las») se usa ante una hora concreta del reloj, a diferencia de *sono le*, que solo dice la hora.'
  it.a1.unit05.lesson03.teach.parti_del_giorno:
    title: di mattina, di pomeriggio, di sera
    gloss: por la mañana, por la tarde, por la noche
    note: Indican a qué parte del día se refiere una hora, porque la hora del reloj por sí sola no distingue la mañana de la tarde, como en español («de la mañana», «de la tarde»).
    example_gloss:
    - ¿La reunión es por la mañana o por la noche?
    - Es por la tarde, a las tres y media.
  it.a1.unit05.lesson03.teach.e_di_pomeriggio:
    title: È di pomeriggio, alle tre e mezzo.
    gloss: Es por la tarde, a las tres y media.
    note: Combina la parte del día con la hora concreta del reloj para evitar cualquier confusión entre mañana y tarde.
