teaching:
  it.a1.unit21.lesson01.teach_maglietta_pantaloni:
    title: la maglietta, i pantaloni
    gloss: camiseta, pantalones
    note: '*Maglietta* es femenino singular; *pantaloni* es plural en italiano, igual que «los pantalones» en español.'
    example_gloss:
    - La camiseta es azul.
    - Los pantalones son para Elena.
  it.a1.unit21.lesson01.teach_scarpe_giacca:
    title: le scarpe, la giacca
    gloss: zapatos, chaqueta
    note: '*Scarpe* es plural; *giacca* es femenino singular.'
    example_gloss:
    - Los zapatos son cómodos.
    - La chaqueta es grande.
  it.a1.unit21.lesson01.teach_blu_nero:
    title: blu
    gloss: azul
    note: '*Blu* no cambia según el género.'
    example_gloss:
    - La camiseta es azul.
  it.a1.unit21.lesson01.teach_la_maglietta_e_blu:
    title: La maglietta è blu.
    gloss: La camiseta es azul.
    note: Se usa *è* para describir el color de un solo objeto.
    example_gloss:
    - La camiseta es azul.
  it.a1.unit21.lesson02.teach_taglia_piccola_media_grande:
    title: taglia piccola, media, grande
    gloss: talla pequeña, mediana, grande
    note: '*Taglia* es la talla de la ropa. Es femenino, así que las palabras de talla concuerdan con ella: *taglia piccola*, *taglia media*; *grande* es igual para los dos géneros.'
    example_gloss:
    - Quisiera una talla mediana.
  it.a1.unit21.lesson02.teach_vorrei_maglietta_blu:
    title: Vorrei una maglietta blu, taglia media.
    gloss: Quisiera una camiseta azul, talla mediana.
    note: '*Vorrei* mantiene cortés la petición de ropa.'
    example_gloss:
    - Quisiera una camiseta azul, talla mediana.
  it.a1.unit21.lesson02.teach_quanto_costa:
    title: Quanto costa?
    gloss: ¿Cuánto cuesta?
    note: Para un solo objeto se usa *costa* en singular.
    example_gloss:
    - ¿Cuánto cuesta?
  it.a1.unit21.lesson02.teach_costa_dieci_euro:
    title: Costa dieci euro.
    gloss: Cuesta diez euros.
    note: A diferencia del español («diez euros»), en italiano estándar *euro* no cambia después de un número.
    example_gloss:
    - Cuesta diez euros.
