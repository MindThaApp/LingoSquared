teaching:
  it.a1.unit15.lesson01.teach.piu_meno:
    title: più, meno
    gloss: más, menos
    note: '*più* (más) y *meno* (menos) son las palabras básicas de comparación; se usan antes de un adjetivo o con *di* para comparar.'
    example_gloss:
    - Quiero más café y menos té.
  it.a1.unit15.lesson01.teach.di:
    title: di
    gloss: que / de
    note: 'Después de *più*/*meno*, *di* (de) significa ''que'' (*più di due euro*); delante de un artículo determinado se contrae: *di* + *i* = *dei*, *di* + *le* = *delle*.'
    example_gloss:
    - El café cuesta más de dos euros.
  it.a1.unit15.lesson01.teach.le_mele_costano_piu_dei_pomodori:
    title: Le mele costano più dei pomodori.
    gloss: Las manzanas cuestan más que los tomates.
    note: '*più dei pomodori* usa *di* + *i* (contraído en *dei*) para comparar con *i pomodori*.'
  it.a1.unit15.lesson01.teach.i_pomodori_costano_meno_delle_mele:
    title: I pomodori costano meno delle mele.
    gloss: Los tomates cuestan menos que las manzanas.
    note: '*meno delle mele* usa *di* + *le* (contraído en *delle*) para comparar con *le mele*.'
  it.a1.unit15.lesson02.teach.quale_preferisci:
    title: Quale preferisci, le mele o i pomodori?
    gloss: ¿Cuál prefieres, las manzanas o los tomates?
    note: '*Quale* (cuál) pide a quien escucha que elija entre las dos cosas que se acaban de nombrar.'
  it.a1.unit15.lesson02.teach.preferisco_le_mele:
    title: Preferisco le mele.
    gloss: Prefiero las manzanas.
    note: '*Preferisco* (prefiero) más *le mele* (las manzanas) responde a la pregunta con una elección.'
    example_gloss:
    - Prefiero los tomates.
  it.a1.unit15.lesson03.teach.come:
    title: come
    gloss: como
    note: '*come* (como) se usa con *buono/a* para comparar dos cosas como iguales.'
    example_gloss:
    - El té está tan bueno como el café.
  it.a1.unit15.lesson03.teach.le_mele_sono_buone_come_i_pomodori:
    title: Le mele sono buone come i pomodori.
    gloss: Las manzanas están tan buenas como los tomates.
    note: '*sono buone* (son buenas, femenino plural) concuerda con *le mele*; *come* introduce la comparación de igualdad.'
