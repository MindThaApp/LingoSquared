  it.a1.unit18.lesson01.teach.la_cucina_il_soggiorno:
    title: la cucina, il soggiorno
    gloss: cocina, salón
    note: '*la cucina* (cocina) es femenino; *il soggiorno* (salón) es masculino.'
    example_gloss:
    - La cocina es grande.
    - El salón es cómodo.
  it.a1.unit18.lesson01.teach.la_camera_da_letto_il_bagno:
    title: la camera da letto, il bagno
    gloss: dormitorio, baño
    note: '*la camera da letto* es literalmente ''la habitación para la cama'' (*letto* = cama); *il bagno* es el baño.'
    example_gloss:
    - El dormitorio es pequeño.
    - El baño está limpio.
  it.a1.unit18.lesson01.teach.questa_e_la_mia_casa:
    title: Questa è la mia casa.
    gloss: Esta es mi casa.
    note: '*Questa* (esta, femenino) concuerda con *casa* (casa), que es femenino.'
  it.a1.unit18.lesson01.teach.ci_sono_quattro_stanze:
    title: Ci sono quattro stanze.
    gloss: Hay cuatro habitaciones.
    note: '*Ci sono* (hay) más un número y *stanze* (habitaciones); *quattro* (cuatro) se vio en la unidad 3.'
  it.a1.unit18.lesson02.teach.il_letto_il_tavolo:
    title: il letto, il tavolo
    gloss: cama, mesa
    note: '*il letto* (cama) y *il tavolo* (mesa) son ambos masculinos.'
    example_gloss:
    - La cama está en el dormitorio.
    - La mesa está en la cocina.
  it.a1.unit18.lesson02.teach.la_sedia_il_divano:
    title: la sedia, il divano
    gloss: silla, sofá
    note: '*la sedia* (silla) es femenino; *il divano* (sofá) es masculino.'
    example_gloss:
    - La silla está cerca de la mesa.
    - El sofá está en el salón.
  it.a1.unit18.lesson02.teach.il_letto_e_nella_camera_da_letto:
    title: Il letto è nella camera da letto.
    gloss: La cama está en el dormitorio.
    note: '*nella* une *in* + *la* para decir ''en la''; en español no se funden: ''en la''.'
  it.a1.unit18.lesson02.teach.il_divano_e_nel_soggiorno:
    title: Il divano è nel soggiorno.
    gloss: El sofá está en el salón.
    note: '*nel* une *in* + *il* (masculino) para decir ''en el''.'
  it.a1.unit18.lesson03.teach.vicino_a_davanti:
    title: vicino a, davanti a
    gloss: cerca de, delante de
    note: Las dos son preposiciones de dos palabras que terminan en *a*, que se contrae con el artículo siguiente (*al*, *alla*).
    example_gloss:
    - La silla está cerca de la mesa.
    - La cama está delante de la ventana.
  it.a1.unit18.lesson03.teach.dietro_sopra_sotto:
    title: dietro, sopra, sotto
    gloss: detrás de, encima de / sobre, debajo de
    note: 'Tres palabras más de lugar: *dietro* (detrás), *sopra* (encima / sobre), *sotto* (debajo); ninguna necesita *a* antes de un artículo.'
    example_gloss:
    - El sofá está detrás de la mesa.
    - El libro está sobre la mesa.
    - El gato está debajo de la cama.
  it.a1.unit18.lesson03.teach.dove_il_letto:
    title: Dov'è il letto?
    gloss: ¿Dónde está la cama?
    note: '*Dov''è* es la contracción de *dove* (dónde) + *è* (está).'
  it.a1.unit18.lesson03.teach.il_letto_e_vicino_alla_finestra:
    title: Il letto è vicino alla finestra.
    gloss: La cama está cerca de la ventana.
    note: '*vicino alla finestra* usa *vicino a* + *la finestra* (la ventana), contraído en *alla*.'
