teaching:
  it.a1.unit10.lesson01.teach.a_destra_a_sinistra:
    title: a destra, a sinistra
    gloss: a la derecha, a la izquierda
    note: '*a destra* (a la derecha) y *a sinistra* (a la izquierda) son las dos direcciones básicas para girar.'
    example_gloss:
    - Gira a la derecha, por favor.
  it.a1.unit10.lesson01.teach.sempre_dritto_incrocio:
    title: sempre dritto, all'incrocio
    gloss: todo recto, en el cruce
    note: '*sempre dritto* (todo recto) y *all''incrocio* (en el cruce) indican cómo y dónde girar.'
    example_gloss:
    - Sigue todo recto hasta el cruce.
  it.a1.unit10.lesson01.teach.scusi_come_arrivo_al_museo:
    title: Scusi, come arrivo al museo?
    gloss: Disculpe, ¿cómo llego al museo?
    note: '*Scusi* (disculpe, en trato formal) abre la pregunta antes de *come arrivo* (cómo llego) más el destino.'
  it.a1.unit10.lesson01.teach.vada_sempre_dritto:
    title: Vada sempre dritto, poi giri a destra all'incrocio.
    gloss: Siga todo recto y luego gire a la derecha en el cruce.
    note: '*Vada* y *giri* son imperativos de cortesía (Lei), la forma educada en que un desconocido da indicaciones.'
  it.a1.unit10.lesson02.teach.e_lontano_da_qui:
    title: È lontano da qui?
    gloss: ¿Está lejos de aquí?
    note: '*È lontano* (¿está lejos?) más *da qui* (de aquí) pregunta por la distancia.'
  it.a1.unit10.lesson02.teach.no_cinque_minuti:
    title: No, sono solo cinque minuti a piedi.
    gloss: No, son solo cinco minutos a pie.
    note: '*a piedi* (a pie) indica cómo se mide la distancia.'
  it.a1.unit10.lesson02.teach.molto_gentile:
    title: Grazie mille, molto gentile.
    gloss: Muchas gracias, es usted muy amable.
    note: '*molto gentile* (muy amable) añade calidez después de dar las gracias por una ayuda.'
    example_gloss:
