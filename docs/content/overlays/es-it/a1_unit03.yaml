teaching:
  it.a1.unit03.lesson01.teach.numeri_zero_cinque:
    title: zero, uno, due, tre, quattro, cinque
    gloss: cero, uno, dos, tres, cuatro, cinco
    note: 'Los seis primeros números: las piezas básicas para precios, edades y números de teléfono a lo largo de esta unidad.'
    example_gloss:
    - Tengo dos hermanos.
    - Son las cinco.
  it.a1.unit03.lesson01.teach.numeri_sei_dieci:
    title: sei, sette, otto, nove, dieci
    gloss: seis, siete, ocho, nueve, diez
    note: Los números del seis al diez, que completan la serie del 0 al 10.
    example_gloss:
    - Trabajo ocho horas al día.
    - La tienda abre a las diez.
  it.a1.unit03.lesson01.teach.quanti_anni:
    title: Quanti anni hai?
    gloss: ¿Cuántos años tienes?
    note: 'Literalmente «cuántos años tienes»: el italiano pregunta la edad con *avere* (tener), igual que el español.'
  it.a1.unit03.lesson01.teach.ho_trent_anni:
    title: Ho trent'anni.
    gloss: Tengo treinta años.
    note: Expresión fija para decir la edad con *avere* (tengo treinta años). En esta unidad solo aparecen el 30 y el 50 en esta frase y en los precios; el resto de las decenas vendrá más adelante.
  it.a1.unit03.lesson02.teach.quanto_costa:
    title: Quanto costa un caffè?
    gloss: ¿Cuánto cuesta un café?
    note: '*Quanto costa* es la forma habitual de preguntar el precio de un artículo.'
  it.a1.unit03.lesson02.teach.costa_un_euro:
    title: un euro, due euro
    gloss: un euro, dos euros
    note: '*euro* no cambia en plural en italiano: *un euro* y *due euro* usan la misma forma *euro*, a diferencia del español «euros».'
    example_gloss:
    - Cuesta un euro.
    - Son dos euros con cincuenta.
  it.a1.unit03.lesson02.teach.un_cornetto:
    title: E un cornetto?
    gloss: ¿Y un cruasán?
    note: Una pregunta breve para saber el precio de un segundo artículo, un *cornetto* (el cruasán italiano del desayuno).
  it.a1.unit03.lesson02.teach.due_euro_cinquanta:
    title: Sono due euro e cinquanta.
    gloss: Son dos euros con cincuenta.
    note: '*e cinquanta* añade los céntimos: literalmente «y cincuenta»; se usa igual para cualquier precio con cincuenta céntimos.'
  it.a1.unit03.lesson02.teach.quanti_ne_vuole:
    title: Quanti ne vuole?
    gloss: ¿Cuántos quiere?
    note: La forma formal en que un camarero o un tendero pregunta cuántas unidades quieres; *ne* sustituye al producto ya mencionado.
  it.a1.unit03.lesson02.teach.ne_vorrei_tre:
    title: Ne vorrei tre, grazie.
    gloss: Quiero tres, gracias.
    note: '*Ne vorrei* + un número es la forma cortés de pedir una cantidad, de nuevo con *ne* para retomar el producto.'
  it.a1.unit03.lesson03.teach.qual_e_il_tuo_numero:
    title: Qual è il tuo numero di telefono?
    gloss: ¿Cuál es tu número de teléfono?
    note: La forma informal de pedir el número de teléfono de alguien, con *tuo* (tu, informal).
  it.a1.unit03.lesson03.teach.ti_chiamo_domani:
    title: Ti chiamo domani!
    gloss: ¡Te llamo mañana!
    note: Una manera amistosa de terminar una conversación después de conseguir el número de alguien.
  it.a1.unit03.lesson03.teach.il_mio_numero:
    title: il mio numero
    gloss: mi número
    note: Los números de teléfono italianos suelen leerse cifra por cifra, con los números que ya conoces.
    example_gloss: Mi número es cero, tres, cuatro, dos, uno.
  it.a1.unit03.lesson03.teach.numero_sam:
    title: Il mio numero è zero, tre, quattro, due, uno.
    gloss: Mi número es cero, tres, cuatro, dos, uno.
    note: Sam da su número de teléfono cifra por cifra, que es la manera habitual de dictar un número de teléfono en italiano.
  it.a1.unit03.lesson03.teach.perfetto_grazie:
    title: Perfetto, grazie!
    gloss: ¡Perfecto, gracias!
    note: Una manera breve y animada de cerrar una conversación después de obtener la información que necesitabas.
