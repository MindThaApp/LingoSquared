teaching:
  it.a1.unit17.lesson01.teach.il_lavoro:
    title: il lavoro
    gloss: trabajo / empleo
    note: '*il lavoro* es un sustantivo masculino que significa tanto ''empleo'' como ''trabajo'' en general.'
    example_gloss:
    - Mi trabajo es interesante.
  it.a1.unit17.lesson01.teach.insegnante_commesso:
    title: insegnante, commesso
    gloss: profesor/a, dependiente
    note: '*insegnante* (profesor/a) tiene la misma forma para hombres y mujeres; *commesso* (dependiente) es masculino: el femenino es *commessa*.'
    example_gloss:
    - Soy profesor, no dependiente.
  it.a1.unit17.lesson01.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: ¿A qué te dedicas?
    note: '*Che lavoro fai?* (literalmente ''¿Qué trabajo haces?'') es la forma habitual de preguntar la profesión de alguien.'
  it.a1.unit17.lesson01.teach.sono_insegnante:
    title: Sono insegnante.
    gloss: Soy profesor.
    note: 'El italiano omite el artículo delante de una profesión sin más: *Sono insegnante*, no *Sono un insegnante*. El español también: ''Soy profesor''.'
  it.a1.unit17.lesson01.teach.sono_commesso:
    title: Sono commesso.
    gloss: Soy dependiente.
    note: El mismo patrón sin artículo que *Sono insegnante*.
  it.a1.unit17.lesson02.teach.ufficio_scuola:
    title: l'ufficio, la scuola
    gloss: oficina, escuela
    note: '*l''ufficio* (oficina) elide el artículo ante vocal; *la scuola* (escuela) es femenino.'
    example_gloss:
    - Trabajo en una oficina.
    - Trabajo en una escuela.
  it.a1.unit17.lesson02.teach.dove_lavori:
    title: Dove lavori?
    gloss: ¿Dónde trabajas?
    note: '*Dove* (dónde) más *lavori* (trabajas, informal).'
  it.a1.unit17.lesson02.teach.lavoro_in_un_ufficio:
    title: Lavoro in un ufficio.
    gloss: Trabajo en una oficina.
    note: '*Lavoro in* (trabajo en) más *un ufficio* (una oficina).'
  it.a1.unit17.lesson02.teach.lavoro_in_una_scuola:
    title: Lavoro in una scuola.
    gloss: Trabajo en una escuela.
    note: El mismo patrón con *una scuola* (una escuela).
  it.a1.unit17.lesson03.teach.inizio_finisco:
    title: inizio, finisco
    gloss: empiezo, termino
    note: '*inizio* (empiezo) y *finisco* (termino) son las formas de primera persona del presente de *iniziare* y *finire*.'
    example_gloss:
    - Empiezo a las nueve.
    - Termino a las cinco.
  it.a1.unit17.lesson03.teach.a_che_ora_inizi:
    title: A che ora inizi?
    gloss: ¿A qué hora empiezas?
    note: '*A che ora* (a qué hora) más *inizi* (empiezas, informal).'
  it.a1.unit17.lesson03.teach.inizio_alle_nove_e_finisco_alle_cinque:
    title: Inizio alle nove e finisco alle cinque.
    gloss: Empiezo a las nueve y termino a las cinco.
    note: '*alle nove* / *alle cinque* (a las nueve / a las cinco) usa *alle* (a las) delante de la hora, como en las frases de la hora de la unidad 5.'
