course:
  title: Italiano A1
  description: 'Italiano para principiantes para hablar de mascotas y animales comunes: nombrarlos, cuidados básicos (pasear, dar de comer, jugar), decir qué animales te gustan aunque no tengas ninguno y el plural italiano.'
