teaching:
  it.a1.unit43.lesson01.teach.l_animale_un:
    title: Animal, mascota
    gloss: el animal / una mascota
    note: '*Animale* es la palabra general; *animale domestico* significa «mascota» (literalmente, animal doméstico).'
    example_gloss:
    - Un perro es un animal.
    - Un perro también es una mascota.
  it.a1.unit43.lesson01.teach.il_cane_il:
    title: Perro y gato
    gloss: el perro / el gato
    example_gloss:
    - Giulia tiene un perro.
    - Luca tiene un gato.
  it.a1.unit43.lesson01.teach.il_pesce_l:
    title: Pez y pájaro
    gloss: el pez / el pájaro
    example_gloss:
    - El abuelo tiene un pez.
    - Nina tiene un pájaro.
  it.a1.unit43.lesson01.teach.hai_un_animale:
    title: ¿Tienes una mascota?
    gloss: ¿Tienes una mascota?
    note: '*Hai ...?* es la forma de *tu* de *avere*. Solo el tono de voz convierte la afirmación en pregunta.'
  it.a1.unit43.lesson01.teach.si_ho_un:
    title: Sí, tengo un perro
    gloss: Sí, tengo un perro.
    note: Una respuesta afirmativa sencilla con el vocabulario nuevo de esta unidad.
  it.a1.unit43.lesson01.teach.no_non_ho:
    title: No, no tengo mascota
    gloss: No, no tengo mascota.
    note: 'Para decir que no tienes algo, pon *non* delante del verbo: *non ho*. Mira la nota de gramática.'
  it.a1.unit43.lesson01.teach.per_dire_che:
    title: Non antes del verbo
    gloss: 'Para decir que no tienes algo, pon non delante del verbo: Non ho tempo, Non ho animali domestici.'
    note: 'Igual que en español («no tengo tiempo»), después de *non ho* el sustantivo no suele llevar artículo: *non ho tempo*, *non ho animali*.'
  it.a1.unit43.lesson02.teach.portare_a_spasso:
    title: Pasear (a un animal)
    gloss: pasear (a un animal)
    note: '*Portare a spasso* es una expresión fija para pasear a un animal. El pronombre va delante del verbo: *lo porto a spasso*.'
    example_gloss: Paseo al perro todos los días.
  it.a1.unit43.lesson02.teach.il_pronome_lo:
    title: Los pronombres van antes del verbo
    gloss: 'El pronombre lo sustituye a il cane y va delante del verbo: lo porto a spasso, gli do da mangiare.'
    note: 'Como en español («lo paseo», «le doy de comer»), el italiano pone *lo* y *gli* delante del verbo: *lo porto*, *gli do*.'
  it.a1.unit43.lesson02.teach.dare_da_mangiare:
    title: Dar de comer
    gloss: dar de comer
    example_gloss: Le doy de comer al gato todos los días.
  it.a1.unit43.lesson02.teach.giocare_con:
    title: Jugar con
    gloss: jugar con
    example_gloss: Luca juega con su gato.
  it.a1.unit43.lesson02.teach.porto_a_spasso:
    title: Paseo al perro todos los días
    gloss: Paseo al perro todos los días.
    note: '*Ogni giorno* (todos los días) va al final de la frase, como en *porto a spasso il cane ogni giorno*.'
  it.a1.unit43.lesson02.teach.do_da_mangiare:
    title: Le doy de comer al gato todos los días
    gloss: Le doy de comer al gato todos los días.
    note: '*Dare da mangiare* (dar de comer) es literalmente «dar de comer», igual que en español. *Do* es la forma de *io* de *dare*.'
  it.a1.unit43.lesson03.teach.il_plurale_cambia:
    title: 'Plural: il cane -> i cani'
    gloss: 'El plural cambia la vocal final y el artículo: il cane -> i cani, il gatto -> i gatti, l''uccello -> gli uccelli, il pesce -> i pesci.'
    note: 'El plural regular italiano, que se presenta aquí por primera vez con nombres de animales. A diferencia del español, no se añade -s: cambia la vocal final.'
  it.a1.unit43.lesson03.teach.i_cani_i:
    title: Perros y gatos
    gloss: perros / gatos
    example_gloss:
    - A Marco le encantan los perros.
    - A Chiara le encantan los gatos.
  it.a1.unit43.lesson03.teach.i_pesci_gli:
    title: Peces y pájaros (plural)
    gloss: peces / pájaros
    example_gloss:
    - Adoro los peces.
    - El abuelo adora los pájaros.
  it.a1.unit43.lesson03.teach.amo_gli_animali:
    title: Adoro a los animales
    gloss: Adoro a los animales.
    note: '*Amare* (amar, encantar) lleva su complemento directamente: *amo gli animali*. El sustantivo plural necesita el artículo plural *gli*.'
  it.a1.unit43.lesson03.teach.chiara_ama_i:
    title: A Chiara le encantan los gatos, pero no tiene mascota
    gloss: A Chiara le encantan los gatos, pero no tiene mascota.
    note: Prepara el contraste en torno al cual se construye la lectura de la lección 5.
  it.a1.unit43.lesson04.teach.marco_hai_un:
    title: Marco pregunta por una mascota
    gloss: 'Marco: ¿Tienes una mascota, Giulia?'
  it.a1.unit43.lesson04.teach.giulia_si_ho:
    title: Giulia tiene un perro
    gloss: 'Giulia: Sí, tengo un perro.'
  it.a1.unit43.lesson04.teach.marco_com_e:
    title: Marco pregunta cómo es
    gloss: 'Marco: ¿Cómo es?'
    note: '*Com''è?* también sirve para animales. La respuesta usa *è* o *ha*: *è piccolo*, *ha il pelo castano*.'
  it.a1.unit43.lesson04.teach.giulia_ha_il:
    title: Giulia describe a su perro
    gloss: 'Giulia: Tiene el pelo castaño y es pequeño.'
    note: Retoma el vocabulario de color del pelo y de tamaño de la unidad del aspecto físico, ahora para describir el pelaje de un animal y no el pelo de una persona.
  it.a1.unit43.lesson04.teach.un_animale_e:
    title: Los animales son masculinos o femeninos
    gloss: 'Un animal es masculino o femenino, como una persona: il cane es lui, la gatta es lei.'
    note: 'Igual que en español, el italiano no tiene un pronombre neutro «it»: cada sustantivo es masculino o femenino, así que un perro es *lui* y una gata es *lei*, y los pronombres lo siguen (*lo*, *la*).'
  it.a1.unit43.lesson04.teach.marco_lo_porti:
    title: Marco pregunta por los paseos
    gloss: 'Marco: ¿Lo sacas a pasear todos los días?'
  it.a1.unit43.lesson04.teach.giulia_si_lo:
    title: Giulia cuenta su rutina
    gloss: 'Giulia: Sí, lo saco a pasear todos los días y le doy de comer.'
  it.a1.unit43.lesson05.teach.marco_e_chiara:
    title: Marco, Chiara y Luca hablan de animales
    gloss: 'A Marco y a Chiara les encantan los animales, pero ninguno de los dos tiene mascota. A Marco le encantan los perros y a Chiara los gatos. Luca, en cambio, sí tiene una mascota: un gato. Juega a menudo con su gato y le da de comer todos los días. ¿Tienes tú una mascota?'
    note: Contrasta querer a los animales con tener uno de verdad, que es el objetivo comunicativo de la unidad.
    glosses:
      amano: adorar
      entrambi: los dos
      animali: animales
      due: dos (nessuno dei due = ninguno de los dos)
      domestico: doméstico (animale domestico = mascota)
      cani: perros
      gatti: gatos
      gatto: gato
      gioca: juega
      dà: da
      ogni: cada
      mangiare: comer (dare da mangiare = dar de comer)
  it.a1.unit43.lesson05.teach.luca_gioca_spesso:
    title: Luca juega a menudo con su gato
    gloss: Luca juega a menudo con su gato.
    note: '*Spesso* (a menudo) va después del verbo: *gioca spesso*. *Giocare con* significa «jugar con».'
  it.a1.unit43.lesson05.teach.amo_i_cani:
    title: Adoro a los perros. No tengo mascota.
    gloss: Adoro a los perros. No tengo mascota.
    note: Una respuesta modelo de dos frases, lista para reutilizar en el ejercicio de escritura de la unidad.
  it.a1.unit43.lesson06.teach.giulia_nina_hai:
    title: Giulia pregunta a Nina
    gloss: 'Giulia: Nina, ¿tú también tienes una mascota?'
  it.a1.unit43.lesson06.teach.nina_si_ho:
    title: Nina tiene un pájaro llamado Pico
    gloss: 'Nina: Sí, tengo un pájaro. Se llama Pico.'
    note: '*Si chiama Pico* significa «se llama Pico», igual que en español; literalmente, «se llama a sí mismo Pico».'
  it.a1.unit43.lesson06.teach.marco_che_bello:
    title: Marco reacciona
    gloss: 'Marco: ¡Qué bonito! ¿Qué haces con él todos los días?'
  it.a1.unit43.lesson06.teach.nina_gli_do:
    title: Nina le da de comer todos los días
    gloss: 'Nina: Le doy de comer todos los días.'
  it.a1.unit43.lesson06.teach.marco_anch_io:
    title: A Marco también le encantan los pájaros
    gloss: 'Marco: A mí también me encantan los pájaros.'
  it.a1.unit43.lesson06.teach.giulia_che_bello:
    title: Giulia cierra la conversación
    gloss: 'Giulia: ¡Qué bien que los tres amemos a los animales!'
    note: Una frase de cierre que reúne los datos sobre animales de los tres personajes.
