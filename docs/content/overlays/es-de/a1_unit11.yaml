  de.a1.unit11.lesson01.teach.arbeiten:
    title: arbeiten
    gloss: trabajar
    note: '*arbeiten* lleva la terminación normal de *ich*: *ich arbeite*.'
    example_gloss: 'En contexto: Trabajo por la tarde.'
  de.a1.unit11.lesson01.teach.lernen:
    title: lernen
    gloss: aprender / estudiar
    note: '*lernen* puede significar ''estudiar'' cuando el complemento es una materia, como el alemán.'
    example_gloss: 'En contexto: Por la noche estudio alemán.'
  de.a1.unit11.lesson01.teach.schlafen:
    title: schlafen gehen
    gloss: irse a dormir / acostarse
    note: '*schlafen gehen* describe el momento de irse a la cama por la noche.'
    example_gloss: 'En contexto: Me acuesto a las diez.'
  de.a1.unit11.lesson01.teach.dann:
    title: Dann frühstücke ich.
    gloss: Luego desayuno.
    note: 'Tras *dann*, el verbo va en segunda posición y el sujeto detrás: *Dann frühstücke ich*, no *Dann ich frühstücke*.'
  de.a1.unit11.lesson02.teach.wann_stehen_sie_auf:
    title: Wann stehen Sie auf?
    gloss: ¿Cuándo se levanta usted?
