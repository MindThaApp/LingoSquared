teaching:
  de.a1.unit17.lesson01.teach.kopfschmerzen:
    title: Kopfschmerzen
    gloss: dolor de cabeza
    note: '*Kopfschmerzen* tiene forma de plural, pero se usa para decir ''un dolor de cabeza''.'
    example_gloss: Me duele la cabeza.
  de.a1.unit17.lesson01.teach.bauchschmerzen:
    title: Bauchschmerzen
    gloss: dolor de estómago
    note: '*Bauch* es el vientre o estómago; *Schmerzen* significa dolores.'
    example_gloss: Tengo dolor de estómago.
  de.a1.unit17.lesson01.teach.hals:
    title: Hals
    gloss: garganta / cuello
    note: '*Hals* significa garganta o cuello según el contexto.'
    example_gloss: Me duele la garganta.
  de.a1.unit17.lesson01.teach.weh:
    title: Mein Kopf tut weh.
    gloss: Me duele la cabeza.
    note: 'Como en español (''me duele la cabeza''), el alemán pone la parte del cuerpo como sujeto: *Mein Kopf tut weh*, literalmente ''mi cabeza hace daño''.'
    example_gloss: Me duele el estómago.
  de.a1.unit17.lesson01.teach.mir_ist_schlecht:
    title: Mir ist schlecht.
    gloss: Me siento mal.
    note: No se traduce palabra por palabra; *Mir ist schlecht* es la frase natural para 'me siento mal' o 'tengo náuseas'.
    example_gloss: Me siento mal; tengo dolor de estómago.
  de.a1.unit17.lesson02.teach.brauchen_sie_hilfe:
    title: Brauchen Sie Hilfe?
    gloss: ¿Necesita ayuda?
    note: El *Sie* formal mantiene la pregunta cortés.
  de.a1.unit17.lesson02.teach.ich_brauche:
    title: Ich brauche Wasser.
    gloss: Necesito agua.
    note: '*brauche* significa ''necesito''.'
    example_gloss: 'En contexto: Necesito agua y un descanso.'
  de.a1.unit17.lesson02.teach.pause:
    title: Pause
    gloss: pausa / descanso
    note: '*eine Pause* es un descanso breve.'
    example_gloss: Necesito un descanso.
  de.a1.unit17.lesson02.teach.health_instruction:
    title: Trinken Sie Wasser.
    gloss: Beba agua. Haga una pausa.
    note: El *Sie* formal mantiene la instrucción cortés.
    example_gloss: Haga una pausa.
  de.a1.unit17.lesson02.teach.gesundheit_text:
    title: Annas Problem
    gloss: el problema de Anna
    note: El texto breve indica el síntoma y la necesidad inmediata.
    example_gloss: Ella necesita agua.
  de.a1.unit17.lesson02.teach.line01:
    title: Felix pregunta cómo está Anna
    gloss: 'Felix: Anna, ¿se encuentra bien?'
    note: Felix mantiene el *Ihnen* formal con Anna.
  de.a1.unit17.lesson02.teach.line02:
    title: Anna dice cuál es el problema
    gloss: 'Anna: No, tengo dolor de cabeza.'
    note: La respuesta expresa el síntoma de forma sencilla.
  de.a1.unit17.lesson02.teach.line03:
    title: Felix ofrece ayuda
    gloss: 'Felix: ¿Necesita ayuda?'
    note: Un ofrecimiento sencillo de ayuda.
  de.a1.unit17.lesson02.teach.line04:
    title: Anna dice lo que necesita
    gloss: 'Anna: Sí, por favor. Necesito agua y un descanso.'
    note: La respuesta dice *Ja, bitte* y nombra las necesidades inmediatas.
    example_gloss: 'En contexto: Necesito agua y un descanso.'
