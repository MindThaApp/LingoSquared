  de.a1.unit15.lesson01.teach.teurer:
    title: teurer
    gloss: más caro
    note: '*teuer* pasa a *teurer*; a diferencia del español ''más caro'', no se añade una palabra aparte para ''más''.'
    example_gloss: El café es más caro.
  de.a1.unit15.lesson01.teach.kaelter:
    title: kälter
    gloss: más frío
    note: '*kalt* cambia de vocal: *kälter*.'
    example_gloss: 'En contexto: El agua está más fría que el té.'
  de.a1.unit15.lesson01.teach.naeher:
