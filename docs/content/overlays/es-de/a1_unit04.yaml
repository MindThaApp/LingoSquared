teaching:
  de.a1.unit04.lesson01.teach.montag:
    title: Montag
    gloss: Lunes
    note: En los países de habla alemana la semana empieza con *Montag* (el lunes).
    example_gloss: El lunes tengo tiempo.
  de.a1.unit04.lesson01.teach.dienstag:
    title: Dienstag
    gloss: martes
    note: '*Dienstag* es el segundo día de la semana.'
    example_gloss: El martes tengo tiempo.
  de.a1.unit04.lesson01.teach.mittwoch:
    title: Mittwoch
    gloss: miércoles
    note: '*Mittwoch* significa literalmente «mitad de la semana»: de verdad es el día central de la semana laboral alemana.'
    example_gloss: El miércoles tengo tiempo.
  de.a1.unit04.lesson01.teach.donnerstag:
    title: Donnerstag
    gloss: jueves
    note: '*Donnerstag* debe su nombre al dios germánico Donar (Thor).'
    example_gloss: El jueves tengo tiempo.
  de.a1.unit04.lesson01.teach.freitag:
    title: Freitag
    gloss: viernes
    note: '*Freitag* debe su nombre a la diosa germánica Frigg.'
    example_gloss: El viernes tengo tiempo.
  de.a1.unit04.lesson01.teach.samstag:
    title: Samstag
    gloss: Sábado
    note: '*Samstag* es la palabra estándar para «sábado» en la mayor parte de Alemania; *Sonnabend* es una variante regional (norte y este de Alemania).'
    example_gloss: El sábado tengo tiempo.
  de.a1.unit04.lesson01.teach.sonntag:
    title: Sonntag
    gloss: Domingo
    note: '*Sonntag* significa literalmente «día del sol».'
    example_gloss: El domingo tengo tiempo.
  de.a1.unit04.lesson01.teach.welcher_tag:
    title: Welcher Tag ist heute?
    gloss: ¿Qué día es hoy?
    note: '*heute* significa «hoy»; *Welcher Tag* = «qué día».'
  de.a1.unit04.lesson02.teach.januar:
    title: Januar
    gloss: enero
    note: '*Januar* es el primer mes del año.'
    example_gloss: Mi cumpleaños es en enero.
  de.a1.unit04.lesson02.teach.maerz:
    title: März
    gloss: Marzo
    note: '*März* es el tercer mes del año.'
    example_gloss: Mi cumpleaños es en marzo.
  de.a1.unit04.lesson02.teach.mai:
    title: Mai
    gloss: mayo
    note: '*Mai* es corto y fácil de recordar; se parece mucho a «mayo».'
    example_gloss: Mi cumpleaños es en mayo.
  de.a1.unit04.lesson02.teach.juli:
    title: Juli
    gloss: julio
    note: '*Juli* es el séptimo mes del año.'
    example_gloss: Mi cumpleaños es en julio.
  de.a1.unit04.lesson02.teach.september:
    title: September
    gloss: septiembre
    note: '*September* se parece a «septiembre», pero en alemán acaba en -er.'
    example_gloss: Mi cumpleaños es en septiembre.
  de.a1.unit04.lesson02.teach.dezember:
    title: Dezember
    gloss: diciembre
    note: '*Dezember* es el último mes del año.'
    example_gloss: Mi cumpleaños es en diciembre.
  de.a1.unit04.lesson02.teach.welcher_monat:
    title: Welcher Monat ist es?
    gloss: ¿Qué mes es?
    note: '*Monat* significa «mes»; *es* es un sujeto neutro («ello») que en español se omite.'
  de.a1.unit04.lesson03.teach.wievielte:
    title: Der Wievielte ist heute?
    gloss: ¿Qué fecha es hoy?
    note: 'Literalmente «¿el cuántos es hoy?»: es la forma habitual de preguntar la fecha en alemán, parecida a nuestro «¿a cuántos estamos?».'
  de.a1.unit04.lesson03.teach.siebte_juli:
    title: Heute ist der siebte Juli.
    gloss: Hoy es 7 de julio.
    note: 'Como en español, primero va el día y luego el mes, pero con un ordinal y sin «de»: *der siebte Juli* = «el séptimo (de) julio». Aprende *der siebte Juli* como una frase completa.'
  de.a1.unit04.lesson03.teach.dienstag_siebte_juli:
    title: Heute ist Dienstag, der siebte Juli.
    gloss: Hoy es martes, 7 de julio.
    note: Se añade el día de la semana antes de la fecha, separado por una coma.
  de.a1.unit04.lesson03.teach.numerische_form:
    title: Man kann es auch als 7.7. schreiben.
    gloss: También se puede escribir 7.7.
    note: 'Las fechas numéricas alemanas ponen primero el día y luego el mes, cada uno seguido de un punto: 7.7. = 7 de julio. Es el mismo orden que en español, pero con puntos en lugar de barras.'
  de.a1.unit04.lesson03.teach.geburtstag_frage:
    title: Wann haben Sie Geburtstag?
    gloss: ¿Cuándo es su cumpleaños? (formal)
    note: 'Literalmente «¿Cuándo tiene usted cumpleaños?»: el alemán usa *haben* («tener») con Geburtstag, mientras que el español suele decir «¿Cuándo es su cumpleaños?».'
  de.a1.unit04.lesson03.teach.geburtstag_antwort:
    title: Mein Geburtstag ist der dritte März.
    gloss: Mi cumpleaños es el 3 de marzo.
    note: '*Mein Geburtstag* = «mi cumpleaños»; *der dritte März* = «3 de marzo» (primero el día y luego el mes).'
  de.a1.unit04.lesson04.teach.oeffnet:
    title: öffnet
    gloss: abre
    note: '*öffnet* es la forma de tercera persona del singular de *öffnen* (abrir): sirve para decir «abre», por ejemplo de una tienda o una biblioteca.'
    example_gloss: La tienda abre el lunes.
  de.a1.unit04.lesson04.teach.wieder:
    title: wieder
    gloss: de nuevo
    note: '*wieder* significa «de nuevo»; aquí se usa para preguntar cuándo reabre algo.'
    example_gloss: La biblioteca vuelve a abrir el lunes.
  de.a1.unit04.lesson04.teach.die:
    title: die
    gloss: la / las (femenino y plural)
    note: '*die* es el artículo determinado del femenino singular y de todos los plurales; aquí acompaña al sustantivo femenino *Bibliothek*.'
    example_gloss: La biblioteca es grande.
  de.a1.unit04.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: biblioteca
    note: '*Bibliothek* es un sustantivo femenino (*die Bibliothek*).'
    example_gloss: Voy a la biblioteca.
  de.a1.unit04.lesson04.teach.am:
    title: am
    gloss: el / en el
    note: '*am* es la contracción de *an dem* y se usa con los días de la semana y las fechas (*am Montag* = «el lunes»).'
    example_gloss: El lunes trabajo.
  de.a1.unit04.lesson04.teach.den:
    title: den
    gloss: el (acusativo masculino)
    note: '*den* es la forma de acusativo masculino de *der*. Aparece en las fechas completas después de un día de la semana, como en *am Donnerstag, den neunten Juli*: apréndelo como un patrón fijo en lugar de analizar el caso en este nivel. (También verás *dem* después de *am*, que es igualmente correcto.)'
    example_gloss: Quedamos el jueves 9 de julio.
  de.a1.unit04.lesson04.teach.neunten:
    title: neunten
    gloss: noveno
    note: '*neunten* es la forma declinada del ordinal de *neun* (nueve) que se usa en las fechas: *der neunte Juli* (nominativo) pasa a *den neunten Juli* en esta construcción de fecha completa.'
    example_gloss: Mi cumpleaños es el 9 de julio.
  de.a1.unit04.lesson04.teach.line01:
    title: Felix pregunta la fecha
    gloss: 'Felix dice: ¿A cuántos estamos hoy?'
  de.a1.unit04.lesson04.teach.line02:
    title: Anna dice la fecha
    gloss: 'Anna dice: Hoy es martes, 7 de julio.'
  de.a1.unit04.lesson04.teach.line03:
    title: Felix pregunta por la biblioteca
    gloss: 'Felix dice: ¿Cuándo vuelve a abrir la biblioteca?'
  de.a1.unit04.lesson04.teach.line04:
    title: Anna responde
    gloss: 'Anna dice: Vuelve a abrir el jueves 9 de julio.'
    note: '*Sie* aquí significa «ella»: se refiere a *die Bibliothek* (un sustantivo femenino).'
  de.a1.unit04.lesson04.teach.line05:
    title: Felix se despide
    gloss: 'Felix dice: Bien, hasta el jueves.'
    note: '*bis Donnerstag* = «hasta el jueves»: una forma habitual de decir «nos vemos el jueves».'
  de.a1.unit04.lesson04.teach.notiz:
    title: Una nota en la puerta
    gloss: Cerrado hasta el jueves 9 de julio.
    note: '*Geschlossen* significa «cerrado».'
