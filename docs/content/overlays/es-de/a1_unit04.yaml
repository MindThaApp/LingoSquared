course:
  title: Alemán A1
  description: Aprende alemán de nivel A1 para saludos cotidianos y breves intercambios sociales, con explicaciones detalladas en español.
units:
  de.a1.unit04.daten:
    title: Días, meses y fecha
lessons:
  de.a1.unit04.lesson01.wochentage:
    title: Días de la semana
  de.a1.unit04.lesson02.monate:
    title: Los meses
  de.a1.unit04.lesson03.das_datum:
    title: Decir la fecha
