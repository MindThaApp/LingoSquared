    title: Planear un fin de semana juntos
teaching:
  de.a1.unit54.lesson01.teach.lesen_sport_treiben:
    title: Leer, hacer deporte, cocinar
    gloss: leer, hacer deporte, cocinar
    note: 'Tres verbos habituales de aficiones: *lesen* (leer), *Sport treiben* (hacer deporte) y *kochen* (cocinar). Sport es un sustantivo, por eso va con mayúscula.'
    example_gloss:
    - Me gusta leer un libro.
    - Hago deporte los sábados.
    - Me gusta cocinar para mis amigos.
  de.a1.unit54.lesson01.teach.die_freizeit:
    title: El tiempo libre
    gloss: tiempo libre
    note: '*Die Freizeit* es un sustantivo femenino: apréndelo siempre con su artículo die. Es la palabra clave para hablar de aficiones.'
    example_gloss: En mi tiempo libre me gusta leer.
  de.a1.unit54.lesson01.teach.in_meiner_freizeit:
    title: Decir qué haces en tu tiempo libre
    gloss: En mi tiempo libre me gusta leer.
    note: '*Lese* es la forma de ich de *lesen* (leer). La frase empieza con una expresión de tiempo, así que el verbo sigue en segunda posición: in meiner Freizeit lese ich gern.'
  de.a1.unit54.lesson02.teach.musik_hoeren_zeichnen:
    title: Música, dibujo y videojuegos
    gloss: escuchar música, dibujar, jugar a videojuegos
    note: 'Tres expresiones más de aficiones: *Musik hören* (escuchar música), *zeichnen* (dibujar) y *Videospiele spielen* (jugar a videojuegos). Musik y Videospiele son sustantivos, por eso van con mayúscula.'
    example_gloss:
    - Me gusta escuchar música.
    - Dibujo a menudo.
    - Me gusta jugar a videojuegos con amigos.
  de.a1.unit54.lesson02.teach.ich_hoere_gern:
    title: Decir que te gusta escuchar música
    gloss: Me gusta escuchar música.
    note: '*Musik hören* se dice sin preposición: ich höre Musik.'
  de.a1.unit54.lesson02.teach.ich_spiele_gern:
    title: Decir que te gusta jugar a videojuegos con amigos
    gloss: Me gusta jugar a videojuegos con amigos.
    note: '*Mit Freunden* (con amigos): mit siempre va seguido del dativo, por eso Freunde pasa a Freunden.'
  de.a1.unit54.lesson03.teach.immer_oft_manchmal:
    title: Siempre, a menudo, a veces, nunca
    gloss: siempre, a menudo, a veces, nunca
    note: 'Los cuatro adverbios básicos de frecuencia: immer, oft, manchmal, nie. Suelen ir justo después del verbo: ich spiele nie.'
    example_gloss:
    - Siempre hago deporte los sábados.
    - A menudo leo un libro.
    - A veces dibujo.
    - Nunca juego a videojuegos.
  de.a1.unit54.lesson03.teach.jede_woche_jedes:
    title: Cada semana, cada fin de semana
    gloss: cada semana, cada fin de semana
    note: '*Jede Woche* y *jedes Wochenende* significan las dos «cada», pero la terminación cambia según el género del sustantivo: mira la tarjeta siguiente.'
    example_gloss:
    - Cocino para mis amigos cada semana.
    - Hago deporte cada fin de semana.
  de.a1.unit54.lesson03.teach.die_woche_jede:
    title: Jede vs. jedes
    gloss: Die Woche es femenino, así que se dice jede Woche. Das Wochenende es neutro, así que se dice jedes Wochenende.
    note: '*Woche* es femenino (*die Woche*), por eso lleva *jede*; *Wochenende* es neutro (*das Wochenende*), por eso lleva *jedes*. Aprende cada sustantivo con su artículo y sabrás la terminación.'
  de.a1.unit54.lesson03.teach.was_machst_du:
    title: Preguntar por el tiempo libre
    gloss: ¿Qué haces en tu tiempo libre?
    note: 'Esta es la pregunta central de la unidad: úsala para preguntar a cualquiera por sus aficiones.'
  de.a1.unit54.lesson04.teach.anna_wir_gehen:
    title: Anna saca el tema de las aficiones
    gloss: 'Anna: A menudo vamos a pasear juntos. Pero ¿qué más haces en tu tiempo libre, Felix?'
    note: '*Wir gehen oft zusammen spazieren* usa gehen más un segundo verbo: el verbo conjugado gehen va en segunda posición y el infinitivo spazieren va al final.'
  de.a1.unit54.lesson04.teach.felix_ich_koche:
    title: Las aficiones de Felix
    gloss: 'Felix: Me gusta cocinar, también en casa. Y hago deporte a menudo.'
    note: '*Auch zu Hause* (también en casa) aclara que Felix cocina por gusto, no solo en su trabajo.'
  de.a1.unit54.lesson04.teach.anna_kochst_du:
    title: Anna se sorprende
    gloss: 'Anna: ¿Tú también cocinas en casa? ¡Si ya cocinas todo el día en el trabajo!'
    note: '*Den ganzen Tag* (todo el día) va en acusativo, por eso der Tag pasa a den Tag. Las duraciones de tiempo como esta llevan acusativo.'
  de.a1.unit54.lesson04.teach.felix_ja_aber:
    title: Felix lo explica
    gloss: 'Felix: Sí, pero cocinar me parece relajante. Y tú, ¿qué te gusta hacer?'
    note: '*Kochen finde ich entspannend* pone Kochen al principio para destacarlo. El verbo sigue en segunda posición, así que ich va detrás.'
  de.a1.unit54.lesson04.teach.anna_ich_lese:
    title: Las aficiones de Anna
    gloss: 'Anna: Me gusta leer y escucho música a menudo.'
    note: Combina con *und* (y) dos verbos de aficiones de las lecciones anteriores en una sola frase.
  de.a1.unit54.lesson04.teach.felix_spielst_du:
    title: Felix pregunta por los videojuegos
    gloss: 'Felix: ¿Tú también juegas a videojuegos?'
    note: 'Una pregunta corta de sí o no: el verbo va primero, spielst du ...?'
  de.a1.unit54.lesson04.teach.anna_nein_ich:
    title: Anna responde
    gloss: 'Anna: No, nunca juego a videojuegos. ¡Pero a veces dibujo!'
    note: '*Nie* (nunca) y *manchmal* (a veces) de lecciones anteriores, contrastados en una sola respuesta. Los dos van justo después del verbo.'
  de.a1.unit54.lesson05.teach.felix_und_ich:
    title: Comparar aficiones
    gloss: Felix y yo vamos a menudo a pasear juntos. Pero también tenemos otras aficiones. A Felix le gusta cocinar, también en casa, y hace deporte a menudo. A mí me gusta leer y escucho música a menudo. A veces dibujo, pero nunca juego a videojuegos. ¿Qué te gusta hacer en tu tiempo libre?
    note: El mensaje de Anna repasa datos de lecciones anteriores y termina preguntando al lector la pregunta central de la unidad.
    glosses:
      spazieren: pasea
      oft: a menudo
      zusammen: juntos
      andere: otros
      kocht: cocina
      gern: le gusta
      Hause: en casa
      Sport: hace deporte
      lese: leer
      höre: escucho
      Musik: música
      zeichne: dibujo
      manchmal: a veces
      spiele: juego a videojuegos
      nie: nunca
      freien: libre
      Zeit: tiempo
  de.a1.unit54.lesson06.teach.felix_was_machst:
    title: Felix pregunta por el fin de semana
    gloss: 'Felix: ¿Qué haces este fin de semana?'
    note: '*Dieses Wochenende* (este fin de semana) lleva la terminación neutra -es, porque das Wochenende es neutro.'
  de.a1.unit54.lesson06.teach.anna_ich_weiss:
    title: Anna está indecisa
    gloss: 'Anna: Todavía no lo sé. Me gusta leer, pero también quiero salir fuera.'
    note: '*Nach draußen* (fuera, literalmente «hacia fuera») es una forma habitual de decir que quieres salir de casa.'
  de.a1.unit54.lesson06.teach.felix_gehen_wir:
    title: Felix propone un plan
    gloss: 'Felix: ¿Vamos a pasear juntos? Después cocino para nosotros.'
    note: '*Danach* (después) va primero, así que el verbo va a continuación y el sujeto detrás: danach koche ich.'
  de.a1.unit54.lesson06.teach.anna_gute_idee:
    title: Anna acepta
    gloss: 'Anna: ¡Buena idea! Me gusta tanto pasear como cocinar.'
    note: '*Gern* después del verbo muestra que algo te gusta: ich gehe gern spazieren, ich koche gern. Funciona con casi cualquier verbo.'
  de.a1.unit54.lesson06.teach.felix_perfekt_dann:
    title: Felix lo confirma
    gloss: 'Felix: Perfecto. ¡Entonces te veo el sábado!'
    note: 'Una despedida amistosa que confirma el plan del *Samstag* (sábado). Los días de la semana llevan *am*: am Samstag.'
