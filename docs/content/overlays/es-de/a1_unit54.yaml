course:
  title: Alemán A1
  description: 'Alemán para principiantes para hablar de las actividades del tiempo libre: vocabulario de aficiones, expresiones de frecuencia, preguntar y responder qué hace alguien en su tiempo libre y comparar las aficiones de dos personas.'
