  de.a1.unit09.lesson01.teach.bank:
    title: Bank
    gloss: banco
    note: '*Bank* significa banco; es un sustantivo femenino, *die Bank*.'
    example_gloss: Tengo que ir al banco.
  de.a1.unit09.lesson01.teach.krankenhaus:
    title: Krankenhaus
    gloss: hospital
    note: '*Krankenhaus* significa literalmente «casa de enfermos»; es un sustantivo neutro, *das Krankenhaus*.'
    example_gloss: Mi amigo está en el hospital.
  de.a1.unit09.lesson01.teach.apotheke:
    title: Apotheke
    gloss: farmacia
    note: '*Apotheke* significa farmacia; es un sustantivo femenino, *die Apotheke*.'
    example_gloss: La farmacia está abierta hoy.
  de.a1.unit09.lesson01.teach.park:
    title: Park
    gloss: parque
    note: '*Park* significa parque; es un sustantivo masculino, *der Park*.'
    example_gloss: Nos gusta pasear por el parque.
  de.a1.unit09.lesson01.teach.restaurant:
    title: Restaurant
    gloss: restaurante
    note: '*Restaurant* significa restaurante; es un sustantivo neutro, *das Restaurant*.'
    example_gloss: Este restaurante tiene buena comida.
  de.a1.unit09.lesson02.teach.neben:
    title: Die Apotheke ist neben dem Park.
    gloss: La farmacia está junto al parque.
    note: '*neben* significa «junto a». Es una preposición de dos vías: para un lugar fijo (como aquí) lleva dativo, así que *der Park* (masculino) pasa a *dem Park*.'
  de.a1.unit09.lesson02.teach.gegenueber_von:
    title: Die Apotheke ist gegenüber vom Krankenhaus.
    gloss: La farmacia está enfrente del hospital.
    note: '*gegenüber von* significa «enfrente de». *vom* es la contracción habitual de *von dem* (dativo neutro, *das Krankenhaus*), parecida al «del» español, y se usa tanto en el habla como por escrito.'
  de.a1.unit09.lesson02.teach.zwischen:
    title: Die Apotheke ist zwischen der Bank und dem Park.
    gloss: La farmacia está entre el banco y el parque.
    note: '*zwischen* significa «entre». Fíjate en las dos formas de dativo: *der Bank* (femenino) y *dem Park* (masculino).'
  de.a1.unit09.lesson02.teach.hinter:
    title: Das Restaurant ist hinter der Bank.
    gloss: El restaurante está detrás del banco.
    note: '*hinter* significa «detrás de»; *der Bank* es la forma de dativo femenino.'
  de.a1.unit09.lesson02.teach.vor:
    title: Der Park ist vor dem Krankenhaus.
    gloss: El parque está delante del hospital.
    note: '*vor* significa «delante de»; *dem Krankenhaus* es la forma de dativo neutro.'
  de.a1.unit09.lesson03.teach.wo_ist_die_bank:
    title: Wo ist die Bank?
    gloss: ¿Dónde está el banco?
    note: '*Wo ist...?* es la forma estándar de preguntar dónde está algo.'
  de.a1.unit09.lesson03.teach.sie_ist_neben:
    title: Sie ist neben dem Park.
    gloss: Está junto al parque.
    note: '*Sie* aquí significa «ella» (se refiere a *die Bank*, femenina). Va con mayúscula solo porque empieza la frase. El verbo *ist* muestra que no es el «usted» formal, que sería *Sie sind*.'
  de.a1.unit09.lesson03.teach.ist_es_weit:
    title: Ist es weit von hier?
    gloss: ¿Está lejos de aquí?
    note: '*weit* significa «lejos». *es* aquí es un sujeto genérico de la situación (en español se omite) y no concuerda con el género de ningún sustantivo.'
  de.a1.unit09.lesson03.teach.nicht_weit:
    title: Nein, es ist nicht weit.
    gloss: No, no está lejos.
    note: '*nicht* niega el adjetivo *weit*.'
  de.a1.unit09.lesson04.teach.entschuldigung_wo:
    title: Entschuldigung, wo ist die Apotheke?
    gloss: Disculpe, ¿dónde está la farmacia?
    note: '*Entschuldigung* se vio antes como «disculpe / perdón»; aquí abre una pregunta con cortesía.'
  de.a1.unit09.lesson04.teach.line01:
    title: Felix pregunta el camino
    gloss: 'Felix dice: Disculpe, ¿dónde está la farmacia?'
    note: La misma fórmula de cortesía que en la frase suelta de antes, ahora en una conversación real.
  de.a1.unit09.lesson04.teach.line02:
    title: Anna dice dónde está
    gloss: 'Anna dice: Está enfrente del hospital.'
    note: Una respuesta completa indica dónde está la farmacia respecto a un punto de referencia conocido.
  de.a1.unit09.lesson04.teach.line03:
    title: Felix pregunta si está lejos
    gloss: 'Felix dice: ¿Está lejos de aquí?'
    note: Una pregunta de seguimiento natural cuando ya sabes más o menos en qué dirección ir.
  de.a1.unit09.lesson04.teach.line04:
    title: Anna responde sobre la distancia
    gloss: 'Anna dice: No, no está lejos. Está entre el banco y el parque.'
    note: Una respuesta completa tranquiliza sobre la distancia y luego da un segundo punto de referencia más preciso.
