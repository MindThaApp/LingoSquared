    title: Hier ist Anna.
    gloss: Soy Anna.
    note: Al teléfono, *Hier ist...* sirve para identificar a quien habla.
  de.a1.unit23.lesson01.teach.anrufen:
    title: anrufen
    gloss: llamar por teléfono
    note: '*Ich rufe ... an* significa «llamo a...».'
    example_gloss: Llamo a Felix.
  de.a1.unit23.lesson01.teach.wiederholen:
    title: Können Sie das bitte wiederholen?
    gloss: ¿Podría repetirlo, por favor?
    note: Usa esta petición formal cuando no hayas entendido algo.
  de.a1.unit23.lesson01.teach.langsam:
    title: Sprechen Sie bitte langsam.
    gloss: Hable despacio, por favor.
    note: El *Sie* formal mantiene la petición cortés.
  de.a1.unit23.lesson02.teach.nachricht:
