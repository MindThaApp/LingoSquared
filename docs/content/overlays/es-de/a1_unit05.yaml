teaching:
  de.a1.unit05.lesson01.teach.wie_spaet:
    title: Wie spät ist es?
    gloss: ¿Qué hora es?
    note: 'Literalmente «¿Qué tan tarde es?»: la forma estándar de preguntar la hora.'
  de.a1.unit05.lesson01.teach.drei_uhr:
    title: Es ist drei Uhr.
    gloss: Son las tres.
    note: '*Uhr* = «hora, en punto». Las horas en punto se dicen con el número + *Uhr*.'
  de.a1.unit05.lesson01.teach.halb_vier:
    title: halb vier = 3:30
    gloss: Son las tres y media (3:30).
    note: 'A diferencia del español («las tres y media»), el alemán nombra la media hora por la hora hacia la que se dirige: *halb vier* = «medio (camino) hacia las cuatro» = 3:30, no 4:30.'
  de.a1.unit05.lesson01.teach.fuenf_uhr:
    title: Es ist fünf Uhr.
    gloss: Son las cinco.
  de.a1.unit05.lesson02.teach.viertel_nach:
    title: Es ist Viertel nach drei.
    gloss: Son las tres y cuarto (3:15).
    note: '*Viertel* = «cuarto»; *nach* = «después de».'
  de.a1.unit05.lesson02.teach.viertel_vor:
    title: Es ist Viertel vor vier.
    gloss: Son las cuatro menos cuarto (3:45).
    note: '*vor* = «antes de / menos».'
  de.a1.unit05.lesson02.teach.zehn_nach:
    title: Es ist zehn nach vier.
    gloss: Son las cuatro y diez (4:10).
    note: 'Minutos + *nach* + hora, igual que en español: «las cuatro y diez».'
  de.a1.unit05.lesson02.teach.zehn_vor:
    title: Es ist zehn vor fünf.
    gloss: Son las cinco menos diez (4:50).
    note: 'Minutos + *vor* + la hora siguiente, igual que en español: «las cinco menos diez».'
  de.a1.unit05.lesson03.teach.morgen:
    title: Morgen
    gloss: mañana (parte del día)
    note: '*Morgen* es el sustantivo para la mañana, más o menos de las 6 a las 12 h.'
    example_gloss: ¡Buenos días, Felix!
  de.a1.unit05.lesson03.teach.mittag:
    title: Mittag
    gloss: mediodía
    note: '*Mittag* es el mediodía en sí, el punto medio entre Morgen y Nachmittag.'
    example_gloss: Es mediodía.
  de.a1.unit05.lesson03.teach.nachmittag:
    title: Nachmittag
    gloss: tarde
    note: '*Nachmittag* abarca más o menos de las 12 a las 18 h.'
    example_gloss: Trabajo por la tarde.
  de.a1.unit05.lesson03.teach.abend:
    title: Abend
    gloss: tarde-noche
    note: '*Abend* abarca más o menos de las 18 a las 22 h.'
    example_gloss: ¡Buenas tardes, Anna!
  de.a1.unit05.lesson03.teach.nacht:
    title: Nacht
    gloss: noche
    note: '*Nacht* abarca más o menos de las 22 a las 6 h.'
    example_gloss: ¡Buenas noches, Felix!
  de.a1.unit05.lesson03.teach.mitternacht:
    title: Mitternacht
    gloss: medianoche
    note: '*Mitternacht* son exactamente las 12 de la noche / 0 Uhr.'
    example_gloss: La fiesta termina a medianoche.
  de.a1.unit05.lesson03.teach.achtzehn:
    title: achtzehn
    gloss: dieciocho
    note: '*achtzehn* = 18, usado aquí en el reloj de 24 horas para los horarios oficiales (achtzehn Uhr = las 18:00).'
    example_gloss: La tienda cierra a las 18:00.
  de.a1.unit05.lesson03.teach.laden_oeffnet:
    title: Der Laden öffnet um neun Uhr morgens.
    gloss: La tienda abre a las nueve de la mañana.
    note: '*um* + hora = «a las» + hora; *morgens* = «por la mañana».'
  de.a1.unit05.lesson03.teach.laden_schliesst:
    title: Der Laden schließt um achtzehn Uhr.
    gloss: La tienda cierra a las 18:00.
    note: '*schließt* = «cierra». Los horarios oficiales de apertura usan el reloj de 24 horas.'
  de.a1.unit05.lesson04.teach.wann:
    title: Wann
    gloss: cuándo
    note: '*Wann* abre una pregunta sobre el tiempo.'
    example_gloss: ¿Cuándo viene usted?
  de.a1.unit05.lesson04.teach.oeffnet_die:
    title: öffnet die
    gloss: abre la
    note: '*öffnet* es la tercera persona del singular de *öffnen* (abrir); *die* es el artículo determinado femenino/plural, que concuerda con *die Bibliothek*.'
    example_gloss: ¿Cuándo abre la biblioteca?
  de.a1.unit05.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: biblioteca
    note: '*Bibliothek* es un sustantivo femenino (*die Bibliothek*), el mismo lugar que apareció en la Unidad 4.'
    example_gloss: Voy a la biblioteca.
  de.a1.unit05.lesson04.teach.sie_pronomen:
    title: sie
    gloss: ella / ellos (en minúscula)
    note: Aquí *sie* es el pronombre de tercera persona que sustituye al sustantivo femenino *die Bibliothek* («ella»); no hay que confundirlo con *Sie*, con mayúscula, el «usted» que se dicen Anna y Felix.
    example_gloss: Me gusta la biblioteca. La visito a menudo.
  de.a1.unit05.lesson04.teach.dann:
    title: dann
    gloss: entonces
    note: '*dann* se usa aquí en la despedida *Bis dann!* («¡hasta entonces!»).'
    example_gloss: ¡Hasta entonces!
  de.a1.unit05.lesson04.teach.line01:
    title: Felix pregunta por la biblioteca
    gloss: 'Felix dice: ¿Cuándo abre la biblioteca?'
  de.a1.unit05.lesson04.teach.line02:
    title: Anna responde
    gloss: 'Anna dice: Abre a las nueve de la mañana.'
    note: '*Sie* aquí significa «ella»: se refiere a *die Bibliothek*; va con mayúscula solo porque empieza la frase.'
  de.a1.unit05.lesson04.teach.line03:
    title: Felix hace otra pregunta
    gloss: 'Felix dice: ¿Y cuándo cierra?'
  de.a1.unit05.lesson04.teach.line04:
    title: Anna vuelve a responder
    gloss: 'Anna dice: Cierra a las 18:00.'
  de.a1.unit05.lesson04.teach.line05:
    title: Felix se despide
    gloss: 'Felix dice: Bien, ¡hasta entonces!'
  de.a1.unit05.lesson04.teach.schild:
    title: Un cartel en la puerta
    gloss: 'Horario de apertura: de 9:00 a 18:00.'
    note: '*Öffnungszeiten* = «horario de apertura»; *bis* = «hasta / a».'
