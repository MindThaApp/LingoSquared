teaching:
  de.a1.unit03.lesson01.teach.null_bis_vier:
    title: null, eins, zwei, drei, vier
    gloss: cero, uno, dos, tres, cuatro
    note: Las cifras alemanas del 0 al 4.
    example_gloss:
    - Tengo cero manzanas.
    - ¡Soy el número uno!
    - Tengo dos manzanas.
    - Tengo tres manzanas.
    - Tengo cuatro manzanas.
  de.a1.unit03.lesson01.teach.fuenf_bis_zehn:
    title: fünf, sechs, sieben, acht, neun, zehn
    gloss: cinco, seis, siete, ocho, nueve, diez
    note: Las cifras alemanas del 5 al 10.
    example_gloss:
    - Tengo cinco manzanas.
    - Tengo seis manzanas.
    - Tengo siete manzanas.
    - Tengo ocho manzanas.
    - Tengo nueve manzanas.
    - Tengo diez manzanas.
  de.a1.unit03.lesson02.teach.elf_zwoelf:
    title: elf, zwölf
    gloss: once, doce
    note: '*elf* y *zwölf* son irregulares, como «once» y «doce» en español: no siguen el patrón que se usa del 13 en adelante.'
    example_gloss:
    - Mi casa es el número once.
    - Mi casa es el número doce.
  de.a1.unit03.lesson02.teach.dreizehn_bis_sechzehn:
    title: dreizehn, vierzehn, fünfzehn, sechzehn
    gloss: trece, catorce, quince, dieciséis
    note: 'Del 13 en adelante, los números alemanes se forman con la cifra base + *-zehn* («diez»; el sufijo inglés equivalente es *-teen*). Fíjate en *sechzehn*, no *sechszehn*: se pierde la *s*.'
    example_gloss:
    - Mi casa es el número trece.
    - Mi casa es el número catorce.
    - Mi casa es el número quince.
    - Mi casa es el número dieciséis.
  de.a1.unit03.lesson02.teach.siebzehn_bis_zwanzig:
    title: siebzehn, achtzehn, neunzehn, zwanzig
    gloss: diecisiete, dieciocho, diecinueve, veinte
    note: 'Fíjate en *siebzehn*, no *siebenzehn*: se pierde el *-en* de *sieben* delante de *-zehn*.'
    example_gloss:
    - Mi casa es el número diecisiete.
    - Mi casa es el número dieciocho.
    - Mi casa es el número diecinueve.
    - Mi casa es el número veinte.
  de.a1.unit03.lesson03.teach.dreissig_bis_fuenfzig:
    title: dreißig, vierzig, fünfzig
    gloss: treinta, cuarenta, cincuenta
    note: 'Fíjate en *dreißig*, no *dreizig*: el 30 acaba en *-ßig* y no en *-zig* (el 20, *zwanzig*, también es irregular).'
    example_gloss:
    - Eso cuesta treinta euros.
    - Eso cuesta cuarenta euros.
    - Eso cuesta cincuenta euros.
  de.a1.unit03.lesson03.teach.sechzig_bis_neunzig:
    title: sechzig, siebzig, achtzig, neunzig
    gloss: sesenta, setenta, ochenta, noventa
    note: 'A partir del 40 el patrón es regular: cifra + *-zig* (con los mismos acortamientos *sech-*/*sieb-* que en los números del 16 al 19).'
    example_gloss:
    - Eso cuesta sesenta euros.
    - Eso cuesta setenta euros.
    - Eso cuesta ochenta euros.
    - Eso cuesta noventa euros.
  de.a1.unit03.lesson03.teach.hundert:
    title: hundert
    gloss: cien
    note: '*hundert* por sí solo significa «cien»; no hace falta poner *ein* delante (*einhundert* también es posible, pero se usa menos en el habla cotidiana).'
    example_gloss: Eso cuesta cien euros.
  de.a1.unit03.lesson03.teach.einundzwanzig:
    title: einundzwanzig
    gloss: veintiuno
    note: 'Los números compuestos del 21 al 99 en alemán se forman al revés que en español («treinta y dos»): primero la unidad + *und* («y») + la decena, todo en UNA sola palabra. *einundzwanzig* = *ein* (uno) + *und* (y) + *zwanzig* (veinte) = literalmente «uno y veinte».'
  de.a1.unit03.lesson03.teach.zweiunddreissig:
    title: zweiunddreißig
    gloss: treinta y dos
    note: 'Mismo patrón: *zwei* (dos) + *und* + *dreißig* (treinta) = «dos y treinta» = 32.'
  de.a1.unit03.lesson04.teach.wie_alt_sind_sie:
    title: Wie alt sind Sie?
    gloss: ¿Cuántos años tiene usted? (formal)
    note: '*alt* significa «viejo»: la pregunta dice literalmente «¿cómo de viejo es usted?», mientras que el español usa «tener años».'
  de.a1.unit03.lesson04.teach.wie_alt_bist_du:
    title: Wie alt bist du?
    gloss: ¿Cuántos años tienes? (informal)
    note: La versión informal, con *du*.
  de.a1.unit03.lesson04.teach.ich_bin_jahre_alt:
    title: Ich bin achtundzwanzig Jahre alt.
    gloss: Tengo veintiocho años.
    note: '*Jahre alt* («años de edad») va siempre después del número. El alemán dice la edad con sein («ser»), no con «tener» como el español.'
  de.a1.unit03.lesson05.teach.line01:
    title: Felix le pregunta la edad a Anna
    gloss: 'Felix dice: ¿Cuántos años tiene usted, si me permite preguntar?'
    note: '*wenn ich fragen darf* («si puedo preguntar») suaviza una pregunta que, si no, podría resultar algo directa; es un detalle de cortesía que encaja con el trato formal *Sie* que siguen usando.'
  de.a1.unit03.lesson05.teach.line02:
    title: Anna responde y pregunta de vuelta
    gloss: 'Anna dice: Tengo veintiocho años. ¿Y usted?'
    note: Anna dice su edad y devuelve la pregunta, siguiendo el patrón de la Unidad 2.
  de.a1.unit03.lesson05.teach.line03:
    title: Felix responde
    gloss: 'Felix dice: Tengo treinta y un años.'
    note: Esto confirma que Felix tiene tres años más que Anna.
