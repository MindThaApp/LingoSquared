  de.a1.unit14.lesson01.teach.ich_mag:
    title: Ich mag Tee.
    gloss: Me gusta el té.
    note: '*ich mag* significa ''me gusta''.'
    example_gloss: 'En contexto: Sí, me gusta el café.'
  de.a1.unit14.lesson01.teach.nicht_moegen:
    title: Ich mag Kaffee nicht.
    gloss: No me gusta el café.
    note: En español el «no» va delante del verbo; en alemán, aquí *nicht* va detrás de lo que no gusta, no justo después de *ich*.
    example_gloss: 'En contexto: No me gusta el té.'
  de.a1.unit14.lesson01.teach.lieber:
    title: lieber
    gloss: preferir
    note: '*lieber* expresa preferencia entre varias opciones.'
    example_gloss: 'En contexto: Prefiero beber té.'
  de.a1.unit14.lesson01.teach.nehmen:
    title: Ich nehme Wasser.
    gloss: Voy a tomar agua.
    note: '*nehmen* es lo natural al elegir algo.'
  de.a1.unit14.lesson01.teach.was_nehmen_sie:
    title: Was nehmen Sie?
    gloss: ¿Qué va a tomar usted?
    note: Pregunta formal con *Sie* para pedir una elección; la respuesta usa *ich nehme*.
    example_gloss: ¿Qué va a tomar? Voy a tomar agua.
  de.a1.unit14.lesson02.teach.aber:
    title: aber
    gloss: pero
