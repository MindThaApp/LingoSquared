teaching:
  de.a1.unit01.lesson01.teach.hallo:
    title: Hallo
    gloss: hola
    note: '*Hallo* es un saludo informal que sirve a cualquier hora del día, como «hola» en español.'
    example_gloss: ¡Hola, Felix!
  de.a1.unit01.lesson01.teach.guten_morgen:
    title: Guten Morgen
    gloss: buenos días
    note: '*Guten Morgen* se usa por la mañana, más o menos hasta media mañana.'
  de.a1.unit01.lesson01.teach.guten_tag:
    title: Guten Tag
    gloss: buen día / hola
    note: '*Guten Tag* es el saludo estándar de día, algo más formal; se puede usar desde media mañana hasta la tarde.'
  de.a1.unit01.lesson01.teach.guten_abend:
    title: Guten Abend
    gloss: buenas tardes / buenas noches (saludo)
    note: '*Guten Abend* se usa al llegar a un sitio por la tarde-noche: es un saludo, no una despedida.'
  de.a1.unit01.lesson02.teach.tschuss:
    title: Tschüss
    gloss: chao
    note: '*Tschüss* es una forma informal y muy habitual de despedirse entre amigos y conocidos.'
    example_gloss: ¡Chao, hasta pronto!
  de.a1.unit01.lesson02.teach.auf_wiedersehen:
    title: Auf Wiedersehen
    gloss: adiós (formal)
    note: '*Auf Wiedersehen* significa literalmente «hasta que nos volvamos a ver»: es la despedida estándar y más formal, apropiada con desconocidos o en el trabajo.'
  de.a1.unit01.lesson02.teach.bis_bald:
    title: Bis bald
    gloss: hasta pronto
    note: '*Bis bald* es una forma amable de despedirse cuando esperas ver pronto a esa persona.'
  de.a1.unit01.lesson02.teach.bis_spater:
    title: Bis später
    gloss: hasta luego
    note: '*Bis später* se usa cuando vas a ver a la persona más tarde ese mismo día.'
  de.a1.unit01.lesson02.teach.gute_nacht:
    title: Gute Nacht
    gloss: buenas noches (para ir a dormir)
    note: '*Gute Nacht* se dice cuando alguien se va a la cama o termina el día; a diferencia de *Guten Abend*, es una despedida, no un saludo.'
  de.a1.unit01.lesson03.teach.sie:
    title: Sie
    gloss: usted (formal)
    note: '*Sie* es el «usted» alemán (también «ustedes»): se escribe siempre con mayúscula, incluso en mitad de la frase, y se usa con desconocidos, personas mayores o en situaciones formales y profesionales.'
  de.a1.unit01.lesson03.teach.du:
    title: du
    gloss: tú (informal)
    note: '*du* es el «tú» informal, que se usa con amigos, familia y niños. Usar *du* con un desconocido puede sonar demasiado confianzudo o incluso grosero.'
  de.a1.unit01.lesson03.teach.wie_geht_es_ihnen:
    title: Wie geht es Ihnen?
    gloss: ¿Cómo está usted? (formal)
    note: Es la forma formal de preguntar cómo está alguien; *Ihnen* es el «usted» en dativo y corresponde al trato de *Sie*.
  de.a1.unit01.lesson03.teach.wie_gehts:
    title: Wie geht's?
    gloss: ¿Qué tal? (informal)
    note: '*Wie geht''s* es la contracción de *Wie geht es*: la forma informal y cotidiana de preguntar cómo está alguien.'
  de.a1.unit01.lesson03.teach.gut_danke:
    title: Gut, danke.
    gloss: Bien, gracias.
    note: Una respuesta sencilla y neutra que sirve en ambos tratos.
  de.a1.unit01.lesson03.teach.sehr_gut_danke:
    title: Sehr gut, danke.
    gloss: Muy bien, gracias.
    note: Una respuesta más entusiasta que *Gut, danke.*
  de.a1.unit01.lesson03.teach.und_ihnen:
    title: Und Ihnen?
    gloss: ¿Y usted? (formal)
    note: La forma formal de devolver la pregunta, acorde con el trato de *Sie*.
  de.a1.unit01.lesson03.teach.und_dir:
    title: Und dir?
    gloss: ¿Y tú? (informal)
    note: La forma informal de devolver la pregunta; *dir* es el «tú» en dativo y corresponde al trato de *du*.
  de.a1.unit01.lesson04.teach.danke:
    title: Danke
    gloss: gracias
    note: '*Danke* ya apareció en las respuestas anteriores; aquí es la palabra por sí sola.'
    example_gloss: ¡Muchas gracias!
  de.a1.unit01.lesson04.teach.bitte:
    title: Bitte
    gloss: por favor / de nada
    note: '*Bitte* tiene de verdad dos significados habituales según el contexto: «por favor» al pedir algo, o «de nada» al responder a un agradecimiento. El contexto te dice cuál es; no es una casualidad ni un error, ambos usos son totalmente normales.'
    example_gloss:
    - Un café, por favor.
    - ¡De nada, no hay de qué!
  de.a1.unit01.lesson04.teach.entschuldigung:
    title: Entschuldigung
    gloss: disculpe / perdón
    note: '*Entschuldigung* se usa tanto para llamar la atención de alguien con educación como para pedir perdón brevemente.'
    example_gloss: Disculpe, ¿dónde está el baño?
  de.a1.unit01.lesson04.teach.kein_problem:
    title: Kein Problem
    gloss: no hay problema
    note: Una respuesta informal y amable, de tono parecido a «no hay problema» o «no pasa nada».
  de.a1.unit01.lesson04.teach.gern_geschehen:
    title: Gern geschehen
    gloss: de nada
    note: Una forma más completa y explícita de decir «de nada» que el *Bitte* más corto.
  de.a1.unit01.lesson05.teach.line01:
    title: Anna saluda a Felix
    gloss: 'Anna dice: ¡Buen día!'
    note: Anna y Felix se conocen por primera vez como vecinos del mismo edificio.
  de.a1.unit01.lesson05.teach.line02:
    title: Felix devuelve el saludo y le pregunta cómo está
    gloss: 'Felix dice: ¡Buen día! ¿Cómo está usted?'
    note: Felix usa el trato formal de *Sie* porque acaban de conocerse.
  de.a1.unit01.lesson05.teach.line03:
    title: Anna responde y devuelve la pregunta
    gloss: 'Anna dice: Gracias, bien. ¿Y usted?'
    note: Anna responde y devuelve la pregunta de manera formal, igual que Felix.
  de.a1.unit01.lesson05.teach.line04:
    title: Felix responde
    gloss: 'Felix dice: Muy bien, gracias.'
    note: Una respuesta algo más entusiasta que un simple *Gut, danke.*
  de.a1.unit01.lesson05.teach.line05:
    title: Anna se despide
    gloss: 'Anna dice: ¡Adiós!'
    note: Anna usa la despedida más formal, coherente con el trato de *Sie* que han mantenido todo el tiempo.
  de.a1.unit01.lesson05.teach.line06:
    title: Felix se despide y dice hasta pronto
    gloss: 'Felix dice: Adiós, ¡hasta pronto!'
    note: Felix une la despedida formal con «hasta pronto» y mantiene el trato de *Sie* que ambos han usado durante este primer encuentro.
