  description: Aprende alemán de nivel A1 para situaciones cotidianas, con explicaciones en español.
units:
  de.a1.unit21.kleidung:
    title: La ropa
teaching:
  de.a1.unit21.lesson01.teach.kleidung:
    title: Kleidung
    gloss: ropa
    note: '*Kleidung* es una palabra general para la ropa.'
    example_gloss: Compro ropa.
  de.a1.unit21.lesson01.teach.hemd:
    title: Hemd
    gloss: camisa
    note: '*Hemd* es una camisa, normalmente de botones.'
    example_gloss: Busco una camisa.
  de.a1.unit21.lesson01.teach.hose:
    title: Hose
    gloss: pantalón
    note: '*Hose* va en singular en alemán para un solo pantalón; en español solemos decir «pantalones».'
    example_gloss: Busco un pantalón.
  de.a1.unit21.lesson01.teach.jacke:
    title: Jacke
    gloss: chaqueta
    note: '*Jacke* es la chaqueta o cazadora.'
    example_gloss: La chaqueta es abrigada.
  de.a1.unit21.lesson01.teach.suche:
    title: Ich suche ein Hemd.
    gloss: Busco una camisa.
    note: '*suche* es muy útil en las tiendas: busco.'
    example_gloss: Busco una chaqueta.
  de.a1.unit21.lesson02.teach.groesse:
    title: Größe
    gloss: talla
    note: '*Größe* es la talla de la ropa.'
    example_gloss: Talla M, por favor.
  de.a1.unit21.lesson02.teach.blau:
    title: blau
    gloss: azul
    note: Para pedir un color, el alemán puede usar *in Blau*, literalmente «en azul».
    example_gloss: Busco una camisa azul.
  de.a1.unit21.lesson02.teach.rot:
    title: rot
    gloss: rojo
    note: '*rot* significa rojo.'
    example_gloss: La chaqueta es roja.
  de.a1.unit21.lesson02.teach.passt:
    title: Das Hemd passt.
    gloss: La camisa me queda bien.
    note: '*passt* significa «sienta bien» o «queda bien» hablando de ropa.'
    example_gloss: 'En contexto: Sí, la camisa me queda bien.'
  de.a1.unit21.lesson02.teach.request:
    title: Ich suche ein Hemd in Blau, Größe M.
    gloss: Busco una camisa azul, talla M.
    note: La petición indica la prenda, el color y la talla.
  de.a1.unit21.lesson02.teach.label:
    title: Kleidungsetikett
    gloss: etiqueta de ropa
    note: Una etiqueta puede mostrar el color, la talla y el precio.
    example_gloss: 'Color: azul. Talla: M.'
  de.a1.unit21.lesson02.teach.line01:
    title: El dependiente pregunta
    gloss: 'Dependiente: Buenos días. ¿Qué desea?'
    note: Un dependiente pregunta al cliente qué busca.
    example_gloss: ¿Qué busca?
  de.a1.unit21.lesson02.teach.line02:
    title: Felix indica prenda, color y talla
    gloss: 'Felix: Busco una camisa azul, talla M.'
    note: Felix da los tres datos que se piden.
  de.a1.unit21.lesson02.teach.line03:
    title: El dependiente se la ofrece
    gloss: 'Dependiente: Aquí tiene. ¿Quiere comprarla?'
    note: El *Sie* formal mantiene el trato cortés en la tienda.
    example_gloss: ¿Quiere comprarla?
  de.a1.unit21.lesson02.teach.line04:
    title: Felix comprueba la talla y pregunta el precio
    gloss: 'Felix: Sí, la camisa me queda bien. ¿Cuánto cuesta?'
    note: Felix dice que le queda bien y pregunta el precio.
    example_gloss: 'En contexto: Sí, la camisa me queda bien.'
