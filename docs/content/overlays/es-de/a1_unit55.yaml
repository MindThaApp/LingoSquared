course:
  title: Alemán A1
  description: 'Alemán para principiantes para describir el aspecto físico básico de una persona: impresiones de estatura y edad, color del pelo y de los ojos, la pregunta clave Wie sieht ... aus? y la comparación del aspecto de dos personas.'
units:
  de.a1.unit55.aussehen:
    title: Describir el aspecto
lessons:
  de.a1.unit55.lesson01.gross_klein_alt_und:
    title: Alto, bajo, viejo y joven
  de.a1.unit55.lesson02.haare_beschreiben:
    title: Describir el pelo
  de.a1.unit55.lesson03.augen_und_wie_jemand:
    title: Los ojos y ¿cómo es alguien?
  de.a1.unit55.lesson04.anna_beschreibt_nina:
    title: Anna describe a Nina
  de.a1.unit55.lesson05.jonas_und_lena_im:
    title: Comparando a Jonas y Lena
  de.a1.unit55.lesson06.felix_erkennt_nina:
    title: Felix reconoce a Nina
teaching:
  de.a1.unit55.lesson01.teach.gross_klein:
    title: Alto y bajo
    gloss: alto / bajo
    note: '*Groß* (literalmente «grande») describe a una persona alta y *klein* (literalmente «pequeño») a una baja.'
    example_gloss:
    - Lena es alta.
    - Jonas es bajo.
  de.a1.unit55.lesson01.teach.alt_jung:
    title: Viejo y joven
    gloss: viejo / joven
    note: '*Alt* y *jung* describen aquí una impresión general de la edad, no un número exacto de años.'
    example_gloss:
    - El abuelo es viejo.
    - Felix es joven.
  de.a1.unit55.lesson01.teach.alt_kann_eine:
    title: 'Alt: un número o una impresión'
    gloss: Alt puede ir con un número de años, como en Ich bin dreißig Jahre alt, o dar una impresión general, como en Opa ist alt.
    note: Puedes preguntar la edad exacta con *Wie alt bist du?* Aquí *alt* describe cuántos años PARECE tener alguien, sin ningún número.
  de.a1.unit55.lesson01.teach.lena_ist_gross:
    title: Lena es alta y Jonas es bajo
    gloss: Lena es alta y Jonas es bajo.
    note: Una frase sencilla con *und* (y) que prepara la comparación directa de más adelante.
  de.a1.unit55.lesson02.teach.die_haare:
    title: El pelo
    gloss: el pelo
    note: '*Haare* es un sustantivo plural: *die Haare*. En español «el pelo» se usa en singular, pero en alemán, para el pelo de la cabeza, se suele decir Haare (existe también el singular das Haar).'
    example_gloss: Felix tiene el pelo corto y negro.
  de.a1.unit55.lesson02.teach.blond_braun_grau:
    title: Rubio, castaño y gris
    gloss: rubio / castaño / gris
    note: 'Tres colores de pelo: blond, braun, grau. Delante de un sustantivo plural sin artículo llevan -e: blonde, braune, graue Haare.'
    example_gloss:
    - Anna tiene el pelo rubio.
    - Jonas tiene el pelo castaño.
    - El abuelo tiene el pelo gris.
  de.a1.unit55.lesson02.teach.lang_kurz:
    title: Largo y corto (pelo)
    gloss: largo / corto (pelo)
    note: '*Kurz* (corto) y *lang* (largo) describen la longitud del pelo. De nuevo la terminación -e: kurze Haare, lange Haare.'
    example_gloss:
    - Lena tiene el pelo largo.
    - Jonas tiene el pelo corto.
  de.a1.unit55.lesson02.teach.haare_ist_plural:
    title: Haare lleva la terminación -e
    gloss: 'Haare es plural y no lleva artículo, así que el adjetivo termina en -e: kurze Haare, lange Haare, blonde Haare, braune Haare, graue Haare, schwarze Haare.'
    note: Sin artículo, un adjetivo delante de un sustantivo plural lleva -e. Es el mismo patrón que con *Augen*.
  de.a1.unit55.lesson02.teach.anna_hat_lange:
    title: 'Ihre: su (de ella)'
    gloss: 'Ihre significa aquí «su» (de ella): ihre Haare = su pelo. Anna tiene el pelo largo, y su pelo es rubio.'
    note: '*Ihre* (con i minúscula) es el posesivo «su» (de ella) y concuerda con el sustantivo plural Haare. Con I mayúscula, *Ihre* significa «su» (de usted, trato formal).'
  de.a1.unit55.lesson02.teach.felix_hat_kurze:
    title: Felix tiene el pelo corto y negro
    gloss: Felix tiene el pelo corto y negro.
    note: 'Reutiliza *schwarz* (negro), ahora para el pelo: schwarze Haare.'
  de.a1.unit55.lesson02.teach.anna_hat_lange_2:
    title: Anna tiene el pelo largo y rubio
    gloss: Anna tiene el pelo largo y rubio.
    note: Combina el vocabulario de longitud y de color de esta lección en una frase natural.
  de.a1.unit55.lesson03.teach.die_augen:
    title: Los ojos
    gloss: los ojos
    note: En español también se dice «ojos» en plural. *Augen* es el plural de *das Auge*, y en alemán se usa normalmente el plural porque tenemos dos ojos.
    example_gloss: Felix tiene los ojos marrones.
  de.a1.unit55.lesson03.teach.blau_braun_gruen:
    title: Azul, marrón y verde
    gloss: azul / marrón / verde
    note: 'Colores: blau (azul), braun (marrón) y grün (verde).'
    example_gloss:
    - Anna tiene los ojos azules.
    - Jonas tiene los ojos marrones.
    - Lena tiene los ojos verdes.
  de.a1.unit55.lesson03.teach.augen_ist_plural:
    title: Augen lleva -e
    gloss: 'Augen es plural, así que el adjetivo termina en -e: blaue Augen, braune Augen, grüne Augen.'
    note: 'Misma regla que con Haare: sin artículo y con un sustantivo plural, el adjetivo lleva -e.'
  de.a1.unit55.lesson03.teach.wie_sieht_anna:
    title: ¿Qué aspecto tiene Anna?
    gloss: ¿Qué aspecto tiene Anna?
    note: '*Wie sieht ... aus?* es la pregunta clave de esta unidad. *Aussehen* es separable: sieht ... aus.'
  de.a1.unit55.lesson03.teach.anna_hat_lange:
    title: Anna tiene el pelo largo y rubio y los ojos azules
    gloss: Anna tiene el pelo largo y rubio y los ojos azules.
    note: Una respuesta modelo que combina pelo y ojos en una frase con *und*.
  de.a1.unit55.lesson04.teach.anna_ein_neues:
    title: Anna presenta a Nina
    gloss: 'Anna: Una chica nueva viene al café de idiomas. Se llama Nina.'
    note: '*Ein neues Mädchen kommt* presenta a alguien nuevo. Después de *kommt*, la dirección *ins* (in das) Sprachcafé lleva acusativo.'
  de.a1.unit55.lesson04.teach.felix_okay_wie:
    title: Felix pregunta qué aspecto tiene
    gloss: 'Felix: ¡Vale! ¿Qué aspecto tiene?'
    note: 'Reutiliza la pregunta clave de la unidad, ahora con *sie* (ella) en lugar de un nombre: wie sieht sie aus?'
  de.a1.unit55.lesson04.teach.anna_sie_ist:
    title: Anna describe la estatura y el pelo de Nina
    gloss: 'Anna: Es baja y tiene el pelo corto y rubio.'
    note: 'Combina *klein* con el vocabulario del pelo. El segundo *sie* se omite: sie ist klein und hat ...'
  de.a1.unit55.lesson04.teach.felix_und_ihre:
    title: Felix pregunta por sus ojos
    gloss: 'Felix: ¿Y sus ojos?'
    note: '*Ihre* aquí significa «su» (de ella, posesivo), no una forma de «usted». Concuerda con el plural Augen.'
  de.a1.unit55.lesson04.teach.anna_sie_hat:
    title: Anna describe los ojos de Nina
    gloss: 'Anna: Tiene los ojos verdes.'
    note: Reutiliza *grüne Augen*, ya vistos antes.
  de.a1.unit55.lesson04.teach.felix_danke_dann:
    title: Felix la reconocerá
    gloss: 'Felix: ¡Gracias! Entonces seguro que la reconozco.'
    note: '*Dann erkenne ich sie bestimmt* significa «entonces seguro que la reconozco». Después de *dann* el verbo va en segunda posición: dann erkenne ich sie.'
  de.a1.unit55.lesson05.teach.jonas_und_lena:
    title: Comparando a Jonas y Lena
    gloss: Jonas y Lena son hermanos, pero no se parecen. Jonas es bajo y tiene el pelo corto y castaño y los ojos marrones. Lena es más alta que Jonas y tiene el pelo largo y castaño y los ojos verdes. ¿Qué aspecto tienes tú?
    note: Una breve comparación que reúne todas las palabras de color y de longitud vistas hasta ahora y termina con la pregunta clave de la unidad dirigida al lector.
    glosses:
      Bruder: hermano
      Schwester: hermana
      sehen: parecerse
      unterschiedlich: diferentes
      klein: bajo
      kurze: bajo
      braune: castaño
      Haare: pelo
      Augen: ojos
      größer: más alta
      lange: largo
      grüne: verdes
      aus: (parte de «aussehen» = tener aspecto)
  de.a1.unit55.lesson05.teach.das_muster_kennst:
    title: El comparativo otra vez
    gloss: 'Ya conoces el patrón adjetivo + -er + als (que). Aquí se usa con personas: Lena ist größer als Jonas (Lena es más alta que Jonas).'
    note: 'El mismo patrón *-er + als* de la unidad de comparaciones. Groß pasa a größer: la vocal lleva umlaut.'
  de.a1.unit55.lesson05.teach.lena_hat_laengere:
    title: Lena tiene el pelo más largo que Jonas
    gloss: Lena tiene el pelo más largo que Jonas.
    note: '*Längere Haare*: länger lleva -e delante de un sustantivo plural sin artículo, y lang recibe umlaut en el comparativo.'
  de.a1.unit55.lesson05.teach.ich_habe_kurze:
    title: Tengo el pelo corto y castaño
    gloss: Tengo el pelo corto y castaño.
    note: Una frase modelo en primera persona con *Ich habe ...*, lista para usarla al describir tu propio aspecto.
  de.a1.unit55.lesson06.teach.felix_schau_mal:
    title: Felix descubre a Nina
    gloss: 'Felix: Mira, ¿es Nina? Tiene el pelo corto y rubio y los ojos verdes.'
    note: '*Schau mal* (mira) es una forma amistosa de señalar algo. Es el imperativo de du.'
  de.a1.unit55.lesson06.teach.anna_ja_das:
    title: Anna lo confirma
    gloss: 'Anna: ¡Sí, es Nina!'
    note: Una confirmación breve y natural.
  de.a1.unit55.lesson06.teach.nina_hallo_bist:
    title: Nina saluda a Felix
    gloss: 'Nina: Hola, ¿eres Felix?'
    note: 'Una pregunta informal sencilla: *bist du ...?* (¿eres ...?). Bist es la forma de du de sein.'
  de.a1.unit55.lesson06.teach.felix_ja_freut:
    title: Felix saluda a Nina
    gloss: 'Felix: ¡Sí! Encantado, Nina.'
    note: '*Freut mich* es la frase habitual al conocer a alguien, como en unidades anteriores. Para alguien a quien ya conoces dirías *Schön, dich zu sehen*.'
  de.a1.unit55.lesson06.teach.nina_freut_mich:
    title: Nina responde al saludo
    gloss: 'Nina: ¡Encantada de conocerte también!'
    note: 'Cierra el diálogo: Felix ha reconocido a Nina gracias a la descripción de Anna.'
