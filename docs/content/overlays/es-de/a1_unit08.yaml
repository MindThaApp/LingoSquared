course:
  title: Alemán A1
  description: Aprende alemán de nivel A1 para saludos cotidianos y breves intercambios sociales, con explicaciones detalladas en español.
units:
  de.a1.unit08.einkaufen:
    title: 'De compras: precios y cantidades'
teaching:
  de.a1.unit08.lesson01.teach.ein_pfund:
    title: ein Pfund Äpfel
    gloss: medio kilo de manzanas
    note: '*Pfund* todavía se usa de manera informal en Alemania; un *Pfund* alemán equivale exactamente a 500 g (medio kilo), aunque el país usa oficialmente el sistema métrico.'
  de.a1.unit08.lesson01.teach.ein_dutzend:
    title: ein Dutzend Eier
    gloss: una docena de huevos
    note: '*Dutzend* significa «docena» (doce).'
  de.a1.unit08.lesson01.teach.eine_flasche:
    title: eine Flasche Wasser
    gloss: una botella de agua
    note: '*Flasche* significa «botella».'
  de.a1.unit08.lesson01.teach.eine_tuete:
    title: eine Tüte Reis
    gloss: una bolsa de arroz
    note: '*Tüte* significa «bolsa».'
  de.a1.unit08.lesson01.teach.ein_kilo:
    title: ein Kilo Tomaten
    gloss: un kilo de tomates
    note: '*Kilo* es la unidad métrica estándar de peso, y se usa mucho más que *Pfund* salvo para cantidades coloquiales del día a día.'
  de.a1.unit08.lesson02.teach.was_kosten_die_aepfel:
    title: Was kosten die Äpfel?
    gloss: ¿Cuánto cuestan las manzanas?
    note: '*kosten* significa «costar»; la pregunta dice literalmente «¿qué cuestan las manzanas?», mientras que el español dice «¿cuánto cuestan?».'
  de.a1.unit08.lesson02.teach.sie_kosten_zwei_euro:
    title: Sie kosten zwei Euro das Pfund.
    gloss: Cuestan dos euros el medio kilo.
    note: '*Sie* aquí significa «ellas» (las manzanas), no el «usted» formal: el *Sie* formal y el *sie* plural («ellos/ellas») llevan exactamente la misma forma verbal (*kosten*), y al principio de la frase ambos van con mayúscula, así que solo el contexto lo aclara: el sujeto del que se habla son las manzanas, no una persona.'
  de.a1.unit08.lesson02.teach.kann_ich_zwei_pfund:
    title: Kann ich zwei Pfund haben, bitte?
    gloss: ¿Me da dos medios kilos, por favor?
    note: Un patrón de petición cortés, parecido a *Ich möchte..., bitte* de la Unidad 7.
  de.a1.unit08.lesson02.teach.ist_es_frisch:
    title: Ist es frisch?
    gloss: ¿Está fresco?
    note: '*frisch* significa «fresco». *es* aquí concuerda con un sustantivo neutro (como das Brot); al preguntar por un artículo masculino dirías *Ist er frisch?* (der Reis) y por uno femenino *Ist sie frisch?* (die Milch): el pronombre cambia con el género del sustantivo, no es siempre *es*.'
  de.a1.unit08.lesson03.teach.pro_pfund:
    title: pro Pfund
    gloss: por medio kilo
    note: '*pro* significa «por»: se usa en los carteles de precios y en los precios hablados.'
    example_gloss: Las manzanas cuestan dos euros por medio kilo.
  de.a1.unit08.lesson03.teach.preisschild_text:
    title: Markt-Preisschild
    gloss: Cartel de precios del mercado
    note: Un cartel de precios sencillo con tres productos y sus precios por unidad.
  de.a1.unit08.lesson04.teach.das_macht_acht_euro:
    title: Das macht acht Euro.
    gloss: Son ocho euros.
    note: '*Das macht...* es la forma habitual de decir un precio total, ya vista en la Unidad 7.'
  de.a1.unit08.lesson04.teach.line01:
    title: Felix pregunta el precio
    gloss: 'Felix dice: ¿Cuánto cuestan las manzanas?'
    note: La misma pregunta de antes, ahora en una conversación real.
  de.a1.unit08.lesson04.teach.line02:
    title: Anna dice el precio
    gloss: 'Anna dice: Cuestan dos euros el medio kilo.'
    note: Una respuesta completa indica el precio por unidad.
  de.a1.unit08.lesson04.teach.line03:
    title: Felix hace el pedido
    gloss: 'Felix dice: Vale, ¿me da dos medios kilos, por favor?'
    note: '*Gut* aquí significa «vale / bien»: Felix acepta el precio antes de pedir.'
  de.a1.unit08.lesson04.teach.line04:
    title: Anna pregunta si desea algo más
    gloss: 'Anna dice: Por supuesto. ¿Algo más?'
    note: '*Natürlich* significa «por supuesto / naturalmente».'
  de.a1.unit08.lesson04.teach.line05:
    title: Felix pide más
    gloss: 'Felix dice: Sí, y también una docena de huevos.'
    note: '*auch* significa «también».'
  de.a1.unit08.lesson04.teach.line06:
    title: Anna dice el total
    gloss: 'Anna dice: Son ocho euros.'
    note: Dos veces medio kilo de manzanas (4 €) más una docena de huevos (4 €) suman ocho euros.
