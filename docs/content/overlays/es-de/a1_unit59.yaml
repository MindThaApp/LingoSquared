    gloss: Anna llama a Felix todos los días. Usa su móvil, no una aplicación. Felix no tiene ordenador en casa, pero usa internet en su móvil. Jonas consulta el parte meteorológico cada mañana. Luego sale a correr. Lena envía a menudo un mensaje a Anna. ¿Tú también usas el móvil todos los días?
