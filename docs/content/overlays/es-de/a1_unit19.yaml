course:
  title: Alemán A1
  description: Aprende alemán de nivel A1 para situaciones cotidianas, con explicaciones en español.
units:
  de.a1.unit19.wohnen:
    title: La vivienda
teaching:
  de.a1.unit19.lesson01.teach.wohnung:
    title: Wohnung
    gloss: piso / apartamento
    note: '*Wohnung* es la palabra habitual en alemán para un piso o apartamento.'
    example_gloss: Mi piso es pequeño.
  de.a1.unit19.lesson01.teach.zimmer:
    title: Zimmer
    gloss: habitación
    note: '*Zimmer* puede ser una habitación de una casa o de un hotel.'
    example_gloss: El piso tiene dos habitaciones.
  de.a1.unit19.lesson01.teach.kueche:
    title: Küche
    gloss: cocina
    note: '*Küche* es la habitación donde se cocina.'
    example_gloss: La cocina es luminosa.
  de.a1.unit19.lesson01.teach.bad:
    title: Bad
    gloss: baño
    note: '*Bad* es la forma corta y habitual de decir cuarto de baño.'
    example_gloss: El baño es pequeño.
  de.a1.unit19.lesson01.teach.hell:
    title: hell
    gloss: luminoso
    note: '*hell* describe una habitación con buena luz.'
    example_gloss: Mi piso es luminoso.
  de.a1.unit19.lesson02.teach.wohnzimmer:
    title: Wohnzimmer
    gloss: salón
    note: '*Wohnzimmer* significa literalmente «habitación para vivir».'
    example_gloss: La mesa está en el salón.
  de.a1.unit19.lesson02.teach.tisch:
    title: Tisch
    gloss: mesa
    note: '*Tisch* es masculino: *der Tisch*.'
    example_gloss: Hay una mesa.
  de.a1.unit19.lesson02.teach.stuhl:
    title: Stuhl
    gloss: silla
    note: '*Stuhl* es una silla.'
    example_gloss: Hay una silla.
  de.a1.unit19.lesson02.teach.es_gibt:
    title: Es gibt einen Tisch.
    gloss: Hay una mesa.
    note: '*Es gibt* es la expresión básica para decir «hay».'
    example_gloss: En el salón hay una mesa.
  de.a1.unit19.lesson02.teach.steht:
    title: Der Tisch steht im Wohnzimmer.
    gloss: La mesa está en el salón.
    note: En alemán se suele usar *steht* (literalmente «está de pie») para decir dónde está un mueble.
  de.a1.unit19.lesson02.teach.home_text:
    title: Wohnung in Berlin
    gloss: piso en Berlín
    note: La descripción breve indica el lugar, las habitaciones y los muebles.
    example_gloss: Mi piso está en Berlín.
  de.a1.unit19.lesson02.teach.line01:
    title: Felix pregunta por el piso
    gloss: 'Felix: ¿Cómo es tu piso, Anna?'
    note: El *Ihre* formal concuerda con *Sie*.
    example_gloss: ¿Cómo es su piso?
  de.a1.unit19.lesson02.teach.line02:
    title: Anna describe las habitaciones
    gloss: 'Anna: Mi piso es pequeño, pero luminoso. Tiene dos habitaciones, una cocina y un baño.'
    note: 'Anna indica el tamaño, la luz y el número de habitaciones. Aquí *Sie hat* significa «tiene»: *Sie* se refiere a *die Wohnung*.'
    example_gloss: Tiene dos habitaciones.
  de.a1.unit19.lesson02.teach.line03:
    title: Felix pregunta por los muebles
    gloss: 'Felix: ¿Hay una mesa?'
    note: '*Gibt es...?* pregunta si algo existe.'
  de.a1.unit19.lesson02.teach.line04:
    title: Anna dice dónde está la mesa
    gloss: 'Anna: Sí, la mesa está en el salón.'
    note: La respuesta indica dónde está el mueble.
    example_gloss: La mesa está en el salón.
