  de.a1.unit06.lesson04.teach.line01:
    title: Felix pregunta por la foto
    gloss: 'Felix dice: ¿Es esta su familia?'
    note: '*Ihre Familie*: *Familie* es femenino, así que el «su» formal es *Ihre*.'
  de.a1.unit06.lesson04.teach.line02:
    title: Anna nombra a sus padres
    gloss: 'Anna dice: Sí. Esta es mi madre y este es mi padre.'
  de.a1.unit06.lesson04.teach.line03:
    title: Felix pregunta quién es alguien
    gloss: 'Felix dice: ¿Quién es?'
  de.a1.unit06.lesson04.teach.line04:
    title: Anna presenta a su hermana
    gloss: 'Anna dice: Es mi hermana. Mi hermana es profesora.'
    note: 'El alemán no usa artículo delante de una profesión, igual que el español: *Meine Schwester ist Lehrerin* = «Mi hermana es profesora». *Lehrerin* es la forma femenina de *Lehrer*.'
  de.a1.unit06.lesson04.teach.line05:
    title: Felix pregunta por los hermanos varones
    gloss: 'Felix dice: ¿Tiene usted hermanos varones?'
    note: '*Brüder* es el plural de *Bruder*.'
  de.a1.unit06.lesson04.teach.line06:
    title: Anna responde
    gloss: 'Anna dice: No. Solo tengo una hermana.'
    note: '*nur* = «solo».'
  de.a1.unit06.lesson04.teach.bildunterschrift:
    title: Un pie de foto
    gloss: 'Mi familia: mi madre, mi padre y mi hermana.'
