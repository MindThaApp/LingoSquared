  de.a1.unit06.lesson02.teach.mein_vater:
    title: mein Vater
    gloss: mi padre
    note: '*Vater* es masculino, así que «mi» se dice *mein*.'
  de.a1.unit06.lesson02.teach.meine_mutter:
    title: meine Mutter
    gloss: mi madre
    note: '*Mutter* es femenino, así que «mi» pasa a ser *meine*. El posesivo concuerda con el género del sustantivo poseído, no con el del poseedor; en español «mi» no cambia de género, pero en alemán sí.'
  de.a1.unit06.lesson02.teach.sein_bruder:
    title: sein Bruder
    gloss: su hermano
    note: '*sein* = «su» (de él). Misma regla: un sustantivo masculino lleva *sein* (*sein Bruder*) y uno femenino lleva *seine* (*seine Schwester*).'
  de.a1.unit06.lesson02.teach.ihr_vater_formal:
    title: Ihr Vater
    gloss: su padre (formal)
    note: '*Ihr*, con mayúscula, = «su» formal (de usted), acorde con *Sie*. Los sustantivos masculinos llevan *Ihr* (*Ihr Vater*) y los femeninos llevan *Ihre* (*Ihre Mutter*).'
  de.a1.unit06.lesson02.teach.wer_ist_ihr_vater:
    title: Wer ist Ihr Vater?
    gloss: ¿Quién es su padre? (formal)
    note: '*Wer* = «quién».'
  de.a1.unit06.lesson03.teach.das_ist_mein_bruder:
    title: Das ist mein Bruder.
    gloss: Este es mi hermano.
    note: '*Das ist...* = «Esto es... / Este es...»: la forma sencilla de presentar a alguien.'
  de.a1.unit06.lesson03.teach.er_ist_zwanzig:
    title: Er ist zwanzig Jahre alt.
    gloss: Tiene veinte años.
    note: '*Er* = «él». La edad sigue el mismo patrón que aprendiste en la Unidad 3: número + *Jahre alt*.'
  de.a1.unit06.lesson03.teach.ich_habe_zwei_schwestern:
    title: Ich habe zwei Schwestern.
    gloss: Tengo dos hermanas.
    note: '*Schwestern* es el plural de *Schwester*.'
  de.a1.unit06.lesson03.teach.haben_sie_geschwister:
    title: Haben Sie Geschwister?
    gloss: ¿Tiene usted hermanos? (formal)
    note: '*Geschwister* significa «hermanos y hermanas» juntos: el alemán tiene una palabra cotidiana para ello, igual que el español «hermanos».'
  de.a1.unit06.lesson03.teach.nein_einzelkind:
    title: Nein, ich habe keine Geschwister. Ich bin Einzelkind.
    gloss: No, no tengo hermanos. Soy hijo único.
    note: '*keine* = «ningún / ninguna». *Einzelkind* = «hijo único»; el alemán no usa artículo aquí, igual que el español: *Ich bin Einzelkind*.'
  de.a1.unit06.lesson04.teach.foto:
