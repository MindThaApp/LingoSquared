teaching:
  de.a1.unit13.lesson01.teach.gestern:
    title: gestern
    gloss: ayer
    note: '*gestern* sitúa el hecho en el pasado reciente.'
    example_gloss: Ayer estuve en el parque.
  de.a1.unit13.lesson01.teach.gemacht:
    title: Was haben Sie gestern gemacht?
    gloss: ¿Qué hizo usted ayer?
    note: Para hechos recientes ya terminados, el alemán suele usar *haben* más un participio pasado.
  de.a1.unit13.lesson01.teach.gekauft:
    title: Ich habe Brot gekauft.
    gloss: Compré pan.
    note: El participio *gekauft* va al final.
  de.a1.unit13.lesson01.teach.gegessen:
    title: Ich habe Suppe gegessen.
    gloss: Comí sopa.
    note: '*gegessen* es el participio de *essen*.'
    example_gloss: 'En contexto: Compré pan y comí sopa.'
  de.a1.unit13.lesson01.teach.gegangen:
    title: Ich bin zum Markt gegangen.
    gloss: Fui al mercado.
    note: El movimiento hacia un lugar usa *bin ... gegangen*, no *habe ... gegangen*.
  de.a1.unit13.lesson02.teach.war:
    title: Es war sehr gut.
    gloss: Estuvo muy bien.
    note: '*war* es el pretérito de *sein* (ser/estar): *es ist* (es) pasa a *es war* (fue/era).'
  de.a1.unit13.lesson02.teach.bericht_text:
    title: Kurzer Bericht
    gloss: breve relato
    note: El relato presenta varias acciones terminadas, una tras otra.
    example_gloss: Ayer fui al mercado.
  de.a1.unit13.lesson02.teach.line01:
    title: Felix pregunta por el día de ayer
    gloss: 'Felix: ¿Qué hizo usted ayer?'
    note: Una forma habitual de preguntar por el día de ayer.
  de.a1.unit13.lesson02.teach.line02:
    title: Anna describe su día
    gloss: 'Anna: Fui al mercado. Compré pan y comí sopa.'
    note: Anna usa *bin* para ir y *habe* para comprar y comer.
    example_gloss: 'En contexto: Compré pan.'
  de.a1.unit13.lesson02.teach.line03:
    title: Felix pregunta qué tal fue
    gloss: 'Felix: ¿Estuvo bien?'
    note: '*War es gut?* pregunta cómo fue el hecho.'
  de.a1.unit13.lesson02.teach.line04:
    title: Anna dice que estuvo bien
    gloss: 'Anna: Sí, estuvo muy bien.'
    note: Una valoración final sencilla.
