course:
  title: Alemán A1
  description: Aprende alemán de nivel A1 para saludos cotidianos y breves intercambios sociales, con explicaciones detalladas en español.
units:
  de.a1.unit10.wegbeschreibungen:
    title: Pedir y seguir indicaciones
teaching:
  de.a1.unit10.lesson01.teach.links_abbiegen:
    title: Biegen Sie links ab.
    gloss: Gira a la izquierda.
    note: '*abbiegen* (girar) es un verbo separable: el prefijo *ab* va al final de la oración: *Biegen Sie... ab*, no *Sie biegen ab* ni *Abbiegen Sie*.'
  de.a1.unit10.lesson01.teach.rechts_abbiegen:
    title: Biegen Sie rechts ab.
    gloss: Gira a la derecha.
    note: Mismo patrón de verbo separable que *links abbiegen*, solo que con *rechts* (derecha).
  de.a1.unit10.lesson01.teach.geradeaus_gehen:
    title: Gehen Sie geradeaus.
    gloss: Sigue todo recto.
    note: '*geradeaus* significa ''todo recto'': aquí no hay prefijo separable, es un imperativo formal más sencillo.'
  de.a1.unit10.lesson01.teach.hier_anhalten:
    title: Halten Sie hier an.
    gloss: Pare aquí.
    note: '*anhalten* (parar) también es separable: *an* va al final, igual que en *abbiegen*.'
  de.a1.unit10.lesson01.teach.ecke:
    title: Ecke
    gloss: esquina
    note: '*Ecke* significa esquina; es un sustantivo femenino: *die Ecke*.'
    example_gloss: Gire a la izquierda en la esquina.
  de.a1.unit10.lesson02.teach.wie_komme_ich_zur_bank:
    title: Wie komme ich zur Bank?
    gloss: ¿Cómo llego al banco?
    note: '*zur* es la contracción de *zu der* (dativo femenino, die Bank), igual que *vom* (von + dem) de la Unidad 9.'
  de.a1.unit10.lesson02.teach.geradeaus_dann_links:
    title: Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.
    gloss: Siga todo recto y luego gire a la izquierda en la esquina.
    note: '*dann* (luego) une dos pasos del recorrido; *an der Ecke* (en la esquina) lleva el artículo femenino en dativo, como el patrón de las preposiciones de lugar de la Unidad 9.'
  de.a1.unit10.lesson02.teach.ist_es_weit:
    title: Ist es weit?
    gloss: ¿Está lejos?
    note: '*weit* significa lejos.'
  de.a1.unit10.lesson02.teach.zwei_minuten:
    title: Es ist nur zwei Minuten von hier.
    gloss: Está a solo dos minutos de aquí.
    note: '*nur* significa ''solo'' o ''solamente''.'
  de.a1.unit10.lesson02.teach.nicht_verfehlen:
    title: Das können Sie nicht verfehlen.
    gloss: No tiene pérdida.
    note: '*verfehlen* significa ''no dar con algo, pasarlo de largo''; literalmente: ''Eso no lo puede usted fallar''.'
  de.a1.unit10.lesson03.teach.erste_strasse:
    title: Nehmen Sie die erste Straße links.
    gloss: Tome la primera calle a la izquierda.
    note: '*erste* significa ''primero/primera'': es un número ordinal, como en español.'
  de.a1.unit10.lesson03.teach.zweite_strasse:
    title: Nehmen Sie die zweite Straße rechts.
    gloss: Tome la segunda calle a la derecha.
    note: '*zweite* significa ''segundo/segunda''.'
  de.a1.unit10.lesson03.teach.route_text:
    title: Wegbeschreibung zur Apotheke
    gloss: Indicaciones para llegar a la farmacia
    note: Un breve texto de indicaciones que combina varias frases ya aprendidas.
  de.a1.unit10.lesson04.teach.line01:
    title: Felix pregunta cómo llegar
    gloss: 'Felix: Perdone, ¿cómo llego al banco?'
    note: La misma fórmula de cortesía de la Unidad 9, pero ahora para preguntar por un camino y no solo por un lugar.
  de.a1.unit10.lesson04.teach.line02:
    title: Anna explica el camino
    gloss: 'Anna: Siga todo recto y luego gire a la izquierda en la esquina.'
    note: Una respuesta completa une dos pasos con *dann*.
  de.a1.unit10.lesson04.teach.line03:
    title: Felix confirma y pregunta algo más
    gloss: 'Felix: Girar a la izquierda en la esquina, bien. ¿Está lejos?'
    note: Felix repite la indicación para confirmar que la ha entendido y después hace una pregunta natural.
  de.a1.unit10.lesson04.teach.line04:
    title: Anna responde a qué distancia está
    gloss: 'Anna: No, está a solo dos minutos de aquí. No tiene pérdida.'
    note: Una respuesta completa y tranquilizadora.
