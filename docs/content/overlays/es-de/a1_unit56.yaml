    title: Felix pregunta por una mascota
    gloss: 'Felix: ¿Tienes mascota, Anna?'
  de.a1.unit56.lesson04.teach.anna_ja_ich:
    title: Anna tiene un perro
    gloss: 'Anna: Sí, tengo un perro.'
  de.a1.unit56.lesson04.teach.felix_wie_sieht:
    title: Felix pregunta qué aspecto tiene
    gloss: 'Felix: ¿Cómo es?'
    note: 'Reutiliza la pregunta *Wie sieht ... aus?* de la unidad del aspecto físico, ahora sobre un animal: wie sieht er aus?'
  de.a1.unit56.lesson04.teach.anna_er_hat:
    title: Anna describe a su perro
    gloss: 'Anna: Tiene el pelaje marrón y es pequeño.'
    note: Retoma el vocabulario de color del pelo y de tamaño de la unidad del aspecto físico, ahora para describir el pelaje de un animal y no el pelo de una persona.
  de.a1.unit56.lesson04.teach.bei_tieren_zaehlt:
    title: Er/ihn para animales
    gloss: 'Con los animales decide el género de la palabra: der Hund es er (él), die Katze es sie (ella).'
    note: 'Los pronombres alemanes siguen el género gramatical del sustantivo, y además existe el neutro: der Hund -> er (acusativo: ihn), die Katze -> sie, das Tier -> es.'
  de.a1.unit56.lesson04.teach.felix_fuehrst_du:
    title: Felix pregunta por los paseos
    gloss: 'Felix: ¿Lo sacas a pasear todos los días?'
  de.a1.unit56.lesson04.teach.anna_ja_ich_2:
    title: Anna describe su rutina
    gloss: 'Anna: Sí, lo saco a pasear todos los días y le doy de comer.'
  de.a1.unit56.lesson05.teach.felix_und_lena:
    title: Felix, Lena y Jonas hablan de animales
    gloss: 'A Felix y a Lena les encantan los animales, pero ninguno de los dos tiene mascota. A Felix le encantan los perros y a Lena los gatos. Jonas sí tiene una mascota: un gato. Juega a menudo con su gato y le da de comer todos los días. ¿Tienes tú mascota?'
    note: Contrasta querer a los animales con tener uno de verdad, que es el objetivo comunicativo de la unidad.
    glosses:
      lieben: adorar
      beide: los dos
      Tiere: animales
      beiden: los dos
      Haustier: mascota
      Hunde: perros
      Katzen: gatos
      Katze: gato
      spielt: juega
      gibt: da
      jeden: cada
      Futter: comida
  de.a1.unit56.lesson05.teach.jonas_spielt_oft:
    title: Jonas juega a menudo con su gato
    gloss: Jonas juega a menudo con su gato.
    note: '*Oft* suele ir justo después del verbo: Jonas spielt oft mit seiner Katze.'
  de.a1.unit56.lesson05.teach.ich_liebe_hunde:
    title: Adoro a los perros. No tengo mascota.
    gloss: Adoro a los perros. No tengo mascota.
    note: Una respuesta modelo de dos frases, lista para reutilizar en el ejercicio de escritura de la unidad.
  de.a1.unit56.lesson06.teach.anna_nina_hast:
    title: Anna pregunta a Nina
    gloss: 'Anna: Nina, ¿tú también tienes mascota?'
  de.a1.unit56.lesson06.teach.nina_ja_ich:
    title: Nina tiene un pájaro llamado Pico
    gloss: 'Nina: Sí, tengo un pájaro. Se llama Pico.'
    note: '*Er heißt Pico* reutiliza el verbo *heißen* de la primera unidad. Er se refiere a der Vogel.'
  de.a1.unit56.lesson06.teach.felix_wie_schoen:
    title: Felix reacciona
    gloss: 'Felix: ¡Qué bonito! ¿Qué haces con él todos los días?'
  de.a1.unit56.lesson06.teach.nina_ich_gebe:
    title: Nina le da de comer todos los días
    gloss: 'Nina: Le doy de comer todos los días.'
  de.a1.unit56.lesson06.teach.felix_ich_liebe:
    title: A Felix también le encantan los pájaros
    gloss: 'Felix: A mí también me encantan los pájaros.'
  de.a1.unit56.lesson06.teach.anna_schoen_dass:
