course:
  title: Alemán A1
  description: 'Alemán para principiantes para hablar de mascotas y animales comunes: nombrarlos, cuidados básicos (sacar a pasear, dar de comer, jugar), decir qué animales te encantan aunque no tengas ninguno y el plural regular alemán.'
