teaching:
  de.a1.unit56.lesson01.teach.das_tier_das:
    title: Animal, mascota
    gloss: el animal / una mascota
    note: '*Tier* es la palabra general para animal; *Haustier* (literalmente «animal de casa») significa en concreto mascota.'
    example_gloss:
    - Un perro es un animal.
    - Un perro también es una mascota.
  de.a1.unit56.lesson01.teach.der_hund_die:
    title: Perro y gato
    gloss: el perro / el gato
    example_gloss:
    - Anna tiene un perro.
    - Jonas tiene un gato.
  de.a1.unit56.lesson01.teach.der_fisch_der:
    title: Pez y pájaro
    gloss: el pez / el pájaro
    example_gloss:
    - El abuelo tiene un pez.
    - Nina tiene un pájaro.
  de.a1.unit56.lesson01.teach.hast_du_ein:
    title: ¿Tienes una mascota?
    gloss: ¿Tienes una mascota?
    note: 'El mismo patrón de pregunta *Hast du ...?* que ya conoces de unidades anteriores: el verbo va primero.'
  de.a1.unit56.lesson01.teach.ja_ich_habe:
    title: Sí, tengo un perro
    gloss: Sí, tengo un perro.
    note: Una respuesta afirmativa sencilla con el vocabulario nuevo de esta unidad.
  de.a1.unit56.lesson01.teach.nein_ich_habe:
    title: No, no tengo mascota
    gloss: No, no tengo mascota.
    note: '*Kein* niega el sustantivo *ein Haustier*: mira la nota de gramática.'
  de.a1.unit56.lesson01.teach.kein_sagt_nein:
    title: 'Kein: negar un sustantivo'
    gloss: 'Kein dice no a un sustantivo que llevaría ein-: Ich habe einen Hund, pero Ich habe kein Haustier.'
    note: '*Kein* sustituye a *ein* en una frase negativa y lleva las mismas terminaciones: ein Haustier pasa a kein Haustier, einen Hund pasa a keinen Hund. Para verbos y adjetivos se usa *nicht*.'
  de.a1.unit56.lesson02.teach.ausfuehren:
    title: Pasear (a un animal)
    gloss: pasear (a un animal)
    note: 'Un verbo separable: mira la nota de gramática.'
    example_gloss: Paseo al perro todos los días.
  de.a1.unit56.lesson02.teach.ausfuehren_ist_trennbar:
    title: Ausführen es separable
    gloss: 'Ausführen es separable, igual que aufstehen: ich führe den Hund aus.'
    note: Reutiliza el mismo patrón de verbos separables (raíz + ... + prefijo al final) que ya se vio con los verbos de la rutina diaria.
  de.a1.unit56.lesson02.teach.futter_geben:
    title: Dar de comer
    gloss: dar de comer
    example_gloss: Le doy de comer al gato todos los días.
  de.a1.unit56.lesson02.teach.spielen_mit:
    title: Jugar con
    gloss: jugar con
    example_gloss: Jonas juega con su gato.
  de.a1.unit56.lesson02.teach.ich_fuehre_den:
    title: Paseo al perro todos los días
    gloss: Paseo al perro todos los días.
    note: Combina *ausführen* con *jeden Tag* (todos los días). *Jeden* termina en -en porque Tag es masculino y va en acusativo.
  de.a1.unit56.lesson02.teach.ich_gebe_der:
    title: Le doy de comer al gato todos los días
    gloss: Le doy de comer al gato todos los días.
    note: 'Combina *Futter geben* con *jeden Tag*. El animal va en dativo: der Katze (al gato).'
  de.a1.unit56.lesson03.teach.den_plural_lernst:
    title: 'Plural: Hund -> Hunde'
    gloss: 'Los plurales alemanes varían: der Hund -> die Hunde, die Katze -> die Katzen, der Vogel -> die Vögel. Aprende el plural con cada sustantivo.'
    note: El patrón regular del plural alemán, presentado aquí por primera vez con nombres de animales como ejemplos.
  de.a1.unit56.lesson03.teach.hunde_katzen:
    title: Perros y gatos
    gloss: perros / gatos
    example_gloss:
    - A Felix le encantan los perros.
    - A Lena le encantan los gatos.
  de.a1.unit56.lesson03.teach.fische_voegel:
    title: Peces y pájaros (plural)
    gloss: peces / pájaros
    example_gloss:
