teaching:
  de.a1.unit18.lesson01.teach.beruf:
    title: Beruf
    gloss: profesión
    note: '*Beruf* es la palabra general para la profesión de una persona.'
    example_gloss: Soy ingeniero de profesión.
  de.a1.unit18.lesson01.teach.ingenieur:
    title: Ingenieur
    gloss: ingeniero
    note: Como en español ('Soy ingeniero'), el alemán dice normalmente *Ich bin Ingenieur*, sin artículo.
    example_gloss: Soy ingeniero.
  de.a1.unit18.lesson01.teach.lehrerin:
    title: Lehrerin
    gloss: profesora
    note: '*Lehrerin* es el título de profesión en femenino.'
    example_gloss: Ella es profesora.
  de.a1.unit18.lesson01.teach.kellnerin:
    title: Kellnerin
    gloss: camarera
    note: Esto encaja con el trabajo de Anna en el café.
    example_gloss: Anna es camarera en el café.
  de.a1.unit18.lesson01.teach.was_machen_sie:
    title: Was machen Sie beruflich?
    gloss: ¿A qué te dedicas?
    note: '*beruflich* hace que la pregunta trate del trabajo y no de la actividad en general.'
  de.a1.unit18.lesson02.teach.buero:
    title: Büro
    gloss: oficina
    note: '*im Büro* significa en la oficina.'
    example_gloss: Trabajo en la oficina.
  de.a1.unit18.lesson02.teach.arbeite:
    title: Ich arbeite im Cafe.
    gloss: Trabajo en el café.
    note: '*arbeite* es la forma de la primera persona: trabajo.'
  de.a1.unit18.lesson02.teach.bringe:
    title: Ich bringe Kaffee und Tee.
    gloss: Traigo café y té.
    note: '*bringe* expresa una actividad laboral sencilla.'
  de.a1.unit18.lesson02.teach.work_profile:
    title: Arbeitsprofile
    gloss: perfiles laborales
    note: El perfil indica profesión, lugar de trabajo y actividad.
    example_gloss: Él trabaja en la oficina.
  de.a1.unit18.lesson02.teach.line01:
    title: Anna pregunta por el trabajo
    gloss: 'Anna: ¿A qué se dedica usted?'
    note: Una pregunta cortés sobre el trabajo.
  de.a1.unit18.lesson02.teach.line02:
    title: Felix describe su trabajo
    gloss: 'Felix: Soy ingeniero. Trabajo en la oficina. ¿Y usted?'
    note: Felix indica su profesión y su lugar de trabajo.
    example_gloss: Trabajo en la oficina.
  de.a1.unit18.lesson02.teach.line03:
    title: Anna describe su trabajo en el café
    gloss: 'Anna: Trabajo en el café. Traigo café y té.'
    note: Anna indica su lugar de trabajo y lo que hace allí.
    example_gloss: 'En contexto: Traigo café y té.'
