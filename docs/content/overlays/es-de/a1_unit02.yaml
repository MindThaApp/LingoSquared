teaching:
  de.a1.unit02.lesson01.teach.wie_heissen_sie:
    title: Wie heißen Sie?
    gloss: ¿Cómo se llama usted? (formal)
    note: '*Wie heißen Sie?* significa literalmente «¿cómo se llama?» y usa el trato formal *Sie* de la Unidad 1.'
  de.a1.unit02.lesson01.teach.ich_heisse_anna:
    title: Ich heiße Anna.
    gloss: Me llamo Anna.
    note: '*heißen* significa «llamarse»: es la forma habitual de decir tu nombre.'
  de.a1.unit02.lesson01.teach.wie_heisst_du:
    title: Wie heißt du?
    gloss: ¿Cómo te llamas? (informal)
    note: La versión informal, con el *du* de la Unidad 1.
  de.a1.unit02.lesson01.teach.ich_heisse_felix:
    title: Ich heiße Felix.
    gloss: Me llamo Felix.
    note: Misma construcción que *Ich heiße Anna*, solo cambia el nombre.
  de.a1.unit02.lesson01.teach.freut_mich:
    title: Freut mich.
    gloss: Mucho gusto.
    note: Una forma breve y habitual de decir que te alegras de conocer a alguien; sirve en ambos tratos.
  de.a1.unit02.lesson01.teach.ganz_meinerseits:
    title: Ganz meinerseits.
    gloss: Igualmente. / El placer es mío.
    note: La respuesta natural a *Freut mich*; literalmente, «totalmente de mi parte».
  de.a1.unit02.lesson02.teach.ich:
    title: ich
    gloss: yo
    note: '*ich* se escribe en minúscula salvo al principio de la frase (como en *Ich bin Anna.*), igual que «yo» en español.'
  de.a1.unit02.lesson02.teach.du:
    title: du
    gloss: tú (informal)
    note: Ya apareció en la Unidad 1; aquí se repasa como sujeto de una frase completa.
  de.a1.unit02.lesson02.teach.ich_bin_anna:
    title: Ich bin Anna.
    gloss: Soy Anna.
    note: '*bin* es la forma de *ich* del verbo *sein* (ser).'
  de.a1.unit02.lesson02.teach.du_bist_felix:
    title: Du bist Felix.
    gloss: Eres Felix.
    note: '*bist* es la forma de *du* del verbo *sein*.'
  de.a1.unit02.lesson03.teach.deutschland:
    title: Deutschland
    gloss: Alemania
    note: 'Los nombres de país en alemán suelen ir sin artículo, como en español: solo *Deutschland*, no *das Deutschland*.'
    example_gloss: Vengo de Alemania.
  de.a1.unit02.lesson03.teach.england:
    title: England
    gloss: Inglaterra
    note: En español el país se llama «Inglaterra», pero en alemán es England, y se pronuncia con sonidos alemanes.
    example_gloss: Vengo de Inglaterra.
  de.a1.unit02.lesson03.teach.frankreich:
    title: Frankreich
    gloss: Francia
    note: Fíjate en que la forma alemana difiere del francés *France* y del español «Francia».
    example_gloss: Vengo de Francia.
  de.a1.unit02.lesson03.teach.italien:
    title: Italien
    gloss: Italia
    note: Se pronuncia más o menos «i-TA-li-en».
    example_gloss: Vengo de Italia.
  de.a1.unit02.lesson03.teach.spanien:
    title: Spanien
    gloss: España
    note: Se pronuncia más o menos «SHPA-ni-en».
    example_gloss: Vengo de España.
  de.a1.unit02.lesson03.teach.russland:
    title: Russland
    gloss: Rusia
    note: Formado con *Russ-* + *-land*, como *Deutschland*.
    example_gloss: Vengo de Rusia.
  de.a1.unit02.lesson04.teach.woher_kommen_sie:
    title: Woher kommen Sie?
    gloss: ¿De dónde es usted? (formal)
    note: '*Woher* significa «de dónde» y ya incluye la idea de «de»; va al principio de la pregunta, como «¿de dónde...?» en español.'
  de.a1.unit02.lesson04.teach.ich_komme_aus_deutschland:
    title: Ich komme aus Deutschland.
    gloss: Vengo de Alemania.
    note: '*aus* + nombre de país indica el origen; en esta etapa no hace falta usar ningún gentilicio.'
  de.a1.unit02.lesson04.teach.woher_kommst_du:
    title: Woher kommst du?
    gloss: ¿De dónde eres? (informal)
    note: La versión informal, con *du*.
  de.a1.unit02.lesson04.teach.ich_komme_aus_england:
    title: Ich komme aus England.
    gloss: Vengo de Inglaterra.
    note: Misma construcción que *Ich komme aus Deutschland*, solo cambia el país.
  de.a1.unit02.lesson04.teach.und_sie:
    title: Und Sie?
    gloss: ¿Y usted? (formal)
    note: Una forma breve de devolver la pregunta, acorde con el trato de *Sie*.
  de.a1.unit02.lesson05.teach.line01:
    title: Felix saluda a Anna
    gloss: 'Felix dice: ¡Buen día!'
    note: Felix y Anna son vecinos que ya se vieron una vez (Unidad 1), pero nunca se dijeron el nombre; han vuelto a coincidir, esta vez en la parada del autobús.
  de.a1.unit02.lesson05.teach.line02:
    title: Anna devuelve el saludo y le pregunta cómo se llama
    gloss: 'Anna dice: ¡Buen día! ¿Cómo se llama usted?'
    note: Anna usa el trato formal *Sie*, el mismo que establecieron como desconocidos en la Unidad 1.
  de.a1.unit02.lesson05.teach.line03:
    title: Felix dice su nombre y pregunta de vuelta
    gloss: 'Felix dice: Me llamo Felix. ¿Y usted?'
    note: Felix responde y devuelve la pregunta de manera formal.
  de.a1.unit02.lesson05.teach.line04:
    title: Anna dice su nombre
    gloss: 'Anna dice: Me llamo Anna. Mucho gusto.'
    note: Anna responde de la misma manera y añade la frase de cortesía.
  de.a1.unit02.lesson05.teach.line05:
    title: Felix responde y pregunta de dónde es ella
    gloss: 'Felix dice: Igualmente. ¿De dónde es usted?'
    note: Felix devuelve la cortesía y lleva la conversación al lugar de origen.
  de.a1.unit02.lesson05.teach.line06:
    title: Anna responde y pregunta de vuelta
    gloss: 'Anna dice: Vengo de Alemania. ¿Y usted?'
    note: Esto confirma que Anna es alemana, lo cual encaja con que ambos sean vecinos en una ciudad de habla alemana.
  de.a1.unit02.lesson05.teach.line07:
    title: Felix responde
    gloss: 'Felix dice: Vengo de Inglaterra.'
    note: 'Ahora sabemos que Felix viene de Inglaterra: es un vecino inglés que vive en Alemania.'
  de.a1.unit02.lesson05.teach.line08:
    title: Anna se despide
    gloss: 'Anna dice: ¡Adiós!'
    note: La despedida formal de la Unidad 1, coherente con el trato de *Sie* que siguen usando.
  de.a1.unit02.lesson05.teach.line09:
    title: Felix se despide
    gloss: 'Felix dice: ¡Adiós!'
    note: Felix cierra de la misma manera, manteniendo el mismo trato durante todo el encuentro.
  de.a1.unit02.lesson05.teach.steckbrief:
    title: Una ficha breve por escrito
    gloss: 'Nombre: Felix. País: Inglaterra.'
    note: 'Una ficha sencilla con un nombre y un dato de identidad: la misma información que Felix dio en voz alta en el diálogo.'
