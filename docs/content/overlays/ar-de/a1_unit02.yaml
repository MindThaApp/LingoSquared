teaching:
  de.a1.unit02.lesson01.teach.wie_heissen_sie:
    title: Wie heißen Sie?
    gloss: ما اسمك؟ (رسمي)
    note: '*Wie heißen Sie?* تعني حرفيًا «كيف تُسمّى؟»، وتستخدم صيغة الاحترام *Sie* من الوحدة 1.'
  de.a1.unit02.lesson01.teach.ich_heisse_anna:
    title: Ich heiße Anna.
    gloss: اسمي آنا.
    note: '*heißen* تعني «يُسمّى» — وهذه هي الطريقة المعتادة لذكر اسمك.'
  de.a1.unit02.lesson01.teach.wie_heisst_du:
    title: Wie heißt du?
    gloss: ما اسمك؟ (غير رسمي)
    note: الصيغة غير الرسمية، وفيها *du* من الوحدة 1.
  de.a1.unit02.lesson01.teach.ich_heisse_felix:
    title: Ich heiße Felix.
    gloss: اسمي فيليكس.
    note: البنية نفسها في *Ich heiße Anna*، مع اسم مختلف فقط.
  de.a1.unit02.lesson01.teach.freut_mich:
    title: Freut mich.
    gloss: تشرفت بمعرفتك.
    note: طريقة قصيرة وشائعة للتعبير عن سرورك بلقاء شخص ما، وتصلح في الأسلوبين الرسمي وغير الرسمي.
  de.a1.unit02.lesson01.teach.ganz_meinerseits:
    title: Ganz meinerseits.
    gloss: وأنا كذلك. / الشرف لي.
    note: الرد الطبيعي على *Freut mich* — وتعني حرفيًا «من جهتي تمامًا».
  de.a1.unit02.lesson02.teach.ich:
    title: ich
    gloss: أنا
    note: تُكتب *ich* بحرف صغير في الألمانية إلا في بداية الجملة (كما في *Ich bin Anna.*). أما العربية فلا تعرف الحروف الكبيرة والصغيرة أصلًا.
  de.a1.unit02.lesson02.teach.du:
    title: du
    gloss: أنتَ / أنتِ (غير رسمي)
    note: سبق تقديمها في الوحدة 1 — وتُراجَع هنا بوصفها فاعل جملة كاملة.
  de.a1.unit02.lesson02.teach.ich_bin_anna:
    title: Ich bin Anna.
    gloss: أنا آنا.
    note: '*bin* هي صيغة *ich* من الفعل *sein* (يكون).'
  de.a1.unit02.lesson02.teach.du_bist_felix:
    title: Du bist Felix.
    gloss: أنت فيليكس.
    note: '*bist* هي صيغة *du* من الفعل *sein*.'
  de.a1.unit02.lesson03.teach.deutschland:
    title: Deutschland
    gloss: ألمانيا
    note: أسماء الدول في الألمانية لا تحتاج عادةً إلى أداة تعريف — *Deutschland* فقط، وليس *das Deutschland*. وكذلك نقول في العربية «ألمانيا» دون «ال».
    example_gloss: أنا من ألمانيا.
  de.a1.unit02.lesson03.teach.england:
    title: England
    gloss: إنجلترا
    note: تُكتب England بالحروف اللاتينية وتُنطق بالأصوات الألمانية.
    example_gloss: أنا من إنجلترا.
  de.a1.unit02.lesson03.teach.frankreich:
    title: Frankreich
    gloss: فرنسا
    note: لاحظ أن كتابة اسم هذا البلد بالألمانية تختلف عن كتابته بالفرنسية *France*.
    example_gloss: أنا من فرنسا.
  de.a1.unit02.lesson03.teach.italien:
    title: Italien
    gloss: إيطاليا
    note: تُنطق تقريبًا «إي-تا-لي-ين».
    example_gloss: أنا من إيطاليا.
  de.a1.unit02.lesson03.teach.spanien:
    title: Spanien
    gloss: إسبانيا
    note: تُنطق تقريبًا «شْبا-ني-ين».
    example_gloss: أنا من إسبانيا.
  de.a1.unit02.lesson03.teach.russland:
    title: Russland
    gloss: روسيا
    note: مكوّنة من *Russ-* + *-land*، مثل *Deutschland*.
    example_gloss: أنا من روسيا.
  de.a1.unit02.lesson04.teach.woher_kommen_sie:
    title: Woher kommen Sie?
    gloss: من أين أنت؟ (رسمي)
    note: '*Woher* كلمة واحدة تعني «من أين»، وهي تتضمن معنى «من» بالفعل.'
  de.a1.unit02.lesson04.teach.ich_komme_aus_deutschland:
    title: Ich komme aus Deutschland.
    gloss: أنا من ألمانيا.
    note: '*aus* + اسم الدولة تعبّر عن الأصل — ولا حاجة في هذه المرحلة إلى كلمة النسبة.'
  de.a1.unit02.lesson04.teach.woher_kommst_du:
    title: Woher kommst du?
    gloss: من أين أنت؟ (غير رسمي)
    note: الصيغة غير الرسمية، وفيها *du*.
  de.a1.unit02.lesson04.teach.ich_komme_aus_england:
    title: Ich komme aus England.
    gloss: أنا من إنجلترا.
    note: البنية نفسها في *Ich komme aus Deutschland*، مع دولة مختلفة فقط.
  de.a1.unit02.lesson04.teach.und_sie:
    title: Und Sie?
    gloss: وأنت؟ (رسمي)
    note: طريقة قصيرة لإعادة السؤال، وتناسب أسلوب *Sie*.
  de.a1.unit02.lesson05.teach.line01:
    title: فيليكس يحيّي آنا
    gloss: 'يقول فيليكس: طاب يومك!'
    note: فيليكس وآنا جاران التقيا مرة من قبل (الوحدة 1) لكنهما لم يتبادلا الأسماء — وقد التقيا مجددًا، هذه المرة في محطة الحافلات.
  de.a1.unit02.lesson05.teach.line02:
    title: ترد آنا التحية وتسأل عن اسمه
    gloss: 'تقول آنا: نهارك سعيد! ما اسمك؟'
    note: تستخدم آنا صيغة الاحترام *Sie*، وتواصل المستوى الرسمي الذي بدآ به كغريبين في الوحدة 1.
  de.a1.unit02.lesson05.teach.line03:
    title: يذكر فيليكس اسمه ويسأل بدوره
    gloss: 'يقول فيليكس: اسمي فيليكس. وأنت؟'
    note: يجيب فيليكس ويردّ السؤال بالصيغة الرسمية.
  de.a1.unit02.lesson05.teach.line04:
    title: تذكر آنا اسمها
    gloss: 'تقول آنا: اسمي آنا. تشرفت بمعرفتك.'
    note: تجيب آنا بالطريقة نفسها وتضيف عبارة المجاملة.
  de.a1.unit02.lesson05.teach.line05:
    title: يردّ فيليكس ويسألها من أين هي
    gloss: 'يقول فيليكس: وأنا كذلك. من أين أنتِ؟'
    note: يردّ فيليكس المجاملة وينقل الحديث إلى بلد الأصل.
  de.a1.unit02.lesson05.teach.line06:
    title: تجيب آنا وتسأل بدورها
    gloss: 'تقول آنا: أنا من ألمانيا. وأنت؟'
    note: يؤكد هذا أن آنا ألمانية، وهو ما ينسجم مع كونهما جارين في مدينة ناطقة بالألمانية.
  de.a1.unit02.lesson05.teach.line07:
    title: يجيب فيليكس
    gloss: 'يقول فيليكس: أنا من إنجلترا.'
    note: نعرف الآن أن فيليكس من إنجلترا، أي أنه جار قادم من إنجلترا ويعيش في ألمانيا.
  de.a1.unit02.lesson05.teach.line08:
    title: تودّع آنا
    gloss: 'تقول آنا: مع السلامة!'
    note: هذه هي عبارة الوداع الرسمية من الوحدة 1، وتنسجم مع استمرارهما في استخدام صيغة *Sie*.
  de.a1.unit02.lesson05.teach.line09:
    title: يودّع فيليكس
    gloss: 'يقول فيليكس: مع السلامة!'
    note: يختم فيليكس بالطريقة نفسها، محافظًا على المستوى الرسمي نفسه طوال هذا اللقاء.
  de.a1.unit02.lesson05.teach.steckbrief:
    title: بطاقة تعريف مكتوبة قصيرة
    gloss: 'الاسم: فيليكس. البلد: إنجلترا.'
    note: بطاقة تعريف مكتوبة بسيطة تذكر الاسم ومعلومة واحدة عن الهوية، وهي المعلومات نفسها التي ذكرها فيليكس شفهيًا في الحوار.
