teaching:
  de.a1.unit05.lesson01.teach.wie_spaet:
    title: Wie spät ist es?
    gloss: كم الساعة؟
    note: حرفيًا «كم هو متأخر؟» -- وهي الطريقة المعتادة للسؤال عن الوقت.
  de.a1.unit05.lesson01.teach.drei_uhr:
    title: Es ist drei Uhr.
    gloss: الساعة الثالثة.
    note: '*Uhr* = «الساعة». الساعات الكاملة: العدد + *Uhr*.'
  de.a1.unit05.lesson01.teach.halb_vier:
    title: halb vier = 3:30
    gloss: الساعة الثالثة والنصف (3:30).
    note: 'تسمّي الألمانية نصف الساعة بالنسبة إلى الساعة التي تتجه نحوها: *halb vier* = «نصف الطريق إلى الرابعة» = 3:30، وليس 4:30.'
  de.a1.unit05.lesson01.teach.fuenf_uhr:
    title: Es ist fünf Uhr.
    gloss: الساعة الخامسة.
  de.a1.unit05.lesson02.teach.viertel_nach:
    title: Es ist Viertel nach drei.
    gloss: الساعة الثالثة والربع (3:15).
    note: '*Viertel* = «ربع»؛ *nach* = «بعد».'
  de.a1.unit05.lesson02.teach.viertel_vor:
    title: Es ist Viertel vor vier.
    gloss: الساعة الرابعة إلا ربعًا (3:45).
    note: '*vor* = «قبل».'
  de.a1.unit05.lesson02.teach.zehn_nach:
    title: Es ist zehn nach vier.
    gloss: الساعة الرابعة وعشر دقائق (4:10).
    note: 'الدقائق + *nach* + الساعة: zehn nach vier = الرابعة وعشر دقائق.'
  de.a1.unit05.lesson02.teach.zehn_vor:
    title: Es ist zehn vor fünf.
    gloss: الساعة الخامسة إلا عشر دقائق (4:50).
    note: 'الدقائق + *vor* + الساعة القادمة: zehn vor fünf = الخامسة إلا عشر دقائق.'
  de.a1.unit05.lesson03.teach.morgen:
    title: Morgen
    gloss: صباح
    note: '*Morgen* هي كلمة «صباح»، ويمتد تقريبًا من 6 صباحًا إلى 12 ظهرًا.'
    example_gloss: صباح الخير يا فيليكس!
  de.a1.unit05.lesson03.teach.mittag:
    title: Mittag
    gloss: ظهر
    note: '*Mittag* هو وقت الظهر نفسه، أي منتصف الوقت بين Morgen وNachmittag.'
    example_gloss: إنه وقت الظهر.
  de.a1.unit05.lesson03.teach.nachmittag:
    title: Nachmittag
    gloss: بعد الظهر
    note: '*Nachmittag* يمتد تقريبًا من 12 ظهرًا إلى 6 مساءً.'
    example_gloss: أعمل بعد الظهر.
  de.a1.unit05.lesson03.teach.abend:
    title: Abend
    gloss: مساء
    note: '*Abend* يمتد تقريبًا من 6 مساءً إلى 10 مساءً.'
    example_gloss: مساء الخير يا آنا!
  de.a1.unit05.lesson03.teach.nacht:
    title: Nacht
    gloss: ليل
    note: '*Nacht* يمتد تقريبًا من 10 مساءً إلى 6 صباحًا.'
    example_gloss: تصبح على خير يا فيليكس!
  de.a1.unit05.lesson03.teach.mitternacht:
    title: Mitternacht
    gloss: منتصف الليل
    note: '*Mitternacht* هي الساعة 12 ليلًا تمامًا، أي 0 Uhr.'
    example_gloss: تنتهي الحفلة عند منتصف الليل.
  de.a1.unit05.lesson03.teach.achtzehn:
    title: achtzehn
    gloss: ثمانية عشر
    note: '*achtzehn* = 18، وتُستخدم هنا في نظام الساعات الأربع والعشرين لأوقات الدوام الرسمية (achtzehn Uhr = 6 مساءً).'
    example_gloss: يُغلق المتجر عند الساعة 18:00 (6 مساءً).
  de.a1.unit05.lesson03.teach.laden_oeffnet:
    title: Der Laden öffnet um neun Uhr morgens.
    gloss: يفتح المتجر عند الساعة التاسعة صباحًا.
    note: '*um* + الوقت = «عند» وقت معيّن؛ *morgens* = «صباحًا».'
  de.a1.unit05.lesson03.teach.laden_schliesst:
    title: Der Laden schließt um achtzehn Uhr.
    gloss: يُغلق المتجر عند الساعة 18:00 (6 مساءً).
    note: '*schließt* = «يُغلق». تستخدم ساعات الدوام الرسمية نظام الساعات الأربع والعشرين.'
  de.a1.unit05.lesson04.teach.wann:
    title: Wann
    gloss: متى
    note: تبدأ *Wann* الأسئلة عن الوقت.
    example_gloss: متى تأتي؟
  de.a1.unit05.lesson04.teach.oeffnet_die:
    title: öffnet die
    gloss: يفتح
    note: '*öffnet* هو فعل *öffnen* (يفتح) مع الغائب المفرد؛ و*die* أداة التعريف للمؤنث وللجمع، وتتوافق هنا مع *die Bibliothek*.'
    example_gloss: متى تفتح المكتبة أبوابها؟
  de.a1.unit05.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: مكتبة
    note: '*Bibliothek* اسم مؤنث (*die Bibliothek*)، وهي المكان نفسه الذي ورد في الوحدة 4.'
    example_gloss: أنا ذاهب إلى المكتبة.
  de.a1.unit05.lesson04.teach.sie_pronomen:
    title: sie
    gloss: هي / هو / هم (بحرف صغير)
    note: '*sie* هنا ضمير الغائب الذي يحلّ محل الاسم المؤنث *die Bibliothek*، أي «ها» أو «هي»؛ ولا تخلطه بـ *Sie* بحرف كبير (ضمير المخاطب الرسمي) الذي يستخدمه فيليكس وآنا فيما بينهما.'
    example_gloss: تعجبني المكتبة. أزورها كثيرًا.
  de.a1.unit05.lesson04.teach.dann:
    title: dann
    gloss: حينئذٍ
    note: تُستخدم *dann* هنا في عبارة الوداع *Bis dann!* («أراك حينها!»).
    example_gloss: إلى اللقاء حينها!
  de.a1.unit05.lesson04.teach.line01:
    title: Felix يسأل عن المكتبة
    gloss: 'يقول Felix: متى تفتح المكتبة أبوابها؟'
  de.a1.unit05.lesson04.teach.line02:
    title: Anna تجيب
    gloss: 'تقول Anna: تفتح في التاسعة صباحًا.'
    note: كلمة *Sie* هنا تعني «هي» وتعود إلى *die Bibliothek*؛ وهي مكتوبة بحرف كبير لأنها في بداية الجملة فقط.
  de.a1.unit05.lesson04.teach.line03:
    title: Felix يطرح سؤالًا آخر
    gloss: 'يقول Felix: ومتى تُغلق؟'
  de.a1.unit05.lesson04.teach.line04:
    title: Anna تجيب مرة أخرى
    gloss: 'تقول Anna: تُغلق في الساعة 18:00 (السادسة مساءً).'
  de.a1.unit05.lesson04.teach.line05:
    title: Felix يودّع
    gloss: 'يقول Felix: حسنًا، إلى اللقاء حينها!'
  de.a1.unit05.lesson04.teach.schild:
    title: لافتة على الباب
    gloss: 'ساعات الدوام: من 9:00 إلى 18:00.'
    note: '*Öffnungszeiten* = «ساعات الدوام»؛ *bis* = «حتى / إلى».'
