    gloss: 'آنا: عفوًا، هل يمكنك أن تعيد ذلك من فضلك؟'
    note: تطلب آنا من فيليكس أن يعيد المعلومات.
    example_gloss: عفوًا، هل يمكنك أن تعيد ذلك من فضلك؟
  de.a1.unit23.lesson02.teach.line04:
    title: فيليكس يكرّر التفاصيل
    gloss: 'فيليكس: نعم. نلتقي في الساعة التاسعة أمام المقهى.'
    note: يكرّر فيليكس الوقت والمكان.
    example_gloss: نلتقي في الساعة التاسعة.
  de.a1.unit23.lesson02.teach.line05:
    title: آنا تعد بكتابة رسالة
    gloss: 'آنا: شكرًا. سأكتب لك رسالة.'
    note: تقول آنا إنها ستكتب رسالة.
    example_gloss: سأكتب لك رسالة.
