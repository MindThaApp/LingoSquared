    example_gloss: مرحبًا، معك آنا.
  de.a1.unit23.lesson02.teach.line02:
    title: فيليكس يذكر سبب اتصاله
    gloss: 'فيليكس: مساء الخير يا آنا. أتصل بخصوص اللقاء. نلتقي في الساعة التاسعة أمام المقهى.'
    note: يذكر فيليكس سبب اتصاله، ويحدد الوقت والمكان.
    example_gloss: أتصل بخصوص اللقاء.
  de.a1.unit23.lesson02.teach.line03:
