teaching:
  de.a1.unit08.lesson01.teach.ein_pfund:
    title: ein Pfund Äpfel
    gloss: رطل من التفاح
    note: لا تزال كلمة *Pfund* تُستخدم كثيرًا في ألمانيا في الحديث اليومي؛ فالـ *Pfund* الألماني يساوي 500 غرام بالضبط (نصف كيلو)، مع أن البلد يعتمد رسميًا النظام المتري.
  de.a1.unit08.lesson01.teach.ein_dutzend:
    title: ein Dutzend Eier
    gloss: دزينة من البيض
    note: تعني *Dutzend* دزينة (اثني عشر).
  de.a1.unit08.lesson01.teach.eine_flasche:
    title: eine Flasche Wasser
    gloss: زجاجة ماء
    note: تعني *Flasche* زجاجة.
  de.a1.unit08.lesson01.teach.eine_tuete:
    title: eine Tüte Reis
    gloss: كيس أرز
    note: تعني *Tüte* كيسًا.
  de.a1.unit08.lesson01.teach.ein_kilo:
    title: ein Kilo Tomaten
    gloss: كيلو من الطماطم
    note: '*Kilo* هي وحدة الوزن المترية المعتمدة، وتُستعمل أكثر بكثير من *Pfund* في كل ما يتجاوز الكمّيات اليومية البسيطة.'
  de.a1.unit08.lesson02.teach.was_kosten_die_aepfel:
    title: Was kosten die Äpfel?
    gloss: بكم التفاح؟
    note: 'تعني *kosten* «يكلّف»، وحرفيًا: «ماذا يكلّف التفاح؟»'
  de.a1.unit08.lesson02.teach.sie_kosten_zwei_euro:
    title: Sie kosten zwei Euro das Pfund.
    gloss: سعره يورو واحدان للرطل.
    note: 'تعني *Sie* هنا «هي/هم» للغائبين (أي التفاح) وليست ضمير المخاطب الرسمي. فضمير المخاطب الرسمي *Sie* وضمير الجمع الغائب *sie* يأخذان صيغة الفعل نفسها (*kosten*)، ويُكتب كلاهما بحرف كبير في أول الجملة، فلا يحسم المعنى إلا السياق: الموضوع هنا هو التفاح لا شخص.'
  de.a1.unit08.lesson02.teach.kann_ich_zwei_pfund:
    title: Kann ich zwei Pfund haben, bitte?
    gloss: هل يمكنني أن آخذ رطلين، من فضلك؟
    note: صيغة طلب مهذّبة، تشبه *Ich möchte..., bitte* من الوحدة 7.
  de.a1.unit08.lesson02.teach.ist_es_frisch:
    title: Ist es frisch?
    gloss: هل هو طازج؟
    note: تعني *frisch* طازجًا. يُستعمل *es* هنا مع اسم محايد (مثل das Brot)؛ وعند السؤال عن اسم مذكّر تقول *Ist er frisch?* (der Reis)، وعن اسم مؤنث *Ist sie frisch?* (die Milch). فالضمير يتغيّر بحسب جنس الاسم ولا يثبت على *es*.
  de.a1.unit08.lesson03.teach.pro_pfund:
    title: pro Pfund
    gloss: للرطل الواحد
    note: تعني *pro* «لكل»، وتُستعمل على بطاقات الأسعار وفي الأسعار المنطوقة على حد سواء.
    example_gloss: يكلّف التفاح يورو واحدين للرطل.
  de.a1.unit08.lesson03.teach.preisschild_text:
    title: Markt-Preisschild
    gloss: لوحة أسعار السوق
    note: لوحة أسعار بسيطة تعرض ثلاث سلع مع سعر الوحدة لكل منها.
  de.a1.unit08.lesson04.teach.das_macht_acht_euro:
    title: Das macht acht Euro.
    gloss: المجموع ثمانية يورو.
    note: '*Das macht...* هي الصيغة المعتادة لذكر المبلغ الإجمالي، وقد مرّت بنا في الوحدة 7.'
  de.a1.unit08.lesson04.teach.line01:
    title: فيليكس يسأل عن السعر
    gloss: 'يقول فيليكس: بكم التفاح؟'
    note: السؤال نفسه الذي ورد في الدرس الثاني، لكنه الآن في حوار حقيقي.
  de.a1.unit08.lesson04.teach.line02:
    title: آنا تذكر السعر
    gloss: 'تقول آنا: سعره يورو واحدان للرطل.'
    note: الجواب الكامل يذكر السعر لكل وحدة.
  de.a1.unit08.lesson04.teach.line03:
    title: فيليكس يطلب
    gloss: 'يقول فيليكس: حسنًا، هل يمكنني أن آخذ رطلين، من فضلك؟'
    note: تعني *Gut* هنا «حسنًا/جيّد»، وبها يقبل السعر قبل أن يطلب.
  de.a1.unit08.lesson04.teach.line04:
    title: آنا تسأل إن كان يريد شيئًا آخر
    gloss: 'تقول آنا: بالطبع. هل تريد شيئًا آخر؟'
    note: تعني *Natürlich* «بالطبع/طبعًا».
  de.a1.unit08.lesson04.teach.line05:
    title: فيليكس يطلب المزيد
    gloss: 'يقول فيليكس: نعم، ودزينة بيض أيضًا.'
    note: تعني *auch* «أيضًا».
  de.a1.unit08.lesson04.teach.line06:
    title: آنا تذكر المجموع
    gloss: 'تقول آنا: المجموع ثمانية يورو.'
    note: رطلان من التفاح (4 يورو) مع دزينة بيض (4 يورو) يساويان ثمانية يورو.
