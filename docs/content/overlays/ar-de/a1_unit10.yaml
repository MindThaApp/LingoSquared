teaching:
  de.a1.unit10.lesson01.teach.links_abbiegen:
    title: Biegen Sie links ab.
    gloss: انعطف يسارًا.
    note: 'الفعل *abbiegen* (ينعطف) فعل منفصل: تنتقل البادئة *ab* إلى نهاية الجملة تماماً: *Biegen Sie... ab*، وليس *Sie biegen ab* ولا *Abbiegen Sie*.'
  de.a1.unit10.lesson01.teach.rechts_abbiegen:
    title: Biegen Sie rechts ab.
    gloss: انعطف يمينًا.
    note: النمط نفسه للفعل المنفصل كما في *links abbiegen*، لكن مع *rechts* (يميناً).
  de.a1.unit10.lesson01.teach.geradeaus_gehen:
    title: Gehen Sie geradeaus.
    gloss: اذهب مباشرة.
    note: تعني *geradeaus* «إلى الأمام مباشرة». لا توجد هنا بادئة منفصلة، فهي صيغة أمر رسمية أبسط.
  de.a1.unit10.lesson01.teach.hier_anhalten:
    title: Halten Sie hier an.
    gloss: توقّف هنا.
    note: 'الفعل *anhalten* (يتوقف) منفصل أيضاً: تنتقل *an* إلى النهاية، على نمط *abbiegen* نفسه.'
  de.a1.unit10.lesson01.teach.ecke:
    title: Ecke
    gloss: زاوية
    note: 'تعني *Ecke* زاوية (ناصية الشارع). اسم مؤنث: *die Ecke*.'
    example_gloss: انعطف يساراً عند الزاوية.
  de.a1.unit10.lesson02.teach.wie_komme_ich_zur_bank:
    title: Wie komme ich zur Bank?
    gloss: كيف أصل إلى البنك؟
    note: '*zur* اختصار *zu der* (حالة الجر المؤنثة، die Bank)، وهو نمط الاختصار نفسه في *vom* (von + dem) من الوحدة 9.'
  de.a1.unit10.lesson02.teach.geradeaus_dann_links:
    title: Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.
    gloss: امشِ إلى الأمام مباشرة، ثم انعطف يساراً عند الزاوية.
    note: تربط *dann* (ثم) بين خطوتين في الاتجاهات. وتستعمل *an der Ecke* (عند الزاوية) أداة التعريف المؤنثة في حالة الجر، وفق نمط حروف الجر المكانية في الوحدة 9.
  de.a1.unit10.lesson02.teach.ist_es_weit:
    title: Ist es weit?
    gloss: هل هو بعيد؟
    note: تعني *weit* بعيد.
  de.a1.unit10.lesson02.teach.zwei_minuten:
    title: Es ist nur zwei Minuten von hier.
    gloss: إنه على بعد دقيقتين فقط من هنا.
    note: تعني *nur* «فقط».
  de.a1.unit10.lesson02.teach.nicht_verfehlen:
    title: Das können Sie nicht verfehlen.
    gloss: لا يمكن أن تخطئه.
    note: 'يعني *verfehlen* «يُخطئ» (لا يعثر على المكان). والترجمة الحرفية: «ذلك تستطيع أنت ألا تخطئه».'
  de.a1.unit10.lesson03.teach.erste_strasse:
    title: Nehmen Sie die erste Straße links.
    gloss: خذ أول شارع على اليسار.
    note: تعني *erste* «الأول»، وهي عدد ترتيبي.
  de.a1.unit10.lesson03.teach.zweite_strasse:
    title: Nehmen Sie die zweite Straße rechts.
    gloss: خذ ثاني شارع على اليمين.
    note: تعني *zweite* «الثاني».
  de.a1.unit10.lesson03.teach.route_text:
    title: Wegbeschreibung zur Apotheke
    gloss: الاتجاهات إلى الصيدلية
    note: وصف مكتوب قصير للطريق يجمع عدة عبارات سبق تعلمها.
  de.a1.unit10.lesson04.teach.line01:
    title: فيليكس يسأل عن الطريق
    gloss: 'فيليكس: عذراً، كيف أصل إلى البنك؟'
    note: عبارة الافتتاح المهذبة نفسها من الوحدة 9، لكن هنا نسأل عن الطريق وليس عن المكان فقط.
  de.a1.unit10.lesson04.teach.line02:
    title: آنا تشرح الطريق
    gloss: 'آنا: امشِ إلى الأمام مباشرة، ثم انعطف يساراً عند الزاوية.'
    note: الجواب الكامل يجمع خطوتين من الاتجاهات بواسطة *dann*.
  de.a1.unit10.lesson04.teach.line03:
    title: فيليكس يتأكد ويسأل أكثر
    gloss: 'فيليكس: أنعطف يساراً عند الزاوية، حسناً. هل هو بعيد؟'
    note: يكرر فيليكس الاتجاه ليتأكد أنه فهمه، ثم يطرح سؤالاً تالياً طبيعياً.
  de.a1.unit10.lesson04.teach.line04:
    title: آنا تجيب عن المسافة
    gloss: 'آنا: لا، إنه على بعد دقيقتين فقط من هنا. لا يمكن أن تخطئه.'
    note: جواب كامل ومطمئن.
