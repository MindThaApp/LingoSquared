    gloss: 'تقول آنا: هذه أختي. أختي معلّمة.'
    note: 'كما في العربية، لا تسبق المهنةَ أداةٌ في الألمانية: *Meine Schwester ist Lehrerin* = «أختي معلّمة». و*Lehrerin* هي صيغة المؤنث من *Lehrer*.'
  de.a1.unit06.lesson04.teach.line05:
