    gloss: لا، ليس لدي حيوان أليف.
    note: 'تنفي *Kein* الاسم *ein Haustier*: انظر ملاحظة القواعد.'
  de.a1.unit56.lesson01.teach.kein_sagt_nein:
    title: 'Kein: نفي الاسم'
    gloss: 'تنفي kein الاسم الذي يأتي معه ein: Ich habe einen Hund، لكن Ich habe kein Haustier.'
    note: 'تحلّ *Kein* محلّ *ein* في الجملة المنفية وتأخذ النهايات نفسها: ein Haustier يصبح kein Haustier، وeinen Hund يصبح keinen Hund. أما مع الأفعال والصفات فاستخدم *nicht*.'
