    gloss: 'آنا: هل لديك وقت غدًا؟'
    note: تبدأ الخطة بالسؤال عن التفرغ.
  de.a1.unit12.lesson02.teach.line02:
    title: فيليكس يذكر متى يكون متفرغًا
    gloss: 'فيليكس: نعم، في المساء.'
    note: يمكن أن تذكر الإجابة القصيرة وقت اليوم المتاح.
