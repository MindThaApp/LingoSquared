teaching:
  de.a1.unit01.lesson01.teach.hallo:
    title: Hallo
    gloss: مرحبًا
    note: '*Hallo* تحية عفوية عامة تُستخدم في أي وقت من اليوم، وتشبه «أهلًا» أو «مرحبًا» في العربية.'
    example_gloss: مرحبًا يا Felix!
  de.a1.unit01.lesson01.teach.guten_morgen:
    title: Guten Morgen
    gloss: صباح الخير
    note: تُستخدم *Guten Morgen* في الصباح، حتى وقت متأخر من الضحى تقريبًا.
  de.a1.unit01.lesson01.teach.guten_tag:
    title: Guten Tag
    gloss: طاب يومك / مرحبًا
    note: '*Guten Tag* هي تحية النهار المعتادة، وهي أكثر رسمية قليلًا، وتُستخدم من أواخر الضحى حتى بعد الظهر.'
  de.a1.unit01.lesson01.teach.guten_abend:
    title: Guten Abend
    gloss: مساء الخير
    note: تُستخدم *Guten Abend* عند الوصول إلى مكان ما في المساء؛ فهي تحية وليست عبارة وداع.
  de.a1.unit01.lesson02.teach.tschuss:
    title: Tschüss
    gloss: إلى اللقاء
    note: '*Tschüss* طريقة عفوية شائعة جدًّا لتوديع الأصدقاء والمعارف.'
    example_gloss: إلى اللقاء، أراك قريبًا!
  de.a1.unit01.lesson02.teach.auf_wiedersehen:
    title: Auf Wiedersehen
    gloss: إلى اللقاء (رسمي)
    note: معنى *Auf Wiedersehen* حرفيًّا «إلى أن نرى بعضنا مجددًا». وهي عبارة الوداع المعتادة والأكثر رسمية، وتناسب الغرباء وأماكن العمل.
  de.a1.unit01.lesson02.teach.bis_bald:
    title: Bis bald
    gloss: أراك قريبًا
    note: '*Bis bald* طريقة ودية للوداع حين تتوقع أن ترى الشخص قريبًا.'
  de.a1.unit01.lesson02.teach.bis_spater:
    title: Bis später
    gloss: أراك لاحقًا
    note: تُستخدم *Bis später* حين ستلتقي الشخص مرة أخرى في اليوم نفسه.
  de.a1.unit01.lesson02.teach.gute_nacht:
    title: Gute Nacht
    gloss: تصبح على خير
    note: تُقال *Gute Nacht* عندما يذهب أحدهم إلى النوم أو ينهي يومه؛ وعلى عكس *Guten Abend* هي عبارة وداع وليست تحية.
  de.a1.unit01.lesson03.teach.sie:
    title: Sie
    gloss: أنتَ/أنتِ (للمخاطب الرسمي)
    note: '*Sie* هي ضمير المخاطب الرسمي، وتُكتب بحرف كبير حتى في وسط الجملة، وتُستخدم مع الغرباء وكبار السن والمواقف الرسمية أو المهنية. العربية لا تفرّق بين ضميرين للمخاطب بهذه الطريقة، لذا فهذا مفهوم نحوي جديد وليس مجرد كلمة جديدة.'
  de.a1.unit01.lesson03.teach.du:
    title: du
    gloss: أنتَ/أنتِ (للمخاطب غير الرسمي)
    note: كلمة *du* هي صيغة المخاطب غير الرسمية، وتُستخدم مع الأصدقاء والعائلة والأطفال. أما استخدام *du* مع شخص غريب فقد يبدو مبالغًا في الألفة أو حتى فظًّا.
  de.a1.unit01.lesson03.teach.wie_geht_es_ihnen:
    title: Wie geht es Ihnen?
    gloss: كيف حالك؟ (رسمي)
    note: الطريقة الرسمية للسؤال عن حال شخص ما؛ و*Ihnen* هو ضمير المخاطب الرسمي في حالة الدّاتيف، ويتوافق مع صيغة *Sie*.
  de.a1.unit01.lesson03.teach.wie_gehts:
    title: Wie geht's?
    gloss: كيف الحال؟ (غير رسمي)
    note: '*Wie geht''s* اختصار لـ *Wie geht es*، وهي الطريقة اليومية غير الرسمية للسؤال عن الحال.'
  de.a1.unit01.lesson03.teach.gut_danke:
    title: Gut, danke.
    gloss: بخير، شكرًا.
    note: ردّ بسيط ومحايد يصلح في المقامين الرسمي وغير الرسمي.
  de.a1.unit01.lesson03.teach.sehr_gut_danke:
    title: Sehr gut, danke.
    gloss: بخير تمامًا، شكرًا.
    note: ردّ أكثر حماسًا من *Gut, danke.*
  de.a1.unit01.lesson03.teach.und_ihnen:
    title: Und Ihnen?
    gloss: وأنت؟ (رسمي)
    note: الطريقة الرسمية لإعادة السؤال، وتتوافق مع صيغة *Sie*.
  de.a1.unit01.lesson03.teach.und_dir:
    title: Und dir?
    gloss: وأنت؟ (غير رسمي)
    note: الطريقة غير الرسمية لإعادة السؤال؛ و*dir* هو ضمير المخاطب غير الرسمي في حالة الدّاتيف، ويتوافق مع صيغة *du*.
  de.a1.unit01.lesson04.teach.danke:
    title: Danke
    gloss: شكرًا
    note: ظهرت *Danke* سابقًا ضمن الردود، وهنا نراها ككلمة قائمة بذاتها.
    example_gloss: شكرًا جزيلًا!
  de.a1.unit01.lesson04.teach.bitte:
    title: Bitte
    gloss: من فضلك / عفوًا
    note: 'لـ *Bitte* معنيان شائعان حقًّا بحسب السياق: «من فضلك» عند الطلب، و«عفوًا» عند الرد على الشكر. السياق يحدد المقصود، وليس ذلك مصادفة ولا خطأ؛ فكلا الاستعمالين معياري تمامًا.'
    example_gloss:
    - قهوة من فضلك.
    - عفوًا، على الرحب والسعة!
  de.a1.unit01.lesson04.teach.entschuldigung:
    title: Entschuldigung
    gloss: عذرًا / آسف
    note: تُستخدم *Entschuldigung* للفت انتباه شخص ما بلباقة وللاعتذار السريع أيضًا.
    example_gloss: عذرًا، أين دورة المياه؟
  de.a1.unit01.lesson04.teach.kein_problem:
    title: Kein Problem
    gloss: لا مشكلة
    note: ردّ عفوي ودود، يشبه في نبرته «لا بأس» أو «ولا يهمك» في العربية.
  de.a1.unit01.lesson04.teach.gern_geschehen:
    title: Gern geschehen
    gloss: عفوًا / على الرحب والسعة
    note: طريقة أوفى وأوضح للرد على الشكر من *Bitte* الأقصر.
  de.a1.unit01.lesson05.teach.line01:
    title: Anna تحيّي Felix
    gloss: 'تقول Anna: طاب يومك!'
    note: تلتقي Anna وFelix لأول مرة بصفتهما جارَين في العمارة نفسها.
  de.a1.unit01.lesson05.teach.line02:
    title: Felix يردّ التحية ويسأل عن حالها
    gloss: 'يقول Felix: طاب يومك! كيف حالك؟'
    note: يستخدم Felix صيغة *Sie* الرسمية لأنهما التقيا للتو.
  de.a1.unit01.lesson05.teach.line03:
    title: Anna تردّ وتسأل بدورها
    gloss: 'تقول Anna: بخير، شكرًا. وأنت؟'
    note: تردّ Anna وتعيد السؤال بصيغة رسمية تتوافق مع أسلوب Felix.
  de.a1.unit01.lesson05.teach.line04:
    title: Felix يردّ
    gloss: 'يقول Felix: بخير تمامًا، شكرًا.'
    note: ردّ أكثر حماسًا قليلًا من *Gut, danke.* البسيطة.
  de.a1.unit01.lesson05.teach.line05:
    title: Anna تودّع
    gloss: 'تقول Anna: إلى اللقاء!'
    note: تستخدم Anna عبارة الوداع الأكثر رسمية، انسجامًا مع صيغة *Sie* التي استخدماها طوال الحوار.
  de.a1.unit01.lesson05.teach.line06:
    title: Felix يودّع ويقول إلى اللقاء قريبًا
    gloss: 'يقول Felix: إلى اللقاء، أراك قريبًا!'
    note: يجمع Felix بين الوداع الرسمي وعبارة «أراك قريبًا»، محافظًا على صيغة *Sie* التي استخدمها الطرفان في هذا اللقاء الأول.
