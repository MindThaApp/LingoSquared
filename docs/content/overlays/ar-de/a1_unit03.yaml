    gloss: مئة
    note: تعني *hundert* وحدها «مئة»، فلا تحتاج إلى *ein* قبلها (يمكن قول *einhundert* أيضًا، لكنه أقل شيوعًا في الكلام اليومي).
    example_gloss: ثمن هذا مئة يورو.
  de.a1.unit03.lesson03.teach.einundzwanzig:
    title: einundzwanzig
    gloss: واحد وعشرون
    note: 'الأعداد المركّبة من 21 إلى 99 في الألمانية ترتّب الوحدات قبل العشرات، كما في العربية («واحد وعشرون»)، لكنها تُكتب كلها كلمة واحدة: رقم الآحاد + *und* («و») + رقم العشرات. *einundzwanzig* = *ein* (واحد) + *und* (و) + *zwanzig* (عشرون).'
  de.a1.unit03.lesson03.teach.zweiunddreissig:
    title: zweiunddreißig
    gloss: اثنان وثلاثون
    note: 'النمط نفسه: *zwei* (اثنان) + *und* (و) + *dreißig* (ثلاثون) = 32.'
  de.a1.unit03.lesson04.teach.wie_alt_sind_sie:
    title: Wie alt sind Sie?
    gloss: كم عمرك؟ (رسمي)
    note: 'تعني *alt* «كبير في السن»، والجملة حرفيًا: «كم أنت كبير في السن؟».'
  de.a1.unit03.lesson04.teach.wie_alt_bist_du:
    title: Wie alt bist du?
    gloss: كم عمرك؟ (غير رسمي)
    note: الصيغة غير الرسمية، وتستخدم *du*.
  de.a1.unit03.lesson04.teach.ich_bin_jahre_alt:
    title: Ich bin achtundzwanzig Jahre alt.
    gloss: عمري ثمانية وعشرون عامًا.
    note: تأتي *Jahre alt* («سنة») دائمًا بعد العدد. وتقول الألمانية العمر بصيغة «أنا ... سنة»، أي Ich bin + العدد + Jahre alt.
  de.a1.unit03.lesson05.teach.line01:
    title: فيليكس يسأل آنا عن عمرها
    gloss: 'يقول فيليكس: كم عمرك، إن جاز لي السؤال؟'
    note: تخفّف العبارة *wenn ich fragen darf* («إن جاز لي السؤال») من مباشرة السؤال، وهي لمسة مهذبة تناسب استمرارهما في استخدام صيغة الاحترام *Sie*.
  de.a1.unit03.lesson05.teach.line02:
    title: آنا تجيب وتسأل بدورها
    gloss: 'تقول آنا: عمري ثمانية وعشرون عامًا. وأنت؟'
    note: تذكر آنا عمرها ثم تعيد السؤال، على النمط نفسه الذي رأيناه في الوحدة 2.
  de.a1.unit03.lesson05.teach.line03:
    title: فيليكس يجيب
    gloss: 'يقول فيليكس: عمري واحد وثلاثون عامًا.'
    note: هذا يؤكد أن فيليكس أكبر من آنا بثلاث سنوات.
