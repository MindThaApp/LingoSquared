    - رقم بيتي هو عشرون.
  de.a1.unit03.lesson03.teach.dreissig_bis_fuenfzig:
    title: dreißig, vierzig, fünfzig
    gloss: ثلاثون، أربعون، خمسون
    note: لاحظ *dreißig* وليس *dreizig*، فالعدد 30 ينتهي بـ *-ßig* بدل *-zig* (والعدد 20 *zwanzig* شاذ أيضًا).
    example_gloss:
    - ثمن هذا ثلاثون يورو.
    - ثمن هذا أربعون يورو.
    - ثمن هذا خمسون يورو.
  de.a1.unit03.lesson03.teach.sechzig_bis_neunzig:
    title: sechzig, siebzig, achtzig, neunzig
    gloss: ستون، سبعون، ثمانون، تسعون
    note: 'من 40 فما فوق يصير النمط منتظمًا: الرقم + *-zig* (مع الاختصارين نفسيهما *sech-* و*sieb-* كما في الأعداد من 13 إلى 19).'
    example_gloss:
    - ثمن هذا ستون يورو.
