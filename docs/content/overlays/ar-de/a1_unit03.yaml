  de.a1.unit03.lesson02.teach.dreizehn_bis_sechzehn:
    title: dreizehn, vierzehn, fünfzehn, sechzehn
    gloss: ثلاثة عشر، أربعة عشر، خمسة عشر، ستة عشر
    note: 'ابتداءً من 13 تُبنى الأعداد الألمانية من الرقم الأساسي + *-zehn* (وهي لاحقة تقابل *-teen* في لغات جرمانية أخرى). انتبه: *sechzehn* وليس *sechszehn*، إذ يسقط حرف *s*.'
    example_gloss:
