    - رقم بيتي هو أربعة عشر.
    - رقم بيتي هو خمسة عشر.
    - رقم بيتي هو ستة عشر.
  de.a1.unit03.lesson02.teach.siebzehn_bis_zwanzig:
    title: siebzehn, achtzehn, neunzehn, zwanzig
    gloss: سبعة عشر، ثمانية عشر، تسعة عشر، عشرون
    note: لاحظ *siebzehn* وليس *siebenzehn*، إذ تسقط النهاية *-en* من *sieben* قبل *-zehn*.
    example_gloss:
    - رقم بيتي هو سبعة عشر.
    - رقم بيتي هو ثمانية عشر.
