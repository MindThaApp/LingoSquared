  de.a1.unit59.lesson05.teach.anna_ruft_felix:
    title: من يستخدم ماذا؟
    gloss: تتصل آنا بفيليكس كل يوم. تستخدم هاتفها، لا تطبيقًا. ليس لدى فيليكس حاسوب في المنزل، لكنه يستخدم الإنترنت على هاتفه. يطّلع يوناس كل صباح على نشرة الطقس. ثم يذهب للركض. غالبًا ما ترسل لينا إلى آنا رسالة. هل تستخدم أنت أيضًا هاتفك كل يوم؟
    note: تقارن عادات الشخصيات الأربع في استخدام الأجهزة، على غرار قراءة المقارنة في وحدة الرياضة.
