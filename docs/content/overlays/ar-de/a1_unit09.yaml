    gloss: مطعم
    note: 'تعني *Restaurant* مطعم. وهي اسم محايد: *das Restaurant*.'
    example_gloss: هذا المطعم طعامه جيد.
  de.a1.unit09.lesson02.teach.neben:
    title: Die Apotheke ist neben dem Park.
    gloss: الصيدلية بجانب الحديقة.
    note: تعني *neben* «بجانب». وهي حرف جر يأخذ الحالة الثالثة أو الرابعة بحسب المعنى؛ ومع المكان الثابت (كما هنا) تأتي مع الحالة الثالثة (Dativ)، فيصبح *der Park* (مذكر) *dem Park*.
  de.a1.unit09.lesson02.teach.gegenueber_von:
    title: Die Apotheke ist gegenüber vom Krankenhaus.
    gloss: الصيدلية قبالة المستشفى.
    note: تعني *gegenüber von* «قبالة». و*vom* اختصار شائع لـ *von dem* (الحالة الثالثة للمحايد، *das Krankenhaus*)، ويُستعمل في الكلام والكتابة.
  de.a1.unit09.lesson02.teach.zwischen:
    title: Die Apotheke ist zwischen der Bank und dem Park.
    gloss: الصيدلية بين المصرف والحديقة.
    note: 'تعني *zwischen* «بين». لاحظ صيغتي الحالة الثالثة: *der Bank* (مؤنث) و*dem Park* (مذكر).'
  de.a1.unit09.lesson02.teach.hinter:
    title: Das Restaurant ist hinter der Bank.
    gloss: المطعم خلف المصرف.
    note: تعني *hinter* «خلف». و*der Bank* هي صيغة الحالة الثالثة للمؤنث.
  de.a1.unit09.lesson02.teach.vor:
    title: Der Park ist vor dem Krankenhaus.
    gloss: الحديقة أمام المستشفى.
    note: تعني *vor* «أمام». و*dem Krankenhaus* هي صيغة الحالة الثالثة للمحايد.
  de.a1.unit09.lesson03.teach.wo_ist_die_bank:
    title: Wo ist die Bank?
    gloss: أين المصرف؟
    note: '*Wo ist...?* هي الطريقة المعتادة للسؤال عن مكان شيء ما.'
  de.a1.unit09.lesson03.teach.sie_ist_neben:
    title: Sie ist neben dem Park.
    gloss: هي بجانب الحديقة.
    note: تعني *Sie* هنا «هي» (وتعود إلى *die Bank*، وهي مؤنثة). وتُكتب بحرف كبير لأنها في بداية الجملة فقط. ويدل الفعل *ist* على أنها ليست صيغة المخاطب الرسمية التي تكون معها *Sie sind*.
  de.a1.unit09.lesson03.teach.ist_es_weit:
    title: Ist es weit von hier?
    gloss: هل هو بعيد من هنا؟
    note: تعني *weit* بعيد. و*es* هنا ضمير عام يشير إلى الموقف، ولا يرتبط بجنس اسم معيّن.
  de.a1.unit09.lesson03.teach.nicht_weit:
    title: Nein, es ist nicht weit.
    gloss: لا، ليس بعيدًا.
    note: تنفي *nicht* الصفة *weit*.
  de.a1.unit09.lesson04.teach.entschuldigung_wo:
    title: Entschuldigung, wo ist die Apotheke?
    gloss: عفوًا، أين الصيدلية؟
    note: مرّت علينا *Entschuldigung* بمعنى «عفوًا / آسف»، وهي هنا تفتتح السؤال بلطف.
  de.a1.unit09.lesson04.teach.line01:
    title: فيليكس يسأل عن الطريق
    gloss: 'يقول فيليكس: عفوًا، أين الصيدلية؟'
    note: هي نفسها عبارة الافتتاح المهذبة في العبارة المنفردة أعلاه، لكنها هنا في حوار حقيقي.
  de.a1.unit09.lesson04.teach.line02:
    title: آنا تذكر الموقع
    gloss: 'تقول آنا: إنها قبالة المستشفى.'
    note: الجواب الكامل يذكر موقع الصيدلية بالنسبة إلى معلم معروف.
  de.a1.unit09.lesson04.teach.line03:
    title: فيليكس يسأل عن المسافة
    gloss: 'يقول فيليكس: هل هي بعيدة من هنا؟'
    note: سؤال طبيعي يأتي بعد معرفة الاتجاه العام.
  de.a1.unit09.lesson04.teach.line04:
    title: آنا تجيب عن المسافة
    gloss: 'تقول آنا: لا، ليست بعيدة. إنها بين المصرف والحديقة.'
    note: الجواب الكامل يطمئن السائل بشأن المسافة، ثم يذكر معلمًا ثانيًا أدق.
