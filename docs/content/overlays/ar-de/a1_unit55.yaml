teaching:
  de.a1.unit55.lesson01.teach.gross_klein:
    title: طويل وقصير
    gloss: طويل / قصير
    note: تصف *groß* الشخص الطويل و*klein* الشخص القصير. في الألمانية يُقال للأشخاص groß (كبير) وليس lang (طويل).
    example_gloss:
    - لينا طويلة.
    - يوناس قصير.
  de.a1.unit55.lesson01.teach.alt_jung:
    title: كبير في السن وشاب
    gloss: كبير في السن / شاب
    note: تصف *Alt* و*jung* هنا انطباعًا عامًا عن العمر، لا عددًا محددًا من السنوات.
    example_gloss:
    - الجد كبير في السن.
    - فيليكس شاب.
  de.a1.unit55.lesson01.teach.alt_kann_eine:
    title: 'Alt: عدد أو انطباع'
    gloss: يمكن أن تأتي Alt مع عدد من السنوات كما في Ich bin dreißig Jahre alt، أو تعطي انطباعًا عامًا كما في Opa ist alt.
    note: تسأل عن العمر الدقيق بـ *Wie alt bist du?* أما هنا فتصف *alt* كيف يبدو الشخص من حيث العمر، دون ذكر عدد.
  de.a1.unit55.lesson01.teach.lena_ist_gross:
    title: لينا طويلة ويوناس قصير
    gloss: لينا طويلة ويوناس قصير.
    note: جملة بسيطة تجمع بين فكرتين بـ *und* (و)، وتمهّد للمقارنة المباشرة في الدرس 05.
  de.a1.unit55.lesson02.teach.die_haare:
    title: الشعر
    gloss: الشعر
    note: '*Haare* اسم جمع: *die Haare*. وفي الألمانية مفرد أيضًا هو das Haar، لكن للحديث عن شعر الرأس يُستخدم عادةً Haare.'
    example_gloss: لدى فيليكس شعر أسود قصير.
  de.a1.unit55.lesson02.teach.blond_braun_grau:
    title: أشقر وبني ورمادي
    gloss: أشقر / بني / رمادي
    note: 'ثلاثة ألوان للشعر: blond وbraun وgrau. وقبل اسم جمع بلا أداة تلحقها النهاية -e: blonde وbraune وgraue Haare.'
    example_gloss:
    - لدى آنا شعر أشقر.
    - لدى يوناس شعر بني.
    - شعر الجد رمادي.
  de.a1.unit55.lesson02.teach.lang_kurz:
    title: طويل وقصير (للشعر)
    gloss: طويل / قصير (للشعر)
    note: 'تصف *Kurz* (قصير) و*lang* (طويل) طول الشعر. والنهاية -e مرة أخرى: kurze Haare وlange Haare.'
    example_gloss:
    - لدى لينا شعر طويل.
    - لدى يوناس شعر قصير.
  de.a1.unit55.lesson02.teach.haare_ist_plural:
    title: Haare تأخذ النهاية -e
    gloss: 'Haare اسم جمع بلا أداة تعريف، لذا تنتهي الصفة بـ -e: kurze Haare وlange Haare وblonde Haare وbraune Haare وgraue Haare وschwarze Haare.'
    note: عند غياب الأداة قبل اسم جمع، تأخذ الصفة النهاية -e. وهي القاعدة نفسها في *Augen* في الدرس 03.
  de.a1.unit55.lesson02.teach.anna_hat_lange:
    title: 'Ihre: ـها (ملكية المؤنث)'
    gloss: 'تعني Ihre هنا «ـها» للملكية: ihre Haare = شعرها. لدى آنا شعر طويل، وشعرها أشقر.'
    note: '*Ihre* (بحرف i صغير) هي صيغة الملكية بمعنى «خاصتها»، وتتوافق مع الاسم الجمع Haare. أما بحرف I كبير فتعني *Ihre* «خاصتكم» في صيغة المخاطبة الرسمية.'
  de.a1.unit55.lesson02.teach.felix_hat_kurze:
    title: لدى فيليكس شعر أسود قصير
    gloss: لدى فيليكس شعر أسود قصير.
    note: 'نعيد استخدام *schwarz* (أسود)، وهنا للشعر: schwarze Haare.'
  de.a1.unit55.lesson02.teach.anna_hat_lange_2:
    title: لدى آنا شعر أشقر طويل
    gloss: لدى آنا شعر أشقر طويل.
    note: تجمع في جملة طبيعية واحدة مفردات الطول والألوان من هذا الدرس.
  de.a1.unit55.lesson03.teach.die_augen:
    title: العيون
    gloss: العيون
    note: '*Augen* جمع *das Auge*. تستخدم الألمانية عادةً صيغة الجمع لأن للإنسان عينين.'
    example_gloss: لدى فيليكس عينان بنيتان.
  de.a1.unit55.lesson03.teach.blau_braun_gruen:
    title: أزرق وبني وأخضر
    gloss: أزرق / بني / أخضر
    note: 'ألوان: blau (أزرق) وbraun (بني) وgrün (أخضر).'
    example_gloss:
    - لدى آنا عينان زرقاوان.
    - لدى يوناس عينان بنيتان.
    - لدى لينا عينان خضراوان.
  de.a1.unit55.lesson03.teach.augen_ist_plural:
    title: Augen تأخذ -e
    gloss: 'Augen جمع، لذا تنتهي الصفة بـ -e: blaue Augen وbraune Augen وgrüne Augen.'
    note: 'القاعدة نفسها كما في Haare: غياب الأداة مع اسم جمع يعطي النهاية -e.'
  de.a1.unit55.lesson03.teach.wie_sieht_anna:
    title: كيف تبدو آنا؟
    gloss: كيف تبدو آنا؟
    note: '*Wie sieht ... aus?* هو السؤال الأساسي في هذه الوحدة. الفعل *aussehen* منفصل: sieht ... aus.'
  de.a1.unit55.lesson03.teach.anna_hat_lange:
    title: لدى آنا شعر أشقر طويل وعينان زرقاوان
    gloss: لدى آنا شعر أشقر طويل وعينان زرقاوان.
    note: إجابة نموذجية تجمع الشعر والعينين في جملة واحدة بـ *und*.
  de.a1.unit55.lesson04.teach.anna_ein_neues:
    title: آنا تقدّم نينا
    gloss: 'آنا: فتاة جديدة ستأتي إلى مقهى اللغة. اسمها نينا.'
    note: '*Ein neues Mädchen kommt* تقدّم شخصًا جديدًا. وبعد *kommt* يدل الاتجاه *ins* (in das) Sprachcafé على حالة المفعول به (Akkusativ).'
  de.a1.unit55.lesson04.teach.felix_okay_wie:
    title: فيليكس يسأل كيف تبدو
    gloss: 'فيليكس: حسنًا! كيف تبدو؟'
    note: 'نعيد السؤال الأساسي في الوحدة، لكن مع *sie* (هي) بدل الاسم: wie sieht sie aus?'
  de.a1.unit55.lesson04.teach.anna_sie_ist:
    title: آنا تصف طول نينا وشعرها
    gloss: 'آنا: هي قصيرة ولها شعر أشقر قصير.'
    note: 'نجمع *klein* مع مفردات الشعر من الدرس 02. ويُحذف *sie* الثاني: sie ist klein und hat ...'
  de.a1.unit55.lesson04.teach.felix_und_ihre:
    title: فيليكس يسأل عن عينيها
    gloss: 'فيليكس: وعيناها؟'
    note: تعني *Ihre* هنا «ـها» للملكية، وليست صيغة من صيغ المخاطب. وهي تتفق مع الجمع Augen.
  de.a1.unit55.lesson04.teach.anna_sie_hat:
    title: Anna تصف عيني Nina
    gloss: 'Anna: عيناها خضراوان.'
    note: تعيد استخدام *grüne Augen* من الدرس 03.
  de.a1.unit55.lesson04.teach.felix_danke_dann:
    title: Felix سيتعرّف عليها
    gloss: 'Felix: شكرًا! إذًا سأتعرّف عليها بالتأكيد.'
    note: 'تعني *Dann erkenne ich sie bestimmt* «إذًا سأتعرّف عليها بالتأكيد». بعد *dann* يأتي الفعل في الموضع الثاني: dann erkenne ich sie.'
  de.a1.unit55.lesson05.teach.jonas_und_lena:
    title: مقارنة بين Jonas وLena
    gloss: Jonas وLena أخ وأخت، لكنهما يبدوان مختلفين. Jonas قصير القامة وله شعر بني قصير وعينان بنيتان. Lena أطول من Jonas ولها شعر بني طويل وعينان خضراوان. كيف تبدو أنت؟
    note: مقارنة قصيرة تعيد استعمال كل كلمات الألوان والطول التي تعلمناها، وتنتهي بسؤال الوحدة الأساسي موجهًا إلى القارئ.
    glosses:
      Bruder: أخ
      Schwester: أخت
      sehen: مظهر
      unterschiedlich: مختلف
      klein: قصير
      kurze: قصير
      braune: بني
      Haare: الشعر
      Augen: العيون
      größer: أطول
      lange: طويل
      grüne: أخضر
      aus: (جزء من الفعل 'aussehen' = يبدو / يظهر)
  de.a1.unit55.lesson05.teach.das_muster_kennst:
    title: صيغة التفضيل مرة أخرى
    gloss: 'تعرف هذا النمط من قبل: صفة + -er + als (من). وهنا نستخدمه مع الأشخاص: Lena أطول من Jonas.'
    note: 'هو نمط *-er + als* نفسه الذي مرّ في وحدة المقارنات. تصبح Groß إلى größer: يظهر الأوملاوت على حرف العلة.'
  de.a1.unit55.lesson05.teach.lena_hat_laengere:
    title: شعر Lena أطول من شعر Jonas
    gloss: شعر Lena أطول من شعر Jonas.
    note: '*Längere Haare*: تأخذ länger النهاية -e قبل اسم جمع بلا أداة تعريف، وتأخذ lang الأوملاوت في صيغة التفضيل.'
  de.a1.unit55.lesson05.teach.ich_habe_kurze:
    title: لدي شعر قصير بني
    gloss: لدي شعر قصير بني.
    note: جملة نموذجية بضمير المتكلم تستخدم *Ich habe ...*، يمكنك إعادة استخدامها عند وصف مظهرك.
  de.a1.unit55.lesson06.teach.felix_schau_mal:
    title: Felix يلمح Nina
    gloss: 'Felix: انظري، هل هذه Nina؟ لها شعر أشقر قصير وعينان خضراوان.'
    note: '*Schau mal* (انظر) طريقة ودّية للفت الانتباه إلى شيء ما. وهي صيغة الأمر للمخاطب المفرد du.'
  de.a1.unit55.lesson06.teach.anna_ja_das:
    title: Anna تؤكد
    gloss: 'Anna: نعم، هذه Nina!'
    note: تأكيد قصير وطبيعي.
  de.a1.unit55.lesson06.teach.nina_hallo_bist:
    title: Nina تحيّي Felix
    gloss: 'Nina: مرحبًا، هل أنت Felix؟'
    note: 'سؤال بسيط غير رسمي: *bist du ...?* (هل أنت ...؟). Bist هي صيغة du من الفعل sein.'
  de.a1.unit55.lesson06.teach.felix_ja_freut:
    title: Felix يردّ التحية على Nina
    gloss: 'Felix: نعم! تشرفت بمعرفتك يا Nina.'
    note: '*Freut mich* هي العبارة المعتادة عند اللقاء الأول، كما في الوحدة 2. أما مع شخص تعرفه سابقًا فتقول *Schön, dich zu sehen*.'
  de.a1.unit55.lesson06.teach.nina_freut_mich:
    title: Nina تردّ التحية
    gloss: 'Nina: تشرفت بمعرفتك أنا أيضًا!'
    note: 'يُختتم الحوار: تعرّف Felix على Nina بنجاح من وصف Anna السابق.'
