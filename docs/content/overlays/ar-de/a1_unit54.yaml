teaching:
  de.a1.unit54.lesson01.teach.lesen_sport_treiben:
    title: القراءة، ممارسة الرياضة، الطبخ
    gloss: يقرأ، يمارس الرياضة، يطبخ
    note: 'ثلاثة أفعال شائعة للهوايات: *lesen* (يقرأ)، و*Sport treiben* (يمارس الرياضة)، و*kochen* (يطبخ). كلمة Sport اسم، لذلك تُكتب بحرف كبير.'
    example_gloss:
    - أحب قراءة كتاب.
    - أمارس الرياضة أيام السبت.
    - أحب الطبخ للأصدقاء.
  de.a1.unit54.lesson01.teach.die_freizeit:
    title: وقت الفراغ
    gloss: وقت الفراغ
    note: '*Die Freizeit* اسم مؤنث: تعلّمه دائمًا مع أداة التعريف die. وهي الكلمة الأساسية للحديث عن الهوايات.'
    example_gloss: في وقت فراغي، أحب القراءة.
  de.a1.unit54.lesson01.teach.in_meiner_freizeit:
    title: قول ما تفعله في وقت فراغك
    gloss: في وقت فراغي، أحب القراءة.
    note: '*Lese* هي صيغة ich من الفعل *lesen* (يقرأ). تبدأ الجملة بعبارة زمنية، ومع ذلك يبقى الفعل في المرتبة الثانية: in meiner Freizeit lese ich gern.'
  de.a1.unit54.lesson02.teach.musik_hoeren_zeichnen:
    title: الموسيقى، الرسم، ألعاب الفيديو
    gloss: يستمع إلى الموسيقى، يرسم، يلعب ألعاب الفيديو
    note: 'ثلاث عبارات أخرى للهوايات: *Musik hören* (الاستماع إلى الموسيقى)، و*zeichnen* (يرسم)، و*Videospiele spielen* (لعب ألعاب الفيديو). Musik و Videospiele اسمان، لذلك تُكتبان بحرف كبير.'
    example_gloss:
    - أحب الاستماع إلى الموسيقى.
    - أرسم كثيرًا.
    - أحب لعب ألعاب الفيديو مع الأصدقاء.
  de.a1.unit54.lesson02.teach.ich_hoere_gern:
    title: قول إنك تحب الاستماع إلى الموسيقى
    gloss: أحب الاستماع إلى الموسيقى.
    note: تقول الألمانية *Musik hören* دون حرف جر، بينما نقول في العربية «استمع إلى الموسيقى» بحرف الجر «إلى».
  de.a1.unit54.lesson02.teach.ich_spiele_gern:
    title: قول إنك تحب لعب ألعاب الفيديو مع الأصدقاء
    gloss: أحب لعب ألعاب الفيديو مع الأصدقاء.
    note: '*Mit Freunden* (مع الأصدقاء): يأتي بعد mit دائمًا الاسم في حالة Dativ، لذلك تصبح Freunde إلى Freunden.'
  de.a1.unit54.lesson03.teach.immer_oft_manchmal:
    title: دائمًا، غالبًا، أحيانًا، أبدًا
    gloss: دائمًا، غالبًا، أحيانًا، أبدًا
    note: 'ظروف التكرار الأربعة الأساسية: immer, oft, manchmal, nie. تقع عادةً بعد الفعل مباشرة: ich spiele nie.'
    example_gloss:
    - أمارس الرياضة دائمًا أيام السبت.
    - غالبًا ما أقرأ كتابًا.
    - أرسم أحيانًا.
    - لا ألعب ألعاب الفيديو أبدًا.
  de.a1.unit54.lesson03.teach.jede_woche_jedes:
    title: كل أسبوع، كل عطلة أسبوع
    gloss: كل أسبوع، كل عطلة أسبوع
    note: '*Jede Woche* و*jedes Wochenende* كلتاهما بمعنى «كل»، لكن النهاية تتغير بحسب جنس الاسم: انظر البطاقة التالية.'
    example_gloss:
    - أطبخ للأصدقاء كل أسبوع.
    - أمارس الرياضة كل عطلة أسبوع.
  de.a1.unit54.lesson03.teach.die_woche_jede:
    title: Jede مقابل jedes
    gloss: Die Woche مؤنثة، لذلك نقول jede Woche. و Das Wochenende محايد، لذلك نقول jedes Wochenende.
    note: '*Woche* مؤنثة (*die Woche*)، لذلك تأخذ *jede*؛ و*Wochenende* محايد (*das Wochenende*)، لذلك يأخذ *jedes*. تعلّم كل اسم مع أداة تعريفه فتعرف النهاية.'
  de.a1.unit54.lesson03.teach.was_machst_du:
    title: السؤال عن وقت الفراغ
    gloss: ماذا تفعل في وقت فراغك؟
    note: هذا هو السؤال الأساسي في هذه الوحدة، استخدمه لتسأل أي شخص عن هواياته.
  de.a1.unit54.lesson04.teach.anna_wir_gehen:
    title: Anna تفتح موضوع الهوايات
    gloss: 'Anna: نتمشّى معًا كثيرًا. لكن ماذا تفعل أيضًا في وقت فراغك يا Felix؟'
    note: 'في *Wir gehen oft zusammen spazieren* يأتي gehen مع فعل ثانٍ: الفعل المصرَّف gehen في المرتبة الثانية، وصيغة المصدر spazieren في آخر الجملة.'
  de.a1.unit54.lesson04.teach.felix_ich_koche:
    title: هوايات Felix
    gloss: 'Felix: أحب الطبخ، في البيت أيضًا. وأمارس الرياضة كثيرًا.'
    note: '*Auch zu Hause* (في البيت أيضًا) توضّح أن Felix يطبخ للمتعة، وليس في عمله بالمطعم فحسب.'
  de.a1.unit54.lesson04.teach.anna_kochst_du:
    title: Anna تتفاجأ
    gloss: 'Anna: هل تطبخ في البيت أيضًا؟ أنت تطبخ طوال اليوم في العمل أصلًا!'
    note: '*Den ganzen Tag* (اليوم كله) في حالة Akkusativ، ولهذا يصبح der Tag إلى den Tag. تأخذ المدد الزمنية مثل هذه حالة Akkusativ.'
  de.a1.unit54.lesson04.teach.felix_ja_aber:
    title: Felix يشرح
    gloss: 'Felix: نعم، لكنني أجد الطبخ مريحًا. وأنت، ماذا تحب أن تفعل؟'
    note: في *Kochen finde ich entspannend* وُضعت كلمة Kochen في البداية للتأكيد. ويبقى الفعل في المرتبة الثانية، لذلك يأتي ich بعده.
  de.a1.unit54.lesson04.teach.anna_ich_lese:
    title: هوايات Anna
    gloss: 'Anna: أحب القراءة وأستمع إلى الموسيقى كثيرًا.'
    note: تجمع هذه الجملة فعلَي هواية من الدرسين 01-02 باستخدام *und* (و).
  de.a1.unit54.lesson04.teach.felix_spielst_du:
    title: Felix يسأل عن ألعاب الفيديو
    gloss: 'Felix: هل تلعب ألعاب الفيديو أيضًا؟'
    note: 'سؤال قصير يُجاب عنه بنعم أو لا: يأتي الفعل أولًا، spielst du ...؟'
  de.a1.unit54.lesson04.teach.anna_nein_ich:
    title: Anna تجيب
    gloss: 'Anna: لا، لا ألعب ألعاب الفيديو أبدًا. لكنني أرسم أحيانًا!'
    note: '*Nie* (أبدًا) و*manchmal* (أحيانًا) من الدرس 03، متقابلتان في إجابة واحدة. وكلتاهما تقع بعد الفعل مباشرة.'
  de.a1.unit54.lesson05.teach.felix_und_ich:
    title: مقارنة الهوايات
    gloss: Felix وأنا نتمشّى معًا كثيرًا. لكن لدينا أيضًا هوايات أخرى. Felix يحب الطبخ، في البيت أيضًا، ويمارس الرياضة كثيرًا. أحب القراءة وأستمع إلى الموسيقى كثيرًا. أرسم أحيانًا، لكنني لا ألعب ألعاب الفيديو أبدًا. ماذا تحب أن تفعل في وقت فراغك؟
    note: تلخّص رسالة Anna وقائع من الدرس 04 وتنتهي بسؤال القارئ السؤال الأساسي في الوحدة.
    glosses:
      spazieren: يتنزه
      oft: غالبًا
      zusammen: معًا
      andere: أخرى
      kocht: يطبخ
      gern: يحب
      Hause: في البيت
      Sport: يمارس الرياضة
      lese: القراءة
      höre: أستمع
      Musik: موسيقى
      zeichne: أرسم
      manchmal: أحيانًا
      spiele: ألعب ألعاب الفيديو
      nie: أبدًا
      freien: فراغ
      Zeit: وقت
  de.a1.unit54.lesson06.teach.felix_was_machst:
    title: Felix يسأل عن نهاية الأسبوع
    gloss: 'Felix: ماذا ستفعل في نهاية هذا الأسبوع؟'
    note: في *Dieses Wochenende* (نهاية هذا الأسبوع) نهاية المحايد -es، لأن das Wochenende محايد.
  de.a1.unit54.lesson06.teach.anna_ich_weiss:
    title: Anna لم تقرر بعد
    gloss: 'Anna: لا أعرف بعد. أحب القراءة، لكنني أريد أيضًا أن أخرج.'
    note: '*Nach draußen* (إلى الخارج) طريقة شائعة للقول إنك تريد الخروج من البيت.'
  de.a1.unit54.lesson06.teach.felix_gehen_wir:
    title: Felix يقترح خطة
    gloss: 'Felix: هل نتمشّى معًا؟ وبعد ذلك أطبخ لنا.'
    note: 'تأتي *Danach* (بعد ذلك) أولًا، فيأتي الفعل بعدها ثم الفاعل: danach koche ich.'
  de.a1.unit54.lesson06.teach.anna_gute_idee:
    title: Anna توافق
    gloss: 'Anna: فكرة جيدة! أحب المشي وأحب الطبخ أيضًا.'
    note: 'تدل *Gern* بعد الفعل على أنك تستمتع بشيء: ich gehe gern spazieren, ich koche gern. وتصلح مع أي فعل تقريبًا.'
  de.a1.unit54.lesson06.teach.felix_perfekt_dann:
    title: Felix يؤكد
    gloss: 'Felix: ممتاز. إذن أراك يوم السبت!'
    note: 'جملة ختام ودّية تؤكد الخطة ليوم *Samstag* (السبت). تأخذ أيام الأسبوع *am*: am Samstag.'
