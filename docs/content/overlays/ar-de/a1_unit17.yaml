teaching:
  de.a1.unit17.lesson01.teach.kopfschmerzen:
    title: Kopfschmerzen
    gloss: صداع
    note: '*Kopfschmerzen* جمع في صيغته، لكنها تُستعمل للدلالة على صداع واحد.'
    example_gloss: أعاني من صداع.
  de.a1.unit17.lesson01.teach.bauchschmerzen:
    title: Bauchschmerzen
    gloss: ألم في البطن
    note: '*Bauch* تعني البطن، و*Schmerzen* تعني آلامًا.'
    example_gloss: عندي ألم في البطن.
  de.a1.unit17.lesson01.teach.hals:
    title: Hals
    gloss: حلق / رقبة
    note: تدل *Hals* على الحلق أو الرقبة بحسب السياق.
    example_gloss: حلقي يؤلمني.
  de.a1.unit17.lesson01.teach.weh:
    title: Mein Kopf tut weh.
    gloss: رأسي يؤلمني.
    note: 'في الألمانية يكون العضو هو فاعل الجملة، ويُقال إنه «يُحدث ألمًا»: *tut weh*.'
    example_gloss: معدتي تؤلمني.
  de.a1.unit17.lesson01.teach.mir_ist_schlecht:
    title: Mir ist schlecht.
    gloss: أشعر بالغثيان.
    note: لا تترجمها حرفيًا «أنا سيئ»؛ فالعبارة الطبيعية هي *Mir ist schlecht*.
    example_gloss: أشعر بالغثيان؛ وعندي ألم في البطن.
  de.a1.unit17.lesson02.teach.brauchen_sie_hilfe:
    title: Brauchen Sie Hilfe?
    gloss: هل تحتاج إلى مساعدة؟
    note: صيغة *Sie* الرسمية تجعل السؤال مهذبًا.
  de.a1.unit17.lesson02.teach.ich_brauche:
    title: Ich brauche Wasser.
    gloss: أحتاج إلى ماء.
    note: تعني *brauche* «أحتاج إلى» وليس «أستخدم».
    example_gloss: 'في السياق: أحتاج إلى ماء وإلى استراحة.'
  de.a1.unit17.lesson02.teach.pause:
    title: Pause
    gloss: استراحة
    note: '*eine Pause* هي فترة راحة قصيرة.'
    example_gloss: أحتاج إلى استراحة.
  de.a1.unit17.lesson02.teach.health_instruction:
    title: Trinken Sie Wasser.
    gloss: اشرب الماء. خذ استراحة.
    note: صيغة *Sie* الرسمية تجعل التعليمات مهذبة.
    example_gloss: خذ استراحة.
  de.a1.unit17.lesson02.teach.gesundheit_text:
    title: مشكلة آنا
    gloss: مشكلة آنا
    note: يذكر النص القصير العَرَض والحاجة الفورية.
    example_gloss: هي تحتاج إلى ماء.
  de.a1.unit17.lesson02.teach.line01:
    title: فيليكس يسأل آنا عن حالها
    gloss: 'فيليكس: آنا، هل أنتِ بخير؟'
    note: يستعمل فيليكس صيغة *Ihnen* الرسمية مع آنا.
  de.a1.unit17.lesson02.teach.line02:
    title: آنا تذكر المشكلة
    gloss: 'آنا: لا، عندي صداع.'
    note: يذكر الجواب العَرَض بوضوح.
  de.a1.unit17.lesson02.teach.line03:
    title: فيليكس يعرض المساعدة
    gloss: 'فيليكس: هل تحتاجين إلى مساعدة؟'
    note: عرض بسيط للمساعدة.
  de.a1.unit17.lesson02.teach.line04:
    title: آنا تذكر ما تحتاجه
    gloss: 'آنا: نعم، من فضلك. أحتاج إلى ماء وإلى استراحة.'
    note: يبدأ الرد بـ *Ja, bitte* ثم يذكر الحاجات الفورية.
    example_gloss: 'في السياق: أحتاج إلى ماء وإلى استراحة.'
