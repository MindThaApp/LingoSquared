teaching:
  de.a1.unit04.lesson01.teach.montag:
    title: Montag
    gloss: الاثنين
    note: '*Montag* هو أول أيام الأسبوع في البلدان الناطقة بالألمانية، أمّا في العالم العربي فيُعدّ الأحد أو السبت عادةً بداية الأسبوع.'
    example_gloss: عندي وقت يوم الاثنين.
  de.a1.unit04.lesson01.teach.dienstag:
    title: Dienstag
    gloss: الثلاثاء
    note: '*Dienstag* هو ثاني أيام الأسبوع.'
    example_gloss: عندي وقت يوم الثلاثاء.
  de.a1.unit04.lesson01.teach.mittwoch:
    title: Mittwoch
    gloss: الأربعاء
    note: تعني *Mittwoch* حرفيًّا «منتصف الأسبوع»، وهو فعلًا اليوم الأوسط من أسبوع العمل في ألمانيا.
    example_gloss: عندي وقت يوم الأربعاء.
  de.a1.unit04.lesson01.teach.donnerstag:
    title: Donnerstag
    gloss: الخميس
    note: سُمّي *Donnerstag* نسبةً إلى الإله الجرماني دونار (ثور).
    example_gloss: عندي وقت يوم الخميس.
  de.a1.unit04.lesson01.teach.freitag:
    title: Freitag
    gloss: الجمعة
    note: سُمّي *Freitag* نسبةً إلى الإلهة الجرمانية فريغ.
    example_gloss: عندي وقت يوم الجمعة.
  de.a1.unit04.lesson01.teach.samstag:
    title: Samstag
    gloss: السبت
    note: '*Samstag* هي الكلمة المعتادة للسبت في معظم أنحاء ألمانيا، و*Sonnabend* بديل إقليمي (في شمال ألمانيا وشرقها).'
    example_gloss: عندي وقت يوم السبت.
  de.a1.unit04.lesson01.teach.sonntag:
    title: Sonntag
    gloss: الأحد
    note: تعني *Sonntag* حرفيًّا «يوم الشمس».
    example_gloss: عندي وقت يوم الأحد.
  de.a1.unit04.lesson01.teach.welcher_tag:
    title: Welcher Tag ist heute?
    gloss: أيّ يوم هو اليوم؟
    note: تعني *heute* «اليوم»، وتعني *Welcher Tag* «أيّ يوم».
  de.a1.unit04.lesson02.teach.januar:
    title: Januar
    gloss: يناير
    note: '*Januar* هو الشهر الأول من السنة.'
    example_gloss: عيد ميلادي في يناير.
  de.a1.unit04.lesson02.teach.maerz:
    title: März
    gloss: مارس
    note: '*März* هو الشهر الثالث من السنة.'
    example_gloss: عيد ميلادي في مارس.
  de.a1.unit04.lesson02.teach.mai:
    title: Mai
    gloss: مايو
    note: كلمة *Mai* قصيرة وسهلة الحفظ، وتُنطق قريبةً جدًّا من «مايو» بالعربية.
    example_gloss: عيد ميلادي في مايو.
  de.a1.unit04.lesson02.teach.juli:
    title: Juli
    gloss: يوليو
    note: '*Juli* هو الشهر السابع من السنة.'
    example_gloss: عيد ميلادي في يوليو.
  de.a1.unit04.lesson02.teach.september:
    title: September
    gloss: سبتمبر
    note: تُنطق *September* قريبةً من «سبتمبر» بالعربية، وتتشابه الكلمتان في الأصل.
    example_gloss: عيد ميلادي في سبتمبر.
  de.a1.unit04.lesson02.teach.dezember:
    title: Dezember
    gloss: ديسمبر
    note: '*Dezember* هو آخر شهر في السنة.'
    example_gloss: عيد ميلادي في ديسمبر.
  de.a1.unit04.lesson02.teach.welcher_monat:
    title: Welcher Monat ist es?
    gloss: أيّ شهر هذا؟
    note: تعني *Monat* «شهر»، وتعني *es* «هو» (لغير العاقل).
  de.a1.unit04.lesson03.teach.wievielte:
    title: Der Wievielte ist heute?
    gloss: ما تاريخ اليوم؟
    note: حرفيًّا «الكم-يّ هو اليوم؟»، وهي الطريقة المعتادة للسؤال عن التاريخ بالألمانية.
  de.a1.unit04.lesson03.teach.siebte_juli:
    title: Heute ist der siebte Juli.
    gloss: اليوم هو السابع من يوليو.
    note: 'تذكر الألمانية اليوم أولًا ثم الشهر، وهذا موافق للعربية: *der siebte Juli* أي «السابع من يوليو». احفظ *der siebte Juli* عبارةً كاملة.'
  de.a1.unit04.lesson03.teach.dienstag_siebte_juli:
    title: Heute ist Dienstag, der siebte Juli.
    gloss: اليوم هو الثلاثاء، السابع من يوليو.
    note: أضِف اسم اليوم قبل التاريخ، وافصل بينهما بفاصلة.
  de.a1.unit04.lesson03.teach.numerische_form:
    title: Man kann es auch als 7.7. schreiben.
    gloss: 'يمكن كتابته أيضًا هكذا: 7.7.'
    note: 'تضع التواريخ الرقمية الألمانية اليوم أولًا ثم الشهر، وبعد كلٍّ منهما نقطة: 7.7. = السابع من يوليو. وهذا الترتيب نفسه المعتاد في العربية.'
  de.a1.unit04.lesson03.teach.geburtstag_frage:
    title: Wann haben Sie Geburtstag?
    gloss: متى عيد ميلادك؟ (رسمي)
    note: حرفيًّا «متى يكون عندكم عيد ميلاد؟»؛ فالألمانية تقول إنك «تملك» عيد ميلاد (*haben*).
  de.a1.unit04.lesson03.teach.geburtstag_antwort:
    title: Mein Geburtstag ist der dritte März.
    gloss: عيد ميلادي في الثالث من مارس.
    note: تعني *Mein Geburtstag* «عيد ميلادي»، وتعني *der dritte März* «الثالث من مارس» (اليوم أولًا ثم الشهر).
  de.a1.unit04.lesson04.teach.oeffnet:
    title: öffnet
    gloss: يفتح
    note: '*öffnet* هي صيغة المفرد الغائب من الفعل *öffnen* (يفتح)، وتُستعمل بمعنى «يفتح أبوابه»، مثل متجر أو مكتبة.'
    example_gloss: يفتح المتجر أبوابه يوم الاثنين.
  de.a1.unit04.lesson04.teach.wieder:
    title: wieder
    gloss: مرة أخرى
    note: تعني *wieder* «مرة أخرى»، وتُستعمل هنا للسؤال عن موعد إعادة الافتتاح.
    example_gloss: تفتح المكتبة أبوابها من جديد يوم الاثنين.
  de.a1.unit04.lesson04.teach.die:
    title: die
    gloss: أداة التعريف (للمؤنث والجمع)
    note: '*die* أداة التعريف للمفرد المؤنث ولكل أسماء الجمع، وهي هنا مع الاسم المؤنث *Bibliothek*.'
    example_gloss: المكتبة كبيرة.
  de.a1.unit04.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: مكتبة
    note: '*Bibliothek* اسم مؤنث (*die Bibliothek*).'
    example_gloss: أنا ذاهب إلى المكتبة.
  de.a1.unit04.lesson04.teach.am:
    title: am
    gloss: في / يوم
    note: '*am* اختصار لـ *an dem*، ويُستعمل قبل أيام الأسبوع والتواريخ (*am Montag* = «يوم الاثنين»).'
    example_gloss: يوم الاثنين أعمل.
  de.a1.unit04.lesson04.teach.den:
    title: den
    gloss: أداة التعريف (المذكر، حالة المفعول به)
    note: '*den* هي صيغة المذكر في حالة المفعول به (Akkusativ) من *der*. وتظهر في التواريخ الكاملة بعد اسم اليوم، كما في *am Donnerstag, den neunten Juli*؛ فاحفظها نمطًا ثابتًا دون تحليل الحالة الإعرابية في هذا المستوى. (وقد ترى أيضًا *dem* بعد *am*، وهو صحيح كذلك.)'
    example_gloss: سنلتقي يوم الخميس، التاسع من يوليو.
  de.a1.unit04.lesson04.teach.neunten:
    title: neunten
    gloss: التاسع
    note: '*neunten* هي الصيغة المصرّفة للعدد الترتيبي المشتق من *neun* (تسعة)، وتُستعمل في التواريخ: *der neunte Juli* (حالة الفاعل) تصبح *den neunten Juli* في صيغة التاريخ الكامل هذه.'
    example_gloss: عيد ميلادي في التاسع من يوليو.
  de.a1.unit04.lesson04.teach.line01:
    title: فيليكس يسأل عن التاريخ
    gloss: 'يقول فيليكس: ما تاريخ اليوم؟'
  de.a1.unit04.lesson04.teach.line02:
    title: آنا تذكر التاريخ
    gloss: 'تقول آنا: اليوم هو الثلاثاء، السابع من يوليو.'
  de.a1.unit04.lesson04.teach.line03:
    title: فيليكس يسأل عن المكتبة
    gloss: 'يقول فيليكس: متى تفتح المكتبة أبوابها من جديد؟'
  de.a1.unit04.lesson04.teach.line04:
    title: آنا تجيب
    gloss: 'تقول آنا: ستفتح من جديد يوم الخميس، التاسع من يوليو.'
    note: تعني *Sie* هنا «هي» لغير العاقل، وتعود إلى *die Bibliothek* (اسم مؤنث).
  de.a1.unit04.lesson04.teach.line05:
    title: فيليكس يودّع
    gloss: 'يقول فيليكس: حسنًا، إلى اللقاء يوم الخميس.'
    note: '*bis Donnerstag* = «حتى الخميس»، وهي طريقة شائعة لقول «أراك يوم الخميس».'
  de.a1.unit04.lesson04.teach.notiz:
    title: ورقة على الباب
    gloss: مغلق حتى الخميس، التاسع من يوليو.
    note: '*Geschlossen* تعني «مغلق».'
