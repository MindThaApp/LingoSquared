teaching:
  prs.a2.unit20.lesson01.teach.rkhst_rkhst_tabstan:
    title: Vakantie
    gloss: de vakantie / de zomervakantie
    note: '*رخصتی* is het gewone woord voor een vakantie of vrije tijd, en *رخصتی تابستان* is de lange zomervakantie. *تابستان* betekent zomer.'
    example_gloss:
    - In augustus heb ik vakantie.
    - De zomervakantie begint in juli.
  prs.a2.unit20.lesson01.teach.hfth_andh_sal:
    title: Wanneer iets gebeurt
    gloss: volgende week / volgend jaar / binnenkort
    note: '*آینده* betekent volgende of komende en staat achter het zelfstandig naamwoord: *هفته آینده* is volgende week en *سال آینده* is volgend jaar. *به‌زودی* betekent binnenkort.'
    example_gloss:
    - Volgende week heb ik een afspraak.
    - Volgend jaar wil ik naar België.
    - Binnenkort heb ik vakantie.
  prs.a2.unit20.lesson01.teach.sfr_rdn_rzrw:
    title: Drie werkwoorden voor reizen
    gloss: reizen / boeken / blijven
    note: '*سفر کردن* is reis plus *کردن*, en *رزرو کردن* is reservering plus *کردن*. In een zin verandert alleen *کردن*: *سفر می‌کنم*, *رزرو می‌کنم*. *ماندن* betekent blijven.'
    example_gloss:
    - Ik reis graag met de trein.
    - Ik wil een kamer boeken.
    - Ik blijf een week.
  prs.a2.unit20.lesson01.teach.hwtl_m:
    title: Waar je verblijft
    gloss: het hotel / de camping
    note: '*هوتل* is de gebruikelijke Afghaanse spelling van hotel. *کمپ* is een camping. Je slaapt *در هوتل* of *در کمپ*.'
    example_gloss:
    - Het hotel is dicht bij het strand.
    - We slapen op de camping.
  prs.a2.unit20.lesson01.teach.dr_rkhst_tabstan:
    title: Vragen naar vakantieplannen
    gloss: Wat ga je doen in de zomervakantie?
    note: 'In het Dari is er geen aparte hulpvorm voor plannen in de nabije toekomst: je gebruikt gewoon de tegenwoordige tijd *می‌کنی*, en het vraagwoord *چه* staat voor het werkwoord aan het einde van de zin.'
  prs.a2.unit20.lesson01.teach.dr_mah_ast:
    title: 'Plannen voor de nabije toekomst: de tegenwoordige tijd'
    gloss: In augustus ga ik naar Duitsland reizen. Ik ga een hotel boeken.
    note: 'Om te zeggen wat je binnenkort gaat doen, gebruikt het Dari de tegenwoordige tijd met een tijdswoord: *می‌روم* (ik ga) met *در ماه اگست* (in augustus). Je voegt het voorvoegsel *می‌* en de uitgang *-م* toe aan de stam: *رزرو می‌کنم*. Het werkwoord staat helemaal aan het einde van de zin en het tijdswoord kan vooraan staan: *هفته آینده یک هوتل رزرو می‌کنم*. Zonder tijdswoord kan dezelfde vorm ook een dagelijkse gewoonte uitdrukken.'
  prs.a2.unit20.lesson01.teach.mn_hwtl_rzrw:
    title: Een hotel boeken
    gloss: Ik ga een hotel boeken.
  prs.a2.unit20.lesson02.teach.wrs_rftn_w:
    title: Drie plannen voor later
    gloss: een cursus volgen / verhuizen / sparen
    note: '*کورس گرفتن* is de vaste uitdrukking voor een cursus volgen. *کوچ کردن* betekent verhuizen naar een nieuw huis.'
    example_gloss:
    - Ik wil een cursus volgen.
    - Mijn oom wil verhuizen.
    - Ik wil sparen voor een nieuwe fiets.
  prs.a2.unit20.lesson02.teach.bad_bad_az:
    title: Verder in de toekomst
    gloss: later / over een maand
    note: '*بعد از یک ماه* betekent ''over een maand''. Het werkt ook met andere periodes: *بعد از یک هفته*.'
    example_gloss:
    - Later wil ik een huis kopen.
    - Over een maand begint mijn cursus.
  prs.a2.unit20.lesson02.teach.bad_az_mah:
    title: Een cursus die begint
    gloss: Over een maand begint mijn cursus.
  prs.a2.unit20.lesson02.teach.mn_qsd_darm:
    title: 'Voornemens: قصد دارم + subjunctief'
    gloss: Ik ben van plan een cursus te volgen.
    note: 'Om te zeggen wat je van plan bent, gebruik je *قصد دارم* (ik ben van plan) en daarna het tweede werkwoord in de subjunctief: *قصد دارم یک کورس بگیرم*. De subjunctief is het voorvoegsel *بـ* + de stam + de persoonsuitgang: *بـ* + *گیر* + *-م* = *بگیرم*. Samengestelde werkwoorden met *کردن* krijgen geen *بـ*: *پس‌انداز کنم*. Gebruik dit voor dingen die je wilt doen, niet voor vaste afspraken.'
  prs.a2.unit20.lesson02.teach.mn_qsd_darm_2:
    title: Van plan zijn te verhuizen
    gloss: Ik ben van plan te verhuizen.
  prs.a2.unit20.lesson02.teach.mn_qsd_darm_3:
    title: Van plan zijn te sparen
    gloss: Ik ben van plan geld te sparen.
  prs.a2.unit20.lesson02.teach.frda_bh_bazar:
    title: Tegenwoordige tijd of قصد دارم?
    gloss: Morgen ga ik naar de markt. Later ben ik van plan te verhuizen.
    note: 'Gebruik de tegenwoordige tijd met een tijdswoord voor de nabije, vaststaande toekomst: *فردا به بازار می‌روم*. Gebruik *قصد دارم* + subjunctief voor een voornemen dat verder weg ligt of minder zeker is: *بعد قصد دارم کوچ کنم*.'
  prs.a2.unit20.lesson03.teach.shad_htma:
    title: Misschien en zeker
    gloss: misschien / zeker
    note: '*شاید* drukt twijfel uit en wordt gevolgd door de subjunctief. *حتما* betekent ''zeker'' of ''absoluut''.'
    example_gloss:
    - Misschien regent het morgen.
    - Dat is zeker leuk.
  prs.a2.unit20.lesson03.teach.amsal_an_tabstan:
    title: Dit jaar, deze zomer
    gloss: dit jaar / deze zomer
    note: '*امسال* is één woord voor dit jaar. *این تابستان* is deze zomer: *این* betekent deze of dit en staat voor het zelfstandig naamwoord.'
    example_gloss:
    - Dit jaar ga ik niet op vakantie.
    - Deze zomer blijf ik thuis.
    - Ga je dit jaar op vakantie?
  prs.a2.unit20.lesson03.teach.an_tabstan_dr:
    title: Thuisblijven
    gloss: Deze zomer blijf ik thuis.
  prs.a2.unit20.lesson03.teach.frda_ar_mnm:
    title: شاید en de subjunctief
    gloss: Morgen ga ik werken. Misschien ga ik later naar de bioscoop.
    note: 'Na *شاید* staat het werkwoord in de subjunctief: *شاید بعد به سینما بروم* (*بـ* + de stam *رو* + *-م*), niet *می‌روم*. Het werkwoord blijft aan het einde van de zin staan. Na een gewoon tijdswoord gebruik je de gewone tegenwoordige tijd: *فردا کار می‌کنم*.'
  prs.a2.unit20.lesson03.teach.bh_rkhst_nmrwm:
    title: Zeggen dat je iets niet gaat doen
    gloss: Ik ga niet op vakantie. Ik ben niet van plan te verhuizen.
    note: 'Je ontkent de tegenwoordige tijd door *ن* voor het werkwoordsvoorvoegsel te zetten: *می‌روم* wordt *نمی‌روم*: *به رخصتی نمی‌روم*. Om een voornemen te ontkennen, ontken je *دارم*: *قصد ندارم کوچ کنم* (ik ben niet van plan te verhuizen); het tweede werkwoord blijft in de subjunctief.'
  prs.a2.unit20.lesson04.teach.ba_h_mdt:
    title: Twee vraagzinnen
    gloss: met wie / hoe lang
    note: '*با کی* vraagt met wie je iets doet; *با* betekent met. *چه مدت* vraagt naar een periode.'
    example_gloss:
    - Met wie ga je naar het strand?
    - Hoe lang blijf je?
  prs.a2.unit20.lesson04.teach.ja_mrw:
    title: Waar ga je naartoe?
    gloss: Waar ga je heen?
    note: '*کجا* betekent waar, en bij een werkwoord van beweging ook waarheen: *کجا می‌روی؟* Het vraagwoord staat midden in de zin, vlak voor het werkwoord.'
  prs.a2.unit20.lesson04.teach.ba_bh_rkhst:
    title: Met wie?
    gloss: Met wie ga je op vakantie?
  prs.a2.unit20.lesson04.teach.h_mdt_anja:
    title: Hoe lang?
    gloss: Hoelang blijf je daar?
  prs.a2.unit20.lesson04.teach.ba_khwahrm_mrwm:
    title: Antwoorden
    gloss: Ik ga met mijn zus.
  prs.a2.unit20.lesson04.teach.hfth_dw_hfth:
    title: Weken
    gloss: een week / twee weken
    note: 'Na een getal blijft het zelfstandig naamwoord in het Dari enkelvoud: *دو هفته*, niet *دو هفته‌ها*.'
    example_gloss:
    - Ik blijf een week.
    - We blijven twee weken.
  prs.a2.unit20.lesson04.teach.ja_mrw_ba:
    title: Vragen over plannen
    gloss: Waar ga je heen? Met wie ga je? Hoe lang blijf je?
    note: 'Vragen in het Dari houden de gewone woordvolgorde: zet het vraagwoord op de plek waar het antwoord zou staan en houd het werkwoord aan het einde: *با کی به رخصتی می‌روی؟*, *چه مدت می‌مانی؟*. Tegen een vriend(in) eindigt het werkwoord op *-ی*: *می‌روی*, *می‌مانی*.'
  prs.a2.unit20.lesson05.teach.slam_zrmnh_bhzwd:
    title: Een bericht van Maryam
    gloss: Hoi Zarmina! Binnenkort heb ik vakantie. In augustus ga ik met mijn zus naar België en we verblijven een week in een hotel. Daarna ga ik twee dagen naar mijn ouders. Volgend jaar ben ik van plan een cursus te volgen, en misschien ga ik ook verhuizen. En jij, wat ga jij doen?
    note: 'Maryam beschrijft plannen voor de nabije toekomst met de tegenwoordige tijd en een voornemen op langere termijn met *قصد دارم*. Let op dat elk werkwoord aan het einde van zijn zin staat: *می‌مانیم*, *بگیرم*, *کنم*.'
    glosses:
      به‌زودی: binnenkort
      رخصتی: vakantie
      اگست: augustus
      خواهرم: zus
      به: naar
      بلجیم: België
      هوتل: hotel
      می‌مانیم: blijven
      بعد: daarna
      والدینم: ouders
      روز: dagen
      آینده: volgende
      سال: jaar
      قصد: voornemen (قصد دارم = ik ben van plan)
      کورس: cursus
      بگیرم: volgen (een cursus)
      شاید: misschien
      کوچ: verhuizen
      آن‌وقت: dan
      هم: ook
  prs.a2.unit20.lesson06.teach.slam_hmawn_bra:
    title: Zarmina vraagt Homayoun naar zijn plannen
    gloss: 'Zarmina: Hoi Homayoun! Heb je al plannen voor de zomervakantie?'
  prs.a2.unit20.lesson06.teach.bl_dr_mah:
    title: Homayoun antwoordt
    gloss: 'Homayoun: Ja! In augustus ga ik naar Duitsland. Ik ga een hotel boeken.'
  prs.a2.unit20.lesson06.teach.aal_ba_mrw:
    title: Zarmina vraagt met wie hij gaat
    gloss: 'Zarmina: Leuk! Met wie ga je?'
  prs.a2.unit20.lesson06.teach.ba_aam_ma:
    title: Homayoun zegt met wie en hoelang
    gloss: 'Homayoun: Met mijn oom. We blijven een week.'
  prs.a2.unit20.lesson06.teach.w_bad_h:
    title: Zarmina vraagt naar later
    gloss: 'Zarmina: En daarna? Wat ben je van plan?'
  prs.a2.unit20.lesson06.teach.sal_andh_qsd:
    title: Homayoun noemt een plan en vraagt terug
    gloss: 'Homayoun: Volgend jaar ben ik van plan een cursus te volgen. En jij?'
  prs.a2.unit20.lesson06.teach.dr_mah_jwla:
    title: Zarmina antwoordt
    gloss: 'Zarmina: In juli ga ik werken. Misschien ga ik daarna naar mijn ouders.'
