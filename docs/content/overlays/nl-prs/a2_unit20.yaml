course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor gevorderde beginners: praten over vakantieplannen. De tegenwoordige tijd met een tijdswoord voor plannen in de nabije toekomst, قصد دارم + conjunctief voor voornemens, شاید + conjunctief voor twijfel, de ontkenning en vragen over plannen.'
