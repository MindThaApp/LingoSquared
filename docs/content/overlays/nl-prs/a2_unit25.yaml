        رفته‌ای: jij bent geweest (tegen een vriend)
        رفته است: hij of zij is geweest
        رفته‌ایم: wij zijn geweest
        رفته‌این: u bent geweest / jullie zijn geweest (beleefd of meervoud)
        رفته‌اند: zij zijn geweest
        هرات: Herat
        بامیان: Bamyan
        مزار شریف: Mazar-i-Sharif
      status: correct
    feedback: 'Elke uitgang laat zien wie er geweest is: *-ام* ik, *-ای* jij (vriend), *است* hij of zij, *-ایم* wij, *-این* jullie of u (beleefd), *-اند* zij.'
    pairs:
    - left: رفته‌ام
      right: ik ben geweest
    - left: رفته‌ای
      right: jij bent geweest (tegen een vriend)
    - left: رفته است
