course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor lager gevorderden: zeggen en vragen wat je wel of nooit hebt gedaan. De voltooid tegenwoordige tijd (voltooid deelwoord plus de korte koppelwerkwoordvorm) in de schriftelijke vorm رفته‌ام en de gesproken Kaboelse vorm رفتیم, de ontkenning en het verschil met de simpele verleden tijd.'
units:
  prs.a2.unit25.have_you_ever:
    title: Heb je ooit...?
lessons:
  prs.a2.unit25.lesson01.experience_words_and_perfect_forms:
    title: Woorden over ervaringen en de vorm رفته‌ام
  prs.a2.unit25.lesson02.more_participles_and_spoken_forms:
    title: Meer voltooid deelwoorden en de gesproken vormen
  prs.a2.unit25.lesson03.negative_and_simple_past_contrast:
    title: De ontkenning, en de voltooid tegenwoordige tijd tegenover de simpele verleden tijd
  prs.a2.unit25.lesson04.ever_never_already_yet:
    title: Ooit, nooit, al en nog niet
  prs.a2.unit25.lesson05.reading_and_listening:
    title: Lezen en luisteren over ervaringen
  prs.a2.unit25.lesson06.conversation_about_experiences:
    title: Een gesprek over ervaringen
teaching:
  prs.a2.unit25.lesson01.teach.ever:
    title: Tot nu toe, ooit
    gloss: tot nu toe, tot op heden, ooit
    note: '*تا حال* betekent tot nu toe. In een vraag gaat het over je hele leven tot nu toe: *آیا تا حال به هرات رفته‌ای؟* betekent: Ben je ooit in Herat geweest? *آیا* opent een ja-neevraag.'
    example_gloss: Ben je ooit in Herat geweest?
  prs.a2.unit25.lesson01.teach.herat:
    title: Herat
    gloss: Herat
    note: '*هرات* is een grote stad in het westen van Afghanistan, bekend om de oude citadel en de markten.'
    example_gloss: Mijn vriend komt uit Herat.
  prs.a2.unit25.lesson01.teach.mazar:
    title: Mazar-i-Sharif
    gloss: Mazar-i-Sharif
    note: '*مزار شریف* is de grote stad in het noorden van Afghanistan, bekend om de heiligdom met blauwe tegels.'
    example_gloss: Mijn vriend woont in Mazar-i-Sharif.
  prs.a2.unit25.lesson01.teach.bamyan:
    title: Bamyan
    gloss: Bamyan
    note: '*بامیان* is een vallei in het centrale hoogland van Afghanistan, bekend om het berglandschap.'
    example_gloss: Mijn vriend is in Bamyan geweest.
  prs.a2.unit25.lesson01.teach.qabili:
    title: Qabili palaw
    gloss: qabili palaw (rijst met vlees, wortel en rozijnen)
    note: '*قابلی پلو* is rijst gekookt met vlees, wortel en rozijnen, een geliefd Afghaans gerecht.'
    example_gloss: Qabili palaw is erg lekker.
  prs.a2.unit25.lesson01.teach.mantu:
    title: Mantu
    gloss: mantu (gestoomde deegzakjes)
    note: '*منتو* zijn gestoomde deegzakjes gevuld met vlees en ui.'
    example_gloss: Ik hou van mantu.
  prs.a2.unit25.lesson01.teach.plane:
    title: Vliegtuig
    gloss: vliegtuig
    note: '*طیاره* is het Afghaanse woord voor een vliegtuig.'
    example_gloss: Het vliegtuig kwam aan in Kabul.
  prs.a2.unit25.lesson01.teach.travel:
    title: Reizen
    gloss: reizen
    note: '*سفر کردن* betekent reizen. Hoe je reist, zeg je met *با*: *با بس سفر کردن* is met de bus reizen.'
    example_gloss: Mijn vriend reisde met de bus.
  prs.a2.unit25.lesson01.teach.been_herat:
    title: Ik ben in Herat geweest
    gloss: Ik ben in Herat geweest.
    note: '*به* betekent naar. Dit is de eerste voltooid tegenwoordige tijd van deze unit: *رفته‌ام* zegt dat je ooit in je leven ergens bent geweest, zonder te zeggen wanneer.'
  prs.a2.unit25.lesson01.teach.formal_paradigm:
    title: 'De voltooid tegenwoordige tijd, schrijftaal: voltooid deelwoord plus uitgang'
    gloss: ik ben geweest, jij bent geweest, hij/zij is geweest, wij zijn geweest, u/jullie zijn geweest, zij zijn geweest
    note: 'De voltooid tegenwoordige tijd vertelt wat je tot nu toe wel of niet hebt gedaan in je leven, zonder te zeggen wanneer. Hij heeft twee delen. Eerst het voltooid deelwoord: neem de verleden stam en voeg *ه* toe. De verleden stam van *رفتن* (gaan) is *رفت*, dus het deelwoord is *رفته*. Dan volgt een korte uitgang die bij de persoon past: *رفته‌ام* (ik ben geweest), *رفته‌ای* (jij, tegen een vriend), *رفته است* (hij of zij is geweest), *رفته‌ایم* (wij), *رفته‌این* (u of jullie; *رفته‌اید* wordt ook geaccepteerd), *رفته‌اند* (zij). In geschreven vorm worden de uitgangen met een halve spatie aan het deelwoord vastgemaakt. Het voornaamwoord (*من، تو، او*) is optioneel, want de uitgang toont al de persoon. Dit is de formele schrijftaal, die je tegenkomt in brieven, nieuws en boeken.'
  prs.a2.unit25.lesson01.teach.spoken_paradigm:
    title: De voltooid tegenwoordige tijd, gesproken Kaboeli-vorm
    gloss: ik ben geweest, jij bent geweest, hij/zij is geweest, wij zijn geweest, u/jullie zijn geweest, zij zijn geweest
    note: 'In de alledaagse spreektaal van Kabul smelten het deelwoord en de uitgang samen tot één kort woord, gevormd uit de verleden stam: *رفتیم* (ik ben gegaan), *رفتی* (jij, tegen een vriend), *رفته* (hij of zij), *رفتیم* (wij), *رفتین* (jullie), *رفتن* (zij). De derde persoon enkelvoud is gewoon het kale deelwoord *رفته*. Pas op bij de eerste persoon: gesproken *رفتیم* (ik ben gegaan) is niet de gewone verleden tijd *رفتم* (ik ging); het eindigt op *-یم* en wordt hetzelfde geschreven als het meervoud *رفتیم* (wij zijn gegaan). De context maakt het onderscheid: *تا حال، هرگز، هنوز، قبلا* en een vraag naar ervaring wijzen op de voltooid tegenwoordige tijd (*تا حال رفتیم* = ik ben tot nu toe geweest), terwijl een genoemd tijdstip zoals *پارسال* of *دیروز* wijst op de gewone verleden tijd (*پارسال رفتم*). De formele vastgemaakte vormen (*رفته‌ام*) leer je ook, en deze cursus accepteert beide in elk antwoord: gebruik de vastgemaakte vormen als je formeel schrijft of spreekt, en de samengetrokken gesproken vormen met vrienden en familie. De uitgang voor jullie is in beide gevallen *-ین*: *رفته‌این* en *رفتین*.'
  prs.a2.unit25.lesson02.teach.participle_rule:
    title: 'Het voltooid deelwoord: verleden stam plus ه'
    gloss: geweest/gegaan, gegeten, gezien, gekookt, gedaan
    note: 'Eén regel geeft het deelwoord van bijna elk werkwoord: begin bij de infinitief, laat de *ن* weg voor de verleden stam en voeg *ه* toe. *رفتن* geeft *رفت* en dan *رفته* (geweest, gegaan). *خوردن* geeft *خورد* en *خورده* (gegeten). *دیدن* geeft *دید* en *دیده* (gezien). *پختن* geeft *پخت* en *پخته* (gekookt). *کردن* geeft *کرد* en *کرده* (gedaan, gemaakt). Het deelwoord verandert nooit per persoon; alleen de uitgang erachter verandert.'
  prs.a2.unit25.lesson02.teach.eat_paradigm:
    title: 'Dezelfde uitgangen, nieuw werkwoord: eten'
    gloss: ik heb gegeten, jij hebt gegeten, hij/zij heeft gegeten, wij hebben gegeten, u/jullie hebben gegeten, zij hebben gegeten
    note: 'De uitgangen die je met *رفته* hebt geleerd, werken bij elk deelwoord: *خورده‌ام، خورده‌ای، خورده است، خورده‌ایم، خورده‌این، خورده‌اند*. In spreektaal wordt hetzelfde deelwoord samengetrokken: *خوردیم، خوردی، خورده، خوردیم، خوردین، خوردن*. Om te zeggen dat je een film hebt gezien, kun je dus schrijven *فلم دیده‌ام* of zeggen *فلم دیدیم*.'
  prs.a2.unit25.lesson02.teach.spoken_more:
    title: Gesproken vormen van dezelfde werkwoorden
    gloss: ik heb gegeten, jij hebt gegeten, hij/zij heeft gegeten, jullie hebben gegeten, zij hebben gegeten; ik heb gezien, jij hebt gezien; ik heb gekookt, jij hebt gekookt; ik heb gedaan, jij hebt gedaan
    note: 'De gesproken vormen werken bij elk werkwoord hetzelfde: neem de verleden stam en voeg de uitgang toe. *خورد* geeft *خوردیم، خوردی، خورده، خوردین، خوردن*; *دید* geeft *دیدیم، دیدی*; *پخت* geeft *پختیم، پختی*; *کرد* geeft *کردیم، کردی*. Bedenk dat gesproken *خوردیم* (ik heb gegeten) niet de gewone verleden tijd *خوردم* (ik at) is; een woord als *تا حال* of *هرگز*, of het ontbreken van een genoemd tijdstip, wijst op de voltooid tegenwoordige tijd.'
  prs.a2.unit25.lesson02.teach.movie:
    title: Film
    gloss: film
    note: '*فلم* is het Afghaanse woord voor een film. Een film bekijk je met het werkwoord *دیدن*: *فلم دیدن* is naar een film kijken.'
    example_gloss: Gisteravond heb ik een film gekeken.
  prs.a2.unit25.lesson02.teach.kebab:
    title: Kebab
    gloss: kebab, gegrild vlees
    note: '*کباب* is gegrild vlees, een van de meest gewone gerechten die je in Afghanistan kunt proeven.'
    example_gloss: Gisteren heb ik kebab gegeten.
  prs.a2.unit25.lesson02.teach.mantu_qabili:
    title: Ik heb mantu en qabili palaw gegeten
    gloss: Ik heb mantu en qabili palaw gegeten.
    note: '*و* betekent en. Eén deelwoord aan het eind, *خورده‌ام*, geldt voor beide gerechten.'
  prs.a2.unit25.lesson02.teach.seen_herat:
    title: Ik heb Herat gezien
    gloss: Ik heb Herat gezien.
    note: '*را* staat achter iets bepaalds, zoals de naam van een stad, dat de handeling ondergaat: *هرات را* is de stad Herat. *دیده‌ام* is het deelwoord van *دیدن* plus *-ام*.'
  prs.a2.unit25.lesson02.teach.cooked:
    title: Ik heb qabili palaw gekookt
    gloss: Ik heb qabili palaw gekookt.
    note: '*پخته‌ام* is het deelwoord van *پختن* (koken) plus *-ام*. In spreektaal: *قابلی پلو پختیم*.'
  prs.a2.unit25.lesson03.teach.last_year:
    title: Vorig jaar
    gloss: vorig jaar
    note: '*پارسال* is vorig jaar. Zo''n woord legt de gebeurtenis vast op één moment, dus het werkwoord erna staat in de gewone verleden tijd, niet in de voltooid tegenwoordige tijd.'
    example_gloss: Vorig jaar ging ik naar Kabul.
  prs.a2.unit25.lesson03.teach.two_years_ago:
    title: Twee jaar geleden
    gloss: twee jaar geleden
    note: '*پیش* na een tijdsaanduiding betekent geleden: *دو سال پیش* is twee jaar geleden. Het is een ander tijdswoord dat de gewone verleden tijd vraagt.'
    example_gloss: Twee jaar geleden ging ik naar Mazar-i-Sharif.
  prs.a2.unit25.lesson03.teach.never:
    title: Nooit
    gloss: nooit, niet ooit
    note: '*هرگز* betekent nooit. Het gaat samen met een ontkennend werkwoord, dus de zin zegt nog steeds nee met de *ن*: *به بامیان هرگز نرفته‌ام* is ik ben nog nooit in Bamyan geweest.'
    example_gloss: Ik ben nog nooit in Bamyan geweest.
  prs.a2.unit25.lesson03.teach.never_alt:
    title: Nooit (een ander woord)
    gloss: nooit, op geen enkel moment
    note: '*هیچ‌وقت* betekent hier hetzelfde als *هرگز* en vraagt ook om een ontkennend werkwoord: *هیچ‌وقت فلم ندیده‌ام* is ik heb nog nooit een film gezien. Het is wat alledaagser dan *هرگز*.'
    example_gloss: Ik ben nog nooit in Bamyan geweest.
  prs.a2.unit25.lesson03.teach.neg_formal:
    title: 'De ontkenning: ن op het deelwoord'
    gloss: ik ben niet geweest, jij bent niet geweest, hij/zij is niet geweest, wij zijn niet geweest, u/jullie zijn niet geweest, zij zijn niet geweest
    note: 'Om te zeggen dat je iets niet hebt gedaan, zet je *ن* voor het deelwoord en houd je dezelfde uitgangen: *رفته‌ام* (ik ben geweest) wordt *نرفته‌ام* (ik ben niet geweest). De hele reeks is *نرفته‌ام، نرفته‌ای، نرفته است، نرفته‌ایم، نرفته‌این، نرفته‌اند*. De *ن* hoort bij het deelwoord, nooit bij de uitgang.'
  prs.a2.unit25.lesson03.teach.neg_spoken:
    title: De ontkenning in de spreektaal
    gloss: ik ben niet geweest, jij bent niet geweest, hij/zij is niet geweest, wij zijn niet geweest, u/jullie zijn niet geweest, zij zijn niet geweest
    note: 'De gesproken ontkenning werkt op dezelfde manier: de *ن* komt op de samengetrokken vorm: *نرفتیم، نرفتی، نرفته، نرفتیم، نرفتین، نرفتن*. Zowel *نرفته‌ام* als *نرفتیم* zijn juist en betekenen ik ben niet geweest. Verwar gesproken *نرفتیم* (ik ben niet geweest) niet met de ontkennende gewone verleden tijd *نرفتم* (ik ging niet): een genoemd tijdstip zoals *دیروز* hoort bij *نرفتم*.'
  prs.a2.unit25.lesson03.teach.neg_more:
    title: Dezelfde ن bij andere werkwoorden
    gloss: ik heb niet gegeten, ik heb niet gezien, ik heb niet gekookt, ik heb niet gedaan
    note: 'De regel is voor elk werkwoord hetzelfde: *نخورده‌ام* (ik heb niet gegeten), *ندیده‌ام* (ik heb niet gezien), *نپخته‌ام* (ik heb niet gekookt), *نکرده‌ام* (ik heb niet gedaan). Bij werkwoorden die bestaan uit een woord plus *کردن* komt de *ن* op *کرده*: *سفر نکرده‌ام* (ik heb niet gereisd), nooit *نسفر کرده‌ام*. Gesproken: *نخوردیم، ندیدیم، نپختیم، نکردیم*.'
  prs.a2.unit25.lesson03.teach.contrast:
    title: Voltooid tegenwoordige tijd of gewone verleden tijd?
    gloss: Vorig jaar ging ik naar Herat. / Ik ben in Herat geweest. / Ik ga naar Herat.
    note: 'Gebruik de gewone verleden tijd als je zegt wanneer iets gebeurde: *پارسال به هرات رفتم* (vorig jaar ging ik naar Herat) of *دو سال پیش رفتم*. Gebruik de voltooid tegenwoordige tijd als het tijdstip niet wordt genoemd en je alleen zegt dat het bij je ervaring hoort: *به هرات رفته‌ام* (ik ben in Herat geweest). De tegenwoordige tijd is weer iets anders: *به هرات می‌روم* (ik ga naar Herat). Een tijdswoord als *پارسال* of *دیروز* hoort dus bij *رفتم*, terwijl *تا حال* en *هرگز* bij *رفته‌ام* en *نرفته‌ام* horen.'
  prs.a2.unit25.lesson04.teach.already:
    title: Al, eerder
    gloss: al, eerder
    note: '*قبلا* betekent eerder of al. Het gaat samen met een bevestigende voltooid tegenwoordige tijd: *قبلا به هرات رفته‌ام* is ik ben al eens in Herat geweest.'
    example_gloss: Ik ben al eens in Herat geweest.
  prs.a2.unit25.lesson04.teach.not_yet:
    title: Nog niet, nog steeds
    gloss: nog (niet)
    note: '*هنوز* met een ontkennende voltooid tegenwoordige tijd betekent nog niet: *هنوز به هرات نرفته‌ام* is ik ben nog niet in Herat geweest.'
    example_gloss: Ik ben nog niet in Herat geweest.
  prs.a2.unit25.lesson04.teach.times:
    title: Eén keer, twee keer
    gloss: één keer, twee keer
    note: '*بار* is een keer, een gelegenheid. *یک بار* is één keer en *دو بار* is twee keer. Het getal staat voor *بار* en de zin gebruikt nog steeds de voltooid tegenwoordige tijd.'
    example_gloss:
    - Ik ben twee keer in Mazar-i-Sharif geweest.
    - Ik heb één keer met het vliegtuig gereisd.
  prs.a2.unit25.lesson04.teach.how_many:
    title: Hoe vaak ben je geweest?
    gloss: Hoe vaak ben je in Mazar-i-Sharif geweest?
    note: '*چند* betekent hoeveel. *چند بار* vraagt hoe vaak, en het antwoord is een getal plus *بار*: *دو بار*.'
  prs.a2.unit25.lesson04.teach.yes_no:
    title: Ja, nee
    gloss: ja, nee
    note: '*بلی* is ja en *نخیر* is het beleefde, alledaagse nee. Een kort antwoord herhaalt het deelwoord: *بلی، رفته‌ام* of *نخیر، نرفته‌ام*.'
    example_gloss:
    - Ja, ik ben in Herat geweest.
    - Nee, ik ben nog niet in Herat geweest.
  prs.a2.unit25.lesson04.teach.but:
    title: Maar
    gloss: maar
    note: '*ولی* verbindt iets wat je wel hebt gedaan met iets wat je niet hebt gedaan: *به مزار شریف رفته‌ام، ولی به هرات نرفته‌ام*.'
    example_gloss: Ik ben in Mazar-i-Sharif geweest, maar ik ben niet in Herat geweest.
  prs.a2.unit25.lesson04.teach.qa:
    title: Vragen en antwoorden over ervaring
    gloss: Ben je ooit in Herat geweest? Ja, dat ben ik. Nee, nog nooit.
    note: 'Om te vragen of iemand ooit iets heeft gedaan, gebruik je *آیا* en *تا حال* met de voltooid tegenwoordige tijd: *آیا تا حال به هرات رفته‌ای؟* Met een vriend kun je ook de gesproken vorm gebruiken: *آیا تا حال به هرات رفتی؟* Antwoord met *بلی* en het deelwoord (*بلی، رفته‌ام*) of met *نخیر* en de ontkenning (*نخیر، تا حال نرفته‌ام*). Je kunt erbij zeggen hoe vaak: *بلی، دو بار رفته‌ام*. Het vraagwoord *آیا* kun je in spreektaal weglaten als aan je stem te horen is dat het een vraag is.'
  prs.a2.unit25.lesson04.teach.adverbs:
    title: Al, nog niet, nooit
    gloss: Ik ben al geweest. Ik ben nog niet geweest. Ik ben nog nooit geweest.
    note: 'Drie kleine woorden antwoorden op de vraag of je iets al hebt gedaan. *قبلا رفته‌ام* betekent ik ben al geweest. *هنوز نرفته‌ام* betekent ik ben nog niet geweest, en dat suggereert dat je nog kunt gaan. *هرگز نرفته‌ام* betekent ik ben nog nooit geweest, zonder die suggestie. *قبلا* gaat met een bevestigend deelwoord; *هنوز* en *هرگز* gaan met een ontkennend deelwoord. Alle drie staan voor het deelwoord, meestal na de plaats: *به هرات هنوز نرفته‌ام*. De gesproken vormen werken op dezelfde manier: *هنوز نرفتیم*.'
  prs.a2.unit25.lesson05.teach.also:
    title: Ook
    gloss: ook
    note: '*هم* betekent ook. Het staat direct na datgene wat je toevoegt: *قابلی پلو هم پخته‌ام* is ik heb ook qabili palaw gekookt.'
    example_gloss: Ik heb ook qabili palaw gekookt.
  prs.a2.unit25.lesson05.teach.profile:
    title: Zarmina schrijft over haar ervaringen
    gloss: Ik ben Zarmina. Tot nu toe ben ik in Herat en Mazar-i-Sharif geweest, maar niet in Bamyan. Ik heb mantu en qabili palaw gegeten. Ik heb ook qabili palaw gekookt. Ik heb nog niet met het vliegtuig gereisd.
    note: 'Een kort geschreven profiel in de formele schrijftaal. Vier dingen die ze wel heeft gedaan en twee die ze niet heeft gedaan: *به بامیان نرفته‌ام* en *با طیاره سفر نکرده‌ام*.'
  prs.a2.unit25.lesson05.teach.ex_q:
    title: Homayoun vraagt Zarmina naar vliegen
    gloss: Zarmina, heb je ooit met het vliegtuig gereisd?
    note: Homayoun gebruikt met een vriendin de gesproken vorm *سفر کردی*. De vraag begint met *آیا تا حال*.
  prs.a2.unit25.lesson05.teach.ex_a:
    title: Zarmina zegt dat ze dat nog nooit heeft gedaan
    gloss: Nee, ik heb nog nooit met het vliegtuig gereisd. En jij?
    note: '*هرگز* staat voor het ontkennende deelwoord *نکردیم*. *تو چطور؟* is een korte manier om te vragen: en jij?'
  prs.a2.unit25.lesson05.teach.ex_a2:
    title: 'Homayoun antwoordt: één keer'
    gloss: Ja, ik heb één keer gereisd.
    note: '*بلی* antwoordt ja en *یک بار* zegt hoe vaak. De plaats wordt weggelaten omdat die uit de vraag duidelijk is.'
  prs.a2.unit25.lesson06.teach.turn01:
    title: Zarmina vraagt Homayoun naar Mazar-i-Sharif
    gloss: Homayoun, ben je ooit in Mazar-i-Sharif geweest?
    note: Zarmina gebruikt met een vriend de gesproken vorm *رفتی*. De vraag begint met *آیا تا حال*.
  prs.a2.unit25.lesson06.teach.turn02:
    title: Homayoun zegt twee keer, en dan nog niet
    gloss: Ja, ik ben twee keer geweest. Maar ik ben nog niet in Herat geweest. En jij?
    note: '*دو بار* zegt hoe vaak iets gebeurd is. *ولی هنوز به هرات نرفتیم* zet een plaats waar hij nog niet geweest is tegenover de plaats waar hij wel geweest is.'
  prs.a2.unit25.lesson06.teach.turn03:
    title: Zarmina vertelt over Herat en Bamyan
    gloss: Ik ben één keer in Herat geweest, maar in Bamyan ben ik nog nooit geweest.
    note: '*یک بار* is één keer en *به بامیان هرگز نرفتیم* betekent nooit. *هرگز* gaat samen met het ontkennende voltooid deelwoord.'
  prs.a2.unit25.lesson06.teach.turn04:
    title: Homayoun vraagt naar koken
    gloss: Heb je ooit qabili palaw gekookt?
    note: Een ja-neevraag over ervaring, met *تا حال* en de gesproken vorm *پختی*.
  prs.a2.unit25.lesson06.teach.turn05:
    title: Zarmina heeft het al eens gekookt
    gloss: Ja, dat heb ik al eens gekookt. En jij?
    note: '*قبلا پختیم* betekent: ik heb het al eerder gekookt. Het gerecht wordt weggelaten, omdat beide sprekers weten waarover het gaat.'
  prs.a2.unit25.lesson06.teach.turn06:
    title: Homayoun heeft het nog niet gekookt
    gloss: Nee, ik heb het nog niet gekookt. Maar ik heb het wel gegeten.
    note: '*هنوز نپختیم* betekent nog niet, met *ن* op het voltooid deelwoord. *ولی خوردیم* voegt toe wat hij wel gedaan heeft.'
  prs.a2.unit25.lesson06.teach.turn07:
    title: Zarmina reageert
    gloss: Wat fijn!
    note: '*چه خوب!* is een vriendelijke reactie op goed nieuws.'
exercises:
  prs.a2.unit25.lesson01.exercise01.recognize_been_herat:
    instruction: Wat betekent deze zin?
    correct_option: Ik ben in Herat geweest
    distractors:
    - Ik ga naar Herat
    - Ik ben nog nooit in Herat geweest
    - Hij is in Herat geweest
    accepted_answers:
    - value: Ik ben in Herat geweest
      status: correct
    feedback: '*رفته‌ام* is het voltooid deelwoord *رفته* plus de uitgang *-ام*: *به هرات رفته‌ام* betekent: ik ben in Herat geweest.'
  prs.a2.unit25.lesson01.exercise02.recognize_we_bamyan:
    instruction: Wat betekent deze zin?
    correct_option: Wij zijn in Bamyan geweest
    distractors:
