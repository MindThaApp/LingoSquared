    - Zij zijn in Bamyan geweest
    - Hij is in Bamyan geweest
    accepted_answers:
    - value: Wij zijn in Bamyan geweest
      status: correct
    feedback: 'De uitgang *-ایم* in *رفته‌ایم* betekent wij: *ما به بامیان رفته‌ایم* betekent: wij zijn in Bamyan geweest.'
  prs.a2.unit25.lesson01.exercise03.recognize_spoken_you:
    instruction: Wat betekent deze zin in de gesproken vorm?
    correct_option: Jij bent in Herat geweest (tegen een vriend)
    distractors:
    - Ik ben in Herat geweest
    - Hij is in Herat geweest
    - Wij zijn in Herat geweest
    accepted_answers:
    - value: Jij bent in Herat geweest (tegen een vriend)
      status: correct
    feedback: 'In de gesproken vorm is *-ی* de uitgang voor jij (vriend): *تو به هرات رفتی* betekent: jij bent in Herat geweest.'
  prs.a2.unit25.lesson01.exercise04.match_perfect_forms:
    instruction: Koppel elk Dari-woord aan de betekenis.
    accepted_answers:
