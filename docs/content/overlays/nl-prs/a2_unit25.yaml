    - left: رفته‌ایم
      right: wij zijn geweest
    - left: رفته‌این
      right: u bent geweest / jullie zijn geweest (beleefd of meervoud)
    - left: رفته‌اند
      right: zij zijn geweest
    - left: هرات
      right: Herat
    - left: بامیان
      right: Bamyan
    - left: مزار شریف
      right: Mazar-i-Sharif
  prs.a2.unit25.lesson01.exercise05.order_ever_herat:
