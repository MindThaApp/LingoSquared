teaching:
  prs.a1.unit04.lesson01.teach.one_to_three:
    title: Een, twee, drie
    gloss: 1, 2, 3
    note: یک، دو، سه zijn de basisgetallen in het Perzisch, gedeeld door Dari en Farsi.
    example_gloss:
    - Ik heb één broer.
    - Ik heb twee boeken.
    - Ik heb drie zussen.
  prs.a1.unit04.lesson01.teach.four_to_six:
    title: Vier, vijf, zes
    gloss: 4, 5, 6
    note: چهار is de standaard geschreven vorm; sommige sprekers verkorten het in informele spraak tot چار, maar in deze cursus gebruiken we de standaardspelling.
    example_gloss:
    - Ik heb vier boeken.
    - Wacht vijf minuten.
    - Hij/zij heeft zes boeken.
  prs.a1.unit04.lesson01.teach.seven_eight:
    title: Zeven, acht
    gloss: 7, 8
    note: هفت، هشت zetten de reeks voort.
    example_gloss:
    - Een week heeft zeven dagen.
    - Ik kom om acht uur.
  prs.a1.unit04.lesson01.teach.nine_ten:
    title: Negen, tien
    gloss: 9, 10
    note: نه، ده maken de getallen van een tot en met tien compleet.
    example_gloss:
    - Er zijn negen mensen in de klas.
    - Ik heb tien vingers.
  prs.a1.unit04.lesson02.teach.eleven_thirteen:
    title: Elf, twaalf, dertien
    gloss: 11, 12, 13
    note: یازده، دوازده، سیزده zijn aparte woorden en geen eenvoudige samenstellingen van de eenheden.
    example_gloss:
    - Ik heb om elf uur les.
    - Een jaar heeft twaalf maanden.
    - Hij/zij is dertien jaar oud.
  prs.a1.unit04.lesson02.teach.fourteen_sixteen:
    title: Veertien, vijftien, zestien
    gloss: 14, 15, 16
    note: چهارده، پانزده، شانزده zetten de getallen van dertien tot negentien voort.
    example_gloss:
    - Ik kom over veertien dagen.
    - Hij/zij heeft vijftien boeken.
    - Hij/zij is zestien jaar oud.
  prs.a1.unit04.lesson02.teach.seventeen_nineteen:
    title: Zeventien, achttien, negentien
    gloss: 17, 18, 19
    note: هفده، هجده، نوزده maken de reeks van dertien tot negentien compleet.
    example_gloss:
    - Hij/zij heeft zeventien boeken.
    - Hij/zij is achttien jaar oud.
    - Nog negentien dagen.
  prs.a1.unit04.lesson02.teach.twenty:
    title: Twintig
    gloss: '20'
    note: بیست opent de tientallen, die in de volgende les uitgebreid aan bod komen.
    example_gloss: Ik heb twintig boeken.
  prs.a1.unit04.lesson03.teach.twenty_thirty_forty:
    title: Twintig, dertig, veertig
    gloss: 20, 30, 40
    note: بیست، سی، چهل zijn de woorden voor de tientallen, elk een eigen vorm zonder voorspelbaar patroon.
    example_gloss:
    - Ik ben twintig jaar oud.
    - Deze maand heeft dertig dagen.
    - Hij/zij is veertig jaar oud.
  prs.a1.unit04.lesson03.teach.fifty_sixty:
    title: Vijftig, zestig
    gloss: 50, 60
    note: پنجاه en شصت zetten de tientallen voort.
    example_gloss:
    - Hij/zij heeft vijftig boeken.
    - Zestig minuten is één uur.
  prs.a1.unit04.lesson03.teach.seventy_eighty:
    title: Zeventig, tachtig
    gloss: 70, 80
    note: هفتاد en هشتاد zetten de tientallen voort.
    example_gloss:
    - Dit boek heeft zeventig bladzijden.
    - Hij/zij heeft tachtig boeken.
  prs.a1.unit04.lesson03.teach.ninety_hundred:
    title: Negentig, honderd
    gloss: 90, 100
    note: نود en صد maken de reeks tot honderd compleet.
    example_gloss:
    - Hij/zij is negentig jaar oud.
    - Hij/zij heeft honderd boeken.
  prs.a1.unit04.lesson03.teach.combining_tens:
    title: Tientallen en eenheden combineren
    gloss: 25 is letterlijk 'twintig en vijf'.
    note: Een tientalwoord en een eenhedenwoord worden verbonden met و (en), hetzelfde verbindingswoord dat elders in deze cursus wordt gebruikt, bijvoorbeeld in بیست و پنج (25).
  prs.a1.unit04.lesson04.teach.chand:
    title: Hoeveel
    gloss: hoeveel
    note: چند leidt een vraag over een hoeveelheid in, ook over leeftijd.
    example_gloss: Hoe oud bent u?
  prs.a1.unit04.lesson04.teach.sal_word:
    title: Jaar
    gloss: jaar
    note: سال gebruik je om een leeftijd te noemen, letterlijk 'jaren'.
    example_gloss: Ik ben twintig jaar oud.
  prs.a1.unit04.lesson04.teach.age_question_polite:
    title: Beleefd naar iemands leeftijd vragen
    gloss: Hoe oud ben je?
    note: چند ساله استین؟ vraagt letterlijk 'hoeveel jaar oud bent u' en gebruikt de respectvolle vorm استین voor iemand die je niet goed kent.
  prs.a1.unit04.lesson04.teach.age_question_informal:
    title: Naar de leeftijd van een goede vriend(in) vragen
    gloss: Hoe oud ben je?
    note: چند ساله استی؟ gebruikt de informele vorm استی; gebruik die alleen voor een goede vriend(in) of leeftijdsgenoot, volgens dezelfde regel voor beleefdheid als elders in deze cursus.
  prs.a1.unit04.lesson04.teach.age_answer:
    title: Je leeftijd zeggen
    gloss: Ik ben 25 jaar oud.
    note: بیست و پنج ساله استم combineert het getal, ساله (jaar oud) en استم.
  prs.a1.unit04.lesson05.teach.number_word:
    title: Nummer
    gloss: nummer
    note: نمبر is een veelgebruikt Afghaans alledaags woord (uit het Perzisch/Engels) voor een nummer, vooral een telefoonnummer.
    example_gloss: Dit is mijn telefoonnummer.
  prs.a1.unit04.lesson05.teach.telephone_word:
    title: Telefoon
    gloss: telefoon
    note: تلفن is het standaardwoord voor telefoon.
    example_gloss: Mijn telefoon is kapot.
  prs.a1.unit04.lesson05.teach.phone_question:
    title: Vraag om een telefoonnummer
    gloss: Wat is uw telefoonnummer?
    note: نمبر تلفن‌تان چند است؟ gebruikt hetzelfde چند-patroon als de leeftijdsvraag, nu voor een telefoonnummer.
  prs.a1.unit04.lesson05.teach.zero_word:
    title: Nul
    gloss: nul
    note: صفر heb je nodig om de meeste Afghaanse telefoonnummers uit te spreken.
    example_gloss: Nul is een getal.
  prs.a1.unit04.lesson05.teach.phone_answer:
    title: Je telefoonnummer geven
    gloss: Mijn telefoonnummer is 079-345-678.
    note: Afghaanse telefoonnummers worden meestal in korte groepjes uitgesproken in plaats van cijfer voor cijfer, zoals hier.
  prs.a1.unit04.lesson06.teach.turn01:
    title: Homayoun begroet Bashir
    gloss: Homayoun vraagt Bashir hoe het met hem gaat, in de informele vorm die bij een goede vriend past.
    note: جور استی؟ laat zien dat deze twee al goede vrienden zijn, dus de informele vorm past in de hele dialoog.
  prs.a1.unit04.lesson06.teach.turn02:
    title: Bashir antwoordt en vraagt naar Homayouns leeftijd
    gloss: Bashir zegt dat het goed met hem gaat en vraagt hoe oud Homayoun is.
    note: چند ساله استی؟ gebruikt de informele vorm, passend bij hun vriendschap.
  prs.a1.unit04.lesson06.teach.turn03:
    title: Homayoun antwoordt en stelt de vraag terug
    gloss: Homayoun zegt dat hij 28 is en stelt Bashir dezelfde vraag.
    note: Het patroon voor het antwoord op de leeftijdsvraag uit les 4 wordt hier rechtstreeks hergebruikt.
  prs.a1.unit04.lesson06.teach.turn04:
    title: Bashir antwoordt
    gloss: Bashir zegt dat hij 26 is.
    note: Dit rondt de uitwisseling over leeftijd af.
  prs.a1.unit04.lesson06.teach.turn05:
    title: Homayoun vraagt om Bashirs telefoonnummer
    gloss: Homayoun vraagt om Bashirs telefoonnummer.
    note: تلفنت gebruikt de informele bezitsuitgang, passend bij de rest van deze dialoog.
  prs.a1.unit04.lesson06.teach.turn06:
    title: Bashir geeft zijn telefoonnummer
    gloss: Bashir leest zijn telefoonnummer voor in groepjes.
    note: Het nummer wordt op dezelfde natuurlijke manier in groepjes uitgesproken als in het voorbeeld van les 5.
  prs.a1.unit04.lesson06.teach.turn07:
    title: Homayoun bevestigt dat hij het heeft opgeslagen
    gloss: Homayoun bedankt hem en zegt dat hij het meteen opslaat.
    note: سیف می‌کنم is een gangbaar informeel leenwoord uit de techniek, passend bij dit losse gesprek tussen vrienden.
