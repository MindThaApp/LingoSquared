      status: correct
    feedback: '*برای فرستادن نامه* betekent om een brief te versturen en *به پُسته خانه می‌روم* betekent ik ga naar het postkantoor.'
  prs.a2.unit36.lesson01.errands_and_for.exercise02.recognize_shopping:
    instruction: Wat betekent deze zin?
    correct_option: Ik ga naar de markt om boodschappen te doen
    distractors:
    - De markt is ver van huis
    - Ik ga niet naar de markt
    - Ik heb gisteren brood gekocht op de markt
    accepted_answers:
    - value: Ik ga naar de markt om boodschappen te doen
      status: correct
    feedback: '*برای خرید* betekent voor het winkelen. Met *به بازار می‌روم* betekent het: ik ga naar de markt om boodschappen te doen.'
  prs.a2.unit36.lesson01.errands_and_for.exercise03.match_errand_words:
    instruction: Koppel elk Dari-woord aan de betekenis.
