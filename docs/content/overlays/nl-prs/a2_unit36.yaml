course:
  title: Dari A2
  description: 'Dari uit Afghanistan, niveau lager-middelbaar: zeggen waarvoor je iets doet. Doel met برای plus een zelfstandig naamwoord of een infinitief, برای اینکه en تا plus de conjunctief, en de ontkenning (zodat ik niet ...), bij boodschappen, leren en geld sparen.'
units:
