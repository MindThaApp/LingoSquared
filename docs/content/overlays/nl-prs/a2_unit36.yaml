teaching:
  prs.a2.unit36.lesson01.errands_and_for.teach.friends:
    title: Faroezan en Arif
    gloss: Dit is Faroezan. Dit is Arif. Zij zijn vrienden.
    note: '*فروزان* en *عارف* zijn twee vrienden die in de gesprekken en voorbeelden van deze unit voorkomen. Faroezan is een vrouw en Arif is een man.'
  prs.a2.unit36.lesson01.errands_and_for.teach.post:
    title: Postkantoor
    gloss: postkantoor
    note: '*پُسته خانه* is het postkantoor. Daar ga je naartoe om een brief of een pakket te versturen.'
    example_gloss: Het postkantoor is dichtbij.
  prs.a2.unit36.lesson01.errands_and_for.teach.letter:
    title: Brief
    gloss: brief
    note: '*نامه* is een brief. Je verstuurt een brief met *را*: *نامه را می‌فرستم*.'
    example_gloss: De brief is op het postkantoor.
  prs.a2.unit36.lesson01.errands_and_for.teach.bank:
    title: Bank
    gloss: bank
    note: '*بانک* is een bank. Daar ga je naartoe om geld (*پول*) op te nemen of geld te storten.'
    example_gloss: De bank is op de markt.
  prs.a2.unit36.lesson01.errands_and_for.teach.send:
    title: Versturen
    gloss: sturen
    note: '*فرستادن* betekent versturen. Het is ook de infinitief die je na *برای* gebruikt: *برای فرستادن نامه* betekent om een brief te versturen.'
    example_gloss: Een brief versturen is makkelijk.
  prs.a2.unit36.lesson01.errands_and_for.teach.shopping:
    title: Winkelen
    gloss: boodschappen, inkopen
    note: '*خرید* zijn de boodschappen, de dingen die je koopt. *خرید دارم* betekent: ik moet boodschappen doen.'
    example_gloss: Vandaag heb ik veel boodschappen.
  prs.a2.unit36.lesson01.errands_and_for.teach.for_noun:
    title: 'برای + zelfstandig naamwoord: waarvoor je iets doet'
    gloss: Ik ga naar de markt om boodschappen te doen. Ik kom voor mijn werk naar Kabul. Ik ga naar huis om te rusten.
    note: 'Zet *برای* voor een zelfstandig naamwoord om te zeggen waarvoor je iets doet: *برای خرید* (voor boodschappen), *برای کار* (voor werk), *برای استراحت* (om te rusten). De plaats blijft met *به*: *به بازار می‌روم*. In het Nederlands zeg je vaak "voor" of "om te"; in het Dari geeft het zelfstandig naamwoord na *برای* al het doel aan.'
  prs.a2.unit36.lesson01.errands_and_for.teach.for_inf:
    title: 'برای + infinitief: om iets te doen'
    gloss: Om een brief te versturen ga ik naar het postkantoor. Om brood te kopen ga ik naar de winkel. Om geld te krijgen ga ik naar de bank.
    note: 'Om te zeggen waarom je iets doet, zet je de infinitief na *برای*: *فرستادن* (versturen), *خریدن* (kopen), *گرفتن* (nemen, krijgen). De infinitief eindigt op *ن*. Wat je verstuurt, koopt of neemt komt na de infinitief: *فرستادن نامه*, *خریدن نان*, *گرفتن پول*.'
  prs.a2.unit36.lesson01.errands_and_for.teach.order_question:
    title: Het doel kan ook achteraan staan; vragen waarvoor
    gloss: Ik ga naar de bank om geld te krijgen. Waarvoor ga je naar de bank?
    note: 'Het doel kan ook aan het eind staan: *به بانک می‌روم برای گرفتن پول*. Om te vragen waarvoor, zeg je *برای چه؟*: *برای چه به بانک می‌روی؟* betekent: waarvoor ga je naar de bank? Je antwoordt met *برای* en een zelfstandig naamwoord of een infinitief.'
  prs.a2.unit36.lesson01.errands_and_for.teach.sentence:
    title: Om een brief te versturen ga ik naar het postkantoor
    gloss: Om een brief te versturen ga ik naar het postkantoor.
    note: 'Dit is het patroon van de eerste les: eerst *برای* + infinitief, dan de plaats met *به*, en het werkwoord aan het eind.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.subj_form:
    title: 'De conjunctief: ب + presensstam + uitgang'
    gloss: dat ik koop, dat ik ga, dat ik neem, dat ik verstuur, dat ik lees, dat ik zie, dat ik kom, dat ik breng
    note: 'De conjunctief is de werkwoordsvorm die na *برای اینکه* en *تا* komt. Je maakt hem van de presensstam: zet *ب-* ervoor en voeg de persoonsuitgang toe. Voor ik is de uitgang *-م*: *بخرم* (dat ik koop), *بروم* (dat ik ga), *بگیرم* (dat ik neem). Het is dezelfde vorm als in *می‌خواهم بروم* en *باید بیایم*, die je al kent. Twee vormen worden anders gespeld en leer je het best zoals ze zijn: *بیایم* (van *آمدن*) en *بیاورم* (van *آوردن*).'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.subj_paradigm:
    title: De zes personen van de conjunctief
    gloss: dat ik koop, dat jij koopt, dat hij of zij koopt, dat wij kopen, dat u/jullie kopen (beleefd of meervoud), dat zij kopen
    note: 'De uitgangen zijn *-م، -ی، -د، -یم، -ین، -ند*. De uitgang voor u/jullie (beleefd of meervoud) is *-ین*, zoals overal in deze cursus. De conjunctief heeft geen *می‌*: vergelijk *می‌خرم* (ik koop) met *بخرم* (dat ik koop).'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.for_that:
    title: 'برای اینکه + conjunctief: zodat ik iets doe'
    gloss: Om brood te kopen ga ik naar de winkel. Om geld te krijgen ga ik naar de bank.
    note: '*برای اینکه* betekent "opdat" of "zodat". Het begint een bijzin met een eigen werkwoord in de conjunctief, en dat werkwoord toont de persoon: *برای اینکه نان بخرم* is "zodat ik brood koop". De hoofdzin zegt wat je doet. Waar het Nederlands vaak "om te kopen" zegt, zegt het Dari "zodat ik koop". De twee zinsdelen kunnen van plaats wisselen: *به دوکان می‌روم برای اینکه نان بخرم*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.more_verbs:
    title: Meer voorbeelden, en werkwoorden van twee woorden
    gloss: Om een brief te versturen ga ik naar het postkantoor. Om mijn vriend te zien ga ik naar Kabul. Om te sparen ga ik te voet.
    note: 'Dezelfde regel geldt voor elk werkwoord. Bij een werkwoord van twee woorden zoals *پس‌انداز کردن* verandert alleen het werkwoordsdeel en is er geen *ب-*: *پس‌انداز کنم* (dat ik spaar), *کار کنم* (dat ik werk). Wat je ziet of neemt zet je met *را* voor het werkwoord: *دوستم را ببینم*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.sentence:
    title: Om brood te kopen ga ik naar de winkel
    gloss: Om brood te kopen ga ik naar de winkel.
    note: 'Vergelijk met les 1: *برای خریدن نان* (infinitief) en *برای اینکه نان بخرم* (bijzin met conjunctief) zeggen hetzelfde.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.ta:
    title: 'تا + conjunctief: de korte vorm'
    gloss: Ik ga naar de winkel om brood te kopen. Ik ga naar de bank om geld te krijgen. Ik ga naar het postkantoor om een brief te versturen.
    note: '*تا* is een korte vorm van *برای اینکه*. Het komt na de hoofdzin en wordt gevolgd door een werkwoord in de conjunctief: *به دوکان می‌روم تا نان بخرم*. *تا* heeft ook andere betekenissen, bijvoorbeeld "tot" in *تا ساعت ده*. Volgt er een conjunctief met *ب-*, dan betekent het "zodat".'
  prs.a2.unit36.lesson03.ta_and_negative.teach.persons:
    title: 'Andere personen: wij, hij, zij'
    gloss: Wij gaan om brood te kopen. Hij gaat om een brief te versturen. Zij gaan om geld te krijgen.
    note: 'Beide werkwoorden staan in dezelfde persoon als het onderwerp hetzelfde is: *می‌رویم* en *بخریم* eindigen allebei op *-یم* (wij). De uitgangen van de conjunctief zijn *-م، -ی، -د، -یم، -ین، -ند*, dus *بفرستد* is "dat hij of zij verstuurt" en *بگیرند* is "dat zij nemen".'
  prs.a2.unit36.lesson03.ta_and_negative.teach.negative:
    title: 'De ontkenning: ن + stam'
    gloss: Ik ga vroeg weg zodat ik niet te laat kom. Zodat ik niet te laat kom, ga ik vroeg weg.
    note: 'Om te zeggen wat je wilt vermijden, zet je *ن-* voor de stam en laat je *ب-* weg: *برسم* (dat ik aankom) wordt *نرسم* (dat ik niet aankom). De hoofdzin zegt wat je doet om het te vermijden: *زود می‌روم*.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.negative_two_word:
    title: De ontkenning van werkwoorden van twee woorden
    gloss: Ik zet mijn geld op de bank zodat ik het niet kwijtraak.
    note: 'Bij een werkwoord van twee woorden komt *ن-* op het werkwoordsdeel: *گم کنم* (dat ik kwijtraak) wordt *گم نکنم* (dat ik niet kwijtraak). *آن را* (het) verwijst terug naar het geld.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.sentence:
    title: Ik ga vroeg weg zodat ik niet te laat kom
    gloss: Ik ga vroeg weg zodat ik niet te laat kom.
    note: '*تا دیر نرسم* noemt wat je niet wilt, en *زود می‌روم* is wat je eraan doet.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.lesson:
    title: Les, studeren
    gloss: les, lesuur
    note: '*درس* is een les of een lesuur. Met *خواندن* betekent het studeren: *درس خواندن*.'
    example_gloss: De Engelse les is om vier uur.
  prs.a2.unit36.lesson04.learning_and_saving.teach.exam:
    title: Examen
    gloss: examen, toets
    note: '*امتحان* is een examen. Je doet het examen en krijgt een cijfer (*نمبر*).'
    example_gloss: Het examen is morgen.
  prs.a2.unit36.lesson04.learning_and_saving.teach.learn:
    title: Leren
    gloss: leren
    note: '*یاد گرفتن* betekent leren. *یاد* is het eerste deel en *گرفتن* is het werkwoord. De conjunctief voor ik is *یاد بگیرم*, met *ب-* voor *گیر*.'
    example_gloss: Ik leer Engels.
  prs.a2.unit36.lesson04.learning_and_saving.teach.study:
    title: Studeren
    gloss: studeren
    note: '*درس خواندن* betekent studeren. *می‌خوانم* is "ik lees" of "ik studeer". De les blijft vooraan staan, zoals in *درس می‌خوانم*.'
    example_gloss: Elke avond studeer ik.
  prs.a2.unit36.lesson04.learning_and_saving.teach.expensive:
    title: Duur
    gloss: duur
    note: '*گران* betekent duur. Het tegenovergestelde is *ارزان* (goedkoop).'
    example_gloss: De cursus is duur.
  prs.a2.unit36.lesson04.learning_and_saving.teach.cheap:
    title: Goedkoop
    gloss: goedkoop
    note: '*ارزان* betekent goedkoop. Dingen die *ارزان* zijn, helpen je geld te sparen.'
    example_gloss: De fiets is goedkoop.
  prs.a2.unit36.lesson04.learning_and_saving.teach.spend:
    title: Geld uitgeven
    gloss: uitgeven (geld)
    note: '*خرج کردن* betekent geld uitgeven. De ontkenning van het werkwoord van twee woorden zet *ن* voor *کردن*: *خرج نکنم* (dat ik niet uitgeef).'
    example_gloss: Ik geef niet veel geld uit.
  prs.a2.unit36.lesson04.learning_and_saving.teach.for_noun2:
    title: برای + zelfstandig naamwoord met woorden over leren en sparen
    gloss: Ik studeer voor het examen. Ik spaar geld voor de cursus.
    note: 'Het patroon uit les 1 werkt ook met deze woorden: *برای امتحان* (voor het examen), *برای کورس* (voor de cursus). Een zelfstandig naamwoord na *برای* is een korte manier om te zeggen waarvoor je iets doet.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.learn_clause:
    title: Doelzinnen over leren
    gloss: Om Engels te leren lees ik elke avond een boek. Om een goed cijfer voor het examen te halen studeer ik veel.
    note: 'Gebruik *برای اینکه* of *تا* met een werkwoord in de conjunctief om te zeggen waarom je studeert: *یاد بگیرم* (dat ik leer), *نمبر خوب بگیرم* (dat ik een goed cijfer haal). Beide zinsdelen kunnen in elke volgorde staan.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.save_clause:
    title: Doelzinnen over geld sparen
    gloss: Ik spaar om een fiets te kopen. Ik koop een goedkoop boek zodat ik niet veel geld uitgeef.
    note: Bij geld sparen zegt de hoofdzin wat je doet en de *تا*-bijzin waarvoor. De ontkenning *خرج نکنم* zegt wat je niet wilt dat er gebeurt.
  prs.a2.unit36.lesson04.learning_and_saving.teach.sentence:
    title: Ik spaar zodat ik een fiets koop
    gloss: Ik spaar geld om een fiets te kopen.
    note: Een korte zin die eerst de handeling noemt en het doel als laatste.
  prs.a2.unit36.lesson05.reading_and_listening.teach.narges:
    title: Fozia
    gloss: Fozia is een vriendin van Faroezan.
    note: '*فوزیه* is een derde vriendin. Zij schrijft het bericht in deze les. Zij is niet dezelfde persoon als Faroezan.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.fare:
    title: 'Het ritgeld betalen: کرایه دادن'
    gloss: Ik betaal het ritgeld. Ik betaal het ritgeld niet. Zodat ik het ritgeld niet hoef te betalen, ga ik te voet.
    note: '*کرایه دادن* is het ritgeld betalen voor een taxi of een bus. De tegenwoordige tijd is *می‌دهم*, de ontkenning is *نمی‌دهم* en de ontkennende conjunctief is *ندهم* (dat ik niet geef). *پیاده می‌روم* betekent: ik ga te voet.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn01:
    title: Faroezan vraagt waar Arif naartoe gaat
    gloss: Arif, waar ga je vandaag naartoe?
    note: Faroezan vraagt *به کجا می‌روی؟* met de tegenwoordige tijd *می‌روی*. Hij is een vriend, dus gebruikt ze *تو*.
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn02:
    title: Arif noemt twee boodschappen
    gloss: Eerst ga ik naar het postkantoor om deze brief te versturen. Daarna ga ik naar de bank.
    note: 'De eerste boodschap heeft een doel: *تا این نامه را بفرستم*. *اول* en *بعد* zetten de twee boodschappen op volgorde.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn03:
    title: Faroozan vraagt naar de bank
    gloss: Wat moet je bij de bank doen?
    note: '*چه کار داری؟* vraagt wat je ergens te doen hebt.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn04:
    title: Arif zegt waarvoor
    gloss: Ik ga geld opnemen.
    note: Het korte antwoord *می‌روم تا پول بگیرم* geeft het doel aan met *تا* en de subjunctief *بگیرم*.
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn05:
    title: Faroozan vraagt hoe hij gaat
    gloss: Ga je met de auto?
    note: '*با موتر* betekent met de auto.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn06:
    title: Arif loopt om het vervoersgeld te besparen
    gloss: Nee, ik loop, zodat ik geen vervoersgeld hoef te betalen.
    note: '*نخیر* betekent nee. *تا کرایه ندهم* is het negatieve doel: hij loopt om geld te besparen.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.message:
    title: Een bericht over sparen
    gloss: Hallo Faroozan. Ik spaar elke maand tweeduizend afghani om een fiets te kopen. Om geen vervoersgeld te hoeven betalen, wil ik met de fiets naar school gaan. Morgen ga ik naar de bank om mijn geld op te nemen. Fozia
    note: 'Een kort bericht met drie doelen: *تا یک بایسکل بخرم* (om een fiets te kopen), *برای اینکه کرایه ندهم* (om geen vervoersgeld te betalen) en *تا پولم را بگیرم* (om haar geld op te nemen). Fozia gebruikt de gewone tegenwoordige tijd *می‌روم* met *فردا* voor haar plan.'
  prs.a2.unit36.lesson06.english_conversation.teach.give_book:
    title: 'Twee verschillende onderwerpen: ik geef, zodat jij niet uitgeeft'
    gloss: Ik geef je mijn boek. Ik geef je mijn boek, zodat jij geen geld uitgeeft.
    note: 'De twee werkwoorden kunnen een verschillend onderwerp hebben. In *کتابم را به تو می‌دهم تا پول خرج نکنی* is degene die geeft ik (*می‌دهم*) en degene die geen geld uitgeeft jij (*نکنی*). De subjunctief komt overeen met zijn eigen onderwerp: *-ی* voor jij.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn01:
    title: Arif vraagt waarom Faroozan elke avond leest
    gloss: Faroozan, waarom lees je elke avond een boek?
    note: '*می‌خوانی* betekent jij leest. *چرا* vraagt waarom en nodigt uit tot een reden of een doel.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn02:
    title: Faroozan zegt waarvoor ze studeert
    gloss: Om Engels te leren.
    note: 'Een kort antwoord dat alleen uit een doelbijzin bestaat: *برای اینکه انگلیسی یاد بگیرم*. De hoofdzin blijft weg, omdat de vraag die al gaf.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn03:
    title: Arif vraagt naar het diepere doel
    gloss: Waarvoor dan?
    note: '*برای چه؟* vraagt naar het volgende doel achter het eerste.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn04:
    title: Faroozan noemt het volgende doel
    gloss: Zodat ik een goed cijfer haal voor het examen.
    note: '*تا در امتحان نمبر خوب بگیرم* is een zelfstandige *تا*-bijzin. *نمبر* is het cijfer.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn05:
    title: Arif wil ook studeren
    gloss: Ik wil ook Engels leren, maar de cursus is duur.
    note: '*می‌خواهم انگلیسی بخوانم* gebruikt de subjunctief *بخوانم* na *می‌خواهم*.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn06:
    title: Faroozan biedt haar boek aan
    gloss: Ik geef je mijn boek, zodat jij geen geld uitgeeft.
    note: '*تا پول خرج نکنی* heeft een ander onderwerp dan het hoofdwerkwoord: het boek wordt door mij gegeven, het geld wordt door jou niet uitgegeven.'
