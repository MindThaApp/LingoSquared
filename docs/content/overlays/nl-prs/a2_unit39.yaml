course:
  title: Dari A2
  description: 'Afghaans Dari voor lager gevorderden: een eenvoudige boodschap doorgeven in de tegenwoordige tijd met می‌گوید که, می‌پرسد که en می‌خواهد که + subjunctief, met telefoonberichten en notities.'
units:
  prs.a2.unit39.passing_message:
    title: Een boodschap doorgeven
lessons:
  prs.a2.unit39.lesson01.he_says_that:
    title: Hij zegt dat ...
  prs.a2.unit39.lesson02.he_asks_that:
    title: Hij vraagt of ...
  prs.a2.unit39.lesson03.he_wants_that:
    title: Hij wil dat ...
  prs.a2.unit39.lesson04.messages_and_notes:
    title: Berichten en notities
  prs.a2.unit39.lesson05.reading_and_listening:
    title: Lezen en luisteren over berichten
  prs.a2.unit39.lesson06.office_conversation:
    title: Een gesprek op kantoor
teaching:
  prs.a2.unit39.lesson01.teach.message:
    title: Bericht
    gloss: bericht
    note: '*پیام* is een bericht, bijvoorbeeld een telefoonbericht of een sms. In deze unit geef je een boodschap door: je vertelt een tweede persoon wat een eerste persoon zei, vroeg of wilde.'
    example_gloss: Ik heb een bericht voor u.
  prs.a2.unit39.lesson01.teach.says:
    title: Hij of zij zegt
    gloss: hij zegt, zij zegt
    note: '*می‌گوید* betekent ''hij of zij zegt'', de tegenwoordige tijd van *گفتن*. *می‌گویم* (ik zeg) ken je al. De uitgang *-د* is de uitgang voor hij, zij of het, net als in *می‌آید*.'
    example_gloss: Hij of zij zegt dat hij of zij morgen komt.
  prs.a2.unit39.lesson01.teach.pattern:
    title: 'Doorgeven wat iemand zegt: می‌گوید که + mededeling'
    gloss: De manager zegt dat de vergadering om tien uur is. Hij zegt dat hij morgen komt.
    note: 'Om door te geven wat iemand nu zegt, gebruik je *می‌گوید که* en dan de mededeling. *که* betekent ''dat''. De mededeling blijft in de tegenwoordige tijd: *جلسه ساعت ده است*. In deze unit geef je alleen boodschappen in de tegenwoordige tijd door. Boodschappen in de verleden tijd volgen later in de cursus.'
  prs.a2.unit39.lesson01.teach.person:
    title: Ik wordt hij of zij als je het doorgeeft
    gloss: 'Mina: Ik kom morgen. Mina zegt dat ze morgen komt.'
    note: 'Als Mina zegt *من فردا می‌آیم* (ik kom morgen) en jij geeft dat door, verandert de persoon: Mina is voor jou nu *او* (zij), dus de werkwoordsuitgang verandert van *-م* in *-د*: *مینا می‌گوید که فردا می‌آید*. Het woord *او* mag weg, want de uitgang laat al zien wie het is.'
  prs.a2.unit39.lesson01.teach.they_say:
    title: Zij zeggen
    gloss: zij zeggen
    note: '*می‌گویند* betekent ''zij zeggen''. Voeg *-ند* toe aan de stam: *می‌گویند* is de vorm van *می‌گوید* bij *آن‌ها*.'
    example_gloss: Ze zeggen dat de vergadering om tien uur is.
  prs.a2.unit39.lesson01.teach.hashmat:
    title: Hashmat zegt dat Mina morgen komt
    gloss: Hashmat zegt dat Mina morgen komt.
    note: Hier zijn de persoon die het zegt (*حشمت*) en de persoon die komt (*مینا*) verschillend, en de zin noemt allebei. Controleer bij elk bericht wie het zegt en wie er komt.
  prs.a2.unit39.lesson02.teach.asks:
    title: Hij of zij vraagt
    gloss: hij vraagt, zij vraagt
    note: '*می‌پرسد* betekent ''hij of zij vraagt'', de tegenwoordige tijd van *پرسیدن*. Het heeft dezelfde uitgang *-د* als *می‌گوید*.'
    example_gloss: Hij of zij vraagt waar de manager is.
  prs.a2.unit39.lesson02.teach.wh:
    title: 'Een vraag doorgeven: می‌پرسد که + vraag'
    gloss: Hashmat vraagt waar je bent. Mina vraagt hoe laat het is.
    note: Om een vraag door te geven gebruik je *می‌پرسد که* en dan de vraag met het vraagwoord (*کجا*, *ساعت چند*, *چه*, *کی*, *چرا*). De woordvolgorde van de vraag verandert niet. *استی* betekent 'je bent' (tegen een vriend), de vorm van *است* bij *تو*. Als je het zegt tegen de persoon aan wie de vraag gesteld is, blijft *تو* gewoon *تو*.
  prs.a2.unit39.lesson02.teach.yesno:
    title: Een ja-neevraag doorgeven
    gloss: Hij of zij vraagt of je morgen komt.
    note: 'In deze unit houden we de vraag zoals hij gesteld is, zonder extra woordje (je kunt ook *آیا* of *یا نه* toevoegen, zoals in unit 38). Een ja-neevraag geef je door met *می‌پرسد که*: *او می‌پرسد که تو فردا می‌آیی*. Het antwoord is *بلی* of *نخیر*. *می‌آیی* betekent ''je komt'' (tegen een vriend), de vorm van *می‌آید* bij *تو*.'
  prs.a2.unit39.lesson02.teach.id:
    title: De manager vraagt of jij een identiteitskaart hebt
    gloss: De manager vraagt of je een ID-kaart hebt.
    note: Nog een ja-neevraag. *تذکره* is de Afghaanse ID-kaart en *داری* betekent 'je hebt'.
  prs.a2.unit39.lesson02.teach.person:
    title: Wie er gevraagd wordt, bepaalt het voornaamwoord
    gloss: Mina vraagt waar je bent. Mina vraagt waar Hashmat is.
    note: 'Mina vraagt aan Hashmat: *تو کجا استی؟* (Waar ben je?). Als je het aan Hashmat vertelt, zeg je *مینا می‌پرسد که تو کجا استی* en blijft *تو* staan. Vertel je het aan iemand anders, dan wordt Hashmat de derde persoon: *مینا می‌پرسد که حشمت کجا است*.'
  prs.a2.unit39.lesson03.teach.pattern:
    title: 'Een wens doorgeven: می‌خواهد که + subjunctief'
    gloss: Hij of zij wil dat je komt. Hij of zij wil dat ik ga.
    note: 'Om door te geven wat iemand wil dat een ander doet, gebruik je *می‌خواهد که* en dan de subjunctief: *او می‌خواهد که تو بیایی* (hij of zij wil dat je komt). De subjunctief is dezelfde vorm die je na *باید* gebruikt en in *بروم* (dat ik ga). Het is niet de tegenwoordige tijd met *می‌*: in *بیایی* staat geen *می‌*.'
  prs.a2.unit39.lesson03.teach.go:
    title: De subjunctief van رفتن
    gloss: dat ik ga, dat jij gaat, dat hij of zij gaat, dat wij gaan, dat u gaat of jullie gaan, dat zij gaan
    note: 'De subjunctief is *ب* plus de tegenwoordige stam plus de uitgang: *ب + رو + م* geeft *بروم*. De uitgangen zijn *-م، -ی، -د، -یم، -ین، -ند*. Dus: *بروم، بروی، برود، برویم، بروین، بروند*. *بروم* ken je al; deze kaart voegt de andere vormen toe.'
  prs.a2.unit39.lesson03.teach.come:
    title: De subjunctief van آمدن
    gloss: dat ik kom, dat jij komt, dat hij of zij komt, dat wij komen, dat u komt of jullie komen, dat zij komen
    note: '*آمدن* is onregelmatig: de subjunctiefstam is *بیای-*. De uitgangen zijn hetzelfde: *بیایم، بیایی، بیاید، بیاییم، بیایین، بیایند*. *بیایم* en *بیایین* ken je al.'
  prs.a2.unit39.lesson03.teach.do:
    title: De subjunctief van کردن en آوردن
    gloss: dat ik doe, dat jij doet, dat hij of zij doet, dat wij doen, dat u doet of jullie doen, dat zij doen. dat ik breng, dat jij brengt, dat hij of zij brengt.
    note: '*کردن* heeft geen *ب*: *کنم، کنی، کند، کنیم، کنین، کنند*. Dus *تیلفون کردن* wordt *تیلفون کنی* (dat je belt). *آوردن* werkt als *آمدن*, met *بیاور-*: *بیاورم، بیاوری، بیاورد*.'
  prs.a2.unit39.lesson03.teach.tell:
    title: De subjunctief van گفتن
    gloss: dat ik zeg, dat jij zegt, dat hij of zij zegt
    note: '*گفتن* heeft in de subjunctief de stam *گوی-*: *بگویم، بگویی، بگوید*. Het patroon is *ب* plus stam plus uitgang, zoals bij *بروم*.'
  prs.a2.unit39.lesson03.teach.phone:
    title: De manager wil dat je belt
    gloss: De manager wil dat je belt.
    note: Degene die iets wil is *مدیر*, degene die moet handelen is *تو*, en het werkwoord na *که* is *کنی*.
  prs.a2.unit39.lesson03.teach.computer:
    title: Hij of zij wil dat jij de computer meebrengt
    gloss: Hij of zij wil dat je de computer meebrengt.
    note: '*را* staat achter datgene wat meegebracht wordt, zoals in elke zin met een lijdend voorwerp.'
  prs.a2.unit39.lesson03.teach.same:
    title: Dezelfde subjunctief als de wensende persoon zelf gaat
    gloss: Ik wil gaan. Hij of zij wil gaan.
    note: 'Als degene die iets wil en degene die handelt dezelfde persoon zijn, wordt ook de subjunctief gebruikt: *من می‌خواهم که بروم*. Gebruik de passende uitgang: *-م* voor ik, *-د* voor hij of zij. In deze unit geef je meestal een wens door die over iemand anders gaat, zoals in *او می‌خواهد که تو بیایی*.'
  prs.a2.unit39.lesson04.teach.note:
    title: Notitie
    gloss: notitie, memo
    note: '*یادداشت* is een kort geschreven briefje, bijvoorbeeld een briefje op een tafel of een deur. Het is ook een manier om een boodschap door te geven als iemand er niet is.'
    example_gloss: De notitie ligt op kantoor.
  prs.a2.unit39.lesson04.teach.writes:
    title: Hij of zij schrijft
    gloss: hij schrijft, zij schrijft
    note: '*می‌نویسد* betekent ''hij of zij schrijft'', de tegenwoordige tijd van *نوشتن*. *می‌نویسم* is ''ik schrijf''.'
    example_gloss: Hashmat schrijft een briefje.
  prs.a2.unit39.lesson04.teach.sends:
    title: Hij of zij stuurt
    gloss: hij stuurt, zij stuurt
    note: '*می‌فرستد* betekent ''hij of zij stuurt''. *می‌فرستم* (ik stuur) ken je al.'
    example_gloss: De manager stuurt een bericht.
  prs.a2.unit39.lesson04.teach.written:
    title: 'Een schriftelijke boodschap: می‌نویسد که'
    gloss: In de notitie schrijft hij of zij dat de vergadering om negen uur is.
    note: 'Een schriftelijke boodschap geef je op dezelfde manier door als een mondelinge: *می‌نویسد که* en dan de mededeling. *در یادداشت* betekent ''in de notitie''. De volgorde is hetzelfde als bij *می‌گوید که*.'
  prs.a2.unit39.lesson04.teach.tell_him:
    title: 'Zeggen aan wie je het vertelt: به'
    gloss: Ik zeg tegen hem of haar dat de vergadering om negen uur is. De manager zegt tegen Mina dat de vergadering morgen is.
    note: 'Zet *به* en de luisteraar voor het werkwoord om te zeggen aan wie het verteld wordt: *به او می‌گویم* (ik zeg tegen hem of haar), *به مینا می‌گوید* (hij zegt tegen Mina). De rest van het patroon blijft: *که* en dan de boodschap.'
  prs.a2.unit39.lesson04.teach.phone_says:
    title: Hij of zij belt en zegt dat hij of zij morgen komt
    gloss: Hij of zij belt en zegt dat hij of zij morgen komt.
    note: 'Een telefoonbericht heeft vaak twee werkwoorden achter elkaar: *تیلفون می‌کند* (belt) en *می‌گوید که ...* (zegt dat ...), verbonden met *و*.'
  prs.a2.unit39.lesson04.teach.i_write:
    title: Ik schrijf een briefje
    gloss: Ik schrijf een briefje.
    note: Je schrijft een briefje als je de boodschap niet persoonlijk kunt doorgeven.
  prs.a2.unit39.lesson05.teach.not_come:
    title: Hij of zij komt niet
    gloss: hij komt niet, zij komt niet
    note: '*نمی‌آید* betekent ''hij of zij komt niet'': *ن* voor *می‌آید*. *نمی‌روم* (ik ga niet) ken je al.'
    example_gloss: Hij of zij komt morgen niet.
  prs.a2.unit39.lesson05.teach.call_turn01:
    title: Beurt 1
    gloss: Hashmat, wie heeft er gebeld?
    note: Mina komt thuis en vraagt wie er gebeld heeft.
  prs.a2.unit39.lesson05.teach.call_turn02:
    title: Beurt 2
    gloss: De manager heeft gebeld. Hij zegt dat de vergadering morgen om negen uur is.
    note: Hashmat antwoordt en geeft het eerste deel van de boodschap door met *می‌گوید که*.
  prs.a2.unit39.lesson05.teach.call_turn03:
    title: Beurt 3
    gloss: Om negen uur? Wat zegt hij nog meer?
    note: Mina vraagt om meer. *چه می‌گوید* betekent 'wat zegt hij'.
  prs.a2.unit39.lesson05.teach.call_turn04:
    title: Beurt 4
    gloss: Hij vraagt of je morgen komt. En hij wil dat je de computer meebrengt.
    note: 'Nog twee delen van de boodschap: een vraag met *می‌پرسد که* en een wens met *می‌خواهد که* en de subjunctief *بیاوری*.'
  prs.a2.unit39.lesson05.teach.call_turn05:
    title: Beurt 5
    gloss: Ja, ik kom morgen en ik breng de computer mee.
    note: Mina beantwoordt de vraag en de wens in de eerste persoon.
  prs.a2.unit39.lesson05.teach.call_turn06:
    title: Beurt 6
    gloss: Goed. Dan bel ik hem.
    note: Hashmat geeft Mina's antwoord telefonisch door. *به او تیلفون می‌کنم* betekent 'ik bel hem'.
  prs.a2.unit39.lesson05.teach.note_read:
    title: Een briefje van Hashmat
    gloss: Hallo Mina. Vandaag om vier uur heeft je vriend gebeld. Hij of zij zegt dat hij of zij morgen niet komt, vanwege werk. Hij of zij vraagt of je vrijdag tijd hebt. Hij of zij wil dat je hem of haar belt. Het nummer staat in dit briefje. Hashmat
    note: 'Een schriftelijke boodschap die een telefoongesprek doorgeeft, met de drie werkwoorden van deze unit: *می‌گوید که*, *می‌پرسد که* en *می‌خواهد که*. Het telefoontje van de vriend is een ander telefoontje dan dat van de manager in het gesprek.'
  prs.a2.unit39.lesson06.teach.office_turn01:
    title: Beurt 1
    gloss: Rahila, ik heb een bericht voor je.
    note: 'Behzad begint: hij heeft een boodschap door te geven.'
  prs.a2.unit39.lesson06.teach.office_turn02:
    title: Beurt 2
    gloss: Van wie is het?
    note: Rahila vraagt van wie het bericht is.
  prs.a2.unit39.lesson06.teach.office_turn03:
    title: Beurt 3
    gloss: Van het kantoor van de dokter. Een medewerker heeft gebeld. Hij of zij zegt dat je afspraak donderdag om twee uur is.
    note: Behzad geeft het eerste deel door met *می‌گوید که*.
  prs.a2.unit39.lesson06.teach.office_turn04:
    title: Beurt 4
    gloss: Donderdag om twee uur? Wat zegt hij of zij nog meer?
    note: Rahila vraagt naar de rest.
  prs.a2.unit39.lesson06.teach.office_turn05:
    title: Beurt 5
    gloss: Hij of zij vraagt of je een identiteitskaart hebt. En hij of zij wil dat je om één uur komt.
    note: Een vraag met *می‌پرسد که* en een wens met *می‌خواهد که* plus de subjunctief *بیایی*.
  prs.a2.unit39.lesson06.teach.office_turn06:
    title: Beurt 6
    gloss: Ja, die heb ik. Ik schrijf een briefje. Hartelijk bedankt.
    note: Rahila beantwoordt de vraag, zegt dat ze een briefje schrijft zodat ze het niet vergeet, en bedankt Behzad.
  prs.a2.unit39.lesson06.teach.summary:
    title: Drie werkwoorden, drie soorten berichten
    gloss: Hij of zij zegt dat de afspraak donderdag is. Hij of zij vraagt of je een identiteitskaart hebt. Hij of zij wil dat je om één uur komt.
    note: Een bericht bevat meestal een mededeling, een vraag of een wens. Na *می‌گوید که* volgt een mededeling, na *می‌پرسد که* een vraag en na *می‌خواهد که* de subjunctief. Aan de uitgang van het werkwoord zie je wie er spreekt, en het bericht blijft in de tegenwoordige tijd.
