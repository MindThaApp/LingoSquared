course:
  title: Dari in het Nederlands A1
  description: 'Dari (Afghanistan) voor beginners: veelvoorkomende plekken in de stad benoemen, vragen waar iets is, eenvoudig antwoord geven over locaties en basisaanwijzingen volgen naar een plek.'
