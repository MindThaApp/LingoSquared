teaching:
  prs.a1.unit05.lesson01.teach.bazaar:
    title: Markt
    gloss: markt / bazaar
    note: بازار is het gewone woord voor een marktgebied, vaak een hele straat of wijk met winkels.
    example_gloss: De bazaar is dichtbij.
  prs.a1.unit05.lesson01.teach.bank:
    title: Bank
    gloss: bank
    note: بانک is een directe leenwoord en wordt net zo gebruikt als het Nederlandse 'bank'.
    example_gloss: Waar is de bank?
  prs.a1.unit05.lesson01.teach.mosque:
    title: Moskee
    gloss: moskee
    note: مسجد is het standaardwoord voor een moskee.
    example_gloss: De moskee is groot.
  prs.a1.unit05.lesson01.teach.hospital:
    title: Ziekenhuis
    gloss: ziekenhuis
    note: شفاخانه is het gewone Afghaanse Dari woord voor ziekenhuis. Het verschilt van het Iraanse Farsi بیمارستان, dat Dari-sprekers wel begrijpen maar zelf normaal niet gebruiken.
    example_gloss: Het ziekenhuis is ver.
  prs.a1.unit05.lesson01.teach.school:
    title: School
    gloss: school
    note: مکتب is het gewone Afghaanse Dari woord voor school. Het verschilt van het Iraanse Farsi مدرسه, dat in het Dari meestal specifiek een religieuze school aanduidt.
    example_gloss: De school is dicht bij het huis.
  prs.a1.unit05.lesson01.teach.pharmacy:
    title: Apotheek
    gloss: apotheek
    note: دواخانه is het gewone Afghaanse Dari woord voor apotheek (van دوا, medicijn). Het verschilt van het Iraanse Farsi داروخانه.
    example_gloss: Waar is de apotheek?
  prs.a1.unit05.lesson01.teach.va_word:
    title: En
    gloss: en
    note: و is het gebruikelijke voegwoord om een rij plaatsen aan elkaar te koppelen.
    target_text: و (en)
  prs.a1.unit05.lesson02.teach.post_office:
    title: Postkantoor
    gloss: postkantoor
    note: پوسته خانه combineert پوسته (post) met خانه (huis/gebouw).
    example_gloss: Het postkantoor is gesloten.
  prs.a1.unit05.lesson02.teach.embassy:
    title: Ambassade
    gloss: ambassade
    note: سفارت is het standaardwoord voor een ambassade.
    example_gloss: De ambassade is in Kabul.
  prs.a1.unit05.lesson02.teach.airport:
    title: Luchthaven
    gloss: luchthaven
    note: میدان هوایی is de gewone Afghaanse Dari term voor luchthaven (letterlijk 'luchtveld'). Het verschilt van het Iraanse Farsi فرودگاه.
    example_gloss: De luchthaven is ver.
  prs.a1.unit05.lesson02.teach.office_review:
    title: Kantoor (herhaling)
    gloss: kantoor
    note: دفتر kwam al in een eerdere unit aan bod; het staat hier tussen de andere openbare plekken.
    example_gloss: Mijn kantoor is dichtbij.
  prs.a1.unit05.lesson03.teach.kojast_bazaar:
    title: Vragen waar de markt is
    gloss: Waar is de markt?
    note: بازار کجاست؟ is het basispatroon om te vragen waar een plek is.
  prs.a1.unit05.lesson03.teach.kojast_hospital:
    title: Vragen waar het ziekenhuis is
    gloss: Waar is het ziekenhuis?
    note: Hetzelfde patroon met کجاست werkt bij elk woord voor een plek.
  prs.a1.unit05.lesson03.teach.bebakhshid:
    title: Beleefd iemands aandacht trekken
    gloss: Pardon, waar is de apotheek?
    note: ببخشین opent beleefd een vraag aan een onbekende, met dezelfde functie als 'pardon' of 'excuseer' in het Nederlands.
  prs.a1.unit05.lesson03.teach.kojast_grammar:
    title: Hoe کجاست wordt gevormd
    gloss: کجاست is کجا (waar) plus است (is), samengetrokken tot één woord.
    note: Als je deze opbouw herkent, zie je het patroon, in plaats van کجاست als één onontleed blok uit je hoofd te leren.
  prs.a1.unit05.lesson04.teach.near:
    title: Dichtbij
    gloss: vlak bij
    note: نزدیک beschrijft iets wat dichtbij is.
    example_gloss: De bank is dichtbij.
  prs.a1.unit05.lesson04.teach.far:
    title: Ver
    gloss: ver
    note: دور beschrijft iets wat op afstand ligt.
    example_gloss: Het ziekenhuis is ver weg.
  prs.a1.unit05.lesson04.teach.here:
    title: Hier
    gloss: hier
    note: این‌جا wijst naar de plek waar de spreker zich nu bevindt.
    example_gloss: De bank is hier.
  prs.a1.unit05.lesson04.teach.there:
    title: Daar
    gloss: daar
    note: آن‌جا wijst naar een plek die van de spreker af ligt.
    example_gloss: De apotheek is daar.
  prs.a1.unit05.lesson04.teach.bazaar_near:
    title: Zeg dat de markt dichtbij is
    gloss: De markt is dichtbij.
    note: بازار نزدیک است gebruikt dezelfde koppelwoordvorm است die je in de hele cursus tegenkomt.
  prs.a1.unit05.lesson04.teach.airport_far:
    title: Zeg dat het vliegveld ver weg is
    gloss: Het vliegveld is ver weg.
    note: میدان هوایی دور است volgt hetzelfde patroon, met دور in plaats van نزدیک.
  prs.a1.unit05.lesson05.teach.next_to:
    title: Naast
    gloss: naast
    note: در کنار betekent letterlijk 'aan de zijkant van'.
  prs.a1.unit05.lesson05.teach.behind:
    title: Achter
    gloss: achter
    note: پشت geeft aan dat iets achter een andere plek ligt.
    example_gloss: De apotheek is achter de school.
  prs.a1.unit05.lesson05.teach.opposite:
    title: Tegenover
    gloss: tegenover
    note: مقابل geeft aan dat iets recht tegenover een andere plek ligt.
    example_gloss: De bank is tegenover de moskee.
  prs.a1.unit05.lesson05.teach.hospital_next_to_mosque:
    title: Geef aan waar het ziekenhuis ligt ten opzichte van de moskee
    gloss: Het ziekenhuis is naast de moskee.
    note: شفاخانه در کنار مسجد است combineert een plaats, het voorzetsel در کنار en het koppelwoord است.
  prs.a1.unit05.lesson06.teach.tashakor_ziad:
    title: Hartelijk bedankt
    gloss: Hartelijk bedankt.
    note: تشکر زیاد versterkt het alledaagse تشکر dat je al hebt geleerd.
  prs.a1.unit05.lesson06.teach.turn01:
    title: Zarmina vraagt naar de apotheek
    gloss: Zarmina vraagt een voorbijganger beleefd waar de apotheek is.
    note: ببخشین opent de vraag respectvol, passend bij een onbekende.
  prs.a1.unit05.lesson06.teach.turn02:
    title: De voorbijganger wijst de weg
    gloss: De voorbijganger zegt dat de apotheek niet ver is, dat je rechtdoor moet lopen en dat ze naast de school ligt.
    note: 'Dit combineert meerdere patronen uit deze les: دور نیست (ontkend دور), مستقیم بروین en در کنار.'
  prs.a1.unit05.lesson06.teach.turn03:
    title: Zarmina bedankt de voorbijganger
    gloss: Zarmina bedankt hem hartelijk.
    note: تشکر زیاد sluit het gesprek beleefd af.
  prs.a1.unit05.lesson06.teach.turn04:
    title: Het bescheiden antwoord van de voorbijganger
    gloss: Graag gedaan / het is niets.
    note: 'قابلی نداره is in het alledaagse Afghaanse Dari een gebruikelijke, bescheiden manier om een bedankje van je af te zetten. Het lijkt qua functie op خواهش می‌کنم, maar is informeler. نداره is de gesproken vorm van ندارد: gesproken hoor je نداره, in zorgvuldig schrift staat ندارد.'
