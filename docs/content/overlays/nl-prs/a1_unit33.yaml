    title: Wassen / doen
    gloss: afwassen / doen — ik was af / ik doe
    note: شستن (wassen) is een echt nieuw werkwoord. کردن (doen) en می‌کنم (ik doe) ken je al uit eerdere units.
    target_text: شستن (wassen) / کردن (doen) — می‌شویم (ik was) / می‌کنم (ik doe)
