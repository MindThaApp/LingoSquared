  description: 'Kaboel-Dari voor beginners: woordenschat over klusjes in huis (huishouden, bezem, vaat, schoon, helpen), zeggen welke klus vandaag gedaan moet worden met باید, iemand om hulp vragen bij een klus en een dialoog tussen Wahid en Shukria over het verdelen van de huishoudelijke taken.'
