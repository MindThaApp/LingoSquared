teaching:
  prs.a2.unit21.lesson01.teach.tghr_dadn_lghw:
    title: Een afspraak wijzigen
    gloss: verplaatsen (een afspraak) / annuleren
    note: '*قرار را تغییر دادن* betekent de afspraak naar een ander tijdstip verplaatsen. *لغو کردن* betekent hem helemaal annuleren.'
    example_gloss:
    - Ik wil mijn afspraak verplaatsen.
    - Ik moet mijn afspraak annuleren.
  prs.a2.unit21.lesson01.teach.mtasfanh_bbkhshn:
    title: Zeggen dat het je spijt
    gloss: helaas / sorry
    note: '*متأسفانه* is een beleefde manier om slecht nieuws te brengen. *ببخشین* is de gewone verontschuldiging.'
    example_gloss:
    - Helaas kan ik niet komen.
    - Sorry, ik ben te laat.
  prs.a2.unit21.lesson01.teach.slman:
    title: De kapsalon
    gloss: de kapsalon
    note: '*سلمانی* is de kapperszaak, dus de plek. *دلاک* is het traditionele woord voor de kapper zelf.'
    example_gloss: De salon is open van negen tot zes.
  prs.a2.unit21.lesson01.teach.mtwanm_qrarm_ra:
    title: Vragen om een afspraak te verplaatsen
    gloss: Kan ik mijn afspraak verzetten?
    note: 'Een ja/nee-vraag behoudt de woordvolgorde van een mededelende zin; alleen de intonatie gaat omhoog: *می‌توانم قرارم را تغییر بدهم؟* Het tweede werkwoord, *تغییر بدهم*, staat aan het eind.'
  prs.a2.unit21.lesson01.teach.mn_mtasfanh_nmtwanm:
    title: Zeggen dat je niet kunt komen
    gloss: Helaas kan ik niet komen.
  prs.a2.unit21.lesson01.teach.njshnbh_nmtwanm_bam:
    title: می‌توانم + aanvoegende wijs
    gloss: Donderdag kan ik niet komen. Kan ik de afspraak verplaatsen?
    note: 'Na *می‌توانم* (ik kan) staat het tweede werkwoord in de aanvoegende wijs, aan het eind van de zin: *می‌توانم بیایم*. Voor *kan niet* komt de *ن* voor het hulpwerkwoord: *نمی‌توانم بیایم*. Een dagnaam staat vooraan: *پنجشنبه نمی‌توانم بیایم*. Een vraag heeft dezelfde woordvolgorde; alleen de intonatie gaat omhoog: *می‌توانم قرار را تغییر بدهم؟*'
  prs.a2.unit21.lesson02.teach.rwz_dr:
    title: Een andere dag
    gloss: een andere dag
    note: '*دیگر* betekent ''ander'' en staat achter het zelfstandig naamwoord: *یک روز دیگر* is een andere dag.'
    example_gloss: Kan het ook op een andere dag?
  prs.a2.unit21.lesson02.teach.dwshnbh_hm_mmn:
    title: Een dag voorstellen
    gloss: Kan maandag ook?
    note: 'Voor een dag van de week is geen voorzetsel nodig: *دوشنبه هم ممکن است؟* *هم* betekent ''ook'' en staat achter de dag.'
  prs.a2.unit21.lesson02.teach.jmah_bra_shma:
    title: Komt het u uit?
    gloss: Komt vrijdag u uit? (formeel)
    note: '*مناسب* betekent ''geschikt''. *برای شما مناسب است* is de beleefde manier om te vragen of een tijd iemand uitkomt die je niet goed kent. *برایم* is de korte vorm van *برای من* (voor mij).'
  prs.a2.unit21.lesson02.teach.bl_bram_mnasb:
    title: Ja zeggen
    gloss: Ja, dat komt me goed uit.
  prs.a2.unit21.lesson02.teach.mtasfanh_nh:
    title: Beleefd nee zeggen
    gloss: Helaas niet.
  prs.a2.unit21.lesson02.teach.jmah_bra_shma_2:
    title: Komt het u uit?
    gloss: Komt vrijdag u uit? Ja, dat komt me goed uit. Nee, helaas niet.
    note: Om te vragen of een tijd iemand uitkomt, gebruik je *برای شما مناسب است؟*, met het beleefde *شما*. Antwoord *بلی، برایم مناسب است* om te bevestigen, of *متأسفانه نه* om beleefd te weigeren. *برای* plus een persoonlijk achtervoegsel (*برایم*, *برایتان*) betekent 'voor mij', 'voor u'.
  prs.a2.unit21.lesson03.teach.wn_mtasfm:
    title: Omdat en het spijt me
    gloss: omdat / het spijt me
    note: '*چون* verbindt twee volledige zinnen en geeft de reden. *متأسفم* is een zorgvuldiger excuus dan *ببخشین*.'
    example_gloss:
    - Ik kan niet komen, want ik ben ziek.
    - Het spijt me.
  prs.a2.unit21.lesson03.teach.zhmt:
    title: Ongemak
    gloss: het ongemak
    note: '*بابت زحمت ببخشین* is een beleefde zin nadat je iemand extra moeite hebt bezorgd. *زحمت* betekent ''moeite'' of ''overlast''.'
    example_gloss: Excuses voor het ongemak.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn:
    title: 'Reden: werk'
    gloss: Ik kan niet komen, omdat ik moet werken.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn_2:
    title: 'Reden: een andere afspraak'
    gloss: Ik kan niet komen, want ik heb nog een afspraak.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn_3:
    title: 'Omdat: ziek'
    gloss: Ik kan niet komen, want ik ben ziek.
    note: 'Na *چون* volgt een gewone zin, met het werkwoord aan het eind. Zet er een komma voor: *نمی‌توانم بیایم، چون مریض استم.* De vorm *استم* is de *ik*-vorm van *است*.'
  prs.a2.unit21.lesson04.teach.qrar_dhashtn_az:
    title: Afspreken en van tevoren
    gloss: afspreken / van tevoren
    note: '*قرار گذاشتن* is samen een tijd of plek afspreken. *از قبل* betekent ''van tevoren''.'
    example_gloss:
    - Zullen we iets afspreken?
    - Bel een dag van tevoren.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh:
    title: Een tijd accepteren
    gloss: Maandag om tien uur is prima.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh_2:
    title: Vragen of een tijd past
    gloss: Kunt u maandag om tien uur komen? (formeel)
    note: '*می‌توانین* is de beleefde *u*-vorm van *می‌توانی*; de meervoudsuitgang *-ین* hoort bij *شما*. Het tweede werkwoord, *بیایین*, staat aan het eind.'
  prs.a2.unit21.lesson04.teach.s_shma_ra:
    title: De afspraak afronden
    gloss: Dan zie ik u maandag.
  prs.a2.unit21.lesson04.teach.s_qrar_jdd:
    title: Een nieuwe afspraak maken
    gloss: Dan maak ik een nieuwe afspraak.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh_3:
    title: Eerst de dag, dan de tijd
    gloss: Maandag om tien uur is prima. Kunt u maandag om tien uur komen?
    note: 'Als je een dag en een tijd noemt, komt eerst de dag en dan *ساعت* + het getal: *دوشنبه ساعت ده*. In een beleefde vraag gebruik je *می‌توانین ...؟* en zet je het werkwoord aan het eind.'
  prs.a2.unit21.lesson05.teach.hmawn_azz_qrartan:
    title: Een bericht van de kapsalon
    gloss: Beste Homayoun, uw afspraak is verplaatst. Uw nieuwe afspraak is maandag om tien uur. Komt dit u niet uit? Bel ons dan een dag van tevoren. Dan maken we een nieuwe afspraak. Tot maandag! Kapsalon Ariana
    note: Dit is een typisch kort bericht van een bedrijf, dus het gebruikt het beleefde achtervoegsel *-تان* (*قرارتان*, *برایتان*). *تغییر داده شد* betekent 'is verplaatst'.
    glosses:
      عزیز: beste
      همایون: Homayoun
      قرارتان: uw
      قرار: afspraak
      تغییر: verplaatst
      جدیدتان: nieuwe
      دوشنبه: maandag
      ده: tien
      ساعت: uur
      مناسب: geschikt
      این: dit
      نیست: niet
      برایتان: voor u
      تماس: bellen
      با: met ons
      پس: dan
      قبل: van tevoren
      می‌گذاریم: maken
      ما: wij
      تا: tot, tot ziens
      سلمانی: kapperszaak
      آریانا: Ariana
  prs.a2.unit21.lesson06.teach.slman_arana_rwz:
    title: De kapsalon neemt op
    gloss: 'Kapper: Kapsalon Ariana, goedemiddag.'
  prs.a2.unit21.lesson06.teach.rwz_bkhr_hmawn:
    title: Homayoun legt uit en vraagt iets
    gloss: 'Homayoun: Goedemiddag, u spreekt met Homayoun. Ik heb donderdag een afspraak, maar helaas kan ik niet komen. Kan ik de afspraak verplaatsen?'
  prs.a2.unit21.lesson06.teach.albth_jmah_bra:
    title: De kapper stelt vrijdag voor
    gloss: 'Kapper: Natuurlijk. Komt vrijdag u goed uit?'
  prs.a2.unit21.lesson06.teach.mtasfanh_nh_wn:
    title: Homayoun stelt maandag voor
    gloss: 'Homayoun: Helaas niet, want ik moet werken. Kan maandag ook?'
  prs.a2.unit21.lesson06.teach.dwshnbh_saat_dh:
    title: De kapper gaat akkoord
    gloss: 'Kapper: Maandag om tien uur is goed.'
  prs.a2.unit21.lesson06.teach.bram_mnasb_ast:
    title: Homayoun stemt in en biedt zijn excuses aan
    gloss: 'Homayoun: Dat komt mij goed uit. Hartelijk dank en sorry voor het ongemak.'
  prs.a2.unit21.lesson06.teach.mshl_nst_ta:
    title: De kapper rondt af
    gloss: 'Kapper: Geen probleem. Tot maandag!'
