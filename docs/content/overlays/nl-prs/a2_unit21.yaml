course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor gevorderde beginners: een afspraak bij de kapper verplaatsen. می‌توانم + aanvoegende wijs, beleefde verzoeken, een reden geven met چون en een nieuwe dag en tijd afspreken.'
