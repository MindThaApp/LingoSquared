    gloss: downloaden
    note: دانلود is het gangbare leenwoord in het Dari voor "downloaden". Het wordt met کردن (doen, herhaling) gecombineerd als hulpwerkwoord, bijvoorbeeld دانلود می‌کنم (ik download).
