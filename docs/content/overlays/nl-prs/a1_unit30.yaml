  prs.a1.unit30.lesson01.teach.computer_word:
    title: Computer
    gloss: computer
    note: کمپیوتر betekent computer, een gangbaar leenwoord dat Perzisch en Dari delen.
    example_gloss: De computer staat op kantoor.
  prs.a1.unit30.lesson01.teach.internet_word:
    title: Internet
    gloss: internet
    note: انترنت betekent internet, een gangbaar leenwoord dat Perzisch en Dari delen.
    example_gloss: Het internet is traag.
