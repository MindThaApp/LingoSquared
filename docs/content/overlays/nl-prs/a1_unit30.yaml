course:
  title: Dari in het Nederlands A1
  description: 'Kabul-Dari voor beginners: woordenschat over technologie en apparaten (mobiele telefoon, computer, internet, app, foto), zinnen over wat je met je telefoon doet (een bericht sturen, bellen, een foto maken, een app downloaden), vragen en antwoorden over hoe vaak per dag je je mobiele telefoon gebruikt, en een dialoog tussen Zarmina en Homayoun over het gebruik van telefoon, computer en internet.'
units:
