    note: عکس betekent foto.
    example_gloss: Deze foto is mooi.
  prs.a1.unit30.lesson01.teach.review_estefade_kardan:
    title: Gebruiken
    gloss: gebruik + doen → ik gebruik
    note: استفاده (gebruik) combineert met کردن (doen, herhaling) tot استفاده می‌کنم (ik gebruik). Dit is hetzelfde patroon met een hulpwerkwoord dat je al in de hele cursus hebt gezien, bijvoorbeeld بازی می‌کنم (Unit 29) en ورزش می‌کنم (Unit 29).
    target_text: استفاده (gebruik) + کردن (doen) = استفاده می‌کنم (ik gebruik)
  prs.a1.unit30.lesson01.teach.combined_sentence:
    title: Ik gebruik internet
    gloss: Ik gebruik internet.
    note: Combineert من (ik, herhaling), از (van/met, herhaling), انترنت en استفاده می‌کنم.
  prs.a1.unit30.lesson02.teach.review_peyam:
    title: Bericht
    gloss: bericht
    note: پیام betekent bericht.
    target_text: پیام (bericht)
