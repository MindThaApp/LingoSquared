  prs.a1.unit36.lesson01.teach.food_word:
    title: Eten
    gloss: eten / een maaltijd
    note: غذا betekent eten of een maaltijd in het algemeen, in tegenstelling tot een specifiek gerecht zoals پلو.
    example_gloss: Het eten is heerlijk.
  prs.a1.unit36.lesson01.teach.onion_word:
    title: Ui
    gloss: ui
    note: پیاز is het gewone Dari-woord voor ui en wordt voortdurend gebruikt in de Afghaanse keuken.
    example_gloss: De ui is vers.
  prs.a1.unit36.lesson01.teach.meat_word:
    title: Vlees
    gloss: vlees
    note: گوشت betekent vlees.
    example_gloss: Het vlees is vers.
  prs.a1.unit36.lesson01.teach.review_basics:
    title: 'Herhaling: een, willen, in, zijn'
    gloss: een / ik wil / in of op / ik ben
    note: یک, می‌خواهم, در en استم zijn herhaalde vormen die in de kookzinnen van deze unit voorkomen.
    target_text: یک (een) / می‌خواهم (ik wil) / در (in/op) / استم (ik ben)
  prs.a1.unit36.lesson01.teach.cook_food_phrase:
    title: Ik kook eten
    gloss: Ik kook eten.
    note: می‌پزم is de eerste persoon enkelvoud van de tegenwoordige tijd van پختن, koken.
  prs.a1.unit36.lesson01.teach.in_kitchen_phrase:
    title: Ik ben in de keuken
    gloss: Ik ben in de keuken.
    note: استم is de eerste persoon van de koppelwerkwoordvorm en wordt hier met در gebruikt voor een plaats.
  prs.a1.unit36.lesson02.teach.salt_word:
    title: Zout
    gloss: zout
    note: نمک betekent zout.
    example_gloss: Ik wil zout.
  prs.a1.unit36.lesson02.teach.rice_grain_word:
    title: Rijst
    gloss: rijst
    note: برنج is ongekookte rijst (de korrels), anders dan پلو, het gekookte rijstgerecht uit de eenheid over eten.
    example_gloss: Ik kook rijst.
  prs.a1.unit36.lesson02.teach.review_do_cut:
    title: 'Herhaling: ik doe, gesneden'
    gloss: ik doe / gesneden, gehakt
    note: می‌کنم is herhaling; خرد is nieuw en betekent in combinatie met vormen van کردن snijden of hakken.
    target_text: می‌کنم (ik doe) / خرد (gesneden/gehakt)
  prs.a1.unit36.lesson02.teach.chop_onion_phrase:
    title: Ik snijd de ui
    gloss: Ik snijd de ui.
    note: خرد می‌کنم betekent letterlijk 'ik maak het gesneden/gehakt' — een gebruikelijk patroon voor samengestelde werkwoorden.
  prs.a1.unit36.lesson02.teach.add_salt_phrase:
    title: Ik doe zout erbij
    gloss: Ik doe zout erbij.
    note: می‌اندازم (van انداختن, gooien/erin doen) is het natuurlijke Dari-werkwoord voor het toevoegen van een ingrediënt.
  prs.a1.unit36.lesson02.teach.cook_meat_phrase:
    title: Ik kook vlees
    gloss: Ik kook vlees.
    note: Vervang گوشت door برنج om een ander gerecht te noemen dat je kookt.
  prs.a1.unit36.lesson03.teach.review_first_then:
    title: 'Herhaling: eerst, daarna'
    gloss: eerst / daarna
    note: اول en بعد zijn herhaalde woorden om kookstappen op volgorde te zetten.
    target_text: اول (eerst) / بعد (daarna)
  prs.a1.unit36.lesson03.teach.review_water_hot:
    title: 'Herhaling: water, warm'
    gloss: water / warm
    note: آب en گرم zijn herhaalde woorden uit eerdere units.
    target_text: آب (water) / گرم (warm)
  prs.a1.unit36.lesson03.teach.pour_word:
    title: Ik giet
    gloss: ik giet
    note: می‌ریزم (van ریختن, gieten) is het natuurlijke werkwoord om een vloeistof toe te voegen, anders dan می‌اندازم voor vaste ingrediënten.
    example_gloss: Ik giet water.
  prs.a1.unit36.lesson03.teach.first_chop_phrase:
    title: Eerst snijd ik de ui
    gloss: Eerst snijd ik de ui.
    note: اول geeft de eerste stap in een volgorde aan.
  prs.a1.unit36.lesson03.teach.then_cook_meat_phrase:
    title: Daarna bak ik het vlees
    gloss: Daarna bak ik het vlees.
    note: بعد geeft de volgende stap in een volgorde aan.
  prs.a1.unit36.lesson03.teach.pour_hot_water_phrase:
    title: Ik giet warm water erbij
    gloss: Ik giet warm water erbij.
    note: Combineert گرم (warm) met می‌ریزم (ik giet).
  prs.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Hallo / ja / alstublieft / oké / bedankt / stoofgerecht / heerlijk / is
