    title: Hij/zij, in, doet, kookt, heel, blij, is
    gloss: hij/zij / in of op / hij/zij doet / hij/zij kookt / heel / blij / is
    note: او is het Dari-voornaamwoord voor hij of zij; می‌کند en می‌پزد zijn de vormen voor de derde persoon van de werkwoorden uit deze unit.
    target_text: او (hij/zij) / در (in/op) / می‌کند (hij/zij doet) / می‌پزد (hij/zij kookt) / بسیار (heel) / خوشحال (blij) / است (is)
  prs.a1.unit36.lesson05.teach.reading_passage:
    title: Lezen over Nadia die kookt
