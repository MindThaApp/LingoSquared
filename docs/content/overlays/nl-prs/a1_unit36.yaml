    note: سلام, بلی, لطفاً, چشم, تشکر, قورمه, خوش‌مزه en است zijn herhalingswoorden die in de keukendialoog worden gebruikt.
    target_text: سلام (hallo) / بلی (ja) / لطفاً (alstublieft) / چشم (oké/graag) / تشکر (bedankt) / قورمه (stoofgerecht) / خوش‌مزه (heerlijk) / است (is)
  prs.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Nadia: Hallo, wat zijn jullie aan het koken?'
    gloss: Hallo, wat bent u aan het koken?
    note: چی می‌پزین؟ gebruikt de beleefde u-vorm می‌پزین.
  prs.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Farid: Ik maak qorma.'
    gloss: Ik maak qorma.
  prs.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Nadia: Zal ik helpen?'
    gloss: Zal ik helpen?
    note: کمک می‌کنم؟ betekent letterlijk 'Help ik?'. Zo bied je op een natuurlijke manier hulp aan.
  prs.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Farid: Ja, snijd alsjeblieft de ui.'
    gloss: Ja, snijd alsjeblieft de ui.
    note: 'کنین is de beleefde gebiedende wijs: snijd!'
  prs.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Nadia: Komt goed.'
    gloss: Komt goed.
  prs.a1.unit36.lesson04.teach.dialogue_line6:
    title: 'Farid: Bedankt, het eten is heerlijk.'
    gloss: Bedankt, het eten is heerlijk.
