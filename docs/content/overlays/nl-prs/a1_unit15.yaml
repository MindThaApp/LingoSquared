teaching:
  prs.a1.unit15.lesson01.teach.in_word:
    title: Dit
    gloss: dit
    note: این betekent dit.
    example_gloss: Dit is groter.
  prs.a1.unit15.lesson01.teach.aan_word:
    title: Dat
    gloss: dat
    note: آن betekent dat -- in dit Dari gebruik je de volledige vorm آن, niet het informele Iraanse اون.
    example_gloss: Dat is kleiner.
  prs.a1.unit15.lesson01.teach.bozorgtar_ast_word:
    title: Het is groter
    gloss: het is groter
    note: 'بزرگ‌تر است is de volledige, niet samengetrokken vorm (het is groter): *بزرگ‌تر* is de vergrotende trap van *بزرگ* (groot) en *است* blijft een apart woord.'
    example_gloss: Dit is groter dan dat.
  prs.a1.unit15.lesson01.teach.koochaktar_ast_word:
    title: Het is kleiner
    gloss: het is kleiner
    note: کوچک‌تر است is de volledige vorm (het is kleiner) -- کوچک is de standaard Dari-spelling (niet het Iraanse spreektaalwoord کوچیک).
    example_gloss: Dat is kleiner dan dit.
  prs.a1.unit15.lesson01.teach.az_word:
    title: Dan / van (vergelijking)
    gloss: dan
    note: از geeft het vergelijkingspunt aan -- X از Y بزرگ‌تر است betekent X is groter dan Y.
    target_text: از (dan)
  prs.a1.unit15.lesson02.teach.gerantar_ast_word:
    title: Het is duurder
    gloss: het is duurder
    note: گران‌تر است is de volledige vorm (het is duurder) -- گران is de standaard Dari-spelling (niet het Iraanse spreektaalwoord گرون).
    example_gloss: Dit is duurder dan dat.
  prs.a1.unit15.lesson02.teach.arzantar_ast_word:
    title: Het is goedkoper
    gloss: het is goedkoper
    note: ارزان‌تر است is de volledige vorm (het is goedkoper) -- ارزان is de standaard Dari-spelling (niet het Iraanse spreektaalwoord ارزون).
    example_gloss: Dat is goedkoper dan dit.
  prs.a1.unit15.lesson03.teach.names:
    title: Karim en Negar
    gloss: Karim, Negar
    note: Veelvoorkomende Afghaanse namen die in deze hele cursus worden gebruikt.
    example_gloss:
    - Ik ben Karim.
    - Ik ben Negar.
  prs.a1.unit15.lesson03.teach.ghad_bolandtar_phrase:
    title: Langer
    gloss: langer / hij/zij is langer
    note: '*قد بلندتر است* betekent letterlijk ''de lengte is hoger'': *قد* (lengte), *بلندتر* (langer of hoger, de vergrotende trap van *بلند*, lang), *است* (is).'
  prs.a1.unit15.lesson03.teach.javantar_ast_word:
    title: Jonger
    gloss: jonger / hij/zij is jonger
    note: جوان‌تر است is de volledige vorm (hij/zij is jonger) -- جوان is de standaard Dari-spelling (niet het Iraanse spreektaalwoord جوون).
    example_gloss: Negar is jonger dan Karim.
  prs.a1.unit15.lesson04.teach.behtar_ast_word:
    title: Het is beter
    gloss: het is beter
    note: بهتر است is de volledige vorm -- بهتر (beter) is de onregelmatige vergrotende trap van خوب (goed).
    example_gloss: Dit is beter dan dat.
  prs.a1.unit15.lesson04.teach.badtar_ast_word:
    title: Het is slechter
    gloss: het is slechter
    note: بدتر است is de volledige vorm -- بدتر (slechter) is de onregelmatige vergrotende trap van بد (slecht).
    example_gloss: Dat is slechter dan dit.
  prs.a1.unit15.lesson04.teach.choon_word:
    title: Omdat
    gloss: omdat
    note: چون leidt een reden in.
    target_text: چون (omdat)
  prs.a1.unit15.lesson04.teach.va_word:
    title: En
    gloss: en
    note: و betekent en en verbindt twee zinsdelen of twee dingen.
    target_text: و (en)
  prs.a1.unit15.lesson05.teach.reading_text:
    title: Voorbeeldtekst met vergelijkingen
    gloss: Karim is langer dan Negar. Negar is jonger dan Karim.
    note: Een korte vergelijking over twee personen, met de woorden uit deze unit.
  prs.a1.unit15.lesson06.teach.names:
    title: Karim en Negar
    gloss: Karim, Negar
    example_gloss:
    - Karim is langer.
    - Negar is jonger.
  prs.a1.unit15.lesson06.teach.ama_word:
    title: Maar
    gloss: maar
    note: اما betekent maar en leidt een tegenstelling in.
    target_text: اما (maar)
  prs.a1.unit15.lesson06.teach.bali_word:
    title: Ja
    gloss: ja
    note: بلی is het beleefde, formele woord voor ja, passend bij het register van deze cursus.
    example_gloss: Ja, dit is duurder.
  prs.a1.unit15.lesson06.teach.dialogue_line1:
    title: Karim zegt
    gloss: Dit is duurder dan dat, maar het is beter.
  prs.a1.unit15.lesson06.teach.dialogue_line2:
    title: Negar antwoordt
    gloss: Ja, maar dat is goedkoper.
