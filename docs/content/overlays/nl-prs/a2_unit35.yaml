course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor de lagere middenfase: gebeurtenissen op volgorde zetten met tijdbijzinnen, bijvoorbeeld voordat ik vertrok, nadat ik aankwam en toen het water kookte. Voor en na met een zelfstandig naamwoord, بعد از اینکه met de verleden tijd, قبل از اینکه met de aanvoegende wijs en وقتی که.'
units:
  prs.a2.unit35.before_after_when:
    title: Voor, na, wanneer
lessons:
  prs.a2.unit35.lesson01.before_after_nouns:
    title: Voor en na met een zelfstandig naamwoord
  prs.a2.unit35.lesson02.after_clause_travel:
    title: Na een bijzin en reisklusjes
  prs.a2.unit35.lesson03.before_clause_cooking:
    title: Voor een bijzin en koken
  prs.a2.unit35.lesson04.when_clause:
    title: Wanneer
  prs.a2.unit35.lesson05.reading_and_listening:
    title: Lezen en luisteren over rijst en een reis
  prs.a2.unit35.lesson06.morning_conversation:
    title: Een gesprek over de ochtend
teaching:
  prs.a2.unit35.lesson01.teach.before:
    title: Voor
    gloss: voor (met een zelfstandig naamwoord)
    note: '*قبل از* betekent ''voor''. Daarna komt een zelfstandig naamwoord, zonder eigen werkwoord: *قبل از صبحانه* is ''voor het ontbijt''.'
    example_gloss: Voor het ontbijt neem ik een douche.
  prs.a2.unit35.lesson01.teach.after:
    title: Na
    gloss: na (met een zelfstandig naamwoord)
    note: '*بعد از* betekent ''na'' en wordt ook gevolgd door een zelfstandig naamwoord: *بعد از مکتب* is ''na school''.'
    example_gloss: Na school ga ik naar huis.
  prs.a2.unit35.lesson01.teach.dinner:
    title: Avondeten
    gloss: avondeten, de avondmaaltijd
    note: '*شام* is het avondeten. *می‌خورم* betekent ''ik eet'' of ''ik drink'': *شام می‌خورم* is ''ik eet avondeten'' en *چای می‌خورم* is ''ik drink thee''. Dari gebruikt hiervoor één werkwoord.'
    example_gloss: Na het avondeten drink ik thee.
  prs.a2.unit35.lesson01.teach.get_dressed:
    title: Zich aankleden
    gloss: kleren aantrekken, je aankleden
    note: '*لباس* betekent ''kleren'' en *پوشیدن* betekent ''aantrekken''. *لباس می‌پوشم* is ''ik trek mijn kleren aan''; *می‌پوشم* is de tegenwoordige tijd voor ''ik''.'
    example_gloss: Elke ochtend kleed ik me aan.
  prs.a2.unit35.lesson01.teach.wake_up:
    title: Wakker worden
    gloss: wakker worden
    note: '*بیدار شدن* betekent ''wakker worden''. *شدن* betekent ''worden'', dus *بیدار می‌شوم* is ''ik word wakker''.'
    example_gloss: Om zes uur word ik wakker.
  prs.a2.unit35.lesson01.teach.noun_pattern:
    title: Voor en na met een zelfstandig naamwoord
    gloss: voor het ontbijt, na het ontbijt, voor school, na school, voor het avondeten, na het avondeten
    note: 'Zet een zelfstandig naamwoord direct na *قبل از* of *بعد از* om te zeggen wanneer iets gebeurt: *قبل از صبحانه* (voor het ontbijt), *بعد از مکتب* (na school). Deze woordgroep heeft geen eigen werkwoord; het werkwoord staat in het hoofddeel van de zin. De woordgroep kan aan het begin van de zin staan (*بعد از شام چای می‌خورم*) of aan het eind (*چای می‌خورم بعد از شام*).'
  prs.a2.unit35.lesson01.teach.sequence_words:
    title: Eerst, dan, daarna, tot slot
    gloss: Eerst word ik wakker. Dan neem ik een douche. Daarna eet ik ontbijt. Op het eind ga ik naar school.
    note: 'Om een dag op volgorde te vertellen gebruik je korte verbindingswoorden: *اول* (eerst), *بعد* (dan), *بعد از آن* (daarna) en *در آخر* (tot slot, aan het eind). *بعد از آن* is *بعد از* met *آن* (dat) als zelfstandig naamwoord, dus het verwijst naar de stap die je net noemde.'
  prs.a2.unit35.lesson01.teach.phrase_school:
    title: Na het ontbijt ga ik naar school
    gloss: Na het ontbijt ga ik naar school.
    note: Het zelfstandig naamwoord *صبحانه* volgt op *بعد از* en het werkwoord *می‌روم* staat aan het eind. Dit is de eenvoudigste manier om te zeggen wat na wat komt.
  prs.a2.unit35.lesson02.teach.ticket:
    title: Kaartje
    gloss: kaartje (vliegtuig of bus)
    note: '*تکت* is een kaartje voor een vliegtuig of een bus. *تکت گرفتن* betekent ''een kaartje nemen of kopen''.'
    example_gloss: Ik heb het vliegticket gekocht.
  prs.a2.unit35.lesson02.teach.suitcase:
    title: Koffer
    gloss: koffer
    note: '*چمدان* is een koffer. Voeg *-م* toe voor ''mijn'': *چمدانم* is ''mijn koffer''.'
    example_gloss: Mijn koffer staat thuis.
  prs.a2.unit35.lesson02.teach.pack:
    title: Ik heb mijn koffer ingepakt
    gloss: Ik heb mijn koffer ingepakt.
    note: '*چمدان را بستن* betekent ''een koffer inpakken'' (het werkwoord is hetzelfde *بستن* als in *دروازه بسته است*). Eerst komt de koffer, dan *را*, dan het werkwoord: *بستم* is de eenvoudige verleden tijd voor ''ik''.'
  prs.a2.unit35.lesson02.teach.after_past:
    title: بعد از اینکه + verleden tijd
    gloss: Nadat ik het kaartje had gekocht, pakte ik mijn koffer in.
    note: '*بعد از اینکه* betekent ''nadat'' en begint een bijzin met een eigen werkwoord. Als je een verhaal in het verleden vertelt, staat dat werkwoord in de eenvoudige verleden tijd: *بعد از اینکه تکت را گرفتم* is ''nadat ik het kaartje had gekocht''. De hoofdzin zegt dan wat erna kwam: *چمدانم را بستم*. Wat in de *بعد از اینکه*-bijzin staat, gebeurde eerst.'
  prs.a2.unit35.lesson02.teach.after_habit:
    title: بعد از اینکه voor gewoonten
    gloss: Nadat ik op het station aankom, koop ik een kaartje.
    note: 'Voor iets wat je steeds weer doet, zet je het werkwoord in de tegenwoordige tijd met *می‌*: *بعد از اینکه به ایستگاه می‌رسم* is ''nadat ik op het station aankom'' en *تکت می‌گیرم* is ''ik koop een kaartje''. *می‌رسم* is de tegenwoordige tijd van *رسیدن* voor ''ik''.'
  prs.a2.unit35.lesson02.teach.swap:
    title: De bijzinnen kunnen van plaats wisselen
    gloss: Ik pakte mijn koffer in, nadat ik het kaartje had gekocht.
    note: 'Je kunt de *بعد از اینکه*-bijzin ook als tweede zeggen. De betekenis verandert niet: wat in de *بعد از اینکه*-bijzin staat, gebeurde nog steeds eerst. Alleen de woordvolgorde verandert, niet de volgorde van de gebeurtenissen.'
  prs.a2.unit35.lesson02.teach.noun_or_clause:
    title: Zelfstandig naamwoord of bijzin
    gloss: na het avondeten / nadat ik het avondeten had gegeten
    note: Gebruik *بعد از* met een zelfstandig naamwoord en *بعد از اینکه* met een hele bijzin. *بعد از شام* is 'na het avondeten'. *بعد از اینکه شام خوردم* is 'nadat ik het avondeten had gegeten'. De tweede heeft een werkwoord, dus die kan ook zeggen wie het deed.
  prs.a2.unit35.lesson02.teach.phrase_station:
    title: Nadat ik op het station was aangekomen, belde ik
    gloss: Nadat ik op het station was aangekomen, heb ik gebeld.
    note: 'Een echte reisvolgorde: eerst *رسیدم* (aankomen), dan *تیلفون کردم* (het telefoontje). *تیلفون کردن* is de gebruikelijke manier om te zeggen dat je belt.'
  prs.a2.unit35.lesson03.teach.subjunctive_forms:
    title: قبل از اینکه + aanvoegende wijs
    gloss: voordat ik aankom, voordat ik ga, voordat ik eet, voordat ik kom, voordat ik koop
    note: '*قبل از اینکه* betekent ''voordat'' en begint een bijzin met een eigen werkwoord. Dit werkwoord staat niet in de verleden tijd, maar in de aanvoegende wijs, dezelfde vorm als na *باید*: *ب-* plus de tegenwoordige stam plus de uitgang. *رسیدن* geeft *برسم*, *رفتن* geeft *بروم*, *خوردن* geeft *بخورم*, *آمدن* geeft *بیایم*, *خریدن* geeft *بخرم*.'
  prs.a2.unit35.lesson03.teach.subjunctive_paradigm:
    title: De uitgangen van de aanvoegende wijs
    gloss: dat ik aankom, dat jij aankomt, dat hij/zij aankomt, dat wij aankomen, dat u aankomt (beleefd) of dat jullie aankomen, dat zij aankomen
    note: De uitgangen zijn *-م، -ی، -د، -یم، -ین، -ند*. Dus *قبل از اینکه من برسم* is 'voordat ik aankom', *قبل از اینکه تو برسی* 'voordat jij aankomt' (tegen een vriend), *قبل از اینکه او برسد* 'voordat hij of zij aankomt', *قبل از اینکه ما برسیم* 'voordat wij aankomen', *قبل از اینکه شما برسین* 'voordat u aankomt' (beleefd) of 'voordat jullie aankomen', *قبل از اینکه آن‌ها برسند* 'voordat zij aankomen'. De tweede persoon meervoud eindigt in het Dari op *-ین*; de geschreven vorm *-ید* wordt ook begrepen.
  prs.a2.unit35.lesson03.teach.past_story:
    title: Zelfs in een verhaal in het verleden
    gloss: Voordat ik van huis ging, pakte ik mijn koffer in.
    note: 'Het verhaal staat in het verleden, dus je verwacht na *قبل از اینکه* een werkwoord in de verleden tijd. Maar je gebruikt de aanvoegende wijs: *بروم*, niet *رفتم*. De reden is dat het vertrek op het moment van inpakken nog niet had plaatsgevonden. Zeg hiervoor dus niet *قبل از اینکه رفتم* of *قبل از اینکه می‌روم*. De hoofdzin staat in de eenvoudige verleden tijd: *چمدانم را بستم*.'
  prs.a2.unit35.lesson03.teach.noun_or_clause:
    title: Zelfstandig naamwoord of bijzin
    gloss: voor het avondeten / voordat ik het avondeten eet
    note: 'Met een zelfstandig naamwoord gebruik je *قبل از*: *قبل از شام*. Met een bijzin voeg je *اینکه* toe en zet je het werkwoord in de aanvoegende wijs: *قبل از اینکه شام بخورم*. Dit lijkt op *بعد از شام* en *بعد از اینکه شام خوردم*, behalve dat het werkwoord na *بعد از اینکه* in de verleden tijd staat en na *قبل از اینکه* in de aanvoegende wijs.'
  prs.a2.unit35.lesson03.teach.rice:
    title: Rijst
    gloss: rijst
    note: '*برنج* is rijst. Het is een van de belangrijkste gerechten in de Afghaanse keuken.'
    example_gloss: Ik eet rijst.
  prs.a2.unit35.lesson03.teach.onion:
    title: Ui
    gloss: ui
    note: '*پیاز* is een ui. Veel gerechten beginnen met uien.'
    example_gloss: Er zijn uien in huis.
  prs.a2.unit35.lesson03.teach.chop:
    title: Snijden
    gloss: fijnsnijden, in kleine stukjes snijden
    note: '*خرد کردن* betekent ''iets in kleine stukjes snijden''. Eerst komt het ding met *را*: *پیاز را خرد می‌کنم* is ''ik snijd de ui fijn''.'
    example_gloss: Ik snijd de ui fijn.
  prs.a2.unit35.lesson03.teach.cook:
    title: Koken
    gloss: koken, bereiden
    note: '*پختن* betekent ''eten koken''. De tegenwoordige stam is *پز*: *می‌پزم* is ''ik kook'', *بپزم* is ''dat ik kook'' (de aanvoegende wijs, gebruikt na *قبل از اینکه*) en *پختم* is ''ik kookte''.'
    example_gloss: Ik kook rijst.
  prs.a2.unit35.lesson03.teach.sleep:
    title: Slapen
    gloss: slapen, gaan slapen
    note: '*خوابیدن* betekent ''slapen'' of ''naar bed gaan''. *می‌خوابم* is ''ik slaap'' en *بخوابم* is ''dat ik slaap'' (de aanvoegende wijs).'
    example_gloss: Om tien uur ga ik slapen.
  prs.a2.unit35.lesson03.teach.phrase_cook:
    title: Voordat ik de rijst kook, snijd ik de ui
    gloss: Voordat ik de rijst kook, snijd ik de ui.
    note: 'Een kookstap op volgorde. *بپزم* is de aanvoegende wijs na *قبل از اینکه*; *خرد می‌کنم* is de tegenwoordige tijd voor een gewoonte of een recept: eerst de ui, dan de rijst.'
  prs.a2.unit35.lesson04.teach.when_past:
    title: وقتی که voor één gebeurtenis in het verleden
    gloss: Toen ik thuiskwam, at ik het avondeten.
    note: '*وقتی که* betekent ''toen'' of ''wanneer'' en begint een bijzin met een eigen werkwoord. Voor één gebeurtenis in het verleden gebruik je in beide delen de eenvoudige verleden tijd: *وقتی که به خانه رسیدم* (toen ik thuiskwam), *شام خوردم* (ik at het avondeten). De twee gebeurtenissen vinden ongeveer tegelijk plaats of vlak na elkaar.'
  prs.a2.unit35.lesson04.teach.when_habit:
    title: وقتی که voor een gewoonte
    gloss: Als ik thuiskom, drink ik thee.
    note: 'Voor iets wat elke keer gebeurt, gebruik je in beide delen de tegenwoordige tijd met *می‌*: *وقتی که به خانه می‌رسم، چای می‌خورم* betekent: als ik thuiskom, drink ik thee.'
  prs.a2.unit35.lesson04.teach.when_future:
    title: وقتی که voor iets wat nog moet komen
    gloss: Morgen, als ik in Herat aankom, bel ik.
    note: 'Als het tijdstip nog in de toekomst ligt, staat het werkwoord na *وقتی که* in de aanvoegende wijs (*برسم*) en is het hoofdwerkwoord de tegenwoordige tijd met *می‌* plus een tijdsaanduiding: *فردا ... تیلفون می‌کنم* (morgen bel ik, dus: ik zal bellen). Je hebt geen aparte toekomende tijd nodig.'
  prs.a2.unit35.lesson04.teach.water:
    title: Water
    gloss: water
    note: '*آب* is water. Koud water is *آب سرد*; voor warm water zeg je *آب گرم*.'
    example_gloss: Het water is heet.
  prs.a2.unit35.lesson04.teach.boil:
    title: Koken
    gloss: koken (van water)
    note: '*جوش شدن* betekent koken. De verleden tijd is *جوش شد* en de tegenwoordige tijd is *جوش می‌شود*: *آب جوش می‌شود* betekent: het water kookt.'
    example_gloss: Het water kookte.
  prs.a2.unit35.lesson04.teach.salt:
    title: Zout
    gloss: zout
    note: '*نمک* is zout. Het hoort samen met *برنج* en *آب* in een eenvoudig recept.'
    example_gloss: Er is zout en rijst in huis.
  prs.a2.unit35.lesson04.teach.throw_in:
    title: Erin doen
    gloss: erin gooien, erin doen
    note: '*انداختن* betekent gooien of ergens iets in doen. Bij het koken is het het gebruikelijke werkwoord om iets toe te voegen: *نمک را می‌اندازم* betekent: ik doe het zout erin. De verleden tijd is *انداختم*.'
    example_gloss: Ik doe het zout in het water.
  prs.a2.unit35.lesson04.teach.phrase_boil:
    title: Als het water kookt, doe ik de rijst erin
    gloss: Als het water kookt, doe ik de rijst erin.
    note: 'Een gewoonte in een recept: beide werkwoorden staan in de tegenwoordige tijd met *می‌*.'
  prs.a2.unit35.lesson04.teach.when_short:
    title: وقتی که of gewoon وقتی
    gloss: toen ik aankwam / toen ik aankwam
    note: Beide vormen zijn correct. *وقتی که* is iets voller en *وقتی* alleen is korter; de betekenis is hetzelfde. In de cursus komt eerst *وقتی که* aan bod; je mag allebei typen.
  prs.a2.unit35.lesson04.teach.phrase_ready:
    title: Toen de rijst klaar was, at ik hem
    gloss: Toen de rijst klaar was, at ik hem.
    note: '*آماده شد* betekent: het werd klaar. *آن را* (het, met *را*) verwijst terug naar de rijst.'
  prs.a2.unit35.lesson05.teach.pack_present:
    title: Een koffer pakken
    gloss: een koffer pakken
    note: '*چمدان بستن* betekent een koffer pakken. De tegenwoordige tijd voor ik is *می‌بندم*: *چمدانم را می‌بندم* betekent: ik pak mijn koffer. De verleden tijd is *بستم*.'
    example_gloss: Voor een reis pak ik mijn koffer.
  prs.a2.unit35.lesson05.teach.travel_turn01:
    title: Narges vraagt hoe laat het vliegtuig vertrekt
    gloss: Akbar, hoe laat vertrekt het vliegtuig morgen?
    note: Narges vraagt naar de tijd met *ساعت چند*. *حرکت می‌کند* is de tegenwoordige tijd van *حرکت کردن* (vertrekken); met *فردا* geeft het aan wat er morgen gaat gebeuren.
  prs.a2.unit35.lesson05.teach.travel_turn02:
    title: Akbar noemt de tijd en een eerste stap
    gloss: Om tien uur. Voordat ik naar het vliegveld ga, pak ik mijn koffer.
    note: Akbar noemt de tijd en zegt dan wat hij eerst doet, met een bijzin met *قبل از اینکه*. *بروم* is de aanvoegende wijs en *می‌بندم* is de tegenwoordige tijd met een toekomstige betekenis.
  prs.a2.unit35.lesson05.teach.travel_turn03:
    title: Narges vraagt naar het ticket
    gloss: Heb je een ticket?
    note: '*تکت داری؟* is een vriendelijke vraag aan een vriend: *داری* betekent: je hebt (informeel, enkelvoud).'
  prs.a2.unit35.lesson05.teach.travel_turn04:
    title: Akbar zegt dat hij het ticket heeft
    gloss: Ja, ik heb gisteren het ticket gehaald.
    note: '*گرفتم* is de verleden tijd: hij heeft gisteren het ticket gehaald. *بلی* betekent ja.'
  prs.a2.unit35.lesson05.teach.travel_turn05:
    title: Narges vraagt of hij belt als hij aankomt
    gloss: Als je in Herat aankomt, bel je me dan?
    note: 'De bijzin *وقتی که به هرات برسی* ligt nog in de toekomst, dus het werkwoord staat in de aanvoegende wijs *برسی* (je aankomt). *به من تیلفون می‌کنی؟* betekent: bel je me?'
  prs.a2.unit35.lesson05.teach.travel_turn06:
    title: Akbar belooft het
    gloss: Ja. Als ik aankom, bel ik.
    note: 'Akbar gebruikt hetzelfde patroon: *وقتی که برسم*, aanvoegende wijs voor ik, daarna *تیلفون می‌کنم*.'
  prs.a2.unit35.lesson05.teach.message:
    title: Een bericht over rijst koken
    gloss: Hallo Akbar. Gisteren heb ik thuis rijst gekookt. Eerst heb ik de ui gesneden. Nadat het water kookte, deed ik het zout en de rijst erin. Toen de rijst klaar was, at ik hem. Voordat ik ging slapen, dronk ik thee.
    note: 'Een kort geschreven bericht dat alle drie de voegwoorden gebruikt om de stappen op volgorde te vertellen: *اول*, *بعد از اینکه*, *وقتی که* en *قبل از اینکه*.'
  prs.a2.unit35.lesson06.teach.work_my:
    title: Mijn werk
    gloss: mijn werk, mijn baan
    note: '*کار* is werk en *کارم* is mijn werk. *کارم را شروع می‌کنم* betekent: ik begin met mijn werk.'
    example_gloss: Mijn werk is op kantoor.
  prs.a2.unit35.lesson06.teach.morning_turn01:
    title: Nasrin vraagt hoe laat Yusuf wakker wordt
    gloss: Yusuf, hoe laat word je elke ochtend wakker?
    note: '*هر صبح* betekent elke ochtend. *چه وقت* vraagt wanneer en *بیدار می‌شوی* betekent: je wordt wakker (tegen een vriend).'
  prs.a2.unit35.lesson06.teach.morning_turn02:
    title: Yusuf noemt de tijd en een eerste stap
    gloss: Om zes uur. Nadat ik wakker ben geworden, neem ik een douche.
    note: 'Het is een gewoonte, dus de werkwoorden na *بعد از اینکه* staan in de tegenwoordige tijd met *می‌*: *بیدار می‌شوم*, daarna *دوش می‌گیرم*.'
  prs.a2.unit35.lesson06.teach.morning_turn03:
    title: Nasrin vraagt wat er daarna komt
    gloss: Wat doe je daarna?
    note: '*بعد از آن* betekent daarna. Het verwijst terug naar de stap die net genoemd is.'
  prs.a2.unit35.lesson06.teach.morning_turn04:
    title: Yusuf noemt de volgende stappen
    gloss: Ik kleed me aan. Voordat ik naar kantoor ga, ontbijt ik.
    note: '*لباس می‌پوشم* is de volgende stap. Daarna volgt een bijzin met *قبل از اینکه*: *بروم* is de aanvoegende wijs en *صبحانه می‌خورم* is het hoofdwerkwoord.'
  prs.a2.unit35.lesson06.teach.morning_turn05:
    title: Nasrin vraagt naar de tijd van kantoor
    gloss: Hoe laat ga je naar kantoor?
    note: '*ساعت چند* vraagt naar de tijd en *می‌روی* betekent: je gaat.'
  prs.a2.unit35.lesson06.teach.morning_turn06:
    title: Yusuf zegt wat hij op kantoor doet
    gloss: Om acht uur. Als ik er aankom, begin ik eerst met mijn werk.
    note: '*وقتی که می‌رسم* betekent: als ik aankom (een gewoonte: elke dag), en *اول کارم را شروع می‌کنم* betekent: eerst begin ik met mijn werk.'
  prs.a2.unit35.lesson06.teach.summary:
    title: De drie voegwoorden samen
    gloss: voordat ik ga; nadat ik aankwam; toen ik aankwam
    note: 'Drie voegwoorden, drie patronen. *قبل از اینکه* + aanvoegende wijs (*بروم*): het werkwoord is de vorm met *ب-*. *بعد از اینکه* + verleden tijd (*رسیدم*) in een verhaal, of de tegenwoordige tijd bij een gewoonte (*بیدار می‌شوم*): de eerste gebeurtenis is afgelopen. *وقتی که* + verleden tijd, tegenwoordige tijd of aanvoegende wijs: de werkwoordstijd laat zien of het om één keer gaat, een gewoonte of iets wat nog moet komen. Bij een zelfstandig naamwoord gebruik je *قبل از* of *بعد از* alleen.'
