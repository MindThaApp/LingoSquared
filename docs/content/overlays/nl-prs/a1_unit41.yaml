    example_gloss: Mijn tas is kwijt.
  prs.a1.unit41.lesson01.teach.wallet_lost_phrase:
    title: Mijn portemonnee is kwijt!
    gloss: Mijn portemonnee is kwijt!
    note: کیف پولم combineert کیف پول met het bezitssuffix -م (mijn), hetzelfde patroon als خانه‌ام (mijn huis) uit eerdere units.
  prs.a1.unit41.lesson02.teach.review_can_help:
