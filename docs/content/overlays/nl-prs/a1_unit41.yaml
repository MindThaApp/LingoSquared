    target_text: این (dit) / است (is)
  prs.a1.unit41.lesson01.teach.review_have:
    title: 'Herhaling: ik heb'
    gloss: ik heb
    note: دارم is een herhalingswoord waarmee je zegt welk voorwerp je hebt of bij je hebt.
    target_text: دارم (ik heb)
  prs.a1.unit41.lesson01.teach.bag_word:
    title: Tas
    gloss: tas
    note: خریطه is het gewone Dari-woord voor een tas.
    example_gloss: Ik heb een tas.
  prs.a1.unit41.lesson01.teach.wallet_word:
    title: Portemonnee
    gloss: portemonnee
    note: کیف پول betekent portemonnee en is letterlijk een samenstelling van کیف (tasje/etui) en پول (geld).
    example_gloss: Ik heb een portemonnee.
  prs.a1.unit41.lesson01.teach.key_word:
    title: Sleutel
    gloss: sleutel
    note: کلید betekent sleutel.
