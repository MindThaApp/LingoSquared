course:
  title: Dari in het Nederlands A1
  description: 'Beginnersniveau Kabul-Dari: meld dat een persoonlijk bezit kwijt is, vraag of het gevonden is, beschrijf het voorwerp naar kleur en grootte en lees een korte tekst over een voorwerp op het verlorenvoorwerpenbureau.'
units:
  prs.a1.unit41.lost_items:
    title: Verloren spullen
    description: Meld dat je iets kwijt bent, vraag of het gevonden is, beschrijf het en herken het wanneer het terecht is.
