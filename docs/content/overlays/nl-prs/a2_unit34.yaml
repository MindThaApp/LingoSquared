course:
  title: Dari A2
  description: 'Afghaans Dari voor lager gevorderden: een reden en een gevolg in één bericht geven. Redenen met چون (en زیرا om te lezen), gevolgen met به همین دلیل / برای همین en بنابراین, en به دلیل plus een zelfstandig naamwoord, met woordenschat voor excuses en gewijzigde plannen.'
units:
  prs.a2.unit34.because_so:
    title: Omdat en dus
lessons:
  prs.a2.unit34.lesson01.ask_and_give_reasons:
    title: Waarom? Omdat…
  prs.a2.unit34.lesson02.order_and_not_coming:
    title: Volgorde van de zinsdelen en "ik kwam niet"
  prs.a2.unit34.lesson03.because_of_this:
    title: 'Daarom: به همین دلیل en برای همین'
  prs.a2.unit34.lesson04.because_of_and_therefore:
    title: به دلیل, بنابراین en زیرا
  prs.a2.unit34.lesson05.reading_and_listening:
    title: Lezen en luisteren over redenen
  prs.a2.unit34.lesson06.change_of_plan:
    title: Een gesprek over een gewijzigd plan
teaching:
  prs.a2.unit34.lesson01.teach.headache:
    title: Hoofdpijn
    gloss: hoofdpijn
    note: '*سردرد* is hoofdpijn. Je zegt *سردرد دارم* (ik heb hoofdpijn) en *سردرد داشتم* (ik had hoofdpijn). Het is een heel gangbare reden als je iets niet kunt doen.'
    example_gloss: Gisteren had ik hoofdpijn.
  prs.a2.unit34.lesson01.teach.tired:
    title: Moe
    gloss: moe
    note: '*خسته* is moe. Het is een bijvoeglijk naamwoord, dus het staat bij *استم* (ik ben) en *بودم* (ik was): *خسته بودم* is ik was moe.'
    example_gloss: Vandaag ben ik erg moe.
  prs.a2.unit34.lesson01.teach.busy:
    title: Bezet
    gloss: druk, bezet
    note: '*مصروف* is druk. *مصروف بودم* is ik had het druk. Het is de gebruikelijke korte reden om een afspraak of bezoek te missen.'
    example_gloss: Deze week heb ik het druk.
  prs.a2.unit34.lesson01.teach.weather:
    title: Weer
    gloss: weer, lucht
    note: '*هوا* is het weer en ook de lucht. *هوا خوب است* is het weer is goed.'
    example_gloss: Vandaag is het mooi weer.
  prs.a2.unit34.lesson01.teach.cold:
    title: Koud
    gloss: koud
    note: '*سرد* is koud. *هوا سرد است* is het is koud, over het weer.'
    example_gloss: '''s Nachts is het koud.'
  prs.a2.unit34.lesson01.teach.excuse:
    title: Excuus
    gloss: excuus, opgegeven reden
    note: '*عذر* is de reden die je geeft om iets niet te doen, een excuus. Een goed *عذر* is een antwoord op de vraag *چرا؟*.'
    example_gloss: Zijn excuus was hoofdpijn.
  prs.a2.unit34.lesson01.teach.why_because:
    title: Waarom vragen en omdat antwoorden
    gloss: Waarom ging je niet naar kantoor? Omdat ik moe was.
    note: '*چرا* vraagt naar een reden en *چون* geeft die. Het antwoord kan een hele bijzin zijn: *چون خسته بودم* (omdat ik moe was). In een kort antwoord herhaal je de rest van de vraag niet. Na *چون* verandert er niets in de zin: het werkwoord blijft aan het eind, zoals in elke Dari-zin.'
  prs.a2.unit34.lesson01.teach.reason_sentence:
    title: Ik ging niet naar kantoor omdat ik ziek was
    gloss: Ik ging niet naar kantoor omdat ik ziek was.
    note: 'Dit is het patroon van de unit: eerst wat er gebeurde, dan een komma, dan *چون* en de reden. De twee delen kunnen ook van plaats wisselen: *چون مریض بودم، به دفتر نرفتم*.'
  prs.a2.unit34.lesson02.teach.friends:
    title: Marjan en Haroon
    gloss: Marjan en Haroon zijn vrienden.
    note: 'Marjan en Haroon zijn de twee vrienden in deze unit. Ze spreken elkaar aan met *تو*. De uitgang *-ند* van *استند* is het meervoud van *است*: ze zijn.'
  prs.a2.unit34.lesson02.teach.came:
    title: 'Komen: de verleden tijd'
    gloss: ik kwam, jij kwam, hij/zij kwam, wij kwamen, jullie kwamen (beleefd of meervoud), zij kwamen
    note: 'Het verleden van *آمدن* is *آمدم، آمدی، آمد، آمدیم، آمدین، آمدند*. Waar je naartoe kwam, zeg je met *به*: *به جلسه آمدم* is ik kwam naar de vergadering. De uitgangen zijn dezelfde als bij elk ander werkwoord in de verleden tijd dat je kent.'
  prs.a2.unit34.lesson02.teach.did_not_come:
    title: 'Ik kwam niet: ن + یامد'
    gloss: ik kwam niet, jij kwam niet, hij/zij kwam niet, wij kwamen niet, jullie kwamen niet, zij kwamen niet
    note: 'De ontkenning van *آمدن* in de verleden tijd is *نیامدم* (ik kwam niet). Zet *ن* voor het werkwoord: *نـ + آمدم* wordt *نیامدم*, met een *ی* tussen de twee *ا*-klanken. De andere vormen zijn *نیامدی، نیامد، نیامدیم، نیامدین، نیامدند*. Bij *رفتن* is het eenvoudig: *نرفتم، نرفتی، نرفت*.'
  prs.a2.unit34.lesson02.teach.stay:
    title: Blijven
    gloss: blijven, achterblijven
    note: '*ماندن* is blijven. Het verleden is *ماندم، ماندی، ماندیم* en het heden is *می‌مانم، می‌مانی، می‌مانیم*. *در خانه ماندم* is ik bleef thuis, een heel gangbaar gevolg bij slecht weer of ziekte.'
    example_gloss: Vandaag blijf ik thuis.
  prs.a2.unit34.lesson02.teach.either_order:
    title: De reden kan voorop of achteraan staan
    gloss: Omdat het koud is, blijf ik thuis. / Ik blijf thuis omdat het koud is.
    note: 'De bijzin met *چون* kan voor of na de hoofdzin staan, de betekenis blijft hetzelfde. Staat hij voorop, zet er dan een komma achter: *چون هوا سرد است، در خانه می‌مانم*. Het werkwoord blijft in beide gevallen aan het eind van elke zin(sdeel) staan, dus de woordvolgorde binnen de zinsdelen verandert niet.'
  prs.a2.unit34.lesson02.teach.sorry:
    title: Het spijt me, ik kwam niet naar de vergadering
    gloss: Het spijt me, ik kwam niet naar de vergadering.
    note: '*متأسفم* is het spijt me. Mensen zeggen het vaak eerst en geven daarna de reden met *چون*.'
  prs.a2.unit34.lesson02.teach.stayed_home:
    title: Omdat ik moe was, bleef ik thuis
    gloss: Omdat ik moe was, bleef ik thuis.
    note: De reden (*خسته بودم*) staat in de verleden tijd en het gevolg (*در خانه ماندم*) ook.
  prs.a2.unit34.lesson03.teach.so_dalil:
    title: 'به همین دلیل: om die reden, dus'
    gloss: Ik had het druk. Daarom kwam ik niet.
    note: '*به همین دلیل* geeft het gevolg van wat je net zei. Het betekent om diezelfde reden, daarom. Het begint de tweede zin: eerst de reden (*مصروف بودم*), dan het gevolg (*به همین دلیل نیامدم*). Het is het spiegelbeeld van *چون*: *چون* leidt de reden in, *به همین دلیل* het gevolg.'
  prs.a2.unit34.lesson03.teach.so_hamin:
    title: 'برای همین: daarom'
    gloss: Het was koud. Daarom bleven we thuis.
    note: '*برای همین* betekent hetzelfde als *به همین دلیل* en is korter. Het is gangbaar in gesprekken, terwijl *به همین دلیل* wat zorgvuldiger klinkt. Je kunt *و* voor beide zetten: *هوا سرد بود و برای همین در خانه ماندیم*.'
  prs.a2.unit34.lesson03.teach.because_vs_so:
    title: Twee manieren om hetzelfde te zeggen
    gloss: Omdat ik ziek was, kwam ik niet. / Ik was ziek. Daarom kwam ik niet.
    note: 'Deze twee zinnen zeggen hetzelfde. Met *چون* staat de reden aan het begin of aan het eind van één zin. Met *به همین دلیل* heb je twee zinnen: eerst de reden, dan het gevolg. De reden heeft altijd dezelfde betekenis. Gebruik één verbindingswoord per verband: zet *چون* en *به همین دلیل* niet in dezelfde zin.'
  prs.a2.unit34.lesson03.teach.busy_not_come:
    title: Ik had het druk. Daarom ben ik niet gekomen
    gloss: Ik had het druk. Daarom kwam ik niet.
    note: 'Een kort bericht om je afwezigheid uit te leggen: eerst de reden, dan het gevolg.'
  prs.a2.unit34.lesson03.teach.cold_stayed:
    title: Het was koud. Daarom bleven we thuis
    gloss: Het was koud. Daarom bleven we thuis.
    note: 'Hetzelfde patroon met *برای همین*. *ماندیم* betekent: we bleven.'
  prs.a2.unit34.lesson03.teach.car_broken:
    title: Mijn auto was kapot. Daarom kwam ik te laat
    gloss: Mijn auto was kapot. Daarom kwam ik te laat.
    note: 'Het gevolg kan een andere soort handeling zijn: niet alleen thuisblijven, maar ook te laat komen.'
  prs.a2.unit34.lesson04.teach.be_dalil:
    title: 'به دلیل + zelfstandig naamwoord: vanwege'
    gloss: vanwege de sneeuw, vanwege hoofdpijn, vanwege werk
    note: '*به دلیل* betekent ''vanwege'' en wordt gevolgd door een zelfstandig naamwoord, niet door een hele bijzin: *به دلیل برف* (vanwege de sneeuw), *به دلیل سردرد* (vanwege hoofdpijn). De zin die erop volgt is het gevolg. *به دلیل برف* doet hetzelfde als *چون برف می‌بارید*, maar met minder woorden. Gebruik *چون* als je een werkwoord hebt en *به دلیل* als je alleen een zelfstandig naamwoord hebt.'
  prs.a2.unit34.lesson04.teach.snow_cancel:
    title: Vanwege de sneeuw is de vergadering afgelast
    gloss: Vanwege de sneeuw is de vergadering afgelast.
    note: '*لغو شد* betekent: is afgelast. De zinsdeel met *به دلیل* staat vaak voorop en wordt gevolgd door een komma.'
  prs.a2.unit34.lesson04.teach.headache_office:
    title: Vanwege hoofdpijn ben ik niet naar kantoor gegaan
    gloss: Vanwege hoofdpijn ben ik niet naar kantoor gegaan.
    note: 'Hetzelfde patroon met een ander zelfstandig naamwoord. Je kunt het ook achteraan zetten: *به دفتر نرفتم، به دلیل سردرد*.'
  prs.a2.unit34.lesson04.teach.change_plan:
    title: Veranderen
    gloss: veranderen, wijzigen
    note: '*تغییر دادن* betekent iets veranderen. Wat je verandert, staat met *را* voor het werkwoord: *برنامه را تغییر دادیم* betekent: we hebben het plan veranderd. De verleden tijd is *دادم، دادی، دادیم* en de tegenwoordige tijd is *می‌دهیم*: *برنامه را تغییر می‌دهیم* betekent: we veranderen het plan.'
    example_gloss: We hebben het plan veranderd.
  prs.a2.unit34.lesson04.teach.banabarin:
    title: 'بنابراین: daarom'
    gloss: De weg was afgesloten. Daarom reed de bus niet.
    note: '*بنابراین* betekent ''daarom'' en begint een zin die het gevolg geeft: eerst de reden, dan *بنابراین* en het gevolg. Het doet hetzelfde als *به همین دلیل*, maar is formeler. Je vindt het vooral in geschreven berichten, mededelingen en rapporten. In gesproken taal gebruikt men liever *برای همین* of *به همین دلیل*.'
  prs.a2.unit34.lesson04.teach.zira:
    title: 'زیرا: want, omdat (schrijftaal)'
    gloss: De vergadering is afgelast, omdat de manager niet kwam.
    note: '*زیرا* betekent ook ''omdat'', maar je ziet het in geschreven taal, niet in gesproken taal. Het staat meestal na het gevolg en een komma: eerst het gevolg, dan *زیرا* en de reden. Gebruik *چون* als je praat of een bericht aan een vriend schrijft. *زیرا* hoef je alleen te herkennen.'
  prs.a2.unit34.lesson04.teach.connectors:
    title: Woorden voor reden en woorden voor gevolg
    gloss: 'omdat, omdat (schrijftaal), vanwege: de reden. daarom, daarom, dus: het gevolg.'
    note: Sorteer de woorden op hun functie. *چون*, *زیرا* en *به دلیل* horen bij de reden. *به همین دلیل*, *برای همین* en *بنابراین* horen bij het gevolg. In gesprekken gebruik je *چون* en *برای همین*. In een formeel bericht gebruik je *زیرا*, *به دلیل* en *بنابراین*.
  prs.a2.unit34.lesson05.teach.meeting_today:
    title: Vergadering (verbindingsvorm)
    gloss: vergadering van ... (verbindingsvorm)
    note: 'Als na *جلسه* een ander woord komt dat het beschrijft, verbindt een klein teken (de hamza op de laatste *ه*) die twee: *جلسهٔ امروز* is de vergadering van vandaag. In alledaags schrift laat men dit teken vaak weg.'
    example_gloss: De vergadering van vandaag is om tien uur.
  prs.a2.unit34.lesson05.teach.niloufar:
    title: Niloufar (naam)
    gloss: Niloufar (een meisjesnaam)
    note: '*نیلوفر* is een meisjesnaam. Zij schrijft het bericht dat je gaat lezen.'
    example_gloss: Niloufar werkt op een kantoor.
  prs.a2.unit34.lesson05.teach.d1_t1:
    title: Marjan vraagt Haroon waarom hij niet kwam
    gloss: Haroon, waarom ben je gisteren niet naar de vergadering gekomen?
    note: Marjan vraagt *چرا* met de ontkennende verleden tijd *نیامدی*. Ze praat met een vriend, dus gebruikt ze *تو*.
  prs.a2.unit34.lesson05.teach.d1_t2:
    title: Haroon legt het uit
    gloss: Het spijt me. Ik had hoofdpijn, dus ik bleef thuis.
    note: Haroon biedt zijn excuses aan, geeft de reden (*سردرد داشتم*) en het gevolg (*به همین دلیل در خانه ماندم*) in twee korte zinnen.
  prs.a2.unit34.lesson05.teach.d1_t3:
    title: Marjan vraagt naar het telefoontje
    gloss: Waarom heb je niet gebeld?
    note: '*تیلفون نکردی* betekent: je hebt niet gebeld. Ze vraagt met *چرا* om nog een reden.'
  prs.a2.unit34.lesson05.teach.d1_t4:
    title: Haroon geeft een tweede reden
    gloss: Omdat mijn telefoon kapot was.
    note: 'Een kort antwoord: *چون* en de reden, verder niets.'
  prs.a2.unit34.lesson05.teach.d1_t5:
    title: Marjan reageert
    gloss: Wat jammer! Gaat het nu goed met je?
    note: '*چه بد!* is een vriendelijke reactie op slecht nieuws. *استی* is de informele vorm van ''je bent''.'
  prs.a2.unit34.lesson05.teach.d1_t6:
    title: Haroon antwoordt
    gloss: Ja, nu gaat het goed met me.
    note: '*استم* betekent: ik ben.'
  prs.a2.unit34.lesson05.teach.message:
    title: Een bericht van Niloufar
    gloss: Hallo Marjan. Het spijt me, de vergadering van vandaag is afgelast, omdat de manager niet op kantoor kwam. Vanwege de sneeuw was de weg afgesloten. Daarom is de vergadering donderdag. Niloufar
    note: 'Een kort geschreven bericht. Het gebruikt de woorden voor reden uit de schrijftaal: *زیرا* voor de reden, *به دلیل برف* voor een oorzaak die een zelfstandig naamwoord is, en *بنابراین* voor het gevolg.'
  prs.a2.unit34.lesson06.teach.d2_t1:
    title: Haroon stelt een dag voor
    gloss: Marjan, zullen we woensdag naar het park gaan?
    note: 'De tegenwoordige tijd *می‌رویم* met een dag van de week is een plan: we gaan woensdag. Bij de vraag gaat je stem aan het eind omhoog.'
  prs.a2.unit34.lesson06.teach.d2_t2:
    title: Marjan geeft een reden
    gloss: Woensdag niet, want het gaat sneeuwen.
    note: Marjan weigert met *نه* en geeft de reden met *چون*. De tegenwoordige tijd *برف می‌بارد* gebruikt men ook om over het weer van morgen te praten.
  prs.a2.unit34.lesson06.teach.d2_t3:
    title: Haroon verandert het plan
    gloss: Dan veranderen we het plan. Gaan we donderdag?
    note: '*پس* betekent: dan, dus. *برنامه را تغییر می‌دهیم* betekent: we veranderen het plan.'
  prs.a2.unit34.lesson06.teach.d2_t4:
    title: Marjan kan donderdag niet
    gloss: Ik heb donderdag een vergadering, dus ik kan niet.
    note: 'Reden (*جلسه دارم*) en gevolg (*به همین دلیل نمی‌توانم*) in één zin, met een komma ertussen. *نمی‌توانم* betekent: ik kan niet.'
  prs.a2.unit34.lesson06.teach.d2_t5:
    title: Haroon kiest een andere dag
    gloss: Goed, dan gaan we vrijdag.
    note: '*پس* betekent hier ''dan'': het is afgesproken.'
  prs.a2.unit34.lesson06.teach.d2_t6:
    title: Marjan stemt in
    gloss: Ja, vrijdag is goed.
    note: '*جمعه خوب است* betekent: vrijdag is goed. Je zegt het om met een plan in te stemmen.'
