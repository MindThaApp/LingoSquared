course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor lager-gevorderden: beleefde verzoeken doen met می‌شود که en لطفاً, hulp aanbieden, beleefd aannemen of afslaan, en iemand vragen iets niet te doen met de ontkennende gebiedende wijs (نکنین).'
units:
  prs.a2.unit31.polite_requests:
    title: Zou u ...? Beleefde verzoeken en aanbiedingen
lessons:
  prs.a2.unit31.lesson01.polite_request:
    title: Zou u ...? Beleefde verzoeken
  prs.a2.unit31.lesson02.please_and_commands:
    title: Alstublieft en de gebiedende wijs
  prs.a2.unit31.lesson03.offers_and_replies:
    title: Hulp aanbieden, aannemen en afslaan
  prs.a2.unit31.lesson04.dont:
    title: 'Niet ...: de ontkennende gebiedende wijs'
  prs.a2.unit31.lesson05.reading_and_listening:
    title: Lezen en luisteren over een buurman
  prs.a2.unit31.lesson06.shop_call:
    title: Een telefoontje naar de winkel
teaching:
  prs.a2.unit31.lesson01.teach.neighbour:
    title: Buurman
    gloss: buurman, buurvrouw
    note: '*همسایه* is een buurman of buurvrouw. Buren vragen elkaar vaak om kleine gunsten, dus dit is de eerste persoon aan wie je beleefde verzoeken doet.'
    example_gloss: Onze buurman is heel aardig.
  prs.a2.unit31.lesson01.teach.shopkeeper:
    title: Winkelier
    gloss: winkelier
    note: '*دوکاندار* is de persoon die in een *دوکان* (winkel) werkt. Je vraagt de *دوکاندار* om wat je nodig hebt en hij of zij biedt je misschien meer aan.'
    example_gloss: De winkelier is in de winkel.
  prs.a2.unit31.lesson01.teach.milk:
    title: Melk
    gloss: melk
    note: '*شیر* is melk. Je vraagt er vaak om in een winkel, net als om *نان* (brood).'
    example_gloss: Ik drink elke dag melk.
  prs.a2.unit31.lesson01.teach.bag:
    title: Tas
    gloss: tas, draagtas
    note: '*کیسه* is een tas, bijvoorbeeld de tas waar de winkelier je boodschappen in doet.'
    example_gloss: Ik heb een tas brood gekocht.
  prs.a2.unit31.lesson01.teach.frame:
    title: 'Het beleefde verzoek: می‌شود که ...؟'
    gloss: 'Zou u me een beetje brood kunnen geven? (letterlijk: Is het mogelijk dat u een beetje brood geeft?)'
    note: 'Om iemand beleefd om iets te vragen, begin je met *می‌شود که* (is het mogelijk dat) en zet je het werkwoord in de conjunctief: *می‌شود که کمی نان بدهین؟* Het werkwoord na *که* heeft dezelfde vorm als na *باید*. Het eindigt op *-ین* als je beleefd bent tegen één persoon of tegen meerdere mensen praat (*شما*). Een verzoek is een vraag, dus de zin eindigt met *؟*. In gesproken taal kan *که* wegvallen: *می‌شود کمی نان بدهین؟*. Je kunt ook vragen met *می‌توانین*: *می‌توانین کمی نان بدهین؟*'
  prs.a2.unit31.lesson01.teach.subj:
    title: De conjunctief van دادن
    gloss: dat ik geef, dat jij geeft, dat hij/zij geeft, dat wij geven, dat u geeft (beleefd) of dat jullie geven, dat zij geven
    note: 'De conjunctief bestaat uit *ب* plus de tegenwoordige stam plus de uitgangen *-م، -ی، -د، -یم، -ین، -ند*. Bij *دادن* is de stam *ده*, dus krijg je *بدهم، بدهی، بدهد، بدهیم، بدهین، بدهند*. Voor een verzoek aan een buur of een winkelier heb je de *-ین*-vorm nodig: *بدهین*.'
  prs.a2.unit31.lesson01.teach.subj_more:
    title: Verzoeken met andere werkwoorden
    gloss: geven, brengen, sturen, nemen/pakken, wegbrengen, zeggen, doen
    note: 'Zet dezelfde *-ین*-conjunctief na *می‌شود که* bij elk werkwoord: *بیاورین* (breng), *بفرستین* (stuur), *بگیرین* (pak), *ببرین* (breng iets naar een plaats), *بگویین* (zeg) en *کنین* (doe). Werkwoorden met *کردن* gebruiken *کنین* na het eerste woord: *کمک کنین* (help), *صبر کنین* (wacht), *تیلفون کنین* (bel), *باز کنین* (open).'
  prs.a2.unit31.lesson01.teach.help_req:
    title: Kunt u helpen?
    gloss: Kunt u helpen?
    note: '*می‌شود که کمک کنین؟* is de gewone manier om een buur om hulp te vragen. Begin met *ببخشین* (pardon) als je de persoon niet goed kent.'
  prs.a2.unit31.lesson01.teach.bag_req:
    title: Pardon, kunt u mij een tas geven?
    gloss: Pardon, kunt u mij een tas geven?
    note: '*ببخشین* is een beleefde opening en geen echte verontschuldiging. Dan volgt het verzoek: *می‌شود که یک کیسه بدهین؟*'
  prs.a2.unit31.lesson01.teach.yes_sure:
    title: Ja, natuurlijk
    gloss: Ja, natuurlijk.
    note: '*بلی، حتماً.* is een beleefd ja op een verzoek. *البته.* (natuurlijk) betekent hetzelfde.'
  prs.a2.unit31.lesson02.teach.table:
    title: Tafel
    gloss: tafel
    note: '*میز* is een tafel. Misschien heb je hulp nodig om hem te dragen of te verplaatsen.'
    example_gloss: De tafel staat in de kamer.
  prs.a2.unit31.lesson02.teach.here:
    title: Hier
    gloss: hier
    note: '*اینجا* betekent hier, op deze plek. Het tegenovergestelde is *آنجا* (daar).'
    example_gloss: De sleutel is hier.
  prs.a2.unit31.lesson02.teach.imp_pl:
    title: De beleefde gebiedende wijs met -ین
    gloss: kom, ga, geef, zeg, neem, breng, doe (tegen een buur of tegen meerdere mensen)
    note: 'Een bevel aan *شما* (een buur, een oudere persoon of meerdere mensen) eindigt op *-ین*: *بیایین* (kom), *بروین* (ga), *بدهین* (geef), *بگویین* (zeg), *بگیرین* (neem), *بیاورین* (breng), *کنین* (doe). Het is dezelfde vorm als de conjunctief die je na *می‌شود که* gebruikte.'
  prs.a2.unit31.lesson02.teach.imp_sg:
    title: De gebiedende wijs tegen een vriend (zonder uitgang)
    gloss: kom, ga, geef, zeg, neem, breng, doe (tegen een vriend of een kind)
    note: 'Tegen één vriend of een kind laat je de *-ین* weg: *بیا، برو، بده، بگو، بگیر، بیاور، کن*. Dit is de kale vorm en die klinkt op zichzelf bot, dus gebruik hem alleen tegen mensen die je *تو* noemt. Gebruik tegen een buur of een winkelier altijd de *-ین*-vorm.'
  prs.a2.unit31.lesson02.teach.imp_rule:
    title: Hoe de gebiedende wijs wordt gevormd
    gloss: 'Het patroon: b + tegenwoordige stam'
    note: De gebiedende wijs is *ب* plus de tegenwoordige stam (*رو، ده، گو، گیر*), en voor *شما* komt er *-ین* bij. Het werkwoord *کردن* heeft geen *ب* (*کن، کنین*) en *آمدن* heeft *بیا، بیایین*. *آوردن* is *بیاور* tegen een vriend en *بیاورین* in de beleefde vorm.
  prs.a2.unit31.lesson02.teach.please_wait:
    title: Wacht u even, alstublieft
    gloss: Wacht u even, alstublieft.
    note: '*لطفاً* (alstublieft) staat aan het begin van een bevel en maakt het beleefd: *لطفاً کمی صبر کنین.*'
  prs.a2.unit31.lesson02.teach.please_bring:
    title: Breng alstublieft de tas
    gloss: Breng alstublieft de tas.
    note: 'Het lijdend voorwerp staat voor het werkwoord en krijgt *را* als het om iets bepaalds gaat: *کیسه را بیاورین*.'
  prs.a2.unit31.lesson02.teach.please_table:
    title: Breng deze tafel alstublieft naar de kamer
    gloss: Breng deze tafel alstublieft naar de kamer.
    note: '*ببرین* betekent iets naar een plaats brengen. *به اتاق* zegt waarheen.'
  prs.a2.unit31.lesson02.teach.two_ways:
    title: Twee manieren om te vragen
    gloss: Open de poort alstublieft. / Pardon, kunt u de poort openen?
    note: '*لطفاً* plus de gebiedende wijs is kort en direct en is prima als de ander het verwacht te doen, bijvoorbeeld een winkelier. *می‌شود که ...؟* is zachter en beter voor een gunst van een buur. Beide zijn beleefd.'
  prs.a2.unit31.lesson03.teach.offer_forms:
    title: 'Hulp aanbieden: het werkwoord met -م'
    gloss: Zal ik helpen? Zal ik thee brengen? Zal ik er ook een tas bij geven? Zal ik ook thee sturen?
    note: 'Om iets aan te bieden, stel je een vraag met de *من*-vorm van de conjunctief: *کنم* (dat ik doe), *بیاورم* (dat ik breng), *بدهم* (dat ik geef), *بفرستم* (dat ik stuur). *کمک کنم؟* betekent: Zal ik helpen? Je kunt *هم* (ook) toevoegen: *کیسه هم بدهم؟*'
  prs.a2.unit31.lesson03.teach.want_that:
    title: Wilt u dat ik help?
    gloss: Wilt u dat ik help?
    note: '*می‌خواهین که ...؟* is een andere manier om iets aan te bieden. Je vraagt of de ander het wil, en het werkwoord na *که* staat weer in de *-م*-vorm.'
  prs.a2.unit31.lesson03.teach.offer_vs_request:
    title: Aanbod of verzoek?
    gloss: Zal ik thee brengen? / Breng alstublieft thee.
    note: 'De uitgang laat zien wie de handeling uitvoert. *بیاورم* (ik breng) is een aanbod: ik doe het voor u. *بیاورین* (u brengt) is een verzoek: u doet het voor mij. Dus *کیسه هم بدهم؟* is de winkelier die iets aanbiedt en *کیسه بدهین* is de klant die erom vraagt.'
  prs.a2.unit31.lesson03.teach.sugar:
    title: Suiker
    gloss: suiker
    note: '*قند* is suiker. In Afghanistan drinken mensen thee met of zonder *قند*.'
    example_gloss: Thee met suiker is lekker.
  prs.a2.unit31.lesson03.teach.kindness:
    title: Vriendelijkheid
    gloss: vriendelijkheid, gunst
    note: '*لطف* is vriendelijkheid. *لطف می‌کنین* is een beleefde manier om te bedanken: u bent zo vriendelijk.'
    example_gloss: Dank u voor uw vriendelijkheid.
  prs.a2.unit31.lesson03.teach.self:
    title: Zelf
    gloss: zelf, in mijn eentje
    note: '*خودم* betekent ''zelf''. *خودم می‌کنم* betekent ''ik doe het zelf''.'
    example_gloss: Ik doe het werk zelf.
  prs.a2.unit31.lesson03.teach.yes_please:
    title: Ja, graag
    gloss: Ja, graag.
    note: Hiermee neem je een aanbod aan. Na *بلی* kun je *تشکر* toevoegen.
  prs.a2.unit31.lesson03.teach.yes_kind:
    title: Ja, dank je, dat is aardig
    gloss: Ja, graag. Dat is aardig van u.
    note: Een hartelijkere manier om iets aan te nemen. Met *لطف می‌کنین* zeg je dat de ander vriendelijk is.
  prs.a2.unit31.lesson03.teach.no_thanks:
    title: Nee, dank je
    gloss: Nee, dank u.
    note: De eenvoudigste beleefde weigering. Voeg altijd *تشکر* toe; een kale *نه* klinkt kortaf.
  prs.a2.unit31.lesson03.teach.no_need:
    title: Dat is niet nodig
    gloss: Dat is niet nodig.
    note: '*لازم نیست* betekent ''het is niet nodig''. Je gebruikt het om een aanbod vriendelijk af te slaan. Je kunt zeggen *نه، تشکر. لازم نیست.* of *خودم می‌کنم.*'
  prs.a2.unit31.lesson04.teach.neg_pl:
    title: 'Niet ...: de ontkennende gebiedende wijs met نـ'
    gloss: doe niet, ga niet, zeg niet, geef niet, neem niet, kom niet
    note: 'Om ''niet'' te zeggen zet je *نـ* op de gebiedende wijs in plaats van *بـ*: *بروین* wordt *نروین*, *بگویین* wordt *نگویین*, *بدهین* wordt *ندهین*, *بگیرین* wordt *نگیرین*. *کنین* heeft geen *بـ*, dus krijgt het gewoon *نـ* ervoor: *نکنین*. *بیایین* moet je extra onthouden: het wordt *نیایین*.'
  prs.a2.unit31.lesson04.teach.neg_sg:
    title: De ontkennende gebiedende wijs tegen een vriend
    gloss: doe niet, ga niet, zeg niet, geef niet, kom niet, neem niet
    note: 'Tegen een vriend geldt dezelfde regel zonder het einde: *نکن، نرو، نگو، نده، نیا، نگیر*. Een kale *نکن* klinkt bot, dus gebruik die alleen voor vrienden en kinderen. Zeg tegen een buurman of buurvrouw altijd *نکنین* en voeg *لطفاً* toe.'
  prs.a2.unit31.lesson04.teach.leave:
    title: 'Neerzetten, laten staan: بگذارین en نگذارین'
    gloss: zet neer/laat staan, zet neer/laat staan (beleefd); zet niet neer/laat niet staan, zet niet neer/laat niet staan (beleefd)
    note: '*گذاشتن* betekent iets ergens neerzetten, leggen of laten staan. *دروازه را باز بگذارین* is ''laat de poort open staan''; *دروازه را باز نگذارین* is ''laat de poort niet open staan''.'
  prs.a2.unit31.lesson04.teach.dont_late:
    title: Kom alstublieft niet te laat
    gloss: Wees alstublieft niet te laat.
    note: '*دیر کردن* betekent te laat zijn of er lang over doen. *لطفاً دیر نکنین* is een beleefde herinnering voordat iemand iets komt brengen of laat bezorgen.'
  prs.a2.unit31.lesson04.teach.dont_go:
    title: Ga morgen alstublieft niet
    gloss: Ga morgen alstublieft niet.
    note: '*لطفاً* plus een ontkennende gebiedende wijs is een beleefd verzoek om iets niet te doen.'
  prs.a2.unit31.lesson04.teach.dont_come_late:
    title: Kom alstublieft niet te laat
    gloss: Kom alstublieft niet te laat.
    note: '*نیایین* is de ontkennende vorm van *بیایین* (kom).'
  prs.a2.unit31.lesson04.teach.gate_open:
    title: Laat de poort alstublieft niet open staan
    gloss: Laat de poort alstublieft niet open staan.
    note: Een typisch verzoek aan een buurman of buurvrouw of aan een bezoeker van een winkel.
  prs.a2.unit31.lesson04.teach.park:
    title: Zet hier alstublieft geen auto neer
    gloss: Zet hier alstublieft geen auto neer.
    note: 'Nog een alledaags gebruik van *نگذارین*: parkeer hier alstublieft niet.'
  prs.a2.unit31.lesson04.teach.no_trouble:
    title: Doe alstublieft geen moeite
    gloss: Doe alstublieft geen moeite.
    note: '*زحمت کشیدن* betekent moeite doen. Mensen zeggen *لطفاً زحمت نکشین* als iemand thee of hulp aanbiedt, om beleefd en met dank te weigeren.'
  prs.a2.unit31.lesson04.teach.better_not:
    title: Het is beter om morgen niet te gaan
    gloss: Het is beter als u morgen niet gaat.
    note: '*بهتر است* (het is beter) is een zachtere manier om ''niet doen'' te zeggen. Het is een advies en geen bevel.'
  prs.a2.unit31.lesson05.teach.mrs:
    title: mevrouw
    gloss: mevrouw
    note: '*خانم* zet je als beleefde aanspreektitel voor de naam van een vrouw: *خانم رحیمه*.'
    example_gloss: Mevrouw Rahima is onze buurvrouw.
  prs.a2.unit31.lesson05.teach.mr:
    title: meneer
    gloss: meneer
    note: '*آقای* zet je voor de naam van een man: *آقای مسعود*.'
    example_gloss: Meneer Masood is in de winkel.
  prs.a2.unit31.lesson05.teach.flower:
    title: Bloem
    gloss: bloem
    note: '*گل* is een bloem. Voeg *‌ها* toe voor het meervoud en *-م* voor ''mijn'': *گل‌هایم* (mijn bloemen).'
    example_gloss: Mijn bloemen staan in huis.
  prs.a2.unit31.lesson05.teach.water:
    title: Water
    gloss: water
    note: '*آب* is water. *آب دادن* betekent een plant water geven: *به گل‌ها آب بدهین*.'
    example_gloss: Ik drink water.
  prs.a2.unit31.lesson05.teach.not_home:
    title: Ik ben tot vrijdag niet thuis
    gloss: Ik ben tot vrijdag niet thuis.
    note: '*نیستم* betekent ''ik ben niet''. *تا جمعه* betekent ''tot vrijdag''.'
  prs.a2.unit31.lesson05.teach.may_i:
    title: Mag ik ...?
    gloss: Mag ik de sleutel bij u laten?
    note: 'Met de *-م*-vorm vraagt *می‌شود که ...؟* om toestemming: *می‌شود که کلید را پیش شما بگذارم؟* betekent ''mag ik de sleutel bij u achterlaten?'' Met de *-ین*-vorm is het een verzoek aan de ander. Vergelijk *می‌شود که کمک کنم؟* (mag ik helpen?) met *می‌شود که کمک کنین؟* (kunt u helpen?).'
  prs.a2.unit31.lesson05.teach.people:
    title: Majida en Shafiq zijn buren
    gloss: Majida en Shafiq zijn buren.
    note: In de tekst hieronder laat Majida een briefje achter voor haar buurman Shafiq.
  prs.a2.unit31.lesson05.teach.d1_t1:
    title: Masood vraagt om hulp
    gloss: Goedendag mevrouw Rahima. Pardon, kunt u me vandaag een beetje helpen?
    note: Masood begint met een groet en *ببخشین* en vraagt dan met *می‌شود که* en de *-ین*-vorm *کنین*.
  prs.a2.unit31.lesson05.teach.d1_t2:
    title: Rahima stemt toe
    gloss: Goedendag meneer Masood. Natuurlijk. Wat moet ik doen?
    note: '*البته* is een beleefd ''ja''. *چه کار کنم؟* gebruikt de *-م*-vorm om te vragen wat zij moet doen.'
  prs.a2.unit31.lesson05.teach.d1_t3:
    title: Masood zegt wat hij nodig heeft
    gloss: Kunt u deze tafel met mij naar de kamer dragen?
    note: Een tweede verzoek, nu om iets specifieks. *با من* betekent 'met mij'.
  prs.a2.unit31.lesson05.teach.d1_t4:
    title: Rahima stemt in
    gloss: Ja, zeker.
    note: Een korte, hartelijke toestemming.
  prs.a2.unit31.lesson05.teach.d1_t5:
    title: Masood biedt thee aan
    gloss: Hartelijk dank. Zal ik thee brengen?
    note: '*خیلی تشکر* betekent ''hartelijk dank''. *چای بیاورم؟* is een aanbod met de *-م*-vorm.'
  prs.a2.unit31.lesson05.teach.d1_t6:
    title: Rahima slaat het af
    gloss: Nee, dank u. Doe alstublieft geen moeite.
    note: 'Rahima weigert met *نه، تشکر* en gebruikt dan de ontkennende gebiedende wijs *نکشین* om te zeggen: doe geen moeite.'
  prs.a2.unit31.lesson05.teach.message:
    title: Een briefje voor een buurman
    gloss: Goedendag meneer Shafiq. Morgen ga ik naar Mazar en tot vrijdag ben ik niet thuis. Mag ik mijn huissleutel bij u achterlaten? Wilt u mijn bloemen elke dag water geven? Laat de poort alstublieft niet open staan. Dank u voor uw vriendelijkheid. Majida
    note: Een kort briefje met een verzoek om toestemming, een verzoek en een ontkennend verzoek. Je ziet dat het dezelfde patronen gebruikt als het gesprek.
  prs.a2.unit31.lesson06.teach.d2_t1:
    title: Farzana belt de winkel
    gloss: Hallo. Kunt u twee broden en een pak melk naar ons huis sturen?
    note: Farzana belt de winkel. *الو* is 'hallo' aan de telefoon. *بفرستین* is de beleefde verzoekvorm van *فرستادن* (sturen).
  prs.a2.unit31.lesson06.teach.d2_t2:
    title: De winkelier stemt toe en vraagt hoe laat
    gloss: Ja, zeker. Hoe laat zal ik het sturen?
    note: De winkelier stemt toe en gebruikt de *-م*-vorm *بفرستم* om te vragen wanneer.
  prs.a2.unit31.lesson06.teach.d2_t3:
    title: Farzana noemt de tijd
    gloss: Om vijf uur. Wees alstublieft niet te laat.
    note: Farzana antwoordt met de tijd en voegt een ontkennende gebiedende wijs toe.
  prs.a2.unit31.lesson06.teach.d2_t4:
    title: De winkelier belooft het en biedt thee aan
    gloss: Nee, ik zal niet te laat zijn. Zal ik ook thee sturen?
    note: '*نه* sluit hier aan bij het ontkennende verzoek: nee, ik zal niet te laat zijn. Daarna biedt hij thee aan.'
  prs.a2.unit31.lesson06.teach.d2_t5:
    title: Farzana slaat het af
    gloss: Nee, dank u. Ik heb thee.
    note: 'Ze weigert en geeft een reden: ze heeft al thee.'
