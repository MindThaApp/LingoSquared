      status: correct
    feedback: '*فردا برف می‌بارد* betekent ''morgen sneeuwt het'': de gewone tegenwoordige tijd *می‌بارد* plus het tijdwoord *فردا*.'
  prs.a2.unit28.lesson01.exercise02.recognize_cold_tonight:
    instruction: Wat betekent deze zin?
    correct_option: Vanavond wordt het koud
    distractors:
