course:
  title: Dari A2
  description: 'Afghaans Dari voor beginners met wat basis: voorspellen wat er gaat gebeuren en een belofte doen. De gewone tegenwoordige tijd met een tijdswoord (فردا باران می‌بارد), misschien en waarschijnlijk met de aanvoegende wijs, beloften met حتماً en قول می‌دهم, en de geschreven toekomende tijd om voorspellingen en mededelingen te lezen.'
units:
  prs.a2.unit28.predictions_promises:
    title: Voorspellingen en beloften
lessons:
  prs.a2.unit28.lesson01.weather_predictions:
    title: Weer en voorspellingen met de tegenwoordige tijd
  prs.a2.unit28.lesson02.maybe_and_probably:
    title: Misschien en waarschijnlijk
  prs.a2.unit28.lesson03.promises:
    title: Beloften
  prs.a2.unit28.lesson04.sure_or_maybe:
    title: Zeker, waarschijnlijk, misschien
  prs.a2.unit28.lesson05.forecast_and_notice:
    title: Lezen en luisteren over het weer
  prs.a2.unit28.lesson06.meeting_conversation:
    title: Een gesprek over een afspraak
teaching:
  prs.a2.unit28.lesson01.teach.weather:
    title: Weer
    gloss: weer, lucht
    note: '*هوا* is het weer en ook de lucht. *هوای کابل* is het weer in Kabul: voeg *-ی* toe achter هوا om het met de plaats te verbinden.'
    example_gloss: Het weer in Kabul is vandaag koud.
  prs.a2.unit28.lesson01.teach.cold:
    title: Koud
    gloss: koud
    note: '*سرد* is koud. Het tegenovergestelde is *گرم* (warm, heet), een woord dat je al kent. *هوا سرد است* zegt dat het nu koud is; *هوا سرد می‌شود* zegt dat het koud wordt.'
    example_gloss: Morgenochtend wordt het koud.
  prs.a2.unit28.lesson01.teach.sunny:
    title: Zonnig
    gloss: zonnig
    note: '*آفتابی* is zonnig: *هوا آفتابی است* betekent: het is een zonnige dag.'
    example_gloss: Vandaag is het zonnig weer.
  prs.a2.unit28.lesson01.teach.cloudy:
    title: Bewolkt
    gloss: bewolkt
    note: '*ابری* is bewolkt. Wolken komen vaak vóór *باران* (regen) en *برف* (sneeuw).'
    example_gloss: Vanavond wordt het bewolkt.
  prs.a2.unit28.lesson01.teach.forecast:
    title: Voorspelling
    gloss: voorspelling
    note: '*پیش‌بینی* is een voorspelling. *پیش‌بینی هوا* is de weersvoorspelling. Dit is het woord op de radio, op tv en op je telefoon voordat je een reis plant.'
    example_gloss: Ik heb de weersvoorspelling gezien.
  prs.a2.unit28.lesson01.teach.tonight:
    title: Vanavond
    gloss: vanavond, vannacht
    note: '*امشب* is vanavond. Het is een tijdswoord, zoals *فردا* (morgen) en *امروز* (vandaag). Het is het eerste van de tijdswoorden die je gebruikt om te praten over wat er gaat gebeuren.'
    example_gloss: Vanavond gaat het regenen.
  prs.a2.unit28.lesson01.teach.dayafter:
    title: Overmorgen
    gloss: overmorgen
    note: '*پس‌فردا* is overmorgen. Het wordt geschreven met een kleine ruimte in het woord (de halve spatie), net als in *می‌شود*.'
    example_gloss: Overmorgen wordt het warm.
  prs.a2.unit28.lesson01.teach.predict_form:
    title: 'Een voorspelling: می‌ plus een tijdswoord'
    gloss: Morgen gaat het regenen. Vanavond wordt het koud. Overmorgen is het zonnig.
    note: 'Om te zeggen wat er gaat gebeuren, gebruik je de gewone tegenwoordige tijd met *می‌* en zet je een tijdswoord in de zin. Het werkwoord verandert niet: *می‌بارد* (het regent) en *فردا باران می‌بارد* (morgen gaat het regenen) hebben hetzelfde werkwoord. Het tijdswoord *فردا*, *امشب* of *پس‌فردا* laat de luisteraar weten dat het om de toekomst gaat. Voor het weer gebruik je vaak *می‌شود* (het wordt): *فردا هوا سرد می‌شود* betekent: morgen wordt het koud. Dit is de gewone gesproken manier om iets te voorspellen waar je vrij zeker van bent.'
  prs.a2.unit28.lesson01.teach.plans_form:
    title: Dezelfde vorm voor plannen en gebeurtenissen
    gloss: Morgen ga ik naar de bazaar. Volgende week gaan we naar Bamyan.
    note: 'Dezelfde tegenwoordige tijd met *می‌* en een tijdswoord werkt ook voor mensen: *فردا به بازار می‌روم* betekent: morgen ga ik naar de bazaar, en *هفتهٔ آینده به بامیان می‌رویم* betekent: volgende week gaan we naar Bamyan. Leer hier de vorm voor *ما*: *می‌رویم* (wij gaan). Andere tijdswoorden: *امسال* (dit jaar), *هفتهٔ آینده* (volgende week), *بعد* (later).'
  prs.a2.unit28.lesson01.teach.sentence:
    title: Morgen wordt het koud
    gloss: Morgen wordt het koud.
    note: 'Dit is het patroon van de hele unit: een tijdswoord, een onderwerp en een gewoon werkwoord met *می‌*. Je hebt geen aparte uitgang voor de toekomst nodig.'
  prs.a2.unit28.lesson02.teach.maybe:
    title: Misschien
    gloss: misschien
    note: '*شاید* betekent misschien. Het staat aan het begin van de zin en het werkwoord erna staat in de aanvoegende wijs (de vorm die je na *باید* gebruikt), omdat de spreker het niet zeker weet: *شاید برف ببارد* betekent: misschien gaat het sneeuwen. *ممکن است برف ببارد* betekent hetzelfde.'
    example_gloss: Misschien gaat het morgen regenen.
  prs.a2.unit28.lesson02.teach.probably:
    title: Waarschijnlijk
    gloss: waarschijnlijk, hoogstwaarschijnlijk
    note: '*احتمالاً* is sterker dan *شاید*: je denkt dat het eerder wel dan niet gebeurt. Het krijgt de gewone tegenwoordige tijd, niet de aanvoegende wijs: *احتمالاً امشب برف می‌بارد*.'
    example_gloss: Vanavond gaat het waarschijnlijk sneeuwen.
  prs.a2.unit28.lesson02.teach.possible:
    title: Het kan gaan sneeuwen
    gloss: Het kan gaan sneeuwen.
    note: '*ممکن است* betekent: het is mogelijk dat. Net als *شاید* wordt het gevolgd door de aanvoegende wijs: *ممکن است برف ببارد*.'
  prs.a2.unit28.lesson02.teach.subj_form:
    title: 'De aanvoegende wijs: ب plus de tegenwoordige stam'
    gloss: dat ik ga, dat jij gaat, dat hij gaat, dat wij gaan, dat jullie/u gaan, dat zij gaan
    note: 'De conjunctief is de tegenwoordige stam met *ب* ervoor en dezelfde uitgangen als in de tegenwoordige tijd: *می‌روم* (ik ga) wordt *بروم* (dat ik ga). De uitgangen zijn *-م، -ی، -د، -یم، -ین، -ند*, dus je krijgt *بروم، بروی، برود، برویم، بروین، بروند*. Je kent deze vorm al van *باید*; *شاید* gebruikt dezelfde vorm. Zet er geen *می‌* voor.'
  prs.a2.unit28.lesson02.teach.subj_more:
    title: De conjunctief van andere werkwoorden
    gloss: Misschien komt hij. Misschien komt de bus aan. Misschien sneeuwt het. Misschien raakt het defect.
    note: 'Dezelfde regel geldt voor elk werkwoord: *آمدن* wordt *بیاید* (dat hij komt), *رسیدن* wordt *برسد* (dat het aankomt), *باریدن* wordt *ببارد* (dat het sneeuwt of regent). *شدن* heeft de korte vorm *شود*, dus je zegt *شاید خراب شود* (misschien raakt het defect). Bij *بودن* is de conjunctief *باشد*: *شاید در خانه باشد* (misschien is hij thuis).'
  prs.a2.unit28.lesson02.teach.subj_negative:
    title: 'De ontkenning: ن voor de conjunctief'
    gloss: Misschien komt hij niet. Misschien gaan we niet. Misschien sneeuwt het niet.
    note: 'Voor ''misschien niet'' zet je *ن* voor de conjunctief en laat je de *ب* weg: *بروم* wordt *نروم*, *برویم* wordt *نرویم*, *ببارد* wordt *نبارد*. Het werkwoord *آمدن* moet je onthouden: de ontkenning is *نیاید* (niet *نبیاید*).'
  prs.a2.unit28.lesson02.teach.sentence:
    title: Misschien sneeuwt het morgen
    gloss: Misschien sneeuwt het morgen.
    note: Vergelijk met *فردا برف می‌بارد*. Die zin zegt dat het gaat sneeuwen; deze zin zegt dat het kan sneeuwen.
  prs.a2.unit28.lesson02.teach.sure_vs_maybe:
    title: Zeker of niet zeker
    gloss: Hij komt morgen. Misschien komt hij morgen.
    note: 'Het werkwoord laat de luisteraar horen hoe zeker je bent. Met *می‌* ben je zeker: *فردا می‌آید* betekent ''hij komt morgen''. Met *شاید* staat het werkwoord in de conjunctief en ben je niet zeker: *شاید فردا بیاید* betekent ''misschien komt hij morgen''.'
  prs.a2.unit28.lesson03.teach.surely:
    title: Zeker
    gloss: zeker, absoluut
    note: '*حتماً* betekent ''zeker'' of ''absoluut''. Zet het voor een gewoon werkwoord met *می‌* om een belofte of een vaste beslissing uit te drukken: *حتماً می‌آیم* betekent ''ik kom zeker''.'
    example_gloss: Ik kom morgen zeker.
  prs.a2.unit28.lesson03.teach.promise_word:
    title: Belofte
    gloss: belofte, woord
    note: '*قول* is een belofte. *قول می‌دهم* betekent ''ik beloof het'', letterlijk ''ik geef een belofte''. Je kunt *که* en een bijzin toevoegen: *قول می‌دهم که می‌آیم*.'
    example_gloss: Ik beloof dat ik kom.
  prs.a2.unit28.lesson03.teach.give_promise:
    title: Ik beloof het
    gloss: Ik beloof het.
    note: '*می‌دهم* betekent ''ik geef''. Je kent al *می‌دهین* (jullie/u geven); dit is de vorm bij *من*. Zeg *قول می‌دهم* als je wilt dat de ander je vertrouwt.'
  prs.a2.unit28.lesson03.teach.forget:
    title: Vergeten
    gloss: vergeten
    note: '*فراموش کردن* betekent ''vergeten''. Een belofte eindigt vaak met *فراموش نمی‌کنم* (ik vergeet het niet).'
    example_gloss: Ik vergeet mijn sleutel niet.
  prs.a2.unit28.lesson03.teach.later:
    title: Later
    gloss: later, daarna
    note: '*بعداً* betekent ''later''. Het is een tijdwoord voor een belofte die je snel nakomt, maar niet nu.'
    example_gloss: Ik bel later.
  prs.a2.unit28.lesson03.teach.promise_form:
    title: 'Een belofte: حتماً plus de gewone tegenwoordige tijd'
    gloss: Ik kom zeker. Ik bel zeker. Ik help zeker. Ik stuur het zeker op.
    note: 'Een belofte heeft twee delen: *حتماً* en een gewoon werkwoord met *می‌* in de vorm bij *من*. Er is geen aparte vorm. Een tijdwoord kan erbij staan, maar hoeft niet: *حتماً امشب تیلفون می‌کنم* betekent ''ik bel vanavond zeker''. Bij een belofte aan iemand kun je er eerst *قول می‌دهم* voor zetten.'
  prs.a2.unit28.lesson03.teach.you_come_q:
    title: Komt u?
    gloss: Kom je? Ga je komen?
    note: '*می‌آیی* betekent ''je komt'', tegen een vriend. De tegenwoordige tijd met *می‌* vraagt naar de toekomst op dezelfde manier als hij haar uitdrukt: *تو می‌آیی؟* betekent ''kom je?''. Het antwoord is vaak een belofte: *حتماً می‌آیم*.'
  prs.a2.unit28.lesson03.teach.negative_promise:
    title: Beloven dat je iets niet doet
    gloss: Ik kom niet meer te laat. Ik vergeet het nooit.
    note: 'Om te beloven dat je iets niet doet, gebruik je *نمی‌* in hetzelfde patroon: *دیگر دیر نمی‌آیم* betekent ''ik kom niet meer te laat'' en *هرگز فراموش نمی‌کنم* betekent ''ik vergeet het nooit''. *دیگر* met een ontkend werkwoord betekent ''niet meer''.'
  prs.a2.unit28.lesson03.teach.sentence:
    title: Ik bel vanavond zeker
    gloss: Ik bel vanavond zeker.
    note: 'Een belofte met een tijdwoord: *حتماً*, *امشب* en *تیلفون می‌کنم*.'
  prs.a2.unit28.lesson04.teach.important:
    title: Belangrijk
    gloss: belangrijk
    note: '*مهم* betekent ''belangrijk''. Een *جلسه مهم* is een belangrijke vergadering, een waarvoor je belooft te komen.'
    example_gloss: Vandaag is er een belangrijke vergadering.
  prs.a2.unit28.lesson04.teach.ladder:
    title: Van zeker naar niet zeker
    gloss: Hij komt zeker. Hij komt waarschijnlijk. Misschien komt hij. Het kan zijn dat hij niet komt.
    note: 'Kies het woord naargelang hoe zeker je bent. *حتماً* en een gewoon werkwoord met *می‌*: zeker. *احتمالاً* en een gewoon werkwoord in de tegenwoordige tijd: waarschijnlijk. *شاید* en de conjunctief: misschien. *ممکن است* en de conjunctief: mogelijk, en dat kan ook ontkend: *ممکن است نیاید* (het kan zijn dat hij niet komt).'
  prs.a2.unit28.lesson04.teach.maybe_but:
    title: Misschien laat, maar wel een belofte
    gloss: Misschien kom ik te laat, maar ik kom zeker.
    note: 'Je kunt een ''misschien'' en een belofte verbinden met *ولی* (maar): *شاید دیر برسم، ولی حتماً می‌آیم*. Het eerste deel zegt waar je niet zeker van kunt zijn, het tweede deel is wat je belooft. Gebruik *شاید* voor het deel waar je geen invloed op hebt en *حتماً* voor het deel waar je dat wel hebt.'
  prs.a2.unit28.lesson04.teach.meeting_tomorrow:
    title: Een vergadering morgen
    gloss: Morgen is er een vergadering. Kom je?
    note: Een vraag over morgen gebruikt de tegenwoordige tijd met een tijdwoord. Het beste antwoord is een belofte met *حتماً*.
  prs.a2.unit28.lesson05.teach.future_written:
    title: 'De geschreven toekomende tijd: alleen herkennen'
    gloss: Het weer wordt koud. Er valt sneeuw. De bus vertrekt. De bus gaat niet.
    note: 'In nieuws, weersverwachtingen en mededelingen lees je een geschreven toekomende tijd: *خواهد* plus de korte infinitief, zoals in *سرد خواهد بود* (het wordt koud), *خواهد بارید* (het zal regenen of sneeuwen), *حرکت خواهد کرد* (het zal vertrekken). De ontkenning is *نخواهد*: *نخواهد رفت* (het zal niet gaan). Je hoeft deze vorm alleen te begrijpen als je hem leest. Als je met een vriend praat of schrijft, gebruik je de vorm die je hebt geleerd: *فردا برف می‌بارد* en *حتماً می‌روم*.'
  prs.a2.unit28.lesson05.teach.forecast_reading:
    title: Een weersverwachting
    gloss: 'Weersverwachting: Op vrijdag is het koud in Bamyan. Misschien sneeuwt het. Volgende week wordt het zonnig.'
    note: Een korte weersverwachting op de radio. De eerste zin gebruikt de geschreven toekomende tijd *خواهد بود*. De tweede gebruikt *شاید* en de conjunctief, omdat sneeuw niet zeker is. De derde gebruikt het gewone *می‌شود* met een tijdwoord. Samen laten ze zien hoe een verwachting 'zeker', 'niet zeker' en 'volgende week' uitdrukt.
  prs.a2.unit28.lesson05.teach.notice_reading:
    title: Een mededeling voor passagiers
    gloss: 'Mededeling voor passagiers naar Bamyan: Volgende week vrijdag om acht uur vertrekt de bus vanaf het station. Wees alstublieft om zeven uur op het station. De bus vertrekt niet te laat.'
    note: 'Een mededeling op het busstation. Ze gebruikt de geschreven toekomende tijd *حرکت خواهد کرد* en de ontkenning *حرکت نخواهد کرد* voor het plan, en een beleefd verzoek met *لطفاً* en de conjunctief *باشین* (wees). De tijd is *ساعت هشت*: de bus vertrekt om acht uur en de passagiers moeten een uur eerder komen.'
  prs.a2.unit28.lesson05.teach.d1_t1:
    title: Basira vraagt naar de weersverwachting
    gloss: Nader, heb je de weersverwachting voor vrijdag gezien?
    note: Basira vraagt naar de weersverwachting met de eenvoudige verleden tijd *دیدی*. *هوای جمعه* is het weer van vrijdag.
  prs.a2.unit28.lesson05.teach.d1_t2:
    title: Nader geeft de weersverwachting
    gloss: Ja. Op vrijdag wordt het koud en misschien sneeuwt het.
    note: 'Nader gebruikt beide vormen in één zin: het gewone *می‌شود* voor de kou, die zeker is, en *شاید* met *ببارد* voor de sneeuw, die niet zeker is.'
  prs.a2.unit28.lesson05.teach.d1_t3:
    title: Basira bedenkt dat het misschien beter is niet te gaan
    gloss: Dan gaan we vrijdag misschien niet naar Bamyan.
    note: '*شاید* met de ontkennende conjunctief *نرویم* betekent ''misschien gaan we niet''.'
  prs.a2.unit28.lesson05.teach.d1_t4:
    title: Nader stelt volgende week voor
    gloss: Ja. We gaan volgende week. Dan wordt het zonnig.
    note: Nader verschuift de reis naar *هفتهٔ آینده* met het gewone *می‌رویم* en een tijdwoord.
  prs.a2.unit28.lesson05.teach.d1_t5:
    title: Basira stemt in
    gloss: Goed. Volgende week gaan we zeker.
    note: 'Basira antwoordt met *حتماً*: ze is zeker over volgende week.'
  prs.a2.unit28.lesson05.teach.d1_t6:
    title: Nader belooft het
    gloss: Ik beloof het.
    note: Nader sluit af met *قول می‌دهم*, een belofte.
  prs.a2.unit28.lesson06.teach.d2_t1:
    title: Basira vraagt het aan Nader
    gloss: Nader, morgen is er een belangrijke vergadering. Kom je?
    note: Basira gebruikt de tegenwoordige tijd met *فردا* om naar morgen te vragen. De vergadering is *مهم*, dus ze wil een vast antwoord.
  prs.a2.unit28.lesson06.teach.d2_t2:
    title: Nader belooft het, met een twijfel
    gloss: Ik kom zeker. Maar misschien kom ik te laat, want het is erg druk op de weg.
    note: Nader belooft het met *حتماً می‌آیم* en zegt daarna waar hij niet zeker van kan zijn met *شاید دیر برسم*. *چون* geeft de reden.
  prs.a2.unit28.lesson06.teach.d2_t3:
    title: Basira vraagt om een telefoontje
    gloss: Geen probleem. Bel je vanavond?
    note: 'Basira neemt het risico van te laat komen op de koop toe met *مشکلی نیست* en vraagt om nog een belofte: een telefoontje vanavond.'
  prs.a2.unit28.lesson06.teach.d2_t4:
    title: Nader belooft te bellen
    gloss: Ik beloof het. Ik bel vanavond zeker. Ik vergeet het niet.
    note: 'Drie beloftes achter elkaar: *قول می‌دهم*, *حتماً امشب تیلفون می‌کنم* en *فراموش نمی‌کنم*.'
exercises:
