course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor gevorderde beginners: zeggen wat je moet, niet mag of niet hoeft te doen, en vragen of iets mag. Regels van een bibliotheek, een zwembad en een sportschool met باید, نباید, لازم نیست, اجازه دارم en می‌توانم.'
units:
  prs.a2.unit29.rules_permission:
    title: Regels en toestemming
lessons:
  prs.a2.unit29.lesson01.must_and_places:
    title: Moeten, en de plekken in het centrum
  prs.a2.unit29.lesson02.must_not:
    title: 'Niet mogen: regels in de bibliotheek'
  prs.a2.unit29.lesson03.ask_permission:
    title: 'Vragen: mag ik? kan ik?'
  prs.a2.unit29.lesson04.no_need:
    title: 'Niet nodig: je hoeft niet'
  prs.a2.unit29.lesson05.reading_and_listening:
    title: Lezen en luisteren over regels
  prs.a2.unit29.lesson06.gym_conversation:
    title: Een gesprek in de sportschool en het zwembad
teaching:
  prs.a2.unit29.lesson01.teach.library:
    title: Bibliotheek
    gloss: bibliotheek
    note: '*کتابخانه* is een bibliotheek. Waar je naartoe gaat, zeg je met *به*: *به کتابخانه می‌روم* betekent ik ga naar de bibliotheek. Deze les gaat over de regels van een buurthuis met een bibliotheek, een zwembad en een sportschool.'
    example_gloss: De bibliotheek is vlak bij mijn huis.
  prs.a2.unit29.lesson01.teach.pool:
    title: Zwembad
    gloss: zwembad
    note: '*حوض آب‌بازی* is een zwembad. Het woord ken je al uit de les over het zwembad.'
    example_gloss: Ik ga elke week naar het zwembad.
  prs.a2.unit29.lesson01.teach.gym:
    title: Sportschool
    gloss: sportschool, sportclub
    note: '*باشگاه* is een sportschool of een sportclub. Het woord ken je al uit de les over de sportschool.'
    example_gloss: De sportschool is om zes uur open.
  prs.a2.unit29.lesson01.teach.rules:
    title: Regels
    gloss: 'regels (enkelvoud: regel, wet)'
    note: '*قانون* is een regel en *قانون‌ها* zijn regels. De plek volgt erna met *-ی*: *قانون‌های کتابخانه* zijn de regels van de bibliotheek. Het meervoudsachtervoegsel schrijf je als los klein deel achter het zelfstandig naamwoord, met een halve spatie.'
    example_gloss: De regels van de sportschool liggen in het kantoor.
  prs.a2.unit29.lesson01.teach.membership:
    title: Lidmaatschapskaart
    gloss: lidmaatschapskaart
    note: '*کارت عضویت* is een lidmaatschapskaart, de kaart waarmee je boeken mag lenen of de sportschool mag gebruiken. *کارت* ken je al.'
    example_gloss: Mijn lidmaatschapskaart ligt thuis.
  prs.a2.unit29.lesson01.teach.sports_shoes:
    title: Sportschoenen
    gloss: sportschoenen
    note: '*کفش* is een schoen en *ورزشی* betekent voor sport, van *ورزش*. Dus *کفش ورزشی* zijn sportschoenen.'
    example_gloss: Mijn sportschoenen zijn nieuw.
  prs.a2.unit29.lesson01.teach.must:
    title: 'Moeten: باید plus de aanvoegende wijs (subjunctief)'
    gloss: ik moet gaan, jij moet gaan (tegen een vriend), hij/zij moet gaan, wij moeten gaan, u moet / jullie moeten gaan, zij moeten gaan
    note: '*باید* betekent moeten. Het verandert nooit. De persoon zie je aan het werkwoord erna, dat in de subjunctief staat: *بروم، بروی، برود، برویم، بروین، بروند*. De uitgangen zijn dezelfde als in de tegenwoordige tijd, *-م، -ی، -د، -یم، -ین، -ند*, maar het werkwoord begint met *ب-* in plaats van *می‌*. Deze vorm ken je al van *می‌خواهم* (*می‌خواهم یک تکت بگیرم*). De woordvolgorde is *باید* eerst en het werkwoord laatst: *من باید به کتابخانه بروم*. Het voornaamwoord *من* mag je weglaten, omdat de uitgang al laat zien wie het is.'
  prs.a2.unit29.lesson01.teach.formation:
    title: Zo maak je de subjunctief
    gloss: 'ik ga: dat ik ga. ik kom: dat ik kom. ik doe: dat ik doe. ik neem: dat ik neem. ik geef: dat ik geef. ik breng: dat ik breng.'
    note: 'Neem de tegenwoordige tijd, laat *می‌* weg en zet *ب-* ervoor: *می‌روم* wordt *بروم*, *می‌گیرم* wordt *بگیرم*, *می‌دهم* wordt *بدهم*, *می‌برم* wordt *ببرم*. Twee werkwoorden zijn anders. *آمدن* geeft *بیایم* (niet *بآیم*) en *کردن* geeft *کنم* zonder *ب-* (je hoort ook *بکنم*, dat is prima). Bij werkwoorden van twee woorden verandert alleen het werkwoordsdeel: *پس بدهم*, *کار کنم*, *دوش بگیرم*. De andere personen hebben dezelfde uitgangen: *بگیری، بگیرد، بگیریم، بگیرین، بگیرند*.'
  prs.a2.unit29.lesson01.teach.wear:
    title: Dragen (kleding)
    gloss: aantrekken, dragen
    note: '*پوشیدن* is kleding en schoenen dragen of aantrekken. De subjunctief is *بپوشم، بپوشی، بپوشد، بپوشیم، بپوشین، بپوشند*, dus *باید کفش بپوشم* betekent ik moet schoenen dragen.'
    example_gloss: In de sportschool moet ik nieuwe schoenen dragen.
  prs.a2.unit29.lesson01.teach.more_verbs:
    title: Moeten met meer werkwoorden
    gloss: Ik moet een kaart nemen. Jij moet douchen. Wij moeten het boek terugbrengen. U moet / jullie moeten sportschoenen dragen. Zij moeten naar de sportschool komen.
    note: 'Hetzelfde patroon werkt voor elk werkwoord: *باید* en dan de subjunctief met de juiste uitgang. *دوش گرفتن* is douchen en *پس دادن* is teruggeven, dus *باید کتاب را پس بدهیم* betekent we moeten het boek terugbrengen. Wat je geeft of neemt, staat voor het werkwoord, met *را* als het om iets bepaalds gaat: *کتاب را*.'
  prs.a2.unit29.lesson01.teach.sentence:
    title: Ik moet naar de bibliotheek gaan
    gloss: Ik moet naar de bibliotheek gaan.
    note: Dit is het patroon van de hele les. *باید* laat zien dat het een regel of plicht is en *بروم* geeft de persoon aan. Iedereen in het centrum volgt dezelfde regels.
  prs.a2.unit29.lesson02.teach.quiet:
    title: Stil
    gloss: stil, rustig
    note: '*ساکت* betekent stil. *ساکت باشین* is: wees alstublieft stil (tegen meerdere mensen of tegen iemand die je respecteert).'
    example_gloss: De bibliotheek is stil.
  prs.a2.unit29.lesson02.teach.be_paradigm:
    title: 'Moeten zijn: باشم'
    gloss: ik moet stil zijn, jij moet stil zijn, hij/zij moet stil zijn, wij moeten stil zijn, u moet / jullie moeten stil zijn, zij moeten stil zijn
    note: 'De subjunctief van *بودن* (zijn) is *باشم، باشی، باشد، باشیم، باشین، باشند*. Na *باید* zegt hij dat iemand in een bepaalde toestand moet zijn: *باید ساکت باشین* betekent u moet / jullie moeten stil zijn. *باشد* en *باشین* ken je al; *باشم، باشی، باشیم* maken de reeks compleet.'
  prs.a2.unit29.lesson02.teach.food:
    title: Eten
    gloss: eten, een maaltijd
    note: '*غذا* is eten of een maaltijd. *غذا خوردن* is een maaltijd eten en *غذا بخورم* is daarvan de subjunctief.'
    example_gloss: Wij eten thuis.
  prs.a2.unit29.lesson02.teach.cigarette:
    title: Sigaret
    gloss: sigaret
    note: '*سگرت* is een sigaret. *سگرت کشیدن* is roken, met het werkwoord *کشیدن*.'
    example_gloss: Hij rookt elke dag sigaretten.
  prs.a2.unit29.lesson02.teach.forbidden:
    title: Verboden
    gloss: verboden, niet toegestaan
    note: '*ممنوع* betekent verboden en dat lees je op borden: *غذا خوردن ممنوع است* betekent eten is niet toegestaan. Eerst komt de activiteit in de infinitief (*کشیدن، خوردن، گرفتن*), dan *ممنوع است*.'
    example_gloss: Roken is verboden in de sportschool.
  prs.a2.unit29.lesson02.teach.loud:
    title: Luid, hard
    gloss: 'luid, hard (ook: lang, hoog)'
    note: '*بلند* betekent luid als je zegt hoe iemand praat: *بلند صحبت کردن* is hard praten. *صحبت کردن* is een werkwoord dat je al kent.'
    example_gloss: Hij praat hard.
  prs.a2.unit29.lesson02.teach.must_not:
    title: 'Niet mogen: نباید plus de subjunctief'
    gloss: ik mag niet eten, jij mag niet eten, hij/zij mag niet eten, wij mogen niet eten, u mag / jullie mogen niet eten, zij mogen niet eten
    note: '*نباید* is de ontkenning van *باید* en betekent niet mogen. De *ن* komt op *باید* en het werkwoord erna blijft bevestigend: *نباید غذا بخورین* betekent u mag / jullie mogen niet eten. Het werkwoord heeft dezelfde subjunctief-uitgangen als na *باید*. *نباید* gebruik je voor een regel of een sterk advies, dus dat zeggen de medewerkers van een bibliotheek of zwembad.'
  prs.a2.unit29.lesson02.teach.forbidden_same:
    title: Twee manieren om te zeggen dat iets niet mag
    gloss: Eten is verboden. U mag / jullie mogen niet eten.
    note: '*ممنوع است* en *نباید* betekenen hetzelfde. Op een bord staat de infinitief: *غذا خوردن ممنوع است*. Iemand die tegen jou praat, gebruikt *نباید* met de conjunctief: *نباید غذا بخورین*.'
  prs.a2.unit29.lesson02.teach.no_eat_library:
    title: In de bibliotheek mag je niet eten
    gloss: In de bibliotheek mag je niet eten.
    note: Eerst komt de plaats, dan *نباید*, dan het onderwerp van de handeling en het werkwoord staat aan het einde.
  prs.a2.unit29.lesson02.teach.quiet_library:
    title: In de bibliotheek moet je stil zijn
    gloss: In de bibliotheek moet je stil zijn.
    note: '*باید ساکت باشین* is een regel die zegt wat je moet doen, terwijl *نباید* zegt wat je niet mag doen.'
  prs.a2.unit29.lesson02.teach.phone_forms:
    title: Niet mogen bij andere personen
    gloss: Ik mag niet bellen. Jij mag niet bellen (tegen een vriend). U/jullie mag/mogen niet bellen (beleefd of meervoud).
    note: 'Bij een werkwoord van twee woorden zoals *صحبت کردن* verandert alleen het werkwoordsdeel: *صحبت کنم، صحبت کنی، صحبت کنین*. Tegen een vriend zeg je *نباید ... کنی*, tegen meerdere mensen of iemand voor wie je respect hebt *نباید ... کنین*.'
  prs.a2.unit29.lesson02.teach.no_phone_gym:
    title: In de sportschool mag je niet bellen
    gloss: In de sportschool mag je niet bellen.
    note: '*با تیلفون صحبت کردن* betekent bellen, praten via de telefoon. *صحبت کنین* is de conjunctief van *صحبت کردن* voor *شما*.'
  prs.a2.unit29.lesson03.teach.here:
    title: Hier
    gloss: hier
    note: '*اینجا* betekent hier. *آنجا* (daar) ken je al: *اینجا* is de plek dichtbij.'
    example_gloss: De bibliotheek is hier.
  prs.a2.unit29.lesson03.teach.permission:
    title: Toestemming
    gloss: toestemming
    note: '*اجازه* is toestemming. *اجازه دارم* betekent ik mag (ik heb toestemming) en *اجازه ندارم* betekent ik mag niet. Voor een ander zeg je *اجازه دارین* (u mag/jullie mogen) of *اجازه ندارین* (u mag/jullie mogen niet).'
    example_gloss: Hier mag u.
  prs.a2.unit29.lesson03.teach.photo:
    title: Foto
    gloss: foto
    note: '*عکس* is een foto. *عکس گرفتن* is een foto maken, met het werkwoord *گرفتن*.'
    example_gloss: Mijn foto's staan op mijn telefoon.
  prs.a2.unit29.lesson03.teach.ask_allowed:
    title: Mag ik? اجازه دارم plus de conjunctief
    gloss: Mag ik hier een foto maken? Mag ik het boek mee naar huis nemen? Mag ik de telefoon gebruiken?
    note: 'Om te vragen of je iets mag doen, zeg je *اجازه دارم* en dan de conjunctief van het werkwoord: *اجازه دارم اینجا عکس بگیرم؟* betekent: mag ik hier een foto maken? Begin met *ببخشین* (pardon) om beleefd te zijn. De persoon staat in het werkwoord na *اجازه دارم*, dus voor een andere persoon verander je beide: *اجازه دارین عکس بگیرین* betekent: u mag een foto maken.'
  prs.a2.unit29.lesson03.teach.can_paradigm:
    title: 'Kunnen: می‌توانم'
    gloss: ik kan, jij kunt (tegen een vriend), hij/zij kan, wij kunnen, u/jullie kunt/kunnen (beleefd of meervoud), zij kunnen
    note: '*می‌توانم* betekent ik kan. Het wordt geschreven met een kleine ruimte tussen *می* en *توانم*. De vormen zijn *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. Daarna komt de conjunctief: *می‌توانم اینجا عکس بگیرم؟* betekent: kan ik hier een foto maken? *می‌توانم ...؟* vragen is een andere manier om toestemming te vragen, even gewoon als *اجازه دارم ...؟*.'
  prs.a2.unit29.lesson03.teach.answers:
    title: Ja of nee zeggen
    gloss: Ja, u mag. Ja, u kunt. Nee, u mag niet. Nee, u kunt niet. Nee, het is verboden.
    note: 'Antwoord met hetzelfde werkwoord als in de vraag: op *اجازه دارم؟* volgt *اجازه دارین / اجازه ندارین* en op *می‌توانم؟* volgt *می‌توانین / نمی‌توانین*. Als een regel het verbiedt, kun je ook *ممنوع است* zeggen. Je kunt *بلی، البته* (ja, natuurlijk) toevoegen.'
  prs.a2.unit29.lesson03.teach.polite_ask:
    title: Pardon, mag ik dit boek mee naar huis nemen?
    gloss: Pardon, mag ik dit boek mee naar huis nemen?
    note: '*ببخشین* opent de vraag beleefd. *به خانه ببرم* betekent mee naar huis nemen.'
  prs.a2.unit29.lesson03.teach.answer_yes:
    title: Ja, u mag
    gloss: Ja, u mag.
    note: Een kort, beleefd ja op een vraag met *اجازه دارم*.
  prs.a2.unit29.lesson03.teach.answer_no_photo:
    title: Nee, hier foto's maken is verboden
    gloss: Nee, hier mag je geen foto's maken.
    note: 'Een nee met de reden erbij via *ممنوع*: *عکس گرفتن ممنوع است*.'
  prs.a2.unit29.lesson04.teach.no_need:
    title: 'Niet nodig: لازم نیست plus de conjunctief'
    gloss: We hoeven niet te komen. U hoeft niet te betalen.
    note: '*لازم نیست* betekent het is niet nodig, dus je hoeft niet. Daarna komt de conjunctief, net als bij *باید*: *لازم نیست پول بدهین* betekent: u hoeft niet te betalen. *لازم نیست* verbiedt niets. Het zegt alleen dat het aan jou is.'
  prs.a2.unit29.lesson04.teach.no_need_formal:
    title: 'Formeler: ضرورت ندارد'
    gloss: Het is niet nodig een pas mee te nemen.
    note: '*ضرورت ندارد* betekent hetzelfde als *لازم نیست*, maar is iets formeler en staat vaak op mededelingen: *ضرورت ندارد کارت بیاورین* betekent: het is niet nodig een pas mee te nemen. Het werkwoord erna staat weer in de conjunctief. In de dagelijkse spreektaal is *لازم نیست* de gewone keuze.'
  prs.a2.unit29.lesson04.teach.three_meanings:
    title: Drie verschillende betekenissen
    gloss: Ik moet komen. Ik mag niet komen. Ik hoef niet te komen.
    note: '*باید بیایم* is een plicht, *نباید بیایم* is een verbod en *لازم نیست بیایم* is vrijheid: ik mag komen, maar het hoeft niet. Verwar *نباید* en *لازم نیست* niet: *نباید* verbiedt, *لازم نیست* niet.'
  prs.a2.unit29.lesson04.teach.towel:
    title: Handdoek
    gloss: handdoek
    note: '*حوله* is een handdoek. *حوله‌ام* is mijn handdoek.'
    example_gloss: Mijn handdoek ligt in de sportschool.
  prs.a2.unit29.lesson04.teach.everyone:
    title: Iedereen, allemaal
    gloss: iedereen, allemaal
    note: '*همه* betekent iedereen of allemaal. Het is handig voor regels die voor iedereen gelden: *همه باید ساکت باشند* betekent: iedereen moet stil zijn.'
    example_gloss: Iedereen in de bibliotheek is stil.
  prs.a2.unit29.lesson04.teach.bring:
    title: Meenemen, brengen
    gloss: meenemen, brengen
    note: '*آوردن* is meenemen of brengen. De conjunctief is *بیاورم، بیاوری، بیاورد، بیاوریم، بیاورین، بیاورند*. *بیاورم* ken je al: *لازم نیست حوله بیاوری* betekent: je hoeft geen handdoek mee te nemen.'
    example_gloss: Morgen moet je mijn boeken meebrengen.
  prs.a2.unit29.lesson04.teach.towel_phrase:
    title: In de sportschool hoef je geen handdoek mee te nemen
    gloss: In de sportschool hoef je geen handdoek mee te nemen.
    note: 'De sportschool heeft eigen handdoeken, dus meenemen is niet nodig. Dit is een goed voorbeeld van *لازم نیست*: het is niet verboden, alleen niet nodig.'
  prs.a2.unit29.lesson04.teach.pay_phrase:
    title: U hoeft niet te betalen
    gloss: U hoeft niet te betalen.
    note: Het lidmaatschap van de bibliotheek is gratis, dus u hoeft er niet voor te betalen. *پول بدهین* is de conjunctief van *پول دادن*.
  prs.a2.unit29.lesson05.teach.centre:
    title: Centrum
    gloss: centrum
    note: '*مرکز اجتماعی* is een buurthuis, een gebouw met een bibliotheek, een zwembad en een sportschool. *اجتماعی* ken je uit eerdere units.'
    example_gloss: Het buurthuis is vlak bij mijn huis.
  prs.a2.unit29.lesson05.teach.rubbish:
    title: Afval, vuilnisbak
    gloss: 'afval (en: vuilnisbak)'
    note: '*زباله* is afval en *سطل* is een vuilnisbak. Beide woorden komen uit de unit over afval. Het werkwoord is *انداختن*, gooien: *زباله را در سطل بیندازین* betekent: gooi het afval in de vuilnisbak.'
    example_gloss: Het afval zit in de vuilnisbak.
  prs.a2.unit29.lesson05.teach.run:
    title: Rennen
    gloss: rennen
    note: '*دویدن* is rennen. De conjunctief is *بدوم، بدوی، بدود، بدویم، بدوین، بدوند*, dus *نباید بدوین* betekent: u mag/jullie mogen niet rennen.'
    example_gloss: In het zwembad mag je niet rennen.
  prs.a2.unit29.lesson05.teach.throw:
    title: Gooien, doen in
    gloss: gooien, ergens in doen
    note: '*انداختن* is gooien. De conjunctief is *بیندازم، بیندازی، بیندازد، بیندازیم، بیندازین، بیندازند*, dus *باید زباله را در سطل بیندازین* betekent: u moet het afval in de vuilnisbak gooien.'
    example_gloss: Gooi het afval in de vuilnisbak.
  prs.a2.unit29.lesson05.teach.library_turn01:
    title: Shakila vraagt of ze een boek mee naar huis mag nemen
    gloss: Pardon, mag ik dit boek mee naar huis nemen?
    note: Shakila is nieuw in de bibliotheek en vraagt het met *اجازه دارم* plus de conjunctief *ببرم*. Ze zegt *ببخشین* om beleefd te zijn.
  prs.a2.unit29.lesson05.teach.library_turn02:
    title: Nasir zegt dat ze eerst een pas nodig heeft
    gloss: Ja, maar eerst moet u een lidmaatschapspas halen.
    note: 'Nasir is de bibliothecaris, dus hij zegt *شما* in de *-ین*-vorm: *بگیرین*. *اول باید* betekent: eerst moet u.'
  prs.a2.unit29.lesson05.teach.library_turn03:
    title: Shakila vraagt of ze moet betalen
    gloss: Moet ik betalen?
    note: '*باید پول بدهم؟* is een vraag met *باید*: moet ik betalen?'
  prs.a2.unit29.lesson05.teach.library_turn04:
    title: Nasir zegt dat betalen niet nodig is, maar dat het boek terug moet
    gloss: Nee, u hoeft niet te betalen. U moet het boek binnen twee weken terugbrengen.
    note: '*لازم نیست* zegt dat betalen niet nodig is. *باید کتاب را تا دو هفته پس بدهین* is een plicht: het boek moet binnen twee weken terug.'
  prs.a2.unit29.lesson05.teach.library_turn05:
    title: Shakila vraagt of ze mag eten
    gloss: Kan ik hier eten?
    note: '*می‌توانم ...؟* vraagt of je iets mag. De conjunctief is *بخورم*.'
  prs.a2.unit29.lesson05.teach.library_turn06:
    title: Nasir zegt dat eten niet mag en dat ze stil moet zijn
    gloss: Nee, u mag niet eten. U moet ook stil zijn.
    note: '*نباید غذا بخورین* is een verbod en *باید ساکت هم باشین* is een plicht. *هم* betekent ook.'
  prs.a2.unit29.lesson05.teach.notice:
    title: Een mededeling over de regels van het buurthuis
    gloss: 'Mededeling. De regels van het buurthuis. Bibliotheek: In de bibliotheek mag u niet eten en moet u stil zijn. Zwembad: Voordat u het zwembad in gaat, moet u douchen. In het zwembad mag u niet rennen. Sportschool: In de sportschool moet u sportschoenen dragen. U hoeft geen handdoek mee te nemen. Afval moet u in de vuilnisbak gooien.'
    note: 'Een echte mededeling bevat alle drie soorten regels: *باید* voor wat je moet doen, *نباید* voor wat je niet mag doen en *لازم نیست* voor wat niet nodig is. De mededeling richt zich tot iedereen, dus gebruikt ze de *-ین*-vorm.'
  prs.a2.unit29.lesson06.teach.first_time:
    title: De eerste keer
    gloss: de eerste keer
    note: '*اولین بار* is de eerste keer. *اولین* betekent eerste en *بار* betekent keer, zoals in *هر بار* (elke keer).'
    example_gloss: Ik ga voor het eerst naar deze bibliotheek.
  prs.a2.unit29.lesson06.teach.what_must_i:
    title: Wat moet ik doen?
    gloss: Wat moet ik doen?
    note: 'Een handige vraag: *چه* (wat), *باید* en de conjunctief *بکنم*. *بکنم* en *کنم* zijn hier allebei goed.'
  prs.a2.unit29.lesson06.teach.gym_turn01:
    title: Nazila vraagt wat ze moet doen
    gloss: Fahim, morgen ga ik voor het eerst naar de sportschool. Wat moet ik doen?
    note: Nazila gebruikt *تو* tegen haar vriend. *فردا ... می‌روم* is de gewone tegenwoordige tijd voor morgen.
  prs.a2.unit29.lesson06.teach.gym_turn02:
    title: Fahim noemt een plicht en iets wat niet nodig is
    gloss: Je moet sportschoenen dragen. Je hoeft geen handdoek mee te nemen, de sportschool heeft handdoeken.
    note: 'Fahim praat tegen een vriendin, dus de werkwoorden eindigen op *-ی*: *بپوشی، بیاوری*. *باید* is een plicht, *لازم نیست* is niet nodig.'
  prs.a2.unit29.lesson06.teach.gym_turn03:
    title: Nazila vraagt naar het zwembad
    gloss: Kan ik na de sportschool naar het zwembad gaan?
    note: '*می‌توانم ... بروم؟* vraagt of ze mag gaan.'
  prs.a2.unit29.lesson06.teach.gym_turn04:
    title: Fahim zegt ja, met twee regels
    gloss: Ja, maar eerst moet je douchen. Je mag ook niet rennen in het zwembad.
    note: '*اول باید دوش بگیری* is een plicht en *نباید بدوی* is een verbod. Beide gebruiken de uitgang *-ی* voor een vriend(in).'
  prs.a2.unit29.lesson06.teach.gym_turn05:
    title: Nazila bedankt hem
    gloss: Goed! Bedankt.
    note: Een korte, vriendelijke afsluiting. *تشکر* betekent 'bedankt'.
