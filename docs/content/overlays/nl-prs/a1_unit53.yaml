  prs.a1.unit53.lesson01.teach.museum_word:
    title: Museum
    gloss: museum
    note: Dit is het gangbare woord in Afghaans Dari voor een museum, anders dan het woord موزه in het Iraanse Perzisch.
    example_gloss: Het museum is goed.
  prs.a1.unit53.lesson01.teach.review_staff_word:
    title: 'Herhaling: medewerker'
    gloss: medewerker
    note: Dit is hetzelfde algemene woord voor een medewerker dat je al kent van de bioscoop en het zwembad. Hier gebruik je het voor de kaartjesbalie van het museum.
    target_text: کارمند (medewerker)
