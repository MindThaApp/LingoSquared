    gloss: hoeveel / afghani / is / veertig / in / foto / interessant / kaartje
    note: Dit zijn herhalingswoorden (uit eerdere units) om over de prijs en de tentoonstelling van het museum te praten.
    target_text: چند (hoeveel) / افغانی (afghani) / است (is) / چهل (veertig) / در (in) / عکس (foto) / جالب (interessant) / تکت (kaartje)
  prs.a1.unit53.lesson02.teach.exhibition_word:
    title: Tentoonstelling
