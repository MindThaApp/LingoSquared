course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor lager-gevorderden: een formele afspraak regelen om een nieuw adres te registreren bij het gemeentekantoor – woordenschat, een afspraak maken, een officiële mededeling lezen en de afspraak zelf.'
units:
  prs.a2.unit09.bureaucracy:
    title: Administratieve zaken
lessons:
  prs.a2.unit09.lesson01.bureaucracy_vocabulary:
    title: Woorden voor een bezoek aan een kantoor
  prs.a2.unit09.lesson02.making_an_appointment:
    title: Een afspraak maken
  prs.a2.unit09.lesson03.reading_the_notice:
    title: De mededeling lezen
  prs.a2.unit09.lesson04.at_the_municipality_office:
    title: Op het gemeentekantoor
teaching:
  prs.a2.unit09.lesson01.teach.vaght_word:
    title: Afspraak
    gloss: afspraak / tijdslot
    note: '*وقت* betekent letterlijk ''tijd''; *وقت گرفتن* (een afspraak nemen) is de alledaagse manier om ''een afspraak maken'' te zeggen.'
  prs.a2.unit09.lesson01.teach.sanad_word:
    title: Document
    gloss: document
    note: '*سند* is het algemene woord voor een officieel document.'
  prs.a2.unit09.lesson01.teach.address_word:
    title: Adres
    gloss: adres
    note: '*آدرس* is het alledaagse woord voor een woonadres.'
  prs.a2.unit09.lesson01.teach.tazkira_word:
    title: Nationaal identiteitsboekje
    gloss: nationaal identiteitsboekje (tazkira)
    note: '*تذکره* – het document dat in deze unit wordt bijgewerkt – is het nationale identiteitsboekje van Afghanistan, een ander document dan de *کارت ملی* van Iran.'
  prs.a2.unit09.lesson01.teach.municipality_word:
    title: Gemeente
    gloss: gemeente
    note: '*شاروالی* is de Afghaanse term voor het gemeentekantoor van een stad, anders dan het *شهرداری* van het Iraanse Perzisch.'
  prs.a2.unit09.lesson01.teach.va_word:
    title: En
    gloss: en
    note: '*و* is het veelgebruikte verbindingswoord in deze hele unit.'
    target_text: و (en)
  prs.a2.unit09.lesson02.teach.request_appointment:
    title: Vragen om een afspraak
    gloss: Ik wil graag een afspraak maken om mijn adres te wijzigen.
    note: '*می‌خواستم* (letterlijk ''ik wilde'') maakt een verzoek beleefder.'
  prs.a2.unit09.lesson02.teach.because_moved:
    title: Uitleggen waarom, met چون (omdat)
    gloss: Omdat ik ben verhuisd, moet ik mijn adres wijzigen.
    note: '*چون* (''omdat'') leidt de bijzin met de reden in; daarna volgt het gevolg.'
  prs.a2.unit09.lesson02.teach.what_should_i_bring:
    title: Beleefd vragen wat je moet meenemen
    gloss: Kunt u mij zeggen wat ik moet meenemen?
    note: '*می‌شود بگویین...؟* (''zou u kunnen zeggen...?'') is een beleefde indirecte vraagvorm.'
  prs.a2.unit09.lesson03.teach.rent_receipt_word:
    title: Huurkwitantie
    gloss: huurkwitantie
    note: '*رسید کرایه خانه* is een kwitantie voor de huur van een huis, een van de geaccepteerde bewijzen van woonplaats.'
  prs.a2.unit09.lesson03.teach.deadline_word:
    title: Deadline
    gloss: deadline
    note: '*مهلت* is het algemene woord voor een deadline of termijn.'
  prs.a2.unit09.lesson03.teach.notice_text:
    title: Een mededeling van het kantoor over adreswijziging
    gloss: Neem voor een adreswijziging uw nationale identiteitsboekje en een huurkwitantie mee. De registratietermijn loopt tot het einde van deze maand.
    note: Een korte officiële mededeling, in het formele schriftelijke register dat in deze unit aan bod komt.
  prs.a2.unit09.lesson03.teach.i_will_bring_receipt:
    title: Zeggen wat je meeneemt
    gloss: Ik neem de huurkwitantie mee.
    note: '*می‌آورم* betekent ''ik breng mee''.'
  prs.a2.unit09.lesson04.teach.turn01:
    title: De ambtenaar begroet کریم
    gloss: De ambtenaar nodigt hem binnen en vraagt waarmee hij hem van dienst kan zijn.
    note: '*بفرمایین* nodigt hem uit naderbij te komen; *چه خدمتی می‌توانم برایتان انجام بدهم؟* is een beleefde, formele manier waarop een ambtenaar hulp aanbiedt.'
  prs.a2.unit09.lesson04.teach.turn02:
    title: کریم vraagt om een afspraak
    gloss: کریم zegt dat hij graag een afspraak wil maken om zijn adres te wijzigen.
    note: Hetzelfde beleefde verzoekpatroon met *می‌خواستم* als eerder.
  prs.a2.unit09.lesson04.teach.turn03:
    title: De ambtenaar vraagt sinds wanneer
    gloss: De ambtenaar vraagt sinds wanneer hij in het nieuwe huis woont.
    note: '*از کی...؟* betekent ''sinds wanneer''.'
  prs.a2.unit09.lesson04.teach.turn04:
    title: کریم antwoordt en vraagt wat hij moet meenemen
    gloss: Hij zegt dat het sinds vorige maand is en vraagt wat hij moet meenemen.
    note: Combineert *از ماه گذشته* ('sinds vorige maand') met de beleefde vraag *می‌شود بگویین...؟*.
  prs.a2.unit09.lesson04.teach.turn05:
    title: De ambtenaar noemt de documenten
    gloss: De ambtenaar zegt dat het nationale identiteitsboekje en een huurkwitantie genoeg zijn.
    note: '*کافی است* betekent ''is genoeg''.'
  prs.a2.unit09.lesson04.teach.turn06:
    title: کریم stelt een dag voor
    gloss: Hij vraagt of hij dinsdag kan komen.
    note: '*می‌توانم...؟* vraagt naar mogelijkheid of toestemming.'
  prs.a2.unit09.lesson04.teach.turn07:
    title: De ambtenaar bevestigt en geeft een volgnummer
    gloss: De ambtenaar bevestigt dinsdag om tien uur en geeft het volgnummer drieduizend vijftig.
    note: '*نمبر پیگیری* is het volg- of referentienummer van de afspraak – *نمبر* is een gangbaar Afghaans leenwoord voor ''nummer'', gecombineerd met *پیگیری* (opvolging); *بلی* is het Dari-woord voor ''ja''.'
