teaching:
  prs.a2.unit11.lesson01.teach.bank_word:
    title: Bank
    gloss: bank
    note: '*بانک* is het gewone woord voor een bank.'
    example_gloss: De bank is dicht bij het huis van Homayoun.
  prs.a2.unit11.lesson01.teach.account_word:
    title: Bankrekening
    gloss: bankrekening
    note: '*حساب بانکی* -- *حساب* alleen betekent in andere situaties ook ''rekening''.'
    example_gloss: Homayoun wil een bankrekening.
  prs.a2.unit11.lesson01.teach.card_word:
    title: Bankpas
    gloss: bankpas
    note: '*کارت بانکی* -- *کارت* alleen is het algemene woord voor ''kaart''.'
    example_gloss: Ik ben mijn bankpas kwijt.
  prs.a2.unit11.lesson01.teach.pin_word:
    title: pincode
    gloss: pincode / wachtwoord
    note: '*رمز* betekent zowel een pincode van de bank als een algemeen wachtwoord.'
    example_gloss: Ik ben de pincode van mijn bankpas vergeten.
  prs.a2.unit11.lesson01.teach.balance_word:
    title: Saldo
    gloss: saldo
    note: '*موجودی* is het bedrag dat nu op een rekening staat.'
    example_gloss: Het saldo op mijn rekening is laag.
  prs.a2.unit11.lesson01.teach.signature_word:
    title: Handtekening
    gloss: handtekening
    note: '*امضا* betekent zowel het tekenen zelf als de handtekening.'
    example_gloss: Zet hier alstublieft uw handtekening.
  prs.a2.unit11.lesson01.teach.if_grammar:
    title: Als, met اگر
    gloss: Als u uw tazkera (identiteitsboekje) hebt, kunt u een rekening openen.
    note: '*اگر* leidt een voorwaardelijke bijzin in -- een nieuw soort bijzin naast *چون* (omdat).'
  prs.a2.unit11.lesson01.teach.open_account_word:
    title: Een rekening openen
    gloss: een rekening openen
    note: '*باز کردن حساب* -- *باز کردن* betekent ''openen''.'
  prs.a2.unit11.lesson01.teach.va_word:
    title: En
    gloss: en
    note: '*و* is het gewone verbindingswoord dat in deze hele unit voorkomt.'
    target_text: و (en)
  prs.a2.unit11.lesson02.teach.request_account:
    title: Vragen om een rekening te openen
    gloss: Ik wilde graag een bankrekening openen.
    note: Hier komt het al bekende beleefde verzoekpatroon met *می‌خواستم* terug.
  prs.a2.unit11.lesson02.teach.if_documents:
    title: De vereiste noemen, met اگر
    gloss: Als u uw tazkera (identiteitsboekje) en een huurbewijs hebt, kunt u een rekening openen.
    note: '*اگر... داشته باشین* -- ''als u ... hebt'' -- combineert de nieuwe voorwaardelijke zin met *رسید کرایه خانه* (huurbewijs).'
  prs.a2.unit11.lesson02.teach.card_ready_timeline:
    title: Zeggen wanneer de pas klaar is
    gloss: Uw bankpas is over drie dagen klaar.
    note: '*تا سه روز دیگر* betekent ''binnen drie dagen''.'
  prs.a2.unit11.lesson03.teach.fee_word:
    title: Kosten
    gloss: kosten
    note: '*کارمزد* zijn kosten voor een dienst of transactie.'
    example_gloss: Aan deze rekening zijn geen kosten verbonden.
  prs.a2.unit11.lesson03.teach.minimum_word:
    title: Minimum
    gloss: minimum
    note: '*حداقل* betekent ''minimum'' of ''minstens''.'
    example_gloss: Het minimale saldo op de rekening is 500 afghani.
  prs.a2.unit11.lesson03.teach.notice_text:
    title: Een mededeling van de bank over het openen van een rekening
    gloss: Neem om een rekening te openen uw tazkera (identiteitsboekje) en een huurbewijs mee. Het minimale saldo op de rekening is 500 afghani. Er zijn geen maandelijkse kosten.
    note: Een korte officiële mededeling van de bank, in het formele schrijfregister dat in deze unit wordt behandeld.
  prs.a2.unit11.lesson04.teach.turn01:
    title: De bankmedewerker begroet همایون
    gloss: De medewerker nodigt hem binnen en vraagt wat hij voor hem kan doen.
    note: Dezelfde formele begroeting die een baliemedewerker gebruikt als hij hulp aanbiedt.
  prs.a2.unit11.lesson04.teach.turn02:
    title: همایون vraagt om een rekening te openen
    gloss: همایون zegt dat hij graag een bankrekening wil openen.
    note: Hetzelfde beleefde verzoekpatroon met *می‌خواستم* als eerder.
  prs.a2.unit11.lesson04.teach.turn03:
    title: De medewerker vraagt om documenten
    gloss: De medewerker vraagt of hij zijn tazkira (nationaal identiteitsboekje) en een huurbewijs bij zich heeft.
    note: '*دارین؟* -- ''heeft u?'' -- de beleefde vraagvorm.'
  prs.a2.unit11.lesson04.teach.turn04:
    title: همایون bevestigt dat hij ze heeft
    gloss: Ja, hier zijn zijn tazkira (nationaal identiteitsboekje) en zijn huurbewijs.
    note: '*این هم ...* (''hier is ...'') zeg je als je iets overhandigt.'
  prs.a2.unit11.lesson04.teach.turn05:
    title: De medewerker bevestigt en noemt de termijn
    gloss: Goed. Zijn bankpas is over uiterlijk drie dagen klaar.
    note: Herhaalt de termijn *تا سه روز دیگر آماده می‌شود* ('binnen drie dagen klaar').
  prs.a2.unit11.lesson04.teach.turn06:
    title: همایون vraagt naar de pincode
    gloss: Hij vraagt wanneer hij de pincode krijgt.
    note: '*رمزش* -- ''de pincode ervan'' -- voegt het bezitsachtervoegsel *-ش* aan *رمز* toe.'
  prs.a2.unit11.lesson04.teach.turn07:
    title: De medewerker antwoordt
    gloss: 'De medewerker zegt: op dezelfde dag dat hij de pas ophaalt.'
    note: '*همان روزی که ...* betekent ''dezelfde dag dat ...''.'
  prs.a2.unit11.lesson04.teach.turn08:
    title: همایون bedankt de medewerker
    gloss: همایون bedankt de medewerker voor zijn of haar tijd.
    note: '*تشکر از وقت‌تان* (''dank voor uw tijd'') is een beleefde afsluiting.'
