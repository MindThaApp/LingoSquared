course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor net na beginners: een gewone bankrekening openen — woordenschat, de rekening aanvragen, een mededeling van de bank lezen en het gesprek aan het bankloket zelf.'
units:
  prs.a2.unit11.banking:
    title: Een bankrekening openen
lessons:
  prs.a2.unit11.lesson01.banking_vocabulary:
    title: Woorden voor de bank
  prs.a2.unit11.lesson02.requesting_an_account:
    title: Een rekening aanvragen
  prs.a2.unit11.lesson03.reading_a_bank_notice:
    title: Een mededeling van de bank lezen
  prs.a2.unit11.lesson04.bank_counter_dialogue:
