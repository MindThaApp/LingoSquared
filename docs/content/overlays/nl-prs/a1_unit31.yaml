course:
  title: Dari in het Nederlands A1
  description: 'Dari van Kabul voor beginners: woordenschat over onderwijs en studie (universiteit, school, studierichting, student, les), een studierichting noemen (geneeskunde, rechten, economie, literatuur), vragen en vertellen waar je studeert, en een dialoog tussen Karim en Parwin over hun studie en wat ze ervan vinden.'
units:
  prs.a1.unit31.education:
    title: Onderwijs
    description: Vertel wat en waar je studeert en wat je ervan vindt.
