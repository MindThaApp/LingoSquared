teaching:
  prs.a1.unit31.lesson01.teach.education_word:
    title: Onderwijs
    gloss: onderwijs / studie
    note: تحصیل betekent onderwijs of studie in het algemeen; het themawoord van deze unit.
    example_gloss: Onderwijs is goed.
  prs.a1.unit31.lesson01.teach.university_word:
    title: Universiteit
    gloss: universiteit
    note: پوهنتون betekent universiteit. Dit is het gewone Afghaanse woord (zoals in de naam van de Universiteit van Kabul) en verschilt van het Iraanse دانشگاه.
    example_gloss: De universiteit is in Kabul.
  prs.a1.unit31.lesson01.teach.school_word:
    title: School
    gloss: school
    note: مکتب betekent school.
    example_gloss: Deze school is goed.
  prs.a1.unit31.lesson01.teach.field_word:
    title: Studierichting
    gloss: studierichting / hoofdvak
    note: رشته betekent studierichting of hoofdvak aan de universiteit. Het is een standaardwoord dat het Perzisch en het Dari delen.
    example_gloss: Mijn studierichting is geneeskunde.
  prs.a1.unit31.lesson01.teach.student_word:
    title: Student
    gloss: student
    note: محصل betekent student aan de universiteit. Het is de gangbare Afghaanse Dari-term, anders dan het Iraanse دانشجو.
    example_gloss: Hij/zij is student.
  prs.a1.unit31.lesson01.teach.lesson_word:
    title: Les
    gloss: les
    note: درس betekent les. Samen met خواندن (lezen) vormt het de combinatie voor "studeren".
    example_gloss: Ik studeer elke dag.
  prs.a1.unit31.lesson01.teach.review_khandan:
    title: Studeren
    gloss: les + lezen → ik studeer
    note: درس (les) vormt samen met خواندن (lezen) درس می‌خوانم (ik studeer). Letterlijk betekent het "ik lees een les". Dit is een echt nieuw patroon met een werkwoord-combinatie in deze cursus.
    target_text: درس (les) + خواندن (lezen) = درس می‌خوانم (ik studeer)
  prs.a1.unit31.lesson01.teach.combined_sentence:
    title: Ik studeer aan de universiteit
    gloss: Ik studeer aan de universiteit.
    note: Combineert من (ik, herhaling), در (in/op, herhaling), پوهنتون en درس می‌خوانم.
  prs.a1.unit31.lesson02.teach.medicine_word:
    title: Geneeskunde
    gloss: geneeskunde
    note: طب betekent geneeskunde als studierichting. Het is een standaardwoord dat het Perzisch en het Dari delen.
    example_gloss: Geneeskunde is moeilijk.
  prs.a1.unit31.lesson02.teach.law_word:
    title: Rechten
    gloss: rechten
    note: حقوق betekent rechten als studierichting. Het is een standaardwoord dat het Perzisch en het Dari delen.
    example_gloss: Rechten is interessant.
  prs.a1.unit31.lesson02.teach.economics_word:
    title: Economie
    gloss: economie
    note: اقتصاد betekent economie als studierichting. Het is een standaardwoord dat het Perzisch en het Dari delen.
    example_gloss: Economie is ook moeilijk.
  prs.a1.unit31.lesson02.teach.literature_word:
    title: Literatuur
    gloss: literatuur
    note: ادبیات betekent literatuur als studierichting. Het is een standaardwoord dat het Perzisch en het Dari delen.
    example_gloss: Ik hou van literatuur.
  prs.a1.unit31.lesson02.teach.reshte_ast_phrase:
    title: Mijn studierichting is geneeskunde
    gloss: Mijn studierichting is geneeskunde.
    note: Combineert رشته من (mijn studierichting, herhaling) met است (is), dat hier nieuw is.
  prs.a1.unit31.lesson02.teach.mikhanam_subject_phrase:
    title: Ik studeer geneeskunde
    gloss: Ik studeer geneeskunde.
    note: Past من ... می‌خوانم (ik studeer, herhaling) direct toe op de naam van een vakgebied, bijvoorbeeld طب.
  prs.a1.unit31.lesson03.teach.review_koja:
    title: Waar
    gloss: waar
    note: کجا betekent waar.
    target_text: کجا (waar)
  prs.a1.unit31.lesson03.teach.review_mikhanin:
    title: U studeert (formeel)
    gloss: u studeert (beleefd)
    note: درس می‌خوانین is de beleefde vorm van "u studeert". Het volgt het bekende beleefdheidspatroon op -ین (bijvoorbeeld استفاده می‌کنین uit les 30).
    target_text: درس می‌خوانین (u studeert, beleefd)
  prs.a1.unit31.lesson03.teach.question_where:
    title: Waar studeert u?
    gloss: Waar studeert u?
    note: Combineert شما (u, beleefd, herhaling), کجا (waar), درس en می‌خوانین.
  prs.a1.unit31.lesson03.teach.answer_kabul_university:
    title: Ik studeer aan de Universiteit van Kabul
    gloss: Ik studeer aan de Universiteit van Kabul.
    note: Combineert من در ... درس می‌خوانم (ik studeer aan ..., herhaling) met پوهنتون کابل (Universiteit van Kabul).
  prs.a1.unit31.lesson04.teach.review_mikhanad:
    title: Hij/zij studeert
    gloss: hij/zij studeert
    note: درس می‌خواند is de derde persoon. Het volgt het bekende patroon op -د voor de derde persoon (bijvoorbeeld استفاده می‌کند uit les 30).
    target_text: درس می‌خواند (hij/zij studeert, derde persoon)
  prs.a1.unit31.lesson04.teach.review_to_mikhani:
    title: Jij / jij studeert (informeel)
    gloss: jij / jij studeert
    note: تو en می‌خوانی zijn de informele vormen die Karim en Parwin onderling gebruiken.
    target_text: تو (jij, informeel) / می‌خوانی (jij studeert, informeel)
  prs.a1.unit31.lesson04.teach.dialogue_line1:
    title: 'Karim: Parwin, waar studeer jij?'
    gloss: Parwin, waar studeer jij?
  prs.a1.unit31.lesson04.teach.dialogue_line2:
    title: 'Parwin: Ik studeer aan de Universiteit van Kabul. Mijn studierichting is geneeskunde.'
    gloss: Ik studeer aan de Universiteit van Kabul. Mijn studierichting is geneeskunde.
  prs.a1.unit31.lesson04.teach.dialogue_line3:
    title: 'Karim: Is geneeskunde moeilijk?'
    gloss: Is geneeskunde moeilijk?
  prs.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'Parwin: Ja, het is moeilijk, maar interessant. En jij?'
    gloss: Ja, het is moeilijk, maar interessant. En jij?
  prs.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'Karim: Ik leer op school.'
    gloss: Ik leer op school.
  prs.a1.unit31.lesson04.teach.dialogue_line6:
    title: 'Parwin: Geweldig!'
    gloss: Geweldig!
  prs.a1.unit31.lesson05.teach.reading_passage:
    title: Lezen over onderwijs
    gloss: Parwin studeert aan de Universiteit van Kabul. Haar studierichting is geneeskunde. Geneeskunde is moeilijk, maar interessant. Karim zit op school.
  prs.a1.unit31.lesson06.teach.review_like_have_time:
    title: Ik hou van / tijd / ik heb geen
    gloss: ik hou van / tijd / ik heb niet
    note: دوست دارم (ik hou van), وقت (tijd) en ندارم (ik heb niet) zijn allemaal herhaling uit les 11, 14, 26, 29 en 30.
    target_text: دوست دارم (ik hou van) / وقت (tijd) / ندارم (ik heb niet)
  prs.a1.unit31.lesson06.teach.wrap_summary:
    title: Ik hou van studeren, maar ik heb geen tijd
    gloss: Ik hou van studeren, maar ik heb geen tijd.
    note: Combineert تحصیل را دوست دارم (ik hou van studeren, bekende constructie) met اما وقت ندارم (maar ik heb geen tijd).
