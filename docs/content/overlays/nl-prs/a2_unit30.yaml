course:
  title: Dari A2
  description: 'Dari uit Afghanistan voor het lagere middenniveau: zeggen wat je wel en niet kunt, wanneer je vrij of bezig bent en wat er kan gebeuren. Het modale werkwoord می‌توانم met de conjunctief, ممکن است en شاید met de conjunctief, en een tijdstip afspreken waarop je kunt komen.'
units:
