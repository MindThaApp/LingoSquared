  prs.a2.unit30.lesson06.plans_conversation:
    title: Een gesprek over vrijdag
teaching:
  prs.a2.unit30.lesson01.teach.swim:
    title: Zwemmen
    gloss: zwemmen
    note: '*شنا کردن* betekent zwemmen. Het is een werkwoord van twee woorden: het zelfstandig naamwoord *شنا* plus *کردن*. Veel vaardigheden worden zo genoemd: *آشپزی کردن* (koken), *رانندگی کردن* (autorijden), *صحبت کردن* (spreken).'
    example_gloss: Ik zwem goed.
  prs.a2.unit30.lesson01.teach.paint:
    title: Schilderen, tekenen
    gloss: schilderen, tekenen
    note: '*نقاشی کردن* betekent schilderen of een tekening maken. Net als *شنا کردن* is het een zelfstandig naamwoord plus *کردن*.'
    example_gloss: Mijn vriend schildert.
  prs.a2.unit30.lesson01.teach.letter:
    title: Brief
    gloss: brief
    note: '*نامه* betekent brief. Het werkwoord voor schrijven is *نوشتن* en de brief is wat je schrijft: *نامه نوشتن* is een brief schrijven.'
    example_gloss: De brief ligt thuis.
  prs.a2.unit30.lesson01.teach.dari:
    title: Dari
    gloss: Dari (de taal)
    note: '*دری* is de naam van de taal die je leert. Je spreekt haar met *صحبت کردن*: *دری صحبت کردن*, en *انگلیسی صحبت کردن* is Engels spreken.'
    example_gloss: Ik spreek een beetje Dari.
  prs.a2.unit30.lesson01.teach.can:
    title: 'می‌توانم: ik kan'
    gloss: Ik kan gaan. Ik kan komen. Ik kan koken.
    note: '*می‌توانم* betekent ik kan, ik ben in staat om. Er volgt altijd een tweede werkwoord in de conjunctief: *می‌توانم بروم* (ik kan gaan), *می‌توانم بیایم* (ik kan komen), *می‌توانم آشپزی کنم* (ik kan koken). De twee werkwoorden staan bij elkaar en staan allebei in de eerste persoon. Schrijf *می‌توانم* met een halve spatie (ZWNJ) tussen *می* en *توانم*, niet met een gewone spatie.'
  prs.a2.unit30.lesson01.teach.subjunctive:
    title: 'De conjunctief: ب plus de tegenwoordige stam plus م'
    gloss: ik ga, eet, lees, schrijf, kook, koop, zie, zeg (conjunctief)
    note: 'De conjunctief bestaat uit drie delen: *ب* + de tegenwoordige stam + de persoonsuitgang. Voor ik is de uitgang *-م*. De tegenwoordige stam van *رفتن* is *رو*, dus het wordt *بروم*. Dezelfde regel geeft *خوردن* → *بخورم*, *خواندن* → *بخوانم*, *نوشتن* → *بنویسم*, *پختن* → *بپزم*, *خریدن* → *بخرم*, *دیدن* → *ببینم*, *گفتن* → *بگویم*. Je kent deze vorm al van na *باید*. Na *می‌توانم* is het het tweede werkwoord. *آمدن* is onregelmatig: *بیایم*.'
  prs.a2.unit30.lesson01.teach.compound:
    title: Werkwoorden van twee woorden hebben geen ب
    gloss: Ik kan koken, autorijden, zwemmen, spreken, schilderen
    note: 'Een werkwoord dat bestaat uit een zelfstandig naamwoord en *کردن* krijgt geen *ب*. Alleen het hulpwerkwoord verandert: *کنم*. De standaard geschreven vorm is *آشپزی کنم*; *آشپزی بکنم* hoor je ook in gesproken taal. Vergelijk *می‌توانم آشپزی کنم* (ik kan koken) met *می‌توانم بروم* (ik kan gaan). Hetzelfde patroon geldt voor *رانندگی کنم*, *شنا کنم*, *صحبت کنم*, *نقاشی کنم*. Het losse werkwoord *کردن* is *بکنم*.'
  prs.a2.unit30.lesson01.teach.cook:
    title: Ik kan koken
    gloss: Ik kan koken.
    note: 'Dit is het basispatroon: onderwerp (optioneel), *می‌توانم*, de vaardigheid en de conjunctief van *کردن*.'
  prs.a2.unit30.lesson01.teach.speak_dari:
    title: Ik kan Dari spreken
    gloss: Ik kan Dari spreken.
    note: Het onderwerp *من* kun je weglaten, omdat *می‌توانم* al aangeeft wie er spreekt. Het werkwoord *صحبت کنم* sluit de zin af.
  prs.a2.unit30.lesson02.teach.paradigm:
    title: Het hele schema
    gloss: ik kan gaan, jij kunt gaan, hij/zij kan gaan, wij kunnen gaan, u kunt/jullie kunnen gaan, zij kunnen gaan
    note: 'Beide werkwoorden veranderen mee met de persoon. Het modale werkwoord: *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. De conjunctief: *بروم، بروی، برود، برویم، بروین، بروند*. Dus *می‌توانی بروی* is jij kunt gaan (tegen een vriend), *می‌تواند برود* hij of zij kan gaan, *می‌توانیم برویم* wij kunnen gaan, *می‌توانین بروین* u kunt gaan (formeel, of één persoon die je respecteert) of jullie kunnen gaan (meerdere mensen), *می‌توانند بروند* zij kunnen gaan. De uitgang van de tweede persoon meervoud is in beide werkwoorden *-ین*.'
  prs.a2.unit30.lesson02.teach.agreement:
    title: 'Werkwoorden van twee woorden: alleen کنم verandert'
    gloss: Hij kan autorijden. U kunt autorijden. Wij kunnen koken.
    note: 'Bij werkwoorden van twee woorden blijft het zelfstandig naamwoord gelijk en verandert alleen *کنم*: *کنم، کنی، کند، کنیم، کنین، کنند*. Dus: *می‌توانم رانندگی کنم*, *می‌توانی رانندگی کنی*, *می‌تواند رانندگی کند*, *می‌توانیم رانندگی کنیم*, *می‌توانین رانندگی کنین*, *می‌توانند رانندگی کنند*. De persoon moet in beide werkwoorden hetzelfde zijn.'
  prs.a2.unit30.lesson02.teach.negative:
    title: 'De ontkenning: نمی‌توانم'
    gloss: ik kan niet gaan, jij kunt niet gaan, hij/zij kan niet gaan, wij kunnen niet gaan, u kunt/jullie kunnen niet gaan, zij kunnen niet gaan
    note: 'Om te zeggen dat je iets niet kunt, zet je *ن* voor het modale werkwoord: *می‌توانم* wordt *نمی‌توانم*. Het tweede werkwoord blijft bevestigend: *نمی‌توانم بروم* (ik kan niet gaan), niet *نمی‌توانم نروم*. Alle uitgangen zijn dezelfde als in het bevestigende schema.'
  prs.a2.unit30.lesson02.teach.help_q:
    title: Kunt u mij helpen?
    gloss: Kunt u mij helpen?
    note: 'Zo vraag je een vriend of hij of zij iets kan: *می‌توانی* plus de conjunctief. Tegen iemand die je respecteert, of tegen meerdere mensen, zeg je *می‌توانین به من کمک کنین؟*.'
  prs.a2.unit30.lesson02.teach.no_drive:
    title: Hij kan niet autorijden
    gloss: Hij kan niet autorijden. / Zij kan niet autorijden.
    note: '*او* betekent ''hij'' of ''zij'', dus deze zin gaat over één persoon die niet kan autorijden. *نمی‌تواند* is de ontkenning; *کند* is de conjunctief van *کردن* voor hij of zij.'
  prs.a2.unit30.lesson03.teach.busy:
    title: Bezet
    gloss: druk bezig, bezet
    note: '*مشغول* betekent ''druk bezig''. Je zegt *مشغول استم* (ik ben bezig), het tegenovergestelde van *آزاد استم* (ik ben vrij).'
    example_gloss: Vandaag ben ik bezig.
  prs.a2.unit30.lesson03.teach.tonight:
    title: Vanavond
    gloss: vanavond
    note: '*امشب* betekent ''vanavond''. Net als *فردا* (morgen) en *امروز* (vandaag) is het een tijdwoord dat voor het werkwoord staat.'
    example_gloss: Vanavond ben ik thuis.
  prs.a2.unit30.lesson03.teach.five:
    title: Vijf
    gloss: vijf
    note: '*پنج* is vijf. *ساعت پنج* is vijf uur en *بعد از ساعت پنج* is na vijf uur.'
    example_gloss: Om vijf uur ga ik naar huis.
  prs.a2.unit30.lesson03.teach.time_word:
    title: Tijdwoord plus می‌توانم
    gloss: Morgen kan ik komen. Vanavond kan ik niet komen. Op vrijdag kan ik komen.
    note: 'Om te zeggen wanneer je iets kunt doen, zet je een tijdwoord in de zin: *فردا*, *امشب*, *روز جمعه*. De werkwoorden blijven hetzelfde, *می‌توانم بیایم*; het tijdwoord laat zien dat het om de toekomst gaat, dus je hebt geen aparte toekomstige vorm nodig. Het tijdwoord kan voorop staan (*فردا می‌توانم بیایم*) of na het modale werkwoord (*می‌توانم فردا بیایم*). De vraag is *فردا می‌توانی بیایی؟* (Kun je morgen komen?).'
  prs.a2.unit30.lesson03.teach.reply:
    title: Ja, nee, omdat, maar
    gloss: Ja, ik kan komen. Nee, ik kan niet komen, omdat ik bezig ben. Maar op vrijdag ben ik vrij.
    note: 'Om iets aan te nemen antwoord je *بلی* en herhaal je het modale werkwoord: *بلی، می‌توانم بیایم*. Om af te wijzen antwoord je *نخیر* en geef je de reden met *چون*: *نخیر، نمی‌توانم بیایم، چون مشغول استم*. Met *ولی* (maar) stel je dan een ander moment voor: *ولی روز جمعه آزاد استم*. *آزاد استم* betekent ''ik ben vrij'' en *مشغول استم* ''ik ben bezig''. Je kunt ook zeggen *کار دارم* (ik heb werk).'
  prs.a2.unit30.lesson03.teach.after_five:
    title: Vrij na vijven
    gloss: Na vijf uur ben ik vrij.
    note: Hiermee vertel je de ander wanneer je vrij bent. *بعد از ساعت پنج* is na vijf uur.
  prs.a2.unit30.lesson03.teach.when_q:
    title: Wanneer kun je komen?
    gloss: Wanneer kun je komen?
    note: '*کی* vraagt naar het tijdstip. Het antwoord heeft hetzelfde patroon met een tijdwoord: *فردا می‌توانم بیایم* of *بعد از ساعت پنج می‌توانم بیایم*.'
  prs.a2.unit30.lesson04.teach.possible:
    title: Het is mogelijk, het kan zijn dat
    gloss: het is mogelijk dat, het kan zijn dat
    note: '*ممکن است* betekent ''het is mogelijk, het kan zijn dat''. Erna volgt een bijzin waarvan het werkwoord in de conjunctief staat: *ممکن است باران ببارد* (het kan gaan regenen). *ممکن* verandert nooit; het werkwoord erna geeft de persoon aan.'
    example_gloss: Morgen gaat het misschien regenen.
  prs.a2.unit30.lesson04.teach.maybe:
    title: Misschien
    gloss: misschien
    note: '*شاید* betekent ''misschien''. Net als *ممکن است* wordt het gevolgd door de conjunctief: *شاید بیایم* (misschien kom ik), *شاید او بیاید* (misschien komt hij). *شاید* is korter en wordt meer in gesproken taal gebruikt.'
    example_gloss: Misschien komt hij.
  prs.a2.unit30.lesson04.teach.rain:
    title: Regen
    gloss: regen
    note: '*باران* is regen. Het werkwoord is *باریدن*: *باران ببارد* (het kan regenen), *باران نبارد* (het regent misschien niet). De conjunctief van *باریدن* is *ببارد*.'
    example_gloss: Vandaag regent het.
  prs.a2.unit30.lesson04.teach.sure:
    title: Zeker
    gloss: zeker, overtuigd
    note: '*مطمئن* betekent ''zeker''. *مطمئن نیستم* is ''ik weet het niet zeker''. Het is een natuurlijke zin om te zeggen voordat je *شاید* of *ممکن است* toevoegt.'
    example_gloss: Ik weet het niet zeker.
  prs.a2.unit30.lesson04.teach.possible_subj:
    title: ممکن است plus de conjunctief
    gloss: Het kan zijn dat ik te laat kom. Het kan zijn dat hij komt. Het kan gaan regenen.
    note: 'Na *ممکن است* staat het werkwoord in de conjunctief, in de persoon die je bedoelt: *بیایم* (ik kom), *بیایی* (jij komt), *بیاید* (hij komt), *بیاییم* (wij komen), *بیایین* (jullie/u komt), *بیایند* (zij komen). Bij de ontkenning komt *ن* voor de conjunctief: *ممکن است نیاید* (het kan zijn dat hij niet komt). Vergelijk met *می‌توانم*: dat zegt dat ik het kan; *ممکن است* zegt dat het mogelijk is dat het gebeurt.'
  prs.a2.unit30.lesson04.teach.maybe_subj:
    title: شاید plus de conjunctief
    gloss: Misschien kom ik. Misschien kom jij. Misschien komt hij. Misschien komen ze niet.
    note: '*شاید* werkt precies als *ممکن است*: het wordt gevolgd door de conjunctief en de persoon blijkt uit de uitgang van het werkwoord: *شاید بیایم، شاید بیایی، شاید بیاید، شاید بیاییم، شاید بیایین، شاید بیایند*. De ontkenning heeft *ن* op het werkwoord: *شاید نیایند* (misschien komen ze niet). Een tijdwoord kan ervoor staan: *شاید فردا بیایم*.'
  prs.a2.unit30.lesson04.teach.can_maybe:
    title: 'شاید بتوانم: misschien kan ik'
    gloss: Misschien kan ik komen. Misschien kan ik niet komen. Hij of zij kan misschien komen.
    note: 'Je kunt de twee ideeën combineren: *شاید* of *ممکن است* plus de conjunctief van *توانستن*, namelijk *بتوانم، بتوانی، بتواند، بتوانیم، بتوانین، بتوانند*, plus het tweede werkwoord. *شاید بتوانم بیایم* betekent dus ''misschien kan ik komen''. De ontkenning is *نتوانم*: *شاید نتوانم بیایم* is ''misschien kan ik niet komen''. Dat is handig als je nog niet weet of je vrij bent.'
  prs.a2.unit30.lesson04.teach.maybe_tomorrow:
    title: Misschien kan ik morgen komen
    gloss: Misschien kan ik morgen komen.
    note: Je weet het niet zeker, maar er is een kans. Het tijdwoord *فردا* staat na *شاید*.
  prs.a2.unit30.lesson04.teach.rain_phrase:
    title: Het kan gaan regenen
    gloss: Het kan gaan regenen.
    note: '*ممکن است* plus *ببارد*: een mogelijkheid, geen belofte.'
  prs.a2.unit30.lesson05.teach.fix:
    title: Repareren
    gloss: repareren, maken
    note: '*درست کردن* is iets repareren, en ook maken, zoals in *چای درست کردن* (thee zetten). Het voorwerp komt eerst met *را*: *کمپیوترم را درست می‌کنم*.'
    example_gloss: Mijn vriend repareert mijn auto.
  prs.a2.unit30.lesson05.teach.problem:
    title: Probleem
    gloss: probleem, moeilijkheid
    note: '*مشکل* is een probleem. *مشکل کوچک* is een klein probleem.'
    example_gloss: Het probleem is klein.
  prs.a2.unit30.lesson05.teach.turn01:
    title: Wahida vraagt of Sakhi kan komen
    gloss: Sakhi, kun je morgen bij ons thuis komen?
    note: 'Wahida vraagt een vriend of hij morgen vrij is: *فردا می‌توانی ... بیایی؟*. Ze gebruikt *تو* omdat Sakhi een vriend is.'
  prs.a2.unit30.lesson05.teach.turn02:
    title: Sakhi noemt zijn tijd
    gloss: '''s Ochtends kan ik niet, want ik moet werken op kantoor. Maar na vijf uur ben ik vrij.'
    note: Sakhi wijst de ochtend af met *نمی‌توانم* en geeft de reden met *چون*. Bij *نمی‌توانم* wordt het tweede werkwoord weggelaten, omdat *بیایم* duidelijk is uit de vraag. Daarna stelt hij met *ولی* een ander moment voor.
  prs.a2.unit30.lesson05.teach.turn03:
    title: Wahida vraagt om hulp
    gloss: Dat is goed. Mijn computer is kapot. Kun je hem repareren?
    note: '*می‌توانی ... درست کنی؟* vraagt of hij het kan repareren. *آن را* (het) verwijst terug naar de computer.'
  prs.a2.unit30.lesson05.teach.turn04:
    title: Sakhi weet het niet zeker
    gloss: Misschien kan ik het. Het probleem is misschien klein.
    note: Sakhi is niet zeker, dus hij zegt *شاید بتوانم* (misschien kan ik het) en *ممکن است ... باشد* (het kan zijn dat het ... is). Beide worden gevolgd door de conjunctief.
  prs.a2.unit30.lesson05.teach.message:
    title: Een bericht van een vriend
    gloss: Hallo vriend. Morgen kan ik niet komen, want 's ochtends moet ik werken op kantoor. Na vijf uur ben ik vrij, maar het kan zijn dat ik te laat kom. Misschien kan ik donderdag komen. Ben jij donderdag vrij?
    note: 'Een kort bericht met alle drie de ideeën van de eenheid: wat de schrijver niet kan doen (*نمی‌توانم بیایم*), wanneer de schrijver vrij is (*بعد از ساعت پنج آزاد استم*) en wat er kan gebeuren (*ممکن است دیر برسم، شاید ... بتوانم*).'
  prs.a2.unit30.lesson06.teach.park:
    title: Park
    gloss: park
    note: '*پارک* is een park. Je gaat *به پارک* (naar het park) en je bent *در پارک* (in het park).'
    example_gloss: Het park is in Kabul.
  prs.a2.unit30.lesson06.teach.tea:
    title: Thee
    gloss: thee
    note: '*چای* is thee. *چای درست کردن* is thee zetten, met het werkwoord uit de vorige les.'
    example_gloss: De thee is warm.
  prs.a2.unit30.lesson06.teach.turn01:
    title: Hamid vraagt naar vrijdag
    gloss: Palwasha, ga je vrijdag naar het park?
    note: '*جمعه به پارک می‌روی؟* vraagt naar een plan met de gewone tegenwoordige tijd *می‌روی* en een tijdwoord. Palwasha is een vriendin, dus hij gebruikt *تو*.'
  prs.a2.unit30.lesson06.teach.turn02:
    title: Palwasha weet het niet zeker
    gloss: Misschien ga ik. Het kan gaan regenen.
    note: Palwasha weet het niet zeker. *شاید بروم* is 'misschien ga ik' en *ممکن است باران ببارد* is 'het kan gaan regenen'. Beide werkwoorden staan in de conjunctief.
  prs.a2.unit30.lesson06.teach.turn03:
    title: Hamid biedt aan en vraagt
    gloss: Ik kan koken. Kun jij thee zetten?
    note: Hamid zegt wat hij kan (*می‌توانم غذا بپزم*) en vraagt wat Palwasha kan (*می‌توانی چای درست کنی؟*).
  prs.a2.unit30.lesson06.teach.turn04:
    title: Palwasha stemt in, met een voorwaarde
    gloss: Ja, dat kan ik. Maar als het regent, kunnen we niet in het park blijven.
    note: '*بلی، می‌توانم* is instemmen. Dan geeft *اگر باران ببارد* (als het regent) een voorwaarde en *نمی‌توانیم ... بمانیم* zegt wat die twee niet kunnen doen. Ook *اگر* wordt gevolgd door de conjunctief.'
  prs.a2.unit30.lesson06.teach.turn05:
    title: Hamid heeft een ander idee
    gloss: Dan eten we misschien bij mij thuis.
    note: '*شاید ... بخوریم* is een voorstel dat zou kunnen werken: misschien eten we bij mij thuis. *پس* (dan, dus) volgt uit het probleem van de regen.'
exercises:
  prs.a2.unit30.lesson01.exercise01.recognize_swim:
    instruction: Wat betekent deze zin?
    correct_option: Ik kan zwemmen
    distractors:
    - Ik heb gisteren gezwommen
    - Ik hou van water
    - Ik wil leren zwemmen
    accepted_answers:
    - value: Ik kan zwemmen
      status: correct
    feedback: '*می‌توانم شنا کنم* is ''ik kan zwemmen'': *می‌توانم* plus de conjunctief *کنم*.'
  prs.a2.unit30.lesson01.exercise02.recognize_letter:
    instruction: Wat betekent deze zin?
    correct_option: Ik kan een brief schrijven
    distractors:
    - Ik heb een brief geschreven
    - Ik heb een brief
    - Ik moet een brief schrijven
    accepted_answers:
    - value: Ik kan een brief schrijven
      status: correct
    feedback: '*می‌توانم نامه بنویسم* is ''ik kan een brief schrijven'': *نامه* is de brief en *بنویسم* is de conjunctief van *نوشتن*.'
  prs.a2.unit30.lesson01.exercise03.match_skills:
    instruction: Koppel elke Dari-zin aan de juiste betekenis.
