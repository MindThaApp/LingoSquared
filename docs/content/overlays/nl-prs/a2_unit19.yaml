  prs.a2.unit19.lesson01.exercise05.order_thursday_bank:
    instruction: 'Zet de woorden in de juiste volgorde: Donderdagmiddag ging ik naar de bank.'
    accepted_answers:
    - value:
      - پنجشنبه
      - عصر
      - به
      - بانک
      - رفتم
      status: correct
    - value:
      - به
      - بانک
      - پنجشنبه
      - عصر
      - رفتم
      status: correct
    feedback: '*پنجشنبه عصر به بانک رفتم* zet de tijd voorop, dan de plaats en als laatste het werkwoord in de verleden tijd.'
  prs.a2.unit19.lesson01.exercise06.translate_went_bank:
    instruction: 'Vertaal in het Dari met de verleden tijd van رفتن: Ik ging naar de bank.'
    accepted_answers:
    - value: به بانک رفتم
      status: correct
    - value: من به بانک رفتم
      status: correct
    feedback: '*به بانک رفتم* is Ik ging naar de bank. Je mag *من* toevoegen, maar de uitgang *-م* zegt al ik.'
