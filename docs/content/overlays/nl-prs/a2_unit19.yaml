course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor lager-gevorderden: vertellen wat je afgelopen weekend hebt gedaan, in volgorde, inclusief wat je niet hebt gedaan. De eenvoudige verleden tijd als systeem (verleden stam plus uitgangen), de ontkennende verleden tijd en het contrast met de tegenwoordige tijd.'
units:
  prs.a2.unit19.last_weekend:
    title: Afgelopen weekend
lessons:
  prs.a2.unit19.lesson01.weekend_words_and_past_form:
    title: Weekendwoorden en de verleden tijd
  prs.a2.unit19.lesson02.building_the_past:
    title: De verleden tijd vormen met meer werkwoorden
  prs.a2.unit19.lesson03.negative_past:
    title: De ontkennende verleden tijd, en verleden versus tegenwoordige tijd
  prs.a2.unit19.lesson04.telling_in_order:
    title: In volgorde vertellen
  prs.a2.unit19.lesson05.reading_and_listening:
    title: Lezen en luisteren over een weekend
  prs.a2.unit19.lesson06.weekend_conversation:
    title: Een gesprek over het weekend
teaching:
  prs.a2.unit19.lesson01.teach.last_weekend:
    title: Afgelopen weekend
    gloss: afgelopen weekend
    note: '*آخر هفته* is het weekend en *گذشته* betekent verleden of afgelopen. Samen is *آخر هفتهٔ گذشته* afgelopen weekend, het tijdskader voor deze hele unit.'
    example_gloss: Afgelopen weekend ging ik naar de bazaar.
  prs.a2.unit19.lesson01.teach.thursday_friday:
    title: Donderdag, vrijdag
    gloss: Donderdag, vrijdag
    note: In Afghanistan is vrijdag de wekelijkse vrije dag, en veel mensen beginnen hun weekend op donderdagmiddag. *پنجشنبه* en *جمعه* zijn dus de twee dagen die je het meest gebruikt in verhalen over het weekend.
    example_gloss:
    - Donderdagmiddag ging ik naar de bank.
    - Vrijdag ging ik naar het park.
  prs.a2.unit19.lesson01.teach.afternoon:
    title: Middag
    gloss: middag, late middag
    note: '*عصر* is de late middag. Het komt na de dag: *پنجشنبه عصر* is donderdagmiddag.'
    example_gloss: Donderdagmiddag ging ik naar de bank.
  prs.a2.unit19.lesson01.teach.yesterday:
    title: Gisteren
    gloss: gisteren
    note: '*دیروز* is een herhalingswoord uit de unit over gebeurtenissen in het verleden. Het gaat samen met dezelfde verleden tijd die je in deze unit leert vormen.'
    example_gloss: Gisteren at ik ontbijt.
  prs.a2.unit19.lesson01.teach.in_bazaar:
    title: In de bazaar
    gloss: in de bazaar
    note: '*در* betekent in of op, en *بازار* is de bazaar of markt, de plek van veel weekendboodschappen.'
    example_gloss: In de bazaar kocht ik brood en fruit.
  prs.a2.unit19.lesson01.teach.bank:
    title: Bank
    gloss: bank
    note: '*بانک* is de bank. Het is nog een plek waar mensen naartoe gaan voor hun boodschappen.'
    example_gloss: In de middag ging ik naar de bank.
  prs.a2.unit19.lesson01.teach.park:
    title: Park
    gloss: park
    note: '*پارک* is het park, een herhalingswoord uit de units over uitstapjes.'
    example_gloss: Vrijdag ging ik met mijn vrienden naar het park.
  prs.a2.unit19.lesson01.teach.shopping:
    title: Winkelen
    gloss: winkelen, boodschappen doen
    note: '*خرید کردن* is de gewone manier om te zeggen dat je boodschappen of inkopen hebt gedaan. *خرید* is het winkelen en *کردن* is het werkwoord doen.'
    example_gloss: Ik heb in de bazaar boodschappen gedaan.
  prs.a2.unit19.lesson01.teach.visiting:
    title: Op bezoek gaan
    gloss: op bezoek gaan bij iemand
    note: '*به دیدن* plus een persoon plus *رفتن* betekent bij die persoon op bezoek gaan: *به دیدن فامیلم رفتم* is ik ging op bezoek bij mijn familie. Bezoekjes zijn het tweede grote onderwerp van deze unit.'
    example_gloss: Vrijdag ging ik op bezoek bij mijn familie.
  prs.a2.unit19.lesson01.teach.family:
    title: Familie, verwanten
    gloss: familie, verwanten
    note: '*فامیل* is je familie en verwanten. Voeg *-م* toe voor mijn: *فامیلم* is mijn familie.'
    example_gloss: Mijn familie woont in Kabul.
  prs.a2.unit19.lesson01.teach.errands:
    title: Dingen te doen hebben
    gloss: dingen te doen hebben, boodschappen te doen hebben
    note: '*کار* is werk, maar het betekent ook een taak of een klusje. *کار داشتن* is dingen te doen hebben. *چند* betekent een paar, enkele of hoeveel.'
    example_gloss: Donderdagmiddag had ik een paar dingen te doen.
  prs.a2.unit19.lesson01.teach.go_paradigm:
    title: 'De eenvoudige verleden tijd: verleden stam plus uitgangen'
    gloss: ik ging, jij ging, hij/zij ging, wij gingen, u/jullie gingen, zij gingen
    note: 'De eenvoudige verleden tijd is een systeem, geen lijst woorden die je uit je hoofd leert. Neem het hele werkwoord *رفتن* (gaan) en laat de laatste *ن* weg: de verleden stam is *رفت*. Voeg dan een uitgang toe: *-م* voor ik (*رفتم*), *-ی* voor jij tegen een vriend (*رفتی*), niets voor hij of zij (*رفت*), *-یم* voor wij (*رفتیم*), *-ین* voor u of jullie (*رفتین*), *-ند* voor zij (*رفتند*). Het voornaamwoord (*من، تو، او*) is optioneel, want de uitgang laat al zien wie het deed. Let op: de verleden tijd heeft geen *می* ervoor, de tegenwoordige tijd wel.'
  prs.a2.unit19.lesson02.teach.eat_paradigm:
    title: 'Dezelfde regel, nieuw werkwoord: eten'
    gloss: ik at, jij at, hij/zij at, wij aten, u/jullie aten, zij aten
    note: 'De regel van *رفتن* werkt voor bijna elk werkwoord. *خوردن* (eten) verliest de *ن* en geeft de verleden stam *خورد*, waarna dezelfde zes uitgangen volgen: *خوردم، خوردی، خورد، خوردیم، خوردین، خوردند*. De vorm voor hij of zij is gewoon de kale stam, dus *خورد* betekent hij of zij at.'
  prs.a2.unit19.lesson02.teach.breakfast:
    title: Gisteren at ik ontbijt
    gloss: Gisteren at ik ontbijt.
    note: '*صبحانه* is het ontbijt, een herhalingswoord uit de units over de dagelijkse routine. *خوردم* is de verleden tijd van *خوردن* met de uitgang *-م*.'
  prs.a2.unit19.lesson02.teach.bread_fruit:
    title: Brood en fruit
    gloss: brood en fruit
    note: '*نان* is brood en *میوه* is fruit. *و* betekent en.'
    example_gloss: In de bazaar kocht ik brood en fruit.
  prs.a2.unit19.lesson02.teach.more_verbs:
    title: Nog vijf werkwoorden, één regel
    gloss: zien, kopen, doen, worden, hebben in de verleden tijd
    note: 'Elk werkwoord hier volgt dezelfde regel: laat de *ن* weg en voeg de uitgang toe. *دیدن* (zien) geeft *دیدم* (ik zag) en *دیدی* (jij zag). *خریدن* (kopen) geeft *خریدم* (ik kocht). *کردن* (doen of maken) geeft *کردم* (ik deed) en *کردی* (jij deed). *شدن* (worden) geeft *شدم* (ik werd). *داشتن* (hebben) geeft *داشتم* (ik had). Alleen het laatste deel van het werkwoord verandert, nooit de stam. Let op: *خرید* is zowel de verleden stam van *خریدن* (kopen) als het zelfstandig naamwoord inkopen, zoals in *خرید کردن*.'
  prs.a2.unit19.lesson02.teach.movie:
    title: Ik zag een film
    gloss: Ik zag een film.
    note: '*فلم* is een film. In het Dari zeg je *فلم دیدن*, letterlijk een film zien, dus *دیدم* is het werkwoord.'
  prs.a2.unit19.lesson02.teach.exercise:
    title: Ik heb gesport
    gloss: Ik heb gesport.
    note: '*ورزش* is sport of lichaamsbeweging. *ورزش کردن* betekent sporten, en de uitgang komt achter *کردن*: *ورزش کردم*.'
  prs.a2.unit19.lesson02.teach.woke_late:
    title: Ik werd laat wakker
    gloss: Ik werd laat wakker.
    note: '*دیر* betekent laat en *بیدار شدن* betekent wakker worden. *بیدار شدم* is ik werd wakker, en *دیر* komt ervoor.'
  prs.a2.unit19.lesson03.teach.neg_paradigm:
    title: 'De ontkennende verleden tijd: ن plus het werkwoord in de verleden tijd'
    gloss: ik ging niet, jij ging niet, hij/zij ging niet, wij gingen niet, u/jullie gingen niet, zij gingen niet
    note: 'Om te zeggen dat je iets niet deed, zet je *ن* helemaal voor het werkwoord in de verleden tijd: *رفتم* (ik ging) wordt *نرفتم* (ik ging niet). Verder verandert er niets, dus dezelfde zes uitgangen volgen: *نرفتم، نرفتی، نرفت، نرفتیم، نرفتین، نرفتند*. In de ontkennende eenvoudige verleden tijd is er geen *نمی*. Een afgeronde handeling die niet plaatsvond is gewoon *ن* plus het werkwoord in de verleden tijd.'
  prs.a2.unit19.lesson03.teach.neg_breakfast:
    title: Ik at geen ontbijt
    gloss: Ik heb niet ontbeten.
    note: '*نخوردم* is *ن* plus *خوردم*: ik at niet.'
  prs.a2.unit19.lesson03.teach.neg_more:
    title: Dezelfde ن bij andere werkwoorden
    gloss: ik zag niet, ik kocht niet, ik had niet, ik deed niet
    note: 'De regel werkt voor elk werkwoord dat je tot nu toe kent: *ندیدم* (ik zag niet), *نخریدم* (ik kocht niet), *نداشتم* (ik had niet), *نکردم* (ik deed niet). Altijd eerst *ن*, dan het werkwoord in de verleden tijd. Een paar werkwoorden die met آ beginnen veranderen in spelling: *آمدم* (ik kwam) wordt *نیامدم* (ik kwam niet).'
  prs.a2.unit19.lesson03.teach.neg_compound:
    title: Werkwoorden met کردن ontkennen
    gloss: Ik heb in de bazaar niet gewinkeld. Ik heb niet gesport.
    note: 'Sommige werkwoorden bestaan uit een zelfstandig naamwoord plus *کردن*, zoals *خرید کردن* (winkelen) en *ورزش کردن* (sporten). Zet de *ن* voor *کردن*, niet voor het zelfstandig naamwoord: *خرید نکردم*, *ورزش نکردم*. *نخرید کردم* is fout.'
  prs.a2.unit19.lesson03.teach.past_vs_present:
    title: Verleden versus tegenwoordige tijd
    gloss: Ik ga naar de bazaar. / Ik ging naar de bazaar. / Ik ging niet naar de bazaar.
    note: 'De tegenwoordige tijd van dit werkwoord is *می‌روم* (ik ga): *می* plus de tegenwoordige stam *رو* plus de uitgang. De verleden tijd is *رفتم*, zonder *می*. Om de tegenwoordige tijd te ontkennen gebruik je *نمی‌روم*, maar om de verleden tijd te ontkennen gebruik je alleen *ن*: *نرفتم*. Gebruik de verleden tijd voor een afgeronde handeling, zoals afgelopen weekend, en de tegenwoordige tijd voor wat je regelmatig doet of nu aan het doen bent.'
  prs.a2.unit19.lesson04.teach.first:
    title: Eerst
    gloss: eerst
    note: '*اول* opent een reeks. Het is een herhalingswoord uit de unit over het weekschema.'
    example_gloss: Eerst at ik ontbijt.
  prs.a2.unit19.lesson04.teach.then:
    title: Daarna
    gloss: daarna, vervolgens
    note: '*بعد* zet de reeks voort na *اول*.'
    example_gloss: Daarna ging ik naar de bank.
  prs.a2.unit19.lesson04.teach.but:
    title: Maar
    gloss: maar
    note: '*ولی* verbindt iets wat je deed met iets wat je niet deed: het zet die twee tegenover elkaar.'
    example_gloss: Ik ging naar de bazaar, maar ik deed geen boodschappen.
  prs.a2.unit19.lesson04.teach.no:
    title: Nee
    gloss: nee
    note: '*نخیر* is het beleefde, gewone nee in het Dari, om te antwoorden op een ja/nee-vraag.'
    example_gloss: Nee, ik heb geen film gezien.
  prs.a2.unit19.lesson04.teach.finally:
    title: Tot slot
    gloss: tot slot, op het eind
    note: '*در آخر* sluit een reeks af, na *اول* en *بعد*. Je kent beide woorden erin al.'
    example_gloss: Tot slot ging ik op bezoek bij mijn familie.
  prs.a2.unit19.lesson04.teach.home:
    title: Thuis, huis
    gloss: thuis, huis
    note: '*خانه* is het huis of thuis, een herhalingswoord uit de unit over wonen.'
    example_gloss: Tot slot ging ik naar huis.
  prs.a2.unit19.lesson04.teach.order_grammar:
    title: Een weekend in volgorde vertellen
    gloss: Donderdag ging ik eerst naar de bank, daarna deed ik boodschappen in de bazaar en tot slot ging ik naar huis.
    note: 'Om in volgorde te vertellen wat je deed, geef je elke afgeronde handeling een eigen werkwoord in de verleden tijd en gebruik je *اول، بعد، در آخر* om de volgorde aan te geven. De handelingen komen in de volgorde waarin ze gebeurden: *اول به بانک رفتم، بعد در بازار خرید کردم و در آخر به خانه رفتم.* Je kunt de delen verbinden met een komma, een punt of *و*. Om iets toe te voegen wat je niet deed, gebruik je *ولی* en een ontkennend werkwoord in de verleden tijd: *به بازار رفتم، ولی خرید نکردم.*'
  prs.a2.unit19.lesson05.teach.also:
    title: Ook
    gloss: ook
    note: '*هم* betekent ook en staat na het woord waar het bij hoort: *فلم هم ندیدم* is Ik heb ook geen film gezien.'
    example_gloss: Ik ben ook naar de bazaar gegaan.
  prs.a2.unit19.lesson05.teach.my_friend:
    title: Mijn vriend
    gloss: mijn vriend
    note: '*دوست* is vriend en *-م* voegt mijn toe: *دوستم* is mijn vriend.'
    example_gloss: Op vrijdag ben ik mijn vriend gaan opzoeken.
  prs.a2.unit19.lesson05.teach.my_friends:
    title: Mijn vrienden
    gloss: mijn vrienden
    note: '*دوستان* is vrienden (het meervoud van *دوست*) en *-م* voegt mijn toe: *دوستانم* is mijn vrienden.'
    example_gloss: Vrijdag ging ik met mijn vrienden naar het park.
  prs.a2.unit19.lesson05.teach.with:
    title: Met
    gloss: met
    note: '*با* betekent met. Het staat voor de persoon: *با دوستانم* is met mijn vrienden.'
    example_gloss: Ik ben met mijn vrienden naar de bazaar gegaan.
  prs.a2.unit19.lesson05.teach.message:
    title: Een bericht over het afgelopen weekend
    gloss: Afgelopen weekend had ik donderdagmiddag een paar dingen te doen. Eerst ging ik naar de bank, daarna kocht ik brood en fruit op de bazaar. Op vrijdag werd ik laat wakker en at ik ontbijt, daarna ging ik mijn familie opzoeken. Ik heb niet gesport en ik heb ook geen film gezien.
    note: 'Een kort geschreven verslag van een weekend, in de volgorde waarin het gebeurde. Twee dingen gebeurden niet, en elk daarvan is een ontkennend werkwoord in de verleden tijd: *ورزش نکردم* en *فلم ندیدم*.'
  prs.a2.unit19.lesson05.teach.exchange_q:
    title: Homayoun vraagt Zarmina naar donderdag
    gloss: Zarmina, ben je donderdag naar de bank gegaan?
    note: Homayoun stelt de vraag met het verleden werkwoord *رفتی*, de vorm voor jij (vriend). Het is een ja-neevraag over een afgeronde handeling.
  prs.a2.unit19.lesson05.teach.exchange_a:
    title: Zarmina antwoordt
    gloss: Nee, ik ben niet naar de bank gegaan. Ik heb een film gezien.
    note: Zarmina zegt eerst wat er niet gebeurde, *به بانک نرفتم*, en dan wat er wel gebeurde, *فلم دیدم*.
  prs.a2.unit19.lesson06.teach.turn01:
    title: Zarmina vraagt naar het afgelopen weekend
    gloss: Homayoun, wat heb je afgelopen weekend gedaan?
    note: '*چه کار کردی؟* is Wat heb je gedaan? Er wordt gevraagd naar een afgeronde handeling, dus gebruikt men de verleden tijd *کردی*.'
  prs.a2.unit19.lesson06.teach.turn02:
    title: Homayoun vertelt over zijn karweitjes en zijn bezoek
    gloss: Donderdagmiddag had ik een paar dingen te doen. Eerst ging ik naar de bank, daarna kocht ik brood en fruit op de bazaar. Op vrijdag ging ik mijn familie opzoeken.
    note: Homayoun noemt de karweitjes op volgorde met *اول* en *بعد*, en gaat dan verder met vrijdag.
  prs.a2.unit19.lesson06.teach.turn03:
    title: Zarmina vraagt naar sporten
    gloss: Heb je gesport?
    note: Een ja-neevraag over een afgeronde handeling, met de verleden tijd *کردی*.
  prs.a2.unit19.lesson06.teach.turn04:
    title: Homayoun zegt nee en vraagt terug
    gloss: Nee, ik heb niet gesport. En jij?
    note: '*نخیر، ورزش نکردم* antwoordt met de ontkennende verleden tijd. *تو چطور؟* is een korte manier om En jij? te vragen.'
  prs.a2.unit19.lesson06.teach.turn05:
    title: Zarmina vertelt over haar weekend
    gloss: Donderdag heb ik een film gezien. Vrijdag ben ik met mijn vrienden naar de bazaar gegaan, maar ik heb niet gewinkeld.
    note: 'Zarmina gebruikt *ولی* om wat ze deed, naar de bazaar gaan, tegenover wat ze niet deed te zetten: *خرید نکردم*.'
  prs.a2.unit19.lesson06.teach.turn06:
    title: Homayoun reageert
    gloss: Wat fijn!
    note: '*چه خوب!* betekent Wat fijn! of Wat goed!, een vriendelijke reactie op goed nieuws.'
