  prs.a1.unit23.lesson06.teach.review_summary:
    title: Samenvatting
    gloss: 'Ik heb geld: contant en een pinpas. Ik kan dollars bij de geldwisselaar omwisselen voor afghani''s. De koers van vandaag is zeventig afghani''s voor één dollar.'
