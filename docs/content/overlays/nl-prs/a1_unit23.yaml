    title: Dollar
    gloss: dollar
    note: دالر betekent dollar (USD) -- in Afghanistan wordt het bij het wisselen van geld veel gebruikt en naast de afghani genoemd.
    example_gloss: Ik heb honderd dollar.
  prs.a1.unit23.lesson01.teach.review_dorom:
    title: Ik heb
    gloss: ik heb
    note: دارم betekent "ik heb" (al geleerd in Unit 10, winkelen).
    example_gloss: Ik heb geld.
  prs.a1.unit23.lesson01.teach.review_sad:
    title: Honderd
    gloss: honderd
    note: صد betekent honderd -- al geleerd bij de getallen in Unit 4 en gebruikt in Unit 10, winkelen.
    example_gloss: Ik heb honderd dollar.
  prs.a1.unit23.lesson02.teach.mipardazam:
    title: Ik betaal
    gloss: ik betaal
    note: می‌پردازم betekent "ik betaal".
    example_gloss: Ik betaal contant.
  prs.a1.unit23.lesson02.teach.ya:
    title: Of
    gloss: of
    note: یا betekent of.
    example_gloss: Ik betaal contant of met de kaart.
  prs.a1.unit23.lesson02.teach.naqdi_ya_karti:
    title: Contant of met kaart?
    gloss: Betaalt u contant of met pin?
    note: Een veelgestelde vraag in een winkel of aan de balie van een wisselkantoor.
  prs.a1.unit23.lesson02.teach.review_mitanom:
    title: Ik kan
    gloss: ik kan
    note: می‌توانم betekent "ik kan" (al eerder in de cursus geleerd).
    example_gloss: Ik kan contant betalen.
  prs.a1.unit23.lesson02.teach.bepardazam:
    title: Betalen
    gloss: betalen
    note: بپردازم is de aanvoegende vorm van "betalen" en wordt gebruikt na می‌توانم (ik kan) -- می‌توانم نقد بپردازم betekent letterlijk "ik kan contant betalen".
    example_gloss: Ik kan contant betalen.
  prs.a1.unit23.lesson03.teach.sarafi:
    title: Wisselkantoor
    gloss: wisselkantoor
    note: صرافی is de gewone, in Afghanistan veelgebruikte plek om geld te wisselen -- iets anders dan een formele بانک (bank).
    example_gloss: Ik ga naar het wisselkantoor.
  prs.a1.unit23.lesson03.teach.tabdil_kardan:
