    title: Zarmina
    gloss: Zarmina
    note: زرمینه, het vaste terugkerende personage.
    example_gloss: Zarmina gaat naar de geldwisselaar.
  prs.a1.unit23.lesson04.teach.review_besyar_khub:
    title: Heel goed
    gloss: heel goed
    note: بسیار خوب, al eerder behandeld, wordt hier gebruikt om een aanbod te accepteren.
