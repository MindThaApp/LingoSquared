    title: 'Herhaling: is, vandaag, hoeveel'
    gloss: is / vandaag / hoeveel
    note: است, امروز en چند zijn herhalingswoorden (al eerder in de cursus behandeld) die in de vraag over de koers van deze les samenkomen.
    example_gloss: Wat is de dollarkoers van vandaag?
  prs.a1.unit23.lesson03.teach.review_ba_ra_mikonam:
    title: 'Herhaling: naar, lijdend voorwerpmarkering, ik doe, doen, ik wil'
    gloss: naar / lijdend voorwerpmarkering / ik doe / doen / ik wil
    note: به, را, می‌کنم, کنم en می‌خواهم zijn herhalingswoorden (al eerder in de cursus behandeld) die in de zinnen van het gesprek in deze les samenkomen.
    example_gloss: Ik wil dollars omwisselen voor afghani's.
