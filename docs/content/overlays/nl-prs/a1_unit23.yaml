    title: 'Geldwisselaar: Hoeveel dollar heeft u?'
    gloss: Hoeveel dollar heeft u?
  prs.a1.unit23.lesson04.teach.turn03:
    title: 'Zarmina: Ik heb honderd dollar. Wat is de koers vandaag?'
    gloss: Ik heb honderd dollar. Wat is de koers vandaag?
