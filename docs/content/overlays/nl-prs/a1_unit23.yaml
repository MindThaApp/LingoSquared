    title: Voor
    gloss: voor
    note: برای betekent "voor".
    example_gloss: Zeventig afghani's voor één dollar.
  prs.a1.unit23.lesson06.teach.review_va:
    title: En
    gloss: en
    note: و betekent "en" en is al bekend uit eerdere units.
    example_gloss: 'Ik heb geld: contant en een pinpas.'
