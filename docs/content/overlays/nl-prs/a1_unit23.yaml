course:
  title: Dari in het Nederlands A1
  description: 'Kabul-Dari voor beginners: woorden over geld en betalen, vragen naar de betaalwijze, geld wisselen bij een صرافی (wisselkantoor) en een gesprek tussen Zarmina en Homayoun over het wisselen van dollars naar afghani''s.'
units:
