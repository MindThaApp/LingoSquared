    title: 'Geldwisselaar: Vandaag is één dollar zeventig afghani''s.'
    gloss: Vandaag is één dollar zeventig afghani's.
  prs.a1.unit23.lesson04.teach.turn05:
    title: 'Zarmina: Heel goed, wisselt u het maar om.'
    gloss: Heel goed, wisselt u het maar om.
    note: 'تبدیل کنین is de beleefde gebiedende wijs: "wisselt u (alstublieft) om".'
  prs.a1.unit23.lesson04.teach.turn06:
    title: 'Geldwisselaar: Alstublieft, zevenduizend afghani''s.'
    gloss: Alstublieft, zevenduizend afghani's.
  prs.a1.unit23.lesson04.teach.turn07:
    title: 'Zarmina: Dank u.'
