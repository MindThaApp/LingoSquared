    title: 'Herhaling: zeventig, dank, deed/maakte'
    gloss: zeventig / dank / deed, maakte (hij/zij)
    note: هفتاد en تشکر zijn herhalingswoorden; کرد is de verleden tijd van کردن (doen/maken) voor de derde persoon, al gebruikt in de les over de verleden tijd in Unit 20. Hier worden ze samengebracht om het gesprek samen te vatten.
    example_gloss: Zarmina wisselde honderd dollar om voor afghani's.
  prs.a1.unit23.lesson04.teach.turn01:
    title: 'Zarmina: Hallo, ik wil dollars omwisselen voor afghani''s.'
    gloss: Hallo, ik wil dollars omwisselen voor afghani's.
