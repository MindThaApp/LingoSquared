  prs.a1.unit23.lesson05.teach.reading_text:
    title: Leestekst
    gloss: Zarmina ging naar de geldwisselaar. Ze had honderd dollar en wilde dollars omwisselen voor afghani's. De koers van vandaag was zeventig afghani's. Zarmina kreeg zevenduizend afghani's en nam een bonnetje.
