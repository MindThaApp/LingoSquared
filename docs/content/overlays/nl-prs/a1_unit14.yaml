    title: ik hou niet van / ik vind niet lekker
    gloss: ik houd niet van
    note: دوست ندارم is de ontkenning van دوست دارم.
  prs.a1.unit14.lesson01.teach.man_word:
    title: Ik
    gloss: ik
    note: من is het zelfstandige persoonlijk voornaamwoord voor de eerste persoon (ik).
    example_gloss: Ik hou van koffie.
  prs.a1.unit14.lesson01.teach.ra_word:
    title: (lijdend voorwerp-markering)
    gloss: (markeert het lijdend voorwerp van het werkwoord)
    note: را markeert een bepaald lijdend voorwerp. In het Dari gebruik je het zowel in gesproken als in geschreven taal; de Iraanse vorm رو wordt niet gebruikt.
    target_text: را (lijdend voorwerp-markeerder)
  prs.a1.unit14.lesson02.teach.kodam_word:
    title: Welke
    gloss: welke
    note: کدام betekent welke (van beide/van meerdere).
    example_gloss: Welke vind je leuk?
  prs.a1.unit14.lesson02.teach.moosiqi_word:
    title: Muziek
    gloss: muziek
    note: موسیقی betekent muziek.
    example_gloss: Ik hou van muziek.
  prs.a1.unit14.lesson02.teach.darid_grammar:
    title: U hebt / u houdt van (beleefd)
    gloss: u hebt / u vindt leuk
    note: دارین is de beleefde vorm (en meervoudsvorm) van de tweede persoon van داشتن (hebben), in lijn met het beleefde register van deze cursus, waarin استم/استین voorop staan.
    target_text: دارین (u hebt/vindt leuk, beleefd)
