course:
  title: Dari in het Nederlands A1
  description: 'Dari van Kabul voor beginners: woorden voor uiterlijk (lang, klein, haar, ogen, baard, bril), vragen hoe iemand eruitziet met قیافه‌اش چطور است؟, haar- en oogkleur (رنگ مو/رنگ چشم) en een dialoog tussen Zarmina en Homayoun over het herkennen van iemand aan zijn uiterlijk.'
units:
  prs.a1.unit27.appearance:
    title: Uiterlijk
    description: Beschrijf het uiterlijk van een persoon en vraag hoe iemand eruitziet.
lessons:
  prs.a1.unit27.lesson01.appearance_vocabulary:
    title: Woorden voor uiterlijk
  prs.a1.unit27.lesson02.appearance_question:
