  prs.a1.unit27.lesson03.hair_eye_color:
    title: Haar- en oogkleur
  prs.a1.unit27.lesson04.appearance_dialogue:
    title: Dialoog over uiterlijk
  prs.a1.unit27.lesson05.reading_appearance:
    title: Lezen over uiterlijk
  prs.a1.unit27.lesson06.wrap_up:
    title: Afsluiting
teaching:
  prs.a1.unit27.lesson01.teach.tall_phrase:
    title: Lang
    gloss: lang
    note: قد بلند betekent letterlijk "lange lengte" -- قد (lengte) + بلند (lang/hoog).
    example_gloss: Hij/zij is lang.
  prs.a1.unit27.lesson01.teach.short_phrase:
    title: Klein
    gloss: klein (van gestalte)
    note: قد کوتاه betekent letterlijk "korte lengte" -- قد (lengte, herhaling) + کوتاه (kort).
    example_gloss: Hij/zij is klein.
  prs.a1.unit27.lesson01.teach.hair_word:
    title: Haar
    gloss: haar
    note: مو betekent haar; موی is hetzelfde woord in de verbindingsvorm, die voor een ander woord staat (bijv. موی سیاه, "zwart haar").
    example_gloss: Zijn/haar haar is zwart.
  prs.a1.unit27.lesson01.teach.eye_word:
    title: Oog
    gloss: oog
    note: چشم betekent oog (in het enkelvoud gebruikt om oogkleur te beschrijven, het gewone dagelijkse patroon).
    example_gloss: Zijn/haar ogen zijn zwart.
  prs.a1.unit27.lesson01.teach.beard_word:
    title: Baard
    gloss: baard
    note: ریش betekent baard.
    example_gloss: Hij/zij heeft een baard.
  prs.a1.unit27.lesson01.teach.glasses_word:
    title: Bril
    gloss: bril
    note: عینک betekent bril.
    example_gloss: Hij/zij heeft een bril.
  prs.a1.unit27.lesson01.teach.review_ast_dast:
    title: Is / heeft (derde persoon)
    gloss: is / heeft (3e persoon)
    note: است (is) en دارد (heeft, 3e persoon) ken je al van eerder in de cursus. Ze komen in deze les steeds terug om iemands uiterlijk te beschrijven.
    target_text: است (is) / دارد (heeft, 3e persoon)
  prs.a1.unit27.lesson02.teach.qiyafa_word:
    title: Uiterlijk
    gloss: uiterlijk
    note: قیافه betekent iemands uiterlijk of looks (bijv. خوش قیافه, "knap").
    example_gloss: Zijn/haar uiterlijk is goed.
  prs.a1.unit27.lesson02.teach.review_chetor:
    title: Hoe
    gloss: hoe
    note: چطور betekent "hoe" (al eerder in de cursus geleerd, in begroetingen als چطور استین؟).
    target_text: چطور (hoe)
  prs.a1.unit27.lesson02.teach.qiyafash_word:
    title: Zijn/haar uiterlijk
    gloss: zijn/haar uiterlijk
    note: قیافه‌اش combineert قیافه (uiterlijk) met het bezittelijk achtervoegsel ‌اش ("zijn/haar").
  prs.a1.unit27.lesson02.teach.question_appearance:
    title: Hoe ziet hij/zij eruit?
    gloss: Hoe ziet hij/zij eruit?
    note: قیافه‌اش چطور است؟ is de natuurlijke manier om te vragen hoe iemand eruitziet -- bewust niet alleen چطور است؟, want dat betekent op zichzelf "Hoe gaat het met hem/haar?" (de begroeting over gezondheid en welzijn).
  prs.a1.unit27.lesson02.teach.answer_tall:
    title: Hij/zij is lang
    gloss: Hij/zij is lang.
    note: Combineert او (hij/zij, herhaling) met قد بلند است uit deze les.
  prs.a1.unit27.lesson02.teach.answer_black_hair:
    title: Hij/zij heeft zwart haar
    gloss: Hij/zij heeft zwart haar.
    note: Combineert موی (haar) met سیاه (zwart) en دارد (heeft).
  prs.a1.unit27.lesson02.teach.answer_beard:
    title: Hij/zij heeft een baard
    gloss: Hij/zij heeft een baard.
    note: Gebruikt ریش دارد, hetzelfde "hebben"-patroon als bij zwart haar hierboven.
  prs.a1.unit27.lesson03.teach.review_rang:
    title: Kleur
    gloss: kleur
    note: رنگ betekent kleur (al eerder in de cursus geleerd, in les 21 over kleding).
    target_text: رنگ (kleur)
  prs.a1.unit27.lesson03.teach.blue_word:
    title: Blauw
    gloss: blauw
    note: آبی betekent blauw.
    example_gloss: Zijn/haar ogen zijn blauw.
  prs.a1.unit27.lesson03.teach.brown_word:
    title: Bruin
    gloss: bruin
    note: قهوه‌ای betekent bruin (voor haar- of oogkleur).
    example_gloss: Zijn/haar haar is bruin.
  prs.a1.unit27.lesson03.teach.eye_color_phrase:
    title: Oogkleur
    gloss: oogkleur
    note: 'رنگ چشم betekent letterlijk "kleur van oog": رنگ (kleur) + چشم (oog).'
  prs.a1.unit27.lesson03.teach.hair_color_phrase:
    title: Haarkleur
    gloss: haarkleur
    note: 'رنگ مو betekent letterlijk "kleur van haar": رنگ (kleur) + مو (haar).'
  prs.a1.unit27.lesson03.teach.eye_blue_sentence:
    title: Zijn/haar ogen zijn blauw
    gloss: Zijn/haar ogen zijn blauw.
    note: Hier gebruik je آبی uit deze les bij چشم.
  prs.a1.unit27.lesson03.teach.hair_brown_sentence:
    title: Zijn/haar haar is bruin
    gloss: Zijn/haar haar is bruin.
    note: Hier gebruik je قهوه‌ای uit deze les bij موی.
  prs.a1.unit27.lesson04.teach.review_baradar:
    title: Broer / jouw broer
    gloss: broer / jouw broer (informeel)
    note: برادر (broer) is herhaling uit les 3; برادرت voegt het informele bezittelijke achtervoegsel ت ("jouw") toe, passend bij het informele تو.
    target_text: برادر (broer) / برادرت (je broer, informeel)
  prs.a1.unit27.lesson04.teach.review_bali_tashakor:
    title: Ja / dank je / ook
    gloss: ja / bedankt / ook
    note: بلی (ja), تشکر (bedankt) en هم (ook) zijn alle herhaling van eerder in de cursus.
    target_text: بلی (ja) / تشکر (bedankt) / هم (ook)
  prs.a1.unit27.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, hoe ziet je broer eruit?'
    gloss: 'Homayoun: Zarmina, hoe ziet je broer eruit?'
    note: Een informele vraag tussen vrienden, met het bezittelijke achtervoegsel -ت bij برادر.
  prs.a1.unit27.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Hij is lang en heeft zwart haar'
    gloss: 'Zarmina: Hij is lang en heeft zwart haar.'
    note: Twee eigenschappen worden met و (en) verbonden.
  prs.a1.unit27.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Heeft hij een baard?'
    gloss: 'Homayoun: Heeft hij een baard?'
    note: Een ja/nee-vraag die je maakt met alleen een stijgende intonatie op ریش دارد.
  prs.a1.unit27.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Ja, hij heeft een baard en ook een bril'
    gloss: 'Zarmina: Ja, hij heeft een baard en ook een bril.'
    note: Hier gebruik je هم (ook) bij een tweede eigenschap.
  prs.a1.unit27.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Goed, bedankt'
    gloss: 'Homayoun: Goed, bedankt.'
    note: خوب (goed) is een nieuw, eenvoudig afsluitend woord; تشکر (bedankt) is herhaling.
  prs.a1.unit27.lesson05.teach.reading_passage:
    title: Lezen over uiterlijk
    gloss: Karim is lang. Hij heeft zwart haar en bruine ogen. Hij heeft geen baard, maar wel een bril.
    note: Een korte leestekst die de uiterlijkswoorden van deze unit herhaalt. Hierin komt de naam کریم (Karim, het bekende personage uit de unit over vergelijkingen) voor, en ندارد (heeft niet, de ontkennende vorm van دارد voor de derde persoon).
  prs.a1.unit27.lesson06.teach.review_ama:
    title: Maar
    gloss: maar
    note: اما betekent "maar" (eerder in deze unit geïntroduceerd in de leestekst van les 5; ook herhaling uit eerdere units).
    target_text: اما (maar)
  prs.a1.unit27.lesson06.teach.review_astam:
    title: Ik ben / ik heb
    gloss: ik ben / ik heb
    note: استم (ik ben) en دارم (ik heb) zijn allebei herhaling van eerder in de cursus, hier gebruikt voor een beschrijving van je eigen uiterlijk.
    target_text: استم (ik ben) / دارم (ik heb)
  prs.a1.unit27.lesson06.teach.wrap_summary:
    title: Ik ben klein, maar ik heb zwart haar
    gloss: Ik ben klein, maar ik heb zwart haar.
    note: Twee eigenschappen van het uiterlijk worden met اما gecombineerd.
