    note: رزرو, نمبر (uit deze unit), پنج, دوشنبه, سه‌شنبه en و zijn herhalingswoorden die in de leestekst worden gebruikt.
    target_text: رزرو (reservering) / نمبر (nummer) / پنج (vijf) / دوشنبه (maandag) / سه‌شنبه (dinsdag) / و (en)
