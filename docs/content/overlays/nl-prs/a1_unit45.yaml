  prs.a1.unit45.lesson04.teach.dialogue_line2:
    title: 'Hotelmedewerker: Welkom. Wat is uw naam?'
    gloss: Welkom. Wat is uw naam?
  prs.a1.unit45.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Ik ben Homayoun.'
    gloss: Ik ben Homayoun.
  prs.a1.unit45.lesson04.teach.dialogue_line4:
    title: 'Hotelmedewerker: Heel goed. De kamer heeft een badkamer en het ontbijt is inbegrepen.'
