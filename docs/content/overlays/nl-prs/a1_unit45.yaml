teaching:
  prs.a1.unit45.lesson01.teach.review_this_is_in:
    title: 'Herhaling: dit, is, in'
    gloss: dit / is / in
    note: این, است en در (in de hele cursus gebruikt) zijn herhalingswoorden die je nodig hebt om over hotels en kamers te praten.
    target_text: این (dit) / است (is) / در (in)
  prs.a1.unit45.lesson01.teach.hotel_word:
    title: Hotel
    gloss: hotel
    note: هوتل is het Afghaanse Dari-woord voor hotel, geschreven met een waw. Het verschilt van het Iraanse Perzische هتل.
    example_gloss: Dit is een hotel.
  prs.a1.unit45.lesson01.teach.room_word:
    title: Kamer
    gloss: kamer
    note: اتاق is het gewone Dari-woord voor een kamer.
    example_gloss: De kamer is in het hotel.
  prs.a1.unit45.lesson01.teach.room_in_hotel_phrase:
    title: De kamer is in het hotel
    gloss: De kamer is in het hotel.
    note: اتاق در هوتل است combineert woorden die eerder in deze les aan bod kwamen.
  prs.a1.unit45.lesson01.teach.key_word:
    title: Sleutel
    gloss: sleutel
    note: کلید is het standaard Dari-woord voor een sleutel.
    example_gloss: Dit is een sleutel.
  prs.a1.unit45.lesson01.teach.room_key_phrase:
    title: Kamersleutel
    gloss: kamersleutel
    note: کلید اتاق combineert کلید (sleutel) en اتاق (kamer).
  prs.a1.unit45.lesson01.teach.this_is_room_key_phrase:
    title: Dit is de kamersleutel
    gloss: Dit is de kamersleutel.
    note: این کلید اتاق است combineert woorden die eerder in deze les aan bod kwamen.
  prs.a1.unit45.lesson02.teach.review_have:
    title: 'Herhaling: ik heb, het heeft'
    gloss: ik heb / het heeft
    note: دارم en دارد zijn herhalingswoorden die je gebruikt om naar kamervoorzieningen te vragen.
    target_text: دارم (ik heb) / دارد (het heeft)
  prs.a1.unit45.lesson02.teach.bathroom_word:
    title: Badkamer
    gloss: badkamer
    note: تشناب is het gewone Dari-woord voor een badkamer of toilet.
    example_gloss: De kamer heeft een badkamer.
  prs.a1.unit45.lesson02.teach.room_has_bathroom_question_phrase:
    title: Heeft de kamer een badkamer?
    gloss: Heeft de kamer een badkamer?
    note: اتاق تشناب دارد؟ is een ja/nee-vraag die je vormt met stijgende intonatie, zonder apart vraagwoord.
  prs.a1.unit45.lesson02.teach.yes_has_bathroom_phrase:
    title: Ja, er is een badkamer
    gloss: Ja, er is een badkamer.
    note: بلی is het herhalingswoord voor ‘ja’.
  prs.a1.unit45.lesson02.teach.reservation_word:
    title: Reservering
    gloss: reservering
    note: رزرو is een veelgebruikt leenwoord voor een reservering of boeking.
    example_gloss: Ik heb een reservering.
  prs.a1.unit45.lesson02.teach.have_reservation_phrase:
    title: Ik heb een reservering
    gloss: Ik heb een reservering.
    note: رزرو دارم combineert رزرو (reservering) en دارم (ik heb).
  prs.a1.unit45.lesson03.teach.review_which_number_for:
    title: 'Herhaling: hoeveel/welk nummer, voor, ik wil'
    gloss: hoeveel / welk nummer / voor / ik wil
    note: چند, برای en می‌خواهم zijn herhalingswoorden die je gebruikt om naar de kamer te vragen.
    target_text: چند (hoeveel / welk getal) / برای (voor) / می‌خواهم (ik wil)
  prs.a1.unit45.lesson03.teach.number_word:
    title: Nummer
    gloss: nummer
    note: نمبر is het gewone Afghaanse Dari-leenwoord voor ‘nummer’, gebruikt voor kamernummers, telefoonnummers en dergelijke.
    example_gloss: kamernummer
  prs.a1.unit45.lesson03.teach.what_is_room_number_phrase:
    title: Wat is het kamernummer?
    gloss: Wat is het kamernummer?
    note: نمبر اتاق چند است؟ vraagt met چند naar het kamernummer.
  prs.a1.unit45.lesson03.teach.review_night_numbers:
    title: 'Herhaling: nacht, twee, drie'
    gloss: nacht / twee / drie
    note: شب, دو en سه zijn herhalingswoorden die je gebruikt om de duur van je verblijf te noemen.
    target_text: شب (nacht) / دو (twee) / سه (drie)
  prs.a1.unit45.lesson03.teach.stay_word:
    title: Ik blijf
    gloss: ik blijf
    note: می‌مانم komt van ماندن, ‘blijven’.
    example_gloss: Ik blijf twee nachten.
  prs.a1.unit45.lesson03.teach.stay_two_nights_phrase:
    title: Ik blijf twee nachten
    gloss: Ik blijf twee nachten.
    note: دو شب می‌مانم combineert دو شب (twee nachten) en می‌مانم (ik blijf).
  prs.a1.unit45.lesson03.teach.for_two_nights_phrase:
    title: Ik wil het voor twee nachten
    gloss: Ik wil het voor twee nachten.
    note: برای دو شب می‌خواهم gebruikt برای (voor) met het herhalingswoord می‌خواهم.
  prs.a1.unit45.lesson03.teach.review_stay_formal:
    title: 'Herhaling: u blijft'
    gloss: u blijft
    note: می‌مانین is de beleefde meervoudsvorm van می‌مانم en hoort bij dezelfde -ین-groep als می‌خواهین en کنین elders in deze cursus.
    target_text: می‌مانین (u blijft, beleefd)
  prs.a1.unit45.lesson03.teach.how_many_nights_formal_phrase:
    title: Hoeveel nachten blijft u?
    gloss: Hoeveel nachten blijft u?
    note: چند شب می‌مانین؟ is de beleefde vraag die een hotelmedewerker stelt.
  prs.a1.unit45.lesson04.teach.review_welcome_name_am:
    title: 'Herhaling: welkom, wat is uw naam?, ik ben'
    gloss: welkom / wat is uw naam? / ik ben
    note: خوش آمدین, نام‌تان چیست؟ en استم zijn herhalingswoorden die je bij het inchecken gebruikt.
    target_text: خوش آمدین (welkom) / نام‌تان چیست؟ (wat is uw naam?) / استم (ik ben)
  prs.a1.unit45.lesson04.teach.review_also_how_about_please_thanks:
