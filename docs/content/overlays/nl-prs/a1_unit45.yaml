    title: 'Herhaling: hij/zij blijft'
    gloss: hij/zij blijft
    note: می‌ماند is de vorm voor de 3e persoon van de familie می‌مانم/می‌مانین die eerder in deze unit is behandeld.
    target_text: می‌ماند (hij/zij blijft)
  prs.a1.unit45.lesson05.teach.reading_passage:
    title: Lezen over de reservering van Homayoun
    gloss: 'Dit is de reservering van Homayoun. De kamer is nummer vijf. Homayoun blijft twee nachten: maandag en dinsdag. De kamer heeft een badkamer en het ontbijt is inbegrepen.'
