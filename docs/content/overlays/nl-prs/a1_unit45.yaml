    note: هم, چطور, بفرمایین en تشکر زیاد (uit eerdere units) zijn herhalingswoorden om het gesprek af te sluiten.
    target_text: هم (ook) / چطور (en hoe zit het met) / بفرمایین (alstublieft) / تشکر زیاد (hartelijk bedankt)
  prs.a1.unit45.lesson04.teach.breakfast_phrase:
    title: Ontbijt
    gloss: het ontbijt
    note: چای صبح betekent letterlijk ‘ochtendthee’. Zo zeg je in het Afghaanse Dari gewoonlijk ‘ontbijt’. Het is opgebouwd uit چای (thee, Unit 8) en صبح (ochtend, Unit 16).
  prs.a1.unit45.lesson04.teach.included_word:
