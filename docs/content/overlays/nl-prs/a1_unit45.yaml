    title: 'Herhaling: maar, u, uur, tijd, zeven, twaalf'
    gloss: maar / u / uur / tijd / zeven / twaalf
    note: اما, شما, ساعت, وقت (uit eerdere units) en هفت/دوازده zijn herhalingswoorden die worden gebruikt om een schema te noemen.
    target_text: اما (maar) / شما (u, beleefd) / ساعت (uur) / وقت (tijd) / هفت (zeven) / دوازده (twaalf)
