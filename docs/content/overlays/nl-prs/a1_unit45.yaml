  prs.a1.unit45.lesson04.teach.dialogue_line5:
    title: 'Homayoun: En de wifi?'
    gloss: En de wifi?
  prs.a1.unit45.lesson04.teach.dialogue_line6:
    title: 'Hotelmedewerker: Ja, er is ook wifi. Alstublieft, de sleutel.'
    gloss: Ja, er is ook wifi. Alstublieft, de sleutel.
