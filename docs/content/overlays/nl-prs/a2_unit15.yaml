course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor lager-gevorderden: omgaan met een reisverstoring — een geannuleerde intercitybus, vragen naar alternatieven, een mededeling op het station lezen en het gesprek met het stationspersoneel zelf.'
units:
  prs.a2.unit15.travel_disruption:
    title: Reisverstoring
lessons:
  prs.a2.unit15.lesson01.disruption_vocabulary:
    title: Woorden voor reisverstoring
  prs.a2.unit15.lesson02.asking_about_alternatives:
    title: Vragen naar alternatieven
  prs.a2.unit15.lesson03.reading_a_station_notice:
    title: Een mededeling op het station lezen
  prs.a2.unit15.lesson04.station_dialogue:
    title: Op het busstation
teaching:
  prs.a2.unit15.lesson01.teach.delay_word:
    title: Vertraging
    gloss: vertraging
    note: '*تأخیر* is een algemeen woord voor vertraging -- een bus, een afspraak, alles wat te laat is.'
    example_gloss: De bus van vandaag heeft een uur vertraging.
  prs.a2.unit15.lesson01.teach.cancellation_word:
    title: Annulering
    gloss: annulering
    note: '*لغو* wordt gebruikt met *شدن* (*لغو شده*, ''is geannuleerd'').'
    example_gloss: De bus van negen uur is geannuleerd.
  prs.a2.unit15.lesson01.teach.closed_word:
    title: Gesloten
    gloss: gesloten
    note: '*بسته* zeg je van een weg, een winkel of een kantoor die niet open is.'
    example_gloss: De weg Kabul–Mazar-e Sharif is afgesloten.
  prs.a2.unit15.lesson01.teach.alternative_route_word:
    title: Alternatieve route
    gloss: alternatieve route
    note: '*مسیر بدیل* -- *مسیر* betekent ''route'' en *بدیل* betekent ''alternatief''.'
    example_gloss: Er is geen alternatieve route.
  prs.a2.unit15.lesson01.teach.snowfall_word:
    title: Sneeuwval
    gloss: sneeuwval
    note: '*برفباری* -- *برف* (sneeuw) plus het achtervoegsel dat er ''sneeuwval'' van maakt.'
    example_gloss: Door sneeuwval is de weg afgesloten.
  prs.a2.unit15.lesson01.teach.notice_word:
    title: Mededeling
    gloss: mededeling
    note: '*اطلاعیه* is een mededeling die is opgehangen, zoals die op de muur van een station.'
    example_gloss: Ik lees de mededeling van het station.
  prs.a2.unit15.lesson01.teach.due_to_grammar:
    title: Vanwege, met به دلیل
    gloss: Vanwege de sneeuwval is de bus geannuleerd.
    note: '*به دلیل* + zelfstandig naamwoord geeft een oorzaak aan. Dit is de A2-grammaticastap van deze unit: een nieuw voegwoord voor oorzaak naast *چون* (omdat) uit Unit 10, dat juist een volledige zin achter zich krijgt.'
  prs.a2.unit15.lesson01.teach.wait_phrase:
    title: Zeg dat je moet wachten
    gloss: U moet tot morgenochtend wachten.
    note: '*باید ... صبر کنین* -- ''u moet wachten'' -- de beleefde meervoudsuitgang van het werkwoord, die je tegen een vreemde gebruikt.'
  prs.a2.unit15.lesson01.teach.va_word:
    title: En
    gloss: en
    note: '*و* is het gewone verbindingswoord waarmee je in deze unit zinnen aan elkaar koppelt.'
    target_text: و (en)
  prs.a2.unit15.lesson01.teach.first_person_wait:
    title: Ik moet ook wachten
    gloss: Ik moet ook wachten.
    note: '*من هم باید صبر کنم* introduceert de aanvoegende wijs van de eerste persoon, *کنم* (''ik doe''), die na *باید* -- ''moeten'' -- zonder *می‌* wordt gebruikt.'
  prs.a2.unit15.lesson02.teach.ask_next_bus:
    title: Vraag wanneer de volgende bus vertrekt
    gloss: Wanneer vertrekt de volgende bus?
    note: '*بعدی* betekent ''volgende''.'
  prs.a2.unit15.lesson02.teach.ask_alternative_route:
    title: Vraag naar een alternatieve route
    gloss: Is er een alternatieve route?
    note: '*وجود دارد؟* -- ''bestaat het?'' -- een gangbare manier om te vragen of iets beschikbaar is.'
  prs.a2.unit15.lesson02.teach.tomorrow_departure:
    title: Zeg hoe laat de bus morgen vertrekt
    gloss: De bus vertrekt morgen om acht uur 's ochtends.
    note: Hier komt het al bekende patroon met *ساعت* (uur) terug.
  prs.a2.unit15.lesson03.teach.station_word:
    title: Station
    gloss: station
    note: '*ایستگاه* gebruik je voor een busstation net zoals voor een treinstation.'
    example_gloss: Homayoun ging naar het busstation.
  prs.a2.unit15.lesson03.teach.passengers_word:
    title: Passagiers
    gloss: passagiers
    note: '*مسافران* is het meervoud van *مسافر* (passagier/reiziger).'
    example_gloss: Passagiers moeten wachten.
  prs.a2.unit15.lesson03.teach.notice_text:
    title: Een mededeling op het station over de geannuleerde bus
    gloss: De bus van 9 uur van vandaag naar Mazar-e Sharif is vanwege sneeuwval geannuleerd. De weg Kabul-Mazar-e Sharif is afgesloten. Passagiers moeten tot morgenochtend wachten. De volgende bus vertrekt morgen om 8 uur 's ochtends.
    note: Een korte officiële mededeling op het station, in het formele schrijftaalregister dat deze unit behandelt.
  prs.a2.unit15.lesson04.teach.turn01:
    title: Het stationspersoneel begroet همایون
    gloss: Het stationspersoneel vraagt waarmee het hem kan helpen.
    note: Een formele begroeting, zoals die van de baliemedewerker in Unit 9 (*بفرمایین، چه خدمتی...*), hier met *کمکی* ('hulp') in plaats van *خدمتی* ('dienst').
  prs.a2.unit15.lesson04.teach.turn02:
    title: همایون vraagt naar de bus van 9 uur
    gloss: همایون vraagt wanneer de bus van 9 uur naar Mazar-e Sharif vertrekt.
    note: Hier komt het vraagpatroon *کی ... می‌کند؟* uit lesson02 terug.
  prs.a2.unit15.lesson04.teach.turn03:
    title: Het stationspersoneel legt de annulering uit
    gloss: Het stationspersoneel biedt zijn excuses aan en zegt dat die bus vanwege sneeuwval is geannuleerd.
    note: '*متأسفم* betekent ''het spijt me''.'
  prs.a2.unit15.lesson04.teach.turn04:
    title: همایون vraagt naar een alternatief
    gloss: همایون vraagt of er een alternatieve route is.
    note: Precies dezelfde vraag als in lesson02.
  prs.a2.unit15.lesson04.teach.turn05:
    title: Het stationspersoneel antwoordt en noemt de wachttijd
    gloss: Nee, de weg is afgesloten. U moet tot morgenochtend wachten.
    note: '*نخیر* is een formelere manier om ''nee'' te zeggen, naast *بلی*, zoals dat in deze cursus al wordt gebruikt.'
  prs.a2.unit15.lesson04.teach.turn06:
    title: همایون vraagt naar de bus van morgen
    gloss: همایون vraagt hoe laat de bus morgen vertrekt.
    note: '*چند* betekent hier ''hoe laat''.'
  prs.a2.unit15.lesson04.teach.turn07:
    title: Het stationspersoneel noemt de tijd
    gloss: De bus van morgen vertrekt om 8 uur 's ochtends.
    note: Precies hetzelfde feit als in lesson02, want het is hetzelfde echte detail.
  prs.a2.unit15.lesson04.teach.turn08:
    title: همایون bedankt het personeel
    gloss: همایون bedankt hen voor de informatie.
    note: '*معلومات‌تان* -- ''uw informatie'' -- krijgt het formele bezittelijke achtervoegsel *-تان*.'
