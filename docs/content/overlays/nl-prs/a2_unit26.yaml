    pairs:
    - left: رفته بودم
      right: ik was gegaan
    - left: رفته بودی
      right: jij was gegaan (tegen een vriend)
    - left: رفته بود
      right: hij, zij of het was gegaan
    - left: رفته بودیم
      right: wij waren gegaan
    - left: رفته بودین
      right: u was gegaan / jullie waren gegaan (formeel of meervoud)
    - left: رفته بودند
      right: zij waren gegaan
    - left: طیاره
      right: vliegtuig
    - left: میدان هوایی
      right: luchthaven
    - left: ایستگاه
      right: station
  prs.a2.unit26.lesson01.exercise05.order_we_arrived_station:
