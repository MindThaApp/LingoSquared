    - left: خورده بود
      right: hij of zij had gegeten
    - left: دیده بود
      right: hij of zij had gezien
    - left: رسیده بود
      right: hij of zij was aangekomen
    - left: آمده بود
      right: hij of zij was gekomen
    - left: کرده بود
