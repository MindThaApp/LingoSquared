course:
  title: Dari A2
  description: 'Dari uit Afghanistan voor lager gevorderden: zeggen dat iets al gebeurd was vóór een bepaald moment in het verleden, bijvoorbeeld dat de bus al vertrokken was voordat jij aankwam. De voltooid verleden tijd (voltooid deelwoord plus de verleden tijd van بودن), de ontkenning ervan en het verschil met de simpele verleden tijd.'
units:
  prs.a2.unit26.already_happened:
    title: Het was al gebeurd
lessons:
  prs.a2.unit26.lesson01.form_and_travel_words:
    title: De vorm "was gegaan" en reiswoorden
  prs.a2.unit26.lesson02.more_verbs_with_bud:
    title: Meer werkwoorden met "had"
  prs.a2.unit26.lesson03.earlier_and_later:
    title: De eerdere gebeurtenis en de latere
  prs.a2.unit26.lesson04.time_words:
    title: Al, eerder, nog niet
  prs.a2.unit26.lesson05.reading_and_listening:
    title: Lezen en luisteren over te laat komen
  prs.a2.unit26.lesson06.airport_conversation:
    title: Een gesprek over een gemiste vlucht
teaching:
  prs.a2.unit26.lesson01.teach.bus:
    title: Bus
    gloss: bus
    note: '*بس* is de bus, het gebruikelijke vervoermiddel tussen steden in Afghanistan. Dit is een herhalingswoord uit de les over vervoer.'
    example_gloss: De bus gaat naar Mazar.
  prs.a2.unit26.lesson01.teach.station:
    title: Station
    gloss: station, bushalte
    note: '*ایستگاه* is een station of een halte. *ایستگاه بس* is het busstation.'
    example_gloss: Het busstation is in Kabul.
  prs.a2.unit26.lesson01.teach.plane:
    title: Vliegtuig
    gloss: vliegtuig
    note: '*طیاره* is het Afghaanse woord voor een vliegtuig.'
    example_gloss: Het vliegtuig komt naar Kabul.
  prs.a2.unit26.lesson01.teach.airport:
    title: Luchthaven
    gloss: luchthaven
    note: '*میدان هوایی* is de luchthaven. Vliegtuigen vertrekken van het *میدان هوایی* en bussen vertrekken van de *ایستگاه*.'
    example_gloss: De luchthaven is in Kabul.
  prs.a2.unit26.lesson01.teach.car:
    title: Auto
    gloss: auto
    note: '*موتر* is het Afghaanse woord voor een auto. Met *-م* zeg je mijn auto: *موترم*.'
    example_gloss: Mijn auto is nieuw.
  prs.a2.unit26.lesson01.teach.arrive:
    title: Aankomen
    gloss: aankomen, bereiken
    note: '*رسیدن* is aankomen. Waar je aankomt zeg je met *به*: *به ایستگاه رسیدم* is ik kwam aan op het station. De verleden stam is *رسید*, dus je krijgt *رسیدم، رسیدی، رسید، رسیدیم*.'
    example_gloss: Wij kwamen aan op het station.
  prs.a2.unit26.lesson01.teach.return:
    title: Teruggaan
    gloss: terugkeren, teruggaan
    note: '*برگشتن* is teruggaan of terugkeren. De verleden stam is *برگشت*: *برگشتم* is ik ging terug.'
    example_gloss: Gisteren ging ik terug naar huis.
  prs.a2.unit26.lesson01.teach.passport:
    title: Paspoort
    gloss: paspoort
    note: '*پاسپورت* is een paspoort. Met *-م* zeg je mijn: *پاسپورتم*.'
    example_gloss: Mijn paspoort is thuis.
  prs.a2.unit26.lesson01.teach.key:
    title: Sleutel
    gloss: sleutel
    note: '*کلید* is een sleutel. *کلیدم* is mijn sleutel.'
    example_gloss: Mijn sleutel is thuis.
  prs.a2.unit26.lesson01.teach.phone:
    title: Telefoon
    gloss: telefoon
    note: '*تیلفون* is de telefoon. *تیلفونم* is mijn telefoon. *تیلفون کردن* is bellen.'
    example_gloss: Mijn telefoon is nieuw.
  prs.a2.unit26.lesson01.teach.lose:
    title: Kwijtraken
    gloss: kwijtraken, verliezen
    note: '*گم کردن* is iets kwijtraken. *گم* betekent kwijt en *کردن* is het werkwoord doen: je zet het verloren voorwerp en *را* ervoor, zoals in *کلیدم را گم کردم* (ik ben mijn sleutel kwijtgeraakt).'
    example_gloss: Gisteren raakte ik mijn sleutel kwijt.
  prs.a2.unit26.lesson01.teach.when:
    title: Wanneer
    gloss: toen, wanneer
    note: '*وقتی* begint een bijzin die een tijdstip aangeeft, hier een moment in het verleden: *وقتی رسیدم* is toen ik aankwam. Deze bijzin is het referentiepunt van de hele les.'
    example_gloss: Toen ik thuiskwam, heb ik ontbeten.
  prs.a2.unit26.lesson01.teach.participle:
    title: 'Het voltooid deelwoord: verleden stam plus ه'
    gloss: gegaan, gegeten, gezien, aangekomen, gekomen, gedaan, geworden (de deelwoorden)
    note: 'Het voltooid verleden tijd wordt gevormd met een voltooid deelwoord, dus leer dat eerst. Neem de infinitief, laat de laatste *ن* weg voor de verleden stam en voeg *ه* toe: *رفتن* heeft de stam *رفت*, dus het deelwoord is *رفته*. Dezelfde regel geeft *خوردن* → *خورده*, *دیدن* → *دیده*, *رسیدن* → *رسیده*, *آمدن* → *آمده*, *کردن* → *کرده*, *شدن* → *شده*. Het deelwoord verandert nooit per persoon: het is hetzelfde voor ik, jij, hij en zij. Het is ook een deel van *رفته‌ام* (ik ben gegaan), dat je tegenkomt in de les over levenservaringen; in deze les gebruik je het alleen met de verleden tijd van *بودن*.'
  prs.a2.unit26.lesson01.teach.paradigm:
    title: 'Het voltooid verleden tijd: deelwoord plus de verleden tijd van بودن'
    gloss: ik was gegaan, jij was gegaan, hij/zij/het was gegaan, wij waren gegaan, u/jullie waren gegaan, zij waren gegaan
    note: 'Het voltooid verleden tijd zegt dat iets al gebeurd was vóór een ander moment in het verleden. Het bestaat uit het deelwoord plus de verleden tijd van *بودن* (zijn): *بودم، بودی، بود، بودیم، بودین، بودند*. Dus *رفته بودم* is ik was gegaan, *رفته بودی* jij was gegaan (tegen een vriend), *رفته بود* hij, zij of het was gegaan (kale *بود* heeft geen uitgang), *رفته بودیم* wij waren gegaan, *رفته بودین* u of jullie waren gegaan, *رفته بودند* zij waren gegaan. Het voornaamwoord is optioneel, want de uitgang laat al zien wie het is. Het deelwoord en *بود-* schrijf je als twee woorden.'
  prs.a2.unit26.lesson01.teach.sentence:
    title: Toen ik op het station aankwam, was de bus al vertrokken
    gloss: Toen ik op het station aankwam, was de bus al vertrokken.
    note: 'Dit is het patroon van de hele les. *وقتی به ایستگاه رسیدم* is het moment waarop je aankwam (onvoltooid verleden tijd). *بس رفته بود* is wat al eerder gebeurd was (voltooid verleden tijd): eerst vertrok de bus, daarna kwam jij aan.'
  prs.a2.unit26.lesson02.teach.more_participles:
    title: Eén regel voor elk werkwoord
    gloss: ik had gegeten, jij had gezien, hij/zij was aangekomen, wij waren gekomen, u/jullie hadden gedaan, zij waren teruggegaan
    note: 'De regel van *رفتن* werkt voor elk werkwoord: verleden stam plus *ه*, dan *بودم، بودی، بود، بودیم، بودین، بودند*. *خورده بودم* is ik had gegeten, *دیده بودی* jij had gezien, *رسیده بود* hij of zij was aangekomen, *آمده بودیم* wij waren gekomen, *کرده بودین* u of jullie hadden gedaan, *برگشته بودند* zij waren teruggegaan. Alleen *بود-* verandert, het deelwoord nooit.'
  prs.a2.unit26.lesson02.teach.compound_verbs:
    title: Werkwoorden van twee woorden
    gloss: ik was kwijtgeraakt; het was gesloten; het was kapotgegaan
    note: 'Veel werkwoorden bestaan uit een woord plus *کردن* of *شدن*. Het deelwoord wordt gevormd van het tweede deel en het eerste deel blijft ervoor staan: *گم کردن* geeft *گم کرده بودم* (ik was kwijtgeraakt), *بسته شدن* geeft *بسته شده بود* (het was gesloten), *خراب شدن* geeft *خراب شده بود* (het was kapotgegaan). *شدن* is handig als er iets met een ding gebeurde: de poort, de auto, het kantoor.'
  prs.a2.unit26.lesson02.teach.gate:
    title: Poort, deur
    gloss: poort, deur
    note: '*دروازه* is een poort of een grote deur, bijvoorbeeld de gate op de luchthaven of de deur van een kantoor.'
    example_gloss: De poort is open.
  prs.a2.unit26.lesson02.teach.gate_closed:
    title: De poort was gesloten
    gloss: De poort was gesloten.
    note: '*بسته شده بود* zegt dat de poort al dicht was voordat jij kwam. Het is de voltooid verleden tijd van *بسته شدن*.'
  prs.a2.unit26.lesson02.teach.break_down:
    title: Kapotgaan
    gloss: kapotgaan, defect raken
    note: '*خراب* betekent kapot of bedorven en *شدن* betekent worden, dus *خراب شدن* is kapotgaan. De onvoltooid verleden tijd is *خراب شد*: *موترم خراب شد* is mijn auto ging kapot.'
    example_gloss: Mijn auto ging kapot.
  prs.a2.unit26.lesson02.teach.ate_breakfast:
    title: Ik had ontbeten
    gloss: Ik had ontbeten.
    note: '*صبحانه خورده بودم* zegt dat het ontbijt al voorbij was vóór het moment waarover je praat.'
  prs.a2.unit26.lesson02.teach.meeting:
    title: Afspraak
    gloss: afspraak
    note: '*جلسه* is een vergadering. Het is nog een soort afspraak die je kunt missen of waarvoor je te laat kunt komen.'
    example_gloss: De vergadering begon om negen uur.
  prs.a2.unit26.lesson02.teach.manager:
    title: Manager
    gloss: manager, directeur
    note: '*مدیر* is de manager of directeur van een kantoor.'
    example_gloss: De manager is op kantoor.
  prs.a2.unit26.lesson03.teach.contrast:
    title: Voltooid verleden tijd of onvoltooid verleden tijd
    gloss: Toen ik aankwam, was de bus al vertrokken. / Toen ik aankwam, vertrok de bus.
    note: 'Als je twee gebeurtenissen uit het verleden samen vertelt, staat de eerste in de voltooid verleden tijd en de latere, het referentiepunt, in de onvoltooid verleden tijd. In *وقتی رسیدم، بس رفته بود* kwam jij als tweede aan en vertrok de bus eerst, dus je vindt niets: de bus is al weg. In *وقتی رسیدم، بس رفت* staan beide werkwoorden in de onvoltooid verleden tijd, dus de bus vertrok nadat je aankwam, of precies toen je aankwam. De twee zinsdelen kunnen ook van plaats wisselen: *بس رفته بود، وقتی رسیدم*.'
  prs.a2.unit26.lesson03.teach.bus_left_simple:
    title: Toen ik aankwam, vertrok de bus
    gloss: Toen ik aankwam, vertrok de bus.
    note: Vergelijk dit met *بس رفته بود*. Hier vertrok de bus nadat jij aankwam. Je had er nog naartoe kunnen rennen. Met *رفته بود* was hij al weg.
  prs.a2.unit26.lesson03.teach.manager_left:
    title: Toen ik aankwam, was de manager al weg
    gloss: Toen ik aankwam, was de manager al weg.
    note: 'Hetzelfde patroon als bij de bus: *وقتی رسیدم* is de aankomst, *مدیر رفته بود* is de eerdere gebeurtenis. Dit zeg je als je op een afspraak komt en de persoon al weg is.'
  prs.a2.unit26.lesson03.teach.negative:
    title: 'De ontkenning: ن op het deelwoord'
    gloss: ik was niet gegaan, jij was niet gegaan, hij/zij was niet gegaan, wij waren niet gegaan, u/jullie waren niet gegaan, zij waren niet gegaan
    note: 'Om te zeggen dat iets nog niet gebeurd was, zet je *ن* voor het deelwoord, niet op *بود*: *رفته بودم* wordt *نرفته بودم* (ik was niet gegaan). *بود-* houdt dezelfde uitgangen: *نرفته بودم، نرفته بودی، نرفته بود، نرفته بودیم، نرفته بودین، نرفته بودند*. Schrijf hiervoor niet *رفته نبودم*.'
  prs.a2.unit26.lesson03.teach.negative_more:
    title: Ontkennende deelwoorden van andere werkwoorden
    gloss: ik had niet gegeten, ik had niet gezien, ik was niet aangekomen, ik was niet gekomen
    note: 'Dezelfde *ن* komt op elk deelwoord: *نخورده* (niet gegeten), *ندیده* (niet gezien), *نرسیده* (niet aangekomen). Het werkwoord *آمدن* is de uitzondering die je moet onthouden: het deelwoord *آمده* krijgt *نیـ*, dus de ontkenning is *نیامده* (niet gekomen), zoals in *نیامده بودم*. Werkwoorden van twee woorden zetten de *ن* op het tweede deel: *گم نکرده بودم* (ik was het niet kwijtgeraakt).'
  prs.a2.unit26.lesson04.teach.already:
    title: Al, eerder
    gloss: al, eerder, vroeger
    note: '*قبلاً* betekent voor nu of eerder. Het benadrukt dat iets eerder gedaan was, en het staat voor het deelwoord of aan het begin van de zin.'
    example_gloss: Ik had al ontbeten.
  prs.a2.unit26.lesson04.teach.from_before:
    title: Al, van tevoren
    gloss: al, van tevoren
    note: '*از قبل* betekent van tevoren of al, vanaf een eerder moment. Het staat voor het deelwoord: *از قبل رفته بود* is hij was al gegaan. Het komt heel vaak voor met de voltooid verleden tijd.'
    example_gloss: De bus was al vertrokken.
  prs.a2.unit26.lesson04.teach.not_yet:
    title: Nog, nog niet
    gloss: 'nog; met een ontkenning: nog niet'
    note: '*هنوز* met een ontkennend werkwoord betekent nog niet. *هنوز نیامده بود* is hij was nog niet gekomen. De ontkennende voltooid verleden tijd en *هنوز* horen bij elkaar: wat je verwachtte, was op dat moment nog niet gebeurd.'
    example_gloss: Hij was nog niet gekomen.
  prs.a2.unit26.lesson04.teach.before_clause:
    title: 'قبل از اینکه: voordat ik aankwam'
    gloss: Voordat ik aankwam, was het vliegtuig al vertrokken. / Voordat we aankwamen, was het vliegtuig al vertrokken.
    note: '*قبل از اینکه* betekent voordat en begint een bijzin met een eigen werkwoord. Het werkwoord erna staat in de aanvoegende wijs, dezelfde vorm als na *باید*: *برسم* (dat ik aankom), *برسیم* (dat we aankomen). Het is geen verleden tijd, ook al speelt het verhaal in het verleden. De hoofdzin zegt dan wat al gebeurd was: *طیاره رفته بود*. Dus *قبل از اینکه من برسم، طیاره رفته بود* betekent hetzelfde als *وقتی رسیدم، طیاره رفته بود*: het vliegtuig vertrok eerst. De zinsdelen kunnen van plaats wisselen.'
  prs.a2.unit26.lesson04.teach.friend_not_yet:
    title: Toen ik aankwam, was mijn vriend er nog niet
    gloss: Toen ik aankwam, was mijn vriend er nog niet.
    note: Hier is de eerdere gebeurtenis iets wat nog niet gebeurd was. *هنوز نیامده بود* plaatst de ontbrekende gebeurtenis vóór het referentiepunt *وقتی رسیدم*.
  prs.a2.unit26.lesson04.teach.what_happened:
    title: Toen je op het station aankwam, wat gebeurde er?
    gloss: Toen je op het station aankwam, wat gebeurde er?
    note: '*چه شد؟* vraagt wat er gebeurde. Het antwoord is meestal de voltooid verleden tijd: *بس از قبل رفته بود* (de bus was al vertrokken).'
  prs.a2.unit26.lesson05.teach.four:
    title: Vier
    gloss: vier
    note: '*چهار* is vier. Je gebruikt het voor de tijd: *ساعت چهار* is vier uur.'
    example_gloss: Ik kwam om vier uur thuis.
  prs.a2.unit26.lesson05.teach.staff:
    title: Personeel, medewerkers
    gloss: personeel, medewerkers
    note: '*کارمندان* is het meervoud van *کارمند* (medewerker). De uitgang *-ان* vormt het meervoud voor mensen.'
    example_gloss: Het personeel is op kantoor.
  prs.a2.unit26.lesson05.teach.passport_office:
    title: Paspoortkantoor
    gloss: paspoortkantoor
    note: '*دفتر پاسپورت* is het kantoor waar mensen een paspoort krijgen of laten verlengen. Je kent beide woorden al.'
    example_gloss: Het paspoortkantoor is in Kabul.
  prs.a2.unit26.lesson05.teach.bus_turn01:
    title: Shakiba vraagt Naimat naar gisteren
    gloss: Naimat, ben je gisteren naar Mazar gegaan?
    note: Shakiba stelt een ja-neevraag over een afgeronde handeling, met de eenvoudige verleden tijd *رفتی*. Ze praat met een vriend, dus gebruikt ze *تو*.
  prs.a2.unit26.lesson05.teach.bus_turn02:
    title: Naimat vertelt wat hij aantrof
    gloss: Nee. Toen ik bij het station aankwam, was de bus al vertrokken.
    note: Naimat antwoordt met *نخیر* en noemt dan het referentiepunt in de eenvoudige verleden tijd, *وقتی به ایستگاه رسیدم*, en de eerdere gebeurtenis in de voltooid verleden tijd, *بس رفته بود*.
  prs.a2.unit26.lesson05.teach.bus_turn03:
    title: Shakiba vraagt naar de tijd
    gloss: Hoe laat is de bus vertrokken?
    note: '*ساعت چند* vraagt naar de tijd. *حرکت کرد* is de eenvoudige verleden tijd van *حرکت کردن*, vertrekken.'
  prs.a2.unit26.lesson05.teach.bus_turn04:
    title: Naimat noemt de twee tijdstippen
    gloss: Om acht uur. Ik kwam om negen uur aan.
    note: 'Twee tijdstippen, twee gebeurtenissen: de bus vertrok om *ساعت هشت* en Naimat kwam aan om *ساعت نه*. Acht is eerder dan negen, dus de bus vertrok eerst.'
  prs.a2.unit26.lesson05.teach.bus_turn05:
    title: Shakiba vraagt wat er daarna gebeurde
    gloss: Wat heb je toen gedaan?
    note: '*بعد چه کردی؟* vraagt wat je daarna deed. Het gebruikt de eenvoudige verleden tijd, omdat het een nieuwe gebeurtenis na de aankomst is.'
  prs.a2.unit26.lesson05.teach.bus_turn06:
    title: Naimat ging naar huis
    gloss: Ik ben teruggegaan naar huis.
    note: '*برگشتم* is de eenvoudige verleden tijd van *برگشتن*: hij ging terug naar huis.'
  prs.a2.unit26.lesson05.teach.message:
    title: Een bericht over te laat komen
    gloss: Hallo Shakiba. Vandaag om vier uur kwam ik bij het paspoortkantoor aan, maar het kantoor was dicht. De medewerkers waren weg. Mijn auto was kapotgegaan, dus ik kwam te laat. Morgenochtend ga ik opnieuw.
    note: 'Een kort geschreven bericht in de voltooid verleden tijd. Het vertelt wat de schrijver bij aankomst aantrof: het kantoor was gesloten en de medewerkers waren vertrokken. Het geeft ook de eerdere reden voor de vertraging: de auto was kapotgegaan.'
  prs.a2.unit26.lesson06.teach.herat:
    title: Herat
    gloss: Herat (stad in het westen van Afghanistan)
    note: '*هرات* is de stad Herat, in het westen van Afghanistan. Je kunt er vanuit Kabul naartoe vliegen.'
    example_gloss: Het vliegtuig gaat naar Herat.
  prs.a2.unit26.lesson06.teach.find:
    title: Vinden
    gloss: vinden
    note: '*پیدا کردن* is iets vinden wat je zocht. Het voorwerp staat vóór het werkwoord met *را*: *کلیدم را پیدا کردم* is: ik heb mijn sleutel gevonden. De ontkenning is *پیدا نکردم* (ik heb het niet gevonden).'
    example_gloss: Ik heb mijn sleutel gevonden.
  prs.a2.unit26.lesson06.teach.bad:
    title: Slecht
    gloss: slecht
    note: '*بد* betekent slecht. *چه بد!* is een vriendelijke reactie op slecht nieuws, het tegenovergestelde van *چه خوب!*.'
    example_gloss: Wat erg! (Wat jammer!)
  prs.a2.unit26.lesson06.teach.airport_turn01:
    title: Naimat vraagt waarom Shakiba niet ging
    gloss: Shakiba, waarom ging je vorige week niet naar Herat?
    note: Naimat vraagt *چرا* met de ontkennende eenvoudige verleden tijd *نرفتی*. Hij is een vriend, dus gebruikt hij *تو*.
  prs.a2.unit26.lesson06.teach.airport_turn02:
    title: Shakiba geeft de reden
    gloss: Omdat ik mijn paspoort kwijt was. Tot tien uur heb ik het niet gevonden.
    note: '*چون* (omdat) leidt de reden in, en de reden is de eerdere gebeurtenis, dus de voltooid verleden tijd: *گم کرده بودم*. *آن را* (het) verwijst terug naar het paspoort.'
  prs.a2.unit26.lesson06.teach.airport_turn03:
    title: Naimat vraagt wat er op het vliegveld gebeurde
    gloss: Wat gebeurde er toen je op het vliegveld aankwam?
    note: Het referentiepunt is *وقتی به میدان هوایی رسیدی*, in de eenvoudige verleden tijd. *چه شد؟* vraagt naar wat er al aan de hand was.
  prs.a2.unit26.lesson06.teach.airport_turn04:
    title: Shakiba vertelt wat ze aantrof en wat ze deed
    gloss: Het vliegtuig was al vertrokken. Daarna ben ik teruggegaan naar huis en heb ik gebeld.
    note: '*طیاره رفته بود* is de eerdere gebeurtenis, in de voltooid verleden tijd. Daarna volgen twee nieuwe gebeurtenissen in de eenvoudige verleden tijd: *برگشتم* en *تیلفون کردم*.'
  prs.a2.unit26.lesson06.teach.airport_turn05:
    title: Naimat reageert
    gloss: Wat jammer!
    note: '*چه بد!* is een korte, vriendelijke reactie op slecht nieuws.'
exercises:
