course:
  title: Dari in het Nederlands A1
  description: 'Dari (Afghanistan) voor beginners: de telefoon opnemen, jezelf voorstellen tijdens een gesprek, vragen om te herhalen of langzamer te praten, een bericht achterlaten en eenvoudige sms''jes.'
units:
  prs.a1.unit07.communication:
    title: Telefoneren
lessons:
  prs.a1.unit07.lesson01.answering_the_phone:
    title: De telefoon opnemen
  prs.a1.unit07.lesson02.identifying_yourself:
    title: Jezelf voorstellen tijdens een gesprek
  prs.a1.unit07.lesson03.asking_to_repeat_or_slow_down:
    title: Vragen om te herhalen of langzamer te praten
  prs.a1.unit07.lesson04.leaving_a_message:
    title: Een bericht achterlaten
  prs.a1.unit07.lesson05.text_messages:
    title: Een kort sms'je lezen en schrijven
  prs.a1.unit07.lesson06.phone_call_dialogue:
    title: Een volledig telefoongesprek
teaching:
  prs.a1.unit07.lesson01.teach.alo:
    title: Hallo (aan de telefoon)
    gloss: hallo (aan de telefoon)
    note: الو gebruik je specifiek om de telefoon op te nemen of een gesprek te beginnen, anders dan سلام, dat je in een persoonlijk gesprek zegt.
    example_gloss: Hallo, met Karim.
  prs.a1.unit07.lesson01.teach.goosh_astam:
    title: De beller laten doorgaan
    gloss: Ja, zegt u het maar.
    note: بلی، بفرمایین is de natuurlijke reactie nadat je hebt opgenomen. Het beleefde بفرمایین («alstublieft» / «ga uw gang») ken je al uit eerdere lessen; het is geen letterlijke vertaling van «ik luister».
  prs.a1.unit07.lesson01.teach.telephone_review:
    title: Telefoon (herhaling)
    gloss: telefoon
    note: تلفن kwam al voor in de les over getallen; hier vormt het het decor van de hele les.
    example_gloss: Mijn telefoon is kapot.
  prs.a1.unit07.lesson02.teach.who_speaking:
    title: Vragen wie er belt
    gloss: Pardon, met wie spreek ik?
    note: ببخشین، کی صحبت می‌کند؟ vraagt beleefd naar de identiteit van de beller.
  prs.a1.unit07.lesson02.teach.this_is_speaking:
    title: Jezelf voorstellen
    gloss: Met Farid.
    note: من فرید استم zegt direct wie er belt, met hetzelfde استم-patroon als in eerdere lessen.
  prs.a1.unit07.lesson02.teach.colleague_context:
    title: Uitleggen hoe je de gebelde persoon kent
    gloss: Ik ben een collega van Homayoun.
    note: همکار همایون استم geeft aan waarom je belt, handig als degene die opneemt je niet kent.
  prs.a1.unit07.lesson03.teach.speak_slowly:
    title: Vragen om langzaam te praten
    gloss: Spreekt u alstublieft langzaam.
    note: لطفاً آهسته صحبت کنین is een natuurlijk, beleefd verzoek bij een slechte verbinding of als je de taal nog leert.
  prs.a1.unit07.lesson03.teach.repeat_review:
    title: Vragen om te herhalen (herhaling)
    gloss: Kunt u het nog een keer zeggen?
    note: می‌توانین دوباره بگویین؟ kwam al voor in de les over kennismaken en past net zo goed in een telefoongesprek.
  prs.a1.unit07.lesson03.teach.combined_request:
    title: Beide verzoeken combineren
    gloss: Spreek alstublieft langzaam en zeg het nog een keer.
    note: و verbindt de twee verzoeken tot één natuurlijke zin.
  prs.a1.unit07.lesson04.teach.payam_word:
    title: Bericht
    gloss: bericht
    note: پیام is het algemene woord voor een bericht, mondeling of schriftelijk.
    example_gloss: Ik heb een bericht voor u.
  prs.a1.unit07.lesson04.teach.want_to_leave_message:
    title: Zeggen dat je een bericht wilt achterlaten
    gloss: Ik wil een bericht achterlaten.
    note: می‌خواهم یک پیام بگذارم zeg je als de persoon die je belt niet beschikbaar is.
  prs.a1.unit07.lesson04.teach.will_call_later:
    title: Zeggen dat je later terugbelt
    gloss: Ik bel later.
    note: بعد زنگ می‌زنم is een eenvoudig alternatief voor een boodschap achterlaten.
  prs.a1.unit07.lesson05.teach.short_message:
    title: Appje
    gloss: sms'je (tekstbericht)
    note: پیام کوتاه betekent letterlijk 'kort bericht'. Zo noem je in het dagelijks leven een sms'je.
  prs.a1.unit07.lesson05.teach.meeting_tomorrow:
    title: Een voorbeeldbericht
    gloss: Morgen is de vergadering om negen uur.
    note: فردا جلسه ساعت نه است is een natuurlijke, volledige mededeling om in een bericht door te geven.
  prs.a1.unit07.lesson05.teach.will_deliver:
    title: Bevestigen dat je de boodschap doorgeeft
    gloss: Ik geef het door.
    note: می‌رسانم bevestigt dat de boodschap bij de bedoelde persoon terechtkomt.
  prs.a1.unit07.lesson06.teach.turn01:
    title: Lima neemt de telefoon op
    gloss: Lima neemt op met de telefoongroet.
    note: الو؟ is de standaardmanier om een binnenkomend telefoongesprek aan te nemen.
  prs.a1.unit07.lesson06.teach.turn02:
    title: Farid groet haar en controleert wie ze is
    gloss: Farid groet haar en vraagt of ze Lima is.
    note: الو، سلام combineert de telefoongroet met de gewone groet.
  prs.a1.unit07.lesson06.teach.turn03:
    title: Lima nodigt hem uit door te gaan en vraagt wie er belt
    gloss: Lima nodigt hem uit door te gaan en vraagt wie er belt.
    note: بلی، بفرمایین en کی صحبت می‌کند؟ komen allebei uit les 1 en les 2.
  prs.a1.unit07.lesson06.teach.turn04:
    title: Farid stelt zich voor
    gloss: Farid zegt dat hij een collega van Homayoun is.
    note: Dit hergebruikt het collegapatroon uit les 2 en geeft Lima een reden om het gesprek te vertrouwen.
  prs.a1.unit07.lesson06.teach.turn05:
    title: Lima vraagt hem langzaam te praten
    gloss: Lima groet hem en vraagt hem langzaam te praten.
    note: آهسته صحبت کنین، لطفاً hergebruikt het verzoek uit les 3.
  prs.a1.unit07.lesson06.teach.turn06:
    title: Farid stemt toe en vraagt of hij een boodschap kan achterlaten
    gloss: Farid stemt toe en zegt dat hij een boodschap voor Homayoun wil achterlaten.
    note: Dit breidt het patroon met پیام uit les 4 uit met een specifieke ontvanger (برای همایون, 'voor Homayoun').
  prs.a1.unit07.lesson06.teach.turn07:
    title: Lima stemt in met opschrijven
    gloss: Lima nodigt hem uit te beginnen en zegt dat ze het opschrijft.
    note: بفرمایین nodigt Farid hier uit om verder te praten.
  prs.a1.unit07.lesson06.teach.turn08:
    title: Farid geeft de inhoud van de boodschap
    gloss: Farid vraagt haar door te geven dat de vergadering morgen om negen uur is.
    note: Dit hergebruikt direct het voorbeeldbericht uit les 5.
  prs.a1.unit07.lesson06.teach.turn09:
    title: Lima bevestigt en belooft het door te geven
    gloss: Lima bevestigt de details en zegt dat ze het doorgeeft.
    note: می‌رسانم sluit het boodschapgedeelte van het gesprek af, zoals geleerd in les 5.
  prs.a1.unit07.lesson06.teach.turn10:
    title: Farid bedankt haar en neemt afscheid
    gloss: Farid bedankt haar hartelijk en zegt gedag.
    note: تشکر زیاد en خدا حافظ hergebruiken allebei woordenschat uit eerdere units.
  prs.a1.unit07.lesson06.teach.turn11:
    title: Lima neemt afscheid
    gloss: Lima zegt gedag.
    note: خدا حافظ sluit het gesprek af.
  prs.a1.unit07.lesson06.teach.past_tense_left:
    title: Zeggen dat iemand een boodschap heeft achtergelaten (verleden tijd)
    gloss: Farid heeft een boodschap achtergelaten.
    note: گذاشت is de eenvoudige verleden tijd ('liet achter') van het werkwoord uit می‌خواهم یک پیام بگذارم in les 4, waar بگذارم 'ik laat achter' betekent. Gebruik het om samen te vatten wat er na een telefoontje is gebeurd.
    target_text: فرید پیام گذاشت (Farid heeft een bericht achtergelaten)
