course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor lager-gevorderden: praten over online gewoonten — woordenschat over sociale media en schermtijd, een eenvoudige mening geven, lezen over schermtijd en een echt gesprek tussen twee vrienden over hun eigen gewoonten.'
units:
  prs.a2.unit16.online_habits:
    title: Online gewoonten
lessons:
  prs.a2.unit16.lesson01.online_habits_vocabulary:
    title: Woorden voor online gewoonten
  prs.a2.unit16.lesson02.describing_and_giving_an_opinion:
    title: Beschrijven en een mening geven
  prs.a2.unit16.lesson03.reading_about_screen_time:
    title: Lezen over schermtijd
  prs.a2.unit16.lesson04.friends_dialogue:
    title: Een gesprek tussen vrienden
teaching:
  prs.a2.unit16.lesson01.teach.social_media_word:
    title: Sociale media
    gloss: sociale media
    note: '*شبکهٔ اجتماعی* betekent letterlijk ''sociaal netwerk''.'
    example_gloss: Zarmina kijkt elke dag op sociale media.
  prs.a2.unit16.lesson01.teach.video_word:
    title: Video
    gloss: video
    note: '*ویدیو* is een directe leenwoord, net zoals in het Nederlands: ''video''.'
    example_gloss: Homayoun kijkt graag video's.
  prs.a2.unit16.lesson01.teach.download_word:
    title: Downloaden
    gloss: downloaden
    note: '*دانلود کردن* -- *دانلود* is een leenwoord, gecombineerd met *کردن* (''doen'').'
    example_gloss: Ik download muziek.
  prs.a2.unit16.lesson01.teach.messaging_app_word:
    title: Berichtenapp
    gloss: berichtenapp
    note: '*پیام‌رسان* betekent letterlijk ''berichtendrager''.'
    example_gloss: Ik stuur mijn vrienden berichten met een berichtenapp.
  prs.a2.unit16.lesson01.teach.computer_game_word:
    title: Computerspel
    gloss: computerspel
    note: '*بازی کمپیوتری* -- *بازی* betekent ''spel'' en *کمپیوتری* betekent ''computer-''.'
    example_gloss: Homayoun speelt computerspellen.
  prs.a2.unit16.lesson01.teach.free_time_word:
    title: Vrije tijd
    gloss: vrije tijd
    note: '*وقت آزاد* -- *وقت* betekent ''tijd'' en *آزاد* betekent ''vrij''.'
    example_gloss: In mijn vrije tijd kijk ik op sociale media.
  prs.a2.unit16.lesson01.teach.usually_grammar:
    title: Meestal, met معمولاً
    gloss: Ik kijk meestal in mijn vrije tijd op sociale media.
    note: '*معمولاً* (''meestal'') is het eerste frequentiebijwoord op A2-niveau in dit hoofdstuk.'
  prs.a2.unit16.lesson01.teach.sometimes_grammar:
    title: Soms, met بعضی اوقات
    gloss: Soms kost het te veel tijd.
    note: '*بعضی اوقات* (''soms'') is het tweede frequentiebijwoord in dit hoofdstuk, als tegenhanger van *معمولاً*.'
  prs.a2.unit16.lesson01.teach.va_word:
    title: En
    gloss: en
    note: '*و* is het gewone voegwoord waarmee in dit hoofdstuk zinsdelen worden verbonden.'
    target_text: و (en)
  prs.a2.unit16.lesson01.teach.every_day_grammar:
    title: Elke dag, met هر روز
    gloss: Ik kijk elke dag op sociale media.
    note: '*هر روز* betekent ''elke dag'' -- *روز* alleen betekent ''dag''.'
  prs.a2.unit16.lesson02.teach.ask_how_much_time:
    title: Vragen hoeveel tijd iemand besteedt
    gloss: Hoeveel tijd besteed jij aan sociale media?
    note: '*تو* is het informele ''jij'' tussen vrienden, anders dan de formele *شما*/-*ین*-vormen die elders in deze cursus voor onbekenden worden gebruikt.'
  prs.a2.unit16.lesson02.teach.opinion_phrase:
    title: Een eenvoudige mening geven
    gloss: Volgens mij is internet nuttig, maar soms kost het te veel tijd.
    note: Hier komt het al bekende patroon *به نظر من* ('volgens mij') uit Hoofdstuk 10 terug.
  prs.a2.unit16.lesson02.teach.limit_use_phrase:
    title: Zeggen dat je het gebruik moet beperken
    gloss: We moeten onze tijd beperken.
    note: '*محدود کردن* betekent ''beperken''.'
  prs.a2.unit16.lesson02.teach.mostly_word:
    title: Mostly
    gloss: meestal
    note: '*بیشتر* betekent hier ''meestal'' of ''meer''.'
    target_text: بیشتر (meestal)
  prs.a2.unit16.lesson03.teach.user_word:
    title: Gebruiker
    gloss: gebruiker
    note: '*کاربر* is het algemene woord voor iemand die een app, apparaat of dienst gebruikt.'
    example_gloss: Veel gebruikers gebruiken elke dag hun telefoon.
  prs.a2.unit16.lesson03.teach.limit_word:
    title: Beperken
    gloss: beperken
    note: '*محدود کردن* -- dezelfde uitdrukking als in les 2, hier in een algemene uitspraak over mensen in plaats van over ''wij''.'
    example_gloss: Sommige mensen beperken hun tijd.
  prs.a2.unit16.lesson03.teach.article_text:
    title: Een kort artikel over schermtijd
    gloss: Veel mensen gebruiken sociale media enkele uren per dag. Sommige mensen beperken hun tijd, zodat ze meer tijd hebben voor familie en vrienden.
    note: Een korte informatieve tekst, in het leesregister dat dit hoofdstuk oefent.
  prs.a2.unit16.lesson04.teach.turn01:
    title: همایون vraagt زرمینه naar haar tijd online
    gloss: همایون vraagt زرمینه hoeveel tijd ze op sociale media besteedt.
    note: Dezelfde vraag als in les 2, met het informele *تو*-register dat al bij dit vriendenpaar is geïntroduceerd.
  prs.a2.unit16.lesson04.teach.turn02:
    title: زرمینه antwoordt en vraagt terug
    gloss: Meestal een uur per dag. Ze vraagt hem hetzelfde.
    note: '*چطور* betekent hier ''en jij?'''
  prs.a2.unit16.lesson04.teach.turn03:
    title: همایون beschrijft zijn eigen gewoonte
    gloss: Hij kijkt meestal video. Misschien twee uur per dag.
    note: '*بیشتر* betekent hier ''meestal''.'
  prs.a2.unit16.lesson04.teach.turn04:
    title: زرمینه geeft haar mening
    gloss: Volgens haar is dat te veel.
    note: Hier komt het patroon *به نظر من* uit les 2 terug.
  prs.a2.unit16.lesson04.teach.turn05:
    title: همایون is het half eens, maar zegt dat hij ervan geniet
    gloss: Misschien, maar hij geniet ervan.
    note: '*لذت می‌برم* betekent ''ik geniet (ervan)''.'
  prs.a2.unit16.lesson04.teach.turn06:
    title: زرمینه stelt voor het gebruik te beperken
    gloss: Ze zegt dat we soms onze tijd moeten beperken.
    note: Hier komt *محدود کنیم* uit les 2 precies zo terug.
  prs.a2.unit16.lesson04.teach.turn07:
    title: همایون stemt ermee in minder te gebruiken
    gloss: Dat klopt. Vanaf morgen gebruikt hij het minder.
    note: '*کمتر* betekent ''minder''.'
  prs.a2.unit16.lesson04.teach.turn08:
    title: زرمینه is enthousiast
    gloss: زرمینه zegt dat het geweldig is.
    note: '*عالی است!* is een gebruikelijke manier om ''geweldig!'' te zeggen.'
