course:
  title: Dari A2
  description: 'Dari uit Afghanistan voor net gevorderden: vertellen hoe het leven vroeger was, in je kindertijd, in een vorig huis of op een vorige baan, en hoe het nu is. De gewoonteverleden tijd (می‌ plus de verleden stam), de ontkenning ervan en het contrast met de eenvoudige verleden tijd en de tegenwoordige tijd.'
units:
  prs.a2.unit23.how_it_used_to_be:
    title: Hoe het leven vroeger was
lessons:
  prs.a2.unit23.lesson01.then_and_now_words:
    title: Woorden voor toen en nu en de gewoonthevorm
  prs.a2.unit23.lesson02.more_verbs:
    title: De gewoonteverleden tijd met meer werkwoorden
  prs.a2.unit23.lesson03.past_or_habit_or_now:
    title: Eenvoudige verleden tijd, gewoonteverleden tijd, tegenwoordige tijd en de ontkenning
  prs.a2.unit23.lesson04.my_old_life:
    title: 'Mijn oude leven: wijk, school en werk'
  prs.a2.unit23.lesson05.reading_and_listening:
    title: Lezen en luisteren over een kindertijd
  prs.a2.unit23.lesson06.conversation_then_and_now:
    title: Een gesprek over toen en nu
teaching:
  prs.a2.unit23.lesson01.teach.before:
    title: Vroeger, in het verleden
    gloss: vroeger, in het verleden, voorheen
    note: '*قبلاً* kijkt terug naar een eerdere periode in je leven. Het is het woord waarmee de meeste zinnen over ''hoe het vroeger was'' beginnen: *قبلاً در هرات زندگی می‌کردم.* Het woord maakt het werkwoord zelf nog niet gewoontegebonden; dat doet het werkwoord, zoals je hieronder ziet.'
    example_gloss: Vroeger woonde ik in Herat.
  prs.a2.unit23.lesson01.teach.now:
    title: Nu
    gloss: nu, op dit moment
    note: '*حالا* is nu, de andere helft van elk toen-en-nu-contrast. Het werkwoord na *حالا* staat in de gewone tegenwoordige tijd: *حالا در کابل زندگی می‌کنم.*'
    example_gloss: Nu woon ik in Kabul.
  prs.a2.unit23.lesson01.teach.every_day:
    title: Elke dag
    gloss: elke dag
    note: '*هر* betekent elke en *روز* is dag. *هر روز* is de duidelijkste tijdsaanduiding voor een herhaalde gewoonte, in het verleden en in het heden.'
    example_gloss: Elke dag ging ik naar school.
  prs.a2.unit23.lesson01.teach.always:
    title: Altijd
    gloss: altijd
    note: '*همیشه* betekent altijd. Net als *هر روز* past het vanzelf bij een gewoonte en laat het de luisteraar weten dat iets steeds opnieuw gebeurde.'
    example_gloss: Ik speelde altijd met mijn vrienden.
  prs.a2.unit23.lesson01.teach.when_small:
    title: Toen ik klein was
    gloss: toen ik klein was, toen ik een kind was
    note: '*وقتی* betekent toen of wanneer, *کوچک* betekent klein en *بودم* is ik was. Samen is *وقتی کوچک بودم* de standaardmanier om een verhaal over je kindertijd te beginnen.'
  prs.a2.unit23.lesson01.teach.school:
    title: School
    gloss: school
    note: '*مکتب* is het alledaagse Afghaanse woord voor school. Een leerling is *شاگرد*, maar hier heb je alleen *مکتب* nodig.'
    example_gloss: Ik ga elke dag naar school.
  prs.a2.unit23.lesson01.teach.on_foot:
    title: Te voet
    gloss: te voet, lopend
    note: '*پیاده* betekent te voet. Het staat vóór het werkwoord: *پیاده به مکتب می‌رفتم* is ik liep altijd naar school.'
    example_gloss: Ik loop naar school (ik ga te voet naar school).
  prs.a2.unit23.lesson01.teach.cities:
    title: Herat, Kabul
    gloss: Herat, Kabul
    note: '*هرات* en *کابل* zijn twee Afghaanse steden. Bij steden gebruik je *در* (in): *در هرات* is in Herat, *در کابل* is in Kabul.'
    example_gloss:
    - Hij of zij is in Herat.
    - Wij zijn in Kabul.
  prs.a2.unit23.lesson01.teach.to_live:
    title: Wonen
    gloss: wonen, ergens leven
    note: '*زندگی کردن* is wonen, in de zin van ergens verblijven. *زندگی* is leven en *کردن* is het werkwoord dat de uitgangen krijgt: *زندگی می‌کنم* is ik woon.'
    example_gloss: Wij wonen in Kabul.
  prs.a2.unit23.lesson01.teach.go_paradigm:
    title: 'De gewoonteverleden tijd: می + verleden stam + uitgangen'
    gloss: ik ging vroeger, jij ging vroeger, hij of zij ging vroeger, wij gingen vroeger, jullie of u gingen vroeger, zij gingen vroeger
    note: 'Om te zeggen wat vroeger steeds opnieuw gebeurde, zet je *می‌* voor de verleden stam en voeg je dezelfde uitgangen toe als in de gewone verleden tijd. De verleden stam van *رفتن* (gaan) is *رفت* (laat de laatste *ن* weg). Dus: *می‌رفتم* (ik ging vroeger), *می‌رفتی* (jij, tegen een vriend), *می‌رفت* (hij of zij), *می‌رفتیم* (wij), *می‌رفتین* (jullie of u) en *می‌رفتند* (zij). Vergelijk de gewone verleden tijd *رفتم*, een eenmalige, afgeronde gebeurtenis, en de tegenwoordige tijd *می‌روم*, die de tegenwoordige stam *رو* gebruikt. De gewoonteverleden tijd kun je in het Nederlands ook weergeven met ''ik ging altijd'', ''ik placht te gaan'' of ''ik ging''. Het persoonlijk voornaamwoord (*من، تو، او*) is optioneel, omdat de uitgang al laat zien wie het is. Verwar *می‌رفتم* niet met *می‌روم*: er verandert maar één letter vóór de uitgang, maar de eerste is verleden tijd en de tweede is nu.'
  prs.a2.unit23.lesson01.teach.do_forms:
    title: 'Dezelfde regel, een nieuw werkwoord: doen'
    gloss: ik deed vroeger, jij deed vroeger, hij of zij deed vroeger, wij deden vroeger, jullie of u deden vroeger, zij deden vroeger
    note: '*کردن* (doen, maken) heeft de verleden stam *کرد*. De gewoonteverleden tijd is *می‌کردم، می‌کردی، می‌کرد، می‌کردیم، می‌کردین، می‌کردند*. Dit werkwoord is erg nuttig, want veel Dari-werkwoorden bestaan uit een zelfstandig naamwoord plus *کردن*: *زندگی کردن* (wonen, leven), *بازی کردن* (spelen), *کار کردن* (werken). *می‌* en de uitgang komen altijd bij *کردن*, nooit bij het zelfstandig naamwoord: *زندگی می‌کردم*, ik woonde vroeger.'
  prs.a2.unit23.lesson01.teach.zwnj:
    title: 'Spelling: na می‌ en نمی‌ volgt een halve spatie'
    gloss: ik ging vroeger en ik ging vroeger niet
    note: 'In schrift zijn *می‌* en *نمی‌* losse voorvoegsels, dus er volgt een zero-width non-joiner (ZWNJ, de ''halve spatie'') op: *می‌رفتم*, *نمی‌رفتم*. Ze worden niet aan het werkwoord vastgeschreven en ook niet met een hele spatie losgemaakt. Als je op een Perzisch toetsenbord typt, gebruik dan na *می* en *نمی* de toets voor de halve spatie (vaak Shift plus spatie). Dezelfde halve spatie gebruik je bij het meervoud *ها* en in *آن‌ها*.'
  prs.a2.unit23.lesson02.teach.eat_paradigm:
    title: 'Dezelfde regel, een nieuw werkwoord: eten'
    gloss: ik at vroeger, jij at vroeger, hij of zij at vroeger, wij aten vroeger, jullie of u aten vroeger, zij aten vroeger
    note: 'De regel van *رفتن* werkt voor regelmatige werkwoorden. *خوردن* (eten) verliest zijn *ن* en geeft de verleden stam *خورد*. Zet *می‌* ervoor en voeg de uitgangen toe: *می‌خوردم، می‌خوردی، می‌خورد، می‌خوردیم، می‌خوردین، می‌خوردند*. De vorm voor hij of zij is de kale stam met *می‌*, dus *می‌خورد* betekent: hij of zij at vroeger.'
  prs.a2.unit23.lesson02.teach.tea:
    title: Thee
    gloss: thee
    note: '*چای* is thee, de drank die Afghanen bij bijna elke maaltijd drinken. Je zegt *چای می‌خوری* (je drinkt thee) met het werkwoord *خوردن*.'
    example_gloss: Elke ochtend dronk ik thee.
  prs.a2.unit23.lesson02.teach.morning:
    title: Ochtend
    gloss: ochtend, 's ochtends
    note: '*صبح* is ochtend. *هر روز صبح* is elke ochtend en *هر شب* is elke avond of nacht.'
    example_gloss: Elke ochtend ging ik naar school.
  prs.a2.unit23.lesson02.teach.night:
    title: Nacht
    gloss: nacht, avond
    note: '*شب* is nacht of avond. *هر شب* is elke avond of nacht. Dit is een herhalingswoord uit de units over de dagelijkse routine.'
    example_gloss: Elke avond las ik een boek.
  prs.a2.unit23.lesson02.teach.book:
    title: Boek
    gloss: boek
    note: '*کتاب* is een boek. Met *خواندن* (lezen) zeg je *کتاب خواندن*, een boek lezen. Met hetzelfde werkwoord zeg je ook *درس خواندن*, studeren.'
    example_gloss: Ik las vroeger een boek.
  prs.a2.unit23.lesson02.teach.football:
    title: Voetballen
    gloss: voetballen
    note: '*بازی کردن* is spelen en *فوتبال* is voetbal. Net als bij andere werkwoorden van het type ''zelfstandig naamwoord plus *کردن*'' komen *می‌* en de uitgang bij *کردن*: *فوتبال بازی می‌کردم*.'
    example_gloss: Ik voetbalde vroeger met mijn vrienden.
  prs.a2.unit23.lesson02.teach.after_school:
    title: Na school
    gloss: na school
    note: '*بعد از* betekent na, en erna volgt een zelfstandig naamwoord: *بعد از مکتب* is na school.'
    example_gloss: Na school kwam ik naar huis.
  prs.a2.unit23.lesson02.teach.friends:
    title: Mijn vrienden
    gloss: mijn vrienden
    note: '*دوستان* is vrienden en *-م* voegt ''mijn'' toe: *دوستانم* is mijn vrienden, een herhalingswoord. ''Met'' is *با*: *با دوستانم*.'
    example_gloss: Mijn vrienden kwamen vaak bij ons thuis.
  prs.a2.unit23.lesson02.teach.more_verbs:
    title: Vier werkwoorden meer, één regel
    gloss: zien, doen, komen, lezen in de gewoonteverleden tijd
    note: 'Elk regelmatig werkwoord krijgt dezelfde vorm: laat de *ن* van de infinitief weg en zet *می‌* voor de verleden stam met de uitgangen. *دیدن* (zien) geeft *می‌دیدم*. *کردن* (doen of maken) geeft *می‌کردم*. *آمدن* (komen) geeft *می‌آمدم*; de verleden stam *آمد* houdt zijn lange *آ* na *می‌*, dus je schrijft *می‌آمدم*, nooit *می‌امدم*. *خواندن* (lezen of studeren) geeft *می‌خواندم*. Zowel gesproken als geschreven Dari gebruikt deze vorm.'
  prs.a2.unit23.lesson02.teach.be_have:
    title: Zijn en hebben in de verleden tijd
    gloss: ik was, jij was, hij of zij was, wij waren, jullie of u waren, zij waren; ik had, jij had, ...
    note: 'De verleden tijd van *بودن* (zijn) is *بودم، بودی، بود، بودیم، بودین، بودند*, en die van *داشتن* (hebben) is *داشتم، داشتی، داشت، داشتیم، داشتین، داشتند*. Deze twee werkwoorden beschrijven toestanden, dus ze zijn al de vormen voor ''was vroeger'' en ''had vroeger'' en je voegt normaal geen *می‌* toe: *وقتی کوچک بودم، یک بایسکل داشتم* betekent: toen ik klein was, had ik een fiets.'
  prs.a2.unit23.lesson02.teach.bicycle:
    title: Fiets
    gloss: fiets
    note: '*بایسکل* is het Afghaanse woord voor fiets. *یک* is een of één.'
    example_gloss: Toen ik klein was, had ik een fiets.
  prs.a2.unit23.lesson03.teach.contrast:
    title: Eén gebeurtenis, een gewoonte of nu
    gloss: Op een dag ging ik naar de bazaar. Elke dag ging ik vroeger naar school. Nu ga ik naar kantoor.
    note: 'Drie werkwoordsvormen kunnen op elkaar lijken, dus kijk goed wat de zin zegt. Gaat het om ÉÉN afgeronde gebeurtenis, gebruik dan de gewone verleden tijd: *یک روز به بازار رفتم* (op een dag ging ik naar de bazaar). Gaat het om iets wat in het verleden steeds opnieuw gebeurde, gebruik dan *می‌* plus de verleden stam: *هر روز به مکتب می‌رفتم* (elke dag ging ik vroeger naar school). Is het nu waar, gebruik dan *می‌* plus de tegenwoordige stam: *حالا به دفتر می‌روم* (nu ga ik naar kantoor). Tijdwoorden helpen: *یک روز، دیروز* horen bij de gewone verleden tijd; *هر روز، همیشه، قبلاً* horen bij de gewoonteverleden tijd; *حالا* hoort bij de tegenwoordige tijd.'
  prs.a2.unit23.lesson03.teach.one_day:
    title: Op een dag
    gloss: op een dag, eens
    note: '*یک روز* is op een dag. Het leidt ÉÉN gebeurtenis in het verleden in, dus het werkwoord staat in de gewone verleden tijd, zonder *می‌*.'
    example_gloss: Op een dag ging ik naar de bazaar.
  prs.a2.unit23.lesson03.teach.yesterday:
    title: Gisteren
    gloss: gisteren
    note: '*دیروز* is gisteren. Het wijst op één afgeronde dag, dus het werkwoord staat in de gewone verleden tijd: *دیروز به دفتر رفتم*.'
    example_gloss: Gisteren ging ik naar kantoor.
  prs.a2.unit23.lesson03.teach.office:
    title: Kantoor
    gloss: kantoor
    note: '*دفتر* is een kantoor, een werkplek. Je gaat ernaartoe met *به*.'
    example_gloss: Nu ga ik elke dag naar kantoor.
  prs.a2.unit23.lesson03.teach.bus:
    title: Bus
    gloss: bus
    note: '*بس* is het Afghaanse woord voor bus. ''Met'' is *با*: *با بس* is met de bus.'
    example_gloss: Ik ga met de bus naar kantoor.
  prs.a2.unit23.lesson03.teach.neg_paradigm:
    title: 'De ontkennende gewoonteverleden tijd: نمی + verleden stam'
    gloss: ik ging vroeger niet, jij ging vroeger niet, hij of zij ging vroeger niet, wij gingen vroeger niet, jullie of u gingen vroeger niet, zij gingen vroeger niet
    note: 'Om te zeggen dat iets vroeger NIET gebeurde, zet je *نمی‌* in plaats van *می‌*: *نمی‌رفتم* (ik ging vroeger niet, ik ging nooit), *نمی‌رفتی، نمی‌رفت، نمی‌رفتیم، نمی‌رفتین، نمی‌رفتند*. Verwar dit niet met de gewone ontkennende verleden tijd *نرفتم*, die zegt dat één afgeronde gebeurtenis niet plaatsvond. Vergelijk: *دیروز به مکتب نرفتم* (gisteren ging ik niet naar school) en *جمعه به مکتب نمی‌رفتم* (op vrijdag ging ik niet naar school, als gewoonte). Schrijf het met de halve spatie: *نمی‌*.'
  prs.a2.unit23.lesson03.teach.no_longer:
    title: 'Niet meer: دیگر + ontkenning'
    gloss: Ik voetbal niet meer.
    note: '*دیگر* met een ontkennend werkwoord betekent ''niet meer'': *دیگر فوتبال بازی نمی‌کنم* is: ik voetbal niet meer. Het werkwoord is de ontkennende tegenwoordige tijd *نمی‌کنم*, omdat de zin over nu gaat. Voor iets wat je eerder deed en waar je mee gestopt bent, zet je vaak beide helften naast elkaar: *قبلاً هر روز فوتبال بازی می‌کردم، ولی دیگر بازی نمی‌کنم* (vroeger voetbalde ik elke dag, maar nu niet meer).'
  prs.a2.unit23.lesson04.teach.neighbourhood:
    title: Wijk
    gloss: wijk, buurt
    note: '*محله* is de wijk, het deel van de stad waar je woont. *قدیمی* betekent oud.'
    example_gloss: Ons huis stond in een oude wijk.
  prs.a2.unit23.lesson04.teach.old:
    title: Oud
    gloss: oud (van een plaats of ding)
    note: '*قدیمی* is oud, voor dingen en plaatsen die er al lang zijn. Het staat na het zelfstandig naamwoord: *محلهٔ قدیمی*.'
    example_gloss: Wij hadden een oud huis.
  prs.a2.unit23.lesson04.teach.neighbours:
    title: Buren
    gloss: buren
    note: '*همسایه* is een buur. Het meervoud krijgt de halve spatie: *همسایه‌ها*. Buren zijn een belangrijk deel van het leven in een Afghaanse wijk.'
    example_gloss: De buren kwamen altijd bij ons thuis.
  prs.a2.unit23.lesson04.teach.grandmother:
    title: Grootmoeder
    gloss: oma
    note: '*مادرکلان* is oma, het standaardwoord. *-م* voegt ''mijn'' toe: *مادرکلانم* is mijn oma.'
    example_gloss: Op vrijdag gingen wij mijn oma bezoeken.
  prs.a2.unit23.lesson04.teach.fridays:
    title: Op vrijdagen
    gloss: op vrijdagen, elke vrijdag
    note: '*جمعه‌ها* (vrijdagen, met de halve spatie) betekent elke vrijdag. Het is een andere manier om te zeggen dat iets steeds opnieuw gebeurde.'
    example_gloss: Op vrijdag gingen wij naar het park.
  prs.a2.unit23.lesson04.teach.shop:
    title: Winkel
    gloss: winkel
    note: '*دوکان* is het Afghaanse woord voor winkel. *در دوکان کار کردن* is in een winkel werken.'
    example_gloss: Vroeger werkte ik in een winkel.
  prs.a2.unit23.lesson04.teach.where_before:
    title: Waar woonde jij vroeger?
    gloss: Waar woonde jij vroeger?
    note: '*کجا* betekent waar. Een vriend vraagt *قبلاً کجا زندگی می‌کردی؟* met de gewoonteverleden tijd in de jij-vorm. Voor iemand die je niet goed kent, zeg je *می‌کردین*.'
  prs.a2.unit23.lesson05.teach.street:
    title: Straat
    gloss: straat, weg
    note: '*سرک* is het Afghaanse woord voor straat of weg. Je speelt of loopt *در سرک*, op straat.'
    example_gloss: Wij speelden vroeger op straat.
  prs.a2.unit23.lesson05.teach.yes:
    title: Ja
    gloss: ja
    note: '*بلی* is ja in het Dari, en het tegenovergestelde is *نخیر* (nee). Gebruik *بلی* om een ja-neevraag te beantwoorden.'
    example_gloss: Ja, ik ging er elke dag naartoe.
  prs.a2.unit23.lesson05.teach.but:
    title: Maar
    gloss: maar
    note: '*ولی* zet twee dingen tegenover elkaar. In een verhaal over toen en nu verbindt het vaak wat vroeger gebeurde met wat nu anders is.'
    example_gloss: Vroeger ging ik, maar nu niet meer.
  prs.a2.unit23.lesson05.teach.read_text:
    title: Een jeugd in Herat
    gloss: Toen ik klein was, woonden wij in Herat. Ons huis stond in een oude wijk. Elke ochtend liep ik naar school. Na school voetbalde ik met mijn vrienden op straat. Op vrijdag gingen wij mijn oma bezoeken. Nu woon ik in Kabul en ga ik met de bus naar kantoor. Ik voetbal niet meer.
    note: 'Een kort geschreven verhaal over een jeugd in Herat. Let op de wisseling: de gewoonteverleden tijd (*می‌رفتم، بازی می‌کردم، می‌رفتیم*) beschrijft het oude leven en de tegenwoordige tijd (*زندگی می‌کنم، می‌روم*) beschrijft nu. De laatste zin, *دیگر فوتبال بازی نمی‌کنم*, zegt wat is gestopt.'
  prs.a2.unit23.lesson05.teach.audio_q:
    title: Salima vraagt Javid naar school
    gloss: Javid, ging jij vroeger elke dag naar school?
    note: Salima vraagt naar een gewoonte uit het verleden met de gewoonteverleden tijd in de jij-vorm, *می‌رفتی*. Het is een ja-neevraag.
  prs.a2.unit23.lesson05.teach.audio_a:
    title: Javid antwoordt
    gloss: Ja, ik liep er elke dag naartoe, maar op vrijdag ging ik niet.
    note: 'Javid zegt eerst wat hij deed, dan wat hij niet deed: *جمعه نمی‌رفتم*. De ontkennende gewoonteverleden tijd *نمی‌رفتم* laat zien dat hij op vrijdag nooit ging.'
  prs.a2.unit23.lesson06.teach.turn01:
    title: Salima vraagt Javid waar hij vroeger woonde
    gloss: Javid, waar woonde jij vroeger?
    note: Salima vraagt naar het verleden met *می‌کردی*, de gewoonteverleden tijd in de jij-vorm.
  prs.a2.unit23.lesson06.teach.turn02:
    title: Javid beschrijft zijn jeugd
    gloss: Toen ik klein was, woonden wij in Herat. Elke dag liep ik naar school en na school voetbalde ik met mijn vrienden.
    note: 'Javid gebruikt de gewoonteverleden tijd voor alles wat steeds opnieuw gebeurde: *زندگی می‌کردیم، می‌رفتم، بازی می‌کردم*.'
  prs.a2.unit23.lesson06.teach.turn03:
    title: Salima vraagt naar nu
    gloss: Voetbal je nu ook nog?
