course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor lager-gevorderden: een klacht in de winkel indienen — een defecte elektrische kachel, uitleggen wat er mis is, het retourbeleid van een winkel lezen en het gesprek aan de retourbalie zelf.'
units:
  prs.a2.unit18.shopping_complaint:
    title: Klacht in de winkel
lessons:
  prs.a2.unit18.lesson01.complaint_vocabulary:
    title: Woorden voor een klacht in de winkel
  prs.a2.unit18.lesson02.explaining_the_problem:
    title: Het probleem uitleggen
  prs.a2.unit18.lesson03.reading_a_return_policy:
    title: Een retourbeleid lezen
  prs.a2.unit18.lesson04.return_counter_dialogue:
    title: Aan de retourbalie
teaching:
  prs.a2.unit18.lesson01.teach.broken_word:
    title: Kapot
    gloss: kapot
    note: '*خراب* beschrijft elk defect voorwerp of voorwerp dat niet werkt.'
    example_gloss: Deze kachel is kapot.
  prs.a2.unit18.lesson01.teach.exchange_word:
    title: Wisselen
    gloss: wisselen
    note: '*تعویض کردن* -- *تعویض* betekent ''omruil'' en wordt gecombineerd met *کردن* (''doen'').'
    example_gloss: Ik wil de kachel omruilen.
  prs.a2.unit18.lesson01.teach.refund_word:
    title: Terugbetaling
    gloss: terugbetaling
    note: '*بازپرداخت* is het formele woord voor een terugbetaling.'
    example_gloss: Ik wil mijn geld terug.
  prs.a2.unit18.lesson01.teach.receipt_word:
    title: Bonnetje
    gloss: bonnetje
    note: '*رسید* is hetzelfde woord dat in eerdere units al voor een huurbewijs werd gebruikt, hier in de betekenis van aankoopbon.'
    example_gloss: Ik heb de aankoopbon bij me.
  prs.a2.unit18.lesson01.teach.warranty_word:
    title: Garantie
    gloss: garantie
    note: '*گارانتی* is een rechtstreeks leenwoord (van ''garantie'') en wordt op dezelfde manier gebruikt als in het Nederlands.'
    example_gloss: Deze kachel heeft een jaar garantie.
  prs.a2.unit18.lesson01.teach.defect_word:
    title: Gebrek
    gloss: gebrek
    note: '*عیب* betekent een fout of gebrek in een voorwerp.'
    example_gloss: Deze kachel heeft een gebrek.
  prs.a2.unit18.lesson01.teach.when_grammar:
    title: Wanneer, met وقتی
    gloss: Als ik hem aanzet, wordt hij niet warm.
    note: '*وقتی* leidt een tijdsbijzin in -- een natuurlijke tegenhanger van *اگر* (als, indien) uit Unit 11, maar het stelt een feit vast in plaats van een mogelijkheid.'
  prs.a2.unit18.lesson01.teach.heater_word:
    title: Elektrische kachel
    gloss: elektrische kachel
    note: '*بخاری برقی* -- *بخاری* betekent ''kachel'' en *برقی* betekent ''elektrisch''.'
    example_gloss: Ik heb een elektrische kachel gekocht voor mijn nieuwe huis.
  prs.a2.unit18.lesson01.teach.va_word:
    title: En
    gloss: en
    note: '*و* is het gewone verbindingswoord om zinsdelen te verbinden in deze unit.'
    target_text: و (en)
  prs.a2.unit18.lesson02.teach.state_item_broken:
    title: Zeggen dat een gekocht voorwerp kapot is
    gloss: Deze kachel die ik gisteren heb gekocht, is kapot.
    note: '*که دیروز خریدم* -- ''die ik gisteren heb gekocht'' -- een betrekkelijke bijzin die aangeeft om welk voorwerp het gaat.'
  prs.a2.unit18.lesson02.teach.request_exchange_or_refund:
    title: Vragen om omruiling of terugbetaling
    gloss: Ik wil hem omruilen of mijn geld terugkrijgen.
    note: '*یا* betekent ''of'' en biedt de winkelier een keuze.'
  prs.a2.unit18.lesson02.teach.prefer_question:
    title: Vragen waaraan de klant de voorkeur geeft
    gloss: Waaraan geeft u de voorkeur?
    note: '*ترجیح دادن* betekent ''de voorkeur geven aan'' -- de A2-grammaticastap van deze unit om te kiezen uit twee aangeboden opties.'
  prs.a2.unit18.lesson03.teach.deadline_word:
    title: Termijn
    gloss: termijn
    note: '*مهلت* is een tijdslimiet of termijn waarbinnen iets moet gebeuren.'
    example_gloss: De termijn voor omruilen is zeven dagen.
  prs.a2.unit18.lesson03.teach.original_word:
    title: Origineel
    gloss: origineel
    note: '*اصلی* betekent ''origineel'', zoals bij het originele bonnetje en niet een kopie.'
    example_gloss: Neem alsjeblieft het originele bonnetje mee.
  prs.a2.unit18.lesson03.teach.policy_text:
    title: Een mededeling in de winkel over retourneren
    gloss: Als een gekocht artikel defect is, kun je het binnen zeven dagen met het originele bonnetje omruilen of je geld terugkrijgen.
    note: Een korte officiële mededeling van een winkel, in het formele schriftelijke register dat in deze unit aan bod komt.
  prs.a2.unit18.lesson04.teach.turn01:
    title: De winkelier begroet کریم
    gloss: De winkelier vraagt waarmee hij hem kan helpen.
    note: Een formele begroeting, zoals die van de kantoormedewerker in Unit 9 (*بفرمایین، چه خدمتی...*), hier met *کمکی* ('hulp') in plaats van *خدمتی* ('dienst').
  prs.a2.unit18.lesson04.teach.turn02:
    title: کریم vertelt wat het probleem is
    gloss: کریم zegt dat de kachel die hij gisteren heeft gekocht kapot is.
    note: Dit is precies dezelfde zin als in les 2.
  prs.a2.unit18.lesson04.teach.turn03:
    title: De winkelier vraagt wat er aan de hand is
    gloss: De winkelier vraagt wat het probleem is.
    note: '*چه مشکلی دارد؟* betekent letterlijk: ''wat voor probleem heeft het?'''
  prs.a2.unit18.lesson04.teach.turn04:
    title: کریم legt het defect uit
    gloss: Als hij hem aanzet, wordt hij niet warm.
    note: '*روشنش می‌کنم* -- ''ik zet hem aan'' -- hecht het lijdend-voorwerpachtervoegsel *-ش* aan *روشن*.'
  prs.a2.unit18.lesson04.teach.turn05:
    title: De winkelier vraagt om het bonnetje
    gloss: De winkelier vraagt of hij het bonnetje bij zich heeft.
    note: '*همراه‌تان* -- ''bij u'' -- met het formele bezitsachtervoegsel *-تان*.'
  prs.a2.unit18.lesson04.teach.turn06:
    title: کریم bevestigt dat hij het heeft
    gloss: Ja, hier is zijn bonnetje.
    note: '*اینه* is een informeel ''alsjeblieft, hier is het'', dat je zegt als je iets overhandigt. Dit kwam al aan bod in Unit 11.'
  prs.a2.unit18.lesson04.teach.turn07:
    title: De winkelier biedt een keuze aan
    gloss: De winkelier kan de kachel omruilen of het geld terugbetalen. Waar gaat zijn voorkeur naar uit?
    note: Dit hergebruikt de vraag *ترجیح می‌دهین؟* uit les 2.
  prs.a2.unit18.lesson04.teach.turn08:
    title: کریم kiest voor omruilen
    gloss: کریم zegt dat omruilen beter is, en bedankt.
    note: '*بهتر است* betekent ''is beter''.'
