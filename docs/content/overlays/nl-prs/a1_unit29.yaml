  description: 'Dari van Kabul voor beginners: woordenschat over sport en beweging (voetbal, volleybal, cricket, zwemmen), vragen en antwoorden hoe vaak per week je sport, zeggen waar je speelt of sport, en een dialoog tussen Zarmina en Homayoun waarin sport, frequentie en plaats samenkomen.'
