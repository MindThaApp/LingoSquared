course:
  title: Dari in het Nederlands A1
  description: 'Dari (Afghanistan) voor beginners: je naam noemen, zeggen waar je vandaan komt en wat je doet, een derde persoon voorstellen en beleefde titels en het juiste register gebruiken bij een eerste kennismaking.'
units:
  prs.a1.unit02.introductions:
    title: Kennismaken en elkaar leren kennen
lessons:
  prs.a1.unit02.lesson01.name_exchange:
    title: Naar een naam vragen en je naam zeggen
  prs.a1.unit02.lesson02.origin_and_hometown:
    title: Vragen naar woonplaats en land
  prs.a1.unit02.lesson03.occupation:
    title: Vraag naar iemands werk
  prs.a1.unit02.lesson04.introducing_others:
    title: Een derde persoon voorstellen
  prs.a1.unit02.lesson05.polite_titles_and_register:
    title: Beleefde titels en het juiste register gebruiken
  prs.a1.unit02.lesson06.gathering_dialogue:
    title: Mensen ontmoeten op een bijeenkomst
teaching:
  prs.a1.unit02.lesson01.teach.name_question_polite:
    title: Beleefd naar iemands naam vragen
    gloss: Hoe heet u?
    note: نام‌تان چیست؟ is de égards-vorm voor een nieuwe volwassen kennis en sluit aan bij het register شما/استین uit Les 1.
  prs.a1.unit02.lesson01.teach.name_answer:
    title: Je naam zeggen met است
    gloss: Mijn naam is Faridun.
    note: نام من ... است is de geschreven manier om je naam te zeggen. In gesprekken zeggen mensen meestal نامم ... است (نامم = نام + -م, mijn naam). Beide vormen zijn correct.
  prs.a1.unit02.lesson01.teach.i_am_name:
    title: Je naam zeggen met استم
    gloss: Ik ben Faridun.
    note: استم volgt direct op de naam. Het is dezelfde koppelwerkwoordsvorm voor de eerste persoon als in Les 1.
  prs.a1.unit02.lesson01.teach.name_question_informal:
    title: Naar de naam van een goede vriend(in) vragen
    gloss: Hoe heet je?
    note: نامت چیست؟ gebruikt het informele bezitsachtervoegsel -ت. Gebruik het alleen voor een leeftijdsgenoot of goede vriend(in), net als تو/استی in Les 1.
  prs.a1.unit02.lesson01.teach.what_is_your_name_word:
    title: Het woord voor naam
    gloss: naam
    note: نام is het zelfstandig naamwoord dat in zowel de beleefde als de informele vraag hierboven wordt gebruikt.
    example_gloss: Wat is jouw naam?
  prs.a1.unit02.lesson01.teach.register_note:
    title: Beleefd bezitsachtervoegsel versus dat voor een goede vriend(in)
    gloss: -تان voor iemand die je met respect aanspreekt; -ت voor een goede vriend(in).
    note: Het onderscheid in register uit Les 1 (شما/تو) geldt ook voor de bezitsachtervoegsels bij نام.
  prs.a1.unit02.lesson02.teach.where_from_polite:
    title: Vragen waar iemand vandaan komt
    gloss: Waar komt u vandaan?
    note: شما از کجا استین؟ houdt het respectvolle paar شما/استین aan.
  prs.a1.unit02.lesson02.teach.from_kabul:
    title: Zeggen dat je uit Kaboel komt
    gloss: Ik kom uit Kaboel.
    note: من از کابل استم volgt het patroon من از [plaats] استم, dat voor elke stad werkt.
  prs.a1.unit02.lesson02.teach.from_herat:
    title: Zeggen dat je uit Herat komt
    gloss: Ik kom uit Herat.
    note: هرات is een grote stad in het westen van Afghanistan.
  prs.a1.unit02.lesson02.teach.from_mazar:
    title: Zeggen dat je uit Mazar-i-Sharif komt
    gloss: Ik kom uit Mazar-i-Sharif.
    note: مزار شریف schrijf je als twee woorden. Het is een grote stad in het noorden van Afghanistan.
  prs.a1.unit02.lesson02.teach.country:
    title: Afghanistan
    gloss: Afghanistan
    note: افغانستان gebruik je na از op dezelfde manier als de naam van een stad.
    example_gloss: Ik kom uit Afghanistan.
  prs.a1.unit02.lesson02.teach.city_word:
    title: Het woord voor stad
    gloss: stad
    note: شهر is het algemene woord voor een stad, in tegenstelling tot de naam van een bepaalde stad.
    example_gloss: Kaboel is een grote stad.
  prs.a1.unit02.lesson03.teach.occupation_question:
    title: Vragen wat iemand doet
    gloss: Wat voor werk doe je?
    note: کار شما چیست؟ vraagt letterlijk 'wat is uw werk' en is de gewone manier om naar iemands beroep te vragen.
  prs.a1.unit02.lesson03.teach.doctor:
    title: Dokter
    gloss: dokter
    note: داکتر is het gewone Dari-woord voor dit beroep. Het wordt gebruikt voor artsen en, informeel, ook voor mensen met een doctorstitel.
    example_gloss: Hij/zij is dokter.
  prs.a1.unit02.lesson03.teach.teacher:
    title: Lerares
    gloss: leraar
    note: معلم is een algemeen woord voor leraar, op elk schoolniveau.
    example_gloss: Hij/zij is leraar.
  prs.a1.unit02.lesson03.teach.engineer:
    title: Ingenieur
    gloss: ingenieur
    note: مهندس dekt ingenieurs in het algemeen, niet één specifieke ingenieursrichting.
    example_gloss: Hij/zij is ingenieur.
  prs.a1.unit02.lesson03.teach.shopkeeper:
    title: Winkelier
    gloss: winkelier
    note: دوکاندار (van دوکان, winkel) is de alledaagse term in Kaboel. In deze cursus gebruiken we de Dari-spelling دوکان en niet het Iraanse مغازه.
    example_gloss: Hij/zij is winkelier.
  prs.a1.unit02.lesson03.teach.i_am_teacher:
    title: Een beroep noemen
    gloss: Ik ben lerares.
    note: من [beroep] استم is het patroon voor elk beroep uit deze les.
  prs.a1.unit02.lesson04.teach.introduce_formal:
    title: Iemand formeel voorstellen
    gloss: Mag ik mijn collega aan u voorstellen?
    note: اجازه بدهین همکارم را معرفی کنم is een beleefde manier om een derde persoon in het gesprek te betrekken.
  prs.a1.unit02.lesson04.teach.this_is:
    title: De persoon noemen die je voorstelt
    gloss: Dit is mijn collega Arezoo.
    note: این [persoon] است noemt direct wie er wordt voorgesteld.
  prs.a1.unit02.lesson04.teach.pleased_after_intro:
    title: Zeggen dat je blij bent kennis te maken
    gloss: Aangenaam.
    note: از آشنایی با شما خوش شدم is dezelfde zin voor een eerste ontmoeting als in Les 1. Hier gebruik je hem opnieuw na het voorstellen van een derde persoon.
  prs.a1.unit02.lesson04.teach.pleased_reply:
    title: Antwoorden dat je ook blij bent
    gloss: Ik vind het ook prettig kennis te maken.
    note: من هم خوش شدم is het natuurlijke korte antwoord.
  prs.a1.unit02.lesson04.teach.friend_word:
    title: Vriend(in)
    gloss: vriend(in)
    note: دوست is een algemeen woord voor vriend(in), zonder te zeggen hoe close je bent.
    example_gloss: Hij/zij is mijn vriend(in).
  prs.a1.unit02.lesson04.teach.colleague_word:
    title: Collega
    gloss: collega
    note: همکار betekent collega en kwam al voor in de werkdialoog van Les 1.
    example_gloss: Hij/zij is mijn collega.
  prs.a1.unit02.lesson05.teach.title_jenab:
    title: Meneer
    gloss: meneer
    note: جناب staat vóór de naam of titel van een man als respectvolle aanspreekvorm. Het komt veel voor in het dagelijks leven in Afghaanse steden.
    example_gloss: Meneer, gaat uw gang.
  prs.a1.unit02.lesson05.teach.title_khanom:
    title: Mevrouw
    gloss: mevrouw
    note: خانم staat vóór de naam van een vrouw en wordt gebruikt ongeacht of ze getrouwd is.
    example_gloss: Mevrouw, gaat uw gang.
  prs.a1.unit02.lesson05.teach.title_with_name:
    title: Een man beleefd aanspreken
    gloss: meneer Faridun
    note: جناب plus een voornaam is een gebruikelijke beleefde aanspreekvorm. Een achternaam is daarbij niet nodig.
  prs.a1.unit02.lesson05.teach.title_with_name_female:
    title: Een vrouw beleefd aanspreken
    gloss: mevrouw Arezoo
    note: خانم plus een voornaam werkt hetzelfde als جناب voor een man.
  prs.a1.unit02.lesson05.teach.register_reminder:
    title: Wanneer gebruik je welk register?
    gloss: Gebruik شما en استین voor iemand die je net hebt ontmoet; gebruik تو en استی alleen voor een goede vriend(in).
    note: Dit herhaalt de registerregel uit Les 1, nu voor de kennismakingssituatie.
  prs.a1.unit02.lesson05.teach.polite_could_you:
    title: Beleefd vragen of iemand zijn naam wil herhalen
    gloss: Kunt u uw naam nog een keer zeggen?
    note: می‌توانین نام‌تان را دوباره بگویین؟ is een natuurlijke, beleefde manier om om herhaling te vragen zonder ongemakkelijk te doen.
  prs.a1.unit02.lesson06.teach.gathering_word:
    title: Bijeenkomst / feest
    gloss: bijeenkomst
    note: مهمانی is een informele sociale bijeenkomst en de setting van de dialoog in deze les.
    example_gloss: De bijeenkomst is gezellig.
  prs.a1.unit02.lesson06.teach.turn01:
    title: Leila begint met kennismaken
    gloss: Leila begroet Faridun en vraagt naar zijn naam. Ze spreekt hem respectvol aan met جناب.
    note: Leila en Faridun kennen elkaar nog niet, dus gebruikt ze meteen het respectvolle register.
  prs.a1.unit02.lesson06.teach.turn02:
    title: Faridun zegt zijn naam
    gloss: Faridun beantwoordt de groet en zegt zijn naam.
    note: سلام علیکم is de uitgebreidere groet uit Les 1 en past bij een eerste ontmoeting. In gesprekken zegt Faridun نامم فریدون است (نامم = نام من, mijn naam), de alledaagse gesproken vorm.
  prs.a1.unit02.lesson06.teach.turn03:
    title: Leila vraagt waar hij vandaan komt
    gloss: Leila zegt dat ze blij is kennis met hem te maken en vraagt waar hij vandaan komt.
    note: Dezelfde zin از آشنایی با شما خوش شدم kwam ook al voor in de werkdialoog van Les 1.
  prs.a1.unit02.lesson06.teach.turn04:
    title: Faridun antwoordt en stelt de vraag terug
    gloss: Faridun zegt dat hij uit Herat komt en stelt Leila dezelfde vraag.
    note: و شما؟ is een beknopte manier om een vraag terug te stellen, zoals in Les 1.
  prs.a1.unit02.lesson06.teach.turn05:
    title: Leila antwoordt en vraagt naar zijn werk
    gloss: Leila zegt dat ze uit Kaboel komt en vraagt wat Faridun voor werk doet.
    note: Het gesprek gaat vanzelf van herkomst naar beroep.
  prs.a1.unit02.lesson06.teach.turn06:
    title: Faridun antwoordt en stelt de vraag terug
    gloss: Faridun zegt dat hij ingenieur is en vraagt Leila hetzelfde.
    note: شما چطور؟ is een korte manier om een vraag terug te geven die uit de context al duidelijk is.
  prs.a1.unit02.lesson06.teach.turn07:
    title: Leila vertelt over haar beroep
    gloss: Leila zegt dat ze lerares is.
    note: Rondt de uitwisseling over beroepen af met het patroon dat eerder in de unit is behandeld.
  prs.a1.unit02.lesson06.teach.turn08:
    title: Faridun stelt een derde persoon voor
    gloss: Faridun stelt zijn collega Arezoo voor.
    note: Hiermee komt een derde persoon in het gesprek, met de formele voorstelzin uit les 4.
  prs.a1.unit02.lesson06.teach.turn09:
    title: Leila verwelkomt Arezoo
    gloss: Leila verwelkomt Arezoo en spreekt haar respectvol aan met خانم.
    note: خوش آمدین is de welkomstzin uit Unit 1, hier gericht aan iemand die net is voorgesteld.
  prs.a1.unit02.lesson06.teach.turn10:
    title: Arezoo reageert
    gloss: Arezoo bedankt Leila en zegt dat ze blij is haar te ontmoeten.
    note: از دیدن شما خوشحال شدم is een natuurlijke variant van de zin 'aangenaam kennis te maken', met دیدن (zien) in plaats van آشنایی.
