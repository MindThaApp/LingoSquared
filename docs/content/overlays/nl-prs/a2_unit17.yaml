course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor gevorderde beginners: een weekprogramma beschrijven, met woorden voor volgorde, de werkweek en het weekend vergelijken, een vergelijking van twee weken lezen en een echt gesprek tussen twee vrienden over hun week.'
