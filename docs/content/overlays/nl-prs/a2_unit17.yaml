teaching:
  prs.a2.unit17.lesson01.teach.week_word:
    title: Week
    gloss: week
    note: '*هفته* betekent week.'
    example_gloss: Ik het deze week erg druk.
  prs.a2.unit17.lesson01.teach.weekend_word:
    title: Weekend
    gloss: weekend
    note: '*آخر هفته* betekent letterlijk ''einde van de week''.'
    example_gloss: In het weekend rust ik uit.
  prs.a2.unit17.lesson01.teach.schedule_word:
    title: Programma
    gloss: programma
    note: '*برنامه* gebruik je voor een rooster, een plan of een programma.'
    example_gloss: Mijn weekprogramma is druk.
  prs.a2.unit17.lesson01.teach.first_word:
    title: Eerst
    gloss: eerst
    note: '*اول* opent een reeks stappen.'
    example_gloss: Eerst ontbijt ik.
  prs.a2.unit17.lesson01.teach.then_word:
    title: Dan
    gloss: dan
    note: '*بعد* zet een reeks voort na *اول*.'
    example_gloss: Daarna ga ik naar kantoor.
  prs.a2.unit17.lesson01.teach.finally_word:
    title: Tot slot
    gloss: tot slot
    note: '*در آخر* sluit een reeks af. *اول ... بعد ... در آخر* is het A2-patroon voor volgorde in deze unit.'
    example_gloss: Tot slot studeer ik een beetje.
  prs.a2.unit17.lesson01.teach.sequence_grammar:
    title: Een volledige zin met volgorde
    gloss: Op werkdagen ga ik eerst naar kantoor, daarna sport ik en tot slot studeer ik een beetje.
    note: Met *اول ... بعد ... و در آخر* zet je drie activiteiten in één zin op volgorde. Dit is de belangrijkste grammaticastap van deze unit op A2-niveau.
  prs.a2.unit17.lesson01.teach.days_word:
    title: Werkdagen
    gloss: werkdagen
    note: '*روزهای هفته* – letterlijk ''de dagen van de week'' – betekent werkdagen, tegenover *آخر هفته*.'
    example_gloss: Op werkdagen heb ik het druk met werk.
  prs.a2.unit17.lesson02.teach.ask_weekly_schedule:
    title: Vraag naar iemands weekprogramma
    gloss: Hoe ziet jouw week eruit?
    note: '*تو* is de informele vorm van ''jij'' tussen vrienden.'
  prs.a2.unit17.lesson02.teach.weekday_full_sentence:
    title: Een volgorde op een werkdag beschrijven
    gloss: Op werkdagen ga ik eerst naar kantoor, daarna sport ik.
    note: Hier komt het patroon van les 1 terug, met *اول* en *بعد*.
  prs.a2.unit17.lesson02.teach.weekend_activity:
    title: Een weekendactiviteit beschrijven
    gloss: In het weekend slaap ik uit en breng ik tijd door met mijn familie.
    note: '*دیر بیدار می‌شوم* – ''ik word laat wakker'' – staat in contrast met het vroege opstaan op werkdagen in de leestekst van les 3.'
  prs.a2.unit17.lesson03.teach.difference_word:
    title: Verschil
    gloss: verschil
    note: '*تفاوت* betekent verschil.'
    example_gloss: Er is een groot verschil tussen werkdagen en het weekend.
  prs.a2.unit17.lesson03.teach.rest_word:
    title: Uitrusten
    gloss: uitrusten
    note: '*استراحت کردن* betekent rusten of ontspannen.'
    example_gloss: In het weekend rust ik uit.
  prs.a2.unit17.lesson03.teach.comparison_text:
    title: Een korte vergelijking van de week van همایون
    gloss: Op werkdagen staat همایون vroeg op en gaat hij naar kantoor. Maar in het weekend wordt hij laat wakker en rust hij uit.
    note: Een korte beschrijvende tekst die de routine op werkdagen en in het weekend vergelijkt, in het leesregister dat deze unit behandelt.
  prs.a2.unit17.lesson04.teach.turn01:
    title: زرمینه vraagt naar de week van همایون
    gloss: زرمینه vraagt hoe zijn weekprogramma eruitziet.
    note: Dezelfde vraag als in les 2, met het informele *تو* dat dit vriendenduo al gebruikt.
  prs.a2.unit17.lesson04.teach.turn02:
    title: همایون beschrijft zijn werkdagen
    gloss: Op werkdagen gaat hij eerst naar kantoor, daarna sport hij.
    note: Dezelfde zin als in les 2.
  prs.a2.unit17.lesson04.teach.turn03:
    title: زرمینه vraagt naar zijn weekend
    gloss: زرمینه vraagt wat hij in het weekend doet.
    note: '*چه کار می‌کنی؟* betekent ''wat doe je?'''
  prs.a2.unit17.lesson04.teach.turn04:
    title: همایون beschrijft zijn weekend en vraagt terug
    gloss: In het weekend slaapt hij uit en brengt hij tijd door met zijn familie. Hij vraagt haar hetzelfde.
    note: Dezelfde weekendzin als in les 2.
  prs.a2.unit17.lesson04.teach.turn05:
    title: زرمینه beschrijft haar werkdagen
    gloss: Op werkdagen werkt ze eerst, daarna komt ze thuis en kookt ze.
    note: '*آشپزی* betekent koken.'
  prs.a2.unit17.lesson04.teach.turn06:
    title: زرمینه beschrijft haar weekend
    gloss: In het weekend gaat ze met haar vriendinnen naar de markt.
    note: '*دوستانم* – ''mijn vrienden'' – voegt het bezitsachtervoegsel *-َم* toe aan *دوستان* (vrienden).'
  prs.a2.unit17.lesson04.teach.turn07:
    title: همایون reageert goedkeurend
    gloss: همایون zegt dat ze een goed programma heeft.
    note: '*برنامهٔ خوبی داری!* betekent ''wat een goed programma heb je!'''
