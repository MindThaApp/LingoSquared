teaching:
  prs.a2.unit14.lesson01.teach.experience_word:
    title: Ervaring
    gloss: ervaring
    note: '*تجربه* is het algemene woord voor werkervaring.'
    example_gloss: لیمه heeft drie jaar ervaring.
  prs.a2.unit14.lesson01.teach.skill_word:
    title: Vaardigheid
    gloss: vaardigheid
    note: '*مهارت* is een vaardigheid of bekwaamheid.'
    example_gloss: Computervaardigheid is belangrijk.
  prs.a2.unit14.lesson01.teach.salary_word:
    title: Salaris
    gloss: salaris
    note: '*حقوق* betekent salaris of loon.'
    example_gloss: Het salaris voor deze functie is 30.000 afghani.
  prs.a2.unit14.lesson01.teach.position_word:
    title: Functie / baan
    gloss: functie / baan
    note: '*وظیفه* is een algemeen woord voor een baan of functie, anders dan het formelere *بست* (een officiële vacature).'
    example_gloss: Deze functie is op een kantoor.
  prs.a2.unit14.lesson01.teach.resume_word:
    title: Cv
    gloss: cv
    note: '*رزومه* is een leenwoord (van ''resume'') voor een cv.'
    example_gloss: Ik heb mijn cv naar de interviewer gestuurd.
  prs.a2.unit14.lesson01.teach.interview_word:
    title: Sollicitatiegesprek
    gloss: sollicitatiegesprek
    note: '*مصاحبه* is een sollicitatiegesprek.'
    example_gloss: Het sollicitatiegesprek van لیمه is morgen.
  prs.a2.unit14.lesson01.teach.how_many_years_grammar:
    title: Hoeveel jaar, met چند سال
    gloss: Hoeveel jaar ervaring heb je?
    note: '*چند سال...؟* -- een vraagpatroon voor hoeveelheden, om naar jaren ervaring te vragen.'
    target_text: چند سال تجربه دارین؟ (hoeveel jaar ervaring heb je?)
  prs.a2.unit14.lesson02.teach.three_years_experience:
    title: Je jaren ervaring noemen
    gloss: Ik heb drie jaar ervaring in deze functie.
    note: '*در این وظیفه* betekent ''in deze functie''.'
  prs.a2.unit14.lesson02.teach.can_start_next_week:
    title: Zeggen wanneer je kunt beginnen
    gloss: Ik kan vanaf volgende week beginnen.
    note: '*از هفتهٔ آینده* betekent ''vanaf volgende week''; *می‌توانم* betekent ''ik kan''.'
  prs.a2.unit14.lesson02.teach.ask_salary:
    title: Naar het salaris vragen
    gloss: Wat is het salaris voor deze functie?
    note: '*چقدر؟* betekent ''hoeveel?''.'
  prs.a2.unit14.lesson03.teach.vacancy_word:
    title: Vacature / officiële functie
    gloss: vacature / officiële functie
    note: '*بست* is de Afghaanse term in vacatures voor een officiële vacature, formeler dan *وظیفه*.'
    example_gloss: Deze vacature is op een kantoor.
  prs.a2.unit14.lesson03.teach.requirements_word:
    title: Vereisten
    gloss: vereisten
    note: '*شرایط* somt de vereisten of voorwaarden voor een functie op.'
    example_gloss: De vereiste voor deze vacature is computervaardigheid.
  prs.a2.unit14.lesson03.teach.notice_text:
    title: Een vacature
    gloss: 'Voor deze functie is minimaal twee jaar ervaring vereist. Vereisten: computervaardigheid en Engels. Salaris: 30.000 afghani per maand.'
    note: Een korte, formele vacaturetekst in het register dat deze unit behandelt.
  prs.a2.unit14.lesson04.teach.turn01:
    title: De interviewer heet لیمه welkom
    gloss: De interviewer heet haar welkom en vraagt haar over haar ervaring te vertellen.
    note: '*خوش آمدین* is een formele manier om ''welkom'' te zeggen.'
  prs.a2.unit14.lesson04.teach.turn02:
    title: لیمه noemt haar ervaring
    gloss: Ze zegt dat ze drie jaar ervaring heeft in deze functie.
    note: Dezelfde zin als eerder om je jaren ervaring te noemen.
  prs.a2.unit14.lesson04.teach.turn03:
    title: De interviewer vraagt naar vaardigheden
    gloss: De interviewer vraagt wat haar vaardigheden zijn.
    note: '*مهارت‌های شما چیست؟* -- ''wat zijn uw vaardigheden?''.'
  prs.a2.unit14.lesson04.teach.turn04:
    title: لیمه somt haar vaardigheden op
    gloss: Ze beheerst computervaardigheden en Engels.
    note: Somt twee vaardigheden op, verbonden met *و*.
  prs.a2.unit14.lesson04.teach.turn05:
    title: De interviewer vraagt naar de startdatum
    gloss: De interviewer vraagt vanaf wanneer ze kan beginnen.
    note: '*از کی می‌توانین شروع کنین؟* -- ''vanaf wanneer kunt u beginnen?''.'
  prs.a2.unit14.lesson04.teach.turn06:
    title: لیمه antwoordt en vraagt naar het salaris
    gloss: Ze kan volgende week beginnen en vraagt hoeveel het salaris voor deze functie is.
    note: Combineert de zin voor de startdatum *از هفتهٔ آینده می‌توانم شروع کنم* met de vraag over het salaris.
  prs.a2.unit14.lesson04.teach.turn07:
    title: De interviewer noemt het salaris
    gloss: 'De interviewer zegt: 30.000 afghani per maand.'
    note: Het salaris komt overeen met de vacature die je eerder las.
