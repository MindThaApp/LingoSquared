course:
  title: Dari A2
  description: 'Afghaans Dari voor lager-gevorderden: een eenvoudig sollicitatiegesprek — woordenschat, ervaring en beschikbaarheid beschrijven, een vacature lezen en het gesprek zelf.'
units:
  prs.a2.unit14.job_interview:
    title: Sollicitatiegesprek
lessons:
  prs.a2.unit14.lesson01.interview_vocabulary:
    title: Woorden voor een sollicitatiegesprek
  prs.a2.unit14.lesson02.describing_experience_and_availability:
    title: Ervaring en beschikbaarheid beschrijven
  prs.a2.unit14.lesson03.reading_a_job_posting:
