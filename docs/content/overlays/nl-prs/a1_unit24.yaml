course:
  title: Dari in het Nederlands A1
  description: 'Dari van Kabul voor beginners: woordenschat over vervoer (bus, taxi, auto, fiets, te voet), vertellen hoe je ergens komt, een kaartje kopen en een dialoog tussen Zarmina en Homayoun waarin ze manieren van pendelen vergelijken.'
units:
  prs.a1.unit24.transportation:
    title: Vervoer
    description: Praat over hoe je je door de stad verplaatst, koop een kaartje en vraag welk vervoer je moet nemen.
