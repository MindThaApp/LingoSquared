    example_gloss: Ik koop een kaartje.
  prs.a1.unit24.lesson04.teach.dialogue_line1:
    title: 'Zarmina: Hoe ga je naar de stad?'
    gloss: 'Zarmina: Homayoun, hoe ga jij naar de stad?'
    note: شهر betekent stad. Dit woord is nieuw in deze zin.
  prs.a1.unit24.lesson04.teach.dialogue_line2:
    title: 'Homayoun: Ik loop, het is dichtbij'
    gloss: 'Homayoun: Ik ga te voet, het is dichtbij. Hoe ga jij?'
    note: نزدیک betekent dichtbij. Dit woord is nieuw in deze zin.
  prs.a1.unit24.lesson04.teach.dialogue_line3:
    title: 'Zarmina: Ik ga met de taxi, die is direct en snel'
    gloss: 'Zarmina: Ik ga met de taxi, die is direct en snel.'
    note: تیز betekent snel. Dit woord is nieuw in deze zin.
  prs.a1.unit24.lesson04.teach.dialogue_line4:
    title: 'Homayoun: De bus is ook goed, die is goedkoop'
    gloss: 'Homayoun: De bus is ook goed, die is goedkoop.'
    note: ارزان betekent goedkoop. Dit woord is nieuw in deze zin.
  prs.a1.unit24.lesson04.teach.dialogue_line5:
    title: 'Zarmina: Ja, maar de taxi is sneller'
    gloss: 'Zarmina: Ja, maar de taxi is sneller.'
    note: 'اما betekent "maar"; تیزتر is de vergrotende trap: "sneller".'
  prs.a1.unit24.lesson05.teach.reading_passage:
    title: Lezen over woon-werkverkeer
    gloss: Zarmina gaat elke dag met de taxi naar de stad. De taxi is snel, maar niet goedkoop. Homayoun loopt, omdat zijn huis dichtbij is. Hij spaart geld voor een auto.
    note: Een korte leestekst die de woordenschat van de les herhaalt, met het voegwoord چون (omdat).
  prs.a1.unit24.lesson06.teach.review_dochakhe:
    title: Fiets (herhaling)
    gloss: fiets
    note: دوچرخه betekent fiets (herhaling uit les 1).
    example_gloss: Ik ga met de fiets.
  prs.a1.unit24.lesson06.teach.wrap_summary:
    title: Ik loop of neem elke dag de bus
    gloss: Ik ga elke dag te voet of met de bus.
    note: یا betekent "of". Dit woord is nieuw in deze afsluitende zin.
