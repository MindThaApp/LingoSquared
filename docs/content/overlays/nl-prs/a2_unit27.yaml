course:
  title: Dari A2
  description: 'Dari uit Afghanistan voor het lagere middenniveau: zeggen wat je binnenkort gaat doen en wat je later van plan bent. De tegenwoordige tijd met een tijdwoord voor plannen (morgen, volgende week, in de zomer), می‌خواهم plus de conjunctief en تصمیم دارم voor voornemens, met vakanties, cursussen en verhuizen.'
units:
  prs.a2.unit27.my_plans:
    title: Mijn plannen
lessons:
  prs.a2.unit27.lesson01.tomorrow_and_next_week:
    title: 'Morgen en volgende week: de tegenwoordige tijd voor plannen'
  prs.a2.unit27.lesson02.everyone_and_holiday:
    title: 'Ieders plannen: personen, vragen, vakanties'
  prs.a2.unit27.lesson03.i_want_to:
    title: 'Ik wil: voornemens met می‌خواهم'
  prs.a2.unit27.lesson04.decisions_and_moving:
    title: Beslissingen, cursussen en verhuizen
  prs.a2.unit27.lesson05.reading_and_listening:
    title: Lezen en luisteren over plannen
  prs.a2.unit27.lesson06.conversation_and_writing:
    title: Een gesprek over een nieuw huis, en schrijven
teaching:
  prs.a2.unit27.lesson01.teach.names:
    title: Mahtab en Latif
    gloss: Mahtab en Latif zijn vrienden.
    note: Twee vrienden, *مهتاب* (een vrouw) en *لطیف* (een man), vertellen in deze unit over hun plannen. Ze praten als vrienden met elkaar, dus gebruiken ze *تو*.
  prs.a2.unit27.lesson01.teach.tomorrow:
    title: Morgen
    gloss: morgen
    note: '*فردا* betekent morgen. Het is het tijdwoord dat je het vaakst gebruikt voor een plan.'
    example_gloss: Morgen ga ik naar Kabul.
  prs.a2.unit27.lesson01.teach.next_week:
    title: Volgende week
    gloss: volgende week
    note: '*هفتهٔ آینده* betekent volgende week. *آینده* betekent komend of volgend en werkt ook met andere tijdwoorden: *ماه آینده* (volgende maand), *سال آینده* (volgend jaar).'
    example_gloss: Volgende week ga ik naar Herat.
  prs.a2.unit27.lesson01.teach.next_month:
    title: Volgende maand
    gloss: volgende maand
    note: '*ماه آینده* betekent volgende maand. Het heeft hetzelfde patroon als *هفتهٔ آینده*.'
    example_gloss: Volgende maand ga ik naar Mazar.
  prs.a2.unit27.lesson01.teach.next_year:
    title: Volgend jaar
    gloss: volgend jaar
    note: '*سال آینده* betekent ''volgend jaar''.'
    example_gloss: Volgend jaar kom ik naar Kabul.
  prs.a2.unit27.lesson01.teach.summer:
    title: Zomer
    gloss: zomer, in de zomer
    note: '*تابستان* is de zomer. Het betekent ook ''in de zomer'': je hebt geen apart woord voor ''in'' nodig.'
    example_gloss: In de zomer ga ik naar Bamyan.
  prs.a2.unit27.lesson01.teach.plan:
    title: Plan
    gloss: plan, programma
    note: '*برنامه* is een plan. *برنامه دارم* betekent ''ik heb een plan''. Zo zeg je meestal dat je plannen hebt.'
    example_gloss: Ik heb een plan voor de zomer.
  prs.a2.unit27.lesson01.teach.rule:
    title: De tegenwoordige tijd met een tijdswoord zegt wat je van plan bent
    gloss: Morgen ga ik. Volgende week ga ik. In de zomer ga ik.
    note: 'Dari heeft geen apart alledaags woord voor ''zullen''. Om over een plan te praten gebruik je gewoon de tegenwoordige tijd, *می‌* plus de tegenwoordige stam, en voeg je een tijdswoord toe dat naar de toekomst wijst: *فردا می‌روم* betekent ''morgen ga ik'', *هفتهٔ آینده می‌روم* betekent ''volgende week ga ik''. Het tijdswoord vertelt de luisteraar dat het plan in de toekomst ligt. Zonder tijdswoord betekent *می‌روم* gewoon ''ik ga'' of ''ik ga nu''. Het Nederlands werkt hier net zo: je zegt ''morgen ga ik'' en kunt ook ''ik zal gaan'' gebruiken. De woordvolgorde is vrij: het tijdswoord staat meestal vooraan, maar *به هرات فردا می‌روم* is ook goed.'
  prs.a2.unit27.lesson01.teach.paradigm:
    title: De tegenwoordige tijd van رفتن voor alle personen
    gloss: ik ga, jij gaat, hij/zij gaat, wij gaan, u gaat of jullie gaan, zij gaan
    note: 'De tegenwoordige tijd bestaat uit het voorvoegsel *می‌* (geschreven met een halve spatie), de tegenwoordige stam *رو* en een persoonsuitgang: *می‌روم* (ik), *می‌روی* (jij, een vriend), *می‌رود* (hij of zij), *می‌رویم* (wij), *می‌روین* (u, formeel, of jullie), *می‌روند* (zij). Het voornaamwoord is optioneel, want de uitgang laat al zien wie het is. De uitgang van de 2e persoon meervoud is in deze cursus *-ین*.'
  prs.a2.unit27.lesson01.teach.sentence:
    title: Morgen ga ik naar Herat
    gloss: Morgen ga ik naar Herat.
    note: 'Dit is het patroon van deze les: een tijdswoord, dan de plaats met *به*, en aan het eind het werkwoord in de tegenwoordige tijd.'
  prs.a2.unit27.lesson02.teach.holiday:
    title: Vakantie
    gloss: vakantie, vrije tijd
    note: '*رخصتی* is een vakantie of vrije tijd van werk of school. Het is het Afghaanse woord dat je het vaakst hoort.'
    example_gloss: In de vakantie ga ik naar Herat.
  prs.a2.unit27.lesson02.teach.travel:
    title: Reizen
    gloss: reizen, op reis gaan
    note: '*سفر کردن* is reizen. Met *به* zeg je waarheen: *به بامیان سفر می‌کنم* betekent ''ik reis naar Bamyan''. De uitgang komt op *کردن*, dus het werkwoord verandert zoals elk werkwoord in de tegenwoordige tijd: *سفر می‌کنم، سفر می‌کنی، سفر می‌کند*.'
    example_gloss: In de vakantie reist hij of zij naar Bamyan.
  prs.a2.unit27.lesson02.teach.hotel:
    title: Een hotel boeken
    gloss: een hotel boeken
    note: '*رزرو کردن* is boeken of reserveren en *هوتل* is een hotel. Een boeking is een typisch plan, dus de tegenwoordige tijd met een tijdswoord past hier: *فردا هوتل رزرو می‌کنم*.'
    example_gloss: Morgen boek ik een hotel.
  prs.a2.unit27.lesson02.teach.buy:
    title: Kopen
    gloss: kopen
    note: '*خریدن* is kopen. De tegenwoordige stam is *خر*: *می‌خرم، می‌خری، می‌خرد*.'
    example_gloss: Morgen koop ik fruit.
  prs.a2.unit27.lesson02.teach.more_verbs:
    title: De tegenwoordige tijd van آمدن
    gloss: ik kom, jij komt, hij/zij komt, wij komen, u komt of jullie komen, zij komen
    note: 'De tegenwoordige stam van *آمدن* is *آی*, dus het werkwoord is *می‌آیم، می‌آیی، می‌آید، می‌آییم، می‌آیین، می‌آیند*. Dezelfde uitgangen gelden voor elk werkwoord: *می‌مانم* (ik blijf), *می‌گیرم* (ik neem), *می‌خرم* (ik koop), *می‌کنم* (ik doe). Elk daarvan kan een plan zijn als je een tijdswoord toevoegt: *هفتهٔ آینده می‌آیم* betekent ''volgende week kom ik''.'
  prs.a2.unit27.lesson02.teach.negative:
    title: 'De ontkenning: نمی‌ voor alle personen'
    gloss: ik ga niet, jij gaat niet, hij/zij gaat niet, wij gaan niet, u gaat niet of jullie gaan niet, zij gaan niet
    note: 'Om te zeggen dat je iets niet gaat doen, zet je *ن* voor *می‌*: *می‌روم* wordt *نمی‌روم*. De uitgangen blijven hetzelfde. *جمعه به مکتب نمی‌روم* betekent ''op vrijdag ga ik niet naar school''. Denk aan de halve spatie tussen *نمی‌* en de stam.'
  prs.a2.unit27.lesson02.teach.questions:
    title: Vragen naar iemands plannen
    gloss: Wat doe je morgen? Waar ga je volgende week naartoe? Met wie ga je?
    note: 'Je vraagt naar een plan met dezelfde tegenwoordige tijd: *فردا چه می‌کنی؟* betekent ''wat doe je morgen?'', *کجا می‌روی؟* betekent ''waar ga je naartoe?'', *با کی می‌روی؟* betekent ''met wie ga je?''. Het antwoord staat ook in de tegenwoordige tijd, dus voor een gesprek over plannen heb je geen nieuwe werkwoordsvorm nodig.'
  prs.a2.unit27.lesson02.teach.stay:
    title: Ik blijf er een week
    gloss: Ik blijf er een week.
    note: '*می‌مانم* betekent ''ik blijf''. Een tijdsduur zoals *یک هفته* staat voor het werkwoord en heeft geen extra woord voor ''gedurende'' nodig.'
  prs.a2.unit27.lesson03.teach.pattern:
    title: 'Voornemen: می‌خواهم plus de aanvoegende wijs'
    gloss: Ik wil naar Herat gaan. Ik wil komen. Ik wil een boek kopen.
    note: 'Om te zeggen wat je van plan bent of wilt doen, gebruik je *می‌خواهم* (ik wil) en daarna een tweede werkwoord in de aanvoegende wijs: *می‌خواهم بروم* betekent ''ik wil gaan''. Het Nederlands gebruikt ''te'' of een kale infinitief (''ik wil gaan''). Dari gebruikt een tweede werkwoord met een persoonsuitgang en geen woord voor ''te''. Beide werkwoorden hebben dezelfde persoon: *می‌خواهم بروم* (ik wil gaan), *می‌خواهیم برویم* (wij willen gaan). Zet de infinitief niet achter *می‌خواهم*. Het woord *که* is hier niet nodig.'
  prs.a2.unit27.lesson03.teach.subjunctive:
    title: 'De aanvoegende wijs: بـ plus de tegenwoordige stam'
    gloss: dat ik ga, dat jij gaat, dat hij/zij gaat, dat wij gaan, dat u of jullie gaan, dat zij gaan
    note: 'De aanvoegende wijs bestaat uit *بـ* plus de tegenwoordige stam en dezelfde uitgangen als de tegenwoordige tijd: *رو* geeft *بروم، بروی، برود، برویم، بروین، بروند*. Andere werkwoorden: *بخرم* (dat ik koop), *بگیرم* (dat ik neem), *بمانم* (dat ik blijf), *بخورم* (dat ik eet). *آمدن* is de uitzondering: *بیایم* (dat ik kom). Je komt deze vorm tegen na *می‌خواهم* en ook na *باید*.'
  prs.a2.unit27.lesson03.teach.want_paradigm:
    title: De tegenwoordige tijd van خواستن
    gloss: ik wil, jij wilt, hij/zij wil, wij willen, u wilt of jullie willen, zij willen
    note: '*خواستن* heeft de tegenwoordige stam *خواه*: *می‌خواهم، می‌خواهی، می‌خواهد، می‌خواهیم، می‌خواهین، می‌خواهند*. Het tweede werkwoord volgt dezelfde persoon: *او می‌خواهد برود* (hij of zij wil gaan), *ما می‌خواهیم برویم* (wij willen gaan).'
  prs.a2.unit27.lesson03.teach.want_negative:
    title: Ik wil niet
    gloss: Ik wil niet gaan. Wij willen niet komen.
    note: 'Zet *ن* voor *می‌خواهم* om te zeggen dat je iets niet wilt: *نمی‌خواهم بروم* betekent ''ik wil niet gaan''. Het tweede werkwoord blijft in de aanvoegende wijs en krijgt geen tweede ontkenning.'
  prs.a2.unit27.lesson03.teach.plan_vs_intention:
    title: Een plan en een voornemen
    gloss: Morgen ga ik naar Herat. Ik wil naar Herat gaan.
    note: 'Vergelijk de twee. *فردا به هرات می‌روم* is een plan: het staat vast, je noemt een tijd en je gebruikt de tegenwoordige tijd. *می‌خواهم به هرات بروم* is een voornemen of een wens: je wilt het, maar het ligt nog niet vast, dus er staat vaak geen exacte tijd bij. Als je de tijd weet en alles geregeld is, zeg dan het plan. Als je het alleen wilt, zeg dan *می‌خواهم*.'
  prs.a2.unit27.lesson03.teach.course:
    title: Cursus
    gloss: cursus, les
    note: '*کورس* is een cursus, bijvoorbeeld een taal- of computercursus. Je volgt er een met *گرفتن*: *کورس گرفتن* is ''een cursus volgen''.'
    example_gloss: Ik wil een cursus Engels volgen.
  prs.a2.unit27.lesson03.teach.start:
    title: Beginnen
    gloss: beginnen, starten
    note: '*شروع شدن* is beginnen. Het wordt gebruikt voor iets dat begint, zoals een cursus, een vergadering of een les: *شروع می‌شود* betekent ''het begint''. Met een tijdswoord is dit ook een plan.'
    example_gloss: De cursus begint volgende week.
  prs.a2.unit27.lesson03.teach.university:
    title: Universiteit
    gloss: universiteit
    note: '*پوهنتون* is een universiteit. Het is het Afghaanse woord; je gaat er naartoe met *به*.'
    example_gloss: Ik wil naar de universiteit gaan.
  prs.a2.unit27.lesson04.teach.move:
    title: Verhuizen
    gloss: verhuizen, van huis veranderen
    note: '*عوض کردن* is veranderen, dus *خانه عوض کردن* is verhuizen. *خانه را عوض می‌کنم* is ook correct. De uitgang komt op *کردن*: *خانه عوض می‌کنم، خانه عوض می‌کنی*.'
    example_gloss: Volgende maand ga ik verhuizen.
  prs.a2.unit27.lesson04.teach.rent:
    title: Huren
    gloss: (een huis) huren
    note: '*کرایه* is de huur. *کرایه گرفتن* is een huis voor jezelf huren, bijvoorbeeld *یک خانه کرایه می‌گیرم*. Na *می‌خواهم* is het tweede werkwoord *بگیرم*.'
    example_gloss: Ik wil een nieuw huis huren.
  prs.a2.unit27.lesson04.teach.near:
    title: Dichtbij
    gloss: dichtbij, nabij
    note: '*نزدیک* is dichtbij. Wat er dichtbij is, zeg je direct erachter: *نزدیک مکتب* is ''dicht bij de school''.'
    example_gloss: Het nieuwe huis is dicht bij de school.
  prs.a2.unit27.lesson04.teach.decide:
    title: 'تصمیم دارم: ik heb besloten om'
    gloss: Ik ben van plan volgend jaar naar de universiteit te gaan.
    note: '*تصمیم دارم* betekent ''ik heb besloten'' of ''ik ben van plan''. Het is iets sterker dan *می‌خواهم*: je hebt erover nagedacht. Net als *می‌خواهم* wordt het gevolgd door de aanvoegende wijs: *تصمیم دارم بروم* betekent ''ik ben van plan te gaan''. Je kent *قصد دارم* al uit de vakantieles; dat betekent hetzelfde en is ook goed. De aanvoegende wijs staat aan het eind van de zin, na het tijdswoord en de plaats.'
  prs.a2.unit27.lesson04.teach.written_future:
    title: 'De geschreven toekomende tijd: خواهم رفت'
    gloss: Morgen zal ik naar Herat gaan. (schrijftaal)
    note: 'Op mededelingen, in het nieuws en in formeel schrift zie je *خواهم رفت*, *خواهد رفت*, *خواهیم رفت*: *خواه-* plus de uitgang en dan de verleden stam *رفت*. Het betekent ''zal gaan''. Je hoeft het alleen te herkennen. Als je spreekt, gebruik je de tegenwoordige tijd met een tijdswoord: *فردا به هرات می‌روم*.'
  prs.a2.unit27.lesson04.teach.because:
    title: Omdat mijn huis klein is
    gloss: Omdat mijn huis klein is.
    note: '*چون* betekent ''omdat''. Daarna komt een korte reden, hier met de koppelwerkwoordvorm *است*.'
  prs.a2.unit27.lesson05.teach.morning:
    title: Ochtend
    gloss: ochtend, 's ochtends
    note: '*صبح* is de ochtend. *فردا صبح* is ''morgenochtend''.'
    example_gloss: Morgenochtend ga ik naar Bamyan.
  prs.a2.unit27.lesson05.teach.holiday_turn01:
    title: Mahtab vraagt naar de vakantie
    gloss: Latif, heb jij een plan voor de vakantie?
    note: Mahtab vraagt Latif naar zijn vakantieplannen. *برنامه داری؟* betekent 'heb je een plan?'. Ze gebruikt *تو* omdat hij een vriend is.
  prs.a2.unit27.lesson05.teach.holiday_turn02:
    title: Latif vertelt zijn plan
    gloss: Ja. Volgende week ga ik naar Herat. Ik blijf er een week.
    note: 'Latif antwoordt *بلی* (ja). Zijn plan heeft een tijdswoord, *هفتهٔ آینده*, en de tegenwoordige tijd: *می‌روم*. *یک هفته آنجا می‌مانم* is een tweede plan in de tegenwoordige tijd.'
  prs.a2.unit27.lesson05.teach.holiday_turn03:
    title: Mahtab vraagt naar de tijd daarna
    gloss: Wat leuk! Wat doe je daarna?
    note: '*بعد از آن* betekent ''daarna''. De vraag staat in de tegenwoordige tijd, zoals altijd bij een plan.'
  prs.a2.unit27.lesson05.teach.holiday_turn04:
    title: Latif zegt wat hij wil
    gloss: Ik wil een cursus Engels volgen.
    note: 'Latif heeft geen exacte datum, dus hij gebruikt een voornemen: *می‌خواهم* plus de aanvoegende wijs *بگیرم*.'
  prs.a2.unit27.lesson05.teach.holiday_turn05:
    title: Mahtab vraagt wanneer de cursus begint
    gloss: Geweldig! Wanneer begint de cursus?
    note: '*کورس کی شروع می‌شود؟* vraagt wanneer een cursus begint. De tegenwoordige tijd *شروع می‌شود* gaat hier over een datum in de toekomst.'
  prs.a2.unit27.lesson05.teach.holiday_turn06:
    title: Latif noemt de maand
    gloss: Vanaf volgende maand.
    note: '*از ماه آینده* betekent ''vanaf volgende maand''. Een kort antwoord is genoeg.'
  prs.a2.unit27.lesson05.teach.message:
    title: Een bericht over plannen
    gloss: Hallo Mahtab. Morgenochtend ga ik naar Bamyan en ik blijf er twee dagen. Volgende week werk ik op kantoor. Volgend jaar ben ik van plan naar de universiteit te gaan.
    note: Een kort geschreven bericht. Het bevat een plan voor morgen, een plan voor volgende week en een voornemen voor volgend jaar. Alle plannen gebruiken de tegenwoordige tijd met een tijdswoord, en het voornemen gebruikt *تصمیم دارم* plus de aanvoegende wijs.
  prs.a2.unit27.lesson06.teach.help:
    title: Helpen
    gloss: helpen
    note: '*کمک* is hulp. *کمک کردن* is helpen: *فردا کمک می‌کنم* betekent ''morgen help ik''. De uitgang komt op *کردن*.'
    example_gloss: Morgen help ik mijn vriend.
  prs.a2.unit27.lesson06.teach.house_turn01:
    title: Latif vraagt naar volgende maand
    gloss: Mahtab, wat doe je volgende maand?
    note: Latif vraagt naar een plan met een tijdswoord, *ماه آینده*, en de tegenwoordige tijd.
  prs.a2.unit27.lesson06.teach.house_turn02:
    title: Mahtab vertelt haar plan
    gloss: Volgende maand ga ik verhuizen.
    note: '*خانه عوض می‌کنم* betekent ''ik ga verhuizen''. Het is een plan, dus het gebruikt de tegenwoordige tijd met het tijdswoord.'
  prs.a2.unit27.lesson06.teach.house_turn03:
    title: Latif vraagt waarom
    gloss: Waarom?
    note: '*چرا؟* betekent ''waarom?''. Een vraag van één woord is heel gewoon tussen vrienden.'
  prs.a2.unit27.lesson06.teach.house_turn04:
    title: Mahtab legt uit
    gloss: Omdat mijn huis klein is. Ik wil een nieuw huis huren, dicht bij de school.
    note: '*چون* geeft de reden, samen met *است*. Daarna volgt een voornemen: *می‌خواهم* plus de subjunctief *بگیرم*, want ze heeft het huis nog niet gevonden.'
  prs.a2.unit27.lesson06.teach.house_turn05:
    title: Latif biedt hulp aan
    gloss: Goed! Morgen kom ik en help ik.
    note: 'Latif maakt ter plekke een plan met *فردا* en de tegenwoordige tijd: *می‌آیم* en *کمک می‌کنم*. *کمک کردن* betekent ''helpen''.'
  prs.a2.unit27.lesson06.teach.house_turn06:
    title: Mahtab bedankt hem
    gloss: Bedankt!
    note: '*تشکر!* is een korte manier om een vriend te bedanken.'
exercises:
  prs.a2.unit27.lesson01.exercise01.recognize_tomorrow:
    instruction: Wat betekent deze zin?
    correct_option: Morgen ga ik naar Kabul
    distractors:
    - Gisteren ging ik naar Kabul
    - Ik ga altijd naar Kabul
    - Ik wil naar Kabul gaan
    accepted_answers:
    - value: Morgen ga ik naar Kabul
      status: correct
    feedback: '*فردا* verwijst naar de toekomst en *می‌روم* is de tegenwoordige tijd, dus dit is een plan: morgen ga ik naar Kabul.'
  prs.a2.unit27.lesson01.exercise02.recognize_we_next_week:
    instruction: Wat betekent deze zin?
    correct_option: Volgende week gaan we naar Herat
    distractors:
    - Vorige week gingen we naar Herat
    - We gaan elke week naar Herat
    - We zijn nu in Herat
    accepted_answers:
