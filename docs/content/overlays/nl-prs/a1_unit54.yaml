teaching:
  prs.a1.unit54.lesson01.teach.review_this_is_in_good:
    title: 'Herhaling: dit, is, in, goed'
    gloss: dit / is / in / goed
    note: Dit zijn herhalingswoorden (in de hele cursus gebruikt) om over het concert te praten.
    target_text: این (dit) / است (is) / در (in) / خوب (goed)
  prs.a1.unit54.lesson01.teach.concert_word:
    title: Concert
    gloss: concert
    note: Dit is een gangbaar, modern Dari-woord voor een concert. Het is net als *موزیم* (museum) uit een andere taal overgenomen.
    example_gloss: Dit concert is goed.
  prs.a1.unit54.lesson01.teach.singer_word:
    title: Zanger
    gloss: zanger
    note: Dit is het gewone, moderne Dari-woord voor een zanger. Er bestaat ook een klassieker alternatief, *آوازخوان*, maar dat is in het dagelijks taalgebruik minder gebruikelijk.
    example_gloss: De zanger is op het concert.
  prs.a1.unit54.lesson01.teach.this_is_concert_phrase:
    title: Dit is een concert
    gloss: Dit is een concert.
    note: Hier worden dit, is en concert samengevoegd, zoals eerder in deze cursus bij deze woorden.
  prs.a1.unit54.lesson01.teach.singer_at_concert_phrase:
    title: De zanger is op het concert
    gloss: De zanger is op het concert.
    note: Hier worden zanger, in en concert samengevoegd.
  prs.a1.unit54.lesson02.teach.review_price_and_time_words:
    title: 'Herhaling: hoeveel, afghani, is, dertig, uur, acht, avond, gebeurt, in, kaartje'
    gloss: hoeveel / afghani / is / dertig / uur / acht / avond / gebeurt / in / kaartje
    note: Dit zijn herhalingswoorden (uit eerdere lessen) om over de begintijd en de prijs van het concert te praten.
    target_text: چند (hoeveel) / افغانی (afghani) / است (is) / سی (dertig) / ساعت (uur) / هشت (acht) / شب (avond) / می‌شود (gebeurt) / در (in) / تکت (kaartje)
  prs.a1.unit54.lesson02.teach.start_word:
    title: Begin
    gloss: beginnen
    note: 'Dit combineert met *می‌شود* (gebeurt) en betekent dan "het begint": hetzelfde patroon met een hulpwerkwoord dat in deze cursus al eerder voorkwam.'
    example_gloss: Het concert begint om acht uur 's avonds.
  prs.a1.unit54.lesson02.teach.singer_name_word:
    title: Sima
    gloss: Sima
    note: Sima is een veelvoorkomende Afghaanse voornaam. Hier is zij de zangeres van het concert.
    example_gloss: Sima is zangeres.
  prs.a1.unit54.lesson02.teach.concert_poster_reading:
    title: De concertposter lezen
    gloss: Sima is zangeres. Het concert begint om acht uur 's avonds. Het kaartje kost 30 afghani.
  prs.a1.unit54.lesson02.teach.review_when_word:
    title: 'Herhaling: wanneer'
    gloss: wanneer
    note: Dit is een herhalingswoord waarmee je vraagt wanneer het concert begint.
    target_text: کی (wanneer)
  prs.a1.unit54.lesson02.teach.ask_start_time_phrase:
    title: Wanneer begint het concert?
    gloss: Wanneer begint het concert?
    note: Hier komen de woorden samen die je eerder in deze les hebt geleerd.
  prs.a1.unit54.lesson02.teach.answer_start_time_phrase:
    title: Het concert begint om acht uur 's avonds
    gloss: Het concert begint om acht uur 's avonds.
    note: Hiermee geef je de begintijd van het concert van de poster.
  prs.a1.unit54.lesson03.teach.review_propose_words:
    title: 'Herhaling: wilt u, vrijdag, laten we gaan'
    gloss: wilt u / vrijdag / laten we gaan
    note: Dit zijn herhalingswoorden om een plan voor te stellen, in hetzelfde zinspatroon dat deze cursus al gebruikte om een uitstapje naar het park voor te stellen.
    target_text: می‌خواهین (wilt u, beleefd) / جمعه (vrijdag) / برویم (laten we gaan)
  prs.a1.unit54.lesson03.teach.review_concert_word:
    title: 'Herhaling: concert'
    gloss: concert
    note: Dit is een herhalingswoord waarmee je voorstelt naar het concert te gaan.
    target_text: کنسرت (concert)
  prs.a1.unit54.lesson03.teach.propose_concert_phrase:
    title: Wilt u vrijdag naar het concert gaan?
    gloss: Wilt u vrijdag naar het concert gaan?
    note: Hier wordt het patroon om een plan voor te stellen, dat in deze cursus al is geleerd, op het concert toegepast.
  prs.a1.unit54.lesson03.teach.review_accept_words:
    title: 'Herhaling: ja, geweldig, afgesproken'
    gloss: ja / geweldig / afgesproken
    note: Dit zijn herhalingswoorden om een plan te accepteren.
    target_text: بلی (ja) / عالی (geweldig) / قبول (akkoord)
  prs.a1.unit54.lesson03.teach.accept_plan_phrase:
    title: Ja, geweldig! Afgesproken.
    gloss: Ja, geweldig! Afgesproken.
    note: Hiermee accepteer je het voorgestelde concertplan.
