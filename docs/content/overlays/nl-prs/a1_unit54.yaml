    note: Dit zijn herhalingswoorden om de begintijd van het concert te noemen.
    target_text: بفرمایین (alstublieft) / کنسرت (concert) / سیما (Sima) / ساعت (uur) / هشت (acht) / شب (avond) / شروع می‌شود (begint)
  prs.a1.unit54.lesson04.teach.review_ask_price:
    title: 'Herhaling: hoeveel, afghani, is'
    gloss: hoeveel / afghani / is
    note: Dit zijn herhalingswoorden om naar de prijs van het kaartje te vragen en die te noemen.
    target_text: چند (hoeveel) / افغانی (afghani) / است (is)
  prs.a1.unit54.lesson04.teach.review_thanks_welcome:
