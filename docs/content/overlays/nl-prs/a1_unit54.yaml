course:
  title: Dari in het Nederlands A1
  description: 'Dari van Kabul voor beginners: plannen maken om naar een concert te gaan, een concertaffiche lezen, een kaartje kopen, vragen hoe laat het begint en er na afloop eenvoudig over praten.'
units:
