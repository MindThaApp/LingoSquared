course:
  title: Dari in het Nederlands A1
  description: 'Dari voor beginners (Kabul): woordenschat over hobby''s en vrije tijd (lezen, naar muziek luisteren, films kijken, wandelen, koken), vragen wat iemand in zijn vrije tijd graag doet met دوست دارین, frequentie met هر هفته/آخر هفته, en een dialoog tussen Zarmina en Homayoun waarin ze vergelijken hoe ze hun vrije tijd besteden.'
