course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor lager gevorderden: eenvoudige adviezen geven en beantwoorden over gezondheid, studie en geld met de aanvoegende wijs (subjunctief). Zachte adviezen met بهتر است که, stellige adviezen met باید en نباید, beleefde suggesties met پیشنهاد می‌کنم که, vragen wat je moet doen, en adviezen accepteren, betwijfelen of afslaan.'
units:
  prs.a2.unit32.giving_advice:
    title: Advies geven
lessons:
  prs.a2.unit32.lesson01.better_to_go:
    title: Je kunt beter naar de dokter gaan
  prs.a2.unit32.lesson02.must_and_must_not:
    title: Moeten en niet mogen
  prs.a2.unit32.lesson03.i_suggest:
    title: Ik stel voor dat
  prs.a2.unit32.lesson04.ask_and_answer:
    title: Om advies vragen en erop antwoorden
  prs.a2.unit32.lesson05.reading_and_listening:
    title: Lezen en luisteren over gezondheid
  prs.a2.unit32.lesson06.money_conversation:
    title: Een gesprek over geld
teaching:
  prs.a2.unit32.lesson01.teach.doctor:
    title: Dokter
    gloss: dokter
    note: '*داکتر* is het Afghaanse woord voor dokter. Om naar de dokter te gaan zeg je *به داکتر رفتن*: *به داکتر می‌روم* betekent ik ga naar de dokter.'
    example_gloss: De dokter is vandaag op kantoor.
  prs.a2.unit32.lesson01.teach.medicine:
    title: Medicijn
    gloss: medicijn
    note: '*دوا* is medicijn. In het Dari drink of neem je het niet, je eet het: *دوا خوردن*. *دوا را می‌خورم* betekent ik neem het medicijn in.'
    example_gloss: Ik neem het medicijn na het eten.
  prs.a2.unit32.lesson01.teach.sick:
    title: Ziek
    gloss: ziek
    note: '*مریض* betekent ziek. *مریض استم* is ik ben ziek en *او مریض است* is hij of zij is ziek.'
    example_gloss: Mijn broer is ziek.
  prs.a2.unit32.lesson01.teach.rest:
    title: Uitrusten
    gloss: uitrusten
    note: '*استراحت کردن* is rusten. Het is een werkwoord van twee woorden: *استراحت* blijft vooraan staan en alleen *کردن* verandert, zoals in *استراحت می‌کنم* (ik rust).'
    example_gloss: Na het werk rust ik.
  prs.a2.unit32.lesson01.teach.sleep:
    title: Slapen
    gloss: slapen, naar bed gaan
    note: '*خوابیدن* is slapen of naar bed gaan. *شب‌ها* is ''s avonds, ''s nachts: *شب‌ها زود می‌خوابم* is ''s avonds ga ik vroeg naar bed. *دیر خوابیدن* is laat naar bed gaan.'
    example_gloss: Vroeg naar bed gaan is belangrijk.
  prs.a2.unit32.lesson01.teach.head:
    title: Ik heb hoofdpijn
    gloss: Mijn hoofd doet pijn.
    note: 'Om te zeggen dat een lichaamsdeel pijn doet, zet je *-م* achter het lichaamsdeel en voeg je *درد می‌کند* toe: *سرم درد می‌کند* (ik heb hoofdpijn). Dit is het gebruikelijke probleem waarbij een vriend je advies geeft.'
  prs.a2.unit32.lesson01.teach.stem:
    title: 'Advies gebruikt de aanvoegende wijs: bevel plus ی'
    gloss: 'ga: dat jij gaat; eet: dat jij eet; slaap: dat jij slaapt; rust: dat jij rust'
    note: 'Om advies te geven gebruik je een werkwoordsvorm die de aanvoegende wijs (subjunctief) heet. Voor een vriend (*تو*) is het eenvoudig: neem het bevel dat je een vriend geeft en voeg *ی* toe. *برو* (ga) wordt *بروی*, *بخور* (eet) wordt *بخوری*, *بخواب* (slaap) wordt *بخوابی*, *استراحت کن* (rust) wordt *استراحت کنی*. Bij de meeste werkwoorden begint het bevel met *ب-*; werkwoorden met *کردن* hebben geen *ب-* (*کن*, niet *بکن*, in deze unit).'
  prs.a2.unit32.lesson01.teach.paradigm:
    title: 'De aanvoegende wijs van رفتن: alle zes personen'
    gloss: dat ik ga, dat jij gaat (vriend), dat hij/zij gaat, dat wij gaan, dat u gaat (formeel) of dat jullie gaan, dat zij gaan
    note: 'De bevelsstam *برو* krijgt deze uitgangen: *بروم* (ik), *بروی* (jij, tegen een vriend), *برود* (hij of zij), *برویم* (wij), *بروین* (u, formeel, of jullie), *بروند* (zij). De uitgangen zijn *-م، -ی، -د، -یم، -ین، -ند*. In deze unit wordt de uitgang van de 2e persoon meervoud als *-ین* geschreven, net als in de rest van de cursus. De aanvoegende wijs zegt niet wanneer: het advies of het hoofdwerkwoord eromheen geeft de betekenis.'
  prs.a2.unit32.lesson01.teach.better:
    title: Advies geven met بهتر است که
    gloss: Je kunt beter naar de dokter gaan.
    note: '*بهتر است* (het is beter) plus *که* plus de aanvoegende wijs is de zachte, vriendelijke manier om advies te geven: *بهتر است که به داکتر بروی* betekent je kunt beter naar de dokter gaan. Het woord *که* kan wegblijven: *بهتر است به داکتر بروی* betekent hetzelfde. In deze unit staat altijd de volledige vorm *است*; in het geschreven Dari van de cursus is er geen kortere vorm. Wie iets moet doen, blijkt alleen uit de uitgang van de aanvoegende wijs: *بروی* is jij.'
  prs.a2.unit32.lesson01.teach.better_more:
    title: Meer advies voor een zieke vriend
    gloss: Je kunt beter het medicijn innemen. Je kunt beter naar bed gaan. Je kunt beter gaan rusten.
    note: 'Hetzelfde patroon met andere werkwoorden: *دوا بخوری* (dat je het medicijn inneemt), *بخوابی* (dat je naar bed gaat), *استراحت کنی* (dat je rust). Alleen het werkwoord aan het einde verandert; *بهتر است که* blijft hetzelfde.'
  prs.a2.unit32.lesson01.teach.neg:
    title: 'De ontkenning: ن in plaats van ب'
    gloss: Je kunt beter niet gaan. Je kunt beter niet laat naar bed gaan.
    note: 'Om te zeggen wat een vriend niet moet doen, zet je *ن-* in plaats van *ب-*: *بروی* wordt *نروی*, *بخوری* wordt *نخوری*, *بخوابی* wordt *نخوابی*. Bij werkwoorden met *کردن* is de ontkenning *نکنی*. Dus *بهتر است که دیر نخوابی* betekent je kunt beter niet laat naar bed gaan.'
  prs.a2.unit32.lesson01.teach.formal:
    title: 'Advies aan iemand die je respecteert: ین'
    gloss: U kunt beter naar de dokter gaan. (formeel of meervoud)
    note: 'Tegen iemand die je respecteert, een oudere, een vreemde, of tegen meerdere mensen, gebruik je *شما* en de uitgang *-ین*: *بروین، بخورین، بخوابین، کنین*. *بهتر است که شما به داکتر بروین* betekent u kunt beter naar de dokter gaan. Tegen een vriend gebruik je *بروی*.'
  prs.a2.unit32.lesson01.teach.water:
    title: Drink veel water
    gloss: Je kunt beter veel water drinken.
    note: 'In het Dari eet je water net als medicijn: *آب خوردن* is water drinken. *آب زیاد* is veel water. Een heel gebruikelijk advies voor een zieke vriend.'
  prs.a2.unit32.lesson02.teach.lesson:
    title: Les, studie
    gloss: les, schoolwerk
    note: '*درس* is een les of schoolwerk. *درس خواندن* betekent studeren (letterlijk: een les lezen): *درس می‌خوانم* is ik studeer.'
    example_gloss: Elke dag studeer ik.
  prs.a2.unit32.lesson02.teach.exam:
    title: Examen
    gloss: examen, toets
    note: '*امتحان* is een examen of een toets. Studieadvies gaat heel vaak over een *امتحان* die eraan komt.'
    example_gloss: Mijn examen is morgen.
  prs.a2.unit32.lesson02.teach.book:
    title: Boek
    gloss: boek
    note: '*کتاب* is een boek. Voeg *-م* toe voor ''mijn'': *کتابم*. Het meervoud schrijf je als *کتاب‌ها*.'
    example_gloss: Mijn boek ligt op school.
  prs.a2.unit32.lesson02.teach.review:
    title: Herhalen, doornemen
    gloss: herhalen, nog eens doornemen
    note: '*تکرار کردن* is herhalen of iets nog eens doornemen. Het is het gebruikelijke advies vóór een examen: *درس را تکرار کن*.'
    example_gloss: Elke avond herhaal ik de les.
  prs.a2.unit32.lesson02.teach.early:
    title: Vroeg, snel
    gloss: vroeg, binnenkort
    note: '*زود* betekent vroeg of binnenkort. *زود خوابیدن* is vroeg naar bed gaan en *صبح زود* is ''s ochtends vroeg.'
    example_gloss: '''s Ochtends vroeg ga ik naar school.'
  prs.a2.unit32.lesson02.teach.late:
    title: Laat
    gloss: laat
    note: '*دیر* betekent laat; het is het tegenovergestelde van *زود*. *دیر خوابیدن* is laat naar bed gaan.'
    example_gloss: Vandaag kwam hij/zij te laat.
  prs.a2.unit32.lesson02.teach.must:
    title: 'باید plus de conjunctief: moeten'
    gloss: Je moet elke dag studeren.
    note: 'Na *باید* (moeten) volgt ook de conjunctief: *باید هر روز درس بخوانی* is je moet elke dag studeren. *باید* verandert nooit; de uitgang van de conjunctief laat zien wie het doet. *باید* is sterker dan *بهتر است که*: het is een plicht of een duidelijke noodzaak. De woordvolgorde is vrij: *هر روز باید درس بخوانی* is ook juist.'
  prs.a2.unit32.lesson02.teach.must_paradigm:
    title: باید met alle zes de personen
    gloss: ik moet gaan, jij moet gaan, hij/zij moet gaan, wij moeten gaan, u moet gaan / jullie moeten gaan, zij moeten gaan
    note: 'Alleen de uitgang van de conjunctief verandert: *باید بروم* (ik moet gaan), *باید بروی* (jij moet gaan), *باید برود* (hij of zij moet gaan), *باید برویم* (wij moeten gaan), *باید بروین* (u moet gaan, of jullie moeten gaan), *باید بروند* (zij moeten gaan).'
  prs.a2.unit32.lesson02.teach.must_not:
    title: 'نباید: niet mogen'
    gloss: Je mag niet laat naar bed gaan.
    note: '*نباید* (niet mogen) is *باید* met *ن-* ervoor. Het werkwoord erna blijft bevestigend: *نباید دیر بخوابی* is je mag niet laat naar bed gaan. Voeg geen tweede *ن-* toe: het is *نباید بخوابی*, niet *نباید نخوابی*.'
  prs.a2.unit32.lesson02.teach.soft_strong:
    title: Zacht advies en sterk advies
    gloss: Het is beter dat je vroeg naar bed gaat. Je moet vroeg naar bed gaan.
    note: Beide zinnen geven hetzelfde advies, maar met een verschillende sterkte. *بهتر است که زود بخوابی* is vriendelijk en zacht, zoals 'het zou beter zijn als'. *باید زود بخوابی* is stellig, zoals 'je moet echt'. Gebruik *بهتر است که* bij een vriend als je alleen advies geeft, en *باید* als het belangrijk is, bijvoorbeeld vóór een examen.
  prs.a2.unit32.lesson02.teach.review_adv:
    title: Advies vóór een examen
    gloss: Het is beter dat je de les herhaalt.
    note: 'Waar je aan werkt, staat vóór het werkwoord met *را*: *درس را تکرار کنی* (dat je de les herhaalt). Het is een goed studieadvies.'
  prs.a2.unit32.lesson03.teach.money:
    title: Geld
    gloss: geld
    note: '*پول* is geld. *پولم* is mijn geld. *پولم کم است* is ik heb weinig geld.'
    example_gloss: Ik heb weinig geld.
  prs.a2.unit32.lesson03.teach.spend:
    title: Uitgeven
    gloss: uitgeven
    note: '*خرج کردن* is geld uitgeven. Het geld staat vóór het werkwoord: *پول خرج کردن*. *زیاد خرج کردن* is veel uitgeven.'
    example_gloss: Elke maand geeft hij/zij veel geld uit.
  prs.a2.unit32.lesson03.teach.save:
    title: Sparen
    gloss: sparen (geld)
    note: '*پس‌انداز کردن* is geld sparen. Net als *خرج کردن* is het een werkwoord van twee woorden. *پس‌انداز* schrijf je met een kleine tussenruimte tussen *پس* en *انداز*.'
    example_gloss: Elke maand spaar ik een beetje geld.
  prs.a2.unit32.lesson03.teach.expensive:
    title: Duur
    gloss: duur
    note: '*گران* betekent duur. Het tegenovergestelde is *ارزان* (goedkoop).'
    example_gloss: Deze auto is duur.
  prs.a2.unit32.lesson03.teach.cheap:
    title: Goedkoop
    gloss: goedkoop
    note: '*ارزان* betekent goedkoop. Het tegenovergestelde is *گران*.'
    example_gloss: Dit boek is goedkoop.
  prs.a2.unit32.lesson03.teach.month:
    title: Maand
    gloss: maand
    note: '*ماه* is een maand. *هر ماه* is elke maand. Het is een handig woord als je over geld praat, want veel mensen ontvangen en besteden elke maand geld.'
    example_gloss: Elke maand ga ik naar de bank.
  prs.a2.unit32.lesson03.teach.suggest:
    title: پیشنهاد می‌کنم که plus de conjunctief
    gloss: Ik stel voor dat je elke maand geld spaart.
    note: '*پیشنهاد می‌کنم* betekent ik stel voor, en *که* plus de conjunctief zegt wat je voorstelt: *پیشنهاد می‌کنم که هر ماه پول پس‌انداز کنی* is ik stel voor dat je elke maand geld spaart. Het werkwoord *می‌کنم* heeft *می‌* en de uitgang *-م* (ik). Het werkwoord na *که* is weer de conjunctief: *پس‌انداز کنی*. Om samen iets voor te stellen, zeg je *پیشنهاد می‌کنیم که* (wij stellen voor dat).'
  prs.a2.unit32.lesson03.teach.three:
    title: Drie manieren om hetzelfde advies te geven
    gloss: Het is beter dat je geld spaart. Je moet geld sparen. Ik stel voor dat je geld spaart.
    note: 'Je kent nu drie patronen die allemaal de conjunctief gebruiken. *بهتر است که* is de vriendelijke, zachte vorm. *باید* is stellig. *پیشنهاد می‌کنم که* is beleefd en duidelijk: het klinkt als een voorstel van iemand die je respecteert, en je gebruikt het als je niet dicht bij de ander staat.'
  prs.a2.unit32.lesson03.teach.we_suggest:
    title: Wij stellen voor
    gloss: Wij stellen voor dat je vroeg naar bed gaat.
    note: 'Voor ''wij'' wordt de uitgang van *می‌کنم* nu *-یم*: *پیشنهاد می‌کنیم* is wij stellen voor. Gebruik het als je namens een groep spreekt, bijvoorbeeld een gezin of een team.'
  prs.a2.unit32.lesson03.teach.suggest_neg:
    title: Voorstellen wat je niet moet doen
    gloss: Ik stel voor dat je niet veel geld uitgeeft.
    note: 'Na *پیشنهاد می‌کنم که* gebruik je de ontkennende conjunctief voor wat je niet moet doen: *نکنی* van *کردن*, *نخری* van *خریدن*. Het deel *می‌کنم* blijft bevestigend: jij stelt voor, en wat je voorstelt is ontkennend.'
  prs.a2.unit32.lesson03.teach.expensive_things:
    title: Koop geen dure dingen
    gloss: Ik stel voor dat je geen dure dingen koopt.
    note: '*چیزهای گران* zijn dure dingen: het meervoud van *چیز* is *چیزها*, en een verbindend *-ی* koppelt het aan het bijvoeglijk naamwoord dat volgt. *نخری* is de ontkenning van *بخری* (dat je koopt), van *خریدن*.'
  prs.a2.unit32.lesson04.teach.what_do:
    title: Wat moet ik doen?
    gloss: Wat moet ik doen?
    note: 'Om advies te vragen gebruik je ook de conjunctief: *چه کار کنم؟* is wat moet ik doen? (niet: wat doe ik?). Het meervoud is *چه کار کنیم؟* (wat moeten we doen?). Noem eerst het probleem en vraag dan: *سرم درد می‌کند. چه کار کنم؟*'
  prs.a2.unit32.lesson04.teach.your_view:
    title: Tegen iemand die je respecteert
    gloss: Wat moet ik volgens jou doen?
    note: '*به نظر شما* is volgens u. Bij een oudere of een vreemde is dit de beleefde manier om advies te vragen: *به نظر شما چه کار کنم؟*. Dan kan de ander antwoorden met *بهتر است که* of *پیشنهاد می‌کنم که*.'
  prs.a2.unit32.lesson04.teach.what_suggest:
    title: Wat stelt u voor?
    gloss: Wat stelt u voor?
    note: '*شما چه پیشنهاد می‌کنین؟* vraagt aan iemand die je respecteert wat die voorstelt. Het gebruikt de uitgang *-ین* bij *شما*. Tegen een vriend zeg je *تو چه پیشنهاد می‌کنی؟*.'
  prs.a2.unit32.lesson04.teach.accept:
    title: Het advies aannemen
    gloss: Dat is een goed idee. Ik doe precies dat.
    note: '*فکر خوبی است* is dat is een goed idee. *همین کار را می‌کنم* is ik doe precies dat. Met de tegenwoordige tijd *می‌کنم* zeg je ook wat je besluit te gaan doen. Gebruik deze twee zinnen als je het advies wilt opvolgen.'
  prs.a2.unit32.lesson04.teach.thanks:
    title: Bedanken voor het advies
    gloss: Bedankt voor je suggestie.
    note: '*از پیشنهادت ممنون* is bedankt voor je advies. *پیشنهادت* is *پیشنهاد* met *-ت*, ''jouw''. Het is een vriendelijke manier om het gesprek na een advies af te sluiten.'
  prs.a2.unit32.lesson04.teach.decline:
    title: Zeggen dat je het niet kunt
    gloss: Ik kan het niet, want ik heb geen tijd.
    note: 'Als je het advies niet kunt opvolgen, zeg je dat met de reden: *نمی‌توانم، چون وقت ندارم* is ik kan het niet, want ik heb geen tijd. *می‌توانم* is ik kan, en *نمی‌توانم* is ik kan niet. De reden komt na *چون*.'
  prs.a2.unit32.lesson04.teach.maybe:
    title: Zachter advies met شاید en de conjunctief van بودن
    gloss: Misschien is het beter dat je rust neemt. Misschien klopt dat.
    note: 'Na *شاید* (misschien) volgt de conjunctief. De conjunctief van *بودن* is *باشم، باشی، باشد، باشیم، باشین، باشند*. Dus *شاید بهتر باشد که استراحت کنی* is misschien is het beter dat je rust neemt: een heel zacht advies. Je kunt ook reageren met *شاید درست باشد* (misschien klopt dat) als je nog niet zeker bent. *ممکن است درست باشد* (het kan kloppen) betekent bijna hetzelfde.'
  prs.a2.unit32.lesson04.teach.agree:
    title: Het eens zijn
    gloss: Dat klopt. Ik doe precies dat.
    note: '*درست است* is dat klopt. Na een advies betekent het dat je het eens bent. Samen met *همین کار را می‌کنم* is het een duidelijk ja.'
  prs.a2.unit32.lesson05.teach.three:
    title: Drie
    gloss: drie
    note: '*سه* is drie. *سه روز* is drie dagen. Een dokter zegt vaak hoeveel dagen je moet rusten.'
    example_gloss: Ik was drie dagen in Kabul.
  prs.a2.unit32.lesson05.teach.said:
    title: Hij of zij zei
    gloss: hij/zij zei
    note: '*گفت* is de verleden tijd van *گفتن* (zeggen) voor hij of zij. Na *گفت* volgt een korte zin, zoals in *داکتر گفت: ...* (de dokter zei: ...).'
    example_gloss: 'Hij zei: ik kom morgen.'
  prs.a2.unit32.lesson05.teach.please_wait:
    title: Wachten, geduld hebben
    gloss: wachten, geduld hebben
    note: '*صبر کردن* is wachten of geduld hebben. *نباید صبر کنی* is je moet niet wachten, dus doe het meteen.'
    example_gloss: Wacht even.
  prs.a2.unit32.lesson05.teach.dlg1_turn01:
    title: Jamila zegt wat er aan de hand is
    gloss: Zakaria, ik heb hoofdpijn en 's nachts slaap ik slecht. Wat moet ik doen?
    note: Jamila beschrijft het probleem met *سرم درد می‌کند* en *خوب نمی‌خوابم* (ik slaap niet goed) en vraagt dan om advies met *چه کار کنم؟*.
  prs.a2.unit32.lesson05.teach.dlg1_turn02:
    title: Zakaria geeft twee adviezen
    gloss: Het is beter dat je naar de dokter gaat. Je moet veel water drinken.
    note: Zakaria gebruikt eerst het zachte *بهتر است که به داکتر بروی* en daarna het stellige *باید آب زیاد بخوری*. Hij praat tegen een vriend, dus de uitgang is *-ی*.
  prs.a2.unit32.lesson05.teach.dlg1_turn03:
    title: Jamila neemt het aan en plant voor morgen
    gloss: Dat is een goed idee. Morgen ga ik naar de dokter.
    note: 'Jamila gaat akkoord met *فکر خوبی است*. Ze plant om morgen te gaan: *فردا به داکتر می‌روم*, de tegenwoordige tijd met een tijdswoord.'
  prs.a2.unit32.lesson05.teach.dlg1_turn04:
    title: Zakaria zegt dat ze vandaag moet gaan
    gloss: Ik stel voor dat je vandaag gaat. Je moet niet wachten.
    note: 'Zakaria zegt dat het dringend is: *پیشنهاد می‌کنم که امروز بروی*, en met *نباید صبر کنی* voegt hij toe: wacht niet. Merk op dat hij *به داکتر* niet herhaalt, omdat het duidelijk is.'
  prs.a2.unit32.lesson05.teach.dlg1_turn05:
    title: Jamila stemt in
    gloss: Goed, ik ga vandaag. Bedankt.
    note: 'Jamila past haar plan aan naar vandaag: *امروز می‌روم*. Ze sluit beleefd af met *ممنون*.'
  prs.a2.unit32.lesson05.teach.message:
    title: Een bericht na het bezoek aan de dokter
    gloss: 'Hallo Zakaria. Bedankt voor je advies. Vandaag ben ik naar de dokter geweest. De dokter zei: het is beter dat je drie dagen rust neemt, en je moet medicijnen slikken. Je mag ''s avonds niet laat naar bed gaan. Morgen ga ik niet naar school.'
    note: 'Jamila schrijft het volgende bericht. De dokter gaf advies met dezelfde drie patronen: *بهتر است که* (drie dagen rust), *باید* (medicijnen slikken) en *نباید* (niet laat naar bed gaan). Het advies wordt na *گفت:* in dezelfde vorm aangehaald.'
  prs.a2.unit32.lesson06.teach.start:
    title: Beginnen
    gloss: beginnen, starten
    note: '*شروع کردن* is beginnen. *از امروز شروع می‌کنم* is ik begin vanaf vandaag, een belofte nadat je een advies hebt aangenomen.'
    example_gloss: Ik begin morgen.
  prs.a2.unit32.lesson06.teach.only:
    title: Alleen, slechts
    gloss: alleen, maar
    note: '*فقط* betekent alleen of slechts. *فقط چیزهای مهم* is alleen de belangrijke dingen.'
    example_gloss: Ik heb maar één boek.
  prs.a2.unit32.lesson06.teach.dlg2_turn01:
    title: Zakaria vertelt wat er mis is
    gloss: Jamila, ik heb weinig geld en ik geef elke maand veel uit. Wat moet ik doen?
    note: 'Zakaria noemt het probleem in twee delen: *پولم کم است* en *هر ماه زیاد خرج می‌کنم*. Daarna vraagt hij om advies: *چه کار کنم؟*.'
  prs.a2.unit32.lesson06.teach.dlg2_turn02:
    title: Jamila stelt voor om te sparen
    gloss: Ik raad je aan om elke maand een beetje geld te sparen.
    note: Jamila gebruikt het beleefde patroon *پیشنهاد می‌کنم که* plus de subjunctief *پس‌انداز کنی*. *کمی* betekent een beetje.
  prs.a2.unit32.lesson06.teach.dlg2_turn03:
    title: Zakaria zegt dat hij het niet kan
    gloss: Dat is een goed idee, maar ik kan het niet. Alles is duur.
    note: 'Zakaria zegt dat het een goed idee is, maar geeft een reden waarom hij het niet kan opvolgen: *همه چیز گران است* (alles is duur).'
  prs.a2.unit32.lesson06.teach.dlg2_turn04:
    title: Jamila adviseert wat hij niet moet kopen
    gloss: Dan moet je geen dure dingen kopen. Het is beter om alleen belangrijke dingen te kopen.
    note: 'Jamila past haar advies aan: *نباید چیزهای گران بخری* (een strikte regel) en *بهتر است که فقط چیزهای مهم بخری* (een zachte suggestie).'
  prs.a2.unit32.lesson06.teach.dlg2_turn05:
    title: Zakaria stemt in en begint
    gloss: Dat klopt. Ik begin vandaag. Bedankt.
    note: 'Zakaria stemt in met *درست است* en belooft: *از امروز شروع می‌کنم*.'
