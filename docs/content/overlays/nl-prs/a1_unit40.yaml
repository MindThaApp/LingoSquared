  prs.a1.unit40.lesson06.wrap_up:
    title: Afsluiting
teaching:
  prs.a1.unit40.lesson01.teach.review_help_want:
    title: 'Herhaling: hulp, ik wil'
    gloss: hulp / ik wil
    note: کمک en می‌خواهم zijn herhalingswoorden die je in deze unit gebruikt om aan te geven welke hulp je nodig hebt.
    target_text: کمک (hulp) / می‌خواهم (ik wil)
  prs.a1.unit40.lesson01.teach.review_this_is:
    title: 'Herhaling: dit, is'
    gloss: dit / is
    note: این en است zijn vroege herhalingswoorden die je gebruikt om te zeggen wat voor situatie dit is.
    target_text: این (dit) / است (is)
  prs.a1.unit40.lesson01.teach.emergency_word:
    title: Noodsituatie
    gloss: noodsituatie
    note: اضطراری betekent noodsituatie of spoedeisend.
    example_gloss: Dit is een noodgeval.
  prs.a1.unit40.lesson01.teach.police_word:
    title: Politie
    gloss: politie
    note: پولیس is het gewone Afghaanse Dari-woord voor politie, net als in het Nederlands een leenwoord uit het Engels.
    example_gloss: Ik heb de politie nodig.
  prs.a1.unit40.lesson01.teach.ambulance_word:
    title: Ambulance
    gloss: ambulance
    note: امبولانس betekent ambulance.
    example_gloss: Ik heb een ambulance nodig.
  prs.a1.unit40.lesson01.teach.fire_word:
    title: Brand
    gloss: brand
    note: آتش betekent vuur of brand.
    example_gloss: Er is brand.
  prs.a1.unit40.lesson01.teach.fire_brigade_word:
    title: Brandweer
    gloss: brandweer
    note: اطفائیه is de alledaagse term in Kabul voor de brandweer.
    example_gloss: Ik heb de brandweer nodig.
  prs.a1.unit40.lesson01.teach.emergency_help_phrase:
    title: Dit is een noodgeval! Ik heb de politie nodig!
    gloss: Dit is een noodgeval! Ik heb de politie nodig!
    note: این اضطراری است combineert این (dit) met اضطراری (noodgeval) en است (is).
  prs.a1.unit40.lesson02.teach.review_can_you_do:
    title: 'Herhaling: kunt u, doe (beleefde gebiedende wijs), naar/voor, snel'
    gloss: kunt u / doe / naar/voor / snel
    note: می‌توانین, کنین, به en زود (uit eerdere units) combineer je met andere woorden tot beleefde verzoeken en opdrachten.
    target_text: می‌توانین (kunt u) / کنین (doe -- beleefde gebiedende wijs) / به (naar/voor) / زود (snel)
  prs.a1.unit40.lesson02.teach.mera_word:
    title: Mij
    gloss: mij
    note: 'مه ره is gesproken Kabuli-Dari voor مرا ("mij" als lijdend voorwerp): مه is de gesproken vorm van من en ره is de gesproken vorm van het lijdend-voorwerpmerkteken را. In geschreven tekst zie je meestal مرا; dat wordt ook geaccepteerd.'
    example_gloss: Kun je me helpen?
  prs.a1.unit40.lesson02.teach.can_you_help_me_phrase:
    title: Kunt u mij helpen?
    gloss: Kunt u mij helpen?
    note: Een echte, veelgebruikte Dari-zin om rechtstreeks om hulp te vragen.
  prs.a1.unit40.lesson02.teach.call_word:
    title: Bel! (gebiedende wijs)
    gloss: bel
    note: زنگ بزنین is de beleefde gebiedende wijs van زنگ زدن (bellen) en bouwt voort op het eerder geleerde زنگ می‌زنم (ik bel).
    example_gloss: Bel de politie!
  prs.a1.unit40.lesson02.teach.come_word:
    title: Kom! (gebiedende wijs)
    gloss: kom
    note: بیایین is de beleefde gebiedende wijs van آمدن (komen).
    example_gloss: Kom snel!
  prs.a1.unit40.lesson02.teach.call_ambulance_phrase:
    title: Bel de ambulance!
    gloss: Bel de ambulance!
    note: به (naar/voor) plus امبولانس (ambulance) plus de gebiedende wijs زنگ بزنین.
  prs.a1.unit40.lesson03.teach.review_he_she_has:
    title: 'Herhaling: hij/zij, hij/zij heeft'
    gloss: hij/zij / hij/zij heeft
    note: او en دارد zijn herhalingsvormen die je gebruikt om de toestand van iemand anders in een noodsituatie te beschrijven.
    target_text: او (hij/zij) / دارد (hij/zij heeft)
  prs.a1.unit40.lesson03.teach.injured_word:
    title: Gewond
    gloss: gewond
    note: زخمی betekent gewond.
    example_gloss: Hij/zij is gewond.
  prs.a1.unit40.lesson03.teach.bleeding_word:
    title: Bloeden
    gloss: bloeding
    note: خون‌ریزی betekent bloeding of bloeden.
    example_gloss: Hij/zij bloedt.
  prs.a1.unit40.lesson03.teach.injured_ambulance_phrase:
    title: Hij/zij is gewond! Ik heb een ambulance nodig!
    gloss: Hij/zij is gewond! Ik heb een ambulance nodig!
    note: Combineert زخمی met het eerder geleerde امبولانس می‌خواهم.
  prs.a1.unit40.lesson03.teach.bleeding_come_quickly_phrase:
    title: Hij/zij bloedt! Kom snel!
    gloss: Hij/zij bloedt! Kom snel!
    note: Combineert خون‌ریزی met het eerder geleerde زود بیایین.
  prs.a1.unit40.lesson04.teach.review_dialogue_words:
    title: 'Herhaling: wat, hij/zij komt, ik bel, hartelijk dank'
    gloss: wat / hij/zij komt / ik bel / hartelijk dank
    note: چه, می‌آید, زنگ می‌زنم en تشکر زیاد zijn herhalingswoorden die je in de noodsituatiedialoog tegenkomt.
    target_text: چه (wat) / می‌آید (hij/zij komt) / زنگ می‌زنم (ik bel) / تشکر زیاد (hartelijk dank)
  prs.a1.unit40.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, help! Help!'
    gloss: Zarmina, help! Help!
  prs.a1.unit40.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Wat?'
    gloss: Wat?
  prs.a1.unit40.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Hij/zij is gewond! Hij/zij bloedt!'
    gloss: Hij/zij is gewond! Hij/zij bloedt!
  prs.a1.unit40.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Ik heb een ambulance nodig. Ik bel!'
    gloss: Ik heb een ambulance nodig. Ik bel!
  prs.a1.unit40.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Hartelijk dank!'
    gloss: Heel erg bedankt!
  prs.a1.unit40.lesson04.teach.dialogue_line6:
    title: 'Zarmina: De ambulance komt snel.'
    gloss: De ambulance komt snel.
  prs.a1.unit40.lesson05.teach.review_reading_words:
    title: 'Herhaling: een, persoon, stad, hij/zij doet, in'
    gloss: een / persoon / stad / hij/zij doet / in
    note: یک, نفر, شهر, می‌کند en در zijn herhalingswoorden die in deze leestekst voorkomen.
    target_text: یک (één) / نفر (persoon) / شهر (stad) / می‌کند (hij/zij doet) / در (in/op)
  prs.a1.unit40.lesson05.teach.reading_passage:
    title: Lezen over een noodsituatie
    gloss: In de stad is iemand gewond. Hij/zij bloedt. Homayoun helpt. Er komt een ambulance.
  prs.a1.unit40.lesson06.teach.review_wrap_up_words:
    title: 'Herhaling: telefoon, ik heb niet, maar, u (formeel)'
    gloss: telefoon / ik heb niet / maar / u (formeel)
    note: تلفن, ندارم, اما en شما zijn herhalingswoorden waarmee je een behoefte tegenover een beperking zet en een formele vraag stelt.
    target_text: تلفن (telefoon) / ندارم (ik heb niet) / اما (maar) / شما (u)
  prs.a1.unit40.lesson06.teach.contrast_phrase:
    title: Ik heb hulp nodig, maar ik heb geen telefoon
    gloss: Ik heb hulp nodig, maar ik heb geen telefoon.
    note: اما zet de behoefte aan hulp af tegen het niet hebben van een telefoon om die hulp te bellen.
