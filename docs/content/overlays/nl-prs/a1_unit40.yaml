course:
  title: Dari in het Nederlands A1
  description: 'Dari van Kabul voor beginners: een noodsituatie herkennen, om hulp vragen, aangeven of je de politie, een ambulance of de brandweer nodig hebt, een verwonding beschrijven en een korte tekst over een noodgeval lezen.'
units:
  prs.a1.unit40.emergencies:
    title: Noodgevallen
    description: Herken een basale noodsituatie, vraag om hulp en geef aan welke hulp je nodig hebt (politie, ambulance of brandweer).
lessons:
  prs.a1.unit40.lesson01.emergency_types:
    title: Noodhulp
  prs.a1.unit40.lesson02.asking_for_help:
