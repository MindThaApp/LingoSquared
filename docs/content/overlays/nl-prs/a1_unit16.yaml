teaching:
  prs.a1.unit16.lesson01.teach.belit_word:
    title: Kaartje
    gloss: kaartje
    note: تکت betekent kaartje. Dit is het gewone Afghaanse Dari-woord; بلیط (ook gespeld بلیت, het Iraanse woord) wordt begrepen en geaccepteerd, maar تکت hoor je meestal.
    example_gloss: Ik heb een kaartje.
  prs.a1.unit16.lesson01.teach.qatar_word:
    title: Trein
    gloss: trein
    note: قطار betekent trein.
    example_gloss: De trein is goed.
  prs.a1.unit16.lesson01.teach.bas_word:
    title: Bus
    gloss: bus
    note: بس betekent bus, een gangbaar woord in het Afghaanse Dari.
    example_gloss: De bus is goed.
  prs.a1.unit16.lesson01.teach.maidan_hawayi_word:
    title: Vliegveld
    gloss: vliegveld
    note: میدان هوایی betekent vliegveld -- de vaste Afghaans-Dari term in deze cursus (niet het Iraanse فرودگاه), net als in Unit 5.
    example_gloss: Het vliegveld is goed.
  prs.a1.unit16.lesson01.teach.yak_word:
    title: Een
    gloss: een / één
    note: یک betekent één en wordt hier gebruikt als onbepaald lidwoord (een kaartje).
    target_text: یک (een)
  prs.a1.unit16.lesson01.teach.az_word:
    title: Van
    gloss: van
    note: از betekent van en geeft de herkomst aan (te onderscheiden van het andere gebruik als dan in vergelijkingen).
    target_text: از (van)
  prs.a1.unit16.lesson01.teach.doo_word:
    title: Twee
    gloss: twee
    note: دو betekent twee.
    example_gloss: Ik heb twee kaartjes.
  prs.a1.unit16.lesson01.teach.sekooye_word:
    title: Perron twee
    gloss: perron twee
    note: سکوی دو combineert سکو (perron) met de ezafe-verbinding -ی en دو (twee).
    target_text: سکوی دو (perron twee)
  prs.a1.unit16.lesson02.teach.herat_word:
    title: Herat
    gloss: Herat
    note: Een grote stad in het westen van Afghanistan.
