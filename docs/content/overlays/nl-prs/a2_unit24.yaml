    feedback: '*باران می‌بارید* betekent ''het regende'': *می‌* plus de verleden stam *بارید*.'
  prs.a2.unit24.lesson01.exercise02.recognize_we_were_walking:
    instruction: Wat betekent deze zin?
    correct_option: Wij liepen op straat
    distractors:
    - Ik liep op straat
    - Zij liepen op straat
    - Wij lopen op straat
    accepted_answers:
