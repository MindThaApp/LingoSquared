      status: correct
    feedback: 'De uitgang *-یم* in *می‌رفتیم* betekent ''wij'', en *می‌* laat zien dat het gaande was: *ما در سرک پیاده می‌رفتیم*.'
  prs.a2.unit24.lesson01.exercise03.recognize_it_was_snowing:
    instruction: Wat betekent deze zin?
    correct_option: Het sneeuwde
    distractors:
    - Het regende
    - Het sneeuwt nu
    - Het gaat morgen sneeuwen
    accepted_answers:
    - value: Het sneeuwde
      status: correct
    feedback: '*برف* is sneeuw, dus *برف می‌بارید* betekent ''het sneeuwde''.'
  prs.a2.unit24.lesson01.exercise04.match_forms_and_words:
    instruction: Koppel elk Dari-woord aan de betekenis.
    accepted_answers:
    - value:
