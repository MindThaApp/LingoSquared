course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor lager gevorderden: vertellen wat er gebeurde toen er iets anders gebeurde. Het onvoltooid verleden met می‌ en de verleden stam, de optionele vorm در حال ... بودم, de eenvoudige verleden tijd voor de onderbrekende gebeurtenis, verbonden met وقتی که, ناگهان en همان وقت.'
units:
  prs.a2.unit24.what_was_happening:
    title: Wat was er aan de hand toen...
lessons:
  prs.a2.unit24.lesson01.words_and_continuing_past:
    title: Weer- en straatwoorden, en de vorm می‌رفتم
  prs.a2.unit24.lesson02.more_verbs_and_things:
    title: Meer werkwoorden en dingen uit het verhaal
  prs.a2.unit24.lesson03.contrast_finished_or_ongoing:
    title: Afgeronde handeling of handeling die bezig is
  prs.a2.unit24.lesson04.telling_what_was_happening:
    title: 'Vertellen wat er gebeurde: وقتی که …'
  prs.a2.unit24.lesson05.reading_and_listening:
    title: Lezen en luisteren over een voorval
  prs.a2.unit24.lesson06.conversation_and_mixed:
    title: Een gesprek over gisteravond
teaching:
  prs.a2.unit24.lesson01.teach.sarak:
    title: Straat
    gloss: straat, weg
    note: '*سرک* is een straat of weg. Met *در* betekent het op straat: *در سرک*. De les begint op straat, omdat de meeste kleine voorvallen daar gebeuren.'
    example_gloss: Ons kantoor is dicht bij de straat.
  prs.a2.unit24.lesson01.teach.piyada:
    title: Te voet
    gloss: te voet, lopend
    note: '*پیاده* betekent te voet. *پیاده می‌روم* is ik ga te voet, ik loop. Hier is het werkwoord de tegenwoordige tijd *می‌روم*; in deze les leer je de verleden tijd van hetzelfde patroon.'
    example_gloss: Elke dag ga ik te voet naar kantoor.
  prs.a2.unit24.lesson01.teach.rain:
    title: Regen
    gloss: regen
    note: '*باران* is regen. *شروع شد* betekent begon: *باران شروع شد* is het begon te regenen. Dit paar gebruik je in de hele les voor de gebeurtenis die ertussen komt.'
    example_gloss: Het begon te regenen.
  prs.a2.unit24.lesson01.teach.snow:
    title: Het regent, het sneeuwt
    gloss: het regent, het sneeuwt
    note: '*برف* is sneeuw. Het werkwoord *باریدن* (als regen of sneeuw vallen) gebruik je voor beide: *باران می‌بارد* is het regent en *برف می‌بارد* is het sneeuwt. Beide zijn tegenwoordige tijd met *می*.'
    example_gloss:
    - Vandaag regent het.
    - In Kabul sneeuwt het.
  prs.a2.unit24.lesson01.teach.wind:
    title: Wind
    gloss: wind
    note: '*باد* is wind. Om te zeggen dat het waait, zeg je dat er veel wind is: *باد زیاد است*.'
    example_gloss: Vandaag is er veel wind.
  prs.a2.unit24.lesson01.teach.traffic:
    title: Verkeer
    gloss: verkeer
    note: '*ترافیک* is verkeer. *ترافیک زیاد* is druk verkeer, een heel gewone reden om te laat te komen.'
    example_gloss: Er is druk verkeer op straat.
  prs.a2.unit24.lesson01.teach.imperfect_paradigm:
    title: 'Was aan het gaan: می + verleden stam + uitgangen'
    gloss: ik was aan het gaan, jij was aan het gaan, hij/zij was aan het gaan, wij waren aan het gaan, u/jullie waren aan het gaan, zij waren aan het gaan
    note: 'De simpele verleden tijd ken je al voor een afgeronde handeling: *رفتم* is ik ging. Om te zeggen wat er op een bepaald moment in het verleden gaande was, zet je *می‌* voor het werkwoord in de verleden tijd: *می‌رفتم* is ik was aan het gaan. Het patroon is *می‌* + verleden stam (*رفت*) + dezelfde uitgangen: *می‌رفتم، می‌رفتی، می‌رفت، می‌رفتیم، می‌رفتین، می‌رفتند*. De voornaamwoorden *من، تو، او، ما، شما، آن‌ها* zijn optioneel. Het weer werkt hetzelfde: *باران می‌بارید* is het regende en *برف می‌بارید* is het sneeuwde. Vergelijk de tegenwoordige tijd *می‌روم* (ik ga): alleen de stam en de uitgang veranderen. Dezelfde vorm *می‌رفتم* kan ook ik ging altijd betekenen (een gewoonte), zoals in *هر روز پیاده می‌رفتم*; de zin eromheen laat zien welke betekenis bedoeld is. In deze les betekent het meestal was aan het gaan.'
  prs.a2.unit24.lesson02.teach.car:
    title: Auto
    gloss: de auto
    note: '*موتر* is het gewone Afghaanse woord voor een auto. *در موتر* is in de auto.'
    example_gloss: Onze auto is nieuw.
  prs.a2.unit24.lesson02.teach.phone:
    title: Telefoon
    gloss: telefoon
    note: '*تیلفون* is een telefoon. Voeg *-م* toe voor mijn: *تیلفونم* is mijn telefoon.'
    example_gloss: Mijn telefoon staat aan.
  prs.a2.unit24.lesson02.teach.umbrella:
    title: Parasol
    gloss: paraplu
    note: '*چتر* is een paraplu. Regen en een paraplu horen bij elkaar: *چتر دارم* is ik heb een paraplu en *چتر ندارم* is ik heb er geen.'
    example_gloss: Vandaag regent het, ik heb een paraplu.
  prs.a2.unit24.lesson02.teach.wet:
    title: Nat worden
    gloss: nat worden
    note: '*خیس* is nat en *خیس شدن* is nat worden. *خیس شدم* is ik werd nat, een veelvoorkomend gevolg van regen.'
    example_gloss: Als het regent, word ik nat.
  prs.a2.unit24.lesson02.teach.ring:
    title: Bellen, overgaan
    gloss: overgaan, iemand bellen
    note: '*زنگ زدن* heeft twee toepassingen. Een telefoon kan overgaan: *تیلفونم زنگ زد* (mijn telefoon ging over). Een persoon kan iemand bellen: *دوستم به من زنگ زد* (mijn vriend belde me). De verleden stam is *زد*, van *زدن*.'
    example_gloss: Mijn vriend belde me.
  prs.a2.unit24.lesson02.teach.driving:
    title: Rijden
    gloss: rijden, autorijden
    note: '*رانندگی کردن* is autorijden. *رانندگی* is het rijden en *کردن* is het werkwoord doen, zoals in *خرید کردن*. Het is een zelfstandig naamwoord plus *کردن*, dus het werkwoordsdeel verandert: *رانندگی کردم*.'
    example_gloss: Ik rijd elke dag.
  prs.a2.unit24.lesson02.teach.more_verbs:
    title: Hetzelfde patroon met andere werkwoorden
    gloss: ik was aan het doen, jij was aan het doen, ik was aan het eten, ik was aan het kijken, ik was aan het komen
    note: 'Elk werkwoord volgt dezelfde regel: *می‌* + verleden stam + uitgang. *کردن* geeft *می‌کردم* (ik was bezig met doen) en *می‌کردی* (jij was bezig met doen). *خوردن* geeft *می‌خوردم* (ik was aan het eten). *دیدن* geeft *می‌دیدم* (ik zag; bij een film: ik keek). *آمدن* geeft *می‌آمدم* (ik was onderweg hierheen). Bij een werkwoord als *آشپزی کردن* verandert alleen het werkwoordsdeel: *آشپزی می‌کردم* is ik was aan het koken, niet *می‌آشپزی*. De stam verandert nooit, alleen de uitgangen.'
  prs.a2.unit24.lesson02.teach.cooking:
    title: ik was aan het koken
    gloss: Ik was aan het koken.
    note: '*آشپزی* is koken, een herhalingswoord uit de lessen over de dagelijkse routine. *آشپزی می‌کردم* zegt dat je midden in het koken zat.'
  prs.a2.unit24.lesson02.teach.watching:
    title: Ik keek thuis een film
    gloss: Ik was thuis een film aan het kijken.
    note: '*فلم دیدن* is een film kijken, dus de duurvorm in het verleden is *فلم می‌دیدم*. *در خانه* is thuis.'
  prs.a2.unit24.lesson02.teach.driving_car:
    title: Ik zat in de auto te rijden
    gloss: Ik was in de auto aan het rijden.
    note: '*در موتر* is in de auto en *رانندگی می‌کردم* is ik was aan het rijden.'
  prs.a2.unit24.lesson03.teach.was_paradigm:
    title: 'Was, waren: بودن in de verleden tijd'
    gloss: ik was, jij was, hij/zij/het was, wij waren, u/jullie waren, zij waren
    note: '*بودن* is zijn. De verleden tijd wordt gevormd als bij elk ander werkwoord: stam *بود* plus de uitgangen *بودم، بودی، بود، بودیم، بودین، بودند*. Zo zeg je was of waren: *در موتر بودم* (ik was in de auto), *ترافیک زیاد بود* (het verkeer was druk). Verwar het niet met de tegenwoordige tijd *استم، استی، است*. Een toestand, zoals ergens zijn of wachten, heeft geen *می‌* nodig, omdat *بودم* al een situatie op dat moment in het verleden beschrijft.'
  prs.a2.unit24.lesson03.teach.waiting:
    title: Wachten
    gloss: wachten, aan het wachten zijn
    note: '*منتظر بودن* is wachten. Wachten is een toestand, dus de verleden tijd is gewoon *منتظر بودم* (ik wachtte), zonder *می‌*. Waarop je wacht, komt vóór *منتظر*: *منتظر بس بودم*.'
    example_gloss: Bij het station wachtte ik op de bus.
  prs.a2.unit24.lesson03.teach.negative_continuing:
    title: 'Was niet aan het gaan: نمی + verleden stam'
    gloss: ik was niet aan het gaan, ik was niet aan het eten, ik was niet aan het kijken, ik was niet aan het doen
    note: 'Om te zeggen dat je op dat moment iets niet aan het doen was, zet je *نمی‌* in plaats van *می‌* voor de verleden stam: *نمی‌رفتم* (ik was niet aan het gaan), *نمی‌خوردم* (ik was niet aan het eten), *نمی‌دیدم* (ik was niet aan het kijken), *نمی‌کردم* (ik was niet aan het doen). Vergelijk de simpele ontkennende verleden tijd uit de les over het weekend: *نرفتم* is ik ging niet (een afgerond feit: het gebeurde niet), terwijl *نمی‌رفتم* is ik was niet aan het gaan (niet bezig op dat moment, of ik ging gewoonlijk niet).'
  prs.a2.unit24.lesson03.teach.finished_vs_ongoing:
    title: Ging versus was aan het gaan
    gloss: Ik ging naar huis. / Ik was op weg naar huis.
    note: 'De twee vormen lijken bijna op elkaar, maar vertellen een ander verhaal. *به خانه رفتم* is ik ging naar huis: de reis is voorbij. *به خانه می‌رفتم* is ik was op weg naar huis: ik was onderweg, nog niet thuis, en er kan onderweg iets gebeuren. Als je vertelt wat er gebeurde, gebruikt de langere achtergrondhandeling *می‌* en de plotselinge gebeurtenis de simpele verleden tijd zonder *می‌*.'
  prs.a2.unit24.lesson03.teach.when_two_pasts:
    title: Wanneer + simpele verleden tijd of wanneer + می
    gloss: Toen ik thuiskwam, begon het te regenen. / Toen ik over straat liep, begon het te regenen.
    note: 'Beide zinnen gebruiken *وقتی که* (toen, wanneer), maar het werkwoord erna bepaalt de betekenis. Met een simpele verleden tijd, *وقتی که به خانه رسیدم، باران شروع شد*, is de eerste gebeurtenis voorbij en volgt de tweede erop: nadat ik thuiskwam, begon het te regenen. Met *می‌*, *وقتی که در سرک می‌رفتم، باران شروع شد*, was de eerste handeling nog bezig en begon het te regenen midden daarin. Om te vertellen wat er gaande was, heb je het tweede patroon nodig.'
  prs.a2.unit24.lesson03.teach.in_progress_emphasis:
    title: 'Optioneel: در حال … بودم'
    gloss: Ik was net aan het gaan. / Ik was midden in het koken. / Ik ben net aan het gaan.
    note: 'Dari heeft nog een iets sterkere manier om te zeggen dat iets bezig was: *در حال* + de infinitief + *بودم*. *در حال رفتن بودم* is ik was net aan het gaan, en bij een zelfstandig naamwoord plus *کردن* volgt de hele infinitief: *در حال آشپزی کردن بودم*. Het betekent hetzelfde als het gewone *می‌رفتم* en *آشپزی می‌کردم*; het legt alleen meer nadruk op het feit dat het bezig was. Je hoeft het nooit te gebruiken en beide vormen zijn overal in deze les juist. De tegenwoordige tijd heeft dezelfde nadrukvorm: *در حال رفتن استم* is ik ben net aan het gaan, maar het gewone *می‌روم* is wat mensen meestal zeggen.'
  prs.a2.unit24.lesson04.teach.when_pattern:
    title: 'Het patroon: وقتی که + می, daarna de gebeurtenis'
    gloss: Toen ik over straat liep, begon het te regenen.
    note: 'Om te zeggen wat er gaande was toen er iets gebeurde, bouw je de zin in twee delen. Eerst de achtergrond: *وقتی که* + de handeling die bezig was met *می‌*: *وقتی که در سرک می‌رفتم*. Dan een komma en de gebeurtenis die ertussen kwam, in de simpele verleden tijd zonder *می‌*: *باران شروع شد*. Het resultaat is *وقتی که در سرک می‌رفتم، باران شروع شد.* De lange handeling (*می‌رفتم*) was al bezig en de korte gebeurtenis (*شروع شد*) kwam er dwars doorheen. Hetzelfde werkt met de optionele nadrukvorm: *وقتی که در حال رفتن بودم، باران شروع شد*. Je mag *که* weglaten en gewoon *وقتی* zeggen.'
  prs.a2.unit24.lesson04.teach.suddenly:
    title: Plotseling
    gloss: plotseling
    note: '*ناگهان* betekent plotseling. Het staat vlak voor het werkwoord van de plotselinge gebeurtenis, zoals in *ناگهان باران شروع شد*. Het past goed bij het werkwoord dat ertussen komt, in de simpele verleden tijd.'
    example_gloss: Plotseling begon het te regenen.
  prs.a2.unit24.lesson04.teach.same_time:
    title: Op dat moment
    gloss: op datzelfde moment
    note: '*همان وقت* is op datzelfde moment. Gebruik het aan het begin van een nieuwe zin om een tweede gebeurtenis toe te voegen die tegelijk plaatsvond: *همان وقت تیلفونم زنگ زد*.'
    example_gloss: Op datzelfde moment ging mijn telefoon over.
  prs.a2.unit24.lesson04.teach.power_cut:
    title: De stroom viel uit
    gloss: de stroom viel uit
    note: '*برق* is elektriciteit. *برق رفت* is de stroom viel uit (de elektriciteit ging weg), een klein voorval dat stopt waar je mee bezig was.'
    example_gloss: Plotseling viel de stroom uit.
  prs.a2.unit24.lesson04.teach.event_vs_background:
    title: Welk werkwoord heeft می en welk niet
    gloss: Toen ik een film aan het kijken was, viel plotseling de stroom uit. Op datzelfde moment ging mijn telefoon over.
    note: 'Let in elke zin op twee soorten werkwoorden. De achtergrondhandeling heeft *می‌*: *فلم می‌دیدم* (ik was een film aan het kijken), omdat die een tijd duurt. De gebeurtenis die ertussen komt heeft geen *می‌*: *برق رفت* (de stroom viel uit), omdat die één keer gebeurt en dan voorbij is. *ناگهان* of *همان وقت* horen bij de gebeurtenis, niet bij de achtergrond. Als beide werkwoorden *می‌* hadden of geen van beide, zou de zin niet meer duidelijk maken welke handeling in de andere ingreep.'
  prs.a2.unit24.lesson05.teach.got_wet_we:
    title: We werden nat
    gloss: we werden nat
    note: '*شدیم* is wij werden, de simpele verleden tijd van *شدن* met de uitgang *-یم*. *خیس شدیم* is we werden nat.'
    example_gloss: Op straat begon het te regenen en we werden nat.
  prs.a2.unit24.lesson05.teach.friend_pl:
    title: Met mijn vrienden
    gloss: met mijn vrienden
    note: '*دوستانم* is mijn vrienden en *با* is met: *با دوستانم* is met mijn vrienden. Je hoort het in het volgende gesprek.'
    example_gloss: Op vrijdag was ik met mijn vrienden op de bazaar.
  prs.a2.unit24.lesson05.teach.message:
    title: Een bericht over gisterochtend
    gloss: Gisterochtend was ik op weg naar kantoor. Er was druk verkeer op straat. Terwijl ik in de bus wachtte, begon het te regenen. Op datzelfde moment ging mijn telefoon over. Het was mijn vriend. Ik kwam te laat op kantoor aan.
    note: 'Een kort geschreven verslag van een klein voorval. De achtergrond heeft *می‌*: *به دفتر می‌رفتم*. Het wachten is een toestand, *منتظر بودم*. De twee gebeurtenissen staan in de simpele verleden tijd: *باران شروع شد* en *تیلفونم زنگ زد*.'
  prs.a2.unit24.lesson05.teach.exchange_q:
    title: Homayoun vraagt Zarmina naar vrijdag
    gloss: Zarmina, wat gebeurde er vrijdag op de bazaar?
    note: Homayoun vraagt met *چه شد؟*, wat gebeurde er? Zo vraag je gewoonlijk naar het verhaal van een klein voorval.
  prs.a2.unit24.lesson05.teach.exchange_a:
    title: Zarmina vertelt wat er gebeurde
    gloss: Toen ik met mijn vrienden over de bazaar liep, begon het te regenen. Ik had geen paraplu en we werden nat.
    note: Zarmina geeft de achtergrond met *می‌* (*می‌رفتم*) en dan de gebeurtenis (*باران شروع شد*). Haar resultaat, *خیس شدیم*, staat ook in de simpele verleden tijd.
  prs.a2.unit24.lesson06.teach.turn01:
    title: Homayoun vraagt wat Zarmina aan het doen was
    gloss: Zarmina, wat deed jij gisteravond?
    note: '*چه کار می‌کردی؟* is wat was je aan het doen? Het vraagt naar een handeling die bezig was, dus het gebruikt *می‌کردی*, niet het afgeronde *کردی*.'
  prs.a2.unit24.lesson06.teach.turn02:
    title: Zarmina zegt wat ze deed en wat er gebeurde
    gloss: Toen ik een film aan het kijken was, viel plotseling de stroom uit.
    note: Achtergrond *فلم می‌دیدم*, daarna de gebeurtenis *برق رفت* met *ناگهان*.
  prs.a2.unit24.lesson06.teach.turn03:
    title: Homayoun vraagt wat ze daarna deed
    gloss: Wat deed je toen?
    note: '*چه کار کردی؟* met de simpele verleden tijd vraagt naar een afgeronde handeling: wat heb je gedaan?'
  prs.a2.unit24.lesson06.teach.turn04:
    title: Zarmina vertelt over het telefoontje en vraagt terug
    gloss: Op datzelfde moment ging mijn telefoon over. Het was mijn vriendin. Ik heb met haar gepraat. En jij?
    note: '*همان وقت* voegt een tweede gebeurtenis toe. *با او صحبت کردم* is ik heb met haar gepraat, en *تو چطور؟* vraagt en jij?'
  prs.a2.unit24.lesson06.teach.turn05:
    title: Homayoun vertelt over de bus en het weer
    gloss: Ik was op weg van kantoor naar huis. Ik zat in de bus. Het verkeer was druk en het regende ook.
    note: Hij gebruikt *می‌آمدم* voor de reis, *بودم* en *زیاد بود* voor de situatie en *می‌بارید* voor de regen die bezig was.
  prs.a2.unit24.lesson06.teach.bad:
    title: Wat jammer!
    gloss: slecht; wat jammer!
    note: '*بد* betekent slecht. *چه بد!* is ''wat erg!'' of ''wat jammer!'', een vriendelijke reactie op een klein ongelukje.'
    example_gloss: Vandaag regent het en het is druk op de weg.
  prs.a2.unit24.lesson06.teach.turn06:
    title: Zarmina reageert
    gloss: Wat jammer!
    note: '*چه بد!* is een vriendelijke reactie op slecht nieuws, het tegenovergestelde van *چه خوب!*.'
exercises:
