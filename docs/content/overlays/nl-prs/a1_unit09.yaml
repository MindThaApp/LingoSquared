teaching:
  prs.a1.unit09.lesson01.teach.shanbe_yakshanbe:
    title: Zaterdag en zondag
    gloss: Zaterdag, zondag
    note: شنبه (zaterdag) is in Afghanistan de eerste dag van de week; یکشنبه (zondag) volgt daarop.
    example_gloss:
    - Vandaag is het zaterdag.
    - Morgen is het zondag.
  prs.a1.unit09.lesson01.teach.doshanbe_seshanbe:
    title: Maandag en dinsdag
    gloss: maandag, dinsdag
    note: دوشنبه en سه‌شنبه betekenen letterlijk 'tweede dag' en 'derde dag' na شنبه.
    example_gloss:
    - Ik heb maandag les.
    - Ik heb dinsdag een afspraak.
  prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe:
    title: Woensdag en donderdag
    gloss: woensdag, donderdag
    note: 'چهارشنبه en پنجشنبه volgen hetzelfde patroon: ''vierde dag'' en ''vijfde dag''.'
    example_gloss:
    - Ik werk op woensdag.
    - Tot donderdag!
  prs.a1.unit09.lesson01.teach.jomeh:
    title: vrijdag
    gloss: vrijdag
    note: جمعه is in Afghanistan de wekelijkse vrije dag, vergelijkbaar met de weekenddagen in het Westen.
    example_gloss: Vrijdag is een vrije dag.
  prs.a1.unit09.lesson01.teach.tarikh_word:
    title: Datum
    gloss: datum
    note: تاریخ is het algemene woord voor een kalenderdatum.
    example_gloss: Welke datum is het vandaag?
  prs.a1.unit09.lesson01.teach.va_word:
    title: En
    gloss: en
    note: و is het gewone verbindingswoord dat in deze hele unit wordt gebruikt.
    target_text: و (en)
  prs.a1.unit09.lesson01.teach.weekend_note:
    title: De wekelijkse vrije dag
    gloss: Vrijdag is de wekelijkse vrije dag.
    note: Anders dan bij een weekend op zaterdag en zondag is de belangrijkste wekelijkse vrije dag in Afghanistan *جمعه* (vrijdag); donderdag is vaak een halve werkdag.
  prs.a1.unit09.lesson02.teach.hamal:
    title: Hamal (1e maand)
    gloss: Hamal, de eerste maand van de Hijri Shamsi-kalender (ongeveer eind maart–april)
    note: حمل markeert het begin van het Afghaanse zonnejaar, samenvallend met het Nowruz-nieuwjaar.
    example_gloss: Hamal is de eerste maand van het jaar.
  prs.a1.unit09.lesson02.teach.sawr:
    title: Sawr (2e maand)
    gloss: Sawr, de tweede maand (ongeveer april–mei)
    note: ثور volgt op حمل.
    example_gloss: In Sawr is het mooi weer.
  prs.a1.unit09.lesson02.teach.jawza:
    title: Jawza (3e maand)
    gloss: Jawza, de derde maand (ongeveer mei–juni)
    note: جوزا volgt op ثور.
    example_gloss: Ik ben geboren in Jawza.
  prs.a1.unit09.lesson02.teach.calendar_note:
    title: De kalender van Afghanistan
    gloss: Afghanistan gebruikt de Hijri Shamsi-kalender (de zonne-Hijri-kalender).
    note: Dit is dezelfde zonnekalender als in Iran, en verschilt zowel van de Gregoriaanse kalender als van de islamitische maankalender.
  prs.a1.unit09.lesson03.teach.what_day_today:
    title: Vragen welke dag het vandaag is
    gloss: Welke dag is het vandaag?
    note: امروز چند شنبه است؟ betekent letterlijk 'vandaag is hoeveel-shanbe'; dit is de gewone manier om naar de dag van de week te vragen.
  prs.a1.unit09.lesson03.teach.today_word:
    title: Vandaag
    gloss: vandaag
    note: امروز verwijst naar de huidige dag.
    example_gloss: Welke datum is het vandaag?
  prs.a1.unit09.lesson04.teach.give_full_date:
    title: Een volledige datum geven
    gloss: Vandaag is het donderdag de 15e van Hamal.
    note: امروز پنجشنبه، پانزدهم حمل است combineert de dag van de week, een rangtelwoord als datum en de maandnaam.
  prs.a1.unit09.lesson05.teach.which_day_meeting:
    title: Vragen op welke dag iets plaatsvindt
    gloss: Op welke dag is de vergadering?
    note: جلسه کدام روز است؟ gebruikt کدام (welke) om naar de dag van een gebeurtenis te vragen.
  prs.a1.unit09.lesson05.teach.which_date:
    title: Naar een bepaalde datum vragen
    gloss: Welke datum van Hamal is het maandag?
    note: دوشنبه چندم حمل است؟ vraagt op welke dag van de maand (nummer) de maandag valt.
  prs.a1.unit09.lesson06.teach.nozdahom:
    title: 19e
    gloss: 19e
    note: '*نوزدهم* is het rangtelwoord van negentien en volgt hetzelfde patroon als *پانزدهم* (15e).'
    example_gloss: Vandaag is het de 19e.
  prs.a1.unit09.lesson06.teach.turn01:
    title: Homayoun vraagt op welke dag de vergadering is
    gloss: Homayoun vraagt Bashir op welke dag de vergadering is.
    note: جلسه کدام روز است؟ uit les 5.
  prs.a1.unit09.lesson06.teach.turn02:
    title: Bashir antwoordt
    gloss: Bashir zegt dat hij denkt dat het maandag is.
    note: فکر می‌کنم (ik denk) maakt het antwoord zachter, omdat hij het niet zeker weet.
  prs.a1.unit09.lesson06.teach.turn03:
    title: Homayoun vraagt naar de exacte datum
    gloss: Homayoun vraagt welke datum van Hamal het maandag is.
    note: دوشنبه چندم حمل است؟ uit les 5.
  prs.a1.unit09.lesson06.teach.turn04:
    title: Bashir geeft de exacte datum
    gloss: Bashir zegt dat het maandag de 19e van Hamal is.
    note: '*دوشنبه نوزدهم حمل است* combineert de dag, een rangtelwoord als datum en de maand, volgens het patroon uit les 4.'
  prs.a1.unit09.lesson06.teach.turn05:
    title: Homayoun vraagt naar vrijdag
    gloss: Homayoun stemt in en vraagt of Bashir vrijdag tijd heeft.
    note: وقت داری؟ (heb je tijd?) is een natuurlijke manier om te vragen of iemand beschikbaar is.
  prs.a1.unit09.lesson06.teach.turn06:
    title: Bashir zegt dat hij het druk heeft
    gloss: Bashir zegt nee, hij heeft het vrijdag druk.
    note: مصروف استم (ik ben bezet) legt uit waarom vrijdag niet past.
  prs.a1.unit09.lesson06.teach.turn07:
    title: Homayoun bevestigt maandag
    gloss: Homayoun zegt dat het geen probleem is en dat hij Bashir maandag ziet.
    note: مشکل نیست (geen probleem) haalt de spanning uit het planningsprobleem, voordat het oorspronkelijke plan voor maandag wordt bevestigd.
