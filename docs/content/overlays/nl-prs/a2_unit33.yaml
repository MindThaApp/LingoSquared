    title: Najiba zegt dat ze komt en wat ze probeert
    gloss: Ja, ik kom vandaag om zes uur. Ik probeer elke avond vroeg naar bed te gaan.
    note: '*امروز ساعت شش می‌آیم* is de gewone tegenwoordige tijd met een tijdsaanduiding. *کوشش می‌کنم که هر شب زود بخوابم* is de nieuwe gewoonte die ze wil volhouden.'
