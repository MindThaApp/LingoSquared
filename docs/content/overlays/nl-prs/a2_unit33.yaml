  prs.a2.unit33.lesson06.exercise01.comprehend_why_not_come:
    instruction: Lees het gesprek, want er is nog geen opname. Waarom kwam Najiba gisteren niet naar de sportschool?
    correct_option: Ze vergat op tijd naar bed te gaan en werd laat wakker
    distractors:
    - Ze was gestopt met naar de sportschool gaan
    - Ze las de hele ochtend een boek
    - Ze was ziek en bleef thuis
    accepted_answers:
    - value: Ze vergat op tijd naar bed te gaan en werd laat wakker
      status: correct
    feedback: 'Najiba zegt *فراموش کردم که زود بخوابم، پس صبح دیر بیدار شدم*: ze vergat vroeg naar bed te gaan, dus ze werd laat wakker.'
  prs.a2.unit33.lesson06.exercise02.comprehend_what_she_tries:
