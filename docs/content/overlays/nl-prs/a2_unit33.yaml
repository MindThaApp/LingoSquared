course:
  title: Dari A2
  description: 'Afghaans Dari voor het lagere middenniveau: zeggen wat je bent begonnen, gestopt, geprobeerd of vergeten te doen. Beginnen met het object en را, met به en de infinitief of met که en de subjunctief; een gewoonte opgeven met ترک کردن en دیگر; proberen en vergeten met که en de subjunctief.'
units:
  prs.a2.unit33.starting_stopping_trying:
    title: Beginnen, stoppen, proberen
lessons:
  prs.a2.unit33.lesson01.starting:
    title: 'Ergens mee beginnen: "Ik begon met hardlopen"'
  prs.a2.unit33.lesson02.that_i_run:
    title: '"Dat ik ren": beginnen en proberen met که'
  prs.a2.unit33.lesson03.stopping:
    title: 'Stoppen: ترک کردن en "niet meer"'
  prs.a2.unit33.lesson04.forgetting:
    title: Vergeten iets te doen
  prs.a2.unit33.lesson05.reading_and_listening:
    title: Lezen en luisteren over gewoontes
  prs.a2.unit33.lesson06.gym_conversation:
    title: Een gesprek in de sportschool
teaching:
  prs.a2.unit33.lesson01.teach.gym:
    title: Sportschool
    gloss: sportschool, sportclub
    note: '*باشگاه* is een sportschool of sportclub. Je gebruikt er *به* bij: *به باشگاه می‌روم* betekent: ik ga naar de sportschool.'
    example_gloss: De sportschool is vlak bij het huis.
  prs.a2.unit33.lesson01.teach.run:
    title: Rennen
    gloss: rennen, hardlopen
    note: '*دویدن* betekent rennen. De tegenwoordige stam is *دو*, dus *می‌دوم* betekent ik ren. Net als elke infinitief eindigt *دویدن* op *-ن*; deze *-ن*-vorm gebruik je in deze les na *به*.'
    example_gloss: Ik ren elke ochtend.
  prs.a2.unit33.lesson01.teach.exercise:
    title: Sporten
    gloss: sporten, aan sport doen
    note: '*ورزش کردن* betekent sporten. Het is een werkwoord van twee woorden: *ورزش* blijft voorop staan en alleen *کردن* verandert, zoals in *ورزش می‌کنم* (ik sport) en *ورزش کردم* (ik heb gesport).'
    example_gloss: Ik sport elke dag.
  prs.a2.unit33.lesson01.teach.half_hour:
    title: Een half uur
    gloss: een half uur
    note: '*نیم ساعت* betekent een half uur. *نیم* betekent half en staat voor het zelfstandig naamwoord, zoals in *نیم ساعت* en *نیم ساعت ورزش*.'
    example_gloss: Elke ochtend sport ik een half uur.
  prs.a2.unit33.lesson01.teach.habit:
    title: Gewoonte
    gloss: gewoonte
    note: '*عادت* betekent gewoonte. Deze hele unit gaat over gewoontes: een goede beginnen, een slechte opgeven, proberen er een vol te houden en er een vergeten.'
    example_gloss: Sporten is een goede gewoonte.
  prs.a2.unit33.lesson01.teach.start_noun:
    title: 'Ergens mee beginnen: het object + را + شروع کردن'
    gloss: Ik begon met sporten. Jij begon met hardlopen. Hij of zij begon met werken.
    note: 'Om te zeggen dat je ergens mee begonnen bent, zet je het object voor *را* en gebruik je *شروع کردن* (beginnen): *ورزش را شروع کردم* betekent: ik begon met sporten. Het is een werkwoord van twee woorden zoals *ورزش کردن*, dus alleen *کردن* verandert: *شروع کردم، شروع کردی، شروع کرد، شروع کردیم، شروع کردین، شروع کردند*. Wat je begint kan een zelfstandig naamwoord zijn (*کار*, werk) of een infinitief (*دویدن*, rennen). Het voornaamwoord is optioneel, omdat de uitgang al aangeeft wie het is.'
  prs.a2.unit33.lesson01.teach.month_ago:
    title: Ik ben een maand geleden begonnen met sporten
    gloss: Ik ben een maand geleden begonnen met sporten.
    note: '*پیش* na een tijdsaanduiding betekent geleden: *یک ماه پیش* is een maand geleden en *دو هفته پیش* is twee weken geleden. De tijdsaanduiding staat meestal aan het begin van de zin.'
  prs.a2.unit33.lesson01.teach.start_to:
    title: 'Beginnen met een handeling: به + infinitief + شروع کردن'
    gloss: Ik begon te rennen. Jij begon te sporten. Hij of zij begon te lezen.
    note: 'Om te zeggen dat je met een handeling begonnen bent, zet je *به* en de infinitief (het werkwoord op *-ن*) voor *شروع کردن*: *به دویدن شروع کردم* betekent: ik begon te rennen. Bij een werkwoord van twee woorden blijven beide woorden in de infinitief: *به ورزش کردن شروع کردم* betekent: ik begon te sporten. Je hoort ook de volgorde *شروع کردم به دویدن*, die hetzelfde betekent. Vergelijk de twee patronen: *ورزش را شروع کردم* noemt iets waarmee je begon, en *به ورزش کردن شروع کردم* noemt de handeling.'
  prs.a2.unit33.lesson01.teach.read_start:
    title: Hij of zij begon twee weken geleden boeken te lezen
    gloss: Hij of zij begon twee weken geleden met het lezen van boeken.
    note: '*خواندن* betekent lezen (en ook studeren). De infinitief *خواندن* komt na *به*, en het lijdend voorwerp *کتاب* kan erop volgen: *به خواندن کتاب شروع کرد*.'
  prs.a2.unit33.lesson02.teach.sleep:
    title: Slapen, naar bed gaan
    gloss: slapen, naar bed gaan
    note: '*خوابیدن* betekent slapen of naar bed gaan. De tegenwoordige stam is *خواب*: *می‌خوابم* is ik slaap. *شب‌ها* betekent ''s avonds of ''s nachts en is een tijdsaanduiding.'
    example_gloss: '''s Avonds ga ik vroeg naar bed.'
  prs.a2.unit33.lesson02.teach.try:
    title: Proberen
    gloss: proberen, moeite doen
    note: '*کوشش* is moeite of inspanning, en *کوشش کردن* is proberen. Het is een werkwoord van twee woorden: *کوشش می‌کنم* is ik probeer en *کوشش کردم* is ik probeerde. Wat je probeert te doen komt na *که*, in de conjunctief.'
    example_gloss: Ik probeer vroeg wakker te worden.
  prs.a2.unit33.lesson02.teach.subjunctive:
    title: 'De conjunctief: ب + tegenwoordige stam + uitgang'
    gloss: dat ik ren, dat ik slaap, dat ik lees, dat ik eet, dat ik ga, dat ik zie; dat ik sport, dat ik wakker word
    note: 'De conjunctief is de werkwoordsvorm die je gebruikt voor iets wat je begint, probeert of vergeet te doen. Je kent hem al van *باید*, zoals in *باید بروم*. Je vormt hem zo: neem de tegenwoordige stam, zet *ب-* ervoor en voeg de uitgangen *-م، -ی، -د، -یم، -ین، -ند* toe. Voor *دویدن* (stam *دو*): *بدوم، بدوی، بدود، بدویم، بدوین، بدوند*. Andere werkwoorden: *خوابیدن* wordt *بخوابم*, *خواندن* wordt *بخوانم*, *خوردن* wordt *بخورم*, *رفتن* wordt *بروم*, *دیدن* wordt *ببینم*. Een werkwoord van twee woorden krijgt geen *ب-*: het eerste woord blijft staan en alleen *کردن* of *شدن* verandert, dus *ورزش کنم* (dat ik sport) en *بیدار شوم* (dat ik wakker word).'
  prs.a2.unit33.lesson02.teach.che_pattern:
    title: شروع کردن en کوشش کردن met که
    gloss: Ik begon te rennen. Ik probeer vroeg naar bed te gaan. Ik probeerde te sporten.
    note: 'Na *شروع کردن* en *کوشش کردن* zet je *که* en een werkwoord in de conjunctief. *شروع کردم که بدوم* betekent hetzelfde als *به دویدن شروع کردم*: ik begon te rennen. *کوشش می‌کنم که زود بخوابم* is ik probeer vroeg naar bed te gaan. Het onderwerp blijft meestal hetzelfde, dus de uitgang van de conjunctief toont dezelfde persoon als het hoofdwerkwoord: *کوشش کردم که بروم*, *کوشش کردی که بروی*, *کوشش کرد که برود*. De tijd van het eerste werkwoord geeft het tijdstip (ik probeerde, ik probeer); de conjunctief zelf heeft geen eigen tijd.'
  prs.a2.unit33.lesson02.teach.negative_subj:
    title: 'De ontkennende conjunctief: ن in plaats van ب'
    gloss: Ik probeer geen snoep te eten. Ik probeer niet laat naar bed te gaan.
    note: 'Om te zeggen dat je probeert iets niet te doen, zet je *ن-* op de plaats van *ب-*: *بخورم* wordt *نخورم* (dat ik niet eet), *بخوابم* wordt *نخوابم*, *بروم* wordt *نروم*. Schrijf dus niet *نبخورم*. Bij een werkwoord van twee woorden komt *ن-* op het werkwoordsdeel: *ورزش نکنم* (dat ik niet sport).'
  prs.a2.unit33.lesson02.teach.he_tried:
    title: Hij of zij probeerde vroeg wakker te worden
    gloss: Hij of zij probeerde vroeg wakker te worden.
    note: 'De uitgang van de conjunctief toont het onderwerp: *شود* is hij of zij, dus *او کوشش کرد که زود بیدار شود* betekent Hij of zij probeerde vroeg wakker te worden.'
  prs.a2.unit33.lesson02.teach.we_started:
    title: We begonnen elke dag te sporten
    gloss: We begonnen elke dag te sporten.
    note: 'De uitgang *-یم* betekent wij in beide werkwoorden: *شروع کردیم* en *ورزش کنیم*.'
  prs.a2.unit33.lesson03.teach.quit:
    title: Opgeven, stoppen met
    gloss: opgeven, stoppen met
    note: '*ترک کردن* is een gewoonte opgeven of ermee stoppen. Het is een werkwoord van twee woorden: *ترک کردم* is ik stopte ermee en *ترک می‌کنم* is ik geef het op.'
    example_gloss: Hij of zij is gestopt met snoep eten.
  prs.a2.unit33.lesson03.teach.sweets:
    title: Snoep
    gloss: snoep, gebak, zoete lekkernijen
    note: '*شیرینی* is snoep en gebak. Het is een goed voorbeeld van een gewoonte waar mensen mee proberen te stoppen.'
    example_gloss: Ik hou van snoep.
  prs.a2.unit33.lesson03.teach.for_hours:
    title: Uren achter elkaar
    gloss: urenlang
    note: '*ساعت‌ها* is het meervoud van *ساعت* en betekent uren achter elkaar, urenlang. Zo praat je over schermtijd: *ساعت‌ها ویدیو دیدم* is ik heb urenlang video''s gekeken.'
    example_gloss: Hij of zij kijkt urenlang video's.
  prs.a2.unit33.lesson03.teach.sometimes:
    title: Soms
    gloss: soms
    note: '*گاهی* is soms. Het staat aan het begin van de zin of voor het werkwoord, en het is het tegenovergestelde van *همیشه* (altijd) en *هرگز* (nooit).'
    example_gloss: Soms kijk ik video's.
  prs.a2.unit33.lesson03.teach.quit_pattern:
    title: 'Een gewoonte opgeven: de gewoonte + را + ترک کردن'
    gloss: Ik ben gestopt met snoep eten. Jij bent gestopt met laat slapen. Hij of zij is gestopt met video's kijken.
    note: 'Om te zeggen dat je een gewoonte hebt opgegeven, zet je de gewoonte voor *را* en gebruik je daarna *ترک کردن*. De gewoonte is een infinitiefgroep: *شیرینی خوردن* (snoep eten), *دیر خوابیدن* (laat slapen), *ویدیو دیدن* (video''s kijken). Het patroon is hetzelfde als bij *ورزش را شروع کردم*: eerst de zaak, dan *را*, dan het werkwoord. Je kunt ook zeggen *عادت بد را ترک کردم* (ik ben van een slechte gewoonte afgekomen).'
  prs.a2.unit33.lesson03.teach.no_longer:
    title: 'Niet meer: دیگر + ontkennend werkwoord'
    gloss: Ik eet geen snoep meer. Ik kijk geen video's meer. Ik ga niet meer laat naar bed.
    note: '*دیگر* met een ontkennend werkwoord betekent niet meer: *دیگر شیرینی نمی‌خورم* is ik eet geen snoep meer. Het beschrijft hoe het nu is, nadat je iets hebt opgegeven. In een verhaal in het verleden gebruik je *دیگر* met de ontkennende verleden tijd: *از آن روز دیگر شیرینی نخوردم* is vanaf die dag heb ik nooit meer snoep gegeten. In het heden zegt *ترک کردم* dat je het besluit hebt genomen en *دیگر نمی‌خورم* zegt wat het resultaat is.'
  prs.a2.unit33.lesson03.teach.from_today:
    title: Vanaf vandaag ga ik niet meer laat naar bed
    gloss: Vanaf vandaag ga ik niet meer laat naar bed.
    note: '*از امروز* is vanaf vandaag. Met *دیگر* en een ontkennend werkwoord kondig je een nieuwe gewoonte aan.'
  prs.a2.unit33.lesson03.teach.bad_habit:
    title: Ik ben van een slechte gewoonte afgekomen
    gloss: Ik ben van een slechte gewoonte afgekomen.
    note: '*عادت بد* is een slechte gewoonte. Het adjectief *بد* komt na het zelfstandig naamwoord.'
  prs.a2.unit33.lesson03.teach.less_phone:
    title: '''s Avonds gebruik ik mijn telefoon minder'
    gloss: '''s Avonds gebruik ik mijn telefoon minder.'
    note: '*کمتر* is minder. Minder schermtijd is een andere manier om met een gewoonte te stoppen: je stopt er niet helemaal mee, je doet het minder.'
  prs.a2.unit33.lesson04.teach.forget:
    title: Vergeten
    gloss: vergeten
    note: '*فراموش کردن* is vergeten. Het is een werkwoord van twee woorden: *فراموش کردم* is ik vergat en *فراموش نکردم* is ik vergat het niet.'
    example_gloss: Sorry, ik was het vergeten.
  prs.a2.unit33.lesson04.teach.why_not_come:
    title: Waarom ben je gisteren niet gekomen?
    gloss: Waarom ben je gisteren niet gekomen?
    note: '*نیامدی* is de ontkennende verleden tijd van *آمدن* voor één vriend of vriendin: je bent niet gekomen. De vraag *چرا* betekent waarom.'
  prs.a2.unit33.lesson04.teach.forget_pattern:
    title: 'Vergeten iets te doen: فراموش کردن که + conjunctief'
    gloss: Ik vergat te bellen. Ik vergat mijn boek mee te nemen. Ik vergat vroeg naar bed te gaan.
    note: 'Om te zeggen dat je iets vergat te doen, gebruik je *فراموش کردن* met *که* en een werkwoord in de conjunctief: *فراموش کردم که تیلفون کنم* is ik vergat te bellen, dus het telefoontje is niet gebeurd. Het is dezelfde conjunctief als in de vorige lessen, en het onderwerp blijft meestal hetzelfde. *فراموش کردم* is verleden tijd, dus je praat over een moment dat voorbij is; de conjunctief na *که* heeft geen eigen tijd.'
  prs.a2.unit33.lesson04.teach.not_forget:
    title: 'Ik vergat het niet: فراموش نکردم که'
    gloss: Ik vergat niet te bellen. Ik vergat niet mijn boek mee te nemen.
    note: 'Bij *فراموش نکردم* staat de ontkenning bij *کردم*: ik vergat het niet. Daarna is het gedaan: *فراموش نکردم که کتابم را بیاورم* is ik vergat niet mijn boek mee te nemen, dus ik heb het meegenomen. Vergelijk *فراموش کردم که کتابم را بیاورم* (ik vergat mijn boek mee te nemen, dus ik heb het niet meegenomen).'
  prs.a2.unit33.lesson04.teach.four_verbs:
    title: Vier werkwoorden, vier patronen
    gloss: Ik begon. Ik gaf het op. Ik probeerde. Ik vergat.
    note: 'Alle vier de werkwoorden eindigen op *کردن*, dus de persoonsuitgangen zijn steeds hetzelfde (*کردم، کردی، کرد، کردیم، کردین، کردند*). Wat erna komt, verschilt. *شروع کردن*: de zaak met *را*, of *به* plus de infinitief, of *که* plus de conjunctief. *ترک کردن*: de gewoonte met *را*. *کوشش کردن*: *که* plus de conjunctief. *فراموش کردن*: *که* plus de conjunctief. Om te zeggen dat je iets niet meer doet, gebruik je *دیگر* met een ontkennend werkwoord in de tegenwoordige tijd.'
  prs.a2.unit33.lesson04.teach.sorry_forgot_sleep:
    title: Ik vergat vroeg naar bed te gaan
    gloss: Ik vergat vroeg naar bed te gaan.
    note: Dit is een zin die je zegt als er iets misging doordat je een gewoonte niet volhield.
  prs.a2.unit33.lesson05.teach.read_book:
    title: Een boek lezen
    gloss: een boek lezen
    note: '*کتاب خواندن* is een boek lezen. De tegenwoordige tijd is *کتاب می‌خوانم* (ik lees een boek); *خواندن* is ook studeren.'
    example_gloss: Elke avond lees ik een half uur in een boek.
  prs.a2.unit33.lesson05.teach.two_weeks:
    title: Ik begon twee weken geleden met het lezen van boeken
    gloss: Ik begon twee weken geleden met het lezen van boeken.
    note: 'Het patroon is dat van de eerste les: een tijdsaanduiding met *پیش*, dan *به* plus de infinitief, dan *شروع کردم*.'
  prs.a2.unit33.lesson05.teach.dlg_turn01:
    title: Najiba vraagt Yasin wanneer hij begon
    gloss: Yasin, wanneer ben je begonnen met sporten?
    note: '*ورزش را کی شروع کردی؟* volgt het patroon zaak plus *را* plus *شروع کردی*. *کی* vraagt wanneer. De sprekers zijn vrienden, dus ze gebruiken *تو*.'
  prs.a2.unit33.lesson05.teach.dlg_turn02:
    title: Yasin zegt wanneer en hoeveel
    gloss: Een maand geleden. Nu ren ik elke ochtend een half uur in de sportschool.
    note: '*یک ماه پیش* is het beginpunt. *حالا هر صبح نیم ساعت در باشگاه می‌دوم* is de gewoonte die hij nu heeft.'
  prs.a2.unit33.lesson05.teach.dlg_turn03:
    title: Najiba vraagt naar snoep
    gloss: Heel goed! Eet je ook snoep?
    note: '*خیلی خوب* is een vriendelijke reactie. *شیرینی هم می‌خوری؟* vraagt of hij ook snoep eet.'
  prs.a2.unit33.lesson05.teach.dlg_turn04:
    title: Yasin zegt dat hij met snoep is gestopt
    gloss: Nee, ik ben gestopt met snoep eten. Ik eet geen snoep meer.
    note: '*شیرینی خوردن را ترک کردم* noemt het besluit en *دیگر شیرینی نمی‌خورم* noemt het resultaat.'
  prs.a2.unit33.lesson05.teach.dlg_turn05:
    title: Najiba vraagt naar video's
    gloss: Kijk je 's avonds video's?
    note: '*شب‌ها* is een tijdsaanduiding voor ''s avonds of ''s nachts, en *می‌بینی* is je ziet of je kijkt.'
  prs.a2.unit33.lesson05.teach.dlg_turn06:
    title: Yasin zegt dat hij probeert minder te kijken
    gloss: Ja, maar ik probeer minder te kijken.
    note: '*کوشش می‌کنم که کمتر ببینم* gebruikt *کوشش کردن* met de conjunctief *ببینم*. Hij is niet gestopt met video''s: hij probeert het.'
  prs.a2.unit33.lesson05.teach.khalida_message:
    title: Een bericht over nieuwe gewoonten
    gloss: Hallo Najiba. Twee weken geleden ben ik begonnen met boeken lezen. Elke avond lees ik een half uur. Ik ben gestopt met video's kijken, dus 's avonds kijk ik geen video's meer. Ik probeer vroeg naar bed te gaan. Gisteren vergat ik je te bellen. Khalida
    note: 'Een kort geschreven bericht met alle vier de patronen: beginnen (*به خواندن کتاب شروع کردم*), opgeven (*ویدیو دیدن را ترک کردم*), proberen (*کوشش می‌کنم که زود بخوابم*) en vergeten (*فراموش کردم که تیلفون کنم*). De schrijfster is een andere persoon dan Yasin.'
  prs.a2.unit33.lesson06.teach.late_wake:
    title: Ik werd 's ochtends laat wakker
    gloss: Ik werd 's ochtends laat wakker.
    note: '*بیدار شدن* is wakker worden. *دیر* is laat en *زود* is vroeg: *صبح زود بیدار شدم* is ik werd ''s ochtends vroeg wakker.'
  prs.a2.unit33.lesson06.teach.every_night:
    title: Ik probeer elke avond vroeg naar bed te gaan
    gloss: Ik probeer elke avond vroeg naar bed te gaan.
    note: '*هر شب* is elke avond. Een tijdsaanduiding als *هر شب* kan voor of na *زود* staan; hier komt hij na *که*.'
  prs.a2.unit33.lesson06.teach.dlg_turn01:
    title: Yasin vraagt waarom Najiba niet kwam
    gloss: Najiba, waarom ben je gisteren niet naar de sportschool gekomen?
    note: '*چرا* vraagt waarom en *نیامدی* is je kwam niet. *به باشگاه* is naar de sportschool.'
  prs.a2.unit33.lesson06.teach.dlg_turn02:
    title: Najiba zegt wat ze vergat
    gloss: Ik vergat vroeg naar bed te gaan, dus ik werd 's ochtends laat wakker.
    note: '*فراموش کردم که زود بخوابم* is de reden, met de conjunctief *بخوابم*. *پس* (dus) leidt het gevolg in: *صبح دیر بیدار شدم*.'
  prs.a2.unit33.lesson06.teach.dlg_turn03:
    title: Yasin vraagt naar vandaag
    gloss: Kom je vandaag?
