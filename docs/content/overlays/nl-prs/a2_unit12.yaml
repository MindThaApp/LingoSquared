  prs.a2.unit12.lesson02.exercise01.recognize_headache_severe_since:
    instruction: Welke zin beschrijft een heftige hoofdpijn van twee dagen?
    correct_option: Mijn hoofdpijn is erg heftig en begon twee dagen geleden.
    distractors:
