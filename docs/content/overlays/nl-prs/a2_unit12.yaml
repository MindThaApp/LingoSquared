course:
  title: Dari A2
  description: 'Dari (Afghanistan) voor lager-gevorderden: een doktersbezoek — woordenschat, een symptoom nauwkeurig beschrijven, een afspraakbevestiging lezen en het bezoek zelf.'
units:
  prs.a2.unit12.doctor:
    title: Naar de dokter
lessons:
  prs.a2.unit12.lesson01.doctor_vocabulary:
    title: Woorden voor een doktersbezoek
  prs.a2.unit12.lesson02.describing_a_symptom:
    title: Een symptoom beschrijven
  prs.a2.unit12.lesson03.reading_an_appointment_confirmation:
    title: Een afspraakbevestiging lezen
  prs.a2.unit12.lesson04.doctor_visit_dialogue:
    title: Het doktersbezoek
teaching:
  prs.a2.unit12.lesson01.teach.symptom_word:
    title: Symptoom
    gloss: symptoom
    note: '*علامت* is het algemene woord voor een symptoom of teken van ziekte.'
    example_gloss: Bashirs symptoom is hoofdpijn.
  prs.a2.unit12.lesson01.teach.duration_word:
    title: Duur
    gloss: duur / tijdsduur
    note: '*مدت* vraagt of noemt hoe lang iets duurt of heeft geduurd.'
    example_gloss: Mijn ziekte duurt twee dagen.
  prs.a2.unit12.lesson01.teach.severe_word:
    title: Ernstig
    gloss: hevig / ernstig
    note: '*شدید* beschrijft een sterk of hevig symptoom.'
    example_gloss: Mijn hoofdpijn is erg hevig.
  prs.a2.unit12.lesson01.teach.exam_word:
    title: Medisch onderzoek
    gloss: medisch onderzoek / test
    note: '*آزمایش* is een medisch onderzoek, zoals een bloedtest.'
    example_gloss: De dokter wil een bloedtest.
  prs.a2.unit12.lesson01.teach.prescription_slip_word:
    title: Recept
    gloss: recept (het briefje)
    note: '*نسخه* is het geschreven receptbriefje zelf.'
    example_gloss: De dokter schreef een recept voor me uit.
  prs.a2.unit12.lesson01.teach.prescribe_word:
    title: Voorschrijven
    gloss: voorschrijven
    note: '*تجویز* is het voorschrijven van een medicijn of behandeling.'
    example_gloss: De dokter schreef een nieuw medicijn voor.
  prs.a2.unit12.lesson01.teach.since_ago_grammar:
    title: Sinds ... geleden, met از ... پیش
    gloss: sinds twee dagen geleden
    note: '*از ... پیش* – ''sinds ... geleden'' – gebruik je om aan te geven hoe lang een klacht al duurt.'
    target_text: از دو روز پیش (sinds twee dagen)
  prs.a2.unit12.lesson02.teach.headache_severe_since:
    title: Een ernstige, aanhoudende klacht beschrijven
    gloss: Mijn hoofdpijn is erg heftig en begon twee dagen geleden.
    note: Combineert *شدید* (heftig) met het duurpatroon *از ... پیش*.
  prs.a2.unit12.lesson02.teach.need_test_question:
    title: Vragen of een onderzoek nodig is
    gloss: Moet ik voor dit probleem een onderzoek laten doen?
    note: '*آیا* leidt een ja/nee-vraag in; *باید* betekent ''moeten''.'
  prs.a2.unit12.lesson02.teach.take_medicine_twice:
    title: Zeggen hoe je het medicijn moet innemen
    gloss: Ik moet dit medicijn twee keer per dag innemen.
    note: '*روزی دو بار* betekent ''twee keer per dag'' – letterlijk ''twee keer per dag''.'
  prs.a2.unit12.lesson03.teach.confirmation_word:
    title: Bevestiging
    gloss: bevestiging
    note: '*تاییدی* is een schriftelijke bevestiging, bijvoorbeeld van een afspraak.'
    example_gloss: De bevestiging van mijn afspraak is aangekomen.
  prs.a2.unit12.lesson03.teach.checkup_word:
    title: Onderzoek / controle
    gloss: onderzoek / controle
    note: '*معاینه* is het lichamelijk onderzoek door de dokter zelf.'
    example_gloss: De dokter deed een kort onderzoek.
  prs.a2.unit12.lesson03.teach.notice_text:
    title: Een bevestiging van een afspraak
    gloss: Uw afspraak bij de dokter is op woensdag om negen uur 's ochtends. Neem uw tazkera (identiteitsboekje) mee. Kunt u niet komen, bel dan een dag van tevoren.
    note: Een korte officiële afspraakmelding, in het formele schriftelijke register dat in deze unit aan bod komt.
  prs.a2.unit12.lesson04.teach.turn01:
    title: De dokter begroet بشیر
    gloss: De dokter begroet hem en vraagt welk probleem hij heeft.
    note: '*چطور استین؟* is de beleefde begroetingsvraag ''hoe gaat het met u?''.'
  prs.a2.unit12.lesson04.teach.turn02:
    title: بشیر begroet terug en noemt zijn klacht
    gloss: Hij begroet de dokter respectvol en zegt dat zijn hoofdpijn erg heftig is.
    note: '*داکتر صاحب* is de respectvolle Afghaanse aanspreekvorm voor een dokter.'
  prs.a2.unit12.lesson04.teach.turn03:
    title: De dokter vraagt sinds wanneer
    gloss: De dokter vraagt sinds wanneer het begonnen is.
    note: '*از کی...؟* vraagt ''sinds wanneer''.'
  prs.a2.unit12.lesson04.teach.turn04:
    title: بشیر antwoordt
    gloss: Sinds twee dagen geleden.
    note: Gebruikt het duurpatroon *از ... پیش* ('sinds ... geleden').
  prs.a2.unit12.lesson04.teach.turn05:
    title: De dokter vraagt naar koorts
    gloss: De dokter vraagt of hij ook koorts heeft.
    note: '*آیا ... هم ...؟* vraagt ''is er ook ...?''.'
  prs.a2.unit12.lesson04.teach.turn06:
    title: بشیر bevestigt dat hij lichte koorts heeft
    gloss: Ja, hij heeft een beetje koorts.
    note: '*یک‌کمی* betekent ''een beetje''.'
  prs.a2.unit12.lesson04.teach.turn07:
    title: De dokter geeft instructies
    gloss: Hij moet dit medicijn twee keer per dag innemen. Als hij niet beter wordt, moet hij terugkomen.
    note: '*اگر بهتر نشدین، دوباره بیایین* – ''als u niet beter wordt, komt u terug'' – gebruikt het voorwaardelijke patroon met *اگر* (''als'').'
  prs.a2.unit12.lesson04.teach.turn08:
    title: بشیر bedankt de dokter
    gloss: بشیر bedankt de dokter respectvol.
    note: '*داکتر صاحب* spreekt de dokter opnieuw respectvol aan.'
