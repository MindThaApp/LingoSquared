  prs.a2.unit12.lesson04.exercise05.dialogue_response_as_bashir:
    instruction: 'De dokter vraagt: ''Hoe gaat het met u? Welk probleem hebt u?'' Antwoord als بشیر: groet de dokter respectvol en noem je klacht.'
    accepted_answers:
    - value: سلام داکتر صاحب. سردردم خیلی شدید است.
      status: correct
    - value: سلام داکتر صاحب، سردردم خیلی شدید است.
      status: correct
    feedback: '*سلام داکتر صاحب. سردردم خیلی شدید است.* groet de dokter en noemt de klacht; een komma is hier net zo natuurlijk als een punt.'
  prs.a2.unit12.lesson04.exercise06.write_doctor_instruction:
