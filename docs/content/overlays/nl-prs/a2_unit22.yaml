course:
  title: Dari A2
  description: 'Afghaans Dari voor wie al wat verder is: stap voor stap vertellen hoe een ochtend of een reis verliep, ook een stap die je hebt overgeslagen. Samengestelde werkwoorden in de verleden tijd, hun ontkenning bij het hulpwerkwoord, de plaats van را en de verbindingswoorden اول، بعد، بعد از آن، در آخر.'
units:
  prs.a2.unit22.busy_morning:
    title: Een drukke ochtend
lessons:
  prs.a2.unit22.lesson01.morning_words_and_compound_verbs:
    title: Ochtendwoorden en samengestelde werkwoorden
  prs.a2.unit22.lesson02.more_compound_verbs:
    title: Meer samengestelde werkwoorden
  prs.a2.unit22.lesson03.negative_compound_verbs:
    title: Samengestelde werkwoorden ontkennen, en waar را komt
  prs.a2.unit22.lesson04.telling_in_order:
    title: Op volgorde vertellen
  prs.a2.unit22.lesson05.reading_and_listening:
    title: 'Lezen en luisteren: een drukke ochtend'
  prs.a2.unit22.lesson06.morning_conversation:
    title: Een gesprek over de ochtend
teaching:
  prs.a2.unit22.lesson01.teach.this_morning:
    title: Vanochtend
    gloss: vanochtend
    note: '*امروز* is vandaag en *صبح* is ochtend. Samen is *امروز صبح* vanochtend, het tijdsbestek van deze unit. In een Dari-zin staat het tijdwoord vooraan en het werkwoord achteraan.'
    example_gloss: Vanochtend ging ik naar kantoor.
  prs.a2.unit22.lesson01.teach.late_early:
    title: Laat, vroeg
    gloss: laat, vroeg
    note: '*دیر* betekent laat en *زود* betekent vroeg. Beide staan voor het werkwoordsgedeelte van de zin, vlak voor het werkwoord.'
    example_gloss:
    - Vanochtend werd ik laat wakker.
    - Vandaag werd hij vroeg wakker.
  prs.a2.unit22.lesson01.teach.office:
    title: Kantoor
    gloss: kantoor
    note: '*دفتر* is het kantoor, de plek waar in Kabul veel mensen op doordeweekse ochtenden werken.'
    example_gloss: '''s Ochtends ging ik naar kantoor.'
  prs.a2.unit22.lesson01.teach.school:
    title: School
    gloss: school
    note: '*مکتب* is het gewone Afghaanse woord voor school. Je gaat ernaartoe met *به*, zoals in *به مکتب رفتم*.'
    example_gloss: Hij ging 's ochtends naar school.
  prs.a2.unit22.lesson01.teach.by_bus_car:
    title: Met de bus, met de auto
    gloss: met de bus, met de auto
    note: '*با* betekent met. *با بس* is met de bus en *با موتر* is met de auto. *بس* is de bus en *موتر* is het Afghaanse woord voor een auto.'
    example_gloss:
    - Ik ging met de bus naar kantoor.
    - We gingen met de auto naar school.
  prs.a2.unit22.lesson01.teach.on_foot:
    title: Te voet
    gloss: te voet, lopend
    note: '*پیاده* betekent te voet. *پیاده رفتن* is te voet gaan, naar een plek lopen, en *پیاده* staat vlak voor het werkwoord.'
    example_gloss: Ik ging te voet naar school.
  prs.a2.unit22.lesson01.teach.bus_stop:
    title: Bushalte, station
    gloss: bushalte, halte
    note: '*ایستگاه* is een halte of station. *ایستگاه بس* is een bushalte.'
    example_gloss: Ik ging naar de bushalte.
  prs.a2.unit22.lesson01.teach.gate:
    title: Poort, deur
    gloss: poort, buitendeur van een huis
    note: '*دروازه* is de poort of de buitendeur van een huis. Je opent hem elke ochtend, dus je ziet hem in de volgende lessen terug met het woordje *را*.'
    example_gloss: Ik opende de poort.
  prs.a2.unit22.lesson01.teach.clothes:
    title: Mijn kleren
    gloss: mijn kleren
    note: '*لباس* is kleding, *لباس‌ها* is kleren (het meervoudsuitgang *-ها* wordt met een klein spatiegat vastgemaakt), en *-م* voegt mijn toe: *لباس‌هایم* is mijn kleren.'
    example_gloss: Ik trok mijn kleren aan.
  prs.a2.unit22.lesson01.teach.shower:
    title: Douche
    gloss: douche
    note: '*دوش* is een douche. Je zegt niet een douche wassen: je neemt hem, met het werkwoord *گرفتن*, dat je in de volgende les leert kennen.'
    example_gloss: '''s Ochtends nam ik een douche.'
  prs.a2.unit22.lesson01.teach.tea:
    title: Thee
    gloss: thee
    note: '*چای* is thee, de gebruikelijke ochtenddrank. In het Dari eet je thee, dus het werkwoord is *خوردن*.'
    example_gloss: '''s Ochtends dronk ik thee.'
  prs.a2.unit22.lesson01.teach.breakfast:
    title: Ontbijt
    gloss: het ontbijt
    note: '*صبحانه* is ontbijt. In Kabul hoor je voor dezelfde maaltijd ook *ناشتا*; in deze cursus gebruiken we *صبحانه*.'
    example_gloss: Als ontbijt at ik brood en dronk ik thee.
  prs.a2.unit22.lesson01.teach.wake_up:
    title: Wakker worden
    gloss: 'wakker worden (letterlijk: wakker worden)'
    note: '*بیدار* betekent wakker en *شدن* betekent worden. Samen is *بیدار شدن* wakker worden. Dit is een samengesteld werkwoord: een woord dat geen werkwoord is (hier een bijvoeglijk naamwoord) plus een hulpwerkwoord.'
    example_gloss: Vanochtend werd ik wakker.
  prs.a2.unit22.lesson01.teach.get_ready:
    title: Zich klaarmaken
    gloss: 'zich klaarmaken (letterlijk: klaar worden)'
    note: '*آماده* betekent klaar en *شدن* betekent worden. *آماده شدن* is zich klaarmaken, een tweede samengesteld werkwoord met *شدن*.'
    example_gloss: Vanochtend maakte ik me klaar.
  prs.a2.unit22.lesson01.teach.open:
    title: Openen
    gloss: 'openen (letterlijk: open maken)'
    note: '*باز* betekent open en *کردن* betekent doen of maken. *باز کردن* is openen. Het is een samengesteld werkwoord met *کردن*: je maakt iets open.'
    example_gloss: Ik opende de poort.
  prs.a2.unit22.lesson01.teach.went_office:
    title: Ik ging naar kantoor
    gloss: Ik ging naar kantoor.
    note: '*رفتم* is de enkelvoudige verleden tijd van *رفتن* uit unit 19: verleden stam *رفت* plus *-م*. *به* is naar, dus *به دفتر رفتم* is ik ging naar kantoor.'
  prs.a2.unit22.lesson01.teach.opened_gate:
    title: ik opende de poort
    gloss: Ik opende de poort.
    note: '*را* is een klein woord dat een bepaald lijdend voorwerp markeert, hier de poort. Leer de hele zin voorlopig uit je hoofd. Les 3 legt precies uit waar *را* komt.'
  prs.a2.unit22.lesson01.teach.compound_rule:
    title: 'Samengestelde werkwoorden in de verleden tijd: de uitgang komt op het hulpwerkwoord'
    gloss: ik werd wakker, jij werd wakker, hij/zij werd wakker, wij werden wakker, u/jullie werd(en) wakker, zij werden wakker
    note: 'Veel alledaagse werkwoorden in het Dari zijn samengestelde werkwoorden: een zelfstandig naamwoord of bijvoeglijk naamwoord plus een hulpwerkwoord zoals *شدن* of *کردن*. *بیدار شدن* (wakker worden), *آماده شدن* (je klaarmaken) en *باز کردن* (openen) zijn allemaal samengestelde werkwoorden. In de enkelvoudige verleden tijd verandert het eerste deel nooit. Alleen het hulpwerkwoord krijgt de verledentijdsuitgang die je al kent van *رفتم*: neem de infinitief, laat *ن* weg (*شدن* wordt *شد*) en voeg dan *-م، -ی، nothing، -یم، -ین، -ند* toe. Dus *بیدار شدم* is ik werd wakker, *بیدار شدی* is jij werd wakker (tegen een vriend), *بیدار شد* is hij of zij werd wakker, *بیدار شدیم* is wij werden wakker, *بیدار شدین* is jullie werden wakker of u werd wakker (beleefd of meervoud) en *بیدار شدند* is zij werden wakker. Het voornaamwoord is optioneel, omdat de uitgang al laat zien wie het deed.'
  prs.a2.unit22.lesson02.teach.take_shower:
    title: Douchen
    gloss: douchen
    note: '*دوش گرفتن* is een douche nemen. Het hulpwerkwoord is hier *گرفتن*, nemen of krijgen. De verleden stam is *گرفت*, dus ik nam een douche is *دوش گرفتم*.'
    example_gloss: Vanochtend nam ik een douche.
  prs.a2.unit22.lesson02.teach.take_walk:
    title: Een wandeling maken
    gloss: een wandeling maken, wandelen
    note: '*قدم* is een stap. *قدم زدن* is een wandeling maken, voor je plezier en zonder doel. Het hulpwerkwoord is *زدن* en de verleden stam is *زد*: *قدم زدم* is ik maakte een wandeling. Vergelijk *پیاده رفتن*, naar een plek lopen.'
    example_gloss: Ik maakte een wandeling in het park.
  prs.a2.unit22.lesson02.teach.talk:
    title: Praten, spreken
    gloss: praten, spreken
    note: '*حرف* is een woord of een gesprek. *حرف زدن* is praten, opnieuw met *زدن*: *حرف زدم* is ik heb gepraat.'
    example_gloss: Ik heb met mijn vriend gepraat.
  prs.a2.unit22.lesson02.teach.my_friend:
    title: Mijn vriend
    gloss: mijn vriend
    note: '*دوست* is een vriend en *-م* voegt ''mijn'' toe: *دوستم* is mijn vriend. Zet *به* ervoor als je hem of haar belt: *به دوستم*.'
    example_gloss: Vanochtend heb ik met mijn vriend gepraat.
  prs.a2.unit22.lesson02.teach.phone:
    title: Bellen
    gloss: bellen, telefoneren
    note: '*تیلفون* is de telefoon. *تیلفون کردن* is bellen, ook een samengesteld werkwoord met *کردن*. De persoon die je belt komt met *به*: *به دوستم تیلفون کردم*.'
    example_gloss: Ik heb mijn vriend gebeld.
  prs.a2.unit22.lesson02.teach.wait:
    title: Wachten
    gloss: 'wachten (letterlijk: een wachttijd trekken)'
    note: '*انتظار* is het wachten. *انتظار کشیدن* is wachten. Het hulpwerkwoord is *کشیدن*, trekken, en de verleden stam is *کشید*: *انتظار کشیدم* is ik heb gewacht.'
    example_gloss: Ik heb bij de halte gewacht.
  prs.a2.unit22.lesson02.teach.get_on:
    title: Instappen
    gloss: instappen (in een bus, een auto)
    note: '*سوار* betekent ''aan boord'' en *شدن* betekent worden. *سوار شدن* is instappen in een bus of auto. Wat je instapt komt met *به*: *به بس سوار شدم*.'
    example_gloss: Ik ben in de bus gestapt.
  prs.a2.unit22.lesson02.teach.get_off:
    title: Uitstappen
    gloss: uitstappen
    note: '*پیاده شدن* is uitstappen uit een bus of auto. Let op: *پیاده رفتم* is ik ging te voet en *پیاده شدم* is ik ben uitgestapt. Het voertuig dat je verlaat komt met *از*: *از بس پیاده شدم*.'
    example_gloss: Ik ben uit de bus gestapt.
  prs.a2.unit22.lesson02.teach.put_on:
    title: Aantrekken, dragen
    gloss: aantrekken (kleren), dragen
    note: '*پوشیدن* is kleren aantrekken. Het is een enkelvoudig werkwoord, geen samengesteld: de verleden stam is *پوشید*, dus *پوشیدم* is ik trok aan.'
    example_gloss: Ik trok mijn kleren aan.
  prs.a2.unit22.lesson02.teach.close:
    title: Sluiten
    gloss: sluiten, dichtdoen
    note: '*بستن* is sluiten of dichtdoen. Het is een enkelvoudig werkwoord met de verleden stam *بست*, dus *بستم* is ik sloot. Het is het tegenovergestelde van *باز کردن*.'
    example_gloss: Ik heb de poort gesloten.
  prs.a2.unit22.lesson02.teach.arrive:
    title: Aankomen
    gloss: aankomen, bereiken
    note: '*رسیدن* is aankomen. De plaats die je bereikt komt met *به*, en de verleden stam is *رسید*: *به دفتر رسیدم* is ik kwam aan op kantoor.'
    example_gloss: Ik kwam aan op kantoor.
  prs.a2.unit22.lesson02.teach.light_verbs:
    title: Vijf hulpwerkwoorden en hun verleden stammen
    gloss: ik werd wakker, ik deed open, ik nam een douche, ik maakte een wandeling, ik wachtte
    note: 'Een samengesteld werkwoord krijgt zijn betekenis van beide delen, dus leer het hulpwerkwoord samen met het eerste deel. Met deze vijf hulpwerkwoorden maak je de meeste samengestelde werkwoorden van een ochtend. *شدن* (verleden stam *شد*) betekent worden: *بیدار شدم*, *سوار شدم*. *کردن* (*کرد*) betekent doen of maken: *باز کردم*, *تیلفون کردم*. *گرفتن* (*گرفت*) betekent nemen: *دوش گرفتم*. *زدن* (*زد*) betekent slaan, maar in samenstellingen draagt het alleen de handeling: *قدم زدم*, *حرف زدم*. *کشیدن* (*کشید*) betekent trekken: *انتظار کشیدم*. Het einde wordt aan de stam van het hulpwerkwoord toegevoegd, net als bij *رفتم*. Enkelvoudige werkwoorden zoals *پوشیدن* (*پوشیدم*), *بستن* (*بستم*) en *رسیدن* (*رسیدم*) krijgen dezelfde uitgangen.'
  prs.a2.unit22.lesson03.teach.neg_rule:
    title: 'Een samengesteld werkwoord ontkennen: de ن komt op het hulpwerkwoord'
    gloss: ik werd niet wakker, jij werd niet wakker, hij/zij werd niet wakker, wij werden niet wakker, u/jullie werden niet wakker, zij werden niet wakker
    note: 'In les 19 zette je *ن* voor een werkwoord in de verleden tijd: *رفتم* werd *نرفتم*. Een samengesteld werkwoord bestaat uit twee delen en de *ن* komt op het hulpwerkwoord, nooit op het eerste deel. *بیدار شدم* (ik werd wakker) wordt *بیدار نشدم* (ik werd niet wakker), en de zes vormen zijn *بیدار نشدم، بیدار نشدی، بیدار نشد، بیدار نشدیم، بیدار نشدین، بیدار نشدند*. Dezelfde regel geldt voor elk hulpwerkwoord: *نکردم، نگرفتم، نزدم، نکشیدم*. *نبیدار شدم* schrijven is fout. Enkelvoudige werkwoorden werken zoals eerder: *نپوشیدم، نبستم، نرسیدم*. In de ontkennende verleden tijd komt nog steeds geen *نمی* voor.'
  prs.a2.unit22.lesson03.teach.neg_phone_walk:
    title: Dezelfde ن met vijf hulpwerkwoorden
    gloss: ik heb niet gebeld, ik heb niet gewandeld, ik heb niet gewacht, ik heb geen douche genomen, ik heb niet opengedaan
    note: 'Kijk naar de vijf hulpwerkwoorden uit de vorige les en zet *ن* op elk ervan: *کردم* wordt *نکردم* (*تیلفون نکردم*, *باز نکردم*), *زدم* wordt *نزدم* (*قدم نزدم*), *کشیدم* wordt *نکشیدم* (*انتظار نکشیدم*), *گرفتم* wordt *نگرفتم* (*دوش نگرفتم*). Het eerste deel blijft staan waar het stond en het werkwoord erna is ontkennend.'
  prs.a2.unit22.lesson03.teach.no_breakfast:
    title: Ik heb geen ontbijt gegeten
    gloss: Ik heb geen ontbijt gegeten.
    note: '*نخوردم* is *ن* plus *خوردم*. *خوردن* is een enkelvoudig werkwoord, dus de *ن* staat voor het hele werkwoord. In les 19 leerde je *خوردی*, jij at, tegen een vriend: *صبحانه خوردی؟* is heb je ontbeten?'
  prs.a2.unit22.lesson03.teach.on_time:
    title: Op tijd
    gloss: op tijd
    note: '*وقت* is tijd. *به وقت* is op tijd. Het staat voor het werkwoord, dus *به وقت بیدار نشدم* is ik werd niet op tijd wakker.'
    example_gloss: Vanochtend werd ik niet op tijd wakker.
  prs.a2.unit22.lesson03.teach.make_tea:
    title: Maken, klaarmaken
    gloss: 'maken, klaarmaken (letterlijk: goed maken)'
    note: '*درست* betekent goed of juist, en *درست کردن* betekent iets maken of klaarmaken, zoals thee of eten. Het is een samengesteld werkwoord met *کردن*. Het object staat ervoor: *چای درست کردم*.'
    example_gloss: Ik heb thee gezet.
  prs.a2.unit22.lesson03.teach.ra_rule:
    title: Waar را staat voor een samengesteld werkwoord
    gloss: Ik deed de poort open. Ik deed de poort niet open. Ik trok mijn kleren niet aan. Ik zette thee.
    note: 'Als het object van het werkwoord iets bepaalds is, iets bekends of specifieks (*دروازه*, de poort die je elke ochtend opent, of *لباس‌هایم*, je eigen kleren), markeert het Dari dat met *را*. In een samengesteld werkwoord komt *را* direct na het object en vóór het eerste deel van het werkwoord: *دروازه را باز کردم*, nooit midden in *باز کردم*. Het samengestelde werkwoord blijft bij elkaar, en de ontkenning volgt dezelfde regel als eerder: *دروازه را باز نکردم*. Als het object niet specifiek is, zoals in *چای درست کردم* (ik zette thee, wat thee), staat er geen *را*.'
  prs.a2.unit22.lesson04.teach.first:
    title: Eerst
    gloss: eerst
    note: '*اول* opent een reeks. Het staat aan het begin van de eerste zin of zinsdeel.'
    example_gloss: Eerst nam ik een douche.
  prs.a2.unit22.lesson04.teach.then:
    title: Dan
    gloss: dan, daarna
    note: '*بعد* zet de reeks voort na *اول*. Het staat aan het begin van het zinsdeel dat het inleidt.'
    example_gloss: Daarna trok ik mijn kleren aan.
  prs.a2.unit22.lesson04.teach.after_that:
    title: Daarna
    gloss: daarna
    note: '*بعد از آن* betekent daarna. Het is een iets uitgebreidere *بعد* en handig als je *بعد* al hebt gebruikt en nog een derde stap hebt.'
    example_gloss: Daarna sloot ik de poort.
  prs.a2.unit22.lesson04.teach.finally:
    title: Tot slot
    gloss: tot slot, uiteindelijk
    note: '*در آخر* sluit een reeks af, na *اول*، *بعد* en *بعد از آن*. *آخر* betekent het einde.'
    example_gloss: Uiteindelijk kwam ik aan op kantoor.
  prs.a2.unit22.lesson04.teach.but:
    title: Maar
    gloss: maar
    note: '*ولی* zet een stap die je deed tegenover een stap die je niet deed, of andersom.'
    example_gloss: Ik heb niet ontbeten, maar ik heb wel thee gedronken.
  prs.a2.unit22.lesson04.teach.no:
    title: Nee
    gloss: nee
    note: '*نخیر* is het beleefde, alledaagse nee om een ja/nee-vraag te beantwoorden. Tussen vrienden hoor je ook de kortere vorm *نی*.'
    example_gloss: Nee, ik heb niet gebeld.
  prs.a2.unit22.lesson04.teach.start_work:
    title: Beginnen, starten
    gloss: beginnen, starten
    note: '*شروع* is een begin en *شروع کردن* is beginnen. Het is een samengesteld werkwoord met *کردن*, en *کار* is werk: *کار را شروع کردم* is ik begon met werken.'
    example_gloss: Ik begon met werken.
  prs.a2.unit22.lesson04.teach.order_rule:
    title: Een ochtend in volgorde vertellen
    gloss: Eerst nam ik een douche, toen trok ik mijn kleren aan, daarna deed ik de poort open en tot slot liep ik naar kantoor.
    note: 'Om te vertellen hoe een ochtend verliep, geef je elke afgeronde stap een eigen werkwoord in de verleden tijd en geef je de volgorde aan met *اول* (eerst), *بعد* (dan), *بعد از آن* (daarna) en *در آخر* (tot slot). De stappen staan in de volgorde waarin ze gebeurden. Verbind ze met een komma, een punt of *و*: *اول دوش گرفتم، بعد لباس‌هایم را پوشیدم.* Om een stap toe te voegen die niet gebeurde, gebruik je een ontkennend samengesteld werkwoord: *بعد از آن تیلفون نکردم.* Het verbindingswoord staat aan het begin van zijn zinsdeel en het werkwoord blijft aan het einde.'
  prs.a2.unit22.lesson05.teach.way:
    title: Weg
    gloss: weg, route; onderweg (met در)
    note: '*راه* is de weg of de route. *در راه* is onderweg. Het zegt waar in de reis iets gebeurde.'
    example_gloss: Onderweg hebben we gepraat.
  prs.a2.unit22.lesson05.teach.we_form:
    title: 'Samen iets doen: de wij-uitgang -یم'
    gloss: Met mijn vriend liepen we naar school. Onderweg hebben we gepraat. Uiteindelijk kwamen we aan op school.
    note: 'Als een vriend de stappen met jou doet, verander je de uitgang van *-م* in *-یم*: *رفتیم* (wij gingen), *حرف زدیم* (wij praatten), *رسیدیم* (wij kwamen aan). In een samengesteld werkwoord komt de uitgang nog steeds alleen op het hulpwerkwoord: *حرف زدیم*, niet *حرف‌یم زد*. De ontkenning werkt hetzelfde: *حرف نزدیم* is wij praatten niet.'
  prs.a2.unit22.lesson05.teach.message:
    title: Soraya schrijft over haar ochtend
    gloss: Vanochtend werd ik vroeg wakker. Eerst nam ik een douche en trok ik mijn kleren aan. Toen at ik ontbijt, maar ik zette geen thee. Daarna deed ik de poort open. Met mijn vriend liep ik naar school. Onderweg hebben we gepraat. Uiteindelijk kwamen we aan op school.
    note: 'Een kort geschreven verslag, in volgorde. Elke stap is een afgeronde handeling met een werkwoord in de verleden tijd; de samengestelde werkwoorden *بیدار شدم*, *دوش گرفتم*, *حرف زدیم* en de ontkenning *درست نکردم* hebben allemaal het hulpwerkwoord achteraan. Eén stap gebeurde niet: *چای درست نکردم*.'
  prs.a2.unit22.lesson05.teach.exchange_q:
    title: Naveed vraagt Soraya naar de thee
    gloss: Soraya, heb je vanochtend thee gezet?
    note: 'Naveed stelt de vraag met de verleden tijd van een samengesteld werkwoord, *درست کردی*, de jij-vorm (vriend): de uitgang *-ی* staat op het hulpwerkwoord.'
  prs.a2.unit22.lesson05.teach.exchange_a:
    title: Soraya antwoordt
    gloss: Nee, ik heb geen thee gezet. Ik heb ontbeten.
    note: Soraya zegt eerst wat er niet gebeurde, *چای درست نکردم*, en dan wat wel, *صبحانه خوردم*.
  prs.a2.unit22.lesson06.teach.turn01:
    title: Soraya vraagt Naveed naar zijn ochtend
    gloss: Naveed, wat heb je vanochtend gedaan?
    note: '*چه کار کردی؟* is wat heb je gedaan? Het vraagt naar een afgeronde handeling, dus het gebruikt de verleden tijd *کردی*.'
  prs.a2.unit22.lesson06.teach.turn02:
    title: Naveed noemt de eerste stappen en een stap die hij oversloeg
    gloss: Eerst werd ik laat wakker, toen nam ik een douche en trok ik mijn kleren aan. Ik heb niet ontbeten.
    note: Naveed gebruikt *اول* en *بعد* voor de volgorde en eindigt met een ontkennende stap, *صبحانه نخوردم*.
  prs.a2.unit22.lesson06.teach.turn03:
    title: Soraya vraagt wat er daarna kwam
    gloss: Wat heb je daarna gedaan?
    note: '*بعد از آن* is daarna, dus ze vraagt naar de volgende stap.'
  prs.a2.unit22.lesson06.teach.turn04:
    title: Naveed vertelt hoe hij naar zijn werk ging
    gloss: Ik deed de poort open en liep naar de bushalte. Bij de halte wachtte ik en stapte ik in de bus.
    note: 'Vier afgeronde stappen met vier werkwoorden in de verleden tijd: *باز کردم، رفتم، انتظار کشیدم، سوار شدم*. Let op *دروازه را باز کردم*: *را* komt direct na het object.'
  prs.a2.unit22.lesson06.teach.turn05:
    title: Soraya vraagt naar het telefoontje
    gloss: Heb je me gebeld?
    note: Een ja/nee-vraag over een afgeronde handeling. *به من* is naar mij, aan mij.
  prs.a2.unit22.lesson06.teach.turn06:
