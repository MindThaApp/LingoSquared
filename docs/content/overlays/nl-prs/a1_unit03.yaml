  prs.a1.unit03.lesson01.teach.father:
    title: Vader
    gloss: vader
    note: پدر is het neutrale Dari-woord voor vader.
    example_gloss: Mijn vader is arts.
  prs.a1.unit03.lesson01.teach.brother:
    title: Broer
    gloss: broer
    note: برادر betekent broer.
    example_gloss: Ik heb één broer.
  prs.a1.unit03.lesson01.teach.sister:
    title: Zus
    gloss: zus
    note: خواهر betekent zus.
    example_gloss: Mijn zus is lerares.
  prs.a1.unit03.lesson01.teach.parents:
    title: Ouders
    gloss: vader en moeder; ouders
    note: In het Dari zegt men meestal پدر و مادر als men over zijn ouders praat.
    example_gloss: Mijn ouders wonen in Kabul.
  prs.a1.unit03.lesson01.teach.my_mother:
    title: Je moeder aanwijzen
    gloss: Dit is mijn moeder.
    note: Het achtervoegsel ـم in مادرم betekent mijn.
  prs.a1.unit03.lesson02.teach.grandfather:
    title: Grootvader
    gloss: opa
    note: 'پدرکلان is de gebruikelijke Afghaanse Dari-term; letterlijk: grote of oudere vader.'
    example_gloss: Mijn opa is oud.
  prs.a1.unit03.lesson02.teach.grandmother:
    title: Grootmoeder
    gloss: oma
    note: 'مادرکلان is de gebruikelijke Afghaanse Dari-term; letterlijk: grote of oudere moeder.'
    example_gloss: Mijn oma is aardig.
  prs.a1.unit03.lesson02.teach.paternal_uncle:
    title: Broer van je vader
    gloss: oom van vaderskant
    note: کاکا verwijst specifiek naar de broer van je vader.
    example_gloss: Mijn oom woont in Herat.
  prs.a1.unit03.lesson02.teach.paternal_aunt:
    title: Zus van je vader
    gloss: tante van vaderskant
    note: عمه verwijst specifiek naar de zus van je vader.
    example_gloss: Mijn tante is lerares.
  prs.a1.unit03.lesson02.teach.maternal_uncle:
    title: Broer van je moeder
    gloss: oom van moederskant
    note: ماما verwijst in het Dari specifiek naar de broer van je moeder.
    example_gloss: Mijn oom (van moederskant) is ingenieur.
  prs.a1.unit03.lesson02.teach.maternal_aunt:
    title: Zus van je moeder
    gloss: tante van moederskant
    note: خاله verwijst specifiek naar de zus van je moeder.
    example_gloss: Mijn tante (van moederskant) woont in Kabul.
  prs.a1.unit03.lesson02.teach.side_distinction:
    title: Houd de twee kanten van de familie uit elkaar
    gloss: Kaka en amma horen bij vaderskant; mama en khala bij moederskant.
    note: Het Nederlandse oom en tante geven niet aan van welke kant van de familie iemand is, terwijl deze vier Dari-woorden dat wel doen.
  prs.a1.unit03.lesson03.teach.family:
    title: Familie
    gloss: familie
    note: فامیل is het gewone Afghaanse Dari-woord voor familie.
    example_gloss: Mijn familie is groot.
  prs.a1.unit03.lesson03.teach.how_many_people:
    title: Beleefd vragen naar de grootte van het gezin
    gloss: Hoeveel personen telt uw familie?
    note: ـتان markeert het beleefde 'uw'; نفر is het telwoord voor personen.
  prs.a1.unit03.lesson03.teach.five_people:
    title: De grootte van je gezin noemen
    gloss: Onze familie bestaat uit vijf personen.
    note: In het Dari geef je de grootte van de familie aan als een aantal personen met نفر است.
  prs.a1.unit03.lesson03.teach.have_siblings:
    title: Je broers en zussen tellen
    gloss: Ik heb één broer en twee zussen.
    note: دارم betekent ik heb. Het zelfstandig naamwoord blijft enkelvoud na een getal.
  prs.a1.unit03.lesson03.teach.only_child:
    title: Enig kind
    gloss: Ik ben enig kind.
    note: استم is de Kabuli Dari-vorm voor de eerste persoon die in deze cursus wordt geleerd.
  prs.a1.unit03.lesson03.teach.possession:
    title: Vormen van 'hebben'
    gloss: ik heb; wij hebben; u hebt / jullie hebben
    note: دارین is de respectvolle of meervoudsvorm van 'hebben' in het beschaafde, gesproken Dari van Kabul.
  prs.a1.unit03.lesson04.teach.have_siblings_question:
    title: Vragen naar broers en zussen
    gloss: Hebt u broers en zussen?
    note: دارین maakt dit respectvol of meervoudig.
  prs.a1.unit03.lesson04.teach.how_many_siblings:
    title: Vragen hoeveel broers en zussen iemand heeft
    gloss: Hoeveel broers en zussen hebt u?
    note: چند vraagt naar een aantal.
  prs.a1.unit03.lesson04.teach.parents_well:
    title: Vragen naar iemands ouders
    gloss: Gaat het goed met je ouders?
    note: جور استند is een informele Afghaanse manier om te zeggen dat het goed met ze gaat.
  prs.a1.unit03.lesson04.teach.yes_answer:
    title: Bevestigend antwoord
    gloss: Ja, ik heb één broer.
    note: بلی is het beleefde standaardwoord voor 'ja' in Afghanistan.
  prs.a1.unit03.lesson04.teach.no_answer:
    title: Ontkennend antwoord
    gloss: Nee, ik heb geen zus.
    note: نخیر is het respectvolle 'nee'; ندارم betekent 'ik heb niet'.
  prs.a1.unit03.lesson04.teach.polite_your:
    title: Beleefd 'uw'
    gloss: uw familie; uw moeder; uw vader
    note: Het bezittelijke achtervoegsel ـتان is respectvol of meervoud. In deze cursus wordt het met een ZWNJ vastgemaakt.
  prs.a1.unit03.lesson05.teach.married:
    title: Getrouwd
    gloss: getrouwd
    note: متأهل is een neutrale term voor de burgerlijke staat.
    example_gloss: Hij/zij is getrouwd.
  prs.a1.unit03.lesson05.teach.single:
    title: Alleenstaand
    gloss: alleenstaand; ongehuwd
    note: مجرد betekent in deze context ongehuwd.
    example_gloss: Ik ben alleenstaand.
  prs.a1.unit03.lesson05.teach.husband:
    title: Echtgenoot
    gloss: echtgenoot
    note: شوهر is het gewone woord voor echtgenoot.
    example_gloss: Mijn man is ingenieur.
  prs.a1.unit03.lesson05.teach.wife:
    title: Echtgenote
    gloss: echtgenote
    note: خانم kan 'echtgenote' betekenen of een beleefde aanspreekvorm voor een vrouw zijn; de context maakt het onderscheid.
    example_gloss: Mijn vrouw is lerares.
  prs.a1.unit03.lesson05.teach.marriage_question:
    title: Beleefd vragen naar het huwelijk
    gloss: Bent u getrouwd?
    note: 'Letterlijk vraagt dit: ''Hebt u getrouwd?'' Het achtervoegsel ـین is de beleefde vorm in Kabul.'
  prs.a1.unit03.lesson05.teach.married_answer:
    title: Zeggen dat je getrouwd bent
    gloss: Ja, ik ben getrouwd.
    note: استم is de Afghaans-Dari vorm van 'ben' voor de eerste persoon.
  prs.a1.unit03.lesson05.teach.children:
    title: Vragen naar kinderen
    gloss: Heb je kinderen?
    note: اولاد is een gangbaar verzamelwoord voor iemands kind of kinderen.
  prs.a1.unit03.lesson06.teach.turn01:
    title: Maryam vraagt naar de grootte van het gezin
    gloss: Hoeveel personen telt uw gezin?
    note: Maryam gebruikt het respectvolle ـتان.
  prs.a1.unit03.lesson06.teach.turn02:
    title: Fereshteh vertelt over haar broers en zussen
    gloss: We zijn met vijf. Ik heb één broer en één zus.
    note: De gezinsleden worden geteld met نفر.
  prs.a1.unit03.lesson06.teach.turn03:
    title: Maryam vraagt naar het huwelijk
    gloss: Bent u getrouwd?
    note: De vraag is beleefd en neutraal van vorm.
  prs.a1.unit03.lesson06.teach.turn04:
    title: Fereshteh vertelt over haar man
    gloss: Ja, ik ben getrouwd. Mijn man is student.
    note: محصل, en niet het Iraanse دانشجو, is het gangbare Afghaans-Dari woord voor 'student'.
  prs.a1.unit03.lesson06.teach.turn05:
    title: Maryam vraagt naar kinderen
    gloss: Heb je kinderen?
    note: دارین houdt de respectvolle aanspreekvorm vast.
  prs.a1.unit03.lesson06.teach.turn06:
    title: Fereshteh antwoordt
    gloss: Nee, we hebben nog geen kinderen.
    note: نخیر is het respectvolle 'nee'; نداریم betekent 'wij hebben niet'.
