course:
  title: Dari A2
  description: 'Afghaans Dari voor gevorderde beginners: indirect en beleefd om informatie vragen, bijvoorbeeld Weet u waar het station is? Het patroon می‌دانین که ... met een onveranderde ingebedde vraag (waar, wanneer, waarom, welke, hoeveel), Ik weet niet dat ..., ja of nee met یا نه, en het beleefde verzoek می‌توانین بگویین که ... .'
units:
  prs.a2.unit38.asking_indirectly:
    title: Indirect vragen
lessons:
  prs.a2.unit38.lesson01.do_you_know_where:
    title: Weet u waar het station is?
  prs.a2.unit38.lesson02.i_dont_know:
    title: Ik weet niet wanneer de bus vertrekt
  prs.a2.unit38.lesson03.yes_or_no:
    title: Open of niet?
  prs.a2.unit38.lesson04.polite_requests:
    title: Pardon, kunt u mij zeggen ...
  prs.a2.unit38.lesson05.reading_and_listening:
    title: Lezen en luisteren over een museum en een bank
  prs.a2.unit38.lesson06.station_conversation:
    title: Een gesprek op het station
teaching:
  prs.a2.unit38.lesson01.teach.station:
    title: Station
    gloss: station, halte
    note: '*ایستگاه* is een station of een halte. In deze unit vraag je waar plekken zijn, en het station is de eerste: *ایستگاه بس* is het busstation.'
    example_gloss: Het station is in Kabul.
  prs.a2.unit38.lesson01.teach.museum:
    title: Museum
    gloss: museum
    note: '*موزیم* is een museum. Het Nationaal Museum van Afghanistan staat in Kabul.'
    example_gloss: Het museum is in Kabul.
  prs.a2.unit38.lesson01.teach.office:
    title: Kantoor
    gloss: kantoor
    note: '*دفتر* is een kantoor, bijvoorbeeld het paspoortkantoor of het kantoor van een busmaatschappij.'
    example_gloss: Het kantoor is dichtbij.
  prs.a2.unit38.lesson01.teach.library:
    title: Bibliotheek
    gloss: bibliotheek
    note: '*کتابخانه* is een bibliotheek. *نزدیک* betekent dichtbij.'
    example_gloss: De bibliotheek is dichtbij.
  prs.a2.unit38.lesson01.teach.where:
    title: Waar is het?
    gloss: waar is het?
    note: '*کجا* betekent waar, en *کجاست* is waar is het: *کجا* plus de korte vorm van *است*. Zet de plaats voorop: *ایستگاه کجاست؟* is waar is het station?'
    example_gloss: Waar is het museum?
  prs.a2.unit38.lesson01.teach.know:
    title: Weten
    gloss: ik weet
    note: '*دانستن* is iets weten, een feit: *می‌دانم* is ik weet. Gebruik het voor feiten (waar een plek is, wanneer een bus vertrekt), niet om aan te geven dat je iemand kent.'
    example_gloss: Ik weet het.
  prs.a2.unit38.lesson01.teach.know_paradigm:
    title: 'Weten: می‌دانم'
    gloss: ik weet, jij weet, hij/zij weet, wij weten, u weet (beleefd) of jullie weten, zij weten
    note: 'De tegenwoordige tijd van *دانستن* is *می‌* plus de uitgang: *می‌دانم، می‌دانی، می‌داند، می‌دانیم، می‌دانین، می‌دانند*. De uitgang van de tweede persoon meervoud is *-ین*. Tegen een vreemde, een oudere of een groep zeg je *می‌دانین*; tegen een goede vriend zeg je *می‌دانی*. Het voornaamwoord mag je weglaten.'
  prs.a2.unit38.lesson01.teach.direct_to_indirect:
    title: Van directe naar indirecte vraag
    gloss: Waar is het station? Weet u waar het station is?
    note: 'Een indirecte vraag is zachter en beleefder dan een directe. Begin met *می‌دانین که* (weet u dat) en zet daarna de directe vraag erachter zonder iets te veranderen: *ایستگاه کجاست؟* wordt *می‌دانین که ایستگاه کجاست؟*. Het vraagwoord *کجا* blijft op zijn plek, en de woordvolgorde blijft die van een gewone bewering.'
  prs.a2.unit38.lesson01.teach.do_you_know_museum:
    title: Weet u waar het museum is?
    gloss: Weet u waar het museum is?
    note: 'Dit is de modelzin van de unit. *که* (dat) is optioneel: *می‌دانین موزیم کجاست؟* is ook correct. Het vraagteken staat één keer, aan het einde, omdat de hele zin één vraag is.'
  prs.a2.unit38.lesson01.teach.friend_or_polite:
    title: Vriend of beleefd
    gloss: 'Vriend: weet je waar de bibliotheek is? Beleefd: weet u waar de bibliotheek is?'
    note: 'Alleen de uitgang van *دانستن* verandert met de persoon tegen wie je praat: *می‌دانی* voor een vriend, *می‌دانین* voor iemand die je beleefd aanspreekt. Alles na *که* blijft hetzelfde.'
  prs.a2.unit38.lesson02.teach.know_not_know:
    title: Ik weet / ik weet niet
    gloss: Ik weet waar het museum is. Ik weet niet waar het museum is.
    note: 'Hetzelfde patroon werkt voor een bewering. *می‌دانم که* is ik weet dat, en *نمی‌دانم که* is ik weet niet dat, met *ن* voor het werkwoord. De ingebedde vraag volgt onveranderd: *نمی‌دانم که موزیم کجاست.* Deze zin eindigt met een punt, omdat het een bewering is.'
  prs.a2.unit38.lesson02.teach.order_unchanged:
    title: Het werkwoord blijft zoals in de directe vraag
    gloss: Wanneer gaat het museum open? Ik weet niet wanneer het museum opengaat.
    note: 'In de ingebedde vraag verandert niets. Het vraagwoord houdt zijn plek, het werkwoord houdt zijn tijd, en een aanvoegende wijs is niet nodig. In het Dari verandert de woordvolgorde niet: de directe vraag en de ingebedde vraag worden hetzelfde geschreven.'
  prs.a2.unit38.lesson02.teach.when:
    title: Wanneer
    gloss: wanneer, hoe laat
    note: '*کی* betekent wanneer. Je kunt ook naar de tijd op de klok vragen met *ساعت چند*: *بس ساعت چند حرکت می‌کند؟*'
    example_gloss: Wanneer vertrekt de bus?
  prs.a2.unit38.lesson02.teach.opens:
    title: Openen
    gloss: gaat open (wordt open)
    note: '*باز* is open en *شدن* is worden, dus *باز می‌شود* is het gaat open. Zeg het van kantoren, musea, banken en winkels.'
    example_gloss: Het kantoor gaat om negen uur open.
  prs.a2.unit38.lesson02.teach.closes:
    title: Sluiten
    gloss: gaat dicht (wordt gesloten)
    note: '*بسته* is gesloten. *بسته می‌شود* is het gaat dicht. Het is het tegenovergestelde van *باز می‌شود*.'
    example_gloss: Het kantoor gaat om vier uur dicht.
  prs.a2.unit38.lesson02.teach.leaves:
    title: Vertrekken
    gloss: vertrekt
    note: '*حرکت کردن* is vertrekken. Het wordt gebruikt voor bussen, treinen en vliegtuigen: *بس حرکت می‌کند* is de bus vertrekt.'
    example_gloss: De bus vertrekt om acht uur.
  prs.a2.unit38.lesson02.teach.ticket:
    title: Kaartje
    gloss: kaartje
    note: '*بلیت* is een kaartje voor een bus, een vliegtuig of een museum.'
    example_gloss: Het kaartje is in het kantoor.
  prs.a2.unit38.lesson02.teach.why:
    title: Waarom
    gloss: waarom
    note: '*چرا* betekent waarom. In een ingebedde vraag houdt het zijn plek: *نمی‌دانم که چرا دفتر بسته است.*'
    example_gloss: Waarom is het kantoor dicht?
  prs.a2.unit38.lesson02.teach.which:
    title: Welke
    gloss: welke
    note: '*کدام* betekent welke en staat voor het zelfstandig naamwoord: *کدام بس* is welke bus.'
    example_gloss: Welke bus gaat naar Mazar?
  prs.a2.unit38.lesson02.teach.question_words:
    title: Vraagwoorden na که
    gloss: Ik weet niet hoeveel het kaartje kost. Ik weet niet waarom het kantoor dicht is. Ik weet niet welke bus naar Mazar gaat.
    note: 'Elk vraagwoord van de directe vraag kan na *که* volgen: *کجا* (waar), *کی* (wanneer), *ساعت چند* (hoe laat), *چند* (hoeveel), *چرا* (waarom), *کدام* (welke). Elk blijft op zijn plek en de rest van de zin is een gewone bewering.'
  prs.a2.unit38.lesson03.teach.open:
    title: Open
    gloss: open
    note: '*باز* betekent open. *باز است* is het is open.'
    example_gloss: Het museum is vandaag open.
  prs.a2.unit38.lesson03.teach.closed:
    title: Gesloten
    gloss: gesloten
    note: '*بسته* betekent dicht. *بانک* is een bank.'
    example_gloss: De bank is vandaag dicht.
  prs.a2.unit38.lesson03.teach.market:
    title: Markt
    gloss: markt, bazaar
    note: '*بازار* is de markt of bazaar.'
    example_gloss: De markt is dichtbij.
  prs.a2.unit38.lesson03.teach.yes_no:
    title: 'Ja/nee-vragen: یا نه'
    gloss: Is het kantoor open? Weet u of het kantoor open is of niet?
    note: 'Een ja/nee-vraag heeft geen vraagwoord, dus de ingebedde vorm voegt aan het eind *یا نه* (of niet) toe: *می‌دانین که دفتر باز است یا نه؟* is weet u of het kantoor open is of niet? Hier omlijsten *که* en *یا نه* de bijzin. *یا نه* is de gebruikelijke manier om "of" te zeggen in het Dari.'
  prs.a2.unit38.lesson03.teach.yes_no_negative:
    title: Ik weet niet of
    gloss: Ik weet niet of het kantoor open is of niet.
    note: 'De bewerende vorm is hetzelfde: *نمی‌دانم که دفتر باز است یا نه.* Alles tussen *که* en *یا نه* is de gewone zin *دفتر باز است*.'
  prs.a2.unit38.lesson03.teach.aya:
    title: 'آیا: of'
    gloss: Is het museum open? Ik weet niet of het museum open is of niet.
    note: '*آیا* is een formeel woord waarmee je een ja-neevraag inleidt: *آیا موزیم باز است؟* In een indirecte vraag kun je het na *که* zetten, zoals in *که آیا موزیم باز است یا نه*, maar dat hoeft niet: *یا نه* is genoeg.'
  prs.a2.unit38.lesson03.teach.answer_yes_no:
    title: Ja, het is open. Nee, het is dicht.
    gloss: Ja, het is open. Nee, het is dicht.
    note: '*بلی* betekent ja en *نخیر* betekent nee. In een kort antwoord herhaal je het adjectief: *باز است* (het is open) of *بسته است* (het is dicht).'
  prs.a2.unit38.lesson03.teach.know_open_today:
    title: Weet u of het vandaag open is?
    gloss: Weet u of het vandaag open is?
    note: 'Als de plaats al genoemd is, kun je hem weglaten: *امروز باز است* betekent: het is vandaag open.'
  prs.a2.unit38.lesson04.teach.excuse:
    title: Pardon
    gloss: pardon, sorry
    note: '*ببخشین* betekent pardon. Je zegt het tegen een vreemde voordat je iets vraagt.'
    example_gloss: Pardon, waar is het kantoor?
  prs.a2.unit38.lesson04.teach.staff:
    title: Medewerker
    gloss: medewerker, bediende
    note: '*کارمند* is een medewerker. Aan een loket vraag je vaak iets aan een *کارمند*.'
    example_gloss: De medewerker is op kantoor.
  prs.a2.unit38.lesson04.teach.polite_request:
    title: Kunt u mij zeggen ...?
    gloss: Pardon, kunt u mij zeggen waar het station is?
    note: Om een vreemde beleefd iets te vragen, gebruik je *می‌توانین بگویین که* (kunt u mij zeggen) met daarachter de directe vraag. Het is een verzoek, zachter dan *می‌دانین که*. *بگویین* is de beleefde gebiedende wijs van *گفتن*.
  prs.a2.unit38.lesson04.teach.polite_more:
    title: Verzoek met andere vragen
    gloss: Kunt u mij zeggen hoeveel het kaartje kost? Kunt u mij zeggen of het kantoor open is of niet?
    note: 'Hetzelfde verzoek werkt met elke indirecte vraag uit deze les: *چند* (hoeveel), *کی*, *کجا*, *چرا* en de ja-neevorm met *یا نه*.'
  prs.a2.unit38.lesson04.teach.answer_politely:
    title: Beleefd antwoorden
    gloss: Ja, ik weet het. Het station is dichtbij. Sorry, ik weet het niet.
    note: Om op *می‌دانین که ...؟* te antwoorden zeg je *بلی، می‌دانم* en geef je de informatie, of *ببخشین، نمی‌دانم* als je het niet weet. Je kunt ook zeggen *من هم نمی‌دانم* (ik weet het ook niet).
  prs.a2.unit38.lesson04.teach.me_neither:
    title: Ik weet het ook niet
    gloss: Ik weet het ook niet.
    note: '*هم* betekent ook. Met een ontkennend werkwoord is de betekenis ''ook niet'': *من هم نمی‌دانم* is: ik weet het ook niet.'
  prs.a2.unit38.lesson05.teach.first:
    title: Eerst
    gloss: eerst, in het begin
    note: '*اول* betekent eerst. *اول ... بعد ...* betekent eerst ... dan ...'
    example_gloss: Eerst ga ik naar de bank.
  prs.a2.unit38.lesson05.teach.then:
    title: Dan, daarna
    gloss: dan, daarna
    note: '*بعد* betekent dan of daarna.'
    example_gloss: Daarna ga ik naar de bibliotheek.
  prs.a2.unit38.lesson05.teach.museum_turn01:
    title: Samir vraagt Samina waar het museum is
    gloss: Samina, weet jij waar het museum is?
    note: Samir vraagt het aan een vriendin, daarom gebruikt hij *می‌دانی*. De indirecte vraag is *موزیم کجاست؟*.
  prs.a2.unit38.lesson05.teach.museum_turn02:
    title: Samina antwoordt
    gloss: Ja, het museum is dicht bij het station.
    note: 'Samina zegt *بلی* en geeft de informatie: *نزدیک ایستگاه است* (het is dicht bij het station).'
  prs.a2.unit38.lesson05.teach.museum_turn03:
    title: Samir vraagt naar de openingstijd
    gloss: Weet jij hoe laat het opengaat?
    note: Het museum is al genoemd, dus Samir laat het weg. *ساعت چند باز می‌شود* is de indirecte vraag.
  prs.a2.unit38.lesson05.teach.museum_turn04:
    title: Samina weet het niet
    gloss: Nee, ik weet niet hoe laat het opengaat.
    note: Samina herhaalt de indirecte vraag na *نمی‌دانم که*. *نه* is een vriendelijk nee.
  prs.a2.unit38.lesson05.teach.museum_turn05:
    title: Samir vraagt of het morgen open is
    gloss: Weet jij of het morgen open is of niet?
    note: Een ja-neevraag met *یا نه*. *فردا* betekent morgen.
  prs.a2.unit38.lesson05.teach.museum_turn06:
    title: Samina gaat eerst bellen
    gloss: Ik weet het niet. Eerst ga ik bellen.
    note: '*تیلفون می‌کنم* betekent: ik bel. *اول* is eerst. Ze belt voordat ze antwoord geeft.'
  prs.a2.unit38.lesson05.teach.message:
    title: Een bericht vanaf de markt
    gloss: Hallo Samina. Vandaag ben ik op de markt. Weet jij waar de bank is? Ik weet niet of de bank dicht bij de markt is of niet. Weet jij of de bank vandaag open is of niet? Daarna ga ik naar de bibliotheek.
    note: 'Een kort bericht met drie indirecte vragen: waar de bank is, of die dichtbij is en of die open is. Let op: de eerste vraag is een vraag aan een vriendin (*می‌دانی*) en de tweede is een mededeling (*نمی‌دانم که ... یا نه*).'
  prs.a2.unit38.lesson06.teach.gate:
    title: Poort, deur
    gloss: poort, deur
    note: '*دروازه* is een poort of een grote deur, bijvoorbeeld de poort van een station of kantoor.'
    example_gloss: De poort is open.
  prs.a2.unit38.lesson06.teach.thousand:
    title: Duizend
    gloss: duizend
    note: '*هزار* betekent duizend. *افغانی* is het Afghaanse geld: *هزار افغانی* is duizend afghani.'
    example_gloss: Het kaartje kost duizend afghani.
  prs.a2.unit38.lesson06.teach.station_turn01:
    title: Samir vraagt het aan de medewerker
    gloss: Pardon, weet u wanneer de bus naar Mazar vertrekt?
    note: Samir spreekt een vreemde aan, daarom gebruikt hij *ببخشین* en *می‌دانین*. *بس به مزار* is de bus naar Mazar.
  prs.a2.unit38.lesson06.teach.station_turn02:
    title: De medewerker antwoordt
    gloss: Ja, ik weet het. De bus vertrekt om acht uur.
    note: De medewerker zegt *بلی، می‌دانم* en geeft de tijd.
  prs.a2.unit38.lesson06.teach.station_turn03:
    title: Samir vraagt naar de prijs
    gloss: Kunt u mij zeggen hoeveel het kaartje kost?
    note: 'Een beleefd verzoek: *می‌توانین بگویین که* plus *بلیت چند است؟*.'
  prs.a2.unit38.lesson06.teach.station_turn04:
    title: De medewerker noemt de prijs
    gloss: Het kaartje kost duizend afghani.
    note: Een direct antwoord zonder indirecte vraag.
  prs.a2.unit38.lesson06.teach.station_turn05:
    title: Samir vraagt naar het kantoor
    gloss: Dank u. Weet u waar het kantoor is?
    note: '*تشکر* betekent dank u.'
  prs.a2.unit38.lesson06.teach.station_turn06:
    title: De medewerker zegt waar het kantoor is
    gloss: Het kantoor is dicht bij de poort.
    note: '*نزدیک دروازه است* betekent: het is dicht bij de poort.'
exercises:
  prs.a2.unit38.lesson01.exercise01.recognize_station:
    instruction: Wat betekent deze zin?
    correct_option: Weet u waar het station is?
    distractors:
    - Waar is het station?
    - Ik weet waar het station is
    - Het station is dichtbij
    accepted_answers:
    - value: Weet u waar het station is?
      status: correct
    feedback: '*می‌دانین که ایستگاه کجاست؟* betekent: weet u waar het station is? Je vraagt of de ander het weet.'
  prs.a2.unit38.lesson01.exercise02.recognize_library_friend:
    instruction: Wat betekent deze zin?
    correct_option: Weet jij waar de bibliotheek is? (tegen een vriend)
    distractors:
    - Weet u waar de bibliotheek is? (beleefd)
    - Ik weet niet waar de bibliotheek is
    - Is de bibliotheek dichtbij?
    accepted_answers:
    - value: Weet jij waar de bibliotheek is? (tegen een vriend)
      status: correct
    feedback: '*می‌دانی* heeft de uitgang *-ی* voor een vriend: het is dezelfde vraag, gesteld aan een vriend.'
  prs.a2.unit38.lesson01.exercise03.match_forms:
    instruction: Koppel elk Dari-woord aan de betekenis.
    accepted_answers:
    - value:
        می‌دانم: ik weet
        می‌دانی: jij weet (tegen een vriend)
        می‌داند: hij of zij weet
        می‌دانیم: wij weten
        می‌دانین: u weet (beleefd) of jullie weten (meervoud)
        می‌دانند: zij weten
        ایستگاه: station
        موزیم: museum
        کتابخانه: bibliotheek
        دفتر: kantoor
      status: correct
    feedback: 'Alleen de uitgang van *می‌دان-* verandert: *-م* ik, *-ی* jij (vriend), -د hij of zij, *-یم* wij, *-ین* u (beleefd) of jullie, *-ند* zij.'
    pairs:
    - left: می‌دانم
      right: ik weet
    - left: می‌دانی
      right: jij weet (tegen een vriend)
    - left: می‌داند
      right: hij of zij weet
    - left: می‌دانیم
      right: wij weten
    - left: می‌دانین
      right: u weet (beleefd) of jullie weten (meervoud)
    - left: می‌دانند
      right: zij weten
    - left: ایستگاه
      right: station
    - left: موزیم
      right: museum
    - left: کتابخانه
      right: bibliotheek
    - left: دفتر
      right: kantoor
  prs.a2.unit38.lesson01.exercise04.order_do_you_know:
    instruction: 'Zet de woorden in de juiste volgorde: Weet u waar het station is?'
    accepted_answers:
    - value:
      - می‌دانین
      - که
      - ایستگاه
      - کجاست
      status: correct
    feedback: In *می‌دانین که ایستگاه کجاست؟* staat eerst het werkwoord, dan *که* en dan de directe vraag.
  prs.a2.unit38.lesson01.exercise05.fill_where:
    instruction: 'Maak de zin af: Weet u waar het museum is?'
    accepted_answers:
    - value: کجاست
      status: correct
    feedback: '*کجاست* betekent: waar is het? De directe vraag *موزیم کجاست؟* staat na *که*.'
  prs.a2.unit38.lesson01.exercise06.translate_museum:
    instruction: 'Vertaal naar het Dari, met می‌دانین: Weet u waar het museum is?'
    accepted_answers:
    - value: می‌دانین که موزیم کجاست؟
      status: correct
