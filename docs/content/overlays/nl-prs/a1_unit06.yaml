    title: Twee stappen combineren
    gloss: Ga eerst rechtdoor, sla dan rechtsaf.
    note: Met اول en بعد kun je meerdere stappen in één aanwijzing zetten.
  prs.a1.unit06.lesson04.teach.polite_ask:
    title: Beleefd vragen hoe je ergens komt
    gloss: Kunt u me zeggen hoe ik bij de markt kom?
    note: 'می‌توانین بگویین...؟ is een beleefde manier om te vragen: ''Kunt u me zeggen...?'' en past bij het de weg vragen aan een vreemde. بروم betekent ''ik ga'', dus de hele zin vraagt hoe ik er kan komen.'
  prs.a1.unit06.lesson04.teach.bebakhshid_review:
    title: Vragen waar een plek is (herhaling)
    gloss: Pardon, waar is de apotheek?
    note: ببخشین، [plek] کجاست؟ kwam al aan bod in de unit over plaatsen; het is een natuurlijke opening voordat je de weg vraagt.
  prs.a1.unit06.lesson04.teach.fahmidam:
    title: Zeggen dat je het begrepen hebt
    gloss: Hartelijk dank, ik heb het begrepen.
    note: تشکر زیاد، فهمیدم sluit het gesprek beleefd af en laat zien dat de aanwijzingen duidelijk waren.
  prs.a1.unit06.lesson04.teach.daftar_review:
    title: Kantoor (herhaling)
    gloss: kantoor
    note: دفتر kwam al in een eerdere unit voor; het wordt hier gebruikt als bestemming om het beleefd de weg vragen te oefenen.
    example_gloss: Het kantoor is dichtbij.
  prs.a1.unit06.lesson05.teach.after_word:
    title: Na
    gloss: na
    note: بعد از geeft een oriëntatiepunt aan dat vóór de bestemming komt.
    example_gloss: Na de moskee is de bank.
  prs.a1.unit06.lesson05.teach.opposite_review:
    title: Tegenover
    gloss: tegenover
    note: روبه‌رو is een nieuw synoniem van مقابل (tegenover), dat in de eenheid over plaatsen is geïntroduceerd. In het dagelijks Dari worden beide gebruikt voor 'tegenover'.
    example_gloss: De bank is tegenover de moskee.
  prs.a1.unit06.lesson05.teach.landmark_example:
    title: Een route aangeven met een herkenningspunt
    gloss: Na de moskee is de bank tegenover u.
    note: بعد از مسجد، بانک روبه‌روی شماست combineert een herkenningspunt (بعد از مسجد) met een relatieve plaatsaanduiding (روبه‌روی شماست).
  prs.a1.unit06.lesson05.teach.maktab_review:
    title: School (herhaling)
    gloss: school
    note: مکتب is in de eenheid over plaatsen geïntroduceerd. Hier wordt het woord als herkenningspunt in de oefenzin gebruikt.
    example_gloss: De school is dichtbij.
  prs.a1.unit06.lesson06.teach.turn01:
    title: Sohaila vraagt de weg
    gloss: Sohaila vraagt een winkelier beleefd hoe ze bij de apotheek komt.
    note: ببخشین opent de vraag respectvol, en می‌توانین بگویین؟ is de beleefde zin om de weg te vragen uit les 4.
  prs.a1.unit06.lesson06.teach.turn02:
    title: De winkelier noemt de eerste stap
    gloss: De winkelier bevestigt en zegt dat ze eerst rechtdoor moet gaan.
    note: اول مستقیم بروین begint de reeks aanwijzingen.
  prs.a1.unit06.lesson06.teach.turn03:
    title: Sohaila bevestigt en vraagt wat daarna komt
    gloss: Sohaila herhaalt 'rechtdoor' ter bevestiging en vraagt dan wat er daarna komt.
    note: بعد چطور؟ is een natuurlijke, beknopte manier om naar de volgende stap te vragen.
  prs.a1.unit06.lesson06.teach.turn04:
    title: De winkelier noemt de tweede stap en het herkenningspunt
    gloss: De winkelier zegt dat ze linksaf moet slaan en geeft de ligging van de apotheek aan met de moskee en de bank als herkenningspunten.
    note: Dit combineert de afslaanaanwijzing uit les 2 met het patroon met herkenningspunten uit les 5.
  prs.a1.unit06.lesson06.teach.turn05:
    title: Sohaila bedankt hem en zegt dat ze het begrepen heeft
    gloss: Sohaila bedankt hem hartelijk en zegt dat ze het begrepen heeft.
    note: تشکر زیاد، فهمیدم sluit het gesprek af, zoals in les 4 geleerd.
  prs.a1.unit06.lesson06.teach.turn06:
    title: Het bescheiden antwoord en afscheid van de winkelier
    gloss: De winkelier wuift de dank weg en wenst haar een goede reis.
    note: قابلی نداره is in de eenheid over plaatsen geïntroduceerd. سفر خوش (goede reis) is een natuurlijk afscheid voor iemand die ergens naartoe gaat lopen.
