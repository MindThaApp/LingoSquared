    title: Zeg tegen iemand dat hij rechtsaf moet slaan
    gloss: Slaat u rechtsaf.
    note: به راست بپیچین volgt hetzelfde patroon, met راست in plaats van چپ.
  prs.a1.unit06.lesson03.teach.first_word:
    title: Eerst
    gloss: eerst
    note: اول geeft de eerste stap aan in een reeks aanwijzingen.
    example_gloss: Ga eerst rechtdoor.
  prs.a1.unit06.lesson03.teach.then_word:
    title: Dan
    gloss: dan
    note: بعد geeft de volgende stap aan na de eerste.
    example_gloss: Sla dan linksaf.
