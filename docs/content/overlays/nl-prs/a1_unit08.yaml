teaching:
  prs.a1.unit08.lesson01.teach.naan:
    title: Brood
    gloss: brood
    note: نان hoort bij elke Afghaanse maaltijd.
    example_gloss: Het brood is vers.
  prs.a1.unit08.lesson01.teach.palaw:
    title: Pilav
    gloss: pilav
    note: پلو is het Afghaanse rijstgerecht, apart gekruid en vaak bereid met vlees, wortel of rozijnen. Het is dus meer dan gewone rijst.
    example_gloss: De pilav is lekker.
  prs.a1.unit08.lesson01.teach.qorma:
    title: Stoofpot met vlees en groenten
    gloss: stoofpot met vlees en groenten
    note: قورمه is een algemene term voor een gerecht van gestoofd vlees en groenten, meestal geserveerd bij پلو.
    example_gloss: Ik eet de stoofpot met pilav.
  prs.a1.unit08.lesson01.teach.chai_review:
    title: Thee (herhaling)
    gloss: thee
    note: چای is de standaarddrank die je bijna overal in Afghanistan aangeboden krijgt.
    example_gloss: Een thee, alstublieft.
  prs.a1.unit08.lesson01.teach.ab_water:
    title: Water
    gloss: water
    note: آب is het gewone woord voor water.
    example_gloss: Een water, alstublieft.
  prs.a1.unit08.lesson01.teach.va_word:
    title: En
    gloss: en
    note: و is het gewone voegwoord om gerechten op te sommen.
    target_text: و (en)
  prs.a1.unit08.lesson02.teach.mikham_chai:
    title: Beleefd thee bestellen
    gloss: Ik wil graag een thee.
    note: یک چای می‌خواهم is een neutrale, beleefde manier om te bestellen. Je gebruikt direct می‌خواهم (ik wil) in plaats van een indirectere constructie.
  prs.a1.unit08.lesson02.teach.lotfan:
    title: Alsjeblieft
    gloss: alsjeblieft
    note: لطفاً kun je toevoegen om bijna elk verzoek zachter te maken.
    example_gloss: Help alstublieft.
  prs.a1.unit08.lesson02.teach.mikham_naan:
    title: Beleefd brood bestellen
    gloss: Ik wil graag een brood.
    note: Hetzelfde patroon یک [item] می‌خواهم werkt voor elk woord voor eten of drinken.
  prs.a1.unit08.lesson03.teach.what_do_you_have:
    title: Vragen wat er te krijgen is
    gloss: Wat hebt u?
    note: چی دارین؟ is de natuurlijke manier om een winkelier of ober te vragen wat er te eten is.
  prs.a1.unit08.lesson03.teach.we_have_both:
    title: Antwoorden met wat er is
    gloss: We hebben pilav en stoofpot.
    note: پلو و قورمه داریم gebruikt داریم (wij hebben), de wij-vorm van دارم. Een winkelier zegt 'wij' als hij namens de hele zaak spreekt.
  prs.a1.unit08.lesson03.teach.fresh_word:
    title: Vers
    gloss: vers
    note: تازه beschrijft vers bereid eten.
    example_gloss: Dit brood is vers.
  prs.a1.unit08.lesson04.teach.yek_boshghab:
    title: Een bord pilav
    gloss: een bord pilav
    note: بشقاب (bord) is het telwoord voor eten dat op een bord wordt geserveerd.
  prs.a1.unit08.lesson04.teach.do_ta_naan:
    title: Twee broden
    gloss: twee broden
    note: تا is het algemene telwoord dat na een getal komt bij de meeste telbare dingen, hier twee stuks brood.
  prs.a1.unit08.lesson04.teach.combined_order:
    title: Een volledige bestelling doen
    gloss: Een bord pilav en twee broden, alstublieft.
    note: Je kunt meerdere hoeveelheden in één bestelling met و (en) verbinden.
  prs.a1.unit08.lesson05.teach.bill_word:
    title: De rekening
    gloss: de rekening
    note: بل is het alledaagse Afghaanse woord voor de rekening in een restaurant.
    example_gloss: De rekening, alstublieft.
  prs.a1.unit08.lesson05.teach.bill_request:
    title: Vragen hoeveel de rekening is
    gloss: Hoeveel is de rekening?
    note: بل چند می‌شه؟ vraagt letterlijk 'de rekening wordt hoeveel', de natuurlijke alledaagse manier om naar het totaalbedrag te vragen. می‌شه is de gesproken vorm van می‌شود; die hoor je in een winkel, terwijl je in schrift می‌شود gebruikt.
  prs.a1.unit08.lesson05.teach.khoshmaze:
    title: Zeggen dat het eten lekker was
    gloss: Het was erg lekker.
    note: خیلی خوش‌مزه بود is een natuurlijk compliment na de maaltijd.
  prs.a1.unit08.lesson05.teach.chaikhana:
    title: Theehuis
    gloss: theehuis / eenvoudig eethuisje
    note: چایخانه is een gewoon, alledaags type eethuisje in Afghanistan, vooral in Kabul, waar je thee en eenvoudige maaltijden krijgt.
  prs.a1.unit08.lesson06.teach.welcome_review:
    title: Welkom (herhaling)
    gloss: welkom
    note: خوش آمدین kwam al aan bod in de unit over begroetingen. Hier wordt het gebruikt als begroeting van een winkelier.
  prs.a1.unit08.lesson06.teach.turn01:
    title: De winkelier begroet de klant
    gloss: De winkelier verwelkomt de klant en vraagt wat hij wil hebben.
    note: چی میل دارین؟ is een beleefde openingsvraag. Ze lijkt qua functie op چی دارین؟, maar is geformuleerd vanuit de wens van de klant.
  prs.a1.unit08.lesson06.teach.turn02:
    title: De klant vraagt wat er is
    gloss: De klant begroet de winkelier en vraagt wat er verkrijgbaar is.
    note: چی دارین؟ opent het bestelgesprek, uit les 3.
  prs.a1.unit08.lesson06.teach.turn03:
    title: De winkelier noemt wat er is
    gloss: De winkelier zegt dat ze pilav en stoofpot hebben, allebei vers.
    note: هردو (beide) bevestigt dat beide genoemde gerechten vers zijn.
  prs.a1.unit08.lesson06.teach.turn04:
    title: De klant doet een volledige bestelling
    gloss: De klant stemt in en bestelt een bord pilav met stoofpot, plus een thee.
    note: Dit combineert het hoeveelheidspatroon uit les 4 met de eetwoordenschat uit les 1.
  prs.a1.unit08.lesson06.teach.turn05:
    title: De winkelier bevestigt de bestelling
    gloss: De winkelier zegt dat hij het meteen brengt.
    note: چشم betekent letterlijk 'op mijn oog' en is een respectvolle manier om 'natuurlijk' te zeggen. می‌آرم is de gesproken vorm van می‌آورم (ik breng), en همین حالا betekent 'meteen'.
  prs.a1.unit08.lesson06.teach.turn06:
    title: De klant zegt dat het lekker was en vraagt om de rekening
    gloss: De klant zegt dat het heerlijk was en vraagt om de rekening.
    note: Beide zinnen gebruiken direct de woordenschat uit les 5.
  prs.a1.unit08.lesson06.teach.turn07:
    title: De winkelier noemt het totaalbedrag
    gloss: De winkelier bedankt de klant en zegt dat het tweehonderd afghani is.
    note: افغانی is de munteenheid van Afghanistan; دوصد (tweehonderd) gebruik je samen met de naam van de munt om een prijs te noemen.
