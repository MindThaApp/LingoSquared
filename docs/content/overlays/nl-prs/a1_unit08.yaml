course:
  title: Dari in het Nederlands A1
  description: 'Dari uit Afghanistan voor beginners: woordenschat rond eten en drinken, beleefd bestellen, vragen wat er verkrijgbaar is, hoeveelheden en restaurantetiquette, inclusief om de rekening vragen.'
units:
