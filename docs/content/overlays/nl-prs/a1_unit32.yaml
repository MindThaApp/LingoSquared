course:
  title: Dari in het Nederlands A1
  description: 'Dari van Kabul voor beginners: woordenschat over feesten en verjaardagen (verjaardag, feest, taart, cadeau, felicitaties), vragen en vertellen in welke maand iemand jarig is, een formele uitnodigingszin en een dialoog tussen Basir en Maryam over een verjaardagsfeest.'
units:
