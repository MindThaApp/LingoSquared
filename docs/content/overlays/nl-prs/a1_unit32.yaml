    title: Gefeliciteerd
    gloss: gefeliciteerd
    note: تبریک betekent gefeliciteerd. Je gebruikt het met می‌گویم (ik zeg) in de alledaagse uitdrukking تبریک می‌گویم (ik feliciteer je).
    example_gloss: Gefeliciteerd!
  prs.a1.unit32.lesson01.teach.review_mubarak:
    title: Gefeliciteerd met je verjaardag (opbouw)
    gloss: jouw verjaardag (informeel) + gezegend → Gefeliciteerd met je verjaardag
    note: تولدت is تولد (verjaardag) met het informele achtervoegsel -ت voor "jouw"; مبارک betekent gezegend of gelukkig. Samen vormen ze تولدت مبارک, de standaardwens voor een verjaardag in het Dari/Perzisch.
    target_text: تولدت (jouw verjaardag, informeel) + مبارک (gezegend) = تولدت مبارک (Gefeliciteerd met je verjaardag)
  prs.a1.unit32.lesson01.teach.happy_birthday_phrase:
    title: Gefeliciteerd met je verjaardag!
    gloss: Gefeliciteerd met je verjaardag!
