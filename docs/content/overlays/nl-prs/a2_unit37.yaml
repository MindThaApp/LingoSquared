course:
  title: Dari A2
  description: 'Dari uit Afghanistan voor het lagere middenniveau: praten over wat er gebeurt of zal gebeuren als aan een voorwaarde wordt voldaan, bijvoorbeeld als het morgen regent of als je de kassabon hebt. اگر plus de aanvoegende wijs, met een hoofdzin in de tegenwoordige tijd of een gebod; plannen bij het weer en winkelregels.'
units:
  prs.a2.unit37.if_conditions:
    title: Als het regent
