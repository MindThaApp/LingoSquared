teaching:
  prs.a2.unit37.lesson01.teach.weather:
    title: Weer
    gloss: weer, lucht
    note: '*هوا* is het weer, en ook de lucht. *هوا خوب است* betekent: het weer is goed, en *هوا بد است*: het weer is slecht.'
    example_gloss: Het weer is vandaag goed.
  prs.a2.unit37.lesson01.teach.cold:
    title: Koud
    gloss: koud
    note: '*سرد* is koud. Het tegenovergestelde is *گرم* (warm, heet), dat ken je al.'
    example_gloss: Het is vandaag koud.
  prs.a2.unit37.lesson01.teach.outside:
    title: Buiten
    gloss: buiten
    note: '*بیرون* is buiten. *بیرون می‌روم* betekent: ik ga naar buiten, en *بیرون از خانه* is buiten het huis.'
    example_gloss: Ik ben buiten het huis.
  prs.a2.unit37.lesson01.teach.if_pattern:
    title: 'اگر: een reële voorwaarde'
    gloss: Als het weer goed is, ga ik naar het park. Als het regent, blijf ik thuis.
    note: '*اگر* betekent als. Het opent een voorwaarde die echt kan gebeuren, en het werkwoord van die voorwaarde staat in de aanvoegende wijs: *باشد*, *ببارد*. Dit is dezelfde vorm als na *باید*: een werkwoord met *ب-* voor de tegenwoordige stam (*ببارد*), en *باشد* voor *بودن*, dat geen *ب-* krijgt. De hoofdzin zegt dan wat er gebeurt, in de gewone tegenwoordige tijd met *می‌*: *به پارک می‌روم*. De tegenwoordige tijd met *می‌* dekt ook de toekomst, dus je hebt geen aparte toekomende tijd nodig. Zet een komma na de voorwaarde.'
  prs.a2.unit37.lesson01.teach.paradigm_ro:
    title: De aanvoegende wijs van رفتن na اگر
    gloss: als ik ga, als je gaat, als hij of zij gaat, als wij gaan, als u gaat of als jullie gaan, als zij gaan
    note: 'De tegenwoordige stam van *رفتن* is *رو*. Zet er *ب-* voor en voeg de uitgangen toe: *بروم* (ik), *بروی* (jij, tegen een vriend), *برود* (hij, zij of het), *برویم* (wij), *بروین* (u, formeel, of jullie), *بروند* (zij). Elk werkwoord krijgt dezelfde zes uitgangen: *-م، -ی، -د، -یم، -ین، -ند*. De uitgang *-ین* is die voor u (formeel) of jullie. De vormen op *-ید* worden ook begrepen, maar in deze cursus schrijven we *-ین*.'
  prs.a2.unit37.lesson01.teach.snow_phrase:
    title: Als het sneeuwt, ga ik niet naar buiten
    gloss: Als het sneeuwt, ga ik niet naar buiten.
    note: 'De hoofdzin kan ontkennend zijn. Zet *نمی‌* voor de tegenwoordige stam: *نمی‌روم* betekent: ik ga niet. De voorwaarde blijft hetzelfde: *اگر برف ببارد* betekent: als het sneeuwt.'
  prs.a2.unit37.lesson01.teach.cold_phrase:
    title: Als het koud is, blijf ik thuis
    gloss: Als het koud is, blijf ik thuis.
    note: '*اگر هوا سرد باشد* betekent: als het koud is. Met *هوا* en een bijvoeglijk naamwoord eindigt de voorwaarde altijd op *باشد*.'
  prs.a2.unit37.lesson02.teach.weekend:
    title: Weekend
    gloss: weekend
    note: '*آخر هفته* is het weekend. *آخر* betekent einde, en *هفته* is de week.'
    example_gloss: In het weekend gaan we naar het park.
  prs.a2.unit37.lesson02.teach.tonight:
    title: Vanavond
    gloss: vanavond
    note: '*امشب* betekent vanavond. Het is een tijdswoord, dus de hoofdzin met *می‌* kan het gebruiken: *امشب می‌روم* betekent: ik ga vanavond.'
    example_gloss: Vanavond ga ik naar de bioscoop.
  prs.a2.unit37.lesson02.teach.formation:
    title: De aanvoegende wijs van andere werkwoorden
    gloss: dat ik koop, dat ik neem, dat ik geef, dat ik kom, dat ik blijf, dat ik eet
    note: 'De regel van *رفتن* geldt voor elk werkwoord: presensstam met *ب-* ervoor, daarna de uitgangen. *خر* wordt *بخرم* (ik koop), *گیر* wordt *بگیرم* (ik neem), *ده* wordt *بدهم* (ik geef), *مان* wordt *بمانم* (ik blijf), *خور* wordt *بخورم* (ik eet). *آمدن* moet je onthouden: de aanvoegende wijs is *بیایم، بیایی، بیاید، بیاییم، بیایین، بیایند*, met een extra *ی*. Na *اگر* betekent elk van deze vormen: als ik koop, als ik neem, enzovoort.'
  prs.a2.unit37.lesson02.teach.be_have:
    title: De aanvoegende wijs van بودن en داشتن
    gloss: dat ik ben, dat jij bent, dat hij/zij is, dat wij zijn, dat u/jullie zijn (beleefd of meervoud), dat zij zijn
    note: '*باشم، باشی، باشد، باشیم، باشین، باشند* zijn de zes aanvoegende vormen van *بودن*; ze krijgen geen *ب-*. Om "als ik heb" te zeggen gebruikt het Dari *داشته باشم*: het deelwoord *داشته* plus *باشم*. *اگر وقت داشته باشم* betekent dus: als ik tijd heb, en *اگر پول داشته باشی*: als je geld hebt. Voor een mogelijke toekomstige situatie is dit de gebruikelijke vorm.'
  prs.a2.unit37.lesson02.teach.money_phrase:
    title: Als ik geld heb, koop ik een boek
    gloss: Als ik geld heb, koop ik een boek.
    note: '*اگر پول داشته باشم* betekent: als ik geld heb. De hoofdzin staat in de gewone tegenwoordige tijd: *کتاب می‌خرم* betekent: ik koop een boek, of: ik zal een boek kopen.'
  prs.a2.unit37.lesson02.teach.negative:
    title: 'De ontkenning: ن in plaats van ب'
    gloss: als ik niet ga, als ik niet kom, als ik niet koop, als het niet is, als het niet regent
    note: 'Om de voorwaarde te ontkennen vervang je *ب-* door *ن-*: *بروم* wordt *نروم*, *بخرم* wordt *نخرم* en *بیایم* wordt *نیایم*. *باشد* en *ببارد* worden *نباشد* en *نبارد*. *اگر باران نبارد* betekent dus: als het niet regent.'
  prs.a2.unit37.lesson02.teach.friend_phrase:
    title: Als mijn vriend komt, voetballen we samen
    gloss: Als mijn vriend komt, voetballen we samen.
    note: 'De voorwaarde heeft *بیاید* (de aanvoegende wijs van *آمدن* voor hij of zij). De hoofdzin zegt nu wij: *می‌کنیم* betekent: wij doen, of: wij spelen, en *می‌رویم* betekent: wij gaan. *با هم* betekent samen.'
  prs.a2.unit37.lesson02.teach.norain_phrase:
    title: Als het niet regent, gaan we naar het park
    gloss: Als het niet regent, gaan we naar het park.
    note: '*اگر باران نبارد* betekent: als het niet regent. De hoofdzin is bevestigend, en *می‌رویم* betekent: wij gaan.'
  prs.a2.unit37.lesson02.teach.time_phrase:
    title: Als ik tijd heb, ga ik vanavond naar de bioscoop
    gloss: Als ik tijd heb, ga ik vanavond naar de bioscoop.
    note: Een voorwaarde over tijd hebben gebruikt *داشته باشم*. Het tijdswoord *امشب* in de hoofdzin laat zien dat het plan voor vanavond is.
  prs.a2.unit37.lesson03.teach.clothes:
    title: Kleding
    gloss: kleren, kleding
    note: '*لباس* betekent kleren of een kledingstuk. *لباس گرم* is warme kleding, voor koud weer.'
    example_gloss: Ik heb warme kleren.
  prs.a2.unit37.lesson03.teach.imperative:
    title: 'De gebiedende wijs: na اگر kan de hoofdzin een bevel zijn'
    gloss: neem (vriend, beleefd of meervoud), trek aan, kom, bel
    note: 'De hoofdzin kan ook een bevel zijn. Tegen een vriend is een bevel *ب-* plus de presensstam zonder uitgang: *بگیر* (neem), *بپوش* (trek aan), *بیا* (kom). Tegen iemand die je beleefd aanspreekt of tegen meerdere mensen voeg je *-ین* toe: *بگیرین، بپوشین، بیایین*. Werkwoorden uit twee woorden hebben geen *ب-*: *تیلفون کن* (vriend), *تیلفون کنین* (beleefd of meervoud). *اگر باران ببارد، چتر بگیر* betekent dus: als het regent, neem een paraplu mee.'
  prs.a2.unit37.lesson03.teach.neg_imperative:
    title: Het negatieve bevel
    gloss: ga niet, kom niet, doe niet (vriend, beleefd of meervoud)
    note: 'Een ontkennend bevel gebruikt *ن-* in plaats van *ب-*: *نرو* (ga niet), *نیا* (kom niet), *نکن* (doe niet). De beleefde of meervoudsvormen krijgen *-ین*: *نروین، نیایین، نکنین*. *اگر باران ببارد، بیرون نرو* betekent bijvoorbeeld: als het regent, ga dan niet naar buiten.'
  prs.a2.unit37.lesson03.teach.present_state:
    title: 'De tegenwoordige tijd in de voorwaarde: wat nu waar is'
    gloss: Als je tijd hebt, kom dan. Als je het koud hebt, trek warme kleren aan.
    note: 'Als de voorwaarde nu waar is, kan de voorwaarde de gewone tegenwoordige tijd gebruiken in plaats van de aanvoegende wijs: *اگر وقت داری* (als je nu tijd hebt) en *اگر سردت است* (als je het koud hebt). *اگر وقت داشته باشی* is ook juist en klinkt meer als een mogelijke toekomstige situatie. Wie het koud heeft, zegt *سردم است*; *سردت است* betekent: je hebt het koud.'
  prs.a2.unit37.lesson03.teach.rain_umbrella:
    title: Als het regent, neem een paraplu mee
    gloss: Als het regent, neem een paraplu mee.
    note: 'De voorwaarde is de aanvoegende wijs *ببارد*, en de hoofdzin is een bevel tegen een vriend: *بگیر*.'
  prs.a2.unit37.lesson03.teach.late_phone:
    title: Als je te laat bent, bel
    gloss: Als je te laat bent, bel dan.
    note: '*دیر شوی* is de aanvoegende wijs van *دیر شدن* voor jij (vriend): als je te laat wordt. *تیلفون کن* is het bevel tegen een vriend.'
  prs.a2.unit37.lesson03.teach.problem_phone:
    title: Als u een probleem hebt, bel
    gloss: Als u een probleem hebt, bel dan.
    note: 'Tegen een klant of tegen meerdere mensen gebruik je *-ین* in beide zinsdelen: *دارین* (u hebt) en *کنین* (bel). Een winkel zou dit op een mededeling zetten.'
  prs.a2.unit37.lesson04.teach.item:
    title: Goederen, artikel
    gloss: goederen, artikel, product
    note: '*کالا* zijn goederen of een artikel dat je in een winkel koopt.'
    example_gloss: Dit artikel is kapot.
  prs.a2.unit37.lesson04.teach.customer:
    title: Klant
    gloss: klant
    note: '*مشتری* is een klant. Het meervoud is *مشتریان*, met de uitgang *-ان* voor personen.'
    example_gloss: De klant is in de winkel.
  prs.a2.unit37.lesson04.teach.receipt:
    title: Bonnetje
    gloss: bonnetje
    note: '*رسید* is een kassabon, het papier dat laat zien wat je betaald hebt. Het lijkt op de verleden tijd van *رسیدن* (hij kwam aan), maar in een winkel betekent het kassabon.'
    example_gloss: Hebt u de kassabon bij u?
  prs.a2.unit37.lesson04.teach.exchange:
    title: Wisselen
    gloss: omruilen, wisselen
    note: '*عوض کردن* is iets omruilen of wisselen. Je zet het voorwerp met *را* ervoor: *کالا را عوض می‌کنم* betekent: ik ruil het artikel om.'
    example_gloss: Ik wil het boek omruilen.
  prs.a2.unit37.lesson04.teach.give_back:
    title: Teruggeven
    gloss: teruggeven, terugbrengen, terugbetalen
    note: '*پس دادن* is teruggeven. Een winkel die geld teruggeeft, zegt *پول را پس می‌دهیم* (we geven het geld terug).'
    example_gloss: We geven het geld terug.
  prs.a2.unit37.lesson04.teach.modal:
    title: 'Kunnen: می‌توانم'
    gloss: ik kan, jij kunt, hij/zij kan, wij kunnen, u/jullie kunnen (beleefd of meervoud), zij kunnen
    note: '*می‌توانم* is ik kan, en het wordt altijd geschreven met *می‌* en een kleine ruimte. De zes vormen zijn *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. Het volgende werkwoord staat in de aanvoegende wijs, met dezelfde persoon: *می‌توانیم عوض کنیم* betekent: wij kunnen omruilen. Voor de ontkenning zet je *ن* ervoor: *نمی‌توانیم* betekent: wij kunnen niet.'
  prs.a2.unit37.lesson04.teach.shop_if:
    title: Winkelregels met اگر
    gloss: Als het artikel kapot is, ruilen we het om. Als u de kassabon bij u hebt, kunnen we het artikel omruilen.
    note: 'Winkels gebruiken *اگر* om te zeggen wat ze in elk geval doen. De voorwaarde heeft *باشد* (*خراب باشد*, *همراه‌تان باشد*), en de hoofdzin is een gewone tegenwoordige tijd (*عوض می‌کنیم*) of *می‌توانیم* met de aanvoegende wijs. *همراه‌تان باشد* betekent: u hebt het bij u (letterlijk: het is bij u).'
  prs.a2.unit37.lesson04.teach.no_receipt:
    title: 'Een regel met ontkenning: geen kassabon'
    gloss: Als u geen kassabon hebt, kunnen we het geld niet teruggeven.
    note: '*نداشته باشین* is de ontkenning van *داشته باشین* (als u hebt). De hoofdzin is ook ontkennend: *نمی‌توانیم پول را پس بدهیم* betekent: we kunnen het geld niet teruggeven. Tegen een klant gebruikt de winkel *-ین*.'
  prs.a2.unit37.lesson04.teach.seven_days:
    title: Als u het binnen zeven dagen terugbrengt, ruilen we het artikel om
    gloss: Als u het binnen zeven dagen terugbrengt, ruilen we het artikel om.
    note: '*تا هفت روز* betekent: tot zeven dagen. *بیاورین* is de aanvoegende wijs van *آوردن* voor u (beleefd of meervoud): als u brengt.'
  prs.a2.unit37.lesson05.teach.notice:
    title: Een mededeling in een winkel
    gloss: Een winkelmededeling voor klanten over het omruilen van artikelen en het terugkrijgen van geld.
    note: 'Dit is het soort mededeling dat je in een winkel ziet. Lees op de voorwaarden: wat de winkel doet als u een kassabon hebt, als het artikel kapot is, als u geen kassabon hebt en als u een probleem hebt. Elke regel is een *اگر*-zin plus een hoofdzin.'
  prs.a2.unit37.lesson05.teach.weather_turn01:
    title: Zeynab vraagt naar morgen
    gloss: Shahin, wat ga je morgen doen?
    note: Zeynab vraagt haar vriend naar zijn plannen met de vraag *فردا چه می‌کنی؟* (wat doe je morgen?), met de tegenwoordige tijd voor de toekomst.
  prs.a2.unit37.lesson05.teach.weather_turn02:
    title: Shahin noemt twee plannen
    gloss: Als het mooi weer is, ga ik met mijn vrienden naar het park. Als het regent, blijf ik thuis.
    note: Shahin heeft twee voorwaarden met twee plannen. Beide voorwaarden gebruiken de aanvoegende wijs (*باشد، ببارد*) en beide hoofdzinnen gebruiken de tegenwoordige tijd (*می‌روم، می‌مانم*).
  prs.a2.unit37.lesson05.teach.weather_turn03:
    title: Zeynab komt misschien
    gloss: Als ik tijd heb, kom ik ook.
    note: '*داشته باشم* is de aanvoegende wijs voor: als ik heb. *من هم* betekent: ik ook.'
  prs.a2.unit37.lesson05.teach.weather_turn04:
    title: Shahin nodigt haar uit
    gloss: Fijn! Als je komt, voetballen we ook.
    note: '*بیایی* is de aanvoegende wijs van *آمدن* voor jij (vriend). De hoofdzin zegt wij: *می‌کنیم*.'
  prs.a2.unit37.lesson05.teach.weather_turn05:
    title: Zeynab vraagt naar de tijd
    gloss: Hoe laat gaan jullie?
    note: '*می‌روین* betekent: jullie gaan (beleefd of meervoud): Zeynab vraagt naar de hele groep.'
  prs.a2.unit37.lesson05.teach.weather_turn06:
    title: Shahin vraagt haar te bellen
    gloss: Om tien uur. Als je te laat bent, bel dan.
    note: De voorwaarde is *دیر شوی* en de hoofdzin is het bevel *تیلفون کن*.
  prs.a2.unit37.lesson05.teach.weather_turn07:
    title: Zeynab doet zelf een aanbod
    gloss: Goed. Als het regent, bel ik.
    note: 'Zeynab gebruikt ook *اگر* met *ببارد* en een hoofdzin in de tegenwoordige tijd: *تیلفون می‌کنم*.'
  prs.a2.unit37.lesson06.teach.shop_turn01:
    title: Fariba legt haar probleem uit
    gloss: Pardon, ik heb gisteren in deze winkel een paraplu gekocht. De paraplu is kapot.
    note: Fariba begint beleefd met *ببخشین*. Ze zegt dat de paraplu *خراب* is en dat ze hem *دیروز* heeft gekocht.
  prs.a2.unit37.lesson06.teach.shop_turn02:
    title: De winkelmedewerker noemt een voorwaarde
    gloss: Als u de kassabon bij u hebt, kunnen we hem omruilen.
    note: 'De winkel gebruikt het patroon van de mededeling: een voorwaarde met *باشد* en *می‌توانیم* plus de aanvoegende wijs. *آن را* betekent: het/hem.'
  prs.a2.unit37.lesson06.teach.shop_turn03:
    title: Fariba heeft de kassabon
    gloss: Ja, hier is de kassabon.
    note: '*رسید این است* betekent: hier is de kassabon. *بلی* betekent ja.'
  prs.a2.unit37.lesson06.teach.shop_turn04:
    title: De winkelmedewerker biedt twee keuzes
    gloss: Prima. Als u een andere paraplu wilt, neemt u er een. Als u dat niet wilt, geven we uw geld terug.
    note: 'Twee voorwaarden, allebei met de tegenwoordige tijd: *اگر ... می‌خواهین* (als u wilt) met het bevel *بگیرین*, en *اگر نمی‌خواهین* (als u niet wilt) met *پس می‌دهیم*.'
  prs.a2.unit37.lesson06.teach.shop_turn05:
    title: Fariba kiest
    gloss: Ik neem een andere paraplu. Dank u wel.
    note: 'Fariba antwoordt in de tegenwoordige tijd: *می‌گیرم* betekent: ik neem, en het laat zien dat ze een besluit heeft genomen.'
  prs.a2.unit37.lesson06.teach.want:
    title: Als u geen andere paraplu wilt, geven we uw geld terug
    gloss: Als u geen andere paraplu wilt, geven we uw geld terug.
    note: 'Voor een wens van nu kan de voorwaarde de gewone tegenwoordige tijd gebruiken: *می‌خواهین* betekent: u wilt, en *نمی‌خواهین*: u wilt niet. De hoofdzin zegt wat de winkel doet.'
exercises:
  prs.a2.unit37.lesson01.exercise01.recognize_good_weather:
    instruction: Wat betekent deze zin?
    correct_option: Als het mooi weer is, ga ik naar het park
    distractors:
    - Als het regent, ga ik naar het park
    - Het weer was goed, dus ik ging naar het park
    - Ik ga niet naar het park
    accepted_answers:
    - value: Als het mooi weer is, ga ik naar het park
      status: correct
    feedback: '*اگر هوا خوب باشد* betekent: als het weer goed is, en *به پارک می‌روم* is wat er dan gebeurt.'
  prs.a2.unit37.lesson01.exercise02.recognize_rain_home:
    instruction: Wat betekent deze zin?
    correct_option: Als het regent, blijf ik thuis
    distractors:
    - Als het regent, ga ik naar buiten
    - Het regende, dus ik bleef thuis
    - Ik blijf nooit thuis
    accepted_answers:
    - value: Als het regent, blijf ik thuis
      status: correct
    feedback: '*اگر باران ببارد* betekent: als het regent, en *در خانه می‌مانم* betekent: ik blijf thuis.'
  prs.a2.unit37.lesson01.exercise03.complete_warm:
    instruction: 'Maak de zin af: Als het warm is, ga ik naar buiten.'
    accepted_answers:
