    gloss: groene bak
    note: سطل سبز is een combinatie van سطل (afvalbak) en سبز (groen).
  prs.a1.unit44.lesson01.teach.plastic_word:
    title: Plastic
    gloss: plastic
    note: پلاستیک is een gangbaar leenwoord dat in alle varianten van het Perzisch wordt gebruikt, ook in het Dari.
