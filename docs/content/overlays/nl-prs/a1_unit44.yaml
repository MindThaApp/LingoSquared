    gloss: kleur / groen / blauw
    note: رنگ, سبز en آبی zijn herhalingswoorden om de twee afvalbakken te benoemen.
    target_text: رنگ (kleur) / سبز (groen) / آبی (blauw)
  prs.a1.unit44.lesson01.teach.bin_word:
    title: Bak
    gloss: afvalbak
    note: سطل is het gewone Dari-woord voor een afvalbak of emmer.
