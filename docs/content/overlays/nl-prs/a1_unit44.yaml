course:
  title: Dari in het Nederlands A1
  description: 'Kabuls Dari voor beginners: sorteer huishoudelijk afval in de juiste bak, vraag in welke bak iets hoort en lees een kort ophaalschema met twee items. Praat over afval, papier, plastic en glas en controleer met een vriend of vriendin de sortering in de groene en blauwe bak.'
