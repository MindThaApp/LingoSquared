course:
  title: Dari in het Nederlands A1
  description: 'Dari (Kabul) voor beginners: een eenvoudig bibliotheekitem lenen en terugbrengen, naar de inleverdatum vragen en een korte tekst over een geleend boek lezen -- vragen welk boek iemand wil, een inleverdatum voorstellen en bevestigen, en een eenvoudig gesprek in de bibliotheek begrijpen.'
units:
  prs.a1.unit43.library:
    title: De bibliotheek
    description: Vraag om een boek, leen het en breng het terug, vraag naar een inleverdatum en bevestig die, en lees een korte tekst over een geleend boek.
