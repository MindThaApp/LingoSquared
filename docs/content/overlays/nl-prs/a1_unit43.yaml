    gloss: teruggeven
    note: پس دادن betekent letterlijk „teruggeven”; پس (terug) is gecombineerd met دادن (geven).
    example_gloss: De inleverdatum is maandag.
  prs.a1.unit43.lesson02.teach.ask_return_date_phrase:
    title: Op welke dag moet het boek terug?
    gloss: Op welke dag moet het boek terug?
    note: تاریخ پس دادن کتاب کدام روز است؟ vraagt wanneer een geleend boek terug moet.
  prs.a1.unit43.lesson02.teach.return_date_answer_phrase:
    title: De inleverdatum is maandag
    gloss: De inleverdatum is maandag.
    note: تاریخ پس دادن دوشنبه است beantwoordt de vraag met een bepaalde dag.
  prs.a1.unit43.lesson03.teach.review_want_book_one_this:
