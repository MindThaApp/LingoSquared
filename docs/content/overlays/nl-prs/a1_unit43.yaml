    gloss: ik wil / boek / een / één / dit
    note: می‌خواهم، کتاب، یک en این zijn herhalingswoorden om om een bepaald boek te vragen.
    target_text: می‌خواهم (ik wil) / کتاب (boek) / یک (een / één) / این (dit)
  prs.a1.unit43.lesson03.teach.get_word:
    title: Nemen / krijgen
    gloss: nemen / krijgen
    note: بگیرم is de aanvoegende wijs („dat ik neem”), dezelfde vorm die in Unit 42 met می‌خواهم werd gebruikt voor „ik wil nemen”.
    example_gloss: Ik wil een boek lenen.
