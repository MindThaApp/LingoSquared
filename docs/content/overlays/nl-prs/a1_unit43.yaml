  prs.a1.unit43.lesson05.reading:
    title: Lezen over het geleende boek
  prs.a1.unit43.lesson06.wrap_up:
    title: Afsluiting
teaching:
  prs.a1.unit43.lesson01.teach.review_book_have_is_in:
    title: 'Herhaling: boek, ik heb, is, in'
    gloss: boek / ik heb / is / in
    note: کتاب, دارم, است en در zijn herhalingswoorden om over een boek te praten.
    target_text: کتاب (boek) / دارم (ik heb) / است (is) / در (in)
  prs.a1.unit43.lesson01.teach.review_want_one:
    title: 'Herhaling: ik wil, een/één'
    gloss: ik wil / een / één
    note: می‌خواهم en یک combineer je om te zeggen wat je wilt.
    target_text: می‌خواهم (ik wil) / یک (een / één)
  prs.a1.unit43.lesson01.teach.library_word:
    title: Bibliotheek
    gloss: bibliotheek
    note: کتابخانه is het gewone Dari-woord voor bibliotheek, gevormd uit کتاب (boek) en خانه (huis).
    example_gloss: Het boek staat in de bibliotheek.
  prs.a1.unit43.lesson01.teach.librarian_word:
    title: Bibliothecaris
    gloss: bibliothecaris
    note: کتابدار betekent letterlijk „boekhouder” (iemand die voor de boeken zorgt) en is op dezelfde manier gevormd als دوکاندار („winkelier”, Unit 8).
    example_gloss: De bibliothecaris is in de bibliotheek.
  prs.a1.unit43.lesson01.teach.want_book_phrase:
    title: Ik wil een boek
    gloss: Ik wil een boek.
    note: یک کتاب می‌خواهم combineert یک (een/één), کتاب (boek) en می‌خواهم (ik wil).
  prs.a1.unit43.lesson01.teach.review_from_object_marker:
    title: 'Herhaling: van, lijdend-voorwerpmarkeerder'
    gloss: van / (lijdend-voorwerpmarkeerder)
    note: از (van) en را (markeert het lijdend voorwerp van een zin, uit Unit 14/Unit 26) zijn herhalingswoorden.
    target_text: از (van / uit) / را (lijdend-voorwerpmarkeerder)
  prs.a1.unit43.lesson01.teach.want_book_from_librarian_phrase:
    title: Ik wil het boek van de bibliothecaris
    gloss: Ik wil het boek van de bibliothecaris.
    note: از کتابدار (van de bibliothecaris) wordt toegevoegd aan کتاب را می‌خواهم.
  prs.a1.unit43.lesson01.teach.want_one_book_from_librarian_phrase:
    title: Ik wil een boek van de bibliothecaris
    gloss: Ik wil een boek van de bibliothecaris.
    note: Combineert یک (een/één) met کتاب را از کتابدار می‌خواهم.
  prs.a1.unit43.lesson02.teach.review_date_day_monday:
    title: 'Herhaling: datum, dag, maandag'
    gloss: datum / dag / maandag
    note: تاریخ, روز en دوشنبه (allemaal uit Unit 9) zijn herhalingswoorden om naar een inleverdatum te vragen.
    target_text: تاریخ (datum) / روز (dag) / دوشنبه (maandag)
  prs.a1.unit43.lesson02.teach.review_which_is:
    title: 'Herhaling: welk, is'
    gloss: welk / is
    note: کدام en است zijn herhalingswoorden om een vraag te stellen.
    target_text: کدام (welk) / است (is)
  prs.a1.unit43.lesson02.teach.return_giving_back_word:
