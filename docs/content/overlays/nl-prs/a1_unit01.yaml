course:
  title: Dari in het Nederlands A1
  description: Dari (Afghaans) voor beginners, gericht op het lezen van het Perzisch-Arabische schrift, het begrijpen van alledaagse Afghaanse spreektaal, het uitwisselen van uitgebreide begroetingen en een respectvolle eerste kennismaking op een werkplek in Kabul.
units:
  prs.a1.unit01.greetings:
    title: Begroetingen en eerste ontmoetingen
lessons:
  prs.a1.unit01.lesson01.script_ramp:
    title: Lees de letters uit deze unit
  prs.a1.unit01.lesson02.everyday_greetings:
    title: Wissel alledaagse begroetingen uit
  prs.a1.unit01.lesson03.time_and_farewells:
    title: Begroet en neem afscheid op verschillende momenten
  prs.a1.unit01.lesson04.formal_informal_small_talk:
    title: Voer beleefde en informele small talk
  prs.a1.unit01.lesson05.afghan_hospitality:
    title: Vraag naar iemands familie en toon respect voor gasten
  prs.a1.unit01.lesson06.first_meeting_dialogue:
    title: Begin een eerste dag op een werkplek in Kabul
teaching:
  prs.a1.unit01.lesson01.teach.alef_be_te_dal:
    title: De letters ا، ب، ت en د
    gloss: a/ā, b, t en d
    note: Dari schrijf je van rechts naar links. د verbindt niet door naar links.
  prs.a1.unit01.lesson01.teach.re_ze:
    title: De letters ر en ز
    gloss: r en z
    note: Geen van beide letters verbindt door met de volgende letter.
  prs.a1.unit01.lesson01.teach.sin_shin_sad:
    title: De letters س، ش en ص
    gloss: s, sj en s
    note: س en ص staan in gewoon Dari allebei voor een s-klank; ش staat voor sj.
  prs.a1.unit01.lesson01.teach.jim_che_he_khe:
    title: De letters ج، چ، ح en خ
    gloss: dzj, tsj, h en kh
    note: چ is tsj (ch). خ is de klank die meestal als kh wordt weergegeven.
  prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf:
    title: De letters ع، غ، ف en ق
    gloss: ʿ, gh, f en q
    note: Hoe غ en ق precies klinken, verschilt per Dari-spreker; houd ze in de spelling wel uit elkaar.
  prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim:
    title: De letters ک، گ، ل en م
    gloss: k, g, l en m
    note: ک is de Perzische kaf; dit is de vorm die in het Dari voor k wordt gebruikt. ل en م verbinden met de letters aan beide kanten.
  prs.a1.unit01.lesson01.teach.nun_vav_he_ye:
    title: De letters ن، و، ه en ی
    gloss: n, w/v/o/u, h en j/lange i
    note: ی is de Perzische ye, gebruikt voor j en voor de lange klinker ie. و kan een medeklinker (w/v) of een lange klinker (o/oe) zijn.
  prs.a1.unit01.lesson01.teach.connected_salam:
    title: Lees een aaneengeschreven woord
    gloss: hallo
    note: De letters verbinden tot سلام. Korte klinkers worden meestal weggelaten.
    example_gloss: Hallo! Ik ben Karim.
  prs.a1.unit01.lesson02.teach.salam_alaikum:
    title: Een respectvolle alledaagse begroeting
    gloss: Vrede zij met u / hallo
    note: سلام علیکم is wijdverbreid in Afghanistan en past bij zowel vertrouwde als respectvolle ontmoetingen.
  prs.a1.unit01.lesson02.teach.wa_alaikum_salam:
    title: Beantwoord de groet
    gloss: En vrede zij met u
    note: وعلیکم سلام is het gebruikelijke antwoord op سلام علیکم. Vormen met السلام worden ook geaccepteerd.
  prs.a1.unit01.lesson02.teach.salam:
    title: Een korte begroeting
    gloss: hallo
    note: سلام is een flexibele, kortere begroeting.
    example_gloss: Hallo, hoe gaat het met u?
  prs.a1.unit01.lesson02.teach.khosh_amadeed:
    title: Welkom
    gloss: welkom
    note: خوش آمدین is de respectvolle gesproken welkomstgroet, voor één persoon of voor meerdere personen.
  prs.a1.unit01.lesson02.teach.tashakor:
    title: Dank je
    gloss: dank je
    note: تشکر is de voorkeursvorm in het Afghaanse Dari in deze cursus. ممنون en ممنونم zijn bekende, minder gebruikte varianten.
    example_gloss: Hartelijk bedankt.
  prs.a1.unit01.lesson02.teach.khahesh:
    title: Een formeel antwoord op dank
    gloss: graag gedaan
    note: خواهش می‌کنم is een beleefd antwoord dat in alle Perzischtalige regio's voorkomt. Het wordt niet gepresenteerd als typisch Afghaans spreektaalgebruik.
  prs.a1.unit01.lesson02.teach.khoda_hafez:
    title: Tot ziens
    gloss: tot ziens
    note: خدا حافظ is een gebruikelijke Afghaanse afscheidsgroet in het Dari en wordt vaak als twee woorden geschreven.
  prs.a1.unit01.lesson03.teach.sobh_bekheyr:
    title: Ochtendbegroeting
    gloss: goedemorgen
    note: صبح بخیر gebruik je 's ochtends.
  prs.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Groet overdag
    gloss: goedendag
    note: روز بخیر is een beleefde groet overdag.
  prs.a1.unit01.lesson03.teach.asr_bekheyr:
    title: Groet laat op de dag
    gloss: goedemiddag / goedenavond
    note: عصر بخیر past bij het latere deel van de dag.
  prs.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Uitdrukking voor de nacht
    gloss: goedenacht
    note: شب بخیر sluit meestal een avond af en wordt niet gebruikt om een gewone ontmoeting overdag te openen.
  prs.a1.unit01.lesson03.teach.rooz_khosh:
    title: Een beleefd afscheid overdag
    gloss: fijne dag nog
    note: روز خوش is een beleefd, enigszins formeel afscheid dat in alle Perzischtalige regio's voorkomt en geen typisch Afghaanse spreektaalformule is.
  prs.a1.unit01.lesson03.teach.be_omide_didar:
    title: Tot de volgende ontmoeting
    gloss: hopelijk tot ziens
    note: به امید دیدار is een warm maar respectvol afscheid.
  prs.a1.unit01.lesson04.teach.polite_question:
    title: Vraag beleefd hoe het met iemand gaat
    gloss: Hoe gaat het met u?
    note: استین is een gangbare beleefde gesproken vorm in het Afghaanse Dari bij شما.
  prs.a1.unit01.lesson04.teach.informal_question:
    title: Vraag het aan een leeftijdsgenoot of goede vriend
    gloss: Hoe gaat het met u?
    note: تو en استی zijn informeel enkelvoud; gebruik deze combinatie niet zomaar bij een oudere of iemand die je net leert kennen.
  prs.a1.unit01.lesson04.teach.good_answer:
    title: Zeg dat het goed met je gaat
    gloss: Het gaat goed, dank je.
    note: استم betekent 'ik ben'. Dit is de gesproken Afghaanse Dari-vorm die in deze hele cursus wordt gebruikt.
  prs.a1.unit01.lesson04.teach.jor_answer:
    title: Zeg dat je gezond bent of dat het goed met je gaat
    gloss: Met mij gaat het goed.
    note: جور drukt uit dat je je goed of gezond voelt en komt vaak voor in Afghaanse begroetingen.
  prs.a1.unit01.lesson04.teach.not_bad:
    title: Een terughoudend antwoord
    gloss: Het gaat wel.
    note: بد نیستم is een neutraal antwoord.
  prs.a1.unit01.lesson04.teach.and_you:
    title: Kaats de vraag terug
    gloss: En u?
    note: و شما؟ houdt het gesprek respectvol en kort.
  prs.a1.unit01.lesson04.teach.everyone_well:
    title: Breid de begroeting uit
    gloss: Is iedereen gezond en wel?
    note: Afghaanse begroetingen kunnen doorgaan met vragen naar het gezin voordat het zakelijke gedeelte begint.
  prs.a1.unit01.lesson05.teach.family_well:
    title: Vraag naar iemands familie
    gloss: Gaat het goed met uw familie?
    note: Vragen naar de familie hoort vaak bij een uitgebreide Afghaanse begroeting. In de cursus wordt de bezittelijke vorm geschreven als فامیل‌تان.
  prs.a1.unit01.lesson05.teach.household_well:
    title: Vraag naar het huishouden
    gloss: Is iedereen thuis gezond en wel?
    note: اهل خانه verwijst collectief naar de leden van het huishouden.
  prs.a1.unit01.lesson05.teach.everyone_well:
    title: Beantwoord de vraag over de familie
    gloss: Goddank, het gaat met iedereen goed.
    note: شکر is hier een verkorte uitdrukking van dankbaarheid en niet het woord 'suiker' in de letterlijke zin van eten.
  prs.a1.unit01.lesson05.teach.zenda_bashin:
    title: Geef een warm, beleefd antwoord
    gloss: Moge u lang leven / dank u.
    note: زنده باشین is een gangbare Afghaanse beleefdheidsformule, vaak als antwoord op dank of vriendelijke woorden. باشین is de respectvolle gesproken vorm voor 'u'.
  prs.a1.unit01.lesson05.teach.own_home:
    title: Heet een gast hartelijk welkom
    gloss: Doe alsof u thuis bent.
    note: خانهٔ خودتان است stelt een gast gerust dat hij of zij welkom is.
  prs.a1.unit01.lesson05.teach.seat_of_honor:
    title: Bied de plaats van eer aan
    gloss: Neemt u alstublieft de ereplaats.
    note: In een gastenkamer nodigt بالا بفرمایین de gast uit naar de meer eervolle plek te gaan, ver van de ingang. Het betekent niet per se 'naar boven'.
  prs.a1.unit01.lesson05.teach.elders_first:
    title: Begroet eerst de ouderen
    gloss: We begroeten eerst de ouderen.
    note: Eerst de ouderen begroeten toont respect. Lichamelijk contact bij een begroeting hangt af van de relatie, het geslacht en individuele signalen; ga er als leerling niet vanuit dat een handdruk gepast is.
  prs.a1.unit01.lesson06.teach.daftar:
    title: Kantoor
    gloss: kantoor
    note: دفتر betekent 'kantoor' of 'werkplek'.
    example_gloss: Mijn kantoor is in Kabul.
  prs.a1.unit01.lesson06.teach.kabul:
    title: Kaboel
    gloss: Kaboel
    note: کابل is de hoofdstad van Afghanistan en het decor van dit gesprek.
    example_gloss: Ik woon in Kaboel.
  prs.a1.unit01.lesson06.teach.line01:
    title: Hamed stelt zich voor als de nieuwe collega
    gloss: Hamed zegt dat hij de nieuwe collega is.
    note: Beide sprekers zijn volwassen mannelijke collega's die elkaar ontmoeten op een kantoor in Kaboel.
  prs.a1.unit01.lesson06.teach.line02:
    title: Najib heet hem welkom en vraagt naar zijn naam
    gloss: Najib heet hem welkom en vraagt hoe hij heet.
    note: خوش آمدین is de beleefde gesproken Dari-welkomstgroet, geschikt voor één persoon of voor meerdere personen.
  prs.a1.unit01.lesson06.teach.line03:
    title: Hamed zegt hoe hij heet
    gloss: Hamed zegt hoe hij heet.
    note: نامم حامد است (mijn naam is Hamed) is de alledaagse gesproken vorm; نامم is نام + -م (mijn). In geschreven tekst zie je ook نام من حامد است. Beide zijn correct.
  prs.a1.unit01.lesson06.teach.line04:
    title: Najib stelt zich voor en zegt blij te zijn kennis met hem te maken
    gloss: Najib stelt zich voor en zegt blij te zijn kennis met hem te maken.
    note: از آشنایی با شما خوش شدم verwijst expliciet naar kennismaken, dus het past bij een eerste ontmoeting.
  prs.a1.unit01.lesson06.teach.line05:
    title: Hamed zegt dat het wederzijds is en vraagt hoe het met Najib gaat
    gloss: Hamed zegt dat het wederzijds is en vraagt hoe het met Najib gaat.
    note: Collega's die elkaar net leren kennen, blijven in dit gesprek het beleefde شما en استین gebruiken.
  prs.a1.unit01.lesson06.teach.line06:
    title: Najib antwoordt
    gloss: Najib zegt dat het goed met hem gaat, dank je.
    note: جور استم، تشکر is het antwoord op de vraag hoe het gaat, zoals eerder in deze unit geleerd.
  prs.a1.unit01.lesson06.teach.line07:
    title: Najib vraagt naar Hameds familie
    gloss: Najib vraagt naar Hameds familie.
    note: De vraag naar het gezin rekt de begroeting op voordat ze aan het werk gaan.
  prs.a1.unit01.lesson06.teach.line08:
    title: Hamed zegt dat het met iedereen goed gaat
    gloss: Hamed zegt dat het met iedereen goed gaat.
    note: شکر، همه جور استند is het antwoord op de vraag naar de familie, zoals eerder in deze unit geleerd.
  prs.a1.unit01.lesson06.teach.line09:
    title: Najib biedt aan de andere collega's voor te stellen
    gloss: Najib biedt aan de andere collega's voor te stellen.
    note: بفرمایین nodigt Hamed hier uit om mee te lopen, niet om te gaan zitten of iets te nemen.
  prs.a1.unit01.lesson06.teach.line10:
    title: Hamed stemt in en bedankt hem
    gloss: Hamed stemt in en bedankt hem.
    note: بسیار خوب wordt hier geïntroduceerd als een duidelijk bevestigend antwoord.
  prs.a1.unit01.lesson06.teach.line11:
    title: Najib reageert hartelijk en wijst Hameds bureau aan
    gloss: Najib reageert hartelijk en wijst Hameds bureau aan.
    note: Het gesprek eindigt met het begin van de werkdag, niet met een afscheid zoals na een bezoek thuis.
  prs.a1.unit01.lesson06.teach.line12:
    title: Hamed bedankt hem
    gloss: Hamed bedankt hem.
    note: تشکر sluit het gesprek op een eenvoudige manier af.
