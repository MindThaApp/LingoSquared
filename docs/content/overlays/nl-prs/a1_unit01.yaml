  prs.a1.unit01.lesson02.exercise06.order_youre_welcome:
    instruction: Zet de formele, in alle regio's gebruikte uitdrukking voor Graag gedaan in de juiste volgorde.
    accepted_answers:
    - value:
      - خواهش
      - می‌کنم
      status: correct
    feedback: خواهش می‌کنم is een beleefd antwoord op dank dat in alle regio's wordt gebruikt.
  prs.a1.unit01.lesson02.exercise07.goodbye_meaning:
