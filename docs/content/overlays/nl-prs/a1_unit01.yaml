      status: correct
    feedback: 'سلام علیکم betekent hallo (letterlijk: ''de vrede zij met u'').'
  prs.a1.unit01.lesson02.exercise02.translate_response:
    instruction: 'Vertaal naar het Dari: ''En ook met u de vrede'' (het gebruikelijke antwoord op سلام علیکم).'
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: acceptable_with_note
      note: Geaccepteerde variant in spatiëring.
    - value: وعلیکم السلام
      status: acceptable_with_note
      note: Gangbare volledige antwoordvariant.
    - value: و علیکم السلام
      status: acceptable_with_note
      note: Gangbaar volledig antwoord met een los voegwoord.
    feedback: وعلیکم سلام is het gebruikelijke antwoord; gangbare volledige vormen met السلام zijn ook geldig.
  prs.a1.unit01.lesson02.exercise03.reply_greeting:
    instruction: Antwoord op سلام علیکم.
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: correct
    - value: وعلیکم السلام
      status: correct
    - value: و علیکم السلام
      status: correct
    - value: سلام
      status: acceptable_with_note
      note: Begrijpelijk, maar minder wederkerig dan het volledige antwoord.
    feedback: وعلیکم سلام en وعلیکم السلام zijn gebruikelijke volledige antwoorden.
  prs.a1.unit01.lesson02.exercise04.welcome_meaning:
    instruction: Kies de betekenis van خوش آمدین.
    correct_option: welkom
    distractors:
    - tot ziens
    - dank je
    - welterusten
    accepted_answers:
    - value: welkom
      status: correct
    feedback: خوش آمدین betekent welkom.
  prs.a1.unit01.lesson02.exercise05.produce_thanks:
    instruction: 'Vertaal naar het Dari: Dank je.'
    accepted_answers:
    - value: تشکر
      status: correct
    - value: ممنون
      status: acceptable_with_note
      note: Wordt in het Dari begrepen; تشکر is de voorkeursvorm in deze cursus.
