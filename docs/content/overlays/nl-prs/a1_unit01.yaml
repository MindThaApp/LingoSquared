    correct_option: tot ziens
    distractors:
    - welkom
    - hallo
    - dank je
    accepted_answers:
    - value: tot ziens
      status: correct
    feedback: خدا حافظ is een afscheidsgroet.
  prs.a1.unit01.lesson02.exercise08.speak_exchange:
    instruction: Je hoort سلام علیکم. Beantwoord de groet hardop.
    accepted_answers:
