course:
  title: Dari A2
  description: 'Afghaans Dari voor lager-gevorderden: een probleem in huis melden aan je huisbaas — woordenschat, het probleem beschrijven, een onderhoudsbericht lezen en het telefoongesprek zelf.'
units:
  prs.a2.unit13.maintenance:
    title: Een probleem in huis melden
lessons:
  prs.a2.unit13.lesson01.maintenance_vocabulary:
    title: Woorden voor problemen in huis
  prs.a2.unit13.lesson02.reporting_the_problem:
    title: Het probleem melden
  prs.a2.unit13.lesson03.reading_a_maintenance_notice:
    title: Een onderhoudsbericht lezen
  prs.a2.unit13.lesson04.maintenance_call_dialogue:
    title: De huisbaas bellen
teaching:
  prs.a2.unit13.lesson01.teach.malfunction_word:
    title: Defect / probleem
    gloss: defect / storing
    note: '*خرابی* is het algemene woord voor iets wat kapot is of niet goed werkt.'
    example_gloss: Ik heb het defect aan de leiding gemeld.
  prs.a2.unit13.lesson01.teach.pipe_word:
    title: Leiding
    gloss: leiding
    note: '*لوله* is het gewone woord voor een leiding of buis.'
    example_gloss: De leiding in de keuken lekt.
  prs.a2.unit13.lesson01.teach.electricity_word:
    title: Elektriciteit
    gloss: elektriciteit / stroom
    note: '*برق* betekent elektriciteit of stroomvoorziening.'
    example_gloss: De stroom in mijn slaapkamer doet het niet.
  prs.a2.unit13.lesson01.teach.leak_word:
    title: Lek
    gloss: lek / gedrup
    note: '*چکه* beschrijft water dat lekt of druppelt.'
    example_gloss: Het lek in de leiding wordt elke nacht erger.
  prs.a2.unit13.lesson01.teach.repair_word:
    title: Reparatie
    gloss: reparatie
    note: '*تعمیر* is het algemene woord voor een reparatie.'
    example_gloss: De leiding wordt morgen gerepareerd.
  prs.a2.unit13.lesson01.teach.worker_word:
    title: Reparateur
    gloss: reparateur / arbeider
    note: '*کارگر* is een arbeider in het algemeen, hier specifiek een reparateur.'
    example_gloss: De huisbaas stuurt een reparateur.
  prs.a2.unit13.lesson01.teach.asap_grammar:
    title: Zo snel mogelijk, met هر چه زودتر
    gloss: zo snel mogelijk
    note: '*هر چه زودتر* -- een constructie voor urgentie, letterlijk ''hoe eerder hoe beter''.'
    target_text: هر چه زودتر (zo snel mogelijk)
  prs.a2.unit13.lesson02.teach.pipe_leaking_asap:
    title: De lekkende leiding melden, met urgentie
    gloss: Mijn keukenleiding lekt en moet zo snel mogelijk gerepareerd worden.
    note: Combineert *چکه می‌کند* (lekt) met *هر چه زودتر* en *باید* (moeten).
  prs.a2.unit13.lesson02.teach.when_send_worker:
    title: Vragen wanneer er een reparateur kan komen
    gloss: Wanneer kunt u een reparateur sturen?
    note: '*کی می‌توانین...؟* betekent ''wanneer kunt u...?''.'
  prs.a2.unit13.lesson02.teach.bedroom_electricity_not_working:
    title: Een tweede probleem melden
    gloss: De stroom in mijn slaapkamer doet het niet.
    note: '*کار نمی‌کند* betekent ''werkt niet'', voor een apparaat of voorziening.'
  prs.a2.unit13.lesson03.teach.cost_word:
    title: Kosten
    gloss: kosten
    note: '*هزینه* is het algemene woord voor kosten of uitgaven.'
    example_gloss: De elektrische reparatie kost geld.
  prs.a2.unit13.lesson03.teach.free_word:
    title: Gratis
    gloss: gratis
    note: '*رایگان* betekent ''gratis'', zonder kosten.'
    example_gloss: De reparatie van de leiding is gratis.
  prs.a2.unit13.lesson03.teach.notice_text:
    title: Een onderhoudsbericht van het gebouw
    gloss: De onderhoudsmedewerker komt donderdag om tien uur. Reparaties aan leidingen zijn gratis, maar reparaties aan de elektriciteit kosten geld.
    note: Een kort algemeen bericht van het gebouw in formeel schriftelijk taalgebruik -- een ander bericht dan het telefoongesprek van کریم verderop in de les, en niet hetzelfde bezoek.
  prs.a2.unit13.lesson04.teach.turn01:
    title: De huisbaas neemt de telefoon op
    gloss: 'De huisbaas neemt op: ''Hallo, zegt u het maar.'''
    note: '*الو* zeg je als je een telefoon opneemt; *بفرمایین* betekent hier ''zegt u het maar'' in plaats van het gebruikelijke ''komt u binnen''.'
  prs.a2.unit13.lesson04.teach.turn02:
    title: کریم stelt zich voor en meldt het lek
    gloss: Hij groet, zegt dat hij کریم is en dat zijn keukenleiding lekt.
    note: '*استم* is het koppelwerkwoord ''ik ben'': *من کریم استم* betekent ''ik ben کریم''.'
  prs.a2.unit13.lesson04.teach.turn03:
    title: De huisbaas vraagt sinds wanneer
    gloss: De huisbaas vraagt sinds wanneer het speelt.
    note: '*از کی شروع شده؟* betekent ''sinds wanneer is het begonnen?''.'
  prs.a2.unit13.lesson04.teach.turn04:
    title: کریم antwoordt met urgentie
    gloss: Sinds gisteravond. Het moet zo snel mogelijk gerepareerd worden.
    note: '*دیشب* betekent ''gisteravond'' of ''afgelopen nacht''.'
  prs.a2.unit13.lesson04.teach.turn05:
    title: De huisbaas stemt in met een tijdstip
    gloss: Goed, hij stuurt morgen om negen uur een reparateur.
    note: '*باشد* betekent ''goed'' of ''akkoord''.'
  prs.a2.unit13.lesson04.teach.turn06:
    title: کریم bedankt hem en meldt een tweede probleem
    gloss: Hij bedankt de huisbaas en zegt dat de stroom in zijn slaapkamer ook niet werkt.
    note: '*هم* betekent hier ''ook'' en voegt het tweede probleem toe.'
  prs.a2.unit13.lesson04.teach.turn07:
    title: De huisbaas bevestigt dat hij het doorgeeft
    gloss: De huisbaas zegt dat hij dat ook aan de reparateur doorgeeft.
    note: '*آن را هم به کارگر می‌گویم* -- ''ik zeg dat ook tegen de reparateur'' -- verwijst terug naar het probleem met de elektriciteit.'
