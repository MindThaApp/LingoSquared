    title: 'Herhaling: een, dichtbij, is, willen'
    gloss: een / dichtbij / is / ik wil
    note: یک, نزدیک, است en می‌خواهم zijn herhalingsvormen die je gebruikt bij simpele verzoeken aan het loket.
    target_text: یک (een) / نزدیک (dichtbij) / است (is) / می‌خواهم (ik wil)
  prs.a1.unit35.lesson01.teach.want_stamp_phrase:
    title: Ik wil een postzegel
    gloss: Ik wil een postzegel.
    note: Gebruik می‌خواهم voor een beleefd, simpel verzoek.
