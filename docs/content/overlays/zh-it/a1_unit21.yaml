teaching:
  it.a1.unit21.lesson01.teach_maglietta_pantaloni:
    title: la maglietta, i pantaloni
    gloss: T恤，裤子
    note: 意大利语中，*maglietta* 是阴性单数，*pantaloni* 是复数；汉语的名词没有性和单复数的词形变化。
    example_gloss:
    - 这件T恤是蓝色的。
    - 这条裤子是给埃莱娜的。
  it.a1.unit21.lesson01.teach_scarpe_giacca:
    title: le scarpe, la giacca
    gloss: 鞋子，外套
    note: '*Scarpe* 是复数；*giacca* 是阴性单数。'
    example_gloss:
    - 这双鞋很舒服。
    - 这件外套很大。
  it.a1.unit21.lesson01.teach_blu_nero:
    title: blu
    gloss: 蓝色
    note: '*Blu* 不随性别变化。'
    example_gloss:
    - 这件T恤是蓝色的。
  it.a1.unit21.lesson01.teach_la_maglietta_e_blu:
    title: La maglietta è blu.
    gloss: 这件T恤是蓝色的。
    note: 描述一件物品的颜色时，用 *è*。
    example_gloss:
    - 这件T恤是蓝色的。
  it.a1.unit21.lesson02.teach_taglia_piccola_media_grande:
    title: taglia piccola, media, grande
    gloss: 小号，中号，大号
    note: '*Taglia* 指衣服的尺码，是阴性名词，所以表示尺码的词要与它保持一致：*taglia piccola*、*taglia media*；*grande* 阴阳性同形。'
    example_gloss:
    - 我想要中号。
  it.a1.unit21.lesson02.teach_vorrei_maglietta_blu:
    title: Vorrei una maglietta blu, taglia media.
    gloss: 我想要一件蓝色T恤，中号。
    note: '*Vorrei* 让购买衣服时的请求显得礼貌。'
    example_gloss:
    - 我想要一件蓝色T恤，中号。
  it.a1.unit21.lesson02.teach_quanto_costa:
    title: Quanto costa?
    gloss: 这个多少钱？
    note: 询问一件物品时，用单数的 *costa*。
    example_gloss:
    - 这个多少钱？
  it.a1.unit21.lesson02.teach_costa_dieci_euro:
    title: Costa dieci euro.
    gloss: 十欧元。
    note: 在标准用法中，*euro* 放在数字后面通常保持不变。
    example_gloss:
    - 十欧元。
