course:
  title: 意大利语 A1
  description: 意大利语入门:学习描述一个人的基本外貌,包括身高和年龄印象、头发和眼睛的颜色、核心问句 Com'è?,以及比较两个人的外貌。
units:
  it.a1.unit42.aspetto:
    title: 描述外貌
lessons:
  it.a1.unit42.lesson01.alto_basso_anziano_e:
    title: 高、矮、年老和年轻
  it.a1.unit42.lesson02.descrivere_i_capelli:
    title: 描述头发
  it.a1.unit42.lesson03.gli_occhi_e_com:
    title: 眼睛和询问某人的外貌
  it.a1.unit42.lesson04.giulia_descrive_nina:
    title: Giulia 描述 Nina
  it.a1.unit42.lesson05.luca_e_chiara_a:
    title: 比较 Luca 和 Chiara
  it.a1.unit42.lesson06.marco_riconosce_nina:
    title: Marco 认出 Nina
teaching:
  it.a1.unit42.lesson01.teach.alto_basso:
    title: 高和矮
    gloss: 高的／矮的
    note: '*Alto* 形容个子高的人,*basso* 形容个子矮的人。意大利语的形容词要与所描述的人保持一致:*alto/alta*、*basso/bassa*。'
    example_gloss:
    - Chiara 个子很高。
    - Luca 个子很矮。
  it.a1.unit42.lesson01.teach.anziano_giovane:
    title: 年老和年轻
    gloss: 年老的／年轻的
    note: '*Anziano*(年老的)和 *giovane*(年轻的)表示大致的印象,而不是确切的岁数。*Giovane* 以 -e 结尾,所以男女通用。'
    example_gloss:
    - 爷爷年纪大了。
    - Marco 很年轻。
  it.a1.unit42.lesson01.teach.per_l_eta:
    title: 年龄:avere anni 还是 anziano
    gloss: 说确切的年龄时,意大利语用 avere + anni:Quanti anni hai?表达大致印象时则用形容词:Il nonno è anziano.
    note: 意大利语说年龄用“有”:*ho trent'anni*,字面意思是“我有三十岁”。形容词 *anziano* 用来说一个人看起来年纪大。
  it.a1.unit42.lesson01.teach.chiara_e_alta:
    title: Chiara 个子高,Luca 个子矮
    gloss: Chiara 个子高,Luca 个子矮。
    note: 用 *e*(和)连接两个形容词。每个形容词都要与各自所指的人保持一致:*alta*(阴性)和 *basso*(阳性)。
  it.a1.unit42.lesson02.teach.i_capelli:
    title: 头发
    gloss: 头发
    note: '*I capelli* 在意大利语中是复数:意大利人把头发说成“那些头发”。单数 *il capello* 指的是一根头发。'
    example_gloss: Marco 留着黑色短发。
  it.a1.unit42.lesson02.teach.biondi_castani_grigi:
    title: 金色、棕色和灰白色
    gloss: 金色的／棕色的／灰白的
    note: 三种发色都用阳性复数,以与 *capelli* 保持一致:*biondi*、*castani*、*grigi*。*Neri*(黑色)也可以用来形容头发。
    example_gloss:
    - Giulia 留着金发。
    - Luca 留着棕色头发。
    - 爷爷头发灰白。
  it.a1.unit42.lesson02.teach.lunghi_corti:
    title: 长和短（头发）
    gloss: 长的／短的（头发）
    note: '*Lunghi*(长的)和 *corti*(短的)与 *capelli* 一样是复数。*Alto*(高)只用于人,不能用于头发。'
    example_gloss:
    - Chiara 留着长发。
    - Luca 留着短发。
  it.a1.unit42.lesson02.teach.i_capelli_sono:
    title: Capelli 是复数
    gloss: Capelli 是复数,所以形容词也用复数:i capelli biondi, castani, grigi, neri, lunghi, corti.
    note: 形容词放在名词后面,并在性和数上与名词一致:*capelli lunghi*(阳性复数)、*occhi azzurri*。
  it.a1.unit42.lesson02.teach.per_descrivere_una:
    title: 头发和眼睛用 avere
    gloss: 描述一个人的外貌时,意大利语用 avere 搭配头发和眼睛:Giulia ha i capelli biondi e gli occhi azzurri.
    note: 意大利语还要加冠词:*i capelli*、*gli occhi*,而汉语说“金色的头发”不需要冠词。也可以说 *è bionda*,但这里要学的是 *avere* 的句型。
  it.a1.unit42.lesson02.teach.marco_ha_i:
    title: Marco 留着黑色短发
    gloss: Marco 留着黑色短发。
    note: '*Neri*(黑色的)是阳性复数,与 *capelli* 保持一致。'
  it.a1.unit42.lesson02.teach.giulia_ha_i:
    title: Giulia 留着金色长发
    gloss: Giulia 留着金色长发。
    note: 这个自然的句子结合了本课表示头发长度和颜色的词汇。
  it.a1.unit42.lesson03.teach.gli_occhi:
    title: 眼睛
    gloss: 眼睛
    note: '*Occhio*(眼睛)是阳性名词;复数是 *occhi*,因为以元音开头,所以用 *gli*。'
    example_gloss: Marco 有一双棕色的眼睛。
  it.a1.unit42.lesson03.teach.azzurri_marroni_verdi:
    title: 蓝色、棕色和绿色
    gloss: 蓝色的／棕色的／绿色的
    note: 眼睛的颜色:*azzurri*(蓝色)、*marroni*(棕色)、*verdi*(绿色)。这些复数形式男女通用。
    example_gloss:
    - Giulia 有一双蓝眼睛。
    - Luca 有一双棕色的眼睛。
    - Chiara 有一双绿眼睛。
  it.a1.unit42.lesson03.teach.anche_gli_occhi:
    title: 颜色形容词要用复数
    gloss: 眼睛的颜色要用复数,与 occhi 一致:occhi azzurri, marroni, verdi.
    note: 单数以 -e 结尾的形容词(*verde*、*marrone*),复数以 -i 结尾:*verdi*、*marroni*。
  it.a1.unit42.lesson03.teach.com_e_giulia:
    title: Giulia 长什么样?
    gloss: Giulia 长什么样?
    note: '*Com''è?* 是询问外貌的核心问句。*Com''è* 是 *come è* 省略 e 后加上撇号的形式。'
  it.a1.unit42.lesson03.teach.giulia_ha_i:
    title: Giulia 留着金色长发,有一双蓝眼睛
    gloss: Giulia 留着金色长发,有一双蓝眼睛。
    note: 示范回答:用一个句子表达 *avere* + 头发 + *e* + 眼睛。
  it.a1.unit42.lesson04.teach.giulia_al_caffe:
    title: Giulia 介绍 Nina
    gloss: Giulia:语言咖啡馆来了一个新女孩,她叫 Nina。
    note: '*Viene*(来)用来引出新来的人。*Si chiama* 的意思是“她叫……”,字面意思是“她称呼自己”。'
  it.a1.unit42.lesson04.teach.marco_va_bene:
    title: Marco 问她长什么样
    gloss: Marco:好的!她长什么样?
    note: 又是同一个问句,这次没有提名字:根据上下文,主语是清楚的。
  it.a1.unit42.lesson04.teach.giulia_e_bassa:
    title: Giulia 描述 Nina 的身高和头发
    gloss: Giulia:她个子矮,留着金色短发。
    note: '*È bassa*(她个子矮)用的是阴性形式 *bassa*;接着用 *ha* 描述头发。'
  it.a1.unit42.lesson04.teach.marco_e_gli:
    title: Marco 问她的眼睛
    gloss: Marco:那眼睛呢?
    note: '*E gli occhi?* 省略了动词。意大利语常常省略语境已经很清楚的词。'
  it.a1.unit42.lesson04.teach.giulia_ha_gli:
    title: Giulia 描述 Nina 的眼睛
    gloss: Giulia:她有一双绿眼睛。
    note: '*Ha gli occhi verdi*:不需要主语人称代词,因为动词的词尾已经表明主语是“她”。'
  it.a1.unit42.lesson04.teach.marco_grazie_allora:
    title: Marco 会认出她
    gloss: Marco:谢谢!那我就能认出她了。
    note: '*La riconosco*(我认出她):宾语代词 *la* 放在动词之前。'
  it.a1.unit42.lesson05.teach.luca_e_chiara:
    title: 比较 Luca 和 Chiara
    gloss: Luca 和 Chiara 是兄妹,但他们长得很不一样。Luca 个子矮,留着棕色短发,有一双棕色的眼睛。Chiara 比 Luca 高,留着棕色长发,有一双绿眼睛。你长什么样?
    note: 这段简短的比较复习了目前学过的所有颜色和长度词，最后用本单元的核心问题询问你的外貌。
    glosses:
      fratello: 兄弟
      sorella: 姐妹
      sembrano: 他们看起来 / 似乎
      diversi: 不同的
      basso: 矮的
      corti: 矮的
      castani: 棕色的
      capelli: 头发
      marroni: 棕色的
      occhi: 眼睛
      alta: 高(più alta = 更高)
      lunghi: 长的
      verdi: 绿色的
      come: 怎样(Tu come sei? = 你长什么样?)
  it.a1.unit42.lesson05.teach.il_comparativo_si:
    title: 比较:più ... di
    gloss: 意大利语用 più + 形容词 + di 来比较:Chiara è più alta di Luca.
    note: 把 *più* 放在形容词前,把 *di* 放在被比较的人前。形容词保持自己的性:*più alta*、*più alto*。
  it.a1.unit42.lesson05.teach.chiara_ha_i:
    title: Chiara 的头发比 Luca 的长
    gloss: Chiara 的头发比 Luca 的长。
    note: '*I capelli più lunghi di Luca*:形容词保持复数,以与 *capelli* 一致。'
  it.a1.unit42.lesson05.teach.ho_i_capelli:
    title: 我留着棕色短发
    gloss: 我留着棕色短发。
    note: '*Ho i capelli corti e castani*：描述自己的外貌时用 *avere*。'
  it.a1.unit42.lesson06.teach.marco_guarda_e:
    title: Marco看到了Nina
    gloss: Marco：看，那是Nina吗？她留着金色短发，有一双绿眼睛。
    note: '*Guarda*（看）是 *tu* 的命令式。*Quella* 的意思是“那一位”，指女性。'
  it.a1.unit42.lesson06.teach.giulia_si_e:
    title: Giulia确认
    gloss: Giulia：对，是Nina！
    note: 这是一个简短自然的肯定回答。
  it.a1.unit42.lesson06.teach.nina_ciao_sei:
    title: Nina向Marco打招呼
    gloss: Nina：你好，你是Marco吗？
    note: '*Sei Marco?* 是非正式的问法：*sei* 是 *essere* 的 *tu* 形式，所以不需要再说 *tu*。'
  it.a1.unit42.lesson06.teach.marco_si_piacere:
    title: Marco回应Nina的问候
    gloss: Marco：是的！很高兴认识你，Nina。
    note: '*Piacere di conoscerti* 用于初次见面；*-ti* 的意思是“你”。'
  it.a1.unit42.lesson06.teach.nina_piacere_mio:
    title: Nina 回应问候
    gloss: Nina：我也很高兴认识你！
    note: 对话到此结束——Marco根据Giulia之前的描述成功认出了Nina。
