teaching:
  it.a1.unit41.lesson01.teach.leggere_fare_sport:
    title: 阅读、锻炼、做饭
    gloss: 阅读、锻炼／做运动、做饭
    note: 三个常见的爱好动词（不定式）：*leggere*（读书）、*fare sport*（运动）和 *cucinare*（做饭）。意大利语的不定式以 -are、-ere 或 -ire 结尾。
    example_gloss:
    - 我喜欢读书。
    - 我每逢星期六都锻炼。
    - 我喜欢为朋友们做饭。
  it.a1.unit41.lesson01.teach.il_tempo_libero:
    title: 空闲时间
    gloss: 空闲时间
    note: '*Il tempo libero* 是阳性名词，所以用 *il*。这是谈论爱好时的关键短语。'
    example_gloss: 我空闲时喜欢阅读。
  it.a1.unit41.lesson01.teach.nel_mio_tempo:
    title: 表达你空闲时做什么
    gloss: 我空闲时喜欢阅读。
    note: '*Leggo* 是 *leggere*（读书）的 *io* 形式。意大利语通常省略主语代词：说 *Leggo*，而不说 *Io leggo*。'
  it.a1.unit41.lesson02.teach.ascoltare_musica_disegnare:
    title: 音乐、画画、电子游戏
    gloss: 听音乐、画画、玩电子游戏
    note: 另外三个爱好：*ascoltare musica*（听音乐）、*disegnare*（画画）和 *giocare ai videogiochi*（玩电子游戏）。
    example_gloss:
    - 我喜欢听音乐。
    - 我经常画画。
    - 我喜欢和朋友们一起玩电子游戏。
  it.a1.unit41.lesson02.teach.ascolto_volentieri_musica:
    title: 表达你喜欢听音乐
    gloss: 我喜欢听音乐。
    note: '*Ascoltare* 直接接宾语：*ascolto musica*，中间不加介词。'
  it.a1.unit41.lesson02.teach.gioco_volentieri_ai:
    title: 表达喜欢和朋友一起玩电子游戏
    gloss: 我喜欢和朋友们一起玩电子游戏。
    note: '*Con gli amici* 意思是“和朋友们一起”。*Gli* 是用在以元音开头的阳性名词前的复数冠词。'
  it.a1.unit41.lesson03.teach.sempre_spesso_a:
    title: 总是、经常、有时、从不
    gloss: 总是、经常、有时、从不
    note: 四个频率词。*Mai*（从不）需要在动词前加 *non*：*non gioco mai*。
    example_gloss:
    - 我每周六都锻炼。
    - 我经常读书。
    - 我有时画画。
    - 我从不玩电子游戏。
  it.a1.unit41.lesson03.teach.ogni_settimana_ogni:
    title: 每周、每个周末
    gloss: 每周、每个周末
    note: '*Ogni*（每）永远不变：*ogni settimana*、*ogni fine settimana*。见下一张卡片。'
    example_gloss:
    - 我每周都为朋友做饭。
    - 我每个周末都锻炼。
  it.a1.unit41.lesson03.teach.con_mai_il:
    title: Mai 要搭配 non，ogni 永远不变
    gloss: 用 mai 时，动词前还要加 non：Non gioco mai。Ogni 对所有名词都保持不变：ogni settimana, ogni fine settimana。
    note: 汉语说“我从不玩”，只用一个否定词；意大利语要说 *non gioco mai*（字面是“我不玩从不”），动词前必须有 non。*Ogni* 后面总是接单数名词。
  it.a1.unit41.lesson03.teach.cosa_fai_nel:
    title: 询问空闲时间
    gloss: 你空闲时做什么？
    note: 这是本单元的核心问题，可以用它询问任何人的爱好。
  it.a1.unit41.lesson04.teach.giulia_passeggiamo_spesso:
    title: Giulia 聊起爱好
    gloss: Giulia：我们经常一起散步。不过 Marco，你空闲时间还做什么呢？
    note: '*Passeggiamo* 是 *passeggiare* 的 *noi*（我们）形式。*Spesso* 放在动词后面。'
  it.a1.unit41.lesson04.teach.marco_cucino_volentieri:
    title: Marco 的爱好
    gloss: Marco：我喜欢做饭，在家也做。我还经常运动。
    note: '*Anche a casa*（在家也做）表明 Marco 做饭是出于喜爱，而不只是因为工作。*A casa* 意为“在家”，不加冠词。'
  it.a1.unit41.lesson04.teach.giulia_cucini_anche:
    title: Giulia 很惊讶
    gloss: Giulia：你在家也做饭？你在工作中不是已经做了一整天饭了吗！
    note: '*Già*（已经）和 *tutto il giorno*（一整天）说明 Marco 在工作中已经做了很多饭。'
  it.a1.unit41.lesson04.teach.marco_si_ma:
    title: Marco 解释
    gloss: Marco：是的，但做饭让我放松。你呢，你喜欢做什么？
    note: '*Cucinare mi rilassa* 字面意思是“做饭让我放松”：这项活动是主语，*mi*（我）是宾语。'
  it.a1.unit41.lesson04.teach.giulia_leggo_volentieri:
    title: Giulia 的爱好
    gloss: Giulia：我喜欢读书，还经常听音乐。
    note: 用 *e*（和）连接两个爱好。两个动词都用 *io* 形式：*leggo* 和 *ascolto*。
  it.a1.unit41.lesson04.teach.marco_giochi_anche:
    title: Marco 问起打游戏
    gloss: Marco：你也玩电子游戏吗？
    note: 是非问句保持陈述句的语序，只是语调上扬：*Giochi anche ai videogiochi?* *Anche* 意为“也”。
  it.a1.unit41.lesson04.teach.giulia_no_non:
    title: Giulia 的回答
    gloss: Giulia：不，我从不玩电子游戏。不过我有时会画画！
    note: 一个回答里对比了 *Non ... mai*（从不）和 *a volte*（有时）。*Ma* 意为“但是”。
  it.a1.unit41.lesson05.teach.marco_e_io:
    title: 比较爱好
    gloss: 我和 Marco 经常一起散步。不过我们还有其他爱好。Marco 喜欢做饭，在家也做，还经常运动。我喜欢读书，也经常听音乐。我有时画画，但从不玩电子游戏。你在空闲时间喜欢做什么？
    note: Giulia 的留言回顾了前面提到的内容，并以本单元的核心问题结尾，向读者发问。
    glosses:
      passeggiamo: 我们散步
      spesso: 经常
      insieme: 一起
      altri: 其他的
      cucina: 做饭
      volentieri: 乐意地
      casa: 家（a casa＝在家）
      sport: 体育运动（fa sport＝做运动）
      leggo: 阅读
      ascolto: 听
      musica: 音乐
      disegno: 画画
      volte: 次（a volte＝有时）
      videogiochi: 电子游戏
      mai: 从不
      libero: 空闲的
      tempo: 时间
  it.a1.unit41.lesson06.teach.marco_cosa_fai:
    title: Marco 问周末的安排
    gloss: Marco：这个周末你做什么？
    note: '*Questo fine settimana*（这个周末）是阳性，所以用 *questo*。*Fai* 是 *fare*（做）的 *tu* 形式。'
  it.a1.unit41.lesson06.teach.giulia_non_lo:
    title: Giulia 还没决定
    gloss: Giulia：我还不知道。我喜欢读书，但也想出去走走。
    note: '*Non lo so ancora*（我还不知道）：*lo* 代指你不知道的那件事，放在动词前面。*Uscire* 意为“出去”。'
  it.a1.unit41.lesson06.teach.marco_facciamo_una:
    title: Marco 提出计划
    gloss: Marco：我们一起去散步吧？之后我来给我们做饭。
    note: '*Poi*（然后、之后）用来排列计划的先后顺序。*Cucino io*（*io* 放在动词后）强调“由我来做饭”。'
  it.a1.unit41.lesson06.teach.giulia_buona_idea:
    title: Giulia 同意
    gloss: Giulia：好主意！散步和做饭我都喜欢。
    note: '*Sia ... sia ...* 意为“既……又……”：*mi piace sia passeggiare sia cucinare*。'
  it.a1.unit41.lesson06.teach.marco_perfetto_allora:
    title: Marco 确认
    gloss: Marco：太好了。那我们星期六见！
    note: '*Ci vediamo sabato*（星期六见）：指即将到来的那一天时，星期前不加冠词。'
