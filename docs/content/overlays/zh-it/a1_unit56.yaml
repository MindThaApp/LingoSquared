      caffè: 咖啡馆（caffè linguistico = 语言咖啡馆）
      biblioteca: 图书馆
      incendio: 火
      dipendente: 工作人员
      dice: 说
      Andate: 去（andate = 去，复数命令式）
      emergenza: 紧急情况（uscita di emergenza = 紧急出口）
      aiuto: 帮助
      bisogno: 需要（ho bisogno di = 我需要）
      chiama: 打电话叫
      vigili: 消防员（vigili del fuoco = 消防队）
      tutti: 大家
      fuori: 在外面
      bene: 好，没事（va bene = 没问题）
