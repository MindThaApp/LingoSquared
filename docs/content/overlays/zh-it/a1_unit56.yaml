    title: 一篇关于火灾的短文
    gloss: 图书馆里的语言咖啡馆发生了火灾。工作人员说：去紧急出口！尼娜需要帮助。朱莉娅和尼娜在一起。马可打电话叫消防队。大家都在外面了。没事了！
