teaching:
  it.a1.unit15.lesson01.teach.piu_meno:
    title: più, meno
    gloss: 更多，更少
    note: '*più*（更多）和 *meno*（更少）是最基本的比较词，用在形容词前，或与 *di* 搭配来进行比较。'
    example_gloss:
    - 我想要更多咖啡，更少茶。
  it.a1.unit15.lesson01.teach.di:
    title: di
    gloss: 比 / 的
    note: 在 *più*/*meno* 之后，*di* 表示“比”（*più di due euro*）；在定冠词前要缩合：*di* + *i* = *dei*，*di* + *le* = *delle*。
    example_gloss:
    - 这杯咖啡的价格超过两欧元。
  it.a1.unit15.lesson01.teach.le_mele_costano_piu_dei_pomodori:
    title: Le mele costano più dei pomodori.
    gloss: 苹果比西红柿贵。
    note: '*più dei pomodori* 使用 *di* + *i*（缩合为 *dei*），与 *i pomodori* 作比较。'
  it.a1.unit15.lesson01.teach.i_pomodori_costano_meno_delle_mele:
    title: I pomodori costano meno delle mele.
    gloss: 西红柿比苹果便宜。
    note: '*meno delle mele* 使用 *di* + *le*（缩合为 *delle*），与 *le mele* 作比较。'
  it.a1.unit15.lesson02.teach.quale_preferisci:
    title: Quale preferisci, le mele o i pomodori?
    gloss: 你更喜欢哪个，苹果还是西红柿？
    note: '*Quale*（哪个）用来请对方在刚提到的两样东西之间做选择。'
  it.a1.unit15.lesson02.teach.preferisco_le_mele:
    title: Preferisco le mele.
    gloss: 我更喜欢苹果。
    note: '*Preferisco*（我更喜欢）加上 *le mele*（苹果），用来回答问题并表明选择。'
    example_gloss:
    - 我更喜欢西红柿。
  it.a1.unit15.lesson03.teach.come:
    title: come
    gloss: 如同 / 像
    note: '*come*（如同/像）与 *buono/a* 搭配，表示两样东西相同。'
    example_gloss:
    - 茶和咖啡一样好喝。
  it.a1.unit15.lesson03.teach.le_mele_sono_buone_come_i_pomodori:
    title: Le mele sono buone come i pomodori.
    gloss: 苹果和西红柿一样好吃。
    note: '*sono buone*（是好的，阴性复数）要与 *le mele* 保持一致；*come* 引出表示相同的比较。'
