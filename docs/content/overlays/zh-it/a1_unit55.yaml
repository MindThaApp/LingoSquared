    gloss: 现在是春天。郁金香很美。Nina 问：你觉得哪个季节最美？Marco 说：我喜欢夏天。夏天我们游泳。Giulia 说：我喜欢冬天。冬天我们滑冰。
    note: 用直接引语的方式复述语言咖啡馆里的对话。
