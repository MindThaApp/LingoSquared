  it.a1.unit55.lesson03.teach.mi_piace_stagione:
    title: Mi piace + 季节
    gloss: Mi piace + 季节，表示你对某个季节的看法：Mi piace l'estate. 说两个季节时用 mi piacciono：Mi piacciono l'estate e l'inverno.
    note: 在意大利语中，你喜欢的事物是语法上的主语，动词要和它保持一致：mi piace l'estate（一个），mi piacciono l'estate e l'inverno（两个）。汉语的“喜欢”不会这样变化，动词形式始终不变。
