    title: 钱、卡、现金
  it.a1.unit24.lesson02.posso_pagare:
    title: 我可以付款吗？
teaching:
  it.a1.unit24.lesson01.teach_soldi_carta:
    title: i soldi, la carta
    gloss: 钱，卡
    note: '*Soldi* 在意大利语中是复数；*carta* 是指支付卡的常用简称。'
    example_gloss:
    - 我有钱。
    - 我用卡付款。
  it.a1.unit24.lesson01.teach_contanti_scontrino:
    title: i contanti, lo scontrino
    gloss: 现金，收据
    note: '*Contanti* 是复数；*scontrino* 是日常购物时的小票。'
    example_gloss:
    - 我付现金。
    - 这是收据。
  it.a1.unit24.lesson01.teach_pago_con_la_carta:
    title: Pago con la carta.
    gloss: 我用卡付款。
    note: 表示用卡付款时，用 *con la carta*。
    example_gloss:
    - 我在咖啡馆用卡付款。
  it.a1.unit24.lesson01.teach_pago_in_contanti:
    title: Pago in contanti.
    gloss: 我付现金。
    note: 表示用现金付款时，用 *in contanti*。
    example_gloss:
    - 今天我付现金。
  it.a1.unit24.lesson02.teach_posso_pagare_carta:
    title: Posso pagare con la carta?
    gloss: 我可以刷卡吗？
    note: '*Posso pagare...?* 用来询问对方是否接受某种付款方式。'
    example_gloss:
    - 今天我可以用卡付款吗？
  it.a1.unit24.lesson02.teach_sono_dieci_euro:
    title: Sono dieci euro.
    gloss: 一共十欧元。
    note: 说价格时，意大利语常用复数形式的 *sono*。
    example_gloss:
    - 这件T恤十欧元。
  it.a1.unit24.lesson02.teach_si_certo:
    title: Sì, certo.
    gloss: 好的，当然。
    note: 表示“是”要用带重音的 *Sì*；不带重音的 *si* 是另一个词。
    example_gloss:
    - 好的，当然，我用卡付款。
  it.a1.unit24.lesson02.teach_ecco_scontrino:
    title: Ecco lo scontrino.
    gloss: 这是收据。
    note: '*Ecco* 用来指出某物：这是／这些是。'
    example_gloss:
    - 谢谢，这是收据。
