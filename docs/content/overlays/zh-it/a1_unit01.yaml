course:
  title: 意大利语 A1
  description: 学习A1水平的意大利语，掌握日常问候和简短的社交对话，并配有详细的中文讲解。
units:
  it.a1.unit01.greetings_and_introductions:
    title: 问候与自我介绍
lessons:
  it.a1.unit01.lesson01.tu_e_lei:
    title: Tu 和 Lei：非正式与正式的问候
  it.a1.unit01.lesson02.stare_bene_e_salutarsi:
    title: 回应与告别
  it.a1.unit01.lesson03.presentarsi_in_ufficio:
    title: 自我介绍：办公室的第一天
teaching:
  it.a1.unit01.lesson01.teach.ciao_buongiorno:
    title: Ciao, Buongiorno
    gloss: 你好／嗨，早上好
    note: '*Ciao* 是随意、通用的问候语，朋友和同辈之间一天中任何时候都可以用。*Buongiorno* 是标准的、较正式的白天问候语，从早上到下午都可以使用。'
    example_gloss:
    - 嗨，你好吗？
    - 早上好，您好吗？
  it.a1.unit01.lesson01.teach.come_stai_sta:
    title: come stai, come sta
    gloss: 你好吗（非正式），您好吗（正式）
    note: '*come stai* 与 *tu* 搭配（朋友、同辈）；*come sta* 与 *Lei* 搭配（陌生人、上司、需要表示尊敬的人）。问题相同，语体不同。'
    example_gloss:
    - 嗨，你今天好吗？
    - 早上好，您今天好吗？
  it.a1.unit01.lesson01.teach.ciao_come_stai:
    title: Ciao, come stai?
    gloss: 嗨，你好吗？
    note: 随意、非正式的“问候＋提问”，用于朋友、同学或同辈。
  it.a1.unit01.lesson01.teach.buongiorno_come_sta:
    title: Buongiorno, come sta?
    gloss: 早上好，您好吗？
    note: 对应的正式说法，用于需要表示尊敬的人，例如新同事的上司。
  it.a1.unit01.lesson01.teach.register_rule:
    title: 'tu: informale · Lei: formale o rispettoso'
    gloss: tu：非正式 · Lei：正式或表示尊敬
    note: '*tu* 是朋友、同学和同辈之间日常使用的“你”。*Lei* 是对陌生人、职场上级或初次见面的人使用的敬称“您”，它有自己独特的动词变位（比较 *tu stai* 和 *Lei sta*）。'
  it.a1.unit01.lesson02.teach.bene_grazie:
    title: Bene, grazie
    gloss: 很好，谢谢
    note: 对“你好吗”的简单、中性的回答，加上 *e tu?* 或 *e Lei?* 就可以用于两种语体。
    example_gloss:
    - 很好，谢谢，你呢？
    - 很好，谢谢，您呢？
  it.a1.unit01.lesson02.teach.e_tu:
    title: E tu?
    gloss: 你呢？
    note: 对朋友或同辈把问题反问回去的非正式说法。
  it.a1.unit01.lesson02.teach.e_lei:
    title: E Lei?
    gloss: 您呢？
    note: 与 *Lei* 语体相配的正式反问说法。
  it.a1.unit01.lesson02.teach.bene_grazie_e_tu:
    title: Bene, grazie, e tu?
    gloss: 很好，谢谢，你呢？
    note: 对朋友或同辈使用的完整非正式回答加反问。
  it.a1.unit01.lesson02.teach.bene_grazie_e_lei:
    title: Bene, grazie, e Lei?
    gloss: 很好，谢谢，你呢？
    note: 对需要表示尊敬的人使用的完整正式回答加反问。
  it.a1.unit01.lesson02.teach.buonasera_buonanotte:
    title: Buonasera, Buonanotte
    gloss: 晚上好，晚安
    note: '*Buonasera* 是晚上到达某处时的问候语。*Buonanotte* 是有人要去睡觉或一天结束时说的告别语，从不用作问候。'
    example_gloss:
    - 晚上好，你好吗？
    - 晚安，明天见。
  it.a1.unit01.lesson02.teach.arrivederla:
    title: Arrivederla, a domani.
    gloss: 再见，明天见。
    note: '*Arrivederla* 是正式的告别语，与 *Lei* 搭配，适用于职场或对陌生人。'
  it.a1.unit01.lesson02.teach.ci_vediamo:
    title: Ciao, ci vediamo domani!
    gloss: 再见，明天见！
    note: 随意的告别语，用于第二天还会见面的朋友和同辈。
  it.a1.unit01.lesson03.teach.come_si_chiama:
    title: Come si chiama, scusi?
    gloss: 请问，您叫什么名字？（正式）
    note: '*Come si chiama?* 字面意思是“您被称为什么”，属于正式的 *Lei* 语体；加上 *scusi*（“打扰一下”）是向陌生人询问时自然而礼貌的说法。'
  it.a1.unit01.lesson03.teach.come_ti_chiami:
    title: Come ti chiami?
    gloss: 你叫什么名字？（非正式）
    note: 非正式说法，用于朋友、同辈或同龄人。
  it.a1.unit01.lesson03.teach.mi_chiamo_elena:
    title: Mi chiamo Elena.
    gloss: 我叫 Elena。
    note: '*chiamarsi* 意为“被称为”，这是介绍自己名字的标准说法，两种语体都可以用。'
  it.a1.unit01.lesson03.teach.io_sono_sam:
    title: Io sono Sam.
    gloss: 我是 Sam。
    note: '*mi chiamo* 的简单替代说法，直接用 *essere*（是）加上名字。'
  it.a1.unit01.lesson03.teach.piacere:
    title: Piacere, Piacere di conoscerla
    gloss: 幸会／很高兴认识你，很荣幸认识您（正式）
    note: '*Piacere* 单独使用是简短常见的“很高兴认识你”，两种语体都可以用。*Piacere di conoscerla* 是更完整的正式说法，与 *Lei* 搭配。'
    example_gloss:
    - 幸会，Sam！
    - 很荣幸认识您，Elena 女士。
  it.a1.unit01.lesson03.teach.benvenuto:
    title: Benvenuto in ufficio!
    gloss: 欢迎来到办公室！
    note: '*Benvenuto* 是“欢迎”的阳性形式（用于男性；欢迎女性时用 *Benvenuta*）。'
  it.a1.unit01.lesson03.teach.grazie_mille:
    title: Grazie mille.
    gloss: 多谢。／非常感谢。
    note: 比单纯的 *Grazie* 语气更强、更郑重的道谢方式。
