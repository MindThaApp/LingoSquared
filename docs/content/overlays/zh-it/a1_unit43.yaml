    title: Nina 的鸟
teaching:
  it.a1.unit43.lesson01.teach.l_animale_un:
    title: 动物与宠物
    gloss: 动物／宠物
    note: '*Animale* 是通用词；*animale domestico* 指宠物（字面意思是家养动物）。'
    example_gloss:
    - 狗是一种动物。
    - 狗也是一种宠物。
  it.a1.unit43.lesson01.teach.il_cane_il:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - Giulia有一只狗。
    - Luca有一只猫。
  it.a1.unit43.lesson01.teach.il_pesce_l:
    title: 鱼和鸟
    gloss: 鱼／鸟
    example_gloss:
    - 爷爷养了一条鱼。
    - Nina 养了一只鸟。
  it.a1.unit43.lesson01.teach.hai_un_animale:
    title: 你养宠物吗？
    gloss: 你养宠物吗？
    note: '*Hai ...?* 是 *avere* 的 *tu* 形式。陈述句只靠语调就变成了疑问句。'
  it.a1.unit43.lesson01.teach.si_ho_un:
    title: 是的，我有一只狗
    gloss: 是的，我有一只狗。
    note: 使用本单元的新词汇作简单的肯定回答。
  it.a1.unit43.lesson01.teach.no_non_ho:
    title: 不，我没有宠物
    gloss: 不，我没有宠物。
    note: 要表示没有某物，把 *non* 放在动词前面：*non ho*。见语法说明。
  it.a1.unit43.lesson01.teach.per_dire_che:
    title: 动词前的 Non
    gloss: 要表示没有某物，把 non 放在动词前面：Non ho tempo, Non ho animali domestici。
    note: '*non ho* 之后，名词通常不带冠词：*non ho tempo*、*non ho animali*。汉语里这类句子直接说“没有时间”“没有动物”，意大利语则用 non 加动词来否定。'
  it.a1.unit43.lesson02.teach.portare_a_spasso:
    title: 遛（动物）
    gloss: 遛（动物）
    note: '*Portare a spasso* 是固定短语，表示遛动物。代词放在动词前面：*lo porto a spasso*。'
    example_gloss: 我每天遛狗。
  it.a1.unit43.lesson02.teach.il_pronome_lo:
    title: 代词放在动词前面
    gloss: 代词 lo 代替“狗”，放在动词前面：lo porto a spasso, gli do da mangiare。
    note: 汉语的代词放在动词后面（“遛它”）；意大利语把 *lo* 和 *gli* 放在动词前面：*lo porto*、*gli do*。
  it.a1.unit43.lesson02.teach.dare_da_mangiare:
    title: 喂食
    gloss: 喂食
    example_gloss: 我每天给猫喂食。
  it.a1.unit43.lesson02.teach.giocare_con:
    title: 和……玩
    gloss: 和……玩
    example_gloss: Luca和他的猫玩。
  it.a1.unit43.lesson02.teach.porto_a_spasso:
    title: 我每天遛狗
    gloss: 我每天遛狗。
    note: '*Ogni giorno*（每天）放在句末，如 *porto a spasso il cane ogni giorno*。汉语里“每天”通常放在动词前，位置不同。'
  it.a1.unit43.lesson02.teach.do_da_mangiare:
    title: 我每天喂猫
    gloss: 我每天给猫喂食。
    note: '*Dare da mangiare*（喂食）字面意思是“给吃的”。*Do* 是 *dare* 的 *io* 形式。'
  it.a1.unit43.lesson03.teach.il_plurale_cambia:
    title: 复数：il cane -> i cani
    gloss: 复数会改变词尾元音和冠词：il cane -> i cani, il gatto -> i gatti, l'uccello -> gli uccelli, il pesce -> i pesci。
    note: 汉语名词通常没有复数变化，而意大利语名词要改变词尾。这里首次以动物名词为例介绍规则的复数形式。
  it.a1.unit43.lesson03.teach.i_cani_i:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - Marco喜爱狗。
    - Chiara喜爱猫。
  it.a1.unit43.lesson03.teach.i_pesci_gli:
    title: 鱼和鸟（复数）
    gloss: 鱼（复数）／鸟
    example_gloss:
    - 我喜欢鱼。
    - 爷爷喜欢鸟。
  it.a1.unit43.lesson03.teach.amo_gli_animali:
    title: 我喜欢动物
    gloss: 我喜欢动物。
    note: '*Amare*（爱）直接带宾语：*amo gli animali*。复数名词要用复数冠词 *gli*。'
  it.a1.unit43.lesson03.teach.chiara_ama_i:
    title: Chiara喜爱猫，但没有宠物
    gloss: Chiara喜爱猫，但她没有宠物。
    note: 这里引出了第 05 课阅读部分所围绕的对比。
  it.a1.unit43.lesson04.teach.marco_hai_un:
    title: Marco问起宠物
    gloss: Marco：Giulia，你有宠物吗？
  it.a1.unit43.lesson04.teach.giulia_si_ho:
    title: Giulia有一只狗
    gloss: Giulia：有，我有一只狗。
  it.a1.unit43.lesson04.teach.marco_com_e:
    title: Marco问它长什么样
    gloss: Marco：它长什么样？
    note: '*Com''è?* 也可以用来问动物。回答用 *è* 或 *ha*：*è piccolo*、*ha il pelo castano*。'
  it.a1.unit43.lesson04.teach.giulia_ha_il:
    title: Giulia描述她的狗
    gloss: Giulia：它的毛是棕色的，个头很小。
    note: 这里再次使用外貌单元学过的毛发颜色和体型词汇，不过描述的是动物的皮毛，而不是人的头发。
  it.a1.unit43.lesson04.teach.un_animale_e:
    title: 动物分阳性和阴性
    gloss: 动物和人一样分阳性和阴性：il cane 是 lui，la gatta 是 lei。
    note: 意大利语没有表示“它”的中性代词：每个名词不是阳性就是阴性，所以狗用 *lui*，猫用 *lei*，相应的代词也随之变化（*lo*、*la*）。
  it.a1.unit43.lesson04.teach.marco_lo_porti:
    title: Marco问遛狗的事
    gloss: Marco：你每天遛它吗？
  it.a1.unit43.lesson04.teach.giulia_si_lo:
    title: Giulia说起她的日常
    gloss: Giulia：是的，我每天遛它，也给它喂食。
  it.a1.unit43.lesson05.teach.marco_e_chiara:
    title: Marco、Chiara和Luca谈动物
    gloss: Marco和Chiara都喜爱动物，但两人都没有宠物。Marco喜爱狗，Chiara喜爱猫。Luca却有一只宠物：一只猫。他常常和他的猫玩，每天给猫喂食。你有宠物吗？
    note: 这里对比了喜欢动物与真正饲养宠物，是本部分要表达的重点。
    glosses:
      amano: 喜爱
      entrambi: 两者都
      animali: 动物
      due: 两个（nessuno dei due = 两人都没有）
      domestico: 家养的（animale domestico = 宠物）
      cani: 狗
      gatti: 猫
      gatto: 猫
      gioca: 玩
      dà: 给
      ogni: 每一
      mangiare: 吃（dare da mangiare = 喂食）
  it.a1.unit43.lesson05.teach.luca_gioca_spesso:
    title: Luca常常和他的猫玩
    gloss: Luca常常和他的猫玩。
    note: '*Spesso*（常常）放在动词后面：*gioca spesso*。*Giocare con* 表示和……玩。'
  it.a1.unit43.lesson05.teach.amo_i_cani:
    title: 我喜欢狗。我没有宠物。
    gloss: 我喜欢狗。我没有宠物。
    note: 这是一个由两句话组成的示范答案，可以直接套用在本单元的写作题中。
  it.a1.unit43.lesson06.teach.giulia_nina_hai:
    title: Giulia问Nina
    gloss: Giulia：Nina，你也有宠物吗？
  it.a1.unit43.lesson06.teach.nina_si_ho:
    title: Nina 有一只名叫 Pico 的鸟
    gloss: Nina：是的，我有一只鸟。它叫 Pico。
    note: '*Si chiama Pico* 意思是它的名字叫Pico，字面意思是“它称自己Pico”。'
  it.a1.unit43.lesson06.teach.marco_che_bello:
    title: Marco的反应
    gloss: Marco：真好！你每天和它做什么？
  it.a1.unit43.lesson06.teach.nina_gli_do:
    title: Nina 每天给它喂食
    gloss: Nina：我每天都给它喂食。
  it.a1.unit43.lesson06.teach.marco_anch_io:
    title: Marco也喜爱鸟
    gloss: Marco：我也喜爱鸟。
  it.a1.unit43.lesson06.teach.giulia_che_bello:
    title: Giulia结束对话
    gloss: Giulia：真好，我们三个人都喜爱动物！
    note: 结束语，把三个人物与动物有关的内容联系在一起。
