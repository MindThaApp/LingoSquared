teaching:
  it.a1.unit20.lesson01.teach.fa_caldo_freddo:
    title: fa caldo, fa freddo
    gloss: 天气热，天气冷
    note: 意大利语谈气温时说 *fa caldo/freddo*，用的是动词 fa，和汉语“天气热/冷”的结构不同，不能逐字对应。
    example_gloss:
    - 今天天气很热。
    - 今天天气很冷。
  it.a1.unit20.lesson01.teach.piove_sole:
    title: piove, c'è il sole
    gloss: 在下雨，晴天
    note: '*Piove* 是只有一个词的天气句；*c''è il sole* 字面意思是“有太阳”。'
    example_gloss:
    - 今天下雨。
    - 今天是晴天。
  it.a1.unit20.lesson01.teach.che_tempo_fa:
    title: Che tempo fa oggi?
    gloss: 今天天气怎么样？
    note: '*Che tempo fa?* 是询问天气的标准问句。'
    example_gloss:
    - 今天天气怎么样？
  it.a1.unit20.lesson01.teach_oggi_piove:
    title: Oggi piove.
    gloss: 今天下雨。
    note: '*Oggi* 通常放在句首，但 *Piove oggi.* 也是正确的。'
    example_gloss:
    - 今天下雨。
  it.a1.unit20.lesson02.teach_oggi_piove_freddo:
    title: Oggi piove e fa freddo.
    gloss: 今天下雨，而且很冷。
    note: 用 *e* 连接两个天气情况。
    example_gloss:
    - 今天下雨，而且很冷。
  it.a1.unit20.lesson02.teach_restiamo_a_casa:
    title: Restiamo a casa.
    gloss: 我们待在家里吧。
    note: '*Restiamo* 是“我们”的动词形式，这里用来表示简单的提议。'
    example_gloss:
    - 我们待在家里吧。
  it.a1.unit20.lesson02.teach_andiamo_al_museo:
    title: Andiamo al museo.
    gloss: 我们去博物馆吧。
    note: '*Andiamo* 可以表示“我们去”，也可以在提议中表示“我们去吧”。'
    example_gloss:
    - 我们去博物馆吧。
  it.a1.unit20.lesson02.teach_allora:
    title: Allora restiamo a casa?
    gloss: 那我们待在家里吗？
    note: '*Allora* 把天气和计划联系起来。'
    example_gloss:
    - 那我们待在家里吗？
