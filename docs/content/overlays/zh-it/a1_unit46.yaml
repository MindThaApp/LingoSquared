    title: Marco查看天气
    gloss: Marco：星期六是晴天！
    note: '*C''è il sole*（晴天）字面意思是“有太阳”。*C''è*是*ci è*的缩写。'
  it.a1.unit46.lesson04.teach.luca_vedo_il:
    title: Luca看到消息
    gloss: Luca：我看到消息了。星期六见！
  it.a1.unit46.lesson04.teach.conosci_gia_arrivederci:
    title: A＋星期几
    gloss: 你已经学过 Arrivederci!（再见！）还可以说出某一天：A sabato!（星期六见！）、A domani!（明天见！）
    note: 把问候单元中的告别用语扩展到具体的某一天。
  it.a1.unit46.lesson05.teach.giulia_chiama_marco:
    title: 谁用什么？
    gloss: Giulia每天给Marco打电话。她用手机，不用应用程序。Marco在家没有电脑，但他用手机上网。Luca每天早上查天气预报，然后去跑步。Chiara经常给Giulia发消息。你也每天用手机吗？
    note: 对比四个人物使用设备的习惯，与运动单元的对比阅读形式相呼应。
