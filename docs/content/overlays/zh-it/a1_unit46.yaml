    title: Messaggio：发送或阅读
    gloss: 你已经学过 le previsioni del tempo（天气预报）。消息可以发送（io mando, lui manda），也可以阅读（io leggo, lui legge）。
    note: 把新单词与天气单元中学过的复合名词联系起来。
