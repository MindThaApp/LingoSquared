    title: Cercare和usare是规则动词
    gloss: Cercare和usare是规则的-are动词：io cerco, tu cerchi；io uso, tu usi。Cercare在i前面要加h。
    note: '*cerchi*中的h让c保持硬音[k]：对比*cerco*（io）和*cerchi*（tu）。'
  it.a1.unit46.lesson03.teach.luca_cerca_le:
    title: Luca查天气预报
