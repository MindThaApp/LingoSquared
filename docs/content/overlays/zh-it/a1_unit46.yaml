  it.a1.unit46.lesson06.teach.marco_si_e:
    title: Marco确认天气
    gloss: Marco：好，而且星期六是晴天！
  it.a1.unit46.lesson06.teach.luca_io_corro:
    title: Luca的计划
    gloss: Luca：那我就跑步。之后我还要踢足球。
    note: '*Poi*（然后）让动作有先后顺序。*Gioco a calcio*：*giocare a*＋运动项目。'
  it.a1.unit46.lesson06.teach.chiara_io_preferisco:
    title: Chiara的计划
    gloss: Chiara：我更想游泳，不过我也来公园。
    note: '*Preferisco nuotare*（我更想游泳）是直接表达偏好的说法。*Anch''io*（我也）是一个词，中间有撇号。'
  it.a1.unit46.lesson06.teach.giulia_bello_a:
    title: Giulia结束对话
    gloss: Giulia：太好了！星期六公园见！
    note: 一句话同时收束了本单元的消息对话和运动单元的计划。
