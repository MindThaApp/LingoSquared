  it.a1.unit45.lesson04.teach.con_i_mezzi:
    title: in + 交通工具，a piedi 表示步行
    gloss: 表示交通方式时，意大利语用 in：in treno, in bicicletta, in macchina。步行说 a piedi：vado a piedi。
    note: 汉语会说“坐火车”“骑自行车”，动词随交通工具而变；意大利语则用 *in* 加不带冠词的名词：说 *in treno*，不说 *nel treno*。
  it.a1.unit45.lesson04.teach.marco_allora_prendo:
    title: Marco 回答
    gloss: Marco：那我就坐火车，和 Giulia 一起。
  it.a1.unit45.lesson05.teach.giulia_viaggia_ogni:
    title: 谁怎么出行?
    gloss: Giulia 每天坐火车去上班。Marco 通常骑自行车，但下雨时也会坐火车。Luca 更喜欢开车。Chiara 住在附近，走路去上班。你怎么去上班？
    note: 对比了四种出行方式和一个条件（*quando piove*，下雨的时候）。*Andare*（去）是不规则动词：*vado*，*va*。
    glosses:
      viaggia: 出行
      ogni: 每一
      giorno: 天
      treno: 火车
      lavoro: 工作
      bicicletta: 自行车（in bicicletta = 骑自行车）
      solito: 通常的（di solito = 通常）
      piove: 下雨
      prende: 乘坐
      andare: 去（andare in macchina = 开车）
      preferisce: 更喜欢
      macchina: 汽车
      abita: 住
      vicino: 附近
      piedi: 脚（a piedi = 步行）
      vai: 你去
  it.a1.unit45.lesson05.teach.chiara_abita_vicino:
    title: Chiara 住在附近，走路去上班
    gloss: Chiara 住在附近，走路去上班。
  it.a1.unit45.lesson06.teach.giulia_andiamo_insieme:
    title: Giulia 提议
    gloss: Giulia：我们一起骑自行车去语言咖啡馆好吗？
  it.a1.unit45.lesson06.teach.luca_preferisco_andare:
    title: Luca 更喜欢开车
    gloss: Luca：我更想开车去。
  it.a1.unit45.lesson06.teach.chiara_io_vado:
    title: Chiara 打算走路去
    gloss: Chiara：我走路去，很近。
  it.a1.unit45.lesson06.teach.marco_bene_allora:
    title: Marco 同意
    gloss: Marco：好，那我和你一起骑自行车去，Giulia！
    note: 结束语，把四位人物各自的通勤方式串联起来。
