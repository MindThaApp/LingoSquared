teaching:
  it.a1.unit17.lesson01.teach.il_lavoro:
    title: il lavoro
    gloss: 工作
    note: '*il lavoro* 是阳性名词,既表示“职业”,也泛指“工作”。'
    example_gloss:
    - 我的工作很有意思。
  it.a1.unit17.lesson01.teach.insegnante_commesso:
    title: insegnante, commesso
    gloss: 教师，店员
    note: '*insegnante*（教师）男女同形；*commesso*（店员）是阳性，阴性形式是 *commessa*。'
    example_gloss:
    - 我是教师，不是店员。
  it.a1.unit17.lesson01.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: 你做什么工作?
    note: '*Che lavoro fai?*（字面意思是“你做什么工作？”）是询问对方职业的标准说法。'
  it.a1.unit17.lesson01.teach.sono_insegnante:
    title: Sono insegnante.
    gloss: 我是教师。
    note: 意大利语中，没有修饰语的职业名称前不用冠词：说 *Sono insegnante*，而不说 *Sono un insegnante*。汉语里“我是教师”也不需要像“一位”这样的数量词，但意大利语的规则是不加冠词。
  it.a1.unit17.lesson01.teach.sono_commesso:
    title: Sono commesso.
    gloss: 我是店员。
    note: 与 *Sono insegnante* 一样，不加冠词。
  it.a1.unit17.lesson02.teach.ufficio_scuola:
    title: l'ufficio, la scuola
    gloss: 办公室，学校
    note: '*l''ufficio*（办公室）的冠词在元音前省音；*la scuola*（学校）是阴性。'
    example_gloss:
    - 我在办公室工作。
    - 我在学校工作。
  it.a1.unit17.lesson02.teach.dove_lavori:
    title: Dove lavori?
    gloss: 你在哪里工作?
    note: '*Dove*（哪里）加 *lavori*（你工作，非正式）。'
  it.a1.unit17.lesson02.teach.lavoro_in_un_ufficio:
    title: Lavoro in un ufficio.
    gloss: 我在办公室工作。
    note: '*Lavoro in*（我在……工作）加 *un ufficio*（一间办公室）。'
  it.a1.unit17.lesson02.teach.lavoro_in_una_scuola:
    title: Lavoro in una scuola.
    gloss: 我在学校工作。
    note: 句型相同，只是换成 *una scuola*（一所学校）。
  it.a1.unit17.lesson03.teach.inizio_finisco:
    title: inizio, finisco
    gloss: 我开始，我结束
    note: '*inizio*（我开始）和 *finisco*（我结束）分别是 *iniziare* 和 *finire* 的第一人称现在时形式。'
    example_gloss:
    - 我九点开始。
    - 我五点结束。
  it.a1.unit17.lesson03.teach.a_che_ora_inizi:
    title: A che ora inizi?
    gloss: 你几点开始?
    note: '*A che ora*（几点）加 *inizi*（你开始，非正式）。'
  it.a1.unit17.lesson03.teach.inizio_alle_nove_e_finisco_alle_cinque:
    title: Inizio alle nove e finisco alle cinque.
    gloss: 我九点开始,五点结束。
    note: '*alle nove* / *alle cinque*（九点／五点）在钟点前使用 *alle*（在……点），与第5单元的时间表达相同。'
