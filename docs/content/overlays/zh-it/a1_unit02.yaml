course:
  title: 意大利语 A1
  description: 学习A1水平的意大利语，掌握日常问候和简短的社交对话，并配有详细的中文讲解。
units:
  it.a1.unit02.origin_nationality_language:
    title: 来自哪里、国籍与语言
lessons:
  it.a1.unit02.lesson01.di_dove_sei:
    title: 你来自哪里？询问并说出自己的来处
  it.a1.unit02.lesson02.parlare_italiano:
    title: 说意大利语：水平与语言
  it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto:
    title: 工作与欢迎来到米兰
teaching:
  it.a1.unit02.lesson01.teach.di_dove:
    title: di dove
    gloss: 来自哪里
    note: '*di dove* 是询问或说明来自哪里的核心结构，与 *sei*（非正式）或 *è*（正式）搭配使用。'
    example_gloss:
    - 萨姆，你是哪里人？
    - 埃琳娜，您是哪里人？（正式）
  it.a1.unit02.lesson01.teach.di_dove_sei:
    title: Di dove sei?
    gloss: 您是哪里人？
    note: 非正式的问法，用于同龄人或朋友，对应第1单元的 *tu*。
  it.a1.unit02.lesson01.teach.di_dov_e_lei:
    title: Di dov'è, Lei?
    gloss: 您来自哪里？
    note: 正式的问法，对应第1单元的 *Lei*。
  it.a1.unit02.lesson01.teach.sono_americano_chicago:
    title: Sono americano, di Chicago.
    gloss: 我是美国人，来自芝加哥。
    note: 同时说明国籍和来自哪个城市。
  it.a1.unit02.lesson01.teach.sono_italiana_milano:
    title: Sono italiana, di Milano.
    gloss: 我是意大利人，来自米兰。
    note: '*italiana* 是国籍的阴性形式，因为埃琳娜是女性，所以用这个形式。'
  it.a1.unit02.lesson01.teach.nationalities:
    title: americano/americana, italiano/italiana
    gloss: 美国人（男／女），意大利人（男／女）
    note: 意大利语的国籍词会随所指的人的性别改变词尾：男性用 *-o*，女性用 *-a*（*Sam è americano*，*Elena è italiana*）。汉语的“美国人”“意大利人”不分性别，这是两种语言的不同之处。
    example_gloss:
    - 萨姆是美国人。
    - 埃琳娜是意大利人。
  it.a1.unit02.lesson02.teach.parli_italiano:
    title: Parli italiano?
    gloss: 你会说意大利语吗？
    note: 非正式的问法，使用 *parlare*（说）的 *tu* 形式。
  it.a1.unit02.lesson02.teach.parla_italiano:
    title: Parla italiano?
    gloss: 您会说意大利语吗？（正式）
    note: 正式的问法，使用 *parlare* 的 *Lei* 形式。
  it.a1.unit02.lesson02.teach.parlo_un_po:
    title: Parlo un po' d'italiano
    gloss: 我会说一点意大利语
    note: 谦虚而常用的说法，用来描述自己的水平；*un po'* 的意思是“一点”。
    example_gloss: 我会说一点意大利语，我已经学了一年。
  it.a1.unit02.lesson02.teach.parlo_inglese:
    title: Parlo inglese.
    gloss: 我会说英语。
    note: 同样使用 *parlo*（我说）的结构，只是换了一种语言。
  it.a1.unit02.lesson02.teach.studio_da_un_anno:
    title: Studio italiano da un anno.
    gloss: 我学意大利语已经一年了。
    note: '*da un anno* 的意思是“一年了”，表示从过去开始、一直持续到现在的动作。'
  it.a1.unit02.lesson02.teach.da_quanto_studi:
    title: Da quanto studi?
    gloss: 你学了多久了？
    note: '*Da quanto*（从多久以来）+ 现在时 *studi*（你学，非正式）用来询问一个持续的动作已经进行了多长时间。回答时用同样的结构：*Studio da un anno.*'
  it.a1.unit02.lesson02.teach.parla_bene:
    title: Parli italiano bene!
    gloss: 你意大利语说得真好！
    note: 友好地称赞别人的语言水平，使用非正式的 *tu* 形式。
  it.a1.unit02.lesson03.teach.che_lavoro_fai:
    title: Che lavoro fai?
    gloss: 您从事什么工作？
    note: 非正式的问法，使用 *fare*（做）的 *tu* 形式。
  it.a1.unit02.lesson03.teach.che_lavoro_fa:
    title: Che lavoro fa, Lei?
    gloss: 您做什么工作？（正式）
    note: 正式的问法，使用 *fare* 的 *Lei* 形式。
  it.a1.unit02.lesson03.teach.sono_ingegnere:
    title: Sono ingegnere
    gloss: 我是工程师
    note: 意大利语的职业名称通常不带冠词：说 *sono ingegnere*，不说 *sono un ingegnere*。
    example_gloss: 我是工程师，在米兰工作。
  it.a1.unit02.lesson03.teach.sono_qui_per_lavoro:
    title: Sono qui per lavoro.
    gloss: 我来这里是为了工作。
    note: '*per lavoro* 说明来到某地的原因：是为了工作，而不是旅游。'
  it.a1.unit02.lesson03.teach.per_due_anni:
    title: Sono qui per due anni.
    gloss: 我会在这里待两年。
    note: 结构与 *per lavoro* 相同，只是这里说明的是时长，而不是原因。
  it.a1.unit02.lesson03.teach.che_bello_benvenuto:
    title: Che bello, benvenuto a Milano!
    gloss: 太好了，欢迎来到米兰！
    note: '*Che bello* 是常见的热情回应，意思是“真好／太棒了”。'
  it.a1.unit02.lesson03.teach.grazie_mille_reprise:
    title: Grazie mille!
    gloss: 非常感谢！
    note: 与第1单元相同的强调式感谢，这里用来回应热情的欢迎。
