teaching:
  it.a1.unit14.lesson01.teach.preferire:
    title: preferire, preferisco
    gloss: 更喜欢，我更喜欢
    note: '*preferire*（更喜欢）是以 -ire 结尾的动词，现在时大部分变位中会插入 -isc-；*preferisco* 的意思是“我更喜欢”。'
    example_gloss:
    - 比起咖啡，我更喜欢茶。
  it.a1.unit14.lesson01.teach.preferisci_il_caffe_o_il_te:
    title: Preferisci il caffè o il tè?
    gloss: 你更喜欢咖啡还是茶？
    note: '*Preferisci*（你更喜欢）加上 *o*（或者）可以在两样东西中让对方选择。'
  it.a1.unit14.lesson01.teach.preferisco_il_caffe:
    title: Preferisco il caffè.
    gloss: 我更喜欢咖啡。
    note: '*Preferisco*（我更喜欢）加上 *il caffè*（咖啡）表示说出自己的偏好。'
  it.a1.unit14.lesson02.teach.mi_piace_il_cornetto:
    title: Mi piace molto il cornetto.
    gloss: 我很喜欢羊角面包。
    note: '*Mi piace*（我喜欢）加上 *molto*（很）表示非常喜欢。'
  it.a1.unit14.lesson02.teach.non_mi_piace:
    title: Non mi piace il tè la mattina.
    gloss: 我早上不喜欢喝茶。
    note: '*Non mi piace*（我不喜欢）是“喜欢”句型的否定形式；*la mattina* 的意思是“早上”。'
    example_gloss:
    - 我晚上不喜欢喝咖啡。
  it.a1.unit14.lesson02.teach.e_a_te:
    title: E a te?
    gloss: 你呢？
    note: '*E a te?*（你呢？）用来询问对方自己的偏好。'
  it.a1.unit14.lesson03.teach.anch_io_preferisco_il_caffe:
    title: Anch'io preferisco il caffè!
    gloss: 我也是，我更喜欢咖啡！
    note: '*Anch''io*（我也是）用来附和别人刚用 *preferisco* 表达的偏好。（要附和 *mi piace* 的说法时，意大利语用 *Anche a me*。）'
  it.a1.unit14.lesson03.teach.a_me_no:
    title: A me no, preferisco il tè.
    gloss: 我不是，我更喜欢茶。
    note: '*A me no*（我不是）用来表示不同意 *mi piace* 的说法（它对应“喜欢”句型中的 *a me*），然后再说出自己的偏好。要不同意 *preferisco* 的说法，意大利语则用 *Io no*。'
    example_gloss:
    - 我不是，我更喜欢咖啡。
