teaching:
  it.a1.unit22.lesson01.teach_felice_triste:
    title: felice, triste
    gloss: 开心，难过
    note: '*Felice* 和 *triste* 以 *-e* 结尾，所以阳性和阴性用同一个形式（*Sam è felice*，*Elena è felice*）。'
    example_gloss:
    - 我今天很开心。
    - 我今天很难过。
  it.a1.unit22.lesson01.teach_stanco_nervoso:
    title: stanco, nervoso
    gloss: 累，紧张
    note: 这些形容词的词尾会变化；本单元先学习阳性的词典形式。
    example_gloss:
    - Sam累了。
    - 我今天很紧张。
  it.a1.unit22.lesson01.teach_come_ti_senti:
    title: Come ti senti?
    gloss: 你感觉怎么样？
    note: '*Ti senti* 是对朋友使用的非正式“你感觉”的形式。'
    example_gloss:
    - 你今天感觉怎么样？
  it.a1.unit22.lesson01.teach_sono_felice:
    title: Sono felice.
    gloss: 我很开心。
    note: 用 *sono* 加表示心情的形容词。
    example_gloss:
    - 我今天很开心。
  it.a1.unit22.lesson02.teach_perche:
    title: perché
    gloss: 因为／为什么
    note: 在本单元中，*perché* 用来说明某种心情的原因。
    example_gloss:
    - 我很开心，因为今天天气晴朗。
  it.a1.unit22.lesson02.teach_sono_felice_perche:
    title: Sono felice perché oggi c'è il sole.
    gloss: 我很开心，因为今天天气晴朗。
    note: 这是一个完整的“心情＋原因”句子。
    example_gloss:
    - 在米兰，我很开心，因为今天出太阳了。
  it.a1.unit22.lesson02.teach_sono_un_poco_stanca:
    title: Sono un po' stanca.
    gloss: 我有点累。
    note: 这里的 *Stanca* 是阴性形式，因为说话的是Elena。
    example_gloss:
    - 我今天有点累。
  it.a1.unit22.lesson02.teach_ma_sto_bene:
    title: ma sto bene
    gloss: 但是我很好
    note: '*Ma* 表示转折，把“累”和“还好”对比起来。'
    example_gloss:
    - 我累了，但我很好。
