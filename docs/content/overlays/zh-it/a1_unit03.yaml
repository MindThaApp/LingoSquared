teaching:
  it.a1.unit03.lesson01.teach.numeri_zero_cinque:
    title: zero, uno, due, tre, quattro, cinque
    gloss: 零、一、二、三、四、五
    note: 前六个数字：是本单元中价格、年龄和电话号码的基础。
    example_gloss:
    - 我有两个兄弟。
    - 五点钟。
  it.a1.unit03.lesson01.teach.numeri_sei_dieci:
    title: sei, sette, otto, nove, dieci
    gloss: 六、七、八、九、十
    note: 六到十的数字，补全0到10的范围。
    example_gloss:
    - 我每天工作八个小时。
    - 这家店十点开门。
  it.a1.unit03.lesson01.teach.quanti_anni:
    title: Quanti anni hai?
    gloss: 你多大了？
    note: 字面意思是“你有多少岁”：意大利语询问年龄时用 *avere*（有），而汉语说“你几岁”或“你多大”，并不用“有”。
  it.a1.unit03.lesson01.teach.ho_trent_anni:
    title: Ho trent'anni.
    gloss: 我三十岁。
    note: 用 *avere* 表示年龄的固定表达（字面意思是“我有三十年”）。这里并不把“三十”当作数数的数字来教；本单元的数字范围仍是 0–10，只在这个固定短语和价格中出现 30 和 50。
  it.a1.unit03.lesson02.teach.quanto_costa:
    title: Quanto costa un caffè?
    gloss: 一杯咖啡多少钱？
    note: '*Quanto costa* 是询问单件商品价格的标准说法。'
  it.a1.unit03.lesson02.teach.costa_un_euro:
    title: un euro, due euro
    gloss: 一欧元，两欧元
    note: 意大利语中 *euro* 的复数形式不变，*un euro* 和 *due euro* 都用 *euro*。汉语的“欧元”也没有复数变化。
    example_gloss:
    - 一欧元。
    - 一共两欧元五十分。
  it.a1.unit03.lesson02.teach.un_cornetto:
    title: E un cornetto?
    gloss: 那一个羊角面包呢？
    note: 一个简短的追问，用来询问第二样东西的价格：*cornetto*（意大利早餐常见的羊角面包）。
  it.a1.unit03.lesson02.teach.due_euro_cinquanta:
    title: Sono due euro e cinquanta.
    gloss: 一共两欧元五十分。
    note: '*e cinquanta* 用来加上分（欧分），字面意思是“和五十”，任何带五十分的价格都这样说。'
  it.a1.unit03.lesson02.teach.quanti_ne_vuole:
    title: Quanti ne vuole?
    gloss: 您要几个？
    note: 咖啡师或店员询问您要几个时的礼貌说法；*ne* 代替前面已经提到的东西。
  it.a1.unit03.lesson02.teach.ne_vorrei_tre:
    title: Ne vorrei tre, grazie.
    gloss: 我想要三个，谢谢。
    note: '*Ne vorrei* 加数字是礼貌地提出数量的说法，同样用 *ne* 指代前面提到的东西。'
  it.a1.unit03.lesson03.teach.qual_e_il_tuo_numero:
    title: Qual è il tuo numero di telefono?
    gloss: 你的电话号码是多少？
    note: 询问对方电话号码的非正式说法，使用 *tuo*（你的，非正式）。
  it.a1.unit03.lesson03.teach.ti_chiamo_domani:
    title: Ti chiamo domani!
    gloss: 我明天给你打电话！
    note: 拿到对方号码后，用来友好地结束交谈的说法。
  it.a1.unit03.lesson03.teach.il_mio_numero:
    title: il mio numero
    gloss: 我的号码
    note: 意大利语的电话号码通常一个数字一个数字地读，用的是第1课学过的数字。汉语读号码时也是逐个数字读。
    example_gloss: 我的号码是零、三、四、二、一。
  it.a1.unit03.lesson03.teach.numero_sam:
    title: Il mio numero è zero, tre, quattro, due, uno.
    gloss: 我的号码是零、三、四、二、一。
    note: Sam 逐个数字报出自己的电话号码，这是意大利语读电话号码的标准方式。
  it.a1.unit03.lesson03.teach.perfetto_grazie:
    title: Perfetto, grazie!
    gloss: 太好了，谢谢！
    note: 拿到所需信息后，用来结束交谈的简短、愉快的说法。
