    title: Nina 听说大家的情况
    gloss: 尼娜是语言咖啡馆的新成员。她问马可其他人都是什么样的人。马可讲了起来。朱莉娅善良又有耐心，是一名护士。卢卡很有趣，在上西班牙语课。基娅拉很好奇，喜欢学习新事物。马可本人则很平静。
    note: 回顾小组成员的性格特点。
