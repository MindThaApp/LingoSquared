teaching:
  it.a1.unit13.lesson01.teach.ieri_stamattina:
    title: ieri, stamattina
    gloss: 昨天，今天早上
    note: '*ieri*（昨天）和 *stamattina*（今天早上）是谈论近期发生的事情时常用的两个时间词。'
    example_gloss:
    - 我昨天在家。
  it.a1.unit13.lesson01.teach.sono_andato:
    title: sono andato, sono andata
    gloss: 我去了（男性），我去了（女性）
    note: '*sono andato/andata* 是 *andare* 的近过去时，助动词用 *essere*；过去分词要与主语的性别一致。'
    example_gloss:
    - 我今天早上去上班了。
  it.a1.unit13.lesson01.teach.sono_andato_al_cinema_ieri:
    title: Sono andato al cinema ieri.
    gloss: 我昨天去看电影了。
    note: '*Sono andato*（男性说话者）加 *al cinema*（去电影院）再加 *ieri*（昨天），描述一件已经完成的过去的事。'
  it.a1.unit13.lesson01.teach.ho_visto_un_bel_film:
    title: Ho visto un bel film!
    gloss: 我看了一部好电影！
    note: '*Ho visto* 的助动词是 *avere*，后接不规则过去分词 *visto*（来自 *vedere*，意为“看”）。'
  it.a1.unit13.lesson02.teach.ho_mangiato_un_panino:
    title: Ho mangiato un panino a pranzo.
    gloss: 我午饭吃了一个三明治。
    note: '*Ho mangiato* 由 *avere* 加规则过去分词 *mangiato*（来自 *mangiare*，意为“吃”）构成；*a pranzo* 的意思是“午饭时”。'
  it.a1.unit13.lesson02.teach.cosa_hai_fatto_ieri:
    title: Cosa hai fatto ieri?
    gloss: 您昨天做了什么？
    note: '*hai fatto* 是 *fare*（做）的近过去时，这里用来询问最近发生的事。'
    example_gloss:
    - 你今天早上做了什么？
  it.a1.unit13.lesson02.teach.ieri_sera:
    title: ieri sera
    gloss: 昨天晚上
    note: '*ieri sera* 由 *ieri*（昨天）和 *sera*（晚上）组成，指明一个具体的过去时间。'
    example_gloss:
    - 我昨天晚上去看电影了。
  it.a1.unit13.lesson03.teach.sono_andata_al_lavoro:
    title: Stamattina sono andata al lavoro, come sempre.
    gloss: 今天早上我像往常一样去上班了。
    note: '*sono andata*（女性说话者）加 *come sempre*（像往常一样），描述过去的一个惯常行为。'
  it.a1.unit13.lesson03.teach.e_tu_cosa_hai_fatto:
    title: E tu, cosa hai fatto stamattina?
    gloss: 你呢，你今天早上做了什么？
    note: '*E tu*（你呢）把问题反过来抛给对方。'
    example_gloss:
    - 你呢，你昨天晚上做了什么？
