teaching:
  it.a1.unit23.lesson01.teach_pronto_chi_parla:
    title: Pronto, chi parla?
    gloss: 喂？请问是哪位？
    note: 在意大利语里，接电话的常规说法是 *Pronto*，而不是 *ciao*。
    example_gloss:
    - 喂，我是Elena。
  it.a1.unit23.lesson01.teach_telefono_messaggio:
    title: il telefono, un messaggio
    gloss: 电话，一条消息
    note: '*Messaggio* 是阳性名词，要说 *un messaggio*。'
    example_gloss:
    - 我会给你发一条消息。
  it.a1.unit23.lesson01.teach_sono_elena:
    title: Sono Elena.
    gloss: 我是Elena。
    note: 在电话里，意大利语通常用 *sono* 来表明自己的身份。
    example_gloss:
    - 喂，我是Elena。
  it.a1.unit23.lesson01.teach_ciao_sam:
    title: Ciao Sam, sono Elena.
    gloss: 嗨，Sam，我是Elena。
    note: 打电话时，说“我是Elena”用 *Sono Elena* 很自然。
    example_gloss:
    - 嗨，Sam，我是Elena，在给你打电话。
  it.a1.unit23.lesson02.teach_puoi_ripetere:
    title: Puoi ripetere, per favore?
    gloss: 你能再说一遍吗？
    note: '*Puoi* 是非正式的说法，适用于Elena和Sam之间。'
    example_gloss:
    - Sam，你能再说一遍吗？
  it.a1.unit23.lesson02.teach_piu_piano:
    title: Più piano, per favore.
    gloss: 请说慢一点。
    note: '*Più piano* 的意思是“更慢一点”，是请人放慢速度的常用说法。'
    example_gloss:
    - 请说慢一点。
  it.a1.unit23.lesson02.teach_ti_mando_un_messaggio:
    title: Ti mando un messaggio.
    gloss: 我会给你发一条消息。
    note: '*Ti mando* 在非正式场合表示“我发给你”。'
    example_gloss:
    - 嗨，Sam，我会给你发一条消息。
  it.a1.unit23.lesson02.teach_si_sono_elena:
    title: Sì, sono Elena.
    gloss: 是的，我是Elena。
    note: '*Sì* 带重音符号；表示“是”时不要写成不带重音的 *si*。'
    example_gloss:
    - 是的，电话里是Elena。
