teaching:
  es.a1.unit14.lesson01.teach.el_apartamento:
    title: Квартира
    gloss: квартира
    note: Слово *apartamento* мужского рода.
    example_gloss: Я живу в маленькой квартире.
  es.a1.unit14.lesson01.teach.la_cocina:
    title: Кухня
    gloss: кухня
    note: У этого слова есть и другое значение — «готовка»; см. грамматическую заметку ниже.
    example_gloss: Моя кухня очень маленькая.
  es.a1.unit14.lesson01.teach.el_dormitorio:
    title: Спальня
    gloss: спальня
    note: Слово *dormitorio* мужского рода, оно происходит от *dormir* (спать).
    example_gloss: В спальне стоит большая кровать.
  es.a1.unit14.lesson01.teach.el_bano:
    title: Ванная
    gloss: ванная
    note: Слово *baño* мужского рода.
    example_gloss: В квартире одна ванная.
  es.a1.unit14.lesson01.teach.la_sala:
    title: Гостиная
    gloss: гостиная
    note: Слово *sala* женского рода.
    example_gloss: Мы смотрим телевизор в гостиной.
  es.a1.unit14.lesson01.teach.cocina_ambiguity_note:
    title: 'Cocina: комната или готовка'
    gloss: Чем la cocina (кухня) отличается от cocinar (готовить).
    note: Смотри текст самой карточки.
    target_text: '*La cocina* здесь означает «кухня» (комната) — это другое значение слова, чем *cocina*/*cocinar* (кулинария / готовить), которое встречалось во всём этом сюжете, говоря о самом мастер-классе. Различить их помогает контекст: в *taller de cocina* это кулинария; *la cocina* в доме или квартире — это комната; *cocinar* — глагол «готовить».'
  es.a1.unit14.lesson02.teach.alquilar:
    title: Снимать (в аренду)
    gloss: снимать, арендовать
    note: Глагол в инфинитиве, как в *quiero alquilar* (я хочу снять).
  es.a1.unit14.lesson02.teach.el_edificio:
    title: Здание
    gloss: здание, дом
    note: Слово *edificio* мужского рода.
    example_gloss: Дом находится рядом с парком.
  es.a1.unit14.lesson02.teach.desocupado:
    title: Свободный
    gloss: свободный
    note: '*Desocupado* говорят о жилье, которое сейчас пустует и сдаётся.'
  es.a1.unit14.lesson02.teach.grande:
    title: Большой
    gloss: большой
    note: Слово *grande* не меняется по родам (в отличие от прилагательных на -o/-a).
  es.a1.unit14.lesson02.teach.pequeno:
    title: Маленький
    gloss: маленький
    note: '*Pequeño/pequeña* — противоположность *grande*.'
  es.a1.unit14.lesson03.teach.cuantos_dormitorios_tiene:
    title: Спроси, сколько спален
    gloss: Сколько в ней спален?
    note: '*¿Cuántos...tiene?* (сколько... в нём/в ней?) — стандартная модель вопроса о том, что есть в жилье.'
  es.a1.unit14.lesson03.teach.tiene_dos_dormitorios_y_una_cocina_grande:
    title: Опиши спальни и кухню
    gloss: В ней две спальни и большая кухня.
    note: '*Tiene* (в нём есть) + число + существительное; здесь с *dormitorio*, *cocina* и *grande*.'
  es.a1.unit14.lesson04.teach.quiero_alquilar_un_apartamento_con_una_cocina_grande:
    title: Назови свою цель
    gloss: Я хочу снять квартиру с большой кухней.
    note: '*Quiero* (я хочу) + инфинитив *alquilar*; предлог *con* (с) вводит желаемую особенность.'
  es.a1.unit14.lesson04.teach.asi_puedes_cocinar_en_casa:
    title: Объясни выгоду
    gloss: Так ты сможешь готовить и дома.
    note: '*Así* (так) + *puedes* (ты можешь) + инфинитив связывает цель с жильём и тему готовки всей истории.'
  es.a1.unit14.lesson05.teach.anuncio_reading:
    title: Читаем объявление о квартире
    gloss: Свободная квартира в доме рядом с парком. В ней две спальни, ванная, гостиная и большая кухня. Прекрасно подойдёт тому, кто хочет готовить дома.
    note: Типичное объявление из газеты.
    glosses:
      desocupado: свободный
      edificio: здание, дом
      cerca: рядом, близко
      parque: парк
      Tiene: имеет, в нём есть (от tener)
      dormitorios: спальни
      baño: ванная
      sala: гостиная
      grande: большой
      perfecto: идеальный
      quiere: хочет (от querer)
      cocinar: готовить
  es.a1.unit14.lesson05.teach.para_alguien_que_note:
    title: Para alguien que...
    gloss: Как придаточное предложение описывает идеального жильца.
    note: Смотри текст самой карточки.
    target_text: '*Para alguien que quiere* (для того, кто хочет) строится из *alguien* (кто-то) + *que* (который) и вводит придаточное предложение — частая модель в объявлениях об идеальном жильце.'
  es.a1.unit14.lesson06.teach.line01:
    title: Проблема и цель
    gloss: Матео говорит, что его кухня очень маленькая и что он хочет снять квартиру с большой кухней.
    note: Соединяет *mi cocina es muy pequeña* (моя кухня очень маленькая) и цель *quiero alquilar un apartamento con una cocina grande* (я хочу снять квартиру с большой кухней).
  es.a1.unit14.lesson06.teach.line02:
    title: Предложи посмотреть объявления
    gloss: 'Елена предлагает посмотреть газету: там много объявлений.'
    note: '*El periódico* (газета) и *anuncios* (объявления) — новые слова из реальных газетных объявлений.'
  es.a1.unit14.lesson06.teach.line03:
    title: Найди объявление
    gloss: Матео находит дом, где есть свободная квартира.
    note: '*Este edificio* (этот дом) и *desocupado* (свободный).'
  es.a1.unit14.lesson06.teach.line04:
    title: Спроси про спальни
    gloss: Елена спрашивает, сколько в ней спален.
    note: Стандартный вопрос о том, что есть в жилье.
  es.a1.unit14.lesson06.teach.line05:
    title: Ответь с подробностями
    gloss: Матео говорит, что в квартире две спальни и большая кухня.
    note: '*Tiene* (в ней есть) + число + существительное.'
  es.a1.unit14.lesson06.teach.line06:
    title: Подтверди другие особенности
    gloss: Елена в восторге и замечает, что там есть ещё ванная и гостиная.
    note: '*Baño* (ванная) и *sala* (гостиная) завершают список комнат; *también* (тоже, ещё) стоит в конце.'
  es.a1.unit14.lesson06.teach.line07:
    title: Решись позвонить
    gloss: Матео решает позвонить в агентство сегодня же.
    note: '*Voy a llamar* (я собираюсь позвонить) + *hoy mismo* (сегодня же); *la agencia* — агентство по аренде.'
  es.a1.unit14.lesson06.teach.line08:
    title: Одобри и завершай сцену
    gloss: Елена одобряет и замечает, что так он сможет готовить и дома.
    note: Фраза *Así puedes cocinar en casa también* (так ты сможешь готовить и дома) завершает сцену.
