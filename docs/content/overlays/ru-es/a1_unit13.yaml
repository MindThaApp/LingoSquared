teaching:
  es.a1.unit13.lesson01.teach.el_trabajo:
    title: Работа
    gloss: работа
    note: Слово *trabajo* мужского рода; это также глагольная форма «я работаю».
    example_gloss: Мне нравится моя работа.
  es.a1.unit13.lesson01.teach.la_oficina:
    title: Офис
    gloss: офис
    note: Слово *oficina* женского рода.
    example_gloss: Я работаю в офисе.
  es.a1.unit13.lesson01.teach.el_escritorio:
    title: Письменный стол
    gloss: письменный стол
    note: Слово *escritorio* мужского рода.
    example_gloss: Это мой письменный стол.
  es.a1.unit13.lesson01.teach.la_escuela:
    title: Школа
    gloss: школа
    note: Слово *escuela* женского рода.
    example_gloss: Я преподаю в школе.
  es.a1.unit13.lesson01.teach.los_estudiantes:
    title: Ученики
    gloss: ученики
    note: У слова *estudiante* одна и та же форма для мужчины и для женщины; форма множественного числа *los estudiantes* обозначает и смешанную группу.
    example_gloss: У меня двадцать учеников.
  es.a1.unit13.lesson02.teach.trabajar:
    title: Работать
    gloss: работать
    note: Инфинитив глагола; используется в конструкциях вроде *me gusta trabajar* (мне нравится работать).
  es.a1.unit13.lesson02.teach.soy_contador:
    title: Скажи, что ты бухгалтер
    gloss: Я бухгалтер.
    note: Название профессии строится с *ser* + профессия, без артикля — см. грамматическую заметку ниже.
  es.a1.unit13.lesson02.teach.soy_profesora:
    title: Скажи, что ты учитель (женский род)
    gloss: Я учитель.
    note: '*Profesora* — женская форма от *profesor*.'
  es.a1.unit13.lesson02.teach.enseno_en_una_escuela:
    title: Скажи, где ты преподаёшь
    gloss: Я преподаю в школе.
    note: '*Enseño* (я преподаю) — форма 1-го лица от *enseñar*; здесь со словом *escuela* (школа).'
  es.a1.unit13.lesson02.teach.contador_vs_profesora_note:
    title: Названия профессий с ser
    gloss: Как в испанском называют профессию без артикля.
    note: Смотри текст самой карточки.
    target_text: 'Название профессии строится с *ser* + профессия, без артикля: *soy contador* (я бухгалтер), а не *soy un contador*. У слова *contador* есть женская форма *contadora*; *profesor/profesora* — такая же мужская/женская пара для слова «учитель» (для женщины добавляется *-a*).'
  es.a1.unit13.lesson03.teach.en_que_trabajas:
    title: Спроси о чьей-то работе
    gloss: Кем ты работаешь?
    note: '*¿En qué trabajas?* (буквально «в чём ты работаешь?») — стандартный вопрос о профессии.'
  es.a1.unit13.lesson03.teach.trabajo_en_una_oficina_soy_contador:
    title: Ответь, кем ты работаешь
    gloss: Я работаю в офисе. Я бухгалтер.
    note: Слово *oficina* соединяется с *soy contador* в естественный ответ из двух предложений.
  es.a1.unit13.lesson04.teach.me_gusta_mi_trabajo:
    title: Скажи, что тебе нравится твоя работа
    gloss: Мне нравится моя работа.
    note: Снова конструкция с *gustar*, здесь со словами *mi trabajo* (моя работа).
  es.a1.unit13.lesson04.teach.pero_prefiero_cocinar:
    title: Выскажи предпочтение
    gloss: Но я предпочитаю готовить.
    note: Форму *prefiero* (я предпочитаю) ты уже встречал; *cocinar* (готовить) — инфинитив, обозначающий главное занятие всей этой истории.
  es.a1.unit13.lesson04.teach.los_dos_preferimos_esto:
    title: Скажи, что вы оба предпочитаете это
    gloss: Мы оба предпочитаем это.
    note: '*Preferimos* — форма *nosotros* от *preferir*; её используют Элена и Матео, когда приходят к согласию.'
  es.a1.unit13.lesson05.teach.trabajos_reading:
    title: Читаем об их работе
    gloss: Матео работает в офисе в Лондоне. Он бухгалтер. Элена преподаёт в школе. Она учитель, у неё двадцать учеников. Обоим нравится их работа, но по вторникам они предпочитают готовить вместе.
    note: Краткий рассказ о основной работе Матео и Элены.
    glosses:
      trabaja: работает (от trabajar)
      oficina: офис
      contador: бухгалтер
      enseña: преподаёт (от enseñar)
      escuela: школа
      profesora: учитель
      tiene: имеет, есть (от tener)
      veinte: двадцать
      estudiantes: ученики
      gusta: нравится (от gustar)
      trabajo: работа
      prefieren: предпочитают (от preferir)
      cocinar: готовить
      juntos: вместе
      martes: по вторникам
  es.a1.unit13.lesson05.teach.a_los_dos_les_gusta_note:
    title: A los dos les gusta
    gloss: Как конструкция с gustar переходит на косвенное дополнение во множественном числе.
    note: Смотри текст самой карточки.
    target_text: '*A los dos les gusta* (им обоим нравится) распространяет конструкцию с *gustar* (которую ты уже знаешь) на косвенное дополнение во множественном числе: *les* (им) вместо *me/te* (мне/тебе).'
  es.a1.unit13.lesson06.teach.line01:
    title: Спроси Матео о его работе
    gloss: Элена спрашивает Матео, кем он работает.
    note: Уже знакомый тебе вопрос, теперь обращённый к Матео по имени.
  es.a1.unit13.lesson06.teach.line02:
    title: Ответ о его работе
    gloss: Матео говорит, что работает бухгалтером в офисе.
    note: 'Полный ответ, который ты уже учил: где он работает, а затем его профессия.'
  es.a1.unit13.lesson06.teach.line03:
    title: Отреагировать и рассказать о своей работе
    gloss: Елена находит это интересным и рассказывает, что она учительница.
    note: '*Interesante* (интересный) — новое слово, похожее на русское «интересный»; остальное — *soy profesora* и *enseño en una escuela*, они тебе уже знакомы.'
  es.a1.unit13.lesson06.teach.line04:
    title: Спроси, нравится ли ей преподавать
    gloss: Матео спрашивает, нравится ли ей преподавать.
    note: В *¿Te gusta enseñar?* уже знакомая модель вопроса с *gustar* сочетается с инфинитивом *enseñar*.
  es.a1.unit13.lesson06.teach.line05:
    title: Подтверди и добавь, что ты предпочитаешь
    gloss: Елена говорит, что ей очень нравится, но она предпочитает готовить с ним по вторникам.
    note: '*Contigo* (с тобой) — новая слитная форма предлога и местоимения; *los martes* (по вторникам) — артикль во множественном числе для дня, который повторяется каждую неделю.'
  es.a1.unit13.lesson06.teach.line06:
    title: Согласись с тем же предпочтением
    gloss: Матео говорит, что ему тоже нравится его работа, но он предпочитает готовить.
    note: '*A mí también* (мне тоже) — усиленная форма согласия с *gustar*: *a mí* подчёркивает, кому это нравится.'
  es.a1.unit13.lesson06.teach.line07:
    title: Сделай вывод
    gloss: Елена делает вывод, что им обоим это нравится больше (готовить вместе).
    note: '*Entonces* (тогда, значит) — новое слово для логического вывода; остальное — *los dos preferimos esto* (мы оба предпочитаем это).'
  es.a1.unit13.lesson06.teach.line08:
    title: Подтверди с энтузиазмом
    gloss: 'Матео соглашается: безусловно.'
    note: '*Definitivamente* (определённо, безусловно) — новое наречие, похожее на русское слово; им заканчивается сцена.'
