  description: 'Рассказ о своей работе. Продолжение истории Элены и Матео: на перерыве мастер-класса 22 июля они говорят о своей основной работе — Матео бухгалтер, Элена учитель — и соглашаются, что оба предпочитают готовить вместе.'
