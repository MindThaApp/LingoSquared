teaching:
  es.a1.unit10.lesson01.teach.el_tiempo:
    title: Погода
    gloss: погода
    note: '*Tiempo* значит также «время»; какое значение имеется в виду, понятно из контекста.'
    example_gloss: Какая сегодня погода?
  es.a1.unit10.lesson01.teach.el_sol:
    title: Солнце
    gloss: солнце
    note: '*Sol* — существительное мужского рода.'
    example_gloss: Сегодня очень солнечно.
  es.a1.unit10.lesson01.teach.la_lluvia:
    title: Дождь
    gloss: дождь
    note: '*Lluvia* — существительное женского рода.'
    example_gloss: Я не люблю дождь.
  es.a1.unit10.lesson01.teach.el_viento:
    title: Ветер
    gloss: ветер
    note: '*Viento* — существительное мужского рода.'
    example_gloss: Сегодня очень ветрено.
  es.a1.unit10.lesson01.teach.la_nube:
    title: Облако
    gloss: облако
    note: '*Nube* — существительное женского рода.'
    example_gloss: Нет ни одного облачка.
  es.a1.unit10.lesson02.teach.hace_calor:
    title: Жарко
    gloss: Жарко.
    note: '*Hace calor* (буквально «делает жару») — стандартный оборот для описания жаркой погоды.'
    example_gloss: В июле очень жарко.
  es.a1.unit10.lesson02.teach.hace_frio:
    title: Холодно
    gloss: Холодно.
    note: '*Hace frío* строится по той же модели *hace* + существительное, что и *hace calor*.'
    example_gloss: В декабре холодно.
  es.a1.unit10.lesson02.teach.hace_sol:
    title: Солнечно
    gloss: Солнечно.
    note: В *Hace sol* внутри той же устойчивой модели используется *el sol* (солнце).
  es.a1.unit10.lesson02.teach.llueve:
    title: Идёт дождь
    gloss: Идёт дождь.
    note: '*Llueve* — отдельная глагольная форма (от *llover*, «идти» о дожде), а не модель с *hace*. См. следующую grammar-заметку.'
  es.a1.unit10.lesson02.teach.esta_nublado:
    title: Облачно
    gloss: Облачно.
    note: В *Está nublado* используется *estar* + прилагательное — третья, особая модель описания погоды.
  es.a1.unit10.lesson02.teach.hace_vs_esta_note:
    title: 'Hace, llueve, está: три модели'
    gloss: Три разные грамматические модели для описания погоды.
    note: См. текст самой карточки.
    target_text: Выражения о погоде с *hace* (hace calor, hace frío, hace sol) — устойчивые обороты, буквально «делает жару/холод/солнце». *Llueve* («идёт дождь») — отдельная глагольная форма, а *está nublado* («пасмурно») строится с *estar* + прилагательное. Это три разные модели для одной задачи — описания погоды.
  es.a1.unit10.lesson03.teach.que_tiempo_hace_hoy:
    title: Спросить о погоде
    gloss: Какая сегодня погода?
    note: '*¿Qué tiempo hace hoy?* — стандартный способ спросить о текущей погоде; здесь используется *el tiempo* (погода).'
  es.a1.unit10.lesson03.teach.hace_mucho_calor_y_sol:
    title: Описать жаркую солнечную погоду
    gloss: Очень жарко и солнечно.
    note: Два выражения с *hace* соединены словом *y* (и).
  es.a1.unit10.lesson03.teach.hace_calor_pero_hay_viento:
    title: Описать жаркую ветреную погоду
    gloss: Жарко, но ветрено.
    note: '*Pero* (но) противопоставляет два погодных факта — жару и ветер; *hay* + существительное, как в *hay mucho viento*.'
  es.a1.unit10.lesson04.teach.en_invierno_hace_frio_en_madrid:
    title: Рассказать о зиме в Мадриде
    gloss: Зимой в Мадриде очень холодно.
    note: '*En invierno* (зимой) вводит название времени года; ниже оно противопоставлено *en julio*.'
  es.a1.unit10.lesson04.teach.en_julio_hace_demasiado_calor:
    title: Рассказать о жаре в июле
    gloss: В июле слишком жарко.
    note: '*Demasiado* (слишком) усиливает *calor* сильнее, чем обычное *mucho* (очень).'
  es.a1.unit10.lesson04.teach.necesitamos_agua:
    title: Объяснить, зачем нужна вода
    gloss: Нам нужна вода, потому что жарко.
    note: '*Porque* (потому что) связывает потребность с погодной причиной — практичная фраза для поездки на мастер-класс.'
  es.a1.unit10.lesson05.teach.pronostico_reading:
    title: Читаем прогноз погоды
    gloss: Сегодня, 22 июля, очень жарко и солнечно. На небе нет ни облачка. Ещё немного ветрено. Это хороший день, чтобы пойти на кулинарный мастер-класс, но важно взять с собой воду.
    note: Короткий прогноз на 22 июля — день кулинарного занятия.
    glosses:
      Hoy: сегодня
      veintidós: двадцать второе
      julio: июль
      hace: есть / стоит (погода; от hacer)
      calor: жара
      sol: солнце / солнечно
      hay: есть, имеется (от haber)
      nube: облако
      También: также
      poco: немного
      viento: ветер
      buen: хороший
      día: день
      ir: идти, ехать
      taller: мастерская, мастер-класс
      cocina: кулинария
      importante: важный
      llevar: брать с собой, носить
      agua: вода
  es.a1.unit10.lesson05.teach.un_poco_de_note:
    title: Un poco de (немного)
    gloss: Как un poco de выражает небольшое количество.
    note: См. текст самой карточки.
    target_text: '*Un poco de* («немного») используется с названиями продуктов, а здесь показывает небольшое количество ветра — та же модель с новым существительным.'
  es.a1.unit10.lesson06.teach.line01:
    title: Заметить, как жарко
    gloss: Елена говорит, как сегодня жарко.
    note: '*¡Qué calor hace hoy!* (дословно: «какую жару делает сегодня» — то есть «как сегодня жарко!») — восклицательное употребление выражения *hace calor*.'
  es.a1.unit10.lesson06.teach.line02:
    title: Согласиться и добавить деталь
    gloss: Матео соглашается и замечает, что на небе нет ни облачка.
    note: Здесь соединены *hace mucho calor y hace sol* и *no hay ni una nube*.
  es.a1.unit10.lesson06.teach.line03:
    title: Предложить взять воду
    gloss: Елена говорит, что им нужна вода в дорогу.
    note: '*El camino* (дорога, путь) — это их путь до мастер-класса.'
  es.a1.unit10.lesson06.teach.line04:
    title: Согласиться и указать на магазин
    gloss: Матео соглашается и говорит, что рядом есть магазин.
    note: '*Cerca de aquí* (рядом, недалеко отсюда) строится на выражении места *cerca de* (около, возле).'
  es.a1.unit10.lesson06.teach.line05:
    title: Сравнить зиму и лето
    gloss: Елена сравнивает холодную мадридскую зиму и слишком жаркий июль.
    note: 'Здесь соединены два предложения о временах года: *en invierno hace mucho frío* и *en julio hace demasiado calor*.'
  es.a1.unit10.lesson06.teach.line06:
    title: Сказать о своём предпочтении
    gloss: 'Матео говорит, что предпочитает жару: в Лондоне дождь идёт почти каждый день.'
    note: '*Prefiero* (я предпочитаю) — новая форма глагола в первом лице; *casi todos los días* (почти каждый день) — полезное выражение частоты.'
  es.a1.unit10.lesson06.teach.line07:
    title: Согласиться и поторопить
    gloss: Елена соглашается и говорит, что надо идти, иначе они опоздают на занятие.
    note: '*Es verdad* значит «это правда»; *o* (или) здесь выражает следствие: «иначе».'
  es.a1.unit10.lesson06.teach.line08:
    title: Согласиться и пойти
    gloss: Матео соглашается, что она права, и они идут.
    note: '*Tienes razón* (ты прав[а]) — частая фраза согласия.'
