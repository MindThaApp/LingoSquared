    title: Разговор интересный
    gloss: Разговор о временах года интересный.
  es.a1.unit65.lesson06.teach.diego_hola_a:
    title: Диего присоединяется к компании
    gloss: 'Диего: Всем привет! Какое время года тебе нравится, Елена?'
  es.a1.unit65.lesson06.teach.elena_me_gusta:
    title: Елена отвечает
    gloss: 'Елена: Мне нравится зима. Зимой мы катаемся на коньках.'
  es.a1.unit65.lesson06.teach.diego_el_otono:
    title: Диего отвечает
