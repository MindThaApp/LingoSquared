  es.a1.unit65.lesson05.teach.ahora_es_primavera:
    title: Разговор о временах года
    gloss: 'Сейчас весна. Тюльпаны красивые. Нина спрашивает: «Какое время года тебе нравится?» Матео говорит: «Мне нравится лето. Летом мы плаваем». Елена говорит: «Мне нравится зима. Зимой мы катаемся на коньках».'
    note: 'Краткий пересказ разговора в языковом кафе: реплики героев переданы прямой речью.'
    glosses:
      primavera: весна
      tulipanes: тюльпаны
      bonitos: красивые
      Pregunta: спрашивает
      estación: время года
      gusta: приятный / весёлый
      dice: говорит
      verano: лето
      nadamos: плаваем
      invierno: зима
      patinamos: катаемся на коньках
