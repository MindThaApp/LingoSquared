answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Испанский язык A1
  description: 'Испанский для начинающих: как описать внешность человека — рост и возраст, цвет волос и глаз, основной вопрос ¿Cómo es ...? и сравнение внешности двух людей.'
units:
  es.a1.unit52.appearance:
    title: Описываем внешность
lessons:
  es.a1.unit52.lesson01.alto_bajo_mayor_y:
    title: Высокий, низкий, пожилой и молодой
  es.a1.unit52.lesson02.describir_el_pelo:
    title: Описываем волосы
  es.a1.unit52.lesson03.los_ojos_y_como:
    title: Глаза и вопрос «Как выглядит человек?»
  es.a1.unit52.lesson04.elena_describe_a_nina:
    title: Elena описывает Nina
  es.a1.unit52.lesson05.comparar_a_diego_y:
    title: Сравниваем Diego и Lucía
  es.a1.unit52.lesson06.mateo_reconoce_a_nina:
    title: Mateo узнаёт Nina
teaching:
  es.a1.unit52.lesson01.teach.alto_bajo:
    title: Высокий и низкий
    gloss: высокий / невысокий
    note: '*Alto* — высокий человек, *bajo* — невысокий; оба слова согласуются с человеком: *alta*, *baja*.'
    example_gloss:
    - Лусия высокая.
    - Диего невысокий.
  es.a1.unit52.lesson01.teach.mayor_joven:
    title: Пожилой и молодой
    gloss: пожилой / молодой
    note: '*Mayor* и *joven* передают общее впечатление о возрасте, а не точное число лет.'
    example_gloss:
    - Дедушка пожилой.
    - Матео молодой.
  es.a1.unit52.lesson01.teach.para_dar_la:
    title: 'Mayor: впечатление, а не число'
    gloss: 'Точный возраст называют с помощью tener años: ¿Cuántos años tienes? Слово mayor даёт общее впечатление без числа: El abuelo es mayor.'
    note: 'Точный возраст выражают словами *tener años*: *¿Cuántos años tienes?* *Mayor* передаёт только общее впечатление, без числа.'
  es.a1.unit52.lesson01.teach.lucia_es_alta:
    title: Лусия высокая, а Диего невысокий
    gloss: Лусия высокая, а Диего невысокий.
    note: Простое сложное предложение с *y* («и»); оно готовит почву для прямого сравнения в одном из следующих уроков.
  es.a1.unit52.lesson02.teach.el_pelo:
    title: Волосы
    gloss: волосы
    note: '*El pelo* — мужского рода и остаётся в единственном числе, когда речь идёт о волосах человека в целом.'
    example_gloss: У Матео короткие чёрные волосы.
  es.a1.unit52.lesson02.teach.rubio_castano_gris:
    title: Светлый, каштановый и седой
    gloss: светлый / каштановый / седой
    note: 'Три цвета волос: *rubio* (светлый), *castaño* (каштановый) и *gris* (седой). *Rubio* согласуется с существительным: *pelo rubio*, *melena rubia*.'
    example_gloss:
    - У Элены светлые волосы.
    - У Диего каштановые волосы.
    - У дедушки седые волосы.
  es.a1.unit52.lesson02.teach.largo_corto:
    title: Длинные и короткие (волосы)
    gloss: длинный / короткий (о волосах)
    note: '*Largo* («длинный») уже встречалось в уроке о росте, теперь оно описывает длину волос; *corto* («короткий») — новое слово: *el pelo largo*, *el pelo corto*.'
    example_gloss:
    - У Лусии длинные волосы.
    - У Диего короткие волосы.
  es.a1.unit52.lesson02.teach.el_adjetivo_va:
    title: Прилагательное стоит после существительного
    gloss: 'Прилагательное стоит после существительного: el pelo corto, el pelo largo, el pelo rubio, el pelo castaño, el pelo gris, el pelo negro.'
    note: 'В испанском прилагательное обычно стоит после существительного, в отличие от русского, и согласуется с ним: *el pelo corto*, *el pelo rubio*.'
  es.a1.unit52.lesson02.teach.pelo_y_cabello:
    title: Pelo и cabello
    gloss: 'Pelo и cabello означают одно и то же. В этом курсе мы говорим pelo: el pelo largo.'
    note: '*Pelo* и *cabello* в повседневной речи оба означают «волосы»; в этом курсе используется *pelo*.'
  es.a1.unit52.lesson02.teach.mateo_tiene_el:
    title: У Матео короткие чёрные волосы
    gloss: У Матео короткие чёрные волосы.
    note: Снова слово *negro* («чёрный») из урока об одежде.
  es.a1.unit52.lesson02.teach.elena_tiene_el:
    title: У Элены длинные светлые волосы
    gloss: У Элены длинные светлые волосы.
    note: В одном естественном предложении соединены слова о длине и цвете из этого урока.
  es.a1.unit52.lesson03.teach.los_ojos:
    title: Глаза
    gloss: глаза
    note: '*Los ojos* — множественное число от *el ojo*; оба слова мужского рода.'
    example_gloss: У Матео карие глаза.
  es.a1.unit52.lesson03.teach.azul_marron_verde:
    title: Голубой, карий и зелёный
    gloss: голубой / карий / зелёный
    note: У *azul* («голубой») и *verde* («зелёный») одна форма для обоих родов; *marrón* («карий») — обычное слово для цвета глаз, а для волос говорят *castaño*.
    example_gloss:
    - У Элены голубые глаза.
    - У Диего карие глаза.
    - У Лусии зелёные глаза.
  es.a1.unit52.lesson03.teach.con_ojos_plural:
    title: К ojos прилагательное ставится во множественном числе
    gloss: 'Со словом ojos (мн. ч.) прилагательное тоже стоит во множественном числе: ojos azules, ojos marrones, ojos verdes.'
    note: 'Прилагательные согласуются в числе: *ojos* — множественное число, поэтому *azules*, *marrones*, *verdes*.'
  es.a1.unit52.lesson03.teach.como_es_elena:
    title: Как выглядит Элена?
    gloss: Как выглядит Элена?
    note: '*¿Cómo es ...?* — главный вопрос этого раздела; с его помощью можно спросить о внешности любого человека.'
  es.a1.unit52.lesson03.teach.elena_tiene_el:
    title: У Элены длинные светлые волосы и голубые глаза
    gloss: У Элены длинные светлые волосы и голубые глаза.
    note: 'Образец ответа: волосы и глаза в одном предложении, соединённые через *y*.'
  es.a1.unit52.lesson04.teach.elena_viene_una:
    title: Elena рассказывает о Nina
    gloss: 'Elena: В языковое кафе приходит новая девушка. Её зовут Nina.'
    note: '*Viene* («приходит») вводит нового человека; *se llama* означает «её зовут».'
  es.a1.unit52.lesson04.teach.mateo_genial_como:
    title: Mateo спрашивает, как она выглядит
    gloss: 'Mateo: Здорово! А какая она?'
    note: 'Тот же главный вопрос, но без имени: *¿Cómo es?*'
  es.a1.unit52.lesson04.teach.elena_es_baja:
    title: Elena описывает рост и волосы Nina
    gloss: 'Elena: Она невысокая, у неё короткие светлые волосы.'
    note: Здесь слово *baja* из первого урока соединено с лексикой о волосах; *baja* стоит в женском роде, потому что Nina — девушка.
  es.a1.unit52.lesson04.teach.mateo_y_los:
    title: Mateo спрашивает о её глазах
    gloss: 'Mateo: А глаза?'
    note: В *¿Y los ojos?* тема подхватывается с определённым артиклем; притяжательное *sus* здесь не нужно — как и в русском «А глаза?».
  es.a1.unit52.lesson04.teach.elena_tiene_los:
    title: Elena описывает глаза Nina
    gloss: 'Elena: У неё зелёные глаза.'
    note: Снова *los ojos verdes* из урока о глазах.
  es.a1.unit52.lesson04.teach.mateo_gracias_entonces:
    title: Mateo её узнает
    gloss: 'Mateo: Спасибо! Тогда я её узнаю.'
    note: '*La reconoceré* («я её узнаю») — форма будущего времени; *la* означает «её» и стоит перед глаголом.'
  es.a1.unit52.lesson05.teach.diego_es_el:
    title: Сравниваем Diego и Lucía
    gloss: Diego и Lucía — брат и сестра, но они непохожи. Diego невысокий, у него короткие каштановые волосы и карие глаза. Lucía выше, чем Diego, у неё длинные каштановые волосы и зелёные глаза. А как выглядишь ты?
    note: Короткое сравнение, в котором встречаются все изученные слова о цвете и длине; в конце читателю задан главный вопрос раздела.
    glosses:
      hermano: брат
      hermana: сестра
      eres: выглядеть
      diferentes: разный
      bajo: невысокий
      corto: невысокий
      castaño: карий
      pelo: волосы
      marrones: карий
      ojos: глаза
      alta: выше
      largo: длинный
      verdes: зелёный
      cómo: '(часть вопроса: какой он / какая она?)'
  es.a1.unit52.lesson05.teach.ya_conoces_el:
    title: Та же модель сравнения
    gloss: 'Ты уже знаешь модель сравнения: más + прилагательное + que. Здесь она используется для людей: Lucía es más alta que Diego.'
    note: Модель *más + adjective + que* из раздела о сравнениях, теперь применённая к людям, а не к предметам.
  es.a1.unit52.lesson05.teach.lucia_tiene_el:
    title: У Лусии волосы длиннее, чем у Диего
    gloss: У Лусии волосы длиннее, чем у Диего.
    note: '*Más largo que* сравнивает два предмета: *el pelo más largo que Diego*; слово *largo* остаётся в мужском роде, потому что *pelo* мужского рода.'
  es.a1.unit52.lesson05.teach.tengo_el_pelo:
    title: У меня короткие каштановые волосы
    gloss: У меня короткие каштановые волосы.
    note: Образец предложения от первого лица с *tengo*; его можно использовать, когда описываешь себя.
  es.a1.unit52.lesson06.teach.mateo_mira_es:
    title: Матео замечает Нину
    gloss: 'Матео: Смотри, это Нина? У неё короткие светлые волосы и зелёные глаза.'
    note: '*Mira* («смотри») — повелительная форма глагола *mirar* на «ты», здесь она служит, чтобы обратить внимание на что-то.'
  es.a1.unit52.lesson06.teach.elena_si_esa:
    title: Элена подтверждает
    gloss: 'Элена: Да, это Нина!'
    note: Короткое естественное подтверждение.
  es.a1.unit52.lesson06.teach.nina_hola_eres:
    title: Нина здоровается с Матео
    gloss: 'Нина: Привет, ты Матео?'
    note: 'Простой вопрос при знакомстве на «ты»: *¿Eres ...?*'
  es.a1.unit52.lesson06.teach.mateo_si_encantado:
    title: Матео отвечает на приветствие
    gloss: 'Матео: Да! Рад познакомиться, Нина.'
    note: '*Encantado de conocerte* — обычная фраза при первом знакомстве; женщина говорит *Encantada*.'
  es.a1.unit52.lesson06.teach.nina_encantada_de:
    title: Нина отвечает на приветствие
    gloss: 'Нина: Я тоже рада познакомиться!'
    note: 'Завершает диалог: Матео узнал Нину по описанию Элены.'
