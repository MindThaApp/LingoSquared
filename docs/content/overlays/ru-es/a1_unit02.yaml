  es.a1.unit02.lesson01.numbers_zero_to_ten:
    title: Числа от нуля до десяти
  es.a1.unit02.lesson02.numbers_eleven_to_hundred:
    title: От одиннадцати до ста
  es.a1.unit02.lesson03.asking_age:
    title: Как спросить о возрасте
  es.a1.unit02.lesson04.phone_numbers:
    title: Номера телефонов
  es.a1.unit02.lesson05.recipe_quantities:
    title: Количества в рецептах
  es.a1.unit02.lesson06.recipe_count_dialogue:
    title: Считаем ингредиенты вместе с Еленой и Матео
teaching:
  es.a1.unit02.lesson01.teach.cero:
    title: Ноль
    gloss: ноль
    note: '*Cero* — это и само число, и цифра, когда вслух читают ряд цифр.'
  es.a1.unit02.lesson01.teach.uno:
    title: Один
    gloss: один
    note: '*Uno* сокращается до *un* перед существительным мужского рода в единственном числе (*un huevo*, одно яйцо) и меняется на *una* перед существительным женского рода (*una taza*, одна чашка). Отдельно, например при счёте, остаётся *uno*.'
  es.a1.unit02.lesson01.teach.dos:
    title: Два
    gloss: два
    note: '*Dos* не меняется, какого бы рода ни было существительное.'
  es.a1.unit02.lesson01.teach.tres:
    title: Три
    gloss: три
    note: '*Tres*, как и *dos*, не изменяется.'
  es.a1.unit02.lesson01.teach.cuatro:
    title: Четыре
    gloss: четыре
    note: '*Cuatro* не изменяется.'
  es.a1.unit02.lesson01.teach.cinco:
    title: Пять
    gloss: пять
    note: '*Cinco* не изменяется.'
  es.a1.unit02.lesson01.teach.seis:
    title: Шесть
    gloss: шесть
    note: '*Seis* не изменяется.'
  es.a1.unit02.lesson01.teach.siete:
    title: Семь
    gloss: семь
    note: '*Siete* не изменяется.'
  es.a1.unit02.lesson01.teach.ocho:
    title: Восемь
    gloss: восемь
    note: '*Ocho* не изменяется.'
  es.a1.unit02.lesson01.teach.nueve:
    title: Девять
    gloss: девять
    note: '*Nueve* не изменяется.'
  es.a1.unit02.lesson01.teach.diez:
    title: Десять
    gloss: десять
    note: '*Diez* не изменяется.'
  es.a1.unit02.lesson02.teach.once:
    title: Одиннадцать
    gloss: одиннадцать
    note: Числа от *once* до *quince* (11–15) — отдельные слова, их нужно выучить как набор; числа от шестнадцати до девятнадцати строятся из *diez* (*dieciséis*, *diecisiete*...).
  es.a1.unit02.lesson02.teach.doce:
    title: Двенадцать
    gloss: двенадцать
    note: '*Doce* — отдельное слово; оно похоже на *dos*, но имеет свою собственную форму.'
  es.a1.unit02.lesson02.teach.trece:
    title: Тринадцать
    gloss: тринадцать
    note: '*Trece* — отдельное слово; оно похоже на *tres*, но имеет свою собственную форму.'
  es.a1.unit02.lesson02.teach.catorce:
    title: Четырнадцать
    gloss: четырнадцать
    note: '*Catorce* — отдельное слово; оно похоже на *cuatro*, но имеет свою собственную форму.'
  es.a1.unit02.lesson02.teach.quince:
    title: Пятнадцать
    gloss: пятнадцать
    note: '*Quince* — последнее из слитных числительных, дальше, с шестнадцати, принцип образования меняется.'
  es.a1.unit02.lesson02.teach.veinte:
    title: Двадцать
    gloss: двадцать
    note: '*Veinte* — отдельное слово. Начиная с *veintiuno* (21) и до двадцати девяти десятки и единицы пишутся слитно, одним словом; эта модель снова встретится с *veintiocho* в уроке 3.'
  es.a1.unit02.lesson02.teach.treinta:
    title: Тридцать
    gloss: тридцать
    note: Начиная с тридцати десятки и единицы соединяются через *y* («и») и пишутся тремя отдельными словами, а не слитно, как в двадцатых.
  es.a1.unit02.lesson02.teach.treinta_y_cuatro:
    title: Тридцать четыре
    gloss: тридцать четыре
    note: '*Treinta y cuatro* пишется тремя отдельными словами: десяток, *y* и единица.'
  es.a1.unit02.lesson02.teach.cien:
    title: Сто
    gloss: сто
    note: '*Cien* — форма для ровно 100, когда число стоит само по себе; если число продолжается, вместо неё используется *ciento* (*ciento uno*, 101), но в этом модуле это ещё не проходится.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tienes:
    title: Вопрос о возрасте (неформально)
    gloss: Сколько тебе лет?
    note: 'В русском возраст выражается конструкцией «тебе … лет», а в испанском используется глагол *tener* («иметь»): буквально спрашивают, сколько лет у тебя есть. Глаголы *ser* и *estar* здесь не нужны.'
  es.a1.unit02.lesson03.teach.tengo_veintiocho:
    title: Назвать свой возраст
    gloss: Мне двадцать восемь.
    note: '*Tengo* — форма *tener* для yo. В полном ответе обычно есть *años* (годы, лет); если тема возраста уже задана, слово можно опустить, как в *Tengo treinta y uno*.'
  es.a1.unit02.lesson03.teach.cuantos_anos_tiene_usted:
    title: Вопрос о возрасте (формально)
    gloss: Сколько вам лет?
    note: '*Tiene* — форма *tener* для *usted*, в соответствии с формальным обращением, с которым вы познакомились в первом модуле.'
  es.a1.unit02.lesson03.teach.tengo_treinta_y_uno:
    title: Назвать возраст из двух слов
    gloss: Мне тридцать один год.
    note: В *Treinta y uno* остаётся *uno* (а не *un*), потому что в этом ответе сразу после числа нет существительного.
  es.a1.unit02.lesson03.teach.y_tu_cuantos:
    title: Задать встречный вопрос о возрасте
    gloss: А тебе сколько лет?
    note: '*Tienes* без повторного *años* — естественное и привычное сокращение, когда тема уже ясна.'
  es.a1.unit02.lesson04.teach.cual_es_tu_numero:
    title: Спросить номер телефона
    gloss: Какой у тебя номер телефона?
    note: '*Cuál*, а не *qué*, естественно, когда просят назвать один конкретный предмет из множества возможных, например номер телефона.'
  es.a1.unit02.lesson04.teach.numero_elena:
    title: Номер, прочитанный по цифрам
    gloss: Шесть, один, пять, ноль, два, девять, семь, три
    note: Номер телефона можно читать по одной цифре, как здесь. Многие испаноговорящие также группируют цифры по две, поэтому учись понимать оба способа. В русском номер тоже часто читают парами.
  es.a1.unit02.lesson04.teach.es_el:
    title: Начать называть номер
    gloss: Это...
    note: '*El* (определённый артикль мужского рода) стоит потому, что *número* — существительное мужского рода.'
  es.a1.unit02.lesson04.teach.puedes_repetir:
    title: Попросить повторить
    gloss: Можешь повторить, пожалуйста?
    note: '*Puedes* — форма *tú* глагола *poder* (мочь), удобная, когда ты не успел расслышать названный номер.'
  es.a1.unit02.lesson04.teach.claro:
    title: Охотно согласиться
    gloss: Конечно; разумеется
    note: '*Claro* — частый дружелюбный способ согласиться на просьбу.'
  es.a1.unit02.lesson05.teach.necesito_tres_huevos:
    title: Назвать нужное количество
    gloss: Мне нужны три яйца.
    note: '*Necesito* — форма yo глагола *necesitar* (нуждаться, быть нужным). *Huevos* (яйца) остаётся во множественном числе после любого числа больше одного.'
  es.a1.unit02.lesson05.teach.cuantos_huevos_necesitas:
    title: Спросить, сколько нужно
    gloss: Сколько яиц тебе нужно?
    note: '*Cuántos* согласуется в роде и числе с существительным, о котором спрашивают; *huevos* — мужской род, мн. число, поэтому *cuántos*, а не *cuántas*.'
  es.a1.unit02.lesson05.teach.dos_tazas_harina:
    title: Назвать отмеренное количество
    gloss: Две чашки муки
    note: '*De* связывает меру (*tazas*, чашки) с тем, что измеряется (*harina*, мука). В русском здесь вместо предлога используется родительный падеж: «чашки муки».'
  es.a1.unit02.lesson05.teach.media_taza:
    title: Назвать половинное количество
    gloss: Полчашки сахара
    note: '*Media* согласуется с существительным женского рода *taza*; форма мужского рода *medio* употребляется с существительными мужского рода.'
  es.a1.unit02.lesson05.teach.tengo_cuatro_huevos:
    title: Сказать, что есть в наличии
    gloss: У меня на столе четыре яйца.
    note: '*Tengo* (у меня есть) сообщает о том, что уже имеется, в отличие от *necesito* (мне нужно), которое говорит о том, чего ещё не хватает.'
  es.a1.unit02.lesson06.teach.line01:
    title: Спросить, сколько яиц
    gloss: Elena спрашивает Mateo, сколько яиц ему нужно для рецепта.
    note: Продолжается обращение на *tú* между двумя ровесниками, как в Unit 1.
  es.a1.unit02.lesson06.teach.line02:
    title: Назвать ингредиенты
    gloss: Mateo говорит, что ему нужны три яйца и две чашки муки.
    note: '*Necesito* называет то, что ещё нужно для рецепта.'
  es.a1.unit02.lesson06.teach.line03:
    title: Предложить то, что есть
    gloss: Elena говорит, что у неё на столе четыре яйца, и спрашивает, нужен ли ему ещё сахар.
    note: '*Tengo* сообщает о том, что уже есть у Elena, в отличие от того, что нужно Mateo.'
  es.a1.unit02.lesson06.teach.line04:
    title: Подтвердить небольшое количество
    gloss: Mateo отвечает «да, немного — примерно полчашки».
    note: '*Como* здесь значит «примерно», «около», а не более частое «как».'
  es.a1.unit02.lesson06.teach.line05:
    title: Спросить номер телефона
    gloss: Elena говорит «отлично», а затем спрашивает номер телефона Mateo, чтобы написать ему о следующем занятии.
    note: '*Así te escribo* («чтобы я могла тебе написать») объясняет, зачем она спрашивает, — естественная привычка в разговоре перед просьбой о контактах.'
  es.a1.unit02.lesson06.teach.line06:
    title: Назвать номер телефона
    gloss: Mateo читает свой номер по одной цифре.
    note: '*Es el* вводит номер и согласуется с существительным мужского рода *número*.'
  es.a1.unit02.lesson06.teach.line07:
    title: Поблагодарить и спросить о возрасте
    gloss: 'Elena благодарит его и задаёт ещё один вопрос: сколько ему лет.'
    note: '*Una pregunta más* («ещё один вопрос») — естественный переход к новой теме в том же разговоре.'
  es.a1.unit02.lesson06.teach.line08:
    title: Назвать свой возраст
    gloss: Mateo говорит, что ему двадцать восемь, и задаёт Elena тот же вопрос.
    note: '*Tengo veintiocho años* использует слитную форму для чисел второго десятка, как в уроке 2.'
  es.a1.unit02.lesson06.teach.line09:
    title: Назвать её возраст
    gloss: Elena говорит, что ей тридцать один год.
    note: В *Tengo treinta y uno* слово *años* опущено, потому что тема (возраст) ясна из контекста. Это естественное сокращение, как и во встречном вопросе без повтора *años* в уроке 3.
