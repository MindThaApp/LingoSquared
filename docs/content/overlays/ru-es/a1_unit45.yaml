teaching:
  es.a1.unit45.lesson01.teach.cuanto_cuesta_en:
    title: Спрашиваем общую стоимость
    gloss: Сколько это стоит всего?
    note: '*En total* уточняет, что тебя интересует полная общая сумма, а не цена одного товара.'
  es.a1.unit45.lesson01.teach.cuesta_veinticinco_euros:
    title: Называем общую стоимость
    gloss: Это стоит двадцать пять евро всего.
    note: '*Cuesta* — форма 3-го лица единственного числа глагола *costar* (стоить); в ударной позиции гласная корня *o* переходит в *ue*.'
  es.a1.unit45.lesson02.teach.pagar_con_tarjeta:
    title: Оплата картой или наличными
    gloss: платить картой, платить наличными
    note: 'В *pagar con tarjeta* (платить картой) и *pagar en efectivo* (платить наличными) предлоги разные: *con* — для средства оплаты, *en* — для вида денег.'
    example_gloss:
    - Можно здесь заплатить картой?
    - Я плачу наличными.
  es.a1.unit45.lesson02.teach.puedo_pagar_con:
    title: Спрашиваем, можно ли платить картой
    gloss: Можно здесь заплатить картой?
    note: '*Puedo* (я могу) — форма *yo* глагола *poder*; *aquí* (здесь) привязывает вопрос к месту, где ты находишься.'
  es.a1.unit45.lesson02.teach.quiere_pagar_en:
    title: Спрашиваем о способе оплаты
    gloss: Вы хотите заплатить наличными или картой?
    note: '*Quiere* — вежливая форма *usted* глагола *querer*; так обращается незнакомый кассир. С другом скажешь *¿quieres pagar...?*'
  es.a1.unit45.lesson03.teach.la_cuenta:
    title: Счёт
    gloss: счёт
    note: 'Существительное женского рода: *la cuenta*. В ресторане это счёт за еду, а в банке — банковский счёт.'
    example_gloss: Разделим счёт?
  es.a1.unit45.lesson03.teach.dividimos_la_cuenta:
    title: Предлагаем разделить счёт
    gloss: Разделим счёт?
    note: '*¿Dividimos...?* — форма *nosotros*, которой делают предложение, как русским «давайте…?» или «…разделим?».'
  es.a1.unit45.lesson03.teach.puedo_pagar_por:
    title: Просим заплатить раздельно
    gloss: Можно заплатить раздельно?
    note: '*Por separado* (раздельно) говорит о том, как ты платишь; *pagar* (платить) — обычный глагол для этого.'
  es.a1.unit45.lesson04.teach.el_cambio:
    title: Сдача
    gloss: сдача
    note: 'Существительное мужского рода: *el cambio*. Оно также значит «изменение», например *un cambio de planes*.'
    example_gloss: Вот ваша сдача.
  es.a1.unit45.lesson04.teach.aqui_tiene_su:
    title: Отдаём сдачу
    gloss: Вот ваша сдача.
    note: '*Su* — притяжательное местоимение, соответствующее вежливому *usted* («ваш»); *Aquí tiene* — обычная вежливая фраза, когда что-то передают.'
  es.a1.unit45.lesson04.teach.no_necesito_cambio:
    title: Отказываемся от сдачи
    gloss: Сдача не нужна.
    note: 'После *necesitar* (нуждаться) дополнение идёт без предлога: *necesito cambio*; *no* отрицает глагол.'
  es.a1.unit45.lesson05.teach.treinta_y_cinco:
    title: Тридцать пять
    gloss: тридцать пять
    note: '*Treinta y cinco* (тридцать пять): с 31 до 99 десятки и единицы соединяются словом *y* и пишутся раздельно.'
    example_gloss: Это стоит тридцать пять евро.
  es.a1.unit45.lesson05.teach.cuenta_dos_platos:
    title: Читаем счёт из ресторана
    gloss: 'Счёт: два основных блюда и два кофе. Итого: тридцать пять евро. Оплачено картой.'
    note: Обрати внимание, что заказали, какова итоговая сумма и как заплатили.
    glosses:
      Cuenta: счёт
      dos: два
      platos: основные блюда
      cafés: кофе
      Total: итого
      treinta: тридцать пять
      euros: евро
      Pagado: оплачено
      tarjeta: карта
  es.a1.unit45.lesson06.teach.elena_pedimos_la:
    title: Елена просит счёт
    gloss: 'Елена: Попросим счёт?'
    note: 'После *pedir* (просить, заказывать) *la cuenta* стоит как прямое дополнение: *pedimos la cuenta* (мы просим счёт).'
  es.a1.unit45.lesson06.teach.mateo_si_buena:
    title: Матео спрашивает сумму
    gloss: 'Матео: Да, хорошая идея. Сколько это стоит всего?'
    note: Здесь повторяется вопрос *¿cuánto cuesta en total?* из первого урока.
  es.a1.unit45.lesson06.teach.elena_son_treinta:
    title: Елена называет сумму
    gloss: 'Елена: Тридцать пять евро. Разделим?'
    note: 'Для денежных сумм используется *son*: *son treinta y cinco euros* — глагол во множественном числе, потому что сумма выражена множественным числом.'
  es.a1.unit45.lesson06.teach.mateo_no_deja:
    title: Матео настаивает на оплате
    gloss: 'Матео: Нет, позволь мне заплатить сегодня. Ты мне так сильно помогла.'
    note: В *deja que pague yo* (позволь мне заплатить) после *que* стоит сослагательное наклонение *pague*; пока запомни это как готовую фразу. *Me has ayudado* — перфект (ты мне помогла).
  es.a1.unit45.lesson06.teach.elena_que_amable:
    title: Елена тронута
    gloss: 'Елена: Как мило с твоей стороны! Спасибо.'
    note: '*¡Qué amable eres!* («как ты добр!») — конструкция *qué* + прилагательное, которой тепло реагируют на щедрый жест; *muchas gracias* звучит сильнее, чем просто *gracias*.'
  es.a1.unit45.lesson06.teach.mateo_puedo_pagar:
    title: Матео спрашивает про оплату картой
    gloss: 'Матео: Можно здесь заплатить картой?'
    note: Здесь повторяется вопрос *¿puedo pagar con tarjeta aquí?* из второго урока, теперь уже в настоящем ресторане.
  es.a1.unit45.lesson06.teach.mateo_paga_la:
    title: 'Paga: форма он/она'
    gloss: Матео оплачивает счёт.
    note: '*Paga* — форма 3-го лица единственного числа глагола *pagar* (платить): *Mateo paga la cuenta*.'
