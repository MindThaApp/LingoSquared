    example_gloss:
    - У Элены есть собака.
    - У Диего есть кот.
  es.a1.unit53.lesson01.teach.el_pez_el:
    title: Рыба и птица
    gloss: рыба / птица
    example_gloss:
    - У дедушки есть рыба.
    - У Нины есть птица.
  es.a1.unit53.lesson01.teach.tienes_mascota:
    title: У тебя есть питомец?
    gloss: У тебя есть питомец?
    note: Тот же вопрос с *¿Tienes ...?*, который ты уже знаешь по прежним урокам.
  es.a1.unit53.lesson01.teach.si_tengo_un:
    title: Да, у меня есть собака
    gloss: Да, у меня есть собака.
    note: Простой утвердительный ответ с новой лексикой этого раздела.
  es.a1.unit53.lesson01.teach.no_no_tengo:
    title: Нет, у меня нет питомца
    gloss: Нет, у меня нет питомца.
    note: В *No tengo mascota* частица *no* просто ставится перед глаголом; см. grammar-заметку ниже.
  es.a1.unit53.lesson01.teach.para_decir_que:
    title: 'No tengo: как сказать, что у тебя чего-то нет'
    gloss: 'Чтобы сказать, что у тебя чего-то нет, поставь no перед tengo: No tengo tiempo, no tengo mascota.'
    note: Модель *no tengo* уже знакома по фразе *No tengo tiempo*; новое здесь только существительное.
  es.a1.unit53.lesson02.teach.sacar_a_pasear:
    title: Выгуливать (животное)
    gloss: выгуливать (животное)
    note: '*Sacar a pasear* — устойчивое выражение: *sacar* («выводить») + *a pasear* («на прогулку»).'
    example_gloss: Я выгуливаю собаку каждый день.
  es.a1.unit53.lesson02.teach.cuando_el_objeto:
    title: Sacar a pasear и предлог a перед одушевлённым дополнением
    gloss: 'Когда дополнение — животное или человек, перед ним ставится a: saco al perro a pasear.'
    note: Здесь снова *saco al perro* из прошлой карточки; предлог *a* ставится перед животными или людьми, которые тебе дороги.
  es.a1.unit53.lesson02.teach.dar_de_comer:
    title: Кормить
    gloss: кормить
    example_gloss: Я кормлю кошку каждый день.
  es.a1.unit53.lesson02.teach.jugar_con:
    title: Играть с
    gloss: играть с
    example_gloss: Diego играет со своим котом.
  es.a1.unit53.lesson02.teach.saco_al_perro:
    title: Я выгуливаю собаку каждый день
    gloss: Я выгуливаю собаку каждый день.
    note: '*Sacar a pasear* сочетается с *todos los días* («каждый день»), которое уже встречалось раньше; *a* + *el* превращается в *al*.'
  es.a1.unit53.lesson02.teach.le_doy_de:
    title: Я кормлю кота каждый день
    gloss: Я кормлю кота каждый день.
    note: '*Dar de comer* («давать поесть») значит «кормить»; *le* заменяет животное: *le doy de comer al gato*.'
  es.a1.unit53.lesson03.teach.el_plural_termina:
    title: 'Plural: perro → perros'
    gloss: 'Множественное число оканчивается на -s: perro → perros, gato → gatos. После согласной добавляется -es: animal → animales.'
    note: 'Правильное образование множественного числа в испанском: -s после гласной, -es после согласной. Здесь оно впервые показано на названиях животных.'
  es.a1.unit53.lesson03.teach.perros_gatos:
    title: Собаки и кошки
    gloss: собаки / коты
    example_gloss:
    - Mateo обожает собак.
    - Lucía обожает кошек.
  es.a1.unit53.lesson03.teach.peces_pajaros:
