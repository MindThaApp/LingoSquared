    - Дедушка обожает птиц.
  es.a1.unit53.lesson03.teach.me_encantan_los:
    title: Я обожаю животных
    gloss: Я обожаю животных.
    note: '*Me encantan* стоит во множественном числе, потому что *los animales* — множественное число: глагол согласуется с тем, что тебе нравится.'
  es.a1.unit53.lesson03.teach.a_lucia_le:
