    title: Elena рассказывает о своём распорядке
    gloss: 'Elena: Да, я выгуливаю его каждый день и кормлю.'
  es.a1.unit53.lesson05.teach.a_mateo_y:
    title: Mateo, Lucía и Diego о животных
    gloss: 'Mateo и Lucía обожают животных, но ни у одного из них нет питомца. Mateo обожает собак, а Lucía — кошек. А вот у Diego есть питомец: кот. Он часто играет со своим котом и кормит его каждый день. А у тебя есть питомец?'
    note: Противопоставляет любовь к животным и наличие собственного питомца — в этом коммуникативный смысл всего раздела.
    glosses:
      encantan: обожать
      dos: оба
      animales: животные
      ninguno: оба
      mascota: питомец
      perros: собаки
      gatos: коты
      gato: кот
      juega: играет
      da: даёт
      todos: каждый
      comer: еда
  es.a1.unit53.lesson05.teach.diego_juega_a:
