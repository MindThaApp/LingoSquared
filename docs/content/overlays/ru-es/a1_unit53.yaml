teaching:
  es.a1.unit53.lesson01.teach.el_animal_la:
    title: Животное, питомец
    gloss: животное / домашнее животное
    note: '*Animal* — общее слово, а *mascota* означает именно домашнего питомца; *mascota* — женского рода, даже если речь о самце.'
    example_gloss:
