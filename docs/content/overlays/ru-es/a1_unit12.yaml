teaching:
  es.a1.unit12.lesson01.teach.nervioso:
    title: Нервный
    gloss: нервный
    note: '*Nervioso* (м. р.) / *nerviosa* (ж. р.) — обычная пара прилагательных на -o/-a.'
    example_gloss:
    - Матео нервничает.
    - Элена нервничает.
  es.a1.unit12.lesson01.teach.contento:
    title: Счастливый
    gloss: счастливый, довольный
    note: '*Contento/contenta* описывает чувство радости или удовлетворения, а не постоянную черту.'
    example_gloss:
    - Матео рад.
    - Элена рада.
  es.a1.unit12.lesson01.teach.cansado:
    title: Усталый
    gloss: усталый
    note: '*Cansado/cansada* — от *cansar* («утомлять»).'
    example_gloss:
    - После мастерской я устал. (говорит мужчина)
    - После мастерской я устала. (говорит женщина)
  es.a1.unit12.lesson01.teach.preocupado:
    title: Обеспокоенный
    gloss: обеспокоенный
    note: '*Preocupado/preocupada* — от *preocupar* («беспокоить»).'
    example_gloss:
    - Матео обеспокоен.
    - Элена обеспокоена.
  es.a1.unit12.lesson01.teach.orgulloso:
    title: Гордый
    gloss: гордый
    note: '*Orgulloso/orgullosa* — *estoy orgulloso/a de...* («я горжусь...»): перед тем, чем гордишься, ставится *de*.'
    example_gloss:
    - Я горжусь тобой. (говорит мужчина)
    - Я горжусь тобой. (говорит женщина)
  es.a1.unit12.lesson02.teach.estoy_nervioso:
    title: Я нервничаю (м. р.)
    gloss: Я нервничаю.
    note: '*Estoy* («я есть», от *estar*) + прилагательное в мужском роде.'
  es.a1.unit12.lesson02.teach.estoy_nerviosa:
    title: Я нервничаю (ж. р.)
    gloss: Я нервничаю.
    note: Та же конструкция с прилагательным в женском роде.
  es.a1.unit12.lesson02.teach.estoy_contento:
    title: Я рад (м. р.)
    gloss: Я рад.
    note: '*Estoy contento* — та же модель *estar* + прилагательное.'
  es.a1.unit12.lesson02.teach.estar_vs_ser_note:
    title: Estar и ser для чувств
    gloss: Почему для чувств обычно используется estar, а не ser.
    note: Смотри текст самой карточки.
    target_text: '*Estar* + прилагательное описывает временное состояние или чувство (estoy nervioso — «я сейчас нервничаю»), в отличие от *ser* + прилагательное, которое выражает постоянное свойство. Для чувств обычно используется *estar*.'
  es.a1.unit12.lesson03.teach.como_te_sientes:
    title: Спросить, как себя чувствует собеседник
    gloss: Как ты себя чувствуешь?
    note: '*¿Cómo te sientes?* — с глаголом *sentirse* («чувствовать себя»), он возвратный и отличается от конструкции *estar* + прилагательное.'
  es.a1.unit12.lesson03.teach.me_siento_nervioso_pero_contento:
    title: Описать смешанное чувство
    gloss: Я немного нервничаю, но рад.
    note: '*Me siento* («я чувствую себя») + прилагательное; *pero* («но») противопоставляет два чувства сразу. Это естественный ответ на *¿Cómo te sientes?*.'
  es.a1.unit12.lesson04.teach.algo_se_quema:
    title: Что-то горит
    gloss: Что-то горит!
    note: '*Se quema* — возвратная форма глагола *quemar* («жечь»), буквально «оно горит само»; так естественно сказать, что что-то горит, не называя виновного.'
  es.a1.unit12.lesson04.teach.estoy_preocupado:
    title: Я волнуюсь (м. р.)
    gloss: Я волнуюсь.
    note: '*Preocupado* в модели *estoy* + прилагательное.'
  es.a1.unit12.lesson04.teach.no_te_preocupes:
    title: Не волнуйся
    gloss: Не волнуйся.
    note: Смотри следующую грамматическую заметку.
  es.a1.unit12.lesson04.teach.podemos_empezar_de_nuevo:
    title: Предложить начать заново
    gloss: Мы можем начать заново.
    note: '*Podemos* («мы можем») + инфинитив; *de nuevo* («снова, заново») — обычное выражение, когда что-то переделывают.'
  es.a1.unit12.lesson04.teach.no_te_preocupes_note:
    title: No te preocupes
    gloss: Модель отрицательного повелительного оборота, на которой построено «не волнуйся».
    note: Смотри текст самой карточки.
    target_text: '*No te preocupes* («не волнуйся») — отрицательный повелительный оборот на «ты»: *no* + возвратное местоимение (*te*) + глагол.'
  es.a1.unit12.lesson05.teach.reflexion_reading:
    title: Размышление о занятии
    gloss: Перед занятием Элена и Матео немного нервничали. Во время занятия что-то сгорело, и оба забеспокоились. Но они начали заново, и в итоге торт получился идеальным. Теперь оба очень горды и рады.
    note: '*Estaban* («они были») описывает, что они чувствовали тогда; *están* («они сейчас») описывает, что они чувствуют теперь.'
    glosses:
      Antes: перед, до
      clase: занятие
      estaban: были (от estar)
      poco: немного
      nerviosos: нервный, взволнованный
      Durante: во время
      algo: что-то
      quemó: сгорел(а) (от quemarse)
      dos: оба / два
      preocupados: обеспокоенный
      Pero: но
      empezaron: начали (от empezar)
      nuevo: снова, заново
      final: конец
      pastel: торт
      salió: получился (от salir)
      perfecto: идеальный
      Ahora: теперь
      están: находятся, являются (от estar)
      orgullosos: гордый
      contentos: довольный
  es.a1.unit12.lesson05.teach.plural_adjective_note:
    title: Согласование прилагательных во множественном числе
    gloss: Почему для смешанной группы прилагательное стоит в мужском роде множественного числа.
    note: Смотри текст самой карточки.
    target_text: Когда речь идёт об Элене и Матео вместе, прилагательные стоят в форме мужского рода множественного числа (nerviosos, preocupados, orgullosos, contentos) — это обычное правило испанского, если в группе есть хотя бы один мужчина.
  es.a1.unit12.lesson06.teach.line01:
    title: Спроси, как себя чувствует Матео
    gloss: Элена спрашивает Матео, как он себя чувствует перед занятием.
    note: '*¿Cómo te sientes?* — так спрашивают, как человек себя чувствует.'
  es.a1.unit12.lesson06.teach.line02:
    title: Ответь, выразив смешанные чувства
    gloss: Матео говорит, что немного нервничает, но доволен.
    note: Матео использует мужские формы *nervioso* и *contento*.
  es.a1.unit12.lesson06.teach.line03:
    title: Отреагируй на неприятность
    gloss: Элена соглашается, а потом замечает, что что-то горит.
    note: '*¡Ay, no!* («ой, нет!») — обычное восклицание при тревоге.'
  es.a1.unit12.lesson06.teach.line04:
    title: Выскажи беспокойство
    gloss: Матео говорит, что беспокоится, и спрашивает, что делать.
    note: '*¿Qué hacemos?* («что нам делать?») — практичный вопрос.'
  es.a1.unit12.lesson06.teach.line05:
    title: Успокой и предложи выход
    gloss: 'Элена просит его не волноваться: они могут начать заново.'
    note: Здесь соединены *no te preocupes* и *podemos empezar de nuevo*.
  es.a1.unit12.lesson06.teach.line06:
    title: Согласись и попробуй ещё раз
    gloss: Матео соглашается и предлагает попробовать ещё раз.
    note: '*Vamos a intentarlo otra vez* («давай попробуем ещё раз») повторяет конструкцию *vamos a* + инфинитив из прошлых уроков, теперь с местоимением-дополнением *lo*.'
  es.a1.unit12.lesson06.teach.line07:
    title: Объяви об успехе
    gloss: Элена объявляет, что торт теперь идеален.
    note: '*¡Mira!* («смотри!») — междометие, привлекающее внимание; *el pastel* («торт») — блюдо, вокруг которого всё и происходит.'
  es.a1.unit12.lesson06.teach.line08:
    title: Порадуйся и скажи, что гордишься
    gloss: Матео радуется и говорит, что гордится ими обоими.
    note: '*¡Qué bien!* («как здорово!») строится по модели восклицания *¡Qué...!*, как *¡Qué calor!*; *de nosotros* («нами») распространяет *estoy orgulloso de ti* на группу.'
  es.a1.unit12.lesson06.teach.line09:
    title: Раздели гордость
    gloss: 'Элена соглашается, что тоже гордится: у них всё получилось вместе.'
    note: '*Lo logramos juntos* («мы добились этого вместе») — естественная заключительная фраза; здесь впервые встречается *lograr* («добиться, суметь»).'
