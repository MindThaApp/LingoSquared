teaching:
  es.a1.unit08.lesson01.teach.banco_farmacia:
    title: Банк, аптека
    gloss: банк, аптека
    note: '*Banco* — мужского рода, *farmacia* — женского.'
    example_gloss:
    - Я иду в банк.
    - Аптека открывается в девять.
  es.a1.unit08.lesson01.teach.parque_restaurante:
    title: Парк, ресторан
    gloss: парк, ресторан
    note: Оба существительных мужского рода.
    example_gloss:
    - Парк очень красивый.
    - Мы едим в ресторане.
  es.a1.unit08.lesson01.teach.biblioteca:
    title: Библиотека
    gloss: библиотека
    note: '*Biblioteca* — женского рода.'
    example_gloss: Я занимаюсь в библиотеке.
  es.a1.unit08.lesson02.teach.cerca_de:
    title: Близко
    gloss: Ресторан находится близко от рынка.
    note: После *cerca* (близко) всегда стоит *de* перед названием места, от которого отсчитывается расстояние.
  es.a1.unit08.lesson02.teach.lejos_de:
    title: Далеко от
    gloss: Парк находится далеко от рынка.
    note: '*Lejos de* (далеко от) — противоположность *cerca de*.'
  es.a1.unit08.lesson02.teach.al_lado_de:
    title: Рядом с
    gloss: Банк находится рядом с рынком.
    note: '*Al lado de* (рядом с) — устойчивое выражение (*al* = *a* + *el lado*). Перед существительным мужского рода, например *mercado*, *de* + *el* сливается в *del*: *al lado del mercado*.'
  es.a1.unit08.lesson02.teach.enfrente_de:
    title: Напротив
    gloss: Аптека находится напротив рынка.
    note: '*Enfrente de* (напротив) описывает два места по разные стороны чего-либо, например улицы.'
  es.a1.unit08.lesson02.teach.entre:
    title: Между
    gloss: Библиотека находится между банком и парком.
    note: После *entre* (между) нужны две точки отсчёта; здесь они соединены союзом *y* (и).
  es.a1.unit08.lesson03.teach.donde_esta_el_banco:
    title: Спрашиваем, где банк
    gloss: Где находится банк?
    note: '*Dónde está* (где находится) — стандартная модель вопроса о местоположении.'
  es.a1.unit08.lesson03.teach.esta_al_lado_del_mercado:
    title: Отвечаем, указывая место
    gloss: Он рядом с рынком.
    note: '*Del* — слияние *de* + *el*; оно обязательно перед *mercado* мужского рода.'
  es.a1.unit08.lesson03.teach.donde_esta_la_farmacia:
    title: Спрашиваем, где аптека
    gloss: Где находится аптека?
    note: 'Та же модель вопроса, но с артиклем женского рода: сам вопрос от рода не меняется.'
  es.a1.unit08.lesson03.teach.esta_enfrente_del_mercado:
    title: 'Ответ: напротив'
    gloss: Она напротив рынка.
    note: '*Enfrente de* + *el mercado* превращается в *enfrente del mercado* — то же слияние в *del*, что и в *al lado del mercado*.'
  es.a1.unit08.lesson04.teach.esta_lejos:
    title: Спрашиваем, далеко ли
    gloss: Это далеко?
    note: 'Короткий уточняющий вопрос: подлежащее опускается, когда оно и так ясно из контекста.'
  es.a1.unit08.lesson04.teach.no_esta_cerca:
    title: 'Ответ: нет, близко'
    gloss: Нет, это близко.
    note: '*Cerca* само по себе (без *de*) подходит как короткий ответ, в отличие от полной конструкции *cerca de* с названием места.'
  es.a1.unit08.lesson04.teach.si_esta_lejos:
    title: 'Ответ: да, довольно далеко'
    gloss: Да, это довольно далеко.
    note: '*Bastante* (довольно, достаточно) усиливает *lejos*, но слабее, чем *muy* (очень).'
  es.a1.unit08.lesson05.teach.barrio_reading:
    title: Читаем о районе
    gloss: В этом районе много полезных мест. Банк находится рядом с рынком. Аптека находится напротив рынка. Парк далеко, но библиотека расположена между банком и парком. Ресторан совсем близко от рынка.
    note: Этот короткий текст собирает вместе все выражения места из этого урока в одном описании района.
    glosses:
      barrio: район
      hay: есть, имеется (от haber)
      muchos: много
      lugares: места
      útiles: полезный
      banco: банк
      está: находится (от estar)
      lado: сторона
      mercado: рынок
      farmacia: аптека
      enfrente: напротив
      parque: парк
      lejos: далеко
      biblioteca: библиотека
      entre: между
      restaurante: ресторан
      cerca: близко
  es.a1.unit08.lesson05.teach.hay_note:
    title: Hay (есть, имеется)
    gloss: Почему hay не меняется в единственном и множественном числе.
    note: Смотри текст самой карточки.
    target_text: '*Hay* (есть, имеется) не меняется в единственном и множественном числе: и *hay un banco*, и *hay muchos lugares* используют одно и то же слово.'
  es.a1.unit08.lesson06.teach.line01:
    title: Спрашиваем, где банк
    gloss: Матео спрашивает Елену, где банк.
    note: Тот же вопрос *¿Dónde está...?*, что и раньше в этом уроке; он начинается с имени Елены, чтобы привлечь её внимание.
  es.a1.unit08.lesson06.teach.line02:
    title: Отвечаем и упоминаем рынок
    gloss: Елена говорит, что он рядом с рынком, где они покупали яйца.
    note: '*Donde compramos los huevos* (где мы покупали яйца) отсылает к их походу за покупками в уроке 7.'
  es.a1.unit08.lesson06.teach.line03:
    title: Спрашиваем об аптеке
    gloss: Матео отвечает «понятно» и спрашивает об аптеке.
    note: '*Ah, sí* (а, да) — естественная короткая реакция перед следующим вопросом.'
  es.a1.unit08.lesson06.teach.line04:
    title: 'Ответ: напротив'
    gloss: Елена говорит, что это напротив рынка.
    note: 'Краткий ответ: подлежащее (*la farmacia*) опускается, потому что оно понятно из вопроса.'
  es.a1.unit08.lesson06.teach.line05:
    title: Спроси о парке
    gloss: Матео спрашивает о парке и о том, близко ли он.
    note: Два вопроса в одной реплике — это естественно для непринуждённой беседы.
  es.a1.unit08.lesson06.teach.line06:
    title: 'Ответ: далеко, а потом про библиотеку'
    gloss: Елена говорит, что парк далеко, но библиотека находится между банком и парком.
    note: '*Pero* (но) противопоставляет удалённость парка более удобному расположению библиотеки.'
  es.a1.unit08.lesson06.teach.line07:
    title: Поблагодари и спроси о ресторане
    gloss: Матео благодарит Елену и спрашивает о ресторане, где они обедали.
    note: '*El restaurante donde comimos* (ресторан, где мы ели) напоминает об их обеде в Уроке 6.'
  es.a1.unit08.lesson06.teach.line08:
    title: Подтверди, что очень близко
    gloss: Елена подтверждает, что это очень близко от рынка.
    note: '*Muy cerca* (очень близко): *muy* (очень) сильнее, чем *bastante* (довольно), как в *bastante lejos* (довольно далеко).'
