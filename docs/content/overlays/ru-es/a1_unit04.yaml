    title: Элена и Матео планируют следующее занятие
teaching:
  es.a1.unit04.lesson01.teach.dias_entre_semana:
    title: Понедельник — пятница
    gloss: понедельник, вторник, среда, четверг, пятница
    note: Названия дней недели по-испански пишутся со строчной буквы, как и в русском; с заглавной — только в начале предложения.
    example_gloss:
    - Кулинарный мастер-класс проходит по вторникам.
    - По четвергам я учу испанский.
  es.a1.unit04.lesson01.teach.fin_de_semana:
    title: Суббота, воскресенье
    gloss: суббота, воскресенье
    note: '*Sábado* и *domingo* — единственные дни недели, которые во множественном числе принимают -s (*los sábados*, *los domingos*). Остальные названия дней одинаковы в единственном и во множественном числе.'
    example_gloss:
    - По субботам я хожу на рынок.
    - По воскресеньям я отдыхаю.
  es.a1.unit04.lesson01.teach.hoy_es_viernes:
    title: Сегодня пятница
    gloss: Сегодня пятница.
    note: '*Hoy* (сегодня) + *es* (есть, является) + название дня прямо сообщает, какой сегодня день. Артикль не нужен.'
  es.a1.unit04.lesson01.teach.el_taller_es_los_martes:
    title: Мастер-класс по вторникам
    gloss: Кулинарный мастер-класс проходит по вторникам.
    note: '*Los martes* (с артиклем множественного числа *los*) значит «по вторникам», то есть регулярное расписание, а не один конкретный вторник.'
  es.a1.unit04.lesson02.teach.meses_primer_semestre:
    title: Январь — июнь
    gloss: январь, февраль, март, апрель, май, июнь
    note: Как и в русском, названия месяцев в испанском пишутся со строчной буквы, если они не стоят в начале предложения. Так же пишутся и дни недели.
    example_gloss:
    - Мой день рождения в марте.
    - В июне жарко.
  es.a1.unit04.lesson02.teach.meses_segundo_semestre:
    title: Июль — декабрь
    gloss: июль, август, сентябрь, октябрь, ноябрь, декабрь
    note: 'Многие названия месяцев в испанском похожи на русские: *septiembre*, octubre, noviembre, diciembre — это сентябрь, октябрь, ноябрь, декабрь.'
    example_gloss:
    - Кулинарный мастер-класс начинается в июле.
    - В декабре я навещаю семью.
  es.a1.unit04.lesson02.teach.mi_cumpleanos_es_en_marzo:
    title: Мой день рождения в марте
    gloss: Мой день рождения в марте.
    note: '*En* (в) используется только с названием месяца, без конкретного числа.'
  es.a1.unit04.lesson03.teach.que_fecha_es_hoy:
    title: Спросить сегодняшнее число
    gloss: Какое сегодня число?
    note: '*Qué fecha* (какая дата) — стандартный способ спросить число по календарю. Не путай с *qué hora* (который час): этот вопрос будет в одном из следующих уроков.'
  es.a1.unit04.lesson03.teach.hoy_es_el_veintidos_de_julio:
    title: Назвать дату
    gloss: Сегодня двадцать второе июля.
    note: '*El veintidós de julio* буквально читается «двадцать два июля». В испанском для даты используется обычное количественное число, а не порядковое, как в русском («двадцать второе»).'
  es.a1.unit04.lesson03.teach.formato_fecha_note:
    title: Формат даты в испанском
    gloss: Как в испанском называют дату по календарю.
    note: Количественное число + de + месяц. Для первого числа часто говорят *el primero* (особенно в Латинской Америке), а также *el uno*, особенно в Испании.
    target_text: 'Дату по-испански называют так: количественное числительное + de + месяц, как в русском «двадцать второе» нужно не порядковое числительное, а число с предлогом: el veintidós de julio буквально читается «двадцать два июля». Для первого числа месяца многие говорят *el primero* (первое), особенно в Латинской Америке; *el uno* тоже распространено, особенно в Испании.'
  es.a1.unit04.lesson03.teach.cuando_es_el_taller:
    title: Спросить, когда мастер-класс
    gloss: Когда мастер-класс?
    note: '*Cuándo* (когда) спрашивает о времени в целом, а *qué fecha* (другой вопрос этого урока) — именно о календарной дате. Здесь уместны оба.'
  es.a1.unit04.lesson03.teach.el_taller_es_el_veintidos_de_julio:
    title: Назвать дату мастер-класса
    gloss: Мастер-класс двадцать второго июля.
    note: Здесь та же модель даты, что в *hoy es el veintidós de julio*, только с другим подлежащим (*el taller*).
  es.a1.unit04.lesson04.teach.cuando_es_tu_cumpleanos:
    title: Спросить о дне рождения
    gloss: Когда у тебя день рождения?
    note: '*Tu cumpleaños* (твой день рождения) — обращение на *tú*, как к другу.'
  es.a1.unit04.lesson04.teach.mi_cumpleanos_es_el_diez_de_marzo:
    title: Назвать свой день рождения
    gloss: Мой день рождения десятого марта.
    note: В отличие от *en marzo* (в марте, только месяц), для полной даты дня рождения нужны *el* и число — как в *el veintidós de julio*.
  es.a1.unit04.lesson04.teach.el_de_mateo_es_el_veintidos_de_agosto:
    title: Назвать день рождения другого человека
    gloss: День рождения Матео двадцать второго августа.
    note: В *El cumpleaños de Mateo* (день рождения Матео) принадлежность выражается через *de* — так же, как в *la familia de Elena*.
  es.a1.unit04.lesson04.teach.felicidades:
    title: Поздравляю!
    gloss: Поздравляю! / С днём рождения!
    note: '*¡Felicidades!* — универсальное слово для поздравления. Его говорят и в день рождения, и по поводу других хороших новостей.'
    example_gloss: Поздравляю, Элена! Сегодня твой день рождения.
  es.a1.unit04.lesson05.teach.horario_reading:
    title: Читаем расписание мастер-класса
    gloss: Кулинарный мастер-класс проходит по вторникам. Следующее занятие — двадцать второго июля. После этого занятие будет двадцать девятого июля. Мастер-класс заканчивается двенадцатого августа.
    note: В этом коротком расписании в одном тексте собраны названия дней недели и модель даты, которые ты уже выучил.
    glosses:
      taller: мастер-класс
      cocina: кулинарный
      martes: по вторникам
      próxima: следующий
      clase: занятие
      veintidós: двадцать два
      julio: июль
      Después: после этого
      hay: есть, будет (от haber)
      veintinueve: двадцать девять
      termina: заканчивается (от terminar)
      doce: двенадцать
      agosto: август
  es.a1.unit04.lesson05.teach.la_proxima_clase:
    title: Следующее занятие
    gloss: следующее занятие
    note: '*Próxima* (следующая) согласуется с существительным женского рода *clase*. Форма мужского рода — *próximo*.'
  es.a1.unit04.lesson05.teach.despues_note:
    title: Después (после)
    gloss: Как *después* связывает события по порядку.
    note: '*Después* = после, потом.'
    target_text: '*Después* («после», «потом») связывает два события по порядку: сначала одно, потом другое.'
  es.a1.unit04.lesson06.teach.line01:
    title: Спросить о следующем занятии
    gloss: Матео спрашивает Элену, когда следующее занятие мастер-класса.
    note: '*La próxima clase del taller* = следующее занятие мастер-класса.'
  es.a1.unit04.lesson06.teach.line02:
    title: Назвать дату
    gloss: 'Элена отвечает: двадцать второго июля, во вторник.'
    note: Элена добавляет после даты *un martes* (во вторник), подтверждая, что занятие проходит в обычный день мастер-класса — вторник.
  es.a1.unit04.lesson06.teach.line03:
    title: Спросить, когда заканчивается мастер-класс
    gloss: Матео спрашивает, когда заканчивается мастер-класс.
    note: '*Perfecto* (отлично) — естественная короткая реакция перед тем, как задать следующий вопрос.'
  es.a1.unit04.lesson06.teach.line04:
    title: Назвать дату окончания
    gloss: Элена говорит, что он заканчивается двенадцатого августа.
    note: Та же дата окончания, что и в печатном расписании.
  es.a1.unit04.lesson06.teach.line05:
    title: Спросить о дне рождения посреди разговора
    gloss: Матео говорит «кстати» и спрашивает, когда у Элены день рождения.
    note: '*Por cierto* (кстати) естественно вводит новую тему в ходе разговора.'
  es.a1.unit04.lesson06.teach.line06:
    title: Назвать дату и задать встречный вопрос
    gloss: 'Элена называет десятое марта и спрашивает: «А твой?»'
    note: В *¿Y el tuyo?* (а твой?) используется притяжательное местоимение *tuyo*. Это короткая форма для встречного вопроса о том, что уже названо (*cumpleaños* мужского рода, поэтому *tuyo*, а не *tuya*).
  es.a1.unit04.lesson06.teach.line07:
    title: Назвать день рождения Матео
    gloss: 'Матео отвечает: двадцать второго августа.'
    note: Короткий полный ответ с той же моделью даты, без повтора «mi cumpleaños es». Так естественно говорят в быстром разговоре.
  es.a1.unit04.lesson06.teach.line08:
    title: Отреагировать и отметить время
    gloss: Элена тепло реагирует, отмечая, что его день рождения будет после окончания мастер-класса.
    note: '*Es después del taller* (это после мастер-класса): 22 августа наступает после окончания мастер-класса 12 августа.'
