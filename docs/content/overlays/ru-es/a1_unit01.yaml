answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Испанский язык A1
  description: Ты выучишь нейтральные общеиспанские приветствия, знакомство и практичный разговор при первой встрече. Особое внимание уделяется испанскому регистру вежливости, согласованию, пропуску подлежащего и глагольным формам.
units:
  es.a1.unit01.greetings:
    title: Приветствия и первые встречи
lessons:
  es.a1.unit01.lesson01.tu_and_usted:
    title: Выбираем между tú и usted
  es.a1.unit01.lesson02.greetings_by_time:
    title: Приветствия и прощания в течение дня
  es.a1.unit01.lesson03.names_and_introductions:
    title: Имена и знакомство
  es.a1.unit01.lesson04.origin_and_language:
    title: Откуда ты, где живёшь и на каком языке говоришь
  es.a1.unit01.lesson05.shared_activity_small_talk:
    title: Разговор во время общего занятия
  es.a1.unit01.lesson06.cooking_workshop_dialogue:
    title: Первая встреча на кулинарном мастер-классе
teaching:
  es.a1.unit01.lesson01.teach.usted:
    title: Вежливое «вы»
    gloss: вы (вежливое обращение)
    note: В русском языке тоже есть выбор между «ты» и «вы», и в испанском он так же важен. Usted уместно с незнакомым взрослым или когда нужен уважительный тон. Хотя usted переводится как «вы», глагол при нём имеет ту же форму, что и при él или ella (3-е лицо единственного числа).
  es.a1.unit01.lesson01.teach.tu:
    title: Неформальное «ты»
    gloss: ты
    note: Tú используется при обращении к одному другу, ровеснику, ребёнку или другому человеку, если общение неформальное. Ударение на письме отличает местоимение tú от притяжательного tu — «твой».
  es.a1.unit01.lesson01.teach.como_esta_usted:
    title: Вежливый вопрос о самочувствии
    gloss: Как вы поживаете?
    note: Está — форма глагола estar для usted. Для текущего состояния человека испанский использует estar. Cómo пишется с акцентом, потому что это вопросительное слово.
  es.a1.unit01.lesson01.teach.como_estas:
    title: Неформальный вопрос о самочувствии
    gloss: Как дела?
    note: 'Estás — форма глагола estar для tú. Как и в русском («как вы поживаете» — «как ты поживаешь»), глагол меняется в зависимости от того, к кому обращаются: está для usted, estás для tú.'
  es.a1.unit01.lesson01.teach.bien_gracias:
    title: Краткий ответ
    gloss: Хорошо, спасибо.
    note: Как и в русском, в испанском можно ответить просто bien, не повторяя подлежащее и глагол.
  es.a1.unit01.lesson01.teach.muy_bien:
    title: Положительный ответ
    gloss: Очень хорошо, спасибо.
    note: Muy усиливает bien и не изменяется.
  es.a1.unit01.lesson01.teach.and_usted:
    title: Возвращаем вежливый вопрос
    gloss: А вы?
    note: Сохраняй usted, когда возвращаешь вопрос в вежливой форме.
  es.a1.unit01.lesson01.teach.and_tu:
    title: Возвращаем неформальный вопрос
    gloss: А ты?
    note: 'Используй tú, когда общение неформальное. Ударение на письме важно: tu без ударения означает «твой».'
  es.a1.unit01.lesson02.teach.hola:
    title: Универсальное приветствие
    gloss: привет; здравствуйте
    note: Hola подходит в любое время суток и в формальном, и в неформальном общении.
  es.a1.unit01.lesson02.teach.buenos_dias:
    title: Утреннее приветствие
    gloss: доброе утро
    note: В испанском, как и в русском, у существительных есть грамматический род. Días — мужской род во множественном числе, поэтому прилагательное имеет форму buenos.
  es.a1.unit01.lesson02.teach.buenas_tardes:
    title: Приветствие днём
    gloss: добрый день
    note: Tardes — женский род во множественном числе, поэтому buenas согласуется с ним. Смена buenos на buenas — это грамматическое согласование, а не изменение степени вежливости.
  es.a1.unit01.lesson02.teach.buenas_noches:
    title: Приветствие вечером или ночью
    gloss: добрый вечер; спокойной ночи
    note: Noches — женский род во множественном числе, поэтому употребляется buenas. Фраза может быть приветствием ночью или пожеланием перед сном.
  es.a1.unit01.lesson02.teach.adios:
    title: Прямое прощание
    gloss: до свидания; прощай
    note: Adiós нейтрально, но может звучать более окончательно, чем выражения вроде «до скорого».
  es.a1.unit01.lesson02.teach.hasta_luego:
    title: До скорой встречи
    gloss: до скорого
    note: Hasta luego — устоявшееся прощание, его не нужно понимать дословно.
  es.a1.unit01.lesson02.teach.nos_vemos:
    title: Дружеское прощание
    gloss: увидимся
    note: Буквально nos vemos ближе к «мы видим друг друга».
  es.a1.unit01.lesson02.teach.good_day:
    title: Вежливое прощальное пожелание
    gloss: Хорошего вам дня.
    note: Tenga — форма для usted, используемая в этом вежливом пожелании. Buen — сокращённая форма мужского рода единственного числа от bueno перед día.
  es.a1.unit01.lesson03.teach.formal_name_question:
    title: Спрашиваем имя вежливо
    gloss: Как вас зовут?
    note: Испанский выражает это примерно как «как вы себя называете». Se сочетается с llama — формой для usted. Как и в русском («как тебя зовут» — «как вас зовут»), форма меняется в зависимости от вежливости.
  es.a1.unit01.lesson03.teach.my_name_lucia:
    title: Называем своё имя
    gloss: Меня зовут Лусия.
    note: Me llamo буквально означает «я называю себя». Окончание глагола уже указывает на говорящего, поэтому yo здесь обычно опускается.
  es.a1.unit01.lesson03.teach.informal_name_question:
    title: Спрашиваем имя неформально
    gloss: Как тебя зовут?
    note: 'Te используется с неформальным tú, а llamas имеет окончание -as, характерное для tú. Сравни: формальное se llama и неформальное te llamas.'
  es.a1.unit01.lesson03.teach.i_am_diego:
    title: Представляемся с ser
    gloss: Я Диего.
    note: Soy — форма 1-го лица единственного числа от ser. Для обозначения личности испанский использует ser. Состояния же распределяются между ser и estar, и их нужно различать.
  es.a1.unit01.lesson03.teach.mucho_gusto:
    title: Радость от знакомства
    gloss: Очень приятно.
    note: Mucho gusto — устойчивое, всем понятное выражение. В отличие от прилагательных encantado и encantada, оно не меняется в зависимости от пола говорящего.
  es.a1.unit01.lesson03.teach.igualmente:
    title: Отвечаем взаимностью
    gloss: Мне тоже.
    note: Igualmente — краткий ответ на Mucho gusto.
  es.a1.unit01.lesson03.teach.este_carlos:
    title: Представляем мужчину
    gloss: Это Карлос.
    note: Как и русское «этот / эта», испанское указательное слово имеет род. Este используется, когда человек или предмет, на которого указывают, грамматически мужского рода.
  es.a1.unit01.lesson03.teach.esta_ana:
    title: Представляем женщину
    gloss: Это Ана.
    note: Esta используется для женского рода. Здесь у esta нет ударения; está с ударением — форма глагола estar, означает «находится» или «есть».
  es.a1.unit01.lesson04.teach.formal_origin_question:
    title: Спрашиваем о происхождении вежливо
    gloss: Откуда вы?
    note: Es — форма ser для usted. Для происхождения испанский использует ser, а не estar. В прямом вопросе у dónde ставится ударение.
  es.a1.unit01.lesson04.teach.from_mexico:
    title: Говорим о своём происхождении
    gloss: Я из Мексики.
    note: Soy — форма ser для yo. Подлежащее yo не нужно, потому что soy уже указывает на говорящего.
  es.a1.unit01.lesson04.teach.informal_origin_question:
    title: Спрашиваем о происхождении неформально
    gloss: Откуда ты?
    note: 'Eres — форма ser для tú. Сравни: формальное es для usted и неформальное eres.'
  es.a1.unit01.lesson04.teach.from_colombia:
    title: Ещё одно высказывание о происхождении
    gloss: Я из Колумбии.
    note: Чтобы сказать, откуда ты, используй soy de и название места.
  es.a1.unit01.lesson04.teach.live_london:
    title: Говорим, где живёшь
    gloss: Я живу в Лондоне.
    note: Vivo — форма vivir для yo. Как и в русском, yo не нужно, потому что окончание -o указывает на говорящего.
  es.a1.unit01.lesson04.teach.speak_spanish:
    title: Спрашиваем о знании испанского вежливо
    gloss: Вы говорите по-испански?
    note: 'Такой вопрос с ответом «да» или «нет» строится без вспомогательных слов: как и в русском, его отличает интонация. Habla — форма для usted; вопрос обозначают интонация и знаки вопроса.'
  es.a1.unit01.lesson04.teach.yes_a_little:
    title: Ограниченное владение
    gloss: Да, немного.
    note: Sí с ударением означает «да». Si без ударения означает «если», хотя вариант без ударения здесь допускается как допустимая опечатка на уровне A1.
  es.a1.unit01.lesson04.teach.still_learning:
    title: Описываем продолжающуюся ситуацию
    gloss: Я всё ещё учусь.
    note: Estoy — форма estar для yo. Здесь estar передаёт действие в процессе, тогда как soy в Soy de Colombia выражает происхождение или принадлежность. Это два разных глагола, их нужно различать.
  es.a1.unit01.lesson05.teach.formal_first_time:
    title: Вежливо спрашиваем о первом визите
    gloss: Вы здесь впервые?
    note: Su означает «ваш» при обращении на usted. Как и в русском («твой» — «ваш»), выбор su или tu сохраняет формальность или неформальность общения.
  es.a1.unit01.lesson05.teach.informal_first_time:
    title: Неформально спрашиваем о первом визите
    gloss: Ты здесь впервые?
    note: Tu без ударения — неформальное притяжательное «твой». Сравни с местоимением tú, которое пишется с ударением.
  es.a1.unit01.lesson05.teach.first_time_answer:
    title: Подтверждаем, что это первый визит
    gloss: Да, я здесь впервые.
    note: Primera женского рода, потому что согласуется с vez. Как и в русском, прилагательное в испанском меняется по роду существительного.
  es.a1.unit01.lesson05.teach.cooking_workshop:
    title: Называем, куда идёшь
    gloss: Я пришёл на кулинарный мастер-класс.
    note: Vengo — форма venir для yo, «я прихожу» или «я иду». Al — обязательное слияние предлога a и артикля el.
  es.a1.unit01.lesson05.teach.me_too:
    title: У нас одна и та же ситуация
    gloss: Я тоже.
    note: Yo también уместно, когда сказанное собеседником относится и к тебе.
  es.a1.unit01.lesson05.teach.like_cooking:
    title: Спрашиваем об интересах
    gloss: Ты любишь готовить?
    note: 'В конструкции с gustar порядок слов не совпадает с русским «ты любишь готовить»: te указывает на того, кому нравится, а cocinar — то, что нравится. Глагол остаётся в форме gusta, потому что действие считается единственным числом.'
  es.a1.unit01.lesson05.teach.yes_very_much:
    title: Выразить сильный интерес
    gloss: Да, очень.
    note: Mucho отвечает на вопрос о степени и здесь не изменяется.
  es.a1.unit01.lesson05.teach.thats_good:
    title: Положительная реакция
    gloss: Здорово!
    note: В этом восклицании Qué пишется с ударением. Оно вводит положительную реакцию, а не задаёт вопрос.
  es.a1.unit01.lesson06.teach.line01:
    title: Начало встречи
    gloss: Елена здоровается с Матео и спрашивает, впервые ли он здесь.
    note: Оба собеседника говорят друг другу «ты» (форма tú), потому что они равные участники одного занятия.
  es.a1.unit01.lesson06.teach.line02:
    title: Начало встречи, ответ
    gloss: Матео отвечает, что да, он здесь впервые, и объясняет, что пришёл на кулинарный мастер-класс.
    note: Vengo al taller называет причину, по которой человек здесь; используется настоящее время для текущей ситуации.
  es.a1.unit01.lesson06.teach.line03:
    title: Обмен именами
    gloss: Елена говорит, что она тоже здесь впервые, называет своё имя и спрашивает имя Матео.
    note: 'Me llamo — естественный способ назвать своё имя. Как и в русском, местоимение yo обычно опускается: форма глагола уже показывает, кто говорит.'
  es.a1.unit01.lesson06.teach.line04:
    title: Обмен именами, ответ
    gloss: Матео называет своё имя и говорит, что рад знакомству.
    note: 'Soy — ещё один естественный способ назвать себя: здесь используется глагол ser вместо возвратного llamarse.'
  es.a1.unit01.lesson06.teach.line05:
    title: Вопрос о происхождении
    gloss: Елена отвечает любезностью («Взаимно») и спрашивает, откуда Матео.
    note: De dónde eres — вопрос о происхождении в неформальной форме на «ты».
  es.a1.unit01.lesson06.teach.line06:
    title: Вопрос о происхождении, ответ
    gloss: Матео родом из Колумбии, но живёт в Лондоне; затем он задаёт Елене тот же вопрос.
    note: Soy de выражает происхождение, а vivo en — нынешнее место жительства. Pero связывает эти два факта, противопоставляя их.
  es.a1.unit01.lesson06.teach.line07:
    title: Обсуждение интересов
    gloss: Елена говорит, что она из Испании, и спрашивает, любит ли Матео готовить.
    note: Soy указывает на происхождение — та же модель, что только что использовал Матео.
  es.a1.unit01.lesson06.teach.line08:
    title: Обсуждение интересов, ответ
    gloss: Матео говорит, что очень любит готовить, но всё ещё учится.
    note: 'Estoy aprendiendo описывает действие, которое происходит прямо сейчас. В русском для этого достаточно обычного настоящего времени: «я учусь».'
  es.a1.unit01.lesson06.teach.line09:
    title: Завершение разговора
    gloss: Елена говорит, что тоже учится, и добавляет, что они увидятся внутри.
    note: Nos vemos указывает на предстоящую встречу, а dentro уточняет, где именно.
  es.a1.unit01.lesson06.teach.line10:
    title: Завершение разговора, ответ
    gloss: Матео соглашается и подтверждает, что они увидятся.
    note: Sí просто подтверждает предложение Елены, после чего повторяется nos vemos.
exercises:
  es.a1.unit01.lesson01.exercise01.select_formal_pronoun:
    instruction: Какая форма «вы» используется для вежливого, официального обращения?
    correct_option: usted
    distractors:
    - tú
    - tu
    accepted_answers:
    - usted
    feedback: Usted — вежливая форма единственного числа; глагол при ней стоит в форме третьего лица.
  es.a1.unit01.lesson01.exercise02.select_informal_pronoun:
    instruction: Какая форма используется для неформального обращения к одному другу или равному?
    correct_option: tú
    distractors:
    - usted
    - tu
    accepted_answers:
    - tú
    feedback: Местоимение пишется tú; без ударения tu означает «твой».
  es.a1.unit01.lesson01.exercise03.listen_formal_question:
    instruction: Послушай и выбери предложение, которое ты слышишь.
    correct_option: ¿Cómo está usted?
    distractors:
    - ¿Cómo estás?
    - ¿Y usted?
    accepted_answers:
    - ¿Cómo está usted?
    - Como esta usted
  es.a1.unit01.lesson01.exercise04.listen_informal_question:
    instruction: Напиши услышанный неформальный вопрос.
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
  es.a1.unit01.lesson01.exercise05.order_formal_question:
    instruction: Расставь слова официального вопроса по порядку.
    correct_response:
    - Cómo
    - está
    - usted
  es.a1.unit01.lesson01.exercise06_choose_formal_return:
    instruction: Выбери ответный вопрос, сохраняющий вежливую форму.
    correct_option: ¿Y usted?
    distractors:
    - ¿Y tú?
    - ¿Cómo estás?
    accepted_answers:
    - ¿Y usted?
    - Y usted
  es.a1.unit01.lesson01.exercise07_choose_informal_return:
    instruction: Выбери ответный вопрос для друга или равного.
    correct_option: ¿Y tú?
    distractors:
    - ¿Y usted?
    - ¿Cómo está usted?
    accepted_answers:
    - ¿Y tú?
    - Y tú
    - Y tu
  es.a1.unit01.lesson01.exercise08.check_informal_agreement:
    instruction: Исправь неформальный вопрос.
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
    - ¿Cómo estás tú?
    - Como estas tu
    feedback: С tú нужна форма estás; está используется с usted.
  es.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: Вежливо ответь на вопрос.
    accepted_answers:
    - Bien, gracias.
    - Bien, gracias
    - Muy bien, gracias.
    - Muy bien, gracias
    - Bien, gracias. ¿Y usted?
    - Muy bien, gracias. ¿Y usted?
  es.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: Ответь неформально, поблагодари собеседника и задай вопрос в ответ.
    accepted_answers:
    - Muy bien, gracias. ¿Y tú?
    - Muy bien, gracias. Y tú?
    - Muy bien, gracias. Y tu?
    - Muy bien, gracias, ¿y tú?
    - Bien, gracias. ¿Y tú?
