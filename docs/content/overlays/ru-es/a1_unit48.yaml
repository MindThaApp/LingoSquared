teaching:
  es.a1.unit48.lesson01.teach.leer_hacer_deporte:
    title: Чтение, спорт, готовка
    gloss: читать, заниматься спортом, готовить
    note: 'Три распространённых глагола для хобби: *leer* (читать), *hacer deporte* (заниматься спортом) и *cocinar* (готовить).'
    example_gloss:
    - Мне нравится читать книгу.
    - По субботам я занимаюсь спортом.
    - Мне нравится готовить для друзей.
  es.a1.unit48.lesson01.teach.el_tiempo_libre:
    title: Свободное время
    gloss: свободное время
    note: '*El tiempo libre* — словосочетание мужского рода и ключевая фраза, когда говоришь о хобби.'
    example_gloss: В свободное время я люблю читать.
  es.a1.unit48.lesson01.teach.en_mi_tiempo:
    title: Как сказать, чем занимаешься в свободное время
    gloss: В свободное время я люблю читать.
    note: '*Me gusta leer* («мне нравится читать») — это *gustar* + инфинитив; форма *me gusta* остаётся той же для любого занятия.'
  es.a1.unit48.lesson02.teach.escuchar_musica_dibujar:
    title: Музыка, рисование, видеоигры
    gloss: слушать музыку, рисовать, играть в видеоигры
    note: 'Ещё три глагола для хобби: *escuchar música* (слушать музыку), *dibujar* (рисовать) и *jugar videojuegos* (играть в видеоигры).'
    example_gloss:
    - Я люблю слушать музыку.
    - Я часто рисую.
    - Я люблю играть в видеоигры с друзьями.
  es.a1.unit48.lesson02.teach.me_gusta_escuchar:
    title: Говорим, что любим слушать музыку
    gloss: Я люблю слушать музыку.
    note: 'Глагол *escuchar* сочетается с дополнением напрямую, без предлога: *escuchar música*. В русском есть «слушать музыку» тоже без предлога, так что здесь всё просто.'
  es.a1.unit48.lesson02.teach.me_gusta_jugar:
    title: Говорим, что любим играть в видеоигры с друзьями
    gloss: Я люблю играть в видеоигры с друзьями.
    note: В выражении *Con amigos* (с друзьями) снова используется предлог *con* из предыдущих уроков.
  es.a1.unit48.lesson03.teach.siempre_a_menudo:
    title: Всегда, часто, иногда, никогда
    gloss: всегда, часто, иногда, никогда
    note: 'Четыре основных наречия частоты: *siempre* (всегда), *a menudo* (часто), *a veces* (иногда), *nunca* (никогда). Обычно они стоят перед глаголом или в начале предложения.'
    example_gloss:
    - Я всегда занимаюсь спортом по субботам.
    - Я часто читаю книгу.
    - Иногда я рисую.
    - Я никогда не играю в видеоигры.
  es.a1.unit48.lesson03.teach.cada_semana_cada:
    title: Каждую неделю, каждые выходные
    gloss: каждую неделю, каждые выходные
    note: '*Cada semana* и *cada fin de semana* означают «каждую/каждые»; слово *cada* никогда не меняет форму.'
    example_gloss:
    - Я каждую неделю готовлю для друзей.
    - Я занимаюсь спортом каждые выходные.
  es.a1.unit48.lesson03.teach.con_palabras_femeninas:
    title: Cada не меняется
    gloss: 'Cada не меняется: cada semana, cada fin de semana.'
    note: '*Cada* не меняется: оно одинаково стоит и перед существительными женского рода (*semana*), и перед существительными мужского рода (*fin de semana*). В русском слово «каждый» меняется по родам, а в испанском — нет.'
  es.a1.unit48.lesson03.teach.que_haces_en:
    title: Спрашиваем о свободном времени
    gloss: Чем ты занимаешься в свободное время?
    note: Это главный вопрос этого раздела — с ним можно спросить любого человека о его увлечениях.
  es.a1.unit48.lesson04.teach.elena_a_menudo:
    title: Элена заговаривает об увлечениях
    gloss: 'Элена: Мы часто гуляем вместе. А чем ещё ты занимаешься в свободное время, Матео?'
    note: '*A menudo paseamos juntos* (мы часто гуляем вместе): *paseamos* — форма *nosotros* глагола *pasear*.'
  es.a1.unit48.lesson04.teach.mateo_me_gusta:
    title: Увлечения Матео
    gloss: 'Матео: Я люблю готовить, в том числе дома. И часто занимаюсь спортом.'
    note: '*También en casa* (и дома тоже) показывает, что Матео готовит не только на работе в ресторане, но и для удовольствия.'
  es.a1.unit48.lesson04.teach.elena_cocinas_tambien:
    title: Элена удивлена
    gloss: 'Элена: Ты и дома готовишь? Ты же и так целый день готовишь на работе!'
    note: '*Todo el día* (целый день) подчёркивает, как много Матео уже готовит на работе.'
  es.a1.unit48.lesson04.teach.mateo_si_pero:
    title: Матео объясняет
    gloss: 'Матео: Да, но готовить для меня расслабляюще. А ты что любишь делать?'
    note: '*Cocinar me parece relajante* буквально значит «готовить мне кажется расслабляющим»: *me parece* + прилагательное — естественный способ выразить мнение.'
  es.a1.unit48.lesson04.teach.elena_me_gusta:
    title: Увлечения Элены
    gloss: 'Элена: Я люблю читать и часто слушаю музыку.'
    note: В одном предложении соединены два глагола об увлечениях из прежних уроков с помощью *y* (и).
  es.a1.unit48.lesson04.teach.mateo_tu_tambien:
    title: Матео спрашивает про видеоигры
    gloss: 'Матео: Ты тоже играешь в видеоигры?'
    note: Короткий вопрос с ответом «да/нет» со словосочетанием *jugar videojuegos* из урока 2; в *tú también* (ты тоже) используется неформальное *tú*.
  es.a1.unit48.lesson04.teach.elena_no_nunca:
    title: Ответ Элены
    gloss: 'Элена: Нет, я никогда не играю в видеоигры. Но иногда рисую!'
    note: '*Nunca* (никогда) и *a veces* (иногда) из урока 3 противопоставлены в одном ответе.'
  es.a1.unit48.lesson05.teach.mateo_y_yo:
    title: Сравниваем увлечения
    gloss: Мы с Матео часто гуляем вместе. Но у нас есть и другие увлечения. Матео любит готовить, в том числе дома, и часто занимается спортом. Я люблю читать и часто слушаю музыку. Иногда я рисую, но никогда не играю в видеоигры. А что ты любишь делать в свободное время?
    note: Сообщение Элены подводит итог тому, что было в уроке 4, и заканчивается главным вопросом раздела, обращённым к читателю.
    glosses:
      paseamos: гуляем
      menudo: часто
      juntos: вместе
      otras: другие
      cocinar: готовит
      gusta: нравится
      casa: дома
      deporte: занимается спортом
      leer: читать
      escucho: слушаю
      música: музыка
      dibujo: рисую
      veces: иногда
      videojuegos: играть в видеоигры
      nunca: никогда
      libre: свободное
      tiempo: время
  es.a1.unit48.lesson06.teach.mateo_que_haces:
    title: Матео спрашивает о выходных
    gloss: 'Матео: Что ты делаешь в эти выходные?'
    note: В *Este fin de semana* (в эти выходные) *este* стоит перед существительным мужского рода *fin de semana*.
  es.a1.unit48.lesson06.teach.elena_todavia_no:
    title: Элена ещё не решила
    gloss: 'Элена: Пока не знаю. Я люблю читать, но ещё хочу куда-нибудь выйти.'
    note: '*Quiero salir* (хочу выйти) — распространённый способ сказать, что хочется выйти из дома.'
  es.a1.unit48.lesson06.teach.mateo_paseamos_juntos:
    title: Матео предлагает план
    gloss: 'Матео: Погуляем вместе? Потом я приготовлю для нас.'
    note: '*Después* (потом) — слово для последовательности действий: *primero*, *luego*, *después*.'
  es.a1.unit48.lesson06.teach.elena_buena_idea:
    title: Элена соглашается
    gloss: 'Элена: Отличная идея! Мне нравится и то и другое: гулять и готовить.'
    note: '*Las dos cosas* (и то и другое) показывает, что Элене нравятся обе вещи одинаково.'
  es.a1.unit48.lesson06.teach.mateo_perfecto_entonces:
    title: Матео подтверждает
    gloss: 'Матео: Отлично! Тогда увидимся в субботу!'
    note: Дружеская фраза, подтверждающая план на *el sábado* (субботу); перед конкретным днём недели в испанском ставится артикль *el*, а в русском для этого используется предлог «в».
