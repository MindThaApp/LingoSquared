teaching:
  es.a1.unit06.lesson01.teach.sandwich_ensalada:
    title: Сэндвич, салат
    gloss: сэндвич, салат
    note: 'Оба слова заимствованы или адаптированы: *sándwich* — прямое заимствование из английского, пишется с акцентом, который показывает ударный слог.'
    example_gloss:
    - Я хочу сэндвич.
    - В салате есть помидор.
  es.a1.unit06.lesson01.teach.sopa:
    title: Суп
    gloss: суп
    note: '*Sopa* — существительное женского рода, как и большинство испанских существительных на -a.'
    example_gloss: Суп очень вкусный.
  es.a1.unit06.lesson01.teach.agua_cafe:
    title: Вода, кофе
    gloss: вода, кофе
    note: '*Agua* — слово женского рода, но в единственном числе оно употребляется с мужским артиклем *el* (а не *la*), потому что начинается с ударного звука *a*. Это настоящая особенность испанского, а не опечатка.'
    example_gloss:
    - Я хочу воды, пожалуйста.
    - Мне кофе.
  es.a1.unit06.lesson02.teach.quiero_un_sandwich:
    title: Я хочу сэндвич
    gloss: Я хочу сэндвич.
    note: '*Quiero* («я хочу») — форма 1-го лица глагола *querer*, нового глагола в этом уроке.'
  es.a1.unit06.lesson02.teach.para_mi_un_cafe:
    title: Мне кофе
    gloss: Мне кофе.
    note: '*Para mí* («мне», «для меня») — ещё одна распространённая фраза для заказа: она называет блюдо без повторения глагола. См. следующую заметку по грамматике.'
  es.a1.unit06.lesson02.teach.que_quieres_comer:
    title: Спрашиваем, что человек хочет поесть
    gloss: Что ты хочешь поесть?
    note: '*Quieres* — форма *tú* глагола *querer*, неформальное обращение к друзьям.'
  es.a1.unit06.lesson02.teach.quiero_vs_para_mi_note:
    title: Quiero или Para mí
    gloss: Два одинаково естественных способа сделать заказ.
    note: '*Quiero un café* и *Para mí, un café* одинаково подходят для заказа.'
    target_text: '*Quiero* («я хочу») и *Para mí* («для меня», говорится перед названием блюда) — оба варианта естественны и одинаково вежливы при заказе в неформальной обстановке; ни один не правильнее другого.'
  es.a1.unit06.lesson03.teach.el_menu:
    title: Меню
    gloss: меню
    note: В слове *menú* пишется акцент, потому что ударение падает на последний слог.
    example_gloss: Можно посмотреть меню?
  es.a1.unit06.lesson03.teach.podemos_ver_el_menu:
    title: Просим меню
    gloss: Можно посмотреть меню?
    note: '*Podemos* («мы можем») — форма 1-го лица множественного числа глагола *poder*, нового глагола в этом уроке.'
  es.a1.unit06.lesson03.teach.aqui_tiene:
    title: Вот, пожалуйста
    gloss: Вот, пожалуйста.
    note: '*Aquí tiene* — стандартная фраза официанта, когда он подаёт что-то клиенту. Здесь используется вежливая форма глагола для *usted*, даже если разговор в целом неформальный: это устойчивая фраза вежливости, а не смена регистра.'
  es.a1.unit06.lesson03.teach.buen_provecho:
    title: Приятного аппетита
    gloss: Приятного аппетита
    note: '*Buen provecho* — стандартное пожелание перед тем, как человек начинает есть; по смыслу это то же, что русское «приятного аппетита».'
    example_gloss: Вот, пожалуйста. Приятного аппетита.
  es.a1.unit06.lesson04.teach.el_postre:
    title: Десерт
    gloss: десерт
    note: '*Postre* — слово мужского рода.'
    example_gloss: На десерт я хочу торт.
  es.a1.unit06.lesson04.teach.de_postre_quiero_pastel:
    title: Заказываем десерт
    gloss: На десерт я хочу торт.
    note: '*De postre* (на десерт) вводит то, что заказывают последним блюдом, по той же схеме, что и *para mí*, с которого начинают заказ основного блюда.'
  es.a1.unit06.lesson04.teach.la_cuenta_por_favor:
    title: Просим счёт
    gloss: Счёт, пожалуйста.
    note: '*La cuenta* (счёт) — стандартная фраза, чтобы попросить счёт в конце трапезы.'
  es.a1.unit06.lesson05.teach.menu_reading:
    title: Читаем меню
    gloss: 'Меню: сэндвич — пять. Салат — восемь. Суп — три. Кофе или вода — включено. Десерт: торт.'
    note: 'Реалистичный формат печатного меню: слова этого урока и рядом цены.'
    glosses:
      Menú: меню
      sándwich: сэндвич
      Ensalada: салат
      Sopa: суп
      Café: кофе
      agua: вода
      incluido: включено
      Postre: десерт
      pastel: торт
  es.a1.unit06.lesson05.teach.incluido_note:
    title: Incluido (включено)
    gloss: Что значит, когда у напитка стоит пометка «включено».
    note: '*Incluido* = включено, без доплаты.'
    target_text: '*Incluido* («включено») означает, что напиток подаётся к обеду бесплатно, без доплаты.'
  es.a1.unit06.lesson06.teach.line01:
    title: Приветствие и вопрос о заказе
    gloss: Официант здоровается с Еленой и Матео и спрашивает, что они хотят поесть.
    note: '*Buenas tardes* (добрый день) говорят после полудня, так что это приветствие подходит для обеда.'
  es.a1.unit06.lesson06.teach.line02:
    title: Елена делает заказ
    gloss: Елена заказывает салат и воду, пожалуйста.
    note: '*Una ensalada y agua* = салат и вода.'
  es.a1.unit06.lesson06.teach.line03:
    title: Матео делает заказ
    gloss: Матео заказывает для себя сэндвич и кофе.
    note: Здесь используется *Para mí* вместо повторения *Quiero*.
  es.a1.unit06.lesson06.teach.line04:
    title: Вопрос о десерте
    gloss: Официант одобряет заказ и спрашивает, не хотят ли они десерт.
    note: '*¿Algo de postre?* (что-нибудь на десерт?) — естественный и короткий способ предложить десерт.'
  es.a1.unit06.lesson06.teach.line05:
    title: Заказываем один десерт на двоих
    gloss: 'Елена соглашается: один торт на них двоих.'
    note: '*Para los dos* (на двоих) — один десерт на двоих, вполне обычный выбор в жизни.'
  es.a1.unit06.lesson06.teach.line06:
    title: Соглашаемся и просим счёт
    gloss: Матео соглашается и просит счёт.
    note: '*La cuenta, por favor* = счёт, пожалуйста.'
  es.a1.unit06.lesson06.teach.line07:
    title: Официант приносит счёт
    gloss: Официант подаёт им счёт.
    note: '*Aquí tiene* говорят, когда что-то передают собеседнику.'
  es.a1.unit06.lesson06.teach.line08:
    title: Тепло прощаемся
    gloss: Елена благодарит официанта и говорит, какая была вкусная еда.
    note: '*¡Qué buena comida!* строится по той же модели восклицания *¡Qué ...!*, что и *¡Qué bien!* и *¡Qué bonito!*.'
