teaching:
  es.a1.unit51.lesson01.teach.el_billete:
    title: Билет
    gloss: билет
    note: '*El billete* — мужского рода, поэтому говорят *un billete*, а не *una*.'
    example_gloss: Мне бы хотелось билет до Толедо.
  es.a1.unit51.lesson01.teach.quisiera_un_billete:
    title: Просьба о билете
    gloss: Мне бы хотелось билет до Толедо.
    note: '*Quisiera* («я бы хотел») смягчает просьбу и звучит вежливее, чем *quiero*.'
  es.a1.unit51.lesson01.teach.quiere_un_billete:
    title: Кассир уточняет, какой нужен билет
    gloss: Вам билет в один конец или туда и обратно?
    note: '*Quiere* — вежливая форма *usted* глагола *querer*; здесь она используется при обращении к незнакомому сотруднику вокзала.'
  es.a1.unit51.lesson01.teach.ida_y_vuelta:
    title: Вежливый ответ
    gloss: Туда и обратно, пожалуйста.
    note: '*Por favor* означает «пожалуйста»; просьба остаётся вежливой и короткой.'
  es.a1.unit51.lesson01.teach.en_la_taquilla:
    title: Форма обращения у кассы
    gloss: У кассы обычно обращаются на «вы».
    note: К незнакомым людям, работающим в сфере обслуживания, обращаются на *usted*, а не на *tú*.
  es.a1.unit51.lesson02.teach.el_anden:
    title: Платформа
    gloss: платформа
    note: '*El andén* — существительное мужского рода: *un andén*, *el andén*.'
    example_gloss: С какой платформы отправляется поезд в Толедо?
  es.a1.unit51.lesson02.teach.de_que_anden:
    title: Вопрос о платформе
    gloss: С какой платформы отправляется поезд в Толедо?
    note: '*¿De qué andén ...?* спрашивает именно о платформе, а не о месте вообще.'
  es.a1.unit51.lesson02.teach.el_tren_sale:
    title: Сообщаем данные об отправлении
    gloss: Поезд отправляется без четверти десять с платформы пять.
    note: '*Las diez menos cuarto* использует ту же модель «без четверти», что и в уроке о времени.'
  es.a1.unit51.lesson02.teach.a_que_hora:
    title: Вопрос о времени прибытия
    gloss: Во сколько прибывает поезд?
    note: '*¿A qué hora llega ...?* спрашивает о времени прибытия; глагол *llegar* правильный, а перед временем ставится *a las*.'
  es.a1.unit51.lesson02.teach.el_tren_llega:
    title: Сообщаем время прибытия
    gloss: Поезд прибывает в одиннадцать часов.
    note: В *Llega a las once* глагол *llegar* (прибывать) стоит с *a las* перед временем.
  es.a1.unit51.lesson03.teach.a_tiempo_el:
    title: Вовремя / задержка
    gloss: вовремя; задержка
    note: '*A tiempo* — устойчивое выражение: что-то происходит по расписанию. *El retraso* (задержка) — мужского рода.'
    example_gloss:
    - Поезд отправляется не вовремя.
    - 'Внимание: поезд в Толедо задерживается.'
  es.a1.unit51.lesson03.teach.atencion_el_tren:
    title: Объявление
    gloss: 'Внимание: поезд в Толедо задерживается.'
    note: '*Atención* открывает объявление на вокзале, как русское «Внимание, уважаемые пассажиры».'
  es.a1.unit51.lesson03.teach.el_tren_no:
    title: 'Отрицание: не вовремя'
    gloss: Поезд отправляется не вовремя.
    note: '*No* стоит прямо перед глаголом и отрицает всё предложение: *no sale a tiempo*.'
  es.a1.unit51.lesson03.teach.el_tren_sale:
    title: Смена платформы
    gloss: Поезд отправляется с платформы три вместо платформы пять.
    note: '*En lugar de* означает «вместо».'
  es.a1.unit51.lesson03.teach.el_tren_lleva:
    title: Сообщаем длительность задержки
    gloss: Поезд задерживается на десять минут.
    note: '*Lleva retraso* (буквально «несёт задержку») — естественный способ сказать, что поезд опаздывает.'
  es.a1.unit51.lesson04.teach.la_entrada_la:
    title: Вход, выход, зал ожидания
    gloss: вход; выход; зал ожидания
    note: '*La entrada*, *la salida* и *la sala de espera* — существительные женского рода.'
    example_gloss:
    - Где вход?
    - Где выход?
    - Где зал ожидания?
  es.a1.unit51.lesson04.teach.donde_esta_el:
    title: Вопрос о местонахождении платформы
    gloss: Где платформа семь?
    note: Здесь повторяется модель *¿Dónde está ...?* из уроков о маршрутах.
  es.a1.unit51.lesson04.teach.todo_recto_y:
    title: Объясняем дорогу
    gloss: Прямо, а потом направо.
    note: '*Todo recto* и *a la derecha* — выражения направления из уроков о маршрутах, теперь на вокзале.'
  es.a1.unit51.lesson04.teach.donde_esta_la:
    title: Вопрос о зале ожидания
    gloss: Где зал ожидания?
    note: Та же модель вопроса, но с новым местом.
  es.a1.unit51.lesson05.teach.billete_madrid_atocha:
    title: Читаем печатный билет
    gloss: 'Билет: Мадрид-Аточа — Толедо. Отправление: десять десять, платформа семь. Прибытие: без десяти одиннадцать. Туда и обратно. Цена: двенадцать евро сорок.'
    note: Найди время и платформу отправления, время прибытия, тип билета и цену.
    glosses:
      Billete: билет
      Salida: отправление
      diez: десять
      andén: платформа
      siete: семь
      Llegada: прибытие
      once: одиннадцать
      vuelta: билет туда и обратно
      Precio: цена
      doce: двенадцать
      euros: евро
      cuarenta: сорок
  es.a1.unit51.lesson06.teach.mateo_tenemos_que:
    title: Матео говорит о плане
    gloss: 'Матео: Нам нужно на платформу семь. Поезд отправляется в десять десять.'
    note: '*Tenemos que* + инфинитив («нам нужно», «мы должны») выражает практическую необходимость.'
  es.a1.unit51.lesson06.teach.elena_mira_ahi:
    title: Элена читает табло
    gloss: 'Элена: Смотри, вот табло: задержка, десять минут.'
    note: '*Ahí está* («вот оно») указывает на табло; *el panel* — информационное табло.'
  es.a1.unit51.lesson06.teach.mateo_no_hay:
    title: Матео сохраняет спокойствие
    gloss: 'Матео: Ничего страшного, у нас ещё есть время на кофе.'
    note: '*No hay problema* — частое разговорное выражение, чтобы успокоить: «нет проблем».'
  es.a1.unit51.lesson06.teach.elena_buena_idea:
    title: Поезд прибывает
    gloss: 'Элена: Хорошая идея. О, поезд уже здесь! Платформа семь, как раз!'
    note: '*Ya* («уже») показывает, что поезд пришёл раньше, чем ожидалось после объявленной задержки.'
  es.a1.unit51.lesson06.teach.mateo_vamos_que:
    title: Они садятся в поезд
    gloss: 'Матео: Пошли, все садятся! Толедо, мы едем!'
    note: '*Suben* («садятся») — форма глагола *subir*, подниматься в поезд; *¡Allá vamos!* — естественное выражение, как русское «поехали!», «мы едем!».'
