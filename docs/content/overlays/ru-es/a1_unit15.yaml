teaching:
  es.a1.unit15.lesson01.teach.mas_que:
    title: Больше… чем
    gloss: больше… чем
    note: '*Más...que* сравнивает два разных количества или предмета — см. грамматическую заметку ниже.'
    example_gloss: Новая квартира больше старой.
  es.a1.unit15.lesson01.teach.menos_que:
    title: Меньше… чем
    gloss: меньше… чем
    note: '*Menos...que* — противоположность *más...que*.'
    example_gloss: Старая квартира менее просторная, чем новая.
  es.a1.unit15.lesson01.teach.tan_como:
    title: Так же… как
    gloss: так же… как
    note: '*Tan...como* сравнивает два РАВНЫХ предмета — это принципиально другая конструкция, а не ещё один способ сказать то же, что *más/menos*.'
    example_gloss: Mateo готовит так же хорошо, как Elena.
  es.a1.unit15.lesson01.teach.mas_menos_tan_note:
    title: Неравенство и равенство
    gloss: Разница между más/menos...que и tan...como.
    note: См. текст самой карточки.
    target_text: '*Más...que* («больше… чем») и *menos...que* («меньше… чем») сравнивают два РАЗНЫХ предмета или количества. *Tan...como* («так же… как») сравнивает два РАВНЫХ предмета — это другая конструкция, а не просто синоним *más/menos*.'
  es.a1.unit15.lesson02.teach.el_nuevo_es_mas_grande:
    title: Сравниваем новую квартиру
    gloss: Новая квартира больше старой.
    note: В *más grande que* («больше чем») слово *grande* («большой») стоит внутри конструкции *más...que*.
  es.a1.unit15.lesson02.teach.el_viejo_es_mas_pequeno:
    title: Сравниваем старую квартиру
    gloss: Старая квартира меньше новой.
    note: 'В *más pequeño que* («меньше чем») используется *pequeño* («маленький»): то же сравнение с противоположной стороны.'
  es.a1.unit15.lesson03.teach.cual_apartamento_es_mas_grande:
    title: Спрашиваем, какая больше
    gloss: Какая квартира больше?
    note: '*¿Cuál...?* («какой…?») + сравнительное прилагательное — стандартный способ спросить о сравнении.'
  es.a1.unit15.lesson03.teach.el_nuevo_es_mas_grande_reply:
    title: Отвечаем, какая больше
    gloss: Новая больше старой.
    note: То же сравнение, теперь как прямой ответ на вопрос *¿cuál...?*; в *el nuevo* («новая») повторяющееся существительное опущено.
  es.a1.unit15.lesson04.teach.mateo_cocina_tan_bien_como_elena:
    title: Сравниваем умение готовить
    gloss: Mateo готовит так же хорошо, как Elena.
    note: '*Tan bien como* (так же хорошо, как) строится по схеме *tan* + наречие + *como*: это сравнение на равенство, но относится оно к тому, как выполняется действие, а не к размеру предмета.'
  es.a1.unit15.lesson04.teach.somos_un_buen_equipo:
    title: Скажи, что вы хорошая команда
    gloss: Мы хорошая команда.
    note: '*Somos* (мы есть) + *un buen equipo* (хорошая команда) — естественная заключительная фраза после сравнения на равенство.'
  es.a1.unit15.lesson05.teach.comparacion_reading:
    title: Сравниваем две квартиры
    gloss: В старой квартире Матео маленькая кухня. Новая квартира больше, и кухня тоже больше. Старая меньше новой, поэтому Матео хочет переехать. В новой больше места для готовки.
    note: Небольшой связный текст со сравнением двух квартир.
    glosses:
      viejo: старый
      tiene: имеет, у него есть (от tener)
      pequeña: маленький
      nuevo: новый
      grande: большой
      también: тоже, также
      pequeño: маленький
      eso: что, который
      quiere: хочет (от querer)
      mudarse: переезжать
      espacio: место, пространство
      cocinar: готовить
  es.a1.unit15.lesson05.teach.por_eso_note:
    title: Por eso (поэтому)
    gloss: Как por eso связывает причину и следствие.
    note: 'Por eso (поэтому) связывает причину с её результатом: маленькая кухня — причина, по которой Матео хочет переехать. Это та же логика причины и следствия, что и в porque, который ты уже видел.'
    target_text: '*Por eso* («поэтому») связывает причину с результатом: маленькая кухня — причина, по которой Mateo хочет переехать. Такая же логика причины и следствия тебе уже встречалась с *porque*.'
  es.a1.unit15.lesson06.teach.line01:
    title: Спроси, видел ли он квартиру
    gloss: Елена спрашивает Матео, видел ли он уже новую квартиру.
    note: '*¿Ya viste...?* (ты уже видел...?) — новая форма вопроса в прошедшем времени.'
  es.a1.unit15.lesson06.teach.line02:
    title: Подтверди, что она больше
    gloss: Матео подтверждает, что новая квартира больше старой, и кухня тоже.
    note: Сравнение с *más...que*, дополненное словами *la cocina también* (кухня тоже).
  es.a1.unit15.lesson06.teach.line03:
    title: Спроси, какая квартира меньше
    gloss: Елена спрашивает, какая же тогда квартира меньше.
    note: '*Entonces* (тогда, значит) — логическая связка, которая тебе уже встречалась. Вопрос построен по схеме *¿Cuál...?*, только с *pequeño* вместо *grande*.'
  es.a1.unit15.lesson06.teach.line04:
    title: Ответь и объясни
    gloss: Матео говорит, что старая квартира меньше, и поэтому он хочет переехать.
    note: '*El viejo es más pequeño que el nuevo* и *por eso quiero mudarme* (поэтому я хочу переехать).'
  es.a1.unit15.lesson06.teach.line05:
    title: Согласись, что это logично
    gloss: 'Елена говорит, что в этом есть смысл: в новой квартире больше места для готовки.'
    note: '*Tiene mucho sentido* (в этом большой смысл) — новая фраза согласия. *Más espacio para cocinar* значит «больше места для готовки».'
  es.a1.unit15.lesson06.teach.line06:
    title: Продолжи рассуждение
    gloss: 'Матео соглашается и добавляет: раз Елена готовит так же хорошо, как он, им нужно место на двоих.'
    note: '*Tan bien como* (так же хорошо, как) в живой речи: *tú cocinas* (ты готовишь).'
  es.a1.unit15.lesson06.teach.line07:
    title: Ответь комплиментом
    gloss: Елена горячо соглашается и говорит, что он готовит так же хорошо, как она.
    note: '*¡Es verdad!* (это правда!) + *tú cocinas tan bien como yo* (ты готовишь так же хорошо, как я) — то же сравнение *tan bien como*, теперь обращённое к Матео.'
  es.a1.unit15.lesson06.teach.line08:
    title: Завершим командным духом
    gloss: Матео заключает, что они хорошая команда.
    note: '*Somos un buen equipo* (мы хорошая команда) завершает диалог.'
