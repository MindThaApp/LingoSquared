teaching:
  es.a1.unit09.lesson01.teach.la_calle:
    title: Улица
    gloss: улица
    note: '*Calle* — существительное женского рода.'
    example_gloss: Я живу на этой улице.
  es.a1.unit09.lesson01.teach.la_esquina:
    title: Угол
    gloss: угол
    note: '*Esquina* — существительное женского рода.'
    example_gloss: Банк находится на углу.
  es.a1.unit09.lesson02.teach.seguir_derecho:
    title: Идти прямо
    gloss: Иди прямо.
    note: '*Sigue* — форма повелительного наклонения на «ты» от глагола *seguir* (следовать, продолжать). Она встречается во всех указаниях маршрута в этом уроке.'
  es.a1.unit09.lesson02.teach.doblar_izquierda:
    title: Повернуть налево
    gloss: Поверни налево.
    note: '*Dobla* — форма повелительного наклонения на «ты» от глагола *doblar* (поворачивать, сгибать). О различии *doblar* и *girar* читай в следующей грамматической заметке.'
  es.a1.unit09.lesson02.teach.girar_derecha:
    title: Повернуть направо
    gloss: Поверни направо.
    note: '*Gira* — форма повелительного наклонения на «ты» от глагола *girar* (поворачивать, вращать); в этом значении он полностью взаимозаменяем с *doblar*.'
  es.a1.unit09.lesson02.teach.cruzar_la_calle:
    title: Перейти улицу
    gloss: Перейди улицу.
    note: '*Cruza* — форма повелительного наклонения на «ты» от глагола *cruzar* (пересекать, переходить).'
  es.a1.unit09.lesson02.teach.doblar_vs_girar_note:
    title: Doblar и girar
    gloss: Два одинаково естественных глагола со значением «поворачивать».
    note: Doblar и girar означают «поворачивать» и здесь полностью взаимозаменяемы. Выбор зависит от региона, а не от стиля речи или значения. В этом уроке встречаются оба глагола.
    target_text: '*Doblar* и *girar* оба означают «поворачивать» и здесь полностью взаимозаменяемы: это региональное предпочтение, а не разница в стиле или значении. В этом уроке используются оба.'
  es.a1.unit09.lesson03.teach.como_llego_a_la_biblioteca:
    title: Спросить дорогу
    gloss: Как мне дойти до библиотеки?
    note: '*Cómo llego a* (как мне добраться до) — стандартный способ спросить дорогу к определённому месту.'
  es.a1.unit09.lesson03.teach.es_facil:
    title: Сказать, что это легко
    gloss: Это легко.
    note: Часто употребляемая успокаивающая фраза перед тем, как объяснить дорогу.
  es.a1.unit09.lesson03.teach.sigue_derecho_por_esta_calle:
    title: Иди прямо по этой улице
    gloss: Иди прямо по этой улице.
    note: '*Por esta calle* (по этой улице) уточняет, по какой улице нужно идти.'
  es.a1.unit09.lesson03.teach.dobla_a_la_izquierda_en_la_esquina:
    title: Повернуть налево на углу
    gloss: На углу поверни налево.
    note: '*En la esquina* (на углу) указывает, где нужно повернуть.'
  es.a1.unit09.lesson04.teach.esta_bien_asi:
    title: Попросить подтверждения
    gloss: Так правильно?
    note: '*¿Está bien así?* (так правильно?) — вопрос, которым проверяют, всё ли понято, после того как повторили маршрут. Это естественный следующий шаг после объяснения дороги.'
  es.a1.unit09.lesson04.teach.si_asi_es:
    title: Подтвердить
    gloss: Да, всё верно.
    note: '*Así es* (именно так) — естественное краткое подтверждение.'
  es.a1.unit09.lesson04.teach.no_te_pierdas:
    title: Не заблудись
    gloss: Не заблудись!
    note: '*No te pierdas* — отрицательная форма повелительного наклонения на «ты» от глагола *perderse* (заблудиться). Тёплое неформальное пожелание на прощание.'
  es.a1.unit09.lesson05.teach.direcciones_reading:
    title: Чтение письменных указаний
    gloss: Чтобы дойти до библиотеки от рынка, иди прямо по этой улице. На углу поверни налево. Потом перейди улицу. Библиотека будет справа.
    note: 'В письменных указаниях шаги перечисляются по порядку: *Para llegar a...* (чтобы дойти до...) называет пункт назначения, затем каждый шаг — команда на *tú* (*sigue*, *dobla*, *cruza*), а *después* (потом) связывает шаги.'
    glosses:
      llegar: добраться, прибыть
      biblioteca: библиотека
      desde: от, из
      mercado: рынок
      sigue: продолжать, идти (от seguir)
      derecho: прямо
      calle: улица
      Dobla: поворачивать (от doblar)
      izquierda: левый, налево
      esquina: угол
      Después: потом, после этого
      cruza: переходить (от cruzar)
      está: находится (от estar)
      derecha: правый, направо
  es.a1.unit09.lesson05.teach.desde_note:
    title: Desde (от, из)
    gloss: Как desde указывает начальную точку маршрута.
    note: 'Desde (от, из) обозначает начальную точку маршрута и сочетается с a (до, к), которое обозначает пункт назначения: desde el mercado ... a la biblioteca.'
    target_text: '*Desde* (от, из) указывает начальную точку маршрута, а *a* (в, к) — пункт назначения: *desde el mercado* ... *a la biblioteca*.'
  es.a1.unit09.lesson06.teach.line01:
    title: Спросить дорогу
    gloss: Матео спрашивает Елену, как дойти от рынка до библиотеки.
    note: 'Тот же вопрос *¿Cómo llego a...?*, что и раньше в этом уроке, но теперь с указанием начальной точки: *desde el mercado* (от рынка).'
  es.a1.unit09.lesson06.teach.line02:
    title: Назвать первый шаг
    gloss: Елена говорит, что это легко, и называет первое указание.
    note: '*Es fácil* (это легко) успокаивает перед первым шагом маршрута.'
  es.a1.unit09.lesson06.teach.line03:
    title: Повторить и спросить, что дальше
    gloss: Матео повторяет указание и спрашивает, что делать дальше.
    note: '*Sigo derecho* (я иду прямо) — форма первого лица от *seguir*: Матео подтверждает, что идёт по указаниям.'
  es.a1.unit09.lesson06.teach.line04:
    title: Назвать второй шаг
    gloss: Елена говорит ему повернуть налево на углу.
    note: '*Dobla* (поверни) — здесь можно сказать и *gira*, значение то же.'
  es.a1.unit09.lesson06.teach.line05:
    title: Повторить и уточнить
    gloss: Матео повторяет поворот и спрашивает, правильно ли он понял.
    note: '*Doblo* (я поворачиваю) соответствует его прежнему *Sigo derecho*: Матео повторяет каждый шаг в форме *yo*, чтобы проверить себя.'
  es.a1.unit09.lesson06.teach.line06:
    title: Подтвердить и назвать последние шаги
    gloss: 'Елена подтверждает, затем говорит перейти улицу: библиотека будет справа.'
    note: '*Sí, así es* (да, всё верно) подтверждает сказанное, а *después* (потом) вводит последние шаги маршрута.'
  es.a1.unit09.lesson06.teach.line07:
    title: Поблагодарить Елену
    gloss: Матео тепло благодарит Елену.
    note: '*Muchas gracias* (большое спасибо) звучит теплее, чем простое *gracias*.'
  es.a1.unit09.lesson06.teach.line08:
    title: Ответить и пожелать удачи
    gloss: Елена говорит «не за что» и просит его не заблудиться.
    note: '*De nada* (не за что) — стандартный ответ на *gracias*.'
