teaching:
  es.a1.unit49.lesson01.teach.levantarse_me_levanto:
    title: Вставать
    gloss: вставать → я встаю
    note: '*Levantarse* — возвратный глагол: местоимение *me* стоит перед глаголом, *Me levanto*.'
  es.a1.unit49.lesson01.teach.vestirse_me_visto:
    title: Одеваться
    gloss: одеваться → я одеваюсь
    note: '*Vestirse* тоже возвратный глагол: *Me visto*. Здесь *me* означает «себя».'
  es.a1.unit49.lesson01.teach.desayunar_desayuno:
    title: Завтракать
    gloss: завтракать → я завтракаю
    note: '*Desayunar* не возвратный глагол: *Desayuno*, без *me*.'
  es.a1.unit49.lesson01.teach.trabajar_trabajo:
    title: Работать
    gloss: работать → я работаю
    note: '*Trabajar* — правильный глагол на -ar: форма *yo* оканчивается на -o, *trabajo*.'
  es.a1.unit49.lesson01.teach.comer_como:
    title: Есть
    gloss: есть → я ем
    note: '*Comer* — правильный глагол на -er: форма *yo* оканчивается на -o, *como*.'
  es.a1.unit49.lesson01.teach.lavar_los_platos:
    title: Мыть посуду
    gloss: мыть посуду → я мою посуду
    note: '*Lavar los platos* — не возвратный оборот: *Lavo los platos*. Дополнение *los platos* остаётся после глагола.'
  es.a1.unit49.lesson01.teach.dormir_duermo:
    title: Спать
    gloss: спать → я сплю
    note: 'У *dormir* в форме *yo* меняется гласная корня: *duermo* (o переходит в ue).'
  es.a1.unit49.lesson02.teach.con_levantarse_y:
    title: Модель возвратных глаголов
    gloss: 'С levantarse и vestirse местоимение стоит перед глаголом: levantarse → Me levanto.'
    note: 'С возвратными глаголами ставь *me* перед спрягаемым глаголом: говори *Me levanto*, а не *Levanto me*.'
  es.a1.unit49.lesson02.teach.levantarse_me_levanto:
    title: Levantarse в предложении
    gloss: 'вставать: я встаю в семь.'
    note: 'Указание времени стоит после глагола: *Me levanto a las siete*.'
  es.a1.unit49.lesson02.teach.vestirse_me_visto:
    title: Vestirse в предложении
    gloss: 'одеваться: я одеваюсь.'
    note: 'Модель такая: *me* + *visto*; местоимение стоит прямо перед глаголом.'
  es.a1.unit49.lesson02.teach.lavar_los_platos:
    title: Lavar los platos в предложении
    gloss: 'мыть посуду: я мою посуду после еды.'
    note: '*Después de comer* («после еды») — это *de* с инфинитивом; такой оборот может стоять в конце предложения.'
  es.a1.unit49.lesson02.teach.sin_pronombre_desayuno:
    title: Глаголы без me
    gloss: 'Без местоимения: я завтракаю. Я работаю. Я сплю. Эти глаголы не возвратные.'
    note: 'У *desayuno*, *trabajo* и *duermo* нет *me*: эти глаголы не возвратные.'
  es.a1.unit49.lesson03.teach.me_levanto_a:
    title: Встаю в половине восьмого
    gloss: Я встаю в 7:30.
    note: 'Половину часа в испанском выражают с помощью *y media*: *las siete y media* — это 07:30. Перед временем ставь *a las*.'
  es.a1.unit49.lesson03.teach.me_visto_a:
    title: Одеваюсь без пятнадцати восемь
    gloss: Я одеваюсь в 7:45.
    note: '*Las ocho menos cuarto* — отсчёт назад от следующего часа: 07:45.'
  es.a1.unit49.lesson03.teach.desayuno_a_las:
    title: Завтракаю в восемь
    gloss: Я завтракаю в восемь часов.
    note: 'Перед временем ставь *a las*: *a las ocho*. Для часа дня нужно *a la una*.'
  es.a1.unit49.lesson03.teach.trabajo_de_nueve:
    title: Работаю с девяти до пяти
    gloss: Я работаю с девяти часов до пяти.
    note: '*De ... a ...* задаёт время начала и конца: *de nueve a cinco*.'
  es.a1.unit49.lesson03.teach.como_a_las:
    title: Ем в половине седьмого
    gloss: Я ем в 6:30 вечера.
    note: '*De la tarde* уточняет, что речь о вечере, поэтому *las seis y media* здесь — это 18:30.'
  es.a1.unit49.lesson03.teach.duermo_a_las:
    title: Сплю в одиннадцать
    gloss: Я сплю в одиннадцать часов.
    note: 'Перед временем ставь *a las*: *a las once*.'
  es.a1.unit49.lesson04.teach.primero_luego_despues:
    title: Сначала, потом, после этого
    gloss: сначала, потом, после этого
    note: '*Primero* обозначает первое действие, *luego* — следующее, а *después* — то, что идёт дальше.'
    example_gloss:
    - Сначала я встаю.
    - Потом я одеваюсь.
    - После этого я завтракаю.
  es.a1.unit49.lesson04.teach.primero_me_levanto:
    title: Утро в три шага
    gloss: Сначала я встаю. Потом я одеваюсь. После этого я завтракаю.
    note: 'У возвратных глаголов *me* стоит перед глаголом: *me levanto*, *me visto*.'
  es.a1.unit49.lesson04.teach.primero_luego_y:
    title: Слова-связки
    gloss: 'Primero, luego и después упорядочивают твои действия; форма глагола не меняется: Después desayuno.'
    note: 'Слова-связки стоят в начале предложения, а форма глагола не меняется: *Después desayuno*.'
  es.a1.unit49.lesson05.teach.mi_dia_me:
    title: Мой день
    gloss: Мой день — Я встаю в 7:30. После этого я одеваюсь, а в восемь завтракаю. Я работаю с девяти до пяти. В 6:30 вечера я ем. После этого я мою посуду. В одиннадцать я сплю.
    note: Следи и за порядком действий, и за временем. Обрати внимание на *me levanto* и *me visto* с *me*.
    glosses:
      Mi: мой
      día: день
      levanto: встаю (me levanto)
      media: половина (y media = половина)
      ocho: восемь
      Después: после этого
      visto: одеваться
      las: артикль перед временем на часах
      desayuno: завтракать
      Trabajo: работать
      nueve: девять
      cinco: пять
      siete: семь
      tarde: вечером
      como: есть, обедать
      lavo: мыть посуду
      once: одиннадцать
      duermo: спать
  es.a1.unit49.lesson06.teach.elena_como_es:
    title: Вопрос о дне
    gloss: 'Элена: Как проходит твой день, Матео?'
    note: '*¿Cómo es tu día?* — так на «ты» просят рассказать о своём дне; *tu* — «твой».'
  es.a1.unit49.lesson06.teach.mateo_me_levanto:
    title: Утро Матео
    gloss: 'Матео: Я встаю в половине восьмого. После этого я одеваюсь, а в восемь завтракаю.'
    note: Матео связывает три утренних занятия словами *después* и *y*.
  es.a1.unit49.lesson06.teach.elena_cuando_trabajas:
    title: Рабочий день Матео
    gloss: 'Элена: Когда ты работаешь? Матео: Я работаю с девяти до пяти.'
    note: 'Елена и Матео обращаются друг к другу на «ты», в неформальной форме *tú*: *¿Cuándo trabajas?*'
  es.a1.unit49.lesson06.teach.mateo_a_las:
    title: Вечер Матео
    gloss: 'Матео: В половине седьмого вечера я ем. После этого мою посуду. В одиннадцать сплю.'
    note: '*Después* стоит в начале предложения, но форма глагола не меняется: *después lavo*.'
  es.a1.unit49.lesson06.teach.elena_me_levanto:
    title: Утро Элены
    gloss: 'Элена: Я встаю в шесть, но завтракаю только в половине седьмого.'
    note: '*No ... hasta* значит «не раньше, чем», «только в». Элена сравнивает время подъёма и время завтрака.'
