    title: Элена и Матео идут на рынок
teaching:
  es.a1.unit07.lesson01.teach.el_mercado:
    title: Рынок
    gloss: рынок
    note: Слово *mercado* мужского рода.
    example_gloss: Пойдём на рынок.
  es.a1.unit07.lesson01.teach.fruta_verdura:
    title: Фрукты, овощи
    gloss: фрукты, овощи
    note: '*Verdura* означает овощи вообще (часто зелёные). Это существительное женского рода в единственном числе, которое употребляется и в собирательном значении, как русское «зелень».'
    example_gloss:
    - Я хочу купить фрукты.
    - Овощи свежие.
  es.a1.unit07.lesson01.teach.huevos_pan:
    title: Яйца, хлеб
    gloss: яйца, хлеб
    note: '*Huevos* уже стоит во множественном числе (единственное число — *huevo*). *Pan* («хлеб») — неисчисляемое существительное, как и русское «хлеб», у него нет обычной формы множественного числа в повседневном значении.'
    example_gloss:
    - Мне нужны яйца.
    - Хлеб сегодняшний, утренний.
  es.a1.unit07.lesson02.teach.cuanto_cuesta:
    title: Спросить цену
    gloss: Сколько это стоит?
    note: '*Cuesta* — форма 3-го лица глагола *costar* («стоить»), нового глагола в этом уроке.'
  es.a1.unit07.lesson02.teach.cuanto_es:
    title: 'Спросить цену: другой вариант'
    gloss: Сколько это?
    note: Сравнение с *¿Cuánto cuesta?* — в следующей карточке с грамматикой.
  es.a1.unit07.lesson02.teach.cuesta_dos:
    title: Назвать цену
    gloss: Это стоит два.
    note: 'Короткий, но полный ответ о цене: валюта понятна из контекста, как и в русском, где при покупке часто называют просто число.'
  es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note:
    title: Cuánto cuesta и Cuánto es
    gloss: Два одинаково естественных способа спросить цену.
    note: Смотри текст самой карточки.
    target_text: '*¿Cuánto cuesta?* («сколько это стоит?») и *¿Cuánto es?* («сколько это?») — оба естественно звучат, когда спрашивают цену, и в повседневных покупках взаимозаменяемы.'
  es.a1.unit07.lesson03.teach.una_docena_de_huevos:
    title: Попросить дюжину яиц
    gloss: Дюжину яиц, пожалуйста.
    note: '*Docena* («дюжина») — существительное; после него всегда стоит *de* и название предмета, как в русском «дюжина яиц» после существительного идёт родительный падеж.'
  es.a1.unit07.lesson03.teach.un_kilo_de_tomates:
    title: Попросить килограмм помидоров
    gloss: Килограмм помидоров, пожалуйста.
    note: После *kilo* стоит та же конструкция *de* + предмет, что и после *docena*.
  es.a1.unit07.lesson03.teach.medio_kilo:
    title: Полкило
    gloss: полкило
    note: '*Medio* («половина») стоит перед существительным и согласуется с ним в роде: *medio kilo* — мужской род, *media docena* — женский.'
    example_gloss: Полкило хлеба, пожалуйста.
  es.a1.unit07.lesson03.teach.un_poco_de:
    title: Немного
    gloss: немного
    note: '*Un poco de* используется для неопределённого небольшого количества, когда точная мера не нужна.'
    example_gloss: Я хочу немного фруктов.
  es.a1.unit07.lesson04.teach.necesita_algo_mas:
    title: Спросить, нужно ли что-то ещё
    gloss: Вам нужно что-нибудь ещё?
    note: '*Necesita* — форма *usted* глагола *necesitar*, то есть вежливое обращение на «вы», которое обычно используют продавцы с покупателями.'
  es.a1.unit07.lesson04.teach.no_creo_que_ya_tenemos_todo:
    title: Сказать, что у вас есть всё
    gloss: Нет, думаю, у нас уже всё есть.
    note: '*Creo que* («я думаю, что») — частый способ смягчить фразу; здесь оно подтверждает, что список покупок выполнен.'
  es.a1.unit07.lesson04.teach.gracias_vendedor:
    title: Поблагодарить продавца
    gloss: Отлично, спасибо.
    note: Короткое естественное завершение покупки.
  es.a1.unit07.lesson05.teach.etiquetas_reading:
    title: Читаем ценники
    gloss: 'Прилавок Розы: помидоры — два за килограмм. Яйца — четыре за дюжину. Хлеб — шесть. Свежие фрукты каждый день.'
    note: 'Типичный ценник на рыночном прилавке: товар, цена, затем единица, к которой относится цена (*el kilo*, *la docena*). *Puesto* — рыночный прилавок; этот прилавок держит Роза.'
    glosses:
      Puesto: прилавок
      tomates: помидоры
      kilo: килограмм
      Huevos: яйца
      docena: дюжина
      Pan: хлеб
      Fruta: фрукты
      fresca: свежий
      todos: каждый
      días: дни
  es.a1.unit07.lesson05.teach.el_kilo_note:
    title: El kilo в значении «за килограмм»
    gloss: Как слово-единица после цены означает «за» эту единицу.
    note: Смотри текст самой карточки.
    target_text: '*El kilo* после цены («tomates, dos el kilo») значит «за килограмм»: цена относится к каждому купленному килограмму.'
  es.a1.unit07.lesson06.teach.line01:
    title: Предложить пойти на рынок
    gloss: Элена предлагает пойти на рынок за продуктами для следующего занятия.
    note: '*Para la próxima clase* значит «для следующего занятия» — следующей встречи кулинарной мастерской.'
  es.a1.unit07.lesson06.teach.line02:
    title: Согласиться и спросить, что нужно
    gloss: Матео соглашается и спрашивает, что им нужно.
    note: 'В *¿Qué necesitamos?* глагол *necesitar* стоит в форме *nosotros*: «что нам нужно?».'
  es.a1.unit07.lesson06.teach.line03:
    title: Обратить внимание на свежие помидоры
    gloss: Елена говорит, что сначала нужны овощи, и замечает, какие свежие помидоры.
    note: '*¡Qué tomates tan frescos!* («какие свежие помидоры!») — восклицание с *qué*, как *¡Qué bonito!* из третьего раздела, но с существительным: *qué* + существительное + *tan* + прилагательное.'
  es.a1.unit07.lesson06.teach.line04:
    title: Продавец спрашивает, сколько нужно
    gloss: Продавец спрашивает Елену, сколько ей нужно.
    note: '*Señorita* — вежливое обращение к молодой девушке; оно подходит к форме *usted*, на которой продавец обращается к покупателю (сегодня некоторым оно кажется немного старомодным).'
  es.a1.unit07.lesson06.teach.line05:
    title: Заказать килограмм и спросить цену
    gloss: Елена просит килограмм и спрашивает цену.
    note: В одном естественном диалоге соединяются *un kilo* и *¿Cuánto cuesta?* из этого раздела.
  es.a1.unit07.lesson06.teach.line06:
    title: Назвать цену
    gloss: Продавец говорит, что это стоит два.
    note: '*Cuesta dos* — короткий ответ о цене; валюта понятна из ситуации.'
  es.a1.unit07.lesson06.teach.line07:
    title: Матео заказывает яйца и хлеб
    gloss: Матео говорит, что ему нужно десяток яиц и хлеб.
    note: Здесь сочетаются *huevos*/*pan* и *una docena de* из этого раздела; *yo* можно опустить, оно лишь добавляет немного акцента («я…»).
  es.a1.unit07.lesson06.teach.line08:
    title: Продавец называет обе цены
    gloss: Продавец говорит, что яйца стоят четыре, а хлеб — шесть.
    note: '*Cuestan* (мн. ч., «стоят») согласуется с подлежащим во множественном числе *los huevos*, в отличие от *cuesta* в единственном числе, которое было про помидоры.'
  es.a1.unit07.lesson06.teach.line09:
    title: Поблагодарить продавца
    gloss: 'Матео говорит: отлично, спасибо.'
    note: Та же короткая завершающая фраза, что и раньше в этом разделе.
  es.a1.unit07.lesson06.teach.line10:
    title: Спросить друга, нужно ли ещё что-нибудь
    gloss: Елена спрашивает Матео, нужно ли ему что-нибудь ещё.
    note: '*¿Necesitas...?* — форма *tú*, для друга; вопрос продавца *¿Necesita...?* — форма *usted*.'
  es.a1.unit07.lesson06.teach.line11:
    title: Сказать, что у вас есть всё
    gloss: Матео говорит, что нет, кажется, у них уже всё есть.
    note: '*Creo que* («я думаю, что») смягчает ответ; *ya* значит «уже».'
