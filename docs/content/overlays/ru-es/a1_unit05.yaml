  es.a1.unit05.time:
    title: Расписание мастер-класса
lessons:
  es.a1.unit05.lesson01.decir_la_hora_en_punto:
    title: Как назвать целый час
  es.a1.unit05.lesson02.cuarto_y_media:
    title: Четверть часа и половина
  es.a1.unit05.lesson03.partes_del_dia:
    title: Части суток и начало мастер-класса
  es.a1.unit05.lesson04.proponer_una_hora_para_verse:
    title: Предлагаем время встречи
  es.a1.unit05.lesson05.leer_el_horario_del_dia:
    title: Читаем расписание дня
  es.a1.unit05.lesson06.planear_el_almuerzo_dialogue:
    title: Элена и Матео планируют обед
teaching:
  es.a1.unit05.lesson01.teach.que_hora_es:
    title: Спросить, который час
    gloss: Который час?
    note: '*Qué hora* («который час») спрашивает о времени по часам, в отличие от *qué fecha* («какое число»).'
  es.a1.unit05.lesson01.teach.es_la_una:
    title: Сейчас час
    gloss: Час.
    note: Почему для часа дня используется *es*, а не *son*, объясняет следующая карточка.
  es.a1.unit05.lesson01.teach.es_vs_son_note:
    title: Es и son при назывании времени
    gloss: Чем «час» отличается от всех остальных часов.
    note: '*Es la una* — единственное число, но *son las dos, son las tres...* — множественное.'
    target_text: Для часа дня используется глагол в единственном числе *es* (Es la una), а для всех остальных часов — во множественном *son* (Son las dos, Son las tres...), потому что *la una* — единственное число («один [час]»), а *las dos*, *las tres* и т. д. — множественное.
  es.a1.unit05.lesson01.teach.son_las_horas:
    title: Два, четыре, пять, семь часов
    gloss: Два часа, четыре часа, пять часов, семь часов.
    note: '*Son las...* (множественное число) употребляется для всех часов, кроме часа дня или ночи (один час), как в предыдущей заметке по грамматике.'
    example_gloss:
    - Два часа.
    - Четыре часа.
    - Пять часов.
    - Семь часов.
  es.a1.unit05.lesson02.teach.y_cuarto:
    title: Четверть после часа
    gloss: Пятнадцать минут пятого (четыре пятнадцать).
    note: '*Y cuarto* («и четверть») прибавляет к названному часу пятнадцать минут.'
  es.a1.unit05.lesson02.teach.y_media:
    title: Половина часа
    gloss: Половина восьмого (семь тридцать).
    note: '*Y media* («и половина») прибавляет к названному часу тридцать минут. В русском «половина восьмого» — это 7:30, а в испанском называется сам час: «семь и половина».'
  es.a1.unit05.lesson02.teach.menos_cuarto:
    title: Без четверти
    gloss: Без четверти пять (четыре сорок пять).
    note: О том, как *menos* ведёт отсчёт до следующего часа, читай в следующей заметке по грамматике.
  es.a1.unit05.lesson02.teach.menos_note:
    title: Menos (без скольки-то минут)
    gloss: Как в испанском считаются минуты до следующего часа — так же, как в русском «без четверти пять».
    note: '*Las cinco menos cuarto* = без четверти пять (4:45).'
    target_text: '*Menos* («минус», «без») отсчитывает назад до следующего часа: *las cinco menos cuarto* — это 4:45, «без четверти пять»; в русском логика такая же.'
  es.a1.unit05.lesson03.teach.partes_del_dia:
    title: Утро, день, вечер, ночь
    gloss: утра, дня, вечера / ночи
    note: '*De la mañana/tarde/noche* уточняет время суток после часа, как русское «утра», «дня», «вечера», «ночи»: восемь утра, десять вечера.'
    example_gloss:
    - Восемь утра.
    - Мастер-класс начинается в четыре часа дня.
    - Десять вечера.
  es.a1.unit05.lesson03.teach.taller_empieza_cuatro_tarde:
    title: Мастер-класс начинается в четыре
    gloss: Мастер-класс начинается в четыре часа дня.
    note: '*Empieza* («начинается») — форма третьего лица глагола *empezar*, нового глагола в этом уроке.'
  es.a1.unit05.lesson03.teach.a_que_hora_empieza:
    title: Спроси, во сколько что-то начинается
    gloss: Во сколько начинается мастер-класс?
    note: '*A qué hora* («в какое время») — стандартный способ спросить, когда происходит конкретное событие; не путай с общим вопросом *qué hora es* («который час»).'
  es.a1.unit05.lesson04.teach.nos_vemos_a_que_hora:
    title: Спроси, во сколько встретиться
    gloss: Во сколько встретимся?
    note: '*Nos vemos* («видим друг друга» / «встретимся») — возвратная конструкция, которая используется, когда договариваются о встрече.'
  es.a1.unit05.lesson04.teach.nos_vemos_tres_y_media:
    title: Предложи время встречи
    gloss: Встретимся в половине четвёртого?
    note: Сочетает *y media* и *nos vemos*, чтобы предложить конкретное время.
  es.a1.unit05.lesson04.teach.antes_del_taller:
    title: До мастер-класса
    gloss: Это до мастер-класса.
    note: '*Antes de* («до») — противоположность *después* («после»).'
  es.a1.unit05.lesson04.teach.de_acuerdo:
    title: Договорились / Хорошо
    gloss: Договорились / Хорошо
    note: '*De acuerdo* — естественный краткий способ подтвердить план, по функции похож на *Muy bien*.'
    example_gloss: Договорились, встретимся в половине четвёртого.
  es.a1.unit05.lesson05.teach.horario_dia_reading:
    title: Читаем расписание дня
    gloss: Мастер-класс начинается в четыре часа дня. До этого Элена и Матео встречаются в половине четвёртого. Мастер-класс заканчивается в шесть. На следующий день они встречаются в час, чтобы пообедать.
    note: 'Короткое расписание: встреча, мастер-класс и обед на следующий день.'
    glosses:
      taller: мастер-класс
      empieza: начинается (от empezar)
      cuatro: четыре
      tarde: день (после полудня)
      Antes: до, раньше
      ven: встречаются (от verse)
      tres: три
      media: половина
      termina: заканчивается (от terminar)
      seis: шесть
      día: день
      siguiente: следующий
      almorzar: обедать
  es.a1.unit05.lesson05.teach.al_dia_siguiente:
    title: На следующий день
    gloss: на следующий день
    note: '*Al día siguiente* («на следующий день») — обычный способ перенести рассказ на новый день; это не то же самое, что *la próxima clase* («следующее занятие» — конкретное событие, а не календарный день).'
  es.a1.unit05.lesson06.teach.line01:
    title: Спроси о еде после мастер-класса
    gloss: Матео говорит, что мастер-класс заканчивается в шесть, и спрашивает, голодна ли потом Элена.
    note: '*Tienes hambre* («ты голоден») — новое выражение; буквально «у тебя голод», та же конструкция с глаголом «иметь», что в *tener ... años* и *tener hermanos*.'
  es.a1.unit05.lesson06.teach.line02:
    title: Согласись и предложи следующий день
    gloss: Элена отвечает «да, немного» и предлагает пообедать на следующий день.
    note: '*¿Comemos mañana?* предлагает завтра, а не сразу после мастер-класса, и подводит к следующему обмену репликами о конкретном времени.'
  es.a1.unit05.lesson06.teach.line03:
    title: Согласись и спроси время
    gloss: Матео соглашается, что это хорошая идея, и спрашивает, во сколько.
    note: '*Buena idea* («хорошая идея») — естественный краткий способ согласиться с предложением.'
  es.a1.unit05.lesson06.teach.line04:
    title: Предложи час дня
    gloss: Элена предлагает встретиться в час.
    note: '*A la una* («в час») использует единственное число *la una*, как в *Es la una*.'
  es.a1.unit05.lesson06.teach.line05:
    title: Подтверди и упомяни ресторан
    gloss: Матео подтверждает, что час подходит, и упоминает ресторан неподалёку.
    note: '*Hay un restaurante cerca de aquí*: *cerca de* («рядом с», «около»), как в *cerca de tus padres*, здесь — о месте.'
  es.a1.unit05.lesson06.teach.line06:
    title: Тепло попрощайся
    gloss: Элена радостно реагирует и говорит «до завтра».
    note: '*¡Genial!* («здорово!») завершает разговор на радостной ноте, по функции похоже на *¡Qué bien!*.'
