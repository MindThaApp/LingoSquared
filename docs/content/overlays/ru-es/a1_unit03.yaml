answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Испанский язык A1
  description: Лексика о близких и дальних родственниках, притяжательные прилагательные и рассказ о своём доме и семье; продолжение истории Елены и Матео из кулинарного мастер-класса (юниты 01–02). Особое внимание уделяется притяжательным прилагательным mi/tu/su (в том числе формам вежливости) и названиям родственников, различающимся по роду.
units:
  es.a1.unit03.family:
    title: Семьи Елены и Матео
lessons:
  es.a1.unit03.lesson01.immediate_family:
    title: Близкие родственники
  es.a1.unit03.lesson02.possessives_and_asking:
    title: 'Притяжательные: mi, tu, su'
  es.a1.unit03.lesson03.extended_family:
    title: Дальние родственники
  es.a1.unit03.lesson04.describing_family_size:
    title: Сколько человек дома
  es.a1.unit03.lesson05.reading_a_family_profile:
    title: Читаем анкету о семье
  es.a1.unit03.lesson06.family_photos_dialogue:
    title: Семейные фото с Еленой и Матео
teaching:
  es.a1.unit03.lesson01.teach.madre:
    title: Мать
    gloss: мать
    note: '*Madre* — слово женского рода. В семье чаще говорят *mamá* («мама»), а *madre* нейтрально и используется в списках лексики этого курса.'
  es.a1.unit03.lesson01.teach.padre:
    title: Отец
    gloss: отец
    note: '*Padre* — слово мужского рода. В повседневной речи ему соответствует *papá* («папа») — так же, как *madre* и *mamá*.'
  es.a1.unit03.lesson01.teach.hermano:
    title: Брат
    gloss: брат
    note: '*Hermano* — мужской род, единственное число.'
  es.a1.unit03.lesson01.teach.hermana:
    title: Сестра
    gloss: сестра
    note: '*Hermana* — женский род, единственное число.'
  es.a1.unit03.lesson01.teach.hijo:
    title: Сын
    gloss: сын
    note: '*Hijo* — мужской род, единственное число.'
  es.a1.unit03.lesson01.teach.hija:
    title: Дочь
    gloss: дочь
    note: '*Hija* — женский род, единственное число.'
  es.a1.unit03.lesson01.teach.padres:
    title: Родители
    gloss: родители
    note: '*Padres* (мужской род, множественное число) обозначает пару из матери и отца вместе. В испанском так всегда, когда в группе есть хотя бы один мужчина.'
  es.a1.unit03.lesson01.teach.hermanos:
    title: Братья и сёстры
    gloss: братья и сёстры; братья
    note: '*Hermanos* может значить «братья» (только мальчики) или «братья и сёстры» (смешанная группа) — по тому же правилу, что и *padres*: мужской род множественного числа охватывает смешанную группу.'
  es.a1.unit03.lesson02.teach.mi_familia:
    title: Моя семья
    gloss: моя семья
    note: '*Mi* (без ударения) — притяжательное «мой, моя, моё»; оно не меняется по роду, а только по числу (*mis* — для существительных во множественном числе).'
  es.a1.unit03.lesson02.teach.tu_familia:
    title: Твоя семья
    gloss: твоя семья
    note: '*Tu* (без ударения, в отличие от местоимения *tú*) — притяжательное для обращения на «ты»; оно соответствует форме *tú* из юнита 1.'
  es.a1.unit03.lesson02.teach.su_familia:
    title: Его, её или ваша семья
    gloss: его, её или ваша семья
    note: '*Su* означает «его», «её», «их» и вежливое «ваш» (при обращении на *usted*). Само притяжательное эти значения не различает; смысл понятен из контекста.'
  es.a1.unit03.lesson02.teach.tienes_hermanos:
    title: Спросить о братьях и сёстрах
    gloss: У тебя есть братья или сёстры?
    note: '*Tienes* — форма *tú* глагола *tener*, того самого, который мы использовали для возраста в юните 2.'
  es.a1.unit03.lesson02.teach.tengo_dos_hermanas:
    title: Назвать число братьев и сестёр
    gloss: У меня две сестры.
    note: '*Tengo* («у меня есть») + число + название родственника — стандартный способ рассказать о братьях и сёстрах.'
  es.a1.unit03.lesson02.teach.tu_familia_es_grande:
    title: Спросить, большая ли семья
    gloss: Твоя семья большая?
    note: '*Grande* («большой») не меняется по роду, только по числу (*grandes*).'
  es.a1.unit03.lesson02.teach.mi_familia_es_pequena:
    title: Описать маленькую семью
    gloss: Моя семья маленькая.
    note: '*Pequeña* согласуется с существительным женского рода *familia*; с существительным мужского рода использовалась бы форма *pequeño*.'
  es.a1.unit03.lesson03.teach.abuelo:
    title: Дедушка
    gloss: дедушка
    note: '*Abuelo* — мужской род, единственное число.'
  es.a1.unit03.lesson03.teach.abuela:
    title: Бабушка
    gloss: бабушка
    note: '*Abuela* — существительное женского рода в единственном числе.'
  es.a1.unit03.lesson03.teach.abuelos:
    title: Бабушка и дедушка
    gloss: бабушка и дедушка
    note: '*Abuelos* (мужской род, множественное число) обозначает и смешанную пару — так же, как *padres* и *hermanos*.'
  es.a1.unit03.lesson03.teach.tio:
    title: Дядя
    gloss: дядя
    note: В слове *tío* пишется акцент, потому что ударение падает на *í*; без него сочетание гласных читалось бы как дифтонг.
  es.a1.unit03.lesson03.teach.tia:
    title: Тётя
    gloss: тётя
    note: В слове *tía* акцент ставится так же, как в *tío*, и по той же причине.
  es.a1.unit03.lesson03.teach.primo:
    title: Двоюродный брат
    gloss: двоюродный брат
    note: '*Primo* — мужской род, единственное число. Как и в русском, в испанском слово различает пол двоюродного родственника: primo — брат, prima — сестра.'
  es.a1.unit03.lesson03.teach.prima:
    title: Двоюродная сестра
    gloss: двоюродная сестра
    note: '*Prima* — женский род, единственное число.'
  es.a1.unit03.lesson03.teach.mis_abuelos:
    title: Мои бабушка и дедушка
    gloss: мои бабушка и дедушка
    note: '*Mis* — форма множественного числа от *mi*. Она нужна всегда, когда существительное стоит во множественном числе, независимо от его рода.'
  es.a1.unit03.lesson04.teach.cuantos_hermanos_tienes:
    title: Спросить, сколько братьев и сестёр
    gloss: Сколько у тебя братьев и сестёр?
    note: '*Cuántos* (мужской род, множественное число, так как *hermanos* включает и смешанную группу) согласуется с существительным, о количестве которого спрашивают.'
  es.a1.unit03.lesson04.teach.somos_cinco:
    title: Сказать, сколько вас в семье
    gloss: Нас дома пятеро.
    note: '*Somos* («мы есть») — естественный способ назвать общее число людей в доме. Испанцы говорят «мы пятеро», а не переводят слово в слово «есть пятеро».'
  es.a1.unit03.lesson04.teach.mi_familia_es_grande:
    title: Описать большую семью
    gloss: У меня большая семья.
    note: '*Grande* здесь относится к слову *familia* (женский род), но форма *grande* остаётся той же, что и при существительных мужского рода: прилагательные на -e, такие как *grande*, не меняются по роду.'
  es.a1.unit03.lesson04.teach.tengo_muchos_primos:
    title: Сказать, что у тебя много двоюродных братьев и сестёр
    gloss: У меня много двоюродных братьев и сестёр.
    note: Используется *muchos* (мужской род, множественное число), потому что *primos*, как *hermanos* и *padres*, может обозначать смешанную группу.
  es.a1.unit03.lesson04.teach.vives_cerca_de_tus_padres:
    title: Спросить, живёт ли человек рядом с родителями
    gloss: Ты живёшь рядом с родителями?
    note: '*Tus* — форма множественного числа от *tu*; она нужна, потому что *padres* стоит во множественном числе.'
  es.a1.unit03.lesson04.teach.vivo_con_mis_abuelos:
    title: Сказать, с кем ты живёшь
    gloss: Я живу с бабушкой и дедушкой.
    note: '*Con* («с») вводит тех, с кем человек живёт; *vivo* — форма *yo* глагола *vivir*, которая уже встречалась в первом разделе: *vivo en Londres*.'
  es.a1.unit03.lesson05.teach.profile_reading:
    title: Рассказ Элены о семье
    gloss: 'Меня зовут Элена. Мне тридцать один год, и я живу с бабушкой и дедушкой в Испании. Мои мама и папа живут в Барселоне. У меня есть сестра и брат: нас дома пятеро. Мою младшую сестру зовут София, ей двадцать лет.'
    note: В этом рассказе слова и конструкции из уроков 1–4 собраны в связный короткий текст, а не в отдельные предложения. Это тот же навык — понять, кто есть кто, — на котором строится проверка чтения в этом разделе.
    glosses:
      llamo: зовут (от llamarse)
      Tengo: мне / у меня есть (от tener)
      treinta: тридцать
      años: лет (о возрасте)
      vivo: живут (от vivir)
      abuelos: бабушка и дедушка
      madre: мать
      padre: отец
      viven: живут (от vivir)
      hermana: сестра
      hermano: брат
      somos: мы есть (от ser)
      cinco: пять
      casa: дом
      menor: младшая
      tiene: зовут / ей (от tener)
      veinte: двадцать
  es.a1.unit03.lesson05.teach.hermana_menor:
    title: Младшая сестра
    gloss: младшая сестра
    note: '*Menor* («младший») стоит после существительного, к которому относится, и по родам не изменяется.'
  es.a1.unit03.lesson05.teach.vive_third_person:
    title: Живёт (третье лицо)
    gloss: живёт
    note: '*Vive* — форма 3-го лица единственного числа от *vivir*. Её используют, когда говорят О ком-то (*Elena vive*...), а не от своего лица (*vivo*; эта форма впервые встретилась в уроке 4 первого раздела и снова в уроке 4 этого раздела).'
  es.a1.unit03.lesson05.teach.sus_third_person_plural:
    title: Её/его/их (существительное во мн. числе)
    gloss: её/его/их
    note: '*Sus* — форма множественного числа от *su*. Как *su* означает «его/её/ваш (вежливое)» при существительном в единственном числе, так sus употребляется при множественном: *sus abuelos* — «её бабушка и дедушка», когда речь об Элене в третьем лице.'
  es.a1.unit03.lesson06.teach.line01:
    title: Показать семейные фото
    gloss: Элена показывает Матео фото и представляет родителей и младшую сестру.
    note: '*Estos son* («это», мужской или смешанный род, мн. число) представляет родителей; *esta es* («это», женский род, ед. число) представляет сестру.'
  es.a1.unit03.lesson06.teach.line02:
    title: Отреагировать и спросить о братьях и сёстрах
    gloss: Матео тепло реагирует и спрашивает, есть ли у неё ещё братья или сёстры.
    note: '*Qué bonito* — тёплая, естественная реакция на фотографию; по роли похоже на *Qué bien* из первого раздела.'
  es.a1.unit03.lesson06.teach.line03:
    title: Назвать состав семьи и задать вопрос в ответ
    gloss: Элена говорит, что у неё есть сестра и брат и что их дома пятеро, а потом спрашивает о семье Матео.
    note: '*Somos cinco en casa* называет общее число людей в доме — продолжение модели из урока 4.'
  es.a1.unit03.lesson06.teach.line04:
    title: Описать семью поменьше
    gloss: 'Матео говорит, что его семья меньше: их всего трое — родители и он, — но у него много двоюродных братьев и сестёр.'
    note: '*Pero* («но») показывает контраст между маленькой близкой семьёй и многочисленной roднёй.'
  es.a1.unit03.lesson06.teach.line05:
    title: Спросить, живут ли родители рядом
    gloss: Элена спрашивает, живёт ли Матео рядом с родителями.
    note: '*Cerca de* («рядом с», «недалеко от») — распространённый способ сказать о близком расстоянии.'
  es.a1.unit03.lesson06.teach.line06:
    title: Объяснить, что вы далеко, но на связи
    gloss: 'Матео отвечает «нет»: родители живут в Колумбии, а они каждую неделю говорят по телефону.'
    note: 'Продолжение факта из первого раздела: Матео родом из Колумбии, но живёт в Лондоне, а его родители остались в Колумбии.'
  es.a1.unit03.lesson06.teach.line07:
    title: Выразить понимание и рассказать о себе
    gloss: Элена говорит, что понимает, и добавляет, что живёт здесь, в Испании, с бабушкой и дедушкой.
    note: '*Entiendo* («понимаю») — короткий естественный способ отреагировать на сказанное, прежде чем рассказать что-то своё по теме.'
  es.a1.unit03.lesson06.teach.line08:
    title: Закончить разговор добрым замечанием
    gloss: Матео говорит, как хорошо, когда семья рядом.
    note: '*Qué bien tener a la familia cerca* завершает разговор тёплой, задумчивой нотой и перекликается с *qué bien* и *qué bonito* в этом диалоге.'
