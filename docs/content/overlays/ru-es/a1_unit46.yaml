teaching:
  es.a1.unit46.lesson01.teach.no_me_siento:
    title: Плохое самочувствие
    gloss: Я плохо себя чувствую.
    note: '*Sentirse* — возвратный глагол (*me siento*, *te sientes*); *no me siento bien* — общий, мягкий способ сказать, что что-то не так.'
  es.a1.unit46.lesson01.teach.enfermo:
    title: Больной
    gloss: больной
    note: 'Базовое прилагательное, которое употребляется с *estar* (для состояний): *estoy enfermo*.'
    example_gloss: Я болен.
  es.a1.unit46.lesson01.teach.estoy_enfermo:
    title: Быть больным
    gloss: Я болен.
    note: '*Enfermo* обозначает более общее и более сильное состояние, чем *no me siento bien*; слово меняется в зависимости от пола говорящего (*enferma*).'
  es.a1.unit46.lesson01.teach.dolor_de_cabeza:
    title: Головная боль
    gloss: головная боль
    note: 'В испанском *dolor de cabeza* употребляется с *tener* и без артикля: *tengo dolor de cabeza*. В русском же говорят «у меня болит голова» — конструкция другая.'
    example_gloss: У меня болит голова.
  es.a1.unit46.lesson01.teach.tengo_dolor_de:
    title: У меня болит голова
    gloss: У меня болит голова.
    note: 'Симптомы употребляются с *tener* («иметь»): *tengo dolor de cabeza*. Буквально это «у меня боль головы», а по-русски естественнее сказать «у меня болит голова».'
  es.a1.unit46.lesson01.teach.dolor_de_estomago:
    title: Боль в животе
    gloss: боль в животе
    note: 'Та же модель без артикля, что и *dolor de cabeza*: *dolor de estómago*.'
    example_gloss: У меня болит живот.
  es.a1.unit46.lesson01.teach.tengo_dolor_de_2:
    title: У меня болит живот
    gloss: У меня болит живот.
    note: Здесь та же модель с *tener*, что и в *dolor de cabeza*.
  es.a1.unit46.lesson02.teach.que_pasa:
    title: Общий вопрос
    gloss: Что случилось?
    note: Универсальный способ спросить, не случилось ли чего.
  es.a1.unit46.lesson02.teach.que_te_pasa:
    title: Распространённое выражение
    gloss: Что с тобой?
    note: '*¿Qué te pasa?* — естественный способ спросить, что не так (буквально «что происходит с тобой?»); не переводи дословно.'
  es.a1.unit46.lesson02.teach.dolor_de_garganta:
    title: Боль в горле
    gloss: боль в горле
    note: 'Та же модель, что и в *dolor de cabeza* и *dolor de estómago*: *dolor de garganta*.'
    example_gloss: У меня болит горло.
  es.a1.unit46.lesson02.teach.tengo_dolor_de:
    title: У меня болит горло
    gloss: У меня болит горло.
    note: Здесь та же модель с *tener*, что и у других симптомов.
  es.a1.unit46.lesson02.teach.estas_bien_no:
    title: Спросить, как дела у человека
    gloss: Ты в порядке? Нет, я плохо себя чувствую.
    note: '*¿Estás bien?* — очень распространённый разговорный вопрос между друзьями; с тем, к кому обращаются на *usted*, он превращается в *¿Está bien?*.'
  es.a1.unit46.lesson03.teach.fiebre:
    title: Температура
    gloss: температура
    note: 'Как и другие симптомы, употребляется без артикля после *tener*: *tengo fiebre*.'
    example_gloss: У меня температура.
  es.a1.unit46.lesson03.teach.tengo_fiebre:
    title: У меня температура
    gloss: У меня температура.
    note: Здесь действует модель с *tener*.
  es.a1.unit46.lesson03.teach.resfriado:
    title: Простуда
    gloss: простуженный / быть простуженным
    note: '*Resfriado* — прилагательное, которое употребляется с *estar*; можно также сказать *tengo un resfriado*, где *resfriado* — существительное.'
    example_gloss: У меня простуда.
  es.a1.unit46.lesson03.teach.estoy_resfriado:
    title: Сказать, что ты простудился
    gloss: У меня простуда.
    note: В испанском говорят *estoy resfriado* (прилагательное), буквально «я простужен», и это близко к русскому «я простужен»; прилагательное меняется в зависимости от пола говорящего (*resfriada*).
  es.a1.unit46.lesson03.teach.enfermo_y_resfriado:
    title: Estar или tener — зависит от типа слова
    gloss: 'Enfermo и resfriado — прилагательные, они употребляются с estar: я болен, я простужен. Fiebre и dolor de cabeza — существительные, они употребляются с tener: у меня температура, у меня болит голова.'
    note: 'Выбор между *estar* и *tener* зависит от типа слова: прилагательные (*enfermo*, *resfriado*) употребляются с *estar*, существительные-симптомы (*fiebre*, *dolor de cabeza*) — с *tener*.'
  es.a1.unit46.lesson04.teach.la_farmacia:
    title: Аптека
    gloss: аптека
    note: 'Существительное женского рода: *la farmacia*.'
    example_gloss: Я иду в аптеку.
  es.a1.unit46.lesson04.teach.en_que_puedo:
    title: Приветствие фармацевта
    gloss: Чем могу вам помочь?
    note: '*¿En qué puedo ayudarle?* — стандартный вежливый вопрос работника сферы обслуживания; в *ayudarle* используется местоимение *le* вежливой формы *usted*.'
  es.a1.unit46.lesson04.teach.tiene_algo_para:
    title: Попросить средство от симптома
    gloss: У вас есть что-нибудь от головной боли?
    note: '*Algo para* + симптом — естественный способ попросить лекарство: *algo para el dolor de cabeza*.'
  es.a1.unit46.lesson04.teach.una_pastilla:
    title: Таблетка
    gloss: таблетка
    note: 'Существительное женского рода: *la pastilla*; *una pastilla* — это таблетка.'
    example_gloss: Я принимаю таблетку.
  es.a1.unit46.lesson04.teach.toma_una_pastilla:
    title: Указания по приёму
    gloss: Принимай таблетку два раза в день.
    note: '*Toma* — неформальный повелительное наклонение глагола *tomar* («принимать»), его используют в инструкциях.'
  es.a1.unit46.lesson04.teach.en_la_farmacia:
    title: Обращение в аптеке
    gloss: В аптеке используется вежливая форма usted.
    note: 'Фармацевт — незнакомый взрослый человек, с которым ты общаешься в сфере обслуживания, поэтому используется *usted*: *¿Tiene algo...?*, а не *¿Tienes algo...?*.'
  es.a1.unit46.lesson05.teach.consejo_toma_una:
    title: Прочитай совет в аптеке
    gloss: 'Совет: принимай по одной таблетке два раза в день, запивая водой. Хорошо отдыхай и пей много воды. Если через три дня всё ещё плохо себя чувствуешь? Тогда иди к врачу.'
    note: Обрати внимание на дозировку, две рекомендации, не связанные с лекарством, и на то, когда нужно идти к врачу.
    glosses:
      Consejo: совет
      toma: принимай
      veces: раза
      día: день
      pastilla: таблетка
      Descansa: отдыхай
      bebe: пей
      sentirte: чувствовать себя
      sigues: всё ещё
      bien: хорошо
      médico: врач
  es.a1.unit46.lesson06.teach.elena_hola_mateo:
    title: Элена интересуется самочувствием
    gloss: 'Элена: Привет, Матео, как дела? Тебе уже лучше?'
    note: '*Ya* («уже») показывает, что Элена спрашивает, стало ли Матео лучше с их последнего разговора; *te sientes* — форма *tú* глагола *sentirse*.'
  es.a1.unit46.lesson06.teach.mateo_todavia_no:
    title: Матео всё ещё нездоровится
    gloss: 'Матео: Пока не очень. У меня всё ещё болит голова, и я устал.'
    note: '*Sigo con* («у меня всё ещё») показывает, что головная боль не прошла; *cansado* («усталый») — новое полезное прилагательное, которое меняется по роду (*cansada*).'
  es.a1.unit46.lesson06.teach.elena_has_tomado:
    title: Элена спрашивает о лекарстве
    gloss: 'Элена: Ты принял таблетку?'
    note: '*Has tomado* — это перфект (pretérito perfecto): *has* + причастие *tomado*, та же модель, что и в *me has ayudado*.'
  es.a1.unit46.lesson06.teach.mateo_si_he:
    title: Матео подтверждает
    gloss: 'Матео: Да, я принял таблетку. Сейчас пойду отдыхать.'
    note: '*Voy a descansar* («я собираюсь отдохнуть») — ближайшее будущее: *ir a* + инфинитив.'
  es.a1.unit46.lesson06.teach.elena_buena_idea:
    title: Элена желает ему выздоровления
    gloss: 'Элена: Хорошая мысль. Хорошенько отдохни. Выздоравливай!'
    note: '*¡Que te mejores!* — устойчивое выражение, которым желают скорого выздоровления; в нём используется сослагательное наклонение *mejores*.'
  es.a1.unit46.lesson06.teach.mateo_gracias_hasta:
    title: Матео прощается
    gloss: 'Матео: Спасибо, до завтра!'
    note: '*Hasta mañana* построено по модели *hasta* + время, как и прощание *hasta luego*.'
