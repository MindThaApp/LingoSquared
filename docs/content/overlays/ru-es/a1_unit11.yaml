teaching:
  es.a1.unit11.lesson01.teach.la_camisa:
    title: Рубашка
    gloss: рубашка
    note: '*Camisa* — существительное женского рода.'
    example_gloss: Мне нравится эта рубашка.
  es.a1.unit11.lesson01.teach.el_pantalon:
    title: Брюки
    gloss: брюки
    note: '*Pantalón* в испанском стоит в единственном числе, хотя по-русски «брюки» — только во множественном.'
    example_gloss: Брюки стоят двадцать.
  es.a1.unit11.lesson01.teach.la_chaqueta:
    title: Куртка
    gloss: куртка
    note: '*Chaqueta* — существительное женского рода.'
    example_gloss: Мне нужна куртка на зиму.
  es.a1.unit11.lesson01.teach.los_zapatos:
    title: Туфли
    gloss: туфли
    note: '*Zapatos* стоит во множественном числе, как и русское «туфли».'
    example_gloss: Эти туфли удобные.
  es.a1.unit11.lesson01.teach.el_delantal:
    title: Фартук
    gloss: фартук
    note: '*Delantal* — существительное мужского рода; именно эта вещь нужна Елене и Матео для мастер-класса.'
    example_gloss: Нам нужен фартук для мастер-класса.
  es.a1.unit11.lesson02.teach.que_talla_usas:
    title: Спросить о размере
    gloss: Какой у тебя размер?
    note: '*¿Qué talla usas?* — стандартный вопрос о размере одежды.'
  es.a1.unit11.lesson02.teach.uso_la_talla_mediana:
    title: Назвать свой размер
    gloss: Я ношу средний размер.
    note: '*Uso* («я ношу») + *la talla* («размер») + слово, обозначающее сам размер.'
  es.a1.unit11.lesson02.teach.me_queda_bien:
    title: Сказать, что вещь подходит
    gloss: Мне это хорошо подходит.
    note: В *me queda bien* используется *quedar* («сидеть по размеру, подходить») — см. следующую грамматическую заметку.
  es.a1.unit11.lesson02.teach.me_queda_mal:
    title: Сказать, что вещь не подходит
    gloss: Мне это плохо подходит.
    note: 'Противоположность *me queda bien*: вместо *bien* стоит *mal*.'
  es.a1.unit11.lesson02.teach.queda_note:
    title: Quedar bien/mal
    gloss: Как quedar описывает посадку вещи, а не её общее качество.
    note: Смотри текст самой карточки.
    target_text: '*Me queda bien* («мне это хорошо подходит») строится с глаголом *quedar* («подходить, сидеть по размеру»), а не с *ser* или *estar*; буквально — «хорошо остаётся на мне». *Bien* и *mal* здесь описывают, как вещь сидит, а не её качество.'
  es.a1.unit11.lesson03.teach.cuanto_cuesta_este_delantal:
    title: Спросить цену фартука
    gloss: Сколько стоит этот фартук?
    note: Модель *¿Cuánto cuesta?* с названием конкретной вещи и словом *este* («этот»).
  es.a1.unit11.lesson03.teach.cuesta_doce:
    title: Назвать цену
    gloss: Это стоит двенадцать.
    note: '*Cuesta* + число называет цену.'
  es.a1.unit11.lesson03.teach.este_vs_esta_note:
    title: Este и esta
    gloss: Как указательное слово согласуется с родом существительного.
    note: Смотри текст самой карточки.
    target_text: '*Este* («этот», мужской род) согласуется с *el delantal*, а *esta* («эта», женский род) — с *esta camisa*: указательное слово меняется по роду существительного, как и любое прилагательное.'
  es.a1.unit11.lesson04.teach.me_gusta_este:
    title: Сказать, что нравится этот
    gloss: Мне нравится этот.
    note: '*Este* здесь стоит отдельно, как местоимение («этот»), и указывает на предмет, который только что упомянули.'
  es.a1.unit11.lesson04.teach.voy_a_comprarlo:
    title: Скажи, что купишь это
    gloss: Я собираюсь это купить.
    note: '*Voy a* + инфинитив — конструкция ближайшего будущего; в *comprarlo* местоимение-дополнение *lo* («его») присоединяется к инфинитиву *comprar*.'
  es.a1.unit11.lesson04.teach.compramos_dos:
    title: Скажи, что вы покупаете два
    gloss: Мы покупаем два.
    note: '*Compramos* («мы покупаем») — форма *nosotros*; её используют, когда Елена и Матео решают вместе.'
  es.a1.unit11.lesson05.teach.precios_reading:
    title: Читаем прайс-лист
    gloss: 'В этом магазине рубашка стоит пятнадцать, брюки стоят двадцать, куртка стоит тридцать, а туфли стоят двадцать пять. Фартук самый дешёвый: он стоит всего двенадцать.'
    note: 'Прайс-лист магазина: *cuesta* («стоит») для одного предмета, *cuestan* («стоят») для множественного числа, как *los zapatos*.'
    glosses:
      tienda: магазин
      camisa: рубашка
      cuesta: стоит
      quince: пятнадцать
      pantalón: брюки
      veinte: двадцать
      chaqueta: куртка
      treinta: тридцать
      zapatos: туфли
      cuestan: стоят
      veinticinco: двадцать пять
      delantal: фартук
      barato: дешёвый
      solo: только, всего
      doce: двенадцать
  es.a1.unit11.lesson05.teach.el_mas_barato_note:
    title: El más barato (самый дешёвый)
    gloss: 'Как образуется превосходная степень: el/la + más + прилагательное.'
    note: 'El más barato («самый дешёвый») — превосходная степень: el/la + más + прилагательное, а de/en называет группу, с которой сравнивают. В этом уроке полная модель сравнения ещё не изучается, только эта частая фраза для покупок.'
    target_text: '*El más barato* («самый дешёвый») — превосходная степень: *el/la* + *más* + прилагательное, а группа, с которой сравнивают, вводится через *de/en*. В этом уроке полная модель сравнения ещё не изучается, только эта частая фраза для покупок.'
  es.a1.unit11.lesson06.teach.line01:
    title: Скажи, что вам нужно
    gloss: Елена говорит, что им нужны фартуки для мастер-класса.
    note: '*Delantales* — множественное число от *el delantal*.'
  es.a1.unit11.lesson06.teach.line02:
    title: Согласись и предложи магазин
    gloss: Матео соглашается и предлагает пойти в тот магазин.
    note: '*Tienes razón* значит «ты прав»; *esa tienda* — «тот магазин».'
  es.a1.unit11.lesson06.teach.line03:
    title: Продавец здоровается
    gloss: Продавец здоровается и предлагает помощь.
    note: '*¿Los ayudo?* («Вам помочь?») — стандартное приветствие продавца; оно обращено сразу к Елене и Матео.'
  es.a1.unit11.lesson06.teach.line04:
    title: Скажи, что вы ищете
    gloss: Елена отвечает «да» и говорит, что они ищут фартуки.
    note: '*Buscamos* («мы ищем») — форма *nosotros* глагола *buscar*.'
  es.a1.unit11.lesson06.teach.line05:
    title: Продавец показывает варианты и спрашивает размер
    gloss: Продавец показывает фартуки и спрашивает их размер.
    note: 'В *¿Qué talla usan?* стоит форма множественного числа *usan* («вы носите»): вопрос обращён к обоим, в отличие от формы единственного числа *usas*.'
  es.a1.unit11.lesson06.teach.line06:
    title: Назови свой размер
    gloss: Матео говорит, что носит средний размер.
    note: '*Uso la talla mediana* — ответ на вопрос *¿Qué talla usan?* от своего лица.'
  es.a1.unit11.lesson06.teach.line06b:
    title: Елена соглашается
    gloss: Елена говорит, что у неё тот же размер.
    note: '*Yo también* значит «я тоже».'
  es.a1.unit11.lesson06.teach.line07:
    title: Спроси цену
    gloss: Матео спрашивает, сколько стоит фартук.
    note: '*Este* («этот») указывает на фартук, который перед ним.'
  es.a1.unit11.lesson06.teach.line07b:
    title: Назови цену
    gloss: Продавец говорит, что он стоит двенадцать.
    note: '*Cuesta* + число называет цену.'
  es.a1.unit11.lesson06.teach.line08:
    title: Подтверди, что подходит, и решай купить
    gloss: Елена говорит, что фартук ей хорошо сидит, нравится, и она его купит.
    note: Подряд соединены *me queda bien*, *me gusta este* и *voy a comprarlo*.
  es.a1.unit11.lesson06.teach.line09:
    title: Согласись и купи два
    gloss: Матео говорит, что ему тоже хорошо сидит, и они покупают два.
    note: '*A mí también* («мне тоже», с усилением) повторяет модель согласия с *también*, добавляя ударное местоимение; *compramos dos* завершает сцену.'
