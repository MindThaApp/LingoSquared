answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: Испанский язык A1
  description: 'Испанский для начинающих: как предлагать, принимать, отклонять и согласовывать простые планы, читать и писать о них.'
units:
  es.a1.unit50.plans:
    title: Простые планы
lessons:
  es.a1.unit50.lesson01.proponer_una_actividad:
    title: Предлагаем занятие
  es.a1.unit50.lesson02.aceptar_o_rechazar_un:
    title: Принять или отклонить план
  es.a1.unit50.lesson03.quedar_un_dia_y:
    title: Договариваемся о дне и времени
  es.a1.unit50.lesson04.leer_una_invitacion:
    title: Читаем приглашение
  es.a1.unit50.lesson05.escribir_y_confirmar_un:
    title: Пишем и подтверждаем план
  es.a1.unit50.lesson06.elena_y_mateo_hacen:
    title: Элена и Матео строят план
teaching:
  es.a1.unit50.lesson01.teach.juntos:
    title: Вместе
    gloss: вместе
    note: '*Juntos* показывает, что люди делают что-то вместе; слово согласуется с людьми (*juntas*, если все — женщины).'
    example_gloss: Выпьем кофе вместе?
  es.a1.unit50.lesson01.teach.tomar_un_cafe:
    title: Выпить кофе
    gloss: выпить кофе
    note: По-испански говорят *tomar un café* (буквально «взять кофе»), а не «пить кофе».
  es.a1.unit50.lesson01.teach.ir_al_cine:
    title: Сходить в кино
    gloss: сходить в кино
    note: '*Ir al cine* (буквально «идти в кино») — обычный способ сказать, что идёшь смотреть фильм; *al* — это *a* + *el*.'
  es.a1.unit50.lesson01.teach.tomamos_un_cafe:
    title: Выпьем кофе?
    gloss: Выпьем кофе?
    note: '*¿Tomamos ...?* — форма *nosotros* в настоящем времени, чтобы предложить что-то сделать вместе.'
  es.a1.unit50.lesson01.teach.tomamos_algo_es:
    title: Как использовать ¿Tomamos ...?
    gloss: ¿Tomamos + что-то? — обычный способ предложить сделать что-то вместе.
    note: 'Форма *nosotros* (*tomamos*) передаёт то же, что русское «давай» или «выпьем?»: *¿Tomamos un café?*'
  es.a1.unit50.lesson01.teach.tienes_ganas_de:
    title: Хочешь сходить в кино?
    gloss: Хочешь сходить в кино?
    note: '*¿Tienes ganas de ...?* — неформальный вопрос, хочется ли человеку что-то сделать; после *de* идёт инфинитив.'
  es.a1.unit50.lesson02.teach.si_que_bien:
    title: Да, здорово!
    gloss: Да, здорово!
    note: '*¡Sí, qué bien!* — короткое радостное согласие.'
  es.a1.unit50.lesson02.teach.buena_idea:
    title: Хорошая идея
    gloss: Хорошая идея!
    note: '*¡Buena idea!* — согласие через похвалу предложения.'
  es.a1.unit50.lesson02.teach.es_un_buen:
    title: Это хороший план
    gloss: Это хороший план.
    note: Это чуть более развёрнутый положительный ответ.
  es.a1.unit50.lesson02.teach.lo_siento_no:
    title: Отказ с причиной
    gloss: Извини, не могу, потому что работаю.
    note: '*Lo siento* смягчает отказ, а *porque* вводит короткую причину.'
  es.a1.unit50.lesson02.teach.no_tengo_tiempo:
    title: У меня нет времени
    gloss: У меня нет времени.
    note: '*No tengo tiempo* — прямая, но обычная причина для отказа; *no* стоит перед глаголом.'
  es.a1.unit50.lesson02.teach.lo_siento_no_2:
    title: Вежливый отказ
    gloss: Lo siento + no puedo + короткая причина — так отказ звучит дружелюбно.
    note: В разговоре причина необязательна, но с ней отказ звучит полезнее и вежливее.
  es.a1.unit50.lesson03.teach.quedar:
    title: Договориться о встрече
    gloss: договориться о встрече
    note: '*Quedar* значит договориться о встрече: *¿Quedamos el viernes?* Многие в Латинской Америке вместо этого говорят *¿Nos vemos el viernes?*'
    example_gloss: Встретимся в пятницу в 2:30?
  es.a1.unit50.lesson03.teach.quedamos_el_viernes:
    title: Встреча в пятницу в половине третьего
    gloss: Встретимся в пятницу в 2:30?
    note: Здесь соединяются день недели *el viernes* и *a las* с указанием времени.
  es.a1.unit50.lesson03.teach.las_dos_y:
    title: Y media значит «половина»
    gloss: las dos y media = 2:30; a las dos y media указывает время встречи.
    note: 'Как и в русском «половина третьего», испанский отсчитывает от часа, но по-другому: *las dos y media* — это 2:30, буквально «два с половиной».'
  es.a1.unit50.lesson03.teach.el_viernes_17:
    title: Дата и время
    gloss: в пятницу, 17 апреля, в 3:15
    note: 'Как и в русском, дни недели и месяцы пишутся со строчной буквы, а в датах используется *de*: *el viernes 17 de abril*.'
  es.a1.unit50.lesson03.teach.si_el_viernes:
    title: Подтверждаем время
    gloss: Да, пятница в 2:30 — мне подходит.
    note: '*Me viene bien* (буквально «мне подходит») подтверждает, что предложенное время устраивает.'
  es.a1.unit50.lesson04.teach.el_mensaje_la:
    title: Сообщение, приглашение, языковое кафе
    gloss: сообщение, приглашение, языковое кафе
    note: '*Un mensaje* — короткое письменное или электронное сообщение, *una invitación* зовёт присоединиться к занятию, а *el café de idiomas* — место встречи группы.'
    example_gloss:
    - У меня сообщение от Элены.
    - Это приглашение в языковое кафе.
    - Мы пьём кофе в языковом кафе.
  es.a1.unit50.lesson04.teach.hola_mateo_tienes:
    title: Приглашение от Элены
    gloss: Привет, Матео, хочешь выпить кофе в языковом кафе в субботу, 18 апреля, в 2:30? С уважением, Элена.
    note: 'Найди в тексте четыре детали: занятие, дату, время и место.'
    glosses:
      Hola: привет
      ganas: желание (tener ganas de = хотеться, быть настроенным)
      sábado: суббота
      abril: апрель
      media: половина (y media = половина часа)
      dos: два
      café: кофе
      tomar: пить / выпить
      idiomas: языковое кафе
      saludo: с уважением
  es.a1.unit50.lesson05.teach.hola_mateo_vamos:
    title: Сообщение с предложением
    gloss: Привет, Матео! Выпьем кофе в пятницу в 2:30? С уважением, Елена.
    note: В сообщении есть приветствие, предложение, день, время и прощание.
    glosses:
      Hola: привет
      vamos: (вопрос-предложение) может, давай
      viernes: пятница
      media: половина (y media = половина)
      dos: два
      café: кофе
      tomar: пить / выпить
      saludo: с уважением
  es.a1.unit50.lesson05.teach.hola_elena_si:
    title: Сообщение с подтверждением
    gloss: Привет, Елена! Да, здорово! В пятницу в 2:30 мне подходит. До пятницы! Матео.
    note: В ответе Матео принимает предложение и повторяет время встречи, чтобы подтвердить его.
    glosses:
      Hola: привет
      bien: здорово / отлично
      viernes: пятница
      media: половина (y media = половина)
      dos: два
      viene: хорошо / подходит
      Hasta: до / до встречи
  es.a1.unit50.lesson05.teach.un_mensaje_corto:
    title: Что входит в сообщение
    gloss: В коротком сообщении указывают, что делать, в какой день или дату и во сколько.
    note: Приветствие и прощание полезны, но главное — что вы будете делать и когда.
  es.a1.unit50.lesson06.teach.elena_tomamos_un:
    title: Елена предлагает выпить кофе
    gloss: 'Елена: Выпьем кофе в пятницу? Матео: Да, здорово! Во сколько?'
    note: Матео сначала соглашается, а потом спрашивает время.
  es.a1.unit50.lesson06.teach.elena_a_las:
    title: Первое время Елены
    gloss: 'Елена: В 2:30.'
    note: '*Las dos y media* означает 2:30, как в уроке про время.'
  es.a1.unit50.lesson06.teach.mateo_lo_siento:
    title: Матео предлагает другое время
    gloss: 'Матео: Извини, в 2:30 не могу. Можно в 3:15?'
    note: '*¿Puede ser a ...?* — краткий способ спросить, подойдёт ли другое время.'
  es.a1.unit50.lesson06.teach.elena_si_a:
    title: Они подтверждают окончательный план
    gloss: 'Елена: Да, в 3:15 мне подходит. Матео: Отличный план. Тогда встречаемся в пятницу в 3:15.'
    note: Здесь *quedamos* — снова форма *nosotros*, теперь она подтверждает план.
exercises:
