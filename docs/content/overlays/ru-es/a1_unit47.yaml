teaching:
  es.a1.unit47.lesson01.teach.llamar:
    title: Звонить
    gloss: звонить
    note: Инфинитив глагола, которым обозначают звонок по телефону.
    example_gloss: Мне нужно тебе позвонить.
  es.a1.unit47.lesson01.teach.te_llamo:
    title: Говорим, что позвоним
    gloss: Я тебе позвоню.
    note: '*Llamo* — форма *yo* глагола *llamar*; с *te* это значит «я тебе звоню». Как и в русском («я тебе позвоню» о ближайшем будущем), испанский здесь часто использует настоящее время.'
  es.a1.unit47.lesson01.teach.hola_soy_elena:
    title: Отвечаем на звонок
    gloss: Алло, это Элена.
    note: 'По телефону по-испански представляются так: *soy* + имя (буквально «я есть»), а не «это такой-то».'
  es.a1.unit47.lesson01.teach.hola_soy_mateo:
    title: Матео отвечает так же
    gloss: Алло, это Матео.
    note: Та же модель *soy* + имя, что и в *Hola, soy Elena*.
  es.a1.unit47.lesson02.teach.con_quien_hablo:
    title: Спрашиваем, кто звонит
    gloss: С кем я разговариваю?
    note: '*¿Con quién hablo?* — стандартная фраза, когда ты не знаешь, кто звонит.'
  es.a1.unit47.lesson02.teach.habla_con_elena:
    title: Представляемся официально
    gloss: Вы говорите с Эленой.
    note: '*Habla con* + имя — вежливая форма *usted* глагола *hablar*: официальный вариант *soy* + имя.'
  es.a1.unit47.lesson03.teach.puedes_repetir_eso:
    title: Просим повторить
    gloss: Ты можешь повторить?
    note: '*¿Puedes...?* («Ты можешь...?») + *repetir* («повторить») + *eso* («это»).'
  es.a1.unit47.lesson03.teach.no_hables_tan:
    title: Просим говорить помедленнее
    gloss: Не говори так быстро, пожалуйста.
    note: '*No hables* — отрицательный повелительный наклонение глагола *hablar* в неформальной форме; *tan rápido* («так быстро») указывает на степень.'
  es.a1.unit47.lesson03.teach.no_te_oigo:
    title: Говорим, что плохо слышно
    gloss: Я тебя плохо слышу.
    note: '*Oír* (слышать) с *no ... bien* (нехорошо) означает проблему со слухом, а не с пониманием: это не то же самое, что *entender* (понимать). *Te oigo* значит «я тебя слышу».'
  es.a1.unit47.lesson04.teach.el_mensaje:
    title: Сообщение
    gloss: сообщение
    note: 'Существительное мужского рода: *el mensaje*. Говорят также *el SMS* или *el texto*, но *mensaje* — нейтральный вариант. В русском «сообщение» среднего рода, а в испанском mensaje мужского.'
    example_gloss: Сообщение от Елены.
  es.a1.unit47.lesson04.teach.te_envio_un:
    title: Как сказать, что отправишь сообщение
    gloss: Я пришлю тебе сообщение.
    note: 'Местоимение *te* (тебе) стоит перед глаголом *enviar* (отправлять): *te envío un mensaje*.'
  es.a1.unit47.lesson04.teach.te_llamo_mas:
    title: Как сказать, что перезвонишь
    gloss: Я позвоню тебе позже.
    note: '*Más tarde* (позже) стоит в конце предложения: *te llamo más tarde*.'
  es.a1.unit47.lesson05.teach.mateo_hola_elena:
    title: Прочитай переписку
    gloss: 'Матео: Привет, Елена, можешь мне позвонить? Мне надо тебе кое-что рассказать. Елена: Да, конечно, я перезвоню тебе через пять минут.'
    note: Обрати внимание, о чём просит Матео, зачем и когда Елена обещает перезвонить.
    glosses:
      Hola: привет
      puedes: мочь
      llamarme: звонить
      Tengo: надо / должен
      algo: кое-что
      contarte: рассказать
      claro: конечно
      llamada: звонить
      cinco: пять
      minutos: минуты
      devuelvo: обратно
  es.a1.unit47.lesson06.teach.mateo_hola_soy:
    title: Матео отвечает на звонок
    gloss: 'Матео: Алло, это Матео.'
    note: 'Та же конструкция *soy* + имя, что и в первом уроке, теперь в настоящем телефонном разговоре: тот, кто берёт трубку, говорит первым и называет своё имя.'
  es.a1.unit47.lesson06.teach.elena_hola_mateo:
    title: Елена представляется
    gloss: 'Елена: Привет, Матео, это Елена. Матео: Спасибо, что позвонила!'
    note: '*Gracias por llamar* (спасибо, что позвонил/а) — это *gracias por* + инфинитив.'
  es.a1.unit47.lesson06.teach.elena_como_ha:
    title: Елена спрашивает про смену
    gloss: 'Елена: Как прошла твоя первая смена?'
    note: '*Ha ido* — перфект глагола *ir* (здесь «пройти, сложиться»): *ha* + причастие *ido*.'
  es.a1.unit47.lesson06.teach.mateo_ha_ido:
    title: Матео сообщает хорошие новости
    gloss: 'Матео: Всё прошло очень хорошо, лучше, чем я ожидал.'
    note: '*Ha ido muy bien* повторяет перфект из вопроса; *mejor de lo esperado* (лучше, чем ожидалось) — сравнение с *de lo*.'
  es.a1.unit47.lesson06.teach.ha_ido_ir:
    title: Ha ido, es, esperado и их инфинитивы
    gloss: ha ido → ir (идти), es → ser (быть), esperado → esperar (ждать, ожидать)
    note: '*Ha ido*, *es* и *esperado* показаны с инфинитивами: *ir*, *ser*, *esperar*. Пока воспринимай *ha ido muy bien* как готовое выражение; перфект мы разберём подробно позже.'
  es.a1.unit47.lesson06.teach.elena_que_bien:
    title: Елена гордится
    gloss: 'Елена: Как приятно это слышать! Я горжусь тобой.'
    note: '*Orgulloso/a de* (гордый кем-то) — устойчивое сочетание с *de*; прилагательное согласуется с говорящим (*orgullosa* — это говорит Елена).'
  es.a1.unit47.lesson06.teach.mateo_muchas_gracias:
    title: Матео тронут
    gloss: 'Матео: Большое спасибо, это много для меня значит.'
    note: '*Significa* — форма 3-го лица глагола *significar* (значить); *para mí* (для меня) показывает, для кого это важно.'
  es.a1.unit47.lesson06.teach.su_primer_turno:
    title: Его
    gloss: Его первая смена прошла очень хорошо.
    note: '*Su* здесь — притяжательное «его» (также «её», а с *usted* — «ваш»); чья это вещь, понятно из контекста.'
