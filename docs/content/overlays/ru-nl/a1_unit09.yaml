teaching:
  nl.a1.unit09.lesson01.teach.links_rechts:
    title: Лево и право
    gloss: слева, справа
    note: '*Links* значит «слева, налево», а *rechts* — «справа, направо».'
    example_gloss:
    - Банк слева.
    - Вокзал справа.
  nl.a1.unit09.lesson01.teach.linksaf_rechtsaf_rechtdoor:
    title: Налево, направо, прямо
    gloss: налево / поверни налево, направо / поверни направо, прямо
    note: '*Linksaf*, *rechtsaf* и *rechtdoor* пишутся слитно; в указаниях они обычно стоят после *sla*: *sla linksaf*, *sla rechtsaf*.'
    example_gloss:
    - Поверни налево.
    - Поверни направо.
    - Иди прямо.
  nl.a1.unit09.lesson02.teach.ga_sla_loop_tot:
    title: Иди, поверни, шагай, до
    gloss: иди, поверни, иди пешком, до
    note: '*Ga* говорит одному человеку идти, *sla* — повернуть, *loop* — идти пешком; *tot* указывает место, где заканчивается этот шаг маршрута.'
    example_gloss:
    - Иди прямо.
    - Поверни налево.
    - Дойди пешком до банка.
    - Иди прямо до вокзала.
  nl.a1.unit09.lesson02.teach.ga_rechtdoor:
    title: Иди прямо
    gloss: Иди прямо.
    note: После *ga* сразу идёт *rechtdoor*.
  nl.a1.unit09.lesson02.teach.sla_linksaf:
    title: Повернуть налево
    gloss: Поверни налево.
    note: '*Sla linksaf* — обычное короткое указание в устной речи.'
  nl.a1.unit09.lesson02.teach.sla_rechtsaf:
    title: Повернуть направо
    gloss: Поверни направо.
    note: '*Sla rechtsaf* — обычное короткое указание в устной речи.'
  nl.a1.unit09.lesson02.teach.loop_tot:
    title: Дойди пешком до
    gloss: Дойди пешком до ...
    note: 'После *tot* добавь место: *Loop tot de bank*.'
  nl.a1.unit09.lesson02.teach.imperative_note:
    title: Короткие формы команд
    gloss: 'В неформальной команде по-нидерландски обычно опускают jij или je, как и в русском «иди, поверни»: ga, sla, loop.'
    note: Такие команды подходят для общения Лотте и Омара. *Jij* и *je* не добавляй.
  nl.a1.unit09.lesson03.teach.supermarkt_station_review:
    title: Супермаркет и вокзал
    gloss: супермаркет, вокзал
    note: Вспомни *de supermarkt* и *het station* из урока 8. *Supermarkt* пишется слитно.
    example_gloss:
    - Как дойти до супермаркета?
    - Как отсюда дойти до вокзала?
  nl.a1.unit09.lesson03.teach.hoe_kom_ik_bij:
    title: Как дойти до ...?
    gloss: Как дойти до ...?
    note: Фразой *Hoe kom ik bij ...?* спрашивают, как пройти к нужному месту.
  nl.a1.unit09.lesson03.teach.ask_supermarket:
    title: Как дойти до супермаркета?
    gloss: Как дойти до супермаркета?
    note: 'Перед местом назначения ставится *bij*: *bij de supermarkt*.'
  nl.a1.unit09.lesson03.teach.vanaf_hier:
    title: Отсюда
    gloss: отсюда
    note: '*Vanaf hier* прямо указывает, откуда начинается путь.'
  nl.a1.unit09.lesson03.teach.ask_station_here:
    title: Как отсюда дойти до вокзала?
    gloss: Как отсюда дойти до вокзала?
    note: В таком естественном вопросе о маршруте *vanaf hier* стоит перед *bij het station*.
  nl.a1.unit09.lesson04.teach.bank_bibliotheek_review:
    title: Банк и библиотека
    gloss: банк, библиотека
    note: Вспомни *de bank* и *de bibliotheek* из урока 8.
    example_gloss:
    - Дойди до банка.
    - Библиотека напротив банка.
  nl.a1.unit09.lesson04.teach.straight_to_station:
    title: Иди прямо до вокзала
    gloss: Иди прямо до вокзала.
    note: Вокзал — конечная точка этого шага маршрута.
  nl.a1.unit09.lesson04.teach.right_at_station:
    title: Поверни направо у вокзала
    gloss: Поверни направо у вокзала.
    note: '*Bij* называет ориентир, у которого нужно повернуть.'
  nl.a1.unit09.lesson04.teach.walk_to_bank:
    title: Дойди до банка
    gloss: Дойди до банка.
    note: '*Loop* обозначает действие, а *tot de bank* — его конечную точку.'
  nl.a1.unit09.lesson04.teach.library_opposite:
    title: Библиотека напротив банка
    gloss: Библиотека напротив банка.
    note: Здесь снова используется *tegenover*, чтобы подтвердить место назначения после шага маршрута.
  nl.a1.unit09.lesson05.teach.buurtkaart_route:
    title: Карта района и маршрут
    gloss: карта района, маршрут
    note: Вспомни *buurtkaart* из урока 8 (пишется слитно); *de route* — это путь от начала до места назначения.
    example_gloss:
    - Вот карта района.
    - Это маршрут до супермаркета.
  nl.a1.unit09.lesson05.teach.start_doel:
    title: Старт и цель
    gloss: СТАРТ, ЦЕЛЬ
    note: '*START* показывает, где маршрут начинается, а *DOEL* — где он заканчивается.'
    example_gloss:
    - 'СТАРТ: библиотека.'
    - 'ЦЕЛЬ: супермаркет.'
  nl.a1.unit09.lesson05.teach.marked_route:
    title: Отмеченный маршрут
    gloss: 'СТАРТ: библиотека. Иди прямо до вокзала, затем поверни направо. ЦЕЛЬ: супермаркет. Супермаркет рядом с вокзалом, а банк рядом с супермаркетом.'
    note: В отмеченном маршруте всего два шага.
    glosses:
      BUURTKAART: КАРТА РАЙОНА
      START: СТАРТ
      bibliotheek: библиотека
      Route: маршрут
      ga: идти, ехать
      rechtdoor: прямо
      station: вокзал
      sla: поверни (повелительное наклонение)
      rechtsaf: направо
      DOEL: ЦЕЛЬ
      supermarkt: супермаркет
      naast: рядом с
      bank: банк
  nl.a1.unit09.lesson06.teach.taalcafe_review:
    title: Языковое кафе
    gloss: языковое кафе
    note: Вспомни *taalcafé* из прошлых уроков. Слово пишется слитно и с акцентом.
    example_gloss: Я здесь ради языкового кафе.
  nl.a1.unit09.lesson06.teach.question:
    title: Омар спрашивает дорогу
    gloss: 'Омар: Лотте, как мне дойти до супермаркета?'
    note: Омар задаёт Лотте неформальный вопрос о маршруте.
  nl.a1.unit09.lesson06.teach.directions:
    title: Лотте называет два шага
    gloss: 'Лотте: Иди прямо до вокзала. Поверни направо.'
    note: Ответ состоит из двух коротких указаний.
  nl.a1.unit09.lesson06.teach.location:
    title: Лотте уточняет, где это
    gloss: 'Лотте: Супермаркет рядом с вокзалом.'
    note: Фраза о расположении из урока 8 подтверждает, где маршрут заканчивается.
  nl.a1.unit09.lesson06.teach.closing:
    title: Омар благодарит Лотте
    gloss: 'Омар: Отлично, спасибо! Лотте: Пожалуйста!'
    note: Диалог заканчивается в неформальном тоне.
