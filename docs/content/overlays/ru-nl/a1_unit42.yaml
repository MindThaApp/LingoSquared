    title: Конструкция Ik wil graag
    gloss: '*Ik wil graag* + цвет показывает, какой цвет ты выбираешь: Я бы хотел(а) розовый.'
    note: 'Уже знакомая конструкция *Ik wil graag ...* из заказов (Ik wil graag appels, Ik wil graag een koffie) — новой грамматики нет, только новое применение. Цвета пока используются только так: как дополнение к *wil* или как именная часть после *zijn*, но не прямо перед существительным. В таком положении в нидерландском у слова-цвета меняется окончание (*rood* становится *rode*), а это правило в курсе ещё не изучается.'
