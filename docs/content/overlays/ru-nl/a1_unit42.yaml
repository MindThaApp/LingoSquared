    title: Нина и Лотте покупают тюльпаны
    gloss: Нина и Лотте в субботу идут на цветочный рынок. Какой цвет хочет Лотте? Лотте хочет красные. Какой цвет хочет Нина? Нина хочет жёлтые. Они покупают пять тюльпанов. Это стоит десять евро. Тюльпаны очень красивые!
