teaching:
  nl.a1.unit03.lesson01.teach.maandag_tot_woensdag:
    title: С понедельника по среду
    gloss: понедельник, вторник, среда
    note: Названия дней недели в нидерландском, как и в русском, обычно пишутся со строчной буквы.
    example_gloss:
    - Сегодня понедельник.
    - Сегодня вторник.
    - Сегодня среда.
  nl.a1.unit03.lesson01.teach.donderdag_vrijdag:
    title: Четверг, пятница
    gloss: четверг, пятница
    note: Donderdag и vrijdag продолжают ряд дней недели; они тоже пишутся со строчной буквы.
    example_gloss:
    - Сегодня четверг.
    - Языковое кафе в пятницу.
  nl.a1.unit03.lesson01.teach.zaterdag_zondag:
    title: Суббота, воскресенье
    gloss: суббота, воскресенье
    note: Zaterdag и zondag — выходные дни.
    example_gloss:
    - Сегодня суббота.
    - Сегодня воскресенье.
  nl.a1.unit03.lesson01.teach.ask_day:
    title: Как спросить, какой день недели
    gloss: Какой сегодня день?
    note: Welke dag ... спрашивает о дне недели, а не о числе в календаре.
  nl.a1.unit03.lesson01.teach.today_wednesday:
    title: Как назвать сегодняшний день недели
    gloss: Сегодня среда.
    note: Внутри предложения день недели остаётся со строчной буквы.
  nl.a1.unit03.lesson01.teach.lowercase_days:
    title: Дни недели со строчной буквы
    gloss: 'Дни обычно пишутся без заглавной буквы: понедельник, пятница.'
    note: Как и в русском, в нидерландском дни недели пишутся с заглавной буквы только в начале предложения.
  nl.a1.unit03.lesson02.teach.jan_mar:
    title: С января по март
    gloss: январь, февраль, март
    note: Названия месяцев в нидерландском, как и в русском, обычно пишутся со строчной буквы.
    example_gloss:
    - Мой день рождения в январе.
    - В феврале я изучаю нидерландский.
    - Мой день рождения в марте.
  nl.a1.unit03.lesson02.teach.apr_jun:
    title: С апреля по июнь
    gloss: апрель, май, июнь
    note: Нидерландское mei — это май, а juni — июнь.
    example_gloss:
    - В апреле я изучаю нидерландский.
    - Мой день рождения в мае.
    - В июне я изучаю нидерландский.
  nl.a1.unit03.lesson02.teach.jul_sep:
    title: С июля по сентябрь
    gloss: июль, август, сентябрь
    note: Нидерландские слова juli и juni различаются конечной гласной.
    example_gloss:
    - Мой день рождения в июле.
    - В августе я изучаю нидерландский.
    - Мой день рождения в сентябре.
  nl.a1.unit03.lesson02.teach.oct_dec:
    title: С октября по декабрь
    gloss: октябрь, ноябрь, декабрь
    note: В нидерландском oktober пишется через k, а не через ct.
    example_gloss:
    - В октябре я изучаю нидерландский.
    - Мой день рождения в ноябре.
    - В декабре я изучаю нидерландский.
  nl.a1.unit03.lesson02.teach.year:
    title: Год
    gloss: год
    note: Jaar — слово для календарного года.
    example_gloss: В этом году я изучаю нидерландский.
  nl.a1.unit03.lesson02.teach.lowercase_months:
    title: Месяцы со строчной буквы
    gloss: 'Месяцы обычно пишутся без заглавной буквы: апрель, сентябрь.'
    note: Как и в русском, в нидерландском названия месяцев пишутся со строчной буквы, кроме начала предложения.
  nl.a1.unit03.lesson03.teach.first_fourth:
    title: Первый — четвёртый
    gloss: '1–4: первое, второе, третье, четвёртое'
    note: Eerste, tweede и derde нужно выучить как есть; vierde образовано от vier.
    example_gloss:
    - Сегодня первое апреля.
    - Сегодня второе апреля.
    - Сегодня третье апреля.
    - Сегодня четвёртое апреля.
  nl.a1.unit03.lesson03.teach.fifth_eighth:
    title: Пятый — восьмой
    gloss: '5–8: пятое, шестое, седьмое, восьмое'
    note: 'Это формы для дат: vijfde, zesde, zevende и achtste.'
    example_gloss:
    - Сегодня пятое апреля.
    - Сегодня шестое апреля.
    - Сегодня седьмое апреля.
    - Сегодня 8 апреля 2026 года.
  nl.a1.unit03.lesson03.teach.ninth_twelfth:
    title: Девятый — двенадцатый
    gloss: '9–12: девятое, десятое, одиннадцатое, двенадцатое'
    note: Эти формы нужны для дат в начале месяца, которые встретятся дальше в уроке.
    example_gloss:
    - Сегодня девятое апреля.
    - Сегодня десятое апреля.
    - Сегодня одиннадцатое апреля.
    - Сегодня двенадцатое апреля.
  nl.a1.unit03.lesson03.teach.thirteenth_nineteenth:
    title: Тринадцатый — девятнадцатый
    gloss: '13–19: тринадцатое, четырнадцатое, пятнадцатое, шестнадцатое, семнадцатое, восемнадцатое, девятнадцатое'
    note: Эти порядковые числительные для дней, записанные словами, оканчиваются на -de.
    example_gloss:
    - Сегодня тринадцатое апреля.
    - Сегодня четырнадцатое апреля.
    - Сегодня пятнадцатое апреля.
    - Сегодня шестнадцатое апреля.
    - Сегодня семнадцатое апреля.
    - Сегодня восемнадцатое апреля.
    - Сегодня девятнадцатое апреля.
  nl.a1.unit03.lesson03.teach.twentieth_twenty_fourth:
    title: Двадцатый — двадцать четвёртый
    gloss: '20–24: двадцатое, двадцать первое, двадцать второе, двадцать третье, двадцать четвёртое'
    note: Начиная с twintig, эти порядковые формы оканчиваются на -ste и пишутся одним словом.
    example_gloss:
    - Сегодня двадцатое апреля.
    - Книгу нужно вернуть двадцать первого апреля.
    - Сегодня двадцать второе апреля.
    - Сегодня двадцать третье апреля.
    - Сегодня двадцать четвёртое апреля.
  nl.a1.unit03.lesson03.teach.twenty_fifth_twenty_ninth:
    title: Двадцать пятый — двадцать девятый
    gloss: '25–29: двадцать пятое, двадцать шестое, двадцать седьмое, двадцать восьмое, двадцать девятое'
    note: Эти составные порядковые числительные оканчиваются на -ste и пишутся одним словом.
    example_gloss:
    - Сегодня двадцать пятое апреля.
    - Сегодня двадцать шестое апреля.
    - Сегодня двадцать седьмое апреля.
    - Сегодня двадцать восьмое апреля.
    - Сегодня двадцать девятое апреля.
  nl.a1.unit03.lesson03.teach.thirtieth_thirty_first:
    title: Тридцатый и тридцать первый
    gloss: '30–31: тридцатое, тридцать первое'
    note: Это два последних возможных числа в месяце.
    example_gloss:
    - Сегодня тридцатое апреля.
    - Сегодня тридцать первое декабря.
  nl.a1.unit03.lesson03.teach.spoken_date:
    title: Как назвать дату порядковым числительным
    gloss: 3 апреля — третье апреля
    note: В этом уроке число произносится порядковым числительным, как и в русском; день в нидерландском стоит перед месяцем.
  nl.a1.unit03.lesson03.teach.on_date:
    title: Как сказать «такого-то числа»
    gloss: 3 апреля
    note: Если дата написана цифрами, пиши op 3 april; если порядковое числительное написано словом, пиши op de derde april.
  nl.a1.unit03.lesson04.teach.ask_date:
    title: Спросить календарную дату
    gloss: Какое сегодня число?
    note: Welke datum ... прямо спрашивает о календарной дате.
  nl.a1.unit03.lesson04.teach.ask_which_date:
    title: Спросить, какое сегодня число по счёту
    gloss: Какое сегодня число?
    note: De hoeveelste ... — распространённый разговорный способ спросить число месяца.
  nl.a1.unit03.lesson04.teach.date_answer:
    title: Назвать полную дату
    gloss: Сегодня 3 апреля 2026 года.
    note: 'Как и в русском, в нидерландской дате порядок такой: день, месяц, год. Название месяца april пишется со строчной буквы, как и в русском.'
  nl.a1.unit03.lesson04.teach.date_words:
    title: Назвать число порядковым числительным
    gloss: Сегодня третье апреля.
    note: 'Порядковое числительное, написанное словом, идёт с артиклем de: de derde april.'
  nl.a1.unit03.lesson04.teach.written_order:
    title: 'Порядок: день, месяц, год'
    gloss: 'день–месяц–год: 3 апреля 2026 или 3-4-2026'
    note: 'Цифровая запись не американская (месяц–день–год): 3-4-2026 означает 3 апреля 2026 года.'
  nl.a1.unit03.lesson04.teach.day_and_date:
    title: Назвать день недели и дату вместе
    gloss: Сегодня пятница, 10 апреля.
    note: Слова vrijdag и april пишутся со строчной буквы и в середине предложения. 10 апреля 2026 года действительно пятница.
  nl.a1.unit03.lesson05.teach.when:
    title: Когда
    gloss: когда
    note: Wanneer спрашивает, в какое время или в какую дату что-то происходит.
    example_gloss: Когда будет языковое кафе?
  nl.a1.unit03.lesson05.teach.book:
    title: Книга
    gloss: книга
    note: Здесь boek — это книга из библиотеки.
    example_gloss: У меня эта книга.
  nl.a1.unit03.lesson05.teach.due_date:
    title: Срок сдачи
    gloss: срок возврата
    note: Inleverdatum — это дата, до которой нужно что-то вернуть.
    example_gloss: Какой срок возврата у этой книги?
  nl.a1.unit03.lesson05.teach.ask_due:
    title: Спросить, когда нужно вернуть книгу
    gloss: Когда нужно вернуть книгу?
    note: Moet ... terug — простой естественный способ спросить, когда нужно вернуть взятую вещь.
  nl.a1.unit03.lesson05.teach.due_answer:
    title: Назвать срок возврата
    gloss: 21 апреля.
    note: 'Короткий ответ строится так: op, число и месяц со строчной буквы.'
  nl.a1.unit03.lesson05.teach.due_words:
    title: Назвать срок возврата словами
    gloss: Книгу нужно вернуть двадцать первого апреля.
    note: Если порядковое числительное написано словом, после op нужен артикль de.
  nl.a1.unit03.lesson05.teach.label:
    title: Прочитать надпись со сроком возврата
    gloss: 'Срок возврата: 21-4-2026'
    note: 'В такой цифровой записи порядок: день, месяц, год.'
  nl.a1.unit03.lesson06.teach.dialogue_day:
    title: Лотте спрашивает день недели
    gloss: 'Лотте: Какой сегодня день? Омар: Сегодня среда.'
    note: В ответе называется день недели.
  nl.a1.unit03.lesson06.teach.dialogue_date:
    title: Лотте спрашивает дату
    gloss: 'Лотте: А какое сегодня число? Омар: Восьмое апреля 2026 года.'
    note: В устном ответе по-нидерландски используется порядковое числительное de achtste, как и в русском («восьмое»). 8 апреля 2026 года действительно среда, как и в предыдущей реплике.
  nl.a1.unit03.lesson06.teach.next:
    title: Следующий
    gloss: следующий
    note: Volgende указывает на ближайшее следующее событие.
    example_gloss: Когда будет следующее языковое кафе?
  nl.a1.unit03.lesson06.teach.dialogue_next:
    title: Спросить дату следующей встречи
    gloss: 'Лотте: Когда следующее языковое кафе? Омар: В пятницу, 10 апреля.'
    note: В ответе стоят op, день недели со строчной буквы, число и месяц со строчной буквы. 10 апреля 2026 года действительно пятница, через два дня после 8-го.
  nl.a1.unit03.lesson06.teach.dialogue_close:
    title: Завершение разговора
    gloss: 'Лотте: Хорошо, до пятницы! Омар: До встречи!'
    note: Tot vrijdag называет день следующей встречи.
