teaching:
  nl.a1.unit04.lesson01.teach.hour:
    title: Час
    gloss: час
    note: '*Uur* стоит после числа, когда нужно назвать ровный час: *twee uur* — это два часа.'
    example_gloss: Сейчас два часа.
  nl.a1.unit04.lesson01.teach.two_oclock:
    title: Два часа
    gloss: 2:00 — два часа
    note: Для ровного часа назови число, а затем *uur*.
  nl.a1.unit04.lesson01.teach.three_oclock:
    title: Три часа
    gloss: 3:00 — три часа
    note: '*Drie uur* — это ровно 3:00.'
  nl.a1.unit04.lesson01.teach.half_three:
    title: Полпути до трёх
    gloss: 2:30 — половина третьего
    note: 'Как и в русском «половина третьего», нидерландское *half drie* называет следующий час: это 2:30, а не 3:30.'
  nl.a1.unit04.lesson01.teach.half_rule:
    title: Half указывает на следующий час
    gloss: половина третьего = полпути до трёх часов = 2:30
    note: Читай *half* + час как полпути до этого часа. Поэтому *half vier* — это 3:30.
  nl.a1.unit04.lesson01.teach.half_four:
    title: Полпути до четырёх
    gloss: 3:30 — половина четвёртого
    note: '*Half vier* — это «полпути к четырём», то есть 3:30.'
  nl.a1.unit04.lesson01.teach.time_answer:
    title: Называем половину часа
    gloss: Сейчас половина третьего.
    note: '*Het is ...* — обычная рамка, чтобы назвать текущее время.'
  nl.a1.unit04.lesson02.teach.quarter:
    title: Четверть часа
    gloss: четверть часа
    note: '*Kwart* используется в устойчивых выражениях для часов: *kwart over* и *kwart voor*.'
    example_gloss: Четверть часа — это пятнадцать минут.
  nl.a1.unit04.lesson02.teach.quarter_past_two:
    title: Четверть третьего
    gloss: 2:15 — четверть третьего
    note: '*Kwart over twee* — это пятнадцать минут после двух.'
  nl.a1.unit04.lesson02.teach.past_rule:
    title: Over значит «после»
    gloss: over = после целого часа
    note: В выражениях со временем *over* отсчитывает минуты вперёд от только что прошедшего часа.
  nl.a1.unit04.lesson02.teach.quarter_to_three:
    title: Без четверти три
    gloss: 2:45 — без четверти три
    note: '*Kwart voor drie* — это за пятнадцать минут до трёх, то есть 2:45.'
  nl.a1.unit04.lesson02.teach.to_rule:
    title: Voor значит «до»
    gloss: voor = до следующего целого часа
    note: В выражениях со временем *voor* указывает на ближайший следующий час.
  nl.a1.unit04.lesson02.teach.quarter_past_three:
    title: Четверть четвёртого
    gloss: 3:15 — четверть четвёртого
    note: '*Over* сохраняет час, который только что прошёл: *kwart over drie*.'
  nl.a1.unit04.lesson02.teach.quarter_to_four:
    title: Без четверти четыре
    gloss: 3:45 — без четверти четыре
    note: '*Voor* называет приближающийся час: *kwart voor vier* — это 3:45.'
  nl.a1.unit04.lesson03.teach.ask_time:
    title: Спросить, который час
    gloss: Который час?
    note: '*Hoe laat is het?* — стандартный повседневный вопрос о текущем времени.'
  nl.a1.unit04.lesson03.teach.tell_time:
    title: Говорим, который час
    gloss: Сейчас половина третьего.
    note: 'Запомни: слово *drie* в этой фразе даёт 2:30 — как и в русском «половина третьего».'
  nl.a1.unit04.lesson03.teach.ask_start:
    title: Спрашиваем, когда что-то начинается
    gloss: Во сколько начинается языковое кафе?
    note: '*Hoe laat* открывает вопрос о времени по часам.'
  nl.a1.unit04.lesson03.teach.at_quarter:
    title: В четверть третьего
    gloss: В четверть третьего.
    note: Перед временем ставь *om*, когда говоришь, когда что-то происходит.
  nl.a1.unit04.lesson03.teach.at_rule:
    title: Om — время события
    gloss: 'в + время: в два часа, в половине третьего'
    note: Не используй *om*, когда просто называешь текущее время с *Het is*.
  nl.a1.unit04.lesson03.teach.late:
    title: Спрашиваем, не опоздал ли ты
    gloss: Я опоздал?
    note: Здесь *laat* значит «поздно, с опозданием»; фраза естественна в разговоре о времени.
  nl.a1.unit04.lesson03.teach.on_time:
    title: Говорим, что человек пришёл вовремя
    gloss: Нет, ты вовремя.
    note: '*Op tijd* значит «вовремя». *Je* делает обращение неформальным.'
  nl.a1.unit04.lesson04.teach.twenty_four_hour:
    title: Четырнадцать часов
    gloss: 14:00 — четырнадцать часов
    note: В расписаниях и объявлениях часто используют 24-часовой формат. *Veertien uur* — однозначное устное прочтение 14:00.
  nl.a1.unit04.lesson04.teach.eighteen_hour:
    title: Восемнадцать часов
    gloss: 18:00 — восемнадцать часов
    note: '*Achttien uur* — форма 24-часового формата для 6 часов вечера.'
  nl.a1.unit04.lesson04.teach.morning:
    title: Семь утра
    gloss: 7:00 — семь часов утра
    note: '*''s Ochtends* значит «утром». Начальное *''s* — часть устойчивого выражения.'
  nl.a1.unit04.lesson04.teach.afternoon:
    title: Два часа дня
    gloss: 14:00 — два часа дня
    note: '*''s Middags* охватывает время после полудня и отличает 14:00 от 02:00 в 12-часовой речи.'
  nl.a1.unit04.lesson04.teach.evening:
    title: Восемь вечера
    gloss: 20:00 — восемь часов вечера
    note: '*''s Avonds* употребляется для вечернего времени — примерно от конца дня до полуночи.'
  nl.a1.unit04.lesson04.teach.night:
    title: Два часа ночи
    gloss: 2:00 — два часа ночи
    note: '*''s Nachts* употребляется для ночных часов; 02:00 естественно звучит как *twee uur ''s nachts*.'
  nl.a1.unit04.lesson04.teach.day_parts:
    title: Части суток
    gloss: утро · день (после полудня) · вечер · ночь
    note: 'Границы в нидерландском приблизительны: *ochtend* длится примерно до полудня, *middag* — от полудня и на протяжении всей второй половины дня, *avond* — весь вечер, а *nacht* — ночное время. Обрати внимание: middag — это не «середина дня», а время после полудня, как русское «днём».'
    example_gloss:
    - Я пью кофе по утрам.
    - Языковое кафе работает во второй половине дня.
    - Я читаю по вечерам.
    - Я сплю ночью.
  nl.a1.unit04.lesson05.teach.schedule:
    title: Расписание
    gloss: расписание
    note: В *rooster* перечислены занятия и время их проведения.
    example_gloss: Я читаю расписание.
  nl.a1.unit04.lesson05.teach.opening_hours:
    title: Часы работы языкового кафе
    gloss: 'Языковое кафе открыто: 14:00–16:00'
    note: В нидерландских расписаниях между часами и минутами часто ставят точку; 14.00 — то же время, что и 14:00.
  nl.a1.unit04.lesson05.teach.welcome:
    title: Время приветствия
    gloss: 14:15 Приветствие
    note: 14.15 в повседневной речи с 12-часовым форматом можно сказать *kwart over twee*.
  nl.a1.unit04.lesson05.teach.workshop:
    title: Время мастер-класса
    gloss: 14:45 Мастер-класс
    note: '14.45 — это *kwart voor drie*: четверть до трёх.'
  nl.a1.unit04.lesson05.teach.break:
    title: Время перерыва
    gloss: 15:30 Перерыв
    note: 15.30 — это *half vier*, то есть полпути к четырём; по-русски это «половина четвёртого».
  nl.a1.unit04.lesson05.teach.ask_schedule:
    title: Спрашиваем время по расписанию
    gloss: Во сколько начинается мастер-класс?
    note: '*Begint* спрашивает, когда занятие начинается.'
  nl.a1.unit04.lesson05.teach.workshop_answer:
    title: Называем время мастер-класса
    gloss: Без четверти три.
    note: 14.45 из расписания — это *kwart voor drie*.
  nl.a1.unit04.lesson06.teach.start_turn:
    title: Уточняем время языкового кафе
    gloss: 'Лотте: Во сколько в пятницу начинается языковое кафе? Омар: В четверть третьего, то есть в 14:15.'
    note: 'Омар называет обе формы: *kwart over twee* и 14.15 — это одно и то же время, как и в расписании.'
  nl.a1.unit04.lesson06.teach.workshop_turn:
    title: Спрашиваем про мастер-класс
    gloss: 'Лотте: А во сколько начинается мастер-класс? Омар: Без четверти три.'
    note: '*Kwart voor drie* — это 14:45, как в расписании.'
  nl.a1.unit04.lesson06.teach.arrival_turn:
    title: Называем время прихода
    gloss: 'Лотте: Хорошо. Тогда я буду там в два часа.'
    note: Лотте планирует прийти в 14:00, за пятнадцать минут до начала в 14:15.
  nl.a1.unit04.lesson06.teach.close_turn:
    title: Завершаем договорённость
    gloss: 'Омар: Отлично, до встречи в пятницу днём!'
    note: '*Vrijdagmiddag* — естественное сложное слово, означающее «пятница днём».'
