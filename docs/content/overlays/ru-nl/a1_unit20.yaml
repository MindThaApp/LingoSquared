teaching:
  nl.a1.unit20.lesson01.teach.jas_trui:
    title: Пальто, свитер
    gloss: пальто/куртка, свитер
    note: '*De jas* и *de trui* — оба слова относятся к общему роду (с артиклем de).'
    example_gloss:
    - Я ищу пальто.
    - У меня есть свитер.
  nl.a1.unit20.lesson01.teach.broek_schoenen:
    title: Брюки, обувь
    gloss: брюки, обувь
    note: 'В отличие от русского «брюки», слово *broek* в нидерландском стоит в единственном числе: одна пара — *een broek*, а не *broeken*. *Schoenen* — множественное число от *schoen*; об обуви почти всегда говорят во множественном числе, как и по-русски.'
    example_gloss:
    - Я ищу брюки.
    - Я ищу обувь.
  nl.a1.unit20.lesson01.teach.zoek_jas:
    title: Как сказать, что ты ищешь
    gloss: Я ищу пальто.
    note: Глагол *zoeken* (искать) здесь употребляется с прямым дополнением, как и русское «искать» (что-то), без предлога. (Есть и *zoeken naar*, но простое дополнение — самая простая модель.)
  nl.a1.unit20.lesson02.teach.maat:
    title: Размер
    gloss: размер
    note: 'Существительное общего рода: *de maat*.'
    example_gloss: Какой у вас размер?
  nl.a1.unit20.lesson02.teach.welke_maat:
    title: Вопрос о размере
    gloss: Какой у тебя размер?
    note: '*Welke* (какой) употребляется, потому что у слова *maat* ограниченный набор возможных ответов (S, M, L или число).'
  nl.a1.unit20.lesson02.teach.heb_maat_m:
    title: Называем свой размер
    gloss: У меня размер M.
    note: Здесь используется глагол *hebben* (иметь), как и в русском «у меня размер M».
  nl.a1.unit20.lesson03.teach.zwart_blauw:
    title: Чёрный, синий
    gloss: чёрный, синий
    note: Два основных прилагательных цвета в этом уроке.
    example_gloss:
    - Я хочу пальто чёрного цвета.
    - У вас это есть также в синем цвете?
  nl.a1.unit20.lesson03.teach.wil_in_zwart:
    title: Просим определённый цвет
    gloss: Я хочу пальто чёрного цвета.
    note: '*In het* + цвет — стандартный способ указать цвет одежды, когда её заказывают или просят.'
  nl.a1.unit20.lesson03.teach.ook_in_blauw:
    title: Спрашиваем о другом цвете
    gloss: У вас это есть также в синем цвете?
    note: '*Ook* (тоже, также) помогает спросить, есть ли другой цвет; здесь используется вежливая форма *u*.'
  nl.a1.unit20.lesson04.teach.past_deze_jas:
    title: Вопрос о посадке
    gloss: Это пальто подходит по размеру?
    note: '*Passen* (подходить, сидеть по фигуре) — естественный глагол для посадки одежды; не путай его с *passen* в значении «примерять».'
  nl.a1.unit20.lesson04.teach.past_goed:
    title: Подтверждаем, что подходит
    gloss: Хорошо сидит.
    note: '*Goed* (хорошо) описывает, как вещь сидит.'
  nl.a1.unit20.lesson04.teach.te_klein:
    title: Слишком мало
    gloss: Мало́.
    note: '*Te* (слишком) ставится перед прилагательным и выражает излишек.'
  nl.a1.unit20.lesson04.teach.te_groot:
    title: Слишком велико
    gloss: Велико́.
    note: Та же модель *te* + прилагательное, что и в предыдущей карточке *te klein*.
  nl.a1.unit20.lesson05.teach.negentig:
    title: Девяносто
    gloss: девяносто
    note: '*Negentig* — число 90; здесь оно используется в цене пальто.'
    example_gloss: Пальто стоит девяносто евро.
  nl.a1.unit20.lesson05.teach.kost_negentig:
    title: Называем цену
    gloss: Пальто стоит девяносто евро.
    note: '*Kost* — форма 3-го лица единственного числа от *kosten* (стоить).'
  nl.a1.unit20.lesson05.teach.bonnetje:
    title: Читаем магазинный чек
    gloss: 'Зимнее пальто: размер M, цвет чёрный. Цена: девяносто евро. Это пальто хорошо сидит и тёплое.'
    note: Найди размер, цвет, цену и два качества пальто, о которых сказано в тексте.
    glosses:
      Winterjas: зимнее пальто
      maat: размер
      kleur: цвет
      zwart: чёрный
      Prijs: цена
      negentig: девяносто
      euro: евро
      jas: пальто
      past: сидит (по размеру)
      warm: тёплый
  nl.a1.unit20.lesson06.teach.lotte_notice:
    title: Лотте замечает пальто
    gloss: 'Лотте: Какое красивое пальто! Какой у тебя размер?'
    note: '*Mooi* (красивый) — общая положительная реакция, уже встречавшаяся в прошлых уроках.'
  nl.a1.unit20.lesson06.teach.omar_ask_try:
    title: Омар просит примерить
    gloss: 'Омар: У меня размер M. Можно мне его примерить?'
    note: '*Mag ik ...?* (Можно мне ...?) — стандартный вежливый способ попросить разрешения; *passen* здесь значит «примерять», а не «подходить по размеру».'
  nl.a1.unit20.lesson06.teach.lotte_ask_fit:
    title: Лотте спрашивает о посадке
    gloss: 'Лотте: Конечно. Хорошо сидит?'
    note: '*Hij* (он) здесь относится к слову *de jas* — существительному общего рода.'
  nl.a1.unit20.lesson06.teach.omar_confirm_fit:
    title: Омар подтверждает
    gloss: 'Омар: Да, хорошо сидит, и оно тёплое.'
    note: Полностью совпадает с чеком из урока 5 — это то же самое пальто.
  nl.a1.unit20.lesson06.teach.lotte_ask_color:
    title: Лотте спрашивает о цвете
    gloss: 'Лотте: Отлично! Хочешь чёрное или синее?'
    note: Конструкция *Wil je... of...?* повторяет модель выбора из уроков о предпочтениях в Unit 13.
  nl.a1.unit20.lesson06.teach.omar_choose_black:
    title: Омар решает
    gloss: 'Омар: Беру чёрное.'
    note: '*Nemen* (брать) — естественный глагол для окончательного выбора при покупке; цвет совпадает с указанным в чеке.'
  nl.a1.unit20.lesson06.teach.neemt_form:
    title: Neem и neemt
    gloss: Neem — форма «я» от nemen (брать); neemt — форма «он/она».
    note: 'Правильное изменение в настоящем времени: *ik neem, jij/hij/zij neemt*.'
