teaching:
  nl.a1.unit06.lesson01.teach.koffie_thee_water:
    title: Кофе, чай, вода
    gloss: кофе, чай, вода
    note: '*De koffie*, *de thee*, *het water* — обрати внимание на разные артикли.'
    example_gloss:
    - Кофе, пожалуйста.
    - Чай, пожалуйста.
    - Воду, пожалуйста.
  nl.a1.unit06.lesson01.teach.melk_sap:
    title: Молоко, сок
    gloss: молоко, сок
    note: '*De melk*, *het sap*.'
    example_gloss:
    - Молоко, пожалуйста.
    - Сок, пожалуйста.
  nl.a1.unit06.lesson02.teach.brood_broodje_kaas_appel:
    title: Хлеб, булочка с сыром, яблоко
    gloss: хлеб, булочка с сыром, яблоко
    note: '*Het brood*, *de appel*. *Broodje* — это маленькая булочка или бутерброд; *broodje kaas* — очень распространённый повседневный заказ.'
    example_gloss:
    - Я хотел бы хлеба.
    - Я хотел бы булочку с сыром.
    - Я хотел бы яблоко.
  nl.a1.unit06.lesson02.teach.ik_wil_graag:
    title: Я хотел бы ...
    gloss: Я хотел бы ...
    note: '*Ik wil graag ...* — обычный вежливый способ заказать что-либо в повседневной речи.'
  nl.a1.unit06.lesson02.teach.ik_wil_graag_koffie:
    title: Я хотел бы кофе
    gloss: Я хотел бы кофе.
    note: '*Een* — неопределённый артикль, он означает «какой-то, один» и одинаков для любого нидерландского существительного. В русском такого артикля нет.'
  nl.a1.unit06.lesson02.teach.ik_wil_graag_broodje:
    title: Я хотел бы булочку с сыром
    gloss: Я хотел бы булочку с сыром.
    note: 'Говори *een broodje kaas*: *kaas* стоит сразу после *broodje*.'
  nl.a1.unit06.lesson03.teach.alstublieft_alsjeblieft:
    title: Пожалуйста (вежливо и неформально)
    gloss: пожалуйста (вежливо), пожалуйста (неформально)
    note: Используй *alstublieft*, когда обращаешься к человеку на «вы» (*u*), и *alsjeblieft*, когда обращаешься на «ты» (*jij* или *je*).
    example_gloss:
    - Кофе, пожалуйста. (вежливо)
    - Кофе, пожалуйста. (неформально)
  nl.a1.unit06.lesson03.teach.please_note:
    title: Alstublieft и alsjeblieft
    gloss: alstublieft = «пожалуйста» вежливо, alsjeblieft = «пожалуйста» неформально
    note: Выбирай *alstublieft* с *u* и *alsjeblieft* с *jij* или *je*.
    target_text: alstublieft = «пожалуйста» в вежливой форме (с u); alsjeblieft = «пожалуйста» в неформальной форме (с jij/je)
  nl.a1.unit06.lesson03.teach.twee_thee:
    title: Я хотел бы два чая, пожалуйста
    gloss: Я хотел бы два чая, пожалуйста.
    note: В заказе в кафе *twee thee* естественно означает две чашки чая; слово *thee* здесь остаётся в единственном числе.
  nl.a1.unit06.lesson04.teach.wat_wilt_u:
    title: Что вы будете пить? (вежливая форма)
    gloss: Что вы будете пить?
    note: '*Wilt u* — обычная вежливая форма в Нидерландах.'
  nl.a1.unit06.lesson04.teach.wat_wil_je:
    title: Что ты хочешь поесть? (неформально)
    gloss: Что вы хотите поесть?
    note: Перед *je* или *jij* используй *wil*, а не *wilt*, как в этом вопросе.
  nl.a1.unit06.lesson04.teach.wilt_wil_note:
    title: Wilt и wil
    gloss: wilt u ... но wil je/jij ...
    note: Когда глагол стоит перед подлежащим, говори *wilt u*, но *wil je* или *wil jij*. Нельзя говорить *wilt je* или *wilt jij*.
    target_text: 'wilt u (вежливо), но wil je (неформально): если wil стоит перед je или jij, буквы t нет'
  nl.a1.unit06.lesson04.teach.appelsap:
    title: Яблочный сок
    gloss: яблочный сок
    note: Пиши *appelsap* одним словом, а не *appel sap*.
    example_gloss: Можно мне яблочный сок, пожалуйста?
  nl.a1.unit06.lesson04.teach.mag_ik:
    title: Можно мне яблочный сок, пожалуйста?
    gloss: Можно мне яблочный сок, пожалуйста?
    note: '*Mag ik ...?* — ещё один распространённый, чуть более непринуждённый способ заказать что-либо, наряду с *ik wil graag ...*'
  nl.a1.unit06.lesson05.teach.euro_vijftig:
    title: Два евро пятьдесят
    gloss: 2,50 € — два евро пятьдесят
    note: €2,50 обычно произносят *twee euro vijftig*, без *en* и *cent*.
  nl.a1.unit06.lesson05.teach.menu:
    title: Меню
    gloss: 'Меню — Кофе: 2,50 €. Чай: 2,00 €. Булочка с сыром: 3,50 €. Яблочный сок: 2,50 €.'
    note: 'В нидерландских меню цены пишут с десятичной запятой, как и в русском: €2,50, €2,00 и €3,50.'
    glosses:
      Menukaart: меню
      Koffie: кофе
      Thee: чай
      Broodje: булочка / бутерброд
      kaas: сыр
      Appelsap: яблочный сок
  nl.a1.unit06.lesson06.teach.goedemiddag:
    title: Добрый день
    gloss: добрый день
    note: Естественное приветствие за стойкой кафе днём.
    example_gloss: Добрый день, что вы будете пить?
  nl.a1.unit06.lesson06.teach.komt_eraan:
    title: Уже несу!
    gloss: Уже несу!
    note: Естественная и распространённая фраза сотрудников после принятия заказа.
    example_gloss: Ваш кофе уже несут!
  nl.a1.unit06.lesson06.teach.lines01_03:
    title: Добрый день, что вы будете пить?
    gloss: 'Сотрудник: Добрый день, что вы будете пить? Лотте: Я хотела бы кофе, пожалуйста.'
    note: 'Это вежливое обслуживание: обрати внимание, что Лотте говорит *alstublieft* сотруднику, в отличие от неформального общения с Омаром.'
  nl.a1.unit06.lesson06.teach.lines04_06:
    title: Вы хотите ещё что-нибудь поесть?
    gloss: 'Сотрудник: А вы хотите ещё что-нибудь поесть? Лотте: Да, булочку с сыром, пожалуйста. Сотрудник: Уже несу!'
    note: '*En wilt u ook iets eten?* — естественный вопрос сотрудника о том, не хотите ли вы ещё и поесть.'
