teaching:
  nl.a1.unit10.lesson01.teach.opstaan:
    title: Вставать
    gloss: вставать → я встаю
    note: 'В главном предложении *opstaan* разделяется: *Ik sta op*. Приставка *op* уходит в конец.'
  nl.a1.unit10.lesson01.teach.aankleden:
    title: Одеваться
    gloss: одеваться → я одеваюсь
    note: '*Zich aankleden* — возвратный глагол с отделяемой приставкой. С *ik* используется *me*, а *aan* уходит в конец: *Ik kleed me aan*.'
  nl.a1.unit10.lesson01.teach.ontbijten:
    title: Завтракать
    gloss: завтракать → я завтракаю
    note: '*Ontbijten* не разделяется: *Ik ontbijt*.'
  nl.a1.unit10.lesson01.teach.werken:
    title: Работа
    gloss: работать → я работаю
    note: '*Werken* не разделяется: *Ik werk*.'
  nl.a1.unit10.lesson01.teach.eten:
    title: Есть
    gloss: есть → я ем
    note: 'Форма *ik* от *eten* — *eet*: *Ik eet*.'
  nl.a1.unit10.lesson01.teach.afwassen:
    title: Мыть посуду
    gloss: мыть посуду → я мою посуду
    note: '*Afwassen* разделяется: *Ik was af*. Приставка *af* уходит в конец.'
  nl.a1.unit10.lesson01.teach.slapen:
    title: Спать
    gloss: спать → я сплю
    note: '*Slapen* не разделяется. В форме *ik* гласная долгая: *Ik slaap*.'
  nl.a1.unit10.lesson02.teach.split_rule:
    title: Схема разделения
    gloss: 'В обычном главном предложении первая часть глагола уходит в конец: opstaan → Ik sta op.'
    note: Нельзя говорить *Ik opsta*. Спрягай основной глагол, а короткую приставку ставь в конец главного предложения.
  nl.a1.unit10.lesson02.teach.opstaan_split:
    title: Opstaan в предложении
    gloss: 'вставать: я встаю в семь.'
    note: Указание времени стоит между *sta* и приставкой *op* в конце.
  nl.a1.unit10.lesson02.teach.aankleden_split:
    title: Aankleden в предложении
    gloss: 'одеваться: я одеваюсь.'
    note: 'Схема: *Ik* + *kleed* + *me* + *aan*. Приставка *aan* остаётся в конце.'
  nl.a1.unit10.lesson02.teach.afwassen_split:
    title: Afwassen в предложении
    gloss: 'мыть посуду: я мою посуду после еды.'
    note: '*Na het eten* стоит между *was* и приставкой *af* в конце.'
  nl.a1.unit10.lesson02.teach.contrast:
    title: Глаголы, которые не разделяются
    gloss: 'Неотделяемые: Я завтракаю. Я работаю. Я сплю. В конце ничего не добавляется.'
    note: В таких главных предложениях *ontbijten*, *werken* и *slapen* остаются одной цельной глагольной формой.
  nl.a1.unit10.lesson03.teach.get_up_time:
    title: Встаю в половине восьмого
    gloss: Я встаю в 7:30.
    note: 'Вспомни нидерландский способ называть время: *half acht* — это «половина до восьми», то есть 7:30. *Op* остаётся в конце.'
  nl.a1.unit10.lesson03.teach.dress_time:
    title: Одеваюсь без пятнадцати восемь
    gloss: Я одеваюсь в 7:45.
    note: Время стоит перед отделяемой приставкой *aan* в конце.
  nl.a1.unit10.lesson03.teach.breakfast_time:
    title: Завтракаю в восемь
    gloss: Я завтракаю в восемь часов.
    note: Перед временем используется *om*. *Ontbijt* не разделяется.
  nl.a1.unit10.lesson03.teach.work_time:
    title: Работаю с девяти до пяти
    gloss: Я работаю с девяти часов до пяти.
    note: '*Van ... tot ...* указывает начало и конец отрезка времени.'
  nl.a1.unit10.lesson03.teach.eat_time:
    title: Ем в половине седьмого
    gloss: Я ем в 6:30 вечера.
    note: '*''s Avonds* уточняет, что речь о вечере, поэтому *half zeven* здесь означает 18:30.'
  nl.a1.unit10.lesson03.teach.sleep_time:
    title: Сплю в одиннадцать
    gloss: Я сплю в одиннадцать часов.
    note: 'Перед временем используется *om*: *om elf uur*.'
  nl.a1.unit10.lesson04.teach.eerst_dan_daarna:
    title: Сначала, потом, после этого
    gloss: сначала, потом, после этого
    note: '*Eerst* обозначает первое занятие, *dan* — переход к следующему, а *daarna* связывает с тем, что было перед этим.'
    example_gloss:
    - Сначала я встаю.
    - Потом я одеваюсь.
    - После этого я завтракаю.
  nl.a1.unit10.lesson04.teach.sequence:
    title: Утро в три шага
    gloss: Сначала я встаю. Потом я одеваюсь. После этого я завтракаю.
    note: 'Отделяемые приставки по-прежнему стоят в конце предложения: *sta ik op*; *kleed ik me aan*.'
  nl.a1.unit10.lesson04.teach.sequence_order_note:
    title: Глагол перед ik
    gloss: 'После eerst, dan и daarna глагол стоит перед ik: Daarna ontbijt ik.'
    note: Если предложение начинается со слова последовательности, *Ik ontbijt* превращается в *Daarna ontbijt ik*.
  nl.a1.unit10.lesson05.teach.routine_text:
    title: Мой день
    gloss: Мой день — Я встаю в 7:30. После этого я одеваюсь, а в восемь завтракаю. Я работаю с девяти до пяти. В 6:30 вечера я ем. После этого я мою посуду. В одиннадцать я сплю.
    note: Читай, следя и за порядком занятий, и за временем. Обрати внимание на *op*, *aan* и *af* в конце предложений с отделяемыми глаголами.
    glosses:
      Mijn: мой
      dag: день
      sta: вставать (с op)
      half: половина следующего часа (half acht = 7:30)
      acht: восемь
      Daarna: после этого
      kleed: одеваться (с me ... aan)
      uur: час / часов
      ontbijt: завтракать
      werk: работать
      negen: девять
      vijf: пять
      zeven: семь
      avonds: вечером
      eet: есть, обедать
      was: мыть посуду (с af)
      elf: одиннадцать
      slaap: спать
  nl.a1.unit10.lesson06.teach.question:
    title: Вопрос о дне
    gloss: 'Лотте: Как выглядит твой день, Омар?'
    note: '*Hoe ziet jouw dag eruit?* — неформальный способ попросить рассказать о своём дне. *Eruitzien* — отделяемый глагол: *ziet ... eruit*.'
  nl.a1.unit10.lesson06.teach.morning:
    title: Утро Омара
    gloss: 'Омар: Я встаю в половине восьмого. Потом одеваюсь, а в восемь завтракаю.'
    note: Омар связывает три утренних занятия, и *op* и *aan* стоят в конце своих предложений.
  nl.a1.unit10.lesson06.teach.work:
    title: Рабочий день Омара
    gloss: 'Лотте: Когда ты работаешь? Омар: Я работаю с девяти до пяти.'
    note: Лотте и Омар говорят друг другу неформальное *je* (на «ты»).
  nl.a1.unit10.lesson06.teach.evening:
    title: Вечер Омара
    gloss: 'Омар: В половине седьмого вечера я ужинаю. После этого я мою посуду. В одиннадцать я сплю.'
    note: 'Если предложение начинается с обозначения времени или со слова *daarna*, глагол стоит перед *ik*: *eet ik*, *was ik*, *slaap ik*. Частица *af* остаётся в конце.'
  nl.a1.unit10.lesson06.teach.lotte:
    title: Утро Лотте
    gloss: 'Лотте: Я встаю в шесть, но завтракаю только в половине седьмого.'
    note: '*Pas* здесь значит «только (не раньше)». Лотте противопоставляет время подъёма и время завтрака.'
