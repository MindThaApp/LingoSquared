teaching:
  nl.a1.unit08.lesson01.teach.station_supermarkt_bibliotheek_ziekenhuis:
    title: Вокзал, супермаркет, библиотека, больница
    gloss: вокзал, супермаркет, библиотека, больница
    note: 'Со словом *station* используется *het*: *het station*. Слово *supermarkt* пишется слитно: *de supermarkt*. С *bibliotheek* используется *de*: *de bibliotheek*. Слово *ziekenhuis* пишется слитно: *het ziekenhuis*.'
    example_gloss:
    - Где находится вокзал?
    - Супермаркет находится рядом с вокзалом.
    - Библиотека находится напротив вокзала.
    - Больница находится за библиотекой.
  nl.a1.unit08.lesson01.teach.bank_postkantoor_bushalte:
    title: Банк, почта, автобусная остановка
    gloss: банк, почта, автобусная остановка
    note: 'Для финансового учреждения в нидерландском есть слово *de bank* (оно же значит «скамейка»). Слово *postkantoor* пишется слитно, артикль *het*: *het postkantoor*. Слово *bushalte* тоже пишется слитно, артикль *de*: *de bushalte*.'
    example_gloss:
    - Банк находится рядом с супермаркетом.
    - Почта находится между библиотекой и больницей.
    - Автобусная остановка находится перед вокзалом.
  nl.a1.unit08.lesson02.teach.naast_tegenover:
    title: Рядом, напротив
    gloss: рядом с, напротив
    note: '*Naast* значит «непосредственно рядом с чем-то». *Tegenover* говорит о том, что два места находятся друг напротив друга, часто через улицу или открытое пространство.'
    example_gloss:
    - Банк находится рядом с супермаркетом.
    - Библиотека находится напротив вокзала.
  nl.a1.unit08.lesson02.teach.supermarket_next:
    title: Супермаркет рядом с вокзалом
    gloss: Супермаркет находится рядом с вокзалом.
    note: '*Naast* значит «непосредственно рядом»: *De supermarkt is naast het station*.'
  nl.a1.unit08.lesson02.teach.library_opposite:
    title: Библиотека напротив вокзала
    gloss: Библиотека находится напротив вокзала.
    note: 'Со словом *station* остаётся *het*: *tegenover het station*.'
  nl.a1.unit08.lesson03.teach.achter_voor:
    title: За, перед
    gloss: позади, перед
    note: '*Achter* указывает, что одно место находится позади другого. Здесь *voor* значит «перед»; в других предложениях у него могут быть другие значения.'
    example_gloss:
    - Больница находится за библиотекой.
    - Автобусная остановка находится перед вокзалом.
  nl.a1.unit08.lesson03.teach.hospital_behind:
    title: Больница за библиотекой
    gloss: Больница находится за библиотекой.
    note: '*Achter* ставится перед названием другого места: *achter de bibliotheek*.'
  nl.a1.unit08.lesson03.teach.stop_in_front:
    title: Автобусная остановка перед вокзалом
    gloss: Автобусная остановка находится перед вокзалом.
    note: Здесь *voor* показывает, где находится автобусная остановка.
  nl.a1.unit08.lesson04.teach.waar_is:
    title: Где ...?
    gloss: Где ...?
    note: Конструкция *Waar is ...?* нужна, чтобы спросить, где находится одно место.
  nl.a1.unit08.lesson04.teach.where_post_office:
    title: Где почта?
    gloss: Где почта?
    note: В этом вопросе *het* остаётся при слове *postkantoor*.
  nl.a1.unit08.lesson04.teach.tussen_bij:
    title: Между, рядом / у
    gloss: между, рядом / у
    note: Конструкция *tussen ... en ...* показывает, что одно место находится между двумя другими. *Bij* значит, что одно место находится рядом с другим; это менее точно, чем *naast*.
    example_gloss:
    - Почта находится между библиотекой и больницей.
    - Супермаркет находится рядом с вокзалом.
  nl.a1.unit08.lesson04.teach.in_de_buurt_van:
    title: Близко
    gloss: около, поблизости от
    note: Слова *in de buurt van* вместе означают, что место находится поблизости.
  nl.a1.unit08.lesson04.teach.post_office_between:
    title: Почта находится между двумя местами
    gloss: Почта находится между библиотекой и больницей.
    note: Слово *en* ставится между двумя другими местами.
  nl.a1.unit08.lesson04.teach.supermarket_near:
    title: Супермаркет рядом с вокзалом
    gloss: Супермаркет находится рядом с вокзалом.
    note: '*Bij* указывает на близкое расположение, не утверждая, что здания стоят вплотную друг к другу.'
  nl.a1.unit08.lesson04.teach.library_vicinity:
    title: Библиотека находится около вокзала
    gloss: Библиотека находится около вокзала.
    note: 'Выучи слова *in de buurt van* целиком: *in de buurt van het station*.'
  nl.a1.unit08.lesson05.teach.kaart_buurtkaart:
    title: Карта, карта района
    gloss: карта, карта района
    note: '*De kaart* может быть картой местности или другой карточкой; здесь это карта. По-нидерландски *buurtkaart* пишется слитно: *de buurtkaart*.'
    example_gloss:
    - Где карта?
    - Вот карта района.
  nl.a1.unit08.lesson05.teach.map_labels:
    title: Подписи на карте района
    gloss: 'Библиотека: напротив вокзала. Больница: за библиотекой. Почта: между библиотекой и больницей. Супермаркет: рядом с вокзалом. Банк: рядом с супермаркетом. Автобусная остановка: перед вокзалом.'
    note: Каждая подпись называет место и говорит, где оно находится.
    glosses:
      BUURTKAART: КАРТА РАЙОНА
      Bibliotheek: библиотека
      tegenover: напротив
      station: вокзал
      Ziekenhuis: больница
      achter: за, позади
      Postkantoor: почта
      tussen: между
      Supermarkt: супермаркет
      naast: рядом с
      Bank: банк
      Bushalte: автобусная остановка
  nl.a1.unit08.lesson06.teach.opening:
    title: Смотрим карту
    gloss: 'Лотте: Смотри, вот карта района. Омар: Отлично. Где автобусная остановка?'
    note: Лотте и Омар, как обычно, говорят друг с другом на ты.
  nl.a1.unit08.lesson06.teach.stop_location:
    title: Где находится остановка
    gloss: 'Лотте: Автобусная остановка перед вокзалом.'
    note: Лотте отвечает одним прямым утверждением о месте.
  nl.a1.unit08.lesson06.teach.more_places:
    title: Где находится супермаркет
    gloss: 'Омар: А где супермаркет? Лотте: Супермаркет рядом с вокзалом, около банка.'
    note: В ответе сказано, где находится супермаркет относительно двух мест.
  nl.a1.unit08.lesson06.teach.library:
    title: Где находится библиотека
    gloss: 'Омар: Где библиотека? Лотте: Библиотека напротив вокзала. Языковое кафе находится в библиотеке.'
    note: Это снова возвращает нас к библиотеке, о которой шла речь раньше в курсе.
