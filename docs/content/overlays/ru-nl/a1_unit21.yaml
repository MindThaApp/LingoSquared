teaching:
  nl.a1.unit21.lesson01.teach.blij_verdrietig_boos:
    title: Радостный, грустный и злой
    gloss: радостный, грустный, злой
    note: Три простых и частых слова о чувствах; они употребляются с глаголом zijn («быть»), чтобы сказать, что ты чувствуешь.
    example_gloss:
    - Я рад.
    - Мне грустно.
    - Я злюсь.
  nl.a1.unit21.lesson01.teach.ben_blij:
    title: Говорим, что ты рад
    gloss: Я рад.
    note: 'Основная модель: *zijn* («быть») + прилагательное, обозначающее чувство. В русском в такой фразе глагол «быть» в настоящем времени обычно опускается, а в нидерландском ben нужен всегда.'
  nl.a1.unit21.lesson01.teach.niet_boos:
    title: Противопоставление чувств
    gloss: Я не злюсь, мне грустно.
    note: '*Niet* напрямую отрицает *boos*; во второй части называется настоящее чувство.'
  nl.a1.unit21.lesson02.teach.waarom_blij:
    title: Спрашиваем «почему»
    gloss: Почему ты рад?
    note: '*Waarom* («почему») — обычное вопросительное слово для вопроса о причине.'
  nl.a1.unit21.lesson02.teach.blij_omdat_appartement:
    title: Называем причину
    gloss: Я рад, потому что у меня новая квартира.
    note: '*Omdat* («потому что») вводит придаточную часть с причиной; глагол уходит в её конец (*heb* ставится после *appartement*).'
  nl.a1.unit21.lesson02.teach.verdrietig_omdat_regent:
    title: Грустная причина
    gloss: Мне грустно, потому что идёт дождь.
    note: Здесь снова *regent* («идёт дождь») из темы о погоде — в роли причины.
  nl.a1.unit21.lesson03.teach.zenuwachtig:
    title: Нервный
    gloss: нервный
    note: Обычное слово для обозначения волнения.
    example_gloss: Я волнуюсь перед своей первой сменой.
  nl.a1.unit21.lesson03.teach.eerste_dienst:
    title: Говорим, из-за чего волнуешься
    gloss: Я волнуюсь перед своей первой сменой.
    note: '*Voor* (буквально «для») вводит то, из-за чего человек волнуется. В русском здесь обычно «перед» или «из-за», а в нидерландском используется voor.'
  nl.a1.unit21.lesson03.teach.geen_zorgen:
    title: Успокаиваем человека
    gloss: Не волнуйся.
    note: '*Maak je geen zorgen* (буквально «не делай себе забот») — устойчивая фраза, чтобы успокоить собеседника.'
  nl.a1.unit21.lesson04.teach.hoe_voelt_omar:
    title: Спрашиваем, как человек себя чувствует
    gloss: Как себя чувствует Омар?
    note: '*Voelen zich* («чувствовать себя», возвратная конструкция) — стандартный способ спросить об эмоциональном состоянии или описать его. Не путай с физическим *voelen* из уроков о здоровье в Unit 16.'
  nl.a1.unit21.lesson04.teach.hij_voelt_zich:
    title: Описываем, как себя чувствует человек
    gloss: Он нервничает.
    note: '*Zich* («себя») — возвратное местоимение 3-го лица, оно стоит рядом с *voelt*.'
  nl.a1.unit21.lesson04.teach.waarom_voelt_hij:
    title: Спрашиваем, почему человек так себя чувствует
    gloss: Почему он нервничает?
    note: '*Waarom* сочетается с конструкцией *voelt zich* из фразы *Hij voelt zich zenuwachtig*.'
  nl.a1.unit21.lesson05.teach.bericht:
    title: Читаем сообщение о чувствах
    gloss: Привет, Лотте, я немного волнуюсь перед своей первой самостоятельной сменой. Но я ещё и рад, потому что у меня новая работа и новая квартира. Думаю, всё будет хорошо.
    note: Следи за тем, из-за чего автор волнуется, что его радует и как он смотрит на будущее в целом.
    glosses:
      beetje: немного
      zenuwachtig: нервный, взволнованный
      eerste: первый
      dienst: смена
      alleen: один, самостоятельно
      blij: довольный
      want: потому что
      nieuwe: новый
      baan: работа
      nieuw: новый
      appartement: квартира
      denk: думать
      komt: 'получается (здесь: всё будет хорошо)'
  nl.a1.unit21.lesson06.teach.lotte_ask_feeling:
    title: Лотте спрашивает Омара, как он себя чувствует
    gloss: 'Лотте: Привет, Омар, как ты себя чувствуешь перед своей первой сменой?'
    note: '*Voor je eerste dienst* («перед твоей первой сменой») — снова *voor* + существительное, как в lesson03.'
  nl.a1.unit21.lesson06.teach.omar_admit_nervous:
    title: Омар признаётся, что волнуется
    gloss: 'Омар: Я немного волнуюсь, если честно.'
    note: '*Eerlijk gezegd* («честно говоря») смягчает признание.'
  nl.a1.unit21.lesson06.teach.lotte_reassure:
    title: Лотте его успокаивает
    gloss: 'Лотте: Не волнуйся, у тебя всё получится!'
    note: '*Je kunt het goed* (буквально «ты можешь это хорошо») — ободряющая устойчивая фраза.'
  nl.a1.unit21.lesson06.teach.omar_thanks_helps:
    title: Омар благодарит её
    gloss: 'Омар: Спасибо, это правда помогает.'
    note: '*Helpt* — форма 3-го лица единственного числа от *helpen* («помогать»).'
  nl.a1.unit21.lesson06.teach.lotte_predict:
    title: Лотте предсказывает, что будет потом
    gloss: 'Лотте: А потом ты наверняка будешь очень рад и горд.'
    note: '*Vast* («наверняка») выражает уверенное предположение; *trots* («гордый») — новое полезное прилагательное.'
  nl.a1.unit21.lesson06.teach.omar_agree:
    title: Омар соглашается
    gloss: 'Омар: Да, я тоже так думаю.'
    note: '*Dat denk ik ook* (буквально «это думаю я тоже») — естественный способ согласиться с чьим-то мнением.'
  nl.a1.unit21.lesson06.teach.summary_pronouns:
    title: 'Подводим итог: is, zijn и hem'
    gloss: Омар волнуется перед своей первой сменой. Лотте ему помогает.
    note: '*Is* — форма 3-го лица от *zijn* («быть»); *zijn* здесь означает «его» (притяжательное слово); *hem* — «ему/его» (форма объекта). Три маленьких, но очень важных слова, чтобы говорить о другом человеке.'
