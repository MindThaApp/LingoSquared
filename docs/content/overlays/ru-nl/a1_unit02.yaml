course:
  title: Нидерландский A1
  description: 'Нидерландский для начинающих: числа в обычных повседневных ситуациях в Нидерландах.'
units:
  nl.a1.unit02.basic_numbers:
    title: Числа в повседневной жизни
lessons:
  nl.a1.unit02.lesson01.nul_tot_twaalf:
    title: От нуля до двенадцати
  nl.a1.unit02.lesson02.vanaf_dertien:
    title: От тринадцати до девяноста девяти
  nl.a1.unit02.lesson03.telefoon_en_huisnummer:
    title: Номера телефонов и домов
  nl.a1.unit02.lesson04.leeftijd_en_aantallen:
    title: Возраст и количество
  nl.a1.unit02.lesson05.prijzen:
    title: Цены в евро
  nl.a1.unit02.lesson06.inschrijven_bij_de_bibliotheek:
    title: Регистрация в языковом кафе
teaching:
  nl.a1.unit02.lesson01.teach.zero_to_four:
    title: От нуля до четырёх
    gloss: 0 — ноль, 1 — один, 2 — два, 3 — три, 4 — четыре
    note: Nul — это ноль, в том числе первая цифра номера телефона. Знаки ударения в één отличают числительное от артикля een на письме; в обычных текстах их иногда опускают, если смысл ясен.
    example_gloss:
    - У меня ноль евро.
    - У меня одна книга.
    - У меня два стула.
    - У меня три книги.
    - Там четыре человека.
  nl.a1.unit02.lesson01.teach.five_to_eight:
    title: От пяти до восьми
    gloss: 5 — пять, 6 — шесть, 7 — семь, 8 — восемь
    note: Vijf, zes, zeven и acht подчиняются той же простой схеме, что и числа от нуля до четырёх.
    example_gloss:
    - У меня пять евро.
    - У меня шесть книг.
    - У меня семь стульев.
    - Там восемь человек.
  nl.a1.unit02.lesson01.teach.nine_to_twelve:
    title: От девяти до двенадцати
    gloss: 9 — девять, 10 — десять, 11 — одиннадцать, 12 — двенадцать
    note: Negen, tien, elf и twaalf завершают числа до двенадцати.
    example_gloss:
    - У меня девять евро.
    - У меня десять стульев.
    - У меня одиннадцать книг.
    - Там двенадцать человек.
  nl.a1.unit02.lesson01.teach.how_many:
    title: Спросить «сколько»
    gloss: Сколько?
    note: Hoeveel спрашивает о числе или количестве.
  nl.a1.unit02.lesson02.teach.teens:
    title: Числа от 13 до 19
    gloss: '13–19: тринадцать, четырнадцать, пятнадцать, шестнадцать, семнадцать, восемнадцать, девятнадцать'
    note: 'Как и в русском с его -надцать, нидерландские числа от тринадцати до девятнадцати имеют общее окончание: -tien.'
    example_gloss:
    - Мне тринадцать лет.
    - У меня четырнадцать евро.
    - Мне пятнадцать лет.
    - У меня шестнадцать книг.
    - Там семнадцать человек.
    - Мне восемнадцать лет.
    - У меня девятнадцать стульев.
  nl.a1.unit02.lesson02.teach.tens:
    title: Десятки
    gloss: '20–90: двадцать, тридцать, сорок, пятьдесят, шестьдесят, семьдесят, восемьдесят, девяносто'
    note: 'Выучи эти десятки: из них строятся большие двузначные числа.'
    example_gloss:
    - Мне двадцать лет.
    - Это стоит тридцать евро.
    - У меня сорок евро.
    - Там пятьдесят человек.
    - Мне шестьдесят лет.
    - Это стоит семьдесят евро.
    - Там восемьдесят человек.
    - У меня девяносто евро.
  nl.a1.unit02.lesson02.teach.inversion_rule:
    title: Сначала единицы, потом десятки
    gloss: '21–99, кроме 30, 40 и других круглых десятков: единицы + en + десяток'
    note: 'В отличие от русского, в нидерландском обычно сначала называют единицы: 42 — буквально «два-и-сорок». Круглые десятки обозначаются только словом для десятка.'
  nl.a1.unit02.lesson02.teach.twenty_one:
    title: Двадцать один
    gloss: 21 — двадцать один
    note: Eenentwintig соединяет een + en + twintig в одно слово на письме.
    example_gloss: Языковое кафе находится в зале двадцать один.
  nl.a1.unit02.lesson02.teach.twenty_two:
    title: Двадцать два
    gloss: 22 — двадцать два
    note: Две точки над ë в слове tweeëntwintig показывают, что соседние гласные относятся к разным слогам.
    example_gloss: Мне двадцать два года.
  nl.a1.unit02.lesson02.teach.thirty_two:
    title: Тридцать два
    gloss: 32 — тридцать два
    note: Tweeëndertig пишется одним словом, с двумя точками над соединяющей буквой ë.
    example_gloss: Омару тридцать два года.
  nl.a1.unit02.lesson02.teach.forty_two:
    title: Сорок два
    gloss: 42 — сорок два.
    note: 'Сначала называются единицы, потом десятки: twee-en-veertig, пишется слитно: tweeënveertig.'
  nl.a1.unit02.lesson02.teach.forty_eight:
    title: Сорок восемь
    gloss: 48 — сорок восемь
    note: Achtenveertig — это acht + en + veertig, пишется одним словом.
    example_gloss: Я живу в доме номер сорок восемь.
  nl.a1.unit02.lesson02.teach.seventy_five:
    title: Семьдесят пять
    gloss: 75 — семьдесят пять
    note: В слове vijfenzeventig vijf стоит перед zeventig.
    example_gloss: Это стоит семьдесят пять центов.
  nl.a1.unit02.lesson02.teach.ninety_nine:
    title: Девяносто девять
    gloss: 99 — девяносто девять
    note: Negenennegentig — одно сложное слово.
    example_gloss: Мне девяносто девять лет.
  nl.a1.unit02.lesson03.teach.ask_phone:
    title: Спросить номер телефона
    gloss: Какой у тебя номер телефона?
    note: Слово je делает вопрос неформальным, как и подобает обстановке языкового кафе, где общаются Лотте и Омар.
  nl.a1.unit02.lesson03.teach.phone_number:
    title: Назвать нидерландский мобильный номер
    gloss: Мой номер телефона — 06 21 43 65 87.
    note: Нидерландские мобильные номера начинаются с 06; обычно их записывают как 06 и ещё восемь цифр.
  nl.a1.unit02.lesson03.teach.phone_spoken:
    title: Назвать номер телефона группами цифр
    gloss: ноль шесть, двадцать один, сорок три, шестьдесят пять, восемьдесят семь
    note: Цифры телефона группируют по-разному. В этом курсе номер называют как 06 и далее двузначные группы; но произносить цифры по одной тоже нормально, если важна ясность.
  nl.a1.unit02.lesson03.teach.ask_house_number:
    title: Спросить номер дома
    gloss: Какой у тебя номер дома?
    note: Huisnummer — это номер дома в адресе.
  nl.a1.unit02.lesson03.teach.house_number:
    title: Назвать номер дома
    gloss: Мой номер дома — 48.
    note: В письменном адресе или в анкете естественно писать цифрами.
  nl.a1.unit02.lesson03.teach.live_number:
    title: Сказать, где ты живёшь, по номеру дома
    gloss: Я живу в доме номер сорок восемь.
    note: Op nummer ... — естественный способ назвать номер дома, когда улица уже известна.
  nl.a1.unit02.lesson03.teach.repeat:
    title: Попросить повторить
    gloss: Ты можешь повторить?
    note: Пригодится, когда ты не успел расслышать номер телефона, названный слишком быстро.
  nl.a1.unit02.lesson04.teach.ask_age:
    title: Неформально спросить о возрасте
    gloss: Сколько тебе лет?
    note: Здесь используется неформальное je; спрашивать о возрасте уместно только тогда, когда это связано с ситуацией.
  nl.a1.unit02.lesson04.teach.age_twenty_eight:
    title: Назвать свой возраст
    gloss: Мне двадцать восемь лет.
    note: 'По-нидерландски говорят Ik ben ... jaar, буквально «я есть ... год»: глагол zijn («быть»), а не «иметь», и слово jaar остаётся в единственном числе.'
  nl.a1.unit02.lesson04.teach.age_thirty_two:
    title: Назвать возраст Омара
    gloss: Омару тридцать два года.
    note: При указании возраста после числа слово jaar не принимает окончания множественного числа.
  nl.a1.unit02.lesson04.teach.how_many_people:
    title: Спросить, сколько людей
    gloss: Сколько там людей?
    note: Hoeveel стоит прямо перед существительным mensen.
  nl.a1.unit02.lesson04.teach.twelve_people:
    title: Назвать количество людей
    gloss: Там двенадцать человек.
    note: Er zijn — обычная конструкция для множественного числа со значением «есть, имеются».
  nl.a1.unit02.lesson04.teach.three_books:
    title: Посчитать книги
    gloss: У меня три книги.
    note: После числительных больше единицы слово boek принимает форму множественного числа boeken.
  nl.a1.unit02.lesson04.teach.seven_chairs:
    title: Посчитать стулья
    gloss: семь стульев
    note: Stoelen — множественное число от stoel.
  nl.a1.unit02.lesson05.teach.euro:
    title: Euro
    gloss: евро
    note: 'После названной суммы euro обычно остаётся в единственном числе: twee euro, а не twee euro''s.'
    example_gloss: Это стоит два евро.
  nl.a1.unit02.lesson05.teach.cent:
    title: Cent
    gloss: цент
    note: Cent в цене после числа тоже обычно остаётся в единственном числе.
    example_gloss: Это пятьдесят центов.
  nl.a1.unit02.lesson05.teach.ask_price:
    title: Спросить цену
    gloss: Сколько это стоит?
    note: Hoeveel спрашивает о количестве, а kost значит «стоит».
  nl.a1.unit02.lesson05.teach.two_fifty:
    title: Два евро пятьдесят
    gloss: €2,50 — два евро пятьдесят
    note: В нидерландском, как и в русском, в записи суммы используется десятичная запятая. В обычной речи €2,50 чаще всего произносят twee euro vijftig, без en (то есть без «и»).
  nl.a1.unit02.lesson05.teach.seventy_five_cents:
    title: Семьдесят пять центов
    gloss: €0,75 — семьдесят пять центов
    note: Если сумма меньше одного евро, естественно назвать только центы.
  nl.a1.unit02.lesson05.teach.twelve_euros:
    title: Двенадцать евро
    gloss: €12 — двенадцать евро
    note: Для цены в целых евро центы называть не нужно.
  nl.a1.unit02.lesson05.teach.four_fifty:
    title: Четыре евро пятьдесят
    gloss: €4,50 — четыре евро пятьдесят
    note: Та же схема произношения подходит и для других цен в евро и центах.
  nl.a1.unit02.lesson05.teach.costs:
    title: Назвать цену
    gloss: Это стоит два евро пятьдесят.
    note: Dat kost ... — прямой ответ на вопрос Hoeveel kost dit?
  nl.a1.unit02.lesson06.teach.opening:
    title: Омар записывается
    gloss: 'Сотрудница: Добрый день. Вы пришли в языковое кафе? Омар: Да, я хочу записаться.'
    note: Эта сцена продолжает рассказ о посещениях Омаром языкового кафе в библиотеке из первого раздела.
  nl.a1.unit02.lesson06.teach.phone_turn:
    title: Назвать номер телефона
    gloss: 'Сотрудница: Отлично. Какой у тебя номер телефона? Омар: 06 21 43 65 87.'
    note: Омар называет номер двузначными группами, как мы отрабатывали раньше.
  nl.a1.unit02.lesson06.teach.house_turn:
    title: Назвать номер дома
    gloss: 'Сотрудница: А какой у тебя номер дома? Омар: Сорок восемь.'
    note: Когда вопрос задаёт контекст, естественно ответить коротко, одним числом.
  nl.a1.unit02.lesson06.teach.fee_turn:
    title: Понять сумму взноса
    gloss: 'Сотрудница: Взнос — два евро пятьдесят. Омар: Хорошо.'
    note: 'Цена в речи произносится по обычной схеме: евро плюс центы.'
  nl.a1.unit02.lesson06.teach.group_turn:
    title: Спросить о размере группы
    gloss: 'Омар: Сколько человек в группе? Сотрудница: Двенадцать.'
    note: В этой сцене повторяется вопрос с Hoeveel mensen ..., изученный ранее в этом разделе.
  nl.a1.unit02.lesson06.teach.room_turn:
    title: Найти номер зала
    gloss: 'Сотрудница: Языковое кафе в зале двадцать один.'
    note: Zaal — это зал или помещение, где проходит какое-то мероприятие.
  nl.a1.unit02.lesson06.teach.lotte_turn:
    title: Найти столик Лотте
    gloss: 'Лотте: Привет, Омар! Мы сидим за столом семь.'
    note: Диалог заканчивается тем, что Омар снова встречает Лотте в такой же неформальной обстановке.
