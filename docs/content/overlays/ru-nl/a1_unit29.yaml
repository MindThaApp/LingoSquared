teaching:
  nl.a1.unit29.lesson01.teach.hobbies_set1:
    title: Чтение, спорт, готовка
    gloss: читать, заниматься спортом, готовить
    note: 'Три распространённых глагола о хобби: *lezen* (читать), *sporten* (заниматься спортом) и *koken* (готовить).'
    example_gloss:
    - Мне нравится читать книгу.
    - По субботам я занимаюсь спортом.
    - Мне нравится готовить для друзей.
  nl.a1.unit29.lesson01.teach.vrije_tijd:
    title: Свободное время
    gloss: свободное время
    note: '*De vrije tijd* — существительное общего рода: *de vrije tijd*. Это ключевое выражение для разговора о хобби.'
    example_gloss: В свободное время я люблю читать.
  nl.a1.unit29.lesson01.teach.in_vrije_tijd:
    title: Как сказать, чем занимаешься в свободное время
    gloss: В свободное время я люблю читать.
    note: '*Lees* — форма 1-го лица единственного числа от *lezen* (читать).'
  nl.a1.unit29.lesson02.teach.hobbies_set2:
    title: Музыка, рисование, видеоигры
    gloss: слушать музыку, рисовать, играть в видеоигры
    note: 'Ещё три глагола о хобби: *muziek luisteren* (слушать музыку), *tekenen* (рисовать) и *gamen* (играть в видеоигры) — распространённое нидерландское заимствование из английского.'
    example_gloss:
    - Я люблю слушать музыку.
    - Я часто рисую.
    - Я люблю играть в видеоигры с друзьями.
  nl.a1.unit29.lesson02.teach.luister_muziek:
    title: Говорим, что любим слушать музыку
    gloss: Я люблю слушать музыку.
    note: После *luisteren naar* (слушать) перед объектом всегда стоит *naar*.
  nl.a1.unit29.lesson02.teach.game_vrienden:
    title: Говорим, что любим играть в видеоигры с друзьями
    gloss: Я люблю играть в видеоигры с друзьями.
    note: '*Met vrienden* (с друзьями) повторяет слово *vrienden* из урока 1.'
  nl.a1.unit29.lesson03.teach.frequency_set1:
    title: Всегда, часто, иногда, никогда
    gloss: всегда, часто, иногда, никогда
    note: Четыре основных наречия частоты. *Vaak* уже встречалось в разделе 5 во фразе *Zie je hem vaak?*; остальные три здесь новые.
    example_gloss:
    - Я всегда занимаюсь спортом по субботам.
    - Я часто читаю книгу.
    - Иногда я рисую.
    - Я никогда не играю в видеоигры.
  nl.a1.unit29.lesson03.teach.frequency_set2:
    title: Каждую неделю, каждые выходные
    gloss: каждую неделю, каждые выходные
    note: '*Elke week* и *elk weekend* означают «каждую неделю» и «каждые выходные», но форма слова «каждый» зависит от рода существительного — см. следующую карточку.'
    example_gloss:
    - Я каждую неделю готовлю для друзей.
    - Я занимаюсь спортом каждые выходные.
  nl.a1.unit29.lesson03.teach.elke_elk_grammar:
    title: Elke и elk
    gloss: С de-словами, как week, используется elke. С het-словами, как weekend, используется elk.
    note: '*Week* — de-слово (*de week*), поэтому берёт *elke*; *weekend* — het-слово (*het weekend*), поэтому берёт *elk*. Это тот же принцип выбора de/het, что и в *de rekening* и *het wisselgeld* в разделе 23.'
  nl.a1.unit29.lesson03.teach.vrije_tijd_vraag:
    title: Спрашиваем о свободном времени
    gloss: Чем ты занимаешься в свободное время?
    note: Это главный вопрос этого раздела — с ним можно спросить любого человека о его увлечениях.
  nl.a1.unit29.lesson04.teach.lotte_callback:
    title: Лотте заводит разговор о хобби
    gloss: 'Лотте: Мы часто гуляем вместе. А чем ты ещё занимаешься в свободное время, Омар?'
    note: '*We wandelen vaak samen* отсылает к разделу 13, где и Лотте, и Омар говорили, что любят *wandelen*.'
  nl.a1.unit29.lesson04.teach.omar_cook_sport:
    title: Хобби Омара
    gloss: 'Омар: Я люблю готовить, в том числе дома. И часто занимаюсь спортом.'
    note: '*Ook thuis* (и дома) поясняет, что Омар готовит для удовольствия, а не только на работе в ресторане.'
  nl.a1.unit29.lesson04.teach.lotte_surprised:
    title: Лотте удивлена
    gloss: 'Лотте: Ты и дома готовишь? Ты же целый день готовишь на работе!'
    note: '*Al de hele dag* (уже целый день) подчёркивает, как много Омар и так готовит на работе.'
  nl.a1.unit29.lesson04.teach.omar_relaxing:
    title: Омар объясняет
    gloss: 'Омар: Да, но готовка меня расслабляет. А ты, что ты любишь делать?'
    note: 'В *Koken vind ik ontspannend* дополнение *koken* вынесено вперёд для выразительности — буквально: «готовить — это я нахожу расслабляющим».'
  nl.a1.unit29.lesson04.teach.lotte_reads_music:
    title: Хобби Лотте
    gloss: 'Лотте: Я люблю читать и часто слушаю музыку.'
    note: Два глагола о хобби из уроков 1–2 соединены в одном предложении с помощью *en* (и).
  nl.a1.unit29.lesson04.teach.omar_ask_game:
    title: Омар спрашивает про игры
    gloss: 'Омар: А ты играешь в игры?'
    note: Короткий вопрос с ответом «да/нет» с глаголом *gamen* из урока 2.
  nl.a1.unit29.lesson04.teach.lotte_no_game_draw:
    title: Ответ Лотте
    gloss: 'Лотте: Нет, я никогда не играю. Зато иногда рисую!'
    note: '*Nooit* (никогда) и *soms* (иногда) из урока 3 противопоставлены в одном ответе.'
  nl.a1.unit29.lesson05.teach.vergelijking:
    title: Сравниваем увлечения
    gloss: Мы с Омаром часто гуляем вместе. Но у нас есть и другие хобби. Омар любит готовить, в том числе дома, и часто занимается спортом. Я люблю читать и часто слушаю музыку. Иногда я рисую, но в игры не играю никогда. А что любишь делать ты в свободное время?
    note: Сообщение Лотте напоминает факты из урока 4 и заканчивается главным вопросом раздела, обращённым к читателю.
    glosses:
      wandelen: гуляем
      vaak: часто
      samen: вместе
      andere: другие
      kookt: готовит
      graag: нравится
      thuis: дома
      sport: занимается спортом
      lees: читать
      luister: слушаю
      muziek: музыка
      teken: рисую
      soms: иногда
      game: играть в видеоигры
      nooit: никогда
      vrije: свободное
      tijd: время
  nl.a1.unit29.lesson06.teach.omar_ask_weekend:
    title: Омар спрашивает про выходные
    gloss: 'Омар: Что ты делаешь в эти выходные?'
    note: '*Dit weekend* (в эти выходные) повторяет выражение времени из раздела 19.'
  nl.a1.unit29.lesson06.teach.lotte_unsure:
    title: Лотте не определилась
    gloss: 'Лотте: Пока не знаю. Я люблю читать, но мне хочется и на улицу.'
    note: '*Naar buiten* (на улицу, буквально «наружу») — обычный способ сказать, что хочется выйти из дома.'
  nl.a1.unit29.lesson06.teach.omar_suggest_walk_cook:
    title: Омар предлагает план
    gloss: 'Омар: Давай погуляем вместе? Потом я приготовлю для нас.'
    note: '*Daarna* (потом) повторяет слово последовательности из *eerst, dan, daarna* в разделе 10.'
  nl.a1.unit29.lesson06.teach.lotte_agree_both:
    title: Лотте соглашается
    gloss: 'Лотте: Хорошая идея! Мне нравится и гулять, и готовить.'
    note: '*Allebei* (оба) показывает, что Лотте одинаково нравятся оба занятия.'
  nl.a1.unit29.lesson06.teach.omar_confirm_saturday:
    title: Омар подтверждает
    gloss: 'Омар: Отлично. Тогда увидимся в субботу!'
    note: Дружеская заключительная реплика, подтверждающая план на *zaterdag* (субботу).
