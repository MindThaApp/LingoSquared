course:
  title: Нидерландский A1
  description: 'Нидерландский для начинающих: естественные приветствия, знакомство и первые встречи в Нидерландах.'
units:
  nl.a1.unit01.greetings_and_introductions:
    title: Приветствия и первые встречи
lessons:
  nl.a1.unit01.lesson01.jij_je_en_u:
    title: Неформальное jij/je и формальное u
  nl.a1.unit01.lesson02.groeten_en_welzijn:
    title: Приветствия и вопрос «как дела?»
  nl.a1.unit01.lesson03.namen:
    title: Обмен именами
  nl.a1.unit01.lesson04.herkomst_en_taal:
    title: Откуда ты и на каком языке говоришь
  nl.a1.unit01.lesson05.taalcafe:
    title: Знакомство в языковом кафе
  nl.a1.unit01.lesson06.eerste_ontmoeting:
    title: Как завершить первую встречу
teaching:
  nl.a1.unit01.lesson01.teach.hallo_hoi:
    title: Hallo и Hoi
    gloss: привет / здравствуйте
    note: '*Hallo* — нейтральное слово, подходит и в неформальном, и в формальном общении. *Hoi* — распространённое неформальное приветствие.'
    example_gloss:
    - Здравствуйте, вы здесь новенький?
    - Привет, я Ноор.
  nl.a1.unit01.lesson01.teach.jij_je_u:
    title: '«Ты» и «вы»: неформальные и формальная формы'
    gloss: ты (ударная неформальная форма) / ты (безударная неформальная форма) / вы (формальная форма)
    note: '*Jij* — неформальное «ты» в единственном числе; оно ставится под ударением или при противопоставлении. *Je* — обычная безударная форма «ты» в повседневной речи. *U* выражает уважительную дистанцию. В Нидерландах оно естественно с пожилыми незнакомыми людьми и в подчёркнуто формальных отношениях, но jij/je часто используют и взрослые во многих магазинах и на работе.'
    example_gloss:
    - Ты здесь новенький? (неформально, с ударением)
    - Ты здесь новенький. (неформально, без ударения)
    - Вы здесь новенький? (формально)
  nl.a1.unit01.lesson01.teach.informal_new:
    title: Спросить ровесника, новенький ли он
    gloss: Ты здесь новенький?
    note: 'В вопросе *jij bent* превращается в *ben jij*: если *jij* стоит после глагола, окончание -t отпадает.'
  nl.a1.unit01.lesson01.teach.formal_new:
    title: Формально спросить, новенький ли человек
    gloss: Вы здесь новенький?
    note: С *u* используется *bent u*. Окончание -t остаётся.
  nl.a1.unit01.lesson01.teach.register_rule:
    title: Как выбрать форму обращения
    gloss: 'jij/je: неформально · u: формально или вежливо'
    note: '*Jij/je* используют с друзьями, ровесниками, детьми и во многих непринуждённых современных ситуациях. *U* употребляют, когда отношения требуют уважения или дистанции; предпочтения бывают разными, поэтому ориентируйся на собеседника.'
  nl.a1.unit01.lesson02.teach.goedemorgen_tot_goedenavond:
    title: Приветствия утром, днём и вечером
    gloss: доброе утро / добрый день / добрый вечер
    note: '*Goedemorgen* говорят утром, обычно примерно до полудня. *Goedemiddag* говорят с полудня и в течение дня. *Goedenavond* — вечернее приветствие.'
    example_gloss:
    - Доброе утро! Как дела?
    - Добрый день, как ваши дела? (формально)
    - Добрый вечер! Ты здесь новенький?
  nl.a1.unit01.lesson02.teach.hoe_gaat_het:
    title: Как дела?
    gloss: Как вы поживаете?
    note: '*Hoe gaat het?* — распространённый нейтральный способ спросить, как дела.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_je:
    title: Как у тебя дела? Неформально
    gloss: Как вы поживаете?
    note: '*Met je* прямо указывает на собеседника и звучит неформально.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_u:
    title: Как у вас дела? Формально
    gloss: Как вы поживаете?
    note: '*Met u* используют, когда ситуация требует формального обращения.'
  nl.a1.unit01.lesson02.teach.goed_dank_je:
    title: 'Хорошо, спасибо: неформально'
    gloss: Хорошо, спасибо.
    note: '*Dank je* подходит к неформальному обращению.'
  nl.a1.unit01.lesson02.teach.goed_dank_u:
    title: 'Хорошо, спасибо: формально'
    gloss: Хорошо, спасибо.
    note: '*Dank u* подходит к формальному обращению.'
  nl.a1.unit01.lesson02.teach.prima:
    title: Отлично
    gloss: отлично / хорошо
    note: '*Prima* — короткий положительный ответ.'
    example_gloss: Отлично, спасибо.
  nl.a1.unit01.lesson02.teach.niet_slecht:
    title: Неплохо
    gloss: неплохо
    note: '*Niet slecht* обычно звучит как слегка положительный ответ.'
  nl.a1.unit01.lesson02.teach.en_met_jou:
    title: А у тебя? Неформально
    gloss: А вы?
    note: '*Jou* — ударная неформальная форма после *met*.'
  nl.a1.unit01.lesson02.teach.en_met_u:
    title: А у вас? Формально
    gloss: А вы?
    note: '*U* сохраняет формальный тон встречного вопроса.'
  nl.a1.unit01.lesson03.teach.hoe_heet_je:
    title: Спрашиваем имя неформально
    gloss: Как вас зовут?
    note: '*Hoe heet je?* — обычный неформальный вопрос об имени.'
  nl.a1.unit01.lesson03.teach.hoe_heet_u:
    title: Спрашиваем имя вежливо
    gloss: Как вас зовут?
    note: '*Hoe heet u?* — вежливая форма; *Wat is uw naam?* — другой формальный вариант, который звучит более официально и здесь не проверяется.'
  nl.a1.unit01.lesson03.teach.ik_heet_noor:
    title: Называем своё имя
    gloss: Меня зовут Ноор.
    note: '*Ik heet ...* — прямой стандартный способ назвать своё имя.'
  nl.a1.unit01.lesson03.teach.ik_ben_noor:
    title: Естественно представиться
    gloss: Я Ноор.
    note: '*Ik ben ...* особенно часто встречается при знакомстве в устной речи.'
  nl.a1.unit01.lesson03.teach.mijn_naam:
    title: Меня зовут
    gloss: Меня зовут Ноор.
    note: '*Mijn naam is ...* — правильно, но звучит чуть более подчёркнуто, чем *Ik ben ...* или *Ik heet ...*.'
  nl.a1.unit01.lesson03.teach.leuk_ontmoeten:
    title: Приятно познакомиться
    gloss: Очень приятно.
    note: Это дружелюбная и естественная фраза при первой встрече.
  nl.a1.unit01.lesson03.teach.aangenaam:
    title: Очень приятно
    gloss: очень приятно
    note: '*Aangenaam* — принятая формула, более формальная, чем *Leuk je te ontmoeten*.'
    example_gloss: Очень приятно! Я Ноор.
  nl.a1.unit01.lesson04.teach.where_from_informal:
    title: Спросить, откуда человек
    gloss: Откуда вы?
    note: '*Kom je* — неформальная форма вопроса.'
  nl.a1.unit01.lesson04.teach.where_from_formal:
    title: Формально спросить, откуда человек
    gloss: Откуда вы?
    note: 'С *u* глагол имеет форму *komt*: *Waar komt u vandaan?*'
  nl.a1.unit01.lesson04.teach.from_netherlands:
    title: Из Нидерландов
    gloss: Я из Нидерландов.
    note: Перед названием страны происхождения используется *uit*.
  nl.a1.unit01.lesson04.teach.from_belgium:
    title: Из Бельгии
    gloss: Я из Бельгии.
    note: В слове *België* над второй e стоит трема.
  nl.a1.unit01.lesson04.teach.from_germany:
    title: Из Германии
    gloss: Я из Германии.
    note: '*Duitsland* — это страна, а *Duits* — язык.'
  nl.a1.unit01.lesson04.teach.dutch_nationality:
    title: 'Национальность: нидерландец'
    gloss: Я нидерландец.
    note: '*Nederlands* может обозначать и национальность, и нидерландский язык. В русском для этого есть разные слова.'
  nl.a1.unit01.lesson04.teach.belgian_nationality:
    title: 'Национальность: бельгиец'
    gloss: Я бельгиец.
    note: '*Belgisch* здесь обозначает бельгийскую национальность.'
  nl.a1.unit01.lesson04.teach.speak_dutch:
    title: Говорить по-нидерландски
    gloss: Я говорю по-нидерландски.
    note: В нидерландском названия языков пишутся с большой буквы, в отличие от русского.
  nl.a1.unit01.lesson04.teach.speak_english:
    title: Говорить по-английски
    gloss: Я говорю по-английски.
    note: '*Engels* — нидерландское слово для обозначения английского языка; пишется с большой буквы, в отличие от русского.'
  nl.a1.unit01.lesson04.teach.speak_german:
    title: Говорить по-немецки
    gloss: Я говорю по-немецки.
    note: '*Duits* — нидерландское слово для обозначения немецкого языка; пишется с большой буквы, в отличие от русского.'
  nl.a1.unit01.lesson05.teach.taalcafe_bibliotheek:
    title: Языковое кафе и библиотека
    gloss: языковое кафе / библиотека
    note: '*Taalcafé* — непринуждённая встреча, где можно практиковать нидерландский с другими людьми. Публичные библиотеки в Нидерландах часто проводят местные мероприятия, в том числе языковые кафе.'
    example_gloss:
    - Я пришёл в языковое кафе.
    - Я учу нидерландский в библиотеке.
  nl.a1.unit01.lesson05.teach.location:
    title: Место встречи
    gloss: Языковое кафе проходит в библиотеке.
    note: Эта фраза задаёт место действия сцены.
  nl.a1.unit01.lesson05.teach.here_for:
    title: Уточнить общее занятие
    gloss: Ты пришёл в языковое кафе?
    note: Это естественный неформальный способ начать разговор, когда двое пришли на одно и то же мероприятие.
  nl.a1.unit01.lesson05.teach.yes_here_for:
    title: Подтвердить, зачем пришёл
    gloss: Да, я пришёл в языковое кафе.
    note: В ответе чётко повторяется название занятия.
  nl.a1.unit01.lesson05.teach.learning:
    title: Сказать, что ты изучаешь
    gloss: Я учу нидерландский.
    note: '*Leer* — форма первого лица глагола *leren* («учить, изучать»).'
  nl.a1.unit01.lesson05.teach.me_too:
    title: Я тоже
    gloss: Я тоже.
    note: '*Ik ook* — короткий естественный способ сказать, что у вас есть что-то общее.'
  nl.a1.unit01.lesson05.teach.first_time:
    title: Спросить, впервые ли человек здесь
    gloss: Ты здесь впервые?
    note: Это дружеская непринуждённая беседа на регулярном занятии.
  nl.a1.unit01.lesson05.teach.first_time_answer:
    title: Скажи, что ты здесь впервые
    gloss: Да, я здесь впервые.
    note: '*Mijn* означает «мой».'
  nl.a1.unit01.lesson06.teach.lotte_opening:
    title: Лотте начинает разговор
    gloss: 'Лотте: Привет, я Лотте. Как тебя зовут?'
    note: 'В этой непринуждённой группе Лотте говорит неформально: *je*.'
  nl.a1.unit01.lesson06.teach.omar_name:
    title: Омар называет своё имя
    gloss: 'Омар: Меня зовут Омар. Приятно познакомиться.'
    note: Он отвечает на вопрос об имени и выражает радость от знакомства.
  nl.a1.unit01.lesson06.teach.lotte_origin_question:
    title: Лотте спрашивает, откуда он
    gloss: 'Лотте: Мне тоже! Откуда ты?'
    note: '*Jou ook!* — естественный короткий ответ на *Leuk je te ontmoeten*.'
  nl.a1.unit01.lesson06.teach.omar_origin:
    title: Омар говорит, откуда он
    gloss: 'Омар: Я из Египта. А ты?'
    note: '*En jij?* — тот же вопрос в неформальной форме.'
  nl.a1.unit01.lesson06.teach.lotte_context:
    title: Лотте продолжает беседу
    gloss: 'Лотте: Я из Нидерландов. Ты в языковом кафе впервые?'
    note: '*Bij het taalcafé* означает «в языковом кафе» как на мероприятии.'
  nl.a1.unit01.lesson06.teach.omar_language:
    title: Омар отвечает и говорит, что он изучает
    gloss: 'Омар: Да, я здесь впервые. Я учу нидерландский.'
    note: Сначала он отвечает на вопрос Лотте, а потом добавляет один базовый факт о себе.
  nl.a1.unit01.lesson06.teach.tot_ziens:
    title: Прощание
    gloss: До свидания!
    note: '*Tot ziens* — нейтральное прощание.'
  nl.a1.unit01.lesson06.teach.closing:
    title: Естественное завершение разговора
    gloss: 'Лотте: Отлично! До встречи на следующей неделе. Омар: До встречи на следующей неделе!'
    note: Повторять *Tot volgende week* естественно, когда оба собеседника собираются прийти снова.
exercises:
  nl.a1.unit01.lesson01.exercise01.choose_informal:
    instruction: В каком варианте две неформальные формы единственного числа для «ты»?
    correct_option: jij / je
    distractors:
    - u
    - jij / u
    - je / u
    accepted_answers:
    - value: jij / je
      status: correct
    feedback: Jij и je — неформальные формы единственного числа, а u — вежливая форма.
  nl.a1.unit01.lesson01.exercise02.choose_formal:
    instruction: Выбери вежливое местоимение, чтобы закончить вопрос.
    correct_option: u
    distractors:
    - jij
    - je
    - ik
    accepted_answers:
    - value: u
      status: correct
    feedback: Bent u nieuw hier? — вежливое обращение.
  nl.a1.unit01.lesson01.exercise03.listen_formal:
    instruction: Послушай и выбери ситуацию, которая подходит к вопросу.
    correct_option: Человека, к которому обращаются на «вы», спрашивают, новичок ли он здесь.
    distractors:
    - Ровесника спрашивают, новичок ли он здесь.
    - Человека, к которому обращаются на «вы», спрашивают, живёт ли он здесь.
    - Человека, к которому обращаются на «вы», спрашивают, местный ли он.
    accepted_answers:
    - value: Человека, к которому обращаются на «вы», спрашивают, новичок ли он здесь.
      status: correct
    feedback: В Bent u nieuw hier? для вежливого обращения используются u и bent.
  nl.a1.unit01.lesson01.exercise04.match_register:
    instruction: Соедини каждую нидерландскую форму с её регистром.
    accepted_answers:
    - value:
      - left: jij / je
        right: informeel
      - left: u
        right: formeel of beleefd
      status: correct
    feedback: Jij/je — неформальные формы, u — вежливая, формальная.
    pairs:
    - left: jij / je
      right: informeel
    - left: u
      right: formeel of beleefd
  nl.a1.unit01.lesson01.exercise05.order_formal:
    instruction: 'Расставь слова в правильном порядке, чтобы вежливо спросить: «Вы здесь новичок?»'
    accepted_answers:
    - value:
      - Bent
      - u
      - nieuw
      - hier
      status: correct
    feedback: 'Вежливый вопрос звучит так: Bent u nieuw hier?'
  nl.a1.unit01.lesson01.exercise06.listen_order_informal:
    instruction: Послушай и расставь слова неформального вопроса в правильном порядке.
    accepted_answers:
    - value:
      - Ben
      - jij
      - nieuw
      - hier
      status: correct
    feedback: 'В записи звучит: Ben jij nieuw hier?'
  nl.a1.unit01.lesson01.exercise07.complete_formal:
    instruction: Закончи вежливый вопрос.
    accepted_answers:
    - value: Bent
      status: correct
    - value: bent
      status: correct
    feedback: 'С u используется bent: Bent u nieuw hier?'
  nl.a1.unit01.lesson01.exercise08.listen_type_formal:
    instruction: Послушай и напиши весь вопрос по-нидерландски.
    accepted_answers:
    - value: Bent u nieuw hier?
      status: correct
    - value: Bent u nieuw hier
      status: correct
    - value: bent u nieuw hier?
      status: correct
    - value: bent u nieuw hier
      status: correct
    feedback: 'В записи звучит: Bent u nieuw hier?'
  nl.a1.unit01.lesson02.exercise01.choose_morning:
    instruction: Выбери приветствие, подходящее для 08:30.
    correct_option: Goedemorgen
    distractors:
    - Goedemiddag
    - Goedenavond
    - Hoi
    accepted_answers:
    - value: Goedemorgen
      status: correct
    feedback: Goedemorgen — приветствие для утра.
    prompt_blocks:
    - 08:30
  nl.a1.unit01.lesson02.exercise02.listen_evening:
    instruction: Послушай и выбери русское значение.
    correct_option: Добрый вечер
    distractors:
    - Доброе утро
    - Добрый день
    - До свидания
    accepted_answers:
    - value: Добрый вечер
      status: correct
    feedback: Goedenavond означает «Добрый вечер».
  nl.a1.unit01.lesson02.exercise03.choose_formal_question:
    instruction: Ты говоришь с пожилым клиентом и выбираешь вежливое обращение. Какой вопрос подойдёт?
    correct_option: Hoe gaat het met u?
    distractors:
    - Hoe gaat het met je?
    - Hoe gaat het met jou?
    - Hoe gaat het met jij?
    accepted_answers:
    - value: Hoe gaat het met u?
      status: correct
    feedback: Met u делает вопрос вежливым.
  nl.a1.unit01.lesson02.exercise04.match_times:
    instruction: Соедини каждое приветствие с подходящим временем суток.
    accepted_answers:
    - value:
      - left: Goedemorgen
        right: 08:30
      - left: Goedemiddag
        right: '14:00'
      - left: Goedenavond
        right: '20:00'
      status: correct
    feedback: Приветствия утром, днём и вечером зависят от времени суток.
    pairs:
    - left: Goedemorgen
      right: 08:30
    - left: Goedemiddag
      right: '14:00'
    - left: Goedenavond
      right: '20:00'
  nl.a1.unit01.lesson02.exercise05.listen_order_formal:
    instruction: Послушай и расставь слова вежливого вопроса о самочувствии в правильном порядке.
    accepted_answers:
    - value:
      - Hoe
      - gaat
      - het
      - met
