teaching:
  nl.a1.unit07.lesson01.teach.markt_winkel_kraam:
    title: Рынок, магазин, прилавок
    gloss: рынок, магазин, прилавок
    note: '*De markt* может означать рынок вообще или регулярный рынок под открытым небом. *De winkel* — это магазин. *Kraam* — это прилавок или палатка на уличном рынке.'
    example_gloss:
    - Я иду на рынок.
    - Я иду в магазин.
    - На прилавке продают яблоки.
  nl.a1.unit07.lesson01.teach.appels_peren_tomaten_paprikas:
    title: Яблоки, груши, помидоры, перцы
    gloss: яблоки, груши, помидоры, перцы
    note: Единственное число — *appel*, множественное — *appels*. Единственное — *peer*, множественное — *peren*. Единственное — *tomaat*, множественное — *tomaten*. По-нидерландски *paprika* — это болгарский перец; на письме множественное число — *paprika's*.
    example_gloss:
    - Я хотел бы яблоки.
    - Я хотел бы груши.
    - Я хотел бы помидоры.
    - Я хотел бы перцы.
  nl.a1.unit07.lesson02.teach.kilo:
    title: Килограмм
    gloss: килограмм
    note: '*Een kilo* — это один килограмм.'
    example_gloss: Мне нужен килограмм яблок.
  nl.a1.unit07.lesson02.teach.per_kilo:
    title: Per kilo
    gloss: за килограмм
    note: На рынке на ценниках часто указана цена за килограмм.
  nl.a1.unit07.lesson02.teach.ask_apples:
    title: Сколько стоит килограмм яблок?
    gloss: Сколько стоит килограмм яблок?
    note: '*Hoeveel kost ...?* спрашивает о цене. Здесь подлежащее — *een kilo*, поэтому глагол стоит в единственном числе: *kost*.'
  nl.a1.unit07.lesson02.teach.answer_apples:
    title: Килограмм яблок стоит 2,50 €
    gloss: Килограмм яблок стоит 2,50 €.
    note: 'В нидерландских ценах, как и в русском, перед центами ставится запятая: €2,50.'
  nl.a1.unit07.lesson02.teach.spoken_price:
    title: Два евро пятьдесят
    gloss: 2,50 € — два евро пятьдесят
    note: €2,50 обычно говорят *twee euro vijftig*, без *en* и без *cent*.
  nl.a1.unit07.lesson03.teach.gram_pond_stuk_stuks:
    title: Граммы, фунт, одна штука, две штуки
    gloss: сто граммов, фунт = 500 граммов, одна штука, две штуки
    note: 'После числа здесь используется форма *gram*, а не *grammen*. В повседневной речи *een pond* — это 500 граммов: старое разговорное название, не официальная метрическая единица (русский фунт — около 410 граммов). *Per stuk* значит, что цена указана за каждую штуку; когда количество называют отдельно, после чисел больше одного говорят *stuks*, например *twee stuks*.'
    example_gloss:
    - Мне нужно сто граммов сыра.
    - Пожалуйста, фунт яблок.
    - Можно мне один, пожалуйста?
    - Мне два, пожалуйста.
  nl.a1.unit07.lesson03.teach.how_much:
    title: Сколько вам нужно?
    gloss: Сколько вы хотите?
    note: Продавец говорит вежливо, на *u*. *Hoeveel* можно спрашивать и о весе, и о количестве штук.
  nl.a1.unit07.lesson03.teach.pond_tomatoes:
    title: Фунт помидоров, пожалуйста
    gloss: Фунт (500 г) помидоров, пожалуйста.
    note: Это полный и естественный короткий ответ на вопрос продавца *Hoeveel wilt u?*
  nl.a1.unit07.lesson04.teach.prijskaartje:
    title: Ценник
    gloss: ценник
    note: '*Prijskaartje* пишется слитно. Запомни слово целиком.'
    example_gloss: На ценнике написано 2,50 €.
  nl.a1.unit07.lesson04.teach.market_labels:
    title: Ценники на рынке
    gloss: 'Яблоки: 2,50 € за килограмм. Груши: 3,00 € за килограмм. Помидоры: 2,00 € за килограмм. Перцы: 1,00 € за штуку.'
    note: Читай *per kilo* как «за килограмм», а *per stuk* — как «за штуку». В нидерландских ценниках, как и в русских, пишут запятую в цене.
    glosses:
      Appels: яблоки
      kilo: килограмм
      Peren: груши
      Tomaten: помидоры
      stuk: штука
  nl.a1.unit07.lesson05.teach.what_would_you_like:
    title: Что вам предложить?
    gloss: Что вам угодно?
    note: '*Wat mag het zijn?* — частый дружелюбный вопрос продавца на рынке или в магазине.'
  nl.a1.unit07.lesson05.teach.take_pears:
    title: Тогда я возьму килограмм груш
    gloss: Тогда я возьму килограмм груш, пожалуйста.
    note: '*Dan neem ik ...* — естественный способ сказать, что покупаешь, услышав цену.'
  nl.a1.unit07.lesson05.teach.anything_else:
    title: Что-нибудь ещё?
    gloss: Что-нибудь ещё?
    note: Типичный короткий вопрос продавца.
  nl.a1.unit07.lesson05.teach.no_thanks:
    title: Нет, спасибо
    gloss: Нет, спасибо.
    note: '*Dank u* соответствует вежливому обращению на *u*, как с продавцом.'
  nl.a1.unit07.lesson05.teach.total:
    title: С вас 3,00 €
    gloss: С вас 3,00 € — три евро.
    note: '*Dat is dan ...* — обычный способ, которым продавец называет сумму. Цена €3,00 произносится *drie euro*.'
  nl.a1.unit07.lesson05.teach.pin:
    title: Можно оплатить картой?
    gloss: Можно оплатить картой?
    note: '*Pinnen* — повседневный нидерландский глагол: платить дебетовой или кредитной картой через терминал.'
  nl.a1.unit07.lesson06.teach.opening:
    title: Приветствие и вопрос о цене
    gloss: 'Продавец: Добрый день. Что вам предложить? Лотте: Добрый день. Сколько стоит килограмм яблок?'
    note: Это дружелюбный вежливый разговор покупателя с продавцом.
  nl.a1.unit07.lesson06.teach.purchase:
    title: Выбор количества
    gloss: 'Продавец: Два евро пятьдесят за килограмм. Лотте: Тогда я возьму килограмм, пожалуйста.'
    note: Раз из предыдущей реплики понятно, что речь о яблоках, Лотте может сказать просто *een kilo*.
  nl.a1.unit07.lesson06.teach.payment:
    title: Оплата картой
    gloss: 'Продавец: С вас два евро пятьдесят. Лотте: Можно оплатить картой? Продавец: Да, конечно.'
    note: '*Kan ik pinnen?* — обычный практичный вопрос при оплате.'
  nl.a1.unit07.lesson06.teach.closing:
    title: Завершение разговора
    gloss: 'Лотте: Спасибо. До свидания! Продавец: До свидания!'
    note: '*Tot ziens* подходит, чтобы закончить такой вежливый разговор с продавцом.'
