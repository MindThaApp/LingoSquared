course:
  title: Нидерландский A1
  description: 'Нидерландский для начинающих: как описать внешность человека — рост и впечатление о возрасте, цвет волос и глаз, главный вопрос Hoe ziet ... eruit? и сравнение внешности двух людей.'
units:
  nl.a1.unit30.appearance:
    title: Описываем внешность
lessons:
  nl.a1.unit30.lesson01.lang_klein_oud_jong:
    title: Высокий, низкий, пожилой и молодой
  nl.a1.unit30.lesson02.haar_beschrijven:
    title: Описываем волосы
  nl.a1.unit30.lesson03.ogen_en_eruitzien:
    title: Глаза и вопрос «Как выглядит человек?»
  nl.a1.unit30.lesson04.taalcafe_nina:
    title: Лотте описывает Нину
  nl.a1.unit30.lesson05.sander_fenna_vergelijken:
    title: Сравниваем Сандера и Фенну
  nl.a1.unit30.lesson06.taalcafe_herkenning:
    title: Омар узнаёт Нину
teaching:
  nl.a1.unit30.lesson01.teach.lang_klein:
    title: Высокий и низкий
    gloss: высокий / невысокий
    note: '*Lang* говорят о высоком человеке, *klein* — о низком (то же слово, что и для маленького предмета, как в других уроках курса).'
    example_gloss:
    - Фенна высокая.
    - Сандер низкий.
  nl.a1.unit30.lesson01.teach.oud_jong:
    title: Пожилой и молодой
    gloss: пожилой / молодой
    note: '*Oud* и *jong* здесь передают общее впечатление о внешности, а не точное число лет.'
    example_gloss:
    - Дедушка пожилой.
    - Омар молодой.
  nl.a1.unit30.lesson01.teach.oud_note:
    title: 'Oud: число или впечатление'
    gloss: Oud может означать точное число лет, как в Hoe oud ben je?, или общее впечатление без числа, как в Opa is oud.
    note: Ты уже знаешь *oud* из вопроса о точном возрасте (*Hoe oud ben je?*). Здесь оно описывает, как человек ВЫГЛЯДИТ по возрасту, без указания числа.
  nl.a1.unit30.lesson01.teach.fenna_sander_phrase:
    title: Фенна высокая, а Сандер низкий
    gloss: Фенна высокая, а Сандер низкий.
    note: Простое сложное предложение с *en* («и», «а»); оно готовит прямое сравнение в следующих уроках.
  nl.a1.unit30.lesson02.teach.haar_noun:
    title: Волосы
    gloss: волосы
    note: '*Haar* — слово среднего рода (het-word): *het haar*.'
    example_gloss: У Омара короткие чёрные волосы.
  nl.a1.unit30.lesson02.teach.haar_kleuren:
    title: Светлый, каштановый и седой
    gloss: светлый / каштановый / седой
    note: Три цвета волос. *Zwart* («чёрный») мы уже встречали в теме одежды — теперь оно используется для волос.
    example_gloss:
    - У Лотте светлые волосы.
    - У Сандера каштановые волосы.
    - У дедушки седые волосы.
  nl.a1.unit30.lesson02.teach.haar_lengte:
    title: Длинные и короткие (волосы)
    gloss: длинный / короткий (о волосах)
    note: '*Lang* («длинный») — то же слово, что и для роста, но теперь оно описывает длину волос. *Kort* («короткий») — новое слово.'
    example_gloss:
    - У Фенны длинные волосы.
    - У Сандера короткие волосы.
  nl.a1.unit30.lesson02.teach.haar_agreement_note:
    title: Haar с прилагательным без окончания
    gloss: 'Haar — слово среднего рода (het-word) без артикля, поэтому прилагательное остаётся без окончания: kort haar, lang haar, blond haar, bruin haar, grijs haar, zwart haar.'
    note: 'Перед *haar* в этой форме без артикля нет окончания -e. Сравни с *ogen*: там окончание -e есть.'
  nl.a1.unit30.lesson02.teach.haar_homoniem_note:
    title: 'Haar: два значения'
    gloss: 'У слова haar два значения: «волосы» (новое существительное этого урока) и «её» (притяжательное местоимение, например haar moeder). Какое из них имеется в виду, понятно из контекста.'
    note: 'В нидерландском это настоящие омонимы: *haar* («волосы») и *haar* («её») пишутся одинаково. Какое значение имеется в виду, всегда ясно из остальной части предложения.'
    target_text: 'У слова haar два значения: «волосы» (новое существительное этого урока) и «её» (притяжательное местоимение, например haar moeder). Какое из них имеется в виду, понятно из контекста.'
  nl.a1.unit30.lesson02.teach.omar_kort_zwart:
    title: У Омара короткие чёрные волосы
    gloss: У Омара короткие чёрные волосы.
    note: Снова слово *zwart* («чёрный») из темы одежды.
  nl.a1.unit30.lesson02.teach.lotte_lang_blond:
    title: У Лотте длинные светлые волосы
    gloss: У Лотте длинные светлые волосы.
    note: В одном естественном предложении соединены слова о длине и цвете из этого урока.
  nl.a1.unit30.lesson03.teach.ogen_noun:
    title: Глаза
    gloss: глаза
    note: '*Ogen* — множественное число от *het oog*; во множественном числе всегда стоит артикль *de*.'
    example_gloss: У Омара карие глаза.
  nl.a1.unit30.lesson03.teach.oog_kleuren:
    title: Голубой, карий и зелёный
    gloss: голубой / карий / зелёный
    note: '*Blauw* («голубой», «синий») мы уже встречали в теме одежды; *bruin* («коричневый», «карий») только что было в теме волос; *groen* («зелёный») — новое слово.'
    example_gloss:
    - У Лотте голубые глаза.
    - У Сандера карие глаза.
    - У Фенны зелёные глаза.
  nl.a1.unit30.lesson03.teach.ogen_agreement_note:
    title: Ogen с окончанием -e
    gloss: 'С ogen (множественное число) прилагательное получает дополнительное -e: blauwe ogen, bruine ogen, groene ogen.'
    note: Сравни с *haar*, где прилагательное остаётся без окончания. Во множественном числе прилагательное всегда получает -e, независимо от того, de-слово это или het-слово.
  nl.a1.unit30.lesson03.teach.hoe_ziet_eruit:
    title: Как выглядит Лотте?
    gloss: Как выглядит Лотте?
    note: '*Hoe ziet ... eruit?* — главный вопрос этого урока. С ним можно спросить о внешности любого человека.'
  nl.a1.unit30.lesson03.teach.antwoord_patroon:
    title: У Лотте длинные светлые волосы и голубые глаза
    gloss: У Лотте длинные светлые волосы и голубые глаза.
    note: 'Образец ответа: волосы и глаза в одном предложении, соединённые с помощью *en*.'
  nl.a1.unit30.lesson04.teach.lotte_intro_nina:
    title: Лотте рассказывает о Нине
    gloss: 'Лотте: В языковое кафе придёт новая девушка. Её зовут Нина.'
    note: '*Er komt* («придёт», «приходит») вводит нового человека в ситуацию.'
  nl.a1.unit30.lesson04.teach.omar_ask_eruit:
    title: Омар спрашивает, как она выглядит
    gloss: 'Омар: Хорошо! Как она выглядит?'
    note: Снова главный вопрос урока, но теперь с *ze* («она») вместо имени.
  nl.a1.unit30.lesson04.teach.lotte_klein_kort_blond:
    title: Лотте описывает рост и волосы Нины
    gloss: 'Лотте: Она невысокая, и у неё короткие светлые волосы.'
    note: Соединяет слово *klein* и лексику о волосах из предыдущих уроков.
  nl.a1.unit30.lesson04.teach.omar_ask_ogen:
    title: Омар спрашивает о её глазах
    gloss: 'Омар: А какие у неё глаза?'
    note: '*Haar* здесь значит «её» (притяжательное местоимение), а не «волосы» — см. заметку об омонимах.'
  nl.a1.unit30.lesson04.teach.lotte_groene_ogen:
    title: Лотте описывает глаза Нины
    gloss: 'Лотте: У неё зелёные глаза.'
    note: Снова *groene ogen* из предыдущего урока.
  nl.a1.unit30.lesson04.teach.omar_bedankt_herken:
    title: Омар её узнает
    gloss: 'Омар: Спасибо! Тогда я её узнаю.'
    note: '*Herken ik haar wel* — «я её точно узнаю». Здесь *haar* — это снова местоимение «её», а не «волосы».'
  nl.a1.unit30.lesson05.teach.vergelijking:
    title: Сравниваем Сандера и Фенну
    gloss: Сандер и Фенна — брат и сестра, но они непохожи. Сандер невысокий, у него короткие каштановые волосы и карие глаза. Фенна выше Сандера, у неё длинные каштановые волосы и зелёные глаза. А как выглядишь ты?
    note: Короткое сравнение, в котором встречаются все изученные слова о цвете и длине; в конце читателю задан главный вопрос раздела.
    glosses:
      broer: брат
      zus: сестра
      zien: выглядеть
      anders: разный
      klein: невысокий
      kort: невысокий
      bruin: карий
      haar: волосы
      bruine: карий
      ogen: глаза
      langer: выше
      lang: длинный
      groene: зелёный
      eruit: (часть выражения «eruit zien» — «выглядеть»)
  nl.a1.unit30.lesson05.teach.comparatief_note:
    title: Та же модель сравнения
    gloss: 'Эта модель тебе уже знакома по сравнениям: прилагательное + er + dan. Здесь она используется для людей: Fenna is langer dan Sander.'
    note: Та же модель *прилагательное + -er + dan*, что и в теме покупки рюкзака, но теперь для описания людей, а не предметов.
  nl.a1.unit30.lesson05.teach.langer_haar:
    title: У Фенны волосы длиннее, чем у Сандера
    gloss: У Фенны волосы длиннее, чем у Сандера.
    note: '*Langer* остаётся без окончания перед *haar* (het-слово) — то же правило, что и в уроке о согласовании, даже в сравнительной степени.'
  nl.a1.unit30.lesson05.teach.ik_heb_haar:
    title: У меня короткие каштановые волосы
    gloss: У меня короткие каштановые волосы.
    note: 'Образец предложения от первого лица с *Ik heb ...*: его можно использовать, когда описываешь свою внешность.'
  nl.a1.unit30.lesson06.teach.omar_kijk_is_dat_nina:
    title: Омар замечает Нину
    gloss: 'Омар: Смотри, это Нина? У неё короткие светлые волосы и зелёные глаза.'
    note: '*Kijk* («смотри») уже так использовалось в диалоге о покупках.'
  nl.a1.unit30.lesson06.teach.lotte_ja_dat_is_nina:
    title: Лотте подтверждает
    gloss: 'Лотте: Да, это Нина!'
    note: Короткое естественное подтверждение.
  nl.a1.unit30.lesson06.teach.nina_ben_jij_omar:
    title: Нина здоровается с Омаром
    gloss: 'Нина: Привет, ты Омар?'
    note: 'Простой неформальный вопрос при знакомстве: *ben jij ...?*'
  nl.a1.unit30.lesson06.teach.omar_leuk_je_te_zien:
    title: Омар отвечает на приветствие Нины
    gloss: 'Омар: Да! Приятно познакомиться, Нина.'
    note: '*Leuk je te ontmoeten* — стандартная фраза при первой встрече (см. первый урок), а не *leuk je te zien*, которая говорится знакомому человеку.'
  nl.a1.unit30.lesson06.teach.nina_leuk_je_ook:
    title: Нина отвечает на приветствие
    gloss: 'Нина: Я тоже рада познакомиться!'
    note: 'Завершает диалог: Омар успешно узнал Нину по описанию Лотте.'
