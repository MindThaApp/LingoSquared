teaching:
  nl.a1.unit22.lesson01.teach.bellen:
    title: Звонить
    gloss: звонить
    note: Инфинитив глагола, которым обозначают звонок по телефону.
    example_gloss: Мне нужно тебе позвонить.
  nl.a1.unit22.lesson01.teach.ik_bel_je:
    title: Говорим, что позвоним
    gloss: Я тебе позвоню.
    note: '*Bel* — форма *bellen* для ik. Для ближайшего будущего в нидерландском используется настоящее время, а по-русски здесь обычно стоит будущее: «позвоню».'
  nl.a1.unit22.lesson01.teach.met_lotte:
    title: Отвечаем на звонок
    gloss: Алло, это Лотте.
    note: '*Met* + имя (буквально «с + имя») — стандартный способ представиться по телефону в нидерландском; по-русски говорят «это Лотте».'
  nl.a1.unit22.lesson01.teach.met_omar:
    title: Омар отвечает так же
    gloss: Алло, это Омар.
    note: Тот же шаблон *met* + имя, что и в *Hallo, met Lotte*.
  nl.a1.unit22.lesson02.teach.met_wie:
    title: Спрашиваем, кто звонит
    gloss: С кем я разговариваю?
    note: '*Met wie spreek ik?* — стандартная вежливая фраза, когда звонит незнакомый человек.'
  nl.a1.unit22.lesson02.teach.u_spreekt_met:
    title: Представляемся официально
    gloss: Вы говорите с Лотте.
    note: '*U spreekt met* + имя — вежливый вариант неформального *met* + имя.'
  nl.a1.unit22.lesson03.teach.kun_je_herhalen:
    title: Просим повторить
    gloss: Ты можешь повторить?
    note: '*Kun je* ...? («Можешь ...?») + *herhalen* («повторить») + *dat* («это»).'
  nl.a1.unit22.lesson03.teach.spreek_niet_snel:
    title: Просим говорить помедленнее
    gloss: Не говори так быстро, пожалуйста.
    note: '*Niet zo* + прилагательное отрицает степень, а не сам глагол: «не так быстро», а не «не говори».'
  nl.a1.unit22.lesson03.teach.hoor_niet_goed:
    title: Говорим, что плохо слышно
    gloss: Я тебя плохо слышу.
    note: '*Horen* («слышать») с *niet goed* («нехорошо») говорит о проблеме со слышимостью — это не то же самое, что *verstaan* («понимать»).'
  nl.a1.unit22.lesson04.teach.sms:
    title: Сообщение
    gloss: сообщение
    note: 'Существительное общего рода: *de sms*; слово пришло из международной аббревиатуры.'
    example_gloss: Сообщение от Лотте.
  nl.a1.unit22.lesson04.teach.stuur_sms:
    title: Как сказать, что отправишь сообщение
    gloss: Я пришлю тебе сообщение.
    note: '*Sturen* («отправлять») ставит косвенное дополнение (*je*) перед прямым (*een sms*).'
  nl.a1.unit22.lesson04.teach.bel_later_terug:
    title: Как сказать, что перезвонишь
    gloss: Я позвоню тебе позже.
    note: '*Terug* («обратно») стоит в конце как отделяемая частица; *bellen* + *terug* соответствует русскому «перезвонить».'
  nl.a1.unit22.lesson05.teach.sms_gesprek:
    title: Прочитай переписку
    gloss: 'Омар: Привет, Лотте, можешь мне позвонить? Мне нужно кое-что тебе сказать. Лотте: Да, конечно, я перезвоню тебе через пять минут.'
    note: Обрати внимание, о чём просит Омар, зачем и когда Лотте обещает перезвонить.
    glosses:
      Hoi: привет
      kun: мочь
      bellen: звонить
      moet: надо / должен
      iets: что-то
      vertellen: рассказать
      natuurlijk: конечно
      bel: звонить
      vijf: пять
      minuten: минуты
      terug: обратно
  nl.a1.unit22.lesson06.teach.lotte_open_call:
    title: Омар отвечает на звонок
    gloss: 'Омар: Алло, это Омар.'
    note: 'Тот же шаблон *met* + имя из первого урока, теперь в настоящем телефонном разговоре: первым говорит тот, кто берёт трубку, и называет своё имя.'
  nl.a1.unit22.lesson06.teach.omar_answer_glad:
    title: Лотте представляется
    gloss: 'Лотте: Привет, Омар, это Лотте. Омар: Как хорошо, что ты звонишь!'
    note: '*Fijn dat* ... («как хорошо, что ...») выражает радость по поводу события.'
  nl.a1.unit22.lesson06.teach.lotte_ask_shift:
    title: Лотте спрашивает про смену
    gloss: 'Лотте: Как прошла твоя первая смена?'
    note: '*Was* — простое прошедшее время от *zijn*. Это другая конструкция, не перфект (hebben/zijn + причастие, например *Ik heb gewerkt*) из 12-го раздела; см. заметку сразу после следующей реплики.'
  nl.a1.unit22.lesson06.teach.omar_report_good:
    title: Омар рассказывает хорошую новость
    gloss: 'Омар: Всё прошло очень хорошо, лучше, чем я думал.'
    note: '*Ging* — простое прошедшее время от *gaan* («идти», здесь в значении «пройти, сложиться»); *dacht* — простое прошедшее время от *denken* («думать»).'
  nl.a1.unit22.lesson06.teach.simple_past_note:
    title: Was, ging, dacht — формы простого прошедшего времени
    gloss: was → быть, ging → идти, dacht → думать
    note: '*Was*, *ging* и *dacht* — неправильные формы простого прошедшего времени (verleden tijd). Это другая модель, которую мы пока не разбираем подробно, в отличие от перфекта (hebben/zijn + причастие) из 12-го раздела. Пока просто запомни was/ging/dacht как готовые выражения в тех контекстах, где они встречаются в этом уроке; полные правила спряжения придут на следующем уровне.'
  nl.a1.unit22.lesson06.teach.lotte_proud:
    title: Лотте гордится
    gloss: 'Лотте: Как приятно слышать! Я горжусь тобой.'
    note: '*Trots op* («гордый кем-то/чем-то») — устойчивое сочетание; нужен предлог *op*, а не *van*.'
  nl.a1.unit22.lesson06.teach.omar_thanks_means:
    title: Омар тронут
    gloss: 'Омар: Спасибо, это много для меня значит.'
    note: '*Betekent* — форма 3-го лица от *betekenen* («значить»); *voor me* («для меня») показывает, для кого это важно.'
  nl.a1.unit22.lesson06.teach.zijn_possessive:
    title: Его
    gloss: Его первая смена прошла очень хорошо.
    note: '*Zijn* здесь — притяжательное «его», а не глагол «быть»: различить эти два одинаково выглядящих слова помогает контекст.'
