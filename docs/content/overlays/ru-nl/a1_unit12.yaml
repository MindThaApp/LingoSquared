teaching:
  nl.a1.unit12.lesson01.teach.completed_event:
    title: Прошедшее время в повседневном нидерландском
    gloss: В разговоре завершённое событие обычно выражается глаголом hebben или zijn и причастием прошедшего времени.
    note: В нидерландском для рассказа о прошлом обычно используется именно эта форма перфекта, а не отдельная простая форма. *Ik heb koffie gedronken* значит «я пил(а) кофе» или «я выпил(а) кофе»; в русском виды глагола передают разницу, а в нидерландском форма одна.
  nl.a1.unit12.lesson01.teach.drinken_model:
    title: Я пил(а) кофе
    gloss: пить → Я пил(а) кофе.
    note: '*Heb* — вспомогательный глагол, а *gedronken* — причастие прошедшего времени от *drinken*.'
  nl.a1.unit12.lesson01.teach.gaan_model:
    title: Я ходил(а) в супермаркет
    gloss: идти, ехать → Я ходил(а) в супермаркет.
    note: '*Gaan* употребляется с *zijn*: *ik ben gegaan*.'
  nl.a1.unit12.lesson01.teach.word_order:
    title: Причастие стоит в конце
    gloss: 'Причастие прошедшего времени стоит в конце: Ik heb koffie gedronken. Вспомни о том, что op стоит в конце в Ik sta op.'
    note: В уроке 10 ты уже учился(-лась) слушать важный элемент в конце предложения. Здесь в конце стоит причастие прошедшего времени.
  nl.a1.unit12.lesson02.teach.hebben_rule:
    title: Большинство глаголов используют hebben
    gloss: Большинство глаголов используют hebben.
    note: В этом уроке с *drinken*, *eten*, *werken* и *kopen* используй *hebben*.
  nl.a1.unit12.lesson02.teach.drinken:
    title: Drinken с hebben
    gloss: пить → Я пил(а) кофе.
    note: 'Полная схема: *ik + heb + дополнение + gedronken*.'
  nl.a1.unit12.lesson02.teach.eten:
    title: Eten с hebben
    gloss: есть, кушать → Я ел(а) хлеб.
    note: Причастие глагола *eten* — *gegeten*.
  nl.a1.unit12.lesson02.teach.werken:
    title: Werken с hebben
    gloss: работать → Я работал(а).
    note: Причастие глагола *werken* — *gewerkt*.
  nl.a1.unit12.lesson02.teach.kopen:
    title: Kopen с hebben
    gloss: покупать → Я купил(а) яблоки.
    note: Причастие глагола *kopen* — *gekocht*.
  nl.a1.unit12.lesson03.teach.zijn_rule:
    title: Gaan и komen используют zijn
    gloss: С gaan и komen используй zijn.
    note: Эти два частых глагола движения в изучаемой здесь конструкции завершённого события употребляются с *zijn*, а не с *hebben*.
  nl.a1.unit12.lesson03.teach.gaan:
    title: Gaan с zijn
    gloss: идти, ехать → Я ходил(а) в супермаркет.
    note: С *ik* используй *ben*, а *gegaan* ставь в конец.
  nl.a1.unit12.lesson03.teach.komen:
    title: Komen с zijn
    gloss: приходить → Я пришёл (пришла) в языковое кафе.
    note: С *ik* используй *ben*, а *gekomen* ставь в конец.
  nl.a1.unit12.lesson03.teach.auxiliary_contrast:
    title: Сравни вспомогательные глаголы
    gloss: Я работал(а), но потом пошёл (пошла) в супермаркет.
    note: '*Werken* берёт *hebben*, а *gaan* — *zijn*.'
  nl.a1.unit12.lesson04.teach.gisteren_vanmorgen:
    title: Вчера, сегодня утром
    gloss: вчера, сегодня утром
    note: '*Gisteren* обозначает день перед сегодняшним; *vanmorgen* относится к утру сегодняшнего дня.'
    example_gloss:
    - Вчера я работал(а).
    - Сегодня утром в восемь часов я пил(а) кофе.
  nl.a1.unit12.lesson04.teach.yesterday_work:
    title: Вчера я работал(а)
    gloss: Вчера я работал(а).
    note: Если предложение начинается с *gisteren*, то *heb* стоит перед *ik*.
  nl.a1.unit12.lesson04.teach.morning_coffee:
    title: Кофе сегодня утром
    gloss: Сегодня утром в восемь часов я пил(а) кофе.
    note: Здесь снова используется *om acht uur* из системы времени по часам из урока 4.
  nl.a1.unit12.lesson04.teach.time_order:
    title: Слово о времени в начале меняет порядок слов
    gloss: 'После Gisteren или Vanmorgen глагол стоит перед ik: Gisteren heb ik ...'
    note: Это тот же порядок с глаголом перед *ik*, который ты уже видел(а) после *daarna* в уроке 10.
  nl.a1.unit12.lesson05.teach.recent_text:
    title: Рассказ о недавних событиях
    gloss: Сегодня утром я ходил(а) в супермаркет. Я купил(а) яблоки. Потом я пошёл (пошла) в языковое кафе. Там я пил(а) кофе.
    note: Читая, найди указание на время, места и каждое завершённое действие.
    glosses:
      Vanmorgen: сегодня утром
      supermarkt: супермаркет
      gegaan: ходил(а) / пошёл (пошла)
      appels: яблоки
      gekocht: купил(а)
      Daarna: после этого
      taalcafé: языковое кафе
      Daar: там
      koffie: кофе
      gedronken: пил(а) / выпил(а)
  nl.a1.unit12.lesson06.teach.question:
    title: Что ты делал(а) вчера?
    gloss: 'Лотте: Что ты делал вчера, Омар?'
    note: '*Wat heb je ... gedaan?* — обычный неформальный вопрос о том, что человек делал.'
  nl.a1.unit12.lesson06.teach.answer:
    title: Три действия Омара
    gloss: 'Омар: Я работал. Потом пошёл в супермаркет. Купил яблоки.'
    note: В ответе три простых завершённых действия в отдельных предложениях.
  nl.a1.unit12.lesson06.teach.morning_question:
    title: А сегодня утром?
    gloss: 'Лотте: А что ты делал сегодня утром?'
    note: Замени *gisteren* на *vanmorgen*, чтобы спросить о другом недавнем времени.
  nl.a1.unit12.lesson06.teach.morning_answer:
    title: Омар пришёл в языковое кафе
    gloss: 'Омар: Сегодня утром в восемь я пришёл в языковое кафе.'
    note: '*Komen* употребляется с *zijn*: *ben ... gekomen*.'
  nl.a1.unit12.lesson06.teach.lotte_answer:
    title: Лотте пила кофе
    gloss: 'Лотте: Здорово. Я сегодня утром пила кофе.'
    note: '*Drinken* употребляется с *hebben*: *heb ... gedronken*.'
