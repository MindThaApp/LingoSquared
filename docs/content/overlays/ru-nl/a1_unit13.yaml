teaching:
  nl.a1.unit13.lesson01.teach.lekker_vinden:
    title: Lekker vinden для еды и напитков
    gloss: Когда речь о еде и напитках, в нидерландском часто используют lekker vinden.
    note: В русском для вкуса есть «нравится» и «любить», а в нидерландском одного такого выражения нет. Когда речь о вкусе, говорят *Ik vind ... lekker*, буквально «я нахожу это вкусным».
  nl.a1.unit13.lesson01.teach.koffie:
    title: Любить кофе
    gloss: Я люблю кофе.
    note: Еда или напиток стоит между *vind* и *lekker*.
  nl.a1.unit13.lesson01.teach.thee:
    title: Не любить чай
    gloss: Я не люблю чай.
    note: Поставь *niet* перед *lekker*, чтобы сказать, что вкус тебе не нравится.
  nl.a1.unit13.lesson01.teach.question:
    title: Спросить о вкусе
    gloss: Тебе нравится томатный суп?
    note: В неформальном вопросе *vind* стоит перед *je*. Это продолжает неформальный стиль *jij/je*, который мы используем в курсе.
  nl.a1.unit13.lesson02.teach.leuk_vinden:
    title: Leuk vinden для занятий
    gloss: 'Когда речь о занятиях, в нидерландском часто используют leuk vinden: Мне нравится ездить на велосипеде.'
    note: Для занятия, например езды на велосипеде, используй *leuk*, а не *lekker*.
  nl.a1.unit13.lesson02.teach.walking:
    title: Любить гулять
    gloss: Мне нравится гулять.
    note: Занятие *wandelen* стоит между *vind* и *leuk*.
  nl.a1.unit13.lesson02.teach.dislike:
    title: Не любить ходить по магазинам
    gloss: Мне не нравится ходить по магазинам.
    note: '*Niet* стоит перед *leuk*.'
  nl.a1.unit13.lesson02.teach.activity_question:
    title: Спросить о занятиях
    gloss: Что тебе нравится делать?
    note: '*Wat vind je leuk om te doen?* — естественный общий вопрос о том, какие занятия человек предпочитает.'
  nl.a1.unit13.lesson03.teach.strong_like:
    title: Более сильная или общая симпатия
    gloss: Houden van выражает сильную или общую симпатию.
    note: Используй это выражение выборочно. Обычную реакцию на конкретную еду или занятие естественнее выражать через *lekker vinden* или *leuk vinden*.
  nl.a1.unit13.lesson03.teach.music:
    title: Любить музыку
    gloss: Я люблю музыку.
    note: '*Houd* — форма *houden* для *ik*; после неё стоит *van*.'
  nl.a1.unit13.lesson03.teach.films:
    title: Не любить фильмы
    gloss: Я не люблю фильмы.
    note: В отрицательной форме *niet* стоит между *houd* и *van*.
  nl.a1.unit13.lesson03.teach.contrast:
    title: Выбери естественное выражение
    gloss: 'Про обычный вкус говори так: Мне нравится кофе. Про занятие: Мне нравится гулять.'
    note: Не переводи механически каждое русское «любить» через *houden van*.
  nl.a1.unit13.lesson04.teach.choice_question:
    title: Предложить два варианта
    gloss: Хочешь кофе или чай?
    note: '*Wil je ... of ...?* просит собеседника выбрать.'
  nl.a1.unit13.lesson04.teach.want_prefer:
    title: Сказать, что ты предпочитаешь
    gloss: Я бы лучше выпил чаю.
    note: В этой обычной модели выбора *liever* стоит после *wil*.
  nl.a1.unit13.lesson04.teach.have_prefer:
    title: Предпочесть одну вещь
    gloss: Я предпочитаю синий свитер.
    note: '*Ik heb liever ...* тоже естественно, когда выбираешь одну вещь из двух.'
  nl.a1.unit13.lesson04.teach.liever_note:
    title: Liever показывает предпочтительный вариант
    gloss: Liever показывает, что ты выбираешь один вариант, а не другой.
    note: Сравнение можно не называть, если оба варианта понятны из разговора.
  nl.a1.unit13.lesson05.teach.message:
    title: Читаем о нескольких предпочтениях
    gloss: Привет, Лотте! Мне нравится этот фильм, но Омар не любит фильмы. Он хочет пойти в парк. Мне тоже нравится гулять.
    note: Проследи, кому нравится фильм, кто не любит фильмы и какой вариант выбирает Омар.
    glosses:
      Hoi: привет
      vind: считать, находить
      film: фильм
      leuk: приятный, интересный
      maar: но
      houdt: любит
      films: фильмы
      wil: хочет
      liever: лучше, предпочитает
      park: парк
      wandelen: прогулки, гулять
  nl.a1.unit13.lesson06.teach.food_question:
    title: Лотте предлагает два блюда
    gloss: 'Лотте: Что ты хочешь поесть, Омар? Хлеб или томатный суп?'
    note: Второй вопрос называет два варианта выбора.
  nl.a1.unit13.lesson06.teach.omar_choice:
    title: Омар выбирает суп
    gloss: 'Омар: Я бы лучше съел томатный суп. Мне нравится томатный суп. А ты?'
    note: Сначала Омар делает выбор с *liever*, а потом объясняет его вкусом с *lekker*.
  nl.a1.unit13.lesson06.teach.lotte_choice:
    title: Лотте выбирает хлеб
    gloss: 'Лотте: Я предпочитаю хлеб. Томатный суп мне не очень нравится.'
    note: '*Niet zo lekker* смягчает отрицание и звучит естественно в дружеском разговоре.'
  nl.a1.unit13.lesson06.teach.activity:
    title: Выбираем, чем заняться дальше
    gloss: 'Омар: Что ты хочешь делать после еды? Лотте: Мне нравится гулять.'
    note: '*Leuk* описывает занятие *wandelen*.'
  nl.a1.unit13.lesson06.teach.plan:
    title: У них общее предпочтение
    gloss: 'Омар: Мне тоже. Я люблю гулять. Пойдём в парк? Лотте: Хорошая идея.'
    note: Это возвращает нас к неформальным фразам для планов из раздела 11.
