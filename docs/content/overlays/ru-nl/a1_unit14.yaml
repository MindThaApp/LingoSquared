course:
  title: Нидерландский A1
  description: 'Нидерландский для начинающих: учимся составлять и понимать простые сравнения между знакомыми людьми, предметами и вариантами.'
units:
  nl.a1.unit14.comparisons:
    title: Сравнения
lessons:
  nl.a1.unit14.lesson01.grootte_vergelijken:
    title: Больше или меньше?
  nl.a1.unit14.lesson02.prijzen_vergelijken:
    title: Дешевле или дороже?
  nl.a1.unit14.lesson03.net_zo_als:
    title: Такой же красивый, как
  nl.a1.unit14.lesson04.de_beste_keuze:
    title: Лучший выбор
  nl.a1.unit14.lesson05.advertentie_lezen:
    title: Читаем рекламу
  nl.a1.unit14.lesson06.lotte_en_omar_kiezen_tas:
    title: Лотте и Омар выбирают сумку
teaching:
  nl.a1.unit14.lesson01.teach.comparative_rule:
    title: Образование сравнительной степени
    gloss: В сравнениях к прилагательному часто добавляют -er и используют dan.
    note: '*Dan* — нидерландский эквивалент слова «чем». Оно всегда стоит после прилагательного в сравнительной степени.'
  nl.a1.unit14.lesson01.teach.groot_klein:
    title: Большой, маленький
    gloss: большой, маленький
    note: '*Groot* и *klein* — исходные формы прилагательных, до добавления -er.'
    example_gloss:
    - Рюкзак большой.
    - Сумка маленькая.
  nl.a1.unit14.lesson01.teach.rugzak_groter:
    title: Рюкзак больше
    gloss: Рюкзак больше, чем сумка.
    note: '*Groter* — это *groot* + *er*; *dan* вводит второй предмет сравнения.'
  nl.a1.unit14.lesson01.teach.tas_kleiner:
    title: Сумка меньше
    gloss: Сумка меньше, чем рюкзак.
    note: '*Kleiner* — это *klein* + *er*, по той же схеме.'
  nl.a1.unit14.lesson02.teach.rugzak_price:
    title: Цена рюкзака
    gloss: Рюкзак стоит сорок пять евро.
    note: '*Kost* — форма 3-го лица единственного числа от *kosten* («стоить»).'
  nl.a1.unit14.lesson02.teach.tas_price:
    title: Цена сумки
    gloss: Сумка стоит двадцать евро.
    note: 'Цена ниже, чем у рюкзака: это подготовка к следующему сравнению.'
  nl.a1.unit14.lesson02.teach.duur_goedkoop:
    title: Дорогой, дешёвый
    gloss: дорогой, дешёвый
    note: '*Duur* и *goedkoop* — исходные формы прилагательных, до добавления *-der*/*-er*.'
    example_gloss:
    - Рюкзак дорогой.
    - Сумка дешёвая.
  nl.a1.unit14.lesson02.teach.rugzak_duurder:
    title: Рюкзак дороже
    gloss: Рюкзак дороже, чем сумка.
    note: '*Duurder* — это *duur* + *der*. Если слово уже оканчивается на r, в нидерландском добавляется *-der*, а не просто *-er*.'
  nl.a1.unit14.lesson02.teach.tas_goedkoper:
    title: Сумка дешевле
    gloss: Сумка дешевле, чем рюкзак.
    note: '*Goedkoper* — это *goedkoop* + *er*, зеркальное отражение предыдущего предложения.'
  nl.a1.unit14.lesson03.teach.equality_rule:
    title: Сравнение «одинаково»
    gloss: Чтобы сказать, что две вещи одинаковы, используй net zo + прилагательное + als.
    note: Так по-нидерландски выражается значение «такой же ... как»; прилагательное при этом не меняется.
  nl.a1.unit14.lesson03.teach.mooi:
    title: Одинаково красивые
    gloss: Этот рюкзак такой же красивый, как та сумка.
    note: '*Mooi* («красивый») стоит между *net zo* и *als* без изменений: окончания -er в этой конструкции нет.'
  nl.a1.unit14.lesson03.teach.praktisch:
    title: Одинаково практичные
    gloss: Рюкзак такой же практичный, как сумка.
    note: На место прилагательного в конструкции *net zo ... als* можно поставить любое простое прилагательное.
  nl.a1.unit14.lesson04.teach.superlative_rule:
    title: Образование превосходной степени
    gloss: Для превосходной степени часто используют het + прилагательное + st.
    note: Эта предикативная форма (после *is*) употребляется с *het* независимо от рода существительного.
  nl.a1.unit14.lesson04.teach.duurst:
    title: Самый дорогой из двух
    gloss: Из этих двух рюкзак самый дорогой.
    note: '*Duurst* — это *duur* + *st*. В нидерландском превосходную степень можно использовать, даже когда сравниваются всего два варианта.'
  nl.a1.unit14.lesson04.teach.irregular_rule:
    title: 'Неправильные формы: goed, beter, best'
    gloss: 'Goed, beter, best — неправильные формы: это лучший выбор. Veel, meer, meest образуются так же.'
    note: Ни та, ни другая цепочка (*goed/beter/best*, *veel/meer/meest*) не подчиняется обычной схеме -er/-st — подобно русским «хороший — лучше — лучший» и «много — больше».
  nl.a1.unit14.lesson04.teach.beste_keuze:
    title: Лучший выбор для поездки
    gloss: Этот рюкзак — лучший выбор для долгой поездки на поезде.
    note: '*Beste* — атрибутивная форма (перед существительным) с окончанием -e, которое нидерландские прилагательные обычно получают перед существительным.'
  nl.a1.unit14.lesson04.teach.meer_ruimte:
    title: Больше места
    gloss: В рюкзаке больше места, чем в сумке.
    note: '*Meer* — неправильная сравнительная степень от *veel* («много»); она образуется от другого корня, как и русское «больше» от «много».'
  nl.a1.unit14.lesson05.teach.advertentie:
    title: Читаем рекламу магазина
    gloss: 'Рюкзак Bergsport: сорок пять евро. Этот рюкзак большой и прочный. Сумка через плечо Stad: двадцать евро. Эта сумка меньше и легче рюкзака, но менее прочная. Для долгой поездки рюкзак — лучший выбор, потому что он прочнее и в нём больше места.'
    note: Обрати внимание на цены и размеры двух товаров и на то, какой из них рекомендует реклама и почему.
    glosses:
      Rugzak: рюкзак
      vijfenveertig: сорок пять
      euro: евро
      groot: большой
      sterk: прочный
      Schoudertas: сумка через плечо
      twintig: двадцать
      tas: сумка
      kleiner: меньше
      lichter: легче
      minder: менее
      lange: длинный
      reis: поездка, путешествие
      beste: лучший
      keuze: выбор
      sterker: прочнее
      ruimte: место, пространство
  nl.a1.unit14.lesson06.teach.lotte_open:
    title: Лотте обращает внимание на размер
    gloss: 'Лотте: Смотри, этот рюкзак больше, чем та сумка.'
    note: '*Kijk* («смотри») — частый способ привлечь чьё-то внимание к чему-либо.'
  nl.a1.unit14.lesson06.teach.omar_room:
    title: Омар объясняет, зачем ему это нужно
    gloss: 'Омар: Да, и в нём больше места. Мне нужна большая сумка для поездки на поезде.'
    note: '*Nodig hebben* («нуждаться») — устойчивое сочетание; то, что нужно, стоит между *hebben* и *nodig*.'
  nl.a1.unit14.lesson06.teach.lotte_best_choice:
    title: Лотте подтверждает выбор
    gloss: 'Лотте: Тогда рюкзак — лучший выбор для тебя.'
    note: '*Dan* здесь означает «в таком случае», а не сравнительное *dan* («чем») из lesson01: пишутся они одинаково.'
  nl.a1.unit14.lesson06.teach.omar_question:
    title: Омар спрашивает мнение Лотте
    gloss: 'Омар: Именно. Какая сумка, по-твоему, самая красивая?'
    note: '*Vind jij het mooist* повторяет конструкцию выражения мнения из уроков про *vinden* в 13-м разделе.'
  nl.a1.unit14.lesson06.teach.lotte_choice:
    title: Лотте выбирает сумку через плечо
    gloss: 'Лотте: По-моему, эта сумка через плечо самая красивая. И она лёгкая.'
    note: '*Licht* («лёгкий» по весу) — новое полезное прилагательное для описания сумок и багажа.'
  nl.a1.unit14.lesson06.teach.omar_close:
    title: Они принимают решение
    gloss: 'Омар: Хорошо, тогда я куплю рюкзак, а ты — сумку через плечо.'
    note: 'Во второй части повторяющийся глагол *koop* опускается: в разговорной речи это естественно, если всё ясно из контекста.'
  nl.a1.unit14.lesson06.teach.koopt_form:
    title: Koop и koopt
    gloss: Koop — форма для ik от kopen («покупать»); koopt — форма для hij или zij.
    note: 'Правильная схема настоящего времени: *ik koop*, *jij/hij/zij koopt*.'
