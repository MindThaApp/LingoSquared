teaching:
  nl.a1.unit18.lesson01.teach.appartement_woonkamer_slaapkamer:
    title: Квартира, гостиная, спальня
    gloss: квартира, гостиная, спальня
    note: '*Het appartement* — существительное среднего рода (het); *de woonkamer* и *de slaapkamer* — существительные с артиклем de.'
    example_gloss:
    - У меня есть квартира.
    - У меня есть гостиная.
    - У меня есть спальня.
  nl.a1.unit18.lesson01.teach.keuken_badkamer:
    title: Кухня, ванная
    gloss: кухня, ванная
    note: '*De keuken* и *de badkamer* — оба существительные с артиклем de.'
    example_gloss:
    - У меня есть кухня.
    - У меня есть ванная.
  nl.a1.unit18.lesson01.teach.appartement_utrecht:
    title: Говорим, что у нас есть квартира
    gloss: У меня есть квартира.
    note: Глагол *hebben* («иметь») — естественный способ сказать, какое у тебя жильё. В русском для этого обычно используется конструкция «у меня есть». Это общий пример; конкретная квартира Омара (в Утрехте) появится позже в этом уроке.
  nl.a1.unit18.lesson01.teach.rooms_list:
    title: Перечисляем все комнаты
    gloss: У меня есть гостиная, спальня, кухня и ванная.
    note: 'В одном предложении перечислены все четыре комнаты из лексики этого урока: через запятую и с *en* перед последним словом.'
  nl.a1.unit18.lesson02.teach.hoeveel_kamers:
    title: Спрашиваем, сколько комнат
    gloss: Сколько у тебя комнат?
    note: '*Hoeveel* («сколько») — тот же вопрос о количестве, что и в прежних уроках про числа.'
  nl.a1.unit18.lesson02.teach.twee_slaapkamers:
    title: Называем количество комнат
    gloss: У меня две спальни.
    note: '*Slaapkamers* — множественное число от *slaapkamer*, образованное regularно с помощью -s.'
  nl.a1.unit18.lesson02.teach.drie_kamers:
    title: Называем общее число комнат
    gloss: В квартире три комнаты.
    note: '*Kamers* — общее слово «комнаты», не только спальни.'
  nl.a1.unit18.lesson03.teach.balkon_tuin:
    title: Балкон, сад
    gloss: балкон, сад
    note: '*Het balkon* — существительное с артиклем het; *de tuin* — с артиклем de.'
    example_gloss:
    - Есть балкон.
    - Сада нет.
  nl.a1.unit18.lesson03.teach.er_is_balkon:
    title: Говорим, что что-то есть
    gloss: Есть балкон.
    note: '*Er is* — стандартная нидерландская конструкция для «есть, имеется»; порядок слов в ней отличается от русского, где подлежащее часто стоит после глагола.'
  nl.a1.unit18.lesson03.teach.geen_tuin:
    title: Говорим, что чего-то нет
    gloss: Сада нет.
    note: '*Geen* отрицает существительное с неопределённым артиклем: *geen tuin*, а не *niet een tuin*.'
  nl.a1.unit18.lesson04.teach.gezellig:
    title: Уютный
    gloss: уютный
    note: Очень частое, характерно нидерландское прилагательное для тёплой, приятной атмосферы; одним русским словом его не всегда можно точно передать.
    example_gloss: Квартира маленькая, но уютная.
  nl.a1.unit18.lesson04.teach.klein_maar_gezellig:
    title: Типичная модель описания
    gloss: Квартира маленькая, но уютная.
    note: '*Klein maar gezellig* — очень распространённый и естественный способ положительно описать небольшое жильё.'
  nl.a1.unit18.lesson04.teach.woonkamer_groot:
    title: Описываем размер комнаты
    gloss: Гостиная большая.
    note: '*Groot* здесь описывает конкретную комнату, а не весь дом.'
  nl.a1.unit18.lesson04.teach.keuken_klein:
    title: Описываем размер другой комнаты
    gloss: Кухня маленькая.
    note: Та же модель, что и с *groot* в предыдущей карточке, но для другой комнаты и со словом *klein*.
  nl.a1.unit18.lesson05.teach.advertentie:
    title: Читаем объявление о жилье
    gloss: 'Квартира в Утрехте: одна спальня, гостиная, кухня и ванная. Есть балкон, но нет сада. Квартира маленькая, но уютная.'
    note: Обрати внимание на число комнат, на то, что есть и чего нет, и на общее впечатление.
    glosses:
      Appartement: квартира
      slaapkamer: спальня
      woonkamer: гостиная
      keuken: кухня
      badkamer: ванная
      balkon: балкон
      tuin: сад
      klein: маленький
      gezellig: уютный
  nl.a1.unit18.lesson06.teach.lotte_ask:
    title: Лотте спрашивает о квартире
    gloss: 'Лотте: Привет, Омар, как твоя новая квартира в Утрехте?'
    note: '*Nieuwe* — изменённая форма слова *nieuw* («новый»), которая употребляется перед существительным.'
  nl.a1.unit18.lesson06.teach.omar_describe:
    title: Омар описывает квартиру
    gloss: 'Омар: Она маленькая, но уютная. У меня одна спальня, гостиная, кухня и ванная.'
    note: Полностью совпадает с объявлением из пятого урока — это и есть квартира Омара.
  nl.a1.unit18.lesson06.teach.lotte_ask_balcony:
    title: Лотте спрашивает про балкон
    gloss: 'Лотте: У тебя есть балкон?'
    note: Прямой вопрос с ответом «да/нет» по модели *heb je ...?* из прежних уроков.
  nl.a1.unit18.lesson06.teach.omar_balcony_answer:
    title: Омар отвечает
    gloss: 'Омар: Да, у меня есть балкон, но нет сада.'
    note: 'Совпадает с фактом из объявления пятого урока: балкон есть, сада нет.'
  nl.a1.unit18.lesson06.teach.hij_pronoun_note:
    title: Hij вместо имени Омара
    gloss: 'Вместо Omar можно сказать и hij: он имеет балкон — «у него есть балкон».'
    note: '*Hij* («он») может заменить имя Омара, когда он уже упомянут в разговоре.'
  nl.a1.unit18.lesson06.teach.lotte_reaction:
    title: Лотте тепло реагирует
    gloss: 'Лотте: Звучит здорово! Я скоро как-нибудь зайду.'
    note: '*Komen langs* («зайти в гости, заглянуть») — глагол с отделяемой приставкой: *langs* уходит в конец предложения.'
  nl.a1.unit18.lesson06.teach.omar_welcome:
    title: Омар приглашает её
    gloss: 'Омар: Отлично, тебе всегда рады.'
    note: '*Altijd welkom* — тёплый, естественный способ пригласить человека прийти ещё раз.'
