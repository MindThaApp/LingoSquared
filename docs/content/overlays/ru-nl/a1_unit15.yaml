  nl.a1.unit15.travel:
    title: Путешествие на поезде
lessons:
  nl.a1.unit15.lesson01.een_kaartje_kopen:
    title: Покупка билета
  nl.a1.unit15.lesson02.vertrektijd_en_perron:
    title: Во сколько отправляется поезд?
  nl.a1.unit15.lesson03.vertraging:
    title: Задержка
  nl.a1.unit15.lesson04.de_weg_op_het_station:
    title: Как найти дорогу на вокзале
  nl.a1.unit15.lesson05.een_kaartje_lezen:
    title: Читаем железнодорожный билет
  nl.a1.unit15.lesson06.lotte_en_omar_op_reis:
    title: Лотте и Омар путешествуют
teaching:
  nl.a1.unit15.lesson01.teach.kaartje:
    title: Билет
    gloss: билет
    note: '*Het kaartje* — существительное среднего рода: употребляется с *het*, а не с *de*.'
    example_gloss: Я хотел бы билет до Утрехта.
  nl.a1.unit15.lesson01.teach.wil_graag:
    title: Просьба о билете
    gloss: Я хотел бы билет до Утрехта.
    note: '*Wil graag* смягчает просьбу — так же, как при заказе еды в разделе 6.'
  nl.a1.unit15.lesson01.teach.enkele_of_retour:
    title: Кассир уточняет, какой нужен билет
    gloss: Вам билет в один конец или туда и обратно?
    note: '*Wilt u* — вежливая форма «вы» от *willen*; здесь так обращаются к незнакомому сотруднику вокзала.'
  nl.a1.unit15.lesson01.teach.retour_alstublieft:
    title: Вежливый ответ
    gloss: Туда и обратно, пожалуйста.
    note: '*Alstublieft* — вежливое «пожалуйста», оно соответствует официальному обращению *u* в этом диалоге.'
  nl.a1.unit15.lesson01.teach.register_note:
    title: Форма обращения у кассы
    gloss: У стойки обычно используют вежливую форму u.
    note: 'Продолжает различие *jij*/*je* и *u* из урока 1: с незнакомыми людьми в сфере обслуживания по умолчанию используют *u*.'
  nl.a1.unit15.lesson02.teach.perron:
    title: Платформа
    gloss: платформа
    note: '*Het perron* — среднего рода: нужно *het*, а не *de*.'
    example_gloss: С какой платформы отправляется поезд до Утрехта?
  nl.a1.unit15.lesson02.teach.welk_perron:
    title: Вопрос о платформе
    gloss: С какой платформы отправляется поезд до Утрехта?
    note: '*Van welk perron* спрашивает именно о платформе, а не о месте вообще.'
  nl.a1.unit15.lesson02.teach.vertrektijd:
    title: Сообщаем данные об отправлении
    gloss: Поезд отправляется без четверти десять с платформы пять.
    note: '*Kwart voor tien* повторяет модель обозначения времени из урока 4.'
  nl.a1.unit15.lesson02.teach.hoe_laat_aan:
    title: Вопрос о времени прибытия
    gloss: Во сколько прибывает поезд?
    note: '*Komt ... aan* — отделяемый глагол (*aankomen*); *aan* уходит в конец вопроса.'
  nl.a1.unit15.lesson02.teach.aankomsttijd:
    title: Сообщаем время прибытия
    gloss: Поезд прибывает в одиннадцать часов.
    note: 'Снова *komt aan*: две части отделяемого глагола разнесены по предложению.'
  nl.a1.unit15.lesson03.teach.op_tijd_de_vertraging:
    title: Вовремя / задержка
    gloss: вовремя; задержка
    note: '*Op tijd* — устойчивое выражение: что-то происходит по расписанию. *De vertraging* (задержка) — существительное общего рода (de-слово).'
    example_gloss:
    - Поезд отправляется не вовремя.
    - 'Внимание: поезд до Утрехта задерживается.'
  nl.a1.unit15.lesson03.teach.let_op:
    title: Объявление
    gloss: 'Внимание: поезд до Утрехта задерживается.'
    note: '*Let op* (буквально «обрати внимание») открывает объявление на вокзале, как русское «Внимание, уважаемые пассажиры!».'
  nl.a1.unit15.lesson03.teach.niet_op_tijd:
    title: 'Отрицание: не вовремя'
    gloss: Поезд отправляется не вовремя.
    note: '*Niet* стоит прямо перед *op tijd* и отрицает всё выражение целиком.'
  nl.a1.unit15.lesson03.teach.ander_perron:
    title: Смена платформы
    gloss: Поезд отправляется с платформы три вместо платформы пять.
    note: '*In plaats van* значит «вместо».'
  nl.a1.unit15.lesson03.teach.tien_minuten_vertraging:
    title: Сообщаем длительность задержки
    gloss: Поезд задерживается на десять минут.
    note: '*Heeft vertraging* (буквально «имеет задержку») — естественный способ сказать, что поезд опаздывает; есть ещё прилагательное *vertraagd*.'
  nl.a1.unit15.lesson04.teach.ingang_uitgang_wachtruimte:
    title: Вход, выход, зал ожидания
    gloss: вход; выход; зал ожидания
    note: '*De ingang*, *de uitgang* и *de wachtruimte* — все существительные общего рода (de-слова).'
    example_gloss:
    - Где вход?
    - Где выход?
    - Где зал ожидания?
  nl.a1.unit15.lesson04.teach.waar_perron_zeven:
    title: Вопрос о местонахождении платформы
    gloss: Где платформа семь?
    note: Здесь повторяется модель *Waar is...?* из уроков про дорогу в разделе 9.
  nl.a1.unit15.lesson04.teach.rechtdoor_rechts:
    title: Объясняем дорогу
    gloss: Прямо, а потом направо.
    note: '*Rechtdoor* и *rechts* — те же слова о направлении из раздела 9, теперь в контексте вокзала.'
  nl.a1.unit15.lesson04.teach.waar_wachtruimte:
    title: Вопрос о зале ожидания
    gloss: Где зал ожидания?
    note: Та же модель вопроса, но с новым местом.
  nl.a1.unit15.lesson05.teach.kaartje_tekst:
    title: Читаем печатный билет
    gloss: 'Билет: Amsterdam Centraal — Utrecht Centraal. Отправление: десять минут одиннадцатого, платформа семь. Прибытие: без десяти одиннадцать. Туда и обратно. Цена: двенадцать евро сорок.'
    note: Найди время и платформу отправления, время прибытия, тип билета и цену.
    glosses:
      Kaartje: билет
      Vertrek: отправление
      tien: десять
      perron: платформа
      zeven: семь
      Aankomst: прибытие
      elf: одиннадцать
      Retour: билет туда и обратно
      Prijs: цена
      twaalf: двенадцать
      euro: евро
      veertig: сорок
  nl.a1.unit15.lesson06.teach.omar_open:
    title: Омар излагает план
    gloss: 'Омар: Нам нужно на платформу семь. Поезд отправляется в десять минут одиннадцатого.'
    note: '*Moeten* («нужно», «должен») выражает здесь практическую необходимость, а не строгую обязанность.'
  nl.a1.unit15.lesson06.teach.lotte_sign:
    title: Лотте читает табло
    gloss: 'Лотте: Смотри, вон табло: задержка, десять минут.'
    note: '*Daar staat* (буквально «там стоит») — естественный способ сказать, что на табло что-то написано.'
  nl.a1.unit15.lesson06.teach.omar_coffee:
    title: Омар сохраняет спокойствие
    gloss: 'Омар: Не проблема, у нас ещё есть время на кофе.'
    note: '*Geen probleem* — привычное разговорное «ничего страшного».'
  nl.a1.unit15.lesson06.teach.lotte_train_arrives:
    title: Поезд прибывает
    gloss: 'Лотте: Хорошая идея. О, а вот и поезд уже. Платформа семь, точно!'
    note: '*Al* («уже») показывает, что поезд пришёл раньше, чем можно было ждать после объявленной задержки.'
  nl.a1.unit15.lesson06.teach.omar_board:
    title: Они садятся в поезд
    gloss: 'Омар: Пошли, садимся! Утрехт, мы едем!'
    note: '*Stappen in* («садиться», «заходить в вагон») — отделяемый глагол (instappen); *in* уходит в конец предложения. *We komen eraan* (буквально «мы приходим к этому») — обычный нидерландский способ сказать «мы уже идём/едем»; дословно переводить это не нужно.'
