teaching:
  nl.a1.unit23.lesson01.teach.hoeveel_totaal:
    title: Спрашиваем общую стоимость
    gloss: Сколько это стоит всего?
    note: '*In totaal* (всего) уточняет, что тебя интересует общая цена, а не цена одного товара.'
  nl.a1.unit23.lesson01.teach.kost_vijfentwintig:
    title: Называем общую стоимость
    gloss: Это стоит двадцать пять евро всего.
    note: '*Kost* — форма 3-го лица единственного числа от *kosten* (стоить).'
  nl.a1.unit23.lesson02.teach.pinnen_contant:
    title: Оплата картой или наличными
    gloss: платить картой, платить наличными
    note: '*Pinnen* — особый нидерландский глагол для оплаты картой, образованный от PIN-кода, которым оплата подтверждается; *contant betalen* (буквально «наличными платить») — оплата наличными, где *contant* стоит перед *betalen* как наречие.'
    example_gloss:
    - Можно здесь заплатить картой?
    - Я плачу наличными.
  nl.a1.unit23.lesson02.teach.kan_ik_pinnen:
    title: Спрашиваем, можно ли платить картой
    gloss: Можно здесь заплатить картой?
    note: '*Hier* (здесь) привязывает вопрос к месту, где ты находишься.'
  nl.a1.unit23.lesson02.teach.wilt_u_betalen:
    title: Спрашиваем о способе оплаты
    gloss: Вы хотите заплатить наличными или картой?
    note: '*Wilt u* ...? — вежливая форма от *wil je* ...?; здесь её использует незнакомый кассир.'
  nl.a1.unit23.lesson03.teach.rekening:
    title: Счёт
    gloss: счёт
    note: 'Существительное общего рода: *de rekening*.'
    example_gloss: Разделим счёт?
  nl.a1.unit23.lesson03.teach.rekening_delen:
    title: Предлагаем разделить счёт
    gloss: Разделим счёт?
    note: '*Zullen we* ...? повторяет модель предложения плана из уроков 11 и 19.'
  nl.a1.unit23.lesson03.teach.apart_afrekenen:
    title: Просим заплатить раздельно
    gloss: Можно заплатить раздельно?
    note: '*Apart* (отдельно) относится к *afrekenen* (рассчитаться по счёту) — слову, близкому по смыслу к *betalen*, но обозначающему именно окончательный расчёт.'
  nl.a1.unit23.lesson04.teach.wisselgeld:
    title: Сдача
    gloss: сдача
    note: 'Существительное среднего рода: *het wisselgeld*, составное слово из *wisselen* (менять) и *geld* (деньги).'
    example_gloss: Вот ваша сдача.
  nl.a1.unit23.lesson04.teach.hier_wisselgeld:
    title: Отдаём сдачу
    gloss: Вот ваша сдача.
    note: '*Uw* — вежливое «ваш», соответствующее официальному тону у кассы или за стойкой.'
  nl.a1.unit23.lesson04.teach.geen_wisselgeld_nodig:
    title: Отказываемся от сдачи
    gloss: Сдача не нужна.
    note: '*Nodig hebben* (нуждаться) повторяет модель из урока 14: *rugzak nodig hebben*.'
  nl.a1.unit23.lesson05.teach.vijfendertig:
    title: Тридцать пять
    gloss: тридцать пять
    note: 'В составных числах в нидерландском сначала называют единицы, потом десятки: *vijfendertig* (буквально «пять-и-тридцать»).'
    example_gloss: Это стоит тридцать пять евро.
  nl.a1.unit23.lesson05.teach.bonnetje:
    title: Читаем счёт из ресторана
    gloss: 'Счёт: два основных блюда и два кофе. Итого: тридцать пять евро. Оплачено картой.'
    note: Обрати внимание, что заказали, какова итоговая сумма и как заплатили.
    glosses:
      Rekening: счёт
      twee: два
      hoofdgerechten: основные блюда
      koffies: кофе
      Totaal: итого
      vijfendertig: тридцать пять
      euro: евро
      Betaald: оплачено
      pin: карта
  nl.a1.unit23.lesson06.teach.lotte_ask_bill:
    title: Лотте просит счёт
    gloss: 'Лотте: Попросим счёт?'
    note: '*Vragen* (просить) берёт *de rekening* в качестве прямого дополнения.'
  nl.a1.unit23.lesson06.teach.omar_ask_total:
    title: Омар спрашивает общую сумму
    gloss: 'Омар: Да, хорошая идея. Сколько всего это стоит?'
    note: Снова вопрос *hoeveel kost het in totaal?* из первого урока.
  nl.a1.unit23.lesson06.teach.lotte_state_total:
    title: Лотте называет сумму
    gloss: 'Лотте: Это тридцать пять евро. Разделим?'
    note: '*Delen* (делить) здесь по контексту относится к *de rekening*.'
  nl.a1.unit23.lesson06.teach.omar_offer_pay:
    title: Омар настаивает, что заплатит сам
    gloss: 'Омар: Нет, давай сегодня я заплачу. Ты мне так помогла.'
    note: '*Laat mij* ... (позволь мне ...) — стандартный способ предложить что-то сделать; *geholpen* — причастие прошедшего времени от *helpen* (помогать).'
  nl.a1.unit23.lesson06.teach.lotte_thanks:
    title: Лотте тронута
    gloss: 'Лотте: Как мило с твоей стороны! Спасибо.'
    note: '*Lief van je* (мило с твоей стороны) — тёплый и частый комплимент в ответ на щедрый жест.'
  nl.a1.unit23.lesson06.teach.omar_ask_card:
    title: Омар спрашивает про оплату картой
    gloss: 'Омар: Можно здесь оплатить картой?'
    note: Снова вопрос *kan ik hier pinnen?* из второго урока, теперь уже в настоящем ресторане.
  nl.a1.unit23.lesson06.teach.betaalt_form:
    title: 'Betaalt: форма для «он/она»'
    gloss: Омар оплачивает счёт.
    note: '*Betaalt* — форма 3-го лица от *betalen* (платить).'
