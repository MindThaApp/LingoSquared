  nl.a1.unit43.lesson05.teach.tekst:
    title: Разговор о временах года
    gloss: 'Сейчас весна. Тюльпаны красивые. Нина спрашивает: «Какое время года ты считаешь красивым?» Омар говорит: «Мне нравится лето. Летом мы плаваем». Лотте говорит: «Мне нравится зима. Зимой мы катаемся на коньках».'
    note: Пересказывает разговор в taalcafé из урока 4 через прямую речь — так же, как построены сравнительные тексты для чтения в юнитах о доме, районе, почте, готовке, характере и цветах.
    glosses:
      lente: весна
      tulpen: тюльпаны
      mooi: красивые
      vraagt: спрашивает
      seizoen: время года
      vind: считать / находить
      zegt: говорит
      zomer: лето
      leuk: приятный / весёлый
      zwemmen: плаваем
      winter: зима
      schaatsen: катаемся на коньках
  nl.a1.unit43.lesson05.teach.gesprek_leuk:
    title: Разговор интересный
    gloss: Разговор о временах года интересный.
  nl.a1.unit43.lesson06.teach.sander_vraagt_lotte:
    title: Сандер присоединяется к группе
    gloss: 'Сандер: Всем привет! Какое время года ты считаешь красивым, Лотте?'
  nl.a1.unit43.lesson06.teach.lotte_winter:
    title: Лотте отвечает
    gloss: 'Лотте: Мне нравится зима. Зимой мы катаемся на коньках.'
  nl.a1.unit43.lesson06.teach.sander_herfst:
    title: Сандер отвечает
    gloss: 'Сандер: Я считаю осень красивой. Осень спокойная.'
  nl.a1.unit43.lesson06.teach.omar_afsluiting:
    title: Омар завершает разговор
    gloss: 'Омар: Четыре времени года — четыре любимых! Это здорово.'
