  nl.a1.unit43.lesson03.teach.ik_vind_grammar:
    title: Конструкция Ik vind
    gloss: '*Ik vind* + время года + характеристика говорит о том, что ты думаешь о времени года: Мне нравится лето.'
    note: Здесь снова используется уже знакомая конструкция выражения мнения *Ik vind X Y* (Ik vind koffie lekker, Ik vind Fenna nieuwsgierig) — новой грамматики нет, только новое применение. У *vind* нет -t, потому что подлежащее — *Ik* (1-е лицо). В вопросе *Welk seizoen vind jij mooi?* -t тоже нет, потому что *jij* стоит после глагола (инверсия). Форма 3-го лица *vindt* (как в *Omar vindt ...*) — отдельная грамматическая тема, которая будет позже.
