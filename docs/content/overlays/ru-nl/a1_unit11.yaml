course:
  title: Нидерландский A1
  description: 'Нидерландский для начинающих: предлагать, принимать и отклонять приглашения, договариваться о встречах, читать и писать простые планы.'
units:
  nl.a1.unit11.plans:
    title: Простые планы
lessons:
  nl.a1.unit11.lesson01.een_activiteit_voorstellen:
