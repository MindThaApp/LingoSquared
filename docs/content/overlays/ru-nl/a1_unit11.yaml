  nl.a1.unit11.lesson02.ja_of_nee:
    title: Принять или отклонить план
  nl.a1.unit11.lesson03.dag_en_tijd_afspreken:
    title: Договариваемся о дне и времени
  nl.a1.unit11.lesson04.een_bericht_lezen:
    title: Читаем приглашение
  nl.a1.unit11.lesson05.een_plan_schrijven:
    title: Пишем и подтверждаем план
  nl.a1.unit11.lesson06.lotte_en_omar_maken_een_plan:
    title: Лотте и Омар строят планы
teaching:
  nl.a1.unit11.lesson01.teach.samen:
    title: Вместе
    gloss: вместе
    note: '*Samen* показывает, что люди делают что-то вместе.'
    example_gloss: Выпьем кофе вместе?
  nl.a1.unit11.lesson01.teach.koffie_drinken:
    title: Выпить кофе
    gloss: выпить кофе
    note: По-нидерландски буквально говорят *koffie drinken* — «пить кофе».
  nl.a1.unit11.lesson01.teach.naar_de_film:
    title: Сходить в кино
    gloss: сходить в кино
    note: '*Naar de film gaan* — распространённый способ сказать «пойти в кино», не называя отдельного слова для места.'
  nl.a1.unit11.lesson01.teach.zullen_we:
    title: Выпьем кофе?
    gloss: Выпьем кофе?
    note: '*Zullen we ...?* — стандартная нидерландская конструкция для предложения что-то сделать вместе, как русское «Давай...?» или «Может, ...?»'
  nl.a1.unit11.lesson01.teach.zullen_note:
    title: Как использовать Zullen we
    gloss: Zullen we + занятие? — обычный способ предложить сделать что-то вместе.
    note: 'Поставь занятие после *we*, а глагол — в конец: *Zullen we koffie drinken?*'
  nl.a1.unit11.lesson01.teach.zin_om:
    title: Хочешь сходить в кино?
    gloss: Хочешь сходить в кино?
    note: '*Heb je zin om ...?* — неформальный вопрос о том, хочется ли собеседнику чем-то заняться. Здесь перед *gaan* нужно *te*.'
  nl.a1.unit11.lesson02.teach.ja_leuk:
    title: Да, здорово!
    gloss: Да, здорово!
    note: '*Ja, leuk!* — короткое восторженное согласие.'
  nl.a1.unit11.lesson02.teach.goed_idee:
    title: Хорошая идея
    gloss: Хорошая идея!
    note: '*Goed idee!* — согласие через положительную оценку предложения.'
  nl.a1.unit11.lesson02.teach.goed_plan:
    title: Это хороший план
    gloss: Это хороший план.
    note: Это чуть более развёрнутый положительный ответ.
  nl.a1.unit11.lesson02.teach.sorry_reason:
    title: Отказ с причиной
    gloss: Извини, не могу, потому что работаю.
    note: '*Sorry* смягчает отказ, а *want* вводит краткую причину.'
  nl.a1.unit11.lesson02.teach.no_time:
    title: У меня нет времени
    gloss: У меня нет времени.
    note: '*Ik heb geen tijd* — прямая, но обычная причина для отказа.'
  nl.a1.unit11.lesson02.teach.polite_decline:
    title: Вежливый отказ
    gloss: Извини + я не могу + краткая причина — так отказ звучит дружелюбно.
    note: В разговоре причина необязательна, но с ней отказ звучит полезнее и вежливее.
  nl.a1.unit11.lesson03.teach.afspreken:
    title: Договориться о встрече
    gloss: договориться о встрече
    note: После *Zullen we* слово *afspreken* пишется слитно. В предложении *We spreken vrijdag af* оно разделяется на *spreken* и *af*.
    example_gloss: Встретимся в пятницу в 2:30?
  nl.a1.unit11.lesson03.teach.friday_half_three:
    title: Встреча в пятницу в половине третьего
    gloss: Встретимся в пятницу в 2:30?
    note: Здесь соединяются день недели из урока 3 и *om* со временем из урока 4.
  nl.a1.unit11.lesson03.teach.half_three_review:
    title: Half drie — это 2:30
    gloss: half drie = 2:30; om half drie указывает время встречи.
    note: 'В нидерландском счёт идёт к следующему часу: *half drie* — полпути до трёх, то есть 2:30. Это похоже на русское «половина третьего».'
  nl.a1.unit11.lesson03.teach.date_time:
    title: Дата и время
    gloss: в пятницу, 17 апреля, в 3:15
    note: Дни недели и месяцы пишутся со строчной буквы. Для даты используй *op*, а для времени по часам — *om*.
  nl.a1.unit11.lesson03.teach.confirm_time:
    title: Подтверждаем время
    gloss: Да, пятница в 2:30 — мне подходит.
    note: '*Is goed* подтверждает, что предложенное время подходит.'
  nl.a1.unit11.lesson04.teach.bericht_uitnodiging_taalcafe:
    title: Сообщение, приглашение, языковое кафе
    gloss: сообщение, приглашение, языковое кафе
    note: '*Bericht* — короткое письменное или электронное сообщение, *uitnodiging* — приглашение присоединиться к занятию или событию, а *taalcafé* (одно составное слово с акцентом) — место встречи группы.'
    example_gloss:
    - У меня есть сообщение от Лотте.
    - Это приглашение в языковое кафе.
    - Мы пьём кофе в языковом кафе.
  nl.a1.unit11.lesson04.teach.invitation:
    title: Приглашение от Лотте
    gloss: Привет, Омар, хочешь выпить кофе в языковом кафе в субботу, 18 апреля, в 2:30? Лотте.
    note: 'Найди в тексте четыре детали: занятие, дату, время и место.'
    glosses:
      Hoi: привет
      zin: желание (heb je zin = тебе хочется)
      zaterdag: суббота
      april: апрель
      half: половина, считая К следующему часу (half acht = 7:30)
      drie: три
      koffie: кофе
      drinken: пить / выпить
      taalcafé: языковое кафе
      Groet: с уважением
  nl.a1.unit11.lesson05.teach.proposal_message:
    title: Сообщение с предложением
    gloss: Привет, Омар, давай в пятницу в половине третьего выпьем кофе? Всего доброго, Лотте.
    note: В сообщении есть приветствие, предложение, день, время и прощание.
    glosses:
      Hoi: привет
      zullen: (вопрос-предложение) может, давай
      vrijdag: пятница
      half: half — это половина перед следующим часом (half acht = 7:30)
      drie: три
      koffie: кофе
      drinken: пить / выпить
      Groet: с уважением
  nl.a1.unit11.lesson05.teach.confirm_message:
    title: Сообщение с подтверждением
    gloss: Привет, Лотте, да, здорово! В пятницу в половине третьего подходит. До пятницы! Омар.
    note: В ответе Матео принимает предложение и повторяет время встречи, чтобы подтвердить его.
    glosses:
      Hoi: привет
      leuk: здорово / отлично
      Vrijdag: пятница
      half: half — это половина перед следующим часом (half acht = 7:30)
      drie: три
      goed: хорошо / подходит
      Tot: до / до встречи
      vrijdag: пятница
  nl.a1.unit11.lesson05.teach.message_shape:
    title: Что входит в сообщение
    gloss: В коротком сообщении указывают, что делать, в какой день или дату и во сколько.
    note: Приветствие и прощание полезны, но главное — что вы будете делать и когда.
  nl.a1.unit11.lesson06.teach.proposal:
    title: Лотте предлагает выпить кофе
    gloss: 'Лотте: Давай в пятницу выпьем кофе? Омар: Да, здорово! Во сколько?'
    note: Омар сначала соглашается на встречу и только потом спрашивает о времени.
  nl.a1.unit11.lesson06.teach.first_time:
    title: Первое время от Лотте
    gloss: 'Лотте: В половине третьего.'
    note: '*Half drie* означает 2:30, как в уроке 4: «половина» относится к следующему часу, как и в русском «половина третьего».'
  nl.a1.unit11.lesson06.teach.negotiate:
    title: Омар предлагает другое время
    gloss: 'Омар: Извини, в половине третьего я не могу. Можно в четверть четвёртого?'
    note: '*Kan het om ...?* — короткий способ спросить, подходит ли другое время.'
  nl.a1.unit11.lesson06.teach.confirm:
    title: Они подтверждают окончательный план
    gloss: 'Лотте: Да, четверть четвёртого подходит. Омар: Отличный план. Тогда договорились на пятницу, на четверть четвёртого.'
    note: 'Здесь глагол *afspreken* разделяется: *spreken* стоит ближе к началу, а *af* — в конце.'
