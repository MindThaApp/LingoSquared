teaching:
  nl.a1.unit19.lesson01.teach.weer:
    title: Погода
    gloss: погода
    note: 'Существительное среднего рода: *het weer*.'
    example_gloss: Какая погода?
  nl.a1.unit19.lesson01.teach.wat_voor_weer:
    title: Вопрос о погоде
    gloss: Какая погода?
    note: '*Wat voor* + существительное значит «какой, что за»; это очень распространённый общий вопрос.'
  nl.a1.unit19.lesson01.teach.zonnig:
    title: Солнечно
    gloss: Солнечно.
    note: 'Стандартная модель: *Het is* + прилагательное; *het* здесь безличное подлежащее.'
  nl.a1.unit19.lesson01.teach.regent:
    title: Дождь
    gloss: Идёт дождь.
    note: '*Regenen* (идти о дожде) употребляется безлично: *het regent*, отдельное прилагательное не нужно.'
  nl.a1.unit19.lesson01.teach.bewolkt:
    title: Облачно
    gloss: Облачно.
    note: Та же модель *het is* + прилагательное, что и с *zonnig*.
  nl.a1.unit19.lesson02.teach.koud:
    title: Холодно
    gloss: Сегодня холодно.
    note: '*Vandaag* (сегодня) указывает, к какому времени относится описание погоды.'
  nl.a1.unit19.lesson02.teach.warm:
    title: Warm
    gloss: Сегодня тепло.
    note: В повседневных разговорах о погоде *warm* значит и «тепло», и «жарко».
  nl.a1.unit19.lesson02.teach.niet_koud:
    title: Сравнение температур
    gloss: Не холодно, а тепло.
    note: '*Niet* отрицает *koud* и стоит прямо перед прилагательным.'
  nl.a1.unit19.lesson03.teach.weerbericht:
    title: Прогноз погоды
    gloss: прогноз погоды
    note: 'Существительное среднего рода: *het weerbericht*, составное слово из *weer* (погода) и *bericht* (сообщение).'
    example_gloss: Какой прогноз погоды?
  nl.a1.unit19.lesson03.teach.morgen_zonnig:
    title: Погода на завтра
    gloss: Завтра солнечно.
    note: '*Morgen* (завтра) стоит в начале предложения, поэтому после него порядок слов обратный: *is het*.'
  nl.a1.unit19.lesson03.teach.zaterdag_zondag:
    title: Прогноз на два дня
    gloss: В субботу солнечно и тепло, а в воскресенье весь день идёт дождь.
    note: '*De hele dag* (весь день) подчёркивает, что дождь идёт долго.'
  nl.a1.unit19.lesson04.teach.wandeling:
    title: Прогулка
    gloss: прогулка
    note: 'Существительное общего рода: *de wandeling*.'
    example_gloss: Пойдём погуляем?
  nl.a1.unit19.lesson04.teach.zullen_we_wandeling:
    title: Предлагаем прогулку
    gloss: Пойдём погуляем?
    note: '*Zullen we...?* — уже знакомая модель предложения из урока 11; *een wandeling maken* (буквально «сделать прогулку») — устойчивое выражение со значением «пойти погулять».'
  nl.a1.unit19.lesson04.teach.binnen_blijven:
    title: План с условием
    gloss: Если будет дождь, мы останемся дома.
    note: '*Als* (если) вводит условие; в главном предложении *blijven we binnen* подлежащее и глагол меняются местами, потому что придаточное с als стоит первым.'
  nl.a1.unit19.lesson04.teach.goed_idee_laten:
    title: Соглашаемся и предлагаем
    gloss: Хорошая идея! Давай погуляем.
    note: '*Laten we...* (давай...) — ещё один распространённый способ предложить занятие, наряду с *Zullen we...?* из урока 11.'
  nl.a1.unit19.lesson05.teach.weerbericht_tekst:
    title: Читаем прогноз на два дня
    gloss: 'Прогноз погоды: в субботу солнечно и тепло. В воскресенье весь день идёт дождь.'
    note: Следи за тем, какая погода в какой день.
    glosses:
      Weerbericht: прогноз погоды
      zaterdag: суббота
      zonnig: солнечно
      warm: тепло
      Zondag: воскресенье
      regent: идёт дождь
      hele: весь, целый
      dag: день
  nl.a1.unit19.lesson06.teach.lotte_ask_weather:
    title: Lotte спрашивает про выходные
    gloss: 'Lotte: Какая погода будет в эти выходные?'
    note: '*Dit weekend* (в эти выходные) относит вопрос к ближайшему будущему.'
  nl.a1.unit19.lesson06.teach.omar_forecast:
    title: Omar рассказывает прогноз
    gloss: 'Omar: В субботу солнечно и тепло, а в воскресенье весь день идёт дождь.'
    note: Полностью совпадает с прогнозом из текста для чтения.
  nl.a1.unit19.lesson06.teach.lotte_suggest_walk:
    title: Lotte предлагает план
    gloss: 'Lotte: Тогда пойдём погуляем в субботу?'
    note: '*Dan* (тогда) связывает предложение с хорошей погодой, о которой только что сказал Omar.'
  nl.a1.unit19.lesson06.teach.omar_agree:
    title: Omar соглашается и планирует воскресенье
    gloss: 'Omar: Хорошая идея. А в воскресенье спокойно посидим дома.'
    note: '*Lekker* здесь — вводное слово, примерно «приятно, с удовольствием»; его ставят перед прилагательным или глаголом, чтобы сказанное звучало привлекательнее.'
  nl.a1.unit19.lesson06.teach.lotte_closing:
    title: Lotte завершает планирование
    gloss: 'Lotte: Отлично, тогда посмотрим фильм.'
    note: '*Kijken* (смотреть) естественно сочетается с *een film* (фильм).'
