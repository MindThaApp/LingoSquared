teaching:
  nl.a1.unit17.lesson01.teach.wat_doe_je:
    title: Спрашиваем о профессии
    gloss: Кем ты работаешь?
    note: Стандартный неформальный способ спросить о профессии.
  nl.a1.unit17.lesson01.teach.beroep_kok:
    title: Профессия / повар
    gloss: профессия; повар
    note: '*Het beroep* (профессия) — существительное среднего рода (артикль het). *Kok* (повар) — название профессии, которое используется для любого пола: *een kok*, *de kok*.'
    example_gloss:
    - Кем ты работаешь?
    - Я работаю поваром.
  nl.a1.unit17.lesson01.teach.werk_als_kok:
    title: Говорим, что ты повар
    gloss: Я работаю поваром.
    note: '*Werken als* + профессия — стандартная конструкция для названия работы; перед названием профессии артикля нет.'
  nl.a1.unit17.lesson01.teach.verpleegkundige:
    title: Медсестра / медбрат
    gloss: медсестра, медбрат
    note: Современное название этой профессии, одинаково подходящее для любого пола.
    example_gloss: Я работаю медсестрой.
  nl.a1.unit17.lesson01.teach.werk_als_verpleegkundige:
    title: Говорим, что ты медсестра
    gloss: Я работаю медсестрой.
    note: Та же конструкция *werken als*, что и с *kok*.
  nl.a1.unit17.lesson02.teach.waar_werk_je:
    title: Спрашиваем о месте работы
    gloss: Где ты работаешь?
    note: Естественный следующий вопрос после *Wat doe je voor werk?*
  nl.a1.unit17.lesson02.teach.werk_restaurant:
    title: Работаем в ресторане
    gloss: Я работаю в ресторане.
    note: '*Een restaurant* — здесь неопределённый артикль, потому что это один из многих ресторанов.'
  nl.a1.unit17.lesson02.teach.ziekenhuis:
    title: Больница
    gloss: больница
    note: 'Существительное среднего рода: *het ziekenhuis*.'
    example_gloss: Я работаю в больнице.
  nl.a1.unit17.lesson02.teach.werk_ziekenhuis:
    title: Работаем в больнице
    gloss: Я работаю в больнице.
    note: '*Het ziekenhuis* — здесь определённый артикль: это конкретное, известное обеим сторонам учреждение. В русском артиклей нет, поэтому в нидерландском их нужно запоминать.'
  nl.a1.unit17.lesson02.teach.kantoor:
    title: Работаем в офисе
    gloss: Некоторые люди работают в офисе.
    note: '*Op kantoor* («в офисе») — устойчивое выражение без артикля, в отличие от *in een restaurant* и *in het ziekenhuis*.'
  nl.a1.unit17.lesson03.teach.begin_negen:
    title: Время начала
    gloss: Я начинаю в девять часов.
    note: '*Begin* — форма ik от глагола *beginnen* («начинать»); время называется по той же схеме, что в уроке 4.'
  nl.a1.unit17.lesson03.teach.maandag_vrijdag:
    title: Рабочие дни
    gloss: Я работаю с понедельника по пятницу.
    note: '*Van... tot...* — та же конструкция для промежутка между днями недели, что в уроке 3.'
  nl.a1.unit17.lesson03.teach.pauze:
    title: Перерыв
    gloss: перерыв
    note: 'Существительное общего рода: *de pauze*.'
    example_gloss: У меня перерыв в двенадцать часов.
  nl.a1.unit17.lesson03.teach.heb_pauze:
    title: Есть перерыв
    gloss: У меня перерыв в двенадцать часов.
    note: '*Pauze hebben* («иметь перерыв») — естественное устойчивое сочетание.'
  nl.a1.unit17.lesson03.teach.stop_vijf:
    title: Время окончания
    gloss: Я заканчиваю в пять часов.
    note: '*Stop* — форма ik от глагола *stoppen* («останавливаться, заканчивать»).'
  nl.a1.unit17.lesson03.teach.begin_en_stop:
    title: Целый рабочий день
    gloss: Я начинаю в девять часов, а заканчиваю в пять.
    note: '*Begin* и *stop* соединены словом *en* в одно предложение, описывающее весь рабочий день.'
  nl.a1.unit17.lesson04.teach.third_person_rule:
    title: Окончания глаголов в 3-м лице
    gloss: 'С he или she («он» или «она») глагол обычно получает дополнительное -t: он работает, она работает.'
    note: '*Werk* превращается в *werkt* при *hij*/*zij* — это обычная форма 3-го лица настоящего времени в нидерландском.'
  nl.a1.unit17.lesson04.teach.lotte_werkt:
    title: Работа Лотте
    gloss: Лотте работает медсестрой.
    note: Здесь *werkt*, а не *werk*, потому что подлежащее — имя в 3-м лице, а не *ik*.
  nl.a1.unit17.lesson04.teach.omar_werkt:
    title: Работа Омара
    gloss: Омар работает поваром.
    note: То же окончание -t в 3-м лице, что и в *Lotte werkt als verpleegkundige*.
  nl.a1.unit17.lesson04.teach.pronouns_workplaces:
    title: Используем местоимения
    gloss: Она работает в больнице. Он работает в ресторане.
    note: '*Zij*/*hij* заменяют имена Lotte/Omar, а форма глагола с -t остаётся той же.'
  nl.a1.unit17.lesson05.teach.profiel:
    title: Читаем два рабочих профиля
    gloss: Лотте работает медсестрой в больнице. Она начинает в семь часов и работает с понедельника по пятницу. Омар работает поваром в ресторане. Он начинает в одиннадцать часов, а перерыв у него в четыре часа.
    note: Отдельно следи за работой, местом работы и графиком каждого человека.
    glosses:
      werkt: работает
      verpleegkundige: медсестра
      ziekenhuis: больница
      begint: начинается
      zeven: семь
      maandag: понедельник
      vrijdag: пятница
      kok: повар
      restaurant: ресторан
      elf: одиннадцать
      pauze: перерыв
  nl.a1.unit17.lesson06.teach.lotte_curious:
    title: Лотте спрашивает о работе
    gloss: 'Лотте: Привет, Омар! Мне любопытно, а кем ты вообще работаешь?'
    note: '*Eigenlijk* («вообще, на самом деле») смягчает вопрос: он звучит как дружеский интерес, а не допрос.'
  nl.a1.unit17.lesson06.teach.omar_answer:
    title: Омар отвечает
    gloss: 'Омар: Я работаю поваром в ресторане. А ты?'
    note: '*En jij?* — стандартный способ вернуть вопрос собеседнику.'
  nl.a1.unit17.lesson06.teach.lotte_answer:
    title: Лотте отвечает
    gloss: 'Лотте: Я работаю медсестрой в больнице.'
    note: Совпадает с профессией и местом работы, которые уже встречались в предыдущих уроках.
  nl.a1.unit17.lesson06.teach.omar_ask_hours:
    title: Омар спрашивает о графике
    gloss: 'Омар: А какой у тебя график?'
    note: '*Uren maken* (буквально «делать часы») — устойчивое выражение, которым спрашивают о рабочем графике.'
  nl.a1.unit17.lesson06.teach.lotte_hours:
    title: Лотте рассказывает о своём графике
    gloss: 'Лотте: Я начинаю в семь часов и работаю с понедельника по пятницу.'
    note: Совпадает с графиком, который уже был в читаемом профиле.
  nl.a1.unit17.lesson06.teach.omar_reaction:
    title: Реакция Омара
    gloss: 'Омар: Это рано! Я начинаю позже, в одиннадцать часов.'
    note: Совпадает со временем начала работы Омара, которое уже встречалось в профиле.
  nl.a1.unit17.lesson06.teach.lotte_closing:
    title: Лотте завершает тему
    gloss: 'Лотте: У каждой работы свой ритм, мне кажется.'
    note: 'Естественная заключительная фраза: достаточно понимать её смысл, повторять дословно не нужно.'
