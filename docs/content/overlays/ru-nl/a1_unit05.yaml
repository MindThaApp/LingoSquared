teaching:
  nl.a1.unit05.lesson01.teach.vader_moeder:
    title: Отец и мать
    gloss: отец / мать
    note: '*Vader* — стандартное нейтральное слово для «отца». *Moeder* — стандартное нейтральное слово для «матери».'
    example_gloss:
    - Это мой отец.
    - Это моя мать.
  nl.a1.unit05.lesson01.teach.ouders_broer_zus:
    title: Родители, брат и сестра
    gloss: родители / брат / сестра
    note: '*Ouders* в этом значении всегда во множественном числе; *de broer* и *de zus* употребляются с артиклем *de*.'
    example_gloss:
    - Мои родители живут в Утрехте.
    - У меня есть брат.
    - У меня есть сестра.
  nl.a1.unit05.lesson01.teach.kind_kinderen:
    title: Ребёнок и дети
    gloss: ребёнок / дети
    note: '*Kind* — слово с артиклем het: *het kind*. Множественное число *kinderen* употребляется с *de*, хотя единственное число *kind* — с *het*.'
    example_gloss:
    - У моей сестры один ребёнок.
    - У моего дяди и тёти двое детей.
  nl.a1.unit05.lesson01.teach.have_sentence:
    title: У меня есть брат и сестра
    gloss: У меня есть брат и сестра.
    note: '*Ik heb ...* — стандартный способ сказать, какие у тебя есть родственники.'
  nl.a1.unit05.lesson02.teach.opa_oma_oom_tante:
    title: Дедушка, бабушка, дядя и тётя
    gloss: дедушка / бабушка / дядя / тётя
    note: '*Opa* — обиходное слово для дедушки; *grootvader* более формальное, книжное. *Oma* — обиходное слово для бабушки; *grootmoeder* более формальное, книжное. *De oom*. *De tante*.'
    example_gloss:
    - Мои дедушка и бабушка живут в Роттердаме.
    - Моей бабушке девяносто девять лет.
    - Мой дядя живёт в Амстердаме.
    - У моего дяди и тёти двое детей.
  nl.a1.unit05.lesson02.teach.neef_nicht_note:
    title: Neef и nicht имеют два значения
    gloss: neef = двоюродный брат или племянник; nicht = двоюродная сестра или племянница
    note: В нидерландском для «двоюродного брата» и «племянника» используется одно и то же слово, как и для «двоюродной сестры» и «племянницы»; какое значение имеется в виду, понятно из контекста. В упражнениях этого раздела не проверяется — отмечено здесь, чтобы ты узнавал эти слова позже.
    target_text: neef = двоюродный брат ИЛИ племянник; nicht = двоюродная сестра ИЛИ племянница
  nl.a1.unit05.lesson02.teach.gezin:
    title: Семья (домочадцы)
    gloss: семья (домочадцы)
    note: '*Gezin* — это семья, с которой ты живёшь вместе (обычно родители и дети); *familie* — более широкое слово для родни в целом.'
    example_gloss: Моя семья живёт в Утрехте.
  nl.a1.unit05.lesson02.teach.opa_oma_sentence:
    title: Мои дедушка и бабушка живут в Роттердаме
    gloss: Мои дедушка и бабушка живут в Роттердаме.
    note: '*Wonen in* + название города: так говорят, где кто-то живёт.'
  nl.a1.unit05.lesson02.teach.oom_tante_sentence:
    title: У моих дяди и тёти двое детей
    gloss: У моего дяди и тёти двое детей.
    note: Используется *hebben*, потому что *oom en tante* — это два человека.
  nl.a1.unit05.lesson03.teach.mijn_je_jouw:
    title: Мой и твой (безударное и ударное)
    gloss: мой / твой (безударное) / твой (ударное)
    note: '*Mijn* не меняет форму ни перед словами с de, ни перед словами с het, ни в единственном, ни во множественном числе. *Je* — обычная неформальная форма, когда не подчёркивается, чей именно родственник; она тоже не меняется перед любым существительным. *Jouw* сильнее, чем *je*, и нужно, когда противопоставляются родственники разных людей; оно тоже не меняется перед любым существительным.'
    example_gloss:
    - Это мой брат.
    - Это твоя сестра?
    - Та — твоя сестра?
  nl.a1.unit05.lesson03.teach.je_jouw_note:
    title: Je и jouw
    gloss: je и jouw оба означают «твой» (неформально)
    note: Используй *je*, когда нет особого выделения. Используй *jouw*, когда подчёркиваешь, чей именно человек, особенно при противопоставлении. Полная форма *jouw* возможна и без противопоставления, но там чаще говорят *je*.
    target_text: je и jouw оба означают «твой» (неформально). Je употребляется обычно, без выделения; jouw сильнее и нужно при противопоставлении. Обе формы не меняются перед любым существительным.
  nl.a1.unit05.lesson03.teach.dit_is_mijn_broer:
    title: Это мой брат
    gloss: Это мой брат.
    note: '*Dit is ...* — так представляют того, кто стоит рядом.'
  nl.a1.unit05.lesson03.teach.is_dat_jouw_zus:
    title: Это твоя сестра?
    gloss: Это твоя сестра?
    note: '*Dat is ...* — так говорят о том, кто находится дальше или о ком уже шла речь.'
  nl.a1.unit05.lesson04.teach.zijn_haar:
    title: Его и её
    gloss: его / её
    note: '*Zijn* всегда сохраняет одну и ту же форму, как *mijn*, *je* и *jouw*. *Haar* тоже всегда сохраняет одну и ту же форму.'
    example_gloss:
    - Это его отец.
    - Это её мать.
  nl.a1.unit05.lesson04.teach.zijn_haar_note:
    title: Zijn и haar
    gloss: zijn = его, haar = её
    note: 'В этих примерах выбирай *zijn*, если владелец — мужчина, и *haar*, если женщина. Следующее за ним слово о родственнике на выбор не влияет: *zijn vader* и *zijn moeder*; *haar vader* и *haar moeder*.'
    target_text: zijn = его, haar = её; обе формы не меняются, какое бы существительное ни стояло дальше.
  nl.a1.unit05.lesson04.teach.dit_is_zijn_vader:
    title: Это его отец
    gloss: Это его отец.
    note: '*Zijn vader* — его отец.'
  nl.a1.unit05.lesson04.teach.dat_is_haar_moeder:
    title: Это её мать
    gloss: Это её мать.
    note: '*Haar moeder* — её мать.'
  nl.a1.unit05.lesson05.teach.heet:
    title: Зовут
    gloss: зовут
    note: '*Ik heet...* / *Hij heet...* — стандартный способ назвать чьё-то имя; это уже встречалось в Разделе 1.'
    example_gloss: Меня зовут Лотте.
  nl.a1.unit05.lesson05.teach.sander_fenna_jan_marieke:
    title: 'Имена членов семьи: Sander, Fenna, Jan и Marieke'
    gloss: Сандер (нидерландское мужское имя) / Фенна (нидерландское женское имя) / Ян (нидерландское мужское имя) / Марике (нидерландское женское имя)
    note: 'Все четыре — распространённые нидерландские имена: Sander и Jan мужские, Fenna и Marieke женские.'
    example_gloss:
    - Моего брата зовут Сандер.
    - Мою сестру зовут Фенна.
    - Моего отца зовут Ян.
    - Мою мать зовут Марике.
  nl.a1.unit05.lesson05.teach.rotterdam:
    title: Rotterdam
    gloss: Роттердам
    note: Один из крупных городов Нидерландов.
    example_gloss: Дедушка и бабушка Лотте живут в Роттердаме.
  nl.a1.unit05.lesson05.teach.profile:
    title: Семья Лотте
    gloss: Меня зовут Лотте. У меня есть брат и сестра. Моего брата зовут Сандер, а мою сестру зовут Фенна. Моего отца зовут Ян, а мою мать зовут Марике. Мои дедушка и бабушка живут в Роттердаме.
    note: Короткий устный рассказ Лотте о своей семье с лексикой из предыдущих уроков этого раздела.
  nl.a1.unit05.lesson06.teach.egypte:
    title: Египет
    gloss: Египет
    note: Родная страна Омара, как и в предыдущих разделах.
    example_gloss: Мои родители живут в Египте.
  nl.a1.unit05.lesson06.teach.elke_maand:
    title: Каждый месяц
    gloss: каждый месяц
    note: '*Elke* + существительное в единственном числе выражает «каждый ...».'
    example_gloss: Да, каждый месяц.
  nl.a1.unit05.lesson06.teach.lines01_04:
    title: Есть ли у тебя братья или сёстры?
    gloss: 'Лотте: У тебя есть братья или сёстры, Омар? Омар: Да, у меня две сестры. Братьев нет. А у тебя? Лотте: У меня есть брат и сестра.'
    note: '*Broers of zussen* — братья или сёстры, во множественном числе.'
  nl.a1.unit05.lesson06.teach.lines05_08:
    title: Твои родители тоже живут в Нидерландах?
    gloss: 'Омар: Твои родители тоже живут в Нидерландах? Лотте: Да, мои родители живут в Утрехте. А твоя семья? Омар: Мои родители живут в Египте, но мой дядя живёт здесь, в Амстердаме.'
    note: '*Wonen ook in* — «тоже живут в»: так спрашивают, верно ли то же самое для другого человека.'
  nl.a1.unit05.lesson06.teach.lines09_10:
    title: Ты часто его видишь?
    gloss: 'Лотте: Здорово! Ты часто его видишь? Омар: Да, каждый месяц.'
    note: '*Zie je hem vaak?* — естественный и распространённый способ спросить, как часто вы видитесь.'
