    title: Как ты себя чувствуешь?
lessons:
  nl.a1.unit16.lesson01.niet_lekker_voelen:
    title: Я плохо себя чувствую
  nl.a1.unit16.lesson02.wat_scheelt_eraan:
    title: Что случилось?
  nl.a1.unit16.lesson03.koorts_en_verkouden:
    title: Температура и простуда
  nl.a1.unit16.lesson04.bij_de_apotheek:
    title: В аптеке
  nl.a1.unit16.lesson05.advies_lezen:
    title: Читаем записку с советами
  nl.a1.unit16.lesson06.lotte_checkt_omar:
    title: Лотте узнаёт, как дела у Омара
teaching:
  nl.a1.unit16.lesson01.teach.niet_lekker:
    title: Плохое самочувствие
    gloss: Я плохо себя чувствую.
    note: '*Voelen* здесь возвратный глагол (*je*/*me voelen*); *niet lekker* — общий мягкий способ сказать, что что-то не так.'
  nl.a1.unit16.lesson01.teach.ziek:
    title: Больной
    gloss: больной
    note: Основная форма прилагательного; употребляется с *zijn* («быть»).
    example_gloss: Я болен.
  nl.a1.unit16.lesson01.teach.ben_ziek:
    title: Быть больным
    gloss: Я болен.
    note: '*Ziek* описывает более общее и более сильное состояние, чем *niet lekker*.'
  nl.a1.unit16.lesson01.teach.hoofdpijn:
    title: Головная боль
    gloss: головная боль
    note: 'После *hebben* употребляется без артикля: *Ik heb hoofdpijn*, а не *Ik heb een hoofdpijn*.'
    example_gloss: У меня болит голова.
  nl.a1.unit16.lesson01.teach.heb_hoofdpijn:
    title: У меня болит голова
    gloss: У меня болит голова.
    note: 'О симптомах в нидерландском обычно говорят с *hebben* («иметь»): буквально «я имею головную боль», тогда как по-русски мы скажем «у меня болит голова».'
  nl.a1.unit16.lesson01.teach.buikpijn:
    title: Боль в животе
    gloss: боль в животе
    note: Та же модель без артикля, что и с *hoofdpijn*.
    example_gloss: У меня болит живот.
  nl.a1.unit16.lesson01.teach.heb_buikpijn:
    title: У меня болит живот
    gloss: У меня болит живот.
    note: Здесь та же модель с *hebben*, что и с *hoofdpijn*.
  nl.a1.unit16.lesson02.teach.wat_is_er:
    title: Общий вопрос
    gloss: Что случилось?
    note: Универсальный способ спросить, не случилось ли чего.
  nl.a1.unit16.lesson02.teach.wat_scheelt:
    title: Распространённое выражение
    gloss: Что с тобой?
    note: '*Scheelt eraan* — устойчивое выражение (буквально близкое к «чего не хватает в этом»); не переводи его дословно.'
  nl.a1.unit16.lesson02.teach.keelpijn:
    title: Боль в горле
    gloss: боль в горле
    note: Та же модель без артикля, что и с *hoofdpijn* и *buikpijn*.
    example_gloss: У меня болит горло.
  nl.a1.unit16.lesson02.teach.heb_keelpijn:
    title: У меня болит горло
    gloss: У меня болит горло.
    note: Строится по той же модели с *hebben*, что и другие симптомы.
  nl.a1.unit16.lesson02.teach.gaat_het:
    title: Спросить, как дела у человека
    gloss: Ты в порядке? Нет, я плохо себя чувствую.
    note: '*Gaat het?* — очень частый, неформальный вопрос между друзьями: «Как дела?»'
  nl.a1.unit16.lesson03.teach.koorts:
    title: Температура
    gloss: температура
    note: После *hebben* употребляется без артикля, как и другие симптомы.
    example_gloss: У меня температура.
  nl.a1.unit16.lesson03.teach.heb_koorts:
    title: У меня температура
    gloss: У меня температура.
    note: Строится по модели с *hebben*.
  nl.a1.unit16.lesson03.teach.verkouden:
    title: Простуда
    gloss: простуженный / быть простуженным
    note: 'Это прилагательное, которое употребляется с *zijn*, а не существительное с *hebben*. Здесь легко ошибиться: по-русски говорят «у меня насморк», но по-нидерландски — Ik ben verkouden.'
    example_gloss: У меня простуда.
  nl.a1.unit16.lesson03.teach.ben_verkouden:
    title: Сказать, что ты простудился
    gloss: У меня простуда.
    note: По-нидерландски говорят *zijn* + *verkouden* («я простужен»), а не «иметь» + существительное; нельзя сказать *Ik heb een verkouden*.
  nl.a1.unit16.lesson03.teach.zijn_note:
    title: Zijn или hebben — зависит от части речи, а не от длительности
    gloss: 'Ziek и verkouden — прилагательные, они употребляются с zijn: я болен, я простужен. Koorts и hoofdpijn — существительные, они употребляются с hebben.'
    note: 'Выбор между *zijn* и *hebben* зависит от части речи (прилагательное или существительное-симптом), а не от того, насколько состояние временное: *koorts* (существительное) так же временна, как *verkouden* (прилагательное), но всё равно употребляется с *hebben*, а не с *zijn*.'
  nl.a1.unit16.lesson04.teach.apotheek:
    title: Аптека
    gloss: аптека
    note: 'Существительное общего рода: *de apotheek*.'
    example_gloss: Я иду в аптеку.
  nl.a1.unit16.lesson04.teach.waarmee_helpen:
    title: Приветствие фармацевта
    gloss: Чем могу вам помочь?
    note: '*Waarmee kan ik u helpen?* — стандартная вежливая фраза в сфере обслуживания; обращение *u* продолжает тему формального регистра из уроков 1 и 15.'
  nl.a1.unit16.lesson04.teach.iets_tegen:
    title: Попросить средство от симптома
    gloss: У вас есть что-нибудь от головной боли?
    note: '*Iets tegen* + симптом — естественный способ попросить лекарство от чего-либо.'
  nl.a1.unit16.lesson04.teach.tablet:
    title: Таблетка
    gloss: таблетка
    note: 'Существительное среднего рода: *het tablet*, хотя здесь оно употреблено неопределённо: *een tablet*.'
    example_gloss: Я принимаю таблетку.
  nl.a1.unit16.lesson04.teach.neem_tablet:
    title: Указания по приёму
    gloss: Принимай таблетку два раза в день.
    note: '*Neem* — повелительное наклонение от *nemen* (принимать, брать); так даются инструкции.'
  nl.a1.unit16.lesson04.teach.register_note:
    title: Обращение в аптеке
    gloss: В аптеке используется вежливая форма u.
    note: Фармацевт — незнакомый взрослый, работающий в сфере обслуживания; действует то же правило обращения, что и у кассы в уроке 15.
  nl.a1.unit16.lesson05.teach.advies:
    title: Прочитай совет в аптеке
    gloss: 'Совет: принимай по одной таблетке два раза в день, запивая водой. Хорошо отдыхай и пей много воды. Если через три дня всё ещё плохо себя чувствуешь? Тогда иди к врачу.'
    note: Обрати внимание на дозировку, две рекомендации, не связанные с лекарством, и на то, когда нужно идти к врачу.
    glosses:
      Advies: совет
      neem: принимай
      keer: раза
      dag: день
      tablet: таблетка
      Rust: отдыхай
      drink: пей
      Voel: чувствовать себя
      steeds: всё ещё
      lekker: хорошо
      huisarts: врач
  nl.a1.unit16.lesson06.teach.lotte_ask:
    title: Лотте спрашивает, как дела
    gloss: 'Лотте: Привет, Омар, как дела? Ты уже лучше себя чувствуешь?'
    note: '*Al* («уже») показывает, что Лотте спрашивает, стало ли Омару лучше с их прошлого разговора.'
  nl.a1.unit16.lesson06.teach.omar_still_bad:
    title: Омару всё ещё нездоровится
    gloss: 'Омар: Пока не очень. У меня всё ещё болит голова, и я устал.'
    note: '*Nog steeds* («всё ещё») показывает, что головная боль не прошла; *moe* («усталый») — новое полезное прилагательное.'
  nl.a1.unit16.lesson06.teach.lotte_ask_tablet:
    title: Лотте спрашивает про лекарство
    gloss: 'Лотте: Ты принял таблетку?'
    note: '*Genomen* — причастие прошедшего времени от *nemen*; оно образуется по той же модели *heb* + причастие, что и в уроке 12.'
  nl.a1.unit16.lesson06.teach.omar_took_tablet:
    title: Омар подтверждает
    gloss: 'Омар: Да, я принял таблетку. Сейчас пойду отдохну.'
    note: 'В *Ga nu rusten* («сейчас пойду отдохну») используется конструкция ближайшего будущего: *gaan* + инфинитив.'
  nl.a1.unit16.lesson06.teach.lotte_wish:
    title: Лотте желает выздоровления
    gloss: 'Лотте: Хорошая мысль. Хорошенько отдохни. Выздоравливай!'
    note: '*Beterschap!* — устойчивое выражение, которым желают скорого выздоровления.'
  nl.a1.unit16.lesson06.teach.omar_thanks:
    title: Омар прощается
    gloss: 'Омар: Спасибо, до завтра!'
    note: В *Tot morgen!* снова используется модель *tot* + время из прощаний в прошлых уроках.
