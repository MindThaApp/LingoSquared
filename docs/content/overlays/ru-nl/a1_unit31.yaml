  nl.a1.unit31.lesson05.teach.tekst:
    title: Омар, Фенна и Сандер о животных
    gloss: 'Омар и Фенна оба любят животных, но ни у одного из них нет питомца. Омар любит собак, а Фенна любит кошек. А вот у Сандера питомец есть: кошка. Он часто играет со своей кошкой и каждый день её кормит. А у тебя есть питомец?'
    note: Противопоставляет любовь к животным и наличие собственного питомца — в этом коммуникативный смысл всего раздела.
    glosses:
      houden: обожать
      allebei: оба
      dieren: животные
      beiden: оба
      huisdier: питомец
      honden: собаки
      katten: коты
      kat: кот
      speelt: играет
      geeft: даёт
      elke: каждый
      eten: еда
  nl.a1.unit31.lesson05.teach.sander_speelt:
