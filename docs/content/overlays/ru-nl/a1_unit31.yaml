    title: 'Множественное число: hond -> honden'
    gloss: 'Множественное число на -en: hond -> honden, dier -> dieren. После краткого гласного согласная удваивается: kat -> katten.'
    note: Правильное образование множественного числа в нидерландском; здесь оно впервые показано на названиях животных. В русском число выражается окончаниями (собака — собаки), в нидерландском чаще всего добавляется -en.
