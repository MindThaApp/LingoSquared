  nl.a1.unit31.lesson01.teach.heb_je_huisdier:
    title: У тебя есть питомец?
    gloss: У тебя есть питомец?
    note: Тот же вопросительный оборот *Heb je ...?*, который ты уже знаешь из прошлых уроков.
  nl.a1.unit31.lesson01.teach.antwoord_ja:
    title: Да, у меня есть собака
    gloss: Да, у меня есть собака.
    note: Простой утвердительный ответ с новой лексикой этого раздела.
  nl.a1.unit31.lesson01.teach.antwoord_nee_geen:
    title: Нет, у меня нет питомца
    gloss: Нет, у меня нет питомца.
    note: '*Geen* отрицает неопределённое существительное *een huisdier* — см. заметку о грамматике.'
  nl.a1.unit31.lesson01.teach.geen_note:
    title: 'Geen: отрицание неопределённого существительного'
    gloss: 'Geen отрицает неопределённое существительное, как в Ik heb geen tijd (это ты уже знаешь) и здесь: Ik heb geen huisdier.'
    note: 'Та же модель с *geen*, что и в *Ik heb geen tijd*: грамматика не новая, просто появляется новое существительное.'
  nl.a1.unit31.lesson02.teach.uitlaten:
    title: Выгуливать (животное)
    gloss: выгуливать (животное)
    note: Глагол с отделяемой приставкой — см. заметку о грамматике.
    example_gloss: Я выгуливаю собаку каждый день.
  nl.a1.unit31.lesson02.teach.separable_note:
    title: Uitlaten — глагол с отделяемой приставкой
    gloss: 'Uitlaten — глагол с отделяемой приставкой, как opstaan и aankleden из предыдущего урока: ik laat de hond uit.'
    note: Та же модель глагола с отделяемой приставкой (основа ... + приставка в конце), которую ты уже видел(а) в глаголах распорядка дня.
  nl.a1.unit31.lesson02.teach.eten_geven:
    title: Кормить
    gloss: кормить
    example_gloss: Я кормлю кошку каждый день.
  nl.a1.unit31.lesson02.teach.spelen_met:
