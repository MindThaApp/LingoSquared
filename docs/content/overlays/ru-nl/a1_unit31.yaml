  description: 'Нидерландский для начинающих: разговор о домашних и обычных животных — как их назвать, как за ними ухаживать (гулять, кормить, играть), как сказать, каких животных ты любишь, даже если у тебя их нет, и как образуется правильное множественное число в нидерландском.'
