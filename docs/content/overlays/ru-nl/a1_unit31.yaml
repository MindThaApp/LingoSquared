teaching:
  nl.a1.unit31.lesson01.teach.dier_huisdier:
    title: Животное, питомец
    gloss: животное / домашнее животное
    note: '*Dier* — общее слово для животного; *huisdier* (буквально «домашнее животное», «животное при доме») означает именно питомца.'
    example_gloss:
    - Собака — это животное.
    - Собака — ещё и домашний питомец.
  nl.a1.unit31.lesson01.teach.hond_kat:
