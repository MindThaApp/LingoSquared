    title: Я выгуливаю собаку каждый день
    gloss: Я выгуливаю собаку каждый день.
    note: Здесь *uitlaten* сочетается с *elke dag* (каждый день), которое ты уже знаешь из предыдущего раздела.
  nl.a1.unit31.lesson02.teach.eten_phrase:
