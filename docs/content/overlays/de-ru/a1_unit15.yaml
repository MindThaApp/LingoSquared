teaching:
  ru.a1.unit15.lesson01.teach.kofe_luchshe_chem_chay:
    title: Кофе лучше, чем чай.
    gloss: Kaffee ist besser als Tee.
    note: лучше („besser“) und чем („als“) bilden den grundlegenden Komparativ.
  ru.a1.unit15.lesson01.teach.huzhe:
    title: хуже
    gloss: schlechter
    note: хуже („schlechter“) ist das Gegenteil von лучше und wird genauso mit чем verwendet.
    example_gloss: Tee ist schlechter als Kaffee.
  ru.a1.unit15.lesson01.teach.kakoy:
    title: какой / какое
    gloss: welcher / welches / was für ein
    note: какой (maskulin) und какое (neutrum) fragen nach einem von zwei Dingen und richten sich im Geschlecht nach dem Nomen.
    example_gloss: Welcher Kaffee ist besser?
  ru.a1.unit15.lesson02.teach.eto_kafe_bolshe:
    title: Это кафе больше, чем то.
    gloss: Dieses Café ist größer als jenes.
