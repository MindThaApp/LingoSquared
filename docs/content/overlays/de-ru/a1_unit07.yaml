teaching:
  ru.a1.unit07.lesson01.teach.menyu:
    title: меню
    gloss: Speisekarte
    note: меню ist ein unveränderliches Neutrum, das aus dem Französischen stammt – es verändert nie seine Form.
    example_gloss: Hier ist die Speisekarte.
  ru.a1.unit07.lesson01.teach.ofitsiant:
    title: официант, официантка
    gloss: Kellner, Kellnerin
    note: официант ist maskulin und официантка feminin, nach dem regelmäßigen Muster der Endungen.
    example_gloss: Die Kellnerin arbeitet in einem Restaurant.
  ru.a1.unit07.lesson01.teach.stol_svoboden:
    title: Этот столик свободен?
    gloss: Ist dieser Tisch frei?
    note: столик ist eine Verkleinerungsform von стол („Tisch“) und wird üblicherweise für einen Restauranttisch verwendet; свободен („frei“) richtet sich nach dem maskulinen Nomen.
  ru.a1.unit07.lesson01.teach.da_saditites:
    title: Да, садитесь, пожалуйста.
    gloss: Ja, setzen Sie sich bitte.
    note: садитесь ist der Imperativ der Höflichkeitsform bzw. des Plurals von садиться („sich setzen“) und wird mit вы verwendet.
  ru.a1.unit07.lesson01.teach.chto_budete_zakazyvat:
    title: Что будете заказывать?
    gloss: Was möchten Sie bestellen?
    note: будете заказывать ist eine Futurform („werden bestellen“), mit der der Kellner fragt, was der Gast möchte.
  ru.a1.unit07.lesson02.teach.ya_khochu:
    title: Я хочу ...
    gloss: Ich möchte ...
    note: хочу ist die Form der 1. Person Singular von хотеть („wollen, möchten“) und wird beim Bestellen von Essen und Getränken verwendet.
  ru.a1.unit07.lesson02.teach.chay_kofe:
    title: чай, кофе
    gloss: Tee, Kaffee
    note: чай und кофе sind beide häufig bestellte Getränke; кофе ist unveränderlich und grammatisch maskulin, obwohl es auf -е endet.
    example_gloss:
    - Ich möchte Tee.
    - Ich möchte Kaffee.
  ru.a1.unit07.lesson02.teach.khleb_borshch:
    title: хлеб, борщ
    gloss: Brot, Borschtsch (Rote-Bete-Suppe)
    note: борщ ist die klassische russische Rote-Bete-Suppe; beide Nomen sind maskulin.
    example_gloss:
    - Haben Sie Brot?
    - Ich möchte Borschtsch.
  ru.a1.unit07.lesson02.teach.salat:
    title: салат
    gloss: Salat
    note: и („und“) verbindet hier zwei bestellte Speisen, wie in борщ и салат.
    example_gloss: Ich möchte Borschtsch und Salat.
  ru.a1.unit07.lesson03.teach.morozhenoe:
    title: мороженое
    gloss: Eis (Speiseeis)
    note: мороженое ist ein Neutrum, das wie ein Adjektiv aussieht („das Gefrorene“) – ein häufiges Muster bei russischen Speisenamen.
    example_gloss: Bringen Sie zum Nachtisch ein Eis.
  ru.a1.unit07.lesson03.teach.prinesite:
    title: Принесите, пожалуйста, ...
    gloss: Bringen Sie bitte ...
    note: Принесите ist der Imperativ der Höflichkeitsform bzw. des Plurals von принести („bringen“) und wird mit вы verwendet.
  ru.a1.unit07.lesson03.teach.spasibo:
    title: Спасибо.
    gloss: Danke.
    note: Спасибо ist die übliche Art, sich in jeder höflichen Situation zu bedanken.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_budete:
    title: Die Kellnerin fragt nach der Bestellung
    gloss: 'Kellnerin: Was möchten Sie bestellen?'
    note: Die Kellnerin beginnt mit der Frage Что будете заказывать?
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_borshch:
    title: Der Tourist bestellt Essen
    gloss: 'Tourist: Ich möchte Borschtsch und Salat.'
    note: Der турист („Tourist“) antwortet mit Я хочу борщ и салат.
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_pit:
    title: Die Kellnerin fragt nach den Getränken
    gloss: 'Kellnerin: Was möchten Sie trinken?'
    note: пить („trinken“) steht mit будете, ähnlich wie in der vorigen Frage mit заказывать.
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_chay:
    title: Der Tourist bestellt ein Getränk
    gloss: 'Tourist: Ich möchte Tee.'
    note: Der Tourist antwortet einfach mit Я хочу чай.
  ru.a1.unit07.lesson03.teach.ofitsiantka_a_na_sladkoe:
    title: Die Kellnerin fragt nach dem Nachtisch
    gloss: 'Kellnerin: Und zum Nachtisch?'
    note: А на сладкое? ist eine verkürzte Nachfrage – wörtlich „und auf das Süße?“.
  ru.a1.unit07.lesson03.teach.turist_na_sladkoe:
    title: Der Tourist bestellt den Nachtisch
    gloss: 'Tourist: Bringen Sie zum Nachtisch bitte ein Eis.'
    note: Der Tourist antwortet mit На сладкое принесите мороженое, пожалуйста.
  ru.a1.unit07.lesson03.teach.ofitsiantka_khorosho:
    title: Die Kellnerin bestätigt die Bestellung
    gloss: 'Kellnerin: In Ordnung. Danke.'
    note: Хорошо („in Ordnung“) bestätigt die Bestellung, und Спасибо beendet das Gespräch höflich.
