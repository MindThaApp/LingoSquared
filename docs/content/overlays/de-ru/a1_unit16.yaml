teaching:
  ru.a1.unit16.lesson01.teach.u_menya_bolit_golova:
    title: У меня болит голова.
    gloss: Mir tut der Kopf weh.
    note: у меня bedeutet „ich habe“ (wörtlich „bei mir“); болит bedeutet „tut weh“ und richtet sich nach einem Subjekt im Singular wie голова (Kopf).
  ru.a1.unit16.lesson01.teach.zhivot:
    title: живот
    gloss: Bauch
    note: живот bedeutet „Bauch“. Mit jedem Körperteil können Sie dasselbe Muster у меня болит... verwenden.
    example_gloss: Mir tut der Bauch weh.
  ru.a1.unit16.lesson01.teach.gorlo:
    title: горло
    gloss: Hals
    note: горло bedeutet „Hals“ (Rachen, Kehle).
    example_gloss: Mir tut der Hals weh.
  ru.a1.unit16.lesson02.teach.u_menya_temperatura:
    title: У меня температура.
    gloss: Ich habe Fieber.
    note: температура bedeutet wörtlich „Temperatur“, ist aber auf Russisch die übliche Art, „Fieber“ zu sagen.
  ru.a1.unit16.lesson02.teach.prostuda:
    title: простуда
    gloss: eine Erkältung
    note: простуда bedeutet „Erkältung“ (die Krankheit). Mit у меня простуда sagen Sie „Ich bin erkältet.“
    example_gloss: Ich bin erkältet.
  ru.a1.unit16.lesson02.teach.mne_ploho:
    title: Мне плохо.
    gloss: Mir geht es schlecht.
    note: Мне плохо ist eine allgemeine Art zu sagen, dass es einem schlecht geht, ohne ein bestimmtes Symptom zu nennen.
  ru.a1.unit16.lesson03.teach.dima_zdravstvuyte_bolit:
    title: Dima begrüßt die Ärztin
    gloss: 'Dima: Guten Tag! Mein Kopf und mein Hals tun weh.'
    note: Дима beginnt mit dem formellen Здравствуйте!, da die Ärztin eine fremde Person ist.
  ru.a1.unit16.lesson03.teach.doktor_chto_u_vas_bolit:
    title: Die Ärztin fragt, was wehtut
    gloss: 'Ärztin: Was tut Ihnen weh? Der Kopf und der Hals?'
    note: Die Ärztin verwendet das formelle вас („Sie“, auch Plural) statt des informellen тебя („dich“).
  ru.a1.unit16.lesson03.teach.dima_da_i_eshchyo_temperatura:
    title: Dima nennt ein weiteres Symptom
    gloss: 'Dima: Ja, und außerdem Fieber.'
    note: ещё bedeutet „außerdem / noch“ – и ещё... fügt zu dem, was Sie gerade gesagt haben, noch etwas hinzu.
  ru.a1.unit16.lesson03.teach.doktor_vam_nuzhno_otdyhat:
    title: Die Ärztin gibt einen Rat
    gloss: 'Ärztin: Sie müssen sich ausruhen und viel Wasser trinken.'
    note: Вам нужно + Infinitiv bedeutet „Sie müssen...“; вам ist der formelle Dativ von „Sie“.
