    gloss: Igor arbeitet nicht nur, er lernt auch noch. Er besucht einen Spanischkurs an der Volkshochschule. Jede Woche lernt er neue Wörter. Lena absolviert am College eine Ausbildung. Dort studiert sie Gesundheitswesen. Beiden macht das Lernen Spaß. Was lernen Sie, oder was möchten Sie gern lernen?
