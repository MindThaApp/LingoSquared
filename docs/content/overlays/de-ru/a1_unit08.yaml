teaching:
  ru.a1.unit08.lesson01.teach.magazin:
    title: магазин
    gloss: Geschäft
    note: магазин ist ein maskulines Nomen für ein Geschäft oder einen Laden.
    example_gloss: Wir gehen ins Geschäft.
  ru.a1.unit08.lesson01.teach.skolko:
    title: сколько
    gloss: wie viel
    note: сколько fragt nach Menge oder Preis und steht oft zusammen mit стоит.
    example_gloss: Wie viel kostet das Brot?
  ru.a1.unit08.lesson01.teach.stoit:
    title: стоит
    gloss: kostet
    note: стоит ist die 3. Person Singular von стоить („kosten“) und steht bei einem Subjekt im Singular wie хлеб.
    example_gloss: Das Brot kostet hundert Rubel.
  ru.a1.unit08.lesson01.teach.rubl:
    title: рубль
    gloss: Rubel
    note: рубль ist die russische Währung; nach сто („hundert“) steht der Genitiv Plural рублей.
    example_gloss: Das Brot kostet hundert Rubel.
  ru.a1.unit08.lesson01.teach.khleb_moloko:
    title: хлеб, молоко
    gloss: Brot, Milch
    note: хлеб ist maskulin und молоко ist Neutrum – beides alltägliche Lebensmittel.
    example_gloss:
    - Wie viel kostet das Brot?
    - Wie viel kostet die Milch?
  ru.a1.unit08.lesson02.teach.dayte_pozhaluysta:
    title: Дайте, пожалуйста, ...
    gloss: Geben Sie mir bitte ...
    note: Дайте ist der Imperativ in der Höflichkeitsform bzw. im Plural von дать („geben“) und wird mit вы verwendet.
  ru.a1.unit08.lesson02.teach.kilogramm:
    title: килограмм
    gloss: Kilogramm
    note: килограмм ist die übliche Einheit, wenn man Obst, Gemüse oder Brot nach Gewicht kauft.
    example_gloss: Geben Sie mir bitte ein Kilogramm.
  ru.a1.unit08.lesson02.teach.polkilo:
    title: полкило
    gloss: ein halbes Kilo
    note: полкило setzt sich aus пол- („halb“) und кило (umgangssprachliche Kurzform von килограмм) zusammen.
    example_gloss: Geben Sie mir bitte ein halbes Kilo.
  ru.a1.unit08.lesson02.teach.shtuka:
    title: штука
    gloss: Stück
    note: штука zählt einzelne Stücke; bei пять штук steht nach der Zahl пять der Genitiv Plural.
    example_gloss:
    - Geben Sie mir bitte ein Stück.
    - Geben Sie mir bitte fünf Stück.
  ru.a1.unit08.lesson03.teach.pomidory_ogurtsy:
    title: помидоры, огурцы
    gloss: Tomaten, Gurken
    note: Beides sind Nomen im Plural; помидоры und огурцы sind beide maskulin.
    example_gloss:
    - Haben Sie Tomaten?
    - Haben Sie Gurken?
  ru.a1.unit08.lesson03.teach.kartofel_kapusta:
    title: картофель, капуста
    gloss: Kartoffeln, Kohl
    note: картофель ist ein maskulines Sammelnomen (wird wie ein Nomen ohne Plural gebraucht) und капуста ist feminin.
    example_gloss:
    - Haben Sie Kartoffeln?
    - Haben Sie Kohl?
  ru.a1.unit08.lesson03.teach.yabloki_apelsiny:
    title: яблоки, апельсины
    gloss: Äpfel, Orangen
    note: 'Nach кило steht der Genitiv Plural: кило яблок („ein Kilo Äpfel“), genauso wie кило апельсинов.'
    example_gloss:
    - Wie viel kostet ein Kilo Äpfel?
    - Wie viel kostet ein Kilo Orangen?
  ru.a1.unit08.lesson03.teach.u_vas_est:
    title: У вас есть ...?
    gloss: Haben Sie ...? (formell)
    note: Mit der höflichen Form вас – die übliche Art, einen Verkäufer zu fragen, ob er etwas hat.
  ru.a1.unit08.lesson03.teach.da_u_menya_est:
    title: Да, у меня есть ...
    gloss: Ja, ich habe ...
    note: У меня есть („bei mir ist/gibt es“) ist die übliche Art, „ich habe“ zu sagen – hier die Antwort des Verkäufers.
  ru.a1.unit08.lesson03.teach.pokupatel_pomidory:
    title: Der Kunde fragt nach Tomaten
    gloss: 'Kunde: Haben Sie Tomaten?'
    note: Der Kunde beginnt mit der höflichen Frage У вас есть ...?
  ru.a1.unit08.lesson03.teach.prodavets_da_est:
    title: Der Verkäufer sagt ja
    gloss: 'Verkäufer: Ja, haben wir.'
    note: Да, есть ist die kurze Alltagsantwort – wörtlich „ja, es gibt (welche)“ –, ohne die Ware zu wiederholen.
  ru.a1.unit08.lesson03.teach.pokupatel_kilo_yablok:
    title: Der Kunde fragt nach dem Preis
    gloss: 'Kunde: Wie viel kostet ein Kilo Äpfel?'
    note: 'кило яблок: Nach кило steht яблок im Genitiv Plural.'
  ru.a1.unit08.lesson03.teach.prodavets_dvesti:
    title: Der Verkäufer nennt den Preis
    gloss: 'Verkäufer: Zweihundert Rubel.'
    note: Двести bedeutet „zweihundert“; wie bei сто folgt der Genitiv Plural рублей.
  ru.a1.unit08.lesson03.teach.pokupatel_dayte_kilogramm:
    title: Der Kunde kauft ein Kilo
    gloss: 'Kunde: Ein Kilogramm Äpfel, bitte.'
    note: Дайте ..., пожалуйста aus Lektion 2, jetzt mit килограмм яблок („ein Kilogramm Äpfel“).
  ru.a1.unit08.lesson03.teach.prodavets_khorosho:
    title: Der Verkäufer reicht die Ware über
    gloss: 'Verkäufer: In Ordnung, bitte sehr.'
    note: Пожалуйста bedeutet hier „bitte sehr“, wenn der Verkäufer die Ware reicht – nicht „bitte“ als Bitte.
