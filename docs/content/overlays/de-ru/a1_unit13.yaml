teaching:
  ru.a1.unit13.lesson01.teach.vchera_byl:
    title: Вчера я был дома.
    gloss: Gestern war ich zu Hause.
    note: вчера bedeutet „gestern“; был ist die maskuline Vergangenheitsform von „sein“ und wird von einem Mann verwendet.
  ru.a1.unit13.lesson01.teach.byla:
    title: была
    gloss: war (von einer Frau gesagt)
    note: была ist die feminine Vergangenheitsform von „sein“; das Verb richtet sich nach dem Geschlecht des Subjekts.
    example_gloss: Gestern war sie zu Hause.
  ru.a1.unit13.lesson01.teach.vecherom:
    title: вечером
    gloss: abends
    note: вечером bedeutet „abends“ und gibt genauer an, wann etwas in der Vergangenheit geschah.
    example_gloss: Gestern Abend war ich zu Hause.
  ru.a1.unit13.lesson02.teach.hodil_v_kino:
    title: Вчера я ходил в кино.
    gloss: Gestern war ich im Kino.
    note: ходил (maskulin) ist die Vergangenheitsform von „gehen (zu Fuß)“ und beschreibt einen abgeschlossenen Hin- und Rückweg.
  ru.a1.unit13.lesson02.teach.hodila:
    title: ходила
    gloss: war / ging (von einer Frau gesagt)
    note: ходила ist die feminine Vergangenheitsform von „gehen (zu Fuß)“.
    example_gloss: Gestern ist sie ins Kino gegangen.
  ru.a1.unit13.lesson02.teach.smotrel_film:
    title: смотрел фильм
    gloss: hat einen Film gesehen
    note: смотрел (maskulin) / смотрела (feminin) ist die Vergangenheitsform von „schauen“; фильм bedeutet „Film“.
    example_gloss: Ich habe einen Film gesehen.
  ru.a1.unit13.lesson03.teach.nastya_chto_ty_delal:
    title: Nastja fragt, was Dima gemacht hat
    gloss: 'Nastja: Was hast du gestern gemacht?'
    note: Настя beginnt mit Что ты делал вчера?
  ru.a1.unit13.lesson03.teach.dima_hodil_smotrel:
    title: Dima antwortet und fragt zurück
    gloss: 'Dima: Ich war im Kino. Ich habe einen guten Film gesehen. Und du?'
    note: Дима antwortet mit Я ходил в кино. Смотрел хороший фильм. А ты?
  ru.a1.unit13.lesson03.teach.nastya_byla_otdyhala:
    title: Nastja antwortet
    gloss: 'Nastja: Ich war zu Hause. Ich habe mich ausgeruht.'
    note: Настя schließt mit Я была дома. Отдыхала.
