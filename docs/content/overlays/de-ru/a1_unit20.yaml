  ru.a1.unit20.lesson01.teach.segodnya_holodno:
    title: Сегодня холодно.
    gloss: Heute ist es kalt.
    note: 'Das Russische verwendet oft ein unpersönliches Wetterwort: холодно, wörtlich „kalt“ (als Adverb).'
    example_gloss: Heute ist es kalt, Dima.
  ru.a1.unit20.lesson01.teach.teplo:
    title: тепло
    gloss: warm
    note: тепло wird wie холодно für Wetter oder Temperatur verwendet.
    example_gloss: Zu Hause ist es warm.
  ru.a1.unit20.lesson01.teach.pogoda:
    title: погода
    gloss: Wetter
    note: погода bedeutet „Wetter“.
    example_gloss: 'Das Wetter: Heute ist es kalt.'
  ru.a1.unit20.lesson02.teach.idet_dozhd:
    title: Идёт дождь.
    gloss: Es regnet.
    note: 'Im Russischen sagt man дождь идёт, wörtlich „Regen geht“. Anders als im Deutschen steht hier kein „es“ als Platzhalter-Subjekt: Das Subjekt ist дождь selbst.'
    example_gloss: Heute regnet es.
  ru.a1.unit20.lesson02.teach.solntse:
    title: солнце
    gloss: Sonne
    note: Сегодня солнце ist eine einfache Art zu sagen, dass heute die Sonne scheint. Das Russische nennt hier das Wetter ohne Verb.
    example_gloss: Heute scheint die Sonne.
  ru.a1.unit20.lesson02.teach.veter:
    title: ветер
    gloss: Wind
    note: На улице ветер ist eine natürliche Art zu sagen, dass es draußen windig ist.
    example_gloss: Draußen ist es windig.
  ru.a1.unit20.lesson03.teach.nastya_kakaya_pogoda:
    title: Nastja fragt nach dem Wetter
    gloss: 'Nastja: Wie ist das Wetter heute?'
    note: Какая сегодня погода? ist die Standardfrage.
  ru.a1.unit20.lesson03.teach.dima_holodno_dozhd:
    title: Dima beschreibt das Wetter
    gloss: 'Dima: Heute ist es kalt und es regnet.'
    note: Dima verbindet zwei Wetterangaben mit и.
  ru.a1.unit20.lesson03.teach.nastya_ostanemsya_doma:
    title: Nastja macht einen Vorschlag
    gloss: 'Nastja: Dann lass uns zu Hause bleiben.'
