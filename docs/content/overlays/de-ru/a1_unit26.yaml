course:
  title: Russisch A1
  description: 'Russisch für Anfänger: das grundlegende Aussehen einer Person beschreiben – Größe und Alterseindruck, Haar- und Augenfarbe, die Kernfrage Как ты выглядишь? und der Vergleich des Aussehens zweier Personen.'
