  ru.a1.unit26.lesson06.dima_uznayot_ninu:
    title: Dima erkennt Nina
teaching:
  ru.a1.unit26.lesson01.teach.vysokiy_nevysokiy:
    title: Groß und klein
    gloss: groß / klein
    note: '*Высокий* beschreibt eine große Person, *невысокий* eine kleine (wörtlich „nicht hoch“). Die Endung ändert sich mit dem Geschlecht: *высокая*, *невысокая*.'
    example_gloss:
    - Lena ist groß.
    - Igor ist klein.
  ru.a1.unit26.lesson01.teach.staryy_molodoy:
    title: Alt und jung
    gloss: alt / jung
    note: '*Старый* und *молодой* beschreiben hier einen allgemeinen Alterseindruck, nicht eine genaue Zahl von Jahren.'
    example_gloss:
    - Opa ist alt.
    - Dima ist jung.
  ru.a1.unit26.lesson01.teach.prilagatelnoe_menyaetsya_po:
    title: Adjektive ändern sich nach dem Geschlecht
    gloss: 'Ein Adjektiv richtet sich nach der Person: *он высокий, она высокая*; *он старый, она старая*.'
    note: Maskuline Adjektive enden auf *-ый*, *-ий* oder *-ой* (*высокий*, *молодой*); feminine auf *-ая* (*высокая*, *молодая*).
  ru.a1.unit26.lesson01.teach.lena_vysokaya_a:
    title: Lena ist groß und Igor ist klein
    gloss: Lena ist groß, und Igor ist klein.
    note: 'Zwei Aussagen werden mit *а* („während, und“) gegenübergestellt: *Лена высокая, а Игорь невысокий*.'
  ru.a1.unit26.lesson02.teach.volosy:
    title: Haare
    gloss: die Haare
    note: '*Волосы* („Haare“) steht im Russischen im Plural: *У Насти светлые волосы* – nie als Singular.'
    example_gloss: Dima hat kurze schwarze Haare.
  ru.a1.unit26.lesson02.teach.svetlye_kashtanovye_sedye:
    title: Blond, braun und grau
    gloss: blond / braun / grau
    note: 'Drei Haarfarben im Plural, passend zu *волосы*: *светлые*, *каштановые*, *седые*.'
    example_gloss:
    - Nastja hat blonde Haare.
    - Igor hat braune Haare.
    - Opa hat graue Haare.
  ru.a1.unit26.lesson02.teach.dlinnye_korotkie:
    title: Lang und kurz (Haare)
    gloss: lang / kurz (Haare)
    note: '*Длинные* („lang“) und *короткие* („kurz“) stehen ebenfalls im Plural, passend zu *волосы*.'
    example_gloss:
    - Lena hat lange Haare.
    - Igor hat kurze Haare.
  ru.a1.unit26.lesson02.teach.volosy_stoyat_vo:
    title: Adjektive richten sich nach волосы
    gloss: '*Волосы* steht im Plural, deshalb steht auch das Adjektiv im Plural: *длинные волосы*, *короткие волосы*, *светлые волосы*, *чёрные волосы*.'
    note: Plural-Adjektive enden auf *-ые* oder *-ие*. Dieselbe Endung begegnet Ihnen in der nächsten Lektion bei *глаза*.
  ru.a1.unit26.lesson02.teach.posle_u_imya:
    title: У plus Genitiv
    gloss: 'Nach *у* steht der Besitzer im Genitiv: *у Насти* (Nastja hat), *у Димы* (Dima hat), *у неё* (sie hat).'
    note: 'So drückt das Russische „haben“ aus: *у* + Genitiv + das Besitzte. Ein Verb „haben“ gibt es dafür nicht.'
  ru.a1.unit26.lesson02.teach.u_dimy_korotkie:
    title: Dima hat kurze schwarze Haare
    gloss: Dima hat kurze schwarze Haare.
    note: '*Чёрные* („schwarz“) richtet sich nach dem Plural *волосы*. Der Buchstabe *ё* wird in diesem Kurs immer geschrieben.'
  ru.a1.unit26.lesson02.teach.u_nasti_dlinnye:
    title: Nastja hat lange blonde Haare
    gloss: Nastja hat lange blonde Haare.
    note: Verbindet Länge und Farbe aus dieser Lektion in einem natürlichen Satz.
  ru.a1.unit26.lesson03.teach.glaza:
    title: Augen
    gloss: die Augen
    note: '*Глаза* („Augen“) ist der Plural von *глаз*; die Pluralendung ist *-а*.'
    example_gloss: Dima hat braune Augen.
  ru.a1.unit26.lesson03.teach.golubye_karie_zelyonye:
    title: Blau, braun und grün
    gloss: blau / braun / grün
    note: '*Голубые* bedeutet hellblau, *карие* heißt braun (nur für Augen), und *зелёные* heißt grün. Alle drei stehen im Plural.'
    example_gloss:
    - Nastja hat blaue Augen.
    - Igor hat braune Augen.
    - Lena hat grüne Augen.
  ru.a1.unit26.lesson03.teach.glaza_stoyat_vo:
    title: Adjektive richten sich nach глаза
    gloss: '*Глаза* steht im Plural, deshalb steht auch das Adjektiv im Plural: *голубые глаза*, *карие глаза*, *зелёные глаза*.'
    note: 'Braune Augen heißen *карие*, nicht *коричневые*, und braune Haare heißen *каштановые*: Das Russische verwendet für Augen und Haare unterschiedliche Wörter.'
  ru.a1.unit26.lesson03.teach.kak_vyglyadit_nastya:
    title: Wie sieht Nastja aus?
    gloss: Wie sieht Nastja aus?
    note: '*Как выглядит ...?* ist die Kernfrage dieser Lektion. Das Verb *выглядит* richtet sich nach einem Subjekt im Singular.'
  ru.a1.unit26.lesson03.teach.u_nasti_dlinnye:
    title: Nastja hat lange blonde Haare und blaue Augen
    gloss: Nastja hat lange blonde Haare und blaue Augen.
    note: 'In einer Musterantwort werden Haare und Augen mit *и* verbunden: *У Насти длинные светлые волосы и голубые глаза*.'
  ru.a1.unit26.lesson04.teach.nastya_v_yazykovoe:
    title: Nastja stellt Nina vor
    gloss: 'Nastja: Ins Sprachcafé kommt ein neues Mädchen. Sie heißt Nina.'
    note: '*Придёт* (wird kommen) ist das perfektive Futur. *Её зовут Нина* heißt wörtlich „man nennt sie Nina“.'
  ru.a1.unit26.lesson04.teach.dima_khorosho_kak:
    title: Dima fragt, wie sie aussieht
    gloss: 'Dima: Gut! Wie sieht sie aus?'
    note: Wieder die Kernfrage, jetzt mit *она* (sie) statt eines Namens.
  ru.a1.unit26.lesson04.teach.nastya_ona_nevysokaya:
    title: Nastja beschreibt Ninas Größe und Haare
    gloss: 'Nastja: Sie ist nicht groß und hat kurze blonde Haare.'
    note: Verbindet *невысокая* aus Lektion 1 mit den Haarwörtern aus Lektion 2. *И у неё* fügt die zweite Information hinzu.
  ru.a1.unit26.lesson04.teach.dima_a_kakie:
    title: Dima fragt nach ihren Augen
    gloss: 'Dima: Und welche Augen hat sie?'
    note: '*Какие у неё глаза?* verwendet *у неё* („sie hat“). *Неё* ist die Form von *она* nach der Präposition *у*.'
  ru.a1.unit26.lesson04.teach.nastya_u_neyo:
    title: Nastja beschreibt Ninas Augen
    gloss: 'Nastja: Sie hat grüne Augen.'
    note: Greift *зелёные глаза* aus Lektion 3 wieder auf, mit *у неё* für „sie hat“.
  ru.a1.unit26.lesson04.teach.dima_spasibo_togda:
    title: Dima wird sie erkennen
    gloss: 'Dima: Danke! Dann erkenne ich sie.'
    note: '*Я её узнаю* (ich werde sie erkennen): *её* ist der Akkusativ von *она*, weil Nina das Objekt ist.'
  ru.a1.unit26.lesson05.teach.igor_i_lena:
    title: Igor und Lena im Vergleich
    gloss: Igor und Lena sind Bruder und Schwester, sehen aber unterschiedlich aus. Igor ist nicht groß, hat kurze braune Haare und braune Augen. Lena ist größer als Igor und hat lange braune Haare und grüne Augen. Wie sehen Sie aus?
    note: Ein kurzer Vergleich mit allen bisher gelernten Farb- und Längenwörtern; am Ende steht die Kernfrage der Einheit an die Leserin bzw. den Leser.
    glosses:
      брат: Bruder
      сестра: Schwester
      выглядят: ist ... (vom Aussehen her)
      по-разному: verschieden
      невысокий: klein
      короткие: klein
      каштановые: braun
      волосы: Haare
      карие: braun
      глаза: Augen
      выше: größer
      длинные: lang
      зелёные: grün
      выглядишь: du siehst aus / wirkst (wie in как ты выглядишь?)
  ru.a1.unit26.lesson05.teach.posle_vyshe_stoit:
    title: Vergleich mit выше
    gloss: 'Nach *выше* (größer) steht die Person, mit der man vergleicht, im Genitiv: *Лена выше Игоря*.'
    note: Der Komparativ *выше* verändert sich nicht nach dem Geschlecht. Die Person, mit der verglichen wird, steht im Genitiv oder nach *чем*.
  ru.a1.unit26.lesson05.teach.u_leny_volosy:
    title: Lena hat längere Haare als Igor
    gloss: Lena hat längere Haare als Igor.
    note: '*У Лены волосы длиннее, чем у Игоря*: *длиннее* verändert sich nie, und *чем* (als) leitet den zweiten Teil ein.'
  ru.a1.unit26.lesson05.teach.u_menya_korotkie:
    title: Ich habe kurze braune Haare
    gloss: Ich habe kurze braune Haare.
    note: 'Ein Mustersatz für Ihr eigenes Aussehen: *У меня* („ich habe“) + Adjektiv + Substantiv.'
  ru.a1.unit26.lesson06.teach.dima_smotri_eto:
    title: Dima entdeckt Nina
    gloss: 'Dima: Schau, ist das Nina? Sie hat kurze blonde Haare und grüne Augen.'
    note: '*Смотри* (schau) ist der informelle Imperativ, wie schon in früheren Dialogen.'
  ru.a1.unit26.lesson06.teach.nastya_da_eto:
    title: Nastja bestätigt
    gloss: 'Nastja: Ja, das ist Nina!'
    note: Eine kurze, natürliche Bestätigung.
  ru.a1.unit26.lesson06.teach.nina_privet_ty:
    title: Nina begrüßt Dima
    gloss: 'Nina: Hallo, bist du Dima?'
    note: 'Eine einfache informelle Frage: Im Russischen braucht man kein Verb „sein“, einfach *Ты Дима?*'
  ru.a1.unit26.lesson06.teach.dima_da_priyatno:
    title: Dima begrüßt Nina zurück
    gloss: 'Dima: Ja! Freut mich, dich kennenzulernen, Nina.'
    note: '*Приятно познакомиться* ist die übliche Wendung beim ersten Kennenlernen. *Познакомиться* bedeutet, eine neue Person kennenzulernen.'
  ru.a1.unit26.lesson06.teach.nina_mne_tozhe:
    title: Nina erwidert die Begrüßung
    gloss: 'Nina: Freut mich auch, dich kennenzulernen!'
    note: 'Der Dialog endet: Dima hat Nina anhand von Nastjas Beschreibung erfolgreich erkannt.'
