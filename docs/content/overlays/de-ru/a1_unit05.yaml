teaching:
  ru.a1.unit05.lesson01.teach.kotoryy_chas:
    title: Который час?
    gloss: Wie spät ist es?
    note: Die übliche Frage nach der Uhrzeit, wörtlich „welche Stunde“.
  ru.a1.unit05.lesson01.teach.seychas_chas:
    title: Сейчас час.
    gloss: Es ist jetzt ein Uhr.
    note: „Час“ allein bedeutet „ein Uhr“ – im Russischen sagt man hier nicht „один час“, anders als bei den Zahlen ab 2.
    example_gloss: Wie spät ist es? – Es ist ein Uhr.
  ru.a1.unit05.lesson01.teach.dva_tri_chasa:
    title: два часа, три часа
    gloss: zwei Uhr, drei Uhr
    note: 'Nach два und три steht час im Genitiv Singular: часа – wie beim Muster Zahl + Nomen aus Lektion 3.'
    example_gloss:
    - Es ist jetzt zwei Uhr.
    - Es ist jetzt drei Uhr.
  ru.a1.unit05.lesson01.teach.pyat_desyat_chasov:
    title: пять часов, десять часов
    gloss: fünf Uhr, zehn Uhr
    note: 'Ab пять steht час im Genitiv Plural: часов – wieder wie das Muster „ab 5“ aus Lektion 3.'
    example_gloss:
    - Es ist jetzt fünf Uhr.
    - Es ist jetzt zehn Uhr.
  ru.a1.unit05.lesson02.teach.v_kotorom_chasu:
    title: В котором часу?
    gloss: Um wie viel Uhr?
    note: Man fragt damit, wann etwas stattfindet – im Unterschied zu Который час?, das nur nach der aktuellen Uhrzeit fragt.
  ru.a1.unit05.lesson02.teach.utrom_dnem:
    title: утром, днём
    gloss: morgens, tagsüber
    note: Das sind Adverbien (Instrumental) von утро und день; sie stehen ohne Präposition.
    example_gloss:
    - Morgens trinke ich Kaffee.
    - Tagsüber arbeite ich.
  ru.a1.unit05.lesson02.teach.vecherom_nochyu:
    title: вечером, ночью
    gloss: abends, nachts
    note: Dasselbe Instrumental-Adverbmuster wie bei утром/днём.
    example_gloss:
    - Abends bin ich zu Hause.
    - Nachts schlafe ich.
  ru.a1.unit05.lesson02.teach.v_dva_chasa_dnya:
    title: В два часа дня.
    gloss: Um zwei Uhr nachmittags.
    note: дня (Genitiv von день) nach der Uhrzeit zeigt, dass es zwei Uhr nachmittags ist, nicht zwei Uhr nachts.
    example_gloss: Um wie viel Uhr ist das Treffen? – Um zwei Uhr nachmittags.
  ru.a1.unit05.lesson02.teach.v_sem_chasov_vechera:
    title: В семь часов вечера.
    gloss: Um sieben Uhr abends.
    note: вечера (Genitiv von вечер) zeigt, dass es sieben Uhr abends ist.
    example_gloss: Das Geschäft schließt um sieben Uhr abends.
  ru.a1.unit05.lesson03.teach.skazhite_pozhaluysta:
    title: Скажите, пожалуйста, который час?
    gloss: Entschuldigung, können Sie mir sagen, wie spät es ist?
    note: Скажите, пожалуйста macht die Frage höflicher und passt, wenn man einen Fremden anspricht.
  ru.a1.unit05.lesson03.teach.kogda_otkhodit:
    title: Когда отходит поезд?
    gloss: Wann fährt der Zug ab?
    note: Отходит („fährt ab“) ist das übliche Verb für die Abfahrt eines Zuges oder Busses.
  ru.a1.unit05.lesson03.teach.passazhir_vopros:
    title: Der Fahrgast fragt nach der Uhrzeit
    gloss: 'Fahrgast: Entschuldigung, können Sie mir sagen, wie spät es ist?'
    note: Der Fahrgast beginnt höflich mit Скажите, пожалуйста – passend, um Bahnhofspersonal anzusprechen.
  ru.a1.unit05.lesson03.teach.kassir_sem:
    title: Der Kassierer antwortet
    gloss: 'Kassierer: Es ist sieben Uhr morgens.'
    note: Сейчас семь часов утра nennt die aktuelle Uhrzeit; утра („morgens“) macht sie eindeutig.
  ru.a1.unit05.lesson03.teach.passazhir_kogda:
    title: Der Fahrgast fragt nach dem Zug
    gloss: 'Fahrgast: Und wann fährt der Zug ab?'
    note: А leitet die Anschlussfrage des Fahrgasts sanft ein.
  ru.a1.unit05.lesson03.teach.kassir_vosem:
    title: Der Kassierer nennt die Abfahrtszeit
    gloss: 'Kassierer: Um acht Uhr morgens.'
    note: В восемь часов утра antwortet mit der Präposition в, der Stunde und dem Wort für die Tageszeit.
