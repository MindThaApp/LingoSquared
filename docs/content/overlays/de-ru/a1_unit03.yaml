teaching:
  ru.a1.unit03.lesson01.teach.u_menya:
    title: У меня ...
    gloss: Ich habe ...
    note: Wörtlich „bei mir (ist) ..." – so sagt man im Russischen üblicherweise „ich habe"; es gibt dafür kein Verb wie „haben".
  ru.a1.unit03.lesson01.teach.odin_dva:
    title: один, два
    gloss: eins, zwei
    note: 'Nach два („zwei") steht das Nomen in einer besonderen Form, dem Genitiv Singular: брат („Bruder") wird zu брата, nicht zu einer Pluralform.'
    example_gloss:
    - Ich habe einen Bruder.
    - Ich habe zwei Brüder.
  ru.a1.unit03.lesson01.teach.tri_chetyre:
    title: три, четыре
    gloss: drei, vier
    note: 'Три und четыре verlangen wie два den Genitiv Singular: книга („Buch") wird nach два, три und четыре zu книги.'
    example_gloss:
    - Ich habe drei Bücher.
    - Ich habe vier Bücher.
  ru.a1.unit03.lesson01.teach.pyat:
    title: пять
    gloss: fünf
    note: 'Ab пять („fünf") steht das Nomen stattdessen im Genitiv Plural: рубль („Rubel") wird zu рублей, nicht zu рубли.'
    example_gloss: Ich habe fünf Rubel.
  ru.a1.unit03.lesson01.teach.brat_bratya:
    title: брат, брата
    gloss: Bruder; Brüder (nach 2–4)
    note: брата ist die Genitiv-Singular-Form, die speziell nach два, три und четыре steht – nicht der normale Plural.
    example_gloss: Ich habe zwei Brüder.
  ru.a1.unit03.lesson01.teach.kniga_knigi:
    title: книга, книги
    gloss: Buch; Bücher (nach 2–4)
    note: книги folgt demselben Muster (Genitiv Singular) wie брата und steht nach два, три und четыре.
    example_gloss: Ich habe drei Bücher.
  ru.a1.unit03.lesson01.teach.rubl_rubley:
    title: рубль, рублей
    gloss: Rubel; Rubel (ab 5)
    note: рублей ist die Genitiv-Plural-Form, die ab пять („fünf") steht.
    example_gloss: Ich habe fünf Rubel.
  ru.a1.unit03.lesson02.teach.shest_sem:
    title: шесть, семь
    gloss: sechs, sieben
    note: Wie пять verlangen auch шесть und семь das Nomen im Genitiv Plural.
    example_gloss:
    - Es ist sechs Uhr.
    - Ich habe sieben Rubel.
  ru.a1.unit03.lesson02.teach.vosem_devyat:
    title: восемь, девять
    gloss: acht, neun
    note: 'Beide setzen das Muster des Genitivs Plural fort: книга wird zu книг, und рубль wird zu рублей.'
    example_gloss:
    - Ich habe acht Bücher.
    - Ich habe neun Rubel.
  ru.a1.unit03.lesson02.teach.desyat:
    title: десять
    gloss: zehn
    note: Wird auch beim Alter verwendet, wie in Мне десять лет („Ich bin zehn Jahre alt").
    example_gloss: Ich bin zehn Jahre alt.
  ru.a1.unit03.lesson02.teach.kniga_genitive_plural:
    title: книг
    gloss: Bücher (Genitiv Plural, ab 5)
    note: Die Genitiv-Plural-Form von книга, die ab пять steht – sie verliert die Endung ganz, anders als книги nach два, три und четыре.
    example_gloss: Ich habe neun Bücher.
  ru.a1.unit03.lesson02.teach.mne_let:
    title: Мне десять лет.
    gloss: Ich bin zehn Jahre alt.
    note: Das Alter wird im Russischen mit dem Dativ „mir" (мне), einer Zahl und лет (Genitiv Plural von „Jahre") ausgedrückt, nicht mit einem Verb wie „sein".
  ru.a1.unit03.lesson02.teach.skolko_vam_let:
    title: Сколько вам лет?
    gloss: Wie alt sind Sie? (formell)
    note: Hier steht der förmliche Dativ вам, passend zur Anrede вы aus Lektion 2.
  ru.a1.unit03.lesson03.teach.skolko_stoit:
    title: Сколько это стоит?
    gloss: Wie viel kostet das?
    note: So fragt man üblicherweise nach dem Preis eines einzelnen Artikels, mit стоит („es kostet", Singular).
  ru.a1.unit03.lesson03.teach.skolko_stoyat:
    title: Сколько стоят яблоки?
    gloss: Wie viel kosten die Äpfel?
    note: Hier steht стоят (die Pluralform von „kosten"), weil яблоки („Äpfel") im Plural steht – anders als das Singular стоит in Сколько это стоит?
  ru.a1.unit03.lesson03.teach.rubley:
    title: рубль, рубля, рублей
    gloss: Rubel (1); Rubel (2–4); Rubel (5+)
    note: 'Das Wort für „Rubel" ändert sich je nach vorangehender Zahl: рубль nach eins, рубля nach два, три und четыре und рублей ab пять.'
    example_gloss:
    - Das kostet einen Rubel.
    - Das kostet zwei Rubel.
    - Das kostet fünf Rubel.
  ru.a1.unit03.lesson03.teach.pokupatel_greeting:
    title: Der Kunde begrüßt den Verkäufer
    gloss: 'Kunde: Guten Tag! Wie viel kosten die Äpfel?'
    note: Ein Kunde an einem Marktstand beginnt höflich mit „Здравствуйте“, bevor er nach dem Preis fragt.
  ru.a1.unit03.lesson03.teach.prodavets_apples:
    title: Der Verkäufer antwortet
    gloss: 'Verkäufer: Drei Rubel.'
    note: Три рубля hat die Genitiv-Singular-Form von „Rubel“, wie sie nach три steht (2–4).
  ru.a1.unit03.lesson03.teach.pokupatel_bread:
    title: Der Kunde fragt nach dem Brot
    gloss: 'Kunde: Und wie viel kostet das Brot?'
    note: Der Kunde leitet mit А („und“) locker eine Anschlussfrage zu einer zweiten Ware ein.
  ru.a1.unit03.lesson03.teach.prodavets_bread:
    title: Der Verkäufer antwortet noch einmal
    gloss: 'Verkäufer: Sechs Rubel.'
    note: Шесть рублей hat die Genitiv-Plural-Form, wie sie nach шесть und allen höheren Zahlen steht (ab 5).
  ru.a1.unit03.lesson03.teach.pokupatel_close:
    title: Der Kunde verabschiedet sich höflich
    gloss: 'Kunde: Gut, danke!'
    note: Хорошо, спасибо! beendet das Gespräch auf dem Markt freundlich und verwendet Wortschatz aus der Einheit über Begrüßungen.
