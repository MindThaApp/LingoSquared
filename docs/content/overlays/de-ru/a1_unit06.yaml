teaching:
  ru.a1.unit06.lesson01.teach.u_menya_est:
    title: У меня есть ...
    gloss: Ich habe ...
    note: Wörtlich „bei mir (ist) ...“ – die übliche russische Art, „ich habe“ zu sagen. In Lektion 3 stand bei У меня два брата dieselbe Konstruktion У меня; есть wird meist weggelassen, wenn es um die Anzahl geht.
  ru.a1.unit06.lesson01.teach.eto:
    title: Это ...
    gloss: Das ist ...
    note: Это dient dazu, eine Person oder Sache vorzustellen oder auf sie zu zeigen, unabhängig vom grammatischen Geschlecht.
  ru.a1.unit06.lesson01.teach.mat_otets:
    title: мать, отец
    gloss: Mutter, Vater
    note: мать gehört zu der kleinen Gruppe russischer Feminina, die auf Weichheitszeichen (-ь) enden.
    example_gloss:
    - Das ist meine Mutter.
    - Das ist mein Vater.
  ru.a1.unit06.lesson01.teach.brat_sestra:
    title: брат, сестра
    gloss: Bruder, Schwester
    note: брат kennen Sie schon aus Lektion 3 (У меня два брата); сестра ist die weibliche Entsprechung.
    example_gloss:
    - Das ist mein Bruder.
    - Ich habe eine Schwester.
  ru.a1.unit06.lesson01.teach.moy_moya:
    title: мой, моя
    gloss: mein (maskulin), meine (feminin)
    note: мой steht bei maskulinen Nomen wie отец und брат; моя steht bei femininen Nomen wie мать und сестра.
  ru.a1.unit06.lesson02.teach.babushka_dedushka:
    title: бабушка, дедушка
    gloss: Großmutter, Großvater
    note: 'Beide enden auf -а, aber дедушка bezeichnet einen Mann und ist in der Kongruenz maskulin: мой дедушка, aber моя бабушка.'
    example_gloss:
    - Das ist meine Großmutter.
    - Das ist mein Großvater.
  ru.a1.unit06.lesson02.teach.muzh_zhena:
    title: муж, жена
    gloss: Ehemann, Ehefrau
    note: муж ist maskulin und жена feminin, wie es den regelmäßigen Endungen entspricht.
    example_gloss:
    - Das ist mein Mann.
    - Das ist meine Frau.
  ru.a1.unit06.lesson02.teach.syn_doch:
    title: сын, дочь
    gloss: Sohn, Tochter
    note: дочь ist wie мать ein Femininum auf Weichheitszeichen (-ь).
    example_gloss: Ich habe einen Sohn und eine Tochter.
  ru.a1.unit06.lesson02.teach.deti:
    title: дети
    gloss: Kinder
    note: дети ist der unregelmäßige Plural von ребёнок („Kind“) – Singular und Plural sind völlig verschiedene Wörter.
    example_gloss: Haben Sie Kinder?
  ru.a1.unit06.lesson02.teach.u_vas_est:
    title: У вас есть ...?
    gloss: Haben Sie ...? (formell)
    note: Hier steht das höfliche вас, passend zur вы-Anrede aus Lektion 2.
  ru.a1.unit06.lesson03.teach.kto_eto:
    title: Кто это?
    gloss: Wer ist das?
    note: Die übliche Frage, um zu erfahren, wer jemand ist, zum Beispiel beim Betrachten eines Fotos.
  ru.a1.unit06.lesson03.teach.eyo_zovut:
    title: Её зовут Анна.
    gloss: Sie heißt Anna.
    note: Wörtlich „man nennt sie Anna“ – Её („sie“) ist das Objekt des Verbs зовут, nicht das Subjekt.
  ru.a1.unit06.lesson03.teach.maksim_kto_eto:
    title: Maxim fragt nach dem Foto
    gloss: 'Maxim: Wer ist das auf dem Foto?'
    note: 'Maxim zeigt auf das Foto und fragt: Кто это на фото?'
  ru.a1.unit06.lesson03.teach.olga_moya_semya:
    title: Olga stellt ihre Familie vor
    gloss: 'Olga: Das ist meine Familie.'
    note: 'Это моя семья: семья („Familie“) ist feminin, deshalb steht моя.'
  ru.a1.unit06.lesson03.teach.olga_vot_otets:
    title: Olga nennt drei Familienmitglieder
    gloss: 'Olga: Hier sind mein Vater, meine Mutter und mein Bruder.'
    note: Вот („hier ist/sind“) leitet die Aufzählung ein; jedes Possessivpronomen (мой/моя) richtet sich nach dem Nomen, das darauf folgt.
  ru.a1.unit06.lesson03.teach.maksim_a_kto_devochka:
    title: Maxim fragt nach dem Mädchen
    gloss: 'Maxim: Und wer ist das Mädchen?'
    note: А knüpft Maxims Anschlussfrage nach einer vierten Person auf dem Foto sanft an.
  ru.a1.unit06.lesson03.teach.olga_eto_moya_doch:
    title: Olga nennt ihre Tochter
    gloss: 'Olga: Das ist meine Tochter. Sie heißt Anna.'
    note: Olga antwortet mit моя дочь und nennt dann mit Её зовут Анна den Namen.
