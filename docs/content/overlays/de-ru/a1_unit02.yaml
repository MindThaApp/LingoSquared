teaching:
  ru.a1.unit02.lesson01.teach.kak_vas_zovut:
    title: Как вас зовут?, Как тебя зовут?
    gloss: Wie heißen Sie? (förmlich); Wie heißt du? (informell)
    note: Как вас зовут? enthält das förmliche вас und wird bei Fremden oder in höflichem Rahmen verwendet. Как тебя зовут? enthält das informelle тебя, das man bei Freunden, Kindern und Gleichaltrigen verwendet.
    example_gloss:
    - Guten Tag! Wie heißen Sie?
    - Hallo! Wie heißt du?
  ru.a1.unit02.lesson01.teach.menya_zovut:
    title: Меня зовут Виктор.
    gloss: Ich heiße Viktor.
    note: Меня зовут (wörtlich „man nennt mich“) ist die übliche Art, im Russischen seinen Namen zu nennen, unabhängig vom Register.
  ru.a1.unit02.lesson01.teach.menya_zovut_anna:
    title: Меня зовут Анна.
    gloss: Ich heiße Anna.
    note: Dasselbe Muster, Меня зовут ..., mit einem anderen Namen – diese Wendung ändert sich nicht nach dem Geschlecht des Sprechers.
  ru.a1.unit02.lesson01.teach.register_note:
    title: Die richtige Frage wählen
    gloss: Как вас зовут? ist höflich bzw. für Fremde. Как тебя зовут? ist für Freunde, Kinder und Gleichaltrige.
    note: Die Unterscheidung förmlich/informell entspricht hier dem Gegensatz вы/ты, der in lesson02 ausführlich behandelt wird – вас und тебя sind die Akkusativformen von вы und ты.
  ru.a1.unit02.lesson02.teach.vy_ty:
    title: вы, ты
    gloss: Sie (förmlich); du (informell)
    note: Wie im Deutschen („Sie“ und „du“) gibt es im Russischen zwei Anredeformen – вы verwendet man bei Fremden, Älteren und im beruflichen Umfeld; ты bei Freunden, in der Familie und bei Kindern.
    example_gloss:
    - Woher kommen Sie? (formell)
    - Woher kommst du? (informell)
  ru.a1.unit02.lesson02.teach.vy_ty_rule:
    title: Wann man was verwendet
    gloss: 'Вы ist förmlich: bei Fremden, bei der Arbeit, bei Älteren. Ты ist informell: bei Freunden, in der Familie, bei Kindern.'
    note: ты bei jemandem zu verwenden, der вы erwartet, kann übermäßig vertraulich oder sogar unhöflich wirken – im Zweifel beginnen Sie mit вы.
  ru.a1.unit02.lesson02.teach.mozhno_na_ty:
    title: Можно на ты?
    gloss: Können wir zum informellen ты wechseln?
    note: Eine höfliche Art vorzuschlagen, vom förmlichen вы zum informellen ты zu wechseln, sobald die Beziehung freundschaftlich genug ist.
  ru.a1.unit02.lesson02.teach.davayte_pereydyom:
    title: Давайте перейдём на ты.
    gloss: Lassen Sie uns zum informellen ты wechseln.
    note: Eine etwas direktere, einladendere Art, denselben Wechsel des Registers vorzuschlagen wie mit Можно на ты?
  ru.a1.unit02.lesson02.teach.otkuda_vy:
    title: Откуда вы?
    gloss: Woher kommen Sie? (formell)
    note: Verwendet das förmliche вы, passend zu einer ersten Begegnung oder zum beruflichen Umfeld.
  ru.a1.unit02.lesson02.teach.otkuda_ty:
    title: Откуда ты?
    gloss: Woher kommst du? (informell)
    note: Das informelle Gegenstück, das man bei jemandem verwendet, den man schon gut kennt.
  ru.a1.unit02.lesson02.teach.ya_iz_kanady:
    title: Я из Канады.
    gloss: Ich komme aus Kanada.
    note: Из („aus“) verlangt den Genitiv, daher wird aus Канада hier Канады – dieses Genitiv-Muster für die Herkunft sollten Sie sich merken, auch wenn die Kasusgrammatik erst später ausführlich folgt.
  ru.a1.unit02.lesson02.teach.ya_iz_moskvy:
    title: Я из Москвы.
    gloss: Ich komme aus Moskau.
    note: 'Dasselbe Genitiv-Muster für die Herkunft wie bei Я из Канады: Москва wird nach из zu Москвы.'
  ru.a1.unit02.lesson03.teach.davayte_poznakomimsya:
    title: Давайте познакомимся.
    gloss: Lassen Sie uns einander kennenlernen.
    note: Eine höfliche, übliche Art, eine Vorstellung zwischen Menschen zu eröffnen, die sich zum ersten Mal treffen.
  ru.a1.unit02.lesson03.teach.ochen_priyatno:
    title: Очень приятно
    gloss: freut mich
    note: Eine höfliche Standardantwort, nachdem jemand gerade seinen Namen genannt hat.
    example_gloss: Ich heiße John. – Freut mich.
  ru.a1.unit02.lesson03.teach.irina_greeting:
    title: Irina Petrovna eröffnet die Vorstellung
    gloss: 'Irina Petrovna sagt: Guten Tag! Lassen Sie uns einander kennenlernen. Ich heiße Irina Petrovna.'
    note: Irina Petrovna trifft John zum ersten Mal in einem förmlichen Büro, deshalb verwendet sie das höfliche Здравствуйте und durchgehend die вы-Form.
  ru.a1.unit02.lesson03.teach.john_reply:
    title: John antwortet mit seinem Namen
    gloss: 'John sagt: Freut mich. Ich heiße John.'
    note: John passt sich mit Очень приятно dem förmlichen, höflichen Register von Irina Petrovna an.
  ru.a1.unit02.lesson03.teach.irina_question:
    title: Irina Petrovna fragt, woher John kommt
    gloss: 'Irina Petrovna fragt: Woher kommen Sie, John?'
    note: Sie verwendet das förmliche Откуда вы, passend zum Büroumfeld.
  ru.a1.unit02.lesson03.teach.john_answer:
    title: John antwortet und fragt zurück
    gloss: 'John sagt: Ich komme aus Kanada. Und woher kommen Sie?'
    note: John nennt seine Herkunft und gibt die Frage mit А вы откуда? höflich zurück.
  ru.a1.unit02.lesson03.teach.irina_answer:
    title: Irina Petrovna antwortet
    gloss: 'Irina Petrovna sagt: Ich komme aus Moskau.'
    note: Sie schließt den Austausch ab und verwendet dabei das Genitiv-Muster für die Herkunft aus lesson02.
