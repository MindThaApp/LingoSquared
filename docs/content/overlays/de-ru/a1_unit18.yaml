  ru.a1.unit18.lesson01.teach.eto_moya_kvartira:
    title: Это моя квартира.
    gloss: Das ist meine Wohnung.
    note: Это bedeutet „das ist“; моя („meine“, feminin) passt zum femininen Nomen квартира („Wohnung“).
  ru.a1.unit18.lesson01.teach.kuhnya:
    title: кухня
    gloss: Küche
    note: кухня bedeutet „Küche“. стол bedeutet „Tisch“.
    example_gloss: In der Küche steht ein Tisch.
  ru.a1.unit18.lesson01.teach.spalnya:
    title: спальня
    gloss: Schlafzimmer
    note: спальня bedeutet „Schlafzimmer“. кровать bedeutet „Bett“.
    example_gloss: Im Schlafzimmer steht ein Bett.
  ru.a1.unit18.lesson02.teach.divan_v_gostinoy:
    title: Диван в гостиной.
    gloss: Das Sofa ist im Wohnzimmer.
    note: диван bedeutet „Sofa“; гостиная bedeutet „Wohnzimmer“ (гостиной ist die Präpositiv-Form nach в, „in“).
  ru.a1.unit18.lesson02.teach.stol_na_kuhne:
    title: на
    gloss: auf / an
    note: Bei кухня steht на (wörtlich „auf der Küche“, sinngemäß „in der Küche“) statt в, anders als bei den meisten Zimmern.
    example_gloss: Der Tisch ist in der Küche.
  ru.a1.unit18.lesson02.teach.vannaya:
    title: ванная
    gloss: Badezimmer
    note: ванная bedeutet „Badezimmer“.
    example_gloss: Das Badezimmer liegt neben dem Schlafzimmer.
  ru.a1.unit18.lesson03.teach.dima_gde_ty_zhivyosh:
    title: Dima fragt, wo Nastja wohnt
    gloss: 'Dima: Nastja, wo wohnst du?'
    note: 'Дима beginnt mit: Настя, где ты живёшь?'
  ru.a1.unit18.lesson03.teach.nastya_zhivu_v_kvartire:
    title: Nastja sagt, wo sie wohnt
    gloss: 'Nastja: Ich wohne in einer Wohnung.'
    note: 'Настя antwortet: Я живу в квартире; живу ist die „ich“-Form von жить („leben, wohnen“), und в квартире ist die Präpositiv-Form von квартира.'
  ru.a1.unit18.lesson03.teach.dima_skolko_komnat:
    title: Dima fragt, wie viele Zimmer es sind
    gloss: 'Dima: Wie viele Zimmer hat die Wohnung?'
    note: 'Nach Сколько („wie viele“) steht der Genitiv Plural: сколько комнат.'
  ru.a1.unit18.lesson03.teach.nastya_dve_komnaty:
    title: Nastja zählt die Zimmer auf
    gloss: 'Nastja: Zwei Zimmer: ein Schlafzimmer und ein Wohnzimmer. Eine Küche und ein Bad gibt es auch.'
    note: 'Настя fährt fort: Две комнаты: спальня и гостиная. Кухня и ванная тоже есть.'
