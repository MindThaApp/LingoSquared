  title: Russisch A1
  description: 'Russisch für Anfänger, um Freizeitaktivitäten zu beschreiben: Hobby-Wortschatz, Häufigkeitsausdrücke, Fragen und Antworten dazu, was jemand in seiner Freizeit macht, und der Vergleich der Hobbys zweier Personen.'
