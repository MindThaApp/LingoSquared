teaching:
  ru.a1.unit25.lesson01.teach.chitat_zanimatsya_sportom:
    title: Lesen, Sport, Kochen
    gloss: lesen, Sport treiben, kochen
    note: 'Drei häufige Hobby-Verben: *читать* (lesen), *заниматься спортом* (Sport treiben) und *готовить* (kochen).'
    example_gloss:
    - Ich lese gern ein Buch.
    - Ich treibe samstags Sport.
    - Ich koche gern für Freunde.
  ru.a1.unit25.lesson01.teach.svobodnoe_vremya:
    title: Freizeit
    gloss: Freizeit
    note: '*Свободное время* ist die Schlüsselwendung, um über Hobbys zu sprechen. Das Adjektiv *свободное* endet auf *-ое* und passt sich damit an *время* an.'
    example_gloss: In meiner Freizeit lese ich gern.
  ru.a1.unit25.lesson01.teach.v_svobodnoe_vremya:
    title: Sagen, was man in der Freizeit macht
    gloss: In meiner Freizeit lese ich gern.
    note: '*Люблю* ist die *я*-Form von *любить* (mögen, lieben). Danach steht das zweite Verb im Infinitiv: *люблю читать*.'
  ru.a1.unit25.lesson02.teach.slushat_muzyku_risovat:
    title: Musik, Zeichnen, Gaming
    gloss: Musik hören, zeichnen, Videospiele spielen
    note: 'Drei weitere Hobbys: *слушать музыку* (Musik hören), *рисовать* (zeichnen) und *играть в игры* (Videospiele spielen).'
    example_gloss:
    - Ich höre gern Musik.
    - Ich zeichne oft.
    - Ich spiele gern mit Freunden Videospiele.
  ru.a1.unit25.lesson02.teach.ya_lyublyu_slushat:
    title: Sagen, dass man gern Musik hört
    gloss: Ich höre gern Musik.
    note: '*Слушать* wird direkt mit dem Objekt verbunden, im Akkusativ: *музыку* ist der Akkusativ von *музыка* mit der Endung *-у*.'
  ru.a1.unit25.lesson02.teach.ya_lyublyu_igrat:
    title: Sagen, dass man gern mit Freunden Videospiele spielt
    gloss: Ich spiele gern mit Freunden Videospiele.
    note: '*С друзьями* (mit Freunden): Auf die Präposition *с* folgt der Instrumental, daher *друзьями*.'
  ru.a1.unit25.lesson03.teach.vsegda_chasto_inogda:
    title: Immer, oft, manchmal, nie
    gloss: immer, oft, manchmal, nie
    note: 'Die vier wichtigsten Häufigkeitsadverbien: *всегда*, *часто*, *иногда*, *никогда*. Sie verändern ihre Form nie.'
    example_gloss:
    - Ich treibe immer samstags Sport.
    - Ich lese oft ein Buch.
    - Ich zeichne manchmal.
    - Ich spiele nie Videospiele.
  ru.a1.unit25.lesson03.teach.kazhduyu_nedelyu_kazhdye:
    title: Jede Woche, jedes Wochenende
    gloss: jede Woche, jedes Wochenende
    note: '*Каждую неделю* und *каждые выходные* bedeuten beide „jede/jedes“, aber die Endung richtet sich nach dem Nomen: siehe nächste Karte.'
    example_gloss:
    - Ich koche jede Woche für Freunde.
    - Ich treibe jedes Wochenende Sport.
  ru.a1.unit25.lesson03.teach.nedelya_zhenskogo_roda:
    title: '„Jede“: Femininum und Plural'
    gloss: '*Неделя* ist feminin, daher *каждую неделю*. *Выходные* steht im Plural, daher *каждые выходные*.'
    note: '*Каждый* richtet sich wie jedes Adjektiv nach seinem Nomen: *каждый день* (maskulin), *каждую неделю* (feminin, Akkusativ), *каждые выходные* (Plural).'
  ru.a1.unit25.lesson03.teach.chto_ty_delaesh:
    title: Nach der Freizeit fragen
    gloss: Was machst du in deiner Freizeit?
    note: Das ist die Kernfrage dieser Lektion – mit ihr können Sie jeden nach seinen Hobbys fragen.
  ru.a1.unit25.lesson04.teach.nastya_my_chasto:
    title: Nastya spricht über Hobbys
    gloss: 'Nastya: Wir gehen oft zusammen spazieren. Und was machst du sonst noch in deiner Freizeit, Dima?'
    note: '*Мы часто гуляем вместе*: *мы* (wir) verlangt die Verbendung *-ем*, und *гулять* heißt zum Vergnügen spazieren gehen.'
  ru.a1.unit25.lesson04.teach.dima_ya_lyublyu:
    title: Dimas Hobbys
    gloss: 'Dima: Ich koche gern, auch zu Hause. Und ich treibe oft Sport.'
    note: '*И дома тоже* (auch zu Hause): *и ... тоже* zeigt, dass Dima aus Spaß kocht, nicht nur bei der Arbeit.'
  ru.a1.unit25.lesson04.teach.nastya_ty_i:
    title: Nastya ist überrascht
    gloss: 'Nastya: Du kochst auch zu Hause? Du kochst doch schon den ganzen Tag bei der Arbeit!'
    note: '*Весь день* (den ganzen Tag) betont, wie viel Dima schon bei der Arbeit kocht. *Весь* richtet sich nach dem Maskulinum *день*.'
  ru.a1.unit25.lesson04.teach.dima_da_no:
    title: Dima erklärt
    gloss: 'Dima: Ja, aber Kochen entspannt mich. Und du, was machst du gern?'
    note: '*Готовить меня расслабляет* stellt die Tätigkeit an den Anfang: wörtlich „Kochen entspannt mich“, mit *меня* im Akkusativ.'
  ru.a1.unit25.lesson04.teach.nastya_ya_lyublyu:
    title: Nastyas Hobbys
    gloss: 'Nastya: Ich lese gern und höre oft Musik.'
    note: 'Zwei Hobby-Verben aus den früheren Lektionen werden mit *и* (und) verbunden: *люблю читать и часто слушаю музыку*.'
  ru.a1.unit25.lesson04.teach.dima_ty_tozhe:
    title: Dima fragt nach dem Zocken
    gloss: 'Dima: Zockst du auch?'
    note: 'Eine kurze Ja/Nein-Frage: Im Russischen bleibt die Wortstellung gleich, nur die Intonation steigt: *Ты тоже играешь в игры?*'
  ru.a1.unit25.lesson04.teach.nastya_net_ya:
    title: Nastya antwortet
    gloss: 'Nastya: Nein, ich zocke nie. Dafür zeichne ich manchmal!'
    note: '*Никогда не* (nie) braucht vor dem Verb zusätzlich *не*. *Иногда* (manchmal) bildet den Gegensatz.'
  ru.a1.unit25.lesson05.teach.my_s_dimoy:
    title: Hobbys im Vergleich
    gloss: Dima und ich gehen oft zusammen spazieren. Aber wir haben auch andere Hobbys. Dima kocht gern, auch zu Hause, und treibt oft Sport. Ich lese gern und höre oft Musik. Ich zeichne manchmal, aber ich zocke nie. Was machst du in deiner Freizeit gern?
    note: Nastyas Nachricht fasst Bekanntes aus früheren Lektionen zusammen und endet mit der Kernfrage der Einheit an die Leserin oder den Leser.
    glosses:
      гуляем: spazieren gehen
      часто: oft
      вместе: zusammen
      другие: andere
      готовить: kocht
      любит: mag
      дома: zu Hause
      занимается: macht Sport
      читать: lesen
      слушаю: hören
      музыку: Musik
      рисую: zeichne
      иногда: manchmal
      играю: Videospiele spielen
      никогда: nie
      свободное: frei
      время: Zeit
  ru.a1.unit25.lesson06.teach.dima_chto_ty:
    title: Dima fragt nach dem Wochenende
    gloss: 'Dima: Was machst du dieses Wochenende?'
    note: '*В эти выходные* (dieses Wochenende): *выходные* steht im Plural, also auch *эти*, und *в* mit einer Zeitangabe verlangt den Akkusativ.'
  ru.a1.unit25.lesson06.teach.nastya_poka_ne:
    title: Nastya ist unentschlossen
    gloss: 'Nastya: Weiß ich noch nicht. Ich lese gern, aber ich möchte auch nach draußen gehen.'
    note: '*Хочу ещё выйти на улицу* heißt „Ich möchte auch nach draußen gehen“. *Хочу* ist die *я*-Form von *хотеть*.'
  ru.a1.unit25.lesson06.teach.dima_davay_pogulyaem:
    title: Dima macht einen Vorschlag
    gloss: 'Dima: Gehen wir zusammen spazieren? Danach koche ich für uns.'
    note: '*Давай погуляем* ist die übliche Art, etwas gemeinsam vorzuschlagen, und *потом* (danach) ordnet den nächsten Schritt ein.'
  ru.a1.unit25.lesson06.teach.nastya_khoroshaya_ideya:
    title: Nastya stimmt zu
    gloss: 'Nastya: Gute Idee! Ich gehe gern spazieren und koche gern.'
    note: '*Мне нравится* heißt wörtlich „mir ist gefällig“: Die Person steht im Dativ (*мне*), danach folgt, was gefällt.'
  ru.a1.unit25.lesson06.teach.dima_otlichno_togda:
    title: Dima bestätigt
    gloss: 'Dima: Super. Dann sehen wir uns am Samstag!'
    note: '*Увидимся в субботу* (bis Samstag): *в* mit einem Wochentag verlangt den Akkusativ, daher wird *суббота* zu *субботу*.'
