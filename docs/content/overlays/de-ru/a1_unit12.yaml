teaching:
  ru.a1.unit12.lesson01.teach.davay:
    title: Давай пойдём...
    gloss: Lass uns gehen ...
    note: Давай ist ein informelles Vorschlagswort („lass uns“); пойдём ist die Futurform für „wir“ von „gehen“. Zusammen schlagen sie eine Unternehmung vor.
  ru.a1.unit12.lesson01.teach.kino:
    title: кино
    gloss: das Kino
    note: кино ist ein undeklinierbares Neutrum mit der Bedeutung „Kino“.
    example_gloss: Lass uns ins Kino gehen.
  ru.a1.unit12.lesson01.teach.zavtra_subbotu:
    title: завтра, в субботу
    gloss: morgen, am Samstag
    note: завтра bedeutet „morgen“; в субботу steht für einen Wochentag mit в + Akkusativ.
    example_gloss: Lass uns morgen ins Kino gehen.
  ru.a1.unit12.lesson02.teach.soglasen:
    title: Хорошо, я согласен.
    gloss: Gut, ich bin einverstanden.
    note: согласен („einverstanden“) sagt ein männlicher Sprecher; eine Sprecherin sagt согласна.
  ru.a1.unit12.lesson02.teach.ne_mogu:
    title: К сожалению, я не могу.
    gloss: Leider kann ich nicht.
    note: К сожалению („leider“) mildert eine Absage; не могу heißt „ich kann nicht“.
  ru.a1.unit12.lesson02.teach.vo_skolko:
    title: Во сколько мы встретимся?
    gloss: Um wie viel Uhr treffen wir uns?
    note: Во сколько fragt nach der Uhrzeit; встретимся ist die Futurform für „wir“ von „sich treffen“.
    example_gloss: Sagen wir um sieben Uhr.
  ru.a1.unit12.lesson03.teach.nastya_davay_poydyom:
    title: Nastja macht einen Vorschlag
    gloss: 'Nastja: Lass uns am Samstag ins Kino gehen.'
    note: Настя beginnt mit Давай пойдём в кино в субботу.
  ru.a1.unit12.lesson03.teach.dima_horosho_soglasen:
    title: Dima stimmt zu und fragt nach der Uhrzeit
    gloss: 'Dima: Gut, ich bin einverstanden. Um wie viel Uhr treffen wir uns?'
    note: 'Дима stimmt zu und fragt dann: Во сколько мы встретимся?'
  ru.a1.unit12.lesson03.teach.nastya_davay_v_sem:
    title: Nastja schlägt Uhrzeit und Ort vor
    gloss: 'Nastja: Sagen wir um sieben Uhr, am Kino.'
    note: у кинотеатра bedeutet „am/beim Kino“ und steht mit у + Genitiv.
  ru.a1.unit12.lesson03.teach.dima_otlichno:
    title: Dima bestätigt
    gloss: 'Dima: Super, bis Samstag.'
    note: Отлично, до субботы beschließt das Gespräch; до субботы heißt wörtlich „bis Samstag“.
