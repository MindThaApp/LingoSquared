course:
  title: Russisch A1
  description: Lernen Sie Russisch auf A1-Niveau, um einen einfachen Plan für die nahe Zukunft vorzuschlagen, anzunehmen, abzulehnen und zeitlich festzulegen, mit ausführlichen Erklärungen zu Wortschatz, Wendungen und Dialogen.
