  description: 'Russisch für Anfänger: über Haustiere und häufige Tiere sprechen – sie benennen, grundlegende Pflege (Gassi gehen, füttern, spielen), sagen, welche Tiere man liebt, auch ohne eines zu besitzen, und der regelmäßige russische Plural.'
