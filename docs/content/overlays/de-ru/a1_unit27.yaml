teaching:
  ru.a1.unit27.lesson01.teach.zhivotnoe_domashnee_zhivotnoe:
    title: Tier, Haustier
    gloss: das Tier / ein Haustier
    note: '*Животное* ist das allgemeine Wort für Tier. *Домашнее животное* (wörtlich „häusliches Tier“) bedeutet speziell Haustier.'
    example_gloss:
    - Ein Hund ist ein Tier.
    - Ein Hund ist auch ein Haustier.
  ru.a1.unit27.lesson01.teach.sobaka_koshka:
    title: Hund und Katze
    gloss: der Hund / die Katze
    example_gloss:
    - Nastya hat einen Hund.
    - Igor hat eine Katze.
  ru.a1.unit27.lesson01.teach.ryba_ptitsa:
    title: Fisch und Vogel
    gloss: der Fisch / der Vogel
    example_gloss:
    - Opa hat einen Fisch.
    - Nina hat einen Vogel.
  ru.a1.unit27.lesson01.teach.u_tebya_est:
    title: Hast du ein Haustier?
    gloss: Hast du ein Haustier?
    note: '*У тебя есть ...?* ist die Frage für „Hast du ...?“: *у тебя* („bei dir“) + *есть* + die Sache.'
  ru.a1.unit27.lesson01.teach.da_u_menya:
    title: Ja, ich habe einen Hund
    gloss: Ja, ich habe einen Hund.
    note: Eine einfache bejahende Antwort mit dem neuen Wortschatz dieser Lektion.
  ru.a1.unit27.lesson01.teach.net_u_menya:
    title: Nein, ich habe kein Haustier
    gloss: Nein, ich habe kein Haustier.
    note: '*Нет* + Genitiv drückt aus, dass man etwas nicht hat: *у меня нет домашнего животного*. Siehe die Grammatikregel.'
  ru.a1.unit27.lesson01.teach.posle_net_slovo:
    title: Нет plus Genitiv
    gloss: 'Nach *нет* steht das, was fehlt, im Genitiv: *у меня нет времени*, *у меня нет домашнего животного*.'
    note: 'Vergleichen Sie die bejahte Form: *у меня есть собака* (Nominativ), aber *у меня нет собаки* (Genitiv).'
  ru.a1.unit27.lesson02.teach.gulyat_s_sobakoy:
    title: (Ein Tier) ausführen
    gloss: (ein Tier) ausführen, mit dem Hund rausgehen
    note: '*Гулять с собакой* verwendet *с* plus Instrumental, *собакой*. Siehe die Grammatikregel.'
    example_gloss: Ich gehe jeden Tag mit dem Hund spazieren.
  ru.a1.unit27.lesson02.teach.posle_s_slovo:
    title: С plus Instrumental
    gloss: 'Nach *с* (mit) steht das Nomen im Instrumental: *гулять с собакой*, *играть с кошкой*.'
    note: 'Der Instrumental feminin endet auf *-ой* oder *-ей*: *собакой*, *кошкой*.'
  ru.a1.unit27.lesson02.teach.kormit:
    title: Füttern
    gloss: füttern
    example_gloss: Ich füttere jeden Tag die Katze.
  ru.a1.unit27.lesson02.teach.igrat_s:
    title: Spielen mit
    gloss: spielen mit
    example_gloss: Igor spielt mit seiner Katze.
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den:
    title: Ich gehe jeden Tag mit dem Hund spazieren
    gloss: Ich gehe jeden Tag mit dem Hund spazieren.
    note: '*Каждый день* (jeden Tag) ist eine Zeitangabe ohne Präposition: *Я каждый день гуляю с собакой*.'
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den_2:
    title: Ich füttere jeden Tag die Katze
    gloss: Ich füttere jeden Tag die Katze.
    note: '*Кормить* verlangt das Tier als direktes Objekt im Akkusativ: aus *кошка* wird *кошку*.'
  ru.a1.unit27.lesson03.teach.posle_lyubit_zhivotnoe:
    title: Tiere nach любить
    gloss: 'Nach *любить* steht ein Tiername im Akkusativ, der bei belebten Nomen im Plural dem Genitiv gleicht: *собак*, *кошек*, *птиц*, *рыб*.'
    note: Das regelmäßige russische Pluralmuster wird hier zum ersten Mal eingeführt, mit Tiernamen als Beispielen.
  ru.a1.unit27.lesson03.teach.sobak_koshek:
    title: Hunde und Katzen
    gloss: Hunde / Katzen
    example_gloss:
    - Dima liebt Hunde.
    - Lena liebt Katzen.
  ru.a1.unit27.lesson03.teach.ryb_ptits:
    title: Fische und Vögel (Plural)
    gloss: Fische / Vögel
    example_gloss:
    - Ich liebe Fische.
    - Opa liebt Vögel.
  ru.a1.unit27.lesson03.teach.ya_lyublyu_zhivotnykh:
    title: Ich liebe Tiere
    gloss: Ich liebe Tiere.
    note: '*Люблю* + Akkusativ: *Я люблю животных*. Bei belebten Nomen im Plural sieht der Akkusativ wie der Genitiv aus.'
  ru.a1.unit27.lesson03.teach.lena_lyubit_koshek:
    title: Lena liebt Katzen, hat aber kein Haustier
    gloss: Lena liebt Katzen, aber sie hat kein Haustier.
    note: Bereitet den Gegensatz vor, um den sich der Lesetext der Lektion dreht.
  ru.a1.unit27.lesson04.teach.dima_u_tebya:
    title: Dima fragt nach einem Haustier
    gloss: 'Dima: Hast du ein Haustier, Nastya?'
  ru.a1.unit27.lesson04.teach.nastya_da_u:
    title: Nastya hat einen Hund
    gloss: 'Nastya: Ja, ich habe einen Hund.'
  ru.a1.unit27.lesson04.teach.dima_kak_on:
    title: Dima fragt, wie er aussieht
    gloss: 'Dima: Wie sieht er aus?'
    note: Die Frage *Как он выглядит?* funktioniert auch bei Tieren. *Он* wird für ein männliches Haustier verwendet.
  ru.a1.unit27.lesson04.teach.nastya_u_nego:
    title: Nastya beschreibt ihren Hund
    gloss: 'Nastya: Er hat braunes Fell und ist klein.'
    note: Greift Wortschatz zu Haarfarbe und Größe aus der Lektion zum Aussehen wieder auf, hier für das Fell eines Tieres statt für die Haare eines Menschen.
  ru.a1.unit27.lesson04.teach.o_zhivotnom_mozhno:
    title: Он und она bei Tieren
    gloss: 'Ein Haustier kann wie ein Mensch *он* oder *она* sein: *У меня собака, он маленький*.'
    note: Grammatisch ist *собака* feminin, aber man sagt oft *он*, wenn man weiß, dass das Tier männlich ist.
  ru.a1.unit27.lesson04.teach.dima_ty_gulyaesh:
    title: Dima fragt nach den Spaziergängen
    gloss: 'Dima: Gehst du jeden Tag mit ihm spazieren?'
  ru.a1.unit27.lesson04.teach.nastya_da_ya:
    title: Nastya beschreibt ihren Alltag
    gloss: 'Nastya: Ja, ich gehe jeden Tag mit ihm spazieren und füttere ihn.'
  ru.a1.unit27.lesson05.teach.dima_i_lena:
    title: Dima, Lena und Igor über Tiere
    gloss: 'Dima und Lena lieben beide Tiere, aber keiner von beiden hat ein Haustier. Dima liebt Hunde und Lena liebt Katzen. Igor dagegen hat ein Haustier: eine Katze. Er spielt oft mit seiner Katze und gibt ihr jeden Tag Futter. Hast du ein Haustier?'
    note: Stellt gegenüber, ein Tier zu lieben und es wirklich zu besitzen – das ist der kommunikative Kern dieser Lektion.
    glosses:
      любят: lieben
      оба: beide
      животных: Tiere
      обоих: beide
      домашнего: Haustier
      собак: Hunde
      кошек: Katzen
      кошка: Katze
      играет: spielt
      даёт: gibt
      каждый: jeder
      корм: Futter
  ru.a1.unit27.lesson05.teach.igor_chasto_igraet:
    title: Igor spielt oft mit seiner Katze
    gloss: Igor spielt oft mit seiner Katze.
    note: '*Со своей кошкой*: *со* ist *с* vor mehreren Konsonanten, und *своей* bedeutet „seine eigene“ und bezieht sich auf das Subjekt zurück.'
  ru.a1.unit27.lesson05.teach.ya_lyublyu_sobak:
    title: Ich liebe Hunde. Ich habe kein Haustier.
    gloss: Ich liebe Hunde. Ich habe kein Haustier.
    note: Eine Muster-Antwort in zwei Sätzen, die Sie für die Schreibaufgabe der Lektion übernehmen können.
  ru.a1.unit27.lesson06.teach.nastya_nina_u:
    title: Nastya fragt Nina
    gloss: 'Nastya: Nina, hast du auch ein Haustier?'
  ru.a1.unit27.lesson06.teach.nina_da_u:
    title: Nina hat einen Vogel namens Pico
    gloss: 'Nina: Ja, ich habe einen Vogel. Er heißt Pico.'
    note: '*Его зовут Пико* bedeutet wörtlich „man nennt ihn Pico“. So gibt man im Russischen einen Namen an.'
  ru.a1.unit27.lesson06.teach.dima_kak_zdorovo:
    title: Dima reagiert
    gloss: 'Dima: Wie schön! Was machst du jeden Tag mit ihm?'
  ru.a1.unit27.lesson06.teach.nina_ya_kazhdyy:
    title: Nina füttert ihn jeden Tag
    gloss: 'Nina: Ich füttere ihn jeden Tag.'
  ru.a1.unit27.lesson06.teach.dima_ya_tozhe:
    title: Dima liebt auch Vögel
    gloss: 'Dima: Ich liebe Vögel auch.'
  ru.a1.unit27.lesson06.teach.nastya_kak_khorosho:
    title: Nastya beendet das Gespräch
    gloss: 'Nastya: Wie schön, dass wir drei alle Tiere lieben!'
    note: Schließt den Kreis um alle Aussagen der drei Personen zu Tieren in dieser Lektion.
