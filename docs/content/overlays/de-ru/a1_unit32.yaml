    title: Wer macht was für die Party?
    gloss: Am Samstag hat Lena Geburtstag. Wir feiern ihn mit einer Party. Dima lädt Igor und Nastja zur Party ein. Igor feiert gern mit Freunden. Nastja kommt auch zur Party. Alle freuen sich für Lena.
