teaching:
  ru.a1.unit01.lesson01.teach.direction:
    title: Leserichtung
    gloss: Das russische Alphabet wird von links nach rechts gelesen, wie das deutsche.
    note: Russisch (kyrillische Schrift) wird in derselben Richtung gelesen wie Deutsch. Sie müssen sich also keine neue Leserichtung angewöhnen, sondern nur neue Buchstabenformen und Laute lernen.
  ru.a1.unit01.lesson01.teach.letter_z:
    title: З з
    gloss: der Buchstabe Z
    note: Wird ausgesprochen wie das stimmhafte „s“ in „Sonne“. Die Kleinbuchstabenform з sieht einer Ziffer 3 ähnlich.
  ru.a1.unit01.lesson01.teach.letter_d:
    title: Д д
    gloss: der Buchstabe D
    note: Wird ausgesprochen wie das „d“ in „Dach“. Die Kleinbuchstabenform д ist eine kleinere Version des Großbuchstabens mit kurzen „Füßchen“ unter der Linie. Sie ähnelt dem lateinischen „d“ gar nicht, lernen Sie die Form also ganz neu.
  ru.a1.unit01.lesson01.teach.letter_r:
    title: Р р
    gloss: der Buchstabe R
    note: 'Wird als gerolltes „r“ ausgesprochen (Zungenspitzen-R). Der Buchstabe sieht aus wie ein lateinisches „P“, ist aber ein klassischer Fallstrick: Lesen Sie ihn nicht als „p“.'
  ru.a1.unit01.lesson01.teach.letter_a:
    title: А а
    gloss: der Buchstabe A
    note: Wird ausgesprochen wie das „a“ in „Vater“. Sieht genauso aus wie das lateinische „A/a“ und klingt ihm auch ähnlich.
  ru.a1.unit01.lesson01.teach.letter_v:
    title: В в
    gloss: der Buchstabe W (russisch „V“)
    note: Wird ausgesprochen wie das „w“ in „Wasser“. Sieht aus wie ein lateinisches „B“, ein weiterer Fallstrick.
  ru.a1.unit01.lesson01.teach.letter_s:
    title: С с
    gloss: der Buchstabe S
    note: Wird ausgesprochen wie das stimmlose „s“ in „Wasser“ oder „Haus“. Sieht aus wie das lateinische „C/c“ und wird im Russischen nie wie „k“ oder „z“ gesprochen.
  ru.a1.unit01.lesson01.teach.letter_t:
    title: Т т
    gloss: der Buchstabe T
    note: Wird ausgesprochen wie das „t“ in „Tisch“. Die Kleinbuchstabenform т wird handschriftlich manchmal wie ein kleines „m“ geschrieben. Lernen Sie zuerst die gedruckte Form.
  ru.a1.unit01.lesson01.teach.letter_u:
    title: У у
    gloss: der Buchstabe U
    note: Wird ausgesprochen wie das „u“ in „Mut“. Sieht aus wie ein lateinisches „y“, entspricht aber nicht dem Laut dieses ähnlich aussehenden Buchstabens.
  ru.a1.unit01.lesson01.teach.letter_ye:
    title: Е е
    gloss: der Buchstabe Je
    note: Wird am Wort- oder Silbenanfang ausgesprochen wie „je“ in „jetzt“. Sieht genauso aus wie das lateinische „E/e“, klingt aber ganz anders.
  ru.a1.unit01.lesson01.teach.hard_sign_note:
    title: 'ъ und ь: Härtezeichen und Weichheitszeichen'
    gloss: 'Das Härtezeichen ъ und das Weichheitszeichen ь haben keinen eigenen Laut: Sie verändern die Aussprache des benachbarten Buchstabens.'
    note: 'Diese beiden Zeichen stehen nie für einen eigenen Laut: ь macht den vorangehenden Konsonanten weich, ъ markiert eine harte Trennung zwischen Lauten. Beide begegnen Ihnen wieder, sobald echte Wörter sie enthalten.'
  ru.a1.unit01.lesson01.teach.letter_short_i:
    title: Й й
    gloss: der Buchstabe Kurzes I
    note: Wird ausgesprochen wie das „j“ in „Boje“, also als kurzer Gleitlaut und nicht als voller Vokal. Er steht in Здравствуйте, dem Wort, auf das diese Lektion hinarbeitet.
  ru.a1.unit01.lesson01.teach.zdravstvuyte_shape:
    title: Здравствуйте
    gloss: Guten Tag (förmlich)
    note: Die vollständige förmliche Begrüßung, gebildet aus den eben eingeführten Buchstaben. Sie wirkt lang und konsonantenlastig, aber jeder Buchstabe darin wurde in dieser Lektion bereits behandelt.
    example_gloss: Guten Tag! Ich heiße Viktor.
  ru.a1.unit01.lesson02.teach.zdravstvuyte_privet:
    title: Здравствуйте, Привет
    gloss: Guten Tag (förmlich); Hallo (informell)
    note: Здравствуйте ist die sichere, allgemeine förmliche Begrüßung zu jeder Tageszeit und gegenüber Fremden. Привет ist salopp und wird unter Freunden und Gleichaltrigen verwendet.
    example_gloss:
    - Guten Tag! Wie geht es Ihnen? (förmlich)
    - Hallo! Wie geht’s? (informell)
  ru.a1.unit01.lesson02.teach.dobroe_utro:
    title: Доброе утро!
    gloss: guten Morgen
    note: Wird am Morgen verwendet, etwa bis zum späten Vormittag.
  ru.a1.unit01.lesson02.teach.dobryy_den:
    title: Добрый день!
    gloss: guten Tag
    note: Die übliche Begrüßung tagsüber, vom späten Vormittag bis zum Nachmittag.
  ru.a1.unit01.lesson02.teach.dobryy_vecher:
    title: Добрый вечер!
    gloss: guten Abend
    note: Wird verwendet, wenn man abends irgendwo ankommt. Es ist eine Begrüßung, kein Abschied.
  ru.a1.unit01.lesson02.teach.register_note:
    title: Die passende Begrüßung wählen
    gloss: Здравствуйте passt zu jeder Tageszeit und im höflichen Umgang. Привет ist informell und wird unter Freunden verwendet.
    note: Wenn Sie unsicher sind, welche Tageszeit es ist oder mit wem Sie sprechen, ist Здравствуйте immer sicher. Привет ist Menschen vorbehalten, die Sie schon gut kennen.
  ru.a1.unit01.lesson03.teach.kak_dela:
    title: Как дела?
    gloss: Wie geht’s? (informell)
    note: Die alltägliche informelle Art zu fragen, wie es jemandem geht, unter Freunden und Gleichaltrigen.
  ru.a1.unit01.lesson03.teach.kak_pozhivaete:
    title: Как поживаете?
    gloss: Wie geht es Ihnen? (förmlich)
    note: Die förmliche Art zu fragen, wie es jemandem geht; sie passt zur вы-Anrede.
  ru.a1.unit01.lesson03.teach.horosho_spasibo:
    title: Хорошо, спасибо
    gloss: gut, danke
    note: Eine einfache, positive Antwort, die in beiden Registern passt.
    example_gloss: Wie geht’s? – Gut, danke.
  ru.a1.unit01.lesson03.teach.tak_sebe:
    title: Так себе
    gloss: es geht so
    note: Eine neutrale bis leicht negative Antwort, wenn es weder besonders gut noch schlecht läuft.
    example_gloss: Wie geht’s? – Es geht so.
  ru.a1.unit01.lesson03.teach.a_u_tebya:
    title: А у тебя?
    gloss: Und dir? (informell)
    note: Die informelle Art, die Frage an das Gegenüber zurückzugeben; sie passt zur ты-Anrede.
  ru.a1.unit01.lesson03.teach.do_svidaniya:
    title: До свидания!
    gloss: auf Wiedersehen (neutral/förmlich)
    note: Der übliche, allgemeine Abschied. Wörtlich bedeutet er etwa „bis zum Wiedersehen“.
  ru.a1.unit01.lesson03.teach.poka:
    title: Пока!
    gloss: tschüss (informell)
    note: Eine lockere, sehr häufige Art, sich unter Freunden und Bekannten zu verabschieden.
  ru.a1.unit01.lesson03.teach.do_zavtra:
    title: До завтра!
    gloss: bis morgen
    note: Ein freundlicher Abschied, wenn Sie die Person am nächsten Tag wiedersehen.
  ru.a1.unit01.lesson03.teach.anna:
    title: Anna begrüßt Maksim
    gloss: 'Anna sagt: Guten Tag! Wie geht’s?'
    note: Anna und Maksim sind Kollegen und begrüßen sich tagsüber. Durch дела ergibt sich ein vertrauter, informeller Ton.
  ru.a1.unit01.lesson03.teach.maksim_reply:
    title: Maksim antwortet und fragt zurück
    gloss: 'Maksim sagt: Gut, danke. Und dir?'
    note: Maksim antwortet und gibt die Frage informell zurück, passend zu Annas Register.
  ru.a1.unit01.lesson03.teach.anna_close:
    title: Anna beendet das Gespräch
    gloss: 'Anna sagt: Mir auch gut. Na dann, bis morgen!'
    note: Anna beendet den Smalltalk und geht zu einem freundlichen Abschied über.
  ru.a1.unit01.lesson03.teach.maksim_close:
    title: Maksim verabschiedet sich
    gloss: 'Maksim sagt: Bis morgen!'
    note: Maksim wiederholt Annas Abschied und beendet damit das Gespräch.
