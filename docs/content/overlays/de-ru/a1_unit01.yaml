course:
  title: Russisch A1
  description: Lernen Sie Russisch auf A1-Niveau für alltägliche Begrüßungen und kurze Gespräche, mit ausführlichen Erklärungen zum kyrillischen Alphabet und zum Unterschied zwischen der Anrede вы und ты.
