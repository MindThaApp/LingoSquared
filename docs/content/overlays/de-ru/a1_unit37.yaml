    title: Nina erfährt etwas über alle
    gloss: Nina ist neu im Sprachcafé. Sie fragt Dima, wie die anderen sind. Dima erzählt. Nastya ist freundlich und geduldig; sie arbeitet als Krankenschwester. Igor ist lustig und besucht einen Spanischkurs. Lena ist neugierig; sie lernt gern Neues kennen. Dima selbst ist ruhig.
