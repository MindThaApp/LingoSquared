    title: Wer fährt wie?
    gloss: Nastja fährt jeden Tag mit dem Zug zur Arbeit. Dima fährt normalerweise mit dem Rad, aber wenn es regnet, nimmt auch er den Zug. Igor fährt lieber mit dem Auto. Lena wohnt in der Nähe und geht zu Fuß zur Arbeit. Wie kommst du zur Arbeit?
    note: 'Ein Lesetext, der vier Arten, zur Arbeit zu kommen, und eine Bedingung (Regen) gegenüberstellt: *обычно ... но когда идёт дождь ...*.'
