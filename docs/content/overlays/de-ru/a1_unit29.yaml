    title: Идти und ехать
    gloss: 'Das Russische hat zwei Verben für „gehen“ und „fahren“: *идти* bedeutet zu Fuß gehen, *ехать* mit einem Fahrzeug fahren: *Я иду пешком, я еду на велосипеде.*'
