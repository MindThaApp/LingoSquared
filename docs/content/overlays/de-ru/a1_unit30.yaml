    title: Ich benutze mein Handy jeden Tag
    gloss: Ich benutze mein Handy jeden Tag.
    note: '*Каждый день* (jeden Tag) kommt wieder vor: *Я каждый день пользуюсь телефоном*. Nach *пользоваться* steht das Objekt im Instrumental.'
  ru.a1.unit30.lesson02.teach.prilozhenie:
    title: Die App
    gloss: die App
    example_gloss: Ich habe eine App für die Wettervorhersage.
  ru.a1.unit30.lesson02.teach.soobshchenie:
    title: Die Nachricht
    gloss: die Nachricht
    example_gloss: Ich schicke eine Nachricht über die App.
  ru.a1.unit30.lesson02.teach.prognoz_pogody_slovo:
    title: Прогноз погоды und сообщение
    gloss: '*Прогноз погоды* besteht aus zwei Wörtern; das zweite, *погоды*, steht im Genitiv. *Сообщение* ist eine Nachricht, die man senden oder lesen kann.'
    note: Verbindet das neue Wort mit dem bereits gelernten zusammengesetzten Nomen aus der Wetter-Lektion.
  ru.a1.unit30.lesson02.teach.nastya_otpravlyaet_soobshchenie:
    title: Nastja schickt eine Nachricht über die App
    gloss: Nastja schickt eine Nachricht über die App.
    note: '*Отправляет* (schickt) ist ein regelmäßiges Verb. Die Nachricht ist das Objekt im Akkusativ, und *через приложение* bedeutet „über die App“.'
  ru.a1.unit30.lesson02.teach.dima_chitaet_soobshchenie:
    title: Dima liest die Nachricht
    gloss: Dima liest die Nachricht.
  ru.a1.unit30.lesson03.teach.iskat:
    title: Nachschlagen
    gloss: nachschauen; suchen
    example_gloss: Ich schaue die Wettervorhersage nach.
  ru.a1.unit30.lesson03.teach.posle_polzovatsya_slovo:
    title: Пользоваться und искать
    gloss: '*Пользоваться* verlangt den Instrumental (*пользоваться телефоном*), *искать* dagegen den Akkusativ (*искать прогноз*).'
    note: 'Beide Verben sind regelmäßig: *я пользуюсь, ты пользуешься*; *я ищу, ты ищешь*.'
  ru.a1.unit30.lesson03.teach.igor_ishchet_prognoz:
    title: Igor sucht die Wettervorhersage
    gloss: Igor sucht die Wettervorhersage.
  ru.a1.unit30.lesson03.teach.potom_on_idyot:
    title: Danach geht er joggen
    gloss: Danach geht er joggen.
    note: '*Идёт бегать* heißt wörtlich „geht laufen“: *идёт* ist ein Bewegungsverb, gefolgt vom Infinitiv dessen, was er tun will.'
  ru.a1.unit30.lesson04.teach.nastya_davay_v:
    title: Nastja macht einen Vorschlag
    gloss: 'Nastja: Wollen wir am Samstag um zehn Sport machen?'
  ru.a1.unit30.lesson04.teach.dima_khoroshaya_ideya:
    title: Dima stimmt zu
    gloss: 'Dima: Gute Idee! Ich suche die Wettervorhersage.'
    note: '*Хорошая идея*: ein weibliches Adjektiv bei einem weiblichen Nomen. *Поищу* ist das perfektive Futur, „ich werde nachsehen“.'
  ru.a1.unit30.lesson04.teach.dima_v_subbotu:
    title: Dima prüft das Wetter
    gloss: 'Dima: Am Samstag scheint die Sonne!'
    note: '*Солнечно* ist das Wetterwort. Ein Verb für „sein“ ist nicht nötig: *В субботу солнечно*.'
  ru.a1.unit30.lesson04.teach.igor_ya_vizhu:
    title: Igor sieht die Nachricht
    gloss: 'Igor: Ich sehe die Nachricht. Bis Samstag!'
  ru.a1.unit30.lesson04.teach.ty_uzhe_znaesh:
    title: До mit Genitiv
    gloss: 'Sie kennen schon *До свидания!* Man kann auch einen Tag nennen: *До субботы!*, *До завтра!* Nach *до* steht das Nomen im Genitiv.'
    note: Überträgt das Verabschiedungsmuster aus der Begrüßungs-Lektion auf einen bestimmten Tag.
  ru.a1.unit30.lesson05.teach.nastya_kazhdyy_den:
    title: Wer nutzt was?
    gloss: Nastja ruft Dima jeden Tag an. Sie benutzt ihr Telefon, keine App. Dima hat zu Hause keinen Computer, aber er nutzt das Internet auf seinem Telefon. Igor sucht jeden Morgen die Wettervorhersage. Dann geht er joggen. Лена schickt Nastja oft eine Nachricht. Benutzen Sie auch jeden Tag Ihr Telefon?
    note: Vergleicht die Gewohnheiten aller vier Figuren mit Geräten, ähnlich wie der Vergleichstext in der Sport-Lektion.
    glosses:
      звонит: ruft an
      каждый: jeder
      день: Tag
      пользуется: benutzt
      телефоном: Handy
      приложением: App
      компьютера: Computer
      дома: zu Hause
      интернетом: Internet
      ищет: schaut nach
      утро: Morgen
      прогноз: Wettervorhersage
      идёт: geht
      бегать: Laufen
      отправляет: schickt
      часто: oft
      сообщение: Nachricht
      пользуешься: benutze
  ru.a1.unit30.lesson05.teach.igor_kazhdoe_utro:
    title: Igor sucht jeden Morgen die Vorhersage
    gloss: Igor sucht jeden Morgen die Wettervorhersage.
  ru.a1.unit30.lesson05.teach.lena_chasto_otpravlyaet:
    title: Лена schreibt Nastja oft
    gloss: Lena schickt Nastja oft eine Nachricht.
  ru.a1.unit30.lesson06.teach.nastya_ya_vizhu:
    title: Nastja bestätigt den Plan
    gloss: 'Nastja: Ich sehe die Nachricht. Wollen wir am Samstag um zehn Uhr im Park Sport machen?'
  ru.a1.unit30.lesson06.teach.dima_da_i:
    title: Dima bestätigt das Wetter
    gloss: 'Dima: Ja, und am Samstag ist es sonnig!'
  ru.a1.unit30.lesson06.teach.igor_ya_togda:
    title: Igors Plan
    gloss: 'Igor: Dann gehe ich laufen. Danach spiele ich noch Fußball.'
    note: '*Потом* (danach) stellt den zweiten Plan hinter den ersten, und *побегаю* ist perfektiv: „Ich laufe eine Weile“.'
  ru.a1.unit30.lesson06.teach.lena_ya_luchshe:
    title: Lenas Plan
    gloss: 'Lena: Ich schwimme lieber, aber ich komme auch in den Park.'
    note: '*Я лучше поплаваю* bedeutet „Ich schwimme lieber“. *Лучше* vor dem Verb drückt eine Vorliebe aus.'
  ru.a1.unit30.lesson06.teach.nastya_zdorovo_do:
    title: Nastja beendet das Gespräch
    gloss: 'Nastja: Toll! Bis Samstag im Park!'
    note: Schließt in einer Zeile den Nachrichtenverlauf dieser Lektion und den Plan aus der Sport-Lektion ab.
