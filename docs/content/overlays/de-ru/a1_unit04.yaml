teaching:
  ru.a1.unit04.lesson01.teach.kakoy_den:
    title: Какой сегодня день?
    gloss: Welcher Tag ist heute?
    note: Какой richtet sich nach dem maskulinen Nomen день („Tag“).
  ru.a1.unit04.lesson01.teach.ponedelnik_vtornik:
    title: понедельник, вторник
    gloss: Montag, Dienstag
    note: Wochentage schreibt man im Russischen klein, anders als im Deutschen, wo sie großgeschrieben werden.
    example_gloss:
    - Heute ist Montag.
    - Heute ist Dienstag.
  ru.a1.unit04.lesson01.teach.sreda_chetverg:
    title: среда, четверг
    gloss: Mittwoch, Donnerstag
    note: Wie alle russischen Wochentage werden среда und четверг kleingeschrieben – groß nur am Satzanfang.
    example_gloss:
    - Heute ist Mittwoch.
    - Heute ist Donnerstag.
  ru.a1.unit04.lesson01.teach.pyatnitsa_subbota:
    title: пятница, суббота
    gloss: Freitag, Samstag
    note: суббота hat ein doppeltes б – eine häufige Rechtschreibfalle.
    example_gloss:
    - Heute ist Freitag.
    - Heute ist Samstag.
  ru.a1.unit04.lesson01.teach.voskresenye:
    title: воскресенье
    gloss: Sonntag
    note: Der letzte Tag in der russischen Wochentagsliste.
    example_gloss: Heute ist Sonntag.
  ru.a1.unit04.lesson01.teach.segodnya:
    title: Сегодня ...
    gloss: Heute ist ...
    note: Сегодня plus Wochentag kommt ohne Verbindungsverb aus; im Russischen steht hier kein Verb für „ist“.
  ru.a1.unit04.lesson02.teach.kakoe_chislo:
    title: Какое сегодня число?
    gloss: Welches Datum ist heute?
    note: Какое richtet sich nach dem Neutrum число („Datum/Zahl“), anders als какой bei день oben.
  ru.a1.unit04.lesson02.teach.pervoe_tretye:
    title: первое, третье
    gloss: 1., 3.
    note: Datumsangaben mit Ordnungszahlen stehen im Neutrum (-ое/-ье), weil sie sich auf das mitgedachte Nomen число beziehen.
    example_gloss:
    - Heute ist der 1. Januar.
    - Heute ist der 3. Januar.
  ru.a1.unit04.lesson02.teach.pyatoe_desyatoe:
    title: пятое, десятое
    gloss: 5., 10.
    note: Dasselbe Neutrum-Muster der Ordnungszahlen wie bei первое/третье.
    example_gloss:
    - Heute ist der 5. Oktober.
    - Heute ist der 10. April.
  ru.a1.unit04.lesson02.teach.yanvar_aprel:
    title: января, апреля
    gloss: des Januars, des Aprils
    note: 'Nach dem Datum steht der Monatsname im Genitiv: Aus январь wird января und aus апрель wird апреля.'
    example_gloss:
    - Heute ist der 3. Januar.
    - Heute ist der 10. April.
  ru.a1.unit04.lesson02.teach.oktyabrya:
    title: октября
    gloss: des Oktobers
    note: 'Genitivform von октябрь, nach demselben Muster wie января/апреля: Der Monat steht nach dem Datum.'
    example_gloss: Heute ist der 5. Oktober.
  ru.a1.unit04.lesson03.teach.kakoe_segodnya_chislo:
    title: Какое сегодня число?
    gloss: Welches Datum ist heute?
    note: Die Standardfrage nach dem Datum.
  ru.a1.unit04.lesson03.teach.vo_vtornik:
    title: во вторник
    gloss: am Dienstag
    note: 'Die Präposition в wird vor вторник zu во, weil es sich leichter sprechen lässt; вторник selbst ändert sich hier nicht (weibliche Wochentage dagegen schon: в среду, в пятницу, в субботу).'
  ru.a1.unit04.lesson03.teach.vstrecha:
    title: встреча
    gloss: Treffen
    note: Ein gebräuchliches Nomen für ein geplantes Treffen oder einen Termin.
    example_gloss: Das Treffen ist am Dienstag.
  ru.a1.unit04.lesson03.teach.anna_kakoy_den:
    title: Anna fragt nach dem Tag
    gloss: 'Anna: Welcher Tag ist heute?'
    note: Anna eröffnet das Gespräch mit der Frage nach dem день aus Lektion 1.
  ru.a1.unit04.lesson03.teach.viktor_sreda:
    title: Viktor antwortet mit Wochentag und Datum
    gloss: 'Viktor: Heute ist Mittwoch, der 3. Januar.'
    note: 'Viktor nennt Wochentag und Datum zusammen und verwendet dabei die Genitivform des Monats: января.'
  ru.a1.unit04.lesson03.teach.anna_khorosho:
    title: Anna schlägt Dienstag vor
    gloss: 'Anna: Gut. Ist das Treffen am Dienstag?'
    note: Хорошо bestätigt Viktors Antwort, bevor Anna ihre Anschlussfrage stellt.
  ru.a1.unit04.lesson03.teach.viktor_da:
    title: Viktor bestätigt das Datum
    gloss: 'Viktor: Ja, am Dienstag, dem 9. Januar.'
    note: 'Да bestätigt, dann wiederholt Viktor Tag und Datum. Um zu sagen, AN welchem Datum etwas stattfindet, steht die Ordnungszahl selbst im Genitiv: девятого января („am 9. Januar“), vergleiche Сегодня девятое января („Heute ist der 9. Januar“).'
