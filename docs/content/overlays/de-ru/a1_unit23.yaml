    gloss: langsam
    note: медленно bedeutet „langsam“.
    example_gloss: Sprich bitte langsam.
  ru.a1.unit23.lesson02.teach.povtori:
    title: Повтори, пожалуйста.
    gloss: Wiederhole das bitte.
    note: Повтори ist informell (du-Form) und passt für einen Freund.
    example_gloss: Dima, wiederhole das bitte.
