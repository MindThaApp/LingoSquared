  ru.a1.unit23.lesson01.teach.allo_eto_dima:
    title: Алло, это Дима.
    gloss: Hallo, hier ist Dima.
    note: Алло sagt man, wenn man einen Anruf annimmt oder ein Telefongespräch beginnt.
    example_gloss: Hallo, Nastja? Hier ist Dima.
  ru.a1.unit23.lesson01.teach.govori:
    title: говори
    gloss: sprich
    note: говори ist eine informelle Aufforderung an eine einzelne Person (du-Form).
    example_gloss: Sprich langsam.
  ru.a1.unit23.lesson01.teach.medlenno:
