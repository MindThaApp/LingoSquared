  ru.a1.unit23.lesson03.teach.dima_allo_nastya:
    title: Dima beginnt den Anruf
    gloss: 'Dima: Hallo, Nastja? Hier ist Dima.'
    note: Dima nennt am Telefon deutlich seinen Namen.
  ru.a1.unit23.lesson03.teach.nastya_govori_medlenno:
    title: Nastja bittet ihn, langsam zu sprechen
    gloss: 'Nastja: Hallo, Dima. Sprich bitte langsam.'
    note: Говори медленно, пожалуйста bittet jemanden, langsam zu sprechen; Привет ist eine informelle Begrüßung unter Freunden.
  ru.a1.unit23.lesson03.teach.dima_vstrecha_sem:
