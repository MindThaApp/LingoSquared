teaching:
  ru.a1.unit10.lesson01.teach.kak_doyti:
    title: Как дойти до...?
    gloss: Wie komme ich zu...?
    note: Как дойти до...? ist die übliche höfliche Art, einen Fremden nach dem Weg zu einem Ort zu fragen; danach steht das Ziel im Genitiv.
  ru.a1.unit10.lesson01.teach.muzeya:
    title: музей
    gloss: Museum
    note: музей ist maskulin; музея ist die Genitivform, die nach до („bis / zu“) steht.
    example_gloss: Wie komme ich zum Museum?
  ru.a1.unit10.lesson01.teach.pryamo:
    title: прямо
    gloss: geradeaus
    note: прямо bedeutet geradeaus; Идите ist die höfliche Aufforderungsform von „gehen“.
    example_gloss: Gehen Sie geradeaus.
  ru.a1.unit10.lesson01.teach.napravo:
    title: направо
    gloss: nach rechts
    note: направо gibt die Bewegungsrichtung an (nach rechts abbiegen); потом bedeutet „dann“.
    example_gloss: Gehen Sie geradeaus, dann nach rechts.
  ru.a1.unit10.lesson02.teach.nalevo:
    title: налево
    gloss: nach links
    note: налево gibt die Bewegungsrichtung an, das Gegenstück zu направо.
    example_gloss: Biegen Sie links ab.
  ru.a1.unit10.lesson02.teach.povernite:
    title: поверните
    gloss: biegen Sie ab (höfliche Aufforderung)
    note: поверните ist der höfliche Imperativ von повернуть („abbiegen“); за углом bedeutet „um die Ecke“.
    example_gloss: Biegen Sie um die Ecke links ab.
  ru.a1.unit10.lesson02.teach.kvartal_daleko:
    title: квартал, далеко
    gloss: Block, weit
    note: квартал ist ein Stadtblock (квартала nach два); далеко bedeutet „weit“, und отсюда bedeutet „von hier“.
    example_gloss:
    - Gehen Sie zwei Blocks weiter.
    - Ist das weit von hier?
  ru.a1.unit10.lesson03.teach.tourist_prostite:
    title: Der Tourist fragt nach dem Weg
    gloss: 'Tourist: Entschuldigung, wie komme ich zum Museum?'
    note: Турист beginnt mit Простите („Entschuldigung“), bevor er Как дойти до музея? fragt.
  ru.a1.unit10.lesson03.teach.prokhozhiy_eto_prosto:
    title: Der Passant erklärt den Weg
    gloss: 'Passant: Das ist ganz einfach. Gehen Sie zwei Blocks geradeaus, dann biegen Sie rechts ab.'
    note: Прохожий antwortet mit Это очень просто und gibt dann eine Wegbeschreibung in zwei Schritten mit Идите und поверните.
  ru.a1.unit10.lesson03.teach.tourist_daleko:
    title: Der Tourist fragt, ob es weit ist
    gloss: 'Tourist: Ist das weit von hier?'
    note: Это далеко отсюда? ist eine Nachfrage zur Entfernung zu Fuß.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pyat_minut:
    title: Der Passant schätzt die Zeit
    gloss: 'Passant: Nein, fünf Minuten zu Fuß.'
    note: Прохожий antwortet mit Нет, пять минут пешком („zu Fuß“).
  ru.a1.unit10.lesson03.teach.tourist_spasibo:
    title: Der Tourist bedankt sich beim Passanten
    gloss: 'Tourist: Vielen Dank.'
    note: Спасибо большое beendet das Gespräch höflich.
  ru.a1.unit10.lesson03.teach.prokhozhiy_pozhaluysta:
    title: Der Passant antwortet
    gloss: 'Passant: Bitte.'
    note: Пожалуйста ist die Antwort auf спасибо und bedeutet „Bitte“ / „gern geschehen“.
