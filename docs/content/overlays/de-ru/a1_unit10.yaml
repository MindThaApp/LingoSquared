  description: Lernen Sie Russisch auf A1-Niveau, um nach dem Weg zu einem nahe gelegenen Ort zu fragen und kurze Wegbeschreibungen zu verstehen – mit ausführlichen deutschen Erklärungen zu Wortschatz, Wendungen und Dialogen.
