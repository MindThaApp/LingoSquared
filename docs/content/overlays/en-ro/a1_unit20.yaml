generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit20_clothing.yaml for full detail.
    This unit's source PDF (US Peace Corps Moldova's "Basic Romanian
    Language Lessons") was checked for clothing-shopping material and
    found NO dedicated clothing lesson anywhere in its 785-line
    extraction. Only "tricou" (t-shirt) is source-confirmed, from Lesson
    8's Definite Articles vocabulary list. "Culoare," "roșu," "albastru,"
    "pantaloni," and "mărime" are all authored fresh from general
    standard Romanian knowledge (ordinary, high-frequency A1 clothing/
    shopping words), disclosed honestly rather than overstated as
    source-confirmed. Glosses/notes here are freshly authored to explain
    the target-language forms to an English speaker.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Twentieth Romanian overlay, first draft, authored alongside the
    paired realization. correct_response/accepted_answers shapes were
    checked to match the realization's word_bank/pairs (including exact
    token-multiset agreement for both word_order exercises and the one
