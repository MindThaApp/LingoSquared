    compiler check.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked glosses, notes, example_glosses (6/6 correct), instructions,
    accepted answers and option parallelism. Fixes:
    lesson02.teach.cat_costa_pantalonii_phrase note (false claim that
    *tricoul* takes -i; now explains masculine plural -i definite
    article); lesson02.teach.reminder_cat_costa_va_rog note
    (self-contradictory unit attribution removed);
    lesson01.teach.vreau_tricou_rosu_phrase,
    lesson03.teach.line01/line02/line03/line05/line06/line07/line08
    notes (course-construction meta rewritten as real language points);
    lesson01.teach.reminder_vreau_un_ce,
    lesson02.teach.reminder_mic_mica_mare,
    lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si,
    lesson03.teach.reminder_zece_douazeci_de_lei notes and
    lesson03.exercise06 feedback (internal unit-number references
