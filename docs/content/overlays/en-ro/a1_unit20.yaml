    Second-pass review 2026-10-19: 3 fixes - answer_policy.diacritics
    corrected; lesson01.exercise03 listen_select distractor 'Vreau
    pantaloni' (pantaloni untaught until lesson02) -> 'Ce culoare';
    course description 'at his shop counter' -> 'at a shop counter'
    (unit17 canon: Mihai is an engineer). NATIVE FLAGS: none.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with
    comma-below ș/ț. Free-typed answers are graded against these
    standard spellings: the grader does not fold away omitted
    diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should
    type the full standard spelling.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    This unit's own new vocabulary (tricou, culoare, roșu, albastru,
    pantaloni, mărime) is used only in invariant or elliptical
    constructions ("Vreau un tricou roșu," "Ce mărime?," "Mărime mică,
    vă rog," "Pantalonii costă douăzeci de lei") with no register
    distinction of its own. No new tu/dumneavoastră form is introduced
    this unit; Ana and Mihai keep their existing formal register with
    each other (reused "vă rog," not "te rog").

course:
  title: "Romanian A1"
  description: >-
    Identifying and buying clothing in Romanian -- Tricou (t-shirt),
    Culoare (color), Roșu (red), Albastru (blue), Pantaloni (pants), and
    Mărime (size) -- as Ana asks Mihai for a red t-shirt and a pair of
    pants at a shop counter.

units:
  ro.a1.unit20.clothing:
    title: "Clothing"

lessons:
  ro.a1.unit20.lesson01.un_tricou_rosu:
    title: "A red t-shirt"
  ro.a1.unit20.lesson02.ce_marime:
    title: "What size?"
  ro.a1.unit20.lesson03.la_magazin:
    title: "At the shop"

teaching:
  ro.a1.unit20.lesson01.teach.reminder_vreau_un_ce:
    title: "Reminder: Vreau, Un, Ce"
    gloss: "Vreau (I want) · Un (a/an, masc./neut.) · Ce (what)"
    note: "*Vreau* (I want), *un* (a/an) and *ce* (what, as in *Ce mai faceți?*) are words you already know -- reused here to ask for a clothing item."

  ro.a1.unit20.lesson01.teach.tricou_vocab:
    title: "T-shirt"
    gloss: "Tricou (t-shirt)"
    note: "A neuter noun -- takes the same *un* (not *o*) as other neuter/masculine nouns already seen, like *un leu*."
    example_gloss:
      - "I want a t-shirt."

  ro.a1.unit20.lesson01.teach.culoare_vocab:
    title: "Color"
    gloss: "Culoare (color)"
    note: "A feminine noun, useful for asking what color something comes in."
    example_gloss:
      - "What color?"

  ro.a1.unit20.lesson01.teach.rosu_vocab:
    title: "Red"
    gloss: "Roșu (red)"
    note: "Follows the noun it describes, the normal Romanian adjective order: *tricou roșu*, literally 'shirt red.'"
    example_gloss:
      - "I want a red t-shirt."

  ro.a1.unit20.lesson01.teach.albastru_vocab:
    title: "Blue"
    gloss: "Albastru (blue)"
    note: "Same pattern as *roșu* -- placed after the noun: *tricou albastru*."
    example_gloss:
      - "I want a blue t-shirt."

  ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase:
    title: "I want a red t-shirt."
    gloss: "Vreau un tricou roșu."
    note: "The core request: *vreau* (I want) + *un tricou* (a t-shirt) + *roșu* (red), with the color after the noun."

  ro.a1.unit20.lesson02.teach.reminder_cat_costa_va_rog:
    title: "Reminder: Cât, Costă, Vă, Rog"
    gloss: "Cât costă? (How much does it cost?) · Vă rog (please, formal)"
    note: "*Cât costă?* is from the market lesson; *vă rog* is the formal 'please' -- reused here to ask the price of a clothing item and soften the request."

  ro.a1.unit20.lesson02.teach.reminder_mic_mica_mare:
    title: "Reminder: Mic, Mică, Mare"
    gloss: "Mic/Mică (small, masc.-neut./fem.) · Mare (large, same form for masc. and fem. singular)"
    note: "The size words you already know from comparing food and drink -- reused here for clothing sizes."

  ro.a1.unit20.lesson02.teach.pantaloni_vocab:
    title: "Pants"
    gloss: "Pantaloni (pants)"
    note: "Normally used in the plural in Romanian, just like English 'pants' -- *pantaloni* means one pair of pants."
    example_gloss:
      - "I want pants."

  ro.a1.unit20.lesson02.teach.marime_vocab:
    title: "Size"
    gloss: "Mărime (size)"
    note: "A feminine noun -- pairs with the feminine *mică* (small) already reminded above, and the invariant *mare* (large)."
    example_gloss:
      - "What size?"

  ro.a1.unit20.lesson02.teach.ce_marime_phrase:
    title: "What size?"
    gloss: "Ce mărime? (What size?)"
    note: "The everyday shop-counter question -- short and verb-free, the same elliptical shape as *Ce culoare?* (What color?)."

  ro.a1.unit20.lesson02.teach.marime_mica_va_rog_phrase:
    title: "Small size, please."
    gloss: "Mărime mică, vă rog."
    note: "*Mică* is the feminine form of *mic*, agreeing with feminine *mărime* -- combined with the reminded *vă rog* to state your size politely."

  ro.a1.unit20.lesson02.teach.cat_costa_pantalonii_phrase:
    title: "How much do the pants cost?"
    gloss: "Cât costă pantalonii? (How much do the pants cost?)"
    note: "*Pantalonii* is the definite form of *pantaloni* ('the pants') -- masculine plural nouns add *-i* for 'the' (*pantaloni* → *pantalonii*). Combined with the reminded *cât costă*."

  ro.a1.unit20.lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si:
    title: "Reminder: Bună, Mulțumesc, Bine, La revedere, Și"
    gloss: "Bună (hi) · Mulțumesc (thank you) · Bine (good/fine) · La revedere (goodbye) · Și (and)"
    note: "Everyday greetings plus *și* (and), reused here to open and close the shop dialogue."

  ro.a1.unit20.lesson03.teach.reminder_zece_douazeci_de_lei:
    title: "Reminder: Zece, Douăzeci, De, Lei"
    gloss: "Zece (ten) · Douăzeci (twenty) · De (of, used before lei at 20+) · Lei (currency, plural of leu)"
    note: "Numbers and the currency *leu/lei* you already know -- reused here for the t-shirt's and pants' prices."

  ro.a1.unit20.lesson03.teach.line01:
    title: "Greet Mihai and ask for a red t-shirt"
    gloss: "Ana greets Mihai and says she wants a red t-shirt."
    note: "The request phrase from the first lesson: *Vreau un tricou roșu.*"

  ro.a1.unit20.lesson03.teach.line02:
    title: "Ask what size"
    gloss: "Mihai asks what size she wants."
    note: "The everyday shop question *Ce mărime?* (What size?)."

  ro.a1.unit20.lesson03.teach.line03:
    title: "State the size, politely, and ask the price"
    gloss: "Ana asks for a small size, then asks how much it costs."
    note: "*Mărime mică, vă rog* (small size, please), then *Cât costă?* (How much is it?)."

  ro.a1.unit20.lesson03.teach.line04:
    title: "Give the price"
    gloss: "Mihai says it costs ten lei."
    note: "Uses the reminded *zece lei*."

  ro.a1.unit20.lesson03.teach.line05:
    title: "Agree, and ask about pants too"
    gloss: "Ana agrees, then says she also wants pants and asks their price."
    note: "*Și* here means 'too/also': *Vreau și pantaloni* -- 'I want pants too.'"

  ro.a1.unit20.lesson03.teach.line06:
    title: "Give the pants' price"
    gloss: "Mihai says the pants cost twenty lei."
    note: "From twenty upward, Romanian puts *de* between the number and the noun: *douăzeci de lei*."

  ro.a1.unit20.lesson03.teach.line07:
    title: "Thank Mihai and say goodbye"
    gloss: "Ana thanks him and says goodbye."
    note: "A polite thank-you and goodbye."

  ro.a1.unit20.lesson03.teach.line08:
    title: "Say goodbye"
    gloss: "Mihai says goodbye."
    note: "A simple goodbye, adding Ana's name."

exercises:
  ro.a1.unit20.lesson01.exercise01.choose_tricou:
    instruction: "Which word means 't-shirt'?"
    correct_option: "Tricou"
    distractors: ["Culoare", "Roșu"]
    accepted_answers: ["Tricou"]

  ro.a1.unit20.lesson01.exercise02.choose_rosu:
    instruction: "Which word means 'red'?"
    correct_option: "Roșu"
    distractors: ["Albastru", "Tricou"]
    accepted_answers: ["Roșu"]

  ro.a1.unit20.lesson01.exercise03.listen_vreau_tricou_rosu:
    instruction: "Listen and select what you hear."
    correct_option: "Vreau un tricou roșu"
    distractors: ["Vreau un tricou albastru", "Ce culoare"]
    accepted_answers: ["Vreau un tricou roșu"]

  ro.a1.unit20.lesson01.exercise04.match_clothing1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Tricou": "t-shirt"
      "Culoare": "color"
      "Roșu": "red"
      "Albastru": "blue"
      "Vreau": "I want"
      "Un": "a / an"
      "Vreau un tricou roșu.": "I want a red t-shirt."
      "Ce culoare?": "What color?"

  ro.a1.unit20.lesson01.exercise05.order_vreau_tricou_rosu:
    instruction: "Build the sentence: I want a red t-shirt."
    correct_response: ["Vreau", "un", "tricou", "roșu"]

  ro.a1.unit20.lesson01.exercise06.listen_order_ce_culoare:
    instruction: "Listen, then put the words in order."
    correct_response: ["Ce", "culoare"]

  ro.a1.unit20.lesson01.exercise07.complete_vreau_tricou_rosu:
    instruction: "Complete the sentence: I want a red t-shirt."
    accepted_answers: ["roșu", "Roșu"]
    feedback: "Vreau un tricou *roșu* -- *roșu* is the word for 'red,' placed after the noun it describes."

  ro.a1.unit20.lesson01.exercise08.speak_vreau_tricou_albastru:
    instruction: "Say aloud: I want a blue t-shirt."
    accepted_answers:
      - "Vreau un tricou albastru."
      - "Vreau un tricou albastru"

  ro.a1.unit20.lesson02.exercise01.choose_pantaloni:
    instruction: "Which word means 'pants'?"
    correct_option: "Pantaloni"
    distractors: ["Mărime", "Mare"]
    accepted_answers: ["Pantaloni"]

  ro.a1.unit20.lesson02.exercise02.choose_marime:
    instruction: "Which word means 'size'?"
    correct_option: "Mărime"
    distractors: ["Pantaloni", "Mică"]
    accepted_answers: ["Mărime"]

  ro.a1.unit20.lesson02.exercise03.listen_ce_marime:
    instruction: "Listen and select what you hear."
    correct_option: "Ce mărime"
    distractors: ["Cât costă", "Vreau pantaloni"]
    accepted_answers: ["Ce mărime"]

  ro.a1.unit20.lesson02.exercise04.match_clothing2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Pantaloni": "pants"
      "Mărime": "size"
      "Mică": "small"
      "Mare": "large"
      "Ce mărime?": "What size?"
      "Mărime mică, vă rog.": "Small size, please."
      "Cât costă pantalonii?": "How much do the pants cost?"
      "Vreau pantaloni.": "I want pants."

  ro.a1.unit20.lesson02.exercise05.order_cat_costa_pantalonii:
    instruction: "Build the sentence: How much do the pants cost?"
    correct_response: ["Cât", "costă", "pantalonii"]

  ro.a1.unit20.lesson02.exercise06.listen_order_marime_mica_va_rog:
    instruction: "Listen, then put the words in order."
    correct_response: ["Mărime", "mică", "vă", "rog"]

  ro.a1.unit20.lesson02.exercise07.complete_ce_marime:
    instruction: "Complete the question: What size?"
    accepted_answers: ["mărime", "Mărime"]
    feedback: "Ce *mărime*? -- *mărime* is the word for 'size,' the same shop-counter question just taught."

  ro.a1.unit20.lesson02.exercise08.speak_cat_costa_pantalonii:
    instruction: "Say aloud: How much do the pants cost?"
    accepted_answers:
      - "Cât costă pantalonii?"
      - "Cât costă pantalonii"

  ro.a1.unit20.lesson03.exercise01.choose_who_says_line04:
    instruction: "Who says this line?"
    correct_option: "Mihai"
    distractors: ["Ana"]
    accepted_answers: ["Mihai"]

  ro.a1.unit20.lesson03.exercise02.dialogue_comprehend_tricou_price:
    instruction: "Listen to the dialogue. How much does the t-shirt cost?"
    correct_option: "Zece lei."
    distractors: ["Cincisprezece lei."]
    accepted_answers: ["Zece lei."]

  ro.a1.unit20.lesson03.exercise03.reading_comprehend_label:
    instruction: "Read the label. What size is the t-shirt?"
    correct_option: "Mare."
    distractors:
      - "Mică."
      - "Albastru."
    accepted_answers:
      - "Mare."

  ro.a1.unit20.lesson03.exercise04.match_unit_review:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Tricou": "t-shirt"
      "Pantaloni": "pants"
      "Culoare": "color"
      "Roșu": "red"
      "Albastru": "blue"
      "Mărime": "size"
      "Mică": "small"
      "Mare": "large"
      "Cât costă?": "How much does it cost?"
      "Vreau": "I want"

  ro.a1.unit20.lesson03.exercise05.order_vreau_si_pantaloni:
    instruction: "Build the sentence: I want pants too."
    correct_response: ["Vreau", "și", "pantaloni"]

  ro.a1.unit20.lesson03.exercise06.complete_costa_pantalonii:
    instruction: "Complete the sentence: The pants cost twenty lei."
    accepted_answers: ["lei", "Lei"]
    feedback: "Pantalonii costă douăzeci de *lei* -- *lei* is the plural of *leu*, the Romanian currency."

  ro.a1.unit20.lesson03.exercise07.respond_as_mihai:
    instruction: "Take Mihai's role. Ana asks 'Cât costă pantalonii?' -- tell her they cost twenty lei."
    accepted_answers:
      - "Pantalonii costă douăzeci de lei."
      - "Costă douăzeci de lei."
      - "Douăzeci de lei."

  ro.a1.unit20.lesson03.exercise08.speak_closing_magazin:
    instruction: "Say aloud: Thank you! Goodbye!"
    accepted_answers:
      - "Mulțumesc! La revedere!"
      - "Mulțumesc, la revedere!"

  ro.a1.unit20.lesson03.exercise09.write_clothing_request:
    instruction: "Write in Romanian: I want a red t-shirt, small size."
    accepted_answers:
      - "Vreau un tricou roșu, mărime mică."
      - "Vreau un tricou roșu. Mărime mică."
      - "Vreau un tricou roșu, mărime mică, vă rog."
      - "Vreau un tricou roșu. Mărime mică, vă rog."

  ro.a1.unit20.lesson02.exercise09.dictation_ce_marime:
    instruction: "Type what you hear."
    correct_option: "Ce mărime"
    accepted_answers: [{value: "Ce mărime", status: correct}]
    orthography_strict: true
