exercises:
  ro.c1.unit02.sens_implicit.lesson01.exercise01.recognize_ezitare:
    instruction: "Which Romanian phrase indirectly signals hesitation?"
    correct_option: "Nu e chiar simplu"
    distractors: ["În concluzie", "Pe de altă parte", "Cu siguranță aprobăm"]
    accepted_answers: [{value: "Nu e chiar simplu", status: correct}]
    feedback: "*Nu e chiar simplu* avoids a direct no but signals hesitation."
  ro.c1.unit02.sens_implicit.lesson01.exercise02.listen_ezitare:
    instruction: "Listen and select what the sentence implies."
    correct_option: "The speaker is hesitant about approving the change today."
    distractors: ["The speaker has already approved the change.", "The speaker says the file is missing.", "The speaker is changing the subject."]
    accepted_answers: [{value: "The speaker is hesitant about approving the change today.", status: correct}]
    feedback: "The phrase signals hesitation, not approval."
  ro.c1.unit02.sens_implicit.lesson01.exercise03.match_ezitare:
    instruction: "Match each Romanian phrase to its English meaning."
    accepted_answers:
      - value: {"Nu e chiar simplu": "It is not exactly simple", "să aprobăm": "to approve", "schimbarea astăzi": "the change today", "dosarul pare complet": "the file seems complete", "tonul ei": "her tone", "sugerează rezerve": "suggests reservations"}
        status: correct
    feedback: "These phrases separate surface meaning from implied meaning."
  ro.c1.unit02.sens_implicit.lesson01.exercise04.dictation_ezitare:
    instruction: "Type exactly what you hear."
    correct_response: "Nu e chiar simplu să aprobăm schimbarea astăzi."
    orthography_strict: true
    feedback: "Nu e chiar simplu să aprobăm schimbarea astăzi."
  ro.c1.unit02.sens_implicit.lesson02.exercise01.recognize_refuz:
    instruction: "Which phrase politely avoids immediate approval?"
    correct_option: "ar fi prudent să mai verificăm cifrele"
    distractors: ["aprobăm imediat schimbarea", "dosarul este semnat", "nu există nicio rezervă"]
    accepted_answers: [{value: "ar fi prudent să mai verificăm cifrele", status: correct}]
    feedback: "*Ar fi prudent să mai verificăm cifrele* implies delay."
  ro.c1.unit02.sens_implicit.lesson02.exercise02.order_prudent:
    instruction: "Put the Romanian words in order."
    accepted_answers: [{value: "ar fi prudent să mai verificăm cifrele", status: correct}]
    feedback: "ar fi prudent să mai verificăm cifrele."
