  ro.c1.unit02.sens_implicit.lesson03.exercise01.recognize_subtext:
    instruction: "Which phrase names meaning below the surface?"
    correct_option: "În subtext"
    distractors: ["Pe de o parte", "În concluzie", "Fără documente"]
    accepted_answers: [{value: "În subtext", status: correct}]
    feedback: "*În subtext* means in the subtext."
  ro.c1.unit02.sens_implicit.lesson03.exercise02.match_subtext:
    instruction: "Match each Romanian phrase to its English meaning."
