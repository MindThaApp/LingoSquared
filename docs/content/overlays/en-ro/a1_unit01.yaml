schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit01_greetings.yaml for full detail.
    Glosses/notes here are freshly authored to explain the target-language
    forms to an English speaker; the underlying Romanian phrases trace to
    US Peace Corps Moldova's public-domain "Basic Romanian Language
    Lessons," respelled to standard Romanian orthography.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    First Romanian overlay, first draft, authored alongside the paired
    realization. Needs the same fresh-context review before import.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț). For
    free-typed A1 answers, accept otherwise-correct forms with the
    diacritics omitted or with the legacy cedilla variants ş/ţ substituted
    for ș/ț (a real, still-common typing/font variation, not an error).
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    exclamation mark on greetings/farewells. Spoken answers are assessed
    for intelligibility and appropriate register, not written punctuation.
  register: >-
    tu and dumneavoastră are never interchangeable answers for each
    other's exercises -- a dumneavoastră-register prompt must not accept
    a tu-conjugated reply and vice versa, the same discipline applied to
    French tu/vous and Spanish tú/usted elsewhere in this app.

course:
  title: "Romanian A1"
  description: >-
    Learn standard Romanian greetings and first-meeting introductions.
    Guidance addresses the contrast English speakers need most at this
    stage: the informal tu versus the polite dumneavoastră, and Romanian's
    two everyday ways to give your name (mă numesc.../mă cheamă...).

units:
  ro.a1.unit01.greetings:
    title: "Greetings and first meetings"

lessons:
  ro.a1.unit01.lesson01.tu_dumneavoastra_greetings:
    title: "Greetings: tu and dumneavoastră"
  ro.a1.unit01.lesson02.names_introductions:
    title: "What's your name?"
  ro.a1.unit01.lesson03.street_meeting:
    title: "A meeting on the street"

teaching:
  ro.a1.unit01.lesson01.teach.buna:
    title: "Everyday greeting"
    gloss: "hi; hello"
    note: >-
      Bună is the everyday, mildly informal greeting, safe with friends,
      peers, and most casual daytime encounters.
    example_gloss: "Hi, Mihai!"

  ro.a1.unit01.lesson01.teach.salut:
    title: "Informal greeting"
    gloss: "hi; bye"
    note: >-
      Salut is informal, used between friends and peers. Like French
      salut, it can open or close an exchange, but it is not the safest
      first choice with an unfamiliar adult.
    example_gloss: "Hi, Ana!"

  ro.a1.unit01.lesson01.teach.buna_ziua:
    title: "Formal greeting"
    gloss: "good day; hello (formal)"
    note: >-
      Bună ziua is the safe, polite greeting for an unfamiliar adult,
      a shopkeeper, or anyone you would address with dumneavoastră.
      Literally good day, but used as a general polite hello, not just
      at midday.
    example_gloss: "Good day, Ana!"

  ro.a1.unit01.lesson01.teach.la_revedere:
    title: "Neutral farewell"
    gloss: "goodbye"
    note: "La revedere works in both polite and informal situations, the same way au revoir does in French."
    example_gloss: "Good day! Goodbye!"

  ro.a1.unit01.lesson01.teach.tu:
    title: "Informal singular you"
    gloss: "you, informal singular"
    note: >-
      English you does not reveal social distance. Romanian tu addresses
      one friend, child, or person in an explicitly informal relationship,
      and it takes its own verb forms (faci, not faceți).

  ro.a1.unit01.lesson01.teach.dumneavoastra:
    title: "Polite or plural you"
    gloss: "you, polite singular or plural"
    note: >-
      Dumneavoastră is the safe choice for one unfamiliar adult and also
      works for any group -- the same role vous plays in French or usted
      in Spanish, even though it is etymologically its own word (from
      domnia voastră, your lordship) rather than a repurposed plural.

  ro.a1.unit01.lesson01.teach.ce_mai_faceti:
    title: "Formal wellbeing question"
    gloss: "How are you?"
    note: >-
      Faceți is the dumneavoastră form of a face (to do/make). This is a
      conventional polite question, not a literal enquiry about what
      someone is doing.

  ro.a1.unit01.lesson01.teach.ce_mai_faci:
    title: "Informal wellbeing question"
    gloss: "How are you?"
    note: >-
      Faci is the tu form of a face. Only the verb ending changes between
      the polite and informal versions of this question -- ce mai stays
      the same either way.

  ro.a1.unit01.lesson01.teach.bine_multumesc:
    title: "Standard positive reply"
    gloss: "Fine, thank you."
    note: "Bine, mulțumesc answers ce mai faci/faceți regardless of register -- the reply itself doesn't change."
    example_gloss: "How are you? Fine, thank you."

  ro.a1.unit01.lesson01.teach.register_choice:
    title: "Match greeting and relationship"
    gloss: "Bună ziua with dumneavoastră; Salut with tu"
    note: >-
      Useful defaults, not absolute laws. Bună ziua can also open a
      formal exchange that then continues in dumneavoastră; pairing Salut
      with dumneavoastră usually sends conflicting social signals.

  ro.a1.unit01.lesson02.teach.ma_numesc:
    title: "Give your name (standard)"
    gloss: "My name is Ana."
    note: >-
      Mă numesc literally means I name myself -- the neutral, works-
      anywhere way to give your name, similar in register to English My
      name is.
    example_gloss: "Hi! My name is Ana."

  ro.a1.unit01.lesson02.teach.cum_va_numiti:
    title: "Ask a name politely"
    gloss: "What is your name?"
    note: >-
      Numiți is the dumneavoastră form of a se numi (to be named). Vă is
      the reflexive pronoun matching dumneavoastră, required here the way
      Comment vous appelez-vous needs vous twice in French.

  ro.a1.unit01.lesson02.teach.ma_cheama:
    title: "Give your name (conversational)"
    gloss: "I'm called Mihai."
    note: >-
      Mă cheamă is the more conversational way to give a name, literally
      it calls me. Mă numesc and mă cheamă are both correct and common;
      mă cheamă is slightly more casual.
    example_gloss: "Hi! I'm called Mihai."

  ro.a1.unit01.lesson02.teach.cum_te_cheama:
    title: "Ask a name informally"
    gloss: "What's your name?"
    note: >-
      Te is the reflexive pronoun matching tu. This is the everyday way
      friends and peers ask each other's names.

  ro.a1.unit01.lesson02.teach.imi_pare_bine:
    title: "Meeting someone"
    gloss: "Nice to meet you!"
    note: >-
      Îmi pare bine literally means it seems good to me -- an idiomatic
      fixed expression, not a word-for-word translation of English nice.
      Unlike French enchanté(e), it does not change form for the
      speaker's gender.
    example_gloss: "I'm called Mihai. Nice to meet you!"

  ro.a1.unit01.lesson02.teach.si_mie_imi_pare_bine:
    title: "Return the sentiment"
    gloss: "Nice to meet you too!"
    note: "Și mie adds too/likewise to the front of the same fixed expression used to open the exchange."

  ro.a1.unit01.lesson02.teach.si_dumneavoastra:
    title: "Return a polite question"
    gloss: "And you?"
    note: "Use dumneavoastră to maintain the polite register or to address a group."

  ro.a1.unit01.lesson02.teach.si_tu:
    title: "Return an informal question"
    gloss: "And you?"
    note: "Use tu after și when speaking to one friend or peer informally."

  ro.a1.unit01.lesson03.teach.line01:
    title: "Open the encounter"
    gloss: "Ana greets Mihai formally and gives her name."
    note: "Ana opens with the polite bună ziua, appropriate for meeting someone she doesn't know."
  ro.a1.unit01.lesson03.teach.line02:
    title: "Open the encounter, reply"
    gloss: "Mihai returns the sentiment, gives his name, and asks how she is."
    note: "Mihai keeps the same polite register Ana opened with -- he asks ce mai faceți, not ce mai faci."

  ro.a1.unit01.lesson03.teach.line03:
    title: "Answer and return the question"
    gloss: "Ana says she's fine and asks Mihai the same question, politely."
    note: "Și dumneavoastră keeps the exchange formal, matching how it began."
  ro.a1.unit01.lesson03.teach.line04:
    title: "Answer and close"
    gloss: "Mihai says he's fine too and says goodbye."
    note: "La revedere is the neutral farewell, fitting whether an exchange was formal or informal."

  ro.a1.unit01.lesson03.teach.line05:
    title: "Close the encounter"
    gloss: "Ana echoes the same farewell."
    note: "Repeating la revedere back is the natural way to confirm a friendly close."

exercises:
  ro.a1.unit01.lesson01.exercise01.listen_buna:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Bună!"
    distractors: ["Salut!", "La revedere!"]
    accepted_answers: ["Bună!", "Bună"]

  ro.a1.unit01.lesson01.exercise02.choose_informal_pronoun:
    instruction: "Which pronoun matches this informal greeting?"
    correct_option: "tu"
    distractors: ["dumneavoastră", "voi"]
    accepted_answers: ["tu"]
    feedback: "Salut and tu form a consistent informal combination."

  ro.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: "Put the polite wellbeing question in order."
    correct_response: ["Ce", "mai", "faceți"]

  ro.a1.unit01.lesson01.exercise06.match_register:
    instruction: "Match each greeting with its usual beginner-level register."
    correct_response:
      "Bună ziua": "dumneavoastră"
      "Salut": "tu"

  ro.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: "Complete the greeting for one unfamiliar adult."
    accepted_answers: ["dumneavoastră"]
    feedback: "Dumneavoastră is the safe respectful choice with an unfamiliar adult."

  ro.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: "Type the informal question you hear."
    accepted_answers:
      - "Ce mai faci?"
      - "Ce mai faci"

  ro.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: "Complete the neutral farewell."
    accepted_answers: ["revedere"]

  ro.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: "Use a polite greeting, ask how the person is, and close the exchange."
    accepted_answers:
      - "Bună ziua. Ce mai faceți? La revedere."
      - "Bună ziua, ce mai faceți? La revedere."

  ro.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: "Listen and select the polite name question."
    correct_option: "Cum vă numiți?"
    distractors:
      - "Cum te cheamă?"
      - "Ce mai faceți?"
    accepted_answers:
      - "Cum vă numiți?"
      - "Cum va numiti?"

  ro.a1.unit01.lesson02.exercise05.choose_reply_meaning:
    instruction: "What does Mihai's reply mean?"
    correct_option: "Nice to meet you!"
    distractors:
      - "Goodbye!"
      - "How are you?"
    accepted_answers: ["Nice to meet you!"]

  ro.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: "Build Ana's self-introduction."
    correct_response: ["Mă", "numesc", "Ana"]

  ro.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: "Match each name question with its matching answer."
    correct_response:
      "Cum vă numiți?": "Mă numesc Ana."
      "Cum te cheamă?": "Mă cheamă Mihai."

  ro.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: "After the informal greeting, ask the other person's name."
    accepted_answers:
      - "Cum te cheamă?"
      - "Cum te cheama?"

  ro.a1.unit01.lesson02.exercise04.complete_ma_cheama:
    instruction: "Complete the phrase giving Mihai's name."
    accepted_answers: ["Mă"]

  ro.a1.unit01.lesson02.exercise06.return_polite_question:
    instruction: "Return the question without changing from the polite register."
    accepted_answers:
      - "Și dumneavoastră?"
      - "Si dumneavoastra?"

  ro.a1.unit01.lesson02.exercise08.write_introduction:
    instruction: "Write a greeting, give Ana's name, and add a meeting expression."
    accepted_answers:
      - "Bună. Mă numesc Ana. Îmi pare bine."
      - "Buna. Ma numesc Ana. Imi pare bine."

  ro.a1.unit01.lesson03.exercise01.role_selection:
    instruction: "Who introduces herself with mă numesc?"
    correct_option: "Ana"
    distractors: ["Mihai", "Neither speaker"]
    accepted_answers: ["Ana"]

  ro.a1.unit01.lesson03.exercise02.comprehend_register:
    instruction: "Which pronoun do Ana and Mihai use with each other?"
    correct_option: "dumneavoastră"
    distractors: ["tu", "voi"]
    accepted_answers: ["dumneavoastră"]

  ro.a1.unit01.lesson03.exercise03.comprehend_names:
    instruction: "Which speaker uses mă numesc, and which uses mă cheamă?"
    correct_option: "Ana uses mă numesc; Mihai uses mă cheamă."
    distractors:
      - "Mihai uses mă numesc; Ana uses mă cheamă."
      - "Both speakers use mă numesc."
    accepted_answers:
      - "Ana uses mă numesc; Mihai uses mă cheamă."
      - "Ana; Mihai"

  ro.a1.unit01.lesson03.exercise05.order_closing:
    instruction: "Build the closing reply and farewell."
    correct_response: ["Bine,", "mulțumesc.", "La", "revedere!"]

  ro.a1.unit01.lesson03.exercise04.role_response:
    instruction: "Take Ana's role. Answer politely and return the question."
    accepted_answers:
      - "Bine, mulțumesc. Și dumneavoastră?"
      - "Bine, multumesc. Si dumneavoastra?"

  ro.a1.unit01.lesson03.exercise06.speak_role:
    instruction: "Take Ana's role. Greet Mihai formally, give your name, respond to his greeting, and close the encounter."
    accepted_answers:
      - "Bună ziua. Mă numesc Ana. Îmi pare bine! La revedere!"
      - "Buna ziua. Ma numesc Ana. Imi pare bine! La revedere!"
