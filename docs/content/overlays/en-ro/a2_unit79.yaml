answer_policy:
  diacritics: "Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling."
  capitalization_and_punctuation: "Accept ordinary capitalization differences and omission of the comma, exclamation mark or question mark."
  register: "Informal tu register throughout, matching the course-level register_policy. The imperfect (background) and the perfect compus (event) are the tenses taught here."
course:
  title: "Romanian A2"
  description: "Intermediate Romanian continuing the Ana and Mihai storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Romanian with the right tense for each situation."
units:
  ro.a2.unit79.ce_se_intampla: {"title": "What Was Happening?", "description": "Say what was going on when something else happened, using the imperfect for the background and the perfect compus for the event."}
lessons:
  ro.a2.unit79.lesson01.ploua_si_era_frig: {"title": "It Was Raining and It Was Cold"}
  ro.a2.unit79.lesson02.deodata_a_sunat: {"title": "Suddenly It Rang"}
  ro.a2.unit79.lesson03.cand_a_inceput: {"title": "When the Rain Began"}
  ro.a2.unit79.lesson04.in_timp_ce: {"title": "While"}
  ro.a2.unit79.lesson05.autobuzul_in_trafic: {"title": "The Bus in Traffic"}
  ro.a2.unit79.lesson06.ce_faceai: {"title": "What Were You Doing?"}
teaching:
  ro.a2.unit79.lesson01.teach.vocab_vreme: {"title": "Weather and traffic", "gloss": "to rain / to snow / cold / warm / traffic / outside", "note": "These words describe the scene around you. Use them to say what things were like.", "example_gloss": ["Outside it was raining hard.", "It was cold and it was snowing.", "There was heavy traffic on the street.", "It was warm."]}
  ro.a2.unit79.lesson01.teach.gn_a_fi: {"title": "The imperfect of a fi", "gloss": "I was, you were, he was, she was, we were, you (pl.) were, they were", "note": "The imperfect describes the background: how things were or what was going on. *Era* (it was) is the form you will use most: *era frig*, *era trafic*."}
  ro.a2.unit79.lesson01.teach.gn_imperfect: {"title": "Imperfect endings", "gloss": "to rain, it was raining. to snow, it was snowing. to walk, I/you/he was walking. to read, I/you/he was reading", "note": "Verbs in -a take -am, -ai, -a for eu, tu, el/ea (*a ploua* gives *ploua*), while verbs in -e and -i take -eam, -eai, -ea (*a ninge* gives *ningea*, *a merge* gives *mergeam*). For *noi* the form is the same as for *eu*: *mergeam*."}
  ro.a2.unit79.lesson01.teach.frazele: {"title": "Scene-setting sentences", "gloss": "It was cold and it was raining. It was raining and there was traffic. I was at home. You were there. They were tired."}
  ro.a2.unit79.lesson02.teach.vocab_eveniment: {"title": "Sudden events", "gloss": "to ring / to fall / to go out / to begin / to happen / suddenly / just", "note": "These verbs and words describe something sudden that happens. *Deodată* means suddenly; *tocmai* means just (a moment ago).", "example_gloss": ["Suddenly the phone rang.", "A glass fell on the floor.", "I have just gone out of the house.", "What happened?"]}
  ro.a2.unit79.lesson02.teach.vocab_obiecte: {"title": "Things that happen", "gloss": "the phone / the rain / the glass / down, on the floor", "note": "The ending -ul or -a makes a noun definite: *telefon* becomes *telefonul*, *ploaie* becomes *ploaia*.", "example_gloss": ["The phone was on the table.", "The rain began.", "The glass fell on the floor."]}
  ro.a2.unit79.lesson02.teach.gn_participii: {"title": "Participles for sudden events", "gloss": "to ring, rang. to go out, went out. to fall, fell. to begin, began. to happen, happened", "note": "The perfect compus tells what happened at one moment: *a* or *am* plus the participle. It is the tense for the interrupting event, not for the background."}
  ro.a2.unit79.lesson02.teach.gn_deodata: {"title": "Deodată and tocmai", "gloss": "Suddenly the phone rang. I have just gone out. Suddenly the rain began.", "note": "*Deodată* and *tocmai* go naturally with the perfect compus, because they point to a single moment."}
  ro.a2.unit79.lesson02.teach.frazele: {"title": "Four sentences", "gloss": "Suddenly the phone rang. I have just gone out. What happened? A glass fell."}
  ro.a2.unit79.lesson03.teach.vocab_cand: {"title": "When and where", "gloss": "when / on the street / at the TV / to look, to watch", "note": "*Când* joins a background action to the event that interrupted it.", "example_gloss": ["I was walking down the street when the rain began.", "I was watching TV when the phone rang.", "It was raining when I went out.", "It was cold when I went out."]}
  ro.a2.unit79.lesson03.teach.gn_contrast: {"title": "Imperfect plus când plus perfect compus", "gloss": "I was walking down the street when the rain began. I was watching TV when the phone rang.", "note": "The imperfect says what was going on; the perfect compus says what happened and interrupted it. *Când* sits between them."}
  ro.a2.unit79.lesson03.teach.gn_ordine: {"title": "Order of the two parts", "gloss": "I was watching TV when the phone rang. When the phone rang, I was watching TV.", "note": "You can start with either part. The tenses stay the same; with a comma if *când* comes first."}
  ro.a2.unit79.lesson03.teach.gn_a_se_uita: {"title": "The imperfect of a se uita", "gloss": "I was watching, you were watching, he was watching, we were watching, you (pl.) were watching, they were watching", "note": "Reflexive verbs keep their small word (*mă, te, se, ne, vă, se*) before the verb."}
  ro.a2.unit79.lesson03.teach.frazele: {"title": "Scene and event", "gloss": "It was raining when I went out. It was cold when I went out. I was walking down the street. The rain began. The phone rang. We were watching TV. He was watching TV."}
  ro.a2.unit79.lesson04.teach.vocab_in_timp_ce: {"title": "While", "gloss": "while / to cook / to read / to eat / to sleep / to talk", "note": "*În timp ce* joins two actions that were going on at the same time.", "example_gloss": ["I was cooking while he was reading.", "Ana was reading while Mihai was cooking.", "We were eating while it was raining.", "He was sleeping while I was reading."]}
  ro.a2.unit79.lesson04.teach.gn_simultan: {"title": "Two imperfects with în timp ce", "gloss": "I was cooking while he was reading. We were eating while it was raining.", "note": "When two actions go on together, both verbs are in the imperfect. No single moment is described."}
  ro.a2.unit79.lesson04.teach.gn_forme: {"title": "Imperfect, he or she", "gloss": "to cook, he cooked / was cooking. to read, was reading. to eat, was eating. to sleep, was sleeping. to talk, was talking", "note": "The form for *el* and *ea* ends in -a. For *eu* it ends in -m: *găteam*, *citeam*, *dormeam*."}
  ro.a2.unit79.lesson04.teach.gn_cand_vs_timp: {"title": "Când or în timp ce", "gloss": "I was reading when he went out. I was reading while he was sleeping.", "note": "Use *când* with a sudden event in the perfect compus (*a ieșit*). Use *în timp ce* with a second ongoing action in the imperfect (*dormea*)."}
  ro.a2.unit79.lesson04.teach.frazele: {"title": "Short forms", "gloss": "He was cooking. He was reading. He was sleeping. We were eating. I was reading. Mihai was cooking. Ana was reading. I was cooking. He was reading. We were eating."}
  ro.a2.unit79.lesson05.teach.vocab_autobuz: {"title": "A day on the bus", "gloss": "the bus / work / window / the people / late / to stop / to wait / to arrive", "note": "Words for the story. *La serviciu* means at work or to work.", "example_gloss": ["I was going to work by bus.", "The bus stopped.", "I waited.", "I arrived at work late."]}
  ro.a2.unit79.lesson05.teach.frazele: {"title": "Story sentences", "gloss": "It was raining hard and there was heavy traffic. I was going to work. Suddenly the bus stopped. I was reading a book. The people were looking out of the window. I arrived at work late."}
  ro.a2.unit79.lesson05.teach.r1: {"title": "Ana tells the story", "gloss": "Ana: This morning it was raining hard and there was heavy traffic."}
  ro.a2.unit79.lesson05.teach.r2: {"title": "Ana tells the story", "gloss": "Ana: I was going to work by bus. Suddenly the bus stopped."}
  ro.a2.unit79.lesson05.teach.r3: {"title": "Mihai tells the story", "gloss": "Mihai: And what did you do?"}
  ro.a2.unit79.lesson05.teach.r4: {"title": "Ana tells the story", "gloss": "Ana: I waited. I was reading a book while the people were looking out of the window."}
  ro.a2.unit79.lesson05.teach.r5: {"title": "Ana tells the story", "gloss": "Ana: I arrived at work late."}
  ro.a2.unit79.lesson06.teach.d1: {"title": "Mihai speaks", "gloss": "Mihai: Hi, Ana! What were you doing when I called?"}
  ro.a2.unit79.lesson06.teach.d2: {"title": "Ana speaks", "gloss": "Ana: I was on the bus. It was raining hard and there was heavy traffic."}
  ro.a2.unit79.lesson06.teach.d3: {"title": "Mihai speaks", "gloss": "Mihai: I see. I was watching TV when I called."}
  ro.a2.unit79.lesson06.teach.d4: {"title": "Ana speaks", "gloss": "Ana: I was reading a book when you called, but I did not answer."}
  ro.a2.unit79.lesson06.teach.d5: {"title": "Mihai speaks", "gloss": "Mihai: It's nothing. Shall we talk later?"}
  ro.a2.unit79.lesson06.teach.d6: {"title": "Ana speaks", "gloss": "Ana: Yes, we will talk later. Bye!"}
exercises:
  ro.a2.unit79.lesson01.exercise01.alege_ploua: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Afară ploua tare.", "distractors": ["Afară plouam tare.", "Afară ploai tare.", "Afară ploaie tare."], "accepted_answers": [{"value": "Afară ploua tare.", "status": "correct"}], "feedback": "*Ploua* is the imperfect: it describes the weather as the background of a past moment."}
  ro.a2.unit79.lesson01.exercise02.alege_ningea: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Era frig și ningea.", "distractors": ["Eram frig și ningea.", "Era frig și ninge.", "Erai frig și ningea."], "accepted_answers": [{"value": "Era frig și ningea.", "status": "correct"}], "feedback": "*Era* goes with *frig*, and *ningea* is the imperfect of *a ninge*."}
  ro.a2.unit79.lesson01.exercise03.une_scena: {"instruction": "Match each Romanian imperfect form to its meaning.", "accepted_answers": [{"value": [{"left": "ploua", "right": "it was raining"}, {"left": "ningea", "right": "it was snowing"}, {"left": "era frig", "right": "it was cold"}, {"left": "era cald", "right": "it was warm"}, {"left": "era trafic", "right": "there was traffic"}, {"left": "eram acasă", "right": "I was at home"}, {"left": "erai acolo", "right": "you were there"}, {"left": "erau obosiți", "right": "they were tired"}], "status": "correct"}], "feedback": "Each of these forms describes how things were."}
  ro.a2.unit79.lesson01.exercise04.ordoneaza_frig: {"instruction": "Put the words in order to say 'It was cold and it was raining.'", "correct_option": "Era frig și ploua", "accepted_answers": [{"value": "Era frig și ploua", "status": "correct"}, {"value": "Ploua și era frig", "status": "correct"}], "feedback": "*Era frig și ploua* describes two parts of the background. The two parts can swap places."}
  ro.a2.unit79.lesson01.exercise05.completeaza_ploua: {"instruction": "Complete with the imperfect form meaning 'it was raining'.", "correct_option": "ploua", "accepted_answers": [{"value": "ploua", "status": "correct"}], "feedback": "*Ploua* is the imperfect of *a ploua*: it was raining."}
  ro.a2.unit79.lesson01.exercise06.traduce_trafic: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Ploua și era trafic.", "status": "correct"}, {"value": "Ploua și era trafic", "status": "correct"}, {"value": "Era trafic și ploua.", "status": "correct"}, {"value": "Era trafic și ploua", "status": "correct"}], "feedback": "*Ploua și era trafic*: both verbs are in the imperfect, as in a scene description."}
  ro.a2.unit79.lesson01.exercise07.scrie_frig: {"instruction": "Write the requested Romanian sentence using the imperfect.", "correct_option": "Era frig și ploua.", "accepted_answers": [{"value": "Era frig și ploua.", "status": "correct"}, {"value": "Era frig și ploua", "status": "correct"}, {"value": "Ploua și era frig.", "status": "correct"}, {"value": "Ploua și era frig", "status": "correct"}, {"value": "Afară era frig și ploua.", "status": "correct"}, {"value": "Afară era frig și ploua", "status": "correct"}, {"value": "Afară ploua și era frig.", "status": "correct"}, {"value": "Afară ploua și era frig", "status": "correct"}], "feedback": "*Era frig și ploua*: two imperfect verbs describe the scene."}
  ro.a2.unit79.lesson02.exercise01.alege_sunat: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Deodată a sunat telefonul.", "distractors": ["Deodată a suna telefonul.", "Deodată am sunat telefonul.", "Deodată sunat telefonul."], "accepted_answers": [{"value": "Deodată a sunat telefonul.", "status": "correct"}], "feedback": "*A sunat* is the perfect compus: a (helper) plus the participle *sunat*."}
  ro.a2.unit79.lesson02.exercise02.alege_intamplat: {"instruction": "Choose the correct Romanian question.", "correct_option": "Ce s-a întâmplat?", "distractors": ["Ce se întâmplat?", "Ce a întâmplat?", "Ce s-a întâmplă?"], "accepted_answers": [{"value": "Ce s-a întâmplat?", "status": "correct"}], "feedback": "*S-a întâmplat* = it happened: *s-a* plus the participle *întâmplat*."}
  ro.a2.unit79.lesson02.exercise03.une_evenimente: {"instruction": "Match each Romanian word or form to its meaning.", "accepted_answers": [{"value": [{"left": "a sunat", "right": "it rang"}, {"left": "a căzut", "right": "it fell"}, {"left": "a ieșit", "right": "he went out"}, {"left": "am ieșit", "right": "I went out"}, {"left": "s-a întâmplat", "right": "it happened"}, {"left": "a început", "right": "it began"}, {"left": "deodată", "right": "suddenly"}, {"left": "tocmai", "right": "just"}], "status": "correct"}], "feedback": "These are the words for sudden events."}
  ro.a2.unit79.lesson02.exercise04.ordoneaza_sunat: {"instruction": "Put the words in order to say 'Suddenly the phone rang.'", "correct_option": "Deodată a sunat telefonul", "accepted_answers": [{"value": "Deodată a sunat telefonul", "status": "correct"}, {"value": "A sunat deodată telefonul", "status": "correct"}, {"value": "Telefonul a sunat deodată", "status": "correct"}, {"value": "Deodată telefonul a sunat", "status": "correct"}, {"value": "A sunat telefonul deodată", "status": "correct"}], "feedback": "*Deodată a sunat telefonul* is the most natural order; the others are also correct."}
  ro.a2.unit79.lesson02.exercise05.completeaza_cazut: {"instruction": "Complete with the participle meaning 'fallen'.", "correct_option": "căzut", "accepted_answers": [{"value": "căzut", "status": "correct"}], "feedback": "*A căzut* is the perfect compus of *a cădea*: it fell."}
  ro.a2.unit79.lesson02.exercise06.traduce_tocmai: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Tocmai am ieșit.", "status": "correct"}, {"value": "Tocmai am ieșit", "status": "correct"}, {"value": "Eu tocmai am ieșit.", "status": "correct"}, {"value": "Eu tocmai am ieșit", "status": "correct"}], "feedback": "*Tocmai am ieșit*: *tocmai* plus the perfect compus."}
  ro.a2.unit79.lesson02.exercise07.scrie_ploaia: {"instruction": "Write the requested Romanian sentence with the perfect compus.", "correct_option": "Deodată a început ploaia.", "accepted_answers": [{"value": "Deodată a început ploaia.", "status": "correct"}, {"value": "Deodată a început ploaia", "status": "correct"}, {"value": "Ploaia a început deodată.", "status": "correct"}, {"value": "Ploaia a început deodată", "status": "correct"}, {"value": "Deodată ploaia a început.", "status": "correct"}, {"value": "Deodată ploaia a început", "status": "correct"}], "feedback": "*Deodată a început ploaia*: the sudden event is in the perfect compus."}
  ro.a2.unit79.lesson03.exercise01.alege_mergeam: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Mergeam pe stradă când a început ploaia.", "distractors": ["Merge pe stradă când a început ploaia.", "Mergeam pe stradă când au început ploaia.", "Mergeau pe stradă când a început ploaia."], "accepted_answers": [{"value": "Mergeam pe stradă când a început ploaia.", "status": "correct"}], "feedback": "*Mergeam* is the background (I was walking) and *a început* is the event."}
  ro.a2.unit79.lesson03.exercise02.alege_televizor: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Mă uitam la televizor când a sunat telefonul.", "distractors": ["Mă uitam la televizor când a suna telefonul.", "Te uitai la televizor când a sunat telefonul.", "Mă uitam la televizor când sunam telefonul."], "accepted_answers": [{"value": "Mă uitam la televizor când a sunat telefonul.", "status": "correct"}], "feedback": "*Mă uitam* (I was watching) is the imperfect; *a sunat* is the event."}
  ro.a2.unit79.lesson03.exercise03.une_contrast: {"instruction": "Match each Romanian sentence to its meaning.", "accepted_answers": [{"value": [{"left": "Ploua când am ieșit.", "right": "It was raining when I went out."}, {"left": "Era frig când am ieșit.", "right": "It was cold when I went out."}, {"left": "Mergeam pe stradă.", "right": "I was walking down the street."}, {"left": "A început ploaia.", "right": "The rain began."}, {"left": "Mă uitam la televizor.", "right": "I was watching TV."}, {"left": "A sunat telefonul.", "right": "The phone rang."}, {"left": "Ne uitam la televizor.", "right": "We were watching TV."}, {"left": "Se uita la televizor.", "right": "He was watching TV."}], "status": "correct"}], "feedback": "Some sentences give the background, others the event."}
  ro.a2.unit79.lesson03.exercise04.ordoneaza_cand: {"instruction": "Put the words in order to say 'I was walking down the street when the rain began.'", "correct_option": "Mergeam pe stradă când a început ploaia", "accepted_answers": [{"value": "Mergeam pe stradă când a început ploaia", "status": "correct"}, {"value": "Când a început ploaia mergeam pe stradă", "status": "correct"}, {"value": "Mergeam pe stradă când ploaia a început", "status": "correct"}], "feedback": "The two parts can swap places: *Când a început ploaia, mergeam pe stradă*."}
  ro.a2.unit79.lesson03.exercise05.completeaza_cand: {"instruction": "Complete with the word meaning 'when'.", "correct_option": "când", "accepted_answers": [{"value": "când", "status": "correct"}], "feedback": "*Când* links the background to the event."}
  ro.a2.unit79.lesson03.exercise06.traduce_ploua_cand: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Ploua când am ieșit.", "status": "correct"}, {"value": "Ploua când am ieșit", "status": "correct"}, {"value": "Când am ieșit ploua.", "status": "correct"}, {"value": "Când am ieșit ploua", "status": "correct"}, {"value": "Când am ieșit, ploua.", "status": "correct"}, {"value": "Când am ieșit, ploua", "status": "correct"}, {"value": "Afară ploua când am ieșit.", "status": "correct"}, {"value": "Afară ploua când am ieșit", "status": "correct"}], "feedback": "*Ploua* is the background; *am ieșit* is the event."}
  ro.a2.unit79.lesson03.exercise07.scrie_televizor: {"instruction": "Write the requested Romanian sentence.", "correct_option": "Mă uitam la televizor când a sunat telefonul.", "accepted_answers": [{"value": "Mă uitam la televizor când a sunat telefonul.", "status": "correct"}, {"value": "Mă uitam la televizor când a sunat telefonul", "status": "correct"}, {"value": "Eu mă uitam la televizor când a sunat telefonul.", "status": "correct"}, {"value": "Eu mă uitam la televizor când a sunat telefonul", "status": "correct"}, {"value": "Când a sunat telefonul, mă uitam la televizor.", "status": "correct"}, {"value": "Când a sunat telefonul, mă uitam la televizor", "status": "correct"}, {"value": "Când a sunat telefonul mă uitam la televizor.", "status": "correct"}, {"value": "Când a sunat telefonul mă uitam la televizor", "status": "correct"}, {"value": "Când a sunat telefonul, eu mă uitam la televizor.", "status": "correct"}, {"value": "Când a sunat telefonul, eu mă uitam la televizor", "status": "correct"}], "feedback": "*Mă uitam la televizor când a sunat telefonul*: imperfect for the background, perfect compus for the event."}
  ro.a2.unit79.lesson04.exercise01.alege_gateam: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Eu găteam în timp ce el citea.", "distractors": ["Eu găteai în timp ce el citea.", "Eu gătea în timp ce el citea.", "Eu găteam în timp ce el citeam."], "accepted_answers": [{"value": "Eu găteam în timp ce el citea.", "status": "correct"}], "feedback": "Both verbs are in the imperfect: *găteam* (I) and *citea* (he)."}
  ro.a2.unit79.lesson04.exercise02.alege_ana: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Ana citea în timp ce Mihai gătea.", "distractors": ["Ana citeam în timp ce Mihai gătea.", "Ana citeau în timp ce Mihai gătea.", "Ana citea în timp ce Mihai găteam."], "accepted_answers": [{"value": "Ana citea în timp ce Mihai gătea.", "status": "correct"}], "feedback": "For Ana and Mihai (he/she) the imperfect ends in -a: *citea*, *gătea*."}
  ro.a2.unit79.lesson04.exercise03.une_timp_ce: {"instruction": "Match each Romanian form to its meaning.", "accepted_answers": [{"value": [{"left": "în timp ce", "right": "while"}, {"left": "gătea", "right": "he was cooking"}, {"left": "citea", "right": "she was reading"}, {"left": "dormea", "right": "he was sleeping"}, {"left": "mânca", "right": "she was eating"}, {"left": "vorbea", "right": "he was talking"}, {"left": "ploua", "right": "it was raining"}, {"left": "mâncam", "right": "we were eating"}], "status": "correct"}], "feedback": "These forms describe actions going on together."}
  ro.a2.unit79.lesson04.exercise04.ordoneaza_timp_ce: {"instruction": "Put the words in order to say 'I was cooking while he was reading.'", "correct_option": "Eu găteam în timp ce el citea", "accepted_answers": [{"value": "Eu găteam în timp ce el citea", "status": "correct"}, {"value": "În timp ce el citea eu găteam", "status": "correct"}], "feedback": "*În timp ce* can open the sentence; the pronoun *eu* may be dropped."}
  ro.a2.unit79.lesson04.exercise05.completeaza_dormea: {"instruction": "Complete with the imperfect form meaning 'was sleeping'.", "correct_option": "dormea", "accepted_answers": [{"value": "dormea", "status": "correct"}], "feedback": "*Dormea* is the imperfect of *a dormi* for *el*."}
