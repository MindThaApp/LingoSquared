  ro.c1.unit08.persuasiune_retorica.lesson01.teach.credibilitate: {title: "speaker credibility", gloss: "the speaker's credibility", note: "This is the ethos move."}
  ro.c1.unit08.persuasiune_retorica.lesson02.teach.nu_ci: {title: "not this, but that", gloss: "We are not asking for a symbolic gesture, but a measurable change.", note: "*Nu ... ci* creates persuasive contrast."}
