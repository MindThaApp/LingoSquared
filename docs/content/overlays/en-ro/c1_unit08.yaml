exercises:
  ro.c1.unit08.persuasiune_retorica.lesson01.exercise01.recognize_ethos:
    instruction: "Which Romanian phrase builds credibility through role and experience?"
    correct_option: "Vă vorbesc ca profesoară"
    distractors: ["Nu contest obiectivul", "Pe de altă parte", "Revenind la ideea principală"]
    accepted_answers: [{value: "Vă vorbesc ca profesoară", status: correct}]
    feedback: "*Vă vorbesc ca profesoară* builds credibility."
  ro.c1.unit08.persuasiune_retorica.lesson01.exercise02.listen_ethos:
    instruction: "Listen and select the rhetorical function."
    correct_option: "The speaker builds credibility from professional experience."
    distractors: ["The speaker asks for a symbolic gesture.", "The speaker repeats three needs.", "The speaker gives a deadline only."]
    accepted_answers: [{value: "The speaker builds credibility from professional experience.", status: correct}]
    feedback: "The role of teacher supports the argument."
  ro.c1.unit08.persuasiune_retorica.lesson01.exercise03.match_ethos:
    instruction: "Match each Romanian credibility phrase to its English meaning."
    accepted_answers:
      - value: {"Vă vorbesc": "I am speaking to you (formal)", "ca profesoară": "as a teacher", "vede zilnic": "sees daily", "nevoile elevilor": "the students' needs", "credibilitatea": "credibility", "vorbitorului": "of the speaker"}
        status: correct
    feedback: "These phrases build ethos."
  ro.c1.unit08.persuasiune_retorica.lesson01.exercise04.dictation_ethos:
    instruction: "Type exactly what you hear."
    correct_response: "Vă vorbesc ca profesoară care vede zilnic nevoile elevilor."
    orthography_strict: true
    feedback: "Vă vorbesc ca profesoară care vede zilnic nevoile elevilor."
  ro.c1.unit08.persuasiune_retorica.lesson02.exercise01.recognize_contrast:
    instruction: "Which sentence uses contrast to persuade?"
    correct_option: "Nu cerem un gest simbolic, ci o schimbare măsurabilă"
    distractors: ["Vă vorbesc ca profesoară care vede zilnic nevoile elevilor", "Dacă am fi avut datele complete, am fi evitat întârzierea", "Mai bine luăm pulsul echipei și păstrăm ideile care au prins rădăcini"]
    accepted_answers: [{value: "Nu cerem un gest simbolic, ci o schimbare măsurabilă", status: correct}]
    feedback: "*Nu ... ci* creates contrast."
