answer_policy:
  diacritics: "Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling."
  capitalization_and_punctuation: "Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark."
  register: "Informal tu register throughout, matching the unit's course-level register_policy. The past perfect (mai mult ca perfectul) is taught mainly for understanding; the normal past (perfectul compus) is used for the events that follow."
course:
  title: "Romanian A2"
  description: "Intermediate Romanian continuing the Ana and Mihai storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Romanian and say what had already happened before another moment."
units:
  ro.a2.unit81.trenul_plecase_deja: {"title": "The Train Had Already Left", "description": "Explain that something had already happened before a certain moment, such as a train that had left before you arrived, with the past perfect, deja and după ce."}
lessons:
  ro.a2.unit81.lesson01.plecase_deja: {"title": "It Had Already Left"}
  ro.a2.unit81.lesson02.fusesem_si_ma_trezisem: {"title": "I Had Been and I Had Woken Up"}
  ro.a2.unit81.lesson03.cand_am_ajuns: {"title": "When I Arrived"}
  ro.a2.unit81.lesson04.dupa_ce_a_plecat: {"title": "After It Left"}
  ro.a2.unit81.lesson05.mesajul_lui_mihai: {"title": "Mihai's Message"}
  ro.a2.unit81.lesson06.ana_si_mihai: {"title": "Ana and Mihai Talk"}
teaching:
  ro.a2.unit81.lesson01.teach.verbe: {"title": "Words and verbs", "gloss": "the train / the station / the shop / to leave / to arrive / to finish / to close / to eat / already", "note": "These words and verbs appear in the whole unit. *Deja* means 'already'.", "example_gloss": ["The train had already left.", "When I arrived at the station, the train had left.", "Ana had already eaten.", "We had already finished.", "They had closed the shop.", "I had already eaten.", "They had already finished."]}
  ro.a2.unit81.lesson01.teach.gn_forme: {"title": "Mai mult ca perfectul: endings", "gloss": "I had left, you had left, he had left, she had left, we had left, you (plural) had left, they had left, they had left", "note": "The *mai mult ca perfectul* (the past perfect) says that something had already happened before another moment in the past. The endings are -sem, -seși, -se, -serăm, -serăți, -seră. Note that the *el* and *ea* forms are the same, and so are *ei* and *ele* forms of the plural."}
  ro.a2.unit81.lesson01.teach.gn_baza: {"title": "How to build the form", "gloss": "to leave, he had left. to eat, he had eaten. to finish, he had finished. to arrive, he had arrived. to close, he had closed", "note": "Start from the participle: *plecat*, *mâncat*, *terminat*, *ajuns*, *închis*. When the participle ends in -t, drop the -t and add the endings: *plecat* gives *plecasem, plecase*. When it ends in -s (*ajuns*, *închis*), add -esem, -ese: *ajunsesem, ajunsese*."}
  ro.a2.unit81.lesson01.teach.gn_deja: {"title": "Deja with the past perfect", "gloss": "The train had already left. We had already finished. Ana had already eaten.", "note": "*Deja* usually comes right after the verb. It can also stand before the verb: *Trenul deja plecase*."}
  ro.a2.unit81.lesson01.teach.fraze: {"title": "Three sentences", "gloss": "Ana had already eaten. We had already finished. They had already left."}
  ro.a2.unit81.lesson02.teach.verbe: {"title": "More verbs and words", "gloss": "to be / to do, make / to see / to have / to wake up / coffee / early / late / at home / time", "note": "*A se trezi* is a reflexive verb: its pronoun (*mă, te, se, ne, vă*) comes before the verb.", "example_gloss": ["I had been at home.", "I had made coffee.", "I had woken up early.", "Mihai had woken up late.", "We had had time.", "Mihai had made coffee.", "Ana had seen the train."]}
  ro.a2.unit81.lesson02.teach.gn_neregulate: {"title": "Four common verbs", "gloss": "to be, I had been. to do, I had made. to see, I had seen. to have, I had had", "note": "The participles are *fost*, *făcut*, *văzut*, *avut*. Drop the -t and add the endings: *fusesem* (the stem changes to *fu-*), *făcusem*, *văzusem*, *avusesem*."}
  ro.a2.unit81.lesson02.teach.gn_fusese: {"title": "Fusesem in all persons", "gloss": "I had been, you had been, he had been, we had been, you (plural) had been, they had been", "note": "The endings are the same as for every other verb: -sem, -seși, -se, -serăm, -serăți, -seră."}
  ro.a2.unit81.lesson02.teach.gn_reflexive: {"title": "Reflexive verbs", "gloss": "I had woken up, you had woken up, he had woken up, we had woken up, you (plural) had woken up, they had woken up", "note": "The reflexive pronoun stands before the verb: *mă trezisem*. The negative *nu* comes before the pronoun: *nu mă trezisem*."}
  ro.a2.unit81.lesson02.teach.fraze: {"title": "Three sentences", "gloss": "I had woken up early. Mihai had been at home. I had made coffee."}
  ro.a2.unit81.lesson03.teach.cuvinte: {"title": "Time words", "gloss": "when / then / not yet / to take / taxi", "note": "*Când* links the two moments. *Apoi* puts events in order.", "example_gloss": ["When I arrived, the train had left.", "I arrived, then the train left.", "The train had not left yet.", "I took a taxi.", "I had not arrived yet."]}
  ro.a2.unit81.lesson03.teach.gn_contrast: {"title": "Two different orders", "gloss": "When I arrived at the station, the train had already left. I arrived at the station and then the train left.", "note": "In the first sentence the train left first, then I arrived: that needs *plecase*. In the second I arrived first, then the train left: both actions use the normal past (*am ajuns*, *a plecat*)."}
  ro.a2.unit81.lesson03.teach.gn_incanu: {"title": "Încă nu", "gloss": "The train had not left yet. Mihai had not arrived yet.", "note": "*Nu ... încă* means 'not yet'. Put *nu* before the verb: *nu plecase*, *nu ajunsese*."}
  ro.a2.unit81.lesson03.teach.gn_inainte: {"title": "Înainte să (for recognition)", "gloss": "The train left before I arrived. Ana ate before I left.", "note": "*Înainte să* means 'before' and is followed by another verb form (*să ajung*). You only need to recognize this pattern now. You do not have to produce it yet."}
  ro.a2.unit81.lesson04.teach.cuvinte: {"title": "Words for what happened next", "gloss": "after / to wait / to take / to be late / a lot, long", "note": "*După ce* introduces the first action. It is followed by the normal past (*perfectul compus*).", "example_gloss": ["After the train left, I took a taxi.", "After I ate, I left.", "After he got home, Mihai ate.", "After I waited a long time, I took a taxi."]}
  ro.a2.unit81.lesson04.teach.gn_dupa_ce: {"title": "După ce + normal past", "gloss": "After the train left, I took a taxi. After I ate, I left.", "note": "After *după ce* use the normal past (*a plecat*, *am mâncat*), not *plecase*. The first action comes after *după ce*, the second one in the main clause."}
  ro.a2.unit81.lesson04.teach.gn_ordine: {"title": "Two ways to order events", "gloss": "When I arrived, the train had already left. After the train left, I took a taxi.", "note": "Use the past perfect (*plecase*) to say that something had happened before a certain moment. Use *după ce* with the normal past to tell events one after another."}
  ro.a2.unit81.lesson04.teach.fraze: {"title": "Useful sentences", "gloss": "What happened? The train had already left. I was late."}
  ro.a2.unit81.lesson05.teach.cuvinte: {"title": "Words for the message", "gloss": "to be late / I'm sorry / Where are you / now / in", "note": "*Îmi pare rău* is a set phrase for saying you are sorry.", "example_gloss": ["I am late.", "I'm sorry!", "Where are you?", "Now I'm in a taxi."]}
  ro.a2.unit81.lesson05.teach.gn_nu_mancasem: {"title": "Two things before the train", "gloss": "I had woken up late and I had not eaten.", "note": "Two actions that happened before the same moment both use the past perfect. *Nu* stands before the verb: *nu mâncasem*."}
  ro.a2.unit81.lesson05.teach.lectura1: {"title": "Ana writes", "gloss": "Hi, Mihai! Where are you? Did you get to the station?", "note": "Ana asks Mihai where he is."}
  ro.a2.unit81.lesson05.teach.lectura2: {"title": "Mihai answers", "gloss": "Hi, Ana! I'm sorry, I'm late. When I arrived at the station, the train had already left.", "note": "Mihai explains why he is late. *Plecase* shows that the train left before he arrived."}
  ro.a2.unit81.lesson05.teach.lectura3: {"title": "Mihai explains the rest", "gloss": "I had woken up late and I hadn't eaten. After the train left, I took a taxi. Now I'm in a taxi.", "note": "The past perfect (*mă trezisem*, *nu mâncasem*) gives the reason. *După ce a plecat trenul* tells what happened next."}
  ro.a2.unit81.lesson06.teach.d1: {"title": "Ana asks", "gloss": "Ana: Hi, Mihai! What happened?"}
  ro.a2.unit81.lesson06.teach.d2: {"title": "Mihai explains", "gloss": "Mihai: The train had already left when I got to the station."}
  ro.a2.unit81.lesson06.teach.d3: {"title": "Ana asks why", "gloss": "Ana: Why did you arrive so late?"}
  ro.a2.unit81.lesson06.teach.d4: {"title": "Mihai gives the reason", "gloss": "Mihai: I had woken up late and I hadn't eaten."}
  ro.a2.unit81.lesson06.teach.d5: {"title": "Ana asks what next", "gloss": "Ana: And what did you do after the train left?"}
  ro.a2.unit81.lesson06.teach.d6: {"title": "Mihai finishes", "gloss": "Mihai: I took a taxi, but I haven't eaten yet."}
exercises:
  ro.a2.unit81.lesson01.exercise01.elige_trenul_plecase: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Trenul plecase deja.", "distractors": ["Trenul pleacă deja.", "Trenul plecasem deja.", "Trenul plecaseră deja."], "accepted_answers": [{"value": "Trenul plecase deja.", "status": "correct"}], "feedback": "With *trenul* (it) the form is *plecase*. *Plecasem* goes with *eu* and *plecaseră* with *ei*."}
  ro.a2.unit81.lesson01.exercise02.elige_terminaseram: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Terminaserăm deja.", "distractors": ["Terminasem deja.", "Terminăm deja.", "Terminaserăți deja."], "accepted_answers": [{"value": "Terminaserăm deja.", "status": "correct"}], "feedback": "*Noi* takes the ending -serăm: *terminaserăm*."}
  ro.a2.unit81.lesson01.exercise03.une_formele: {"instruction": "Match each Romanian form to its meaning.", "accepted_answers": [{"value": [{"left": "plecasem", "right": "I had left"}, {"left": "plecaseși", "right": "you had left"}, {"left": "plecase", "right": "he had left"}, {"left": "plecaserăm", "right": "we had left"}, {"left": "plecaserăți", "right": "you (plural) had left"}, {"left": "plecaseră", "right": "they had left"}, {"left": "mâncasem", "right": "I had eaten"}, {"left": "terminase", "right": "he had finished"}], "status": "correct"}], "feedback": "Each person has its own ending: -sem, -seși, -se, -serăm, -serăți, -seră."}
  ro.a2.unit81.lesson01.exercise04.ordoneaza_ana_mancase: {"instruction": "Put the words in order to say 'Ana had already eaten.'", "correct_option": "Ana mâncase deja", "accepted_answers": [{"value": "Ana mâncase deja", "status": "correct"}, {"value": "Ana deja mâncase", "status": "correct"}], "feedback": "*Ana mâncase deja*: *mâncase* is the form for *ea*."}
  ro.a2.unit81.lesson01.exercise05.completeaza_plecase: {"instruction": "Complete with the form of *a pleca* that means 'had left' (it).", "correct_option": "plecase", "orthography_strict": true, "accepted_answers": [{"value": "plecase", "status": "correct"}], "feedback": "*Trenul plecase deja*: the train left before I arrived."}
  ro.a2.unit81.lesson01.exercise06.traduce_terminasera: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Terminaseră deja.", "status": "correct"}, {"value": "Terminaseră deja", "status": "correct"}, {"value": "Ei terminaseră deja.", "status": "correct"}, {"value": "Ei terminaseră deja", "status": "correct"}, {"value": "Ele terminaseră deja.", "status": "correct"}, {"value": "Ele terminaseră deja", "status": "correct"}, {"value": "Deja terminaseră.", "status": "correct"}, {"value": "Deja terminaseră", "status": "correct"}, {"value": "Ei deja terminaseră.", "status": "correct"}, {"value": "Ei deja terminaseră", "status": "correct"}, {"value": "Ele deja terminaseră.", "status": "correct"}, {"value": "Ele deja terminaseră", "status": "correct"}], "feedback": "*Terminaseră deja*: the *ei/ele* ending is -seră."}
  ro.a2.unit81.lesson01.exercise07.scrie_mancasem: {"instruction": "Write the requested Romanian sentence with *deja*.", "correct_option": "Mâncasem deja.", "accepted_answers": [{"value": "Mâncasem deja.", "status": "correct"}, {"value": "Mâncasem deja", "status": "correct"}, {"value": "Eu mâncasem deja.", "status": "correct"}, {"value": "Eu mâncasem deja", "status": "correct"}, {"value": "Eu deja mâncasem.", "status": "correct"}, {"value": "Eu deja mâncasem", "status": "correct"}, {"value": "Deja mâncasem.", "status": "correct"}, {"value": "Deja mâncasem", "status": "correct"}], "feedback": "*Mâncasem deja* = I had already eaten."}
  ro.a2.unit81.lesson02.exercise01.elige_fusesem: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Fusesem acasă.", "distractors": ["Fusese acasă.", "Fuseseră acasă.", "Fusem acasă."], "accepted_answers": [{"value": "Fusesem acasă.", "status": "correct"}], "feedback": "*Fusesem* is the form for *eu*. *Fusese* is for *el/ea* and *fuseseră* for *ei/ele*."}
  ro.a2.unit81.lesson02.exercise02.elige_se_trezise: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Mihai se trezise târziu.", "distractors": ["Mihai mă trezisem târziu.", "Mihai se trezisem târziu.", "Mihai te trezise târziu."], "accepted_answers": [{"value": "Mihai se trezise târziu.", "status": "correct"}], "feedback": "*Mihai* takes the pronoun *se* and the form *trezise*."}
  ro.a2.unit81.lesson02.exercise03.une_neregulate: {"instruction": "Match each Romanian form to its meaning.", "accepted_answers": [{"value": [{"left": "fusesem", "right": "I had been"}, {"left": "făcusem", "right": "I had made"}, {"left": "văzusem", "right": "I had seen"}, {"left": "avusesem", "right": "I had had"}, {"left": "mă trezisem", "right": "I had woken up"}, {"left": "te treziseși", "right": "you had woken up"}, {"left": "se trezise", "right": "he had woken up"}, {"left": "ne treziserăm", "right": "we had woken up"}], "status": "correct"}], "feedback": "Irregular verbs and reflexive verbs use the same endings."}
  ro.a2.unit81.lesson02.exercise04.ordoneaza_cafea: {"instruction": "Put the words in order to say 'Mihai had already made coffee.'", "correct_option": "Mihai făcuse deja cafea", "accepted_answers": [{"value": "Mihai făcuse deja cafea", "status": "correct"}, {"value": "Mihai făcuse cafea deja", "status": "correct"}, {"value": "Mihai deja făcuse cafea", "status": "correct"}], "feedback": "*Făcuse* is the form of *a face* for *el*."}
  ro.a2.unit81.lesson02.exercise05.completeaza_facusem: {"instruction": "Complete with the form of *a face* that means 'had made' (I).", "correct_option": "făcusem", "orthography_strict": true, "accepted_answers": [{"value": "făcusem", "status": "correct"}], "feedback": "*Eu făcusem cafea deja*: the coffee was ready before Ana arrived."}
  ro.a2.unit81.lesson02.exercise06.traduce_vazuse: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Ana văzuse trenul.", "status": "correct"}, {"value": "Ana văzuse trenul", "status": "correct"}], "feedback": "*Văzuse* is the form of *a vedea* for *ea*."}
  ro.a2.unit81.lesson02.exercise07.scrie_trezisem: {"instruction": "Write the requested Romanian sentence with a reflexive verb.", "correct_option": "Mă trezisem devreme.", "accepted_answers": [{"value": "Mă trezisem devreme.", "status": "correct"}, {"value": "Mă trezisem devreme", "status": "correct"}, {"value": "Eu mă trezisem devreme.", "status": "correct"}, {"value": "Eu mă trezisem devreme", "status": "correct"}], "feedback": "*Mă trezisem devreme* = I had woken up early."}
  ro.a2.unit81.lesson03.exercise01.elige_cand_am_ajuns: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Când am ajuns, trenul plecase deja.", "distractors": ["Când am ajuns, trenul pleacă deja.", "Când am ajuns, trenul plecam deja.", "Când am ajuns, trenul plecați deja."], "accepted_answers": [{"value": "Când am ajuns, trenul plecase deja.", "status": "correct"}], "feedback": "The train left before I arrived, so the train's action uses *plecase*."}
  ro.a2.unit81.lesson03.exercise02.elige_apoi: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Am ajuns, apoi trenul a plecat.", "distractors": ["Am ajuns, apoi trenul plecase.", "Am ajuns, apoi trenul plecaseră.", "Am ajuns, apoi trenul plecați."], "accepted_answers": [{"value": "Am ajuns, apoi trenul a plecat.", "status": "correct"}], "feedback": "Here the train left after I arrived, so the normal past *a plecat* is right."}
  ro.a2.unit81.lesson03.exercise03.une_contrast: {"instruction": "Match each Romanian sentence to its meaning.", "accepted_answers": [{"value": [{"left": "Trenul plecase deja.", "right": "The train had already left."}, {"left": "Trenul a plecat.", "right": "The train left."}, {"left": "Când am ajuns, trenul plecase.", "right": "When I arrived, the train had left."}, {"left": "Am ajuns, apoi trenul a plecat.", "right": "I arrived, then the train left."}, {"left": "Nu ajunsesem încă.", "right": "I had not arrived yet."}, {"left": "Ana mâncase deja.", "right": "Ana had already eaten."}, {"left": "Am luat un taxi.", "right": "I took a taxi."}, {"left": "Trenul nu plecase încă.", "right": "The train had not left yet."}], "status": "correct"}], "feedback": "Compare *plecase* (earlier) with *a plecat* (the normal past)."}
  ro.a2.unit81.lesson03.exercise04.ordoneaza_cand: {"instruction": "Put the words in order to say 'When I arrived, the train had already left.' Start with the time.", "correct_option": "Când am ajuns trenul plecase deja", "accepted_answers": [{"value": "Când am ajuns trenul plecase deja", "status": "correct"}, {"value": "Când am ajuns trenul deja plecase", "status": "correct"}, {"value": "Trenul plecase deja când am ajuns", "status": "correct"}], "feedback": "*Când am ajuns, trenul plecase deja.*"}
  ro.a2.unit81.lesson03.exercise05.completeaza_ajunsese: {"instruction": "Complete with the form of *a ajunge* that means 'had arrived' (she).", "correct_option": "ajunsese", "orthography_strict": true, "accepted_answers": [{"value": "ajunsese", "status": "correct"}], "feedback": "*Ana nu ajunsese încă*: Ana was not there yet when I arrived."}
  ro.a2.unit81.lesson03.exercise06.traduce_ana_mancase: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Când am ajuns, Ana mâncase deja.", "status": "correct"}, {"value": "Când am ajuns, Ana mâncase deja", "status": "correct"}, {"value": "Când am ajuns, Ana deja mâncase.", "status": "correct"}, {"value": "Când am ajuns, Ana deja mâncase", "status": "correct"}, {"value": "Ana mâncase deja când am ajuns.", "status": "correct"}, {"value": "Ana mâncase deja când am ajuns", "status": "correct"}, {"value": "Ana deja mâncase când am ajuns.", "status": "correct"}, {"value": "Ana deja mâncase când am ajuns", "status": "correct"}], "feedback": "*Ana mâncase deja* happened before *am ajuns*."}
  ro.a2.unit81.lesson03.exercise07.scrie_apoi: {"instruction": "Write the requested Romanian sentence with *apoi*.", "correct_option": "Am ajuns, apoi trenul a plecat.", "accepted_answers": [{"value": "Am ajuns, apoi trenul a plecat.", "status": "correct"}, {"value": "Am ajuns, apoi trenul a plecat", "status": "correct"}, {"value": "Am ajuns și apoi trenul a plecat.", "status": "correct"}, {"value": "Am ajuns și apoi trenul a plecat", "status": "correct"}], "feedback": "*Am ajuns, apoi trenul a plecat.* The normal past for two events in order."}
  ro.a2.unit81.lesson04.exercise01.elige_dupa_ce: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "După ce a plecat trenul, am luat un taxi.", "distractors": ["După ce am plecat trenul, am luat un taxi.", "După ce a pleca trenul, am luat un taxi.", "După ce plecați trenul, am luat un taxi."], "accepted_answers": [{"value": "După ce a plecat trenul, am luat un taxi.", "status": "correct"}], "feedback": "After *după ce*, the verb is in the normal past: *a plecat*."}
  ro.a2.unit81.lesson04.exercise02.elige_mancat: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "După ce am mâncat, am plecat.", "distractors": ["După ce a mânca, am plecat.", "După ce mâncați, am plecat.", "După ce am mânca, am plecat."], "accepted_answers": [{"value": "După ce am mâncat, am plecat.", "status": "correct"}], "feedback": "*După ce am mâncat*: *am* plus the participle *mâncat*."}
  ro.a2.unit81.lesson04.exercise03.une_conectori: {"instruction": "Match each Romanian word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "după ce", "right": "after"}, {"left": "deja", "right": "already"}, {"left": "încă nu", "right": "not yet"}, {"left": "apoi", "right": "then"}, {"left": "când", "right": "when"}, {"left": "a aștepta", "right": "to wait"}, {"left": "a lua un taxi", "right": "to take a taxi"}, {"left": "înainte să", "right": "before"}], "status": "correct"}], "feedback": "These words help you order events."}
  ro.a2.unit81.lesson04.exercise04.ordoneaza_dupa_ce: {"instruction": "Put the words in order to say 'After the train left, I took a taxi.'", "correct_option": "După ce a plecat trenul am luat un taxi", "accepted_answers": [{"value": "După ce a plecat trenul am luat un taxi", "status": "correct"}, {"value": "Am luat un taxi după ce a plecat trenul", "status": "correct"}], "feedback": "*După ce a plecat trenul, am luat un taxi.*"}
