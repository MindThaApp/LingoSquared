teaching:
  ro.c1.unit04.concesie_contraargument.lesson01.teach.aveti_dreptate: {title: "you are right in one respect", gloss: "You are right in one respect, the project is ambitious.", note: "*Aveți dreptate într-o privință* concedes without surrendering the argument."}
  ro.c1.unit04.concesie_contraargument.lesson01.teach.admit_ca: {title: "I admit that", gloss: "I admit that the argument carries weight.", note: "*Admit că* acknowledges the other side."}
  ro.c1.unit04.concesie_contraargument.lesson02.teach.totusi: {title: "however", gloss: "However, precisely this ambition requires a testing stage.", note: "*Totuși* pivots from concession to counterpoint."}
