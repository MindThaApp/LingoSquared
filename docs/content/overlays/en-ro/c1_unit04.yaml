      - {value: "Aveți dreptate într-o privință proiectul este ambițios", status: correct}
    orthography_strict: true
    feedback: "Aveți dreptate într-o privință, proiectul este ambițios."
  ro.c1.unit04.concesie_contraargument.lesson02.exercise01.recognize_counter:
    instruction: "Which phrase counters the pace without rejecting the objective?"
    correct_option: "Nu contest obiectivul, ci ritmul propus"
    distractors: ["Aveți dreptate în tot", "Proiectul nu are obiectiv", "Vă rog să primiți scuzele"]
    accepted_answers: [{value: "Nu contest obiectivul, ci ritmul propus", status: correct}]
    feedback: "The disagreement is narrowed to the pace."
  ro.c1.unit04.concesie_contraargument.lesson02.exercise02.order_counter:
    instruction: "Put the Romanian words in order."
    accepted_answers: [{value: "Nu contest obiectivul ci ritmul propus", status: correct}]
    feedback: "Nu contest obiectivul, ci ritmul propus."
