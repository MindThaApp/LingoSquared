course:
  title: Romanian C1
  description: "Advanced Romanian concession and counterargument."
units:
  ro.c1.unit04.concesie_contraargument:
    title: "Concession and Counterargument"
    description: "Concede, narrow, counter, and propose an alternative with subtlety."
