      - {value: "Nu contest obiectivul ci ritmul propus.", status: correct}
      - {value: "Nu contest obiectivul ci ritmul propus", status: correct}
    feedback: "Nu contest obiectivul, ci ritmul propus."
  ro.c1.unit04.concesie_contraargument.lesson03.exercise01.recognize_proposal:
    instruction: "Which phrase offers a constructive alternative?"
    correct_option: "să reducem riscul printr-un pilot scurt"
    distractors: ["refuzul nu este direct", "procedura a eșuat", "fără să spună direct"]
    accepted_answers: [{value: "să reducem riscul printr-un pilot scurt", status: correct}]
    feedback: "The phrase proposes a risk-reducing pilot."
  ro.c1.unit04.concesie_contraargument.lesson03.exercise02.match_proposal:
    instruction: "Match each Romanian proposal phrase to its English meaning."
    accepted_answers:
      - value: {"Ar fi": "It would be", "mai convingător": "more convincing", "să păstrăm": "to keep", "direcția": "the direction", "să reducem riscul": "to reduce the risk", "printr-un pilot scurt": "through a short pilot"}
        status: correct
    feedback: "These phrases turn the counterargument into a proposal."
  ro.c1.unit04.concesie_contraargument.lesson03.exercise03.write_proposal:
    instruction: "Write in Romanian: It would be more convincing to keep the direction and to reduce the risk through a short pilot."
