exercises:
  ro.c1.unit04.concesie_contraargument.lesson01.exercise01.recognize_concession:
    instruction: "Which phrase concedes part of the other person's argument?"
    correct_option: "Aveți dreptate într-o privință"
    distractors: ["Ritmul propus", "Revenind la ideea principală", "În subtext"]
    accepted_answers: [{value: "Aveți dreptate într-o privință", status: correct}]
    feedback: "*Aveți dreptate într-o privință* concedes one point."
  ro.c1.unit04.concesie_contraargument.lesson01.exercise02.listen_concession:
    instruction: "Listen and select the best meaning."
    correct_option: "You are right in one respect, the project is ambitious."
    distractors: ["You are wrong in every respect.", "The project is already cancelled.", "The project has no ambition."]
    accepted_answers: [{value: "You are right in one respect, the project is ambitious.", status: correct}]
    feedback: "The sentence concedes one valid point."
  ro.c1.unit04.concesie_contraargument.lesson01.exercise03.match_concession:
    instruction: "Match each Romanian concession phrase to its English meaning."
    accepted_answers:
      - value: {"Aveți dreptate": "you are right, formal", "într-o privință": "in one respect", "proiectul": "the project", "ambițios": "ambitious", "admit că": "I admit that", "are greutate": "carries weight"}
        status: correct
    feedback: "These phrases concede without ending the argument."
  ro.c1.unit04.concesie_contraargument.lesson01.exercise04.dictation_concession:
    instruction: "Type exactly what you hear."
    accepted_answers:
      - {value: "Aveți dreptate într-o privință, proiectul este ambițios.", status: correct}
      - {value: "Aveți dreptate într-o privință, proiectul este ambițios", status: correct}
