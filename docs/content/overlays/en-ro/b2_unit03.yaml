course:
  title: Romanian B2
  description: >-
    Upper-intermediate Romanian: soften or strengthen a statement so the
    same content can be delivered tentatively, neutrally, or emphatically
    (cam, oarecum, aș spune că, chiar, foarte, într-adevăr, ceea ce ... a
    fost, tocmai), around the everyday workplace scenario of giving
    feedback on a colleague's report.

units:
  ro.b2.unit03.nuante:
    title: "Nuance"
    description: Soften or strengthen a statement -- hedge a criticism, formulate cautiously, emphasize praise, and focus on one specific element -- while giving feedback on a colleague's work.

lessons:
  ro.b2.unit03.lesson01.atenuare:
    title: "Softening a criticism"
  ro.b2.unit03.lesson02.formulare_prudenta:
    title: "Formulating cautiously"
  ro.b2.unit03.lesson03.accentuare:
    title: "Emphasizing praise"
  ro.b2.unit03.lesson04.focalizare:
    title: "Putting the focus on one element"
  ro.b2.unit03.lesson05.nota_de_feedback:
    title: "Reading a feedback note"
  ro.b2.unit03.lesson06.conversatia_de_feedback:
    title: "A feedback conversation"

teaching:
  ro.b2.unit03.lesson01.teach.raportul:
    title: "the report"
    gloss: "the report"
    note: "The workplace object this whole unit gives feedback about."
    example_gloss: "Diana's report is good."
  ro.b2.unit03.lesson01.teach.introducerea:
    title: "the introduction"
    gloss: "the introduction"
    example_gloss: "The introduction is short."
  ro.b2.unit03.lesson01.teach.cam:
    title: "rather / somewhat"
    gloss: "rather / somewhat (softens a criticism)"
    note: "*Cam* softens a criticism before you state it: 'rather long' reads gentler than a bare 'long'. Slightly more colloquial than *oarecum* (next card)."
    example_gloss: "It is rather late."
  ro.b2.unit03.lesson01.teach.oarecum:
    title: somewhat
    gloss: "somewhat / rather"
    note: "*Oarecum* does the same softening job as *cam*, but reads a touch more formal -- well suited to written feedback."
    example_gloss: "It is somewhat difficult."
  ro.b2.unit03.lesson01.teach.lunga:
    title: long
    gloss: "long (feminine form)"
    note: "*Lungă* agrees with the feminine noun *introducerea*; the masculine/neuter form is *lung*."
    example_gloss: "The introduction is long."
  ro.b2.unit03.lesson01.teach.scurta:
    title: short
    gloss: "short (feminine form)"
    example_gloss: "The conclusion is short."
  ro.b2.unit03.lesson01.teach.concluzia:
    title: "the conclusion"
    gloss: "the conclusion"
    example_gloss: "The conclusion is short."
  ro.b2.unit03.lesson01.teach.neclara:
    title: unclear
    gloss: "unclear (feminine form)"
    example_gloss: "The idea is unclear."
  ro.b2.unit03.lesson01.teach.personal_cred_ca:
    title: "Personally, I think that..."
    gloss: "Personally, I think that..."
    note: "*Personal* marks the opinion as your own, individual view -- a common way to soften a criticism by owning it rather than stating it as flat fact."
  ro.b2.unit03.lesson01.teach.mi_se_pare_ca:
    title: "it seems to me that..."
    gloss: "it seems to me that..."
    note: "*Mi se pare că...* is another hedge -- it presents the criticism as your impression, not an absolute judgement."
  ro.b2.unit03.lesson01.teach.grammar_atenuare:
    title: "The introduction is rather long. It seems to me that it is somewhat long. Personally, I think the conclusion is short."
    gloss: "The introduction is rather long. It seems to me that it is somewhat long. Personally, I think the conclusion is short."
    note: "Softening a criticism = stating it through a hedge (*cam*, *oarecum*) or an owned opinion (*personal, cred că*, *mi se pare că*) rather than as a flat, unqualified judgement."

  ro.b2.unit03.lesson02.teach.as_spune_ca:
    title: "I would say that..."
    gloss: "I would say that... (conditional, tentative)"
    note: "*Aș spune că...* uses the conditional mood of *a spune* (to say) to present an opinion tentatively, as a suggestion rather than a verdict."
  ro.b2.unit03.lesson02.teach.sar_putea_spune_ca:
    title: "one could say that..."
    gloss: "one could say that..."
    note: "*S-ar putea spune că...* distances the claim even further -- 'one could say', not 'I say'. You already met *s-ar putea* for guessing about facts; here it softens an opinion instead."
  ro.b2.unit03.lesson02.teach.pana_la_un_punct:
    title: "up to a point"
    gloss: "up to a point / to some extent"
    note: "*Până la un punct* limits how far a claim goes -- 'successful, but not entirely'."
  ro.b2.unit03.lesson02.teach.relativ:
    title: relatively
    gloss: relatively
    example_gloss: "It is relatively easy."
  ro.b2.unit03.lesson02.teach.stilul:
    title: "the style"
    gloss: "the style"
    example_gloss: "The style is formal."
  ro.b2.unit03.lesson02.teach.formal:
    title: formal
    gloss: formal
    example_gloss: "The tone is formal."
  ro.b2.unit03.lesson02.teach.reusit:
    title: successful
    gloss: "successful (reușită is the feminine form)"
    example_gloss: "The report is successful."
  ro.b2.unit03.lesson02.teach.grammar_prudenta:
    title: "I would say the style is relatively formal. One could say the report is up to a point successful."
    gloss: "I would say the style is relatively formal. One could say the report is up to a point successful."
    note: "Formulating cautiously = distancing yourself from a flat claim with a conditional (*aș spune că*, *s-ar putea spune că*) and limiting its scope (*până la un punct*, *relativ*)."

  ro.b2.unit03.lesson03.teach.chiar:
    title: "really / truly"
    gloss: "really / truly (intensifier)"
    note: "*Chiar* strengthens the word that follows. It can also stack with another intensifier for extra force: *chiar foarte bună* = 'really very good'."
    example_gloss: "It is really good."
  ro.b2.unit03.lesson03.teach.foarte:
    title: very
    gloss: very
    example_gloss: "It is very clear."
  ro.b2.unit03.lesson03.teach.extrem_de:
    title: extremely
    gloss: extremely
    example_gloss: "It is extremely good."
  ro.b2.unit03.lesson03.teach.absolut:
    title: absolutely
    gloss: absolutely
    example_gloss: "It is absolutely correct."
  ro.b2.unit03.lesson03.teach.intr_adevar:
    title: indeed
    gloss: "indeed / truly"
    note: "*Într-adevăr* confirms something strongly. It can open the sentence, set off by a comma (*Într-adevăr, raportul este bun*), or sit right before the word it reinforces, as here."
    example_gloss: "It is indeed impressive."
  ro.b2.unit03.lesson03.teach.analiza:
    title: "the analysis"
    gloss: "the analysis"
    example_gloss: "The analysis is good."
  ro.b2.unit03.lesson03.teach.clara:
    title: clear
    gloss: "clear (feminine form)"
    example_gloss: "The explanation is clear."
  ro.b2.unit03.lesson03.teach.grammar_accentuare:
    title: "The conclusion is really very good. The analysis is extremely clear. It is absolutely successful. Indeed, the report is good."
    gloss: "The conclusion is really very good. The analysis is extremely clear. It is absolutely successful. Indeed, the report is good."
    note: "Emphasizing praise = stacking or choosing a strong intensifier (*chiar*, *foarte*, *extrem de*, *absolut*, *într-adevăr*) so the compliment lands with real force, not a flat 'good'."

  ro.b2.unit03.lesson04.teach.ceea_ce:
    title: "what..."
    gloss: "what... (introduces a focus construction)"
    note: "*Ceea ce...* opens a cleft sentence that puts one specific element in focus: *Ceea ce mi-a plăcut ... a fost X* = 'What I liked ... was X'."
  ro.b2.unit03.lesson04.teach.mi_a_placut:
    title: "I liked"
    gloss: "I liked (mi-a plăcut, from a plăcea, to please/like)"
    example_gloss: "I liked the analysis."
  ro.b2.unit03.lesson04.teach.cel_mai_mult:
    title: "the most"
    gloss: "the most"
  ro.b2.unit03.lesson04.teach.a_fost:
    title: was
    gloss: "was (from a fi, to be)"
    example_gloss: "The report was good."
  ro.b2.unit03.lesson04.teach.tocmai:
    title: "precisely / exactly"
    gloss: "precisely / exactly (focuses on one element)"
    note: "*Tocmai* puts emphasis directly on the word that follows it: 'precisely the conclusion', not some other part."
    example_gloss: "That is precisely what I wanted to say."
  ro.b2.unit03.lesson04.teach.partea:
    title: "the part"
    gloss: "the part"
    example_gloss: "This is the clearest part."
  ro.b2.unit03.lesson04.teach.cea_mai:
    title: "the most (feminine)"
    gloss: "the most (feminine agreement, with partea)"
  ro.b2.unit03.lesson04.teach.grammar_focalizare:
    title: "What I liked most was the analysis. Precisely the conclusion is the most successful part."
    gloss: "What I liked most was the analysis. Precisely the conclusion is the most successful part."
    note: "A focus construction singles out ONE element as the important one: the cleft *ceea ce ... a fost* fronts it as the answer to an implied question; *tocmai* pins emphasis directly onto the word beside it."

  ro.b2.unit03.lesson05.teach.text:
    title: "Reading: Mihai's feedback on Diana's report"
    gloss: "Diana's report is very good. The introduction is rather long, but the conclusion is really successful. I would say the style is relatively formal. What I liked most was the analysis -- it is indeed impressive."
    glosses:
      impresionantă: impressive

  ro.b2.unit03.lesson06.teach.ce_credeti_despre_raport:
    title: "What do you think about the report?"
    gloss: "What do you think about the report? (formal)"
    note: "*Credeți* is the formal (dumneavoastră) form of *a crede*, to think/believe -- the polite way to ask a colleague for an opinion."
  ro.b2.unit03.lesson06.teach.ce_parte_v_a_placut:
    title: "Which part did you like most?"
    gloss: "Which part did you like most? (formal)"
    note: "*V-a plăcut* is the formal (dumneavoastră) 'you liked' -- *v-* = 'to you', just as *mi-* in *mi-a plăcut* = 'to me'. Literally 'it pleased you': as with *mi-a plăcut*, the thing liked is the subject."
  ro.b2.unit03.lesson06.teach.multumesc_pentru_feedback:
    title: "Thank you for the feedback."
    gloss: "Thank you for the feedback."
  ro.b2.unit03.lesson06.teach.dialogue_diana_ask:
    title: "Diana: What do you think about the report?"
    gloss: "Diana: What do you think about the report?"
  ro.b2.unit03.lesson06.teach.dialogue_mihai_hedge:
    title: "Mihai: The introduction is rather long."
    gloss: "Mihai: The introduction is rather long."
  ro.b2.unit03.lesson06.teach.dialogue_mihai_praise:
    title: "Mihai: But the conclusion is really very good."
    gloss: "Mihai: But the conclusion is really very good."
  ro.b2.unit03.lesson06.teach.dialogue_mihai_qualify:
    title: "Mihai: One could say the report is up to a point successful."
    gloss: "Mihai: One could say the report is up to a point successful."
  ro.b2.unit03.lesson06.teach.dialogue_diana_ask_part:
    title: "Diana: Which part did you like most?"
    gloss: "Diana: Which part did you like most?"
  ro.b2.unit03.lesson06.teach.dialogue_mihai_focus:
    title: "Mihai: What I liked most was the analysis."
    gloss: "Mihai: What I liked most was the analysis."
  ro.b2.unit03.lesson06.teach.dialogue_diana_thanks:
    title: "Diana: Thank you for the feedback."
    gloss: "Diana: Thank you for the feedback."
  ro.b2.unit03.lesson06.teach.grammar_nuanta_completa:
    title: "The introduction is rather long. But the conclusion is really very good. One could say the report is up to a point successful. What I liked most was the analysis."
    gloss: "The introduction is rather long. But the conclusion is really very good. One could say the report is up to a point successful. What I liked most was the analysis."
    note: "Full feedback combines all four moves: hedge the criticism (*cam*), strengthen the praise (*chiar foarte*), qualify the overall verdict (*s-ar putea spune că ... până la un punct*), and focus on one element (*ceea ce ... a fost*)."

exercises:
  ro.b2.unit03.lesson01.exercise01.recognize_cam:
    instruction: "What does this word mean?"
    correct_option: "rather / somewhat"
    distractors: [very, absolutely, precisely]
    accepted_answers: [{value: "rather / somewhat", status: correct}]
    feedback: "Cam softens a criticism -- rather / somewhat."
  ro.b2.unit03.lesson01.exercise02.listen_introducerea_lunga:
    instruction: "Listen and select what you hear."
    correct_option: "The introduction is rather long."
    distractors: ["The introduction is very long.", "The introduction is rather short.", "The conclusion is rather long."]
    accepted_answers: [{value: "The introduction is rather long.", status: correct}]
    feedback: "Introducerea este cam lungă means the introduction is rather long."
  ro.b2.unit03.lesson01.exercise03.match_hedge_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {raportul: "the report", introducerea: "the introduction", cam: "rather / a bit (casual)", oarecum: "somewhat (more formal, written)", lungă: long, scurtă: short, "Personal, cred că...": "Personally, I think that...", "mi se pare că...": "it seems to me that..."}
        status: correct
    feedback: "These are this lesson's hedging words."
  ro.b2.unit03.lesson01.exercise04.order_introducerea_lunga:
    instruction: "Put the words in order: The introduction is rather long."
    accepted_answers:
      - {value: "Introducerea este cam lungă", status: correct}
    feedback: "Introducerea este cam lungă means the introduction is rather long."
  ro.b2.unit03.lesson01.exercise05.translate_oarecum_neclara:
    instruction: "Translate into Romanian, using oarecum: The conclusion is somewhat unclear."
    accepted_answers:
      - {value: "Concluzia este oarecum neclară", status: correct}
    feedback: "Concluzia este oarecum neclară means the conclusion is somewhat unclear."
  ro.b2.unit03.lesson01.exercise06.speak_personal_cred:
    instruction: "Say aloud in Romanian, using cam: Personally, I think the introduction is rather long."
    accepted_answers:
      - {value: "Personal, cred că introducerea este cam lungă", status: correct}
      - {value: "Personal cred că introducerea este cam lungă", status: correct}
    feedback: "Personal, cred că introducerea este cam lungă means personally, I think the introduction is rather long."
  ro.b2.unit03.lesson01.exercise07.write_mi_se_pare:
    instruction: "Write in Romanian, using mi se pare că and oarecum: It seems to me that the conclusion is somewhat unclear."
    accepted_answers:
      - {value: "Mi se pare că concluzia este oarecum neclară", status: correct}
    feedback: "Mi se pare că concluzia este oarecum neclară means it seems to me that the conclusion is somewhat unclear."
  ro.b2.unit03.lesson01.exercise08.dictation_introducerea_lunga:
    instruction: "Type what you hear."
    correct_response: "Introducerea este cam lungă"
    orthography_strict: true
    feedback: "You heard Introducerea este cam lungă — the introduction is rather long."

  ro.b2.unit03.lesson02.exercise01.recognize_relativ:
    instruction: "What does this word mean?"
    correct_option: relatively
    distractors: [absolutely, precisely, rarely]
    accepted_answers: [{value: relatively, status: correct}]
    feedback: "Relativ means relatively."
  ro.b2.unit03.lesson02.exercise02.listen_raport_reusit:
    instruction: "Listen and select what you hear."
    correct_option: "One could say the report is up to a point successful."
    distractors: ["The report is completely successful.", "One could say the report is not successful.", "One could say the style is up to a point formal."]
    accepted_answers: [{value: "One could say the report is up to a point successful.", status: correct}]
    feedback: "S-ar putea spune că raportul este până la un punct reușit means one could say the report is up to a point successful."
  ro.b2.unit03.lesson02.exercise03.match_tentative_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"aș spune că...": "I would say that...", "s-ar putea spune că...": "one could say that...", "până la un punct": "up to a point", relativ: relatively, stilul: "the style", formal: formal, reușit: successful}
        status: correct
    feedback: "These are this lesson's cautious-formulation words."
  ro.b2.unit03.lesson02.exercise04.order_raport_reusit:
    instruction: "Put the words in order: One could say the report is up to a point successful."
    accepted_answers:
      - {value: "S-ar putea spune că raportul este până la un punct reușit", status: correct}
    feedback: "S-ar putea spune că raportul este până la un punct reușit means one could say the report is up to a point successful."
  ro.b2.unit03.lesson02.exercise05.translate_as_spune_stilul:
    instruction: "Translate into Romanian, using aș spune că: I would say the style is relatively formal."
    accepted_answers:
      - {value: "Aș spune că stilul este relativ formal", status: correct}
    feedback: "Aș spune că stilul este relativ formal means I would say the style is relatively formal."
  ro.b2.unit03.lesson02.exercise06.speak_pana_la_un_punct:
    instruction: "Say aloud in Romanian: The report is, up to a point, successful."
    accepted_answers:
      - {value: "Raportul este până la un punct reușit", status: correct}
      - {value: "Raportul este reușit până la un punct", status: correct}
    feedback: "Raportul este până la un punct reușit means the report is, up to a point, successful."
  ro.b2.unit03.lesson02.exercise07.write_both_tentative:
    instruction: "Write these two sentences in Romanian, using aș spune că and s-ar putea spune că: I would say the style is relatively formal. One could say the report is up to a point successful."
    accepted_answers:
      - {value: "Aș spune că stilul este relativ formal. S-ar putea spune că raportul este până la un punct reușit", status: correct}
      - {value: "Aș spune că stilul este relativ formal. S-ar putea spune că raportul este până la un punct reușit.", status: correct}
    feedback: "Aș spune că stilul este relativ formal. S-ar putea spune că raportul este până la un punct reușit."

  ro.b2.unit03.lesson03.exercise01.recognize_chiar:
    instruction: "What does this word mean?"
    correct_option: "really / truly"
    distractors: [rather, "up to a point", precisely]
    accepted_answers: [{value: "really / truly", status: correct}]
    feedback: "Chiar strengthens the word after it -- really / truly."
  ro.b2.unit03.lesson03.exercise02.listen_concluzie_buna:
    instruction: "Listen and select what you hear."
    correct_option: "The conclusion is really very good."
    distractors: ["The conclusion is rather good.", "The introduction is really very good.", "The conclusion is really very bad."]
    accepted_answers: [{value: "The conclusion is really very good.", status: correct}]
    feedback: "Concluzia este chiar foarte bună means the conclusion is really very good."
  ro.b2.unit03.lesson03.exercise03.match_emphasis_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {chiar: "really / truly", foarte: very, "extrem de": extremely, absolut: absolutely, "într-adevăr": indeed, analiza: "the analysis", clară: clear}
        status: correct
    feedback: "These are this lesson's emphasis words."
  ro.b2.unit03.lesson03.exercise04.order_concluzie_buna:
    instruction: "Put the words in order: The conclusion is really very good."
    accepted_answers:
      - {value: "Concluzia este chiar foarte bună", status: correct}
    feedback: "Concluzia este chiar foarte bună means the conclusion is really very good."
  ro.b2.unit03.lesson03.exercise05.translate_analiza_clara:
    instruction: "Translate into Romanian, using extrem de: The analysis is extremely clear."
    accepted_answers:
      - {value: "Analiza este extrem de clară", status: correct}
    feedback: "Analiza este extrem de clară means the analysis is extremely clear."
  ro.b2.unit03.lesson03.exercise06.write_absolut_reusit:
    instruction: "Write in Romanian, using absolut: It is absolutely successful."
    accepted_answers:
      - {value: "Este absolut reușit", status: correct}
    feedback: "Este absolut reușit means it is absolutely successful."
  ro.b2.unit03.lesson03.exercise07.speak_intr_adevar:
    instruction: "Say aloud in Romanian: Indeed, the report is good."
    accepted_answers:
      - {value: "Într-adevăr, raportul este bun", status: correct}
      - {value: "Într-adevăr raportul este bun", status: correct}
    feedback: "Într-adevăr, raportul este bun means indeed, the report is good."
  ro.b2.unit03.lesson03.exercise08.dictation_concluzie_buna:
    instruction: "Type what you hear."
    correct_response: "Concluzia este chiar foarte bună"
    orthography_strict: true
    feedback: "You heard Concluzia este chiar foarte bună — the conclusion is really very good."

  ro.b2.unit03.lesson04.exercise01.recognize_tocmai:
    instruction: "What does this word mean?"
    correct_option: "precisely / exactly"
    distractors: [rather, extremely, "somewhat"]
    accepted_answers: [{value: "precisely / exactly", status: correct}]
