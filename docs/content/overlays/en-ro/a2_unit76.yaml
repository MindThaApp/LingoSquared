teaching:
  ro.a2.unit76.lesson01.teach.a_muta_a:
    title: Changing an appointment
    gloss: to move (an appointment) / to cancel
    note: '*A muta o programare* means to move it to another time. *A anula* means to cancel it completely.'
    example_gloss:
    - I want to move my appointment.
    - I have to cancel my appointment.
  ro.a2.unit76.lesson01.teach.din_pacate_scuze:
    title: Saying you are sorry
    gloss: unfortunately / sorry
    note: '*Din păcate* is a polite way to give bad news. *Scuze* is the everyday apology.'
    example_gloss:
    - Unfortunately I cannot come.
    - Sorry, I am too late.
  ro.a2.unit76.lesson01.teach.salonul:
    title: The hairdresser's
    gloss: the hairdresser's (salon)
    note: '*Salonul* is the place; *frizerul* or *coafeza* is the person. People often say *merg la frizer* or *la coafor*.'
    example_gloss: The salon is open from nine to six.
  ro.a2.unit76.lesson01.teach.pot_sa_mi:
    title: Asking to move an appointment
    gloss: Can I move my appointment?
    note: 'A yes/no question starts with the verb: *Pot să ...?* After *să* the verb is conjugated: *să-mi mut*. The clitic *-mi* means ''my'' here.'
  ro.a2.unit76.lesson01.teach.din_pacate_nu:
    title: Saying you cannot come
    gloss: Unfortunately I cannot come.
  ro.a2.unit76.lesson01.teach.nu_pot_veni:
    title: Pot + infinitive
    gloss: I cannot come on Thursday. Can I move the appointment?
    note: 'After *pot* you can put an infinitive without *a*: *pot veni*. With *să* the next verb is conjugated: *pot să-mi mut programarea*. *Nu* goes directly before *pot*: *Nu pot veni joi*. A time word like *joi* comes after the verb.'
  ro.a2.unit76.lesson02.teach.o_alta_zi:
    title: Another day
    gloss: another day
    note: '*Altă* is the feminine form of *alt*, because *zi* is feminine: *o altă zi*.'
    example_gloss: Can it also be on another day?
  ro.a2.unit76.lesson02.teach.se_poate_si:
    title: Suggesting a day
    gloss: Can it also be Monday?
    note: 'No preposition is needed before a weekday here: *luni*, not *în luni*. *Se poate și luni?* is literally ''Is it also possible on Monday?'''
  ro.a2.unit76.lesson02.teach.va_convine_vineri:
    title: Does it suit you?
    gloss: Does Friday suit you? (formal)
    note: '*A conveni* means ''to suit''. The person it suits is an object pronoun before the verb: *vă convine* (formal), *îmi convine* (me). *Vă* is used with someone you do not know well.'
  ro.a2.unit76.lesson02.teach.da_imi_convine:
    title: Saying yes
    gloss: Yes, that suits me well.
  ro.a2.unit76.lesson02.teach.din_pacate_nu:
    title: Saying no politely
    gloss: Unfortunately not.
  ro.a2.unit76.lesson02.teach.va_convine_vineri_2:
    title: Does it suit you?
    gloss: Does Friday suit you? Yes, that suits me well. No, unfortunately not.
    note: '*A conveni* works with a pronoun that shows who it suits: *Vă convine vineri?* The answer *Da, îmi convine foarte bine* confirms. A polite refusal is *Nu, din păcate nu*. The pronoun comes before the verb; nothing moves to the end of the sentence.'
  ro.a2.unit76.lesson03.teach.pentru_ca_imi:
    title: Because and I am sorry
    gloss: because / I am sorry
    note: '*Pentru că* (or *fiindcă*) joins two full sentences and gives the reason. *Îmi pare rău* is a more careful apology than *scuze*.'
    example_gloss:
    - I cannot come, because I am ill.
    - I am sorry.
  ro.a2.unit76.lesson03.teach.deranjul:
    title: Inconvenience
    gloss: the inconvenience
    note: '*Scuze pentru deranj* is a polite phrase after you have caused someone extra trouble.'
    example_gloss: Sorry for the inconvenience.
  ro.a2.unit76.lesson03.teach.nu_pot_veni:
    title: 'Reason: work'
    gloss: I cannot come, because I have to work.
  ro.a2.unit76.lesson03.teach.nu_pot_veni_2:
    title: 'Reason: another appointment'
    gloss: I cannot come, because I have another appointment.
  ro.a2.unit76.lesson03.teach.nu_pot_veni_3:
    title: 'Because: want'
    gloss: I cannot come, because I am ill.
    note: 'After *pentru că* the word order is the ordinary one: subject, then verb. Put a comma before it: *Nu pot veni, pentru că sunt bolnav.* *Fiindcă* means the same; *deoarece* is more formal.'
  ro.a2.unit76.lesson04.teach.a_stabili_din:
    title: Agreeing and in advance
    gloss: to arrange / in advance
    note: '*A stabili* is to agree on a time or place. *Din timp* means ''beforehand'', ''in advance''.'
    example_gloss:
    - Shall we arrange something?
    - Call a day in advance.
  ro.a2.unit76.lesson04.teach.luni_la_ora:
    title: Accepting a time
    gloss: Monday at ten o'clock is fine.
  ro.a2.unit76.lesson04.teach.puteti_veni_luni:
    title: Asking if a time works
    gloss: Can you come on Monday at ten o'clock? (formal)
    note: '*Puteți* is the polite form of *poți*. The infinitive *veni* follows directly.'
  ro.a2.unit76.lesson04.teach.atunci_ne_vedem:
    title: Closing the arrangement
    gloss: Then I will see you on Monday.
  ro.a2.unit76.lesson04.teach.atunci_fac_o:
    title: Making a new appointment
    gloss: Then I will make a new appointment.
  ro.a2.unit76.lesson04.teach.luni_la_ora_2:
    title: Day first, then la ora + time
    gloss: Monday at ten o'clock is fine. Can you come on Monday at ten o'clock?
    note: 'When you give a day and a time, the day comes first and then *la ora* + the number: *luni la ora zece*. In a polite question use *Puteți ...?* and the infinitive.'
  ro.a2.unit76.lesson05.teach.stimate_mihai_programarea:
    title: A message from the salon
    gloss: Dear Mihai, your appointment has been moved. Your new appointment is Monday at ten o'clock. Does this not suit you? Then call us a day in advance. Then we will make a new appointment. See you Monday! Popescu salon
    note: This is a typical short message from a business, so it uses the polite *dumneavoastră* and *vă*. *A fost mutată* means 'has been moved'.
    glosses:
      stimate: dear
      mihai: Mihai
      dumneavoastră: your (formal)
      programarea: appointment
      mutată: moved
      noua: new
      luni: Monday
      zece: ten
      ora: o'clock
      convine: suits (convine = it suits)
      această: this
      nu: not
      vă: you (formal, as in vă convine)
      sunați: call
      ne: us
      atunci: then
      înainte: in advance
      facem: make
      noi: we
      vedem: until, see you
      salon: hairdresser's
      popescu: Popescu
  ro.a2.unit76.lesson06.teach.salon_popescu_buna:
    title: The salon answers
    gloss: 'Hairdresser: Popescu salon, good afternoon.'
  ro.a2.unit76.lesson06.teach.buna_ziua_sunt:
    title: Mihai explains and asks
    gloss: 'Mihai: Good afternoon, you are speaking to Mihai. I have an appointment on Thursday, but unfortunately I cannot come. Can I move the appointment?'
  ro.a2.unit76.lesson06.teach.desigur_va_convine:
    title: The hairdresser suggests Friday
    gloss: 'Hairdresser: Of course. Does Friday suit you?'
  ro.a2.unit76.lesson06.teach.din_pacate_nu:
    title: Mihai suggests Monday
    gloss: 'Mihai: Unfortunately not, because I have to work. Can it also be Monday?'
  ro.a2.unit76.lesson06.teach.luni_la_ora:
    title: The hairdresser agrees
    gloss: 'Hairdresser: Monday at ten o''clock is fine.'
  ro.a2.unit76.lesson06.teach.imi_convine_foarte:
    title: Mihai accepts and apologises
    gloss: 'Mihai: That suits me well. Thank you very much and sorry for the inconvenience.'
  ro.a2.unit76.lesson06.teach.nicio_problema_ne:
    title: The hairdresser closes
    gloss: 'Hairdresser: No problem. See you Monday!'
