review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Romanian confirmation needed (DRAFT). Confirm the English
    glosses match idiomatic Romanian, that every matching_pairs
    right-hand gloss discriminates its left on real meaning, and that the
    culminating writing/speaking answers (lesson06) accept the
    punctuation forms a correct learner would actually produce. See the
    realization file's review block for the full priority list, including
    the lesson06 register shift to first-person narration.
  notes: >-
    Overlay for ro's fourth B2 unit, authored alongside the realization.
    English speakers' real interference risks for this outcome: (1)
    English "was going" covers both the imperfectul (mergea, an ongoing
    background action) and could be mistaken for a progressive that
    Romanian doesn't need a separate auxiliary for -- flagged in
    lesson01/03's grammar notes; (2) the pluperfect "fusese" (had been)
    has no easy word-for-word English cue beyond "had" -- flagged in
    lesson04; (3) "s-a stricat" is reflexive-passive (the car broke down
    BY ITSELF, no agent), which an English speaker might want to render
    with a transitive verb -- flagged in lesson02's grammar note; (4) the
    lesson06 shift from third-person narration (lessons 1-5) to
    first-person (Mihai telling Ana his own story) changes several verb
    forms (a plecat -> am plecat, mergea -> mergeam) that look similar but
    are NOT interchangeable -- every lesson06 gloss keeps the first-person
    forms distinct from their third-person counterparts taught earlier.
    No sibling-direction file (ro-en b2) was consulted.

course:
  title: Romanian B2
  description: >-
    Upper-intermediate Romanian: recount a complex sequence of past
    events with shifting time reference -- background versus foreground
    (era vs. a plecat), events before other past events (fusese), and an
    ongoing action interrupted by another event (când mergea, mașina s-a
    stricat) -- keeping the timeline unambiguous, around the story of a
    car breaking down on the way to an important meeting.

units:
  ro.b2.unit04.naratiune:
    title: "Narrative"
    description: Recount a complex sequence of past events with shifting time reference -- background versus foreground, events before other past events, and an ongoing action interrupted by another -- keeping the timeline clear.

lessons:
  ro.b2.unit04.lesson01.fundalul:
    title: "The background: how it was"
  ro.b2.unit04.lesson02.secventa:
    title: "The sequence of events"
  ro.b2.unit04.lesson03.intreruperea:
    title: "When, while"
  ro.b2.unit04.lesson04.plusquamperfectul:
    title: "The past before the past"
  ro.b2.unit04.lesson05.povestea_completa:
    title: "Reading a full story"
  ro.b2.unit04.lesson06.povestea_lui_mihai:
    title: "Mihai tells the story of his morning"

teaching:
  ro.b2.unit04.lesson01.teach.era_dimineata:
    title: "It was early morning."
    gloss: "It was early morning."
    note: "*Era* is the imperfectul (imperfect) of *a fi*, used for background description -- setting the scene before any event happens."
  ro.b2.unit04.lesson01.teach.ploua:
    title: "it was raining"
    gloss: "it was raining (imperfectul of a ploua, to rain)"
    note: "The imperfectul describes an ongoing state in the background, with no clear start or end point -- exactly the job background description needs."
    example_gloss: "Outside it was raining."
  ro.b2.unit04.lesson01.teach.usor:
    title: "lightly / easily"
    gloss: "lightly / easily"
    example_gloss: "It was raining lightly this morning."
  ro.b2.unit04.lesson01.teach.se_grabea:
    title: "was hurrying"
    gloss: "was hurrying (imperfectul, reflexive of a se grăbi)"
    example_gloss: "Mihai was hurrying in the morning."
  ro.b2.unit04.lesson01.teach.spre:
    title: towards
    gloss: towards
    example_gloss: "He was going towards the office."
  ro.b2.unit04.lesson01.teach.importanta:
    title: important
    gloss: "important (feminine form, agreeing with întâlnire)"
    example_gloss: "He had an important meeting."
  ro.b2.unit04.lesson01.teach.grammar_imperfect:
    title: "It was early morning. It was raining lightly. Mihai was hurrying towards an important meeting."
    gloss: "It was early morning. It was raining lightly. Mihai was hurrying towards an important meeting."
    note: "Background = the scene-setting facts true throughout the story, told with the imperfectul (*era*, *ploua*, *se grăbea*) -- no single completed action yet, just the ongoing situation."

  ro.b2.unit04.lesson02.teach.mai_intai:
    title: first
    gloss: "first / firstly"
    example_gloss: "First, he left home."
  ro.b2.unit04.lesson02.teach.a_plecat:
    title: left
    gloss: "left (perfectul compus of a pleca, to leave)"
    note: "The perfectul compus reports a single completed event that moves the story forward -- the foreground, as opposed to lesson01's background imperfectul."
    example_gloss: "Mihai left early."
  ro.b2.unit04.lesson02.teach.apoi:
    title: then
    gloss: then
    example_gloss: "Then, he called a taxi."
  ro.b2.unit04.lesson02.teach.sa_stricat:
    title: "broke down"
    gloss: "broke down (reflexive-passive, perfectul compus of a se strica)"
    note: "*S-a stricat* is reflexive-passive -- the car broke down by itself, with no agent causing it, unlike a transitive 'someone broke the car'."
    example_gloss: "The car broke down on the way."
  ro.b2.unit04.lesson02.teach.in_cele_din_urma:
    title: eventually
    gloss: "eventually / in the end"
  ro.b2.unit04.lesson02.teach.a_chemat:
    title: called
    gloss: "called (perfectul compus of a chema, to call/summon)"
    example_gloss: "He called a taxi."
  ro.b2.unit04.lesson02.teach.taxi:
    title: taxi
    gloss: taxi
    example_gloss: "The taxi came quickly."
  ro.b2.unit04.lesson02.teach.grammar_perfect_compus:
    title: "First, Mihai left home. Then, the car broke down. Eventually, he called a taxi."
    gloss: "First, Mihai left home. Then, the car broke down. Eventually, he called a taxi."
    note: "The foreground = the sequence of completed events that actually move the story forward, told with the perfectul compus (*a plecat*, *s-a stricat*, *a chemat*) and signposted with *mai întâi*, *apoi*, *în cele din urmă*."

  ro.b2.unit04.lesson03.teach.cand:
    title: when
    gloss: when
    example_gloss: "When he left, it was raining."
  ro.b2.unit04.lesson03.teach.mergea:
    title: "was going"
    gloss: "was going (imperfectul of a merge, to go)"
    note: "*Când mergea..., mașina s-a stricat* pairs an ongoing imperfectul action with a perfectul-compus event that interrupts it -- the classic B2 pattern for 'while X was happening, Y happened'."
    example_gloss: "Mihai was going towards the office."
  ro.b2.unit04.lesson03.teach.in_timp_ce:
    title: while
    gloss: while
  ro.b2.unit04.lesson03.teach.astepta:
    title: "was waiting"
    gloss: "was waiting (imperfectul of a aștepta, to wait)"
    example_gloss: "Mihai was waiting for the taxi."
  ro.b2.unit04.lesson03.teach.taxiul:
    title: "the taxi"
    gloss: "the taxi"
    example_gloss: "The taxi arrived quickly."
  ro.b2.unit04.lesson03.teach.a_sunat:
    title: called
    gloss: "called (perfectul compus of a suna, to ring/call -- the completed event, not the ongoing 'sună' from unit02)"
    example_gloss: "The client called in the morning."
  ro.b2.unit04.lesson03.teach.clientul:
    title: "the client"
    gloss: "the client"
    example_gloss: "The client was waiting at the office."
  ro.b2.unit04.lesson03.teach.grammar_cand_in_timp_ce:
    title: "While he was going to the meeting, the car broke down. While he was waiting for the taxi, the client called."
    gloss: "While he was going to the meeting, the car broke down. While he was waiting for the taxi, the client called."
    note: "*Când* and *în timp ce* both introduce an ongoing imperfectul background action that a perfectul-compus event then interrupts -- keeping the two tenses distinct is what keeps the timeline unambiguous."

  ro.b2.unit04.lesson04.teach.fusese:
    title: "had been"
    gloss: "had been (mai mult ca perfectul / pluperfect of a fi)"
    note: "The pluperfect reports something true BEFORE the story's own timeline even began -- a past before the past."
    example_gloss: "The car hadn't been there in a long time."
  ro.b2.unit04.lesson04.teach.la_service:
    title: "at the shop"
    gloss: "at the (car repair) shop"
    example_gloss: "The car is at the shop."
  ro.b2.unit04.lesson04.teach.de_mult:
    title: "for a long time"
    gloss: "for a long time / in a long time"
  ro.b2.unit04.lesson04.teach.asa_ca:
    title: "so / that's why"
    gloss: "so / that's why"
    example_gloss: "It was raining, so he called a taxi."
  ro.b2.unit04.lesson04.teach.grammar_plusquamperfect:
    title: "The car hadn't been serviced in a long time, so it broke down."
    gloss: "The car hadn't been serviced in a long time, so it broke down."
    note: "*Fusese* (pluperfect) states a fact true before the story began; *așa că* then draws the consequence that ties it to the foreground event."

  ro.b2.unit04.lesson05.teach.text:
    title: "Reading: Mihai's morning"
    gloss: "It was early morning and it was raining lightly. Mihai's car hadn't been serviced in a long time. First, Mihai left home. While he was going to the meeting, the car broke down. He called a taxi. Eventually, he arrived at the meeting."
    glosses:
      și: and
      lui: his
      ajuns: arrived

exercises:
