schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit06_food.yaml for full detail.
    Glosses/notes here are freshly authored to explain the target-language
    forms to an English speaker; the underlying "Vă rog."/"Mi-e
    foame."/"Mi-e sete." (Lesson 2), "Daţi-mi, vă rog, un suc."/"Unde pot
    să cumpăr cafea?"/"Cît costă o cafea?" (Lesson 4), the Lesson 14
    "Food and Drinks" vocabulary table (pîine/carne/pui/fruct/ceai/apă/
    mîncare), and Lesson 18's "Doreşti cafea? / Aş dori un ceai."
    ordering exchange all trace to US Peace Corps Moldova's public-domain
    "Basic Romanian Language Lessons," respelled to standard Romanian
    orthography. "Te rog" (please, informal) is freshly authored,
    independent of the source (the source only gives the formal "vă
    rog") -- see the realization's own provenance note for the honest
    disclosure of why.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    realization file's own review pass. Checked clean: correct_response/
    accepted_answers shapes match the realization's word_bank/pairs, no
    same-speaker distractor collisions, no stray YAML booleans, no
    jargon leaks, English glosses/notes are accurate translations of
    the Romanian forms as authored. Sixth Romanian overlay, first
    draft, authored alongside the paired realization.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț). For
    free-typed A1 answers, accept otherwise-correct forms with the
    diacritics omitted or with the legacy cedilla variants ş/ţ substituted
    for ș/ț, matching units 01-05's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    This unit's "Vă rog" (formal, sourced) and "Te rog" (informal, freshly
    authored) are register-sensitive parallels, matching unit02's ai/aveți
    and unit05's ai frați/aveți frați pattern -- accept either register
    for a general "please" unless an exercise explicitly names one. Ana
    and Mihai's closing café dialogue keeps their existing polite register
    with each other (both use "vă rog," not "te rog").

course:
  title: "Romanian A1"
  description: >-
    Ordering food and drinks in Romanian -- coffee, tea, bread, and more,
    using the central "Aș dori ..." (I would like ...) ordering phrase and
    the vă rog/te rog politeness pair -- continuing Ana and Mihai as they
    meet up at a café.

units:
  ro.a1.unit06.food:
    title: "Food and drinks"

lessons:
  ro.a1.unit06.lesson01.bauturi:
    title: "Drinks"
  ro.a1.unit06.lesson02.va_rog_si_mancare:
    title: "Please, and food"
  ro.a1.unit06.lesson03.la_cafenea:
    title: "At the café"

teaching:
  ro.a1.unit06.lesson01.teach.reminder_un_o_si:
    title: "Reminder: un, o, și"
    gloss: "un/o (a) · și (and)"
    note: >-
      Both already appeared in earlier units (*un* and *și* in unit04,
      *o* in unit02) -- here they return to talk about food and drinks.

  ro.a1.unit06.lesson01.teach.as_dori:
    title: "I would like ..."
    gloss: "Aș dori ... (I would like ...)"
    note: >-
      The everyday polite way to order something in Romanian -- a fixed
      conditional form, doesn't change with what follows it.

  ro.a1.unit06.lesson01.teach.apa:
    title: "Water"
    gloss: "apă (water)"
    note: "A feminine noun -- takes no article when the amount isn't specified, like English 'water.'"
    example_gloss: "I would like water."

  ro.a1.unit06.lesson01.teach.cafea:
    title: "Coffee"
    gloss: "cafea (coffee)"
    note: "Feminine -- combines with *o* ('a') the same way as any other feminine noun."
    example_gloss: "I would like a coffee."

  ro.a1.unit06.lesson01.teach.ceai:
    title: "Tea"
    gloss: "ceai (tea)"
    note: "Combines with *un* ('a'), not *o* -- ceai is a masculine/neuter noun."
    example_gloss: "I would like a tea."

  ro.a1.unit06.lesson01.teach.suc:
    title: "Juice"
    gloss: "suc (juice)"
    note: "Also takes *un*, same pattern as ceai."
    example_gloss: "I would like a juice."

  ro.a1.unit06.lesson01.teach.lapte:
    title: "Milk"
    gloss: "lapte (milk)"
    note: "Like apă, usually said without an article when the amount isn't specified."
    example_gloss: "I would like milk."

  ro.a1.unit06.lesson01.teach.mi_e_sete:
    title: "I am thirsty"
    gloss: "Mi-e sete (I am thirsty)"
    note: "A fixed idiom -- literally closer to 'it is thirst to me' than a word-for-word 'I am thirsty.'"

  ro.a1.unit06.lesson01.teach.as_dori_o_cafea:
    title: "I would like a coffee"
    gloss: "I would like a coffee."
    note: "Puts the ordering phrase and a feminine drink noun together in one full sentence."

  ro.a1.unit06.lesson02.teach.reminder_multumesc_bine_da_nu:
    title: "Reminder: mulțumesc, bine, da, nu"
    gloss: "mulțumesc (thank you) · bine (good/fine) · da (yes) · nu (no)"
    note: >-
      *Mulțumesc* and *bine* first appeared in unit01's greetings, *da*
      and *nu* in unit03/unit05 -- here they return around food and
      politeness.

  ro.a1.unit06.lesson02.teach.mi_e_foame:
    title: "I am hungry"
    gloss: "Mi-e foame (I am hungry)"
    note: "The same fixed idiom pattern as *Mi-e sete*, with foame (hunger) instead of sete (thirst)."

  ro.a1.unit06.lesson02.teach.paine:
    title: "Bread"
    gloss: "pâine (bread)"
    note: "Usually said without an article, like English 'bread.'"
    example_gloss: "I am hungry. I would like bread."

  ro.a1.unit06.lesson02.teach.mancare:
    title: "Food"
    gloss: "mâncare (food)"
    note: "The general word for 'food,' not a specific dish."
    example_gloss: "I would like food."

  ro.a1.unit06.lesson02.teach.carne:
    title: "Meat"
    gloss: "carne (meat)"
    note: "The general word for 'meat' -- specific kinds (carne de vită, carne de porc) add a type after it."
    example_gloss: "I would like meat."

  ro.a1.unit06.lesson02.teach.pui:
    title: "Chicken"
    gloss: "pui (chicken)"
    note: "The specific word for chicken (as food), distinct from the general carne."
    example_gloss: "I would like chicken."

  ro.a1.unit06.lesson02.teach.fructe:
    title: "Fruit"
    gloss: "fructe (fruit)"
    note: "The everyday plural form, used the way English uses 'fruit' as a general category."
    example_gloss: "I would like fruit."

  ro.a1.unit06.lesson02.teach.va_rog:
    title: "Please (formal)"
    gloss: "vă rog (please, formal)"
    note: "The polite way to say 'please' -- pairs with unit01/unit02's established dumneavoastră register."
    example_gloss: "A coffee, please."

  ro.a1.unit06.lesson02.teach.te_rog:
    title: "Please (informal)"
    gloss: "te rog (please, informal)"
    note: "The everyday version used with friends and people you'd address as *tu* -- pairs with unit01's tu register."
    example_gloss: "A tea, please."

  ro.a1.unit06.lesson03.teach.reminder_buna_ziua_bine_la_revedere:
    title: "Reminder: bună, ziua, bine, la revedere, Ana, Mihai"
    gloss: "bună ziua (good afternoon) · bine (good) · la revedere (goodbye) · Ana, Mihai (names)"
    note: >-
      All already established in unit01's and unit05's own dialogues --
      here Ana and Mihai meet again, this time at a café.

  ro.a1.unit06.lesson03.teach.line01:
    title: "Greet and say you're hungry"
    gloss: "Ana greets Mihai and says she's hungry."
    note: "Uses this unit's own *Mi-e foame* right in the greeting."

  ro.a1.unit06.lesson03.teach.line02:
    title: "Order food"
    gloss: "Mihai says he would like bread and chicken."
    note: "Reuses this unit's own pâine/pui vocabulary with the Aș dori phrase."

  ro.a1.unit06.lesson03.teach.line03:
    title: "Order a drink, politely"
    gloss: "Ana says she would like a coffee, please."
    note: "Combines Aș dori, cafea, and vă rog -- three things this unit already taught separately."

  ro.a1.unit06.lesson03.teach.line04:
    title: "Order a drink too"
    gloss: "Mihai says he would like a tea, please."
    note: "The same pattern as Ana's line, with ceai instead of cafea."

  ro.a1.unit06.lesson03.teach.line05:
    title: "Thank and close"
    gloss: "Ana thanks Mihai and says goodbye."
    note: "*Mulțumesc* here is a simple closing thanks, the same word from unit01's *Bine, mulțumesc.*"

  ro.a1.unit06.lesson03.teach.line06:
    title: "Close the encounter"
    gloss: "Mihai says goodbye back, using Ana's name."
    note: "The same friendly closing pattern unit01's and unit05's dialogues both ended on."

exercises:
  ro.a1.unit06.lesson01.exercise01.choose_apa:
    instruction: "Which word means 'water'?"
    correct_option: "apă"
    distractors: ["cafea", "lapte"]
    accepted_answers: ["apă"]

  ro.a1.unit06.lesson01.exercise02.choose_cafea:
    instruction: "Which word means 'coffee'?"
    correct_option: "cafea"
    distractors: ["ceai", "suc"]
    accepted_answers: ["cafea"]

  ro.a1.unit06.lesson01.exercise03.listen_as_dori_ceai:
    instruction: "Listen and select what you hear."
    correct_option: "Aș dori un ceai"
    distractors: ["Aș dori o cafea", "Aș dori un suc"]
    accepted_answers: ["Aș dori un ceai"]

  ro.a1.unit06.lesson01.exercise04.match_bauturi:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Apă": "water"
      "Cafea": "coffee"
      "Ceai": "tea"
      "Suc": "juice"
      "Lapte": "milk"
      "Aș dori": "I would like"
      "Mi-e sete": "I am thirsty"

  ro.a1.unit06.lesson01.exercise05.order_as_dori_cafea:
    instruction: "Build the sentence: I would like a coffee."
    correct_response: ["Aș", "dori", "o", "cafea"]

  ro.a1.unit06.lesson01.exercise06.listen_order_as_dori_suc:
    instruction: "Listen, then put the words in order."
    correct_response: ["Aș", "dori", "un", "suc"]

  ro.a1.unit06.lesson01.exercise07.complete_mi_e_sete:
    instruction: "Complete the sentence."
    accepted_answers: ["apă"]
    feedback: "Mi-e sete. Aș dori *apă* -- water is the natural thing to ask for when you're thirsty."

  ro.a1.unit06.lesson01.exercise08.speak_as_dori_cafea:
    instruction: "Say aloud: I would like a coffee."
    accepted_answers:
      - "Aș dori o cafea."
      - "Aș dori o cafea"

  ro.a1.unit06.lesson02.exercise01.choose_paine:
    instruction: "Which word means 'bread'?"
    correct_option: "pâine"
    distractors: ["carne", "fructe"]
    accepted_answers: ["pâine"]

  ro.a1.unit06.lesson02.exercise02.choose_carne:
    instruction: "Which word means 'meat'?"
    correct_option: "carne"
    distractors: ["pui", "pâine"]
    accepted_answers: ["carne"]

  ro.a1.unit06.lesson02.exercise03.listen_mi_e_foame:
    instruction: "Listen and select what you hear."
    correct_option: "Mi-e foame"
    distractors: ["Mi-e sete", "Aș dori pâine"]
    accepted_answers: ["Mi-e foame"]

  ro.a1.unit06.lesson02.exercise04.match_mancare:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Pâine": "bread"
      "Mâncare": "food"
      "Carne": "meat"
      "Pui": "chicken"
      "Fructe": "fruit"
      "Vă rog": "please (formal)"
      "Te rog": "please (informal)"
      "Mi-e foame": "I am hungry"

  ro.a1.unit06.lesson02.exercise05.order_as_dori_pui_fructe:
    instruction: "Build the sentence: I would like chicken and fruit."
    correct_response: ["Aș", "dori", "pui", "și", "fructe"]

  ro.a1.unit06.lesson02.exercise06.listen_order_as_dori_paine_carne:
    instruction: "Listen, then put the words in order."
    correct_response: ["Aș", "dori", "pâine", "și", "carne"]

  ro.a1.unit06.lesson02.exercise07.complete_mi_e_foame:
    instruction: "Complete the sentence."
    accepted_answers: ["pâine"]
    feedback: "Mi-e foame. Aș dori *pâine* -- bread is a natural thing to ask for when you're hungry."

  ro.a1.unit06.lesson02.exercise08.speak_ceai_te_rog:
    instruction: "Say aloud: A tea, please. (informal)"
    accepted_answers:
      - "Un ceai, te rog."
      - "Un ceai, te rog"

  ro.a1.unit06.lesson03.exercise01.choose_who_wants_paine_pui:
    instruction: "Who says this line?"
    correct_option: "Mihai"
    distractors: ["Ana"]
    accepted_answers: ["Mihai"]

  ro.a1.unit06.lesson03.exercise02.dialogue_comprehend_cafenea:
    instruction: "Listen to the dialogue. What does Ana want to drink?"
    correct_option: "coffee"
    distractors: ["tea", "juice"]
    accepted_answers: ["coffee"]

  ro.a1.unit06.lesson03.exercise03.reading_comprehend_mihai_order:
    instruction: "According to Mihai, what would he like to eat?"
    correct_option: "Pâine și pui."
    distractors:
      - "O cafea și un ceai."
      - "Carne și fructe."
    accepted_answers:
      - "Pâine și pui."
      - "Pâine și pui"

  ro.a1.unit06.lesson03.exercise04.match_unit_review:
    instruction: "Match each word to its English meaning."
    correct_response:
      "Apă": "water"
      "Cafea": "coffee"
      "Ceai": "tea"
      "Suc": "juice"
      "Lapte": "milk"
      "Pâine": "bread"
      "Mâncare": "food"
      "Carne": "meat"
      "Pui": "chicken"
      "Fructe": "fruit"

  ro.a1.unit06.lesson03.exercise05.order_as_dori_cafea_va_rog:
    instruction: "Build the sentence: I would like a coffee, please."
    correct_response: ["Aș", "dori", "o", "cafea", "vă", "rog"]

  ro.a1.unit06.lesson03.exercise06.complete_o_cafea:
    instruction: "Complete Ana's order."
    accepted_answers: ["cafea"]
    feedback: "Aș dori o *cafea*, vă rog -- Ana orders a coffee."

  ro.a1.unit06.lesson03.exercise07.respond_as_mihai:
    instruction: "Take Mihai's role. Ana says she would like a coffee, please -- answer that you would like a tea, please."
    accepted_answers:
      - "Aș dori un ceai, vă rog."
      - "Aș dori un ceai, vă rog"

  ro.a1.unit06.lesson03.exercise08.speak_closing_cafenea:
    instruction: "Say aloud: Thank you! Goodbye!"
    accepted_answers:
      - "Mulțumesc! La revedere!"
      - "Mulțumesc, la revedere!"

  ro.a1.unit06.lesson02.exercise09.dictation_mi_e_foame:
    instruction: "Type what you hear."
    correct_option: "Mi-e foame"
    accepted_answers: [{value: "Mi-e foame", status: correct}]
    orthography_strict: true
