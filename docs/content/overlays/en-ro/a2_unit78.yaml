answer_policy:
  diacritics: "Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling."
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: "Informal tu register throughout, matching the unit's course-level register_policy. The imperfect (-am/-ai/-a) is the taught tense for past habits; the simple perfect is not taught here."
course:
  title: "Romanian A2"
  description: "Intermediate Romanian continuing the Ana and Mihai storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Romanian with the right tense for each situation."
units:
  ro.a2.unit78.cand_eram_mic: {"title": "When I Was Little", "description": "Describe how life used to be and what you used to do, and say how it differs from now, with the imperfect."}
lessons:
  ro.a2.unit78.lesson01.jucam_si_cantam: {"title": "We Played and We Sang"}
  ro.a2.unit78.lesson02.citeam_si_mergeam: {"title": "We Read and We Went"}
  ro.a2.unit78.lesson03.pe_atunci_si_acum: {"title": "Back Then and Now"}
  ro.a2.unit78.lesson04.imi_placea: {"title": "I Used to Like"}
  ro.a2.unit78.lesson05.vara_la_bunici: {"title": "Summer at My Grandparents'"}
  ro.a2.unit78.lesson06.ana_si_mihai: {"title": "Ana and Mihai Talk"}
teaching:
  ro.a2.unit78.lesson01.teach.verbe_a: {"title": "Verbs in -a", "gloss": "to play / to work / to sing / to draw / to help", "note": "These are infinitives. In the imperfect they all take the same endings, shown on the next cards.", "example_gloss": ["The children used to play football in the yard.", "Grandfather used to work a lot.", "You used to sing nicely.", "We used to draw in the yard.", "I used to help at home."]}
  ro.a2.unit78.lesson01.teach.gn_terminatii: {"title": "Imperfect endings, -a verbs", "gloss": "I ... -am, you ... -ai, he/she ... -a, we ... -am, you (all) ... -ați, they ... -au", "note": "The imperfect says how things used to be or what you used to do again and again. Take the stem of an -a verb (*juc-*, *lucr-*) and add these endings. The *eu* form and the *noi* form are the same."}
  ro.a2.unit78.lesson01.teach.gn_juca: {"title": "A juca in the imperfect", "gloss": "I used to play, you used to play, he used to play, she used to play, we used to play, you (all) used to play, they used to play", "note": "Same pattern for *a lucra* (*lucram, lucrai, lucra...*) and *a desena* (*desenam, desenai, desena...*). The imperfect ending *-a* is written without a diacritic."}
  ro.a2.unit78.lesson01.teach.gn_reflexiv: {"title": "A se juca: reflexive imperfect", "gloss": "I used to play, you used to play, he/she used to play, we used to play, you (all) used to play, they used to play", "note": "A reflexive verb keeps its small word (*mă, te, se, ne, vă, se*) in front of the imperfect form."}
  ro.a2.unit78.lesson01.teach.locuri: {"title": "Where and how", "gloss": "outside / at home / a lot / nicely / with the friends / in the yard", "note": "Short words that go with the imperfect. *Frumos* means nicely or beautiful.", "example_gloss": ["I used to play outside with my friends.", "I used to work at home.", "We used to sing a lot.", "She used to sing nicely."]}
  ro.a2.unit78.lesson01.teach.frecventa: {"title": "Three sentences", "gloss": "I used to play football. You used to sing nicely. She used to work a lot."}
  ro.a2.unit78.lesson02.teach.verbe: {"title": "Verbs in -e and -i, and a few more", "gloss": "to read / to sleep / to go / to do, make / to live / to eat", "note": "Verbs in -e and -i add *-eam* in the imperfect. *A face* and *a locui* have their own patterns.", "example_gloss": ["I used to read a book every evening.", "I used to sleep well.", "I used to go to school every day.", "I used to make a drawing.", "I used to live in a small house.", "I used to eat at home."]}
  ro.a2.unit78.lesson02.teach.cuvinte: {"title": "Useful words", "gloss": "little / little (feminine) / dog / house / book / evening / day / every", "note": "*Mic* is for a boy or man and *mică* for a girl or woman. *Când eram mic* means when I was little.", "example_gloss": ["When I was little, I had a dog.", "They were at home.", "It was nice.", "Every day I read a book."]}
  ro.a2.unit78.lesson02.teach.gn_citi: {"title": "Imperfect of -e and -i verbs", "gloss": "I used to read, you used to read, he/she used to read, we, you (all), they", "note": "Endings are *-eam, -eai, -ea, -eam, -eați, -eau*. Note *a citi* becomes *citeam*, not *citam*."}
  ro.a2.unit78.lesson02.teach.gn_fi_avea: {"title": "A fi and a avea in the imperfect", "gloss": "I was, you were, he/she was, we were, you (all) were, they were. I had, you had, he/she had, we had, you (all) had, they had", "note": "These two very common verbs are irregular. Learn them as sets. *Era* can also mean 'it was'."}
  ro.a2.unit78.lesson02.teach.gn_face_locui: {"title": "A face and a locui in the imperfect", "gloss": "I used to do, you used to do, he/she, we, you (all), they. I used to live, you, he/she, we, you (all), they", "note": "*A face* keeps the stem *făc-* and adds *-eam*. *A locui* adds *-am* to the stem *locui-*."}
  ro.a2.unit78.lesson03.teach.timp: {"title": "Time words", "gloss": "back then / usually / every summer / in childhood / now / no longer / sometimes / always", "note": "*Pe atunci*, *de obicei*, *în fiecare vară*, *uneori* and *mereu* go naturally with the imperfect. *Acum* goes with the present.", "example_gloss": ["Back then I lived in the country.", "Usually I went to my grandparents.", "Every summer I was at the seaside.", "Now I live in the city.", "I no longer play football in the yard.", "Sometimes I read, sometimes I drew.", "I always had time."]}
  ro.a2.unit78.lesson03.teach.locuri: {"title": "Places and time", "gloss": "city / country(side) / sea, big / grandparents / summer / time", "note": "*La țară* means in the countryside. *Mare* means big, and also the sea.", "example_gloss": ["My grandparents lived in the countryside.", "In summer we went to the sea.", "Now I am big.", "The city was big."]}
  ro.a2.unit78.lesson03.teach.gn_pereche: {"title": "Then and now: imperfect and present", "gloss": "I lived, I live. I worked, I work. I read, I read. I went, I go. I was, I am. I had, I have. I made, I make. you read (then), you read (now)", "note": "Use the imperfect for what used to be true or happen again and again, and the present for what is true now. The present forms are irregular in places, so learn each pair."}
  ro.a2.unit78.lesson03.teach.gn_pe_atunci: {"title": "Pe atunci ... acum ...", "gloss": "Back then I lived in the country, now I live in the city. Back then I was little, now I am big.", "note": "Put *pe atunci* with the imperfect and *acum* with the present. Together they show how life has changed."}
  ro.a2.unit78.lesson03.teach.gn_nu_mai: {"title": "Nu mai: no longer", "gloss": "I no longer play football in the yard. I no longer go to my grandparents every summer.", "note": "*Nu mai* plus the present tense says that something used to happen but does not any more."}
  ro.a2.unit78.lesson04.teach.gn_placea: {"title": "Îmi plăcea: I used to like", "gloss": "I used to like, you used to like, he/she used to like, we used to like, you (all) used to like, they used to like", "note": "The thing you like is the subject. For one thing use *plăcea*; for several things use *plăceau*."}
  ro.a2.unit78.lesson04.teach.gn_plural: {"title": "One thing or many things", "gloss": "I used to like school. I used to like stories. I did not like soup.", "note": "*Plăcea* goes with one thing (*școala*, *supa*), *plăceau* with several (*poveștile*). In a negative sentence *nu* joins the pronoun: *nu-mi*."}
  ro.a2.unit78.lesson04.teach.gn_reflexiv2: {"title": "More reflexive imperfect forms", "gloss": "I used to wake up, you, he/she, we, you (all), they. I used to watch, you, he/she, we, you (all), they", "note": "*A se trezi* is in the -e/-i group, so it takes *-eam*. *A se uita* is an -a verb, so it takes *-am*."}
  ro.a2.unit78.lesson04.teach.cuvinte: {"title": "Childhood words", "gloss": "school / the stories / the soup / cartoons / early / in the evening / together", "note": "Words for describing a childhood. *Seara* by itself means 'in the evening' and shows a habit.", "example_gloss": ["In the evening I used to read stories.", "I used to watch cartoons.", "I used to wake up early.", "We used to play together.", "I didn't like soup."]}
  ro.a2.unit78.lesson04.teach.propozitii: {"title": "A short story", "gloss": "When I was little, I used to play outside. I liked it very much."}
  ro.a2.unit78.lesson05.teach.cuvinte: {"title": "Village words", "gloss": "village / garden / children / during the day / in the morning / the grandparents", "note": "*Dimineața*, *ziua* and *seara* name parts of the day and show a regular habit.", "example_gloss": ["I used to go to the village every summer.", "My grandparents had a big garden.", "During the day I used to play with the children.", "In the morning I used to wake up early."]}
  ro.a2.unit78.lesson05.teach.intrebari: {"title": "Questions about the past", "gloss": "What was summer at your grandparents' like? What did you do there? Where did you go?", "note": "The questions use the same imperfect forms as the answers: *era*, *făceai*, *mergeai*."}
  ro.a2.unit78.lesson05.teach.lectura_ana: {"title": "Ana asks Maria", "gloss": "Ana: Maria, what was summer at your grandparents' like when you were little?"}
  ro.a2.unit78.lesson05.teach.lectura_maria1: {"title": "Maria answers", "gloss": "Maria: Every summer I went to my grandparents, to the village. My grandparents had a big garden."}
  ro.a2.unit78.lesson05.teach.lectura_maria2: {"title": "Maria describes a day", "gloss": "Maria: In the morning I woke up early. During the day I played with the children from the village. In the evening we ate in the yard."}
  ro.a2.unit78.lesson05.teach.lectura_maria3: {"title": "Maria says how it is now", "gloss": "Maria: I liked it very much. Now I no longer go to the village every summer."}
  ro.a2.unit78.lesson06.teach.d1: {"title": "Ana asks about childhood", "gloss": "Ana: Mihai, what did you use to do when you were little?"}
  ro.a2.unit78.lesson06.teach.d2: {"title": "Mihai answers", "gloss": "Mihai: I played outside a lot, with my friends."}
  ro.a2.unit78.lesson06.teach.d3: {"title": "Ana asks about school", "gloss": "Ana: Did you like school?"}
  ro.a2.unit78.lesson06.teach.d4: {"title": "Mihai answers about school", "gloss": "Mihai: Yes, I liked it. I read a lot."}
  ro.a2.unit78.lesson06.teach.d5: {"title": "Ana asks about summer", "gloss": "Ana: And what did you do every summer?"}
  ro.a2.unit78.lesson06.teach.d6: {"title": "Mihai describes summer", "gloss": "Mihai: I used to go to my uncle's. Back then it was nice!"}
exercises:
  ro.a2.unit78.lesson01.jucam_si_cantam.exercise01.elige_jucam: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Eu jucam fotbal.", "distractors": ["Eu jucai fotbal.", "Eu juca fotbal.", "Eu jucați fotbal."], "accepted_answers": [{"value": "Eu jucam fotbal.", "status": "correct"}], "feedback": "With *eu* the imperfect ends in *-am*: *jucam*. The forms *jucai*, *juca* and *jucați* belong to *tu*, *el/ea* and *voi*."}
  ro.a2.unit78.lesson01.jucam_si_cantam.exercise02.elige_cantai: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Tu cântai frumos.", "distractors": ["Tu cântam frumos.", "Tu cântau frumos.", "Tu cântați frumos."], "accepted_answers": [{"value": "Tu cântai frumos.", "status": "correct"}], "feedback": "With *tu* the imperfect ends in *-ai*: *cântai*."}
  ro.a2.unit78.lesson01.jucam_si_cantam.exercise03.une_propozitii: {"instruction": "Match each Romanian sentence to its meaning.", "accepted_answers": [{"value": [{"left": "Eu jucam fotbal.", "right": "I used to play football."}, {"left": "Tu lucrai mult.", "right": "You used to work a lot."}, {"left": "Noi desenam în curte.", "right": "We used to draw in the yard."}, {"left": "Ei jucau afară.", "right": "They used to play outside."}, {"left": "Mă jucam cu prietenii.", "right": "I used to play with my friends."}, {"left": "Ea lucra acasă.", "right": "She used to work at home."}, {"left": "Tu ajutai acasă.", "right": "You used to help at home."}, {"left": "Noi cântam mult.", "right": "We used to sing a lot."}], "status": "correct"}], "feedback": "Check the ending: *-am* is I or we, *-ai* is you, *-a* is he or she, *-au* is they."}
  ro.a2.unit78.lesson01.jucam_si_cantam.exercise04.ordoneaza_jucau: {"instruction": "Put the words in order to say 'They used to play outside with their friends.'", "correct_option": "Ei jucau afară cu prietenii", "accepted_answers": [{"value": "Ei jucau afară cu prietenii", "status": "correct"}, {"value": "Ei jucau cu prietenii afară", "status": "correct"}], "feedback": "*Ei jucau afară cu prietenii*: *ei* takes the ending *-au*."}
  ro.a2.unit78.lesson01.jucam_si_cantam.exercise05.completeaza_jucai: {"instruction": "Complete with the imperfect of *a juca* for *tu*.", "correct_option": "jucai", "accepted_answers": [{"value": "jucai", "status": "correct"}], "feedback": "*Tu jucai fotbal în curte*: the ending *-ai* goes with *tu*."}
  ro.a2.unit78.lesson01.jucam_si_cantam.exercise06.tradu_lucram: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Eu lucram mult.", "status": "correct"}, {"value": "Eu lucram mult", "status": "correct"}, {"value": "Lucram mult.", "status": "correct"}, {"value": "Lucram mult", "status": "correct"}], "feedback": "*Eu lucram mult* = I used to work a lot. The pronoun *eu* can be dropped."}
  ro.a2.unit78.lesson01.jucam_si_cantam.exercise07.scrie_desenam: {"instruction": "Write the requested Romanian sentence in the imperfect. Use *a desena* and *mult*.", "correct_option": "Noi desenam mult.", "accepted_answers": [{"value": "Noi desenam mult.", "status": "correct"}, {"value": "Noi desenam mult", "status": "correct"}, {"value": "Desenam mult.", "status": "correct"}, {"value": "Desenam mult", "status": "correct"}], "feedback": "*Noi desenam mult* = We used to draw a lot."}
  ro.a2.unit78.lesson02.citeam_si_mergeam.exercise01.elige_citeam: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Citeam o carte în fiecare seară.", "distractors": ["Citeai o carte în fiecare seară.", "Citeau o carte în fiecare seară.", "Citeați o carte în fiecare seară."], "accepted_answers": [{"value": "Citeam o carte în fiecare seară.", "status": "correct"}], "feedback": "With *eu* the form is *citeam*. *Citeai* is for *tu*, *citeau* for *ei* and *citeați* for *voi*."}
  ro.a2.unit78.lesson02.citeam_si_mergeam.exercise02.elige_erau: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Ei erau acasă.", "distractors": ["Ei era acasă.", "Ei erai acasă.", "Ei eram acasă."], "accepted_answers": [{"value": "Ei erau acasă.", "status": "correct"}], "feedback": "With *ei* the imperfect of *a fi* is *erau*."}
  ro.a2.unit78.lesson02.citeam_si_mergeam.exercise03.une_forme: {"instruction": "Match each Romanian sentence to its meaning.", "accepted_answers": [{"value": [{"left": "Eram mic.", "right": "I was little."}, {"left": "Aveam un câine.", "right": "I had a dog."}, {"left": "Mergeam la școală.", "right": "I used to go to school."}, {"left": "Citeam seara.", "right": "I used to read in the evening."}, {"left": "Dormeam bine.", "right": "I used to sleep well."}, {"left": "Făceam un desen.", "right": "I used to make a drawing."}, {"left": "Locuiam într-o casă mică.", "right": "I used to live in a small house."}, {"left": "Era frumos.", "right": "It was nice."}], "status": "correct"}], "feedback": "Each sentence uses an imperfect form."}
  ro.a2.unit78.lesson02.citeam_si_mergeam.exercise04.ordoneaza_mergea: {"instruction": "Put the words in order to say 'She used to go to school every day.'", "correct_option": "Ea mergea la școală în fiecare zi", "accepted_answers": [{"value": "Ea mergea la școală în fiecare zi", "status": "correct"}, {"value": "Ea mergea în fiecare zi la școală", "status": "correct"}, {"value": "În fiecare zi ea mergea la școală", "status": "correct"}], "feedback": "*Ea mergea la școală în fiecare zi*: *ea* takes *-ea*."}
  ro.a2.unit78.lesson02.citeam_si_mergeam.exercise05.completeaza_citeai: {"instruction": "Complete with the imperfect of *a citi* for *tu*.", "correct_option": "citeai", "accepted_answers": [{"value": "citeai", "status": "correct"}], "feedback": "*Tu citeai o carte în fiecare seară*: the ending *-eai* goes with *tu*."}
  ro.a2.unit78.lesson02.citeam_si_mergeam.exercise06.tradu_locuiam: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Noi locuiam într-o casă mică.", "status": "correct"}, {"value": "Noi locuiam într-o casă mică", "status": "correct"}, {"value": "Locuiam într-o casă mică.", "status": "correct"}, {"value": "Locuiam într-o casă mică", "status": "correct"}], "feedback": "*Noi locuiam într-o casă mică*: the *noi* form of *a locui* is *locuiam*."}
  ro.a2.unit78.lesson02.citeam_si_mergeam.exercise07.scrie_avea: {"instruction": "Write the requested Romanian sentence with the imperfect of *a avea*.", "correct_option": "Ea avea un câine.", "accepted_answers": [{"value": "Ea avea un câine.", "status": "correct"}, {"value": "Ea avea un câine", "status": "correct"}, {"value": "Avea un câine.", "status": "correct"}, {"value": "Avea un câine", "status": "correct"}], "feedback": "*Ea avea un câine*: *avea* is the imperfect of *a avea* for *ea*."}
  ro.a2.unit78.lesson03.pe_atunci_si_acum.exercise01.elige_pe_atunci: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Pe atunci locuiam la țară.", "distractors": ["Pe atunci locuiesc la țară.", "Acum locuiam la țară.", "Pe atunci locuiai la țară."], "accepted_answers": [{"value": "Pe atunci locuiam la țară.", "status": "correct"}], "feedback": "*Pe atunci* points to the past, so the imperfect *locuiam* is right."}
  ro.a2.unit78.lesson03.pe_atunci_si_acum.exercise02.elige_acum: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Acum locuiesc în oraș.", "distractors": ["Acum locuiam în oraș.", "Acum locuiește în oraș.", "Acum locuiți în oraș."], "accepted_answers": [{"value": "Acum locuiesc în oraș.", "status": "correct"}], "feedback": "*Acum* goes with the present tense, and *eu* takes *locuiesc*."}
  ro.a2.unit78.lesson03.pe_atunci_si_acum.exercise03.une_cuvinte: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "pe atunci", "right": "back then"}, {"left": "acum", "right": "now"}, {"left": "de obicei", "right": "usually"}, {"left": "în fiecare vară", "right": "every summer"}, {"left": "în copilărie", "right": "in childhood"}, {"left": "nu mai", "right": "no longer"}, {"left": "uneori", "right": "sometimes"}, {"left": "mereu", "right": "always"}], "status": "correct"}], "feedback": "These time words show when something happened."}
  ro.a2.unit78.lesson03.pe_atunci_si_acum.exercise04.ordoneaza_pe_atunci: {"instruction": "Put the words in order to say 'Back then I lived in the country.'", "correct_option": "Pe atunci locuiam la țară", "accepted_answers": [{"value": "Pe atunci locuiam la țară", "status": "correct"}, {"value": "Locuiam la țară pe atunci", "status": "correct"}], "feedback": "*Pe atunci locuiam la țară*: *pe atunci* can also come at the end."}
  ro.a2.unit78.lesson03.pe_atunci_si_acum.exercise05.completeaza_sunt: {"instruction": "Complete with the present tense of *a fi* for *eu*.", "correct_option": "sunt", "accepted_answers": [{"value": "sunt", "status": "correct"}], "feedback": "*Pe atunci eram mic, acum sunt mare*: the imperfect *eram* is past, the present *sunt* is now."}
  ro.a2.unit78.lesson03.pe_atunci_si_acum.exercise06.tradu_contrast: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Pe atunci locuiam la țară, acum locuiesc în oraș.", "status": "correct"}, {"value": "Pe atunci locuiam la țară, acum locuiesc în oraș", "status": "correct"}, {"value": "Pe atunci locuiam la țară. Acum locuiesc în oraș.", "status": "correct"}, {"value": "Pe atunci locuiam la țară. Acum locuiesc în oraș", "status": "correct"}, {"value": "Pe atunci locuiam la țară, dar acum locuiesc în oraș.", "status": "correct"}, {"value": "Pe atunci locuiam la țară, dar acum locuiesc în oraș", "status": "correct"}, {"value": "Pe atunci locuiam la țară și acum locuiesc în oraș.", "status": "correct"}, {"value": "Pe atunci locuiam la țară și acum locuiesc în oraș", "status": "correct"}, {"value": "Pe atunci eu locuiam la țară, acum eu locuiesc în oraș.", "status": "correct"}, {"value": "Pe atunci eu locuiam la țară, acum eu locuiesc în oraș", "status": "correct"}], "feedback": "*Pe atunci locuiam la țară, acum locuiesc în oraș*: imperfect for then, present for now."}
  ro.a2.unit78.lesson03.pe_atunci_si_acum.exercise07.scrie_nu_mai: {"instruction": "Write two sentences about *tu*: first *pe atunci* with the imperfect, then *nu mai* with the present.", "correct_option": "Pe atunci citeai mult. Acum nu mai citești.", "accepted_answers": [{"value": "Pe atunci citeai mult. Acum nu mai citești.", "status": "correct"}, {"value": "Pe atunci citeai mult. Acum nu mai citești", "status": "correct"}, {"value": "Pe atunci citeai mult, acum nu mai citești.", "status": "correct"}, {"value": "Pe atunci citeai mult, acum nu mai citești", "status": "correct"}, {"value": "Pe atunci tu citeai mult. Acum tu nu mai citești.", "status": "correct"}, {"value": "Pe atunci tu citeai mult. Acum tu nu mai citești", "status": "correct"}, {"value": "Pe atunci tu citeai mult, acum tu nu mai citești.", "status": "correct"}, {"value": "Pe atunci tu citeai mult, acum tu nu mai citești", "status": "correct"}], "feedback": "*Pe atunci citeai mult. Acum nu mai citești.* = Back then you read a lot. Now you no longer read."}
  ro.a2.unit78.lesson04.imi_placea.exercise01.elige_placea: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Îmi plăcea școala.", "distractors": ["Îmi place școala.", "Îți plăcea școala.", "Îmi plăceau școala."], "accepted_answers": [{"value": "Îmi plăcea școala.", "status": "correct"}], "feedback": "The past habit uses *plăcea*. *Îmi place* is present, *îți* means 'you', and one thing needs *plăcea*, not *plăceau*."}
