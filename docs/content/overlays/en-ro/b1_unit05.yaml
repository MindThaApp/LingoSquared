      - {value: "Ați putea să trimiteți raportul vă rog?", status: correct}
    feedback: "Ați putea să trimiteți raportul, vă rog? means could you send the report, please?"

  ro.b1.unit05.lesson03.exercise01.recognize_v_as_ruga:
    instruction: "What does this mean?"
    correct_option: "I would ask you (formal)"
