    instruction: "What does this mean?"
    correct_option: "I would propose"
    distractors: ["I propose", "I would agree", "I would ask"]
    accepted_answers: [{value: "I would propose", status: correct}]
    feedback: "aș propune means I would propose."
  ro.b1.unit05.lesson01.exercise02.recognize_sedinta:
    instruction: "What does this word mean?"
    correct_option: "the meeting"
    distractors: ["the report", "the agenda", "the project"]
