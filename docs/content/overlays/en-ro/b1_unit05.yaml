    feedback: "termenul limită means the deadline."
  ro.b1.unit05.lesson03.exercise03.order_v_as_ruga_sa_verificati:
    instruction: "Put the words in order: I would ask you to check the report again."
    accepted_answers:
      - {value: "V-aș ruga să verificați raportul din nou", status: correct}
    feedback: "V-aș ruga să verificați raportul din nou means I would ask you to check the report again."
  ro.b1.unit05.lesson03.exercise04.match_polite_request_words:
    instruction: "Match each phrase with its meaning."
    accepted_answers:
      - value: {"v-aș ruga": "I would ask you (formal)", "să verificați": "that you (formal) check", "din nou": again, "înainte de": before, "termenul limită": "the deadline", "cu plăcere": "with pleasure"}
