    instruction: "Say aloud in Romanian: I would ask you to check the report again."
    accepted_answers:
      - {value: "V-aș ruga să verificați raportul din nou", status: correct}
    feedback: "V-aș ruga să verificați raportul din nou means I would ask you to check the report again."
  ro.b1.unit05.lesson03.exercise07.write_check_before_deadline:
    instruction: "Write in Romanian: I would ask you to check the report before the deadline."
    accepted_answers:
      - {value: "V-aș ruga să verificați raportul înainte de termenul limită", status: correct}
    feedback: "V-aș ruga să verificați raportul înainte de termenul limită means I would ask you to check the report before the deadline."

  ro.b1.unit05.lesson04.exercise01.comprehend_who_sends_report:
    instruction: "Listen/read: Who sends the report?"
    correct_option: Diana
    distractors: [Ana, Mihai, "no one"]
