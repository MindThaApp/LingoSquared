course:
  title: Romanian B1
  description: >-
    Intermediate Romanian: making a formal-register suggestion or
    request at work using a softened conditional form, participating in
    a short work-meeting exchange, and writing a brief professional
    message.

units:
  ro.b1.unit05.workplace:
    title: "At the Office: Proposals and Requests"
    description: Make a formal-register suggestion or request to a colleague or manager using a softened conditional form, and write a brief professional message.

lessons:
  ro.b1.unit05.lesson01.as_propune:
    title: "I would propose"
  ro.b1.unit05.lesson02.ati_putea:
    title: "Could you"
  ro.b1.unit05.lesson03.v_as_ruga:
    title: "I would ask you"
  ro.b1.unit05.lesson04.dialogue_sedinta:
    title: "Tomorrow's meeting"
  ro.b1.unit05.lesson05.reading_email_mihai:
    title: "A message from Mihai"
  ro.b1.unit05.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  ro.b1.unit05.lesson01.teach.as_propune:
    title: "I would propose"
    gloss: "I would propose"
    note: "*aș propune* -- conditional-optativ of *a propune*, the same softened mood already used for unreal conditions in the hypotheticals unit, now repurposed for polite workplace suggestions instead of the flatter present *propun*."
    example_gloss: "I would propose that we meet earlier."
  ro.b1.unit05.lesson01.teach.sa_ne_intalnim:
    title: "that we meet"
    gloss: "that we meet"
    example_gloss: "I would propose that we meet earlier."
  ro.b1.unit05.lesson01.teach.mai_devreme:
    title: earlier
    gloss: earlier
    example_gloss: "Could we start the meeting earlier?"
  ro.b1.unit05.lesson01.teach.sedinta:
    title: "the meeting"
    gloss: "the meeting"
    example_gloss: "The meeting is about the new project."
  ro.b1.unit05.lesson01.teach.ordinea_de_zi:
    title: "the agenda"
    gloss: "the agenda"
    example_gloss: "The agenda has three points."
  ro.b1.unit05.lesson01.teach.proiectul_nou:
    title: "the new project"
    gloss: "the new project"
    example_gloss: "The meeting is about the new project."
  ro.b1.unit05.lesson01.teach.ati_fi_de_acord:
    title: "would you (formal) agree"
    gloss: "would you (formal) agree"
    note: "*ați fi de acord* -- conditional of *a fi de acord* (b1_unit04's *sunt de acord*), softened into a genuine question inviting agreement rather than a flat statement."
    example_gloss: "Would you agree with my proposal?"
  ro.b1.unit05.lesson01.teach.grammar_conditional:
    title: "I would propose that we meet earlier. Would you agree with my proposal?"
    gloss: "I would propose that we meet earlier. Would you agree with my proposal?"
    note: "The conditional-optativ (*aș/ai/ar/am/ați/ar* + past participle) softens a suggestion from a flat statement into a polite offer -- the core move of this whole unit."

  ro.b1.unit05.lesson02.teach.ati_putea:
    title: "could you (formal)"
    gloss: "could you (formal)"
    note: "*ați putea* -- conditional of *a putea*, softer than the plain present *puteți* ('can you'). This is the standard way to make a polite request in Romanian, not just a grammatical curiosity."
    example_gloss: "Could you send the report by tomorrow?"
  ro.b1.unit05.lesson02.teach.sa_trimiteti:
    title: "that you (formal) send"
    gloss: "that you (formal) send"
    example_gloss: "Could you send the report by tomorrow?"
  ro.b1.unit05.lesson02.teach.raportul:
    title: "the report"
    gloss: "the report"
    example_gloss: "Could you send the report by tomorrow?"
  ro.b1.unit05.lesson02.teach.pana_maine:
    title: "by tomorrow"
    gloss: "by tomorrow"
    example_gloss: "Could you send the report by tomorrow?"
  ro.b1.unit05.lesson02.teach.desigur:
    title: "of course"
    gloss: "of course"
    example_gloss: "Of course, I'll send it today."
  ro.b1.unit05.lesson02.teach.il_trimit:
    title: "I'll send it"
    gloss: "I'll send it"
    example_gloss: "Of course, I'll send it today."
  ro.b1.unit05.lesson02.teach.va_rog:
    title: "please (formal)"
    gloss: "please (formal)"
    note: "*vă rog* -- already familiar from A1 shopping/travel requests, now used the same way in a workplace request."
    example_gloss: "Could you send the report, please?"
  ro.b1.unit05.lesson02.teach.grammar_note:
    title: "Could you send the report by tomorrow, please? Of course, I'll send it today."
    gloss: "Could you send the report by tomorrow, please? Of course, I'll send it today."
    note: "*ați putea* + *să* clause is the everyday softened-request pattern -- reach for it instead of the plain imperative whenever you're asking a colleague or manager for something."

  ro.b1.unit05.lesson03.teach.v_as_ruga:
    title: "I would ask you (formal)"
    gloss: "I would ask you (formal)"
    note: "*v-aș ruga* -- *vă* (you, formal, contracted to *v-*) + conditional *aș ruga* ('I would ask/beg'). The most formal of this unit's three softened-request forms, one notch more deferential than *ați putea*."
    example_gloss: "I would ask you to check the report again."
  ro.b1.unit05.lesson03.teach.sa_verificati:
    title: "that you (formal) check"
    gloss: "that you (formal) check"
    example_gloss: "I would ask you to check the report again."
  ro.b1.unit05.lesson03.teach.din_nou:
    title: again
    gloss: again
    example_gloss: "I would ask you to check the report again."
  ro.b1.unit05.lesson03.teach.inainte_de:
    title: before
    gloss: before
    example_gloss: "I would ask you to check the report before the deadline."
  ro.b1.unit05.lesson03.teach.termenul_limita:
    title: "the deadline"
    gloss: "the deadline"
    example_gloss: "I would ask you to check the report before the deadline."
  ro.b1.unit05.lesson03.teach.cu_placere:
    title: "with pleasure"
    gloss: "with pleasure"
    example_gloss: "With pleasure! I'll check the report again."
  ro.b1.unit05.lesson03.teach.verific:
    title: "I check"
    gloss: "I check"
    example_gloss: "With pleasure! I'll check the report again."
  ro.b1.unit05.lesson03.teach.grammar_note:
    title: "I would ask you to check the report again, before the deadline."
    gloss: "I would ask you to check the report again, before the deadline."
    note: "*v-aș ruga să* + subordinate clause -- the most deferential of the unit's three softened forms, best kept for requests to someone senior or a genuinely important ask."

  ro.b1.unit05.lesson04.teach.pentru:
    title: "for the meeting about"
    gloss: "for the meeting about"
    note: "*Pentru*/*despre* were already largely familiar; this card just anchors them in the new phrase used to open the meeting-scheduling scene."
    example_gloss: "I would propose that we meet earlier, for the meeting about the new project."
  ro.b1.unit05.lesson04.teach.cine_trimite:
    title: "Who sends the report?"
    gloss: "Cine trimite raportul? (Who sends the report?)"
    note: "*Cine* (who) and *trimite* (sends, 3rd person present) -- introduced here so the lesson's comprehension question tests words actually taught, not just familiar ones."
  ro.b1.unit05.lesson04.teach.ora_opt:
    title: "eight o'clock"
    gloss: "eight o'clock"
    example_gloss: "See you tomorrow at eight o'clock."
  ro.b1.unit05.lesson04.teach.atunci:
    title: "by then"
    gloss: "by then"
    example_gloss: "Could you send the report by then?"
  ro.b1.unit05.lesson04.teach.bineinteles:
    title: "of course/naturally"
    gloss: "of course/naturally"
    example_gloss: "Of course. Thanks for the help!"
  ro.b1.unit05.lesson04.teach.ajutor:
    title: help
    gloss: help
    example_gloss: "Thanks for the help!"
  ro.b1.unit05.lesson04.teach.ne_vedem:
    title: "see you/we'll see each other"
    gloss: "see you/we'll see each other"
    example_gloss: "See you tomorrow at eight o'clock."
  ro.b1.unit05.lesson04.teach.dialogue_ana_1:
    title: "Hello! I would propose that we meet earlier tomorrow, for the meeting about the new project. Would you agree with eight o'clock?"
    gloss: "Hello! I would propose that we meet earlier tomorrow, for the meeting about the new project. Would you agree with eight o'clock?"
  ro.b1.unit05.lesson04.teach.dialogue_mihai_1:
    title: "Yes, I agree. Diana, could you send the report by then?"
    gloss: "Yes, I agree. Diana, could you send the report by then?"
  ro.b1.unit05.lesson04.teach.dialogue_diana_1:
    title: "Of course, I'll send it today. I would ask you to check the agenda before the meeting."
    gloss: "Of course, I'll send it today. I would ask you to check the agenda before the meeting."
  ro.b1.unit05.lesson04.teach.dialogue_ana_2:
    title: "Of course. Thanks for the help!"
    gloss: "Of course. Thanks for the help!"
  ro.b1.unit05.lesson04.teach.dialogue_mihai_2:
    title: "With pleasure. See you tomorrow at eight o'clock."
    gloss: "With pleasure. See you tomorrow at eight o'clock."

  ro.b1.unit05.lesson05.teach.tuturor:
    title: "hello everyone"
    gloss: "hello everyone"
    example_gloss: "Hello everyone! Thank you for today's meeting."
  ro.b1.unit05.lesson05.teach.va_multumesc:
    title: "thank you (formal)"
    gloss: "thank you (formal)"
    example_gloss: "Thank you for today's meeting."
  ro.b1.unit05.lesson05.teach.continuam:
    title: "we continue"
    gloss: "we continue"
    example_gloss: "I would propose that we continue the new project with the same team."
  ro.b1.unit05.lesson05.teach.aceeasi_echipa:
    title: "the same team"
    gloss: "the same team"
    example_gloss: "I would propose that we continue the new project with the same team."
  ro.b1.unit05.lesson05.teach.a_trimis_deja:
    title: "already sent"
    gloss: "already sent"
    example_gloss: "Diana already sent the report."
  ro.b1.unit05.lesson05.teach.pe_biroul_meu:
    title: "on my desk"
    gloss: "on my desk"
    example_gloss: "The agenda for the next meeting is on my desk."
  ro.b1.unit05.lesson05.teach.cu_stima:
    title: "best regards"
    gloss: "best regards"
    example_gloss: "Best regards, Mihai"
  ro.b1.unit05.lesson05.teach.reading_passage:
    title: "A message from Mihai"
    gloss: "A message from Mihai"
    note: "A short professional email recapping the meeting's decisions and making one more softened request -- the reading/writing half of the spine outcome's professional-message requirement."

  ro.b1.unit05.lesson06.teach.grammar_review:
    title: "I would propose that we meet earlier. Could you send the report? I would ask you to check it again."
    gloss: "I would propose that we meet earlier. Could you send the report? I would ask you to check it again."
    note: "This unit's three softened-request forms in one glance: *aș propune* (I would propose), *ați putea* (could you), *v-aș ruga* (I would ask you) -- all built on the same conditional-optativ mood, ranging from a light suggestion to a formal, deferential request."
  ro.b1.unit05.lesson06.teach.cat_mai_curand_posibil:
    title: "as soon as possible"
    gloss: "as soon as possible"
    example_gloss: "I would ask you to send the report as soon as possible."

exercises:
