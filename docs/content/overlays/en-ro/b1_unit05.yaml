    instruction: "Put the words in order: I would propose that we meet earlier."
    accepted_answers:
      - {value: "Aș propune să ne întâlnim mai devreme", status: correct}
    feedback: "Aș propune să ne întâlnim mai devreme means I would propose that we meet earlier."
  ro.b1.unit05.lesson01.exercise04.match_meeting_words:
    instruction: "Match each phrase with its meaning."
    accepted_answers:
      - value: {"aș propune": "I would propose", "ședința": "the meeting", "ordinea de zi": "the agenda", "proiectul nou": "the new project", "ați fi de acord": "would you (formal) agree", propunerea: "the proposal"}
        status: correct
    feedback: "These are this lesson's core proposal words."
