      - {value: "Ați putea să trimiteți raportul până mâine?", status: correct}
      - {value: "Ați putea să trimiteți raportul până mâine", status: correct}
    feedback: "Ați putea să trimiteți raportul până mâine? means could you send the report by tomorrow?"
