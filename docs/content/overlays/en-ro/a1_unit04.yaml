schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit04_time.yaml for full detail.
    Glosses/notes here are freshly authored to explain the target-language
    forms to an English speaker; the underlying "oră"/"Cât este ora?"/
    "La ce oră?"/"La ora nouă"/"jumătate"/"târziu"/"seara"/"dimineața"
    vocabulary traces to US Peace Corps Moldova's public-domain "Basic
    Romanian Language Lessons," respelled to standard Romanian
    orthography. The quarter-hour system (un sfert / și un sfert / fără
    un sfert), the ora-unu-vs-ora-două gender note, "după-amiaza," and
    the closing Ana/Mihai course-scheduling dialogue are freshly
    authored, independent of the source (the quarter-hour system was
    cross-checked via WebSearch against RomanianPod101 and Omniglot for
    accuracy, not copied from either).
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    realization file's own review pass. Checked clean: correct_response/
    accepted_answers shapes match the realization's word_bank/pairs, no
    same-speaker distractor collisions, no stray YAML booleans, no
    jargon leaks, English glosses/notes are accurate translations of
    the Romanian forms as authored. Fourth Romanian overlay, first
    draft, authored alongside the paired realization.

    Second-pass review 2026-10-19: 7 fixes - answer_policy promised
    diacritic/cedilla tolerance the grader does not apply (reworded);
    ora_gender_note said Romanian numbers usually agree in gender (only
    those with a feminine form do); cat_e_ora note called cât and ora
    "already familiar" (both new here); începe note said the form works
    for any singular subject (it is third person only; I/you are
    încep/începi); speak_la_ora_noua instruction asked "what time it
    is" but grades "La ora nouă" (at nine) - reworded to "at nine
    o'clock"; speak_ora_trei now also accepts "Ora trei."; and
    respond_as_mihai now also accepts the subject-less "Începe la ora
    nouă, dimineața."
    NATIVE FLAGS: cursul gloss calls it "Ana and Mihai's Romanian
    class" (unit10 says Mihai's language class) - odd if both are
    Romanian speakers, left for a canon decision.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with
    comma-below ș/ț). Typed answers are checked with their diacritics:
    a spelling without them, or with the older cedilla letters ş/ţ, is
    accepted only where an exercise lists it explicitly, matching units
    01/02/03's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    question mark/exclamation mark.
  register: >-
    No new register-sensitive forms in this unit -- este (is) is
    invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing
    dialogue keeps the dumneavoastră register unit01 already established
    between them.

course:
  title: "Romanian A1"
  description: >-
    How to ask and tell the time in Romanian -- on the hour, half past,
    quarter past and quarter to, parts of the day, and asking when
    something starts -- continuing Ana and Mihai as they arrange when
    their Romanian class begins.

units:
  ro.a1.unit04.time:
    title: "Telling the time"

lessons:
  ro.a1.unit04.lesson01.ora_fixa_si_jumatate:
    title: "On the hour, and half past"
  ro.a1.unit04.lesson02.sferturi_si_intrebari:
    title: "A quarter, and how we ask the time"
  ro.a1.unit04.lesson03.cand_incepe_cursul:
    title: "When does the class start?"

teaching:
  ro.a1.unit04.lesson01.teach.este:
    title: "Reminder: este"
    gloss: "is / it is"
    note: >-
      *Este* already appeared in Unit 2 and Unit 3. It stays exactly the
      same word whether you're stating a number, a day, a date, or now a
      time.

  ro.a1.unit04.lesson01.teach.ora:
    title: "The hour"
    gloss: "ora (the hour)"
    note: "A feminine noun -- *ora* is what you put right before a number to state a clock time, e.g. *ora unu* (one o'clock)."
    example_gloss: "It's one o'clock."

  ro.a1.unit04.lesson01.teach.ora_unu:
    title: "One o'clock"
    gloss: "one o'clock"
    note: "Literally 'the-hour one' -- ora comes first, then the number."

  ro.a1.unit04.lesson01.teach.ora_doua:
    title: "Two o'clock"
    gloss: "two o'clock"
    note: "Here the number takes its feminine form, *două*, to agree with the feminine *ora* -- see the next card for the full pattern."

  ro.a1.unit04.lesson01.teach.ora_gender_note:
    title: "A real irregularity: unu stays unu"
    gloss: "ora unu (not \"ora una\") / ora două (not \"ora doi\")"
    note: >-
      Numbers that have a feminine form usually take it with a feminine
      noun (*doi* → *două* for a feminine noun like *ora*), but
      *unu* is the one exception in time-telling -- it's always *ora
      unu*, never *ora una*, even though *ora* is feminine.

  ro.a1.unit04.lesson01.teach.ora_trei:
    title: "Three o'clock"
    gloss: "three o'clock"
    note: "Trei doesn't change form for gender at all, unlike unu/una or doi/două -- one less thing to remember."

  ro.a1.unit04.lesson01.teach.jumatate:
    title: "Half"
    gloss: "jumătate (half)"
    note: "Used with și (and) to say 'half past': X și jumătate."
    example_gloss: "One-thirty."

  ro.a1.unit04.lesson01.teach.ora_unu_jumatate:
    title: "Half past one"
    gloss: "It's half past one."
    note: "Literally 'It's one and a half' -- straightforward, unlike some languages' 'halfway to the next hour' convention."

  ro.a1.unit04.lesson01.teach.cat_e_ora:
    title: "Ask the time"
    gloss: "What time is it?"
    note: "The everyday way to ask the clock time -- cât (how much, a relative of Unit 2's câți) + este + ora (the hour)."

  ro.a1.unit04.lesson02.teach.sfert:
    title: "A quarter"
    gloss: "un sfert (a quarter)"
    note: "A quarter of an hour -- 15 minutes. Combines with și (and) or fără (without) to mark quarter-past or quarter-to."
    example_gloss: "It's quarter past one."

  ro.a1.unit04.lesson02.teach.sfert_rule:
    title: "și vs. fără with a quarter or a half"
    gloss: "și un sfert = +15 minutes · fără un sfert = -15 minutes"
    note: >-
      *Și* (and) adds minutes onto the hour just passed; *fără*
      (without) counts minutes back from the hour still coming --
      exactly the same "and"/"to" logic English uses for "quarter past"
      versus "quarter to."

  ro.a1.unit04.lesson02.teach.ora_doua_sfert:
    title: "Quarter past two"
    gloss: "It's quarter past two."
    note: "Ora două (2:00) plus și un sfert (+15 minutes) = 2:15."

  ro.a1.unit04.lesson02.teach.fara:
    title: "Without / to"
    gloss: "fără (without)"
    note: "Counts minutes back from the NEXT hour, the same role 'to' plays in English 'quarter to three.'"
    example_gloss: "It's quarter to three."

  ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert:
    title: "Quarter to three"
    gloss: "It's quarter to three."
    note: "Ora trei (3:00) minus fără un sfert (-15 minutes) = 2:45 -- Romanian names it by the hour it's counting DOWN to, not the hour that just passed."

  ro.a1.unit04.lesson02.teach.la_ce_ora:
    title: "Ask at what time"
    gloss: "At what time?"
    note: "La (at) + ce (what) + oră (an hour, indefinite form here rather than ora) -- the everyday way to ask when something happens."

  ro.a1.unit04.lesson02.teach.la_ora_noua:
    title: "State when something happens"
    gloss: "At nine o'clock."
    note: "La (at) + ora (the hour, definite form here) + the number -- the answer pattern to 'La ce oră?'."

  ro.a1.unit04.lesson02.teach.tarziu:
    title: "Late"
    gloss: "târziu (late)"
    note: "A common, useful reaction word when checking the time."
    example_gloss: "It's late!"

  ro.a1.unit04.lesson03.teach.cand:
    title: "Reminder: când"
    gloss: "when?"
    note: "Când already appeared in Unit 3 to ask when an event is -- here it returns to ask when something starts."

  ro.a1.unit04.lesson03.teach.zi_parts:
    title: "Parts of the day"
    gloss: "dimineața (morning) / după-amiaza (afternoon) / seara (evening) / noaptea (night)"
    note: >-
      Each of these is the definite form of the noun used adverbially --
      Romanian says "in the morning" the same simple way English says
      "mornings," with no extra preposition needed.
    example_gloss:
      - "The class is in the morning."
      - "The class is in the afternoon."
      - "Mihai works in the evening."
      - "Ana sleeps at night."

  ro.a1.unit04.lesson03.teach.cursul:
    title: "The class"
    gloss: "cursul (the class / the course)"
    note: "The definite form of curs (a class or course) -- here, Ana and Mihai's Romanian class."
    example_gloss: "The class starts at nine o'clock."

  ro.a1.unit04.lesson03.teach.incepe:
    title: "Starts"
    gloss: "începe (starts / begins)"
    note: "The present-tense form for he, she or it -- any singular subject that is not I or you, like cursul (the class)."
    example_gloss: "The class starts in the morning."

  ro.a1.unit04.lesson03.teach.cand_incepe_cursul:
    title: "Ask when the class starts"
    gloss: "When does the class start?"
    note: "Puts când together with this lesson's new începe and cursul."

  ro.a1.unit04.lesson03.teach.raspuns_curs:
    title: "State when the class starts"
    gloss: "The class starts at nine o'clock, in the morning."
    note: "A weekday-style adverbial (dimineața) tacked on at the end, comma-separated, the same way Unit 3 added a date after a weekday."

  ro.a1.unit04.lesson03.teach.line01:
    title: "Ask when the class starts"
    gloss: "Ana asks Mihai when the class starts."
    note: "A plain, register-neutral question -- este and începe don't change with tu or dumneavoastră."

  ro.a1.unit04.lesson03.teach.line02:
    title: "State the time"
    gloss: "Mihai says the class starts at nine, in the morning."
    note: "Mihai reuses this lesson's exact time-and-day-part pattern."

  ro.a1.unit04.lesson03.teach.line03:
    title: "Acknowledge and close"
    gloss: "Ana thanks him and says goodbye."
    note: "La revedere, first taught in Unit 1, closes the exchange the same way it always has."

  ro.a1.unit04.lesson03.teach.line04:
    title: "Close the encounter"
    gloss: "Mihai says goodbye back, using Ana's name."
    note: "Echoing la revedere with the other person's name is a natural, friendly way to close."

exercises:
  ro.a1.unit04.lesson01.exercise01.choose_ora_unu:
    instruction: "Which phrase means '1:00'?"
    correct_option: "ora unu"
    distractors: ["ora două", "ora trei"]
    accepted_answers: ["ora unu"]

  ro.a1.unit04.lesson01.exercise02.listen_ora_doua:
    instruction: "Listen and select the time you hear."
    correct_option: "Este ora două"
    distractors: ["Este ora unu", "Este ora trei"]
    accepted_answers: ["Este ora două"]

  ro.a1.unit04.lesson01.exercise03.choose_ora_trei:
    instruction: "Which phrase means '3:00'?"
    correct_option: "ora trei"
    distractors: ["ora unu", "ora două"]
    accepted_answers: ["ora trei"]

  ro.a1.unit04.lesson01.exercise04.match_hours:
    instruction: "Match each time phrase to its meaning."
    correct_response:
      "Ora unu": "1:00"
      "Ora două": "2:00"
      "Ora trei": "3:00"
      "Jumătate": "half"
      "Cât este ora?": "What time is it?"
      "Este ora unu și jumătate.": "1:30"

  ro.a1.unit04.lesson01.exercise05.order_cat_e_ora:
    instruction: "Build the question asking what time it is."
    correct_response: ["Cât", "este", "ora"]

  ro.a1.unit04.lesson01.exercise06.listen_order_ora_jumatate:
    instruction: "Listen, then put the words in order."
    correct_response: ["Este", "ora", "unu", "și", "jumătate"]

  ro.a1.unit04.lesson01.exercise07.speak_ora_trei:
    instruction: "Say the time shown aloud."
    accepted_answers:
      - "Este ora trei."
      - "Este ora trei"
      - "Ora trei."

  ro.a1.unit04.lesson01.exercise08.listen_type_ora_doua:
    instruction: "Type the time you hear."
    accepted_answers:
      - "Este ora două."
      - "Este ora două"

  ro.a1.unit04.lesson02.exercise01.choose_ora_doua_sfert:
    instruction: "Which phrase means '2:15'?"
    correct_option: "ora două și un sfert"
    distractors: ["ora trei fără un sfert", "ora două și jumătate"]
    accepted_answers: ["ora două și un sfert"]

  ro.a1.unit04.lesson02.exercise02.listen_ora_trei_fara_sfert:
    instruction: "Listen and select the time you hear."
    correct_option: "Este ora trei fără un sfert"
    distractors: ["Este ora două și un sfert", "Este ora unu și jumătate"]
    accepted_answers: ["Este ora trei fără un sfert"]

  ro.a1.unit04.lesson02.exercise03.choose_la_ce_ora:
    instruction: "Which phrase means 'At what time?'?"
    correct_option: "la ce oră"
    distractors: ["cât este ora", "la ora nouă"]
    accepted_answers: ["la ce oră"]

  ro.a1.unit04.lesson02.exercise04.match_time_phrases:
    instruction: "Match each phrase to its English meaning."
    correct_response:
      "Ora două și un sfert": "2:15"
      "Ora trei fără un sfert": "2:45"
      "La ce oră?": "At what time?"
      "La ora nouă.": "At nine o'clock."
      "Târziu": "late"
      "Un sfert": "a quarter"

  ro.a1.unit04.lesson02.exercise05.order_la_ce_ora:
    instruction: "Build the question asking at what time."
    correct_response: ["La", "ce", "oră"]

  ro.a1.unit04.lesson02.exercise06.listen_order_ora_doua_sfert:
    instruction: "Listen, then put the words in order."
    correct_response: ["Este", "ora", "două", "și", "un", "sfert"]

  ro.a1.unit04.lesson02.exercise07.complete_sfert:
    instruction: "Complete the sentence."
    accepted_answers: ["sfert"]
    feedback: "Fără un *sfert* (quarter to) counts fifteen minutes back from the coming hour."

  ro.a1.unit04.lesson02.exercise08.speak_la_ora_noua:
    instruction: "Say aloud: at nine o'clock."
    accepted_answers:
      - "La ora nouă."
      - "La ora nouă"

  ro.a1.unit04.lesson03.exercise01.choose_class_time:
    instruction: "What time does the class start?"
    correct_option: "la ora nouă"
    distractors: ["la ora unu", "la ora trei"]
    accepted_answers: ["la ora nouă"]

  ro.a1.unit04.lesson03.exercise02.dialogue_comprehend_time:
    instruction: "Listen to the dialogue and select when the class starts."
    correct_option: "la ora nouă, dimineața"
    distractors: ["la ora trei, după-amiaza", "la ora unu, seara"]
    accepted_answers: ["la ora nouă, dimineața"]

  ro.a1.unit04.lesson03.exercise03.reading_comprehend_class:
    instruction: "When does the class start, according to Mihai?"
    correct_option: "Cursul începe la ora nouă, dimineața."
    distractors:
      - "Cursul începe la ora trei, seara."
      - "Cursul începe la ora unu, după-amiaza."
    accepted_answers:
      - "Cursul începe la ora nouă, dimineața."
      - "Cursul începe la ora nouă, dimineața"

  ro.a1.unit04.lesson01.exercise09.dictation_este_ora_unu_si_jumatate:
    instruction: "Type what you hear."
    correct_option: "Este ora unu și jumătate"
    accepted_answers: [{value: "Este ora unu și jumătate", status: correct}]
    orthography_strict: true

  ro.a1.unit04.lesson03.exercise04.match_review:
    instruction: "Match each word to its English meaning."
    correct_response:
      "Dimineața": "morning"
      "După-amiaza": "afternoon"
      "Seara": "evening"
      "Noaptea": "night"
      "Cursul": "the class"
      "Începe": "starts"
      "Când?": "when?"

  ro.a1.unit04.lesson03.exercise05.order_class_question:
    instruction: "Build the question asking when the class starts."
    correct_response: ["Când", "începe", "cursul"]

  ro.a1.unit04.lesson03.exercise06.complete_class_time:
    instruction: "Complete Mihai's answer."
    accepted_answers: ["nouă"]
    feedback: "The class starts la ora *nouă* (at nine o'clock), in the morning."

  ro.a1.unit04.lesson03.exercise07.respond_as_mihai:
    instruction: "Take Mihai's role. Ana asks when the class starts -- answer that it starts at nine, in the morning."
    accepted_answers:
      - "Cursul începe la ora nouă, dimineața."
      - "Cursul începe la ora nouă, dimineața"
      - "Începe la ora nouă, dimineața."

  ro.a1.unit04.lesson03.exercise08.speak_class_time:
    instruction: "Say when the class starts: nine o'clock, in the morning."
    accepted_answers:
      - "Cursul începe la ora nouă, dimineața."
      - "Cursul începe la ora nouă, dimineața"
