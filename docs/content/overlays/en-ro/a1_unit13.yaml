schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit13_preferences.yaml for full
    detail. This unit's source PDF (US Peace Corps Moldova's "Basic
    Romanian Language Lessons") was checked for like/prefer/choice
    material and found real, directly relevant hits: "Do you like
    Moldova? / Îţi place Moldova?" and "Yes, I like it very much. / Da,
    îmi place foarte mult."; a grammar-notes page's own worked example
    "Îmi place cafeaua foarte mult. (I like coffee very much.)"
    directly confirming the definite-article generic-liking pattern this
    unit teaches; and a four-exchange drill confirming both the question
    form and the natural contracted negative "nu-mi place" (the source
    never uses an uncontracted "nu îmi place"). The question form was
    actively re-registered from the source's informal Îţi place to this
    course's established formal Vă place, per AUTHORING_GUIDE #10 --
    Ana and Mihai have used dumneavoastră with each other since unit01.
    "Prefer" (I prefer) and "sau" (or) have no source hit at all (grepped
    the full extracted text for prefer/alege/sau/choice/vrei, zero
    matches) and are freshly authored, disclosed honestly: *prefer* is a
    transparent Latinate cognate verb in standard everyday use, *sau* is
    basic-tier vocabulary -- both independently confidence-checked, not
    sourced. Glosses/notes here are freshly authored to explain the
    target-language forms to an English speaker.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Thirteenth Romanian overlay, first draft, authored alongside the
    paired realization. Needs the same fresh-context review before
    import.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț). For
    free-typed A1 answers, accept otherwise-correct forms with the
    diacritics omitted or with the legacy cedilla variants ş/ţ
    substituted for ș/ț, matching units 01-12's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    This unit introduces the formal Vă place...? question (dative vă,
    matching Mihai's own established faceți/aveți-style formal verb
    endings) alongside first-person Îmi place/Nu-mi place/Prefer, which
    are person-invariant and carry no register distinction of their
    own. Ana and Mihai's dialogue keeps their existing polite register
    with each other, matching every earlier unit.

course:
  title: "Romanian A1"
  description: >-
    Expressing likes, dislikes, and preferences in Romanian -- Îmi
    place (I like), Nu-mi place (I don't like), Vă place...? (Do you
    like...?), Prefer (I prefer), and Sau (or) -- as Ana and Mihai
    settle a coffee-or-tea question.

units:
  ro.a1.unit13.preferences:
    title: "Preferences"

lessons:
  ro.a1.unit13.lesson01.imi_place:
    title: "I like"
  ro.a1.unit13.lesson02.va_place_prefer:
    title: "Do you like? I prefer..."
  ro.a1.unit13.lesson03.cafea_sau_ceaiul:
    title: "Coffee or tea?"

teaching:
  ro.a1.unit13.lesson01.teach.reminder_cafea_ceai_paine:
    title: "Reminder: cafea, ceai, pâine"
    gloss: "cafea (coffee) · ceai (tea) · pâine (bread)"
    note: >-
      All already established in unit06 -- here they combine with this
      unit's own new liking/disliking grammar.

  ro.a1.unit13.lesson01.teach.imi_place_vocab:
    title: "I like"
    gloss: "Îmi place (I like)"
    note: "Literally 'to me it pleases' -- *îmi* (to me) plus the invariant *place* (pleases). To talk about liking something in general, Romanian uses the noun's definite form (*cafeaua*, not the plain *cafea* already known from unit06), the same way English says 'I like *the* coffee' would sound odd but Romanian's own everyday phrasing genuinely works this way for general likes."
    example_gloss:
      - "I like coffee."

  ro.a1.unit13.lesson01.teach.imi_place_cafeaua_phrase:
    title: "I like coffee"
    gloss: "Îmi place cafeaua. (I like coffee.)"
    note: "The complete pattern: Îmi place + the definite noun."

  ro.a1.unit13.lesson01.teach.imi_place_ceaiul_phrase:
    title: "I like tea"
    gloss: "Îmi place ceaiul. (I like tea.)"
    note: "The same pattern as *Îmi place cafeaua*, with a different drink -- *ceaiul* is the definite form of unit06's already-known *ceai*."

  ro.a1.unit13.lesson01.teach.numi_place_vocab:
    title: "I don't like"
    gloss: "Nu-mi place (I don't like)"
    note: "The negative of *Îmi place* -- Romanian contracts *nu îmi* down to *nu-mi* in everyday speech, so this hyphenated short form is the natural way to say it, not just a shortcut."
    example_gloss:
      - "I don't like bread."

  ro.a1.unit13.lesson01.teach.numi_place_painea_phrase:
    title: "I don't like bread"
    gloss: "Nu-mi place pâinea. (I don't like bread.)"
    note: "*Pâinea* is the definite form of unit06's already-known *pâine*, the same pattern as *cafeaua*/*ceaiul*."

  ro.a1.unit13.lesson02.teach.reminder_imi_place_numi_place:
    title: "Reminder: Îmi place, Nu-mi place"
    gloss: "Îmi place (I like) · Nu-mi place (I don't like)"
    note: >-
      Both from this unit's own lesson01 -- here they get a question
      form to go with them.

  ro.a1.unit13.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: "Reminder: cafeaua, ceaiul, pâinea"
    gloss: "cafeaua (the coffee) · ceaiul (the tea) · pâinea (the bread)"
    note: >-
      All from this unit's own lesson01 -- reused here in the question
      and preference forms.

  ro.a1.unit13.lesson02.teach.va_place_vocab:
    title: "Do you like...?"
    gloss: "Vă place...? (Do you like...?)"
    note: "The formal question form of *Îmi place* -- *vă* (to you, formal) replaces *îmi* (to me), the same *dumneavoastră* register already used for *aveți*/*faceți*. Add a definite noun after it, or use it alone once the topic is already clear."
    example_gloss:
      - "Do you like coffee?"

  ro.a1.unit13.lesson02.teach.va_place_cafeaua_phrase:
    title: "Do you like coffee?"
    gloss: "Vă place cafeaua? (Do you like coffee?)"
    note: "The complete pattern: Vă place + the definite noun, with rising question intonation."

  ro.a1.unit13.lesson02.teach.prefer_vocab:
    title: "I prefer"
    gloss: "Prefer (I prefer)"
    note: "A direct, transparent cognate -- no 'to me' construction needed, *prefer* works like an ordinary English-style verb: *Prefer* + the thing preferred, in its definite form like *Îmi place*."
    example_gloss:
      - "I prefer coffee."

  ro.a1.unit13.lesson02.teach.prefer_cafeaua_phrase:
    title: "I prefer coffee"
    gloss: "Prefer cafeaua. (I prefer coffee.)"
    note: "A stronger statement than *Îmi place cafeaua* -- useful when choosing between two things."

  ro.a1.unit13.lesson02.teach.sau_vocab:
    title: "or"
    gloss: "Sau (or)"
    note: "Joins two options when offering or asking about a choice -- different from unit10/unit12's *și* (and), which joins two things both true together."
    example_gloss:
      - "Coffee or tea?"

  ro.a1.unit13.lesson02.teach.cafea_sau_ceai_phrase:
    title: "Coffee or tea?"
    gloss: "Cafea sau ceai? (Coffee or tea?)"
    note: "A short, natural way to offer a choice -- the plain indefinite forms (*cafea*, *ceai*) are used here, not the definite *cafeaua*/*ceaiul*, since this is an open offer rather than a statement about coffee/tea in general."

  ro.a1.unit13.lesson03.teach.reminder_va_place_prefer_sau:
    title: "Reminder: Vă place, Prefer, Sau"
    gloss: "Vă place? (Do you like?) · Prefer (I prefer) · Sau (or)"
    note: "All from this unit's own lesson02 -- here Ana and Mihai use them together."

  ro.a1.unit13.lesson03.teach.reminder_imi_place_numi_place_cafeaua_ceaiul_painea:
    title: "Reminder: Îmi place, Nu-mi place, cafeaua, ceaiul, pâinea"
    gloss: "Îmi place (I like) · Nu-mi place (I don't like) · cafeaua (the coffee) · ceaiul (the tea) · pâinea (the bread)"
    note: "All from this unit's own lesson01 -- here Ana and Mihai each say what they like and don't like."

  ro.a1.unit13.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: "Reminder: bună, mulțumesc, la revedere, Ana, Mihai"
    gloss: "bună (hi) · mulțumesc (thank you) · la revedere (goodbye) · Ana, Mihai (names)"
    note: >-
      All already established in earlier units -- the same friendly
      opening and closing pattern every dialogue in this course has
      used.

  ro.a1.unit13.lesson03.teach.line01:
    title: "Greet and ask about coffee or tea"
    gloss: "Mihai greets Ana and asks if she likes coffee or tea."
    note: "Combines this unit's own *Vă place...?* with *sau* to offer both options in one question."

  ro.a1.unit13.lesson03.teach.line02:
    title: "State a preference and a dislike"
    gloss: "Ana says she prefers coffee and doesn't like tea."
    note: "Combines *Prefer* with *Nu-mi place* -- her preference for coffee matches her own established order from unit06/unit12."

  ro.a1.unit13.lesson03.teach.line03:
    title: "State the opposite preference"
    gloss: "Mihai says he likes tea and doesn't like coffee."
    note: "Matches Mihai's own established order from unit06/unit12 (ceai, never cafea)."

  ro.a1.unit13.lesson03.teach.line04:
    title: "Ask about bread too"
    gloss: "Ana asks if Mihai likes bread too."
    note: "Reuses *Vă place...?* with a new topic, *pâinea*, dropping the already-clear subject the way natural short follow-up questions do."

  ro.a1.unit13.lesson03.teach.line05:
    title: "Confirm, thank, and say goodbye"
    gloss: "Mihai says yes, he likes bread, thanks Ana, and says goodbye."
    note: "Matches Mihai's own established order from unit06 (pâine) -- the same closing pattern every earlier unit's dialogue has ended on."

  ro.a1.unit13.lesson03.teach.line06:
    title: "Close the conversation"
    gloss: "Ana says goodbye back, using Mihai's name."
    note: "The same friendly closing pattern every earlier unit's dialogue has ended on."

exercises:
  ro.a1.unit13.lesson01.exercise01.choose_imi_place:
    instruction: "Which phrase means 'I like'?"
    correct_option: "Îmi place"
    distractors: ["Am fost", "Vreau"]
    accepted_answers: ["Îmi place"]

  ro.a1.unit13.lesson01.exercise02.choose_numi_place:
    instruction: "Which phrase means 'I don't like'?"
    correct_option: "Nu-mi place"
    distractors: ["Îmi place", "Vreau"]
    accepted_answers: ["Nu-mi place"]

  ro.a1.unit13.lesson01.exercise03.listen_imi_place_cafeaua:
    instruction: "Listen and select what you hear."
    correct_option: "Îmi place cafeaua"
    distractors: ["Nu-mi place ceaiul.", "Am fost la parc."]
    accepted_answers: ["Îmi place cafeaua"]

  ro.a1.unit13.lesson01.exercise04.match_preferences1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Îmi place": "I like"
      "Nu-mi place": "I don't like"
      "Cafeaua": "the coffee"
      "Ceaiul": "the tea"
      "Pâinea": "the bread"
      "Cafea": "coffee"
      "Ceai": "tea"
      "Pâine": "bread"

  ro.a1.unit13.lesson01.exercise05.order_imi_place_cafeaua:
    instruction: "Build the sentence: I like coffee."
    correct_response: ["Îmi", "place", "cafeaua"]

  ro.a1.unit13.lesson01.exercise06.listen_order_numi_place_painea:
    instruction: "Listen, then put the words in order."
    correct_response: ["Nu-mi", "place", "pâinea"]

  ro.a1.unit13.lesson01.exercise07.complete_imi_place_cafeaua:
    instruction: "Complete the sentence: I like coffee."
    accepted_answers: ["place", "Place"]
    feedback: "Îmi *place* cafeaua -- this lesson's own invariant 'pleases' verb."

  ro.a1.unit13.lesson01.exercise08.speak_imi_place_ceaiul:
    instruction: "Say aloud: I like tea."
    accepted_answers:
      - "Îmi place ceaiul."
      - "Îmi place ceaiul"

  ro.a1.unit13.lesson02.exercise01.choose_va_place:
    instruction: "Which phrase means 'do you like'?"
    correct_option: "Vă place?"
    distractors: ["Îmi place", "Prefer"]
    accepted_answers: ["Vă place?", "Vă place"]

  ro.a1.unit13.lesson02.exercise02.choose_prefer:
    instruction: "Which word means 'I prefer'?"
    correct_option: "Prefer"
    distractors: ["Vă place", "Sau"]
    accepted_answers: ["Prefer"]

  ro.a1.unit13.lesson02.exercise03.listen_va_place_cafeaua:
    instruction: "Listen and select what you hear."
    correct_option: "Vă place cafeaua"
    distractors: ["Prefer cafeaua.", "Nu-mi place ceaiul."]
    accepted_answers: ["Vă place cafeaua"]

  ro.a1.unit13.lesson02.exercise04.match_preferences2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Vă place?": "Do you like?"
      "Prefer": "I prefer"
      "Sau": "or"
      "Cafeaua": "the coffee"
      "Ceaiul": "the tea"
      "Pâinea": "the bread"
      "Îmi place": "I like"
      "Nu-mi place": "I don't like"

  ro.a1.unit13.lesson02.exercise05.order_prefer_cafeaua:
    instruction: "Build the sentence: I prefer coffee."
    correct_response: ["Prefer", "cafeaua"]

  ro.a1.unit13.lesson02.exercise06.listen_order_cafea_sau_ceai:
    instruction: "Listen, then put the words in order."
    correct_response: ["Cafea", "sau", "ceai"]

  ro.a1.unit13.lesson02.exercise07.complete_cafea_sau_ceai:
    instruction: "Complete the question: Coffee or tea?"
    accepted_answers: ["sau", "Sau"]
    feedback: "Cafea *sau* ceai? -- offering a choice, different from *și* (and)."

  ro.a1.unit13.lesson02.exercise08.speak_va_place_ceaiul:
    instruction: "Say aloud: Do you like tea?"
    accepted_answers:
      - "Vă place ceaiul?"
      - "Vă place ceaiul"

  ro.a1.unit13.lesson03.exercise01.choose_who_says_prefer_cafeaua:
    instruction: "Who says this line?"
    correct_option: "Ana"
    distractors: ["Mihai"]
    accepted_answers: ["Ana"]

  ro.a1.unit13.lesson03.exercise02.dialogue_comprehend_ana_prefer:
    instruction: "Listen to the dialogue. What does Ana prefer to drink?"
    correct_option: "Cafea."
    distractors: ["Ceai.", "Pâine."]
    accepted_answers: ["Cafea."]

  ro.a1.unit13.lesson03.exercise03.reading_comprehend_dislike:
    instruction: "Read the text. What does the writer dislike?"
    correct_option: "Cafeaua."
    distractors:
      - "Ceaiul."
      - "Pâinea."
    accepted_answers:
      - "Cafeaua."
      - "Cafeaua"

  ro.a1.unit13.lesson03.exercise04.match_unit_review:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Îmi place": "I like"
      "Nu-mi place": "I don't like"
      "Vă place?": "Do you like?"
      "Prefer": "I prefer"
      "Sau": "or"
      "Cafeaua": "the coffee"
      "Ceaiul": "the tea"
      "Pâinea": "the bread"

  ro.a1.unit13.lesson03.exercise05.order_va_place_cafeaua:
    instruction: "Build the sentence: Do you like coffee?"
    correct_response: ["Vă", "place", "cafeaua"]

  ro.a1.unit13.lesson03.exercise06.complete_numi_place_ceaiul:
    instruction: "Complete the sentence: I don't like tea."
    accepted_answers: ["place", "Place"]
    feedback: "Nu-mi *place* ceaiul -- the same invariant 'pleases' verb from lesson01."

  ro.a1.unit13.lesson03.exercise07.respond_as_mihai:
    instruction: "Take Mihai's role. Ana asks 'Vă place cafeaua sau ceaiul?' -- tell her you like tea, not coffee."
    accepted_answers:
      - "Îmi place ceaiul! Nu-mi place cafeaua."
      - "Îmi place ceaiul. Nu-mi place cafeaua."
      - "Îmi place ceaiul, nu-mi place cafeaua."
      - "Îmi place ceaiul și nu-mi place cafeaua."

  ro.a1.unit13.lesson03.exercise08.speak_prefer_cafeaua:
    instruction: "Say aloud: I prefer coffee."
    accepted_answers:
      - "Prefer cafeaua."
      - "Prefer cafeaua"

  ro.a1.unit13.lesson03.exercise09.write_preference:
    instruction: "Write a short message: say what you like and what you don't like to drink."
    accepted_answers:
      - "Îmi place cafeaua."
      - "Îmi place cafeaua. Nu-mi place ceaiul."
      - "Îmi place cafeaua, nu-mi place ceaiul."
      - "Îmi place ceaiul."
      - "Îmi place ceaiul. Nu-mi place cafeaua."
      - "Prefer cafeaua."
      - "Prefer ceaiul."
