schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit02_numbers.yaml for full detail.
    Glosses/notes here are freshly authored to explain the target-language
    forms to an English speaker; the underlying Romanian numbers 1-60 and
    100 trace to US Peace Corps Moldova's public-domain "Basic Romanian
    Language Lessons," respelled to standard Romanian orthography.
    Seventy/eighty/ninety were regularly extrapolated from the source's
    own stated combining rule, not sourced directly (see the realization's
    provenance note for detail); age and phone-number phrasing and the
    "de" insertion rule are freshly authored, independent of the source.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    realization file's own review pass -- see that file's review.notes
    for the real bug found and fixed (lesson03's listen_type_phone
    tested_text was missing a digit; this overlay's own
    `accepted_answers` for that exercise were already correct, "zero,
    șapte, doi, unu, patru, cinci, șase, șapte, opt, nouă" / "0721456789",
    so no change was needed on this side). Everything else checked
    clean: correct_response/accepted_answers shapes match the
    realization's word_bank/pairs, no same-speaker distractor
    collisions, no stray YAML booleans, no jargon leaks, English
    glosses/notes are accurate translations of the Romanian forms as
    authored. Second Romanian overlay, first draft, authored alongside
    the paired realization.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț). For
    free-typed A1 answers, accept otherwise-correct forms with the
    diacritics omitted or with the legacy cedilla variants ş/ţ substituted
    for ș/ț, matching unit01's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    question mark/exclamation mark. Spoken answers are assessed for
    intelligibility, not written punctuation.
  register: >-
    tu and dumneavoastră (and their matching verb forms, ai/aveți) are
    never interchangeable answers for each other's exercises, the same
    discipline unit01 established.

course:
  title: "Romanian A1"
  description: >-
    Numbers zero to a hundred, including the teens (-sprezece) and tens
    (-zeci) formation patterns, the doi/două gender contrast, and using
    numbers to ask and answer someone's age and phone number, continuing
    unit01's Ana and Mihai.

units:
  ro.a1.unit02.numbers:
    title: "Numbers"

lessons:
  ro.a1.unit02.lesson01.zero_to_ten:
    title: "Numbers zero to ten"
  ro.a1.unit02.lesson02.eleven_to_hundred:
    title: "Numbers eleven to a hundred"
  ro.a1.unit02.lesson03.age_and_phone:
    title: "Age and phone number"

teaching:
  ro.a1.unit02.lesson01.teach.zero:
    title: "Zero"
    gloss: "zero"
    note: "*Zero* is invariant and is also used to read a digit aloud inside a longer number or phone number."
    example_gloss: "Zero, one, two."

  ro.a1.unit02.lesson01.teach.unu:
    title: "One"
    gloss: "one"
    note: "*Unu* is the form used when counting alone. Before a masculine noun it shortens to *un* (*un câine*, one dog)."
    example_gloss: "One, two, three."

  ro.a1.unit02.lesson01.teach.doi:
    title: "Two (masculine)"
    gloss: "two"
    note: "*Doi* is used with masculine and neuter nouns (*doi bărbați*, two men). The feminine form is different -- see the next card."
    example_gloss: "Two, three, four."

  ro.a1.unit02.lesson01.teach.doi_doua_gender:
    title: "Two changes for gender"
    gloss: "doi (masculine/neuter) / două (feminine)"
    note: >-
      Unlike English "two," Romanian *doi* has a separate feminine form,
      *două*, required with feminine nouns (*două femei*, two women). Only
      the number two does this among the cardinals taught in this unit --
      *trei* and up stay the same for every gender.

  ro.a1.unit02.lesson01.teach.trei:
    title: "Three"
    gloss: "three"
    note: "*Trei* is invariant for every gender."
    example_gloss: "Three, four, five."

  ro.a1.unit02.lesson01.teach.patru:
    title: "Four"
    gloss: "four"
    note: "*Patru* is invariant. Watch its irregular contracted form in the teens: *paisprezece* (14), not *patrusprezece*."
    example_gloss: "Four, five, six."

  ro.a1.unit02.lesson01.teach.cinci:
    title: "Five"
    gloss: "five"
    note: "*Cinci* is invariant."
    example_gloss: "Five, six, seven."

  ro.a1.unit02.lesson01.teach.sase:
    title: "Six"
    gloss: "six"
    note: "*Șase* is invariant."
    example_gloss: "Six, seven, eight."

  ro.a1.unit02.lesson01.teach.sapte:
    title: "Seven"
    gloss: "seven"
    note: "*Șapte* is invariant."
    example_gloss: "Seven, eight, nine."

  ro.a1.unit02.lesson01.teach.opt:
    title: "Eight"
    gloss: "eight"
    note: "*Opt* is invariant."
    example_gloss: "Eight, nine, ten."

  ro.a1.unit02.lesson01.teach.noua:
    title: "Nine"
    gloss: "nine"
    note: >-
      *Nouă* is invariant. Written without its diacritic it would be
      identical to *noua* (\"the new one\"/\"new,\" feminine) -- context
      always makes the meaning clear in speech and in this course's own
      typed-answer tolerance.
    example_gloss: "Nine, ten... done!"

  ro.a1.unit02.lesson01.teach.zece:
    title: "Ten"
    gloss: "ten"
    note: "*Zece* is invariant, and forms the base of every teen number from eleven onward (*zece* + *-sprezece*)."
    example_gloss: "Ten! Well done!"

  ro.a1.unit02.lesson02.teach.unsprezece:
    title: "Eleven"
    gloss: "eleven"
    note: "*Unsprezece* literally builds on *unu* + *spre* + *zece* (\"one over ten\"), the pattern every teen number from here follows."
    example_gloss: "Ten, eleven, twelve."

  ro.a1.unit02.lesson02.teach.teens_pattern:
    title: "Twelve to nineteen"
    gloss: "doisprezece (12), treisprezece (13), paisprezece (14), cincisprezece (15), șaisprezece (16), șaptesprezece (17), optsprezece (18), nouăsprezece (19)"
    note: >-
      Each teen attaches *-sprezece* to the digit's ordinary form: *doi* →
      *doisprezece*, *trei* → *treisprezece*, and so on through *nouă* →
      *nouăsprezece*. The one irregular case is fourteen: *patru* shortens
      to *pai-*, giving *paisprezece* rather than the expected
      *patrusprezece*.

  ro.a1.unit02.lesson02.teach.douazeci:
    title: "Twenty"
    gloss: "twenty"
    note: "*Douăzeci* (\"two tens\") is its own word, the base every number from 21 to 29 builds on."
    example_gloss: "Nineteen, twenty..."

  ro.a1.unit02.lesson02.teach.douazeci_si_unu:
    title: "Twenty-one"
    gloss: "twenty-one"
    note: >-
      From twenty-one onward, Romanian joins the ten and the unit with
      *și* (\"and\"): *douăzeci și unu*, *douăzeci și doi*, and so on --
      unlike the teens, which fuse into one word.
    example_gloss: "Twenty, twenty-one, twenty-two."

  ro.a1.unit02.lesson02.teach.tens_pattern:
    title: "Thirty to ninety"
    gloss: "treizeci (30), patruzeci (40), cincizeci (50), șaizeci (60), șaptezeci (70), optzeci (80), nouăzeci (90)"
    note: >-
      Every ten from thirty up is fully regular: the digit's ordinary form
      plus *-zeci* (\"tens\") -- *trei* → *treizeci*, *patru* →
      *patruzeci*, and so on with no irregular forms, unlike some
      neighboring Romance languages' 70/80/90.

  ro.a1.unit02.lesson02.teach.o_suta:
    title: "One hundred"
    gloss: "one hundred"
    note: >-
      *O sută* uses *o* (the feminine form of \"one\/a\"), not *un*,
      because *sută* is a feminine noun -- not the plain digit *unu* the
      way *o sută* might look at a glance.
    example_gloss: "Ninety, one hundred!"

  ro.a1.unit02.lesson03.teach.cati_ani_ai:
    title: "Ask age informally"
    gloss: "How old are you?"
    note: >-
      Literally \"how many years do you have,\" using *avea* (to have),
      the same *avoir*-style pattern French and Spanish use for age
      instead of a form of \"to be.\" *Câți* (how many, masculine) agrees
      with *ani* (years, masculine).
  ro.a1.unit02.lesson03.teach.am_nouasprezece_ani:
    title: "Give your age (under twenty)"
    gloss: "I'm nineteen."
    note: "*Am* is the *eu* form of *avea*. No *de* is needed before *ani* for numbers under twenty."
  ro.a1.unit02.lesson03.teach.cati_ani_aveti:
    title: "Ask age formally"
    gloss: "How old are you?"
    note: "*Aveți* is the *dumneavoastră* form of *avea*, matching the polite register established in unit01."
  ro.a1.unit02.lesson03.teach.am_treizeci_de_ani:
    title: "Give your age (twenty and up)"
    gloss: "I'm thirty."
    note: "*De* appears here because *treizeci* is twenty or higher -- see the next card for the full rule."
  ro.a1.unit02.lesson03.teach.de_insertion_rule:
    title: "When to add de before a noun"
    gloss: "2-19: no de (doi ani) / 20+: add de (treizeci de ani)"
    note: >-
      A genuine Romanian-specific rule with no English equivalent: numbers
      from 2 to 19 attach directly to the noun (*doi ani*, two years;
      *nouăsprezece ani*, nineteen years), but 20 and above require *de*
      between the number and the noun (*treizeci de ani*, thirty years;
      *o sută de ani*, a hundred years). One is a special case of its own
      (*un an*, one year -- singular, no *de* either way).
  ro.a1.unit02.lesson03.teach.care_e_numarul_tau:
    title: "Ask for a phone number informally"
    gloss: "What's your phone number?"
    note: "*Care* (which/what) is the natural way to ask for a specific existing number, not *ce*. *Tău* (your, informal) agrees with the masculine noun *numărul*."
  ro.a1.unit02.lesson03.teach.care_este_numarul_dvs:
    title: "Ask for a phone number formally"
    gloss: "What's your phone number?"
    note: "*Este* is the full form of *e*, more common in careful or formal speech. *Dumneavoastră* keeps the exchange polite, the same word taught in unit01."
  ro.a1.unit02.lesson03.teach.raspuns_telefon:
    title: "Give a phone number digit by digit"
    gloss: "It's: zero, seven, two, one, four, five, six, seven, eight, nine."
    note: >-
      This unit keeps to simple digit-by-digit reading, the same
      simplifying convention unit01 used for register choices -- a real
      caller may also group digits in pairs, but single digits are always
      understood.

exercises:
  ro.a1.unit02.lesson01.exercise01.listen_run_zero_five:
    instruction: "Listen and select the numbers you hear, in order."
    correct_option: "zero, unu, doi, trei, patru, cinci"
    distractors:
      - "cinci, patru, trei, doi, unu, zero"
      - "unu, doi, trei, patru, cinci, șase"
    accepted_answers: ["zero, unu, doi, trei, patru, cinci"]

  ro.a1.unit02.lesson01.exercise02.choose_sapte:
    instruction: "Which word means 'seven'?"
    correct_option: "șapte"
    distractors: ["șase", "nouă"]
    accepted_answers: ["șapte"]

  ro.a1.unit02.lesson01.exercise03.match_digits:
    instruction: "Match each word to its digit."
    correct_response:
      zero: "0"
      unu: "1"
      doi: "2"
      trei: "3"
      patru: "4"
      cinci: "5"
      șase: "6"
      șapte: "7"
      opt: "8"
      nouă: "9"
      zece: "10"

  ro.a1.unit02.lesson01.exercise04.order_run_three_five:
    instruction: "Build the number sequence."
    correct_response: ["Trei,", "patru,", "cinci."]

  ro.a1.unit02.lesson01.exercise05.doua_feminine_form:
    instruction: "Complete the feminine form."
    accepted_answers: ["două"]
    feedback: "*Doi* is masculine/neuter; the feminine form is *două*."

  ro.a1.unit02.lesson01.exercise06.listen_type_opt:
    instruction: "Type the number you hear."
    accepted_answers: ["opt", "8"]

  ro.a1.unit02.lesson01.exercise07.complete_run:
    instruction: "Complete the sequence."
    accepted_answers: ["trei"]

  ro.a1.unit02.lesson01.exercise08.speak_count_zero_five:
    instruction: "Count aloud from zero to five."
    accepted_answers:
      - "Zero, unu, doi, trei, patru, cinci."
      - "Zero, unu, doi, trei, patru, cinci"

  ro.a1.unit02.lesson02.exercise01.listen_unsprezece:
    instruction: "Listen and select the number you hear."
    correct_option: "unsprezece"
    distractors: ["doisprezece", "treisprezece"]
    accepted_answers: ["unsprezece"]

  ro.a1.unit02.lesson02.exercise02.choose_nouasprezece:
    instruction: "Which digit is 'nouăsprezece'?"
    correct_option: "19"
    distractors: ["9", "90"]
    accepted_answers: ["19"]

  ro.a1.unit02.lesson02.exercise03.match_tens:
    instruction: "Match each word to its digit."
    correct_response:
      douăzeci: "20"
      treizeci: "30"
      patruzeci: "40"
      cincizeci: "50"
      șaizeci: "60"
      șaptezeci: "70"
      optzeci: "80"
      nouăzeci: "90"
      "o sută": "100"

  ro.a1.unit02.lesson02.exercise04.order_douazeci_si_unu:
    instruction: "Build the number 21."
    correct_response: ["Douăzeci", "și", "unu"]

  ro.a1.unit02.lesson02.exercise05.paisprezece_pattern:
    instruction: "Complete the pattern for 14."
    accepted_answers: ["paisprezece"]
    feedback: "*Patru* contracts to *pai-* here -- the one irregular teen, unlike the fully regular *doisprezece*, *treisprezece*, and so on."

  ro.a1.unit02.lesson02.exercise06.listen_type_treizeci:
    instruction: "Type the number you hear."
    accepted_answers: ["treizeci", "30"]

  ro.a1.unit02.lesson02.exercise07.complete_o_suta:
    instruction: "Complete the sequence."
    accepted_answers: ["o sută"]

  ro.a1.unit02.lesson02.exercise08.speak_tens_twenty_hundred:
    instruction: "Say the tens aloud, from twenty to a hundred."
    accepted_answers:
      - "Douăzeci, treizeci, patruzeci, cincizeci, șaizeci, șaptezeci, optzeci, nouăzeci, o sută."
      - "Douăzeci, treizeci, patruzeci, cincizeci, șaizeci, șaptezeci, optzeci, nouăzeci, o sută"

  ro.a1.unit02.lesson03.exercise01.listen_cati_ani_ai:
    instruction: "Listen and select the informal age question you hear."
    correct_option: "Câți ani ai?"
    distractors:
      - "Câți ani aveți?"
      - "Care e numărul tău de telefon?"
    accepted_answers: ["Câți ani ai?", "Câți ani ai"]

  ro.a1.unit02.lesson03.exercise02.choose_meaning:
    instruction: "What does 'Am treizeci de ani' mean?"
    correct_option: "I'm thirty years old."
    distractors:
      - "I have thirty phones."
      - "I'm thirteen years old."
    accepted_answers: ["I'm thirty years old."]

  ro.a1.unit02.lesson03.exercise03.match_teens_review:
    instruction: "Match each word to its digit (11-19)."
    correct_response:
      unsprezece: "11"
      doisprezece: "12"
      treisprezece: "13"
      paisprezece: "14"
      cincisprezece: "15"
      șaisprezece: "16"
      șaptesprezece: "17"
      optsprezece: "18"
      nouăsprezece: "19"

  ro.a1.unit02.lesson03.exercise04.order_phone_question:
    instruction: "Build the informal phone number question."
    correct_response: ["Care", "e", "numărul", "tău", "de", "telefon?"]

  ro.a1.unit02.lesson03.exercise05.polite_form_choice:
    instruction: "Complete the age question for an unfamiliar adult."
    accepted_answers: ["aveți"]
    feedback: "*Aveți* is the polite (dumneavoastră) form, the safe choice with an unfamiliar adult."

  ro.a1.unit02.lesson03.exercise06.listen_type_phone:
    instruction: "Type the phone number digits you hear."
    accepted_answers:
      - "zero, șapte, doi, unu, patru, cinci, șase, șapte, opt, nouă"
      - "zero șapte doi unu patru cinci șase șapte opt nouă"
      - "0721456789"

  ro.a1.unit02.lesson03.exercise07.complete_de_rule:
    instruction: "Complete the sentence."
    accepted_answers: ["de"]
    feedback: "Numbers 20 and up need *de* before the noun: *treizeci de ani*, not *treizeci ani*."

  ro.a1.unit02.lesson03.exercise08.respond_as_mihai:
    instruction: "Take Mihai's role. Ana asks how old you are -- answer that you're twenty-eight."
    accepted_answers:
      - "Am douăzeci și opt de ani."
      - "Am douăzeci și opt de ani"
