answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Romanian A1
  description: 'Beginner Romanian for describing a person''s basic physical appearance: height and age impressions, hair and eye color, the core question Hoe ziet ... eruit?, and comparing two people''s appearance.'
units:
  ro.a1.unit31.aspect:
    title: Describing appearance
lessons:
  ro.a1.unit31.lesson01.inalt_scund_batran_si:
    title: Tall, short, old, and young
  ro.a1.unit31.lesson02.descrierea_parului:
    title: Describing hair
  ro.a1.unit31.lesson03.ochii_si_cum_arata:
    title: Eyes and what does someone look like?
  ro.a1.unit31.lesson04.ana_o_descrie_pe:
    title: Ana describes Nina
  ro.a1.unit31.lesson05.ii_comparam_pe_andrei:
    title: Comparing Andrei and Elena
  ro.a1.unit31.lesson06.mihai_o_recunoaste_pe:
    title: Mihai recognizes Nina
teaching:
  ro.a1.unit31.lesson01.teach.inalt_scund:
    title: Tall and short
    gloss: tall / short
    note: '*Înalt* describes a tall person and *scund* a short person. Both have feminine forms: *înaltă*, *scundă*.'
    example_gloss:
    - Elena is tall.
    - Andrei is short.
  ro.a1.unit31.lesson01.teach.batran_tanar:
    title: Old and young
    gloss: old / young
    note: '*Bătrân* and *tânăr* here describe a general impression of age, not an exact number of years. Feminine forms: *bătrână*, *tânără*.'
    example_gloss:
    - Grandpa is old.
    - Mihai is young.
  ro.a1.unit31.lesson01.teach.pentru_varsta_exacta:
    title: 'Bătrân: an impression or a number'
    gloss: For an exact age you ask Câți ani ai?, while bătrân gives a general impression, as in Bunicul este bătrân.
    note: You can ask for an exact age with *Câți ani ai?* Here *bătrân* describes how old someone LOOKS, with no number attached.
  ro.a1.unit31.lesson01.teach.elena_este_inalta:
    title: Elena is tall and Andrei is short
    gloss: Elena is tall and Andrei is short.
    note: 'A simple combined sentence using *și* (and), setting up the direct comparison in lesson 5; the adjective agrees with the subject: *înaltă* for Elena, *scund* for Andrei.'
  ro.a1.unit31.lesson02.teach.parul:
    title: Hair
    gloss: the hair
    note: '*Păr* is a masculine noun; the article attaches to the end: *părul* (the hair).'
    example_gloss: Mihai has short black hair.
  ro.a1.unit31.lesson02.teach.blond_maro_carunt:
    title: Blond, brown, and grey
    gloss: blond / brown / grey
    note: Three hair colours. They follow the noun *păr* (masculine), so you say *părul blond*, *păr maro*, *păr cărunt*.
    example_gloss:
    - Ana has blond hair.
    - Andrei has brown hair.
    - Grandpa has grey hair.
  ro.a1.unit31.lesson02.teach.lung_scurt:
    title: Long and short (hair)
    gloss: long / short (hair)
    note: '*Lung* (long) and *scurt* (short) describe the length of hair; like colours, they come after the noun.'
    example_gloss:
    - Elena has long hair.
    - Andrei has short hair.
  ro.a1.unit31.lesson02.teach.adjectivul_vine_dupa:
    title: Adjectives follow the noun
    gloss: 'The adjective comes after the noun: păr scurt, păr lung, păr blond, păr maro, păr cărunt, păr negru.'
    note: In Romanian the adjective comes AFTER the noun (*păr scurt*), unlike English "short hair".
  ro.a1.unit31.lesson02.teach.posesivul_vine_dupa:
    title: His and her come after the noun
    gloss: 'The possessive comes after the noun: părul ei (her hair), ochii lui (his eyes).'
    note: '*Ei* means "her" and *lui* means "his"; both go after the noun: *părul ei*. The context shows who is meant.'
  ro.a1.unit31.lesson02.teach.mihai_are_parul:
    title: Mihai has short black hair
    gloss: Mihai has short black hair.
    note: '*Negru* (black) is a colour adjective; it comes after the noun: *păr negru*.'
  ro.a1.unit31.lesson02.teach.ana_are_parul:
    title: Ana has long blond hair
    gloss: Ana has long blond hair.
    note: Combines this lesson's length and color vocabulary in one natural sentence.
  ro.a1.unit31.lesson03.teach.ochii:
    title: Eyes
    gloss: the eyes
    note: '*Ochi* (eye/eyes) looks the same in the singular and the plural; the article shows the number: *ochiul* (the eye), *ochii* (the eyes).'
    example_gloss: Mihai has brown eyes.
  ro.a1.unit31.lesson03.teach.albastru_maro_verde:
    title: Blue, brown, and green
    gloss: blue / brown / green
    note: '*Albastru* (blue), *maro* (brown) and *verde* (green) are colour adjectives. *Maro* never changes; *albastru* becomes *albaștri* and *verde* becomes *verzi* in the plural.'
    example_gloss:
    - Ana has blue eyes.
    - Andrei has brown eyes.
    - Elena has green eyes.
  ro.a1.unit31.lesson03.teach.la_plural_adjectivul:
    title: Plural adjectives
    gloss: 'In the plural the adjective changes: ochi albaștri, ochi maro, ochi verzi.'
    note: With plural *ochi* the adjective takes the plural form (*albaștri*, *verzi*); *maro* stays the same. Compare singular *păr albastru*.
  ro.a1.unit31.lesson03.teach.cum_arata_ana:
    title: What does Ana look like?
    gloss: What does Ana look like?
    note: '*Cum arată ...?* is this unit''s core question; reuse it to ask about anyone''s appearance.'
  ro.a1.unit31.lesson03.teach.ana_are_parul:
    title: Ana has long blond hair and blue eyes
    gloss: Ana has long blond hair and blue eyes.
    note: A model answer combining hair and eyes in one sentence with *și*.
  ro.a1.unit31.lesson04.teach.ana_vine_o:
    title: Ana introduces Nina
    gloss: 'Ana: A new girl is coming to the language café. Her name is Nina.'
    note: '*Vine o fată nouă* ("a new girl is coming") introduces someone new; *O cheamă Nina* gives her name.'
  ro.a1.unit31.lesson04.teach.mihai_bine_cum:
    title: Mihai asks what she looks like
    gloss: 'Mihai: Okay! What does she look like?'
    note: 'Reuses this unit''s core question without a name: *Cum arată?* (the person is clear from context).'
  ro.a1.unit31.lesson04.teach.ana_este_scunda:
    title: Ana describes Nina's height and hair
    gloss: 'Ana: She is short and she has short blond hair.'
    note: Combines lesson 1's *scundă* with lesson 2's hair vocabulary.
  ro.a1.unit31.lesson04.teach.mihai_si_ochii:
    title: Mihai asks about her eyes
    gloss: 'Mihai: And her eyes?'
    note: '*Și ochii?* ("And the eyes?") is a short follow-up question; the person is understood from context.'
  ro.a1.unit31.lesson04.teach.ana_are_ochi:
    title: Ana describes Nina's eyes
    gloss: 'Ana: She has green eyes.'
    note: Reuses *ochi verzi* from lesson 3.
  ro.a1.unit31.lesson04.teach.mihai_multumesc_atunci:
    title: Mihai will recognize her
    gloss: 'Mihai: Thanks! Then I''ll recognize her.'
    note: '*O recunosc* means "I''ll recognize her": *o* is the object pronoun "her" and goes before the verb.'
  ro.a1.unit31.lesson05.teach.andrei_si_elena:
    title: Comparing Andrei and Elena
    gloss: Andrei and Elena are brother and sister, but they look different. Andrei is short and has short brown hair and brown eyes. Elena is taller than Andrei and has long brown hair and green eyes. What do you look like?
    note: A short comparison reusing every color/length word taught so far, ending with the unit's core question directed at the reader.
    glosses:
      frate: brother
      soră: sister
      arată: look
      diferit: different
      scund: short
      scurt: short
      maro: brown
      părul: hair
      ochi: eyes
      înaltă: taller
      lung: long
      verzi: green
      arăți: look (as in what you look like)
  ro.a1.unit31.lesson05.teach.comparativul_se_formeaza:
    title: Comparing with mai ... decât
    gloss: 'The comparative is formed with mai + adjective + decât: Elena este mai înaltă decât Andrei.'
    note: 'Romanian puts *mai* ("more") before the adjective and *decât* ("than") before the second person: *mai înaltă decât Andrei*.'
  ro.a1.unit31.lesson05.teach.elena_are_parul:
    title: Elena has longer hair than Andrei
    gloss: Elena has longer hair than Andrei.
    note: '*Mai lung* works the same way before *decât*: *părul mai lung decât Andrei*; the adjective still follows *părul*.'
  ro.a1.unit31.lesson05.teach.am_parul_scurt:
    title: I have short brown hair
    gloss: I have short brown hair.
    note: A model first-person sentence using *Am ...*, ready to reuse when describing your own appearance.
  ro.a1.unit31.lesson06.teach.mihai_uite_ea:
    title: Mihai spots Nina
    gloss: 'Mihai: Look, is that Nina? She has short blond hair and green eyes.'
    note: '*Uite* (look) draws attention to something; *ea e Nina?* asks "is that Nina?".'
  ro.a1.unit31.lesson06.teach.ana_da_ea:
    title: Ana confirms
    gloss: 'Ana: Yes, that''s Nina!'
    note: A short, natural confirmation.
  ro.a1.unit31.lesson06.teach.nina_salut_tu:
    title: Nina greets Mihai
    gloss: 'Nina: Hi, are you Mihai?'
    note: 'A simple informal greeting question: *tu ești ...?*'
  ro.a1.unit31.lesson06.teach.mihai_da_ma:
    title: Mihai greets Nina back
    gloss: 'Mihai: Yes! Nice to meet you, Nina.'
    note: '*Mă bucur să te cunosc* ("I''m glad to meet you") is the standard phrase for a genuine first meeting.'
  ro.a1.unit31.lesson06.teach.nina_si_eu:
    title: Nina returns the greeting
    gloss: 'Nina: Nice to meet you too!'
    note: Closes the dialogue -- Mihai successfully recognized Nina from Ana's earlier description.
