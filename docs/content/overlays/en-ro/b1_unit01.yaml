    gloss: "alone (fem.)"
    example_gloss: "Ana must not work alone."
  ro.b1.unit01.lesson05.teach.la_timp:
    title: "on time"
    gloss: "on time"
    example_gloss: "She must finish on time."
  ro.b1.unit01.lesson05.teach.ceara:
    title: "(that) she ask for"
    gloss: "(that) she ask for"
    example_gloss: "She should have asked for help."
