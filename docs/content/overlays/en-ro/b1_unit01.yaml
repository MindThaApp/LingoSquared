course:
  title: Romanian B1
  description: >-
    Intermediate Romanian: expressing present necessity, past regret
    about an unfulfilled obligation, and prohibition, using the
    invariant modal trebuie plus a conjunctiv-conjugated subordinate
    verb, across everyday and workplace situations.

units:
  ro.b1.unit01.necessity:
    title: Necessity and Obligation
    description: Express what you must, should, or should have done, using a fixed modal plus a conjugated verb, in present and past tense.

lessons:
  ro.b1.unit01.lesson01.present_necessity_1st2nd:
    title: "I must / you must"
  ro.b1.unit01.lesson02.present_necessity_all_persons:
    title: "All the persons"
  ro.b1.unit01.lesson03.past_necessity_and_negation:
    title: "I should have / must not"
  ro.b1.unit01.lesson04.dialogue_raport:
    title: "The important report"
  ro.b1.unit01.lesson05.reading_temele_anei:
    title: "Ana's homework"
  ro.b1.unit01.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  ro.b1.unit01.lesson01.teach.trebuie:
    title: must / should
    gloss: must / should
    note: "*trebuie* is invariant -- it never conjugates for person, the same word whether you say I must, you must, or they must. English 'must' is also invariant, so this half is intuitive; the trap is the verb AFTER *trebuie*, which Romanian conjugates but English doesn't (English just uses the bare infinitive: 'I must go,' not a special go-form)."
    example_gloss: "I must go home."
  ro.b1.unit01.lesson01.teach.sa:
    title: "(that)"
    gloss: "(that) -- the subjunctive particle"
    note: "*să* introduces a conjunctiv (subjunctive) verb. Romanian has no separate infinitive after modals the way English or French does -- it always uses *să* plus a conjugated verb instead, a genuine structural feature of Romanian, not a quirk of *trebuie* specifically."
    example_gloss: "I must go."
  ro.b1.unit01.lesson01.teach.plec:
    title: "(that) I go/leave"
    gloss: "(that) I go/leave"
    note: "Conjunctiv 'I go,' matching 'I.' For most verbs, the 1st-person conjunctiv form is identical to the everyday indicativ form -- the part that changes with person is at 3rd person, covered in the next lesson."
    example_gloss: "I must go home."
  ro.b1.unit01.lesson01.teach.pleci:
    title: "(that) you go/leave"
    gloss: "(that) you go/leave"
    note: "Conjunctiv 'you go,' matching 'you.' Also identical to the everyday indicativ form."
    example_gloss: "Must you go home?"
  ro.b1.unit01.lesson01.teach.grammar_invariant:
    title: "I must go. Must you go?"
    gloss: "I must go. Must you go?"
    note: "*trebuie* never conjugates for person -- it's the same word whether you say I must, you must, or they must. Instead, the VERB after it changes: *trebuie să plec* (I must go), *trebuie să pleci* (you must go). Don't try to mark 'I' or 'you' on *trebuie* itself -- that never happens; the marking always goes on the verb after *să*."
  ro.b1.unit01.lesson01.teach.acasa:
    title: home
    gloss: home
    note: "*acasă* means 'home' (as in 'going home'), used without a preposition -- *merg acasă*, not *merg la acasă*."
    example_gloss: "I must go home."
  ro.b1.unit01.lesson01.teach.azi:
    title: today
    gloss: today
    example_gloss: "Today I must work."
  ro.b1.unit01.lesson01.teach.lucrez:
    title: I work
    gloss: I work
    note: "*lucrez* -- 1st person of *a lucra* (to work), same word Mihai's job used back in the A1 course."
    example_gloss: "I must work today."
  ro.b1.unit01.lesson01.teach.de_ce:
    title: why
    gloss: why
    example_gloss: "Why must you leave?"

  ro.b1.unit01.lesson02.teach.plece:
    title: "(that) he/she go/leave"
    gloss: "(that) he/she go/leave"
    example_gloss: "Mihai must leave."
  ro.b1.unit01.lesson02.teach.plecam:
    title: "(that) we go/leave"
    gloss: "(that) we go/leave"
    example_gloss: "We must leave."
  ro.b1.unit01.lesson02.teach.plecati:
    title: "(that) you (pl./formal) go/leave"
    gloss: "(that) you (pl./formal) go/leave"
    note: "*plecați* is also the form used for *dumneavoastră* (the polite singular 'you') -- Romanian's polite address always takes the same verb form as literal plural 'you,' the same double duty French *vous* has."
    example_gloss: "Must you (formal) leave?"
  ro.b1.unit01.lesson02.teach.grammar_same_form:
    title: "He/she must leave. They must leave."
    gloss: "He/she must leave. They must leave."
    note: "*trebuie* stays the same in every sentence -- only the conjunctiv verb after it agrees with the subject. A real Romanian quirk worth knowing: the 3rd-person singular and plural conjunctiv forms are IDENTICAL -- *el să plece* (he must leave) and *ei să plece* (they must leave) use the exact same verb form *plece*. You tell them apart only from the subject, not the verb."
  ro.b1.unit01.lesson02.teach.mihai:
    title: "Mihai (name)"
    gloss: Mihai
    example_gloss: "Mihai must leave for the office."
  ro.b1.unit01.lesson02.teach.ei:
    title: they
    gloss: they
    example_gloss: "They must leave together."
  ro.b1.unit01.lesson02.teach.impreuna:
    title: together
    gloss: together
    example_gloss: "We must leave together."
  ro.b1.unit01.lesson02.teach.la_birou:
    title: "at the office"
    gloss: "at the office"
    example_gloss: "Mihai must leave for the office."

  ro.b1.unit01.lesson03.teach.ar_fi_trebuit:
    title: should have
    gloss: should have
    note: "*ar fi trebuit* -- the past-regret form, also invariant like *trebuie* itself. Used for an obligation that existed but wasn't fulfilled."
    example_gloss: "I should have left earlier."
  ro.b1.unit01.lesson03.teach.mai_devreme:
    title: earlier
    gloss: earlier
    example_gloss: "I should have worked earlier."
  ro.b1.unit01.lesson03.teach.nu_trebuie:
    title: must not
    gloss: must not
    note: "*nu trebuie să...* is used here with its prohibition sense ('must not'). Depending on context, the same phrase can also mean 'don't have to' -- Romanian doesn't grammatically distinguish the two the way English does, so real meaning comes from context."
    example_gloss: "You must not go there."
  ro.b1.unit01.lesson03.teach.ieri:
    title: yesterday
    gloss: yesterday
    example_gloss: "I should have worked yesterday."
  ro.b1.unit01.lesson03.teach.acolo:
    title: there
    gloss: there
    example_gloss: "You must not go there."
  ro.b1.unit01.lesson03.teach.pentru_ca:
    title: because
    gloss: because
    example_gloss: "I must leave because I work today."
  ro.b1.unit01.lesson03.teach.ocupat:
    title: busy
    gloss: busy
    example_gloss: "I am busy today."
  ro.b1.unit01.lesson03.teach.grammar_past_neg:
    title: "I should have left. You must not leave."
    gloss: "I should have left. You must not leave."
    note: "Contrast *ar fi trebuit să* (past regret -- an obligation you didn't meet) with *nu trebuie să* (present prohibition -- something you must not do now)."

  ro.b1.unit01.lesson04.teach.raport:
    title: report
    gloss: report
    example_gloss: "I must finish a report."
  ro.b1.unit01.lesson04.teach.termin:
    title: I finish
    gloss: I finish
    example_gloss: "I must finish a report."
  ro.b1.unit01.lesson04.teach.terminati:
    title: "you (pl./formal) finish"
    gloss: "you (pl./formal) finish"
    example_gloss: "Must you (formal) finish the report?"
  ro.b1.unit01.lesson04.teach.termine:
    title: "(that) he/she finish"
    gloss: "(that) he/she finish"
    example_gloss: "Mihai must finish an important report."
  ro.b1.unit01.lesson04.teach.important:
    title: important
    gloss: important
    example_gloss: "I must finish an important report."
  ro.b1.unit01.lesson04.teach.deja:
    title: already
    gloss: already
    example_gloss: "Must you (formal) leave already?"
  ro.b1.unit01.lesson04.teach.inteleg:
    title: I understand
    gloss: I understand
    example_gloss: "I understand, you (formal) must work."
  ro.b1.unit01.lesson04.teach.si_eu:
    title: "me too"
    gloss: "me too"
    example_gloss: "I must leave too."
  ro.b1.unit01.lesson04.teach.dialogue_ana_1:
    title: "Hello, Mihai! Must you leave already?"
    gloss: "Hello, Mihai! Must you leave already?"
  ro.b1.unit01.lesson04.teach.dialogue_mihai_1:
    title: "Yes, I must finish an important report at the office."
    gloss: "Yes, I must finish an important report at the office."
  ro.b1.unit01.lesson04.teach.dialogue_ana_2:
    title: "Should you have finished the report yesterday?"
    gloss: "Should you have finished the report yesterday?"
  ro.b1.unit01.lesson04.teach.dialogue_mihai_2:
    title: "Yes, but I'm busy. I must not be late today."
    gloss: "Yes, but I'm busy. I must not be late today."
  ro.b1.unit01.lesson04.teach.dialogue_ana_3:
    title: "I understand. I must leave too, for school."
    gloss: "I understand. I must leave too, for school."
  ro.b1.unit01.lesson04.teach.dialogue_mihai_3:
    title: "Thank you, Ana! Goodbye!"
    gloss: "Thank you, Ana! Goodbye!"
  ro.b1.unit01.lesson04.teach.dialogue_ana_4:
    title: "Goodbye, Mihai!"
    gloss: "Goodbye, Mihai!"

  ro.b1.unit01.lesson05.teach.teme:
    title: homework
    gloss: homework
    example_gloss: "Ana has a lot of homework."
  ro.b1.unit01.lesson05.teach.pana_vineri:
    title: "by Friday"
    gloss: "by Friday"
    example_gloss: "She must finish the homework by Friday."
  ro.b1.unit01.lesson05.teach.anul_trecut:
    title: "last year"
    gloss: "last year"
    example_gloss: "Last year she was busy."
  ro.b1.unit01.lesson05.teach.anul_acesta:
    title: "this year"
    gloss: "this year"
    example_gloss: "This year Mihai is helping."
  ro.b1.unit01.lesson05.teach.singura:
