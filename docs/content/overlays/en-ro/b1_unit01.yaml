  ro.b1.unit01.lesson06.teach.grammar_review:
    title: "I must go, you must go, he/she must go, we must go, you (pl./formal) must go, they must go. I should have gone. You must not go."
    gloss: "I must go, you must go, he/she must go, we must go, you (pl./formal) must go, they must go. I should have gone. You must not go."
    note: "*trebuie* stays fixed in every sentence -- only the conjunctiv verb after it agrees with the subject: *plec* (I), *pleci* (you), *plece* (he/she/they), *plecăm* (we), *plecați* (you pl./formal)."
  ro.b1.unit01.lesson06.teach.totusi:
