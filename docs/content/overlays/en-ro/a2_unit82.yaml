  ro.a2.unit82.lesson06.exercise03.une_dialog: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Cum o să fie vremea mâine?", "right": "What will the weather be like tomorrow?"}, {"left": "Probabil o să fie soare.", "right": "It will probably be sunny."}, {"left": "Seara poate o să plouă.", "right": "Maybe it will rain in the evening."}, {"left": "Sigur o să mergem în parc.", "right": "We will definitely go to the park."}, {"left": "Nu sunt sigur.", "right": "I'm not sure."}, {"left": "Probabil o să fiu la muncă.", "right": "I will probably be at work."}, {"left": "O să te sun seara.", "right": "I will call you in the evening."}, {"left": "Și eu o să te sun, promit!", "right": "I will call you too, I promise!"}], "status": "correct"}], "feedback": "These are the lines of the dialogue."}
