  ro.a2.unit82.lesson02.exercise07.scrie_maria: {"instruction": "Write the requested Romanian sentence with *o să*.", "correct_option": "Maria o să vină la timp.", "accepted_answers": [{"value": "Maria o să vină la timp.", "status": "correct"}, {"value": "Maria o să vină la timp", "status": "correct"}, {"value": "O să vină Maria la timp.", "status": "correct"}, {"value": "O să vină Maria la timp", "status": "correct"}, {"value": "Maria va veni la timp.", "status": "correct"}, {"value": "Maria va veni la timp", "status": "correct"}], "feedback": "*Maria o să vină la timp.*"}
  ro.a2.unit82.lesson03.exercise01.alege_sigur: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Sigur o să fie cald.", "distractors": ["Poate o să fie cald.", "Sigur nu o să fie cald.", "Probabil o să fie cald."], "accepted_answers": [{"value": "Sigur o să fie cald.", "status": "correct"}], "feedback": "*Sigur* means 'certainly'; *poate* only 'maybe'."}
  ro.a2.unit82.lesson03.exercise02.alege_poate: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Poate o să vină Mihai.", "distractors": ["Sigur o să vină Mihai.", "Probabil nu o să vină Mihai.", "Mihai sigur nu o să vină."], "accepted_answers": [{"value": "Poate o să vină Mihai.", "status": "correct"}], "feedback": "*Poate* shows it is only possible."}
  ro.a2.unit82.lesson03.exercise03.une_grad: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "sigur", "right": "certainly"}, {"left": "probabil", "right": "probably"}, {"left": "poate", "right": "maybe"}, {"left": "Sigur o să plouă.", "right": "It will definitely rain."}, {"left": "Probabil o să plouă.", "right": "It will probably rain."}, {"left": "Poate o să plouă.", "right": "It might rain."}, {"left": "Probabil nu o să plouă.", "right": "It probably won't rain."}, {"left": "Poate nu o să plouă.", "right": "It might not rain."}], "status": "correct"}], "feedback": "Each word shows a different degree of certainty."}
