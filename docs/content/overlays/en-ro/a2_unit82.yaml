  ro.a2.unit82.lesson04.exercise01.alege_va_ploua: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Mâine va ploua.", "distractors": ["Mâine va plouă.", "Mâine voi ploua.", "Mâine o să va ploua."], "accepted_answers": [{"value": "Mâine va ploua.", "status": "correct"}], "feedback": "The formal future is *va* + infinitive: *va ploua*."}
  ro.a2.unit82.lesson04.exercise02.alege_vom: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Vom ajunge la șapte.", "distractors": ["Vor ajunge la șapte.", "Voi ajunge la șapte.", "Veți ajunge la șapte."], "accepted_answers": [{"value": "Vom ajunge la șapte.", "status": "correct"}], "feedback": "*Vom* goes with *noi* ('we')."}
