teaching:
  ro.a2.unit82.lesson01.teach.vreme: {"title": "Weather words", "gloss": "tomorrow / the weather / sun, sunny / wind, windy / cold / warm / it rains", "note": "*Soare* and *vânt* are nouns: *o să fie soare* is literally 'there will be sun'.", "example_gloss": ["Tomorrow it will be sunny.", "Tomorrow it will be cold.", "Tomorrow it will be windy.", "Tomorrow it will rain."]}
  ro.a2.unit82.lesson01.teach.gn_o_sa: {"title": "The spoken future with *o să*", "gloss": "Tomorrow it will be sunny. Tomorrow it will rain. Tomorrow it will be warm.", "note": "*O să* + a verb form says what will happen. The form after *o să* is the present form (*fie*, *plouă*), so the verb does not change for the future; only *o să* signals it."}
  ro.a2.unit82.lesson01.teach.gn_intrebare: {"title": "Asking about the weather", "gloss": "What will the weather be like tomorrow? Tomorrow it will be cold.", "note": "*Cum o să fie vremea?* asks for a prediction. Answer with *o să fie* + the weather word."}
  ro.a2.unit82.lesson01.teach.raspuns: {"title": "A short answer", "gloss": "What will the weather be like? It will be sunny."}
  ro.a2.unit82.lesson02.teach.promit: {"title": "Promises", "gloss": "I promise / that / I come / I call / I write / on time", "note": "*Promit că* ('I promise that') is followed by *o să*. *Te* means 'you' and *îți* means 'to you'.", "example_gloss": ["I promise I will come on time.", "I will call you tomorrow.", "I will write you a message."]}
  ro.a2.unit82.lesson02.teach.gn_persoane: {"title": "*O să* with different people", "gloss": "I will come on time. You will come on time. Maria will come on time.", "note": "After *o să* the verb changes with the person: *eu o să vin*, *tu o să vii*, *ea o să vină*. Only the verb after *o să* changes; *o să* stays the same."}
  ro.a2.unit82.lesson02.teach.gn_promit: {"title": "*Promit că*", "gloss": "I promise I will come. I promise I will call you.", "note": "A promise is *Promit că o să* + verb. *Că* means 'that' and joins the two parts."}
  ro.a2.unit82.lesson02.teach.gn_negare: {"title": "Saying what will not happen", "gloss": "I won't be late. Maria won't be late.", "note": "*Nu* goes right before *o să*: *nu o să întârzii*. The verb after it is *întârzii* for *eu* and *întârzie* for *ea*."}
  ro.a2.unit82.lesson03.teach.grad: {"title": "How sure are you?", "gloss": "certainly, sure / probably / maybe", "note": "*Sigur*, *probabil* and *poate* go before *o să* and show how certain the prediction is.", "example_gloss": ["It will definitely be warm.", "It will probably rain.", "Maybe it will be windy.", "Maybe Mihai will come."]}
  ro.a2.unit82.lesson03.teach.gn_grad: {"title": "Three levels of certainty", "gloss": "It will definitely rain. It will probably rain. Maybe it will rain.", "note": "*Sigur* is certain, *probabil* is likely, *poate* is only possible. The verb after *o să* stays the same."}
  ro.a2.unit82.lesson03.teach.gn_negativ: {"title": "Not likely, maybe not", "gloss": "It probably won't rain. Maybe he won't come.", "note": "With a negative prediction, *nu* stays directly before *o să*: *probabil nu o să plouă*."}
  ro.a2.unit82.lesson03.teach.gn_poate_ca: {"title": "*Poate că*", "gloss": "Maybe it will rain. Maybe it will rain.", "note": "*Poate că* and *poate* mean the same here; the shorter *poate* is very common in speech."}
  ro.a2.unit82.lesson04.teach.voi: {"title": "The future helper", "gloss": "I will / you will / he or she will / we will / you (plural) will / they will", "note": "These six words are placed before the infinitive without *a*: *voi veni*, *vom ajunge*. This is the formal or written future.", "example_gloss": ["I will come on time.", "Maria will come on time.", "We will arrive at seven.", "They will come tomorrow."]}
  ro.a2.unit82.lesson04.teach.gn_formare: {"title": "The formal future", "gloss": "I will come. You will come. He or she will come. We will come. You (plural) will come. They will come.", "note": "The helper changes with the person and the infinitive stays the same. It is common in writing, forecasts and announcements."}
  ro.a2.unit82.lesson04.teach.gn_prognoza: {"title": "Forecast style", "gloss": "Tomorrow it will rain. Tomorrow it will be cold.", "note": "Weather forecasts use *va* + infinitive: *va ploua*, *va fi*. In everyday speech people usually say *o să plouă*."}
  ro.a2.unit82.lesson04.teach.gn_contrast: {"title": "Two ways to say the same", "gloss": "I will come tomorrow. I will come tomorrow. We will arrive at seven. We will arrive at seven.", "note": "Both patterns mean the same. With *o să* the verb after it changes (*vin*, *ajungem*); with *voi/vom* the infinitive is used (*veni*, *ajunge*)."}
  ro.a2.unit82.lesson05.teach.cuvinte: {"title": "Words for a forecast", "gloss": "the forecast / in the morning / in the evening / then", "note": "*Dimineața* and *seara* tell when something will happen.", "example_gloss": ["In the morning it will be cold.", "Then it will be sunny.", "In the evening it will probably rain."]}
  ro.a2.unit82.lesson05.teach.prognoza: {"title": "The forecast for tomorrow", "gloss": "The forecast for tomorrow: in the morning it will be cold. Then it will be sunny. In the evening it will probably rain.", "note": "A forecast uses the formal future *va* + infinitive and words such as *probabil*."}
  ro.a2.unit82.lesson05.teach.mesaj: {"title": "Maria writes to Ana", "gloss": "Hi, Ana! Tomorrow it will be sunny. I will definitely come on time, I promise. Mihai probably won't come, but maybe he will call in the evening. And will you come?", "note": "Maria uses *sigur*, *probabil* and *poate* for three levels of certainty and promises with *promit*."}
  ro.a2.unit82.lesson06.teach.d1: {"title": "Ana asks", "gloss": "Ana: Mihai, what will the weather be like tomorrow?"}
  ro.a2.unit82.lesson06.teach.d2: {"title": "Mihai answers", "gloss": "Mihai: It will probably be sunny, but maybe it will rain in the evening."}
  ro.a2.unit82.lesson06.teach.d3: {"title": "Ana makes a plan", "gloss": "Ana: Then we will definitely go to the park. Will you come too?"}
  ro.a2.unit82.lesson06.teach.d4: {"title": "Mihai is not sure", "gloss": "Mihai: I'm not sure. I will probably be at work."}
  ro.a2.unit82.lesson06.teach.d5: {"title": "Ana offers to call", "gloss": "Ana: OK. Then I will call you in the evening."}
  ro.a2.unit82.lesson06.teach.d6: {"title": "Mihai promises", "gloss": "Mihai: And I will call you too, I promise!"}
  ro.a2.unit82.lesson06.teach.d7: {"title": "Ana ends the call", "gloss": "Ana: Perfect! See you tomorrow!"}
