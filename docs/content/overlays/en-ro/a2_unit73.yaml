teaching:
  ro.a2.unit73.lesson01.teach.castile:
    title: The headphones
    gloss: the headphones
    note: '*Căștile* is plural in Romanian, as ''headphones'' is in English: *căști* with the article *-le* attached.'
    example_gloss: I bought new headphones.
  ro.a2.unit73.lesson01.teach.aceste_casti_sunt:
    title: Reporting the headphones are broken
    gloss: These headphones are broken.
    note: '*Stricat* (broken) describes any object that no longer works. It agrees with the noun, so *căștile sunt stricate* uses the plural feminine form.'
  ro.a2.unit73.lesson01.teach.partea_stanga_nu:
    title: Describing which side doesn't work
    gloss: The left side doesn't work.
    note: '*Nu funcționează* (does not work) is the standard way to say that a device or part is not working. In *partea stângă* (''the left side'') the adjective comes after the noun.'
  ro.a2.unit73.lesson02.teach.banii_inapoi:
    title: The money back
    gloss: the money back/refund
    note: '*Banii înapoi* (literally ''the money back'') is the usual phrase for a refund. *Banii* is the plural of *ban* with the article attached.'
    example_gloss: I would like my money back.
  ro.a2.unit73.lesson02.teach.as_dori_banii:
    title: Requesting a refund
    gloss: I would like my money back.
    note: '*Aș dori* (''I would like'') is the polite conditional of *a dori*; it softens a request.'
  ro.a2.unit73.lesson02.teach.pot_sa_schimb:
    title: Asking about exchange or refund
    gloss: Can I exchange it or get my money back?
    note: '*A schimba* (to exchange) and *a-și primi banii înapoi* (to get one''s money back) are the two standard resolutions to a complaint.'
  ro.a2.unit73.lesson03.teach.bonul:
    title: The receipt
    gloss: the receipt
    note: '*Bonul* is the everyday word for a shop receipt; it is masculine, with the article *-ul* attached.'
    example_gloss: I still have the receipt, here it is.
  ro.a2.unit73.lesson03.teach.mai_aveti_bonul:
    title: Asking if the customer has the receipt
    gloss: Do you still have the receipt?
    note: '*Mai* (still) in *Mai aveți bonul?* checks whether the customer still has the receipt.'
  ro.a2.unit73.lesson03.teach.le_am_cumparat:
    title: Saying when you bought something
    gloss: I bought it eight days ago.
    note: In *acum opt zile* (eight days ago) Romanian puts *acum* ('ago') in front of the time period. *Le-am cumpărat* is *am cumpărat* with *le* ('them') attached for the headphones.
  ro.a2.unit73.lesson04.teach.politica_de_retur:
    title: The return policy
    gloss: the return policy
    note: '*Politica de retur* is the usual phrase for a shop''s return policy: *politica* (the policy) + *de retur* (of return).'
    example_gloss: What's this shop's return policy?
  ro.a2.unit73.lesson04.teach.puteti_returna_un:
    title: Stating the return window
    gloss: You can return an item within thirty days.
    note: '*În termen de* (within) + a time period is the standard construction for a deadline or window. Numbers above nineteen take *de* before the noun: *treizeci de zile*.'
  ro.a2.unit73.lesson04.teach.ma_ocup_eu:
    title: Offering to arrange something
    gloss: I'll arrange that for you.
    note: '*Mă ocup eu de asta* (I''ll take care of that) is a common, reassuring phrase used by staff helping a customer.'
  ro.a2.unit73.lesson05.teach.politica_de_retur:
    title: Reading a return policy notice
    gloss: 'Return policy: you can return an item within thirty days of purchase. Bring the receipt. For a defective item, you''ll get your money back or you can exchange it for a new one.'
    note: '*Pentru un produs defect* (for a defective item) introduces the specific case covered by this part of the policy.'
    glosses:
      retur: return policy
      puteți: can (polite 'you' form of a putea)
      produs: item / article
      termen: term (în termen de = within)
      treizeci: thirty
      zile: days
      după: after
      achiziție: purchase
      returna: to bring back / return
      Aduceți: bring (polite imperative of a aduce)
      bonul: receipt
      dumneavoastră: with you (formal; aduceți ... cu dumneavoastră = bring ... with you)
      Pentru: in the case of / for
      defect: defective / faulty
      primiți: get (polite 'you' form of a primi)
      vă: your (formal)
      banii: money
      înapoi: back
      sau: or
      schimba: to exchange
      cu: with (schimba cu = exchange for)
      nou: new
      exemplar: unit / copy (of a product)
  ro.a2.unit73.lesson06.teach.buna_ziua_cu:
    title: Employee opens the conversation
    gloss: 'Employee: Good afternoon, how can I help you?'
  ro.a2.unit73.lesson06.teach.buna_ziua_aceste:
    title: Mihai reports the problem
    gloss: 'Mihai: Good afternoon, these headphones are broken. The left side doesn''t work.'
  ro.a2.unit73.lesson06.teach.ce_neplacut_mai:
    title: Employee asks for the receipt
    gloss: 'Employee: That''s annoying. Do you still have the receipt?'
  ro.a2.unit73.lesson06.teach.da_iata_l:
    title: Mihai confirms and gives the purchase date
    gloss: 'Mihai: Yes, here it is. I bought it eight days ago.'
  ro.a2.unit73.lesson06.teach.nu_este_nicio:
    title: Employee confirms it's within the window
    gloss: 'Employee: That''s not a problem, that''s within the thirty days. Would you like to exchange it or get your money back?'
  ro.a2.unit73.lesson06.teach.as_dori_banii:
    title: Mihai chooses a refund
    gloss: 'Mihai: I would like my money back.'
  ro.a2.unit73.lesson06.teach.perfect_ma_ocup:
    title: Employee confirms it's arranged
    gloss: 'Employee: Great, I''ll arrange that for you.'
  ro.a2.unit73.lesson06.teach.el_a_cumparat:
    title: 'Third person: a cumpărat / și-a primit'
    gloss: He bought the headphones. She got her money back.
    note: 'The third person of the perfect compus uses *a* + participle: *a cumpărat* (he or she bought). *El* (he) and *ea* (she) are the matching pronouns, usually left out. In *și-a primit banii înapoi* the *și-* means ''her own'' (reflexive): she got her own money back.'
