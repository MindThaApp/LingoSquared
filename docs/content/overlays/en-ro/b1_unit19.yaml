course:
  title: Romanian B1
  description: >-
    Intermediate Romanian: combining two facts into one richer sentence
    with a relative clause -- plain "care" (who/that), "care" combined
    with a preposition ("în care", "cu care"), and the gender-agreeing
    possessive relative "al cărui" (whose, masculine/neuter) vs "a
    cărei" (whose, feminine).

units:
  ro.b1.unit19.descrieri_relative:
    title: "The Colleague I Talk About"
    description: Combine two facts about a person, place, or thing into one sentence with a relative clause, including forms that combine with a preposition or agree in gender.

lessons:
  ro.b1.unit19.lesson01.care_subiect:
    title: "Care (subject)"
  ro.b1.unit19.lesson02.prepozitie_care:
    title: "Preposition + care"
  ro.b1.unit19.lesson03.al_carui_a_carei:
    title: "Al cărui / a cărei (whose)"
  ro.b1.unit19.lesson04.dialogue_descrieri_relative:
    title: "Dialogue: descriptions with relative clauses"
  ro.b1.unit19.lesson05.wrapup_production:
    title: "Wrap-up"

teaching:
  ro.b1.unit19.lesson01.teach.mihai_care_este_inginer:
    title: "Mihai, who is an engineer, works at this office"
    gloss: "Mihai, who is an engineer, works at this office"
    note: "*care* -- new here as a relative pronoun: \"care\" as the subject of its own clause, combining two facts into one sentence."
    example_gloss: "Mihai, who is an engineer, has worked at this office for ten years."
  ro.b1.unit19.lesson01.teach.de_zece_ani:
    title: "for ten years"
    gloss: "for ten years"
    example_gloss: "Mihai, who is an engineer, has worked at this office for ten years."
  ro.b1.unit19.lesson01.teach.grammar_care_subject:
    title: "Care as subject: combining two facts, invariant for gender"
    gloss: "Mihai, who is an engineer, has worked at this office for ten years. \"Care\" combines two facts about Mihai (he is an engineer + he works here) into one richer sentence. \"Care\" as a subject does not change with the gender of what it refers to."
    note: "The unit's baseline relative-clause construction."

  ro.b1.unit19.lesson02.teach.biroul_in_care_lucram:
    title: "the office in which we work is very modern"
    gloss: "the office in which we work is very modern"
    note: "New here: \"care\" combined with a preposition (\"în care\" -- in which)."
    example_gloss: "The office in which we work is very modern."
  ro.b1.unit19.lesson02.teach.colegul_cu_care_vorbesc:
    title: "the colleague with whom I speak most often is Mihai"
    gloss: "the colleague with whom I speak most often is Mihai"
    example_gloss: "The colleague with whom I speak most often is Mihai."
  ro.b1.unit19.lesson02.teach.grammar_preposition_care:
    title: "Preposition + care: in which, with whom"
    gloss: "The office in which we work is very modern. The colleague with whom I speak most often is Mihai. When the relative clause needs a preposition (\"in\", \"with\"), the preposition comes before \"care\": \"in which\", \"with whom\"."
    note: "The unit's second construction: preposition + care."

  ro.b1.unit19.lesson03.teach.mihai_al_carui_birou:
    title: "Mihai, whose office is next to mine, is an engineer"
    gloss: "Mihai, whose office is next to mine, is an engineer"
    note: "*al cărui* (whose) -- new: the possessive relative used when the possessed noun is masculine or neuter (\"birou\" is neuter); *al meu* -- mine."
    example_gloss: "Mihai, whose office is next to mine, is an engineer."
  ro.b1.unit19.lesson03.teach.diana_a_carei_carte:
    title: "Diana, whose favorite book is about projects, learns a lot"
    gloss: "Diana, whose favorite book is about projects, learns a lot"
    note: "*a cărei* (whose) -- new: used when the possessed noun is feminine (\"carte\", book); *preferată* -- favorite."
    example_gloss: "Diana, whose favorite book is about projects, learns a lot from Mihai."
  ro.b1.unit19.lesson03.teach.grammar_al_carui_a_carei_agreement:
    title: "Al cărui / a cărei: two parts agree with two different genders"
    gloss: "Mihai, whose office is next to mine, is an engineer. Diana, whose favorite book is about projects, learns a lot. \"Al cărui\"/\"a cărei\" have two parts that agree with two different things: \"cărui\"/\"cărei\" (plural \"căror\") agree with the gender of the OWNER -- Mihai is masculine, so \"cărui\"; Diana is feminine, so \"cărei\" -- while \"al\"/\"a\" (plural \"ai\"/\"ale\") agree with the gender of the thing OWNED -- \"birou\" (office) is neuter, which agrees like a masculine in the singular, so \"al\"; \"book\" is feminine, so \"a\". In these two examples the owner's gender and the owned thing's gender happen to line up, but the two parts track two different genders, not the same one."
    note: "The unit's third construction: the gender-agreeing possessive relative -- this satisfies the outcome's explicit gender/number agreement requirement. Correction 2026-07-17: the rule tracks TWO genders (owner via cărui/cărei, possessed noun via al/a), not one."

  ro.b1.unit19.lesson04.teach.dialogue_ana_1:
    title: "Mihai, who is an engineer, has worked at this office for ten years."
    gloss: "Mihai, who is an engineer, has worked at this office for ten years."
  ro.b1.unit19.lesson04.teach.dialogue_diana_1:
    title: "Yes, and the office in which we work is very modern."
    gloss: "Yes, and the office in which we work is very modern."
  ro.b1.unit19.lesson04.teach.dialogue_ana_2:
    title: "The colleague with whom I speak most often is Mihai."
    gloss: "The colleague with whom I speak most often is Mihai."
  ro.b1.unit19.lesson04.teach.dialogue_diana_2:
    title: "And I, whose favorite book is about projects, learn a lot from him."
    gloss: "And I, whose favorite book is about projects, learn a lot from him."

  ro.b1.unit19.lesson05.teach.grammar_review:
    title: "Review: relative clauses with care and al cărui / a cărei"
    gloss: "Mihai, who is an engineer, has worked at this office for ten years. The office in which we work is very modern. The colleague with whom I speak most often is Mihai. Mihai, whose office is next to mine, is an engineer. Diana, whose favorite book is about projects, learns a lot."
  ro.b1.unit19.lesson05.teach.raportul_despre_care:
    title: "the report about which we talked in the meeting is ready"
    gloss: "the report about which we talked in the meeting is ready"
    example_gloss: "The report about which we talked in the meeting is ready now."

