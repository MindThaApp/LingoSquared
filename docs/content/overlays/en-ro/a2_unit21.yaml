schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a2_unit21_birocratie.yaml for full
    detail. The Peace Corps Moldova PDF was checked and has zero
    dedicated bureaucracy/registration material at any level; every
    word and phrase here is authored fresh from general standard
    Romanian knowledge. Glosses/notes here are freshly authored to
    explain the target-language forms, including the new A2 conditional
    ("aș dori") and reflexive-subjunctive ("să mă înscriu") grammar, to
    an English speaker.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    First Romanian A2 overlay, authored alongside the paired
    realization. correct_response/accepted_answers shapes were checked
    to match the realization's word_bank/pairs (including exact
    token-multiset agreement for both word_order exercises and the two
    listen_order exercises) before finalizing, per the standing
    validate_order_word_bank_answers compiler check. Every multi-clause
    accepted_answers list checked against AUTHORING_GUIDE #12 for
    period/comma/conjunction-joined variants where a natural multi-
    clause answer exists.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț). For
    free-typed A2 answers, accept otherwise-correct forms with the
    diacritics omitted or with the legacy cedilla variants ş/ţ
    substituted for ș/ț, matching units 01-20's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    Fully formal dumneavoastră register throughout, since Ana and Elena
    are strangers meeting at a city-hall counter -- matches this unit's
    course-level register_policy. "Aș dori" (I would like, conditional)
    and "ați putea" are the new polite-request forms this unit
    introduces; accept the plainer "vreau" as an alternate free-typed
    answer where a writing_prompt allows an open response, but the
    conditional is the taught, preferred form and is what every
    correct_option/accepted_answers entry uses.

course:
  title: "Romanian A2"
  description: >-
    Handling a registration appointment at the primărie (city hall) in
    Romanian -- Programare (appointment), Aș dori (I would like), Mă
    înscriu (I register), Act/Buletin (document/ID card), and Formular
    (form) -- as Ana registers her new address with funcționara Elena.

units:
  ro.a2.unit21.birocratie:
    title: "Bureaucracy"

lessons:
  ro.a2.unit21.lesson01.o_programare:
    title: "An appointment at the city hall"
  ro.a2.unit21.lesson02.ce_acte_imi_trebuie:
    title: "What documents do I need?"
  ro.a2.unit21.lesson03.anuntul_de_la_primarie:
    title: "The notice at the city hall"
  ro.a2.unit21.lesson04.la_primarie:
    title: "At the city hall"

teaching:
  ro.a2.unit21.lesson01.teach.reminder_buna_multumesc_la_revedere:
    title: "Reminder: Bună ziua, Mulțumesc, La revedere"
    gloss: "Bună ziua (good day, formal) · Mulțumesc (thank you) · La revedere (goodbye)"
    note: "From unit01/unit17's formal-register greetings, reused here to open and close a city-hall visit."

  ro.a2.unit21.lesson01.teach.primarie_vocab:
    title: "City hall"
    gloss: "Primărie (city hall)"
    note: "A feminine noun -- the local government office where residents register their address."
    example_gloss:
      - "I'm going to the city hall."

  ro.a2.unit21.lesson01.teach.programare_vocab:
    title: "Appointment"
    gloss: "Programare (appointment)"
    note: "A feminine noun for a scheduled meeting -- distinct from A1's plain requests, this unit's exchanges are booked ahead of time."
    example_gloss:
      - "Do you have a free appointment?"

  ro.a2.unit21.lesson01.teach.as_dori_grammar:
    title: "Aș dori (I would like)"
    gloss: "Aș dori (I would like) -- the conditional of *a dori*, 'to wish/desire'"
    note: "New grammar this unit: the conditional mood softens a request, the formal step up from A1's plain *vreau* (I want). Always followed by *să* + a verb, e.g. *aș dori să mă înscriu*."

  ro.a2.unit21.lesson01.teach.inscriu_vocab:
    title: "I register (myself)"
    gloss: "Mă înscriu (I register / I enroll myself)"
    note: "The reflexive verb *a se înscrie* -- *mă* is the reflexive pronoun 'myself.' Follows *să* in the subjunctive construction, another new A2 pattern: *să mă înscriu*, literally 'that I register myself.'"
    example_gloss:
      - "I would like to register at the new address."

  ro.a2.unit21.lesson01.teach.as_dori_inscriu_phrase:
    title: "I would like to register at the new address."
    gloss: "Aș dori să mă înscriu la noua adresă."
    note: "Combines the conditional *aș dori* with the reflexive-subjunctive *să mă înscriu* -- the core polite request this unit builds toward."

  ro.a2.unit21.lesson01.teach.cand_programare_phrase:
    title: "When do you have a free appointment?"
    gloss: "Când aveți o programare liberă?"
    note: "*Liberă* (free/available, feminine) agrees with *programare* -- the everyday way to ask about appointment availability."

  ro.a2.unit21.lesson02.teach.act_vocab:
    title: "Document"
    gloss: "Act (document), plural Acte"
    note: "A neuter noun -- the general word for an official document or paper."
    example_gloss:
      - "What documents do I need?"

  ro.a2.unit21.lesson02.teach.buletin_vocab:
    title: "ID card"
    gloss: "Buletin (ID card)"
    note: "Romania's national identity card -- neuter noun, here shown in its definite form *buletinul* ('the ID card')."
    example_gloss:
      - "You need your ID card."

  ro.a2.unit21.lesson02.teach.ce_acte_trebuie_phrase:
    title: "What documents do I need?"
    gloss: "Ce acte îmi trebuie? (What documents do I need?)"
    note: "*Îmi trebuie* -- 'I need' -- the first-person counterpart of the *vă trebuie* pattern this lesson also teaches."

  ro.a2.unit21.lesson02.teach.proprietate_vocab:
    title: "The property deed"
    gloss: "Actul de proprietate (the property deed)"
    note: "*Act* + *de proprietate* (of ownership) -- the document proving Ana owns her house, consistent with unit18's own fact that she has a house rather than a rental."
    example_gloss:
      - "You need the property deed."

  ro.a2.unit21.lesson02.teach.trebuie_grammar:
    title: "Trebuie (impersonal, invariant)"
    gloss: "Vă trebuie (you need, formal) · Îmi trebuie (I need)"
    note: "*Trebuie* never changes form regardless of who needs something -- only the pronoun before it changes (*vă*, *îmi*). A common A2 impersonal-construction pattern."

  ro.a2.unit21.lesson02.teach.formular_vocab:
    title: "Form"
    gloss: "Formular (form) · Completați (you fill out, formal imperative)"
    note: "*Formular* is the paper application form; *completați* is the polite command form used with strangers."
    example_gloss:
      - "You must fill out this form."

  ro.a2.unit21.lesson02.teach.va_trebuie_phrase:
    title: "You need your ID card and the property deed."
    gloss: "Vă trebuie buletinul și actul de proprietate."
    note: "The clerk's standard answer when asked what documents are required."

  ro.a2.unit21.lesson02.teach.completati_formular_phrase:
    title: "You must fill out this form."
    gloss: "Trebuie să completați acest formular."
    note: "*Trebuie să* + verb is the general 'must' construction -- another core A2 subjunctive pattern, distinct from the reflexive *să mă înscriu* from lesson01."

  ro.a2.unit21.lesson03.teach.inscrierea_vocab:
    title: "The registration"
    gloss: "Înscrierea (the registration)"
    note: "The noun form of *a se înscrie*, with the definite article -- used in formal written notices rather than the verb form."
    example_gloss:
      - "For the registration at the new address, you need your ID card."

  ro.a2.unit21.lesson03.teach.contract_vocab:
    title: "The rental contract"
    gloss: "Contractul de închiriere (the rental contract) · Sau (or)"
    note: "Listed as an alternative to the property deed on the official notice -- a resident who rents rather than owns would bring this instead."
    example_gloss:
      - "The property deed or a rental contract."

  ro.a2.unit21.lesson03.teach.orele_vocab:
    title: "Between the hours of"
    gloss: "Între orele nouă și cincisprezece (between nine and fifteen o'clock)"
    note: "Romanian official notices commonly state hours on the 24-hour clock -- *cincisprezece* here means 3 PM, not fifteen o'clock in a literal sense a learner might expect."
    example_gloss:
      - "Appointments are made between nine and fifteen o'clock."

  ro.a2.unit21.lesson03.teach.anunt_reading:
    title: "The registration notice"
    gloss: >-
      To register at the new address, you need your ID card, the property
      deed or the rental contract, and the completed form. Appointments are
      made Monday through Friday, between nine and fifteen o'clock (3 PM).
    glosses:
      înscrierea: "registration"
      noua: "new"
      adresă: "address"
      aveți: "you have (from a avea)"
      nevoie: "need"
      buletin: "ID card"
      actul: "document / deed"
      proprietate: "property"
      contractul: "contract"
      închiriere: "rental"
      formularul: "form"
      completat: "completed"
      Programările: "appointments"
      fac: "are made (from a face)"
      luni: "Monday"
      vineri: "Friday"
      orele: "hours / o'clock"
      nouă: "nine"
      cincisprezece: "fifteen"

  ro.a2.unit21.lesson04.teach.reminder_perfect_poftim_ordine:
    title: "Reminder: Perfect, Poftim, Totul este în ordine"
    gloss: "Perfect (perfect/great) · Poftim (here you go) · Totul este în ordine (everything is in order)"
    note: "Standard formal-counter phrases -- new this unit, introduced directly in the dialogue rather than a separate vocabulary card, since each is transparent from its English cognate or context."

  ro.a2.unit21.lesson04.teach.line01:
    title: "Greet Elena and state the request"
    gloss: "Ana greets Elena and says she would like to register at the new address."
    note: "Reuses this unit's own lesson01 phrase exactly."

  ro.a2.unit21.lesson04.teach.line02:
    title: "Ask about the appointment"
    gloss: "Elena asks if Ana has an appointment."
    note: "New line, transparent from taught vocabulary."

  ro.a2.unit21.lesson04.teach.line03:
    title: "Confirm the appointment time"
    gloss: "Ana confirms: yes, for ten o'clock."
    note: "New line, transparent from taught vocabulary."

  ro.a2.unit21.lesson04.teach.line04:
    title: "Ask for the documents"
    gloss: "Elena says 'Perfect' and asks Ana for her ID card and property deed."
    note: "*Îmi puteți da...?* (Could you give me...?) is a new polite-request pattern, the conditional-flavored *puteți* (you can/could, formal)."

  ro.a2.unit21.lesson04.teach.line05:
    title: "Hand over the documents"
    gloss: "Ana hands them over and says she has also filled out the form."
    note: "Reuses lesson02's own *formular* and *completat* vocabulary."

  ro.a2.unit21.lesson04.teach.line06:
    title: "Confirm everything is in order"
    gloss: "Elena thanks her, confirms everything is in order, and says the confirmation will arrive by post."
    note: "New line -- *veți primi* (you will receive, formal future) is a new future-tense form."

  ro.a2.unit21.lesson04.teach.line07:
    title: "Thank Elena and say goodbye"
    gloss: "Ana thanks her warmly and wishes her a good day."
    note: "*O zi bună!* (Have a good day!) is a new closing phrase, more elaborate than A1's plain *la revedere*."

  ro.a2.unit21.lesson04.teach.line08:
    title: "Say goodbye"
    gloss: "Elena wishes her a good day too and says goodbye."
    note: "Echoes Ana's own closing phrase back."

exercises:
  ro.a2.unit21.lesson01.exercise01.choose_primarie:
    instruction: "Which word means 'city hall'?"
    correct_option: "Primărie"
    distractors: ["Programare", "Formular"]
    accepted_answers: ["Primărie"]

  ro.a2.unit21.lesson01.exercise02.choose_as_dori:
    instruction: "Which phrase means 'I would like'?"
    correct_option: "Aș dori"
    distractors: ["Mă înscriu", "Vă trebuie"]
    accepted_answers: ["Aș dori"]

  ro.a2.unit21.lesson01.exercise03.listen_as_dori_inscriu:
    instruction: "Listen and select what you hear."
    correct_option: "Aș dori să mă înscriu la noua adresă"
    distractors: ["Când aveți o programare liberă?", "Vă trebuie buletinul."]
    accepted_answers: ["Aș dori să mă înscriu la noua adresă"]

  ro.a2.unit21.lesson01.exercise04.match_birocratie1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Primărie": "city hall"
      "Programare": "appointment"
      "Aș dori": "I would like"
      "Mă înscriu": "I register (myself)"
      "Adresă": "address"
      "Liberă": "free / available"
      "Bună ziua.": "Good day."
      "Aș dori să mă înscriu la noua adresă.": "I would like to register at the new address."

  ro.a2.unit21.lesson01.exercise05.order_as_dori_inscriu:
    instruction: "Build the sentence: I would like to register at the new address."
    correct_response: ["Aș", "dori", "să", "mă", "înscriu", "la", "noua", "adresă"]

  ro.a2.unit21.lesson01.exercise06.listen_order_cand_programare:
    instruction: "Listen, then put the words in order."
    correct_response: ["Când", "aveți", "o", "programare", "liberă"]

  ro.a2.unit21.lesson01.exercise07.complete_as_dori_inscriu:
    instruction: "Complete the sentence: I would like to register at the new address."
    accepted_answers: ["înscriu", "Înscriu"]
    feedback: "Aș dori să mă *înscriu* la noua adresă -- *înscriu* is the reflexive-subjunctive form, 'that I register myself.'"

  ro.a2.unit21.lesson01.exercise08.write_appointment_request:
    instruction: "Write a short sentence saying you would like to register at a new address, or asking about an appointment."
    accepted_answers:
      - "Aș dori să mă înscriu la noua adresă."
      - "Când aveți o programare liberă?"
      - "Aș dori o programare."

  ro.a2.unit21.lesson02.exercise01.choose_buletin:
    instruction: "Which word means 'ID card'?"
    correct_option: "Buletin"
    distractors: ["Act", "Formular"]
    accepted_answers: ["Buletin"]

  ro.a2.unit21.lesson02.exercise02.choose_formular:
    instruction: "Which word means 'form'?"
    correct_option: "Formular"
    distractors: ["Buletin", "Act"]
    accepted_answers: ["Formular"]

  ro.a2.unit21.lesson02.exercise03.listen_ce_acte_trebuie:
    instruction: "Listen and select what you hear."
    correct_option: "Ce acte îmi trebuie"
    distractors: ["Vă trebuie buletinul.", "Trebuie să completați acest formular."]
    accepted_answers: ["Ce acte îmi trebuie"]

  ro.a2.unit21.lesson02.exercise04.match_birocratie2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Act": "document"
      "Buletin": "ID card"
      "Actul de proprietate": "the property deed"
      "Formular": "form"
      "Ce acte îmi trebuie?": "What documents do I need?"
      "Trebuie să completați acest formular.": "You must fill out this form."
      "Primărie": "city hall"
      "Programare": "appointment"

  ro.a2.unit21.lesson02.exercise05.order_va_trebuie_buletin:
    instruction: "Build the sentence: You need your ID card and the property deed."
    correct_response: ["Vă", "trebuie", "buletinul", "și", "actul", "de", "proprietate"]

  ro.a2.unit21.lesson02.exercise06.listen_order_ce_acte_trebuie:
    instruction: "Listen, then put the words in order."
    correct_response: ["Ce", "acte", "îmi", "trebuie"]

  ro.a2.unit21.lesson02.exercise07.complete_va_trebuie:
    instruction: "Complete the sentence: You need your ID card and the property deed."
    accepted_answers: ["proprietate", "Proprietate"]
    feedback: "Actul de *proprietate* -- the property deed, the document proving ownership of a home."

  ro.a2.unit21.lesson02.exercise08.translate_must_fill_form:
    instruction: "Translate into Romanian."
    accepted_answers:
      - "Trebuie să completați acest formular."
      - "Trebuie sa completati acest formular."

  ro.a2.unit21.lesson03.exercise01.read_required_documents:
    instruction: "Read the notice. Which documents does it require?"
    correct_option: "Buletinul, actul de proprietate sau contractul de închiriere, și formularul completat."
    distractors:
      - "Doar buletinul."
      - "Doar formularul."
    accepted_answers:
      - "Buletinul, actul de proprietate sau contractul de închiriere, și formularul completat."

  ro.a2.unit21.lesson03.exercise02.read_office_hours:
    instruction: "Read the notice. When can appointments be made?"
    correct_option: "De luni până vineri, între orele nouă și cincisprezece."
    distractors:
      - "De luni până sâmbătă, între orele opt și zece."
    accepted_answers:
      - "De luni până vineri, între orele nouă și cincisprezece."

  ro.a2.unit21.lesson03.exercise03.listen_anunt:
    instruction: "Listen and select what you hear."
    correct_option: "Programările se fac de luni până vineri"
    distractors: ["Aș dori să mă înscriu la noua adresă.", "Vă trebuie buletinul și actul de proprietate."]
    accepted_answers: ["Programările se fac de luni până vineri"]

  ro.a2.unit21.lesson03.exercise04.match_anunt:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Înscrierea": "the registration"
      "Contractul de închiriere": "the rental contract"
      "Între orele nouă și cincisprezece": "between nine and fifteen o'clock"
      "De luni până vineri": "Monday to Friday"
      "Buletinul": "the ID card"
      "Actul de proprietate": "the property deed"

  ro.a2.unit21.lesson03.exercise05.complete_orele:
    instruction: "Complete the notice, nine to fifteen o'clock: Programările se fac între orele nouă și ___."
    accepted_answers: ["cincisprezece", "Cincisprezece"]
    feedback: "Între orele nouă și *cincisprezece* -- Romanian official notices use the 24-hour clock, so this means 9 AM to 3 PM."

  ro.a2.unit21.lesson03.exercise06.write_registration_request:
    instruction: "Write a short formal message requesting or confirming a registration appointment, mentioning at least one document you will bring."
    accepted_answers:
      - "Aș dori o programare pentru înscriere. Voi aduce buletinul și actul de proprietate."
      - "Aș dori să mă înscriu la noua adresă. Am buletinul și formularul completat."

  ro.a2.unit21.lesson04.exercise01.choose_who_asks_documents:
    instruction: "Who says this line?"
    correct_option: "Elena"
    distractors: ["Ana"]
    accepted_answers: ["Elena"]

  ro.a2.unit21.lesson04.exercise02.dialogue_comprehend_appointment_time:
    instruction: "Listen to the dialogue. What time is Ana's appointment?"
    correct_option: "Ora zece."
    distractors: ["Ora nouă."]
    accepted_answers: ["Ora zece."]

  ro.a2.unit21.lesson04.exercise03.dialogue_comprehend_documents:
    instruction: "Listen to the dialogue. Which two documents does Elena ask for?"
    correct_option: "Buletinul și actul de proprietate."
    distractors: ["Formularul și contractul de închiriere."]
    accepted_answers: ["Buletinul și actul de proprietate."]

  ro.a2.unit21.lesson04.exercise04.dialogue_comprehend_confirmation:
    instruction: "Listen to the dialogue. How will Ana receive her confirmation?"
    correct_option: "Prin poștă."
    distractors: ["Prin telefon."]
    accepted_answers: ["Prin poștă."]

  ro.a2.unit21.lesson04.exercise05.order_ii_puteti_da:
    instruction: "Build the sentence: Could you give me the ID card and the property deed?"
    correct_response: ["Îmi", "puteți", "da", "buletinul", "și", "actul", "de", "proprietate"]

  ro.a2.unit21.lesson04.exercise06.respond_as_ana:
    instruction: "Take Ana's role. Elena asks 'Îmi puteți da buletinul și actul de proprietate?' -- hand them over and mention the form."
    accepted_answers:
      - "Poftim. Am completat și formularul."
      - "Poftim, am completat și formularul."

  ro.a2.unit21.lesson04.exercise07.write_registration_summary:
    instruction: "Write a short sentence summarizing what Ana did at the city hall, using at least one word from this unit."
    accepted_answers:
      - "Ana s-a înscris la noua adresă cu buletinul și actul de proprietate."
      - "Ana a completat formularul la primărie."
      - "Ana a arătat buletinul și actul de proprietate Elenei."
