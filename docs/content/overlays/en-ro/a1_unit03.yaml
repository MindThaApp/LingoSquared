schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit03_dates.yaml for full detail.
    Glosses/notes here are freshly authored to explain the target-language
    forms to an English speaker; the underlying Romanian weekday/month
    vocabulary and the întâi first-of-month rule trace to US Peace Corps
    Moldova's public-domain "Basic Romanian Language Lessons," respelled
    to standard Romanian orthography. The date-asking phrases, lowercase-
    writing rules, "La mulți ani!" expression, and the closing Ana/Mihai
    dialogue are freshly authored, independent of the source.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    realization file's own review pass. Checked clean: correct_response/
    accepted_answers shapes match the realization's word_bank/pairs, no
    same-speaker distractor collisions, no stray YAML booleans, no
    jargon leaks, English glosses/notes are accurate translations of
    the Romanian forms as authored. Third Romanian overlay, first
    draft, authored alongside the paired realization.

    Second-pass review 2026-10-19: 7 fixes - answer_policy promised
    diacritic/cedilla tolerance the grader does not apply (reworded);
    luni/marți note said weekday names never change form, miercuri/joi
    note called them invariant, and duminică note said weekday names
    take no article (they do: lunea, duminica = on Mondays/Sundays) -
    all three corrected; întâi note and first_day_word feedback said
    the 1st is "never" unu (softened to standard-usage wording);
    first_day_word instruction rewritten for its new prompt;
    respond_as_mihai now also accepts the subject-less answers "Este
    vineri, întâi august." and "Vineri, întâi august."

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with
    comma-below ș/ț). Typed answers are checked with their diacritics:
    a spelling without them, or with the older cedilla letters ş/ţ, is
    accepted only where an exercise lists it explicitly, matching units
    01/02's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    question mark/exclamation mark. Day and month names are correctly
    lowercase in standard Romanian writing (except sentence-initially);
    accept a learner's answer regardless of the case they happen to type
    it in -- this unit teaches the lowercase convention as a fact to
    recognize, not a hard-graded spelling rule.
  register: >-
    No new register-sensitive forms in this unit -- este (is) is
    invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing
    dialogue keeps the dumneavoastră register unit01 already established
    between them.

course:
  title: "Romanian A1"
  description: >-
    Days of the week, months of the year, and how Romanian states a
    calendar date (a plain cardinal number plus the month, except the
    1st, which uses the special word întâi) -- continuing Ana and Mihai
    as they schedule their next meeting.

units:
  ro.a1.unit03.dates:
    title: "Days and dates"

lessons:
  ro.a1.unit03.lesson01.zilele_saptamanii:
    title: "Days of the week"
  ro.a1.unit03.lesson02.lunile_si_datele:
    title: "Months of the year, and how we say the date"
  ro.a1.unit03.lesson03.cand_ne_intalnim:
    title: "When do we meet again?"

teaching:
  ro.a1.unit03.lesson01.teach.este:
    title: "Reminder: este"
    gloss: "is / it is"
    note: >-
      *Este* already appeared in Unit 2 (*Care este numărul...?*). It is
      invariant -- the same word whether the subject is a day, a date, or
      anything else, and it does not change between tu and dumneavoastră.

  ro.a1.unit03.lesson01.teach.astazi_maine:
    title: "Today, tomorrow"
    gloss: "astăzi (today) / mâine (tomorrow)"
    note: "Both are invariant time words that sit at the front of a sentence stating what day or date it is."
    example_gloss:
      - "Today is Monday."
      - "Tomorrow is Tuesday."

  ro.a1.unit03.lesson01.teach.luni_marti:
    title: "Monday, Tuesday"
    gloss: "luni (Monday) / marți (Tuesday)"
    note: "To name a day (Astăzi este luni), use the bare form shown here. Weekday names do have article forms -- lunea, marțea -- which mean 'on Mondays', 'on Tuesdays'; you will meet those later."
    example_gloss:
      - "It's Monday today."
      - "It's Tuesday tomorrow."

  ro.a1.unit03.lesson01.teach.miercuri_joi:
    title: "Wednesday, Thursday"
    gloss: "miercuri (Wednesday) / joi (Thursday)"
    note: "Like luni and marți, miercuri and joi keep the same form in the singular and the plural."
    example_gloss:
      - "Today is Wednesday."
      - "Tomorrow is Thursday."

  ro.a1.unit03.lesson01.teach.vineri_sambata:
    title: "Friday, Saturday"
    gloss: "vineri (Friday) / sâmbătă (Saturday)"
    note: "Sâmbătă keeps its â in the middle of the word under modern spelling, unlike the source material's older sîmbătă."
    example_gloss:
      - "Today is Friday."
      - "Tomorrow is Saturday."

  ro.a1.unit03.lesson01.teach.duminica:
    title: "Sunday"
    gloss: "Sunday"
    note: "Duminică completes the week. To say what day it is, use this bare form; the article form duminica means 'on Sundays'."
    example_gloss: "Today is Sunday."

  ro.a1.unit03.lesson01.teach.ce_zi_e_azi:
    title: "Ask what day it is"
    gloss: "What day is it today?"
    note: "The everyday way to ask which day of the week it is -- zi (day) is the new word here, alongside already-familiar ce, este, and astăzi."

  ro.a1.unit03.lesson01.teach.saptamana_ieri:
    title: "Week, yesterday, last/next week"
    gloss: "săptămână (week) / ieri (yesterday) / săptămâna trecută (last week) / săptămâna viitoare (next week)"
    note: >-
      A bonus vocabulary set from the same source material as the weekday
      names -- useful for talking about dates in relative terms, not
      individually drilled as heavily as the weekdays themselves in this
      unit's exercises.

  ro.a1.unit03.lesson01.teach.lowercase_zile:
    title: "Days are written lowercase"
    gloss: "Days aren't written with a capital letter: Monday, Friday."
    note: >-
      Unlike English, Romanian weekday names are not capitalized in the
      middle of a sentence -- *luni*, not *Luni*, except when the word
      itself opens a sentence.

  ro.a1.unit03.lesson02.teach.ian_feb_mar:
    title: "January, February, March"
    gloss: "ianuarie (January) / februarie (February) / martie (March)"
    note: "Unlike the weekday names, several month names are recognizable cognates of their English/Latin equivalents."
    example_gloss:
      - "It's January."
      - "It's February."
      - "It's March."

  ro.a1.unit03.lesson02.teach.apr_mai_iun:
    title: "April, May, June"
    gloss: "aprilie (April) / mai (May) / iunie (June)"
    note: "Mai (May) is short but distinct from mai the adverb (more) used elsewhere in this course (ce mai faci) -- context always disambiguates."
    example_gloss:
      - "It's April."
      - "It's May."
      - "It's June."

  ro.a1.unit03.lesson02.teach.iul_aug_sep:
    title: "July, August, September"
    gloss: "iulie (July) / august (August) / septembrie (September)"
    note: "August looks identical to its English spelling -- one of the most transparent cognates in this set."
    example_gloss:
      - "It's July."
      - "It's August."
      - "It's September."

  ro.a1.unit03.lesson02.teach.oct_noi_dec:
    title: "October, November, December"
    gloss: "octombrie (October) / noiembrie (November) / decembrie (December)"
    note: "The final three months complete the set of twelve, all invariant nouns."
    example_gloss:
      - "It's October."
      - "It's November."
      - "It's December."

  ro.a1.unit03.lesson02.teach.intai:
    title: "The first (of the month)"
    gloss: "the first"
    note: >-
      A genuine Romanian-specific rule: in standard usage the first day of
      a month is not called *unu* (plain "one") -- it uses its own special
      word, *întâi*. (You may hear *unu* in casual speech, but *întâi* is
      the form to learn.) Every other date, from the second onward, uses
      the ordinary cardinal number instead.
    example_gloss: "Today is the first of August."

  ro.a1.unit03.lesson02.teach.date_rule:
    title: "How Romanian states a date"
    gloss: "1st: întâi · 2nd and up: the ordinary number (doi, trei, patru...)"
    note: >-
      Once past the 1st, Romanian dates are just the plain cardinal number
      (covered earlier) followed by the month -- no ordinal form
      and no extra word needed, e.g. *trei aprilie* (April third,
      literally "three April").

  ro.a1.unit03.lesson02.teach.ce_data:
    title: "Ask the date"
    gloss: "What is the date today?"
    note: "Dată (date) is a new word here; the rest of the question reuses ce, este, and astăzi exactly as the day question did in lesson01."

  ro.a1.unit03.lesson02.teach.raspuns_data:
    title: "State a date"
    gloss: "Today is April third."
    note: "Trei (three) is Unit 2's own cardinal number; no ordinal ending and no extra word is added before aprilie."

  ro.a1.unit03.lesson02.teach.la_multi_ani:
    title: "Wish someone well on a special day"
    gloss: "Happy birthday! / Happy New Year!"
    note: >-
      Literally "(for) many years" -- the single most common Romanian
      well-wish for a birthday, a name day, or New Year's, reusing *ani*
      (years) from Unit 2's age content.

  ro.a1.unit03.lesson02.teach.lowercase_luni:
    title: "Months are written lowercase too"
    gloss: "Months aren't written with a capital letter: January, May."
    note: "The same rule as weekday names in lesson01 -- Romanian month names stay lowercase mid-sentence."

  ro.a1.unit03.lesson03.teach.cand:
    title: "When?"
    gloss: "when?"
    note: "Când opens a question about timing, the same role English when plays."
    example_gloss: "When is the meeting?"

  ro.a1.unit03.lesson03.teach.intalnirea:
    title: "The meeting"
    gloss: "the meeting"
    note: "Întâlnirea is the definite form (the meeting) -- the bare noun would be întâlnire."
    example_gloss: "The meeting is on Monday."

  ro.a1.unit03.lesson03.teach.cand_e_intalnirea:
    title: "Ask when something is"
    gloss: "When is the meeting?"
    note: "Puts când together with the already-familiar este and this lesson's new întâlnirea."

  ro.a1.unit03.lesson03.teach.raspuns_intalnire:
    title: "State the date of an event"
    gloss: "The meeting is on Friday, August first."
    note: "A weekday and a date can be stated together, comma-separated, exactly as in English."

  ro.a1.unit03.lesson03.teach.fara_de:
    title: "No de needed for days and dates"
    gloss: "Days and dates don't need 'de': Friday, August first."
    note: >-
      A useful contrast with Unit 2's own rule: numbers 20 and up need
      *de* before an ordinary noun (*treizeci de ani*), but a weekday or a
      date attaches directly with no *de* at all.

  ro.a1.unit03.lesson03.teach.line01:
    title: "Ask when the meeting is"
    gloss: "Ana asks Mihai when their meeting is."
    note: "A plain, register-neutral question -- este doesn't change with tu or dumneavoastră."

  ro.a1.unit03.lesson03.teach.line02:
    title: "State the date"
    gloss: "Mihai says the meeting is Friday, August first."
    note: "Mihai reuses lesson02's exact date pattern: weekday, then întâi + month, no de."

  ro.a1.unit03.lesson03.teach.line03:
    title: "Acknowledge and close"
    gloss: "Ana thanks him and says goodbye."
    note: "La revedere, first taught in Unit 1, closes the exchange the same way it always has."

  ro.a1.unit03.lesson03.teach.line04:
    title: "Close the encounter"
    gloss: "Mihai says goodbye back, using Ana's name."
    note: "Echoing la revedere with the other person's name is a natural, friendly way to close."

exercises:
  ro.a1.unit03.lesson01.exercise01.listen_luni:
    instruction: "Listen and select the day you hear."
    correct_option: "luni"
    distractors: ["marți", "joi"]
    accepted_answers: ["luni"]

  ro.a1.unit03.lesson01.exercise02.choose_vineri:
    instruction: "Which word means 'Friday'?"
    correct_option: "vineri"
    distractors: ["marți", "duminică"]
    accepted_answers: ["vineri"]

  ro.a1.unit03.lesson01.exercise03.match_weekdays:
    instruction: "Match each day to its English name."
    correct_response:
      luni: "Monday"
      marți: "Tuesday"
      miercuri: "Wednesday"
      joi: "Thursday"
      vineri: "Friday"
      sâmbătă: "Saturday"
      duminică: "Sunday"

  ro.a1.unit03.lesson01.exercise04.order_day_question:
    instruction: "Build the question asking what day it is."
    correct_response: ["Ce", "zi", "este", "astăzi"]

  ro.a1.unit03.lesson01.exercise05.complete_next_day:
    instruction: "Complete the sentence."
    accepted_answers: ["vineri"]
    feedback: "If today is Thursday (*joi*), tomorrow is Friday (*vineri*)."

  ro.a1.unit03.lesson01.exercise06.listen_type_duminica:
    instruction: "Type the day you hear."
    accepted_answers: ["duminică"]

  ro.a1.unit03.lesson01.exercise07.complete_lowercase_rule:
    instruction: "Complete the spelling rule."
    accepted_answers: ["mare"]
    feedback: "Days aren't written with a capital (*mare*) letter mid-sentence -- *luni*, not *Luni*."

  ro.a1.unit03.lesson01.exercise08.speak_weekdays:
    instruction: "Say the seven days of the week in order."
    accepted_answers:
      - "Luni, marți, miercuri, joi, vineri, sâmbătă, duminică."
      - "Luni, marți, miercuri, joi, vineri, sâmbătă, duminică"

  ro.a1.unit03.lesson02.exercise01.listen_ianuarie:
    instruction: "Listen and select the month you hear."
    correct_option: "ianuarie"
    distractors: ["februarie", "iunie"]
    accepted_answers: ["ianuarie"]

  ro.a1.unit03.lesson02.exercise02.choose_septembrie:
    instruction: "Which word means 'September'?"
    correct_option: "septembrie"
    distractors: ["iunie", "noiembrie"]
    accepted_answers: ["septembrie"]

  ro.a1.unit03.lesson02.exercise03.match_months:
    instruction: "Match each month to its English name."
    correct_response:
      ianuarie: "January"
      februarie: "February"
      martie: "March"
      aprilie: "April"
      mai: "May"
      iunie: "June"
      iulie: "July"
      august: "August"
      septembrie: "September"
      octombrie: "October"
      noiembrie: "November"
      decembrie: "December"

  ro.a1.unit03.lesson02.exercise04.order_date_question:
    instruction: "Build the question asking today's date."
    correct_response: ["Ce", "dată", "este", "astăzi"]

  ro.a1.unit03.lesson02.exercise05.first_day_word:
    instruction: "Write the word used for the 1st of a month in a date."
    accepted_answers: ["întâi"]
    feedback: "In standard Romanian the first of a month is *întâi*, not the plain number *unu*."

  ro.a1.unit03.lesson02.exercise06.listen_type_decembrie:
    instruction: "Type the month you hear."
    accepted_answers: ["decembrie"]

  ro.a1.unit03.lesson02.exercise07.complete_date_number:
    instruction: "Write the number as it's said in a date."
    accepted_answers: ["trei"]
    feedback: "From the 2nd of the month onward, the date is just the ordinary cardinal number -- 3 becomes *trei*, no ordinal ending."

  ro.a1.unit03.lesson02.exercise08.speak_todays_date:
    instruction: "Say today's date aloud: April third."
    accepted_answers:
      - "Astăzi este trei aprilie."
      - "Astăzi este trei aprilie"

  ro.a1.unit03.lesson03.exercise01.choose_meeting_day:
    instruction: "What day is the meeting?"
    correct_option: "vineri"
    distractors: ["luni", "duminică"]
    accepted_answers: ["vineri"]

  ro.a1.unit03.lesson03.exercise02.dialogue_comprehend_date:
    instruction: "Listen to the dialogue and select the meeting's date."
    correct_option: "întâi august"
    distractors: ["trei aprilie", "opt mai"]
    accepted_answers: ["întâi august"]

  ro.a1.unit03.lesson03.exercise03.reading_comprehend_meeting:
    instruction: "When is the meeting, according to Mihai?"
    correct_option: "Vineri, întâi august."
    distractors:
      - "Luni, trei aprilie."
      - "Duminică, întâi septembrie."
    accepted_answers: ["Vineri, întâi august.", "Vineri, întâi august"]

  ro.a1.unit03.lesson03.exercise04.match_review:
    instruction: "Match each word to its English meaning."
    correct_response:
      luni: "Monday"
      vineri: "Friday"
      ianuarie: "January"
      august: "August"
      întâlnirea: "the meeting"
      când: "when"

  ro.a1.unit03.lesson03.exercise05.order_meeting_question:
    instruction: "Build the question asking when the meeting is."
    correct_response: ["Când", "este", "întâlnirea"]

  ro.a1.unit03.lesson03.exercise06.complete_meeting_day:
    instruction: "Complete Mihai's answer."
    accepted_answers: ["vineri"]

  ro.a1.unit03.lesson03.exercise07.respond_as_mihai:
    instruction: "Take Mihai's role. Ana asks when the meeting is -- answer that it's Friday, August first."
    accepted_answers:
      - "Întâlnirea este vineri, întâi august."
      - "Întâlnirea este vineri, întâi august"
      - "Este vineri, întâi august."
      - "Vineri, întâi august."

  ro.a1.unit03.lesson03.exercise08.speak_meeting_date:
    instruction: "Say when the meeting is: Friday, August first."
    accepted_answers:
      - "Întâlnirea este vineri, întâi august."
      - "Întâlnirea este vineri, întâi august"
