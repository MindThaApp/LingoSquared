schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit14_comparisons.yaml for full
    detail. This unit's source PDF (US Peace Corps Moldova's "Basic
    Romanian Language Lessons") was checked for comparison/size material
    and found a real, directly relevant hit: its own adjective
    vocabulary list gives "big: mare" (already established as course
    vocabulary since ro's own unit03/unit05, reused here as a reminder,
    not re-taught), and a separate worked example, "Am o mică problemă.
    (I have a small problem.)", directly confirms the feminine small-
    adjective form *mică* this unit teaches. No source hit covers the
    comparative construction itself -- grepped the full extracted text
    for decât/comparative forms with zero matches beyond the unrelated
    month name "mai" (May) and the unrelated "Ce mai faceţi?" idiom
    already used in ro's own unit01 -- so *mai* (the comparative
    particle here) and *decât* (than) are freshly authored, disclosed
    honestly: both are basic-tier, extremely common Romanian grammar
    with no plausible substitute, independently confidence-checked, not
    sourced. Glosses/notes here are freshly authored to explain the
    target-language forms to an English speaker.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    realization file's own review pass. Checked clean: correct_response/
    accepted_answers shapes match the realization's word_bank/pairs, no
    same-speaker distractor collisions, no stray YAML booleans, no
    jargon leaks, English glosses/notes are accurate translations of
    the Romanian forms as authored. Fourteenth Romanian overlay, first
    draft, authored alongside the paired realization.

    Second-pass review 2026-10-19: 5 fixes - answer_policy.diacritics
    promised a tolerance the grader does not apply (rewritten); mic_mica
    note said mare never changes form (it has plural mari; now 'same
    form for masculine and feminine in the singular'); mai_vocab note
    called the mai of Ce mai faceți? a different word (it is the same
    word in another use); exercise09.write_comparison was
    underdetermined (instruction now names the coffee/tea comparison;
    added Ceaiul e mai mic decât cafeaua and este variants);
    exercise07.respond_as_ana now also accepts the taught full form
    este.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with
    comma-below ș/ț. Free-typed answers are graded against these
    standard spellings: the grader does not fold away omitted
    diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should
    type the full standard spelling.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    This unit's own new vocabulary (mic/mică, mai, decât) is entirely
    person-invariant and carries no register distinction of its own.
    Ana and Mihai's dialogue keeps their existing polite register with
    each other, matching every earlier unit; no new second-person form
    is introduced here (unlike unit13's Vă place...?).

course:
  title: "Romanian A1"
  description: >-
    Comparing familiar things in Romanian -- Mare (big), Mic/Mică
    (small), and the Mai ... decât (more/-er ... than) comparative
    construction -- as Ana and Mihai compare the size of their coffee,
    tea, and bread.

units:
  ro.a1.unit14.comparisons:
    title: "Comparisons"

lessons:
  ro.a1.unit14.lesson01.mare_mic:
    title: "Big, small"
  ro.a1.unit14.lesson02.mai_mare_mai_mica:
    title: "Bigger, smaller"
  ro.a1.unit14.lesson03.cafeaua_mai_mare:
    title: "Which is bigger?"

teaching:
  ro.a1.unit14.lesson01.teach.reminder_mare:
    title: "Reminder: mare"
    gloss: "mare (big)"
    note: >-
      Already established in unit03 ("literă mare", capital letter) and
      unit05 ("o familie mare", a big family) -- here it gets a real
      comparison partner, *mic/mică*.

  ro.a1.unit14.lesson01.teach.reminder_cafeaua_ceaiul_painea:
    title: "Reminder: cafeaua, ceaiul, pâinea, cafea, ceai"
    gloss: "cafeaua (the coffee) · ceaiul (the tea) · pâinea (the bread) · cafea (coffee) · ceai (tea)"
    note: >-
      All from unit06/unit13 -- this unit uses the definite forms as the
      things being compared by size, and reuses the indefinite forms
      again in this lesson's own matching exercise.

  ro.a1.unit14.lesson01.teach.mic_mica_vocab:
    title: "Small"
    gloss: "Mic (small, masc./neut.) · Mică (small, fem.)"
    note: "Romanian adjectives agree with the noun they describe -- *ceai* (tea) takes the masculine/neuter form *mic*, while *cafea* (coffee) and *pâine* (bread) are feminine and take *mică*. *Mare* (big) has the same form for masculine and feminine in the singular, which is why it never needed this split."
    example_gloss:
      - "The tea is small."
      - "The coffee is small."

  ro.a1.unit14.lesson01.teach.ceaiul_e_mic_phrase:
    title: "The tea is small"
    gloss: "Ceaiul e mic. (The tea is small.)"
    note: "*Ceaiul* is neuter, so it takes the masculine/neuter form *mic*."

  ro.a1.unit14.lesson01.teach.cafeaua_e_mica_phrase:
    title: "The coffee is small"
    gloss: "Cafeaua e mică. (The coffee is small.)"
    note: "*Cafeaua* is feminine, so it takes the feminine form *mică*."

  ro.a1.unit14.lesson01.teach.painea_e_mica_phrase:
    title: "The bread is small"
    gloss: "Pâinea e mică. (The bread is small.)"
    note: "*Pâinea* is also feminine, so it takes *mică* the same way *cafeaua* does."

  ro.a1.unit14.lesson02.teach.reminder_mare_mic_mica:
    title: "Reminder: Mare, Mic, Mică"
    gloss: "Mare (big) · Mic (small, masc./neut.) · Mică (small, fem.)"
    note: >-
      All from this unit's own lesson01 -- here they get a comparative
      form.

  ro.a1.unit14.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: "Reminder: cafeaua, ceaiul, pâinea"
    gloss: "cafeaua (the coffee) · ceaiul (the tea) · pâinea (the bread)"
    note: >-
      All from unit13, reused again here as the things being compared.

  ro.a1.unit14.lesson02.teach.mai_vocab:
    title: "More / -er"
    gloss: "Mai (more / -er, comparative)"
    note: "Not the month *mai* (May, unit03). It is the same little word you saw in 'Ce mai faceți?' (unit01), but here it does a different job as the comparative particle: put *mai* before an adjective to mean 'more ___' or '___-er', the standard way Romanian forms a comparative."
    example_gloss:
      - "The coffee is bigger."

  ro.a1.unit14.lesson02.teach.mai_mare_phrase:
    title: "The coffee is bigger"
    gloss: "Cafeaua e mai mare. (The coffee is bigger.)"
    note: "*Mai* + the adjective -- no other change needed."

  ro.a1.unit14.lesson02.teach.decat_vocab:
    title: "Than"
    gloss: "Decât (than)"
    note: "Completes the comparison -- *mai* + adjective + *decât* + the second thing being compared."
    example_gloss:
      - "The coffee is bigger than the tea."

  ro.a1.unit14.lesson02.teach.mai_mare_decat_phrase:
    title: "The coffee is bigger than the tea"
    gloss: "Cafeaua e mai mare decât ceaiul. (The coffee is bigger than the tea.)"
    note: "The complete comparative pattern: [thing] + e + mai + [adjective] + decât + [second thing]."

  ro.a1.unit14.lesson02.teach.mai_mica_decat_phrase:
    title: "The bread is smaller than the coffee"
    gloss: "Pâinea e mai mică decât cafeaua. (The bread is smaller than the coffee.)"
    note: "The same pattern with *mică*, the feminine small-form from this unit's own lesson01."

  ro.a1.unit14.lesson03.teach.reminder_mai_decat_mare_mic_mica:
    title: "Reminder: Mai, Decât, Mare, Mic, Mică"
    gloss: "Mai (more/-er) · Decât (than) · Mare (big) · Mic (small, masc./neut.) · Mică (small, fem.)"
    note: "All from this unit's own lesson01/lesson02 -- here Ana and Mihai use them together."

  ro.a1.unit14.lesson03.teach.reminder_cafeaua_ceaiul_painea:
    title: "Reminder: cafeaua, ceaiul, pâinea"
    gloss: "cafeaua (the coffee) · ceaiul (the tea) · pâinea (the bread)"
    note: "All from unit13 -- the three things Ana and Mihai compare."

  ro.a1.unit14.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: "Reminder: bună, mulțumesc, la revedere, Ana, Mihai"
    gloss: "bună (hi) · mulțumesc (thank you) · la revedere (goodbye) · Ana, Mihai (names)"
    note: >-
      All already established in earlier units -- the same friendly
      opening and closing pattern every dialogue in this course has
      used.

  ro.a1.unit14.lesson03.teach.line01:
    title: "Greet and ask about size"
    gloss: "Mihai greets Ana and asks if the coffee is big or small."
    note: "Uses this unit's own *mare sau mică* (big or small) to open a size question, the same 'X sau Y?' offer-a-choice shape unit13's *cafea sau ceai?* already established."

  ro.a1.unit14.lesson03.teach.line02:
    title: "Describe both drinks' sizes"
    gloss: "Ana says the coffee is big and the tea is small."
    note: "States a plain fact about size, not a preference -- this dialogue never says who likes or orders which drink, only how big each one is."

  ro.a1.unit14.lesson03.teach.line03:
    title: "Ask to confirm the comparison"
    gloss: "Mihai asks if the coffee is bigger than the tea."
    note: "Turns Ana's two separate facts (line02) into a direct comparison using *mai mare decât*, this unit's own core construction."

  ro.a1.unit14.lesson03.teach.line04:
    title: "Confirm and add the bread"
    gloss: "Ana confirms, then says the bread is smaller than the coffee."
    note: "Reuses *mai ... decât* with the third item, *pâinea*, this time with the small-comparative form *mai mică*."

  ro.a1.unit14.lesson03.teach.line05:
    title: "Confirm, thank, and say goodbye"
    gloss: "Mihai confirms the bread is small, thanks Ana, and says goodbye."
    note: "The same closing pattern every earlier unit's dialogue has ended on."

  ro.a1.unit14.lesson03.teach.line06:
    title: "Close the conversation"
    gloss: "Ana says goodbye back, using Mihai's name."
    note: "The same friendly closing pattern every earlier unit's dialogue has ended on."

exercises:
  ro.a1.unit14.lesson01.exercise01.choose_mic:
    instruction: "Which word means 'small' (used with masculine or neuter words, like ceai)?"
    correct_option: "Mic"
    distractors: ["Mare", "Mică"]
    accepted_answers: ["Mic"]

  ro.a1.unit14.lesson01.exercise02.choose_mica:
    instruction: "Which word means 'small' (used with feminine words, like cafea)?"
    correct_option: "Mică"
    distractors: ["Mare", "Mic"]
    accepted_answers: ["Mică"]

  ro.a1.unit14.lesson01.exercise03.listen_cafeaua_e_mica:
    instruction: "Listen and select what you hear."
    correct_option: "Cafeaua e mică"
    distractors: ["Ceaiul e mic.", "Pâinea e mare."]
    accepted_answers: ["Cafeaua e mică"]

  ro.a1.unit14.lesson01.exercise04.match_sizes1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Mare": "big"
      "Mic": "small (masc./neut.)"
      "Mică": "small (fem.)"
      "Cafeaua": "the coffee"
      "Ceaiul": "the tea"
      "Pâinea": "the bread"
      "Cafea": "coffee"
      "Ceai": "tea"

  ro.a1.unit14.lesson01.exercise05.order_ceaiul_e_mic:
    instruction: "Build the sentence: The tea is small."
    correct_response: ["Ceaiul", "e", "mic"]

  ro.a1.unit14.lesson01.exercise06.listen_order_ceaiul_e_mic:
    instruction: "Listen, then put the words in order."
    correct_response: ["Ceaiul", "e", "mic"]

  ro.a1.unit14.lesson01.exercise07.complete_painea_e_mica:
    instruction: "Complete the sentence: The bread is small."
    accepted_answers: ["mică", "Mică"]
    feedback: "Pâinea e *mică* -- pâinea is feminine, so it takes the feminine small-form, not *mic*."

  ro.a1.unit14.lesson01.exercise08.speak_ceaiul_e_mic:
    instruction: "Say aloud: The tea is small."
    accepted_answers:
      - "Ceaiul e mic."
      - "Ceaiul e mic"

  ro.a1.unit14.lesson02.exercise01.choose_mai:
    instruction: "Which word means 'more' / '-er' (used to make a comparison)?"
    correct_option: "Mai"
    distractors: ["Decât", "Mare"]
    accepted_answers: ["Mai"]

  ro.a1.unit14.lesson02.exercise02.choose_decat:
    instruction: "Which word means 'than'?"
    correct_option: "Decât"
    distractors: ["Mai", "Sau"]
    accepted_answers: ["Decât"]

  ro.a1.unit14.lesson02.exercise03.listen_cafeaua_mai_mare_decat_ceaiul:
    instruction: "Listen and select what you hear."
    correct_option: "Cafeaua e mai mare decât ceaiul"
    distractors: ["Pâinea e mai mică decât cafeaua.", "Ceaiul e mic."]
    accepted_answers: ["Cafeaua e mai mare decât ceaiul"]

  ro.a1.unit14.lesson02.exercise04.match_sizes2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Mai": "more / -er"
      "Decât": "than"
      "Mare": "big"
      "Mic": "small (masc./neut.)"
      "Mică": "small (fem.)"
      "Cafeaua": "the coffee"
      "Ceaiul": "the tea"
      "Pâinea": "the bread"

  ro.a1.unit14.lesson02.exercise05.order_cafeaua_mai_mare:
    instruction: "Build the sentence: The coffee is bigger."
    correct_response: ["Cafeaua", "e", "mai", "mare"]

  ro.a1.unit14.lesson02.exercise06.listen_order_painea_mai_mica:
    instruction: "Listen, then put the words in order."
    correct_response: ["Pâinea", "e", "mai", "mică", "decât", "cafeaua"]

  ro.a1.unit14.lesson02.exercise07.complete_cafeaua_mai_mare:
    instruction: "Complete the sentence: The coffee is bigger than the tea."
    accepted_answers: ["mai", "Mai"]
    feedback: "Cafeaua e *mai* mare decât ceaiul -- this lesson's own comparative particle, not the month 'mai' (May) or the 'Ce mai faceți?' greeting."

  ro.a1.unit14.lesson02.exercise08.speak_painea_mai_mica:
    instruction: "Say aloud: The bread is smaller than the coffee."
    accepted_answers:
      - "Pâinea e mai mică decât cafeaua."
      - "Pâinea e mai mică decât cafeaua"

  ro.a1.unit14.lesson03.exercise01.choose_who_says_si_painea:
    instruction: "Who says this line?"
    correct_option: "Ana"
    distractors: ["Mihai"]
    accepted_answers: ["Ana"]

  ro.a1.unit14.lesson03.exercise02.dialogue_comprehend_painea:
    instruction: "Listen to the dialogue. Is the bread bigger or smaller than the coffee?"
    correct_option: "Mai mică."
    distractors: ["Mai mare.", "Mare."]
    accepted_answers: ["Mai mică."]

  ro.a1.unit14.lesson03.exercise03.reading_comprehend_bigger:
    instruction: "Read the text. What is bigger, the coffee or the tea?"
    correct_option: "Cafeaua."
    distractors:
      - "Ceaiul."
      - "Pâinea."
    accepted_answers:
      - "Cafeaua."
      - "Cafeaua"

  ro.a1.unit14.lesson03.exercise04.match_unit_review:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Mai": "more / -er"
      "Decât": "than"
      "Mare": "big"
      "Mic": "small (masc./neut.)"
      "Mică": "small (fem.)"
      "Cafeaua": "the coffee"
      "Ceaiul": "the tea"
      "Pâinea": "the bread"

  ro.a1.unit14.lesson03.exercise05.order_cafeaua_mai_mare_decat_ceaiul:
    instruction: "Build the sentence: The coffee is bigger than the tea."
    correct_response: ["Cafeaua", "e", "mai", "mare", "decât", "ceaiul"]

  ro.a1.unit14.lesson03.exercise06.complete_painea_mai_mica:
    instruction: "Complete the sentence: The bread is smaller than the coffee."
    accepted_answers: ["mică", "Mică"]
    feedback: "Pâinea e mai *mică* decât cafeaua -- the feminine small-form, matching pâinea and cafeaua both being feminine."

  ro.a1.unit14.lesson03.exercise07.respond_as_ana:
    instruction: "Take Ana's role. Mihai asks 'Cafeaua e mare sau mică?' -- tell him the coffee is big and the tea is small."
    accepted_answers:
      - "Cafeaua e mare! Ceaiul e mic."
      - "Cafeaua e mare. Ceaiul e mic."
      - "Cafeaua e mare, ceaiul e mic."
      - "Cafeaua e mare și ceaiul e mic."
      - "Cafeaua este mare. Ceaiul este mic."
      - "Cafeaua este mare și ceaiul este mic."

  ro.a1.unit14.lesson03.exercise08.speak_cafeaua_mai_mare:
    instruction: "Say aloud: The coffee is bigger than the tea."
    accepted_answers:
      - "Cafeaua e mai mare decât ceaiul."
      - "Cafeaua e mai mare decât ceaiul"

  ro.a1.unit14.lesson03.exercise09.write_comparison:
    instruction: "Write one sentence comparing coffee and tea: say that the coffee is bigger than the tea, or that the tea is smaller than the coffee."
    accepted_answers:
      - "Ceaiul e mai mic decât cafeaua."
      - "Cafeaua este mai mare decât ceaiul."
      - "Ceaiul este mai mic decât cafeaua."
      - "Cafeaua e mai mare decât ceaiul."
      - "Pâinea e mai mică decât cafeaua."
      - "Cafeaua e mare. Ceaiul e mic."
      - "Cafeaua e mai mare decât ceaiul. Pâinea e mai mică decât cafeaua."

  ro.a1.unit14.lesson01.exercise09.dictation_ceaiul_e_mic:
    instruction: "Type what you hear."
    correct_option: "Ceaiul e mic"
    accepted_answers: [{value: "Ceaiul e mic", status: correct}]
    orthography_strict: true
