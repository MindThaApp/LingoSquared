answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with
    comma-below ș/ț. Free-typed answers are graded against these
    standard spellings: the grader does not fold away omitted
    diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should
    type the full standard spelling.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    Fully formal dumneavoastră register throughout, continuing units
    21/23/24/25's identical convention for a first professional
    meeting.

course:
  title: "Romanian A2"
  description: >-
    Attending a job interview in Romanian -- Experiență (experience),
    Am lucrat (I have worked), Disponibilă (available), and Întrebare
    (question) -- as Diana interviews with Mihai for a technician
    position.

units:
  ro.a2.unit26.interviul:
    title: "The job interview"

lessons:
  ro.a2.unit26.lesson01.aveti_experienta:
    title: "Do you have experience?"
  ro.a2.unit26.lesson02.sunt_disponibila:
    title: "I am available from Monday"
  ro.a2.unit26.lesson03.anuntul_de_angajare:
    title: "The job posting"
  ro.a2.unit26.lesson04.la_interviu:
    title: "At the interview"

teaching:
  ro.a2.unit26.lesson01.teach.reminder_buna_multumesc_la_revedere_mihai_inginer_birou:
    title: "Reminder: Bună ziua, Mulțumesc, La revedere, Mihai, Inginer, Birou"
    gloss: "Bună ziua (good day, formal) · Mulțumesc (thank you) · La revedere (goodbye) · Mihai · Inginer (engineer) · Birou (office) · Diana"
    note: "Words you already know -- Mihai is an engineer who works at an office, where this interview takes place."

  ro.a2.unit26.lesson01.teach.experienta_vocab:
    title: "Experience"
    gloss: "Aveți experiență în acest domeniu? (Do you have experience in this field?)"
    note: "*Domeniu* (field) is a new noun -- *în acest domeniu* means 'in this field/area.'"
    example_gloss:
      - "Do you have experience in this field?"

  ro.a2.unit26.lesson01.teach.am_lucrat_grammar:
    title: "Am lucrat (I have worked)"
    gloss: "Am lucrat (I have worked) -- perfect tense of *a lucra*, 'to work'"
    note: "The perfect compus (the everyday past tense), formed with *am* (auxiliary 'have') + the past participle *lucrat* -- the same pattern as *am fost* and *am mâncat*, now used to describe past work experience."

  ro.a2.unit26.lesson01.teach.tehniciana_vocab:
    title: "Female technician"
    gloss: "Tehniciană (female technician) · Doi ani (two years) · Ca (as)"
    note: "*Ca* + a profession states a role, e.g. 'as a technician' -- *tehniciană* is the feminine form, since Diana is the candidate here."
    example_gloss:
      - "I have worked two years as a technician."

  ro.a2.unit26.lesson01.teach.am_lucrat_doi_ani_phrase:
    title: "I have worked two years as a technician."
    gloss: "Am lucrat doi ani ca tehniciană."
    note: "The core sentence for describing work experience: *am lucrat* + duration (*doi ani*) + *ca* + profession."

  ro.a2.unit26.lesson02.teach.disponibila_vocab:
    title: "Available"
    gloss: "Când sunteți disponibilă? (When are you available?) · Sunt (I am)"
    note: "*Disponibilă* is the feminine form of *disponibil* (available) -- agrees with the person being asked."
    example_gloss:
      - "When are you available?"

  ro.a2.unit26.lesson02.teach.de_luni_vocab:
    title: "From Monday"
    gloss: "De luni (from/starting Monday)"
    note: "*De* + a weekday states a starting point -- here it marks when something begins (from Monday), not how long it lasts."
    example_gloss:
      - "I am available from Monday."

  ro.a2.unit26.lesson02.teach.sunt_disponibila_de_luni_phrase:
    title: "I am available from Monday."
    gloss: "Sunt disponibilă de luni."
    note: "The candidate's standard answer to an availability question."

  ro.a2.unit26.lesson02.teach.intrebare_vocab:
    title: "Question"
    gloss: "Aș avea o întrebare despre program. (I would have a question about the schedule.)"
    note: "*Aș avea* (I would have) is a polite conditional form, like *aș dori* (I would like) -- *program* here means 'schedule,' not 'computer program.'"
    example_gloss:
      - "I would have a question about the schedule."

  ro.a2.unit26.lesson03.teach.cautam_vocab:
    title: "We are looking for"
    gloss: "Căutăm un tehnician cu experiență. (We are looking for a technician with experience.)"
    note: "*Căutăm* (we are looking for, from *a căuta*) is standard job-posting language -- *cu experiență* (with experience) modifies the noun it follows."
    example_gloss:
      - "We are looking for a technician with experience."

  ro.a2.unit26.lesson03.teach.program_complet_vocab:
    title: "Full schedule"
    gloss: "Program complet, opt ore pe zi. (Full schedule, eight hours a day.)"
    note: "*Pe zi* (per day) is the same rate expression as *de două ori pe zi* (twice a day) -- *program complet* means a full-time schedule, as opposed to a part-time one."
    example_gloss:
      - "Full schedule, eight hours a day."

  ro.a2.unit26.lesson03.teach.anunt_reading:
    title: "A job posting"
    gloss: "We are looking for a technician with experience, available Monday to Friday. Full schedule, eight hours a day."
    note: "A short job posting combining this unit's requirement and schedule vocabulary."
    glosses:
      Căutăm: "we are looking for (from a căuta)"
      tehnician: "technician"
      experiență: "experience"
      disponibil: "available"
      luni: "Monday"
      vineri: "Friday"
      Program: "schedule"
      complet: "full"
      opt: "eight"
      ore: "hours"
      zi: "day"

  ro.a2.unit26.lesson04.teach.reminder_foarte_bine_va_contacta:
    title: "Foarte bine, Perfect, Vă vom contacta"
    gloss: "Foarte bine (very good) · Perfect (perfect/great) · Vă vom contacta în curând (we will contact you soon)"
    note: "Useful closing phrases -- *vă vom contacta* (we will contact you) uses the future *vom* + infinitive with the formal *vă*; it is the standard way an interviewer signs off."

  ro.a2.unit26.lesson04.teach.line01:
    title: "Greet Diana and ask about experience"
    gloss: "Mihai greets Diana and asks if she has experience in this field."
    note: "*Aveți* (you have) is the formal form Mihai uses with a candidate."

  ro.a2.unit26.lesson04.teach.line02:
    title: "Confirm the experience"
    gloss: "Diana greets him back and confirms she has worked two years as a technician."
    note: "*Da* (yes), then *am lucrat* -- the past tense for completed work experience."

  ro.a2.unit26.lesson04.teach.line03:
    title: "Acknowledge and ask about availability"
    gloss: "Mihai says that's very good, and asks when she's available."
    note: "*Foarte bine* = very good; *Când sunteți disponibilă?* = When are you available?"

  ro.a2.unit26.lesson04.teach.line04:
    title: "State availability"
    gloss: "Diana says she's available from Monday."
    note: "*De luni* marks the starting day: from Monday."

  ro.a2.unit26.lesson04.teach.line05:
    title: "Ask if she has questions"
    gloss: "Mihai says perfect, and asks if she has any questions for him."
    note: "*Aveți întrebări pentru mine?* (Do you have any questions for me?) is a standard interview-closing question."

  ro.a2.unit26.lesson04.teach.line06:
    title: "Ask about the schedule"
    gloss: "Diana says yes, she would have a question about the schedule."
    note: "*Aș avea* (I would have) is a polite way to raise a question."

  ro.a2.unit26.lesson04.teach.line07:
    title: "Answer about the schedule"
    gloss: "Mihai answers: the schedule is eight hours a day, Monday to Friday."
    note: "*Programul* (the schedule): eight hours a day, Monday to Friday."

  ro.a2.unit26.lesson04.teach.line08:
    title: "Thank Mihai for the information"
    gloss: "Diana thanks him for the information."
    note: "*Informații* = information; *mulțumesc pentru...* = thank you for..."

  ro.a2.unit26.lesson04.teach.line09:
    title: "Close the interview"
    gloss: "Mihai says you're welcome, and that they will contact her soon."
    note: "*Vă vom contacta în curând* (we will contact you soon) -- the standard way a Romanian interview ends."

exercises:
  ro.a2.unit26.lesson01.exercise01.choose_experienta:
    instruction: "Which word means 'experience'?"
    correct_option: "Experiență"
    distractors: ["Domeniu", "Birou"]
    accepted_answers: ["Experiență"]

  ro.a2.unit26.lesson01.exercise02.choose_tehniciana:
    instruction: "Which word means 'technician (female)'?"
    correct_option: "Tehniciană"
    distractors: ["Inginer", "Doctoriță"]
    accepted_answers: ["Tehniciană"]

  ro.a2.unit26.lesson01.exercise03.listen_aveti_experienta:
    instruction: "Listen and select what you hear."
    correct_option: "Aveți experiență în acest domeniu"
    distractors: ["Când poate veni un meșter", "Am lucrat doi ani ca tehniciană"]
    accepted_answers: ["Aveți experiență în acest domeniu"]

  ro.a2.unit26.lesson01.exercise04.match_interviu1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Experiență": "experience"
      "Domeniu": "field"
      "Am lucrat": "I have worked"
      "Doi ani": "two years"
      "Tehniciană": "technician (female)"
      "Am lucrat doi ani ca tehniciană.": "I have worked two years as a technician."
      "Bună ziua.": "Good day."
      "Mulțumesc.": "Thank you."

  ro.a2.unit26.lesson01.exercise05.order_am_lucrat_doi_ani:
    instruction: "Build the sentence: I have worked two years as a technician."
    correct_response: ["Am", "lucrat", "doi", "ani", "ca", "tehniciană"]

  ro.a2.unit26.lesson01.exercise06.listen_order_aveti_experienta:
    instruction: "Listen, then put the words in order."
    correct_response: ["Aveți", "experiență", "în", "acest", "domeniu"]

  ro.a2.unit26.lesson01.exercise07.complete_am_lucrat_doi_ani:
    instruction: "Complete the sentence, two years: Am lucrat ___ ani ca tehniciană."
    accepted_answers: ["doi", "Doi"]
    feedback: "Am lucrat *doi* ani -- 'two' years of experience."

  ro.a2.unit26.lesson01.exercise08.speak_am_lucrat_doi_ani:
    instruction: "Say aloud: I have worked two years as a technician."
    accepted_answers:
      - "Am lucrat doi ani ca tehniciană."
      - "Am lucrat doi ani ca tehniciană"

  ro.a2.unit26.lesson02.exercise01.choose_disponibila:
    instruction: "Which word means 'available'?"
    correct_option: "Disponibilă"
    distractors: ["Confirmată", "Necesară"]
    accepted_answers: ["Disponibilă"]

  ro.a2.unit26.lesson02.exercise02.choose_intrebare:
    instruction: "Which word means 'question'?"
    correct_option: "Întrebare"
    distractors: ["Experiență", "Program"]
    accepted_answers: ["Întrebare"]

  ro.a2.unit26.lesson02.exercise03.listen_sunt_disponibila:
    instruction: "Listen and select what you hear."
    correct_option: "Sunt disponibilă de luni"
    distractors: ["Am lucrat doi ani ca tehniciană", "Aș avea o întrebare despre program"]
    accepted_answers: ["Sunt disponibilă de luni"]

  ro.a2.unit26.lesson02.exercise04.match_interviu2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Disponibilă": "available"
      "De luni": "from Monday"
      "Întrebare": "question"
      "Program": "schedule"
      "Sunt disponibilă de luni.": "I am available from Monday."
      "Experiență": "experience"

  ro.a2.unit26.lesson02.exercise05.order_sunt_disponibila_de_luni:
    instruction: "Build the sentence: I am available from Monday."
    correct_response: ["Sunt", "disponibilă", "de", "luni"]

  ro.a2.unit26.lesson02.exercise06.listen_order_as_avea_o_intrebare:
    instruction: "Listen, then put the words in order."
    correct_response: ["Aș", "avea", "o", "întrebare", "despre", "program"]

  ro.a2.unit26.lesson02.exercise07.complete_sunt_disponibila_de_luni:
    instruction: "Complete the sentence, from Monday: Sunt disponibilă de ___."
    accepted_answers: ["luni", "Luni"]
    feedback: "Disponibilă de *luni* -- 'from Monday,' when Diana can start."

  ro.a2.unit26.lesson02.exercise08.translate_have_a_question:
    instruction: "Translate into Romanian."
    accepted_answers:
      - "Aș avea o întrebare despre program."
      - "As avea o intrebare despre program."

  ro.a2.unit26.lesson03.exercise01.read_position_requirements:
    instruction: "Read the posting. What is it looking for?"
    correct_option: "Un tehnician cu experiență, disponibil de luni până vineri."
    distractors:
      - "Un profesor fără experiență."
    accepted_answers:
      - "Un tehnician cu experiență, disponibil de luni până vineri."

  ro.a2.unit26.lesson03.exercise02.read_schedule:
    instruction: "Read the posting. What is the work schedule?"
    correct_option: "Program complet, opt ore pe zi."
    distractors:
      - "Patru ore pe zi, doar sâmbătă."
    accepted_answers:
      - "Program complet, opt ore pe zi."

  ro.a2.unit26.lesson03.exercise03.listen_anunt:
    instruction: "Listen and select what you hear."
    correct_option: "Căutăm un tehnician cu experiență"
    distractors: ["Sunt disponibilă de luni", "Am lucrat doi ani ca tehniciană"]
    accepted_answers: ["Căutăm un tehnician cu experiență"]

  ro.a2.unit26.lesson03.exercise04.match_anunt:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Căutăm": "we are looking for"
      "Tehnician cu experiență": "technician with experience"
      "Program complet": "full schedule"
      "Opt ore pe zi": "eight hours a day"
      "Disponibil de luni până vineri": "available Monday to Friday"

  ro.a2.unit26.lesson03.exercise05.complete_opt_ore:
    instruction: "Complete the posting, eight hours a day: Program complet, ___ ore pe zi."
    accepted_answers: ["opt", "Opt"]
    feedback: "*Opt* ore pe zi -- 'eight' hours a day, a full-time schedule."

  ro.a2.unit26.lesson03.exercise06.write_availability_note:
    instruction: "Write as Diana, in two sentences: say you have worked two years as a technician and that you are available from Monday."
    accepted_answers:
      - "Am lucrat doi ani ca tehniciană. Sunt disponibilă de luni."
      - "Am lucrat doi ani ca tehniciană, sunt disponibilă de luni."
      - "Am lucrat doi ani ca tehniciană și sunt disponibilă de luni."

  ro.a2.unit26.lesson04.exercise01.choose_who_states_availability:
    instruction: "Who says this line?"
    correct_option: "Diana"
    distractors: ["Mihai"]
    accepted_answers: ["Diana"]

  ro.a2.unit26.lesson04.exercise02.dialogue_comprehend_experience:
    instruction: "Listen to the dialogue. What experience does Diana describe?"
    correct_option: "Doi ani ca tehniciană."
    distractors: ["Cinci ani ca profesoară."]
    accepted_answers: ["Doi ani ca tehniciană."]

  ro.a2.unit26.lesson04.exercise03.dialogue_comprehend_schedule_question:
    instruction: "Listen to the dialogue. What does Diana ask Mihai about?"
    correct_option: "Despre program."
    distractors: ["Despre birou."]
    accepted_answers: ["Despre program."]

  ro.a2.unit26.lesson04.exercise04.dialogue_comprehend_answer:
    instruction: "Listen to the dialogue. What does Mihai answer about the schedule?"
    correct_option: "Opt ore pe zi, de luni până vineri."
    distractors: ["Patru ore pe zi, doar sâmbăta."]
    accepted_answers: ["Opt ore pe zi, de luni până vineri."]

  ro.a2.unit26.lesson04.exercise05.order_aveti_intrebari_pentru_mine:
    instruction: "Build the question: Do you have questions for me?"
    correct_response: ["Aveți", "întrebări", "pentru", "mine"]

  ro.a2.unit26.lesson04.exercise06.respond_as_diana:
    instruction: "Take Diana's role. Mihai asks if you have questions for him -- say yes, and ask about the schedule."
    accepted_answers:
      - "Da, aș avea o întrebare despre program."
      - "Da, as avea o intrebare despre program."

  ro.a2.unit26.lesson04.exercise07.write_interview_summary:
    instruction: "Write one sentence in Romanian saying that Diana is available from Monday."
    accepted_answers:
      - "Diana este disponibilă de luni."

  ro.a2.unit26.lesson02.exercise09.dictation_sunt_disponibila_de_luni:
    instruction: "Type what you hear."
    correct_option: "Sunt disponibilă de luni"
    accepted_answers: [{value: "Sunt disponibilă de luni", status: correct}]
    orthography_strict: true
