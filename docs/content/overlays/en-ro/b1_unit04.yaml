course:
  title: Romanian B1
  description: >-
    Intermediate Romanian: agreeing or disagreeing with a stated opinion
    and supporting your own position with a reason, referencing the
    other person's view with a subordinate clause.

units:
  ro.b1.unit04.debate:
    title: "Debate: Agreement and Disagreement"
    description: State agreement or disagreement with someone else's opinion and support your own position with a reason, referencing their view with a that-clause.

