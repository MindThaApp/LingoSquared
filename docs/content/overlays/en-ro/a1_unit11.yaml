schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit11_plans.yaml for full detail.
    This unit's source PDF (US Peace Corps Moldova's "Basic Romanian
    Language Lessons") was checked specifically for plan-making/
    invitation material and found to have no dedicated lesson on the
    topic at all -- only a bare English-Romanian cognate list (Lesson
    19) confirming cinema/parc/restaurant/film/mesaj as real words,
    with no dialogue or sentence context. This unit's core
    plan-negotiation vocabulary (mergem, atunci, sigur) and the nu pot
    decline pattern are therefore freshly authored per AUTHORING_GUIDE
    #10, independently verified via WebSearch against general Romanian
    usage/dictionary sources rather than copied from the PD source.
    Glosses/notes here are freshly authored to explain the target-
    language forms to an English speaker.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    realization file's own review pass. Checked clean: correct_response/
    accepted_answers shapes match the realization's word_bank/pairs, no
    same-speaker distractor collisions, no stray YAML booleans, no
    jargon leaks, English glosses/notes are accurate translations of
    the Romanian forms as authored. Eleventh Romanian overlay, first
    draft, authored alongside the paired realization.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț). For
    free-typed A1 answers, accept otherwise-correct forms with the
    diacritics omitted or with the legacy cedilla variants ş/ţ
    substituted for ș/ț, matching units 01-10's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    This unit's new words are all register-neutral -- mergem
    (first-person plural) and nu pot (first-person singular) don't
    change with tu/dumneavoastră, and atunci/sigur are invariant
    connective/response words with no person marking. No new
    second-person forms are introduced. Ana and Mihai's closing
    dialogue keeps their existing polite register with each other,
    matching unit06/unit07/unit08/unit09/unit10.

course:
  title: "Romanian A1"
  description: >-
    Proposing, accepting, declining, and scheduling a simple plan in
    Romanian -- mergem (let's go / we go), nu pot (I can't), atunci
    (then / in that case), and sigur (sure) -- continuing Ana and
    Mihai as they arrange to meet at the park.

units:
  ro.a1.unit11.plans:
    title: "Plans"

lessons:
  ro.a1.unit11.lesson01.mergem_la_cinema:
    title: "Shall we go to the cinema?"
  ro.a1.unit11.lesson02.nu_pot_atunci:
    title: "I can't. Then?"
  ro.a1.unit11.lesson03.planul_de_duminica:
    title: "The Sunday plan"

teaching:
  ro.a1.unit11.lesson01.teach.reminder_da_bine:
    title: "Reminder: da, bine, nu, mulțumesc"
    gloss: "da (yes) · bine (good / fine) · nu (no) · mulțumesc (thank you)"
    note: >-
      All already established since unit06 -- here they combine into
      this unit's own way of accepting a plan and this lesson's
      vocabulary-review matching exercise.

  ro.a1.unit11.lesson01.teach.mergem_vocab:
    title: "Let's go / we go"
    gloss: "Mergem (let's go / we go)"
    note: "The first-person plural of *a merge*, already seen as *merg* (I go, unit10) and *mergeți* (the formal command, unit09) -- same verb, a third person/number. Used on its own with rising intonation, it's a natural way to propose doing something together."
    example_gloss:
      - "Shall we go to the cinema?"

  ro.a1.unit11.lesson01.teach.cinema_vocab:
    title: "The cinema"
    gloss: "Cinema (the cinema)"
    note: "A direct cognate of English 'cinema' -- easy to recognize."
    example_gloss:
      - "Shall we go to the cinema?"

  ro.a1.unit11.lesson01.teach.mergem_cinema_phrase:
    title: "Shall we go to the cinema?"
    gloss: "Mergem la cinema? (Shall we go to the cinema?)"
    note: "A complete invitation -- no extra 'do you want to' needed, the question mark alone turns 'we go' into a proposal."

  ro.a1.unit11.lesson01.teach.parc_vocab:
    title: "The park"
    gloss: "Parc (the park)"
    note: "Another direct cognate, like *cinema*."
    example_gloss:
      - "Shall we go to the park?"

  ro.a1.unit11.lesson01.teach.mergem_parc_phrase:
    title: "Shall we go to the park?"
    gloss: "Mergem la parc? (Shall we go to the park?)"
    note: "The same invitation pattern as *Mergem la cinema?*, with a different place."

  ro.a1.unit11.lesson01.teach.da_bine_phrase:
    title: "Yes, good!"
    gloss: "Da, bine! (Yes, good!)"
    note: "A short, natural way to accept a plan -- already-known words used in a new combination."

  ro.a1.unit11.lesson02.teach.reminder_nu_pot:
    title: "Reminder: nu, pot"
    gloss: "nu (no) · pot (I can)"
    note: >-
      Nu already established since unit06; pot already established in
      unit09's *cum pot să ajung* (how can I get to). Here they combine
      into this unit's own way of declining a plan.

  ro.a1.unit11.lesson02.teach.reminder_sambata_duminica:
    title: "Reminder: sâmbătă, duminică"
    gloss: "sâmbătă (Saturday) · duminică (Sunday)"
    note: "Both already established in unit03's days of the week."

  ro.a1.unit11.lesson02.teach.mergem_parc_sambata_phrase:
    title: "Shall we go to the park Saturday?"
    gloss: "Mergem la parc sâmbătă? (Shall we go to the park Saturday?)"
    note: "This lesson's own invitation, now with a day attached -- combines unit01's *Mergem la parc?* with a day name."

  ro.a1.unit11.lesson02.teach.nu_pot_sambata_phrase:
    title: "I can't Saturday"
    gloss: "Nu pot sâmbătă. (I can't Saturday.)"
    note: "A plain decline -- *nu pot* plus the day being declined."

  ro.a1.unit11.lesson02.teach.atunci_vocab:
    title: "Then / in that case"
    gloss: "Atunci (then / in that case)"
    note: "Different from *apoi* (unit09's 'then,' used to sequence two actions) -- *atunci* proposes an alternative or draws a consequence, the natural word for 'in that case, how about...?' when rescheduling."
    example_gloss:
      - "Then, Sunday?"

  ro.a1.unit11.lesson02.teach.atunci_duminica_phrase:
    title: "Then, Sunday?"
    gloss: "Atunci, duminică? (Then, Sunday?)"
    note: "A short counter-proposal after a decline -- naming a new day is enough, no need to repeat the whole invitation."

  ro.a1.unit11.lesson02.teach.da_bine_duminica_phrase:
    title: "Yes, good! Sunday."
    gloss: "Da, bine! Duminică. (Yes, good! Sunday.)"
    note: "Accepting the rescheduled day, the same short pattern as unit01's *Da, bine!*."

  ro.a1.unit11.lesson03.teach.reminder_la_ce_ora_la_ora_patru:
    title: "Reminder: la ce oră, la ora, patru"
    gloss: "la ce oră (at what time) · la ora (at ... o'clock) · patru (four)"
    note: >-
      La ce oră/la ora already established in unit04 (asking and
      telling time); patru already established in unit02's numbers --
      here they combine into fixing this unit's own meeting time.

  ro.a1.unit11.lesson03.teach.reminder_buna_multumesc_la_revedere_da_ana_mihai:
    title: "Reminder: bună, mulțumesc, la revedere, da, Ana, Mihai"
    gloss: "bună (hi) · mulțumesc (thank you) · la revedere (goodbye) · da (yes) · Ana, Mihai (names)"
    note: >-
      All already established in earlier units -- here Ana and Mihai
      settle on a time for their plan.

  ro.a1.unit11.lesson03.teach.sigur_vocab:
    title: "Sure"
    gloss: "Sigur (sure)"
    note: "A common, standalone way to confirm a plan -- similar to English 'Sure!' or 'Of course!'."
    example_gloss:
      - "Sure! At four o'clock."

  ro.a1.unit11.lesson03.teach.sigur_phrase:
    title: "Sure! At four o'clock."
    gloss: "Sigur! La ora patru. (Sure! At four o'clock.)"
    note: "Confirms both the plan and the exact time in one short response."

  ro.a1.unit11.lesson03.teach.line01:
    title: "Greet and propose the park"
    gloss: "Ana greets Mihai and asks if they should go to the park Sunday."
    note: "Combines this unit's own *Mergem la parc?* invitation with *duminică*."

  ro.a1.unit11.lesson03.teach.line02:
    title: "Accept and ask the time"
    gloss: "Mihai accepts and asks what time."
    note: "Reuses unit04's own *La ce oră?* question."

  ro.a1.unit11.lesson03.teach.line03:
    title: "Propose a time"
    gloss: "Ana proposes four o'clock."
    note: "A short question, reusing unit04's *la ora* pattern with this unit's own *patru*."

  ro.a1.unit11.lesson03.teach.line04:
    title: "Confirm and thank"
    gloss: "Mihai confirms with 'Sure!' and thanks Ana."
    note: "Combines this unit's own *sigur* with the already-known *mulțumesc*."

  ro.a1.unit11.lesson03.teach.line05:
    title: "Say goodbye"
    gloss: "Ana says goodbye."
    note: "The same closing pattern every earlier unit's dialogue has ended on."

  ro.a1.unit11.lesson03.teach.line06:
    title: "Close the encounter"
    gloss: "Mihai says goodbye back, using Ana's name."
    note: "The same friendly closing pattern every earlier unit's dialogue has ended on."

exercises:
  ro.a1.unit11.lesson01.exercise01.choose_mergem:
    instruction: "Which word means 'let's go / we go'?"
    correct_option: "Mergem"
    distractors: ["Beau", "Mănânc"]
    accepted_answers: ["Mergem"]

  ro.a1.unit11.lesson01.exercise02.choose_cinema:
    instruction: "Which word means 'the cinema'?"
    correct_option: "Cinema"
    distractors: ["Parc", "Acasă"]
    accepted_answers: ["Cinema"]

  ro.a1.unit11.lesson01.exercise03.listen_mergem_la_cinema:
    instruction: "Listen and select what you hear."
    correct_option: "Mergem la cinema"
    distractors: ["Mergem la parc?", "Nu pot sâmbătă."]
    accepted_answers: ["Mergem la cinema"]

  ro.a1.unit11.lesson01.exercise04.match_plans1:
    instruction: "Match each word to its English meaning."
    correct_response:
      "Mergem": "let's go / we go"
      "Cinema": "the cinema"
      "Parc": "the park"
      "Da": "yes"
      "Bine": "good / fine"
      "Nu": "no"
      "Mulțumesc": "thank you"

  ro.a1.unit11.lesson01.exercise05.order_mergem_la_cinema:
    instruction: "Build the sentence: Shall we go to the cinema?"
    correct_response: ["Mergem", "la", "cinema"]

  ro.a1.unit11.lesson01.exercise06.listen_order_mergem_la_parc:
    instruction: "Listen, then put the words in order."
    correct_response: ["Mergem", "la", "parc"]

  ro.a1.unit11.lesson01.exercise07.complete_mergem_cinema:
    instruction: "Complete the sentence: Shall we go to the cinema?"
    accepted_answers: ["Mergem", "mergem"]
    feedback: "*Mergem* la cinema? -- this lesson's own 'let's go' verb."

  ro.a1.unit11.lesson01.exercise08.speak_mergem_parc:
    instruction: "Say aloud: Shall we go to the park?"
    accepted_answers:
      - "Mergem la parc?"
      - "Mergem la parc"

  ro.a1.unit11.lesson02.exercise01.choose_atunci:
    instruction: "Which word means 'then / in that case'?"
    correct_option: "Atunci"
    distractors: ["Apoi", "Mâine"]
    accepted_answers: ["Atunci"]

  ro.a1.unit11.lesson02.exercise02.choose_nu_pot:
    instruction: "Which phrase means 'I can't'?"
    correct_option: "Nu pot"
    distractors: ["Nu mulțumesc", "Da, bine"]
    accepted_answers: ["Nu pot"]

  ro.a1.unit11.lesson02.exercise03.listen_nu_pot_sambata:
    instruction: "Listen and select what you hear."
    correct_option: "Nu pot sâmbătă"
    distractors: ["Mergem la cinema?", "Da, bine! Duminică."]
    accepted_answers: ["Nu pot sâmbătă"]

  ro.a1.unit11.lesson02.exercise04.match_plans2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Atunci": "then / in that case"
      "Nu pot": "I can't"
      "Sâmbătă": "Saturday"
      "Duminică": "Sunday"
      "Mergem": "let's go / we go"
      "Cinema": "the cinema"
      "Parc": "the park"
      "Da": "yes"
      "Bine": "good / fine"

  ro.a1.unit11.lesson02.exercise05.order_nu_pot_sambata:
    instruction: "Build the sentence: I can't Saturday."
    correct_response: ["Nu", "pot", "sâmbătă"]

  ro.a1.unit11.lesson02.exercise06.listen_order_mergem_parc_sambata:
    instruction: "Listen, then put the words in order."
    correct_response: ["Mergem", "la", "parc", "sâmbătă"]

  ro.a1.unit11.lesson02.exercise07.complete_nu_pot:
    instruction: "Complete the sentence: I can't Saturday."
    accepted_answers: ["pot", "Pot"]
    feedback: "Nu *pot* sâmbătă -- reusing unit09's 'I can,' now with *nu* to decline."

  ro.a1.unit11.lesson02.exercise08.speak_atunci_duminica:
    instruction: "Say aloud: Then, Sunday?"
    accepted_answers:
      - "Atunci, duminică?"
      - "Atunci duminică?"

  ro.a1.unit11.lesson03.exercise01.choose_who_says_sigur:
    instruction: "Who says this line?"
    correct_option: "Mihai"
    distractors: ["Ana"]
    accepted_answers: ["Mihai"]

  ro.a1.unit11.lesson03.exercise02.dialogue_comprehend_plan_duminica:
    instruction: "Listen to the dialogue. What time do Ana and Mihai meet?"
    correct_option: "La ora patru."
    distractors: ["La ora nouă.", "La ora trei."]
    accepted_answers: ["La ora patru."]

  ro.a1.unit11.lesson03.exercise03.reading_comprehend_plan:
    instruction: "Read the text. What day do Ana and Mihai go to the park?"
    correct_option: "Duminică."
    distractors:
      - "Sâmbătă."
      - "Vineri."
    accepted_answers:
      - "Duminică."
      - "Duminică"

  ro.a1.unit11.lesson03.exercise04.match_unit_review:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Mergem": "let's go / we go"
      "Cinema": "the cinema"
      "Parc": "the park"
      "Atunci": "then / in that case"
      "Sigur": "sure"
      "Nu pot": "I can't"
      "Duminică": "Sunday"
      "Sâmbătă": "Saturday"
      "La ce oră": "at what time"
      "La ora patru": "at four o'clock"

  ro.a1.unit11.lesson03.exercise05.order_mergem_parc_duminica:
    instruction: "Build the sentence: Shall we go to the park Sunday?"
    correct_response: ["Mergem", "la", "parc", "duminică"]

  ro.a1.unit11.lesson03.exercise06.complete_la_ora_patru:
    instruction: "Complete the sentence: At four o'clock?"
    accepted_answers: ["patru", "Patru"]
    feedback: "La ora *patru* -- recalling unit02's own number four."

  ro.a1.unit11.lesson03.exercise07.respond_as_ana:
    instruction: "Take Ana's role. Mihai asks 'La ce oră?' -- tell him four o'clock."
    accepted_answers:
      - "La ora patru?"
      - "La ora patru"

  ro.a1.unit11.lesson03.exercise08.speak_sigur_multumesc:
    instruction: "Say aloud: Sure! Thank you, Ana!"
    accepted_answers:
      - "Sigur! Mulțumesc, Ana!"
      - "Sigur! Mulțumesc, Ana"

  ro.a1.unit11.lesson03.exercise09.write_propose_park_sunday:
    instruction: "Write a short message: propose going to the park on Sunday."
    accepted_answers:
      - "Mergem la parc duminică?"
      - "Mergem la parc, duminică?"
      - "Mergem la parc duminică"
      - "Mergem la parc, duminică"

  ro.a1.unit11.lesson01.exercise09.dictation_mergem_la_parc:
    instruction: "Type what you hear."
    correct_option: "Mergem la parc"
    accepted_answers: [{value: "Mergem la parc", status: correct}]
    orthography_strict: true
