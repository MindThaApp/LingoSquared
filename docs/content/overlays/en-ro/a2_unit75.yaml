teaching:
  ro.a2.unit75.lesson01.teach.vacanta_vacanta_de:
    title: Holidays
    gloss: the holiday / the summer holiday
    note: '*Vacanța* is the general word for a holiday; *vacanța de vară* is the long summer break. The article is attached to the noun: *vacanță* becomes *vacanța*.'
    example_gloss:
    - In August I have a holiday.
    - The summer holiday starts in July.
  ro.a2.unit75.lesson01.teach.saptamana_viitoare_anul:
    title: When something happens
    gloss: next week / next year / soon
    note: 'The adjective comes after the noun: *săptămâna viitoare*, *anul viitor*. The article is a suffix: *săptămână* becomes *săptămâna*, *an* becomes *anul*.'
    example_gloss:
    - Next week I have an appointment.
    - Next year I want to go to Greece.
    - Soon I have a holiday.
  ro.a2.unit75.lesson01.teach.a_calatori_a:
    title: Three travel verbs
    gloss: to travel / to book / to stay
    note: 'These are infinitives, shown with *a*: *a călători*, *a rezerva*, *a rămâne*. After *să* or *o să* the *a* disappears and the verb is conjugated: *o să rezerv*.'
    example_gloss:
    - I like travelling by train.
    - I want to book a room.
    - I'm staying for a week.
  ro.a2.unit75.lesson01.teach.hotelul_campingul:
    title: Where to stay
    gloss: the hotel / the campsite
    note: 'Both nouns take the suffix article *-ul*: *hotelul*, *campingul*. You stay *la camping* but *într-un hotel*.'
    example_gloss:
    - The hotel is close to the beach.
    - We sleep on the campsite.
  ro.a2.unit75.lesson01.teach.ce_o_sa:
    title: Asking about holiday plans
    gloss: What are you going to do in the summer holiday?
    note: '*O să* + a conjugated verb talks about the near future: *Ce o să faci?* Here *faci* is the *tu* form of *a face*.'
  ro.a2.unit75.lesson01.teach.in_august_o:
    title: 'Near plans: o să + verb'
    gloss: In August I am going to travel to Germany. I am going to book a hotel.
    note: 'To say what you are going to do, use *o să* and then the verb in the person you need: *o să rezerv*, *o să stăm*, *o să faci*. Time words can come first or last: *Săptămâna viitoare o să rezerv un hotel*. For a fixed plan, the plain present also works: *În august merg în Germania*.'
  ro.a2.unit75.lesson01.teach.o_sa_rezerv:
    title: Booking a hotel
    gloss: I am going to book a hotel.
  ro.a2.unit75.lesson02.teach.a_urma_un:
    title: Three plans for later
    gloss: to take a course / to move house / to save money
    note: '*A urma un curs* is the fixed phrase for taking a course. *A se muta* (reflexive: *mă mut*) means moving to a new home.'
    example_gloss:
    - I want to take a course.
    - My uncle wants to move house.
    - I want to save for a new bike.
  ro.a2.unit75.lesson02.teach.mai_tarziu_peste:
    title: Further ahead
    gloss: later / in a month
    note: '*Peste o lună* means ''a month from now''. It works with other periods too: *peste o săptămână*.'
    example_gloss:
    - Later I want to buy a house.
    - In a month my course starts.
  ro.a2.unit75.lesson02.teach.peste_o_luna:
    title: A course that starts
    gloss: In a month my course starts.
  ro.a2.unit75.lesson02.teach.am_de_gand:
    title: 'Intentions: am de gând să ...'
    gloss: I plan to take a course.
    note: 'To say what you intend to do, use *am de gând să* and then the verb in the *să*-form: *am de gând să urmez un curs*. For a negative intention put *nu* before *am*. This is for things you want to do, not for fixed arrangements.'
  ro.a2.unit75.lesson02.teach.am_de_gand_2:
    title: Planning to move house
    gloss: I plan to move house.
  ro.a2.unit75.lesson02.teach.am_de_gand_3:
    title: Planning to save
    gloss: I plan to save money.
  ro.a2.unit75.lesson02.teach.maine_merg_la:
    title: Present or am de gând să?
    gloss: Tomorrow I am going to the market. Later I plan to move house.
    note: 'Use the present tense or *o să* for the near, settled future: *Mâine merg la piață*. Use *am de gând să* for an intention that is further away or less certain: *Mai târziu am de gând să mă mut*.'
  ro.a2.unit75.lesson03.teach.poate_sigur:
    title: Maybe and certainly
    gloss: maybe / certainly
    note: '*Poate* expresses doubt. *Sigur* means ''certainly'' or ''for sure''.'
    example_gloss:
    - Maybe it will rain tomorrow.
    - That is certainly fun.
  ro.a2.unit75.lesson03.teach.anul_acesta_vara:
    title: This year, this summer
    gloss: this year / this summer
    note: '*Anul acesta* and *vara aceasta* put the demonstrative after the noun, and the noun keeps its suffix article.'
    example_gloss:
    - This year I am not going on holiday.
    - This summer I am staying at home.
  ro.a2.unit75.lesson03.teach.vara_aceasta_raman:
    title: Staying at home
    gloss: This summer I am staying at home.
  ro.a2.unit75.lesson03.teach.maine_lucrez_poate:
    title: Poate and the verb
    gloss: Tomorrow I am going to work. Maybe I will go to the cinema later.
    note: 'After *poate* you can use an ordinary present-tense verb: *Poate merg mai târziu la cinema*. Romanian does not change the word order after a time word: *Mâine lucrez*.'
  ro.a2.unit75.lesson03.teach.nu_merg_in:
    title: Saying you are not going to
    gloss: I am not going on holiday. I do not plan to move house.
    note: 'Put *nu* directly before the verb: *Nu merg în vacanță*. With *am de gând*, *nu* goes before *am*: *Nu am de gând să mă mut*.'
  ro.a2.unit75.lesson04.teach.cu_cine_cat:
    title: Two question phrases
    gloss: with whom / how long
    note: '*Cu cine* asks about a person you do something with. *Cât timp* asks about a period of time.'
    example_gloss:
    - Who are you going to the beach with?
    - How long are you staying?
  ro.a2.unit75.lesson04.teach.incotro_mergi:
    title: Where are you going?
    gloss: Where are you going (to)?
    note: '*Încotro* asks about a direction (''where to'') and stands at the start of the question. *Unde* asks about a place.'
  ro.a2.unit75.lesson04.teach.cu_cine_mergi:
    title: Who with?
    gloss: Who are you going on holiday with?
  ro.a2.unit75.lesson04.teach.cat_timp_ramai:
    title: How long?
    gloss: How long are you staying there?
  ro.a2.unit75.lesson04.teach.merg_cu_sora:
    title: Answering
    gloss: I am going with my sister.
  ro.a2.unit75.lesson04.teach.o_saptamana_doua:
    title: Weeks
    gloss: one week / two weeks
    note: 'The plural of *săptămână* is *săptămâni*: *o săptămână*, *două săptămâni*. After *două* (feminine) the noun stays plural.'
    example_gloss:
    - I am staying for a week.
    - We are staying for two weeks.
  ro.a2.unit75.lesson04.teach.incotro_mergi_cu:
    title: Questions about plans
    gloss: Where are you going? Who are you going with? How long are you going to stay?
    note: 'Put the question word first and then the verb: *Încotro mergi?* *Cu cine mergi?* *Cât timp o să rămâi?* Romanian leaves out *tu*, because the verb ending shows who is meant.'
  ro.a2.unit75.lesson05.teach.salut_ana_in:
    title: A message from Maria
    gloss: Hi Ana! Soon I have a holiday. In August I am going to Greece with my sister. We are going to stay in a hotel for a week. After that I am going to my parents' for two days. Next year I plan to take a course. Maybe I will move house then too. What are you going to do?
    note: 'Maria describes near plans with the present tense or *o să*, and a longer-term intention with *am de gând să*. Notice that the verb after *să* is always conjugated: *urmez*, *stăm*.'
    glosses:
      curând: soon
      vacanță: holiday
      august: August
      sora: sister
      în: to
      grecia: Greece
      hotel: hotel
      stăm: to stay
      după: after that
      părinții: parents
      zile: days
      viitor: next
      anul: year
      gând: intention (am de gând să = I plan to)
      curs: course
      urmez: to follow
      poate: maybe
      mut: to move house
      atunci: then
      și: also
  ro.a2.unit75.lesson06.teach.salut_mihai_ai:
    title: Ana asks Mihai about his plans
    gloss: 'Ana: Hi Mihai! Do you have plans for the summer holiday yet?'
  ro.a2.unit75.lesson06.teach.da_in_august:
    title: Mihai answers
    gloss: 'Mihai: Yes! In August I am going to Germany. I am going to book a hotel.'
  ro.a2.unit75.lesson06.teach.frumos_cu_cine:
    title: Ana asks who he is going with
    gloss: 'Ana: Nice! Who are you going with?'
  ro.a2.unit75.lesson06.teach.cu_unchiul_meu:
    title: Mihai says who and how long
    gloss: 'Mihai: With my uncle. We are going to stay for a week.'
  ro.a2.unit75.lesson06.teach.si_mai_tarziu:
    title: Ana asks about later
    gloss: 'Ana: And later? What do you plan to do?'
  ro.a2.unit75.lesson06.teach.anul_viitor_am:
    title: Mihai names an intention and asks back
    gloss: 'Mihai: Next year I plan to take a course. And you?'
  ro.a2.unit75.lesson06.teach.in_iulie_o:
    title: Ana answers
    gloss: 'Ana: In July I am going to work. Maybe I will go to my parents'' after that.'
