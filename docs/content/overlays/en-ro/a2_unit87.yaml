  ro.a2.unit87.lesson05.exercise01.citeste_mihai: {"instruction": "Read Mihai's message and choose the answer.", "correct_option": "To run in the morning.", "distractors": ["To drink coffee in the evening.", "To work more.", "To call Ana."], "accepted_answers": [{"value": "To run in the morning.", "status": "correct"}], "feedback": "*Am început să alerg dimineața.*"}
