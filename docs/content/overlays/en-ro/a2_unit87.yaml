teaching:
  ro.a2.unit87.lesson01.teach.cuvinte: {"title": "Starting something", "gloss": "started / I run / I learn / I read", "note": "*A începe* means 'to start'. In the perfect compus: *am început*, *ai început*, *a început*.", "example_gloss": ["I started to run.", "Mihai started to run.", "Maria started to read a lot."]}
  ro.a2.unit87.lesson01.teach.gn_am_inceput: {"title": "*Am început să* + verb", "gloss": "I started to run. Have you started to run? Mihai started to run.", "note": "*Am început* stays the same for the verb *a începe*; only the verb after *să* changes with the person: *alerg*, *alergi*, *alerge*."}
  ro.a2.unit87.lesson01.teach.gn_incep: {"title": "Starting now or soon", "gloss": "Tomorrow I start to run. Mihai is starting to run.", "note": "The present *încep* / *începe* also takes *să* + verb. It is used for what you start now or soon."}
  ro.a2.unit87.lesson02.teach.cuvinte: {"title": "Stopping something", "gloss": "stopped / more, any more / I use / he or she works", "note": "*Nu mai* + verb means 'no longer'. *Am încetat să* is a slightly more formal way to say it.", "example_gloss": ["I stopped drinking coffee in the evening.", "I no longer drink coffee in the evening.", "I stopped using the phone in the evening.", "Mihai no longer works in the evening."]}
  ro.a2.unit87.lesson02.teach.gn_am_incetat: {"title": "*Am încetat să* + verb", "gloss": "I stopped drinking coffee. Maria stopped working in the evening.", "note": "*A înceta să* + verb says that you stopped doing something. The verb after *să* matches the person: *beau*, *lucreze*."}
  ro.a2.unit87.lesson02.teach.gn_nu_mai: {"title": "*Nu mai*", "gloss": "I no longer drink coffee in the evening. Mihai no longer works in the evening.", "note": "*Nu mai* + the present verb is the common spoken way to say 'not any more'. The verb is in the ordinary present."}
  ro.a2.unit87.lesson02.teach.gn_contrast: {"title": "Start and stop", "gloss": "I started to run. I stopped drinking coffee. I no longer drink coffee.", "note": "*Am început să* starts a habit, and *am încetat să* or *nu mai* ends one."}
  ro.a2.unit87.lesson03.teach.cuvinte: {"title": "Trying", "gloss": "I try / he or she tries / not to / every day", "note": "*Încerc* is for *eu*, *încearcă* for *el* or *ea*. After it, *să nu* means 'not to'.", "example_gloss": ["I'm trying to sleep more.", "Mihai tries to run in the morning.", "I try not to drink coffee in the evening."]}
  ro.a2.unit87.lesson03.teach.gn_incerc: {"title": "*A încerca să* + verb", "gloss": "I'm trying to sleep more. Mihai tries to run in the morning.", "note": "*A încerca să* means 'to try to'. The verb after *să* matches the person: *dorm*, *alerge*."}
  ro.a2.unit87.lesson03.teach.gn_sa_nu: {"title": "Trying not to", "gloss": "I try not to drink coffee in the evening. I try not to work too much.", "note": "The negation goes after *să*: *să nu beau*. This is different from *nu încerc să*, which means 'I don't try to'."}
  ro.a2.unit87.lesson03.teach.gn_am_incercat: {"title": "*Am încercat să*", "gloss": "I tried to call. Have you tried to cook? I tried to cook sarmale.", "note": "*Am încercat să* is the perfect compus. Compare with *am încercat* + noun in the earlier unit: *Am încercat mămăligă.*"}
  ro.a2.unit87.lesson04.teach.cuvinte: {"title": "Forgetting", "gloss": "forgotten / forget / sorry / yesterday / the keys", "note": "*Am uitat să* + verb means 'I forgot to'. *Am uitat* + noun means 'I forgot something'.", "example_gloss": ["I forgot to call.", "I forgot to pay.", "I forgot the keys.", "Sorry, I forgot to call you yesterday."]}
  ro.a2.unit87.lesson04.teach.gn_am_uitat: {"title": "*Am uitat să* + verb", "gloss": "I forgot to call. I forgot to pay.", "note": "The verb after *să* has the *eu* form: *sun*, *plătesc*."}
  ro.a2.unit87.lesson04.teach.gn_nu_uita: {"title": "*Nu uita să*", "gloss": "Don't forget to come on time! Don't forget to call me!", "note": "*Nu uita să* + the *tu* form is a friendly reminder."}
  ro.a2.unit87.lesson04.teach.gn_nu_am_uitat: {"title": "Forgot and did not forget", "gloss": "I forgot to pay. I did not forget to pay.", "note": "*Nu am uitat să* says that you remembered."}
  ro.a2.unit87.lesson05.teach.cuvinte: {"title": "Words for the messages", "gloss": "well done / nothing / slowly / I sleep", "note": "*Nu e nimic* is a kind reply to an apology.", "example_gloss": ["Well done, Mihai!", "It's nothing.", "I run slowly."]}
  ro.a2.unit87.lesson05.teach.mesaj_mihai: {"title": "Mihai writes to Ana", "gloss": "Hi, Ana! I have started to run in the morning. I stopped drinking coffee in the evening and now I sleep better. I try not to work too much. But I forgot to call you yesterday. Sorry!", "note": "Mihai uses all four verbs of the unit."}
  ro.a2.unit87.lesson05.teach.raspuns_ana: {"title": "Ana answers", "gloss": "Hi, Mihai! It's nothing. I no longer cough. I try to sleep more. Well done! Don't forget to run slowly!", "note": "Ana uses *nu mai*, *încerc să* and *nu uita să*."}
  ro.a2.unit87.lesson06.teach.d1: {"title": "Ana asks", "gloss": "Ana: Mihai, have you started to run?"}
  ro.a2.unit87.lesson06.teach.d2: {"title": "Mihai answers", "gloss": "Mihai: Yes, I have started to run in the morning."}
  ro.a2.unit87.lesson06.teach.d3: {"title": "Ana says well done", "gloss": "Ana: Well done! I'm trying to sleep more."}
  ro.a2.unit87.lesson06.teach.d4: {"title": "Mihai stopped coffee", "gloss": "Mihai: Me too. I stopped drinking coffee in the evening."}
  ro.a2.unit87.lesson06.teach.d5: {"title": "Ana no longer drinks coffee", "gloss": "Ana: I don't drink coffee in the evening any more."}
  ro.a2.unit87.lesson06.teach.d6: {"title": "Mihai apologises", "gloss": "Mihai: Sorry, I forgot to call you yesterday."}
  ro.a2.unit87.lesson06.teach.d7: {"title": "Ana reminds him", "gloss": "Ana: It's nothing! Don't forget to run slowly."}
exercises:
