  ro.a2.unit87.lesson06.exercise03.une_dialog: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Ai început să alergi?", "right": "Have you started to run?"}, {"left": "Am început să alerg dimineața.", "right": "I started to run in the morning."}, {"left": "Încerc să dorm mai mult.", "right": "I'm trying to sleep more."}, {"left": "Am încetat să beau cafea seara.", "right": "I stopped drinking coffee in the evening."}, {"left": "Eu nu mai beau cafea seara.", "right": "I don't drink coffee in the evening any more."}, {"left": "Am uitat să te sun ieri.", "right": "I forgot to call you yesterday."}, {"left": "Nu e nimic!", "right": "It's nothing!"}, {"left": "Nu uita să alergi încet.", "right": "Don't forget to run slowly."}], "status": "correct"}], "feedback": "These are the lines of the dialogue."}
  ro.a2.unit87.lesson06.exercise04.ordine_dorm: {"instruction": "Put the words in order to say 'I'm trying to sleep more.'", "correct_option": "Încerc să dorm mai mult", "accepted_answers": [{"value": "Încerc să dorm mai mult", "status": "correct"}], "feedback": "*Încerc să dorm mai mult.*"}
  ro.a2.unit87.lesson06.exercise05.raspunde_alergi: {"instruction": "Answer in Romanian: say yes, you have started to run in the morning.", "correct_option": "Da, am început să alerg dimineața.", "accepted_answers": [{"value": "Da, am început să alerg dimineața.", "status": "correct"}, {"value": "Da, am început să alerg dimineața", "status": "correct"}, {"value": "Da, am început să alerg.", "status": "correct"}, {"value": "Da, am început să alerg", "status": "correct"}, {"value": "Da, dimineața am început să alerg.", "status": "correct"}, {"value": "Da, dimineața am început să alerg", "status": "correct"}], "feedback": "*Da, am început să alerg dimineața.*"}
  ro.a2.unit87.lesson06.exercise06.traduce_nu_mai: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Nu mai beau cafea seara. Încerc să dorm mai mult.", "status": "correct"}, {"value": "Nu mai beau cafea seara. Încerc să dorm mai mult", "status": "correct"}, {"value": "Seara nu mai beau cafea. Încerc să dorm mai mult.", "status": "correct"}, {"value": "Seara nu mai beau cafea. Încerc să dorm mai mult", "status": "correct"}], "feedback": "*Nu mai beau cafea seara. Încerc să dorm mai mult.*"}
  ro.a2.unit87.lesson06.exercise07.scrie_doua: {"instruction": "Write exactly two sentences. Use *am început să* in the first and *am uitat să* in the second.", "correct_option": "Am început să alerg dimineața. Am uitat să te sun ieri.", "accepted_answers": [{"value": "Am început să alerg dimineața. Am uitat să te sun ieri.", "status": "correct"}, {"value": "Am început să alerg dimineața. Am uitat să te sun ieri", "status": "correct"}, {"value": "Am început să alerg dimineața. Ieri am uitat să te sun.", "status": "correct"}, {"value": "Am început să alerg dimineața. Ieri am uitat să te sun", "status": "correct"}], "feedback": "*Am început să alerg dimineața. Am uitat să te sun ieri.*"}
