  ro.a2.unit87.lesson01.exercise02.alege_mihai: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Mihai a început să alerge.", "distractors": ["Mihai a început să alerg.", "Mihai am început să alerge.", "Mihai a început să alergi."], "accepted_answers": [{"value": "Mihai a început să alerge.", "status": "correct"}], "feedback": "For *Mihai*, the verb after *să* is *alerge*."}
  ro.a2.unit87.lesson01.exercise03.une_incep: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Am început să alerg.", "right": "I started to run."}, {"left": "Ai început să alergi?", "right": "Have you started to run?"}, {"left": "Mihai a început să alerge.", "right": "Mihai started to run."}, {"left": "alerg", "right": "I run"}, {"left": "învăț", "right": "I learn"}, {"left": "citesc", "right": "I read"}, {"left": "Încep să alerg.", "right": "I am starting to run."}, {"left": "Mâine încep să alerg.", "right": "Tomorrow I start to run."}], "status": "correct"}], "feedback": "These are the words and phrases for starting something."}
