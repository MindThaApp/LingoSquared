review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Romanian confirmation needed (DRAFT). Confirm the English
    glosses match idiomatic Romanian, that every matching_pairs
    right-hand gloss discriminates its left on real meaning, and that
    the culminating writing/speaking answers (lesson06) accept the
    punctuation forms a correct learner would actually produce. See the
    realization file's review block for the full priority list.
  notes: >-
    Overlay for ro's seventh B2 unit, authored alongside the
    realization. English speakers' real interference risks for this
    outcome: (1) "dacă...atunci..." (if...then...), "dar numai dacă"
    (but only if), "cu condiția să" (on condition that), and "doar
    dacă" (only if) all condition an agreement but differ in where they
    attach and how strong they read -- kept distinct in lesson03's
    glosses; (2) "Nu merge" is blunt in isolation but reads as a normal
    polite refusal opener in this register when followed by a reason --
    flagged in lesson02; (3) every production prompt names the exact
    connective wanted so a correct learner proposing/declining/
    conditioning with a differently-taught form is not marked wrong. No
    sibling-direction file (ro-en b2) was consulted.

course:
  title: Romanian B2
  description: >-
    Upper-intermediate Romanian: negotiate an outcome -- propose terms
    (propun să, Ce ați spune despre), decline an unacceptable one (Nu
    merge, aș prefera), offer a conditional concession (dar numai dacă,
    cu condiția să), and reach an agreement (Ne-am înțeles, împărțim),
    around the everyday task of organizing a team party.

units:
  ro.b2.unit07.negociere:
    title: "Negotiation"
    description: Negotiate an outcome -- propose a term, decline an unacceptable one, offer a conditional concession, and reach an agreement while keeping the relationship intact.

lessons:
  ro.b2.unit07.lesson01.o_propunere:
    title: "A proposal"
  ro.b2.unit07.lesson02.refuz_politicos:
    title: "A polite refusal"
  ro.b2.unit07.lesson03.o_conditie:
    title: "A condition"
  ro.b2.unit07.lesson04.o_intelegere:
    title: "Reaching an agreement"
  ro.b2.unit07.lesson05.ce_s_a_stabilit:
    title: "What was decided?"
  ro.b2.unit07.lesson06.negociind_in_dialog:
    title: "Negotiating in a conversation"

teaching:
  ro.b2.unit07.lesson01.teach.petrecerea:
    title: "the party"
    gloss: "the party"
    note: "*Petrecerea* is what Ana and Mihai will negotiate over -- the situation for this whole unit."
    example_gloss: "Ana is organizing a party."
  ro.b2.unit07.lesson01.teach.propun:
    title: "I propose"
    gloss: "I propose (from a propune)"
    example_gloss: "I propose a new idea."
  ro.b2.unit07.lesson01.teach.echipa:
    title: "the team"
    gloss: "the team"
    example_gloss: "The team works well."
  ro.b2.unit07.lesson01.teach.ce_ati_spune:
    title: "What would you say about that?"
    gloss: "What would you say about that?"
    note: "*Ce ați spune despre...?* is a soft, polite way to open a proposal -- less direct than a flat statement."
  ro.b2.unit07.lesson01.teach.ce_ar_fi_daca:
    title: "What if...?"
    gloss: "What if...?"
    note: "*Ce-ar fi dacă...?* floats an idea tentatively, as a genuine question rather than a demand."
  ro.b2.unit07.lesson01.teach.propunerea_mea:
    title: "my proposal"
    gloss: "my proposal"
  ro.b2.unit07.lesson01.teach.grammar_propunere:
    title: "I propose that we organize a party for the team. What would you say about that? What if we did that this month?"
    gloss: "I propose that we organize a party for the team. What would you say about that? What if we did that this month?"
    note: "Making a proposal = naming what you want (*propun să*) and inviting a response (*Ce ați spune despre*, *Ce-ar fi dacă*) rather than simply announcing a decision."

  ro.b2.unit07.lesson02.teach.nu_merge:
    title: "That doesn't work."
    gloss: "That doesn't work."
    note: "*Nu merge* is a short, direct refusal -- always follow it with a reason so it reads as a negotiation move, not a dismissal."
    example_gloss: "That doesn't work tomorrow."
  ro.b2.unit07.lesson02.teach.as_prefera:
    title: "I would prefer"
    gloss: "I would prefer (conditional of a prefera)"
    note: "*Aș prefera* softens a refusal into a preference -- more polite than a flat *nu vreau* ('I don't want')."
    example_gloss: "I would prefer something else."
  ro.b2.unit07.lesson02.teach.mancarea:
    title: "the food"
    gloss: "the food"
    example_gloss: "I'll take care of the food."
  ro.b2.unit07.lesson02.teach.nu_chiar_tot:
    title: "not quite everything"
    gloss: "not quite everything"
    note: "*Nu chiar tot* declines PART of a proposal without rejecting all of it -- the key move of a polite negotiation refusal."
  ro.b2.unit07.lesson02.teach.ma_ocup_de:
    title: "I'll take care of..."
    gloss: "I'll take care of..."
  ro.b2.unit07.lesson02.teach.grammar_refuz:
    title: "That doesn't work. I would prefer not to take care of all the food -- not quite everything."
    gloss: "That doesn't work. I would prefer not to take care of all the food -- not quite everything."
    note: "A polite refusal declines PART of a proposal (*nu chiar tot*) with a softened reason (*aș prefera*), keeping the door open to a counter-offer rather than a flat no."

  ro.b2.unit07.lesson03.teach.decoratiunile:
    title: "the decorations"
    gloss: "the decorations"
    example_gloss: "We're buying decorations."
  ro.b2.unit07.lesson03.teach.daca_atunci:
    title: "if..., then..."
    gloss: "if..., then..."
  ro.b2.unit07.lesson03.teach.dar_numai_daca:
    title: "but only if..."
    gloss: "but only if..."
    note: "*Dar numai dacă...* attaches a condition directly to the concession you just made -- the classic negotiation move: 'I'll do X, but only if you do Y'."
  ro.b2.unit07.lesson03.teach.cu_conditia_sa:
    title: "on condition that..."
    gloss: "on condition that..."
    note: "*Cu condiția să...* is a slightly more formal way to state the same kind of condition as *dar numai dacă*, often used to summarize the whole deal."
  ro.b2.unit07.lesson03.teach.doar_daca:
    title: "only if"
    gloss: "only if"
    note: "*Doar dacă* states a bare condition on its own, without necessarily following a concession -- compare *dar numai dacă*, which pairs with one."
    example_gloss: "I'll come only if it's safe."
  ro.b2.unit07.lesson03.teach.va_ocupati:
    title: "you take care of..."
    gloss: "you take care of... (formal)"
  ro.b2.unit07.lesson03.teach.grammar_conditie:
    title: "I'll take care of the food, but only if you take care of the decorations. On condition that you help, I agree."
    gloss: "I'll take care of the food, but only if you take care of the decorations. On condition that you help, I agree."
    note: "Setting a condition = offering a concession (*mă ocup de*) tied to a requirement on the other person (*dar numai dacă*, *cu condiția să*) -- a conditional 'yes', not an unconditional one."

  ro.b2.unit07.lesson04.teach.ne_am_inteles:
    title: "We've agreed."
    gloss: "We've agreed. / It's a deal."
    note: "*Ne-am înțeles* seals a negotiation -- the standard way to confirm a deal is done."
  ro.b2.unit07.lesson04.teach.perfect_de_acord:
    title: "Perfectly agreed."
    gloss: "Perfectly agreed."
  ro.b2.unit07.lesson04.teach.bugetul:
    title: "the budget"
    gloss: "the budget"
    example_gloss: "The budget is limited."
  ro.b2.unit07.lesson04.teach.impartim:
    title: "we split"
    gloss: "we split (from a împărți, to split/share)"
    example_gloss: "We split the budget."
  ro.b2.unit07.lesson04.teach.eram_de_acord:
    title: "we reached an agreement"
    gloss: "we reached an agreement"
  ro.b2.unit07.lesson04.teach.grammar_intelegere:
    title: "We've agreed. Perfectly agreed. We split the budget -- we reached an agreement."
    gloss: "We've agreed. Perfectly agreed. We split the budget -- we reached an agreement."
    note: "Reaching an agreement = a clear confirming phrase (*Ne-am înțeles*, *Perfect de acord*) plus the concrete terms that were actually settled (*împărțim bugetul*)."

  ro.b2.unit07.lesson05.teach.text:
    title: "Reading: what Ana and Mihai agreed"
    gloss: "Mihai proposed a party for the team. Ana agreed, but not quite with everything. Mihai preferred not to take care of all the food. Ana took care of the food, but only if Mihai took care of the decorations. In the end, they agreed: they split the budget, and the date remains open for now."
    glosses:
      a: "(auxiliary, perfectul compus)"
      propus: proposed
      fost: "been (a fost de acord = agreed)"
      se: "(reflexive marker)"
      ocupa: "was taking care of (imperfectul)"
      s-au: "they have (each other, reflexive)"
      împart: "they split"
      rămâne: remains
      deschisă: open
      pentru: for
      moment: "moment / now"
      s-a: "he/she has (reflexive)"
      ocupat: "taken care of"

