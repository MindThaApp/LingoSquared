course:
  title: Romanian B2
  description: >-
    Upper-intermediate Romanian: speculate about causes and consequences
    with graded certainty -- say what may, might, must, or cannot be the
    case in the present and the past (poate, probabil, trebuie să fie, nu
    poate fi, s-ar putea să fie, trebuie să fi uitat), and distinguish a
    firm deduction from a mere guess, around the everyday puzzle of a
    colleague who is not answering her phone.

units:
  ro.b2.unit02.speculatie:
    title: "Speculation"
    description: Speculate about causes with graded certainty -- say what may, might, must, or cannot be the case, in the present and the past, and tell a firm deduction apart from a mere guess.

lessons:
  ro.b2.unit02.lesson01.certitudine:
    title: "The degree of certainty"
  ro.b2.unit02.lesson02.deductie:
    title: "Deduction: evidence and conclusions"
  ro.b2.unit02.lesson03.presupunere:
    title: "A guess or a deduction?"
  ro.b2.unit02.lesson04.trecutul:
    title: "Speculating about the past"
  ro.b2.unit02.lesson05.fapt_sau_speculatie:
    title: "Fact or speculation?"
  ro.b2.unit02.lesson06.speculand_impreuna:
    title: "Speculating together"

teaching:
  ro.b2.unit02.lesson01.teach.diana_nu_raspunde:
    title: "Diana isn't answering the phone."
    gloss: "Diana isn't answering the phone."
    note: "*Nu răspunde* (isn't answering) is from *a răspunde*, to answer. Diana, a colleague of Mihai's, isn't picking up."
  ro.b2.unit02.lesson01.teach.de_ce_nu_raspunde:
    title: "Why isn't she answering?"
    gloss: "Why isn't she answering?"
  ro.b2.unit02.lesson01.teach.ocupata:
    title: busy
    gloss: busy
    note: "*Ocupată* is the feminine form, agreeing with *Diana*/*ea*; the masculine form is *ocupat*."
    example_gloss: "Diana is busy today."
  ro.b2.unit02.lesson01.teach.poate:
    title: maybe
    gloss: "maybe / perhaps"
    note: "*Poate* here is the certainty adverb 'maybe' -- the weakest guess on the scale. Watch for it again later with a completely different job (the verb 'can')."
    example_gloss: "Maybe she is busy."
  ro.b2.unit02.lesson01.teach.probabil:
    title: probably
    gloss: probably
    example_gloss: "She is probably busy."
  ro.b2.unit02.lesson01.teach.sigur:
    title: "surely / sure"
    gloss: "surely / sure (adverb, before the verb)"
    note: "Used adverbially before the verb, *sigur* strengthens the claim: 'surely she is busy'."
    example_gloss: "Surely she is busy."
  ro.b2.unit02.lesson01.teach.cu_siguranta:
    title: certainly
    gloss: "certainly / for certain"
    example_gloss: "Certainly she is busy."
  ro.b2.unit02.lesson01.teach.fara_indoiala:
    title: undoubtedly
    gloss: "without a doubt / undoubtedly"
    note: "The strongest word on the certainty scale, typically opening the sentence, set off by a comma."
    example_gloss: "Without a doubt, she is busy."
  ro.b2.unit02.lesson01.teach.intalnire:
    title: meeting
    gloss: meeting
    example_gloss: "Diana is at a meeting."
  ro.b2.unit02.lesson01.teach.grammar_certitudine:
    title: "Maybe she is busy. She is probably at a meeting. Certainly she will answer later. Without a doubt, it is something important."
    gloss: "Maybe she is busy. She is probably at a meeting. Certainly she will answer later. Without a doubt, it is something important."
    note: "The certainty scale, weakest to strongest: *poate* < *probabil* < *sigur* / *cu siguranță* < *fără îndoială*. Choosing the right word tells your listener exactly how confident you are, not just that you are guessing."

  ro.b2.unit02.lesson02.teach.trebuie_sa_fie:
    title: "must be"
    gloss: "must be (firm deduction)"
    note: "*Trebuie să fie* states a conclusion you are confident about because you have real evidence for it -- stronger than *poate* or *probabil*."
  ro.b2.unit02.lesson02.teach.nu_poate_fi:
    title: "cannot be"
    gloss: "cannot be"
    note: "*Poate* here is NOT the certainty adverb 'maybe' -- it is the 3rd-person form of *a putea* ('to be able to'), so *nu poate fi* literally means 'is not able to be', i.e. 'cannot be'. Same spelling, different word."
  ro.b2.unit02.lesson02.teach.acasa:
    title: home
    gloss: "home / at home"
    example_gloss: "Diana is not home."
  ro.b2.unit02.lesson02.teach.deci:
    title: "so / therefore"
    gloss: "so / therefore"
    note: "*Deci* signposts a conclusion drawn from what was just said -- the connective that turns evidence into a deduction."
    example_gloss: "She is busy, so she isn't answering."
  ro.b2.unit02.lesson02.teach.birou:
    title: office
    gloss: office
    example_gloss: "Mihai is at the office."
  ro.b2.unit02.lesson02.teach.a_suna:
    title: "rings / calls"
    gloss: "rings / calls (from a suna, to ring/call)"
    example_gloss: "Diana calls the office."
  ro.b2.unit02.lesson02.teach.grammar_deductie:
    title: "She must be at a meeting, so she isn't answering. She cannot be home, because she is busy at the office."
    gloss: "She must be at a meeting, so she isn't answering. She cannot be home, because she is busy at the office."
    note: "A deduction states a firm conclusion (*trebuie să fie*, *nu poate fi*) backed by real evidence, signposted with *deci* ('so') or *pentru că* ('because') -- stronger than a mere guess."

  ro.b2.unit02.lesson03.teach.s_ar_putea_sa_fie:
    title: "it might be"
    gloss: "it might be (weaker than trebuie să fie)"
    note: "*S-ar putea să fie* states a real possibility with no firm evidence behind it -- weaker than *trebuie să fie*, which states a firm deduction."
  ro.b2.unit02.lesson03.teach.posibil:
    title: possible
    gloss: possible
    example_gloss: "It is possible that she is busy."
  ro.b2.unit02.lesson03.teach.stiu:
    title: "I know"
    gloss: "I know (from a ști, to know)"
    example_gloss: "I don't know for sure."
  ro.b2.unit02.lesson03.teach.ghicesc:
    title: "I suppose / I guess"
    gloss: "I suppose / I guess (from a presupune, to suppose)"
    note: "*Presupun că...* is how Romanian says 'I guess (that)...' when you are hedging. Do not use *a ghici* here -- that means guessing an answer or a riddle."
    example_gloss: "I suppose she is busy."
  ro.b2.unit02.lesson03.teach.grammar_gok_vs_deductie:
    title: "She must be at the office -- the car is there, so it is a deduction. She might be busy -- I don't know for sure, so it is only a guess."
    gloss: "She must be at the office -- the car is there, so it is a deduction. She might be busy -- I don't know for sure, so it is only a guess."
    note: "The key test: is there real evidence (a deduction, *trebuie să fie*) or none at all (a mere guess, *s-ar putea să fie* / *posibil* / *presupun*)?"

  ro.b2.unit02.lesson04.teach.a_uitat:
    title: "forgot / has forgotten"
    gloss: "forgot / has forgotten (perfectul compus of a uita, to forget)"
    example_gloss: "Diana forgot the phone."
  ro.b2.unit02.lesson04.teach.trebuie_sa_fi:
    title: "must have..."
    gloss: "must have... (past-tense deduction)"
    note: "*Trebuie să fi + [past participle]* is the PAST-tense form of the deduction *trebuie să fie*: *trebuie să fi uitat* = 'must have forgotten'. The auxiliary is *fi* ('to be'), not a form of 'to have' -- there is no direct word-for-word English mapping."
  ro.b2.unit02.lesson04.teach.grammar_trecut:
    title: "Maybe she forgot the phone at home. She must have forgotten the phone at home."
    gloss: "Maybe she forgot the phone at home. She must have forgotten the phone at home."
    note: "The same guess-vs-deduction contrast now applied to the past: *poate + [perfectul compus]* is a plain guess about a past event; *trebuie să fi + [participiu]* is a firm past deduction."

  ro.b2.unit02.lesson05.teach.text:
    title: "Reading: why isn't Diana answering?"
    gloss: "Diana hasn't been answering the phone since morning. Maybe she is busy. She is probably at a meeting, so she isn't answering. Her car is at the office. She must be there. She cannot be home. She might have forgotten the phone."
    glosses:
      dimineață: morning
      ei: "her (possessive)"
      acolo: there

  ro.b2.unit02.lesson06.teach.azi_dimineata:
    title: "this morning"
    gloss: "this morning"
    note: "*Azi dimineață* (literally 'today morning') is the everyday way to say 'this morning'."
  ro.b2.unit02.lesson06.teach.dialogue_mihai_setup:
    title: "Mihai: Diana isn't answering the phone this morning."
    gloss: "Mihai: Diana isn't answering the phone this morning."
  ro.b2.unit02.lesson06.teach.dialogue_ana_guess:
    title: "Ana: Maybe she is busy."
    gloss: "Ana: Maybe she is busy."
    note: "*Poate* -- a plain guess, with no evidence."
  ro.b2.unit02.lesson06.teach.dialogue_mihai_deduction:
    title: "Mihai: Her car is at the office, so she must be there."
    gloss: "Mihai: Her car is at the office, so she must be there."
    note: "Evidence (the car), then *deci* + *trebuie să fie* -- a firm deduction."
  ro.b2.unit02.lesson06.teach.dialogue_ana_impossibility:
    title: "Ana: She cannot be home."
    gloss: "Ana: She cannot be home."
  ro.b2.unit02.lesson06.teach.dialogue_mihai_past_guess:
    title: "Mihai: She might have forgotten the phone."
    gloss: "Mihai: She might have forgotten the phone."
    note: "*S-ar putea să fi uitat* -- a possibility about the past, weaker than *trebuie să fi uitat*."
  ro.b2.unit02.lesson06.teach.dialogue_ana_past_deduction:
    title: "Ana: She must have forgotten the phone at home."
    gloss: "Ana: She must have forgotten the phone at home."
    note: "*Trebuie să fi uitat* -- a firm deduction about the past."
  ro.b2.unit02.lesson06.teach.grammar_speculatie_completa:
    title: "Maybe she is busy. Her car is at the office, so she must be there. She must have forgotten the phone at home."
    gloss: "Maybe she is busy. Her car is at the office, so she must be there. She must have forgotten the phone at home."
    note: "A full chain of speculation: a guess (*poate*), a deduction backed by evidence (*deci trebuie să fie*), and a past deduction (*trebuie să fi* + participle)."

exercises:
  ro.b2.unit02.lesson01.exercise01.recognize_poate:
    instruction: "What does this word mean?"
    correct_option: maybe
    distractors: [probably, certainly, undoubtedly]
    accepted_answers: [{value: maybe, status: correct}]
    feedback: "Poate means maybe -- the weakest guess on the certainty scale."
  ro.b2.unit02.lesson01.exercise02.listen_probabil_ocupata:
    instruction: "Listen and select what you hear."
    correct_option: "She is probably busy."
    distractors: ["She is definitely busy.", "She is probably not busy.", "She is probably at a meeting."]
    accepted_answers: [{value: "She is probably busy.", status: correct}]
    feedback: "Probabil este ocupată means she is probably busy."
  ro.b2.unit02.lesson01.exercise03.match_certainty_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {poate: maybe, probabil: probably, sigur: surely, "cu siguranță": certainly, "fără îndoială": undoubtedly, ocupată: busy, telefon: phone, întâlnire: meeting}
        status: correct
    feedback: "These are this lesson's certainty-scale words."
  ro.b2.unit02.lesson01.exercise04.order_probabil_ocupata:
    instruction: "Put the words in order: She is probably busy."
    accepted_answers:
      - {value: "Probabil este ocupată", status: correct}
      - {value: "Este probabil ocupată", status: correct}
    feedback: "Probabil este ocupată means she is probably busy."
  ro.b2.unit02.lesson01.exercise05.translate_probabil_intalnire:
    instruction: "Translate into Romanian: She is probably at a meeting."
    accepted_answers:
      - {value: "Probabil este la o întâlnire", status: correct}
      - {value: "Este probabil la o întâlnire", status: correct}
    feedback: "Probabil este la o întâlnire means she is probably at a meeting."
  ro.b2.unit02.lesson01.exercise06.speak_fara_indoiala:
    instruction: "Say aloud in Romanian: Without a doubt, she is busy."
    accepted_answers:
      - {value: "Fără îndoială, este ocupată", status: correct}
      - {value: "Fără îndoială este ocupată", status: correct}
    feedback: "Fără îndoială, este ocupată means without a doubt, she is busy."
  ro.b2.unit02.lesson01.exercise07.write_cu_siguranta:
    instruction: "Write in Romanian, using cu siguranță: Certainly she is busy."
    accepted_answers:
      - {value: "Cu siguranță este ocupată", status: correct}
    feedback: "Cu siguranță este ocupată means certainly she is busy."
  ro.b2.unit02.lesson01.exercise08.dictation_probabil_ocupata:
    instruction: "Type what you hear."
    correct_response: "Probabil este ocupată"
    orthography_strict: true
    feedback: "You heard Probabil este ocupată — she is probably busy."

  ro.b2.unit02.lesson02.exercise01.recognize_trebuie_sa_fie:
    instruction: "What does this phrase mean?"
    correct_option: "must be"
    distractors: ["might be", "cannot be", "used to be"]
    accepted_answers: [{value: "must be", status: correct}]
    feedback: "Trebuie să fie means must be -- a firm deduction backed by evidence."
  ro.b2.unit02.lesson02.exercise02.listen_trebuie_intalnire:
    instruction: "Listen and select what you hear."
    correct_option: "She must be at a meeting."
    distractors: ["She might be at a meeting.", "She cannot be at a meeting.", "She must be at the office."]
    accepted_answers: [{value: "She must be at a meeting.", status: correct}]
    feedback: "Trebuie să fie la o întâlnire means she must be at a meeting."
  ro.b2.unit02.lesson02.exercise03.match_deduction_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"trebuie să fie": "must be", "nu poate fi": "cannot be", acasă: home, deci: "so / therefore", birou: office, sună: "rings / calls", ocupată: busy, întâlnire: meeting}
        status: correct
    feedback: "These are this lesson's deduction words."
  ro.b2.unit02.lesson02.exercise04.order_trebuie_intalnire:
    instruction: "Put the words in order: She must be at a meeting."
    accepted_answers:
      - {value: "Trebuie să fie la o întâlnire", status: correct}
    feedback: "Trebuie să fie la o întâlnire means she must be at a meeting."
  ro.b2.unit02.lesson02.exercise05.translate_nu_poate_fi:
    instruction: "Translate into Romanian: She cannot be home."
    accepted_answers:
      - {value: "Nu poate fi acasă", status: correct}
      - {value: "Nu poate să fie acasă", status: correct}
    feedback: "Nu poate fi acasă means she cannot be home."
  ro.b2.unit02.lesson02.exercise06.write_deci:
    instruction: "Write in Romanian, using deci: She must be at a meeting, so she isn't answering."
    accepted_answers:
      - {value: "Trebuie să fie la o întâlnire, deci nu răspunde", status: correct}
      - {value: "Trebuie să fie la o întâlnire deci nu răspunde", status: correct}
    feedback: "Trebuie să fie la o întâlnire, deci nu răspunde means she must be at a meeting, so she isn't answering."
  ro.b2.unit02.lesson02.exercise07.translate_pentru_ca_birou:
    instruction: "Translate into Romanian, using pentru că: She cannot be home, because she is busy at the office."
    accepted_answers:
      - {value: "Nu poate fi acasă, pentru că este ocupată la birou", status: correct}
      - {value: "Nu poate fi acasă pentru că este ocupată la birou", status: correct}
    feedback: "Nu poate fi acasă, pentru că este ocupată la birou means she cannot be home, because she is busy at the office."
  ro.b2.unit02.lesson02.exercise08.dictation_trebuie_intalnire:
    instruction: "Type what you hear."
    correct_response: "Trebuie să fie la o întâlnire"
    orthography_strict: true
    feedback: "You heard Trebuie să fie la o întâlnire — she must be at a meeting."

  ro.b2.unit02.lesson03.exercise01.recognize_posibil:
    instruction: "What does this word mean?"
    correct_option: possible
    distractors: [certain, impossible, "for certain"]
    accepted_answers: [{value: possible, status: correct}]
    feedback: "Posibil means possible."
  ro.b2.unit02.lesson03.exercise02.listen_sar_putea_intalnire:
    instruction: "Listen and select what you hear."
    correct_option: "She might be at a meeting."
    distractors: ["She must be at a meeting.", "She cannot be at a meeting.", "She might be at the office."]
    accepted_answers: [{value: "She might be at a meeting.", status: correct}]
    feedback: "S-ar putea să fie la o întâlnire means she might be at a meeting -- a mere possibility, weaker than trebuie să fie."
  ro.b2.unit02.lesson03.exercise03.match_possibility_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"s-ar putea să fie": "it might be", posibil: possible, știu: "I know", presupun: "I suppose / I guess", "trebuie să fie": "must be", "nu poate fi": "cannot be"}
        status: correct
    feedback: "These are this lesson's possibility and deduction words, side by side."
  ro.b2.unit02.lesson03.exercise04.order_sar_putea_intalnire:
    instruction: "Put the words in order: She might be at a meeting."
    accepted_answers:
      - {value: "S-ar putea să fie la o întâlnire", status: correct}
    feedback: "S-ar putea să fie la o întâlnire means she might be at a meeting."
  ro.b2.unit02.lesson03.exercise05.translate_sar_putea_ocupata:
    instruction: "Translate into Romanian, using s-ar putea să fie: She might be busy."
    accepted_answers:
      - {value: "S-ar putea să fie ocupată", status: correct}
    feedback: "S-ar putea să fie ocupată means she might be busy."
  ro.b2.unit02.lesson03.exercise06.speak_posibil_ocupata:
    instruction: "Say aloud in Romanian: It is possible that she is busy."
    accepted_answers:
      - {value: "Este posibil să fie ocupată", status: correct}
    feedback: "Este posibil să fie ocupată means it is possible that she is busy."
  ro.b2.unit02.lesson03.exercise07.write_nu_stiu_ghicesc:
    instruction: "Write in Romanian, using nu știu sigur and presupun: I don't know for sure, but I guess she is home."
    accepted_answers:
      - {value: "Nu știu sigur, dar presupun că este acasă", status: correct}
      - {value: "Nu știu sigur dar presupun că este acasă", status: correct}
    feedback: "Nu știu sigur, dar presupun că este acasă means I don't know for sure, but I guess she is home."

  ro.b2.unit02.lesson04.exercise01.recognize_uitat:
    instruction: "What does this word mean?"
    correct_option: "forgotten"
    distractors: [remembered, found, lost]
    accepted_answers: [{value: forgotten, status: correct}]
    feedback: "Uitat is the past participle of a uita, to forget."
  ro.b2.unit02.lesson04.exercise02.listen_trebuie_uitat:
    instruction: "Listen and select what you hear."
    correct_option: "She must have forgotten the phone at home."
    distractors: ["She might have forgotten the phone at home.", "She must have lost the phone at home.", "She must have forgotten the phone at the office."]
    accepted_answers: [{value: "She must have forgotten the phone at home.", status: correct}]
    feedback: "Trebuie să fi uitat telefonul acasă means she must have forgotten the phone at home."
  ro.b2.unit02.lesson04.exercise03.match_past_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"a uitat": "forgot / has forgotten", "trebuie să fi...": "must have...", telefonul: "the phone", acasă: home, poate: maybe, "trebuie să fie": "must be"}
        status: correct
    feedback: "These are this lesson's past-speculation words."
  ro.b2.unit02.lesson04.exercise04.order_trebuie_uitat:
    instruction: "Put the words in order: She must have forgotten the phone at home."
    accepted_answers:
      - {value: "Trebuie să fi uitat telefonul acasă", status: correct}
    feedback: "Trebuie să fi uitat telefonul acasă means she must have forgotten the phone at home."
  ro.b2.unit02.lesson04.exercise05.translate_poate_uitat:
    instruction: "Translate into Romanian: Maybe she forgot the phone at home."
    accepted_answers:
      - {value: "Poate a uitat telefonul acasă", status: correct}
    feedback: "Poate a uitat telefonul acasă means maybe she forgot the phone at home."
  ro.b2.unit02.lesson04.exercise06.translate_trebuie_sa_fi_uitat:
    instruction: "Translate into Romanian, using trebuie să fi: She must have forgotten the phone at home."
    accepted_answers:
      - {value: "Trebuie să fi uitat telefonul acasă", status: correct}
    feedback: "Trebuie să fi uitat telefonul acasă means she must have forgotten the phone at home."
  ro.b2.unit02.lesson04.exercise07.write_both_past:
    instruction: "Write these two sentences in Romanian: Maybe she forgot the phone at home. She must have forgotten the phone at home."
    accepted_answers:
      - {value: "Poate a uitat telefonul acasă. Trebuie să fi uitat telefonul acasă", status: correct}
      - {value: "Poate a uitat telefonul acasă. Trebuie să fi uitat telefonul acasă.", status: correct}
    feedback: "Poate a uitat telefonul acasă. Trebuie să fi uitat telefonul acasă -- a guess, then a firm deduction, about the same past event."

  ro.b2.unit02.lesson05.exercise01.read_fact:
    instruction: "What is the one plain fact stated at the start of the text?"
    correct_option: "Diana isn't answering the phone."
    distractors: ["Diana lost her phone.", "Diana is at a meeting.", "Diana forgot her phone."]
    accepted_answers: [{value: "Diana isn't answering the phone.", status: correct}]
    feedback: "The text opens with a plain fact: Diana nu răspunde la telefon de dimineață."
  ro.b2.unit02.lesson05.exercise02.read_guess:
    instruction: "Which sentence is a mere guess, with no evidence given?"
