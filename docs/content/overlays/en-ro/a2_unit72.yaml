teaching:
  ro.a2.unit72.lesson01.teach.orarul:
    title: The schedule
    gloss: the schedule/timetable
    note: '*Orarul* is a masculine noun with the article *-ul* attached; it is used for a work or class timetable.'
    example_gloss: I check my schedule every week.
  ro.a2.unit72.lesson01.teach.luni_lucrez_iar:
    title: Naming two different days' activities
    gloss: On Monday I work, and on Wednesday I have a course.
    note: 'Romanian needs no word for ''on'' before a weekday: *luni* alone means ''on Monday''. Days of the week are written with a small letter, unless they start a sentence.'
  ro.a2.unit72.lesson01.teach.ce_faci_de:
    title: Asking what someone usually does during the week
    gloss: What do you usually do during the week?
    note: '*Peste săptămână* (during the week) refers to the weekdays as a group, in contrast with *în weekend*.'
  ro.a2.unit72.lesson02.teach.ordinea:
    title: The order/sequence
    gloss: the order/sequence
    note: '*Ordinea* is a feminine noun with the article *-a* attached (*ordine* becomes *ordinea*); it is used for the order in which things happen.'
    example_gloss: The order of my day is always the same.
  ro.a2.unit72.lesson02.teach.mai_intai_lucrez:
    title: Sequencing with mai întâi and apoi
    gloss: First I work, then I go exercise.
    note: '*Mai întâi* (first) and *apoi* (then, after that) are the two most common sequencing connectors in Romanian. The verb stays in its normal place: *Mai întâi lucrez, apoi fac sport*.'
  ro.a2.unit72.lesson02.teach.in_cele_din:
    title: Sequencing with în cele din urmă
    gloss: Finally I cook something for dinner.
    note: '*În cele din urmă* (finally) closes a sequence started with *mai întâi* and continued with *apoi*.'
  ro.a2.unit72.lesson03.teach.ziua_lucratoare:
    title: The weekday
    gloss: the weekday
    note: '*Ziua lucrătoare* (the weekday, literally ''the working day'') is contrasted with *weekendul*; *lucrătoare* agrees with the feminine noun *zi*.'
    example_gloss: On a weekday I get up early.
  ro.a2.unit72.lesson03.teach.peste_saptamana_ma:
    title: Contrasting weekdays and the weekend
    gloss: During the week I get up early, but on the weekend I sleep in.
    note: '*A dormi până târziu* (to sleep in, literally ''to sleep until late'') is a fixed expression; *a se trezi devreme* means to get up early. *Mă trezesc* is a reflexive verb: the little word *mă* means ''myself''.'
  ro.a2.unit72.lesson03.teach.care_este_diferenta:
    title: Asking about the difference
    gloss: What's the difference between your weekdays and the weekend?
    note: '*Diferența dintre ... și ...* (the difference between ... and ...) is the standard comparison frame.'
  ro.a2.unit72.lesson04.teach.agenda:
    title: The schedule/planner
    gloss: the schedule/planner
    note: '*Agenda* is a feminine noun used for a personal planner or calendar of appointments.'
    example_gloss: My schedule is completely full this week.
  ro.a2.unit72.lesson04.teach.saptamana_aceasta_agenda:
    title: Saying your schedule is completely full
    gloss: My schedule is completely full this week.
    note: '*Plină* (full) agrees with the feminine noun *agenda*. *Complet plină* is the usual way to say a schedule is fully booked.'
  ro.a2.unit72.lesson04.teach.nu_am_nicio:
    title: Saying you have no free evening
    gloss: I have no free evening this week.
    note: '*Nicio seară liberă* (no free evening): *nicio* is the feminine form of *niciun*, and the adjective *liberă* agrees with *seară*. With *nicio* the verb needs *nu* in front: *Nu am nicio seară liberă*.'
  ro.a2.unit72.lesson04.teach.saptamana_viitoare_am:
    title: Looking ahead to next week
    gloss: Next week I'll have more time.
    note: '*Săptămâna viitoare* (next week) contrasts with *săptămâna aceasta* (this week), already used earlier in this lesson.'
  ro.a2.unit72.lesson05.teach.ioana_are_o:
    title: Reading about Ioana's busy week
    gloss: Ioana's week looks busy. On Monday and Tuesday she works at the library. On Wednesday evening she has a language course. On Thursday she exercises with friends, and on Friday she cooks for her family. On the weekend she rests and reads a book.
    note: '*Are o săptămână foarte aglomerată* (has a very busy week) frames the description; *se odihnește* (''rests'') is a reflexive verb. Days need no word for ''on'': *luni și marți* means ''on Monday and Tuesday''.'
    glosses:
      săptămână: week
      aglomerată: busy
      foarte: very
      Luni: Monday
      marți: Tuesday
      lucrează: works (from a lucra)
      bibliotecă: library
      Miercuri: Wednesday (miercuri seara = Wednesday evening)
      are: has (from a avea)
      curs: course (curs de limbă = language course)
      Joi: Thursday
      sport: sport (face sport = to exercise)
      prietenii: friends
      vineri: Friday
      gătește: cooks (from a găti)
      ei: her
      familia: family
      weekend: weekend
      odihnește: rests (from a se odihni)
      citește: reads (from a citi)
      carte: book
  ro.a2.unit72.lesson06.teach.cum_arata_saptamana:
    title: Ana asks about Mihai's week
    gloss: 'Ana: What does your week look like, Mihai?'
  ro.a2.unit72.lesson06.teach.destul_de_aglomerat:
    title: Mihai describes his work schedule
    gloss: 'Mihai: Pretty busy. First I work from Monday to Thursday, then I have Friday off.'
  ro.a2.unit72.lesson06.teach.ce_faci_in:
    title: Ana asks about his day off
    gloss: 'Ana: What do you do on your day off?'
  ro.a2.unit72.lesson06.teach.vineri_fac_de:
    title: Mihai describes Friday
    gloss: 'Mihai: On Fridays I usually exercise, and in the evening I cook something tasty.'
  ro.a2.unit72.lesson06.teach.si_in_weekend:
    title: Ana asks about the weekend
    gloss: 'Ana: And on the weekend?'
  ro.a2.unit72.lesson06.teach.in_weekend_ma:
    title: Mihai describes the weekend
    gloss: 'Mihai: On the weekend I rest. During the week I just don''t have time.'
  ro.a2.unit72.lesson06.teach.ea_lucreaza_mai:
    title: Third-person sequencing with mai întâi / apoi / în cele din urmă
    gloss: She works first. Then she exercises. Finally she rests.
    note: 'The same connectors work with a third-person subject (*ea*, she); only the verb endings change: *lucrează*, *face*, *se odihnește*.'
