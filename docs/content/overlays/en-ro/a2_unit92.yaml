  ro.a2.unit92.lesson01.exercise02.alege_cat: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Știți cât costă biletul?", "distractors": ["Știți cât este costă biletul?", "Știți cât costul biletul?", "Știți cât costați biletul?"], "accepted_answers": [{"value": "Știți cât costă biletul?", "status": "correct"}], "feedback": "*Cât costă biletul* means 'how much the ticket costs'."}
