  ro.a2.unit92.lesson03.exercise01.alege_puteti: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Puteți să-mi spuneți cât costă biletul?", "distractors": ["Puteți să-mi spuneți cât costă biletul să?", "Puteți mi spuneți cât costă biletul?", "Poți să-mi spuneți cât costă biletul?"], "accepted_answers": [{"value": "Puteți să-mi spuneți cât costă biletul?", "status": "correct"}], "feedback": "*Puteți să-mi spuneți* is formal."}
