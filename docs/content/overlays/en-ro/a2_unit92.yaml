  ro.a2.unit92.lesson01.exercise06.traduce_unde: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Știți unde este gara?", "status": "correct"}, {"value": "Știți unde este gara", "status": "correct"}, {"value": "Știți unde e gara?", "status": "correct"}, {"value": "Știți unde e gara", "status": "correct"}], "feedback": "*Știți unde este gara?*"}
  ro.a2.unit92.lesson01.exercise07.scrie_cand: {"instruction": "Write the requested question with *știți*.", "correct_option": "Știți când pleacă trenul?", "accepted_answers": [{"value": "Știți când pleacă trenul?", "status": "correct"}, {"value": "Știți când pleacă trenul", "status": "correct"}], "feedback": "*Știți când pleacă trenul?*"}
  ro.a2.unit92.lesson02.exercise01.alege_nu_stiu: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Nu știu dacă trenul pleacă acum.", "distractors": ["Nu știu unde trenul pleacă acum.", "Nu știu dacă să trenul pleacă acum.", "Nu știu dacă pleacă acum trenul nu."], "accepted_answers": [{"value": "Nu știu dacă trenul pleacă acum.", "status": "correct"}], "feedback": "*Dacă* introduces a yes-or-no question."}
