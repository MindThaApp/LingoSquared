teaching:
  ro.a2.unit92.lesson01.teach.cuvinte: {"title": "Polite questions", "gloss": "where / the station / it costs / the ticket / it leaves / the train", "note": "*Știți* is the formal 'do you know'. The word after it (*unde*, *cât*, *când*) starts the indirect question.", "example_gloss": ["Do you know where the station is?", "Do you know how much the ticket costs?", "Do you know when the train leaves?"]}
  ro.a2.unit92.lesson01.teach.gn_unde: {"title": "*Știți* + question word", "gloss": "Do you know where the station is? Do you know how much the ticket costs?", "note": "After *știți unde* or *știți cât* the word order is the same as in the direct question: *unde este gara*, *cât costă biletul*."}
  ro.a2.unit92.lesson01.teach.gn_cand: {"title": "*Când* and *cum*", "gloss": "Do you know when the train leaves? Do you know how I get to the station?", "note": "*Când* asks about time and *cum* about the way. The verb comes after the question word."}
  ro.a2.unit92.lesson02.teach.cuvinte: {"title": "Yes-or-no questions", "gloss": "if, whether / direct / expensive / now / seat, place", "note": "*Dacă* in an indirect question means 'if' or 'whether'. It is used when the answer is yes or no.", "example_gloss": ["I don't know if the train leaves now.", "Do you know if the train is direct?", "I don't know if the ticket is expensive."]}
  ro.a2.unit92.lesson02.teach.gn_nu_stiu: {"title": "*Nu știu dacă*", "gloss": "I don't know if the train leaves now. I don't know if the ticket is expensive.", "note": "*Nu știu dacă* + a statement. *Dacă* means 'if' and the rest is a normal sentence."}
  ro.a2.unit92.lesson02.teach.gn_stiti_daca: {"title": "*Știți dacă*?", "gloss": "Do you know if the train is direct? Do you know if there is a seat?", "note": "For a yes-or-no question use *dacă*. For a question word like *unde* or *cât* use that word instead."}
  ro.a2.unit92.lesson03.teach.cuvinte: {"title": "Asking politely", "gloss": "you can / to tell me / you say / please / the platform", "note": "*Puteți să-mi spuneți* is a very polite way to ask for information. *Vă rog* means 'please'.", "example_gloss": ["Can you tell me how much the ticket costs?", "Can you tell me where the platform is?", "Please, can you tell me how I get to the station?"]}
  ro.a2.unit92.lesson03.teach.gn_puteti: {"title": "*Puteți să-mi spuneți* + question", "gloss": "Can you tell me how much the ticket costs? Can you tell me where the platform is?", "note": "After *Puteți să-mi spuneți* comes the question word and a normal clause: *cât costă biletul*."}
  ro.a2.unit92.lesson03.teach.gn_politete: {"title": "Formal and informal", "gloss": "Please, can you tell me how I get to the station? Can you tell me how I get to the station? (to a friend)", "note": "*Puteți* and *spuneți* are formal (*dumneavoastră*). With a friend use *poți* and *spui*."}
  ro.a2.unit92.lesson04.teach.cuvinte: {"title": "Direct and indirect questions", "gloss": "who / how / the ticket window / I don't know / towards", "note": "A direct question has a question mark and its own word order. An indirect question follows *știți* or *nu știu*.", "example_gloss": ["Where is the ticket window?", "I don't know where the ticket window is.", "Who is coming to the station?"]}
  ro.a2.unit92.lesson04.teach.gn_direct_indirect: {"title": "From direct to indirect", "gloss": "Where is the station? Do you know where the station is? How much does the ticket cost? I don't know how much the ticket costs.", "note": "The word order of the direct question stays the same in the indirect question. You only add *Știți* or *Nu știu* in front."}
  ro.a2.unit92.lesson04.teach.gn_cine: {"title": "Indirect questions about people", "gloss": "Who is coming to the station? I don't know who is coming to the station.", "note": "*Cine* works in the same way. Only the opening changes, not the rest of the clause."}
  ro.a2.unit92.lesson05.teach.cuvinte: {"title": "Words for the messages", "gloss": "I am / I go / I ask / thank you / a lot", "note": "*Întreb* is 'I ask'.", "example_gloss": ["I'm at the station.", "I go to the ticket window.", "I ask at the ticket window."]}
  ro.a2.unit92.lesson05.teach.mesaj_maria: {"title": "Maria writes from the station", "gloss": "Hi, Ana! I'm at the station. I don't know when the train leaves and I don't know how much the ticket costs. I go to the ticket window and ask: Can you tell me how much the ticket costs? Do you know if the train is direct?", "note": "Maria uses *nu știu*, *puteți să-mi spuneți* and *știți dacă* in one message."}
  ro.a2.unit92.lesson05.teach.raspuns_ana: {"title": "Ana answers", "gloss": "Hi, Maria! Well done! I don't know if the train is direct. Ask at the ticket window! Do you know where the ticket window is?", "note": "Ana uses the informal *știi* with her friend."}
  ro.a2.unit92.lesson06.teach.d1: {"title": "Mihai asks about the train", "gloss": "Mihai: Good day! Do you know when the train to Bucharest leaves?"}
  ro.a2.unit92.lesson06.teach.d2: {"title": "The clerk answers", "gloss": "Casiera: The train leaves at ten past ten."}
  ro.a2.unit92.lesson06.teach.d3: {"title": "Mihai asks the price", "gloss": "Mihai: Can you tell me how much the ticket costs?"}
  ro.a2.unit92.lesson06.teach.d4: {"title": "The clerk gives the price", "gloss": "Casiera: It costs forty lei."}
  ro.a2.unit92.lesson06.teach.d5: {"title": "Mihai asks about the train", "gloss": "Mihai: Do you know if the train is direct?"}
  ro.a2.unit92.lesson06.teach.d6: {"title": "The clerk answers", "gloss": "Casiera: Yes, it's direct. Platform two."}
  ro.a2.unit92.lesson06.teach.d7: {"title": "Mihai thanks her", "gloss": "Mihai: Thank you! Now I know where the platform is."}
