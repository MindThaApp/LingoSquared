  ro.a2.unit92.lesson06.exercise03.une_dialog: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Știți când pleacă trenul spre București?", "right": "Do you know when the train to Bucharest leaves?"}, {"left": "Trenul pleacă la zece și zece.", "right": "The train leaves at ten past ten."}, {"left": "Puteți să-mi spuneți cât costă biletul?", "right": "Can you tell me how much the ticket costs?"}, {"left": "Costă patruzeci de lei.", "right": "It costs forty lei."}, {"left": "Știți dacă trenul este direct?", "right": "Do you know if the train is direct?"}, {"left": "Da, este direct.", "right": "Yes, it's direct."}, {"left": "Peronul doi.", "right": "Platform two."}, {"left": "Acum știu unde este peronul.", "right": "Now I know where the platform is."}], "status": "correct"}], "feedback": "These are the lines of the dialogue."}
  ro.a2.unit92.lesson06.exercise04.ordine_pret: {"instruction": "Put the words in order to say 'Can you tell me how much the ticket costs?'", "correct_option": "Puteți să-mi spuneți cât costă biletul", "accepted_answers": [{"value": "Puteți să-mi spuneți cât costă biletul", "status": "correct"}], "feedback": "*Puteți să-mi spuneți cât costă biletul?*"}
  ro.a2.unit92.lesson06.exercise05.raspunde_cand: {"instruction": "Answer in Romanian, as the clerk: say that the train leaves at ten past ten.", "correct_option": "Trenul pleacă la zece și zece.", "accepted_answers": [{"value": "Trenul pleacă la zece și zece.", "status": "correct"}, {"value": "Trenul pleacă la zece și zece", "status": "correct"}, {"value": "Pleacă la zece și zece.", "status": "correct"}, {"value": "Pleacă la zece și zece", "status": "correct"}], "feedback": "*Trenul pleacă la zece și zece.*"}
  ro.a2.unit92.lesson06.exercise06.traduce_direct: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Știți dacă trenul este direct?", "status": "correct"}, {"value": "Știți dacă trenul este direct", "status": "correct"}, {"value": "Știți dacă trenul e direct?", "status": "correct"}, {"value": "Știți dacă trenul e direct", "status": "correct"}], "feedback": "*Știți dacă trenul este direct?*"}
  ro.a2.unit92.lesson06.exercise07.scrie_doua: {"instruction": "Write exactly two sentences. Use *știți unde* in the first and *nu știu dacă* in the second.", "correct_option": "Știți unde este peronul? Nu știu dacă trenul este direct.", "accepted_answers": [{"value": "Știți unde este peronul? Nu știu dacă trenul este direct.", "status": "correct"}, {"value": "Știți unde este peronul? Nu știu dacă trenul este direct", "status": "correct"}, {"value": "Știți unde e peronul? Nu știu dacă trenul e direct.", "status": "correct"}, {"value": "Știți unde e peronul? Nu știu dacă trenul e direct", "status": "correct"}], "feedback": "*Știți unde este peronul? Nu știu dacă trenul este direct.*"}
