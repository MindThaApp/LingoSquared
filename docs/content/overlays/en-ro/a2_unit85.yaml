  ro.a2.unit85.lesson02.exercise07.scrie_repetati: {"instruction": "Write the requested request with *ați putea*.", "correct_option": "Ați putea să repetați, vă rog?", "accepted_answers": [{"value": "Ați putea să repetați, vă rog?", "status": "correct"}, {"value": "Ați putea să repetați, vă rog", "status": "correct"}, {"value": "Ați putea să repetați?", "status": "correct"}, {"value": "Ați putea să repetați", "status": "correct"}], "feedback": "*Ați putea să repetați, vă rog?*"}
