answer_policy:
  diacritics: "Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling."
  capitalization_and_punctuation: "Accept ordinary capitalization differences and omission of the comma, exclamation mark or question mark."
  register: "Polite register in the café: vă rog, ați putea, doriți; informal tu (te rog, ai putea, vrei) with friends. The conditional forms aș vrea / ați putea are taught as set phrases, not as a full conditional tense."
course:
  title: "Romanian A2"
  description: "Intermediate Romanian continuing the Ana and Mihai storyline, with grammar-led units on modal verbs, requests, advice and the future."
  learning_goal: "Order, request and offer things politely in Romanian."
units:
  ro.a2.unit85.la_cafenea: {"title": "At the Café", "description": "Make polite requests and offers at a café with aș vrea, ați putea, ai putea, vă pot ajuta and doriți."}
