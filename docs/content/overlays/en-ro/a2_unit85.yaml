teaching:
  ro.a2.unit85.lesson01.teach.cafenea: {"title": "Ordering", "gloss": "I would like / a coffee / a tea / water / a juice / please (polite)", "note": "*Aș vrea* is a polite way to say what you want. *Vă rog* is 'please' to someone you address politely.", "example_gloss": ["I would like a coffee, please.", "I would like a tea.", "I would like water.", "I would like a juice."]}
  ro.a2.unit85.lesson01.teach.gn_as_vrea: {"title": "*Aș vrea*", "gloss": "I would like a coffee. I would like a tea, please.", "note": "*Aș vrea* + noun is the polite way to order. It stays the same for every drink."}
  ro.a2.unit85.lesson01.teach.gn_vreau: {"title": "*Vreau* and *aș vrea*", "gloss": "I want a coffee. I would like a coffee.", "note": "*Vreau* is direct and fine with friends. In a café or shop *aș vrea* sounds friendlier."}
  ro.a2.unit85.lesson01.teach.gn_as_vrea_sa: {"title": "*Aș vrea să* + verb", "gloss": "I would like to pay. I would like to order.", "note": "After *aș vrea să* the verb has the *eu* form: *plătesc*, *comand*."}
  ro.a2.unit85.lesson02.teach.cereri: {"title": "Polite requests", "gloss": "could you (polite) / you bring / you repeat / the menu / the bill / to me", "note": "*Ați putea* is a polite request. The verb after *să* ends in *-ți* when you address someone politely.", "example_gloss": ["Could you bring me the menu?", "Could you bring me the bill?", "Could you repeat?"]}
  ro.a2.unit85.lesson02.teach.gn_ati_putea: {"title": "*Ați putea să...?*", "gloss": "Could you bring me the bill? Could you repeat?", "note": "*Ați putea să* + verb with *-ți* is the polite request for a stranger, a waiter or several people."}
  ro.a2.unit85.lesson02.teach.gn_ai_putea: {"title": "*Ai putea să...?*", "gloss": "Could you give me the menu? Could you repeat?", "note": "With a friend you say *ai putea* and the verb after *să* has the *tu* form: *dai*, *repeți*."}
  ro.a2.unit85.lesson02.teach.gn_puteti: {"title": "*Puteți* and *poți*", "gloss": "Can you bring me the bill? Can you give me the menu?", "note": "*Puteți* and *poți* are more direct than *ați putea* and *ai putea*, but still polite."}
  ro.a2.unit85.lesson03.teach.oferte: {"title": "Offers", "gloss": "you would like (polite) / to help / anything else / of course", "note": "*Vă* is the polite 'you' before the verb: *vă pot ajuta*.", "example_gloss": ["Can I help you?", "Would you like a coffee?", "Would you like a tea?", "Of course. Anything else?"]}
  ro.a2.unit85.lesson03.teach.gn_oferte: {"title": "Polite offers", "gloss": "Can I help you? Would you like a coffee? Would you like a tea?", "note": "Staff and strangers use *vă pot ajuta*, *doriți* and *ați vrea*."}
  ro.a2.unit85.lesson03.teach.gn_prieteni: {"title": "Offers to a friend", "gloss": "Can I help you? Do you want a coffee? Would you like a tea?", "note": "With a friend *vă* becomes *te*, *doriți* becomes *vrei*, and *ați vrea* becomes *ai vrea*."}
  ro.a2.unit85.lesson03.teach.gn_raspunsuri: {"title": "Answering an offer", "gloss": "Yes, please. No, thank you. You're welcome.", "note": "*Da, vă rog* accepts an offer; *Nu, mulțumesc* declines it."}
  ro.a2.unit85.lesson04.teach.registru: {"title": "Friend or waiter", "gloss": "the friend / the waiter / you give / please (to a friend)", "note": "With a friend use *te rog*; with a waiter use *vă rog*.", "example_gloss": ["Ana talks to her friend.", "Ana talks to the waiter.", "Could you give me water, please?"]}
  ro.a2.unit85.lesson04.teach.gn_chelner: {"title": "Ana and the waiter", "gloss": "Ana talks to the waiter. Could you bring me water, please?", "note": "With a waiter or a stranger: *ați putea*, *aduceți*, *vă rog*."}
  ro.a2.unit85.lesson04.teach.gn_prieten: {"title": "Ana and her friend", "gloss": "Ana talks to her friend. Could you give me water, please?", "note": "With a friend: *ai putea*, *dai*, *te rog*."}
  ro.a2.unit85.lesson04.teach.gn_perechi: {"title": "Matching pairs", "gloss": "Ai putea or ați putea. Vrei or doriți. Te rog or vă rog.", "note": "The first form of each pair is for a friend and the second for a stranger or staff."}
  ro.a2.unit85.lesson05.teach.cuvinte: {"title": "Café words", "gloss": "café / good day / or / thank you", "note": "*Sau* ('or') joins two choices.", "example_gloss": ["Ana is at the café.", "Good day!", "Would you like a tea or a coffee?"]}
  ro.a2.unit85.lesson05.teach.comanda: {"title": "Ana's order", "gloss": "Ana is at the café. I would like a tea, please. Could you bring me water too? Thank you!", "note": "Ana asks politely with *aș vrea* and *ați putea*."}
  ro.a2.unit85.lesson05.teach.meniu: {"title": "The waiter's card", "gloss": "Good day! Can I help you? Would you like the menu? Would you like a tea or a coffee?", "note": "The waiter offers with *vă pot ajuta*, *doriți* and *ați vrea*."}
  ro.a2.unit85.lesson06.teach.d1: {"title": "The waiter greets Ana", "gloss": "Waiter: Good day! Can I help you?"}
  ro.a2.unit85.lesson06.teach.d2: {"title": "Ana orders", "gloss": "Ana: Good day! I would like a tea, please."}
  ro.a2.unit85.lesson06.teach.d3: {"title": "The waiter offers water", "gloss": "Waiter: Of course. Would you like water too?"}
  ro.a2.unit85.lesson06.teach.d4: {"title": "Ana asks for water", "gloss": "Ana: Yes, could you bring me water too?"}
  ro.a2.unit85.lesson06.teach.d5: {"title": "The waiter asks if she wants more", "gloss": "Waiter: Certainly. Anything else?"}
  ro.a2.unit85.lesson06.teach.d6: {"title": "Ana declines", "gloss": "Ana: No, thank you."}
  ro.a2.unit85.lesson06.teach.d7: {"title": "The waiter answers", "gloss": "Waiter: You're welcome!"}
