  ro.a2.unit85.lesson01.exercise03.une_comanda: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Aș vrea...", "right": "I would like..."}, {"left": "Vreau...", "right": "I want... (direct)"}, {"left": "vă rog", "right": "please (polite)"}, {"left": "un ceai", "right": "a tea"}, {"left": "o cafea", "right": "a coffee"}, {"left": "apă", "right": "water"}, {"left": "un suc", "right": "a juice"}, {"left": "Aș vrea să plătesc.", "right": "I would like to pay."}], "status": "correct"}], "feedback": "These are the ordering words of the lesson."}
