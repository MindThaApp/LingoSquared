  ro.a2.unit85.lesson02.exercise03.une_cereri: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Ați putea...?", "right": "Could you...? (polite)"}, {"left": "Ai putea...?", "right": "Could you...? (friend)"}, {"left": "Puteți să...?", "right": "Can you...? (polite)"}, {"left": "Poți să...?", "right": "Can you...? (friend)"}, {"left": "meniul", "right": "the menu"}, {"left": "nota", "right": "the bill"}, {"left": "aduceți", "right": "you bring (polite)"}, {"left": "repetați", "right": "you repeat (polite)"}], "status": "correct"}], "feedback": "These are the request patterns of the lesson."}
