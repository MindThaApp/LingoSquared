  ro.a2.unit85.lesson01.exercise06.traduce_cafea: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Aș vrea o cafea, vă rog.", "status": "correct"}, {"value": "Aș vrea o cafea, vă rog", "status": "correct"}, {"value": "Aș vrea o cafea, te rog.", "status": "correct"}, {"value": "Aș vrea o cafea, te rog", "status": "correct"}, {"value": "Vă rog, aș vrea o cafea.", "status": "correct"}, {"value": "Vă rog, aș vrea o cafea", "status": "correct"}], "feedback": "*Aș vrea o cafea, vă rog.*"}
