  ro.a2.unit85.lesson04.exercise03.une_registru: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "te rog", "right": "please (to a friend)"}, {"left": "vă rog", "right": "please (to a stranger)"}, {"left": "Vrei...?", "right": "Do you want...? (friend)"}, {"left": "Doriți...?", "right": "Would you like...? (stranger)"}, {"left": "Te pot ajuta?", "right": "Can I help you? (friend)"}, {"left": "Vă pot ajuta?", "right": "Can I help you? (stranger)"}, {"left": "Ai putea...?", "right": "Could you...? (friend)"}, {"left": "Ați putea...?", "right": "Could you...? (stranger)"}], "status": "correct"}], "feedback": "Each pair has a form for a friend and a form for a stranger."}
