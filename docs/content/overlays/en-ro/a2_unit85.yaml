  ro.a2.unit85.lesson03.exercise07.scrie_ati_vrea: {"instruction": "Write the requested offer with *ați vrea*.", "correct_option": "Ați vrea un ceai?", "accepted_answers": [{"value": "Ați vrea un ceai?", "status": "correct"}, {"value": "Ați vrea un ceai", "status": "correct"}], "feedback": "*Ați vrea un ceai?*"}
  ro.a2.unit85.lesson04.exercise01.alege_chelner: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Ați putea să îmi aduceți apă?", "distractors": ["Ai putea să îmi aduci apă?", "Poți să îmi aduci apă?", "Vreau apă."], "accepted_answers": [{"value": "Ați putea să îmi aduceți apă?", "status": "correct"}], "feedback": "A waiter is addressed politely: *Ați putea să îmi aduceți apă?*"}
