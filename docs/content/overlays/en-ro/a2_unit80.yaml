teaching:
  ro.a2.unit80.lesson01.teach.locuri: {"title": "Places and ever", "gloss": "ever / to the seaside / to the mountains / Brașov / Cluj / the sea", "note": "These are the words for the places and for *vreodată* ('ever'), which is used in questions about your life so far.", "example_gloss": ["Have you ever been to the seaside?", "Have you ever been to the mountains?", "Have you ever been to Brașov?", "Have you ever been to Cluj?"]}
  ro.a2.unit80.lesson01.teach.mancare: {"title": "Foods", "gloss": "cabbage rolls / fried cheese doughnuts with jam / polenta / sushi", "note": "*Sarmale*, *papanași* and *mămăligă* are traditional Romanian foods.", "example_gloss": ["Have you ever eaten sarmale?", "Have you ever tried papanași?", "Have you ever eaten mămăligă?", "Have you ever tried sushi?"]}
  ro.a2.unit80.lesson01.teach.gn_participii: {"title": "The participle after *am*", "gloss": "to be, been. to see, seen. to eat, eaten. to try, tried.", "note": "The perfect compus is *a avea* in the present plus a participle: *am fost*, *ai fost*, *am văzut*. The verb *a fi* uses *a avea* as its helper too: *ai fost* means 'you have been'. *Fost* and *văzut* are irregular; *mâncat* and *încercat* are regular (-a verbs end in -at)."}
  ro.a2.unit80.lesson01.teach.gn_intrebare: {"title": "Questions with *vreodată*", "gloss": "Have you ever been to Brașov? Have you ever seen the sea? Have you ever eaten sarmale? Have you ever tried papanași?", "note": "*Vreodată* means 'ever' and sits right after the helper *ai*. The pattern is *Ai* + *vreodată* + participle, or *Ai* + participle + *vreodată*; the first is the most common."}
  ro.a2.unit80.lesson01.teach.raspunsuri: {"title": "Short answers", "gloss": "Yes, I have (been). Yes, I have seen the sea. Yes, I have eaten sarmale."}
  ro.a2.unit80.lesson02.teach.cuvinte: {"title": "Never and more places", "gloss": "never / Sibiu / to the theatre / not", "note": "*Niciodată* means 'never'. In Romanian it is used together with *nu*.", "example_gloss": ["I have never been to Sibiu.", "I have never been to the theatre.", "I have never eaten sushi.", "I have never tried mămăligă."]}
  ro.a2.unit80.lesson02.teach.gn_dubla: {"title": "Double negative: *nu ... niciodată*", "gloss": "I have never seen the sea. I have never been to Cluj. I have never eaten sushi.", "note": "Romanian needs both *nu* before the verb and *niciodată*. Unlike in English, the double negative is correct and required: *Nu am văzut niciodată marea*, never *Am văzut niciodată marea*."}
  ro.a2.unit80.lesson02.teach.gn_raspunsuri: {"title": "Short answers", "gloss": "Yes, I have. No, never. No, I have never been.", "note": "A short *Da* answer repeats the helper and participle (*Da, am fost*). A short *Nu* answer can be just *Nu, niciodată*, or a full sentence with *nu ... niciodată*."}
  ro.a2.unit80.lesson02.teach.intrebari: {"title": "Question and answers", "gloss": "Have you ever been to Sibiu? Yes, I have. No, never."}
  ro.a2.unit80.lesson03.teach.cuvinte: {"title": "Already and not yet", "gloss": "already / not yet / the film / the coffee / drunk", "note": "*Deja* means 'already' and *încă nu* means 'not yet'. *Băut* is the participle of *a bea*.", "example_gloss": ["I have already seen the film.", "I haven't seen the film yet.", "I have already drunk the coffee.", "I haven't drunk the coffee yet."]}
  ro.a2.unit80.lesson03.teach.gn_deja: {"title": "*Deja*: already", "gloss": "I have already been to Brașov. Have you eaten already? Yes, I have already eaten.", "note": "*Deja* goes right after the helper and before or after the participle: *am mâncat deja* is the most natural order, and *deja am mâncat* is also possible when you want to stress it. It is used in statements and in questions."}
  ro.a2.unit80.lesson03.teach.gn_inca_nu: {"title": "*Încă nu*: not yet", "gloss": "I have not been to Brașov yet. I have not eaten yet. I have not eaten yet.", "note": "*Încă nu* comes before the helper: *Încă nu am mâncat*. You can also say *Nu am mâncat încă*. Both mean 'not yet' and imply that you will do it later."}
  ro.a2.unit80.lesson03.teach.gn_contrast: {"title": "Already, not yet, never", "gloss": "I have already seen the film. I haven't seen the film yet. I have never seen the film.", "note": "*Deja* means it is done. *Încă nu* means it is not done yet but may happen. *Niciodată* means it has never happened in your life."}
  ro.a2.unit80.lesson03.teach.intrebari: {"title": "Question and answers", "gloss": "Have you drunk the coffee already? No, not yet. Yes, I already have."}
  ro.a2.unit80.lesson04.teach.cuvinte: {"title": "How many times", "gloss": "once / twice / three times / many times / how many times", "note": "*O dată* is 'once'. *De două ori* is 'twice' and *de multe ori* is 'many times'.", "example_gloss": ["I have been to Cluj once.", "I have been to Brașov twice.", "I have eaten sarmale three times.", "I have seen the sea many times."]}
  ro.a2.unit80.lesson04.teach.gn_cate_ori: {"title": "How many times?", "gloss": "How many times have you been to Brașov? I have been twice.", "note": "*Câte ori* asks 'how many times'. The answer uses *de* + number + *ori* (*de două ori*, *de trei ori*), but 'once' is *o dată*."}
  ro.a2.unit80.lesson04.teach.gn_raspunsuri: {"title": "Answers with a number", "gloss": "Yes, I have been twice. Yes, I have been once. No, never.", "note": "A fuller answer adds how many times: *Da, am fost de două ori*. Remember the sequence: *niciodată* (0), *o dată* (1), *de două ori* (2), *de multe ori* (many)."}
  ro.a2.unit80.lesson04.teach.gn_ordine: {"title": "Where the number goes", "gloss": "I have been to Brașov once. I have been to the seaside many times. I have seen the film twice.", "note": "The number phrase can come after the object or right after the participle: *Am fost la Brașov de două ori* and *Am fost de două ori la Brașov* are both natural."}
  ro.a2.unit80.lesson05.teach.cuvinte: {"title": "Words for the message", "gloss": "message / places / and you", "note": "*Și tu?* is a short way to ask the other person the same question.", "example_gloss": ["Maria writes a message.", "Maria writes about places.", "I have been to Cluj. And you?"]}
  ro.a2.unit80.lesson05.teach.gn_recapitulare: {"title": "Already, not yet, never", "gloss": "I have already been to Brașov. I haven't been to Cluj yet. I have never been to the mountains.", "note": "Maria's message uses all three: *deja* (done), *încă nu* (not yet) and *niciodată* (never in her life)."}
  ro.a2.unit80.lesson05.teach.intrebari: {"title": "Questions for the reader", "gloss": "Have you ever been to Cluj? How many times have you been to Brașov?"}
  ro.a2.unit80.lesson05.teach.lectura: {"title": "Maria writes to Ana", "gloss": "Hi, Ana! I have already been to Brașov twice. I have seen the sea once. I haven't been to Cluj yet. I have never been to the mountains. I have eaten sarmale, papanași and mămăligă many times, but I have never tried sushi. And you? Have you ever been to Cluj?", "note": "Notice how Maria uses *deja*, *încă nu*, *niciodată* and the number phrases to tell her experiences.", "glosses": {"munte": "mountains", "mămăligă": "polenta"}}
  ro.a2.unit80.lesson06.teach.d1: {"title": "Ana asks", "gloss": "Ana: Hi, Mihai! Have you ever been to the seaside?"}
  ro.a2.unit80.lesson06.teach.d2: {"title": "Mihai answers", "gloss": "Mihai: Yes, I have been twice. But I haven't been to the mountains yet."}
  ro.a2.unit80.lesson06.teach.d3: {"title": "Ana answers", "gloss": "Ana: I have been to the mountains once, but I have never been to the seaside."}
  ro.a2.unit80.lesson06.teach.d4: {"title": "Mihai asks about food", "gloss": "Mihai: Have you eaten papanași already?"}
  ro.a2.unit80.lesson06.teach.d5: {"title": "Ana answers about food", "gloss": "Ana: No, I haven't eaten them yet. But I have eaten sarmale many times."}
  ro.a2.unit80.lesson06.teach.d6: {"title": "Mihai asks again", "gloss": "Mihai: Have you ever tried mămăligă?"}
  ro.a2.unit80.lesson06.teach.d7: {"title": "Ana's last answer", "gloss": "Ana: Yes, I have tried it once."}
exercises:
  ro.a2.unit80.lesson01.exercise01.alege_brasov: {"instruction": "Choose the correct Romanian question.", "correct_option": "Ai fost vreodată la Brașov?", "distractors": ["Ai fi vreodată la Brașov?", "Am fost vreodată la Brașov?", "Fost ai vreodată la Brașov?"], "accepted_answers": [{"value": "Ai fost vreodată la Brașov?", "status": "correct"}], "feedback": "With *tu* the helper is *ai*, and the participle of *a fi* is *fost*."}
  ro.a2.unit80.lesson01.exercise02.alege_sarmale: {"instruction": "Choose the correct Romanian question.", "correct_option": "Ai mâncat vreodată sarmale?", "distractors": ["Ai mânca vreodată sarmale?", "Am mâncat vreodată sarmale?", "Ai mâncând vreodată sarmale?"], "accepted_answers": [{"value": "Ai mâncat vreodată sarmale?", "status": "correct"}], "feedback": "*A mânca* gives the participle *mâncat*, and *tu* goes with *ai*."}
  ro.a2.unit80.lesson01.exercise03.une_cuvinte: {"instruction": "Match each Romanian word to its meaning.", "accepted_answers": [{"value": [{"left": "fost", "right": "been"}, {"left": "văzut", "right": "seen"}, {"left": "mâncat", "right": "eaten"}, {"left": "încercat", "right": "tried"}, {"left": "vreodată", "right": "ever"}, {"left": "marea", "right": "the sea"}, {"left": "sarmale", "right": "cabbage rolls"}, {"left": "papanași", "right": "fried cheese doughnuts"}], "status": "correct"}], "feedback": "These are the words of the unit's first question pattern."}
  ro.a2.unit80.lesson01.exercise04.ordine_marea: {"instruction": "Put the words in order to ask 'Have you ever seen the sea?'", "correct_option": "Ai văzut vreodată marea", "accepted_answers": [{"value": "Ai văzut vreodată marea", "status": "correct"}, {"value": "Ai văzut marea vreodată", "status": "correct"}], "feedback": "*Ai văzut vreodată marea?*: helper, *vreodată*, participle, object."}
  ro.a2.unit80.lesson01.exercise05.completeaza_fost: {"instruction": "Complete with the participle of *a fi*.", "correct_option": "fost", "accepted_answers": [{"value": "fost", "status": "correct"}], "feedback": "*Ai fost vreodată la Cluj?*: the participle of *a fi* is *fost*."}
  ro.a2.unit80.lesson01.exercise06.traduce_papanasi: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Ai încercat vreodată papanași?", "status": "correct"}, {"value": "Ai încercat vreodată papanași", "status": "correct"}, {"value": "Ai încercat papanași vreodată?", "status": "correct"}, {"value": "Ai încercat papanași vreodată", "status": "correct"}], "feedback": "*Ai încercat vreodată papanași?* = Have you ever tried papanași?"}
  ro.a2.unit80.lesson01.exercise07.scrie_marea: {"instruction": "Write the requested Romanian question with *vreodată*.", "accepted_answers": [{"value": "Ai văzut vreodată marea?", "status": "correct"}, {"value": "Ai văzut vreodată marea", "status": "correct"}, {"value": "Ai văzut marea vreodată?", "status": "correct"}, {"value": "Ai văzut marea vreodată", "status": "correct"}], "feedback": "*Ai văzut vreodată marea?*", "correct_option": "Ai văzut vreodată marea?"}
  ro.a2.unit80.lesson02.exercise01.alege_nu_niciodata: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Nu am văzut niciodată marea.", "distractors": ["Am văzut niciodată marea.", "Nu ai văzut niciodată marea.", "Nu văzut niciodată marea."], "accepted_answers": [{"value": "Nu am văzut niciodată marea.", "status": "correct"}], "feedback": "You need *nu* and the helper *am*: *Nu am văzut niciodată marea*."}
  ro.a2.unit80.lesson02.exercise02.alege_raspuns: {"instruction": "Choose the Romanian for: 'No, never.'", "correct_option": "Nu, niciodată.", "distractors": ["Nu, vreodată.", "Da, niciodată.", "Da, am fost."], "accepted_answers": [{"value": "Nu, niciodată.", "status": "correct"}], "feedback": "The short answer is *Nu, niciodată*. *Vreodată* is only for questions."}
  ro.a2.unit80.lesson02.exercise03.une_propozitii: {"instruction": "Match each Romanian sentence to its meaning.", "accepted_answers": [{"value": [{"left": "Nu am fost niciodată la Cluj.", "right": "I have never been to Cluj."}, {"left": "Nu am fost niciodată la Sibiu.", "right": "I have never been to Sibiu."}, {"left": "Nu am văzut niciodată marea.", "right": "I have never seen the sea."}, {"left": "Nu am mâncat niciodată sushi.", "right": "I have never eaten sushi."}, {"left": "Nu am încercat niciodată mămăligă.", "right": "I have never tried mămăligă."}, {"left": "Nu am fost niciodată la teatru.", "right": "I have never been to the theatre."}, {"left": "Ai fost vreodată la Sibiu?", "right": "Have you ever been to Sibiu?"}, {"left": "Nu, niciodată.", "right": "No, never."}], "status": "correct"}], "feedback": "Each sentence uses *nu ... niciodată* or the question with *vreodată*."}
  ro.a2.unit80.lesson02.exercise04.ordine_sushi: {"instruction": "Put the words in order to say 'I have never eaten sushi.'", "correct_option": "Nu am mâncat niciodată sushi", "accepted_answers": [{"value": "Nu am mâncat niciodată sushi", "status": "correct"}, {"value": "Nu am mâncat sushi niciodată", "status": "correct"}, {"value": "Niciodată nu am mâncat sushi", "status": "correct"}], "feedback": "*Nu am mâncat niciodată sushi*: *nu*, helper, participle, *niciodată*."}
  ro.a2.unit80.lesson02.exercise05.completeaza_niciodata: {"instruction": "Complete with the Romanian word for 'never'.", "correct_option": "niciodată", "accepted_answers": [{"value": "niciodată", "status": "correct"}], "feedback": "*Nu am fost niciodată la teatru* = I have never been to the theatre."}
  ro.a2.unit80.lesson02.exercise06.traduce_sushi: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Nu am încercat niciodată sushi.", "status": "correct"}, {"value": "Nu am încercat niciodată sushi", "status": "correct"}, {"value": "Nu am încercat sushi niciodată.", "status": "correct"}, {"value": "Nu am încercat sushi niciodată", "status": "correct"}, {"value": "Niciodată nu am încercat sushi.", "status": "correct"}, {"value": "Niciodată nu am încercat sushi", "status": "correct"}, {"value": "Eu nu am încercat niciodată sushi.", "status": "correct"}, {"value": "Eu nu am încercat niciodată sushi", "status": "correct"}], "feedback": "*Nu am încercat niciodată sushi* = I have never tried sushi."}
  ro.a2.unit80.lesson02.exercise07.scrie_sibiu: {"instruction": "Write the requested Romanian answer with *nu ... niciodată*. Start with *Nu*.", "accepted_answers": [{"value": "Nu, nu am fost niciodată la Sibiu.", "status": "correct"}, {"value": "Nu, n-am fost niciodată la Sibiu.", "status": "correct"}, {"value": "Nu, n-am fost la Sibiu niciodată.", "status": "correct"}, {"value": "Nu, nu am fost niciodată la Sibiu", "status": "correct"}, {"value": "Nu, n-am fost niciodată la Sibiu", "status": "correct"}, {"value": "Nu, n-am fost la Sibiu niciodată", "status": "correct"}, {"value": "Nu, nu am fost la Sibiu niciodată.", "status": "correct"}, {"value": "Nu, nu am fost la Sibiu niciodată", "status": "correct"}, {"value": "Nu, niciodată nu am fost la Sibiu.", "status": "correct"}, {"value": "Nu, niciodată nu am fost la Sibiu", "status": "correct"}], "feedback": "*Nu, nu am fost niciodată la Sibiu.*", "correct_option": "Nu, nu am fost niciodată la Sibiu."}
  ro.a2.unit80.lesson03.exercise01.alege_deja: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Am mâncat deja.", "distractors": ["Încă nu am mâncat.", "Nu am mâncat niciodată.", "Ai mâncat deja?"], "accepted_answers": [{"value": "Am mâncat deja.", "status": "correct"}], "feedback": "*Deja* means 'already': the action is done."}
  ro.a2.unit80.lesson03.exercise02.alege_inca_nu: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Încă nu am văzut filmul.", "distractors": ["Am văzut deja filmul.", "Nu am văzut niciodată filmul.", "Am văzut încă filmul."], "accepted_answers": [{"value": "Încă nu am văzut filmul.", "status": "correct"}], "feedback": "*Încă nu* means 'not yet'."}
  ro.a2.unit80.lesson03.exercise03.une_contrast: {"instruction": "Match each Romanian word or sentence to its meaning.", "accepted_answers": [{"value": [{"left": "deja", "right": "already"}, {"left": "încă nu", "right": "not yet"}, {"left": "niciodată", "right": "never"}, {"left": "vreodată", "right": "ever"}, {"left": "Am mâncat deja.", "right": "I have already eaten."}, {"left": "Încă nu am mâncat.", "right": "I haven't eaten yet."}, {"left": "Am văzut deja filmul.", "right": "I have already seen the film."}, {"left": "Încă nu am băut cafeaua.", "right": "I haven't drunk the coffee yet."}], "status": "correct"}], "feedback": "These words tell you whether something is done, not yet done, or never done."}
  ro.a2.unit80.lesson03.exercise04.ordine_cafeaua: {"instruction": "Put the words in order to ask 'Have you drunk the coffee already?'", "correct_option": "Ai băut deja cafeaua", "accepted_answers": [{"value": "Ai băut deja cafeaua", "status": "correct"}, {"value": "Ai băut cafeaua deja", "status": "correct"}], "feedback": "*Ai băut deja cafeaua?*: helper, participle, *deja*."}
  ro.a2.unit80.lesson03.exercise05.completeaza_deja: {"instruction": "Complete with the Romanian word for 'already'.", "correct_option": "deja", "accepted_answers": [{"value": "deja", "status": "correct"}], "feedback": "*Am văzut deja filmul* = I have already seen the film."}
  ro.a2.unit80.lesson03.exercise06.traduce_inca_nu: {"instruction": "Translate into Romanian using *încă*.", "accepted_answers": [{"value": "Încă nu am băut cafeaua.", "status": "correct"}, {"value": "Încă nu am băut cafeaua", "status": "correct"}, {"value": "Nu am băut încă cafeaua.", "status": "correct"}, {"value": "Nu am băut încă cafeaua", "status": "correct"}, {"value": "Nu am băut cafeaua încă.", "status": "correct"}, {"value": "Nu am băut cafeaua încă", "status": "correct"}, {"value": "Eu încă nu am băut cafeaua.", "status": "correct"}, {"value": "Eu încă nu am băut cafeaua", "status": "correct"}], "feedback": "*Încă nu am băut cafeaua* = I haven't drunk the coffee yet."}
  ro.a2.unit80.lesson03.exercise07.scrie_deja: {"instruction": "Write the requested Romanian answer with *deja*.", "accepted_answers": [{"value": "Da, am văzut deja filmul.", "status": "correct"}, {"value": "Da, am văzut deja filmul", "status": "correct"}, {"value": "Da, am văzut filmul deja.", "status": "correct"}, {"value": "Da, am văzut filmul deja", "status": "correct"}, {"value": "Da, eu am văzut deja filmul.", "status": "correct"}, {"value": "Da, eu am văzut deja filmul", "status": "correct"}, {"value": "Da, deja am văzut filmul.", "status": "correct"}, {"value": "Da, deja am văzut filmul", "status": "correct"}], "feedback": "*Da, am văzut deja filmul.*", "correct_option": "Da, am văzut deja filmul."}
  ro.a2.unit80.lesson04.exercise01.alege_de_doua_ori: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Am fost de două ori la Brașov.", "distractors": ["Am fost o dată la Brașov.", "Am fost de multe ori la Brașov.", "Nu am fost niciodată la Brașov."], "accepted_answers": [{"value": "Am fost de două ori la Brașov.", "status": "correct"}], "feedback": "*De două ori* means 'twice'."}
  ro.a2.unit80.lesson04.exercise02.alege_cate_ori: {"instruction": "Choose the correct Romanian question.", "correct_option": "Câte ori ai fost la Cluj?", "distractors": ["Ai fost vreodată la Cluj?", "Câte ori am fost la Cluj?", "Unde ai fost la Cluj?"], "accepted_answers": [{"value": "Câte ori ai fost la Cluj?", "status": "correct"}], "feedback": "*Câte ori ai fost...?* asks about the number of times."}
  ro.a2.unit80.lesson04.exercise03.une_frecventa: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "niciodată", "right": "never"}, {"left": "o dată", "right": "once"}, {"left": "de două ori", "right": "twice"}, {"left": "de trei ori", "right": "three times"}, {"left": "de multe ori", "right": "many times"}, {"left": "deja", "right": "already"}, {"left": "încă nu", "right": "not yet"}, {"left": "Câte ori?", "right": "How many times?"}], "status": "correct"}], "feedback": "These expressions tell how often something has happened."}
