answer_policy:
  diacritics: "Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings; accept a variant without diacritics when every other letter and word is correct, but do not accept legacy cedilla ş/ţ as the displayed form."
  capitalization_and_punctuation: "Accept ordinary capitalization differences and omission of the final period, question mark or exclamation mark. Preserve capitals in personal and place names."
  register: "Informal tu register throughout. The perfect compus (am + participle) is the taught tense."
course:
  title: "Romanian A2"
  description: "Intermediate Romanian continuing the Ana and Mihai storyline, now with a grammar-led block on talking about the past."
  learning_goal: "Talk about the past in Romanian with the right tense for each situation."
units:
  ro.a2.unit80.ai_fost_vreodata: {"title": "Have You Ever Been?", "description": "Ask and say what you have or have never done, and what you have already done or not yet, using the perfect compus with vreodată, niciodată, deja and încă nu."}
lessons:
  ro.a2.unit80.lesson01.ai_vazut_marea: {"title": "Have You Ever Been?"}
  ro.a2.unit80.lesson02.nu_am_fost_niciodata: {"title": "I Have Never Been"}
  ro.a2.unit80.lesson03.deja_sau_inca_nu: {"title": "Already or Not Yet?"}
  ro.a2.unit80.lesson04.de_cate_ori: {"title": "How Many Times?"}
  ro.a2.unit80.lesson05.mesajul_mariei: {"title": "Maria's Message"}
