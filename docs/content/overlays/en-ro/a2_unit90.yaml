  ro.a2.unit90.lesson02.exercise07.scrie_ca_sa: {"instruction": "Write the requested sentence with *ca să*.", "correct_option": "Merg la piață ca să cumpăr fructe.", "accepted_answers": [{"value": "Merg la piață ca să cumpăr fructe.", "status": "correct"}, {"value": "Merg la piață ca să cumpăr fructe", "status": "correct"}], "feedback": "*Merg la piață ca să cumpăr fructe.*"}
  ro.a2.unit90.lesson03.exercise01.alege_ca_sa_nu: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Ies devreme ca să nu întârzii.", "distractors": ["Ies devreme ca nu să întârzii.", "Ies devreme ca să întârzii nu.", "Ies devreme nu ca să întârzii."], "accepted_answers": [{"value": "Ies devreme ca să nu întârzii.", "status": "correct"}], "feedback": "The negation comes after *ca să*: *ca să nu*."}
