  ro.a2.unit90.lesson01.exercise06.traduce_romana: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Învăț româna ca să vorbesc cu prietenii.", "status": "correct"}, {"value": "Învăț româna ca să vorbesc cu prietenii", "status": "correct"}, {"value": "Învăț româna ca să vorbesc cu prietenii mei.", "status": "correct"}, {"value": "Învăț româna ca să vorbesc cu prietenii mei", "status": "correct"}], "feedback": "*Învăț româna ca să vorbesc cu prietenii.*"}
