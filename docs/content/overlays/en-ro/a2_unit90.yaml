  ro.a2.unit90.lesson02.exercise01.alege_de_ce: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "De ce înveți româna? Ca să vorbesc cu prietenii.", "distractors": ["De ce înveți româna? Ca să vorbesc prietenii.", "De ce înveți româna? Ca vorbesc cu prietenii.", "De ce înveți româna? Ca să vorbești cu prietenii."], "accepted_answers": [{"value": "De ce înveți româna? Ca să vorbesc cu prietenii.", "status": "correct"}], "feedback": "A short answer to *de ce?* can start with *ca să*."}
  ro.a2.unit90.lesson02.exercise02.alege_cauza: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Merg la piață pentru că nu am fructe.", "distractors": ["Merg la piață ca să nu am fructe.", "Merg la piață ca nu am fructe.", "Merg la piață, așa că nu am fructe."], "accepted_answers": [{"value": "Merg la piață pentru că nu am fructe.", "status": "correct"}], "feedback": "*Pentru că nu am fructe* is a reason, a fact."}
