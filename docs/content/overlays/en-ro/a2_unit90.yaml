teaching:
  ro.a2.unit90.lesson01.teach.cuvinte: {"title": "Saying what you do something for", "gloss": "in order to / market / I buy / fruit / I learn", "note": "*Ca să* + verb gives the purpose of an action. The verb is in the *să* form, the same as the present for *eu*.", "example_gloss": ["I go to the market to buy fruit.", "I learn Romanian to talk to my friends.", "I take the train to arrive on time.", "Mihai goes to the market to buy fruit."]}
  ro.a2.unit90.lesson01.teach.gn_ca_sa: {"title": "*Ca să* + verb", "gloss": "I go to the market to buy fruit. I learn Romanian to talk to my friends.", "note": "After *ca să* the verb has the *să* form: *cumpăr*, *vorbesc*. It answers 'what for?'."}
  ro.a2.unit90.lesson01.teach.gn_el_ea: {"title": "With *el* and *ea*", "gloss": "Mihai goes to the market to buy fruit. Ana learns in order to speak.", "note": "For *el* and *ea* the verb after *ca să* changes: *cumpere*, *vorbească*. This is the same *să* form as after *înainte să*."}
  ro.a2.unit90.lesson02.teach.cuvinte: {"title": "Asking what for", "gloss": "why / in order to / I speak / you learn / something", "note": "*De ce?* can be answered with a reason (*pentru că*) or with a purpose (*ca să*).", "example_gloss": ["Why do you learn Romanian?", "To talk to my friends.", "Why do you go to the market?", "Because I have no fruit."]}
  ro.a2.unit90.lesson02.teach.gn_de_ce: {"title": "Answering with *ca să*", "gloss": "Why do you go to the market? To buy fruit.", "note": "The answer can be only the *ca să* part. It says what you want to achieve."}
  ro.a2.unit90.lesson02.teach.gn_contrast: {"title": "Reason or purpose", "gloss": "I go to the market because I have no fruit. I go to the market to buy fruit.", "note": "*Pentru că* gives the cause, a fact that already exists. *Ca să* gives the goal, what you want to do."}
  ro.a2.unit90.lesson03.teach.cuvinte: {"title": "Avoiding something", "gloss": "so that not / I go out / quickly / I write / I forget", "note": "*Ca să nu* + verb says what you want to avoid. The negation *nu* comes after *ca să*.", "example_gloss": ["I leave early so that I won't be late.", "I write the list so that I don't forget.", "I take the bus to arrive quickly."]}
  ro.a2.unit90.lesson03.teach.gn_ca_sa_nu: {"title": "*Ca să nu* + verb", "gloss": "I leave early so that I won't be late. I write the list so that I don't forget.", "note": "*Ca să nu* is used to prevent a problem: being late, forgetting. Compare the positive *ca să ajung* with the negative *ca să nu întârzii*."}
  ro.a2.unit90.lesson03.teach.gn_comparatie: {"title": "Positive and negative", "gloss": "I take the bus to arrive quickly. I leave early so that I won't be late.", "note": "Positive purpose: *ca să* + verb. Negative purpose: *ca să nu* + verb."}
  ro.a2.unit90.lesson04.teach.cuvinte: {"title": "Doing something so that you can", "gloss": "I write to you / I give you / the money / the key / you know", "note": "*Îți* means 'to you'. *Banii* is 'the money'; *cheia* is 'the key'.", "example_gloss": ["I write you the list so that you know.", "I give you the money so that you can pay.", "I give you the key so that you can get in."]}
  ro.a2.unit90.lesson04.teach.gn_alt: {"title": "A different person after *ca să*", "gloss": "I write you the list so that you know. I give you the money so that you can pay.", "note": "The person after *ca să* can differ from the person in the main clause. The *să* form shows who: *ca să știi*, *ca să plătești*."}
  ro.a2.unit90.lesson04.teach.gn_cheia: {"title": "More examples", "gloss": "I give you the key so that you can get in. Ana gives me the list so that I can buy fruit.", "note": "*Îmi* is 'to me' and *îți* is 'to you'. The *să* form agrees with the person who will act."}
  ro.a2.unit90.lesson05.teach.cuvinte: {"title": "Words for the messages", "gloss": "Saturday / bus / bread / milk / thank you", "note": "*Sâmbătă* without a preposition means 'on Saturday'.", "example_gloss": ["On Saturday I go to the market.", "I take the bus.", "I buy bread and milk."]}
  ro.a2.unit90.lesson05.teach.mesaj_mihai: {"title": "Mihai writes to Ana", "gloss": "Hi, Ana! On Saturday I go to the market to buy fruit. I take the bus to arrive quickly. I write a list so that I don't forget. Do you want something?", "note": "Mihai uses *ca să* and *ca să nu* in a short message."}
  ro.a2.unit90.lesson05.teach.raspuns_ana: {"title": "Ana answers", "gloss": "Hi, Mihai! Yes, bread and milk. I give you the money so that you can pay. I stay home to work. Thank you!", "note": "Ana uses *ca să* with a different person (*îți dau banii ca să plătești*)."}
  ro.a2.unit90.lesson06.teach.d1: {"title": "Ana asks why", "gloss": "Ana: Mihai, why are you going to the market?"}
  ro.a2.unit90.lesson06.teach.d2: {"title": "Mihai answers", "gloss": "Mihai: To buy fruit. Do you want something?"}
  ro.a2.unit90.lesson06.teach.d3: {"title": "Ana writes a list", "gloss": "Ana: Yes, bread. I'll write you the list so that you don't forget."}
  ro.a2.unit90.lesson06.teach.d4: {"title": "Mihai takes the bus", "gloss": "Mihai: Thank you. I take the bus to arrive quickly."}
  ro.a2.unit90.lesson06.teach.d5: {"title": "Ana gives money", "gloss": "Ana: Good. I'll give you the money so that you can pay."}
  ro.a2.unit90.lesson06.teach.d6: {"title": "Mihai leaves", "gloss": "Mihai: No need! I'm going out now so that I won't be late."}
  ro.a2.unit90.lesson06.teach.d7: {"title": "Ana says goodbye", "gloss": "Ana: Then bye! I'll call you tonight so that we can talk."}
