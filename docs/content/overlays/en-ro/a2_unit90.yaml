  ro.a2.unit90.lesson01.exercise02.alege_mihai: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Mihai merge la piață ca să cumpere fructe.", "distractors": ["Mihai merge la piață ca să cumpăr fructe.", "Mihai merge la piață ca cumpere fructe.", "Mihai merge la piață ca să cumperi fructe."], "accepted_answers": [{"value": "Mihai merge la piață ca să cumpere fructe.", "status": "correct"}], "feedback": "For *Mihai* the verb is *cumpere*."}
  ro.a2.unit90.lesson01.exercise03.une_ca_sa: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Merg la piață ca să cumpăr fructe.", "right": "I go to the market to buy fruit."}, {"left": "Învăț româna ca să vorbesc cu prietenii.", "right": "I learn Romanian to talk to my friends."}, {"left": "Iau trenul ca să ajung la timp.", "right": "I take the train to arrive on time."}, {"left": "Mihai merge la piață ca să cumpere fructe.", "right": "Mihai goes to the market to buy fruit."}, {"left": "ca să", "right": "in order to"}, {"left": "piață", "right": "market"}, {"left": "fructe", "right": "fruit"}, {"left": "cumpăr", "right": "I buy"}], "status": "correct"}], "feedback": "These are the expressions for purpose."}
