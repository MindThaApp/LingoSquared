  ro.a2.unit90.lesson04.exercise02.alege_cheia: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Îți dau cheia ca să intri.", "distractors": ["Îți dau cheia ca să intru.", "Îți dau cheia ca intri.", "Îți dau cheia ca să nu intri."], "accepted_answers": [{"value": "Îți dau cheia ca să intri.", "status": "correct"}], "feedback": "The person who gets in is *tu*, so the verb is *intri*."}
