schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit16_health.yaml for full detail.
    This unit's source PDF (US Peace Corps Moldova's "Basic Romanian
    Language Lessons") was checked for sick/pain/doctor/health material
    and found real, directly relevant hits in Lesson 2's "Basic
    Expressions" survival list: "I do not feel well. / Nu mă simt bine.",
    "I am sick. / Sînt bolnav." (modernized to "Sunt bolnav."), "I have a
    stomach ache. / Mă doare stomacul.", and "I need help. / Am nevoie de
    ajutor." (adapted to "Am nevoie de un doctor."). Lesson 8 separately
    confirms "doctor" as its own vocabulary entry. No source material
    covers head pain, so "cap" (head) is freely authored fresh, disclosed
    honestly: basic-tier, extremely common Romanian body-part vocabulary
    with no plausible substitute, independently confidence-checked.
    "Odihnă" (rest) and "multă" (a lot of, feminine) are likewise freely
    authored fresh. "Spital"/"vizavi de"/"magazin" are direct within-course
    reuse from unit08 (places) -- this unit's lesson03 reading note
    reuses unit08's own established fact "Spitalul este vizavi de
    magazin." as a deliberate cross-unit callback. Glosses/notes here are
    freshly authored to explain the target-language forms to an English
    speaker.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Sixteenth Romanian overlay, first draft, authored alongside the
    paired realization. Needs the same fresh-context review before
    import.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț). For
    free-typed A1 answers, accept otherwise-correct forms with the
    diacritics omitted or with the legacy cedilla variants ş/ţ
    substituted for ș/ț, matching units 01-15's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    This unit's own new vocabulary (doare, cap, stomac, simt, bolnav,
    nevoie, doctor, odihnă, multă) is used only in fixed first-person
    (Mihai's own "Nu mă simt bine"/"Sunt bolnav") or already-established
    formal ("Aveți nevoie de...?") forms. No informal-tu form is
    introduced this unit; Ana and Mihai keep their existing formal
    register with each other.

course:
  title: "Romanian A1"
  description: >-
    Stating a basic health problem in Romanian -- Doare (hurts), Bolnav
    (sick), and Doctor (doctor) -- as Mihai feels unwell and Ana checks
    on him and offers advice.

units:
  ro.a1.unit16.health:
    title: "Health"

lessons:
  ro.a1.unit16.lesson01.ma_doare_capul:
    title: "My head hurts"
  ro.a1.unit16.lesson02.nu_ma_simt_bine:
    title: "I don't feel well"
  ro.a1.unit16.lesson03.mihai_este_bolnav:
    title: "Mihai is sick"

teaching:
  ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau:
    title: "Reminder: mă, vă, ce, sau"
    gloss: "mă (me) · vă (you, formal) · ce (what) · sau (or)"
    note: >-
      Mă is from unit01/unit10 (mă numesc, mă trezesc); vă is from
      unit01/unit06/unit07/unit13 (vă rog); ce is from unit01/unit03/
      unit04/unit15; sau is from unit13 -- this unit reuses all four for
      a new purpose, talking about what hurts.

  ro.a1.unit16.lesson01.teach.doare_vocab:
    title: "Hurts"
    gloss: "Doare (hurts, it hurts)"
    note: "An impersonal verb -- Romanian says 'it hurts me' (*mă doare*) rather than 'I hurt.' *Mă doare* alone is a complete, natural reply to 'what hurts?'"
    example_gloss:
      - "It hurts."

  ro.a1.unit16.lesson01.teach.cap_vocab:
    title: "Head"
    gloss: "Cap (head)"
    note: "Masculine, consonant-ending -- takes *-ul* for 'the head,' the same rule *tren*->*trenul* and *peron*->*peronul* already established."
    example_gloss:
      - "My head hurts."

  ro.a1.unit16.lesson01.teach.ce_va_doare_phrase:
    title: "What hurts you?"
    gloss: "Ce vă doare? (What hurts you?)"
    note: "*Ce* (what) + *vă* (you, formal object) + *doare* -- every word here was already taught or just introduced, combined into a new question."

  ro.a1.unit16.lesson01.teach.stomac_vocab:
    title: "Stomach"
    gloss: "Stomac (stomach)"
    note: "Masculine, consonant-ending, so 'the stomach' is *stomacul* -- the same *-ul* rule as *cap*->*capul*."
    example_gloss:
      - "My stomach hurts."

  ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase:
    title: "Does your head or stomach hurt?"
    gloss: "Mă doare capul sau stomacul? (Does your head or stomach hurt?)"
    note: "*Sau* (or, from unit13) joins the two body parts just taught into one question."

  ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de:
    title: "Reminder: nu, bine, am, un, de"
    gloss: "nu (not/no) · bine (well/fine) · am (I have) · un (a, masculine) · de (of/from)"
    note: >-
      Nu/bine are from unit01/unit06/unit11; am is from unit02/unit05/
      unit15; un/de are from unit06/unit07/unit15 -- this unit reuses
      all five to talk about not feeling well and needing a doctor.

  ro.a1.unit16.lesson02.teach.ma_simt_vocab:
    title: "I feel"
    gloss: "Mă simt (I feel)"
    note: "A reflexive verb, literally 'I feel myself' -- the same *mă* + verb pattern as *mă trezesc*/*mă culc* from unit10."
    example_gloss:
      - "I feel well."

  ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase:
    title: "I don't feel well"
    gloss: "Nu mă simt bine. (I don't feel well.)"
    note: "*Nu* negates *mă simt bine* -- the natural way to say something's wrong without naming a specific symptom yet."

  ro.a1.unit16.lesson02.teach.bolnav_vocab:
    title: "Sick"
    gloss: "Bolnav (sick, masculine)"
    note: "Masculine form of the adjective -- only Mihai uses it this unit (*Sunt bolnav*), so the feminine *bolnavă* isn't needed yet."
    example_gloss:
      - "I am sick."

  ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase:
    title: "I need a doctor"
    gloss: "Am nevoie de un doctor. (I need a doctor.)"
    note: "*Am nevoie de* (I need, literally 'I have need of') + *un doctor* -- a fixed idiom, useful for asking for help with anything, not just doctors."

  ro.a1.unit16.lesson02.teach.doctor_vocab:
    title: "Doctor"
    gloss: "Doctor (doctor)"
    note: "Masculine, so 'a doctor' is *un doctor*."
    example_gloss:
      - "I need a doctor."

  ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da:
    title: "Reminder: Ce mai faceți?, Aveți, Da"
    gloss: "Ce mai faceți? (How are you, formal) · Aveți (you have, formal) · Da (yes)"
    note: "Ce mai faceți is from unit01; Aveți is from unit05; Da is from unit06/unit11 -- all reused for this unit's check-in dialogue."

  ro.a1.unit16.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: "Reminder: bună, mulțumesc, la revedere, Ana, Mihai"
    gloss: "bună (hi) · mulțumesc (thank you) · la revedere (goodbye) · Ana, Mihai (names)"
    note: "All already established in earlier units -- the same friendly opening and closing pattern every dialogue in this course has used."

  ro.a1.unit16.lesson03.teach.reminder_spitalul_vizavi_magazin:
    title: "Reminder: Spitalul este vizavi de magazin"
    gloss: "Spitalul este vizavi de magazin. (The hospital is opposite the store.)"
    note: "Reused directly from unit08 -- the hospital's location hasn't changed, and this unit's own reading note points back to it."

  ro.a1.unit16.lesson03.teach.odihna_vocab:
    title: "Rest"
    gloss: "Odihnă (rest)"
    note: "A feminine noun -- the thing a doctor (or a friend) recommends when you're unwell."
    example_gloss:
      - "You need rest."

  ro.a1.unit16.lesson03.teach.multa_apa_vocab:
    title: "Plenty of water"
    gloss: "Multă apă (a lot of / plenty of water)"
    note: "*Multă* (a lot of, feminine) agrees with the feminine *apă* (water, from unit06) -- a fixed collocation, the kind of thing a doctor might recommend."
    example_gloss:
      - "Rest and plenty of water."

  ro.a1.unit16.lesson03.teach.line01:
    title: "Greet and ask how he is"
    gloss: "Ana greets Mihai and asks how he's doing."
    note: "Reuses unit01's own *Ce mai faceți?* greeting."

  ro.a1.unit16.lesson03.teach.line02:
    title: "Say you don't feel well"
    gloss: "Mihai says he doesn't feel well and his head hurts."
    note: "Combines this unit's own lesson02 phrase and lesson01 phrase."

  ro.a1.unit16.lesson03.teach.line03:
    title: "Ask if he needs a doctor"
    gloss: "Ana asks if he needs a doctor."
    note: "Reuses this unit's own lesson02 phrase as a question, with unit05's *aveți*."

  ro.a1.unit16.lesson03.teach.line04:
    title: "Confirm you are sick and need a doctor"
    gloss: "Mihai says yes, he is sick, and he needs a doctor."
    note: "Combines this unit's own *sunt bolnav* and *am nevoie de un doctor*."

  ro.a1.unit16.lesson03.teach.line05:
    title: "Give advice and say goodbye"
    gloss: "Ana tells him to rest and drink plenty of water, and says goodbye."
    note: "Uses this lesson's own *Odihnă și multă apă* -- health-specific advice in place of the course's usual plain farewell alone."

  ro.a1.unit16.lesson03.teach.line06:
    title: "Thank her and say goodbye"
    gloss: "Mihai thanks Ana and says goodbye."
    note: "The same closing pattern every earlier unit's dialogue has ended on."

exercises:
  ro.a1.unit16.lesson01.exercise01.choose_cap:
    instruction: "Which word means 'head'?"
    correct_option: "Cap"
    distractors: ["Stomac", "Doare"]
    accepted_answers: ["Cap"]

  ro.a1.unit16.lesson01.exercise02.choose_doare:
    instruction: "Which word means 'hurts'?"
    correct_option: "Doare"
    distractors: ["Este", "Costă"]
    accepted_answers: ["Doare"]

  ro.a1.unit16.lesson01.exercise03.listen_ma_doare_capul:
    instruction: "Listen and select what you hear."
    correct_option: "Mă doare capul"
    distractors: ["Mă doare stomacul.", "Ce vă doare?"]
    accepted_answers: ["Mă doare capul"]

  ro.a1.unit16.lesson01.exercise04.match_health1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Cap": "head"
      "Doare": "hurts"
      "Stomac": "stomach"
      "Mă doare capul.": "My head hurts."
      "Mă doare stomacul.": "My stomach hurts."
      "Ce vă doare?": "What hurts you?"

  ro.a1.unit16.lesson01.exercise05.order_ma_doare_capul:
    instruction: "Build the sentence: My head hurts."
    correct_response: ["Mă", "doare", "capul"]

  ro.a1.unit16.lesson01.exercise06.listen_order_ce_va_doare:
    instruction: "Listen, then put the words in order."
    correct_response: ["Ce", "vă", "doare"]

  ro.a1.unit16.lesson01.exercise07.complete_ma_doare_capul:
    instruction: "Complete the sentence: My head hurts."
    accepted_answers: ["doare", "Doare"]
    feedback: "Mă *doare* capul -- *doare* is the impersonal verb for something hurting."

  ro.a1.unit16.lesson01.exercise08.speak_ma_doare_capul:
    instruction: "Say aloud: My head hurts."
    accepted_answers:
      - "Mă doare capul."
      - "Mă doare capul"

  ro.a1.unit16.lesson02.exercise01.choose_bolnav:
    instruction: "Which word means 'sick'?"
    correct_option: "Bolnav"
    distractors: ["Doctor", "Odihnă"]
    accepted_answers: ["Bolnav"]

  ro.a1.unit16.lesson02.exercise02.choose_doctor:
    instruction: "Which word means 'doctor'?"
    correct_option: "Doctor"
    distractors: ["Bolnav", "Stomac"]
    accepted_answers: ["Doctor"]

  ro.a1.unit16.lesson02.exercise03.listen_nu_ma_simt_bine:
    instruction: "Listen and select what you hear."
    correct_option: "Nu mă simt bine"
    distractors: ["Sunt bolnav.", "Am nevoie de un doctor."]
    accepted_answers: ["Nu mă simt bine"]

  ro.a1.unit16.lesson02.exercise04.match_health2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Mă simt": "I feel"
      "Nu mă simt bine.": "I don't feel well."
      "Bolnav": "sick"
      "Sunt bolnav.": "I am sick."
      "Doctor": "doctor"
      "Am nevoie de un doctor.": "I need a doctor."

  ro.a1.unit16.lesson02.exercise05.order_nu_ma_simt_bine:
    instruction: "Build the sentence: I don't feel well."
    correct_response: ["Nu", "mă", "simt", "bine"]

  ro.a1.unit16.lesson02.exercise06.listen_order_am_nevoie_de_doctor:
    instruction: "Listen, then put the words in order."
    correct_response: ["Am", "nevoie", "de", "un", "doctor"]

  ro.a1.unit16.lesson02.exercise07.complete_sunt_bolnav:
    instruction: "Complete the sentence: I don't feel well. I am sick."
    accepted_answers: ["bolnav", "Bolnav"]
    feedback: "Sunt *bolnav* -- *bolnav* is the word for 'sick.'"

  ro.a1.unit16.lesson02.exercise08.speak_am_nevoie_de_doctor:
    instruction: "Say aloud: I need a doctor."
    accepted_answers:
      - "Am nevoie de un doctor."
      - "Am nevoie de un doctor"

  ro.a1.unit16.lesson03.exercise01.choose_who_feels_unwell:
    instruction: "Who says this line?"
    correct_option: "Mihai"
    distractors: ["Ana"]
    accepted_answers: ["Mihai"]

  ro.a1.unit16.lesson03.exercise02.dialogue_comprehend_symptom:
    instruction: "Listen to the dialogue. What hurts Mihai?"
    correct_option: "Capul."
    distractors: ["Stomacul."]
    accepted_answers: ["Capul."]

  ro.a1.unit16.lesson03.exercise03.reading_comprehend_advice:
    instruction: "Read the note. What does it recommend?"
    correct_option: "Odihnă și multă apă."
    distractors:
      - "Un bilet la tren."
      - "O cafea."
    accepted_answers:
      - "Odihnă și multă apă."
      - "Odihnă și multă apă"

  ro.a1.unit16.lesson03.exercise04.match_unit_review:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Cap": "head"
      "Stomac": "stomach"
      "Doare": "hurts"
      "Bolnav": "sick"
      "Doctor": "doctor"
      "Odihnă": "rest"
      "Nu mă simt bine.": "I don't feel well."
      "Am nevoie de un doctor.": "I need a doctor."

  ro.a1.unit16.lesson03.exercise05.order_aveti_nevoie_de_doctor:
    instruction: "Build the sentence: Do you need a doctor?"
    correct_response: ["Aveți", "nevoie", "de", "un", "doctor"]

  ro.a1.unit16.lesson03.exercise06.complete_odihna:
    instruction: "Complete Ana's advice (rest and plenty of water): ___ și multă apă! La revedere, Mihai!"
    accepted_answers: ["Odihnă", "odihnă"]
    feedback: "*Odihnă* și multă apă! -- rest and plenty of water, simple health advice from a friend."

  ro.a1.unit16.lesson03.exercise07.respond_as_mihai:
    instruction: "Take Mihai's role. Ana asks 'Ce mai faceți?' -- tell her you don't feel well and your head hurts."
    accepted_answers:
      - "Nu mă simt bine. Mă doare capul."
      - "Nu mă simt bine, mă doare capul."
      - "Nu mă simt bine și mă doare capul."

  ro.a1.unit16.lesson03.exercise08.speak_sunt_bolnav:
    instruction: "Say aloud: I am sick. I need a doctor."
    accepted_answers:
      - "Sunt bolnav. Am nevoie de un doctor."
      - "Sunt bolnav, am nevoie de un doctor."

  ro.a1.unit16.lesson03.exercise09.write_health_message:
    instruction: "Write a short message about a health problem (what hurts, or that you don't feel well)."
    accepted_answers:
      - "Mă doare capul."
      - "Mă doare stomacul."
      - "Nu mă simt bine."
      - "Sunt bolnav."
      - "Am nevoie de un doctor."
      - "Nu mă simt bine. Sunt bolnav."
      - "Nu mă simt bine, sunt bolnav."
      - "Mă doare capul. Am nevoie de un doctor."
      - "Mă doare capul, am nevoie de un doctor."
