teaching:
  ro.a2.unit91.lesson01.teach.cuvinte: {"title": "If", "gloss": "if / I have time / it's cold / the jacket / I wear", "note": "*Dacă* means 'if'. After *dacă* the verb is in the present, like in the main clause.", "example_gloss": ["If it rains, I stay home.", "If I have time, I go to the film.", "If it's cold, I wear a jacket."]}
  ro.a2.unit91.lesson01.teach.gn_daca: {"title": "*Dacă* + present", "gloss": "If it rains, I stay home. If I have time, I go to the film.", "note": "A real condition uses the present in both clauses: *Dacă plouă* ... *rămân*. There is a comma after the *dacă* clause."}
  ro.a2.unit91.lesson01.teach.gn_daca_nu: {"title": "*Dacă* and *dacă nu*", "gloss": "If it's cold, I wear a jacket. If it doesn't rain, we go to the park.", "note": "*Dacă nu* means 'if not'. *Nu* goes before the verb: *dacă nu plouă*."}
  ro.a2.unit91.lesson02.teach.cuvinte: {"title": "If and the future", "gloss": "sun, sunny weather / park / will / tomorrow", "note": "*O să* + verb is the spoken future. After *dacă*, the verb stays in the present, not the future.", "example_gloss": ["If it's sunny tomorrow, we'll go to the park.", "If it rains, I'll stay home.", "If I have time, I'll call you."]}
  ro.a2.unit91.lesson02.teach.gn_o_sa: {"title": "*Dacă* + present, *o să* + verb", "gloss": "If it rains, I'll stay home. If I have time, I'll call you.", "note": "The *dacă* clause is in the present. The result can be in the present or with *o să*."}
  ro.a2.unit91.lesson02.teach.gn_maine: {"title": "Plans for tomorrow", "gloss": "If it's sunny tomorrow, we'll go to the park. If you're not tired, we'll go to the film.", "note": "Even for tomorrow, the verb after *dacă* is in the present: *dacă mâine e soare*."}
  ro.a2.unit91.lesson03.teach.cuvinte: {"title": "Advice with if", "gloss": "come! / ask! / eat! / hunger / you have questions", "note": "The result of *dacă* can be an order or invitation: *vino!*, *întreabă!*, *mănâncă!*.", "example_gloss": ["If you have time, come to our place!", "If you don't know, ask!", "If you're hungry, eat a little.", "If you have questions, call me!"]}
  ro.a2.unit91.lesson03.teach.gn_vino: {"title": "*Dacă* + command", "gloss": "If you have time, come to our place! If you don't know, ask!", "note": "After the *dacă* clause you can give a friendly command with the *tu* imperative: *vino*, *întreabă*."}
  ro.a2.unit91.lesson03.teach.gn_foame: {"title": "More advice", "gloss": "If you're hungry, eat a little. If you have questions, call me!", "note": "*Ți-e foame* means 'you are hungry' (literally 'hunger is to you'). The imperative *mănâncă* is the *tu* command."}
  ro.a2.unit91.lesson04.teach.cuvinte: {"title": "Maybe and for sure", "gloss": "maybe / on our own / sure / together", "note": "*Poate* shows that you are not sure. Use *dacă* for something possible and *când* for something certain.", "example_gloss": ["Maybe Mihai is coming.", "If Mihai comes, we'll eat together.", "If he doesn't come, we'll eat on our own."]}
  ro.a2.unit91.lesson04.teach.gn_daca_cand: {"title": "*Dacă* or *când*", "gloss": "If Mihai comes, we'll eat together. When Mihai comes, we'll eat together.", "note": "*Dacă* is for something possible, and you do not know. *Când* is for something sure, and you only wait for the time."}
  ro.a2.unit91.lesson04.teach.gn_nu_vine: {"title": "*Dacă nu*", "gloss": "Maybe Mihai is coming. If he doesn't come, we'll eat on our own.", "note": "Use *dacă nu* + verb for the other possibility. The main clause stays in the present."}
  ro.a2.unit91.lesson05.teach.cuvinte: {"title": "Words for the plans", "gloss": "I finish / the work / we cook / I can't", "note": "*Termin* is 'I finish'; *gătim* is 'we cook'.", "example_gloss": ["If I finish work, I'll come.", "We stay home and cook.", "I can't come."]}
  ro.a2.unit91.lesson05.teach.mesaj_maria: {"title": "Maria invites Ana", "gloss": "Hi, Ana! If it's sunny tomorrow, we go to the park. If it rains, we stay home and cook. If you have time, come! If you can't, it's nothing.", "note": "Maria gives two plans, one for each kind of weather."}
  ro.a2.unit91.lesson05.teach.raspuns_ana: {"title": "Ana answers", "gloss": "Hi, Maria! If I finish work, I'll come. If I don't finish, I'll call you. If it rains, I'll cook something good!", "note": "Ana uses *dacă* with the present and *o să* in the result."}
  ro.a2.unit91.lesson06.teach.d1: {"title": "Ana asks about Saturday", "gloss": "Ana: Mihai, what are we doing on Saturday?"}
  ro.a2.unit91.lesson06.teach.d2: {"title": "Mihai suggests the park", "gloss": "Mihai: If it's sunny, we go to the park."}
  ro.a2.unit91.lesson06.teach.d3: {"title": "Ana asks about rain", "gloss": "Ana: And if it rains?"}
  ro.a2.unit91.lesson06.teach.d4: {"title": "Mihai has a rainy plan", "gloss": "Mihai: If it rains, we stay home and cook."}
  ro.a2.unit91.lesson06.teach.d5: {"title": "Ana invites him", "gloss": "Ana: Perfect! If you have time, come to my place in the morning."}
  ro.a2.unit91.lesson06.teach.d6: {"title": "Mihai is not sure", "gloss": "Mihai: If I finish work, I'll come. If not, I'll call you."}
  ro.a2.unit91.lesson06.teach.d7: {"title": "Ana is relaxed", "gloss": "Ana: Good! If you can't, it's nothing."}
