  ro.a2.unit91.lesson06.exercise03.une_dialog: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Ce facem sâmbătă?", "right": "What are we doing on Saturday?"}, {"left": "Dacă e soare, mergem în parc.", "right": "If it's sunny, we go to the park."}, {"left": "Și dacă plouă?", "right": "And if it rains?"}, {"left": "Dacă plouă, rămânem acasă și gătim.", "right": "If it rains, we stay home and cook."}, {"left": "Dacă ai timp, vino la mine dimineața.", "right": "If you have time, come to my place in the morning."}, {"left": "Dacă termin lucrul, vin.", "right": "If I finish work, I'll come."}, {"left": "Dacă nu, te sun.", "right": "If not, I'll call you."}, {"left": "Dacă nu poți, nu e nimic.", "right": "If you can't, it's nothing."}], "status": "correct"}], "feedback": "These are the lines of the dialogue."}
