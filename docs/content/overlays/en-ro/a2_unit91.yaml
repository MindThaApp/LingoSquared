  ro.a2.unit91.lesson01.exercise07.scrie_daca_nu: {"instruction": "Write the requested sentence with *dacă nu*.", "correct_option": "Dacă nu plouă, mergem în parc.", "accepted_answers": [{"value": "Dacă nu plouă, mergem în parc.", "status": "correct"}, {"value": "Dacă nu plouă, mergem în parc", "status": "correct"}], "feedback": "*Dacă nu plouă, mergem în parc.*"}
  ro.a2.unit91.lesson02.exercise01.alege_o_sa: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Dacă plouă, o să rămân acasă.", "distractors": ["Dacă plouă, rămân o să acasă.", "Dacă plouă o să, rămân acasă.", "Dacă plouă, să rămân acasă."], "accepted_answers": [{"value": "Dacă plouă, o să rămân acasă.", "status": "correct"}], "feedback": "*O să* comes before the verb: *o să rămân*."}
  ro.a2.unit91.lesson02.exercise02.alege_soare: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Dacă mâine e soare, o să mergem în parc.", "distractors": ["Dacă mâine e soare, o mergem în parc.", "Dacă mâine o să e soare, mergem în parc.", "Dacă mâine e soare, să mergem în parc."], "accepted_answers": [{"value": "Dacă mâine e soare, o să mergem în parc.", "status": "correct"}], "feedback": "*O să mergem* is the future for *noi*."}
  ro.a2.unit91.lesson02.exercise03.une_o_sa: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Dacă plouă, o să rămân acasă.", "right": "If it rains, I'll stay home."}, {"left": "Dacă am timp, o să te sun.", "right": "If I have time, I'll call you."}, {"left": "Dacă mâine e soare, o să mergem în parc.", "right": "If it's sunny tomorrow, we'll go to the park."}, {"left": "Dacă nu ești obosit, o să mergem la film.", "right": "If you're not tired, we'll go to the film."}, {"left": "soare", "right": "sun, sunny weather"}, {"left": "parc", "right": "park"}, {"left": "o să", "right": "will"}, {"left": "mâine", "right": "tomorrow"}], "status": "correct"}], "feedback": "These are the expressions with 'if' and the future."}
  ro.a2.unit91.lesson02.exercise04.ordine_o_sa: {"instruction": "Put the words in order to say 'If I have time, I'll call you.'", "correct_option": "Dacă am timp o să te sun", "accepted_answers": [{"value": "Dacă am timp o să te sun", "status": "correct"}, {"value": "O să te sun dacă am timp", "status": "correct"}], "feedback": "*Dacă am timp, o să te sun.*"}
