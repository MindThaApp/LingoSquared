  ro.a2.unit91.lesson03.exercise07.scrie_mananca: {"instruction": "Write the requested sentence with *dacă*.", "correct_option": "Dacă ți-e foame, mănâncă puțin.", "accepted_answers": [{"value": "Dacă ți-e foame, mănâncă puțin.", "status": "correct"}, {"value": "Dacă ți-e foame, mănâncă puțin", "status": "correct"}], "feedback": "*Dacă ți-e foame, mănâncă puțin.*"}
