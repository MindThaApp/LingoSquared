  ro.a2.unit91.lesson01.exercise02.alege_frig: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Dacă e frig, port jacheta.", "distractors": ["Dacă e frig, port jachetă să.", "Când e frig dacă, port jacheta.", "Dacă frig, port jacheta."], "accepted_answers": [{"value": "Dacă e frig, port jacheta.", "status": "correct"}], "feedback": "*Dacă e frig* has a verb: *e*."}
  ro.a2.unit91.lesson01.exercise03.une_daca: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Dacă plouă, rămân acasă.", "right": "If it rains, I stay home."}, {"left": "Dacă am timp, merg la film.", "right": "If I have time, I go to the film."}, {"left": "Dacă e frig, port jacheta.", "right": "If it's cold, I wear a jacket."}, {"left": "Dacă nu plouă, mergem în parc.", "right": "If it doesn't rain, we go to the park."}, {"left": "dacă", "right": "if"}, {"left": "am timp", "right": "I have time"}, {"left": "e frig", "right": "it's cold"}, {"left": "port", "right": "I wear"}], "status": "correct"}], "feedback": "These are the expressions with 'if'."}
  ro.a2.unit91.lesson01.exercise04.ordine_timp: {"instruction": "Put the words in order to say 'If I have time, I go to the film.'", "correct_option": "Dacă am timp merg la film", "accepted_answers": [{"value": "Dacă am timp merg la film", "status": "correct"}, {"value": "Merg la film dacă am timp", "status": "correct"}], "feedback": "*Dacă am timp, merg la film.*"}
