  ro.a2.unit91.lesson02.exercise07.scrie_maine: {"instruction": "Write the requested sentence with *dacă* and *o să*.", "correct_option": "Dacă mâine e soare, o să mergem în parc.", "accepted_answers": [{"value": "Dacă mâine e soare, o să mergem în parc.", "status": "correct"}, {"value": "Dacă mâine e soare, o să mergem în parc", "status": "correct"}, {"value": "Dacă e soare mâine, o să mergem în parc.", "status": "correct"}, {"value": "Dacă e soare mâine, o să mergem în parc", "status": "correct"}], "feedback": "*Dacă mâine e soare, o să mergem în parc.*"}
