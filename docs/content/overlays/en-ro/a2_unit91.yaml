  ro.a2.unit91.lesson04.exercise05.completeaza_poate: {"instruction": "Complete the Romanian sentence.", "correct_option": "Poate", "accepted_answers": [{"value": "Poate", "status": "correct"}], "feedback": "*Poate* means 'maybe'."}
  ro.a2.unit91.lesson04.exercise06.traduce_daca_cand: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Dacă vine Mihai, mâncăm împreună.", "status": "correct"}, {"value": "Dacă vine Mihai, mâncăm împreună", "status": "correct"}, {"value": "Mâncăm împreună dacă vine Mihai.", "status": "correct"}, {"value": "Mâncăm împreună dacă vine Mihai", "status": "correct"}, {"value": "Dacă Mihai vine, mâncăm împreună.", "status": "correct"}, {"value": "Dacă Mihai vine, mâncăm împreună", "status": "correct"}], "feedback": "*Dacă vine Mihai, mâncăm împreună.*"}
  ro.a2.unit91.lesson04.exercise07.scrie_singuri: {"instruction": "Write the requested sentence with *dacă nu*.", "correct_option": "Dacă nu vine, mâncăm singuri.", "accepted_answers": [{"value": "Dacă nu vine, mâncăm singuri.", "status": "correct"}, {"value": "Dacă nu vine, mâncăm singuri", "status": "correct"}], "feedback": "*Dacă nu vine, mâncăm singuri.*"}
