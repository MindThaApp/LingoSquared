    title: I play football
    gloss: I play football.
    note: '*Joc fotbal* ("I play football") uses *a juca* with a game; for other sports use *a face* (*fac yoga*); see the grammar note.'
  ro.a1.unit33.lesson01.teach.spui_ce_sport:
    title: A face and a juca with sports
    gloss: 'You say which sport you do with a face or a juca: fac yoga, joc fotbal, alerg, înot.'
    note: One construction covers every sport -- no need to learn a separate verb per sport at this level.
  ro.a1.unit33.lesson02.teach.ori_pe_saptamana:
    title: Times a week
    gloss: times a week
    example_gloss: I do yoga twice a week.
  ro.a1.unit33.lesson02.teach.stii_deja_in:
    title: 'How often: de două ori pe săptămână'
    gloss: You already know în fiecare zi (every day) and des (often). De două ori pe săptămână (twice a week) is a new, more specific way to say how often.
    note: Extends the frequency vocabulary already established in the hobbies unit.
  ro.a1.unit33.lesson02.teach.fac_yoga_de:
    title: I do yoga twice a week
    gloss: I do yoga twice a week.
  ro.a1.unit33.lesson02.teach.mihai_joaca_des:
    title: Mihai often plays football
    gloss: Mihai often plays football.
    note: '*Des* (often) reuses the frequency word from the hobbies unit.'
  ro.a1.unit33.lesson03.teach.stii_deja_a:
    title: A face sport vs a specific sport
    gloss: 'You already know a face sport from the hobbies lesson (Fac sport sâmbăta, I exercise on Saturdays). For a specific sport you name the game: Joc fotbal. Both are correct Romanian.'
    note: '*A face sport* is reused from the hobbies unit, not new: this contrasts it with naming a specific sport, one general and one specific way to talk about exercise.'
  ro.a1.unit33.lesson03.teach.a_face_sport:
    title: To exercise
    gloss: to exercise / do sport
    example_gloss: I exercise every day.
  ro.a1.unit33.lesson03.teach.a_iubi_inotul:
    title: To love swimming
    gloss: to love swimming
    example_gloss: Elena loves swimming.
  ro.a1.unit33.lesson03.teach.elena_iubeste_inotul:
    title: Elena loves swimming
    gloss: Elena loves swimming.
    note: '*A iubi* ("to love") needs no preposition before its object, and the article attaches: *înotul*.'
