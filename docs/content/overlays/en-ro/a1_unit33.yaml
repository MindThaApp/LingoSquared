  ro.a1.unit33.lesson04.teach.verbul_a_alerga:
    title: The verb a alerga
    gloss: 'The verb a alerga changes with the person: eu alerg, tu alergi, el aleargă.'
    note: 'Like every Romanian verb, *a alerga* changes its ending with the person; it stays one word: *alerg*, *alergi*, *aleargă*.'
  ro.a1.unit33.lesson04.teach.mihai_ce_bine:
    title: Mihai reacts
    gloss: 'Mihai: How nice, I often play football there.'
  ro.a1.unit33.lesson05.teach.ana_face_yoga:
    title: Ana and Elena on sport
    gloss: Ana does yoga twice a week. She loves moving calmly. Elena doesn't do yoga, but she loves swimming. Elena swims often, almost every week. What sport do you do?
    note: Contrasts two sports and two frequency expressions; *nu face yoga* shows how to say that someone does not do a sport.
