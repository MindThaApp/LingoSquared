  ro.a2.unit88.lesson01.exercise05.completeaza_pentru: {"instruction": "Complete the Romanian sentence.", "correct_option": "Pentru", "accepted_answers": [{"value": "Pentru", "status": "correct"}], "feedback": "The word that starts the reason is *pentru*: *pentru că*."}
  ro.a2.unit88.lesson01.exercise06.traduce_bolnav: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Rămân acasă pentru că sunt bolnav.", "status": "correct"}, {"value": "Rămân acasă pentru că sunt bolnav", "status": "correct"}, {"value": "Rămân acasă pentru că sunt bolnavă.", "status": "correct"}, {"value": "Rămân acasă pentru că sunt bolnavă", "status": "correct"}], "feedback": "*Rămân acasă pentru că sunt bolnav.*"}
  ro.a2.unit88.lesson01.exercise07.scrie_obosit: {"instruction": "Write the requested sentence with *pentru că*.", "correct_option": "Nu merg la serviciu pentru că sunt obosit.", "accepted_answers": [{"value": "Nu merg la serviciu pentru că sunt obosit.", "status": "correct"}, {"value": "Nu merg la serviciu pentru că sunt obosit", "status": "correct"}, {"value": "Nu merg la serviciu pentru că sunt obosită.", "status": "correct"}, {"value": "Nu merg la serviciu pentru că sunt obosită", "status": "correct"}], "feedback": "*Nu merg la serviciu pentru că sunt obosit.*"}
  ro.a2.unit88.lesson02.exercise01.alege_deoarece: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Ana a întârziat deoarece trenul a întârziat.", "distractors": ["Ana a întârziat deoarece trenul întârziat.", "Ana a întârziat deoarece de ce trenul a întârziat.", "Ana deoarece a întârziat trenul întârziat."], "accepted_answers": [{"value": "Ana a întârziat deoarece trenul a întârziat.", "status": "correct"}], "feedback": "*Deoarece* is followed by a full clause: *trenul a întârziat*."}
  ro.a2.unit88.lesson02.exercise02.alege_prima: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Deoarece plouă, rămânem acasă.", "distractors": ["Deoarece plouă, deoarece rămânem acasă.", "Plouă deoarece, rămânem acasă.", "Deoarece rămânem acasă, plouă."], "accepted_answers": [{"value": "Deoarece plouă, rămânem acasă.", "status": "correct"}], "feedback": "The reason clause comes first, then a comma."}
  ro.a2.unit88.lesson02.exercise03.une_deoarece: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Ana a întârziat deoarece trenul a întârziat.", "right": "Ana was late because the train was late."}, {"left": "Nu am venit deoarece am fost bolnav.", "right": "I didn't come because I was ill."}, {"left": "Deoarece plouă, rămânem acasă.", "right": "Because it's raining, we're staying home."}, {"left": "Pentru că sunt obosit, mă culc devreme.", "right": "Because I'm tired, I go to bed early."}, {"left": "Care este motivul?", "right": "What is the reason?"}, {"left": "deoarece", "right": "because (formal)"}, {"left": "motiv", "right": "reason"}, {"left": "tren", "right": "train"}], "status": "correct"}], "feedback": "These expressions give a more formal reason."}
  ro.a2.unit88.lesson02.exercise04.ordine_deoarece: {"instruction": "Put the words in order to say 'I didn't come because I was ill.'", "correct_option": "Nu am venit deoarece am fost bolnav", "accepted_answers": [{"value": "Nu am venit deoarece am fost bolnav", "status": "correct"}], "feedback": "*Nu am venit deoarece am fost bolnav.*"}
  ro.a2.unit88.lesson02.exercise05.completeaza_fost: {"instruction": "Complete the Romanian sentence.", "correct_option": "fost", "accepted_answers": [{"value": "fost", "status": "correct"}], "feedback": "*Am fost* is the perfect compus of *a fi*: 'I was'."}
  ro.a2.unit88.lesson02.exercise06.traduce_deoarece: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Rămânem acasă deoarece plouă.", "status": "correct"}, {"value": "Rămânem acasă deoarece plouă", "status": "correct"}, {"value": "Deoarece plouă, rămânem acasă.", "status": "correct"}, {"value": "Deoarece plouă, rămânem acasă", "status": "correct"}, {"value": "Rămânem acasă pentru că plouă.", "status": "correct"}, {"value": "Rămânem acasă pentru că plouă", "status": "correct"}, {"value": "Pentru că plouă, rămânem acasă.", "status": "correct"}, {"value": "Pentru că plouă, rămânem acasă", "status": "correct"}], "feedback": "*Rămânem acasă deoarece plouă.*"}
  ro.a2.unit88.lesson02.exercise07.scrie_deoarece: {"instruction": "Write the requested sentence with *deoarece*.", "correct_option": "Ana a întârziat deoarece trenul a întârziat.", "accepted_answers": [{"value": "Ana a întârziat deoarece trenul a întârziat.", "status": "correct"}, {"value": "Ana a întârziat deoarece trenul a întârziat", "status": "correct"}], "feedback": "*Ana a întârziat deoarece trenul a întârziat.*"}
  ro.a2.unit88.lesson03.exercise01.alege_asa_ca: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Plouă, așa că rămânem acasă.", "distractors": ["Plouă, pentru că rămânem acasă.", "Plouă așa rămânem că acasă.", "Plouă, de ce rămânem acasă."], "accepted_answers": [{"value": "Plouă, așa că rămânem acasă.", "status": "correct"}], "feedback": "*Așa că* introduces the result."}
  ro.a2.unit88.lesson03.exercise02.alege_contrast: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Rămânem acasă pentru că plouă.", "distractors": ["Rămânem acasă, așa că plouă.", "Rămânem acasă așa plouă.", "Rămânem acasă, de aceea plouă."], "accepted_answers": [{"value": "Rămânem acasă pentru că plouă.", "status": "correct"}], "feedback": "Here *plouă* is the reason, so it follows *pentru că*."}
  ro.a2.unit88.lesson03.exercise03.une_asa_ca: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Sunt obosit, așa că mă culc devreme.", "right": "I'm tired, so I go to bed early."}, {"left": "Plouă, așa că rămânem acasă.", "right": "It's raining, so we're staying home."}, {"left": "Trenul a întârziat, așa că am venit târziu.", "right": "The train was late, so I came late."}, {"left": "Nu am timp, de aceea nu merg la cinema.", "right": "I have no time, that is why I'm not going to the cinema."}, {"left": "așa că", "right": "so"}, {"left": "de aceea", "right": "that is why"}, {"left": "devreme", "right": "early"}, {"left": "târziu", "right": "late"}], "status": "correct"}], "feedback": "These are the expressions for a result."}
