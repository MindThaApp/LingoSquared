answer_policy:
  diacritics: "Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling."
  capitalization_and_punctuation: "Accept ordinary capitalization differences and omission of the comma, exclamation mark or question mark."
  register: "Informal tu register throughout. Reasons are given with pentru că and deoarece, consequences with așa că."
course:
  title: "Romanian A2"
  description: "Intermediate Romanian continuing the Ana and Mihai storyline, with grammar-led units on modal verbs, requests, advice, the future, reasons, sequence, purpose, conditions and reported speech."
  learning_goal: "Say why something happened and what follows from it in Romanian."
units:
  ro.a2.unit88.de_ce_am_intarziat: {"title": "Why I Was Late", "description": "Give a reason and a consequence with pentru că, deoarece and așa că."}
