teaching:
  ro.a2.unit88.lesson01.teach.cuvinte: {"title": "Asking why and answering", "gloss": "why / because / tired / ill / rain", "note": "*De ce?* asks for a reason and *pentru că* gives it. *Obosit* and *bolnav* are for a man; a woman says *obosită* and *bolnavă*.", "example_gloss": ["Why aren't you coming?", "Because I am tired.", "I'm not going to work because I'm ill.", "I'm staying home because it's raining.", "Mihai isn't coming because he is ill."]}
  ro.a2.unit88.lesson01.teach.gn_pentru_ca: {"title": "*Pentru că* + reason", "gloss": "I'm not coming because I'm tired. I'm staying home because it's raining.", "note": "*Pentru că* introduces the reason, and the reason is a full clause with its own verb: *sunt obosit*, *plouă*."}
  ro.a2.unit88.lesson01.teach.gn_de_ce: {"title": "*De ce?* and *Pentru că*", "gloss": "Why aren't you coming? Because I have a lot of work.", "note": "The answer to *de ce?* usually starts with *pentru că*. In speech you can also just give the reason: *Am mult de lucru.*"}
  ro.a2.unit88.lesson02.teach.cuvinte: {"title": "A more formal because", "gloss": "because (formal) / reason / train / was late", "note": "*Deoarece* means the same as *pentru că* but sounds a little more formal. *Motiv* is 'reason'.", "example_gloss": ["Ana was late because the train was late.", "I didn't come because I was ill.", "Because it's raining, we're staying home.", "What is the reason?"]}
  ro.a2.unit88.lesson02.teach.gn_deoarece: {"title": "*Deoarece* + clause", "gloss": "Ana was late because the train was late. I didn't come because I was ill.", "note": "*Deoarece* is used like *pentru că*: it is followed by a clause with a verb. It is common in writing, messages and polite speech."}
  ro.a2.unit88.lesson02.teach.gn_prima: {"title": "Reason first", "gloss": "Because it's raining, we're staying home. Because I'm tired, I go to bed early.", "note": "The reason clause can come first. Then it is followed by a comma and the main clause."}
  ro.a2.unit88.lesson03.teach.cuvinte: {"title": "So and that is why", "gloss": "so / that is why / early / late / time", "note": "*Așa că* introduces the result. *De aceea* means 'that is why' and is a little more formal.", "example_gloss": ["I'm tired, so I go to bed early.", "It's raining, so we're staying home.", "The train was late, so I came late.", "I have no time, that is why I'm not going to the cinema."]}
  ro.a2.unit88.lesson03.teach.gn_asa_ca: {"title": "*Așa că* = so", "gloss": "It's raining, so we're staying home. I'm tired, so I go to bed early.", "note": "*Așa că* introduces the consequence. First the cause, then a comma, then *așa că* and the result."}
  ro.a2.unit88.lesson03.teach.gn_contrast: {"title": "Reason or result", "gloss": "We're staying home because it's raining. It's raining, so we're staying home.", "note": "*Pentru că* comes before the reason; *așa că* comes before the result. The two sentences say the same thing in a different order."}
  ro.a2.unit88.lesson04.teach.cuvinte: {"title": "Excuses and changed plans", "gloss": "sorry / meeting / tomorrow / taxi / with, by", "note": "*Cu* means 'with' or 'by' a means of transport: *cu taxiul*, *cu trenul*.", "example_gloss": ["Sorry, I have a meeting.", "I can't come because I have a meeting, so I'm coming tomorrow.", "I came by taxi."]}
  ro.a2.unit88.lesson04.teach.gn_scuza: {"title": "Reason and result together", "gloss": "I can't come because I have a meeting, so I'm coming tomorrow.", "note": "One message can give the reason with *pentru că* and the result with *așa că*. This is how you explain an excuse or a change of plan."}
  ro.a2.unit88.lesson04.teach.gn_taxi: {"title": "Answering with a result", "gloss": "Why were you late? The train was late, so I came by taxi.", "note": "You can answer *de ce?* with the reason and add what you did about it with *așa că*."}
  ro.a2.unit88.lesson05.teach.cuvinte: {"title": "Words for the messages", "gloss": "film / work / tired (fem.) / you sleep", "note": "*Obosită* is the feminine form, because Ana writes about herself. *Dormi* is the *tu* form.", "example_gloss": ["I'm not going to the film.", "I have a lot of work.", "Sleep well!"]}
  ro.a2.unit88.lesson05.teach.mesaj_ana: {"title": "Ana writes to Mihai", "gloss": "Hi, Mihai! I can't come to the film because I'm tired. I have a lot of work, so I get home late. Can I come tomorrow?", "note": "Ana gives two reasons: *pentru că sunt obosită* and a result with *așa că*."}
  ro.a2.unit88.lesson05.teach.raspuns_mihai: {"title": "Mihai answers", "gloss": "Hi, Ana! It's nothing. Because you're tired, stay at home. We're going tomorrow, so sleep well!", "note": "Mihai uses *deoarece* for the reason and *așa că* for the result."}
  ro.a2.unit88.lesson06.teach.d1: {"title": "Mihai asks why", "gloss": "Mihai: Ana, why were you late today?"}
  ro.a2.unit88.lesson06.teach.d2: {"title": "Ana gives the reason", "gloss": "Ana: Because the train was late."}
  ro.a2.unit88.lesson06.teach.d3: {"title": "Mihai asks another why", "gloss": "Mihai: And why didn't you call?"}
  ro.a2.unit88.lesson06.teach.d4: {"title": "Ana explains", "gloss": "Ana: The phone isn't working, so I didn't call. Sorry!"}
  ro.a2.unit88.lesson06.teach.d5: {"title": "Mihai invites her", "gloss": "Mihai: It's nothing. Are you coming to the film tonight?"}
  ro.a2.unit88.lesson06.teach.d6: {"title": "Ana declines", "gloss": "Ana: I can't, because I'm tired. I'm staying home."}
  ro.a2.unit88.lesson06.teach.d7: {"title": "Mihai moves the plan", "gloss": "Mihai: Then we'll go tomorrow, because tomorrow I have time."}
exercises:
  ro.a2.unit88.lesson01.exercise01.alege_obosit: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Nu vin pentru că sunt obosit.", "distractors": ["Nu vin așa că sunt obosit.", "Nu vin pentru sunt obosit.", "Nu vin de ce sunt obosit."], "accepted_answers": [{"value": "Nu vin pentru că sunt obosit.", "status": "correct"}], "feedback": "*Pentru că* gives the reason."}
  ro.a2.unit88.lesson01.exercise02.alege_ploua: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Rămân acasă pentru că plouă.", "distractors": ["Rămân acasă pentru că ploaie.", "Rămân acasă pentru plouă.", "Pentru că rămân acasă plouă."], "accepted_answers": [{"value": "Rămân acasă pentru că plouă.", "status": "correct"}], "feedback": "After *pentru că* comes a clause with a verb: *plouă*."}
  ro.a2.unit88.lesson01.exercise03.une_pentru_ca: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "De ce nu vii?", "right": "Why aren't you coming?"}, {"left": "Pentru că sunt obosit.", "right": "Because I am tired."}, {"left": "Nu merg la serviciu pentru că sunt bolnav.", "right": "I'm not going to work because I'm ill."}, {"left": "Rămân acasă pentru că plouă.", "right": "I'm staying home because it's raining."}, {"left": "Pentru că am mult de lucru.", "right": "Because I have a lot of work."}, {"left": "obosit", "right": "tired"}, {"left": "bolnav", "right": "ill"}, {"left": "ploaie", "right": "rain"}], "status": "correct"}], "feedback": "These are the words and phrases for asking why and giving a reason."}
