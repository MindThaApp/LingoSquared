  ro.a2.unit88.lesson03.exercise05.completeaza_asa: {"instruction": "Complete the Romanian sentence.", "correct_option": "așa", "accepted_answers": [{"value": "așa", "status": "correct"}], "feedback": "*Așa că* means 'so'."}
  ro.a2.unit88.lesson03.exercise06.traduce_timp: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Nu am timp, așa că nu merg la cinema.", "status": "correct"}, {"value": "Nu am timp, așa că nu merg la cinema", "status": "correct"}, {"value": "Nu am timp, de aceea nu merg la cinema.", "status": "correct"}, {"value": "Nu am timp, de aceea nu merg la cinema", "status": "correct"}], "feedback": "*Nu am timp, așa că nu merg la cinema.*"}
  ro.a2.unit88.lesson03.exercise07.scrie_asa_ca: {"instruction": "Write the requested sentence with *așa că*.", "correct_option": "Plouă, așa că rămânem acasă.", "accepted_answers": [{"value": "Plouă, așa că rămânem acasă.", "status": "correct"}, {"value": "Plouă, așa că rămânem acasă", "status": "correct"}], "feedback": "*Plouă, așa că rămânem acasă.*"}
  ro.a2.unit88.lesson04.exercise01.alege_intalnire: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Nu pot veni pentru că am întâlnire.", "distractors": ["Nu pot veni așa că am întâlnire.", "Nu pot veni pentru că întâlnire.", "Nu pot veni de ce am întâlnire."], "accepted_answers": [{"value": "Nu pot veni pentru că am întâlnire.", "status": "correct"}], "feedback": "*Pentru că* is followed by a verb: *am întâlnire*."}
  ro.a2.unit88.lesson04.exercise02.alege_taxi: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Trenul a întârziat, așa că am venit cu taxiul.", "distractors": ["Trenul a întârziat, pentru că am venit cu taxiul.", "Trenul a întârziat, așa că am venit taxiul.", "Trenul a întârziat, de ce am venit cu taxiul."], "accepted_answers": [{"value": "Trenul a întârziat, așa că am venit cu taxiul.", "status": "correct"}], "feedback": "*Așa că* gives the result, and *cu taxiul* is the means of transport."}
  ro.a2.unit88.lesson04.exercise03.une_motiv: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Scuze, am întâlnire.", "right": "Sorry, I have a meeting."}, {"left": "Nu pot veni pentru că am întâlnire.", "right": "I can't come because I have a meeting."}, {"left": "Nu pot veni pentru că am întâlnire, așa că vin mâine.", "right": "I can't come because I have a meeting, so I'm coming tomorrow."}, {"left": "Am venit cu taxiul.", "right": "I came by taxi."}, {"left": "Trenul a întârziat, așa că am venit cu taxiul.", "right": "The train was late, so I came by taxi."}, {"left": "întâlnire", "right": "meeting"}, {"left": "mâine", "right": "tomorrow"}, {"left": "cu", "right": "with, by"}], "status": "correct"}], "feedback": "These expressions combine a reason and a result."}
  ro.a2.unit88.lesson04.exercise04.ordine_nu_pot: {"instruction": "Put the words in order to say 'I can't come because I have a meeting.'", "correct_option": "Nu pot veni pentru că am întâlnire", "accepted_answers": [{"value": "Nu pot veni pentru că am întâlnire", "status": "correct"}], "feedback": "*Nu pot veni pentru că am întâlnire.*"}
  ro.a2.unit88.lesson04.exercise05.completeaza_am: {"instruction": "Complete the Romanian sentence.", "correct_option": "am", "accepted_answers": [{"value": "am", "status": "correct"}], "feedback": "*Am întâlnire* means 'I have a meeting'."}
  ro.a2.unit88.lesson04.exercise06.traduce_vin_maine: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Nu pot veni pentru că am întâlnire, așa că vin mâine.", "status": "correct"}, {"value": "Nu pot veni pentru că am întâlnire, așa că vin mâine", "status": "correct"}, {"value": "Nu pot veni deoarece am întâlnire, așa că vin mâine.", "status": "correct"}, {"value": "Nu pot veni deoarece am întâlnire, așa că vin mâine", "status": "correct"}], "feedback": "*Nu pot veni pentru că am întâlnire, așa că vin mâine.*"}
  ro.a2.unit88.lesson04.exercise07.scrie_taxi: {"instruction": "Write the requested sentence with *așa că*.", "correct_option": "Trenul a întârziat, așa că am venit cu taxiul.", "accepted_answers": [{"value": "Trenul a întârziat, așa că am venit cu taxiul.", "status": "correct"}, {"value": "Trenul a întârziat, așa că am venit cu taxiul", "status": "correct"}], "feedback": "*Trenul a întârziat, așa că am venit cu taxiul.*"}
  ro.a2.unit88.lesson05.exercise01.citeste_ana: {"instruction": "Read Ana's message and choose the answer.", "correct_option": "Because she is tired.", "distractors": ["Because it is raining.", "Because she is ill.", "Because the train was late."], "accepted_answers": [{"value": "Because she is tired.", "status": "correct"}], "feedback": "*Nu pot veni la film pentru că sunt obosită.*"}
  ro.a2.unit88.lesson05.exercise02.citeste_mihai: {"instruction": "Read Mihai's reply and choose the answer.", "correct_option": "Tomorrow.", "distractors": ["Today.", "On Sunday.", "They don't go."], "accepted_answers": [{"value": "Tomorrow.", "status": "correct"}], "feedback": "*Mergem mâine.*"}
  ro.a2.unit88.lesson05.exercise03.une_mesaje: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Nu pot veni la film pentru că sunt obosită.", "right": "I can't come to the film because I'm tired."}, {"left": "Am multă muncă, așa că vin acasă târziu.", "right": "I have a lot of work, so I get home late."}, {"left": "Pot veni mâine?", "right": "Can I come tomorrow?"}, {"left": "Nu e nimic.", "right": "It's nothing."}, {"left": "Deoarece ești obosită, rămâi acasă.", "right": "Because you're tired, stay at home."}, {"left": "Mergem mâine, așa că dormi bine!", "right": "We're going tomorrow, so sleep well!"}], "status": "correct"}], "feedback": "These lines come from the two messages."}
