source_language: en
target_language: ro
status: complete_draft
generation_provenance: {method: ai_generated, authoring_system: claude, human_reviewed: false}
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Romanian confirmation needed (DRAFT). Confirm the English
    glosses correctly describe the register each Romanian form belongs
    to (informal tu vs formal dumneavoastră; Salut/Pa vs Stimate domn/
    Stimată doamnă / Cu stimă / Cu deosebit respect; poți/imperative vs
    Ați putea / Ar fi posibil), that every matching_pairs right-hand
    gloss discriminates its left on real meaning, and that the
    culminating writing answers (lesson06 exercise06 and exercise07)
    accept the punctuation forms a correct learner would actually
    produce -- every comma/question-mark combination is supplied as its
    own accepted variant. See the realization file's review block for
    the full priority list.
  notes: >-
    Overlay for ro's fifth B2 unit (register -- adapting formality to
    the audience), authored alongside the realization. English speakers'
    real interference risks for this outcome: (1) English has ONE 'you',
    so the informal tu vs formal dumneavoastră split -- and the verb
    shift it forces (ai -> aveți, poți -> puteți, the 2nd-person-plural
    form used for polite singular) -- has no English anchor and is
    drilled explicitly in lesson01; (2) English requests can stay direct
    and still sound polite ('Can you...?'), whereas Romanian marks
    respect partly by shifting register and partly by going indirect
    (Ați putea / Ar fi posibil să) -- lesson03 contrasts the direct
    informal question against the indirect formal frames so a learner
    does not carry English directness into a formal Romanian letter; (3)
    letter openings/closings differ sharply by register (Salut/Pa vs
    Stimate domn/Stimată doamnă / Cu stimă / Cu deosebit respect) and are
    taught as fixed formulas in lesson02; (4) 'te rog' vs 'vă rog' encode
    the same tu/dumneavoastră split inside 'please'. This unit
    DELIBERATELY teaches both registers -- each individual exercise stays
    in one consistent register, and every production prompt names the
    register AND the frame wanted so a correct answer in the OTHER
    register is not marked wrong. The culminating lesson06 exercise07
    asks for the SAME request in BOTH registers; its accepted answers
    cover every internal/trailing punctuation combination. No
    sibling-direction file (ro-en b2) was consulted.

course:
  title: Romanian B2
  description: >-
    Upper-intermediate Romanian: adapt your formality to the audience --
    say the same thing appropriately to a close friend and to an
    institution. Switch between informal tu and formal dumneavoastră,
    between Salut/Pa and Stimate domn/Stimată doamnă / Cu stimă, and
    between a direct request (poți ...?) and an indirect polite one (Ar
    fi posibil să ...?), around the everyday task of rescheduling a
    meeting.

units:
  ro.b2.unit05.registru:
    title: "Register"
    description: Adapt your formality to who you are addressing -- deliver the same request appropriately to a close friend and to an institution, switching pronouns, greetings, closings and directness.

lessons:
  ro.b2.unit05.lesson01.tu_sau_dumneavoastra:
    title: "Tu or dumneavoastră?"
  ro.b2.unit05.lesson02.formule_de_adresare:
    title: "Greetings and closings"
  ro.b2.unit05.lesson03.direct_sau_politicos:
    title: "Direct or polite?"
  ro.b2.unit05.lesson04.reprogramarea_intalnirii:
    title: "Rescheduling the meeting"
  ro.b2.unit05.lesson05.doua_mesaje:
    title: "Two messages, two recipients"
  ro.b2.unit05.lesson06.alegerea_registrului:
    title: "Choosing the right register"

teaching:
  ro.b2.unit05.lesson01.teach.mihai_scrie:
    title: "Mihai is writing a message."
    gloss: "Mihai is writing a message."
    note: "The situation this whole unit works with: Mihai has to send the same request to two very different readers. *Un mesaj* = 'a message'."
  ro.b2.unit05.lesson01.teach.tu:
    title: "you (informal)"
    gloss: "you / your (informal)"
    note: "The informal 'you': *tu* as the subject ('you'), *tău* as the possessive ('your'), *te* as the object clitic ('you'). Use it with friends, family and peers -- like Mihai with Bogdan."
    example_gloss: "Please listen to me."
  ro.b2.unit05.lesson01.teach.dumneavoastra:
    title: "you (formal)"
    gloss: "you (formal, singular or plural)"
    note: "*Dumneavoastră* is the formal 'you' -- for strangers, officials and institutions. It takes the SAME verb form as the literal plural 'you all' (2nd-person plural), the heart of switching into the formal register."
    example_gloss: "You are right. (formal)"
  ro.b2.unit05.lesson01.teach.ai_timp:
    title: "Do you have time? (informal)"
    gloss: "Do you have time?"
    note: "Informal. *Ai* is the *tu* form of *a avea* ('to have')."
  ro.b2.unit05.lesson01.teach.aveti_timp:
    title: "Do you have time? (formal)"
    gloss: "Do you have time?"
    note: "Formal. *Aveți* is the *dumneavoastră* form of *a avea* -- the same form used for the literal plural 'you (all) have'. This verb shift is the heart of switching into the formal register."
  ro.b2.unit05.lesson01.teach.poti_ajuta:
    title: "Can you help me? (informal)"
    gloss: "Can you help me?"
    note: "Informal. *Poți* is the *tu* form of *a putea* ('can/to be able to'). Direct and perfectly polite between friends."
  ro.b2.unit05.lesson01.teach.puteti_ajuta:
    title: "Can you help me? (formal)"
    gloss: "Can you help me?"
    note: "Formal. *Puteți* -- again the *dumneavoastră* form. Same question as *Poți să mă ajuți?*, shifted up in formality."
  ro.b2.unit05.lesson01.teach.grammar_tu_dvs:
    title: "Do you have time? / Do you have time? Can you help me? / Can you help me?"
    gloss: "Do you have time? (informal / formal). Can you help me? (informal / formal)."
    note: "The core move of this unit: *tu -> dumneavoastră* changes the verb too. *ai -> aveți*, *poți -> puteți*. Choose *tu* for a friend and *dumneavoastră* for an institution."

  ro.b2.unit05.lesson02.teach.salut:
    title: "Hi"
    gloss: "Hi / Hello (informal)"
    note: "*Salut* is an informal greeting -- for a friend, a text, a chat. *Salut, Bogdan!* is exactly how Mihai opens a message to Bogdan."
    example_gloss: "Hi, Bogdan!"
  ro.b2.unit05.lesson02.teach.pa:
    title: "Bye"
    gloss: "Bye (informal sign-off)"
    note: "*Pa* is the informal way to sign off a message to a friend. Never use it in a formal letter."
    example_gloss: "Bye, see you soon!"
  ro.b2.unit05.lesson02.teach.stimate_domn_doamna:
    title: "Dear Sir or Madam"
    gloss: "Dear Sir or Madam"
    note: "*Stimate domn/Stimată doamnă* is the standard formal salutation when you don't know the reader's gender -- the opener for a letter or e-mail to an institution. *Domn* = 'sir/gentleman', *doamnă* = 'madam'."
  ro.b2.unit05.lesson02.teach.cu_stima:
    title: "With regards"
    gloss: "With regards / Sincerely"
    note: "*Cu stimă* ('with regard/esteem') is the everyday formal closing -- the standard way to end a polite letter or e-mail."
  ro.b2.unit05.lesson02.teach.cu_deosebit_respect:
    title: "With utmost respect"
    gloss: "With utmost respect (most formal)"
    note: "*Cu deosebit respect* is the MOST formal sign-off -- more distant than *Cu stimă*, for very official letters."
  ro.b2.unit05.lesson02.teach.draga:
    title: "Dear (neutral)"
    gloss: "Dear ... (neutral)"
    note: "*Dragă* + a name ('Dragă Bogdan,') is the neutral middle ground -- warmer than *Salut* but still fine in writing. It sits between the informal *Salut* and the formal *Stimate*."
    example_gloss: "Dear Bogdan,"
  ro.b2.unit05.lesson02.teach.grammar_salut:
    title: "Hi, Bogdan! Bye. Dear Sir or Madam, With regards."
    gloss: "Hi, Bogdan! Bye. Dear Sir or Madam, With regards."
    note: "Openings and closings come in matched registers. Informal: *Salut* ... *Pa*. Formal: *Stimate domn/Stimată doamnă* ... *Cu stimă* (or *Cu deosebit respect* for the most official). Mixing them reads as a mistake."

  ro.b2.unit05.lesson03.teach.poti_face_asta:
    title: "Can you do this? (informal)"
    gloss: "Can you do this?"
    note: "Informal and direct: *Poți face asta?* Between friends a direct request is the normal, friendly choice. *Asta* = 'this', *face* = 'to do'."
  ro.b2.unit05.lesson03.teach.te_rog:
    title: "please (informal)"
    gloss: "please (informal)"
    note: "*Te rog* is the informal 'please' -- it literally contains *te* ('you', informal). Use it with friends."
    example_gloss: "Can you do this, please?"
  ro.b2.unit05.lesson03.teach.va_rog:
    title: "please (formal)"
    gloss: "please (formal)"
    note: "*Vă rog* is the formal 'please' -- it contains *vă* ('you', formal). Same construction, one register up: *te rog* (tu) vs *vă rog* (dumneavoastră)."
    example_gloss: "Could you do this, please?"
  ro.b2.unit05.lesson03.teach.ati_putea:
    title: "Could you do this?"
    gloss: "Could you do this? (formal, polite)"
    note: "Formal and slightly indirect. *Ați putea* is the conditional-feeling formal form of *a putea* -- softer than a plain *puteți*."
  ro.b2.unit05.lesson03.teach.ar_fi_posibil:
    title: "Would it be possible...?"
    gloss: "Would it be possible...?"
    note: "*Ar fi posibil să ...?* ('would it be possible to...?') is a very common polite, indirect way to make a formal request -- it names no one, which makes it feel respectful."
  ro.b2.unit05.lesson03.teach.grammar_directete:
    title: "Can you do this? Could you do this? Would it be possible for you to do this?"
    gloss: "Can you do this? Could you do this? Would it be possible for you to do this?"
    note: "Directness is a register signal. Informal: a direct *Poți...?* Formal: *Ați putea...?* or the even more indirect *Ar fi posibil să...?* The more indirect, the more formal."

  ro.b2.unit05.lesson04.teach.intalnirea:
    title: "the meeting"
    gloss: "the meeting"
    note: "*Întâlnirea* = 'the meeting' -- a meeting time you've agreed with someone. This is what Mihai needs to change."
    example_gloss: "The meeting is tomorrow."
  ro.b2.unit05.lesson04.teach.a_reprograma:
    title: "reschedule"
    gloss: "reschedule (from a reprograma, to reschedule)"
    note: "*A reprograma* = 'to reschedule'. *Reprogramăm întâlnirea* = 'we reschedule the meeting'."
    example_gloss: "I want us to reschedule the meeting."
  ro.b2.unit05.lesson04.teach.lunea_asta:
    title: "this Monday"
    gloss: "this Monday"
  ro.b2.unit05.lesson04.teach.nu_pot:
    title: "I can't"
    gloss: "I can't (nu pot, from a putea)"
    example_gloss: "I can't this Monday."
  ro.b2.unit05.lesson04.teach.saptamana_viitoare:
    title: "next week"
    gloss: "next week"
  ro.b2.unit05.lesson04.teach.putem:
    title: "we can"
    gloss: "we can (from a putea)"
    note: "*Putem* is register-neutral -- it doesn't itself signal tu vs dumneavoastră, so the surrounding greeting/closing is what marks the register."
    example_gloss: "We can talk tomorrow."
  ro.b2.unit05.lesson04.teach.intrebare_informala:
    title: "Can we reschedule the meeting? (informal)"
    gloss: "Can we reschedule the meeting?"
    note: "The request in its informal form, to a friend: *Putem reprograma întâlnirea?* Direct, no softening frame."
  ro.b2.unit05.lesson04.teach.intrebare_formala:
    title: "Would it be possible to reschedule the meeting? (formal)"
    gloss: "Would it be possible to reschedule the meeting?"
    note: "The SAME request in formal form, to an institution: *Ar fi posibil să reprogramăm întâlnirea?* Indirect and polite."
  ro.b2.unit05.lesson04.teach.grammar_intalnire:
    title: "Can we reschedule the meeting? / Would it be possible to reschedule the meeting? / I can't this Monday."
    gloss: "Can we reschedule the meeting? (informal) / Would it be possible to reschedule the meeting? (formal) / I can't this Monday."
    note: "One request, two registers. Informal: *Putem reprograma întâlnirea?* Formal: *Ar fi posibil să reprogramăm întâlnirea?* Same content, different wrapping for a different reader -- the whole point of this unit."

  ro.b2.unit05.lesson05.teach.convine:
    title: "suits / is convenient"
    gloss: "suits / is convenient (from a conveni)"
    note: "*Convine* = '(for a time) suits / is convenient'. A polite, slightly formal way to propose a new time."
    example_gloss: "Tomorrow suits me."
  ro.b2.unit05.lesson05.teach.va_ar_conveni:
    title: "Would it suit you?"
    gloss: "Would it suit you? (formal)"
    note: "*V-ar conveni...?* = 'would it suit you?' -- *v-ar* fuses *vă* ('you', formal) + *ar* ('would'), the polite counterpart to the informal *Poate...?*"
  ro.b2.unit05.lesson05.teach.tekst_informal:
    title: "Informal message (to Bogdan)"
    gloss: "Hi, Bogdan! Can we reschedule the meeting? I can't this Monday. Maybe next week? Bye, Mihai"
    glosses:
      Salut: "Hi (informal greeting)"
      Bogdan: "Bogdan (Mihai's friend)"
      Putem: "can we (form of a putea)"
      reprograma: "reschedule"
      întâlnirea: "the meeting"
      Nu: not
      pot: "I can (form of a putea)"
      lunea: Monday
      asta: this
      Poate: maybe
      săptămâna: week
      viitoare: next
      Pa: "Bye (informal sign-off)"
      Mihai: Mihai
  ro.b2.unit05.lesson05.teach.tekst_formal:
    title: "Formal message (to an institution)"
    gloss: "Dear Sir or Madam, Would it be possible to reschedule the meeting? I can't this Monday. Would next week suit you? With regards, Mihai"
    glosses:
      Stimate: "Dear (formal salutation)"
      domn: Sir
      Stimată: "Dear (formal, feminine)"
      doamnă: Madam
      Ar: "would (polite request)"
      fi: be
      posibil: possible
      reprogramăm: "we reschedule"
      întâlnirea: "the meeting"
      Nu: not
      pot: "I can"
      lunea: Monday
      asta: this
      V-ar: "would it (to you, formal)"
      conveni: "suit / be convenient"
      săptămâna: week
      viitoare: next
      Cu: with
      stimă: regard

  ro.b2.unit05.lesson06.teach.nicio_problema:
    title: "No problem."
    gloss: "No problem."
    note: "*Nicio problemă* = 'no problem' -- a relaxed, informal reply."
  ro.b2.unit05.lesson06.teach.cand_poti:
    title: "When can you?"
    gloss: "When can you? (informal)"
    note: "*Când poți?* is a natural follow-up after someone says they can't make a time."
  ro.b2.unit05.lesson06.teach.primaria:
    title: "the city hall"
    gloss: "the city hall / municipality"
    note: "*Primăria* = 'the city hall' -- the local government office, a classic institution you'd write to formally."
    example_gloss: "I'm writing to the city hall."
  ro.b2.unit05.lesson06.teach.scriu_scrii:
    title: "I write / you write"
    gloss: "I write / you write (from a scrie, to write)"
    example_gloss: "I'm writing to Diana."
  ro.b2.unit05.lesson06.teach.altfel:
    title: "differently"
    gloss: "differently"
    note: "*Altfel* = 'differently'. *La primărie scrii altfel* = 'to the city hall you write differently' -- exactly the skill of this unit."
    example_gloss: "To the city hall you write differently."
  ro.b2.unit05.lesson06.teach.dialogue_mihai_setup:
    title: "Mihai: Hi, Bogdan! Can we reschedule the meeting? I can't this Monday."
    gloss: "Mihai: Hi, Bogdan! Can we reschedule the meeting? I can't this Monday."
  ro.b2.unit05.lesson06.teach.dialogue_bogdan_ok:
    title: "Bogdan: No problem. When can you?"
    gloss: "Bogdan: No problem. When can you?"
  ro.b2.unit05.lesson06.teach.dialogue_mihai_primarie:
    title: "Mihai: Next week? I also have to write to the city hall."
    gloss: "Mihai: Next week? I also have to write to the city hall."
  ro.b2.unit05.lesson06.teach.dialogue_bogdan_altfel:
    title: "Bogdan: Yeah, to the city hall you write differently, of course."
    gloss: "Bogdan: Yeah, to the city hall you write differently, of course."
  ro.b2.unit05.lesson06.teach.grammar_ambele_registre:
    title: "Can you reschedule the meeting? / Could you reschedule the meeting?"
    gloss: "Can you reschedule the meeting? (informal) / Could you reschedule the meeting? (formal)"
    note: "This is what you produce in this lesson: one request, delivered in the register that fits each reader. Informal to Bogdan: *Poți reprograma întâlnirea?* Formal to an institution: *Ați putea reprograma întâlnirea?*"

exercises:
  ro.b2.unit05.lesson01.exercise01.recognize_dumneavoastra:
    instruction: "Who do you address as 'dumneavoastră'?"
    correct_option: "someone you treat formally (a stranger or an institution)"
    distractors: ["a close friend", "a child in your family", "your best friend"]
    accepted_answers: [{value: "someone you treat formally (a stranger or an institution)", status: correct}]
    feedback: "Dumneavoastră is the formal 'you' -- for strangers, officials and institutions. For a friend you use tu."
  ro.b2.unit05.lesson01.exercise02.listen_aveti_timp:
    instruction: "Listen and select what you hear."
    correct_option: "Do you have time? (formal)"
    distractors: ["Do you have time? (informal)", "Can you help? (formal)", "Do you have a moment? (informal)"]
    accepted_answers: [{value: "Do you have time? (formal)", status: correct}]
    feedback: "Aveți timp? is the formal 'do you have time?' -- dumneavoastră takes the -ți form aveți."
  ro.b2.unit05.lesson01.exercise03.match_pronouns:
    instruction: "Match each Romanian word or phrase with its meaning and register."
    accepted_answers:
      - value: {tu: "you (informal, subject)", tău: "your (informal)", te: "you (informal, object)", dumneavoastră: "you (formal)", "poți să mă ajuți": "can you help me (informal)", "puteți să mă ajutați": "can you help me (formal)", "ai timp": "do you have time (informal)", "aveți timp": "do you have time (formal)"}
        status: correct
    feedback: "tu/tău/te are the informal set; dumneavoastră is the formal set -- and the verb follows (poți vs puteți)."
  ro.b2.unit05.lesson01.exercise04.order_ai_timp:
    instruction: "Put the words in order, informal: Do you have time?"
    accepted_answers:
      - {value: "Ai timp", status: correct}
    feedback: "Ai timp? -- the informal tu form of a avea."
  ro.b2.unit05.lesson01.exercise05.translate_aveti_timp:
    instruction: "Translate into Romanian, formal (addressing the person as dumneavoastră): Do you have time?"
    accepted_answers:
      - {value: "Aveți timp", status: correct}
    feedback: "Aveți timp? -- with dumneavoastră the verb is aveți, not ai."
  ro.b2.unit05.lesson01.exercise06.translate_poti_ajuta:
    instruction: "Translate into Romanian, informal (addressing the person as tu): Can you help me?"
    accepted_answers:
      - {value: "Poți să mă ajuți", status: correct}
    feedback: "Poți să mă ajuți? -- the informal tu form of a putea."
  ro.b2.unit05.lesson01.exercise07.speak_puteti_ajuta:
    instruction: "Say aloud in Romanian, formal (addressing the person as dumneavoastră): Can you help me?"
    accepted_answers:
      - {value: "Puteți să mă ajutați", status: correct}
    feedback: "Puteți să mă ajutați? -- with dumneavoastră the verb is puteți, not poți."
  ro.b2.unit05.lesson01.exercise08.dictation_aveti_timp:
    instruction: "Type what you hear."
    correct_response: "Aveți timp"
    orthography_strict: true
    feedback: "You heard Aveți timp? -- the formal 'do you have time?', with dumneavoastră the verb takes the -ți form aveți."

  ro.b2.unit05.lesson02.exercise01.recognize_stimate:
    instruction: "When would you write 'Stimate domn/Stimată doamnă'?"
    correct_option: "to open a formal letter to someone whose gender you don't know"
    distractors: ["to text a friend", "to sign off a message to your sister", "to greet a child"]
    accepted_answers: [{value: "to open a formal letter to someone whose gender you don't know", status: correct}]
    feedback: "Stimate domn/Stimată doamnă is the formal salutation when the reader is unknown -- for an institution, not a friend."
  ro.b2.unit05.lesson02.exercise02.listen_cu_stima:
    instruction: "Listen and select what you hear."
    correct_option: "With regards (formal closing)"
    distractors: ["Bye (informal sign-off)", "Dear Sir or Madam (formal opening)", "With utmost respect (most formal closing)"]
    accepted_answers: [{value: "With regards (formal closing)", status: correct}]
    feedback: "Cu stimă is the everyday formal closing -- 'with regards'."
  ro.b2.unit05.lesson02.exercise03.match_openers_closers:
    instruction: "Match each opening or closing with its meaning and register."
    accepted_answers:
      - value: {Salut: "informal 'hi'", Pa: "informal sign-off (bye)", "Stimate domn/Stimată doamnă": "formal salutation (Dear Sir or Madam)", "Cu stimă": "formal closing (with regards)", "Cu deosebit respect": "most formal closing (with utmost respect)", Dragă: "neutral 'Dear' + name"}
        status: correct
    feedback: "Informal Salut/Pa, neutral Dragă, formal Stimate domn/Stimată doamnă / Cu stimă, most formal Cu deosebit respect."
  ro.b2.unit05.lesson02.exercise04.order_cu_stima:
    instruction: "Put the words in order, the formal closing: With regards."
    accepted_answers:
      - {value: "Cu stimă", status: correct}
    feedback: "Cu stimă -- the standard formal sign-off."
  ro.b2.unit05.lesson02.exercise05.translate_stimate:
    instruction: "Write the formal Romanian salutation for a letter to someone you don't know: Dear Sir or Madam."
    accepted_answers:
      - {value: "Stimate domn/Stimată doamnă", status: correct}
      - {value: "Stimate domn/Stimată doamnă,", status: correct}
    feedback: "Stimate domn/Stimată doamnă -- the formal opening when you don't know the reader's gender."
  ro.b2.unit05.lesson02.exercise06.write_pa:
    instruction: "Write an informal Romanian sign-off to a friend: Bye."
    accepted_answers:
      - {value: "Pa", status: correct}
    feedback: "Pa -- the informal way to close a message to a friend."
  ro.b2.unit05.lesson02.exercise07.recognize_most_formal:
    instruction: "Which closing is the MOST formal?"
    correct_option: "Cu deosebit respect"
    distractors: [Pa, Salut, Dragă]
    accepted_answers: [{value: "Cu deosebit respect", status: correct}]
    feedback: "Cu deosebit respect ('with utmost respect') is the most formal sign-off -- more distant than Cu stimă."

  ro.b2.unit05.lesson03.exercise01.recognize_va_rog:
    instruction: "What does this phrase mean, and in which register?"
    correct_option: "please (formal)"
    distractors: ["please (informal)", "thank you (formal)", "you're welcome (formal)"]
    accepted_answers: [{value: "please (formal)", status: correct}]
    feedback: "Vă rog is the formal 'please' (it contains vă); te rog is the informal one (it contains te)."
  ro.b2.unit05.lesson03.exercise02.listen_ati_putea:
    instruction: "Listen and select what you hear."
    correct_option: "Could you do this? (formal)"
    distractors: ["Can you do it? (informal)", "Do you want to do it? (informal)", "Would it be possible to do it? (formal)"]
    accepted_answers: [{value: "Could you do this? (formal)", status: correct}]
    feedback: "Ați putea face asta? is the formal, polite request -- 'could you do this?'."
  ro.b2.unit05.lesson03.exercise03.match_directness:
    instruction: "Match each form with its meaning and register."
    accepted_answers:
      - value: {"poți face asta": "can you do this (informal, direct)", "te rog": "please (informal)", "vă rog": "please (formal)", "ați putea": "could you (formal, polite)", "ar fi posibil": "would it be possible", face: "to do"}
        status: correct
    feedback: "Informal and direct: poți, te rog. Formal and polite: ați putea, vă rog, ar fi posibil."
  ro.b2.unit05.lesson03.exercise04.order_ati_putea:
    instruction: "Put the words in order, formal and polite: Could you do this?"
    accepted_answers:
      - {value: "Ați putea face asta", status: correct}
    feedback: "Ați putea face asta? -- the formal register softens the request."
  ro.b2.unit05.lesson03.exercise05.translate_poti_face:
    instruction: "Translate into Romanian, informal and direct (using poți): Can you do this?"
    accepted_answers:
      - {value: "Poți face asta", status: correct}
    feedback: "Poți face asta? -- direct is the friendly, normal choice between friends."
  ro.b2.unit05.lesson03.exercise06.translate_ati_putea:
    instruction: "Translate into Romanian, formal and polite (using Ați putea): Could you do this?"
    accepted_answers:
      - {value: "Ați putea face asta", status: correct}
    feedback: "Ați putea face asta? -- the formal register goes softer to sound respectful."
  ro.b2.unit05.lesson03.exercise07.speak_ar_fi_posibil:
    instruction: "Say aloud in Romanian, formal (using Ar fi posibil): Would it be possible?"
    accepted_answers:
      - {value: "Ar fi posibil", status: correct}
    feedback: "Ar fi posibil? -- a very common polite, indirect formal frame."

  ro.b2.unit05.lesson04.exercise01.recognize_reprograma:
    instruction: "What does this word mean?"
    correct_option: "to reschedule"
    distractors: ["to cancel", "to confirm", "to attend"]
    accepted_answers: [{value: "to reschedule", status: correct}]
    feedback: "Reprograma means to move a meeting to another time -- to reschedule."
  ro.b2.unit05.lesson04.exercise02.listen_putem_reprograma:
    instruction: "Listen and select what you hear."
    correct_option: "Can we reschedule the meeting? (informal)"
    distractors: ["Would it be possible to reschedule the meeting? (formal)", "Can we cancel the meeting? (informal)", "Do we have a meeting? (informal)"]
    accepted_answers: [{value: "Can we reschedule the meeting? (informal)", status: correct}]
    feedback: "Putem reprograma întâlnirea? is the informal form of the request -- direct, no softening frame."
  ro.b2.unit05.lesson04.exercise03.match_appointment_words:
    instruction: "Match each Romanian word or phrase with its meaning."
    accepted_answers:
      - value: {întâlnirea: "the meeting", reprograma: "to reschedule", "lunea asta": "this Monday", "săptămâna viitoare": "next week", "nu pot": "I can't", putem: "we can"}
        status: correct
    feedback: "These are the words the request is built from -- the same content will be wrapped in either register."
  ro.b2.unit05.lesson04.exercise04.order_intrebare_formala:
    instruction: "Put the words in order, formal: Would it be possible to reschedule the meeting?"
    accepted_answers:
      - {value: "Ar fi posibil să reprogramăm întâlnirea", status: correct}
    feedback: "Ar fi posibil să reprogramăm întâlnirea? -- the indirect, polite formal request."
  ro.b2.unit05.lesson04.exercise05.translate_intrebare_informala:
    instruction: "Translate into Romanian, informal (to your friend Bogdan): Can we reschedule the meeting?"
    accepted_answers:
      - {value: "Putem reprograma întâlnirea", status: correct}
    feedback: "Putem reprograma întâlnirea? -- direct and informal, for a friend."
  ro.b2.unit05.lesson04.exercise06.translate_intrebare_formala:
    instruction: "Translate into Romanian, formal (to an institution, using Ar fi posibil): Would it be possible to reschedule the meeting?"
    accepted_answers:
      - {value: "Ar fi posibil să reprogramăm întâlnirea", status: correct}
    feedback: "Ar fi posibil să reprogramăm întâlnirea? -- the SAME request, wrapped for an institution."
  ro.b2.unit05.lesson04.exercise07.write_nu_pot:
    instruction: "Write in Romanian, keeping the word order Nu pot lunea asta: I can't this Monday."
    accepted_answers:
      - {value: "Nu pot lunea asta", status: correct}
    feedback: "Nu pot lunea asta -- the everyday way to decline a time, in either register."
  ro.b2.unit05.lesson04.exercise08.dictation_putem_reprograma:
    instruction: "Type what you hear."
    correct_response: "Putem reprograma întâlnirea"
    orthography_strict: true
    feedback: "You heard Putem reprograma întâlnirea? -- 'can we reschedule the meeting?', the informal we-form for asking to move a meeting."

  ro.b2.unit05.lesson05.exercise01.read_friend:
    instruction: "Which message is written to a close friend?"
    correct_option: "The one that opens 'Salut, Bogdan!' and signs off 'Pa'."
    distractors: ["The one that opens 'Stimate domn/Stimată doamnă' and signs off 'Cu stimă'.", "Neither -- both are formal.", "Both are informal."]
    accepted_answers: [{value: "The one that opens 'Salut, Bogdan!' and signs off 'Pa'.", status: correct}]
    feedback: "Salut, Bogdan! and Pa are informal -- markers of a message to a friend."
  ro.b2.unit05.lesson05.exercise02.read_institution:
    instruction: "Which message is written to an institution?"
    correct_option: "The one that opens 'Stimate domn/Stimată doamnă' and signs off 'Cu stimă'."
    distractors: ["The one that opens 'Salut, Bogdan!' and signs off 'Pa'.", "Neither -- both are informal.", "Both are formal."]
    accepted_answers: [{value: "The one that opens 'Stimate domn/Stimată doamnă' and signs off 'Cu stimă'.", status: correct}]
    feedback: "Stimate domn/Stimată doamnă and Cu stimă are formal -- markers of a message to an institution."
  ro.b2.unit05.lesson05.exercise03.read_same_request:
    instruction: "Both messages make the SAME request. What is it?"
    correct_option: "To reschedule the meeting."
    distractors: ["To cancel the meeting.", "To confirm Monday.", "To ask for directions."]
    accepted_answers: [{value: "To reschedule the meeting.", status: correct}]
    feedback: "Both ask to reschedule (reprograma întâlnirea) -- same content, different register."
  ro.b2.unit05.lesson05.exercise04.read_signal:
    instruction: "Which feature marks the second message as the one for an institution?"
    correct_option: "It uses 'V-ar conveni' and 'Ar fi posibil', not 'Poate' and 'Putem'."
    distractors: ["It is shorter.", "It asks about a different day.", "It does not mention the meeting."]
    accepted_answers: [{value: "It uses 'V-ar conveni' and 'Ar fi posibil', not 'Poate' and 'Putem'.", status: correct}]
    feedback: "The formal message marks its audience through the indirect V-ar conveni and Ar fi posibil frames."
  ro.b2.unit05.lesson05.exercise05.match_register_features:
    instruction: "Match each register feature with what it is."
    accepted_answers:
      - value: {"Salut, Bogdan!": "informal greeting (to a friend)", "Stimate domn/Stimată doamnă": "formal greeting (to an institution)", Pa: "informal closing", "Cu stimă": "formal closing", convine: "suits / is convenient", "săptămâna viitoare": "next week"}
        status: correct
    feedback: "The greetings and closings are what most clearly signal who each message is for."
  ro.b2.unit05.lesson05.exercise06.translate_va_ar_conveni:
    instruction: "Translate into Romanian, formal, using convine: Would next week suit?"
    accepted_answers:
      - {value: "V-ar conveni săptămâna viitoare", status: correct}
    feedback: "V-ar conveni săptămâna viitoare? -- convine ('to suit') is the polite, formal way to propose a new time."
  ro.b2.unit05.lesson05.exercise07.write_poate_saptamana:
    instruction: "Write in Romanian, informal: Maybe next week?"
    accepted_answers:
      - {value: "Poate săptămâna viitoare", status: correct}
    feedback: "Poate săptămâna viitoare? -- the informal way to propose next week to a friend."

  ro.b2.unit05.lesson06.exercise01.comprehend_register_fit:
    instruction: "How does Mihai address Bogdan, and does that register fit the situation?"
    correct_option: "Informally, with 'tu' -- and it fits, because Bogdan is a close friend."
    distractors: ["Formally, with 'dumneavoastră' -- and it fits, because he is a stranger.", "Informally, with 'tu' -- but it does not fit; he should use 'dumneavoastră'.", "Formally, with 'dumneavoastră' -- but it does not fit; he should use 'tu'."]
    accepted_answers: [{value: "Informally, with 'tu' -- and it fits, because Bogdan is a close friend.", status: correct}]
    feedback: "Mihai uses the informal tu with Bogdan, which is exactly right for a friend -- the register fits the audience."
  ro.b2.unit05.lesson06.exercise02.comprehend_mismatch:
    instruction: "What would it signal if Mihai wrote to the primărie in the SAME informal way he talks to Bogdan?"
    correct_option: "It would come across as too casual and disrespectful for an institution."
    distractors: ["It would come across as more efficient and clear.", "It would come across as too formal and distant.", "It would make no difference at all."]
    accepted_answers: [{value: "It would come across as too casual and disrespectful for an institution.", status: correct}]
    feedback: "As Bogdan says, 'la primărie scrii altfel' -- informal register with an institution reads as too casual."
  ro.b2.unit05.lesson06.exercise03.comprehend_request:
    instruction: "What does Mihai want to do?"
    correct_option: "Reschedule the meeting."
    distractors: ["Cancel the meeting for good.", "Meet Bogdan on Monday after all.", "Complain to the city hall."]
    accepted_answers: [{value: "Reschedule the meeting.", status: correct}]
    feedback: "Mihai asks 'putem reprograma întâlnirea?' -- he wants to reschedule."
  ro.b2.unit05.lesson06.exercise04.speak_informal:
    instruction: "Say aloud in Romanian the SAME request, first to your friend Bogdan -- informal, using poți: Can you reschedule the meeting?"
    accepted_answers:
      - {value: "Poți reprograma întâlnirea", status: correct}
    feedback: "Poți reprograma întâlnirea? -- direct and informal, the right register for Bogdan."
  ro.b2.unit05.lesson06.exercise05.speak_formal:
    instruction: "Now say aloud in Romanian the SAME request to an institution -- formal, using Ați putea: Could you reschedule the meeting?"
    accepted_answers:
      - {value: "Ați putea reprograma întâlnirea", status: correct}
    feedback: "Ați putea reprograma întâlnirea? -- polite and formal, the right register for an institution."
  ro.b2.unit05.lesson06.exercise06.write_rewrite_formal:
    instruction: "Rewrite this informal message to Bogdan as a FORMAL one to an institution. Informal: 'Salut, Bogdan, poți reprograma întâlnirea?' Write the formal version as two parts: the salutation Stimate domn/Stimată doamnă, then the request using Ați putea."
    accepted_answers:
      - {value: "Stimate domn/Stimată doamnă, Ați putea reprograma întâlnirea?", status: correct}
      - {value: "Stimate domn/Stimată doamnă, Ați putea reprograma întâlnirea", status: correct}
      - {value: "Stimate domn/Stimată doamnă Ați putea reprograma întâlnirea?", status: correct}
      - {value: "Stimate domn/Stimată doamnă Ați putea reprograma întâlnirea", status: correct}
    feedback: "The formal rewrite swaps 'Salut, Bogdan' for 'Stimate domn/Stimată doamnă' and the direct question for the softer 'Ați putea reprograma întâlnirea?'."
  ro.b2.unit05.lesson06.exercise07.write_both_registers:
    instruction: "Write the SAME request TWICE. (1) informally to your friend Bogdan, using poți: Can you reschedule the meeting? (2) formally to an institution, using Ați putea: Could you reschedule the meeting?"
    accepted_answers:
      - {value: "Poți reprograma întâlnirea? Ați putea reprograma întâlnirea?", status: correct}
      - {value: "Poți reprograma întâlnirea? Ați putea reprograma întâlnirea", status: correct}
      - {value: "Poți reprograma întâlnirea Ați putea reprograma întâlnirea?", status: correct}
      - {value: "Poți reprograma întâlnirea Ați putea reprograma întâlnirea", status: correct}
    feedback: "Same request, two registers: informal 'Poți reprograma întâlnirea?' for Bogdan, formal 'Ați putea reprograma întâlnirea?' for an institution."
