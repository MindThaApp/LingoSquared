course:
  title: Romanian B1
  description: >-
    Intermediate Romanian: reporting what someone said or asked with "a
    spus că" (said that) and "a întrebat dacă" (asked whether), without
    reproducing the original speaker's exact words.

units:
  ro.b1.unit15.vorbire_indirecta:
    title: "What Mihai Said"
    description: Report what someone else said or asked using "a spus că" (said that) and "a întrebat dacă" (asked whether), across everyday messages and workplace topics.

