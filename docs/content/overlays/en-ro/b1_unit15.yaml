  ro.b1.unit15.lesson05.wrapup_production:
    title: "Wrap-up"

teaching:
  ro.b1.unit15.lesson01.teach.mihai_a_spus_ca_intarzie:
    title: "Mihai said that he is running a bit late today"
    gloss: "Mihai said that he is running a bit late today"
    note: "*a spus că* reports what someone said, without repeating their exact words. Romanian keeps the original tense after *că*: *întârzie* stays present."
    example_gloss: "Mihai wrote a message. Mihai said that he is running a bit late today."
  ro.b1.unit15.lesson01.teach.din_cauza_traficului:
    title: "because of the traffic"
    gloss: "because of the traffic"
    example_gloss: "Mihai said that he is running a bit late today, because of the traffic."
  ro.b1.unit15.lesson01.teach.grammar_reported_statement:
    title: "Mihai said that he is running a bit late today. \"A spus că\" reports what someone else said, without us repeating their exact words."
    gloss: "Mihai said that he is running a bit late today. \"A spus că\" reports what someone else said, without us repeating their exact words."
    note: "The unit's core construction for reporting a statement."

  ro.b1.unit15.lesson02.teach.diana_a_intrebat_daca_mai_avem_timp:
    title: "Diana asked whether we still have time until the deadline"
    gloss: "Diana asked whether we still have time until the deadline"
    note: "*a întrebat dacă* -- genuinely new: reports a yes/no question, without repeating the exact question."
    example_gloss: "Diana wrote an email. Diana asked whether we still have time until the deadline."
  ro.b1.unit15.lesson02.teach.am_raspuns_ca_da:
    title: "I answered that yes, we still have time"
    gloss: "I answered that yes, we still have time"
    example_gloss: "Diana asked whether we still have time. I answered that yes, we still have time."
  ro.b1.unit15.lesson02.teach.grammar_reported_question:
    title: "Diana asked whether we still have time. \"A întrebat dacă\" reports a yes/no question, without us repeating the exact question."
    gloss: "Diana asked whether we still have time. \"A întrebat dacă\" reports a yes/no question, without us repeating the exact question."
    note: "The unit's second construction, for reporting a yes/no question rather than a statement."

  ro.b1.unit15.lesson03.teach.mihai_a_scris_un_mesaj:
    title: "Mihai wrote a message to Ana"
    gloss: "Mihai wrote a message to Ana"
    example_gloss: "It is early morning. Mihai wrote a message to Ana."
