schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit15_travel.yaml for full detail.
    This unit's source PDF (US Peace Corps Moldova's "Basic Romanian
    Language Lessons") was checked for train/ticket/travel material and
    found real, directly relevant hits: Lesson 7's own example "Tu nu ai
    bilet." (You don't have a ticket.) confirms "bilet" (ticket), Lesson
    8's own example "Trenul tău pleacă mîine." (Your train leaves
    tomorrow.) confirms "tren" (train) and "pleacă" (leaves/departs),
    and Lesson 17's listening exercise closes a travel-departure
    exchange with "Drum bun." (Have a safe trip.) This exact Lesson 17
    exchange was already checked by ro's own unit10 (routines) and
    found not reusable there -- unit10 never actually taught
    bilet/tren/pleacă/Drum bun as vocabulary, so this is the first unit
    to do so. No source material covers train platforms, so "peron"
    (platform) is freely authored fresh, disclosed honestly: basic-tier,
    extremely common Romanian train-travel vocabulary with no plausible
    substitute, independently confidence-checked. "București" (this
    course's own dialect-appropriate destination city, standard Romania
    Romanian rather than the source's Moldovan "Chişinău") is likewise
    freshly authored. Glosses/notes here are freshly authored to explain
    the target-language forms to an English speaker.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    realization file's own review pass. Checked clean: correct_response/
    accepted_answers shapes match the realization's word_bank/pairs, no
    same-speaker distractor collisions, no stray YAML booleans, no
    jargon leaks, English glosses/notes are accurate translations of
    the Romanian forms as authored. Fifteenth Romanian overlay, first
    draft, authored alongside the paired realization.

    Second-pass review 2026-10-19: 6 fixes - answer_policy.diacritics
    promised a tolerance the grader does not apply (rewritten); tren,
    peron and bilet notes called these neuter nouns masculine (3 notes
    corrected); reminder_as_dori_va_rog_cat_costa and
    as_dori_bilet_bucuresti notes credited aș dori/vă rog to unit07 only
    (they come from unit06 too); exercise09.write_travel_message was
    underdetermined (any time/platform/destination; instruction now
    names this unit's facts, added the missing combinations). NATIVE
    FLAGS: 'un bilet la București' and 'Trenul pleacă la București' are
    colloquially common; a native may prefer 'pentru/spre București' -
    left unchanged.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with
    comma-below ș/ț. Free-typed answers are graded against these
    standard spellings: the grader does not fold away omitted
    diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should
    type the full standard spelling.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    This unit's own new vocabulary (tren, pleacă, bilet, peron,
    București, Drum bun) is entirely person-invariant and carries no
    register distinction of its own. Ana and Mihai's dialogue keeps
    their existing formal register with each other; no new
    tu/dumneavoastră form is introduced this unit.

course:
  title: "Romanian A1"
  description: >-
    Handling a basic train journey in Romanian -- Tren (train), Bilet
    (ticket), Peron (platform), and Pleacă (leaves/departs) -- as Mihai
    catches a train to București and Ana sees him off at the gară.

units:
  ro.a1.unit15.travel:
    title: "Travel"

lessons:
  ro.a1.unit15.lesson01.trenul_pleaca:
    title: "The train leaves"
  ro.a1.unit15.lesson02.un_bilet_va_rog:
    title: "A ticket, please"
  ro.a1.unit15.lesson03.la_gara:
    title: "At the train station"

teaching:
  ro.a1.unit15.lesson01.teach.reminder_gara_ora:
    title: "Reminder: gară, este, la, ce, oră, ora, nouă"
    gloss: "gară (train station) · este (is) · la (at/to) · ce (what) · oră (hour) · ora (the hour) · nouă (nine)"
    note: >-
      Gară is from unit08/unit09; este/la/ce/oră/ora/nouă are from
      unit04 (time) -- this unit reuses unit04's own "la ce oră"/"la
      ora nouă" pattern for a new purpose, asking about a train instead
      of a class.

  ro.a1.unit15.lesson01.teach.tren_vocab:
    title: "Train"
    gloss: "Tren (train)"
    note: "Neuter, consonant-ending (in the singular, neuter nouns behave like masculine ones: *un tren*) -- takes *-ul* for 'the train,' the same ending as *magazin*->*magazinul*; *-ă* nouns like *gară* take *-a* instead (*gara*)."
    example_gloss:
      - "The train is at the station."

  ro.a1.unit15.lesson01.teach.pleaca_vocab:
    title: "Leaves / departs"
    gloss: "Pleacă (leaves / departs, he/she/it)"
    note: "The verb for a train, bus, or plane leaving. *Trenul pleacă* -- no *este* needed, since *pleacă* is already a full verb."
    example_gloss:
      - "The train leaves."

  ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase:
    title: "The train leaves at nine"
    gloss: "Trenul pleacă la ora nouă. (The train leaves at nine o'clock.)"
    note: "Combines *trenul* + *pleacă* with unit04's own *la ora nouă* -- no new time vocabulary needed."

  ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase:
    title: "What time does the train leave?"
    gloss: "La ce oră pleacă trenul? (What time does the train leave?)"
    note: "Unit04's own *La ce oră...?* question frame, now asking about *trenul* instead of a class."

  ro.a1.unit15.lesson01.teach.peron_vocab:
    title: "Platform"
    gloss: "Peron (platform)"
    note: "A train platform. Neuter, consonant-ending, so 'the platform' is *peronul* -- the same *-ul* ending as *tren*->*trenul*."
    example_gloss:
      - "The train is at platform three."

  ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase:
    title: "From which platform does the train leave?"
    gloss: "De la ce peron pleacă trenul? (From which platform does the train leave?)"
    note: "*De la* (from) + *ce peron* (which platform) -- every word here was already taught, just combined into a new question."

  ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa:
    title: "Reminder: aș dori, vă rog, cât costă, costă, lei"
    gloss: "aș dori (I would like) · vă rog (please, formal) · cât costă (how much does it cost) · costă (it costs) · lei (lei, currency)"
    note: >-
      All from unit06 (food) and unit07 (shopping) -- this unit reuses
      the same polite-request and price language for buying a train
      ticket instead of food.

  ro.a1.unit15.lesson02.teach.bilet_vocab:
    title: "Ticket"
    gloss: "Bilet (ticket)"
    note: "A train ticket. Neuter (it takes *un* in the singular, like a masculine noun), so 'a ticket' is *un bilet*."
    example_gloss:
      - "I have a ticket."

  ro.a1.unit15.lesson02.teach.bucuresti_vocab:
    title: "Bucharest"
    gloss: "București (Bucharest)"
    note: "Romania's capital city -- the natural example destination in this course."
    example_gloss:
      - "The train leaves for Bucharest."

  ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase:
    title: "I would like a ticket to Bucharest, please"
    gloss: "Aș dori un bilet la București, vă rog. (I would like a ticket to Bucharest, please.)"
    note: "The *Aș dori... vă rog* politeness frame from unit06/unit07, now requesting a ticket instead of food."

  ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase:
    title: "How much does a ticket to Bucharest cost?"
    gloss: "Cât costă un bilet la București? (How much does a ticket to Bucharest cost?)"
    note: "Unit07's own *Cât costă...?* price question, now asking about a ticket instead of a kilogram of potatoes."

  ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase:
    title: "It costs ten lei"
    gloss: "Costă zece lei. (It costs ten lei.)"
    note: "Zece (ten) is within the 2-19 range, so no *de* is needed before *lei* -- the same rule unit07 already established."

  ro.a1.unit15.lesson03.teach.reminder_travel_words:
    title: "Reminder: tren, pleacă, peron, bilet, București, trei, am"
    gloss: "tren (train) · pleacă (leaves/departs) · peron (platform) · bilet (ticket) · București (Bucharest) · trei (three, from unit02) · am (I have, from unit02)"
    note: "Tren/pleacă/peron/bilet/București are from this unit's own lesson01/lesson02; trei and am are re-declared here from unit02 (numbers), since Ana and Mihai now use 'peronul trei' and 'am un bilet' together at the station."

  ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: "Reminder: bună, mulțumesc, la revedere, Ana, Mihai"
    gloss: "bună (hi) · mulțumesc (thank you) · la revedere (goodbye) · Ana, Mihai (names)"
    note: "All already established in earlier units -- the same friendly opening and closing pattern every dialogue in this course has used."

  ro.a1.unit15.lesson03.teach.drum_bun_vocab:
    title: "Have a safe trip"
    gloss: "Drum bun (Have a safe trip / Safe travels)"
    note: "A fixed farewell said to someone about to travel -- literally 'good road,' but used the way English uses 'safe travels' or 'bon voyage.'"
    example_gloss:
      - "Have a safe trip, Mihai!"

  ro.a1.unit15.lesson03.teach.line01:
    title: "Greet and ask about the train"
    gloss: "Ana greets Mihai and asks what time the train leaves."
    note: "Reuses this unit's own lesson01 question, now spoken directly to Mihai."

  ro.a1.unit15.lesson03.teach.line02:
    title: "State the departure time"
    gloss: "Mihai says the train leaves at nine o'clock."
    note: "Reuses this unit's own lesson01 phrase exactly."

  ro.a1.unit15.lesson03.teach.line03:
    title: "Ask about the platform"
    gloss: "Ana asks from which platform."
    note: "A short follow-up question -- *de la ce peron* was already asked in full in lesson01; here Ana asks it briefly, expecting Mihai to fill in the rest."

  ro.a1.unit15.lesson03.teach.line04:
    title: "State the platform and the ticket"
    gloss: "Mihai says platform three, and that he has a ticket to Bucharest."
    note: "Combines this unit's own peron and bilet/București vocabulary into one answer."

  ro.a1.unit15.lesson03.teach.line05:
    title: "Wish a safe trip and say goodbye"
    gloss: "Ana wishes Mihai a safe trip and says goodbye."
    note: "Uses this lesson's own *Drum bun* -- a travel-specific farewell in place of the course's usual plain *la revedere* alone."

  ro.a1.unit15.lesson03.teach.line06:
    title: "Thank her and say goodbye"
    gloss: "Mihai thanks Ana and says goodbye."
    note: "The same closing pattern every earlier unit's dialogue has ended on."

exercises:
  ro.a1.unit15.lesson01.exercise01.choose_tren:
    instruction: "Which word means 'train'?"
    correct_option: "Tren"
    distractors: ["Bilet", "Peron"]
    accepted_answers: ["Tren"]

  ro.a1.unit15.lesson01.exercise02.choose_pleaca:
    instruction: "Which word means 'leaves' / 'departs'?"
    correct_option: "Pleacă"
    distractors: ["Este", "Costă"]
    accepted_answers: ["Pleacă"]

  ro.a1.unit15.lesson01.exercise03.listen_trenul_pleaca_ora_noua:
    instruction: "Listen and select what you hear."
    correct_option: "Trenul pleacă la ora nouă"
    distractors: ["De la ce peron pleacă trenul?", "Trenul este la gară."]
    accepted_answers: ["Trenul pleacă la ora nouă"]

  ro.a1.unit15.lesson01.exercise04.match_travel1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Tren": "train"
      "Pleacă": "leaves / departs"
      "Peron": "platform"
      "Gară": "train station"
      "La ce oră?": "At what time?"
      "La ora nouă.": "At nine o'clock."

  ro.a1.unit15.lesson01.exercise05.order_la_ce_ora_pleaca_trenul:
    instruction: "Build the sentence: What time does the train leave?"
    correct_response: ["La", "ce", "oră", "pleacă", "trenul"]

  ro.a1.unit15.lesson01.exercise06.listen_order_de_la_ce_peron:
    instruction: "Listen, then put the words in order."
    correct_response: ["De", "la", "ce", "peron", "pleacă", "trenul"]

  ro.a1.unit15.lesson01.exercise07.complete_trenul_pleaca:
    instruction: "Complete the sentence: The train leaves at nine o'clock."
    accepted_answers: ["pleacă", "Pleacă"]
    feedback: "Trenul *pleacă* la ora nouă -- *pleacă* is the verb for a train (or bus, or plane) leaving."

  ro.a1.unit15.lesson01.exercise08.speak_la_ce_ora_pleaca_trenul:
    instruction: "Say aloud: What time does the train leave?"
    accepted_answers:
      - "La ce oră pleacă trenul?"
      - "La ce oră pleacă trenul"

  ro.a1.unit15.lesson02.exercise01.choose_bilet:
    instruction: "Which word means 'ticket'?"
    correct_option: "Bilet"
    distractors: ["Tren", "Peron"]
    accepted_answers: ["Bilet"]

  ro.a1.unit15.lesson02.exercise02.choose_how_much_question:
    instruction: "Which phrase asks 'How much does a ticket cost?'"
    correct_option: "Cât costă un bilet?"
    distractors: ["La ce oră pleacă trenul?", "De la ce peron pleacă trenul?"]
    accepted_answers: ["Cât costă un bilet?"]

  ro.a1.unit15.lesson02.exercise03.listen_as_dori_bilet_bucuresti:
    instruction: "Listen and select what you hear."
    correct_option: "Aș dori un bilet la București, vă rog"
    distractors: ["Cât costă un bilet la București?", "Costă zece lei."]
    accepted_answers: ["Aș dori un bilet la București, vă rog"]

  ro.a1.unit15.lesson02.exercise04.match_travel2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Bilet": "ticket"
      "București": "Bucharest"
      "Aș dori": "I would like"
      "Vă rog": "please"
      "Cât costă?": "How much does it cost?"
      "Lei": "lei (currency)"
      "Tren": "train"
      "Peron": "platform"

  ro.a1.unit15.lesson02.exercise05.order_cat_costa_bilet:
    instruction: "Build the sentence: How much does a ticket cost?"
    correct_response: ["Cât", "costă", "un", "bilet"]

  ro.a1.unit15.lesson02.exercise06.listen_order_costa_zece_lei:
    instruction: "Listen, then put the words in order."
    correct_response: ["Costă", "zece", "lei"]

  ro.a1.unit15.lesson02.exercise07.complete_as_dori_bilet:
    instruction: "Complete the sentence: I would like a ticket to Bucharest, please."
    accepted_answers: ["bilet", "Bilet"]
    feedback: "Aș dori un *bilet* la București, vă rog -- *bilet* is the thing being requested."

  ro.a1.unit15.lesson02.exercise08.speak_as_dori_bilet_bucuresti:
    instruction: "Say aloud: I would like a ticket to Bucharest, please."
    accepted_answers:
      - "Aș dori un bilet la București, vă rog."
      - "Aș dori un bilet la București, vă rog"

  ro.a1.unit15.lesson03.exercise01.choose_who_says_drum_bun:
    instruction: "Who says this line?"
    correct_option: "Ana"
    distractors: ["Mihai"]
    accepted_answers: ["Ana"]

  ro.a1.unit15.lesson03.exercise02.dialogue_comprehend_platform:
    instruction: "Listen to the dialogue. From which platform does the train leave?"
    correct_option: "Peronul trei."
    distractors: ["Peronul doi.", "Peronul unu."]
    accepted_answers: ["Peronul trei."]

  ro.a1.unit15.lesson03.exercise03.reading_comprehend_destination:
    instruction: "Read the text. Where is the train going?"
    correct_option: "București."
    distractors:
      - "Peron."
      - "Gară."
    accepted_answers:
      - "București."
      - "București"

  ro.a1.unit15.lesson03.exercise04.match_unit_review:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Tren": "train"
      "Pleacă": "leaves / departs"
      "Peron": "platform"
      "Bilet": "ticket"
      "București": "Bucharest"
      "Cât costă?": "How much does it cost?"
      "Vă rog": "please"
      "Drum bun": "Have a safe trip"

  ro.a1.unit15.lesson03.exercise05.order_am_bilet_bucuresti:
    instruction: "Build the sentence: I have a ticket to Bucharest."
    correct_response: ["Am", "un", "bilet", "la", "București"]

  ro.a1.unit15.lesson03.exercise06.complete_drum_bun:
    instruction: "Complete Ana's goodbye (she wishes Mihai a safe trip): ___, Mihai! La revedere!"
    accepted_answers: ["Drum bun", "drum bun"]
    feedback: "*Drum bun*, Mihai! -- the fixed farewell for someone about to travel, like 'safe travels' in English."

  ro.a1.unit15.lesson03.exercise07.respond_as_mihai:
    instruction: "Take Mihai's role. Ana asks 'La ce oră pleacă trenul?' -- tell her it leaves at nine o'clock."
    accepted_answers:
      - "Trenul pleacă la ora nouă."
      - "Trenul pleacă la ora nouă"
      - "La ora nouă."
      - "La ora nouă"

  ro.a1.unit15.lesson03.exercise08.speak_am_bilet_bucuresti:
    instruction: "Say aloud: I have a ticket to Bucharest."
    accepted_answers:
      - "Am un bilet la București."
      - "Am un bilet la București"

  ro.a1.unit15.lesson03.exercise09.write_travel_message:
    instruction: "Write a short message about Mihai's train journey from this unit, as if you were him: the train leaves at nine o'clock, from platform three, and you have a ticket to Bucharest. Mention at least one of these facts."
    accepted_answers:
      - "Trenul pleacă de la peronul trei."
      - "Trenul pleacă la ora nouă. Am un bilet la București."
      - "Trenul pleacă la ora nouă de la peronul trei. Am un bilet la București."
      - "Am un bilet la București. Trenul pleacă la ora nouă de la peronul trei."
      - "Trenul pleacă la ora nouă."
      - "De la peronul trei."
      - "Am un bilet la București."
      - "Trenul pleacă la ora nouă de la peronul trei."
      - "Am un bilet la București. Trenul pleacă la ora nouă."

  ro.a1.unit15.lesson02.exercise09.dictation_costa_zece_lei:
    instruction: "Type what you hear."
    correct_option: "Costă zece lei"
    accepted_answers: [{value: "Costă zece lei", status: correct}]
    orthography_strict: true
