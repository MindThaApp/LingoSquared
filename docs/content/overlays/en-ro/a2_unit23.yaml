answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with
    comma-below ș/ț. Free-typed answers are graded against these
    standard spellings: the grader does not fold away omitted
    diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should
    type the full standard spelling.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    Fully formal dumneavoastră register throughout, continuing unit21's
    identical convention for a first meeting with an official/clerk.
    "Aș dori" (I would like) and "e nevoie de" (there is need of) carry
    no register distinction of their own.

course:
  title: "Romanian A2"
  description: >-
    Opening a bank account in Romanian -- Cont curent (checking
    account), Aș dori (I would like), Dovada adresei (proof of
    address), and E nevoie de (there is need of) -- as Ana opens an
    account with bancherul Radu.

units:
  ro.a2.unit23.banca:
    title: "Banking"

lessons:
  ro.a2.unit23.lesson01.deschid_un_cont:
    title: "I would like to open an account"
  ro.a2.unit23.lesson02.ce_acte_sunt_necesare:
    title: "What documents are necessary?"
  ro.a2.unit23.lesson03.pliantul_bancii:
    title: "The bank's leaflet"
  ro.a2.unit23.lesson04.la_banca:
    title: "At the bank"

teaching:
  ro.a2.unit23.lesson01.teach.reminder_buna_multumesc_la_revedere_as_dori:
    title: "Reminder: Bună ziua, Mulțumesc, La revedere, Aș dori"
    gloss: "Bună ziua (good day, formal) · Mulțumesc (thank you) · La revedere (goodbye) · Aș dori (I would like)"
    note: "Formal greetings and the polite request *aș dori* from earlier units, reused here for a bank visit."

  ro.a2.unit23.lesson01.teach.cont_vocab:
    title: "Account"
    gloss: "Cont (account)"
    note: "A neuter noun for a bank account in general."
    example_gloss:
      - "I would like an account."

  ro.a2.unit23.lesson01.teach.curent_vocab:
    title: "Checking account"
    gloss: "Cont curent (checking account)"
    note: "*Curent* here means 'current/checking' -- *cont curent* is the everyday account for daily transactions, as opposed to a savings account."
    example_gloss:
      - "I would like a checking account."

  ro.a2.unit23.lesson01.teach.deschid_grammar:
    title: "Să deschid (that I open) → a deschis (has opened)"
    gloss: "Să deschid (that I open) -- subjunctive of *a deschide*, 'to open'; a deschis (has opened / opened) -- the compound past, formed with a form of *a avea* + the participle *deschis*, much like English 'has opened.'"
    note: >-
      Să deschid follows *aș dori*, the same subjunctive pattern you met
      earlier with *să mă înscriu* -- *aș dori să* + verb is the general
      polite-request frame. *A deschis* is the compound past, used to
      report what already happened (e.g. *Ana a deschis un cont*,
      "Ana opened an account").

  ro.a2.unit23.lesson01.teach.as_dori_deschid_phrase:
    title: "I would like to open a checking account."
    gloss: "Aș dori să deschid un cont curent."
    note: "Combines the conditional *aș dori* with the subjunctive *să deschid* -- the core request this unit builds toward."

  ro.a2.unit23.lesson01.teach.banca_vocab:
    title: "Bank"
    gloss: "Bancă (bank) · La bancă (at the bank)"
    note: "A feminine noun -- *la bancă* uses *la* the same way it's used with other locations already taught in this course."
    example_gloss:
      - "I would like to open a checking account at the bank."

  ro.a2.unit23.lesson02.teach.necesar_grammar:
    title: "Necesar / Necesare"
    gloss: "Ce acte sunt necesare? (What documents are necessary?) · Pentru (for/to)"
    note: "*Necesare* is the plural form of *necesar* (necessary), agreeing with *acte* -- *act* is neuter, and neuter nouns take feminine-type agreement in the plural. A new adjective this unit introduces."

  ro.a2.unit23.lesson02.teach.dovada_vocab:
    title: "Proof of address"
    gloss: "O dovadă a adresei (a proof of the address)"
    note: "*Dovadă* (proof, feminine) + *a adresei* (of the address, genitive) -- the standard phrase for a document proving where you live."
    example_gloss:
      - "You need a proof of address."

  ro.a2.unit23.lesson02.teach.e_nevoie_grammar:
    title: "E nevoie de (there is need of)"
    gloss: "E nevoie de (there is need of / it's necessary to have)"
    note: "A second impersonal-necessity construction, alongside *vă trebuie* (you need) -- *e nevoie de* is very common on official leaflets and notices."

  ro.a2.unit23.lesson02.teach.ce_acte_sunt_necesare_phrase:
    title: "What documents are necessary to open an account?"
    gloss: "Ce acte sunt necesare pentru a deschide un cont?"
    note: "*Pentru a* + infinitive-style verb form expresses purpose ('in order to') -- a new construction, distinct from the *să* + subjunctive used with *aș dori*."

  ro.a2.unit23.lesson02.teach.e_nevoie_de_phrase:
    title: "You need your ID card and a proof of address."
    gloss: "E nevoie de buletin și de o dovadă a adresei."
    note: "The clerk's standard answer -- *buletin* is the everyday word for the Romanian ID card."

  ro.a2.unit23.lesson03.teach.precum_vocab:
    title: "Such as"
    gloss: "Precum (such as / like)"
    note: "Introduces examples of an already-mentioned category -- here, examples of acceptable proof-of-address documents."
    example_gloss:
      - "Such as the property deed."

  ro.a2.unit23.lesson03.teach.card_vocab:
    title: "Card"
    gloss: "Cardul dumneavoastră (your card) · Va sosi (will arrive)"
    note: "*Va sosi* (will arrive) is the future tense of *a sosi*: *va* + the verb, the same future pattern as *veți primi* (you will receive). This *va*/*veți* future is the standard written form, common in official texts such as processing timelines."
    example_gloss:
      - "Your card will arrive by post."

  ro.a2.unit23.lesson03.teach.zile_lucratoare_vocab:
    title: "Business days"
    gloss: "Zile lucrătoare (business/working days) · În cinci zile (in five days)"
    note: "*Lucrătoare* (working, feminine plural) modifies *zile* -- the standard way official Romanian communications state processing time."
    example_gloss:
      - "The card will arrive in five business days."

  ro.a2.unit23.lesson03.teach.cardul_soseste_phrase:
    title: "Your card will arrive by post in five business days."
    gloss: "Cardul dumneavoastră va sosi prin poștă în cinci zile lucrătoare."
    note: "*Prin poștă* (by post) is the standard phrasing for official documents sent by mail."

  ro.a2.unit23.lesson03.teach.pliant_reading:
    title: "A bank leaflet"
    gloss: "To open a checking account, you need your ID card and a proof of address, such as the property deed or the rental contract. Your card will arrive by post in five business days."
    note: "A short official leaflet text combining this unit's documents-and-timing vocabulary."
    glosses:
      deschide: "open (from a deschide)"
      cont: "account"
      curent: "checking / current"
      aveți: "you have (from a avea)"
      nevoie: "need"
      buletin: "ID card"
      dovadă: "proof"
      adresei: "of the address"
      precum: "such as"
      actul: "document / deed"
      proprietate: "property"
      contractul: "contract"
      închiriere: "rental"
      Cardul: "card"
      sosi: "arrive (from a sosi)"
      poștă: "post / mail"
      cinci: "five"
      zile: "days"
      lucrătoare: "business / working"

  ro.a2.unit23.lesson04.teach.reminder_suficient_semnatura:
    title: "New words: Suficient, Semnătură, Radu"
    gloss: "Este suficient (that's enough/sufficient) · Semnătură (signature) · Radu"
    note: "New words this unit -- *suficient* is a transparent cognate; *semnătură* is the standard word for a required signature."

  ro.a2.unit23.lesson04.teach.line01:
    title: "Greet Radu and state the request"
    gloss: "Ana greets Radu and says she would like to open a checking account."
    note: "The same polite request you learned at the start of this unit: *Aș dori să deschid un cont curent.*"

  ro.a2.unit23.lesson04.teach.line02:
    title: "Ask for the documents"
    gloss: "Radu asks if Ana has her ID card and a proof of address."
    note: "*Aveți...?* is the formal 'Do you have...?' -- Radu checks the two documents from the leaflet."

  ro.a2.unit23.lesson04.teach.line03:
    title: "Confirm the documents"
    gloss: "Ana confirms: yes, she has her ID card and the property deed."
    note: "*Actul de proprietate* (the property deed) -- the same document Ana used to register her address."

  ro.a2.unit23.lesson04.teach.line04:
    title: "Confirm sufficiency and ask for a signature"
    gloss: "Radu says that's sufficient, and a signature is also needed here."
    note: "*E nevoie și de...* extends the *e nevoie de* pattern from earlier in this unit with *și* (also)."

  ro.a2.unit23.lesson04.teach.line05:
    title: "Sign and ask about the card"
    gloss: "Ana hands it over and asks when she'll receive the card."
    note: "*Când primesc...?* (When do I receive...?) is a new question pattern, transparent from taught vocabulary."

  ro.a2.unit23.lesson04.teach.line06:
    title: "Give the card timeline"
    gloss: "Radu says the card will arrive by post in five business days."
    note: "The same sentence as on the bank leaflet: the card arrives by post in five business days."

  ro.a2.unit23.lesson04.teach.line07:
    title: "Thank Radu for his help"
    gloss: "Ana thanks him warmly for his help."
    note: "*Pentru ajutor* (for the help) is a new closing phrase, more elaborate than a plain *mulțumesc*."

  ro.a2.unit23.lesson04.teach.line08:
    title: "Say goodbye"
    gloss: "Radu says you're welcome and wishes her a good day."
    note: "*Cu plăcere* (you're welcome) and *o zi bună* (have a good day) are the usual polite closing."

