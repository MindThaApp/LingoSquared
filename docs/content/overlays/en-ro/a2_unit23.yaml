    correct_option: "În cinci zile lucrătoare."
    distractors: ["Astăzi."]
    accepted_answers: ["În cinci zile lucrătoare."]

  ro.a2.unit23.lesson04.exercise05.order_aveti_buletinul:
    instruction: "Build the sentence: Do you have your ID card and a proof of address?"
    correct_response: ["Aveți", "buletinul", "și", "o", "dovadă", "a", "adresei"]

  ro.a2.unit23.lesson04.exercise06.respond_as_ana:
