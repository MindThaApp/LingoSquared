schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a2_unit23_banca.yaml for full detail.
    The Peace Corps Moldova PDF has zero dedicated banking material at
    any level; every word and phrase here is authored fresh from
    general standard Romanian knowledge. Glosses/notes here are freshly
    authored to explain the target-language forms, including this
    unit's "e nevoie de" impersonal-necessity construction, to an
    English speaker.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Third Romanian A2 overlay, authored alongside the paired
    realization. correct_response/accepted_answers shapes checked to
    match the realization's word_bank/pairs (exact token-multiset
    agreement for both word_order exercises and the two listen_order
    exercises) per the standing validate_order_word_bank_answers
    compiler check. Multi-clause accepted_answers checked against
    AUTHORING_GUIDE #12 for period/comma/conjunction-joined variants.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț). For
    free-typed A2 answers, accept otherwise-correct forms with the
    diacritics omitted or with the legacy cedilla variants ş/ţ
    substituted for ș/ț, matching units 01-22's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    Fully formal dumneavoastră register throughout, continuing unit21's
    identical convention for a first meeting with an official/clerk.
    "Aș dori" (I would like) and "e nevoie de" (there is need of) carry
    no register distinction of their own.

course:
  title: "Romanian A2"
  description: >-
    Opening a bank account in Romanian -- Cont curent (checking
    account), Aș dori (I would like), Dovada adresei (proof of
    address), and E nevoie de (there is need of) -- as Ana opens an
    account with bancherul Radu.

units:
  ro.a2.unit23.banca:
    title: "Banking"

lessons:
  ro.a2.unit23.lesson01.deschid_un_cont:
    title: "I would like to open an account"
  ro.a2.unit23.lesson02.ce_acte_sunt_necesare:
    title: "What documents are necessary?"
  ro.a2.unit23.lesson03.pliantul_bancii:
    title: "The bank's leaflet"
  ro.a2.unit23.lesson04.la_banca:
    title: "At the bank"

teaching:
  ro.a2.unit23.lesson01.teach.reminder_buna_multumesc_la_revedere_as_dori:
    title: "Reminder: Bună ziua, Mulțumesc, La revedere, Aș dori"
    gloss: "Bună ziua (good day, formal) · Mulțumesc (thank you) · La revedere (goodbye) · Aș dori (I would like)"
    note: "From unit01/unit21's formal-register vocabulary, reused here for a bank visit."

  ro.a2.unit23.lesson01.teach.cont_vocab:
    title: "Account"
    gloss: "Cont (account)"
    note: "A neuter noun for a bank account in general."
    example_gloss:
      - "I would like an account."

  ro.a2.unit23.lesson01.teach.curent_vocab:
    title: "Checking account"
    gloss: "Cont curent (checking account)"
    note: "*Curent* here means 'current/checking' -- *cont curent* is the everyday account for daily transactions, as opposed to a savings account."
    example_gloss:
      - "I would like a checking account."

  ro.a2.unit23.lesson01.teach.deschid_grammar:
    title: "Să deschid (that I open) → a deschis (has opened)"
    gloss: "Să deschid (that I open) -- subjunctive of *a deschide*, 'to open'; a deschis (has/had opened) -- the compound-past participle, used with a form of *a avea* the same way English uses 'has opened.'"
    note: >-
      Să deschid follows *aș dori*, the same subjunctive pattern unit21
      introduced with *să mă înscriu* -- *aș dori să* + verb is this
      course's general polite-request frame. *A deschis* is the participle
      used to report what already happened (e.g. *Ana a deschis un cont*,
      "Ana opened an account").

  ro.a2.unit23.lesson01.teach.as_dori_deschid_phrase:
    title: "I would like to open a checking account."
    gloss: "Aș dori să deschid un cont curent."
    note: "Combines the conditional *aș dori* with the subjunctive *să deschid* -- the core request this unit builds toward."

  ro.a2.unit23.lesson01.teach.banca_vocab:
    title: "Bank"
    gloss: "Bancă (bank) · La bancă (at the bank)"
    note: "A feminine noun -- *la bancă* uses *la* the same way it's used with other locations already taught in this course."
    example_gloss:
      - "I would like to open a checking account at the bank."

  ro.a2.unit23.lesson02.teach.necesar_grammar:
    title: "Necesar / Necesare"
    gloss: "Ce acte sunt necesare? (What documents are necessary?) · Pentru (for/to)"
    note: "*Necesare* is the plural feminine form of *necesar* (necessary), agreeing with *acte* -- a new adjective this unit introduces."

  ro.a2.unit23.lesson02.teach.dovada_vocab:
    title: "Proof of address"
    gloss: "O dovadă a adresei (a proof of the address)"
    note: "*Dovadă* (proof, feminine) + *a adresei* (of the address, genitive) -- the standard phrase for a document proving where you live."
    example_gloss:
      - "You need a proof of address."

  ro.a2.unit23.lesson02.teach.e_nevoie_grammar:
    title: "E nevoie de (there is need of)"
    gloss: "E nevoie de (there is need of / it's necessary to have)"
    note: "A second impersonal-necessity construction, alongside unit21's *vă trebuie* -- *e nevoie de* is slightly more formal/written in register, common on official leaflets."

  ro.a2.unit23.lesson02.teach.ce_acte_sunt_necesare_phrase:
    title: "What documents are necessary to open an account?"
    gloss: "Ce acte sunt necesare pentru a deschide un cont?"
    note: "*Pentru a* + infinitive-style verb form expresses purpose ('in order to') -- a new construction, distinct from the *să* + subjunctive used with *aș dori*."

  ro.a2.unit23.lesson02.teach.e_nevoie_de_phrase:
    title: "You need your ID card and a proof of address."
    gloss: "E nevoie de buletin și de o dovadă a adresei."
    note: "The clerk's standard answer, combining this lesson's own vocabulary with unit21's own *buletin*."

  ro.a2.unit23.lesson03.teach.precum_vocab:
    title: "Such as"
    gloss: "Precum (such as / like)"
    note: "Introduces examples of an already-mentioned category -- here, examples of acceptable proof-of-address documents."
    example_gloss:
      - "Such as the property deed."

  ro.a2.unit23.lesson03.teach.card_vocab:
    title: "Card"
    gloss: "Cardul dumneavoastră (your card) · Va sosi (will arrive)"
    note: "*Va sosi* is the formal future tense of *a sosi* (to arrive) -- a new tense form for this course, used here for official processing timelines."
    example_gloss:
      - "Your card will arrive by post."

  ro.a2.unit23.lesson03.teach.zile_lucratoare_vocab:
    title: "Business days"
    gloss: "Zile lucrătoare (business/working days) · În cinci zile (in five days)"
    note: "*Lucrătoare* (working, feminine plural) modifies *zile* -- the standard way official Romanian communications state processing time."
    example_gloss:
      - "The card will arrive in five business days."

  ro.a2.unit23.lesson03.teach.cardul_soseste_phrase:
    title: "Your card will arrive by post in five business days."
    gloss: "Cardul dumneavoastră va sosi prin poștă în cinci zile lucrătoare."
    note: "Combines this lesson's own vocabulary with unit21's own *prin poștă* -- the same by-post confirmation pattern this course now uses for official processes."

  ro.a2.unit23.lesson03.teach.pliant_reading:
    title: "A bank leaflet"
    gloss: "To open a checking account, you need your ID card and a proof of address, such as the property deed or the rental contract. Your card will arrive by post in five business days."
    note: "A short official leaflet text combining this unit's documents-and-timing vocabulary -- the reading-and-writing half of this unit's spine outcome."
    glosses:
      deschide: "open (from a deschide)"
      cont: "account"
      curent: "checking / current"
      aveți: "you have (from a avea)"
      nevoie: "need"
      buletin: "ID card"
      dovadă: "proof"
      adresei: "of the address"
      precum: "such as"
      actul: "document / deed"
      proprietate: "property"
      contractul: "contract"
      închiriere: "rental"
      Cardul: "card"
      sosi: "arrive (from a sosi)"
      poștă: "post / mail"
      cinci: "five"
      zile: "days"
      lucrătoare: "business / working"

  ro.a2.unit23.lesson04.teach.reminder_suficient_semnatura:
    title: "Reminder: Suficient, Semnătură, Radu"
    gloss: "Este suficient (that's enough/sufficient) · Semnătură (signature) · Radu"
    note: "New counter-vocabulary this unit -- *suficient* is a transparent cognate; *semnătură* is the standard word for a required signature."

  ro.a2.unit23.lesson04.teach.line01:
    title: "Greet Radu and state the request"
    gloss: "Ana greets Radu and says she would like to open a checking account."
    note: "Reuses this unit's own lesson01 phrase exactly."

  ro.a2.unit23.lesson04.teach.line02:
    title: "Ask for the documents"
    gloss: "Radu asks if Ana has her ID card and a proof of address."
    note: "New line, transparent from taught vocabulary."

  ro.a2.unit23.lesson04.teach.line03:
    title: "Confirm the documents"
    gloss: "Ana confirms: yes, she has her ID card and the property deed."
    note: "Reuses unit21's own *actul de proprietate* -- the same document Ana used to register her address."

  ro.a2.unit23.lesson04.teach.line04:
    title: "Confirm sufficiency and ask for a signature"
    gloss: "Radu says that's sufficient, and a signature is also needed here."
    note: "*E nevoie și de...* extends this lesson's own *e nevoie de* pattern with *și* (also)."

  ro.a2.unit23.lesson04.teach.line05:
    title: "Sign and ask about the card"
    gloss: "Ana hands it over and asks when she'll receive the card."
    note: "*Când primesc...?* (When do I receive...?) is a new question pattern, transparent from taught vocabulary."

  ro.a2.unit23.lesson04.teach.line06:
    title: "Give the card timeline"
    gloss: "Radu says the card will arrive by post in five business days."
    note: "Reuses this unit's own lesson03 phrase exactly."

  ro.a2.unit23.lesson04.teach.line07:
    title: "Thank Radu for his help"
    gloss: "Ana thanks him warmly for his help."
    note: "*Pentru ajutor* (for the help) is a new closing phrase, more elaborate than a plain *mulțumesc*."

  ro.a2.unit23.lesson04.teach.line08:
    title: "Say goodbye"
    gloss: "Radu says you're welcome and wishes her a good day."
    note: "Echoes unit22's own *cu plăcere*/*o zi bună* closing pattern."

exercises:
  ro.a2.unit23.lesson01.exercise01.choose_cont:
    instruction: "Which word means 'account'?"
    correct_option: "Cont"
    distractors: ["Bancă", "Card"]
    accepted_answers: ["Cont"]

  ro.a2.unit23.lesson01.exercise02.choose_banca:
    instruction: "Which word means 'bank'?"
    correct_option: "Bancă"
    distractors: ["Cont", "Card"]
    accepted_answers: ["Bancă"]

  ro.a2.unit23.lesson01.exercise03.listen_as_dori_deschid:
    instruction: "Listen and select what you hear."
    correct_option: "Aș dori să deschid un cont curent"
    distractors: ["Ce acte sunt necesare?", "E nevoie de buletin."]
    accepted_answers: ["Aș dori să deschid un cont curent"]

  ro.a2.unit23.lesson01.exercise04.match_banca1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Cont": "account"
      "Cont curent": "checking account"
      "Bancă": "bank"
      "Aș dori": "I would like"
      "Să deschid": "that I open"
      "Aș dori să deschid un cont curent.": "I would like to open a checking account."
      "Bună ziua.": "Good day."
      "Mulțumesc.": "Thank you."

  ro.a2.unit23.lesson01.exercise05.order_as_dori_deschid:
    instruction: "Build the sentence: I would like to open a checking account."
    correct_response: ["Aș", "dori", "să", "deschid", "un", "cont", "curent"]

  ro.a2.unit23.lesson01.exercise06.listen_order_la_banca:
    instruction: "Listen, then put the words in order."
    correct_response: ["Aș", "dori", "să", "deschid", "un", "cont", "curent", "la", "bancă"]

  ro.a2.unit23.lesson01.exercise07.complete_as_dori_deschid:
    instruction: "Complete the sentence, checking account: Aș dori să deschid un cont ___."
    accepted_answers: ["curent", "Curent"]
    feedback: "Cont *curent* -- 'checking account,' the account used for everyday transactions."

  ro.a2.unit23.lesson01.exercise08.write_account_request:
    instruction: "Write a short sentence saying you would like to open a checking account at the bank."
    accepted_answers:
      - "Aș dori să deschid un cont curent la bancă."
      - "Aș dori să deschid un cont curent."

  ro.a2.unit23.lesson02.exercise01.choose_dovada:
    instruction: "Which phrase means 'proof of address'?"
    correct_option: "Dovada adresei"
    distractors: ["Actul de proprietate", "Cont curent"]
    accepted_answers: ["Dovada adresei"]

  ro.a2.unit23.lesson02.exercise02.choose_necesare:
    instruction: "Which word means 'necessary'?"
    correct_option: "Necesare"
    distractors: ["Suficient", "Curent"]
    accepted_answers: ["Necesare"]

  ro.a2.unit23.lesson02.exercise03.listen_ce_acte_sunt_necesare:
    instruction: "Listen and select what you hear."
    correct_option: "Ce acte sunt necesare pentru a deschide un cont"
    distractors: ["Aș dori să deschid un cont curent.", "E nevoie de buletin și de o dovadă a adresei."]
    accepted_answers: ["Ce acte sunt necesare pentru a deschide un cont"]

  ro.a2.unit23.lesson02.exercise04.match_banca2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Dovada adresei": "proof of address"
      "Necesare": "necessary"
      "E nevoie de": "there is need of"
      "Ce acte sunt necesare?": "What documents are necessary?"
      "Cont curent": "checking account"
      "Bancă": "bank"

  ro.a2.unit23.lesson02.exercise05.order_e_nevoie_de_buletin:
    instruction: "Build the sentence: You need your ID card and a proof of address."
    correct_response: ["E", "nevoie", "de", "buletin", "și", "de", "o", "dovadă", "a", "adresei"]

  ro.a2.unit23.lesson02.exercise06.listen_order_ce_acte_sunt_necesare:
    instruction: "Listen, then put the words in order."
    correct_response: ["Ce", "acte", "sunt", "necesare"]

  ro.a2.unit23.lesson02.exercise07.complete_e_nevoie_de:
    instruction: "Complete the sentence, proof of address: E nevoie de buletin și de o ___ a adresei."
    accepted_answers: ["dovadă", "Dovadă"]
    feedback: "O *dovadă* a adresei -- 'a proof' of the address."

  ro.a2.unit23.lesson02.exercise08.translate_documents_necessary:
    instruction: "Translate into English."
    accepted_answers:
      - "What documents are necessary to open an account?"
      - "What documents are needed to open an account?"

  ro.a2.unit23.lesson03.exercise01.read_required_documents:
    instruction: "Read the leaflet. What documents do you need to open an account?"
    correct_option: "Buletin și o dovadă a adresei."
    distractors:
      - "Doar buletinul."
    accepted_answers:
      - "Buletin și o dovadă a adresei."

  ro.a2.unit23.lesson03.exercise02.read_card_timing:
    instruction: "Read the leaflet. How and when will the card arrive?"
    correct_option: "Prin poștă, în cinci zile lucrătoare."
    distractors:
      - "La bancă, în zece zile."
    accepted_answers:
      - "Prin poștă, în cinci zile lucrătoare."

  ro.a2.unit23.lesson03.exercise03.listen_pliant:
    instruction: "Listen and select what you hear."
    correct_option: "Cardul dumneavoastră va sosi prin poștă"
    distractors: ["Aș dori să deschid un cont curent.", "E nevoie de buletin și de o dovadă a adresei."]
    accepted_answers: ["Cardul dumneavoastră va sosi prin poștă"]

  ro.a2.unit23.lesson03.exercise04.match_pliant:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Cardul": "the card"
      "Cinci zile lucrătoare": "five business days"
      "Precum": "such as"
      "Contractul de închiriere": "the rental contract"
      "Dovada adresei": "the proof of address"
      "Cont curent": "checking account"

  ro.a2.unit23.lesson03.exercise05.complete_zile_lucratoare:
    instruction: "Complete the sentence, five business days: Cardul va sosi prin poștă în ___ zile lucrătoare."
    accepted_answers: ["cinci", "Cinci"]
    feedback: "În *cinci* zile lucrătoare -- 'five' business days, the standard processing time this leaflet states."

  ro.a2.unit23.lesson03.exercise06.write_account_information_request:
    instruction: "Write a short formal message requesting information about opening a bank account."
    accepted_answers:
      - "Aș dori informații despre un cont curent."
      - "Ce acte sunt necesare pentru a deschide un cont curent?"

  ro.a2.unit23.lesson04.exercise01.choose_who_asks_for_signature:
    instruction: "Who says this line?"
    correct_option: "Radu"
    distractors: ["Ana"]
    accepted_answers: ["Radu"]

  ro.a2.unit23.lesson04.exercise02.dialogue_comprehend_documents:
    instruction: "Listen to the dialogue. Which two documents does Ana bring?"
    correct_option: "Buletinul și actul de proprietate."
    distractors: ["Formularul și contractul de închiriere."]
    accepted_answers: ["Buletinul și actul de proprietate."]

  ro.a2.unit23.lesson04.exercise03.dialogue_comprehend_extra_requirement:
    instruction: "Listen to the dialogue. What else does Radu ask for besides the documents?"
    correct_option: "O semnătură."
    distractors: ["Un card."]
    accepted_answers: ["O semnătură."]

  ro.a2.unit23.lesson04.exercise04.dialogue_comprehend_card_timing:
    instruction: "Listen to the dialogue. When will Ana's card arrive?"
    correct_option: "În cinci zile lucrătoare."
    distractors: ["Astăzi."]
    accepted_answers: ["În cinci zile lucrătoare."]

  ro.a2.unit23.lesson04.exercise05.order_aveti_buletinul:
    instruction: "Build the sentence: Do you have your ID card and a proof of address?"
    correct_response: ["Aveți", "buletinul", "și", "o", "dovadă", "a", "adresei"]

  ro.a2.unit23.lesson04.exercise06.respond_as_ana:
    instruction: "Take Ana's role. Radu says the documents are sufficient and asks for a signature -- sign, then ask when the card arrives."
    accepted_answers:
      - "Poftim. Când primesc cardul?"
      - "Poftim, când primesc cardul?"

  ro.a2.unit23.lesson04.exercise07.write_bank_visit_summary:
    instruction: "Write a short sentence summarizing what Ana did at the bank, using at least one word from this unit."
    accepted_answers:
      - "Ana a deschis un cont curent la bancă cu Radu."
      - "Ana a adus buletinul și actul de proprietate la bancă."
      - "Cardul Anei va sosi prin poștă în cinci zile lucrătoare."
