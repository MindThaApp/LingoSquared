  ro.a2.unit23.lesson02.exercise01.choose_dovada:
    instruction: "Which phrase means 'proof of address'?"
    correct_option: "Dovada adresei"
    distractors: ["Actul de proprietate", "Cont curent"]
    accepted_answers: ["Dovada adresei"]

  ro.a2.unit23.lesson02.exercise02.choose_necesare:
    instruction: "Which word means 'necessary'?"
    correct_option: "Necesare"
    distractors: ["Aglomerat", "Curent"]
    accepted_answers: ["Necesare"]

  ro.a2.unit23.lesson02.exercise03.listen_ce_acte_sunt_necesare:
    instruction: "Listen and select what you hear."
    correct_option: "Ce acte sunt necesare pentru a deschide un cont"
    distractors: ["Aș dori să deschid un cont curent", "E nevoie de buletin și de o dovadă a adresei"]
    accepted_answers: ["Ce acte sunt necesare pentru a deschide un cont"]

  ro.a2.unit23.lesson02.exercise04.match_banca2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Dovada adresei": "proof of address"
      "Necesare": "necessary"
      "E nevoie de": "there is need of"
      "Ce acte sunt necesare?": "What documents are necessary?"
      "Cont curent": "checking account"
      "Bancă": "bank"

  ro.a2.unit23.lesson02.exercise05.order_e_nevoie_de_buletin:
    instruction: "Build the sentence: You need your ID card and a proof of address."
    correct_response: ["E", "nevoie", "de", "buletin", "și", "de", "o", "dovadă", "a", "adresei"]

  ro.a2.unit23.lesson02.exercise06.listen_order_ce_acte_sunt_necesare:
    instruction: "Listen, then put the words in order."
    correct_response: ["Ce", "acte", "sunt", "necesare"]

  ro.a2.unit23.lesson02.exercise07.complete_e_nevoie_de:
    instruction: "Complete the sentence: You need your ID card and a proof of address."
    accepted_answers: ["dovadă", "Dovadă"]
    feedback: "O *dovadă* a adresei -- 'a proof' of the address."

  ro.a2.unit23.lesson02.exercise08.translate_documents_necessary:
