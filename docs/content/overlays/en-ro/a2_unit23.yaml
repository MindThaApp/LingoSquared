      - "Poftim, când primesc cardul?"
      - "Poftim. Când va sosi cardul?"
      - "Poftim, când va sosi cardul?"

  ro.a2.unit23.lesson04.exercise07.write_bank_visit_summary:
    instruction: "Write: Ana opened a checking account at the bank."
    accepted_answers:
      - "Ana a deschis un cont curent la bancă."

  ro.a2.unit23.lesson01.exercise09.dictation_as_dori_sa_deschid_un_cont_curent:
    instruction: "Type what you hear."
    correct_option: "Aș dori să deschid un cont curent"
    accepted_answers: [{value: "Aș dori să deschid un cont curent", status: correct}]
    orthography_strict: true
