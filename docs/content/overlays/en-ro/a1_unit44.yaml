  ro.a1.unit44.lesson03.teach.imi_place_anotimp:
    title: The *Îmi place* construction
    gloss: '*Îmi place* + season says what you like: I like summer.'
    note: '*Îmi place* means ''it is pleasing to me'', so the thing you like comes after the verb and the verb stays *place* for one thing (*Îmi place vara*). The season carries its article at the end: *vară* becomes *vara*.'
