teaching:
  ro.a1.unit29.lesson01.teach.cat_costa_in:
    title: Asking the total price
    gloss: How much does it cost in total?
    note: '*În total* (in total) clarifies you want the full combined price, not one item''s price; *Cât costă?* asks "how much does it cost?".'
  ro.a1.unit29.lesson01.teach.costa_douazeci_si:
    title: Stating a total price
    gloss: It costs twenty-five lei in total.
    note: '*Costă* is the he/she/it form of *a costa* (to cost). After a number above 19, Romanian adds *de* before the noun: *douăzeci și cinci de lei*.'
  ro.a1.unit29.lesson02.teach.a_plati_cu:
    title: Paying by card or in cash
    gloss: to pay by card, to pay cash
    note: '*A plăti cu cardul* means to pay by card and *a plăti în numerar* means to pay cash; *cu* means "with" and *în* means "in".'
    example_gloss:
    - Can I pay by card here?
    - I'm paying in cash.
  ro.a1.unit29.lesson02.teach.pot_plati_cu:
    title: Asking if card payment is possible
    gloss: Can I pay by card here?
    note: '*Pot plăti* (I can pay) is *a putea* + a verb; *aici* (here) places the question at the current location.'
  ro.a1.unit29.lesson02.teach.doriti_sa_platiti:
    title: Asking about payment preference
    gloss: Would you like to pay cash or by card?
    note: '*Doriți să plătiți ...?* is the formal *dumneavoastră* version used by an unfamiliar cashier; with a friend you would say *Vrei să plătești ...?*'
  ro.a1.unit29.lesson03.teach.nota:
    title: The bill
    gloss: the bill
    note: 'A feminine noun: *o notă*, *nota* (the article attaches to the end).'
    example_gloss: Shall we split the bill?
  ro.a1.unit29.lesson03.teach.hai_sa_impartim:
    title: Suggesting to split the bill
    gloss: Shall we split the bill?
    note: '*Hai să* + a verb suggests doing something together.'
  ro.a1.unit29.lesson03.teach.pot_plati_separat:
    title: Asking to pay separately
    gloss: May I pay separately?
    note: '*Separat* (separately) goes after *a plăti*; *Pot plăti separat?* is the usual request when each person pays their own share.'
  ro.a1.unit29.lesson04.teach.restul:
    title: The change
    gloss: the change
    note: '*Restul* literally means "the rest", which is how Romanian names the change you get back; the article attaches to the end.'
    example_gloss: Here's your change.
  ro.a1.unit29.lesson04.teach.poftiti_restul:
    title: Handing over change
    gloss: Here's your change.
    note: '*Poftiți* is the formal *dumneavoastră* form meaning "here you are", matching the formal register at a counter.'
  ro.a1.unit29.lesson04.teach.nu_am_nevoie:
    title: Declining change
    gloss: I don't need change.
    note: '*A avea nevoie de* (to need) takes *de*: *Nu am nevoie de rest*.'
  ro.a1.unit29.lesson05.teach.treizeci_si_cinci:
    title: Thirty-five
    gloss: thirty-five
    note: 'Romanian builds numbers from 21 to 99 with *și*: *treizeci și cinci* (literally "thirty and five"), and adds *de* before the noun: *treizeci și cinci de lei*.'
    example_gloss: It costs thirty-five lei.
  ro.a1.unit29.lesson05.teach.nota_doua_feluri:
    title: Read a restaurant bill
    gloss: 'Bill: two main courses and two coffees. Total: thirty-five lei. Paid by card.'
    note: Track what was ordered, the total, and how it was paid.
    glosses:
      Nota: bill
      două: two
      feluri: main courses
      cafele: coffees
      Total: total
      '35': thirty-five
      lei: lei
      Plătit: paid
      cardul: card
  ro.a1.unit29.lesson06.teach.ana_hai_sa:
    title: Ana asks for the bill
    gloss: 'Ana: Shall we ask for the bill?'
    note: '*A cere* (to ask for) takes *nota* as its direct object; *Hai să cerem nota?* suggests asking for it together.'
  ro.a1.unit29.lesson06.teach.mihai_da_buna:
    title: Mihai asks the total
    gloss: 'Mihai: Yes, good idea. How much does it cost in total?'
    note: Reuses the *Cât costă în total?* question from lesson 1.
  ro.a1.unit29.lesson06.teach.ana_sunt_treizeci:
    title: Ana states the total
    gloss: 'Ana: It''s thirty-five lei. Shall we split it?'
    note: '*Împărțim* is the *noi* (we) form of *a împărți* (to share out); *nota* is understood from context.'
  ro.a1.unit29.lesson06.teach.mihai_nu_lasa:
    title: Mihai insists on paying
    gloss: 'Mihai: No, let me pay today. You''ve helped me so much.'
    note: '*Lasă-mă să* ... (let me ...) is the standard way to offer to do something; *m-ai ajutat* ("you have helped me") is a past form.'
  ro.a1.unit29.lesson06.teach.ana_ce_dragut:
    title: Ana is touched
    gloss: 'Ana: That''s sweet of you! Thank you.'
    note: '*Ce drăguț din partea ta!* (how sweet of you) is a warm, common compliment for a generous gesture.'
  ro.a1.unit29.lesson06.teach.mihai_pot_plati:
    title: Mihai asks about paying by card
    gloss: 'Mihai: Can I pay by card here?'
    note: Reuses the *Pot plăti cu cardul aici?* question from lesson 2, now in the actual restaurant.
  ro.a1.unit29.lesson06.teach.mihai_plateste_nota:
    title: 'Plătește: the he/she form'
    gloss: Mihai pays the bill.
    note: '*Plătește* is the he/she form of *a plăti* (to pay).'
