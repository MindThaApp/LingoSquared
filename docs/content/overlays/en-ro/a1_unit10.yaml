schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit10_routines.yaml for full
    detail. This unit's source PDF (US Peace Corps Moldova's "Basic
    Romanian Language Lessons") was checked specifically for
    daily-routine material and found to have no dedicated routine
    lesson -- only a one-off travel-departure exchange and a
    future-tense dinner exchange in its Lesson 17 listening exercises,
    neither reusable as first-person present-tense routine content.
    This unit's core routine verbs (mă trezesc, mănânc, beau, lucrez,
    merg, mă culc) and "acasă" are therefore freshly authored per
    AUTHORING_GUIDE #10, independently verified against standard A1
    Romanian reference material rather than copied from the PD source.
    Glosses/notes here are freshly authored to explain the target-
    language forms to an English speaker. "Apoi" (then) traces to
    unit09's own overlay/provenance. "Cursul începe la ora nouă,
    dimineața." is reused verbatim from unit04's own dialogue.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    realization file's own review pass. Checked clean: correct_response/
    accepted_answers shapes match the realization's word_bank/pairs, no
    same-speaker distractor collisions, no stray YAML booleans, no
    jargon leaks, English glosses/notes are accurate translations of
    the Romanian forms as authored. Tenth Romanian overlay, first
    draft, authored alongside the paired realization.

    Second-pass review 2026-10-19: 7 fixes - answer_policy.diacritics
    corrected (grader applies no diacritic/cedilla folding);
    lesson03.exercise08 instruction 'My class' -> 'The class' (matches
    Cursul); lesson02.exercise07 'Lucrez seara ___ merg acasă noaptea'
    also accepts apoi (taught unit09); lesson01.exercise05 also accepts
    'Dimineața mănânc pâine' and lesson03.exercise05 'Noaptea mă culc'
    (valid time-first orders; correct_response -> accepted_answers);
    lesson01.exercise08 also accepts 'Dimineața beau cafea.' and
    lesson02.exercise08 'Noaptea merg acasă.'. NATIVE FLAGS: none.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with
    comma-below ș/ț. Free-typed answers are graded against these
    standard spellings: the grader does not fold away omitted
    diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should
    type the full standard spelling.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    This unit's new verbs are all first-person singular (mă trezesc,
    mănânc, beau, lucrez, merg, mă culc) and are register-neutral --
    Romanian's first-person verb form is the same regardless of
    tu/dumneavoastră, and this unit introduces no second-person forms.
    Ana and Mihai's closing dialogue keeps their existing polite
    register with each other, matching unit06/unit07/unit08/unit09.

course:
  title: "Romanian A1"
  description: >-
    Describing a simple daily routine in Romanian -- mă trezesc (I wake
    up), mănânc / beau (I eat / drink), lucrez (I work), merg acasă (I
    go home), and mă culc (I go to bed) -- continuing Ana and Mihai as
    Ana asks Mihai about his day.

units:
  ro.a1.unit10.routines:
    title: "Daily routine"

lessons:
  ro.a1.unit10.lesson01.dimineata:
    title: "In the morning"
  ro.a1.unit10.lesson02.lucrez_merg_acasa:
    title: "I work, I go home"
  ro.a1.unit10.lesson03.rutina_mihai:
    title: "Mihai's routine"

teaching:
  ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine:
    title: "Reminder: dimineața, seara, noaptea, cafea, pâine"
    gloss: "dimineața (in the morning) · seara (in the evening) · noaptea (at night) · cafea (coffee) · pâine (bread)"
    note: >-
      All already established -- dimineața/seara/noaptea since unit04,
      cafea/pâine since unit06 -- here they combine into this unit's
      own daily-routine statements.

  ro.a1.unit10.lesson01.teach.ma_trezesc_vocab:
    title: "I wake up"
    gloss: "Mă trezesc (I wake up)"
    note: "*Mă* is the reflexive pronoun already seen in *mă numesc*/*mă cheamă* -- Romanian uses a reflexive verb for 'wake up,' literally 'I wake myself.'"
    example_gloss:
      - "I wake up in the morning."

  ro.a1.unit10.lesson01.teach.ma_trezesc_phrase:
    title: "I wake up in the morning"
    gloss: "Mă trezesc dimineața. (I wake up in the morning.)"
    note: "A short, complete statement -- the simplest possible routine sentence."

  ro.a1.unit10.lesson01.teach.mananc_vocab:
    title: "I eat"
    gloss: "Mănânc (I eat)"
    note: "No 'I' pronoun needed -- Romanian verb endings already show who's speaking, the same pattern already seen with *vreau*/*cumpăr*/*aș dori*."
    example_gloss:
      - "I eat bread in the morning."

  ro.a1.unit10.lesson01.teach.beau_vocab:
    title: "I drink"
    gloss: "Beau (I drink)"
    note: "Pairs naturally with already-known drinks like *cafea* and *ceai*."
    example_gloss:
      - "I drink coffee in the morning."

  ro.a1.unit10.lesson01.teach.mananc_beau_phrase:
    title: "I eat bread and drink coffee in the morning"
    gloss: "Mănânc pâine și beau cafea dimineața. (I eat bread and drink coffee in the morning.)"
    note: "Joins two actions with *și* (and), already known from unit04's *ora unu și jumătate*."

  ro.a1.unit10.lesson02.teach.lucrez_vocab:
    title: "I work"
    gloss: "Lucrez (I work)"
    note: "The first-person form of *lucrează*, already seen describing Mihai's own evening work in unit04."
    example_gloss:
      - "I work in the evening."

  ro.a1.unit10.lesson02.teach.lucrez_phrase:
    title: "I work in the evening"
    gloss: "Lucrez seara. (I work in the evening.)"
    note: "A short, complete statement about when you work."

  ro.a1.unit10.lesson02.teach.merg_vocab:
    title: "I go"
    gloss: "Merg (I go)"
    note: "The first-person form of *mergeți*, the command form already taught in unit09 -- same verb, different person."
    example_gloss:
      - "I go home."

  ro.a1.unit10.lesson02.teach.acasa_vocab:
    title: "Home"
    gloss: "Acasă (home)"
    note: "Used without a preposition -- *merg acasă*, not *merg la acasă*, the same way English says 'I go home,' not 'I go to home.'"
    example_gloss:
      - "I go home at night."

  ro.a1.unit10.lesson02.teach.merg_acasa_phrase:
    title: "I go home at night"
    gloss: "Merg acasă noaptea. (I go home at night.)"
    note: "A short, complete statement -- the natural end of a workday."

  ro.a1.unit10.lesson02.teach.lucrez_merg_phrase:
    title: "I work in the evening and go home at night"
    gloss: "Lucrez seara și merg acasă noaptea. (I work in the evening and go home at night.)"
    note: "Combines both of this lesson's own statements into one sentence with *și*."

  ro.a1.unit10.lesson03.teach.reminder_cursul_incepe_ora_apoi:
    title: "Reminder: cursul, începe, la ora nouă, apoi"
    gloss: "cursul (the class) · începe (starts) · la ora nouă (at nine o'clock) · apoi (then)"
    note: >-
      Cursul/începe/la ora nouă already established in unit04 (Mihai's
      class starts at nine in the morning); apoi already established in
      unit09 -- here they combine into Mihai's own routine account.

  ro.a1.unit10.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: "Reminder: bună, mulțumesc, la revedere, da, Ana, Mihai"
    gloss: "bună (hi) · mulțumesc (thank you) · la revedere (goodbye) · da (yes) · Ana, Mihai (names)"
    note: >-
      All already established in earlier units -- here Ana asks Mihai
      about his day.

  ro.a1.unit10.lesson03.teach.ma_culc_vocab:
    title: "I go to bed"
    gloss: "Mă culc (I go to bed)"
    note: "Another reflexive verb, the same pattern as *mă trezesc* -- literally 'I put myself down.'"
    example_gloss:
      - "I go to bed at night."

  ro.a1.unit10.lesson03.teach.ma_culc_phrase:
    title: "I go to bed at night"
    gloss: "Mă culc noaptea. (I go to bed at night.)"
    note: "The natural end of the day, closing the routine started by *mă trezesc dimineața*."

  ro.a1.unit10.lesson03.teach.line01:
    title: "Greet and ask when class starts"
    gloss: "Ana greets Mihai and asks when his class starts."
    note: "Reuses unit04's own question about Mihai's course."

  ro.a1.unit10.lesson03.teach.line02:
    title: "Answer with the class time"
    gloss: "Mihai says his class starts at nine, in the morning."
    note: "The exact same answer Mihai gave in unit04, restated here as part of his fuller daily routine."

  ro.a1.unit10.lesson03.teach.line03:
    title: "Ask about the evening"
    gloss: "Ana asks a short follow-up: 'And in the evening?'"
    note: "A natural, minimal way to ask for more of the routine without a new question word."

  ro.a1.unit10.lesson03.teach.line04:
    title: "Describe the rest of the day"
    gloss: "Mihai says he works in the evening, then goes to bed at night."
    note: "Combines this unit's own *lucrez* and *mă culc*, joined with *apoi* -- and matches unit04's own established fact that Mihai works in the evening."

  ro.a1.unit10.lesson03.teach.line05:
    title: "Thank and close"
    gloss: "Ana says 'Good!', thanks Mihai, and says goodbye."
    note: "The same closing thanks unit01's/unit08's/unit09's dialogues used."

  ro.a1.unit10.lesson03.teach.line06:
    title: "Close the encounter"
    gloss: "Mihai says goodbye back, using Ana's name."
    note: "The same friendly closing pattern every earlier unit's dialogue has ended on."

exercises:
  ro.a1.unit10.lesson01.exercise01.choose_ma_trezesc:
    instruction: "Which phrase means 'I wake up'?"
    correct_option: "Mă trezesc"
    distractors: ["Mănânc", "Beau"]
    accepted_answers: ["Mă trezesc"]

  ro.a1.unit10.lesson01.exercise02.choose_mananc:
    instruction: "Which word means 'I eat'?"
    correct_option: "Mănânc"
    distractors: ["Beau", "Mă trezesc"]
    accepted_answers: ["Mănânc"]

  ro.a1.unit10.lesson01.exercise03.listen_ma_trezesc_dimineata:
    instruction: "Listen and select what you hear."
    correct_option: "Mă trezesc dimineața"
    distractors: ["Mănânc pâine dimineața.", "Beau cafea dimineața."]
    accepted_answers: ["Mă trezesc dimineața"]

  ro.a1.unit10.lesson01.exercise04.match_routines1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Mă trezesc": "I wake up"
      "Mănânc": "I eat"
      "Beau": "I drink"
      "Cafea": "coffee"
      "Pâine": "bread"
      "Dimineața": "in the morning"
      "Seara": "in the evening"
      "Noaptea": "at night"

  ro.a1.unit10.lesson01.exercise05.order_mananc_paine_dimineata:
    instruction: "Build the sentence: I eat bread in the morning."
    accepted_answers:
      - {value: ["Mănânc", "pâine", "dimineața"], status: "correct"}
      - {value: ["dimineața", "Mănânc", "pâine"], status: "correct"}

  ro.a1.unit10.lesson01.exercise06.listen_order_beau_cafea_dimineata:
    instruction: "Listen, then put the words in order."
    correct_response: ["Beau", "cafea", "dimineața"]

  ro.a1.unit10.lesson01.exercise07.complete_ma_trezesc:
    instruction: "Complete the sentence."
    accepted_answers: ["trezesc", "Trezesc"]
    feedback: "Mă *trezesc* dimineața -- reusing this lesson's own wake-up verb."

  ro.a1.unit10.lesson01.exercise08.speak_beau_cafea:
    instruction: "Say aloud: I drink coffee in the morning."
    accepted_answers:
      - "Beau cafea dimineața."
      - "Beau cafea dimineața"
      - "Dimineața beau cafea."

  ro.a1.unit10.lesson02.exercise01.choose_lucrez:
    instruction: "Which word means 'I work'?"
    correct_option: "Lucrez"
    distractors: ["Merg", "Mă trezesc"]
    accepted_answers: ["Lucrez"]

  ro.a1.unit10.lesson02.exercise02.choose_acasa:
    instruction: "Which word means 'home'?"
    correct_option: "Acasă"
    distractors: ["Dimineața", "Seara"]
    accepted_answers: ["Acasă"]

  ro.a1.unit10.lesson02.exercise03.listen_lucrez_seara:
    instruction: "Listen and select what you hear."
    correct_option: "Lucrez seara"
    distractors: ["Merg acasă noaptea.", "Mă trezesc dimineața."]
    accepted_answers: ["Lucrez seara"]

  ro.a1.unit10.lesson02.exercise04.match_routines2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Mă trezesc": "I wake up"
      "Mănânc": "I eat"
      "Beau": "I drink"
      "Lucrez": "I work"
      "Merg": "I go"
      "Acasă": "home"
      "Dimineața": "in the morning"
      "Seara": "in the evening"
      "Noaptea": "at night"

  ro.a1.unit10.lesson02.exercise05.order_lucrez_merg_acasa:
    instruction: "Build the sentence: I work in the evening and go home at night."
    correct_response: ["Lucrez", "seara", "și", "merg", "acasă", "noaptea"]

  ro.a1.unit10.lesson02.exercise06.listen_order_merg_acasa_noaptea:
    instruction: "Listen, then put the words in order."
    correct_response: ["Merg", "acasă", "noaptea"]

  ro.a1.unit10.lesson02.exercise07.complete_lucrez_merg:
    instruction: "Complete the sentence."
    accepted_answers: ["și", "Și", "apoi", "Apoi"]
    feedback: "Lucrez seara *și* merg acasă noaptea -- joining two actions with 'and,' already known from unit04. (*Apoi*, 'then', also works here.)"

  ro.a1.unit10.lesson02.exercise08.speak_merg_acasa:
    instruction: "Say aloud: I go home at night."
    accepted_answers:
      - "Merg acasă noaptea."
      - "Merg acasă noaptea"
      - "Noaptea merg acasă."

  ro.a1.unit10.lesson03.exercise01.choose_who_says_lucrez:
    instruction: "Who says this line?"
    correct_option: "Mihai"
    distractors: ["Ana"]
    accepted_answers: ["Mihai"]

  ro.a1.unit10.lesson03.exercise02.dialogue_comprehend_rutina_mihai:
    instruction: "Listen to the dialogue. What time does Mihai's class start?"
    correct_option: "La ora nouă, dimineața."
    distractors: ["La ora șapte, seara.", "La ora trei, după-amiaza."]
    accepted_answers: ["La ora nouă, dimineața."]

  ro.a1.unit10.lesson03.exercise03.reading_comprehend_rutina:
    instruction: "Read the text. What does Mihai do right after work in the evening?"
    correct_option: "Mă culc."
    distractors:
      - "Mă trezesc."
      - "Cursul începe."
    accepted_answers:
      - "Mă culc."
      - "Mă culc"

  ro.a1.unit10.lesson03.exercise04.match_unit_review:
    instruction: "Match each word to its English meaning."
    correct_response:
      "Mă trezesc": "I wake up"
      "Mănânc": "I eat"
      "Beau": "I drink"
      "Lucrez": "I work"
      "Merg": "I go"
      "Acasă": "home"
      "Mă culc": "I go to bed"
      "Apoi": "Then"
      "Cursul": "the class"
      "Începe": "starts"

  ro.a1.unit10.lesson03.exercise05.order_ma_culc_noaptea:
    instruction: "Build the sentence: I go to bed at night."
    accepted_answers:
      - {value: ["Mă", "culc", "noaptea"], status: "correct"}
      - {value: ["noaptea", "Mă", "culc"], status: "correct"}

  ro.a1.unit10.lesson03.exercise06.complete_cursul_incepe:
    instruction: "Complete the sentence."
    accepted_answers: ["începe", "Începe"]
    feedback: "Cursul *începe* la ora nouă -- recalling exactly what Mihai told Ana back in unit04."

  ro.a1.unit10.lesson03.exercise07.respond_as_mihai:
    instruction: "Take Mihai's role. Ana asks 'Și seara?' -- tell her you work in the evening, then go to bed at night."
    accepted_answers:
      - "Lucrez seara, apoi mă culc noaptea."
      - "Lucrez seara apoi mă culc noaptea."
      - "Lucrez seara. Apoi mă culc noaptea."
      - "Lucrez seara, apoi mă culc noaptea"

  ro.a1.unit10.lesson03.exercise08.speak_cursul_incepe:
    instruction: "Say aloud: The class starts at nine, in the morning."
    accepted_answers:
      - "Cursul începe la ora nouă, dimineața."
      - "Cursul începe la ora nouă, dimineața"

  ro.a1.unit10.lesson02.exercise09.dictation_lucrez_seara:
    instruction: "Type what you hear."
    correct_option: "Lucrez seara"
    accepted_answers: [{value: "Lucrez seara", status: correct}]
    orthography_strict: true
