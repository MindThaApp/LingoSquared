  ro.a2.unit83.lesson01.exercise05.completeaza_manac: {"instruction": "Complete the Romanian question.", "correct_option": "mănânc", "accepted_answers": [{"value": "mănânc", "status": "correct"}], "feedback": "Because she is hungry, the question is *Pot să mănânc aici?*"}
