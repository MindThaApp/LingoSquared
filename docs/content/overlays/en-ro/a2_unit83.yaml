  ro.a2.unit83.lesson04.exercise01.alege_nevoie: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Nu e nevoie să plătești.", "distractors": ["Nu ai voie să plătești.", "Trebuie să plătești.", "Nu e nevoie plătești să."], "accepted_answers": [{"value": "Nu e nevoie să plătești.", "status": "correct"}], "feedback": "*Nu e nevoie să plătești* means paying is not necessary."}
