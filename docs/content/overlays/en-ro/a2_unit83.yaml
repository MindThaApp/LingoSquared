teaching:
  ro.a2.unit83.lesson01.teach.cuvinte: {"title": "Asking permission", "gloss": "I can, may / you can, may / I enter / I take / I eat / here / at home, home", "note": "*Pot să* + verb asks whether something is allowed. *Intri* is the form for *tu* of *intru*.", "example_gloss": ["May I come in?", "May I take the book home?", "May I eat here?", "You may come in."]}
  ro.a2.unit83.lesson01.teach.gn_pot_sa: {"title": "*Pot să* for permission", "gloss": "May I come in? May I take the book? May I eat here?", "note": "*Pot să* + a verb in the present form asks permission. The verb after *să* matches the person: *pot să intru* for *eu*."}
  ro.a2.unit83.lesson01.teach.gn_raspunsuri: {"title": "Answering with *poți*", "gloss": "Yes, you may. No, you may not. Yes, you may come in.", "note": "The answer uses *poți* (you can, you may). The verb after *să* changes to the *tu* form: *intri*."}
  ro.a2.unit83.lesson01.teach.gn_am_voie: {"title": "*Am voie*, *ai voie*", "gloss": "Am I allowed to come in? You are allowed to come in.", "note": "*A avea voie* means 'to be allowed'. It is used like *a putea* when the topic is rules."}
  ro.a2.unit83.lesson01.teach.fraza: {"title": "A request with a reason", "gloss": "I'm hungry. May I eat here?"}
  ro.a2.unit83.lesson02.teach.reguli: {"title": "Words for rules", "gloss": "you speak / you eat / you use / the phone / quietly / loudly", "note": "These are the *tu* forms after *să*: *să vorbești*, *să mănânci*, *să folosești*.", "example_gloss": ["You are allowed to use the phone.", "You are not allowed to eat here.", "You are not allowed to speak loudly.", "You are allowed to speak quietly."]}
  ro.a2.unit83.lesson02.teach.gn_nu_ai_voie: {"title": "Allowed and not allowed", "gloss": "You are allowed to use the phone. You are not allowed to eat here.", "note": "*Ai voie să* says something is allowed; *nu ai voie să* says it is forbidden."}
  ro.a2.unit83.lesson02.teach.gn_nu_poti: {"title": "Other ways to say it is forbidden", "gloss": "You can't eat here. That isn't allowed.", "note": "*Nu poți să* is a softer way to say the same as *nu ai voie să*. *Nu se poate* is a short answer that means 'that isn't possible' or 'that isn't allowed'."}
  ro.a2.unit83.lesson03.teach.obligatii: {"title": "Obligations", "gloss": "it is necessary, must / you return / you pay / he or she pays (after *să*) / you bring / weeks", "note": "*Trebuie să* is followed by the verb in the form for the person.", "example_gloss": ["You have to return the book.", "You have to pay.", "I have to bring the book in two weeks."]}
  ro.a2.unit83.lesson03.teach.gn_trebuie: {"title": "*Trebuie să*", "gloss": "I have to return the book. You have to return the book. Maria has to return the book.", "note": "*Trebuie* never changes. What changes is the verb after *să*: *returnez*, *returnezi*, *returneze*."}
  ro.a2.unit83.lesson03.teach.gn_intrebare: {"title": "Asking if you have to", "gloss": "Do I have to pay? Yes, you have to pay.", "note": "The question and the answer both use *trebuie să*. Note that *plătesc* (for *eu*) becomes *plătești* (for *tu*) when the speaker changes."}
  ro.a2.unit83.lesson04.teach.nevoie: {"title": "No need", "gloss": "need / free / the entry / ticket / today", "note": "*Nu e nevoie să* says that something is not necessary.", "example_gloss": ["You don't have to pay.", "Entry is free.", "You don't need a ticket.", "You don't have to bring the book today."]}
  ro.a2.unit83.lesson04.teach.gn_nu_e_nevoie: {"title": "*Nu e nevoie să*", "gloss": "You don't have to pay. You don't have to bring the book today.", "note": "*Nu e nevoie să* means 'there is no need to'. The thing is allowed but not required."}
  ro.a2.unit83.lesson04.teach.gn_nu_trebuie: {"title": "*Nu trebuie să*", "gloss": "You must not eat here. You must not speak loudly.", "note": "*Nu trebuie să* + a verb says that something must not be done, close in meaning to *nu ai voie să*. Depending on context it can also mean 'you don't have to'; for a clear 'no need' use *nu e nevoie să*."}
  ro.a2.unit83.lesson04.teach.gn_contrast: {"title": "Three rules compared", "gloss": "You have to return the book. You don't have to pay. You are not allowed to eat here.", "note": "Required, not required, forbidden: *trebuie să*, *nu e nevoie să*, *nu ai voie să*."}
  ro.a2.unit83.lesson05.teach.cuvinte: {"title": "Library words", "gloss": "the rules / library / Maria / reads", "note": "*La bibliotecă* means 'at the library'.", "example_gloss": ["Ana is at the library.", "Maria reads the rules."]}
  ro.a2.unit83.lesson05.teach.reguli: {"title": "The library rules", "gloss": "Rules in the library: you are not allowed to eat here. You must not speak loudly. You have to return the book in two weeks. You don't have to pay.", "note": "The sign uses all three kinds of rule: forbidden, required and not necessary."}
  ro.a2.unit83.lesson05.teach.mesaj: {"title": "Ana's message", "gloss": "Hi, Maria! I went to the library. I can take the book home. I have to bring the book back in two weeks. I don't have to pay.", "note": "Ana tells Maria the rules she learned."}
  ro.a2.unit83.lesson06.teach.d1: {"title": "Ana asks", "gloss": "Ana: Mihai, can I take the book home?"}
  ro.a2.unit83.lesson06.teach.d2: {"title": "Mihai answers", "gloss": "Mihai: Yes, you can. But you have to bring the book back in two weeks."}
  ro.a2.unit83.lesson06.teach.d3: {"title": "Ana asks about paying", "gloss": "Ana: Do I have to pay?"}
  ro.a2.unit83.lesson06.teach.d4: {"title": "Mihai says no need", "gloss": "Mihai: No, you don't have to pay. Entry is free."}
  ro.a2.unit83.lesson06.teach.d5: {"title": "Ana is hungry", "gloss": "Ana: May I eat here? I'm hungry."}
  ro.a2.unit83.lesson06.teach.d6: {"title": "Mihai says not here", "gloss": "Mihai: No, you're not allowed to eat here. You can eat outside."}
  ro.a2.unit83.lesson06.teach.d7: {"title": "Ana agrees", "gloss": "Ana: OK, then let's eat outside!"}
