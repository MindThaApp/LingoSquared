  ro.a2.unit83.lesson01.exercise02.alege_cartea: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Pot să iau cartea acasă?", "distractors": ["Poți să iau cartea acasă?", "Pot să iau cartea să acasă?", "Pot iau cartea să acasă?"], "accepted_answers": [{"value": "Pot să iau cartea acasă?", "status": "correct"}], "feedback": "*Pot să iau*: both verbs agree with *eu*."}
  ro.a2.unit83.lesson01.exercise03.une_permisiune: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Pot să intru?", "right": "May I come in?"}, {"left": "Poți să intri.", "right": "You may come in."}, {"left": "Pot să iau cartea?", "right": "May I take the book?"}, {"left": "Pot să mănânc aici?", "right": "May I eat here?"}, {"left": "Am voie să intru?", "right": "Am I allowed to come in?"}, {"left": "Da, poți.", "right": "Yes, you may."}, {"left": "Nu, nu poți.", "right": "No, you may not."}, {"left": "Ai voie să intri.", "right": "You are allowed to come in."}], "status": "correct"}], "feedback": "These are the permission questions and answers of the lesson."}
