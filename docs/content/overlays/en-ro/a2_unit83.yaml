  ro.a2.unit83.lesson02.exercise01.alege_nu_ai_voie: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Nu ai voie să mănânci aici.", "distractors": ["Ai voie să mănânci aici.", "Nu am voie să mănânc aici.", "Nu ai voie să mănânc aici."], "accepted_answers": [{"value": "Nu ai voie să mănânci aici.", "status": "correct"}], "feedback": "*Nu ai voie* + *tu* form: *să mănânci*."}
