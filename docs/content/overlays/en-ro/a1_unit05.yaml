schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit05_family.yaml for full detail.
    Glosses/notes here are freshly authored to explain the target-language
    forms to an English speaker; the underlying "familie"/"mamă"/"tată"
    (Lesson 2's alphabet table), "Ai copii?"/"Am un fiu."/"Am o
    fiică."/"Ai frați? Surori?"/"Ești căsătorit?"/"Da." (Lesson 3), and
    "Fratele meu este doctor." (Lesson 8's possession example, the
    sourced anchor for meu/mea) vocabulary traces to US Peace Corps
    Moldova's public-domain "Basic Romanian Language Lessons," respelled
    to standard Romanian orthography. "Părinți" (parents), and this
    unit's deliberate scope trim that stops short of grandparents/aunts/
    uncles, are freshly authored/decided, independent of the source (see
    the realization's own provenance note for the honest disclosure of
    why).
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Fifth Romanian overlay, first draft, authored alongside the paired
    realization. Needs the same fresh-context review before import.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț). For
    free-typed A1 answers, accept otherwise-correct forms with the
    diacritics omitted or with the legacy cedilla variants ş/ţ substituted
    for ș/ț, matching units 01-04's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    question mark/exclamation mark.
  register: >-
    This unit's new "Ai frați?"/"Aveți frați?" and "Câți copii
    ai?"/"Câți copii aveți?" pairs are register-sensitive (tu vs.
    dumneavoastră, parallel to unit02's ai/aveți age questions) -- accept
    either register unless an exercise explicitly names one. Ana and
    Mihai's closing dialogue keeps the dumneavoastră register unit01
    already established between them.

course:
  title: "Romanian A1"
  description: >-
    Talking about family in Romanian -- parents, siblings, children, and
    marital status, using the meu/mea possessive pair and the same
    tu/dumneavoastră question contrast from unit02's age questions --
    continuing Ana and Mihai as they get to know each other's families.

units:
  ro.a1.unit05.family:
    title: "Family"

lessons:
  ro.a1.unit05.lesson01.familia_mea:
    title: "My family"
  ro.a1.unit05.lesson02.frati_si_copii:
    title: "Siblings and children"
  ro.a1.unit05.lesson03.o_discutie_despre_familie:
    title: "A conversation about family"

teaching:
  ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare:
    title: "Reminder: am, un, o, și, mare"
    gloss: "am (I have) · un/o (a) · și (and) · mare (big)"
    note: >-
      All five already appeared in earlier units (*am* and *o* in
      unit02, *un* and *și* in unit04, *mare* in unit03's "capital
      letter" note) -- here they return to talk about family.

  ro.a1.unit05.lesson01.teach.familie:
    title: "Family"
    gloss: "familie (family)"
    note: "A feminine noun -- combines with *o* and an adjective like *mare* to say 'a big family.'"
    example_gloss: "I have a big family."

  ro.a1.unit05.lesson01.teach.mama:
    title: "Mother"
    gloss: "mamă (mother)"
    note: "The plain dictionary word for 'mother' -- see a few cards ahead for how to say 'my mother.'"
    example_gloss: "My mother lives in Cluj."

  ro.a1.unit05.lesson01.teach.tata:
    title: "Father"
    gloss: "tată (father)"
    note: "The plain dictionary word for 'father.'"
    example_gloss: "My father is a teacher."

  ro.a1.unit05.lesson01.teach.parintii:
    title: "Parents"
    gloss: "părinți (parents)"
    note: "Covers both parents together, the way English 'parents' does."
    example_gloss: "My parents live in Romania."

  ro.a1.unit05.lesson01.teach.meu_mea:
    title: "My: meu vs. mea"
    gloss: "meu (my, masculine) / mea (my, feminine)"
    note: >-
      Romanian's word for "my" agrees with the gender of the thing
      owned, not the owner -- *meu* with a masculine noun like *tată*,
      *mea* with a feminine noun like *mamă*.

  ro.a1.unit05.lesson01.teach.mama_mea:
    title: "My mother"
    gloss: "my mother"
    note: "Mamă becomes mama (adds 'the') before mea attaches -- this exact combined form is how 'my mother' is really said, not a word-for-word 'my mother' translation."

  ro.a1.unit05.lesson01.teach.tatal_meu:
    title: "My father"
    gloss: "my father"
    note: "Tată becomes tatăl (adds 'the,' irregularly with -l since tată already ends in -ă) before meu attaches."

  ro.a1.unit05.lesson01.teach.mama_si_tatal:
    title: "My mother and my father"
    gloss: "My mother and my father."
    note: "Puts both possessive forms together in one sentence, each with its own correct gender agreement."

  ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu:
    title: "Reminder: câți, ai, aveți, doi, nu"
    gloss: "câți (how many) · ai/aveți (you have, informal/formal) · doi (two) · nu (no/not)"
    note: >-
      *Câți*, *ai*, and *aveți* first appeared in unit02 asking age
      ("Câți ani ai?"); here they ask about siblings and children
      instead. *Doi* is from unit02's numbers, *nu* from unit03.

  ro.a1.unit05.lesson02.teach.da:
    title: "Yes"
    gloss: "da (yes)"
    note: "The everyday word for 'yes,' pairing with unit03's *nu* ('no')."
    example_gloss: "Yes, I have a brother."

  ro.a1.unit05.lesson02.teach.frate_sora:
    title: "Brother, sister"
    gloss: "frate (brother) / soră (sister)"
    note: "Masculine and feminine sibling nouns -- combine with un/o the same way as any other noun."
    example_gloss:
      - "I have a brother."
      - "I have a sister."

  ro.a1.unit05.lesson02.teach.frati_surori:
    title: "Brothers, sisters"
    gloss: "frați (brothers) / surori (sisters)"
    note: >-
      The plural forms, used to ASK about siblings in general --
      Romanians commonly ask "Ai frați?" ("Do you have brothers?") to
      mean "do you have siblings," often followed by "Surori?" as a
      separate check for sisters specifically, exactly like the
      original source material's own two-part question.
    example_gloss: "Do you have brothers or sisters?"

  ro.a1.unit05.lesson02.teach.ai_frati:
    title: "Do you have siblings? (informal)"
    gloss: "Do you have brothers?"
    note: "The everyday, informal way to ask -- pairs with unit01's *tu* register."

  ro.a1.unit05.lesson02.teach.aveti_frati:
    title: "Do you have siblings? (formal)"
    gloss: "Do you have brothers?"
    note: "The polite version, same *aveți* used for unit02's age question."

  ro.a1.unit05.lesson02.teach.copil_copii:
    title: "Child, children"
    gloss: "copil (child) / copii (children)"
    note: "Copil is one of the trickier plurals in Romanian -- copii, not a regular -i or -e ending -- worth memorizing as its own form."
    example_gloss: "I have two children."

  ro.a1.unit05.lesson02.teach.fiu_fiica:
    title: "Son, daughter"
    gloss: "fiu (son) / fiică (daughter)"
    note: "The specific words for son and daughter, distinct from the general copil/copii."
    example_gloss:
      - "I have a son."
      - "I have a daughter."

  ro.a1.unit05.lesson02.teach.cati_copii_ai:
    title: "How many children do you have?"
    gloss: "How many children do you have?"
    note: "Câți (how many) + copii (children) + ai (you have) -- all three already familiar."

  ro.a1.unit05.lesson02.teach.casatorit:
    title: "Married"
    gloss: "căsătorit (married)"
    note: "A common personal-info question in everyday conversation, same as asking someone's age."
    example_gloss: "Are you married?"

  ro.a1.unit05.lesson03.teach.line01:
    title: "Ask about siblings"
    gloss: "Ana asks Mihai if he has siblings."
    note: "Uses the polite *aveți*, matching their established register with each other."

  ro.a1.unit05.lesson03.teach.line02:
    title: "Answer and ask back"
    gloss: "Mihai says he has a brother and a sister, and asks if Ana has children."
    note: "Reuses this unit's own frate/soră and copii vocabulary in one exchange."

  ro.a1.unit05.lesson03.teach.line03:
    title: "Answer and return the question"
    gloss: "Ana says she has a daughter, and asks Mihai the same question back."
    note: "*Și dumneavoastră?* ('And you?') is the exact same return-question pattern from unit01's own introductions."

  ro.a1.unit05.lesson03.teach.line04:
    title: "Answer"
    gloss: "Mihai says he has a son."
    note: "A short, direct answer using this unit's own fiu."

  ro.a1.unit05.lesson03.teach.line05:
    title: "React and close"
    gloss: "Ana reacts positively and says goodbye."
    note: "*Bine!* here is a short positive reaction, the same word from unit01's *Bine, mulțumesc.*"

  ro.a1.unit05.lesson03.teach.line06:
    title: "Close the encounter"
    gloss: "Mihai says goodbye back, using Ana's name."
    note: "The same friendly closing pattern unit01's and unit04's dialogues both ended on."

exercises:
  ro.a1.unit05.lesson01.exercise01.choose_familie:
    instruction: "Which word means 'family'?"
    correct_option: "familie"
    distractors: ["mamă", "tată"]
    accepted_answers: ["familie"]

  ro.a1.unit05.lesson01.exercise02.choose_tata:
    instruction: "Which word means 'father'?"
    correct_option: "tată"
    distractors: ["mamă", "familie"]
    accepted_answers: ["tată"]

  ro.a1.unit05.lesson01.exercise03.listen_mama_mea:
    instruction: "Listen and select what you hear."
    correct_option: "Mama mea"
    distractors: ["Tatăl meu", "Familia mea"]
    accepted_answers: ["Mama mea"]

  ro.a1.unit05.lesson01.exercise04.match_family_core:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Familie": "family"
      "Mamă": "mother"
      "Tată": "father"
      "Părinți": "parents"
      "Meu": "my (masc.)"
      "Mea": "my (fem.)"
      "Mama mea": "My mother"
      "Tatăl meu": "My father"

  ro.a1.unit05.lesson01.exercise05.order_mama_tatal:
    instruction: "Build the sentence: My mother and my father."
    correct_response: ["Mama", "mea", "și", "tatăl", "meu"]

  ro.a1.unit05.lesson01.exercise06.listen_order_familie_mare:
    instruction: "Listen, then put the words in order."
    correct_response: ["Am", "o", "familie", "mare"]

  ro.a1.unit05.lesson01.exercise07.complete_tatal_meu:
    instruction: "Complete the sentence."
    accepted_answers: ["meu"]
    feedback: "Tatăl *meu* (my father) -- meu agrees with the masculine tatăl, not the speaker."

  ro.a1.unit05.lesson01.exercise08.speak_mama_tatal:
    instruction: "Say aloud: my mother and my father."
    accepted_answers:
      - "Mama mea și tatăl meu."
      - "Mama mea și tatăl meu"

  ro.a1.unit05.lesson02.exercise01.choose_da:
    instruction: "Which word means 'yes'?"
    correct_option: "da"
    distractors: ["nu", "și"]
    accepted_answers: ["da"]

  ro.a1.unit05.lesson02.exercise02.choose_frate:
    instruction: "Which word means 'brother'?"
    correct_option: "frate"
    distractors: ["soră", "copil"]
    accepted_answers: ["frate"]

  ro.a1.unit05.lesson02.exercise03.listen_fiu_fiica:
    instruction: "Listen and select what you hear."
    correct_option: "Am un fiu și o fiică"
    distractors: ["Am un frate și o soră", "Am doi copii"]
    accepted_answers: ["Am un fiu și o fiică"]

  ro.a1.unit05.lesson02.exercise04.match_frati_copii:
    instruction: "Match each word to its English meaning."
    correct_response:
      "Da": "yes"
      "Frate": "brother"
      "Soră": "sister"
      "Copil": "child"
      "Copii": "children"
      "Fiu": "son"
      "Fiică": "daughter"
      "Căsătorit": "married"

  ro.a1.unit05.lesson02.exercise05.order_cati_copii_ai:
    instruction: "Build the question: How many children do you have?"
    correct_response: ["Câți", "copii", "ai"]

  ro.a1.unit05.lesson02.exercise06.listen_order_fiu_fiica:
    instruction: "Listen, then put the words in order."
    correct_response: ["Am", "un", "fiu", "și", "o", "fiică"]

  ro.a1.unit05.lesson02.exercise07.complete_ai_frati:
    instruction: "Complete the question."
    accepted_answers: ["frați"]
    feedback: "*Ai frați?* is the everyday way to ask 'Do you have siblings?'"

  ro.a1.unit05.lesson02.exercise08.speak_doi_copii:
    instruction: "Say aloud: I have two children."
    accepted_answers:
      - "Am doi copii."
      - "Am doi copii"

  ro.a1.unit05.lesson03.exercise01.choose_who_has_fiica:
    instruction: "Who says this line?"
    correct_option: "Ana"
    distractors: ["Mihai"]
    accepted_answers: ["Ana"]

  ro.a1.unit05.lesson03.exercise02.dialogue_comprehend_family:
    instruction: "Listen to the dialogue. What does Mihai have?"
    correct_option: "a son"
    distractors: ["a daughter", "two children"]
    accepted_answers: ["a son"]

  ro.a1.unit05.lesson03.exercise03.reading_comprehend_mihai:
    instruction: "According to Mihai, what does he have?"
    correct_option: "Un frate și o soră."
    distractors:
      - "O fiică și un fiu."
      - "Doi copii."
    accepted_answers:
      - "Un frate și o soră."
      - "Un frate și o soră"

  ro.a1.unit05.lesson03.exercise04.match_unit_review:
    instruction: "Match each word to its English meaning."
    correct_response:
      "Familie": "family"
      "Mamă": "mother"
      "Tată": "father"
      "Frate": "brother"
      "Soră": "sister"
      "Copil": "child"
      "Copii": "children"
      "Fiu": "son"
      "Fiică": "daughter"
      "Căsătorit": "married"
      "Da": "yes"

  ro.a1.unit05.lesson03.exercise05.order_am_un_fiu:
    instruction: "Build the sentence: I have a son."
    correct_response: ["Am", "un", "fiu"]

  ro.a1.unit05.lesson03.exercise06.complete_o_fiica:
    instruction: "Complete Ana's answer."
    accepted_answers: ["fiică"]
    feedback: "Da, am o *fiică* -- Ana has a daughter."

  ro.a1.unit05.lesson03.exercise07.respond_as_ana:
    instruction: "Take Ana's role. Mihai asks if you have children -- answer that you have a daughter."
    accepted_answers:
      - "Da, am o fiică."
      - "Da, am o fiică"

  ro.a1.unit05.lesson03.exercise08.speak_closing:
    instruction: "Say aloud: Good! Goodbye!"
    accepted_answers:
      - "Bine! La revedere!"
      - "Bine, la revedere!"
      - "Bine! La revedere"
