course:
  title: Romanian B1
  description: >-
    Intermediate Romanian: the unreal/counterfactual conditional -- "dacă
    aș avea"/"dacă aș fi" (if I had/if I were) paired with "aș" + verb in
    the main clause -- and using the conditional alone, with no
    hypothetical if-clause, to soften a suggestion or preference ("aș prefera").

units:
  ro.b1.unit17.ipotetic_conditional:
    title: "If I Had More Time"
    description: Express hypothetical or unreal wishes using the Romanian conditional in both the if-clause and the result ("dacă aș avea... aș..."), and use the conditional alone to soften a suggestion or preference.

lessons:
  ro.b1.unit17.lesson01.daca_as_avea_timp:
    title: "If I had more time"
  ro.b1.unit17.lesson02.daca_as_fi_bogata:
    title: "If I were rich"
  ro.b1.unit17.lesson03.as_prefera_soften:
    title: "I would prefer: the conditional alone"
  ro.b1.unit17.lesson04.dialogue_ipotetic_conditional:
    title: "Dialogue: hypothetical and conditional"
  ro.b1.unit17.lesson05.wrapup_production:
    title: "Wrap-up"

teaching:
  ro.b1.unit17.lesson01.teach.daca_as_avea_mai_mult_timp:
    title: "if I had more time"
    gloss: "if I had more time"
    note: "*aș* -- the conditional-mood marker you first met in unit 3 (\"dacă aș avea timp, aș merge\"). Here it appears in the if-clause itself (\"dacă aș avea\"), which is how Romanian marks an UNREAL condition -- unlike Unit 13's real condition (\"dacă termin raportul\"), which uses the present indicative."
    example_gloss: "If I had more time, I would read more."
  ro.b1.unit17.lesson01.teach.as_citi_mai_mult:
    title: "I would read more"
    gloss: "I would read more"
    example_gloss: "If I had more time, I would read more."
  ro.b1.unit17.lesson01.teach.grammar_conditional_irrealis:
    title: "Unreal condition: if-clause + conditional, contrasted with a real condition"
    gloss: "If I had more time, I would read more. Unlike \"if I finish the report, I can leave\" (a real condition, in the present tense), here \"if\" is followed by the conditional (\"aș avea\"), not the present -- this shows a hypothetical, unreal situation."
    note: "The unit's core grammar contrast with Unit 13's real condition."

  ro.b1.unit17.lesson02.teach.daca_as_fi_bogata:
    title: "if I were rich"
    gloss: "if I were rich"
    note: "*fi*/*bogată* -- genuinely new: \"to be\" in the conditional if-clause, and \"rich\" (feminine *bogată*, because Ana is speaking; a man says *bogat*)."
    example_gloss: "If I were rich, I would travel more."
  ro.b1.unit17.lesson02.teach.as_calatori_mai_mult:
    title: "I would travel more"
    gloss: "I would travel more"
    example_gloss: "If I were rich, I would travel more."
  ro.b1.unit17.lesson02.teach.grammar_conditional_both_clauses:
    title: "Conditional mood in both clauses of an unreal hypothesis"
    gloss: "If I were rich, I would travel more. Notice: the conditional appears in BOTH parts of the sentence -- \"I would be\" (in the condition) and \"I would travel\" (in the result). This is how an unreal hypothesis is expressed in Romanian."
    note: "Confirms the conditional-in-both-clauses pattern as the unreal marker."

  ro.b1.unit17.lesson03.teach.as_prefera_sa_mergem_maine:
    title: "I would prefer that we go to the bank tomorrow"
    gloss: "I would prefer that we go to the bank tomorrow"
    note: "*prefera*/*să mergem*/*mâine*/*bancă* -- genuinely new: a softened workplace-adjacent suggestion."
    example_gloss: "I would prefer that we go to the bank tomorrow, if you agree."
  ro.b1.unit17.lesson03.teach.daca_sunteti_de_acord:
    title: "if you agree"
    gloss: "if you agree"
    example_gloss: "I would prefer that we go to the bank tomorrow, if you agree."
  ro.b1.unit17.lesson03.teach.grammar_conditional_alone:
    title: "Conditional alone, with no hypothetical if-clause, to soften a preference"
    gloss: "I would prefer that we go to the bank tomorrow, if you agree. Here the conditional (\"I would prefer\") appears ALONE, with no hypothetical \"if\"-clause -- it softens a suggestion or preference, it does not describe an unreal situation."
    note: "The unit's second construction: the conditional used alone to soften."

  ro.b1.unit17.lesson04.teach.dialogue_ana_1:
    title: "If I had more time, I would read more."
    gloss: "If I had more time, I would read more."
  ro.b1.unit17.lesson04.teach.dialogue_mihai_1:
    title: "And if you were rich, what would you do?"
    gloss: "And if you were rich, what would you do?"
  ro.b1.unit17.lesson04.teach.dialogue_ana_2:
    title: "If I were rich, I would travel more."
    gloss: "If I were rich, I would travel more."
  ro.b1.unit17.lesson04.teach.dialogue_mihai_2:
    title: "I would prefer that we go to the bank tomorrow, if you agree."
    gloss: "I would prefer that we go to the bank tomorrow, if you agree."

  ro.b1.unit17.lesson05.teach.grammar_review:
    title: "If I had more time, I would read more. If I were rich, I would travel more. I would prefer that we go to the bank tomorrow, if you agree."
    gloss: "If I had more time, I would read more. If I were rich, I would travel more. I would prefer that we go to the bank tomorrow, if you agree."
  ro.b1.unit17.lesson05.teach.diana_opinie:
    title: "if Diana had more free time, she would learn a new language"
    gloss: "if Diana had more free time, she would learn a new language"
    example_gloss: "Diana talked about her plans. If Diana had more free time, she would learn a new language."

