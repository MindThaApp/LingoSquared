teaching:
  ro.a2.unit74.lesson01.teach.weekendul_weekendul_trecut:
    title: The weekend / last weekend
    gloss: the weekend / last weekend (the one that just ended)
    note: '*Weekendul* is a masculine noun with the article *-ul* attached. *Weekendul trecut* (''the weekend that has passed'') is the natural phrase for ''last weekend'' when you tell a story about it.'
    example_gloss:
    - The weekend starts on Saturday.
    - Last weekend I worked.
  ro.a2.unit74.lesson01.teach.sambata_duminica:
    title: Saturday and Sunday
    gloss: Saturday / Sunday
    note: Day names are not capitalised in Romanian unless they start a sentence.
    example_gloss:
    - On Saturday I'm free.
    - On Sundays I sleep in.
  ro.a2.unit74.lesson01.teach.a_face_cumparaturi:
    title: Doing errands
    gloss: to do the shopping / run errands
    note: '*A face cumpărături* is the fixed phrase for shopping and small errands. *Cumpărături* is plural and has no article here.'
    example_gloss: Every Saturday I do the shopping.
  ro.a2.unit74.lesson01.teach.a_merge_in:
    title: Going to visit someone
    gloss: to go and visit (someone)
    note: '*A merge în vizită* means to visit people at their home; you add *la* + the person: *în vizită la unchiul meu*.'
    example_gloss: I often go and visit my uncle.
  ro.a2.unit74.lesson01.teach.piata_parcul_cinematograful:
    title: Places to go at the weekend
    gloss: the market / the park / the cinema
    note: '*Piața* and *parcul* have the article attached to the end of the noun. *Cinematograful* is the full word for the cinema (often shortened to *cinema* in everyday speech).'
    example_gloss:
    - I buy vegetables at the market.
    - I like walking in the park.
    - On Saturday I'm going to the cinema.
  ro.a2.unit74.lesson01.teach.a_lucra_a:
    title: Four everyday verbs
    gloss: to work / to cook / to eat / to drink
    note: These are the infinitives. Later in this unit you will build their past forms.
    example_gloss:
    - I have to work today.
    - I can cook well.
    - I'd like to eat.
    - Would you like to drink coffee?
  ro.a2.unit74.lesson01.teach.ce_ai_facut:
    title: Asking what someone did last weekend
    gloss: What did you do last weekend?
    note: 'This is the standard question. *Făcut* is the participle of *a face*, and it comes right after the helper *ai*: *Ce ai făcut?*'
  ro.a2.unit74.lesson01.teach.sambata_am_facut:
    title: 'The perfect compus: am / ai / a + participle'
    gloss: On Saturday I did the shopping. On Sunday I went to my uncle's.
    note: 'The *perfect compus* is the everyday way to talk about what you did. It has two parts: a form of the helper verb *a avea* (*am, ai, a, am, ați, au*) and the *participle* (*făcut*, *mers*). The helper comes right before the participle, and the participle does not change: *am făcut*, *am mers*. Romanian has no separate helper for verbs of movement, so there is nothing to choose: *Sâmbătă am făcut cumpărături. Duminică am mers la unchiul meu.*'
  ro.a2.unit74.lesson02.teach.a_se_plimba:
    title: Four weekend activities
    gloss: to walk / to cycle / to play / to do sports
    note: '*A juca* is used for games and sports with a ball: *a juca fotbal*. *A face sport* means doing sport in general. *A se plimba* (to take a walk) is a reflexive verb.'
    example_gloss:
    - Shall we go for a walk?
    - Tomorrow I'm going to cycle.
    - The children want to play outside.
    - I want to exercise more often.
  ro.a2.unit74.lesson02.teach.a_lucra_lucrat:
    title: 'Regular participles: -at and -it'
    gloss: work → worked, cook → cooked, walk → walked, play → played, cycle → cycled
    note: 'Regular verbs build the participle from the infinitive. Verbs in *-a* end in *-at*: *a lucra → lucrat*, *a juca → jucat*, *a pedala → pedalat*. Verbs in *-i* end in *-it*: *a găti → gătit*. Reflexive verbs keep the little word in front of the helper: *a se plimba → m-am plimbat*. Learn the infinitive ending and you can build the participle.'
  ro.a2.unit74.lesson02.teach.fac_sport_am:
    title: 'An irregular one: a face → făcut'
    gloss: I exercise. I have exercised / I exercised.
    note: '*A face* (to do, to make) does not follow the *-at* / *-it* rule: its participle is *făcut*. *Fac sport* is ''I exercise'' and *am făcut sport* is ''I exercised''.'
  ro.a2.unit74.lesson02.teach.m_am_plimbat:
    title: Walking in the park
    gloss: I walked in the park.
    note: '*M-am plimbat* is a reflexive perfect: the little word *m-* (''myself'') comes before *am*. For walking around without a destination you use *a se plimba*.'
  ro.a2.unit74.lesson02.teach.am_jucat_fotbal:
    title: Playing football
    gloss: I played football.
    note: 'Sports with a ball take *a juca*: *am jucat fotbal*.'
  ro.a2.unit74.lesson03.teach.a_avea_a:
    title: Two useful verbs
    gloss: to have / to be
    note: '*A avea* (to have) and *a fi* (to be) are two verbs you will meet in the past. *A avea* is also the helper that forms the perfect compus: *am, ai, a*.'
    example_gloss:
    - I'd like to have a bike too.
    - It can be fun.
  ro.a2.unit74.lesson03.teach.a_vedea_vazut:
    title: 'More participles: some regular, some irregular'
    gloss: see → seen, read → read, sleep → slept, eat → eaten, drink → drunk, buy → bought, do → done
    note: 'Most Romanian participles are regular: *citit, dormit, mâncat, cumpărat*. A few common verbs are irregular and have to be learned as whole words: *a vedea → văzut*, *a bea → băut*, *a face → făcut*. Quick check: if the participle does not end in a regular *-at* or *-it*, it is irregular.'
  ro.a2.unit74.lesson03.teach.am_vazut_un:
    title: Watching a film
    gloss: I saw a film.
    note: Romanian says *a vedea un film* (to see a film) for going to the cinema or watching at home.
  ro.a2.unit74.lesson03.teach.am_dormit_mult:
    title: Two participles in one sentence
    gloss: I slept for a long time and read a book.
    note: 'With two actions, Romanian repeats the helper before each participle: *Am dormit mult și am citit o carte.*'
  ro.a2.unit74.lesson03.teach.mi_am_vizitat:
    title: Visiting family
    gloss: I visited my uncle.
    note: '*Mi-am vizitat unchiul* uses the little word *mi-* (''to me'') before *am*; it is common with relatives and belongings and means ''I visited my uncle''. *A vizita* is a regular verb in *-a*.'
  ro.a2.unit74.lesson03.teach.am_vazut_un_2:
    title: One helper for every verb
    gloss: I saw a film. I went to my uncle's. I stayed at home. I was at my uncle's. It got late.
    note: 'In Romanian the helper verb is always *a avea*: *am, ai, a, am, ați, au*. There is no choice between two helpers: *am văzut*, *am mers*, *am rămas*, *am fost*. For *el / ea* and for ''it'', the form is *a*: *S-a făcut târziu* (It got late). Even *a fi* (to be) forms its past with *a avea*: *am fost*.'
  ro.a2.unit74.lesson03.teach.a_merge_mers:
    title: Verbs of movement and change
    gloss: go → gone, come → come, stay → stayed, become → become, be → been
    note: 'These five verbs form their perfect compus with the same helper as every other verb: *am mers, am venit, am rămas, am devenit, am fost*. Three of them have irregular participles (*mers, rămas, fost*); *venit* and *devenit* are regular.'
  ro.a2.unit74.lesson04.teach.mai_intai_apoi:
    title: First and then
    gloss: first / after that
    note: '*Mai întâi* and *apoi* put actions in order. They are the connectors you need to tell a weekend story in sequence.'
    example_gloss:
    - First I work, then I go and exercise.
    - First I eat, then I drink coffee.
  ro.a2.unit74.lesson04.teach.mai_intai_am:
    title: 'Telling it in order: mai întâi, apoi'
    gloss: First I went to the market, then I cooked.
    note: 'The word order stays simple: the connector comes first, then the helper with the participle (the subject *eu* is normally left out): *Mai întâi am mers la piață, apoi am gătit*. A comma separates the two parts.'
  ro.a2.unit74.lesson04.teach.nu_am_lucrat:
    title: 'Saying what you did not do: nu'
    gloss: I didn't work. I didn't read the book. I didn't go to my uncle's.
    note: 'To make the perfect compus negative, put *nu* directly in front of the helper: *Nu am lucrat*. It stays there whatever else is in the sentence: *Nu am citit cartea. Nu am mers la unchiul meu.* Never put *nu* after the participle.'
  ro.a2.unit74.lesson04.teach.nu_am_baut:
    title: 'Saying you had none: nu ... niciun / nicio'
    gloss: I didn't drink any coffee. I didn't have time.
    note: 'Use *niciun* before a masculine noun or *nicio* before a feminine noun to say ''not a single'', together with *nu* in front of the helper: *Nu am băut nicio cafea.* When there is no article or amount, *nu* alone is enough: *Nu am avut timp.* *Avut* is the participle of *a avea*.'
  ro.a2.unit74.lesson04.teach.ai_facut_sport:
    title: Ana asks about exercise
    gloss: 'Ana: Did you exercise?'
    note: 'A yes/no question keeps the normal word order; the rising voice marks it: *Ai făcut sport?*'
  ro.a2.unit74.lesson04.teach.nu_nu_am:
    title: Mihai says no
    gloss: 'Mihai: No, I didn''t exercise.'
  ro.a2.unit74.lesson05.teach.salut_ana_a:
    title: A message from Maria
    gloss: Hi Ana! It was a quiet weekend. On Saturday morning I went to the market and bought bread. In the afternoon I walked in the park. In the evening I cooked. I didn't exercise and I didn't see a film. On Sunday I stayed at home. I slept for a long time and read a book.
    note: 'Maria is telling Ana about her weekend in order: Saturday morning, afternoon and evening, then Sunday. Every past action uses *am* + participle (*am mers, am cumpărat, am gătit*), and the reflexive one is *m-am plimbat*. *Dimineață*, *după-amiaza* and *seara* mean ''morning'', ''in the afternoon'' and ''in the evening''.'
    glosses:
      Salut: hi
      liniștit: quiet, calm
      weekend: weekend
      fost: been (participle of a fi)
      dimineață: morning (sâmbătă dimineață = Saturday morning)
      piață: market
      pâine: bread
      cumpărat: bought (participle of a cumpăra)
      După-amiaza: in the afternoon (după-amiaza)
      parc: park
      plimbat: walked (participle of a se plimba)
      Seara: in the evening (seara)
      gătit: cooked (participle of a găti)
      nu: not
      sport: sport (a face sport = to exercise)
      niciun: no, not any
      film: film
      văzut: seen (participle of a vedea)
      Duminică: Sunday
      rămas: stayed (participle of a rămâne; am rămas acasă = I stayed at home)
      mult: long, for a long time
      dormit: slept (participle of a dormi)
      carte: book
      citit: read (participle of a citi)
  ro.a2.unit74.lesson06.teach.salut_mihai_ce:
    title: Ana asks Mihai about his weekend
    gloss: 'Ana: Hi Mihai! What did you do last weekend?'
  ro.a2.unit74.lesson06.teach.sambata_am_mers:
    title: Mihai describes Saturday
    gloss: 'Mihai: On Saturday I went to my uncle''s in Brașov. I ate at my uncle''s.'
    note: '*La unchiul meu* means both ''to my uncle''s'' and ''at my uncle''s'': the verb tells you which. *Am mers la* is ''went to'', *am mâncat la* is ''ate at''.'
  ro.a2.unit74.lesson06.teach.frumos_si_duminica:
    title: Ana asks about Sunday
    gloss: 'Ana: Nice! And Sunday?'
  ro.a2.unit74.lesson06.teach.duminica_am_ramas:
    title: Mihai describes Sunday and asks back
    gloss: 'Mihai: On Sunday I stayed at home. I slept for a long time and I didn''t exercise. And you?'
  ro.a2.unit74.lesson06.teach.am_mers_la:
    title: Ana describes her weekend
    gloss: 'Ana: I went to my parents''. I didn''t do any shopping, but I cooked.'
