    - Ce ai băut weekendul trecut?
    accepted_answers:
    - value: Ce ai făcut weekendul trecut?
      status: correct
    feedback: '*Ce ai făcut weekendul trecut?* = What did you do last weekend?'
  ro.a2.unit74.lesson01.exercise03.match_weekendul_sambata_duminica:
