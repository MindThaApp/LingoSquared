    feedback: Match each item to its meaning.
  ro.a2.unit74.lesson01.exercise04.order_sambata_am_facut:
    instruction: Put the words in order to say 'On Saturday I did the shopping.' Start with the day.
    correct_option: Sâmbătă am făcut cumpărături
    accepted_answers:
    - value: Sâmbătă am făcut cumpărături
      status: correct
    feedback: '*Sâmbătă am făcut cumpărături* = On Saturday I did the shopping.'
  ro.a2.unit74.lesson01.exercise05.listen_am_mers_la:
    instruction: Listen, then put the words in the order you hear.
    correct_option: Am mers la unchiul meu
    accepted_answers:
    - value: Am mers la unchiul meu
      status: correct
    feedback: '*Am mers la unchiul meu* = I went to my uncle''s.'
  ro.a2.unit74.lesson01.exercise06.complete_sambata_am_facut:
    instruction: Complete the sentence with the participle of *a face*.
    correct_option: făcut
    accepted_answers:
    - value: făcut
      status: correct
    feedback: '*Sâmbătă am făcut cumpărături* = On Saturday I did the shopping.'
  ro.a2.unit74.lesson01.exercise07.translate_duminica_am_mers:
    instruction: 'Translate into Romanian: ''On Sunday I went to my uncle''s.'' Use the perfect compus (am + participle). Use *la*.'
    accepted_answers:
    - value: Duminică am mers la unchiul meu.
      status: correct
    - value: Duminică am mers la unchiul meu
      status: correct
    - value: Am mers duminică la unchiul meu.
      status: correct
    - value: Am mers duminică la unchiul meu
      status: correct
    feedback: '*Duminică am mers la unchiul meu* = On Sunday I went to my uncle''s. *Am mers duminică la unchiul meu* is also correct.'
  ro.a2.unit74.lesson02.exercise01.choose_pedalat:
    instruction: Which is the correct participle of *a pedala* (to cycle)?
    correct_option: pedalat
    distractors:
    - pedalit
    - pedalut
    - pedalând
    accepted_answers:
    - value: pedalat
      status: correct
    feedback: '*Pedala* ends in *-a*, so the participle ends in *-at*: *pedalat*.'
  ro.a2.unit74.lesson02.exercise02.listen_am_pedalat:
    instruction: Listen and select what you hear.
    correct_option: Am pedalat.
    distractors:
    - Am făcut sport.
    - Am gătit.
    - M-am plimbat.
    accepted_answers:
    - value: Am pedalat.
      status: correct
    feedback: '*Am pedalat* = I cycled.'
  ro.a2.unit74.lesson02.exercise03.match_lucrat_gatit_plimbat:
    instruction: Match each English past form to its Romanian participle.
    accepted_answers:
    - value:
      - left: worked
        right: lucrat
      - left: cooked
        right: gătit
      - left: walked
        right: plimbat
      - left: played
        right: jucat
      - left: cycled
        right: pedalat
      - left: exercised
        right: făcut sport
      status: correct
    feedback: Match each English past form to its Romanian participle.
  ro.a2.unit74.lesson02.exercise04.order_am_jucat_fotbal:
    instruction: Put the words in order to say 'I played football.'
    correct_option: Am jucat fotbal
    accepted_answers:
    - value: Am jucat fotbal
      status: correct
    feedback: '*Am jucat fotbal* = I played football.'
  ro.a2.unit74.lesson02.exercise05.complete_apoi_am_gatit:
    instruction: Complete the sentence with the participle of *a găti*.
    correct_option: gătit
    orthography_strict: true
    accepted_answers:
    - value: gătit
      status: correct
    feedback: '*Mai întâi am mers la piață, apoi am gătit* = First I went to the market, then I cooked. *A găti* is an *-i* verb, so the participle ends in *-it*: *gătit*.'
  ro.a2.unit74.lesson02.exercise06.translate_sambata_am_lucrat:
    instruction: 'Translate into Romanian: ''On Saturday I worked.'' Use the perfect compus (am + participle).'
    accepted_answers:
    - value: Sâmbătă am lucrat.
      status: correct
    - value: Sâmbătă am lucrat
      status: correct
    - value: Am lucrat sâmbătă.
      status: correct
    - value: Am lucrat sâmbătă
      status: correct
    feedback: '*Sâmbătă am lucrat* = On Saturday I worked. *Am lucrat sâmbătă* is also correct.'
  ro.a2.unit74.lesson02.exercise07.dictation_m_am_plimbat:
    instruction: Type what you hear.
    correct_response: M-am plimbat în parc
    orthography_strict: true
    feedback: You heard *M-am plimbat în parc* — I walked in the park.
  ro.a2.unit74.lesson03.exercise01.choose_vazut:
    instruction: Which of these participles is irregular, not ending in a regular *-at* or *-it*?
    correct_option: văzut
    distractors:
    - lucrat
    - gătit
    - jucat
    accepted_answers:
    - value: văzut
      status: correct
    feedback: '*Văzut* (from *a vedea*) is irregular. *Lucrat, gătit* and *jucat* are regular: they end in *-at* or *-it*.'
  ro.a2.unit74.lesson03.exercise02.listen_am_ramas_acasa:
    instruction: Listen and select what you hear.
    correct_option: Am rămas acasă.
    distractors:
    - Am lucrat acasă.
    - Am fost la unchiul meu.
    - Am mers la unchiul meu.
    accepted_answers:
    - value: Am rămas acasă.
      status: correct
    feedback: '*Am rămas acasă* = I stayed at home.'
  ro.a2.unit74.lesson03.exercise03.match_a_lucra_lucrat:
    instruction: 'Match each verb and participle to its type: regular or irregular.'
    accepted_answers:
    - value:
      - left: a lucra → lucrat
        right: regular
      - left: a citi → citit
        right: regular
      - left: a dormi → dormit
        right: regular
      - left: a merge → mers
        right: irregular
      - left: a bea → băut
        right: irregular
      - left: a rămâne → rămas
        right: irregular
      - left: a fi → fost
        right: irregular
      - left: a vedea → văzut
        right: irregular
      status: correct
    feedback: Most Romanian participles are regular (*-at* or *-it*). A few common verbs, such as *a merge, a rămâne, a fi, a vedea, a bea*, have irregular participles that you must learn as whole words.
  ro.a2.unit74.lesson03.exercise04.order_duminica_am_ramas:
