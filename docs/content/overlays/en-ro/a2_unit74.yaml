    correct_option: Sâmbătă am făcut cumpărături.
    distractors:
    - Sâmbătă sunt făcut cumpărături.
    - Duminică am făcut cumpărături.
    - Sâmbătă cumpărături am făcut.
    accepted_answers:
    - value: Sâmbătă am făcut cumpărături.
      status: correct
    feedback: '*Sâmbătă am făcut cumpărături* = On Saturday I did the shopping.'
  ro.a2.unit74.lesson01.exercise02.listen_ce_ai_facut:
