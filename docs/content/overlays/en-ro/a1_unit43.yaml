  ro.a1.unit43.lesson03.teach.as_vrea_culoare:
    title: The *Aș vrea* construction
    gloss: '*Aș vrea* + color says which color you would like: I''d like pink.'
    note: '*Aș vrea* (I would like) is the polite way to say what you want, softer than *Vreau*. The color word after it is not marked in any way, and *roz* and *mov* never change their ending, unlike *roșu*, which becomes *roșie* with a feminine noun (*o lalea roșie*).'
