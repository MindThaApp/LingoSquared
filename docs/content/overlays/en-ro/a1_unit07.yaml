schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit07_shopping.yaml for full
    detail. Glosses/notes here are freshly authored to explain the
    target-language forms to an English speaker; the underlying "Cît
    costă o cafea?" and "Unde pot să cumpăr cafea?" (both from the same
    Lesson 4 block already used for unit06's sourcing) trace to US
    Peace Corps Moldova's public-domain "Basic Romanian Language
    Lessons," respelled to standard Romanian orthography. Everything
    else -- leu/lei, scump/ieftin, piață, roșii, cartofi, kilogram,
    vreau -- is freshly authored, disclosed honestly in the
    realization's own provenance note, since the source has no
    dedicated shopping/market lesson.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    realization file's own review pass. Checked clean: correct_response/
    accepted_answers shapes match the realization's word_bank/pairs, no
    same-speaker distractor collisions, no stray YAML booleans, no
    jargon leaks, English glosses/notes are accurate translations of
    the Romanian forms as authored. Seventh Romanian overlay, first
    draft, authored alongside the paired realization.

    Second-pass review 2026-10-19: 5 fixes (plus the paired
    realization's line04 fix, mirrored in the line04 gloss) - lesson01
    exercise07 "Cinci lei? ___!" accepted only Scump though this
    unit's own dialogue calls five lei Ieftin; instruction now names
    'expensive'; lesson02 exercise07 "Aș dori roșii și ___."
    underdetermined, now names 'potatoes'; lesson03 exercise03
    distractors "Roșii."/"Cartofi." were partially true answers,
    replaced with "Pâine și pui."/"O cafea și un ceai."; bună ziua
    gloss 'good afternoon' corrected to 'good day / hello';
    answer_policy.diacritics rewritten to match the grader.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with
    comma-below ș/ț. Free-typed answers are graded against these
    standard spellings: the grader does not fold away omitted
    diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should
    type the full standard spelling.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    "Vreau" (I want, plain) and "Aș dori" (I would like, polite,
    established in unit06) are a genuine directness contrast, not
    interchangeable synonyms -- accept either for a general "I want/I
    would like" unless an exercise explicitly names one. "Vă rog"
    (formal) and "te rog" (informal, both established in unit06) remain
    a register-sensitive pair here too. Ana and Mihai's market dialogue
    keeps their existing polite register with each other (vă rog, not
    te rog).

course:
  title: "Romanian A1"
  description: >-
    Asking prices and quantities in Romanian -- the leu/lei currency,
    scump/ieftin, and shopping for market items like roșii (tomatoes)
    and cartofi (potatoes) by the kilogram -- continuing Ana and Mihai
    as they shop at the market.

units:
  ro.a1.unit07.shopping:
    title: "Shopping"

lessons:
  ro.a1.unit07.lesson01.cat_costa:
    title: "How much does it cost?"
  ro.a1.unit07.lesson02.rosii_si_cartofi:
    title: "Tomatoes and potatoes"
  ro.a1.unit07.lesson03.la_piata:
    title: "At the market"

teaching:
  ro.a1.unit07.lesson01.teach.reminder_un_numere:
    title: "Reminder: un, doi, cinci, zece, douăzeci"
    gloss: "un (a) · doi (two) · cinci (five) · zece (ten) · douăzeci (twenty)"
    note: >-
      All already appeared in earlier units (*un* in unit04, the
      numbers in unit02) -- here they return to talk about prices.

  ro.a1.unit07.lesson01.teach.cat_costa:
    title: "How much does it cost?"
    gloss: "Cât costă? (How much does it cost?)"
    note: "The everyday way to ask a price in Romanian -- add the item's name after it, or use it alone like this when the item is already clear from context."

  ro.a1.unit07.lesson01.teach.leu:
    title: "Leu (currency)"
    gloss: "leu (the Romanian currency unit -- plural: lei)"
    note: "Romania's currency. Leu is singular (one leu); the plural lei is irregular, not leu + a normal ending."
    example_gloss: "It costs one leu."

  ro.a1.unit07.lesson01.teach.costa_cinci_lei:
    title: "It costs five lei"
    gloss: "Costă cinci lei. (It costs five lei.)"
    note: "With 2-19, lei stays plain -- no extra word needed before it."

  ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei:
    title: "It costs twenty lei"
    gloss: "Costă douăzeci de lei. (It costs twenty lei.)"
    note: "From 20 up, Romanian inserts *de* before the counted noun -- the same rule unit02 taught for *ani* (years), now applied to *lei*."

  ro.a1.unit07.lesson01.teach.leu_lei_de_rule:
    title: "Rule: leu → lei, and when to add de"
    gloss: "leu → lei · numbers 2-19: no *de* · numbers 20+: add *de*"
    note: "The exact same pattern as unit02's *ani* rule (câți ani ai / am treizeci de ani) -- once you know it for one noun, it works the same way for lei."

  ro.a1.unit07.lesson01.teach.scump:
    title: "Expensive"
    gloss: "scump (expensive)"
    note: "A common reaction to a price you think is too high."
    example_gloss: "Five lei? Expensive!"

  ro.a1.unit07.lesson01.teach.ieftin:
    title: "Cheap"
    gloss: "ieftin (cheap)"
    note: "The opposite of scump -- a good price."
    example_gloss: "One leu? Cheap!"

  ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog:
    title: "Reminder: un, o, și, aș dori, vă rog, te rog"
    gloss: "un/o (a) · și (and) · aș dori (I would like) · vă rog (please, formal) · te rog (please, informal)"
    note: >-
      *Aș dori*, *vă rog*, and *te rog* first appeared in unit06's café
      scene -- here they return at the market.

  ro.a1.unit07.lesson02.teach.piata:
    title: "Market"
    gloss: "piață (market)"
    note: "A feminine noun -- the open-air or covered market where fresh food is bought."
    example_gloss: "How much does it cost at the market?"

  ro.a1.unit07.lesson02.teach.rosii:
    title: "Tomatoes"
    gloss: "roșii (tomatoes)"
    note: "Plural of roșie (a tomato) -- said in the plural when talking about buying them generally."
    example_gloss: "I would like tomatoes."

  ro.a1.unit07.lesson02.teach.cartofi:
    title: "Potatoes"
    gloss: "cartofi (potatoes)"
    note: "Plural of cartof (a potato), the same pattern as roșii."
    example_gloss: "I would like potatoes."

  ro.a1.unit07.lesson02.teach.kilogram:
    title: "Kilogram"
    gloss: "kilogram (kilogram)"
    note: "The standard unit for buying produce by weight. *De* links it to what's being bought: kilogram *de* roșii, 'a kilogram of tomatoes.'"
    example_gloss: "A kilogram of tomatoes."

  ro.a1.unit07.lesson02.teach.vreau:
    title: "I want"
    gloss: "vreau (I want)"
    note: "Plainer and more direct than *aș dori* ('I would like') -- both are fine at the market, vreau is just less formal."
    example_gloss: "I want potatoes."

  ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar:
    title: "Where can I buy ...?"
    gloss: "Unde pot să cumpăr roșii? (Where can I buy tomatoes?)"
    note: "A useful question when you don't already know where to shop -- swap roșii for any other item you're looking for."

  ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii:
    title: "How much is a kilogram of tomatoes?"
    gloss: "Cât costă un kilogram de roșii? (How much does a kilogram of tomatoes cost?)"
    note: "Puts Cât costă and the kilogram de ... construction together in one full question."

  ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi:
    title: "I want a kilogram of potatoes"
    gloss: "Vreau un kilogram de cartofi. (I want a kilogram of potatoes.)"
    note: "The same kilogram de ... pattern, this time as a statement with vreau instead of a question."

  ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere:
    title: "Reminder: bună, ziua, mulțumesc, bine, la revedere, Ana, Mihai"
    gloss: "bună ziua (good day / hello) · mulțumesc (thank you) · bine (good/fine) · la revedere (goodbye) · Ana, Mihai (names)"
    note: >-
      All already established in unit01's and unit06's own dialogues --
      here Ana and Mihai meet again, this time at the market.

  ro.a1.unit07.lesson03.teach.line01:
    title: "Greet and ask a price"
    gloss: "Ana greets Mihai and asks the price of a kilogram of tomatoes."
    note: "Combines this unit's own Cât costă with unit01's greeting."

  ro.a1.unit07.lesson03.teach.line02:
    title: "Give the price"
    gloss: "Mihai says it costs five lei and reacts that it's cheap."
    note: "Reuses this unit's own costă/cinci lei/ieftin."

  ro.a1.unit07.lesson03.teach.line03:
    title: "Order politely and add an item"
    gloss: "Ana agrees, asks for a kilogram of tomatoes politely, and adds that she also wants potatoes."
    note: "Combines aș dori, vă rog, and vreau -- both registers from this unit's own vocabulary in one line."

  ro.a1.unit07.lesson03.teach.line04:
    title: "Give the second price"
    gloss: "Mihai says a kilogram of potatoes costs ten lei."
    note: "Reuses zece (ten) from unit02, already reminder-established in this unit's lesson01."

  ro.a1.unit07.lesson03.teach.line05:
    title: "Thank and close"
    gloss: "Ana thanks Mihai and says goodbye."
    note: "*Mulțumesc* here is a simple closing thanks, the same word from unit01's *Bine, mulțumesc.*"

  ro.a1.unit07.lesson03.teach.line06:
    title: "Close the encounter"
    gloss: "Mihai says goodbye back, using Ana's name."
    note: "The same friendly closing pattern unit01's, unit05's, and unit06's dialogues all ended on."

exercises:
  ro.a1.unit07.lesson01.exercise01.choose_cat_costa:
    instruction: "Which phrase means 'How much does it cost?'"
    correct_option: "Cât costă?"
    distractors: ["Scump", "Ieftin"]
    accepted_answers: ["Cât costă?"]

  ro.a1.unit07.lesson01.exercise02.choose_scump:
    instruction: "Which word means 'expensive'?"
    correct_option: "Scump"
    distractors: ["Ieftin", "Leu"]
    accepted_answers: ["Scump"]

  ro.a1.unit07.lesson01.exercise03.listen_costa_cinci_lei:
    instruction: "Listen and select what you hear."
    correct_option: "Costă cinci lei"
    distractors: ["Costă un leu", "Costă douăzeci de lei"]
    accepted_answers: ["Costă cinci lei"]

  ro.a1.unit07.lesson01.exercise04.match_pret:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Cât costă?": "How much does it cost?"
      "Leu": "currency (lei)"
      "Scump": "expensive"
      "Ieftin": "cheap"
      "doi": "two"
      "cinci": "five"
      "zece": "ten"
      "douăzeci": "twenty"

  ro.a1.unit07.lesson01.exercise05.order_costa_un_leu:
    instruction: "Build the sentence: It costs one leu."
    correct_response: ["Costă", "un", "leu"]

  ro.a1.unit07.lesson01.exercise06.listen_order_costa_douazeci_de_lei:
    instruction: "Listen, then put the words in order."
    correct_response: ["Costă", "douăzeci", "de", "lei"]

  ro.a1.unit07.lesson01.exercise07.complete_scump:
    instruction: "Complete the reaction with the word for 'expensive'."
    accepted_answers: ["Scump", "scump"]
    feedback: "Cinci lei? *Scump*! -- a natural reaction when you think a price is too high."

  ro.a1.unit07.lesson01.exercise08.speak_cat_costa:
    instruction: "Say aloud: How much does it cost?"
    accepted_answers:
      - "Cât costă?"
      - "Cât costă"

  ro.a1.unit07.lesson02.exercise01.choose_piata:
    instruction: "Which word means 'market'?"
    correct_option: "Piață"
    distractors: ["Kilogram", "Cartofi"]
    accepted_answers: ["Piață"]

  ro.a1.unit07.lesson02.exercise02.choose_unde_pot_sa_cumpar:
    instruction: "Which phrase means 'Where can I buy ...?'"
    correct_option: "Unde pot să cumpăr ...?"
    distractors: ["Cât costă ...?", "Aș dori ..."]
    accepted_answers: ["Unde pot să cumpăr ...?"]

  ro.a1.unit07.lesson02.exercise03.listen_vreau_kilogram_cartofi:
    instruction: "Listen and select what you hear."
    correct_option: "Vreau un kilogram de cartofi"
    distractors: ["Vreau un kilogram de roșii", "Aș dori roșii"]
    accepted_answers: ["Vreau un kilogram de cartofi"]

  ro.a1.unit07.lesson02.exercise04.match_piata:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Piață": "market"
      "Roșii": "tomatoes"
      "Cartofi": "potatoes"
      "Kilogram": "kilogram"
      "Vreau": "I want"
      "Aș dori": "I would like"
      "Unde pot să cumpăr ...?": "Where can I buy ...?"
      "Vă rog": "please (formal)"

  ro.a1.unit07.lesson02.exercise05.order_vreau_kilogram_cartofi:
    instruction: "Build the sentence: I want a kilogram of potatoes."
    correct_response: ["Vreau", "un", "kilogram", "de", "cartofi"]

  ro.a1.unit07.lesson02.exercise06.listen_order_cat_costa_kilogram_rosii:
    instruction: "Listen, then put the words in order."
    correct_response: ["Cât", "costă", "un", "kilogram", "de", "roșii"]

  ro.a1.unit07.lesson02.exercise07.complete_as_dori_rosii_si:
    instruction: "Complete the sentence with the word for 'potatoes'."
    accepted_answers: ["cartofi", "Cartofi"]
    feedback: "Aș dori roșii și *cartofi* -- the two market items this lesson taught."

  ro.a1.unit07.lesson02.exercise08.speak_unde_pot_sa_cumpar_rosii:
    instruction: "Say aloud: Where can I buy tomatoes?"
    accepted_answers:
      - "Unde pot să cumpăr roșii?"
      - "Unde pot să cumpăr roșii"

  ro.a1.unit07.lesson03.exercise01.choose_who_says_ieftin:
    instruction: "Who says this line?"
    correct_option: "Mihai"
    distractors: ["Ana"]
    accepted_answers: ["Mihai"]

  ro.a1.unit07.lesson03.exercise02.dialogue_comprehend_piata:
    instruction: "Listen to the dialogue. How much do the tomatoes cost?"
    correct_option: "cinci lei"
    distractors: ["zece lei", "douăzeci de lei"]
    accepted_answers: ["cinci lei"]

  ro.a1.unit07.lesson03.exercise03.reading_comprehend_ana_wants:
    instruction: "According to the dialogue, what does Ana want to buy?"
    correct_option: "Roșii și cartofi."
    distractors:
      - "Pâine și pui."
      - "O cafea și un ceai."
    accepted_answers:
      - "Roșii și cartofi."
      - "Roșii și cartofi"

  ro.a1.unit07.lesson03.exercise04.match_unit_review:
    instruction: "Match each word to its English meaning."
    correct_response:
      "Piață": "market"
      "Roșii": "tomatoes"
      "Cartofi": "potatoes"
      "Kilogram": "kilogram"
      "Leu": "currency (lei)"
      "Scump": "expensive"
      "Ieftin": "cheap"
      "Cât costă?": "How much does it cost?"
      "Vreau": "I want"
      "Aș dori": "I would like"

  ro.a1.unit07.lesson03.exercise05.order_cat_costa_kilogram_cartofi:
    instruction: "Build the sentence: How much does a kilogram of potatoes cost?"
    correct_response: ["Cât", "costă", "un", "kilogram", "de", "cartofi"]

  ro.a1.unit07.lesson03.exercise06.complete_costa_cinci:
    instruction: "Complete the sentence."
    accepted_answers: ["lei"]
    feedback: "Costă cinci *lei* -- with 2-19, lei stays plain, no *de* needed."

  ro.a1.unit07.lesson03.exercise07.respond_as_mihai:
    instruction: "Take Mihai's role. Ana asks how much a kilogram of tomatoes costs -- answer that it costs five lei and that it's cheap."
    accepted_answers:
      - "Costă cinci lei. Ieftin!"
      - "Costă cinci lei, ieftin!"

  ro.a1.unit07.lesson03.exercise08.speak_closing_piata:
    instruction: "Say aloud: Thank you! Goodbye!"
    accepted_answers:
      - "Mulțumesc! La revedere!"
      - "Mulțumesc, la revedere!"

  ro.a1.unit07.lesson01.exercise09.dictation_costa_cinci_lei:
    instruction: "Type what you hear."
    correct_option: "Costă cinci lei"
    accepted_answers: [{value: "Costă cinci lei", status: correct}]
    orthography_strict: true
