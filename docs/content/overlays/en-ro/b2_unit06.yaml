    distractors: ["That it is a bad idea.", "That it makes no difference.", "That only a few students should do it."]
    accepted_answers: [{value: "That it is a good idea.", status: correct}]
    feedback: "The author writes: Sunt convinsă că este o idee bună (I'm convinced that it is a good idea)."
  ro.b2.unit06.lesson05.exercise02.read_qualification:
    instruction: "How does the author qualify the claim, rather than stating it as absolute?"
    correct_option: "By saying it depends on each person's situation."
    distractors: ["By saying it applies to absolutely everyone.", "By saying it never applies to anyone.", "By refusing to take a position."]
    accepted_answers: [{value: "By saying it depends on each person's situation.", status: correct}]
    feedback: "The author qualifies: nu neapărat pentru toți elevii -- depinde de situația fiecăruia (not necessarily for all students -- it depends on each person's situation)."
  ro.b2.unit06.lesson05.exercise03.read_concession:
    instruction: "How does the author acknowledge the opposing view?"
    correct_option: "By saying she understands the point of those who disagree."
    distractors: ["By ignoring it completely.", "By agreeing with it fully.", "By saying it is not worth discussing."]
    accepted_answers: [{value: "By saying she understands the point of those who disagree.", status: correct}]
    feedback: "The author writes: Înțeleg punctul celor care nu sunt de acord (I understand the point of those who disagree)."
  ro.b2.unit06.lesson05.exercise04.read_final_value:
    instruction: "What is the disadvantage the author names on the other hand?"
    correct_option: "That not all students have the same possibilities."
    distractors: ["That volunteering costs money.", "That volunteering takes too long.", "That schools lack resources."]
    accepted_answers: [{value: "That not all students have the same possibilities.", status: correct}]
    feedback: "The disadvantage: nu toți elevii au aceleași posibilități (not all students have the same possibilities)."
  ro.b2.unit06.lesson05.exercise05.match_reading_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {societatea: "the society", "situația fiecăruia": "each person's situation", avantajele: "the advantages", clare: clear, "acest lucru": "this (thing)", responsabilitate: responsibility}
        status: correct
    feedback: "These are the reading's key words."
  ro.b2.unit06.lesson05.exercise06.translate_o_idee_buna:
