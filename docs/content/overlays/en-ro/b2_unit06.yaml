course:
  title: Romanian B2
  description: >-
    Upper-intermediate Romanian: discuss abstract ideas and values --
    state an opinion, qualify it (într-o anumită măsură, în general,
    depinde de), respond to another person's counterargument (Înțeleg
    punctul dumneavoastră, nu sunt de acord), and weigh both sides (pe de
    o parte, pe de altă parte), around the question of whether
    volunteering should be mandatory in high school.

units:
  ro.b2.unit06.abstractizare:
    title: "Abstract ideas"
    description: Discuss an abstract social question -- state an opinion with qualification, respond to another person's counterargument, and weigh both sides.

lessons:
  ro.b2.unit06.lesson01.ce_parere_aveti:
    title: "What is your opinion?"
  ro.b2.unit06.lesson02.opinie_nuantata:
    title: "A nuanced opinion"
  ro.b2.unit06.lesson03.reactia_la_contraargument:
    title: "Responding to a counterargument"
  ro.b2.unit06.lesson04.pro_si_contra:
    title: "Pros and cons"
  ro.b2.unit06.lesson05.o_opinie_scrisa:
    title: "Reading an opinion"
  ro.b2.unit06.lesson06.o_discutie_nuantata:
    title: "A nuanced discussion"

teaching:
  ro.b2.unit06.lesson01.teach.voluntariatul:
    title: volunteering
    gloss: volunteering
    note: "*Voluntariatul* (with the definite article) means 'volunteering' as a general activity -- Romanian uses the definite article for an activity or idea in general, where English uses a bare noun."
    example_gloss: "Volunteering helps the community."
  ro.b2.unit06.lesson01.teach.obligatoriu:
    title: mandatory
    gloss: "mandatory / compulsory"
    example_gloss: "The course is mandatory."
  ro.b2.unit06.lesson01.teach.liceu:
    title: "high school"
    gloss: "high school"
    example_gloss: "Ana teaches at a high school."
  ro.b2.unit06.lesson01.teach.ar_trebui:
    title: should
    gloss: "should (conditional of a trebui)"
    note: "*Ar trebui* softens *trebuie* ('must') into 'should' -- the right strength for stating an opinion about what OUGHT to happen, not a hard requirement."
    example_gloss: "Students should help."
  ro.b2.unit06.lesson01.teach.sunt_convinsa:
    title: "I'm convinced"
    gloss: "I'm convinced (feminine sunt convinsă / masculine sunt convins)"
    example_gloss: "I'm convinced that volunteering helps."
  ro.b2.unit06.lesson01.teach.o_idee_buna:
    title: "a good idea"
    gloss: "a good idea"
  ro.b2.unit06.lesson01.teach.claim_model:
    title: "I think that volunteering should be mandatory in high school."
    gloss: "I think that volunteering should be mandatory in high school."
    note: "A model opinion. *Cred că...* (already familiar from earlier in the course) opens it; *ar trebui să fie* softens the claim into 'should be' rather than a flat statement of fact."
  ro.b2.unit06.lesson01.teach.grammar_forme_opinie:
    title: "I think that volunteering should be mandatory in high school. I'm convinced that it is a good idea."
    gloss: "I think that volunteering should be mandatory in high school. I'm convinced that it is a good idea."
    note: "Stating an opinion about an abstract topic works the same way as stating a concrete claim (with *cred că*), but *ar trebui* ('should') is the natural strength for a values question -- not a claim of plain fact."

  ro.b2.unit06.lesson02.teach.intr_o_anumita_masura:
    title: "to a certain extent"
    gloss: "to a certain extent"
    note: "*Într-o anumită măsură* limits how far you agree -- 'to a certain extent', not entirely."
  ro.b2.unit06.lesson02.teach.in_general:
    title: "in general"
    gloss: "in general"
    example_gloss: "In general, students agree."
  ro.b2.unit06.lesson02.teach.in_multe_cazuri:
    title: "in many cases"
    gloss: "in many cases"
  ro.b2.unit06.lesson02.teach.nu_neaparat:
    title: "not necessarily"
    gloss: "not necessarily"
    note: "*Nu neapărat* limits how UNIVERSAL a claim is -- 'not necessarily true for everyone' -- different from *într-o anumită măsură*, which limits how far a single claim goes."
    example_gloss: "Not necessarily for all students."
  ro.b2.unit06.lesson02.teach.depinde_de:
    title: "it depends on..."
    gloss: "it depends on..."
    note: "*Depinde de...* names exactly what the answer varies with -- a precise, common way to qualify an abstract claim."
  ro.b2.unit06.lesson02.teach.responsabilitate:
    title: responsibility
    gloss: responsibility
    example_gloss: "Volunteering teaches responsibility."
  ro.b2.unit06.lesson02.teach.grammar_nuance:
    title: "To a certain extent, I agree. In general, volunteering teaches responsibility. But not necessarily for all students -- it depends on the student."
    gloss: "To a certain extent, I agree. In general, volunteering teaches responsibility. But not necessarily for all students -- it depends on the student."
    note: "A nuanced opinion limits its own scope: *într-o anumită măsură* / *în general* / *în multe cazuri* soften how strongly you claim something; *nu neapărat* / *depinde de* mark where the claim stops applying."

  ro.b2.unit06.lesson03.teach.asta_e_adevarat_dar:
    title: "That's true, but..."
    gloss: "That's true, but..."
    note: "*Asta e adevărat, dar...* grants the other person's point before pivoting -- a shorter, spoken-register cousin of *Este adevărat*, which you already know."
  ro.b2.unit06.lesson03.teach.inteleg_punctul:
    title: "I understand your point."
    gloss: "I understand your point."
    note: "*Înțeleg punctul dumneavoastră* names the OTHER person's point explicitly before disagreeing -- more deliberate than a bare 'I understand', and keeps the formal dumneavoastră."
  ro.b2.unit06.lesson03.teach.nu_sunt_de_acord:
    title: "I disagree."
    gloss: "I disagree."
    note: "The direct negation of *Sunt de acord* ('I agree') -- add *nu* to disagree instead."
  ro.b2.unit06.lesson03.teach.elevii_nu_au_timp:
    title: "Not all students have time."
    gloss: "Not all students have time."
  ro.b2.unit06.lesson03.teach.grammar_raspuns:
    title: "I understand your point, but I disagree. Not all students have time."
    gloss: "I understand your point, but I disagree. Not all students have time."
    note: "Responding to a counterargument = naming that you understood it (*Înțeleg punctul dumneavoastră*, *Asta e adevărat*), then stating clearly whether you agree or not (*Nu sunt de acord*), backed by a reason."

  ro.b2.unit06.lesson04.teach.pe_de_o_parte_alta:
    title: "on the one hand... on the other hand..."
    gloss: "on the one hand... on the other hand..."
    note: "Familiar argumentation vocabulary, now weighing an abstract value question instead of a concrete practical choice."
  ro.b2.unit06.lesson04.teach.avantaj:
    title: advantage
    gloss: advantage
    example_gloss: "It has a big advantage."
  ro.b2.unit06.lesson04.teach.dezavantaj:
    title: disadvantage
    gloss: disadvantage
    example_gloss: "It also has a disadvantage."
  ro.b2.unit06.lesson04.teach.societate:
    title: society
    gloss: society
    example_gloss: "It is good for society."
  ro.b2.unit06.lesson04.teach.sanatos:
    title: healthy
    gloss: healthy
    example_gloss: "It is healthy for students."
  ro.b2.unit06.lesson04.teach.grammar_cantarire:
    title: "On the one hand, it is good for society. On the other hand, not all students have the same possibilities."
    gloss: "On the one hand, it is good for society. On the other hand, not all students have the same possibilities."
    note: "Weighing pros and cons at the values level: name a societal advantage (*bun pentru societate*) against a fairness concern (*nu toți au aceleași posibilități*) -- the classic shape of a values debate."

  ro.b2.unit06.lesson05.teach.text:
    title: "Reading: an opinion on mandatory volunteering"
    gloss: "I think that volunteering should be mandatory in high school. I'm convinced that it is a good idea. In general, volunteering teaches responsibility, and this helps society. Of course, not necessarily for all students -- it depends on each person's situation. I understand the point of those who disagree, but, on the one hand, the advantages are clear. On the other hand, not all students have the same possibilities."
    glosses:
      acest: this
      lucru: thing
      societatea: "the society"
      situația: "the situation"
      fiecăruia: "of each one"
      celor: "of those"
      care: who
      avantajele: "the advantages"
      clare: clear

  ro.b2.unit06.lesson06.teach.dialogue_ana_open:
    title: "Ana: I think that volunteering should be mandatory in high school."
    gloss: "Ana: I think that volunteering should be mandatory in high school."
  ro.b2.unit06.lesson06.teach.dialogue_mihai_concede:
    title: "Mihai: I understand your point, but I disagree. Not all students have time."
    gloss: "Mihai: I understand your point, but I disagree. Not all students have time."
  ro.b2.unit06.lesson06.teach.dialogue_ana_qualify:
    title: "Ana: To a certain extent, you are right. It depends on the student."
    gloss: "Ana: To a certain extent, you are right. It depends on the student."
  ro.b2.unit06.lesson06.teach.dialogue_ana_push:
    title: "Ana: But, on the one hand, it is good for society."
    gloss: "Ana: But, on the one hand, it is good for society."
  ro.b2.unit06.lesson06.teach.dialogue_mihai_conviction:
    title: "Mihai: That's true. On the other hand, not all students have the same possibilities."
    gloss: "Mihai: That's true. On the other hand, not all students have the same possibilities."
  ro.b2.unit06.lesson06.teach.grammar_opinie_completa:
    title: "I think that volunteering should be mandatory. To a certain extent, it depends on the student. On the one hand, it is good for society. On the other hand, not all students have the same possibilities."
    gloss: "I think that volunteering should be mandatory. To a certain extent, it depends on the student. On the one hand, it is good for society. On the other hand, not all students have the same possibilities."
    note: "A full qualified opinion: state a claim (*cred că*), qualify it (*într-o anumită măsură*, *depinde de*), and weigh both sides (*pe de o parte... pe de altă parte*)."

