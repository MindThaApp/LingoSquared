course:
  title: Romanian B1
  description: >-
    Intermediate Romanian: communicating professionally in a workplace
    meeting -- a formal softened-conditional suggestion ("aș sugera"), a
    polite formal request ("ați putea să...?"), participating in a short
    work-meeting exchange, and writing a brief professional message.

units:
  ro.b1.unit18.intalniri_profesionale:
    title: "The Project Meeting"
    description: Communicate professionally in a workplace meeting -- make a formal softened-conditional suggestion or request, participate in a short exchange, and write a brief professional message.

lessons:
  ro.b1.unit18.lesson01.as_sugera_sedinta:
    title: "I would suggest that..."
  ro.b1.unit18.lesson02.ati_putea_sa_ne_spuneti:
    title: "Could you tell us...?"
  ro.b1.unit18.lesson03.as_avea_nevoie_multumesc:
    title: "I would need..."
  ro.b1.unit18.lesson04.dialogue_sedinta_proiect:
    title: "Dialogue: the project meeting"
  ro.b1.unit18.lesson05.wrapup_production:
    title: "Wrap-up"

teaching:
  ro.b1.unit18.lesson01.teach.as_sugera_sa_incepem_sedinta:
    title: "I would suggest that we start the meeting"
    gloss: "I would suggest that we start the meeting"
    note: "*sugera* (to suggest) and *să începem* (that we start) are new; *ședința* is the meeting word from unit 5. Together: a formal softened-conditional suggestion opening a work meeting."
    example_gloss: "I would suggest that we start the meeting with the project update."
  ro.b1.unit18.lesson01.teach.cu_actualizarea_proiectului:
    title: "with the project update"
    gloss: "with the project update"
    example_gloss: "I would suggest that we start the meeting with the project update."
  ro.b1.unit18.lesson01.teach.grammar_formal_softened_suggestion:
    title: "I would suggest that we start the meeting with the project update. In a work meeting, a formal suggestion is best made with the conditional (\"I would suggest\"), not a direct command."
    gloss: "I would suggest that we start the meeting with the project update. In a work meeting, a formal suggestion is best made with the conditional (\"I would suggest\"), not a direct command."
    note: "The unit's core formal-register construction."

  ro.b1.unit18.lesson02.teach.ati_putea_sa_ne_spuneti_stadiul:
    title: "could you tell us the status of the report"
    gloss: "could you tell us the status of the report"
    note: "*ați putea să...?* (could you...?) is the polite formal request you already know; new here: *ne spuneți* (tell us) and *stadiul raportului* (the status of the report)."
    example_gloss: "Diana, could you tell us the status of the report?"
  ro.b1.unit18.lesson02.teach.raportul_este_aproape_gata:
    title: "the report is almost ready"
    gloss: "the report is almost ready"
    example_gloss: "Yes, the report is almost ready."
  ro.b1.unit18.lesson02.teach.grammar_formal_question_request:
    title: "A polite formal request: could you...?"
    gloss: "Could you tell us the status of the report? The phrasing \"could you...?\" is a polite, formal request suited to a work meeting -- more polite than a direct question like \"what is the status?\"."
    note: "The unit's second formal construction: a polite formal request."

  ro.b1.unit18.lesson03.teach.as_avea_nevoie_de_inca_o_zi:
    title: "I would need one more day"
    gloss: "I would need one more day"
    note: "*a avea nevoie de* (to need) in the conditional, *aș avea nevoie de*: a softened request for more time."
    example_gloss: "The report is almost ready. I would need one more day."
  ro.b1.unit18.lesson03.teach.va_multumesc_pentru_actualizare:
    title: "thank you for the update"
    gloss: "thank you for the update"
    example_gloss: "Perfect, thank you for the update."
  ro.b1.unit18.lesson03.teach.grammar_professional_closing:
    title: "Closing a professional exchange: a request plus formal thanks"
    gloss: "I would need one more day. Thank you for the update. In a professional context, a polite request for more time (\"I would need...\") and a formal thanks (\"thank you\") correctly close the exchange."
    note: "Shows how to close a professional exchange."

  ro.b1.unit18.lesson04.teach.dialogue_mihai_1:
    title: "I would suggest that we start the meeting with the project update."
    gloss: "I would suggest that we start the meeting with the project update."
  ro.b1.unit18.lesson04.teach.dialogue_ana_1:
    title: "Of course. Diana, could you tell us the status of the report?"
    gloss: "Of course. Diana, could you tell us the status of the report?"
  ro.b1.unit18.lesson04.teach.dialogue_diana_1:
    title: "Yes, the report is almost ready. I would need one more day."
    gloss: "Yes, the report is almost ready. I would need one more day."
  ro.b1.unit18.lesson04.teach.dialogue_mihai_2:
    title: "Perfect, thank you for the update."
    gloss: "Perfect, thank you for the update."

  ro.b1.unit18.lesson05.teach.grammar_review:
    title: "I would suggest that we start the meeting with the project update. Could you tell us the status of the report? I would need one more day. Thank you for the update."
    gloss: "I would suggest that we start the meeting with the project update. Could you tell us the status of the report? I would need one more day. Thank you for the update."
  ro.b1.unit18.lesson05.teach.mesaj_profesional_diana:
    title: "I am writing to confirm that the report will be ready tomorrow"
    gloss: "I am writing to confirm that the report will be ready tomorrow"
    example_gloss: "Dear Mr. Popescu, I am writing to confirm that the report will be ready tomorrow."

