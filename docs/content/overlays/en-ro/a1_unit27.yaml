teaching:
  ro.a1.unit27.lesson01.teach.fericit_trist_suparat:
    title: Happy, sad, and angry
    gloss: happy, sad, angry
    note: 'Three basic feeling words used with *a fi* (to be). Each has a feminine form in *-ă*: *fericită*, *tristă*, *supărată*.'
    example_gloss:
    - I am happy.
    - I am sad.
    - I am angry.
  ro.a1.unit27.lesson01.teach.sunt_fericit:
    title: Saying you're happy
    gloss: I am happy.
    note: '*Sunt* (from *a fi*, to be) + a feeling adjective is the basic pattern, like English "I am ...". A woman says *Sunt fericită*.'
  ro.a1.unit27.lesson01.teach.nu_sunt_suparat:
    title: Contrasting feelings
    gloss: I am not angry, I am sad.
    note: '*Nu* before the verb makes it negative: *Nu sunt supărat*. The second clause then states the actual feeling.'
  ro.a1.unit27.lesson02.teach.de_ce_esti:
    title: Asking why
    gloss: Why are you happy?
    note: '*De ce* (why) is the standard question for a reason.'
  ro.a1.unit27.lesson02.teach.sunt_fericit_pentru:
    title: Giving a reason
    gloss: I am happy because I have a new apartment.
    note: '*Pentru că* (because) introduces the reason clause; the word order stays normal: *am un apartament nou*.'
  ro.a1.unit27.lesson02.teach.sunt_trist_pentru:
    title: A negative reason
    gloss: I am sad because it is raining.
    note: '*Plouă* (it rains) has no subject in Romanian, so it works on its own as the reason clause.'
  ro.a1.unit27.lesson03.teach.emotionat:
    title: Nervous
    gloss: nervous
    note: The standard word for nervousness.
    example_gloss: I am nervous about my first shift.
  ro.a1.unit27.lesson03.teach.sunt_emotionat_pentru:
    title: Stating what you're nervous about
    gloss: I am nervous about my first shift.
    note: '*Pentru* (literally "for") introduces what the nervousness is about, where English says "about".'
  ro.a1.unit27.lesson03.teach.nu_ti_face:
    title: Reassuring someone
    gloss: Don't worry.
    note: '*Nu-ți face griji* (literally "don''t make worries for yourself") is the standard fixed phrase of reassurance. To a stranger: *Nu vă faceți griji*.'
  ro.a1.unit27.lesson04.teach.cum_se_simte:
    title: Asking how someone feels
    gloss: How does Mihai feel?
    note: '*A se simți* (to feel) is reflexive: *mă simt* (I), *te simți* (you), *se simte* (he/she). It is the standard way to ask about or describe feelings.'
  ro.a1.unit27.lesson04.teach.el_se_simte:
    title: Describing how someone feels
    gloss: He feels nervous.
    note: '*Se* is the reflexive pronoun for he/she and goes before the verb: *se simte*.'
  ro.a1.unit27.lesson04.teach.de_ce_se:
    title: Asking why someone feels a certain way
    gloss: Why does he feel nervous?
    note: Combines *de ce* with the *se simte* pattern from *El se simte emoționat*.
  ro.a1.unit27.lesson05.teach.salut_ana_sunt:
    title: Read a message about feelings
    gloss: Hi Ana, I'm a little nervous about my first shift alone. But I'm also happy, because I have a new job and a new apartment. I think it'll be fine.
    note: Track what the writer is nervous about, what makes him happy, and his overall outlook.
    glosses:
      puțin: a little
      emoționat: nervous
      prima: first
      tură: shift
      singur: alone
      fericit: happy
      fiindcă: because
      nou: new
      serviciu: job
      apartament: apartment
      cred: think
      rezolvă: 'turns out (here: will be fine)'
  ro.a1.unit27.lesson06.teach.ana_salut_mihai:
    title: Ana asks how Mihai feels
    gloss: 'Ana: Hi Mihai, how are you feeling about your first shift?'
    note: '*Cum te simți* uses the reflexive *te* ("yourself"); in *prima ta tură* the possessive *ta* agrees with feminine *tură*.'
  ro.a1.unit27.lesson06.teach.mihai_sunt_putin:
    title: Mihai admits he's nervous
    gloss: 'Mihai: I''m a bit nervous, honestly.'
    note: '*Sincer să fiu* (to be honest) softens the admission.'
  ro.a1.unit27.lesson06.teach.ana_nu_ti:
    title: Ana reassures him
    gloss: 'Ana: Don''t worry, you can do it well!'
    note: '*O să te descurci bine* (literally "you will manage well") is an encouraging fixed expression; *o să* + verb makes the future.'
  ro.a1.unit27.lesson06.teach.mihai_multumesc_chiar:
    title: Mihai thanks her
    gloss: 'Mihai: Thanks, that really helps.'
    note: '*Ajută* is the he/she/it form of *a ajuta* (to help); here it means "it helps".'
  ro.a1.unit27.lesson06.teach.ana_si_dupa:
    title: Ana predicts the outcome
    gloss: 'Ana: And afterward you''ll definitely be very happy and proud.'
    note: '*Sigur* (surely) expresses confident prediction; *mândru* (proud) is a new, useful adjective (*mândră* for a woman).'
  ro.a1.unit27.lesson06.teach.mihai_da_si:
    title: Mihai agrees
    gloss: 'Mihai: Yes, I think so too.'
    note: '*Și eu cred asta* (literally "I think this too") is the natural way to agree with someone''s opinion.'
  ro.a1.unit27.lesson06.teach.mihai_este_emotionat:
    title: Summing up with este, lui and îl
    gloss: Mihai is nervous about his first shift. Ana helps him.
    note: '*Este* is the he/she form of *a fi* (to be); *lui* after the noun means "his"; *îl* means "him" and goes before the verb: *îl ajută*. Three small but essential words for talking about someone else.'
