schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit17_work.yaml for full detail.
    This unit's source PDF (US Peace Corps Moldova's "Basic Romanian
    Language Lessons") was checked for job/work/profession/occupation
    material and found two real hits: a vocabulary list "I was a
    student / engineer / doctor / farmer / teacher... / Eu am fost
    student / inginer / doctor / fermier / profesor..." (giving the
    word "inginer") and "Sînt profesoară" (I am a teacher, modernized
    to "Sunt profesoară"). Combined into "Sunt inginer." for Mihai and
    "Sunt profesoară." for Ana. No source material covers workplace
    nouns at all, so "birou" (office) and "școală" (school) are freely
    authored fresh, disclosed honestly: both basic-tier, extremely
    common Romanian nouns with no plausible substitute. The formal
    "lucrați" (you work) is a freely-authored regular conjugation of
    the already within-course-established "a lucra," following the
    same -ați/-eți formal ending already established by "aveți"/
    "faceți." Glosses/notes here are freshly authored to explain the
    target-language forms to an English speaker.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    realization file's own review pass. Checked clean: correct_response/
    accepted_answers shapes match the realization's word_bank/pairs, no
    same-speaker distractor collisions, no stray YAML booleans, no
    jargon leaks, English glosses/notes are accurate translations of
    the Romanian forms as authored. Seventeenth Romanian overlay, first
    draft, authored alongside the paired realization.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț). For
    free-typed A1 answers, accept otherwise-correct forms with the
    diacritics omitted or with the legacy cedilla variants ş/ţ
    substituted for ș/ț, matching units 01-16's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    This unit's own new vocabulary (inginer, birou, profesoară, școală)
    is used only in fixed first-person forms (Mihai's own "Sunt
    inginer", Ana's own "Sunt profesoară"). The one new conjugated verb
    form, "lucrați," reuses the already-established formal -ați/-eți
    ending. No informal-tu form is introduced this unit; Ana and Mihai
    keep their existing formal register with each other.

course:
  title: "Romanian A1"
  description: >-
    Stating a basic occupation and workplace in Romanian -- Inginer
    (engineer), Profesoară (teacher), Birou (office), and Școală
    (school) -- as Mihai and Ana talk about where they work.

units:
  ro.a1.unit17.work:
    title: "Work"

lessons:
  ro.a1.unit17.lesson01.mihai_este_inginer:
    title: "Mihai is an engineer"
  ro.a1.unit17.lesson02.ana_este_profesoara:
    title: "Ana is a teacher"
  ro.a1.unit17.lesson03.unde_lucrati_dialog:
    title: "Where do you work?"

teaching:
  ro.a1.unit17.lesson01.teach.reminder_este_la_mihai:
    title: "Reminder: este, la, Mihai"
    gloss: "este (is) · la (at) · Mihai (name)"
    note: >-
      Este is from unit03/unit04/unit08; la is from unit04's *la ora
      nouă* (at nine o'clock); Mihai is the character's name,
      established since unit01 -- this unit reuses all three to talk
      about his job.

  ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza:
    title: "Reminder: lucrez, lucrează"
    gloss: "lucrez (I work) · lucrează (he/she works)"
    note: "Both from unit10's daily routine (*Lucrez seara.*) -- this unit reuses them to talk about occupation instead of the time of day."

  ro.a1.unit17.lesson01.teach.inginer_vocab:
    title: "Engineer"
    gloss: "Inginer (engineer)"
    note: "Masculine -- only Mihai uses it this unit (*Sunt inginer*), so no feminine form is needed yet."
    example_gloss:
      - "Mihai is an engineer."

  ro.a1.unit17.lesson01.teach.birou_vocab:
    title: "Office"
    gloss: "Birou (office)"
    note: "The workplace where Mihai works, following unit04's already-established *la* (at) preposition."
    example_gloss:
      - "He works at the office."

  ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase:
    title: "Mihai is an engineer. He works at the office."
    gloss: "Mihai este inginer. Lucrează la birou."
    note: "Every word here was already taught or just introduced, combined into two new sentences about Mihai's job."

  ro.a1.unit17.lesson02.teach.reminder_sunt_unde_ana:
    title: "Reminder: sunt, unde, Ana"
    gloss: "sunt (I am) · unde (where) · Ana (name)"
    note: >-
      Sunt is from unit16 (*Sunt bolnav*); unde is from unit07/unit08
      (*Unde pot să cumpăr...?*, *Unde este...?*); Ana is the
      character's name, established since unit01 -- this unit reuses
      all three to talk about Ana's job.

  ro.a1.unit17.lesson02.teach.profesoara_vocab:
    title: "Teacher"
    gloss: "Profesoară (teacher, feminine)"
    note: "Feminine -- only Ana uses it this unit (*Sunt profesoară*), so no masculine form is needed yet."
    example_gloss:
      - "I am a teacher."

  ro.a1.unit17.lesson02.teach.scoala_vocab:
    title: "School"
    gloss: "Școală (school)"
    note: "The workplace where Ana works, using *la* the same way as *la birou*."
    example_gloss:
      - "I work at the school."

  ro.a1.unit17.lesson02.teach.sunt_profesoara_lucrez_la_scoala_phrase:
    title: "I am a teacher. I work at the school."
    gloss: "Sunt profesoară. Lucrez la școală."
    note: "Ana's own statement about her job, combining this lesson's two new words with unit16's already-taught *sunt*."

  ro.a1.unit17.lesson02.teach.unde_lucrati_phrase:
    title: "Where do you work?"
    gloss: "Unde lucrați? (Where do you work?, formal)"
    note: "*Lucrați* is the formal 'you work' form, the same -ați/-eți ending already seen in *aveți*/*faceți* -- useful for asking anyone about their job."

  ro.a1.unit17.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: "Reminder: Bună, Ce mai faceți?, Bine, mulțumesc"
    gloss: "Bună (hi) · Ce mai faceți? (how are you, formal) · Bine, mulțumesc (fine, thank you)"
    note: "All from unit01's opening greeting, reused here to start this unit's own dialogue."

  ro.a1.unit17.lesson03.teach.reminder_si_dumneavoastra_la_revedere:
    title: "Reminder: Și dumneavoastră?, La revedere"
    gloss: "Și dumneavoastră? (and you, formal) · La revedere (goodbye)"
    note: "Both from unit01, reused here as the natural follow-up question and closing line."

  ro.a1.unit17.lesson03.teach.line01:
    title: "Greet and ask how he is"
    gloss: "Ana greets Mihai and asks how he's doing."
    note: "Reuses unit01's own *Ce mai faceți?* greeting."

  ro.a1.unit17.lesson03.teach.line02:
    title: "Answer and ask where she works"
    gloss: "Mihai answers, then asks Ana where she works."
    note: "Combines unit01's *Bine, mulțumesc* with this unit's own *Unde lucrați?*."

  ro.a1.unit17.lesson03.teach.line03:
    title: "Say your job and workplace, then ask back"
    gloss: "Ana says she works at a school as a teacher, then asks Mihai the same question."
    note: "Combines this unit's own lesson02 phrase with unit01's *Și dumneavoastră?*."

  ro.a1.unit17.lesson03.teach.line04:
    title: "Say your job and workplace"
    gloss: "Mihai says he works at an office as an engineer."
    note: "Reuses this unit's own lesson01 phrase almost exactly."

  ro.a1.unit17.lesson03.teach.line05:
    title: "Close the conversation"
    gloss: "Ana says goodbye."
    note: "The same closing pattern every earlier unit's dialogue has ended on."

  ro.a1.unit17.lesson03.teach.line06:
    title: "Say goodbye"
    gloss: "Mihai says goodbye."
    note: "The same closing pattern every earlier unit's dialogue has ended on."

exercises:
  ro.a1.unit17.lesson01.exercise01.choose_inginer:
    instruction: "Which word means 'engineer'?"
    correct_option: "Inginer"
    distractors: ["Birou", "Profesoară"]
    accepted_answers: ["Inginer"]

  ro.a1.unit17.lesson01.exercise02.choose_birou:
    instruction: "Which word means 'office'?"
    correct_option: "Birou"
    distractors: ["Școală", "Inginer"]
    accepted_answers: ["Birou"]

  ro.a1.unit17.lesson01.exercise03.listen_mihai_este_inginer:
    instruction: "Listen and select what you hear."
    correct_option: "Mihai este inginer"
    distractors: ["Lucrează la birou.", "Ana este profesoară."]
    accepted_answers: ["Mihai este inginer"]

  ro.a1.unit17.lesson01.exercise04.match_work1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Inginer": "engineer"
      "Birou": "office"
      "Lucrează": "works"
      "Este": "is"
      "Mihai este inginer.": "Mihai is an engineer."
      "Lucrează la birou.": "He works at the office."

  ro.a1.unit17.lesson01.exercise05.order_mihai_este_inginer:
    instruction: "Build the sentence: Mihai is an engineer."
    correct_response: ["Mihai", "este", "inginer"]

  ro.a1.unit17.lesson01.exercise06.listen_order_lucreaza_la_birou:
    instruction: "Listen, then put the words in order."
    correct_response: ["Lucrează", "la", "birou"]

  ro.a1.unit17.lesson01.exercise07.complete_mihai_este_inginer:
    instruction: "Complete the sentence: Mihai is an engineer. He works at the office."
    accepted_answers: ["inginer", "Inginer"]
    feedback: "Mihai este *inginer* -- *inginer* is the word for 'engineer.'"

  ro.a1.unit17.lesson01.exercise08.speak_mihai_este_inginer:
    instruction: "Say aloud: Mihai is an engineer."
    accepted_answers:
      - "Mihai este inginer."
      - "Mihai este inginer"

  ro.a1.unit17.lesson02.exercise01.choose_profesoara:
    instruction: "Which word means 'teacher'?"
    correct_option: "Profesoară"
    distractors: ["Inginer", "Birou"]
    accepted_answers: ["Profesoară"]

  ro.a1.unit17.lesson02.exercise02.choose_scoala:
    instruction: "Which word means 'school'?"
    correct_option: "Școală"
    distractors: ["Birou", "Profesoară"]
    accepted_answers: ["Școală"]

  ro.a1.unit17.lesson02.exercise03.listen_sunt_profesoara:
    instruction: "Listen and select what you hear."
    correct_option: "Sunt profesoară"
    distractors: ["Sunt inginer.", "Unde lucrați?"]
    accepted_answers: ["Sunt profesoară"]

  ro.a1.unit17.lesson02.exercise04.match_work2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Profesoară": "teacher"
      "Școală": "school"
      "Unde": "where"
      "Lucrați": "you work (formal)"
      "Sunt profesoară.": "I am a teacher."
      "Unde lucrați?": "Where do you work?"

  ro.a1.unit17.lesson02.exercise05.order_sunt_profesoara:
    instruction: "Build the sentence: I am a teacher."
    correct_response: ["Sunt", "profesoară"]

  ro.a1.unit17.lesson02.exercise06.listen_order_unde_lucrati:
    instruction: "Listen, then put the words in order."
    correct_response: ["Unde", "lucrați"]

  ro.a1.unit17.lesson02.exercise07.complete_ana_este_profesoara:
    instruction: "Complete the sentence: Ana is a teacher. She works at the school."
    accepted_answers: ["profesoară", "Profesoară"]
    feedback: "Ana este *profesoară* -- *profesoară* is the word for 'teacher' (feminine)."

  ro.a1.unit17.lesson02.exercise08.speak_unde_lucrati:
    instruction: "Say aloud: Where do you work?"
    accepted_answers:
      - "Unde lucrați?"
      - "Unde lucrați"

  ro.a1.unit17.lesson03.exercise01.choose_who_says_line03:
    instruction: "Who says this line?"
    correct_option: "Ana"
    distractors: ["Mihai"]
    accepted_answers: ["Ana"]

  ro.a1.unit17.lesson03.exercise02.dialogue_comprehend_ana_job:
    instruction: "Listen to the dialogue. What is Ana's job?"
    correct_option: "Profesoară."
    distractors: ["Inginer."]
    accepted_answers: ["Profesoară."]

  ro.a1.unit17.lesson03.exercise03.reading_comprehend_mihai_job:
    instruction: "Read the note. What is Mihai's job?"
    correct_option: "Inginer."
    distractors:
      - "Profesoară."
      - "Doctor."
    accepted_answers:
      - "Inginer."
      - "Inginer"

  ro.a1.unit17.lesson03.exercise04.match_unit_review:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Inginer": "engineer"
      "Birou": "office"
      "Profesoară": "teacher"
      "Școală": "school"
      "Lucrează": "works"
      "Unde": "where"
      "Mihai este inginer.": "Mihai is an engineer."
      "Sunt profesoară.": "I am a teacher."

  ro.a1.unit17.lesson03.exercise05.order_ana_este_profesoara:
    instruction: "Build the sentence: Ana is a teacher."
    correct_response: ["Ana", "este", "profesoară"]

  ro.a1.unit17.lesson03.exercise06.complete_la_revedere:
    instruction: "Complete Ana's goodbye: Bine! La ___, Mihai!"
    accepted_answers: ["revedere", "Revedere"]
    feedback: "La *revedere* -- the standard way to say goodbye, from unit01."

  ro.a1.unit17.lesson03.exercise07.respond_as_mihai:
    instruction: "Take Mihai's role. Ana asks 'Și dumneavoastră?' after saying she's a teacher -- tell her you work at the office, as an engineer."
    accepted_answers:
      - "Lucrez la birou. Sunt inginer."
      - "Lucrez la birou, sunt inginer."
      - "Lucrez la birou și sunt inginer."

  ro.a1.unit17.lesson03.exercise08.speak_sunt_inginer:
    instruction: "Say aloud: I am an engineer. I work at the office."
    accepted_answers:
      - "Sunt inginer. Lucrez la birou."
      - "Sunt inginer, lucrez la birou."
      - "Sunt inginer și lucrez la birou."

  ro.a1.unit17.lesson03.exercise09.write_work_profile:
    instruction: "Write a short profile about your job (your occupation and where you work)."
    accepted_answers:
      - "Sunt inginer."
      - "Sunt profesoară."
      - "Lucrez la birou."
      - "Lucrez la școală."
      - "Sunt inginer. Lucrez la birou."
      - "Sunt inginer, lucrez la birou."
      - "Sunt profesoară. Lucrez la școală."
      - "Sunt profesoară, lucrez la școală."
