schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit08_places.yaml for full detail.
    Glosses/notes here are freshly authored to explain the target-
    language forms to an English speaker; the underlying "Unde este...?"
    question and the aproape/departe (close/far) pair trace to US Peace
    Corps Moldova's public-domain "Basic Romanian Language Lessons"
    (Lesson 4's "Unde este Internet Cafe?" / "Hotelul este aproape." /
    "Restaurantul este departe."). Everything else -- gară, magazin,
    bancă, spital, poștă, bibliotecă, stație de autobuz, lângă, vizavi
    de, între -- is freshly authored, disclosed honestly in the
    realization's own provenance note, since the source has no
    dedicated common-places/facilities lesson.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude). Found and fixed ONE real
    quality bug: exercise02.dialogue_comprehend_cartier ("Where is the
    library?") had a self-referential distractor, "lângă bibliotecă"
    (near the library) -- a place cannot sensibly be described as "near
    itself," so this was a confusing/weak wrong option rather than a
    genuinely plausible one, even though it wasn't the exact
    same-speaker-ambiguity bug class (Mihai's own line never actually
    claims the library is near itself, so it wasn't secretly correct).
    Fixed by changing that distractor to "lângă magazin" (near the
    store) -- a real place mentioned in the same dialogue, genuinely
    NOT the library's own established location per the realization
    file's own neighborhood-facts map, so still a clean, unambiguous
    wrong answer. Everything else checked clean: correct_response/
    accepted_answers shapes match the realization's word_bank/pairs, no
    other same-speaker distractor collisions, no stray YAML booleans,
    no jargon leaks, English glosses/notes are accurate translations of
    the Romanian forms as authored. Eighth Romanian overlay, first
    draft, authored alongside the paired realization.

    Second-pass review 2026-10-19: 4 fixes - lesson01 exercise07
    "Magazinul este ___." (departe equally valid) now names 'close';
    lesson03 exercise06 "Spitalul este ___ de magazin."
    (aproape/departe de also fit) now names 'opposite'; lesson03
    exercise07.respond_as_mihai now also accepts "Este între magazin
    și spital."; answer_policy.diacritics rewritten to match the
    grader.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with
    comma-below ș/ț. Free-typed answers are graded against these
    standard spellings: the grader does not fold away omitted
    diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should
    type the full standard spelling.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    No new register-sensitive forms in this unit -- este (is), the
    core verb every sentence here uses, does not change with tu or
    dumneavoastră (same standing note as unit03/unit04). Ana and
    Mihai's neighborhood dialogue keeps their existing polite register
    with each other, matching unit06/unit07.

course:
  title: "Romanian A1"
  description: >-
    Identifying and locating common places in Romanian -- asking Unde
    este...? (Where is...?), saying whether a place is aproape (close)
    or departe (far), and using lângă (next to), vizavi de (opposite),
    and între (between) to describe a simple neighborhood, continuing
    Ana and Mihai as they talk about getting around town.

units:
  ro.a1.unit08.places:
    title: "Places"

lessons:
  ro.a1.unit08.lesson01.unde_este:
    title: "Where is...?"
  ro.a1.unit08.lesson02.langa_vizavi_intre:
    title: "Next to, opposite, between"
  ro.a1.unit08.lesson03.in_cartier:
    title: "In the neighborhood"

teaching:
  ro.a1.unit08.lesson01.teach.reminder_unde_este:
    title: "Reminder: unde, este"
    gloss: "unde (where) · este (is)"
    note: >-
      Both already appeared -- *unde* in unit07's *Unde pot să cumpăr
      ...?*, *este* since unit03/unit04 -- here they combine into this
      unit's core location question.

  ro.a1.unit08.lesson01.teach.unde_este_phrase:
    title: "Where is...?"
    gloss: "Unde este...? (Where is...?)"
    note: "The everyday way to ask where something is -- add the place's name after *este*, or use it alone like this when the place is already clear from context."

  ro.a1.unit08.lesson01.teach.gara_magazin_banca:
    title: "Train station, store, bank"
    gloss: "gară (train station) · magazin (store) · bancă (bank)"
    note: "Three common places -- all take the definite article when talking about a specific, known one: *gara*, *magazinul*, *banca*."
    example_gloss:
      - "Where is the train station?"
      - "The store is close."
      - "The bank is far."

  ro.a1.unit08.lesson01.teach.aproape_departe:
    title: "Close, far"
    gloss: "aproape (close / near) · departe (far)"
    note: "A simple way to describe how near or far a place is, without giving exact directions."
    example_gloss:
      - "The store is close."
      - "The bank is far."

  ro.a1.unit08.lesson01.teach.magazinul_aproape:
    title: "The store is close"
    gloss: "Magazinul este aproape. (The store is close.)"
    note: "A short, complete statement -- no place name needed after *aproape* when it's already clear which place you mean."

  ro.a1.unit08.lesson01.teach.banca_departe:
    title: "The bank is far"
    gloss: "Banca este departe. (The bank is far.)"
    note: "The opposite of *aproape* -- same simple pattern."

  ro.a1.unit08.lesson01.teach.unde_este_gara:
    title: "Where is the train station?"
    gloss: "Unde este gara? (Where is the train station?)"
    note: "Puts *Unde este...?* and *gara* together in one full question."

  ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie:
    title: "Hospital, post office, library, bus stop"
    gloss: "spital (hospital) · poștă (post office) · bibliotecă (library) · stație de autobuz (bus stop)"
    note: "Four more common places -- like gară/magazin/bancă, these take the definite article for a specific one: *spitalul*, *poșta*, *biblioteca*, *stația de autobuz*."
    example_gloss:
      - "The hospital is opposite the store."
      - "The post office is between the store and the hospital."
      - "The library is close to the train station."
      - "The bus stop is next to the library."

  ro.a1.unit08.lesson02.teach.langa_vizavi_intre:
    title: "Next to, opposite, between"
    gloss: "lângă (next to) · vizavi de (opposite / across from) · între (between)"
    note: "Three ways to locate a place relative to another one. *Vizavi de* and *între* need *de*/*și* to connect to the second place; *lângă* connects directly."
    example_gloss:
      - "The store is next to the train station."
      - "The hospital is opposite the store."
      - "The post office is between the store and the hospital."

  ro.a1.unit08.lesson02.teach.magazinul_langa_gara:
    title: "The store is next to the train station"
    gloss: "Magazinul este lângă gară. (The store is next to the train station.)"
    note: "*Lângă* connects straight to the place name, with no extra word needed."

  ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin:
    title: "The hospital is opposite the store"
    gloss: "Spitalul este vizavi de magazin. (The hospital is opposite the store.)"
    note: "*Vizavi de* needs *de* before the second place."

  ro.a1.unit08.lesson02.teach.posta_intre:
    title: "The post office is between the store and the hospital"
    gloss: "Poșta este între magazin și spital. (The post office is between the store and the hospital.)"
    note: "*Între* names two places joined by *și* (and)."

  ro.a1.unit08.lesson02.teach.statia_langa_biblioteca:
    title: "The bus stop is next to the library"
    gloss: "Stația de autobuz este lângă bibliotecă. (The bus stop is next to the library.)"
    note: "Same *lângă* pattern as the store and the train station, now with the bus stop and the library."

  ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: "Reminder: bună, mulțumesc, la revedere, da, Ana, Mihai"
    gloss: "bună (hi) · mulțumesc (thank you) · la revedere (goodbye) · da (yes) · Ana, Mihai (names)"
    note: >-
      All already established in earlier units -- here Ana and Mihai
      meet again, this time in the neighborhood.

  ro.a1.unit08.lesson03.teach.line01:
    title: "Greet and ask where the post office is"
    gloss: "Ana greets Mihai and asks where the post office is."
    note: "Combines this unit's own *Unde este* with unit01's greeting."

  ro.a1.unit08.lesson03.teach.line02:
    title: "Give the location"
    gloss: "Mihai says the post office is between the store and the hospital."
    note: "Reuses this unit's own *poșta*/*între ... și* construction."

  ro.a1.unit08.lesson03.teach.line03:
    title: "Ask about the library"
    gloss: "Ana asks if the library is close."
    note: "A short follow-up question reusing *este* and *aproape*."

  ro.a1.unit08.lesson03.teach.line04:
    title: "Confirm and add more"
    gloss: "Mihai confirms the library is close to the train station and adds that the bus stop is next to the library."
    note: "Combines *aproape de* and *lângă* -- both this unit's own prepositions -- in one line."

  ro.a1.unit08.lesson03.teach.line05:
    title: "Thank and close"
    gloss: "Ana thanks Mihai and says goodbye."
    note: "*Mulțumesc* here is a simple closing thanks, the same word from unit01's *Bine, mulțumesc.*"

  ro.a1.unit08.lesson03.teach.line06:
    title: "Close the encounter"
    gloss: "Mihai says goodbye back, using Ana's name."
    note: "The same friendly closing pattern unit01's, unit05's, unit06's, and unit07's dialogues all ended on."

exercises:
  ro.a1.unit08.lesson01.exercise01.choose_unde_este:
    instruction: "Which phrase means 'Where is...?'"
    correct_option: "Unde este...?"
    distractors: ["Aproape", "Departe"]
    accepted_answers: ["Unde este...?"]

  ro.a1.unit08.lesson01.exercise02.choose_aproape:
    instruction: "Which word means 'close / near'?"
    correct_option: "Aproape"
    distractors: ["Departe", "Bancă"]
    accepted_answers: ["Aproape"]

  ro.a1.unit08.lesson01.exercise03.listen_magazinul_aproape:
    instruction: "Listen and select what you hear."
    correct_option: "Magazinul este aproape"
    distractors: ["Banca este departe", "Unde este gara"]
    accepted_answers: ["Magazinul este aproape"]

  ro.a1.unit08.lesson01.exercise04.match_locuri:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Gară": "train station"
      "Magazin": "store"
      "Bancă": "bank"
      "Aproape": "close / near"
      "Departe": "far"
      "Unde este...?": "Where is...?"

  ro.a1.unit08.lesson01.exercise05.order_banca_departe:
    instruction: "Build the sentence: The bank is far."
    correct_response: ["Banca", "este", "departe"]

  ro.a1.unit08.lesson01.exercise06.listen_order_unde_este_gara:
    instruction: "Listen, then put the words in order."
    correct_response: ["Unde", "este", "gara"]

  ro.a1.unit08.lesson01.exercise07.complete_magazinul:
    instruction: "Complete the sentence with the word for 'close'."
    accepted_answers: ["aproape", "Aproape"]
    feedback: "Magazinul este *aproape* -- reusing this unit's aproape/departe pair."

  ro.a1.unit08.lesson01.exercise08.speak_unde_este_banca:
    instruction: "Say aloud: Where is the bank?"
    accepted_answers:
      - "Unde este banca?"
      - "Unde este banca"

  ro.a1.unit08.lesson02.exercise01.choose_langa:
    instruction: "Which word means 'next to'?"
    correct_option: "Lângă"
    distractors: ["Vizavi de", "Între"]
    accepted_answers: ["Lângă"]

  ro.a1.unit08.lesson02.exercise02.choose_vizavi:
    instruction: "Which phrase means 'opposite / across from'?"
    correct_option: "Vizavi de"
    distractors: ["Lângă", "Între"]
    accepted_answers: ["Vizavi de"]

  ro.a1.unit08.lesson02.exercise03.listen_spitalul_vizavi_magazin:
    instruction: "Listen and select what you hear."
    correct_option: "Spitalul este vizavi de magazin"
    distractors: ["Magazinul este lângă gară", "Poșta este între magazin și spital"]
    accepted_answers: ["Spitalul este vizavi de magazin"]

  ro.a1.unit08.lesson02.exercise04.match_locuri2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Spital": "hospital"
      "Poștă": "post office"
      "Bibliotecă": "library"
      "Stație de autobuz": "bus stop"
      "Lângă": "next to"
      "Vizavi de": "opposite / across from"
      "Între": "between"

  ro.a1.unit08.lesson02.exercise05.order_magazinul_langa_gara:
    instruction: "Build the sentence: The store is next to the train station."
    correct_response: ["Magazinul", "este", "lângă", "gară"]

  ro.a1.unit08.lesson02.exercise06.listen_order_posta_intre:
    instruction: "Listen, then put the words in order."
    correct_response: ["Poșta", "este", "între", "magazin", "și", "spital"]

  ro.a1.unit08.lesson02.exercise07.complete_statia:
    instruction: "Complete the sentence."
    accepted_answers: ["lângă", "Lângă"]
    feedback: "Stația de autobuz este *lângă* bibliotecă -- lângă connects straight to the place name, with no *de* needed."

  ro.a1.unit08.lesson02.exercise08.speak_unde_este_posta:
    instruction: "Say aloud: Where is the post office?"
    accepted_answers:
      - "Unde este poșta?"
      - "Unde este poșta"

  ro.a1.unit08.lesson03.exercise01.choose_who_says_intre:
    instruction: "Who says this line?"
    correct_option: "Mihai"
    distractors: ["Ana"]
    accepted_answers: ["Mihai"]

  ro.a1.unit08.lesson03.exercise02.dialogue_comprehend_cartier:
    instruction: "Listen to the dialogue. Where is the library?"
    correct_option: "aproape de gară"
    distractors: ["lângă magazin", "între magazin și spital"]
    accepted_answers: ["aproape de gară"]

  ro.a1.unit08.lesson03.exercise03.reading_comprehend_posta:
    instruction: "According to the dialogue, where is the post office?"
    correct_option: "Între magazin și spital."
    distractors:
      - "Lângă gară."
      - "Vizavi de magazin."
    accepted_answers:
      - "Între magazin și spital."
      - "Între magazin și spital"

  ro.a1.unit08.lesson03.exercise04.match_unit_review:
    instruction: "Match each word to its English meaning."
    correct_response:
      "Gară": "train station"
      "Magazin": "store"
      "Bancă": "bank"
      "Spital": "hospital"
      "Poștă": "post office"
      "Bibliotecă": "library"
      "Stație de autobuz": "bus stop"
      "Aproape": "close / near"
      "Departe": "far"
      "Lângă": "next to"

  ro.a1.unit08.lesson03.exercise05.order_biblioteca_aproape_gara:
    instruction: "Build the sentence: The library is close to the train station."
    correct_response: ["Biblioteca", "este", "aproape", "de", "gară"]

  ro.a1.unit08.lesson03.exercise06.complete_spitalul:
    instruction: "Complete the sentence so it says the hospital is opposite the store."
    accepted_answers: ["vizavi", "Vizavi"]
    feedback: "Spitalul este *vizavi* de magazin -- the hospital is opposite the store."

  ro.a1.unit08.lesson03.exercise07.respond_as_mihai:
    instruction: "Take Mihai's role. Ana asks where the post office is -- answer that it's between the store and the hospital."
    accepted_answers:
      - "Poșta este între magazin și spital."
      - "Poșta este între magazin și spital"
      - "Este între magazin și spital."
      - "Este între magazin și spital"

  ro.a1.unit08.lesson03.exercise08.speak_closing_cartier:
    instruction: "Say aloud: Thank you! Goodbye!"
    accepted_answers:
      - "Mulțumesc! La revedere!"
      - "Mulțumesc, la revedere!"

  ro.a1.unit08.lesson01.exercise09.dictation_unde_este_gara:
    instruction: "Type what you hear."
    correct_option: "Unde este gara"
    accepted_answers: [{value: "Unde este gara", status: correct}]
    orthography_strict: true
