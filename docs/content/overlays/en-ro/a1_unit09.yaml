schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit09_directions.yaml for full
    detail. Glosses/notes here are freshly authored to explain the
    target-language forms to an English speaker; the underlying "Cum
    pot să ajung...?" question, "Mergeți înainte.", and the "la
    dreapta"/"la stânga" (modernized from the source's pre-reform "la
    stînga") turn words trace to US Peace Corps Moldova's public-domain
    "Basic Romanian Language Lessons" (Lesson 4). "Aici"/"acolo" trace
    to the same source's Lesson 13 adverb list. "Apoi" (then, used to
    join two direction steps) and every generalization of the source's
    bare fragments into full standalone sentences is freshly authored,
    disclosed honestly in the realization's own provenance note.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    realization file's own review pass. Checked clean: correct_response/
    accepted_answers shapes match the realization's word_bank/pairs, no
    same-speaker distractor collisions, no stray YAML booleans, no
    jargon leaks, English glosses/notes are accurate translations of
    the Romanian forms as authored. Ninth Romanian overlay, first
    draft, authored alongside the paired realization.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț). For
    free-typed A1 answers, accept otherwise-correct forms with the
    diacritics omitted or with the legacy cedilla variants ş/ţ
    substituted for ș/ț, matching units 01-08's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    This unit introduces the course's first imperative form, "Mergeți"
    (go) -- the dumneavoastră/formal-plural imperative, matching the
    course's established dumneavoastră-as-safe-default policy. No
    tu-register imperative is taught or accepted here. Ana and Mihai's
    direction-giving dialogue keeps their existing polite register with
    each other, matching unit06/unit07/unit08.

course:
  title: "Romanian A1"
  description: >-
    Asking for and following short directions in Romanian -- Cum pot să
    ajung...? (How can I get to...?), Mergeți înainte (go straight), la
    dreapta / la stânga (to the right / to the left), and aici / acolo
    (here / there) -- continuing Ana and Mihai as Ana asks Mihai how to
    get to the train station.

units:
  ro.a1.unit09.directions:
    title: "Directions"

lessons:
  ro.a1.unit09.lesson01.cum_ajung:
    title: "How can I get to...?"
  ro.a1.unit09.lesson02.dreapta_stanga:
    title: "To the right, to the left"
  ro.a1.unit09.lesson03.pe_strada:
    title: "On the street"

teaching:
  ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri:
    title: "Reminder: unde, este, gară, magazin, bancă, aproape"
    gloss: "unde (where) · este (is) · gară (train station) · magazin (store) · bancă (bank) · aproape (close / near)"
    note: >-
      All already established -- unde since unit07, este since unit03/
      unit04, gară/magazin/bancă/aproape since unit08 -- here they
      combine into this unit's direction-asking questions and examples.

  ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung:
    title: "How can I get to...?"
    gloss: "Cum pot să ajung...? (How can I get to...?)"
    note: "The everyday way to ask how to reach a place -- *pot* (I can) already appeared in unit07's *Unde pot să cumpăr...?*; *ajung* (I get to / arrive) is new."

  ro.a1.unit09.lesson01.teach.mergeti_vocab:
    title: "Go"
    gloss: "Mergeți (go -- formal command)"
    note: "*Mergeți* is the dumneavoastră-register command form -- the polite way to tell someone to go, matching how Ana and Mihai already speak to each other."
    example_gloss:
      - "Go straight."

  ro.a1.unit09.lesson01.teach.inainte_vocab:
    title: "Straight ahead"
    gloss: "înainte (straight ahead)"
    note: "Pairs with *Mergeți* to give the simplest possible direction."
    example_gloss:
      - "Go straight."

  ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase:
    title: "Go straight"
    gloss: "Mergeți înainte. (Go straight.)"
    note: "A short, complete direction -- the simplest possible answer to *Cum pot să ajung...?*"

  ro.a1.unit09.lesson01.teach.cum_ajung_gara:
    title: "How can I get to the train station?"
    gloss: "Cum pot să ajung la gară? (How can I get to the train station?)"
    note: "Puts *Cum pot să ajung...?* and *gara* together in one full question -- *la* connects the question to the destination."

  ro.a1.unit09.lesson01.teach.cum_ajung_banca:
    title: "How can I get to the bank?"
    gloss: "Cum pot să ajung la bancă? (How can I get to the bank?)"
    note: "Same pattern, now with the bank -- a natural question to ask, since unit08 already established the bank is far away."

  ro.a1.unit09.lesson02.teach.dreapta_stanga_vocab:
    title: "To the right, to the left"
    gloss: "la dreapta (to the right) · la stânga (to the left)"
    note: "The two basic turns -- both follow *la* directly, the same way *aproape*/*departe* stood alone in unit08."
    example_gloss:
      - "Go to the right."
      - "Go to the left."

  ro.a1.unit09.lesson02.teach.mergeti_dreapta_phrase:
    title: "Go to the right"
    gloss: "Mergeți la dreapta. (Go to the right.)"
    note: "Same *Mergeți* command as *Mergeți înainte.*, now with a turn instead of straight ahead."

  ro.a1.unit09.lesson02.teach.mergeti_stanga_phrase:
    title: "Go to the left"
    gloss: "Mergeți la stânga. (Go to the left.)"
    note: "The opposite turn -- same simple pattern."

  ro.a1.unit09.lesson02.teach.aici_acolo_vocab:
    title: "Here, there"
    gloss: "aici (here) · acolo (there)"
    note: "A simple way to point out where something is once you've arrived or can see it, distinct from unit08's aproape/departe (which describe distance, not position)."
    example_gloss:
      - "The store is here."
      - "The train station is over there."

  ro.a1.unit09.lesson02.teach.magazinul_aici_phrase:
    title: "The store is here"
    gloss: "Magazinul este aici. (The store is here.)"
    note: "A short, complete statement -- *aici* points to something right where you are."

  ro.a1.unit09.lesson02.teach.gara_acolo_phrase:
    title: "The train station is over there"
    gloss: "Gara este acolo. (The train station is over there.)"
    note: "*Acolo* points to something visible but not right where you are -- the natural way to end a set of directions."

  ro.a1.unit09.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: "Reminder: bună, mulțumesc, la revedere, da, Ana, Mihai"
    gloss: "bună (hi) · mulțumesc (thank you) · la revedere (goodbye) · da (yes) · Ana, Mihai (names)"
    note: >-
      All already established in earlier units -- here Ana asks Mihai
      for directions.

  ro.a1.unit09.lesson03.teach.apoi:
    title: "Then"
    gloss: "apoi (then / next)"
    note: "Joins two direction steps into one instruction -- the natural way to give more than one step at once."
    example_gloss:
      - "Go straight, then to the right."

  ro.a1.unit09.lesson03.teach.line01:
    title: "Greet and ask how to get to the train station"
    gloss: "Ana greets Mihai and asks how to get to the train station."
    note: "Combines this unit's own *Cum pot să ajung* with unit01's greeting."

  ro.a1.unit09.lesson03.teach.line02:
    title: "Give two direction steps"
    gloss: "Mihai says to go straight, then to the right."
    note: "Reuses this unit's own *Mergeți înainte* and *la dreapta*, joined with *apoi*."

  ro.a1.unit09.lesson03.teach.line03:
    title: "Ask if it's close"
    gloss: "Ana asks if the train station is close."
    note: "A short follow-up question reusing unit08's own *este*/*aproape*."

  ro.a1.unit09.lesson03.teach.line04:
    title: "Confirm and point it out"
    gloss: "Mihai confirms it's close and points out the train station is over there."
    note: "Combines *aproape* and *acolo* -- distance and position -- in one line."

  ro.a1.unit09.lesson03.teach.line05:
    title: "Thank and close"
    gloss: "Ana thanks Mihai and says goodbye."
    note: "The same closing thanks unit01's/unit08's dialogues used."

  ro.a1.unit09.lesson03.teach.line06:
    title: "Close the encounter"
    gloss: "Mihai says goodbye back, using Ana's name."
    note: "The same friendly closing pattern unit01's, unit05's, unit06's, unit07's, and unit08's dialogues all ended on."

exercises:
  ro.a1.unit09.lesson01.exercise01.choose_cum_pot_sa_ajung:
    instruction: "Which phrase means 'How can I get to...?'"
    correct_option: "Cum pot să ajung...?"
    distractors: ["Unde este...?", "Mergeți înainte."]
    accepted_answers: ["Cum pot să ajung...?"]

  ro.a1.unit09.lesson01.exercise02.choose_inainte:
    instruction: "Which word means 'straight ahead'?"
    correct_option: "Înainte"
    distractors: ["Aproape", "Departe"]
    accepted_answers: ["Înainte"]

  ro.a1.unit09.lesson01.exercise03.listen_mergeti_inainte:
    instruction: "Listen and select what you hear."
    correct_option: "Mergeți înainte"
    distractors: ["Cum pot să ajung la bancă?", "Cum pot să ajung la magazin?"]
    accepted_answers: ["Mergeți înainte"]

  ro.a1.unit09.lesson01.exercise04.match_directions1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Cum pot să ajung...?": "How can I get to...?"
      "Mergeți": "Go"
      "Înainte": "Straight ahead"
      "Gară": "train station"
      "Magazin": "store"
      "Bancă": "bank"

  ro.a1.unit09.lesson01.exercise05.order_cum_ajung_banca:
    instruction: "Build the sentence: How can I get to the bank?"
    correct_response: ["Cum", "pot", "să", "ajung", "la", "bancă"]

  ro.a1.unit09.lesson01.exercise06.listen_order_cum_ajung_gara:
    instruction: "Listen, then put the words in order."
    correct_response: ["Cum", "pot", "să", "ajung", "la", "gară"]

  ro.a1.unit09.lesson01.exercise07.complete_mergeti:
    instruction: "Complete the sentence."
    accepted_answers: ["înainte", "Înainte"]
    feedback: "Mergeți *înainte* -- reusing this unit's own vocabulary for 'straight ahead.'"

  ro.a1.unit09.lesson01.exercise08.speak_cum_ajung_magazin:
    instruction: "Say aloud: How can I get to the store?"
    accepted_answers:
      - "Cum pot să ajung la magazin?"
      - "Cum pot să ajung la magazin"

  ro.a1.unit09.lesson02.exercise01.choose_dreapta:
    instruction: "Which phrase means 'to the right'?"
    correct_option: "La dreapta"
    distractors: ["La stânga", "Înainte"]
    accepted_answers: ["La dreapta"]

  ro.a1.unit09.lesson02.exercise02.choose_aici:
    instruction: "Which word means 'here'?"
    correct_option: "Aici"
    distractors: ["Acolo", "Departe"]
    accepted_answers: ["Aici"]

  ro.a1.unit09.lesson02.exercise03.listen_mergeti_dreapta:
    instruction: "Listen and select what you hear."
    correct_option: "Mergeți la dreapta"
    distractors: ["Mergeți la stânga.", "Magazinul este aici."]
    accepted_answers: ["Mergeți la dreapta"]

  ro.a1.unit09.lesson02.exercise04.match_directions2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Cum pot să ajung...?": "How can I get to...?"
      "Mergeți": "Go"
      "Înainte": "Straight ahead"
      "La dreapta": "To the right"
      "La stânga": "To the left"
      "Aici": "Here"
      "Acolo": "There"
      "Gară": "train station"
      "Magazin": "store"
      "Bancă": "bank"

  ro.a1.unit09.lesson02.exercise05.order_gara_acolo:
    instruction: "Build the sentence: The train station is over there."
    correct_response: ["Gara", "este", "acolo"]

  ro.a1.unit09.lesson02.exercise06.listen_order_magazinul_aici:
    instruction: "Listen, then put the words in order."
    correct_response: ["Magazinul", "este", "aici"]

  ro.a1.unit09.lesson02.exercise07.complete_magazinul_aici:
    instruction: "Complete the sentence."
    accepted_answers: ["aici", "Aici"]
    feedback: "Magazinul este *aici* -- reusing this lesson's own here/there pair."

  ro.a1.unit09.lesson02.exercise08.speak_mergeti_stanga:
    instruction: "Say aloud: Go left."
    accepted_answers:
      - "Mergeți la stânga."
      - "Mergeți la stânga"

  ro.a1.unit09.lesson03.exercise01.choose_who_says_mergeti:
    instruction: "Who says this line?"
    correct_option: "Mihai"
    distractors: ["Ana"]
    accepted_answers: ["Mihai"]

  ro.a1.unit09.lesson03.exercise02.dialogue_comprehend_pe_strada:
    instruction: "Listen to the dialogue. What should you do first to reach the train station?"
    correct_option: "Mergeți înainte."
    distractors: ["Mergeți la stânga.", "Este departe."]
    accepted_answers: ["Mergeți înainte."]

  ro.a1.unit09.lesson03.exercise03.reading_comprehend_indrumari:
    instruction: "Follow these written directions. Which way do you turn after going straight?"
    correct_option: "La dreapta."
    distractors:
      - "La stânga."
      - "Înainte."
    accepted_answers:
      - "La dreapta."
      - "La dreapta"

  ro.a1.unit09.lesson03.exercise04.match_unit_review:
    instruction: "Match each word to its English meaning."
    correct_response:
      "Cum pot să ajung...?": "How can I get to...?"
      "Mergeți": "Go"
      "Înainte": "Straight ahead"
      "La dreapta": "To the right"
      "La stânga": "To the left"
      "Aici": "Here"
      "Acolo": "There"
      "Apoi": "Then"

  ro.a1.unit09.lesson03.exercise05.order_magazinul_aici:
    instruction: "Build the sentence: The store is here."
    correct_response: ["Magazinul", "este", "aici"]

  ro.a1.unit09.lesson03.exercise06.complete_dreapta_review:
    instruction: "Complete the sentence."
    accepted_answers: ["dreapta", "Dreapta"]
    feedback: "Mergeți înainte, apoi la *dreapta* -- recalling exactly what Mihai told Ana."

  ro.a1.unit09.lesson03.exercise07.respond_as_mihai:
    instruction: "Take Mihai's role. Ana asks how to get to the train station -- tell her to go straight, then to the right."
    accepted_answers:
      - "Mergeți înainte, apoi la dreapta."
      - "Mergeți înainte apoi la dreapta."
      - "Mergeți înainte, apoi la dreapta"
      - "Mergeți înainte apoi la dreapta"

  ro.a1.unit09.lesson03.exercise08.speak_closing_pe_strada:
    instruction: "Say aloud: Thank you! Goodbye!"
    accepted_answers:
      - "Mulțumesc! La revedere!"
      - "Mulțumesc, la revedere!"

  ro.a1.unit09.lesson01.exercise09.dictation_mergeti_inainte:
    instruction: "Type what you hear."
    correct_option: "Mergeți înainte"
    accepted_answers: [{value: "Mergeți înainte", status: correct}]
    orthography_strict: true
