exercises:
  ro.c1.unit06.idiome.lesson01.exercise01.recognize_read:
    instruction: "Which Romanian idiom means reading implied meaning?"
    correct_option: "citim printre rânduri"
    distractors: ["luăm pulsul", "au prins rădăcini", "cu două tăișuri"]
    accepted_answers: [{value: "citim printre rânduri", status: correct}]
    feedback: "*Citim printre rânduri* means we read between the lines."
  ro.c1.unit06.idiome.lesson01.exercise02.listen_read:
    instruction: "Listen and select the best meaning."
    correct_option: "We need to read the report between the lines."
    distractors: ["We need to rewrite every line of the report.", "We need to ignore the report.", "We need to measure the team's mood."]
    accepted_answers: [{value: "We need to read the report between the lines.", status: correct}]
    feedback: "The meaning is figurative."
  ro.c1.unit06.idiome.lesson01.exercise03.match_read:
    instruction: "Match each Romanian phrase to its English meaning."
    accepted_answers:
      - value: {"Trebuie": "we must", "să citim": "to read", "printre rânduri": "between the lines", "raportul": "the report", "sens": "meaning", "literal": "literal"}
        status: correct
    feedback: "These phrases introduce figurative reading."
  ro.c1.unit06.idiome.lesson01.exercise04.dictation_read:
    instruction: "Type exactly what you hear."
    correct_response: "Trebuie să citim printre rânduri raportul."
    orthography_strict: true
    feedback: "Trebuie să citim printre rânduri raportul."
  ro.c1.unit06.idiome.lesson02.exercise01.recognize_edge:
    instruction: "Which idiom means having both benefits and risks?"
    correct_option: "cu două tăișuri"
    distractors: ["printre rânduri", "au prins rădăcini", "luăm pulsul"]
    accepted_answers: [{value: "cu două tăișuri", status: correct}]
    feedback: "*Cu două tăișuri* means double-edged."
  ro.c1.unit06.idiome.lesson02.exercise02.order_edge:
    instruction: "Put the Romanian words in order."
    accepted_answers: [{value: "propuneri cu două tăișuri", status: correct}]
    feedback: "propuneri cu două tăișuri."
  ro.c1.unit06.idiome.lesson02.exercise03.translate_edge:
    instruction: "Translate into Romanian: Some proposals are double-edged."
    accepted_answers:
      - {value: "Unele propuneri sunt cu două tăișuri.", status: correct}
      - {value: "Unele propuneri sunt cu două tăișuri", status: correct}
    feedback: "Unele propuneri sunt cu două tăișuri."
  ro.c1.unit06.idiome.lesson03.exercise01.recognize_pulse:
    instruction: "Which phrase means gauging the team's mood?"
    correct_option: "luăm pulsul echipei"
    distractors: ["aruncăm copilul", "apa din copaie", "citim printre rânduri"]
    accepted_answers: [{value: "luăm pulsul echipei", status: correct}]
    feedback: "*Luăm pulsul echipei* means we gauge the team's mood."
  ro.c1.unit06.idiome.lesson03.exercise02.match_metaphors:
    instruction: "Match each Romanian metaphor phrase to its English meaning."
    accepted_answers:
      - value: {"să aruncăm copilul": "to throw out the baby", "apa din copaie": "the bathwater", "luăm pulsul": "we take the pulse", "echipei": "of the team", "au prins": "have taken", "rădăcini": "roots"}
