    correct_response: ["Robinetul", "din", "bucătărie", "curge", "de", "ieri"]

  ro.a2.unit25.lesson01.exercise07.complete_robinetul_curge_de_ieri:
    instruction: "Complete the sentence, since yesterday: Robinetul curge de ___."
