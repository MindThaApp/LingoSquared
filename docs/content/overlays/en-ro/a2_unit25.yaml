schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a2_unit25_probleme_locuinta.yaml for
    full detail. The Peace Corps Moldova PDF has zero dedicated
    maintenance-report material beyond unit18's own basic house-
    orientation vocabulary; every word and phrase specific to this
    unit's scenario is authored fresh from general standard Romanian
    knowledge. Glosses/notes here are freshly authored to explain the
    target-language forms, including this unit's "de ieri"/"cât mai
    curând posibil" phrasing, to an English speaker.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Fifth Romanian A2 overlay, authored alongside the paired
    realization. correct_response/accepted_answers shapes checked to
    match the realization's word_bank/pairs (exact token-multiset
    agreement for both word_order exercises and the two listen_order
    exercises) per the standing validate_order_word_bank_answers
    compiler check. Multi-clause accepted_answers checked against
    AUTHORING_GUIDE #12 for period/comma/conjunction-joined variants.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț). For
    free-typed A2 answers, accept otherwise-correct forms with the
    diacritics omitted or with the legacy cedilla variants ş/ţ
    substituted for ș/ț, matching units 01-24's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    Fully formal dumneavoastră register throughout, continuing units
    21/23/24's identical convention for a first meeting with an
    official/professional.

course:
  title: "Romanian A2"
  description: >-
    Reporting a household problem in Romanian -- Robinetul curge (the
    faucet is leaking), De ieri (since yesterday), Meșter (repairman),
    and Cât mai curând posibil (as soon as possible) -- as Mihai
    reports a leak to Administratorul Ionescu.

units:
  ro.a2.unit25.probleme_locuinta:
    title: "Housing problems"

lessons:
  ro.a2.unit25.lesson01.robinetul_curge:
    title: "The faucet is leaking"
  ro.a2.unit25.lesson02.cand_poate_veni_un_mester:
    title: "When can a repairman come?"
  ro.a2.unit25.lesson03.confirmarea_reparatiei:
    title: "The repair confirmation"
  ro.a2.unit25.lesson04.la_administrator:
    title: "At the administrator's office"

teaching:
  ro.a2.unit25.lesson01.teach.reminder_buna_multumesc_la_revedere_mihai_apartament:
    title: "Reminder: Bună ziua, Mulțumesc, La revedere, Mihai, Apartament"
    gloss: "Bună ziua (good day, formal) · Mulțumesc (thank you) · La revedere (goodbye) · Mihai · Apartament (apartment) · Bucătărie (kitchen)"
    note: "From unit01/unit18's own established vocabulary -- Mihai's apartment and its kitchen, the setting for this unit's problem."

  ro.a2.unit25.lesson01.teach.robinet_vocab:
    title: "Faucet"
    gloss: "Robinet (faucet) · Din (from/in, indicating location)"
    note: "A neuter noun, shown here in its definite form *robinetul* ('the faucet')."
    example_gloss:
      - "The faucet in the kitchen."

  ro.a2.unit25.lesson01.teach.curge_vocab:
    title: "Leaks / flows"
    gloss: "Curge (leaks / flows) -- from *a curge*, 'to flow/leak'"
    note: "Used here for a dripping or leaking faucet -- a genuinely new verb for this course."
    example_gloss:
      - "The faucet is leaking."

  ro.a2.unit25.lesson01.teach.de_ieri_vocab:
    title: "Since yesterday"
    gloss: "De ieri (since yesterday)"
    note: "*De* + a time reference states duration, the same pattern as unit24's own *de trei zile* -- here anchored to a specific day rather than a count."
    example_gloss:
      - "The faucet has been leaking since yesterday."

  ro.a2.unit25.lesson01.teach.robinetul_curge_de_ieri_phrase:
    title: "The faucet has been leaking since yesterday."
    gloss: "Robinetul curge de ieri."
    note: "Combines this lesson's three new words into the core problem-report sentence this unit builds toward."

  ro.a2.unit25.lesson02.teach.mester_vocab:
    title: "Repairman"
    gloss: "Un meșter (a repairman)"
    note: "A masculine noun for a skilled tradesperson who does home repairs."
    example_gloss:
      - "When can a repairman come?"

  ro.a2.unit25.lesson02.teach.poate_veni_grammar:
    title: "Poate veni (can come)"
    gloss: "Când poate veni? (When can he come?) -- *poate* (can, from *a putea*) + *veni* (come, infinitive-style)"
    note: "*Poate* + a bare verb form is the standard 'can do X' construction in Romanian."

  ro.a2.unit25.lesson02.teach.cat_mai_curand_vocab:
    title: "As soon as possible"
    gloss: "Aș dori o reparație cât mai curând posibil. (I would like a repair as soon as possible.)"
    note: "*Cât mai curând posibil* is a fixed formal phrase, literally 'as soon as possible' -- reuses unit21's own *aș dori* conditional request pattern."
    example_gloss:
      - "I would like a repair as soon as possible."

  ro.a2.unit25.lesson02.teach.cand_poate_veni_phrase:
    title: "When can a repairman come?"
    gloss: "Când poate veni un meșter?"
    note: "The full question, combining this lesson's own vocabulary."

  ro.a2.unit25.lesson02.teach.va_veni_maine_phrase:
    title: "He will come tomorrow, between nine and twelve o'clock."
    gloss: "Va veni mâine, între orele nouă și doisprezece."
    note: "*Va veni* is the formal future tense of *a veni* (to come) -- the same future-tense pattern as unit23's own *va sosi*."

  ro.a2.unit25.lesson03.teach.confirmata_vocab:
    title: "Confirmed"
    gloss: "Reparația dumneavoastră este confirmată (your repair is confirmed) · Pentru (for)"
    note: "*Confirmată* is the feminine past-participle-as-adjective form, agreeing with feminine *reparația* -- the same pattern unit21/24 already used with *programarea*."
    example_gloss:
      - "Your repair is confirmed."

  ro.a2.unit25.lesson03.teach.va_suna_vocab:
    title: "Will call"
    gloss: "Meșterul va suna înainte de a veni. (The repairman will call before coming.)"
    note: "*Înainte de a* + verb means 'before doing X' -- a new time-sequencing construction for this course."
    example_gloss:
      - "The repairman will call before coming."

  ro.a2.unit25.lesson03.teach.confirmare_reading:
    title: "A repair confirmation"
    gloss: "Your repair is confirmed for tomorrow, between nine and twelve o'clock. The repairman will call before coming."
    note: "A short official confirmation message combining this unit's time and instruction vocabulary -- the reading half of this unit's spine outcome."
    glosses:
      Reparația: "repair"
      confirmată: "confirmed"
      mâine: "tomorrow"
      între: "between"
      orele: "hours / o'clock"
      nouă: "nine"
      doisprezece: "twelve"
      Meșterul: "repairman"
      suna: "call (from a suna)"
      înainte: "before"
      veni: "come (from a veni)"

  ro.a2.unit25.lesson04.teach.reminder_imi_pare_rau_observat_ionescu:
    title: "Reminder: Îmi pare rău, Ați observat, Administratorul Ionescu"
    gloss: "Îmi pare rău să aud asta (I'm sorry to hear that) · Când ați observat problema? (When did you notice the problem?) · Administratorul Ionescu (Administrator Ionescu)"
    note: "New counter-vocabulary this unit -- *ați observat* is the formal past tense of *a observa* (to notice/observe), a new verb tense for this course."

  ro.a2.unit25.lesson04.teach.line01:
    title: "Report the leak"
    gloss: "Mihai greets the administrator and reports the kitchen faucet has been leaking since yesterday."
    note: "Reuses this unit's own lesson01 phrase exactly, with *din bucătărie* (in the kitchen) added for specificity."

  ro.a2.unit25.lesson04.teach.line02:
    title: "Express sympathy and ask when"
    gloss: "The administrator greets Mihai, expresses sympathy, and asks when he noticed the problem."
    note: "New line, transparent from the new reminder card."

  ro.a2.unit25.lesson04.teach.line03:
    title: "Answer and request prompt repair"
    gloss: "Mihai says it was yesterday evening, and asks for a repair as soon as possible."
    note: "Reuses this unit's own lesson02 phrase exactly."

  ro.a2.unit25.lesson04.teach.line04:
    title: "Confirm the repair time"
    gloss: "The administrator understands, and says a repairman will come tomorrow, between nine and twelve o'clock."
    note: "Reuses this unit's own lesson02 phrase exactly."

  ro.a2.unit25.lesson04.teach.line05:
    title: "Ask if he needs to be home"
    gloss: "Mihai thanks him and asks if he needs to be home."
    note: "*Trebuie să fiu* (I must be) reuses the *trebuie să* + subjunctive pattern from unit21/24."

  ro.a2.unit25.lesson04.teach.line06:
    title: "Confirm and explain the call"
    gloss: "The administrator confirms Mihai should be home, and says the repairman will call before coming."
    note: "Reuses this unit's own lesson03 phrase exactly."

  ro.a2.unit25.lesson04.teach.line07:
    title: "Thank the administrator"
    gloss: "Mihai thanks him warmly for his help."
    note: "Reuses unit23's own *mulțumesc mult pentru ajutor* closing pattern."

  ro.a2.unit25.lesson04.teach.line08:
    title: "Close the conversation"
    gloss: "The administrator says you're welcome and wishes him a good day."
    note: "Echoes unit22/23's own *cu plăcere*/*o zi bună* closing pattern."

exercises:
  ro.a2.unit25.lesson01.exercise01.choose_robinet:
    instruction: "Which word means 'faucet'?"
    correct_option: "Robinet"
    distractors: ["Meșter", "Apartament"]
    accepted_answers: ["Robinet"]

  ro.a2.unit25.lesson01.exercise02.choose_curge:
    instruction: "Which word means 'leaks / flows'?"
    correct_option: "Curge"
    distractors: ["Suna", "Repara"]
    accepted_answers: ["Curge"]

  ro.a2.unit25.lesson01.exercise03.listen_robinetul_curge:
    instruction: "Listen and select what you hear."
    correct_option: "Robinetul curge de ieri"
    distractors: ["Când poate veni un meșter?", "Va veni mâine."]
    accepted_answers: ["Robinetul curge de ieri"]

  ro.a2.unit25.lesson01.exercise04.match_locuinta1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Robinetul": "the faucet"
      "Curge": "leaks / flows"
      "De ieri": "since yesterday"
      "Apartament": "apartment"
      "Bucătărie": "kitchen"
      "Robinetul curge de ieri.": "The faucet has been leaking since yesterday."
      "Bună ziua.": "Good day."
      "Mulțumesc.": "Thank you."

  ro.a2.unit25.lesson01.exercise05.order_robinetul_curge_de_ieri:
    instruction: "Build the sentence: The faucet has been leaking since yesterday."
    correct_response: ["Robinetul", "curge", "de", "ieri"]

  ro.a2.unit25.lesson01.exercise06.listen_order_robinetul_din_bucatarie:
    instruction: "Listen, then put the words in order."
    correct_response: ["Robinetul", "din", "bucătărie", "curge", "de", "ieri"]

  ro.a2.unit25.lesson01.exercise07.complete_robinetul_curge_de_ieri:
    instruction: "Complete the sentence, since yesterday: Robinetul curge de ___."
    accepted_answers: ["ieri", "Ieri"]
    feedback: "Curge de *ieri* -- 'since yesterday,' stating when the leak started."

  ro.a2.unit25.lesson01.exercise08.write_problem_report:
    instruction: "Write a short sentence reporting a problem with your faucet, using 'de ieri.'"
    accepted_answers:
      - "Robinetul curge de ieri."
      - "Robinetul din bucătărie curge de ieri."

  ro.a2.unit25.lesson02.exercise01.choose_mester:
    instruction: "Which word means 'repairman'?"
    correct_option: "Meșter"
    distractors: ["Administrator", "Doctor"]
    accepted_answers: ["Meșter"]

  ro.a2.unit25.lesson02.exercise02.choose_cat_mai_curand_posibil:
    instruction: "Which phrase means 'as soon as possible'?"
    correct_option: "Cât mai curând posibil"
    distractors: ["De ieri", "Mai devreme"]
    accepted_answers: ["Cât mai curând posibil"]

  ro.a2.unit25.lesson02.exercise03.listen_cand_poate_veni:
    instruction: "Listen and select what you hear."
    correct_option: "Când poate veni un meșter"
    distractors: ["Robinetul curge de ieri.", "Va veni mâine, între orele nouă și doisprezece."]
    accepted_answers: ["Când poate veni un meșter"]

  ro.a2.unit25.lesson02.exercise04.match_locuinta2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Meșter": "repairman"
      "Cât mai curând posibil": "as soon as possible"
      "Când poate veni?": "When can he come?"
      "Mâine": "tomorrow"
      "Între orele nouă și doisprezece": "between nine and twelve o'clock"
      "Robinetul curge.": "The faucet leaks."

  ro.a2.unit25.lesson02.exercise05.order_cand_poate_veni_un_mester:
    instruction: "Build the question: When can a repairman come?"
    correct_response: ["Când", "poate", "veni", "un", "meșter"]

  ro.a2.unit25.lesson02.exercise06.listen_order_va_veni_maine:
    instruction: "Listen, then put the words in order."
    correct_response: ["Va", "veni", "mâine"]

  ro.a2.unit25.lesson02.exercise07.complete_cat_mai_curand_posibil:
    instruction: "Complete the sentence, as soon as possible: Aș dori o reparație cât mai curând ___."
    accepted_answers: ["posibil", "Posibil"]
    feedback: "Cât mai curând *posibil* -- 'as soon as possible.'"

  ro.a2.unit25.lesson02.exercise08.translate_repair_timing:
    instruction: "Translate into Romanian."
    accepted_answers:
      - "Va veni mâine, între orele nouă și doisprezece."
      - "Va veni mâine între orele nouă și doisprezece."

  ro.a2.unit25.lesson03.exercise01.read_repair_time:
    instruction: "Read the confirmation. When is the repair confirmed?"
    correct_option: "Mâine, între orele nouă și doisprezece."
    distractors:
      - "Astăzi, la ora cinci."
    accepted_answers:
      - "Mâine, între orele nouă și doisprezece."

  ro.a2.unit25.lesson03.exercise02.read_call_instruction:
    instruction: "Read the confirmation. What will the repairman do before arriving?"
    correct_option: "Va suna."
    distractors:
      - "Va trimite un mesaj."
    accepted_answers:
      - "Va suna."

  ro.a2.unit25.lesson03.exercise03.listen_confirmare:
    instruction: "Listen and select what you hear."
    correct_option: "Reparația dumneavoastră este confirmată pentru mâine"
    distractors: ["Robinetul curge de ieri.", "Când poate veni un meșter?"]
    accepted_answers: ["Reparația dumneavoastră este confirmată pentru mâine"]

  ro.a2.unit25.lesson03.exercise04.match_confirmare:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Confirmată": "confirmed"
      "Mâine, între orele nouă și doisprezece": "tomorrow, between nine and twelve o'clock"
      "Va suna înainte de a veni": "will call before coming"
      "Robinetul": "the faucet"
      "Meșter": "repairman"

  ro.a2.unit25.lesson03.exercise05.complete_va_suna:
    instruction: "Complete the sentence, will call: Meșterul va ___ înainte de a veni."
    accepted_answers: ["suna", "Suna"]
    feedback: "Va *suna* -- the repairman will call before he comes."

  ro.a2.unit25.lesson03.exercise06.write_repair_confirmation_reply:
    instruction: "Write a short message reporting a household problem and requesting a repair."
    accepted_answers:
      - "Robinetul curge de ieri. Aș dori o reparație."
      - "Aș dori o reparație, pentru că robinetul curge de ieri."

  ro.a2.unit25.lesson04.exercise01.choose_who_asks_when_observed:
    instruction: "Who says this line?"
    correct_option: "Administratorul Ionescu"
    distractors: ["Mihai"]
    accepted_answers: ["Administratorul Ionescu"]

  ro.a2.unit25.lesson04.exercise02.dialogue_comprehend_problem:
    instruction: "Listen to the dialogue. What problem does Mihai report, and since when?"
    correct_option: "Robinetul din bucătărie curge, de ieri."
    distractors: ["Încălzirea nu funcționează, de o săptămână."]
    accepted_answers: ["Robinetul din bucătărie curge, de ieri."]

  ro.a2.unit25.lesson04.exercise03.dialogue_comprehend_repair_time:
    instruction: "Listen to the dialogue. When will the repairman come?"
    correct_option: "Mâine, între orele nouă și doisprezece."
    distractors: ["Astăzi, la ora cinci."]
    accepted_answers: ["Mâine, între orele nouă și doisprezece."]

  ro.a2.unit25.lesson04.exercise04.dialogue_comprehend_instruction:
    instruction: "Listen to the dialogue. What does Mihai need to do before the repairman arrives?"
    correct_option: "Trebuie să fie acasă."
    distractors: ["Trebuie să sune administratorul."]
    accepted_answers: ["Trebuie să fie acasă."]

  ro.a2.unit25.lesson04.exercise05.order_cand_ati_observat_problema:
    instruction: "Build the question: When did you notice the problem?"
    correct_response: ["Când", "ați", "observat", "problema"]

  ro.a2.unit25.lesson04.exercise06.respond_as_mihai:
    instruction: "Take Mihai's role. The administrator asks when you noticed the problem -- say it was yesterday evening, and ask for a repair as soon as possible."
    accepted_answers:
      - "Ieri seara. Aș dori o reparație cât mai curând posibil."
      - "Ieri seara, aș dori o reparație cât mai curând posibil."

  ro.a2.unit25.lesson04.exercise07.write_visit_summary:
    instruction: "Write a short sentence summarizing Mihai's conversation with the administrator, using at least one word from this unit."
    accepted_answers:
      - "Mihai a raportat că robinetul din bucătărie curge de ieri."
      - "Un meșter va veni mâine să repare robinetul."
      - "Administratorul Ionescu a confirmat reparația pentru mâine."

  ro.a2.unit25.lesson01.exercise09.dictation_robinetul_curge_de_ieri:
    instruction: "Type what you hear."
    correct_option: "Robinetul curge de ieri"
    accepted_answers: [{value: "Robinetul curge de ieri", status: correct}]
    orthography_strict: true
