answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Romanian A1
  description: 'Beginner Romanian for describing free-time activities: hobby vocabulary, frequency expressions, asking and answering what someone does in their free time, and comparing two people''s hobbies.'
units:
  ro.a1.unit30.timp_liber:
    title: Hobbies and free time
lessons:
  ro.a1.unit30.lesson01.cititul_sportul_si_gatitul:
    title: Reading, exercising, and cooking
  ro.a1.unit30.lesson02.muzica_desen_si_jocuri:
    title: Music, drawing, and gaming
  ro.a1.unit30.lesson03.ce_faci_in_timpul:
    title: What do you do in your free time?
  ro.a1.unit30.lesson04.ana_si_mihai_vorbesc:
    title: Ana and Mihai talk about hobbies
  ro.a1.unit30.lesson05.mihai_si_ana_isi:
    title: Mihai and Ana compare their hobbies
  ro.a1.unit30.lesson06.planuim_impreuna_un_weekend:
    title: Planning a weekend together
teaching:
  ro.a1.unit30.lesson01.teach.a_citi_a:
    title: Reading, exercising, cooking
    gloss: to read, to exercise / play sports, to cook
    note: 'Three common hobby verbs: *a citi* (to read), *a face sport* (to exercise or play sports) and *a găti* (to cook). Romanian dictionary forms start with *a*.'
    example_gloss:
    - I like reading a book.
    - I exercise on Saturdays.
    - I like cooking for friends.
  ro.a1.unit30.lesson01.teach.timpul_liber:
    title: Free time
    gloss: free time
    note: '*Timpul liber* (free time) is built on the masculine noun *timp* with the article attached. It is the key phrase for talking about hobbies.'
    example_gloss: In my free time, I like to read.
  ro.a1.unit30.lesson01.teach.in_timpul_liber:
    title: Saying what you do in your free time
    gloss: In my free time, I like to read.
    note: '*Citesc* is the *eu* form of *a citi* (to read); after *îmi place să* the verb keeps the same form.'
  ro.a1.unit30.lesson02.teach.a_asculta_muzica:
    title: Music, drawing, gaming
    gloss: to listen to music, to draw, to game
    note: 'Three more hobby phrases: *a asculta muzică* (to listen to music), *a desena* (to draw) and *a juca jocuri video* (to play video games).'
    example_gloss:
    - I like listening to music.
    - I often draw.
    - I like gaming with friends.
  ro.a1.unit30.lesson02.teach.imi_place_sa:
    title: Saying you like listening to music
    gloss: I like listening to music.
    note: '*Îmi place să ascult muzică*: *îmi place* ("it pleases me") + *să* + a verb is the usual way to say you like doing something.'
  ro.a1.unit30.lesson02.teach.imi_place_sa_2:
    title: Saying you like gaming with friends
    gloss: I like gaming with friends.
    note: '*Cu prietenii* means "with the friends": *cu* ("with") is the preposition, and *prietenii* is the definite plural.'
  ro.a1.unit30.lesson03.teach.mereu_des_uneori:
    title: Always, often, sometimes, never
    gloss: always, often, sometimes, never
    note: 'The four core frequency adverbs: *mereu*, *des*, *uneori* and *niciodată*. They usually follow the verb: *Citesc des*.'
    example_gloss:
    - I always exercise on Saturdays.
    - I often read a book.
    - I sometimes draw.
    - I never game.
  ro.a1.unit30.lesson03.teach.in_fiecare_saptamana:
    title: Every week, every weekend
    gloss: every week, every weekend
    note: '*În fiecare săptămână* and *în fiecare weekend* both mean "every"; *fiecare* never changes, see the next card.'
    example_gloss:
    - I cook for friends every week.
    - I exercise every weekend.
  ro.a1.unit30.lesson03.teach.cuvantul_fiecare_nu:
    title: Fiecare never changes
    gloss: 'The word fiecare does not change: în fiecare săptămână (every week), în fiecare weekend (every weekend).'
    note: '*Fiecare* stays the same before *săptămână* and *weekend*, whatever the noun, so there is nothing to choose.'
  ro.a1.unit30.lesson03.teach.ce_faci_in:
    title: Asking about free time
    gloss: What do you do in your free time?
    note: This is the core question of this unit -- reuse it to ask anyone about their hobbies.
  ro.a1.unit30.lesson04.teach.ana_ne_plimbam:
    title: Ana brings up hobbies
    gloss: 'Ana: We often walk together. But what else do you do in your free time, Mihai?'
    note: '*Ne plimbăm* ("we take a walk") is the *noi* form of the reflexive verb *a se plimba*; it refers back to the walks both friends enjoy.'
  ro.a1.unit30.lesson04.teach.mihai_imi_place:
    title: Mihai's hobbies
    gloss: 'Mihai: I like cooking, at home too. And I exercise often.'
    note: '*Și acasă* (at home too) clarifies that Mihai cooks for fun, not just at his restaurant job.'
  ro.a1.unit30.lesson04.teach.ana_gatesti_si:
    title: Ana is surprised
    gloss: 'Ana: You cook at home too? You already cook all day at your job!'
    note: '*Toată ziua* (all day) emphasizes how much Mihai already cooks at work; *deja* means "already".'
  ro.a1.unit30.lesson04.teach.mihai_da_dar:
    title: Mihai explains
    gloss: 'Mihai: Yes, but I find cooking relaxing. And you, what do you like doing?'
    note: '*Gătitul mi se pare relaxant* literally means "cooking seems relaxing to me": *mi se pare* is a common way to give an opinion.'
  ro.a1.unit30.lesson04.teach.ana_imi_place:
    title: Ana's hobbies
    gloss: 'Ana: I like reading and I often listen to music.'
    note: Combines two hobby verbs from lessons 1 and 2 in one sentence with *și* (and).
  ro.a1.unit30.lesson04.teach.mihai_joci_si:
    title: Mihai asks about gaming
    gloss: 'Mihai: Do you also game?'
    note: A short yes/no question using *jocuri video* from lesson 2; *joci* is the *tu* form of *a juca*.
  ro.a1.unit30.lesson04.teach.ana_nu_nu:
    title: Ana answers
    gloss: 'Ana: No, I never game. But I sometimes draw!'
    note: '*Niciodată* (never) and *uneori* (sometimes) from lesson 3, contrasted in one answer; *nu ... niciodată* is a double negative.'
  ro.a1.unit30.lesson05.teach.mihai_si_cu:
    title: Comparing hobbies
    gloss: Mihai and I often walk together. But we also have other hobbies. Mihai likes cooking, at home too, and he exercises often. I like reading and I often listen to music. I sometimes draw, but I never game. What do you like doing in your free time?
    note: Ana's message recaps facts from lesson04 and ends by asking the reader the unit's core question.
    glosses:
      plimbăm: walk
      des: often
      împreună: together
      alte: other
      gătească: cooks
      place: likes to
      acasă: at home
      sport: exercises
      citesc: read
      ascult: listen
      muzică: music
      desenez: draw
      uneori: sometimes
      joc: play video games
      niciodată: never
      liber: free
      timpul: time
  ro.a1.unit30.lesson06.teach.mihai_ce_faci:
    title: Mihai asks about the weekend
    gloss: 'Mihai: What are you doing this weekend?'
    note: '*În acest weekend* (this weekend) uses *acest* for "this".'
  ro.a1.unit30.lesson06.teach.ana_inca_nu:
    title: Ana is undecided
    gloss: 'Ana: I don''t know yet. I like reading, but I also want to go outside.'
    note: '*Să ies afară* (to go outside) is a common way to say you want to leave the house; *vreau să* + a verb means "I want to ...".'
  ro.a1.unit30.lesson06.teach.mihai_hai_sa:
    title: Mihai suggests a plan
    gloss: 'Mihai: Shall we walk together? I''ll cook for us afterward.'
    note: '*După aceea* (afterward) is a sequencing phrase; *Hai să* + a verb suggests doing something together.'
  ro.a1.unit30.lesson06.teach.ana_buna_idee:
    title: Ana agrees
    gloss: 'Ana: Good idea! I like both walking and cooking.'
    note: '*Și ..., și ...* ("both ... and ...") shows Ana likes two things equally, not one over the other.'
  ro.a1.unit30.lesson06.teach.mihai_perfect_atunci:
    title: Mihai confirms
    gloss: 'Mihai: Perfect. Then I''ll see you Saturday!'
    note: A friendly closing line confirming the plan for *sâmbătă* (Saturday); *ne vedem* means "we'll see each other".
