schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit19_weather.yaml for full detail.
    This unit's source PDF (US Peace Corps Moldova's "Basic Romanian
    Language Lessons") was checked for weather material and found NO
    dedicated weather lesson or vocabulary anywhere in its 785-line
    extraction. Only "cald" (warm) is source-confirmed, from Lesson
    13's general adjectives table. "Vreme," "soare," "plouă," "vânt,"
    and "frig" are all authored fresh from general standard Romanian
    knowledge (ordinary, high-frequency A1 weather words), disclosed
    honestly rather than overstated as source-confirmed. "Rece" (a true
    synonym of "frig") and "frumos"/"rău" (which would need feminine
    adjective agreement with "vreme," an unneeded new grammar point at
    this unit's scope) were checked but deliberately not used. Glosses/
    notes here are freshly authored to explain the target-language forms
    to an English speaker.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    realization file's own review pass. Checked clean: correct_response/
    accepted_answers shapes match the realization's word_bank/pairs, no
    same-speaker distractor collisions, no stray YAML booleans, no
    jargon leaks, English glosses/notes are accurate translations of
    the Romanian forms as authored. Nineteenth Romanian overlay, first
    draft, authored alongside the paired realization.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț). For
    free-typed A1 answers, accept otherwise-correct forms with the
    diacritics omitted or with the legacy cedilla variants ş/ţ
    substituted for ș/ț, matching units 01-18's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    This unit's own new vocabulary (vreme, soare, cald, plouă, vânt,
    frig) is used only in person-invariant impersonal constructions
    ("Este soare," "Plouă," "Este vânt," "Este frig," "Cum este
    vremea?") with no register distinction of any kind. No new tu/
    dumneavoastră form is introduced this unit; Ana and Mihai keep
    their existing formal register with each other in the dialogue's
    greeting/closing lines.

course:
  title: "Romanian A1"
  description: >-
    Describing basic weather in Romanian -- Vreme (weather), Soare
    (sun/sunny), Cald (warm), Plouă (it rains), Vânt (wind), and Frig
    (cold) -- as Ana and Mihai check tomorrow's forecast and decide
    when to go to the park.

units:
  ro.a1.unit19.weather:
    title: "Weather"

lessons:
  ro.a1.unit19.lesson01.vremea_de_azi:
    title: "Today's weather"
  ro.a1.unit19.lesson02.vremea_de_maine:
    title: "Tomorrow's weather"
  ro.a1.unit19.lesson03.planul_de_sambata:
    title: "Saturday's plan"

teaching:
  ro.a1.unit19.lesson01.teach.reminder_ana_este:
    title: "Reminder: Ana, Este, Și"
    gloss: "Ana (name) · Este (is) · Și (and)"
    note: "Ana is the character's name, established since unit01; *este* is from unit08's housing content; *și* is from unit05 -- this unit reuses all three to describe today's weather."

  ro.a1.unit19.lesson01.teach.reminder_astazi:
    title: "Reminder: Astăzi"
    gloss: "Astăzi (today)"
    note: "From unit03's own date vocabulary -- reused here to talk about today's weather."

  ro.a1.unit19.lesson01.teach.vreme_vocab:
    title: "Weather"
    gloss: "Vreme (weather)"
    note: "*Vremea* (with no space before *este*) is the definite form of *vreme* -- 'the weather,' the same -a suffix pattern already seen with *casa*/*baia*/*apartamentul* in unit18."
    example_gloss:
      - "How's the weather?"

  ro.a1.unit19.lesson01.teach.cum_este_vremea_phrase:
    title: "How's the weather?"
    gloss: "Cum este vremea? (How's the weather?)"
    note: "The everyday way to ask about the weather -- *cum* is from unit01/unit09/unit12."

  ro.a1.unit19.lesson01.teach.soare_vocab:
    title: "Sun / sunny"
    gloss: "Soare (sun / sunny)"
    note: "Used with *este* to describe sunny weather: *Este soare* literally 'it is sun,' meaning 'it's sunny.'"
    example_gloss:
      - "Today it's sunny."

  ro.a1.unit19.lesson01.teach.cald_vocab:
    title: "Warm / hot"
    gloss: "Cald (warm / hot)"
    note: "An invariant weather word -- *Este cald* always uses this same form, with no agreement."
    example_gloss:
      - "Today it's warm."

  ro.a1.unit19.lesson01.teach.astazi_soare_cald_phrase:
    title: "Today it's sunny. It's warm."
    gloss: "Astăzi este soare. Este cald."
    note: "Every word here was already taught or just introduced, combined into two new sentences describing today's weather."

  ro.a1.unit19.lesson02.teach.reminder_mihai_maine:
    title: "Reminder: Mihai, Mâine"
    gloss: "Mihai (name) · Mâine (tomorrow)"
    note: "Mihai is the character's name, established since unit01; *mâine* is from unit03/unit12 -- this unit reuses both to describe tomorrow's forecast."

  ro.a1.unit19.lesson02.teach.reminder_nu_mergem_la_parc:
    title: "Reminder: Nu, Mergem, La parc"
    gloss: "Nu (no / not) · Mergem (we go) · La parc (to the park)"
    note: "All from unit11's plan-negotiation vocabulary -- reused here to decide whether the weather allows a trip to the park."

  ro.a1.unit19.lesson02.teach.ploua_vocab:
    title: "It's raining"
    gloss: "Plouă (it's raining / it rains)"
    note: "An impersonal verb form -- no subject is needed, the same way *Este cald* needs none."
    example_gloss:
      - "Tomorrow it's raining."

  ro.a1.unit19.lesson02.teach.vant_vocab:
    title: "Wind"
    gloss: "Vânt (wind)"
    note: "Used with *este* the same way as *soare*: *Este vânt*, 'it's windy.'"
    example_gloss:
      - "Tomorrow it's windy."

  ro.a1.unit19.lesson02.teach.frig_vocab:
    title: "Cold"
    gloss: "Frig (cold)"
    note: "Used with *este*: *Este frig*, 'it's cold.'"
    example_gloss:
      - "Tomorrow it's cold."

  ro.a1.unit19.lesson02.teach.maine_ploua_phrase:
    title: "Tomorrow it's raining. It's windy and cold."
    gloss: "Mâine plouă. Este vânt și este frig."
    note: "Every word here was already taught or just introduced, combined into a full forecast for tomorrow."

  ro.a1.unit19.lesson02.teach.nu_mergem_phrase:
    title: "We don't go to the park tomorrow."
    gloss: "Nu mergem la parc mâine. (We don't go to the park tomorrow.)"
    note: "The weather-based plan this lesson builds toward -- reuses unit11's own *mergem*/*la parc* with *nu* in front."

  ro.a1.unit19.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: "Reminder: Bună, Ce mai faceți?, Bine, mulțumesc"
    gloss: "Bună (hi) · Ce mai faceți? (how are you, formal) · Bine, mulțumesc (fine, thank you)"
    note: "All from unit01's opening greeting, reused here to start this unit's own dialogue."

  ro.a1.unit19.lesson03.teach.reminder_sambata_la_revedere:
    title: "Reminder: Sâmbătă, La revedere"
    gloss: "Sâmbătă (Saturday) · La revedere (goodbye)"
    note: "*Sâmbătă* is from unit03/unit11/unit12; *la revedere* is from unit01 -- both reused for the weekend-plan dialogue."

  ro.a1.unit19.lesson03.teach.line01:
    title: "Greet Mihai and ask how he is"
    gloss: "Ana greets Mihai and asks how he's doing."
    note: "Reuses unit01's own *Ce mai faceți?* greeting."

  ro.a1.unit19.lesson03.teach.line02:
    title: "Answer and ask about tomorrow's weather"
    gloss: "Mihai answers, then asks Ana what tomorrow's weather will be like."
    note: "Combines unit01's *Bine, mulțumesc* with this unit's own lesson01 phrase, *Cum este vremea?*, adding *mâine*."

  ro.a1.unit19.lesson03.teach.line03:
    title: "Describe tomorrow's forecast"
    gloss: "Ana tells him it will rain, and it'll be windy and cold."
    note: "Reuses this unit's own lesson02 phrase exactly."

  ro.a1.unit19.lesson03.teach.line04:
    title: "Suggest skipping the park and going Saturday instead"
    gloss: "Mihai says they won't go to the park tomorrow, and asks about Saturday instead."
    note: "Combines this unit's own lesson02 phrase with unit11's *mergem* and this unit's *sâmbătă*."

  ro.a1.unit19.lesson03.teach.line05:
    title: "Agree, noting Saturday's sunny forecast"
    gloss: "Ana says Saturday will be sunny, and agrees to the plan."
    note: "Combines *soare* with unit11's own *Da, bine!* agreement phrase."

  ro.a1.unit19.lesson03.teach.line06:
    title: "Say goodbye"
    gloss: "Mihai says goodbye."
    note: "The same closing pattern every earlier unit's dialogue has ended on."

  ro.a1.unit19.lesson03.teach.line07:
    title: "Say goodbye"
    gloss: "Ana says goodbye."
    note: "The same closing pattern every earlier unit's dialogue has ended on."

exercises:
  ro.a1.unit19.lesson01.exercise01.choose_soare:
    instruction: "Which word means 'sun / sunny'?"
    correct_option: "Soare"
    distractors: ["Cald", "Vreme"]
    accepted_answers: ["Soare"]

  ro.a1.unit19.lesson01.exercise02.choose_cald:
    instruction: "Which word means 'warm / hot'?"
    correct_option: "Cald"
    distractors: ["Soare", "Vreme"]
    accepted_answers: ["Cald"]

  ro.a1.unit19.lesson01.exercise03.listen_astazi_este_soare:
    instruction: "Listen and select what you hear."
    correct_option: "Astăzi este soare"
    distractors: ["Astăzi este cald.", "Mâine plouă."]
    accepted_answers: ["Astăzi este soare"]

  ro.a1.unit19.lesson01.exercise04.match_weather1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Vreme": "weather"
      "Soare": "sun / sunny"
      "Cald": "warm / hot"
      "Este": "is"
      "Cum este vremea?": "How's the weather?"
      "Astăzi este soare.": "Today it's sunny."
      "Astăzi este cald.": "Today it's warm."

  ro.a1.unit19.lesson01.exercise05.order_astazi_soare_cald:
    instruction: "Build the sentence: Today it's sunny and warm."
    correct_response: ["Astăzi", "este", "soare", "și", "cald"]

  ro.a1.unit19.lesson01.exercise06.listen_order_cum_este_vremea:
    instruction: "Listen, then put the words in order."
    correct_response: ["Cum", "este", "vremea"]

  ro.a1.unit19.lesson01.exercise07.complete_cum_este_vremea:
    instruction: "Complete the question: How's the weather?"
    accepted_answers: ["vremea", "Vremea"]
    feedback: "Cum este *vremea*? -- *vremea* is the definite form of 'weather,' used in this everyday question."

  ro.a1.unit19.lesson01.exercise08.speak_astazi_soare_cald:
    instruction: "Say aloud: Today it's sunny and warm."
    accepted_answers:
      - "Astăzi este soare și cald."
      - "Astăzi este soare și cald"
      - "Astăzi este soare, este cald."

  ro.a1.unit19.lesson02.exercise01.choose_vant:
    instruction: "Which word means 'wind'?"
    correct_option: "Vânt"
    distractors: ["Frig", "Plouă"]
    accepted_answers: ["Vânt"]

  ro.a1.unit19.lesson02.exercise02.choose_frig:
    instruction: "Which word means 'cold'?"
    correct_option: "Frig"
    distractors: ["Vânt", "Plouă"]
    accepted_answers: ["Frig"]

  ro.a1.unit19.lesson02.exercise03.listen_maine_ploua:
    instruction: "Listen and select what you hear."
    correct_option: "Mâine plouă"
    distractors: ["Astăzi este soare.", "Este vânt și este frig."]
    accepted_answers: ["Mâine plouă"]

  ro.a1.unit19.lesson02.exercise04.match_weather2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Plouă": "it's raining"
      "Vânt": "wind"
      "Frig": "cold"
      "Mâine": "tomorrow"
      "Mâine plouă.": "Tomorrow it's raining."
      "Este vânt.": "It's windy."
      "Nu mergem la parc mâine.": "We don't go to the park tomorrow."

  ro.a1.unit19.lesson02.exercise05.order_maine_ploua_frig:
    instruction: "Build the sentence: Tomorrow it's raining and it's cold."
    correct_response: ["Mâine", "plouă", "și", "este", "frig"]

  ro.a1.unit19.lesson02.exercise06.listen_order_este_vant_frig:
    instruction: "Listen, then put the words in order."
    correct_response: ["Este", "vânt", "și", "este", "frig"]

  ro.a1.unit19.lesson02.exercise07.complete_maine_ploua_frig:
    instruction: "Complete the forecast: Tomorrow it rains. It's windy and cold."
    accepted_answers: ["frig", "Frig"]
    feedback: "Este vânt și este *frig* -- *frig* is the word for 'cold' in this weather expression."

  ro.a1.unit19.lesson02.exercise08.speak_maine_frig_nu_mergem:
    instruction: "Say aloud: Tomorrow it's cold, so we don't go to the park."
    accepted_answers:
      - "Mâine este frig. Nu mergem la parc."
      - "Mâine este frig, nu mergem la parc."
      - "Mâine este frig și nu mergem la parc."

  ro.a1.unit19.lesson03.exercise01.choose_who_says_line04:
    instruction: "Who says this line?"
    correct_option: "Mihai"
    distractors: ["Ana"]
    accepted_answers: ["Mihai"]

  ro.a1.unit19.lesson03.exercise02.dialogue_comprehend_maine_ploua:
    instruction: "Listen to the dialogue. How's the weather tomorrow, according to Ana?"
    correct_option: "Plouă."
    distractors: ["Ninge."]
    accepted_answers: ["Plouă."]

  ro.a1.unit19.lesson03.exercise03.reading_comprehend_azi_vreme:
    instruction: "Read the note. What's the weather like today?"
    correct_option: "Soare și cald."
    distractors:
      - "Ploaie și frig."
      - "Vânt și soare."
    accepted_answers:
      - "Soare și cald."
      - "Soare si cald."

  ro.a1.unit19.lesson03.exercise04.match_unit_review:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Vreme": "weather"
      "Soare": "sun / sunny"
      "Cald": "warm / hot"
      "Plouă": "it's raining"
      "Vânt": "wind"
      "Frig": "cold"
      "Cum este vremea?": "How's the weather?"
      "Mâine plouă.": "Tomorrow it's raining."

  ro.a1.unit19.lesson03.exercise05.order_nu_mergem_maine:
    instruction: "Build the sentence: We don't go to the park tomorrow."
    correct_response: ["Nu", "mergem", "la", "parc", "mâine"]

  ro.a1.unit19.lesson03.exercise06.complete_cum_este_vremea_maine:
    instruction: "Complete the question: How's the weather tomorrow?"
    accepted_answers: ["vremea", "Vremea"]
    feedback: "Cum este *vremea* mâine? -- the same *vremea* from lesson01, now asking about tomorrow."

  ro.a1.unit19.lesson03.exercise07.respond_as_ana:
    instruction: "Take Ana's role. Mihai asks 'Cum este vremea mâine?' -- tell him it's raining, windy, and cold."
    accepted_answers:
      - "Mâine plouă. Este vânt și este frig."
      - "Mâine plouă, este vânt și este frig."
      - "Mâine plouă și este vânt și frig."

  ro.a1.unit19.lesson03.exercise08.speak_sambata_soare_parc:
    instruction: "Say aloud: Saturday it's sunny, so we go to the park."
    accepted_answers:
      - "Sâmbătă este soare. Mergem la parc."
      - "Sâmbătă este soare, mergem la parc."
      - "Sâmbătă este soare și mergem la parc."

  ro.a1.unit19.lesson03.exercise09.write_weather_note:
    instruction: "Write a short sentence about today's weather (sunny, rainy, warm, cold, or windy)."
    accepted_answers:
      - "Astăzi este soare."
      - "Astăzi este cald."
      - "Astăzi plouă."
      - "Astăzi este vânt."
      - "Astăzi este frig."
      - "Astăzi este soare și cald."
      - "Astăzi este soare și este cald."
      - "Astăzi plouă și este frig."
      - "Astăzi plouă și frig."
