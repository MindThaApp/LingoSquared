course:
  title: Romanian B1
  description: >-
    Intermediate Romanian: debating with nuance -- conceding a valid
    point with "deși" (although) before restating your own position,
    and using "cu toate acestea" (nevertheless), a stronger contrastive
    connector than a simple "dar" (but).

units:
