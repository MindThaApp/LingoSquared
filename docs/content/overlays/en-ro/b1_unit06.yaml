course:
  title: Romanian B1
  description: >-
    Intermediate Romanian: recounting a past experience as a sequence of
    events, marking background action against a main-line event with a
    sequencing connector, and reporting what someone else said.

units:
  ro.b1.unit06.narrative:
    title: "What I Saw Yesterday"
    description: Recount a past experience as a sequence of events, marking background action against a main-line event with a sequencing connector, and report what someone else said.

lessons:
  ro.b1.unit06.lesson01.cand_mergeam:
    title: "When I was going to the office"
  ro.b1.unit06.lesson02.reported_speech:
    title: "She said that"
  ro.b1.unit06.lesson03.combined_sequencing:
    title: "Then, later"
  ro.b1.unit06.lesson04.dialogue_ce_s_a_intamplat:
    title: "What happened?"
  ro.b1.unit06.lesson05.reading_o_zi_obisnuita:
    title: "An ordinary day"
  ro.b1.unit06.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  ro.b1.unit06.lesson01.teach.mergeam:
    title: "I was going"
    gloss: "I was going"
    note: "*mergeam* -- imperfectul (imperfect), the tense for a background/ongoing past action, genuinely new for this course. Contrast with *am mers* (perfect compus, 'I went' as a completed event) -- both are correct, they just describe different things."
    example_gloss: "Yesterday, when I was going to the office, I ran into Diana on the street."
  ro.b1.unit06.lesson01.teach.spre_birou:
    title: "toward the office"
    gloss: "toward the office"
    example_gloss: "Yesterday, when I was going to the office, I ran into Diana on the street."
  ro.b1.unit06.lesson01.teach.cand:
    title: when
    gloss: when
    note: "*când* is this unit's sequencing connector -- it marks the background imperfect clause against the main-line perfect-compus event that follows."
    example_gloss: "Yesterday, when I was going to the office, I ran into Diana on the street."
  ro.b1.unit06.lesson01.teach.am_dat_de:
    title: "I ran into"
    gloss: "I ran into"
    note: "*am dat de* -- perfect compus, the main-line completed event set against the imperfect background clause. Chosen over *am văzut-o pe Diana* to avoid clitic-pronoun doubling this early in a brand-new tense unit."
    example_gloss: "Yesterday, when I was going to the office, I ran into Diana on the street."
  ro.b1.unit06.lesson01.teach.pe_strada:
    title: "on the street"
    gloss: "on the street"
    example_gloss: "Yesterday, when I was going to the office, I ran into Diana on the street."
  ro.b1.unit06.lesson01.teach.colega:
    title: "my colleague"
    gloss: "my colleague"
    example_gloss: "Diana is my colleague from the office."
  ro.b1.unit06.lesson01.teach.grammar_imperfect:
    title: "I was going to the office. I ran into Diana. The imperfect (mergeam) describes the background action; the perfect compus (am dat) describes the main event."
    gloss: "I was going to the office. I ran into Diana. The imperfect (mergeam) describes the background action; the perfect compus (am dat) describes the main event."
    note: "The core grammar move of this whole unit: pair an imperfect background clause with a perfect-compus main-line event, connected by *când*."

  ro.b1.unit06.lesson02.teach.a_spus_ca:
    title: "said that"
    gloss: "said that"
    note: "*a spus că* -- reported speech. Romanian keeps the same indicative tense the original speaker used (*era*, imperfect, stays *era*) rather than English's strict tense-backshift -- a genuine cross-linguistic difference, not a simplification."
    example_gloss: "Diana said that she was late."
  ro.b1.unit06.lesson02.teach.era:
    title: was
    gloss: was
    example_gloss: "Diana said that she was late because of the traffic."
  ro.b1.unit06.lesson02.teach.intarziata:
    title: "late (fem.)"
    gloss: "late (fem.)"
    example_gloss: "Diana said that she was late because of the traffic."
  ro.b1.unit06.lesson02.teach.din_cauza:
    title: "because of"
    gloss: "because of"
    example_gloss: "Diana said that she was late because of the traffic."
  ro.b1.unit06.lesson02.teach.traficului:
    title: "the traffic (gen.)"
    gloss: "the traffic (gen.)"
    note: "*traficului* -- genitive form of *traficul*, already familiar from the A2 opinions unit; *din cauza* always takes the genitive."
    example_gloss: "Diana said that she was late because of the traffic."
  ro.b1.unit06.lesson02.teach.de_aceea:
    title: "that's why"
    gloss: "that's why"
    example_gloss: "The traffic was heavy, that's why Diana was late."
  ro.b1.unit06.lesson02.teach.grammar_reported_speech:
    title: "Diana said that she was late because of the traffic. Reported speech in Romanian keeps the original verb's tense."
    gloss: "Diana said that she was late because of the traffic. Reported speech in Romanian keeps the original verb's tense."
    note: "Unlike English (which would shift 'is late' to 'was late'), Romanian's *a spus că era* keeps the same imperfect that the original statement used -- don't over-correct this into a tense shift."

  ro.b1.unit06.lesson03.teach.apoi:
    title: then
    gloss: then
    example_gloss: "I ran into Diana. Then, we went to the office together."
  ro.b1.unit06.lesson03.teach.am_mers_impreuna:
    title: "we went together"
    gloss: "we went together"
    example_gloss: "I ran into Diana. Then, we went to the office together."
  ro.b1.unit06.lesson03.teach.mai_tarziu:
    title: later
    gloss: later
    example_gloss: "Later, I told Mihai what I saw."
  ro.b1.unit06.lesson03.teach.am_povestit:
    title: "I told/recounted"
    gloss: "I told/recounted"
    note: "*am povestit lui Mihai* -- 'I told to Mihai,' using the dative marker *lui* rather than a clitic pronoun, the same clitic-avoiding pattern as *am dat de*."
    example_gloss: "Later, I told Mihai what I saw."
  ro.b1.unit06.lesson03.teach.ce_am_vazut:
    title: "what I saw"
    gloss: "what I saw"
    example_gloss: "Later, I told Mihai what I saw."
  ro.b1.unit06.lesson03.teach.grammar_full_sequence:
    title: "Yesterday, when I was going to the office, I ran into Diana. Then, we went to the office together. She said that she was late because of the traffic. Later, I told Mihai what I saw."
    gloss: "Yesterday, when I was going to the office, I ran into Diana. Then, we went to the office together. She said that she was late because of the traffic. Later, I told Mihai what I saw."
    note: "The full narrative chain this unit builds toward: background (imperfect) + main event (perfect compus) + sequencing connectors (apoi, mai târziu) + reported speech (a spus că), all in one flowing account."

  ro.b1.unit06.lesson04.teach.ce_s_a_intamplat:
    title: "what happened"
    gloss: "what happened"
    note: "*Ce s-a întâmplat?* -- a fixed, near-unavoidable idiom, taught here as one memorized chunk rather than decomposed clitic morphology (the same treatment b1_unit04 gives *sunt de acord*)."
    example_gloss: "Really? What happened?"
  ro.b1.unit06.lesson04.teach.serios:
    title: "really/seriously"
    gloss: "really/seriously"
    example_gloss: "Really? What happened?"
  ro.b1.unit06.lesson04.teach.groaznic:
    title: "terrible/awful"
    gloss: "terrible/awful"
    example_gloss: "The traffic was terrible yesterday!"
  ro.b1.unit06.lesson04.teach.sper_ca:
    title: "I hope that"
    gloss: "I hope that"
    example_gloss: "I hope you (formal) weren't very late to the office."
  ro.b1.unit06.lesson04.teach.am_ajuns:
    title: "I arrived"
    gloss: "I arrived"
    example_gloss: "No, I arrived on time, thank you."
  ro.b1.unit06.lesson04.teach.la_timp:
    title: "on time"
    gloss: "on time"
    example_gloss: "No, I arrived on time, thank you."
  ro.b1.unit06.lesson04.teach.dialogue_ana_1:
    title: "Hello, Mihai! Yesterday, when I was going to the office, I ran into Diana on the street."
    gloss: "Hello, Mihai! Yesterday, when I was going to the office, I ran into Diana on the street."
  ro.b1.unit06.lesson04.teach.dialogue_mihai_1:
    title: "Really? What happened?"
    gloss: "Really? What happened?"
  ro.b1.unit06.lesson04.teach.dialogue_ana_2:
    title: "Diana said that she was late because of the traffic. Then, we went to the office together."
    gloss: "Diana said that she was late because of the traffic. Then, we went to the office together."
  ro.b1.unit06.lesson04.teach.dialogue_diana_1:
    title: "Yes, the traffic was terrible yesterday!"
    gloss: "Yes, the traffic was terrible yesterday!"
  ro.b1.unit06.lesson04.teach.dialogue_mihai_2:
    title: "I understand. I hope you (formal) weren't very late to the office."
    gloss: "I understand. I hope you (formal) weren't very late to the office."
  ro.b1.unit06.lesson04.teach.dialogue_diana_2:
    title: "No, I arrived on time, thank you."
    gloss: "No, I arrived on time, thank you."

  ro.b1.unit06.lesson05.teach.a_fost_obisnuita:
    title: "it was an ordinary day"
    gloss: "it was an ordinary day"
    example_gloss: "Yesterday was an ordinary day for Ana."
  ro.b1.unit06.lesson05.teach.dimineata:
    title: "in the morning"
    gloss: "in the morning"
    example_gloss: "In the morning, while she was going to the office, she ran into Diana on the street."
  ro.b1.unit06.lesson05.teach.mergea:
    title: "she was going"
    gloss: "she was going"
    note: "*mergea* -- 3rd-person singular imperfect, the same tense as *mergeam* (lesson01) but conjugated for 'she' rather than 'I,' since this reading tells the story in the third person."
    example_gloss: "In the morning, while she was going to the office, she ran into Diana on the street."
  ro.b1.unit06.lesson05.teach.asa_ca:
    title: "so/therefore"
    gloss: "so/therefore"
    example_gloss: "Diana was late, so they went to the office together."
  ro.b1.unit06.lesson05.teach.au_mers:
    title: "they went"
    gloss: "they went"
    example_gloss: "Diana was late, so they went to the office together."
  ro.b1.unit06.lesson05.teach.a_vazut:
    title: "she saw"
    gloss: "she saw"
    note: "*a văzut* -- 3rd-person singular perfect compus of *a vedea*, contrasting with lesson01's 1st-person *am dat de* for the same 'encounter' idea told from the narrator's own side."
    example_gloss: "Ana told Mihai what she saw."
  ro.b1.unit06.lesson05.teach.zona:
    title: "the whole area"
    gloss: "the whole area"
    example_gloss: "Mihai said that the traffic was terrible in the whole area that morning."
  ro.b1.unit06.lesson05.teach.reading_passage:
    title: "An ordinary day"
    gloss: "An ordinary day"
    note: "A short third-person narrative retelling the same incident, giving the reading/writing half of the spine outcome's requirement a genuine written artifact with the full imperfect + perfect-compus + reported-speech + sequencing pattern."
    glosses:
      Ieri: "yesterday"
      fost: "was (from a fi)"
      zi: "day"
      obișnuită: "ordinary"
      Dimineața: "in the morning"
      mergea: "was going (from a merge)"
      spre: "towards"
      birou: "office"
      dat: "ran into (from a da)"
      stradă: "street"
      spus: "said (from a spune)"
      era: "was (from a fi)"
      întârziată: "late"
      cauza: "because of / cause"
      traficului: "traffic"
      așa: "so (in așa că)"
      mers: "went (from a merge)"
      împreună: "together"
      târziu: "later / late"
      povestit: "told (from a povesti)"
      văzut: "seen (from a vedea)"
      traficul: "traffic"
      groaznic: "terrible"
      toată: "whole"
      zona: "area"

  ro.b1.unit06.lesson06.teach.grammar_review:
    title: "I was going to the office when I ran into Diana. She said that she was late. Later, I told Mihai what happened."
    gloss: "I was going to the office when I ran into Diana. She said that she was late. Later, I told Mihai what happened."
    note: "This unit's full narrative toolkit in one glance: imperfect background (mergeam) + când + perfect-compus main event (am dat de) + reported speech (a spus că era) + sequencing (mai târziu)."
  ro.b1.unit06.lesson06.teach.in_cele_din_urma:
    title: finally
    gloss: finally
    example_gloss: "Finally, they arrived at the office on time."

