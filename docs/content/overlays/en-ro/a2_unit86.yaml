teaching:
  ro.a2.unit86.lesson01.teach.cuvinte: {"title": "Giving advice", "gloss": "should / you sleep / you drink / you rest / water / more", "note": "*Ar trebui* never changes. The verb after *să* has the form for the person you advise.", "example_gloss": ["You should sleep more.", "You should drink water.", "You should rest."]}
  ro.a2.unit86.lesson01.teach.gn_ar_trebui: {"title": "*Ar trebui să*", "gloss": "You should sleep. You should drink water.", "note": "*Ar trebui să* + verb says what someone should do. It is a softer form of *trebuie să*."}
  ro.a2.unit86.lesson01.teach.gn_persoane: {"title": "*Ar trebui să* with different people", "gloss": "I should sleep more. You should sleep more. Maria should sleep more.", "note": "Only the verb after *să* changes: *dorm*, *dormi*, *doarmă*."}
  ro.a2.unit86.lesson01.teach.gn_intrebare: {"title": "Asking for advice", "gloss": "What should I do? You should rest.", "note": "*Ce ar trebui să fac?* asks for advice. The answer starts with *ar trebui să* and the *tu* form."}
  ro.a2.unit86.lesson02.teach.cuvinte: {"title": "Too much, too late", "gloss": "late / too / a lot / in the evening / you work", "note": "*Prea* means 'too' and goes before *mult* or *târziu*.", "example_gloss": ["You shouldn't drink coffee in the evening.", "You shouldn't go to bed late.", "You work too much."]}
  ro.a2.unit86.lesson02.teach.gn_nu_ar_trebui: {"title": "*Nu ar trebui să*", "gloss": "You shouldn't drink coffee in the evening. You shouldn't work too much.", "note": "*Nu* goes before *ar trebui*. The advice says what is better not to do."}
  ro.a2.unit86.lesson02.teach.gn_prea: {"title": "*Prea* means too", "gloss": "too much, too late, too little. You work too much.", "note": "*Prea* + a word shows that something is more than good. It is often the reason behind advice."}
  ro.a2.unit86.lesson03.teach.cuvinte: {"title": "Other ways to advise", "gloss": "it would be good / better / doctor / you go / I think", "note": "*Mai bine* + the *tu* form is direct, friendly advice.", "example_gloss": ["It would be good for you to go to the doctor.", "You'd better go to the doctor.", "I think it would be good for you to sleep."]}
  ro.a2.unit86.lesson03.teach.gn_ar_fi_bine: {"title": "*Ar fi bine să*", "gloss": "It would be good to go to the doctor. It would be good to rest.", "note": "*Ar fi bine să* + verb is a gentle way to advise. It means about the same as *ar trebui să*."}
  ro.a2.unit86.lesson03.teach.gn_mai_bine: {"title": "*Mai bine*", "gloss": "You'd better go to the doctor. You'd better sleep at home.", "note": "*Mai bine* + the *tu* form is shorter and more direct than *ar trebui să*. It is used with friends."}
  ro.a2.unit86.lesson03.teach.gn_cred_ca: {"title": "*Cred că*", "gloss": "I think you should go to the doctor. I think it would be good for you to sleep.", "note": "*Cred că* ('I think that') makes advice softer."}
  ro.a2.unit86.lesson04.teach.cuvinte: {"title": "Asking for advice", "gloss": "with a cold / I cough / advice / you stay / tea", "note": "A woman says *Sunt răcită*. *A sta acasă* means 'to stay at home'.", "example_gloss": ["I have a cold.", "I cough a lot.", "I would like some advice.", "You should stay at home and drink tea."]}
  ro.a2.unit86.lesson04.teach.gn_cere: {"title": "Asking what to do", "gloss": "I have a cold. What should I do? What should Maria do?", "note": "*Ce ar trebui să fac?* is the question; for another person the verb changes: *să facă*."}
  ro.a2.unit86.lesson04.teach.gn_doua_verbe: {"title": "Two pieces of advice", "gloss": "You should stay at home and drink tea.", "note": "When *ar trebui* governs two verbs, each one gets its own *să*: *să stai* and *să bei*."}
  ro.a2.unit86.lesson04.teach.gn_sfatuiesc: {"title": "*Te sfătuiesc să*", "gloss": "I advise you to stay at home. You should stay at home.", "note": "*Te sfătuiesc să* is firmer than *ar trebui să*. Use *ar trebui să* in everyday talk."}
  ro.a2.unit86.lesson05.teach.cuvinte: {"title": "Words for the messages", "gloss": "with a cold (woman) / worked / tomorrow", "note": "*Răcită* is the feminine form of *răcit*.", "example_gloss": ["Ana has a cold.", "Ana has worked too much."]}
  ro.a2.unit86.lesson05.teach.mesaj_ana: {"title": "Ana writes to Mihai", "gloss": "Hi, Mihai! I have a cold and I cough a lot. I have worked too much. What should I do?", "note": "Ana asks for advice."}
  ro.a2.unit86.lesson05.teach.raspuns_mihai: {"title": "Mihai answers", "gloss": "Hi, Ana! You should stay at home and drink tea. You shouldn't work too much. I think it would be good for you to go to the doctor.", "note": "Mihai uses three advice patterns: *ar trebui să*, *nu ar trebui să* and *cred că ar fi bine să*."}
  ro.a2.unit86.lesson06.teach.d1: {"title": "Mihai asks", "gloss": "Mihai: Ana, what's wrong?"}
  ro.a2.unit86.lesson06.teach.d2: {"title": "Ana asks for advice", "gloss": "Ana: I have a cold and I cough a lot. What should I do?"}
  ro.a2.unit86.lesson06.teach.d3: {"title": "Mihai advises", "gloss": "Mihai: You should stay at home and drink tea."}
  ro.a2.unit86.lesson06.teach.d4: {"title": "Ana has work", "gloss": "Ana: But I have a lot of work."}
  ro.a2.unit86.lesson06.teach.d5: {"title": "Mihai insists", "gloss": "Mihai: You shouldn't work too much. I think it would be good for you to go to the doctor."}
  ro.a2.unit86.lesson06.teach.d6: {"title": "Ana agrees", "gloss": "Ana: You're right. Tomorrow I'll go to the doctor."}
  ro.a2.unit86.lesson06.teach.d7: {"title": "Mihai adds", "gloss": "Mihai: Good. And you should sleep more!"}
