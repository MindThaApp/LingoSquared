answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Romanian A1
  description: 'Beginner Romanian for talking about pets and common animals: naming them, basic care (walking, feeding, playing), saying what animals you love even without owning one, and the regular Romanian plural.'
units:
  ro.a1.unit32.animale:
    title: Animals and pets
lessons:
  ro.a1.unit32.lesson01.caine_pisica_peste_si:
    title: Dog, cat, fish, and bird
  ro.a1.unit32.lesson02.ingrijirea_unui_animal_de:
    title: Caring for a pet
  ro.a1.unit32.lesson03.a_iubi_animalele:
    title: Loving animals
  ro.a1.unit32.lesson04.mihai_o_intreaba_pe:
    title: Mihai asks about Ana's dog
  ro.a1.unit32.lesson05.mihai_elena_si_andrei:
    title: Mihai, Elena, and Andrei on animals
  ro.a1.unit32.lesson06.nina_si_pasarea_ei:
    title: Nina's bird
teaching:
  ro.a1.unit32.lesson01.teach.animalul_un_animal:
    title: Animal, a pet
    gloss: the animal / a pet
    note: '*Animal* is the general word; *animal de companie* ("companion animal") means specifically a pet. The plural is *animale* (*un animal*, *două animale*).'
    example_gloss:
    - A dog is an animal.
    - A dog is also a pet.
  ro.a1.unit32.lesson01.teach.cainele_pisica:
    title: Dog and cat
    gloss: the dog / the cat
    example_gloss:
    - Ana has a dog.
    - Andrei has a cat.
  ro.a1.unit32.lesson01.teach.pestele_pasarea:
    title: Fish and bird
    gloss: the fish / the bird
    example_gloss:
    - Grandpa has a fish.
    - Nina has a bird.
  ro.a1.unit32.lesson01.teach.ai_un_animal:
    title: Do you have a pet?
    gloss: Do you have a pet?
    note: 'The same *Ai ...?* question pattern you already know: *a avea* (to have) + a noun.'
  ro.a1.unit32.lesson01.teach.da_am_un:
    title: Yes, I have a dog
    gloss: Yes, I have a dog.
    note: A simple affirmative answer using this unit's new vocabulary.
  ro.a1.unit32.lesson01.teach.nu_nu_am:
    title: No, I don't have a pet
    gloss: No, I don't have a pet.
    note: After *nu am*, *niciun* ("not a single") negates the noun; see the grammar note.
  ro.a1.unit32.lesson01.teach.la_negatie_nu:
    title: 'Nu am: no article'
    gloss: 'After nu am you do not use un or o: Nu am timp, nu am niciun animal de companie.'
    note: 'Reuses the exact pattern already taught for *Nu am timp*: not new grammar, just a new noun to apply it to.'
  ro.a1.unit32.lesson02.teach.a_scoate_la:
    title: To walk (an animal)
    gloss: to walk (an animal)
    note: '*A scoate la plimbare* is a fixed phrase; see the grammar note.'
    example_gloss: I walk the dog every day.
  ro.a1.unit32.lesson02.teach.verbul_se_schimba:
    title: The verb changes with the person
    gloss: 'The verb changes with the person: eu scot, tu scoți, el scoate (I take, you take, he takes) the dog for a walk.'
    note: 'Romanian verbs change their ending for each person, so *a scoate la plimbare* is conjugated as one verb: *scot*, *scoți*, *scoate*.'
  ro.a1.unit32.lesson02.teach.a_da_de:
    title: To feed
    gloss: to feed
    example_gloss: I feed the cat every day.
  ro.a1.unit32.lesson02.teach.a_se_juca:
    title: To play with
    gloss: to play with
    example_gloss: Andrei plays with his cat.
  ro.a1.unit32.lesson02.teach.scot_cainele_la:
    title: I walk the dog every day
    gloss: I walk the dog every day.
    note: Combines *a scoate la plimbare* with *în fiecare zi* (every day), already known from an earlier unit.
  ro.a1.unit32.lesson02.teach.dau_de_mancare:
    title: I feed the cat every day
    gloss: I feed the cat every day.
    note: 'Combines *a da de mâncare* with *în fiecare zi*; the animal takes the dative: *pisicii*.'
  ro.a1.unit32.lesson03.teach.plural_caine_caini:
    title: 'Plural: câine → câini'
    gloss: 'Plural: câine → câini, animal → animale, pisică → pisici.'
    note: The regular Romanian plural pattern, introduced here for the first time with animal nouns as the example set.
  ro.a1.unit32.lesson03.teach.caini_pisici:
    title: Dogs and cats
    gloss: dogs / cats
    example_gloss:
    - Mihai loves dogs.
    - Elena loves cats.
  ro.a1.unit32.lesson03.teach.pesti_pasari:
    title: Fish and birds (plural)
    gloss: fish (plural) / birds
    example_gloss:
    - I love fish.
    - Grandpa loves birds.
  ro.a1.unit32.lesson03.teach.iubesc_animalele:
    title: I love animals
    gloss: I love animals.
    note: '*A iubi* ("to love") takes its object with no preposition: *Iubesc animalele*; the article *-le* shows we mean animals in general.'
  ro.a1.unit32.lesson03.teach.elena_iubeste_pisicile:
    title: Elena loves cats, but has no pet
    gloss: Elena loves cats, but she doesn't have a pet.
    note: Sets up the contrast lesson05's reading is built around.
  ro.a1.unit32.lesson04.teach.mihai_ai_un:
    title: Mihai asks about a pet
    gloss: 'Mihai: Do you have a pet, Ana?'
  ro.a1.unit32.lesson04.teach.ana_da_am:
    title: Ana has a dog
    gloss: 'Ana: Yes, I have a dog.'
  ro.a1.unit32.lesson04.teach.mihai_cum_arata:
    title: Mihai asks what it looks like
    gloss: 'Mihai: What does he look like?'
    note: Reuses the *Cum arată ...?* question from the appearance unit, now asked about an animal.
  ro.a1.unit32.lesson04.teach.ana_are_blana:
    title: Ana describes her dog
    gloss: 'Ana: He has brown hair and he''s small.'
    note: Reuses hair-color and size vocabulary from the appearance unit, now describing an animal's fur instead of a person's hair.
  ro.a1.unit32.lesson04.teach.pentru_un_animal:
    title: El and ea for animals
    gloss: 'For an animal use el or ea, depending on its gender: câinele is el, pisica is ea.'
    note: Every earlier use of *el* and *ea* in this course referred to a person; this extends them to animals, following the noun's gender.
  ro.a1.unit32.lesson04.teach.mihai_il_scoti:
    title: Mihai asks about walks
    gloss: 'Mihai: Do you walk him every day?'
  ro.a1.unit32.lesson04.teach.ana_da_il:
    title: Ana describes her routine
    gloss: 'Ana: Yes, I walk him every day and I feed him.'
  ro.a1.unit32.lesson05.teach.mihai_si_elena:
    title: Mihai, Elena, and Andrei on animals
    gloss: 'Mihai and Elena both love animals, but neither of them has a pet. Mihai loves dogs and Elena loves cats. Andrei does have a pet: a cat. He often plays with his cat and feeds the cat every day. Do you have a pet?'
    note: Contrasts loving an animal with actually owning one -- the outcome's own communicative point.
    glosses:
      iubesc: love
      amândoi: both
      animalele: animals
      doi: both
      companie: pet
      câinii: dogs
      pisicile: cats
      pisică: cat
      joacă: plays
      dă: gives
      fiecare: every
      mâncare: food
  ro.a1.unit32.lesson05.teach.andrei_se_joaca:
    title: Andrei often plays with his cat
    gloss: Andrei often plays with his cat.
    note: '*Des* (often) reuses the frequency word from the hobbies unit; *a se juca cu* ("to play with") is a reflexive verb.'
  ro.a1.unit32.lesson05.teach.iubesc_cainii_nu:
    title: I love dogs. I don't have a pet.
    gloss: I love dogs. I don't have a pet.
    note: A model two-sentence answer, ready to reuse for the unit's writing prompt.
  ro.a1.unit32.lesson06.teach.ana_nina_ai:
    title: Ana asks Nina
    gloss: 'Ana: Nina, do you have a pet too?'
  ro.a1.unit32.lesson06.teach.nina_da_am:
    title: Nina has a bird named Pico
    gloss: 'Nina: Yes, I have a bird. His name is Pico.'
    note: '*O cheamă* ("is named") reuses the name-giving verb *a chema*; a bird is feminine, so the pronoun is *o*.'
  ro.a1.unit32.lesson06.teach.mihai_ce_frumos:
    title: Mihai reacts
    gloss: 'Mihai: How nice! What do you do with him every day?'
  ro.a1.unit32.lesson06.teach.nina_ii_dau:
    title: Nina feeds him every day
    gloss: 'Nina: I feed him every day.'
  ro.a1.unit32.lesson06.teach.mihai_iubesc_si:
    title: Mihai loves birds too
    gloss: 'Mihai: I love birds too.'
  ro.a1.unit32.lesson06.teach.ana_ce_frumos:
    title: Ana closes the conversation
    gloss: 'Ana: Nice that the three of us love animals!'
    note: Closes the loop across all three characters' animal facts from this unit.
