review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Romanian confirmation needed (DRAFT). Confirm the English
    glosses match idiomatic Romanian, that every matching_pairs
    right-hand gloss discriminates its left on real meaning, and that
    the culminating writing/speaking answers (lesson06) accept the
    punctuation forms a correct learner would actually produce. See the
    realization file's review block for the full priority list.
  notes: >-
    Overlay for ro's eighth B2 unit (synthesis), authored alongside the
    realization -- completes the 8-unit B2 tier. English speakers' real
    interference risks for this outcome: (1) "afirmă" and "consideră"
    both attribute a claim to a source but differ in force (states a
    fact vs. holds an opinion) -- kept distinct in lesson01's glosses;
    (2) "pe când" (contrastive "whereas") is a different word from
    unit04's "în timp ce" (temporal "while"), even though English
    "while" can cover both -- flagged in lesson02's grammar note; (3)
    "se contrazic" is reflexive-reciprocal ('they contradict EACH
    OTHER'), which English "they contradict" leaves ambiguous (could
    read as one contradicting a third party) -- flagged in lesson04. No
    sibling-direction file (ro-en b2) was consulted.

course:
  title: Romanian B2
  description: >-
    Upper-intermediate Romanian: combine information from more than one
    source into a coherent summary -- attribute a claim to its source
    (afirmă, consideră, reiese că), compare two sources side by side (pe
    când, dimpotrivă, spre deosebire de), note where they agree (sunt de
    acord, la fel) and where they conflict (se contrazic, în privința),
    around two reviews of the same new restaurant.

units:
  ro.b2.unit08.sinteza:
    title: "Synthesis"
    description: Combine two sources into a coherent summary -- attribute claims, compare them side by side, and note where they agree and where they conflict.

lessons:
  ro.b2.unit08.lesson01.cine_spune_ce:
    title: "Who says what?"
  ro.b2.unit08.lesson02.doua_surse:
    title: "Two sources, side by side"
  ro.b2.unit08.lesson03.unde_sunt_de_acord:
    title: "Where do they agree?"
  ro.b2.unit08.lesson04.unde_se_contrazic:
    title: "Where do they conflict?"
  ro.b2.unit08.lesson05.doua_recenzii:
    title: "Two reviews, side by side"
  ro.b2.unit08.lesson06.sinteza_in_dialog:
    title: "Synthesis in a conversation"

teaching:
  ro.b2.unit08.lesson01.teach.recenzia:
    title: "the review"
    gloss: "the review"
    example_gloss: "Ana writes a review."
  ro.b2.unit08.lesson01.teach.sursa:
    title: "the source"
    gloss: "the source"
    example_gloss: "The source is clear."
  ro.b2.unit08.lesson01.teach.afirma:
    title: "states / asserts"
    gloss: "states / asserts (from a afirma)"
    note: "*Afirmă* attributes a claim stated as fact -- stronger than *consideră* (an opinion)."
    example_gloss: "Ana states that it is good."
  ro.b2.unit08.lesson01.teach.considera:
    title: "considers / finds"
    gloss: "considers / finds (from a considera)"
    note: "*Consideră* attributes a judgement or opinion, softer than *afirmă*'s flat assertion of fact."
    example_gloss: "Diana considers that it is expensive."
  ro.b2.unit08.lesson01.teach.reiese_ca:
    title: "it emerges that..."
    gloss: "it emerges that... / it follows that..."
    note: "*Reiese că...* attributes a conclusion to the SOURCES collectively, rather than to one person."
  ro.b2.unit08.lesson01.teach.pretul:
    title: "the price"
    gloss: "the price"
    example_gloss: "The price is good."
  ro.b2.unit08.lesson01.teach.excelenta:
    title: excellent
    gloss: "excellent (feminine form)"
    example_gloss: "The food is excellent."
  ro.b2.unit08.lesson01.teach.grammar_attributeren:
    title: "Ana states that the food is excellent. Diana considers that the price is high. From the reviews it emerges that the restaurant is good."
    gloss: "Ana states that the food is excellent. Diana considers that the price is high. From the reviews it emerges that the restaurant is good."
    note: "Attributing a claim to its source names WHO said it (*Ana afirmă*, *Diana consideră*) or draws a conclusion from the sources together (*reiese că*) -- never state a claim as if it were your own, unattributed fact."

  ro.b2.unit08.lesson02.teach.ambele:
    title: both
    gloss: both
    example_gloss: "Both reviews are positive."
  ro.b2.unit08.lesson02.teach.pozitiv_negativ:
    title: "positive / negative"
    gloss: "positive / negative"
    example_gloss: "The review is positive."
  ro.b2.unit08.lesson02.teach.serviciul:
    title: "the service"
    gloss: "the service"
    example_gloss: "The service is slow."
  ro.b2.unit08.lesson02.teach.pe_cand:
    title: whereas
    gloss: "whereas (contrastive)"
    note: "*Pe când* contrasts two different sources -- a DIFFERENT word from unit04's *în timp ce* ('while', temporal, an ongoing action interrupted by an event). Same English 'while' can cover both, but Romanian keeps them apart."
    example_gloss: "Ana is satisfied, whereas Diana is not."
  ro.b2.unit08.lesson02.teach.dimpotriva:
    title: "on the contrary"
    gloss: "on the contrary (standalone, after a negation)"
    note: "*Dimpotrivă* follows a negated statement and reverses it -- 'not X, on the contrary, Y'. It doesn't name what it's contrasted against; compare *spre deosebire de* (next card), which always names the other source."
    example_gloss: "It is not expensive, on the contrary, it is affordable."
  ro.b2.unit08.lesson02.teach.spre_deosebire_de:
    title: "unlike..."
    gloss: "unlike [named source]... (contrasts two named things)"
    note: "*Spre deosebire de...* always names the person or source being contrasted (*spre deosebire de Ana*) -- unlike *dimpotrivă*, which stands alone after a negation."
  ro.b2.unit08.lesson02.teach.grammar_comparatie:
    title: "Ana is positive, whereas Diana is negative about the service. Unlike Ana, Diana considers the price high."
    gloss: "Ana is positive, whereas Diana is negative about the service. Unlike Ana, Diana considers the price high."
    note: "Comparing two sources side by side pairs a shared frame (*ambele*) with a contrast marker (*pe când*, *dimpotrivă*, *spre deosebire de*) that names exactly where the two views diverge."

  ro.b2.unit08.lesson03.teach.sunt_de_acord_ca:
    title: "they agree that..."
    gloss: "they agree that..."
  ro.b2.unit08.lesson03.teach.parerea:
    title: "the opinion"
    gloss: "the opinion"
    example_gloss: "Ana's opinion is clear."
  ro.b2.unit08.lesson03.teach.la_fel:
    title: "the same / likewise"
    gloss: "the same / likewise"
    example_gloss: "Both think the same."
  ro.b2.unit08.lesson03.teach.amandoua:
    title: both
    gloss: "both (feminine, amândouă)"
    example_gloss: "Both reviews are clear."
  ro.b2.unit08.lesson03.teach.grammar_acord:
    title: "Ana and Diana agree that the food is excellent. Both think the same about the food."
    gloss: "Ana and Diana agree that the food is excellent. Both think the same about the food."
    note: "Identifying agreement = naming the specific claim both sources share (*sunt de acord că*, *la fel*), not just saying they 'agree' in general."

  ro.b2.unit08.lesson04.teach.difera:
    title: differ
    gloss: "differ (from a difera)"
    example_gloss: "The opinions differ a lot."
  ro.b2.unit08.lesson04.teach.diferenta:
    title: "the difference"
    gloss: "the difference"
    example_gloss: "The difference is clear."
  ro.b2.unit08.lesson04.teach.se_contrazic:
    title: "they contradict each other"
    gloss: "they contradict each other"
    note: "*Se contrazic* is reflexive-reciprocal -- Ana and Diana contradict EACH OTHER, not a third party. English 'they contradict' alone leaves that ambiguous."
    example_gloss: "Ana and Diana contradict each other."
  ro.b2.unit08.lesson04.teach.in_privinta:
    title: "regarding..."
    gloss: "regarding... / concerning..."
  ro.b2.unit08.lesson04.teach.ieftin_scump:
    title: "cheap / expensive"
    gloss: "cheap / expensive"
    example_gloss: "A cheap price is good, an expensive price is not."
  ro.b2.unit08.lesson04.teach.grammar_conflict:
    title: "Regarding the price, Ana and Diana contradict each other. The difference is clear: Ana says cheap, Diana says expensive."
    gloss: "Regarding the price, Ana and Diana contradict each other. The difference is clear: Ana says cheap, Diana says expensive."
    note: "Identifying conflict = naming the EXACT point of disagreement (*în privința prețului*) and stating both opposing claims side by side, not just noting that a conflict exists."

  ro.b2.unit08.lesson05.teach.recenzia_anei:
    title: "Ana's review"
    gloss: "Ana's review: The food is excellent. The price is affordable. I recommend this restaurant."
    glosses:
      Recenzia: "the review"
      Anei: "of Ana / Ana's"
      Mâncarea: "the food"
      excelentă: excellent
      Prețul: "the price"
      accesibil: affordable
      Recomand: "I recommend"
      acest: this
      restaurant: restaurant
  ro.b2.unit08.lesson05.teach.recenzia_dianei:
    title: "Diana's review"
    gloss: "Diana's review: The food is excellent, but the service is slow. The price is high. I'm not convinced."
    glosses:
      Dianei: "of Diana / Diana's"
      dar: but
      serviciul: "the service"
      lent: slow
      mare: high
      Nu: not
      sunt: "I am"
      convinsă: convinced
  ro.b2.unit08.lesson05.teach.dovedit:
    title: "well-supported"
    gloss: "well-supported / proven"
    example_gloss: "It is well-supported."
  ro.b2.unit08.lesson05.teach.grammar_acord_conflict:
    title: "Both reviews agree that the food is excellent, but they conflict regarding the price."
    gloss: "Both reviews agree that the food is excellent, but they conflict regarding the price."
    note: "This is the synthesis move in one sentence: state the agreement, then the conflict, both named specifically."

  ro.b2.unit08.lesson06.teach.am_citit:
    title: "I've read both reviews."
    gloss: "I've read both reviews."
  ro.b2.unit08.lesson06.teach.deci:
    title: "so / therefore"
    gloss: "so / therefore"
    example_gloss: "So we agree."
  ro.b2.unit08.lesson06.teach.dialogue_mihai_read:
    title: "Mihai: I've read both reviews about the restaurant. Ana states that the food is excellent."
    gloss: "Mihai: I've read both reviews about the restaurant. Ana states that the food is excellent."
  ro.b2.unit08.lesson06.teach.dialogue_ana_confirm:
    title: "Ana: Yes, and the price is affordable."
    gloss: "Ana: Yes, and the price is affordable."
  ro.b2.unit08.lesson06.teach.dialogue_mihai_compare:
    title: "Mihai: Diana considers the same about the food, but says the service is slow."
    gloss: "Mihai: Diana considers the same about the food, but says the service is slow."
  ro.b2.unit08.lesson06.teach.dialogue_ana_agree:
    title: "Ana: So we agree about the food."
    gloss: "Ana: So we agree about the food."
  ro.b2.unit08.lesson06.teach.dialogue_mihai_conflict:
    title: "Mihai: Yes, but regarding the price, you and Diana contradict each other."
    gloss: "Mihai: Yes, but regarding the price, you and Diana contradict each other."
  ro.b2.unit08.lesson06.teach.grammar_sinteza:
    title: "Ana states that the food is excellent. Diana considers the same about the food. We agree about the food, but regarding the price we contradict each other."
    gloss: "Ana states that the food is excellent. Diana considers the same about the food. We agree about the food, but regarding the price we contradict each other."
    note: "This is what you produce in this lesson: attribute each claim to its source, then name the agreement AND the conflict explicitly -- the complete synthesis move."

