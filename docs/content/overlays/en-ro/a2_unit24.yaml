answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with
    comma-below ș/ț. Free-typed answers are graded against these
    standard spellings: the grader does not fold away omitted
    diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should
    type the full standard spelling.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    Fully formal dumneavoastră register throughout, continuing unit21/
    23's identical convention for a first meeting with a professional.
    "Vă doare"/"vă recomand" (formal "you") carry the register directly
    in their verb form.

course:
  title: "Romanian A2"
  description: >-
    Attending a doctor's appointment in Romanian -- De trei zile (for
    three days), Cât de tare? (how severely?), Vă recomand (I
    recommend), and Medicament (medication) -- as Ana describes a
    three-day headache to Doctorița Vasile.

units:
  ro.a2.unit24.la_doctor:
    title: "At the doctor"

lessons:
  ro.a2.unit24.lesson01.de_trei_zile:
    title: "My head has hurt for three days"
  ro.a2.unit24.lesson02.cat_de_tare:
    title: "How severely does it hurt?"
  ro.a2.unit24.lesson03.confirmarea_programarii:
    title: "The appointment confirmation"
  ro.a2.unit24.lesson04.la_cabinet:
    title: "At the doctor's office"

teaching:
  ro.a2.unit24.lesson01.teach.reminder_ma_doare_capul_bolnav_doctor:
    title: "Reminder: Mă doare capul, Bolnav, Doctor"
    gloss: "Bună ziua (good day, formal) · Mă doare capul (my head hurts) · Sunt bolnav (I am sick) · Un doctor (a doctor)"
    note: "Health vocabulary from A1, reused as the foundation for this unit's more detailed symptom descriptions."

  ro.a2.unit24.lesson01.teach.de_trei_zile_vocab:
    title: "For three days"
    gloss: "De trei zile (for three days)"
    note: "*De* + a time span states how long something has lasted -- it goes beyond a plain symptom statement like *mă doare capul*."
    example_gloss:
      - "My head has hurt for three days."

  ro.a2.unit24.lesson01.teach.ma_doare_de_trei_zile_phrase:
    title: "My head has hurt for three days."
    gloss: "Mă doare capul de trei zile."
    note: "Combines *mă doare capul* (my head hurts) with the duration phrase *de trei zile*. Romanian keeps the present tense here where English says 'has hurt'."

  ro.a2.unit24.lesson01.teach.doctorita_vocab:
    title: "Female doctor"
    gloss: "Doctoriță (female doctor)"
    note: "The feminine form of *doctor* -- used here since this unit's doctor character, Doctorița Vasile, is a woman."
    example_gloss:
      - "Good day, Doctor!"

  ro.a2.unit24.lesson02.teach.cat_de_tare_grammar:
    title: "Cât de tare (how severely)"
    gloss: "Cât de tare (how severely) · Vă (you, formal object)"
    note: "*Cât de* + adjective/adverb asks 'how [much/severely]' -- a new question pattern for this course."

  ro.a2.unit24.lesson02.teach.foarte_tare_vocab:
    title: "Very badly"
    gloss: "Foarte tare (very badly / very much)"
    note: "*Tare* here means 'severely/intensely' rather than its more literal 'hard/strong' sense -- a common idiomatic use with *doare*."
    example_gloss:
      - "It hurts very badly."

  ro.a2.unit24.lesson02.teach.mai_ales_dimineata_vocab:
    title: "Especially in the morning"
    gloss: "Mai ales (especially) · Dimineața (in the morning)"
    note: "*Mai ales* highlights when a symptom is worst -- useful detail a doctor would ask about."
    example_gloss:
      - "It hurts especially in the morning."

  ro.a2.unit24.lesson02.teach.cat_de_tare_va_doare_phrase:
    title: "How severely does it hurt?"
    gloss: "Cât de tare vă doare?"
    note: "The doctor's standard follow-up question about symptom severity."

  ro.a2.unit24.lesson02.teach.doare_foarte_tare_phrase:
    title: "It hurts very badly, especially in the morning."
    gloss: "Mă doare foarte tare, mai ales dimineața."
    note: "Combines this lesson's severity and timing vocabulary into a full, detailed symptom description."

  ro.a2.unit24.lesson03.teach.confirmata_vocab:
    title: "Confirmed"
    gloss: "Programarea dumneavoastră este confirmată (your appointment is confirmed) · Pentru (for)"
    note: "*Confirmată* is the feminine past-participle-as-adjective form, agreeing with feminine *programarea*."
    example_gloss:
      - "Your appointment is confirmed."

  ro.a2.unit24.lesson03.teach.miercuri_vocab:
    title: "Wednesday, eleven o'clock"
    gloss: "Miercuri (Wednesday) · Ora unsprezece (eleven o'clock) · La (with/at, for a person)"
    note: "*La* + a person's name/title states who the appointment is with, distinct from *la* meaning a physical location."
    example_gloss:
      - "The appointment is Wednesday, at eleven o'clock."

  ro.a2.unit24.lesson03.teach.mai_devreme_vocab:
    title: "Earlier"
    gloss: "Vă rugăm să veniți (please come, formal) · Cu cincisprezece minute mai devreme (fifteen minutes earlier)"
    note: "*Vă rugăm să* + verb is a formal written-request pattern, common on official confirmations."
    example_gloss:
      - "Please come fifteen minutes earlier."

  ro.a2.unit24.lesson03.teach.confirmare_reading:
    title: "An appointment confirmation"
    gloss: "Your appointment is confirmed for Wednesday, eleven o'clock, with Doctor Vasile. Please arrive fifteen minutes earlier."
    note: "A short official confirmation message combining this unit's time and instruction vocabulary."
    glosses:
      Programarea: "appointment"
      confirmată: "confirmed"
      miercuri: "Wednesday"
      ora: "o'clock / hour"
      unsprezece: "eleven"
      rugăm: "we ask / please (from a ruga)"
      veniți: "come (from a veni)"
      cincisprezece: "fifteen"
      minute: "minutes"
      devreme: "early"

  ro.a2.unit24.lesson04.teach.reminder_recomand_medicament_control:
    title: "New words: Vă recomand, Medicament, Control"
    gloss: "Vă recomand (I recommend, formal) · Odihnă (rest) · Medicament (medication) · Control (follow-up checkup)"
    note: "New treatment vocabulary -- *odihnă* (rest) you already know from A1, used here in a doctor's formal recommendation rather than a friend's casual advice."

  ro.a2.unit24.lesson04.teach.line01:
    title: "Greet the doctor and describe the symptom"
    gloss: "Ana greets the doctor and says her head has hurt for three days."
    note: "*Mă doare capul de trei zile* -- the duration sentence from the start of this unit."

  ro.a2.unit24.lesson04.teach.line02:
    title: "Ask about severity"
    gloss: "Doctorița Vasile greets Ana and asks how severely it hurts."
    note: "*Cât de tare vă doare?* -- the doctor's standard question about severity."

  ro.a2.unit24.lesson04.teach.line03:
    title: "Describe the severity and timing"
    gloss: "Ana says it hurts very badly, especially in the morning."
    note: "Severity (*foarte tare*) plus when it is worst (*mai ales dimineața*)."

  ro.a2.unit24.lesson04.teach.line04:
    title: "Give the recommendation"
    gloss: "The doctor says she understands, and recommends rest and this medication, twice a day, for five days."
    note: "*De două ori pe zi* (twice a day) and *timp de cinci zile* (for a period of five days) are new dosage-instruction patterns."

  ro.a2.unit24.lesson04.teach.line05:
    title: "Ask about a follow-up"
    gloss: "Ana asks if she needs to come back for a follow-up checkup."
    note: "*Trebuie să mă întorc* (I must come back) uses the same *trebuie să* + subjunctive pattern as *trebuie să completați* (you must fill in)."

  ro.a2.unit24.lesson04.teach.line06:
    title: "Give a conditional answer"
    gloss: "The doctor says only if the pain doesn't pass within five days."
    note: "*Doar dacă...* (only if...) attaches a condition to the answer; *durerea nu trece* means 'the pain does not go away'."

  ro.a2.unit24.lesson04.teach.line07:
    title: "Thank the doctor"
    gloss: "Ana thanks the doctor warmly."
    note: "*Mulțumesc mult* (thank you very much) -- the familiar warm thank-you."

  ro.a2.unit24.lesson04.teach.line08:
    title: "Close the visit"
    gloss: "The doctor says you're welcome, and wishes her a speedy recovery."
    note: "*Însănătoșire grabnică!* (Get well soon! / Speedy recovery!) is the standard Romanian well-wish for a patient leaving a consultation."

exercises:
  ro.a2.unit24.lesson01.exercise01.choose_de_trei_zile:
    instruction: "Which phrase means 'for three days'?"
    correct_option: "De trei zile"
    distractors: ["Bună ziua", "Cu plăcere"]
    accepted_answers: ["De trei zile"]

  ro.a2.unit24.lesson01.exercise02.choose_doctorita:
    instruction: "Which word means 'female doctor'?"
    correct_option: "Doctoriță"
    distractors: ["Bolnav", "Capul"]
    accepted_answers: ["Doctoriță"]

  ro.a2.unit24.lesson01.exercise03.listen_ma_doare_de_trei_zile:
    instruction: "Listen and select what you hear."
    correct_option: "Mă doare capul de trei zile"
    distractors: ["Cât de tare vă doare", "Mă doare foarte tare"]
    accepted_answers: ["Mă doare capul de trei zile"]

