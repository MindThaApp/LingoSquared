    accepted_answers:
      - "Mă doare foarte tare, mai ales dimineața."
      - "Mă doare foarte tare mai ales dimineața."
      - "Doare foarte tare, mai ales dimineața."
      - "Mai ales dimineața mă doare foarte tare."

  ro.a2.unit24.lesson03.exercise01.read_appointment_time:
    instruction: "Read the confirmation. When is the appointment?"
    correct_option: "Miercuri, ora unsprezece."
    distractors:
      - "Joi, ora nouă."
    accepted_answers:
