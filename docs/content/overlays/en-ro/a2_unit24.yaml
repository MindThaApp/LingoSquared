schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a2_unit24_la_doctor.yaml for full
    detail. Reuses unit16's own already-source-adapted A1 health
    vocabulary (mă doare, capul, bolnav, doctor) as the foundation;
    this unit's new duration/severity/treatment vocabulary is authored
    fresh from general standard Romanian knowledge, since the Peace
    Corps Moldova PDF has no dedicated doctor-appointment lesson beyond
    what unit16 already adapted. Glosses/notes here are freshly
    authored to explain the target-language forms to an English
    speaker.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Fourth Romanian A2 overlay, authored alongside the paired
    realization. correct_response/accepted_answers shapes checked to
    match the realization's word_bank/pairs (exact token-multiset
    agreement for both word_order exercises and the two listen_order
    exercises) per the standing validate_order_word_bank_answers
    compiler check. Multi-clause accepted_answers checked against
    AUTHORING_GUIDE #12 for period/comma/conjunction-joined variants.

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț). For
    free-typed A2 answers, accept otherwise-correct forms with the
    diacritics omitted or with the legacy cedilla variants ş/ţ
    substituted for ș/ț, matching units 01-23's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    Fully formal dumneavoastră register throughout, continuing unit21/
    23's identical convention for a first meeting with a professional.
    "Vă doare"/"vă recomand" (formal "you") carry the register directly
    in their verb form.

course:
  title: "Romanian A2"
  description: >-
    Attending a doctor's appointment in Romanian -- De trei zile (for
    three days), Cât de tare? (how severely?), Vă recomand (I
    recommend), and Medicament (medication) -- as Ana describes a
    three-day headache to Doctorița Vasile.

units:
  ro.a2.unit24.la_doctor:
    title: "At the doctor"

lessons:
  ro.a2.unit24.lesson01.de_trei_zile:
    title: "My head has hurt for three days"
  ro.a2.unit24.lesson02.cat_de_tare:
    title: "How severely does it hurt?"
  ro.a2.unit24.lesson03.confirmarea_programarii:
    title: "The appointment confirmation"
  ro.a2.unit24.lesson04.la_cabinet:
    title: "At the doctor's office"

teaching:
  ro.a2.unit24.lesson01.teach.reminder_ma_doare_capul_bolnav_doctor:
    title: "Reminder: Mă doare capul, Bolnav, Doctor"
    gloss: "Bună ziua (good day, formal) · Mă doare capul (my head hurts) · Sunt bolnav (I am sick) · Un doctor (a doctor)"
    note: "From unit16's own A1 health vocabulary, reused as the foundation for this unit's A2 extension."

  ro.a2.unit24.lesson01.teach.de_trei_zile_vocab:
    title: "For three days"
    gloss: "De trei zile (for three days)"
    note: "*De* + a time span states duration -- new A2 grammar this unit, distinct from unit16's plain present-tense symptom statement."
    example_gloss:
      - "My head has hurt for three days."

  ro.a2.unit24.lesson01.teach.ma_doare_de_trei_zile_phrase:
    title: "My head has hurt for three days."
    gloss: "Mă doare capul de trei zile."
    note: "Combines unit16's own *mă doare capul* with this lesson's new duration phrase -- the core A2 depth extension this unit targets."

  ro.a2.unit24.lesson01.teach.doctorita_vocab:
    title: "Female doctor"
    gloss: "Doctoriță (female doctor)"
    note: "The feminine form of *doctor* -- used here since this unit's doctor character, Doctorița Vasile, is a woman."
    example_gloss:
      - "Good day, Doctor!"

  ro.a2.unit24.lesson02.teach.cat_de_tare_grammar:
    title: "Cât de tare (how severely)"
    gloss: "Cât de tare (how severely) · Vă (you, formal object)"
    note: "*Cât de* + adjective/adverb asks 'how [much/severely]' -- a new question pattern for this course."

  ro.a2.unit24.lesson02.teach.foarte_tare_vocab:
    title: "Quite severely"
    gloss: "Foarte tare (quite severely / very hard)"
    note: "*Tare* here means 'severely/intensely' rather than its more literal 'hard/strong' sense -- a common idiomatic use with *doare*."
    example_gloss:
      - "It hurts quite severely."

  ro.a2.unit24.lesson02.teach.mai_ales_dimineata_vocab:
    title: "Especially in the morning"
    gloss: "Mai ales (especially) · Dimineața (in the morning)"
    note: "*Mai ales* highlights when a symptom is worst -- useful detail a doctor would ask about."
    example_gloss:
      - "It hurts especially in the morning."

  ro.a2.unit24.lesson02.teach.cat_de_tare_va_doare_phrase:
    title: "How severely does it hurt?"
    gloss: "Cât de tare vă doare?"
    note: "The doctor's standard follow-up question about symptom severity."

  ro.a2.unit24.lesson02.teach.doare_foarte_tare_phrase:
    title: "It hurts quite severely, especially in the morning."
    gloss: "Mă doare foarte tare, mai ales dimineața."
    note: "Combines this lesson's severity and timing vocabulary into the full detailed symptom description this unit's spine outcome targets."

  ro.a2.unit24.lesson03.teach.confirmata_vocab:
    title: "Confirmed"
    gloss: "Programarea dumneavoastră este confirmată (your appointment is confirmed) · Pentru (for)"
    note: "*Confirmată* is the feminine past-participle-as-adjective form, agreeing with feminine *programarea*."
    example_gloss:
      - "Your appointment is confirmed."

  ro.a2.unit24.lesson03.teach.miercuri_vocab:
    title: "Wednesday, eleven o'clock"
    gloss: "Miercuri (Wednesday) · Ora unsprezece (eleven o'clock) · La (with/at, for a person)"
    note: "*La* + a person's name/title states who the appointment is with, distinct from *la* meaning a physical location."
    example_gloss:
      - "The appointment is Wednesday, at eleven o'clock."

  ro.a2.unit24.lesson03.teach.mai_devreme_vocab:
    title: "Earlier"
    gloss: "Vă rugăm să veniți (please come, formal) · Cu cincisprezece minute mai devreme (fifteen minutes earlier)"
    note: "*Vă rugăm să* + verb is a formal written-request pattern, common on official confirmations."
    example_gloss:
      - "Please come fifteen minutes earlier."

  ro.a2.unit24.lesson03.teach.confirmare_reading:
    title: "An appointment confirmation"
    gloss: "Your appointment is confirmed for Wednesday, eleven o'clock, with Doctor Vasile. Please arrive fifteen minutes earlier."
    note: "A short official confirmation message combining this unit's time and instruction vocabulary -- the reading half of this unit's spine outcome."
    glosses:
      Programarea: "appointment"
      confirmată: "confirmed"
      miercuri: "Wednesday"
      ora: "o'clock / hour"
      unsprezece: "eleven"
      rugăm: "we ask / please (from a ruga)"
      veniți: "come (from a veni)"
      cincisprezece: "fifteen"
      minute: "minutes"
      devreme: "early"

  ro.a2.unit24.lesson04.teach.reminder_recomand_medicament_control:
    title: "Reminder: Vă recomand, Medicament, Control"
    gloss: "Vă recomand (I recommend, formal) · Odihnă (rest) · Medicament (medication) · Control (follow-up checkup)"
    note: "New treatment vocabulary this unit -- *odihnă* was already introduced in unit16, reused here in a doctor's formal recommendation rather than a friend's casual advice."

  ro.a2.unit24.lesson04.teach.line01:
    title: "Greet the doctor and describe the symptom"
    gloss: "Ana greets the doctor and says her head has hurt for three days."
    note: "Reuses this unit's own lesson01 phrase exactly."

  ro.a2.unit24.lesson04.teach.line02:
    title: "Ask about severity"
    gloss: "Doctorița Vasile greets Ana and asks how severely it hurts."
    note: "Reuses this unit's own lesson02 phrase exactly."

  ro.a2.unit24.lesson04.teach.line03:
    title: "Describe the severity and timing"
    gloss: "Ana says it hurts quite severely, especially in the morning."
    note: "Reuses this unit's own lesson02 phrase exactly."

  ro.a2.unit24.lesson04.teach.line04:
    title: "Give the recommendation"
    gloss: "The doctor says she understands, and recommends rest and this medication, twice a day, for five days."
    note: "*De două ori pe zi* (twice a day) and *timp de cinci zile* (for a period of five days) are new dosage-instruction patterns."

  ro.a2.unit24.lesson04.teach.line05:
    title: "Ask about a follow-up"
    gloss: "Ana asks if she needs to come back for a follow-up checkup."
    note: "*Trebuie să mă întorc* (I must come back) reuses the *trebuie să* + subjunctive pattern from unit21's own *trebuie să completați*."

  ro.a2.unit24.lesson04.teach.line06:
    title: "Give a conditional answer"
    gloss: "The doctor says only if the pain doesn't pass within five days."
    note: "*Doar dacă...* (only if...) is a new conditional connector, distinct from unit21/22's *dacă*-free constructions so far."

  ro.a2.unit24.lesson04.teach.line07:
    title: "Thank the doctor"
    gloss: "Ana thanks the doctor warmly."
    note: "Reuses unit01's own *mulțumesc mult* closing pattern."

  ro.a2.unit24.lesson04.teach.line08:
    title: "Close the visit"
    gloss: "The doctor says you're welcome, and wishes her a speedy recovery."
    note: "*Însănătoșire grabnică!* (Get well soon! / Speedy recovery!) is the standard Romanian well-wish for a patient leaving a consultation."

exercises:
  ro.a2.unit24.lesson01.exercise01.choose_de_trei_zile:
    instruction: "Which phrase means 'for three days'?"
    correct_option: "De trei zile"
    distractors: ["Foarte tare", "Cu plăcere"]
    accepted_answers: ["De trei zile"]

  ro.a2.unit24.lesson01.exercise02.choose_doctorita:
    instruction: "Which word means 'female doctor'?"
    correct_option: "Doctoriță"
    distractors: ["Bolnav", "Medicament"]
    accepted_answers: ["Doctoriță"]

  ro.a2.unit24.lesson01.exercise03.listen_ma_doare_de_trei_zile:
    instruction: "Listen and select what you hear."
    correct_option: "Mă doare capul de trei zile"
    distractors: ["Cât de tare vă doare?", "Mă doare foarte tare."]
    accepted_answers: ["Mă doare capul de trei zile"]

  ro.a2.unit24.lesson01.exercise04.match_doctor1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "De trei zile": "for three days"
      "Mă doare capul.": "My head hurts."
      "Doctoriță": "female doctor"
      "Bolnav": "sick"
      "Mă doare capul de trei zile.": "My head has hurt for three days."
      "Bună ziua, Doctoriță!": "Good day, Doctor!"

  ro.a2.unit24.lesson01.exercise05.order_ma_doare_de_trei_zile:
    instruction: "Build the sentence: My head has hurt for three days."
    correct_response: ["Mă", "doare", "capul", "de", "trei", "zile"]

  ro.a2.unit24.lesson01.exercise06.listen_order_ma_doare_de_trei_zile:
    instruction: "Listen, then put the words in order."
    correct_response: ["Mă", "doare", "capul", "de", "trei", "zile"]

  ro.a2.unit24.lesson01.exercise07.complete_ma_doare_de_trei_zile:
    instruction: "Complete the sentence, three days: Mă doare capul de ___ zile."
    accepted_answers: ["trei", "Trei"]
    feedback: "De *trei* zile -- 'for three days,' stating how long the symptom has lasted."

  ro.a2.unit24.lesson01.exercise08.speak_ma_doare_de_trei_zile:
    instruction: "Say aloud: My head has hurt for three days."
    accepted_answers:
      - "Mă doare capul de trei zile."
      - "Mă doare capul de trei zile"

  ro.a2.unit24.lesson02.exercise01.choose_foarte_tare:
    instruction: "Which phrase means 'quite severely'?"
    correct_option: "Foarte tare"
    distractors: ["De trei zile", "Mai devreme"]
    accepted_answers: ["Foarte tare"]

  ro.a2.unit24.lesson02.exercise02.choose_dimineata:
    instruction: "Which word means 'morning'?"
    correct_option: "Dimineața"
    distractors: ["Miercuri", "Control"]
    accepted_answers: ["Dimineața"]

  ro.a2.unit24.lesson02.exercise03.listen_cat_de_tare:
    instruction: "Listen and select what you hear."
    correct_option: "Cât de tare vă doare"
    distractors: ["Mă doare capul de trei zile.", "Vă recomand odihnă."]
    accepted_answers: ["Cât de tare vă doare"]

  ro.a2.unit24.lesson02.exercise04.match_doctor2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Cât de tare?": "How severely?"
      "Foarte tare": "quite severely"
      "Mai ales dimineața": "especially in the morning"
      "De trei zile": "for three days"
      "Mă doare capul.": "My head hurts."
      "Cât de tare vă doare?": "How severely does it hurt?"

  ro.a2.unit24.lesson02.exercise05.order_cat_de_tare_va_doare:
    instruction: "Build the question: How severely does it hurt?"
    correct_response: ["Cât", "de", "tare", "vă", "doare"]

  ro.a2.unit24.lesson02.exercise06.listen_order_doare_foarte_tare:
    instruction: "Listen, then put the words in order."
    correct_response: ["Mă", "doare", "foarte", "tare"]

  ro.a2.unit24.lesson02.exercise07.complete_doare_foarte_tare:
    instruction: "Complete the sentence, quite severely: Mă doare foarte ___, mai ales dimineața."
    accepted_answers: ["tare", "Tare"]
    feedback: "Foarte *tare* -- here meaning 'severely,' describing the intensity of the pain."

  ro.a2.unit24.lesson02.exercise08.translate_it_hurts_severely:
    instruction: "Translate into Romanian."
    accepted_answers:
      - "Mă doare foarte tare, mai ales dimineața."
      - "Mă doare foarte tare mai ales dimineața."

  ro.a2.unit24.lesson03.exercise01.read_appointment_time:
    instruction: "Read the confirmation. When is the appointment?"
    correct_option: "Miercuri, ora unsprezece."
    distractors:
      - "Joi, ora nouă."
    accepted_answers:
      - "Miercuri, ora unsprezece."

  ro.a2.unit24.lesson03.exercise02.read_arrival_instruction:
    instruction: "Read the confirmation. How early should the patient arrive?"
    correct_option: "Cu cincisprezece minute mai devreme."
    distractors:
      - "Cu o oră mai devreme."
    accepted_answers:
      - "Cu cincisprezece minute mai devreme."

  ro.a2.unit24.lesson03.exercise03.listen_confirmare:
    instruction: "Listen and select what you hear."
    correct_option: "Programarea dumneavoastră este confirmată pentru miercuri"
    distractors: ["Mă doare capul de trei zile.", "Vă recomand odihnă și acest medicament."]
    accepted_answers: ["Programarea dumneavoastră este confirmată pentru miercuri"]

  ro.a2.unit24.lesson03.exercise04.match_confirmare:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Confirmată": "confirmed"
      "Miercuri, ora unsprezece": "Wednesday, eleven o'clock"
      "Mai devreme": "earlier"
      "Doctorița Vasile": "Doctor Vasile"
      "Cincisprezece minute": "fifteen minutes"

  ro.a2.unit24.lesson03.exercise05.complete_mai_devreme:
    instruction: "Complete the sentence, fifteen minutes: Vă rugăm să veniți cu ___ minute mai devreme."
    accepted_answers: ["cincisprezece", "Cincisprezece"]
    feedback: "Cu *cincisprezece* minute mai devreme -- 'fifteen' minutes earlier than the appointment time."

  ro.a2.unit24.lesson03.exercise06.write_appointment_request:
    instruction: "Write a short formal message requesting an appointment and briefly describing your symptom."
    accepted_answers:
      - "Mă doare capul de trei zile. Aș dori o programare."
      - "Aș dori o programare, pentru că mă doare capul de trei zile."

  ro.a2.unit24.lesson04.exercise01.choose_who_recommends_treatment:
    instruction: "Who says this line?"
    correct_option: "Doctorița Vasile"
    distractors: ["Ana"]
    accepted_answers: ["Doctorița Vasile"]

  ro.a2.unit24.lesson04.exercise02.dialogue_comprehend_symptom:
    instruction: "Listen to the dialogue. What is Ana's symptom, and how long has she had it?"
    correct_option: "O durere de cap, de trei zile."
    distractors: ["O durere de stomac, de o săptămână."]
    accepted_answers: ["O durere de cap, de trei zile."]

  ro.a2.unit24.lesson04.exercise03.dialogue_comprehend_treatment:
    instruction: "Listen to the dialogue. What treatment does the doctor recommend, and how often?"
    correct_option: "Odihnă și medicament, de două ori pe zi."
    distractors: ["Doar odihnă, o dată pe săptămână."]
    accepted_answers: ["Odihnă și medicament, de două ori pe zi."]

  ro.a2.unit24.lesson04.exercise04.dialogue_comprehend_followup:
    instruction: "Listen to the dialogue. When does Ana need to come back for a follow-up?"
    correct_option: "Doar dacă durerea nu trece în cinci zile."
    distractors: ["Mâine, indiferent de rezultat."]
    accepted_answers: ["Doar dacă durerea nu trece în cinci zile."]

  ro.a2.unit24.lesson04.exercise05.order_va_recomand_odihna:
    instruction: "Build the sentence: I recommend rest and this medication."
    correct_response: ["Vă", "recomand", "odihnă", "și", "acest", "medicament"]

  ro.a2.unit24.lesson04.exercise06.respond_as_ana:
    instruction: "Take Ana's role. The doctor gives her recommendation -- ask if you need to come back for a follow-up checkup."
    accepted_answers:
      - "Trebuie să mă întorc pentru un control?"
      - "Trebuie sa ma intorc pentru un control?"

  ro.a2.unit24.lesson04.exercise07.write_visit_summary:
    instruction: "Write a short sentence summarizing Ana's doctor visit, using at least one word from this unit."
    accepted_answers:
      - "Ana a mers la Doctorița Vasile cu o durere de cap de trei zile."
      - "Doctorița Vasile i-a recomandat odihnă și medicament."
      - "Ana trebuie să ia medicamentul de două ori pe zi, timp de cinci zile."
