    correct_option: "Doar dacă durerea nu trece în cinci zile."
    distractors: ["Miercuri, ora unsprezece."]
    accepted_answers: ["Doar dacă durerea nu trece în cinci zile."]

  ro.a2.unit24.lesson04.exercise05.order_va_recomand_odihna:
    instruction: "Build the sentence: I recommend rest and this medication."
    correct_response: ["Vă", "recomand", "odihnă", "și", "acest", "medicament"]

  ro.a2.unit24.lesson04.exercise06.respond_as_ana:
    instruction: "Take Ana's role. The doctor gives her recommendation -- ask if you need to come back for a follow-up checkup."
    accepted_answers:
      - "Trebuie să mă întorc pentru un control?"
      - "Trebuie sa ma intorc pentru un control?"

  ro.a2.unit24.lesson04.exercise07.write_visit_summary:
    instruction: "Write: My head has hurt for three days."
    accepted_answers:
      - "Mă doare capul de trei zile."

  ro.a2.unit24.lesson02.exercise09.dictation_cat_de_tare_va_doare:
    instruction: "Type what you hear."
    correct_option: "Cât de tare vă doare"
    accepted_answers: [{value: "Cât de tare vă doare", status: correct}]
