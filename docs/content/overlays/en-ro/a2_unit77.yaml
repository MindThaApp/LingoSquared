  learning_goal: "Talk about the past in Romanian with the right forms and time words."
units:
  ro.a2.unit77.o_dimineata_aglomerata: {"title": "A Busy Morning", "description": "Describe step by step how your morning went, from getting up to arriving, with the perfect compus and reflexive verbs."}
lessons:
  ro.a2.unit77.lesson01.am_luat_micul_dejun: {"title": "I Had Breakfast"}
  ro.a2.unit77.lesson02.m_am_trezit: {"title": "I Woke Up"}
  ro.a2.unit77.lesson03.de_obicei_sau_azi: {"title": "Usually or Today"}
  ro.a2.unit77.lesson04.participii_neregulate: {"title": "Irregular Participles"}
  ro.a2.unit77.lesson05.mesajul_lui_mihai: {"title": "Mihai's Message"}
  ro.a2.unit77.lesson06.ana_si_mihai_vorbesc: {"title": "Ana and Mihai Talk"}
teaching:
  ro.a2.unit77.lesson01.teach.verbe: {"title": "Morning verbs", "gloss": "to have breakfast / to leave / to arrive / to eat / to finish", "note": "These infinitives name steps of a morning. Each one forms its past with a short form of *a avea* plus a participle.", "example_gloss": ["This morning I had breakfast at home.", "Mihai left at eight.", "We left at seven.", "I arrived at the office at nine.", "I ate quickly.", "Ana finished early."]}
  ro.a2.unit77.lesson01.teach.timp: {"title": "Time words", "gloss": "this morning / first / then / after that / at last", "note": "These words put the steps of the morning in order.", "example_gloss": ["First I ate.", "Then I left home.", "After that I took the bus.", "At last I have arrived!"]}
  ro.a2.unit77.lesson01.teach.gn_auxiliar: {"title": "The auxiliary: am, ai, a, am, ați, au", "gloss": "I have, you have, he has, she has, we have, you (plural) have, they have, they (f.) have", "note": "The perfect compus is the everyday Romanian past. It is built with a short form of *a avea* (to have) plus a participle. Notice that *am* is both 'I' and 'we', and *a* is both 'he' and 'she'."}
  ro.a2.unit77.lesson01.teach.gn_participiu: {"title": "The participle", "gloss": "to leave, left. to arrive, arrived. to eat, eaten. to finish, finished", "note": "The participle after *am, ai, a, am, ați, au* never changes for gender or number: *Ana a plecat*, *Mihai a plecat*, *am plecat*. Verbs in -a end in -at; many verbs in -i end in -it; some verbs are irregular and are learned one by one."}
  ro.a2.unit77.lesson01.teach.frazele: {"title": "Three sentences", "gloss": "I ate quickly. Ana left early. I arrived at the office."}
  ro.a2.unit77.lesson02.teach.verbe_reflexive: {"title": "Reflexive morning verbs", "gloss": "to wake up / to wash / to get dressed / to comb one's hair / to go to bed", "note": "Verbs with *se* are reflexive: the action returns to the person. *A se spăla pe dinți* means to brush your teeth.", "example_gloss": ["I woke up early.", "You brushed your teeth.", "Ana combed her hair.", "Mihai got dressed.", "We went to bed late."]}
  ro.a2.unit77.lesson02.teach.gn_pronume: {"title": "Reflexive pronoun before the auxiliary", "gloss": "I woke up, you woke up, he/she woke up, we woke up, you (plural) woke up, they woke up", "note": "The short pronoun (*mă, te, se, ne, vă, se*) comes before the auxiliary and joins it with a hyphen: *m-am*, *te-ai*, *s-a*, *ne-am*, *v-ați*, *s-au*. It never goes between the auxiliary and the participle."}
  ro.a2.unit77.lesson02.teach.gn_negatie: {"title": "Negative sentences", "gloss": "I haven't washed. Mihai hasn't combed his hair. We haven't got dressed yet.", "note": "*Nu* goes at the very front, before the pronoun: *nu m-am spălat*. *Încă nu* means 'not yet'."}
  ro.a2.unit77.lesson02.teach.fr_intrebare: {"title": "Questions", "gloss": "Did you wake up early? What time did you wake up?", "note": "In a question the order stays the same: pronoun, auxiliary, participle."}
  ro.a2.unit77.lesson03.teach.contrast: {"title": "Contrast words", "gloss": "usually / always / yesterday / today / already / not yet", "note": "*De obicei* and *mereu* go with the present tense for habits; *ieri*, *azi* and *deja* go with the perfect compus.", "example_gloss": ["I usually get up at seven.", "I always have breakfast at home.", "Yesterday I got up late.", "I have already had breakfast.", "Today I got up early."]}
  ro.a2.unit77.lesson03.teach.gn_prezent: {"title": "Present for habits, perfect compus for this morning", "gloss": "I usually get up at seven. This morning I got up at six.", "note": "Use the present tense for what you usually do. Use the perfect compus for something that already happened."}
  ro.a2.unit77.lesson03.teach.gn_ieri: {"title": "Today and yesterday: same tense", "gloss": "Today I got up early. Yesterday I got up late.", "note": "Spoken Romanian uses the perfect compus for both today and yesterday. Unlike some other languages, you do not switch to another past tense when the day is over."}
  ro.a2.unit77.lesson03.teach.gn_deja: {"title": "Deja and încă nu", "gloss": "I have already washed. I haven't had breakfast yet.", "note": "*Deja* means 'already' and *încă nu* means 'not yet'. *Deja* can also come after the participle: *m-am spălat deja*."}
  ro.a2.unit77.lesson04.teach.neregulate: {"title": "Verbs with irregular participles", "gloss": "to do, make / to see / to write / to go / to come / to drink / to read / to open", "note": "These verbs have participles that you must learn one by one.", "example_gloss": ["I made coffee.", "Have you seen my keys?", "Mihai opened the window.", "I wrote a message.", "I drank coffee.", "I came by bus."]}
  ro.a2.unit77.lesson04.teach.gn_participii: {"title": "Ten participles", "gloss": "to do, done. to see, seen. to write, written. to go, gone. to come, come. to take, taken. to drink, drunk. to read, read. to open, opened. to leave, left", "note": "Some of these end in -s or -t in an irregular way (*scris*, *mers*, *deschis*, *făcut*, *băut*). They work with *am, ai, a, am, ați, au* exactly like the regular ones, and they never agree with the subject: *Ana a scris*, *Mihai a scris*."}
  ro.a2.unit77.lesson04.teach.obiecte: {"title": "Things in the morning", "gloss": "coffee / window / the keys / message / bus / office", "note": "*Cu autobuzul* means 'by bus'.", "example_gloss": ["Mihai went to the office by bus.", "I wrote a message.", "She made coffee.", "Have you seen my keys?", "Mihai opened the window."]}
  ro.a2.unit77.lesson04.teach.gn_secventa: {"title": "Telling the steps in order", "gloss": "First I washed, then I had breakfast and after that I left home.", "note": "Link the steps with *mai întâi*, *apoi*, *după aceea* and *și*. Each step keeps its own auxiliary."}
  ro.a2.unit77.lesson05.teach.cuvinte: {"title": "Words for the message", "gloss": "busy / quickly / what / how / very", "note": "*Aglomerată* is feminine because *dimineață* is feminine. *Ce* in an exclamation means 'what a'.", "example_gloss": ["What a busy morning!", "I ate quickly.", "How was your morning?", "It was very busy."]}
  ro.a2.unit77.lesson05.teach.gn_fost: {"title": "How was your morning?", "gloss": "How was your morning? It was very busy.", "note": "*Fost* is the participle of *a fi* (to be). It is irregular and worth learning as a set phrase."}
  ro.a2.unit77.lesson05.teach.fr_intrebari: {"title": "Useful questions", "gloss": "What did you do? What time did you arrive? How did you come?", "note": "Question words come first and the rest keeps the same order: auxiliary plus participle."}
  ro.a2.unit77.lesson05.teach.lectura: {"title": "Mihai writes to Ana", "gloss": "Hi, Ana! What a busy morning! I got up late and I didn't have breakfast. I washed quickly and got dressed. I went to the office by bus and arrived at nine. I haven't opened my messages yet, but I have already made coffee. And you? How was your morning?", "note": "Notice how Mihai tells the steps in order and uses *deja* and *încă nu*.", "glosses": {"aglomerată": "busy", "repede": "quickly", "mesajele": "the messages", "încă": "yet, still"}}
  ro.a2.unit77.lesson06.teach.d1: {"title": "Ana asks", "gloss": "Ana: Hi, Mihai! How was your morning?"}
  ro.a2.unit77.lesson06.teach.d2: {"title": "Mihai answers", "gloss": "Mihai: Very busy. I got up late and I didn't have breakfast."}
  ro.a2.unit77.lesson06.teach.d3: {"title": "Ana asks about the trip", "gloss": "Ana: How did you get to the office?"}
  ro.a2.unit77.lesson06.teach.d4: {"title": "Mihai describes the trip", "gloss": "Mihai: I went by bus and I arrived at nine."}
  ro.a2.unit77.lesson06.teach.d5: {"title": "Ana asks about coffee", "gloss": "Ana: Have you made coffee already?"}
  ro.a2.unit77.lesson06.teach.d6: {"title": "Mihai offers", "gloss": "Mihai: Yes, I have already made coffee. Do you want a coffee?"}
exercises:
  ro.a2.unit77.lesson01.exercise01.alege_micul_dejun: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Azi dimineață am luat micul dejun acasă.", "distractors": ["Azi dimineață ai luat micul dejun acasă.", "Azi dimineață au luat micul dejun acasă.", "Azi dimineață am lua micul dejun acasă."], "accepted_answers": [{"value": "Azi dimineață am luat micul dejun acasă.", "status": "correct"}], "feedback": "With *eu* the helper is *am*, and the participle of *a lua* is *luat*."}
  ro.a2.unit77.lesson01.exercise02.alege_plecat: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Am plecat la șapte.", "distractors": ["Ai plecat la șapte.", "Au plecat la șapte.", "Am pleca la șapte."], "accepted_answers": [{"value": "Am plecat la șapte.", "status": "correct"}], "feedback": "*Am* goes with *noi* (and with *eu*), and *a pleca* gives *plecat*."}
  ro.a2.unit77.lesson01.exercise03.potriveste_pasii: {"instruction": "Match each Romanian word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "a pleca", "right": "to leave"}, {"left": "a ajunge", "right": "to arrive"}, {"left": "a mânca", "right": "to eat"}, {"left": "a termina", "right": "to finish"}, {"left": "mai întâi", "right": "first"}, {"left": "apoi", "right": "then"}, {"left": "după aceea", "right": "after that"}, {"left": "în sfârșit", "right": "at last"}], "status": "correct"}], "feedback": "These are the steps of a morning."}
  ro.a2.unit77.lesson01.exercise04.ordoneaza_plecat: {"instruction": "Put the words in order to say 'Ana left early.'", "correct_option": "Ana a plecat devreme", "accepted_answers": [{"value": "Ana a plecat devreme", "status": "correct"}], "feedback": "*Ana a plecat devreme*: the helper *a* comes before the participle."}
  ro.a2.unit77.lesson01.exercise05.completeaza_a: {"instruction": "Complete with the correct auxiliary for Mihai.", "correct_option": "a", "accepted_answers": [{"value": "a", "status": "correct"}], "feedback": "*Mihai a plecat*: *el* and *ea* use *a*."}
  ro.a2.unit77.lesson01.exercise06.tradu_micul_dejun: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Am luat micul dejun.", "status": "correct"}, {"value": "Am luat micul dejun", "status": "correct"}, {"value": "Eu am luat micul dejun.", "status": "correct"}, {"value": "Eu am luat micul dejun", "status": "correct"}], "feedback": "*Am luat micul dejun* = I had breakfast (I have had breakfast)."}
  ro.a2.unit77.lesson01.exercise07.scrie_ajuns: {"instruction": "Write the requested Romanian sentence with *în sfârșit*.", "accepted_answers": [{"value": "În sfârșit am ajuns.", "status": "correct"}, {"value": "În sfârșit am ajuns", "status": "correct"}, {"value": "În sfârșit, am ajuns.", "status": "correct"}, {"value": "În sfârșit, am ajuns", "status": "correct"}, {"value": "Am ajuns în sfârșit.", "status": "correct"}, {"value": "Am ajuns în sfârșit", "status": "correct"}, {"value": "În sfârșit, am ajuns!", "status": "correct"}, {"value": "În sfârșit am ajuns!", "status": "correct"}], "feedback": "*În sfârșit am ajuns* = At last I have arrived.", "correct_option": "În sfârșit am ajuns."}
  ro.a2.unit77.lesson02.exercise01.alege_pronumele: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "M-am trezit devreme.", "distractors": ["Te-ai trezit devreme.", "S-a trezit devreme.", "Mă trezit devreme."], "accepted_answers": [{"value": "M-am trezit devreme.", "status": "correct"}], "feedback": "The pronoun comes before the auxiliary: *m-am trezit*."}
  ro.a2.unit77.lesson02.exercise02.alege_intrebarea: {"instruction": "Choose the correct Romanian question.", "correct_option": "Te-ai îmbrăcat?", "distractors": ["M-am îmbrăcat?", "S-a îmbrăcat?", "Ne-am îmbrăcat?"], "accepted_answers": [{"value": "Te-ai îmbrăcat?", "status": "correct"}], "feedback": "*Te-ai* goes with *tu*: *Te-ai îmbrăcat?*"}
  ro.a2.unit77.lesson02.exercise03.potriveste_frazele: {"instruction": "Match each Romanian sentence to its meaning.", "accepted_answers": [{"value": [{"left": "M-am trezit.", "right": "I woke up."}, {"left": "Te-ai spălat pe dinți.", "right": "You brushed your teeth."}, {"left": "Ana s-a pieptănat.", "right": "Ana combed her hair."}, {"left": "Ne-am culcat târziu.", "right": "We went to bed late."}, {"left": "Nu m-am spălat.", "right": "I haven't washed."}, {"left": "Mihai s-a îmbrăcat.", "right": "Mihai got dressed."}], "status": "correct"}], "feedback": "Pronoun, auxiliary, participle."}
  ro.a2.unit77.lesson02.exercise04.ordoneaza_imbracat: {"instruction": "Put the words in order to say 'Mihai hasn't got dressed.'", "correct_option": "Mihai nu s-a îmbrăcat", "accepted_answers": [{"value": "Mihai nu s-a îmbrăcat", "status": "correct"}], "feedback": "*Nu* comes before the pronoun *s-a*."}
  ro.a2.unit77.lesson02.exercise05.completeaza_s_a: {"instruction": "Complete with the reflexive pronoun and auxiliary for Ana.", "correct_option": "s-a", "accepted_answers": [{"value": "s-a", "status": "correct"}], "feedback": "*Ana s-a pieptănat*: *ea* takes *s-a*."}
  ro.a2.unit77.lesson02.exercise06.tradu_culcat: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Ne-am culcat târziu.", "status": "correct"}, {"value": "Ne-am culcat târziu", "status": "correct"}, {"value": "Noi ne-am culcat târziu.", "status": "correct"}, {"value": "Noi ne-am culcat târziu", "status": "correct"}], "feedback": "*Ne-am culcat târziu*: pronoun *ne* with auxiliary *am*."}
  ro.a2.unit77.lesson02.exercise07.scrie_inca_nu: {"instruction": "Write the requested Romanian sentence with *încă nu*.", "accepted_answers": [{"value": "Încă nu m-am îmbrăcat.", "status": "correct"}, {"value": "Încă nu m-am îmbrăcat", "status": "correct"}, {"value": "Nu m-am îmbrăcat încă.", "status": "correct"}, {"value": "Nu m-am îmbrăcat încă", "status": "correct"}, {"value": "Eu încă nu m-am îmbrăcat.", "status": "correct"}, {"value": "Eu încă nu m-am îmbrăcat", "status": "correct"}, {"value": "Eu nu m-am îmbrăcat încă.", "status": "correct"}, {"value": "Eu nu m-am îmbrăcat încă", "status": "correct"}], "feedback": "*Încă nu m-am îmbrăcat* = I haven't got dressed yet.", "correct_option": "Încă nu m-am îmbrăcat."}
  ro.a2.unit77.lesson03.exercise01.alege_obiceiul: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "De obicei mă trezesc la șapte.", "distractors": ["De obicei m-am trezit la șapte.", "De obicei te trezești la șapte.", "De obicei ne trezim la șapte."], "accepted_answers": [{"value": "De obicei mă trezesc la șapte.", "status": "correct"}], "feedback": "A habit uses the present tense: *mă trezesc*."}
  ro.a2.unit77.lesson03.exercise02.alege_azi: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Azi dimineață m-am trezit la șase.", "distractors": ["Azi dimineață mă trezesc la șase.", "Azi dimineață te-ai trezit la șase.", "Azi dimineață s-a trezit la șase."], "accepted_answers": [{"value": "Azi dimineață m-am trezit la șase.", "status": "correct"}], "feedback": "Something that already happened this morning uses the perfect compus: *m-am trezit*."}
  ro.a2.unit77.lesson03.exercise03.potriveste_contrastul: {"instruction": "Match each Romanian word or phrase to its meaning.", "accepted_answers": [{"value": [{"left": "de obicei", "right": "usually"}, {"left": "mereu", "right": "always"}, {"left": "ieri", "right": "yesterday"}, {"left": "azi", "right": "today"}, {"left": "deja", "right": "already"}, {"left": "încă nu", "right": "not yet"}, {"left": "devreme", "right": "early"}, {"left": "târziu", "right": "late"}], "status": "correct"}], "feedback": "These words help you choose the tense."}
  ro.a2.unit77.lesson03.exercise04.ordoneaza_deja: {"instruction": "Put the words in order to say 'I have already had breakfast.'", "correct_option": "Deja am luat micul dejun", "accepted_answers": [{"value": "Deja am luat micul dejun", "status": "correct"}, {"value": "Am luat micul dejun deja", "status": "correct"}, {"value": "Am luat deja micul dejun", "status": "correct"}], "feedback": "*Deja* can come first or after the participle group."}
  ro.a2.unit77.lesson03.exercise05.completeaza_ieri: {"instruction": "Complete with the Romanian word for 'yesterday'.", "correct_option": "Ieri", "accepted_answers": [{"value": "Ieri", "status": "correct"}, {"value": "ieri", "status": "correct"}], "feedback": "*Ieri* is the day before *azi*."}
  ro.a2.unit77.lesson03.exercise06.tradu_inca_nu: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Încă nu am luat micul dejun.", "status": "correct"}, {"value": "Încă nu am luat micul dejun", "status": "correct"}, {"value": "Nu am luat micul dejun încă.", "status": "correct"}, {"value": "Nu am luat micul dejun încă", "status": "correct"}, {"value": "Nu am luat încă micul dejun", "status": "correct"}, {"value": "Nu am luat încă micul dejun.", "status": "correct"}, {"value": "Eu încă nu am luat micul dejun.", "status": "correct"}, {"value": "Eu încă nu am luat micul dejun", "status": "correct"}, {"value": "Încă n-am luat micul dejun.", "status": "correct"}, {"value": "Încă n-am luat micul dejun", "status": "correct"}, {"value": "N-am luat micul dejun încă.", "status": "correct"}, {"value": "N-am luat micul dejun încă", "status": "correct"}], "feedback": "*Încă nu am luat micul dejun*: *încă nu* + auxiliary + participle."}
  ro.a2.unit77.lesson03.exercise07.scrie_contrastul: {"instruction": "Write exactly two sentences: first the present tense with *de obicei*, then the perfect compus for this morning.", "accepted_answers": [{"value": "De obicei mă trezesc la șapte. Azi dimineață m-am trezit la șase.", "status": "correct"}, {"value": "De obicei mă trezesc la șapte. Azi dimineață m-am trezit la șase", "status": "correct"}, {"value": "De obicei mă trezesc la șapte. Azi m-am trezit la șase.", "status": "correct"}, {"value": "De obicei mă trezesc la șapte. Azi m-am trezit la șase", "status": "correct"}, {"value": "De obicei mă trezesc la șapte Azi dimineață m-am trezit la șase.", "status": "correct"}, {"value": "De obicei mă trezesc la șapte Azi dimineață m-am trezit la șase", "status": "correct"}, {"value": "De obicei mă trezesc la șapte Azi m-am trezit la șase.", "status": "correct"}, {"value": "De obicei mă trezesc la șapte Azi m-am trezit la șase", "status": "correct"}, {"value": "Mă trezesc de obicei la șapte. Azi dimineață m-am trezit la șase.", "status": "correct"}, {"value": "Mă trezesc de obicei la șapte. Azi dimineață m-am trezit la șase", "status": "correct"}, {"value": "Mă trezesc de obicei la șapte. Azi m-am trezit la șase.", "status": "correct"}, {"value": "Mă trezesc de obicei la șapte. Azi m-am trezit la șase", "status": "correct"}, {"value": "Mă trezesc de obicei la șapte Azi dimineață m-am trezit la șase.", "status": "correct"}, {"value": "Mă trezesc de obicei la șapte Azi dimineață m-am trezit la șase", "status": "correct"}, {"value": "Mă trezesc de obicei la șapte Azi m-am trezit la șase.", "status": "correct"}, {"value": "Mă trezesc de obicei la șapte Azi m-am trezit la șase", "status": "correct"}], "feedback": "*De obicei mă trezesc la șapte. Azi dimineață m-am trezit la șase.*", "correct_option": "De obicei mă trezesc la șapte. Azi dimineață m-am trezit la șase."}
  ro.a2.unit77.lesson04.exercise01.alege_facut: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Am făcut cafea.", "distractors": ["Am fac cafea.", "Am face cafea.", "A făcut cafea."], "accepted_answers": [{"value": "Am făcut cafea.", "status": "correct"}], "feedback": "The participle of *a face* is irregular: *făcut*."}
  ro.a2.unit77.lesson04.exercise02.alege_vazut: {"instruction": "Choose the correct Romanian question.", "correct_option": "Ai văzut cheile mele?", "distractors": ["Ai vedea cheile mele?", "Ai văzută cheile mele?", "Am văzut cheile mele?"], "accepted_answers": [{"value": "Ai văzut cheile mele?", "status": "correct"}], "feedback": "*A vedea* gives *văzut*, and *tu* takes *ai*. The participle does not change."}
  ro.a2.unit77.lesson04.exercise03.potriveste_participiile: {"instruction": "Match each Romanian form to its meaning.", "accepted_answers": [{"value": [{"left": "am făcut", "right": "I have made"}, {"left": "am văzut", "right": "I have seen"}, {"left": "am scris", "right": "I have written"}, {"left": "am mers", "right": "I have gone"}, {"left": "am venit", "right": "I have come"}, {"left": "am băut", "right": "I have drunk"}, {"left": "am citit", "right": "I have read"}, {"left": "am deschis", "right": "I have opened"}], "status": "correct"}], "feedback": "Eight participles with *am*."}
  ro.a2.unit77.lesson04.exercise04.ordoneaza_autobuz: {"instruction": "Put the words in order to say 'Mihai went to the office by bus.'", "correct_option": "Mihai a mers la birou cu autobuzul", "accepted_answers": [{"value": "Mihai a mers la birou cu autobuzul", "status": "correct"}, {"value": "Mihai a mers cu autobuzul la birou", "status": "correct"}], "feedback": "*A mers*: the participle of *a merge* is *mers*."}
