course:
  title: Romanian B2
  description: >-
    Upper-intermediate Romanian: defend a position in a discussion --
    state a claim, support it with reasons and evidence (în primul rând,
    de exemplu, studiile arată că), acknowledge the strongest opposing
    point (pe de o parte ... pe de altă parte, deși, desigur), and rebut
    it without conceding (totuși, în schimb, asta nu înseamnă că, pe
    scurt), around the everyday debate of public transport versus the
    private car.

units:
  ro.b2.unit01.argumentare:
    title: "Argumentation"
    description: Defend a position on an everyday issue -- state a claim, support it with reasons and evidence, acknowledge the strongest objection, and rebut it without giving up your claim.

lessons:
  ro.b2.unit01.lesson01.opinia:
    title: "Expressing an opinion"
  ro.b2.unit01.lesson02.argumente:
    title: "Reasons and evidence"
  ro.b2.unit01.lesson03.cealalta_parte:
    title: "Acknowledging the other side"
  ro.b2.unit01.lesson04.combaterea:
    title: "Rebutting arguments"
  ro.b2.unit01.lesson05.text_argumentativ:
    title: "Reading an argumentative text"
  ro.b2.unit01.lesson06.sustinerea_pozitiei:
    title: "Defending a position in a discussion"

teaching:
  ro.b2.unit01.lesson01.teach.transportul_in_comun:
    title: "public transport"
    gloss: "public transport"
    note: "*Transportul în comun* is the everyday term for buses, trams, and trains together, as a single system."
    example_gloss: "Public transport is cheap."
  ro.b2.unit01.lesson01.teach.masina_personala:
    title: "the private car"
    gloss: "the private / personal car"
    note: "The opposite pole of the debate. *Personală* agrees in gender with the feminine noun *mașina*."
    example_gloss: "Many people prefer the private car."
  ro.b2.unit01.lesson01.teach.un_punct_de_vedere:
    title: "a position / viewpoint"
    gloss: "a position / a point of view"
    note: "*A avea un punct de vedere* means 'to hold a position' -- the claim you are about to defend. This is the thing an argument is built around."
    example_gloss: "I have a clear viewpoint."
  ro.b2.unit01.lesson01.teach.cred_ca:
    title: "I think that..."
    gloss: "I think that... / I believe that..."
    note: "*Cred că...* introduces your own opinion, followed directly by a normal indicative clause: *cred că transportul este mai bun* (no special word order shift, unlike some languages)."
  ro.b2.unit01.lesson01.teach.in_opinia_mea:
    title: "In my opinion..."
    gloss: "In my opinion..."
    note: "*În opinia mea* is a slightly more formal way to open an opinion than *cred că*, well suited to the formal register Ana and Mihai use with each other."
  ro.b2.unit01.lesson01.teach.mai_bun:
    title: better
    gloss: better
    note: "*Mai bun* is the comparative of *bun* (good). It agrees in gender: *mai bun* (masc./neuter), *mai bună* (fem.) -- *transportul* is neuter, so *mai bun* is correct here."
    example_gloss: "Public transport is better."
  ro.b2.unit01.lesson01.teach.decat:
    title: than
    gloss: than
    note: "*Decât* is 'than' in a comparison: *mai bun decât* = 'better than'."
    example_gloss: "Public transport is better than the private car."
  ro.b2.unit01.lesson01.teach.claim_model:
    title: "I think that public transport is better than the private car."
    gloss: "I think that public transport is better than the private car."
    note: "A model claim. *Este* ('is') is the third-person form of *a fi*, agreeing with the neuter subject *transportul*."
  ro.b2.unit01.lesson01.teach.sunt_de_acord:
    title: "I agree with that."
    gloss: "I agree with that."
    note: "*A fi de acord cu ceva* = 'to agree with something'. *Asta* ('that') stands in for the claim just made."
  ro.b2.unit01.lesson01.teach.grammar_pozitie:
    title: "I think that public transport is better than the private car. In my opinion, it is better."
    gloss: "I think that public transport is better than the private car. In my opinion, it is better."
    note: "A claim is the position you will defend. Both *cred că...* and *în opinia mea...* signal that what follows is your opinion, not a stated fact -- the starting point of every argument in this unit."

  ro.b2.unit01.lesson02.teach.pentru_ca:
    title: because
    gloss: "because (everyday, mid-clause)"
    note: "*Pentru că* is the everyday way to give a reason, usually mid-sentence after the claim it explains. Compare *deoarece*, which is more formal and often opens the sentence."
    example_gloss: "I prefer public transport, because it is cheaper."
  ro.b2.unit01.lesson02.teach.deoarece:
    title: "because (formal)"
    gloss: "because / since (more formal)"
    note: "*Deoarece* gives the same reason as *pentru că* but reads as more formal, and naturally opens the sentence: *Deoarece este mai ieftin, ...*. English 'because' does not mark this register difference."
    example_gloss: "Because it is cheaper, I prefer public transport."
  ro.b2.unit01.lesson02.teach.in_primul_al_doilea_rand:
    title: "firstly, secondly"
    gloss: "firstly..., secondly..."
    note: "*În primul rând... în al doilea rând...* number your reasons so an argument is easy to follow -- the classic way to signpost support."
  ro.b2.unit01.lesson02.teach.in_plus:
    title: "in addition"
    gloss: "in addition / besides"
    note: "*În plus* adds a further reason on top of the ones already given."
    example_gloss: "In addition, it is fast."
  ro.b2.unit01.lesson02.teach.de_exemplu:
    title: "for example"
    gloss: "for example"
    note: "*De exemplu* introduces a concrete example that backs up a reason."
    example_gloss: "For example, the bus is cheap."
  ro.b2.unit01.lesson02.teach.studiile_arata_ca:
    title: "studies show that..."
    gloss: "studies show that..."
    note: "*Studiile arată că...* is how you cite evidence in an argument, followed by a normal indicative clause."
  ro.b2.unit01.lesson02.teach.bani:
    title: money
    gloss: money
    note: "*Bani* (money) is plural in Romanian -- the singular *ban* means a single coin (1 leu = 100 bani). The definite form is *banii* ('the money')."
    example_gloss: "I save money."
  ro.b2.unit01.lesson02.teach.se_economisesc:
    title: "is saved / are saved"
    gloss: "is saved / one saves (impersonal)"
    note: "*Se economisesc bani* uses the impersonal reflexive-passive *se* construction -- the natural Romanian way to state a general point without naming who saves ('money gets saved', i.e. 'you save money'). *Economisiți* (saved) is the masculine plural past participle, as in *banii economisiți* ('the money saved')."
    example_gloss: "Money is saved."
  ro.b2.unit01.lesson02.teach.ecologic:
    title: "eco-friendly"
    gloss: "eco-friendly / environmentally friendly"
    example_gloss: "The bicycle is eco-friendly."
  ro.b2.unit01.lesson02.teach.multi:
    title: many
    gloss: many
    example_gloss: "Many people prefer the bicycle."
  ro.b2.unit01.lesson02.teach.prefera:
    title: prefer(s)
    gloss: "prefer(s) (from a prefera, to prefer)"
    note: "*Preferă* covers both third-person singular and third-person plural (he/she/they prefer). *Prefer* is the first-person singular form (I prefer)."
    example_gloss: "Many prefer public transport."
  ro.b2.unit01.lesson02.teach.timp:
    title: time
    gloss: time
    example_gloss: "Public transport saves time."
  ro.b2.unit01.lesson02.teach.grammar_argumente:
    title: "Firstly, money is saved. In addition, studies show it is more eco-friendly. Because it is more eco-friendly, many people prefer public transport."
    gloss: "Firstly, money is saved. In addition, studies show it is more eco-friendly. Because it is more eco-friendly, many people prefer public transport."
    note: "Support = the reasons and evidence behind your claim. Number them (*în primul rând*), add more (*în plus*), and cite evidence (*studiile arată că*) so the argument is easy to follow."

  ro.b2.unit01.lesson03.teach.pe_de_o_parte:
    title: "on the one hand"
    gloss: "on the one hand"
    note: "*Pe de o parte...* opens a balanced view; it is almost always paired with *pe de altă parte...* to introduce the opposing point you are about to acknowledge."
  ro.b2.unit01.lesson03.teach.pe_de_alta_parte:
    title: "on the other hand"
    gloss: "on the other hand"
    note: "*Pe de altă parte...* introduces the strongest point against your claim. Acknowledging it (before you rebut it) is what makes a B2 argument convincing rather than one-sided."
  ro.b2.unit01.lesson03.teach.desi:
    title: although
    gloss: although
    note: "*Deși* concedes a point with a normal indicative verb (unlike some languages, Romanian *deși* does not require a special mood). It sets up a contrast the main clause will answer."
    example_gloss: "Although it is useful, I prefer public transport."
  ro.b2.unit01.lesson03.teach.desigur:
    title: "of course"
    gloss: "of course / naturally"
    note: "*Desigur* concedes that the opposing point is fair ('of course you're right...') -- a polite way to acknowledge before you push back."
    example_gloss: "Of course, he/she is right."
  ro.b2.unit01.lesson03.teach.este_adevarat:
    title: "That's true."
    gloss: "That's true. / That's correct."
    note: "*Este adevărat* grants that the other side has a real point -- you acknowledge it honestly, then rebut it in the next breath."
  ro.b2.unit01.lesson03.teach.unii_cred_ca:
    title: "some think that..."
    gloss: "some (people) think that..."
    note: "*Unii cred că...* introduces a common objection without owning it yourself -- 'some think that...' -- so you can then answer it."
  ro.b2.unit01.lesson03.teach.confortabila:
    title: comfortable
    gloss: comfortable
    note: "*Confortabilă* is the feminine form, agreeing with *mașina*; the masculine/neuter form is *confortabil*."
    example_gloss: "The private car is comfortable."
  ro.b2.unit01.lesson03.teach.incomod:
    title: uncomfortable
    gloss: "uncomfortable / inconvenient"
    example_gloss: "Sometimes public transport is uncomfortable."
  ro.b2.unit01.lesson03.teach.uneori:
    title: sometimes
    gloss: sometimes
    example_gloss: "Sometimes I prefer the private car."
  ro.b2.unit01.lesson03.teach.grammar_concesie:
    title: "On the one hand public transport is better, on the other hand the private car is sometimes more comfortable."
    gloss: "On the one hand public transport is better, on the other hand the private car is sometimes more comfortable."
    note: "Acknowledging the other side = naming the strongest point against you fairly, before you answer it. *Pe de o parte... pe de altă parte...*, *deși*, *desigur*, and *Este adevărat* all do this without giving up your own position."

  ro.b2.unit01.lesson04.teach.totusi:
    title: "still / yet"
    gloss: "still / yet / nevertheless"
    note: "*Totuși* answers a concession: you grant the objection, then *totuși...* ('still, ...') reasserts your claim. It is the core rebuttal word."
    example_gloss: "It is expensive, yet I buy it."
  ro.b2.unit01.lesson04.teach.in_schimb:
    title: "by contrast / instead"
    gloss: "by contrast / on the other hand"
    note: "*În schimb* sets one thing directly against another: 'the car is convenient; public transport, by contrast, is cheaper'. It can open the clause (*În schimb, transportul...*) or, as here, follow the noun it comments on, set off by commas."
    example_gloss: "The car is convenient; public transport, by contrast, is cheaper."
  ro.b2.unit01.lesson04.teach.dar:
    title: but
    gloss: but
    note: "*Dar* is the everyday contrast word. It pivots from the acknowledged point back to your claim."
    example_gloss: "It is useful, but not perfect."
  ro.b2.unit01.lesson04.teach.insa:
    title: however
    gloss: "however / but"
    note: "*Însă* is a slightly more formal 'but / however'. Like *dar* it can open its clause (*..., însă este lent*), but unlike *dar* it can also come right after the clause's first word: *este însă lent*."
    example_gloss: "Public transport is cheap; it is, however, slow."
  ro.b2.unit01.lesson04.teach.asta_nu_inseamna_ca:
    title: "that does not mean that..."
    gloss: "that does not mean that..."
    note: "*Asta nu înseamnă că...* is a set B2 rebuttal frame: you accept the objection, but say it does not undo your claim."
  ro.b2.unit01.lesson04.teach.pe_scurt:
    title: "in short"
    gloss: "in short"
    note: "*Pe scurt* signposts your conclusion -- it wraps the argument up: 'in short, ...'."
    example_gloss: "In short, public transport is better."
  ro.b2.unit01.lesson04.teach.avantaje:
    title: advantages
    gloss: advantages
    note: "*Avantajele* (with the definite article) means 'the advantages'."
    example_gloss: "Public transport has many advantages."
  ro.b2.unit01.lesson04.teach.dezavantaje:
    title: disadvantages
    gloss: disadvantages
    example_gloss: "It also has a few disadvantages."
  ro.b2.unit01.lesson04.teach.conteaza:
    title: "counts / matters"
    gloss: "counts / matters (from a conta, to count/matter)"
    note: "*A conta* here means 'to carry weight' in an argument: *avantajele contează mai mult* = 'the advantages count for more'."
    example_gloss: "Time matters a lot."
  ro.b2.unit01.lesson04.teach.mai_mult:
    title: more
    gloss: more
    example_gloss: "The advantages count for more."
  ro.b2.unit01.lesson04.teach.mai_putin:
    title: less
    gloss: less
    example_gloss: "The disadvantages count for less."
  ro.b2.unit01.lesson04.teach.are_avantaje:
    title: "has advantages"
    gloss: "has advantages"
    note: "*Are* = 'has' (from *a avea*). *Transportul în comun are avantaje* concedes the other side has advantages too -- before you rebut."
  ro.b2.unit01.lesson04.teach.grammar_combatere:
    title: "That's true, but that does not mean that the money saved counts for less. In short, the advantages count for more than the disadvantages."
    gloss: "That's true, but that does not mean that the money saved counts for less. In short, the advantages count for more than the disadvantages."
    note: "Rebutting = answering the acknowledged objection without giving up your claim. *Totuși*, *dar*, *însă*, *în schimb*, and *asta nu înseamnă că...* all pivot back to your position; *pe scurt* signposts the conclusion."

  ro.b2.unit01.lesson05.teach.text:
    title: "Reading: public transport is a good choice"
    gloss: "More and more people prefer public transport. I think that it is a good choice. Firstly, money is saved, and studies show it is more eco-friendly than the private car. Of course, some think that public transport is uncomfortable. That's true, but that does not mean that the advantages count for less. In short, public transport is better than the private car."
    glosses:
      Tot: "still / ever (tot mai mulți = more and more)"
      mai: "more (tot mai mulți = more and more)"
      mulți: many
      oameni: people
      preferă: prefer
      o: "a / an (feminine indefinite article)"
      alegere: choice
      bună: "good (feminine form of bun)"
      iar: "and / whereas"
      studiile: "the studies"
      arată: "show (from a arăta, to show)"
      ecologic: "eco-friendly"
      Desigur: "of course"
      unii: some
      incomod: uncomfortable
      adevărat: "true (Este adevărat = that's true)"
      înseamnă: "means (from a însemna, to mean)"
      avantajele: "the advantages"
      contează: "count / matter"
      puțin: "little (mai puțin = less)"
      scurt: short

  ro.b2.unit01.lesson06.teach.de_ce_credeti_asta:
    title: "Why do you think that?"
    gloss: "Why do you think that?"
    note: "*De ce credeți asta?* asks a debating partner (formally, with *dumneavoastră*) to support their claim -- the cue to give your reasons and evidence."
  ro.b2.unit01.lesson06.teach.poate_aveti_dreptate:
    title: "Maybe you're right."
    gloss: "Maybe you're right. / You may have a point."
    note: "*Poate aveți dreptate* concedes that the other person's argument is reasonable, without fully giving up your own -- a natural formal way to acknowledge a good point in discussion."
  ro.b2.unit01.lesson06.teach.dialogue_ana_claim:
    title: "Ana: I think that public transport is better than the private car."
    gloss: "Ana: I think that public transport is better than the private car."
  ro.b2.unit01.lesson06.teach.dialogue_mihai_why:
    title: "Mihai: Why do you think that?"
    gloss: "Mihai: Why do you think that?"
  ro.b2.unit01.lesson06.teach.dialogue_ana_support:
    title: "Ana: Firstly, money is saved, and studies show it is more eco-friendly."
    gloss: "Ana: Firstly, money is saved, and studies show it is more eco-friendly."
  ro.b2.unit01.lesson06.teach.dialogue_mihai_objection:
    title: "Mihai: On the other hand, the private car is more comfortable."
    gloss: "Mihai: On the other hand, the private car is more comfortable."
  ro.b2.unit01.lesson06.teach.dialogue_ana_rebuttal:
    title: "Ana: That's true, but that does not mean that the advantages count for less. In short, public transport is better."
    gloss: "Ana: That's true, but that does not mean that the advantages count for less. In short, public transport is better."
  ro.b2.unit01.lesson06.teach.dialogue_mihai_concede:
    title: "Mihai: Maybe you're right."
    gloss: "Mihai: Maybe you're right."
  ro.b2.unit01.lesson06.teach.grammar_argument_complet:
    title: "I think public transport is better than the private car. Firstly, money is saved. Of course, the private car is sometimes more comfortable. Still, the advantages count for more."
    gloss: "I think public transport is better than the private car. Firstly, money is saved. Of course, the private car is sometimes more comfortable. Still, the advantages count for more."
    note: "A complete argument has four moves: claim (*cred că...*), support (*în primul rând...*), acknowledged objection (*desigur...*), and rebuttal (*totuși...*)."

exercises:
  ro.b2.unit01.lesson01.exercise01.recognize_punct_de_vedere:
    instruction: "What does this phrase mean?"
    correct_option: "a point of view"
    distractors: [a question, an answer, an agreement]
    accepted_answers: [{value: "a point of view", status: correct}]
    feedback: "Un punct de vedere is a position or point of view -- the claim you defend."
  ro.b2.unit01.lesson01.exercise02.listen_claim:
    instruction: "Listen and select what you hear."
    correct_option: "I think that public transport is better than the private car."
    distractors: ["I think that the private car is better than public transport.", "I think that public transport is nicer than walking.", "I know that public transport is better than the private car."]
    accepted_answers: [{value: "I think that public transport is better than the private car.", status: correct}]
    feedback: "Cred că transportul în comun este mai bun decât mașina personală means I think that public transport is better than the private car."
  ro.b2.unit01.lesson01.exercise03.match_claim_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"transportul în comun": "public transport", "mașina personală": "the private car", "un punct de vedere": "a position / viewpoint", "Cred că...": "I think that...", "În opinia mea...": "In my opinion...", "mai bun": better, decât: than, "Sunt de acord cu asta.": "I agree with that."}
        status: correct
    feedback: "These are this lesson's claim-stating words."
  ro.b2.unit01.lesson01.exercise04.order_claim:
    instruction: "Put the words in order: I think that public transport is better."
    accepted_answers:
      - {value: "Cred că transportul în comun este mai bun", status: correct}
    feedback: "Cred că transportul în comun este mai bun means I think that public transport is better."
  ro.b2.unit01.lesson01.exercise05.translate_opinia_mea:
    instruction: "Translate into Romanian: In my opinion, public transport is better."
    accepted_answers:
      - {value: "În opinia mea, transportul în comun este mai bun", status: correct}
      - {value: "În opinia mea transportul în comun este mai bun", status: correct}
    feedback: "În opinia mea, transportul în comun este mai bun means in my opinion, public transport is better."
  ro.b2.unit01.lesson01.exercise06.speak_sunt_de_acord:
    instruction: "Say aloud in Romanian: I agree with that."
    accepted_answers:
      - {value: "Sunt de acord cu asta", status: correct}
    feedback: "Sunt de acord cu asta means I agree with that."
  ro.b2.unit01.lesson01.exercise07.write_claim:
    instruction: "Write in Romanian: I think that public transport is better than the private car."
    accepted_answers:
      - {value: "Cred că transportul în comun este mai bun decât mașina personală", status: correct}
    feedback: "Cred că transportul în comun este mai bun decât mașina personală means I think that public transport is better than the private car."
  ro.b2.unit01.lesson01.exercise08.dictation_claim_transport:
    instruction: "Type what you hear."
    correct_response: "Cred că transportul în comun este mai bun decât mașina personală"
    orthography_strict: true
    feedback: "You heard Cred că transportul în comun este mai bun decât mașina personală — I think that public transport is better than the private car."

  ro.b2.unit01.lesson02.exercise01.recognize_pentru_ca:
    instruction: "What does this word mean?"
    correct_option: because
    distractors: [but, although, "for example"]
    accepted_answers: [{value: because, status: correct}]
    feedback: "Pentru că means because -- the everyday, mid-clause way to give a reason."
  ro.b2.unit01.lesson02.exercise02.listen_motiv_bani:
    instruction: "Listen and select what you hear."
    correct_option: "Firstly, money is saved."
    distractors: ["Secondly, money is saved.", "Firstly, a little money is saved.", "Firstly, time is saved."]
    accepted_answers: [{value: "Firstly, money is saved.", status: correct}]
    feedback: "În primul rând se economisesc bani means firstly, money is saved."
  ro.b2.unit01.lesson02.exercise03.match_argument_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"pentru că": "because (everyday/spoken)", deoarece: "because (more formal)", "în primul rând": firstly, "în al doilea rând": secondly, "în plus": "in addition", "de exemplu": "for example", "studiile arată că...": "studies show that...", bani: money}
