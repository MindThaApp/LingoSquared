answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț). For
    free-typed A2 answers, accept otherwise-correct forms with the
    diacritics omitted or with the legacy cedilla variants ş/ţ
    substituted for ș/ț, matching units 01-21's policy.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    Fully formal dumneavoastră register throughout, continuing Ana and
    Mihai's own established formal register with each other from units
    01-21. "Cred că" (I think that) and "pentru că" (because) are the
    new subordinate-clause forms this unit introduces; these carry no
    register distinction of their own.

course:
  title: "Romanian A2"
  description: >-
    Giving an opinion and a reason in Romanian -- Cred că (I think
    that), Pentru că (because), Părere (opinion), and De acord (agree)
    -- as Ana and Mihai discuss the city's traffic and its parks.

units:
  ro.a2.unit22.opinii:
    title: "Opinions"

lessons:
  ro.a2.unit22.lesson01.cred_ca:
    title: "I think that..."
  ro.a2.unit22.lesson02.sunt_de_acord:
    title: "I agree"
  ro.a2.unit22.lesson03.mesajul_despre_oras:
    title: "The message about the city"
  ro.a2.unit22.lesson04.despre_oras:
    title: "About the city"

teaching:
  ro.a2.unit22.lesson01.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: "Reminder: Bună ziua, Mulțumesc, La revedere, Ana, Mihai"
    gloss: "Bună ziua (good day, formal) · Mulțumesc (thank you) · La revedere (goodbye) · Ana · Mihai"
    note: "Formal greetings you already know, reused to open and close this unit's conversation."

  ro.a2.unit22.lesson01.teach.cred_grammar:
    title: "Cred că (I think that)"
    gloss: "Cred că (I think that)"
    note: "New grammar this unit: *cred* (I think, from *a crede*) + *că* (that) introduces a subordinate clause stating an opinion -- the standard opinion-frame this whole unit builds on."

  ro.a2.unit22.lesson01.teach.trafic_vocab:
    title: "Traffic"
    gloss: "Trafic (traffic)"
    note: "A neuter noun, shown here in its definite form *traficul* ('the traffic')."
    example_gloss:
      - "I think the traffic is too crowded."

  ro.a2.unit22.lesson01.teach.aglomerat_vocab:
    title: "Crowded"
    gloss: "Aglomerat (crowded/congested) · Prea (too, excessively) · Este (is)"
    note: "An adjective describing something overcrowded or congested -- pairs naturally with *prea* to intensify it."
    example_gloss:
      - "The traffic is too crowded."

  ro.a2.unit22.lesson01.teach.pentru_ca_grammar:
    title: "Pentru că (because)"
    gloss: "Pentru că (because)"
    note: "New grammar this unit: introduces the reason clause that supports an opinion -- usually placed after the opinion it explains, e.g. *Cred că X, pentru că Y*."

  ro.a2.unit22.lesson01.teach.masini_vocab:
    title: "Cars"
    gloss: "Mașini (cars) · Sunt (there are) · Multe (many)"
    note: "In *Sunt multe mașini*, *sunt* means 'there are' (literally 'many cars are') -- the 'they are' form, distinct from *sunt* meaning 'I am.'"
    example_gloss:
      - "There are many cars in the city."

  ro.a2.unit22.lesson01.teach.cred_ca_trafic_phrase:
    title: "I think the traffic is too crowded, because there are many cars."
    gloss: "Cred că traficul este prea aglomerat, pentru că sunt multe mașini."
    note: "Combines this lesson's opinion-frame (*cred că*) with its reason-frame (*pentru că*) -- the full opinion-plus-reason construction this unit targets."

  ro.a2.unit22.lesson02.teach.parere_vocab:
    title: "Opinion"
    gloss: "Părere (opinion) · Părerea dumneavoastră (your opinion, formal)"
    note: "*Părere* (opinion) is feminine; *părerea* adds the definite article *-a* ('the opinion'), and *dumneavoastră* after it means 'your' (formal)."
    example_gloss:
      - "What is your opinion about traffic?"

  ro.a2.unit22.lesson02.teach.de_acord_vocab:
    title: "In agreement"
    gloss: "Sunt de acord (I agree) · Cu (with) · Nu (not)"
    note: "*De acord* literally 'in agreement' -- combines with *sunt* (I am) for 'I agree,' and negates with *nu* for 'I don't agree.'"
    example_gloss:
      - "I agree with you."

  ro.a2.unit22.lesson02.teach.parc_vocab:
    title: "Park"
    gloss: "Parc (park) · Foarte (very) · Frumos (beautiful)"
    note: "A neuter noun, shown here in its definite form *parcul* ('the park')."
    example_gloss:
      - "The park is very beautiful."

  ro.a2.unit22.lesson02.teach.care_parerea_phrase:
    title: "What is your opinion about traffic?"
    gloss: "Care este părerea dumneavoastră despre trafic?"
    note: "The full formal question: 'What is your opinion about traffic?'"

  ro.a2.unit22.lesson02.teach.nu_sunt_de_acord_phrase:
    title: "I don't agree. I think the park is very beautiful."
    gloss: "Nu sunt de acord. Cred că parcul este foarte frumos."
    note: "A contrasting opinion -- disagreeing with the traffic complaint and offering a different, positive opinion about the park instead."

  ro.a2.unit22.lesson03.teach.oras_vocab:
    title: "City"
    gloss: "Orașul (the city) · Are nevoie de (needs)"
    note: "*Are nevoie de* literally 'has need of' -- the standard way to say something is needed."
    example_gloss:
      - "The city needs more parks."

  ro.a2.unit22.lesson03.teach.in_opinia_mea_grammar:
    title: "În opinia mea (in my opinion)"
    gloss: "În opinia mea (in my opinion) · Dar (but) · Interesant (interesting)"
    note: "A more formal opinion-frame than *cred că*, often used to open a written statement. *Dar* joins a contrasting second point, e.g. interesting BUT crowded."

  ro.a2.unit22.lesson03.teach.in_opinia_mea_phrase:
    title: "In my opinion, the city is interesting, but crowded."
    gloss: "În opinia mea, orașul este interesant, dar aglomerat."
    note: "Combines this unit's two adjectives (*interesant*, *aglomerat*) into one balanced opinion using *dar*."

  ro.a2.unit22.lesson03.teach.mesaj_reading:
    title: "A short written opinion"
    gloss: "I think the park next to the city hall is very beautiful, but small. In my opinion, the city needs more parks, because there are many families with children."
    note: "A short written note giving an opinion (the park is beautiful but small) and a supporting reason for a broader opinion (the city needs more parks, because there are many families with children)."
    glosses:
      Cred: "I think (from a crede)"
      parcul: "park"
      lângă: "next to"
      primărie: "city hall"
      foarte: "very"
      frumos: "beautiful"
      mic: "small"
      opinia: "opinion"
      orașul: "city"
      are: "has (from a avea)"
      nevoie: "needs"
      multe: "many"
      parcuri: "parks"
      familii: "families"
      copii: "children"

  ro.a2.unit22.lesson04.teach.reminder_aveti_dreptate:
    title: "New phrases: Aveți dreptate, Cu plăcere"
    gloss: "Aveți dreptate (You're right, formal) · Cu plăcere (You're welcome / my pleasure)"
    note: "Two standard polite phrases: *Aveți dreptate* (you're right, formal) and *Cu plăcere* (you're welcome)."

  ro.a2.unit22.lesson04.teach.line01:
    title: "Greet Mihai and ask his opinion"
    gloss: "Ana greets Mihai and asks his opinion about traffic."
    note: "The formal opinion question: *Care este părerea dumneavoastră...?*"

  ro.a2.unit22.lesson04.teach.line02:
    title: "Give the opinion and reason"
    gloss: "Mihai says he thinks the traffic is too crowded, because there are many cars."
    note: "Opinion + reason: *Cred că ..., pentru că ...*"

  ro.a2.unit22.lesson04.teach.line03:
    title: "Agree, then offer a contrasting point"
    gloss: "Ana agrees, then says the park near the city hall is very beautiful."
    note: "*Dar* (but) introduces a contrasting point; *lângă primărie* means 'next to the city hall.'"

  ro.a2.unit22.lesson04.teach.line04:
    title: "Agree and give an overall opinion"
    gloss: "Mihai agrees, then gives his overall opinion: the city is interesting, but crowded."
    note: "*În opinia mea* -- 'in my opinion' -- with *dar* joining two contrasting points."

  ro.a2.unit22.lesson04.teach.line05:
    title: "Acknowledge and thank Mihai"
    gloss: "Ana says he's right and thanks him for his opinion."
    note: "*Aveți dreptate* (you're right) + *Mulțumesc pentru...* (thank you for...)."

  ro.a2.unit22.lesson04.teach.line06:
    title: "Say goodbye"
    gloss: "Mihai says you're welcome and goodbye."
    note: "*Cu plăcere* (you're welcome), then goodbye."

exercises:
  ro.a2.unit22.lesson01.exercise01.choose_cred:
    instruction: "Which phrase means 'I think that'?"
    correct_option: "Cred că"
    distractors: ["Pentru că", "De acord"]
    accepted_answers: ["Cred că"]

  ro.a2.unit22.lesson01.exercise02.choose_aglomerat:
    instruction: "Which word means 'crowded'?"
    correct_option: "Aglomerat"
    distractors: ["Frumos", "Interesant"]
    accepted_answers: ["Aglomerat"]

  ro.a2.unit22.lesson01.exercise03.listen_cred_ca_trafic:
    instruction: "Listen and select what you hear."
    correct_option: "Cred că traficul este prea aglomerat, pentru că sunt multe mașini"
    distractors: ["Care este părerea dumneavoastră despre trafic", "Nu sunt de acord"]
    accepted_answers: ["Cred că traficul este prea aglomerat, pentru că sunt multe mașini"]

  ro.a2.unit22.lesson01.exercise04.match_opinii1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Cred că": "I think that"
      "Trafic": "traffic"
      "Aglomerat": "crowded"
      "Pentru că": "because"
      "Mașini": "cars"
      "Prea": "too (excessively)"
      "Bună ziua.": "Good day."
      "Cred că traficul este prea aglomerat.": "I think the traffic is too crowded."

  ro.a2.unit22.lesson01.exercise05.order_cred_ca_trafic:
    instruction: "Build the sentence: I think the traffic is too crowded."
    correct_response: ["Cred", "că", "traficul", "este", "prea", "aglomerat"]

  ro.a2.unit22.lesson01.exercise06.listen_order_sunt_multe_masini:
    instruction: "Listen, then put the words in order."
    correct_response: ["Sunt", "multe", "mașini"]

  ro.a2.unit22.lesson01.exercise07.complete_cred_ca_trafic:
    instruction: "Complete the sentence: I think the traffic is too crowded."
    accepted_answers: ["aglomerat", "Aglomerat"]
    feedback: "Cred că traficul este prea *aglomerat* -- *aglomerat* means 'crowded' or 'congested.'"

  ro.a2.unit22.lesson01.exercise08.write_opinion_reason:
    instruction: "Write in Romanian, using 'cred că' and 'pentru că': I think the traffic is too crowded, because there are many cars."
    accepted_answers:
      - "Cred că traficul este prea aglomerat, pentru că sunt multe mașini."
      - "Cred că traficul e prea aglomerat, pentru că sunt multe mașini."

  ro.a2.unit22.lesson02.exercise01.choose_parere:
    instruction: "Which word means 'opinion'?"
    correct_option: "Părere"
    distractors: ["Trafic", "Parc"]
    accepted_answers: ["Părere"]

  ro.a2.unit22.lesson02.exercise02.choose_de_acord:
    instruction: "Which phrase means 'in agreement / agree'?"
    correct_option: "De acord"
    distractors: ["Cred că", "Pentru că"]
    accepted_answers: ["De acord"]

  ro.a2.unit22.lesson02.exercise03.listen_care_parerea:
    instruction: "Listen and select what you hear."
    correct_option: "Care este părerea dumneavoastră despre trafic"
    distractors: ["Nu sunt de acord. Cred că parcul este foarte frumos", "Cred că traficul este prea aglomerat"]
    accepted_answers: ["Care este părerea dumneavoastră despre trafic"]

  ro.a2.unit22.lesson02.exercise04.match_opinii2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Părere": "opinion"
      "De acord": "in agreement / agree"
      "Parc": "park"
      "Frumos": "beautiful"
      "Care este părerea dumneavoastră?": "What is your opinion?"
      "Sunt de acord cu dumneavoastră.": "I agree with you."
      "Nu sunt de acord.": "I don't agree."
      "Cred că traficul este aglomerat.": "I think the traffic is crowded."

  ro.a2.unit22.lesson02.exercise05.order_nu_sunt_de_acord:
    instruction: "Build the phrase: I don't agree."
    correct_response: ["Nu", "sunt", "de", "acord"]

  ro.a2.unit22.lesson02.exercise06.listen_order_care_parerea:
    instruction: "Listen, then put the words in order."
    correct_response: ["Care", "este", "părerea", "dumneavoastră", "despre", "trafic"]

  ro.a2.unit22.lesson02.exercise07.complete_nu_sunt_de_acord:
    instruction: "Complete the sentence: I agree with you."
    accepted_answers: ["acord", "Acord"]
    feedback: "Sunt de *acord* cu dumneavoastră -- *de acord* means 'in agreement.'"

  ro.a2.unit22.lesson02.exercise08.translate_i_dont_agree:
    instruction: "Translate into Romanian."
    accepted_answers:
      - "Nu sunt de acord. Cred că parcul este foarte frumos."
      - "Nu sunt de acord, cred că parcul este foarte frumos."
      - "Nu sunt de acord. Cred că parcul e foarte frumos."
      - "Nu sunt de acord, cred că parcul e foarte frumos."

  ro.a2.unit22.lesson03.exercise01.read_park_opinion:
    instruction: "Read the message. What does the writer think about the park near the city hall?"
    correct_option: "Este foarte frumos, dar mic."
    distractors:
      - "Este aglomerat și urât."
    accepted_answers:
      - "Este foarte frumos, dar mic."

  ro.a2.unit22.lesson03.exercise02.read_reason:
    instruction: "Read the message. What reason does the writer give for needing more parks?"
    correct_option: "Sunt multe familii cu copii."
    distractors:
      - "Traficul este aglomerat."
    accepted_answers:
      - "Sunt multe familii cu copii."

  ro.a2.unit22.lesson03.exercise03.listen_mesaj:
    instruction: "Listen and select what you hear."
    correct_option: "Orașul are nevoie de mai multe parcuri"
    distractors: ["Traficul este prea aglomerat", "Sunt de acord cu dumneavoastră"]
    accepted_answers: ["Orașul are nevoie de mai multe parcuri"]

  ro.a2.unit22.lesson03.exercise04.match_mesaj:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Orașul": "the city"
      "Are nevoie de": "needs"
      "Mai multe parcuri": "more parks"
      "Familii cu copii": "families with children"
      "Mic": "small"
      "Lângă primărie": "next to the city hall"

  ro.a2.unit22.lesson03.exercise05.complete_in_opinia_mea:
    instruction: "Complete the sentence: In my opinion, the city is interesting, but crowded."
    accepted_answers: ["interesant", "Interesant"]
    feedback: "Orașul este *interesant* -- 'interesting,' balanced against *aglomerat* ('crowded') with *dar* ('but')."

  ro.a2.unit22.lesson03.exercise06.write_opinion_with_reason:
    instruction: "Write in Romanian, using 'cred că' and 'pentru că': I think the city needs more parks, because there are many families with children."
    accepted_answers:
      - "Cred că orașul are nevoie de mai multe parcuri, pentru că sunt multe familii cu copii."

  ro.a2.unit22.lesson04.exercise01.choose_who_gives_traffic_opinion:
    instruction: "Who says this line?"
    correct_option: "Mihai"
    distractors: ["Ana"]
    accepted_answers: ["Mihai"]

  ro.a2.unit22.lesson04.exercise02.dialogue_comprehend_traffic_opinion:
    instruction: "Listen to the dialogue. What is Mihai's opinion about traffic, and why?"
    correct_option: "Este prea aglomerat, pentru că sunt multe mașini."
    distractors: ["Este foarte frumos, pentru că nu sunt mașini."]
    accepted_answers: ["Este prea aglomerat, pentru că sunt multe mașini."]

  ro.a2.unit22.lesson04.exercise03.dialogue_comprehend_park_opinion:
    instruction: "Listen to the dialogue. What does Ana say about the park?"
    correct_option: "Este foarte frumos."
    distractors: ["Este mic și aglomerat."]
    accepted_answers: ["Este foarte frumos."]

  ro.a2.unit22.lesson04.exercise04.dialogue_comprehend_city_opinion:
    instruction: "Listen to the dialogue. What is Mihai's overall opinion of the city?"
    correct_option: "Este interesant, dar aglomerat."
    distractors: ["Este mic, dar frumos."]
    accepted_answers: ["Este interesant, dar aglomerat."]

  ro.a2.unit22.lesson04.exercise05.order_sunt_de_acord_cu_dvs:
    instruction: "Build the sentence: I agree with you."
    correct_response: ["Sunt", "de", "acord", "cu", "dumneavoastră"]

  ro.a2.unit22.lesson04.exercise06.respond_as_mihai:
    instruction: "Take Mihai's role. Ana says the park is beautiful -- agree, then give your overall opinion of the city (interesting, but crowded)."
    accepted_answers:
      - "Da, sunt de acord. În opinia mea, orașul este interesant, dar aglomerat."
      - "Da, sunt de acord, în opinia mea orașul este interesant, dar aglomerat."

  ro.a2.unit22.lesson04.exercise07.write_conversation_summary:
    instruction: "Write in Romanian: Mihai thinks the traffic is too crowded, because there are many cars."
    accepted_answers:
      - "Mihai crede că traficul este prea aglomerat, pentru că sunt multe mașini."
      - "Mihai crede că traficul e prea aglomerat, pentru că sunt multe mașini."

  ro.a2.unit22.lesson02.exercise09.dictation_care_este_parerea_dumneavoastra_despre_trafic:
    instruction: "Type what you hear."
    correct_option: "Care este părerea dumneavoastră despre trafic"
    accepted_answers: [{value: "Care este părerea dumneavoastră despre trafic", status: correct}]
    orthography_strict: true
