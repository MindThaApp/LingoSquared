schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit12_past_events.yaml for full
    detail. This unit's source PDF (US Peace Corps Moldova's "Basic
    Romanian Language Lessons") was checked for past-tense/recent-event
    material and found real, directly relevant hits this time: "Ce ai
    lucrat în America?" (confirming the perfect compus aux+participle
    pattern), "Eu am fost student / inginer..." (directly confirming am
    fost, this unit's own core new grammar), the plain "Yesterday /
    Ieri" vocabulary entry, and a genuine "Cum a fost ziua? / A fost
    bine." mini-dialogue (reused as a STRUCTURE for this unit's own
    lesson03 exchange, not copied verbatim -- adapted to duminică and
    combined with this unit's own am mâncat/am băut material). The
    am mâncat/am băut extension of the pattern is freshly authored per
    AUTHORING_GUIDE #10, independently verified via WebSearch against
    general Romanian usage/dictionary sources rather than copied from
    the PD source. Glosses/notes here are freshly authored to explain
    the target-language forms to an English speaker.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    realization file's own review pass. Checked clean: correct_response/
    accepted_answers shapes match the realization's word_bank/pairs, no
    same-speaker distractor collisions, no stray YAML booleans, no
    jargon leaks, English glosses/notes are accurate translations of
    the Romanian forms as authored. Twelfth Romanian overlay, first
    draft, authored alongside the paired realization.

    Second-pass review 2026-10-19: 6 fixes - answer_policy.diacritics
    corrected (grader applies no diacritic/cedilla folding);
    teach.ieri_vocab note implied ieri was new, but it was taught in
    unit03 (rewritten); bine credited to unit06 in
    teach.reminder_cum_duminica_bine gloss and lesson03.exercise06
    feedback -> unit01; lesson01.exercise08 also accepts 'Am fost la
    cinema ieri.'; lesson03.exercise07 also accepts Ana's full line 'A
    fost bine! Am fost la parc.'; lesson03.exercise09 open writing
    prompt (any place, any food/drink) graded against park-only strings
    -> instruction now names park or cinema plus optional
    bread/tea/coffee, and cinema / single-item / ieri-final variants
    added. NATIVE FLAGS: see realization note (Sunday dialogue
    coherence).

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with
    comma-below ș/ț. Free-typed answers are graded against these
    standard spellings: the grader does not fold away omitted
    diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should
    type the full standard spelling.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    This unit's new grammar is entirely 1st-person (am fost/am mâncat/
    am băut, invariant for singular and plural) plus one fixed 3rd-
    person formulaic pair (Cum a fost...?/A fost bine!) taught only as
    an unanalyzed set phrase. No new second-person forms are
    introduced. Ana and Mihai's dialogue keeps their existing polite
    register with each other, matching unit06/unit07/unit08/unit09/
    unit10/unit11.

course:
  title: "Romanian A1"
  description: >-
    Describing a recent completed event in Romanian -- am fost (I was
    / I went), am mâncat (I ate), am băut (I drank), and the Cum a
    fost...?/A fost bine! how-was-it exchange -- continuing Ana and
    Mihai as they recap their Sunday at the park.

units:
  ro.a1.unit12.past_events:
    title: "Yesterday"

lessons:
  ro.a1.unit12.lesson01.am_fost_la_parc:
    title: "I went to the park"
  ro.a1.unit12.lesson02.am_mancat_am_baut:
    title: "I ate and I drank"
  ro.a1.unit12.lesson03.cum_a_fost_duminica:
    title: "How was Sunday?"

teaching:
  ro.a1.unit12.lesson01.teach.reminder_parc_cinema:
    title: "Reminder: parc, cinema"
    gloss: "parc (the park) · cinema (the cinema)"
    note: >-
      Both already established in unit11 -- here they combine with
      this unit's own new past-tense grammar.

  ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata:
    title: "Reminder: astăzi, mâine, duminică, sâmbătă"
    gloss: "astăzi (today) · mâine (tomorrow) · duminică (Sunday) · sâmbătă (Saturday)"
    note: >-
      All already established in unit03/unit11 -- here they set up the
      contrast with this lesson's own new *ieri* (yesterday).

  ro.a1.unit12.lesson01.teach.am_fost_vocab:
    title: "I was / I went"
    gloss: "Am fost (I was / I went)"
    note: "The perfect compus (past tense) of *a fi* (to be) -- *am* is the same invariant helper word for 'I' and 'we,' and *fost* is the fixed past form. Used with a place, *am fost la...* is the everyday, natural way to say 'I went to...' -- more common in speech than a literal 'I walked/traveled' verb."
    example_gloss:
      - "I went to the park."

  ro.a1.unit12.lesson01.teach.am_fost_parc_phrase:
    title: "I went to the park"
    gloss: "Am fost la parc. (I went to the park.)"
    note: "The complete pattern: am fost + la + place."

  ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase:
    title: "I went to the cinema"
    gloss: "Am fost la cinema. (I went to the cinema.)"
    note: "The same pattern as *Am fost la parc*, with a different place."

  ro.a1.unit12.lesson01.teach.ieri_vocab:
    title: "Yesterday"
    gloss: "Ieri (yesterday)"
    note: "Already met in unit03 next to *astăzi* (today) and *mâine* (tomorrow) -- now put to work with the past tense, placed at the start of a sentence to say when something happened."
    example_gloss:
      - "Yesterday I went to the park."

  ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase:
    title: "Yesterday I went to the park"
    gloss: "Ieri am fost la parc. (Yesterday I went to the park.)"
    note: "Adding *ieri* to the front of *Am fost la parc* pins down exactly when."

  ro.a1.unit12.lesson02.teach.reminder_mananc_beau:
    title: "Reminder: mănânc, beau"
    gloss: "mănânc (I eat) · beau (I drink)"
    note: >-
      Both already established in unit10's daily routine -- this
      lesson turns them into their past-tense forms.

  ro.a1.unit12.lesson02.teach.reminder_paine_cafea_ceai_si:
    title: "Reminder: pâine, cafea, ceai, și"
    gloss: "pâine (bread) · cafea (coffee) · ceai (tea) · și (and)"
    note: >-
      All already established in unit06/unit10 -- reused here in this
      lesson's own past-tense sentences.

  ro.a1.unit12.lesson02.teach.am_mancat_vocab:
    title: "I ate"
    gloss: "Am mâncat (I ate)"
    note: "The perfect compus of *a mânca* (to eat), already seen as *mănânc* (I eat, unit10) -- same verb, past tense. Am + mâncat, the same pattern as *am fost*."
    example_gloss:
      - "I ate bread."

  ro.a1.unit12.lesson02.teach.am_mancat_paine_phrase:
    title: "I ate bread"
    gloss: "Am mâncat pâine. (I ate bread.)"
    note: "The complete pattern: am mâncat + the food."

  ro.a1.unit12.lesson02.teach.am_baut_vocab:
    title: "I drank"
    gloss: "Am băut (I drank)"
    note: "The perfect compus of *a bea* (to drink), already seen as *beau* (I drink, unit10) -- same verb, past tense."
    example_gloss:
      - "I drank tea."

  ro.a1.unit12.lesson02.teach.am_baut_ceai_phrase:
    title: "I drank tea"
    gloss: "Am băut ceai. (I drank tea.)"
    note: "The complete pattern: am băut + the drink."

  ro.a1.unit12.lesson02.teach.am_mancat_am_baut_phrase:
    title: "I ate bread and drank tea"
    gloss: "Am mâncat pâine și am băut ceai. (I ate bread and drank tea.)"
    note: "Two past-tense actions joined with *și* -- the same connector unit10 already used for present-tense routines."

  ro.a1.unit12.lesson03.teach.reminder_am_fost_ieri_parc_cinema:
    title: "Reminder: am fost, ieri, parc, cinema"
    gloss: "am fost (I was / I went) · ieri (yesterday) · parc (the park) · cinema (the cinema)"
    note: "All from this unit's own lesson01 -- here they set up the Sunday recap."

  ro.a1.unit12.lesson03.teach.reminder_am_mancat_am_baut:
    title: "Reminder: am mâncat, am băut, pâine, cafea, ceai"
    gloss: "am mâncat (I ate) · am băut (I drank) · pâine (bread) · cafea (coffee) · ceai (tea)"
    note: "All from this unit's own lesson02 -- here Ana and Mihai each say what they had."

  ro.a1.unit12.lesson03.teach.reminder_cum_duminica_bine:
    title: "Reminder: cum, duminică, bine, mulțumesc, la revedere, Ana, Mihai"
    gloss: "cum (how, unit01/unit09) · duminică (Sunday, unit03) · bine (good/fine, unit01) · mulțumesc (thank you) · la revedere (goodbye) · Ana, Mihai (names)"
    note: >-
      All already established in earlier units -- *cum* was first seen
      asking someone's name (unit01) and asking directions (unit09), and
      here it opens a different kind of question: how something went.

  ro.a1.unit12.lesson03.teach.a_fost_vocab:
    title: "It was"
    gloss: "A fost (it was)"
    note: "A different person of the same verb as *am fost* -- *a* is the 'it/he/she' helper word, not the 'I/we' one. Learn *Cum a fost...?* and *A fost bine!* as fixed phrases for now, not a full pattern to build freely."
    example_gloss:
      - "It was good!"

  ro.a1.unit12.lesson03.teach.a_fost_bine_phrase:
    title: "It was good!"
    gloss: "A fost bine! (It was good!)"
    note: "A short, natural way to say something went well -- the answer to *Cum a fost...?*"

  ro.a1.unit12.lesson03.teach.cum_a_fost_duminica_phrase:
    title: "How was Sunday?"
    gloss: "Cum a fost duminică? (How was Sunday?)"
    note: "A natural way to open a conversation about a recent day, even with someone who was there too -- inviting them to share how it felt or what stood out."

  ro.a1.unit12.lesson03.teach.line01:
    title: "Greet and ask how Sunday was"
    gloss: "Mihai greets Ana and asks how Sunday was."
    note: "Combines this unit's own *Cum a fost duminică?* with the already-known *Bună*."

  ro.a1.unit12.lesson03.teach.line02:
    title: "Answer and say where"
    gloss: "Ana says it was good and that she went to the park."
    note: "Combines *A fost bine!* with lesson01's own *Am fost la parc*."

  ro.a1.unit12.lesson03.teach.line03:
    title: "Say what he ate and drank"
    gloss: "Mihai says he ate bread and drank tea."
    note: "Reuses lesson02's own *Am mâncat pâine și am băut ceai* -- matching Mihai's own established order from unit06 (pâine and ceai)."

  ro.a1.unit12.lesson03.teach.line04:
    title: "Say what she drank"
    gloss: "Ana says she drank coffee."
    note: "Matches Ana's own established order from unit06 (cafea)."

  ro.a1.unit12.lesson03.teach.line05:
    title: "Thank and say goodbye"
    gloss: "Mihai thanks Ana and says goodbye."
    note: "The same closing pattern every earlier unit's dialogue has ended on."

  ro.a1.unit12.lesson03.teach.line06:
    title: "Close the conversation"
    gloss: "Ana says goodbye back, using Mihai's name."
    note: "The same friendly closing pattern every earlier unit's dialogue has ended on."

exercises:
  ro.a1.unit12.lesson01.exercise01.choose_am_fost:
    instruction: "Which phrase means 'I was / I went'?"
    correct_option: "Am fost"
    distractors: ["Mergem", "Nu pot"]
    accepted_answers: ["Am fost"]

  ro.a1.unit12.lesson01.exercise02.choose_ieri:
    instruction: "Which word means 'yesterday'?"
    correct_option: "Ieri"
    distractors: ["Astăzi", "Mâine"]
    accepted_answers: ["Ieri"]

  ro.a1.unit12.lesson01.exercise03.listen_am_fost_la_parc:
    instruction: "Listen and select what you hear."
    correct_option: "Am fost la parc"
    distractors: ["Mergem la parc?", "Nu pot sâmbătă."]
    accepted_answers: ["Am fost la parc"]

  ro.a1.unit12.lesson01.exercise04.match_past_events1:
    instruction: "Match each word to its English meaning."
    correct_response:
      "Am fost": "I was / I went"
      "Ieri": "yesterday"
      "Parc": "the park"
      "Cinema": "the cinema"
      "Astăzi": "today"
      "Mâine": "tomorrow"
      "Duminică": "Sunday"
      "Sâmbătă": "Saturday"

  ro.a1.unit12.lesson01.exercise05.order_am_fost_la_parc:
    instruction: "Build the sentence: I went to the park."
    correct_response: ["Am", "fost", "la", "parc"]

  ro.a1.unit12.lesson01.exercise06.listen_order_ieri_am_fost_la_cinema:
    instruction: "Listen, then put the words in order."
    correct_response: ["Ieri", "am", "fost", "la", "cinema"]

  ro.a1.unit12.lesson01.exercise07.complete_am_fost_parc:
    instruction: "Complete the sentence: I went to the park."
    accepted_answers: ["fost", "Fost"]
    feedback: "Am *fost* la parc -- this lesson's own 'was / went' participle."

  ro.a1.unit12.lesson01.exercise08.speak_ieri_cinema:
    instruction: "Say aloud: Yesterday I went to the cinema."
    accepted_answers:
      - "Ieri am fost la cinema."
      - "Ieri am fost la cinema"
      - "Am fost la cinema ieri."

  ro.a1.unit12.lesson02.exercise01.choose_am_mancat:
    instruction: "Which phrase means 'I ate'?"
    correct_option: "Am mâncat"
    distractors: ["Am fost", "Am băut"]
    accepted_answers: ["Am mâncat"]

  ro.a1.unit12.lesson02.exercise02.choose_am_baut:
    instruction: "Which phrase means 'I drank'?"
    correct_option: "Am băut"
    distractors: ["Am mâncat", "Am fost"]
    accepted_answers: ["Am băut"]

  ro.a1.unit12.lesson02.exercise03.listen_am_mancat_paine:
    instruction: "Listen and select what you hear."
    correct_option: "Am mâncat pâine"
    distractors: ["Am băut cafea.", "Ieri am fost la cinema."]
    accepted_answers: ["Am mâncat pâine"]

  ro.a1.unit12.lesson02.exercise04.match_past_events2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Am mâncat": "I ate"
      "Am băut": "I drank"
      "Pâine": "bread"
      "Cafea": "coffee"
      "Ceai": "tea"
      "Și": "and"
      "Am fost": "I was / I went"
      "Ieri": "yesterday"

  ro.a1.unit12.lesson02.exercise05.order_am_mancat_paine:
    instruction: "Build the sentence: I ate bread."
    correct_response: ["Am", "mâncat", "pâine"]

  ro.a1.unit12.lesson02.exercise06.listen_order_am_baut_ceai:
    instruction: "Listen, then put the words in order."
    correct_response: ["Am", "băut", "ceai"]

  ro.a1.unit12.lesson02.exercise07.complete_am_baut_ceai:
    instruction: "Complete the sentence: I ate bread and I drank tea."
    accepted_answers: ["băut", "Băut"]
    feedback: "Am mâncat pâine și am *băut* ceai -- reusing unit10's *beau*, now in the past."

  ro.a1.unit12.lesson02.exercise08.speak_am_mancat_am_baut:
    instruction: "Say aloud: I ate bread and drank coffee."
    accepted_answers:
      - "Am mâncat pâine și am băut cafea."
      - "Am mâncat pâine și am băut cafea"

  ro.a1.unit12.lesson03.exercise01.choose_who_says_am_baut_cafea:
    instruction: "Who says this line?"
    correct_option: "Ana"
    distractors: ["Mihai"]
    accepted_answers: ["Ana"]

  ro.a1.unit12.lesson03.exercise02.dialogue_comprehend_cum_a_fost:
    instruction: "Listen to the dialogue. What did Ana drink?"
    correct_option: "Cafea."
    distractors: ["Ceai.", "Pâine."]
    accepted_answers: ["Cafea."]

  ro.a1.unit12.lesson03.exercise03.reading_comprehend_ieri:
    instruction: "Read the text. What did they eat?"
    correct_option: "Pâine."
    distractors:
      - "Ceai."
      - "Cafea."
    accepted_answers:
      - "Pâine."
      - "Pâine"

  ro.a1.unit12.lesson03.exercise04.match_unit_review:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Am fost": "I was / I went"
      "Ieri": "yesterday"
      "Parc": "the park"
      "Cinema": "the cinema"
      "Am mâncat": "I ate"
      "Am băut": "I drank"
      "Pâine": "bread"
      "Cafea": "coffee"
      "Ceai": "tea"
      "Cum": "how"

  ro.a1.unit12.lesson03.exercise05.order_cum_a_fost_duminica:
    instruction: "Build the sentence: How was Sunday?"
    correct_response: ["Cum", "a", "fost", "duminică"]

  ro.a1.unit12.lesson03.exercise06.complete_a_fost_bine:
    instruction: "Complete the sentence: It was good!"
    accepted_answers: ["bine", "Bine"]
    feedback: "A fost *bine* -- recalling *bine* (good / fine), known since unit01."

  ro.a1.unit12.lesson03.exercise07.respond_as_ana:
    instruction: "Take Ana's role. Mihai asks 'Cum a fost duminică?' -- tell him it was good."
    accepted_answers:
      - "A fost bine!"
      - "A fost bine"
      - "A fost bine! Am fost la parc."

  ro.a1.unit12.lesson03.exercise08.speak_am_mancat_am_baut_ceai:
    instruction: "Say aloud: I ate bread and drank tea."
    accepted_answers:
      - "Am mâncat pâine și am băut ceai."
      - "Am mâncat pâine și am băut ceai"

  ro.a1.unit12.lesson03.exercise09.write_recent_event:
    instruction: "Write a short message: say that yesterday you went to the park or to the cinema. You can add that you ate bread and drank tea or coffee."
    accepted_answers:
      - "Ieri am fost la parc."
      - "Ieri am fost la parc, am mâncat pâine și am băut ceai."
      - "Ieri am fost la parc. Am mâncat pâine și am băut ceai."
      - "Ieri am fost la parc și am băut cafea."
      - "Ieri am fost la parc, am mâncat pâine și am băut cafea."
      - "Ieri am fost la parc și am băut ceai."
      - "Ieri am fost la parc și am mâncat pâine."
      - "Am fost la parc ieri."
      - "Ieri am fost la cinema."
      - "Ieri am fost la cinema, am mâncat pâine și am băut ceai."
      - "Ieri am fost la cinema, am mâncat pâine și am băut cafea."
      - "Ieri am fost la cinema și am băut ceai."
      - "Ieri am fost la cinema și am băut cafea."
      - "Ieri am fost la cinema și am mâncat pâine."
      - "Am fost la cinema ieri."

  ro.a1.unit12.lesson02.exercise09.dictation_am_baut_ceai:
    instruction: "Type what you hear."
    correct_option: "Am băut ceai"
    accepted_answers: [{value: "Am băut ceai", status: correct}]
    orthography_strict: true
