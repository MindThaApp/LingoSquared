teaching:
  ro.a2.unit84.lesson01.teach.abilitati: {"title": "Skills", "gloss": "I know / I swim / I cook / I sing / I drive / guitar", "note": "*A ști să* + verb says that you have learned a skill.", "example_gloss": ["I know how to swim.", "I know how to cook.", "I know how to sing.", "I don't know how to drive."]}
  ro.a2.unit84.lesson01.teach.gn_stiu_sa: {"title": "*A ști să* for skills", "gloss": "I know how to swim. Do you know how to cook? Maria knows how to sing.", "note": "The forms are *știu*, *știi*, *știe*. The verb after *să* matches the person: *înot*, *gătești*, *cânte*."}
  ro.a2.unit84.lesson01.teach.gn_negare: {"title": "Skills you do not have", "gloss": "I don't know how to drive. Maria doesn't know how to cook.", "note": "*Nu* goes before *știu*. The verb after *să* is not negated."}
  ro.a2.unit84.lesson01.teach.gn_raspuns: {"title": "Short answers", "gloss": "Do you know how to swim? Yes, I do. No, I don't.", "note": "A short answer repeats only *știu*: *Da, știu. / Nu, nu știu.*"}
  ro.a2.unit84.lesson02.teach.zile: {"title": "Free and busy", "gloss": "today / but / free / busy / I come", "note": "*Ocupat* and *liber* describe a man; a woman says *ocupată* and *liberă*.", "example_gloss": ["On Saturday I can come.", "Tomorrow I can't come.", "Today I'm busy."]}
  ro.a2.unit84.lesson02.teach.gn_pot: {"title": "*A putea să* for circumstances", "gloss": "Tomorrow I can't come. On Saturday I can come.", "note": "*Pot să* says that something is possible for you at a certain time. It depends on the situation, not on a skill."}
  ro.a2.unit84.lesson02.teach.gn_contrast: {"title": "Skill versus situation", "gloss": "I know how to swim, but today I can't swim.", "note": "*Știu* is about what you have learned; *pot* is about whether you are free to do it now. Both can be true in one sentence."}
  ro.a2.unit84.lesson03.teach.petrecere: {"title": "Party words", "gloss": "the party / who / you help / he or she helps (after *să*) / he or she cooks (after *să*)", "note": "*Cine* ('who') takes the verb in the *he/she* form.", "example_gloss": ["The party is on Saturday.", "Who can help?", "Can you help me?", "Who knows how to cook?"]}
  ro.a2.unit84.lesson03.teach.gn_cine: {"title": "Questions with *cine*", "gloss": "Who can help? Who knows how to sing?", "note": "After *cine* the verb has the *he/she* form: *poate*, *știe*."}
  ro.a2.unit84.lesson03.teach.gn_poti_sa: {"title": "Asking a friend for help", "gloss": "Can you help me on Saturday? Yes, I can. No, I can't.", "note": "*Poți să mă ajuți?* asks about the other person's availability. The short answer repeats *pot*."}
  ro.a2.unit84.lesson03.teach.gn_ea: {"title": "He and she forms", "gloss": "Maria can come. Maria doesn't know how to sing.", "note": "For *Maria* the helper is *poate* or *știe* and the verb after *să* is *vină* or *cânte*."}
  ro.a2.unit84.lesson04.teach.plural: {"title": "We, you (plural), they", "gloss": "we can / you (plural) can / we know / you (plural) know / we come / you (plural) come / we cook", "note": "These are the plural forms of *a putea* and *a ști* with the matching verb after *să*.", "example_gloss": ["We can come on Saturday.", "Can you (plural) come?", "They can come.", "We know how to cook."]}
  ro.a2.unit84.lesson04.teach.gn_putea: {"title": "*A putea* in all persons", "gloss": "I can, you can, she can, we can, you (plural) can, they can.", "note": "The forms *pot* (*eu* and *ei*) look the same. The verb after *să* changes too: *să vin*, *să venim*, *să vină*."}
  ro.a2.unit84.lesson04.teach.gn_sti: {"title": "*A ști* in all persons", "gloss": "I know, you know, she knows, we know, you (plural) know, they know.", "note": "*Știu* is used for both *eu* and *ei*."}
  ro.a2.unit84.lesson05.teach.cuvinte: {"title": "Words for the messages", "gloss": "busy / me / you / to help / four", "note": "*Te* ('you') and *mă* ('me') come before the verb: *te ajut*, *mă ajuți*.", "example_gloss": ["I'm busy on Saturday.", "I can help you.", "I can come at four."]}
  ro.a2.unit84.lesson05.teach.invitatie: {"title": "Ana's invitation", "gloss": "Hi, Maria! The party is on Saturday. Who can come? I know how to cook, but I don't know how to sing. Mihai knows how to play the guitar, but he is busy on Saturday. Can you help me?", "note": "Ana uses *știu să* for skills and *poți să* for asking Maria."}
  ro.a2.unit84.lesson05.teach.raspuns: {"title": "Maria's reply", "gloss": "Hi, Ana! Yes, I can help you on Saturday. I know how to cook sarmale, but I don't know how to sing. Can I come at four?", "note": "Maria answers with *pot* for the situation and *știu* for her skills."}
  ro.a2.unit84.lesson06.teach.d1: {"title": "Ana invites", "gloss": "Ana: Mihai, the party is on Saturday. Can you come?"}
  ro.a2.unit84.lesson06.teach.d2: {"title": "Mihai can't come", "gloss": "Mihai: No, I can't come on Saturday. I'm busy."}
  ro.a2.unit84.lesson06.teach.d3: {"title": "Ana is sorry", "gloss": "Ana: What a pity! You know how to play the guitar."}
  ro.a2.unit84.lesson06.teach.d4: {"title": "Mihai asks about food", "gloss": "Mihai: Yes, I know how to play, but I can't on Saturday. Who knows how to cook?"}
  ro.a2.unit84.lesson06.teach.d5: {"title": "Ana can cook", "gloss": "Ana: I know how to cook. Maria can help me."}
  ro.a2.unit84.lesson06.teach.d6: {"title": "Mihai wishes a good party", "gloss": "Mihai: Perfect! Have a nice party!"}
  ro.a2.unit84.lesson06.teach.d7: {"title": "Ana thanks him", "gloss": "Ana: Thank you, Mihai!"}
