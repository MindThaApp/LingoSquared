    title: I use my phone every day
    gloss: I use my phone every day.
    note: '*În fiecare zi* means every day and goes after the verb phrase: *Folosesc telefonul în fiecare zi.*'
  ro.a1.unit35.lesson02.teach.aplicatia:
    title: The app
    gloss: the app
    example_gloss: I have an app for the weather forecast.
  ro.a1.unit35.lesson02.teach.mesajul:
    title: The message
    gloss: the message
    example_gloss: I'll send a message through the app.
  ro.a1.unit35.lesson02.teach.mesaj_este_neutru:
    title: 'Neuter nouns: *mesaj*'
    gloss: '*Mesaj* is a neuter noun: *un mesaj* (one), *două mesaje* (two). The definite article goes on the end: *mesajul*.'
    note: Ties the new word to the already-taught compound noun from the weather unit.
  ro.a1.unit35.lesson02.teach.ana_trimite_un:
    title: Ana sends a message through the app
    gloss: Ana sends a message through the app.
    note: '*Trimite* is the *ea* (she) form of *a trimite* (to send), and *prin aplicație* means through the app.'
  ro.a1.unit35.lesson02.teach.mihai_citeste_mesajul:
    title: Mihai reads the message
    gloss: Mihai reads the message.
  ro.a1.unit35.lesson03.teach.a_cauta:
    title: To look up
    gloss: to look up
    example_gloss: I look up the weather forecast.
  ro.a1.unit35.lesson03.teach.verbul_a_cauta:
    title: Verb endings change with the person
    gloss: '*A căuta* (to look up) changes with the person: *eu caut*, *tu cauți*. *A folosi* works the same way: *eu folosesc*, *tu folosești*.'
    note: The ending shows who does the action, so Romanian often leaves out *eu* and *tu*.
  ro.a1.unit35.lesson03.teach.andrei_cauta_prognoza:
    title: Andrei looks up the weather forecast
    gloss: Andrei looks up the weather forecast.
  ro.a1.unit35.lesson03.teach.apoi_merge_la:
    title: Then he goes running
    gloss: Then he goes running.
    note: '*Apoi* means then, and *merge la alergat* means goes running.'
  ro.a1.unit35.lesson04.teach.ana_hai_sa:
    title: Ana proposes
    gloss: 'Ana: Shall we exercise Saturday at ten?'
  ro.a1.unit35.lesson04.teach.mihai_buna_idee:
    title: Mihai agrees
    gloss: 'Mihai: Good idea! I''ll look up the weather forecast.'
    note: '*Bună idee!* means good idea; *bună* is feminine to agree with *idee*.'
  ro.a1.unit35.lesson04.teach.mihai_sambata_este:
    title: Mihai checks the weather
    gloss: 'Mihai: It''s sunny on Saturday!'
    note: '*Este soare* literally says it is sun: Romanian uses the noun *soare* for sunny weather.'
  ro.a1.unit35.lesson04.teach.andrei_vad_mesajul:
    title: Andrei sees the message
    gloss: 'Andrei: I see the message. See you Saturday!'
  ro.a1.unit35.lesson04.teach.stii_deja_la:
    title: See you + a day
    gloss: 'You already know *La revedere!* You can also name a day: *Ne vedem sâmbătă!*, *Ne vedem mâine!*'
    note: Extends the greetings unit's farewell pattern to a specific day.
  ro.a1.unit35.lesson05.teach.ana_il_suna:
    title: Who uses what?
    gloss: Ana calls Mihai every day. She uses her phone, not an app. Mihai has no computer at home, but he uses internet on his phone. Andrei looks up the weather forecast every morning. Then he goes running. Elena often sends Ana a message. Do you also use your phone every day?
    note: Compares all four characters' device habits, mirroring the sports unit's comparison-reading shape.
    glosses:
      sună: calls
      fiecare: every
      zi: day
      folosește: uses
      telefonul: phone
      aplicație: app
      computer: computer
      acasă: at home
      internet: internet
      caută: looks up
      dimineață: morning
      prognoza: weather forecast
      merge: goes
      alergat: running
      trimite: sends
      des: often
      mesaj: message
      Folosești: use
  ro.a1.unit35.lesson05.teach.andrei_cauta_in:
    title: Andrei looks up the forecast every morning
    gloss: Andrei looks up the weather forecast every morning.
  ro.a1.unit35.lesson05.teach.elena_trimite_des:
    title: Elena often messages Ana
    gloss: Elena often sends Ana a message.
  ro.a1.unit35.lesson06.teach.ana_vad_mesajul:
    title: Ana confirms the plan
    gloss: 'Ana: I see the message. Shall we exercise Saturday at ten in the park?'
  ro.a1.unit35.lesson06.teach.mihai_da_si:
    title: Mihai confirms the weather
    gloss: 'Mihai: Yes, and it''s sunny on Saturday!'
  ro.a1.unit35.lesson06.teach.andrei_atunci_alerg:
    title: Andrei's plan
    gloss: 'Andrei: I''ll run then. Afterward I''ll also play football.'
    note: '*După aceea* means afterwards; *joc* is the *eu* form of *a juca* (to play).'
  ro.a1.unit35.lesson06.teach.elena_eu_prefer:
    title: Elena's plan
    gloss: 'Elena: I''d rather swim, but I''m coming to the park too.'
    note: '*Prefer să înot* means I prefer to swim: *a prefera* + *să* + verb.'
  ro.a1.unit35.lesson06.teach.ana_super_ne:
    title: Ana closes the conversation
    gloss: 'Ana: Nice! See you Saturday in the park!'
    note: Closes both this unit's messaging thread and the sports unit's plan in one line.
