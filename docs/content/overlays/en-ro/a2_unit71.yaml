teaching:
  ro.a2.unit71.lesson01.teach.ecranul:
    title: The screen
    gloss: the screen
    note: '*Ecranul* is a masculine noun; the article *-ul* is attached to the end (*ecran* becomes *ecranul*).'
    example_gloss: I often look at my screen.
  ro.a2.unit71.lesson01.teach.folosesc_des_telefonul:
    title: Saying you use your phone often
    gloss: I use my phone often.
    note: '*Des* (often) usually comes after the verb or after the object: *Folosesc des telefonul* or *Folosesc telefonul des*.'
  ro.a2.unit71.lesson01.teach.cat_de_des:
    title: Asking how often someone uses social media
    gloss: How often do you use social media?
    note: '*Cât de des* (how often) starts the question. *Rețelele sociale* (social media) is a plural phrase; the article is attached to *rețele*.'
  ro.a2.unit71.lesson02.teach.aplicatia:
    title: The app
    gloss: the app
    note: '*Aplicația* is a feminine noun; the article *-a* is attached (*aplicație* becomes *aplicația*).'
    example_gloss: I use an app to chat.
  ro.a2.unit71.lesson02.teach.schimb_des_mesaje:
    title: Saying you chat with friends
    gloss: I often chat with friends on my phone.
    note: '*A schimba mesaje* (to exchange messages) is the everyday way to say you chat by text. *Prietenii* is *prieteni* (friends) with the article attached.'
  ro.a2.unit71.lesson02.teach.ce_aplicatii_folosesti:
    title: Asking which apps someone uses most
    gloss: Which apps do you use most?
    note: '*Cel mai mult* (the most) is the superlative form used to ask about the top choice. *Ce* + a noun means ''which'' or ''what''.'
  ro.a2.unit71.lesson03.teach.timpul_de_ecran:
    title: Screen time
    gloss: screen time
    note: '*Timpul de ecran* (screen time) is built from *timp* (time) and *ecran* (screen); the article attaches to the first word: *timpul*.'
    example_gloss: I have too much screen time this week.
  ro.a2.unit71.lesson03.teach.cred_ca_am:
    title: Giving an opinion about your own screen time
    gloss: I think I have too much screen time.
    note: '*Cred că ...* (I think that ...) is the standard way to introduce an opinion with a following clause; *că* is always needed.'
  ro.a2.unit71.lesson03.teach.nu_este_bine:
    title: Saying something isn't good for your eyes
    gloss: It's not good for your eyes.
    note: '*Ochii tăi* (your eyes) uses the informal possessive *tăi*, which follows the noun and matches this unit''s informal register.'
  ro.a2.unit71.lesson04.teach.obiceiul:
    title: The habit
    gloss: the habit
    note: '*Obiceiul* is a masculine noun with the article *-ul* attached.'
    example_gloss: It's a bad habit to keep checking your phone.
  ro.a2.unit71.lesson04.teach.dupa_parerea_mea:
    title: Giving an opinion with după părerea mea
    gloss: In my opinion, you should spend less time on your phone.
    note: '*După părerea mea* (in my opinion, literally ''after my opinion'') is another standard way to introduce a personal opinion, alongside *cred că*. *Ar trebui să* (should) is followed by a verb form with *să*.'
  ro.a2.unit71.lesson04.teach.sunt_de_acord:
    title: Agreeing with someone's opinion
    gloss: I agree with that.
    note: '*A fi de acord cu ceva* (to agree with something) is the set phrase; *asta* refers back to what was just said.'
  ro.a2.unit71.lesson05.teach.multi_oameni_isi:
    title: Reading a blog post about screen time
    gloss: Many people use their phone more than four hours a day. Social media is fun, but too much screen time isn't healthy. Try spending an hour every evening without your phone. That's good for your eyes and your sleep.
    note: '*Încearcă să petreci ...* (try to spend ...) uses *a încerca* + *să* + a verb form, a common construction for suggestions.'
    glosses:
      Mulți: many / a lot of
      oameni: people (plural of om)
      folosesc: use (they use; from a folosi)
      își: their
      telefonul: phone
      mai: more
      de: than (mai mult de = more than)
      patru: four
      ore: hour(s)
      zi: day
      sociale: social (adjective, from sociaal)
      Rețelele: networks (rețelele sociale = social media)
      sunt: are (from a fi)
      distractive: fun / nice
      dar: but
      mult: much (prea mult = too much)
      ecran: screen (timp de ecran = screen time)
      nu: not
      sănătos: healthy
      Încearcă: try (imperative of a încerca)
      fiecare: every / each
      seară: evening
      fără: without
      petreci: spend (a petrece = to spend time)
      Asta: that
      bine: good
      ochii: eyes (plural of ochi)
      somnul: sleep
  ro.a2.unit71.lesson06.teach.mihai_cat_de:
    title: Mihai asks how often
    gloss: 'Mihai: How often do you use social media, Ana?'
  ro.a2.unit71.lesson06.teach.ana_de_fapt:
    title: Ana answers with a number
    gloss: 'Ana: Actually pretty often. I do look at my screen about three hours a day.'
  ro.a2.unit71.lesson06.teach.mihai_este_destul:
    title: Mihai questions the amount
    gloss: 'Mihai: That''s quite a lot. Don''t you think that''s too much?'
  ro.a2.unit71.lesson06.teach.ana_ba_da:
    title: Ana agrees it's too much
    gloss: 'Ana: Yes, I actually think it''s too much. I want to spend less time on my phone.'
  ro.a2.unit71.lesson06.teach.mihai_poate_poti:
    title: Mihai suggests putting the phone away
    gloss: 'Mihai: Maybe you could put your phone away in the evenings.'
  ro.a2.unit71.lesson06.teach.ana_buna_idee:
    title: Ana agrees to try it
    gloss: 'Ana: Good idea. I''ll try that starting today.'
  ro.a2.unit71.lesson06.teach.ana_crede_ca:
    title: 'Third person: crede / are / vrea / ea'
    gloss: Ana thinks she has too much screen time. She wants to spend less time on her phone.
    note: '*Crede*, *are* and *vrea* are the third-person singular forms of *a crede* (to think), *a avea* (to have) and *a vrea* (to want). *Ea* (she) is the matching pronoun; Romanian often leaves it out because the verb ending already shows who is meant. After *vrea*, the next verb takes *să*: *vrea să petreacă*.'
