teaching:
  ro.a2.unit93.lesson01.teach.cuvinte: {"title": "Saying what others say", "gloss": "he or she says / that / he or she comes / later / ill (fem.)", "note": "*Spune că* introduces what someone says. *Că* means 'that'.", "example_gloss": ["Mihai says he is coming later.", "Ana says she is ill.", "Maria says she has time."]}
  ro.a2.unit93.lesson01.teach.gn_spune_ca: {"title": "*Spune că* + statement", "gloss": "Mihai says he is coming later. Ana says she is ill.", "note": "After *că* comes a normal sentence. Romanian keeps the same tense as in the original words: Mihai says *Vin mai târziu* and you report *spune că vine*."}
  ro.a2.unit93.lesson01.teach.gn_spun: {"title": "*A spune* in the present", "gloss": "I say that I'm coming. You say that you're tired. Maria says she has time.", "note": "The forms of *a spune* in the present: *spun*, *spui*, *spune*. The person in the *că* clause changes as in English."}
  ro.a2.unit93.lesson02.teach.cuvinte: {"title": "Said that", "gloss": "he or she said / he or she said (spoken) / told me / called", "note": "*A spus* and *a zis* both mean 'said'. *Mi-a spus* means 'told me'.", "example_gloss": ["Mihai said that he is coming later.", "Ana told me that she is ill.", "Maria said that she has time.", "Mihai called."]}
  ro.a2.unit93.lesson02.teach.gn_a_spus: {"title": "*A spus că* + statement", "gloss": "Mihai said that he is coming later. Maria said that she has time.", "note": "The reporting verb is in the past (*a spus*), but the verb after *că* keeps the tense of the original words: *vine*, *are*."}
  ro.a2.unit93.lesson02.teach.gn_mi_a_spus: {"title": "*Mi-a spus că*", "gloss": "Ana told me that she is ill. Mihai told me that he isn't coming.", "note": "*Mi-a spus* means 'told me'. Use *ți-a spus* for 'told you'."}
  ro.a2.unit93.lesson03.teach.cuvinte: {"title": "Passing on a question", "gloss": "he or she asks / he or she asked / you have time / the key / where", "note": "*Întreabă dacă* passes on a yes-or-no question. For a question word like *unde*, keep the question word.", "example_gloss": ["Ana asks if you are coming.", "Mihai asked if you have time.", "Maria asks where the key is."]}
  ro.a2.unit93.lesson03.teach.gn_intreaba_daca: {"title": "*Întreabă dacă*", "gloss": "Ana asks if you are coming. Mihai asked if you have time.", "note": "*Dacă* means 'if' or 'whether' and introduces a yes-or-no question. The verb keeps the person that fits the question."}
  ro.a2.unit93.lesson03.teach.gn_intreaba_unde: {"title": "*Întreabă unde / când*", "gloss": "Maria asks where the key is. Mihai asked when you are coming.", "note": "With *unde*, *când* or *cine* you do not need *dacă*. The word order stays as in a statement."}
  ro.a2.unit93.lesson04.teach.cuvinte: {"title": "Passing on instructions", "gloss": "tell him or her! / to (a person) / I come / on time / you forget", "note": "*Spune-i* is 'tell him or her' (an order to *tu*). *Lui* shows the person: *lui Mihai*.", "example_gloss": ["Tell Mihai that I'm coming.", "Mihai told me to come on time.", "Ana said not to forget the key."]}
  ro.a2.unit93.lesson04.teach.gn_a_spus_sa: {"title": "*A spus să* + verb", "gloss": "Mihai told me to come on time. Ana said not to forget the key.", "note": "*A spus să* + the *să* form of the verb passes on an instruction. The verb matches the person who must act."}
  ro.a2.unit93.lesson04.teach.gn_spune_i: {"title": "Asking someone to pass on a message", "gloss": "Tell Mihai that I'm coming. Tell him that I have time tomorrow.", "note": "Use *Spune-i* + *că* to ask someone to pass on your message. After *că* the sentence is normal."}
  ro.a2.unit93.lesson05.teach.cuvinte: {"title": "Words for the messages", "gloss": "message / something else / more, else / thank you", "note": "*Ce a mai spus?* asks 'what else did he say?'.", "example_gloss": ["Thank you for the message.", "What else did he say?", "What else did he say?"]}
  ro.a2.unit93.lesson05.teach.mesaj_ana: {"title": "Ana passes on Mihai's message", "gloss": "Hi, Maria! Mihai called. He said that he is coming later. He asked if you have time tomorrow. He said not to forget the key.", "note": "Ana passes on a statement (*a spus că*), a question (*a întrebat dacă*) and an instruction (*a spus să*)."}
  ro.a2.unit93.lesson05.teach.raspuns_maria: {"title": "Maria answers", "gloss": "Hi, Ana! Thank you for the message. Tell Mihai that I have time tomorrow. And tell him that I won't forget the key.", "note": "Maria uses *Spune-i* to send a message back."}
  ro.a2.unit93.lesson06.teach.d1: {"title": "Maria asks", "gloss": "Maria: Ana, did Mihai call?"}
  ro.a2.unit93.lesson06.teach.d2: {"title": "Ana tells her", "gloss": "Ana: Yes, he called. He said that he is coming later."}
  ro.a2.unit93.lesson06.teach.d3: {"title": "Maria asks for more", "gloss": "Maria: And what else did he say?"}
  ro.a2.unit93.lesson06.teach.d4: {"title": "Ana passes on a question", "gloss": "Ana: He asked if you have time tomorrow."}
  ro.a2.unit93.lesson06.teach.d5: {"title": "Maria answers", "gloss": "Maria: Yes, I have time. Tell Mihai that I'm coming."}
  ro.a2.unit93.lesson06.teach.d6: {"title": "Ana adds an instruction", "gloss": "Ana: Good. And he said not to forget the key."}
  ro.a2.unit93.lesson06.teach.d7: {"title": "Maria thanks her", "gloss": "Maria: Thank you for the message!"}
