  ro.a2.unit93.lesson03.exercise06.traduce_unde: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Maria întreabă unde este cheia.", "status": "correct"}, {"value": "Maria întreabă unde este cheia", "status": "correct"}, {"value": "Maria întreabă unde e cheia.", "status": "correct"}, {"value": "Maria întreabă unde e cheia", "status": "correct"}], "feedback": "*Maria întreabă unde este cheia.*"}
