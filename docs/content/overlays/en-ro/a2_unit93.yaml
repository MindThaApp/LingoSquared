  ro.a2.unit93.lesson06.exercise01.asculta_deschidere: {"instruction": "Listen and select Maria's opening question.", "correct_option": "Ana, a sunat Mihai?", "distractors": ["Ana, a spus Mihai ceva?", "Ana, ai timp mâine?", "Ana, vine Mihai?"], "accepted_answers": [{"value": "Ana, a sunat Mihai?", "status": "correct"}], "feedback": "Maria opens with *a sunat Mihai?*"}
  ro.a2.unit93.lesson06.exercise02.intelege_intrebare: {"instruction": "Listen to the dialogue and choose the answer.", "correct_option": "If Maria has time tomorrow.", "distractors": ["If Ana is ill.", "Where the key is.", "When the train leaves."], "accepted_answers": [{"value": "If Maria has time tomorrow.", "status": "correct"}], "feedback": "Ana says: *A întrebat dacă ai timp mâine.*"}
  ro.a2.unit93.lesson06.exercise03.une_dialog: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "A sunat Mihai?", "right": "Did Mihai call?"}, {"left": "A spus că vine mai târziu.", "right": "He said that he is coming later."}, {"left": "Ce a mai spus?", "right": "What else did he say?"}, {"left": "A întrebat dacă ai timp mâine.", "right": "He asked if you have time tomorrow."}, {"left": "Spune-i lui Mihai că vin.", "right": "Tell Mihai that I'm coming."}, {"left": "A spus să nu uiți cheia.", "right": "He said not to forget the key."}, {"left": "Da, am timp.", "right": "Yes, I have time."}, {"left": "Mulțumesc pentru mesaj!", "right": "Thank you for the message!"}], "status": "correct"}], "feedback": "These are the lines of the dialogue."}
  ro.a2.unit93.lesson06.exercise04.ordine_ce_a_mai_spus: {"instruction": "Put the words in order to say 'What else did he say?'", "correct_option": "Ce a mai spus", "accepted_answers": [{"value": "Ce a mai spus", "status": "correct"}], "feedback": "*Ce a mai spus?*"}
  ro.a2.unit93.lesson06.exercise05.raspunde_a_sunat: {"instruction": "Answer in Romanian: say yes, he called and he said that he is coming later.", "correct_option": "Da, a sunat. A spus că vine mai târziu.", "accepted_answers": [{"value": "Da, a sunat. A spus că vine mai târziu.", "status": "correct"}, {"value": "Da, a sunat. A spus că vine mai târziu", "status": "correct"}, {"value": "Da, a sunat. A zis că vine mai târziu.", "status": "correct"}, {"value": "Da, a sunat. A zis că vine mai târziu", "status": "correct"}, {"value": "Da, a sunat și a spus că vine mai târziu.", "status": "correct"}, {"value": "Da, a sunat și a spus că vine mai târziu", "status": "correct"}], "feedback": "*Da, a sunat. A spus că vine mai târziu.*"}
  ro.a2.unit93.lesson06.exercise06.traduce_a_spus_sa: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "A spus să nu uiți cheia.", "status": "correct"}, {"value": "A spus să nu uiți cheia", "status": "correct"}, {"value": "A zis să nu uiți cheia.", "status": "correct"}, {"value": "A zis să nu uiți cheia", "status": "correct"}], "feedback": "*A spus să nu uiți cheia.*"}
  ro.a2.unit93.lesson06.exercise07.scrie_doua: {"instruction": "Write exactly two sentences. Use *a spus că* in the first and *a întrebat dacă* in the second.", "correct_option": "Mihai a spus că vine mai târziu. A întrebat dacă ai timp mâine.", "accepted_answers": [{"value": "Mihai a spus că vine mai târziu. A întrebat dacă ai timp mâine.", "status": "correct"}, {"value": "Mihai a spus că vine mai târziu. A întrebat dacă ai timp mâine", "status": "correct"}, {"value": "Mihai a spus că vine mai târziu. Mihai a întrebat dacă ai timp mâine.", "status": "correct"}, {"value": "Mihai a spus că vine mai târziu. Mihai a întrebat dacă ai timp mâine", "status": "correct"}], "feedback": "*Mihai a spus că vine mai târziu. A întrebat dacă ai timp mâine.*"}
