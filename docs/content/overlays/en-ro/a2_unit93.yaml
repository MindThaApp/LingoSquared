  ro.a2.unit93.lesson05.exercise01.citeste_ana: {"instruction": "Read Ana's message and choose the answer.", "correct_option": "If she has time tomorrow.", "distractors": ["If she is ill.", "Where the key is.", "When the train leaves."], "accepted_answers": [{"value": "If she has time tomorrow.", "status": "correct"}], "feedback": "*A întrebat dacă ai timp mâine.*"}
  ro.a2.unit93.lesson05.exercise02.citeste_maria: {"instruction": "Read Maria's reply and choose the answer.", "correct_option": "That she has time tomorrow.", "distractors": ["That she is coming later.", "That she is ill.", "That she forgot the key."], "accepted_answers": [{"value": "That she has time tomorrow.", "status": "correct"}], "feedback": "*Spune-i lui Mihai că am timp mâine.*"}
