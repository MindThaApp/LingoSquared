  ro.a2.unit93.lesson04.exercise01.alege_sa: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Mihai mi-a spus să vin la timp.", "distractors": ["Mihai mi-a spus că vin la timp.", "Mihai mi-a spus să vine la timp.", "Mihai mi-a spus vin să la timp."], "accepted_answers": [{"value": "Mihai mi-a spus să vin la timp.", "status": "correct"}], "feedback": "An instruction uses *să* + verb."}
  ro.a2.unit93.lesson04.exercise02.alege_spune_i: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Spune-i lui Mihai că vin.", "distractors": ["Spune-i lui Mihai vin că.", "Spune-i lui Mihai să că vin.", "Spune-i lui Mihai dacă vin."], "accepted_answers": [{"value": "Spune-i lui Mihai că vin.", "status": "correct"}], "feedback": "*Spune-i* is the command 'tell him'."}
