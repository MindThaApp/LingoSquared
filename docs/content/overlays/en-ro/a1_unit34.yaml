  ro.a1.unit34.lesson04.teach.verbul_a_merge:
    title: The verb a merge
    gloss: 'The verb a merge changes with the person: eu merg, tu mergi, el merge cu bicicleta (I go, you go, he goes by bike).'
    note: '*A merge cu bicicleta* works like any verb: *merg*, *mergi*, *merge*; the phrase *cu bicicleta* stays the same.'
