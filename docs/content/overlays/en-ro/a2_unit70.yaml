teaching:
  ro.a2.unit70.lesson01.teach.intarzierea:
    title: The delay
    gloss: the delay
    note: '*Întârzierea* is a feminine noun; the definite article *-a* is attached to the end of the word (*întârziere* becomes *întârzierea*).'
    example_gloss: There's a delay of ten minutes.
  ro.a2.unit70.lesson01.teach.trenul_meu_are:
    title: Reporting your train is delayed
    gloss: My train is delayed.
    note: '*A avea întârziere* (literally ''to have delay'') is the usual way to say that a train or bus is running late.'
  ro.a2.unit70.lesson01.teach.care_este_motivul:
    title: Asking the reason for a delay
    gloss: What's the reason for the delay?
    note: '*Motivul* (the reason) is a masculine noun with the article *-ul* attached. *Întârzierii* is the genitive form of *întârzierea*, so *motivul întârzierii* means ''the reason of the delay''.'
  ro.a2.unit70.lesson02.teach.defectiunea_de_semnalizare:
    title: The signal failure
    gloss: the signal failure
    note: '*Defecțiunea de semnalizare* is how Romanian railway announcements describe a technical fault in the signalling system.'
    example_gloss: My train is cancelled because of a signal failure.
  ro.a2.unit70.lesson02.teach.trenul_meu_este:
    title: Reporting your train is cancelled
    gloss: My train is cancelled because of a signal failure.
    note: '*A fi anulat* (to be cancelled) is *este* + the participle *anulat*. *Din cauza* (because of) is followed by the genitive form: *din cauza unei defecțiuni*.'
  ro.a2.unit70.lesson02.teach.cand_pleaca_urmatorul:
    title: Asking when the next train leaves
    gloss: When does the next train leave?
    note: In *următorul tren* the article is attached to the adjective that comes first (*următor* becomes *următorul*), not to the noun. *A pleca* is used for a train leaving; *a circula* means to run.
  ro.a2.unit70.lesson03.teach.legatura:
    title: The connection
    gloss: the connection
    note: '*Legătura* is the usual word for a connecting train or bus; the ending *-a* is the attached article (*legătură* becomes *legătura*).'
    example_gloss: I'm missing my connection in Cluj.
  ro.a2.unit70.lesson03.teach.pierd_legatura_din:
    title: Reporting a missed connection
    gloss: I'm missing my connection because of the delay.
    note: '*A pierde* (to lose, to miss) takes a direct object: *pierd legătura*, *pierd trenul*.'
  ro.a2.unit70.lesson03.teach.pot_sa_iau:
    title: Asking about taking another train
    gloss: Can I take another train?
    note: '*Alt tren* (another train) uses *alt* before a masculine noun; before a feminine noun it becomes *altă*, as in *altă legătură*.'
  ro.a2.unit70.lesson04.teach.ghiseul_de_informatii:
    title: The service desk
    gloss: the service desk
    note: '*Ghișeul de informații* is the standard word for a station information desk. *Ghișeu* is masculine, so the article is *-ul*.'
    example_gloss: I'm going to the service desk for help.
  ro.a2.unit70.lesson04.teach.puteti_sa_ma:
    title: Asking for help with an alternative
    gloss: Can you help me with an alternative connection?
    note: '*Puteți* is the polite form of *a putea* (can), used with *dumneavoastră* (formal ''you'').'
  ro.a2.unit70.lesson04.teach.puteti_calatori_cu:
    title: Being told an alternative route
    gloss: You can travel with the intercity via Sibiu.
    note: '*Prin* (through, via) introduces the intermediate stop of an alternative route.'
  ro.a2.unit70.lesson05.teach.anunt_important_din:
    title: Reading a disruption notice
    gloss: 'Important notice: due to a signal failure, no trains are running between Cluj and Brașov. Travelers can reroute via Sibiu. The delay is expected to last until about three o''clock. We advise travelers to check the journey planner.'
    note: 'Romanian notices often use the 24-hour clock: *ora cincisprezece* (also written *ora 15:00*) is three o''clock in the afternoon.'
    glosses:
      important: important
      Anunț: notice, announcement
      cauza: cause (din cauza = because of)
      defecțiuni: failures (defecțiune de semnalizare = signal failure)
      circulă: run (of trains); drive
      între: between
      niciun: no, not any
      tren: train (singular; the plural is trenuri)
      Călătorii: travelers, passengers
      pot: can, are able to
      ocoli: to reroute, travel around
      prin: via, by way of
      Întârzierea: delay
      durează: lasts (from a dura)
      până: until
      aproximativ: about, approximately
      cincisprezece: fifteen
      ora: o'clock; hour
      Noi: we
      recomandăm: advise
      călătorilor: travelers, passengers
      planificatorul: journey planner
      consulte: to consult, check
  ro.a2.unit70.lesson06.teach.angajat_cfr_buna:
    title: Employee opens the conversation
    gloss: 'Employee: CFR, good afternoon. How can I help you?'
  ro.a2.unit70.lesson06.teach.ana_buna_ziua:
    title: Ana reports the cancellation
    gloss: 'Ana: Good afternoon, my train to Brașov is cancelled. I''d like to know how to get there now.'
  ro.a2.unit70.lesson06.teach.angajat_intr_adevar:
    title: Employee explains the cause
    gloss: 'Employee: There is indeed a signal failure. You can reroute via Sibiu.'
  ro.a2.unit70.lesson06.teach.ana_la_ce:
    title: Ana asks the departure time
    gloss: 'Ana: What time does that train leave?'
  ro.a2.unit70.lesson06.teach.angajat_peste_zece:
    title: Employee gives the platform and time
    gloss: 'Employee: In ten minutes, from platform four.'
  ro.a2.unit70.lesson06.teach.ana_va_multumesc:
    title: Ana decides to send a message
    gloss: 'Ana: Thank you. I''ll just send a message that I''m coming later.'
  ro.a2.unit70.lesson06.teach.trenul_ei_a:
    title: 'Passive perfect: a fost anulat, and ei / ea'
    gloss: Her train is cancelled. She can reroute.
    note: '*A fost anulat* (''has been cancelled'') is *a fost* + the participle *anulat*; it tells you something has already happened to the train. *Ei* (her) and *ea* (she) are the third-person feminine forms: *trenul ei* is her train and *ea poate* is ''she can''. The participle agrees with what was cancelled: *trenul a fost anulat* (masculine), *cursa a fost anulată* (feminine).'
