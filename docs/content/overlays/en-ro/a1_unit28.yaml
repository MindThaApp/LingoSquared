teaching:
  ro.a1.unit28.lesson01.teach.a_suna:
    title: To call
    gloss: to call
    note: The infinitive of the verb for making a phone call.
    example_gloss: I have to call you.
  ro.a1.unit28.lesson01.teach.te_sun:
    title: Saying you'll call
    gloss: I'll call you.
    note: '*Sun* is the *eu* form of *a suna* (to call); *te* ("you") goes before the verb, and Romanian uses the present tense where English says "will call".'
  ro.a1.unit28.lesson01.teach.alo_sunt_ana:
    title: Answering the phone
    gloss: Hello, this is Ana.
    note: '*Alo* is how you answer the phone; *sunt* + name says who you are, like English "this is".'
  ro.a1.unit28.lesson01.teach.alo_sunt_mihai:
    title: Mihai answers the same way
    gloss: Hello, this is Mihai.
    note: Same *Alo, sunt* + name pattern as *Alo, sunt Ana*.
  ro.a1.unit28.lesson02.teach.cu_cine_vorbesc:
    title: Asking who's calling
    gloss: Who am I speaking with?
    note: '*Cu cine vorbesc?* (literally "with whom am I speaking?") is the standard way to ask who an unfamiliar caller is.'
  ro.a1.unit28.lesson02.teach.vorbiti_cu_ana:
    title: Identifying yourself formally
    gloss: You're speaking with Ana.
    note: '*Vorbiți cu* + name is the formal answer: *vorbiți* is the *dumneavoastră* form of *a vorbi* (to speak).'
  ro.a1.unit28.lesson03.teach.poti_sa_repeti:
    title: Asking for repetition
    gloss: Can you repeat that?
    note: '*Poți să* ... (Can you ...?) plus *repeți* (you repeat) plus *asta* (that).'
  ro.a1.unit28.lesson03.teach.nu_vorbi_atat:
    title: Asking someone to slow down
    gloss: Don't speak so fast, please.
    note: '*Nu vorbi* ("don''t speak") is *nu* + the *tu* form; *atât de repede* means "so fast".'
  ro.a1.unit28.lesson03.teach.nu_te_aud:
    title: Saying you can't hear well
    gloss: I can't hear you well.
    note: '*Nu te aud bine*: *aud* is "I hear", *te* ("you") goes before the verb, and *bine* means "well".'
  ro.a1.unit28.lesson04.teach.mesajul:
    title: Text message
    gloss: the text message
    note: '*Mesaj* is masculine in the singular and feminine in the plural (*un mesaj*, *două mesaje*); the definite article attaches to the end: *mesajul*.'
    example_gloss: The text message is from Ana.
  ro.a1.unit28.lesson04.teach.iti_trimit_un:
    title: Saying you'll send a text
    gloss: I'll send you a text.
    note: '*Îți* ("to you") is a dative pronoun placed before the verb: *Îți trimit un mesaj*.'
  ro.a1.unit28.lesson04.teach.te_sun_inapoi:
    title: Saying you'll call back
    gloss: I'll call you back later.
    note: '*Înapoi* ("back") follows the verb: *te sun înapoi* is "I''ll call you back", and *mai târziu* means "later".'
  ro.a1.unit28.lesson05.teach.mihai_salut_ana:
    title: Read a text exchange
    gloss: 'Mihai: Hi Ana, can you call me? I need to tell you something. Ana: Yes of course, I''ll call you back in five minutes.'
    note: Track what Mihai asks for, why, and when Ana says she'll call back.
    glosses:
      Salut: hi
      poți: can
      suna: call
      Trebuie: need to / must
      ceva: something
      spun: tell
      sigur: of course
      sun: call
      cinci: five
      minute: minutes
      înapoi: back
  ro.a1.unit28.lesson06.teach.mihai_alo_sunt:
    title: Mihai answers the call
    gloss: 'Mihai: Hello, this is Mihai.'
    note: 'The same *Alo, sunt* + name pattern from lesson 1, now used in the actual call: the person who picks up speaks first and gives their name.'
  ro.a1.unit28.lesson06.teach.ana_salut_mihai:
    title: Ana identifies herself
    gloss: 'Ana: Hi Mihai, this is Ana. Mihai: Nice that you''re calling!'
    note: '*Ce bine că* ... ("how good that ...") expresses a positive reaction to an event; *suni* is the *tu* form of *a suna*.'
  ro.a1.unit28.lesson06.teach.ana_cum_a:
    title: Ana asks about the shift
    gloss: 'Ana: How was your first shift?'
    note: '*A fost* means "was" (past of *a fi*). It is a perfect compus, built like *am mâncat*; see the note after the next line.'
  ro.a1.unit28.lesson06.teach.mihai_a_mers:
    title: Mihai reports good news
    gloss: 'Mihai: It went really well, better than I thought.'
    note: '*A mers* is the past of *a merge* (to go, here "to turn out"); *credeam* means "I thought" (a past form of *a crede*).'
  ro.a1.unit28.lesson06.teach.a_fost_a:
    title: 'Past forms: a fost, a mers, credeam'
    gloss: was → to be, went → to go, thought → to think
    note: '*A fost* and *a mers* are perfect compus forms (*a* + participle) and *credeam* is an imperfect. For now, just memorise them as fixed phrases in the contexts they appear in this lesson; the full past-tense rules come at a later level.'
  ro.a1.unit28.lesson06.teach.ana_ma_bucur:
    title: Ana is proud
    gloss: 'Ana: How nice to hear! I''m proud of you.'
    note: '*Mândră de* ("proud of") is a fixed combination; *de* is required. A man says *mândru*.'
  ro.a1.unit28.lesson06.teach.mihai_iti_multumesc:
    title: Mihai is touched
    gloss: 'Mihai: Thank you, that means a lot to me.'
    note: '*Înseamnă* is the he/she/it form of *a însemna* (to mean); *pentru mine* ("for me") says who it matters to.'
  ro.a1.unit28.lesson06.teach.prima_lui_tura:
    title: His
    gloss: His first shift went really well.
    note: '*Lui* after the noun means "his": *prima lui tură*. (For "her" it is *ei*.)'
