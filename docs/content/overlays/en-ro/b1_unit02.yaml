    gloss: "works now"
    example_gloss: "Diana now works at Mihai's office."
  ro.b1.unit02.lesson05.teach.biroul_lui:
    title: "the office of"
    gloss: "the office of"
    note: "*biroul lui Mihai* -- 'Mihai's office,' the definite-noun-plus-*lui* possessive construction used with masculine names."
    example_gloss: "Diana works at Mihai's office."
  ro.b1.unit02.lesson05.teach.a_practicat:
