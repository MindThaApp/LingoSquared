  ro.b1.unit02.lesson04.teach.dialogue_ana_1:
    title: "Hello, Mihai! We have a new client. Can you speak English with him?"
    gloss: "Hello, Mihai! We have a new client. Can you speak English with him?"
  ro.b1.unit02.lesson04.teach.dialogue_mihai_1:
    title: "Yes, I can speak English well. It's not a problem."
