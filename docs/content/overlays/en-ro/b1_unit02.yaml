course:
  title: Romanian B1
  description: >-
    Intermediate Romanian: expressing present ability with a genuinely
    conjugating modal-plus-embedded-clause construction, and contrasting
    it with past and hypothetical ability, across everyday and
    workplace situations.

units:
  ro.b1.unit02.abilities:
    title: Abilities
    description: Express what you can, could, or would be able to do, using a conjugated modal plus a subordinate verb, in present, past, and hypothetical framing.

lessons:
  ro.b1.unit02.lesson01.present_ability_1st2nd:
    title: "I can / you can"
  ro.b1.unit02.lesson02.present_ability_all_persons:
    title: "All the persons"
  ro.b1.unit02.lesson03.past_and_hypothetical_ability:
    title: "I was able to / I would be able to"
  ro.b1.unit02.lesson04.dialogue_client_nou:
    title: "The new client"
  ro.b1.unit02.lesson05.reading_engleza_dianei:
    title: "Diana's English"
  ro.b1.unit02.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  ro.b1.unit02.lesson01.teach.pot:
    title: "(that) I can"
    gloss: "(that) I can"
    note: "*pot* -- unlike unit01's invariant *trebuie*, *a putea* genuinely conjugates for person. This is the contrast this unit is built around: a modal that changes form, plus a *să*-clause after it."
    example_gloss: "I can speak English."
  ro.b1.unit02.lesson01.teach.sa:
    title: "(that)"
    gloss: "(that) -- the subjunctive particle"
    note: "Same *să* + conjunctiv pattern as unit01's *trebuie* -- Romanian modals are always followed by *să* plus a conjugated verb, never a bare infinitive."
    example_gloss: "I can speak."
  ro.b1.unit02.lesson01.teach.poti:
    title: "(that) you can"
    gloss: "(that) you can"
    example_gloss: "Can you speak English?"
  ro.b1.unit02.lesson01.teach.vorbesc:
    title: "(that) I speak"
    gloss: "(that) I speak"
    note: "Conjunctiv 'I speak,' identical to the everyday indicativ form (as with unit01's pattern, 1st/2nd person conjunctiv usually matches indicativ)."
    example_gloss: "I can speak English."
  ro.b1.unit02.lesson01.teach.vorbesti:
    title: "(that) you speak"
    gloss: "(that) you speak"
    example_gloss: "Can you speak French?"
  ro.b1.unit02.lesson01.teach.grammar_conjugates:
    title: "I can speak. Can you speak?"
    gloss: "I can speak. Can you speak?"
    note: "*pot* changes to *poți* for 'you' -- unlike *trebuie*, which never changes at all. Keep both patterns straight: *trebuie* (invariant) vs *pot/poți/poate...* (fully conjugated)."
  ro.b1.unit02.lesson01.teach.engleza:
    title: English
    gloss: English
    example_gloss: "I can speak English."
  ro.b1.unit02.lesson01.teach.franceza:
    title: French
    gloss: French
    example_gloss: "Can you speak French?"
  ro.b1.unit02.lesson01.teach.bine:
    title: well
    gloss: well
    example_gloss: "Can you speak English well?"

  ro.b1.unit02.lesson02.teach.poate:
    title: "(that) he/she can"
    gloss: "(that) he/she can"
    example_gloss: "Mihai can speak Spanish."
  ro.b1.unit02.lesson02.teach.putem:
    title: "(that) we can"
    gloss: "(that) we can"
    example_gloss: "We can speak English."
  ro.b1.unit02.lesson02.teach.puteti:
    title: "(that) you (pl./formal) can"
    gloss: "(that) you (pl./formal) can"
    example_gloss: "Can you (formal) speak French?"
  ro.b1.unit02.lesson02.teach.vorbeasca:
    title: "(that) he/she/they speak"
    gloss: "(that) he/she/they speak"
    example_gloss: "Mihai can speak Spanish."
  ro.b1.unit02.lesson02.teach.vorbim:
    title: "(that) we speak"
    gloss: "(that) we speak"
    example_gloss: "We can speak English."
  ro.b1.unit02.lesson02.teach.vorbiti:
    title: "(that) you (pl./formal) speak"
    gloss: "(that) you (pl./formal) speak"
    example_gloss: "Can you (formal) speak French?"
  ro.b1.unit02.lesson02.teach.spaniola:
    title: Spanish
    gloss: Spanish
    example_gloss: "Mihai can speak Spanish."
  ro.b1.unit02.lesson02.teach.grammar_irregular:
    title: "I can. They can. He can. They can speak."
    gloss: "I can. They can. He can. They can speak."
    note: "A genuine irregularity: *pot* is used for BOTH 'I can' (eu pot) and 'they can' (ei pot) -- the same form, distinguished only by the subject. *poate* (he/she) is different from both. And as with unit01's *plece*, the conjunctiv verb after the modal is identical for 3rd singular and plural: *el/ei să vorbească*."

  ro.b1.unit02.lesson03.teach.am_putut:
    title: "I was able to / I could"
    gloss: "I was able to / I could"
    note: "*am putut* -- perfect compus of *a putea*, a completed past ability."
    example_gloss: "I was able to speak with them yesterday."
  ro.b1.unit02.lesson03.teach.as_putea:
    title: "I would be able to"
    gloss: "I would be able to"
    note: "*aș putea* -- conditional-optative, a hypothetical ability, genuinely distinct in mood from the completed past *am putut*."
    example_gloss: "I would be able to speak better with practice."
  ro.b1.unit02.lesson03.teach.cu:
    title: with
    gloss: with
    example_gloss: "I was able to speak with them yesterday."
  ro.b1.unit02.lesson03.teach.practica:
    title: practice
    gloss: practice
    example_gloss: "I would be able to speak better with practice."
  ro.b1.unit02.lesson03.teach.mai_bine:
    title: better
    gloss: better
    example_gloss: "I would be able to speak better."
  ro.b1.unit02.lesson03.teach.ieri:
    title: yesterday
    gloss: yesterday
    example_gloss: "I was able to speak yesterday."
  ro.b1.unit02.lesson03.teach.nu:
    title: not
    gloss: not
    example_gloss: "I could not speak French last year."
  ro.b1.unit02.lesson03.teach.anul_trecut:
    title: "last year"
    gloss: "last year"
    example_gloss: "I could not speak French last year."
  ro.b1.unit02.lesson03.teach.grammar_contrast:
    title: "I can speak. I was able to speak. I would be able to speak."
    gloss: "I can speak. I was able to speak. I would be able to speak."
    note: "Three genuinely different framings: *pot* (present ability), *am putut* (completed past ability), *aș putea* (hypothetical ability) -- not interchangeable."

  ro.b1.unit02.lesson04.teach.client:
    title: client
