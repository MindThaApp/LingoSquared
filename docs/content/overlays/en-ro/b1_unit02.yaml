  ro.b1.unit02.lesson06.teach.grammar_review:
    title: "I can speak, you can speak, he/she can speak, we can speak, you (pl./formal) can speak, they can speak. I was able to speak. I would be able to speak."
    gloss: "I can speak, you can speak, he/she can speak, we can speak, you (pl./formal) can speak, they can speak. I was able to speak. I would be able to speak."
    note: "Unlike unit01's fixed *trebuie*, every one of these forms of *a putea* genuinely changes: *pot/poți/poate/putem/puteți/pot*."
