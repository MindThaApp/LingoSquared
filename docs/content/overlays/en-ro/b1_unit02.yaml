  ro.b1.unit02.lesson04.teach.dialogue_ana_2:
    title: "Perfect! Last year, I couldn't help with foreign clients, but now I can speak a little French."
    gloss: "Perfect! Last year, I couldn't help with foreign clients, but now I can speak a little French."
  ro.b1.unit02.lesson04.teach.dialogue_mihai_2:
    title: "We can practice together tomorrow."
    gloss: "We can practice together tomorrow."
  ro.b1.unit02.lesson04.teach.dialogue_ana_3:
    title: "Thank you very much, Mihai!"
    gloss: "Thank you very much, Mihai!"
  ro.b1.unit02.lesson04.teach.dialogue_mihai_3:
