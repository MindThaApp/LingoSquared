schema_version: "1.1"
overlay_version: "2026.1-draft.1"
source_language: en
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Matches the paired realization's provenance -- see
    docs/content/realizations/ro/a1_unit18_housing.yaml for full detail.
    This unit's source PDF (US Peace Corps Moldova's "Basic Romanian
    Language Lessons") was checked for house/room/apartment material and
    found a real, on-topic hit: "Lesson 15: House Orientation," giving
    casă (house), dormitor (bedroom), baie (bathroom), bucătărie
    (kitchen), cameră (room), fereastră (window), and the fixed question
    "Unde este baia?" (Where is the bathroom?) -- all genuinely unused
    by the course so far (unit08's own provenance already recorded
    checking this same list and deliberately not using it, since it's
    interior-room vocabulary, not the common-public-places vocabulary
    that unit needed). "Apartament" and the new verb form "are" (he/she/
    it has) both come from a second real hit, Lesson 7's "Radu are un
    apartament." "Toaletă" (a near-synonym for "bathroom") was checked
    but deliberately not used, to avoid a true-synonym ambiguity with
    "baie." Glosses/notes here are freshly authored to explain the
    target-language forms to an English speaker.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), paired with the
    realization file's own review pass. Checked clean: correct_response/
    accepted_answers shapes match the realization's word_bank/pairs, no
    same-speaker distractor collisions, no stray YAML booleans, no
    jargon leaks, English glosses/notes are accurate translations of
    the Romanian forms as authored. Eighteenth Romanian overlay, first
    draft, authored alongside the paired realization.

    Second-pass review 2026-10-19: 7 fixes - answer_policy.diacritics
    corrected; casa_mare_phrase note (meaningless 'with no space
    before are', and false claim that magazinul shows the -a pattern)
    rewritten; fereastra_vocab note (apartamentul wrongly called 'the
    same pattern as casa') rewritten (-ul for neuter vs -a for
    feminine); lesson01.exercise03 listen_select distractor 'Mihai are
    un apartament mic.' (apartament untaught until lesson02) -> 'Ana
    are o cameră mare.'; lesson03.exercise06 instruction no longer
    prints a 'Bine! La ___' line Ana never says; lesson03.exercise07
    also accepts 'Este aproape.'/'Baia e aproape.';
    lesson03.exercise09 open 'your home' writing prompt pinned to
    Ana's or Mihai's home and 'și'/'Casa mea' variants added. NATIVE
    FLAGS: see realization note (camere counting kitchen/bathroom).

answer_policy:
  diacritics: >-
    Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with
    comma-below ș/ț. Free-typed answers are graded against these
    standard spellings: the grader does not fold away omitted
    diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should
    type the full standard spelling.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of the
    comma/exclamation mark/question mark.
  register: >-
    This unit's own new vocabulary (casă, apartament, cameră, dormitor,
    bucătărie, baie, fereastră) is used only in person-invariant
    third-person statements ("Ana are...", "Mihai are...", "Unde este
    baia?", "Casa mea este mare"). No new tu/dumneavoastră form is
    introduced this unit; Ana and Mihai keep their existing formal
    register with each other in the dialogue's greeting lines.

course:
  title: "Romanian A1"
  description: >-
    Describing a basic home in Romanian -- Casă (house), Apartament
    (apartment), Cameră (room), Dormitor (bedroom), Bucătărie (kitchen),
    Baie (bathroom), and Fereastră (window) -- as Mihai visits Ana's
    house and they talk about where they each live.

units:
  ro.a1.unit18.housing:
    title: "Housing"

lessons:
  ro.a1.unit18.lesson01.casa_anei:
    title: "Ana's house"
  ro.a1.unit18.lesson02.apartamentul_lui_mihai:
    title: "Mihai's apartment"
  ro.a1.unit18.lesson03.vizita_la_ana:
    title: "The visit to Ana's"

teaching:
  ro.a1.unit18.lesson01.teach.reminder_ana_mare:
    title: "Reminder: Ana, mare"
    gloss: "Ana (name) · mare (big)"
    note: "Ana is the character's name, established since Unit 1; *mare* is from Unit 5/Unit 14 -- this unit reuses both to describe her house."

  ro.a1.unit18.lesson01.teach.reminder_articole_trei:
    title: "Reminder: un, o, și, trei"
    gloss: "un/o (a, an) · și (and) · trei (three)"
    note: "*Un*/*o*/*și* are from Unit 5; *trei* is from Unit 2's counting -- this unit reuses all four to count and describe rooms."

  ro.a1.unit18.lesson01.teach.are_vocab:
    title: "Has"
    gloss: "Are (he/she/it has)"
    note: >-
      A new form of *a avea* (to have) -- you already know *am* (I
      have, from Unit 2/Unit 5) and *aveți* (you have, formal); *are*
      is the same verb's third-person form, used to say what someone
      or something has.

  ro.a1.unit18.lesson01.teach.casa_vocab:
    title: "House"
    gloss: "Casă (house)"
    note: "The place where someone lives."
    example_gloss:
      - "Ana has a big house."

  ro.a1.unit18.lesson01.teach.camera_vocab:
    title: "Room"
    gloss: "Cameră (room)"
    note: "A general word for a room in a home."
    example_gloss:
      - "Ana has a big room."

  ro.a1.unit18.lesson01.teach.camere_plural:
    title: "Cameră → camere"
    gloss: "cameră (room) · camere (rooms)"
    note: "The plural of *cameră* is *camere* -- used when counting more than one room."

  ro.a1.unit18.lesson01.teach.dormitor_vocab:
    title: "Bedroom"
    gloss: "Dormitor (bedroom)"
    note: "The room where someone sleeps."
    example_gloss:
      - "Ana has a bedroom."

  ro.a1.unit18.lesson01.teach.bucatarie_vocab:
    title: "Kitchen"
    gloss: "Bucătărie (kitchen)"
    note: "The room where someone cooks."
    example_gloss:
      - "Ana has a kitchen."

  ro.a1.unit18.lesson01.teach.baie_vocab:
    title: "Bathroom"
    gloss: "Baie (bathroom)"
    note: "The room with the bath/shower and toilet."
    example_gloss:
      - "Ana has a bathroom."

  ro.a1.unit18.lesson01.teach.casa_mare_phrase:
    title: "Ana has a big house. It has three rooms: a bedroom, a kitchen, and a bathroom."
    gloss: "Ana are o casă mare. Casa are trei camere: un dormitor, o bucătărie și o baie."
    note: "Every word here was already taught or just introduced, combined into two new sentences about Ana's house. *Casa* is the definite form of *casă* -- 'the house': a feminine noun ending in -ă swaps it for -a, like *banca* (the bank) in Unit 8."

  ro.a1.unit18.lesson02.teach.reminder_mihai_mic:
    title: "Reminder: Mihai, mic"
    gloss: "Mihai (name) · mic (small)"
    note: "Mihai is the character's name, established since Unit 1; *mic* is from Unit 14 -- this unit reuses both to describe his apartment."

  ro.a1.unit18.lesson02.teach.reminder_unde_este_doua:
    title: "Reminder: unde, este, două"
    gloss: "unde (where) · este (is) · două (two, feminine)"
    note: "*Unde*/*este* are from Unit 8/Unit 9; *două* is Unit 2's feminine form of 'two' -- this unit reuses all three to ask about and count rooms."

  ro.a1.unit18.lesson02.teach.apartament_vocab:
    title: "Apartment"
    gloss: "Apartament (apartment)"
    note: "Mihai's home -- a smaller alternative to Ana's house."
    example_gloss:
      - "Mihai has a small apartment."

  ro.a1.unit18.lesson02.teach.fereastra_vocab:
    title: "Window"
    gloss: "Fereastră (window)"
    note: "*Apartamentul* is the definite form of *apartament* -- 'the apartment': a neuter noun ending in a consonant adds -ul, like *magazinul* (the shop) in Unit 8 (feminine *casă* instead becomes *casa*)."
    example_gloss:
      - "The apartment has a big window."

  ro.a1.unit18.lesson02.teach.apartament_mic_phrase:
    title: "Mihai has a small apartment. It has two rooms: a bedroom and a kitchen."
    gloss: "Mihai are un apartament mic. Apartamentul are două camere: un dormitor și o bucătărie."
    note: "Every word here was already taught or just introduced, combined into two new sentences about Mihai's apartment."

  ro.a1.unit18.lesson02.teach.unde_este_baia_phrase:
    title: "Where is the bathroom?"
    gloss: "Unde este baia? (Where is the bathroom?)"
    note: "*Baia* is the definite form of *baie* -- 'the bathroom.' A useful real-world question when visiting someone's home."

  ro.a1.unit18.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: "Reminder: Bună, Ce mai faceți?, Bine, mulțumesc"
    gloss: "Bună (hi) · Ce mai faceți? (how are you, formal) · Bine, mulțumesc (fine, thank you)"
    note: "All from Unit 1's opening greeting, reused here to start this unit's own dialogue."

  ro.a1.unit18.lesson03.teach.reminder_la_revedere_mea_aproape_am:
    title: "Reminder: La revedere, Mea, Aproape, Am"
    gloss: "La revedere (goodbye) · Mea (my, feminine) · Aproape (near/close by) · Am (I have)"
    note: "*La revedere* is from Unit 1; *mea* is from Unit 5's *Mama mea*; *aproape* is from Unit 8/Unit 9's *Unde este...?* answers; *am* is from Unit 2/Unit 5 -- all reused here for the home-visit dialogue."

  ro.a1.unit18.lesson03.teach.line01:
    title: "Greet Ana and ask how she is"
    gloss: "Mihai greets Ana and asks how she's doing."
    note: "Reuses Unit 1's own *Ce mai faceți?* greeting."

  ro.a1.unit18.lesson03.teach.line02:
    title: "Answer and describe your house"
    gloss: "Ana answers, then tells Mihai her house is big with three rooms."
    note: "Combines Unit 1's *Bine, mulțumesc* with this unit's own lesson01 phrase."

  ro.a1.unit18.lesson03.teach.line03:
    title: "Ask where the bathroom is"
    gloss: "Mihai asks Ana where the bathroom is."
    note: "Reuses this unit's own lesson02 phrase almost exactly."

  ro.a1.unit18.lesson03.teach.line04:
    title: "Answer where the bathroom is"
    gloss: "Ana tells him it's close by."
    note: "Combines *baia* with *aproape*, the same 'where is...?' answer pattern Unit 8/Unit 9 already established."

  ro.a1.unit18.lesson03.teach.line05:
    title: "Describe your own apartment and say goodbye"
    gloss: "Mihai says he has a small apartment with two rooms, then says goodbye."
    note: "Combines this unit's own lesson02 phrase with Unit 1's closing line."

  ro.a1.unit18.lesson03.teach.line06:
    title: "Say goodbye"
    gloss: "Ana says goodbye."
    note: "The same closing pattern every earlier unit's dialogue has ended on."

exercises:
  ro.a1.unit18.lesson01.exercise01.choose_casa:
    instruction: "Which word means 'house'?"
    correct_option: "Casă"
    distractors: ["Cameră", "Dormitor"]
    accepted_answers: ["Casă"]

  ro.a1.unit18.lesson01.exercise02.choose_dormitor:
    instruction: "Which word means 'bedroom'?"
    correct_option: "Dormitor"
    distractors: ["Bucătărie", "Baie"]
    accepted_answers: ["Dormitor"]

  ro.a1.unit18.lesson01.exercise03.listen_ana_are_casa_mare:
    instruction: "Listen and select what you hear."
    correct_option: "Ana are o casă mare"
    distractors: ["Ana are o cameră mare.", "Casa are trei camere."]
    accepted_answers: ["Ana are o casă mare"]

  ro.a1.unit18.lesson01.exercise04.match_housing1:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Casă": "house"
      "Cameră": "room"
      "Dormitor": "bedroom"
      "Bucătărie": "kitchen"
      "Baie": "bathroom"
      "Mare": "big"
      "Ana are o casă mare.": "Ana has a big house."
      "Casa are trei camere.": "The house has three rooms."

  ro.a1.unit18.lesson01.exercise05.order_ana_are_casa_mare:
    instruction: "Build the sentence: Ana has a big house."
    correct_response: ["Ana", "are", "o", "casă", "mare"]

  ro.a1.unit18.lesson01.exercise06.listen_order_casa_are_trei_camere:
    instruction: "Listen, then put the words in order."
    correct_response: ["Casa", "are", "trei", "camere"]

  ro.a1.unit18.lesson01.exercise07.complete_casa_camere:
    instruction: "Complete the sentence: The house has a bedroom, a kitchen, and a bathroom."
    accepted_answers: ["dormitor", "Dormitor"]
    feedback: "Casa are un *dormitor* -- *dormitor* is the word for 'bedroom.'"

  ro.a1.unit18.lesson01.exercise08.speak_ana_are_casa_mare:
    instruction: "Say aloud: Ana has a big house."
    accepted_answers:
      - "Ana are o casă mare."
      - "Ana are o casă mare"

  ro.a1.unit18.lesson02.exercise01.choose_apartament:
    instruction: "Which word means 'apartment'?"
    correct_option: "Apartament"
    distractors: ["Casă", "Fereastră"]
    accepted_answers: ["Apartament"]

  ro.a1.unit18.lesson02.exercise02.choose_fereastra:
    instruction: "Which word means 'window'?"
    correct_option: "Fereastră"
    distractors: ["Bucătărie", "Cameră"]
    accepted_answers: ["Fereastră"]

  ro.a1.unit18.lesson02.exercise03.listen_mihai_are_apartament_mic:
    instruction: "Listen and select what you hear."
    correct_option: "Mihai are un apartament mic"
    distractors: ["Ana are o casă mare.", "Apartamentul are o fereastră mare."]
    accepted_answers: ["Mihai are un apartament mic"]

  ro.a1.unit18.lesson02.exercise04.match_housing2:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Apartament": "apartment"
      "Fereastră": "window"
      "Mic": "small"
      "Unde": "where"
      "Este": "is"
      "Baia": "the bathroom"
      "Mihai are un apartament mic.": "Mihai has a small apartment."
      "Unde este baia?": "Where is the bathroom?"

  ro.a1.unit18.lesson02.exercise05.order_mihai_are_apartament_mic:
    instruction: "Build the sentence: Mihai has a small apartment."
    correct_response: ["Mihai", "are", "un", "apartament", "mic"]

  ro.a1.unit18.lesson02.exercise06.listen_order_unde_este_baia:
    instruction: "Listen, then put the words in order."
    correct_response: ["Unde", "este", "baia"]

  ro.a1.unit18.lesson02.exercise07.complete_apartament_camere:
    instruction: "Complete the sentence: The apartment has two rooms -- a bedroom and a kitchen."
    accepted_answers: ["două", "Două"]
    feedback: "Apartamentul are *două* camere -- *două* is the feminine form of 'two,' used with *camere.'"

  ro.a1.unit18.lesson02.exercise08.speak_unde_este_baia:
    instruction: "Say aloud: Where is the bathroom?"
    accepted_answers:
      - "Unde este baia?"
      - "Unde este baia"

  ro.a1.unit18.lesson03.exercise01.choose_who_says_line04:
    instruction: "Who says this line?"
    correct_option: "Ana"
    distractors: ["Mihai"]
    accepted_answers: ["Ana"]

  ro.a1.unit18.lesson03.exercise02.dialogue_comprehend_ana_camere:
    instruction: "Listen to the dialogue. How many rooms does Ana's house have?"
    correct_option: "Trei camere."
    distractors: ["Patru camere."]
    accepted_answers: ["Trei camere."]

  ro.a1.unit18.lesson03.exercise03.reading_comprehend_mihai_camere:
    instruction: "Read the note. How many rooms does Mihai's apartment have?"
    correct_option: "Două camere."
    distractors:
      - "Trei camere."
      - "Cinci camere."
    accepted_answers:
      - "Două camere."
      - "Doua camere."

  ro.a1.unit18.lesson03.exercise04.match_unit_review:
    instruction: "Match each word or phrase to its English meaning."
    correct_response:
      "Casă": "house"
      "Apartament": "apartment"
      "Cameră": "room"
      "Dormitor": "bedroom"
      "Bucătărie": "kitchen"
      "Baie": "bathroom"
      "Fereastră": "window"
      "Casa mea este mare.": "My house is big."

  ro.a1.unit18.lesson03.exercise05.order_casa_mea_mare:
    instruction: "Build the sentence: My house is big."
    correct_response: ["Casa", "mea", "este", "mare"]

  ro.a1.unit18.lesson03.exercise06.complete_la_revedere:
    instruction: "Complete Ana's goodbye."
    accepted_answers: ["revedere", "Revedere"]
    feedback: "La *revedere* -- the standard way to say goodbye, from Unit 1."

  ro.a1.unit18.lesson03.exercise07.respond_as_ana:
    instruction: "Take Ana's role. Mihai asks 'Unde este baia?' -- tell him it's close by."
    accepted_answers:
      - "Baia este aproape."
      - "Baia este aproape"
      - "Este aproape."
      - "Baia e aproape."

  ro.a1.unit18.lesson03.exercise08.speak_casa_mea_mare:
    instruction: "Say aloud: My house is big. It has three rooms."
    accepted_answers:
      - "Casa mea este mare. Are trei camere."
      - "Casa mea este mare, are trei camere."
      - "Casa mea este mare și are trei camere."

  ro.a1.unit18.lesson03.exercise09.write_home_description:
    instruction: "Write as Ana or as Mihai from this unit: say what home you have (a big house or a small apartment) and how many rooms it has."
    accepted_answers:
      - "Am o casă mare."
      - "Am un apartament mic."
      - "Casa are un dormitor."
      - "Apartamentul are o bucătărie."
      - "Am o casă mare. Are trei camere."
      - "Am o casă mare, are trei camere."
      - "Am un apartament mic. Are două camere."
      - "Am un apartament mic, are două camere."
      - "Am o casă mare și are trei camere."
      - "Am un apartament mic și are două camere."
      - "Casa mea este mare. Are trei camere."
      - "Casa mea este mare, are trei camere."

  ro.a1.unit18.lesson02.exercise09.dictation_unde_este_baia:
    instruction: "Type what you hear."
    correct_option: "Unde este baia"
    accepted_answers: [{value: "Unde este baia", status: correct}]
    orthography_strict: true
