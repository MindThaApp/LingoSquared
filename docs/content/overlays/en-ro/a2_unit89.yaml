  ro.a2.unit89.lesson03.exercise06.traduce_cand: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Mâncăm când vine Mihai.", "status": "correct"}, {"value": "Mâncăm când vine Mihai", "status": "correct"}, {"value": "Când vine Mihai, mâncăm.", "status": "correct"}, {"value": "Când vine Mihai, mâncăm", "status": "correct"}, {"value": "Când Mihai vine, mâncăm.", "status": "correct"}, {"value": "Când Mihai vine, mâncăm", "status": "correct"}], "feedback": "*Mâncăm când vine Mihai.*"}
  ro.a2.unit89.lesson03.exercise07.scrie_cand: {"instruction": "Write the requested sentence with *când*.", "correct_option": "Când ajung acasă, te sun.", "accepted_answers": [{"value": "Când ajung acasă, te sun.", "status": "correct"}, {"value": "Când ajung acasă, te sun", "status": "correct"}, {"value": "Te sun când ajung acasă.", "status": "correct"}, {"value": "Te sun când ajung acasă", "status": "correct"}], "feedback": "*Când ajung acasă, te sun.*"}
  ro.a2.unit89.lesson04.exercise01.alege_mai_intai: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Mai întâi mănânc, apoi spăl vasele.", "distractors": ["Mai întâi spăl vasele, apoi mănânc.", "Apoi mănânc, mai întâi spăl vasele.", "Mai întâi mănânc, mai întâi spăl vasele."], "accepted_answers": [{"value": "Mai întâi mănânc, apoi spăl vasele.", "status": "correct"}], "feedback": "*Mai întâi* is the first step, *apoi* the next."}
  ro.a2.unit89.lesson04.exercise02.alege_dinti: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Mă spăl pe dinți înainte să mă culc.", "distractors": ["Mă spăl pe dinți după ce mă culc.", "Mă spăl pe dinți înainte mă culc.", "Mă spăl pe dinți înainte să culc."], "accepted_answers": [{"value": "Mă spăl pe dinți înainte să mă culc.", "status": "correct"}], "feedback": "*Înainte să mă culc* means 'before I go to bed'."}
  ro.a2.unit89.lesson04.exercise03.une_ordine: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Mai întâi mănânc, apoi spăl vasele.", "right": "First I eat, then I wash the dishes."}, {"left": "Mai întâi sun, apoi plec.", "right": "First I call, then I leave."}, {"left": "Mă spăl pe dinți înainte să mă culc.", "right": "I brush my teeth before I go to bed."}, {"left": "Mă spăl pe mâini după ce mănânc.", "right": "I wash my hands after I eat."}, {"left": "mai întâi", "right": "first"}, {"left": "apoi", "right": "then"}, {"left": "la sfârșit", "right": "in the end"}, {"left": "dinții", "right": "the teeth"}], "status": "correct"}], "feedback": "These expressions give the order of steps."}
