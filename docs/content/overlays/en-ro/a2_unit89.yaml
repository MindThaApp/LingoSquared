  ro.a2.unit89.lesson01.exercise01.alege_inainte: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Înainte să mănânc, mă spăl pe mâini.", "distractors": ["După ce mănânc, mă spăl pe mâini.", "Înainte mănânc, mă spăl pe mâini.", "Înainte să mănânci, mă spăl pe mâini."], "accepted_answers": [{"value": "Înainte să mănânc, mă spăl pe mâini.", "status": "correct"}], "feedback": "*Înainte să* + the *eu* form means 'before I'."}
  ro.a2.unit89.lesson01.exercise02.alege_ana: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Ana bea cafea înainte să plece.", "distractors": ["Ana bea cafea înainte să plec.", "Ana bea cafea înainte plece.", "Ana bea cafea după ce plece."], "accepted_answers": [{"value": "Ana bea cafea înainte să plece.", "status": "correct"}], "feedback": "For *Ana* the verb after *să* is *plece*."}
  ro.a2.unit89.lesson01.exercise03.une_inainte: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Înainte să mănânc, mă spăl pe mâini.", "right": "Before I eat, I wash my hands."}, {"left": "Înainte să plec, sun acasă.", "right": "Before I leave, I call home."}, {"left": "Ana bea cafea înainte să plece.", "right": "Ana drinks coffee before she leaves."}, {"left": "Mihai citește înainte să doarmă.", "right": "Mihai reads before he sleeps."}, {"left": "înainte să", "right": "before (doing)"}, {"left": "mănânc", "right": "I eat"}, {"left": "plec", "right": "I leave"}, {"left": "mâinile", "right": "the hands"}], "status": "correct"}], "feedback": "These are the expressions for 'before'."}
