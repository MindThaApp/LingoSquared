teaching:
  ro.a2.unit89.lesson01.teach.cuvinte: {"title": "Before", "gloss": "before (doing) / I eat / I leave / I wash myself / hands", "note": "*Înainte să* + verb means 'before (doing)'. The verb has a *să* form, which is the same as the present for *eu*, *tu*, *noi*: *mănânc*, *mănânci*.", "example_gloss": ["Before I eat, I wash my hands.", "Before I leave, I call home.", "Ana drinks coffee before she leaves.", "Mihai reads before he sleeps."]}
  ro.a2.unit89.lesson01.teach.gn_inainte: {"title": "*Înainte să* + verb", "gloss": "Before I eat, I wash my hands. Before I leave, I call home.", "note": "The verb after *înainte să* is in the *să* form: *să mănânc*, *să plec*. The main clause stays in the present."}
  ro.a2.unit89.lesson01.teach.gn_el_ea: {"title": "With *el* and *ea*", "gloss": "Ana drinks coffee before she leaves. Mihai reads before he sleeps.", "note": "For *el* and *ea* the *să* form changes: *să plece*, *să doarmă*. The clause can also come second, without a comma."}
  ro.a2.unit89.lesson02.teach.cuvinte: {"title": "After", "gloss": "after / I wash / the dishes / I arrive / home", "note": "*După ce* means 'after' and is followed by a normal verb, not the *să* form.", "example_gloss": ["After I eat, I wash the dishes.", "After I ate, I washed the dishes.", "After he gets home, Mihai reads.", "After I arrived, I called."]}
  ro.a2.unit89.lesson02.teach.gn_dupa_prezent: {"title": "*După ce* + present", "gloss": "After I eat, I wash the dishes. After he gets home, Mihai reads.", "note": "For habits, both clauses are in the present. After *după ce* there is no *să*."}
  ro.a2.unit89.lesson02.teach.gn_dupa_trecut: {"title": "*După ce* + past", "gloss": "After I ate, I washed the dishes. After I arrived, I called.", "note": "For something that already happened, both clauses are in the perfect compus: *am mâncat*, *am spălat*."}
  ro.a2.unit89.lesson03.teach.cuvinte: {"title": "When", "gloss": "when / I call you / we eat / he or she comes / it rains", "note": "*Când* introduces a time clause. *Te sun* means 'I call you'.", "example_gloss": ["When I get home, I'll call you.", "We eat when Mihai comes.", "When it rains, I stay home."]}
  ro.a2.unit89.lesson03.teach.gn_cand: {"title": "*Când* + present", "gloss": "When I get home, I'll call you. When Mihai comes, we eat.", "note": "Romanian uses the present after *când*, even when English says 'will' or 'when I get'. Both clauses are in the present."}
  ro.a2.unit89.lesson03.teach.gn_cand_mijloc: {"title": "*Când* in the middle", "gloss": "We eat when Mihai comes. I stay home when it rains.", "note": "The *când* clause can come first or second. When it comes first, there is a comma."}
  ro.a2.unit89.lesson04.teach.cuvinte: {"title": "Words for the order", "gloss": "first / then / in the end / the teeth", "note": "*Mai întâi*, *apoi* and *la sfârșit* give the order of steps. *Mă spăl pe dinți* is 'I brush my teeth'.", "example_gloss": ["First I eat, then I wash the dishes.", "First I eat, then I wash the dishes, in the end I go to bed.", "I brush my teeth before I go to bed."]}
  ro.a2.unit89.lesson04.teach.gn_mai_intai: {"title": "*Mai întâi* ... *apoi*", "gloss": "First I eat, then I wash the dishes. First I call, then I leave.", "note": "*Mai întâi* names the first step and *apoi* the next one. The verb stays in the present."}
  ro.a2.unit89.lesson04.teach.gn_contrast: {"title": "Before and after", "gloss": "I brush my teeth before I go to bed. I wash my hands after I eat.", "note": "*Înainte să* + *să* form says what comes later. *După ce* + present says what came first. Same order of events, different clause."}
  ro.a2.unit89.lesson05.teach.cuvinte: {"title": "Words for the day", "gloss": "the day / a little / work / I go to bed", "note": "*Puțin* means 'a little'. *Mă culc* is 'I go to bed'.", "example_gloss": ["My day starts early.", "I read a little.", "I go to work."]}
  ro.a2.unit89.lesson05.teach.mesaj_maria: {"title": "Maria writes about her day", "gloss": "Hi, Ana! In the morning, first I drink coffee. After I drink coffee, I go to work. Before I leave, I call home. When I get home, I eat, then I read a little.", "note": "Maria uses all the time words: *mai întâi*, *după ce*, *înainte să*, *când* and *apoi*."}
  ro.a2.unit89.lesson05.teach.raspuns_ana: {"title": "Ana answers", "gloss": "Hi, Maria! I brush my teeth before I go to bed. After I eat, I wash the dishes. When I'm tired, I go to bed early.", "note": "Ana gives her own order of events."}
  ro.a2.unit89.lesson06.teach.d1: {"title": "Ana asks about the evening", "gloss": "Ana: Mihai, what do you do in the evening, after you get home?"}
  ro.a2.unit89.lesson06.teach.d2: {"title": "Mihai lists his steps", "gloss": "Mihai: First I eat, then I wash the dishes."}
  ro.a2.unit89.lesson06.teach.d3: {"title": "Ana asks about bedtime", "gloss": "Ana: And before you sleep?"}
  ro.a2.unit89.lesson06.teach.d4: {"title": "Mihai answers", "gloss": "Mihai: Before I sleep, I read a little. And you?"}
  ro.a2.unit89.lesson06.teach.d5: {"title": "Ana answers", "gloss": "Ana: I call home after I eat."}
  ro.a2.unit89.lesson06.teach.d6: {"title": "Mihai plans tomorrow", "gloss": "Mihai: Tomorrow we're eating together. When you get home, will you call me?"}
  ro.a2.unit89.lesson06.teach.d7: {"title": "Ana agrees", "gloss": "Ana: Yes! I'll call you after I get home."}
