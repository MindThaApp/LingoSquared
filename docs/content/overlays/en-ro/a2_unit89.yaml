  ro.a2.unit89.lesson02.exercise07.scrie_dupa: {"instruction": "Write the requested sentence with *după ce*.", "correct_option": "După ce am mâncat, am spălat vasele.", "accepted_answers": [{"value": "După ce am mâncat, am spălat vasele.", "status": "correct"}, {"value": "După ce am mâncat, am spălat vasele", "status": "correct"}, {"value": "Am spălat vasele după ce am mâncat.", "status": "correct"}, {"value": "Am spălat vasele după ce am mâncat", "status": "correct"}], "feedback": "*După ce am mâncat, am spălat vasele.*"}
  ro.a2.unit89.lesson03.exercise01.alege_cand: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "Când ajung acasă, te sun.", "distractors": ["Când să ajung acasă, te sun.", "Când ajung acasă, ți sun.", "Când ajung acasă, te sun să."], "accepted_answers": [{"value": "Când ajung acasă, te sun.", "status": "correct"}], "feedback": "After *când* the verb is in the ordinary present."}
