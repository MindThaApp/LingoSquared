  ro.a2.unit89.lesson04.exercise05.completeaza_apoi: {"instruction": "Complete the Romanian sentence.", "correct_option": "apoi", "accepted_answers": [{"value": "apoi", "status": "correct"}], "feedback": "*Apoi* means 'then'."}
  ro.a2.unit89.lesson04.exercise06.traduce_ordine: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Mai întâi mănânc, apoi spăl vasele.", "status": "correct"}, {"value": "Mai întâi mănânc, apoi spăl vasele", "status": "correct"}, {"value": "Mai întâi mănânc și apoi spăl vasele.", "status": "correct"}, {"value": "Mai întâi mănânc și apoi spăl vasele", "status": "correct"}], "feedback": "*Mai întâi mănânc, apoi spăl vasele.*"}
  ro.a2.unit89.lesson04.exercise07.scrie_dinti: {"instruction": "Write the requested sentence with *înainte să*.", "correct_option": "Mă spăl pe dinți înainte să mă culc.", "accepted_answers": [{"value": "Mă spăl pe dinți înainte să mă culc.", "status": "correct"}, {"value": "Mă spăl pe dinți înainte să mă culc", "status": "correct"}, {"value": "Înainte să mă culc, mă spăl pe dinți.", "status": "correct"}, {"value": "Înainte să mă culc, mă spăl pe dinți", "status": "correct"}], "feedback": "*Mă spăl pe dinți înainte să mă culc.*"}
  ro.a2.unit89.lesson05.exercise01.citeste_maria: {"instruction": "Read Maria's message and choose the answer.", "correct_option": "She calls home.", "distractors": ["She drinks coffee.", "She reads a little.", "She washes the dishes."], "accepted_answers": [{"value": "She calls home.", "status": "correct"}], "feedback": "*Înainte să plec, sun acasă.*"}
