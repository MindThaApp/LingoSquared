  ro.a2.unit89.lesson01.exercise06.traduce_inainte: {"instruction": "Translate into Romanian.", "accepted_answers": [{"value": "Înainte să mănânc, mă spăl pe mâini.", "status": "correct"}, {"value": "Înainte să mănânc, mă spăl pe mâini", "status": "correct"}, {"value": "Mă spăl pe mâini înainte să mănânc.", "status": "correct"}, {"value": "Mă spăl pe mâini înainte să mănânc", "status": "correct"}], "feedback": "*Înainte să mănânc, mă spăl pe mâini.*"}
  ro.a2.unit89.lesson01.exercise07.scrie_ana: {"instruction": "Write the requested sentence with *înainte să*.", "correct_option": "Ana bea cafea înainte să plece.", "accepted_answers": [{"value": "Ana bea cafea înainte să plece.", "status": "correct"}, {"value": "Ana bea cafea înainte să plece", "status": "correct"}], "feedback": "*Ana bea cafea înainte să plece.*"}
  ro.a2.unit89.lesson02.exercise01.alege_dupa: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "După ce mănânc, spăl vasele.", "distractors": ["După ce să mănânc, spăl vasele.", "După ce mănânc, să spăl vasele.", "Înainte ce mănânc, spăl vasele."], "accepted_answers": [{"value": "După ce mănânc, spăl vasele.", "status": "correct"}], "feedback": "*După ce* is followed by the ordinary present."}
  ro.a2.unit89.lesson02.exercise02.alege_trecut: {"instruction": "Choose the correct Romanian sentence.", "correct_option": "După ce am mâncat, am spălat vasele.", "distractors": ["După ce am mâncat, spăl vasele.", "După ce să mănânc, am spălat vasele.", "După ce mâncat, am spălat vasele."], "accepted_answers": [{"value": "După ce am mâncat, am spălat vasele.", "status": "correct"}], "feedback": "For the past, use the perfect compus in both clauses."}
  ro.a2.unit89.lesson02.exercise03.une_dupa: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "După ce mănânc, spăl vasele.", "right": "After I eat, I wash the dishes."}, {"left": "După ce am mâncat, am spălat vasele.", "right": "After I ate, I washed the dishes."}, {"left": "După ce ajunge acasă, Mihai citește.", "right": "After he gets home, Mihai reads."}, {"left": "După ce am ajuns, am sunat.", "right": "After I arrived, I called."}, {"left": "după ce", "right": "after"}, {"left": "vasele", "right": "the dishes"}, {"left": "ajung", "right": "I arrive"}, {"left": "acasă", "right": "home"}], "status": "correct"}], "feedback": "These are the expressions for 'after'."}
