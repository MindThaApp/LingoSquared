  ro.a2.unit89.lesson02.exercise05.completeaza_ce: {"instruction": "Complete the Romanian sentence.", "correct_option": "ce", "accepted_answers": [{"value": "ce", "status": "correct"}], "feedback": "*După ce* means 'after' before a clause."}
