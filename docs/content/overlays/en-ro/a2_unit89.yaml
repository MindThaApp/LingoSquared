  ro.a2.unit89.lesson06.exercise03.une_dialog: {"instruction": "Match each Romanian expression to its meaning.", "accepted_answers": [{"value": [{"left": "Ce faci seara, după ce ajungi acasă?", "right": "What do you do in the evening, after you get home?"}, {"left": "Mai întâi mănânc, apoi spăl vasele.", "right": "First I eat, then I wash the dishes."}, {"left": "Și înainte să dormi?", "right": "And before you sleep?"}, {"left": "Înainte să dorm, citesc puțin.", "right": "Before I sleep, I read a little."}, {"left": "Eu sun acasă după ce mănânc.", "right": "I call home after I eat."}, {"left": "Mâine mâncăm împreună.", "right": "Tomorrow we're eating together."}, {"left": "Când ajungi acasă, mă suni?", "right": "When you get home, will you call me?"}, {"left": "Te sun după ce ajung acasă.", "right": "I'll call you after I get home."}], "status": "correct"}], "feedback": "These are the lines of the dialogue."}
