course:
  title: Romanian B1
  description: >-
    Intermediate Romanian: expressing real/possible conditions with
    viitor (future) and unreal/counterfactual conditions with
    condițional-optativ, using matching mood pairs across the if-clause
    and result clause.

units:
  ro.b1.unit03.hypotheticals:
    title: Hypothetical Conditions
    description: Express a real future condition and its result, and contrast it with an unreal present condition and its result, using matching moods in both clauses.

lessons:
  ro.b1.unit03.lesson01.real_condition_1st2nd:
    title: "If I have time, I will go"
  ro.b1.unit03.lesson02.real_condition_all_persons:
    title: "All the persons (future)"
  ro.b1.unit03.lesson03.unreal_condition:
    title: "If I had time..."
  ro.b1.unit03.lesson04.dialogue_weekend:
    title: "Weekend plans"
  ro.b1.unit03.lesson05.reading_planurile_dianei:
    title: "Diana's plans"
  ro.b1.unit03.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  ro.b1.unit03.lesson01.teach.daca:
    title: if
    gloss: if
    example_gloss: "If I have time, I will go to the office."
  ro.b1.unit03.lesson01.teach.am:
    title: "I have"
    gloss: "I have"
    example_gloss: "If I have time, I will go to the office."
  ro.b1.unit03.lesson01.teach.ai:
    title: "you have"
    gloss: "you have"
    note: "*ai* here means 'you have' (indicativ prezent). Careful later in this unit: the SAME spelling *ai* also serves as the 2nd-person conditional auxiliary ('you would'), a genuine homograph resolved only by context."
    example_gloss: "If you have time, will you go to the office?"
  ro.b1.unit03.lesson01.teach.timp:
    title: time
    gloss: time
    example_gloss: "If I have time, I will go to the office."
  ro.b1.unit03.lesson01.teach.voi:
    title: "I will"
    gloss: "I will (future auxiliary)"
    note: "*voi* here is the 1st-person-singular FUTURE auxiliary ('I will'). This is a genuine homograph with the pronoun *voi* (2nd-person-plural 'you all,' also used for dumneavoastră) -- spelled identically. Tell them apart by what follows: a bare verb stem after *voi* means 'I will [verb],' while *voi* standing alone as a subject means 'you all.'"
    example_gloss: "I will go to the office."
  ro.b1.unit03.lesson01.teach.merge:
    title: go
    gloss: go
    note: "*merge* -- the short-infinitive form, used unchanged after every future auxiliary (voi/vei/va/vom/veți/vor merge). Only the auxiliary changes with person, not the verb itself -- the reverse of unit01/02's să-clauses, where the modal stayed fixed and the embedded verb conjugated."
    example_gloss: "If I have time, I will go to the office."
  ro.b1.unit03.lesson01.teach.vei:
    title: "you will"
    gloss: "you will (future auxiliary)"
    example_gloss: "If you have time, will you go to the office?"
  ro.b1.unit03.lesson01.teach.la_birou:
    title: "to the office"
    gloss: "to the office"
    example_gloss: "I will go to the office."
  ro.b1.unit03.lesson01.teach.unde:
    title: where
    gloss: where
    example_gloss: "If you have time, where will you go?"
  ro.b1.unit03.lesson01.teach.grammar_future:
    title: "If I have time, I will go. If you have time, will you go?"
    gloss: "If I have time, I will go. If you have time, will you go?"
    note: "A real/possible condition: *dacă* + prezent indicativ in the if-clause, + viitor (future) in the result clause."

  ro.b1.unit03.lesson02.teach.va:
    title: "he/she will"
    gloss: "he/she will (future auxiliary)"
    example_gloss: "If Mihai has time, he will go to the office."
  ro.b1.unit03.lesson02.teach.are:
    title: "he/she has"
    gloss: "he/she has"
    example_gloss: "If Mihai has time, he will go to the office."
  ro.b1.unit03.lesson02.teach.vom:
    title: "we will"
    gloss: "we will (future auxiliary)"
    example_gloss: "If we have time, we will go to the office."
  ro.b1.unit03.lesson02.teach.avem:
    title: "we have"
    gloss: "we have"
    example_gloss: "If we have time, we will go to the office."
  ro.b1.unit03.lesson02.teach.veti:
    title: "you (pl./formal) will"
    gloss: "you (pl./formal) will (future auxiliary)"
    note: "*veți*, unlike bare *voi*, is unambiguous -- it's only ever the future auxiliary for the *voi*/dumneavoastră subject, never the pronoun itself."
    example_gloss: "If you (formal) have time, will you go to the office?"
  ro.b1.unit03.lesson02.teach.vor:
    title: "they will"
    gloss: "they will (future auxiliary)"
    example_gloss: "If they have time, they will go to the office."
  ro.b1.unit03.lesson02.teach.grammar_same_form:
    title: "He will go. They will go."
    gloss: "He will go. They will go."
    note: "*merge* stays the same short-infinitive form after every future auxiliary -- only *va/vom/veți/vor* (and *voi/vei*, from lesson01) change to mark person."

  ro.b1.unit03.lesson03.teach.as_avea:
    title: "I would have"
    gloss: "I would have"
    note: "*aș avea* -- condițional-optativ ('would have'), used in the if-clause of an unreal/counterfactual condition."
    example_gloss: "If I had time, I would go to the office."
  ro.b1.unit03.lesson03.teach.as_merge:
    title: "I would go"
    gloss: "I would go"
    note: "*aș merge* -- condițional-optativ result. Notice the SAME auxiliary set (aș/ai/ar/am/ați/ar) as *aș avea* is reused with any verb -- *merge* here is again the invariant short-infinitive form, this time after a conditional auxiliary instead of a future one."
    example_gloss: "If I had time, I would go to the office."
  ro.b1.unit03.lesson03.teach.ai_avea:
    title: "you would have"
    gloss: "you would have"
    note: "*ai* is a genuine homograph here -- spelled the same as indicativ 'you have' (lesson01), but this *ai* is the conditional auxiliary. Context (a *dacă*-clause using the short-infinitive verb after it) signals which one is meant."
    example_gloss: "If you had time, would you go to the office?"
  ro.b1.unit03.lesson03.teach.ai_merge:
    title: "you would go"
    gloss: "you would go"
    example_gloss: "If you had time, would you go to the office?"
  ro.b1.unit03.lesson03.teach.ar:
    title: "he/she/they would"
    gloss: "he/she/they would (conditional auxiliary)"
    note: "*ar* -- like unit01/02's 3rd-person conjunctiv forms, this conditional auxiliary is identical for singular and plural: *el ar merge* / *ei ar merge*."
    example_gloss: "If he/she had time, he/she would go to the office."
  ro.b1.unit03.lesson03.teach.maine:
    title: tomorrow
    gloss: tomorrow
    example_gloss: "If I had time tomorrow, I would go to the office."
  ro.b1.unit03.lesson03.teach.grammar_contrast:
    title: "If I have time, I will go. If I had time, I would go."
    gloss: "If I have time, I will go. If I had time, I would go."
    note: "Real/possible (dacă + prezent + viitor) vs unreal/counterfactual (dacă + condițional + condițional) -- both clauses always share the same mood within one sentence."

