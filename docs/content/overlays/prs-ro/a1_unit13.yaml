  ro.a1.unit13.lesson03.cafea_sau_ceaiul:
    title: قهوه یا چای؟
teaching:
  ro.a1.unit13.lesson01.teach.reminder_cafea_ceai_paine:
    title: 'یادآوری: cafea، ceai، pâine'
    gloss: cafea (قهوه) · ceai (چای) · pâine (نان)
    note: همه در واحد ۶ یاد گرفته شده‌اند -- اینجا با دستور تازهٔ دوست داشتن و دوست نداشتن همین واحد یکجا می‌شوند.
  ro.a1.unit13.lesson01.teach.imi_place_vocab:
    title: من دوست دارم
    gloss: Îmi place (من دوست دارم)
    note: لفظاً «برای من خوش می‌آید» -- *îmi* (برای من) به‌علاوهٔ *place* (خوش می‌آید) که تغییر نمی‌کند. برای گفتن دوست داشتن چیزی به‌طور کلی، رومانیایی شکل معرفهٔ اسم را به کار می‌برد (*cafeaua*، نه *cafea* ساده که در واحد ۶ یاد گرفتی)؛ در دری برای این کار شکل خاصی لازم نیست و فقط می‌گویی «قهوه».
    example_gloss:
    - من قهوه را دوست دارم.
  ro.a1.unit13.lesson01.teach.imi_place_cafeaua_phrase:
    title: قهوه را دوست دارم
    gloss: Îmi place cafeaua. (من قهوه را دوست دارم.)
    note: 'الگوی کامل: Îmi place + اسم با شکل معرفه.'
  ro.a1.unit13.lesson01.teach.imi_place_ceaiul_phrase:
    title: من چای را دوست دارم
    gloss: Îmi place ceaiul. (من چای را دوست دارم.)
    note: همان الگوی *Îmi place cafeaua* با نوشیدنی دیگر -- *ceaiul* شکل معرفهٔ *ceai* است که در واحد ۶ یاد گرفتی.
  ro.a1.unit13.lesson01.teach.numi_place_vocab:
    title: من دوست ندارم
    gloss: Nu-mi place (من دوست ندارم)
    note: منفی *Îmi place* -- در گفتار روزمره رومانیایی *nu îmi* را به *nu-mi* کوتاه می‌کند، پس همین شکل خط‌دار راه طبیعی گفتن آن است، نه فقط یک کوتاه‌نویسی.
    example_gloss:
    - من نان را دوست ندارم.
  ro.a1.unit13.lesson01.teach.numi_place_painea_phrase:
    title: من نان را دوست ندارم
    gloss: Nu-mi place pâinea. (من نان را دوست ندارم.)
    note: '*Pâinea* شکل معرفهٔ *pâine* است که در واحد ۶ یاد گرفتی، با همان الگوی *cafeaua*/*ceaiul*.'
  ro.a1.unit13.lesson02.teach.reminder_imi_place_numi_place:
    title: 'یادآوری: Îmi place، Nu-mi place'
    gloss: Îmi place (من دوست دارم) · Nu-mi place (من دوست ندارم)
    note: هر دو از درس اول همین واحد استند -- اینجا شکل پرسشی‌شان هم اضافه می‌شود.
  ro.a1.unit13.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'یادآوری: cafeaua، ceaiul، pâinea'
    gloss: cafeaua (قهوه) · ceaiul (چای) · pâinea (نان)
    note: همه از درس اول همین واحد استند -- اینجا در شکل پرسشی و ترجیح دوباره به کار می‌روند.
  ro.a1.unit13.lesson02.teach.va_place_vocab:
    title: دوست داری...؟
    gloss: Vă place...? (شما دوست دارید...؟)
    note: شکل پرسشی رسمی *Îmi place* -- *vă* (برای شما، رسمی) جای *îmi* (برای من) را می‌گیرد، همان سطح *dumneavoastră* که قبلاً در *aveți*/*faceți* دیدی. بعد از آن یک اسم معرفه بیاور، یا وقتی موضوع روشن است تنها به کار ببر.
    example_gloss:
    - قهوه را دوست دارید؟
  ro.a1.unit13.lesson02.teach.va_place_cafeaua_phrase:
    title: قهوه را دوست دارید؟
    gloss: Vă place cafeaua? (قهوه را دوست دارید؟)
    note: 'الگوی کامل: Vă place + اسم معرفه، با آهنگ بالارونده پرسش.'
  ro.a1.unit13.lesson02.teach.prefer_vocab:
    title: من بیشتر دوست دارم
    gloss: Prefer (من ترجیح می‌دهم)
    note: 'کلمه‌ای شفاف و نزدیک به کلمهٔ آشنای بین‌المللی -- ساختار «برای من» لازم نیست؛ *prefer* مثل فعل عادی کار می‌کند، مثل «ترجیح می‌دهم» در دری: *Prefer* + چیزی که ترجیح می‌دهی، به شکل معرفه مثل *Îmi place*.'
    example_gloss:
    - من قهوه را ترجیح می‌دهم.
  ro.a1.unit13.lesson02.teach.prefer_cafeaua_phrase:
    title: قهوه را بیشتر دوست دارم
    gloss: Prefer cafeaua. (من قهوه را ترجیح می‌دهم.)
    note: گفتهٔ قوی‌تر از *Îmi place cafeaua* -- وقتی بین دو چیز انتخاب می‌کنی مفید است.
  ro.a1.unit13.lesson02.teach.sau_vocab:
    title: یا
    gloss: Sau (یا)
    note: وقتی پیشنهاد می‌تین یا درباره یک انتخاب می‌پرسید، دو گزینه را به هم وصل می‌کند. فرق دارد با *și* (و) در واحد ۱۰ و واحد ۱۲ که دو چیزی را وصل می‌کند که هر دو با هم درست‌اند.
    example_gloss:
    - قهوه یا چای؟
  ro.a1.unit13.lesson02.teach.cafea_sau_ceai_phrase:
    title: قهوه یا چای؟
    gloss: Cafea sau ceai? (قهوه یا چای؟)
    note: یک راه کوتاه و طبیعی برای پیشنهاد دادن یک انتخاب. اینجا شکل‌های نامعین ساده (*cafea*، *ceai*) به کار رفته، نه شکل‌های معین *cafeaua*/*ceaiul*، چون این یک پیشنهاد باز است، نه یک جمله دربارهٔ قهوه یا چای به طور کلی.
  ro.a1.unit13.lesson03.teach.reminder_va_place_prefer_sau:
    title: 'یادآوری: Vă place, Prefer, Sau'
    gloss: Vă place? (آیا دوست دارید؟) · Prefer (ترجیح می‌دهم) · Sau (یا)
    note: همه از درس دوم همین واحد استند. اینجا آنا و میهای آن‌ها را با هم به کار می‌برند.
  ro.a1.unit13.lesson03.teach.reminder_imi_place_numi_place_cafeaua_ceaiul_painea:
    title: 'یادآوری: Îmi place, Nu-mi place, cafeaua, ceaiul, pâinea'
    gloss: Îmi place (دوست دارم) · Nu-mi place (دوست ندارم) · cafeaua (قهوه) · ceaiul (چای) · pâinea (نان)
    note: همه از درس اول همین واحد استند. اینجا آنا و میهای هرکدام می‌گویند چه چیز را دوست دارند و چه چیز را دوست ندارند.
  ro.a1.unit13.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'یادآوری: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (سلام) · mulțumesc (تشکر) · la revedere (خدا حافظ) · Ana، Mihai (نام‌ها)
    note: همه قبلاً در واحدهای پیشین آمده‌اند. همان الگوی دوستانهٔ آغاز و پایان که در هر گفتگوی این کورس بوده است.
  ro.a1.unit13.lesson03.teach.line01:
    title: سلام و پرسیدن دربارهٔ قهوه یا چای
    gloss: میهای به آنا سلام می‌دهد و می‌پرسد قهوه دوست دارد یا چای.
    note: '*Vă place...?* همین واحد را با *sau* یکجا می‌کند تا هر دو گزینه در یک سوال بیاید.'
  ro.a1.unit13.lesson03.teach.line02:
    title: گفتن ترجیح و گفتن چیزی که دوست ندارین
    gloss: آنا می‌گوید قهوه را ترجیح می‌دهد و چای را دوست ندارد.
    note: '*Prefer* را با *Nu-mi place* یکجا می‌کند. ترجیح او برای قهوه با سفارش همیشگی‌اش در واحد ۶ و واحد ۱۲ یکسان است.'
  ro.a1.unit13.lesson03.teach.line03:
    title: گفتن ترجیح مخالف
    gloss: میهای می‌گوید چای را دوست دارد و قهوه را دوست ندارد.
    note: با سفارش همیشگی میهای در واحد ۶ و واحد ۱۲ یکسان است (ceai، هرگز cafea).
  ro.a1.unit13.lesson03.teach.line04:
    title: پرسیدن دربارهٔ نان هم
    gloss: آنا می‌پرسد میهای نان هم دوست دارد یا نه.
    note: با پرسش کوتاه *Și pâinea?* (و نان؟) شروع می‌شود، بعد با *Vă place...?* دربارهٔ موضوع تازه یعنی *pâinea* کامل می‌پرسد.
  ro.a1.unit13.lesson03.teach.line05:
    title: تأیید کردن، تشکر و خدا حافظی
    gloss: میهای می‌گوید بلی، نان را دوست دارد، از آنا تشکر می‌کند و خدا حافظی می‌کند.
    note: با سفارش همیشگی میهای در واحد ۶ (pâine) یکسان است. همان الگوی پایانی که گفتگوی هر واحد پیشین با آن تمام شده است.
  ro.a1.unit13.lesson03.teach.line06:
    title: تمام کردن گفتگو
    gloss: آنا با گفتن نام میهای جواب خدا حافظی را می‌دهد.
    note: همان الگوی دوستانهٔ پایانی که گفتگوی هر واحد پیشین با آن تمام شده است.
