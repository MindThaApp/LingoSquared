answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (casă, apartament, cameră, dormitor, bucătărie, baie, fereastră) is used only in person-invariant third-person statements ("Ana are...", "Mihai are...", "Unde este baia?", "Casa mea este mare"). No new tu/dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting lines.
course:
  title: رومانیایی به دری A1
  description: توصیف یک خانهٔ ساده به رومانیایی -- Casă (خانه)، Apartament (اپارتمان)، Cameră (اتاق)، Dormitor (اتاق خواب)، Bucătărie (آشپزخانه)، Baie (حمام) و Fereastră (کلکین) -- وقتی Mihai به خانهٔ Ana می‌رود و آن‌ها از جای زندگی‌شان صحبت می‌کنند.
