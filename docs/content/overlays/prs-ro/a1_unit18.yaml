teaching:
  ro.a1.unit18.lesson01.teach.reminder_ana_mare:
    title: 'یادآوری: Ana, mare'
    gloss: Ana (نام) · mare (بزرگ)
    note: Ana نام شخصیت داستان است که از واحد ۱ معرفی شده؛ *mare* از واحد ۵ و واحد ۱۴ است -- این واحد هر دو را برای توصیف خانهٔ او دوباره به کار می‌برد.
  ro.a1.unit18.lesson01.teach.reminder_articole_trei:
    title: 'یادآوری: un, o, și, trei'
    gloss: un/o (یک) · și (و) · trei (سه)
    note: '*Un*، *o* و *și* از واحد ۵ استند؛ *trei* از شمارش واحد ۲ است -- این واحد هر چهار را برای شمردن و توصیف اتاق‌ها دوباره به کار می‌برد.'
  ro.a1.unit18.lesson01.teach.are_vocab:
    title: دارد
    gloss: Are (او دارد)
    note: شکل تازه‌ای از *a avea* (داشتن) -- شما *am* (من دارم، از واحد ۲ و واحد ۵) و *aveți* (شما دارید، رسمی) را می‌دانین؛ *are* شکل سوم شخص همین فعل است و برای گفتن اینکه کسی یا چیزی چه دارد به کار می‌رود.
  ro.a1.unit18.lesson01.teach.casa_vocab:
    title: خانه
    gloss: خانه
    note: جایی که کسی در آن زندگی می‌کند.
    example_gloss:
    - Ana یک خانهٔ بزرگ دارد.
  ro.a1.unit18.lesson01.teach.camera_vocab:
    title: اتاق
    gloss: اتاق
    note: کلمهٔ عمومی برای یک اتاق در خانه.
    example_gloss:
    - Ana یک اتاق بزرگ دارد.
  ro.a1.unit18.lesson01.teach.camere_plural:
    title: Cameră → camere
    gloss: cameră (اتاق) · camere (اتاق‌ها)
    note: جمع *cameră*، *camere* است -- وقتی بیشتر از یک اتاق را می‌شمارید به کار می‌رود.
  ro.a1.unit18.lesson01.teach.dormitor_vocab:
    title: اتاق خواب
    gloss: اتاق خواب
    note: اتاقی که کسی در آن می‌خوابد.
    example_gloss:
    - Ana یک اتاق خواب دارد.
  ro.a1.unit18.lesson01.teach.bucatarie_vocab:
    title: آشپزخانه
    gloss: آشپزخانه
    note: اتاقی که کسی در آن آشپزی می‌کند.
    example_gloss:
    - Ana یک آشپزخانه دارد.
  ro.a1.unit18.lesson01.teach.baie_vocab:
    title: تشناب
    gloss: حمام
    note: اتاقی که حمام یا دوش و تشناب دارد.
    example_gloss:
    - Ana یک حمام دارد.
  ro.a1.unit18.lesson01.teach.casa_mare_phrase:
    title: 'Ana یک خانهٔ بزرگ دارد. خانه سه اتاق دارد: یک اتاق خواب، یک آشپزخانه و یک حمام.'
    gloss: 'Ana are o casă mare. Casa are trei camere: un dormitor, o bucătărie și o baie.'
    note: 'همهٔ کلمه‌های این جمله‌ها قبلاً آموخته شده یا همین حالا معرفی شده‌اند و در دو جملهٔ تازه دربارهٔ خانهٔ Ana کنار هم آمده‌اند. *Casa* شکل معین *casă* است -- «همان خانه»: اسم مؤنثی که به -ă ختم شود، -ă را به -a تبدیل می‌کند، مثل *banca* (بانک مشخص) در واحد ۸.'
  ro.a1.unit18.lesson02.teach.reminder_mihai_mic:
    title: 'یادآوری: Mihai, mic'
    gloss: Mihai (نام) · mic (کوچک)
    note: Mihai نام شخصیت داستان است که از واحد ۱ معرفی شده؛ *mic* از واحد ۱۴ است -- این واحد هر دو را برای توصیف اپارتمان او دوباره به کار می‌برد.
  ro.a1.unit18.lesson02.teach.reminder_unde_este_doua:
    title: 'یادآوری: unde, este, două'
    gloss: unde (کجا) · este (است) · două (دو، مؤنث)
    note: '*Unde* و *este* از واحد ۸ و واحد ۹ استند؛ *două* شکل مؤنث «دو» از واحد ۲ است -- این واحد هر سه را برای پرسیدن و شمردن اتاق‌ها دوباره به کار می‌برد.'
  ro.a1.unit18.lesson02.teach.apartament_vocab:
    title: آپارتمان
    gloss: اپارتمان
    note: جای زندگی Mihai -- گزینهٔ کوچک‌تر در برابر خانهٔ Ana.
    example_gloss:
    - Mihai یک اپارتمان کوچک دارد.
  ro.a1.unit18.lesson02.teach.fereastra_vocab:
    title: کلکین
    gloss: کلکین
    note: '*Apartamentul* شکل معین *apartament* است -- «همان اپارتمان»: اسم خنثایی که به همخوان ختم شود، -ul می‌گیرد، مثل *magazinul* (دکان مشخص) در واحد ۸ (اما اسم مؤنث *casă* به *casa* تبدیل می‌شود).'
    example_gloss:
    - اپارتمان یک کلکین بزرگ دارد.
  ro.a1.unit18.lesson02.teach.apartament_mic_phrase:
    title: 'Mihai یک اپارتمان کوچک دارد. اپارتمان دو اتاق دارد: یک اتاق خواب و یک آشپزخانه.'
    gloss: 'Mihai are un apartament mic. Apartamentul are două camere: un dormitor și o bucătărie.'
    note: همهٔ کلمه‌های این جمله‌ها قبلاً آموخته شده یا همین حالا معرفی شده‌اند و در دو جملهٔ تازه دربارهٔ اپارتمان Mihai کنار هم آمده‌اند.
  ro.a1.unit18.lesson02.teach.unde_este_baia_phrase:
    title: حمام کجاست؟
    gloss: Unde este baia؟ (حمام کجاست؟)
    note: '*Baia* شکل معین *baie* است -- «همان حمام». وقتی به خانهٔ کسی می‌رین، این پرسش خیلی به کار می‌آید.'
  ro.a1.unit18.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'یادآوری: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (سلام) · Ce mai faceți? (حال شما چطور است؟ رسمی) · Bine, mulțumesc (خوب، تشکر)
    note: همه از سلام‌واحوالپرسی آغاز واحد ۱ استند و اینجا برای شروع گفتگوی همین واحد دوباره آمده‌اند.
  ro.a1.unit18.lesson03.teach.reminder_la_revedere_mea_aproape_am:
    title: 'یادآوری: La revedere, Mea, Aproape, Am'
    gloss: La revedere (خداحافظ) · Mea (مال من، مؤنث) · Aproape (نزدیک) · Am (من دارم)
    note: '*La revedere* از واحد ۱ است؛ *mea* از *Mama mea* در واحد ۵ است؛ *aproape* از پاسخ‌های *Unde este...?* در واحد ۸ و واحد ۹ است؛ *am* از واحد ۲ و واحد ۵ است -- همه اینجا برای گفتگوی دیدار از خانه دوباره آمده‌اند.'
  ro.a1.unit18.lesson03.teach.line01:
    title: به Ana سلام کنید و حالش را بپرسین
    gloss: Mihai به Ana سلام می‌کند و حالش را می‌پرسد.
    note: سلام‌واحوالپرسی *Ce mai faceți?* از واحد ۱ دوباره به کار رفته است.
  ro.a1.unit18.lesson03.teach.line02:
    title: جواب بتین و خانهٔ خود را توصیف کنید
    gloss: Ana جواب می‌دهد، بعد به Mihai می‌گوید که خانه‌اش بزرگ است و سه اتاق دارد.
    note: '*Bine, mulțumesc* از واحد ۱ با جملهٔ درس اول همین واحد ترکیب شده است.'
  ro.a1.unit18.lesson03.teach.line03:
    title: بپرسین حمام کجاست
    gloss: Mihai از Ana می‌پرسد حمام کجاست.
    note: جملهٔ درس دوم همین واحد تقریباً همان‌طور دوباره آمده است.
  ro.a1.unit18.lesson03.teach.line04:
    title: جواب بتین حمام کجاست
    gloss: Ana به او می‌گوید که نزدیک است.
    note: '*Baia* با *aproape* ترکیب شده است؛ همان الگوی پاسخ «... کجاست؟» که واحد ۸ و واحد ۹ آموختند.'
  ro.a1.unit18.lesson03.teach.line05:
    title: اپارتمان خود را توصیف کنید و خداحافظی کنید
    gloss: Mihai می‌گوید که یک اپارتمان کوچک با دو اتاق دارد، بعد خداحافظی می‌کند.
    note: جملهٔ درس دوم همین واحد با جملهٔ پایانی واحد ۱ ترکیب شده است.
  ro.a1.unit18.lesson03.teach.line06:
    title: خداحافظی کنید
    gloss: Ana خداحافظی می‌کند.
    note: همان الگوی پایانی که گفتگوی هر واحد قبلی با آن تمام شده است.
