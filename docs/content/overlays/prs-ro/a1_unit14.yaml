answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (mic/mică, mai, decât) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing polite register with each other, matching every earlier unit; no new second-person form is introduced here (unlike unit13's Vă place...?).
course:
  title: رومانیایی به دری A1
  description: 'مقایسهٔ چیزهای آشنا در رومانیایی: Mare (بزرگ)، Mic/Mică (کوچک) و ساختار تفضیلی Mai ... decât (بیشتر/-تر ... از)، وقتی آنا و میهای اندازهٔ قهوه، چای و نان خود را با هم مقایسه می‌کنند.'
