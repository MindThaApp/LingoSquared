teaching:
  ro.a1.unit14.lesson01.teach.reminder_mare:
    title: 'یادآوری: mare'
    gloss: mare (بزرگ)
    note: قبلاً در واحد ۳ ("literă mare"، حرف بزرگ) و واحد ۵ ("o familie mare"، یک خانوادهٔ بزرگ) آمده است. اینجا یک طرف مقایسهٔ واقعی پیدا می‌کند، یعنی *mic/mică*.
  ro.a1.unit14.lesson01.teach.reminder_cafeaua_ceaiul_painea:
    title: 'یادآوری: cafeaua, ceaiul, pâinea, cafea, ceai'
    gloss: cafeaua (قهوه) · ceaiul (چای) · pâinea (نان) · cafea (قهوه) · ceai (چای)
    note: همه از واحد ۶ و واحد ۱۳ استند. این واحد شکل‌های معین را برای چیزهایی به کار می‌برد که از نظر اندازه مقایسه می‌شوند و شکل‌های نامعین را دوباره در تمرین جور کردن همین درس می‌آورد.
  ro.a1.unit14.lesson01.teach.mic_mica_vocab:
    title: کوچک
    gloss: Mic (کوچک، مذکر/خنثی) · Mică (کوچک، مؤنث)
    note: صفت‌ها در رومانیایی با اسمی که توصیف می‌کنند هماهنگ می‌شوند. *ceai* (چای) شکل مذکر/خنثی *mic* را می‌گیرد، ولی *cafea* (قهوه) و *pâine* (نان) مؤنث‌اند و *mică* می‌گیرند. *Mare* (بزرگ) در مفرد برای مذکر و مؤنث یک شکل دارد، برای همین به این تقسیم نیاز نداشت.
    example_gloss:
    - چای کوچک است.
    - قهوه کوچک است.
  ro.a1.unit14.lesson01.teach.ceaiul_e_mic_phrase:
    title: چای کوچک است
    gloss: Ceaiul e mic. (چای کوچک است.)
    note: '*Ceaiul* خنثی است، پس شکل مذکر/خنثی *mic* را می‌گیرد.'
  ro.a1.unit14.lesson01.teach.cafeaua_e_mica_phrase:
    title: قهوه کوچک است
    gloss: Cafeaua e mică. (قهوه کوچک است.)
    note: '*Cafeaua* مؤنث است، پس شکل مؤنث *mică* را می‌گیرد.'
  ro.a1.unit14.lesson01.teach.painea_e_mica_phrase:
    title: نان کوچک است
    gloss: Pâinea e mică. (نان خورد است.)
    note: '*Pâinea* هم مؤنث است، بنابران مثل *cafeaua* با *mică* می‌آید.'
  ro.a1.unit14.lesson02.teach.reminder_mare_mic_mica:
    title: 'یادآوری: Mare، Mic، Mică'
    gloss: Mare (کلان) · Mic (خورد، مذکر/خنثی) · Mică (خورد، مؤنث)
    note: همه از درس اول همین واحد اند -- اینجا شکل تفضیلی شان را می‌بینین.
  ro.a1.unit14.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'یادآوری: cafeaua، ceaiul، pâinea'
    gloss: cafeaua (قهوه) · ceaiul (چای) · pâinea (نان)
    note: همه از واحد ۱۳ اند و اینجا دوباره منحیث چیزهای مقایسه‌شده می‌آیند.
  ro.a1.unit14.lesson02.teach.mai_vocab:
    title: بیشتر / -تر
    gloss: Mai (بیشتر / -تر، تفضیلی)
    note: 'این ماه *mai* (ماه می، واحد ۳) نیست. همان کلمهٔ کوچکی است که در ''Ce mai faceți?'' (واحد ۱) دیدید، اما اینجا کار دیگری دارد: ذرهٔ تفضیلی است. *mai* را پیش از صفت بگذارین تا معنی ''___تر'' یا ''بیشتر ___'' بدهد؛ این راه معمول ساختن تفضیلی در رومانیایی است.'
    example_gloss:
    - قهوه کلان‌تر است.
  ro.a1.unit14.lesson02.teach.mai_mare_phrase:
    title: قهوه کلان‌تر است
    gloss: Cafeaua e mai mare. (قهوه کلان‌تر است.)
    note: '*Mai* + صفت -- هیچ تغییر دیگری لازم نیست.'
  ro.a1.unit14.lesson02.teach.decat_vocab:
    title: از
    gloss: Decât (از)
    note: مقایسه را کامل می‌کند -- *mai* + صفت + *decât* + چیز دوم.
    example_gloss:
    - قهوه از چای کلان‌تر است.
  ro.a1.unit14.lesson02.teach.mai_mare_decat_phrase:
    title: قهوه از چای کلان‌تر است
    gloss: Cafeaua e mai mare decât ceaiul. (قهوه از چای کلان‌تر است.)
    note: 'الگوی کامل تفضیلی: [چیز] + e + mai + [صفت] + decât + [چیز دوم].'
  ro.a1.unit14.lesson02.teach.mai_mica_decat_phrase:
    title: نان از قهوه خورد‌تر است
    gloss: Pâinea e mai mică decât cafeaua. (نان از قهوه خورد‌تر است.)
    note: همان الگو با *mică*، شکل مؤنث «خورد» از درس اول همین واحد.
  ro.a1.unit14.lesson03.teach.reminder_mai_decat_mare_mic_mica:
    title: 'یادآوری: Mai، Decât، Mare، Mic، Mică'
    gloss: Mai (بیشتر/-تر) · Decât (از) · Mare (کلان) · Mic (خورد، مذکر/خنثی) · Mică (خورد، مؤنث)
    note: همه از درس اول و دوم همین واحد اند -- اینجا Ana و Mihai همه را با هم به کار می‌برند.
  ro.a1.unit14.lesson03.teach.reminder_cafeaua_ceaiul_painea:
    title: 'یادآوری: cafeaua، ceaiul، pâinea'
    gloss: cafeaua (قهوه) · ceaiul (چای) · pâinea (نان)
    note: همه از واحد ۱۳ اند -- سه چیزی که Ana و Mihai مقایسه می‌کنند.
  ro.a1.unit14.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'یادآوری: bună، mulțumesc، la revedere، Ana، Mihai'
    gloss: bună (سلام) · mulțumesc (تشکر) · la revedere (خداحافظ) · Ana, Mihai (نام‌ها)
    note: همه در واحدهای قبلی آمده‌اند -- همان الگوی دوستانهٔ آغاز و پایان که در هر دیالوگ این کورس بوده است.
  ro.a1.unit14.lesson03.teach.line01:
    title: سلام و پرسش دربارهٔ اندازه
    gloss: Mihai به Ana سلام می‌دهد و می‌پرسد که قهوه کلان است یا خورد.
    note: از *mare sau mică* (کلان یا خورد) همین واحد برای آغاز پرسش اندازه کار می‌گیرد؛ همان ساختار «X یا Y؟» که *cafea sau ceai?* در واحد ۱۳ نشان داد.
  ro.a1.unit14.lesson03.teach.line02:
    title: توضیح اندازهٔ هر دو نوشیدنی
    gloss: Ana می‌گوید قهوه کلان و چای خورد است.
    note: یک واقعیت ساده دربارهٔ اندازه را می‌گوید، نه ترجیح -- در این دیالوگ هیچ‌کس نمی‌گوید کدام نوشیدنی را دوست دارد یا سفارش می‌دهد، فقط اندازهٔ هر کدام را می‌گوید.
  ro.a1.unit14.lesson03.teach.line03:
    title: پرسیدن برای تأیید مقایسه
    gloss: Mihai می‌پرسد که قهوه از چای کلان‌تر است یا نه.
    note: دو جملهٔ جداگانهٔ Ana را با *mai mare decât*، ساختار اصلی همین واحد، به یک مقایسهٔ مستقیم تبدیل می‌کند.
  ro.a1.unit14.lesson03.teach.line04:
    title: تأیید و افزودن نان
    gloss: Ana تأیید می‌کند و بعد می‌گوید نان از قهوه خورد‌تر است.
    note: '*mai ... decât* را با چیز سوم، *pâinea*، دوباره به کار می‌برد، این بار با شکل *mai mică*.'
  ro.a1.unit14.lesson03.teach.line05:
    title: تأیید، تشکر و خداحافظی
    gloss: Mihai تأیید می‌کند که نان خورد است، از Ana تشکر می‌کند و خداحافظی می‌کند.
    note: همان الگوی پایانی که دیالوگ هر واحد قبلی با آن ختم شده است.
  ro.a1.unit14.lesson03.teach.line06:
    title: ختم گفتگو
    gloss: Ana هم خداحافظی می‌کند و نام Mihai را می‌گیرد.
    note: همان الگوی دوستانهٔ پایانی که دیالوگ هر واحد قبلی با آن ختم شده است.
