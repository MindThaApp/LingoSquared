teaching:
  ro.a1.unit28.lesson01.teach.a_suna:
    title: زنگ زدن
    gloss: زنگ زدن
    note: مصدر فعلی که برای تماس تلفونی به کار می‌رود.
    example_gloss: باید به تو زنگ بزنم.
  ro.a1.unit28.lesson01.teach.te_sun:
    title: گفتن اینکه زنگ می‌زنید
    gloss: به تو زنگ می‌زنم.
    note: '*Sun* شکل *eu* فعل *a suna* («زنگ زدن») است؛ *te* («تو») پیش از فعل می‌آید، و برای کاری که به‌زودی می‌شود، رومانیایی همین زمان حال را به کار می‌برد.'
  ro.a1.unit28.lesson01.teach.alo_sunt_ana:
    title: جواب دادن به تلفون
    gloss: سلام، من Ana استم.
    note: '*Alo* برای جواب دادن تلفن است؛ *sunt* + نام می‌گوید که تو کی استی.'
  ro.a1.unit28.lesson01.teach.alo_sunt_mihai:
    title: Mihai هم به همین شکل جواب می‌دهد
    gloss: سلام، من Mihai استم.
    note: همان الگوی *Alo, sunt* + نام، مثل *Alo, sunt Ana*.
  ro.a1.unit28.lesson02.teach.cu_cine_vorbesc:
    title: پرسیدن اینکه کی زنگ زده
    gloss: با کی صحبت می‌کنم؟
    note: '*Cu cine vorbesc?* (تحت‌اللفظی «با کی صحبت می‌کنم؟») راه معمول پرسیدن از یک زنگ‌زننده ناشناس است.'
  ro.a1.unit28.lesson02.teach.vorbiti_cu_ana:
    title: معرفی رسمی خود
    gloss: شما با Ana صحبت می‌کنین.
    note: '*Vorbiți cu* + نام جواب رسمی است: *vorbiți* شکل *dumneavoastră* فعل *a vorbi* («صحبت کردن») است.'
  ro.a1.unit28.lesson03.teach.poti_sa_repeti:
    title: خواستن تکرار
    gloss: این را تکرار کرده می‌توانی؟
    note: '*Poți să* ... («می‌توانی ...؟») + *repeți* («تکرار کنی») + *asta* («این را»).'
  ro.a1.unit28.lesson03.teach.nu_vorbi_atat:
    title: خواستن اینکه آهسته‌تر صحبت کند
    gloss: لطفاً این‌قدر تیز صحبت نکن.
    note: '*Nu vorbi* («صحبت نکن») از *nu* + شکل *tu* ساخته می‌شود؛ *atât de repede* یعنی «اینقدر تیز».'
  ro.a1.unit28.lesson03.teach.nu_te_aud:
    title: گفتن اینکه خوب نمی‌شنوید
    gloss: صدایت را خوب نمی‌شنوم.
    note: '*Nu te aud bine*: *aud* یعنی «می‌شنوم»، *te* («تو را») پیش از فعل می‌آید و *bine* یعنی «خوب».'
  ro.a1.unit28.lesson04.teach.mesajul:
    title: پیام کوتاه
    gloss: پیام کوتاه
    note: '*Mesaj* در مفرد مذکر و در جمع مؤنث است (*un mesaj*، *două mesaje*)؛ حرف تعریف به آخر کلمه می‌چسبد: *mesajul*.'
    example_gloss: پیامک از طرف Ana است.
  ro.a1.unit28.lesson04.teach.iti_trimit_un:
    title: گفتن اینکه پیام می‌فرستی
    gloss: برایت پیام می‌فرستم.
    note: '*Îți* («برایت») ضمیر مفعول غیرمستقیم است و پیش از فعل می‌آید: *Îți trimit un mesaj*.'
  ro.a1.unit28.lesson04.teach.te_sun_inapoi:
    title: گفتن اینکه دوباره زنگ می‌زنی
    gloss: بعداً برایت زنگ می‌زنم.
    note: '*Înapoi* («دوباره، برگشت») بعد از فعل می‌آید: *te sun înapoi* یعنی «دوباره برایت زنگ می‌زنم» و *mai târziu* یعنی «بعداً».'
  ro.a1.unit28.lesson05.teach.mihai_salut_ana:
    title: خواندن گفتگوی پیام‌ها
    gloss: 'Mihai: سلام Ana، می‌توانی به من زنگ بزنی؟ باید چیزی برایت بگویم. Ana: بلی حتماً، پنج دقیقهٔ دیگر دوباره برایت زنگ می‌زنم.'
    note: دقت کن که Mihai چه می‌خواهد، چرا می‌خواهد، و Ana کی می‌گوید دوباره زنگ می‌زند.
    glosses:
      Salut: سلام
      poți: می‌توانی
      suna: زنگ زدن
      Trebuie: باید
      ceva: یک چیز
      spun: گفتن
      sigur: حتماً
      sun: زنگ زدن
      cinci: پنج
      minute: دقیقه
      înapoi: دوباره
  ro.a1.unit28.lesson06.teach.mihai_alo_sunt:
    title: Mihai تلفن را جواب می‌دهد
    gloss: 'Mihai: الو، من Mihai استم.'
    note: 'همان الگوی *Alo, sunt* + نام از درس اول، حالا در خود تماس: کسی که تلفن را جواب می‌دهد اول صحبت می‌کند و نامش را می‌گوید.'
  ro.a1.unit28.lesson06.teach.ana_salut_mihai:
    title: Ana خودش را معرفی می‌کند
    gloss: 'Ana: سلام Mihai، من Ana استم. Mihai: چه خوب که زنگ زدی!'
    note: '*Ce bine că* ... («چه خوب که ...») واکنش مثبت به یک رویداد را نشان می‌دهد؛ *suni* شکل *tu* فعل *a suna* است.'
  ro.a1.unit28.lesson06.teach.ana_cum_a:
    title: Ana دربارهٔ نوبت کاری می‌پرسد
    gloss: 'Ana: اولین نوبت کاری‌ات چطور بود؟'
    note: '*A fost* یعنی «بود» (گذشتهٔ *a fi*). این یک گذشتهٔ مرکب است که مثل *am mâncat* ساخته می‌شود؛ یادداشت بعد از سطر بعدی را ببین.'
  ro.a1.unit28.lesson06.teach.mihai_a_mers:
    title: Mihai خبر خوب می‌دهد
    gloss: 'Mihai: خیلی خوب گذشت، بهتر از آنچه فکر می‌کردم.'
    note: '*A mers* گذشتهٔ *a merge* («رفتن»، اینجا «پیش رفتن») است؛ *credeam* یعنی «فکر می‌کردم» (شکلی گذشته از *a crede*).'
  ro.a1.unit28.lesson06.teach.a_fost_a:
    title: 'شکل‌های گذشته: a fost, a mers, credeam'
    gloss: بود ← بودن، رفت ← رفتن، فکر می‌کردم ← فکر کردن
    note: '*A fost* و *a mers* شکل‌های گذشتهٔ مرکب اند (*a* + اسم مفعول) و *credeam* گذشتهٔ ناتمام است. فعلاً فقط آن‌ها را به شکل عبارت‌های ثابت در همین درس حفظ کن؛ قواعد کامل زمان گذشته در سطح بعدی می‌آید.'
  ro.a1.unit28.lesson06.teach.ana_ma_bucur:
    title: Ana افتخار می‌کند
    gloss: 'Ana: چه خوب که این را می‌شنوم! به تو افتخار می‌کنم.'
    note: '*Mândră de* («سربلند از») ترکیب ثابت است؛ *de* لازم است. یک مرد می‌گوید *mândru*.'
  ro.a1.unit28.lesson06.teach.mihai_iti_multumesc:
    title: Mihai متأثر می‌شود
    gloss: 'Mihai: تشکر، این برایم خیلی معنی دارد.'
    note: '*Înseamnă* شکل سوم شخص مفرد فعل *a însemna* («معنی دادن») است؛ *pentru mine* («برای من») می‌گوید برای کی مهم است.'
  ro.a1.unit28.lesson06.teach.prima_lui_tura:
    title: او (ملکیت)
    gloss: اولین شیفتش خیلی خوب گذشت.
    note: '*Lui* بعد از اسم یعنی «او (مرد)» به معنای ملکیت: *prima lui tură*. (برای زن *ei* است.)'
