    title: عددها
lessons:
  ro.a1.unit02.lesson01.zero_to_ten:
    title: اعداد از صفر تا ده
  ro.a1.unit02.lesson02.eleven_to_hundred:
    title: اعداد یازده تا صد
  ro.a1.unit02.lesson03.age_and_phone:
    title: سن و نمبر تیلفون
teaching:
  ro.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: صفر
    note: '*Zero* تغییر نمی‌کند و برای خواندن یک رقم در داخل عدد بلندتر یا نمبر تیلفون هم به کار می‌رود.'
    example_gloss: صفر، یک، دو.
  ro.a1.unit02.lesson01.teach.unu:
    title: یک
    gloss: یک
    note: '*Unu* شکلی است که هنگام شمردن به‌تنهایی به کار می‌رود. پیش از اسم مذکر یا خنثی کوتاه می‌شود و *un* می‌شود (*un câine*، یک سگ)؛ پیش از اسم مؤنث *o* می‌شود (*o sută*، صد).'
    example_gloss: یک، دو، سه.
  ro.a1.unit02.lesson01.teach.doi:
    title: دو (مذکر)
    gloss: دو
    note: '*Doi* با اسم‌های مذکر به کار می‌رود (*doi bărbați*، دو مرد). اسم‌های مؤنث — و اسم‌های خنثی که در جمع مثل مؤنث رفتار می‌کنند — شکل دیگری می‌گیرند؛ کارت بعدی را ببینین.'
    example_gloss: دو، سه، چهار.
  ro.a1.unit02.lesson01.teach.doi_doua_gender:
    title: دو با جنسیت تغییر می‌کند
    gloss: doi (مذکر) / două (مؤنث و خنثی)
    note: در رومانیایی *doi* شکل مؤنث جداگانه‌ای دارد، یعنی *două*، که با اسم‌های مؤنث لازم است (*două femei*، دو زن) و با اسم‌های خنثی هم که در جمع مؤنث اند (*două numere*، دو عدد). جز یک (*un*/*o*) و دو، اعداد *trei* تا *zece* برای همهٔ جنسیت‌ها یکسان می‌مانند.
  ro.a1.unit02.lesson01.teach.trei:
    title: سه
    gloss: سه
    note: '*Trei* برای هر جنسیت تغییر نمی‌کند.'
    example_gloss: سه، چهار، پنج.
  ro.a1.unit02.lesson01.teach.patru:
    title: چهار
    gloss: چهار
    note: '*Patru* تغییر نمی‌کند. به شکل کوتاه‌شدهٔ نامنظم آن در اعداد یازده تا نوزده دقت کنید: *paisprezece* (14)، نه *patrusprezece*.'
    example_gloss: چهار، پنج، شش.
  ro.a1.unit02.lesson01.teach.cinci:
    title: پنج
    gloss: پنج
    note: '*Cinci* تغییر نمی‌کند.'
    example_gloss: پنج، شش، هفت.
  ro.a1.unit02.lesson01.teach.sase:
    title: شش
    gloss: شش
    note: '*Șase* تغییر نمی‌کند.'
    example_gloss: شش، هفت، هشت.
  ro.a1.unit02.lesson01.teach.sapte:
    title: هفت
    gloss: هفت
    note: '*Șapte* تغییر نمی‌کند.'
    example_gloss: هفت، هشت، نه.
  ro.a1.unit02.lesson01.teach.opt:
    title: هشت
    gloss: هشت
    note: '*Opt* تغییر نمی‌کند.'
    example_gloss: هشت، نُه، ده.
  ro.a1.unit02.lesson01.teach.noua:
    title: نه
    gloss: نه
    note: '*Nouă* تغییر نمی‌کند. اگر بدون نشانهٔ حرفش نوشته شود، با *noua* («آن تازه»، مؤنث) یکسان می‌شود -- پس *ă* را بنویسین: جواب‌های تایپی با نشانه‌هایشان بررسی می‌شوند.'
    example_gloss: نُه، ده... تمام!
  ro.a1.unit02.lesson01.teach.zece:
    title: ده
    gloss: ده
    note: '*Zece* تغییر نمی‌کند و پایهٔ همهٔ عددهای یازده تا نزده است (*zece* + *-sprezece*).'
    example_gloss: ده! آفرین!
  ro.a1.unit02.lesson02.teach.unsprezece:
    title: یازده
    gloss: یازده
    note: '*Unsprezece* در اصل از *unu* + *spre* + *zece* ساخته شده («یک بالای ده») و همهٔ عددهای بعدی از همین الگو پیروی می‌کنند.'
    example_gloss: ده، یازده، دوازده.
  ro.a1.unit02.lesson02.teach.teens_pattern:
    title: دوازده تا نزده
    gloss: doisprezece (12), treisprezece (13), paisprezece (14), cincisprezece (15), șaisprezece (16), șaptesprezece (17), optsprezece (18), nouăsprezece (19)
    note: 'در هر عدد، *-sprezece* به شکل معمولی رقم اضافه می‌شود: *doi* ← *doisprezece*، *trei* ← *treisprezece* و همین‌طور تا *nouă* ← *nouăsprezece*. دو عدد بی‌قاعده استند: چهارده، که در آن *patru* به *pai-* کوتاه می‌شود (*paisprezece*، نه *patrusprezece*)، و شانزده، که در آن *șase* به *șai-* تبدیل می‌شود (*șaisprezece*، نه *șasesprezece*).'
  ro.a1.unit02.lesson02.teach.douazeci:
    title: بیست
    gloss: بیست
    note: '*Douăzeci* («دو ده») کلمهٔ مستقل است و پایهٔ همهٔ عددهای ۲۱ تا ۲۹ می‌باشد.'
    example_gloss: نزده، بیست...
  ro.a1.unit02.lesson02.teach.douazeci_si_unu:
    title: بیست و یک
    gloss: بیست و یک
    note: 'از بیست و یک به بعد، رومانیایی دهگان و یکان را با *și* («و») وصل می‌کند: *douăzeci și unu*، *douăzeci și doi* و غیره -- برخلاف عددهای یازده تا نزده که در یک کلمه یکجا می‌شوند.'
    example_gloss: بیست، بیست و یک، بیست و دو.
  ro.a1.unit02.lesson02.teach.tens_pattern:
    title: سی تا نود
    gloss: treizeci (30), patruzeci (40), cincizeci (50), șaizeci (60), șaptezeci (70), optzeci (80), nouăzeci (90)
    note: 'هر دهگان از سی به بالا، رقم به‌علاوهٔ *-zeci* («دهگان‌ها») است -- *trei* ← *treizeci*، *patru* ← *patruzeci* و همین‌طور. تنها تغییر املایی در شصت است: *șase* به *șai-* تبدیل می‌شود و *șaizeci* می‌شود (همان *șai-* در *șaisprezece*). برای ۷۰، ۸۰ و ۹۰ شمارش بر مبنای بیست، مثل فرانسوی، وجود ندارد.'
  ro.a1.unit02.lesson02.teach.o_suta:
    title: صد
    gloss: صد
    note: '*O sută* از *o* (شکل مؤنث «یک») استفاده می‌کند، نه *un*، چون *sută* اسم مؤنث است.'
    example_gloss: نود، صد!
  ro.a1.unit02.lesson03.teach.cati_ani_ai:
    title: پرسیدن سن به شکل غیررسمی
    gloss: عمرت چند سال است؟
    note: معنی تحت‌اللفظی آن «چند سال داری» است و برای گفتن سن از *avea* (داشتن) کار گرفته می‌شود، مثل *avoir* در فرانسوی؛ در دری برای سن «استی» می‌گوییم، اما در رومانیایی «داشتن» می‌آید. *Câți* (چند تا، مذکر) با *ani* (سال‌ها، مذکر) هماهنگ است.
  ro.a1.unit02.lesson03.teach.am_nouasprezece_ani:
    title: گفتن سن (زیر بیست)
    gloss: نزده ساله استم.
    note: '*Am* شکل *eu* فعل *avea* است. برای عددهای زیر بیست، پیش از *ani* به *de* ضرورت نیست.'
  ro.a1.unit02.lesson03.teach.cati_ani_aveti:
    title: پرسیدن سن به شکل رسمی
    gloss: عمرت چند سال است؟
    note: '*Aveți* شکل *dumneavoastră* فعل *avea* است و با سطح مؤدبانه‌ای که در درس اول آمد هماهنگ است.'
  ro.a1.unit02.lesson03.teach.am_treizeci_de_ani:
    title: گفتن سن (بیست و بالاتر)
    gloss: سی ساله استم.
    note: '*De* اینجا می‌آید چون *treizeci* بیست یا بالاتر است -- قاعدهٔ کامل در کارت بعدی است.'
  ro.a1.unit02.lesson03.teach.de_insertion_rule:
    title: کی پیش از اسم de می‌آید
    gloss: '2-19: بدون de (doi ani) / 20+: با de (treizeci de ani)'
    note: 'قاعده‌ای خاص رومانیایی: عددهای ۲ تا ۱۹ مستقیم به اسم وصل می‌شوند (*doi ani*، دو سال؛ *nouăsprezece ani*، نزده سال)، اما از ۲۰ به بالا میان عدد و اسم *de* لازم است (*treizeci de ani*، سی سال؛ *o sută de ani*، صد سال). «یک» حالت جداگانه دارد (*un an*، یک سال -- مفرد و در هر دو حالت بدون *de*).'
  ro.a1.unit02.lesson03.teach.care_e_numarul_tau:
    title: پرسیدن شمارهٔ تیلفون به شکل غیررسمی
    gloss: نمبر تیلفونت چند است؟
    note: برای پرسیدن یک شمارهٔ مشخص، *Care* (کدام) طبیعی است، نه *ce*. *Număr* اسم خنثی است؛ در مفرد مثل اسم مذکر هماهنگ می‌شود، پس برای گفتن *تو* (ضمیر ملکی) *tău* می‌آید، نه *ta*.
  ro.a1.unit02.lesson03.teach.care_este_numarul_dvs:
    title: پرسیدن شمارهٔ تیلفون به شکل رسمی
    gloss: نمبر تیلفونت چند است؟
    note: '*Este* شکل کامل *e* است که در گفتار محتاط یا رسمی بیشتر می‌آید. *Dumneavoastră* گفتگو را مؤدبانه نگه می‌دارد؛ همان کلمه‌ای که در درس اول یاد گرفتید.'
  ro.a1.unit02.lesson03.teach.raspuns_telefon:
    title: گفتن شمارهٔ تیلفون رقم به رقم
    gloss: 'این است: صفر، هفت، دو، یک، چهار، پنج، شش، هفت، هشت، نُه.'
    note: این درس به خواندن ساده رقم به رقم بسنده می‌کند، مثل ساده‌سازی درس اول در انتخاب سطح خطاب؛ ممکن است کسی رقم‌ها را دوتا دوتا بگوید، اما رقم‌های تکی همیشه فهمیده می‌شوند.
