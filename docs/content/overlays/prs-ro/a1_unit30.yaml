    correct_option: در وقت آزادم دوست دارم کتاب بخوانم.
    distractors:
    - من هر آخر هفته یک کتاب می‌خوانم.
    - در وقت آزادم دوست دارم آشپزی کنم.
    - در وقت آزادت چه می‌کنی؟
