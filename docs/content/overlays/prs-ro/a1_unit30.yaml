  ro.a1.unit30.lesson04.ana_si_mihai_vorbesc:
    title: Ana و Mihai دربارهٔ سرگرمی‌ها صحبت می‌کنند
  ro.a1.unit30.lesson05.mihai_si_ana_isi:
    title: Mihai و Ana سرگرمی‌هایشان را مقایسه می‌کنند
  ro.a1.unit30.lesson06.planuim_impreuna_un_weekend:
    title: برنامه‌ریزی یک آخر هفته با هم
teaching:
  ro.a1.unit30.lesson01.teach.a_citi_a:
    title: خواندن، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل رایج سرگرمی: *a citi* (خواندن)، *a face sport* (ورزش کردن) و *a găti* (آشپزی کردن). شکل قاموسی فعل‌های رومانیایی با *a* شروع می‌شود.'
    example_gloss:
    - کتاب خواندن را دوست دارم.
    - روزهای شنبه ورزش می‌کنم.
    - آشپزی برای دوستان را دوست دارم.
  ro.a1.unit30.lesson01.teach.timpul_liber:
    title: وقت آزاد
    gloss: وقت آزاد
    note: '*Timpul liber* (وقت آزاد) از اسم مذکر *timp* ساخته شده که حرف تعریف به آن چسبیده است. این عبارت کلیدی برای صحبت دربارهٔ سرگرمی‌هاست.'
    example_gloss: در وقت آزادم کتاب خواندن را دوست دارم.
  ro.a1.unit30.lesson01.teach.in_timpul_liber:
    title: گفتن اینکه در وقت آزاد چه می‌کنین
    gloss: در وقت آزادم کتاب خواندن را دوست دارم.
    note: '*Citesc* شکل *eu* فعل *a citi* (خواندن) است؛ بعد از *îmi place să* فعل همین شکل را نگه می‌دارد.'
  ro.a1.unit30.lesson02.teach.a_asculta_muzica:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه عبارت سرگرمی دیگر: *a asculta muzică* (موسیقی گوش دادن)، *a desena* (نقاشی کردن) و *a juca jocuri video* (بازی ویدیویی کردن).'
    example_gloss:
    - دوست دارم موسیقی گوش کنم.
    - من اکثراً نقاشی می‌کنم.
    - دوست دارم با دوستانم ویدیوگیم بازی کنم.
  ro.a1.unit30.lesson02.teach.imi_place_sa:
    title: گفتن اینکه موسیقی گوش کردن را دوست دارید
    gloss: دوست دارم موسیقی گوش کنم.
    note: '*Îmi place să ascult muzică*: *îmi place* («برایم خوش است») + *să* + فعل، راه معمول گفتن این است که کاری را دوست دارید.'
  ro.a1.unit30.lesson02.teach.imi_place_sa_2:
    title: گفتن اینکه با دوستان ویدیوگیم بازی کردن را دوست دارید
    gloss: دوست دارم با دوستانم ویدیوگیم بازی کنم.
    note: '*Cu prietenii* یعنی «با دوستان»: *cu* («با») حرف اضافه است و *prietenii* شکل معرفهٔ جمع است.'
  ro.a1.unit30.lesson03.teach.mereu_des_uneori:
    title: همیشه، اکثراً، گاهی، هرگز
    gloss: همیشه، اکثراً، گاهی، هرگز
    note: 'چهار قید اصلی تکرار: *mereu*، *des*، *uneori* و *niciodată*. معمولاً بعد از فعل می‌آیند: *Citesc des*.'
    example_gloss:
    - من همیشه روزهای شنبه ورزش می‌کنم.
    - من اکثراً کتاب می‌خوانم.
    - من گاهی نقاشی می‌کنم.
    - من هرگز ویدیوگیم بازی نمی‌کنم.
  ro.a1.unit30.lesson03.teach.in_fiecare_saptamana:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*În fiecare săptămână* و *în fiecare weekend* هر دو یعنی «هر»؛ *fiecare* هیچ‌وقت تغییر نمی‌کند، کارت بعدی را ببینین.'
    example_gloss:
    - من هر هفته برای دوستانم آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  ro.a1.unit30.lesson03.teach.cuvantul_fiecare_nu:
    title: Fiecare هیچ‌وقت تغییر نمی‌کند
    gloss: 'کلمهٔ fiecare تغییر نمی‌کند: în fiecare săptămână (هر هفته)، în fiecare weekend (هر آخر هفته).'
    note: '*Fiecare* پیش از *săptămână* و *weekend* هر اسمی که باشد همان می‌ماند، پس چیزی برای انتخاب کردن نیست.'
  ro.a1.unit30.lesson03.teach.ce_faci_in:
    title: پرسیدن دربارهٔ وقت آزاد
    gloss: در وقت آزادت چه می‌کنی؟
    note: این سؤال اصلی این واحد است؛ با آن می‌توانین از هر کسی دربارهٔ سرگرمی‌هایش بپرسین.
  ro.a1.unit30.lesson04.teach.ana_ne_plimbam:
    title: Ana صحبت سرگرمی‌ها را شروع می‌کند
    gloss: 'Ana: ما اغلب با هم قدم می‌زنیم. اما تو در وقت آزادت دیگر چه می‌کنی، Mihai؟'
    note: '*Ne plimbăm* («قدم می‌زنیم») شکل *noi* فعل بازتابی *a se plimba* است؛ به قدم‌زدن‌هایی اشاره دارد که هر دو دوست از آن لذت می‌برند.'
  ro.a1.unit30.lesson04.teach.mihai_imi_place:
    title: سرگرمی‌های Mihai
    gloss: 'Mihai: من آشپزی را دوست دارم، در خانه هم. و اغلب ورزش می‌کنم.'
    note: '*Și acasă* (در خانه هم) روشن می‌کند که Mihai برای تفریح آشپزی می‌کند، نه فقط در کارش در رستورانت.'
  ro.a1.unit30.lesson04.teach.ana_gatesti_si:
    title: Ana تعجب می‌کند
    gloss: 'Ana: در خانه هم آشپزی می‌کنی؟ تو که تمام روز در محل کارت آشپزی می‌کنی!'
    note: '*Toată ziua* (تمام روز) تأکید می‌کند که Mihai در کار هم چقدر آشپزی می‌کند؛ *deja* یعنی «از قبل».'
  ro.a1.unit30.lesson04.teach.mihai_da_dar:
    title: Mihai توضیح می‌دهد
    gloss: 'Mihai: بلی، اما آشپزی برایم آرامش‌بخش است. و تو، چه کاری را دوست داری؟'
    note: '*Gătitul mi se pare relaxant* در معنای لفظی یعنی «آشپزی برایم آرامش‌بخش به نظر می‌رسد»: *mi se pare* راه رایج بیان نظر است.'
  ro.a1.unit30.lesson04.teach.ana_imi_place:
    title: سرگرمی‌های Ana
    gloss: 'Ana: من مطالعه را دوست دارم و اغلب موسیقی گوش می‌دهم.'
    note: دو فعل سرگرمی از درس‌های ۱ و ۲ را در یک جمله با *și* (و) ترکیب می‌کند.
  ro.a1.unit30.lesson04.teach.mihai_joci_si:
    title: Mihai دربارهٔ بازی می‌پرسد
    gloss: 'Mihai: تو هم بازی ویدیویی می‌کنی؟'
    note: یک پرسش کوتاه بلی/نخیر با *jocuri video* از درس ۲؛ *joci* شکل *tu* فعل *a juca* است.
  ro.a1.unit30.lesson04.teach.ana_nu_nu:
    title: Ana جواب می‌دهد
    gloss: 'Ana: نه، من هرگز بازی ویدیویی نمی‌کنم. اما گاهی نقاشی می‌کنم!'
    note: '*Niciodată* (هرگز) و *uneori* (گاهی) از درس ۳، در یک جواب در برابر هم؛ *nu ... niciodată* نفی دوگانه است.'
  ro.a1.unit30.lesson05.teach.mihai_si_cu:
    title: مقایسهٔ سرگرمی‌ها
    gloss: Mihai و من اغلب با هم قدم می‌زنیم. اما سرگرمی‌های دیگری هم داریم. Mihai آشپزی را دوست دارد، در خانه هم، و اغلب ورزش می‌کند. من مطالعه را دوست دارم و اغلب موسیقی گوش می‌دهم. گاهی نقاشی می‌کنم، اما هرگز بازی ویدیویی نمی‌کنم. تو در وقت آزادت چه کاری را دوست داری؟
    note: پیام Ana واقعیت‌های درس ۴ را مرور می‌کند و با پرسش اصلی این بخش از خواننده تمام می‌شود.
    glosses:
      plimbăm: قدم می‌زنیم
      des: اکثراً
      împreună: با هم
      alte: دیگر
      gătească: آشپزی می‌کند
      place: دوست دارد
      acasă: در خانه
      sport: ورزش می‌کند
      citesc: خواندن
      ascult: گوش می‌کنم
      muzică: موسیقی
      desenez: نقاشی می‌کنم
      uneori: گاهی
      joc: ویدیوگیم بازی می‌کنی
      niciodată: هرگز
      liber: آزاد
      timpul: وقت
  ro.a1.unit30.lesson06.teach.mihai_ce_faci:
    title: Mihai دربارهٔ آخر هفته می‌پرسد
    gloss: 'Mihai: این آخر هفته چه می‌کنی؟'
    note: '*În acest weekend* (این آخر هفته) برای «این» از *acest* استفاده می‌کند.'
  ro.a1.unit30.lesson06.teach.ana_inca_nu:
    title: Ana هنوز تصمیم نگرفته است
    gloss: 'Ana: هنوز نمی‌دانم. مطالعه را دوست دارم، اما می‌خواهم بیرون هم بروم.'
    note: '*Să ies afară* (بیرون رفتن) راه رایج گفتن این است که می‌خواهین از خانه بیرون شوین؛ *vreau să* + فعل یعنی «می‌خواهم ...».'
  ro.a1.unit30.lesson06.teach.mihai_hai_sa:
    title: Mihai یک برنامه پیشنهاد می‌کند
    gloss: 'Mihai: بیا با هم قدم بزنیم! بعد از آن من برای ما آشپزی می‌کنم.'
    note: '*După aceea* (بعد از آن) عبارت ترتیب است؛ *Hai să* + فعل پیشنهاد انجام کاری با هم است.'
  ro.a1.unit30.lesson06.teach.ana_buna_idee:
    title: Ana موافقت می‌کند
    gloss: 'Ana: فکر خوبی است! هم قدم زدن را دوست دارم و هم آشپزی را.'
    note: '*Și ..., și ...* («هم ... و هم ...») نشان می‌دهد Ana دو چیز را به یک اندازه دوست دارد، نه یکی را بیشتر از دیگری.'
  ro.a1.unit30.lesson06.teach.mihai_perfect_atunci:
    title: Mihai تأیید می‌کند
    gloss: 'Mihai: عالی. پس روز شنبه همدیگر را می‌بینیم!'
    note: جملهٔ دوستانهٔ پایانی که برنامه را برای *sâmbătă* (شنبه) تأیید می‌کند؛ *ne vedem* یعنی «همدیگر را می‌بینیم».
