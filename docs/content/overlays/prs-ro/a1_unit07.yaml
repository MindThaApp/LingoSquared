  ro.a1.unit07.lesson01.cat_costa:
    title: قیمتش چند است؟
  ro.a1.unit07.lesson02.rosii_si_cartofi:
    title: بادرنگان و کچالو
  ro.a1.unit07.lesson03.la_piata:
    title: در بازار
teaching:
  ro.a1.unit07.lesson01.teach.reminder_un_numere:
    title: 'یادآوری: un, doi, cinci, zece, douăzeci'
    gloss: un (یک) · doi (دو) · cinci (پنج) · zece (ده) · douăzeci (بیست)
    note: همهٔ این‌ها قبلاً در درس‌های پیشین آمده بودند (*un* در واحد ۴، عددها در واحد ۲) -- اینجا برای گفتن قیمت‌ها دوباره می‌آیند.
  ro.a1.unit07.lesson01.teach.cat_costa:
    title: قیمتش چند است؟
    gloss: Cât costă? (قیمتش چند است؟)
    note: راه معمول پرسیدن قیمت به رومانیایی -- نام جنس را بعد از آن بیاورید، یا وقتی جنس از موقعیت معلوم است، به همین شکل تنها بگویین.
  ro.a1.unit07.lesson01.teach.leu:
    title: Leu (واحد پول)
    gloss: 'leu (واحد پول رومانیا -- جمع: lei)'
    note: پول رومانیا. Leu مفرد است (یک لی)؛ جمع آن lei بی‌قاعده است، یعنی leu به‌علاوهٔ پسوند معمولی نیست.
    example_gloss: یک لی قیمت دارد.
  ro.a1.unit07.lesson01.teach.costa_cinci_lei:
    title: هشت لی قیمت دارد
    gloss: Costă opt lei. (هشت لی قیمت دارد.)
    note: با عددهای ۲ تا ۱۹، lei همین‌طور ساده می‌ماند -- پیش از آن کلمهٔ اضافی نمی‌آید.
  ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei:
    title: سی لی قیمت دارد
    gloss: Costă treizeci de lei. (سی لی قیمت دارد.)
    note: از ۲۰ به بالا، در رومانیایی پیش از اسمِ شمرده‌شده *de* می‌آید -- همان قاعده‌ای که واحد ۲ برای *ani* (سال‌ها) آموخت، حالا برای *lei*.
  ro.a1.unit07.lesson01.teach.leu_lei_de_rule:
    title: 'قاعده: leu → lei و وقت آوردن de'
    gloss: 'leu → lei · عددهای ۲ تا ۱۹: بدون *de* · عددهای ۲۰ به بالا: با *de*'
    note: دقیقاً همان الگوی قاعدهٔ *ani* در واحد ۲ (câți ani ai / am treizeci de ani) -- وقتی آن را برای یک اسم بدانین، برای lei هم به همین شکل کار می‌کند.
  ro.a1.unit07.lesson01.teach.scump:
    title: گران
    gloss: scump (گران)
    note: واکنش معمول در برابر قیمتی که فکر می‌کنین بلند است.
    example_gloss: هشت لی؟ گران!
  ro.a1.unit07.lesson01.teach.ieftin:
    title: ارزان
    gloss: ieftin (ارزان)
    note: ضد scump -- یک قیمت خوب.
    example_gloss: یک لی؟ ارزان!
  ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog:
    title: 'یادآوری: un, o, și, aș dori, vă rog, te rog'
    gloss: un/o (یک) · și (و) · aș dori (می‌خواستم) · vă rog (لطفاً، رسمی) · te rog (لطفاً، غیررسمی)
    note: '*Aș dori*، *vă rog* و *te rog* اول بار در صحنهٔ کافهٔ واحد ۶ آمدند -- اینجا در بازار دوباره می‌آیند.'
  ro.a1.unit07.lesson02.teach.piata:
    title: بازار
    gloss: piață (بازار)
    note: اسم مؤنث -- بازار روباز یا سرپوشیده که در آن مواد تازهٔ غذایی خریده می‌شود.
    example_gloss: در بازار قیمتش چند است؟
  ro.a1.unit07.lesson02.teach.rosii:
    title: بادرنگان
    gloss: roșii (بادرنگان)
    note: جمع roșie (یک دانه بادرنگان) -- وقتی دربارهٔ خریدن آن به شکل عمومی صحبت می‌کنین، به جمع گفته می‌شود.
    example_gloss: من بادنجان رومی می‌خواهم.
  ro.a1.unit07.lesson02.teach.cartofi:
    title: کچالو
    gloss: cartofi (کچالو)
    note: جمع cartof (یک دانه کچالو)، به همان الگوی roșii.
    example_gloss: کچالو می‌خواستم.
  ro.a1.unit07.lesson02.teach.kilogram:
    title: Kilogram
    gloss: kilogram (کیلوگرام)
    note: 'واحد معمول برای خرید اجناس به وزن. *De* آن را به چیزی که خریده می‌شود وصل می‌کند: kilogram *de* roșii، «یک کیلو بادرنگان».'
    example_gloss: یک کیلو بادرنگان.
  ro.a1.unit07.lesson02.teach.vreau:
    title: می‌خواهم
    gloss: vreau (می‌خواهم)
    note: ساده‌تر و مستقیم‌تر از *aș dori* («می‌خواستم») -- هر دو در بازار درست است، vreau فقط کمتر رسمی است.
    example_gloss: کچالو می‌خواهم.
  ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar:
    title: از کجا می‌توانم ... بخرم؟
    gloss: Unde pot să cumpăr roșii? (از کجا می‌توانم بادرنگان بخرم؟)
    note: وقتی نمی‌دانید از کجا خریداری کنید، پرسش به کار است -- roșii را با هر جنس دیگری که می‌خواهین عوض کنید.
  ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii:
    title: یک کیلو بادرنگان چند است؟
    gloss: Cât costă un kilogram de roșii? (یک کیلو بادرنگان قیمتش چند است؟)
    note: Cât costă و ساختار kilogram de ... را در یک پرسش کامل کنار هم می‌آورد.
  ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi:
    title: یک کیلو کچالو می‌خواهم
    gloss: Vreau un kilogram de cartofi. (یک کیلو کچالو می‌خواهم.)
    note: همان الگوی kilogram de ...، این بار به شکل جملهٔ خبری با vreau، نه پرسش.
  ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere:
    title: 'یادآوری: bună, ziua, mulțumesc, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (روز بخیر / سلام) · mulțumesc (تشکر) · bine (خوب) · la revedere (خدا حافظ) · Ana, Mihai (نام‌ها)
    note: همه در گفتگوهای واحد ۱ و واحد ۶ قبلاً آمده بودند -- اینجا آنا و میهای دوباره همدیگر را می‌بینند، این بار در بازار.
  ro.a1.unit07.lesson03.teach.line01:
    title: سلام و پرسیدن قیمت
    gloss: آنا به میهای سلام می‌دهد و قیمت یک کیلو بادرنگان را می‌پرسد.
    note: Cât costă همین واحد را با سلام واحد ۱ یکجا می‌کند.
  ro.a1.unit07.lesson03.teach.line02:
    title: گفتن قیمت
    gloss: میهای می‌گوید هشت لی قیمت دارد و واکنش نشان می‌دهد که ارزان است.
    note: costă/opt lei/ieftin همین واحد را دوباره به کار می‌برد.
  ro.a1.unit07.lesson03.teach.line03:
    title: سفارش مؤدبانه و افزودن یک جنس
    gloss: آنا موافقت می‌کند، مؤدبانه یک کیلو بادرنگان می‌خواهد و می‌گوید کچالو هم می‌خواهد.
    note: aș dori، vă rog و vreau را یکجا می‌آورد -- هر دو سطح گفتار از واژه‌های همین واحد در یک سخن.
  ro.a1.unit07.lesson03.teach.line04:
    title: گفتن قیمت دوم
    gloss: میهای می‌گوید یک کیلو کچالو پنج لی قیمت دارد.
    note: عدد پنج (cinci) از واحد ۲ دوباره به کار می‌رود که در یادآوری همین واحد هم آمده بود.
  ro.a1.unit07.lesson03.teach.line05:
    title: تشکر و ختم گفتگو
    gloss: آنا از میهای تشکر می‌کند و خدا حافظی می‌کند.
    note: '*Mulțumesc* اینجا یک تشکر ساده در پایان است، همان کلمه‌ای از *Bine, mulțumesc.* در واحد ۱.'
  ro.a1.unit07.lesson03.teach.line06:
    title: ختم دیدار
    gloss: میهای با گفتن نام آنا جواب خدا حافظی را می‌دهد.
    note: همان الگوی دوستانهٔ پایان که گفتگوهای واحدهای ۱، ۵ و ۶ هم با آن ختم شدند.
