  ro.a1.unit06.lesson03.la_cafenea:
    title: در کافه
teaching:
  ro.a1.unit06.lesson01.teach.reminder_un_o_si:
    title: 'یادآوری: un, o, și'
    gloss: یک · و
    note: هر سه قبلاً در واحدهای پیشین آمده بودند (*și* در واحد ۱، *o* در واحد ۲، *un* در واحد ۴) — اینجا دوباره برای صحبت دربارهٔ غذا و نوشیدنی می‌آیند.
  ro.a1.unit06.lesson01.teach.as_dori:
    title: می‌خواهم ...
    gloss: می‌خواستم ... (مؤدبانه)
    note: راه مؤدبانهٔ همیشگی برای سفارش دادن چیزی به رومانیایی — یک شکل شرطی ثابت که با کلمهٔ بعد از خودش تغییر نمی‌کند.
  ro.a1.unit06.lesson01.teach.apa:
    title: آب
    gloss: آب
    note: اسم مؤنث است؛ وقتی مقدار مشخص نباشد، بدون حرف نکره گفته می‌شود، مثل «آب» در دری.
    example_gloss: آب می‌خواستم.
  ro.a1.unit06.lesson01.teach.cafea:
    title: قهوه
    gloss: قهوه
    note: مؤنث است — مثل هر اسم مؤنث دیگر با *o* («یک») می‌آید.
    example_gloss: یک قهوه می‌خواستم.
  ro.a1.unit06.lesson01.teach.ceai:
    title: چای
    gloss: چای
    note: با *un* («یک») می‌آید نه *o* — ceai اسم مذکر/خنثی است.
    example_gloss: یک چای می‌خواستم.
  ro.a1.unit06.lesson01.teach.suc:
    title: آبمیوه
    gloss: آب میوه
    note: این هم با *un* می‌آید، به همان شکل ceai.
    example_gloss: یک آب میوه می‌خواستم.
  ro.a1.unit06.lesson01.teach.lapte:
    title: شیر
    gloss: شیر
    note: مثل apă، وقتی مقدار مشخص نباشد معمولاً بدون حرف نکره گفته می‌شود.
    example_gloss: شیر می‌خواستم.
  ro.a1.unit06.lesson01.teach.mi_e_sete:
    title: من تشنه هستم
    gloss: من تشنه هستم
    note: یک عبارت ثابت — معنی لفظی‌اش بیشتر «تشنگی برای من است» می‌باشد تا «من تشنه هستم».
  ro.a1.unit06.lesson01.teach.as_dori_o_cafea:
    title: یک قهوه می‌خواهم
    gloss: من یک قهوه می‌خواهم.
    note: عبارت سفارش و اسم مؤنث یک نوشیدنی را در یک جملهٔ کامل کنار هم می‌آورد.
  ro.a1.unit06.lesson02.teach.reminder_multumesc_bine_da_nu:
    title: 'یادآوری: mulțumesc, bine, da, nu'
    gloss: تشکر · خوب · بلی · نه
    note: '*Mulțumesc* و *bine* اول در سلام‌وعلیک واحد ۱ آمدند و *da* و *nu* در واحد ۳ و واحد ۵ — اینجا دوباره دربارهٔ غذا و ادب برمی‌گردند.'
  ro.a1.unit06.lesson02.teach.mi_e_foame:
    title: من گرسنه هستم
    gloss: من گرسنه هستم
    note: همان الگوی عبارت ثابت *Mi-e sete* است، فقط با foame (گرسنگی) به جای sete (تشنگی).
  ro.a1.unit06.lesson02.teach.paine:
    title: نان
    gloss: نان
    note: معمولاً بدون حرف نکره گفته می‌شود.
    example_gloss: من گرسنه هستم. نان می‌خواستم.
  ro.a1.unit06.lesson02.teach.mancare:
    title: غذا
    gloss: غذا
    note: کلمهٔ عمومی برای «غذا»، نه یک نوع خاص غذا.
    example_gloss: غذا می‌خواستم.
  ro.a1.unit06.lesson02.teach.carne:
    title: گوشت
    gloss: گوشت
    note: کلمهٔ عمومی برای «گوشت» — نوع‌های خاص (carne de vită، carne de porc) بعد از آن نوع را اضافه می‌کنند.
    example_gloss: گوشت می‌خواستم.
  ro.a1.unit06.lesson02.teach.pui:
    title: مرغ
    gloss: مرغ
    note: کلمهٔ مخصوص برای مرغ (به‌عنوان غذا)، جدا از کلمهٔ عمومی carne.
    example_gloss: مرغ می‌خواستم.
  ro.a1.unit06.lesson02.teach.fructe:
    title: میوه
    gloss: میوه
    note: شکل جمعِ روزمره است و برای مفهوم عمومی «میوه» به کار می‌رود.
    example_gloss: میوه می‌خواستم.
  ro.a1.unit06.lesson02.teach.va_rog:
    title: لطفاً (رسمی)
    gloss: لطفاً (رسمی)
    note: راه مؤدبانهٔ گفتن «لطفاً» — با سبک رسمی dumneavoastră که در واحد ۱ و واحد ۲ آمد جور است.
    example_gloss: یک قهوه، لطفاً.
  ro.a1.unit06.lesson02.teach.te_rog:
    title: لطفاً (غیررسمی)
    gloss: لطفاً (غیررسمی)
    note: شکل روزمره که با دوستان و کسانی که با *tu* خطابشان می‌کنین به کار می‌رود — با سبک tu در واحد ۱ جور است.
    example_gloss: یک چای، لطفاً.
  ro.a1.unit06.lesson03.teach.reminder_buna_ziua_bine_la_revedere:
    title: 'یادآوری: bună, ziua, bine, la revedere, Ana, Mihai'
    gloss: روز بخیر / سلام · خوب · خدا حافظ · Ana، Mihai (نام‌ها)
    note: همه قبلاً در گفتگوهای واحد ۱ و واحد ۵ آمده‌اند — اینجا Ana و Mihai دوباره همدیگر را می‌بینند، این بار در یک کافه.
  ro.a1.unit06.lesson03.teach.line01:
    title: سلام کردن و گفتن گرسنگی
    gloss: Ana به Mihai سلام می‌کند و می‌گوید گرسنه است.
    note: '*Mi-e foame* همین واحد درست در سلام به کار رفته است.'
  ro.a1.unit06.lesson03.teach.line02:
    title: سفارش غذا
    gloss: Mihai می‌گوید نان و مرغ می‌خواهد.
    note: کلمه‌های pâine/pui همین واحد دوباره با عبارت Aș dori می‌آیند.
  ro.a1.unit06.lesson03.teach.line03:
    title: سفارش مؤدبانهٔ نوشیدنی
    gloss: Ana می‌گوید یک قهوه می‌خواهد، لطفاً.
    note: Aș dori، cafea و vă rog را کنار هم می‌آورد — سه چیزی که در این واحد جدا جدا یاد گرفتید.
  ro.a1.unit06.lesson03.teach.line04:
    title: سفارش نوشیدنی هم
    gloss: Mihai می‌گوید یک چای می‌خواهد، لطفاً.
    note: همان الگوی جملهٔ Ana است، فقط با ceai به جای cafea.
  ro.a1.unit06.lesson03.teach.line05:
    title: تشکر و خدا حافظی
    gloss: Ana از Mihai تشکر می‌کند و خدا حافظی می‌کند.
    note: '*Mulțumesc* اینجا یک تشکر ساده در پایان صحبت است، همان کلمهٔ *Bine, mulțumesc.* در واحد ۱.'
  ro.a1.unit06.lesson03.teach.line06:
    title: پایان دادن به دیدار
    gloss: Mihai هم خدا حافظی می‌کند و نام Ana را می‌گیرد.
    note: همان شیوهٔ دوستانهٔ پایان که گفتگوهای واحد ۱ و واحد ۵ هر دو با آن تمام شدند.
