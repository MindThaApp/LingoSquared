teaching:
  ro.a1.unit12.lesson01.teach.reminder_parc_cinema:
    title: 'یادآوری: parc, cinema'
    gloss: parc (پارک) · cinema (سینما)
    note: هر دو در واحد ۱۱ آمده‌اند -- این‌جا با دستور زمان گذشتهٔ تازهٔ همین واحد ترکیب می‌شوند.
  ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata:
    title: 'یادآوری: astăzi, mâine, duminică, sâmbătă'
    gloss: astăzi (امروز) · mâine (فردا) · duminică (یکشنبه) · sâmbătă (شنبه)
    note: همه در واحد ۳ و واحد ۱۱ آمده‌اند -- این‌جا زمینه را برای تفاوت با *ieri* (دیروز)ِ تازهٔ همین درس آماده می‌کنند.
  ro.a1.unit12.lesson01.teach.am_fost_vocab:
    title: من بودم / من رفتم
    gloss: Am fost (من بودم / من رفتم)
    note: زمان گذشتهٔ ترکیبی فعل *a fi* (بودن) -- *am* کلمهٔ کمکیِ ثابت برای «من» و «ما» است و *fost* شکل ثابت گذشته. همراه با یک مکان، *am fost la...* راه روزمره و طبیعی برای گفتن «به ... رفتم» است -- در گفتار از فعلی مثل «پیاده رفتم / سفر کردم» رایج‌تر است.
    example_gloss:
    - به پارک رفتم.
  ro.a1.unit12.lesson01.teach.am_fost_parc_phrase:
    title: به پارک رفتم
    gloss: Am fost la parc. (به پارک رفتم.)
    note: 'الگوی کامل: am fost + la + مکان.'
  ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase:
    title: به سینما رفتم
    gloss: Am fost la cinema. (به سینما رفتم.)
    note: همان الگوی *Am fost la parc*، با مکانی دیگر.
  ro.a1.unit12.lesson01.teach.ieri_vocab:
    title: دیروز
    gloss: Ieri (دیروز)
    note: در واحد ۳ در کنار *astăzi* (امروز) و *mâine* (فردا) آمده بود -- حالا با زمان گذشته به کار می‌رود و در آغاز جمله می‌آید تا بگوید چیزی کی اتفاق افتاده.
    example_gloss:
    - دیروز به پارک رفتم.
  ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase:
    title: دیروز به پارک رفتم
    gloss: Ieri am fost la parc. (دیروز به پارک رفتم.)
    note: اضافه کردن *ieri* به اول *Am fost la parc* زمانِ دقیق را مشخص می‌کند.
  ro.a1.unit12.lesson02.teach.reminder_mananc_beau:
    title: 'یادآوری: mănânc, beau'
    gloss: mănânc (می‌خورم) · beau (می‌نوشم)
    note: هر دو در روال روزانهٔ واحد ۱۰ آمده‌اند -- این درس آن‌ها را به شکل گذشته درمی‌آورد.
  ro.a1.unit12.lesson02.teach.reminder_paine_cafea_ceai_si:
    title: 'یادآوری: pâine, cafea, ceai, și'
    gloss: pâine (نان) · cafea (قهوه) · ceai (چای) · și (و)
    note: همه در واحد ۶ و واحد ۱۰ آمده‌اند -- این‌جا در جمله‌های گذشتهٔ همین درس دوباره به کار می‌روند.
  ro.a1.unit12.lesson02.teach.am_mancat_vocab:
    title: خوردم
    gloss: Am mâncat (خوردم)
    note: زمان گذشتهٔ ترکیبی فعل *a mânca* (خوردن) که قبلاً به شکل *mănânc* (می‌خورم، واحد ۱۰) دیده‌اید -- همان فعل، در زمان گذشته. Am + mâncat، همان الگوی *am fost*.
    example_gloss:
    - نان خوردم.
  ro.a1.unit12.lesson02.teach.am_mancat_paine_phrase:
    title: نان خوردم
    gloss: Am mâncat pâine. (نان خوردم.)
    note: 'الگوی کامل: am mâncat + خوراکی.'
  ro.a1.unit12.lesson02.teach.am_baut_vocab:
    title: نوشیدم
    gloss: Am băut (نوشیدم)
    note: زمان گذشتهٔ ترکیبی فعل *a bea* (نوشیدن) که قبلاً به شکل *beau* (می‌نوشم، واحد ۱۰) دیده‌اید -- همان فعل، در زمان گذشته.
    example_gloss:
    - چای نوشیدم.
  ro.a1.unit12.lesson02.teach.am_baut_ceai_phrase:
    title: چای نوشیدم
    gloss: Am băut ceai. (چای نوشیدم.)
    note: 'الگوی کامل: am băut + نوشیدنی.'
  ro.a1.unit12.lesson02.teach.am_mancat_am_baut_phrase:
    title: نان خوردم و چای نوشیدم
    gloss: Am mâncat pâine și am băut ceai. (نان خوردم و چای نوشیدم.)
    note: دو کار گذشته با *și* وصل شده‌اند -- همان حرف ربطی که واحد ۱۰ برای کارهای روزمرهٔ زمان حال به کار برده بود.
  ro.a1.unit12.lesson03.teach.reminder_am_fost_ieri_parc_cinema:
    title: 'یادآوری: am fost, ieri, parc, cinema'
    gloss: am fost (من بودم / من رفتم) · ieri (دیروز) · parc (پارک) · cinema (سینما)
    note: همه از درس اول همین واحد استند -- این‌جا مرور یکشنبهٔ آن‌ها را آماده می‌کنند.
  ro.a1.unit12.lesson03.teach.reminder_am_mancat_am_baut:
    title: 'یادآوری: am mâncat, am băut, pâine, cafea, ceai'
    gloss: am mâncat (خوردم) · am băut (نوشیدم) · pâine (نان) · cafea (قهوه) · ceai (چای)
    note: همه از درس دوم همین واحد استند -- این‌جا Ana و Mihai هر کدام می‌گویند چه خورده‌اند و چه نوشیده‌اند.
  ro.a1.unit12.lesson03.teach.reminder_cum_duminica_bine:
    title: 'یادآوری: cum, duminică, bine, mulțumesc, la revedere, Ana, Mihai'
    gloss: cum (چطور، واحد ۱ و واحد ۹) · duminică (یکشنبه، واحد ۳) · bine (خوب، واحد ۱) · mulțumesc (تشکر) · la revedere (خدا حافظ) · Ana, Mihai (نام‌ها)
    note: 'همه در واحدهای قبلی آمده‌اند -- *cum* اول برای پرسیدن اسم کسی (واحد ۱) و پرسیدن آدرس (واحد ۹) آمده بود و این‌جا نوع دیگری از پرسش را شروع می‌کند: چیزی چطور گذشت.'
  ro.a1.unit12.lesson03.teach.a_fost_vocab:
    title: بود
    gloss: A fost (بود)
    note: شخص دیگری از همان فعل *am fost* -- *a* کلمهٔ کمکیِ «او / آن» است، نه «من / ما». فعلاً *Cum a fost...?* و *A fost bine!* را مثل عبارت‌های ثابت یاد بگیرین، نه الگویی برای ساختن آزادانه.
    example_gloss:
    - خوب بود!
  ro.a1.unit12.lesson03.teach.a_fost_bine_phrase:
    title: خوب بود!
    gloss: A fost bine! (خوب بود!)
    note: راه کوتاه و طبیعی برای گفتن این‌که چیزی خوب گذشت -- جواب *Cum a fost...?*
  ro.a1.unit12.lesson03.teach.cum_a_fost_duminica_phrase:
    title: یکشنبه چطور بود؟
    gloss: Cum a fost duminică? (یکشنبه چطور بود؟)
    note: راه طبیعی برای شروع صحبت درباره یک روز گذشته است، حتی با کسی که خودش هم آنجا بوده؛ یعنی از او بخواهی بگوید چه احساسی داشت یا چه چیزی بیشتر یادش مانده.
  ro.a1.unit12.lesson03.teach.line01:
    title: سلام و پرسیدن درباره یکشنبه
    gloss: میهای به انا سلام می‌دهد و می‌پرسد یکشنبه چطور بود.
    note: '*Cum a fost duminică?* همین واحد با *Bună* که قبلاً یاد گرفته‌ای یکجا شده است.'
  ro.a1.unit12.lesson03.teach.line02:
    title: جواب دادن و گفتن جا
    gloss: انا می‌گوید خوب بود و به پارک رفته بود.
    note: '*A fost bine!* با *Am fost la parc* از درس اول همین واحد یکجا شده است.'
  ro.a1.unit12.lesson03.teach.line03:
    title: گفتن اینکه چه خورد و چه نوشید
    gloss: میهای می‌گوید نان خورد و چای نوشید.
    note: جمله *Am mâncat pâine și am băut ceai* از درس دوم دوباره آمده است و با ترتیبی که میهای در واحد ۶ داشت (pâine و ceai) مطابقت دارد.
  ro.a1.unit12.lesson03.teach.line04:
    title: گفتن اینکه چه نوشید
    gloss: انا می‌گوید قهوه نوشید.
    note: با ترتیبی که انا در واحد ۶ داشت (cafea) مطابقت دارد.
  ro.a1.unit12.lesson03.teach.line05:
    title: تشکر و خداحافظی
    gloss: میهای از انا تشکر می‌کند و خداحافظی می‌کند.
    note: همان الگوی ختم صحبت که دیالوگ همه واحدهای قبلی با آن تمام شده است.
  ro.a1.unit12.lesson03.teach.line06:
    title: ختم صحبت
    gloss: انا هم خداحافظی می‌کند و نام میهای را می‌گوید.
    note: همان الگوی دوستانهٔ ختم صحبت که دیالوگ همه واحدهای قبلی با آن تمام شده است.
