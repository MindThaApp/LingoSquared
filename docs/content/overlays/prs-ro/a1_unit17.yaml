teaching:
  ro.a1.unit17.lesson01.teach.reminder_este_la_mihai:
    title: 'یادآوری: este, la, Mihai'
    gloss: este (است) · la (در) · Mihai (نام)
    note: Este از واحدهای ۳، ۴ و ۸ است؛ la از *la ora nouă* (ساعت نه) در واحد ۴ است؛ Mihai نام شخصیت گفتگوهاست که از واحد ۱ معرفی شده -- این واحد هر سه را برای صحبت دربارهٔ شغل او دوباره به کار می‌برد.
  ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza:
    title: 'یادآوری: lucrez, lucrează'
    gloss: lucrez (کار می‌کنم) · lucrează (او کار می‌کند)
    note: هر دو از برنامهٔ روزانهٔ واحد ۱۰ استند (*Lucrez seara.*) -- این واحد آن‌ها را برای صحبت دربارهٔ شغل به کار می‌برد، نه وقت روز.
  ro.a1.unit17.lesson01.teach.inginer_vocab:
    title: انجنیر
    gloss: Inginer (انجنیر)
    note: مذکر -- در این واحد فقط Mihai آن را به کار می‌برد (*Sunt inginer*)، پس هنوز به شکل مؤنث ضرورت نیست.
    example_gloss:
    - Mihai انجنیر است.
  ro.a1.unit17.lesson01.teach.birou_vocab:
    title: دفتر
    gloss: Birou (دفتر)
    note: جایی که Mihai در آن کار می‌کند؛ با حرف اضافهٔ *la* (در) که در واحد ۴ آموخته شد.
    example_gloss:
    - او در دفتر کار می‌کند.
  ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase:
    title: Mihai انجنیر است. او در دفتر کار می‌کند.
    gloss: Mihai este inginer. Lucrează la birou.
    note: همهٔ کلمه‌های این‌جا قبلاً آموخته شده یا همین حالا معرفی شده‌اند و در دو جملهٔ تازه دربارهٔ شغل Mihai کنار هم آمده‌اند.
  ro.a1.unit17.lesson02.teach.reminder_sunt_unde_ana:
    title: 'یادآوری: sunt, unde, Ana'
    gloss: sunt (استم) · unde (کجا) · Ana (نام)
    note: Sunt از واحد ۱۶ است (*Sunt bolnav*)؛ unde از واحدهای ۷ و ۸ است (*Unde pot să cumpăr...?*، *Unde este...?*)؛ Ana نام شخصیت گفتگوهاست که از واحد ۱ معرفی شده -- این واحد هر سه را برای صحبت دربارهٔ شغل Ana دوباره به کار می‌برد.
  ro.a1.unit17.lesson02.teach.profesoara_vocab:
    title: معلم
    gloss: Profesoară (معلم، مؤنث)
    note: مؤنث -- در این واحد فقط Ana آن را به کار می‌برد (*Sunt profesoară*)، پس هنوز به شکل مذکر ضرورت نیست.
    example_gloss:
    - من معلم استم.
  ro.a1.unit17.lesson02.teach.scoala_vocab:
    title: مکتب
    gloss: Școală (مکتب)
    note: جایی که Ana در آن کار می‌کند؛ *la* مثل *la birou* به کار رفته است.
    example_gloss:
    - من در مکتب کار می‌کنم.
  ro.a1.unit17.lesson02.teach.sunt_profesoara_lucrez_la_scoala_phrase:
    title: من معلم استم. در مکتب کار می‌کنم.
    gloss: Sunt profesoară. Lucrez la școală.
    note: گفتهٔ خود Ana دربارهٔ شغلش؛ دو کلمهٔ تازهٔ این درس با *sunt* که در واحد ۱۶ آموخته شد یکجا شده‌اند.
  ro.a1.unit17.lesson02.teach.unde_lucrati_phrase:
    title: در کجا کار می‌کنی؟
    gloss: Unde lucrați? (شما کجا کار می‌کنین؟، رسمی)
    note: '*Lucrați* شکل رسمی «شما کار می‌کنین» است، با همان پایان -ați/-eți که در *aveți*/*faceți* دیده شد -- برای پرسیدن شغل هر کس مفید است.'
  ro.a1.unit17.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'یادآوری: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (سلام) · Ce mai faceți? (حال شما چطور است؟، رسمی) · Bine, mulțumesc (خوبم، تشکر)
    note: همه از سلام و احوال‌پرسی آغازین واحد ۱ استند و این‌جا برای شروع گفتگوی همین واحد دوباره آمده‌اند.
  ro.a1.unit17.lesson03.teach.reminder_si_dumneavoastra_la_revedere:
    title: 'یادآوری: Și dumneavoastră?, La revedere'
    gloss: Și dumneavoastră? (و شما؟، رسمی) · La revedere (خدا حافظ)
    note: هر دو از واحد ۱ استند و این‌جا به‌حیث پرسش بعدی و جملهٔ پایانی طبیعی دوباره آمده‌اند.
  ro.a1.unit17.lesson03.teach.line01:
    title: سلام کردن و احوال پرسیدن
    gloss: Ana به Mihai سلام می‌کند و احوالش را می‌پرسد.
    note: احوال‌پرسی *Ce mai faceți?* واحد ۱ دوباره به کار رفته است.
  ro.a1.unit17.lesson03.teach.line02:
    title: جواب دادن و پرسیدن محل کار
    gloss: Mihai جواب می‌دهد، بعد از Ana می‌پرسد که کجا کار می‌کند.
    note: '*Bine, mulțumesc* واحد ۱ با *Unde lucrați?* همین واحد یکجا شده است.'
  ro.a1.unit17.lesson03.teach.line03:
    title: گفتن شغل و محل کار، و بعد پرسیدن از طرف مقابل
    gloss: Ana می‌گوید در مکتب به حیث معلم کار می‌کند، بعد همین پرسش را از Mihai می‌کند.
    note: عبارت درس دوم همین واحد با *Și dumneavoastră?* واحد ۱ یکجا شده است.
  ro.a1.unit17.lesson03.teach.line04:
    title: گفتن شغل و محل کار
    gloss: Mihai می‌گوید در دفتر به حیث انجنیر کار می‌کند.
    note: عبارت درس اول همین واحد تقریباً بدون تغییر دوباره به کار رفته است.
  ro.a1.unit17.lesson03.teach.line05:
    title: ختم گفتگو
    gloss: Ana خدا حافظی می‌کند.
    note: همان الگوی پایانی که گفتگوی هر واحد قبلی با آن ختم شده است.
  ro.a1.unit17.lesson03.teach.line06:
    title: خدا حافظی کردن
    gloss: Mihai خدا حافظی می‌کند.
    note: همان الگوی پایانی که گفتگوی هر واحد قبلی با آن ختم شده است.
