answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: This unit's new "Ai frați?"/"Aveți frați?" and "Câți copii ai?"/"Câți copii aveți?" pairs are register-sensitive (tu vs. dumneavoastră, parallel to unit02's ai/aveți age questions) -- accept either register unless an exercise explicitly names one. Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: رومانیایی به دری A1
  description: صحبت دربارهٔ خانواده به زبان رومانیایی — والدین، برادر و خواهر، فرزندان و وضعیت تأهل، با جفت ملکیت meu/mea و همان تفاوت پرسش‌های tu/dumneavoastră از پرسش‌های سن واحد ۲ — در ادامهٔ آشنایی Ana و Mihai با خانوادهٔ همدیگر.
units:
  ro.a1.unit05.family:
    title: خانواده
lessons:
  ro.a1.unit05.lesson01.familia_mea:
    title: خانوادهٔ من
  ro.a1.unit05.lesson02.frati_si_copii:
    title: برادر، خواهر و فرزندان
  ro.a1.unit05.lesson03.o_discutie_despre_familie:
    title: صحبت دربارهٔ خانواده
teaching:
  ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare:
    title: 'یادآوری: am, un, o, și, mare'
    gloss: دارم · یک · و · بزرگ
    note: هر پنج کلمه قبلاً در واحدهای پیشین آمده بودند (*și* در واحد ۱، *am* و *o* در واحد ۲، *mare* در یادداشت «حرف بزرگ» واحد ۳، *un* در واحد ۴) — اینجا برای صحبت دربارهٔ خانواده دوباره می‌آیند.
  ro.a1.unit05.lesson01.teach.familie:
    title: خانواده
    gloss: خانواده
    note: اسم مؤنث — با *o* و صفتی مثل *mare* می‌آید تا بگوییم «یک خانوادهٔ بزرگ».
    example_gloss: من یک خانوادهٔ بزرگ دارم.
  ro.a1.unit05.lesson01.teach.mama:
    title: مادر
    gloss: مادر
    note: کلمهٔ ساده و قاموسی برای «مادر» — چند کارت بعد می‌بینین که «مادر من» چطور گفته می‌شود.
    example_gloss: Mihai یک مادر و یک پدر دارد.
  ro.a1.unit05.lesson01.teach.tata:
    title: پدر
    gloss: پدر
    note: کلمهٔ ساده و قاموسی برای «پدر».
    example_gloss: پدر من معلم است.
  ro.a1.unit05.lesson01.teach.parintii:
    title: پدر و مادر
    gloss: والدین
    note: مادر و پدر را با هم یکجا می‌رساند، مثل کلمهٔ «والدین» در دری.
    example_gloss: مادر و پدرم در رومانیا زندگی می‌کنند.
  ro.a1.unit05.lesson01.teach.meu_mea:
    title: '«من» در ملکیت: meu یا mea'
    gloss: مال من (مذکر) / مال من (مؤنث)
    note: کلمهٔ رومانیایی برای «مال من» با جنسیت چیزِ ملکیت‌شده هماهنگ می‌شود، نه با جنسیت صاحبش — *meu* با اسم مذکر مثل *tată* و *mea* با اسم مؤنث مثل *mamă*.
  ro.a1.unit05.lesson01.teach.mama_mea:
    title: مادرم
    gloss: مادرم
    note: Mamă پیش از آن‌که mea بیاید، به mama تبدیل می‌شود (حرف تعریف می‌گیرد) — «مادر من» را واقعاً با همین شکل ترکیبی می‌گویند، نه ترجمهٔ کلمه به کلمه.
  ro.a1.unit05.lesson01.teach.tatal_meu:
    title: پدرم
    gloss: پدرم
    note: Tată پیش از آن‌که meu بیاید، به tatăl تبدیل می‌شود (حرف تعریف را به‌شکل بی‌قاعده با -l می‌گیرد، چون tată از پیش به -ă ختم می‌شود).
  ro.a1.unit05.lesson01.teach.mama_si_tatal:
    title: مادر من و پدر من
    gloss: مادر من و پدر من.
    note: هر دو شکل ملکیت را در یک جمله می‌آورد، هر کدام با هماهنگی درست جنسیت خودش.
  ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu:
    title: 'یادآوری: câți, ai, aveți, doi, nu'
    gloss: چند تا · داری/دارید (غیررسمی/رسمی) · دو · نه/نی
    note: '*Câți*، *ai* و *aveți* اولین بار در واحد ۲ برای پرسیدن سن آمدند («Câți ani ai?»)؛ اینجا دربارهٔ برادر و خواهر و فرزندان می‌پرسند. *Doi* از اعداد واحد ۲ و *nu* از واحد ۳ است.'
  ro.a1.unit05.lesson02.teach.da:
    title: بلی
    gloss: بلی
    note: کلمهٔ روزمره برای «بلی»، جوره *nu* («نه») از واحد ۳.
    example_gloss: بلی، یک برادر دارم.
  ro.a1.unit05.lesson02.teach.frate_sora:
    title: برادر، خواهر
    gloss: برادر / خواهر
    note: اسم‌های مذکر و مؤنث برای برادر و خواهر — مثل هر اسم دیگر با un/o می‌آیند.
    example_gloss:
    - من یک برادر دارم.
    - من یک خواهر دارم.
  ro.a1.unit05.lesson02.teach.frati_surori:
    title: برادرها، خواهرها
    gloss: برادرها / خواهرها
    note: شکل‌های جمع که برای پرسیدن عمومی دربارهٔ برادر و خواهر به کار می‌روند — رومانیایی‌ها معمولاً می‌پرسند «Ai frați?» (یعنی «برادر داری؟») به معنای «برادر و خواهر داری؟»، و بعد اغلب جداگانه «Surori?» را برای خواهرها می‌پرسند.
    example_gloss: برادر یا خواهر داری؟
  ro.a1.unit05.lesson02.teach.ai_frati:
    title: برادر و خواهر داری؟ (غیررسمی)
    gloss: برادر داری؟
    note: شیوهٔ روزمره و غیررسمی پرسیدن — با شکل *tu* واحد ۱ جور است.
  ro.a1.unit05.lesson02.teach.aveti_frati:
    title: برادر و خواهر دارید؟ (رسمی)
    gloss: برادر دارید؟
    note: شکل مؤدبانه، همان *aveți* که در پرسش سن واحد ۲ بود.
  ro.a1.unit05.lesson02.teach.copil_copii:
    title: بچه، بچه‌ها
    gloss: بچه / بچه‌ها
    note: Copil یکی از جمع‌های دشوار رومانیایی است — copii، نه پایان عادی -i یا -e — بهتر است به‌عنوان یک شکل جداگانه یاد گرفته شود.
    example_gloss: دو بچه دارم.
  ro.a1.unit05.lesson02.teach.fiu_fiica:
    title: پسر، دختر
    gloss: پسر / دختر
    note: کلمه‌های مخصوص برای پسر و دختر، جدا از کلمهٔ عمومی copil/copii.
    example_gloss:
    - من یک پسر دارم.
    - من یک دختر دارم.
  ro.a1.unit05.lesson02.teach.cati_copii_ai:
    title: چند بچه داری؟
    gloss: چند بچه داری؟
    note: Câți (چند) + copii (بچه‌ها) + ai (داری) — هر سه از قبل آشنا استند.
  ro.a1.unit05.lesson02.teach.casatorit:
    title: متأهل
    gloss: ازدواج کرده
    note: پرسش معمول شخصی در گفتگوی روزمره، مثل پرسیدن سن.
    example_gloss: ازدواج کرده‌ای؟
  ro.a1.unit05.lesson03.teach.reminder_bine_la_revedere:
    title: 'یادآوری: bine, la revedere, Ana, Mihai'
    gloss: خوب · خداحافظ · Ana و Mihai (نام‌ها)
    note: واژه‌های واحدهای پیشین را مرور می‌کند که در گفتگوی این درس دوباره به کار رفته‌اند.
  ro.a1.unit05.lesson03.teach.line01:
    title: پرسیدن دربارهٔ برادر و خواهر
    gloss: Ana از Mihai می‌پرسد که برادر یا خواهر دارد یا نه.
    note: شکل مؤدبانهٔ *aveți* را به کار می‌برد، مطابق سطح رسمیتی که بین آن‌ها شکل گرفته است.
  ro.a1.unit05.lesson03.teach.line02:
    title: جواب دادن و پرسیدن
    gloss: Mihai می‌گوید یک برادر و یک خواهر دارد و از Ana می‌پرسد که بچه دارد یا نه.
    note: واژه‌های frate/soră و copii همین واحد را در یک گفتگو دوباره به کار می‌برد.
  ro.a1.unit05.lesson03.teach.line03:
    title: جواب دادن و سوال را پس دادن
    gloss: Ana می‌گوید یک دختر دارد و همان سوال را از Mihai می‌پرسد.
    note: '*Și dumneavoastră?* («و شما؟») همان الگوی پرسیدنِ متقابل معرفی‌های واحد ۱ است.'
  ro.a1.unit05.lesson03.teach.line04:
    title: جواب
    gloss: Mihai می‌گوید یک پسر دارد.
    note: جواب کوتاه و مستقیم با fiu همین واحد.
  ro.a1.unit05.lesson03.teach.line05:
    title: واکنش و ختم گفتگو
    gloss: Ana واکنش مثبت نشان می‌دهد و خداحافظی می‌کند.
    note: '*Bine!* اینجا واکنش مثبت کوتاهی است، همان کلمه‌ای که در *Bine, mulțumesc.* واحد ۱ بود.'
  ro.a1.unit05.lesson03.teach.line06:
    title: ختم دیدار
    gloss: Mihai هم خداحافظی می‌کند و نام Ana را می‌گیرد.
    note: همان الگوی دوستانهٔ پایان که گفتگوهای واحد ۱ و ۴ هم با آن تمام شدند.
