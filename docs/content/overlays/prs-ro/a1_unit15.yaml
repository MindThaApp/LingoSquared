answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (tren, pleacă, bilet, peron, București, Drum bun) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing formal register with each other; no new tu/dumneavoastră form is introduced this unit.
course:
  title: رومانیایی به دری A1
  description: سفر ساده با ریل به زبان رومانیایی -- Tren (ریل)، Bilet (تکت)، Peron (پلاتفورم) و Pleacă (حرکت می‌کند) -- وقتی Mihai با ریل به București می‌رود و Ana او را در gară بدرقه می‌کند.
units:
  ro.a1.unit15.travel:
    title: سفر
lessons:
  ro.a1.unit15.lesson01.trenul_pleaca:
    title: ریل حرکت می‌کند
  ro.a1.unit15.lesson02.un_bilet_va_rog:
    title: یک تکت، لطفاً
  ro.a1.unit15.lesson03.la_gara:
    title: در ستیشن ریل
teaching:
  ro.a1.unit15.lesson01.teach.reminder_gara_ora:
    title: 'یادآوری: gară، este، la، ce، oră، ora، nouă'
    gloss: gară (ستیشن ریل) · este (است) · la (در / به) · ce (چه) · oră (ساعت) · ora (ساعت، معرفه) · nouă (نه)
    note: 'Gară از واحد ۸ و ۹ است؛ este/la/ce/oră/ora/nouă از واحد ۴ (وقت) اند -- این واحد الگوی "la ce oră"/"la ora nouă" واحد ۴ را برای هدف تازه به کار می‌برد: پرسیدن دربارهٔ ریل به‌جای صنف.'
  ro.a1.unit15.lesson01.teach.tren_vocab:
    title: ریل
    gloss: Tren (ریل)
    note: 'خنثی و ختم‌شده به همخوان (در مفرد، اسم‌های خنثی مثل مذکر رفتار می‌کنند: *un tren*) -- برای «ریل» *-ul* می‌گیرد، مثل *magazin*->*magazinul*؛ اسم‌های ختم‌شده به *-ă* مثل *gară* به‌جایش *-a* می‌گیرند (*gara*).'
    example_gloss:
    - ریل در ایستگاه است.
  ro.a1.unit15.lesson01.teach.pleaca_vocab:
    title: حرکت می‌کند / می‌رود
    gloss: حرکت می‌کند (او)
    note: فعلی که برای حرکت قطار، بس یا طیاره به کار می‌رود. *Trenul pleacă* — *este* لازم نیست، چون *pleacă* خودش یک فعل کامل است.
    example_gloss:
    - قطار حرکت می‌کند.
  ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase:
    title: قطار ساعت نُه حرکت می‌کند
    gloss: قطار ساعت نُه حرکت می‌کند.
    note: '*trenul* + *pleacă* با *la ora nouă* همین واحد ۴ یکجا شده است؛ هیچ کلمهٔ تازهٔ وقت لازم نیست.'
  ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase:
    title: ریل ساعت چند حرکت می‌کند؟
    gloss: قطار ساعت چند حرکت می‌کند؟
    note: همان قالب سوال *La ce oră...?* از واحد ۴ است، فقط حالا دربارهٔ *trenul* می‌پرسد، نه دربارهٔ یک صنف.
  ro.a1.unit15.lesson01.teach.peron_vocab:
    title: پلاتفورم
    gloss: پلت‌فورم
    note: پلت‌فورم ایستگاه قطار. جنس بی‌جان (neutru) است و به حرف بی‌صدا ختم می‌شود، پس «پلت‌فورم» (با نشانهٔ معرفه) *peronul* می‌شود؛ همان پسوند *-ul* مثل *tren*←*trenul*.
    example_gloss:
    - قطار در پلت‌فورم سه است.
  ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase:
    title: قطار از کدام پلت‌فورم حرکت می‌کند؟
    gloss: قطار از کدام پلت‌فورم حرکت می‌کند؟
    note: '*De la* (از) + *ce peron* (کدام پلت‌فورم) — همهٔ این کلمه‌ها قبلاً یاد داده شده‌اند، فقط در یک سوال تازه یکجا شده‌اند.'
  ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa:
    title: 'یادآوری: aș dori, vă rog, cât costă, costă, lei'
    gloss: می‌خواهم (مؤدبانه) · لطفاً (رسمی) · قیمتش چند است · قیمت دارد · لی (واحد پول رومانیا)
    note: همه از واحد ۶ (غذا) و واحد ۷ (خریداری) است؛ در این واحد همین زبان مؤدبانهٔ درخواست و قیمت برای خریدن تکت قطار به کار می‌رود، نه غذا.
  ro.a1.unit15.lesson02.teach.bilet_vocab:
    title: تکت
    gloss: تکت
    note: تکت قطار. جنس بی‌جان (neutru) است؛ در حالت مفرد مثل اسم مذکر *un* می‌گیرد، پس «یک تکت» *un bilet* می‌شود.
    example_gloss:
    - من یک تکت دارم.
  ro.a1.unit15.lesson02.teach.bucuresti_vocab:
    title: بخارست
    gloss: بخارست
    note: پایتخت رومانیا — مقصد طبیعی و نمونه در این کورس.
    example_gloss:
    - قطار به طرف بخارست حرکت می‌کند.
  ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase:
    title: لطفاً یک تکت برای بخارست می‌خواهم
    gloss: لطفاً یک تکت برای بخارست می‌خواهم.
    note: قالب مؤدبانهٔ *Aș dori... vă rog* از واحد ۶ و ۷، حالا برای خواستن تکت، نه غذا.
  ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase:
    title: یک تکت برای بخارست چند قیمت دارد؟
    gloss: یک تکت برای بخارست چند قیمت دارد؟
    note: همان سوال قیمت *Cât costă...?* از واحد ۷ است، فقط حالا دربارهٔ یک تکت می‌پرسد، نه یک کیلو کچالو.
  ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase:
    title: چهل لی قیمت دارد
    gloss: چهل لی قیمت دارد.
    note: Zece (ده) در دایرهٔ ۲ تا ۱۹ است، پس پیش از *lei* به *de* ضرورت نیست — همان قاعده‌ای که واحد ۷ یاد داد.
  ro.a1.unit15.lesson03.teach.reminder_travel_words:
    title: 'یادآوری: tren, pleacă, peron, bilet, București, trei, am'
    gloss: قطار · حرکت می‌کند · پلت‌فورم · تکت · بخارست · سه (از واحد ۲) · دارم (از واحد ۲)
    note: کلمه‌های tren، pleacă، peron، bilet و București از درس‌های همین واحد اند؛ trei و am از واحد ۲ (عددها) دوباره آمده‌اند، چون Ana و Mihai حالا در ایستگاه «peronul trei» و «am un bilet» را با هم می‌گویند.
  ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'یادآوری: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: سلام · تشکر · خداحافظ · Ana، Mihai (نام‌ها)
    note: همه در واحدهای پیشین یاد داده شده‌اند — همان الگوی دوستانهٔ آغاز و پایان که در هر گفت‌وگوی این کورس بوده است.
  ro.a1.unit15.lesson03.teach.drum_bun_vocab:
    title: سفر به خیر
    gloss: سفر به خیر
    note: یک عبارت ثابت برای خداحافظی با کسی که می‌خواهد سفر کند — در اصل «راه خوب» است، اما مثل «سفر به خیر» در دری به کار می‌رود.
    example_gloss:
    - سفر به خیر، Mihai!
  ro.a1.unit15.lesson03.teach.line01:
    title: سلام و پرسیدن دربارهٔ قطار
    gloss: Ana به Mihai سلام می‌دهد و می‌پرسد قطار ساعت چند حرکت می‌کند.
    note: همان سوال درس اول این واحد است، فقط حالا مستقیم به Mihai گفته می‌شود.
  ro.a1.unit15.lesson03.teach.line02:
    title: گفتن وقت حرکت
    gloss: Mihai می‌گوید قطار ساعت نُه حرکت می‌کند.
    note: عین جملهٔ درس اول همین واحد دوباره آمده است.
  ro.a1.unit15.lesson03.teach.line03:
    title: پرسیدن دربارهٔ پلت‌فورم
    gloss: Ana می‌پرسد از کدام پلت‌فورم.
    note: یک سوال کوتاه دنباله‌دار — *de la ce peron* در درس اول کامل پرسیده شد؛ اینجا Ana آن را کوتاه می‌پرسد و انتظار دارد Mihai بقیه را بگوید.
  ro.a1.unit15.lesson03.teach.line04:
    title: گفتن پلت‌فورم و تکت
    gloss: Mihai می‌گوید پلت‌فورم سه، و این‌که یک تکت برای بخارست دارد.
    note: کلمه‌های peron و bilet/București همین واحد در یک جواب یکجا شده‌اند.
  ro.a1.unit15.lesson03.teach.line05:
    title: آرزوی سفر به خیر و خداحافظی
    gloss: Ana برای Mihai سفر به خیر می‌خواهد و خداحافظی می‌کند.
    note: '*Drum bun* همین درس را به کار می‌برد — خداحافظی مخصوص سفر، به جای *la revedere* ساده که معمولاً در این کورس می‌آمد.'
  ro.a1.unit15.lesson03.teach.line06:
    title: تشکر از او و خداحافظی
    gloss: Mihai از Ana تشکر می‌کند و خداحافظی می‌کند.
    note: همان الگوی پایانی که هر گفت‌وگوی واحدهای پیشین با آن تمام شد.
