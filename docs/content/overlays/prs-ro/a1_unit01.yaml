answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: رومانیایی به دری A1
  description: 'سلام‌وعلیکم و معرفی در اولین دیدار به رومانیایی معیاری را یاد بگیرین. راهنمایی‌ها روی مهم‌ترین تفاوتی تمرکز دارد که در این مرحله لازم است: tu غیررسمی در برابر dumneavoastră مودبانه، و دو راه روزمرهٔ گفتن نام در رومانیایی (mă numesc.../mă cheamă...).'
units:
  ro.a1.unit01.greetings:
    title: سلام‌واحوال‌پرسی و اولین دیدارها
lessons:
  ro.a1.unit01.lesson01.tu_dumneavoastra_greetings:
    title: 'سلام و احوالپرسی: tu و dumneavoastră'
  ro.a1.unit01.lesson02.names_introductions:
    title: نام شما چیست؟
  ro.a1.unit01.lesson03.street_meeting:
    title: دیدار در سرک
teaching:
  ro.a1.unit01.lesson01.teach.buna:
    title: سلام روزمره
    gloss: سلام
    note: Bună سلام روزمره و نیمه‌غیررسمی است؛ با دوستان، همسالان و بیشتر دیدارهای عادی روز بی‌خطر است.
    example_gloss: سلام، Mihai!
  ro.a1.unit01.lesson01.teach.salut:
    title: سلام غیررسمی
    gloss: سلام؛ خداحافظ
    note: Salut غیررسمی است و بین دوستان و همسالان به کار می‌رود. هم برای آغاز و هم برای ختم صحبت استفاده می‌شود، اما برای یک بزرگسال ناآشنا انتخاب اول و بی‌خطر نیست.
    example_gloss: سلام، Ana!
  ro.a1.unit01.lesson01.teach.buna_ziua:
    title: سلام رسمی
    gloss: روز بخیر؛ سلام (رسمی)
    note: Bună ziua سلام مودبانه و بی‌خطر برای یک بزرگسال ناآشنا، دکاندار، یا هر کسی است که با dumneavoastră مخاطبش می‌سازید. معنی لفظی آن «روز خوب» است، اما به‌صورت سلام مودبانهٔ عمومی به کار می‌رود، نه فقط وقت چاشت.
    example_gloss: روز بخیر، Ana!
  ro.a1.unit01.lesson01.teach.la_revedere:
    title: خداحافظی معمولی
    gloss: خداحافظ
    note: La revedere هم در حالت مودبانه و هم در حالت غیررسمی کار می‌دهد.
    example_gloss: روز بخیر! خداحافظ!
  ro.a1.unit01.lesson01.teach.tu:
    title: «تو» در حالت غیررسمی
    gloss: تو (غیررسمی، مفرد)
    note: Tu برای مخاطب ساختن یک دوست، طفل یا کسی به کار می‌رود که رابطهٔ غیررسمی دارید. این ضمیر مثل «تو» در دری فاصلهٔ اجتماعی را نشان می‌دهد و شکل‌های فعل خودش را دارد (faci، نه faceți).
  ro.a1.unit01.lesson01.teach.dumneavoastra:
    title: «شما» برای احترام یا جمع
    gloss: شما، برای احترام یا جمع
    note: Dumneavoastră انتخاب بی‌خطر برای یک بزرگسال ناآشناست و برای گروهی که مودبانه مخاطب می‌سازید هم کار می‌دهد — تقریباً مثل «شما» در دری. از domnia voastră (جناب شما) آمده و شکل‌های جمع فعل را می‌گیرد (faceți, numiți)، حتی وقتی یک نفر باشد، همان‌طور که «شما» با فعل جمع می‌آید.
  ro.a1.unit01.lesson01.teach.ce_mai_faceti:
    title: پرسیدن احوال به شکل رسمی
    gloss: شما چطور استید؟
    note: Faceți شکل dumneavoastră فعل a face (کردن/ساختن) است. این یک پرسش مودبانهٔ معمول است، نه پرسش واقعی دربارهٔ کاری که کسی انجام می‌دهد.
  ro.a1.unit01.lesson01.teach.ce_mai_faci:
    title: پرسیدن احوال به شکل غیررسمی
    gloss: شما چطور استید؟
    note: Faci شکل tu فعل a face است. بین نسخهٔ مودبانه و غیررسمی این پرسش فقط آخر فعل تغییر می‌کند — ce mai در هر دو یکسان می‌ماند.
  ro.a1.unit01.lesson01.teach.bine_multumesc:
    title: جواب معمول مثبت
    gloss: خوبم، تشکر.
    note: Bine, mulțumesc جواب ce mai faci/faceți است، صرف‌نظر از سطح احترام — خود جواب تغییر نمی‌کند.
    example_gloss: چطور استی؟ خوبم، تشکر.
  ro.a1.unit01.lesson01.teach.register_choice:
    title: جور کردن سلام با نوع رابطه
    gloss: Bună ziua با dumneavoastră؛ Salut با tu
    note: اینها قاعده‌های پیش‌فرضِ مفید اند، نه قانون مطلق. Bună ziua می‌تواند یک گفتگوی رسمی را هم آغاز کند که بعد با dumneavoastră ادامه پیدا می‌کند؛ اما آوردن Salut با dumneavoastră معمولاً پیام‌های اجتماعی متضاد می‌دهد.
  ro.a1.unit01.lesson02.teach.ma_numesc:
    title: گفتن نام (معیاری)
    gloss: نام من Ana است.
    note: Mă numesc معنی لفظی «خود را نام می‌دهم» است — راه بی‌طرف که همه‌جا کار می‌دهد برای گفتن نام، و از نظر سطح گفتار شبیه «نام من ... است» در دری.
    example_gloss: سلام! نام من Ana است.
  ro.a1.unit01.lesson02.teach.cum_va_numiti:
    title: پرسیدن نام به شکل مؤدبانه
    gloss: نام شما چیست؟
    note: Numiți شکل dumneavoastră فعل a se numi (نام داشتن) است. Vă ضمیر انعکاسی مطابق dumneavoastră است و اینجا لازم است.
  ro.a1.unit01.lesson02.teach.ma_cheama:
    title: گفتن نام (گفتاری)
    gloss: مرا Mihai صدا می‌کنند.
    note: Mă cheamă راه گفتاری‌تر گفتن نام است، معنی لفظی آن «مرا صدا می‌کند» است. Mă numesc و mă cheamă هر دو درست و رایج اند؛ mă cheamă کمی غیررسمی‌تر است.
    example_gloss: سلام! مرا Mihai صدا می‌کنند.
  ro.a1.unit01.lesson02.teach.cum_te_cheama:
    title: پرسیدن نام به شکل غیررسمی
    gloss: نامت چیست؟
    note: Te ضمیر انعکاسی مطابق tu است. این راه روزمرهٔ پرسیدن نام بین دوستان و همسالان است.
  ro.a1.unit01.lesson02.teach.imi_pare_bine:
    title: آشنا شدن با کسی
    gloss: از آشنایی خوشحال شدم!
    note: Îmi pare bine معنی لفظی «برایم خوب معلوم می‌شود» است — یک عبارت ثابت اصطلاحی، نه ترجمهٔ کلمه به کلمه. این عبارت به جنسیت گوینده تغییر نمی‌کند.
    example_gloss: مرا Mihai صدا می‌کنند. از آشنایی خوشحال شدم!
  ro.a1.unit01.lesson02.teach.si_mie_imi_pare_bine:
    title: برگرداندن همان احساس
    gloss: من هم از آشنایی خوشحال شدم!
    note: Și mie معنی «من هم» را به اول همان عبارت ثابتی اضافه می‌کند که برای آغاز گفتگو به کار رفت.
  ro.a1.unit01.lesson02.teach.si_dumneavoastra:
    title: برگرداندن پرسش به شکل مؤدبانه
    gloss: و شما؟
    note: Dumneavoastră را برای حفظ سطح مودبانه یا برای مخاطب ساختن یک گروه به کار ببرید.
  ro.a1.unit01.lesson02.teach.si_tu:
    title: برگرداندن پرسش به شکل غیررسمی
    gloss: و شما؟
    note: بعد از și، وقتی با یک دوست یا همسال غیررسمی صحبت می‌کنین، tu را به کار ببرید.
  ro.a1.unit01.lesson03.teach.line01:
    title: آغاز دیدار
    gloss: Ana رسمی به Mihai سلام می‌دهد و نامش را می‌گوید.
    note: Ana با bună ziua مودبانه شروع می‌کند، که برای دیدن کسی که نمی‌شناسد مناسب است.
  ro.a1.unit01.lesson03.teach.line02:
    title: آغاز دیدار، جواب
    gloss: Mihai همان احساس را برمی‌گرداند، نامش را می‌گوید و حال او را می‌پرسد.
    note: Mihai همان سطح مودبانه‌ای را نگه می‌دارد که Ana آغاز کرد — او ce mai faceți می‌پرسد، نه ce mai faci.
  ro.a1.unit01.lesson03.teach.line03:
    title: جواب دادن و پرسش را برگرداندن
    gloss: Ana می‌گوید خوب است و همان پرسش را مودبانه از Mihai می‌پرسد.
    note: Și dumneavoastră گفتگو را رسمی نگه می‌دارد، مطابق آغاز آن.
  ro.a1.unit01.lesson03.teach.line04:
    title: جواب دادن و ختم کردن
    gloss: Mihai می‌گوید او هم خوب است و خداحافظی می‌کند.
    note: La revedere خداحافظی بی‌طرف است و چه گفتگو رسمی بوده باشد چه غیررسمی، مناسب است.
  ro.a1.unit01.lesson03.teach.line05:
    title: ختم دیدار
    gloss: Ana همان خداحافظی را تکرار می‌کند.
    note: تکرار la revedere راه طبیعی تأیید یک ختم دوستانه است.
exercises:
  ro.a1.unit01.lesson01.exercise01.listen_buna:
    instruction: گوش کنید و عبارتی را که می‌شنوید انتخاب کنید.
    correct_option: Bună!
    distractors:
    - Salut!
    - La revedere!
    accepted_answers:
    - Bună!
    - Bună
  ro.a1.unit01.lesson01.exercise02.choose_informal_pronoun:
    instruction: کدام ضمیر با این سلام غیررسمی جور است؟
    correct_option: tu
    distractors:
    - dumneavoastră
    accepted_answers:
    - tu
    feedback: Salut و tu یک ترکیب غیررسمی هماهنگ می‌سازند.
  ro.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: سوال محترمانهٔ احوال‌پرسی را به ترتیب درست بگذارین.
    correct_response:
    - Ce
    - mai
    - faceți
  ro.a1.unit01.lesson01.exercise06.match_register:
    instruction: هر سلام را با سطح معمول آن برای شاگرد مبتدی جور کنید.
    correct_response:
      Bună ziua: dumneavoastră
      Salut: تو (غیررسمی)
    pairs:
    - left: Bună ziua
      right: dumneavoastră
    - left: Salut
      right: تو (غیررسمی)
  ro.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: احوال‌پرسی را برای یک بزرگسال ناآشنا کامل کنید.
    accepted_answers:
    - dumneavoastră
    feedback: Dumneavoastră انتخاب محترمانهٔ بی‌خطر با یک بزرگسال ناآشناست.
  ro.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: سوال غیررسمی را که می‌شنوید، بنویسین.
    accepted_answers:
    - Ce mai faci?
    - Ce mai faci
  ro.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: خداحافظی عادی را کامل کنید.
    accepted_answers:
    - revedere
  ro.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: سلام محترمانه کنید، از شخص احوال بپرسین و گپ را ختم کنید.
    accepted_answers:
    - Bună ziua. Ce mai faceți? La revedere.
    - Bună ziua, ce mai faceți? La revedere.
  ro.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: گوش کنید و سوال محترمانهٔ نام را انتخاب کنید.
    correct_option: Cum vă numiți?
    distractors:
    - Cum te cheamă?
    - Ce mai faceți?
    accepted_answers:
    - Cum vă numiți?
    - Cum va numiti?
  ro.a1.unit01.lesson02.exercise05.choose_reply_meaning:
    instruction: جملهٔ Mihai چه معنی دارد؟
    correct_option: از آشنایی خوشحال شدم!
    distractors:
    - خداحافظ!
    - حال شما چطور است؟
    accepted_answers:
    - از آشنایی خوشحال شدم!
  ro.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: معرفی خود Ana را بسازید.
    correct_response:
    - Mă
    - numesc
    - Ana
  ro.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: هر پرسش دربارهٔ نام را با جواب مطابقش جور کنید.
    correct_response:
      Cum vă numiți?: Mă numesc Ana.
      Cum te cheamă?: Mă cheamă Mihai.
    pairs:
    - left: Cum vă numiți?
      right: Mă numesc Ana.
    - left: Cum te cheamă?
      right: Mă cheamă Mihai.
  ro.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: بعد از سلام غیررسمی، نام طرف مقابل را بپرسین.
    accepted_answers:
    - Cum te cheamă?
    - Cum te cheama?
  ro.a1.unit01.lesson02.exercise04.complete_ma_cheama:
    instruction: عبارتی را که نام Mihai را می‌گوید تکمیل کنید.
    accepted_answers:
    - Mă
  ro.a1.unit01.lesson02.exercise06.return_polite_question:
    instruction: سوال را برگردانید، بدون اینکه از سطح محترمانه خارج شوین.
    accepted_answers:
    - Și dumneavoastră?
    - Si dumneavoastra?
  ro.a1.unit01.lesson02.exercise08.write_introduction:
    instruction: 'شما Ana استین. بنویسین: با Bună سلام بتین، با mă numesc نام خود را بگویین، بعد بگویین «از آشنایی خوشحال شدم».'
    accepted_answers:
    - Bună. Mă numesc Ana. Îmi pare bine.
    - Buna. Ma numesc Ana. Imi pare bine.
  ro.a1.unit01.lesson03.exercise01.role_selection:
    instruction: در گفتگو، کدام گوینده نام خود را با این عبارت می‌گوید؟
    correct_option: Ana
    distractors:
    - Mihai
    - هیچ‌کدام از گویندگان
    accepted_answers:
    - Ana
  ro.a1.unit01.lesson03.exercise02.comprehend_register:
    instruction: Ana و Mihai با همدیگر کدام ضمیر را به کار می‌برند؟
    correct_option: dumneavoastră
    distractors:
    - tu
    - te
    accepted_answers:
    - dumneavoastră
  ro.a1.unit01.lesson03.exercise03.comprehend_names:
    instruction: کدام گوینده mă numesc را به کار می‌برد و کدام mă cheamă را؟
    correct_option: Ana uses mă numesc; Mihai uses mă cheamă.
    distractors:
    - Mihai uses mă numesc; Ana uses mă cheamă.
    - هر دو گوینده mă numesc را به کار می‌برند.
    accepted_answers:
    - Ana uses mă numesc; Mihai uses mă cheamă.
    - Ana; Mihai
  ro.a1.unit01.lesson03.exercise05.order_closing:
    instruction: جواب پایانی و خداحافظی را بسازید.
    correct_response:
    - Bine,
    - mulțumesc.
    - La
    - revedere!
  ro.a1.unit01.lesson03.exercise04.role_response:
    instruction: نقش Ana را بازی کنید. مودبانه جواب بتین و پرسش را برگردانید.
    accepted_answers:
    - Bine, mulțumesc. Și dumneavoastră?
    - Bine, multumesc. Si dumneavoastra?
  ro.a1.unit01.lesson03.exercise06.speak_role:
    instruction: نقش Ana را بازی کنید. به Mihai رسمی سلام بتین، نام خود را بگویین، به سلام او جواب بتین و دیدار را ختم کنید.
    accepted_answers:
    - Bună ziua. Mă numesc Ana. Îmi pare bine! La revedere!
    - Buna ziua. Ma numesc Ana. Imi pare bine! La revedere!
    - Bună ziua. Mă numesc Ana. Și mie îmi pare bine! La revedere!
  ro.a1.unit01.lesson01.exercise09.dictation_buna:
    instruction: آنچه را که می‌شنوید تایپ کنید.
    correct_option: Bună
    accepted_answers:
    - value: Bună
      status: correct
    orthography_strict: true
