teaching:
  ro.a1.unit32.lesson01.teach.animalul_un_animal:
    title: حیوان، حیوان خانگی
    gloss: حیوان / حیوان خانگی
    note: '*Animal* کلمهٔ عمومی است؛ *animal de companie* («حیوان همدم») مخصوصاً یعنی حیوان خانگی. جمع آن *animale* است (*un animal*، *două animale*).'
    example_gloss:
    - سگ یک حیوان است.
    - سگ یک حیوان خانگی هم است.
  ro.a1.unit32.lesson01.teach.cainele_pisica:
    title: سگ و پشک
    gloss: سگ / پشک
    example_gloss:
