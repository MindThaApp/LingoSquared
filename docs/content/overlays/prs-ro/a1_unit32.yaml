    gloss: نه، من حیوان خانگی ندارم.
    note: بعد از *nu am*، کلمهٔ *niciun* («حتی یکی») اسم را منفی می‌کند؛ یادداشت دستور را ببینین.
  ro.a1.unit32.lesson01.teach.la_negatie_nu:
    title: 'Nu am: بدون حرف نکره'
    gloss: 'بعد از nu am از un یا o استفاده نمی‌کنید: Nu am timp, nu am niciun animal de companie.'
    note: 'همان الگویی که قبلاً برای *Nu am timp* یاد گرفتید: دستور تازه نیست، فقط یک اسم تازه است.'
  ro.a1.unit32.lesson02.teach.a_scoate_la:
    title: گشت دادن (حیوان)
    gloss: حیوان را به گشت بردن
    note: '*A scoate la plimbare* یک عبارت ثابت است؛ یادداشت دستور را ببینین.'
    example_gloss: من هر روز سگ را به گشت می‌برم.
  ro.a1.unit32.lesson02.teach.verbul_se_schimba:
    title: فعل با شخص تغییر می‌کند
    gloss: 'فعل با شخص تغییر می‌کند: eu scot، tu scoți، el scoate (من می‌برم، تو می‌بری، او می‌برد) سگ را به گشت.'
    note: 'فعل‌های رومانیایی برای هر شخص ختم خود را تغییر می‌دهند، پس *a scoate la plimbare* مثل یک فعل صرف می‌شود: *scot*، *scoți*، *scoate*.'
  ro.a1.unit32.lesson02.teach.a_da_de:
    title: غذا دادن
    gloss: غذا دادن
    example_gloss: من هر روز به پشک غذا می‌دهم.
  ro.a1.unit32.lesson02.teach.a_se_juca:
    title: بازی کردن با
    gloss: بازی کردن با
    example_gloss: Andrei با گربهٔ خود بازی می‌کند.
  ro.a1.unit32.lesson02.teach.scot_cainele_la:
    title: من هر روز سگ را به گشت می‌برم
    gloss: من هر روز سگ را به گشت می‌برم.
    note: '*A scoate la plimbare* را با *în fiecare zi* (هر روز) که از درس قبلی می‌دانین، یکجا می‌کند.'
