  ro.a1.unit32.lesson03.teach.plural_caine_caini:
    title: 'Plural: câine → câini'
    gloss: 'جمع: câine → câini، animal → animale، pisică → pisici.'
    note: الگوی باقاعدهٔ جمع در رومانیایی، که اینجا برای بار اول با اسم‌های حیوانات به‌عنوان نمونه معرفی می‌شود.
  ro.a1.unit32.lesson03.teach.caini_pisici:
    title: سگ‌ها و پشک‌ها
    gloss: سگ‌ها / پشک‌ها
    example_gloss:
    - Mihai سگ‌ها را دوست دارد.
    - Elena گربه‌ها را دوست دارد.
  ro.a1.unit32.lesson03.teach.pesti_pasari:
