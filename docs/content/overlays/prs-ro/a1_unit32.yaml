    - Nina یک پرنده دارد.
  ro.a1.unit32.lesson01.teach.ai_un_animal:
    title: حیوان خانگی داری؟
    gloss: حیوان خانگی داری؟
    note: 'همان الگوی سوال *Ai ...?* که از قبل می‌دانین: *a avea* (داشتن) + یک اسم.'
  ro.a1.unit32.lesson01.teach.da_am_un:
    title: بلی، سگ دارم
    gloss: بلی، یک سگ دارم.
    note: یک جواب مثبت ساده با واژه‌های جدید این درس.
  ro.a1.unit32.lesson01.teach.nu_nu_am:
