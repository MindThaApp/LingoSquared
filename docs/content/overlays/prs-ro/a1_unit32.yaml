course:
  title: رومانیایی به دری A1
  description: 'رومانیایی مقدماتی برای صحبت دربارهٔ حیوانات خانگی و حیوانات معمول: نام بردن آن‌ها، مواظبت ابتدایی (گشت بردن، غذا دادن، بازی کردن)، گفتن اینکه کدام حیوانات را دوست دارید حتی اگر حیوانی نداشته باشین، و جمع باقاعدهٔ رومانیایی.'
