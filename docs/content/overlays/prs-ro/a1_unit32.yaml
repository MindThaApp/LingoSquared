    note: زمینه را برای تضادی آماده می‌کند که متن خواندنی بعدی بر آن ساخته شده است.
  ro.a1.unit32.lesson04.teach.mihai_ai_un:
    title: Mihai دربارهٔ حیوان خانگی می‌پرسد
    gloss: 'Mihai: Ana، تو حیوان خانگی داری؟'
  ro.a1.unit32.lesson04.teach.ana_da_am:
    title: Ana سگ دارد
    gloss: 'Ana: بلی، یک سگ دارم.'
  ro.a1.unit32.lesson04.teach.mihai_cum_arata:
    title: Mihai می‌پرسد چه شکل دارد
    gloss: 'Mihai: چه شکل دارد؟'
    note: سوال *Cum arată ...?* از درس ظاهر دوباره استفاده می‌شود، این بار دربارهٔ یک حیوان.
  ro.a1.unit32.lesson04.teach.ana_are_blana:
    title: Ana سگ خود را توصیف می‌کند
    gloss: 'Ana: موی قهوه‌یی دارد و کوچک است.'
    note: واژه‌های رنگ مو و اندازه از درس ظاهر و قیافه دوباره آمده‌اند، این بار برای توصیف پشم یک حیوان، نه موی یک شخص.
  ro.a1.unit32.lesson04.teach.pentru_un_animal:
    title: El و ea برای حیوانات
    gloss: 'برای یک حیوان، به اساس جنسیتش el یا ea را به کار ببرید: câinele یعنی el، pisica یعنی ea.'
    note: تمام استفاده‌های قبلی *el* و *ea* در این کورس دربارهٔ آدم‌ها بود؛ اینجا به حیوانات هم گسترش می‌یابد و از جنسیت اسم پیروی می‌کند.
  ro.a1.unit32.lesson04.teach.mihai_il_scoti:
    title: Mihai دربارهٔ گشت می‌پرسد
    gloss: 'Mihai: هر روز او را به گشت می‌بری؟'
  ro.a1.unit32.lesson04.teach.ana_da_il:
