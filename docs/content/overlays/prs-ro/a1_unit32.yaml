    gloss: 'Ana: بلی، هر روز او را به گشت می‌برم و به او غذا می‌دهم.'
  ro.a1.unit32.lesson05.teach.mihai_si_elena:
    title: Mihai، Elena و Andrei دربارهٔ حیوانات
    gloss: 'Mihai و Elena هر دو حیوانات را دوست دارند، اما هیچ‌کدام شان حیوان خانگی ندارد. Mihai سگ‌ها را دوست دارد و Elena گربه‌ها را. اما Andrei حیوان خانگی دارد: یک گربه. او اکثراً با گربه‌اش بازی می‌کند و هر روز به آن غذا می‌دهد. تو حیوان خانگی داری؟'
    note: دوست داشتن یک حیوان را با واقعاً داشتنِ آن مقایسه می‌کند؛ نکته اصلی این درس همین است.
    glosses:
      iubesc: خیلی دوست دارند
      amândoi: هر دو
      animalele: حیوانات
      doi: هر دو
      companie: حیوان خانگی
      câinii: سگ‌ها
      pisicile: پشک‌ها
      pisică: پشک
      joacă: بازی می‌کند
      dă: می‌دهد
      fiecare: هر
      mâncare: غذا
  ro.a1.unit32.lesson05.teach.andrei_se_joaca:
    title: Andrei اکثراً با گربه‌اش بازی می‌کند
    gloss: Andrei اکثراً با گربه‌اش بازی می‌کند.
    note: '*Des* («اکثراً») کلمهٔ تکرار از درس سرگرمی‌ها است؛ *a se juca cu* («بازی کردن با») یک فعل انعکاسی است.'
  ro.a1.unit32.lesson05.teach.iubesc_cainii_nu:
    title: من سگ‌ها را دوست دارم. حیوان خانگی ندارم.
    gloss: من سگ‌ها را دوست دارم. حیوان خانگی ندارم.
    note: یک جواب نمونه با دو جمله که برای تمرین نوشتاری این درس آماده است.
  ro.a1.unit32.lesson06.teach.ana_nina_ai:
    title: Ana از Nina می‌پرسد
    gloss: 'Ana: Nina، تو هم حیوان خانگی داری؟'
  ro.a1.unit32.lesson06.teach.nina_da_am:
    title: Nina یک پرنده به نام Pico دارد
    gloss: 'Nina: بلی، یک پرنده دارم. نامش Pico است.'
    note: '*O cheamă* («نامش است») از فعل *a chema* که برای نام دادن به کار می‌رود دوباره استفاده می‌کند؛ پرنده مؤنث است، پس ضمیر *o* است.'
  ro.a1.unit32.lesson06.teach.mihai_ce_frumos:
    title: واکنش Mihai
    gloss: 'Mihai: چه قشنگ! هر روز با او چه کار می‌کنی؟'
  ro.a1.unit32.lesson06.teach.nina_ii_dau:
    title: Nina هر روز به او غذا می‌دهد
    gloss: 'Nina: هر روز به او غذا می‌دهم.'
  ro.a1.unit32.lesson06.teach.mihai_iubesc_si:
    title: Mihai هم پرنده‌ها را دوست دارد
    gloss: 'Mihai: من هم پرنده‌ها را دوست دارم.'
  ro.a1.unit32.lesson06.teach.ana_ce_frumos:
    title: Ana گفتگو را ختم می‌کند
    gloss: 'Ana: چه خوب که هر سه ما حیوانات را دوست داریم!'
    note: حرف‌های هر سه شخصیت درباره حیوانات در این درس را کنار هم جمع‌بندی می‌کند.
