    gloss: ماهی‌ها / پرنده‌ها
    example_gloss:
    - من ماهی‌ها را خیلی دوست دارم.
    - کاکا پرنده‌ها را خیلی دوست دارد.
  ro.a1.unit32.lesson03.teach.iubesc_animalele:
    title: من حیوانات را خیلی دوست دارم
    gloss: من حیوانات را خیلی دوست دارم.
    note: '*A iubi* («دوست داشتن») مفعولش را بدون حرف اضافه می‌گیرد: *Iubesc animalele*؛ حرف تعریف *-le* نشان می‌دهد که منظور حیوانات به‌طور کلی است.'
  ro.a1.unit32.lesson03.teach.elena_iubeste_pisicile:
    title: Elena گربه‌ها را دوست دارد، اما حیوان خانگی ندارد
