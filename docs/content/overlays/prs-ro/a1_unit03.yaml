answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Day and month names are correctly lowercase in standard Romanian writing (except sentence-initially); accept a learner's answer regardless of the case they happen to type it in -- this unit teaches the lowercase convention as a fact to recognize, not a hard-graded spelling rule.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: رومانیایی به دری A1
  description: روزهای هفته، ماه‌های سال، و طرز بیان تاریخ در رومانیایی (یک عدد اصلی ساده به‌علاوهٔ نام ماه، به‌جز روز اول که کلمهٔ خاص întâi را می‌گیرد) -- ادامهٔ داستان Ana و Mihai که جلسهٔ بعدی‌شان را برنامه‌ریزی می‌کنند.
units:
  ro.a1.unit03.dates:
    title: روزها و تاریخ‌ها
lessons:
  ro.a1.unit03.lesson01.zilele_saptamanii:
    title: روزهای هفته
  ro.a1.unit03.lesson02.lunile_si_datele:
    title: ماه‌های سال و طرز گفتن تاریخ
  ro.a1.unit03.lesson03.cand_ne_intalnim:
    title: دوباره کی ملاقات می‌کنیم؟
teaching:
  ro.a1.unit03.lesson01.teach.este:
    title: 'یادآوری: este'
    gloss: است
    note: '*Este* پیش‌تر در درس ۲ آمده بود (*Care este numărul...?*). تغییر نمی‌کند -- چه نهاد روز باشد، چه تاریخ یا چیز دیگر، همان کلمه است و بین tu و dumneavoastră هم فرق نمی‌کند.'
  ro.a1.unit03.lesson01.teach.astazi_maine:
    title: امروز، فردا
    gloss: astăzi (امروز) / mâine (فردا)
    note: هر دو کلمهٔ زمانی بی‌تغییر استند و در آغاز جمله می‌آیند تا بگویند چه روز یا تاریخی است.
    example_gloss:
    - امروز دوشنبه است.
    - فردا سه‌شنبه است.
  ro.a1.unit03.lesson01.teach.luni_marti:
    title: دوشنبه، سه‌شنبه
    gloss: luni (دوشنبه) / marți (سه‌شنبه)
    note: برای نام بردن روز (Astăzi este luni) همین شکل ساده را به کار ببرید. نام روزها شکل معرفه هم دارند -- lunea، marțea -- که یعنی «دوشنبه‌ها»، «سه‌شنبه‌ها»؛ بعداً با آن‌ها آشنا می‌شوید.
    example_gloss:
    - امروز دوشنبه است.
    - فردا سه‌شنبه است.
  ro.a1.unit03.lesson01.teach.miercuri_joi:
    title: چهارشنبه، پنجشنبه
    gloss: miercuri (چهارشنبه) / joi (پنجشنبه)
    note: مثل luni و marți، miercuri و joi در مفرد و جمع یک شکل دارند.
    example_gloss:
    - امروز چهارشنبه است.
    - فردا پنجشنبه است.
  ro.a1.unit03.lesson01.teach.vineri_sambata:
    title: جمعه، شنبه
    gloss: vineri (جمعه) / sâmbătă (شنبه)
    note: در املای امروزی، sâmbătă با â در وسط کلمه نوشته می‌شود، نه به شکل قدیمی sîmbătă.
    example_gloss:
    - امروز جمعه است.
    - فردا شنبه است.
  ro.a1.unit03.lesson01.teach.duminica:
    title: یکشنبه
    gloss: یکشنبه
    note: Duminică هفته را تکمیل می‌کند. برای گفتن اینکه چه روزی است، همین شکل ساده را به کار ببرید؛ شکل معرفهٔ duminica یعنی «یکشنبه‌ها».
    example_gloss: امروز یکشنبه است.
  ro.a1.unit03.lesson01.teach.ce_zi_e_azi:
    title: پرسیدن اینکه امروز چه روزی است
    gloss: امروز چه روز است؟
    note: راه معمول پرسیدن روز هفته -- zi (روز) کلمهٔ تازه است، در کنار ce، este و astăzi که از قبل می‌شناسید.
  ro.a1.unit03.lesson01.teach.saptamana_ieri:
    title: هفته، دیروز، هفتهٔ گذشته و هفتهٔ آینده
    gloss: săptămână (هفته) / ieri (دیروز) / săptămâna trecută (هفتهٔ گذشته) / săptămâna viitoare (هفتهٔ آینده)
    note: مجموعهٔ لغت اضافی از همان منبع نام روزها -- برای بیان تاریخ نسبت به امروز مفید است، اما در تمرین‌های این درس مثل روزهای هفته زیاد تمرین نمی‌شود.
  ro.a1.unit03.lesson01.teach.lowercase_zile:
    title: روزها با حرف کوچک نوشته می‌شوند
    gloss: 'نام روزها با حرف بزرگ نوشته نمی‌شوند: luni, vineri.'
    note: در خط دری حرف بزرگ و کوچک وجود ندارد، اما در رومانیایی نام روزهای هفته در وسط جمله با حرف بزرگ نوشته نمی‌شوند -- *luni*، نه *Luni*، مگر اینکه خود کلمه آغاز جمله باشد.
  ro.a1.unit03.lesson02.teach.ian_feb_mar:
    title: جنوری، فبروری، مارچ
    gloss: ianuarie (جنوری) / februarie (فبروری) / martie (مارچ)
    note: برخلاف نام روزها، نام چند ماه شبیه نام‌های بین‌المللی همان ماه‌ها است و به‌آسانی شناخته می‌شود.
    example_gloss:
    - جنوری است.
    - فبروری است.
    - مارچ است.
  ro.a1.unit03.lesson02.teach.apr_mai_iun:
    title: اپریل، می، جون
    gloss: اپریل / می / جون
    note: Mai (ماه می) کلمهٔ کوتاه است، اما با mai که قید و به معنای «بیشتر» است و در جاهای دیگر این کورس آمده (ce mai faci) فرق دارد؛ موقعیت جمله همیشه معنا را روشن می‌سازد.
    example_gloss:
    - اپریل است.
    - می است.
    - جون است.
  ro.a1.unit03.lesson02.teach.iul_aug_sep:
    title: جولای، اگست، سپتمبر
    gloss: جولای / اگست / سپتمبر
    note: August در نوشتار و آوا خیلی به «اگست» در دری نزدیک است؛ یکی از شفاف‌ترین واژه‌های همانند در این مجموعه.
    example_gloss:
    - جولای است.
    - اگست است.
    - سپتمبر است.
  ro.a1.unit03.lesson02.teach.oct_noi_dec:
    title: اکتوبر، نومبر، دسمبر
    gloss: اکتوبر / نومبر / دسمبر
    note: سه ماه آخر، مجموعهٔ دوازده ماه را تکمیل می‌کنند؛ همهٔ آن‌ها اسم‌های بدون تغییر اند.
    example_gloss:
    - اکتوبر است.
    - نومبر است.
    - دسمبر است.
  ro.a1.unit03.lesson02.teach.intai:
    title: اول (ماه)
    gloss: اول
    note: 'این یک قاعدهٔ واقعاً مخصوص رومانیایی است: در استعمال معیاری، روز اول ماه «یک» (*unu*) گفته نمی‌شود، بلکه کلمهٔ خاص خودش را دارد: *întâi*. (در صحبت‌های عادی ممکن است *unu* را هم بشنوین، اما شکلی که باید یاد بگیرین *întâi* است.) همهٔ تاریخ‌های دیگر، از روز دوم به بعد، عدد اصلی معمولی را به کار می‌برند.'
    example_gloss: امروز یکم اگست است.
  ro.a1.unit03.lesson02.teach.date_rule:
    title: رومانیایی تاریخ را چطور بیان می‌کند
    gloss: 'یکم: întâi · دوم و بعد از آن: عدد معمولی (doi, trei, patru...)'
    note: بعد از روز اول، تاریخ در رومانیایی صرف عدد اصلی (که قبلاً خوانده‌اید) و بعد نام ماه است؛ نه شکل ترتیبی لازم است و نه کلمهٔ اضافی، مثلاً *trei aprilie* (سوم اپریل، در اصل «سه اپریل»).
  ro.a1.unit03.lesson02.teach.ce_data:
    title: پرسیدن تاریخ
    gloss: تاریخ امروز چند است؟
    note: Dată (تاریخ) در اینجا کلمهٔ تازه است؛ بقیهٔ سوال، ce، este و astăzi را درست مثل سوال روز در درس اول به کار می‌برد.
  ro.a1.unit03.lesson02.teach.raspuns_data:
    title: گفتن تاریخ
    gloss: امروز سوم اپریل است.
    note: Trei (سه) عدد اصلی همان واحد دوم است؛ پسوند ترتیبی و کلمهٔ اضافی پیش از aprilie نمی‌آید.
  ro.a1.unit03.lesson02.teach.la_multi_ani:
    title: در روز خاص برای کسی آرزوی خوبی کنید
    gloss: تولدت مبارک! / سال نو مبارک!
    note: در اصل یعنی «(برای) سال‌های زیاد»؛ رایج‌ترین تبریک رومانیایی برای تولد، روز نام یا سال نو، و کلمهٔ *ani* (سال‌ها) را از مطالب سن در واحد دوم دوباره به کار می‌برد.
  ro.a1.unit03.lesson02.teach.lowercase_luni:
    title: نام ماه‌ها هم با حرف کوچک نوشته می‌شود
    gloss: 'ماه‌ها با حرف بزرگ نوشته نمی‌شوند: ianuarie, mai.'
    note: همان قاعدهٔ نام روزهای هفته در درس اول است؛ نام ماه‌های رومانیایی وسط جمله با حرف کوچک می‌ماند.
  ro.a1.unit03.lesson03.teach.cand:
    title: کی؟
    gloss: کی؟
    note: Când سوالی را دربارهٔ زمان شروع می‌کند، درست مثل «کی» در دری.
    example_gloss: جلسه کی است؟
  ro.a1.unit03.lesson03.teach.intalnirea:
    title: جلسه
    gloss: جلسه
    note: Întâlnirea شکل معرفه است (همان جلسه)؛ شکل بدون حرف تعریف، întâlnire می‌شود.
    example_gloss: جلسه روز دوشنبه است.
  ro.a1.unit03.lesson03.teach.cand_e_intalnirea:
    title: بپرسین که چیزی کی است
    gloss: جلسه کی است؟
    note: کلمهٔ când را با este که از قبل می‌دانین و کلمهٔ تازهٔ این درس، întâlnirea، یکجا می‌آورد.
  ro.a1.unit03.lesson03.teach.raspuns_intalnire:
    title: تاریخ یک رویداد را بگویین
    gloss: جلسه روز جمعه، یکم اگست است.
    note: 'روز هفته و تاریخ را می‌شود با هم و با ویرگول جدا از هم بیان کرد: vineri, întâi august.'
  ro.a1.unit03.lesson03.teach.fara_de:
    title: برای روزها و تاریخ‌ها de لازم نیست
    gloss: 'روزها و تاریخ‌ها به «de» ضرورت ندارند: جمعه، یکم اگست.'
    note: 'این با قاعدهٔ واحد دوم فرق دارد: عددهای ۲۰ به بالا پیش از اسم معمولی *de* می‌خواهند (*treizeci de ani*)، اما روز هفته یا تاریخ مستقیم و بدون هیچ *de* می‌آید.'
  ro.a1.unit03.lesson03.teach.line01:
    title: بپرسین جلسه کی است
    gloss: آنا از میهای می‌پرسد که جلسهٔ شان کی است.
    note: یک سوال ساده و بی‌طرف است؛ este با tu یا dumneavoastră تغییر نمی‌کند.
  ro.a1.unit03.lesson03.teach.line02:
    title: گفتن تاریخ
    gloss: میهای می‌گوید که جلسه روز جمعه، یکم اگست است.
    note: 'میهای همان الگوی تاریخ درس دوم را دوباره به کار می‌برد: روز هفته، بعد întâi + ماه، بدون de.'
  ro.a1.unit03.lesson03.teach.line03:
    title: تأیید کنید و صحبت را ختم کنید
    gloss: آنا از او تشکر می‌کند و خداحافظی می‌کند.
    note: La revedere که در واحد اول آموخته شد، صحبت را مثل همیشه ختم می‌کند.
  ro.a1.unit03.lesson03.teach.line04:
    title: دیدار را ختم کنید
    gloss: میهای با گفتن نام آنا جواب خداحافظی را می‌دهد.
    note: تکرار la revedere همراه با نام طرف مقابل راهی طبیعی و دوستانه برای ختم صحبت است.
