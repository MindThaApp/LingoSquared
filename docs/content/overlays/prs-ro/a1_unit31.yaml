teaching:
  ro.a1.unit31.lesson01.teach.inalt_scund:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Înalt* برای شخص قد بلند و *scund* برای شخص قد کوتاه است. هر دو شکل مؤنث هم دارند: *înaltă*، *scundă*.'
    example_gloss:
    - Elena قد بلند است.
    - Andrei قد کوتاه است.
  ro.a1.unit31.lesson01.teach.batran_tanar:
    title: پیر و جوان
    gloss: پیر / جوان
    note: '*Bătrân* و *tânăr* اینجا برداشت کلی از سن را می‌گویند، نه تعداد دقیق سال‌ها. شکل مؤنث: *bătrână*، *tânără*.'
    example_gloss:
    - بابه کلان پیر است.
    - Mihai جوان است.
  ro.a1.unit31.lesson01.teach.pentru_varsta_exacta:
    title: 'Bătrân: برداشت یا عدد'
    gloss: برای سن دقیق می‌پرسید Câți ani ai?، اما bătrân برداشت کلی را می‌رساند، مثل Bunicul este bătrân.
    note: سن دقیق را با *Câți ani ai?* می‌پرسید. اینجا *bătrân* می‌گوید کسی چقدر پیر «به نظر می‌رسد»، بدون گفتن عدد.
  ro.a1.unit31.lesson01.teach.elena_este_inalta:
    title: Elena قد بلند است و Andrei قد کوتاه
    gloss: Elena قد بلند است و Andrei قد کوتاه است.
    note: 'یک جملهٔ ساده با *și* («و») که زمینه را برای مقایسهٔ مستقیم در درس پنجم آماده می‌کند؛ صفت با نهاد هماهنگ می‌شود: *înaltă* برای Elena و *scund* برای Andrei.'
  ro.a1.unit31.lesson02.teach.parul:
    title: مو
    gloss: مو
    note: '*Păr* اسم مذکر است؛ حرف تعریف به آخر آن می‌چسبد: *părul* («موی»).'
    example_gloss: Mihai موی کوتاه و سیاه دارد.
  ro.a1.unit31.lesson02.teach.blond_maro_carunt:
    title: زرد، قهوه‌یی و خاکستری
    gloss: زرد / قهوه‌یی / خاکستری
    note: سه رنگ موی. این‌ها بعد از اسم *păr* (مذکر) می‌آیند، پس می‌گویید *părul blond*، *păr maro*، *păr cărunt*.
    example_gloss:
    - Ana موی بور دارد.
    - Andrei موی قهوه‌یی دارد.
    - بابه کلان موهای خاکستری دارد.
  ro.a1.unit31.lesson02.teach.lung_scurt:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Lung* («بلند») و *scurt* («کوتاه») درازی موی را می‌گویند؛ مثل رنگ‌ها بعد از اسم می‌آیند.'
    example_gloss:
    - Elena موی بلند دارد.
    - Andrei موی کوتاه دارد.
  ro.a1.unit31.lesson02.teach.adjectivul_vine_dupa:
    title: صفت بعد از اسم می‌آید
    gloss: 'صفت بعد از اسم می‌آید: păr scurt, păr lung, păr blond, păr maro, păr cărunt, păr negru.'
    note: در رومانیایی صفت بعد از اسم می‌آید (*păr scurt*)، مثل «موی کوتاه» در دری.
  ro.a1.unit31.lesson02.teach.posesivul_vine_dupa:
    title: «او» ی ملکی بعد از اسم می‌آید
    gloss: 'ضمیر ملکی بعد از اسم می‌آید: părul ei (موی او، زن)، ochii lui (چشم‌های او، مرد).'
    note: '*Ei* یعنی «او» برای زن و *lui* یعنی «او» برای مرد؛ هر دو بعد از اسم می‌آیند: *părul ei*. از متن معلوم می‌شود منظور کیست.'
  ro.a1.unit31.lesson02.teach.mihai_are_parul:
    title: Mihai موی کوتاه و سیاه دارد
    gloss: Mihai موی کوتاه و سیاه دارد.
    note: '*Negru* («سیاه») صفت رنگ است و بعد از اسم می‌آید: *păr negru*.'
  ro.a1.unit31.lesson02.teach.ana_are_parul:
    title: Ana موی بلند و بور دارد
    gloss: Ana موی بلند و بور دارد.
    note: لغات درازی و رنگ این درس در یک جملهٔ طبیعی یکجا شده اند.
  ro.a1.unit31.lesson03.teach.ochii:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Ochi* («چشم / چشم‌ها») در مفرد و جمع یکسان است؛ حرف تعریف تعداد را نشان می‌دهد: *ochiul* («چشم»)، *ochii* («چشم‌ها»).'
    example_gloss: Mihai چشم‌های قهوه‌یی دارد.
  ro.a1.unit31.lesson03.teach.albastru_maro_verde:
    title: آبی، قهوه‌یی و سبز
    gloss: آبی / قهوه‌یی / سبز
    note: '*Albastru* («آبی»)، *maro* («قهوه‌یی») و *verde* («سبز») صفت‌های رنگ اند. *Maro* هیچ‌وقت تغییر نمی‌کند؛ *albastru* در جمع *albaștri* و *verde* در جمع *verzi* می‌شود.'
    example_gloss:
    - Ana چشم‌های آبی دارد.
    - Andrei چشم‌های قهوه‌یی دارد.
    - Elena چشم‌های سبز دارد.
  ro.a1.unit31.lesson03.teach.la_plural_adjectivul:
    title: صفت‌های جمع
    gloss: 'در جمع صفت تغییر می‌کند: ochi albaștri, ochi maro, ochi verzi.'
    note: با *ochi* ی جمع، صفت شکل جمع می‌گیرد (*albaștri*، *verzi*)؛ *maro* همان‌طور می‌ماند. با مفرد *păr albastru* مقایسه کنید.
  ro.a1.unit31.lesson03.teach.cum_arata_ana:
    title: Ana چه شکلی است؟
    gloss: Ana چه شکلی است؟
    note: '*Cum arată ...?* سوال اصلی این بخش است؛ با آن می‌توانین درباره‌ی قیافه و ظاهر هر کسی بپرسین.'
  ro.a1.unit31.lesson03.teach.ana_are_parul:
    title: آنا موهای بلند و بور و چشمان آبی دارد
    gloss: آنا موهای بلند و بور و چشمان آبی دارد.
    note: یک جمله‌ی نمونه که موی و چشم را با *și* در یک جمله جمع می‌کند.
  ro.a1.unit31.lesson04.teach.ana_vine_o:
    title: آنا، نینا را معرفی می‌کند
    gloss: 'آنا: یک دختر تازه به کافه‌ی زبان‌های خارجی می‌آید. نامش نینا است.'
    note: '*Vine o fată nouă* («یک دختر تازه می‌آید») برای معرفی کسی تازه است؛ *O cheamă Nina* نام او را می‌گوید.'
  ro.a1.unit31.lesson04.teach.mihai_bine_cum:
    title: میهای می‌پرسد او چه قیافه‌ای دارد
    gloss: 'میهای: خوب! قیافه‌اش چطور است؟'
    note: 'همان سوال اصلی این بخش بدون نام: *Cum arată?* (از موقعیت معلوم است که درباره‌ی کی می‌پرسند).'
  ro.a1.unit31.lesson04.teach.ana_este_scunda:
    title: آنا قد و موی نینا را توصیف می‌کند
    gloss: 'آنا: قدش کوتاه است و موهای کوتاه و بور دارد.'
    note: واژه‌ی *scundă* از درس اول با واژه‌های موی از درس دوم یکجا شده است.
  ro.a1.unit31.lesson04.teach.mihai_si_ochii:
    title: میهای درباره‌ی چشمان او می‌پرسد
    gloss: 'میهای: و چشم‌هایش؟'
    note: '*Și ochii?* («و چشم‌ها؟») یک سوال کوتاه دنباله‌دار است؛ از موقعیت معلوم است که درباره‌ی کی است.'
  ro.a1.unit31.lesson04.teach.ana_are_ochi:
    title: آنا چشمان نینا را توصیف می‌کند
    gloss: 'آنا: چشمانش سبز است.'
    note: عبارت *ochi verzi* از درس سوم دوباره آمده است.
  ro.a1.unit31.lesson04.teach.mihai_multumesc_atunci:
    title: میهای او را می‌شناسد
    gloss: 'میهای: تشکر! پس حتماً او را می‌شناسم.'
    note: '*O recunosc* یعنی «او را می‌شناسم»: *o* ضمیر مفعولی «او» است و پیش از فعل می‌آید.'
  ro.a1.unit31.lesson05.teach.andrei_si_elena:
    title: مقایسه‌ی آندری و النا
    gloss: آندری و النا برادر و خواهر استند، اما قیافه‌شان فرق دارد. آندری قدکوتاه است و موهای کوتاه و قهوه‌یی و چشمان قهوه‌یی دارد. النا از آندری قدبلندتر است و موهای بلند و قهوه‌یی و چشمان سبز دارد. تو چه قیافه‌یی داری؟
    note: یک مقایسهٔ کوتاه که همهٔ لغات رنگ و درازی تا اینجا را دوباره به کار می‌برد و با سوال اصلی این بخش از خواننده تمام می‌شود.
    glosses:
      frate: برادر
      soră: خواهر
      arată: ظاهر شدن، به نظر آمدن
      diferit: فرق دار
      scund: کوتاه
      scurt: کوتاه
      maro: قهوه‌یی
      părul: مو
      ochi: چشم‌ها
      înaltă: قدبلندتر
      lung: دراز
      verzi: سبز
      arăți: قیافه داشتن
  ro.a1.unit31.lesson05.teach.comparativul_se_formeaza:
    title: مقایسه با mai ... decât
    gloss: 'صفت تفضیلی با mai + صفت + decât ساخته می‌شود: Elena este mai înaltă decât Andrei.'
    note: 'در زبان رومانیایی *mai* («بیشتر») پیش از صفت و *decât* («از») پیش از نفر دوم می‌آید: *mai înaltă decât Andrei*.'
  ro.a1.unit31.lesson05.teach.elena_are_parul:
    title: موهای النا از آندری بلندتر است
    gloss: موهای النا از موهای آندری بلندتر است.
    note: '*Mai lung* هم پیش از *decât* به همین شکل می‌آید: *părul mai lung decât Andrei*؛ صفت باز هم بعد از *părul* می‌آید.'
  ro.a1.unit31.lesson05.teach.am_parul_scurt:
    title: موهایم کوتاه و قهوه‌یی است
    gloss: موهایم کوتاه و قهوه‌یی است.
    note: یک جمله‌ی نمونه‌ی شخص اول با *Am ...*؛ وقتی ظاهر خود را توصیف می‌کنین می‌توانین از آن استفاده کنید.
  ro.a1.unit31.lesson06.teach.mihai_uite_ea:
    title: میهای نینا را می‌بیند
    gloss: 'میهای: ببین، او نینا است؟ موهای کوتاه و بور و چشمان سبز دارد.'
    note: '*Uite* («ببین») توجه را به چیزی جلب می‌کند؛ *ea e Nina?* یعنی «او نینا است؟».'
  ro.a1.unit31.lesson06.teach.ana_da_ea:
    title: آنا تأیید می‌کند
    gloss: 'آنا: بلی، او نینا است!'
    note: یک تأیید کوتاه و طبیعی.
  ro.a1.unit31.lesson06.teach.nina_salut_tu:
    title: نینا به میهای سلام می‌دهد
    gloss: 'نینا: سلام، تو میهای استی؟'
    note: 'یک سوال ساده‌ی سلام و احوال‌پرسی غیررسمی: *tu ești ...?*'
  ro.a1.unit31.lesson06.teach.mihai_da_ma:
    title: میهای جواب سلام نینا را می‌دهد
    gloss: 'میهای: بلی! از آشنایی با تو خوشحال استم، نینا.'
    note: '*Mă bucur să te cunosc* («از آشنایی با تو خوشحال استم») عبارت معمول برای اولین دیدار است.'
  ro.a1.unit31.lesson06.teach.nina_si_eu:
    title: Nina جواب می‌دهد
    gloss: 'Nina: من هم از آشنایی با تو خوش شدم!'
    note: گفتگو را تمام می‌کند — میهای نینا را از روی توصیف آنا درست شناخت.
exercises:
