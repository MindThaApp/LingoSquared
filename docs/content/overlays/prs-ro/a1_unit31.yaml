    correct_option: آندری قدکوتاه است.
    distractors:
    - آندری قدبلند است.
    - آندری پیر است.
    - آندری جوان است.
    accepted_answers:
    - value: آندری قدکوتاه است.
      status: correct
    feedback: Andrei este scund.
