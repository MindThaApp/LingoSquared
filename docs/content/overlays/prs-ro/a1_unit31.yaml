    instruction: معنی درست جمله‌ی «Elena este înaltă.» را انتخاب کنید.
    correct_option: النا قدبلند است.
    distractors:
    - النا قدکوتاه است.
    - النا پیر است.
    - النا جوان است.
    accepted_answers:
