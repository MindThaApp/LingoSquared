    correct_option: Elena este înaltă și Andrei este scund
    accepted_answers:
    - value: Elena este înaltă și Andrei este scund
      status: correct
    feedback: Elena este înaltă și Andrei este scund.
  ro.a1.unit31.lesson01.exercise05.listen_bunicul_este_batran:
    instruction: گوش کنید و کلمه‌ها را به ترتیبی که می‌شنوید بچینید.
    correct_option: Bunicul este bătrân
    accepted_answers:
    - value: Bunicul este bătrân
      status: correct
    feedback: 'جمله‌ی کامل این است: Bunicul este bătrân.'
  ro.a1.unit31.lesson01.exercise06.translate_tanar:
    instruction: 'به رومانیایی ترجمه کنید: جوان.'
    accepted_answers:
    - value: tânăr
      status: correct
    feedback: Tânăr یعنی جوان.
    prompt_blocks:
    - جوان
  ro.a1.unit31.lesson02.exercise01.choose_ana_are_parul:
    instruction: معنی درست جمله‌ی «Ana are părul lung și blond.» را انتخاب کنید.
    correct_option: آنا موهای بلند و بور دارد.
    distractors:
    - آنا موهای کوتاه و سیاه دارد.
    - آنا موهای بلند و قهوه‌یی دارد.
    - آنا موهای سفید دارد.
    accepted_answers:
    - value: آنا موهای بلند و بور دارد.
      status: correct
    feedback: Ana are părul lung și blond.
  ro.a1.unit31.lesson02.exercise02.listen_mihai_are_parul:
    instruction: گوش کنید و آنچه را که گوینده می‌گوید انتخاب کنید.
    correct_option: میهای موهای کوتاه و سیاه دارد.
    distractors:
    - میهای موهای بلند و سیاه دارد.
    - میهای موهای کوتاه و قهوه‌یی دارد.
    - میهای موهای کوتاه و بور دارد.
    accepted_answers:
    - value: میهای موهای کوتاه و سیاه دارد.
      status: correct
    feedback: Mihai are părul scurt și negru.
  ro.a1.unit31.lesson02.exercise03.match_par_blond_maro:
    instruction: هر کلمه یا عبارت رومانیایی را با معنایش جور کنید.
    accepted_answers:
    - value:
      - left: păr
        right: مو
      - left: blond
        right: زرد (بوراق)
      - left: maro
