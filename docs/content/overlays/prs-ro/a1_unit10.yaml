  ro.a1.unit10.lesson03.rutina_mihai:
    title: برنامهٔ روزانهٔ میحای
teaching:
  ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine:
    title: 'یادآوری: dimineața، seara، noaptea، cafea، pâine'
    gloss: dimineața (صبح) · seara (شام، عصر) · noaptea (شب) · cafea (قهوه) · pâine (نان)
    note: همه از قبل یاد گرفته شده‌اند -- dimineața/seara/noaptea از درس ۴ و cafea/pâine از درس ۶ -- اینجا در جمله‌های برنامهٔ روزانهٔ همین درس با هم می‌آیند.
  ro.a1.unit10.lesson01.teach.ma_trezesc_vocab:
    title: من بیدار می‌شوم
    gloss: Mă trezesc (بیدار می‌شوم)
    note: '*Mă* ضمیر انعکاسی است که قبلاً در *mă numesc*/*mă cheamă* دیدید -- رومانیایی برای «بیدار شدن» فعل انعکاسی می‌گیرد، یعنی تحت‌اللفظی «خودم را بیدار می‌کنم».'
    example_gloss:
    - من صبح بیدار می‌شوم.
  ro.a1.unit10.lesson01.teach.ma_trezesc_phrase:
    title: من صبح بیدار می‌شوم
    gloss: Mă trezesc dimineața. (من صبح بیدار می‌شوم.)
    note: یک جملهٔ کوتاه و کامل -- ساده‌ترین جملهٔ برنامهٔ روزانه.
  ro.a1.unit10.lesson01.teach.mananc_vocab:
    title: من می‌خورم
    gloss: Mănânc (می‌خورم)
    note: ضمیر «من» لازم نیست -- پایانهٔ فعل در رومانیایی نشان می‌دهد چه کسی صحبت می‌کند، مثل *vreau*/*cumpăr*/*aș dori* که قبلاً دیدید.
    example_gloss:
    - من صبح نان می‌خورم.
  ro.a1.unit10.lesson01.teach.beau_vocab:
    title: من می‌نوشم
    gloss: Beau (می‌نوشم)
    note: به‌طور طبیعی با نوشیدنی‌های آشنا مثل *cafea* و *ceai* می‌آید.
    example_gloss:
    - من صبح چای قهوه می‌نوشم.
  ro.a1.unit10.lesson01.teach.mananc_beau_phrase:
    title: من صبح نان می‌خورم و قهوه می‌نوشم
    gloss: Mănânc pâine și beau cafea dimineața. (من صبح نان می‌خورم و قهوه می‌نوشم.)
    note: دو کار با *și* (و) وصل شده‌اند که از *ora unu și jumătate* در درس ۴ می‌شناسید.
  ro.a1.unit10.lesson02.teach.lucrez_vocab:
    title: من کار می‌کنم
    gloss: Lucrez (کار می‌کنم)
    note: شکل اول شخص *lucrează* است که در درس ۴ دربارهٔ کار شبانهٔ میحای دیدید.
    example_gloss:
    - من شام کار می‌کنم.
  ro.a1.unit10.lesson02.teach.lucrez_phrase:
    title: من شام کار می‌کنم
    gloss: Lucrez seara. (من شام کار می‌کنم.)
    note: یک جملهٔ کوتاه و کامل دربارهٔ وقت کار کردن.
  ro.a1.unit10.lesson02.teach.merg_vocab:
    title: من می‌روم
    gloss: Merg (می‌روم)
    note: شکل اول شخص *mergeți* است، یعنی همان امری که قبلاً یاد گرفتید -- همان فعل، شخص دیگر.
    example_gloss:
    - من به خانه می‌روم.
  ro.a1.unit10.lesson02.teach.acasa_vocab:
    title: خانه
    gloss: Acasă (خانه)
    note: بدون حرف اضافه می‌آید -- *merg acasă*، نه *merg la acasă*. در دری هم می‌گوییم «به خانه می‌روم» بدون کلمهٔ اضافی، اما در رومانیایی هیچ حرف اضافه‌ای نمی‌آید.
    example_gloss:
    - من شب به خانه می‌روم.
  ro.a1.unit10.lesson02.teach.merg_acasa_phrase:
    title: من شب به خانه می‌روم
    gloss: Merg acasă noaptea. (من شب به خانه می‌روم.)
    note: یک جملهٔ کوتاه و کامل -- پایان طبیعی یک روز کاری.
  ro.a1.unit10.lesson02.teach.lucrez_merg_phrase:
    title: من شام کار می‌کنم و شب به خانه می‌روم
    gloss: Lucrez seara și merg acasă noaptea. (من شام کار می‌کنم و شب به خانه می‌روم.)
    note: هر دو جملهٔ همین درس با *și* در یک جمله جمع شده‌اند.
  ro.a1.unit10.lesson03.teach.reminder_cursul_incepe_ora_apoi:
    title: 'یادآوری: cursul، începe، la ora nouă، apoi'
    gloss: cursul (صنف) · începe (شروع می‌شود) · la ora nouă (ساعت نُه) · apoi (بعد)
    note: Cursul/începe/la ora nouă از درس ۴ آشنا استند (صنف میحای ساعت نُه صبح شروع می‌شود)؛ apoi از درس ۹ -- اینجا در گزارش برنامهٔ روزانهٔ خود میحای با هم می‌آیند.
  ro.a1.unit10.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'یادآوری: bună، mulțumesc، la revedere، da، Ana، Mihai'
    gloss: bună (سلام) · mulțumesc (تشکر) · la revedere (خداحافظ) · da (بلی) · Ana، Mihai (نام‌ها)
    note: همه در درس‌های قبلی یاد گرفته شده‌اند -- اینجا آنا از میحای دربارهٔ روزش می‌پرسد.
  ro.a1.unit10.lesson03.teach.ma_culc_vocab:
    title: من می‌خوابم
    gloss: Mă culc (می‌خوابم)
    note: یک فعل انعکاسی دیگر، با همان الگوی *mă trezesc* -- تحت‌اللفظی «خودم را می‌خوابانم».
    example_gloss:
    - من شب می‌خوابم.
  ro.a1.unit10.lesson03.teach.ma_culc_phrase:
    title: من شب می‌خوابم
    gloss: Mă culc noaptea. (من شب می‌خوابم.)
    note: پایان طبیعی روز که برنامهٔ شروع‌شده با *mă trezesc dimineața* را کامل می‌کند.
  ro.a1.unit10.lesson03.teach.line01:
    title: سلام و پرسیدن وقت شروع صنف
    gloss: آنا به میحای سلام می‌کند و می‌پرسد صنفش کی شروع می‌شود.
    note: همان سؤال درس ۴ دربارهٔ کورس میحای دوباره آمده است.
  ro.a1.unit10.lesson03.teach.line02:
    title: جواب با وقت صنف
    gloss: میحای می‌گوید صنفش ساعت نُه صبح شروع می‌شود.
    note: دقیقاً همان جوابی که میحای در درس ۴ داد، اینجا در برنامهٔ کامل‌تر روزانه‌اش تکرار شده است.
  ro.a1.unit10.lesson03.teach.line03:
    title: پرسیدن دربارهٔ شام
    gloss: 'آنا یک سؤال کوتاه دنبالی می‌پرسد: «و شام؟»'
    note: راهی طبیعی و کوتاه برای پرسیدن بقیهٔ برنامه، بدون کلمهٔ پرسشی تازه.
  ro.a1.unit10.lesson03.teach.line04:
    title: توصیف بقیهٔ روز
    gloss: میحای می‌گوید شام کار می‌کند، بعد شب می‌خوابد.
    note: '*lucrez* و *mă culc* همین درس با *apoi* وصل شده‌اند -- و با واقعیت درس ۴ که میحای شام کار می‌کند می‌خواند.'
  ro.a1.unit10.lesson03.teach.line05:
    title: تشکر و ختم
    gloss: آنا می‌گوید «خوب!»، از میحای تشکر می‌کند و خداحافظی می‌کند.
    note: همان تشکر پایانی که در گفتگوهای درس ۱، ۸ و ۹ بود.
  ro.a1.unit10.lesson03.teach.line06:
    title: ختم دیدار
    gloss: میحای هم خداحافظی می‌کند و نام آنا را می‌گوید.
    note: همان الگوی دوستانهٔ پایان که گفتگوهای همهٔ درس‌های قبلی با آن تمام شد.
