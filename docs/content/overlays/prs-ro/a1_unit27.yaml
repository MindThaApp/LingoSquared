teaching:
  ro.a1.unit27.lesson01.teach.fericit_trist_suparat:
    title: خوش، غمگین و خشمگین
    gloss: خوش، غمگین، خشمگین
    note: 'سه کلمهٔ ابتدایی احساس که با *a fi* (بودن) استفاده می‌شوند. هر کدام شکل مؤنثی با *-ă* دارند: *fericită*، *tristă*، *supărată*.'
    example_gloss:
    - من خوش هستم.
    - من غمگین استم.
    - من خشمگین هستم.
  ro.a1.unit27.lesson01.teach.sunt_fericit:
    title: گفتن اینکه خوش استی
    gloss: من خوش هستم.
    note: الگوی اصلی *Sunt* (از *a fi*، بودن) + صفت احساس است، درست مثل «من ... استم» در دری. زن می‌گوید *Sunt fericită*.
  ro.a1.unit27.lesson01.teach.nu_sunt_suparat:
    title: مقایسه‌ی احساسات
    gloss: من خشمگین نیستم، غمگین هستم.
    note: '*Nu* پیش از فعل آن را منفی می‌سازد: *Nu sunt supărat*. جملهٔ دوم بعد از آن احساس اصلی را می‌گوید.'
  ro.a1.unit27.lesson02.teach.de_ce_esti:
    title: پرسیدن سبب
    gloss: چرا خوش استی؟
    note: '*De ce* (چرا) سوال معمول برای پرسیدن دلیل است.'
  ro.a1.unit27.lesson02.teach.sunt_fericit_pentru:
    title: گفتن سبب
    gloss: من خوش هستم چون یک آپارتمان نو دارم.
    note: '*Pentru că* (چون) جملهٔ دلیل را معرفی می‌کند؛ ترتیب کلمات عادی می‌ماند: *am un apartament nou*.'
  ro.a1.unit27.lesson02.teach.sunt_trist_pentru:
    title: یک سبب منفی
    gloss: من غمگین هستم چون باران می‌بارد.
    note: '*Plouă* (باران می‌بارد) در رومانیایی فاعل ندارد، پس خودش به تنهایی جملهٔ دلیل شده می‌تواند.'
  ro.a1.unit27.lesson03.teach.emotionat:
    title: عصبی
    gloss: عصبی
    note: کلمه‌ی معمول برای دلواپسی و اضطراب.
    example_gloss: من از اولین نوبت کاری‌ام دلواپس هستم.
  ro.a1.unit27.lesson03.teach.sunt_emotionat_pentru:
    title: گفتن اینکه از چه دلواپس استی
    gloss: من از اولین نوبت کاری‌ام دلواپس هستم.
    note: '*Pentru* (در اصل «برای») نشان می‌دهد دلشوره بخاطر چیست؛ در دری معمولاً «بخاطر» یا «از بابت» می‌گوییم.'
  ro.a1.unit27.lesson03.teach.nu_ti_face:
    title: دلداری دادن به کسی
    gloss: غم نخور.
    note: '*Nu-ți face griji* (در اصل «برای خودت غم نساز») عبارت ثابت و معمول برای دلداری است. به شخص ناآشنا: *Nu vă faceți griji*.'
  ro.a1.unit27.lesson04.teach.cum_se_simte:
    title: پرسیدن اینکه کسی چه احساس دارد
    gloss: Mihai چه احساسی دارد؟
    note: '*A se simți* (احساس کردن) انعکاسی است: *mă simt* (من)، *te simți* (تو)، *se simte* (او). راه معمول برای پرسیدن یا گفتن احساسات است.'
  ro.a1.unit27.lesson04.teach.el_se_simte:
    title: گفتن اینکه کسی چه احساس دارد
    gloss: او دلواپس است.
    note: '*Se* ضمیر انعکاسی برای او (مرد یا زن) است و پیش از فعل می‌آید: *se simte*.'
  ro.a1.unit27.lesson04.teach.de_ce_se:
    title: پرسیدن اینکه چرا کسی چنین احساسی دارد
    gloss: چرا او دلواپس است؟
    note: '*De ce* را با الگوی *se simte* از *El se simte emoționat* یکجا می‌کند.'
  ro.a1.unit27.lesson05.teach.salut_ana_sunt:
    title: خواندن پیام درباره‌ی احساسات
    gloss: سلام Ana، من برای اولین نوبت کارم که تنها استم کمی دلشوره دارم. اما خوشحال هم استم، چون کار نو و آپارتمان نو دارم. فکر می‌کنم همه‌چیز درست می‌شود.
    note: بفهم که نویسنده از چه دلواپس است، چه چیز او را خوش می‌کند و دید کلی‌اش چیست.
    glosses:
      puțin: کمی
      emoționat: عصبی
      prima: اولین
      tură: نوبت کاری
      singur: تنها
      fericit: خوشحال
      fiindcă: چون
      nou: نو
      serviciu: کار
      apartament: آپارتمان
      cred: فکر کردن
      rezolvă: 'درست شدن (اینجا: خوب می‌شود)'
  ro.a1.unit27.lesson06.teach.ana_salut_mihai:
    title: Ana می‌پرسد Mihai چه احساسی دارد
    gloss: 'Ana: سلام Mihai، پیش از اولین نوبت کارت چه احساسی داری؟'
    note: '*Cum te simți* ضمیر انعکاسی *te* («خودت») دارد؛ در *prima ta tură* صفت ملکی *ta* با اسم مؤنث *tură* هماهنگ است.'
  ro.a1.unit27.lesson06.teach.mihai_sunt_putin:
    title: Mihai اعتراف می‌کند که دلشوره دارد
    gloss: 'Mihai: کمی دلشوره دارم، رک بگویم.'
    note: '*Sincer să fiu* (رک بگویم) اعتراف را نرم‌تر می‌سازد.'
  ro.a1.unit27.lesson06.teach.ana_nu_ti:
    title: Ana به او دلداری می‌دهد
    gloss: 'Ana: غم نخور، خوب از عهده می‌آیی!'
    note: '*O să te descurci bine* (در اصل «خوب از عهده می‌آیی») عبارت ثابت دلگرم‌کننده است؛ *o să* + فعل زمان آینده را می‌سازد.'
  ro.a1.unit27.lesson06.teach.mihai_multumesc_chiar:
    title: Mihai از او تشکر می‌کند
    gloss: 'Mihai: تشکر، واقعاً کمک می‌کند.'
    note: '*Ajută* شکل سوم شخص مفرد فعل *a ajuta* (کمک کردن) است؛ در اینجا یعنی «کمک می‌کند».'
  ro.a1.unit27.lesson06.teach.ana_si_dupa:
    title: Ana پیش‌بینی می‌کند چه می‌شود
    gloss: 'Ana: و بعد از آن حتماً خیلی خوشحال و سربلند می‌شوی.'
    note: '*Sigur* (حتماً) پیش‌بینی با اطمینان را می‌رساند؛ *mândru* (سربلند) صفت نوِ مفید است (*mândră* برای زن).'
  ro.a1.unit27.lesson06.teach.mihai_da_si:
    title: Mihai موافقت می‌کند
    gloss: 'Mihai: بلی، من هم همین فکر را می‌کنم.'
    note: '*Și eu cred asta* (در اصل «من هم این را فکر می‌کنم») راه طبیعی موافقت با نظر کسی است.'
  ro.a1.unit27.lesson06.teach.mihai_este_emotionat:
    title: جمع‌بندی با este، lui و îl
    gloss: Mihai برای اولین نوبت کارش دلشوره دارد. Ana به او کمک می‌کند.
    note: '*Este* شکل سوم شخص مفرد فعل *a fi* (بودن) است؛ *lui* بعد از اسم یعنی «اش» (از او)؛ *îl* یعنی «او را» یا «به او» و پیش از فعل می‌آید: *îl ajută*. سه کلمهٔ کوچک اما ضروری برای صحبت دربارهٔ شخص دیگر.'
