teaching:
  ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau:
    title: 'یادآوری: mă, vă, ce, sau'
    gloss: مرا · شما (رسمی) · چه · یا
    note: Mă از واحد ۱ و واحد ۱۰ است (mă numesc, mă trezesc)؛ vă از واحد ۱، ۶، ۷ و ۱۳ است (vă rog)؛ ce از واحد ۱، ۳، ۴ و ۱۵ است؛ sau از واحد ۱۳ است — این واحد هر چهار را برای مقصد تازه، یعنی گفتن اینکه کجای آدم درد می‌کند، دوباره به کار می‌برد.
  ro.a1.unit16.lesson01.teach.doare_vocab:
    title: درد می‌کند
    gloss: درد می‌کند
    note: 'فعل بی‌شخص است — رومانیایی می‌گوید «به من درد می‌کند» (*mă doare*)، نه «من درد می‌کنم». *Mă doare* به‌تنهایی یعنی «درد می‌کند (برایم)»؛ برای گفتن اینکه کدام عضو درد می‌کند، نام عضو را اضافه کنید: *Mă doare capul*.'
    example_gloss:
    - درد می‌کند.
  ro.a1.unit16.lesson01.teach.cap_vocab:
    title: سر
    gloss: سر
    note: خنثی است و به صامت ختم می‌شود — برای «سر» پسوند *-ul* می‌گیرد، همان پسوندی که *tren*->*trenul* و *peron*->*peronul* دارند.
    example_gloss:
    - سرم درد می‌کنه.
  ro.a1.unit16.lesson01.teach.ce_va_doare_phrase:
    title: چه چیزت درد می‌کند؟
    gloss: چی‌تان درد می‌کند؟
    note: '*Ce* (چی) + *vă* (شما، حالت مفعولی رسمی) + *doare* — همهٔ این کلمه‌ها قبلاً آموخته شده یا همین حالا معرفی شد و در یک پرسش تازه کنار هم آمده‌اند.'
  ro.a1.unit16.lesson01.teach.stomac_vocab:
    title: شکم
    gloss: معده
    note: خنثی است و به صامت ختم می‌شود، پس «معده» با حرف تعریف می‌شود *stomacul* — همان پسوند *-ul* مثل *cap*->*capul*.
    example_gloss:
    - دلم درد می‌کند.
  ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase:
    title: سر یا معده‌تان درد می‌کند؟
    gloss: سر یا معده‌تان درد می‌کند؟
    note: '*Vă* (شما، رسمی) به‌جای *mă* جمله را به پرسش دربارهٔ شخص مقابل تبدیل می‌کند؛ *sau* (یا، از واحد ۱۳) دو عضوی را که همین حالا آموختید به هم وصل می‌کند.'
  ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de:
    title: 'یادآوری: nu, bine, am, un, de'
    gloss: نه · خوب · دارم · یک (مذکر/خنثی) · از
    note: Nu و bine از واحد ۱، ۶ و ۱۱ استند؛ am از واحد ۲، ۵ و ۱۵ است؛ un و de از واحد ۶، ۷ و ۱۵ استند — این واحد هر پنج را برای گفتن اینکه حال آدم خوب نیست و به داکتر ضرورت دارد، دوباره به کار می‌برد.
  ro.a1.unit16.lesson02.teach.ma_simt_vocab:
    title: احساس می‌کنم
    gloss: احساس می‌کنم
    note: فعل انعکاسی است، تحت‌اللفظی «خودم را احساس می‌کنم» — همان الگوی *mă* + فعل مثل *mă trezesc*/*mă culc* در واحد ۱۰.
    example_gloss:
    - حالم خوب است.
  ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase:
    title: حالم خوب نیست
    gloss: حالم خوب نیست.
    note: '*Nu* جملهٔ *mă simt bine* را منفی می‌کند — راه طبیعی برای گفتن اینکه چیزی درست نیست، بدون اینکه هنوز نشانهٔ مشخصی را نام ببرید.'
  ro.a1.unit16.lesson02.teach.bolnav_vocab:
    title: مریض
    gloss: مریض (مذکر)
    note: شکل مذکر صفت است، همان‌طور که میهای می‌گوید (*Sunt bolnav*). یک زن می‌گوید *Sunt bolnavă* (شکل مؤنث).
    example_gloss:
    - من مریض استم.
  ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase:
    title: به داکتر ضرورت دارم
    gloss: به داکتر ضرورت دارم.
    note: '*Am nevoie de* (ضرورت دارم، تحت‌اللفظی «ضرورتِ ... را دارم») + *un doctor* — یک عبارت ثابت است که برای درخواست کمک در هر موضوع به کار می‌رود، نه فقط دربارهٔ داکتر.'
  ro.a1.unit16.lesson02.teach.doctor_vocab:
    title: Doctor
    gloss: داکتر
    note: مذکر است، پس «یک داکتر» می‌شود *un doctor*.
    example_gloss:
    - به داکتر ضرورت دارم.
  ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da:
    title: 'یادآوری: Ce mai faceți?, Aveți, Da'
    gloss: حال شما چطور است؟ (رسمی) · دارید (رسمی) · بلی
    note: Ce mai faceți از واحد ۱ است؛ Aveți از واحد ۵؛ Da از واحد ۶ و ۱۱ — همه برای گفت‌وگوی احوال‌پرسی این واحد دوباره به کار رفته‌اند.
  ro.a1.unit16.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'یادآوری: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: سلام · تشکر · خدا حافظ · آنا، میهای (نام‌ها)
    note: همه در واحدهای پیشین آمده‌اند — همان الگوی دوستانهٔ آغاز و پایان که هر گفت‌وگوی این کورس داشته است.
  ro.a1.unit16.lesson03.teach.reminder_spitalul_vizavi_magazin:
    title: 'یادآوری: Spitalul este vizavi de magazin'
    gloss: شفاخانه روبه‌روی دکان است.
    note: مستقیم از واحد ۸ آمده است — جای شفاخانه تغییر نکرده و یادداشت خواندنی همین واحد هم به آن برمی‌گردد.
  ro.a1.unit16.lesson03.teach.odihna_vocab:
    title: استراحت
    gloss: استراحت
    note: اسم مؤنث است — چیزی که داکتر (یا یک دوست) وقتی آدم مریض است توصیه می‌کند.
    example_gloss:
    - به استراحت ضرورت دارید.
  ro.a1.unit16.lesson03.teach.multa_apa_vocab:
    title: آب زیاد
    gloss: آب زیاد
    note: '*Multă* (زیاد، مؤنث) با اسم مؤنث *apă* (آب، از واحد ۶) هماهنگ است — یک ترکیب ثابت، از آن چیزهایی که داکتر ممکن است توصیه کند.'
    example_gloss:
    - استراحت و آب زیاد.
  ro.a1.unit16.lesson03.teach.line01:
    title: سلام و پرسیدن احوال
    gloss: آنا به میهای سلام می‌دهد و احوالش را می‌پرسد.
    note: سلام *Ce mai faceți?* واحد ۱ را دوباره به کار می‌برد.
  ro.a1.unit16.lesson03.teach.line02:
    title: گفتن اینکه حالتان خوب نیست
    gloss: میهای می‌گوید حالش خوب نیست و سرش درد می‌کند.
    note: عبارت درس دوم و عبارت درس اول همین واحد را کنار هم می‌آورد.
  ro.a1.unit16.lesson03.teach.line03:
    title: پرسیدن اینکه به داکتر ضرورت دارد یا نه
    gloss: آنا می‌پرسد که آیا او به داکتر ضرورت دارد.
    note: عبارت درس دوم همین واحد را به شکل پرسش و با *aveți* از واحد ۵ به کار می‌برد.
  ro.a1.unit16.lesson03.teach.line04:
    title: تأیید اینکه مریض استین و به داکتر ضرورت دارید
    gloss: میهای می‌گوید بلی، مریض است و به داکتر ضرورت دارد.
    note: '*sunt bolnav* و *am nevoie de un doctor* همین واحد را کنار هم می‌آورد.'
  ro.a1.unit16.lesson03.teach.line05:
    title: توصیه کردن و خدا حافظی
    gloss: آنا به او می‌گوید استراحت کند و آب زیاد بنوشد و خدا حافظی می‌کند.
    note: '*Odihnă și multă apă* همین درس را به کار می‌برد — توصیهٔ مربوط به صحت، به‌جای خدا حافظی ساده‌ای که معمولاً در این کورس است.'
  ro.a1.unit16.lesson03.teach.line06:
    title: تشکر کردن و خدا حافظی
    gloss: میهای از آنا تشکر می‌کند و خدا حافظی می‌کند.
    note: همان الگوی پایانی که گفت‌وگوی هر واحد پیشین با آن تمام شده است.
