teaching:
  ro.a1.unit29.lesson01.teach.cat_costa_in:
    title: پرسیدن قیمت مجموع
    gloss: در مجموع چند تمام می‌شود؟
    note: '*În total* (در مجموع) روشن می‌کند که قیمت کل را می‌خواهین، نه قیمت یک چیز؛ *Cât costă?* یعنی «چند تمام می‌شود؟».'
  ro.a1.unit29.lesson01.teach.costa_douazeci_si:
    title: گفتن قیمت مجموع
    gloss: در مجموع صد لی تمام می‌شود.
    note: '*Costă* شکل او از *a costa* (قیمت داشتن) است. بعد از عددهای بالاتر از ۱۹، رومانیایی پیش از اسم *de* می‌آورد: *o sută de lei*.'
  ro.a1.unit29.lesson02.teach.a_plati_cu:
    title: پرداخت با کارت یا نقد
    gloss: با کارت پرداختن، نقد پرداختن
    note: '*A plăti cu cardul* یعنی با کارت پرداخت کردن و *a plăti în numerar* یعنی نقد پرداخت کردن؛ *cu* یعنی «با» و *în* یعنی «در».'
    example_gloss:
    - اینجا می‌توانم با کارت پرداخت کنم؟
    - من نقد پرداخت می‌کنم.
  ro.a1.unit29.lesson02.teach.pot_plati_cu:
    title: پرسیدن امکان پرداخت با کارت
    gloss: اینجا می‌توانم با کارت پرداخت کنم؟
    note: '*Pot plăti* (می‌توانم پرداخت کنم) از *a putea* به علاوه‌ی یک فعل ساخته می‌شود؛ *aici* (اینجا) پرسش را به همین جا مربوط می‌کند.'
  ro.a1.unit29.lesson02.teach.doriti_sa_platiti:
    title: پرسیدن ترجیح پرداخت
    gloss: می‌خواهین نقد پرداخت کنید یا با کارت؟
    note: '*Doriți să plătiți ...?* شکل رسمی *dumneavoastră* است که صندوقدار ناآشنا می‌گوید؛ با دوست می‌گویید *Vrei să plătești ...?*'
  ro.a1.unit29.lesson03.teach.nota:
    title: حساب
    gloss: حساب
    note: 'اسم مؤنث: *o notă*، *nota* (حرف تعریف به آخر کلمه می‌چسبد).'
    example_gloss: حساب را تقسیم کنیم؟
  ro.a1.unit29.lesson03.teach.hai_sa_impartim:
    title: پیشنهاد تقسیم حساب
    gloss: حساب را تقسیم کنیم؟
    note: '*Hai să* به علاوه‌ی یک فعل پیشنهاد انجام کاری با هم است.'
  ro.a1.unit29.lesson03.teach.pot_plati_separat:
    title: خواستن پرداخت جداگانه
    gloss: می‌توانم جداگانه پرداخت کنم؟
    note: '*Separat* (جداگانه) بعد از *a plăti* می‌آید؛ *Pot plăti separat?* درخواست معمول وقتی است که هر کس سهم خودش را می‌پردازد.'
  ro.a1.unit29.lesson04.teach.restul:
    title: پول خورد
    gloss: پول خورد
    note: '*Restul* در اصل یعنی «باقی»، و رومانیایی پول خوردی را که پس می‌گیرین همین‌طور می‌نامد؛ حرف تعریف به آخر کلمه می‌چسبد.'
    example_gloss: این هم پول خوردتان.
  ro.a1.unit29.lesson04.teach.poftiti_restul:
    title: دادن پول خورد
    gloss: این هم پول خوردتان.
    note: '*Poftiți* شکل رسمی *dumneavoastră* و به معنی «بفرمایید» است، که با حالت رسمی پشت صندوق می‌خواند.'
  ro.a1.unit29.lesson04.teach.nu_am_nevoie:
    title: نپذیرفتن پول خورد
    gloss: پول خورد لازم ندارم.
    note: '*A avea nevoie de* (نیاز داشتن) با *de* می‌آید: *Nu am nevoie de rest*.'
  ro.a1.unit29.lesson05.teach.treizeci_si_cinci:
    title: سی و پنج
    gloss: سی و پنج
    note: 'رومانیایی عددهای ۲۱ تا ۹۹ را با *și* می‌سازد: *treizeci și cinci* (در اصل «سی و پنج»)، و پیش از اسم *de* می‌آورد: *o sută treizeci și cinci de lei*.'
    example_gloss: صد و سی و پنج لی تمام می‌شود.
  ro.a1.unit29.lesson05.teach.nota_doua_feluri:
    title: خواندن صورت‌حساب رستورانت
    gloss: 'صورتحساب: دو غذای اصلی و دو قهوه. مجموع: صد و سی و پنج لی. با کارت پرداخت شده.'
    note: دقت کنید چی سفارش داده شده، مجموع چند است و چطور پرداخت شده.
    glosses:
      Nota: حساب
      două: دو
      feluri: غذاهای اصلی
      cafele: قهوه‌ها
      Total: مجموع
      '135': صد و سی و پنج
      lei: لی
      Plătit: پرداخت شده
      cardul: کارت
  ro.a1.unit29.lesson06.teach.ana_hai_sa:
    title: انا صورتحساب را می‌خواهد
    gloss: 'انا: صورتحساب را بخواهیم؟'
    note: '*A cere* (خواستن) *nota* را به‌عنوان مفعول مستقیم می‌گیرد؛ *Hai să cerem nota?* پیشنهاد می‌کند که با هم آن را بخواهیم.'
  ro.a1.unit29.lesson06.teach.mihai_da_buna:
    title: میهای مجموع را می‌پرسد
    gloss: 'میهای: بلی، فکر خوبی است. در مجموع چند تمام می‌شود؟'
    note: پرسش *Cât costă în total?* از درس اول دوباره آمده است.
  ro.a1.unit29.lesson06.teach.ana_sunt_treizeci:
    title: انا مجموع را می‌گوید
    gloss: 'انا: صد و سی و پنج لی است. تقسیمش کنیم؟'
    note: '*Împărțim* شکل *noi* (ما) از *a împărți* (تقسیم کردن) است؛ *nota* از متن معلوم است.'
  ro.a1.unit29.lesson06.teach.mihai_nu_lasa:
    title: میهای اصرار دارد که خودش پرداخت کند
    gloss: 'میهای: نه، بگذار امروز من پرداخت کنم. تو خیلی به من کمک کردی.'
    note: '*Lasă-mă să* ... (بگذار من ...) روش معمول پیشنهاد انجام کاری است؛ *m-ai ajutat* («به من کمک کردی») شکل گذشته است.'
  ro.a1.unit29.lesson06.teach.ana_ce_dragut:
    title: انا متأثر می‌شود
    gloss: 'انا: چه مهربانی از تو! خیلی تشکر.'
    note: '*Ce drăguț din partea ta!* (چه مهربانی از تو) تعریف گرم و رایجی برای یک کار سخاوتمندانه است.'
  ro.a1.unit29.lesson06.teach.mihai_pot_plati:
    title: میهای درباره‌ی پرداخت با کارت می‌پرسد
    gloss: 'میهای: می‌توانم اینجا با کارت پرداخت کنم؟'
    note: پرسش *Pot plăti cu cardul aici?* از درس دوم دوباره آمده، حالا در خود رستورانت.
  ro.a1.unit29.lesson06.teach.mihai_plateste_nota:
    title: 'Plătește: شکل او'
    gloss: میهای صورتحساب را پرداخت می‌کند.
    note: '*Plătește* شکل او از *a plăti* (پرداخت کردن) است.'
