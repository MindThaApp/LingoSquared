teaching:
  ro.a1.unit20.lesson01.teach.reminder_vreau_un_ce:
    title: 'یادآوری: Vreau, Un, Ce'
    gloss: Vreau (می‌خواهم) · Un (یک، مذکر/خنثی) · Ce (چه)
    note: '*Vreau* (می‌خواهم)، *un* (یک) و *ce* (چه، مثل *Ce mai faceți?*) کلمه‌هایی استند که از قبل می‌دانین -- اینجا برای خواستن یک لباس دوباره استفاده شده‌اند.'
  ro.a1.unit20.lesson01.teach.tricou_vocab:
    title: تی‌شرت
    gloss: Tricou (تی‌شرت)
    note: اسم خنثی است -- مثل اسم‌های مذکر و خنثیِ قبلی، مانند *un leu*، با *un* می‌آید، نه با *o*.
    example_gloss:
    - یک تی‌شرت می‌خواهم.
  ro.a1.unit20.lesson01.teach.culoare_vocab:
    title: رنگ
    gloss: Culoare (رنگ)
    note: اسم مؤنث است و برای پرسیدن رنگ یک چیز به کار می‌رود.
    example_gloss:
    - کدام رنگ؟
  ro.a1.unit20.lesson01.teach.rosu_vocab:
    title: سرخ
    gloss: Roșu (سرخ)
    note: 'بعد از اسمی که توصیف می‌کند می‌آید، که ترتیب معمول صفت در رومانیایی است: *tricou roșu*، یعنی لفظ به لفظ «تی‌شرت سرخ».'
    example_gloss:
    - یک تی‌شرت سرخ می‌خواهم.
  ro.a1.unit20.lesson01.teach.albastru_vocab:
    title: آبی
    gloss: Albastru (آبی)
    note: 'مثل *roșu* بعد از اسم می‌آید: *tricou albastru*.'
    example_gloss:
    - یک تی‌شرت آبی می‌خواهم.
  ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase:
    title: یک تی‌شرت سرخ می‌خواهم.
    gloss: Vreau un tricou roșu.
    note: 'جملهٔ اصلیِ درخواست: *vreau* (می‌خواهم) + *un tricou* (یک تی‌شرت) + *roșu* (سرخ)، که رنگ بعد از اسم می‌آید.'
  ro.a1.unit20.lesson02.teach.reminder_cat_costa_va_rog:
    title: 'یادآوری: Cât, Costă, Vă, Rog'
    gloss: Cât costă? (چند قیمت دارد؟) · Vă rog (لطفاً، رسمی)
    note: '*Cât costă?* از درس بازار است؛ *vă rog* «لطفاً»ی رسمی است -- اینجا برای پرسیدن قیمت لباس و نرم‌تر ساختن درخواست دوباره استفاده شده است.'
  ro.a1.unit20.lesson02.teach.reminder_mic_mica_mare:
    title: 'یادآوری: Mic, Mică, Mare'
    gloss: Mic/Mică (کوچک، مذکر-خنثی/مؤنث) · Mare (بزرگ، برای مذکر و مؤنث مفرد یک شکل دارد)
    note: کلمه‌های اندازه که از مقایسهٔ خوراک و نوشیدنی می‌شناسید -- اینجا برای اندازهٔ لباس دوباره استفاده شده‌اند.
  ro.a1.unit20.lesson02.teach.pantaloni_vocab:
    title: پتلون
    gloss: Pantaloni (پتلون)
    note: در رومانیایی معمولاً به شکل جمع به کار می‌رود -- *pantaloni* یعنی یک جوره پتلون.
    example_gloss:
    - پتلون می‌خواهم.
  ro.a1.unit20.lesson02.teach.marime_vocab:
    title: اندازه
    gloss: Mărime (اندازه)
    note: اسم مؤنث است -- با *mică* (کوچک)ِ مؤنث که بالاتر یادآوری شد و با *mare* (بزرگ)ِ بی‌تغییر می‌آید.
    example_gloss:
    - چه اندازه؟
  ro.a1.unit20.lesson02.teach.ce_marime_phrase:
    title: چه اندازه؟
    gloss: Ce mărime? (چه اندازه؟)
    note: پرسش همیشگیِ پیشِ پیشخوان دکان -- کوتاه و بدون فعل، با همان شکل کوتاه *Ce culoare?* (چه رنگ؟).
  ro.a1.unit20.lesson02.teach.marime_mica_va_rog_phrase:
    title: اندازهٔ کوچک، لطفاً.
    gloss: Mărime mică, vă rog.
    note: '*Mică* شکل مؤنث *mic* است و با *mărime*ِ مؤنث مطابقت می‌کند -- با *vă rog*ِ یادآوری‌شده ترکیب شده تا اندازه‌تان را مؤدبانه بگویین.'
  ro.a1.unit20.lesson02.teach.cat_costa_pantalonii_phrase:
    title: پتلون چند قیمت دارد؟
    gloss: Cât costă pantalonii? (پتلون چند قیمت دارد؟)
    note: '*Pantalonii* شکل معرفهٔ *pantaloni* است («پتلون» با ادات تعریف) -- اسم‌های مذکر جمع برای معرفه شدن *-i* می‌گیرند (*pantaloni* ← *pantalonii*). با *cât costă*ِ یادآوری‌شده ترکیب شده است.'
  ro.a1.unit20.lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si:
    title: 'یادآوری: Bună, Mulțumesc, Bine, La revedere, Și'
    gloss: Bună (سلام) · Mulțumesc (تشکر) · Bine (خوب) · La revedere (خدا حافظ) · Și (و)
    note: احوال‌پرسی‌های روزمره و *și* (و) -- اینجا برای شروع و ختم گفتگو در دکان دوباره استفاده شده‌اند.
  ro.a1.unit20.lesson03.teach.reminder_zece_douazeci_de_lei:
    title: 'یادآوری: Zece, Douăzeci, De, Lei'
    gloss: Zece (ده) · Douăzeci (بیست) · De (از؛ از بیست به بالا پیش از lei می‌آید) · Lei (پول رایج، جمع leu)
    note: عددها و واحد پول *leu/lei* که از قبل می‌شناسید -- اینجا برای قیمت تی‌شرت و پتلون دوباره استفاده شده‌اند.
  ro.a1.unit20.lesson03.teach.line01:
    title: سلام به Mihai و خواستن یک تی‌شرت سرخ
    gloss: Ana به Mihai سلام می‌دهد و می‌گوید یک تی‌شرت سرخ می‌خواهد.
    note: 'جملهٔ درخواست از درس اول: *Vreau un tricou roșu.*'
  ro.a1.unit20.lesson03.teach.line02:
    title: پرسیدن اندازه
    gloss: Mihai می‌پرسد که چه اندازه می‌خواهد.
    note: 'پرسش همیشگی در دکان: *Ce mărime?* (چه اندازه؟).'
  ro.a1.unit20.lesson03.teach.line03:
    title: گفتن اندازه به شکل مؤدبانه و پرسیدن قیمت
    gloss: Ana اندازهٔ کوچک می‌خواهد، بعد می‌پرسد که چند قیمت دارد.
    note: '*Mărime mică, vă rog* (اندازهٔ کوچک، لطفاً)، بعد *Cât costă?* (چند قیمت دارد؟).'
  ro.a1.unit20.lesson03.teach.line04:
    title: گفتن قیمت
    gloss: Mihai می‌گوید پنجاه lei قیمت دارد.
    note: '*cincizeci de lei*ِ یادآوری‌شده به کار رفته است.'
  ro.a1.unit20.lesson03.teach.line05:
    title: قبول کردن و پرسیدن قیمت پتلون
    gloss: Ana قبول می‌کند، بعد می‌گوید پتلون هم می‌خواهد و قیمتش را می‌پرسد.
    note: '*Și* اینجا یعنی «هم»: *Vreau și pantaloni* -- «پتلون هم می‌خواهم.»'
  ro.a1.unit20.lesson03.teach.line06:
    title: گفتن قیمت پتلون
    gloss: Mihai می‌گوید پتلون صد و بیست lei قیمت دارد.
    note: 'از بیست به بالا، در رومانیایی میان عدد و اسم *de* می‌آید: *o sută douăzeci de lei*.'
  ro.a1.unit20.lesson03.teach.line07:
    title: تشکر از Mihai و خدا حافظی
    gloss: Ana از او تشکر می‌کند و خدا حافظی می‌کند.
    note: یک تشکر و خدا حافظیِ مؤدبانه.
  ro.a1.unit20.lesson03.teach.line08:
    title: خدا حافظی
    gloss: Mihai خدا حافظی می‌کند.
    note: یک خدا حافظیِ ساده با گفتن نام Ana.
