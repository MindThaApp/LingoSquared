teaching:
  ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri:
    title: 'یادآوری: unde, este, gară, magazin, bancă, aproape'
    gloss: کجا · است · ایستگاه قطار · دکان · بانک · نزدیک
    note: همهٔ این‌ها از قبل معرفی شده اند -- unde از درس ۷، este از درس ۳ و ۴، gară/magazin/bancă/aproape از درس ۸ -- و اینجا در پرسش‌ها و مثال‌های راهنمایی این درس باهم می‌آیند.
  ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung:
    title: چطور به ... برسم؟
    gloss: چطور به ... برسم؟
    note: راه معمول پرسیدن برای رسیدن به یک جا -- *pot* (می‌توانم) پیش‌تر در *Unde pot să cumpăr...?* درس ۷ آمده بود؛ *ajung* (می‌رسم) تازه است.
  ro.a1.unit09.lesson01.teach.mergeti_vocab:
    title: بروید
    gloss: بروید (امر محترمانه)
    note: '*Mergeți* شکل امر در حالت محترمانهٔ dumneavoastră است -- راه مؤدبانه برای گفتن «بروید»، همان‌طور که Ana و Mihai پیش‌تر باهم صحبت می‌کردند.'
    example_gloss:
    - مستقیم بروید.
  ro.a1.unit09.lesson01.teach.inainte_vocab:
    title: سیده
    gloss: مستقیم
    note: با *Mergeți* می‌آید و ساده‌ترین راهنمایی را می‌سازد.
    example_gloss:
    - مستقیم بروید.
  ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase:
    title: مستقیم برو
    gloss: مستقیم بروید.
    note: یک راهنمایی کوتاه و کامل -- ساده‌ترین جواب برای *Cum pot să ajung...?*
  ro.a1.unit09.lesson01.teach.cum_ajung_gara:
    title: چطور به ایستگاه قطار برسم؟
    gloss: چطور به ایستگاه قطار برسم؟
    note: '*Cum pot să ajung...?* و *gară* را در یک پرسش کامل جمع می‌کند -- *la* (به) پرسش را به مقصد وصل می‌کند. بعد از *la*، اسم شکل ساده‌اش را نگه می‌دارد: *la gară*، نه *la gara*.'
  ro.a1.unit09.lesson01.teach.cum_ajung_banca:
    title: چطور به بانک برسم؟
    gloss: چطور به بانک برسم؟
    note: همان ساختار، این بار با بانک -- پرسش طبیعی، چون در درس ۸ یاد گرفتیم که بانک دور است.
  ro.a1.unit09.lesson02.teach.dreapta_stanga_vocab:
    title: طرف راست، طرف چپ
    gloss: طرف راست · طرف چپ
    note: 'دو پیچ اساسی -- هر کدام را با *la* (به) به شکل یک جفت ثابت یاد بگیرین: *la dreapta*، *la stânga*.'
    example_gloss:
    - طرف راست بروید.
    - طرف چپ بروید.
  ro.a1.unit09.lesson02.teach.mergeti_dreapta_phrase:
    title: طرف راست بروید
    gloss: طرف راست بروید.
    note: همان امر *Mergeți* مثل *Mergeți înainte.*، فقط این بار با پیچ به‌جای مستقیم.
  ro.a1.unit09.lesson02.teach.mergeti_stanga_phrase:
    title: طرف چپ بروید
    gloss: طرف چپ بروید.
    note: پیچ مخالف -- همان ساختار ساده.
  ro.a1.unit09.lesson02.teach.aici_acolo_vocab:
    title: اینجا، آنجا
    gloss: اینجا · آنجا
    note: راه ساده برای نشان دادن جای چیزی وقتی رسیده باشین یا آن را ببینین؛ فرق دارد با aproape/departe درس ۸ که فاصله را می‌گویند، نه موقعیت را.
    example_gloss:
    - دکان اینجاست.
    - ایستگاه قطار آنجاست.
  ro.a1.unit09.lesson02.teach.magazinul_aici_phrase:
    title: دکان اینجاست
    gloss: دکان اینجاست.
    note: یک جملهٔ کوتاه و کامل -- *aici* به چیزی اشاره می‌کند که درست همان‌جایی است که شما استین.
  ro.a1.unit09.lesson02.teach.gara_acolo_phrase:
    title: ایستگاه قطار آنجاست
    gloss: ایستگاه قطار آنجاست.
    note: '*Acolo* به چیزی اشاره می‌کند که دیده می‌شود ولی درست همان‌جا که شما استین نیست -- راه طبیعی برای ختم راهنمایی.'
  ro.a1.unit09.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'یادآوری: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: 'سلام · تشکر · خداحافظ · بلی · نام‌ها: Ana، Mihai'
    note: همهٔ این‌ها در درس‌های پیشین معرفی شده اند -- اینجا Ana از Mihai راه را می‌پرسد.
  ro.a1.unit09.lesson03.teach.apoi:
    title: بعد
    gloss: بعد
    note: دو قدم راهنمایی را در یک جمله وصل می‌کند -- راه طبیعی برای گفتن چند قدم باهم.
    example_gloss:
    - مستقیم بروید، بعد طرف راست.
  ro.a1.unit09.lesson03.teach.line01:
    title: سلام کردن و پرسیدن راه ایستگاه قطار
    gloss: Ana به Mihai سلام می‌کند و می‌پرسد چطور به ایستگاه قطار برسد.
    note: '*Cum pot să ajung* همین درس را با سلام درس ۱ یکجا می‌کند.'
  ro.a1.unit09.lesson03.teach.line02:
    title: دادن دو قدم راهنمایی
    gloss: Mihai می‌گوید مستقیم بروید، بعد طرف راست.
    note: '*Mergeți înainte* و *la dreapta* همین درس را دوباره به کار می‌برد و با *apoi* وصل می‌کند.'
  ro.a1.unit09.lesson03.teach.line03:
    title: پرسیدن اینکه نزدیک است یا نه
    gloss: Ana می‌پرسد ایستگاه قطار نزدیک است یا نه.
    note: یک پرسش کوتاه بعدی که *este*/*aproape* درس ۸ را دوباره به کار می‌برد.
  ro.a1.unit09.lesson03.teach.line04:
    title: تأیید کردن و نشان دادن جا
    gloss: Mihai تأیید می‌کند که نزدیک است و نشان می‌دهد که ایستگاه قطار آنجاست.
    note: '*aproape* و *acolo* -- فاصله و موقعیت -- را در یک جمله یکجا می‌کند.'
  ro.a1.unit09.lesson03.teach.line05:
    title: تشکر کردن و ختم کردن
    gloss: Ana از Mihai تشکر می‌کند و خداحافظی می‌کند.
    note: همان تشکر پایانی که در گفتگوهای درس ۱ و درس ۸ بود.
  ro.a1.unit09.lesson03.teach.line06:
    title: ختم دیدار
    gloss: Mihai هم خداحافظی می‌کند و نام Ana را می‌گیرد.
    note: همان الگوی دوستانهٔ پایان که گفتگوهای درس‌های ۱، ۵، ۶، ۷ و ۸ هم با آن ختم شدند.
