teaching:
  ro.a1.unit08.lesson01.teach.reminder_unde_este:
    title: 'یادآوری: unde, este'
    gloss: unde (کجا) · este (است)
    note: هر دو قبلاً آمده‌اند -- *unde* در *Unde pot să cumpăr ...?* واحد ۷ و *este* از واحد ۳ و واحد ۴ -- اینجا باهم سؤال اصلی این واحد دربارهٔ جا و مکان را می‌سازند.
  ro.a1.unit08.lesson01.teach.unde_este_phrase:
    title: کجاست...؟
    gloss: Unde este...? (کجاست...؟)
    note: راه معمول پرسیدن جای یک چیز -- نام آن جا را بعد از *este* بگویین، یا وقتی از موضوع صحبت معلوم است کدام جا مقصود است، همین‌طور تنها به کار ببرید.
  ro.a1.unit08.lesson01.teach.gara_magazin_banca:
    title: ایستگاه قطار، دوکان، بانک
    gloss: gară (ایستگاه قطار) · magazin (دوکان) · bancă (بانک)
    note: 'سه جای رایج -- وقتی از یک جای مشخص و معلوم صحبت می‌کنیم، هر سه حرف تعریف می‌گیرند: *gara*، *magazinul*، *banca*.'
    example_gloss:
    - ایستگاه قطار کجاست؟
    - دوکان نزدیک است.
    - بانک دور است.
  ro.a1.unit08.lesson01.teach.aproape_departe:
    title: نزدیک، دور
    gloss: aproape (نزدیک) · departe (دور)
    note: راه ساده برای گفتن نزدیکی یا دوری یک جا، بدون دادن آدرس دقیق.
    example_gloss:
    - دوکان نزدیک است.
    - بانک دور است.
  ro.a1.unit08.lesson01.teach.magazinul_aproape:
    title: دوکان نزدیک است
    gloss: Magazinul este aproape. (دوکان نزدیک است.)
    note: یک جملهٔ کوتاه و کامل -- وقتی معلوم است کدام جا مقصود است، بعد از *aproape* نام جا لازم نیست.
  ro.a1.unit08.lesson01.teach.banca_departe:
    title: بانک دور است
    gloss: Banca este departe. (بانک دور است.)
    note: ضد *aproape* -- با همان ساختار ساده.
  ro.a1.unit08.lesson01.teach.unde_este_gara:
    title: ایستگاه قطار کجاست؟
    gloss: Unde este gara? (ایستگاه قطار کجاست؟)
    note: '*Unde este...?* و *gara* را در یک سؤال کامل کنار هم می‌آورد.'
  ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie:
    title: شفاخانه، پُست‌خانه، کتابخانه، ایستگاه بس
    gloss: spital (شفاخانه) · poștă (پُست‌خانه) · bibliotecă (کتابخانه) · stație de autobuz (ایستگاه بس)
    note: 'چهار جای رایج دیگر -- مثل gară/magazin/bancă، برای یک جای مشخص حرف تعریف می‌گیرند: *spitalul*، *poșta*، *biblioteca*، *stația de autobuz*.'
    example_gloss:
    - شفاخانه روبه‌روی دوکان است.
    - پُست‌خانه میان دوکان و شفاخانه است.
    - کتابخانه نزدیک ایستگاه قطار است.
    - ایستگاه بس کنار کتابخانه است.
  ro.a1.unit08.lesson02.teach.langa_vizavi_intre:
    title: کنار، روبه‌روی، میان
    gloss: lângă (کنار) · vizavi de (روبه‌روی) · între (میان)
    note: سه راه برای نشان دادن جای یک چیز نسبت به جای دیگر. *Vizavi de* با *de* و *între* با *și* به جای دوم وصل می‌شود؛ *lângă* مستقیم وصل می‌شود.
    example_gloss:
    - دوکان کنار ایستگاه قطار است.
    - شفاخانه روبه‌روی دوکان است.
    - پُست‌خانه میان دوکان و شفاخانه است.
  ro.a1.unit08.lesson02.teach.magazinul_langa_gara:
    title: دوکان کنار ایستگاه قطار است
    gloss: Magazinul este lângă gară. (دوکان کنار ایستگاه قطار است.)
    note: '*Lângă* مستقیم به نام جا وصل می‌شود و کلمهٔ اضافی لازم ندارد.'
  ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin:
    title: شفاخانه روبه‌روی دوکان است
    gloss: Spitalul este vizavi de magazin. (شفاخانه روبه‌روی دوکان است.)
    note: '*Vizavi de* پیش از جای دوم *de* می‌خواهد.'
  ro.a1.unit08.lesson02.teach.posta_intre:
    title: پُست‌خانه میان دوکان و شفاخانه است
    gloss: Poșta este între magazin și spital. (پُست‌خانه میان دوکان و شفاخانه است.)
    note: '*Între* نام دو جا را می‌گیرد که با *și* (و) به هم وصل می‌شوند.'
  ro.a1.unit08.lesson02.teach.statia_langa_biblioteca:
    title: ایستگاه بس کنار کتابخانه است
    gloss: Stația de autobuz este lângă bibliotecă. (ایستگاه بس کنار کتابخانه است.)
    note: همان الگوی *lângă* مثل دوکان و ایستگاه قطار، این بار با ایستگاه بس و کتابخانه.
  ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'یادآوری: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (سلام) · mulțumesc (تشکر) · la revedere (خدا حافظ) · da (بلی) · Ana, Mihai (نام‌ها)
    note: همه در واحدهای قبلی آمده‌اند -- اینجا Ana و Mihai دوباره باهم روبه‌رو می‌شوند، این بار در محله.
  ro.a1.unit08.lesson03.teach.line01:
    title: سلام و پرسیدن جای پُست‌خانه
    gloss: Ana به Mihai سلام می‌دهد و می‌پرسد پُست‌خانه کجاست.
    note: '*Unde este* همین واحد را با سلام واحد ۱ یکجا می‌کند.'
  ro.a1.unit08.lesson03.teach.line02:
    title: دادن جای مکان
    gloss: Mihai می‌گوید پُست‌خانه میان دوکان و شفاخانه است.
    note: ساختار *poșta*/*între ... și* همین واحد را دوباره به کار می‌برد.
  ro.a1.unit08.lesson03.teach.line03:
    title: پرسیدن دربارهٔ کتابخانه
    gloss: Ana می‌پرسد که کتابخانه نزدیک است یا نه.
    note: یک سؤال کوتاه بعدی که *este* و *aproape* را دوباره به کار می‌برد.
  ro.a1.unit08.lesson03.teach.line04:
    title: تأیید کردن و گفتن چیز بیشتر
    gloss: Mihai تأیید می‌کند که کتابخانه نزدیک ایستگاه قطار است و می‌افزاید که ایستگاه بس کنار کتابخانه است.
    note: '*aproape de* و *lângă* را که هر دو حرف اضافهٔ همین واحد استند، در یک گفته یکجا می‌کند.'
  ro.a1.unit08.lesson03.teach.line05:
    title: تشکر و ختم صحبت
    gloss: Ana از Mihai تشکر می‌کند و خدا حافظی می‌کند.
    note: '*Mulțumesc* اینجا تشکر ساده برای ختم صحبت است، همان کلمه‌ای که در *Bine, mulțumesc.* واحد ۱ بود.'
  ro.a1.unit08.lesson03.teach.line06:
    title: ختم دیدار
    gloss: Mihai هم خدا حافظی می‌کند و نام Ana را می‌گوید.
    note: همان الگوی دوستانهٔ ختم صحبت که گفتگوهای واحد ۱، ۵، ۶ و ۷ هم با آن تمام شدند.
