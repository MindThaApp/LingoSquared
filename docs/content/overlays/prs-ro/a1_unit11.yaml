teaching:
  ro.a1.unit11.lesson01.teach.reminder_da_bine:
    title: 'یادآوری: da, bine, nu, mulțumesc'
    gloss: da (بلی) · bine (خوب) · nu (نه) · mulțumesc (تشکر)
    note: همهٔ این‌ها از درس ششم یاد گرفته شده‌اند — اینجا با هم می‌آیند تا راه قبول کردن یک برنامه را در این واحد بسازند، و در تمرین جور کردن لغت‌های این درس هم می‌آیند.
  ro.a1.unit11.lesson01.teach.mergem_vocab:
    title: برویم / می‌رویم
    gloss: Mergem (برویم / می‌رویم)
    note: شکل اول شخص جمع *a merge*؛ پیش‌تر *merg* («می‌روم»، درس دهم) و *mergeți* (امر رسمی، درس نهم) را دیده‌اید — همان فعل، با شخص و شمار دیگر. وقتی تنها و با آهنگ صدای بالا رونده گفته شود، راه طبیعی پیشنهاد کردن یک کار دسته‌جمعی است.
    example_gloss:
    - به سینما برویم؟
  ro.a1.unit11.lesson01.teach.cinema_vocab:
    title: سینما
    gloss: Cinema (سینما)
    note: این کلمه در دری هم تقریباً به همین شکل «سینما» است — شناختنش آسان است.
    example_gloss:
    - به سینما برویم؟
  ro.a1.unit11.lesson01.teach.mergem_cinema_phrase:
    title: به سینما برویم؟
    gloss: Mergem la cinema? (به سینما برویم؟)
    note: یک دعوت کامل — به عبارت «می‌خواهین» نیازی نیست؛ علامت سؤال به‌تنهایی «می‌رویم» را به پیشنهاد تبدیل می‌کند.
  ro.a1.unit11.lesson01.teach.parc_vocab:
    title: پارک
    gloss: Parc (پارک)
    note: مثل *cinema*، این هم کلمهٔ مشابه است که در دری هم همین‌طور گفته می‌شود.
    example_gloss:
    - به پارک برویم؟
  ro.a1.unit11.lesson01.teach.mergem_parc_phrase:
    title: به پارک برویم؟
    gloss: Mergem la parc? (به پارک برویم؟)
    note: همان الگوی دعوت *Mergem la cinema?*، فقط با جای دیگر.
  ro.a1.unit11.lesson01.teach.da_bine_phrase:
    title: بلی، خوب!
    gloss: Da, bine! (بلی، خوب!)
    note: راه کوتاه و طبیعی برای قبول کردن یک برنامه — لغت‌های آشنا در یک ترکیب تازه.
  ro.a1.unit11.lesson02.teach.reminder_nu_pot:
    title: 'یادآوری: nu, pot'
    gloss: nu (نه / نی) · pot (می‌توانم)
    note: '*Nu* از درس ششم و pot از درس نهم، در *cum pot să ajung* (چطور بروم)، آشنا است. وقتی nu پیش از فعل بیاید یعنی «نه»: *nu pot* یعنی «نمی‌توانم» — راه رد کردن یک برنامه در این واحد.'
  ro.a1.unit11.lesson02.teach.reminder_sambata_duminica:
    title: 'یادآوری: sâmbătă, duminică'
    gloss: sâmbătă (شنبه) · duminică (یکشنبه)
    note: هر دو در روزهای هفتهٔ درس سوم یاد گرفته شده‌اند.
  ro.a1.unit11.lesson02.teach.mergem_parc_sambata_phrase:
    title: شنبه به پارک برویم؟
    gloss: Mergem la parc sâmbătă? (شنبه به پارک برویم؟)
    note: همان دعوت درس اول، حالا با یک روز — *Mergem la parc?* با نام یک روز یکجا شده است.
  ro.a1.unit11.lesson02.teach.nu_pot_sambata_phrase:
    title: شنبه نمی‌توانم
    gloss: Nu pot sâmbătă. (شنبه نمی‌توانم.)
    note: یک رد کردن ساده — *nu pot* و روزی که نمی‌شود.
  ro.a1.unit11.lesson02.teach.atunci_vocab:
    title: پس / در آن صورت
    gloss: Atunci (پس / در آن صورت)
    note: با *apoi* («بعد» در درس نهم، برای ترتیب دو کار) فرق دارد — *atunci* گزینهٔ دیگری پیشنهاد می‌کند یا نتیجه می‌گیرد؛ کلمهٔ طبیعی برای «در این صورت چطور است...؟» وقتی وقت را عوض می‌کنین.
    example_gloss:
    - پس یکشنبه؟
  ro.a1.unit11.lesson02.teach.atunci_duminica_phrase:
    title: پس یکشنبه؟
    gloss: Atunci, duminică? (پس یکشنبه؟)
    note: یک پیشنهاد متقابل کوتاه بعد از رد کردن — گفتن روز تازه کافی است و لازم نیست تمام دعوت دوباره گفته شود.
  ro.a1.unit11.lesson02.teach.da_bine_duminica_phrase:
    title: بلی، خوب! یکشنبه.
    gloss: Da, bine! Duminică. (بلی، خوب! یکشنبه.)
    note: قبول کردن روز تازه، با همان الگوی کوتاه *Da, bine!* در درس اول.
  ro.a1.unit11.lesson03.teach.reminder_la_ce_ora_la_ora_patru:
    title: 'یادآوری: la ce oră, la ora, patru'
    gloss: la ce oră (ساعت چند) · la ora (ساعت ...) · patru (چهار)
    note: La ce oră و la ora در درس چهارم (پرسیدن و گفتن وقت) و patru در شمارهای درس دوم یاد گرفته شده‌اند — اینجا برای تعیین وقت دیدار با هم می‌آیند.
  ro.a1.unit11.lesson03.teach.reminder_buna_multumesc_la_revedere_da_ana_mihai:
    title: 'یادآوری: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (سلام) · mulțumesc (تشکر) · la revedere (خدا حافظ) · da (بلی) · Ana، Mihai (نام‌ها)
    note: همه در درس‌های پیشین یاد گرفته شده‌اند — اینجا انا و میهای برای برنامهٔ خود وقت تعیین می‌کنند.
  ro.a1.unit11.lesson03.teach.sigur_vocab:
    title: حتماً
    gloss: Sigur (حتماً)
    note: راه معمول و مستقل برای تأیید یک برنامه — مثل «حتماً!» یا «البته!» در دری.
    example_gloss:
    - حتماً! ساعت چهار.
  ro.a1.unit11.lesson03.teach.sigur_phrase:
    title: حتماً! ساعت چهار.
    gloss: Sigur! La ora patru. (حتماً! ساعت چهار.)
    note: هم برنامه و هم وقت دقیق را در یک جواب کوتاه تأیید می‌کند.
  ro.a1.unit11.lesson03.teach.line01:
    title: سلام و پیشنهاد پارک
    gloss: انا به میهای سلام می‌دهد و می‌پرسد که یکشنبه به پارک بروند یا نه.
    note: دعوت *Mergem la parc?* این واحد را با *duminică* یکجا می‌کند.
  ro.a1.unit11.lesson03.teach.line02:
    title: قبول کردن و پرسیدن وقت
    gloss: میهای قبول می‌کند و می‌پرسد ساعت چند.
    note: سؤال *La ce oră?* درس چهارم دوباره به کار می‌رود.
  ro.a1.unit11.lesson03.teach.line03:
    title: پیشنهاد وقت
    gloss: انا ساعت چهار را پیشنهاد می‌کند.
    note: یک سؤال کوتاه، با الگوی *la ora* درس چهارم و *patru* همین واحد.
  ro.a1.unit11.lesson03.teach.line04:
    title: تأیید و تشکر
    gloss: میهای با «حتماً!» تأیید می‌کند و از انا تشکر می‌کند.
    note: '*sigur* این واحد با *mulțumesc* آشنا یکجا می‌شود.'
  ro.a1.unit11.lesson03.teach.line05:
    title: خدا حافظی
    gloss: انا خدا حافظی می‌کند.
    note: همان الگوی پایانی که گفتگوی هر واحد پیشین با آن تمام شده است.
  ro.a1.unit11.lesson03.teach.line06:
    title: پایان دیدار
    gloss: میهای هم خدا حافظی می‌کند و نام انا را می‌گیرد.
    note: همان الگوی دوستانهٔ پایانی که گفتگوی هر واحد قبلی با آن تمام شده است.
