answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02/03''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: رومانیایی به دری A1
  description: 'چطور در رومانیایی وقت را بپرسیم و بگوییم: ساعت تمام، ساعت و نیم، ساعت و ربع و ربع کم، وقت‌های روز، و پرسیدن اینکه چیزی کی شروع می‌شود. آنا و میهای ادامه دارند و برای شروع صنف رومانیایی‌شان وقت تعیین می‌کنند.'
units:
  ro.a1.unit04.time:
    title: گفتن وقت
lessons:
  ro.a1.unit04.lesson01.ora_fixa_si_jumatate:
    title: ساعت تمام و ساعت و نیم
  ro.a1.unit04.lesson02.sferturi_si_intrebari:
    title: ربع، و چطور وقت را می‌پرسیم
  ro.a1.unit04.lesson03.cand_incepe_cursul:
    title: صنف کی شروع می‌شود؟
teaching:
  ro.a1.unit04.lesson01.teach.este:
    title: 'یادآوری: este'
    gloss: است / هست
    note: '*Este* قبلاً در واحد دوم و سوم آمده بود. چه عدد بگویین، چه روز، چه تاریخ و حالا چه وقت، همان کلمه می‌ماند و تغییر نمی‌کند.'
  ro.a1.unit04.lesson01.teach.ora:
    title: ساعت
    gloss: ساعت
    note: اسم مؤنث است؛ *ora* کلمه‌ای است که برای گفتن وقت ساعت، درست پیش از عدد می‌آید، مثلاً *ora unu* (ساعت یک).
    example_gloss: ساعت یک است.
  ro.a1.unit04.lesson01.teach.ora_unu:
    title: ساعت یک
    gloss: ساعت یک
    note: لفظاً «ساعتِ یک» -- اول ora می‌آید، بعد عدد.
  ro.a1.unit04.lesson01.teach.ora_doua:
    title: ساعت دو
    gloss: ساعت دو
    note: اینجا عدد شکل مؤنث خود را می‌گیرد، یعنی *două*، تا با *ora* که مؤنث است جور بیاید -- الگوی کامل را در کارت بعدی ببینین.
  ro.a1.unit04.lesson01.teach.ora_gender_note:
    title: 'یک بی‌قاعدگی واقعی: unu همان unu می‌ماند'
    gloss: ora unu (نه "ora una") / ora două (نه "ora doi")
    note: عددهایی که شکل مؤنث دارند معمولاً با اسم مؤنث همان شکل را می‌گیرند (*doi* ← *două* برای اسم مؤنثی مثل *ora*)، ولی *unu* در گفتن وقت تنها استثناست -- همیشه *ora unu* می‌گوییم، هرگز *ora una*، با وجودی که *ora* مؤنث است.
  ro.a1.unit04.lesson01.teach.ora_trei:
    title: ساعت سه
    gloss: ساعت سه
    note: Trei برخلاف unu/una یا doi/două با جنس تغییر نمی‌کند -- یک چیز کمتر برای یاد گرفتن.
  ro.a1.unit04.lesson01.teach.jumatate:
    title: نیم
    gloss: نیم
    note: 'با și (و) برای گفتن «نیم گذشته» به کار می‌رود: X și jumătate.'
    example_gloss: یک و نیم.
  ro.a1.unit04.lesson01.teach.ora_unu_jumatate:
    title: یک و نیم
    gloss: ساعت یک و نیم است.
    note: لفظاً «یک و نیم است» -- ساده و سرراست، بدون قاعدهٔ «نیمه‌راهِ ساعت بعدی» که در بعضی زبان‌ها هست.
  ro.a1.unit04.lesson01.teach.cat_e_ora:
    title: پرسیدن وقت
    gloss: ساعت چند است؟
    note: راه معمول پرسیدن وقت ساعت -- cât (چقدر، از خانوادهٔ câți در واحد ۲) + este + ora (ساعت).
  ro.a1.unit04.lesson02.teach.sfert:
    title: ربع
    gloss: ربع
    note: ربعِ ساعت -- ۱۵ دقیقه. با și (و) یا fără (بدون) می‌آید تا «یک ربع گذشته» یا «ربع کم» را نشان بدهد.
    example_gloss: یک و ربع است.
  ro.a1.unit04.lesson02.teach.sfert_rule:
    title: și در برابر fără با ربع یا نیم
    gloss: și un sfert = +15 دقیقه · fără un sfert = -15 دقیقه
    note: در دری هم «و» دقیقه‌ها را به ساعتِ گذشته اضافه می‌کند (یک و ربع) و «کم» از ساعتِ بعدی کم می‌کند (ربع کم سه)؛ در رومانیایی *și* و *fără* همین کار را می‌کنند.
  ro.a1.unit04.lesson02.teach.ora_doua_sfert:
    title: دو و ربع
    gloss: ساعت دو و ربع است.
    note: Ora două (۲:۰۰) به‌علاوهٔ și un sfert (+۱۵ دقیقه) = ۲:۱۵.
  ro.a1.unit04.lesson02.teach.fara:
    title: بدون / کم
    gloss: بدون / کم
    note: دقیقه‌ها را از ساعتِ بعدی به عقب می‌شمارد، همان نقشی که «کم» در «ربع کم سه» دارد.
    example_gloss: ربع کم سه است.
  ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert:
    title: ربع کم سه
    gloss: ربع کم سه است.
    note: Ora trei (۳:۰۰) منهای fără un sfert (-۱۵ دقیقه) = ۲:۴۵ -- در رومانیایی وقت را با ساعتی می‌گویند که به طرف آن می‌شمارند، نه ساعتی که تازه گذشته.
  ro.a1.unit04.lesson02.teach.la_ce_ora:
    title: پرسیدن از وقت
    gloss: ساعت چند؟
    note: La (در) + ce (چه) + oră (ساعت؛ اینجا شکل نامعرفه است، نه ora) -- راه معمول پرسیدن اینکه چیزی کی اتفاق می‌افتد.
  ro.a1.unit04.lesson02.teach.la_ora_noua:
    title: گفتن وقتِ یک رویداد
    gloss: ساعت نه.
    note: La (در) + ora (ساعت؛ اینجا شکل معرفه است) + عدد -- الگوی جواب به 'La ce oră?'.
  ro.a1.unit04.lesson02.teach.tarziu:
    title: دیر
    gloss: دیر
    note: کلمهٔ رایج و مفید برای واکنش وقتی ساعت را می‌بینین.
    example_gloss: دیر شده!
  ro.a1.unit04.lesson03.teach.cand:
    title: 'یادآوری: când'
    gloss: کی؟
    note: Când در واحد ۳ برای پرسیدن زمان یک رویداد آمده بود -- اینجا برای پرسیدن زمان شروع چیزی دوباره می‌آید.
  ro.a1.unit04.lesson03.teach.zi_parts:
    title: بخش‌های روز
    gloss: صبح / بعد از چاشت / شام / شب
    note: هر کدام شکل معرفهٔ اسم است که به‌صورت قید به کار می‌رود -- در رومانیایی برای گفتن «در صبح» هیچ حرف اضافه‌ای لازم نیست.
    example_gloss:
    - صنف صبح است.
    - صنف بعد از چاشت است.
    - Mihai شام کار می‌کند.
    - Ana شب می‌خوابد.
  ro.a1.unit04.lesson03.teach.cursul:
    title: صنف
    gloss: صنف
    note: شکل معرفهٔ curs (صنف یا کورس) -- اینجا صنف رومانیایی Ana و Mihai.
    example_gloss: صنف ساعت نه شروع می‌شود.
  ro.a1.unit04.lesson03.teach.incepe:
    title: شروع می‌شود
    gloss: شروع می‌شود
    note: شکل زمان حال برای «او» -- برای هر فاعل مفرد غیر از «من» و «تو»، مثل cursul (صنف).
    example_gloss: صنف صبح شروع می‌شود.
  ro.a1.unit04.lesson03.teach.cand_incepe_cursul:
    title: پرسیدن از وقت شروع صنف
    gloss: صنف کی شروع می‌شود؟
    note: când را با începe و cursul که در این درس تازه است یکجا می‌کند.
  ro.a1.unit04.lesson03.teach.raspuns_curs:
    title: گفتن وقت شروع صنف
    gloss: صنف ساعت نه صبح شروع می‌شود.
    note: قیدی مثل dimineața در آخر و با کاما می‌آید، همان‌طور که در واحد ۳ بعد از روز هفته تاریخ آمد.
  ro.a1.unit04.lesson03.teach.line01:
    title: پرسیدن از وقت شروع صنف
    gloss: Ana از Mihai می‌پرسد صنف کی شروع می‌شود.
    note: یک پرسش ساده و بی‌تکلف -- este و începe با tu یا dumneavoastră تغییر نمی‌کنند.
  ro.a1.unit04.lesson03.teach.line02:
    title: گفتن وقت
    gloss: Mihai می‌گوید صنف ساعت نه صبح شروع می‌شود.
    note: Mihai دقیقاً همین الگوی وقت و بخش روز را که در این درس خواندیم به کار می‌برد.
  ro.a1.unit04.lesson03.teach.line03:
    title: تأیید و ختم گفتگو
    gloss: Ana از او تشکر می‌کند و خدا حافظی می‌کند.
    note: La revedere که در واحد ۱ یاد گرفتیم، مثل همیشه گفتگو را ختم می‌کند.
  ro.a1.unit04.lesson03.teach.line04:
    title: ختم دیدار
    gloss: Mihai هم با گفتن نام Ana خدا حافظی می‌کند.
    note: تکرار la revedere همراه با نام طرف مقابل، راه طبیعی و دوستانه برای ختم گفتگوست.
