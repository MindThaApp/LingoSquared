teaching:
  en.b2.unit04.lesson01.teach.background:
    title: background
    gloss: خلفية
    note: '*background* هو ما كان جاريًا بالفعل أو ما يوفّر السياق. وفي الحكايات الإنجليزية تضع الخلفية غالبًا في past continuous.'
    example_gloss: تخبرنا معلومات الخلفية بما كان يجري أصلًا.
  en.b2.unit04.lesson01.teach.foreground:
    title: foreground
    gloss: الحدث الرئيسي
    note: '*foreground* هو الحدث الذي تتجه إليه القصة. استخدم له في الإنجليزية غالبًا simple past، وليس present perfect تلقائيًا.'
    example_gloss: الحدث الرئيسي هو أهم حدث في القصة.
  en.b2.unit04.lesson01.teach.prior:
    title: prior
    gloss: سابق، مسبق
    note: 'تعني *prior* أسبق من لحظة أخرى في الماضي. ويُعبَّر عنه غالبًا بـ past perfect: *had moved*.'
    example_gloss: الحدث السابق هو حدث وقع قبل حدث آخر في الماضي.
  en.b2.unit04.lesson01.teach.interrupt:
    title: interrupt
    gloss: قاطع
    note: تستخدم *interrupt* عندما يقتحم حدث قصير شيئًا كان جاريًا.
    example_gloss: قد تقاطع مشكلة مفاجئة عملًا ما.
  en.b2.unit04.lesson01.teach.ongoing:
    title: ongoing
    gloss: جارٍ، مستمر
    note: تدل *ongoing* على فعل جارٍ ومستمر. وفي الإنجليزية يُعبَّر عنه غالبًا بـ *was/were + -ing*.
    example_gloss: الفعل الجاري يستمر مدة من الزمن.
  en.b2.unit04.lesson01.teach.chronology:
    title: chronology
    gloss: التسلسل الزمني الفعلي
    note: '*chronology* هو الترتيب الحقيقي للأحداث، حتى لو رَوَتها القصة بترتيب آخر.'
    example_gloss: التسلسل الزمني هو الترتيب الحقيقي للأحداث.
  en.b2.unit04.lesson02.teach.by_the_time:
    title: أمر وقع قبل ذلك
    gloss: بحلول الوقت الذي وصلت فيه، كان المنسّق قد نقل المعدات إلى الداخل بالفعل.
    note: 'تدل *had already moved* على أن هذا حدث قبل *I arrived*. استخدم هنا past perfect: *had moved*، لا *has moved*.'
  en.b2.unit04.lesson02.teach.while_checking:
    title: فعل جارٍ ثم مقاطعة
    gloss: بينما كنت أفحص نظام الصوت، انقطع التيار الكهربائي.
    note: 'تعبّر *was checking* عن فعل كان جاريًا وقت المقاطعة. أما المقاطعة نفسها فبالماضي البسيط: *went out*.'
  en.b2.unit04.lesson02.teach.when_arrived_setting:
    title: الوصول أثناء فعل في الخلفية
    gloss: عندما وصلت، كان المتطوعون يرتّبون الكراسي.
    note: استخدم *were setting up* لما كان جاريًا عندما وقع الحدث الرئيسي.
  en.b2.unit04.lesson02.teach.grammar_shifted_time:
    title: طبقات الزمن في القصة
    gloss: استخدم past continuous للفعل في الخلفية، وsimple past للأحداث الرئيسية، وpast perfect لما وقع قبل لحظة أخرى في الماضي.
    note: 'في سرد الأحداث بالإنجليزية يُستخدم غالبًا simple past للحدث الرئيسي: *the power went out*، لا *has gone out*.'
  en.b2.unit04.lesson03.teach.venue:
    title: venue
    gloss: مكان الحدث، موقع
    note: '*venue* هو المكان الذي يقام فيه حدث ما.'
    example_gloss: مكان الحدث هو الموضع الذي يقام فيه الحدث.
  en.b2.unit04.lesson03.teach.delayed:
    title: delayed
    gloss: مؤجَّل، متأخر
    note: تعني *delayed* أن شيئًا بدأ أو وقع متأخرًا عما كان مخططًا.
    example_gloss: تأخر بدء الحدث عشرين دقيقة.
  en.b2.unit04.lesson03.teach.reading_passage:
    title: 'نص القراءة: مشكلة مكان الحدث'
    gloss: لم يروِ سايمون القصة بترتيبها الزمني الصارم. فقبل أن يصل إلى مكان الحدث، كان المنسّق قد نقل المعدات إلى الداخل لأن المطر كان متوقعًا. وعندما وصل سايمون، كان المتطوعون يرتّبون الكراسي. وبينما كان يفحص نظام الصوت، انقطع التيار الكهربائي. اتصل بمديرة المبنى، التي أوضحت أن طاقم صيانة كان يعمل في الجوار في وقت سابق من صباح ذلك اليوم. أجّل الفريق البدء عشرين دقيقة، لكن بحلول وقت دخول الضيوف كانت الأضواء قد عادت.
    note: 'انتبه إلى طبقات الزمن في الإنجليزية: *had moved* لما سبق، و*were setting up* للخلفية، و*went out* للحدث الرئيسي.'
  en.b2.unit04.lesson04.teach.q_walk_me_through:
    title: هاربر تطلب سرد القصة
    gloss: 'تسأل هاربر: هل يمكنك أن تشرح لي خطوة بخطوة ما حدث في مكان الحدث؟'
    note: تعني *walk me through* أن تأخذ شخصًا خطوة بخطوة عبر ما حدث.
  en.b2.unit04.lesson04.teach.a_arrived_volunteers:
    title: سايمون يجمع بين طبقات الزمن
    gloss: 'يقول سايمون: بالطبع. عندما وصلت، كان المتطوعون يرتّبون الكراسي، لكن المنسّق كان قد نقل المعدات إلى الداخل بالفعل لأن المطر كان متوقعًا.'
    note: القصة الجيدة تجمع بين فعل في الخلفية وحدث سابق.
  en.b2.unit04.lesson04.teach.q_equipment_safe:
    title: هاربر تتحقق من الترتيب
    gloss: 'تسأل هاربر: إذن كانت المعدات في أمان قبل وصولك إلى هناك؟'
    note: 'يدور السؤال حول الترتيب: كانت المعدات في أمان قبل وصول سايمون.'
  en.b2.unit04.lesson04.teach.a_power_went_out:
    title: سايمون يذكر المقاطعة
    gloss: 'يقول سايمون: بالضبط. ثم، بينما كنت أفحص نظام الصوت، انقطع التيار الكهربائي.'
    note: '*while I was checking* هو الفعل الجاري؛ و*the power went out* هو المقاطعة.'
  en.b2.unit04.lesson04.teach.q_after_that:
    title: هاربر تسأل عن الخطوة التالية
    gloss: 'تسأل هاربر: ماذا فعلت بعد ذلك؟'
    note: تستخدم *What did you do...?* الماضي البسيط مع *did* للسؤال عن خطوة انتهت.
  en.b2.unit04.lesson04.teach.a_repair_crew:
    title: سايمون يذكر خلفية سابقة
    gloss: 'يقول سايمون: اتصلت بمديرة المبنى، فأخبرتني أن طاقم صيانة كان يعمل في الجوار في وقت سابق من صباح ذلك اليوم.'
    note: تدل *had been working* على أن هذا العمل كان جاريًا في وقت أبكر من ذلك الصباح.
  en.b2.unit04.lesson04.teach.q_event:
    title: هاربر تسأل عن الحدث
    gloss: 'تسأل هاربر: وماذا عن الحدث؟'
    note: يسأل هذا السؤال القصير عن النتيجة بالنسبة إلى الحدث.
  en.b2.unit04.lesson04.teach.a_delayed_start:
    title: سايمون يختم
    gloss: 'يقول سايمون: أجّلنا البدء عشرين دقيقة، لكن بحلول وقت دخول الضيوف كانت الأضواء قد عادت.'
    note: وقع ما تدل عليه *had come back on* قبل لحظة دخول الضيوف.
