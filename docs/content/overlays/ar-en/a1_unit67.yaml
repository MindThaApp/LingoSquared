    gloss: 'أخبار عائلية سارة: سألت Mia صديقها Daniel عن عائلته. قال Daniel إنهم بخير. ثم شاركها خبرًا سارًا: أخته رُزقت برضيع. قالت Mia إن الخبر رائع. قال Daniel إنه وعائلته سيزورونهم قريبًا. كان فخورًا بأخته. وفي وقت لاحق أرسلت Mia رسالة قصيرة: أنا سعيدة لعائلتك.'
    note: '*shared good news* تعني «شارك أخبارًا سارة».'
