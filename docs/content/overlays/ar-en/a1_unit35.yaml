teaching:
  en.a1.unit35.lesson01.teach.phone:
    title: phone
    gloss: هاتف
    note: '*phone* تعني «هاتف».'
    example_gloss: أتصل بأمي بهاتفي.
  en.a1.unit35.lesson01.teach.laptop:
    title: laptop
    gloss: حاسوب محمول
    note: '*laptop* تعني «حاسوب محمول».'
    example_gloss: هي تستخدم حاسوبها المحمول في العمل.
  en.a1.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: جهاز لوحي
    note: '*tablet* تعني «جهاز لوحي».'
    example_gloss: هو يقرأ الكتب على جهازه اللوحي.
  en.a1.unit35.lesson01.teach.computer:
    title: computer
    gloss: حاسوب
    note: '*computer* تعني «حاسوب».'
    example_gloss: عندنا حاسوب في البيت.
  en.a1.unit35.lesson01.teach.app:
    title: app
    gloss: تطبيق
    note: '*app* تعني «تطبيق».'
    example_gloss: عندي تطبيق جديد على هاتفي.
  en.a1.unit35.lesson01.teach.camera:
    title: camera
    gloss: كاميرا
    note: '*camera* تعني «كاميرا».'
    example_gloss: تلتقط هذه الكاميرا صورًا رائعة.
  en.a1.unit35.lesson02.teach.make_a_call:
    title: make a call
    gloss: يتصل
    note: '*make a call* تركيب ثابت من فعل + اسم عليك حفظه كاملًا. في العربية نقول «يتصل» بفعل واحد، أما الإنجليزية فتستخدم *make* مع الاسم *call*.'
    example_gloss: أتصل بأخي كل أحد.
  en.a1.unit35.lesson02.teach.send_a_text:
    title: send a text
    gloss: يرسل رسالة نصية
    note: '*send a text* تركيب ثابت من فعل + اسم، مثل *make a call*. في العربية نقول «يراسل» أو «يرسل رسالة»، وفي الإنجليزية تقول عادةً *send a text*.'
    example_gloss: ترسل رسالة نصية إلى صديقتها كل صباح.
  en.a1.unit35.lesson02.teach.download_an_app:
    title: download an app
    gloss: يحمّل تطبيقًا
    note: '*download an app*: الفعل *download* هنا يشبه الفعل العربي «يحمّل»، لذا هذا أسهل التراكيب الثلاثة.'
    example_gloss: يحمّل تطبيقًا جديدًا كل أسبوع.
  en.a1.unit35.lesson02.teach.wifi:
    title: wifi
    gloss: واي فاي
    note: '*wifi* تعني «واي فاي».'
    example_gloss: الواي فاي في بيتي سريع.
  en.a1.unit35.lesson02.teach.battery:
    title: battery
    gloss: بطارية
    note: '*battery* تعني «بطارية».'
    example_gloss: بطارية هاتفي شبه فارغة.
  en.a1.unit35.lesson02.teach.how_use_phone_question:
    title: How do you use your phone?
    gloss: كيف تستخدم هاتفك؟
    note: '*Do you use ...?* يستخدم الفعل المساعد نفسه الموجود في أسئلة إنجليزية أخرى.'
  en.a1.unit35.lesson03.teach.dialogue_line1:
    title: شكوى ميا
    gloss: 'تقول ميا: هاتفي قديم جدًا. إنه بطيء فعلًا.'
    note: '*so* + صفة (*so old*) تقوّي المعنى، مثل «جدًا» في العربية.'
  en.a1.unit35.lesson03.teach.dialogue_line2:
    title: نصيحة ليلى
    gloss: 'تقول ليلى: عليك أن تشتري هاتفًا جديدًا. لأي شيء تستخدمينه في الغالب؟'
    note: ينتهي السؤال *What do you use it for most?* بحرف الجر *for*. في العربية يأتي حرف الجر قبل ما يتعلق به («لأي شيء»)، أما في الإنجليزية فتبدأ بـ*what* ويبقى *for* في نهاية الجملة.
  en.a1.unit35.lesson03.teach.dialogue_line3:
    title: "إجابة ميا"
    gloss: 'تقول ميا: أراسل أختي في الغالب وألتقط الصور.'
    note: يمكن استخدام *text* فعلًا أيضًا (*I text my sister*). وهو أكثر شيوعًا من *send a text*؛ وكلاهما إنجليزية صحيحة.
  en.a1.unit35.lesson03.teach.dialogue_line4:
    title: استخدام ليلى
    gloss: 'تقول ليلى: أستخدم هاتفي للاتصال بوالديّ كل عطلة أسبوع. وأستخدم أيضًا تطبيقات كثيرة.'
    note: '*call* فعلًا (*I call my parents*) هي الطريقة العادية غير الرسمية. أما *Make a call* فهو التركيب الثابت من الدرس الثاني.'
  en.a1.unit35.lesson03.teach.dialogue_line5:
    title: سؤال ميا
    gloss: 'تسأل ميا: أي تطبيقات تستخدمين؟'
    note: '*Which apps do you use?*: تسأل *which* عن اختيار من مجموعة (التطبيقات)، مثل «أي» في العربية.'
  en.a1.unit35.lesson03.teach.dialogue_line6:
    title: تطبيقات ليلى
    gloss: 'تقول ليلى: أستخدم تطبيق طبخ وتطبيق خرائط. هل تريدين تحميلهما؟'
    note: '*Do you want to ...?* يستخدم الفعل المساعد *do* حتى مع أن *want* فعل عادي.'
  en.a1.unit35.lesson03.teach.dialogue_line7:
    title: "إجابة ميا"
    gloss: 'تقول ميا: نعم من فضلك، أرسلي لي الأسماء!'
    note: '*please* تأتي هنا قبل الفعل (*please send ...*) وتجعل الطلب أكثر تهذيبًا.'
  en.a1.unit35.lesson04.teach.reading_passage:
    title: نص عن دانيال وليلى وميا
    gloss: يستخدم دانيال وليلى وميا هواتفهم بطرق مختلفة. لا يحب دانيال المراسلة النصية؛ ويفضّل الاتصال بالناس. تستخدم ليلى هاتفها للخرائط. وتستخدم أيضًا تطبيق طبخ عندما تجرب وصفات جديدة. تلتقط ميا صورًا كثيرة وترسلها إلى عائلتها. ويستخدمون جميعًا الحاسوب المحمول في العمل، ويتحدثون مع الأصدقاء بالفيديو في عطلة نهاية الأسبوع.
    note: '*He prefers to call people instead*: تأتي *instead* في نهاية الجملة وتعني «بدلًا من ذلك» (أي بدلًا من المراسلة النصية).'
