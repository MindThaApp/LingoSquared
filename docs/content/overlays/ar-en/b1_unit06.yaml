teaching:
  en.b1.unit06.lesson01.teach.while:
    title: while
    gloss: بينما، أثناء
    note: '*while* تعني أن شيئًا يحدث في الوقت نفسه الذي يحدث فيه شيء آخر.'
    example_gloss: بينما كنت أقود، بدأ المطر يهطل.
  en.b1.unit06.lesson01.teach.flat_tire:
    title: flat tire
    gloss: إطار مثقوب
    note: '*flat tire* تعني إطارًا فرغ من الهواء ولم يعد صالحًا للاستعمال.'
    example_gloss: ثُقب إطار سيارتي على الطريق السريع.
  en.b1.unit06.lesson01.teach.pull_over:
    title: pull over
    gloss: أوقف السيارة على جانب الطريق
    note: '*pull over* تعني أن توقف السيارة على جانب الطريق.'
    example_gloss: اضطررت إلى أن أوقف السيارة على جانب الطريق فورًا.
  en.b1.unit06.lesson01.teach.stranger:
    title: stranger
    gloss: غريب، شخص لا أعرفه
    note: '*stranger* تعني شخصًا لا تعرفه.'
    example_gloss: توقف غريب ليساعدني.
  en.b1.unit06.lesson01.teach.mechanic:
    title: mechanic
    gloss: ميكانيكي
    note: '*mechanic* تعني شخصًا يصلح السيارات.'
    example_gloss: أصلح الميكانيكي إطاري بسرعة.
  en.b1.unit06.lesson01.teach.said_that:
    title: said that
    gloss: قال إنّ
    note: '*said that* نستعملها لننقل ما قاله شخص آخر.'
    example_gloss: قال إنه يستطيع المساعدة.
  en.b1.unit06.lesson02.teach.while_driving_tire_went_flat:
    title: Hintergrundgeschehen mit 'while'
    gloss: بينما كنت أقود إلى العمل، ثُقب إطار سيارتي.
    note: تصف *while* مع الماضي المكوّن من *was/were* و-ing الأمر الجاري في الخلفية، ثم يقطعه حدث آخر.
  en.b1.unit06.lesson02.teach.when_pulled_over_stranger_helped:
    title: Folgendes Ereignis mit 'when'
    gloss: عندما أوقفت السيارة على جانب الطريق، توقف غريب ليساعد.
    note: تقدّم *when* الحدث التالي في القصة.
  en.b1.unit06.lesson02.teach.grammar_while_when_sequencing:
    title: '''while'' und ''when'' in einer Geschichte'
    gloss: بينما كنت أقود، ثُقب إطار سيارتي. وعندما أوقفت السيارة على جانب الطريق، ساعدني غريب.
    note: تشير *while* إلى الخلفية (فعل مستمر)، أما *when* فتشير إلى الحدث التالي الأقصر الذي يقع خلاله.
  en.b1.unit06.lesson03.teach.had_already_called:
    title: had already called
    gloss: كنت قد اتصلت بالفعل
    note: تصف *had already* مع التصريف الثالث للفعل أمرًا كان قد حدث بالفعل قبل لحظة أخرى في الماضي.
    example_gloss: عندما وصل، كنت قد اتصلت بدانيال بالفعل.
  en.b1.unit06.lesson03.teach.kept_his_word:
    title: kept his word
    gloss: وفى بوعده
    note: '*kept his word* تعني أن شخصًا فعل ما وعد به.'
    example_gloss: وفى بوعده وأصلحه في عشر دقائق.
  en.b1.unit06.lesson03.teach.reading_passage:
    title: 'Lesetext: die Geschichte vom Platten'
    gloss: صباح أمس، بينما كانت ليلى تقود إلى العمل، ثُقب إطار سيارتها فجأة. أوقفت سيارتها على جانب شارع هادئ. توقف غريب بسيارته وعرض المساعدة. وعندما وصل الميكانيكي، كانت ليلى قد اتصلت بدانيال لتخبره بأنها ستتأخر. قال الميكانيكي إنه يستطيع إصلاح الإطار في عشر دقائق. وقد وفى بوعده، ووصلت ليلى إلى العمل متأخرة عشرين دقيقة فقط.
    note: قصة في الماضي فيها أمر جارٍ في الخلفية (*while*)، وتسلسل زمني (*when*)، وشيء كان قد حدث من قبل (*had already*).
  en.b1.unit06.lesson04.teach.q_youre_late_what_happened:
    title: Daniel bemerkt, dass Leila zu spät ist
    gloss: 'يقول دانيال: لقد تأخرتِ! ماذا حدث؟'
    note: سؤال مباشر وقلق تبدأ به القصة.
  en.b1.unit06.lesson04.teach.a_tire_went_flat_suddenly:
    title: Leila beginnt ihre Geschichte
    gloss: 'تقول ليلى: بينما كنت أقود إلى العمل، ثُقب إطار سيارتي فجأة.'
    note: تشير *while* إلى الخلفية التي وقع فيها حدث آخر.
  en.b1.unit06.lesson04.teach.q_oh_no_what_did_you_do:
    title: Daniel fragt nach
    gloss: 'يقول دانيال: يا إلهي! ماذا فعلتِ؟'
    note: سؤال قصير لمعرفة المزيد من القصة.
  en.b1.unit06.lesson04.teach.a_pulled_over_stranger_helped:
    title: Leila erzählt weiter
    gloss: 'تقول ليلى: أوقفت السيارة على جانب الطريق، وتوقف غريب ليساعدني.'
    note: الحدث التالي في القصة، بعد الأمر الجاري في الخلفية.
  en.b1.unit06.lesson04.teach.q_kind_of_him_call_mechanic:
    title: Daniel reagiert und fragt weiter
    gloss: 'يقول دانيال: كان ذلك لطفًا منه. هل اتصلتِ بميكانيكي؟'
    note: '*that was kind of him* ردّ فعل طبيعي على لطف شخص ما.'
  en.b1.unit06.lesson04.teach.a_had_already_called_mechanic_said:
    title: Leila beendet die Geschichte
    gloss: 'تقول ليلى: نعم، كنت قد اتصلت بواحد قبل أن يصل الغريب. وقال الميكانيكي إنه يستطيع إصلاحه في عشر دقائق، وقد فعل ذلك!'
    note: تبيّن *had already called* ما كان قد حدث قبل وصول الغريب.
