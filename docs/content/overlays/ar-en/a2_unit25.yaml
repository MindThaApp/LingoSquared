    note: تعني *confirmation number* الرقم الذي يؤكد موعدك.
    example_gloss: رقم التأكيد الخاص بك هو 4471.
  en.a2.unit25.lesson02.teach.i_was_wondering_whether:
    title: I was wondering whether I could make an appointment.
    gloss: كنت أودّ أن أسأل هل يمكنني حجز موعد.
    note: '*I was wondering whether...* طريقة مهذبة ورسمية للسؤال عن شيء.'
  en.a2.unit25.lesson02.teach.would_it_be_possible:
    title: Would it be possible to come this Friday?
    gloss: هل يمكنني الحضور يوم الجمعة هذا؟
    note: '*Would it be possible...?* طلب مهذب جدًا.'
  en.a2.unit25.lesson02.teach.because_i_moved:
    title: I need to update my address because I moved last month.
    gloss: أحتاج إلى تحديث عنواني لأنني انتقلت إلى سكن جديد الشهر الماضي.
    note: تُستخدم *because* لتقديم جملة تذكر السبب.
  en.a2.unit25.lesson03.teach.photo_id:
    title: photo ID
    gloss: بطاقة هوية بصورة
    note: تعني *photo ID* بطاقة هوية تحمل صورة، مثل بطاقة الهوية الوطنية أو رخصة القيادة.
    example_gloss: ستحتاج إلى بطاقة هوية بصورة وإثبات واحد لمحل الإقامة.
  en.a2.unit25.lesson03.teach.utility_bill:
    title: utility bill
    gloss: فاتورة الكهرباء أو المياه
    note: تعني *utility bill* فاتورة الكهرباء أو الغاز أو المياه.
    example_gloss: فاتورة الكهرباء مثال شائع على إثبات محل الإقامة.
  en.a2.unit25.lesson03.teach.notice_text:
    title: Text des Hinweises
    gloss: لتحديث عنوانك، أحضِر من فضلك بطاقة هوية بصورة وإثباتًا واحدًا لمحل الإقامة، مثل فاتورة الكهرباء. وإن لم تكن لديك فاتورة كهرباء، فيمكنك إحضار عقد الإيجار.
    note: 'إشعار رسمي: يذكر ما يجب إحضاره وما يمكنك إحضاره بدلًا منه.'
  en.a2.unit25.lesson03.teach.i_will_bring:
    title: I will bring a photo ID.
    gloss: سأحضر بطاقة هوية بصورة.
    note: تُستخدم *will* للتعبير عما سنفعله (المستقبل).
  en.a2.unit25.lesson04.teach.could_you_tell_me:
    title: Could you tell me what I need to bring?
    gloss: هل يمكنك أن تخبرني بما يجب أن أحضره؟
    note: '*Could you tell me...?* سؤال غير مباشر مهذب. بعد *what* يأتي ترتيب الجملة الاعتيادي: *what I need to bring*.'
  en.a2.unit25.lesson04.teach.q_since_when:
    title: Fragen, wie lange
    gloss: 'يسأل الموظف: منذ متى تسكن في العنوان الجديد؟'
    note: 'تسأل *How long have you lived...?* عن مدة أمر ما زال مستمرًا. نستخدم في الإنجليزية لذلك المضارع التام (*have lived*)، بينما نقول في العربية «منذ متى تسكن...؟» بالفعل المضارع. ويمكن أن تبدأ الإجابة بـ *since*: *Since last month.*'
  en.a2.unit25.lesson04.teach.a_since_last_month:
    title: Daniels Antwort
    gloss: 'يقول دانيال: منذ الشهر الماضي.'
    note: تعني *Since last month* «منذ الشهر الماضي». وتكفي هنا إجابة قصيرة.
  en.a2.unit25.lesson04.teach.q_would_it_be_possible:
    title: Nach einem Termin fragen
    gloss: 'يسأل دانيال: هل يمكنني الحضور يوم الجمعة هذا؟'
    note: السؤال نفسه الذي ورد في الدرس الثاني.
  en.a2.unit25.lesson04.teach.a_friday_works_confirmation:
    title: Antwort des Sachbearbeiters
    gloss: 'يقول الموظف: نعم، يوم الجمعة الساعة 10 صباحًا مناسب. رقم التأكيد الخاص بك هو 4471.'
    note: يؤكد الموظف الساعة ويذكر رقم التأكيد.
