    gloss: إثبات محل الإقامة
    note: تعني *proof of residency* مستندًا يبيّن أين تسكن.
    example_gloss: يمكن استخدام فاتورة الكهرباء لإثبات محل الإقامة.
  en.a2.unit25.lesson01.teach.form:
    title: form
    gloss: استمارة
    note: تعني *form* استمارة تقوم بتعبئتها.
    example_gloss: عبّئ هذه الاستمارة من فضلك قبل موعدك.
  en.a2.unit25.lesson01.teach.confirmation_number:
