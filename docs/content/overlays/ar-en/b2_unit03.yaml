teaching:
  en.b2.unit03.lesson01.teach.hedge:
    title: hedge
    gloss: صاغ بتحفظ (لتخفيف حدة العبارة)
    note: تعني *hedge* أن تجعل عبارتك أقل إطلاقًا. ولتخفيف حدة العبارة لا تكتفِ بـ *a little*، بل استخدم أيضًا *seems* أو *to some extent*.
    example_gloss: تستخدم ليلى *seems* لتخفف حدة ادّعائها بشأن السياسة.
  en.b2.unit03.lesson01.teach.qualify:
    title: qualify
    gloss: قيّد أو أضاف تحفظًا
    note: تعني *qualify* أن تقيّد عبارة بشرط أو استثناء.
    example_gloss: تقيّد عبارة 'provided we agree' دعم ليلى.
  en.b2.unit03.lesson01.teach.emphasize:
    title: emphasize
    gloss: شدّد على
    note: تعني *emphasize* أن تجعل جزءًا من رسالتك أقوى.
    example_gloss: يشدّد دانيال على مشكلة عبء العمل.
  en.b2.unit03.lesson01.teach.to_some_extent:
    title: to some extent
    gloss: إلى حدٍّ ما
    note: تبدو *to some extent* غالبًا أكثر طبيعية من استخدام *a little* في كل موضع.
    example_gloss: إلى حدٍّ ما، تستجيب السياسة لمخاوف الفريق.
  en.b2.unit03.lesson01.teach.broadly:
    title: broadly
    gloss: في الخطوط العريضة
    note: تدل *broadly* على دعم عام أو حقيقة عامة، مع ترك مجال للاستثناءات.
    example_gloss: الاقتراح مفيد في الخطوط العريضة، وإن لم يكن مثاليًا.
  en.b2.unit03.lesson01.teach.provided:
    title: provided
    gloss: شريطة أن، بشرط أن
    note: تقدّم *provided* شرطًا. وهي تشبه «شريطة أن» العربية، وتبدو في الإنجليزية رسمية ومهنية غالبًا.
    example_gloss: يمكننا دعم السياسة، شريطة أن نتفق.
  en.b2.unit03.lesson02.teach.seems_but_does:
    title: الحذر مع التوكيد
    gloss: تبدو السياسة معقولة، لكنها تخلق فعلًا عملًا إضافيًا للفريق.
    note: تجعل *seems* العبارة الإيجابية أكثر حذرًا؛ وتؤكد *does create* أن العمل الإضافي ينشأ فعلًا. وفي العربية نؤكد ذلك بكلمة مثل «فعلًا» أو «بالفعل».
  en.b2.unit03.lesson02.teach.what_worries_me:
    title: التركيز على مصدر قلق
    gloss: ما يقلقني هو العمل الإضافي على الفريق.
    note: 'تضع *What worries me is...* نقطة في المقدمة لتركّز عليها. وبعدها حافظ على الترتيب الإنجليزي: *is the extra work*.'
  en.b2.unit03.lesson02.teach.broadly_provided:
    title: دعم عام مع شرط
    gloss: إنها مفيدة في الخطوط العريضة، شريطة تعديل الجدول الزمني.
    note: تقدّم *broadly useful, provided...* دعمًا مع شرط واضح.
  en.b2.unit03.lesson02.teach.grammar_stance:
    title: التحفظ والتوكيد
    gloss: استخدم seems أو broadly أو to some extent لتخفيف حدة عبارة أو تقييدها. واستخدم do أو does قبل الفعل الرئيسي لتأكيد أن أمرًا ما صحيح. واستخدم What matters is... أو What worries me is... لتوجيه الانتباه إلى نقطة واحدة.
    note: 'ملاحظة: أبرز ما يستحق الانتباه هو *does create*. فهي لا تعني «يفعل الخلق»، بل تمنح *create* توكيدًا، كما تفعل كلمة «بالفعل» في العربية.'
  en.b2.unit03.lesson03.teach.overall:
    title: overall
    gloss: بالنظر إلى الصورة كاملة
    note: تنظر *overall* إلى الصورة العامة، حتى لو كانت هناك تفاصيل أو استثناءات.
    example_gloss: بالنظر إلى الصورة كاملة، تدعم ليلى السياسة.
  en.b2.unit03.lesson03.teach.condition:
    title: condition
    gloss: شرط
    note: '*condition* أمر يجب تحقيقه قبل أن يسري شيء آخر.'
    example_gloss: شرطها هو أن يُعدَّل الجدول الزمني.
  en.b2.unit03.lesson03.teach.reading_passage:
    title: 'نص القراءة: دعم مشروط'
    gloss: 'تعليق ليلى إيجابي، لكنه مقيّد بعناية. تقول إن سياسة المراجعة تبدو معقولة في المجمل، وهذا يخفف حدة الادّعاء ويجنّبها أن تبدو مطلقة. وتقول أيضًا إنها مفيدة في الخطوط العريضة، شريطة تعديل الجدول الزمني. وهذا الشرط يقيّد دعمها: فهي لا تقبل السياسة تمامًا كما كُتبت. أما دانيال فيشدّد على نقطة أخرى بتركيب يركّز الانتباه: ما يقلقه هو العمل الإضافي على الفريق. كلاهما يؤيد السياسة من حيث المبدأ، لكن لغتهما تُظهر درجتين مختلفتين من الالتزام.'
    note: يُظهر النص كيف تجعل المحتوى الأساسي نفسه أخف أو أقوى أو أكثر اشتراطًا.
  en.b2.unit03.lesson04.teach.q_policy_seems:
    title: ليلى تصوغ رأيها بحذر
    gloss: 'تقول ليلى: تبدو سياسة المراجعة الجديدة معقولة في المجمل.'
    note: تبدو *seems reasonable overall* أكثر إيجابية من النقد، لكنها ليست مطلقة.
  en.b2.unit03.lesson04.teach.a_not_fully_ready:
    title: دانيال يلاحظ الحذر
    gloss: 'يقول دانيال: يبدو هذا حذرًا بعض الشيء. هل تقصدين أنها ليست جاهزة تمامًا؟'
    note: يلاحظ دانيال أن ليلى لا تقول ببساطة *it is ready*.
  en.b2.unit03.lesson04.teach.q_workable_deadlines:
    title: ليلى تضيف مزيدًا من التحفظ
    gloss: 'تقول ليلى: بالضبط. قد تكون قابلة للتطبيق، لكنها تحتاج إلى مواعيد نهائية أوضح.'
    note: تترك *may be workable* مجالًا للشك؛ وتذكر *but* القيد.
  en.b2.unit03.lesson04.teach.a_what_worries:
    title: دانيال يركّز على نقطة
    gloss: 'يقول دانيال: أتفق معك. ما يقلقني هو العمل الإضافي على الفريق.'
    note: تركّز *What worries me is...* على مصدر قلق.
  en.b2.unit03.lesson04.teach.q_does_create_checks:
    title: ليلى تؤكد باستخدام does
    gloss: 'تقول ليلى: هذا عادل. السياسة توفّر فعلًا فحوصات جودة أفضل، لكنها تضيف أيضًا خطوة موافقة أخرى.'
    note: تؤكد *does create* أن هذه الفائدة موجودة فعلًا، رغم القيد الذي يأتي بعدها.
  en.b2.unit03.lesson04.teach.a_support_conditions:
    title: دانيال يلخّص الشرط
    gloss: 'يقول دانيال: إذن ينبغي أن ندعمها بشروط؟'
    note: يلخّص دعم ليلى المقيّد.
  en.b2.unit03.lesson04.teach.q_broadly_useful:
    title: ليلى تقدّم دعمًا مشروطًا
    gloss: 'تقول ليلى: نعم. أقول إنها مفيدة في الخطوط العريضة، شريطة تعديل الجدول الزمني.'
    note: 'تعني *provided* هنا «شريطة أن»: لا يسري الدعم إلا إذا تحقق الشرط.'
  en.b2.unit03.lesson04.teach.same_content_triad:
    title: المضمون نفسه بثلاث درجات
    gloss: السياسة تخلق عملًا إضافيًا. يبدو أن السياسة تخلق عملًا إضافيًا. السياسة تخلق فعلًا عملًا إضافيًا.
    note: تتدرب الجمل الثلاث على الصيغة المحايدة، والأكثر حذرًا بـ *seems to*، والأكثر توكيدًا بـ *does*.
