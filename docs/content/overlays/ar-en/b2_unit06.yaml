teaching:
  en.b2.unit06.lesson01.teach.value:
    title: value
    gloss: قيمة، مبدأ
    note: '*value* تعني هنا مبدأً يراه الناس مهمًا، لا القيمة المالية فقط.'
    example_gloss: الإنصاف قيمة.
  en.b2.unit06.lesson01.teach.fairness:
    title: fairness
    gloss: العدل، الإنصاف
    note: '*fairness* تتعلق بمعاملة الناس معاملة معقولة. وهي أقوى وأكثر تجريدًا من *nice* وحدها.'
    example_gloss: الإنصاف يعني أن تعامل الناس معاملة معقولة.
  en.b2.unit06.lesson01.teach.convenience:
    title: convenience
    gloss: الراحة، النفع العملي
    note: '*convenience* تعني الراحة وسهولة الاستعمال العملية. لا تترجم «سهولة» حرفيًا إلى *easiness* في سياق B2 هذا.'
    example_gloss: الراحة تجعل الحياة اليومية أيسر.
  en.b2.unit06.lesson01.teach.flexibility:
    title: flexibility
    gloss: مرونة
    note: '*flexibility* هي القدرة على التكيّف عندما تتغيّر الظروف.'
    example_gloss: المرونة تتيح التغيير عندما تتغيّر الظروف.
  en.b2.unit06.lesson01.teach.qualify:
    title: qualify
    gloss: تقييد الرأي وتخفيف إطلاقه
    note: '*qualify* تعني هنا أن تقيّد رأيك أو تضع عليه تحفظات. ولا تعني هنا الحصول على شهادة.'
    example_gloss: يمكنك تقييد رأيك بوضع حدود له.
  en.b2.unit06.lesson01.teach.prioritize:
    title: prioritize
    gloss: يعطي الأولوية لـ
    note: '*prioritize fairness* تعني أنك تجعل الإنصاف أهم من قيمة أخرى.'
    example_gloss: إعطاء الأولوية للإنصاف يعني أنك تراه أهم من غيره.
  en.b2.unit06.lesson02.teach.in_principle:
    title: الموازنة بين القيم
    gloss: من حيث المبدأ، الراحة مهمة، لكن الإنصاف ينبغي أن يكون له وزن أكبر.
    note: '*In principle* تعني هنا «من حيث المبدأ». لا تظن أنها تشبه *eventually*؛ فهذه الكلمة تعني «في النهاية» وليس «ربما» أو «عند الاقتضاء».'
  en.b2.unit06.lesson02.teach.not_arguing_everywhere:
    title: تقييد موقفك
    gloss: أنا لا أدعو إلى الصمت في كل مكان.
    note: '*I am not arguing for...* تحدّ من أطروحتك. وهي أفضل من صياغة غامضة منقولة حرفيًا باستخدام *a little*.'
  en.b2.unit06.lesson02.teach.respond_opposing:
    title: الرد مباشرة على الطرف الآخر
    gloss: هذا رأي وجيه، وأوافق على أن الشركات تحتاج إلى مرونة.
    note: '*That is fair* تعترف بالنقطة دون أن تتخلى عن قيمتك.'
  en.b2.unit06.lesson02.teach.grammar_abstract_response:
    title: بناء رأي مجرّد
    gloss: الرأي المجرّد القوي يسمّي قيمة، ويقيّد الأطروحة، ويرد مباشرة على وجهة نظر الطرف الآخر.
    note: استخدم كلمات دقيقة من المستوى B2 مثل *in principle* و*fairness* و*carry more weight*، ولا تكتفِ بتكرار *a bit* للتخفيف.
  en.b2.unit06.lesson03.teach.transparent:
    title: transparent
    gloss: شفّاف، واضح وسهل الفهم
    note: '*transparent rules* قواعد يسهل فهمها ومراقبتها.'
    example_gloss: القواعد الشفافة سهلة الفهم.
  en.b2.unit06.lesson03.teach.commercial:
    title: commercial
    gloss: تجاري
    note: '*commercial activity* نشاط يتعلق بالشركات والربح.'
    example_gloss: النشاط التجاري مرتبط بالشركات.
  en.b2.unit06.lesson03.teach.reading_passage:
    title: 'نص القراءة: الأماكن العامة الهادئة'
    gloss: 'ترى أمارا أنه ينبغي حماية الأماكن العامة الهادئة، حتى لو قيّد ذلك بعض النشاط التجاري. رأيها ليس مطلقًا: فهي لا تدعو إلى الصمت في كل مكان، وتقبل أن الشركات تحتاج إلى قدر من المرونة. أما رأي ليو المعارض فهو أن القواعد قد تجعل بقاء الشركات أصعب. وترد أمارا على هذه النقطة مباشرة بقولها إن الراحة مهمة، لكن الإنصاف ينبغي أن يكون له وزن أكبر عندما يكون المكان ملكًا للجميع. وموقفها مقيَّد لأنها تدعم قواعد محدودة وشفافة، لا قيودًا غير محدودة.'
    note: 'هذه إنجليزية مجرّدة: سمِّ القيم وقيّد أطروحتك بدقة.'
  en.b2.unit06.lesson04.teach.q_protect_spaces:
    title: أمارا تحدد موقفها
    gloss: 'تقول أمارا: أرى أنه ينبغي للمدينة أن تحمي الأماكن العامة الهادئة، حتى لو قيّد ذلك بعض النشاط التجاري.'
    note: '*even if* توضح أنها تعترف بوجود جانب سلبي.'
  en.b2.unit06.lesson04.teach.a_business_flexibility:
    title: ليو يذكر القيمة الأخرى
    gloss: 'يقول ليو: أقدّر الهدوء أنا أيضًا، لكن الشركات تحتاج إلى مرونة كي تبقى.'
    note: ليو يضع المرونة في مقابل تركيز أمارا على المكان العام.
  en.b2.unit06.lesson04.teach.q_not_silence:
    title: أمارا تقيّد موقفها
    gloss: 'تقول أمارا: هذا وجيه، وأنا لا أدعو إلى الصمت في كل مكان. ما أقصده أن الأماكن المشتركة ينبغي ألا يحدّد شكلها الربح وحده.'
    note: '*not arguing for silence everywhere* تمنع موقفها من أن يبدو مطلقًا.'
  en.b2.unit06.lesson04.teach.a_prioritizing:
    title: ليو يسمّي القيمة
    gloss: 'يقول ليو: إذن القيمة التي تعطينها الأولوية هي الإنصاف، لا مجرد الراحة؟'
    note: '*prioritizing* تعني هنا: جعل الشيء أهم عند الموازنة.'
  en.b2.unit06.lesson04.teach.q_fairness_weight:
    title: أمارا توازن بين القيم
    gloss: 'تقول أمارا: بالضبط. من حيث المبدأ، الراحة مهمة، لكن الإنصاف ينبغي أن يكون له وزن أكبر عندما يكون المكان ملكًا للجميع.'
    note: '*carry more weight* تعبير إنجليزي طبيعي بمعنى «له وزن أكبر».'
  en.b2.unit06.lesson04.teach.a_accept_rules:
    title: ليو يقبل بشرط
    gloss: 'يقول ليو: يمكنني قبول ذلك إذا كانت القواعد محدودة وشفافة.'
    note: قبوله مرهون بكون القواعد محدودة وواضحة.
