teaching:
  en.a1.unit63.lesson01.teach.help:
    title: help
    gloss: يساعد / مساعدة
    note: '*help* قد تكون فعلًا «يساعد» أو اسمًا «مساعدة». في الإنجليزية يأتي المفعول مباشرةً بعدها بلا حرف جر: *help me* (ساعدني) ولا نضع *to*.'
    example_gloss: هل يمكنك مساعدتي؟
  en.a1.unit63.lesson01.teach.carry:
    title: carry
    gloss: يحمل
    note: '*carry* تعني أن تمسك شيئًا وتنقله من مكان إلى آخر.'
    example_gloss: يمكنني حمله.
  en.a1.unit63.lesson01.teach.heavy:
    title: heavy
    gloss: ثقيل
    note: '*heavy* تعني ثقيلًا (في الوزن).'
    example_gloss: هذا ثقيل.
  en.a1.unit63.lesson01.teach.bag:
    title: bag
    gloss: حقيبة
    note: '*bag* تعني حقيبة، وتعني أيضًا كيسًا.'
    example_gloss: هذه الحقيبة ثقيلة.
  en.a1.unit63.lesson01.teach.door:
    title: door
    gloss: باب
    note: '*door* تعني بابًا.'
    example_gloss: افتح الباب.
  en.a1.unit63.lesson01.teach.shelf:
    title: shelf
    gloss: رفّ
    note: '*shelf* تعني رفًّا، على الجدار أو في الخزانة مثلًا. جمعها *shelves*.'
    example_gloss: ضعه على الرفّ.
  en.a1.unit63.lesson02.teach.can_you_help:
    title: Can you help me?
    gloss: هل يمكنك مساعدتي؟
    note: '*Can you...?* طريقة مباشرة ومعتادة لطلب المساعدة.'
  en.a1.unit63.lesson02.teach.bag_heavy:
    title: This bag is heavy.
    gloss: هذه الحقيبة ثقيلة.
    note: نستعمل *this bag* للحقيبة القريبة منّا.
  en.a1.unit63.lesson02.teach.open_door:
    title: Could you open the door?
    gloss: هل يمكنك أن تفتح الباب؟
    note: '*Could you...?* أكثر لباقة من *Can you...?* وهي تشبه في العربية «هل تتفضّل بـ...؟».'
  en.a1.unit63.lesson02.teach.i_can_help:
    title: I can help.
    gloss: يمكنني المساعدة.
    note: تعرض هذه الجملة المساعدة.
  en.a1.unit63.lesson02.teach.thank_you_help:
    title: Thank you for your help.
    gloss: شكرًا على مساعدتك.
    note: نستعمل *for* في *Thank you for...* لذكر سبب الشكر.
  en.a1.unit63.lesson02.teach.put_on_shelf:
    title: Put it on the shelf.
    gloss: ضعه على الرفّ.
    note: '*put it on...* تعني ضع الشيء على شيء. الفعل *put* هو نفسه سواء كان الشيء يوضع أو يُقام.'
  en.a1.unit63.lesson03.teach.dialogue_line1:
    title: "ليلى تطلب المساعدة"
    gloss: 'تقول ليلى: مرحبًا يا دانيال. هل يمكنك مساعدتي؟'
    note: '*Can you help me?* هي الجملة الأساسية لطلب المساعدة.'
  en.a1.unit63.lesson03.teach.dialogue_line2:
    title: "دانيال يسأل عمّا تحتاج"
    gloss: 'يقول دانيال: بالتأكيد. ماذا تحتاجين؟'
    note: '*Of course* تعني بالتأكيد.'
  en.a1.unit63.lesson03.teach.dialogue_line3:
    title: "الحقيبة ثقيلة"
    gloss: 'تقول ليلى: هذه الحقيبة ثقيلة.'
    note: '*heavy* تبيّن لماذا نحتاج إلى مساعدة.'
  en.a1.unit63.lesson03.teach.dialogue_line4:
    title: "دانيال يستطيع حمل الحقيبة"
    gloss: 'يقول دانيال: يمكنني حملها.'
    note: '*carry it* تعود على الحقيبة. نقول في الإنجليزية *it* لكل ما ليس شخصًا؛ فلا نقول *her* عن الحقيبة كما نقول «ها» في العربية.'
  en.a1.unit63.lesson03.teach.dialogue_line5:
    title: "ليلى تطلب فتح الباب"
    gloss: 'تقول ليلى: هل يمكنك أن تفتح الباب أيضًا؟'
    note: '*Could you...?* تجعل الطلب مهذّبًا.'
  en.a1.unit63.lesson03.teach.dialogue_line6:
    title: "دانيال يسأل عن الرفّ"
    gloss: 'يقول دانيال: نعم. هل أضع الحقيبة على الرفّ؟'
    note: بـ *Can I ...?* يعرض دانيال أن يضع الحقيبة على الرفّ.
  en.a1.unit63.lesson03.teach.dialogue_line7:
    title: "ليلى تشكر دانيال"
    gloss: 'تقول ليلى: نعم من فضلك. شكرًا على مساعدتك.'
    note: '*Thank you for your help* عبارة شكر ثابتة.'
  en.a1.unit63.lesson03.teach.dialogue_line8:
    title: "دانيال يردّ"
    gloss: 'يقول دانيال: لا مشكلة.'
    note: '*No problem* ردّ قصير ودّي.'
  en.a1.unit63.lesson04.teach.help_note:
    title: "ورقة المساعدة"
    gloss: 'ورقة مساعدة: الحقيبة الزرقاء ثقيلة. من فضلك ضعها على الرفّ بجانب الباب.'
    note: تقول الورقة أي حقيبة المقصودة وأين توضع.
  en.a1.unit63.lesson04.teach.reading_passage:
    title: "نص: جار خدوم"
    gloss: 'جار خدوم: كانت مع ليلى حقيبة زرقاء ثقيلة. رأت دانيال قرب الباب وطلبت مساعدته. حمل دانيال الحقيبة إلى الداخل. وطلبت منه ليلى أن يفتح الباب أيضًا. ثم وضع دانيال الحقيبة على الرفّ بجانب الباب. وشكرت ليلى دانيال على مساعدته. فقال دانيال: لا مشكلة. وفي وقت لاحق كتبت ليلى ملاحظة قصيرة: الحقيبة الزرقاء على الرفّ.'
    note: '*carried* هي صيغة الماضي من *carry*.'
