teaching:
  en.a1.unit24.lesson01.teach.bedroom:
    title: bedroom
    gloss: غرفة نوم
    note: '*bedroom* تعني غرفة النوم. تتكوّن من *bed* (سرير) و*room* (غرفة)، لكن تُنطق في الإنجليزية ككلمتين مع تشديد خاص.'
    example_gloss: غرفة نومي بجانب الحمّام.
  en.a1.unit24.lesson01.teach.kitchen:
    title: kitchen
    gloss: مطبخ
    note: '*kitchen* تعني مطبخ. تُنطق *KITCH-en*؛ ولا يُنطق حرف *t* منفصلًا.'
    example_gloss: المطبخ بجانب غرفة المعيشة.
  en.a1.unit24.lesson01.teach.bathroom:
    title: bathroom
    gloss: حمّام
    note: '*bathroom* تعني حمّامًا. وفي الولايات المتحدة هي أيضًا الكلمة المعتادة لدورة المياه.'
    example_gloss: في الحمّام دُشّ.
  en.a1.unit24.lesson01.teach.living_room:
    title: living room
    gloss: غرفة معيشة
    note: '*living room* تعني غرفة المعيشة. وهي كلمتان منفصلتان في الإنجليزية، ويقابلها في العربية تركيب إضافي.'
    example_gloss: نشاهد التلفاز في غرفة المعيشة.
  en.a1.unit24.lesson01.teach.garden:
    title: garden
    gloss: حديقة
    note: '*garden* تعني حديقة. وفي الولايات المتحدة يقولون كثيرًا *yard* للحديقة خلف البيت.'
    example_gloss: لا توجد حديقة، لكن يوجد شرفة.
  en.a1.unit24.lesson01.teach.the_kitchen_is_a_room:
    title: This is the kitchen.
    gloss: هذا هو المطبخ.
    note: 'نشير إلى شيء بـ *This is ...*. و*the* تدل على شيء معيّن: مطبخ هذه الشقة.'
  en.a1.unit24.lesson02.teach.how_many_rooms:
    title: How many rooms are there?
    gloss: كم غرفة توجد؟
    note: نسأل بـ *How many...are there?* عن العدد. تأتي *many* مع المعدودات بصيغة الجمع؛ وتأتي *are* لأن *rooms* جمع.
  en.a1.unit24.lesson02.teach.there_is_a_kitchen:
    title: There's a small kitchen.
    gloss: يوجد مطبخ صغير.
    note: نقول بـ *There's...* (*there is*) إن شيئًا موجود في مكان ما. وهي تقابل «يوجد» في العربية؛ ومع أكثر من شيء نقول *there are*.
  en.a1.unit24.lesson02.teach.next_to:
    title: next to
    gloss: بجانب
    note: '*next to* تعني بجانب. هي كلمتان تبقيان معًا دائمًا.'
    example_gloss: الكرسي بجانب الطاولة.
  en.a1.unit24.lesson03.teach.apartment:
    title: apartment
    gloss: شقة
    note: '*apartment* تعني شقة (بالأمريكية؛ وفي البريطانية *flat*).'
    example_gloss: في شقة دانيال غرفتا نوم.
  en.a1.unit24.lesson03.teach.home_text:
    title: "نص عن شقة"
    gloss: في شقتي غرفتا نوم وحمّام واحد. يوجد مطبخ صغير بجانب غرفة المعيشة.
    note: في هذا النص القصير يصف شخص شقته ويذكر عدد الغرف.
  en.a1.unit24.lesson04.teach.favorite_room:
    title: What's your favorite room?
    gloss: ما غرفتك المفضّلة؟
    note: '*favorite* تعني مفضّل.'
  en.a1.unit24.lesson04.teach.q_tell_me_about:
    title: "السؤال عن الشقة"
    gloss: 'تقول ليلى: حدّثني عن شقتك.'
    note: نطلب من شخص أن يصف شيئًا بـ *Tell me about...*.
  en.a1.unit24.lesson04.teach.a_two_bed_one_bath:
    title: "جواب دانيال"
    gloss: 'يقول دانيال: فيها غرفتا نوم وحمّام واحد. يوجد مطبخ صغير بجانب غرفة المعيشة.'
    note: يذكر دانيال عدد الغرف ومكان المطبخ.
  en.a1.unit24.lesson04.teach.q_is_there_garden:
    title: "السؤال عن حديقة"
    gloss: 'تسأل ليلى: هل توجد حديقة؟'
    note: نسأل بـ *Is there...?* هل الشيء موجود.
  en.a1.unit24.lesson04.teach.a_no_but_balcony:
    title: "جواب دانيال"
    gloss: 'يقول دانيال: لا، لا توجد، لكن يوجد شرفة صغيرة.'
    note: يقول دانيال لا أولًا ثم يذكر بديلًا.
  en.a1.unit24.lesson04.teach.a_living_room_near_kitchen:
    title: "جواب دانيال الأخير"
    gloss: 'يقول دانيال: غرفتي المفضّلة هي غرفة المعيشة. إنها قريبة من المطبخ، فمن السهل تناول العشاء هناك.'
    note: يذكر دانيال غرفته المفضّلة ويعطي السبب.
