    note: '*original article* تعني النص الكامل الأصلي قبل تلخيصه.'
    example_gloss: جاء ملخص ليلى مطابقًا للمقال الأصلي إلى حد كبير.
  en.b1.unit19.lesson03.teach.reading_passage:
    title: 'نص للقراءة: تلخيص مقال قصير'
    gloss: 'قرأت ليلى مقالًا طويلًا عن التواصل في بيئة العمل لدورة التصميم التي تحضرها. كان المقال الأصلي يحتوي على أمثلة كثيرة ومعلومات خلفية، لكن ليلى كانت تحتاج إلى النقاط الرئيسية فقط. فكتبت بكلماتها الخاصة ملخصًا موجزًا: يكون التواصل في العمل أفضل عندما تكون الرسائل واضحة وقصيرة، وعندما يطرح الناس الأسئلة بدل التخمين. وحذفت معظم الأمثلة لأنها تفاصيل وليست نقاطًا رئيسية. وقال معلمها إن الملخص حافظ على الأفكار المهمة بالترتيب الصحيح.'
    note: نص قصير للقراءة.
  en.b1.unit19.lesson04.teach.q_missed_meeting:
    title: دانيال يطلب توضيحًا
    gloss: 'يقول دانيال: فاتني الاجتماع. هل يمكنك أن تخبرني بما حدث؟'
    note: سؤال مفتوح لطلب ملخص.
  en.b1.unit19.lesson04.teach.a_in_short_budget_client:
    title: ميا تقدّم ملخصًا قصيرًا
    gloss: 'تقول ميا: بالطبع. باختصار، تحدثنا عن الميزانية والعميل الجديد.'
    note: '*in short* تفتتح ملخصًا سريعًا وغير رسمي.'
  en.b1.unit19.lesson04.teach.q_main_point_budget:
    title: دانيال يسأل عن النقطة الرئيسية
    gloss: 'يقول دانيال: ما النقطة الرئيسية بخصوص الميزانية؟'
    note: سؤال موجّه عن النقطة الرئيسية.
  en.b1.unit19.lesson04.teach.a_under_budget_this_month:
    title: ميا تذكر النقطة الرئيسية
    gloss: 'تقول ميا: كانت النقطة الرئيسية أننا ضمن الميزانية هذا الشهر.'
    note: '*the main point was that...* تبرز الفكرة الأهم.'
  en.b1.unit19.lesson04.teach.q_other_details:
    title: دانيال يسأل عن التفاصيل
    gloss: 'يقول دانيال: جيد. هل كانت هناك تفاصيل أخرى؟'
    note: سؤال متابعة عن التفاصيل الصغيرة.
  en.b1.unit19.lesson04.teach.a_client_meeting_moved:
    title: ميا تذكر تفصيلًا صغيرًا
    gloss: 'تقول ميا: تفصيل صغير واحد فقط: تأجّل اجتماع العميل إلى الأسبوع القادم.'
    note: '*just one small detail* تقدّم معلومة صغيرة إضافية.'
  en.b1.unit19.lesson04.teach.q_thanks_for_summary:
    title: دانيال يشكر ميا
    gloss: 'يقول دانيال: شكرًا على الملخص. هذا مفيد جدًا.'
    note: ختام قصير يعبّر عن الامتنان.
