    gloss: ابدأ الملخص بعبارة مثل In summary أو In short، ثم اذكر النقاط الرئيسية فقط بالترتيب، وأبقِ الجملة قصيرة. واستخدم The main point was that... لإبراز الفكرة الأهم وحدها، بمعزل عن أي تفاصيل أصغر.
    note: 'الصيغة: ابدأ بـ In summary أو In short، واستخدم The main point was that... للنقطة الرئيسية.'
