    gloss: الحافلة متأخرة.
    note: 'تستخدم الإنجليزية البنية نفسها للشخص وللحافلة: *is late*.'
  en.a1.unit61.lesson02.teach.thats_okay:
    title: That's okay.
    gloss: لا بأس.
    note: '*That''s okay* تقبل الاعتذار بلطف.'
  en.a1.unit61.lesson02.teach.no_problem:
    title: No problem.
    gloss: لا مشكلة.
    note: '*No problem* رد قصير وغير رسمي على اعتذار أو شكر.'
  en.a1.unit61.lesson02.teach.made_mistake:
    title: I made a mistake.
    gloss: لقد ارتكبت خطأ.
    note: تقول الإنجليزية *make a mistake*، ولا تقول *do a mistake*.
  en.a1.unit61.lesson03.teach.dialogue_line1:
    title: "دانيال يعتذر"
    gloss: 'يقول دانيال: مرحبًا ميا. أنا آسف لأنني متأخر.'
    note: '*I''m sorry I''m late* تجمع بين الاعتذار والسبب.'
  en.a1.unit61.lesson03.teach.dialogue_line2:
    title: ميا تقبل الاعتذار
    gloss: 'تقول ميا: لا بأس.'
    note: '*That''s okay* عبارة لطيفة وبسيطة.'
  en.a1.unit61.lesson03.teach.dialogue_line3:
    title: الحافلة متأخرة
    gloss: 'يقول دانيال: الحافلة متأخرة.'
    note: هذه الجملة تذكر السبب.
  en.a1.unit61.lesson03.teach.dialogue_line4:
    title: ميا تقول إن الانتظار ممكن
    gloss: 'تقول ميا: لا مشكلة. يمكننا الانتظار.'
    note: '*We can wait* تعني أن الانتظار ممكن.'
  en.a1.unit61.lesson03.teach.dialogue_line5:
    title: دانيال أخطأ في الوقت
    gloss: 'يقول دانيال: لقد أخطأت في الوقت.'
    note: '*with the time* تعني «بخصوص الوقت» أو «في تقدير الموعد».'
  en.a1.unit61.lesson03.teach.dialogue_line6:
    title: الدرس يبدأ في الثالثة
    gloss: 'تقول ميا: لا بأس. الدرس يبدأ في الساعة الثالثة.'
    note: '*at three* تستخدم *at* مع الساعة.'
  en.a1.unit61.lesson03.teach.dialogue_line7:
    title: دانيال يشكر ميا
    gloss: 'يقول دانيال: شكرًا لك على الانتظار.'
    note: '*Thank you for waiting* تستخدم *for* مع صيغة الفعل المنتهية بـ -ing.'
  en.a1.unit61.lesson04.teach.class_note:
    title: ملاحظة الدرس
    gloss: 'ملاحظة الدرس: يبدأ الدرس في الساعة 3:00. من فضلك احضر في الموعد. إذا تأخرت، أرسل رسالة.'
    note: تقول الملاحظة ما يجب فعله إذا تأخرت.
  en.a1.unit61.lesson04.teach.reading_passage:
    title: 'نص: اعتذار قبل الدرس'
    gloss: 'اعتذار قبل الدرس: تأخر دانيال عن الدرس لأن الحافلة كانت متأخرة. التقى ميا خارج الصف. قال دانيال إنه آسف. وقال أيضًا إنه أخطأ في الوقت. قالت ميا إن الأمر لا بأس به. كان الدرس في الساعة 3:00. أرسل دانيال رسالة قصيرة إلى المعلمة. جاء في الرسالة: «أنا آسف لأنني متأخر. الحافلة متأخرة.»'
    note: '*because* تذكر السبب: لأن الحافلة كانت متأخرة.'
