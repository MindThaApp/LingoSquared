    example_gloss: بحلول وصول ميا، يكون العشاء جاهزًا.
  en.b1.unit08.lesson03.teach.reading_passage:
    title: 'نص للقراءة: خطة المساء'
    gloss: لدى دانيال روتين مسائي دقيق. عندما يصل إلى البيت، يتفقد البريد أولًا. وبعد أن يتفقد البريد، يقفل الباب الأمامي. وقبل أن يبدأ إعداد العشاء، يغسل يديه ويرفع الأطباق عن الطاولة. وبحلول وصول ميا، يكون المطبخ جاهزًا والطعام دافئًا.
    note: نص قصير للقراءة فيه *when* و*after* و*before* و*by the time*.
  en.b1.unit08.lesson04.teach.q_call_when_home:
    title: ليلى تطلب مكالمة
    gloss: 'تقول ليلى: دانيال، هل يمكنك أن تتصل بي عندما تصل إلى البيت؟'
    note: سؤال فيه *when* لتحديد وقت الفعل.
  en.b1.unit08.lesson04.teach.a_as_soon_as_home:
    title: دانيال يعد بالاتصال فورًا
    gloss: 'يقول دانيال: بالتأكيد. بمجرد أن أصل إلى البيت، سأتصل بك.'
    note: توضح *as soon as* أنه سيتصل فورًا.
  en.b1.unit08.lesson04.teach.q_check_mail:
    title: ليلى تعطي أول مهمة
    gloss: 'تقول ليلى: من فضلك تفقّد البريد قبل أن تصعد إلى الطابق العلوي.'
    note: تبيّن *before* أن البريد يأتي أولًا.
  en.b1.unit08.lesson04.teach.a_after_mail_lock:
    title: دانيال يذكر الخطوة التالية
    gloss: 'يقول دانيال: حسنًا. بعد أن أتفقد البريد، سأقفل الباب الأمامي.'
    note: تبيّن *after* الترتيب بين فعلين.
  en.b1.unit08.lesson04.teach.q_by_the_time_mia:
    title: ليلى تذكر الوقت
    gloss: 'تقول ليلى: رائع. بحلول وصول ميا، يجب أن يكون كل شيء جاهزًا.'
    note: '*by the time* تعني أن يكون كل شيء جاهزًا في تلك اللحظة أو قبلها.'
  en.b1.unit08.lesson04.teach.a_start_dinner:
    title: دانيال يُنهي الخطة
    gloss: 'يقول دانيال: إذن يمكننا أن نبدأ العشاء عندما تصل.'
    note: '*when she arrives* تحدد الوقت الذي يمكنهم أن يبدؤوا فيه.'
