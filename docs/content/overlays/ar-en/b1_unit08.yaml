    gloss: بمجرد أن أصل إلى البيت، سأتصل بك.
    note: تبيّن *as soon as* أن الفعل الثاني يحدث فور الأول.
  en.b1.unit08.lesson02.teach.before_upstairs:
    title: فعل شيء أولًا
    gloss: من فضلك تفقّد البريد قبل أن تصعد إلى الطابق العلوي.
    note: تبيّن *before* أي فعل يجب أن يحدث أولًا.
  en.b1.unit08.lesson02.teach.grammar_future_time_clause:
    title: المضارع في جمل الزمن
    gloss: عندما أصل إلى البيت، سأتصل بك. من فضلك تفقّد البريد قبل أن تصعد إلى الطابق العلوي.
    note: 'في الجمل الزمنية الإنجليزية يأتي الفعل المضارع للدلالة على الحدث المستقبلي: *when I get home* وليس *when I will get home*.'
