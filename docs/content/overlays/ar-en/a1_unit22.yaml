teaching:
  en.a1.unit22.lesson01.teach.headache:
    title: headache
    gloss: صداع
    note: '*headache* تعني صداع. في الإنجليزية نقول *a headache* أي بصيغة المفرد مع أداة التنكير، ولا نقول *I have headache*.'
    example_gloss: عندي صداع.
  en.a1.unit22.lesson01.teach.stomachache:
    title: stomachache
    gloss: ألم في المعدة
    note: '*stomachache* تعني ألم المعدة أو البطن. وهنا أيضًا نقول *a stomachache* مع أداة التنكير.'
    example_gloss: عندي ألم في المعدة.
  en.a1.unit22.lesson01.teach.fever:
    title: fever
    gloss: حمّى
    note: '*fever* تعني حمّى. نقول *have a fever* ولا نقول *have fever*.'
    example_gloss: أظن أن عندي حمّى.
  en.a1.unit22.lesson01.teach.cough:
    title: cough
    gloss: سعال
    note: '*cough* تعني سعال. الكلمة اسم وفعل: *a cough* (السعال)، *to cough* (يسعل).'
    example_gloss: عند دانيال سعال شديد.
  en.a1.unit22.lesson01.teach.sore_throat:
    title: sore throat
    gloss: التهاب الحلق
    note: '*sore throat* تعني ألم الحلق. *sore* تعني «مؤلم»؛ وهنا أيضًا تأتي أداة: *a sore throat*.'
    example_gloss: عندي التهاب في الحلق.
  en.a1.unit22.lesson02.teach.whats_wrong:
    title: What's wrong?
    gloss: ما الأمر؟
    note: نسأل بـ *What's wrong?* عن وجود مشكلة. *What's* اختصار *What is*.
  en.a1.unit22.lesson02.teach.i_have_a_headache:
    title: I have a headache.
    gloss: عندي صداع.
    note: نذكر الشكوى بـ *I have a...* وهي حرفيًّا «عندي...»، كما في العربية تمامًا.
  en.a1.unit22.lesson02.teach.i_feel_hot:
    title: I feel hot.
    gloss: أشعر بالحر.
    note: نقول بـ *I feel...* كيف نشعر جسديًّا. *I feel hot* تعني «أشعر بالحر»، والفاعل في الإنجليزية *I* ويأتي بعده الفعل.
  en.a1.unit22.lesson03.teach.rest:
    title: rest
    gloss: يرتاح
    note: '*rest* تعني يرتاح أو يستريح.'
    example_gloss: يجب أن أرتاح.
  en.a1.unit22.lesson03.teach.symptom_text:
    title: "نص عن الأعراض الصحية"
    gloss: عندي صداع والتهاب في الحلق. أظن أن عندي حمّى أيضًا. يجب أن أرتاح.
    note: في هذا النص القصير يصف شخص عدة أعراض معًا.
  en.a1.unit22.lesson04.teach.see_a_doctor:
    title: You should see a doctor.
    gloss: ينبغي أن تذهب إلى الطبيب.
    note: نعطي نصيحة بسيطة بـ *You should...* أي «ينبغي أن...». وبعد *should* يأتي الفعل بلا *to*.
  en.a1.unit22.lesson04.teach.q_dont_look_well:
    title: "السؤال عمّا بك"
    gloss: 'تقول ليلى: لا تبدو بخير. ما الأمر؟'
    note: '*You don''t look well* تعني: لا تبدو بخير.'
  en.a1.unit22.lesson04.teach.a_headache_sore_throat:
    title: "جواب دانيال"
    gloss: 'يقول دانيال: عندي صداع والتهاب في الحلق.'
    note: يذكر دانيال شكوى مزدوجة.
  en.a1.unit22.lesson04.teach.q_do_you_have_fever:
    title: "السؤال عن الحمّى"
    gloss: 'تسأل ليلى: هل عندك حمّى؟'
    note: نسأل بـ *Do you have a fever?* عن شكوى محدّدة.
  en.a1.unit22.lesson04.teach.a_not_sure_feel_hot:
    title: "جواب دانيال"
    gloss: 'يقول دانيال: لست متأكدًا، لكنني أشعر بالحر.'
    note: دانيال غير متأكد، لكنه يقول كيف يشعر.
  en.a1.unit22.lesson04.teach.a_rest_water_doctor:
    title: "نصيحة ليلى"
    gloss: 'تقول ليلى: ينبغي أن ترتاح وتشرب الماء. وإذا لم تتحسّن حالتك فاذهب إلى الطبيب.'
    note: تعطي ليلى أولًا نصيحة بسيطة، ثم تقول متى ينبغي أن يذهب دانيال إلى الطبيب.
  en.a1.unit22.lesson04.teach.a_okay_rest_today:
    title: "جواب دانيال الأخير"
    gloss: 'يقول دانيال: حسنًا، شكرًا. سأرتاح اليوم.'
    note: يقبل دانيال النصيحة ويقول ما سيفعله اليوم.
