  en.a1.unit38.lesson03.teach.dialogue_line1:
    title: مشكلة ميا
    gloss: 'تقول ميا: شقتي في فوضى. سيزورني أناس في عطلة نهاية الأسبوع هذه.'
    note: '*a mess* تعني «فوضى».'
  en.a1.unit38.lesson03.teach.dialogue_line2:
    title: عرض دانيال
    gloss: 'يسأل دانيال: هل تريدين بعض المساعدة في تنظيفها؟'
    note: '*Do you want some help ...ing?* طريقة طبيعية لعرض المساعدة.'
  en.a1.unit38.lesson03.teach.dialogue_line3:
    title: "إجابة ميا"
    gloss: 'تقول ميا: نعم من فضلك! عليّ أن أكنس غرفة المعيشة وأغسل الصحون.'
    note: '*I need to* + فعل تعني «عليّ أن» + الفعل.'
  en.a1.unit38.lesson03.teach.dialogue_line4:
    title: عرض دانيال
    gloss: 'يقول دانيال: أستطيع أن أكنس عنك. وأنتِ تغسلين الصحون.'
    note: '*for you* تعني هنا «عنك»، أي «بدلًا منك».'
  en.a1.unit38.lesson03.teach.dialogue_line5:
    title: إضافة ميا
    gloss: 'تقول ميا: شكرًا! ما زال عليّ أيضًا أن أغسل الملابس.'
    note: '*still need to* تعني «ما زال عليّ أن».'
  en.a1.unit38.lesson03.teach.dialogue_line6:
    title: عرض دانيال
    gloss: 'يقول دانيال: ليس عندي وقت لذلك اليوم، لكن أستطيع إخراج القمامة قبل أن أغادر.'
    note: '*before I leave* تعني «قبل أن أغادر».'
  en.a1.unit38.lesson03.teach.dialogue_line7:
    title: شكر ميا
    gloss: 'تقول ميا: سيساعدني هذا كثيرًا. شكرًا جزيلًا!'
    note: '*That would help a lot* تعني «سيساعدني هذا كثيرًا». تجعل *Would* العبارة هنا أكثر تهذيبًا.'
  en.a1.unit38.lesson04.teach.reading_passage:
    title: نص عن المهام في البيت
    gloss: لكل من دانيال وليلى وميا عاداته الخاصة في المهام المنزلية. يغسل دانيال الصحون كل مساء بعد العشاء ويكنس شقته بالمكنسة أيام السبت. لا تمانع ليلى غسل الملابس، لكنها تكره تنظيف الحمّام. تترك قطة ميا، لونا، شعرها في كل مكان، لذا تكنس ميا شقتها بالمكنسة تقريبًا كل يوم. في عطلة نهاية الأسبوع الماضية كان عند ميا ضيوف، فعرض عليها دانيال المساعدة. كنس غرفة المعيشة وأخرج القمامة عنها. كانت ميا ممتنة جدًا لمساعدته.
    note: '*doesn''t mind* تعني «لا تمانع».'
