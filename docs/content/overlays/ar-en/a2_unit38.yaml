teaching:
  en.a2.unit38.lesson01.teach.reschedule:
    title: reschedule
    gloss: يؤجّل موعدًا
    note: '*reschedule* تعني نقل موعد إلى وقت آخر.'
    example_gloss: يجب أن أؤجّل موعد الإصلاح لأنني سأكون في العمل حينها.
  en.a2.unit38.lesson01.teach.neighbor:
    title: neighbor
    gloss: جار، جارة
    note: '*neighbor* هو الشخص الذي يسكن بجوارك. الكلمة الإنجليزية لا تدل على أنه رجل أم امرأة.'
    example_gloss: جارتي تستطيع أن تفتح الباب للسبّاك.
  en.a2.unit38.lesson01.teach.key:
    title: key
    gloss: مفتاح
    note: '*key* هو الشيء المعدني الصغير الذي تفتح به الباب.'
    example_gloss: سأترك المفتاح عند جارتي.
  en.a2.unit38.lesson01.teach.leak:
    title: leak
    gloss: تسرّب
    note: '*leak* هنا اسم: مكان التسرّب نفسه الذي يخرج منه الماء. أما الفعل *to leak* فمعناه يتسرّب أو يقطر.'
    example_gloss: التسرّب تحت حوض مطبخي يزداد سوءًا.
  en.a2.unit38.lesson01.teach.fixed:
    title: fixed
    gloss: مُصلَح
    note: '*fixed* هو اسم المفعول من *to fix* (يُصلح)، ويعني أن الشيء لم يعد معطّلًا.'
    example_gloss: الحوض مُصلَح الآن، وتوقّف تسرّب الماء.
  en.a2.unit38.lesson01.teach.afternoon:
    title: afternoon
    gloss: بعد الظهر
    note: '*afternoon* هو جزء اليوم الذي يلي الظهر؛ أما الصباح فيُقال له *morning*.'
    example_gloss: جاء السبّاك بعد الظهر، لا في الصباح.
  en.a2.unit38.lesson01.teach.grammar_cant_wont:
    title: can't und won't, wenn etwas nicht klappt
    gloss: لا أستطيع أن أكون في البيت بين الساعة 2 والساعة 4 ظهرًا. لن أكون في البيت بعد الظهر.
    note: '*can''t* تعني أن الأمر غير ممكن. أما *won''t* فتعني أنه ببساطة لن يحدث في المستقبل.'
  en.a2.unit38.lesson02.teach.need_to_reschedule:
    title: Sagen, dass Sie den Termin verschieben möchten
    gloss: يجب أن أؤجّل موعد الإصلاح.
    note: '*I need to ...* عبارة عملية ومحايدة: تعبّر عن الحاجة دون أن تبدو فظّة.'
  en.a2.unit38.lesson02.teach.possible_in_the_morning:
    title: Um eine andere Uhrzeit bitten
    gloss: هل من الممكن أن تأتوا في الصباح بدلًا من ذلك؟
    note: '*Would it be possible to ...?* هي أحرص طريقة لطلب شيء. و*instead* تعني بدلًا من ذلك.'
  en.a2.unit38.lesson02.teach.leave_key_with_neighbor:
    title: Sagen, wo der Schlüssel ist
    gloss: سأترك المفتاح عند جارتي.
    note: '*leave something with someone* تعني ترك شيء عند شخص ما أو تسليمه إياه.'
  en.a2.unit38.lesson02.teach.is_the_leak_fixed:
    title: Fragen, ob das Problem behoben ist
    gloss: هل تم إصلاح التسرّب الآن؟
    note: '*Is ... fixed?* يسأل عن النتيجة، لا عن العمل نفسه.'
  en.a2.unit38.lesson02.teach.grammar_because_reason:
    title: Einen Grund mit because nennen
    gloss: لا أستطيع أن أكون في البيت بين الساعة 2 والساعة 4 ظهرًا لأنني أكون في العمل حينها.
    note: '*because* تربط المشكلة بسببها، وبعدها يأتي الكلام بترتيبه العادي: جملة كاملة فيها فاعل وفعل.'
  en.a2.unit38.lesson03.teach.message:
    title: message
    gloss: رسالة
    note: '*message* هي أي رسالة قصيرة مكتوبة: رسالة نصية أو رسالة في تطبيق محادثة أو بريد إلكتروني قصير.'
    example_gloss: وصلتني رسالة عن موعد الإصلاح الجديد.
  en.a2.unit38.lesson03.teach.rescheduling_text:
    title: Die Nachricht über den neuen Termin
    gloss: تم تأجيل الإصلاح رقم 6180. سيأتي السبّاك غدًا بين الساعة 9 والساعة 11 صباحًا. ستفتح جارتكم الباب. يُرجى تأكيد هذا الموعد الجديد برسالة اليوم.
    note: 'رسالة من إدارة المبنى تكون قصيرة وعملية: ما الذي تغيّر، ومتى، وما الذي يبقى عليك فعله.'
  en.a2.unit38.lesson03.teach.confirm_by_message:
    title: Zur Bestätigung aufgefordert werden
    gloss: يُرجى تأكيد هذا الموعد الجديد برسالة اليوم.
    note: '*confirm* تعني يؤكّد، و*by message* تعني برسالة.'
  en.a2.unit38.lesson04.teach.q_need_to_reschedule:
    title: Daniel ruft die Hausverwaltung an
    gloss: 'دانيال يقول: مرحبًا، يجب أن أؤجّل موعد الإصلاح.'
    note: عند الاتصال هاتفيًا تبدأ بـ *Hello* ثم تذكر سبب المكالمة مباشرة.
  en.a2.unit38.lesson04.teach.a_which_repair:
    title: Die Hausverwaltung fragt, welche Reparatur
    gloss: 'الإدارة تقول: لا مشكلة. أي إصلاح تقصد؟'
    note: '*Which repair is it?* يسأل عن شيء واحد من مجموعة معروفة.'
  en.a2.unit38.lesson04.teach.q_repair_6180:
    title: Daniel nennt die Reparaturnummer
    gloss: 'دانيال يقول: الإصلاح رقم 6180، التسرّب تحت حوض مطبخي.'
    note: 'رقم الإصلاح نفسه في الوحدة 29: الحوض نفسه الذي فيه التسرّب.'
  en.a2.unit38.lesson04.teach.a_why_cant_you_be_home:
    title: Die Hausverwaltung fragt nach dem Grund
    gloss: 'الإدارة تقول: فهمت. لماذا لا تستطيع أن تكون في البيت؟'
    note: '*Why can''t you ...?* يسأل عن سبب تعذّر الأمر.'
  en.a2.unit38.lesson04.teach.q_at_work_ask_morning:
    title: Daniel nennt den Grund und bittet um den Vormittag
    gloss: 'دانيال يقول: لا أستطيع أن أكون في البيت بين الساعة 2 والساعة 4 ظهرًا لأنني أكون في العمل حينها. هل من الممكن أن تأتوا في الصباح بدلًا من ذلك؟'
    note: 'السبب أولًا ثم الطلب: هذا أكثر لباقة من أن تطلب شيئًا مباشرة.'
  en.a2.unit38.lesson04.teach.a_plumber_can_come_morning:
    title: Die Hausverwaltung bietet einen neuen Zeitraum an
    gloss: 'الإدارة تقول: نعم، يستطيع السبّاك أن يأتي بين الساعة 9 والساعة 11 صباحًا.'
    note: '*between 9am and 11am* هي الفترة الجديدة.'
  en.a2.unit38.lesson04.teach.q_leave_key:
    title: Daniel regelt den Schlüssel
    gloss: 'دانيال يقول: شكرًا جزيلًا. سأترك المفتاح عند جارتي.'
    note: الجملة نفسها التي وردت في الدرس 2.
  en.a2.unit38.lesson04.teach.a_please_confirm:
    title: Die Hausverwaltung bittet um Bestätigung
    gloss: 'الإدارة تقول: جيد. يُرجى تأكيد هذا الموعد الجديد برسالة اليوم.'
    note: الطلب نفسه الذي ورد في الرسالة في الدرس 3.
  en.a2.unit38.lesson04.teach.q_will_confirm_this_afternoon:
    title: Daniel sagt, wann er bestätigt
    gloss: 'دانيال يقول: سأؤكّده بعد ظهر اليوم.'
    note: '*this afternoon* تعني بعد ظهر هذا اليوم، أي اليوم بعد الساعة 12.'
