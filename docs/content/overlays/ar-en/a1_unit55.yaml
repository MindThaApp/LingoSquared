    example_gloss: يراقب المنقذ المسبح كل يوم.
  en.a1.unit55.lesson02.teach.id_like_to_buy_a_ticket:
    title: I'd like to buy a ticket, please.
    gloss: أودّ أن أشتري تذكرة، من فضلك.
    note: '*I''d like to* هي اختصار *I would like to*، وهي الطريقة المهذّبة لطلب شيء.'
  en.a1.unit55.lesson02.teach.where_are_the_lockers:
    title: Where are the lockers?
    gloss: أين الخزائن؟
    note: في *Where are...?* يأتي الفعل قبل المبتدأ، وهذا الترتيب مألوف في الأسئلة الإنجليزية.
  en.a1.unit55.lesson02.teach.what_time_do_you_open:
    title: What time do you open?
    gloss: في أي ساعة تفتحون؟
    note: تستعمل *do you open* الفعل المساعد *do* لتكوين السؤال.
  en.a1.unit55.lesson02.teach.its_five_dollars_for_one_ticket:
    title: It's five dollars for one ticket.
    gloss: ثمن التذكرة الواحدة خمسة دولارات.
    note: تعني *for one ticket* لتذكرة واحدة.
  en.a1.unit55.lesson02.teach.do_i_need_a_swim_cap:
    title: Do I need a swim cap?
    gloss: هل أحتاج إلى قبعة سباحة؟
    note: تستعمل *Do I need...?* الفعل المساعد *do* لتكوين السؤال.
  en.a1.unit55.lesson02.teach.we_close_at_eight:
    title: We close at eight o'clock.
    gloss: نُغلق في الساعة الثامنة.
    note: تستعمل *at eight o'clock* الحرف *at* مع ساعة محددة، كما نقول في العربية «في الساعة الثامنة».
  en.a1.unit55.lesson03.teach.dialogue_line1:
    title: المنقذ يرحّب بهما
    gloss: 'يقول المنقذ: مرحبًا! هل جئتما للسباحة اليوم؟'
    note: تستعمل *Are you here to swim today?* الصيغة *to swim* لبيان الغرض، أي «لتسبحا»، وهو يشبه استعمال «لـ» في العربية.
  en.a1.unit55.lesson03.teach.dialogue_line2:
    title: تذكرتا Daniel
    gloss: 'يقول Daniel: نعم، تذكرتان من فضلك.'
    note: طلب قصير ومباشر لتذكرتين.
  en.a1.unit55.lesson03.teach.dialogue_line3:
    title: السعر
    gloss: 'يقول المنقذ: بالتأكيد! ثمن التذكرة الواحدة خمسة دولارات.'
    note: 'معلومة واحدة منفصلة: سعر التذكرة.'
  en.a1.unit55.lesson03.teach.dialogue_line4:
    title: Mia تسأل عن قبعة السباحة
    gloss: 'تقول Mia: هل نحتاج إلى قبعة سباحة؟'
    note: في *Do we need...?* يظهر الفعل المساعد *do* مرة أخرى لتكوين السؤال.
  en.a1.unit55.lesson03.teach.dialogue_line5:
    title: قاعدة قبعة السباحة
    gloss: 'يقول المنقذ: نعم، قبعات السباحة إلزامية في المسبح.'
    note: '*swim caps are required* جملة مبنية للمجهول، وهي طريقة رسمية لذكر قاعدة، وكثيرًا ما تُكتب على لافتات المسبح ويقولها الموظفون. وفي العربية نقول مثلًا «قبعات السباحة إلزامية» أو «يجب ارتداء قبعة السباحة».'
  en.a1.unit55.lesson03.teach.dialogue_line6:
    title: Daniel يسأل عن الخزائن
    gloss: 'يقول Daniel: أين الخزائن؟'
    note: سؤال قصير، وليس فيه معلومة جديدة عن السعر أو الوقت.
  en.a1.unit55.lesson03.teach.dialogue_line7:
    title: مكان الخزائن
    gloss: 'يقول المنقذ: الخزائن قرب المدخل.'
    note: 'معلومة واحدة منفصلة: مكان الخزائن، وهي تختلف عما تحتاج إليه الخزائن.'
  en.a1.unit55.lesson03.teach.dialogue_line8:
    title: ما تحتاج إليه الخزائن
    gloss: 'يقول المنقذ: تحتاج إلى عملة معدنية من فئة دولار.'
    note: '*a dollar coin* تتكون من كلمتين إنجليزيتين منفصلتين هما *dollar* و*coin*. وفي العربية نقول «عملة معدنية من فئة دولار» أو «عملة الدولار المعدنية».'
  en.a1.unit55.lesson03.teach.dialogue_line9:
    title: Mia تسأل عن موعد الإغلاق
    gloss: 'تقول Mia: في أي ساعة تُغلقون؟'
    note: تستعمل *What time do you close?* الفعل المساعد *do* لتكوين السؤال.
  en.a1.unit55.lesson03.teach.dialogue_line10:
    title: موعد الإغلاق
    gloss: 'يقول المنقذ: نُغلق في الساعة الثامنة.'
    note: 'المعلومة الرابعة المنفصلة: موعد الإغلاق.'
  en.a1.unit55.lesson04.teach.reading_passage:
    title: 'نص: يوم عند المسبح'
    gloss: 'في عصر يوم حار من شهر يوليو، قرّر Daniel وMia أن يستمتعا بالانتعاش في مسبح الحي. قرب المدخل كانت لافتة تذكر قواعد المسبح: ممنوع الركض، وقبعات السباحة إلزامية في المسبح. طلبا من المنقذ تذكرتين. وكان ثمن التذكرة الواحدة خمسة دولارات. شرح المنقذ أن الخزائن قرب المدخل وأنها تحتاج إلى عملة معدنية من فئة دولار. وضع Daniel وMia حقيبتيهما في خزانة وسبحا قرابة ساعتين. وقبل أن يغادرا، تفقّدا اللافتة مرة أخرى: يُغلق المسبح في الساعة الثامنة. وقالت Mia إنها تريد العودة في نهاية الأسبوع القادم وتجربة منصة القفز.'
    note: '*required* صيغة مبنية للمجهول، وتعني *swim caps are required* أن قبعات السباحة إلزامية.'
