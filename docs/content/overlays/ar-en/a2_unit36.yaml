course:
  title: الإنجليزية A2
  description: تعلّم الإنجليزية بمستوى A2 لمواقف يومية أكثر رسمية، مع شروح عربية مفصّلة.
units:
  en.a2.unit36.document_correction:
    title: طلب تصحيح خطأ في وثيقة رسمية
lessons:
  en.a2.unit36.lesson01.document_vocabulary:
    title: الشهادات والأخطاء والنسخ
  en.a2.unit36.lesson02.asking_for_a_correction:
    title: طلب إجراء تصحيح
  en.a2.unit36.lesson03.reading_a_correction_notice:
    title: قراءة خطاب بشأن التصحيح
  en.a2.unit36.lesson04.correction_dialogue:
    title: عند شباك مكتب التسجيل
teaching:
  en.a2.unit36.lesson01.teach.certificate:
    title: certificate
    gloss: شهادة
    note: '*certificate* ورقة رسمية تصدرها لك جهة حكومية؛ و*registration certificate* هي شهادة التسجيل.'
    example_gloss: وصلتني شهادة التسجيل بعد الموعد بأسبوعين.
  en.a2.unit36.lesson01.teach.mistake:
    title: mistake
    gloss: خطأ
    note: '*mistake* هو شيء كُتب أو عُمل بشكل غير صحيح.'
    example_gloss: يوجد خطأ في عنواني على هذه الاستمارة.
  en.a2.unit36.lesson01.teach.spelled:
    title: spelled
    gloss: مكتوب، مهجّى
    note: تذكر *spelled* بأي حروف وبأي ترتيب تُكتب الكلمة.
    example_gloss: يُكتب اسمي بحرف L واحد، لا بحرفين.
  en.a2.unit36.lesson01.teach.correct:
    title: correct
    gloss: يصحّح
    note: '*correct* هنا فعل: جعل الشيء الخاطئ صحيحًا.'
    example_gloss: يستطيع الموظف تصحيح اسم عائلتي اليوم.
  en.a2.unit36.lesson01.teach.copy:
    title: copy
    gloss: نسخة
    note: '*copy* هي صورة ثانية مطابقة لوثيقة ما.'
    example_gloss: يحتفظ المكتب بنسخة من كل وثيقة.
  en.a2.unit36.lesson01.teach.passport:
    title: passport
    gloss: جواز سفر
    note: '*passport* هو وثيقة السفر التي عليها صورتك.'
    example_gloss: أحضر جواز سفري دائمًا إلى المواعيد الرسمية.
  en.a2.unit36.lesson01.teach.grammar_there_is_there_are:
    title: there is وthere are
    gloss: يوجد خطأ في شهادتي. يوجد خطآن في شهادتي.
    note: نستخدم *there is* مع شيء واحد، و*there are* مع أكثر من شيء واحد.
  en.a2.unit36.lesson02.teach.there_is_a_mistake:
    title: قول إن هناك خطأً
    gloss: يوجد خطأ في شهادة التسجيل الخاصة بي.
    note: '*There is a mistake on...* طريقة موضوعية ورسمية للإبلاغ عن خطأ.'
  en.a2.unit36.lesson02.teach.name_spelled_wrong:
    title: قول ما الخطأ بالضبط
    gloss: اسم عائلتي مكتوب بشكل خاطئ.
    note: '*last name* هو اسم العائلة؛ و*first name* هو الاسم الأول.'
  en.a2.unit36.lesson02.teach.could_you_correct_it:
    title: السؤال عمّا إذا كان التصحيح ممكنًا
    gloss: هل يمكنك تصحيحه من فضلك؟
    note: '*Could you...?* أكثر أدبًا من *Can you...?* وتناسب شباك دائرة رسمية.'
  en.a2.unit36.lesson02.teach.how_long_correction:
    title: السؤال عن مدة الإجراء
    gloss: كم سيستغرق التصحيح؟
    note: '*How long...?* تسأل عن مدة زمنية، لا عن طول.'
  en.a2.unit36.lesson02.teach.grammar_polite_request:
    title: طلبان مهذّبان
    gloss: هل يمكنك تصحيحه من فضلك؟ هل من الممكن الحصول على شهادة جديدة؟
    note: '*Could you...?* تطلب فعل شيء ما؛ أما *Would it be possible to...?* فأكثر تحفظًا، وتسأل هل الأمر ممكن أصلًا.'
  en.a2.unit36.lesson03.teach.working_days:
    title: working days
    gloss: أيام العمل
    note: '*working days* هي الأيام من الاثنين إلى الجمعة، أي دون نهاية الأسبوع.'
    example_gloss: يردّ المكتب على كل رسالة خلال خمسة أيام عمل.
  en.a2.unit36.lesson03.teach.notice_text:
    title: رسالة التصحيح
    gloss: تم استلام طلب التصحيح. سيتم تصحيح شهادة التسجيل الخاصة بك خلال خمسة أيام عمل. يُرجى إحضار جواز سفرك وهذا الخطاب إلى المكتب. الرقم المرجعي 3092.
    note: 'الخطاب الرسمي قصير وموضوعي: ما حدث، وما سيحدث، وما عليك فعله.'
  en.a2.unit36.lesson03.teach.bring_passport_and_notice:
    title: ما الذي يجب إحضاره
    gloss: يُرجى إحضار جواز سفرك وهذا الخطاب إلى المكتب.
    note: تعني *bring ... to ...* إحضار شيء إلى مكان ما.
  en.a2.unit36.lesson04.teach.q_there_is_a_mistake:
    title: ليلى تبلغ عن الخطأ
    gloss: 'تقول ليلى: مرحبًا، يوجد خطأ في شهادة التسجيل الخاصة بي.'
    note: '*Hello* أكثر حيادية من *Hi* وتناسب شباك دائرة رسمية أكثر.'
  en.a2.unit36.lesson04.teach.a_what_is_wrong:
    title: الموظف يستفسر
    gloss: 'يقول الموظف: فهمت. ما المشكلة فيها؟'
    note: 'تعني *I see* هنا: فهمت، أنا أستمع.'
  en.a2.unit36.lesson04.teach.q_name_spelled_wrong:
    title: ليلى تشرح الخطأ وتطلب التصحيح
    gloss: 'تقول ليلى: اسم عائلتي مكتوب بشكل خاطئ. هل يمكنك تصحيحه من فضلك؟'
    note: هما الجملتان نفسهما في الدرس الثاني، لكن الآن إحداهما بعد الأخرى.
  en.a2.unit36.lesson04.teach.a_do_you_have_passport:
    title: الموظف يسأل عن جواز السفر
    gloss: 'يقول الموظف: بالتأكيد. هل جواز سفرك معك؟'
    note: 'تعني *Do you have ... with you?*: هل هو معك الآن؟'
  en.a2.unit36.lesson04.teach.q_here_it_is:
    title: ليلى تقدّم جواز سفرها
    gloss: 'تقول ليلى: نعم، تفضّل.'
    note: نقول *Here it is* ونحن نسلّم شيئًا لشخص ما.
  en.a2.unit36.lesson04.teach.a_copy_and_send:
    title: الموظف يشرح ما يفعله
    gloss: 'يقول الموظف: شكرًا. سأصوّر نسخة وأرسل التصحيح اليوم.'
    note: '*make a copy* تعبير ثابت: أخذ نسخة.'
  en.a2.unit36.lesson04.teach.q_how_long:
    title: ليلى تسأل عن مدة ذلك
    gloss: 'تسأل ليلى: كم سيستغرق التصحيح؟'
    note: هو السؤال نفسه الذي في الدرس الثاني.
  en.a2.unit36.lesson04.teach.a_within_five_working_days:
    title: ردّ الموظف
    gloss: 'يقول الموظف: خلال خمسة أيام عمل.'
    note: تعني *within* خلال مهلة محددة، أي أن الأمر يستغرق خمسة أيام عمل على الأكثر.
  en.a2.unit36.lesson04.teach.q_thank_you:
    title: ليلى تشكر الموظف
    gloss: 'تقول ليلى: شكرًا جزيلًا.'
    note: تجعل *very much* الشكر أكثر تأكيدًا.
