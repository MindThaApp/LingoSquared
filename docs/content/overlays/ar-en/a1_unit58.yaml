teaching:
  en.a1.unit58.lesson01.teach.museum:
    title: museum
    gloss: متحف
    note: '*museum* تعني «متحف»، وهو مكان تُعرض فيه الأعمال الفنية والقطع التاريخية.'
    example_gloss: هذا المتحف قديم جدًا.
  en.a1.unit58.lesson01.teach.ticket:
    title: ticket
    gloss: التذكرة
    note: '*ticket* تعني «تذكرة»، أي ورقة أو بطاقة تتيح لك الدخول.'
    example_gloss: أحتاج إلى تذكرة واحدة، من فضلك.
  en.a1.unit58.lesson01.teach.exhibition:
    title: exhibition
    gloss: المعرض
    note: '*exhibition* تعني «معرض»، أي مجموعة من الأعمال الفنية أو القطع المعروضة للمشاهدة.'
    example_gloss: هناك معرض جديد.
  en.a1.unit58.lesson01.teach.painting:
    title: painting
    gloss: اللوحة
    note: '*painting* تعني «لوحة»، أي عمل فني مرسوم بالألوان.'
    example_gloss: تعجبني هذه اللوحة كثيرًا.
  en.a1.unit58.lesson01.teach.sculpture:
    title: sculpture
    gloss: التمثال
    note: '*sculpture* تعني «تمثال» أو «منحوتة»، أي عمل فني مصنوع من الحجر أو الخشب أو المعدن.'
    example_gloss: هذا التمثال قديم جدًا أيضًا.
  en.a1.unit58.lesson01.teach.guide:
    title: guide
    gloss: المرشد
    note: '*guide* تعني «مرشد»، أي شخص يصطحب الزوار ويشرح لهم.'
    example_gloss: هل يوجد مرشد اليوم؟
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_open:
    title: What time does the museum open?
    gloss: في أي ساعة يفتح المتحف؟
    note: يبدأ هذا السؤال بـ *what time*، ثم الفعل المساعد *does* لأن الفعل الأساسي هو *open*.
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_close:
    title: What time does the museum close?
    gloss: في أي ساعة يغلق المتحف؟
    note: بنية السؤال نفسها كما في *What time does the museum open?*، لكن مع *close* بدل *open*.
  en.a1.unit58.lesson02.teach.two_tickets_please:
    title: Two tickets, please.
    gloss: تذكرتان، من فضلك.
    note: كلمة *please* في آخر الجملة تجعل الطلب مهذبًا، كما عند طلب الطعام.
  en.a1.unit58.lesson02.teach.is_there_a_guide_for_the_exhibition:
    title: Is there a guide for the exhibition?
    gloss: هل يوجد مرشد للمعرض؟
    note: تُستخدم *Is there...?* للسؤال عن وجود شيء ما، وهنا مرشد.
  en.a1.unit58.lesson02.teach.the_museum_is_open_every_day:
    title: The museum is open every day.
    gloss: المتحف مفتوح كل يوم.
    note: '*every day* تعني «كل يوم»، وتأتي في نهاية الجملة.'
  en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings:
    title: I really enjoyed the paintings!
    gloss: استمتعت كثيرًا باللوحات!
    note: '*enjoyed* هي الماضي من *enjoy* (يستمتع)، وتُستخدم للحديث عن شيء ممتع حدث.'
  en.a1.unit58.lesson03.teach.dialogue_line1:
    title: سؤال Daniel
    gloss: 'يقول Daniel: مرحبًا! في أي ساعة يغلق المتحف؟'
    note: '*Hi!* تحية غير رسمية.'
  en.a1.unit58.lesson03.teach.dialogue_line2:
    title: جواب الموظف
    gloss: 'يقول الموظف: نغلق في الساعة الخامسة.'
    note: '*at* + الوقت تحدد متى يحدث الشيء، مثل *at five o''clock*.'
  en.a1.unit58.lesson03.teach.dialogue_line3:
    title: طلب Mia
    gloss: 'تقول Mia: رائع. هل يمكننا الحصول على تذكرتين، من فضلك؟'
    note: '*Can we have...?* طريقة مهذبة لطلب شيء ما.'
  en.a1.unit58.lesson03.teach.dialogue_line4:
    title: السعر
    gloss: 'يقول الموظف: بالتأكيد. المبلغ اثنا عشر دولارًا.'
    note: تُستخدم *That's* + المبلغ لذكر السعر.
  en.a1.unit58.lesson03.teach.dialogue_line5:
    title: سؤال Daniel عن المرشد
    gloss: 'يسأل Daniel: هل يوجد مرشد للمعرض؟'
    note: بنية *Is there...?* نفسها التي تعلمتها في الدرس الثاني.
  en.a1.unit58.lesson03.teach.dialogue_line6:
    title: الموظف يتحدث عن المرشد
    gloss: 'يقول الموظف: نعم، يوجد مرشد قرب المدخل.'
    note: '*there''s* اختصار لـ *there is*.'
  en.a1.unit58.lesson03.teach.dialogue_line7:
    title: Mia تسأل عن الاسم
    gloss: 'تسأل Mia: ما اسم المعرض؟'
    note: '*What is ... called?* هي الطريقة المعتادة للسؤال عن اسم شيء ما.'
  en.a1.unit58.lesson03.teach.dialogue_line8:
    title: اسم المعرض
    gloss: 'يقول الموظف: اسمه Colors of the City.'
    note: '*It''s called...* هي الجواب عن السؤال *What is ... called?*.'
  en.a1.unit58.lesson03.teach.dialogue_line9:
    title: ختام حديث Daniel
    gloss: 'يقول Daniel: شكرًا! لا أطيق الانتظار لرؤية اللوحات.'
    note: '*can''t wait to...* تعني أنك متحمس جدًا لفعل شيء ما.'
  en.a1.unit58.lesson04.teach.museum_notice:
    title: لوحة المتحف
    gloss: 'متحف المدينة: مفتوح كل يوم، من 9:00 إلى 5:00. تذكرة الكبار: $6. المعرض الحالي: Colors of the City، القاعة 2.'
    note: تذكر اللوحة ساعات العمل والسعر واسم المعرض.
  en.a1.unit58.lesson04.teach.reading_passage:
    title: نص عن Daniel و Mia
    gloss: 'زيارة المتحف: في عصر يوم سبت، قرر Daniel و Mia زيارة متحف المدينة معًا. عند المدخل، أخبرهما الموظف أن المتحف يغلق في الساعة الخامسة. اشتريا تذكرتين باثني عشر دولارًا. سأل Daniel عن مرشد، وقال الموظف إن هناك مرشدًا قرب المدخل. زارا المعرض، Colors of the City، ورأيا لوحات جميلة كثيرة في القاعة 2. أعجبت Daniel لوحة لساحة المدينة القديمة، وأعجبت Mia لوحة للنهر عند الغروب. وعندما غادرا، قالت Mia إنها تريد زيارة معرض التماثيل في المرة القادمة.'
    note: '*decided to visit* تستخدم *to* + المصدر بعد *decided* لبيان ما قرر الشخص فعله.'
