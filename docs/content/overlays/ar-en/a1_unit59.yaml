    title: إشعار المصرف
    gloss: 'إشعار المصرف: مفتوح من 9:00 إلى 4:00. جهاز الصراف الآلي في الخارج. حد السحب النقدي اليوم: $100. البطاقات مقبولة.'
    note: يذكر الإشعار ساعات العمل ومكان جهاز الصراف الآلي وحد السحب.
  en.a1.unit59.lesson04.teach.reading_passage:
    title: 'نص: زيارة قصيرة إلى المصرف'
    gloss: 'زيارة قصيرة إلى المصرف: في صباح أحد الأيام، ذهبت Mia و Leila إلى المصرف معًا. أرادت Mia التحقق من رصيدها، وكانت Leila تحتاج إلى نقد. قال الموظف إن جهاز الصراف الآلي في الخارج. استخدمت Leila بطاقتها وسحبت عشرين دولارًا. أدخلت Mia الرقم السري وتحققت من رصيدها. قبل أن تغادرا، قرأتا الإشعار. كان المصرف مفتوحًا من 9:00 إلى 4:00، وكان حد السحب النقدي $100. قالت Mia إن الزيارة كانت سهلة.'
    note: '*took out* هي الماضي من *take out* بمعنى «سحب» مبلغًا من المال.'
