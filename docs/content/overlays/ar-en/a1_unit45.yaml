    example_gloss: نحتاج إلى سيارة إسعاف!
  en.a1.unit45.lesson01.teach.fire_department:
    title: fire department
    gloss: الإطفاء
    note: '*fire department* تعني «الإطفاء» أو «فرقة الإطفاء».'
    example_gloss: فرقة الإطفاء هنا.
  en.a1.unit45.lesson02.teach.call_911:
    title: Call 911!
    gloss: اتصل بالرقم 911!
    note: في الولايات المتحدة تتصل في حالات الطوارئ بالرقم *911*، وهو يختلف عن أرقام الطوارئ في كثير من الدول العربية، لذا من المهم أن تحفظه.
  en.a1.unit45.lesson02.teach.i_need_help:
    title: I need help!
    gloss: أحتاج إلى مساعدة!
    note: '*I need help!* تعني «أحتاج إلى مساعدة!».'
  en.a1.unit45.lesson02.teach.send_the_police:
    title: Send the police, please.
    gloss: أرسلوا الشرطة، من فضلكم.
    note: '*Send the police, please.* تعني «أرسلوا الشرطة، من فضلكم».'
  en.a1.unit45.lesson02.teach.send_an_ambulance:
    title: Send an ambulance, please.
    gloss: أرسلوا سيارة إسعاف، من فضلكم.
    note: '*Send an ambulance, please.* تعني «أرسلوا سيارة إسعاف، من فضلكم».'
  en.a1.unit45.lesson02.teach.theres_a_fire:
    title: There's a fire!
    gloss: هناك حريق!
    note: '*There''s a fire!* تعني «هناك حريق!».'
  en.a1.unit45.lesson02.teach.whats_your_emergency:
    title: What's your emergency?
    gloss: ما هي حالتك الطارئة؟
    note: هذا هو السؤال المعتاد الذي يطرحه موظف الطوارئ الأمريكي بمجرد أن تتصل بالرقم 911.
  en.a1.unit45.lesson03.teach.dialogue_line1:
    title: ليلى تشم رائحة دخان
    gloss: 'تسأل ليلى: دانيال، هل يحترق شيء؟ أشم رائحة دخان!'
    note: '*smell* + اسم من دون حرف جر: I smell smoke تعني «أشم رائحة دخان». انتبه: *I smell of smoke* تعني شيئًا آخر، أي «تفوح مني رائحة دخان».'
  en.a1.unit45.lesson03.teach.dialogue_line2:
    title: شرح دانيال
    gloss: 'يقول دانيال: يا إلهي، اشتعلت النار في المقلاة! كنت أطبخ العشاء.'
    note: '*caught fire* تعبير ثابت يعني أن شيئًا ما اشتعل فجأة.'
  en.a1.unit45.lesson03.teach.dialogue_line3:
    title: تعليمات ليلى
    gloss: 'تقول ليلى: ابقَ هادئًا. أطفئ الموقد! سأطلب المساعدة.'
    note: '*call for help* تعني «طلب المساعدة بالاتصال». لا تحذف كلمة *for* هنا.'
  en.a1.unit45.lesson03.teach.dialogue_line4:
    title: تحذير دانيال
    gloss: 'يقول دانيال: أسرعي، النار تكبر!'
    note: '*getting bigger* تعني «يكبر شيئًا فشيئًا»، وتستعمل get مع صفة للتعبير عن تغيّر الحال.'
  en.a1.unit45.lesson03.teach.dialogue_line5:
    title: ليلى تتصل برقم الطوارئ
    gloss: 'تقول ليلى: مرحبًا، هذه حالة طارئة. هناك حريق في مطبخ صديقي. أرسلوا فرقة الإطفاء من فضلكم.'
    note: هكذا تبدو مكالمة مع مركز الطوارئ في الولايات المتحدة، حيث تتصل بالرقم 911.
  en.a1.unit45.lesson03.teach.dialogue_line6:
    title: ارتياح دانيال
    gloss: 'يقول دانيال: الحمد لله. أظن أنها انطفأت الآن، لكن لننتظر في الخارج تحسبًا لأي طارئ.'
    note: '*just in case* تعني «تحسبًا لأي طارئ» أو «للاحتياط».'
  en.a1.unit45.lesson03.teach.dialogue_line7:
    title: نصيحة ليلى
    gloss: 'تقول ليلى: فكرة جيدة. الانتظار في الخارج أكثر أمانًا إلى أن يصلوا.'
    note: '*safer* هي صيغة التفضيل من safe، وتُصنع بإضافة -er إلى الصفة القصيرة. وفي العربية نستعمل «أكثر أمانًا».'
  en.a1.unit45.lesson04.teach.reading_passage:
    title: نص عن إجراءات الطوارئ
    gloss: 'عند الحريق: أولًا، حافظ على هدوئك. ثانيًا، غادر المبنى فورًا. لا تستخدم المصعد، بل استخدم الدرج. ثالثًا، بمجرد أن تصبح في الخارج، اتصل بالرقم 911 وأعطِ عنوانك. وأخيرًا، انتظر في الخارج حتى تصل فرقة الإطفاء. بعد حريق مطبخ دانيال، انتظر هو وليلى في الخارج تمامًا كما جاء في الإعلان. وصلت فرقة الإطفاء بسرعة وتأكدت من أن كل شيء آمن. وفي وقت لاحق، جاءت ميا لتطمئن عليهما، وارتاحت لأن أحدًا لم يُصَب.'
    note: '*elevator* هي الكلمة الأمريكية للمصعد. وفي الإنجليزية البريطانية تقول *lift*.'
