  en.a1.unit56.lesson02.teach.is_this_table_free:
    title: Is this table free?
    gloss: هل هذه الطاولة شاغرة؟
    note: تعني *free* هنا «شاغرة» أي غير مشغولة، وهي تشبه استعمال «فارغة» أو «شاغرة» في العربية.
  en.a1.unit56.lesson02.teach.can_i_order_now:
    title: Can I order now?
    gloss: هل يمكنني الطلب الآن؟
    note: '*Can I...?* طريقة مباشرة لطلب شيء، وهي أقل رسمية من *could*.'
  en.a1.unit56.lesson02.teach.id_like_the_salad:
    title: I'd like the salad, please.
    gloss: أودّ السلطة، من فضلك.
    note: '*I''d like* هي اختصار *I would like*، وهي الطريقة المهذّبة للطلب في المطعم.'
  en.a1.unit56.lesson02.teach.how_much_is_the_salad:
    title: How much is the salad?
    gloss: بكم السلطة؟
    note: '*How much is...?* سؤال عن السعر.'
  en.a1.unit56.lesson02.teach.could_we_have_the_bill:
    title: Could we have the bill, please?
    gloss: هل يمكننا الحصول على الفاتورة، من فضلك؟
    note: '*Could we have...?* هي الطريقة المهذّبة للطلب، وتقابل في العربية «هل يمكننا الحصول على ...؟» أو «لو سمحت، الفاتورة». فكلمة *could* هنا تجعل الطلب لطيفًا.'
  en.a1.unit56.lesson02.teach.enjoy_your_meal:
    title: Enjoy your meal!
    gloss: بالهناء والشفاء!
    note: '*Enjoy your meal!* عبارة ثابتة يقولها النادل قبل أن تبدأ الأكل. معناها الحرفي «استمتع بوجبتك»، وتقابلها في العربية «بالهناء والشفاء» أو «صحتين وعافية». تعلّمها عبارةً كاملة، لا كلمةً كلمة.'
  en.a1.unit56.lesson03.teach.dialogue_line1:
    title: ليلى تسأل عن الطاولة
    gloss: 'تقول ليلى: مرحبًا! هل هذه الطاولة شاغرة؟'
    note: تستعمل *Is this table free?* كلمة *free* بمعنى شاغرة أي غير مشغولة.
  en.a1.unit56.lesson03.teach.dialogue_line2:
    title: النادل يشير إلى طاولة
    gloss: 'يقول النادل: نعم، تفضّلا بالجلوس هنا.'
    note: '*please sit here* دعوة قصيرة مهذّبة.'
  en.a1.unit56.lesson03.teach.dialogue_line3:
    title: ميا تسأل عن قائمة الطعام
    gloss: 'تقول ميا: هل يمكنني رؤية قائمة الطعام، من فضلك؟'
    note: في *Could I see...?* تظهر *could* المهذّبة مرة أخرى، كما في *could we have the bill*.
  en.a1.unit56.lesson03.teach.dialogue_line4:
    title: النادل يعطي قائمة الطعام
    gloss: 'يقول النادل: بالطبع، تفضّلي.'
    note: '*Of course, here you are* عبارة ثابتة تُقال عند تسليم شيء لشخص.'
  en.a1.unit56.lesson03.teach.dialogue_line5:
    title: طلب ليلى
    gloss: 'تقول ليلى: أودّ الدجاج، من فضلك.'
    note: 'معلومة واحدة منفصلة: طلب ليلى هو الدجاج.'
  en.a1.unit56.lesson03.teach.dialogue_line6:
    title: طلب ميا
    gloss: 'تقول ميا: أودّ السلطة، من فضلك.'
    note: 'معلومة واحدة منفصلة: طلب ميا هو السلطة.'
  en.a1.unit56.lesson03.teach.dialogue_line7:
    title: النادل يتمنى لهما وجبة هنيئة
    gloss: 'يقول النادل: اختيار رائع! بالهناء والشفاء!'
    note: '*Enjoy your meal!* هي العبارة الثابتة التي تُقال قبل أن يبدأ الضيوف الأكل.'
  en.a1.unit56.lesson03.teach.dialogue_line8:
    title: ليلى تسأل عن سعر الدجاج
    gloss: 'تقول ليلى: بكم الدجاج؟'
    note: '*How much is...?* سؤال عن السعر.'
  en.a1.unit56.lesson03.teach.dialogue_line9:
    title: سعر الدجاج
    gloss: 'يقول النادل: الدجاج باثني عشر دولارًا.'
    note: 'معلومة واحدة منفصلة: سعر الدجاج، بمعزل عن السلطة وعن الفاتورة الإجمالية.'
  en.a1.unit56.lesson03.teach.dialogue_line10:
    title: ميا تسأل عن سعر السلطة
    gloss: 'تقول ميا: بكم السلطة؟'
    note: '*How much is...?* هي صيغة السؤال نفسها المستعملة مع الدجاج.'
  en.a1.unit56.lesson03.teach.dialogue_line11:
    title: سعر السلطة
    gloss: 'يقول النادل: السلطة بسبعة دولارات.'
    note: 'معلومة ثانية منفصلة: سعر السلطة.'
  en.a1.unit56.lesson03.teach.dialogue_line12:
    title: "ليلى تطلب الفاتورة"
    gloss: 'تقول ليلى: هل يمكننا الحصول على الفاتورة، من فضلك؟'
    note: تظهر *Could we have...?* المهذّبة مرة أخرى.
  en.a1.unit56.lesson03.teach.dialogue_line13:
    title: الفاتورة الإجمالية
    gloss: 'يقول النادل: المجموع تسعة عشر دولارًا، من فضلك.'
    note: 'معلومة ثالثة منفصلة: الفاتورة الإجمالية، وهي تختلف عن سعر الدجاج وسعر السلطة كلٍّ على حدة.'
  en.a1.unit56.lesson04.teach.restaurant_menu:
    title: قائمة الطعام
    gloss: 'قائمة طعام المطعم: دجاج - 12$. سلطة - 7$. بيتزا - 10$. عصير - 3$.'
    note: تعرض قائمة الطعام أربعة أصناف مع أسعارها.
  en.a1.unit56.lesson04.teach.reading_passage:
    title: 'نص: وجبة في المطعم'
    gloss: في إحدى الأمسيات قررت ليلى وميا تجربة مطعم جديد في وسط المدينة. قادهما نادل إلى طاولة بجانب النافذة. أحضر لهما قائمة طعام فيها دجاج وسلطة وبيتزا وعصير. طلبت ليلى الدجاج، وطلبت ميا السلطة. كان سعر الدجاج اثني عشر دولارًا، وسعر السلطة سبعة دولارات. وبينما كانتا تأكلان، تحدثتا عن دورة التصوير التي تحضرها ميا. وعندما انتهتا، أحضر النادل الفاتورة. كانت تسعة عشر دولارًا للاثنتين معًا. قالت ليلى إن المطعم ممتاز، وقالت ميا إنها تريد أن تأخذ دانيال إلى هنا في المرة القادمة.
    note: '*ordered* هي صيغة الماضي من *order* أي «يطلب».'
