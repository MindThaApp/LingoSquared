    gloss: 'يقول موظف المصرف: لا توجد رسوم شهرية إذا احتفظت برصيد لا يقل عن 500 دولار.'
    note: يذكر الموظف الشرط الذي لا تُفرض معه رسوم شهرية، تمامًا كما في نص الدرس الثالث.
  en.a2.unit27.lesson04.teach.q_when_card:
