teaching:
  en.b1.unit12.lesson01.teach.although:
    title: although
    gloss: مع أن، رغم أن
    note: تبدأ *although* جملة تابعة كاملة تعبّر عن تعارض داخل الجملة نفسها.
    example_gloss: رغم أن المكتب هادئ، تفضّل ميا العمل من المنزل.
  en.b1.unit12.lesson01.teach.even_though:
    title: even though
    gloss: حتى لو، رغم أن
    note: تؤكد *even though* التعارض بقوة أكبر من *although*.
    example_gloss: تظل ليلى مركّزة رغم أن شقتها صغيرة.
  en.b1.unit12.lesson01.teach.despite:
    title: despite
    gloss: رغم، بالرغم من
    note: بعد *despite* يأتي اسم أو صيغة -ing، وليس جملة تابعة كاملة.
    example_gloss: رغم المشتّتات، ينهي دانيال تقريره في الوقت المناسب.
  en.b1.unit12.lesson01.teach.however:
    title: however
    gloss: لكن، مع ذلك
    note: تبدأ *however* جملة جديدة بعد نقطة أو فاصلة منقوطة.
    example_gloss: المكتب هادئ. مع ذلك، تفضّل ميا العمل من المنزل.
  en.b1.unit12.lesson01.teach.valid_point:
    title: valid point
    gloss: نقطة وجيهة، حجة سليمة
    note: تعني *valid point* حجة معقولة أو مقنعة.
    example_gloss: هذه نقطة وجيهة فيما يخص التركيز.
  en.b1.unit12.lesson01.teach.convince:
    title: convince
    gloss: يقنع
    note: تعني *convince* أن تجعل شخصًا ما يقتنع بشيء.
    example_gloss: حاولت ليلى أن تقنع ميا بالعودة إلى المكتب.
  en.b1.unit12.lesson02.teach.office_quiet_home:
    title: although + vollständiger Nebensatz
    gloss: رغم أن المكتب هادئ، تفضّل ميا العمل من المنزل.
    note: '*although* + فاعل + فعل تكوّن جملة تابعة كاملة تدل على التعارض.'
  en.b1.unit12.lesson02.teach.distractions_report:
    title: despite + Nomen
    gloss: رغم المشتّتات، ينهي دانيال تقريره في الوقت المناسب.
    note: بعد *despite* يأتي اسم، وليس جملة تابعة كاملة.
  en.b1.unit12.lesson02.teach.grammar_concession:
    title: although, despite und however
    gloss: 'تبدأ Although و even though جملة كاملة: Although the office is quiet, Mia prefers home. ويأتي بعد Despite اسم أو صيغة -ing، وليس جملة: Despite the distractions, Daniel finishes his report. أما However فتبدأ جملة جديدة بعد نقطة أو فاصلة منقوطة: The office is quiet. However, Mia prefers home.'
    note: 'الصيغة: *although/even though* + جملة تابعة؛ *despite* + اسم أو صيغة -ing؛ *however* ظرف يأتي في بداية جملة جديدة بعد نقطة.'
  en.b1.unit12.lesson03.teach.flexibility:
    title: flexibility
    gloss: المرونة
    note: تعني *flexibility* القدرة على تغيير الخطط أو طريقة العمل بسهولة.
    example_gloss: تتفق ميا وليلى كلتاهما على أن المرونة مهمة.
  en.b1.unit12.lesson03.teach.teamwork:
    title: teamwork
    gloss: العمل الجماعي
    note: يعني *teamwork* العمل معًا كفريق.
    example_gloss: ترى ليلى أن المكتب ييسّر عملًا جماعيًا أفضل.
  en.b1.unit12.lesson03.teach.reading_passage:
    title: 'Lesetext: wo man arbeitet'
    gloss: تختلف ميا وليلى حول مكان العمل. تعمل ميا من المنزل لأنه مريح. ورغم أنها تفتقد رؤية زملائها، فإنها تنجز عملًا أكثر في المنزل. أما ليلى فتفضّل المكتب. ورغم الضجيج، تحب التحدث مع الزملاء أثناء الاستراحات. وحتى لو كانت ميا محقة في نقطتها عن التركيز، ما زالت ليلى ترى أن المكتب يعزز العمل الجماعي. ومع ذلك، تتفق كلتاهما على أن المرونة مهمة.
    note: نص قصير للقراءة فيه عبارات تعبّر عن التعارض.
  en.b1.unit12.lesson04.teach.q_although_nice_home:
    title: Mia führt den Gegensatz ein
    gloss: 'ميا تقول: ليلى، رغم أن المكتب جميل، أنجز عملًا أكثر في المنزل.'
    note: '*although* + جملة كاملة في بداية الجملة.'
  en.b1.unit12.lesson04.teach.a_despite_noise_breaks:
    title: Leila nennt ihre Sicht
    gloss: 'ليلى تقول: أفهم، لكن رغم الضجيج، أستمتع كثيرًا بالتحدث مع الناس أثناء الاستراحات.'
    note: '*despite* + اسم (*the noise*).'
  en.b1.unit12.lesson04.teach.q_valid_point_however:
    title: Mia erkennt den Punkt an, bleibt aber bei ihrer Meinung
    gloss: 'ميا تقول: هذه نقطة وجيهة. ومع ذلك، ما زلت أرى أنني أركّز بشكل أفضل وحدي.'
    note: تبدأ *however* هنا جملة جديدة بعد نقطة.
  en.b1.unit12.lesson04.teach.a_even_though_convince:
    title: Leila zieht Mia auf
    gloss: 'ليلى تقول: حتى لو كنت أفضّل المكتب، فلا أستطيع أن أقنعك بتغيير رأيك، أليس كذلك؟'
    note: تؤكد *even though* التعارض.
  en.b1.unit12.lesson04.teach.q_however_flexibility:
    title: Mia findet einen Kompromiss
    gloss: 'ميا تقول: على الأرجح لا! ومع ذلك، يمكننا أن نتفق على أن المرونة هي الأهم.'
    note: تربط *however* بين فكرتين متعارضتين في جملة جديدة.
  en.b1.unit12.lesson04.teach.a_despite_preferences_time:
    title: Leila beendet das Gespräch positiv
    gloss: 'ليلى تقول: رغم اختلاف تفضيلاتنا، ننجز كل شيء في الوقت المناسب.'
    note: '*despite* + اسم (*our different preferences*).'
