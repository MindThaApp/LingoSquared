  en.b1.unit13.lesson01.teach.which:
    title: which
    gloss: الذي / التي (لغير الأشخاص)
    note: تشير *which* في الجملة الموصولة إلى شيء.
    example_gloss: الدورة التي اختارتها ليلى تبدأ في يونيو.
  en.b1.unit13.lesson01.teach.that_relative:
    title: that
    gloss: الذي / التي (في الجملة المحدِّدة)
    note: تشير *that* في الجملة الموصولة المحدِّدة إلى شخص أو شيء.
    example_gloss: العميل الذي اتصل هذا الصباح يريد موعدًا.
  en.b1.unit13.lesson01.teach.whose:
    title: whose
    gloss: الذي ... (للملكية)
    note: تدل *whose* في الجملة الموصولة على الملكية.
    example_gloss: العميل الذي يُنهون مشروعه الآن وافق على التصميم بالفعل.
  en.b1.unit13.lesson01.teach.where:
    title: where
    gloss: حيث
    note: تشير *where* في الجملة الموصولة إلى مكان.
    example_gloss: المكتب الذي يعمل فيه دانيال يقع في وسط المدينة.
  en.b1.unit13.lesson01.teach.coworker:
    title: coworker
    gloss: زميل، زميلة في العمل
    note: تعني *coworker* شخصًا تعمل معه.
    example_gloss: لدى ميا زميلة تدرس الإسبانية في المساء.
  en.b1.unit13.lesson02.teach.colleague_organized:
    title: who في الجملة الموصولة المحدِّدة
    gloss: الزميلة التي تجلس بجانب ميا منظَّمة جدًا.
    note: تقدّم *who* هنا معلومة لازمة لمعرفة من هو الشخص المقصود.
  en.b1.unit13.lesson02.teach.daniel_leads_projects:
    title: who في الجملة الموصولة غير المحدِّدة
    gloss: دانيال، الذي انضم إلى الفريق في مارس، يقود مشروعين بالفعل.
    note: تدل الفواصل على أن الجملة الموصولة تضيف معلومة إضافية وليست لازمة لتحديد المقصود.
  en.b1.unit13.lesson02.teach.grammar_defining:
    title: الجمل الموصولة المحدِّدة وغير المحدِّدة
    gloss: 'استخدم جملة موصولة محدِّدة بلا فواصل لتقول بالضبط من تقصد أو ما تقصد: The colleague who sits next to Mia is organized. واستخدم جملة موصولة غير محدِّدة بين فواصل لإضافة معلومة عن شخص معروف أصلًا: Daniel, who joined in March, already leads two projects. انتبه: في الإنجليزية لا توضع الفواصل إلا حول الجملة الموصولة غير المحدِّدة.'
    note: 'الصيغة: المحدِّدة = بلا فواصل، وتبيّن من أو ما المقصود؛ غير المحدِّدة = بين فواصل، وتضيف معلومة إضافية.'
  en.b1.unit13.lesson03.teach.deadline:
    title: deadline
    gloss: موعد نهائي
    note: تعني *deadline* التاريخ أو الوقت الذي يجب أن ينتهي العمل قبله.
    example_gloss: الزميلة التي تجلس بجانب ميا تلتزم دائمًا بمواعيدها النهائية.
  en.b1.unit13.lesson03.teach.approve:
    title: approve
    gloss: يوافق على
    note: تعني *approve* أن تقبل شيئًا رسميًا.
    example_gloss: وافق العميل بالفعل على التصميم الأول.
  en.b1.unit13.lesson03.teach.reading_passage:
    title: 'نص للقراءة: المكتب الجديد'
    gloss: تعمل ميا مع عدة أشخاص يجعلون عملها أسهل. دانيال، الذي انضم إلى الفريق في مارس، يقود مشروعين بالفعل. والزميلة التي تجلس بجانب ميا منظَّمة جدًا وتلتزم دائمًا بالمواعيد النهائية. ومكتبهم، الذي يقع في الطابق الخامس، فيه مطبخ صغير يتناول فيه الجميع الغداء معًا. والعميل الذي ينهون مشروعه الآن وافق بالفعل على التصميم الأول.
    note: نص قصير للقراءة فيه جمل موصولة محدِّدة وغير محدِّدة.
  en.b1.unit13.lesson04.teach.q_met_the_woman:
    title: ميا تقدّم الزميلة الجديدة
    gloss: 'ميا تقول: ليلى، هل قابلتِ المرأة التي انضمت للتو إلى فريقنا؟'
    note: تشير *who* هنا إلى *the woman*.
  en.b1.unit13.lesson04.teach.a_whose_desk:
    title: ليلى تسأل عن مكان الزميلة الجديدة
    gloss: 'ليلى تقول: ليس بعد. هل هي الشخص الذي مكتبه قرب النافذة؟'
    note: 'تدل *whose* على الملكية: *whose desk*.'
  en.b1.unit13.lesson04.teach.q_the_designer_who:
    title: ميا تصف الزميلة الجديدة
    gloss: 'ميا تقول: نعم، هي بالضبط. هي المصمّمة التي أنهت مشروع الشعار.'
    note: تشير *who* إلى *the designer*.
  en.b1.unit13.lesson04.teach.a_which_won_award:
    title: ليلى تتذكّر المشروع
    gloss: 'ليلى تقول: آه، أتذكّر. هل هو المشروع الذي فاز بالجائزة الشهر الماضي؟'
    note: تشير *which* إلى *the project*.
  en.b1.unit13.lesson04.teach.q_office_smaller:
    title: ميا تتحدث عن مكتبها السابق
    gloss: 'ميا تقول: بالضبط. المكتب الذي كانت تعمل فيه سابقًا كان أصغر بكثير من مكتبنا.'
    note: 'تشير *where* إلى مكان: *the office*.'
  en.b1.unit13.lesson04.teach.a_kitchen_where:
    title: ليلى تفهم لماذا تحب المطبخ
    gloss: 'ليلى تقول: هذا يفسّر لماذا تحب المطبخ الذي يتناول فيه الجميع الغداء معًا.'
    note: تشير *where* إلى *the kitchen*.
