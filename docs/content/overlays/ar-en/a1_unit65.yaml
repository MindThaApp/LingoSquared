    title: ورقة الإرجاع
    gloss: 'ورقة الإرجاع: قميص أزرق. المقاس صغير. استبداله بمقاس أكبر. الإيصال مطلوب.'
    note: تذكر الورقة الغرض والمقاس والإجراء والإيصال.
  en.a1.unit65.lesson04.teach.reading_passage:
    title: 'نص: استبدال في المتجر'
    gloss: 'استبدال في المتجر: اشترى Daniel قميصًا أزرق، لكن المقاس كان صغيرًا جدًا. عاد إلى المتجر ومعه الإيصال. طلب الموظف الإيصال وعرض مقاسًا أكبر. استبدل Daniel القميص. لم يحتج إلى استرداد المال لأن القميص الأزرق الأكبر كان مناسبًا.'
    note: '*exchanged* هي الماضي من *exchange*.'
