  en.a1.unit30.lesson03.teach.i_like_pattern:
    title: I like reading.
    gloss: أحب القراءة.
    note: تستخدم *I like* + فعلًا بصيغة *-ing* لتقول إنك تحب شيئًا.
  en.a1.unit30.lesson03.teach.dialogue_line1:
    title: سؤال ليلى
    gloss: 'تسأل ليلى: ماذا تفعل في وقت فراغك يا دانيال؟'
    note: تبدأ ليلى الحوار بسؤال مباشر لدانيال.
  en.a1.unit30.lesson03.teach.dialogue_line2:
    title: "إجابة دانيال"
    gloss: 'يقول دانيال: أذهب للجري غالبًا. وأطبخ أحيانًا. وأنتِ؟'
    note: يذكر دانيال هوايتين مع تكرارهما، ثم يعيد السؤال بـ*What about you?*
  en.a1.unit30.lesson03.teach.dialogue_line3:
    title: ليلى والرسم
    gloss: 'تقول ليلى: أحب الرسم. أرسم كل عطلة أسبوع تقريبًا.'
    note: '*almost every weekend* تعني «كل عطلة أسبوع تقريبًا».'
  en.a1.unit30.lesson03.teach.dialogue_line4:
    title: سؤال دانيال التالي
    gloss: 'يقول دانيال: رائع! هل تلعبين ألعاب الفيديو أحيانًا؟'
    note: تستخدم *Do you ever...?* للسؤال عمّا إذا كان الشخص يفعل شيئًا في أي وقت.
  en.a1.unit30.lesson03.teach.dialogue_line5:
    title: جواب ليلى الأخير
    gloss: 'تقول ليلى: نادرًا. أفضّل قراءة كتاب.'
    note: '*I prefer...* تعني: أفضّل... أو أحب أن أفعل... أكثر.'
  en.a1.unit30.lesson04.teach.reading_passage:
    title: نص عن الهوايات
    gloss: لدى دانيال وليلى هوايات مختلفة. يذهب دانيال دائمًا للجري صباح السبت، ويطبخ أحيانًا لأصدقائه. أما ليلى فلا تذهب للجري أبدًا، لكنها ترسم غالبًا في عطلة نهاية الأسبوع. كلاهما يحب ألعاب الفيديو، لكنهما نادرًا ما يلعبانها معًا.
    note: يقارن هذا النص مباشرة بين هوايات دانيال وليلى ومدى تكرارها.
