    note: '*often* تعني «غالبًا». لاحظ ترتيب الكلمات في الإنجليزية: *She often cooks dinner* (الفاعل، ثم *often*، ثم الفعل). في العربية يمكن أن يتقدّم الظرف أو الفعل («غالبًا ما تطبخ العشاء لعائلتها»)، أما في الإنجليزية فيبقى الفاعل قبل الفعل ويقع ظرف التكرار بينهما.'
