    note: '*sometimes* تعني «أحيانًا». في العربية يمكن أن تبدأ الجملة بالظرف («أحيانًا أذهب للجري»). وفي الإنجليزية يمكنك أيضًا أن تبدأ بـ*sometimes*، لكن يبقى الفاعل قبل الفعل: *Sometimes I go running*، ولا يجوز تقديم الفعل على الفاعل.'
