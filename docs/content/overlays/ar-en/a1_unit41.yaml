    title: دعوة ميا
    gloss: 'تسأل ميا: سأُعدّ المعكرونة الليلة. هل تريد أن تساعدني في الطبخ؟'
    note: '*Do you want to help me* + فعل*?* طريقة طبيعية لدعوة شخص إلى المساعدة.'
  en.a1.unit41.lesson03.teach.dialogue_line2:
    title: ردّ دانيال
    gloss: 'يقول دانيال: بالتأكيد! لكنني لست طباخًا ماهرًا.'
    note: تدل *though* في آخر الجملة على تعارض خفيف، وتقابل «لكن» أو «غير أن» في العربية.
  en.a1.unit41.lesson03.teach.dialogue_line3:
    title: تشجيع ميا
    gloss: 'تقول ميا: لا بأس، سأريك. هل يمكنك تقطيع هذا البصل؟'
    note: تعني *I'll show you* سأريك.
  en.a1.unit41.lesson03.teach.dialogue_line4:
    title: سؤال دانيال
    gloss: 'يقول دانيال: لا مشكلة. ما مدى صغر القطع التي يجب أن أقطّعها؟'
    note: تُستعمل *should* لطلب النصيحة.
  en.a1.unit41.lesson03.teach.dialogue_line5:
    title: شرح ميا
    gloss: 'تقول ميا: قطع صغيرة، هكذا. والآن لنسلق المعكرونة.'
    note: تعني *like this* هكذا، بهذه الطريقة.
  en.a1.unit41.lesson03.teach.dialogue_line6:
    title: ردّ دانيال
    gloss: 'يقول دانيال: هل يمكنني تذوّق الصلصة؟ إنها لذيذة!'
    note: '*Can I* + فعل*?* تطلب الإذن.'
  en.a1.unit41.lesson03.teach.dialogue_line7:
    title: خاتمة ميا
    gloss: 'تقول ميا: رائع! العشاء جاهز تقريبًا.'
    note: تعني *almost ready* جاهزًا تقريبًا.
  en.a1.unit41.lesson04.teach.reading_passage:
    title: نص عن الطبخ معًا
    gloss: لدى دانيال وليلى وميا مهارات طبخ مختلفة. منذ انتقلت ليلى إلى شقة جديدة قريبة من ميا، صار الأصدقاء الثلاثة يطبخون العشاء معًا في كثير من الأحيان. ليلى طباخة ماهرة. وكثيرًا ما تُعدّ المعكرونة بوصفة أمها القديمة. تحب ميا الطبخ أيضًا، وقد علّمت دانيال كيف يقطّع البصل دون أن يجرح أصابعه. دانيال ليس طباخًا ماهرًا بعد، لكنه يتعلم بسرعة. في الليلة الماضية طلبت ميا من دانيال أن يساعدها في إعداد المعكرونة. قطّع البصل بينما سلقت ميا المعكرونة وحضّرت الصلصة. تذوّق دانيال الصلصة وقال إنها لذيذة. وصلت ليلى في اللحظة التي كان فيها العشاء جاهزًا، وتناول الثلاثة الطعام معًا في مطبخ ميا.
    note: تعني *arrived just as dinner was ready* أنها وصلت في اللحظة التي أصبح فيها العشاء جاهزًا.
