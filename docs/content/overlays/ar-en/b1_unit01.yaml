teaching:
  en.b1.unit01.lesson01.teach.must:
    title: must
    gloss: يجب (إلزام شخصي قوي)
    note: '*must* تعبّر عن إلزام شخصي قوي، أي شيء تراه أنت مهمًّا جدًّا.'
    example_gloss: يجب أن أنهي هذه المهمة اليوم.
  en.b1.unit01.lesson01.teach.have_to:
    title: have to
    gloss: يجب (إلزام من الخارج)
    note: '*have to* تعبّر عن إلزام يأتي من الخارج، مثل قاعدة أو موعد نهائي.'
    example_gloss: يجب أن أدفع الإيجار قبل يوم الجمعة.
  en.b1.unit01.lesson01.teach.should:
    title: should
    gloss: ينبغي
    note: '*should* نصيحة وتوصية، وليست إلزامًا صارمًا.'
    example_gloss: ينبغي أن تتصل بطبيب الأسنان قريبًا.
  en.b1.unit01.lesson01.teach.task:
    title: task
    gloss: مهمة
    note: '*task* هي مهمة أو عمل يجب إنجازه.'
    example_gloss: بقيت لديّ مهمة واحدة أخرى لأنجزها.
  en.b1.unit01.lesson01.teach.rent:
    title: rent
    gloss: إيجار
    note: '*rent* هو المال الذي تدفعه مقابل السكن.'
    example_gloss: موعد استحقاق الإيجار يوم الجمعة.
  en.b1.unit01.lesson01.teach.appointment:
    title: appointment
    gloss: موعد
    note: '*appointment* هو موعد محدد مع شخص ما، مثل موعد عند الطبيب.'
    example_gloss: لديّ موعد عند طبيب الأسنان هذا الأسبوع.
  en.b1.unit01.lesson02.teach.must_finish_task:
    title: eine starke Pflicht ausdrücken
    gloss: يجب أن أنهي هذه المهمة اليوم.
    note: '*I must* تعبّر عن إلزام شخصي قوي.'
  en.b1.unit01.lesson02.teach.have_to_pay_rent:
    title: eine Pflicht von außen ausdrücken
    gloss: يجب أن أدفع الإيجار قبل يوم الجمعة.
    note: '*I have to* تعبّر عن إلزام يأتي من الخارج، مثل موعد الدفع.'
  en.b1.unit01.lesson02.teach.she_has_to_make:
    title: Form bei 'she'
    gloss: يجب عليها أن تحجز موعدًا.
    note: مع *he/she/it* تصبح *have to* هي *has to*.
  en.b1.unit01.lesson02.teach.you_should_call:
    title: eine Empfehlung geben
    gloss: ينبغي أن تتصل وتؤكّد الموعد.
    note: '*should* تعطي نصيحة، وليست إلزامًا صارمًا مثل *must* أو *have to*.'
  en.b1.unit01.lesson02.teach.grammar_agreement:
    title: Formen von 'have to'
    gloss: يجب أن أذهب. يجب عليها أن تذهب. يجب أن نذهب. يجب عليهم أن يذهبوا.
    note: مع *he/she/it* فقط تصبح *have* هي *has*؛ ومع بقية الضمائر تبقى *have to*.
  en.b1.unit01.lesson03.teach.should_have_called:
    title: Reue über die Vergangenheit ausdrücken
    gloss: كان ينبغي أن أتصل في وقت أبكر.
    note: '*should have* مع التصريف الثالث للفعل تعبّر عن الندم على شيء لم يُفعل.'
    example_gloss: كان ينبغي أن أتصل في وقت أبكر.
  en.b1.unit01.lesson03.teach.must_not:
    title: must not
    gloss: لا يجوز
    note: '*must not* تعني منعًا، أي أن الشيء غير مسموح إطلاقًا. انتبه: *must not* لا تعني «ليس مضطرًّا»، بل «لا يجوز»؛ أما «ليس مضطرًّا» فهي *don''t have to*.'
    example_gloss: لا يجوز أن تنسى مرة أخرى.
  en.b1.unit01.lesson03.teach.dont_have_to:
    title: don't have to
    gloss: ليس مضطرًّا / لا يلزم
    note: '*don''t have to* تعني أن الشيء ليس إلزاميًّا؛ وهذا يختلف عن *must not* (المنع).'
    example_gloss: لست مضطرًّا إلى المجيء إن كنت مشغولًا.
  en.b1.unit01.lesson03.teach.grammar_past_regret:
    title: Reue, Verbot und keine Pflicht
    gloss: كان ينبغي أن أتصل. لقد نسيت. لا يجوز أن تنسى مرة أخرى. لست مضطرًّا إلى المجيء.
    note: '*should have* مع التصريف الثالث للفعل تعبّر عن الندم على الماضي. *must not* منع؛ و*don''t have to* تعني عدم الإلزام، لكن الأمر مسموح.'
  en.b1.unit01.lesson03.teach.reading_passage:
    title: 'Lesetext: das Fitnessstudio'
    gloss: أمس نسي دانيال أن يجدّد اشتراكه في النادي الرياضي. كان ينبغي أن يضبط تذكيرًا على هاتفه. الآن يجب عليه أن يدفع رسم تأخير. ولا يجوز أن ينسى مرة أخرى في الشهر القادم.
    note: نص قصير عن خطأ دانيال ونتائجه.
  en.b1.unit01.lesson04.teach.q_renew_gym:
    title: Leila fragt nach der Mitgliedschaft
    gloss: 'ليلى تقول: دانيال، هل جدّدت اشتراكك في النادي الرياضي؟'
    note: سؤال مباشر للتحقق مما إذا كان أمر ما قد أُنجز.
  en.b1.unit01.lesson04.teach.a_forgot_should_have:
    title: 'Daniels Antwort: vergessen'
    gloss: 'دانيال يقول: يا إلهي، لقد نسيت! كان ينبغي أن أفعل ذلك الأسبوع الماضي.'
    note: '*I should have done that* تعبّر عن الندم على أمر لم يُنجز.'
  en.b1.unit01.lesson04.teach.q_call_today:
    title: Leila warnt Daniel
    gloss: 'ليلى تقول: يجب أن تتصل بهم اليوم، وإلا ستدفع رسم تأخير.'
    note: '*must* هنا تحذير شخصي عاجل.'
  en.b1.unit01.lesson04.teach.a_also_pay_rent:
    title: Daniel nennt weitere Pflichten
    gloss: 'دانيال يقول: معك حق. يجب عليّ أيضًا أن أدفع الإيجار قبل يوم الجمعة، وينبغي أن أتصل بطبيب الأسنان أيضًا.'
    note: يجمع دانيال في ردّ واحد بين *have to* (إلزام) و*should* (نصيحة).
  en.b1.unit01.lesson04.teach.q_dont_have_to:
    title: Leila beruhigt Daniel
    gloss: 'ليلى تقول: لست مضطرًّا إلى إنجاز كل شيء اليوم. لكن لا يجوز أن تنسى النادي الرياضي مرة أخرى.'
    note: تقابل ليلى بين *don't have to* (لا إلزام) و*must not* (منع).
  en.b1.unit01.lesson04.teach.a_more_organized:
    title: Daniel fasst einen Vorsatz
    gloss: 'دانيال يقول: أعرف. يجب أن أكون أكثر تنظيمًا هذا الشهر.'
    note: '*I must be* تعبّر هنا عن عزم شخصي.'
