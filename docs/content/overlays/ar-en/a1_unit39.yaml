teaching:
  en.a1.unit39.lesson01.teach.neighborhood:
    title: neighborhood
    gloss: حي
    note: تعني *neighborhood* الحي، أي المنطقة المحيطة ببيتك بما فيها من شوارع ومبانٍ قريبة.
    example_gloss: أحب حيّي.
  en.a1.unit39.lesson01.teach.neighbor:
    title: neighbor
    gloss: جار / جارة
    note: تعني *neighbor* الجار، أي شخصًا يسكن بجانبك أو قريبًا منك.
    example_gloss: جاري مفيد جدًا.
  en.a1.unit39.lesson01.teach.nearby:
    title: nearby
    gloss: قريب / بالقرب
    note: تعني *nearby* قريبًا.
    example_gloss: توجد حديقة قريبة.
  en.a1.unit39.lesson01.teach.quiet:
    title: quiet
    gloss: هادئ
    note: تعني *quiet* هادئًا، أي بلا ضجيج كثير.
    example_gloss: شارعي هادئ جدًا في الليل.
  en.a1.unit39.lesson01.teach.noisy:
    title: noisy
    gloss: مزعج / صاخب
    note: تعني *noisy* مليئًا بالأصوات العالية.
    example_gloss: الشارع المجاور لشارعي صاخب.
  en.a1.unit39.lesson01.teach.friendly:
    title: friendly
    gloss: ودود
    note: تعني *friendly* ودودًا.
    example_gloss: جيراني ودودون جدًا.
  en.a1.unit39.lesson02.teach.live_in_a_neighborhood:
    title: live in a neighborhood
    gloss: يسكن في حي
    note: تعني *live in a neighborhood* السكن في حي.
    example_gloss: أسكن في حي هادئ.
  en.a1.unit39.lesson02.teach.get_along_with_your_neighbors:
    title: get along with your neighbors
    gloss: التفاهم الجيد مع جيرانك
    note: تعني *get along with your neighbors* أن تكون لك علاقة طيبة وودّية مع الناس الذين يسكنون قريبًا منك.
    example_gloss: أتفاهم جيدًا مع جيراني.
  en.a1.unit39.lesson02.teach.close_to:
    title: close to
    gloss: قريب من
    note: تعني *close to* قريبًا من (مكان ما).
    example_gloss: شقتي قريبة من متجر البقالة.
  en.a1.unit39.lesson02.teach.a_five_minute_walk:
    title: a five-minute walk
    gloss: مسافة خمس دقائق سيرًا
    note: '*a five-minute walk* تركيب إنجليزي ثابت: رقم + اسم مفرد بينهما شرطة، ويأتي *walk* بصيغة المفرد دائمًا. وبالعربية نقول ببساطة «خمس دقائق سيرًا».'
    example_gloss: الحديقة على بُعد خمس دقائق سيرًا من بيتي.
  en.a1.unit39.lesson02.teach.say_hello_to:
    title: say hello to
    gloss: يلقي التحية على
    note: تعني *say hello to* إلقاء التحية على شخص ما.
    example_gloss: ألقي التحية على جاري دائمًا في الصباح.
  en.a1.unit39.lesson02.teach.whats_your_neighborhood_like_question:
    title: What's your neighborhood like?
    gloss: كيف هو حيّك؟
    note: يسأل *What's ... like?* عن وصف الشيء، لا عن مدى حبك له.
  en.a1.unit39.lesson03.teach.dialogue_line1:
    title: سؤال ليلى
    gloss: 'تقول ليلى: ربما أنتقل قريبًا. كيف هو حيّك يا ميا؟'
    note: 'يعبّر *might* + فعل عن احتمال: قد يحدث وقد لا يحدث.'
  en.a1.unit39.lesson03.teach.dialogue_line2:
    title: "إجابة ميا"
    gloss: 'تقول ميا: أحبه حقًا. إنه هادئ وتوجد حديقة قريبة.'
    note: تعني *there's a park nearby* توجد حديقة قريبة.
  en.a1.unit39.lesson03.teach.dialogue_line3:
    title: سؤال ليلى
    gloss: 'تقول ليلى: يبدو جميلًا. هل هو قريب من متجر بقالة؟'
    note: '*That sounds nice* ردّ طبيعي على الأخبار الطيبة.'
  en.a1.unit39.lesson03.teach.dialogue_line4:
    title: "إجابة ميا"
    gloss: 'تقول ميا: نعم، يوجد متجر على بُعد خمس دقائق فقط سيرًا من مبناي.'
    note: تعني *just* هنا «فقط»، وهي تؤكد قِصر المسافة.
  en.a1.unit39.lesson03.teach.dialogue_line5:
    title: سؤال ليلى
    gloss: 'تسأل ليلى: وماذا عن جيرانك؟ هل هم ودودون؟'
    note: '*What about ...?* طريقة طبيعية لفتح موضوع جديد.'
  en.a1.unit39.lesson03.teach.dialogue_line6:
    title: "إجابة ميا"
    gloss: 'تقول ميا: ودودون جدًا! جاري السيد لوبيز يسقي نباتاتي عندما أكون غائبة.'
    note: تعني *waters my plants* يسقي نباتاتي، و*water* هنا فعل في الإنجليزية.
  en.a1.unit39.lesson03.teach.dialogue_line7:
    title: ردّ ليلى
    gloss: 'تقول ليلى: هذا لطيف جدًا. أظن أنني أود السكن قريبًا منك!'
    note: 'تعني *I''d like to* + فعل: أودّ أن أفعل كذا.'
  en.a1.unit39.lesson04.teach.reading_passage:
    title: نص عن ثلاثة أحياء
    gloss: دانيال وليلى وميا يسكنون في ثلاثة أحياء مختلفة. حي دانيال مزدحم، وفيه مطاعم ومتاجر قريبة من مبنى شقته. يعرف عددًا من جيرانه ويلقي عليهم التحية في الممر كثيرًا. تسكن ليلى في حي هادئ قريب من المسبح الذي تسبح فيه. لدى جارتها المقابلة لها كلب كبير ينبح كثيرًا. حي ميا هادئ أيضًا، وفيه متجر بقالة على بُعد خمس دقائق سيرًا من مبناها. جارها السيد لوبيز ودود جدًا ويسقي نباتاتها عندما تكون غائبة. بعد الحديث مع ميا، قررت ليلى أنها تريد البحث عن شقة قريبة منها.
    note: تعني *decided she wants to look for* أنها قررت أنها تريد البحث عن شقة.
