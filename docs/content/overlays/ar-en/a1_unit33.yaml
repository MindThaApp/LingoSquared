    title: كيف تصل إلى مكان ما
  en.a1.unit33.lesson03.dialogue_commute_talk:
    title: 'حوار: الحديث عن التنقل إلى العمل'
  en.a1.unit33.lesson04.two_commuters:
    title: 'قراءة: رحلتان مختلفتان إلى العمل'
teaching:
  en.a1.unit33.lesson01.teach.bus:
    title: bus
    gloss: حافلة
    note: '*bus* تعني «حافلة». الفعل المرافق لها هو *take*: *take the bus*. انتبه: في العربية يمكنك استخدام التركيب نفسه لأي وسيلة نقل («أركب الحافلة»، «أركب القطار»)، أما في الإنجليزية فلكل وسيلة نقل فعلها الخاص (*take* و*drive* و*ride*)، وعليك تعلّم كل منها على حدة.'
    example_gloss: أركب الحافلة.
  en.a1.unit33.lesson01.teach.train:
    title: train
    gloss: قطار
    note: '*train* تعني «قطار». كما في *bus*، تستخدم هنا *take*: *take the train*.'
    example_gloss: هي تركب القطار.
  en.a1.unit33.lesson01.teach.car:
    title: car
    gloss: سيارة
    note: '*car* تعني «سيارة». مع السيارة لا تستخدم *take* بل *drive*: *drive my car*. وهذا فعل مختلف عن فعل الحافلة والقطار.'
    example_gloss: أقود سيارتي إلى العمل.
  en.a1.unit33.lesson01.teach.bike:
    title: bike
    gloss: دراجة هوائية
    note: '*bike* تعني «دراجة هوائية». هنا تستخدم فعلًا آخر: *ride a bike* (لا *take* ولا *drive*).'
    example_gloss: أركب دراجتي إلى العمل كل يوم.
  en.a1.unit33.lesson01.teach.walk:
    title: walk
    gloss: يمشي
    note: '*walk* تعني «يمشي». لا تحتاج هنا إلى فعل إضافي مثل *take* أو *drive* أو *ride*، لأن *walk* هي الفعل نفسه: *walk to work*، وليس *take a walk to work*.'
    example_gloss: أمشي إلى العمل.
  en.a1.unit33.lesson02.teach.how_get_to:
    title: How do you get to work?
    gloss: كيف تصل إلى العمل؟
    note: يبدأ هذا السؤال بالفعل المساعد *do* لأن الفعل الأساسي هو *get*. في العربية لا نحتاج إلى فعل مساعد في مثل هذا السؤال، أما في الإنجليزية فيلزم.
  en.a1.unit33.lesson02.teach.usually:
    title: usually
    gloss: عادةً
    note: '*usually* تعني «عادةً». تأتي هذا الظرف في الإنجليزية غالبًا بين الفاعل والفعل الأساسي: *I usually take the bus*.'
    example_gloss: عادةً أركب الحافلة.
  en.a1.unit33.lesson02.teach.minutes:
    title: minutes
    gloss: دقائق
    note: '*minutes* تعني «دقائق». في *It takes twenty minutes* الضمير *it* فاعل شكلي لا معنى له بذاته، ووظيفته ملء موضع الفاعل. العربية لا تحتاج إلى ضمير هنا («تستغرق عشرين دقيقة»)، لكن الإنجليزية تتطلب فاعلًا دائمًا.'
    example_gloss: تستغرق عشرين دقيقة.
  en.a1.unit33.lesson02.teach.late:
    title: late
    gloss: متأخر
    note: '*late* تعني «متأخر» (يصل بعد الموعد المتوقع): *The bus is often late.*'
    example_gloss: الحافلة متأخرة في كثير من الأحيان.
  en.a1.unit33.lesson02.teach.faster:
    title: faster
    gloss: أسرع
    note: '*faster* تعني «أسرع»: صيغة المقارنة من *fast* بإضافة *-er*. وللمقارنة تستخدم *than*: *faster than the bus*.'
    example_gloss: القطار أسرع من الحافلة.
  en.a1.unit33.lesson03.teach.dialogue_line1:
    title: سؤال ليلى
    gloss: 'تسأل ليلى: كيف تصل إلى العمل يا دانيال؟'
    note: بداية الحوار بالسؤال *How do you get to work?*
  en.a1.unit33.lesson03.teach.dialogue_line2:
    title: "إجابة دانيال"
    gloss: 'يقول دانيال: عادةً أركب الحافلة. تستغرق نحو عشرين دقيقة.'
    note: 'شيئان معًا: الفعل *take* مع الحافلة، والفاعل الشكلي *it* في *It takes about twenty minutes*.'
  en.a1.unit33.lesson03.teach.dialogue_line3:
    title: سؤال ليلى
    gloss: 'تسأل ليلى: هل يعجبك ذلك؟'
    note: سؤال إجابته نعم أو لا يبدأ بـ*Do*.
  en.a1.unit33.lesson03.teach.dialogue_line4:
    title: "إجابة دانيال"
    gloss: 'يقول دانيال: لا بأس به، لكن الحافلة متأخرة في كثير من الأحيان. وأنتِ؟'
    note: '*How about you?* تعني «وأنت؟»: طريقة قصيرة لإعادة السؤال إلى المحاور.'
  en.a1.unit33.lesson03.teach.dialogue_line5:
    title: "إجابة ليلى"
    gloss: 'تقول ليلى: أنا أقود سيارتي. هذا أسرع، لكن إيجاد موقف للسيارة صعب.'
    note: مع السيارة تستخدم الفعل *drive* لا *take*.
  en.a1.unit33.lesson04.teach.reading_passage:
    title: نص عن ليلى ودانيال
    gloss: تقود ليلى سيارتها إلى العمل كل يوم. تستغرق الرحلة نحو خمس عشرة دقيقة، لكن إيجاد موقف قرب مكتبها صعب. ليس لدى دانيال سيارة، لذا يركب الحافلة. تستغرق رحلته بالحافلة عشرين دقيقة وتتأخر الحافلة أحيانًا، لكنه لا يضطر إلى القلق بشأن موقف السيارة.
    note: 'انتبه: تستخدم *take* مع الحافلة والقطار، و*drive* مع السيارة.'
