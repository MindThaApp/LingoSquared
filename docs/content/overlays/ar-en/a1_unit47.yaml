    gloss: تم تأكيد موعدك.
    note: '*Your appointment is confirmed.* تعني «تم تأكيد موعدك».'
  en.a1.unit47.lesson03.teach.dialogue_line1:
    title: سؤال Mia
    gloss: 'تسأل Mia: Leila، هل Max بخير؟ يبدو متعبًا قليلًا في الآونة الأخيرة.'
    note: '*He seems a little tired lately.* تعني «يبدو متعبًا قليلًا في الآونة الأخيرة».'
  en.a1.unit47.lesson03.teach.dialogue_line2:
    title: شرح Leila
    gloss: 'تقول Leila: إنه بخير، لا تقلقي. حان وقت فحصه السنوي فقط. يجب أن أتصل بالطبيب البيطري.'
    note: '*due for* تعني «حان وقت ...»، وتُستعمل لشيء يجب أن يحدث في وقته.'
  en.a1.unit47.lesson03.teach.dialogue_line3:
    title: Leila تتصل بالطبيب البيطري
    gloss: 'تقول Leila: مرحبًا، أود أن أحجز موعدًا لفحص كلبي.'
    note: '*I''d like to* أكثر تهذيبًا من *I want to*، وتناسب طلب موعد.'
  en.a1.unit47.lesson03.teach.dialogue_line4:
    title: سؤال Mia
    gloss: 'تسأل Mia: ماذا قالوا؟'
    note: '*did they say* تستعمل did فعلًا مساعدًا لسؤال في الماضي.'
  en.a1.unit47.lesson03.teach.dialogue_line5:
    title: "إجابة ليلى"
    gloss: 'تقول Leila: هم متاحون يوم الخميس في الساعة الثالثة بعد الظهر.'
    note: '*at 3pm* تستعمل at مع وقت محدد.'
  en.a1.unit47.lesson03.teach.dialogue_line6:
    title: سؤال Mia للتأكد
    gloss: 'تسأل Mia: هل هذا الوقت يناسبك؟'
    note: '*Does that time work for you?* هي صيغة السؤال من that time works for you، وتُستعمل فيها does.'
  en.a1.unit47.lesson03.teach.dialogue_line7:
    title: تأكيد Leila
    gloss: 'تقول Leila: نعم، يناسبني. يوم الخميس في الساعة الثالثة بعد الظهر، شكرًا لكم! تم تأكيد موعد Max.'
    note: '*Max''s appointment* تدل ''s على الملكية، أي «موعد Max».'
  en.a1.unit47.lesson04.teach.reading_passage:
    title: نص عن حجز موعد
    gloss: 'كيف تحجز موعدًا: إذا كنت تحتاج إلى زيارة طبيب أو طبيب أسنان أو جهة خدمات أخرى، فعادةً عليك أن تحجز موعدًا أولًا. اتصل وقل إنك تود حجز موعد. سيخبرك موظف الاستقبال بالأيام والأوقات المتاحة. اختر وقتًا يناسبك وسيؤكدون موعدك. وإذا تغيّر شيء، فاتصل مرة أخرى واطلب تغيير الموعد. في الأسبوع الماضي اتصلت Leila بالطبيب البيطري لتحجز موعدًا للفحص السنوي لكلبها Max. كانوا متاحين يوم الخميس في الساعة الثالثة بعد الظهر، وأكدت Leila الوقت. ولدى Daniel موعد أيضًا، فهو سيذهب إلى طبيب الأسنان صباح الاثنين لإجراء فحص. قال إنه ليس متوترًا، لكنه مشغول قليلًا هذا الأسبوع.'
    note: '*a little busy this week* تعني «مشغول قليلًا هذا الأسبوع».'
