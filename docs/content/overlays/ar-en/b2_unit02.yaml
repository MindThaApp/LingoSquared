teaching:
  en.b2.unit02.lesson01.teach.may:
    title: may
    gloss: قد، يحتمل
    note: تعبّر *may* عن الاحتمال. وهي هنا لا تعني الإذن كما في *May I...?*.
    example_gloss: قد يكون هذا صحيحًا.
  en.b2.unit02.lesson01.teach.might:
    title: might
    gloss: ربما، وارد (بتحفظ أكبر)
    note: تعبّر *might* عن احتمال حذر، وغالبًا ما يكون أضعف يقينًا قليلًا من *may*.
    example_gloss: ربما يكون هذا صحيحًا.
  en.b2.unit02.lesson01.teach.must:
    title: must
    gloss: لا بد أن، من المؤكد أن
    note: تعبّر *must* هنا عن استنتاج قوي مبني على أدلة، لا عن واجب أو إلزام.
    example_gloss: لا بد أن يكون هذا صحيحًا.
  en.b2.unit02.lesson01.teach.cannot:
    title: cannot
    gloss: لا يمكن أن، يستحيل أن
    note: تستخدم *cannot* حين يستبعد الدليل أمرًا ما. وللماضي تصبح *cannot have been*.
    example_gloss: لا يمكن أن يكون هذا صحيحًا.
  en.b2.unit02.lesson01.teach.deduction:
    title: deduction
    gloss: استنتاج مبني على الأدلة
    note: '*deduction* هو الاستدلال انطلاقًا من القرائن، لا مجرد التخمين.'
    example_gloss: استنتاج ميا مبني على الأدلة.
  en.b2.unit02.lesson01.teach.guesswork:
    title: guesswork
    gloss: تخمين
    note: '*guesswork* هو تخمين بلا دليل أو بدليل ضعيف جدًا.'
    example_gloss: من دون أدلة، سيكون التفسير مجرد تخمين.
  en.b2.unit02.lesson01.teach.may_might_contrast:
    title: may en might
    gloss: كثيرًا ما تتداخل May وmight. كلتاهما تعرض تفسيرًا ممكنًا؛ وmight غالبًا أكثر حذرًا بقليل.
    note: لا تترجم كلمة «ربما» العربية دائمًا بـ *maybe*. ففي الجمل المصوغة بعناية تكون *may* و*might* غالبًا أكثر أناقة.
  en.b2.unit02.lesson02.teach.must_have_gone_down:
    title: استنتاج قوي عن الماضي
    gloss: لا بد أن الخادم تعطّل خلال الليل، لأنه لم يتم إنشاء أي تقارير.
    note: 'للاستنتاج القوي عن الماضي تستخدم الإنجليزية *must have* + التصريف الثالث للفعل: *must have gone down*.'
  en.b2.unit02.lesson02.teach.may_have_failed:
    title: سبب محتمل في الماضي
    gloss: ربما فشلت التقارير خلال الليل.
    note: تدل *may have failed* على سبب محتمل، لا على استنتاج مؤكد.
  en.b2.unit02.lesson02.teach.might_have_permission:
    title: احتمال حذر
    gloss: ربما كانت المشكلة في صلاحيات الوصول بدلًا من ذلك.
    note: تُبقي *might have been* السبب مفتوحًا وتبدو أكثر حذرًا من *must have been*.
  en.b2.unit02.lesson02.teach.cannot_have_only_report:
    title: استبعاد احتمال
    gloss: لا يمكن أن تكون المشكلة في التقارير وحدها.
    note: للنفي القاطع في الماضي تستخدم الإنجليزية *cannot have been*، وفي الكلام *can't have been*.
  en.b2.unit02.lesson02.teach.grammar_modal_deduction:
    title: الأفعال المساعدة للتكهّن
    gloss: استخدم must be للاستنتاج القوي عن الحاضر، وmust have been للاستنتاج القوي عن الماضي. واستخدم may/might للاحتمال في الحاضر، وmay have/might have للاحتمال في الماضي. واستخدم cannot/cannot have been حين يستبعد الدليل تفسيرًا ما.
    note: 'انتبه: *must* هنا لا تعني الإلزام، بل تعني «لا بد أن يكون كذلك»، أي استنتاجًا.'
  en.b2.unit02.lesson03.teach.outage:
    title: outage
    gloss: عطل، انقطاع الخدمة
    note: '*outage* هو عطل يتوقف فيه نظام أو خدمة عن العمل.'
    example_gloss: أدى عطل في النظام إلى توقف تشغيل التقارير.
  en.b2.unit02.lesson03.teach.consequence:
    title: consequence
    gloss: نتيجة، تبعة
    note: '*consequence* هي ما ينتج عن سبب أو مشكلة.'
    example_gloss: من النتائج أن لوحة المتابعة قد تعرض بيانات قديمة.
  en.b2.unit02.lesson03.teach.reading_passage:
    title: 'نص القراءة: ما الذي حدث على الأرجح؟'
    gloss: لم تعمل تقارير الليل، وصفحة المراقبة فارغة. تقول ميا إن الخادم لا بد أنه تعطّل خلال الليل. ويقترح دانيال أنها ربما كانت مشكلة في صلاحيات الوصول، لكن هذا لا يمكن أن يفسّر فراغ صفحة المراقبة. وقد يفتقد فريق المالية أرقام الصباح، وقد تعرض لوحة العميل بيانات قديمة إلى أن تُعاد بناء التقارير. ميا ليست متأكدة تمامًا، لكن تفسيرها استنتاج من الأدلة المتاحة، لا مجرد تخمين.
    note: يفصل النص بين الحقائق، والأسباب المحتملة، والاستنتاجات القوية، والتفسيرات المستبعدة، والنتائج المحتملة.
  en.b2.unit02.lesson04.teach.q_no_reports:
    title: دانيال يذكر الحقيقة
    gloss: 'يقول دانيال: لم يتم إنشاء أي من تقارير الليل.'
    note: هذه هي الحقيقة المعروفة، وليست تكهنًا بعد.
  en.b2.unit02.lesson04.teach.a_server_down:
    title: ميا تستنتج استنتاجًا قويًا
    gloss: 'تقول ميا: لا بد أن الخادم تعطّل خلال الليل.'
    note: '*must have gone down* استنتاج قوي عن الماضي.'
  en.b2.unit02.lesson04.teach.q_permission_issue:
    title: دانيال يذكر سببًا محتملًا
    gloss: 'يقول دانيال: ربما كانت المشكلة في صلاحيات الوصول بدلًا من ذلك.'
    note: تُبقي *might have been* الاحتمال مفتوحًا دون أن تجعله مؤكدًا.
  en.b2.unit02.lesson04.teach.a_cannot_only_report:
    title: ميا تستبعد تفسيرًا محدودًا
    gloss: 'تقول ميا: ربما، لكن صفحة المراقبة فارغة أيضًا، فلا يمكن أن تكون المشكلة في التقارير وحدها.'
    note: تستبعد *cannot have been only...* هذا التفسير لأن الدليل أوسع من ذلك.
  en.b2.unit02.lesson04.teach.q_consequences:
    title: دانيال يسأل عن النتائج
    gloss: 'يسأل دانيال: ما النتائج التي ينبغي أن نتوقعها؟'
    note: بعد السبب يأتي السؤال عن النتائج المحتملة.
  en.b2.unit02.lesson04.teach.a_possible_consequences:
    title: ميا تذكر نتائج محتملة
    gloss: 'تقول ميا: قد يفتقد فريق المالية أرقام الصباح، وقد تعرض لوحة العميل بيانات قديمة.'
    note: تدل *may be missing* و*might show* على نتائج محتملة، لا على حقائق مؤكدة.
  en.b2.unit02.lesson04.teach.q_deduction_guess:
    title: دانيال يتحقق من درجة اليقين
    gloss: 'يقول دانيال: إذن هذا استنتاج، وليس مجرد تخمين؟'
    note: يسأل دانيال هل يستند استدلال ميا إلى الأدلة.
  en.b2.unit02.lesson04.teach.a_evidence_limited:
    title: ميا توازن استنتاجها
    gloss: 'تقول ميا: نعم. الدليل محدود، لكنه يشير إلى عطل في النظام.'
    note: يمكن للاستنتاج القوي أن يعترف مع ذلك بمحدودية الدليل.
