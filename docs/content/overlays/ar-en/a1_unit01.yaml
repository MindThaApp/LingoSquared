teaching:
  en.a1.unit01.lesson01.teach.hello:
    title: Hello
    gloss: مرحبًا
    note: '*Hello* هي التحية المحايدة العامة، وتناسب تقريبًا كل موقف.'
    example_gloss: مرحبًا يا Daniel!
  en.a1.unit01.lesson01.teach.hi:
    title: Hi
    gloss: أهلًا (غير رسمي)
    note: '*Hi* أخف وأقل رسمية من *Hello*، وتُقال عادةً بين الأصدقاء.'
    example_gloss: أهلًا يا Leila!
  en.a1.unit01.lesson01.teach.good_morning:
    title: Good morning
    gloss: صباح الخير
    note: تُقال *Good morning* في الصباح، تمامًا مثل «صباح الخير» في العربية.
  en.a1.unit01.lesson01.teach.good_afternoon:
    title: Good afternoon
    gloss: طاب يومك (بعد الظهر)
    note: تُقال *Good afternoon* بعد الظهر فقط؛ وليس في الإنجليزية عبارة واحدة تناسب اليوم كله.
  en.a1.unit01.lesson01.teach.good_evening:
    title: Good evening
    gloss: مساء الخير
    note: تُقال *Good evening* في المساء، تمامًا مثل «مساء الخير».
  en.a1.unit01.lesson01.teach.goodbye:
    title: Goodbye
    gloss: مع السلامة
    note: '*Goodbye* هي عبارة الوداع المحايدة العامة.'
    example_gloss: مع السلامة، أراك غدًا!
  en.a1.unit01.lesson01.teach.bye:
    title: Bye
    gloss: إلى اللقاء (غير رسمي)
    note: '*Bye* أخف وأقل رسمية من *Goodbye*، وتُقال عادةً بين الأصدقاء.'
    example_gloss: إلى اللقاء، أراك قريبًا!
  en.a1.unit01.lesson03.teach.how_are_you:
    title: How are you?
    gloss: كيف حالك؟
    note: تُستخدم *How are you?* في المواقف الرسمية وغير الرسمية على حد سواء، ولا يتغير شكل السؤال بتغير المخاطَب.
  en.a1.unit01.lesson03.teach.im_fine:
    title: I'm fine, thanks.
    gloss: أنا بخير، شكرًا.
    note: إجابة بسيطة ومحايدة.
  en.a1.unit01.lesson03.teach.im_good:
    title: I'm good, thanks.
    gloss: أنا بخير، شكرًا.
    note: معناها مثل *I'm fine, thanks*، وكلتاهما شائعة بالقدر نفسه في الحياة اليومية.
  en.a1.unit01.lesson03.teach.not_bad:
    title: Not bad, thanks.
    gloss: لا بأس، شكرًا.
    note: إجابة غير رسمية متحفظة بعض الشيء، فلا هي جيدة جدًا ولا سيئة.
  en.a1.unit01.lesson03.teach.and_you:
    title: And you?
    gloss: وأنت؟
    note: تُستخدم لرد السؤال على المتحدث، وتناسب أي مستوى من الرسمية.
  en.a1.unit01.lesson03.teach.are_you_okay:
    title: Are you okay?
    gloss: هل أنت بخير؟
    note: تسأل *Are you okay?* غالبًا عما إذا كان في الشخص ما يزعجه الآن، وليست تحية عامة مثل *How are you?*
  en.a1.unit01.lesson05.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: تشرفت بمعرفتك.
    note: تُقال عند لقاء شخص للمرة الأولى.
  en.a1.unit01.lesson05.teach.nice_to_meet_you_too:
    title: Nice to meet you too.
    gloss: وأنا أيضًا، تشرفت بمعرفتك.
    note: الرد المناسب على *Nice to meet you*.
  en.a1.unit01.lesson05.teach.see_you_later:
    title: See you later.
    gloss: أراك لاحقًا.
    note: تُقال عندما ستلتقي الشخص نفسه في اليوم نفسه، تمامًا مثل «أراك لاحقًا» في العربية.
  en.a1.unit01.lesson05.teach.have_a_good_day:
    title: Have a good day.
    gloss: أتمنى لك يومًا سعيدًا.
    note: عبارة وداع ودية تتمنى للشخص بقية يوم طيبة.
