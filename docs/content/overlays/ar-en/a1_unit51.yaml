  en.a1.unit51.lesson03.teach.dialogue_line2:
    title: شكوى Leila
    gloss: 'تقول Leila: نعم، أعاني من سعال شديد وسيلان في الأنف.'
    note: هذه الجملة تكرار لما تعلّمته سابقًا.
  en.a1.unit51.lesson03.teach.dialogue_line3:
    title: الصيدلي ينصح بالشراب
    gloss: 'يقول الصيدلي: عندي شراب سعال يُفترض أن يفيدك. تناوله قبل النوم.'
    note: تعني *before bed* «قبل النوم»، وهذا خاص بشراب السعال وليس بالأقراص.
  en.a1.unit51.lesson03.teach.dialogue_line4:
    title: سؤال Daniel
    gloss: 'يسأل Daniel: هل لديك شيء لألم الحلق أيضًا؟'
    note: تأتي *too* في آخر الجملة وتعني «أيضًا».
  en.a1.unit51.lesson03.teach.dialogue_line5:
    title: الصيدلي ينصح بالأقراص
    gloss: 'يقول الصيدلي: نعم، هذه الأقراص مفيدة لألم الحلق. تناول قرصًا واحدًا كل أربع ساعات.'
    note: 'هذا عن جرعة الأقراص: كل أربع ساعات. أما الشراب فيُؤخذ في وقت آخر، قبل النوم.'
  en.a1.unit51.lesson03.teach.dialogue_line6:
    title: قرار Leila
    gloss: 'تقول Leila: رائع، سآخذ الاثنين. بكم هذا؟'
    note: تعني *I'll take both.* «سآخذ الاثنين».
  en.a1.unit51.lesson03.teach.dialogue_line7:
    title: الثمن
    gloss: 'يقول الصيدلي: هذا تسعة دولارات.'
    note: هذه الجملة تكرار لما تعلّمته سابقًا.
  en.a1.unit51.lesson03.teach.dialogue_line8:
    title: Leila تدفع
    gloss: 'تقول Leila: تفضّل. شكرًا لك!'
    note: تعني *Here you go.* «تفضّل»، وتُقال عند تسليم شيء لشخص.
  en.a1.unit51.lesson04.teach.reading_passage:
    title: نص عن زيارة إلى الصيدلية
    gloss: 'زيارة إلى الصيدلية: بعد أيام قليلة من رحلتها إلى الجبال مع Mia، أصيبت Leila بنزلة برد. كانت تعاني من سعال شديد وسيلان في الأنف، وكان حلقها يؤلمها أيضًا. مشى Daniel معها إلى الصيدلية القريبة من شقتها. استمع الصيدلي إلى شكاوى Leila ونصحها بشراب للسعال وأقراص. قال الصيدلي إن عليها تناول شراب السعال قبل النوم وقرصًا واحدًا كل أربع ساعات. دفعت Leila تسعة دولارات مقابل الاثنين. وفي طريق العودة اشترى لها Daniel علبة مناديل ورقية أيضًا. تناولت Leila الدواء في تلك الليلة، وبحلول نهاية الأسبوع كان سعالها أفضل بكثير.'
    note: تعني *by the weekend* «بحلول نهاية الأسبوع».
