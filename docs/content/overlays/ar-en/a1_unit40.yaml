    gloss: 'يقول دانيال: إلى شيكاغو. إنه هدية عيد ميلاد لأختي.'
    note: تعني *It's a birthday gift for my sister* أنه هدية عيد ميلاد لأختي.
  en.a1.unit40.lesson03.teach.dialogue_line4:
    title: سؤال الموظف
    gloss: 'يقول الموظف: هل تريد بريدًا عاديًا أم سريعًا؟ البريد السريع يستغرق نحو يومين.'
    note: تعني *regular or express mail* بريدًا عاديًا أو سريعًا.
  en.a1.unit40.lesson03.teach.dialogue_line5:
    title: اختيار دانيال
    gloss: 'يقول دانيال: سآخذ السريع من فضلك. كم تبلغ التكلفة؟'
    note: '*I''ll take ...* طريقة طبيعية لاتخاذ قرار عند التعامل مع مقدّم خدمة.'
  en.a1.unit40.lesson03.teach.dialogue_line6:
