    gloss: 'يقول الموظف: التكلفة اثنا عشر دولارًا. تفضّل إيصالك.'
    note: تعني *Here's your receipt* تفضّل إيصالك.
  en.a1.unit40.lesson03.teach.dialogue_line7:
    title: شكر دانيال
    gloss: 'يقول دانيال: شكرًا لك! أتمنى لك يومًا سعيدًا.'
    note: '*Have a good day* تحية وداع مهذبة.'
  en.a1.unit40.lesson04.teach.reading_passage:
    title: نص عن ثلاث زيارات إلى مكتب البريد
    gloss: دانيال وليلى وميا يعرفون جميعًا كيف يتصرفون في مكتب البريد. أرسل دانيال الأسبوع الماضي طردًا هدية عيد ميلاد إلى أخته في شيكاغو. دفع ثمن البريد السريع لأنه أراد أن يصل بسرعة، وقد استغرق يومين فقط. ليلى تستعد للانتقال إلى مكان قريب من ميا، فذهبت إلى مكتب البريد لترسل بعض الكتب القديمة إلى والديها. وزن الموظف الطرد وأعطاها طابع بريد له. سألت ليلى كم سيستغرق الطرد، فقال الموظف نحو أسبوع لأنها اختارت البريد العادي. نادرًا ما ترسل ميا طرودًا، لكنها تشتري دائمًا طابع بريد للرسائل التي تكتبها لجدتها. وتقول إن الرسالة التي عليها طابع بريد أكثر دفئًا من الرسالة النصية.
    note: تعني *getting ready to move* أنها تستعد للانتقال إلى مكان آخر.
