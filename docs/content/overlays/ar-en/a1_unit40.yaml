    gloss: 'يقول دانيال: مرحبًا، أودّ إرسال هذا الطرد من فضلك.'
    note: عبارة *I'd like to* + فعل طريقة مهذبة للطلب، وهي ألطف بكثير من *I want* التي تبدو فظّة عند الشباك.
  en.a1.unit40.lesson03.teach.dialogue_line2:
