teaching:
  en.a2.unit37.lesson01.teach.video_call:
    title: video call
    gloss: مكالمة فيديو
    note: '*video call* محادثة يمكن فيها رؤية الطرف الآخر أيضًا. ونقول بالعربية عادةً «مكالمة فيديو» أو «اتصال مرئي».'
    example_gloss: لدي مكالمة فيديو مع فريقي كل يوم اثنين.
  en.a2.unit37.lesson01.teach.camera:
    title: camera
    gloss: كاميرا
    note: '*camera* هي الجهاز الذي ينقل صورتك.'
    example_gloss: شغّل الكاميرا من فضلك قبل أن يبدأ الاجتماع.
  en.a2.unit37.lesson01.teach.microphone:
    title: microphone
    gloss: ميكروفون
    note: '*microphone* هو الجهاز الذي ينقل صوتك.'
    example_gloss: كان الميكروفون مغلقًا عندي، فلم يسمعني الآخرون.
  en.a2.unit37.lesson01.teach.connection:
    title: connection
    gloss: اتصال
    note: '*connection* هو الاتصال بين حاسوبك والإنترنت.'
    example_gloss: كان الاتصال سيئًا، فتوقفت الصورة.
  en.a2.unit37.lesson01.teach.mute:
    title: mute
    gloss: يكتم الصوت
    note: '*mute* تعني إغلاق صوتك حتى لا يسمعك الآخرون.'
    example_gloss: أكتم صوت الميكروفون عندما لا أتحدث.
  en.a2.unit37.lesson01.teach.face_to_face:
    title: face to face
    gloss: وجهًا لوجه
    note: '*face to face* تعني أن تكونوا في الغرفة نفسها لا أن تتحدثوا عبر شاشة.'
    example_gloss: بعض الاجتماعات أفضل وجهًا لوجه منها عبر الإنترنت.
  en.a2.unit37.lesson01.teach.grammar_comparison:
    title: المقارنة باستخدام faster than وless ... than
    gloss: مكالمة الفيديو أسرع من الزيارة. مكالمة الفيديو أقل طابعًا شخصيًا من اللقاء وجهًا لوجه.
    note: مع الصفات القصيرة نضيف *-er* ونضع *than* بعدها (*faster than*). ومع الصفات الأطول نستخدم *less ... than* أو *more ... than*.
  en.a2.unit37.lesson02.teach.video_call_every_monday:
    title: قول كم مرة تجري مكالمات فيديو
    gloss: لدي مكالمة فيديو مع فريقي كل يوم اثنين.
    note: تعني *every Monday* كل يوم اثنين، وتصف عادة ثابتة.
  en.a2.unit37.lesson02.teach.turn_on_your_camera:
    title: طلب تشغيل الكاميرا من شخص ما
    gloss: هل يمكنك تشغيل الكاميرا من فضلك؟
    note: تعني *turn on* تشغّل، وعكسها *turn off* (يُطفئ).
  en.a2.unit37.lesson02.teach.you_were_on_mute:
    title: قول إن أحدًا كان صوته مكتومًا
    gloss: عذرًا، كان صوتك مكتومًا.
    note: '*you were on mute* عبارة ثابتة تُقال عندما لا يُسمع شخص لأن ميكروفونه كان مكتومًا.'
  en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face:
    title: التعبير عن رأيك مع ذكر تفضيلك
    gloss: أرى أن مكالمات الفيديو مفيدة، لكنني أفضّل لقاء الناس وجهًا لوجه.
    note: بعبارة *I think ... but I prefer ...* تذكر رأيك أولًا ثم ما تفضّله.
  en.a2.unit37.lesson02.teach.grammar_prefer:
    title: prefer X to Y
    gloss: أفضّل مكالمات الفيديو على المكالمات الهاتفية. أفضّل اللقاءات وجهًا لوجه على مكالمات الفيديو.
    note: 'انتبه: بعد *prefer* يأتي *to* لا *than*، فنقول: *I prefer video calls to phone calls*.'
  en.a2.unit37.lesson03.teach.headphones:
    title: headphones
    gloss: سماعات الرأس
    note: تأتي *headphones* في الإنجليزية دائمًا بصيغة الجمع، حتى لو كنت تستخدم زوجًا واحدًا.
    example_gloss: أستخدم سماعات الرأس حتى لا تسمع عائلتي الاجتماع.
  en.a2.unit37.lesson03.teach.leilas_message:
    title: رسالة ليلى
    gloss: دوراتي عبر الإنترنت كلها الآن مكالمات فيديو. أشغّل الكاميرا، لكنني أكتم صوت الميكروفون حتى تطرح المعلمة سؤالًا. أستخدم سماعات الرأس لأن اتصالي يكون أفضل بها. أرى أن مكالمات الفيديو توفّر كثيرًا من الوقت، لكنني ما زلت أفضّل لقاء زملائي وجهًا لوجه.
    note: رسالة عفوية من ليلى عن دوراتها عبر الإنترنت.
  en.a2.unit37.lesson03.teach.mute_until_question:
    title: قول متى تكتم الميكروفون
    gloss: أكتم صوت الميكروفون حتى تطرح المعلمة سؤالًا.
    note: 'تعني *until* «حتى»: يستمر شيء ما إلى أن تأتي لحظة معينة.'
  en.a2.unit37.lesson04.teach.q_lot_of_video_calls:
    title: ليلى تسأل عن عمل دانيال
    gloss: 'تسأل ليلى: هل لديك كثير من مكالمات الفيديو في العمل؟'
    note: تعني *a lot of* كثيرًا، وتناسب الأسماء المعدودة وغير المعدودة.
  en.a2.unit37.lesson04.teach.a_call_every_monday:
    title: دانيال يتحدث عن موعده المحدَّد
    gloss: 'يقول دانيال: نعم، لدي مكالمة فيديو مع فريقي كل يوم اثنين.'
    note: هي الجملة نفسها التي في الدرس الثاني.
  en.a2.unit37.lesson04.teach.q_turn_on_camera:
    title: ليلى تسأل عن الكاميرا
    gloss: 'تسأل ليلى: هل تشغّل الكاميرا؟'
    note: سؤال قصير لمعرفة المزيد.
  en.a2.unit37.lesson04.teach.a_always_but_mute:
    title: عادة دانيال في مكالمة الفيديو
    gloss: 'يقول دانيال: دائمًا، لكنني أكتم صوت الميكروفون عندما لا أتحدث.'
    note: 'تعني *when I am not speaking* هنا: في اللحظات التي لا أتحدث فيها.'
  en.a2.unit37.lesson04.teach.q_classes_are_video_calls:
    title: ليلى تتحدث عن دوراتها
    gloss: 'تقول ليلى: دوراتي عبر الإنترنت كلها الآن مكالمات فيديو.'
    note: يرتبط هذا بدوراتها يومي الاثنين والأربعاء في الوحدة 33.
  en.a2.unit37.lesson04.teach.a_what_do_you_think:
    title: دانيال يسأل عن رأيها
    gloss: 'يسأل دانيال: ما رأيك فيها؟'
    note: '*What do you think about them?* تسأل عن الرأي في شيء ذُكر للتو.'
  en.a2.unit37.lesson04.teach.q_useful_but_prefer:
    title: ليلى تعبّر عن رأيها
    gloss: 'تقول ليلى: أرى أن مكالمات الفيديو مفيدة، لكنني أفضّل لقاء الناس وجهًا لوجه.'
    note: هو الرأي نفسه الذي في الدرس الثاني.
  en.a2.unit37.lesson04.teach.a_agree_faster_less_personal:
    title: دانيال يوافقها
    gloss: 'يقول دانيال: أتفق معك. مكالمة الفيديو أسرع من الزيارة، لكنها أقل طابعًا شخصيًا.'
    note: بعبارة *I agree* تعبّر عن الموافقة. وبعدها نذكر عادةً سببنا.
  en.a2.unit37.lesson04.teach.q_exactly:
    title: ليلى تؤكد
    gloss: 'تقول ليلى: بالضبط.'
    note: '*Exactly* طريقة قصيرة للقول إنك موافق تمامًا.'
