  en.a1.unit49.lesson03.teach.dialogue_line1:
    title: تحذير Mia
    gloss: 'تقول Mia: انتظر، هذه الجرة الزجاجية لا توضع في القمامة!'
    note: '*doesn''t go in the trash* تعني «لا توضع في القمامة».'
  en.a1.unit49.lesson03.teach.dialogue_line2:
    title: اعتذار Daniel
    gloss: 'يقول Daniel: يا إلهي، آسف! في أي حاوية توضع؟'
    note: '*Which bin does it go in?* تكرر صيغة السؤال التي تعلمتها للتو.'
  en.a1.unit49.lesson03.teach.dialogue_line3:
    title: شرح Mia
    gloss: 'تقول Mia: توضع في الحاوية الخضراء. نعيد تدوير الزجاج هنا.'
    note: '*We recycle glass here.* تعني «نعيد تدوير الزجاج هنا».'
  en.a1.unit49.lesson03.teach.dialogue_line4:
    title: سؤال Daniel
    gloss: 'يسأل Daniel: وماذا عن الورق ونفايات الطعام؟'
    note: تكرار للسؤال *What about ...?* الذي تعلمته سابقًا.
  en.a1.unit49.lesson03.teach.dialogue_line5:
    title: توضيح Mia
    gloss: 'تقول Mia: الورق يوضع في الحاوية الزرقاء، ونفايات الطعام توضع في الحاوية البنية.'
    note: '*goes in ..., and ... goes in ...* تكرر البنية نفسها لنوعين مختلفين من النفايات.'
  en.a1.unit49.lesson03.teach.dialogue_line6:
    title: سؤال Daniel عن يوم الجمع
    gloss: 'يقول Daniel: فهمت. متى يوم جمع النفايات؟'
    note: '*Got it.* طريقة غير رسمية للقول «فهمت».'
  en.a1.unit49.lesson03.teach.dialogue_line7:
    title: "إجابة Mia"
    gloss: 'تقول Mia: حاويات التدوير تُخرَج أيام الثلاثاء، والقمامة تُخرَج أيام الجمعة.'
    note: 'انتبه: تذكر Mia يومين مختلفين لنوعين مختلفين، الثلاثاء للتدوير والجمعة للقمامة العادية.'
  en.a1.unit49.lesson03.teach.dialogue_line8:
    title: وعد Daniel
    gloss: 'يقول Daniel: شكرًا! سأفرز كل شيء بشكل صحيح في المرة القادمة.'
    note: '*I''ll sort everything correctly next time.* تعني «سأفرز كل شيء بشكل صحيح في المرة القادمة».'
  en.a1.unit49.lesson04.teach.reading_passage:
    title: نص عن فرز النفايات
    gloss: 'كيف تفرز نفاياتك: في كثير من المباني السكنية حاويات مختلفة لأنواع مختلفة من النفايات. يوضع الزجاج عادةً في الحاوية الخضراء، والورق في الحاوية الزرقاء. وتوضع نفايات الطعام في الحاوية البنية، وكل ما عدا ذلك في الحاوية السوداء للقمامة العادية. ومن المفيد أن تعرف يوم الجمع، لأن الحاويات تُفرَّغ مرة واحدة فقط في الأسبوع. يجرّب Daniel وصفات من كتاب الطبخ الذي استعاره من المكتبة، وكثيرًا ما يطبخ مع Mia في شقتها. في الليلة الماضية أعدّ وصفة من الكتاب، وبعدها كاد يضع جرة زجاجية في القمامة العادية. أوقفته Mia وأرته كيف يفرز مبناها النفايات. وشرحت له أن حاويات التدوير تُخرَج أيام الثلاثاء، وأن القمامة العادية تُخرَج أيام الجمعة. شكرها Daniel وقال إنه سيفرز كل شيء بشكل صحيح من الآن فصاعدًا.'
    note: '*almost put a glass jar in the regular trash* تعني «كاد يضع جرة زجاجية في القمامة العادية».'
