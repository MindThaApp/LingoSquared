    example_gloss: عندنا طائر.
  en.a1.unit32.lesson01.teach.pet:
    title: pet
    gloss: حيوان أليف
    note: '*pet* تعني «حيوان أليف»، و*pets* جمعها. انتبه إلى *any* في السؤال *Do you have any pets?* تُستخدم *any* في الإنجليزية في الأسئلة والنفي مع الجمع والأسماء غير المعدودة. العربية لا تحتاج إلى كلمة مقابلة («هل عندك حيوانات أليفة؟»)، لكن في الإنجليزية لا يصح حذف *any* هنا.'
    example_gloss: هل عندك حيوانات أليفة؟
  en.a1.unit32.lesson02.teach.name_is:
    title: Her name is Luna.
    gloss: اسمها لونا.
    note: في الإنجليزية تُستخدم *her*/*his* (و*she*/*he*) للحيوان عندما يكون جنسه معروفًا؛ وقد تُستخدم *it* إذا كان الجنس غير معروف أو غير مهم. *Her name is Luna* تتحدث عن حيوان أنثى.
  en.a1.unit32.lesson02.teach.play:
    title: play
    gloss: يلعب
    note: '*play* تعني «يلعب».'
    example_gloss: كلبي يحب اللعب.
  en.a1.unit32.lesson02.teach.walk:
    title: walk
    gloss: يُخرج للتنزه
    note: '*walk* تعني هنا إخراج حيوانك الأليف للتنزه.'
    example_gloss: أُخرج كلبي للتنزه كل يوم.
  en.a1.unit32.lesson02.teach.friendly:
    title: friendly
    gloss: ودود
    note: '*friendly* تعني «ودود».'
    example_gloss: قطتها ودودة جدًا.
  en.a1.unit32.lesson02.teach.small:
    title: small
    gloss: صغير
    note: '*small* تعني «صغير».'
    example_gloss: السمكة صغيرة.
  en.a1.unit32.lesson03.teach.dialogue_line1:
    title: سؤال دانيال
    gloss: 'يسأل دانيال: ميا، هل عندك حيوانات أليفة؟'
    note: '*any* في هذا السؤال لا مقابل له في العربية، لكن لا يجوز حذفه في الإنجليزية.'
  en.a1.unit32.lesson03.teach.dialogue_line2:
    title: "إجابة ميا"
    gloss: 'تقول ميا: نعم، عندي قطة. اسمها لونا.'
    note: تُستخدم *She* و*her* مع القطة لأن جنسها (أنثى) معروف.
  en.a1.unit32.lesson03.teach.dialogue_line3:
    title: سؤال دانيال التالي
    gloss: 'يقول دانيال: لطيف! هل تحب اللعب؟'
    note: '*Does* فعل مساعد مع *she* (do-support)، كما في الأسئلة عن المظهر.'
  en.a1.unit32.lesson03.teach.dialogue_line4:
    title: "إجابة ميا"
    gloss: 'تقول ميا: نعم، تحب اللعب بالكرة كثيرًا. وأنت؟'
    note: '*What about you?* طريقة قصيرة وطبيعية لإعادة السؤال نفسه إلى الطرف الآخر.'
  en.a1.unit32.lesson03.teach.dialogue_line5:
    title: "إجابة دانيال"
    gloss: 'يقول دانيال: عندي سمكة صغيرة، لكنني أريد كلبًا.'
    note: 'تربط *but* هنا فكرتين متعارضتين: عنده حيوان أليف بالفعل، لكنه يريد حيوانًا آخر.'
  en.a1.unit32.lesson04.teach.reading_passage:
    title: نص عن ليلى ودانيال
    gloss: لدى ليلى كلب اسمه ماكس. هو كبير وودود جدًا. تُخرجه للتنزه كل صباح. ليس لدى دانيال كلب، لكن عنده سمكة صغيرة. السمكة لا تحتاج إلى تنزه، لكن دانيال يحب مشاهدتها وهي تسبح.
    note: نستخدم *He* لماكس لأنه ذكر. وهنا أيضًا نختار *she* أو *he* بحسب الجنس الحقيقي للحيوان.
