  en.a1.unit60.lesson04.teach.reading_passage:
    title: 'نص: العشاء في بيت Leila'
    gloss: 'العشاء في بيت Leila: دعت Leila صديقها Daniel إلى العشاء يوم السبت. طلبت منه أن يحضر مشروبًا. قال Daniel إنه يستطيع الحضور. ذكرت الدعوة أن العشاء في الساعة 6:00 في 18 Park Street. كتب Daniel العنوان في هاتفه. أراد أن يصل في الموعد. كانت Leila سعيدة لأن صديقها يستطيع الحضور.'
    note: '*invited Daniel to dinner* تعني أن Leila دعت Daniel إلى العشاء.'
