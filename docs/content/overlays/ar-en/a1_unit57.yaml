  en.a1.unit57.lesson02.teach.what_time_does_the_film_start:
    title: What time does the film start?
    gloss: في أي ساعة يبدأ الفيلم؟
    note: في *does the film start* نستخدم *does* لتكوين السؤال، لأن الفعل الأساسي هو *start*.
  en.a1.unit57.lesson02.teach.two_tickets_for_the_seven_oclock_show:
    title: Two tickets for the seven o'clock show, please.
    gloss: تذكرتان لعرض الساعة السابعة، من فضلك.
    note: '*for the seven o''clock show* تحدد العرض الذي تريد له التذكرتين.'
  en.a1.unit57.lesson02.teach.can_i_have_some_popcorn:
    title: Can I have some popcorn, please?
    gloss: هل يمكنني الحصول على بعض الفشار، من فضلك؟
    note: '*Can I have...?* طريقة مباشرة وشائعة لطلب شيء ما.'
  en.a1.unit57.lesson02.teach.how_much_is_that_in_total:
    title: How much is that in total?
    gloss: كم المبلغ الإجمالي؟
    note: '*in total* تعني «في المجموع»، وتُستخدم للسؤال عن السعر النهائي.'
  en.a1.unit57.lesson02.teach.thats_twenty_dollars:
    title: That's twenty dollars, please.
    gloss: المبلغ عشرون دولارًا، من فضلك.
    note: '*That''s* + السعر طريقة ثابتة لذكر المبلغ.'
  en.a1.unit57.lesson02.teach.i_really_liked_it:
    title: I really liked it!
    gloss: أعجبني كثيرًا!
    note: تستخدم الإنجليزية هنا الفعل *like* مع المفعول به *it*، ولا يمكن ترجمتها كلمة بكلمة إلى «أعجبني». تعلّم هذه الجملة كاملة كما هي.
  en.a1.unit57.lesson03.teach.dialogue_line1:
    title: يسأل Daniel عن موعد العرض
    gloss: 'يقول Daniel: مرحبًا! في أي ساعة يبدأ الفيلم؟'
    note: في *does the film start* نستخدم *does* لتكوين السؤال.
  en.a1.unit57.lesson03.teach.dialogue_line2:
    title: موعد العرض
    gloss: 'يقول موظف التذاكر: العرض التالي في الساعة السابعة.'
    note: 'تستخدم الإنجليزية حرف الجر *at* مع الوقت: *at seven o''clock*، ويقابله «في» في العربية.'
  en.a1.unit57.lesson03.teach.dialogue_line3:
    title: يطلب Daniel التذاكر
    gloss: 'يقول Daniel: رائع. هل يمكننا الحصول على تذكرتين، من فضلك؟'
    note: 'معلومة واحدة مستقلة: عدد التذاكر (اثنتان).'
  en.a1.unit57.lesson03.teach.dialogue_line4:
    title: سعر التذاكر
    gloss: 'يقول موظف التذاكر: بالتأكيد. المبلغ ستة عشر دولارًا.'
    note: 'معلومة مستقلة: سعر التذكرتين معًا.'
  en.a1.unit57.lesson03.teach.dialogue_line5:
    title: تطلب Leila الفشار
    gloss: 'تقول Leila: هل يمكننا الحصول على بعض الفشار، من فضلك؟'
    note: هذا طلب، وليس معلومة جديدة عن السعر.
  en.a1.unit57.lesson03.teach.dialogue_line6:
    title: سعر الفشار
    gloss: 'يقول موظف التذاكر: بالتأكيد. الفشار بأربعة دولارات.'
    note: 'معلومة ثانية مستقلة: سعر الفشار وحده، بمعزل عن التذاكر.'
  en.a1.unit57.lesson03.teach.dialogue_line7:
    title: يسأل Daniel عن المجموع
    gloss: 'يقول Daniel: كم المبلغ الإجمالي؟'
    note: '*in total* تسأل عن مجموع كل الأسعار.'
  en.a1.unit57.lesson03.teach.dialogue_line8:
    title: المبلغ الإجمالي
    gloss: 'يقول موظف التذاكر: المبلغ عشرون دولارًا، من فضلك.'
    note: 'معلومة ثالثة مستقلة: المبلغ الإجمالي، وهو يختلف عن سعر التذاكر وسعر الفشار كلٍّ على حدة.'
  en.a1.unit57.lesson03.teach.dialogue_line9:
    title: Leila متشوقة
    gloss: 'تقول Leila: شكرًا! لا أطيق الانتظار لمشاهدته.'
    note: '*I can''t wait to...* عبارة ثابتة للتعبير عن الحماس.'
  en.a1.unit57.lesson04.teach.cinema_schedule:
    title: جدول السينما
    gloss: 'جدول السينما: Star Journey - 7:00، $8. The Great Race - 5:00، $10. Funny Family - 9:00، $6.'
    note: يعرض الجدول ثلاثة أفلام مع موعد العرض والسعر.
  en.a1.unit57.lesson04.teach.reading_passage:
    title: 'نص: مساء في السينما'
    gloss: في إحدى الأمسيات، قرر Daniel و Leila مشاهدة فيلم في السينما. سألا في أي ساعة يبدأ، فقال موظف التذاكر إن العرض التالي، Star Journey، في الساعة السابعة. اشتريا تذكرتين بستة عشر دولارًا وكيس فشار بأربعة دولارات. وكان المجموع عشرين دولارًا. شاهدا الفيلم معًا، وكان عن رواد الفضاء. كان مضحكًا جدًا. وعندما انتهى، قالت Leila إنه أعجبها كثيرًا، وقال Daniel إنه يريد مشاهدة الفيلم التالي أيضًا.
    note: '*watched* هي الماضي من *watch* (يشاهد).'
