teaching:
  en.a1.unit34.lesson01.teach.soccer:
    title: soccer
    gloss: كرة القدم
    note: '*soccer* تعني «كرة القدم». الفعل المرافق لها هو *play*: *play soccer*. في العربية نقول «يلعب كرة القدم» أيضًا، لكن في الإنجليزية عليك أن تتذكر مع اسم كل رياضة الفعل المناسب: *play* أو *go* أو *do*.'
    example_gloss: نلعب كرة القدم أيام السبت.
  en.a1.unit34.lesson01.teach.tennis:
    title: tennis
    gloss: التنس
    note: '*tennis* تعني «التنس». كما في *soccer*، تستخدم هنا *play*: *play tennis*.'
    example_gloss: هي تلعب التنس كل عطلة أسبوع.
  en.a1.unit34.lesson01.teach.basketball:
    title: basketball
    gloss: كرة السلة
    note: '*basketball* تعني «كرة السلة». هنا أيضًا تستخدم *play*: *play basketball*، مثل *soccer* و*tennis*. في الإنجليزية تُستخدم *play* مع أسماء ألعاب الكرة.'
    example_gloss: يلعبون كرة السلة في الحديقة.
  en.a1.unit34.lesson01.teach.swimming:
    title: swimming
    gloss: السباحة
    note: '*swimming* تعني «السباحة». هنا يتغير الفعل: *go swimming* (لا *play swimming*). تستخدم الإنجليزية *go* مع صيغة *-ing* لأنشطة مثل السباحة والجري. العربية تستخدم فعلًا واحدًا هو «يسبح»، أما الإنجليزية فتحتاج هنا إلى *go* قبل *swimming*.'
    example_gloss: أذهب للسباحة مرتين في الأسبوع.
  en.a1.unit34.lesson01.teach.yoga:
    title: yoga
    gloss: اليوغا
    note: '*yoga* تعني «اليوغا». الفعل هنا هو *do*: *do yoga*. تستخدم الإنجليزية *do* مع الأنشطة الفردية مثل اليوغا، لا *play* ولا *go*. وفي العربية نقول «يمارس اليوغا». انتبه إلى أن للإنجليزية ثلاثة أفعال (*play* و*go* و*do*) عليك تذكّر ما يناسب كل نوع من الرياضة.'
    example_gloss: يمارس اليوغا في الصباح.
  en.a1.unit34.lesson01.teach.exercise:
    title: exercise
    gloss: يمارس الرياضة / التمارين
    note: '*exercise* تعني «ممارسة الرياضة» أو «التمارين»: كلمة عامة للنشاط البدني. بخلاف *soccer* و*swimming* و*yoga*، يمكن استخدام *exercise* فعلًا وحدها دون *play* أو *go* أو *do*: *Do you exercise every day?*'
    example_gloss: هل تمارس الرياضة كل يوم؟
  en.a1.unit34.lesson02.teach.twice_a_week:
    title: twice a week
    gloss: مرتين في الأسبوع
    note: '*twice a week* تعني «مرتين في الأسبوع». الكلمة *a* لا تعني هنا «واحد» بل «في كل»: العدد + *a* + وحدة زمنية يدل على عدد مرات الحدوث في تلك المدة. وفي العربية نستخدم «في» أو «كل» (مرتين في الأسبوع).'
    example_gloss: يلعب التنس مرتين في الأسبوع.
  en.a1.unit34.lesson02.teach.three_times_a_week:
    title: three times a week
    gloss: ثلاث مرات في الأسبوع
    note: '*three times a week* تعني «ثلاث مرات في الأسبوع». كما في *twice a week*، تعني *a* هنا «في كل» لا «واحد»: *times* (مرات) مع *a week* (في الأسبوع) تدل على عدد المرات أسبوعيًا.'
    example_gloss: هي تسبح ثلاث مرات في الأسبوع.
  en.a1.unit34.lesson02.teach.on_weekends:
    title: on weekends
    gloss: في عطلة نهاية الأسبوع
    note: '*on weekends* تعني «في عطلة نهاية الأسبوع». تستخدم الإنجليزية *on* مع الأيام وعطلات نهاية الأسبوع، وعليك حفظ حرف الجر مع هذه التعابير.'
    example_gloss: نلعب كرة السلة في عطلة نهاية الأسبوع.
  en.a1.unit34.lesson02.teach.gym:
    title: gym
    gloss: نادٍ رياضي
    note: gym تعني «نادٍ رياضي»، مكان فيه أجهزة ودروس لممارسة الرياضة.
    example_gloss: يمارس اليوغا في النادي الرياضي.
  en.a1.unit34.lesson02.teach.pool:
    title: pool
    gloss: مسبح
    note: pool تعني «مسبح»، مكان مليء بالماء للسباحة.
    example_gloss: أسبح في المسبح.
  en.a1.unit34.lesson02.teach.how_often_question:
    title: How often do you exercise?
    gloss: كم مرة تمارس الرياضة؟
    note: 'يبدأ هذا السؤال بـ*how often* (كم مرة). ثم يأتي الفعل المساعد *do* لأن الفعل الأساسي هو *exercise*: وهو الفعل المساعد نفسه الذي نجده في أسئلة إنجليزية أخرى.'
  en.a1.unit34.lesson03.teach.dialogue_line1:
    title: سؤال دانيال
    gloss: 'يسأل دانيال: هل تريدين أن تلعبي كرة القدم معنا يوم السبت؟'
    note: بداية الحوار بدعوة إلى لعب كرة القدم. مع *soccer* تستخدم *play*.
  en.a1.unit34.lesson03.teach.dialogue_line2:
    title: "إجابة ليلى"
    gloss: 'تقول ليلى: لا أحب كرة القدم كثيرًا. أفضّل السباحة.'
    note: '*don''t really like* تعني «لا أحب كثيرًا»: طريقة ألطف لقول لا.'
  en.a1.unit34.lesson03.teach.dialogue_line3:
    title: "إجابة دانيال"
    gloss: 'يقول دانيال: لا بأس! كم مرة تذهبين للسباحة؟'
    note: '*go swimming*: مع السباحة تستخدم *go* لا *play* ولا *do*.'
  en.a1.unit34.lesson03.teach.dialogue_line4:
    title: "إجابة ليلى"
    gloss: 'تقول ليلى: مرتين في الأسبوع، عادةً في المسبح القريب من بيتي.'
    note: '*Twice a week*: هنا أيضًا تعني *a* «في كل».'
  en.a1.unit34.lesson03.teach.dialogue_line5:
    title: "إجابة دانيال"
    gloss: 'يقول دانيال: رائع! أمارس اليوغا أحيانًا أيضًا، لكن الجري ما زال المفضل لدي.'
    note: '*do yoga*: مع اليوغا تستخدم *do*، وهو غير *play* و*go*.'
  en.a1.unit34.lesson04.teach.reading_passage:
    title: نص عن دانيال وليلى وميا
    gloss: يحب دانيال وليلى وميا جميعًا البقاء نشيطين، كلٌّ بطريقته. يذهب دانيال للجري كل صباح قبل العمل. تفضّل ليلى السباحة؛ فهي تذهب إلى المسبح مرتين في الأسبوع. ميا جديدة في الفريق، لكنها تلعب التنس كل أحد مع جارتها. وفي أيام السبت يلعبون كرة القدم معًا أحيانًا في الحديقة، لكن كرة القدم ليست الرياضة المفضلة لأي منهم.
    note: 'يستخدم هذا النص الأفعال الثلاثة: *goes running* (*go*) و*plays tennis* و*play soccer* (*play*). لكل رياضة فعلها الخاص.'
