teaching:
  en.b2.unit01.lesson01.teach.claim:
    title: claim
    gloss: موقف، ادّعاء
    note: '*claim* هو الموقف الذي تدافع عنه. وهي هنا لا تعني شكوى ولا مطالبة بتعويض.'
    example_gloss: موقفها هو أن الخطة يجب أن تستمر.
  en.b2.unit01.lesson01.teach.evidence:
    title: evidence
    gloss: دليل، أدلة داعمة
    note: '*evidence* هي الحقائق أو الأرقام أو الأمثلة التي تدعم بها موقفك.'
    example_gloss: يعطي هذا المثال ميا دليلًا على موقفها.
  en.b2.unit01.lesson01.teach.counterargument:
    title: counterargument
    gloss: حجة مضادة
    note: '*counterargument* نقطة تعارض موقفك. وتُكتب في الإنجليزية ككلمة واحدة.'
    example_gloss: يطرح دانيال حجة مضادة.
  en.b2.unit01.lesson01.teach.rebut:
    title: rebut
    gloss: فنّد، دحض
    note: '*rebut* تعني أن ترد على حجة مضادة دون أن تتخلى عن موقفك.'
    example_gloss: تفنّد ميا المخاوف بالأدلة.
  en.b2.unit01.lesson01.teach.concede:
    title: concede
    gloss: سلّم بـ، أقرّ بـ
    note: '*concede* تعني أن تقرّ بأن جزءًا من كلام الطرف الآخر معقول. وهذا لا يعني التخلي عن موقفك كله.'
    example_gloss: يمكنك الإقرار بوجود مخاوف دون التخلي عن موقفك الرئيسي.
  en.b2.unit01.lesson01.teach.outweigh:
    title: outweigh
    gloss: تفوق أهميةً، يرجح على
    note: تستخدم *outweigh* عندما تكون فائدة أو خطر أو سبب أهم من شيء آخر.
    example_gloss: يمكن للدليل القوي أن يرجح على أي مخاوف.
  en.b2.unit01.lesson02.teach.position_with_evidence:
    title: الإقرار بالمخاطر مع التمسك بموقفك
    gloss: أتفق على أن للخطة مخاطر، لكن الدليل لا يزال يدعم المضي قدمًا.
    note: تبدأ *I agree..., but...* بالإقرار بكلام الطرف الآخر. ثم تُظهر *but the evidence still supports...* أن موقفك لم يتغير.
  en.b2.unit01.lesson02.teach.strongest_reason:
    title: ذكر أقوى أسبابك
    gloss: أقوى سبب هو أن نتائج الاستطلاع كانت متسقة.
    note: 'تقدّم *The strongest reason is that...* أهم ما يدعم رأيك. انتبه إلى الترتيب الإنجليزي بعد *that*: الفاعل قبل الفعل.'
  en.b2.unit01.lesson02.teach.fair_concern:
    title: الإقرار بمخاوف مشروعة
    gloss: هذه مخاوف مشروعة؛ غير أن البيانات تشير إلى الاتجاه المعاكس.
    note: 'تبدو عبارة *That is a fair concern; however,...* مهنية: تقرّ بالمخاوف ثم تفنّدها بالبيانات.'
  en.b2.unit01.lesson02.teach.grammar_argument_shape:
    title: الدفاع عن موقف
    gloss: اذكر موقفك، وقدّم الدليل، وأقرّ بأقوى نقطة معارضة ثم فنّدها. تجعلك عبارات مثل That is a fair concern و However تبدو معقولًا دون التخلي عن موقفك.
    note: 'حافظ على الترتيب الإنجليزي للجملة: الفاعل ثم الفعل، فتقول *the data points...* لا *the data in the other direction points*.'
  en.b2.unit01.lesson03.teach.retention:
    title: retention
    gloss: الاحتفاظ بالموظفين
    note: تعني *retention* هنا أن الموظفين يبقون في عملهم بدل أن يغادروه.
    example_gloss: الاحتفاظ بالموظفين على نحو أفضل يعني أن عددًا أقل منهم يغادر الفريق.
  en.b2.unit01.lesson03.teach.collaboration:
    title: collaboration
    gloss: تعاون
    note: '*collaboration* هو العمل المشترك على مهمة أو مشروع، وهي كلمة محايدة تُستخدم كثيرًا في سياق العمل.'
    example_gloss: التعاون الجيد يساعد الفريق على إنجاز العمل.
  en.b2.unit01.lesson03.teach.reading_passage:
    title: 'نص القراءة: الدفاع عن جدول العمل الهجين'
    gloss: 'ترى ميا أن على الشركة أن تُبقي على جدول العمل الهجين في الربع القادم. وموقفها الرئيسي أن العمل الهجين يحسّن الاحتفاظ بالموظفين دون أن يخفض الأداء. وأقوى دليل هو استطلاع الموظفين: فقد قلّ احتمال أن يقول موظفو الفرق الهجينة إنهم يبحثون عن وظيفة أخرى. وأقوى حجة مضادة أن التعاون قد يتضرر حين لا يكون الناس في المكتب كل يوم. تقرّ ميا بهذه المخاوف، لكنها تفنّدها ببيانات المشروع: فقد سلّمت الفرق الهجينة عملها في الموعد، وكانت درجات تقييمها أعلى قليلًا. لذلك تستنتج أن الفوائد أرجح من المخاطر.'
    note: 'يبني النص حجة كاملة: الموقف، والدليل، والحجة المضادة، والتفنيد، والخلاصة.'
  en.b2.unit01.lesson04.teach.q_keep_hybrid:
    title: ميا تذكر موقفها
    gloss: 'تقول ميا: أعتقد أنه ينبغي أن نُبقي على جدول العمل الهجين في الربع القادم.'
    note: تبدأ ميا بموقف واضح يمكن الدفاع عنه.
  en.b2.unit01.lesson04.teach.a_strongest_reason:
    title: دانيال يسأل عن السبب
    gloss: 'يقول دانيال: ما أقوى سبب لديك؟'
    note: لا يسأل دانيال عن رأي عام، بل عن أهم ما يدعم موقفها.
  en.b2.unit01.lesson04.teach.q_retention_survey:
    title: ميا تقدّم الدليل
    gloss: 'تقول ميا: أقوى سبب هو الاحتفاظ بالموظفين. ففي استطلاع الموظفين، قلّ احتمال أن يقول من عملوا بنظام هجين إنهم يبحثون عن وظيفة أخرى.'
    note: تستخدم ميا نتائج الاستطلاع دليلًا، لا مجرد شعور.
  en.b2.unit01.lesson04.teach.a_collaboration_weaker:
    title: دانيال يذكر الحجة المضادة
    gloss: 'يقول دانيال: يقول بعض المديرين إن التعاون يكون أضعف حين لا يكون الناس في المكتب كل يوم.'
    note: هذه هي الحجة المضادة التي ستضطر ميا إلى الرد عليها بعد قليل.
  en.b2.unit01.lesson04.teach.q_data_rebuttal:
    title: ميا تفنّد بالبيانات
    gloss: 'تقول ميا: هذه مخاوف مشروعة. لكن بيانات المشروع لا تدعمها. فقد سلّمت الفرق الهجينة عملها في الموعد، وكانت درجات تقييمها أعلى قليلًا.'
    note: تستخدم *does not support it* الفعل *does* لأن الإنجليزية تحتاج إلى فعل مساعد في النفي.
  en.b2.unit01.lesson04.teach.a_benefits_outweigh:
    title: دانيال يلخّص الموقف
    gloss: 'يقول دانيال: إذن موقفك هو أن الفوائد أرجح من المخاطر؟'
    note: تعبّر *outweigh* عن الموازنة بين الفوائد والمخاطر.
  en.b2.unit01.lesson04.teach.q_improve_routines:
    title: ميا تختم بحل عملي
    gloss: 'تقول ميا: بالضبط. علينا أن نحسّن روتين الاجتماعات، لا أن نلغي الجدول.'
    note: تدافع ميا عن الخطة، لكنها تقترح أيضًا تحسينًا عمليًا.
