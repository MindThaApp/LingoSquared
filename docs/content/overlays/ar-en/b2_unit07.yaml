teaching:
  en.b2.unit07.lesson01.teach.term:
    title: term
    gloss: بند من بنود اتفاق
    note: '*term* هي بند من بنود اتفاق. ولا تعني هنا فصلًا دراسيًا.'
    example_gloss: البند جزء من اتفاقية.
  en.b2.unit07.lesson01.teach.proposal:
    title: proposal
    gloss: اقتراح
    note: '*proposal* اقتراح لبنود محتملة.'
    example_gloss: الاقتراح يعرض بنودًا محتملة.
  en.b2.unit07.lesson01.teach.refusal:
    title: refusal
    gloss: رفض
    note: '*refusal* تقول إن بندًا ما غير مقبول. والرفض الواضح في الإنجليزية يبدو غالبًا أفضل إذا ذُكر معه سبب.'
    example_gloss: الرفض يعني أن بندًا ما غير مقبول.
  en.b2.unit07.lesson01.teach.concession:
    title: concession
    gloss: تنازل
    note: '*concession* تعني أن تتخلى عن جزء من موقفك لجعل الاتفاق ممكنًا.'
    example_gloss: التنازل يتخلى عن جزء من موقف.
  en.b2.unit07.lesson01.teach.scope:
    title: scope
    gloss: نطاق العمل
    note: '*scope* هو مقدار العمل المشمول. وفي المفاوضات يمكنك الموازنة بين الموعد النهائي والنطاق.'
    example_gloss: النطاق هو مقدار العمل المشمول.
  en.b2.unit07.lesson01.teach.condition:
    title: condition
    gloss: شرط
    note: '*condition* هو شيء يجب أن يتحقق قبل أن يصبح الاتفاق سارياً.'
    example_gloss: الشرط يجب تحقيقه قبل أن يصبح الاتفاق ساريًا.
  en.b2.unit07.lesson02.teach.condition_deadline:
    title: تنازل مشروط
    gloss: يمكنني الموافقة على الموعد النهائي الأبكر بشرط تقليص نطاق العمل.
    note: '*I can agree... on condition that...* صيغة واضحة ومهنية في آن واحد. فهي لا تخفّف الموقف بالغموض.'
  en.b2.unit07.lesson02.teach.cannot_agree:
    title: الرفض الواضح
    gloss: لا يمكنني الموافقة على يوم الثلاثاء موعدًا نهائيًا مع نطاق العمل الكامل.
    note: '*I cannot agree to...* تبدو أكثر مهنية من رفض فجّ مثل *No, that is impossible*.'
  en.b2.unit07.lesson02.teach.accept_if:
    title: القبول مع if
    gloss: يمكنني قبول ذلك إذا وصل الملحق الكامل في الأسبوع القادم.
    note: '*I can accept that if...* تجعل الشرط صريحًا.'
  en.b2.unit07.lesson02.teach.grammar_concession:
    title: الرفض مع مواصلة التفاوض
    gloss: استخدم *I cannot agree* لتضع حدًا واضحًا. واستخدم *I can agree on condition that* لتعرض تنازلًا مشروطًا.
    note: الصراحة الشديدة قد تبدو قاسية في الإنجليزية. اذكر الحد الذي لا تتجاوزه، ثم السبب، ثم الشرط.
  en.b2.unit07.lesson03.teach.executive_summary:
    title: executive summary
    gloss: ملخص تنفيذي
    note: '*executive summary* هو الملخص القصير الذي يعرض النقاط الرئيسية في تقرير.'
    example_gloss: الملخص التنفيذي يعرض النقاط الرئيسية في تقرير.
  en.b2.unit07.lesson03.teach.charts:
    title: charts
    gloss: رسوم بيانية
    note: '*charts* تعرض المعلومات بصريًا.'
    example_gloss: الرسوم البيانية تعرض المعلومات بصريًا.
  en.b2.unit07.lesson03.teach.reading_passage:
    title: 'نص القراءة: بنود معدّلة'
    gloss: 'اقترحت بريا أولًا يوم الخميس موعدًا للتقرير الكامل. اعترض ماركوس لأن العميل يحتاج إلى شيء أبكر. رفضت بريا يوم الثلاثاء مع نطاق العمل الكامل لأن ذلك سيعرّض الجودة للخطر. ثم عرضت تنازلًا مشروطًا: يمكن أن يكون الثلاثاء ممكنًا إذا قُلّص النطاق إلى الملخص التنفيذي والرسوم البيانية. قبل ماركوس هذا الشرط، لكنه أضاف بندًا واحدًا: أن يصل الملحق الكامل في الأسبوع القادم. وكانت النتيجة المتفق عليها: الثلاثاء للملخص والرسوم البيانية، والأسبوع القادم للملحق.'
    note: 'هذا تفاوض حازم لكنه مهني: رفض، وسبب، وشرط، واتفاق.'
  en.b2.unit07.lesson04.teach.q_thursday:
    title: بريا تقدّم اقتراحًا
    gloss: 'تقول بريا: يمكننا تسليم التقرير بحلول يوم الخميس إذا بقي نطاق العمل كما هو مخطط.'
    note: إنها تربط الموعد النهائي بنطاق العمل منذ البداية.
  en.b2.unit07.lesson04.teach.a_tuesday:
    title: ماركوس يعترض
    gloss: 'يقول ماركوس: الخميس متأخر جدًا بالنسبة إلى العميل. هل يمكنك التسليم بحلول الثلاثاء؟'
    note: إنه يطلب موعدًا أبكر دون أن يغيّر نطاق العمل فورًا.
  en.b2.unit07.lesson04.teach.q_cannot_tuesday:
    title: بريا ترفض مع ذكر السبب
    gloss: 'تقول بريا: لا يمكنني الموافقة على يوم الثلاثاء مع نطاق العمل الكامل. فهذا سيعرّض الجودة للخطر.'
    note: ذكر السبب يجعل الرفض مهنيًا وأقل فظاظة.
  en.b2.unit07.lesson04.teach.a_what_possible:
    title: ماركوس يسأل عن الشروط
    gloss: 'يقول ماركوس: ما الذي سيجعل يوم الثلاثاء ممكنًا؟'
    note: هذا السؤال يفتح الباب أمام تنازل مشروط.
  en.b2.unit07.lesson04.teach.q_condition:
    title: بريا تعرض شرطًا
    gloss: 'تقول بريا: يمكنني الموافقة على الموعد الأبكر بشرط تقليص نطاق العمل إلى الملخص التنفيذي والرسوم البيانية.'
    note: '*on condition that* صيغة صريحة ومهنية.'
  en.b2.unit07.lesson04.teach.a_accept_appendix:
    title: ماركوس يقبل مع شرط إضافي
    gloss: 'يقول ماركوس: يمكنني قبول ذلك إذا وصل الملحق الكامل في الأسبوع القادم.'
    note: إنه يقبل، لكنه يحدد متى سيُسلَّم الباقي.
  en.b2.unit07.lesson04.teach.q_agreed:
    title: بريا تُنهي الاتفاق
    gloss: 'تقول بريا: اتفقنا. الثلاثاء للملخص والرسوم البيانية، والأسبوع القادم للملحق.'
    note: '*Agreed* تختم التفاوض بإيجاز ووضوح.'
