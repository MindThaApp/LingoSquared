  en.a1.unit44.lesson02.teach.in_the_summer:
    title: in the summer
    gloss: في الصيف
    note: تعني *in the summer* في الصيف. وفي الإنجليزية يجوز غالبًا حذف *the* مع أسماء الفصول، فكلٌّ من *in summer* و*in the summer* صحيح، وكذلك *in spring* و*in fall* و*in winter*.
    example_gloss: نذهب إلى الشاطئ في الصيف.
  en.a1.unit44.lesson02.teach.leaves_change_color:
    title: the leaves change color
    gloss: تتغير ألوان الأوراق
    note: تعني *the leaves change color* أن ألوان الأوراق تتغير.
    example_gloss: في الخريف تتغير ألوان الأوراق.
