    title: it snows a lot
    gloss: تتساقط الثلوج كثيرًا
    note: تعني *it snows a lot* أن الثلج يتساقط كثيرًا.
    example_gloss: تتساقط الثلوج كثيرًا في الشتاء.
  en.a1.unit44.lesson02.teach.flowers_bloom:
