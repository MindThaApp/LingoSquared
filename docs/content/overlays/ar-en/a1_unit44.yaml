  en.a1.unit44.lesson02.teach.whats_your_favorite_season:
    title: What's your favorite season?
    gloss: ما فصلك المفضل؟
    note: يسأل *What's your favorite season?* عن الفصل المفضل لدى شخص ما.
  en.a1.unit44.lesson02.teach.my_favorite_season_is:
    title: My favorite season is fall.
    gloss: فصلي المفضل هو الخريف.
    note: '*My favorite season is ...* هي الطريقة الثابتة للتعبير عن التفضيل.'
  en.a1.unit44.lesson03.teach.dialogue_line1:
    title: سؤال ميا
    gloss: 'تسأل ميا: ما فصلك المفضل يا ليلى؟'
    note: يسأل *What's your favorite ...?* عن تفضيل شخص ما.
  en.a1.unit44.lesson03.teach.dialogue_line2:
    title: "إجابة ليلى"
    gloss: 'تقول ليلى: الخريف. تتغير ألوان الأوراق، والطقس رائع للرسم في الخارج.'
    note: تعني *great weather for painting outside* طقس رائع للرسم في الخارج.
  en.a1.unit44.lesson03.teach.dialogue_line3:
    title: ردّ ميا
    gloss: 'تقول ميا: يبدو جميلًا. فصلي المفضل هو الربيع.'
    note: تعني *My favorite season is spring* فصلي المفضل هو الربيع.
  en.a1.unit44.lesson03.teach.dialogue_line4:
    title: سؤال ليلى
    gloss: 'تسأل ليلى: لماذا الربيع؟'
    note: '*Why spring?* طريقة مختصرة للسؤال عن السبب.'
  en.a1.unit44.lesson03.teach.dialogue_line5:
    title: "إجابة ميا"
    gloss: 'تقول ميا: تتفتح الأزهار، وأحب التقاط الصور لها لحصة التصوير الفوتوغرافي.'
    note: تعني *I love taking photos* أحب التقاط الصور.
  en.a1.unit44.lesson03.teach.dialogue_line6:
    title: سؤال ليلى
    gloss: 'تقول ليلى: هذا منطقي! هل الربيع دافئ أم بارد حيث تسكنين؟'
    note: '*That makes sense!* ردّ طبيعي على تفسير مقنع.'
  en.a1.unit44.lesson03.teach.dialogue_line7:
    title: "إجابة ميا"
    gloss: 'تقول ميا: دافئ في العادة، مع قليل من المطر. مثالي للتنزه في الخارج.'
    note: تعني *with a little rain* مع قليل من المطر.
  en.a1.unit44.lesson04.teach.reading_passage:
    title: نص عن ثلاثة فصول مفضلة
    gloss: لدى دانيال وليلى وميا فصول مفضلة مختلفة. فصل دانيال المفضل هو الصيف. يحب لعب كرة القدم والجري عندما يكون الطقس دافئًا ومشمسًا. وفصل ليلى المفضل هو الخريف لأنها تحب رسم الأوراق وهي تتغير ألوانها. وفصل ميا المفضل هو الربيع. تلتقط صورًا للأزهار لحصة التصوير الفوتوغرافي. ومع أن لكل منهم فصلًا مختلفًا، فإنهم يجدون دائمًا وقتًا للاستمتاع بالهواء الطلق معًا.
    note: تعني *even though* رغم أنّ، مع أنّ.
