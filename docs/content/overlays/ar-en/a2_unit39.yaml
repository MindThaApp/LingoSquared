teaching:
  en.a2.unit39.lesson01.teach.offer:
    title: offer
    gloss: عرض
    note: '*offer* هنا هو العرض الوظيفي. أما الفعل *to offer* فمعناه يعرض.'
    example_gloss: وصلني عرض وظيفي من شركة Bright Path Marketing.
  en.a2.unit39.lesson01.teach.contract:
    title: contract
    gloss: عقد عمل، عقد
    note: '*contract* هو الاتفاق المكتوب بينك وبين الشركة.'
    example_gloss: مدة العقد سنة واحدة.
  en.a2.unit39.lesson01.teach.salary:
    title: salary
    gloss: راتب
    note: '*salary* هو المبلغ الذي تكسبه كل شهر أو كل سنة.'
    example_gloss: يمكننا أن نتحدث عن الراتب الأسبوع القادم.
  en.a2.unit39.lesson01.teach.accept:
    title: accept
    gloss: يقبل
    note: '*accept* تعني قول «نعم» لشيء يُعرض عليك.'
    example_gloss: أودّ أن أقبل الوظيفة.
  en.a2.unit39.lesson01.teach.start_date:
    title: start date
    gloss: تاريخ البدء
    note: '*start date* هو أول يوم في وظيفتك الجديدة.'
    example_gloss: تاريخ البدء هو أول يوم اثنين من الشهر.
  en.a2.unit39.lesson01.teach.reply:
    title: reply
    gloss: ردّ
    note: '*reply* تأتي اسمًا بمعنى ردّ على رسالة، وتأتي فعلًا بمعنى يردّ.'
    example_gloss: أرسلت ردًّا في اليوم نفسه.
  en.a2.unit39.lesson01.teach.grammar_would_like_to:
    title: would like to للتعبير عن رغبة مهذّبة
    gloss: أودّ أن أقبل العرض. أودّ أن أبدأ يوم الاثنين.
    note: '*I would like to ...* أكثر لباقة من *I want to ...*، وتناسب المراسلات المهنية.'
  en.a2.unit39.lesson02.teach.thank_you_for_the_interview:
    title: بدء الرسالة
    gloss: شكرًا لكم على المقابلة أمس.
    note: '*Thank you for ...* هي البداية المعتادة لرسالة شكر قصيرة في سياق العمل.'
  en.a2.unit39.lesson02.teach.still_interested:
    title: قول إنك ما زلت مهتمًّا
    gloss: ما زلت مهتمًّا جدًّا بالوظيفة.
    note: '*still* تعني ما زال، وتأتي قبل الصفة.'
  en.a2.unit39.lesson02.teach.could_you_tell_me_start_date:
    title: السؤال بلباقة عن موعد البدء
    gloss: هل يمكنكم أن تخبروني بتاريخ البدء؟
    note: '*Could you tell me ...?* سؤال غير مباشر، وهو ألطف من *When is the start date?*'
  en.a2.unit39.lesson02.teach.would_like_to_accept:
    title: قبول العرض
    gloss: أودّ أن أقبل العرض.
    note: هذه هي الجملة المعتادة لقبول وظيفة.
  en.a2.unit39.lesson02.teach.grammar_indirect_questions:
    title: الأسئلة غير المباشرة مع Could you tell me
    gloss: هل يمكنكم أن تخبروني بتاريخ البدء؟ هل يمكنكم أن تخبروني عن ساعات العمل؟
    note: 'بعد *Could you tell me* لا نستعمل ترتيب السؤال: نقول *the start date* وليس *what is the start date*.'
  en.a2.unit39.lesson03.teach.full_time:
    title: full time
    gloss: دوام كامل
    note: '*full time* تعني أسبوع عمل كاملًا؛ وعكسها *part time* (دوام جزئي).'
    example_gloss: الوظيفة بدوام كامل، وليست ليومين فقط في الأسبوع.
  en.a2.unit39.lesson03.teach.offer_message:
    title: الرسالة التي تتضمن العرض
    gloss: عزيزتي ميا، شكرًا لحضورك إلينا يوم الثلاثاء. يسعدنا أن نعرض عليك وظيفة منسّقة تسويق. العقد بدوام كامل وتاريخ البدء يوم الاثنين. يُرجى الرد علينا بحلول يوم الجمعة. Bright Path Marketing.
    note: 'الرسالة التي تحمل عرضًا وظيفيًّا تذكر دائمًا أربعة أمور: الوظيفة، ونوع العقد، وتاريخ البدء، والموعد الأخير لردّك.'
  en.a2.unit39.lesson03.teach.please_reply_by_friday:
    title: مهلة الردّ
    gloss: يُرجى الرد بحلول يوم الجمعة.
    note: '*by Friday* تعني في موعد أقصاه يوم الجمعة، أي أن الجمعة نفسه ما زال مقبولًا.'
  en.a2.unit39.lesson04.teach.q_calling_about_interview:
    title: المحاورة تتصل بميا
    gloss: 'المحاورة تقول: مرحبًا يا ميا، أتصل بخصوص المقابلة يوم الثلاثاء.'
    note: '*I am calling about ...* هي الافتتاحية المعتادة لمكالمة عمل.'
  en.a2.unit39.lesson04.teach.a_still_interested:
    title: ميا تقول إنها ما زالت مهتمّة
    gloss: 'ميا تقول: شكرًا لاتصالكم. ما زلت مهتمة جدًّا بالوظيفة.'
    note: الجملة نفسها التي وردت في الدرس 2.
  en.a2.unit39.lesson04.teach.q_offer_you_the_job:
    title: المحاورة تعرض الوظيفة
    gloss: 'المحاورة تقول: جيد، لأننا نودّ أن نعرض عليك الوظيفة.'
    note: '*because* تربط هنا ردّ ميا بالخبر السار الذي يليه.'
  en.a2.unit39.lesson04.teach.a_great_news_ask_start_date:
    title: ميا تتفاعل وتسأل عن موعد البدء
    gloss: 'ميا تقول: هذا خبر رائع. هل يمكنكم أن تخبروني بتاريخ البدء؟'
    note: علّق أولًا باختصار على الخبر، ثم اطرح السؤال.
  en.a2.unit39.lesson04.teach.q_start_date_and_contract:
    title: المحاورة تذكر الموعد والعقد
    gloss: 'المحاورة تقول: تاريخ البدء يوم الاثنين، والعقد بدوام كامل.'
    note: المعلومتان نفسهما اللتان وردتا في الرسالة في الدرس 3.
  en.a2.unit39.lesson04.teach.a_ask_working_hours:
    title: ميا تسأل عن ساعات العمل
    gloss: 'ميا تسأل: هل يمكنكم أن تخبروني عن ساعات العمل؟'
    note: صيغة السؤال غير المباشر نفسها المستعملة مع تاريخ البدء.
  en.a2.unit39.lesson04.teach.q_nine_to_five:
    title: المحاورة تذكر ساعات العمل
    gloss: 'المحاورة تقول: من التاسعة إلى الخامسة، مع ساعة للغداء.'
    note: '*from nine to five* عبارة ثابتة لوصف يوم العمل.'
  en.a2.unit39.lesson04.teach.a_accept_the_offer:
    title: ميا تقبل العرض
    gloss: 'ميا تقول: شكرًا لكم. أودّ أن أقبل العرض.'
    note: الجملة نفسها التي وردت في الدرس 2.
  en.a2.unit39.lesson04.teach.q_send_the_contract:
    title: المحاورة تنهي المقابلة
    gloss: 'المحاورة تقول: رائع. سنرسل لك العقد اليوم.'
    note: '*Wonderful* ردّ إيجابي دافئ، ومألوف جدًّا حتى في الإنجليزية المهنية.'
