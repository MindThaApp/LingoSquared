    note: تعني *warm up quickly* أن يرتاح المرء بسرعة مع الناس الجدد.
    example_gloss: هو خجول، لكنه يتآلف بسرعة بمجرد أن يعرفك.
  en.a1.unit42.lesson02.teach.whats_he_like_question:
    title: What's he like?
    gloss: كيف هو؟
    note: يسأل *What's he like?* عن طباع شخص ما، لا عن مظهره.
  en.a1.unit42.lesson03.teach.dialogue_line1:
    title: سؤال ميا
    gloss: 'تسأل ميا: سأبدأ مشروعًا جديدًا مع دانيال الأسبوع القادم. كيف هو؟'
    note: يسأل *What's he like?* عن طباع شخص ما.
  en.a1.unit42.lesson03.teach.dialogue_line2:
    title: "إجابة ليلى"
    gloss: 'تقول ليلى: إنه ودود جدًا، وطريف حقًا أيضًا.'
    note: تعني *and he's really funny too* وهو طريف حقًا أيضًا.
  en.a1.unit42.lesson03.teach.dialogue_line3:
    title: سؤال ميا
    gloss: 'تقول ميا: يسعدني سماع ذلك! هل من السهل العمل معه؟'
    note: يسأل *Is he easy to work with?* هل العمل مع شخص ما مريح.
  en.a1.unit42.lesson03.teach.dialogue_line4:
    title: "إجابة ليلى"
    gloss: 'تقول ليلى: نعم، وهو مجتهد جدًا أيضًا. ينهي مهامه دائمًا في الوقت المحدد.'
    note: تعني *finishes his tasks on time* ينهي مهامه في الوقت المحدد.
  en.a1.unit42.lesson03.teach.dialogue_line5:
    title: سؤال ميا
    gloss: 'تسأل ميا: هل يخجل أحيانًا في الاجتماعات؟'
    note: تعني *ever* هنا «أحيانًا» أو «في أي وقت».
  en.a1.unit42.lesson03.teach.dialogue_line6:
    title: "إجابة ليلى"
    gloss: 'تقول ليلى: قليلًا، لكنه يرتاح أكثر بمجرد أن يعرفك.'
    note: تعني *once he knows you* بمجرد أن يعرفك.
  en.a1.unit42.lesson03.teach.dialogue_line7:
    title: شكر ميا
    gloss: 'تقول ميا: شكرًا يا ليلى. أشعر الآن براحة أكبر تجاه المشروع.'
    note: تعني *I feel more relaxed* أشعر براحة أكبر وبمزيد من الاسترخاء.
  en.a1.unit42.lesson04.teach.reading_passage:
    title: نص عن ثلاث شخصيات
    gloss: دانيال وليلى وميا أصدقاء مقرّبون، لكن شخصياتهم مختلفة جدًا. دانيال ودود وطريف، فهو يُضحك أصدقاءه دائمًا. وهو خجول قليلًا عندما يقابل أشخاصًا جددًا، لكنه يتآلف بسرعة. ليلى هادئة ومبدعة. تحب الرسم لأنه يساعدها على الاسترخاء، وقلّما تنزعج من أي شيء. ميا اجتماعية ومنظّمة. تحب وضع الخطط للمجموعة، وهي صبورة جدًا عندما تعلّم أصدقاءها شيئًا جديدًا، فقد علّمت دانيال الطبخ. ورغم اختلافهم جميعًا، فإنهم يتفاهمون جيدًا ويستمتعون بقضاء الوقت معًا.
    note: تعني *even though* رغم أنّ، مع أنّ.
