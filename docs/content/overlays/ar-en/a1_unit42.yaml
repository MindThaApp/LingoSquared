    gloss: خجول قليلًا
    note: تعني *a little* هنا «قليلًا» من حيث الدرجة، وليس «صغيرًا» من حيث الحجم، فلا تترجمها حرفيًا.
    example_gloss: هو خجول قليلًا في البداية، لكنه يتآلف بسرعة.
  en.a1.unit42.lesson02.teach.very_hardworking:
