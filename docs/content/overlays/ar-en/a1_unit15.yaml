teaching:
  en.a1.unit15.lesson01.teach.cash:
    title: Cash
    gloss: نقد
    note: '*cash* هو المال النقدي (الأوراق والعملات المعدنية). في الإنجليزية لا يُعَدّ: نقول *some cash* ولا نقول أبدًا *a cash*.'
    example_gloss: معي بعض النقود.
  en.a1.unit15.lesson01.teach.card:
    title: Card
    gloss: بطاقة
    note: '*card* هي الكلمة العامة لأي بطاقة دفع بلاستيكية.'
    example_gloss: بطاقتي زرقاء.
  en.a1.unit15.lesson01.teach.credit_card:
    title: Credit card
    gloss: بطاقة ائتمان
    note: '*credit card* بطاقة تقترض بها المال من المصرف وتسدّده لاحقًا. يقابلها في العربية «بطاقة الائتمان».'
  en.a1.unit15.lesson01.teach.debit_card:
    title: Debit card
    gloss: بطاقة خصم مباشر
    note: '*debit card* بطاقة يُخصم بها المبلغ فورًا من حسابك المصرفي. بطاقة الصراف الآلي المعتادة عندنا تُستعمل غالبًا على هذا النحو.'
  en.a1.unit15.lesson01.teach.total:
    title: Total
    gloss: المبلغ الإجمالي
    note: '*total* هو المبلغ الكامل الذي عليك دفعه.'
    example_gloss: كم المبلغ الإجمالي؟
  en.a1.unit15.lesson02.teach.do_you_take_cards:
    title: Do you take credit cards?
    gloss: هل تقبلون بطاقات الائتمان؟
    note: '*Do you take credit cards?* هو السؤال المعتاد قبل الدفع. الفعل *take* يعني هنا «يقبل».'
  en.a1.unit15.lesson02.teach.cash_only:
    title: Sorry, cash only.
    gloss: آسف، الدفع نقدًا فقط.
    note: '*Sorry, cash only.* هو الرد المعتاد من المتاجر التي لا تقبل البطاقات.'
  en.a1.unit15.lesson02.teach.ill_pay_by_card:
    title: Yes, I'll pay by card.
    gloss: نعم، سأدفع بالبطاقة.
    note: '*Yes, I''ll pay by card.* هي الطريقة النهائية التي تختارها للدفع. بعد *by* تأتي *card* بلا أداة تعريف أو تنكير.'
  en.a1.unit15.lesson03.teach.tax:
    title: Tax
    gloss: ضريبة
    note: '*tax* هي الضريبة؛ في معظم المتاجر الأمريكية تُضاف إلى السعر عند الصندوق فقط، وليست مكتوبة ضمن السعر على الرف.'
    example_gloss: الضريبة دولار واحد.
  en.a1.unit15.lesson03.teach.receipt_text:
    title: "نص إيصال الشراء"
    gloss: 'قهوة: 3 دولارات. ساندويتش: 6 دولارات. ضريبة: دولار واحد. المجموع: 10 دولارات.'
    note: هذا إيصال شراء حقيقي.
  en.a1.unit15.lesson03.teach.total_summary_sentence:
    title: The total is $10.
    gloss: المبلغ الإجمالي 10 دولارات.
    note: تلخّص هذه الجملة المبلغ الإجمالي في الإيصال بجملة كاملة.
  en.a1.unit15.lesson04.teach.q_total:
    title: "السؤال عن المبلغ الإجمالي"
    gloss: تسأل ليلى عن المبلغ الإجمالي
    note: '*How much is the total?* هو السؤال المعتاد عن المبلغ النهائي. نستعمل *is* مع المفرد لأن *the total* مجموع واحد.'
  en.a1.unit15.lesson04.teach.a_fifteen:
    title: "الجواب عن المبلغ الإجمالي"
    gloss: 'يقول البائع: المبلغ خمسة عشر دولارًا.'
    note: '*It''s fifteen dollars.* إجابة كاملة عن سؤال المبلغ الإجمالي.'
  en.a1.unit15.lesson04.teach.q_cards:
    title: "السؤال عن الدفع بالبطاقة"
    gloss: تسأل ليلى هل تُقبل بطاقات الائتمان
    note: هو السؤال نفسه الذي سبق.
  en.a1.unit15.lesson04.teach.a_yes_we_do:
    title: "الجواب عن الدفع بالبطاقة"
    gloss: 'يقول البائع: نعم، نقبلها.'
    note: '*Yes, we do.* إجابة قصيرة كاملة. في الإنجليزية نكرّر الفعل المساعد *do* بدل الاكتفاء بقول «نعم».'
  en.a1.unit15.lesson04.teach.closing_pay_by_card:
    title: "اختيار طريقة الدفع"
    gloss: 'تقول ليلى: ممتاز، سأدفع بالبطاقة.'
    note: تنهي هذه الجملة المحادثة باختيار طريقة الدفع.
