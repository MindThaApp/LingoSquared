    example_gloss: لا أوافق على هذا الرأي.
  en.b1.unit04.lesson01.teach.opinion:
    title: opinion
    gloss: رأي
    note: '*opinion* تعني وجهة نظر شخصية في شيء ما.'
    example_gloss: لكل شخص رأي مختلف.
  en.b1.unit04.lesson01.teach.believe:
    title: believe
    gloss: اعتقد، ظنّ
    note: '*believe* تعني أن تعتقد أن شيئًا ما صحيح.'
    example_gloss: أعتقد أنها فكرة جيدة.
  en.b1.unit04.lesson01.teach.reason:
    title: reason
    gloss: سبب
    note: '*reason* تعني التفسير الذي يقف وراء الرأي.'
    example_gloss: ما سبب تفكيرك بهذه الطريقة؟
  en.b1.unit04.lesson01.teach.save_time:
    title: save time
    gloss: وفّر الوقت
    note: '*save time* تعني أن تحتاج إلى وقت أقل لإنجاز شيء ما.'
    example_gloss: العمل من المنزل يساعدني على توفير الوقت.
  en.b1.unit04.lesson02.teach.agree_that_saves_time:
    title: الموافقة مع ذكر السبب
    gloss: أوافق على أن العمل من المنزل أفضل لأنك توفّر الوقت.
    note: '*I agree that... because...* تربط الرأي بسببه.'
  en.b1.unit04.lesson02.teach.disagree_that_miss_coworkers:
    title: الاعتراض مع ذكر السبب
    gloss: لا أوافق على أنه أفضل لأنك تفتقد زملاءك في العمل.
    note: '*I disagree that... because...* تربط الرأي المخالف بسببه.'
  en.b1.unit04.lesson02.teach.grammar_agree_disagree_that:
    title: agree that / disagree that
    gloss: أوافق على أنه أفضل. لا أوافق على أنه أفضل.
    note: بعد *agree* أو *disagree* تأتي *that* لتقدّم الجملة التي تذكر الرأي الذي توافق عليه أو لا توافق عليه. وفي الإنجليزية لا تُوضع فاصلة قبل *that*.
  en.b1.unit04.lesson03.teach.focus:
    title: focus
    gloss: يركّز
    note: '*focus* تعني أن توجّه انتباهك إلى شيء ما.'
    example_gloss: تستطيع أن تركّز في المنزل بسهولة أكبر.
  en.b1.unit04.lesson03.teach.respect:
    title: respect
    gloss: يحترم
    note: '*respect* تعني أن تقدّر رأي الآخر حتى لو لم توافق عليه.'
    example_gloss: هم يحترمون رأي بعضهم بعضًا.
  en.b1.unit04.lesson03.teach.reading_passage:
    title: 'نص للقراءة: رأيان'
    gloss: ترى ميا أن العمل من المنزل أفضل لأنها تستطيع التركيز فيه بسهولة أكبر. أما ليلى فلها رأي آخر. فهي تعتقد أن الذهاب إلى المكتب أفضل لأنها تحب أن ترى زملاءها كل يوم. هما لا تتفقان، لكنهما تحترمان رأي إحداهما الأخرى.
    note: نص قصير للقراءة فيه رأيان متعارضان.
  en.b1.unit04.lesson04.teach.q_working_from_home:
    title: دانيال يفتتح النقاش
    gloss: 'يقول دانيال: هل تعتقدين أن العمل من المنزل أفضل من العمل في المكتب؟'
    note: سؤال مفتوح يبدأ نقاشًا بين رأيين مختلفين.
  en.b1.unit04.lesson04.teach.a_disagree_miss_coworkers:
    title: ليلى ترى الأمر بشكل مختلف
    gloss: 'تقول ليلى: لا أوافق على أنه أفضل. أظن أنك تفوّت محادثات مهمة مع الزملاء.'
    note: تذكر ليلى رأيها وسببه.
  en.b1.unit04.lesson04.teach.q_fair_point_saves_time:
    title: دانيال يقرّ بحجة ليلى لكنه يتمسّك برأيه
    gloss: 'يقول دانيال: كلامك وجيه، لكنني أوافق على أنه يوفّر كثيرًا من الوقت.'
    note: تعبّر *that's a fair point* عن الاعتراف بوجاهة كلام الآخر قبل أن تذكر رأيك.
  en.b1.unit04.lesson04.teach.a_agree_saves_time_prefer_office:
    title: ليلى تتنازل قليلًا لكنها تتمسّك بتفضيلها
    gloss: 'تقول ليلى: أوافق على أنه يوفّر الوقت، لكنني ما زلت أفضّل المكتب.'
    note: تسلّم ليلى بنقطة من كلامه دون أن تغيّر رأيها العام.
  en.b1.unit04.lesson04.teach.q_everyone_different_opinion:
    title: دانيال ينهي المحادثة
    gloss: 'يقول دانيال: أفهم ما تقصدين. لكل شخص رأي مختلف.'
    note: طريقة طبيعية ولطيفة لإنهاء اختلاف في الرأي.
