    gloss: 'يقول دانيال: أريد قصّة شعر، من فضلك. ستزورني أختي الأسبوع القادم.'
    note: تأتي *haircut* اسمًا بعد *I'd like*، أي «أريد قصّة شعر»، وليست فعلًا.
  en.a1.unit52.lesson03.teach.dialogue_line3:
    title: "الحلّاق يسأل"
    gloss: 'يسأل الحلّاق: بالتأكيد، أي تسريحة تريد؟'
    note: تعني *what style do you want* «أي تسريحة تريد؟».
  en.a1.unit52.lesson03.teach.dialogue_line4:
    title: رغبة دانيال
    gloss: 'يقول دانيال: التسريحة نفسها، لكن أقصر قليلًا.'
    note: تعني *just a little shorter* «أقصر قليلًا فقط».
  en.a1.unit52.lesson03.teach.dialogue_line5:
    title: سؤال ميا
    gloss: 'تسأل ميا: هل يمكنك أن تغسل شعره أولًا؟'
    note: تعني *Can you wash his hair first?* «هل يمكنك أن تغسل شعره أولًا؟»
  en.a1.unit52.lesson03.teach.dialogue_line6:
    title: الحلّاق يؤكد
    gloss: 'يقول الحلّاق: بالطبع، وهذا مشمول مع قصّة الشعر.'
