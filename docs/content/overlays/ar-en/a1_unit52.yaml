  en.a1.unit52.lesson03.teach.dialogue_line8:
    title: السعر
    gloss: 'يقول الحلّاق: إنها عشرون دولارًا.'
    note: هذه الجملة تكرار لما تعلّمته سابقًا.
  en.a1.unit52.lesson04.teach.reading_passage:
    title: نص عن زيارة إلى الحلّاق
    gloss: 'زيارة إلى الحلّاق: كانت أخت دانيال ستأتي من شيكاغو للزيارة الأسبوع القادم، فقرّر أن يقصّ شعره. اقترحت ميا حلّاقتها المفضلة في صالون صغير قرب شقتها، وذهبت معه. سألته الحلّاقة أي تسريحة يريد، فقال التسريحة نفسها لكن أقصر قليلًا. غسلت شعره أولًا، وكان الغسل مشمولًا مع قصّة الشعر. كلّفت قصّة الشعر عشرين دولارًا. وعندما انتهيا قالت ميا إن شعره يبدو رائعًا. وفي طريق العودة التقيا ليلى لتناول القهوة. كانت تشعر بتحسن كبير بعد نزلة البرد، وأعجبتها قصّة شعر دانيال الجديدة أيضًا.'
    note: تعني *looked great* «بدا رائعًا».
