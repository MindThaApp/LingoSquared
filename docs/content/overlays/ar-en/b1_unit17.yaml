teaching:
  en.b1.unit17.lesson01.teach.regret:
    title: regret
    gloss: ندم، أسف
    note: '*regret* تعني شعورًا بالحزن على شيء فعلته أو لم تفعله.'
    example_gloss: شعر دانيال بالندم لأنه فاته الموعد النهائي.
  en.b1.unit17.lesson01.teach.wish:
    title: wish
    gloss: أمنية، تمنٍّ
    note: '*wish* تعني تمنّي أن يكون ما حدث مختلفًا عمّا حدث فعلًا.'
    example_gloss: كانت لدى دانيال أمنية بخصوص الأسبوع الماضي.
  en.b1.unit17.lesson01.teach.mistake:
    title: mistake
    gloss: خطأ
    note: '*mistake* تعني شيئًا فعلته على نحو خاطئ بسبب تقدير غير صائب.'
    example_gloss: كان الانتظار طويلًا قبل طلب المساعدة خطأً.
  en.b1.unit17.lesson01.teach.hindsight:
    title: hindsight
    gloss: بعد فوات الأوان، بنظرة إلى الوراء
    note: '*hindsight* تعني فهم حدث ما بعد وقوعه فقط.'
    example_gloss: بنظرة إلى الوراء، كان ينبغي لدانيال أن يتكلم أبكر.
  en.b1.unit17.lesson01.teach.procrastinate:
    title: procrastinate
    gloss: يسوّف، يؤجّل
    note: '*procrastinate* تعني تأجيل أمر كان ينبغي أن تفعله.'
    example_gloss: كثيرًا ما يسوّف دانيال المهام عندما تبدو صعبة.
  en.b1.unit17.lesson01.teach.delay:
    title: delay
    gloss: تأخير
    note: '*delay* تعني مدة يأتي بعدها الشيء متأخرًا عمّا كان مخططًا له.'
    example_gloss: تسبب التأخير في أن يفوت دانيال موعده النهائي الأول.
  en.b1.unit17.lesson02.teach.wish_had_asked:
    title: I wish I had + التصريف الثالث
    gloss: لو أنني طلبت المساعدة أبكر.
    note: '*I wish I had asked* تعبّر عن أمنية بشأن شيء لم يحدث في الماضي.'
  en.b1.unit17.lesson02.teach.should_have_talked:
    title: I should have + التصريف الثالث
    gloss: كان ينبغي أن أتحدث إلى مديري أبكر.
    note: '*I should have talked* تقول ما كان التصرف الصحيح في الماضي.'
  en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished:
    title: if I had + التصريف الثالث, I would have + التصريف الثالث
    gloss: لو طلبت المساعدة من ميا في الأسبوع الأول، لأنجزت العمل في الوقت المحدد.
    note: '*if I had asked..., I would have finished...* تصف نتيجة غير واقعية في الماضي.'
  en.b1.unit17.lesson02.teach.grammar_past_hypothetical:
    title: صيغ التعبير عن الندم على الماضي
    gloss: للتعبير عن الندم على الماضي، استخدم wish + الماضي التام (I wish I had asked...)، أو should have + اسم المفعول (I should have talked...)، أو if + الماضي التام مع would have + اسم المفعول (If I had asked..., I would have finished...). الصيغ الثلاث كلها تصف ما لم يحدث فعلًا.
    note: 'الصيغة: اختر بين wish + had، أو should have، أو if + had ... would have.'
  en.b1.unit17.lesson03.teach.looking_back:
    title: looking back
    gloss: بنظرة إلى الوراء
    note: '*looking back* تبدأ تأمّلًا في الماضي.'
    example_gloss: بنظرة إلى الوراء، يتمنى دانيال لو طلب المساعدة أبكر.
  en.b1.unit17.lesson03.teach.missed_deadline:
    title: missed deadline
    gloss: موعد نهائي فائت
    note: '*missed deadline* تعني موعدًا لم يُلتزم به.'
    example_gloss: فاته موعد نهائي قبل أن يطلب دانيال المساعدة.
  en.b1.unit17.lesson03.teach.reading_passage:
    title: 'نص للقراءة: نظرة إلى الوراء على شهر مرهق'
    gloss: مرحبًا ليلى، بنظرة إلى الوراء، أتمنى لو طلبت المساعدة أبكر. كان ينبغي أن أتحدث إلى مديري أبكر عن عبء العمل. وعندما فعلت ذلك، كان قد فاتني موعد نهائي بالفعل. لو طلبت المساعدة من ميا في الأسبوع الأول، لأنجزت المشروعين في الوقت المحدد. كان الانتظار طويلًا خطأً. دانيال
    note: رسالة قصيرة تأملية.
  en.b1.unit17.lesson04.teach.q_wish_asked_sooner:
    title: دانيال يبدأ بتأمّل
    gloss: 'يقول دانيال: بنظرة إلى الوراء، أتمنى لو طلبت المساعدة أبكر.'
    note: '*looking back* تفتتح محادثة تأملية.'
  en.b1.unit17.lesson04.teach.a_what_happened:
    title: ليلى تستفسر
    gloss: 'تقول ليلى: ماذا حدث؟'
    note: سؤال مفتوح قصير لمعرفة المزيد.
  en.b1.unit17.lesson04.teach.q_should_have_talked_missed:
    title: دانيال يشرح ما كان ينبغي أن يفعله
    gloss: 'يقول دانيال: كان ينبغي أن أتحدث إلى مديري أبكر عن عبء العمل. وعندما فعلت ذلك، كان قد فاتني موعد نهائي بالفعل.'
    note: '*should have talked* و*had already missed* تربطان الندم بنتيجة محددة.'
  en.b1.unit17.lesson04.teach.a_fair_regret_fixed:
    title: ليلى تطمئن دانيال
    gloss: 'تقول ليلى: لا تقلق. لقد حللت الأمر في النهاية.'
    note: '*Don''t worry* تطمئن شخصًا يشعر بالذنب.'
  en.b1.unit17.lesson04.teach.q_true_if_had_asked:
    title: دانيال يصف ما كان يمكن أن يكون مختلفًا
    gloss: 'يقول دانيال: صحيح. لو طلبت المساعدة من ميا في الأسبوع الأول، لأنجزت المشروعين في الوقت المحدد.'
    note: '*if I had asked..., I would have finished...* تصف نتيجة غير واقعية في الماضي.'
  en.b1.unit17.lesson04.teach.a_now_you_know:
    title: ليلى تختم بنبرة مشجّعة
    gloss: 'تقول ليلى: حسنًا، الآن عرفت ما تفعله في المرة القادمة.'
    note: ختام قصير وإيجابي للمحادثة.
