teaching:
  en.a1.unit53.lesson01.teach.rent:
    title: rent
    gloss: يستأجر
    note: 'تعني *rent* يستأجر. والفعل *rent* نفسه يُستعمل في الاتجاهين: أن تستأجر شيئًا من أحد، وأن تؤجّر شيئًا لأحد، فانتبه إلى السياق لتعرف المقصود، كما في العربية حين نقول «أجّر» و«استأجر».'
    example_gloss: أريد أن أستأجر دراجة.
  en.a1.unit53.lesson01.teach.deposit:
    title: deposit
    gloss: تأمين / وديعة
    note: تعني *deposit* المبلغ التأميني، أي المال الذي تدفعه مقدمًا ويُردّ إليك عند إعادة الدراجة سليمة.
    example_gloss: مبلغ التأمين عشرون دولارًا.
  en.a1.unit53.lesson01.teach.return:
    title: return
    gloss: يُعيد
    note: تعني *return* هنا إعادة شيء إلى مكانه، وليس العودة بنفسك.
    example_gloss: من فضلك أعد الدراجة اليوم.
  en.a1.unit53.lesson01.teach.hour:
    title: hour
    gloss: ساعة
    note: تعني *hour* ساعة.
    example_gloss: تكلّف عشرة دولارات في الساعة.
  en.a1.unit53.lesson01.teach.size:
    title: size
    gloss: المقاس
    note: تعني *size* المقاس.
    example_gloss: أي مقاس تحتاج؟
  en.a1.unit53.lesson01.teach.helmet:
    title: helmet
    gloss: خوذة
    note: تعني *helmet* خوذة.
    example_gloss: هل لديك خوذة؟
  en.a1.unit53.lesson02.teach.id_like_to_rent_a_bike:
    title: I'd like to rent a bike, please.
    gloss: أودّ أن أستأجر دراجة، من فضلك.
    note: '*I''d like to* هي اختصار *I would like to*، وهي الطريقة المهذّبة لطلب شيء، وأكثر لطفًا من *I want* المباشرة.'
  en.a1.unit53.lesson02.teach.how_much_does_it_cost_per_hour:
    title: How much does it cost per hour?
    gloss: كم تبلغ التكلفة في الساعة؟
    note: تستعمل *does it cost* الفعل المساعد *does* لأن الفعل الأساسي هو *cost*، وهي البنية نفسها مع *do* في أسئلة إنجليزية أخرى.
  en.a1.unit53.lesson02.teach.i_need_a_small_bike:
    title: I need a small bike.
    gloss: أحتاج إلى دراجة صغيرة.
    note: '*need a small bike* تعني «أحتاج إلى دراجة صغيرة»، ويأتي الاسم بعد *need* مباشرة دون حرف جر، بينما نقول في العربية «أحتاج إلى».'
  en.a1.unit53.lesson02.teach.can_i_have_a_helmet:
    title: Can I have a helmet, please?
    gloss: هل يمكنني الحصول على خوذة، من فضلك؟
    note: '*Can I have ...?* طريقة مهذّبة معتادة لطلب شيء في المحال. وهي تعني حرفيًا «هل يمكنني أن آخذ ...؟»، لكنها تبدو مهذّبة في الإنجليزية كما نقول «هل لي بـ ...؟».'
  en.a1.unit53.lesson02.teach.when_do_i_need_to_return_it:
    title: When do I need to return it?
    gloss: متى يجب أن أعيدها؟
    note: في *do I need to* يظهر الفعل المساعد *do* مرة أخرى لتكوين السؤال.
  en.a1.unit53.lesson02.teach.its_ten_dollars_an_hour:
    title: It's ten dollars an hour.
    gloss: إنها عشرة دولارات في الساعة.
    note: تعني *an hour* هنا «في الساعة»، فيدلّ حرف التنكير *an* على معنى «لكل» مع وحدات الوقت، كما يفعل *a* مع وحدات أخرى.
  en.a1.unit53.lesson03.teach.dialogue_line1:
    title: صاحب المحل يرحّب بهما
    gloss: 'يقول صاحب المحل: مرحبًا! كيف يمكنني مساعدتكما اليوم؟'
    note: '*How can I help you today?* جملة افتتاحية مهذّبة معتادة في المحال والخدمات.'
  en.a1.unit53.lesson03.teach.dialogue_line2:
    title: طلب ميا
    gloss: 'تقول ميا: نودّ أن نستأجر دراجتين. نريد أن نتجول بالدراجة على ضفة النهر.'
    note: في *We'd like to rent* يظهر الفعل *rent* مرة أخرى، وهو هنا بمعنى الاستئجار من المحل وليس التأجير.
  en.a1.unit53.lesson03.teach.dialogue_line3:
    title: صاحب المحل يسأل عن المقاس
    gloss: 'يقول صاحب المحل: بالتأكيد. أي مقاس تحتاجان؟'
    note: تستعمل *What size do you need?* الفعل المساعد *do* لتكوين السؤال مرة أخرى.
  en.a1.unit53.lesson03.teach.dialogue_line4:
    title: مقاس ليلى
    gloss: 'تقول ليلى: أحتاج إلى واحدة صغيرة.'
    note: تحلّ *one* هنا محل كلمة *bike* حتى لا تكررها، فهي كلمة مستقلة تقابل «واحدة» في العربية، ويحدّد المقاس بعدها «صغيرة».
  en.a1.unit53.lesson03.teach.dialogue_line5:
    title: مقاس ميا
    gloss: 'تقول ميا: وأنا أحتاج إلى واحدة متوسطة.'
    note: تأتي *one* هنا أيضًا بدلًا من *bike*، كما في جملة ليلى السابقة.
  en.a1.unit53.lesson03.teach.dialogue_line6:
    title: السعر ومبلغ التأمين
    gloss: 'يقول صاحب المحل: رائع، هاتان دراجتاكما. السعر عشرة دولارات في الساعة، ومبلغ التأمين عشرون دولارًا.'
    note: تتضمن هذه الجملة معلومتين منفصلتين، سعر الساعة ومبلغ التأمين، فانتبه كي لا تخلط بينهما.
  en.a1.unit53.lesson03.teach.dialogue_line7:
    title: ميا تسأل عن موعد الإعادة
    gloss: 'تقول ميا: متى يجب أن نعيدهما؟'
    note: تشير *them* هنا إلى الدراجتين، وهي صيغة الجمع.
  en.a1.unit53.lesson03.teach.dialogue_line8:
    title: موعد الإعادة
    gloss: 'يقول صاحب المحل: من فضلكما أعيداهما قبل الساعة الخامسة.'
    note: تعني *by five o'clock* «في موعد أقصاه الخامسة»، أي ليس بعد ذلك.
  en.a1.unit53.lesson03.teach.dialogue_line9:
    title: ليلى تشكر صاحب المحل
    gloss: 'تقول ليلى: رائع، شكرًا لك!'
    note: '*Great, thank you!* طريقة قصيرة معتادة لإنهاء الحديث بأدب.'
  en.a1.unit53.lesson04.teach.reading_passage:
    title: نص عن جولة بالدراجة على ضفة النهر
    gloss: في عصر يوم دافئ، دعت ميا صديقتها ليلى إلى ركوب الدراجات على ضفة النهر القريب من شقتها. لم تكن لدى أيٍّ منهما دراجة، فذهبتا معًا إلى محل لتأجير الدراجات. سأل البائع أي مقاس تحتاجان، فأخذت ليلى دراجة صغيرة وأخذت ميا دراجة متوسطة. كان الإيجار عشرة دولارات في الساعة، ومبلغ التأمين عشرين دولارًا للدراجتين. كان عليهما إعادة الدراجتين قبل الساعة الخامسة. كانت الجولة على ضفة النهر جميلة، ورأتا أشخاصًا يتمشّون مع كلابهم ويستمتعون بالطقس المشمس. أعادتا الدراجتين في الموعد تمامًا واستردّتا مبلغ التأمين. بعد ذلك حدّثتا دانيال عن الجولة، فقال إنه يريد الانضمام إليهما في المرة القادمة.
    note: '*owned* هي صيغة الماضي من *own* أي «يملك»، فتعني *Neither of them owned a bike* أنه لا يملك أيٌّ منهما دراجة.'
