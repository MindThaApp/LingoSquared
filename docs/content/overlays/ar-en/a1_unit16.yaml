teaching:
  en.a1.unit16.lesson01.teach.wake_up:
    title: Wake up
    gloss: يستيقظ
    note: '*wake up* تعني يستيقظ من النوم. هي فعل مع أداة وتُكتب كلمتين منفصلتين.'
  en.a1.unit16.lesson01.teach.get_dressed:
    title: Get dressed
    gloss: يرتدي ملابسه
    note: '*get dressed* تعني يرتدي ملابسه. لا يوجد ضمير انعكاسي في الإنجليزية: لا نقول *get yourself dressed*.'
  en.a1.unit16.lesson01.teach.go_to_work:
    title: Go to work
    gloss: يذهب إلى العمل
    note: '*go to work* تعني يذهب إلى العمل. لا تأتي أداة قبل *work* في هذا التعبير الثابت.'
  en.a1.unit16.lesson01.teach.have_dinner:
    title: Have dinner
    gloss: يتناول العشاء
    note: '*have dinner* تعني يتناول العشاء. تأتي أسماء الوجبات بلا أداة: *have breakfast* و*have lunch* و*have dinner*.'
  en.a1.unit16.lesson01.teach.go_to_bed:
    title: Go to bed
    gloss: يذهب إلى النوم
    note: '*go to bed* تعني يذهب إلى فراشه لينام. هنا أيضًا لا تأتي أداة قبل *bed*.'
  en.a1.unit16.lesson02.teach.what_time_wake_up:
    title: What time do you wake up?
    gloss: في أي ساعة تستيقظ؟
    note: 'نسأل بـ *What time do you wake up?* عن وقت الاستيقاظ. يحتاج السؤال إلى الفعل المساعد *do*: لا نقول *What time wake you up*.'
  en.a1.unit16.lesson02.teach.i_wake_up_at:
    title: I wake up at seven every day.
    gloss: أستيقظ في السابعة كل يوم.
    note: نستعمل *every day* للعادة اليومية. تأتي في آخر الجملة أو في أولها.
  en.a1.unit16.lesson02.teach.in_the_morning:
    title: I get dressed in the morning.
    gloss: أرتدي ملابسي في الصباح.
    note: '*in the morning* تحدّد جزءًا من اليوم لا ساعة بعينها. وتقابل «في الصباح» في العربية.'
  en.a1.unit16.lesson02.teach.usually_at_night:
    title: I usually go to bed at eleven.
    gloss: أنام عادةً في الحادية عشرة.
    note: '*usually* تعني «عادةً»؛ وهي تصف عادة لا تتكرّر دائمًا بالشكل نفسه. انتبه إلى مكانها: في الإنجليزية تأتي *usually* قبل الفعل الرئيسي (*I usually go*). وهي لا تتنقّل بحرية في الجملة كما في العربية؛ فالجملة *I go usually to bed* خاطئة.'
  en.a1.unit16.lesson03.teach.then:
    title: Then
    gloss: ثم / بعد ذلك
    note: '*then* تعني «ثم» أو «بعد ذلك»؛ وتبيّن ترتيب الأحداث.'
    example_gloss: أتناول الفطور ثم أذهب إلى العمل.
  en.a1.unit16.lesson03.teach.routine_text:
    title: "نص عن روتين يومي"
    gloss: كل يوم أستيقظ في السابعة. ثم أرتدي ملابسي وأتناول الفطور.
    note: هذا وصف قصير لروتين الصباح.
  en.a1.unit16.lesson04.teach.after_that:
    title: What do you do after that?
    gloss: ماذا تفعل بعد ذلك؟
    note: نسأل بـ *What do you do after that?* عمّا يلي في الروتين اليومي.
  en.a1.unit16.lesson04.teach.q_wake_time:
    title: "السؤال عن وقت الاستيقاظ"
    gloss: 'تسأل ليلى: في أي ساعة تستيقظ؟'
    note: هو السؤال نفسه الذي سبق.
  en.a1.unit16.lesson04.teach.a_wake_seven:
    title: "الجواب عن وقت الاستيقاظ"
    gloss: 'يقول دانيال: أستيقظ في السابعة كل يوم.'
    note: تذكر الإجابة الكاملة الساعة والتكرار اليومي معًا.
  en.a1.unit16.lesson04.teach.q_after_that:
    title: "السؤال عمّا بعد ذلك"
    gloss: 'تسأل ليلى: ماذا تفعل بعد ذلك؟'
    note: هذا السؤال استمرار طبيعي للحديث عن الروتين اليومي.
  en.a1.unit16.lesson04.teach.a_full_routine:
    title: "وصف اليوم كله"
    gloss: 'يقول دانيال: أرتدي ملابسي وأتناول الفطور وأذهب إلى العمل. أنام عادةً في الحادية عشرة.'
    note: يذكر دانيال عدة أنشطة بالترتيب الصحيح.
