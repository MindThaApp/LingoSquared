teaching:
  en.a1.unit23.lesson01.teach.teacher:
    title: teacher
    gloss: معلّم، معلّمة
    note: '*teacher* تعني معلّمًا أو معلّمة. لا تفرّق الإنجليزية بين المذكر والمؤنث هنا: *teacher* تصلح للاثنين.'
    example_gloss: ليلى معلّمة.
  en.a1.unit23.lesson01.teach.nurse:
    title: nurse
    gloss: ممرّض، ممرّضة
    note: '*nurse* تعني ممرّضًا أو ممرّضة. الكلمة نفسها للرجال والنساء.'
    example_gloss: أنا ممرّض / ممرّضة.
  en.a1.unit23.lesson01.teach.engineer:
    title: engineer
    gloss: مهندس، مهندسة
    note: '*engineer* تعني مهندسًا أو مهندسة. قبل الحرف المتحرك نقول *an*: *an engineer*.'
    example_gloss: دانيال مهندس.
  en.a1.unit23.lesson01.teach.cook:
    title: cook
    gloss: طبّاخ، طبّاخة
    note: '*cook* تعني طبّاخًا أو طبّاخة؛ والكلمة فعل أيضًا (يطبخ).'
    example_gloss: أخي طبّاخ.
  en.a1.unit23.lesson01.teach.driver:
    title: driver
    gloss: سائق، سائقة
    note: '*driver* تعني سائقًا أو سائقة. في *bus driver* تُذكر وسيلة النقل قبلها في الإنجليزية.'
    example_gloss: هو سائق حافلة.
  en.a1.unit23.lesson02.teach.what_do_you_do:
    title: What do you do?
    gloss: ما عملك؟
    note: نسأل بـ *What do you do?* عن المهنة. وهي حرفيًّا «ماذا تفعل؟» لكن المقصود «ما عملك؟».
  en.a1.unit23.lesson02.teach.im_a_nurse:
    title: I'm a nurse.
    gloss: أنا ممرّض / ممرّضة.
    note: 'نذكر مهنتنا بـ *I''m a...* انتبه: في العربية نقول «أنا معلّم» بلا أداة، أما في الإنجليزية فتأتي *a* أو *an* قبل اسم المهنة.'
  en.a1.unit23.lesson02.teach.where_do_you_work:
    title: Where do you work?
    gloss: أين تعمل؟
    note: نسأل بـ *Where do you work?* عن مكان العمل.
  en.a1.unit23.lesson03.teach.patients:
    title: patients
    gloss: المرضى
    note: '*patients* تعني المرضى (جمع). تُنطق *PAY-shents*.'
    example_gloss: أساعد المرضى كل يوم.
  en.a1.unit23.lesson03.teach.profile_text:
    title: "نص عن نبذة مهنية"
    gloss: أنا ممرّض / ممرّضة. أعمل في مستشفى. أساعد المرضى وأكتب التقارير كل يوم.
    note: في هذه النبذة القصيرة يتحدّث شخص عن مهنته وعمله اليومي.
  en.a1.unit23.lesson04.teach.interesting_work:
    title: It's interesting work.
    gloss: إنه عمل ممتع.
    note: '*interesting* تعني ممتعًا أو مثيرًا للاهتمام.'
  en.a1.unit23.lesson04.teach.q_what_do_you_do_daniel:
    title: "سؤال دانيال عن مهنته"
    gloss: 'تسأل ليلى: دانيال، ما عملك؟'
    note: هو السؤال نفسه الذي في الدرس الثاني، لكن مع ذكر الاسم.
  en.a1.unit23.lesson04.teach.a_engineer_small_company:
    title: "جواب دانيال"
    gloss: 'يقول دانيال: أنا مهندس. أعمل في شركة صغيرة في وسط المدينة.'
    note: يذكر دانيال مهنته ومكان عمله.
  en.a1.unit23.lesson04.teach.q_what_every_day:
    title: "السؤال عن المهام اليومية"
    gloss: 'تسأل ليلى: ماذا تفعل كل يوم؟'
    note: يتناول هذا السؤال المهام اليومية.
  en.a1.unit23.lesson04.teach.a_reports_emails_clients:
    title: "جواب دانيال"
    gloss: 'يقول دانيال: أكتب التقارير وأردّ على الرسائل الإلكترونية. وأحيانًا ألتقي بالعملاء.'
    note: يذكر دانيال بعض ما يفعله كل يوم.
  en.a1.unit23.lesson04.teach.q_like_your_job:
    title: "السؤال هل يحبّ دانيال عمله"
    gloss: 'تسأل ليلى: هل تحبّ عملك؟'
    note: نسأل بـ *Do you like your job?* هل يحبّ الشخص عمله.
  en.a1.unit23.lesson04.teach.a_yes_interesting:
    title: "جواب دانيال"
    gloss: 'يقول دانيال: نعم، كثيرًا. إنه عمل ممتع.'
    note: يقول دانيال نعم ويذكر السبب أيضًا.
