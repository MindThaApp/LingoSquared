    - أعاني من صداع.
    - أعاني من التهاب في الحلق.
    - لديّ حمّى.
  en.a2.unit28.lesson02.teach.appointment_request:
    title: طلب موعد
    gloss: أودّ حجز موعد لزيارة الطبيب، من فضلك.
    note: تطلب بأدب موعدًا باستخدام *I'd like to...*.
  en.a2.unit28.lesson02.teach.symptom_duration:
    title: قول منذ متى تعاني من الأعراض
    gloss: أعاني من صداع والتهاب في الحلق منذ ثلاثة أيام، والحالة تزداد سوءًا.
    note: 'لما بدأ في الماضي ومازال مستمرًا تستخدم الإنجليزية *Present Perfect* (*I''ve had ... for three days*). أما في العربية فنستخدم الفعل المضارع مع «منذ»: أعاني منذ ثلاثة أيام من...'
  en.a2.unit28.lesson03.teach.arrive_early:
    title: arrive ten minutes early
    gloss: الوصول قبل الموعد بعشر دقائق
    note: تعني *arrive ten minutes early* أن تصل قبل موعدك بعشر دقائق.
    example_gloss: تفضّل بالوصول قبل موعدك بعشر دقائق.
  en.a2.unit28.lesson03.teach.confirmation_text:
