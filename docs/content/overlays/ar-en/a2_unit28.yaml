    gloss: تم تأكيد موعدك اليوم الساعة 3 مساءً. أحضِر من فضلك بطاقة التأمين الخاصة بك وتفضّل بالوصول قبل الموعد بعشر دقائق. رقم التأكيد هو 7724.
    note: تأكيد رسمي يتضمن الوقت وما يُطلب منك فعله ورقمًا.
  en.a2.unit28.lesson04.teach.i_see:
    title: I see.
    gloss: فهمت.
    note: تقول *I see* لتبيّن أنك فهمت.
  en.a2.unit28.lesson04.teach.q_whats_wrong:
    title: السؤال عمّا يحدث
    gloss: 'يسأل الطبيب: ما الذي تشكو منه؟'
    note: السؤال نفسه الذي طرحته ليلى في الوحدة 22، لكنه هنا من الطبيب.
  en.a2.unit28.lesson04.teach.a_symptoms_duration:
    title: ردّ دانيال بشأن الأعراض
    gloss: 'يقول دانيال: أعاني من صداع والتهاب في الحلق منذ ثلاثة أيام، والحالة تزداد سوءًا.'
    note: الجملة نفسها التي وردت في الدرس الثاني.
  en.a2.unit28.lesson04.teach.a_bad_cold:
    title: تشخيص الطبيب
    gloss: 'يقول الطبيب: فهمت. لديك نزلة برد شديدة.'
    note: تشخيص بسيط ومعتاد، ولا شيء خطير.
  en.a2.unit28.lesson04.teach.q_medicine:
    title: السؤال عن الأدوية
    gloss: 'يسأل دانيال: هل أتناول أي دواء؟'
    note: يسأل دانيال عن العلاج بعد أن سمع التشخيص.
  en.a2.unit28.lesson04.teach.a_medicine_instructions:
    title: إرشادات استخدام الدواء
    gloss: 'يقول الطبيب: نعم، تناول هذا الدواء مرتين في اليوم لمدة خمسة أيام، واشرب كثيرًا من الماء.'
    note: 'تعليمات دقيقة: مرتين في اليوم، لمدة خمسة أيام.'
  en.a2.unit28.lesson04.teach.q_follow_up:
    title: السؤال عن موعد متابعة
    gloss: 'يسأل دانيال: هل أعود إذا لم تتحسن حالتي؟'
    note: يستخدم دانيال الشرط نفسه (*if it doesn't get better*) الذي استخدمته ليلى في الوحدة 22.
  en.a2.unit28.lesson04.teach.a_followup_appointment:
    title: ردّ الطبيب بشأن موعد المتابعة
    gloss: 'يقول الطبيب: نعم، إذا لم تتحسن حالتك خلال أسبوع فعُد لموعد متابعة.'
    note: 'يحدد الطبيب بدقة متى يعود دانيال: إذا لم تتحسن حالته خلال أسبوع.'
