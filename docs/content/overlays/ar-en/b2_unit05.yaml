teaching:
  en.b2.unit05.lesson01.teach.register:
    title: Register
    gloss: مستوى الأسلوب، درجة الرسمية في الكلام
    note: '*register* هو مدى رسمية كلامك أو عدم رسميته. وفي الإنجليزية تأتي النبرة من صياغة الجملة نفسها لا من اختيار صيغة مخاطَب مختلفة، فالضمير *you* واحد مع الجميع.'
    example_gloss: يتغيّر مستوى الأسلوب عندما يتغيّر الجمهور.
  en.b2.unit05.lesson01.teach.casual:
    title: casual
    gloss: غير رسمي، عفوي
    note: '*casual* يناسب صديقًا أو شخصًا تعرفه. هو أكثر مباشرة، لكنه ليس وقحًا بالضرورة.'
    example_gloss: الرسالة غير الرسمية تناسب صديقًا.
  en.b2.unit05.lesson01.teach.professional:
    title: professional
    gloss: مهني، مهذب في سياق العمل
    note: '*professional* يناسب زميلًا في العمل: مهذب وواضح، لكن دون مبالغة في الرسمية.'
    example_gloss: الرسالة المهنية تناسب زميلًا في العمل.
  en.b2.unit05.lesson01.teach.formal:
    title: formal
    gloss: رسمي
    note: '*formal* يناسب المؤسسات. وفي الإنجليزية يتحقق ذلك غالبًا بطلبات أطول وأقل مباشرة.'
    example_gloss: الرسالة الرسمية تناسب مؤسسة.
  en.b2.unit05.lesson01.teach.audience:
    title: audience
    gloss: الجمهور المستهدف، المتلقّون
    note: '*audience* هو الشخص أو الجماعة التي تكتب لها أو تتحدث إليها.'
    example_gloss: جمهورك يؤثر في اختيارك للكلمات.
  en.b2.unit05.lesson01.teach.institution:
    title: institution
    gloss: مؤسسة، هيئة
    note: '*institution* هي منظمة مثل عيادة أو بنك أو جامعة.'
    example_gloss: العيادة مؤسسة.
  en.b2.unit05.lesson02.teach.formal_request:
    title: طلب رسمي
    gloss: سأكون ممتنًا لو تفضّلتم بتأكيد ما إذا كان يمكن نقل موعدي إلى يوم الجمعة.
    note: '*I would be grateful if you could...* صيغة رسمية. لا تحتاج الإنجليزية إلى كلمة أخرى بدل *you*؛ فالتأدب موجود في بنية الجملة كلها.'
  en.b2.unit05.lesson02.teach.casual_request:
    title: طلب غير رسمي
    gloss: هل يمكنك نقله إلى يوم الجمعة؟
    note: '*Can you...?* مناسبة لصديق، لكنها تبدو مباشرة جدًا حين تُوجَّه إلى مؤسسة.'
  en.b2.unit05.lesson02.teach.professional_request:
    title: طلب مهني
    gloss: هل يمكننا نقل الموعد إلى يوم الجمعة إن كان ذلك ما زال مناسبًا لك؟
    note: '*Could we...?* تبدو تعاونية ومهذبة مع زميل في العمل.'
  en.b2.unit05.lesson02.teach.to_whom:
    title: Dear scheduling team,
    gloss: الزملاء الكرام في فريق الجدولة،
    note: '*Dear...* افتتاحية رسمية عادية في الإنجليزية، وهي أخف وأقل تكلفًا من كثير من افتتاحيات الرسائل الرسمية العربية الطويلة.'
  en.b2.unit05.lesson02.teach.grammar_register_shift:
    title: تغيير مستوى الأسلوب
    gloss: أبقِ المضمون نفسه عندما تغيّر مستوى الأسلوب. يمكن للإنجليزية غير الرسمية أن تستخدم أسئلة مباشرة. وتستخدم الإنجليزية المهنية غالبًا *could*. وتستخدم الإنجليزية الرسمية غالبًا *I would be grateful if you could*.
    note: 'لا تفكّر في تغيير الضمير وحده: في الإنجليزية تتغيّر الجملة كلها.'
  en.b2.unit05.lesson03.teach.stiff:
    title: stiff
    gloss: متكلَّف، مفرط في الرسمية
    note: '*stiff* تعني أن الرسالة تبدو رسمية أكثر مما يلزم للموقف.'
    example_gloss: الرسالة المتكلَّفة تبدو مفرطة في الرسمية بالنسبة إلى الموقف.
  en.b2.unit05.lesson03.teach.appropriate:
    title: appropriate
    gloss: مناسب، ملائم
    note: '*appropriate* تعني أن الصياغة تناسب الجمهور والموقف.'
    example_gloss: الرسالة المناسبة تلائم الجمهور.
  en.b2.unit05.lesson03.teach.reading_passage:
    title: 'نص القراءة: الرسالة نفسها لثلاث فئات من المخاطَبين'
    gloss: 'تحتاج نينا إلى نقل موعد إلى يوم الجمعة. تكتب لصديق: Can you move it to Friday? الرسالة مباشرة وغير رسمية. وتكتب لزميل: Could we move the appointment to Friday if that still works for you? الرسالة مهنية ومهذبة. وتكتب للعيادة: I would be grateful if you could confirm whether my appointment can be moved to Friday. المضمون واحد في النصوص الثلاثة، لكن مستوى الأسلوب يتغيّر بحسب الجمهور.'
    note: في الإنجليزية يتغيّر مستوى الأسلوب عبر الصياغة، لا عبر ضمير مخاطَب مختلف.
  en.b2.unit05.lesson04.teach.q_need_ask:
    title: نينا تسأل عن الصياغة
    gloss: 'تقول نينا: أحتاج إلى السؤال عن نقل موعدي. هل يمكنني أن أكتب ببساطة: ''Can you move it?'''
    note: '*just write* تُظهر أنها غير متأكدة هل الصيغة المباشرة مناسبة.'
  en.b2.unit05.lesson04.teach.a_too_casual:
    title: أوسكار ينبّه إلى مستوى الأسلوب
    gloss: 'يقول أوسكار: لصديق نعم. أما للعيادة فهذا يبدو غير رسمي أكثر من اللازم.'
    note: هنا أيضًا تستخدم الإنجليزية *you* ببساطة، لكن الجملة نفسها مباشرة جدًا بالنسبة إلى العيادة.
  en.b2.unit05.lesson04.teach.q_colleague:
    title: نينا تسأل عن أسلوب الزميل
    gloss: 'تسأل نينا: ماذا ستكتب لزميل؟'
    note: الزميل يقتضي أسلوبًا مهنيًا، لا أقصى درجات الرسمية.
  en.b2.unit05.lesson04.teach.a_colleague_request:
    title: أوسكار يقدّم صيغة الزميل
    gloss: 'يقول أوسكار: كنت سأكتب: ''Could we move the appointment to Friday if that still works for you?'''
    note: '*Could we* و*if that still works for you* تجعلان الطلب ألطف.'
  en.b2.unit05.lesson04.teach.q_clinic:
    title: نينا تسأل عن العيادة
    gloss: 'تسأل نينا: وللعيادة؟'
    note: المؤسسة تقتضي بنية طلب أكثر رسمية.
  en.b2.unit05.lesson04.teach.a_clinic_request:
    title: أوسكار يقدّم الصيغة الرسمية
    gloss: 'يقول أوسكار: كنت سأكتب: ''I would be grateful if you could confirm whether my appointment can be moved to Friday.'''
    note: هذه الصيغة لا تطلب تنفيذ إجراء بفظاظة، بل تطلب تأكيدًا.
  en.b2.unit05.lesson04.teach.q_same_message:
    title: نينا تلخّص
    gloss: 'تقول نينا: الرسالة نفسها، ومستوى أسلوب مختلف.'
    note: 'المضمون ثابت: نقل الموعد إلى يوم الجمعة.'
  en.b2.unit05.lesson04.teach.a_content_stays:
    title: أوسكار يؤكد
    gloss: 'يقول أوسكار: بالضبط. المضمون يبقى كما هو، لكن درجة الرسمية تتغيّر.'
    note: هذا هو جوهر التحكم في مستوى الأسلوب عند المستوى B2.
