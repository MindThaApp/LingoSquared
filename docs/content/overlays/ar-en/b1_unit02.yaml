teaching:
  en.b1.unit02.lesson01.teach.be_able_to:
    title: be able to
    gloss: يستطيع / يتمكّن من
    note: '*be able to* تعني أن لديك القدرة أو الفرصة لفعل شيء.'
    example_gloss: أستطيع تجديد رخصة القيادة عبر الإنترنت.
  en.b1.unit02.lesson01.teach.manage_to:
    title: manage to
    gloss: ينجح في فعل شيء
    note: '*manage to* تعني أن الأمر نجح، وغالبًا بعد شيء من الجهد.'
    example_gloss: نجحت في تعبئة النموذج خلال عشر دقائق.
  en.b1.unit02.lesson01.teach.renew:
    title: renew
    gloss: يجدّد
    note: '*renew* تعني تمديد صلاحية وثيقة قبل أن تنتهي.'
    example_gloss: يجب أن أجدّد رخصة القيادة.
  en.b1.unit02.lesson01.teach.license:
    title: license
    gloss: رخصة القيادة
    note: '*license* هنا وثيقة رسمية تتيح لك القيادة (اختصار *driver''s license*). وتُكتب في الإنجليزية البريطانية *licence* حين تكون اسمًا.'
    example_gloss: تنتهي صلاحية رخصة قيادتي هذا الشهر.
  en.b1.unit02.lesson01.teach.online:
    title: online
    gloss: عبر الإنترنت
    note: '*online* تعني عبر الإنترنت، لا في مكان فعلي.'
    example_gloss: يمكنك الآن تجديدها عبر الإنترنت.
  en.b1.unit02.lesson01.teach.in_person:
    title: in person
    gloss: شخصيًّا / بالحضور
    note: '*in person* تعني أن تذهب بنفسك إلى مكان ما، لا عبر الإنترنت.'
    example_gloss: في العام الماضي اضطررت إلى الذهاب شخصيًّا.
  en.b1.unit02.lesson02.teach.am_able_to_renew_online:
    title: eine gegenwärtige Möglichkeit ausdrücken
    gloss: أستطيع الآن تجديد رخصة قيادتي عبر الإنترنت.
    note: '*I am able to* تعبّر عن إمكانية في الحاضر.'
  en.b1.unit02.lesson02.teach.was_not_able_to_last_year:
    title: eine vergangene Möglichkeit verneinen
    gloss: في العام الماضي لم أتمكّن من فعل ذلك عبر الإنترنت.
    note: '*was not able to* تعبّر عن أن الإمكانية لم تكن موجودة في الماضي.'
  en.b1.unit02.lesson02.teach.managed_to_finish:
    title: sagen, dass etwas gelungen ist
    gloss: نجحت في تعبئة النموذج خلال عشر دقائق.
    note: '*managed to* تؤكد أن الأمر نجح، وغالبًا رغم الجهد.'
  en.b1.unit02.lesson02.teach.grammar_present_past:
    title: Gegenwart und Vergangenheit mit 'be able to'
    gloss: أستطيع تجديدها. استطعت تجديدها. يمكنني أن أساعدك.
    note: '*am able to* (الآن) و*was able to* (الماضي) و*would be able to* (احتمال أو عرض) هي صيغ للتركيب نفسه.'
  en.b1.unit02.lesson03.teach.friend:
    title: friend
    gloss: صديق / صديقة
    note: '*friend* تعني صديقًا أو صديقة.'
    example_gloss: جدّدت صديقتي رخصة قيادتها الأسبوع الماضي.
  en.b1.unit02.lesson03.teach.system:
    title: system
    gloss: نظام
    note: '*system* هو طريقة منظّمة لفعل شيء.'
    example_gloss: النظام الجديد أسرع بكثير.
  en.b1.unit02.lesson03.teach.reading_passage:
    title: 'Lesetext: das neue System'
    gloss: في العام الماضي لم يتمكّن الناس من تجديد رخص القيادة عبر الإنترنت. اضطرّ الجميع إلى الذهاب إلى المكتب شخصيًّا. هذا العام تغيّر النظام. الآن يستطيع الناس تجديد كل شيء من البيت. استطاعت صديقتي ميا إنجاز تجديدها في عشر دقائق.
    note: نص قصير عن كيف جعل النظام الجديد التجديد أسهل.
  en.b1.unit02.lesson04.teach.q_were_you_able:
    title: Leila fragt nach dem Führerschein
    gloss: 'ليلى تقول: هل تمكّنت من تجديد رخصة قيادتك عبر الإنترنت؟'
    note: '*were you able to* تسأل عن إمكانية كانت في الماضي.'
  en.b1.unit02.lesson04.teach.a_wasnt_able_office:
    title: 'Daniels Antwort: online ging es nicht'
    gloss: 'دانيال يقول: لا، لم أتمكّن. اضطررت إلى الذهاب إلى المكتب شخصيًّا.'
    note: '*wasn''t able to* هي الصيغة المختصرة المنطوقة من *was not able to*.'
  en.b1.unit02.lesson04.teach.q_really_managed:
    title: Leila erzählt von ihrer Erfahrung
    gloss: 'ليلى تقول: حقًّا؟ لقد نجحت في إنجازها عبر الإنترنت خلال عشر دقائق.'
    note: '*managed to* تؤكد أن الأمر نجح مع ليلى بسرعة وبسهولة.'
  en.b1.unit02.lesson04.teach.a_next_time_save:
    title: Daniel denkt an nächstes Mal
    gloss: 'دانيال يقول: في المرة القادمة سأتمكّن من توفير الوقت إن أنجزتها عبر الإنترنت أنا أيضًا.'
    note: '*would be able to* تعبّر هنا عن إمكانية افتراضية في المستقبل.'
  en.b1.unit02.lesson04.teach.q_would_help:
    title: Leila bietet Hilfe an
    gloss: 'ليلى تقول: يمكنني أن أساعدك في المرة القادمة إن أردت.'
    note: '*would be able to* تُستعمل هنا لعرض مهذّب.'
  en.b1.unit02.lesson04.teach.a_thanks:
    title: Daniel bedankt sich
    gloss: 'دانيال يقول: شكرًا، يسعدني ذلك.'
    note: '*I''d like that* طريقة طبيعية لقبول عرض بامتنان.'
