teaching:
  en.b1.unit15.lesson01.teach.complain:
    title: complain
    gloss: يشتكي
    note: '*complain* تعني أن تقول رسميًا إن أمرًا ما غير صحيح أو غير مرضٍ.'
    example_gloss: قرّرت ميا أن تشتكي من الكرسي التالف.
  en.b1.unit15.lesson01.teach.damaged:
    title: damaged
    gloss: تالف
    note: '*damaged* تصف منتجًا مكسورًا أو متضررًا.'
    example_gloss: وصل الكرسي تالفًا.
  en.b1.unit15.lesson01.teach.refund:
    title: refund
    gloss: استرداد المبلغ
    note: '*refund* تعني مالًا يُعاد دفعه مقابل منتج أُعيد أو معيب.'
    example_gloss: طلبت ميا استرداد المبلغ.
  en.b1.unit15.lesson01.teach.replacement:
    title: replacement
    gloss: بديل، منتج بديل
    note: '*replacement* تعني قطعة جديدة بدل القطعة المعيبة.'
    example_gloss: عرضت الشركة بدلًا من ذلك منتجًا بديلًا.
  en.b1.unit15.lesson01.teach.resolve:
    title: resolve
    gloss: يحلّ، يعالج
    note: '*resolve* تعني حلّ مشكلة حلًّا كاملًا.'
    example_gloss: وعد الموظف بحلّ المشكلة سريعًا.
  en.b1.unit15.lesson01.teach.issue:
    title: issue
    gloss: مشكلة، قضية
    note: '*issue* تعني مشكلة تحتاج إلى معالجة.'
    example_gloss: شرحت ميا المشكلة بوضوح.
  en.b1.unit15.lesson02.teach.writing_to_complain:
    title: I'm writing to complain about + اسم
    gloss: أكتب إليكم لأشتكي من منتج تالف.
    note: '*I''m writing to complain about* تفتتح شكوى مكتوبة مهذّبة.'
  en.b1.unit15.lesson02.teach.would_like_refund:
    title: I would like + اسم
    gloss: أودّ استرداد المبلغ عن هذه القطعة.
    note: '*I would like a refund for* تطلب بأدب إعادة المال.'
  en.b1.unit15.lesson02.teach.grammar_complaint_structure:
    title: بنية الشكوى المهذّبة
    gloss: 'تتكوّن الشكوى المكتوبة المهذّبة عادةً من ثلاثة أجزاء: تسمية المشكلة (I''m writing to complain about...)، وذكر ما حدث فعلًا (it arrived damaged / it stopped working)، وطلب حلّ محدد (I would like a refund / I would like a replacement).'
    note: 'الصيغة: سمِّ المشكلة، واذكر ما حدث، واطلب حلًّا محددًا.'
  en.b1.unit15.lesson03.teach.desk_chair:
    title: desk chair
    gloss: كرسي مكتب
    note: '*desk chair* تعني كرسيًا يجلس عليه المرء عند المكتب.'
    example_gloss: طلبت ميا كرسي مكتب جديدًا لمكتبها في المنزل.
  en.b1.unit15.lesson03.teach.as_soon_as_possible:
    title: as soon as possible
    gloss: في أقرب وقت ممكن
    note: '*as soon as possible* تعني دون تأخير غير ضروري.'
    example_gloss: طلبت ميا الحصول على بديل في أقرب وقت ممكن.
  en.b1.unit15.lesson03.teach.reading_passage:
    title: 'نص للقراءة: شكوى بشأن كرسي مكتب'
    gloss: السادة فريق GreenDesk المحترمين، أكتب إليكم لأشتكي من منتج تالف. طلبتُ الأسبوع الماضي كرسي مكتب لمكتبي في المنزل، لكنه وصل وفيه عجلة مكسورة. أودّ الحصول على بديل في أقرب وقت ممكن. يُرجى إخباري بكيفية المتابعة. شكرًا جزيلًا، ميا
    note: رسالة شكوى قصيرة ومهذّبة.
  en.b1.unit15.lesson04.teach.q_calling_to_complain:
    title: ميا تتصل لتشتكي من كرسي المكتب
    gloss: 'تقول ميا: مرحبًا، أتصل لأشتكي من كرسي مكتب طلبته.'
    note: '*I''m calling to complain about* تفتتح شكوى هاتفية مهذّبة.'
  en.b1.unit15.lesson04.teach.a_whats_the_issue:
    title: الموظف يسأل عن المشكلة
    gloss: 'يقول الموظف: يؤسفني سماع ذلك. ما المشكلة فيه؟'
    note: '*I''m sorry to hear that* ردّ مهذّب ومتعاطف.'
  en.b1.unit15.lesson04.teach.q_broken_wheel_cant_use:
    title: ميا تصف المشكلة
    gloss: 'تقول ميا: وصل وفيه عجلة مكسورة، لذلك لا أستطيع استخدامه.'
    note: '*it arrived with a broken wheel* تشرح ما حدث فعلًا.'
  en.b1.unit15.lesson04.teach.a_refund_or_replacement:
    title: الموظف يقترح حلًّا
    gloss: 'يقول الموظف: أفهم ذلك. هل تفضّلين استرداد المبلغ أم الحصول على بديل؟'
    note: '*would you like... or...* تمنح العميل خيارًا.'
  en.b1.unit15.lesson04.teach.q_prefer_replacement:
    title: ميا تختار بديلًا
    gloss: 'تقول ميا: أفضّل الحصول على بديل، إن كان ذلك ممكنًا.'
    note: '*I would prefer a replacement, if that''s possible* تذكر تفضيلًا بأدب.'
  en.b1.unit15.lesson04.teach.a_resolve_send_friday:
    title: الموظف يؤكد الحل
    gloss: 'يقول الموظف: بالتأكيد. سنحلّ هذا الأمر ونرسل لك كرسيًا جديدًا قبل يوم الجمعة.'
    note: '*we''ll resolve this and send... by Friday* وعد محدد بموعد.'
