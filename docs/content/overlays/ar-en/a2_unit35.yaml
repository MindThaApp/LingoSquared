teaching:
  en.a2.unit35.lesson01.teach.pharmacy:
    title: pharmacy
    gloss: صيدلية
    note: '*pharmacy* هي المتجر الذي تحصل منه على أدويتك.'
    example_gloss: توجد صيدلية بجانب عيادة الطبيب.
  en.a2.unit35.lesson01.teach.pharmacist:
    title: pharmacist
    gloss: صيدلاني / صيدلانية
    note: '*pharmacist* هو الشخص الذي يسلّمك الدواء.'
    example_gloss: شرح لي الصيدلاني كيف أتناول الدواء.
  en.a2.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: قرص
    note: '*tablet* قطعة صلبة واحدة من الدواء تُبتلع.'
    example_gloss: أتناول قرصًا في الصباح وآخر في المساء.
  en.a2.unit35.lesson01.teach.dose:
    title: dose
    gloss: جرعة
    note: '*dose* هي كمية الدواء التي تتناولها في المرة الواحدة.'
    example_gloss: الجرعة قرص واحد، مرتين في اليوم.
  en.a2.unit35.lesson01.teach.refill:
    title: refill
    gloss: إعادة صرف الدواء
    note: '*refill* علبة جديدة من الدواء نفسه دون الحاجة إلى مراجعة الطبيب من جديد.'
    example_gloss: أحتاج إلى إعادة صرف الدواء لأن أقراصي قاربت على النفاد.
  en.a2.unit35.lesson01.teach.side_effects:
    title: side effects
    gloss: الآثار الجانبية
    note: '*side effects* هي التأثيرات الإضافية التي قد يُحدثها الدواء في الجسم.'
    example_gloss: شرح لي الصيدلاني الآثار الجانبية لهذا الدواء.
  en.a2.unit35.lesson01.teach.grammar_frequency:
    title: Sagen, wie oft man etwas einnimmt
    gloss: مرة في اليوم، مرتين في اليوم، ثلاث مرات في اليوم، كل ثماني ساعات
    note: '*once a day* = مرة في اليوم، *twice a day* = مرتين في اليوم، *three times a day* = ثلاث مرات في اليوم، *every eight hours* = كل ثماني ساعات.'
  en.a2.unit35.lesson02.teach.pick_up_prescription:
    title: Sagen, weshalb man am Tresen steht
    gloss: أودّ استلام وصفة طبية.
    note: '*I''d like to...* هي الصيغة المهذبة المعتادة للتعبير عمّا تريده.'
  en.a2.unit35.lesson02.teach.take_one_tablet:
    title: Die Dosierung, die man zu hören bekommt
    gloss: تناول قرصًا واحدًا مرتين في اليوم مع الطعام.
    note: '*with food* تعني مع الطعام، أي ليس على معدة فارغة.'
  en.a2.unit35.lesson02.teach.ask_how_many_days:
    title: Fragen, wie lange man es einnehmen muss
    gloss: لكم يومًا ينبغي أن أتناوله؟
    note: نستخدم *How many...?* مع الأشياء المعدودة مثل الأيام.
  en.a2.unit35.lesson02.teach.ask_side_effects:
    title: Nach Nebenwirkungen fragen
    gloss: هل هناك آثار جانبية؟
    note: '*Are there any...?* هي الطريقة المعتادة للسؤال عن وجود شيء.'
  en.a2.unit35.lesson02.teach.grammar_should:
    title: should und shouldn't für Anweisungen
    gloss: ينبغي أن تتناوله مع الطعام. ولا ينبغي أن تتوقف مبكرًا.
    note: تعطي *should* نصيحة أو توجيهًا؛ وتشكل *shouldn't* صيغة النفي.
  en.a2.unit35.lesson03.teach.before_bed:
    title: before bed
    gloss: قبل النوم
    note: تعني *before bed* قبل الذهاب إلى النوم.
    example_gloss: بعض الأدوية تعمل بشكل أفضل إذا تناولتها قبل النوم.
  en.a2.unit35.lesson03.teach.label_text:
    title: Das Apothekenetikett
    gloss: 'دواء للبرد. تناول قرصًا واحدًا مرتين في اليوم مع الطعام، لمدة خمسة أيام. لا تتوقف عن تناول الأقراص مبكرًا. الآثار الجانبية المحتملة: قد تشعر بالتعب. إعادة الصرف: مرة واحدة.'
    note: 'ملصق الصيدلية مختصر: جمل قصيرة وبلا عبارات مجاملة.'
  en.a2.unit35.lesson03.teach.do_not_stop_early:
    title: Der Warnhinweis auf dem Etikett
    gloss: لا تتوقف عن تناول الأقراص مبكرًا.
    note: '*Do not...* صيغة النهي بالأمر التي نراها على الملصقات واللافتات.'
  en.a2.unit35.lesson04.teach.q_pick_up:
    title: Daniel meldet sich am Tresen
    gloss: 'يقول دانيال: مرحبًا، أودّ استلام وصفة طبية.'
    note: '*Hi* أخف من *Hello*، لكنها مألوفة تمامًا عند المكتب.'
  en.a2.unit35.lesson04.teach.a_what_is_your_name:
    title: Der Apotheker fragt nach dem Namen
    gloss: 'يقول الصيدلاني: بكل سرور. ما اسمك؟'
    note: 'تعني *Of course* هنا: بكل سرور، لا مشكلة.'
  en.a2.unit35.lesson04.teach.q_doctor_gave_me_medicine:
    title: Daniel nennt den Grund für das Medikament
    gloss: 'يقول دانيال: دانيال. وصف لي الطبيب دواءً لنزلة برد شديدة.'
    note: 'يرتبط هذا بزيارة الطبيب في الوحدة 28: هي نزلة البرد نفسها.'
  en.a2.unit35.lesson04.teach.a_here_it_is:
    title: Der Apotheker nennt die Dosierung
    gloss: 'يقول الصيدلاني: تفضّل. تناول قرصًا واحدًا مرتين في اليوم مع الطعام.'
    note: نقول *Here it is* عندما نسلّم شيئًا لشخص ما.
  en.a2.unit35.lesson04.teach.q_how_many_days:
    title: Daniel fragt, wie lange
    gloss: 'يسأل دانيال: لكم يومًا ينبغي أن أتناوله؟'
    note: هو السؤال نفسه الذي في الدرس الثاني.
  en.a2.unit35.lesson04.teach.a_five_days_no_stopping:
    title: Die Antwort des Apothekers
    gloss: 'يقول الصيدلاني: لمدة خمسة أيام. لا تتوقف عن تناول الأقراص مبكرًا.'
    note: هو التوجيه نفسه الذي على الملصق في الدرس الثالث.
  en.a2.unit35.lesson04.teach.q_any_side_effects:
    title: Daniel fragt nach Nebenwirkungen
    gloss: 'يسأل دانيال: هل هناك آثار جانبية؟'
    note: هو السؤال نفسه الذي في الدرس الثاني.
  en.a2.unit35.lesson04.teach.a_you_may_feel_tired:
    title: Der Apotheker nennt die Nebenwirkung
    gloss: 'يقول الصيدلاني: قد تشعر بالتعب، ولا شيء غير ذلك.'
    note: 'تعني *but that''s all* هنا: لكن هذا كل شيء.'
  en.a2.unit35.lesson04.teach.q_thank_you:
    title: Daniel bedankt sich beim Apotheker
    gloss: 'يقول دانيال: شكرًا جزيلًا.'
    note: تجعل *very much* الشكر أكثر تأكيدًا.
