  en.b1.unit10.lesson02.teach.grammar_purpose:
    title: '''in order to'' و''so that'''
    gloss: أدرس لكي أحسّن لغتي الإنجليزية. أدرس كي أتذكّر المزيد.
    note: تأتي *in order to* قبل فعل، وتشبه في العربية «لـ» أو «من أجل أن». أما *so that* فتأتي قبل جملة كاملة (فاعل + فعل)، وتشبه «كي» أو «حتى».
