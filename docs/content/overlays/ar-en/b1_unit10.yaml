  en.b1.unit10.lesson03.teach.reading_passage:
    title: 'نص للقراءة: أهداف واضحة'
    gloss: لدى دانيال وليلى هدفان واضحان. يحضر دانيال دورة مسائية لكي يحسّن لغته الإنجليزية من أجل العمل. ويتدرب على كتابة تحديثات قصيرة كي يبدو أكثر احترافية. وتدّخر ليلى المال كي تلتحق بدورة في التصميم السنة القادمة. وتقرأ أوصاف الدورات لكي تختار البرنامج المناسب.
    note: نص قصير للقراءة عن الأهداف باستخدام *in order to* و *so that*.
