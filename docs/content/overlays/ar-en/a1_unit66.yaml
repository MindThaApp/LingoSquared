teaching:
  en.a1.unit66.lesson01.teach.symptom:
    title: symptom
    gloss: عَرَض
    note: '*symptom* تعني عَرَضًا مرضيًّا تشعر به. تُنطق *SIMP-tum*.'
    example_gloss: هذا عَرَض.
  en.a1.unit66.lesson01.teach.cough:
    title: cough
    gloss: سعال
    note: '*cough* تعني سعالًا. تُنطق *kof*؛ والحرفان *gh* يُنطقان هنا مثل *f*.'
    example_gloss: عندي سعال.
  en.a1.unit66.lesson01.teach.fever:
    title: fever
    gloss: حمّى
    note: '*fever* تعني حمّى. تُنطق *FEE-ver*.'
    example_gloss: هل عندك حمّى؟
  en.a1.unit66.lesson01.teach.throat:
    title: throat
    gloss: الحلق
    note: '*throat* تعني الحلق (البلعوم والحنجرة)؛ أما العنق الخارجي فنقول له *neck*.'
    example_gloss: حلقي يؤلمني.
  en.a1.unit66.lesson01.teach.headache:
    title: headache
    gloss: صداع
    note: '*headache* تعني صداعًا (بصيغة المفرد في الإنجليزية).'
    example_gloss: عندي صداع.
  en.a1.unit66.lesson01.teach.medicine:
    title: medicine
    gloss: دواء
    note: '*medicine* تعني دواءً. الكلمة غير معدودة: *some medicine*.'
    example_gloss: تناول هذا الدواء.
  en.a1.unit66.lesson02.teach.have_cough:
    title: I have a cough.
    gloss: عندي سعال.
    note: نقول في الإنجليزية *have a cough* مع *a*؛ بينما في العربية نقول «عندي سعال» بلا أداة.
  en.a1.unit66.lesson02.teach.throat_hurts:
    title: My throat hurts.
    gloss: حلقي يؤلمني.
    note: '*hurts* تعني «يؤلم». في الإنجليزية العضو هو الفاعل (*my throat hurts*) ويأخذ الفعل حرف s.'
  en.a1.unit66.lesson02.teach.have_headache:
    title: I have a headache.
    gloss: عندي صداع.
    note: نقول في الإنجليزية *have a headache* مع *a*؛ بينما في العربية نقول «عندي صداع» بلا أداة.
  en.a1.unit66.lesson02.teach.have_medicine:
    title: Do you have medicine?
    gloss: هل عندكم دواء؟
    note: '*Do you have...?* تسأل هل الشيء موجود.'
  en.a1.unit66.lesson02.teach.with_water:
    title: Take this with water.
    gloss: تناول هذا مع الماء.
    note: تأتي *with water* في آخر الجملة.
  en.a1.unit66.lesson02.teach.ask_doctor:
    title: Please ask a doctor.
    gloss: من فضلك اسأل طبيبًا.
    note: '*Please* تجعل الجملة مهذّبة.'
  en.a1.unit66.lesson03.teach.dialogue_line1:
    title: "ليلى تذكر شكواها"
    gloss: 'تقول ليلى: مرحبًا. عندي سعال.'
    note: '*I have a cough* تذكر شكوى.'
  en.a1.unit66.lesson03.teach.dialogue_line2:
    title: "الصيدلي يسأل عن الحمّى"
    gloss: 'يقول الصيدلي: هل عندك حمّى؟'
    note: '*Do you have a fever?* سؤال إجابته نعم أو لا.'
  en.a1.unit66.lesson03.teach.dialogue_line3:
    title: "ليلى ليست مصابة بحمّى"
    gloss: 'تقول ليلى: لا، ليست عندي حمّى. حلقي يؤلمني.'
    note: '*No, I do not have...* تنفي وجود عَرَض. في الإنجليزية ننفي بـ *do not* قبل الفعل *have*، لا بـ «ليس» أو «لا» قبل الاسم.'
  en.a1.unit66.lesson03.teach.dialogue_line4:
    title: "الصيدلي يسأل عن الصداع"
    gloss: 'يقول الصيدلي: هل عندك صداع؟'
    note: '*headache* تعني صداعًا.'
  en.a1.unit66.lesson03.teach.dialogue_line5:
    title: "عند ليلى صداع"
    gloss: 'تقول ليلى: نعم، عندي صداع.'
    note: '*Yes* تعني نعم.'
  en.a1.unit66.lesson03.teach.dialogue_line6:
    title: "نصيحة الصيدلي"
    gloss: 'يقول الصيدلي: تناولي هذا الدواء مع الماء. ومن فضلك اسألي طبيبًا إذا ساءت حالتك.'
    note: '*if you feel worse* تعني «إذا ساءت حالتك».'
  en.a1.unit66.lesson03.teach.dialogue_line7:
    title: "ليلى تشكر"
    gloss: 'تقول ليلى: شكرًا.'
    note: '*Thank you* عبارة الشكر القصيرة.'
  en.a1.unit66.lesson04.teach.pharmacy_note:
    title: "ورقة الصيدلية"
    gloss: 'ورقة الصيدلية: سعال والتهاب في الحلق. لا حمّى. تناول الدواء مع الماء. اسأل طبيبًا إذا ساءت الحال.'
    note: تذكر الورقة الأعراض ونصائح بسيطة.
  en.a1.unit66.lesson04.teach.reading_passage:
    title: "نص: زيارة إلى الصيدلية"
    gloss: 'زيارة إلى الصيدلية: ذهبت ليلى إلى الصيدلية لأن عندها سعالًا وحلقها يؤلمها. سأل الصيدلي هل عندها حمّى. قالت ليلى إنها ليست مصابة بحمّى لكن عندها صداعًا. أعطاها الصيدلي دواءً وقال لها أن تتناوله مع الماء. وجاء في الورقة أن تسأل طبيبًا إذا ساءت حالتها.'
    note: '*felt worse* هي صيغة الماضي من *feel worse*.'
