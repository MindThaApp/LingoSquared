  en.a1.unit43.lesson02.teach.dark_blue:
    title: dark blue
    gloss: أزرق غامق
    note: 'تتكوّن *dark blue* من كلمتين منفصلتين: *dark* (غامق) ثم *blue* (أزرق)، وتأتي الصفة قبل اللون، بعكس العربية التي نقول فيها «أزرق غامق».'
    example_gloss: يرتدي قميصًا أزرق غامقًا.
  en.a1.unit43.lesson02.teach.light_green:
    title: light green
    gloss: أخضر فاتح
    note: 'تتكوّن *light green* أيضًا من كلمتين منفصلتين: *light* (فاتح) ثم *green* (أخضر)، وتسبق الصفة اللون، بعكس العربية التي نقول فيها «أخضر فاتح».'
    example_gloss: طلت غرفة نومها باللون الأخضر الفاتح.
  en.a1.unit43.lesson02.teach.goes_well_with:
    title: goes well with
    gloss: ينسجم جيدًا مع
    note: تعني *goes well with* أن لونين أو قطعتي ملابس منسجمتان معًا.
    example_gloss: هذا القميص الأزرق ينسجم جيدًا مع البنطلون الأسود.
  en.a1.unit43.lesson02.teach.too_bright:
    title: too bright
    gloss: زاهٍ جدًا
    note: تعني *too bright* أن اللون زاهٍ أو لافت أكثر من اللازم.
    example_gloss: الأصفر لون ممتع، لكنه زاهٍ جدًا للعمل.
  en.a1.unit43.lesson02.teach.whats_your_favorite_color:
    title: What's your favorite color?
    gloss: ما لونك المفضل؟
    note: يسأل *What's your favorite ...?* عن تفضيل شخص ما.
  en.a1.unit43.lesson02.teach.my_favorite_color_is:
    title: My favorite color is blue.
    gloss: لوني المفضل هو الأزرق.
    note: '*My favorite ... is ...* هي الطريقة الثابتة للتعبير عن التفضيل.'
  en.a1.unit43.lesson03.teach.dialogue_line1:
    title: سؤال دانيال
    gloss: 'يسأل دانيال: أحتاج إلى قميص جديد لعرضنا التقديمي الأسبوع القادم. هل يمكنك مساعدتي في اختيار لون؟'
    note: يطلب *Can you help me* + فعل*?* المساعدة.
  en.a1.unit43.lesson03.teach.dialogue_line2:
    title: سؤال ميا
    gloss: 'تقول ميا: بالتأكيد! ما الألوان التي تحبها؟'
    note: يسأل *What colors do you like?* عن الألوان التي يفضلها الشخص.
  en.a1.unit43.lesson03.teach.dialogue_line3:
    title: "إجابة دانيال"
    gloss: 'يقول دانيال: أحب الأزرق والأخضر، لكنني لست متأكدًا ما الذي يبدو رسميًا.'
    note: تعني *I'm not sure what looks professional* لست متأكدًا ما الذي يبدو رسميًا.
  en.a1.unit43.lesson03.teach.dialogue_line4:
    title: نصيحة ميا
    gloss: 'تقول ميا: الأزرق الغامق خيار رائع. يبدو رسميًا، وينسجم جيدًا مع البنطلون الأسود.'
    note: تعني *It looks professional* يبدو رسميًا.
  en.a1.unit43.lesson03.teach.dialogue_line5:
    title: سؤال دانيال
    gloss: 'يسأل دانيال: وماذا عن هذا القميص الأصفر؟'
    note: يقترح *What about ...?* بديلًا.
  en.a1.unit43.lesson03.teach.dialogue_line6:
    title: نصيحة ميا
    gloss: 'تقول ميا: الأصفر لون ممتع، لكنه زاهٍ جدًا لعرض تقديمي. كنت سأختار القميص الأزرق الغامق.'
    note: تعني *I'd choose* كنت سأختار.
  en.a1.unit43.lesson03.teach.dialogue_line7:
    title: قرار دانيال
    gloss: 'يقول دانيال: شكرًا يا ميا. إذن الأزرق الغامق!'
    note: '*Dark blue it is!* طريقة غير رسمية لتأكيد القرار.'
  en.a1.unit43.lesson04.teach.reading_passage:
    title: نص عن ثلاثة ألوان مفضلة
    gloss: لدى دانيال وليلى وميا ألوان مفضلة مختلفة. لون دانيال المفضل هو الأزرق. يقول إنه لون هادئ، وينسجم مع كل ما يرتديه للعمل تقريبًا. ولون ليلى المفضل هو الأخضر، لون النباتات والحدائق التي تحب رسمها. وترى أن الأخضر الفاتح جميل بشكل خاص. ولون ميا المفضل هو الأصفر لأنه يذكّرها بالشمس ويجعلها سعيدة دائمًا. ومع أن لكل منهم لونًا مختلفًا، فإنهم يتفقون على أن الألوان تجعل كل يوم أكثر متعة.
    note: تعني *reminds her of the sun* يذكّرها بالشمس.
