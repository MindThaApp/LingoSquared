  en.a1.unit64.lesson03.teach.dialogue_line1:
    title: "Mia تجامل"
    gloss: 'تقول Mia: مرحبًا Leila. تبدين رائعة اليوم.'
    note: '*You look great* مجاملة مباشرة.'
  en.a1.unit64.lesson03.teach.dialogue_line2:
    title: Leila تشكر Mia
    gloss: 'تقول Leila: شكرًا يا Mia.'
    note: '*Thank you* تعني «شكرًا لك».'
  en.a1.unit64.lesson03.teach.dialogue_line3:
    title: Mia تذكر السترة الخضراء
    gloss: 'تقول Mia: تعجبني سترتك الخضراء.'
    note: '*I like your green jacket* مجاملة على الملابس.'
  en.a1.unit64.lesson03.teach.dialogue_line4:
    title: Leila ترد بلطف
    gloss: 'تقول Leila: هذا لطف كبير منك.'
    note: '*That is very kind* رد على كلام لطيف قاله شخص ما.'
  en.a1.unit64.lesson03.teach.dialogue_line5:
    title: Mia تذكر الابتسامة
    gloss: 'تقول Mia: ابتسامتك جميلة أيضًا! انظري، هذه صورتي.'
    note: '*too* تعني هنا «أيضًا».'
  en.a1.unit64.lesson03.teach.dialogue_line6:
    title: Leila تجامل الصورة
    gloss: 'تقول Leila: شكرًا جزيلًا. صورتك جميلة.'
    note: '*Your photo is nice* مجاملة متبادلة.'
  en.a1.unit64.lesson03.teach.dialogue_line7:
    title: Mia تشرح أمر الصورة
    gloss: 'تقول Mia: شكرًا. إنها لـ Daniel.'
    note: '*Thanks* أقصر من *thank you*.'
  en.a1.unit64.lesson04.teach.message:
    title: رسالة لطيفة
    gloss: 'رسالة لطيفة: سترتك الخضراء رائعة الجمال. صورتك جميلة. شكرًا لأنك لطيفة.'
    note: تحتوي الرسالة على مجاملتين وشكر.
  en.a1.unit64.lesson04.teach.reading_passage:
    title: 'نص: مجاملة لصديقة'
    gloss: 'مجاملة لصديقة: رأت Mia صديقتها Leila في سترة خضراء. قالت Mia إن Leila تبدو رائعة. وقالت أيضًا إن لديها ابتسامة جميلة. شكرت Leila صديقتها Mia. ثم نظرت Leila إلى صورة Mia وقالت إنها جميلة. كانت Mia سعيدة لأن الصورة لـ Daniel. وفي وقت لاحق كتبت Leila رسالة قصيرة: سترتك الخضراء رائعة الجمال.'
    note: '*looked great* هي الماضي من *look great*.'
