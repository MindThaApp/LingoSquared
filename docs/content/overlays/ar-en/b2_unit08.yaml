teaching:
  en.b2.unit08.lesson01.teach.source:
    title: source
    gloss: مصدر
    note: '*source* هو مصدر يقدّم المعلومات. لا تستخدم *according to* في كل موضع؛ فأحيانًا يكون المطلوب بيان الاتفاق أو التعارض بين المصادر.'
    example_gloss: المصدر يقدّم المعلومات.
  en.b2.unit08.lesson01.teach.synthesize:
    title: synthesize
    gloss: جمع المعلومات وتأليفها
    note: '*synthesize* تعني الجمع بين معلومات من عدة مصادر في إجابة متماسكة.'
    example_gloss: التأليف بين المعلومات هو جمع المعلومات من المصادر.
  en.b2.unit08.lesson01.teach.evaluate:
    title: evaluate
    gloss: تقييم
    note: '*evaluate* تعني الحكم على مدى قوة شيء ما.'
    example_gloss: التقييم هو تقدير مدى قوة شيء ما.
  en.b2.unit08.lesson01.teach.agreement:
    title: agreement
    gloss: اتفاق، توافق
    note: '*agreement* تعني أن المصادر تقول الشيء نفسه عن نقطة ما.'
    example_gloss: التوافق يعني أن المصادر تقول الشيء نفسه.
  en.b2.unit08.lesson01.teach.conflict:
    title: conflict
    gloss: تعارض، تناقض
    note: '*conflict* تعني أن المصادر يناقض بعضها بعضًا أو تختلف في نقطة ما.'
    example_gloss: التعارض يعني أن المصادر غير متفقة.
  en.b2.unit08.lesson01.teach.judgement:
    title: judgment
    gloss: حكم مسبَّب، تقدير مدروس
    note: '*judgment* هو حكم مبني على أسباب حول أي مصدر أقوى. وتُكتب *judgment* في الإنجليزية الأمريكية، وتظهر في الإنجليزية البريطانية أيضًا بصيغة *judgement*.'
    example_gloss: الحكم المسبَّب يوضّح أي مصدر أقوى.
  en.b2.unit08.lesson02.teach_agree_conflict:
    title: اتفاق مع تعارض
    gloss: يتفق المصدران على أن الطلب ازداد، لكنهما يختلفان في السبب.
    note: '*Both sources agree... but they disagree...* أفضل من جملتين منفصلتين تبدأ كل منهما بـ *according to*.'
  en.b2.unit08.lesson02.teach_by_contrast:
    title: by contrast
    gloss: في المقابل، على النقيض من ذلك
    note: استخدم *By contrast* عندما تقابل فعلًا بين مصدرين أو نقطتين. ولا تستخدمها كعبارة حشو عامة في كل موضع.
  en.b2.unit08.lesson02.teach_better_supported:
    title: better supported
    gloss: أفضل دعمًا بالأدلة
    note: '*better supported on the cause* تعني أن الأدلة على السبب أقوى.'
  en.b2.unit08.lesson02.teach_grammar_synthesis:
    title: بناء التركيب
    gloss: ينبغي أن يبيّن التركيب أين تتفق المصادر، وأين تتعارض، وأي رواية أفضل دعمًا بالأدلة.
    note: استخدم *agree* و*conflict* و*better supported* لتجعل العلاقة بين المصادر دقيقة.
  en.b2.unit08.lesson03.teach_survey:
    title: survey
    gloss: استبيان، استطلاع
    note: '*survey* يجمع إجابات أو ملاحظات من عدة أشخاص.'
    example_gloss: الاستبيان يمكنه جمع كثير من الملاحظات.
  en.b2.unit08.lesson03.teach_account:
    title: account
    gloss: رواية، عرض لما حدث
    note: '*account* هو سرد أو تفسير لما حدث.'
    example_gloss: الرواية توضّح ما حدث.
  en.b2.unit08.lesson03.teach.source_a:
    title: Source A
    gloss: 'المصدر A: يقول استبيان الركاب إن تأخر الحافلات أصبح أكثر شيوعًا بعد افتتاح المستشفى الجديد. ويقول كثير من الركاب إن الخط أصبح مزدحمًا الآن، خاصة في الصباح. ويرى الاستبيان أن السبب الرئيسي هو ارتفاع الطلب.'
    note: المصدر A فيه كثير من ملاحظات الركاب، لكن هذا ليس بالضرورة أقوى دليل على السبب.
  en.b2.unit08.lesson03.teach.source_b:
    title: Source B
    gloss: 'المصدر B: يتفق تقرير الشركة المشغّلة على أن الطلب ازداد بعد افتتاح المستشفى، لكنه يحدد نقص السائقين سببًا رئيسيًا لتأخر الخدمة. ويتضمن التقرير سجلات الموظفين للفترة نفسها.'
    note: '*staffing records* تعطي دليلًا أقوى على السبب من تجربة الركاب وحدها.'
  en.b2.unit08.lesson04.teach.q_survey:
    title: تيسا تذكر المصدر A
    gloss: 'تقول تيسا: قرأت روايتين عن تأخر خدمة الحافلات. يقول استبيان الركاب إن الطلب ازداد بعد افتتاح المستشفى الجديد.'
    note: هذا يقدّم مصدرًا ونقطة عن ارتفاع الطلب.
  en.b2.unit08.lesson04.teach.a_operator:
    title: روان يذكر المصدر B
    gloss: 'يقول روان: يتفق تقرير الشركة المشغّلة على أن الطلب ازداد، لكنه يقول إن المشكلة الرئيسية كانت نقص السائقين.'
    note: المصدر B يؤكد نقطة، لكنه يختلف في السبب.
  en.b2.unit08.lesson04.teach.q_agree_conflict:
    title: تيسا تؤلّف بين المصدرين
    gloss: 'تقول تيسا: إذن المصدران متفقان على ارتفاع الطلب، لكنهما متعارضان في السبب.'
    note: '*agree on* و*conflict about* تلخصان العلاقة بين المصدرين.'
  en.b2.unit08.lesson04.teach.a_better_supported:
    title: روان يسأل عن الدليل
    gloss: 'يسأل روان: أي رواية أفضل دعمًا بالأدلة؟'
    note: إنه يطلب حكمًا، لا مجرد تلخيص.
  en.b2.unit08.lesson04.teach.q_evidence_compare:
    title: تيسا تقارن الأدلة
    gloss: 'تقول تيسا: الاستبيان فيه كثير من ملاحظات الركاب، لكن تقرير الشركة المشغّلة يتضمن سجلات الموظفين.'
    note: 'هذه مسألة أدلة: ملاحظات في مقابل بيانات.'
  en.b2.unit08.lesson04.teach.a_judgement_question:
    title: روان يطلب الحكم
    gloss: 'يسأل روان: وما حكمك إذن؟'
    note: '*judgment* تطلب استنتاجًا مبنيًا على أسباب.'
  en.b2.unit08.lesson04.teach.q_final_judgement:
    title: تيسا تعطي حكمها
    gloss: 'تقول تيسا: تقرير الشركة المشغّلة أفضل دعمًا بالأدلة فيما يخص السبب، مع أن الاستبيان مفيد في إظهار تجربة الركاب.'
    note: '*although* تُبقي المصدرين كليهما في الاعتبار وأنت تعطي حكمًا.'
