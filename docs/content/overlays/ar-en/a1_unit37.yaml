  en.a1.unit37.lesson03.teach.dialogue_line1:
    title: سؤال ليلى
    gloss: 'تسأل ليلى: هل تعلم أن عيد ميلاد دانيال في 12 أكتوبر؟'
    note: '*Did you know ...?* طريقة طبيعية لبدء حديث بمعلومة جديدة.'
  en.a1.unit37.lesson03.teach.dialogue_line2:
    title: رد ميا
    gloss: 'تقول ميا: لا، لم أكن أعلم! هذا يوم الجمعة القادم.'
    note: '*No, I didn''t!* رد سلبي قصير على سؤال *Did you know ...?*: «لا، لم أكن أعلم.»'
  en.a1.unit37.lesson03.teach.dialogue_line3:
    title: اقتراح ليلى
    gloss: 'تقول ليلى: لنقم له حفلة مفاجأة في المكتب.'
    note: '*Let''s* + فعل تستخدمها لتقديم اقتراح، وتقابل «لنفعل كذا» في العربية.'
  en.a1.unit37.lesson03.teach.dialogue_line4:
    title: رد ميا
    gloss: 'تقول ميا: فكرة رائعة! أستطيع دعوة بقية الفريق.'
    note: '*the rest of the team* تعني «بقية الفريق».'
  en.a1.unit37.lesson03.teach.dialogue_line5:
    title: Leila's plan
    gloss: 'تقول ليلى: ممتاز. سأشتري له هدية، ربما حذاء جري جديدًا، لأنه يحب الجري.'
    note: '*since* تعني هنا «لأن» (سبب) وليس «منذ» (زمن).'
  en.a1.unit37.lesson03.teach.dialogue_line6:
    title: اقتراح ميا
    gloss: 'تقول ميا: هذه فكرة رائعة. هل نشتري كعكة أيضًا؟'
    note: '*Should we ...?* تستخدمها لاتخاذ قرار مشترك.'
  en.a1.unit37.lesson03.teach.dialogue_line7:
    title: "إجابة ليلى"
    gloss: 'تقول ليلى: نعم، بالتأكيد! سنتمنى له جميعًا عيد ميلاد سعيدًا معًا.'
    note: '*We''ll all wish him a happy birthday* تعني: سنتمنى له جميعًا عيد ميلاد سعيدًا.'
  en.a1.unit37.lesson04.teach.reading_passage:
    title: نص عن حفلة المفاجأة
    gloss: لم يكن دانيال يعلم أن ليلى وميا تخططان لحفلة مفاجأة له. في 12 أكتوبر، يوم عيد ميلاده، وصل إلى العمل ووجد بالونات وكعكة في غرفة الاستراحة. قال له الجميع «عيد ميلاد سعيد!». أهدته ليلى حذاء جري جديدًا. وأهدته ميا صورة مؤطرة للزملاء الثلاثة معًا، التقطتها بنفسها. كان دانيال سعيدًا جدًا وشكر الجميع على المفاجأة الرائعة.
    note: '*he arrived at work and found*: الماضي من *arrive* و*find* (وصل إلى العمل ووجد ...).'
