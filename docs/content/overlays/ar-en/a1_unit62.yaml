teaching:
  en.a1.unit62.lesson01.teach.phone:
    title: phone
    gloss: هاتف
    note: '*phone* تعني هاتفًا. وفي الحياة اليومية تعني *phone* غالبًا الهاتف المحمول.'
    example_gloss: هاتفي هنا.
  en.a1.unit62.lesson01.teach.call:
    title: call
    gloss: يتّصل / اتصال
    note: '*call* قد تكون اتصالًا أو تعني «يتّصل»: *a call* (اسم)، *to call* (فعل).'
    example_gloss: يمكنني أن أتّصل بك.
  en.a1.unit62.lesson01.teach.message:
    title: message
    gloss: رسالة
    note: '*message* تعني رسالة.'
    example_gloss: اترك رسالة.
  en.a1.unit62.lesson01.teach.voicemail:
    title: voicemail
    gloss: بريد صوتي
    note: '*voicemail* تعني رسالة صوتية مسجَّلة على الهاتف (البريد الصوتي).'
    example_gloss: البريد الصوتي قصير.
  en.a1.unit62.lesson01.teach.repeat:
    title: repeat
    gloss: يعيد
    note: '*repeat* تعني يقول مرة أخرى.'
    example_gloss: من فضلك أعد ذلك.
  en.a1.unit62.lesson01.teach.slowly:
    title: slowly
    gloss: ببطء
    note: '*slowly* تعني ببطء. وهي ظرف ينتهي بـ *-ly*؛ ويقابلها في العربية غالبًا «ببطء» أو «بهدوء».'
    example_gloss: من فضلك تكلّم ببطء.
  en.a1.unit62.lesson02.teach.this_is_leila:
    title: Hello, this is Leila.
    gloss: مرحبًا، معك ليلى.
    note: على الهاتف نقول بالإنجليزية *this is...* لنعرّف بمن يتّصل. وتبدو *My name is...* غريبة على الهاتف.
  en.a1.unit62.lesson02.teach.speak_to_mia:
    title: Can I speak to Mia?
    gloss: هل يمكنني التحدث إلى ميا؟
    note: '*speak to* تعني التحدث إلى شخص أو معه. نستعمل *to* بعد *speak* هنا.'
  en.a1.unit62.lesson02.teach.repeat_that:
    title: Please repeat that.
    gloss: من فضلك أعد ذلك.
    note: '*Please repeat that* طلب مهذّب لإعادة الكلام.'
  en.a1.unit62.lesson02.teach.speak_slowly:
    title: Please speak slowly.
    gloss: من فضلك تكلّم ببطء.
    note: تأتي *slowly* هنا بعد الفعل *speak*.
  en.a1.unit62.lesson02.teach.leave_message:
    title: Leave a message.
    gloss: اترك رسالة.
    note: '*leave a message* تعبير ثابت يعني «يترك رسالة».'
  en.a1.unit62.lesson02.teach.call_back_later:
    title: I'll call back later.
    gloss: سأتّصل بك لاحقًا.
    note: '*call back* تعني يعاود الاتصال. وتأتي *back* بعد الفعل.'
  en.a1.unit62.lesson03.teach.dialogue_line1:
    title: "ميا تردّ على الهاتف"
    gloss: 'تقول ميا: مرحبًا، معك ميا.'
    note: '*this is Mia* تبدو طبيعية على الهاتف.'
  en.a1.unit62.lesson03.teach.dialogue_line2:
    title: "ليلى تعرّف بنفسها"
    gloss: 'تقول ليلى: مرحبًا يا ميا، معك ليلى.'
    note: استعمل *this is* لتعرّف بنفسك على الهاتف.
  en.a1.unit62.lesson03.teach.dialogue_line3:
    title: "ليلى لا تسمع جيدًا"
    gloss: 'تقول ليلى: لا أسمعك جيدًا.'
    note: '*can''t hear you well* تعني «لا أستطيع سماعك جيدًا».'
  en.a1.unit62.lesson03.teach.dialogue_line4:
    title: "ليلى تطلب التكلّم ببطء"
    gloss: 'تقول ليلى: من فضلك تكلّمي ببطء.'
    note: '*Please speak slowly* طلب مهذّب.'
  en.a1.unit62.lesson03.teach.dialogue_line5:
    title: "ميا تذكر الساعة"
    gloss: 'تقول ميا: بالتأكيد. الاجتماع في الرابعة.'
    note: '*at four* تستعمل *at* مع الساعة.'
  en.a1.unit62.lesson03.teach.dialogue_line6:
    title: "ليلى تطلب الإعادة"
    gloss: 'تقول ليلى: من فضلك أعيدي ذلك.'
    note: '*repeat that* تشير إلى ما قيل للتو.'
  en.a1.unit62.lesson03.teach.dialogue_line7:
    title: "ميا تعيد: الساعة الرابعة"
    gloss: 'تقول ميا: الساعة الرابعة.'
    note: '*Four o''clock* ساعة كاملة.'
  en.a1.unit62.lesson03.teach.dialogue_line8:
    title: "ليلى ستعاود الاتصال لاحقًا"
    gloss: 'تقول ليلى: شكرًا. سأتّصل بك لاحقًا.'
    note: '*I''ll* اختصار *I will*.'
  en.a1.unit62.lesson04.teach.phone_note:
    title: "رسالة هاتفية"
    gloss: 'رسالة هاتفية: اتّصلت ميا في الساعة 3:00. الاجتماع في القاعة 5. الرجاء معاودة الاتصال.'
    note: تذكر الرسالة من اتّصل والوقت والقاعة وما يجب فعله.
  en.a1.unit62.lesson04.teach.reading_passage:
    title: "نص: مكالمة هاتفية قصيرة"
    gloss: 'مكالمة هاتفية قصيرة: اتّصلت ميا بليلى بعد الظهر. لم يكن الصوت واضحًا، فطلبت ليلى من ميا أن تتكلّم ببطء. قالت ميا إن الاجتماع في الرابعة في القاعة 5. وطلبت ليلى من ميا أن تعيد الوقت. وفي وقت لاحق كتبت ليلى رسالة هاتفية. جاء في الرسالة أن ميا اتّصلت في الساعة 3:00 وطلبت منها معاودة الاتصال.'
    note: '*called* هي صيغة الماضي من *call*.'
