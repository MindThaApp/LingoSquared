    note: السؤال نفسه الذي ورد في الدرس 2.
  en.a2.unit40.lesson04.teach.a_new_lamp_three_days:
    title: الموظف يتولّى الأمر
    gloss: 'الموظف يقول: بالطبع. سيُرسَل مصباح جديد خلال ثلاثة أيام عمل.'
