    gloss: هل يمكنني الحصول على بديل بدلًا من استرداد المال؟
    note: '*instead of* تضع احتمالين متقابلين: تختار الأول لا الثاني.'
  en.a2.unit40.lesson02.teach.my_order_number:
    title: ذكر رقم طلبك
    gloss: رقم طلبي هو 8154.
    note: اذكر رقم طلبك فور أن يُطلب منك؛ فبه يجد الموظف طلبك.
  en.a2.unit40.lesson02.teach.grammar_instead_of:
    title: instead of للاختيار
    gloss: هل يمكنني الحصول على بديل بدلًا من استرداد المال؟ أودّ استرداد مالي بدلًا من الاستبدال.
    note: 'بعد *instead of* يأتي اسم أو صيغة -ing (*instead of a refund* و*instead of getting a refund*)، ولا يأتي الفعل بصيغته الأصلية: لا نقول *instead of get a refund*.'
  en.a2.unit40.lesson03.teach.box:
    title: box
    gloss: صندوق
    note: '*box* هو الصندوق الكرتوني الذي يوجد فيه طلبك. أما *parcel* فهو الطرد كاملًا كما يُسلَّم.'
    example_gloss: كان المصباح في صندوق كبير.
  en.a2.unit40.lesson03.teach.return_message:
    title: ردّ المتجر
    gloss: شكرًا على رسالتك. نأسف لأن مصباحك وصل مكسورًا. يُرجى إعادة المصباح إلى الصندوق وإيصاله إلى مكتب البريد. سيُرسَل مصباح جديد خلال ثلاثة أيام عمل. رقم الطلب 8154.
    note: 'ردّ خدمة العملاء يذكر دائمًا: المشكلة، وما عليك فعله، وما سيفعله المتجر.'
  en.a2.unit40.lesson03.teach.put_it_back_in_the_box:
    title: ما يجب فعله بالمصباح المعطّل
    gloss: يُرجى إعادة المصباح إلى الصندوق وإيصاله إلى مكتب البريد.
    note: '*put ... back in ...* تعني إعادة شيء إلى المكان الذي أتى منه.'
  en.a2.unit40.lesson04.teach.q_report_a_problem:
    title: ليلى تتصل بالمتجر الإلكتروني
    gloss: 'ليلى تقول: مرحبًا، أودّ أن أبلغ عن مشكلة في طلبي.'
    note: عند الاتصال هاتفيًا اذكر مباشرة سبب اتصالك.
  en.a2.unit40.lesson04.teach.a_what_is_the_problem:
    title: الموظف يستفسر
    gloss: 'الموظف يقول: يؤسفني سماع ذلك. ما المشكلة؟'
    note: '*I''m sorry to hear that* هي الاستجابة الثابتة المهذبة من الموظف للأخبار السيئة.'
  en.a2.unit40.lesson04.teach.q_lamp_broken_box_damaged:
    title: ليلى تشرح المشكلة
    gloss: 'ليلى تقول: وصل المصباح مكسورًا. وكان الصندوق تالفًا.'
    note: 'انتبه إلى الفرق: الصندوق *damaged*، والمصباح *broken*.'
  en.a2.unit40.lesson04.teach.a_ask_order_number:
    title: الموظف يسأل عن رقم الطلب
    gloss: 'الموظف يقول: فهمت. هل يمكنك أن تخبرني برقم طلبك؟'
    note: صيغة السؤال غير المباشر نفسها *Could you tell me ...?* كما في الوحدة 39.
  en.a2.unit40.lesson04.teach.q_order_number_8154:
    title: ليلى تذكر رقم طلبها
    gloss: 'ليلى تقول: رقم طلبي هو 8154.'
    note: الجملة نفسها التي وردت في الدرس 2.
  en.a2.unit40.lesson04.teach.a_refund_or_replacement:
    title: الموظف يعرض خيارين
    gloss: 'الموظف يقول: شكرًا لك. هل تفضّلين استرداد المال أم بديلًا؟'
    note: '*or* تضع هنا احتمالين جنبًا إلى جنب، وتختار واحدًا منهما.'
  en.a2.unit40.lesson04.teach.q_replacement_please:
    title: ليلى تختار البديل
