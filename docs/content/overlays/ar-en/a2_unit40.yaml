    example_gloss: وصل طلبي متأخرًا يومين.
  en.a2.unit40.lesson01.teach.delivery:
    title: delivery
    gloss: توصيل
    note: '*delivery* هو اللحظة التي يُحمل فيها طلبك إلى بيتك.'
    example_gloss: وصل التوصيل صباح يوم الثلاثاء.
  en.a2.unit40.lesson01.teach.parcel:
    title: parcel
    gloss: طرد
    note: '*parcel* هو الطرد المغلّف الذي يُسلَّم عند بابك.'
    example_gloss: ترك المندوب الطرد خارج بابي.
  en.a2.unit40.lesson01.teach.damaged:
    title: damaged
    gloss: تالف
    note: '*damaged* تعني أن الشيء أصابه ضرر في الطريق، لكنه قد يظل يعمل. وتُقال غالبًا عن العبوة.'
    example_gloss: كان الصندوق تالفًا عندما وصل.
  en.a2.unit40.lesson01.teach.broken:
    title: broken
    gloss: مكسور
    note: '*broken* أقوى من *damaged*: فالشيء لم يعد يعمل.'
    example_gloss: كان المصباح الذي في الطرد مكسورًا.
  en.a2.unit40.lesson01.teach.replacement:
    title: replacement
    gloss: بديل
    note: '*replacement* هو قطعة جديدة بدلًا من المكسورة. أما *refund* فهو استرداد المال.'
    example_gloss: طلبت بديلًا ولم أطلب استرداد مالي.
  en.a2.unit40.lesson01.teach.grammar_arrived:
    title: arrived وhas not arrived yet
    gloss: وصل طلبي أمس. لم يصل طلبي بعد.
    note: تستعمل *arrived* مع وقت محدد في الماضي. أما *has not arrived yet* فتعني أنك ما زلت تنتظره الآن.
  en.a2.unit40.lesson02.teach.report_order_problem:
