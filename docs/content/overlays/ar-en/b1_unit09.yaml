teaching:
  en.b1.unit09.lesson01.teach.said_that:
    title: said that
    gloss: قال إنّ
    note: تُستخدم *said that* لنقل ما قاله شخص آخر.
    example_gloss: قالت إنها مشغولة جدًا.
  en.b1.unit09.lesson01.teach.told_me_that:
    title: told me that
    gloss: قال لي إنّ
    note: تُستخدم *told me that* عندما يعطيك شخص ما معلومة أنت شخصيًا.
    example_gloss: قال لي إن الاجتماع أُلغي.
  en.b1.unit09.lesson01.teach.asked_whether:
    title: asked whether
    gloss: سأل عمّا إذا كان
    note: تنقل *asked whether* سؤالًا جوابه نعم أو لا، وهي أكثر رسمية قليلًا من *asked if*.
    example_gloss: سألت ميا عمّا إذا كنا بحاجة إلى مساعدة.
  en.b1.unit09.lesson01.teach.asked_if:
    title: asked if
    gloss: سأل إن كان
    note: تنقل *asked if* سؤالًا جوابه نعم أو لا في الكلام اليومي.
    example_gloss: سألت ميا إن كنا بحاجة إلى مساعدة.
  en.b1.unit09.lesson01.teach.message:
    title: message
    gloss: رسالة
    note: تعني *message* رسالة قصيرة، مكتوبة أو منطوقة.
    example_gloss: أرسلت ليلى رسالة بعد الغداء.
  en.b1.unit09.lesson01.teach.confirm:
    title: confirm
    gloss: يؤكّد
    note: تعني *confirm* أن تقول إن شيئًا ما مؤكد أو صحيح.
    example_gloss: من فضلك أكّد الموعد قبل أن تغادر.
  en.b1.unit09.lesson01.teach.available:
    title: available
    gloss: متاح، لديه وقت
    note: تعني *available* أن الشخص غير مشغول وقادر على اللقاء.
    example_gloss: ميا متاحة بعد الغداء.
  en.b1.unit09.lesson02.teach.mia_available:
    title: نقل عبارة
    gloss: قالت ميا إنها كانت متاحة بعد الغداء.
    note: 'في الكلام المنقول يتحول *is* غالبًا إلى *was*: *Mia said that she was available*. وفي العربية يبقى الفعل عادةً على حاله (قالت ميا إنها متاحة)، أما في الإنجليزية فيرجع الفعل خطوة إلى الماضي.'
  en.b1.unit09.lesson02.teach.leila_told_me:
    title: نقل المعلومات إليك
    gloss: قالت لي ليلى إن المكتب كان مزدحمًا بالعمل.
    note: تُستخدم *told me that* عندما نقل لك الشخص المعلومة مباشرةً.
  en.b1.unit09.lesson02.teach.grammar_backshift:
    title: الكلام المباشر وغير المباشر
    gloss: 'تقول ميا: «أنا متاحة.» قالت ميا إنها كانت متاحة.'
    note: 'الكلام المباشر: *I am available*. الكلام المنقول: *Mia said that she was available*. في الكلام المنقول يرجع الفعل غالبًا خطوة إلى الماضي.'
  en.b1.unit09.lesson03.teach.short_summary:
    title: short summary
    gloss: ملخّص قصير
    note: تعني *short summary* نسخة قصيرة فيها أهم النقاط فقط.
    example_gloss: يكفي ملخّص قصير لاجتماع اليوم.
  en.b1.unit09.lesson03.teach.full_report:
    title: full report
    gloss: التقرير الكامل
    note: تعني *full report* التقرير كله، وليس الملخّص فقط.
    example_gloss: سألت ميا عمّا إذا كنا بحاجة إلى التقرير الكامل.
  en.b1.unit09.lesson03.teach.reading_passage:
    title: 'نص للقراءة: سلسلة الرسائل'
    gloss: قرأت ليلى رسالة ميا واتصلت بدانيال. قالت إن ميا متاحة بعد الغداء. وقالت أيضًا إن ميا أنهت الأرقام. سألت ميا عمّا إذا كان الفريق بحاجة إلى التقرير الكامل اليوم. قال دانيال لليلى إن ملخّصًا قصيرًا يكفي، لأن الاجتماع لا يستغرق سوى خمس عشرة دقيقة.
    note: نص قصير للقراءة عن نقل الأقوال والأسئلة.
  en.b1.unit09.lesson04.teach.q_mia_reply:
    title: دانيال يسأل عن ردّ ميا
    gloss: 'دانيال يقول: هل ردّت ميا بخصوص المراجعة؟'
    note: سؤال جوابه نعم أو لا عن رسالة سابقة.
  en.b1.unit09.lesson04.teach.a_she_said_available:
    title: ليلى تنقل كلام ميا
    gloss: 'ليلى تقول: نعم، قالت إنها متاحة بعد الغداء.'
    note: تنقل *she said that she was available* ما قالته ميا.
  en.b1.unit09.lesson04.teach.q_anything_else:
    title: دانيال يواصل الأسئلة
    gloss: 'دانيال يقول: جيد. هل سألت عن شيء آخر؟'
    note: 'سؤال للاستيضاح: هل كان في الرسالة سؤال آخر؟'
  en.b1.unit09.lesson04.teach.a_asked_if_report:
    title: ليلى تنقل سؤال ميا
    gloss: 'ليلى تقول: سألت إن كنا بحاجة إلى التقرير الكامل اليوم.'
    note: تحوّل *asked if* سؤالًا مباشرًا جوابه نعم أو لا إلى كلام منقول.
  en.b1.unit09.lesson04.teach.q_what_tell_her:
    title: دانيال يسأل عن ردّ ليلى
    gloss: 'دانيال يقول: ماذا قلتِ لها؟'
    note: سؤال عن المعلومة التي نقلتها ليلى.
  en.b1.unit09.lesson04.teach.a_short_summary_enough:
    title: ليلى تنقل جوابها
    gloss: 'ليلى تقول: قلت لها إن ملخّصًا قصيرًا يكفي.'
    note: تنقل *I told her that...* معلومات أعطيتها أنت لشخص آخر.
  en.b1.unit09.lesson04.teach.q_tell_team:
    title: دانيال ينهي سلسلة الرسائل
    gloss: 'دانيال يقول: ممتاز. سأخبر الفريق أنه يمكننا أن نلتقي في الثانية.'
    note: يستخدم دانيال *tell ... that* مرة أخرى لنقل المعلومات.
