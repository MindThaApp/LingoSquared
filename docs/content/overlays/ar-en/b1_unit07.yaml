teaching:
  en.b1.unit07.lesson01.teach.if:
    title: if
    gloss: إذا، لو
    note: '*if* تقدّم شرطًا ممكنًا.'
    example_gloss: إذا تأخرت الحافلة، سأتصل بك.
  en.b1.unit07.lesson01.teach.unless:
    title: unless
    gloss: ما لم، إلا إذا
    note: '*unless* تعني تقريبًا *if not*: يحدث الأمر إلا إذا تحقق الشرط.'
    example_gloss: ما لم تتغير الخطة، سنلتقي في العاشرة.
  en.b1.unit07.lesson01.teach.condition:
    title: condition
    gloss: شرط
    note: '*condition* تعني الوضع الذي يجب أن يتحقق أولًا.'
    example_gloss: 'الشرط واضح: نبدأ إذا وصل الجميع.'
  en.b1.unit07.lesson01.teach.result:
    title: result
    gloss: نتيجة
    note: '*result* تعني ما يحدث بسبب شرط ما.'
    example_gloss: النتيجة أننا سنلتقي عبر الإنترنت.
  en.b1.unit07.lesson01.teach.delay:
    title: delay
    gloss: تأخير
    note: '*delay* تعني أن أمرًا يحدث متأخرًا عمّا هو مخطط له.'
    example_gloss: قد يتسبب التأخير في أن يتأخر الجميع.
  en.b1.unit07.lesson01.teach.reschedule:
    title: reschedule
    gloss: أجّل إلى موعد آخر
    note: '*reschedule* تعني اختيار وقت جديد لموعد أو اجتماع.'
    example_gloss: إذا كانت الطبيبة مشغولة، فسنؤجّل الموعد.
  en.b1.unit07.lesson02.teach.if_meeting_late:
    title: Eine reale Bedingung mit Ergebnis
    gloss: إذا تأخر بدء الاجتماع، فسأرسل رسالة إلى الجميع.
    note: 'عندما يكون الشرط حقيقيًّا في المستقبل، يأتي بعد *if* الفعل المضارع: *If the meeting starts late* وليس *will start*.'
  en.b1.unit07.lesson02.teach.if_not_ready:
    title: Eine verneinte Bedingung
    gloss: إذا لم يكن التقرير جاهزًا، فسنؤجّل المراجعة.
    note: '*if ... not* تجعل الشرط منفيًّا.'
  en.b1.unit07.lesson02.teach.grammar_real_condition:
    title: Reale Bedingungen in der Zukunft
    gloss: إذا تأخر البدء، فسأرسل رسالة. وإذا لم يكن التقرير جاهزًا، فسنؤجّل المراجعة.
    note: بعد *if* يأتي الفعل المضارع، وفي النتيجة تأتي *will* غالبًا.
  en.b1.unit07.lesson03.teach.backup_plan:
    title: backup plan
    gloss: خطة بديلة
    note: '*backup plan* تعني خطة إضافية تلجأ إليها إذا لم تنجح الخطة الأولى.'
    example_gloss: نحتاج إلى خطة بديلة إذا كانت القاعة مشغولة.
  en.b1.unit07.lesson03.teach.move_update:
    title: move the update
    gloss: أجّل التحديث
    note: '*move the update* تعني مناقشة التحديث في وقت آخر.'
    example_gloss: إذا تأخرت ليلى، فسنؤجّل تحديثها إلى الغد.
  en.b1.unit07.lesson03.teach.reading_passage:
    title: 'Lesetext: der Ersatzplan'
    gloss: يكتب دانيال خطة بديلة لاجتماع الفريق. إذا كانت قاعة الاجتماعات فارغة، فسيجتمع الفريق فيها في العاشرة. وإذا كانت القاعة مشغولة، فسيجتمعون عبر الإنترنت. وما لم تنضم ليلى قبل العاشرة، فسيؤجّل دانيال تحديثها إلى الغد. وإذا لم يكن التقرير جاهزًا، فسترسل ميا تحديثًا أقصر بدلًا منه.
    note: نص قصير للقراءة فيه شروط حقيقية ونتائج و*unless*.
  en.b1.unit07.lesson04.teach.q_if_meeting_late:
    title: Mia fragt nach dem Plan
    gloss: 'تقول ميا: دانيال، ماذا نفعل إذا تأخر بدء الاجتماع؟'
    note: سؤال عن نتيجة شرط ممكن.
  en.b1.unit07.lesson04.teach.a_send_message:
    title: Daniel nennt das Ergebnis
    gloss: 'يقول دانيال: إذا تأخر البدء، فسأرسل رسالة إلى الجميع.'
    note: '*If it starts late, I will...* تربط احتمالًا حقيقيًّا بإجراء محدد.'
  en.b1.unit07.lesson04.teach.q_if_leila_cannot_join:
    title: Mia fragt nach Leila
    gloss: 'تقول ميا: وإذا لم تستطع ليلى الانضمام؟'
    note: سؤال قصير للمتابعة بالبنية الشرطية نفسها.
  en.b1.unit07.lesson04.teach.a_unless_she_joins:
    title: Daniel verwendet 'unless'
    gloss: 'يقول دانيال: ما لم تنضم قبل العاشرة، فسنؤجّل تحديثها إلى الغد.'
    note: '*unless she joins by ten* تعني: إذا لم تنضم بحلول العاشرة.'
  en.b1.unit07.lesson04.teach.q_room_busy:
    title: Mia fragt nach dem Raum
    gloss: 'تقول ميا: هذا معقول. وإذا كانت القاعة ما زالت مشغولة، فهل نجتمع عبر الإنترنت؟'
    note: تختبر ميا الخطة البديلة لحالة انشغال القاعة.
  en.b1.unit07.lesson04.teach.a_meet_online:
    title: Daniel bestätigt den Online-Plan
    gloss: 'يقول دانيال: نعم، إذا كانت القاعة مشغولة، فسنجتمع عبر الإنترنت بدلًا من ذلك.'
    note: '*instead* تعني أن هذه الخطة تحلّ محل الأخرى.'
