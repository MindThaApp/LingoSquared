  en.a1.unit50.lesson04.teach.reading_passage:
    title: نص عن عطلة نهاية أسبوع في بيت الضيافة
    gloss: 'عطلة نهاية أسبوع في بيت الضيافة: قامت Mia وLeila برحلة قصيرة إلى الجبال في عطلة نهاية الأسبوع. تحب Mia التقاط الصور، وتحب Leila الرسم، فكان المكان مثاليًا للاسترخاء. عندما وصلتا إلى بيت الضيافة، أخبرتا موظف الاستقبال بأن لديهما حجزًا لمدة ليلتين، من 14 إلى 16 نوفمبر. سأل موظف الاستقبال عن الاسم الذي سُجّل به الحجز، فقالت Leila إنه باسمها. كان في غرفتهما سريران وواي فاي، وكان الفطور مشمولًا كل صباح من السابعة إلى العاشرة. وكان تسجيل المغادرة في الساعة الحادية عشرة. التقطت Mia صورًا كثيرة للجبال، ورسمت Leila لوحة صغيرة للمنظر من نافذتهما. بقي Daniel في المنزل في تلك العطلة وطبخ العشاء لنفسه، مستعينًا بوصفة من كتاب الطبخ الذي استعاره من المكتبة. وعندما عادت Mia وLeila، أرتاه صورهما واللوحة، فأعجبته كثيرًا.'
    note: '*Their room had two beds and wifi* تعني «كان في غرفتهما سريران وواي فاي».'
