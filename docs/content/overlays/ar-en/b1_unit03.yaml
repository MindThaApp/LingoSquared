teaching:
  en.b1.unit03.lesson01.teach.if:
    title: if
    gloss: إذا / لو
    note: '*if* تقدّم شرطًا. وهي تقابل «إذا» أو «إن» في العربية، أما «عندما» أو «حين» (الدالّتان على الزمن) فتقابلهما *when*.'
    example_gloss: إذا أمطرت، سنبقى في البيت.
  en.b1.unit03.lesson01.teach.rain:
    title: rain
    gloss: مطر / تمطر
    note: '*rain* تعني الماء الذي يسقط من السماء، أو تعني «تمطر».'
    example_gloss: قد تمطر في نهاية هذا الأسبوع.
  en.b1.unit03.lesson01.teach.stay_home:
    title: stay home
    gloss: يبقى في البيت
    note: '*stay home* تعني ألّا تخرج وأن تبقى في البيت.'
    example_gloss: إذا أمطرت، سنبقى في البيت.
  en.b1.unit03.lesson01.teach.weekend:
    title: weekend
    gloss: عطلة نهاية الأسبوع
    note: '*weekend* تعني السبت والأحد.'
    example_gloss: ما خططك لعطلة نهاية الأسبوع؟
  en.b1.unit03.lesson01.teach.free_time:
    title: free time
    gloss: وقت الفراغ
    note: '*free time* هو الوقت الذي لا تعمل فيه ولا تكون مشغولًا.'
    example_gloss: ليس لديّ كثير من وقت الفراغ هذه الأيام.
  en.b1.unit03.lesson01.teach.paint:
    title: paint
    gloss: يرسم
    note: '*paint* تعني أن تصنع لوحة بالألوان.'
    example_gloss: ليلى تحب الرسم في عطلات نهاية الأسبوع.
  en.b1.unit03.lesson02.teach.if_rains_stay_home:
    title: eine reale Bedingung in der Zukunft
    gloss: إذا أمطرت غدًا، سنبقى في البيت.
    note: '*if + present, will +* الفعل بصيغته الأصلية تعبّر عن شرط واقعي ممكن في المستقبل.'
  en.b1.unit03.lesson02.teach.if_have_free_time_paint:
    title: eine weitere reale Bedingung
    gloss: إذا توفّر لي وقت فراغ في نهاية هذا الأسبوع، فسأرسم.
    note: 'التركيب نفسه: *if + present, will +* الفعل بصيغته الأصلية.'
  en.b1.unit03.lesson02.teach.grammar_real_condition:
    title: reale Bedingungen
    gloss: إذا أمطرت، سنبقى في البيت. إذا توفّر لي وقت، فسأرسم.
    note: بعد *if* تستعمل الإنجليزية هنا المضارع حتى لو كان الكلام عن المستقبل، فلا نقول *will rain*.
  en.b1.unit03.lesson03.teach.would:
    title: would
    gloss: كان سـ... (للافتراض)
    note: '*would* مع الفعل بصيغته الأصلية تعبّر عن حالة غير واقعية أو افتراضية في الحاضر.'
    example_gloss: لو توفّر لي مزيد من الوقت لرسمت كل يوم.
  en.b1.unit03.lesson03.teach.class:
    title: class
    gloss: دورة / حصة
    note: '*class* هي دورة أو حصة منظّمة مع معلّم.'
    example_gloss: كانت هناك دورة رسم قرب بيتها.
  en.b1.unit03.lesson03.teach.reading_passage:
    title: 'Lesetext: wenn sie mehr Freizeit hätte'
    gloss: ليلى تحب الرسم، لكن ليس لديها كثير من وقت الفراغ. لو توفّر لها مزيد من وقت الفراغ لرسمت كل يوم. في الشهر الماضي كانت هناك دورة رسم قرب بيتها. ولو علمت بها في وقت أبكر لسجّلت فيها. الآن تبحث كل أسبوع عن دورات جديدة.
    note: نص قصير فيه حالة غير واقعية في الحاضر وحالة غير واقعية في الماضي.
  en.b1.unit03.lesson04.teach.q_weekend_plans:
    title: Daniel fragt nach dem Wochenende
    gloss: 'دانيال يقول: ما خططك لعطلة نهاية الأسبوع؟'
    note: سؤال مفتوح بسيط لبدء حديث.
  en.b1.unit03.lesson04.teach.a_walk_or_stay_home:
    title: Leilas Pläne, je nach Wetter
    gloss: 'ليلى تقول: إن لم تمطر فسأذهب في نزهة مشيًا. وإن أمطرت فسأبقى في البيت وأرسم.'
    note: شرطان واقعيان متتاليان يتوقفان على الطقس.
  en.b1.unit03.lesson04.teach.q_take_class:
    title: Daniel fragt nach dem Malkurs
    gloss: 'دانيال يقول: يبدو جميلًا. هل حضرتِ دورة الرسم تلك في الشهر الماضي؟'
    note: سؤال متابعة عن شيء في الماضي.
  en.b1.unit03.lesson04.teach.a_would_have_signed_up:
    title: Leilas Reue über die Vergangenheit
    gloss: 'ليلى تقول: لا. لو علمت بها في وقت أبكر لسجّلت فيها.'
    note: '*if + past perfect, would have +* التصريف الثالث للفعل تعبّر عن ماضٍ غير واقعي أو عن الندم.'
  en.b1.unit03.lesson04.teach.q_should_join:
    title: Daniel gibt eine Empfehlung
    gloss: 'دانيال يقول: هذا مؤسف. إن كانت هناك دورة أخرى فينبغي أن تشاركي.'
    note: يستعمل دانيال *should* ليشجّع ليلى على اغتنام الفرصة القادمة.
  en.b1.unit03.lesson04.teach.a_will_sign_up:
    title: Leila nimmt sich etwas vor
    gloss: 'ليلى تقول: معك حق. إن رأيت واحدة فسأسجّل فيها فورًا.'
    note: شرط واقعي جديد عن المستقبل، لم يعد افتراضيًّا.
