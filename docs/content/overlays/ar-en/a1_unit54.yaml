teaching:
  en.a1.unit54.lesson01.teach.laundromat:
    title: laundromat
    gloss: مغسلة ملابس ذاتية الخدمة
    note: تعني *laundromat* مغسلة ملابس ذاتية الخدمة، وهي مكان فيه غسّالات تغسل فيه ملابسك مقابل مبلغ من المال.
    example_gloss: سأذهب اليوم إلى مغسلة الملابس.
  en.a1.unit54.lesson01.teach.washing_machine:
    title: washing machine
    gloss: غسّالة
    note: تعني *washing machine* الغسّالة.
    example_gloss: الغسّالة معطلة.
  en.a1.unit54.lesson01.teach.dryer:
    title: dryer
    gloss: مجفِّف
    note: تعني *dryer* المجفِّف.
    example_gloss: ضع ملابسك في المجفِّف.
  en.a1.unit54.lesson01.teach.quarters:
    title: quarters
    gloss: عملات معدنية أمريكية من فئة 25 سنتًا
    note: تعني *quarters* العملات المعدنية الأمريكية من فئة خمسة وعشرين سنتًا، وغالبًا ما تلزم لتشغيل الغسّالات في المغسلة. ولا يوجد مقابل عربي مباشر لها، ولذلك تبقى الكلمة *quarters* إنجليزية في الغالب.
    example_gloss: تقبل الآلات العملات المعدنية من فئة 25 سنتًا.
  en.a1.unit54.lesson01.teach.detergent:
    title: detergent
    gloss: مسحوق الغسيل
    note: تعني *detergent* مسحوق الغسيل أو المنظِّف.
    example_gloss: تحتاج إلى مسحوق غسيل لتنظيف ملابسك.
  en.a1.unit54.lesson01.teach.load:
    title: load
    gloss: حمولة غسيل
    note: تعني *load* هنا حمولة الغسيل، أي كمية الملابس التي تغسلها في مرة واحدة.
    example_gloss: عندي حمولة كبيرة من الغسيل.
  en.a1.unit54.lesson02.teach.id_like_to_wash_a_few_things:
    title: I'd like to wash a few things, please.
    gloss: أودّ أن أغسل بعض الأشياء، من فضلك.
    note: '*I''d like to* هي اختصار *I would like to*، وهي الطريقة المهذّبة لطلب شيء.'
  en.a1.unit54.lesson02.teach.do_you_have_change:
    title: Do you have change for the machines?
    gloss: هل لديك فكّة للآلات؟
    note: تعني *change* هنا الفكّة، أي العملات المعدنية الصغيرة، وليست «التغيير».
  en.a1.unit54.lesson02.teach.how_long_does_the_cycle_take:
    title: How long does the wash cycle take?
    gloss: كم تستغرق دورة الغسيل؟
    note: تعني *take* هنا «يستغرق» أي يحتاج إلى وقت معيّن، وهذا استعمال مختلف تمامًا عن *the machines take quarters* حيث تعني *take* «تقبل». وفي العربية نستعمل «يستغرق» أو «يستغرق وقتًا» للمعنى الأول.
  en.a1.unit54.lesson02.teach.its_three_dollars_for_one_load:
    title: It's three dollars for one load.
    gloss: ثمن الحمولة الواحدة ثلاثة دولارات.
    note: تعني *for one load* لحمولة غسيل واحدة.
  en.a1.unit54.lesson02.teach.what_time_do_you_close:
    title: What time do you close?
    gloss: متى تُغلقون؟
    note: تستعمل *do you close* الفعل المساعد *do* لتكوين السؤال.
  en.a1.unit54.lesson02.teach.please_pick_up_by_nine:
    title: Please pick up your laundry by nine o'clock.
    gloss: من فضلك استلم غسيلك قبل الساعة التاسعة.
    note: تعني *pick up* يستلم، وتعني *by nine o'clock* «قبل الساعة التاسعة»، أي في موعد أقصاه ذلك الوقت.
  en.a1.unit54.lesson03.teach.dialogue_line1:
    title: الموظف يرحّب بهما
    gloss: 'يقول الموظف: مرحبًا! هل تحتاجان إلى غسّالة؟'
    note: تستعمل *Do you need...?* الفعل المساعد *do* لتكوين السؤال.
  en.a1.unit54.lesson03.teach.dialogue_line2:
    title: سبب Leila
    gloss: 'تقول Leila: نعم، من فضلك. غسّالتي في البيت معطلة.'
    note: تعني *at home* «في البيت».
  en.a1.unit54.lesson03.teach.dialogue_line3:
    title: طلب Daniel
    gloss: 'يقول Daniel: عندي حمولة صغيرة أيضًا. هل يمكنني استخدام غسّالة كذلك؟'
    note: تعني *too* هنا «أيضًا» وتأتي في آخر الجملة، وتؤدي *as well* المعنى نفسه.
  en.a1.unit54.lesson03.teach.dialogue_line4:
    title: الموظف يتحدث عن العملات
    gloss: 'يقول الموظف: بالتأكيد! تقبل الآلات العملات المعدنية من فئة 25 سنتًا.'
    note: تعني *take* هنا «تقبل» (الدفع)، فانتبه إلى الفرق عن *take* في *The wash cycle takes thirty minutes* لاحقًا، حيث تعني «تستغرق».
  en.a1.unit54.lesson03.teach.dialogue_line5:
    title: Leila لديها العملات المعدنية
    gloss: 'تقول Leila: نعم، معي عملات معدنية من فئة 25 سنتًا.'
    note: هذا تأكيد قصير وليس معلومة جديدة.
  en.a1.unit54.lesson03.teach.dialogue_line6:
    title: مدة دورة الغسيل
    gloss: 'يقول الموظف: تستغرق دورة الغسيل ثلاثين دقيقة.'
    note: تعني *take* هنا «تستغرق»، وهو معنى مختلف عن *take* في *take quarters* أعلاه.
  en.a1.unit54.lesson03.teach.dialogue_line7:
    title: Daniel يسأل عن السعر
    gloss: 'يقول Daniel: وكم تبلغ التكلفة؟'
    note: في *How much does it cost?* يظهر الفعل المساعد *does* مرة أخرى لتكوين السؤال.
  en.a1.unit54.lesson03.teach.dialogue_line8:
    title: السعر
    gloss: 'يقول الموظف: ثمن الحمولة الواحدة ثلاثة دولارات.'
    note: هذه معلومة منفصلة، لا علاقة لها بعدد العملات أو بالمدة.
  en.a1.unit54.lesson03.teach.dialogue_line9:
    title: موعد الإغلاق
    gloss: 'يقول الموظف: تُغلق المغسلة في الساعة التاسعة، لذا استلم غسيلك قبل ذلك.'
    note: تعني *so* هنا «لذا»، وتربط موعد الإغلاق بالتعليمات بالحضور في الوقت المناسب.
  en.a1.unit54.lesson04.teach.reading_passage:
    title: 'نص: زيارة إلى مغسلة الملابس'
    gloss: في عصر أحد الأيام تعطلت غسّالة Leila في البيت. فقررت الذهاب إلى مغسلة الملابس في آخر الشارع. جاء معها Daniel لأن عنده أيضًا حمولة صغيرة من الغسيل. في المغسلة شرح الموظف أن الآلات تقبل العملات المعدنية من فئة 25 سنتًا وأن دورة الغسيل تستغرق ثلاثين دقيقة. وكانت تكلفة الحمولة الواحدة ثلاثة دولارات. وبينما كانت ملابسهما تُغسل، تحدّث Daniel وLeila وشربا القهوة في مقهى مجاور. تُغلق المغسلة في الساعة التاسعة، فحرصا على استلام غسيلهما قبل ذلك. شكرت Leila صديقها Daniel على مرافقته لها، وقالت إن غسّالتها في البيت ستُصلَّح على الأرجح قبل نهاية الأسبوع.
    note: تعني *would be fixed* «ستُصلَّح»، فLeila تتوقع إصلاح الغسّالة لكن الأمر ليس مؤكدًا بعد.
