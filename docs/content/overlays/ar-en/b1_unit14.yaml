  en.b1.unit14.lesson03.teach.reading_passage:
    title: 'نص للقراءة: رسالة قبل الاجتماع'
    gloss: مرحبًا دانيال، أتمنى أن تكون بخير. هل من الممكن إضافة تحديث الميزانية إلى جدول أعمال اجتماع الغد؟ سأكون ممتنة لو أحضرت معك آخر الأرقام. هل يمكننا ربما أن نبدأ قبل عشر دقائق ليكون لدينا وقت للأسئلة بعد ذلك؟ شكرًا، ميا
    note: رسالة قصيرة ومهنية فيها طلبات مخفّفة.
  en.b1.unit14.lesson04.teach.q_start_budget_update:
    title: قائدة الفريق تفتتح الاجتماع بلباقة
    gloss: 'يقول مدير الفريق: صباح الخير يا ميا. هل من الممكن أن نبدأ اليوم بتحديث الميزانية؟'
    note: '*would it be possible to* تسأل بأدب عن ترتيب بنود الاجتماع.'
  en.b1.unit14.lesson04.teach.a_add_new_client:
    title: ميا تقدّم طلبًا إضافيًا
    gloss: 'تقول ميا: بالتأكيد. كنت أتساءل هل يمكننا أيضًا إضافة العميل الجديد إلى جدول الأعمال.'
    note: '*I was wondering if we could* طريقة غير مباشرة ومهذّبة لاقتراح أمر ما.'
  en.b1.unit14.lesson04.teach.q_keep_thirty_minutes:
    title: قائدة الفريق تطلب اجتماعًا قصيرًا
    gloss: 'يقول مدير الفريق: فكرة جيدة. هل يمكننا ربما أن نجعل هذا الاجتماع أقصر من ثلاثين دقيقة؟'
    note: '*could we possibly* تطلب بأدب أمرًا يقوم به الطرفان معًا.'
  en.b1.unit14.lesson04.teach.a_questions_in_advance:
    title: ميا تطلب شيئًا للمرة القادمة
    gloss: 'تقول ميا: سأبذل قصارى جهدي. سأكون ممتنة لو أرسل الجميع أسئلتهم مسبقًا في المرة القادمة.'
    note: '*I would appreciate it if* تعني أنك ستكون ممتنًا.'
  en.b1.unit14.lesson04.teach.q_fair_request_followup:
    title: قائدة الفريق توافق وتعد بالمتابعة
    gloss: 'يقول مدير الفريق: هذا طلب معقول. سأرسل تذكيرًا قبل الاجتماع القادم.'
    note: '*follow up* تعني هنا: العودة إلى الموضوع لاحقًا.'
  en.b1.unit14.lesson04.teach.a_send_updated_agenda:
    title: ميا تختم بتأكيد
    gloss: 'تقول ميا: شكرًا. سأرسل جدول الأعمال المحدَّث بعد ظهر اليوم.'
    note: ختام قصير ومهذّب للمحادثة.
