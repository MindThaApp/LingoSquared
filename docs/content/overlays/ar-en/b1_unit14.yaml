    gloss: في الطلبات الرسمية في العمل، استخدم صيغة شرطية مخفّفة مثل Would it be possible to... أو I was wondering if... بدل الأمر المباشر. هذه الصيغ تبدو أكثر أدبًا من Move the meeting أو Review my report.
    note: 'الصيغة: استخدم صيغة شرطية مخفّفة بدل الأمر المباشر.'
