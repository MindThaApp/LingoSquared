teaching:
  en.a1.unit46.lesson01.teach.lost:
    title: lost
    gloss: ضائع / مفقود
    note: '*lost* تعني هنا «ضاع» أو «مفقود». في الإنجليزية نقول I lost my wallet بصيغة الماضي، أي «أضعت محفظتي».'
    example_gloss: أضعت محفظتي.
  en.a1.unit46.lesson01.teach.found:
    title: found
    gloss: وجدت
    note: '*found* هي الماضي وكذلك اسم المفعول من find: I found your keys تعني «وجدت مفاتيحك».'
    example_gloss: وجدت مفاتيحك!
  en.a1.unit46.lesson01.teach.keys:
    title: keys
    gloss: مفاتيح
    note: '*keys* تعني «مفاتيح».'
    example_gloss: هذه مفاتيحي.
  en.a1.unit46.lesson01.teach.wallet:
    title: wallet
    gloss: محفظة
    note: '*wallet* تعني «محفظة» للنقود والبطاقات.'
    example_gloss: هل هذه محفظتك؟
  en.a1.unit46.lesson01.teach.backpack:
    title: backpack
    gloss: حقيبة ظهر
    note: '*backpack* تعني «حقيبة ظهر».'
    example_gloss: حقيبة ظهري سوداء.
  en.a1.unit46.lesson02.teach.i_lost_my_wallet:
    title: I lost my wallet.
    gloss: أضعت محفظتي.
    note: '*I lost my wallet.* تعني حرفيًا «أضعت محفظتي»، وهي الطريقة الطبيعية للقول إن المحفظة ضاعت منك.'
  en.a1.unit46.lesson02.teach.have_you_seen_my_keys:
    title: Have you seen my keys?
    gloss: هل رأيت مفاتيحي؟
    note: '*Have you seen ...?* تعني «هل رأيت ...؟»، وتبدأ السؤال بـ have ثم الفاعل ثم الفعل.'
  en.a1.unit46.lesson02.teach.has_anyone_found_a_backpack:
    title: Has anyone found a backpack?
    gloss: هل وجد أحد حقيبة ظهر؟
    note: '*Has anyone found ...?* تعني «هل وجد أحد ...؟»'
  en.a1.unit46.lesson02.teach.its_black_with_a_red_strap:
    title: It's black with a red strap.
    gloss: إنها سوداء بحزام أحمر.
    note: '*It''s black with a red strap.* تعني «إنها سوداء بحزام أحمر».'
  en.a1.unit46.lesson02.teach.wheres_the_lost_and_found:
    title: Where's the lost and found?
    gloss: أين مكتب المفقودات؟
    note: '*the lost and found* هو الاسم الثابت بالإنجليزية لمكتب المفقودات، وحرفيًا «المفقود والموجود».'
  en.a1.unit46.lesson02.teach.yes_we_found_it:
    title: Yes, we found it!
    gloss: نعم، وجدناها!
    note: '*Yes, we found it!* تعني «نعم، وجدناها!»'
  en.a1.unit46.lesson03.teach.dialogue_line1:
    title: سؤال Daniel
    gloss: 'يسأل Daniel: Mia، أين حقيبة ظهرك؟ كانت معك عند النافورة.'
    note: '*had* هي صيغة الماضي من have، وتعني «كان معك» أو «كنتِ تملكين».'
  en.a1.unit46.lesson03.teach.dialogue_line2:
    title: فزع Mia
    gloss: 'تقول Mia: يا إلهي، معك حق! ليست معي. كاميرتي بداخلها!'
    note: '*My camera is inside!* تعني «كاميرتي بداخلها!»'
  en.a1.unit46.lesson03.teach.dialogue_line3:
    title: اقتراح Daniel
    gloss: 'يقول Daniel: لا تقلقي، لنتصل بمكتب الحديقة ونسأل.'
    note: '*Don''t worry* تعني «لا تقلق».'
  en.a1.unit46.lesson03.teach.dialogue_line4:
    title: مكالمة Daniel مع المكتب
    gloss: 'يقول Daniel: مرحبًا، أضعنا حقيبة ظهر سوداء قرب النافورة. هل وجد أحد واحدة؟'
    note: '*we lost a black backpack* تعني «أضعنا حقيبة ظهر سوداء»، وتستعمل الإنجليزية هنا الماضي البسيط *lost*.'
  en.a1.unit46.lesson03.teach.dialogue_line5:
    title: سؤال Mia
    gloss: 'تقول Mia: ماذا قالوا؟'
    note: '*did they say* تستعمل did فعلًا مساعدًا لسؤال في الماضي.'
  en.a1.unit46.lesson03.teach.dialogue_line6:
    title: الخبر السار من Daniel
    gloss: 'يقول Daniel: لقد وجدوها! إنها سوداء بحزام أصفر، أليس كذلك؟ إنهم يحتفظون بها عند مكتب الاستقبال.'
    note: '*right?* في آخر الجملة سؤال قصير للتأكد، مثل «أليس كذلك؟» في العربية.'
  en.a1.unit46.lesson03.teach.dialogue_line7:
    title: ارتياح Mia
    gloss: 'تقول Mia: نعم، هذه هي! لنذهب لنأخذها الآن. الحمد لله.'
    note: '*Let''s go get it* تعني «لنذهب لنأخذها»، ويأتي فعلان متتاليان من دون to.'
  en.a1.unit46.lesson04.teach.reading_passage:
    title: نص عن مكتب المفقودات
    gloss: 'مكتب المفقودات: إذا أضعت شيئًا في الحديقة، ففكّر أولًا في آخر مكان كان معك فيه. ثم اذهب إلى مكتب الحديقة قرب البوابة الرئيسية وصف الشيء، واذكر لونه وأي تفاصيل مميزة. أعطِ اسمك ورقم هاتفك ليتصل بك الموظفون إذا وجدوه لاحقًا. بعد أن أضاعت Mia حقيبة ظهرها قرب النافورة، اتصلت هي وDaniel بمكتب الحديقة فورًا. كان الموظفون قد وجدوها بالفعل وكانوا يحتفظون بها عند مكتب الاستقبال. ارتاحت Mia كثيرًا لأنها استعادت كاميراها سالمة. وفي وقت لاحق، روت لـ Leila القصة كاملة، وقالت Leila إنها ستساعد Mia على الاهتمام بأغراضها بشكل أفضل في المرة القادمة.'
    note: '*keep better track of your things* تعني «الانتباه إلى أغراضك بشكل أفضل».'
