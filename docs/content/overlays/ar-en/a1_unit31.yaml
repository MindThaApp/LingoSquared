    note: '*green* تعني أخضر.'
    example_gloss: عيناه خضراوان.
  en.a1.unit31.lesson02.teach.glasses:
    title: glasses
    gloss: نظّارة
    note: '*glasses* تعني نظّارة. الكلمة تأتي دائمًا بصيغة الجمع؛ و*wears glasses* تعني «يرتدي نظّارة».'
    example_gloss: أبي يرتدي نظّارة.
  en.a1.unit31.lesson02.teach.what_look_like:
    title: What does she look like?
    gloss: كيف تبدو؟
    note: 'انتبه إلى بناء السؤال: في العربية نسأل «كيف تبدو؟» بلا فعل مساعد. أما في الإنجليزية فنحتاج مع فعل عادي (*look*) إلى *does* أو *do* دائمًا: *What does she look like?* ولا نقول *What looks she like?*. نسيان الفعل المساعد *does* من أكثر الأخطاء شيوعًا.'
  en.a1.unit31.lesson03.teach.dialogue_line1:
    title: "بداية ليلى"
    gloss: 'تقول ليلى: لدينا زميلة جديدة تبدأ اليوم. اسمها ميا.'
    note: '*starting today* تعني «ابتداءً من اليوم».'
  en.a1.unit31.lesson03.teach.dialogue_line2:
    title: "سؤال دانيال"
    gloss: 'يسأل دانيال: كيف تبدو؟'
    note: 'مرة أخرى الفعل المساعد: لا تحذف *does*، ولا تكتفِ بقلب الفاعل والفعل.'
  en.a1.unit31.lesson03.teach.dialogue_line3:
    title: "وصف ليلى"
    gloss: 'تقول ليلى: هي طويلة وشعرها أشقر مجعّد.'
    note: '*She''s* اختصار *she is*.'
  en.a1.unit31.lesson03.teach.dialogue_line4:
    title: "سؤال دانيال التالي"
    gloss: 'يسأل دانيال: هل ترتدي نظّارة؟'
    note: 'هنا أيضًا نحتاج *does*: *Does she wear glasses?* ولا نقول *Wears she glasses?*.'
  en.a1.unit31.lesson03.teach.dialogue_line5:
    title: "جواب ليلى"
    gloss: 'تقول ليلى: نعم، ترتديها. وعيناها خضراوان أيضًا.'
    note: '*Yes, she does* إجابة قصيرة بالإيجاب يتكرّر فيها الفعل المساعد *does*.'
  en.a1.unit31.lesson03.teach.dialogue_line6:
    title: "ملاحظة دانيال الأخيرة"
    gloss: 'يقول دانيال: حسنًا، أظن أنني أراها الآن عند الباب.'
    note: '*at the door* تعني عند الباب.'
  en.a1.unit31.lesson04.teach.reading_passage:
    title: "نص عن دانيال وليلى"
    gloss: دانيال وليلى صديقان حميمان، لكنهما لا يتشابهان في المظهر. دانيال طويل وشعره أسود قصير. يرتدي نظّارة. ليلى قصيرة وشعرها بنّي طويل مجعّد. عيناها زرقاوان، وعينا دانيال بنّيتان. كلاهما يحبّ الضحك كثيرًا.
    note: '*don''t look the same* تعني «لا يتشابهان في المظهر». وهنا أيضًا نحتاج *do* حتى في النفي (*don''t* = *do not*).'
