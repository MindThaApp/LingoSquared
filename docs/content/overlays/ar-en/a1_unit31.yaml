  en.a1.unit31.lesson01.teach.tall:
    title: tall
    gloss: طويل
    note: '*tall* تعني طويل القامة (لطول الشخص).'
    example_gloss: أخي طويل.
  en.a1.unit31.lesson01.teach.short:
