  en.a1.unit31.lesson01.teach.hair:
    title: hair
    gloss: شعر
    note: '*hair* تعني الشعر. هي في الإنجليزية غير معدودة: *her hair is long* ولا نقول *her hairs are long*.'
    example_gloss: شعرها طويل.
