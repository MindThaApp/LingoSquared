  en.a1.unit36.lesson01.teach.class:
    title: class
    gloss: درس / حصة
    note: '*class* تعني «درس» أو «حصة» (لقاء تتعلم فيه شيئًا).'
    example_gloss: عندي درس كل ثلاثاء مساءً.
  en.a1.unit36.lesson01.teach.course:
    title: course
    gloss: دورة
    note: '*course* تعني «دورة» (سلسلة دروس في موضوع واحد).'
    example_gloss: يحضر دورة في الحاسوب هذا العام.
  en.a1.unit36.lesson01.teach.student:
    title: student
    gloss: طالب
    note: '*student* تعني «طالب» أو «متعلّم»: من يتعلم في مدرسة أو في درس.'
    example_gloss: هي طالبة في كلية مجتمعية.
  en.a1.unit36.lesson01.teach.homework:
    title: homework
    gloss: واجب منزلي
    note: '*homework* تعني «واجب منزلي».'
    example_gloss: أؤدي واجبي المنزلي بعد العشاء.
  en.a1.unit36.lesson01.teach.subject:
    title: subject
    gloss: مادة دراسية
    note: '*subject* تعني «مادة دراسية» (موضوع تدرسه).'
    example_gloss: الرياضيات مادتي المفضلة.
  en.a1.unit36.lesson01.teach.test:
    title: test
    gloss: اختبار
    note: '*test* تعني «اختبار».'
    example_gloss: عندنا اختبار يوم الجمعة.
  en.a1.unit36.lesson02.teach.take_a_class:
    title: take a class
    gloss: يحضر درسًا
    note: '*take a class* هو التركيب الإنجليزي الثابت لحضور درس. لا تترجم الفعل العربي «يتابع» حرفيًا إلى *follow a class* لأنه يبدو غريبًا في الإنجليزية؛ استخدم *take* دائمًا.'
    example_gloss: أحضر درسًا كل ثلاثاء مساءً.
  en.a1.unit36.lesson02.teach.do_homework:
    title: do homework
    gloss: يؤدي الواجب المنزلي
    note: '*do homework*: الفعل هو *do* وليس *make*. تذكّر ذلك لأن الإنجليزية لا تقول *make homework*.'
    example_gloss: يؤدي واجبه المنزلي بعد العشاء.
  en.a1.unit36.lesson02.teach.study_for_a_test:
    title: study for a test
    gloss: يذاكر للاختبار
    note: '*study for a test* تعني «يذاكر للاختبار». تدل *For* هنا على الغرض (ما تذاكر من أجله).'
    example_gloss: أذاكر للاختبار كل جمعة.
  en.a1.unit36.lesson02.teach.community_college:
    title: community college
    gloss: كلية مجتمعية (معهد محلي للكبار)
    note: '*community college* مؤسسة تعليمية أمريكية يحضر فيها الكبار دورات إلى جانب عملهم. ليس لها مقابل عربي دقيق، لذلك يُشرح معناها عادةً ويبقى الاسم الإنجليزي كما هو.'
    example_gloss: هي تدرس في كلية مجتمعية.
  en.a1.unit36.lesson02.teach.in_the_evening:
    title: in the evening
    gloss: في المساء
    note: '*in the evening* تعني «في المساء».'
    example_gloss: درسي في المساء.
  en.a1.unit36.lesson02.teach.what_are_you_studying_question:
    title: What are you studying?
    gloss: ماذا تدرس؟
    note: يستخدم هذا السؤال المضارع المستمر (*are you studying*) للحديث عما تنشغل به في هذه الفترة من حياتك، لا المضارع البسيط.
  en.a1.unit36.lesson03.teach.dialogue_line1:
    title: سؤال دانيال
    gloss: 'يسأل دانيال: هل ستفعلين شيئًا بعد العمل اليوم؟'
    note: '*anything* تعني هنا «أي شيء» وتأتي في السؤال.'
  en.a1.unit36.lesson03.teach.dialogue_line2:
    title: "إجابة ميا"
    gloss: 'تقول ميا: نعم، عندي درس تصوير الليلة.'
    note: '*tonight* تعني «الليلة».'
  en.a1.unit36.lesson03.teach.dialogue_line3:
    title: رد دانيال
    gloss: 'يقول دانيال: رائع! أين تحضرينه؟'
    note: '*Where do you take it?*: هنا أيضًا تناسب *take* حضور درس أو دورة، مثل *take a class*.'
  en.a1.unit36.lesson03.teach.dialogue_line4:
    title: "إجابة ميا"
    gloss: 'تقول ميا: في الكلية المجتمعية وسط المدينة. مرتين في الأسبوع.'
    note: '*twice a week*: هنا أيضًا تعني *a* «في كل».'
  en.a1.unit36.lesson03.teach.dialogue_line5:
    title: سؤال دانيال
    gloss: 'يقول دانيال: كيف تسير الأمور حتى الآن؟'
    note: '*so far* تعني «حتى الآن».'
  en.a1.unit36.lesson03.teach.dialogue_line6:
    title: "إجابة ميا"
    gloss: 'تقول ميا: يعجبني كثيرًا. أتعلّم كيف أستخدم كاميرتي بشكل أفضل.'
    note: '*I''m learning how to ...*: المضارع المستمر لمهارة تطوّرها في هذه الفترة.'
  en.a1.unit36.lesson03.teach.dialogue_line7:
    title: تعليق دانيال الأخير
    gloss: 'يقول دانيال: رائع! ربما تستطيعين أن تعلّميني يومًا ما.'
    note: '*sometime* تعني «في وقت ما»: إشارة غامضة إلى وقت في المستقبل.'
  en.a1.unit36.lesson04.teach.reading_passage:
    title: نص عن دانيال وليلى وميا
    gloss: يتعلم دانيال وليلى وميا جميعًا شيئًا جديدًا خارج العمل. يحضر دانيال دورة في الحاسوب مساء كل اثنين ليتعلم مهارات جديدة لعمله. تدرس ليلى الإسبانية لأنها تريد السفر إلى المكسيك يومًا ما. عند ميا درس تصوير مرتين في الأسبوع في الكلية المجتمعية، وصورها أصبحت أفضل بكثير. يتحدثون أحيانًا معًا عن دروسهم وقت الغداء.
    note: '*takes a computer course*: تستخدم *take* وليس *follow*؛ وهو الخطأ المحتمل نفسه في *take a class*.'
