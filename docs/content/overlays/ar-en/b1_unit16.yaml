teaching:
  en.b1.unit16.lesson01.teach.advice:
    title: advice
    gloss: نصيحة
    note: '*advice* تعني رأيًا فيما ينبغي لشخص ما أن يفعله.'
    example_gloss: قدّمت ليلى لدانيال نصيحة مفيدة.
  en.b1.unit16.lesson01.teach.suggest:
    title: suggest
    gloss: يقترح
    note: '*suggest* تعني طرح فكرة للتفكير فيها.'
    example_gloss: اقترحت ليلى طريقة للتعامل مع عبء عمله.
  en.b1.unit16.lesson01.teach.overwhelmed:
    title: overwhelmed
    gloss: مُرهَق بكثرة المهام
    note: '*overwhelmed* تعني الشعور بأن عليك أن تفعل أكثر مما تستطيع.'
    example_gloss: شعر دانيال بأنه مُرهَق بسبب مشروعيه.
  en.b1.unit16.lesson01.teach.prioritize:
    title: prioritize
    gloss: يضع الأولويات، يعطي الأولوية
    note: '*prioritize* تعني إنجاز المهمة الأهم أولًا.'
    example_gloss: قرّر دانيال أن يعطي الأولوية للمشروع الذي موعده النهائي أقرب.
  en.b1.unit16.lesson01.teach.workload:
    title: workload
    gloss: عبء العمل، حجم العمل
    note: '*workload* تعني الكمية الكلية من العمل التي يجب على شخص ما إنجازها.'
    example_gloss: ازداد عبء عمل دانيال بعد انضمامه إلى الفريق في مارس.
  en.b1.unit16.lesson01.teach.decline:
    title: decline
    gloss: يرفض
    note: '*decline* تعني رفض اقتراح أو عرض بأدب.'
    example_gloss: كان بإمكان دانيال أن يأخذ بالنصيحة أو يرفضها بأدب.
  en.b1.unit16.lesson02.teach.if_i_were_you:
    title: if I were you, I would + Grundform
    gloss: لو كنت مكانك، لتحدثت إلى مديرك.
    note: '*if I were you, I would* صيغة الشرط غير الواقعي لتقديم النصيحة.'
  en.b1.unit16.lesson02.teach.you_should_prioritize:
    title: you should + Grundform
    gloss: ينبغي أن تعطي الأولوية للمشروع الذي موعده النهائي أقرب.
    note: '*you should* توصية مباشرة.'
  en.b1.unit16.lesson02.teach.how_about:
    title: how about + -ing
    gloss: ما رأيك أن تطلب من زميل أو زميلة المساعدة؟
    note: '*how about + -ing* طريقة ألطف لاقتراح شيء ما.'
  en.b1.unit16.lesson02.teach.grammar_advice_forms:
    title: Formen, um Rat zu geben
    gloss: 'للنصيحة والاقتراح صيغ عدة: If I were you, I would... (فرضية غير واقعية)، وYou should... (توصية مباشرة)، وHow about + -ing...? (اقتراح ألطف). اختر صيغة أقوى أو أخف بحسب درجة الثقة التي تريد أن تبدو بها.'
    note: 'الصيغة: اختر بين فرضية غير واقعية أو توصية مباشرة أو اقتراح لطيف.'
  en.b1.unit16.lesson03.teach.deadline:
    title: deadline
    gloss: الموعد النهائي
    note: '*deadline* تعني التاريخ الذي يجب أن ينتهي العمل قبله.'
    example_gloss: الموعد النهائي الأقرب لدانيال هو يوم الجمعة القادم.
  en.b1.unit16.lesson03.teach.that_makes_sense:
    title: that makes sense. I'll try it.
    gloss: هذا منطقي. سأجرّبه.
    note: '*that makes sense* تدل على أنك فهمت النصيحة وقبلتها.'
    example_gloss: هذا منطقي. سأجرّبه هذا الأسبوع.
  en.b1.unit16.lesson03.teach.reading_passage:
    title: 'Lesetext: Rat bei zu viel Arbeit'
    gloss: مرحبًا ليلى، أشعر بأنني مُرهَق هذا الأسبوع. أقود مشروعين، ولديّ فوق ذلك دورتي المسائية. هل عندك نصيحة؟ مرحبًا دانيال، لو كنت مكانك، لتحدثت إلى مديرك عن عبء العمل. وينبغي أن تعطي الأولوية للمشروع الذي موعده النهائي أقرب. ما رأيك أن تطلب من ميا المساعدة في المشروع الآخر؟ شكرًا، هذا منطقي. سأجرّبه وأخبرك بما يحدث.
    note: نصيحة قصيرة ودّية بين زملاء.
  en.b1.unit16.lesson04.teach.q_overwhelmed_two_projects:
    title: Daniel erklärt sein Problem
    gloss: 'يقول دانيال: أشعر بإرهاق قليل. أقود مشروعين، ولا تزال لديّ دورتي المسائية ثلاث مرات في الأسبوع.'
    note: '*a little overwhelmed* تصف الشعور بأن لديك عملًا أكثر من اللازم قليلًا.'
  en.b1.unit16.lesson04.teach.a_talk_to_manager:
    title: Leila gibt ihren ersten Rat
    gloss: 'تقول ليلى: لو كنت مكانك، لتحدثت إلى مديرك عن عبء العمل.'
    note: '*if I were you, I would* هي صيغة الفرضية غير الواقعية.'
  en.b1.unit16.lesson04.teach.q_dont_want_to_seem:
    title: Daniel zögert
    gloss: 'يقول دانيال: هذه فكرة جيدة، لكنني لا أريد أن أبدو كأنني لا أستطيع التعامل مع الأمر.'
    note: '*I don''t want to seem like* تعبّر عن القلق من الانطباع الذي يتركه المرء.'
  en.b1.unit16.lesson04.teach.a_prioritize_and_how_about:
    title: Leila macht zwei konkrete Vorschläge
    gloss: 'تقول ليلى: ينبغي أن تعطي الأولوية أولًا للمشروع الذي موعده النهائي أقرب. ما رأيك أن تطلب من زميل أو زميلة المساعدة في المشروع الآخر؟'
    note: '*you should* و*how about* تجمعان بين اقتراح مباشر واقتراح لطيف.'
  en.b1.unit16.lesson04.teach.q_ask_mia_this_week:
    title: Daniel nimmt den Rat an
    gloss: 'يقول دانيال: يعجبني هذا. سأسأل ميا إن كان لديها وقت هذا الأسبوع.'
    note: '*I like that* تدل على قبول النصيحة.'
  en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan:
    title: Leila bestätigt den Plan
    gloss: 'تقول ليلى: يبدو هذا خطة متينة.'
    note: ختام قصير ومشجّع للمحادثة.
