teaching:
  en.b1.unit11.lesson01.teach.would:
    title: would
    gloss: كنت سـ (للافتراض)
    note: تدل *would* + الفعل في صورته الأصلية على نتيجة متخيَّلة أو على تفضيل مهذّب.
    example_gloss: كنت سأشارك لو كان لدي وقت أكثر.
  en.b1.unit11.lesson01.teach.would_rather:
    title: would rather
    gloss: يفضّل
    note: تعني *would rather* أنك تفضّل فعل شيء على شيء آخر.
    example_gloss: أفضّل أن أحضر دورة عطلة نهاية الأسبوع.
  en.b1.unit11.lesson01.teach.if_i_were:
    title: if I were
    gloss: لو كنت
    note: تبدأ *if I were* موقفًا غير واقعي يخصّك أنت.
    example_gloss: لو كنت متفرغًا هذا المساء لذهبت.
  en.b1.unit11.lesson01.teach.opportunity:
    title: opportunity
    gloss: فرصة
    note: تعني *opportunity* فرصة جيدة لفعل شيء ما.
    example_gloss: هذه الدورة فرصة جيدة لليلى.
  en.b1.unit11.lesson01.teach.regret:
    title: regret
    gloss: ندم، أسف
    note: تعني *regret* الندم أو الأسف على قرار في الماضي.
    example_gloss: 'لديها ندم واحد: أنها لم تبدأ الادخار قبل ذلك.'
  en.b1.unit11.lesson01.teach.take_a_chance:
    title: take a chance
    gloss: يخاطر، يجرّب حظه
    note: تعني *take a chance* أن تجرّب شيئًا حتى لو لم يكن النجاح مضمونًا.
    example_gloss: لو كانت الدورة أرخص لجازفت وجرّبت.
  en.b1.unit11.lesson02.teach.more_time_course:
    title: Eine unwirkliche Situation in der Gegenwart
    gloss: لو كان لدي وقت أكثر لالتحقت بدورة في التصميم.
    note: 'بعد *if* يأتي الفعل في الماضي للتعبير عن موقف غير واقعي في الحاضر: *If I had more time*. وهذا يشبه العربية التي نقول فيها «لو» + الفعل الماضي: «لو كان لدي وقت أكثر».'
  en.b1.unit11.lesson02.teach.cheaper_sign_up:
    title: if it were cheaper
    gloss: لو كانت أرخص لسجّلت اليوم.
    note: تبدو *were* طبيعية في الشرط غير الواقعي، حتى مع *it*.
  en.b1.unit11.lesson02.teach.grammar_unreal_present:
    title: Unwirkliche Bedingungen in der Gegenwart
    gloss: لو كانت أرخص لسجّلت.
    note: 'الصيغة: *if* + الفعل في الماضي، ثم *would* + الفعل في صورته الأصلية.'
  en.b1.unit11.lesson03.teach.sooner:
    title: sooner
    gloss: قبل ذلك، أبكر
    note: تعني *sooner* في وقت أبكر من الوقت الذي حدث فيه الأمر فعلًا.
    example_gloss: لو علمت بذلك قبل ذلك لادّخرت مالًا أكثر.
  en.b1.unit11.lesson03.teach.confident:
    title: confident
    gloss: واثق من نفسه
    note: تعني *confident* أنك تشعر بأنك قادر على فعل شيء ما بشكل جيد.
    example_gloss: لو انضم دانيال لشعرت ليلى بثقة أكبر.
  en.b1.unit11.lesson03.teach.reading_passage:
    title: 'Lesetext: eine verpasste Gelegenheit'
    gloss: 'وجدت ليلى دورة في التصميم تريد الالتحاق بها حقًا. هي مفيدة لكنها غالية. لو كانت أرخص لسجّلت اليوم. ولو انضم دانيال إلى الدورة أيضًا لشعرت بثقة أكبر. ندمها الوحيد يتعلق بالتوقيت: لو علمت بالدورة في وقت أبكر لادّخرت مالًا أكثر.'
    note: نص قصير للقراءة فيه شروط غير واقعية في الحاضر والماضي.
  en.b1.unit11.lesson04.teach.q_take_if_cheaper:
    title: Mia stellt eine hypothetische Frage
    gloss: 'ميا تقول: ليلى، هل كنتِ ستلتحقين بدورة التصميم لو كانت أرخص؟'
    note: سؤال مهذّب افتراضي باستخدام *would*.
  en.b1.unit11.lesson04.teach.a_sign_up_today:
    title: Leila nennt das vorgestellte Ergebnis
    gloss: 'ليلى تقول: بالتأكيد. لو كانت أرخص لسجّلت اليوم.'
    note: تصف *If it were cheaper, I would...* ما كانت ستفعله في موقف مختلف.
  en.b1.unit11.lesson04.teach.q_daniel_joined:
    title: Mia schlägt ein weiteres Szenario vor
    gloss: 'ميا تقول: وماذا لو انضم دانيال أيضًا؟'
    note: تبدأ *What if...* احتمالًا متخيَّلًا.
  en.b1.unit11.lesson04.teach.a_more_confident:
    title: Leila beschreibt ihr Gefühl
    gloss: 'ليلى تقول: لو انضم دانيال لشعرت بثقة أكبر.'
    note: جاءت *joined* في الماضي لأن الموقف متخيَّل فقط.
  en.b1.unit11.lesson04.teach.q_would_rather_weekend:
    title: Mia nennt ihre Vorliebe
    gloss: 'ميا تقول: أفضّل دورة عطلة نهاية الأسبوع على الدورة المسائية.'
    note: تقارن *would rather ... than ...* بين تفضيلين.
  en.b1.unit11.lesson04.teach.a_known_sooner:
    title: Leila spricht über ein Bedauern in der Vergangenheit
    gloss: 'ليلى تقول: وأنا كذلك. لو علمت بها قبل ذلك لادّخرت مالًا أكثر.'
    note: تصف *if + past perfect, would have + past participle* موقفًا غير واقعي في الماضي.
