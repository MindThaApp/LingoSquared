  en.a1.unit48.lesson03.teach.dialogue_line1:
    title: اقتراح Leila
    gloss: 'تقول Leila: يجب أن أعيد هذا الكتاب إلى المكتبة. هل تريد أن تأتي معي؟'
    note: '*Do you want to come with me?* تعني «هل تريد أن تأتي معي؟»'
  en.a1.unit48.lesson03.teach.dialogue_line2:
    title: رد Daniel
    gloss: 'يقول Daniel: طبعًا! لا أظن أنني استعرت كتابًا من مكتبة من قبل.'
    note: '*I don''t think I''ve ever ...* تعني «لا أظن أنني ... من قبل»، وتستعمل المضارع التام (*have ever*).'
  en.a1.unit48.lesson03.teach.dialogue_line3:
    title: Leila عند المكتب
    gloss: 'تقول Leila: مرحبًا، أود أن أعيد هذا الكتاب، وأود أيضًا أن أستعير كتابًا جديدًا.'
    note: '*and I''d like to ... too* تعني «وأود أيضًا أن ...»'
  en.a1.unit48.lesson03.teach.dialogue_line4:
    title: سؤال أمينة المكتبة
    gloss: 'تقول أمينة المكتبة: ممتاز، شكرًا. هل معك بطاقة المكتبة؟'
    note: '*Do you have your library card?* تعني «هل معك بطاقة المكتبة؟»'
  en.a1.unit48.lesson03.teach.dialogue_line5:
    title: "إجابة Leila"
    gloss: 'تقول Leila: نعم، تفضّلي.'
    note: '*here it is* تعني «تفضّل» أو «ها هي».'
  en.a1.unit48.lesson03.teach.dialogue_line6:
    title: شرح أمينة المكتبة
    gloss: 'تقول أمينة المكتبة: ممتاز. موعد إعادة هذا الكتاب الجديد بعد ثلاثة أسابيع.'
    note: '*due back in three weeks* تعني «يجب إعادته بعد ثلاثة أسابيع».'
  en.a1.unit48.lesson03.teach.dialogue_line7:
    title: Daniel يريد الاستعارة أيضًا
    gloss: 'يقول Daniel: هل يمكنني الحصول على بطاقة مكتبة أيضًا؟ أود أن أستعير كتاب طبخ.'
    note: '*Can I get ... too?* تعني «هل يمكنني الحصول على ... أيضًا؟»'
  en.a1.unit48.lesson03.teach.dialogue_line8:
    title: أمينة المكتبة تساعد Daniel
    gloss: 'تقول أمينة المكتبة: بالطبع! فقط املأ هذا النموذج.'
    note: '*fill out this form* تعني «املأ هذا النموذج»، ويأتي حرف out بعد الفعل fill.'
  en.a1.unit48.lesson04.teach.reading_passage:
    title: نص عن عمل المكتبة
    gloss: 'زيارة المكتبة: تتيح لك معظم المكتبات استعارة الكتب، وأحيانًا أغراض أخرى، لبضعة أسابيع في كل مرة. وتحتاج عادةً إلى بطاقة مكتبة لتستعير أي شيء. وعندما تستعير كتابًا، تخبرك أمينة المكتبة بموعد الإعادة، أي اليوم الذي يجب أن تعيده فيه. وإذا لم تنهِه بحلول ذلك الوقت، يمكنك غالبًا أن تطلب منها مهلة أطول. منذ أن انتقلت Leila إلى شقتها الجديدة، لم يعد لديها من الكتب ما كان لديها من قبل، فبدأت تستعيرها من المكتبة بدلًا من ذلك. في الأسبوع الماضي أعادت كتابًا وأخذت كتابًا جديدًا، وجاء معها صديقها Daniel. لم يكن قد استعار كتابًا من مكتبة من قبل، فحصل على بطاقة مكتبة خاصة به واستعار كتاب طبخ ليساعده على التدرب على الوصفات التي تعلّمها له Mia. وذكّرتهما أمينة المكتبة بأن يعيدا كتابيهما قبل موعد الإعادة. لا تزور Mia المكتبة كثيرًا، لكنها استعارت ذات مرة كتابًا عن التصوير لدورتها.'
    note: '*checked out a cookbook* تعني «استعار كتاب طبخ»، و*check out* هي العبارة الشائعة للاستعارة من المكتبة.'
