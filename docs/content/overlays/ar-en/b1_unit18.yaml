    note: '*definitely* تدل على أنك متأكد تمامًا من أن شيئًا سيحدث.'
    example_gloss: سينهي دانيال التقرير اليوم بالتأكيد.
  en.b1.unit18.lesson01.teach.probably:
    title: probably
    gloss: على الأرجح
    note: '*probably* تدل على أنك متأكد إلى حد كبير، لكن ليس تمامًا.'
