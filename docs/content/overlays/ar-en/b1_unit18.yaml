    note: '*I am meeting Leila for lunch on Friday* تستعمل المضارع المستمر (present continuous) لترتيب مؤكد في وقت محدد اتُّفق عليه مسبقًا.'
  en.b1.unit18.lesson02.teach.going_to_start_project:
    title: I am going to + Verb (Absicht)
    gloss: سأبدأ مشروعًا جديدًا مع فريق التصميم.
    note: '*I am going to start a new project* تستعمل *going to* لقرار اتُّخذ بالفعل دون وقت محدد.'
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions:
    title: Feste Vereinbarungen und Absichten
    gloss: 'استخدم المضارع المستمر (present continuous) في I am meeting Leila on Friday لترتيب مؤكد: أي وقت محدد اتُّفق عليه مسبقًا مع شخص آخر. واستخدم going to في I am going to start a new project لنيّة أو قرار اتخذته بالفعل، حتى لو لم تحدد له وقتًا بعد. في العربية يكفي الفعل المضارع غالبًا للتعبير عن الحالتين، أما في الإنجليزية فعليك أن تختار الصيغة المناسبة.'
    note: 'الصيغة: اختر بين present continuous لترتيب مؤكد وgoing to لنيّة.'
  en.b1.unit18.lesson03.teach.on_time:
    title: on time
    gloss: في الوقت المحدد
    note: '*on time* تعني في الساعة أو التاريخ المخطط له تمامًا.'
    example_gloss: يعتقد دانيال أن المشروع سينتهي في الوقت المحدد.
  en.b1.unit18.lesson03.teach.confident:
    title: confident
    gloss: واثق
    note: '*confident* تعني الشعور بالثقة بأن الأمور ستسير على ما يرام.'
    example_gloss: دانيال واثق من المشروع الجديد.
  en.b1.unit18.lesson03.teach.reading_passage:
    title: 'Lesetext: Daniels Pläne für nächsten Monat'
    gloss: سيبدأ دانيال مشروعًا جديدًا مع فريق التصميم الشهر القادم. وسيلتقي بهم صباح الجمعة للتخطيط للخطوات الأولى. دانيال واثق من المشروع، لكنه ليس متأكدًا تمامًا من أنه سينتهي في الوقت المحدد. ويتوقع أن يستغرق على الأرجح نحو شهرين. وقد يطلب من ليلى الانضمام إلى الفريق لأن لديها خبرة مفيدة في التصميم. وإذا وافقت، فسيتقدم المشروع بالتأكيد بوتيرة أسرع.
    note: نص قصير عن الخطط والتوقعات.
  en.b1.unit18.lesson04.teach.q_plans_next_month:
    title: Mia fragt nach Daniels Plänen
    gloss: 'تقول ميا: دانيال، ما خططك للشهر القادم؟'
    note: سؤال مفتوح لبدء المحادثة.
  en.b1.unit18.lesson04.teach.a_going_to_start:
    title: Daniel nennt sein Vorhaben
    gloss: 'يقول دانيال: سأبدأ مشروعًا جديدًا مع فريق التصميم.'
    note: '*going to* تدل على قرار اتُّخذ بالفعل.'
  en.b1.unit18.lesson04.teach.q_meeting_this_week:
    title: Mia fragt weiter
    gloss: 'تقول ميا: يبدو هذا مثيرًا. هل ستلتقي بهم هذا الأسبوع؟'
    note: سؤال متابعة عن ترتيب مؤكد.
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning:
    title: Daniel bestätigt die feste Vereinbarung
    gloss: 'يقول دانيال: نعم، سألتقي بهم صباح الجمعة.'
    note: '*I am meeting... on Friday morning* هي المضارع المستمر (present continuous) لترتيب مؤكد.'
  en.b1.unit18.lesson04.teach.q_finish_on_time:
    title: Mia fragt nach dem Termin
    gloss: 'تقول ميا: هل تعتقد أن المشروع سينتهي في الوقت المحدد؟'
    note: سؤال عن توقّع.
  en.b1.unit18.lesson04.teach.a_probably_two_months:
    title: Daniel gibt eine Vorhersage ab
    gloss: 'يقول دانيال: لست متأكدًا، لكنه سيستغرق على الأرجح نحو شهرين.'
    note: '*probably* تدل على ثقة كبيرة لكن غير كاملة.'
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well:
    title: Mia ist optimistisch
