  en.b1.unit05.lesson04.teach.a_of_course_what_help:
    title: ميا توافق
    gloss: 'تقول ميا: بالطبع. في ماذا تحتاج إلى مساعدة؟'
    note: '*of course* طريقة ودّية ومباشرة لقول نعم.'
  en.b1.unit05.lesson04.teach.q_make_sure_numbers:
    title: دانيال يشرح ما يحتاج إليه
    gloss: 'يقول دانيال: أريد أن أتأكد من أن الأرقام صحيحة.'
    note: '*make sure* تعني أن تتحقق من أن الشيء صحيح.'
  en.b1.unit05.lesson04.teach.a_check_this_afternoon:
    title: ميا تعد بمراجعته
    gloss: 'تقول ميا: لا مشكلة. سأراجعه بعد الظهر وأرسل لك ملاحظاتي.'
    note: '*I''ll check it this afternoon* وعد محدد بوقت معيّن.'
  en.b1.unit05.lesson04.teach.q_thank_you_appreciate:
    title: دانيال يشكر ميا
    gloss: 'يقول دانيال: شكرًا، أقدّر ذلك حقًّا.'
    note: '*I really appreciate it* طريقة صادقة للتعبير عن الامتنان.'
