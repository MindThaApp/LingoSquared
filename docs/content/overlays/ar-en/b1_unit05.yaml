  en.b1.unit05.lesson03.teach.reading_passage:
    title: 'نص للقراءة: تقرير دانيال الأسبوعي'
    gloss: دانيال مسؤول عن تقرير المبيعات الشهري. وفي كل أسبوع يعطي فريقه تحديثًا قصيرًا. هذا الأسبوع هو متأخر قليلًا عن الجدول بسبب مشكلة تقنية، لكنه يتوقع أن ينتهي يوم الجمعة. وهو يصارح فريقه دائمًا بحقيقة التأخيرات.
    note: نص قصير للقراءة عن صراحة دانيال في الحديث عن تأخير.
