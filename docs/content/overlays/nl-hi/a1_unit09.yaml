teaching:
  hi.a1.unit09.lesson01.teach.review_places:
    title: 'Herhaling: plaatsen'
    gloss: bank, school, ziekenhuis, park, station, postkantoor
    note: Een korte herhaling van de plaatswoorden uit de vorige unit. Die gebruik je in deze unit veel.
    example_gloss:
    - De bank is hier.
    - Het postkantoor is vlak bij de bank.
  hi.a1.unit09.lesson01.teach.review_function_words:
    title: 'Herhaling: is, waar, hier, daar, van, van, oké'
    gloss: is, waar, hier, daar, van/vanaf, van, oké
    note: Een korte herhaling van kleine functiewoorden uit eerdere units, die in de oefeningen van deze unit terugkomen.
    example_gloss:
    - Waar is de bank?
    - Het park is daar.
  hi.a1.unit09.lesson01.teach.seedhe_baaen_daaen:
    title: Rechtdoor, links, rechts
    gloss: rechtdoor, links, rechts
    note: De drie belangrijkste richtingwoorden van deze unit.
    example_gloss:
    - Ga rechtdoor.
    - Ga linksaf.
  hi.a1.unit09.lesson01.teach.jao_muro:
    title: Ga!, sla af!
    gloss: ga!, sla af! (informele gebiedende wijs)
    note: 'Bevelen in de tum-vorm: het natuurlijke register als twee vrienden elkaar de weg wijzen.'
    example_gloss:
    - Ga rechtdoor.
    - Sla rechtsaf.
  hi.a1.unit09.lesson01.teach.yahan_se_seedhe_jao:
    title: Ga vanaf hier rechtdoor
    gloss: Ga vanaf hier rechtdoor.
    note: Combineert de nieuwe woorden van deze les met 'yahaan se' (vanaf hier).
  hi.a1.unit09.lesson01.teach.baaen_muro_phrase:
    title: Linksaf
    gloss: Slaat u linksaf.
    note: Een losse opdracht die je zo kunt gebruiken.
  hi.a1.unit09.lesson01.teach.daaen_muro_phrase:
    title: Rechtsaf
    gloss: Slaat u rechtsaf.
    note: Het spiegelbeeld van 'baaen muro'.
  hi.a1.unit09.lesson01.teach.imperative_note:
    title: De bevelsuitgang -o
    gloss: '''Jaao'' en ''muro'' zijn bevelen in de tum-vorm, net als ''bataao'' en ''gino''. Ze eindigen allemaal op ''-o''.'
    note: Wijst op het gedeelde patroon van informele bevelen, met twee woorden uit eerdere units (bataao in unit 7, gino in unit 2).
  hi.a1.unit09.lesson02.teach.bank_kaise_jaun:
    title: Hoe kom ik bij de bank?
    gloss: Hoe kom ik bij de bank?
    note: 'De kernvraag om de weg te vragen, in de eerste persoon: ''zal ik gaan''.'
  hi.a1.unit09.lesson02.teach.tak:
    title: Tot / tot aan
    gloss: tot / tot aan
    note: Kwam al voor in unit 2 bij het tellen ('zero se das tak'); hier gebruikt in de even gewone betekenis van plaats.
    example_gloss: Ga rechtdoor tot aan de bank.
  hi.a1.unit09.lesson02.teach.bank_tak_seedhe_jao:
    title: Ga rechtdoor tot aan de bank
    gloss: Ga rechtdoor tot aan de bank.
    note: Een voorbeeldzin met 'tak' in de betekenis van plaats.
  hi.a1.unit09.lesson02.teach.pahle_phir:
    title: Eerst, dan
    gloss: eerst, dan
    note: Een woordenpaar om twee stappen van een routebeschrijving op volgorde te zetten.
    example_gloss:
    - Ga eerst rechtdoor.
    - Sla dan linksaf.
  hi.a1.unit09.lesson02.teach.pahle_seedhe_phir_baaen:
    title: Eerst rechtdoor, dan links
    gloss: Ga eerst rechtdoor en sla dan linksaf.
    note: Combineert 'pahle' en 'phir' in één instructie met twee stappen.
  hi.a1.unit09.lesson02.teach.pahle_phir_note:
    title: Pahle en phir
    gloss: '''Pahle'' en ''phir'' verbinden twee stappen: de eerste handeling staat bij ''pahle'', de tweede bij ''phir'', zoals in ''pahle seedhe jaao, phir baaen muro.'''
    note: Een nuttig grammaticapunt over hoe je een routebeschrijving met meerdere stappen opbouwt.
  hi.a1.unit09.lesson03.teach.nukkad:
    title: Straathoek
    gloss: straathoek
    note: Een nieuw plaatswoord voor de slotdialoog van deze les, gebruikt met 'par' (op/aan).
    example_gloss:
    - De bank is op de hoek.
    - Het park is achter de school.
  hi.a1.unit09.lesson03.teach.bas:
    title: Maar / slechts
    gloss: maar / slechts
    note: Ook een gangbaar leenwoord voor 'bus' (het voertuig), maar die betekenis komt in deze cursus niet aan bod, dus er is geen verwarring mogelijk.
    example_gloss: Ga nog maar een klein stukje verder.
  hi.a1.unit09.lesson03.teach.samajh_gaya:
    title: Begrepen / snap ik
    gloss: begrepen / snap ik
    note: 'Een veelgebruikte uitdrukking van twee woorden: ''samajh'' (de stam van ''samajhna'', begrijpen) plus ''gaya'' (ging), dat aangeeft dat de handeling voltooid is. Dit is de mannelijke vorm; Priya zou ''samajh gayi'' zeggen.'
    example_gloss: Ik heb het begrepen. / Ik snap het.
  hi.a1.unit09.lesson03.teach.accha_bahut_shukriya:
    title: Oké! Hartelijk bedankt!
    gloss: Oké! Hartelijk bedankt!
    note: Gebruikt 'accha', 'bahut' en 'shukriya' uit eerdere units opnieuw.
  hi.a1.unit09.lesson03.teach.koi_baat_nahin_phir_milenge:
    title: Geen probleem! Tot ziens.
    gloss: Geen probleem! Tot ziens.
    note: De vaste afsluitende zin van deze cursus, letterlijk overgenomen uit unit 8.
  hi.a1.unit09.lesson03.teach.dialogue.line01:
    title: Arjun vraagt naar het postkantoor
    gloss: Arjun vraagt Priya hoe hij bij het postkantoor komt.
    note: Gebruikt het openingsvraagpatroon van les 2 opnieuw.
  hi.a1.unit09.lesson03.teach.dialogue.line02:
    title: Priya begint met de routebeschrijving
    gloss: 'Priya zegt: ga vanaf hier eerst rechtdoor.'
    note: Gebruikt 'yahaan se' en 'pahle' uit eerdere delen van deze unit opnieuw.
  hi.a1.unit09.lesson03.teach.dialogue.line03:
    title: Arjun vraagt hoe het verder gaat
    gloss: Arjun zegt oké en vraagt wat daarna komt.
  hi.a1.unit09.lesson03.teach.dialogue.line04:
    title: Priya gaat verder
    gloss: 'Priya zegt: sla dan op de hoek van de bank linksaf.'
    note: Introduceert 'nukkad' (straathoek) in een context.
  hi.a1.unit09.lesson03.teach.dialogue.line05:
    title: Arjun bevestigt en vraagt verder
    gloss: Arjun herhaalt 'links', zegt dat het oké is en vraagt wat daarna komt.
  hi.a1.unit09.lesson03.teach.dialogue.line06:
    title: Priya rondt de eerste route af
    gloss: 'Priya zegt: ga nog maar een klein stukje verder. Het postkantoor is daar, vlak bij de bank.'
    note: Introduceert 'bas' (maar/slechts) en sluit aan bij het feit uit unit 8 dat het postkantoor vlak bij de bank is.
  hi.a1.unit09.lesson03.teach.dialogue.line07:
    title: Arjun snapt het en vraagt naar het park
    gloss: Arjun zegt dat hij het begrepen heeft en vraagt hoe hij bij het park komt.
    note: Introduceert de uitdrukking 'samajh gaya'.
  hi.a1.unit09.lesson03.teach.dialogue.line08:
    title: Priya geeft de tweede route
    gloss: 'Priya zegt: het park? Ga eerst rechtdoor en sla dan rechtsaf. Het park is achter de school.'
    note: Sluit aan bij het feit uit unit 8 dat het park achter de school ligt.
  hi.a1.unit09.lesson03.teach.dialogue.line09:
    title: Arjun bedankt Priya
    gloss: Arjun zegt dat hij het begrepen heeft en bedankt Priya hartelijk.
  hi.a1.unit09.lesson03.teach.dialogue.line10:
    title: Priya sluit af
    gloss: 'Priya zegt: geen probleem, tot ziens.'
    note: Dezelfde slotzin als in de dialoog van unit 8, letterlijk overgenomen.
