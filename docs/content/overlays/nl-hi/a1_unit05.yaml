teaching:
  hi.a1.unit05.lesson01.teach.parivar:
    title: Familie
    gloss: familie
    note: Het algemene woord voor familie, dat je in deze hele unit tegenkomt.
    example_gloss: Mijn familie woont in India.
  hi.a1.unit05.lesson01.teach.pita_maa:
    title: Vader, moeder
    gloss: vader, moeder
    note: Bij beide woorden gebruik je de respectvolle meervoudsvorm *hain* in plaats van *hai* als je ze voorstelt, en *pita* krijgt *mere* in plaats van *mera* -- zie de opmerking over eerbied later in deze les.
    example_gloss:
    - Dit is mijn vader.
    - Dit is mijn moeder.
  hi.a1.unit05.lesson01.teach.bhai_behan:
    title: Broer, zus
    gloss: broer, zus
    note: 'Het kernpaar van deze unit voor het verschil tussen mera en meri: *mera bhai*, *meri behan*.'
    example_gloss:
    - Ik heb een broer.
    - Ik heb een zus.
  hi.a1.unit05.lesson01.teach.ek_as_article:
    title: Ek als 'een'
    gloss: '*Ek* betekent ''één'' bij het tellen en werkt ook als ''een'': *mera ek bhai hai*.'
    note: Hetzelfde woord als het getal 1 dat je al kent -- het Hindi heeft geen apart onbepaald lidwoord.
  hi.a1.unit05.lesson01.teach.mata_pita:
    title: Ouders
    gloss: ouders
    note: Een samenstelling van *mata* (moeder, formeel) en *pita* (vader) -- het standaardwoord voor 'ouders'.
    example_gloss: Mijn ouders wonen in Delhi.
  hi.a1.unit05.lesson01.teach.mera_meri_note:
    title: Mera of meri
    gloss: '*Mera* gebruik je bij mannelijke woorden, *meri* bij vrouwelijke woorden: *mera bhai*, *meri behan*.'
    note: Het kernpunt van deze unit -- het bezittelijk voornaamwoord richt zich naar de persoon of zaak die bezeten wordt, niet naar de spreker.
  hi.a1.unit05.lesson01.teach.mere_honorific_note:
    title: Mere voor gerespecteerde ouderen
    gloss: 'Uit respect voor ouderen wordt *mera* tot *mere* en *hai* tot *hain*, zelfs bij één persoon: *yeh mere pita hain* (Dit is mijn vader).'
    note: Een echte, bestaande regel, geen fout -- gerespecteerde oudere familieleden in het enkelvoud (vader, grootvader) krijgen deze vorm die op een meervoud lijkt. Moeders en grootmoeders houden *meri*, maar het werkwoord staat om dezelfde reden toch in het meervoud (*hain*).
  hi.a1.unit05.lesson01.teach.yah_mera_bhai_hai:
    title: Dit is mijn broer
    gloss: Dit is mijn broer.
    note: De eenvoudige mannelijke vorm -- voor een broer is geen eerbiedsvorm nodig.
  hi.a1.unit05.lesson01.teach.yah_meri_behan_hai:
    title: Dit is mijn zus
    gloss: Dit is mijn zus.
    note: De eenvoudige vrouwelijke vorm, passend bij *behan*.
  hi.a1.unit05.lesson01.teach.yah_kaun_hai:
    title: Wie is dit?
    gloss: Wie is dit?
    note: Een simpele, nuttige vraag om familieleden voor te stellen.
  hi.a1.unit05.lesson02.teach.dada_dadi:
    title: Opa en oma van vaderskant
    gloss: opa van vaderskant, oma van vaderskant
    note: Specifiek de ouders van je vader -- zie de opmerking later in deze les waarin deze woorden worden vergeleken met de ouders van je moeder.
    example_gloss:
    - Mijn opa woont in Delhi.
    - Mijn oma woont in Delhi.
  hi.a1.unit05.lesson02.teach.nana_nani:
    title: Opa en oma van moederskant
    gloss: opa van moederskant, oma van moederskant
    note: De ouders van je moeder -- het Hindi gebruikt een heel ander woordenpaar dan voor de ouders van je vader.
    example_gloss:
    - Mijn opa (van moederskant) woont in Mumbai.
    - Mijn oma (van moederskant) woont in Mumbai.
  hi.a1.unit05.lesson02.teach.dilli_mumbai:
    title: Delhi, Mumbai
    gloss: Delhi, Mumbai
    note: Twee grote Indiase steden, gebruikt in de voorbeelden in deze les over waar familieleden wonen.
    example_gloss:
    - Mijn familie woont in Delhi.
    - Mijn broer woont in Mumbai.
  hi.a1.unit05.lesson02.teach.dada_nana_note:
    title: Twee paar grootouders
    gloss: 'De ouders van je vader: *dada-dadi*. De ouders van je moeder: *nana-nani*.'
    note: In het Nederlands zeg je voor beide kanten van de familie gewoon 'opa' en 'oma', maar het Hindi heeft volledig aparte woorden, afhankelijk van de kant van de familie.
  hi.a1.unit05.lesson02.teach.rehna_verb:
    title: Woont (rehna)
    gloss: woont (mannelijk / vrouwelijk / eerbiedig meervoud)
    note: 'Het werkwoord voor ''wonen'': *rehta hai* bij een man, *rehti hai* bij een vrouw, *rehte hain* bij meer dan één persoon of een gerespecteerde oudere.'
    example_gloss:
    - Mijn broer woont in Delhi.
    - Mijn zus woont in Mumbai.
    - Mijn grootouders wonen in Delhi.
  hi.a1.unit05.lesson02.teach.tumhara_tumhari:
    title: Jouw (informeel)
    gloss: jouw (informeel, mannelijk / vrouwelijk)
    note: Het bezittelijk voornaamwoord uit het informele *tum*-register, dat zich net als *mera/meri* naar het bezeten woord richt.
    example_gloss:
    - Waar woont jouw broer?
    - Waar woont jouw zus?
  hi.a1.unit05.lesson02.teach.mera_tumhara_note:
    title: Mera en tumhara samen
    gloss: '*Mera* en *tumhara* horen allebei bij mannelijke woorden; *meri* en *tumhari* horen allebei bij vrouwelijke woorden: *mera bhai*/*tumhara bhai*, *meri behan*/*tumhari behan*.'
    note: Hetzelfde patroon van overeenstemming uit de eerste les, dat nu ook voor *tumhara* blijkt te gelden.
  hi.a1.unit05.lesson03.teach.bada_badi:
    title: Ouder / groot
    gloss: ouder, groot (mannelijk / vrouwelijk)
    note: Het Hindi geeft een oudere broer of zus aan met dit bijvoeglijk naamwoord, dat zich naar het geslacht richt, in plaats van met een apart woord.
    example_gloss:
    - Mijn grote broer woont in Delhi.
    - Mijn grote zus woont in Mumbai.
  hi.a1.unit05.lesson03.teach.chota_choti:
    title: Jonger / klein
    gloss: jonger, klein (mannelijk / vrouwelijk)
    note: Het tegenovergestelde van *bada/badi*, voor een jongere broer of zus.
    example_gloss:
    - Mijn kleine broer is op dit moment student.
    - Mijn kleine zus is op dit moment student.
  hi.a1.unit05.lesson03.teach.bada_chota_note:
    title: Overeenstemming bij bada/chota
    gloss: '*Bada* en *chota* gebruik je bij mannelijke woorden, *badi* en *choti* bij vrouwelijke woorden: *bada bhai*, *badi behan*.'
    note: Dezelfde overeenstemming van het bijvoeglijk naamwoord met mannelijk en vrouwelijk als bij *mera/meri*, nu toegepast op woorden voor leeftijd.
  hi.a1.unit05.lesson03.teach.aur_lekin_bhi:
    title: En, maar, ook
    gloss: en, maar, ook
    note: Drie basale verbindingswoorden, die je terugziet in de slotdialoog van deze les.
    example_gloss:
    - Mijn broer en mijn zus wonen in Delhi.
    - Mijn broer woont in Delhi, maar mijn zus woont in Mumbai.
    - Ik heb ook een zus.
  hi.a1.unit05.lesson03.teach.accha_phir_milenge:
    title: Oké, tot de volgende keer
    gloss: Oké! Tot de volgende keer.
    note: Een vriendelijke afsluiting, uit de afscheidswoorden van unit 2.
  hi.a1.unit05.lesson03.teach.theek_hai_phir_milte_hain:
    title: Prima, tot snel
    gloss: Prima, tot snel!
    note: Het informele antwoord op de afsluiting hierboven, passend bij de slotgesprekjes van eerdere units.
  hi.a1.unit05.lesson03.teach.dialogue.line01:
    title: Arjun vraagt naar Priya's familie
    gloss: Arjun vraagt waar Priya's familie woont.
    note: Gebruikt het patroon *parivar kahan rehta hai* uit deze unit.
  hi.a1.unit05.lesson03.teach.dialogue.line02:
    title: Priya vertelt over haar ouders en broer
    gloss: Priya zegt dat haar ouders in Delhi wonen en dat ze ook een grote broer heeft.
    note: Combineert *mata-pita*, *rehte hain* en *bada bhai bhi hai*.
  hi.a1.unit05.lesson03.teach.dialogue.line03:
    title: Arjun vraagt naar haar grootouders
    gloss: 'Arjun zegt ''o, ik snap het'' en vraagt: en jouw grootouders?'
    note: '*Tumhare* is de respectvolle vorm van *tumhara* voor ouderen, precies zoals *mere* bij *mera* (zie de opmerking over eerbied in les 1).'
  hi.a1.unit05.lesson03.teach.dialogue.line04:
    title: Priya vertelt over beide paren grootouders
    gloss: Priya zegt dat haar grootouders van vaderskant in Delhi wonen, maar haar grootouders van moederskant in Mumbai.
    note: Gebruikt *lekin* om de steden van de twee paren grootouders tegenover elkaar te zetten, wat het verschil tussen dada-dadi en nana-nani uit les 2 versterkt.
  hi.a1.unit05.lesson03.teach.dialogue.line05:
    title: Arjun vertelt over zijn eigen zus
    gloss: Arjun zegt dat hij ook een kleine zus heeft.
    note: Gebruikt *bhi* en *choti behan* opnieuw.
  hi.a1.unit05.lesson03.teach.dialogue.line06:
    title: Priya sluit het gesprek af
    gloss: 'Priya zegt: fijn, tot de volgende keer.'
    note: Gebruikt de afsluitende zin van deze les.
  hi.a1.unit05.lesson03.teach.dialogue.line07:
    title: Arjun antwoordt
    gloss: 'Arjun stemt in en zegt: tot snel.'
    note: Gebruikt de antwoordzin van deze les.
