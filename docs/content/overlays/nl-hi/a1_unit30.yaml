teaching:
  hi.a1.unit30.lesson01.teach.parhna_kasrat_karna:
    title: Lezen, sporten, koken
    gloss: lezen, sporten, koken
    note: 'Het Hindi noemt hobby''s met een werkwoord op *-ना*: *पढ़ना*, *कसरत करना* en *खाना बनाना* (''lezen'', ''sporten'', ''koken'').'
    example_gloss:
    - Ik lees graag een boek.
    - Ik sport op zaterdag.
    - Ik kook graag voor vrienden.
  hi.a1.unit30.lesson01.teach.khalee_samay:
    title: Vrije tijd
    gloss: vrije tijd
    note: '*खाली समय* (''lege tijd'') is de sleutelzin om over hobby''s te praten, en *में* geeft ''in'': *खाली समय में*.'
    example_gloss: In mijn vrije tijd lees ik graag.
  hi.a1.unit30.lesson01.teach.mujhe_khalee_samay:
    title: Zeggen wat je in je vrije tijd doet
    gloss: In mijn vrije tijd lees ik graag.
    note: '*मुझे ... पढ़ना पसंद है* (''mij is lezen aangenaam'') is hoe het Hindi ''ik lees graag'' zegt; *मुझे* geeft aan wie het leuk vindt.'
  hi.a1.unit30.lesson02.teach.sangeet_sunna_chitr:
    title: Muziek, tekenen, gamen
    gloss: naar muziek luisteren, tekenen, gamen
    note: 'Nog drie hobby''s: *संगीत सुनना*, *चित्र बनाना* en *गेम खेलना*; *गेम* is een leenwoord uit het Engels, net als ''game'' in het Nederlands.'
    example_gloss:
    - Ik luister graag naar muziek.
    - Ik teken vaak.
    - Ik game graag met vrienden.
  hi.a1.unit30.lesson02.teach.mujhe_sangeet_sunna:
    title: Zeggen dat je graag naar muziek luistert
    gloss: Ik luister graag naar muziek.
    note: 'Bij *संगीत सुनना* (''muziek horen'') is geen extra woord nodig: het object staat direct voor het werkwoord.'
  hi.a1.unit30.lesson02.teach.mujhe_doston_ke:
    title: Zeggen dat je graag met vrienden gamet
    gloss: Ik game graag met vrienden.
    note: '*दोस्तों के साथ* (''met vrienden'') zet *दोस्त* in de meervoudige indirecte naamval (*दोस्तों*) omdat het voor *के साथ* staat.'
  hi.a1.unit30.lesson03.teach.hamesha_aksar_kabheekbhee:
    title: Altijd, vaak, soms, nooit
    gloss: altijd, vaak, soms, nooit
    note: Frequentiewoorden zoals *हमेशा*, *अक्सर*, *कभी-कभी* en *कभी नहीं* staan meestal voor het werkwoord, en *कभी नहीं* betekent 'nooit'.
    example_gloss:
    - Ik sport altijd op zaterdag.
    - Ik lees vaak een boek.
    - Ik teken soms.
    - Ik game nooit.
  hi.a1.unit30.lesson03.teach.har_hafte_har:
    title: Elke week, elk weekend
    gloss: elke week, elk weekend
    note: '*हर* (''elke'') verandert nooit, en het tijdwoord erna blijft in de basisvorm: *हर हफ़्ते*, *हर वीकेंड*.'
    example_gloss:
    - Ik kook elke week voor vrienden.
    - Ik sport elk weekend.
  hi.a1.unit30.lesson03.teach.har_hafte_har_2:
    title: हर blijft hetzelfde
    gloss: Elke week, elk weekend.
    note: '*हर* blijft hetzelfde, welk zelfstandig naamwoord er ook op volgt. Je hoeft dus geen vorm te kiezen: *हर हफ़्ते*, *हर वीकेंड*.'
  hi.a1.unit30.lesson03.teach.tum_khalee_samay:
    title: Vragen naar vrije tijd
    gloss: Wat doe je in je vrije tijd?
    note: 'Dit is de kernvraag van deze unit: gebruik hem om iedereen naar zijn of haar hobby''s te vragen.'
  hi.a1.unit30.lesson04.teach.priya_ham_aksar:
    title: Priya begint over hobby's
    gloss: 'Priya: We wandelen vaak samen. Maar wat doe je nog meer in je vrije tijd, Arjun?'
    note: '*टहलते हैं* staat in het meervoud, omdat *हम* (''wij'') het onderwerp is. *अक्सर* staat vóór het werkwoord.'
  hi.a1.unit30.lesson04.teach.arjun_mujhe_khana:
    title: Arjuns hobby's
    gloss: 'Arjun: Ik kook graag, ook thuis. En ik sport vaak.'
    note: '*घर पर भी* (''ook thuis'') laat zien dat Arjun voor zijn plezier kookt, niet alleen op zijn werk.'
  hi.a1.unit30.lesson04.teach.priya_tum_ghar:
    title: Priya is verrast
    gloss: 'Priya: Kook je ook thuis? Je kookt toch al de hele dag op je werk!'
    note: '*पूरा दिन* (''de hele dag'') benadrukt hoeveel hij op zijn werk al kookt, en *तो* geeft extra nadruk.'
  hi.a1.unit30.lesson04.teach.arjun_han_lekin:
    title: Arjun legt uit
    gloss: 'Arjun: Ja, maar van koken word ik rustig. En jij, wat doe jij graag?'
    note: '*खाना बनाने से सुकून मिलता है* betekent ''van koken word ik rustig'' (letterlijk: ''van het koken wordt rust ontvangen''). *बनाना* wordt *बनाने* vóór *से*.'
  hi.a1.unit30.lesson04.teach.priya_mujhe_parhna:
    title: Priya's hobby's
    gloss: 'Priya: Ik lees graag en ik luister vaak naar muziek.'
    note: '*और* (''en'') verbindt twee hobby''s, en *सुनती हूँ* is vrouwelijk omdat Priya aan het woord is.'
  hi.a1.unit30.lesson04.teach.arjun_kya_tum:
    title: Arjun vraagt naar gamen
    gloss: 'Arjun: Game jij ook?'
    note: 'Een korte ja/nee-vraag: *क्या* opent de zin, en *खेलती हो* is vrouwelijk omdat Arjun het aan Priya vraagt.'
  hi.a1.unit30.lesson04.teach.priya_naheen_main:
    title: Priya antwoordt
    gloss: 'Priya: Nee, ik game nooit. Maar ik teken soms wel!'
    note: '*कभी ... नहीं* (''nooit'') en *कभी-कभी* (''soms'') staan tegenover elkaar in één antwoord.'
  hi.a1.unit30.lesson05.teach.arjun_aur_main:
    title: Hobby's vergelijken
    gloss: Arjun en ik wandelen vaak samen. Maar we hebben nog meer hobby's. Arjun kookt graag, ook thuis, en hij sport vaak. Ik lees graag en ik luister vaak naar muziek. Ik teken soms, maar ik game nooit. Wat doe jij graag in je vrije tijd?
    note: Priya's bericht herhaalt wat eerder in de les aan bod kwam en eindigt met de kernvraag van deze unit aan de lezer.
    glosses:
      टहलते: wandelen
      अक्सर: vaak
      साथ: samen
      और: andere
      बनाना: maken (koken)
      पसंद: graag
      घर: thuis
      कसरत: sport
      पढ़ना: lees
      सुनती: luister
      संगीत: muziek
      चित्र: afbeelding (tekenen)
      कभी-कभी: soms
      गेम: videogames spelen
      कभी: nooit (met नहीं)
      खाली: vrij
      समय: tijd
  hi.a1.unit30.lesson06.teach.arjun_tum_is:
    title: Arjun vraagt naar het weekend
    gloss: 'Arjun: Wat doe je dit weekend?'
    note: In *इस वीकेंड* ('dit weekend') staat *इस* vóór het zelfstandig naamwoord. *कर रही हो* is de duurvorm 'ben je aan het doen', vrouwelijk omdat Priya wordt aangesproken.
  hi.a1.unit30.lesson06.teach.priya_abhee_pata:
    title: Priya weet het nog niet
    gloss: 'Priya: Dat weet ik nog niet. Ik lees graag, maar ik wil ook naar buiten.'
    note: '*बाहर जाना चाहती हूँ* betekent ''ik wil naar buiten gaan''. *चाहती* is vrouwelijk en staat na *जाना*.'
  hi.a1.unit30.lesson06.teach.arjun_chalo_sath:
    title: Arjun doet een voorstel
    gloss: 'Arjun: Zullen we samen gaan wandelen? Daarna kook ik voor ons.'
    note: '*उसके बाद* (''daarna'') zet de twee plannen op volgorde, en *चलो ... टहलें* stelt het eerste voor.'
  hi.a1.unit30.lesson06.teach.priya_achchha_aidiya:
    title: Priya stemt in
    gloss: 'Priya: Goed idee! Ik houd van wandelen én van koken.'
    note: '*दोनों पसंद हैं* laat zien dat Priya beide even leuk vindt, en het werkwoord *हैं* staat in het meervoud.'
  hi.a1.unit30.lesson06.teach.arjun_barhiya_to:
    title: Arjun bevestigt
    gloss: 'Arjun: Top. Dan zien we elkaar zaterdag!'
    note: '*शनिवार को मिलते हैं* (''we zien elkaar op zaterdag'') gebruikt de tegenwoordige tijd voor een vaste afspraak, en *को* markeert de dag.'
