teaching:
  hi.a1.unit10.lesson01.teach.review_time:
    title: 'Herhaling: uur, ochtend, middag, avond, nacht, om'
    gloss: uur, ochtend, middag, avond, nacht, om / op (algemene tijd)
    note: Een korte herhaling van de tijdwoorden uit les 4 -- die komen in deze les veel terug.
    example_gloss:
    - Het is nu 8 uur 's ochtends.
    - '''s Nachts is er geen les.'
  hi.a1.unit10.lesson01.teach.uthna:
    title: Ik sta op
    gloss: ik sta op (man / vrouw)
    note: Het eerste werkwoord in de gewoontetegenwoordige tijd in deze les -- het breidt het patroon -ta/-tee uit les 5 (rahta hai/rahtee hai) uit naar de eerste persoon, met hoon.
    example_gloss:
    - Ik sta 's ochtends om 7 uur op.
    - Ik sta 's ochtends om 6 uur op.
  hi.a1.unit10.lesson01.teach.roz:
    title: Elke dag
    gloss: elke dag
    note: Een nieuw bijwoord om routines te beschrijven.
    example_gloss: Ik sta elke ochtend op.
  hi.a1.unit10.lesson01.teach.nashta_karna:
    title: Ik ontbijt
    gloss: ik ontbijt (man / vrouw)
    note: '''Nashta'' (ontbijt) wordt gecombineerd met ''karta/kartee hoon'' (ik doe).'
    example_gloss:
    - '''s Ochtends ontbijt ik.'
    - '''s Ochtends ontbijt ik.'
  hi.a1.unit10.lesson01.teach.kaam_par_jaana:
    title: Ik ga naar mijn werk
    gloss: ik ga naar mijn werk (man / vrouw)
    note: '''Kaam par jaana'' (naar het werk gaan) heeft het woord ''par'' (op/bij) nodig -- een vaste uitdrukking, anders dan ''school jaana'' later in deze les, dat geen extra woord nodig heeft.'
    example_gloss:
    - Daarna ga ik naar mijn werk.
    - Daarna ga ik naar mijn werk.
  hi.a1.unit10.lesson01.teach.habitual_paradigm_note:
    title: Het patroon van de gewoontetegenwoordige tijd
    gloss: 'Om een dagelijkse gewoonte te beschrijven krijgt het werkwoord -ta/-tee/-te, en afhankelijk van het onderwerp komt er hoon/ho/hai/hain bij: ik sta op (man/vrouw) ''hoon'', jij staat op ''ho'', hij/zij staat op ''hai'', zij staan op ''hain''.'
    note: Geeft vooraf het hele patroon (al terloops te zien in de dialoog van eenheid 1 en voor de derde persoon uitgewerkt in eenheid 5), zodat de oefeningen in deze les niet vragen om een vorm te raden die nog niet is behandeld.
  hi.a1.unit10.lesson01.teach.full_routine_phrase:
    title: Mijn ochtend, stap voor stap
    gloss: Ik sta elke ochtend om 7 uur op, dan ontbijt ik en daarna ga ik naar mijn werk.
    note: Combineert de drie routinewerkwoorden van deze les in één natuurlijke zin met een volgorde.
  hi.a1.unit10.lesson02.teach.sona:
    title: Ik slaap
    gloss: ik slaap (man / vrouw aan het woord)
    note: Hetzelfde patroon met -ta/-tee + hoon, nu bij een nieuw werkwoord.
    example_gloss:
    - Ik ga 's avonds om 11 uur slapen.
    - Ik ga 's avonds om 10 uur slapen.
  hi.a1.unit10.lesson02.teach.school_jaana:
    title: Ik ga naar school
    gloss: ik ga naar school (man / vrouw aan het woord)
    note: Anders dan bij 'kaam par jaana' heb je bij 'school jaana' geen extra woord voor 'jaana' nodig.
    example_gloss:
    - Ik ga elke ochtend om 8 uur naar school.
    - Ik ga elke ochtend om 8 uur naar school.
  hi.a1.unit10.lesson02.teach.tum_form_note:
    title: 'De tum-vorm: -te/-tee + ho'
    gloss: 'Bij ''tum'' (jij, informeel) krijgt het werkwoord -te/-tee en ''ho'': jij staat op (tegen een man) / jij staat op (tegen een vrouw), jij slaapt (tegen een man) / jij slaapt (tegen een vrouw).'
    note: Het tweede-persoonsdeel van hetzelfde paradigma uit les 1.
  hi.a1.unit10.lesson02.teach.addressee_gender_note:
    title: Met wiens geslacht komt de tum-vorm overeen?
    gloss: 'Het werkwoord in de tum-vorm komt overeen met het geslacht van de persoon die je aanspreekt, niet met dat van de spreker -- als je Priya vraagt: ''Hoe laat sta jij op?'' (vrouwelijke vorm); als je Arjun vraagt: ''Hoe laat sta jij op?'' (mannelijke vorm).'
    note: Een punt dat je makkelijk mist, gecontroleerd aan elke tum-regel in de dialoog van les 3.
  hi.a1.unit10.lesson02.teach.kab_uthte_ho_phrase:
    title: Hoe laat sta jij op?
    gloss: Hoe laat sta jij op? (tegen een man)
    note: Een kant-en-klare vraag met de nieuwe tum-vorm uit deze les.
  hi.a1.unit10.lesson02.teach.pahle_phir_routine:
    title: Eerst sta ik op, dan ontbijt ik
    gloss: Eerst sta ik op, dan ontbijt ik.
    note: Hergebruikt 'pahle'/'phir' (eerst/dan) uit de richtingaanwijzingen van eenheid 9, nu om stappen van een dagroutine te ordenen.
  hi.a1.unit10.lesson02.teach.kaam_idiom_note:
    title: Kaam par versus school
    gloss: Bij 'kaam par jaana' (naar je werk gaan) hoort 'par', maar bij 'school jaana' (naar school gaan) is geen extra woord nodig -- beide zijn correct en gewoon.
    note: Een echt idiomatisch verschil, geen algemene regel met een uitzondering.
  hi.a1.unit10.lesson03.teach.vaapas:
    title: Terug
    gloss: terug
    note: Wordt met 'aana' (komen) gebruikt voor 'terugkomen'.
    example_gloss: Ik ga terug.
  hi.a1.unit10.lesson03.teach.aana:
    title: Ik kom
    gloss: ik kom (man / vrouw aan het woord)
    note: Een nieuw werkwoord met hetzelfde, al bekende patroon voor gewoontes in de tegenwoordige tijd.
    example_gloss:
    - Ik kom 's avonds terug.
    - Ik kom 's avonds terug.
  hi.a1.unit10.lesson03.teach.khana_verb:
    title: Ik eet (eten)
    gloss: ik eet (man / vrouw aan het woord)
    note: '''Khana'' als zelfstandig naamwoord (eten, uit eenheid 6) plus ''khana'' als werkwoord (eten) -- een heel gewone verdubbeling in het Hindi, geen tikfout.'
    example_gloss:
    - Ik eet 's avonds laat.
    - Ik eet 's avonds laat.
  hi.a1.unit10.lesson03.teach.raat_ka_khana:
    title: Avondeten
    gloss: 'avondeten (letterlijk: ''eten van de nacht'')'
    note: Hergebruikt 'raat' (nacht), 'ka' (bezit) en 'khana' (eten), allemaal al behandeld.
    example_gloss: Het avondeten is heel lekker.
  hi.a1.unit10.lesson03.teach.dialogue.line01:
    title: Arjun vraagt hoe laat Priya opstaat
    gloss: Arjun vraagt Priya hoe laat ze elke dag opstaat.
    note: Gebruikt de vrouwelijke tum-vorm, correct gericht aan Priya.
  hi.a1.unit10.lesson03.teach.dialogue.line02:
    title: Priya antwoordt
    gloss: 'Priya zegt: Ik sta elke ochtend om 6 uur op. Daarna ontbijt ik.'
  hi.a1.unit10.lesson03.teach.dialogue.line03:
    title: Arjun vertelt over zijn eigen routine
    gloss: 'Arjun zegt: Leuk! Ik sta om 7 uur op. Ik ontbijt ook en ga dan naar mijn werk.'
  hi.a1.unit10.lesson03.teach.dialogue.line04:
    title: Priya vraagt wanneer Arjun terugkomt
    gloss: Priya vraagt Arjun wanneer hij terugkomt.
    note: Gebruikt de mannelijke tum-vorm, correct gericht aan Arjun. Introduceert 'vaapas aana' in context.
  hi.a1.unit10.lesson03.teach.dialogue.line05:
    title: Arjun beschrijft zijn avond
    gloss: 'Arjun zegt: Ik kom om 6 uur ''s avonds terug. Dan eet ik het avondeten en daarna ga ik slapen.'
  hi.a1.unit10.lesson03.teach.dialogue.line06:
    title: Priya beschrijft haar avond
    gloss: 'Priya zegt: Ik kom ''s avonds ook terug en daarna eet ik.'
  hi.a1.unit10.lesson03.teach.dialogue.line07:
    title: Arjun vraagt hoe laat Priya gaat slapen
    gloss: Arjun vraagt hoe laat Priya gaat slapen.
    note: Weer de vrouwelijke tum-vorm, correct gericht aan Priya.
  hi.a1.unit10.lesson03.teach.dialogue.line08:
    title: Priya antwoordt en sluit af
    gloss: 'Priya zegt: Ik ga ''s avonds om 11 uur slapen. Oké, tot morgen!'
  hi.a1.unit10.lesson03.teach.dialogue.line09:
    title: Arjun sluit af
    gloss: 'Arjun zegt: Oké, tot later!'
