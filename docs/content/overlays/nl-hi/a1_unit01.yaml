answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (हूँ, हाँ, कहाँ vs. मैं, हैं, में, मिलेंगे). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (हूं for हूँ, हां for हाँ) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
  description: Leer in het Hindi groeten, vragen hoe het met iemand gaat, jezelf voorstellen en basisgegevens uitwisselen. Je maakt kennis met het onderscheid tussen aap en tum (een echt grammaticaal verschil, vergelijkbaar met u en je) en met Hindi bijvoeglijke naamwoorden en werkwoordsvormen die zich naar het geslacht richten.
units:
  hi.a1.unit01.greetings:
    title: Namaste en eerste ontmoetingen
lessons:
  hi.a1.unit01.lesson01.aap_and_tum:
    title: 'Aap en tum: vragen hoe het gaat'
  hi.a1.unit01.lesson02.greetings_and_farewells:
    title: Begroetingen en afscheid
  hi.a1.unit01.lesson03.names_origin_and_dialogue:
    title: Namen, herkomst en een eerste ontmoeting bij een yogales
teaching:
  hi.a1.unit01.lesson01.teach.aap:
    title: Formeel/respectvol "u"
    gloss: u (formeel, respectvol)
    note: 'Net als het Nederlands met u en je maakt Hindi een sociale keuze: *aap* gebruik je voor iemand die ouder is, die je niet kent, of in een professionele, respectvolle relatie. Grammaticaal wordt *aap* als meervoud behandeld, ook voor één persoon: werkwoorden bij aap krijgen dezelfde -en/hain-uitgangen als bij "zij" (meervoud).'
  hi.a1.unit01.lesson01.teach.tum:
    title: Informeel 'je'
    gloss: je (informeel, vertrouwd)
    note: '*Tum* gebruik je voor een vriend, leeftijdsgenoot, jongere of familielid: een echt informele relatie, maar nog steeds respectvol (niet hetzelfde als het nog intiemere *tu*, dat deze cursus niet behandelt). *Tum* heeft eigen werkwoordsuitgangen, anders dan bij *aap* en *tu*.'
  hi.a1.unit01.lesson01.teach.aap_kaise_hain:
    title: Formele vraag hoe het gaat, aan een man
    gloss: Hoe gaat het met u? (formeel, aan een man)
    note: '*Kaise* richt zich naar het GESLACHT VAN DE PERSOON DIE JE DE VRAAG STELT, niet naar dat van de spreker. Deze vorm gebruik je tegen een man. In het Nederlands verandert "hoe gaat het" nooit op deze manier.'
  hi.a1.unit01.lesson01.teach.aap_kaisi_hain:
    title: Formele vraag hoe het gaat, aan een vrouw
    gloss: Hoe gaat het met u? (formeel, aan een vrouw)
    note: 'Dezelfde vraag in hetzelfde *aap*-register. Alleen *kaisi* verschilt van *kaise*: het richt zich naar een vrouwelijke gesprekspartner. Het werkwoord *hain* zelf verandert nooit; alleen de vorm van het bijvoeglijk naamwoord.'
  hi.a1.unit01.lesson01.teach.tum_kaise_ho:
    title: Informele vraag naar iemands welzijn
    gloss: Hoe gaat het? (informeel)
    note: Bij *tum* is het werkwoord *ho* en niet *hain*. Vergelijk formeel *Aap kaise/kaisi hain?* met informeel *Tum kaise ho?*. Dit is het duidelijkste minimale paar om het verschil tussen aap en tum in het werkwoord zelf te horen.
  hi.a1.unit01.lesson01.teach.main_theek_hoon:
    title: Een standaardantwoord
    gloss: Het gaat goed, dank je.
    note: '*Theek* ("goed/oké") verandert niet met geslacht of register. Anders dan *kaise/kaisi* blijft het gelijk, wie er ook spreekt of aangesproken wordt.'
  hi.a1.unit01.lesson01.teach.aur_aap:
    title: De formele vraag teruggeven
    gloss: En met u?
    note: Een korte manier om de vraag in het respectvolle aap-register terug te geven.
  hi.a1.unit01.lesson01.teach.aur_tum:
    title: De informele vraag teruggeven
    gloss: En met jou?
    note: Gebruik tum om de vraag terug te geven aan een vriend of leeftijdsgenoot.
  hi.a1.unit01.lesson02.teach.namaste:
    title: Begroeting voor alle gelegenheden
    gloss: hallo; hoi (ook gebruikt als afscheid)
    note: '*Namaste* kun je op elk moment van de dag gebruiken, formeel en informeel, zowel om een gesprek te openen als om het af te sluiten. Het is echt een allroundgroet.'
    example_gloss: Hallo! Hoe gaat het met u?
  hi.a1.unit01.lesson02.teach.namaskar:
    title: Respectvolle groet
    gloss: hallo (formeler en respectvoller dan namaste)
    note: '*Namaskar* betekent in wezen hetzelfde als *namaste*, maar klinkt formeler en respectvoller. Het past bij een oudere, een groot publiek of een professionele setting.'
    example_gloss: Namaskar! En u?
  hi.a1.unit01.lesson02.teach.phir_milenge:
    title: Tot ziens (toekomst)
    gloss: tot ziens; tot later
    note: 'Letterlijk "[we] zullen elkaar weer ontmoeten": een gangbare, neutrale manier om afscheid te nemen als je de ander weer verwacht te zien.'
  hi.a1.unit01.lesson02.teach.alvida:
    title: Formeel afscheid
    gloss: vaarwel; tot ziens
    note: '*Alvida* is een echt, correct Hindi woord voor afscheid, maar klinkt in het dagelijks gebruik definitiever, formeler en zelfs een beetje dramatisch, anders dan *namaste* of *phir milenge*. Het ligt dichter bij "vaarwel" dan bij een informeel "doei".'
    example_gloss: Vaarwel! Tot ziens.
  hi.a1.unit01.lesson02.teach.phir_milte_hain:
    title: Tot gauw (informeel/gewoonte)
    gloss: tot gauw; tot ziens
    note: Letterlijk "[we] ontmoeten elkaar weer", met de voortdurende/gewoontevorm van het werkwoord in plaats van de toekomende tijd. Een iets informeler alledaags alternatief voor *phir milenge*.
  hi.a1.unit01.lesson02.teach.shubh_ratri:
    title: Goedenacht
    gloss: goedenacht
    note: Wordt gezegd als iemand weggaat voor de nacht of naar bed gaat. Net als "welterusten" is dit een afscheid en nooit een openingsgroet, anders dan *namaste*.
  hi.a1.unit01.lesson02.teach.shubh_din:
    title: Beleefde afscheidswens
    gloss: Fijne dag nog.
    note: 'Letterlijk "moge uw dag goed blijven": een beleefde afsluitende wens bij een respectvol afscheid, in formele én informele relaties.'
  hi.a1.unit01.lesson03.teach.aapka_naam_kya_hai:
    title: Formeel naar een naam vragen
    gloss: Hoe heet u? (formeel)
    note: '*Aapka* ("uw") richt zich naar het mannelijke zelfstandig naamwoord *naam* ("naam"). Hindi bezittelijke voornaamwoorden veranderen mee met het bezit, niet met de bezitter. Het Nederlands kent die congruentie niet.'
  hi.a1.unit01.lesson03.teach.tumhara_naam_kya_hai:
    title: Naar een naam vragen, informeel
    gloss: Hoe heet je? (informeel)
    note: Hetzelfde patroon met *tumhara* ("jouw", informeel) in plaats van *aapka*. Vergelijk formeel *Aapka naam kya hai?* met informeel *Tumhara naam kya hai?*.
  hi.a1.unit01.lesson03.teach.mera_naam_priya_hai:
    title: Je naam zeggen
    gloss: Mijn naam is Priya.
    note: '*Mera* ("mijn") richt zich ook naar *naam*, dat mannelijk is. Het heeft dezelfde mannelijke uitgang als *aapka*/*tumhara* hierboven, omdat alle drie hetzelfde zelfstandig naamwoord bepalen.'
  hi.a1.unit01.lesson03.teach.aapse_milkar_khushi_hui:
    title: Blij iemand te ontmoeten, formeel
    gloss: Aangenaam kennis te maken. (formeel)
    note: 'Letterlijk "u ontmoet hebbend, vreugde is geschied": een vaste, veelgebruikte uitdrukking bij een respectvolle eerste ontmoeting.'
  hi.a1.unit01.lesson03.teach.mujhe_bhi:
    title: Hetzelfde terugzeggen
    gloss: Ik ook.
    note: Een kort, natuurlijk antwoord op Aapse milkar khushi hui of Tumse milkar accha laga.
  hi.a1.unit01.lesson03.teach.aap_kahan_se_hain:
    title: Naar de herkomst vragen, formeel
    gloss: Waar komt u vandaan? (formeel)
    note: Kahan betekent "waar"; se betekent "van/uit".
  hi.a1.unit01.lesson03.teach.main_bharat_se_hoon:
    title: Je herkomst noemen
    gloss: Ik kom uit India.
    note: Bharat is de Hindi naam voor India en wordt in het dagelijks leven voortdurend gebruikt.
  hi.a1.unit01.lesson03.teach.tum_kahan_se_ho:
    title: Informeel vragen waar iemand vandaan komt
    gloss: Waar kom je vandaan? (informeel)
    note: 'Dezelfde vraag met *tum* en *ho* in plaats van *aap* en *hain*: hetzelfde formele/informele patroon van werkwoordsuitgangen als in de rest van deze unit.'
  hi.a1.unit01.lesson03.teach.dialogue.line01:
    title: De ontmoeting openen
    gloss: Priya groet Arjun en vraagt of hij hier voor het eerst is.
    note: Beide sprekers gebruiken meteen het informele *tum*, wat logisch is voor twee leeftijdsgenoten die elkaar bij een buurtles ontmoeten. *Tumhari* ("jouw") richt zich naar het vrouwelijke zelfstandig naamwoord *baar* ("keer"), niet naar het geslacht van een van beide sprekers.
  hi.a1.unit01.lesson03.teach.dialogue.line02:
    title: De ontmoeting openen, antwoord
    gloss: Arjun zegt ja, het is zijn eerste keer, en dat hij yoga wil leren.
    note: '*Chahta hoon* ("ik wil") staat hier in de mannelijke vorm omdat Arjun, de spreker, een man is. Dit werkwoord richt zich naar het geslacht van de SPREKER, anders dan *kaisi*/*kaise* eerder, dat zich richtte naar de AANGESPROKEN persoon.'
  hi.a1.unit01.lesson03.teach.dialogue.line03:
    title: Namen uitwisselen
    gloss: Priya zegt "ik ook!", noemt haar naam en vraagt naar die van Arjun.
    note: '*Main bhi!* ("ik ook!") antwoordt op Arjuns *main ... chahta hoon*: als de zin van de ander *main* als onderwerp heeft, is "ik ook" *main bhi*. *Mujhe bhi* is het antwoord op een zin van het type *mujhe*, zoals *Tumse milkar accha laga*. *Mera naam...hai* is de natuurlijke, simpele manier om je naam te zeggen.'
  hi.a1.unit01.lesson03.teach.dialogue.line04:
    title: Namen uitwisselen, antwoord
    gloss: Arjun noemt zijn naam en zegt informeel dat hij het fijn vindt haar te ontmoeten.
    note: '*Tumse milkar accha laga* is de informele tegenhanger van het formele *Aapse milkar khushi hui* uit deze les. Beide betekenen ongeveer "aangenaam kennis te maken", passend bij het register.'
  hi.a1.unit01.lesson03.teach.dialogue.line05:
    title: Naar herkomst vragen
    gloss: Priya zegt hetzelfde terug en vraagt waar Arjun vandaan komt.
    note: Tum kahan se ho vraagt naar de herkomst in het informele register dat je al hebt geleerd.
  hi.a1.unit01.lesson03.teach.dialogue.line06:
    title: Naar herkomst vragen, antwoord
    gloss: Arjun komt uit India maar woont nu in Londen, en stelt dan dezelfde vraag terug.
    note: '*Rahta hoon* ("ik woon") is mannelijk, passend bij Arjun als spreker. Het is hetzelfde patroon als *chahta hoon* in regel 2. *Lekin* ("maar") verbindt het contrast tussen herkomst en huidige woonplaats.'
  hi.a1.unit01.lesson03.teach.dialogue.line07:
    title: Over herkomst en een interesse praten
    gloss: Priya zegt dat ze uit Amerika komt en ook yoga wil leren.
    note: '*Chahti hoon* is de vrouwelijke vorm van hetzelfde werkwoord dat Arjun gebruikte in regel 2 (*chahta hoon*). Beide richten zich naar het geslacht van de eigen spreker, dus je hebt een direct minimaal paar om te vergelijken.'
  hi.a1.unit01.lesson03.teach.dialogue.line08:
    title: Vragen naar de gedeelde activiteit
    gloss: Arjun reageert positief en vraagt of Priya yoga doet.
    note: '*Karti ho* ("doe je") is vrouwelijk, passend bij Priya als de persoon die gevraagd wordt. Net als *kaisi* eerder volgt deze werkwoordsvorm het geslacht van de AANGESPROKEN persoon, niet dat van de spreker.'
  hi.a1.unit01.lesson03.teach.dialogue.line09:
    title: Vragen naar de gedeelde activiteit, antwoord
    gloss: Priya zegt nee, het is haar eerste keer en ze is nog aan het leren.
    note: '*Seekh rahi hoon* ("ik ben aan het leren") gebruikt de vrouwelijke continue vorm, passend bij Priya als spreker. Het is de continue tegenhanger van *chahti hoon*.'
  hi.a1.unit01.lesson03.teach.dialogue.line10:
    title: Het gesprek afsluiten
    gloss: Arjun stemt in met beginnen en zegt dan tot later.
    note: '*Chalo shuru karte hain* ("laten we beginnen") is een vaste, natuurlijke manier om voor te stellen samen ergens aan te beginnen. *Phir milte hain* sluit het gesprek af met het informele afscheid uit les 2.'
