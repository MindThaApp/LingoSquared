teaching:
  hi.a1.unit12.lesson01.teach.vyast_review:
    title: 'Herhaling: druk'
    gloss: bezet
    note: Een korte herhaling van het bijvoeglijk naamwoord uit les 11. In deze les gebruik je het om de nieuwe verleden tijd van het koppelwerkwoord te oefenen.
    example_gloss: Arjun heeft het druk.
  hi.a1.unit12.lesson01.teach.tha_thi:
    title: Was (mannelijk / vrouwelijk)
    gloss: was
    note: De verleden tijd van het koppelwerkwoord (zijn), de tegenhanger van hai/hoon/hain. 'Tha' hoort bij een mannelijk onderwerp, 'thi' bij een vrouwelijk onderwerp.
    example_gloss:
    - Arjun had het gisteren druk.
    - Priya had het gisteren druk.
  hi.a1.unit12.lesson01.teach.tha_thi_grammar:
    title: Tha of thi
    gloss: '''Tha'' hoort bij een mannelijk onderwerp, ''thi'' bij een vrouwelijk onderwerp. Ze staan op de plek van ''hai'', maar veranderen anders dan ''hai'' mee met het geslacht: Arjun heeft het druk, Arjun had het druk, Priya had het druk.'
    note: Benoemt het patroon van overeenstemming in geslacht en breidt het bekende patroon van het koppelwerkwoord uit naar de verleden tijd.
  hi.a1.unit12.lesson01.teach.kal_review:
    title: 'Herhaling: gisteren'
    gloss: gisteren
    note: Eerst behandeld in les 4, waar 'kal' zowel 'morgen' als 'gisteren' bleek te betekenen, wat alleen aan de werkwoordstijd te zien is. In deze les gebruik je voor het eerst de betekenis 'gisteren'.
    example_gloss: Gisteren was het zaterdag.
  hi.a1.unit12.lesson01.teach.kaisa:
    title: Hoe (mannelijk)
    gloss: hoe
    note: 'Dit maakt een rijtje compleet waarvan je al twee vormen kent: ''kaise'' en ''kaisi'' (uit ''hoe gaat het'' in les 1). Nu komt de ontbrekende mannelijke enkelvoudsvorm erbij, die je gebruikt bij onderwerpen als ''din'' (dag).'
    example_gloss: Hoe was de dag?
  hi.a1.unit12.lesson01.teach.kal_kaisa_tha_phrase:
    title: Hoe was gisteren?
    gloss: Hoe was gisteren?
    note: De centrale vraag van deze les, met alle woorden die je tot nu toe in deze les hebt geleerd.
  hi.a1.unit12.lesson01.teach.din_achha_tha_phrase:
    title: De dag was goed.
    gloss: De dag was goed.
    note: Een kant-en-klaar antwoord op 'Hoe was gisteren?', met de mannelijke vorm (din is mannelijk).
  hi.a1.unit12.lesson01.teach.filma_achi_thi:
    title: De film was goed.
    gloss: De film was goed.
    note: Hetzelfde patroon met een vrouwelijk onderwerp (film is vrouwelijk), een terugblik op de woorden uit les 11.
  hi.a1.unit12.lesson01.teach.kaisa_kaisi_grammar:
    title: Kaisa, kaisi, kaise
    gloss: '''Kaisa'' hoort bij een mannelijk enkelvoudig onderwerp (Hoe was de dag?), ''kaisi'' bij een vrouwelijk (Hoe was de thee?), en ''kaise'' gebruik je bij aap/tum als je een man iets vraagt (Hoe gaat het met je?; bij een vrouw is het ''aap kaisi hain?''). Alle drie zijn vormen van hetzelfde woord.'
    note: 'Brengt voor het eerst het hele rijtje samen: kaise/kaisi ken je al uit les 1, kaisa is nieuw in deze les.'
  hi.a1.unit12.lesson02.teach.names_mai_review:
    title: 'Herhaling: ik, Arjun, Priya'
    gloss: ik, Arjun, Priya
    note: Een korte herhaling voor de voorbeelden in de verleden tijd met 'ik' in deze les.
    example_gloss:
    - Ik ben Arjun.
    - Ik ben Priya.
  hi.a1.unit12.lesson02.teach.jaana_gaya_gai:
    title: Ging (mannelijk / vrouwelijk)
    gloss: ging
    note: De verleden tijd van 'jaana' (gaan), dezelfde stam als de gebiedende wijs 'jao' (ga!) uit les 9. Past zich aan het geslacht van het onderwerp aan, net als 'tha'/'thi'.
    example_gloss:
    - Arjun ging naar de markt.
    - Priya ging naar huis.
  hi.a1.unit12.lesson02.teach.jaana_grammar:
    title: Gaya/gai = verleden tijd van jaana
    gloss: '''Gaya''/''gai'' is de verleden tijd van ''jaana'' (gaan, jao in les 9) en verandert mee met het geslacht van het onderwerp, net als ''tha''/''thi''.'
    note: Koppelt de nieuwe verleden tijd expliciet aan de al bekende stam van de gebiedende wijs.
  hi.a1.unit12.lesson02.teach.bazaar_ghar_review:
    title: 'Herhaling: markt, huis'
    gloss: markt, huis
    note: Een korte herhaling van twee plaatsnamen uit les 7/8, nodig om te zeggen waar iemand heen ging.
    example_gloss:
    - Dit is de markt.
    - Dit is mijn huis.
  hi.a1.unit12.lesson02.teach.milna_mila_mili:
    title: Ontmoette (mannelijk / vrouwelijk)
    gloss: ontmoette
    note: De verleden tijd van 'milna' (ontmoeten), dezelfde stam als het gewoontevorm 'milte hain' uit de afscheidsgroeten van les 1/4/10/11. Past zich aan het geslacht van het onderwerp aan.
    example_gloss:
    - Arjun ontmoette Priya.
    - Priya ontmoette Arjun.
  hi.a1.unit12.lesson02.teach.milna_se_grammar:
    title: Se = 'met' hier, niet 'uit'
    gloss: 'Hier betekent ''se'' niet ''van/uit'': ''X se milna'' betekent ''X ontmoeten'', terwijl hetzelfde woord ''se'' in ''main Bharat se hoon'' ''uit'' betekende.'
    note: Een woord dat je al kent heeft hier een tweede gebruik, dat expliciet wordt uitgelegd.
  hi.a1.unit12.lesson02.teach.wahan_review:
    title: 'Herhaling: daar'
    gloss: daar
    note: Een korte herhaling uit les 8/9, hier gebruikt om te zeggen waar een ontmoeting plaatsvond.
    example_gloss: De school is daar.
  hi.a1.unit12.lesson02.teach.kal_bazaar_gaya_phrase:
    title: Ik ging gisteren naar de markt.
    gloss: Ik ging gisteren naar de markt.
    note: Combineert de nieuwe verleden tijd van deze les met 'kal' uit de eerste les.
  hi.a1.unit12.lesson02.teach.wahan_priya_se_mila_phrase:
    title: Ik ontmoette Priya daar.
    gloss: Ik ontmoette Priya daar.
    note: Combineert 'mila' uit deze les met 'se' ('met') en 'wahan' (daar).
  hi.a1.unit12.lesson02.teach.saath_review:
    title: 'Herhaling: samen'
    gloss: samen
    note: Een korte herhaling uit les 11.
    example_gloss: Wij drinken samen thee.
  hi.a1.unit12.lesson03.teach.chai_dukaan_khana_review:
    title: 'Herhaling: thee, winkel, eten'
    gloss: thee, winkel, eten
    note: Een korte herhaling van drie zelfstandige naamwoorden uit les 6/7, nodig voor de dialoog en de leestekst in deze les.
    example_gloss:
    - De thee is goed.
    - De winkel is goed.
    - Het eten is goed.
  hi.a1.unit12.lesson03.teach.ka_kaisi_review:
    title: 'Herhaling: ''van'' (ka), hoe (vrouwelijk)'
    gloss: van (ka), hoe (vrouwelijk, kaisi)
    note: '''Ka'' (uit ''kitne ka'' en ''raat ka khana'' in les 10) en ''kaisi'' (eerder behandeld) komen hier terug en zijn geen nieuwe grammatica.'
    example_gloss:
    - De dag van gisteren was goed.
    - Hoe was de theewinkel?
  hi.a1.unit12.lesson03.teach.dialogue.line01:
    title: Arjun vraagt hoe gisteren was
    gloss: Priya, hoe was gisteren?
  hi.a1.unit12.lesson03.teach.dialogue.line02:
    title: Priya zegt dat het goed was
    gloss: Heel goed! We hebben elkaar ontmoet.
  hi.a1.unit12.lesson03.teach.dialogue.line03:
    title: Arjun vertelt over de markt
    gloss: Ja! Ik ging eerst ook naar de markt.
  hi.a1.unit12.lesson03.teach.dialogue.line04:
    title: Priya vraagt naar de markt
    gloss: Goed! Wat was er op de markt?
  hi.a1.unit12.lesson03.teach.dialogue.line05:
    title: Arjun antwoordt
    gloss: Het eten was goed.
  hi.a1.unit12.lesson03.teach.dialogue.line06:
    title: Priya vraagt naar de theewinkel
    gloss: Goed! En hoe was de theewinkel?
  hi.a1.unit12.lesson03.teach.dialogue.line07:
    title: Arjun antwoordt
    gloss: De theewinkel was heel goed.
  hi.a1.unit12.lesson03.teach.dialogue.line08:
    title: Priya sluit af
    gloss: Goed! Zien we elkaar morgen weer?
  hi.a1.unit12.lesson03.teach.mile_grammar:
    title: Tum/hum/ve krijgen de meervoudsvorm in de verleden tijd
    gloss: '''Tum'', ''hum'' en ''ve'' krijgen in de verleden tijd dezelfde vorm als in de tegenwoordige tijd met ''-te'': ''the'' (in plaats van ''tha''), ''gaye'' (in plaats van ''gaya''), ''mile'' (in plaats van ''mila''). Zo wordt ''hum milte hain'' in de verleden tijd ''hum mile''.'
    note: Geeft het volledige rijtje voor het begrip. Alleen 'mile' wordt in de oefeningen van deze les actief geoefend; 'the' en 'gaye' herken je alleen uit deze uitleg.
  hi.a1.unit12.lesson03.teach.priya_note:
    title: Priya's briefje
    gloss: Arjun, gisteren was een heel goede dag. Het eten was goed en de theewinkel was ook goed. - Priya
    note: Een kort briefje dat de feiten uit de dialoog herhaalt, zonder nieuwe woorden.
    glosses:
      कल: gisteren
      दिन: dag
      अच्छा: goed (mannelijk)
      था: was (mannelijk)
      खाना: voer
      दुकान: winkel
      अच्छी: goed (vrouwelijk)
      थी: was (vrouwelijk)
