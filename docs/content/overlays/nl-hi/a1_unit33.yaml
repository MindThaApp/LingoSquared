    gloss: Ik ga twee keer per week hardlopen. *हफ़्ते में दो बार* ('in een week, twee keer') is een preciezere manier om te zeggen hoe vaak dan *रोज़* of *अक्सर*, en het staat vóór het werkwoord.
    note: Breidt de woordenschat over frequentie uit die je al kent uit de hobby-eenheid.
