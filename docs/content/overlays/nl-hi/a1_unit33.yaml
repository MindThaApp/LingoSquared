    title: खेलना of करना
    gloss: 'Voetballen, yoga doen. In het Hindi kies je het werkwoord op basis van de sport: *खेलना* bij spellen zoals voetbal en *करना* bij dingen zoals yoga, en de sport komt vóór het werkwoord.'
