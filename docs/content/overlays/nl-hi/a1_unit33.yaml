    title: Ik voetbal
    gloss: Ik voetbal.
    note: 'In het Hindi gebruik je het werkwoord dat bij de sport past: *खेलना* (''spelen'') voor voetbal, dus *मैं फ़ुटबॉल खेलता हूँ*.'
