teaching:
  hi.a1.unit11.lesson01.teach.review_chai_kaafi:
    title: 'Herhaling: thee, koffie'
    gloss: thee, koffie
    note: Een korte herhaling van de woorden voor drankjes uit les 6 -- in deze les gebruik je ze om plannen voor te stellen.
    example_gloss:
    - Ik wil thee.
    - Ik wil koffie.
  hi.a1.unit11.lesson01.teach.filma:
    title: Film
    gloss: film
    note: 'Een nieuw zelfstandig naamwoord voor het thema van deze les: plannen maken.'
    example_gloss: Deze film is goed.
  hi.a1.unit11.lesson01.teach.dekhna:
    title: Wij kijken / laten we kijken
    gloss: (wij) kijken / laten we kijken
    note: De gewoonte-vorm meervoud van 'dekhna' (kijken), hier gebruikt om samen iets voor te stellen.
    example_gloss: Wij kijken een film.
  hi.a1.unit11.lesson01.teach.chalo_film_phrase:
    title: Laten we een film kijken!
    gloss: Laten we een film kijken!
    note: '''Chalo'' + een gewoonte-werkwoord in het meervoud is de alledaagse manier om voor te stellen iets samen te doen -- het kwam al terloops voor in les 1, 6 en 7 (''chalo shuru karte hain'', ''chalo, kuch khaate hain'', ''chalo, kuch khareedte hain''); in deze les wordt het patroon officieel behandeld en uitgebreid.'
  hi.a1.unit11.lesson01.teach.saath:
    title: Samen
    gloss: samen
    note: Wordt gebruikt om voor te stellen iets samen te doen.
    example_gloss: Laten we samen een film kijken!
  hi.a1.unit11.lesson01.teach.peena:
    title: Wij drinken / laten we drinken
    gloss: (wij) drinken / laten we drinken
    note: De gewoonte-vorm meervoud van 'peena' (drinken), hetzelfde patroon als 'dekhte hain'.
    example_gloss: Wij drinken thee.
  hi.a1.unit11.lesson01.teach.chalo_chai_phrase:
    title: Laten we samen thee drinken!
    gloss: Laten we samen thee drinken!
    note: Combineert 'saath' en 'peete hain' uit deze les tot een tweede voorstel, met hetzelfde 'chalo'-patroon als bij het voorstel voor een film.
  hi.a1.unit11.lesson01.teach.chalo_grammar_note:
    title: Chalo + werkwoord-te + hain = Laten we ___
    gloss: 'Om voor te stellen iets samen te doen zeg je ''chalo'' + werkwoord-te + hain: Laten we een film kijken! Laten we samen thee drinken!'
    note: Geeft het hele patroon expliciet weer; het kwam in eerdere lessen al drie keer terloops voor.
  hi.a1.unit11.lesson01.teach.achha_vichar:
    title: Goed idee!
    gloss: Goed idee!
    note: Een kant-en-klare manier om enthousiast op een voorstel in te gaan.
  hi.a1.unit11.lesson02.teach.vyast:
    title: Bezet
    gloss: bezet
    note: Een nieuw bijvoeglijk naamwoord, gebruikt met de al bekende koppelwerkwoordvormen (hoon/ho/hai) om te zeggen dat je geen tijd hebt.
    example_gloss: Ik ben vandaag bezig.
  hi.a1.unit11.lesson02.teach.maaf_karna:
    title: Sorry / pardon
    gloss: sorry / pardon
    note: Een vaste beleefde uitdrukking, waarmee je een weigering zachter maakt.
    example_gloss: Sorry, ik ben bezig.
  hi.a1.unit11.lesson02.teach.maaf_vyast_phrase:
    title: Sorry, ik ben bezig.
    gloss: Sorry, ik ben bezig.
    note: De basiszin om te weigeren, opgebouwd uit de twee nieuwe uitdrukkingen van deze les.
  hi.a1.unit11.lesson02.teach.mujhe_kaam_hai:
    title: Ik heb werk.
    gloss: Ik heb werk.
    note: Gebruikt het patroon 'mujhe...hai' (ik heb...) opnieuw, dat eerder voorkwam bij 'mujhe...chahiye' (ik wil/heb nodig); hier geeft het een reden om te weigeren.
  hi.a1.unit11.lesson02.teach.decline_grammar_note:
    title: Hoe je beleefd weigert
    gloss: Om beleefd een plan af te slaan zeg je 'maaf karna' (sorry), gevolgd door je situatie (bijv. 'ik ben bezig') of een reden (bijv. 'ik heb werk').
    note: Gebruikt bewust al behandelde grammatica (het koppelwerkwoord en het patroon voor bezit met de datief) in plaats van een nieuwe constructie voor 'kunnen'.
  hi.a1.unit11.lesson02.teach.hum_pronoun:
    title: Wij
    gloss: wij
    note: 'Het eerste formele voornaamwoord voor ''wij'' in deze cursus. De gewoonte-vorm (-te + hain) is dezelfde die al is geleerd bij ve (zij) -- geen nieuwe vervoeging, alleen een nieuw voornaamwoord. (Tum krijgt ook -te, maar met ''ho'': tum milte ho.)'
    example_gloss: Wij zien elkaar elke dag.
  hi.a1.unit11.lesson02.teach.kab_milte_phrase:
    title: Wanneer zien we elkaar?
    gloss: Wanneer zien we elkaar?
    note: Combineert 'hum' met 'kab' (les 10) en 'milte hain' (al gebruikt sinds de afscheidsgroeten van les 1, waar het onderwerp meestal wegviel).
  hi.a1.unit11.lesson02.teach.din_review:
    title: 'Herhaling: zaterdag, zondag'
    gloss: Zaterdag, zondag
    note: Een korte herhaling van twee dagen van de week uit les 3, nodig om een plan in te plannen.
    example_gloss:
    - Vandaag is het zaterdag.
    - Morgen is het zondag.
  hi.a1.unit11.lesson02.teach.samay_review:
    title: 'Herhaling: 4 uur, hoe laat'
    gloss: 4 uur, hoe laat
    note: Een korte herhaling van de tijdwoorden uit les 4, nodig om een plan in te plannen.
    example_gloss:
    - Het is nu 4 uur.
    - Hoe laat is het nu?
  hi.a1.unit11.lesson02.teach.kya_ravivar_thik_phrase:
    title: Past zondag?
    gloss: Past zondag?
    note: Gebruikt 'kya' opnieuw als vraagwoord voor ja/nee-vragen, zoals al sinds les 1 ('kya yeh tumhari pahli baar hai?', 'kya tum yoga karti ho?'), in plaats van een nieuw vraagwoord voor 'welke dag'.
  hi.a1.unit11.lesson03.teach.sandesh:
    title: Bericht
    gloss: bericht
    note: Een nieuw zelfstandig naamwoord, gebruikt voor het schriftelijke uitnodigingsgedeelte van deze les.
    example_gloss: Dit is Arjuns bericht.
  hi.a1.unit11.lesson03.teach.dialogue.line01:
    title: Arjun stelt een film op zaterdag voor
    gloss: Priya, zullen we zaterdag een film kijken?
  hi.a1.unit11.lesson03.teach.dialogue.line02:
    title: Priya slaat het voorstel af met een reden
    gloss: Sorry, ik ben zaterdag bezig. Ik heb werk.
  hi.a1.unit11.lesson03.teach.dialogue.line03:
    title: Arjun vraagt wanneer ze kunnen afspreken
    gloss: Oké. Wanneer spreken we af?
  hi.a1.unit11.lesson03.teach.dialogue.line04:
    title: Priya stelt zondag voor
    gloss: Is zondag goed? Laten we samen thee drinken!
  hi.a1.unit11.lesson03.teach.dialogue.line05:
    title: Arjun stemt in en vraagt naar de tijd
    gloss: Goed idee! Hoe laat op zondag?
  hi.a1.unit11.lesson03.teach.dialogue.line06:
    title: Priya stelt een tijd voor
    gloss: Is 4 uur goed?
  hi.a1.unit11.lesson03.teach.dialogue.line07:
    title: Arjun bevestigt
    gloss: Ja, 4 uur is prima. Tot dan!
  hi.a1.unit11.lesson03.teach.dialogue.line08:
    title: Priya rondt af
    gloss: Oké, tot zondag!
  hi.a1.unit11.lesson03.teach.invitation_message:
    title: Priya's bericht
    gloss: Hoi Arjun, laten we zondag om 4 uur afspreken en thee drinken. Goed? - Priya
    note: Een korte schriftelijke uitnodiging die het plan herhaalt dat in de dialoog net is bevestigd.
    glosses:
      चलो: laten we
      रविवार: zondag
      मिलते: afspreken, elkaar ontmoeten (van मिलना)
      चाय: thee
      पीते: drinken (van पीना)
      ठीक: goed / prima
