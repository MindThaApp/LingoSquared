  hi.a1.unit35.lesson02.teach.maisej_bhejte_bhee:
    title: Het werkwoord volgt de persoon
    gloss: 'Een *मैसेज* kun je versturen of lezen, en de werkwoordsuitgang volgt de persoon: *मैं भेजता हूँ*, *तुम पढ़ते हो*, *वह पढ़ता है*.'
    note: Koppelt het nieuwe woord aan het samengestelde zelfstandig naamwoord uit de weerles.
