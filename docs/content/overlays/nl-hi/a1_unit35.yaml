    title: Vikram ziet het bericht
    gloss: 'Vikram: Ik zie het bericht. Tot zaterdag!'
  hi.a1.unit35.lesson04.teach.phir_milenge_yah:
    title: फिर मिलेंगे vs dag + को
    gloss: 'Je kent *फिर मिलेंगे!* ("tot ziens"). Wil je een dag noemen, zet dan *को* erachter: *शनिवार को मिलते हैं!*, *सोमवार को मिलते हैं!*'
    note: Breidt het afscheidspatroon uit de begroetingsles uit naar een bepaalde dag.
  hi.a1.unit35.lesson05.teach.priya_har_din:
    title: Wie gebruikt wat?
    gloss: Priya belt Arjun elke dag. Ze gebruikt haar telefoon, geen app. Arjun heeft thuis geen computer, maar hij gebruikt internet op zijn telefoon. Vikram zoekt elke ochtend de weersverwachting op. Daarna gaat hij hardlopen. Neha stuurt Priya vaak een bericht. Gebruik jij ook elke dag je telefoon?
    note: Vergelijkt hoe alle vier de personages hun apparaten gebruiken, net als de vergelijkende leestekst in de sportles.
