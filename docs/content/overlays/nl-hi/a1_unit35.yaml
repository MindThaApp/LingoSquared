    title: Arjun leest het bericht
    gloss: Arjun leest het bericht.
  hi.a1.unit35.lesson03.teach.chek_karna:
    title: Opzoeken, nakijken
    gloss: nakijken, opzoeken
    example_gloss: Ik kijk de weersverwachting na.
  hi.a1.unit35.lesson03.teach.chek_karna_men:
    title: Alleen करना verandert
    gloss: 'Bij *चेक करना* blijft het woord *चेक* gelijk en verandert alleen *करना* mee met de persoon: *मैं चेक करता हूँ*, *तुम चेक करते हो*. Bij *इस्तेमाल करना* werkt het net zo.'
    note: 'Veel Hindi-werkwoorden bestaan uit een zelfstandig naamwoord of leenwoord plus *करना*: leer het eerste woord één keer en verander alleen *करना*.'
  hi.a1.unit35.lesson03.teach.vikram_mausam_ka:
    title: Vikram zoekt de weersverwachting op
    gloss: Vikram zoekt de weersverwachting op.
