    gloss: 'Vikram: Dan ga ik hardlopen. Daarna ga ik ook voetballen.'
    note: '*उसके बाद* ("daarna") start de tweede stap, en *भी* betekent "ook".'
  hi.a1.unit35.lesson06.teach.neha_mujhe_tairna:
    title: Het plan van Neha
    gloss: 'Neha: Ik zwem liever, maar ik kom ook naar het park.'
    note: Een voorkeur uitdrukken doe je met een *मुझे ... पसंद है*-zin, en *ज़्यादा* voegt "meer" toe.
