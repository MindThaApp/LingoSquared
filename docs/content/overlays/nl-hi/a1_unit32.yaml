teaching:
  hi.a1.unit32.lesson01.teach.janvar_paltoo_janvar:
    title: Dier, een huisdier
    gloss: het dier / een huisdier
    note: '*जानवर* is het algemene woord voor een dier, en *पालतू जानवर* (''tam dier'') betekent huisdier.'
    example_gloss:
    - Een hond is een dier.
    - Een hond is ook een huisdier.
  hi.a1.unit32.lesson01.teach.kutta_billee:
    title: Hond en kat
    gloss: de hond / de kat
    example_gloss:
    - Priya heeft een hond.
    - Vikram heeft een kat.
  hi.a1.unit32.lesson01.teach.machhlee_chiriya:
    title: Vis en vogel
    gloss: de vis / de vogel
    example_gloss:
    - Opa heeft een vis.
    - Nina heeft een vogel.
  hi.a1.unit32.lesson01.teach.kya_tumhare_pas:
    title: Heb jij een huisdier?
    gloss: Heb jij een huisdier?
    note: '*तुम्हारे पास ... है?* (''bij jou ... is?'') betekent ''heb jij ...?'', en *कोई* (''enig'') houdt de vraag open.'
  hi.a1.unit32.lesson01.teach.han_mere_pas:
    title: Ja, ik heb een hond
    gloss: Ja, ik heb een hond.
    note: Een eenvoudig bevestigend antwoord met de nieuwe woorden uit deze les.
  hi.a1.unit32.lesson01.teach.naheen_mere_pas:
    title: Nee, ik heb geen huisdier
    gloss: Nee, ik heb geen huisdier.
    note: '*कोई ... नहीं है* (''er is geen ...'') zegt dat je er geen hebt.'
  hi.a1.unit32.lesson01.teach.mere_pas_koee:
    title: कोई ... नहीं
    gloss: Ik heb geen huisdier.
    note: '*कोई* (''enig'') plus *नहीं है* ontkent het hebben van iets: *मेरे पास कोई पालतू जानवर नहीं है*.'
  hi.a1.unit32.lesson02.teach.ghumane_le_jana:
    title: Een dier uitlaten
    gloss: uitlaten (een dier)
    note: '*घुमाने ले जाना* (''uitnemen voor een wandeling'') is hoe het Hindi ''een dier uitlaten'' zegt; na *घुमाने* volgt *ले जाना*.'
    example_gloss: Ik laat de hond elke dag uit.
  hi.a1.unit32.lesson02.teach.vah_kutte_ko:
    title: घुमाने ले जाना
    gloss: Ze laat de hond uit.
    note: Het dier krijgt *को* (*कुत्ते को*), en *घुमाने ले जाती है* staat aan het eind; *ले जाना* ('meenemen') blijft bij elkaar als twee woorden.
  hi.a1.unit32.lesson02.teach.khana_dena:
    title: Voeren
    gloss: voeren
    example_gloss: Ik geef de kat elke dag te eten.
  hi.a1.unit32.lesson02.teach.ke_sath_khelna:
    title: Spelen met
    gloss: spelen met
    example_gloss: Vikram speelt met zijn kat.
  hi.a1.unit32.lesson02.teach.main_roz_kutte:
    title: Ik laat de hond elke dag uit
    gloss: Ik laat de hond elke dag uit.
    note: '*रोज़* (''elke dag'') staat voor het object: *रोज़ कुत्ते को घुमाने ले जाता हूँ*.'
  hi.a1.unit32.lesson02.teach.main_roz_billee:
    title: Ik geef de kat elke dag te eten
    gloss: Ik geef de kat elke dag te eten.
    note: 'Bij *खाना देना* (''eten geven'') wordt wie het eten krijgt gemarkeerd met *को*: *बिल्ली को खाना देता हूँ*.'
  hi.a1.unit32.lesson03.teach.ek_kutta_do:
    title: Meervoudsvormen
    gloss: Eén hond, twee honden; één kat, twee katten. Een mannelijk zelfstandig naamwoord op *-आ* wordt in het meervoud *-ए* (*कुत्ता* wordt *कुत्ते*), terwijl een vrouwelijk woord op *-ई* *-याँ* krijgt (*बिल्ली* wordt *बिल्लियाँ*).
    note: Het regelmatige Hindi meervoudspatroon, hier voor het eerst geïntroduceerd met dierennamen als voorbeeld.
  hi.a1.unit32.lesson03.teach.kutte_billiyan:
    title: Honden en katten
    gloss: honden / katten
    example_gloss:
    - Arjun is dol op honden.
    - Neha is dol op katten.
  hi.a1.unit32.lesson03.teach.machhliyan_chiriyan:
    title: Vissen en vogels (meervoud)
    gloss: vissen / vogels
    example_gloss:
    - Ik hou van vissen.
    - Opa houdt van vogels.
  hi.a1.unit32.lesson03.teach.mujhe_janvar_bahut:
    title: Ik hou van dieren
    gloss: Ik hou van dieren.
    note: '*मुझे जानवर बहुत पसंद हैं* (''door mij worden dieren heel graag gemogen'') betekent ''ik ben dol op dieren''; *हैं* is meervoud omdat *जानवर* meervoud is.'
  hi.a1.unit32.lesson03.teach.neha_ko_billiyan:
    title: Neha is dol op katten, maar heeft geen huisdier
    gloss: Neha is dol op katten, maar ze heeft geen huisdier.
    note: Bereidt het contrast voor waar de leestekst van deze les om draait.
  hi.a1.unit32.lesson04.teach.arjun_kya_tumhare:
    title: Arjun vraagt naar een huisdier
    gloss: 'Arjun: Heb jij een huisdier, Priya?'
  hi.a1.unit32.lesson04.teach.priya_han_mere:
    title: Priya heeft een hond
    gloss: 'Priya: Ja, ik heb een hond.'
  hi.a1.unit32.lesson04.teach.arjun_vah_kaisa:
    title: Arjun vraagt hoe hij eruitziet
    gloss: 'Arjun: Hoe ziet hij eruit?'
    note: '*वह कैसा दिखता है?* gebruik je ook voor dieren, en *कैसा* is mannelijk omdat de hond een mannetje is.'
  hi.a1.unit32.lesson04.teach.priya_uske_bal:
    title: Priya beschrijft haar hond
    gloss: 'Priya: Hij heeft bruin haar en hij is klein.'
    note: Hier komen de woorden voor haarkleur en grootte uit de les over uiterlijk terug, nu om de vacht van een dier te beschrijven in plaats van het haar van een persoon.
  hi.a1.unit32.lesson04.teach.vah_mera_kutta:
    title: वह voor dieren
    gloss: Dat is mijn hond. Ik vind hem heel leuk.
    note: '*वह* en *उसे* gebruik je zowel voor dieren als voor mensen; Hindi heeft hier geen apart woord voor ''het''.'
  hi.a1.unit32.lesson04.teach.arjun_kya_tum:
    title: Arjun vraagt naar wandelingen
    gloss: 'Arjun: Ga je elke dag met hem wandelen?'
  hi.a1.unit32.lesson04.teach.priya_han_main:
    title: Priya beschrijft haar dagelijkse routine
    gloss: 'Priya: Ja, ik ga elke dag met hem wandelen en ik geef hem te eten.'
  hi.a1.unit32.lesson05.teach.arjun_aur_neha:
    title: Arjun, Neha en Vikram over dieren
    gloss: 'Arjun en Neha zijn allebei dol op dieren, maar geen van beiden heeft een huisdier. Arjun is dol op honden en Neha is dol op katten. Vikram heeft wel een huisdier: een kat. Hij speelt vaak met zijn kat en geeft de kat elke dag te eten. Heb jij een huisdier?'
    note: 'Zet van dieren houden tegenover er echt een hebben: dat is het communicatieve doel van deze les.'
    glosses:
      पसंद: houden van
      दोनों: beide
      जानवर: dieren
      किसी: een van hen
      पालतू: huisdier
      कुत्ते: honden
      बिल्लियाँ: katten
      बिल्ली: kat
      खेलता: speelt
      देता: geeft
      रोज़: elke
      खाना: voer
  hi.a1.unit32.lesson05.teach.vikram_aksar_apnee:
    title: Vikram speelt vaak met zijn kat
    gloss: Vikram speelt vaak met zijn kat.
    note: '*अक्सर* (''vaak'') staat voor het werkwoord, en *अपनी* komt overeen met het vrouwelijke *बिल्ली*.'
  hi.a1.unit32.lesson05.teach.mujhe_kutte_bahut:
    title: Ik hou van honden. Ik heb geen huisdier.
    gloss: Ik hou van honden. Ik heb geen huisdier.
    note: Een voorbeeldantwoord van twee zinnen, dat je kunt hergebruiken voor de schrijfopdracht van deze les.
  hi.a1.unit32.lesson06.teach.priya_neena_kya:
    title: Priya vraagt het aan Nina
    gloss: 'Priya: Nina, heb jij ook een huisdier?'
  hi.a1.unit32.lesson06.teach.neena_han_mere:
    title: Nina heeft een vogel die Pico heet
    gloss: 'Nina: Ja, ik heb een vogel. Hij heet Pico.'
    note: '*उसका नाम पिको है* (''zijn naam is Pico'') gebruikt *का* omdat *नाम* mannelijk is.'
  hi.a1.unit32.lesson06.teach.arjun_vah_kitna:
    title: Arjun reageert
    gloss: 'Arjun: Wat leuk! Wat doe je elke dag met hem?'
  hi.a1.unit32.lesson06.teach.neena_main_use:
    title: Nina geeft hem elke dag te eten
    gloss: 'Nina: Ik geef hem elke dag te eten.'
  hi.a1.unit32.lesson06.teach.arjun_mujhe_bhee:
    title: Arjun is ook dol op vogels
    gloss: 'Arjun: Ik ben ook dol op vogels.'
  hi.a1.unit32.lesson06.teach.priya_kitna_achchha:
    title: Priya sluit het gesprek af
    gloss: 'Priya: Fijn dat wij drieën dol zijn op dieren!'
    note: Rondt het gesprek af met wat alle drie de personages in deze les over dieren hebben verteld.
