teaching:
  hi.a1.unit17.lesson01.teach.tum_tumhara_kya_review:
    title: 'Herhaling: jij, jouw, wat'
    gloss: jij (informeel), jouw (informeel), wat
    note: Een korte herhaling van de woorden die je nodig hebt om een vriend naar zijn of haar werk te vragen.
    example_gloss: Hoe heet jij?
  hi.a1.unit17.lesson01.teach.arjun_priya_review:
    title: 'Herhaling: Arjun, Priya'
    gloss: Arjun, Priya
    note: Een herinnering aan de namen van beide personages, voordat deze les ze gebruikt als anker voor vragen met geslacht.
    example_gloss:
    - Mijn naam is Arjun.
    - Mijn naam is Priya.
  hi.a1.unit17.lesson01.teach.copula_review:
    title: 'Herhaling: ik, ben, is, ben/bent'
    gloss: ik, ben, is, bent (informeel jij)
    note: De hele kleine set vormen van 'zijn' die je nodig hebt voor de zinnen over identiteit in deze unit.
    example_gloss:
    - Gaat het goed met je?
    - Het gaat goed met mij.
  hi.a1.unit17.lesson01.teach.kaam_review:
    title: 'Herhaling: werk'
    gloss: werk
    note: Geleerd in unit 10/11 -- hier opnieuw gebruikt als thema van de hele unit.
    example_gloss: Ik heb werk te doen.
  hi.a1.unit17.lesson01.teach.karte_karti_karta_verb:
    title: Doen (jij, man / jij, vrouw / ik, man)
    gloss: doe je (tegen een man, informeel), doe je (tegen een vrouw, informeel), doe ik (man)
    note: Breidt de regel voor de uitgangen -ta/-ti/-te uit unit 10 (ook te zien in *kya tum yog karti ho?* uit unit 1) uit naar het werkwoord *karna* (doen).
    example_gloss:
    - Wat doe jij?
    - Ik ontbijt.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karte_ho_phrase:
    title: Welk werk doe jij? (tegen een man)
    gloss: Welk werk doe jij?
    note: De openingsvraag van deze les, gericht aan een mannelijke vriend.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karti_ho_phrase:
    title: Welk werk doe jij? (tegen een vrouw)
    gloss: Welk werk doe jij?
    note: Dezelfde vraag, gericht aan een vriendin -- alleen de uitgang van het werkwoord verandert.
  hi.a1.unit17.lesson01.teach.shikshak_shikshika:
    title: Leraar (man / vrouw)
    gloss: leraar (man), lerares (vrouw)
    note: Een nieuw paar beroepsnamen. Anders dan de meeste zelfstandige naamwoorden tot nu toe verandert dit woord mee met het geslacht van de SPREKER zelf -- zie de grammaticanotitie van deze les.
    example_gloss:
    - Ik ben leraar (man).
    - Ik ben lerares (vrouw).
  hi.a1.unit17.lesson01.teach.grammar_occupation_gender:
    title: Mein + beroep + hoon
    gloss: Met 'Mein + beroep + hoon' zeg je wat je beroep is, hetzelfde 'mein...hoon'-patroon als in unit 1. Sommige beroepen veranderen mee met het geslacht van de spreker zelf -- 'shikshak' (man), 'shikshika' (vrouw), net zoals de werkwoordsuitgang -ta/-ti in unit 10 veranderde. 'Doctor' en 'engineer' veranderen niet -- hetzelfde woord voor beide geslachten.
    note: Legt de tweedeling (naamwoorden die het geslacht volgen versus onveranderlijke leenwoorden) uitdrukkelijk uit voordat een oefening erop leunt.
  hi.a1.unit17.lesson01.teach.doctor_review:
    title: 'Herhaling: dokter'
    gloss: dokter
    note: Geleerd in unit 16 -- hier opnieuw gebruikt als beroep dat niet van geslacht verandert.
    example_gloss: Hij/zij is dokter.
  hi.a1.unit17.lesson01.teach.mein_doctor_hoon_phrase:
    title: Ik ben dokter.
    gloss: Ik ben dokter.
    note: Het identiteitspatroon toegepast op een herhalingswoord.
  hi.a1.unit17.lesson01.teach.engineer:
    title: Ingenieur
    gloss: ingenieur
    note: Een nieuwe beroepsnaam, net als *doctor* onveranderlijk naar geslacht.
    example_gloss: Hij/zij is ingenieur.
  hi.a1.unit17.lesson01.teach.mein_engineer_hoon_phrase:
    title: Ik ben ingenieur.
    gloss: Ik ben ingenieur.
    note: Het identiteitspatroon toegepast op het tweede nieuwe beroep van deze les.
  hi.a1.unit17.lesson02.teach.kahan_review:
    title: 'Herhaling: waar'
    gloss: waar
    note: Geleerd in unit 1 -- hier opnieuw gebruikt om naar een werkplek te vragen.
    example_gloss: Waar is het ziekenhuis?
  hi.a1.unit17.lesson02.teach.mein_review:
    title: 'Herhaling: in / op'
    gloss: in / op
    note: Geleerd in unit 1 -- hier opnieuw gebruikt om een werkplek te noemen.
    example_gloss: Ik woon in Londen.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karte_ho_phrase:
    title: Waar werk jij? (tegen een man)
    gloss: Waar werk je?
    note: De openingsvraag van deze les, gericht aan een mannelijke vriend.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karti_ho_phrase:
    title: Waar werk jij? (tegen een vrouw)
    gloss: Waar werk je?
    note: Dezelfde vraag, gericht aan een vriendin.
  hi.a1.unit17.lesson02.teach.school_review:
    title: 'Herhaling: school'
    gloss: school
    note: Geleerd in unit 8 -- de eerste werkplek van deze les.
    example_gloss: Ik werk op school (vrouwelijke spreker).
  hi.a1.unit17.lesson02.teach.mein_school_mein_kaam_karti_hoon_phrase:
    title: Ik werk op school.
    gloss: Ik werk op school.
    note: Het werkplekpatroon toegepast op school, vrouwelijke vorm.
  hi.a1.unit17.lesson02.teach.hospital_review:
    title: 'Herhaling: ziekenhuis'
    gloss: ziekenhuis
    note: Geleerd in unit 8 -- de tweede werkplek van deze les, gekoppeld aan het beroep dokter.
    example_gloss: De dokter werkt in het ziekenhuis.
  hi.a1.unit17.lesson02.teach.daftar:
    title: Kantoor
    gloss: kantoor
    note: 'Een nieuw zelfstandig naamwoord: de derde werkplek van deze les, gekoppeld aan het beroep van ingenieur.'
    example_gloss: Ik werk op kantoor (mannelijke spreker).
  hi.a1.unit17.lesson02.teach.mein_daftar_mein_kaam_karta_hoon_phrase:
    title: Ik werk op kantoor.
    gloss: Ik werk op kantoor.
    note: Het werkplekpatroon toegepast op kantoor, mannelijke vorm.
  hi.a1.unit17.lesson02.teach.grammar_workplace:
    title: Plaats + mein + kaam karta/karti hoon
    gloss: '''[Plaats] + mein + kaam karta/karti hoon'' combineert drie bekende onderdelen: ''mein'' (les 1, ''London mein rehta hoon''), ''kaam'' (les 10/11) en de -ta/-ti/-te-vorm van ''karna'' (uit les 10 ''nashta karta hoon'' en uit les 1 ''kya tum yog karti ho?''). Dit is geen nieuwe grammatica: het zijn dezelfde drie onderdelen, nu voor het eerst in één zin samengevoegd.'
    note: Noemt elk al geleerd onderdeel met het lesnummer voordat ze worden gecombineerd, net als in alle eerdere grammaticanotities.
  hi.a1.unit17.lesson03.teach.roz_review:
    title: 'Herhaling: elke dag'
    gloss: elke dag
    note: Voor het eerst behandeld in les 10 -- hier opnieuw gebruikt om een dagelijkse werkroutine te beschrijven.
    example_gloss: Ik werk elke dag.
  hi.a1.unit17.lesson03.teach.jaana_forms_review:
    title: 'Herhaling: gaan (jij, vrouw / jij, man / ik, man)'
    gloss: gaan (jij, vrouw, informeel), gaan (jij, man, informeel), ga (ik, man)
    note: De al behandelde -ta/-ti/-te-vormen van *jana* (gaan), voor het eerst uitgelegd in les 10, hier opnieuw gebruikt voor de dagelijkse reis naar het werk.
    example_gloss:
    - Ik ga elke dag naar school (vrouwelijke spreker).
    - Ga jij elke dag naar kantoor? (tegen een man)
  hi.a1.unit17.lesson03.teach.bhi_haan_review:
    title: 'Herhaling: ook, ja'
    gloss: ook, ja
    note: Beide al behandeld (les 1 en les 1/6/13) -- hier opnieuw gebruikt in de dialoog van deze les.
    example_gloss: Ja, ik vond dat ook fijn.
  hi.a1.unit17.lesson03.teach.dialogue.line01:
    title: Arjun vraagt Priya naar haar werk
    gloss: Priya, wat voor werk doe jij?
  hi.a1.unit17.lesson03.teach.dialogue.line02:
    title: Priya zegt dat ze lerares is op een school
    gloss: Ik ben lerares. Ik werk op een school.
  hi.a1.unit17.lesson03.teach.dialogue.line03:
    title: Arjun vraagt of ze elke dag naar school gaat
    gloss: Mooi! Ga jij elke dag naar school?
  hi.a1.unit17.lesson03.teach.dialogue.line04:
    title: Priya bevestigt het en stelt Arjun dezelfde vraag
    gloss: Ja, ik ga elke dag naar school. Wat voor werk doe jij?
  hi.a1.unit17.lesson03.teach.dialogue.line05:
    title: Arjun zegt dat hij ingenieur is op een kantoor
    gloss: Ik ben ingenieur. Ik werk op een kantoor.
  hi.a1.unit17.lesson03.teach.dialogue.line06:
    title: Priya vraagt of hij ook elke dag naar kantoor gaat
    gloss: Heel mooi! Ga jij ook elke dag naar kantoor?
  hi.a1.unit17.lesson03.teach.dialogue.line07:
    title: Arjun bevestigt het
    gloss: Ja, ik ga elke dag naar kantoor.
  hi.a1.unit17.lesson03.teach.dialogue.line08:
    title: Priya bedankt hem
    gloss: Oké, bedankt.
  hi.a1.unit17.lesson03.teach.grammar_summary:
    title: Drie hoofdregels
    gloss: 'De drie hoofdregels van deze les: (1) ''mein + beroep + hoon'' geeft een beroep aan (bijv. ''mein shikshika hoon''); sommige beroepen veranderen mee met het geslacht van de spreker; (2) ''[plaats] + mein + kaam karta/karti hoon'' geeft de werkplek aan (bijv. ''mein daftar mein kaam karta hoon''); (3) ''roz [plaats] jata/jati hoon'' geeft een dagelijkse gewoonte aan, met dezelfde -ta/-ti-regel als in les 10.'
    note: Een afsluitende samenvatting die de grammatica van de hele les bij elkaar brengt, zoals ook de grammaticanotities van les 15/16 de paradigma's samenbrachten.
  hi.a1.unit17.lesson03.teach.work_profile_reading:
    title: Een kort profiel lezen
    gloss: Priya is lerares. Ze werkt op een school. Arjun is ingenieur. Hij werkt op een kantoor.
    note: Een kort, direct profiel (zonder nieuw verhaal) dat precies de feiten uit de dialoog herhaalt, zonder nieuwe beweringen -- sluit direct aan op het doel 'een kort werkprofiel lezen'.
    glosses:
      शिक्षिका: lerares
      स्कूल: school
      काम: werk
      करती: doet / werkt (vrouwelijk, van करना)
      इंजीनियर: ingenieur
      दफ़्तर: kantoor
      करता: doet / werkt (mannelijk, van करना)
