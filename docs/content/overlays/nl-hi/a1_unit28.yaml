teaching:
  hi.a1.unit28.lesson01.teach.fon_karna:
    title: Bellen
    gloss: bellen
    note: De infinitief van het werkwoord voor telefoneren.
    example_gloss: Ik moet je bellen.
  hi.a1.unit28.lesson01.teach.main_tumhen_fon:
    title: Zeggen dat je belt
    gloss: Ik bel je.
    note: '*करूँगा* is de toekomende tijd van *करना*, en Hindi gebruikt die waar Nederlands ''ik ga ... / ik zal ...'' zegt. De persoon die je belt krijgt *तुम्हें* (''aan jou'').'
  hi.a1.unit28.lesson01.teach.hailo_main_priya:
    title: De telefoon opnemen
    gloss: Hallo, met Priya.
    note: Aan de telefoon zeg je *मैं ... बोल रही हूँ* ('ik ben aan het spreken'); *रही* is vrouwelijk omdat Priya een vrouw is.
  hi.a1.unit28.lesson01.teach.hailo_main_arjun:
    title: Arjun neemt op dezelfde manier op
    gloss: Hallo, met Arjun.
    note: 'Hetzelfde patroon met het mannelijke *रहा*: *मैं अर्जुन बोल रहा हूँ*, omdat Arjun een man is.'
  hi.a1.unit28.lesson02.teach.main_kisse_bat:
    title: Vragen wie er belt
    gloss: Met wie spreek ik?
    note: '*किससे* (''met wie'') is *कौन* (''wie'') plus *से*, en *से* markeert de persoon met wie je praat.'
  hi.a1.unit28.lesson02.teach.ap_priya_se:
    title: Jezelf formeel voorstellen
    gloss: U spreekt met Priya.
    note: '*आप* is het beleefde ''u'' voor een vreemde. *प्रिया से बात कर रहे हैं* zet *से* achter de naam, en *हैं* hoort bij *आप*.'
  hi.a1.unit28.lesson03.teach.kya_tum_yah:
    title: Vragen om herhaling
    gloss: Kun je dat herhalen?
    note: '*सकते हो* betekent ''kunnen'' en staat na het hoofdwerkwoord: *कह सकते हो*. *क्या* aan het begin maakt er een vraag van.'
  hi.a1.unit28.lesson03.teach.itna_tez_mat:
    title: Vragen om langzamer te praten
    gloss: Praat niet zo snel, alsjeblieft.
    note: '*मत बोलो* is het vriendelijke ''praat niet'' met *तुम*, en *इतना तेज़* betekent ''zo snel''.'
  hi.a1.unit28.lesson03.teach.mujhe_tumharee_avaz:
    title: Zeggen dat je niet goed hoort
    gloss: Ik hoor je niet goed.
    note: 'Hindi zegt letterlijk ''je stem komt niet'': *मुझे तुम्हारी आवाज़ नहीं आ रही है*. De spreker krijgt *मुझे* en de stem is het onderwerp.'
  hi.a1.unit28.lesson04.teach.maisej:
    title: Appje
    gloss: het berichtje
    note: '*मैसेज* is een veelgebruikt leenwoord en mannelijk: *एक मैसेज*, *यह मैसेज ... का है*.'
    example_gloss: Het sms'je is van Priya.
  hi.a1.unit28.lesson04.teach.main_tumhen_ek:
    title: Zeggen dat je iets stuurt
    gloss: Ik stuur je een berichtje.
    note: 'De volgorde is eerst de persoon, dan het ding, dan het werkwoord: *तुम्हें एक मैसेज भेजूँगा*. *भेजना* betekent ''sturen''.'
  hi.a1.unit28.lesson04.teach.main_tumhen_bad:
    title: Zeggen dat je terugbelt
    gloss: Ik bel je straks terug.
    note: '*वापस फ़ोन करना* betekent ''terugbellen'', met *वापस* vóór *फ़ोन करना*; *बाद में* betekent ''later''.'
  hi.a1.unit28.lesson05.teach.arjun_hay_priya:
    title: Lees een appgesprek
    gloss: 'Arjun: Hoi Priya, kun je me bellen? Ik moet je iets belangrijks vertellen. Priya: Ja, natuurlijk, ik bel je over vijf minuten terug.'
    note: Let op wat Arjun vraagt, waarom, en wanneer Priya zegt terug te bellen.
    glosses:
      हाय: hoi
      सकती: kunnen
      फ़ोन: bellen
      ज़रूरी: 'belangrijk (zoals in: iets belangrijks te vertellen)'
      कुछ: iets
      बतानी: vertellen
      ज़रूर: natuurlijk
      करूँगी: zal bellen
      पाँच: vijf
      मिनट: minuten
      वापस: terug
  hi.a1.unit28.lesson06.teach.arjun_hailo_main:
    title: Arjun neemt de telefoon op
    gloss: 'Arjun: Hallo, met Arjun.'
    note: Wie opneemt, noemt eerst de eigen naam met *मैं ... बोल रहा हूँ*, hier met de mannelijke vorm *रहा*.
  hi.a1.unit28.lesson06.teach.priya_hay_arjun:
    title: Priya stelt zich voor
    gloss: 'Priya: Hoi Arjun, met Priya. Arjun: Fijn dat je belt!'
    note: '*अच्छा हुआ तुमने फ़ोन किया* betekent ''goed dat je gebeld hebt''; *तुमने ... किया* is de verleden tijd met *ने*.'
  hi.a1.unit28.lesson06.teach.priya_tumharee_pahlee:
    title: Priya vraagt naar de dienst
    gloss: 'Priya: Hoe was je eerste dienst?'
    note: '*कैसी रही* vraagt ''hoe was het''; *कैसी* is vrouwelijk omdat *शिफ़्ट* vrouwelijk is.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_achchhee:
    title: Arjun heeft goed nieuws
    gloss: 'Arjun: Echt goed, zelfs beter dan ik had gedacht.'
    note: '*अच्छी रही* (''ging goed'') komt overeen met het vrouwelijke *शिफ़्ट*, en *जितना मैंने सोचा था उससे भी बेहतर* betekent ''zelfs beter dan ik dacht''.'
  hi.a1.unit28.lesson06.teach.vah_narvas_tha:
    title: 'था en थी: was'
    gloss: Hij was nerveus, zij was blij.
    note: '*था* is ''was'' bij een mannelijk onderwerp en *थी* bij een vrouwelijk onderwerp; de uitgang past zich aan aan wie of wat wordt beschreven.'
  hi.a1.unit28.lesson06.teach.priya_yah_sunkar:
    title: Priya is trots
    gloss: 'Priya: Fijn om te horen! Ik ben trots op je.'
    note: '*तुम पर गर्व है* (''trots is op jou'') gebruikt *पर*, en wie trots is krijgt *मुझे*.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_shukriya:
    title: Arjun is ontroerd
    gloss: 'Arjun: Hartelijk dank, dat betekent veel voor me.'
    note: '*मेरे लिए* betekent ''voor mij'', en *इसका बहुत मतलब है* is ''het betekent veel''.'
  hi.a1.unit28.lesson06.teach.uskee_pahlee_shift:
    title: Zijn
    gloss: Zijn eerste dienst is heel goed gegaan.
    note: '*उसकी* betekent ''zijn'' of ''haar'' (hetzelfde woord voor beide) en komt overeen met het vrouwelijke *शिफ़्ट*.'
