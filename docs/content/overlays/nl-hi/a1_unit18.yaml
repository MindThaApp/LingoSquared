teaching:
  hi.a1.unit18.lesson01.teach.ghar_review:
    title: 'Herhaling: huis / thuis'
    gloss: huis / thuis
    note: Eerder geleerd in les 8 -- het hoofdwoord van het thema van deze les.
    example_gloss: Dit is een huis.
  hi.a1.unit18.lesson01.teach.mein_review:
    title: 'Herhaling: in / op'
    gloss: in / op
    note: Eerder geleerd in les 1 -- in deze les gebruikt om kamers en voorwerpen te plaatsen.
    example_gloss: Ik werk op kantoor.
  hi.a1.unit18.lesson01.teach.hai_hain_review:
    title: 'Herhaling: is, zijn'
    gloss: is (enkelvoud), zijn (meervoud)
    note: Het paar enkelvoud/meervoud van het koppelwerkwoord waar het hele hoeveelheidspatroon van deze les op rust.
    example_gloss:
    - Dit is een huis.
    - Mijn grootvader woont in Delhi.
  hi.a1.unit18.lesson01.teach.numbers_review:
    title: 'Herhaling: hoeveel, een, twee, drie'
    gloss: hoeveel, een, twee, drie
    note: Eerder geleerd in les 2/7 -- hier opnieuw gebruikt om kamers te tellen.
    example_gloss:
    - Ik heb drie broers.
    - Hoeveel kamers zijn er in het huis?
  hi.a1.unit18.lesson01.teach.kamra_kamre:
    title: Kamer (enkelvoud / meervoud)
    gloss: kamer, kamers
    note: 'Een nieuw zelfstandig naamwoord. Let op het meervoud: *kamra* (een) wordt *kamre* (meer dan een) -- zie de grammaticanotitie van deze les.'
    example_gloss:
    - Er is één kamer in het huis.
    - Er zijn drie kamers in het huis.
  hi.a1.unit18.lesson01.teach.grammar_room_plural:
    title: Mannelijk meervoud -a -> -e
    gloss: 'Mannelijke zelfstandige naamwoorden op ''-a'' krijgen in het meervoud ''-e'' -- ''kamra'' (een) wordt ''kamre'' (meer dan een). Ook het werkwoord verandert met het aantal: ''hai'' bij een, ''hain'' bij meer dan een -- bijvoorbeeld ''ghar mein ek kamra hai'' maar ''ghar mein teen kamre hain''.'
    note: De eerste meervoudsregel voor zelfstandige naamwoorden in deze cursus, uitgelegd voordat een oefening erop leunt.
  hi.a1.unit18.lesson01.teach.rasoi:
    title: Keuken
    gloss: keuken
    note: Een nieuw zelfstandig naamwoord, het eerste kamerwoord van deze les.
    example_gloss: Er is een keuken in het huis.
  hi.a1.unit18.lesson01.teach.bathroom:
    title: Badkamer
    gloss: badkamer
    note: Een veelgebruikt leenwoord uit het Engels in het dagelijkse gesproken Hindi, hetzelfde patroon als *doctor*/*engineer* (les 16/17).
    example_gloss: Er is een badkamer in het huis.
  hi.a1.unit18.lesson01.teach.bedroom:
    title: Slaapkamer
    gloss: slaapkamer
    note: Ook een veelgebruikt leenwoord, onveranderlijk zoals *bathroom* -- het krijgt geen eigen meervoudsuitgang, alleen het patroon telwoord + *hain*.
    example_gloss: Er zijn twee slaapkamers in het huis.
  hi.a1.unit18.lesson01.teach.ghar_mein_kitne_kamre_phrase:
    title: Hoeveel kamers zijn er in het huis?
    gloss: Hoeveel kamers zijn er in het huis?
    note: De openingsvraag van deze les.
  hi.a1.unit18.lesson01.teach.ghar_mein_teen_kamre_phrase:
    title: Er zijn drie kamers in het huis.
    gloss: Er zijn drie kamers in het huis.
    note: Een voorbeeldantwoord op de openingsvraag van deze les.
  hi.a1.unit18.lesson02.teach.aur_review:
    title: 'Herhaling: en'
    gloss: en
    note: Eerder geleerd in les 1 -- hier opnieuw gebruikt om meubels op te sommen.
    example_gloss: Ik vond het ook fijn, en jij?
  hi.a1.unit18.lesson02.teach.mez:
    title: Tafel
    gloss: tafel
    note: Een nieuw zelfstandig naamwoord, in de oefeningen van deze les alleen in het enkelvoud gebruikt (de meervoudsregel volgt later).
    example_gloss: Er staat een tafel in de keuken.
  hi.a1.unit18.lesson02.teach.kursi_kursiyan:
    title: Stoel (enkelvoud / meervoud)
    gloss: stoel, stoelen
    note: 'Een nieuw zelfstandig naamwoord. Let op het meervoud: *kursi* (een) wordt *kursiyan* (meer dan een) -- een andere regel dan *kamra*/*kamre*, zie de grammaticanotitie van deze les.'
    example_gloss:
    - Er staat een stoel in de keuken.
    - Er staan vier stoelen in de keuken.
  hi.a1.unit18.lesson02.teach.chaar_review:
    title: 'Herhaling: vier'
    gloss: vier
    note: Eerder geleerd in les 2 -- hier opnieuw gebruikt om stoelen te tellen.
    example_gloss: Er staan vier stoelen in de keuken.
  hi.a1.unit18.lesson02.teach.grammar_feminine_plural:
    title: Vrouwelijk meervoud -i -> -iyan
    gloss: Vrouwelijke zelfstandige naamwoorden op '-i' krijgen in het meervoud '-iyan' -- 'kursi' (een) wordt 'kursiyan' (meer dan een), net zoals 'kamra' eerder in deze les 'kamre' werd volgens de mannelijke regel -- maar hier is de regel anders, omdat dit woord vrouwelijk is en op '-i' eindigt.
    note: De tweede meervoudsregel van deze les, bewust meteen na de eerste uitgelegd zodat het verschil goed te zien is.
  hi.a1.unit18.lesson02.teach.bistar:
    title: Bed
    gloss: bed
    note: Een nieuw zelfstandig naamwoord, in de oefeningen van deze les alleen in het enkelvoud gebruikt.
    example_gloss: Er staat een bed in de slaapkamer.
  hi.a1.unit18.lesson02.teach.khidki_khidkiyan:
    title: Raam (enkelvoud / meervoud)
    gloss: raam, ramen
    note: Volgt dezelfde vrouwelijke meervoudsregel '-i' -> '-iyan' als *kursi*/*kursiyan*.
    example_gloss:
    - Er is een raam in de slaapkamer.
    - Er zijn twee ramen in de slaapkamer.
  hi.a1.unit18.lesson02.teach.rasoi_mein_mez_phrase:
    title: Er staat een tafel in de keuken.
    gloss: Er staat een tafel in de keuken.
    note: Het patroon plaats + voorwerp, toegepast op de keuken.
  hi.a1.unit18.lesson02.teach.bedroom_mein_bistar_phrase:
    title: Er staat een bed in de slaapkamer.
    gloss: Er staat een bed in de slaapkamer.
    note: Het patroon plaats + voorwerp, toegepast op de slaapkamer.
  hi.a1.unit18.lesson03.teach.kaisa_review:
    title: 'Herhaling: hoe is het / wat voor'
    gloss: hoe is het / wat voor
    note: Eerder geleerd in les 12 -- hier opnieuw gebruikt om naar een huis te vragen.
    example_gloss: Hoe is jouw huis?
  hi.a1.unit18.lesson03.teach.bada_chota_review:
    title: 'Herhaling: groot, klein'
    gloss: groot (mann.), groot (vrouw.), klein (mann.), klein (vrouw.)
    note: 'Eerder geleerd in les 14 -- hier opnieuw gebruikt om een huis te beschrijven. Het past zich aan het geslacht van het zelfstandig naamwoord aan: mannelijk *ghar* krijgt *bada*/*chota*, vrouwelijk *rasoi* krijgt *badi*.'
    example_gloss:
    - Mijn huis is klein.
    - Dit is een grote keuken.
  hi.a1.unit18.lesson03.teach.ya_review:
    title: 'Herhaling: of'
    gloss: of
    note: Eerder geleerd in les 14 -- hier opnieuw gebruikt om een keuzevraag te stellen.
    example_gloss: Is jouw huis groot of klein?
  hi.a1.unit18.lesson03.teach.arjun_priya_review:
    title: 'Herhaling: Arjun, Priya'
    gloss: Arjun, Priya
    note: Een herinnering aan de namen van beide personages, voordat de oefeningen woordvolgorde/grammaticacontrole van deze les ze gebruiken om aan te geven wiens huis er beschreven wordt.
    example_gloss:
    - Mijn naam is Arjun.
    - Mijn naam is Priya.
  hi.a1.unit18.lesson03.teach.ka_review:
    title: 'Herhaling: bezit met ''s'
    gloss: van (bezit, mannelijk zelfstandig naamwoord)
    note: Eerder behandeld in eenheid 7/10/12/14/15 – hier hergebruikt om aan te geven wiens huis er beschreven wordt, in de gewone basisvorm gedurende deze hele eenheid (zie de eigen opmerking over de afbakening in dit bestand).
    example_gloss: Priya's huis is klein.
  hi.a1.unit18.lesson03.teach.dialogue.line01:
    title: Arjun vraagt Priya naar haar huis
    gloss: Priya, is jouw huis groot of klein?
  hi.a1.unit18.lesson03.teach.dialogue.line02:
    title: Priya zegt dat haar huis klein is
    gloss: Mijn huis is klein. Er zijn twee kamers in het huis, een keuken en een badkamer.
  hi.a1.unit18.lesson03.teach.dialogue.line03:
    title: Priya stelt Arjun dezelfde vraag
    gloss: En jouw huis, Arjun?
  hi.a1.unit18.lesson03.teach.dialogue.line04:
    title: Arjun zegt dat zijn huis groot is
    gloss: Mijn huis is groot. Er zijn drie slaapkamers in het huis en een grote keuken.
  hi.a1.unit18.lesson03.teach.dialogue.line05:
    title: Priya vraagt wat er in de slaapkamer is
    gloss: Wow! Wat is er in de slaapkamer?
  hi.a1.unit18.lesson03.teach.dialogue.line06:
    title: Arjun beschrijft de slaapkamer
    gloss: In de slaapkamer staan een bed en twee ramen.
  hi.a1.unit18.lesson03.teach.dialogue.line07:
    title: Priya reageert
    gloss: Heel mooi!
  hi.a1.unit18.lesson03.teach.dialogue.line08:
    title: Arjun bedankt haar
    gloss: Bedankt!
  hi.a1.unit18.lesson03.teach.grammar_summary:
    title: Drie hoofdregels
    gloss: 'De drie hoofdregels van deze eenheid: (1) ''[plaats] + mein + [getal] + [zelfstandig naamwoord] + hai/hain'' geeft aan wat er in een huis is en hoeveel; (2) mannelijke woorden op ''-a'' krijgen in het meervoud ''-e'' (kamra -> kamre); (3) vrouwelijke woorden op ''-i'' krijgen in het meervoud ''-iyan'' (kursi -> kursiyan, khidki -> khidkiyan).'
    note: Een afsluitende samenvatting die de hele grammatica van de eenheid bij elkaar brengt, net als de grammaticanotities met paradigma's in eenheid 15-17.
  hi.a1.unit18.lesson03.teach.home_reading:
    title: Lezen over twee huizen
    gloss: Priya's huis is klein. Er zijn twee kamers in het huis, een keuken en een badkamer. Arjuns huis is groot. Er zijn drie slaapkamers in het huis en een grote keuken.
    note: Een kort, direct profiel (zonder nieuwe verhaallijn) dat precies de feiten uit de dialoog herhaalt, zonder nieuwe beweringen – het sluit direct aan bij het doel 'een korte woningbeschrijving lezen'.
    glosses:
      घर: huis / thuis
      छोटा: klein
      कमरे: kamers
      रसोई: keuken
      बाथरूम: badkamer
      बड़ा: groot
      बेडरूम: slaapkamers
      बड़ी: groot (vrouwelijk)
