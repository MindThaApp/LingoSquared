teaching:
  hi.a1.unit26.lesson01.teach.jaiket_svetar:
    title: Jas, trui
    gloss: de jas, de trui
    note: '*जैकेट* is vrouwelijk en *स्वेटर* is mannelijk, wat je terugziet in de woorden die erbij horen: *मेरी जैकेट*, *मेरा स्वेटर*.'
    example_gloss:
    - Ik zoek een jas.
    - Ik heb een trui.
  hi.a1.unit26.lesson01.teach.paint_joote:
    title: Broek, schoenen
    gloss: de broek, de schoenen
    note: '*पैंट* is één woord voor één broek (*मेरी पैंट*), en *जूते* is het meervoud van *जूता*: een mannelijk woord op *-आ* krijgt in het meervoud *-ए*.'
    example_gloss:
    - Ik zoek een broek.
    - Ik zoek schoenen.
  hi.a1.unit26.lesson01.teach.main_ek_jaiket:
    title: Zeggen wat je zoekt
    gloss: Ik zoek een jas.
    note: 'Het werkwoord staat achteraan: *मैं एक जैकेट ढूँढ़ रहा हूँ*. *रहा हूँ* geeft de betekenis ''ben aan het zoeken'' (gebeurt nu), en *रहा* is de mannelijke vorm (een vrouw zegt *रही*).'
  hi.a1.unit26.lesson02.teach.saiz:
    title: Maat
    gloss: de maat
    note: '*साइज़* is een mannelijk woord, dus de woorden die erbij horen zijn ook mannelijk: *मेरा साइज़*.'
    example_gloss: Welke maat heeft u?
  hi.a1.unit26.lesson02.teach.apka_saiz_kya:
    title: Naar de maat vragen
    gloss: Welke maat heb je?
    note: '*कौन सा* (''welk'') vraagt naar één keuze uit een geheel, en *सा* congrueert met het zelfstandig naamwoord: *कौन सा साइज़*, maar *कौन सी जैकेट*. *आप* is het beleefde ''u'' voor een winkelmedewerker.'
  hi.a1.unit26.lesson02.teach.mera_saiz_em:
    title: Je maat zeggen
    gloss: Ik heb maat M.
    note: 'Hindi gebruikt hier geen werkwoord voor ''hebben'': *मेरा साइज़ एम है* is letterlijk ''mijn maat is M'', en *मेरा* congrueert met het mannelijke *साइज़*.'
  hi.a1.unit26.lesson03.teach.kala_neela:
    title: Zwart, blauw
    gloss: zwart, blauw
    note: De twee basiskleuren in deze les.
    example_gloss:
    - Ik wil de jas in het zwart.
    - Hebt u dit ook in het blauw?
  hi.a1.unit26.lesson03.teach.mujhe_vah_jaiket:
    title: Een kleur vragen
    gloss: Ik wil de jas in het zwart.
    note: '*मुझे ... चाहिए* is hoe Hindi ''ik wil'' zegt: de wens gebeurt ''aan mij'' (*मुझे*), en het gewenste ding staat vlak voor *चाहिए*.'
  hi.a1.unit26.lesson03.teach.kya_apke_pas:
    title: Naar een andere kleur vragen
    gloss: Hebt u dit ook in het blauw?
    note: '*आपके पास ... है?* (''bij u ... is?'') is de beleefde manier om te vragen ''heeft u ...?'', en *भी* (''ook'') staat na het woord waaraan het iets toevoegt.'
  hi.a1.unit26.lesson04.teach.kya_yah_jaiket:
    title: Vragen hoe het zit
    gloss: Past deze jas je?
    note: 'Hindi zegt over kleding dat die ''goed komt'': *ठीक आती है*. Het werkwoord congrueert met het ding: een vrouwelijke *जैकेट* geeft *आती*, en een mannelijke *स्वेटर* zou *आता* geven.'
  hi.a1.unit26.lesson04.teach.yah_ekdam_theek:
    title: Zeggen dat het goed past
    gloss: Hij past goed.
    note: '*एकदम* (''helemaal'') maakt er ''zit perfect'' van; *आती है* congrueert met de vrouwelijke *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_chhotee:
    title: Te klein
    gloss: Het is te klein.
    note: '*बहुत* staat voor het bijvoeglijk naamwoord en betekent hier ''te'': *बहुत छोटी*. Het bijvoeglijk naamwoord congrueert met de vrouwelijke *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_baree:
    title: Te groot
    gloss: Het is te groot.
    note: 'Zelfde patroon met *बड़ी*: *बड़ा* wordt *बड़ी* bij een vrouwelijk zelfstandig naamwoord, dus *बहुत बड़ी*.'
  hi.a1.unit26.lesson05.teach.nabbe:
    title: Negenhonderd
    gloss: negenhonderd
    note: '*नौ सौ* is het getal 900, gebruikt in de prijs van de jas.'
    example_gloss: De jas kost negenhonderd roepie.
  hi.a1.unit26.lesson05.teach.jaiket_kee_keemat:
    title: Een prijs noemen
    gloss: De jas kost negenhonderd roepie.
    note: 'Hindi zegt ''de prijs van de jas is ...'': *जैकेट की कीमत नौ सौ रुपये है*. *की* congrueert met het vrouwelijke *कीमत*, niet met *जैकेट*.'
  hi.a1.unit26.lesson05.teach.sardee_kee_jaiket:
    title: Een kassabon lezen
    gloss: 'Winterjas: maat M, kleur zwart. Prijs: negenhonderd roepie. Deze jas zit goed en is warm.'
    note: Let op de maat, de kleur, de prijs en de twee eigenschappen die over de jas worden genoemd.
    glosses:
      सर्दी: winter(jas)
      साइज़: maat
      रंग: kleur
      काला: zwart
      कीमत: prijs
      नौ: negen
      सौ: honderd
      रुपये: roepie
      जैकेट: jas
      आती: past
      गर्म: warm
  hi.a1.unit26.lesson06.teach.priya_yah_jaiket:
    title: Priya ziet de jas
    gloss: 'Priya: Deze jas is mooi! Welke maat heb jij?'
    note: '*अच्छी* congrueert met de vrouwelijke *जैकेट*. *तुम्हारा* is het informele ''jouw'', gebruikt tussen vrienden.'
  hi.a1.unit26.lesson06.teach.arjun_mera_saiz:
    title: Arjun vraagt of hij hem mag passen
    gloss: 'Arjun: Ik heb maat M. Mag ik hem passen?'
    note: '*पहनकर देखना* (''aandoen en kijken'') is hoe Hindi ''passen'' (kleding) zegt. *सकता हूँ* betekent ''kan'' of ''mag'', en een vrouw zegt *सकती हूँ*.'
  hi.a1.unit26.lesson06.teach.priya_zaroor_kya:
    title: Priya vraagt naar de pasvorm
    gloss: 'Priya: Natuurlijk. Zit hij goed?'
    note: '*यह* betekent ''hij/het'' of ''dit'', en *आती* congrueert met de vrouwelijke *जैकेट*.'
  hi.a1.unit26.lesson06.teach.arjun_han_yah:
    title: Arjun bevestigt
    gloss: 'Arjun: Ja, hij zit perfect en is ook warm.'
    note: 'Komt precies overeen met de kassabon die je eerder las: het is dezelfde jas.'
  hi.a1.unit26.lesson06.teach.priya_barhiya_tum:
    title: Priya vraagt naar de kleur
    gloss: 'Priya: Mooi! Neem je hem in zwart of in blauw?'
    note: '*या* (''of'') biedt een keuze. Het tweede *रंग* mag wegblijven: *काले रंग में ... या नीले में*. *तुम* is informeel.'
  hi.a1.unit26.lesson06.teach.arjun_main_ise:
    title: Arjun beslist
    gloss: 'Arjun: Ik neem hem in zwart.'
    note: '*लूँगा* is de toekomende tijd van *लेना* (''nemen''), het gebruikelijke werkwoord om in een winkel een keuze te maken. Een vrouw zegt *लूँगी*.'
  hi.a1.unit26.lesson06.teach.main_leta_hoon:
    title: लेता हूँ en लेता है
    gloss: Ik neem, hij neemt.
    note: '*-ता* is de uitgang voor gewoonten en congrueert met het onderwerp, terwijl *हूँ* bij *मैं* hoort en *है* bij *वह*.'
