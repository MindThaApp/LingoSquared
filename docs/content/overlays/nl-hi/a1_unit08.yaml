teaching:
  hi.a1.unit08.lesson01.teach.ghar_school:
    title: Thuis, school
    gloss: thuis / huis, school
    note: Twee veelvoorkomende plaatsen, die je in deze unit steeds tegenkomt.
    example_gloss:
    - Dit is een huis.
    - Dit is een school.
  hi.a1.unit08.lesson01.teach.aspatal_bank:
    title: Ziekenhuis, bank
    gloss: ziekenhuis, bank
    note: Nog twee veelvoorkomende plaatsen die je in een buurt moet kunnen vinden.
    example_gloss:
    - Dit is een ziekenhuis.
    - Dit is een bank.
  hi.a1.unit08.lesson01.teach.park_station:
    title: Park, station
    gloss: park, station
    note: De laatste twee veelvoorkomende plaatsen van deze unit.
    example_gloss:
    - Dit is een park.
    - Dit is een station.
  hi.a1.unit08.lesson01.teach.yahan_wahan:
    title: Hier, daar
    gloss: hier, daar
    note: Een basispaar om aan te wijzen waar iets is.
    example_gloss:
    - De school is hier.
    - De bank is daar.
  hi.a1.unit08.lesson01.teach.school_kahan_hai:
    title: Waar is de school?
    gloss: Waar is de school?
    note: Hergebruikt *kahaan* (waar), dat je al in unit 1 leerde, nu om naar een plaats te vragen in plaats van naar iemands herkomst.
  hi.a1.unit08.lesson01.teach.school_yahan_hai:
    title: De school is hier
    gloss: De school is hier.
    note: Een voorbeeldantwoord met *yahaan*.
  hi.a1.unit08.lesson01.teach.bank_kahan_hai:
    title: Waar is de bank?
    gloss: Waar is de bank?
    note: Hetzelfde vraagpatroon, nu met een andere plaats.
  hi.a1.unit08.lesson01.teach.bank_wahan_hai:
    title: De bank is daar
    gloss: De bank is daar.
    note: Een voorbeeldantwoord met *wahaan*.
  hi.a1.unit08.lesson02.teach.paas:
    title: Dichtbij
    gloss: dichtbij
    note: Hier voor het eerst als los woord aangeleerd -- het kwam alleen voor in voorbeeldzinnen van unit 2 (*mere paas*, 'ik heb', letterlijk 'bij mij in de buurt'), zonder dat het zelf werd uitgelegd.
    example_gloss: De bank is dichtbij.
  hi.a1.unit08.lesson02.teach.door:
    title: Ver
    gloss: ver
    note: Het tegenovergestelde van *paas*.
    example_gloss: Het station is ver weg.
  hi.a1.unit08.lesson02.teach.ke_paas_note:
    title: Ke paas
    gloss: '''Ke paas'' betekent dichtbij een plaats, zoals in ''school bank ke paas hai'' (de school is dichtbij de bank). Het is hetzelfde ''paas'' als eerder in ''mere paas'' (ik heb), maar daar betekende het ''in mijn bezit'', en hier betekent het ''in de buurt'' -- één woord, twee verschillende gebruiken.'
    note: Een nieuw voorzetsel, gebouwd op een woord dat je al kent. De eerdere betekenis wordt er uitdrukkelijk bij genoemd, zodat je de twee gebruiken niet door elkaar haalt.
    target_text: '''के पास'' का मतलब है किसी जगह के नज़दीक -- जैसे ''बैंक स्कूल के पास है''। यह वही ''पास'' है जो पहले ''मेरे पास'' (मेरे पास एक किताब है) में आया था, पर वहाँ इसका मतलब था ''मेरे स्वामित्व में'' (ik heb), और यहाँ इसका मतलब है ''नज़दीक'' (dichtbij) -- एक ही शब्द, दो अलग इस्तेमाल।'
  hi.a1.unit08.lesson02.teach.school_bank_ke_paas_hai:
    title: De school is dichtbij de bank
    gloss: De school is dichtbij de bank.
    note: Een voorbeeldzin met *ke paas*.
  hi.a1.unit08.lesson02.teach.samne_peeche:
    title: Voor, achter
    gloss: voor, achter
    note: Een tweede paar plaatswoorden, ook gebruikt met *ke*.
    example_gloss:
    - Het ziekenhuis is tegenover het station.
    - Het park ligt achter de school.
  hi.a1.unit08.lesson02.teach.samne_peeche_note:
    title: Samne en peeche
    gloss: '''Samne'' en ''peeche'' komen net als ''paas'' ook met ''ke'' voor -- en ze zijn elkaars tegenpool: ''paark school ke peeche hai'' en ''school paark ke samne hai'' beschrijven precies dezelfde situatie, alleen vanuit een andere kant bekeken.'
    note: Hetzelfde feit op twee manieren gezegd -- een nuttig grammaticapunt over hoe deze twee woorden zich tot elkaar verhouden.
  hi.a1.unit08.lesson02.teach.school_park_ke_samne_hai:
    title: De school is tegenover het park
    gloss: De school is tegenover het park.
    note: De andere kant van hetzelfde feit als *paark school ke peeche hai* hierboven.
  hi.a1.unit08.lesson03.teach.dakghar:
    title: Postkantoor
    gloss: postkantoor
    note: Een nieuwe veelvoorkomende plek voor de slotdialoog van deze unit.
    example_gloss: Het postkantoor is vlak bij de bank.
  hi.a1.unit08.lesson03.teach.dakghar_kahan_hai:
    title: Waar is het postkantoor?
    gloss: Waar is het postkantoor?
    note: Opent de slotdialoog van deze unit.
  hi.a1.unit08.lesson03.teach.dialogue.line01:
    title: Arjun vraagt naar het postkantoor
    gloss: Arjun vraagt Priya waar het postkantoor is.
    note: Hergebruikt de openingszin van deze les.
  hi.a1.unit08.lesson03.teach.dialogue.line02:
    title: Priya antwoordt
    gloss: Priya zegt dat het vlak bij de bank is.
    note: Hergebruikt *ke paas* uit les 2.
  hi.a1.unit08.lesson03.teach.dialogue.line03:
    title: Arjun vraagt naar het ziekenhuis
    gloss: 'Arjun zegt: oké, en waar is het ziekenhuis?'
    note: Hergebruikt *achchha* (oké / ik snap het) uit eerdere units.
  hi.a1.unit08.lesson03.teach.dialogue.line04:
    title: Priya antwoordt
    gloss: Priya zegt dat het ziekenhuis tegenover het station is.
    note: Hergebruikt *ke samne* uit les 2.
  hi.a1.unit08.lesson03.teach.dialogue.line05:
    title: Arjun vraagt of het ver is
    gloss: 'Arjun vraagt: is het station ver weg?'
    note: Hergebruikt *door* uit les 2.
  hi.a1.unit08.lesson03.teach.dialogue.line06:
    title: Priya bevestigt en zet tegenover elkaar
    gloss: Priya zegt ja, een beetje ver -- de bank is dichtbij.
    note: 'Introduceert *thoda* (een beetje) en blijft consistent: het station is ver weg, terwijl de bank dichtbij blijft.'
  hi.a1.unit08.lesson03.teach.dialogue.line07:
    title: Arjun vraagt naar het park
    gloss: 'Arjun zegt: oké, en waar is het park?'
  hi.a1.unit08.lesson03.teach.dialogue.line08:
    title: Priya antwoordt
    gloss: Priya zegt dat het park achter de school ligt.
    note: Hergebruikt *ke peeche* uit les 2.
  hi.a1.unit08.lesson03.teach.dialogue.line09:
    title: Arjun trekt een conclusie
    gloss: 'Arjun zegt: dus de school is tegenover het park!'
    note: Introduceert *to* (dus/dan) en koppelt het feit aan de grammaticanotitie over *samne*/*peeche* uit les 2.
  hi.a1.unit08.lesson03.teach.dialogue.line10:
    title: Priya bevestigt
    gloss: 'Priya zegt: ja, dat klopt!'
    note: Introduceert *sahi* (juist/correct).
  hi.a1.unit08.lesson03.teach.dialogue.line11:
    title: Arjun bedankt Priya
    gloss: 'Arjun zegt: heel erg bedankt, Priya!'
    note: Hergebruikt *bahut* (heel/veel) en *shukriya* uit eerdere units.
  hi.a1.unit08.lesson03.teach.dialogue.line12:
    title: Priya sluit af
    gloss: 'Priya zegt: geen probleem! Tot ziens.'
    note: Hergebruikt de vaste afsluitende zinnen van deze cursus uit eerdere units.
