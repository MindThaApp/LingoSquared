answer_policy:
  mujhe_verb_hai: This unit's central grammar point is the दात-subject obligation construction "X + verb-infinitive + है" (मुझे/तुम्हें/हमें/आपको + infinitive + है = "X needs/has to ___"). A typed answer that drops है entirely, or that appends हैं instead of है (है is invariant here -- it agrees with the infinitive verb, not the दात subject), should be marked incorrect -- this is the exact point being tested.
  kitne_ka_gender: '"टिकट कितने का है?" (how much is the ticket) is taught with का, treating टिकट as masculine -- the same कितने का/की gender-agreement rule unit07 already established. Many native speakers also use टिकट as feminine (टिकट कितने की है?), so की with टिकट is ACCEPTED as a valid alternative wherever typed; plural के with one ticket is the error the grammar_check targets.'
  train_gender: ट्रेन is grammatically feminine, so every habitual-present verb form describing it in this unit uses जाती है, never जाता है. A typed answer using जाता है for the train should be marked incorrect as a real agreement error.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's one new nasalized word, हमें, uses anusvara, verified against a direct codepoint check -- consistent with the already-established तुम्हें convention. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to state their own travel request, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Hindi A1
units:
  hi.a1.unit15.travel:
    title: Op reis
lessons:
  hi.a1.unit15.lesson01.station_jana:
    title: Ik moet naar het station
  hi.a1.unit15.lesson02.platform_samay:
    title: Perronnummer en tijd
  hi.a1.unit15.lesson03.priya_arjun_station:
    title: 'Priya en Arjun: op het station'
teaching:
  hi.a1.unit15.lesson01.teach.station_mujhe_hai_review:
    title: 'Herhaling: station, mij, is'
    gloss: station, mij / voor mij, is
    note: Een korte herhaling van het plaatsnaamwoord en de koppelterm die je nodig hebt voor de verplichtingsconstructie van deze les.
    example_gloss:
    - Het station is hier.
    - Ik heb werk.
  hi.a1.unit15.lesson01.teach.jaana:
    title: Gaan
    gloss: gaan (infinitief)
    note: De infinitief van het werkwoord dat je al kent als de तुम-imperatief *jao* (les 9) -- in deze les leer je de infinitief zelf.
    example_gloss: Ik moet gaan.
  hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai:
    title: Mujhe + werkwoord + hai = moeten
    gloss: '''Mujhe'' heb je al geleerd met ''chahiye'' (les 6, met een zelfstandig naamwoord) en met ''hai'' (les 11, zoals ''mujhe kaam hai'', ik heb werk). Nu komt het ook voor met een werkwoord: ''mujhe jana hai'' betekent ''ik moet gaan''. Let op -- bij ''jana'' blijft ''hai'' hetzelfde en wordt het nooit ''hain'': het komt niet overeen met de spreker.'
    note: Het derde gebruik van een patroon van voornaamwoord + koppelwerkwoord dat je al kent; de twee eerdere toepassingen staan hierboven met lesnummer, voordat het nieuwe werkwoord erbij komt.
  hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase:
    title: Ik moet naar het station.
    gloss: Ik moet naar het station.
    note: Het eerste volledige voorbeeld van de verplichtingsconstructie in deze les.
  hi.a1.unit15.lesson01.teach.tiket:
    title: Kaartje
    gloss: kaartje
    note: Een nieuw zelfstandig naamwoord, dat je in deze hele reisles nodig hebt.
    example_gloss: Waar is mijn kaartje?
  hi.a1.unit15.lesson01.teach.chahiye_review:
    title: 'Herhaling: willen / nodig hebben'
    gloss: willen / nodig hebben
    note: Eerst geleerd in les 6 met drankjes, hier opnieuw gebruikt met een kaartje.
    example_gloss: Ik wil graag thee.
  hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase:
    title: Ik heb een kaartje nodig.
    gloss: Ik heb een kaartje nodig.
    note: Het bekende patroon *mujhe...chahiye*, nu toegepast op het nieuwe woord van deze les.
  hi.a1.unit15.lesson01.teach.train:
    title: Trein
    gloss: trein
    note: Een nieuw zelfstandig naamwoord.
    example_gloss: De trein is groot.
  hi.a1.unit15.lesson01.teach.delhi_ka_review:
    title: 'Herhaling: Delhi, van / ''s'
    gloss: Delhi, van / 's (bezitsaanduiding)
    note: Delhi heb je in les 5 geleerd; het bezitswoord *ka* gebruik je al de hele cursus (bijvoorbeeld in les 5-14) -- hier gebruikt om de bestemming van een kaartje aan te geven.
    example_gloss:
    - Mijn broer woont in Delhi.
    - Dit is de tas van Arjun.
  hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase:
    title: Ik heb een kaartje naar Delhi nodig.
    gloss: Ik heb een kaartje naar Delhi nodig.
    note: Combineert het zelfstandig naamwoord van deze les met het patroon van het bezitsmarkeerder om een specifieke bestemming te noemen.
  hi.a1.unit15.lesson01.teach.kahan_tumhein_review:
    title: 'Herhaling: waar, aan jou'
    gloss: waar, aan jou / voor jou
    note: Beide al behandeld (unit 8 en unit 6) – hier hergebruikt om te vragen waar iemand heen moet.
    example_gloss:
    - Waar is de bank?
    - Wat wil je hebben?
  hi.a1.unit15.lesson02.teach.number_review:
    title: 'Herhaling: nummer'
    gloss: nummer
    note: Voor het eerst behandeld in unit 2 bij telefoonnummers – hier hergebruikt voor een perronnummer.
    example_gloss: Wat is jouw telefoonnummer?
  hi.a1.unit15.lesson02.teach.platform:
    title: Perron
    gloss: perron
    note: Een nieuw zelfstandig naamwoord, het gangbare Hindi woord voor perron op een station (een veelgebruikt leenwoord, met hetzelfde patroon als *phone* in unit 2).
    example_gloss: Het perron is groot.
  hi.a1.unit15.lesson02.teach.platform_number_kya_hai_phrase:
    title: Wat is het perronnummer?
    gloss: Wat is het perronnummer?
    note: Hergebruikt het bekende vraagpatroon met *kya hai* (bijv. telefoonnummer, prijs, leeftijd) voor een nieuw onderwerp.
  hi.a1.unit15.lesson02.teach.platform_number_teen_hai_phrase:
    title: Perron 3.
    gloss: Het is perron 3.
    note: Het natuurlijke antwoord in een volledige zin op de vraag hierboven.
  hi.a1.unit15.lesson02.teach.jaana_habitual_grammar:
    title: Jaati hai (vrouwelijke congruentie)
    gloss: '''Jaati hai'' gebruikt de regel van unit 10 voor -ta/-ti/-te + hai/hain, nu met het nieuwe werkwoord ''jana''. ''Train'' is grammaticaal vrouwelijk, dus het is ''jaati hai'' en niet ''jaata hai''.'
    note: Een directe, expliciete uitbreiding van het al bekende patroon voor het gewoontepresens, nu met een nieuw werkwoord en een nieuw (grammaticaal vrouwelijk) zelfstandig naamwoord.
  hi.a1.unit15.lesson02.teach.se_review:
    title: 'Herhaling: van, vanaf'
    gloss: van, vanaf
    note: Voor het eerst behandeld in unit 9 bij de routebeschrijving – hier hergebruikt voor het perron waarvan de trein vertrekt.
    example_gloss: Ga vanaf hier rechtdoor.
  hi.a1.unit15.lesson02.teach.train_platform_se_jaati_hai_phrase:
    title: De trein vertrekt van perron 3.
    gloss: De trein vertrekt van perron 3.
    note: Combineert de gewoontepresensvorm van deze les met het al behandelde voorzetsel 'van'.
  hi.a1.unit15.lesson02.teach.kitne_baje_review:
    title: 'Herhaling: hoe laat'
    gloss: hoe laat
    note: Voor het eerst behandeld in unit 4 bij het vertellen van de tijd – hier hergebruikt om naar een vertrektijd te vragen.
    example_gloss: Hoe laat is het?
  hi.a1.unit15.lesson02.teach.train_kitne_baje_jaati_hai_phrase:
    title: Hoe laat vertrekt de trein?
    gloss: Hoe laat vertrekt de trein?
    note: De vraag 'hoe laat' toegepast op een geplande vertrektijd in plaats van op de tijd van dit moment.
  hi.a1.unit15.lesson02.teach.train_chhah_baje_jaati_hai_phrase:
    title: De trein vertrekt om 6 uur.
    gloss: De trein vertrekt om 6 uur.
    note: Het natuurlijke antwoord in een volledige zin, met de meervoudsvorm *baje* uit unit 4 (zes is niet de uitzondering *baja*, die alleen voor één uur geldt).
  hi.a1.unit15.lesson02.teach.tiket_kitne_ka_hai_phrase:
    title: Hoeveel kost het kaartje?
    gloss: Hoeveel kost het kaartje?
    note: Hergebruikt de prijsvraag *kitne ka/ki* uit unit 7. *Tikat* wordt meestal als mannelijk behandeld (*ka*); veel sprekers gebruiken het ook als vrouwelijk (*kitne ki*), wat eveneens juist is.
  hi.a1.unit15.lesson02.teach.rupaye_review:
    title: 'Herhaling: roepies, vijftig'
    gloss: roepies, vijftig
    note: Beide voor het eerst behandeld in unit 2 bij prijzen en hoeveelheden – hier hergebruikt voor de prijs van een kaartje.
    example_gloss: Ik heb vijftig roepies.
  hi.a1.unit15.lesson02.teach.tiket_pachaas_rupaye_ka_hai_phrase:
    title: Het kaartje kost 50 roepies.
    gloss: Het kaartje kost 50 roepies.
    note: Het natuurlijke antwoord in een volledige zin op de prijsvraag hierboven.
  hi.a1.unit15.lesson03.teach.hum_hamein:
    title: Wij, aan ons
    gloss: wij, aan ons / voor ons
    note: '''Hum'' (wij) kwam al voor in unit 11 als het eerste persoonlijk voornaamwoord voor de eerste persoon meervoud; ''hamein'' is de datiefvorm ervan, nodig voor de dialoog over samen reizen.'
    example_gloss:
    - Met ons gaat het goed.
    - Wij moeten naar het station.
  hi.a1.unit15.lesson03.teach.hamein_grammar:
    title: 'Hamein: het vierde datiefvoornaamwoord'
    gloss: '''Hamein'' is de datiefvorm van ''hum'' (unit 11), net als ''mujhe'' (main) en ''tumhein'' (tum). Ook hier blijft ''hai'' bij ''jana'' gewoon hetzelfde en wordt het nooit ''hain'' – het congrueert niet met ''hum''/''hamein''.'
    note: 'Noemt alle drie eerdere datiefvoornaamwoorden met hun unitnummer voordat het vierde erbij komt, en wijst opnieuw op het punt uit de grammaticanotitie van de eerste les: ''hai'' congrueert met het werkwoord.'
  hi.a1.unit15.lesson03.teach.hamein_station_jana_hai_phrase:
    title: Wij moeten naar het station.
    gloss: Wij moeten naar het station.
    note: De constructie voor noodzaak met het nieuwe datiefvoornaamwoord in het meervoud.
  hi.a1.unit15.lesson03.teach.ki_review:
    title: 'Herhaling: van / ''s (vrouwelijk)'
    gloss: van / 's (bezitsmarkeerder, vrouwelijk)
    note: Voor het eerst behandeld in unit 7 samen met *ka*/*kitne* – hier hergebruikt omdat 'trein' grammaticaal vrouwelijk is, dus de bezitsvorm is 'ki' en niet 'ka'.
    example_gloss: Dit is de trein naar Delhi.
  hi.a1.unit15.lesson03.teach.dialogue.line01:
    title: Arjun zegt dat ze moeten gaan
    gloss: Priya, wij moeten naar het station.
  hi.a1.unit15.lesson03.teach.dialogue.line02:
    title: Priya heeft een kaartje naar Delhi nodig
    gloss: Oké. Ik heb een kaartje naar Delhi nodig.
  hi.a1.unit15.lesson03.teach.dialogue.line03:
    title: Arjun vraagt naar de prijs
    gloss: Ik ook. Hoeveel kost het kaartje?
  hi.a1.unit15.lesson03.teach.dialogue.line04:
    title: Priya noemt de prijs
    gloss: Het kaartje kost 50 roepies.
  hi.a1.unit15.lesson03.teach.dialogue.line05:
    title: Arjun vraagt naar de vertrektijd
    gloss: Goed. Hoe laat vertrekt de trein?
  hi.a1.unit15.lesson03.teach.dialogue.line06:
    title: Priya noemt de tijd en het perron
    gloss: De trein vertrekt om 6 uur, van perron 3.
  hi.a1.unit15.lesson03.teach.dialogue.line07:
    title: 'Arjun begrijpt het en zegt: laten we gaan'
    gloss: Begrepen. Kom, we gaan!
  hi.a1.unit15.lesson03.teach.dialogue.line08:
    title: Priya stemt in
    gloss: Kom, we gaan!
  hi.a1.unit15.lesson03.teach.grammar_summary:
    title: Drie hoofdregels
    gloss: 'De drie hoofdregels van deze unit: (1) ''mujhe/tumhein/hamein + werkwoord + hai'' betekent ''moeten ___''; (2) met ''X kitne ka/ki hai?'' vraag je naar de prijs; (3) met ''X [tijd] baje [plaats] se jaati hai'' geef je de tijd en plaats van een reis aan.'
    note: Een afsluitende samenvatting die de grammatica van de hele unit samenbrengt, zoals ook de grammaticanotitie van unit 14 het paradigma samenbracht.
  hi.a1.unit15.lesson03.teach.tiket_reading:
    title: Een kaartje lezen
    gloss: 'Kaartje: Delhi. Perron 3. 6 uur.'
    note: Een korte tekst op een kaartje, in losse zinsdelen (zoals een echt kaartje eruitziet), die precies de feiten uit de dialoog herhaalt, zonder nieuwe informatie.
    glosses:
      टिकट: kaartje
      प्लेटफ़ॉर्म: perron
      नंबर: nummer
      बजे: uur
