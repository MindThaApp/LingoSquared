teaching:
  hi.a1.unit16.lesson01.teach.tum_ho_review:
    title: 'Herhaling: jij, goed, ben/bent'
    gloss: jij (informeel), goed / in orde, ben/bent
    note: Een korte herhaling van de woorden die je nodig hebt om een vriend te vragen hoe hij of zij zich voelt.
    example_gloss: Hoe gaat het met je?
  hi.a1.unit16.lesson01.teach.mujhe_hai_review:
    title: 'Herhaling: aan mij, is'
    gloss: aan mij / voor mij, is
    note: De koppelwoordvorm die je nodig hebt voor de klachtconstructie van deze les.
    example_gloss: Ik heb werk.
  hi.a1.unit16.lesson01.teach.tum_theek_ho_phrase:
    title: Gaat het goed met je?
    gloss: Gaat het goed met je?
    note: De openingsvraag van de unit, om bij een vriend te informeren hoe het gaat.
  hi.a1.unit16.lesson01.teach.main_hoon_nahin_review:
    title: 'Herhaling: ik, ben, nee / niet'
    gloss: ik, ben, nee / niet
    note: Nodig om ontkennend te antwoorden op 'Gaat het goed met je?'.
    example_gloss: Het gaat goed met me.
  hi.a1.unit16.lesson01.teach.sir:
    title: Hoofd
    gloss: hoofd
    note: Een nieuw zelfstandig naamwoord, nodig voor de eerste klacht van deze unit.
    example_gloss: Mijn hoofd is groot.
  hi.a1.unit16.lesson01.teach.dard:
    title: Pijn
    gloss: pijn
    note: Een nieuw zelfstandig naamwoord. In combinatie met een lichaamsdeel benoemt het een specifieke pijn -- zie de grammaticanotitie van deze unit.
    example_gloss: Ik heb pijn.
  hi.a1.unit16.lesson01.teach.mujhe_sir_dard_hai_phrase:
    title: Ik heb hoofdpijn.
    gloss: Ik heb hoofdpijn.
    note: De eerste volledige klachtzin van de unit.
  hi.a1.unit16.lesson01.teach.grammar_symptom_hai:
    title: Mujhe + klacht + hai
    gloss: '''Mujhe + zelfstandig naamwoord + hai'' heb je al geleerd in unit 11 (''mujhe kaam hai'' = ik heb werk). Nu gebruik je het ook voor klachten: ''mujhe sir dard hai'' betekent ''ik heb hoofdpijn'' -- ''sir dard'' (sir = hoofd, dard = pijn) vormen samen ''hoofdpijn''. Dit is geen nieuwe grammatica, maar hetzelfde patroon als eerder.'
    note: Laat zien dat je een al geleerd patroon (datief + zelfstandig naamwoord + hai) nu ook voor klachten gebruikt, en noemt de eerdere unit waarin het voorkwam.
    target_text: '''मुझे + संज्ञा + है'' पहले यूनिट 11 में सीखा था (''मुझे काम है'' = ik heb werk)। अब यह लक्षण बताने के लिए भी इस्तेमाल होता है: ''मुझे सिर दर्द है'' का मतलब है ''ik heb hoofdpijn'' -- ''सिर दर्द'' (सिर = hoofd, दर्द = pijn) एक साथ मिलकर ''hoofdpijn'' बनाते हैं। यह कोई नया व्याकरण नहीं है, वही पुराना पैटर्न है।'
  hi.a1.unit16.lesson01.teach.bukhar:
    title: Koorts
    gloss: koorts
    note: Een nieuw zelfstandig naamwoord, de tweede klacht van deze unit.
    example_gloss: Heb je koorts?
  hi.a1.unit16.lesson01.teach.mujhe_bukhar_hai_phrase:
    title: Ik heb koorts.
    gloss: Ik heb koorts.
    note: Hetzelfde patroon van datief + zelfstandig naamwoord + hai, nu toegepast op de tweede klacht van deze les.
  hi.a1.unit16.lesson02.teach.tumhein_jaana_review:
    title: 'Herhaling: aan jou, gaan'
    gloss: aan jou / voor jou, gaan
    note: Beide al geleerd (unit 6 en unit 15) -- hier hergebruikt om over een bezoek aan de dokter te praten.
    example_gloss:
    - Wat wil je hebben?
    - Ik moet naar het station.
  hi.a1.unit16.lesson02.teach.ke_paas_review:
    title: 'Herhaling: bij / aan'
    gloss: bij / in de buurt van (een plaats)
    note: Voor het eerst behandeld in unit 8 -- hier hergebruikt, met een derde betekenis in de grammaticanotitie van deze les.
    example_gloss: De bank is bij de school.
  hi.a1.unit16.lesson02.teach.doctor:
    title: Dokter
    gloss: dokter
    note: Een nieuw zelfstandig naamwoord, het hoofdonderwerp van deze les.
    example_gloss: De dokter is goed.
  hi.a1.unit16.lesson02.teach.mujhe_doctor_ke_paas_jana_hai_phrase:
    title: Ik moet naar de dokter.
    gloss: Ik moet naar de dokter.
    note: Combineert *ke paas* met de verplichting *mujhe...jana hai* uit unit 15.
  hi.a1.unit16.lesson02.teach.grammar_ke_paas_third_sense:
    title: 'Ke paas: een derde betekenis'
    gloss: 'De eerste twee betekenissen van ''ke paas'' heb je eerder geleerd: nabij (unit 8: ''bank school ke paas hai'') en bezit (unit 2: ''mere paas ek kitab hai''). Nu een derde gebruik: naar een PERSOON toe gaan, dus iemand opzoeken -- ''doctor ke paas jana hai'' betekent ''ik moet naar de dokter''. Ook de constructie ''mujhe...jana hai'' uit unit 15 komt hier terug.'
    note: Noemt beide eerdere betekenissen met hun unitnummer voordat de derde wordt geïntroduceerd, en wijst erop dat de verplichtingsconstructie hergebruikt wordt.
  hi.a1.unit16.lesson02.teach.aaraam:
    title: Rust
    gloss: rust
    note: Een nieuw zelfstandig naamwoord, het eerste advies van deze unit.
    example_gloss: Ik heb rust nodig.
  hi.a1.unit16.lesson02.teach.chahiye_review:
    title: 'Herhaling: willen / nodig hebben'
    gloss: willen / nodig hebben
    note: Voor het eerst geleerd in unit 6, hier hergebruikt om te zeggen wat iemand nodig heeft.
    example_gloss: Ik wil graag thee.
  hi.a1.unit16.lesson02.teach.tumhein_aaraam_chahiye_phrase:
    title: Je hebt rust nodig.
    gloss: Je hebt rust nodig.
    note: Het bekende patroon *tumhein...chahiye* toegepast op het nieuwe zelfstandig naamwoord van deze les.
  hi.a1.unit16.lesson02.teach.dawa:
    title: Medicijn
    gloss: medicijn
    note: Een nieuw zelfstandig naamwoord, het tweede advies van deze unit.
    example_gloss: Ik heb medicijnen nodig.
  hi.a1.unit16.lesson02.teach.tumhein_dawa_chahiye_phrase:
    title: Je hebt medicijnen nodig.
    gloss: Je hebt medicijnen nodig.
    note: Hetzelfde *chahiye*-patroon, nu met medicijn.
  hi.a1.unit16.lesson02.teach.jaao_aur_review:
    title: 'Herhaling: ga!, en'
    gloss: ga!, en
    note: Beide al geleerd (unit 9 en unit 1/2) -- hier hergebruikt om twee adviezen te verbinden.
    example_gloss:
    - Ga rechtdoor.
    - Ik wil graag thee en koffie.
  hi.a1.unit16.lesson02.teach.karo_grammar:
    title: 'Karo: de gebiedende wijs op -o opnieuw gebruikt'
    gloss: '''Karo'' volgt dezelfde regel voor de gebiedende wijs met tum als eerder (''jao'', ''muro'', ''batao'', ''gino'' -- allemaal op ''-o''). Het is gevormd van ''karna'' (uit unit 11: ''maaf karna''): de stam ''kar'' plus ''-o'' geeft ''karo'', oftewel ''doe!''. ''Aaraam karo'' betekent ''Rust uit!'''
    note: Een directe, expliciete uitbreiding van de bekende regel voor de gebiedende wijs, toegepast op een werkwoord dat de leerling al als infinitief kent.
  hi.a1.unit16.lesson02.teach.aaraam_karo_phrase:
    title: Rust uit!
    gloss: Rust uit!
    note: De nieuwe gebiedende wijs toegepast op het eerste advies van deze unit.
  hi.a1.unit16.lesson02.teach.aaraam_karo_aur_doctor_ke_paas_jaao_phrase:
    title: Rust uit en ga naar de dokter.
    gloss: Rust uit en ga naar de dokter.
    note: Combineert de twee adviezen van deze les tot één natuurlijke aanwijzing, als voorbereiding op de leeskaart van les 3.
  hi.a1.unit16.lesson03.teach.dialogue.line01:
    title: Priya vraagt of het goed gaat met Arjun
    gloss: Arjun, gaat het goed met je?
  hi.a1.unit16.lesson03.teach.dialogue.line02:
    title: Arjun zegt dat hij hoofdpijn en koorts heeft
    gloss: Nee, ik heb hoofdpijn en koorts.
  hi.a1.unit16.lesson03.teach.dialogue.line03:
    title: Priya zegt dat hij rust nodig heeft
    gloss: Dat is niet goed. Je hebt rust nodig.
  hi.a1.unit16.lesson03.teach.dialogue.line04:
    title: Arjun wil ook medicijnen
    gloss: Ja, maar ik heb ook medicijnen nodig.
  hi.a1.unit16.lesson03.teach.dialogue.line05:
    title: Priya zegt dat hij naar de dokter moet
    gloss: Oké. Je moet naar de dokter.
  hi.a1.unit16.lesson03.teach.dialogue.line06:
    title: Arjun bedankt Priya
    gloss: Oké, bedankt.
  hi.a1.unit16.lesson03.teach.dialogue.line07:
    title: Priya zegt dat hij moet rusten
    gloss: Rust uit!
  hi.a1.unit16.lesson03.teach.dialogue.line08:
    title: Arjun stemt in
    gloss: Oké.
  hi.a1.unit16.lesson03.teach.grammar_summary:
    title: Drie hoofdregels
    gloss: 'De drie hoofdregels van deze unit: (1) ''mujhe/tumhein + klacht + hai'' geeft een gezondheidsklacht aan (bijv. ''mujhe bukhar hai''); (2) ''tumhein/mujhe + ding + chahiye'' geeft een behoefte aan (bijv. ''tumhein aaraam chahiye''); (3) ''X ke paas jana hai'' zegt naar wie je moet gaan (bijv. ''doctor ke paas jana hai'').'
    note: Een afsluitende samenvatting die de grammatica van de hele unit samenbrengt, net als de grammaticanotitie van unit 15 met het paradigma.
  hi.a1.unit16.lesson03.teach.advice_reading:
    title: Een advies lezen
    gloss: Rust uit. Ga naar de dokter.
    note: Een korte, directe aanwijzing (zonder verhalend kader, zoals gesproken adviezen echt klinken) die precies de feiten uit de dialoog herhaalt, zonder nieuwe beweringen.
    glosses:
      आराम: rusten
      करो: doen (gebiedende wijs, van करना)
      डॉक्टर: dokter
      जाओ: ga (gebiedende wijs, van जाना)
