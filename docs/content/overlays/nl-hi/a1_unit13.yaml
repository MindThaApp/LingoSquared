teaching:
  hi.a1.unit13.lesson01.teach.chai_coffee_review:
    title: 'Herhaling: thee, koffie'
    gloss: thee, koffie
    note: Een korte herhaling van de woorden uit les 6, die je nodig hebt om in deze les te praten over wat je wel en niet leuk vindt.
    example_gloss:
    - Ik wil thee.
    - Ik wil koffie.
  hi.a1.unit13.lesson01.teach.mujhe_review:
    title: 'Herhaling: aan mij'
    gloss: aan mij
    note: Het datiefvoornaamwoord dat je al kent en dat in les 6, 7 en 11 steeds terugkwam -- in deze les krijgt het een nieuw gezegde om mee te combineren.
    example_gloss: Ik wil thee.
  hi.a1.unit13.lesson01.teach.pasand:
    title: Leuk vinden / leuk gevonden
    gloss: leuk vinden / leuk gevonden
    note: Een zelfstandig naamwoord met de betekenis 'voorkeur/het aanspreken' (niet 'favoriet'). Samen met een datiefonderwerp (mujhe/tumhein) en het koppelwerkwoord hai/hain vormt het de zin voor 'ik vind ... leuk'.
    example_gloss: Ik hou van thee.
  hi.a1.unit13.lesson01.teach.pasand_hai_grammar:
    title: Pasand hai = vinden leuk, houden van
    gloss: '''Pasand hai'' betekent ''X bevalt me'', dus ''ik vind X leuk''. Het begint met mujhe/tumhein, net als ''mujhe...chahiye'' (unit 6). Maar anders dan bij ''chahiye'' (waar geen ''hai'' achter komt) heeft ''pasand'' altijd ''hai'' of ''hain'' erachter nodig.'
    note: Maakt het structurele verschil tussen chahiye (willen/nodig hebben) en pasand hai (leuk vinden) expliciet, zodat je de twee constructies niet door elkaar haalt.
  hi.a1.unit13.lesson01.teach.sangeet:
    title: Muziek
    gloss: muziek
    note: Een nieuw zelfstandig naamwoord, om de constructie met pasand hai te oefenen met een enkelvoudig, niet-telbaar onderwerp.
    example_gloss: Ik hou van muziek.
  hi.a1.unit13.lesson01.teach.haan_nahi_review:
    title: 'Herhaling: ja, niet'
    gloss: ja, niet
    note: Een korte herhaling van twee woorden uit het begin, die je in deze unit nodig hebt om op voorkeursvragen te antwoorden en te ontkennen.
    example_gloss:
    - Ja, ik hou van muziek.
    - Nee, ik hou niet van koffie.
  hi.a1.unit13.lesson01.teach.pasand_nahi_hai_phrase:
    title: Ik hou niet van koffie.
    gloss: Ik hou niet van koffie.
    note: 'Ontkenning werkt precies zoals in andere hai-zinnen die je al kent (bijv. ''yoga class nahin hai'' uit unit 3): nahin komt direct voor hai.'
  hi.a1.unit13.lesson01.teach.kitab_kitaben:
    title: Boek / boeken
    gloss: boek / boeken
    note: Een nieuw woordpaar, enkelvoud en meervoud, om te laten zien dat 'hai'/'hain' na pasand het getal volgt van datgene wat je leuk vindt.
    example_gloss:
    - Ik vind het boek leuk.
    - Ik hou van boeken.
  hi.a1.unit13.lesson01.teach.number_agreement_grammar:
    title: Hai of hain na pasand
    gloss: '''Hai'' of ''hain'' na ''pasand'' volgt het GETAL van datgene wat je leuk vindt, precies zoals bij ''mere paas...hai/hain'' (unit 2): chai/sangeet pasand hai (enkelvoud), kitaben pasand hain (meervoud).'
    note: Breidt de regel voor hai/hain-overeenkomst in getal uit unit 2 direct uit naar een nieuwe context, zonder een nieuw grammaticaal begrip in te voeren.
  hi.a1.unit13.lesson02.teach.tumhein_review:
    title: 'Herhaling: aan jou (informeel)'
    gloss: aan jou (informeel)
    note: Voor het eerst behandeld in unit 6 met chahiye ('tumhein...chahiye?'). In deze unit gebruik je hetzelfde datiefvoornaamwoord met pasand hai.
    example_gloss: Hou jij van muziek?
  hi.a1.unit13.lesson02.teach.kya_tumhein_pasand_hai_grammar:
    title: Kya tumhein...pasand hai?
    gloss: '''Kya'' aan het begin van een zin markeert een ja/nee-vraag (unit 1). ''Tumhein'' herhaalt het patroon met datiefonderwerp dat je al kent van ''tumhein...chahiye?'' (unit 6). Hier komt ''pasand hai'' in de plaats van ''chahiye''.'
    note: Bevestigt dat dit een toepassing is van een vraagpatroon dat je al kent en geen nieuw grammaticapunt.
  hi.a1.unit13.lesson02.teach.khel:
    title: Sport / spel
    gloss: sport / spel
    note: Een nieuw zelfstandig naamwoord. In de voorbeelden staat het bij 'yah' (dit), zodat het getal duidelijk blijft, want 'khel' verandert zelf niet tussen enkelvoud en meervoud.
    example_gloss: Ik vind deze sport leuk.
  hi.a1.unit13.lesson02.teach.yah_review:
    title: 'Herhaling: dit'
    gloss: dit
    note: Voor het eerst behandeld in unit 7 ('mujhe yah chahiye'). Hier gebruikt om duidelijk naar één 'khel' te verwijzen.
    example_gloss: Dit boek is goed.
  hi.a1.unit13.lesson02.teach.ya_review:
    title: 'Herhaling: of'
    gloss: of
    note: Voor het eerst behandeld in unit 6/7 bij het bestellen van eten en spullen. Hier gebruikt om een keuzevraag over voorkeuren te stellen.
    example_gloss: Thee of koffie?
  hi.a1.unit13.lesson02.teach.chai_ya_coffee_phrase:
    title: Hou je van thee of van koffie?
    gloss: Hou je van thee of van koffie?
    note: Combineert het tumhein-vraagpatroon van deze les met het al geleerde ya (of), om de leerling te laten kiezen.
  hi.a1.unit13.lesson02.teach.zyada:
    title: Meer
    gloss: meer
    note: Een nieuw woord dat direct voor 'pasand hai' komt om een voorkeur tussen twee genoemde dingen uit te drukken.
    example_gloss: Ik hou meer van thee.
  hi.a1.unit13.lesson02.teach.zyada_pasand_grammar:
    title: Zyada pasand hai = de voorkeur geven aan
    gloss: '''X zyada pasand hai'' betekent de voorkeur geven aan een van twee dingen. ''Mujhe chai zyada pasand hai'' betekent ''ik hou meer van thee'' / ''ik geef de voorkeur aan thee''.'
    note: 'Een uitbreiding van woordenschat, geen nieuwe grammatica: ''zyada'' bepaalt simpelweg het al bekende ''pasand hai'' nader.'
    target_text: '''X ज़्यादा पसंद है'' का मतलब है दो चीज़ों में से एक को तरजीह देना (de voorkeur geven) -- ''मुझे चाय ज़्यादा पसंद है'' का मतलब है ''Ik hou meer van thee'' / ''Ik geef de voorkeur aan thee''।'
  hi.a1.unit13.lesson03.teach.review_words:
    title: 'Herhaling: muziek, sport, boeken'
    gloss: muziek, sport/spel, boeken
    note: Een korte herhaling van de belangrijkste zelfstandige naamwoorden van deze unit, die je nodig hebt voor de dialoog en de leestekst.
    example_gloss:
    - Ik hou van muziek.
    - Ik vind deze sport niet leuk.
    - Ik hou van boeken.
  hi.a1.unit13.lesson03.teach.dialogue.line01:
    title: Arjun vraagt naar muziek
    gloss: Priya, hou jij van muziek?
  hi.a1.unit13.lesson03.teach.dialogue.line02:
    title: Priya zegt dat ze er veel van houdt
    gloss: Ja, ik hou erg van muziek. En jij?
  hi.a1.unit13.lesson03.teach.dialogue.line03:
    title: Arjun is het met haar eens en voegt sport toe
    gloss: Ik ook! En ik hou ook van sport.
  hi.a1.unit13.lesson03.teach.dialogue.line04:
    title: Priya houdt meer van boeken dan van dit spel
    gloss: Leuk! Ik vind dit spel niet leuk. Ik hou van boeken.
  hi.a1.unit13.lesson03.teach.dialogue.line05:
    title: 'Arjun vraagt: thee of koffie?'
    gloss: Oké. Hou je van thee of van koffie?
  hi.a1.unit13.lesson03.teach.dialogue.line06:
    title: Priya geeft de voorkeur aan thee
    gloss: Ik hou meer van thee.
  hi.a1.unit13.lesson03.teach.dialogue.line07:
    title: Arjun is het met haar eens
    gloss: Heel goed! Ik hou ook van thee.
  hi.a1.unit13.lesson03.teach.dialogue.line08:
    title: Priya sluit af
    gloss: Oké! Zien we elkaar morgen weer?
  hi.a1.unit13.lesson03.teach.chahiye_pasand_zyada_grammar:
    title: Drie verwante patronen
    gloss: 'De drie patronen van deze unit: na ''chahiye'' (willen/nodig hebben, unit 6) komt geen ''hai''; ''pasand hai/hain'' (deze unit) volgt het getal van het genoemde ding; ''zyada pasand hai'' betekent de voorkeur geven aan een van twee dingen.'
    note: Een afsluitende samenvatting die de grammatica van de hele unit samenbrengt, net als de grammaticanotitie met het paradigma in unit 12.
    target_text: 'इस यूनिट के तीन तरीके: ''चाहिए'' (चाहना/ज़रूरत, यूनिट 6) के बाद ''है'' नहीं आता; ''पसंद है/हैं'' (यह यूनिट) चीज़ की संख्या से बदलता है; ''ज़्यादा पसंद है'' का मतलब है दो में से एक को तरजीह देना (de voorkeur geven)।'
  hi.a1.unit13.lesson03.teach.priya_note:
    title: Priya's briefje
    gloss: Arjun, ik hou erg van muziek. Ik hou ook van boeken. Ik vind dit spel niet leuk. Ik hou meer van thee. - Priya
    note: Een kort geschreven briefje dat precies de feiten herhaalt die in de dialoog al zijn genoemd, zonder nieuwe beweringen.
    glosses:
      संगीत: muziek
      बहुत: heel erg
      पसंद: leuk gevonden / bevallend
      किताबें: boeken
      खेल: spel
      नहीं: niet
      चाय: thee
      ज़्यादा: meer / bij voorkeur
