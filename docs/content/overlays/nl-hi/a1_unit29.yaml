teaching:
  hi.a1.unit29.lesson01.teach.kul_kitna_hua:
    title: Naar de totaalprijs vragen
    gloss: Hoeveel kost het in totaal?
    note: '*कुल* betekent ''totaal'', en *कितना हुआ?* (''hoeveel is het geworden?'') is de gewone manier om naar het totaalbedrag te vragen.'
  hi.a1.unit29.lesson01.teach.kul_pachchees_rupye:
    title: Een totaalprijs noemen
    gloss: Het kost in totaal tweehonderdvijftig roepie.
    note: '*हुए* komt overeen met het meervoud *रुपये*: *कुल दो सौ पचास रुपये हुए* is letterlijk ''in totaal kwamen er tweehonderdvijftig roepie''.'
  hi.a1.unit29.lesson02.teach.kard_se_pement:
    title: Met pinpas of contant betalen
    gloss: met pinpas betalen, contant betalen
    note: Hindi zegt *कार्ड से पेमेंट करना* ('betaling doen met kaart') en *नकद पेमेंट करना*; *से* geeft het betaalmiddel aan.
    example_gloss:
    - Kan ik hier met pinpas betalen?
    - Ik betaal contant.
  hi.a1.unit29.lesson02.teach.kya_main_yahan:
    title: Vragen of pinbetaling mogelijk is
    gloss: Kan ik hier met pinpas betalen?
    note: '*यहाँ* (''hier'') geeft de plaats aan, en *सकता हूँ* (''kan'') komt na de hoofdwoorden; een vrouw zegt *सकती हूँ*.'
  hi.a1.unit29.lesson02.teach.ap_nakad_pement:
    title: Vragen naar de betaalvoorkeur
    gloss: Wilt u contant of met pinpas betalen?
    note: '*आप ... करेंगे* is de beleefde toekomende vraag die een kassier gebruikt, en bij *आप* hoort het meervoudige werkwoord *करेंगे*.'
  hi.a1.unit29.lesson03.teach.bil:
    title: De rekening
    gloss: de rekening
    note: '*बिल* is een mannelijk woord: *एक बिल*, *बिल का*.'
    example_gloss: Zullen we de rekening delen?
  hi.a1.unit29.lesson03.teach.bil_bant_len:
    title: Voorstellen de rekening te delen
    gloss: Zullen we de rekening delen?
    note: '*बाँट लें?* (''zullen we splitsen?'') stelt een gezamenlijk plan voor zonder *हम* te zeggen; *लें* is de ''laten we''-vorm van *लेना*.'
  hi.a1.unit29.lesson03.teach.kya_main_alag:
    title: Vragen om apart te betalen
    gloss: Mag ik apart betalen?
    note: '*अलग से* betekent ''apart'' en staat vóór *पेमेंट कर सकता हूँ*.'
  hi.a1.unit29.lesson04.teach.bakee_paise:
    title: Het wisselgeld
    gloss: het wisselgeld
    note: '*बाकी पैसे* (''het resterende geld'') is meervoud en betekent het wisselgeld dat je terugkrijgt.'
    example_gloss: Hier is uw wisselgeld.
  hi.a1.unit29.lesson04.teach.ye_rahe_apke:
    title: Wisselgeld teruggeven
    gloss: Hier is uw wisselgeld.
    note: '*आपके* is het beleefde ''uw'' (*आप* + *के*) en komt overeen met het meervoud *पैसे*.'
  hi.a1.unit29.lesson04.teach.mujhe_bakee_paise:
    title: Wisselgeld weigeren
    gloss: Ik heb geen wisselgeld nodig.
    note: '*मुझे ... नहीं चाहिए* (''mij ... niet nodig'') is hoe Hindi ''ik heb ... niet nodig'' zegt; *नहीं* staat vóór *चाहिए*.'
  hi.a1.unit29.lesson05.teach.paintees:
    title: Driehonderdvijftig
    gloss: driehonderdvijftig
    note: '*तीन सौ पचास* is 350: zeg eerst de honderdtallen, dan de tientallen.'
    example_gloss: Dat kost driehonderdvijftig roepies.
  hi.a1.unit29.lesson05.teach.bil_do_thalee:
    title: Een restaurantrekening lezen
    gloss: 'Rekening: twee thali''s en twee kopjes thee. Totaal: driehonderdvijftig roepies. Betaald met de kaart.'
    note: Let op wat er besteld is, wat het totaal is en hoe er is betaald.
    glosses:
      बिल: rekening
      दो: twee
      थाली: thali's
      चाय: kopjes thee
      कुल: totaal
      तीन: drie
      सौ: honderd
      पचास: vijftig
      रुपये: roepies
      पेमेंट: betaling
      कार्ड: pinpas
  hi.a1.unit29.lesson06.teach.priya_bil_mang:
    title: Priya vraagt om de rekening
    gloss: 'Priya: Zullen we de rekening vragen?'
    note: '*माँग लें?* (''zullen we erom vragen?'') gebruikt opnieuw de ''laten we''-vorm van *लेना*, en *माँगना* betekent ''vragen om''.'
  hi.a1.unit29.lesson06.teach.arjun_han_achchha:
    title: Arjun vraagt naar het totaal
    gloss: 'Arjun: Ja, goed idee. Hoeveel is het in totaal?'
    note: '*कुल कितना हुआ?* is de totaalvraag van eerder, nu aan tafel gesteld.'
  hi.a1.unit29.lesson06.teach.priya_paintees_rupye:
    title: Priya noemt het totaal
    gloss: 'Priya: Het is driehonderdvijftig roepies. Zullen we het delen?'
    note: '*तीन सौ पचास रुपये हुए* noemt het totaal, en *बाँट लें?* vraagt: ''zullen we het delen?'''
  hi.a1.unit29.lesson06.teach.arjun_naheen_aj:
    title: Arjun staat erop te betalen
    gloss: 'Arjun: Nee, laat mij vandaag betalen. Je hebt me zo veel geholpen.'
    note: '*मुझे पेमेंट करने दो* betekent ''laat mij betalen'', en *तुमने मेरी बहुत मदद की है* gebruikt *ने* omdat het werkwoord in de verleden tijd staat.'
  hi.a1.unit29.lesson06.teach.priya_tum_kitne:
    title: Priya is ontroerd
    gloss: 'Priya: Wat lief van je! Hartelijk dank.'
    note: '*तुम कितने अच्छे हो!* (''wat ben je aardig'') is een warm compliment, en *शुक्रिया* betekent ''bedankt''.'
  hi.a1.unit29.lesson06.teach.arjun_kya_main:
    title: Arjun vraagt of hij met de kaart kan betalen
    gloss: 'Arjun: Kan ik hier met de kaart betalen?'
    note: De vraag *क्या मैं यहाँ कार्ड से पेमेंट कर सकता हूँ?* komt weer terug, nu in een echt restaurant.
  hi.a1.unit29.lesson06.teach.arjun_bil_deta:
    title: 'देता है: hij betaalt'
    gloss: Arjun betaalt de rekening.
    note: '*देता है* is de *वह*-vorm van *देना* (''geven''); in het Hindi zeg je ''de rekening geven'' voor ''de rekening betalen''.'
