teaching:
  hi.a1.unit04.lesson01.teach.baje:
    title: Uur
    gloss: uur (vanaf twee)
    note: Gebruikt bij elk uur behalve één -- zie de bijzondere vorm voor *één uur* verderop in deze les.
    example_gloss: Het is nu vijf uur.
  hi.a1.unit04.lesson01.teach.abhi:
    title: Nu
    gloss: nu
    note: Een simpel tijdwoord dat je voortdurend gebruikt als je de tijd zegt.
    example_gloss: Het is nu tien uur.
  hi.a1.unit04.lesson01.teach.ek_do_teen:
    title: Een, twee, drie
    gloss: een, twee, drie
    note: 'Herhaald uit les 2 en hier nodig om de tijd te zeggen -- let op: *ek* krijgt de bijzondere vorm *baja*, terwijl *do* en *teen* de gewone vorm *baje* krijgen.'
    example_gloss:
    - Het is nu één uur.
    - Het is nu twee uur.
    - Het is nu drie uur.
  hi.a1.unit04.lesson01.teach.chaar_paanch_chhah:
    title: Vier, vijf, zes
    gloss: vier, vijf, zes
    note: Herhaald uit les 2 -- alle drie krijgen de gewone vorm *baje*.
    example_gloss:
    - Het is nu vier uur.
    - Het is nu vijf uur.
    - Het is nu zes uur.
  hi.a1.unit04.lesson01.teach.saat_aath_nau:
    title: Zeven, acht, negen
    gloss: zeven, acht, negen
    note: Herhaald uit les 2.
    example_gloss:
    - Het is nu zeven uur.
    - Het is nu acht uur.
    - Het is nu negen uur.
  hi.a1.unit04.lesson01.teach.das_gyaarah_baarah:
    title: Tien, elf, twaalf
    gloss: tien, elf, twaalf
    note: Herhaald uit les 2 -- de laatste van de uurgetallen die je nodig hebt.
    example_gloss:
    - Het is nu tien uur.
    - Het is nu elf uur.
    - Het is nu twaalf uur.
  hi.a1.unit04.lesson01.teach.baja_grammar_note:
    title: Baja of baje
    gloss: '*Baja* hoort bij *één*, *baje* hoort bij elk ander getal: *ek baja hai*, *do baje hain*.'
    note: Een echte uitzondering op de overeenkomst, geen vereenvoudiging -- *ek baja hai* is het enige uur met de enkelvoudsvorm.
  hi.a1.unit04.lesson01.teach.kitne_baje_hain:
    title: Naar de tijd vragen
    gloss: Hoe laat is het?
    note: Letterlijk "hoeveel uur zijn het" -- de standaardmanier om naar de tijd te vragen.
  hi.a1.unit04.lesson01.teach.abhi_paanch_baje_hain:
    title: De tijd zeggen
    gloss: Het is nu vijf uur.
    note: Het natuurlijke antwoord in een volledige zin op *Kitne baje hain?*
  hi.a1.unit04.lesson02.teach.yoga_class_reprise:
    title: Yogales
    gloss: yogales
    note: Herhaald uit les 1 -- het voorbeeld dat in deze les steeds terugkomt om af te spreken.
    example_gloss: De yogales is vandaag.
  hi.a1.unit04.lesson02.teach.subah:
    title: Ochtend
    gloss: ochtend
    note: Een van de vier woorden voor delen van de dag in deze les.
    example_gloss: De yogales is 's ochtends.
  hi.a1.unit04.lesson02.teach.dopahar:
    title: Middag / twaalf uur 's middags
    gloss: middag
    note: Geldt zowel voor het middaguur (twaalf uur) als voor de vroege middag.
    example_gloss: '''s Middags is er geen les.'
  hi.a1.unit04.lesson02.teach.shaam:
    title: Avond
    gloss: avond
    note: Het deel van de dag na *dopahar* en voor *raat*.
    example_gloss: De volgende les is om vijf uur 's avonds.
  hi.a1.unit04.lesson02.teach.raat:
    title: Nacht
    gloss: nacht
    note: Het laatste van de vier woorden voor delen van de dag.
    example_gloss: '''s Nachts is er geen les.'
  hi.a1.unit04.lesson02.teach.ko_reprise:
    title: Ko bij een algemeen tijdstip
    gloss: '*Ko* staat bij een woord voor een deel van de dag als er geen bepaald uur wordt genoemd: *dopahar ko*, *raat ko*.'
    note: Dezelfde *ko* die een dag van de week markeert (eenheid 3) markeert nu een algemeen deel van de dag -- een echte, natuurlijke constructie, maar niet de enige die deze eenheid behandelt (zie de volgende notitie voor de vorm met een specifiek uur).
  hi.a1.unit04.lesson02.teach.time_of_day_baje_note:
    title: Een deel van de dag direct voor baje
    gloss: 'Bij een specifiek uur staat het woord voor het deel van de dag direct voor *baje*, zonder iets ertussen: *subah saat baje*, *shaam paanch baje*.'
    note: Hier geen *ko* -- die is bedoeld voor een algemeen deel van de dag zonder specifiek uur, zoals de vorige notitie uitlegt.
  hi.a1.unit04.lesson02.teach.class_kitne_baje_hai:
    title: Vragen hoe laat de les is
    gloss: Hoe laat is de les?
    note: Hetzelfde patroon met *kitne baje* als in les 1, nu om te vragen naar een gebeurtenis in plaats van naar de huidige tijd.
  hi.a1.unit04.lesson02.teach.class_subah_saat_baje_hai:
    title: Het tijdstip van een gebeurtenis noemen
    gloss: De les is om zeven uur 's ochtends.
    note: Combineert *subah* direct met *saat baje*, volgens de grammaticanotitie hierboven.
  hi.a1.unit04.lesson03.teach.kal:
    title: Morgen / gisteren
    gloss: morgen, gisteren
    note: Hindi gebruikt één woord voor beide -- de context (en de werkwoordstijd) laat zien welke bedoeld is. In deze les betekent het altijd "morgen".
    example_gloss: Morgen is de les om vijf uur 's middags.
  hi.a1.unit04.lesson03.teach.agli_reprise:
    title: Volgende
    gloss: volgende
    note: Hergebruikt uit eenheid 3 -- vrouwelijke vorm, passend bij het vrouwelijke *class*.
    example_gloss: De volgende les is morgen.
  hi.a1.unit04.lesson03.teach.theek_hai_shukriya_reprise:
    title: Oké, bedankt
    gloss: Oké, bedankt!
    note: Beide woorden komen uit de afscheidswoordenschat van eenheid 1.
  hi.a1.unit04.lesson03.teach.milte_hain_reprise:
    title: We zien elkaar / tot ziens
    gloss: we zien elkaar / tot ziens
    note: Hergebruikt uit het afscheid aan het eind van eenheid 3, nu samen met *kal* voor "tot morgen".
  hi.a1.unit04.lesson03.teach.agli_class_kitne_baje_hai:
    title: Vragen hoe laat de volgende les is
    gloss: Hoe laat is de volgende les?
    note: Combineert *agli* (vrouwelijk, passend bij class) met het patroon *kitne baje* uit deze eenheid.
  hi.a1.unit04.lesson03.teach.agli_class_shaam_paanch_baje_hai:
    title: Het tijdstip van de volgende les noemen
    gloss: De volgende les is om vijf uur 's middags.
    note: Het natuurlijke antwoord in een volledige zin op de vraag hierboven.
  hi.a1.unit04.lesson03.teach.kal_milte_hain:
    title: Afsluiten met een afspraak voor morgen
    gloss: Oké, tot morgen!
    note: De natuurlijke manier om een gesprek af te sluiten als een tijdstip is afgesproken.
  hi.a1.unit04.lesson03.teach.dialogue.line01:
    title: Arjun vraagt naar de volgende les
    gloss: Arjun vraagt hoe laat de volgende les is.
    note: Gebruikt precies de vraag uit deze les.
  hi.a1.unit04.lesson03.teach.dialogue.line02:
    title: Priya noemt de tijd
    gloss: Priya zegt dat de volgende les om vijf uur 's middags is.
    note: Gebruikt precies de antwoordzin uit deze les.
  hi.a1.unit04.lesson03.teach.dialogue.line03:
    title: Arjun bedankt haar
    gloss: Arjun zegt oké, bedankt.
    note: Hergebruikt uit de woordenschat van eenheid 1.
  hi.a1.unit04.lesson03.teach.dialogue.line04:
    title: Priya sluit het gesprek af
    gloss: Priya stemt in en zegt tot morgen.
    note: Gebruikt precies de afsluitende zin uit deze les.
