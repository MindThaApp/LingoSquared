teaching:
  hi.a1.unit03.lesson01.teach.aaj:
    title: Vandaag
    gloss: vandaag
    note: Een woord dat je in bijna elke zin van deze les opnieuw gebruikt.
    example_gloss: Het weer is vandaag mooi.
  hi.a1.unit03.lesson01.teach.somvar:
    title: Maandag
    gloss: maandag
    note: Genoemd naar सोम (de Maan) -- net als in het Nederlands maandag, de dag van de maan.
    example_gloss: De yogales is op maandag.
  hi.a1.unit03.lesson01.teach.mangalvar:
    title: dinsdag
    gloss: dinsdag
    note: Genoemd naar मंगल (Mars), hetzelfde patroon als bij de meeste Hindi dagnamen.
    example_gloss: Vandaag is het dinsdag.
  hi.a1.unit03.lesson01.teach.budhvar:
    title: woensdag
    gloss: woensdag
    note: Genoemd naar बुध (Mercurius).
    example_gloss: Vandaag is het woensdag.
  hi.a1.unit03.lesson01.teach.guruvar:
    title: donderdag
    gloss: donderdag
    note: Genoemd naar गुरु (Jupiter).
    example_gloss: Vandaag is het donderdag.
  hi.a1.unit03.lesson01.teach.shukravar:
    title: vrijdag
    gloss: vrijdag
    note: Genoemd naar शुक्र (Venus).
    example_gloss: Op vrijdag is er geen yogales.
  hi.a1.unit03.lesson01.teach.shanivar:
    title: Zaterdag
    gloss: zaterdag
    note: Genoemd naar शनि (Saturnus).
    example_gloss: Vandaag is het zaterdag.
  hi.a1.unit03.lesson01.teach.ravivar:
    title: Zondag
    gloss: zondag
    note: Genoemd naar रवि, een Sanskrietische naam voor de zon -- net als in het Nederlands zondag, de dag van de zon.
    example_gloss: Vandaag is het zondag.
  hi.a1.unit03.lesson01.teach.kaun_sa_din_hai:
    title: Vragen welke dag het is
    gloss: Welke dag is het vandaag?
    note: '*Kaun sa* ("welke") komt overeen met het mannelijke woord *din* ("dag") -- de vrouwelijke vorm *kaun si* zie je later bij vrouwelijke woorden.'
  hi.a1.unit03.lesson01.teach.yoga_class_monday:
    title: Zeggen dat iets op een bepaalde dag is
    gloss: De yogales is op maandag.
    note: '*Ko* na een dagnaam betekent "op" -- *somvar ko* is "op maandag", hetzelfde patroon voor elke dag van de week.'
  hi.a1.unit03.lesson01.teach.no_class_friday:
    title: Zeggen dat iets niet op een bepaalde dag is
    gloss: Op vrijdag is er geen yogales.
    note: Nahin maakt de zin ontkennend; ko markeert nog steeds de dag, hier voor de nadruk helemaal vooraan.
  hi.a1.unit03.lesson02.teach.jan_feb_mar:
    title: Januari, februari, maart
    gloss: januari, februari, maart
    note: De Hindi maandnamen zijn grotendeels geleend en direct herkenbaar als je het patroon kent -- geen nieuwe grammatica, alleen woordenschat.
    example_gloss:
    - Ik ben jarig in januari.
    - De volgende feestdag is in februari.
    - Ik ben jarig in maart.
  hi.a1.unit03.lesson02.teach.apr_may_jun:
    title: April, mei, juni
    gloss: april, mei, juni
    note: Hetzelfde herkenbare patroon als bij de eerste drie maanden.
    example_gloss:
    - De volgende feestdag is in april.
    - Ik ben jarig in mei.
    - De volgende feestdag is in juni.
  hi.a1.unit03.lesson02.teach.jul_aug_sep:
    title: Juli, augustus, september
    gloss: juli, augustus, september
    note: Sitambar is hier geschreven met een anusvara (सितंबर); de spelling met een halve m (सितम्बर) komt ook veel voor en is even correct.
    example_gloss:
    - Ik ben jarig in juli.
    - De volgende feestdag is in augustus.
    - Ik ben jarig in september.
  hi.a1.unit03.lesson02.teach.oct_nov_dec:
    title: Oktober, november, december
    gloss: oktober, november, december
    note: Navambar en disambar hebben dezelfde anusvara-spelling als sitambar; नवम्बर en दिसम्बर (met een halve m) komen ook veel voor en zijn even correct.
    example_gloss:
    - De volgende feestdag is in oktober.
    - Ik ben jarig in november.
    - De volgende feestdag is in december.
  hi.a1.unit03.lesson02.teach.tareekh:
    title: Datum
    gloss: datum
    note: '*Tareekh* is een vrouwelijk woord -- het vraagwoord krijgt de vrouwelijke vorm (*kitni tareekh*, nooit *kitna tareekh*), hetzelfde congruentiepatroon dat in les 2 bij *keemat* en *umra* aan bod kwam.'
    example_gloss: Het is vandaag de derde.
  hi.a1.unit03.lesson02.teach.mein_postposition:
    title: In (bij een maand)
    gloss: in -- gebruikt bij een maandnaam
    note: '*Mein* hoort bij een maand zoals *ko* bij een dag: *janvari mein* is "in januari", nooit *janvari ko*.'
  hi.a1.unit03.lesson02.teach.aaj_kitni_tareekh_hai:
    title: Naar de datum vragen
    gloss: Welke datum is het vandaag?
    note: Letterlijk "hoeveelste is de datum van vandaag" -- kitni komt overeen met het vrouwelijke tareekh.
  hi.a1.unit03.lesson02.teach.aaj_teen_tareekh_hai:
    title: De datum noemen, alleen met een getal
    gloss: Het is vandaag de derde.
    note: Het Hindi noemt een datum met een gewoon hoofdtelwoord (*teen*, "drie"), terwijl het Nederlands een rangtelwoord gebruikt als "de derde" -- er is geen apart "datumwoord" om te leren, alleen de getallen die je al kent.
  hi.a1.unit03.lesson02.teach.aaj_teen_january_hai:
    title: De datum noemen, met de maand
    gloss: Het is vandaag drie januari.
    note: Hetzelfde patroon met een hoofdtelwoord, nu met de maandnaam erachter.
  hi.a1.unit03.lesson03.teach.kab:
    title: Wanneer
    gloss: wanneer
    note: Een eenvoudig vraagwoord dat je heel vaak hoort.
    example_gloss: Wanneer is de volgende les?
  hi.a1.unit03.lesson03.teach.agli:
    title: Volgende
    gloss: volgende
    note: '*Agli* is de vrouwelijke vorm -- *class* (क्लास) wordt in het alledaagse Hindi als vrouwelijk woord behandeld, dus het krijgt *agli* en niet het mannelijke *agla*.'
    example_gloss: De volgende les is op dinsdag.
  hi.a1.unit03.lesson03.teach.das_reprise:
    title: Tien
    gloss: tien
    note: Herhaald uit les 2 -- hier nodig voor een echte datum.
    example_gloss: De volgende les is op de tiende.
  hi.a1.unit03.lesson03.teach.janmadin:
    title: Verjaardag
    gloss: verjaardag
    note: Een mannelijk woord -- mera janmadin, nooit meri janmadin.
    example_gloss: Ik ben jarig in december.
  hi.a1.unit03.lesson03.teach.tumhara_janmadin_kab_hai:
    title: Naar iemands verjaardag vragen, informeel
    gloss: Wanneer ben jij jarig? (informeel)
    note: Tumhara komt overeen met het mannelijke janmadin.
  hi.a1.unit03.lesson03.teach.mera_janmadin_january_mein_hai:
    title: Zeggen wanneer je verjaardag is
    gloss: Ik ben in januari jarig.
    note: Het natuurlijke antwoord in een volledige zin op Tumhara janmadin kab hai?
  hi.a1.unit03.lesson03.teach.agli_class_kab_hai:
    title: Vragen wanneer de volgende les is
    gloss: Wanneer is de volgende les?
    note: Combineert agli (vrouwelijk, passend bij class) met kab.
  hi.a1.unit03.lesson03.teach.agli_class_mangalvar_das_march:
    title: Een volledige dag en datum noemen
    gloss: De volgende les is op dinsdag 10 maart.
    note: Weekdag en datum samen, op dezelfde natuurlijke manier als in het Nederlands -- eerst de dag, dan het getal van de datum en de maand.
  hi.a1.unit03.lesson03.teach.dialogue.line01:
    title: Arjun vraagt naar de volgende les
    gloss: Arjun vraagt wanneer de volgende yogales is.
    note: Herhaalt precies de vraag uit deze les, met yog erbij voor de duidelijkheid.
  hi.a1.unit03.lesson03.teach.dialogue.line02:
    title: Priya noemt de dag en de datum
    gloss: Priya zegt dat de volgende les op dinsdag 10 maart is.
    note: Herhaalt precies de zin met dag en datum uit deze les.
  hi.a1.unit03.lesson03.teach.dialogue.line03:
    title: Arjun bedankt haar
    gloss: 'Arjun zegt: oké, bedankt.'
    note: Theek hai en shukriya gebruiken allebei woordenschat uit les 1.
  hi.a1.unit03.lesson03.teach.dialogue.line04:
    title: Priya reageert
    gloss: Priya zegt dat het geen moeite is.
    note: Koi baat nahin is een heel gebruikelijke, natuurlijke manier om "graag gedaan" of "geen probleem" te zeggen.
  hi.a1.unit03.lesson03.teach.dialogue.line05:
    title: Arjun vraagt wanneer Priya jarig is
    gloss: Arjun vraagt wanneer Priya jarig is.
    note: Herhaalt precies de informele verjaardagsvraag uit deze les.
  hi.a1.unit03.lesson03.teach.dialogue.line06:
    title: Priya antwoordt
    gloss: Priya zegt dat ze in januari jarig is.
    note: Herhaalt precies de antwoordzin uit deze les.
  hi.a1.unit03.lesson03.teach.dialogue.line07:
    title: Arjun reageert en vertelt over zichzelf
    gloss: Arjun reageert positief en zegt dan dat hij zelf in december jarig is.
    note: Accha gebruikt woordenschat uit les 1; december kwam al aan bod in les 2 van deze unit.
  hi.a1.unit03.lesson03.teach.dialogue.line08:
    title: Priya sluit het gesprek af
    gloss: Priya stemt in en zegt losjes tot ziens.
    note: Theek hai en phir milte hain gebruiken allebei afscheidswoordenschat uit les 1.
