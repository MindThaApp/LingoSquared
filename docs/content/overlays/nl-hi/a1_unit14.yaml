teaching:
  hi.a1.unit14.lesson01.teach.arjun_priya_review:
    title: 'Herhaling: Arjun, Priya, is'
    gloss: Arjun, Priya, is/zijn
    note: Een korte herhaling van de namen van de twee personages en het koppelwerkwoord 'hai', die je nodig hebt om in deze unit vergelijkende zinnen te maken.
    example_gloss:
    - Met Arjun gaat het goed.
    - Met Priya gaat het goed.
  hi.a1.unit14.lesson01.teach.bada_badi_review:
    title: 'Herhaling: groot / ouder'
    gloss: groot / ouder (mannelijk / vrouwelijk)
    note: Voor het eerst behandeld in unit 5 bij de leeftijd van broers en zussen -- in deze unit gebruik je het om twee personen of dingen direct te vergelijken.
    example_gloss:
    - Mijn oudere broer woont in Delhi.
    - Mijn oudere zus woont in Delhi.
  hi.a1.unit14.lesson01.teach.chota_choti_review:
    title: 'Herhaling: klein / jonger'
    gloss: klein / jonger (mannelijk / vrouwelijk)
    note: Voor het eerst behandeld in unit 5 bij de leeftijd van broers en zussen -- hier op dezelfde manier gebruikt als bada/badi.
    example_gloss:
    - Mijn jongere broer is nu student.
    - Mijn jongere zus is nu student.
  hi.a1.unit14.lesson01.teach.se_comparative_grammar:
    title: Se = dan
    gloss: '''Se'' kende je al als ''vanaf'' (unit 9, ''yahan se seedhe jao'') en als ''met'' (unit 12, ''Priya se mila''). Nu betekent het ook ''dan'' bij een vergelijking: ''X, Y se ADJ hai'' betekent ''X is ADJ-er dan Y'' -- zoals ''Priya Arjun se badi hai''.'
    note: Introduceert de derde betekenis van een woord dat je al kent, waarbij de twee eerdere betekenissen met hun unitnummer worden genoemd.
    target_text: '''से'' kende je al van ''यहाँ से सीधे जाओ'' (unit 9, betekent ''vanaf'') en ''प्रिया से मिला'' (unit 12, betekent ''met''); nu wordt het ook gebruikt om te vergelijken: ''X, Y से ADJ है'' betekent ''X is ADJ-er dan Y'' -- bijvoorbeeld ''प्रिया अर्जुन से बड़ी है''.'
  hi.a1.unit14.lesson01.teach.arjun_bada_phrase:
    title: Priya is ouder dan Arjun.
    gloss: Priya is ouder dan Arjun.
    note: Het eerste volledige voorbeeld in deze unit van de vergelijking met se.
  hi.a1.unit14.lesson01.teach.lamba_lambi:
    title: Lang / groot van gestalte
    gloss: lang / groot van gestalte (mannelijk / vrouwelijk)
    note: Een nieuw paar bijvoeglijke naamwoorden dat het bekende -a/-i-patroon voor mannelijk/vrouwelijk volgt (bada/badi, chota/choti).
    example_gloss:
    - Mijn broer is lang.
    - Mijn zus is lang.
  hi.a1.unit14.lesson01.teach.agreement_grammar:
    title: Het bijvoeglijk naamwoord congrueert met het onderwerp
    gloss: In een vergelijkende zin congrueert het bijvoeglijk naamwoord (zoals bada/badi, chota/choti) altijd met het geslacht van het ONDERWERP, niet met het woord na 'se' -- in 'Arjun Priya se chota hai' congrueert 'chota' bijvoorbeeld met Arjun (het mannelijke onderwerp), niet met Priya.
    note: Een directe, expliciete uitbreiding van het bekende -a/-i-patroon voor bijvoeglijke naamwoorden, nu toegepast op vergelijkende zinnen.
    target_text: In een vergelijkende zin congrueert het bijvoeglijk naamwoord (zoals बड़ा/बड़ी, छोटा/छोटी) altijd met het geslacht van het onderwerp (subject), niet met het woord na 'से' -- in 'अर्जुन प्रिया से छोटा है' congrueert 'छोटा' bijvoorbeeld met अर्जुन (mannelijk onderwerp), niet met प्रिया.
  hi.a1.unit14.lesson01.teach.priya_chota_phrase:
    title: Arjun is jonger dan Priya.
    gloss: Arjun is jonger dan Priya.
    note: Hetzelfde feit vanuit de andere kant gezegd -- laat zien dat het bijvoeglijk naamwoord met een mannelijk onderwerp congrueert.
  hi.a1.unit14.lesson01.teach.kaun_ya_review:
    title: 'Herhaling: wie, of'
    gloss: wie, of
    note: Beide al behandeld (unit 5 en unit 6/13) -- hier gebruikt om een vergelijkingsvraag te stellen.
    example_gloss: Wie is ouder, Arjun of Priya?
  hi.a1.unit14.lesson02.teach.topi_bag_review:
    title: 'Herhaling: hoed, tas'
    gloss: hoed, tas
    note: Beide zelfstandige naamwoorden kwamen voor het eerst aan bod in de winkelunit (unit 7) -- hier zijn het de twee dingen die je vergelijkt.
    example_gloss:
    - Deze hoed is mooi.
    - Deze tas is mooi.
  hi.a1.unit14.lesson02.teach.sasta_mehnga_review:
    title: 'Herhaling: goedkoop, duur'
    gloss: goedkoop, duur
    note: Voor het eerst behandeld in unit 7 – hier opnieuw gebruikt om voorwerpen te vergelijken.
    example_gloss:
    - De tas is goedkoop.
    - De tas is duur.
  hi.a1.unit14.lesson02.teach.sasti_mehngi_note:
    title: 'Vrouwelijke vormen: sasti, mehngi'
    gloss: '''Sasta'' en ''mehnga'' worden ''sasti'' en ''mehngi'' bij vrouwelijke woorden – zoals ''topi sasti hai'' (de pet is goedkoop).'
    note: Een korte herinnering aan de regel over overeenkomst in geslacht uit unit 7, nodig omdat 'topi' (pet) vrouwelijk is.
  hi.a1.unit14.lesson02.teach.se_object_phrase:
    title: De pet is goedkoper dan de tas.
    gloss: De pet is goedkoper dan de tas.
    note: Het vergelijkingspatroon met se, nu toegepast op twee voorwerpen in plaats van twee personen.
  hi.a1.unit14.lesson02.teach.zyada_review:
    title: 'Herhaling: meer'
    gloss: meer
    note: In unit 13 alleen geleerd met 'pasand hai' (om een voorkeur uit te drukken) – in deze les breiden we het gebruik uit.
    example_gloss: Ik hou meer van thee.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_grammar:
    title: Zyada bij elke vergelijking
    gloss: '''Zyada'' leerde je eerder alleen met ''pasand hai'' (unit 13). Nu kan het ook voor ELK bijvoeglijk naamwoord in een vergelijking staan – ''bag topi se zyada mehnga hai'' betekent ''de tas is duurder dan de pet'', precies als ''bag topi se mehnga hai''. ''Zyada'' is optioneel; het zegt alleen nadrukkelijk ''meer''.'
    note: Een uitbreiding van de plaatsingsregel van een al geleerd woord, geen nieuw grammaticapunt.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_phrase:
    title: De tas is duurder dan de pet.
    gloss: De tas is duurder dan de pet.
    note: Hetzelfde vergelijkingspatroon met se, nu met het optionele zyada (meer) erbij.
  hi.a1.unit14.lesson02.teach.naya_nai:
    title: Nieuw
    gloss: nieuw (mannelijk / vrouwelijk)
    note: Een nieuw paar bijvoeglijke naamwoorden, met hetzelfde -a/-i-patroon als alle andere bijvoeglijke naamwoorden in deze unit.
    example_gloss:
    - De tas is nieuw.
    - De pet is nieuw.
  hi.a1.unit14.lesson02.teach.topi_nai_phrase:
    title: De pet is nieuwer dan de tas.
    gloss: De pet is nieuwer dan de tas.
    note: Een tweede vergelijking (leeftijd/nieuwheid) tussen dezelfde twee voorwerpen, in lijn met de eerder behandelde prijsvergelijking.
  hi.a1.unit14.lesson03.teach.review_words:
    title: 'Herhaling: groot, klein, lang, nieuw'
    gloss: groot/ouder, klein/jonger, lang, nieuw
    note: Een korte herhaling van de belangrijkste bijvoeglijke naamwoorden van deze unit, nodig voor de dialoog en de leestekst.
    example_gloss:
    - Priya is ouder.
    - Arjun is jonger.
    - Arjun is lang.
    - De tas is nieuw.
  hi.a1.unit14.lesson03.teach.main_hun_review:
    title: 'Herhaling: ik, ben'
    gloss: ik, ben
    note: Voor het eerst behandeld in unit 1 ('main theek hun') – nodig zodat Arjun in de dialoog over zichzelf kan praten.
    example_gloss: Het gaat goed met me.
  hi.a1.unit14.lesson03.teach.aur_bhi_review:
    title: 'Herhaling: en, ook'
    gloss: en, ook
    note: Beide woorden kwamen al eerder in dialogen voor, maar worden hier voor het eerst officieel als toetsbare woordenschat geïntroduceerd.
    example_gloss:
    - Ik hou van thee en koffie.
    - Ik vind het ook lekker.
  hi.a1.unit14.lesson03.teach.ka_review:
    title: 'Herhaling: van (bezit)'
    gloss: van (bezitswoord)
    note: Het bezitswoord dat je al in de hele cursus hebt gezien (bijv. unit 5–11) – hier opnieuw gebruikt om te zeggen van wie de tas is die je vergelijkt.
    example_gloss: De tas van Arjun is nieuw.
  hi.a1.unit14.lesson03.teach.dialogue.line01:
    title: Arjun laat zijn nieuwe tas zien
    gloss: Priya, dit is mijn nieuwe tas.
  hi.a1.unit14.lesson03.teach.dialogue.line02:
    title: Priya zegt dat de pet goedkoper is
    gloss: Mooie tas! Maar de pet is goedkoper dan een tas.
  hi.a1.unit14.lesson03.teach.dialogue.line03:
    title: Arjun geeft toe dat zijn tas duur is
    gloss: Ja. Mijn tas is duur – hij is duurder dan een pet.
  hi.a1.unit14.lesson03.teach.dialogue.line04:
    title: Priya vraagt wie ouder is
    gloss: Oké, oké! Arjun, wie is ouder, jij of ik?
  hi.a1.unit14.lesson03.teach.dialogue.line05:
    title: Arjun antwoordt
    gloss: Jij bent ouder, maar ik ben lang!
  hi.a1.unit14.lesson03.teach.dialogue.line06:
    title: Priya zegt dat de pet ook nieuwer is
    gloss: Oké, oké! Maar de pet is ook nieuwer dan de tas.
  hi.a1.unit14.lesson03.teach.dialogue.line07:
    title: Arjun is het eens en sluit af
    gloss: Ja, dat is waar. Zien we elkaar morgen weer?
  hi.a1.unit14.lesson03.teach.dialogue.line08:
    title: Priya sluit af
    gloss: Oké! Tot morgen.
  hi.a1.unit14.lesson03.teach.grammar_summary:
    title: Drie hoofdregels
    gloss: 'De drie hoofdregels van deze unit: (1) ''X, Y se ADJ hai'' betekent ''X is ADJ-er dan Y''; (2) het bijvoeglijk naamwoord komt altijd overeen met het geslacht van het onderwerp (X), niet van Y; (3) ''zyada'' kan ook voor het bijvoeglijk naamwoord staan, zoals ''X, Y se zyada ADJ hai'' – de betekenis blijft hetzelfde (''ADJ-er dan'').'
    note: Een afsluitende samenvatting van de grammatica van de hele unit, net als de samenvattende grammaticanotitie van unit 13.
    target_text: 'De drie hoofdregels van deze unit: (1) ''X, Y से ADJ है'' betekent ''X is ADJ-er dan Y''; (2) ADJ congrueert altijd met het geslacht van het onderwerp (X), niet met Y; (3) je kunt ook ''ज़्यादा'' voor ADJ zetten, zoals ''X, Y से ज़्यादा ADJ है'' -- de betekenis blijft hetzelfde (''ADJ-er dan'').'
  hi.a1.unit14.lesson03.teach.priya_note:
    title: Het briefje van Priya
    gloss: Ik ben ouder dan Arjun, maar Arjun is lang. En mijn pet is mooi – de pet is goedkoper dan de tas, en de pet is ook nieuwer dan de tas. - Priya
    note: Een kort briefje dat precies de feiten herhaalt die al in de dialoog stonden, zonder nieuwe beweringen.
    glosses:
      बड़ी: ouder (vrouwelijk)
      लंबा: lang
      टोपी: pet
      अच्छी: mooi / goed (vrouwelijk)
      बैग: tas
      सस्ती: goedkoper / goedkoop (vrouwelijk)
      नई: nieuwer / nieuw (vrouwelijk)
