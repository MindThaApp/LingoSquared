answer_policy:
  nasalization_marks: 'Display and teach the correct chandrabindu/anusvara distinction. This unit''s own new vocabulary needs one new, explicitly disclosed spelling decision: महंगा/महंगी ("expensive") uses अनुस्वार (ं), not चंद्रबिंदु -- this is a class-nasal-before-a-stop-consonant case (the same pattern as गंगा/मंगल), not an application of the existing word-final vowel-height convention that governs हूँ/हाँ/मैं/हैं/में. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
units:
  hi.a1.unit07.shopping:
    title: Winkelen
lessons:
  hi.a1.unit07.lesson01.dukaan_mein:
    title: In de winkel
  hi.a1.unit07.lesson02.keemat_aur_matra:
    title: Prijs en hoeveelheid
  hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari:
    title: Priya en Arjun gaan winkelen
teaching:
  hi.a1.unit07.lesson01.teach.dukaan_bazaar:
    title: Winkel, markt
    gloss: winkel, markt
    note: Twee veelvoorkomende plekken om dingen te kopen, die je in deze unit steeds tegenkomt.
    example_gloss:
    - Dit is een winkel.
    - Dit is een markt.
  hi.a1.unit07.lesson01.teach.dukaandaar:
    title: Winkelier
    gloss: winkelier
    note: 'Een nieuw personage in deze unit: de persoon die een winkel runt. Je spreekt hem of haar met aap aan, omdat het een vreemde is.'
    example_gloss: Dit is de winkelier.
  hi.a1.unit07.lesson01.teach.kameez_bag_topi:
    title: Shirt, tas, hoed
    gloss: shirt, tas, hoed
    note: Drie gewone spullen om te kopen. Je oefent er in deze unit het patroon *mujhe ... chahiye* uit de eenheid over eten mee.
    example_gloss:
    - Ik wil graag een shirt.
    - Ik wil graag een tas.
    - Ik wil graag een hoed.
  hi.a1.unit07.lesson01.teach.mujhe_yah_chahiye:
    title: Ik wil dit graag
    gloss: Ik wil dit graag.
    note: Een algemene zin om aan te geven dat je iets wilt. Je gebruikt *mujhe ... chahiye* uit de eenheid over eten opnieuw, nu met *yah* (dit).
  hi.a1.unit07.lesson01.teach.ji:
    title: Ji (beleefdheidstitel)
    gloss: een beleefd, respectvol partikel, zoals 'meneer' of 'mevrouw' erbij zeggen
    note: Je zet het achter een naam of titel om beleefder te klinken. Het is gebruikelijk bij een vreemde, zoals een winkelier.
    example_gloss: Goedendag, meneer de winkelier.
  hi.a1.unit07.lesson01.teach.sirf:
    title: Alleen
    gloss: alleen, maar
    note: Hiermee zeg je dat je maar één ding wilt, niet meerdere.
    example_gloss: Ik wil alleen een shirt.
  hi.a1.unit07.lesson01.teach.aapko_aur_kuch_chahiye:
    title: Wilt u verder nog iets? (formeel)
    gloss: Wilt u verder nog iets?
    note: De natuurlijke, formele vervolgvraag van een winkelier nadat je een deel van je bestelling hebt genoemd. Hij gebruikt *aapko* en *chahiye* opnieuw.
  hi.a1.unit07.lesson01.teach.ji_nahin_sirf_yah:
    title: Nee, alleen dit
    gloss: Nee, alleen dit.
    note: Een natuurlijke, beleefde manier om verdere spullen af te slaan. Je gebruikt *ji* en *sirf* uit deze les opnieuw.
  hi.a1.unit07.lesson01.teach.tumhein_kya_chahiye_bataao:
    title: Zeg wat je wilt
    gloss: Zeg wat je wilt.
    note: De informele oefenopdracht die deze cursus gebruikt om een mondeling antwoord uit te lokken, net als in de eenheid over eten.
  hi.a1.unit07.lesson02.teach.keemat:
    title: Prijs
    gloss: prijs
    note: Herhaald uit de getallen- en prijsstof van unit 2 en hier opnieuw aangeleerd in de context van winkelen.
    example_gloss: Wat kost het?
  hi.a1.unit07.lesson02.teach.rupaye:
    title: Roepies
    gloss: roepies
    note: Het woord voor de munteenheid, herhaald uit unit 2 en nu geoefend met twee verschillende prijzen.
    example_gloss:
    - Het kost tweehonderd roepies.
    - Het kost vijfhonderd roepies.
  hi.a1.unit07.lesson02.teach.iski_keemat_kya_hai:
    title: Wat kost het?
    gloss: Wat kost het?
    note: De standaardmanier om naar een prijs te vragen, rechtstreeks herhaald uit unit 2.
  hi.a1.unit07.lesson02.teach.iski_keemat_bees_rupaye_hai:
    title: Het kost tweehonderd roepies
    gloss: Het kost tweehonderd roepies.
    note: Een voorbeeldantwoord op de prijsvraag hierboven.
  hi.a1.unit07.lesson02.teach.kitne_ka_ki_note:
    title: Kitne ka / kitne ki
    gloss: '''Yah kitne ka hai?'' gebruik je voor mannelijke dingen en ''Yah kitne ki hai?'' voor vrouwelijke dingen. *kitne* zelf verandert nooit; alleen *ka/ki* verandert, net als de wisseling -a/-i die je al kent van *mera/meri* en *tumhara/tumhari*.'
    note: 'Een tweede, heel gangbare manier om naar een prijs te vragen. Ze volgt hetzelfde patroon van overeenkomst met het grammaticale geslacht als bij de bezittelijke woorden: alleen het partikel ka/ki verandert, niet kitne.'
  hi.a1.unit07.lesson02.teach.yeh_kitne_ka_hai:
    title: Hoeveel kost dit? (mannelijk)
    gloss: Hoeveel kost dit?
    note: Gebruikt voor een mannelijk voorwerp, zoals een tas.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ki_hai:
    title: Hoeveel kost dit? (vrouwelijk)
    gloss: Hoeveel kost dit?
    note: Gebruikt voor een vrouwelijk voorwerp, zoals een hoed.
  hi.a1.unit07.lesson02.teach.sasta_mehenga:
    title: Goedkoop, duur
    gloss: goedkoop, duur
    note: Een gangbaar paar bijvoeglijke naamwoorden om op een prijs te reageren. Hier staan de mannelijke vormen.
    example_gloss:
    - Deze tas is goedkoop.
    - Deze tas is duur.
  hi.a1.unit07.lesson02.teach.sasti_mehengi_note:
    title: Sasti en mehengi
    gloss: '''Sasta'' en ''mehenga'' veranderen net als ''mera/meri'' mee met mannelijk en vrouwelijk. Bij vrouwelijke woorden zeg je ''sasti'' en ''mehengi'', zoals ''yah topi sasti hai'' (deze hoed is goedkoop) of ''yah kameez mehengi hai'' (dit shirt is duur).'
    note: Een tweede echt voorbeeld van hetzelfde patroon van overeenkomst met het geslacht, waar deze cursus steeds expliciet op wijst.
  hi.a1.unit07.lesson03.teach.khareedna:
    title: Kopen
    gloss: kopen
    note: Gebruikt de constructie 'V + na chahta/chahti hun' (ik wil ... ) uit unit 1, waar je die leerde voor yoga leren, nu toegepast op kopen.
    example_gloss:
    - Ik wil dit shirt kopen.
    - Ik wil deze hoed kopen.
  hi.a1.unit07.lesson03.teach.chalo_kuch_khareedte_hain:
    title: Laten we iets kopen!
    gloss: Laten we iets kopen!
    note: Een vriendelijke vaste zin om samen te gaan winkelen. Hij opent de slotdialoog van deze unit, net als 'chalo, kuch khate hain!' in de eenheid over eten.
  hi.a1.unit07.lesson03.teach.dialogue.line01:
    title: Arjun stelt voor te gaan winkelen
    gloss: 'Arjun zegt: laten we iets kopen.'
    note: Gebruikt de openingszin van deze unit opnieuw.
  hi.a1.unit07.lesson03.teach.dialogue.line02:
    title: Priya stemt in
    gloss: 'Priya stemt in en vraagt zich af: een shirt of een hoed?'
    note: Introduceert *ya* (of) om een keuze tussen twee dingen te geven.
  hi.a1.unit07.lesson03.teach.dialogue.line03:
    title: De winkelier begroet hen
    gloss: De winkelier zegt goedendag en vraagt wat ze willen.
    note: De formele begroeting met aap, waarin *aapko kya chahiye* uit les 1 terugkomt.
  hi.a1.unit07.lesson03.teach.dialogue.line04:
    title: Priya vraagt naar een shirt
    gloss: Priya begroet de winkelier beleefd, vraagt om een shirt en vraagt dan wat het kost.
    note: Combineert *ji*, *mujhe ... chahiye* en *iski keemat kya hai*.
  hi.a1.unit07.lesson03.teach.dialogue.line05:
    title: De winkelier noemt de prijs
    gloss: De winkelier zegt dat het driehonderd roepies kost.
    note: Gebruikt het patroon *iski keemat ... rupaye hai* opnieuw met een nieuw getal.
  hi.a1.unit07.lesson03.teach.dialogue.line06:
    title: Priya reageert en besluit
    gloss: 'Priya zegt: driehonderd roepies? Dat is goedkoop! Ik wil dit shirt graag.'
    note: Gebruikt *sasti* uit de grammaticanotitie van les 2 opnieuw.
  hi.a1.unit07.lesson03.teach.dialogue.line07:
    title: Arjun vraagt naar een hoed
    gloss: Arjun zegt dat hij graag een hoed wil en vraagt wat die kost.
    note: Gebruikt de vrouwelijke vorm *kitne ki hai* uit les 2 opnieuw.
  hi.a1.unit07.lesson03.teach.dialogue.line08:
    title: De winkelier antwoordt
    gloss: De winkelier zegt dat de hoed vijfhonderd roepies kost.
    note: Gebruikt *paanch sau* (vijfhonderd) uit les 2 opnieuw.
  hi.a1.unit07.lesson03.teach.dialogue.line09:
    title: Arjun reageert en neemt hem toch
    gloss: 'Arjun zegt: vijfhonderd roepies? Dat is duur! Goed, ik wil deze hoed toch graag.'
    note: Gebruikt *mehengi* uit de grammaticanotitie van les 2 opnieuw. Daarna besluit hij hem toch te kopen.
  hi.a1.unit07.lesson03.teach.dialogue.line10:
    title: De winkelier vraagt of dat alles is
    gloss: 'De winkelier zegt: goed, wilt u verder nog iets?'
    note: Gebruikt *aapko aur kuch chahiye* uit les 1 opnieuw.
  hi.a1.unit07.lesson03.teach.dialogue.line11:
    title: Priya rondt de bestelling af
    gloss: 'Priya zegt: nee, alleen dit, dank u!'
    note: Gebruikt *ji nahin, sirf yah* uit les 1 opnieuw, plus *shukriya*.
  hi.a1.unit07.lesson03.teach.dialogue.line12:
    title: De winkelier neemt afscheid
    gloss: 'De winkelier bedankt hen en zegt: tot ziens.'
    note: Gebruikt de vaste afscheidszin van deze cursus.
