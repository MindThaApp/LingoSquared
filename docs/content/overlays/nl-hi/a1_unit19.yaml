    title: Weer
lessons:
  hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa:
    title: Weer, zon, regen en wind
  hi.a1.unit19.lesson02.garam_thanda_baadal:
    title: Warm, koud en wolken
  hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam:
    title: 'Priya en Arjun: hoe is het weer morgen?'
teaching:
  hi.a1.unit19.lesson01.teach.aaj_review:
    title: 'Herhaling: vandaag'
    gloss: vandaag
    note: Voor het eerst behandeld in les 3 van eenheid 3. Dit is het terugkerende tijdwoord van deze eenheid, samen met *kal* (morgen) in les 3.
    example_gloss: Vandaag is het de derde.
  hi.a1.unit19.lesson01.teach.mausam:
    title: Weer
    gloss: het weer
    note: 'Een nieuw zelfstandig naamwoord, het themawoord van deze eenheid. Mannelijk: zie de grammaticanotities over geslachtsovereenkomst in deze eenheid.'
    example_gloss: Wat voor weer is het vandaag?
  hi.a1.unit19.lesson01.teach.kaisa_review:
    title: 'Herhaling: hoe / wat voor'
    gloss: hoe / wat voor
    note: Behandeld in eenheid 12. Hier gebruik je het om naar het weer te vragen.
    example_gloss: Hoe is jouw huis?
  hi.a1.unit19.lesson01.teach.hai_hain_review:
    title: 'Herhaling: is, zijn'
    gloss: is (enkelvoud), zijn (meervoud)
    note: Het paar enkelvoud/meervoud van het koppelwerkwoord waarop het hele weerpatroon van deze eenheid berust.
    example_gloss:
    - Het weer is vandaag goed.
    - Er zijn drie kamers in het huis.
  hi.a1.unit19.lesson01.teach.dhoop:
    title: Zon / zonneschijn
    gloss: zon / zonneschijn
    note: 'Een nieuw zelfstandig naamwoord. Het staat in een kale zin met "er is": *aaj dhoop hai* = "vandaag is het zonnig" (letterlijk "vandaag is er zonneschijn").'
    example_gloss: Vandaag is het zonnig.
  hi.a1.unit19.lesson01.teach.baarish:
    title: Regen
    gloss: regen
    note: 'Een nieuw zelfstandig naamwoord. Het staat in een kale zin met "er is": *aaj baarish hai* = "vandaag regent het".'
    example_gloss: Vandaag regent het.
  hi.a1.unit19.lesson01.teach.hawa:
    title: Wind
    gloss: wind
    note: 'Een nieuw zelfstandig naamwoord. Het staat in een kale zin met "er is": *aaj hawa hai* = "vandaag is het winderig".'
    example_gloss: Vandaag is het winderig.
  hi.a1.unit19.lesson01.teach.grammar_mausam_existential:
    title: Het weerpatroon met "er is"
    gloss: Om het weer te beschrijven zeg je 'aaj/kal + [weerwoord] + hai', bijvoorbeeld 'aaj dhoop hai', 'aaj baarish hai', 'aaj hawa hai'. Dit is hetzelfde hai/hain-patroon dat je al kent van het huis (eenheid 18), maar nu zonder getal en direct als onderwerp.
    note: De eerste grammaticanotitie van deze eenheid. Ze koppelt de nieuwe woorden aan een zinspatroon dat je al kent.
  hi.a1.unit19.lesson02.teach.mausam_review:
    title: 'Herhaling: weer'
    gloss: het weer
    note: Herhaald uit les 1 van deze eenheid.
    example_gloss: Wat voor weer is het vandaag?
  hi.a1.unit19.lesson02.teach.garam:
    title: Heet
    gloss: heet
    note: 'Een nieuw bijvoeglijk naamwoord. Het verandert niet met het geslacht: zie de grammaticanotitie van deze les.'
    example_gloss: Het weer is vandaag warm.
  hi.a1.unit19.lesson02.teach.thanda_thandi:
    title: Koud (mannelijk / vrouwelijk)
    gloss: koud (mannelijk), koud (vrouwelijk)
    note: 'Een nieuw bijvoeglijk naamwoord. Dit verandert WEL met het geslacht, anders dan *garm*: mannelijk *mausam* krijgt *thanda*, vrouwelijke woorden (zoals *rasoi*, eenheid 18) krijgen *thandi*. Zie de grammaticanotitie van deze les.'
    example_gloss:
    - Het weer is vandaag koud.
    - De keuken is vandaag koud.
  hi.a1.unit19.lesson02.teach.grammar_garam_thanda:
    title: Onveranderlijke bijvoeglijke naamwoorden en bijvoeglijke naamwoorden die het geslacht volgen
    gloss: '''Garm'' is een bijvoeglijk naamwoord dat op een medeklinker eindigt en niet verandert met het geslacht: bij ''mausam garm hai'' blijft het altijd ''garm''. ''Thanda''/''thandi'' eindigt op ''-a'' en verandert WEL met het geslacht, net als ''bada''/''badi'' (eenheid 14): mannelijk ''mausam'' krijgt ''thanda'', een vrouwelijk zelfstandig naamwoord krijgt ''thandi''.'
    note: 'Het centrale grammaticacontrast van deze eenheid: een nieuw paar bijvoeglijke naamwoorden gekoppeld aan de regel uit eenheid 14.'
  hi.a1.unit19.lesson02.teach.baadal:
    title: Wolk(en)
    gloss: wolk(en)
    note: 'Een nieuw zelfstandig naamwoord, in deze eenheid alleen gebruikt in de natuurlijke meervoudsvorm met "er zijn": *aaj baadal hain* = "vandaag zijn er wolken" / "vandaag is het bewolkt".'
    example_gloss: Vandaag zijn er wolken.
  hi.a1.unit19.lesson02.teach.accha_review:
    title: 'Herhaling: goed'
    gloss: goed
    note: Behandeld in eenheid 9. Hier gebruik je het om het weer te beschrijven.
    example_gloss: Het weer is vandaag goed.
  hi.a1.unit19.lesson02.teach.bura:
    title: Slecht
    gloss: slecht
    note: Een nieuw bijvoeglijk naamwoord, als tegenpool van het al geleerde *accha* (goed). In deze eenheid alleen in de mannelijke vorm, passend bij *mausam*.
    example_gloss: Het weer is vandaag slecht.
  hi.a1.unit19.lesson02.teach.bahut_review:
    title: 'Herhaling: heel'
    gloss: heel / erg
    note: Behandeld in eenheid 6. Hier gebruik je het om een weerbeschrijving te versterken.
    example_gloss: Het weer is vandaag heel koud.
  hi.a1.unit19.lesson03.teach.kal_review:
    title: 'Herhaling: morgen (ook: gisteren)'
    gloss: morgen (betekent afhankelijk van de context ook "gisteren")
    note: Behandeld in eenheid 4 en in eenheid 12 gebruikt voor "gisteren". In echt Hindi is het echt dubbelzinnig en maakt alleen de context duidelijk wat er bedoeld wordt. Alle zinnen in deze eenheid gaan over de toekomst en over plannen maken, dus 'kal' betekent hier "morgen".
    example_gloss: Morgen gaat het regenen.
  hi.a1.unit19.lesson03.teach.ghar_review:
    title: 'Herhaling: huis / thuis'
    gloss: huis / thuis
    note: Behandeld in eenheid 8. Hier gebruik je het voor het plan dat daaruit volgt (thuisblijven).
    example_gloss: Dit is een huis.
  hi.a1.unit19.lesson03.teach.mein_review:
    title: 'Herhaling: in / op / bij'
    gloss: in / op / bij
    note: Behandeld in eenheid 1. Hier gebruik je het in "ghar mein" (thuis).
    example_gloss: Er zijn drie kamers in het huis.
  hi.a1.unit19.lesson03.teach.hum_review:
    title: 'Herhaling: wij'
    gloss: wij
    note: Behandeld in eenheid 11. Hier is het het onderwerp van het plan in deze les.
    example_gloss: Wij kijken naar een film.
  hi.a1.unit19.lesson03.teach.rehte_hain_review:
    title: 'Herhaling: [zij/wij] blijven / wonen'
    gloss: '[zij/wij] blijven / wonen'
    note: 'Behandeld in eenheid 5 (met een enkelvoudige grootvader, via de mannelijke meervoudsovereenkomst uit beleefdheid). In deze eenheid staat de vorm voor het eerst bij een echt meervoudig onderwerp, ''hum'' (wij): dezelfde werkwoordsvorm, nu eenvoudiger toegepast.'
    example_gloss: Mijn grootvader woont in Delhi.
  hi.a1.unit19.lesson03.teach.chalo_review:
    title: 'Herhaling: laten we / kom op'
    gloss: laten we / kom op
    note: Behandeld in eenheid 1 en in eenheid 6/7/11 gebruikt met een gewoontemeervoud van het werkwoord voor "Laten we ___". Hier gebruik je het op dezelfde manier.
    example_gloss: Laten we iets eten!
  hi.a1.unit19.lesson03.teach.jaana_review:
    title: 'Herhaling: gaan'
    gloss: gaan
    note: Behandeld in eenheid 15 als kale infinitief. Deze les breidt het uit met de gewoontemeervoudsvorm 'jaate hain' (wij gaan), op dezelfde manier gevormd als 'dekhte hain'/'peete hain' in eenheid 11.
    example_gloss: Ik moet naar het station.
  hi.a1.unit19.lesson03.teach.aur_review:
    title: 'Herhaling: en'
    gloss: en
    note: Behandeld in eenheid 1. Hier gebruik je het om het weer en de temperatuur van morgen te verbinden.
    example_gloss: Morgen regent het en is het koud.
  hi.a1.unit19.lesson03.teach.bahar:
    title: Buiten
    gloss: buiten
    note: Een nieuw woord, de woordenschat voor het plan dat in deze les volgt.
    example_gloss: Laten we naar buiten gaan!
  hi.a1.unit19.lesson03.teach.jaate_hain_phrase:
    title: Laten we naar buiten gaan!
    gloss: Laten we naar buiten gaan!
    note: '''Chalo'' + het gewoontemeervoud ''jaate hain'' (van ''jaana'', gaan): hetzelfde "Laten we ___"-patroon als in eenheid 1/6/7/11.'
  hi.a1.unit19.lesson03.teach.dialogue.line01:
    title: Arjun vraagt Priya naar het weer van vandaag
    gloss: Priya, hoe is het weer vandaag?
  hi.a1.unit19.lesson03.teach.dialogue.line02:
    title: Priya beschrijft het weer van vandaag
    gloss: Vandaag is het zonnig en warm.
  hi.a1.unit19.lesson03.teach.dialogue.line03:
    title: Arjun stelt voor om naar buiten te gaan
    gloss: Fijn! Laten we naar buiten gaan.
  hi.a1.unit19.lesson03.teach.dialogue.line04:
    title: Priya vraagt naar het weer van morgen
    gloss: Oké! En hoe is het weer morgen?
  hi.a1.unit19.lesson03.teach.dialogue.line05:
    title: Arjun beschrijft het weer van morgen
    gloss: Morgen regent het en is het koud.
  hi.a1.unit19.lesson03.teach.dialogue.line06:
    title: Priya stelt voor om thuis te blijven
    gloss: Dus morgen blijven we thuis?
  hi.a1.unit19.lesson03.teach.dialogue.line07:
    title: Arjun stemt in
    gloss: Ja, morgen blijven we thuis.
  hi.a1.unit19.lesson03.teach.dialogue.line08:
    title: Priya stemt in
    gloss: Oké!
  hi.a1.unit19.lesson03.teach.grammar_summary:
    title: Drie hoofdregels
    gloss: 'De drie hoofdregels van deze les: (1) ''aaj/kal + [weerwoord] + hai/hain'' beschrijft het weer; (2) ''garm'' verandert niet met het geslacht, maar ''thanda''/''thandi'' wel, net als ''bada''/''badi''; (3) ''chalo'' + een gewoontewerkwoord in het meervoud (zoals ''jaate hain'') vormt een voorstel -- ''chalo, bahar jaate hain!''.'
    note: Een afsluitende samenvatting die de grammatica van de hele les samenbrengt, zoals de grammaticanotities van les 15-18 dat ook doen.
  hi.a1.unit19.lesson03.teach.weather_reading:
    title: Lezen over vandaag en morgen
    gloss: Het is vandaag warm en zonnig. Laten we naar buiten gaan! Morgen regent het en is het koud. Morgen blijven we thuis.
    note: Een kort, direct profiel dat precies de feiten uit de dialoog herhaalt, zonder nieuwe beweringen -- het oefent direct het lezen van een kort weerbericht.
    glosses:
      आज: vandaag
      मौसम: weer
      गर्म: warm
      धूप: zonneschijn
      चलो: laten we
      बाहर: buiten
      जाते: gaan (van जाना)
      कल: morgen
      बारिश: regen
      ठंडा: koud
      रहते: blijven / wonen (van रहना)
