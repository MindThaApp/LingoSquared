teaching:
  hi.a1.unit27.lesson01.teach.khush_udas_naraz:
    title: Blij, verdrietig en boos
    gloss: blij, verdrietig, boos
    note: '*खुश*, *उदास* en *नाराज़* zijn basiswoorden voor gevoelens. Ze staan bij *हूँ* of *है* (''ben'', ''is'') en veranderen niet naar geslacht.'
    example_gloss:
    - Ik ben blij.
    - Ik ben verdrietig.
    - Ik ben boos.
  hi.a1.unit27.lesson01.teach.main_khush_hoon:
    title: Zeggen dat je blij bent
    gloss: Ik ben blij.
    note: '*मैं खुश हूँ* volgt het patroon *मैं* + gevoel + *हूँ*, net als ''ik ben ...''.'
  hi.a1.unit27.lesson01.teach.main_naraz_naheen:
    title: Gevoelens tegenover elkaar zetten
    gloss: Ik ben niet boos, ik ben verdrietig.
    note: '*नहीं* staat vlak voor *हूँ*: *नाराज़ नहीं हूँ*. Het tweede deel noemt dan het echte gevoel.'
  hi.a1.unit27.lesson02.teach.tum_khush_kyon:
    title: Vragen waarom
    gloss: Waarom ben je blij?
    note: '*क्यों* (''waarom'') staat voor het hoofdwoord: *तुम खुश क्यों हो?*. *तुम* is het informele ''jij''.'
  hi.a1.unit27.lesson02.teach.main_khush_hoon:
    title: Een reden geven
    gloss: Ik ben blij omdat ik een nieuw appartement heb.
    note: '*क्योंकि* leidt de reden in. *मेरे पास ... है* betekent ''ik heb'', en het werkwoord *है* staat aan het eind.'
  hi.a1.unit27.lesson02.teach.main_udas_hoon:
    title: Een negatieve reden
    gloss: Ik ben verdrietig omdat het regent.
    note: '*बारिश हो रही है* betekent ''het regent'' (letterlijk: ''regen is aan het gebeuren'').'
  hi.a1.unit27.lesson03.teach.narvas:
    title: Nerveus
    gloss: nerveus
    note: Het standaardwoord voor zenuwachtigheid.
    example_gloss: Ik ben zenuwachtig voor mijn eerste dienst.
  hi.a1.unit27.lesson03.teach.main_apnee_pahlee:
    title: Zeggen waarvoor je zenuwachtig bent
    gloss: Ik ben zenuwachtig voor mijn eerste dienst.
    note: '*को लेकर* betekent ''over'' en staat na het zelfstandig naamwoord: *शिफ़्ट को लेकर*. *अपनी* (''mijn eigen'') komt overeen met het vrouwelijke *शिफ़्ट*.'
  hi.a1.unit27.lesson03.teach.chinta_mat_karo:
    title: Iemand geruststellen
    gloss: Maak je geen zorgen.
    note: '*चिंता मत करो* is het vriendelijke ''maak je geen zorgen'': *मत* + *करो* is de gebiedende wijs bij *तुम* met ''niet''.'
  hi.a1.unit27.lesson04.teach.arjun_kaisa_mahsoos:
    title: Vragen hoe iemand zich voelt
    gloss: Hoe voelt Arjun zich?
    note: '*कैसा महसूस कर रहा है* vraagt ''hoe voelt hij zich''. *कैसा* komt overeen met de persoon, dus bij een vrouw wordt het *कैसी*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_mahsoos:
    title: Beschrijven hoe iemand zich voelt
    gloss: Hij voelt zich zenuwachtig.
    note: 'Hindi gebruikt hier geen apart woord voor ''zich'': *वह नर्वस महसूस कर रहा है* gebruikt gewoon *वह* en *रहा है*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_kyon:
    title: Vragen waarom iemand zich zo voelt
    gloss: Waarom voelt hij zich zenuwachtig?
    note: '*क्यों* staat vlak voor de werkwoordsgroep: *वह नर्वस क्यों महसूस कर रहा है?*'
  hi.a1.unit27.lesson05.teach.hay_priya_main:
    title: Lees een bericht over gevoelens
    gloss: Hoi Priya, ik ben een beetje nerveus over mijn eerste dienst alleen. Maar ik ben ook blij, want ik heb een nieuwe baan en een nieuw appartement. Ik denk dat het goed komt.
    note: Let op waarvoor de schrijver zenuwachtig is, wat hem blij maakt en hoe hij er in het algemeen over denkt.
    glosses:
      थोड़ा: een beetje
      नर्वस: nerveus
      पहली: eerste
      शिफ़्ट: dienst
      अकेले: alleen
      खुश: blij
      क्योंकि: want, omdat
      नई: nieuwe
      नौकरी: werk
      नया: nieuwe
      फ़्लैट: appartement
      लगता: denken
      होगा: 'gaan (hier: goed komen)'
  hi.a1.unit27.lesson06.teach.priya_hay_arjun:
    title: Priya vraagt hoe Arjun zich voelt
    gloss: 'Priya: Hoi Arjun, hoe voel je je over je eerste dienst?'
    note: '*को लेकर* wordt weer gebruikt: *अपनी पहली शिफ़्ट को लेकर* (''over je eerste dienst''). *तुम* is informeel.'
  hi.a1.unit27.lesson06.teach.arjun_sach_kahoon:
    title: Arjun geeft toe dat hij nerveus is
    gloss: 'Arjun: Eerlijk gezegd ben ik een beetje nerveus.'
    note: '*सच कहूँ तो* (''als ik de waarheid zeg'') maakt een bekentenis zachter.'
  hi.a1.unit27.lesson06.teach.priya_chinta_mat:
    title: Priya stelt hem gerust
    gloss: 'Priya: Maak je geen zorgen, je kunt het goed!'
    note: '*तुम यह अच्छे से कर सकते हो* betekent ''je kunt dit goed'', en *अच्छे से* is ''goed''.'
  hi.a1.unit27.lesson06.teach.arjun_shukriya_isse:
    title: Arjun bedankt haar
    gloss: 'Arjun: Bedankt, dat helpt echt.'
    note: '*इससे मदद मिलती है* is letterlijk ''hierdoor wordt hulp ontvangen'': wie helpt, wordt aangeduid met *से*.'
  hi.a1.unit27.lesson06.teach.priya_aur_bad:
    title: Priya voorspelt de afloop
    gloss: 'Priya: En straks ben je vast heel blij en trots.'
    note: '*ज़रूर* (''zeker'') maakt de voorspelling stellig, en *तुम्हें गर्व होगा* is ''je zult trots zijn''.'
  hi.a1.unit27.lesson06.teach.arjun_han_mujhe:
    title: Arjun is het met haar eens
    gloss: 'Arjun: Ja, dat denk ik ook.'
    note: '*मुझे भी ऐसा ही लगता है* (''mij lijkt het ook zo'') is de natuurlijke manier om het ermee eens te zijn, en *मुझे* geeft aan wie het voelt.'
  hi.a1.unit27.lesson06.teach.arjun_narvas_hai:
    title: 'Voornaamwoorden: उसकी'
    gloss: Arjun is nerveus. Priya helpt hem.
    note: '*उसकी* betekent ''zijn'' of ''haar'' en komt overeen met het vrouwelijke *मदद*, dus *उसकी मदद करना* is ''hem helpen''. *है* en *करती है* zijn de werkwoordsvormen voor de derde persoon.'
