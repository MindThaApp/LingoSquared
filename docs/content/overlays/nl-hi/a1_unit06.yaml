teaching:
  hi.a1.unit06.lesson01.teach.khana:
    title: Eten
    gloss: eten, maaltijd
    note: Het algemene woord voor eten, dat je in deze unit steeds tegenkomt.
    example_gloss: Mijn eten is nu klaar.
  hi.a1.unit06.lesson01.teach.chai_coffee:
    title: Thee, koffie
    gloss: thee, koffie
    note: Twee veelvoorkomende dranken, waarmee je in deze unit het patroon *mujhe ... chahiye* oefent.
    example_gloss:
    - Ik wil graag thee.
    - Ik wil graag koffie.
  hi.a1.unit06.lesson01.teach.pani_juice:
    title: Water, sap
    gloss: water, sap
    note: Nog twee veelvoorkomende dranken. Er is geen congruentie in geslacht nodig, want *chahiye* verandert niet.
    example_gloss:
    - Ik wil graag water.
    - Ik wil graag sap.
  hi.a1.unit06.lesson01.teach.chahiye_note:
    title: Mujhe ... chahiye
    gloss: '*Mujhe ... chahiye* betekent ''Ik wil graag ...''. Het verandert niet met het geslacht van de spreker (anders dan *chahta/chahti*) en wordt nooit gevolgd door *hai*.'
    note: Het kernpunt van deze unit -- een heel gewone fout van leerders is *hai* achter *chahiye* zetten, omdat bijna elke zin die je tot nu toe hebt geleerd daarmee eindigt. *Chahiye* is op zichzelf al een volledig gezegde.
  hi.a1.unit06.lesson01.teach.aapko_kya_chahiye:
    title: Wat wilt u graag? (formeel)
    gloss: Wat wilt u?
    note: De formele vraag in het *aap*-register, die een ober of gastheer gebruikt om iemand beleefd aan te spreken.
  hi.a1.unit06.lesson01.teach.tumhein_kya_chahiye:
    title: Wat wil je graag? (informeel)
    gloss: Wat wilt u?
    note: Het datiefvoornaamwoord in het informele *tum*-register, vergelijkbaar met *mujhe* en met *tumhara/tumhari* uit unit 5.
  hi.a1.unit06.lesson01.teach.chai_chahiye_shukriya:
    title: Ik wil graag thee, dank je
    gloss: Ik wil graag thee, dank je.
    note: Een natuurlijk, beleefd antwoord bij het bestellen, waarin *shukriya* uit eerdere units terugkomt.
  hi.a1.unit06.lesson01.teach.bahut:
    title: Heel
    gloss: heel, erg
    note: Een veelgebruikt versterkend woord, dat je in deze unit gebruikt om eten en drinken te beschrijven.
    example_gloss: Deze thee is heel lekker.
  hi.a1.unit06.lesson01.teach.swadisht:
    title: Heerlijk
    gloss: heerlijk, lekker
    note: Een handig woord om op eten te reageren -- in de grammaticanotitie van les 3 van deze unit lees je waarom het nooit van geslacht verandert.
    example_gloss: Dit eten is heerlijk.
  hi.a1.unit06.lesson02.teach.roti_chawal:
    title: Brood, rijst
    gloss: platbrood, rijst
    note: Twee basisvoedingsmiddelen van een gewone Indiase maaltijd.
    example_gloss:
    - Ik wil graag brood.
    - Ik wil graag rijst.
  hi.a1.unit06.lesson02.teach.sabzi_daal:
    title: Groentegerecht, linzen
    gloss: groentegerecht, linzen (dal)
    note: Nog twee basisgerechten, die vaak samen met roti en rijst worden gegeten.
    example_gloss:
    - Ik wil graag het groentegerecht.
    - Ik wil graag linzen.
  hi.a1.unit06.lesson02.teach.kap_gilas_plate:
    title: Kop, glas, bord
    gloss: kop, glas, bord
    note: Veelgebruikte bakjes en servies die je met *ek* ('een') gebruikt om bij het bestellen een hoeveelheid aan te geven.
    example_gloss:
    - Ik wil graag een kopje thee.
    - Ik wil graag een glas water.
    - Ik wil graag een bord rijst.
  hi.a1.unit06.lesson02.teach.kripya:
    title: Alsjeblieft
    gloss: alsjeblieft
    note: Een eenvoudig beleefdheidswoord bij een verzoek. Meestal staat het aan het begin (*kripya mujhe ...*), maar je hoort het ook aan het eind.
    example_gloss: Ik wil graag een kopje thee, alsjeblieft.
  hi.a1.unit06.lesson02.teach.kuch_aur_chahiye:
    title: Nog iets anders?
    gloss: Nog iets anders? / Wilt u nog iets meer?
    note: De vanzelfsprekende vervolgvraag van een ober nadat hij een deel van de bestelling heeft opgenomen.
  hi.a1.unit06.lesson02.teach.nahin_bas_shukriya:
    title: Nee, dat is alles, dank je
    gloss: Nee, dat is alles, dank u.
    note: Een natuurlijke, beleefde manier om een bestelling af te sluiten, waarin *nahin* en *shukriya* uit eerdere units terugkomen.
  hi.a1.unit06.lesson02.teach.sabzi_swadisht_phrase:
    title: Dit groentegerecht is heerlijk
    gloss: Dit groentegerecht is heerlijk.
    note: Hier komen *bahut* en *swadisht* uit deze unit terug met een nieuw woord voor eten, als voorbereiding op de grammaticanotitie van les 3 over *swadisht*, dat nooit van geslacht verandert.
  hi.a1.unit06.lesson03.teach.chalo_khate_hain:
    title: Laten we iets eten!
    gloss: Laten we iets eten!
    note: Een vriendelijke, vaste manier om voor te stellen samen te eten; hiermee opent de slotdialoog van deze unit.
  hi.a1.unit06.lesson03.teach.ya:
    title: Of
    gloss: of
    note: Een eenvoudig voegwoord waarmee je een keuze tussen twee dingen aanbiedt.
    example_gloss: Wil je thee of koffie?
  hi.a1.unit06.lesson03.teach.haan:
    title: Ja
    gloss: ja
    note: Een eenvoudig bevestigend antwoord, dat in de slotdialoog van deze unit steeds terugkomt.
    example_gloss: Ja, ik wil graag thee.
  hi.a1.unit06.lesson03.teach.swadisht_invariant_note:
    title: Swadisht verandert nooit
    gloss: '*Swadisht* blijft hetzelfde bij zowel mannelijke als vrouwelijke woorden -- het verandert niet zoals *achha/achhi*.'
    note: 'Een echte uitzondering die ertoe doet: anders dan de eerder geleerde bijvoeglijke naamwoorden die congrueren (achha/achhi, bada/badi, mera/meri), veranderen bijvoeglijke naamwoorden die op een medeklinker eindigen, zoals *swadisht*, nooit naar geslacht.'
  hi.a1.unit06.lesson03.teach.accha_phir_milenge:
    title: Oké, tot ziens
    gloss: Oké! Tot ziens.
    note: Een vriendelijke afsluiting, overgenomen uit de afscheidswoorden van eerdere units.
  hi.a1.unit06.lesson03.teach.theek_hai_phir_milte_hain:
    title: Prima, tot snel
    gloss: Prima, tot snel!
    note: Het informele antwoord op de afsluiting hierboven, zoals in de afsluitende gesprekjes van eerdere units.
  hi.a1.unit06.lesson03.teach.dialogue.line01:
    title: Arjun stelt voor te eten
    gloss: 'Arjun zegt: laten we iets eten.'
    note: Herhaalt de openingszin van deze unit.
  hi.a1.unit06.lesson03.teach.dialogue.line02:
    title: Priya vraagt wat hij wil
    gloss: Priya stemt in en vraagt wat Arjun wil hebben.
    note: Herhaalt de informele vraag *tumhein kya chahiye* uit les 1.
  hi.a1.unit06.lesson03.teach.dialogue.line03:
    title: Arjun bestelt eten
    gloss: Arjun zegt dat hij een bord roti en groentegerecht wil.
    note: Combineert de eetwoorden van deze unit, het patroon met houder *ek plate* en *chahiye*.
  hi.a1.unit06.lesson03.teach.dialogue.line04:
    title: Priya biedt een keuze aan drankjes
    gloss: Priya zegt "mooi" en vraagt of Arjun thee of koffie wil.
    note: Gebruikt het *ya* van deze unit om een keuze tussen twee drankjes aan te bieden.
  hi.a1.unit06.lesson03.teach.dialogue.line05:
    title: Arjun kiest koffie
    gloss: Arjun zegt dat hij graag koffie wil, alsjeblieft.
    note: Herhaalt *kripya* uit les 2.
  hi.a1.unit06.lesson03.teach.dialogue.line06:
    title: Priya zegt iets over het eten
    gloss: Priya zegt "oké" en dat dit eten erg lekker is.
    note: Herhaalt *bahut swadisht* uit les 1.
  hi.a1.unit06.lesson03.teach.dialogue.line07:
    title: Arjun is het eens
    gloss: Arjun zegt ja en bedankt hartelijk.
    note: Herhaalt *haan* en *shukriya*.
  hi.a1.unit06.lesson03.teach.dialogue.line08:
    title: Priya rondt het gesprek af
    gloss: Priya zegt "mooi", tot ziens.
    note: Herhaalt de afsluitende zin van deze les.
  hi.a1.unit06.lesson03.teach.dialogue.line09:
    title: Arjun antwoordt
    gloss: 'Arjun stemt in en zegt: tot snel.'
    note: Herhaalt de antwoordzin van deze les.
