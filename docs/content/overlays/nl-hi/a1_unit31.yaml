teaching:
  hi.a1.unit31.lesson01.teach.lanba_chhota:
    title: Lang en klein
    gloss: lang / klein
    note: '*लंबा* en *छोटा* beschrijven lengte en staan meestal bij *कद* (''lengte''): *नेहा का कद लंबा है*. Ze eindigen op *-ा* bij een mannelijk zelfstandig naamwoord en op *-ी* bij een vrouwelijk.'
    example_gloss:
    - Neha is lang.
    - Vikram is klein.
  hi.a1.unit31.lesson01.teach.boorha_javan:
    title: Oud en jong
    gloss: oud / jong
    note: '*बूढ़ा* en *जवान* beschrijven hoe oud iemand eruitziet, zonder getal.'
    example_gloss:
    - Opa is oud.
    - Arjun is jong.
  hi.a1.unit31.lesson01.teach.tumharee_umr_kitnee:
    title: उम्र en बूढ़ा
    gloss: Hoe oud ben je? Opa is oud.
    note: Om naar een exacte leeftijd te vragen gebruikt het Hindi *उम्र* ('leeftijd'), terwijl *बूढ़ा* een oud persoon beschrijft zonder getal.
  hi.a1.unit31.lesson01.teach.neha_ka_kad:
    title: Neha is lang en Vikram is klein
    gloss: Neha is lang en Vikram is klein.
    note: '*और* (''en'') verbindt de twee beschrijvingen, en elk *का कद* congrueert met het mannelijke *कद*.'
  hi.a1.unit31.lesson02.teach.bal:
    title: Haar
    gloss: het haar
    note: '*बाल* (''haar'') is in het Hindi mannelijk meervoud, dus woorden die het beschrijven eindigen op *-े*: *लंबे बाल*.'
    example_gloss: Arjun heeft kort zwart haar.
  hi.a1.unit31.lesson02.teach.sunahre_bhoore_safed:
    title: Blond, bruin en wit
    gloss: blond / bruin / wit
    note: 'Drie haarkleuren: *सुनहरे*, *भूरे* en *सफ़ेद*; voor *बाल* eindigen ze op *-े*.'
    example_gloss:
    - Priya heeft blond haar.
    - Vikram heeft bruin haar.
    - Opa heeft wit haar.
  hi.a1.unit31.lesson02.teach.lanbe_chhote:
    title: Lang en kort (haar)
    gloss: lang / kort (haar)
    note: '*लंबे* (''lang'') en *छोटे* (''kort'') beschrijven haar en eindigen op *-े* omdat *बाल* meervoud is.'
    example_gloss:
    - Neha heeft lang haar.
    - Vikram heeft kort haar.
  hi.a1.unit31.lesson02.teach.lanbe_bal_chhote:
    title: Bijvoeglijke naamwoorden voor बाल
    gloss: Lang haar, kort haar, goudblond haar, bruin haar, wit haar, zwart haar.
    note: '*बाल* is mannelijk meervoud, dus het bijvoeglijk naamwoord ervoor eindigt op *-े*: *लंबे बाल*, *भूरे बाल*.'
  hi.a1.unit31.lesson02.teach.uske_bal_lanbe:
    title: 'उसके: zijn of haar'
    gloss: Zijn of haar haar is lang.
    note: '*उसके* betekent zowel ''zijn'' als ''haar'', dus alleen de context vertelt wat bedoeld is; hier congrueert het met het meervoud *बाल*.'
  hi.a1.unit31.lesson02.teach.arjun_ke_bal:
    title: Arjun heeft kort zwart haar
    gloss: Arjun heeft kort zwart haar.
    note: '*काले* komt opnieuw voor, nu bij haar, en eindigt op *-े* omdat *बाल* meervoud is.'
  hi.a1.unit31.lesson02.teach.priya_ke_bal:
    title: Priya heeft lang blond haar
    gloss: Priya heeft lang blond haar.
    note: Combineert de woorden voor lengte en kleur uit deze les in één natuurlijke zin.
  hi.a1.unit31.lesson03.teach.ankhen:
    title: Ogen
    gloss: de ogen
    note: '*आँखें* (''ogen'') is een vrouwelijk meervoudig zelfstandig naamwoord; het enkelvoud is *आँख*.'
    example_gloss: Arjun heeft bruine ogen.
  hi.a1.unit31.lesson03.teach.neela_bhoora_hara:
    title: Blauw, bruin en groen
    gloss: blauw / bruin / groen
    note: 'Drie oogkleuren: *नीला*, *भूरा* en *हरा*; voor het vrouwelijke *आँखें* worden ze *नीली*, *भूरी* en *हरी*.'
    example_gloss:
    - Priya heeft blauwe ogen.
    - Vikram heeft bruine ogen.
    - Neha heeft groene ogen.
  hi.a1.unit31.lesson03.teach.neelee_ankhen_bhooree:
    title: Bijvoeglijke naamwoorden voor आँखें
    gloss: Blauwe ogen, bruine ogen, groene ogen.
    note: '*आँखें* is vrouwelijk, dus het bijvoeglijk naamwoord ervoor eindigt op *-ी*: *नीली आँखें*.'
  hi.a1.unit31.lesson03.teach.priya_kaisee_dikhtee:
    title: Hoe ziet Priya eruit?
    gloss: Hoe ziet Priya eruit?
    note: '*कैसी दिखती है?* (''hoe ziet ze eruit?'') is de kernvraag: *कैसी* en *दिखती* zijn vrouwelijk voor een vrouw, en *कैसा* en *दिखता* zijn mannelijk voor een man.'
  hi.a1.unit31.lesson03.teach.priya_ke_bal:
    title: Priya heeft lang blond haar en blauwe ogen
    gloss: Priya heeft lang blond haar en blauwe ogen.
    note: 'Een modelantwoord: haar en ogen verbonden met *और*. De bezitter krijgt *के* bij het meervoud *बाल* en *की* bij het vrouwelijke *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_bhasha_kaife:
    title: Priya stelt Nina voor
    gloss: 'Priya: Er komt een nieuw meisje naar het taalcafé. Ze heet Nina.'
    note: '*आ रही है* (''komt eraan'') introduceert iemand nieuws, en *उसका नाम ... है* geeft de naam.'
  hi.a1.unit31.lesson04.teach.arjun_oke_vah:
    title: Arjun vraagt hoe ze eruitziet
    gloss: 'Arjun: Oké! Hoe ziet ze eruit?'
    note: '*वह देखने में कैसी है?* vraagt ''hoe is ze om te zien''; *वह* betekent zowel ''hij'' als ''zij''.'
  hi.a1.unit31.lesson04.teach.priya_uska_kad:
    title: Priya beschrijft Nina's lengte en haar
    gloss: 'Priya: Ze is klein en heeft kort blond haar.'
    note: 'Dit combineert lengte en haar: *उसका कद छोटा है और उसके बाल छोटे और सुनहरे हैं*.'
  hi.a1.unit31.lesson04.teach.arjun_aur_uskee:
    title: Arjun vraagt naar haar ogen
    gloss: 'Arjun: En haar ogen?'
    note: '*उसकी आँखें* betekent ''haar ogen''; *उसकी* is vrouwelijk om met *आँखें* te congrueren.'
  hi.a1.unit31.lesson04.teach.priya_uskee_ankhen:
    title: Priya beschrijft Nina's ogen
    gloss: 'Priya: Ze heeft groene ogen.'
    note: '*हरी* eindigt op *-ी* omdat *आँखें* vrouwelijk is.'
  hi.a1.unit31.lesson04.teach.arjun_shukriya_tab:
    title: Arjun gaat haar herkennen
    gloss: 'Arjun: Bedankt! Dan herken ik haar wel.'
    note: '*पहचान लूँगा* (''ik zal herkennen'') is de toekomende tijd van *पहचानना*, en *उसे* betekent ''haar''.'
  hi.a1.unit31.lesson05.teach.vikram_aur_neha:
    title: Vikram en Neha vergelijken
    gloss: Vikram en Neha zijn broer en zus, maar ze zien er verschillend uit. Vikram is klein en heeft kort bruin haar en bruine ogen. Neha is langer dan Vikram en heeft lang bruin haar en groene ogen. Hoe zie jij eruit?
    note: Een korte vergelijking met alle kleur- en lengtewoorden die tot nu toe zijn geleerd, met als slot de kernvraag van de unit aan de lezer.
    glosses:
      भाई: broer
      बहन: zus
      दिखते: eruitzien
      अलग: verschillend
      छोटा: kort
      छोटे: kort
      भूरे: bruin
      बाल: haar
      भूरी: bruin
      आँखें: ogen
      लंबी: groter
      लंबे: lang
      हरी: groen
      कैसे: hoe (zoals in 'hoe zie jij eruit')
  hi.a1.unit31.lesson05.teach.vikram_neha_se:
    title: Vergelijken met से
    gloss: Vikram is kleiner dan Neha.
    note: '*से* betekent hier ''dan'' en staat achter de persoon met wie je vergelijkt: *नेहा से छोटा*, en het bijvoeglijk naamwoord komt vlak voor het werkwoord.'
  hi.a1.unit31.lesson05.teach.neha_ke_bal:
    title: Neha heeft langer haar dan Vikram
    gloss: Neha heeft langer haar dan Vikram.
    note: '*लंबे* congrueert met het meervoud *बाल*, en *विक्रम से* geeft de vergelijking.'
  hi.a1.unit31.lesson05.teach.mere_bal_chhote:
    title: Ik heb kort bruin haar
    gloss: Ik heb kort bruin haar.
    note: '*मेरे बाल छोटे और भूरे हैं* (''mijn haar is kort en bruin'') is een modelzin om jezelf te beschrijven; *मेरे* congrueert met het meervoud *बाल*.'
  hi.a1.unit31.lesson06.teach.arjun_dekho_kya:
    title: Arjun ziet Nina
    gloss: 'Arjun: Kijk, is dat Nina? Ze heeft kort blond haar en groene ogen.'
    note: '*देखो* (''kijk'') is de informele gebiedende wijs tegen een vriend.'
  hi.a1.unit31.lesson06.teach.priya_han_vahee:
    title: Priya bevestigt het
    gloss: 'Priya: Ja, dat is Nina!'
    note: Een korte, natuurlijke bevestiging.
  hi.a1.unit31.lesson06.teach.neena_hay_kya:
    title: Nina begroet Arjun
    gloss: 'Nina: Hoi, ben jij Arjun?'
    note: '*क्या तुम अर्जुन हो?* is een eenvoudige informele vraag aan iemand van je eigen leeftijd.'
  hi.a1.unit31.lesson06.teach.arjun_han_tumse:
    title: Arjun begroet Nina terug
    gloss: 'Arjun: Ja! Leuk je te ontmoeten, Nina.'
    note: '*तुमसे मिलकर अच्छा लगा* is de standaardzin als je iemand voor het eerst ontmoet; het gevoel overkomt ''jou'', dus een woord voor ''ik'' is niet nodig.'
  hi.a1.unit31.lesson06.teach.neena_mujhe_bhee:
    title: Nina beantwoordt de begroeting
    gloss: 'Nina: Aangenaam!'
    note: 'Dit sluit de dialoog af: Arjun heeft Nina herkend aan de beschrijving van Priya eerder.'
