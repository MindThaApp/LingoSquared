answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (पाँच vs. मैं, हैं, में). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (पांच for पाँच) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
units:
  hi.a1.unit02.numbers:
    title: Getallen
lessons:
  hi.a1.unit02.lesson01.numbers_zero_to_ten:
    title: Getallen van nul tot tien
  hi.a1.unit02.lesson02.numbers_and_prices:
    title: Getallen van elf tot honderd, en prijzen
  hi.a1.unit02.lesson03.phone_and_age:
    title: Telefoonnummer en leeftijd
teaching:
  hi.a1.unit02.lesson01.teach.shoonya:
    title: Nul
    gloss: nul
    note: Het beginpunt van alle getallen in deze unit.
    example_gloss: Vandaag is de temperatuur nul.
  hi.a1.unit02.lesson01.teach.ek:
    title: Een
    gloss: een
    note: In het Hindi is elk getal van 11 tot en met 99 een eigen woord, zonder vast patroon van 'tien + één'. Dat zie je in les 2, waar बीस (20) en तीस (30) geen herkenbaar stuk delen met एक (1) of दो (2).
    example_gloss: Ik heb één boek.
  hi.a1.unit02.lesson01.teach.do:
    title: Twee
    gloss: twee
    note: Een eenvoudig, veelgebruikt getal. Het is ook de informele gebiedende wijs van 'geven', maar de context maakt de betekenis altijd duidelijk.
    example_gloss: Ik heb twee broers.
  hi.a1.unit02.lesson01.teach.teen:
    title: Drie
    gloss: drie
    note: '*Chahiye* (''is nodig'') is een veelgebruikte onpersoonlijke constructie: *mujhe teen seb chahiye* betekent letterlijk ''voor mij drie appels [is] nodig''. Een heel natuurlijke manier om ''ik heb nodig'' te zeggen.'
    example_gloss: Ik heb drie appels nodig.
  hi.a1.unit02.lesson01.teach.chaar:
    title: Vier
    gloss: vier
    note: 'Hier is niets onregelmatigs: chaar gedraagt zich als elk ander klein getal.'
    example_gloss: Ik heb vier vrienden.
  hi.a1.unit02.lesson01.teach.paanch:
    title: Vijf
    gloss: vijf
    note: Geschreven met een chandrabindu (पाँच), niet met een anusvara. Het teken voor de klinker aa (ा) steekt niet boven de letter uit, en daarom gebruik je een chandrabindu in plaats van een gewone punt. Hetzelfde patroon zag je al in हाँ/कहाँ in unit 1.
    example_gloss: Ik heb vijf roepies.
  hi.a1.unit02.lesson01.teach.chhah:
    title: Zes
    gloss: zes
    note: In oudere teksten wordt het soms ook als छः geschreven; छह is de standaard moderne spelling.
    example_gloss: Ik heb zes boeken.
  hi.a1.unit02.lesson01.teach.saat:
    title: Zeven
    gloss: zeven
    note: Een handig getal om over de dagen van de week te praten.
    example_gloss: Een week heeft zeven dagen.
  hi.a1.unit02.lesson01.teach.aath:
    title: Acht
    gloss: acht
    note: 'Hier is niets onregelmatigs: aath gedraagt zich als elk ander klein getal.'
    example_gloss: In deze kamer staan acht stoelen.
  hi.a1.unit02.lesson01.teach.nau:
    title: Negen
    gloss: negen
    note: Hier is geen nasaalteken nodig, anders dan bij sommige getallen eromheen.
    example_gloss: De yogales begint om negen uur 's ochtends.
  hi.a1.unit02.lesson01.teach.das:
    title: Tien
    gloss: tien
    note: Het laatste getal van deze eerste reeks. Les 2 gaat verder met de getallen vanaf elf en de tientallen, die vanaf hier niet meer te voorspellen zijn.
    example_gloss: Ik heb tien vingers aan mijn handen.
  hi.a1.unit02.lesson02.teach.gyaarah:
    title: Elf
    gloss: elf
    note: 'Vanaf hier is elk Hindi-getal een eigen, onregelmatig woord: gyaarah bevat niet zichtbaar das (10) of ek (1). Er is geen sluipweg; je moet ze stuk voor stuk leren.'
    example_gloss: In deze klas zitten elf leerlingen.
  hi.a1.unit02.lesson02.teach.baarah:
    title: Twaalf
    gloss: twaalf
    note: 'Nog zo''n getal dat je gewoon uit je hoofd moet leren: geen voorspelbaar patroon verbindt het met do (2).'
    example_gloss: Een jaar heeft twaalf maanden.
  hi.a1.unit02.lesson02.teach.pandrah:
    title: Vijftien
    gloss: vijftien
    note: Veelgebruikt om over korte tijdspannes te praten, zoals een pauze van een kwartier.
    example_gloss: Ik heb vijftien minuten nodig.
  hi.a1.unit02.lesson02.teach.bees:
    title: Twintig
    gloss: twintig
    note: Een echt nieuw woord, geen combinatie van das (10) en do (2). Dit patroon zet zich voort bij alle tientallen vanaf hier.
    example_gloss: Mijn zus is twintig jaar oud.
  hi.a1.unit02.lesson02.teach.tees:
    title: Dertig
    gloss: dertig
    note: 'Weer een eigen woord: het lijkt een beetje op teen (3), maar je kunt het niet opbouwen uit teen plus das. Leer het dus als apart woord.'
    example_gloss: Het kaartje kost dertig roepies.
  hi.a1.unit02.lesson02.teach.pachaas:
    title: Vijftig
    gloss: vijftig
    note: Een heel gebruikelijk rond getal, vooral bij prijzen.
    example_gloss: Ik heb vijftig roepies.
  hi.a1.unit02.lesson02.teach.sau:
    title: Honderd
    gloss: honderd
    note: Een rond getal dat in dagelijkse prijzen heel vaak voorkomt.
    example_gloss: Dit boek kost honderd roepies.
  hi.a1.unit02.lesson02.teach.keemat:
    title: Prijs
    gloss: prijs; kosten
    note: '*Keemat* is een vrouwelijk zelfstandig naamwoord: het bezittelijk voornaamwoord krijgt altijd de vrouwelijke vorm (*iski keemat*, ''de prijs ervan''), ongeacht welk voorwerp een prijs krijgt.'
    example_gloss: Wat kost dit kaartje?
  hi.a1.unit02.lesson02.teach.rupaye:
    title: Roepies
    gloss: roepies
    note: '*Rupaya* is de enkelvoudsvorm (voor precies één roepie); *rupaye* gebruik je voor elk groter bedrag.'
    example_gloss: Dit kost vijftig roepies.
  hi.a1.unit02.lesson02.teach.iski_keemat_kya_hai:
    title: Naar een prijs vragen
    gloss: Wat kost het?
    note: '*Iski* (''zijn/haar/ervan'') congrueert met het vrouwelijke woord *keemat* (''prijs''), niet met het voorwerp waarvan de prijs wordt gevraagd. Het is hetzelfde patroon van congruentie bij bezit als in *mera naam* uit unit 1.'
  hi.a1.unit02.lesson02.teach.iski_keemat_pachaas_rupaye_hai:
    title: Een prijs noemen
    gloss: De prijs is vijftig roepies.
    note: Het natuurlijke antwoord in een volledige zin op Iski keemat kya hai?
  hi.a1.unit02.lesson03.teach.aapka_phone_number_kya_hai:
    title: Formeel naar een telefoonnummer vragen
    gloss: Wat is uw telefoonnummer? (formeel)
    note: '*Number* (नंबर) is een leenwoord uit het Engels dat in het alledaagse Hindi voortdurend wordt gebruikt. *Aapka* congrueert met het mannelijke woord *number*.'
  hi.a1.unit02.lesson03.teach.tumhara_phone_number_kya_hai:
    title: Informeel naar een telefoonnummer vragen
    gloss: Wat is je telefoonnummer? (informeel)
    note: Tumhara vervangt aapka als je met een vriend of leeftijdsgenoot praat, hetzelfde patroon als in unit 1.
  hi.a1.unit02.lesson03.teach.mera_number:
    title: Een nummer geven, inleiding
    gloss: Mijn nummer is...
    note: Een natuurlijke inleiding voordat je de cijfers een voor een voorleest.
  hi.a1.unit02.lesson03.teach.sample_number:
    title: Een voorbeeld van een telefoonnummer
    gloss: Zes, twee, acht, drie, vijf.
    note: Hindi-telefoonnummers worden cijfer voor cijfer voorgelezen. Alle cijfers hier heb je al in les 1 geleerd.
  hi.a1.unit02.lesson03.teach.aapki_umra_kya_hai:
    title: Beleefd naar iemands leeftijd vragen
    gloss: Hoe oud bent u? (formeel)
    note: '*Umra* (''leeftijd'') is een vrouwelijk zelfstandig naamwoord, dus *aapki* krijgt hier de vrouwelijke vorm. Het is hetzelfde congruentiepatroon als bij *iski keemat*, nu toegepast op iemands leeftijd in plaats van een prijs.'
  hi.a1.unit02.lesson03.teach.tumhari_umra_kya_hai:
    title: Informeel naar iemands leeftijd vragen
    gloss: Hoe oud ben je? (informeel)
    note: Tumhari vervangt aapki als je met een vriend of leeftijdsgenoot praat.
  hi.a1.unit02.lesson03.teach.meri_umra_tees_saal_hai:
    title: Je leeftijd zeggen
    gloss: Ik ben dertig jaar oud.
    note: '*Meri* congrueert met *umra* (vrouwelijk), nooit met het geslacht van de spreker zelf. Anders dan de werkwoordsvormen *chahta/chahti* uit unit 1 verandert dit bezittelijk voornaamwoord nooit, wie er ook spreekt.'
  hi.a1.unit02.lesson03.teach.dialogue.line01:
    title: Arjun vraagt om Priya's nummer
    gloss: Arjun vraagt Priya informeel om haar telefoonnummer.
    note: Hergebruikt precies de informele vraag naar een telefoonnummer uit deze les.
  hi.a1.unit02.lesson03.teach.dialogue.line02:
    title: Priya geeft haar nummer en vraagt terug
    gloss: Priya leest haar telefoonnummer cijfer voor cijfer voor en vraagt dan naar dat van Arjun.
    note: Alle cijfers hier heb je al in les 1 van deze unit geleerd.
  hi.a1.unit02.lesson03.teach.dialogue.line03:
    title: Arjun geeft zijn nummer
    gloss: Arjun leest zijn eigen telefoonnummer voor.
    note: Ook hier komen alle cijfers uit de woordenschat van les 1.
  hi.a1.unit02.lesson03.teach.dialogue.line04:
    title: Priya vraagt naar Arjuns leeftijd
    gloss: Priya bedankt hem en vraagt informeel naar zijn leeftijd.
    note: Shukriya ('dank je') verandert niet met het register, net als de kaart shukriya uit unit 1.
  hi.a1.unit02.lesson03.teach.dialogue.line05:
    title: Arjun noemt zijn leeftijd en vraagt terug
    gloss: Arjun zegt dat hij twintig is en vraagt dan terug naar Priya's leeftijd.
    note: Tumhari? op zichzelf is een korte, natuurlijke manier om de vraag terug te stellen.
  hi.a1.unit02.lesson03.teach.dialogue.line06:
    title: Priya noemt haar leeftijd
    gloss: Priya zegt dat ze dertig is.
    note: Meri umra tees saal hai hergebruikt precies het zinspatroon dat eerder in deze les is geleerd.
  hi.a1.unit02.lesson03.teach.dialogue.line07:
    title: Arjun sluit het gesprek af
    gloss: Arjun reageert positief en zegt dat hij haar weer zal zien.
    note: Accha en phir milenge hergebruiken beide de afscheidswoordenschat uit unit 1.
  hi.a1.unit02.lesson03.teach.dialogue.line08:
    title: Priya sluit het gesprek af
    gloss: Priya stemt in en zegt losjes 'tot ziens'.
    note: Theek hai en phir milte hain hergebruiken beide de afscheidswoordenschat uit unit 1.
