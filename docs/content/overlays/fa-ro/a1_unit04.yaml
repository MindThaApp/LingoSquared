  ro.a1.unit04.lesson02.sferturi_si_intrebari:
    title: ربع، و پرسیدن ساعت
  ro.a1.unit04.lesson03.cand_incepe_cursul:
    title: کلاس کی شروع می‌شود؟
teaching:
  ro.a1.unit04.lesson01.teach.este:
    title: 'یادآوری: este'
    gloss: است
    note: '*Este* قبلاً در واحد ۲ و ۳ آمده بود. چه عدد بگویید، چه روز، چه تاریخ، و حالا چه ساعت، همین کلمه بدون تغییر می‌ماند.'
  ro.a1.unit04.lesson01.teach.ora:
    title: ساعت
    gloss: ساعت
    note: اسمی مؤنث است؛ *ora* درست پیش از عدد می‌آید تا ساعت گفته شود، مثلاً *ora unu* (ساعت یک).
    example_gloss: ساعت یک است.
  ro.a1.unit04.lesson01.teach.ora_unu:
    title: ساعت یک
    gloss: ساعت یک
    note: تحت‌اللفظی یعنی «ساعتِ یک»؛ اول ora می‌آید و بعد عدد.
  ro.a1.unit04.lesson01.teach.ora_doua:
    title: ساعت دو
    gloss: ساعت دو
    note: اینجا عدد شکل مؤنث *două* را می‌گیرد تا با *ora* که مؤنث است هماهنگ باشد؛ الگوی کامل در کارت بعدی آمده است.
  ro.a1.unit04.lesson01.teach.ora_gender_note:
    title: 'یک بی‌قاعدگی واقعی: unu همان unu می‌ماند'
    gloss: ora unu (نه "ora una") / ora două (نه "ora doi")
    note: 'عددهایی که شکل مؤنث دارند معمولاً با اسم مؤنث همان شکل را می‌گیرند (*doi* ← *două* برای اسم مؤنثی مثل *ora*)، ولی *unu* در گفتن ساعت تنها استثناست: همیشه *ora unu* می‌گویند و هرگز *ora una*، با اینکه *ora* مؤنث است.'
  ro.a1.unit04.lesson01.teach.ora_trei:
    title: ساعت سه
    gloss: ساعت سه
    note: Trei برخلاف unu/una یا doi/două اصلاً بر اساس جنسیت تغییر نمی‌کند؛ یک چیز کمتر برای یادگرفتن.
  ro.a1.unit04.lesson01.teach.jumatate:
    title: نیم
    gloss: نیم
    note: 'با și (و) به کار می‌رود تا «و نیم» بگوییم: X și jumătate.'
    example_gloss: یک و نیم.
  ro.a1.unit04.lesson01.teach.ora_unu_jumatate:
    title: یک و نیم
    gloss: ساعت یک و نیم است.
    note: تحت‌اللفظی یعنی «ساعت یک و نیم است»؛ ساده و مستقیم، درست مثل فارسی.
  ro.a1.unit04.lesson01.teach.cat_e_ora:
    title: پرسیدن ساعت
    gloss: ساعت چند است؟
    note: 'روش معمول پرسیدن ساعت: cât (چقدر؛ از خانوادهٔ câți در درس ۲) + este (است) + ora (ساعت).'
  ro.a1.unit04.lesson02.teach.sfert:
    title: یک ربع
    gloss: یک ربع
    note: یک‌چهارم ساعت، یعنی ۱۵ دقیقه. با și (و) یا fără (بدون) ترکیب می‌شود تا «و ربع» یا «ربع به» بگوییم.
    example_gloss: ساعت یک و ربع است.
  ro.a1.unit04.lesson02.teach.sfert_rule:
    title: și و fără همراه با ربع یا نیم
    gloss: și un sfert = ۱۵+ دقیقه · fără un sfert = ۱۵− دقیقه
    note: '*Și* (و) دقیقه‌ها را به ساعتی که تازه گذشته اضافه می‌کند؛ *fără* (بدون) دقیقه‌ها را از ساعتی که هنوز نیامده کم می‌کند. فارسی هم همین منطق را دارد: «دو و ربع» در برابر «ربع به سه».'
  ro.a1.unit04.lesson02.teach.ora_doua_sfert:
    title: دو و ربع
    gloss: ساعت دو و ربع است.
    note: Ora două (۲:۰۰) به‌اضافهٔ și un sfert (۱۵+ دقیقه) می‌شود ۲:۱۵.
  ro.a1.unit04.lesson02.teach.fara:
    title: بدون / مانده به
    gloss: بدون
    note: دقیقه‌ها را از ساعت بعدی به عقب می‌شمارد؛ نقشش مثل «ربع به سه» در فارسی است.
    example_gloss: ربع به سه است.
  ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert:
    title: یک ربع به سه
    gloss: ربع به سه است.
    note: Ora trei (۳:۰۰) منهای fără un sfert (۱۵− دقیقه) می‌شود ۲:۴۵؛ رومانیایی زمان را با ساعتی می‌گوید که به آن می‌رسیم، نه ساعتی که گذشته.
  ro.a1.unit04.lesson02.teach.la_ce_ora:
    title: پرسیدن «چه ساعتی؟»
    gloss: چه ساعتی؟
    note: La (در/ساعتِ) + ce (چه) + oră (ساعت، اینجا شکل نامعرفه و نه ora)؛ روش معمول پرسیدن زمان وقوع یک کار.
  ro.a1.unit04.lesson02.teach.la_ora_noua:
    title: گفتن زمان وقوع یک کار
    gloss: ساعت نه.
    note: La (در) + ora (ساعت، اینجا شکل معرفه) + عدد؛ الگوی پاسخ به 'La ce oră?'.
  ro.a1.unit04.lesson02.teach.tarziu:
    title: دیر
    gloss: دیر
    note: واکنشی رایج و مفید هنگام نگاه‌کردن به ساعت.
    example_gloss: دیر شده!
  ro.a1.unit04.lesson03.teach.cand:
    title: 'یادآوری: când'
    gloss: کی؟
    note: Când در واحد ۳ برای پرسیدن زمان یک رویداد آمده بود؛ اینجا برای پرسیدن زمان شروع یک کار برمی‌گردد.
  ro.a1.unit04.lesson03.teach.zi_parts:
    title: بخش‌های روز
    gloss: صبح / بعدازظهر / عصر / شب
    note: هر کدام شکل معرفهٔ اسم است که به‌صورت قید به کار می‌رود؛ در رومانیایی برای گفتن «صبح‌ها» یا «در صبح» حرف اضافه‌ای لازم نیست.
    example_gloss:
    - کلاس صبح است.
    - کلاس بعدازظهر است.
    - میهای عصرها کار می‌کند.
    - آنا شب‌ها می‌خوابد.
  ro.a1.unit04.lesson03.teach.cursul:
    title: کلاس
    gloss: کلاس
    note: شکل معرفهٔ curs (کلاس یا دوره)؛ اینجا یعنی کلاس رومانیایی آنا و میهای.
    example_gloss: کلاس ساعت نه شروع می‌شه.
  ro.a1.unit04.lesson03.teach.incepe:
    title: شروع می‌شود
    gloss: شروع می‌شود
    note: شکل زمان حال برای او (مرد، زن یا چیز)؛ یعنی هر فاعل مفرد غیر از من و تو، مثل cursul (کلاس).
    example_gloss: کلاس صبح شروع می‌شود.
  ro.a1.unit04.lesson03.teach.cand_incepe_cursul:
    title: پرسیدن زمان شروع کلاس
    gloss: کلاس کی شروع می‌شود؟
    note: când را با începe و cursul که در این درس یاد گرفتید کنار هم می‌گذارد.
  ro.a1.unit04.lesson03.teach.raspuns_curs:
    title: گفتن زمان شروع کلاس
    gloss: کلاس ساعت نه صبح شروع می‌شود.
    note: قیدی مثل روز هفته (dimineața) آخر جمله و بعد از ویرگول می‌آید، همان‌طور که در واحد ۳ تاریخ بعد از روز هفته آمد.
  ro.a1.unit04.lesson03.teach.line01:
    title: پرسیدن زمان شروع کلاس
    gloss: آنا از میهای می‌پرسد کلاس کی شروع می‌شود.
    note: پرسشی ساده و بی‌طرف از نظر لحن؛ este و începe با tu یا dumneavoastră تغییر نمی‌کنند.
  ro.a1.unit04.lesson03.teach.line02:
    title: گفتن ساعت
    gloss: میهای می‌گوید کلاس ساعت نه صبح شروع می‌شود.
    note: میهای همان الگوی ساعت و بخش روز را که در این درس آمد دوباره به کار می‌برد.
  ro.a1.unit04.lesson03.teach.line03:
    title: تأیید و پایان گفت‌وگو
    gloss: آنا از او تشکر می‌کند و خداحافظی می‌کند.
    note: La revedere که در واحد ۱ یاد گرفتید، مثل همیشه گفت‌وگو را تمام می‌کند.
  ro.a1.unit04.lesson03.teach.line04:
    title: پایان دیدار
    gloss: میهای هم خداحافظی می‌کند و اسم آنا را می‌آورد.
    note: تکرار la revedere همراه با اسم طرف مقابل، راهی طبیعی و دوستانه برای پایان دادن به گفت‌وگوست.
