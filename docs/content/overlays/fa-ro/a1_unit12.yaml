teaching:
  ro.a1.unit12.lesson01.teach.reminder_parc_cinema:
    title: 'یادآوری: parc, cinema'
    gloss: parc (پارک) · cinema (سینما)
    note: هر دو در واحد ۱۱ آمده‌اند -- اینجا با دستور زمان گذشتهٔ تازهٔ همین واحد ترکیب می‌شوند.
  ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata:
    title: 'یادآوری: astăzi, mâine, duminică, sâmbătă'
    gloss: astăzi (امروز) · mâine (فردا) · duminică (یکشنبه) · sâmbătă (شنبه)
    note: همه در واحد ۳ و ۱۱ آمده‌اند -- اینجا زمینه را برای تقابل با *ieri* (دیروز)، کلمهٔ تازهٔ همین درس، آماده می‌کنند.
  ro.a1.unit12.lesson01.teach.am_fost_vocab:
    title: من بودم / رفتم
    gloss: Am fost (من بودم / رفتم)
    note: زمان گذشتهٔ فعل *a fi* (بودن) -- *am* همان کلمهٔ کمکیِ ثابت برای «من» و «ما» است و *fost* شکل ثابت گذشته. با یک مکان، *am fost la...* روش رایج و طبیعی برای گفتن «رفتم به...» است -- در گفتار از یک فعل مستقیم مثل «راه رفتم / سفر کردم» رایج‌تر است.
    example_gloss:
    - به پارک رفتم.
  ro.a1.unit12.lesson01.teach.am_fost_parc_phrase:
    title: به پارک رفتم
    gloss: Am fost la parc. (به پارک رفتم.)
    note: 'الگوی کامل: am fost + la + مکان.'
  ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase:
    title: به سینما رفتم
    gloss: Am fost la cinema. (به سینما رفتم.)
    note: همان الگوی *Am fost la parc* با مکانی دیگر.
  ro.a1.unit12.lesson01.teach.ieri_vocab:
    title: دیروز
    gloss: Ieri (دیروز)
    note: در واحد ۳ کنار *astăzi* (امروز) و *mâine* (فردا) دیدید -- حالا با زمان گذشته به کار می‌رود و اول جمله می‌آید تا بگوید چیزی کی اتفاق افتاده.
    example_gloss:
    - دیروز رفتم پارک.
  ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase:
    title: دیروز به پارک رفتم
    gloss: Ieri am fost la parc. (دیروز به پارک رفتم.)
    note: اگر *ieri* را اول *Am fost la parc* بگذارید، زمانش دقیقاً مشخص می‌شود.
  ro.a1.unit12.lesson02.teach.reminder_mananc_beau:
    title: 'یادآوری: mănânc, beau'
    gloss: mănânc (می‌خورم) · beau (می‌نوشم)
    note: هر دو در برنامهٔ روزانهٔ واحد ۱۰ آمده‌اند -- این درس آن‌ها را به شکل گذشته درمی‌آورد.
  ro.a1.unit12.lesson02.teach.reminder_paine_cafea_ceai_si:
    title: 'یادآوری: pâine, cafea, ceai, și'
    gloss: pâine (نان) · cafea (قهوه) · ceai (چای) · și (و)
    note: همه در واحد ۶ و ۱۰ آمده‌اند -- اینجا در جمله‌های گذشتهٔ همین درس دوباره به کار می‌روند.
  ro.a1.unit12.lesson02.teach.am_mancat_vocab:
    title: خوردم
    gloss: Am mâncat (خوردم)
    note: زمان گذشتهٔ *a mânca* (خوردن) که قبلاً به شکل *mănânc* (می‌خورم، واحد ۱۰) دیدید -- همان فعل، در زمان گذشته. Am + mâncat، با همان الگوی *am fost*.
    example_gloss:
    - نان خوردم.
  ro.a1.unit12.lesson02.teach.am_mancat_paine_phrase:
    title: نان خوردم
    gloss: Am mâncat pâine. (نان خوردم.)
    note: 'الگوی کامل: am mâncat + خوراکی.'
  ro.a1.unit12.lesson02.teach.am_baut_vocab:
    title: نوشیدم
    gloss: Am băut (نوشیدم)
    note: زمان گذشتهٔ *a bea* (نوشیدن) که قبلاً به شکل *beau* (می‌نوشم، واحد ۱۰) دیدید -- همان فعل، در زمان گذشته.
    example_gloss:
    - چای نوشیدم.
  ro.a1.unit12.lesson02.teach.am_baut_ceai_phrase:
    title: چای نوشیدم
    gloss: Am băut ceai. (چای نوشیدم.)
    note: 'الگوی کامل: am băut + نوشیدنی.'
  ro.a1.unit12.lesson02.teach.am_mancat_am_baut_phrase:
    title: نان خوردم و چای نوشیدم
    gloss: Am mâncat pâine și am băut ceai. (نان خوردم و چای نوشیدم.)
    note: دو کار گذشته که با *și* به هم وصل شده‌اند -- همان حرف ربطی که واحد ۱۰ برای کارهای روزمرهٔ زمان حال به کار برد.
  ro.a1.unit12.lesson03.teach.reminder_am_fost_ieri_parc_cinema:
    title: 'یادآوری: am fost, ieri, parc, cinema'
    gloss: am fost (من بودم / رفتم) · ieri (دیروز) · parc (پارک) · cinema (سینما)
    note: همه از درس اول همین واحدند -- اینجا زمینه را برای مرور یکشنبه آماده می‌کنند.
  ro.a1.unit12.lesson03.teach.reminder_am_mancat_am_baut:
    title: 'یادآوری: am mâncat, am băut, pâine, cafea, ceai'
    gloss: am mâncat (خوردم) · am băut (نوشیدم) · pâine (نان) · cafea (قهوه) · ceai (چای)
    note: همه از درس دوم همین واحدند -- اینجا Ana و Mihai هرکدام می‌گویند چه خورده‌اند.
  ro.a1.unit12.lesson03.teach.reminder_cum_duminica_bine:
    title: 'یادآوری: cum, duminică, bine, mulțumesc, la revedere, Ana, Mihai'
    gloss: cum (چطور، واحد ۱ و ۹) · duminică (یکشنبه، واحد ۳) · bine (خوب، واحد ۱) · mulțumesc (ممنون) · la revedere (خداحافظ) · Ana, Mihai (نام‌ها)
    note: 'همه در واحدهای قبلی آمده‌اند -- *cum* اول برای پرسیدن اسم (واحد ۱) و پرسیدن آدرس (واحد ۹) دیده شد و اینجا نوع دیگری از پرسش را شروع می‌کند: چیزی چطور گذشت.'
  ro.a1.unit12.lesson03.teach.a_fost_vocab:
    title: بود
    gloss: A fost (بود)
    note: شخصی دیگر از همان فعل *am fost* -- *a* کلمهٔ کمکیِ «او / آن» است، نه «من / ما». فعلاً *Cum a fost...?* و *A fost bine!* را مثل عبارت‌های ثابت یاد بگیرید، نه الگویی که آزادانه بسازید.
    example_gloss:
    - خوب بود!
  ro.a1.unit12.lesson03.teach.a_fost_bine_phrase:
    title: خوب بود!
    gloss: A fost bine! (خوب بود!)
    note: راهی کوتاه و طبیعی برای گفتن اینکه چیزی خوب پیش رفت -- پاسخ *Cum a fost...?*
  ro.a1.unit12.lesson03.teach.cum_a_fost_duminica_phrase:
    title: یکشنبه چطور بود؟
    gloss: Cum a fost duminică? (یکشنبه چطور بود؟)
    note: 'راهی طبیعی برای شروع صحبت درباره‌ی روزی که گذشته است، حتی با کسی که خودش هم آنجا بوده: از او می‌خواهید بگوید چه حسی داشته یا چه چیزی بیشتر به یادش مانده.'
  ro.a1.unit12.lesson03.teach.line01:
    title: سلام و پرسیدن درباره‌ی یکشنبه
    gloss: میهای به آنا سلام می‌کند و می‌پرسد یکشنبه چطور بود.
    note: جمله‌ی *Cum a fost duminică?* از همین واحد با *Bună* که از قبل بلدید ترکیب شده است.
  ro.a1.unit12.lesson03.teach.line02:
    title: جواب دادن و گفتن مکان
    gloss: آنا می‌گوید خوب بود و به پارک رفته است.
    note: '*A fost bine!* با جمله‌ی *Am fost la parc* از درس اول همین واحد ترکیب شده است.'
  ro.a1.unit12.lesson03.teach.line03:
    title: گفتن اینکه چه خورده و چه نوشیده
    gloss: میهای می‌گوید نان خورده و چای نوشیده.
    note: جمله‌ی *Am mâncat pâine și am băut ceai* از درس دوم دوباره آمده است؛ ترتیب همان است که میهای در واحد ۶ داشت (pâine و ceai).
  ro.a1.unit12.lesson03.teach.line04:
    title: گفتن اینکه چه نوشیده
    gloss: آنا می‌گوید قهوه نوشیده است.
    note: ترتیب همان است که آنا در واحد ۶ داشت (cafea).
  ro.a1.unit12.lesson03.teach.line05:
    title: تشکر و خداحافظی
    gloss: میهای از آنا تشکر می‌کند و خداحافظی می‌کند.
    note: همان الگوی پایانی که دیالوگ همه‌ی واحدهای قبلی با آن تمام می‌شد.
  ro.a1.unit12.lesson03.teach.line06:
    title: تمام کردن گفت‌وگو
    gloss: آنا هم خداحافظی می‌کند و اسم میهای را می‌آورد.
    note: همان الگوی دوستانه‌ی پایانی که دیالوگ همه‌ی واحدهای قبلی با آن تمام می‌شد.
