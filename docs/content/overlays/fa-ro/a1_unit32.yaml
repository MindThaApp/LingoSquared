    title: بله، من یک سگ دارم
    gloss: بله، یک سگ دارم.
    note: یک پاسخ مثبت ساده با واژه‌های تازه‌ی این درس.
  ro.a1.unit32.lesson01.teach.nu_nu_am:
    title: نه، من حیوان خانگی ندارم
    gloss: نه، من حیوان خانگی ندارم.
    note: بعد از *nu am*، کلمهٔ *niciun* («حتی یک») اسم را منفی می‌کند؛ یادداشت دستور را ببینید.
  ro.a1.unit32.lesson01.teach.la_negatie_nu:
    title: 'Nu am: بدون حرف نکره'
    gloss: 'بعد از nu am از un یا o استفاده نمی‌کنید: Nu am timp, nu am niciun animal de companie.'
    note: 'دقیقاً همان الگویی که در *Nu am timp* یاد گرفتید: دستور تازه‌ای نیست، فقط اسمی تازه برای همین الگو.'
  ro.a1.unit32.lesson02.teach.a_scoate_la:
    title: بردنِ حیوان به پیاده‌روی
    gloss: حیوان را به پیاده‌روی بردن
    note: '*A scoate la plimbare* یک عبارت ثابت است؛ یادداشت دستور را ببینید.'
    example_gloss: من هر روز سگ را به پیاده‌روی می‌برم.
  ro.a1.unit32.lesson02.teach.verbul_se_schimba:
    title: فعل با شخص تغییر می‌کند
    gloss: 'فعل با شخص تغییر می‌کند: eu scot, tu scoți, el scoate (من، تو، او) سگ را بیرون می‌برد.'
    note: 'فعل‌های رومانیایی برای هر شخص پایانهٔ متفاوتی می‌گیرند، پس *a scoate la plimbare* مثل یک فعل صرف می‌شود: *scot*، *scoți*، *scoate*.'
  ro.a1.unit32.lesson02.teach.a_da_de:
    title: غذا دادن
    gloss: غذا دادن
    example_gloss: من هر روز به گربه غذا می‌دهم.
  ro.a1.unit32.lesson02.teach.a_se_juca:
    title: بازی کردن با
    gloss: بازی کردن با
    example_gloss: Andrei با گربه‌اش بازی می‌کند.
  ro.a1.unit32.lesson02.teach.scot_cainele_la:
    title: من هر روز سگ را به پیاده‌روی می‌برم
    gloss: من هر روز سگ را به پیاده‌روی می‌برم.
    note: '*a scoate la plimbare* را با *în fiecare zi* («هر روز») ترکیب می‌کند که از واحد قبلی می‌شناسید.'
  ro.a1.unit32.lesson02.teach.dau_de_mancare:
