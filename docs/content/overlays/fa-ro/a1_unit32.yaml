    - پدربزرگ پرنده‌ها را خیلی دوست دارد.
  ro.a1.unit32.lesson03.teach.iubesc_animalele:
    title: من حیوان‌ها را خیلی دوست دارم
    gloss: من حیوان‌ها را خیلی دوست دارم.
    note: '*A iubi* («دوست داشتن») مفعولش را بدون حرف اضافه می‌گیرد: *Iubesc animalele*؛ نشانهٔ معرفهٔ *-le* می‌رساند که منظور حیوانات به‌طور کلی است.'
  ro.a1.unit32.lesson03.teach.elena_iubeste_pisicile:
