  ro.a1.unit32.lesson04.teach.mihai_ai_un:
    title: Mihai دربارهٔ حیوان خانگی می‌پرسد
    gloss: 'Mihai: Ana، تو حیوان خانگی داری؟'
  ro.a1.unit32.lesson04.teach.ana_da_am:
    title: Ana یک سگ دارد
    gloss: 'Ana: آره، یک سگ دارم.'
  ro.a1.unit32.lesson04.teach.mihai_cum_arata:
    title: Mihai می‌پرسد چه شکلی است
    gloss: 'Mihai: چه شکلی است؟'
    note: همان پرسش *Cum arată ...?* از واحد ظاهر، این بار دربارهٔ یک حیوان.
  ro.a1.unit32.lesson04.teach.ana_are_blana:
    title: Ana سگش را توصیف می‌کند
    gloss: 'Ana: پشمش قهوه‌ای است و کوچک است.'
    note: واژه‌های رنگ مو و اندازه از درس ظاهر تکرار شده‌اند، این بار برای توصیف پشم و موی حیوان به جای موی آدم.
  ro.a1.unit32.lesson04.teach.pentru_un_animal:
    title: El و ea برای حیوانات
    gloss: 'برای یک حیوان بسته به جنسیتش از el یا ea استفاده می‌کنید: câinele می‌شود el و pisica می‌شود ea.'
    note: تا اینجا *el* و *ea* در این دوره همیشه برای آدم‌ها بودند؛ حالا برای حیوانات هم به کار می‌روند و از جنسیت اسم پیروی می‌کنند.
  ro.a1.unit32.lesson04.teach.mihai_il_scoti:
    title: Mihai دربارهٔ بیرون بردن می‌پرسد
    gloss: 'Mihai: هر روز او را بیرون می‌بری؟'
  ro.a1.unit32.lesson04.teach.ana_da_il:
    title: Ana برنامهٔ روزانه‌اش را توضیح می‌دهد
    gloss: 'Ana: آره، هر روز او را بیرون می‌برم و بهش غذا می‌دهم.'
  ro.a1.unit32.lesson05.teach.mihai_si_elena:
    title: Mihai، Elena و Andrei دربارهٔ حیوانات
    gloss: 'Mihai و Elena هر دو حیوانات را دوست دارند، ولی هیچ‌کدامشان حیوان خانگی ندارد. Mihai سگ‌ها را دوست دارد و Elena گربه‌ها را. اما Andrei حیوان خانگی دارد: یک گربه. او زیاد با گربه‌اش بازی می‌کند و هر روز به آن غذا می‌دهد. شما حیوان خانگی دارید؟'
    note: دوست داشتنِ یک حیوان را با داشتنِ واقعی‌اش مقایسه می‌کند؛ همان نکته‌ی اصلیِ ارتباطی این درس.
    glosses:
      iubesc: خیلی دوست دارد
      amândoi: هر دو
      animalele: حیوان‌ها
      doi: هر دو
      companie: حیوان خانگی
      câinii: سگ‌ها
      pisicile: گربه‌ها
      pisică: گربه
      joacă: بازی می‌کند
      dă: می‌دهد
      fiecare: هر
      mâncare: غذا
  ro.a1.unit32.lesson05.teach.andrei_se_joaca:
    title: Andrei زیاد با گربه‌اش بازی می‌کند
    gloss: Andrei زیاد با گربه‌اش بازی می‌کند.
    note: '*Des* («اغلب») همان واژهٔ بسامد واحد سرگرمی‌هاست؛ *a se juca cu* («بازی کردن با») یک فعل بازتابی است.'
  ro.a1.unit32.lesson05.teach.iubesc_cainii_nu:
    title: من سگ‌ها را خیلی دوست دارم. حیوان خانگی ندارم.
    gloss: من سگ‌ها را خیلی دوست دارم. حیوان خانگی ندارم.
    note: یک پاسخ نمونه‌ی دوجمله‌ای که برای تمرین نوشتاری این درس می‌توانید از آن استفاده کنید.
  ro.a1.unit32.lesson06.teach.ana_nina_ai:
    title: Ana از Nina می‌پرسد
    gloss: 'Ana: Nina، تو هم حیوان خانگی داری؟'
  ro.a1.unit32.lesson06.teach.nina_da_am:
    title: Nina یک پرنده به اسم Pico دارد
    gloss: 'Nina: آره، یه پرنده دارم. اسمش Pico‌ـه.'
    note: '*O cheamă* («اسمش است») همان فعل *a chema* برای اسم‌گذاری است؛ pasăre مؤنث است، برای همین ضمیر *o* می‌آید.'
  ro.a1.unit32.lesson06.teach.mihai_ce_frumos:
    title: واکنش Mihai
    gloss: 'Mihai: چه قشنگ! هر روز با او چه کار می‌کنی؟'
  ro.a1.unit32.lesson06.teach.nina_ii_dau:
    title: Nina هر روز غذا می‌دهد
    gloss: 'Nina: هر روز بهش غذا می‌دم.'
  ro.a1.unit32.lesson06.teach.mihai_iubesc_si:
    title: Mihai هم پرنده‌ها را دوست دارد
    gloss: 'Mihai: من هم پرنده‌ها را دوست دارم.'
  ro.a1.unit32.lesson06.teach.ana_ce_frumos:
    title: Ana گفت‌وگو را تمام می‌کند
    gloss: 'Ana: چه خوب که هر سه‌تایمان حیوانات را دوست داریم!'
    note: حرف‌های هر سه شخصیت درباره‌ی حیوان‌ها در این درس را کنار هم جمع‌بندی می‌کند.
