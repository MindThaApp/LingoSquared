teaching:
  ro.a1.unit32.lesson01.teach.animalul_un_animal:
    title: حیوان، حیوان خانگی
    gloss: حیوان / حیوان خانگی
    note: '*Animal* واژهٔ کلی است؛ *animal de companie* («حیوان همدم») مشخصاً یعنی حیوان خانگی. جمعش *animale* است (*un animal*، *două animale*).'
    example_gloss:
    - سگ یک حیوان است.
    - سگ یک حیوان خانگی هم هست.
