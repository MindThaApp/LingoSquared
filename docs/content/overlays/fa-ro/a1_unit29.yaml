teaching:
  ro.a1.unit29.lesson01.teach.cat_costa_in:
    title: پرسیدن قیمت کل
    gloss: در مجموع چقدر می‌شود؟
    note: '*În total* (روی‌هم‌رفته) روشن می‌کند که قیمت کل را می‌خواهید، نه قیمت یک مورد؛ *Cât costă?* یعنی «قیمتش چقدر است؟».'
  ro.a1.unit29.lesson01.teach.costa_douazeci_si:
    title: گفتن قیمت کل
    gloss: روی هم صد لِی می‌شود.
    note: '*Costă* شکل سومشخص مفرد *a costa* (قیمت داشتن) است. بعد از عددهای بالای ۱۹ در رومانیایی قبل از اسم *de* می‌آید: *o sută de lei*.'
  ro.a1.unit29.lesson02.teach.a_plati_cu:
    title: پرداخت با کارت یا نقدی
    gloss: با کارت پرداخت کردن، نقدی پرداخت کردن
    note: '*A plăti cu cardul* یعنی با کارت پرداخت کردن و *a plăti în numerar* یعنی نقدی پرداخت کردن؛ *cu* یعنی «با» و *în* یعنی «در».'
    example_gloss:
    - می‌شود اینجا با کارت پرداخت کنم؟
    - نقدی پرداخت می‌کنم.
  ro.a1.unit29.lesson02.teach.pot_plati_cu:
    title: پرسیدن امکان پرداخت با کارت
    gloss: می‌شود اینجا با کارت پرداخت کنم؟
    note: '*Pot plăti* (می‌توانم پرداخت کنم) از *a putea* به‌علاوهٔ یک فعل ساخته می‌شود؛ *aici* (اینجا) سؤال را به همین مکان مربوط می‌کند.'
  ro.a1.unit29.lesson02.teach.doriti_sa_platiti:
    title: پرسیدن درباره روش پرداخت
    gloss: می‌خواهید نقدی پرداخت کنید یا با کارت؟
    note: '*Doriți să plătiți ...?* شکل رسمی *dumneavoastră* است که صندوقدار غریبه به کار می‌برد؛ با دوست می‌گویید *Vrei să plătești ...?*'
  ro.a1.unit29.lesson03.teach.nota:
    title: صورت‌حساب
    gloss: صورت‌حساب
    note: 'اسم مؤنث: *o notă*، *nota* (حرف تعریف به آخر کلمه می‌چسبد).'
    example_gloss: صورت‌حساب را تقسیم کنیم؟
  ro.a1.unit29.lesson03.teach.hai_sa_impartim:
    title: پیشنهاد تقسیم صورت‌حساب
    gloss: صورت‌حساب را تقسیم کنیم؟
    note: '*Hai să* + فعل پیشنهاد انجام کاری با هم است.'
  ro.a1.unit29.lesson03.teach.pot_plati_separat:
    title: درخواست پرداخت جداگانه
    gloss: می‌شود جداگانه پرداخت کنم؟
    note: '*Separat* (جداگانه) بعد از *a plăti* می‌آید؛ *Pot plăti separat?* درخواست رایجی است وقتی هر نفر سهم خودش را می‌پردازد.'
  ro.a1.unit29.lesson04.teach.restul:
    title: باقی‌مانده پول
    gloss: باقی‌مانده پول
    note: '*Restul* تحت‌اللفظی یعنی «باقی‌مانده»؛ رومانیایی پول خرد پس‌گرفته را این‌طور می‌نامد؛ حرف تعریف به آخر کلمه می‌چسبد.'
    example_gloss: بفرمایید، این هم باقی‌مانده پولتان.
  ro.a1.unit29.lesson04.teach.poftiti_restul:
    title: دادن باقی‌مانده پول
    gloss: بفرمایید، این هم باقی‌مانده پولتان.
    note: '*Poftiți* شکل رسمی *dumneavoastră* به معنی «بفرمایید» است و با لحن رسمی پشت پیشخوان جور است.'
  ro.a1.unit29.lesson04.teach.nu_am_nevoie:
    title: نپذیرفتن باقی‌مانده پول
    gloss: باقی‌مانده پول را لازم ندارم.
    note: '*A avea nevoie de* (نیاز داشتن) با *de* می‌آید: *Nu am nevoie de rest*.'
  ro.a1.unit29.lesson05.teach.treizeci_si_cinci:
    title: سی‌وپنج
    gloss: سی‌وپنج
    note: 'رومانیایی عددهای ۲۱ تا ۹۹ را با *și* می‌سازد: *treizeci și cinci* (تحت‌اللفظی «سی و پنج») و قبل از اسم *de* می‌آورد: *o sută treizeci și cinci de lei*.'
    example_gloss: صد و سی و پنج لِی می‌شود.
  ro.a1.unit29.lesson05.teach.nota_doua_feluri:
    title: خواندن صورت‌حساب رستوران
    gloss: 'صورت‌حساب: دو غذای اصلی و دو قهوه. جمع: صد و سی و پنج لِی. با کارت پرداخت شد.'
    note: به این توجه کنید که چه چیزی سفارش داده شده، مجموع چقدر است و چطور پرداخت شده است.
    glosses:
      Nota: صورت‌حساب
      două: دو
      feluri: غذاهای اصلی
      cafele: قهوه‌ها
      Total: مجموع
      '135': صد و سی و پنج
      lei: لِی
      Plătit: پرداخت‌شده
      cardul: کارت
  ro.a1.unit29.lesson06.teach.ana_hai_sa:
    title: آنا صورت‌حساب را می‌خواهد
    gloss: 'آنا: صورت‌حساب را بخواهیم؟'
    note: '*A cere* (خواستن) *nota* را مفعول مستقیم می‌گیرد؛ *Hai să cerem nota?* پیشنهاد خواستن آن با هم است.'
  ro.a1.unit29.lesson06.teach.mihai_da_buna:
    title: میهای قیمت کل را می‌پرسد
    gloss: 'میهای: آره، فکر خوبی است. روی هم چقدر می‌شود؟'
    note: همان سؤال *Cât costă în total?* درس اول دوباره آمده است.
  ro.a1.unit29.lesson06.teach.ana_sunt_treizeci:
    title: آنا مبلغ کل را می‌گوید
    gloss: 'آنا: صد و سی و پنج لِی است. تقسیمش کنیم؟'
    note: '*Împărțim* شکل *noi* (ما) از *a împărți* (تقسیم کردن) است؛ *nota* از متن مشخص است.'
  ro.a1.unit29.lesson06.teach.mihai_nu_lasa:
    title: میهای اصرار می‌کند که خودش بپردازد
    gloss: 'میهای: نه، بگذار امروز من حساب کنم. خیلی کمکم کردی.'
    note: '*Lasă-mă să* ... (بگذار من ...) روش رایج پیشنهاد انجام کاری است؛ *m-ai ajutat* («به من کمک کرده‌ای») شکلی گذشته است.'
  ro.a1.unit29.lesson06.teach.ana_ce_dragut:
    title: آنا تحت‌تأثیر قرار می‌گیرد
    gloss: 'آنا: چه لطف قشنگی! خیلی ممنون.'
    note: '*Ce drăguț din partea ta!* (چه لطفی از طرف تو) تعریف گرم و رایجی برای کار مهربانانه است.'
  ro.a1.unit29.lesson06.teach.mihai_pot_plati:
    title: میهای دربارهٔ پرداخت با کارت می‌پرسد
    gloss: 'میهای: می‌توانم اینجا با کارت پرداخت کنم؟'
    note: همان سؤال *Pot plăti cu cardul aici?* درس دوم است، این بار در خود رستوران.
  ro.a1.unit29.lesson06.teach.mihai_plateste_nota:
    title: 'Plătește: شکل او'
    gloss: میهای صورت‌حساب را پرداخت می‌کند.
    note: '*Plătește* شکل «او» از *a plăti* (پرداخت کردن) است.'
