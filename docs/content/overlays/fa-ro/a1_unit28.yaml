teaching:
  ro.a1.unit28.lesson01.teach.a_suna:
    title: زنگ زدن
    gloss: زنگ زدن
    note: مصدر فعلی که برای تماس تلفنی به کار می‌رود.
    example_gloss: باید بهت زنگ بزنم.
  ro.a1.unit28.lesson01.teach.te_sun:
    title: گفتن اینکه زنگ می‌زنید
    gloss: بهت زنگ می‌زنم.
    note: '*Sun* صورت *eu* فعل *a suna* («زنگ زدن») است؛ *te* («تو را») پیش از فعل می‌آید. رومانیایی برای کاری که قرار است به‌زودی انجام شود، زمان حال به کار می‌برد.'
  ro.a1.unit28.lesson01.teach.alo_sunt_ana:
    title: جواب دادن به تلفن
    gloss: الو، من Ana هستم.
    note: '*Alo* همان چیزی است که موقع جواب دادن به تلفن می‌گویید؛ *sunt* + نام می‌گوید شما کی هستید.'
  ro.a1.unit28.lesson01.teach.alo_sunt_mihai:
    title: Mihai هم همین‌طور جواب می‌دهد
    gloss: الو، من Mihai هستم.
    note: همان الگوی *Alo, sunt* + نام، مثل *Alo, sunt Ana*.
  ro.a1.unit28.lesson02.teach.cu_cine_vorbesc:
    title: پرسیدن اینکه چه کسی زنگ زده
    gloss: با کی صحبت می‌کنم؟
    note: '*Cu cine vorbesc?* (تحت‌اللفظی «با چه کسی صحبت می‌کنم؟») راه استاندارد پرسیدن هویت یک تماس‌گیرنده‌ی ناآشناست.'
  ro.a1.unit28.lesson02.teach.vorbiti_cu_ana:
    title: معرفی رسمی خود
    gloss: با Ana صحبت می‌کنید.
    note: '*Vorbiți cu* + نام پاسخ رسمی است: *vorbiți* صورت *dumneavoastră* فعل *a vorbi* («صحبت کردن») است.'
  ro.a1.unit28.lesson03.teach.poti_sa_repeti:
    title: خواستن تکرار
    gloss: می‌شه اون رو تکرار کنی؟
    note: '*Poți să* ... («می‌توانی ...؟») به‌علاوه‌ی *repeți* («تکرار کنی») و *asta* («این»).'
  ro.a1.unit28.lesson03.teach.nu_vorbi_atat:
    title: خواستن از کسی که آهسته‌تر حرف بزند
    gloss: لطفاً این‌قدر تند حرف نزن.
    note: '*Nu vorbi* («صحبت نکن») از *nu* + صورت *tu* ساخته می‌شود؛ *atât de repede* یعنی «این‌قدر تند».'
  ro.a1.unit28.lesson03.teach.nu_te_aud:
    title: گفتن اینکه خوب نمی‌شنوید
    gloss: صدات رو خوب نمی‌شنوم.
    note: '*Nu te aud bine*: *aud* یعنی «می‌شنوم»، *te* («تو را») پیش از فعل می‌آید و *bine* یعنی «خوب».'
  ro.a1.unit28.lesson04.teach.mesajul:
    title: پیامک
    gloss: پیامک
    note: '*Mesaj* در مفرد مذکر و در جمع مؤنث است (*un mesaj*, *două mesaje*)؛ حرف تعریف به آخر واژه می‌چسبد: *mesajul*.'
    example_gloss: پیامک از طرف Ana است.
  ro.a1.unit28.lesson04.teach.iti_trimit_un:
    title: گفتن اینکه پیامک می‌فرستید
    gloss: برایتان پیامک می‌فرستم.
    note: '*Îți* («به تو») ضمیر مفعولی غیرمستقیم است و پیش از فعل می‌آید: *Îți trimit un mesaj*.'
  ro.a1.unit28.lesson04.teach.te_sun_inapoi:
    title: گفتن اینکه بعداً زنگ می‌زنید
    gloss: بعداً بهت زنگ می‌زنم.
    note: '*Înapoi* («پس، برگشت») بعد از فعل می‌آید: *te sun înapoi* یعنی «دوباره بهت زنگ می‌زنم» و *mai târziu* یعنی «بعداً».'
  ro.a1.unit28.lesson05.teach.mihai_salut_ana:
    title: خواندن گفتگوی پیامکی
    gloss: 'Mihai: سلام Ana، می‌شود به من زنگ بزنی؟ باید چیزی بهت بگویم. Ana: آره، حتماً، پنج دقیقه‌ی دیگر بهت زنگ می‌زنم.'
    note: دقت کنید Mihai چه می‌خواهد، چرا می‌خواهد و Ana می‌گوید کی دوباره زنگ می‌زند.
    glosses:
      Salut: سلام
      poți: می‌تونی
      suna: زنگ زدن
      Trebuie: باید
      ceva: یه چیزی
      spun: گفتن
      sigur: حتماً
      sun: زنگ زدن
      cinci: پنج
      minute: دقیقه
      înapoi: پس دادن
  ro.a1.unit28.lesson06.teach.mihai_alo_sunt:
    title: Mihai تماس را جواب می‌دهد
    gloss: 'Mihai: الو، من Mihai هستم.'
    note: 'همان الگوی *Alo, sunt* + نام از درس اول، حالا در یک تماس واقعی: کسی که گوشی را برمی‌دارد اول حرف می‌زند و اسمش را می‌گوید.'
  ro.a1.unit28.lesson06.teach.ana_salut_mihai:
    title: Ana خودش را معرفی می‌کند
    gloss: 'Ana: سلام Mihai، من Ana هستم. Mihai: چه خوب که زنگ زدی!'
    note: '*Ce bine că* ... («چه خوب که ...») واکنش مثبت به یک اتفاق را نشان می‌دهد؛ *suni* صورت *tu* فعل *a suna* است.'
  ro.a1.unit28.lesson06.teach.ana_cum_a:
    title: Ana درباره‌ی شیفت می‌پرسد
    gloss: 'Ana: اولین شیفتت چطور بود؟'
    note: '*A fost* یعنی «بود» (گذشته‌ی *a fi*). این یک گذشته‌ی مرکب است و مثل *am mâncat* ساخته می‌شود؛ توضیح بعد از خط بعدی را ببینید.'
  ro.a1.unit28.lesson06.teach.mihai_a_mers:
    title: Mihai خبر خوب می‌دهد
    gloss: 'Mihai: خیلی خوب پیش رفت، بهتر از چیزی که فکر می‌کردم.'
    note: '*A mers* گذشته‌ی *a merge* («رفتن»، اینجا «پیش رفتن») است؛ *credeam* یعنی «فکر می‌کردم» (صورتی گذشته از *a crede*).'
  ro.a1.unit28.lesson06.teach.a_fost_a:
    title: 'شکل‌های گذشته: a fost, a mers, credeam'
    gloss: بود ← بودن، رفت ← رفتن، فکر می‌کردم ← فکر کردن
    note: '*A fost* و *a mers* شکل‌های گذشته‌ی مرکب (*a* + صفت مفعولی) هستند و *credeam* گذشته‌ی استمراری است. فعلاً فقط آن‌ها را به‌صورت عبارت‌های ثابت در همین موقعیت‌های درس حفظ کنید؛ قواعد کامل زمان گذشته در سطح بعدی می‌آید.'
  ro.a1.unit28.lesson06.teach.ana_ma_bucur:
    title: Ana افتخار می‌کند
    gloss: 'Ana: چه خوب که این را می‌شنوم! به تو افتخار می‌کنم.'
    note: '*Mândră de* («به ... افتخار می‌کنم») ترکیب ثابتی است؛ *de* لازم است. یک مرد می‌گوید *mândru*.'
  ro.a1.unit28.lesson06.teach.mihai_iti_multumesc:
    title: Mihai تحت تأثیر قرار می‌گیرد
    gloss: 'Mihai: ممنونم، برایم خیلی ارزش دارد.'
    note: '*Înseamnă* صورت سوم شخص مفرد *a însemna* («معنا داشتن») است؛ *pentru mine* («برای من») می‌گوید این برای چه کسی مهم است.'
  ro.a1.unit28.lesson06.teach.prima_lui_tura:
    title: مال او
    gloss: اولین شیفتش خیلی خوب گذشت.
    note: '*Lui* بعد از اسم یعنی «او (مرد)» به معنای تعلق: *prima lui tură*. (برای زن *ei* می‌شود.)'
