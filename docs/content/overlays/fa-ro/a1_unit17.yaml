teaching:
  ro.a1.unit17.lesson01.teach.reminder_este_la_mihai:
    title: 'یادآوری: este, la, Mihai'
    gloss: este (است) · la (در) · Mihai (اسم)
    note: Este از واحدهای ۳، ۴ و ۸ آمده است؛ la از عبارت *la ora nouă* (ساعت نه) در واحد ۴ آمده است؛ Mihai اسم شخصیت داستان است که از واحد ۱ معرفی شده -- این واحد هر سه را دوباره برای حرف زدن درباره‌ی شغل او به کار می‌برد.
  ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza:
    title: 'یادآوری: lucrez, lucrează'
    gloss: lucrez (من کار می‌کنم) · lucrează (او کار می‌کند)
    note: هر دو از برنامه‌ی روزانه‌ی واحد ۱۰ آمده‌اند (*Lucrez seara.*) -- این واحد آن‌ها را به‌جای زمان روز، برای گفتن شغل به کار می‌برد.
  ro.a1.unit17.lesson01.teach.inginer_vocab:
    title: مهندس
    gloss: مهندس
    note: مذکر -- در این واحد فقط Mihai آن را به کار می‌برد (*Sunt inginer*)، پس هنوز به شکل مؤنث نیازی نیست.
    example_gloss:
    - Mihai مهندس است.
  ro.a1.unit17.lesson01.teach.birou_vocab:
    title: دفتر
    gloss: دفتر کار
    note: جایی که Mihai کار می‌کند؛ با حرف اضافه‌ی *la* (در) که پیش‌تر در واحد ۴ دیدید.
    example_gloss:
    - او در دفتر کار می‌کند.
  ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase:
    title: Mihai مهندس است. او در دفتر کار می‌کند.
    gloss: Mihai مهندس است. او در دفتر کار می‌کند.
    note: همه‌ی واژه‌های اینجا قبلاً یاد گرفته شده‌اند یا همین حالا معرفی شدند و در دو جمله‌ی تازه درباره‌ی شغل Mihai کنار هم آمده‌اند.
  ro.a1.unit17.lesson02.teach.reminder_sunt_unde_ana:
    title: 'یادآوری: sunt, unde, Ana'
    gloss: sunt (هستم) · unde (کجا) · Ana (اسم)
    note: Sunt از واحد ۱۶ آمده است (*Sunt bolnav*)؛ unde از واحدهای ۷ و ۸ آمده است (*Unde pot să cumpăr...?*، *Unde este...?*)؛ Ana اسم شخصیت داستان است که از واحد ۱ معرفی شده -- این واحد هر سه را دوباره برای حرف زدن درباره‌ی شغل او به کار می‌برد.
  ro.a1.unit17.lesson02.teach.profesoara_vocab:
    title: معلم
    gloss: معلم (مؤنث)
    note: مؤنث -- در این واحد فقط Ana آن را به کار می‌برد (*Sunt profesoară*)، پس هنوز به شکل مذکر نیازی نیست.
    example_gloss:
    - من معلم هستم.
  ro.a1.unit17.lesson02.teach.scoala_vocab:
    title: مدرسه
    gloss: مدرسه
    note: جایی که Ana کار می‌کند؛ *la* همان‌طور که در *la birou* آمد، اینجا هم به کار می‌رود.
    example_gloss:
    - من در مدرسه کار می‌کنم.
  ro.a1.unit17.lesson02.teach.sunt_profesoara_lucrez_la_scoala_phrase:
    title: من معلم هستم. من در مدرسه کار می‌کنم.
    gloss: من معلم هستم. من در مدرسه کار می‌کنم.
    note: حرف خود Ana درباره‌ی شغلش؛ دو واژه‌ی تازه‌ی این درس با *sunt* که در واحد ۱۶ یاد گرفتید ترکیب شده است.
  ro.a1.unit17.lesson02.teach.unde_lucrati_phrase:
    title: کجا کار می‌کنید؟
    gloss: شما کجا کار می‌کنید؟ (رسمی)
    note: '*Lucrați* شکل رسمی «شما کار می‌کنید» است و همان پایان -ați/-eți را دارد که در *aveți* و *faceți* دیدید -- برای پرسیدن شغل هر کسی به کار می‌آید.'
  ro.a1.unit17.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'یادآوری: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (سلام) · Ce mai faceți? (حال شما چطور است؟ رسمی) · Bine, mulțumesc (خوبم، ممنون)
    note: همه از سلام و احوال‌پرسی واحد ۱ آمده‌اند و اینجا برای شروع گفت‌وگوی همین واحد دوباره به کار رفته‌اند.
  ro.a1.unit17.lesson03.teach.reminder_si_dumneavoastra_la_revedere:
    title: 'یادآوری: Și dumneavoastră?, La revedere'
    gloss: Și dumneavoastră? (و شما؟ رسمی) · La revedere (خداحافظ)
    note: هر دو از واحد ۱ آمده‌اند و اینجا به‌عنوان پرسش طبیعیِ بعدی و جمله‌ی پایانی به کار رفته‌اند.
  ro.a1.unit17.lesson03.teach.line01:
    title: سلام کردن و احوال‌پرسی
    gloss: Ana به Mihai سلام می‌کند و حالش را می‌پرسد.
    note: همان *Ce mai faceți?* واحد ۱ دوباره به کار رفته است.
  ro.a1.unit17.lesson03.teach.line02:
    title: جواب دادن و پرسیدن محل کار
    gloss: Mihai جواب می‌دهد و بعد از Ana می‌پرسد کجا کار می‌کند.
    note: '*Bine, mulțumesc* واحد ۱ با *Unde lucrați?* همین واحد ترکیب شده است.'
  ro.a1.unit17.lesson03.teach.line03:
    title: گفتن شغل و محل کار و پرسیدن همان سؤال
    gloss: Ana می‌گوید در مدرسه کار می‌کند و معلم است، بعد همین سؤال را از Mihai می‌پرسد.
    note: عبارت درس دوم همین واحد با *Și dumneavoastră?* واحد ۱ ترکیب شده است.
  ro.a1.unit17.lesson03.teach.line04:
    title: گفتن شغل و محل کار
    gloss: Mihai می‌گوید در دفتر کار می‌کند و مهندس است.
    note: عبارت درس اول همین واحد تقریباً بدون تغییر دوباره به کار رفته است.
  ro.a1.unit17.lesson03.teach.line05:
    title: تمام کردن گفت‌وگو
    gloss: Ana خداحافظی می‌کند.
    note: همان الگوی پایانی که گفت‌وگوهای همه‌ی واحدهای قبلی هم با آن تمام شد.
  ro.a1.unit17.lesson03.teach.line06:
    title: خداحافظی کردن
    gloss: Mihai خداحافظی می‌کند.
    note: همان الگوی پایانی که گفت‌وگوهای همه‌ی واحدهای قبلی هم با آن تمام شد.
