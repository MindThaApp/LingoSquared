teaching:
  ro.a1.unit08.lesson01.teach.reminder_unde_este:
    title: 'یادآوری: unde، este'
    gloss: unde (کجا) · este (است)
    note: هر دو قبلاً آمده‌اند؛ *unde* در *Unde pot să cumpăr ...?* در درس ۷ و *este* از درس ۳ و ۴. اینجا این دو کنار هم می‌آیند و سؤال اصلی دربارهٔ مکان را می‌سازند.
  ro.a1.unit08.lesson01.teach.unde_este_phrase:
    title: '...کجاست؟'
    gloss: Unde este...? (... کجاست؟)
    note: 'روش همیشگی پرسیدن اینکه چیزی کجاست: اسم مکان را بعد از *este* بگذارید، یا وقتی از موقعیت معلوم است، همین‌طور تنها بگویید.'
  ro.a1.unit08.lesson01.teach.gara_magazin_banca:
    title: ایستگاه قطار، مغازه، بانک
    gloss: gară (ایستگاه قطار) · magazin (مغازه) · bancă (بانک)
    note: 'سه مکان رایج؛ وقتی دربارهٔ یک جای مشخص و معلوم حرف می‌زنیم، هر سه حرف تعریف می‌گیرند: *gara*، *magazinul*، *banca*.'
    example_gloss:
    - ایستگاه قطار کجاست؟
    - مغازه نزدیکه.
    - بانک دوره.
  ro.a1.unit08.lesson01.teach.aproape_departe:
    title: نزدیک، دور
    gloss: aproape (نزدیک) · departe (دور)
    note: راهی ساده برای گفتن اینکه جایی چقدر نزدیک یا دور است، بدون نشانی دقیق.
    example_gloss:
    - مغازه نزدیکه.
    - بانک دوره.
  ro.a1.unit08.lesson01.teach.magazinul_aproape:
    title: مغازه نزدیک است
    gloss: Magazinul este aproape. (مغازه نزدیکه.)
    note: جمله‌ای کوتاه و کامل؛ وقتی معلوم است کدام مکان منظور است، بعد از *aproape* لازم نیست اسم مکان بیاید.
  ro.a1.unit08.lesson01.teach.banca_departe:
    title: بانک دور است
    gloss: Banca este departe. (بانک دوره.)
    note: متضاد *aproape*؛ با همان الگوی ساده.
  ro.a1.unit08.lesson01.teach.unde_este_gara:
    title: ایستگاه قطار کجاست؟
    gloss: Unde este gara? (ایستگاه قطار کجاست؟)
    note: '*Unde este...?* و *gara* را در یک سؤال کامل کنار هم می‌گذارد.'
  ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie:
    title: بیمارستان، پست‌خونه، کتابخونه، ایستگاه اتوبوس
    gloss: spital (بیمارستان) · poștă (پست‌خونه) · bibliotecă (کتابخونه) · stație de autobuz (ایستگاه اتوبوس)
    note: 'چهار مکان رایج دیگر؛ مثل gară/magazin/bancă، برای یک جای مشخص حرف تعریف می‌گیرند: *spitalul*، *poșta*، *biblioteca*، *stația de autobuz*.'
    example_gloss:
    - بیمارستان روبه‌روی مغازه‌ست.
    - پست‌خونه بین مغازه و بیمارستانه.
    - کتابخونه نزدیک ایستگاه قطاره.
    - ایستگاه اتوبوس کنار کتابخونه‌ست.
  ro.a1.unit08.lesson02.teach.langa_vizavi_intre:
    title: کنار، روبه‌رو، بین
    gloss: lângă (کنار) · vizavi de (روبه‌روی) · între (بین)
    note: سه راه برای مشخص کردن مکان یک جا نسبت به جای دیگر. *vizavi de* و *între* برای وصل شدن به مکان دوم به *de* یا *și* نیاز دارند، ولی *lângă* مستقیم وصل می‌شود.
    example_gloss:
    - مغازه کنار ایستگاه قطاره.
    - بیمارستان روبه‌روی مغازه‌ست.
    - پست‌خونه بین مغازه و بیمارستانه.
  ro.a1.unit08.lesson02.teach.magazinul_langa_gara:
    title: مغازه کنار ایستگاه قطار است
    gloss: Magazinul este lângă gară. (مغازه کنار ایستگاه قطاره.)
    note: '*Lângă* مستقیم به اسم مکان وصل می‌شود و به کلمهٔ اضافه‌ای نیاز نیست.'
  ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin:
    title: بیمارستان روبه‌روی مغازه است
    gloss: Spitalul este vizavi de magazin. (بیمارستان روبه‌روی مغازه‌ست.)
    note: '*Vizavi de* قبل از مکان دوم به *de* نیاز دارد.'
  ro.a1.unit08.lesson02.teach.posta_intre:
    title: پست‌خونه بین مغازه و بیمارستان است
    gloss: Poșta este între magazin și spital. (پست‌خونه بین مغازه و بیمارستانه.)
    note: '*Între* دو مکان را می‌گیرد که با *și* (و) به هم وصل می‌شوند.'
  ro.a1.unit08.lesson02.teach.statia_langa_biblioteca:
    title: ایستگاه اتوبوس کنار کتابخونه است
    gloss: Stația de autobuz este lângă bibliotecă. (ایستگاه اتوبوس کنار کتابخونه‌ست.)
    note: همان الگوی *lângă* مثل مغازه و ایستگاه قطار، این بار با ایستگاه اتوبوس و کتابخونه.
  ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'یادآوری: bună، mulțumesc، la revedere، da، Ana، Mihai'
    gloss: bună (سلام) · mulțumesc (ممنون) · la revedere (خداحافظ) · da (بله) · Ana, Mihai (اسم‌ها)
    note: همه در درس‌های قبل آمده‌اند؛ اینجا آنا و میهای دوباره همدیگر را می‌بینند، این بار در محله.
  ro.a1.unit08.lesson03.teach.line01:
    title: سلام و پرسیدن جای پست‌خونه
    gloss: آنا به میهای سلام می‌کند و می‌پرسد پست‌خونه کجاست.
    note: '*Unde este* همین درس را با سلام درس ۱ ترکیب می‌کند.'
  ro.a1.unit08.lesson03.teach.line02:
    title: گفتن مکان
    gloss: میهای می‌گوید پست‌خونه بین مغازه و بیمارستانه.
    note: ساختار *poșta* و *între ... și* همین درس دوباره به کار رفته است.
  ro.a1.unit08.lesson03.teach.line03:
    title: پرسیدن دربارهٔ کتابخونه
    gloss: آنا می‌پرسد کتابخونه نزدیکه یا نه.
    note: یک سؤال کوتاه بعدی که *este* و *aproape* را دوباره به کار می‌برد.
  ro.a1.unit08.lesson03.teach.line04:
    title: تأیید و اضافه کردن توضیح
    gloss: میهای تأیید می‌کند که کتابخونه نزدیک ایستگاه قطاره و اضافه می‌کند که ایستگاه اتوبوس کنار کتابخونه‌ست.
    note: '*aproape de* و *lângă*، دو حرف اضافهٔ همین درس، در یک جمله کنار هم آمده‌اند.'
  ro.a1.unit08.lesson03.teach.line05:
    title: تشکر و پایان گفت‌وگو
    gloss: آنا از میهای تشکر می‌کند و خداحافظی می‌کند.
    note: '*Mulțumesc* اینجا یک تشکر ساده برای پایان گفت‌وگوست، همان کلمهٔ *Bine, mulțumesc.* در درس ۱.'
  ro.a1.unit08.lesson03.teach.line06:
    title: پایان دیدار
    gloss: میهای هم خداحافظی می‌کند و اسم آنا را می‌آورد.
    note: همان شکل دوستانهٔ پایان که گفت‌وگوهای درس ۱، ۵، ۶ و ۷ هم با آن تمام می‌شدند.
