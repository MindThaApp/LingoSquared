teaching:
  ro.a1.unit13.lesson01.teach.reminder_cafea_ceai_paine:
    title: 'مرور: cafea، ceai، pâine'
    gloss: cafea (قهوه) · ceai (چای) · pâine (نان)
    note: همه‌ی این‌ها در واحد ۶ آمده بودند؛ اینجا با دستور تازه‌ی همین واحد برای دوست داشتن و دوست نداشتن ترکیب می‌شوند.
  ro.a1.unit13.lesson01.teach.imi_place_vocab:
    title: دوست دارم
    gloss: Îmi place (دوست دارم)
    note: تحت‌اللفظی یعنی «به من خوش می‌آید» -- *îmi* (به من) به‌اضافه‌ی *place* (خوش می‌آید) که تغییر نمی‌کند. برای گفتن اینکه چیزی را به‌طور کلی دوست دارید، رومانیایی شکل معرفه‌ی اسم را می‌آورد (*cafeaua*، نه *cafea* که در واحد ۶ یاد گرفتید).
    example_gloss:
    - قهوه دوست دارم.
  ro.a1.unit13.lesson01.teach.imi_place_cafeaua_phrase:
    title: قهوه دوست دارم
    gloss: Îmi place cafeaua. (قهوه دوست دارم.)
    note: 'الگوی کامل: Îmi place + اسم معرفه.'
  ro.a1.unit13.lesson01.teach.imi_place_ceaiul_phrase:
    title: چای دوست دارم
    gloss: Îmi place ceaiul. (چای دوست دارم.)
    note: همان الگوی *Îmi place cafeaua* با نوشیدنی دیگر -- *ceaiul* شکل معرفه‌ی *ceai* است که در واحد ۶ یاد گرفته‌اید.
  ro.a1.unit13.lesson01.teach.numi_place_vocab:
    title: دوست ندارم
    gloss: Nu-mi place (دوست ندارم)
    note: شکل منفی *Îmi place* -- رومانیایی در گفتار روزمره *nu îmi* را به *nu-mi* کوتاه می‌کند، پس این شکل با خط تیره راه طبیعی گفتن است، نه فقط یک میان‌بر.
    example_gloss:
    - نان دوست ندارم.
  ro.a1.unit13.lesson01.teach.numi_place_painea_phrase:
    title: نان دوست ندارم
    gloss: Nu-mi place pâinea. (نان دوست ندارم.)
    note: '*Pâinea* شکل معرفه‌ی *pâine* است که در واحد ۶ یاد گرفته‌اید، با همان الگوی *cafeaua* و *ceaiul*.'
  ro.a1.unit13.lesson02.teach.reminder_imi_place_numi_place:
    title: 'مرور: Îmi place، Nu-mi place'
    gloss: Îmi place (دوست دارم) · Nu-mi place (دوست ندارم)
    note: هر دو از درس اول همین واحدند؛ اینجا شکل پرسشی‌شان هم اضافه می‌شود.
  ro.a1.unit13.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'مرور: cafeaua، ceaiul، pâinea'
    gloss: cafeaua (آن قهوه) · ceaiul (آن چای) · pâinea (آن نان)
    note: همه از درس اول همین واحدند؛ اینجا در شکل پرسشی و ترجیح دوباره می‌آیند.
  ro.a1.unit13.lesson02.teach.va_place_vocab:
    title: دوست داری...؟
    gloss: Vă place...? (دوست دارید...؟)
    note: شکل پرسشی رسمی *Îmi place* -- *vă* (به شما، رسمی) جای *îmi* (به من) را می‌گیرد، با همان لحن رسمی *dumneavoastră* که قبلاً در *aveți*/*faceți* دیده‌اید. بعدش یک اسم معرفه بیاورید، یا وقتی موضوع روشن است تنها به کار ببرید.
    example_gloss:
    - قهوه دوست دارید؟
  ro.a1.unit13.lesson02.teach.va_place_cafeaua_phrase:
    title: قهوه دوست دارید؟
    gloss: Vă place cafeaua? (قهوه دوست دارید؟)
    note: 'الگوی کامل: Vă place + اسم معرفه، با آهنگ پرسشی.'
  ro.a1.unit13.lesson02.teach.prefer_vocab:
    title: ترجیح می‌دهم
    gloss: Prefer (ترجیح می‌دهم)
    note: 'ساختار «به من» لازم نیست؛ *prefer* یک فعل معمولی است: *Prefer* + چیزی که ترجیح می‌دهید، به شکل معرفه، مثل *Îmi place*. در فارسی هم فعل «ترجیح دادن» همین‌طور ساده به کار می‌رود.'
    example_gloss:
    - قهوه را ترجیح می‌دهم.
  ro.a1.unit13.lesson02.teach.prefer_cafeaua_phrase:
    title: قهوه را ترجیح می‌دهم
    gloss: Prefer cafeaua. (قهوه را ترجیح می‌دهم.)
    note: از *Îmi place cafeaua* قوی‌تر است -- وقتی بین دو چیز انتخاب می‌کنید به کار می‌آید.
  ro.a1.unit13.lesson02.teach.sau_vocab:
    title: یا
    gloss: Sau (یا)
    note: دو گزینه را به هم وصل می‌کند، وقتی چیزی پیشنهاد می‌دهید یا درباره‌ی انتخاب می‌پرسید. با *și* (و) در درس‌های واحد ۱۰ و ۱۲ فرق دارد، چون și دو چیزی را به هم وصل می‌کند که هر دو با هم درست‌اند.
    example_gloss:
    - قهوه یا چای؟
  ro.a1.unit13.lesson02.teach.cafea_sau_ceai_phrase:
    title: قهوه یا چای؟
    gloss: Cafea sau ceai? (قهوه یا چای؟)
    note: راهی کوتاه و طبیعی برای پیشنهاد دادن یک انتخاب. اینجا شکل نکره‌ی ساده (*cafea*، *ceai*) به کار رفته، نه شکل معرفه‌ی *cafeaua*/*ceaiul*، چون این یک پیشنهاد باز است، نه حرفی درباره‌ی قهوه یا چای به‌طور کلی.
  ro.a1.unit13.lesson03.teach.reminder_va_place_prefer_sau:
    title: 'یادآوری: Vă place، Prefer، Sau'
    gloss: Vă place? (دوست دارید؟) · Prefer (ترجیح می‌دهم) · Sau (یا)
    note: همه از درس دوم همین واحد هستند؛ اینجا آنا و میهای آن‌ها را با هم به کار می‌برند.
  ro.a1.unit13.lesson03.teach.reminder_imi_place_numi_place_cafeaua_ceaiul_painea:
    title: 'یادآوری: Îmi place، Nu-mi place، cafeaua، ceaiul، pâinea'
    gloss: Îmi place (دوست دارم) · Nu-mi place (دوست ندارم) · cafeaua (قهوه) · ceaiul (چای) · pâinea (نان)
    note: همه از درس اول همین واحد هستند؛ اینجا آنا و میها هرکدام می‌گویند چه چیزی را دوست دارند و چه چیزی را دوست ندارند.
  ro.a1.unit13.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'یادآوری: bună، mulțumesc، la revedere، Ana، Mihai'
    gloss: bună (سلام) · mulțumesc (ممنون) · la revedere (خداحافظ) · Ana, Mihai (اسم‌ها)
    note: همه در واحدهای قبلی آمده‌اند؛ همان الگوی دوستانه‌ی شروع و پایان که در همه‌ی گفت‌وگوهای این دوره بوده است.
  ro.a1.unit13.lesson03.teach.line01:
    title: سلام و پرسیدن درباره‌ی قهوه یا چای
    gloss: میهای به آنا سلام می‌کند و می‌پرسد قهوه دوست دارد یا چای.
    note: '*Vă place...?* همین واحد را با *sau* ترکیب می‌کند تا هر دو گزینه در یک سؤال بیایند.'
  ro.a1.unit13.lesson03.teach.line02:
    title: گفتن چیزی که ترجیح می‌دهید و چیزی که دوست ندارید
    gloss: آنا می‌گوید قهوه را ترجیح می‌دهد و چای را دوست ندارد.
    note: '*Prefer* را با *Nu-mi place* ترکیب می‌کند؛ ترجیح آنا برای قهوه با انتخاب همیشگی خودش در واحدهای ۶ و ۱۲ یکی است.'
  ro.a1.unit13.lesson03.teach.line03:
    title: گفتن ترجیح مخالف
    gloss: میهای می‌گوید چای را دوست دارد و قهوه را دوست ندارد.
    note: با انتخاب همیشگی میهای در واحدهای ۶ و ۱۲ یکی است (ceai، هرگز cafea).
  ro.a1.unit13.lesson03.teach.line04:
    title: پرسیدن درباره‌ی نان هم
    gloss: آنا می‌پرسد میهای نان هم دوست دارد یا نه.
    note: با جمله‌ی کوتاه پیگیری *Și pâinea?* (نان چطور؟) شروع می‌شود و بعد با *Vă place...?* درباره‌ی موضوعی تازه، یعنی *pâinea*، کامل می‌پرسد.
  ro.a1.unit13.lesson03.teach.line05:
    title: تأیید کردن، تشکر و خداحافظی
    gloss: میهای می‌گوید بله، نان دوست دارد، از آنا تشکر می‌کند و خداحافظی می‌کند.
    note: با انتخاب همیشگی میهای در واحد ۶ (pâine) یکی است؛ همان الگوی پایانی که گفت‌وگوی همه‌ی واحدهای قبلی با آن تمام شده است.
  ro.a1.unit13.lesson03.teach.line06:
    title: تمام کردن گفت‌وگو
    gloss: آنا هم خداحافظی می‌کند و اسم میهای را می‌آورد.
    note: همان الگوی دوستانه‌ی پایانی که گفت‌وگوی همه‌ی واحدهای قبلی با آن تمام شده است.
