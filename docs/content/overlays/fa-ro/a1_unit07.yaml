  ro.a1.unit07.lesson03.la_piata:
    title: در بازار
teaching:
  ro.a1.unit07.lesson01.teach.reminder_un_numere:
    title: 'یادآوری: un، doi، cinci، zece، douăzeci'
    gloss: un (یک) · doi (دو) · cinci (پنج) · zece (ده) · douăzeci (بیست)
    note: همه‌ی این‌ها قبلاً در درس‌های پیشین آمده‌اند (*un* در واحد ۴ و عددها در واحد ۲) -- اینجا برای صحبت درباره‌ی قیمت برمی‌گردند.
  ro.a1.unit07.lesson01.teach.cat_costa:
    title: قیمتش چقدره؟
    gloss: Cât costă? (قیمتش چقدر است؟)
    note: روش رایج پرسیدن قیمت در رومانیایی -- اسم کالا را بعدش بیاورید، یا وقتی کالا از موقعیت معلوم است، همین‌طور تنها بگویید.
  ro.a1.unit07.lesson01.teach.leu:
    title: Leu (واحد پول)
    gloss: 'leu (واحد پول رومانی -- جمع: lei)'
    note: واحد پول رومانی. Leu مفرد است (یک لِو)؛ جمع آن یعنی lei بی‌قاعده است و فقط با افزودن یک پسوند معمولی ساخته نمی‌شود.
    example_gloss: یک لِو قیمتش است.
  ro.a1.unit07.lesson01.teach.costa_cinci_lei:
    title: هشت لِی قیمتش است
    gloss: Costă opt lei. (هشت لِی می‌شود.)
    note: با عددهای ۲ تا ۱۹، lei همان‌طور ساده می‌ماند -- لازم نیست واژه‌ی اضافه‌ای قبلش بیاید.
  ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei:
    title: سی لِی قیمتش است
    gloss: Costă treizeci de lei. (سی لِی می‌شود.)
    note: از ۲۰ به بالا، رومانیایی قبل از اسم شمارش‌شده *de* می‌گذارد -- همان قاعده‌ای که واحد ۲ برای *ani* (سال) یاد داد، حالا برای *lei*.
  ro.a1.unit07.lesson01.teach.leu_lei_de_rule:
    title: 'قاعده: leu ← lei و اینکه de کی اضافه می‌شود'
    gloss: 'leu ← lei · عددهای ۲ تا ۱۹: بدون *de* · عددهای ۲۰ به بالا: با *de*'
    note: دقیقاً همان الگوی قاعده‌ی *ani* در واحد ۲ (câți ani ai / am treizeci de ani) -- وقتی آن را برای یک اسم بلد باشید، برای lei هم همین‌طور کار می‌کند.
  ro.a1.unit07.lesson01.teach.scump:
    title: گران
    gloss: scump (گران)
    note: واکنش رایج وقتی قیمتی به نظرتان زیادی بالاست.
    example_gloss: هشت لِی؟ گران است!
  ro.a1.unit07.lesson01.teach.ieftin:
    title: ارزان
    gloss: ieftin (ارزان)
    note: متضاد scump -- یک قیمت خوب.
    example_gloss: یک لِو؟ ارزان است!
  ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog:
    title: 'یادآوری: un، o، și، aș dori، vă rog، te rog'
    gloss: un/o (یک) · și (و) · aș dori (می‌خواستم) · vă rog (لطفاً، رسمی) · te rog (لطفاً، دوستانه)
    note: '*Aș dori*، *vă rog* و *te rog* اول بار در صحنه‌ی کافه‌ی واحد ۶ آمدند -- اینجا در بازار برمی‌گردند.'
  ro.a1.unit07.lesson02.teach.piata:
    title: بازار
    gloss: piață (بازار)
    note: اسمی مؤنث -- بازار روباز یا سرپوشیده که مواد غذایی تازه در آن خرید می‌شود.
    example_gloss: در بازار قیمتش چقدر است؟
  ro.a1.unit07.lesson02.teach.rosii:
    title: گوجه‌فرنگی
    gloss: roșii (گوجه‌فرنگی‌ها)
    note: جمع roșie (یک گوجه‌فرنگی) -- وقتی کلی درباره‌ی خریدشان حرف می‌زنید، به صورت جمع می‌گویید.
    example_gloss: گوجه‌فرنگی می‌خواهم.
  ro.a1.unit07.lesson02.teach.cartofi:
    title: سیب‌زمینی
    gloss: cartofi (سیب‌زمینی‌ها)
    note: جمع cartof (یک سیب‌زمینی)، با همان الگوی roșii.
    example_gloss: سیب‌زمینی می‌خواستم.
  ro.a1.unit07.lesson02.teach.kilogram:
    title: Kilogram
    gloss: kilogram (کیلوگرم)
    note: 'واحد معمول برای خرید میوه و سبزی به وزن. *De* آن را به چیزی که خریده می‌شود وصل می‌کند: *kilogram de roșii*، «یک کیلو گوجه‌فرنگی».'
    example_gloss: یک کیلو گوجه‌فرنگی.
  ro.a1.unit07.lesson02.teach.vreau:
    title: می‌خواهم
    gloss: vreau (می‌خواهم)
    note: ساده‌تر و مستقیم‌تر از *aș dori* («می‌خواستم») -- در بازار هر دو درست است، فقط vreau کمتر رسمی است.
    example_gloss: سیب‌زمینی می‌خواهم.
  ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar:
    title: کجا می‌توانم ... بخرم؟
    gloss: Unde pot să cumpăr roșii? (کجا می‌توانم گوجه‌فرنگی بخرم؟)
    note: سؤال مفیدی وقتی نمی‌دانید از کجا خرید کنید -- به‌جای roșii هر چیز دیگری که دنبالش هستید بگذارید.
  ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii:
    title: یک کیلو گوجه‌فرنگی چند است؟
    gloss: Cât costă un kilogram de roșii? (یک کیلو گوجه‌فرنگی چند است؟)
    note: Cât costă و ساختار kilogram de ... را در یک سؤال کامل کنار هم می‌گذارد.
  ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi:
    title: یک کیلو سیب‌زمینی می‌خواهم
    gloss: Vreau un kilogram de cartofi. (یک کیلو سیب‌زمینی می‌خواهم.)
    note: همان ساختار kilogram de ... این بار به‌صورت جمله‌ی خبری با vreau، نه پرسشی.
  ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere:
    title: 'یادآوری: bună، ziua، mulțumesc، bine، la revedere، Ana، Mihai'
    gloss: bună ziua (روز بخیر / سلام) · mulțumesc (ممنون) · bine (خوب) · la revedere (خداحافظ) · Ana، Mihai (نام‌ها)
    note: همه‌ی این‌ها قبلاً در گفت‌وگوهای واحد ۱ و ۶ آمده‌اند -- اینجا آنا و میهای دوباره همدیگر را می‌بینند، این بار در بازار.
  ro.a1.unit07.lesson03.teach.line01:
    title: سلام و پرسیدن قیمت
    gloss: آنا به میهای سلام می‌کند و قیمت یک کیلو گوجه‌فرنگی را می‌پرسد.
    note: Cât costă همین واحد را با سلام واحد ۱ ترکیب می‌کند.
  ro.a1.unit07.lesson03.teach.line02:
    title: گفتن قیمت
    gloss: میهای می‌گوید هشت لِی است و واکنش نشان می‌دهد که ارزان است.
    note: costă، opt lei و ieftin همین واحد دوباره به کار می‌روند.
  ro.a1.unit07.lesson03.teach.line03:
    title: سفارش مؤدبانه و اضافه کردن یک چیز دیگر
    gloss: آنا موافقت می‌کند، مؤدبانه یک کیلو گوجه‌فرنگی می‌خواهد و اضافه می‌کند که سیب‌زمینی هم می‌خواهد.
    note: aș dori، vă rog و vreau را ترکیب می‌کند -- هر دو سطح رسمیت از واژگان همین واحد در یک جمله.
  ro.a1.unit07.lesson03.teach.line04:
    title: گفتن قیمت دوم
    gloss: میهای می‌گوید یک کیلو سیب‌زمینی پنج لِی است.
    note: عدد zece (ده) از واحد ۲ دوباره به کار می‌رود که در درس اول همین واحد یادآوری شد.
  ro.a1.unit07.lesson03.teach.line05:
    title: تشکر و پایان دادن
    gloss: آنا از میهای تشکر می‌کند و خداحافظی می‌کند.
    note: '*Mulțumesc* اینجا یک تشکر ساده‌ی پایانی است، همان واژه‌ی *Bine, mulțumesc.* در واحد ۱.'
  ro.a1.unit07.lesson03.teach.line06:
    title: پایان دادن به دیدار
    gloss: میهای با گفتن نام آنا خداحافظی را جواب می‌دهد.
    note: همان الگوی دوستانه‌ی پایان که گفت‌وگوهای واحدهای ۱، ۵ و ۶ هم با آن تمام شدند.
