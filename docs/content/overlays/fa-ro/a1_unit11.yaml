teaching:
  ro.a1.unit11.lesson01.teach.reminder_da_bine:
    title: 'یادآوری: da, bine, nu, mulțumesc'
    gloss: da (بله) · bine (خوب / باشه) · nu (نه) · mulțumesc (ممنون)
    note: همه‌ی این‌ها از درس ششم یاد گرفته شده‌اند؛ اینجا کنار هم می‌آیند تا راه قبول کردن قرار در این درس را بسازند و در تمرین جورکردن واژگان هم به کار می‌روند.
  ro.a1.unit11.lesson01.teach.mergem_vocab:
    title: برویم / می‌رویم
    gloss: Mergem (برویم / می‌رویم)
    note: اول‌شخص جمع فعل *a merge*؛ قبلاً *merg* (می‌روم، درس ۱۰) و *mergeți* (صورت امری رسمی، درس ۹) را دیده‌اید ــ همان فعل با شخص و شمار دیگر. وقتی تنها و با لحن پرسشی گفته شود، راهی طبیعی برای پیشنهاد کار مشترک است.
    example_gloss:
    - برویم سینما؟
  ro.a1.unit11.lesson01.teach.cinema_vocab:
    title: سینما
    gloss: Cinema (سینما)
    note: این کلمه شبیه «سینما» در فارسی است و به‌راحتی شناخته می‌شود.
    example_gloss:
    - برویم سینما؟
  ro.a1.unit11.lesson01.teach.mergem_cinema_phrase:
    title: برویم سینما؟
    gloss: Mergem la cinema? (برویم سینما؟)
    note: یک دعوت کامل ــ لازم نیست «می‌خواهید» بیاید؛ همین علامت سؤال «می‌رویم» را به پیشنهاد تبدیل می‌کند.
  ro.a1.unit11.lesson01.teach.parc_vocab:
    title: پارک
    gloss: Parc (پارک)
    note: این هم کلمه‌ای شبیه فارسی است، مثل *cinema*.
    example_gloss:
    - برویم پارک؟
  ro.a1.unit11.lesson01.teach.mergem_parc_phrase:
    title: بریم پارک؟
    gloss: Mergem la parc? (برویم پارک؟)
    note: همان الگوی دعوت *Mergem la cinema?* با مکانی دیگر.
  ro.a1.unit11.lesson01.teach.da_bine_phrase:
    title: بله، باشه!
    gloss: Da, bine! (بله، باشه!)
    note: راهی کوتاه و طبیعی برای قبول کردن قرار ــ کلمه‌هایی که می‌دانید در ترکیبی تازه.
  ro.a1.unit11.lesson02.teach.reminder_nu_pot:
    title: 'یادآوری: nu, pot'
    gloss: nu (نه / نـ) · pot (می‌توانم)
    note: 'Nu را از درس ششم می‌دانید و pot را از *cum pot să ajung* (چطور می‌توانم برسم) در درس ۹. وقتی *nu* قبل از فعل بیاید آن را منفی می‌کند: *nu pot* یعنی «نمی‌توانم» ــ راه رد کردن قرار در این درس.'
  ro.a1.unit11.lesson02.teach.reminder_sambata_duminica:
    title: 'یادآوری: sâmbătă, duminică'
    gloss: sâmbătă (شنبه) · duminică (یکشنبه)
    note: هر دو را قبلاً در روزهای هفته‌ی درس ۳ یاد گرفته‌اید.
  ro.a1.unit11.lesson02.teach.mergem_parc_sambata_phrase:
    title: شنبه برویم پارک؟
    gloss: Mergem la parc sâmbătă? (شنبه برویم پارک؟)
    note: همان دعوت درس قبل، حالا با یک روز ــ *Mergem la parc?* همراه با نام روز.
  ro.a1.unit11.lesson02.teach.nu_pot_sambata_phrase:
    title: شنبه نمی‌توانم
    gloss: Nu pot sâmbătă. (شنبه نمی‌توانم.)
    note: یک رد کردن ساده ــ *nu pot* به‌علاوه‌ی روزی که نمی‌شود.
  ro.a1.unit11.lesson02.teach.atunci_vocab:
    title: پس / در این صورت
    gloss: Atunci (پس / در این صورت)
    note: با *apoi* (به معنی «بعد» در درس ۹ که دو کار را پشت سر هم می‌آورد) فرق دارد ــ *atunci* پیشنهاد جایگزین می‌دهد یا نتیجه می‌گیرد و در تغییر دادن قرار مثل «پس چطوره...؟» به کار می‌رود.
    example_gloss:
    - پس یکشنبه؟
  ro.a1.unit11.lesson02.teach.atunci_duminica_phrase:
    title: پس یکشنبه؟
    gloss: Atunci, duminică? (پس یکشنبه؟)
    note: پیشنهاد جایگزین کوتاه بعد از رد کردن ــ گفتن روز تازه کافی است و لازم نیست کل دعوت تکرار شود.
  ro.a1.unit11.lesson02.teach.da_bine_duminica_phrase:
    title: بله، باشه! یکشنبه.
    gloss: Da, bine! Duminică. (بله، باشه! یکشنبه.)
    note: قبول کردن روز جدید، با همان الگوی کوتاه *Da, bine!* در درس اول.
  ro.a1.unit11.lesson03.teach.reminder_la_ce_ora_la_ora_patru:
    title: 'یادآوری: la ce oră, la ora, patru'
    gloss: la ce oră (چه ساعتی) · la ora (ساعت ...) · patru (چهار)
    note: La ce oră و la ora را در درس ۴ (پرسیدن و گفتن ساعت) و patru را در اعداد درس ۲ یاد گرفته‌اید ــ اینجا برای تعیین ساعت قرار کنار هم می‌آیند.
  ro.a1.unit11.lesson03.teach.reminder_buna_multumesc_la_revedere_da_ana_mihai:
    title: 'یادآوری: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (سلام) · mulțumesc (ممنون) · la revedere (خداحافظ) · da (بله) · Ana, Mihai (نام‌ها)
    note: همه‌ی این‌ها در درس‌های قبل آمده‌اند ــ اینجا آنا و میهای ساعت قرارشان را مشخص می‌کنند.
  ro.a1.unit11.lesson03.teach.sigur_vocab:
    title: حتماً
    gloss: Sigur (حتماً)
    note: راهی رایج برای تأیید قرار، به‌تنهایی ــ شبیه «حتماً!» یا «البته!» در فارسی.
    example_gloss:
    - حتماً! ساعت چهار.
  ro.a1.unit11.lesson03.teach.sigur_phrase:
    title: حتماً! ساعت چهار.
    gloss: Sigur! La ora patru. (حتماً! ساعت چهار.)
    note: هم قرار و هم ساعت دقیق را در یک پاسخ کوتاه تأیید می‌کند.
  ro.a1.unit11.lesson03.teach.line01:
    title: سلام و پیشنهاد پارک
    gloss: آنا به میهای سلام می‌کند و می‌پرسد یکشنبه به پارک بروند یا نه.
    note: دعوت *Mergem la parc?* این درس را با *duminică* ترکیب می‌کند.
  ro.a1.unit11.lesson03.teach.line02:
    title: قبول کردن و پرسیدن ساعت
    gloss: میهای قبول می‌کند و ساعت را می‌پرسد.
    note: سؤال *La ce oră?* از درس ۴ دوباره به کار رفته است.
  ro.a1.unit11.lesson03.teach.line03:
    title: پیشنهاد ساعت
    gloss: آنا ساعت چهار را پیشنهاد می‌دهد.
    note: یک سؤال کوتاه با الگوی *la ora* از درس ۴ و کلمه‌ی *patru* همین درس.
  ro.a1.unit11.lesson03.teach.line04:
    title: تأیید و تشکر
    gloss: میهای با «حتماً!» تأیید می‌کند و از آنا تشکر می‌کند.
    note: '*sigur* همین درس را با *mulțumesc* که از قبل می‌دانید ترکیب می‌کند.'
  ro.a1.unit11.lesson03.teach.line05:
    title: خداحافظی
    gloss: آنا خداحافظی می‌کند.
    note: همان الگوی پایانی که گفتگوی همه‌ی درس‌های قبلی با آن تمام شد.
  ro.a1.unit11.lesson03.teach.line06:
    title: پایان دیدار
    gloss: میهای هم خداحافظی می‌کند و نام آنا را می‌آورد.
    note: همان الگوی پایانیِ دوستانه‌ای که دیالوگ همهٔ واحدهای قبلی هم با آن تمام شد.
