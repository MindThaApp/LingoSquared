teaching:
  ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri:
    title: 'یادآوری: unde, este, gară, magazin, bancă, aproape'
    gloss: unde (کجا) · este (است) · gară (ایستگاه قطار) · magazin (فروشگاه) · bancă (بانک) · aproape (نزدیک)
    note: همهٔ این‌ها قبلاً آمده‌اند -- unde از درس ۷، este از درس ۳ و ۴، و gară/magazin/bancă/aproape از درس ۸ -- حالا در پرسش‌ها و مثال‌های مسیریابی این درس کنار هم می‌آیند.
  ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung:
    title: چطور می‌توانم برسم به...؟
    gloss: Cum pot să ajung...? (چطور می‌توانم برسم به...؟)
    note: روش رایج برای پرسیدن راه رسیدن به یک مکان -- *pot* (می‌توانم) قبلاً در *Unde pot să cumpăr...?* در درس ۷ آمده بود؛ *ajung* (می‌رسم) جدید است.
  ro.a1.unit09.lesson01.teach.mergeti_vocab:
    title: بروید
    gloss: Mergeți (بروید -- امر رسمی)
    note: '*Mergeți* شکل امر در سطح رسمی (dumneavoastră) است -- شیوهٔ مؤدبانهٔ گفتن «بروید»، همان‌طور که Ana و Mihai با هم حرف می‌زنند.'
    example_gloss:
    - مستقیم بروید.
  ro.a1.unit09.lesson01.teach.inainte_vocab:
    title: مستقیم
    gloss: înainte (مستقیم)
    note: با *Mergeți* می‌آید و ساده‌ترین راهنمایی ممکن را می‌سازد.
    example_gloss:
    - مستقیم بروید.
  ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase:
    title: مستقیم رفتن
    gloss: Mergeți înainte. (مستقیم بروید.)
    note: یک راهنمایی کوتاه و کامل -- ساده‌ترین پاسخ به *Cum pot să ajung...?*
  ro.a1.unit09.lesson01.teach.cum_ajung_gara:
    title: چطور می‌توانم به ایستگاه قطار برسم؟
    gloss: Cum pot să ajung la gară? (چطور می‌توانم به ایستگاه قطار برسم؟)
    note: '*Cum pot să ajung...?* و *gară* را در یک پرسش کامل کنار هم می‌گذارد -- *la* (به) پرسش را به مقصد وصل می‌کند. بعد از *la* مکان شکل ساده‌اش را نگه می‌دارد: *la gară*، نه *la gara*.'
  ro.a1.unit09.lesson01.teach.cum_ajung_banca:
    title: چطور می‌توانم به بانک برسم؟
    gloss: Cum pot să ajung la bancă? (چطور می‌توانم به بانک برسم؟)
    note: همان الگو، این بار با بانک -- پرسشی طبیعی، چون در درس ۸ گفته شد بانک دور است.
  ro.a1.unit09.lesson02.teach.dreapta_stanga_vocab:
    title: به راست، به چپ
    gloss: la dreapta (به راست) · la stânga (به چپ)
    note: 'دو پیچ اصلی -- هر کدام را همراه *la* (به) مثل یک جفت ثابت یاد بگیرید: *la dreapta*، *la stânga*.'
    example_gloss:
    - به راست بروید.
    - به چپ بروید.
  ro.a1.unit09.lesson02.teach.mergeti_dreapta_phrase:
    title: به راست بروید
    gloss: Mergeți la dreapta. (به راست بروید.)
    note: همان امر *Mergeți* مثل *Mergeți înainte.*، این بار با پیچیدن به‌جای مستقیم رفتن.
  ro.a1.unit09.lesson02.teach.mergeti_stanga_phrase:
    title: به چپ بروید
    gloss: Mergeți la stânga. (به چپ بروید.)
    note: پیچ مخالف -- همان الگوی ساده.
  ro.a1.unit09.lesson02.teach.aici_acolo_vocab:
    title: اینجا، آنجا
    gloss: aici (اینجا) · acolo (آنجا)
    note: راهی ساده برای نشان دادن جای چیزی وقتی رسیده‌اید یا آن را می‌بینید؛ با aproape/departe در درس ۸ فرق دارد (آن‌ها فاصله را بیان می‌کنند، نه موقعیت را).
    example_gloss:
    - فروشگاه اینجاست.
    - ایستگاه قطار آنجاست.
  ro.a1.unit09.lesson02.teach.magazinul_aici_phrase:
    title: فروشگاه اینجاست
    gloss: Magazinul este aici. (فروشگاه اینجاست.)
    note: یک جملهٔ کوتاه و کامل -- *aici* به چیزی درست همان‌جا که هستید اشاره می‌کند.
  ro.a1.unit09.lesson02.teach.gara_acolo_phrase:
    title: ایستگاه قطار آنجاست
    gloss: Gara este acolo. (ایستگاه قطار آنجاست.)
    note: '*Acolo* به چیزی اشاره می‌کند که دیده می‌شود ولی درست کنار شما نیست -- پایان طبیعی یک مسیر‌گویی.'
  ro.a1.unit09.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'یادآوری: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (سلام) · mulțumesc (ممنون) · la revedere (خداحافظ) · da (بله) · Ana, Mihai (اسم‌ها)
    note: همه در درس‌های قبل آمده‌اند -- اینجا Ana از Mihai راه را می‌پرسد.
  ro.a1.unit09.lesson03.teach.apoi:
    title: بعد
    gloss: apoi (بعد / سپس)
    note: دو مرحلهٔ مسیر را در یک جمله به هم وصل می‌کند -- راه طبیعی برای گفتن چند مرحله با هم.
    example_gloss:
    - مستقیم بروید، بعد به راست.
  ro.a1.unit09.lesson03.teach.line01:
    title: سلام و پرسیدن راه ایستگاه قطار
    gloss: Ana به Mihai سلام می‌کند و می‌پرسد چطور به ایستگاه قطار برسد.
    note: '*Cum pot să ajung* همین درس را با سلام درس ۱ ترکیب می‌کند.'
  ro.a1.unit09.lesson03.teach.line02:
    title: گفتن دو مرحله از مسیر
    gloss: Mihai می‌گوید مستقیم بروید، بعد به راست.
    note: '*Mergeți înainte* و *la dreapta* همین درس را دوباره به کار می‌برد و با *apoi* به هم وصل می‌کند.'
  ro.a1.unit09.lesson03.teach.line03:
    title: پرسیدن اینکه نزدیک است یا نه
    gloss: Ana می‌پرسد ایستگاه قطار نزدیک است یا نه.
    note: یک پرسش کوتاه بعدی که *este*/*aproape* درس ۸ را دوباره به کار می‌برد.
  ro.a1.unit09.lesson03.teach.line04:
    title: تأیید کردن و نشان دادن
    gloss: Mihai تأیید می‌کند که نزدیک است و می‌گوید ایستگاه قطار آنجاست.
    note: '*aproape* و *acolo* -- فاصله و موقعیت -- را در یک جمله ترکیب می‌کند.'
  ro.a1.unit09.lesson03.teach.line05:
    title: تشکر و پایان
    gloss: Ana از Mihai تشکر می‌کند و خداحافظی می‌کند.
    note: همان تشکر پایانی که در دیالوگ‌های درس ۱ و ۸ بود.
  ro.a1.unit09.lesson03.teach.line06:
    title: پایان دیدار
    gloss: Mihai هم خداحافظی می‌کند و نام Ana را می‌آورد.
    note: همان الگوی دوستانهٔ پایانی که دیالوگ‌های درس‌های ۱، ۵، ۶، ۷ و ۸ هم با آن تمام می‌شدند.
