answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching unit01''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Spoken answers are assessed for intelligibility, not written punctuation.
  register: tu and dumneavoastră (and their matching verb forms, ai/aveți) are never interchangeable answers for each other's exercises, the same discipline unit01 established.
course:
  title: رومانیایی در فارسی A1
  description: اعداد صفر تا صد، شامل الگوی ساخت اعداد یازده تا نوزده (-sprezece) و دهگان‌ها (-zeci)، تفاوت مذکر و مؤنث در doi/două، و استفاده از اعداد برای پرسیدن و گفتن سن و شماره تلفن، در ادامه‌ی ماجرای Ana و Mihai از درس اول.
units:
  ro.a1.unit02.numbers:
    title: اعداد
lessons:
  ro.a1.unit02.lesson01.zero_to_ten:
    title: اعداد صفر تا ده
  ro.a1.unit02.lesson02.eleven_to_hundred:
    title: اعداد یازده تا صد
  ro.a1.unit02.lesson03.age_and_phone:
    title: سن و شماره تلفن
teaching:
  ro.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: صفر
    note: '*Zero* تغییر نمی‌کند و برای خواندن یک رقم در اعداد بلندتر یا شماره تلفن هم به کار می‌رود.'
    example_gloss: صفر، یک، دو.
  ro.a1.unit02.lesson01.teach.unu:
    title: یک
    gloss: یک
    note: '*Unu* شکلی است که هنگام شمردن تنها به کار می‌رود. پیش از اسم مذکر یا خنثی به *un* کوتاه می‌شود (*un câine*، یک سگ) و پیش از اسم مؤنث به *o* تبدیل می‌شود (*o sută*، صد).'
    example_gloss: یک، دو، سه.
  ro.a1.unit02.lesson01.teach.doi:
    title: دو (مذکر)
    gloss: دو
    note: '*Doi* با اسم‌های مذکر به کار می‌رود (*doi bărbați*، دو مرد). اسم‌های مؤنث، و اسم‌های خنثی که در جمع مثل مؤنث رفتار می‌کنند، شکل دیگری می‌گیرند؛ کارت بعدی را ببینید.'
    example_gloss: دو، سه، چهار.
  ro.a1.unit02.lesson01.teach.doi_doua_gender:
    title: «دو» با جنسیت عوض می‌شود
    gloss: doi (مذکر) / două (مؤنث و خنثی)
    note: 'در فارسی «دو» برای همه‌ی اسم‌ها یکی است، اما در رومانیایی *doi* شکل مؤنث جداگانه‌ای دارد: *două*. این شکل با اسم‌های مؤنث لازم است (*două femei*، دو زن) و با اسم‌های خنثی هم که در جمع مؤنث‌اند (*două numere*، دو عدد). جز یک (*un*/*o*) و دو، اعداد *trei* تا *zece* برای همه‌ی جنسیت‌ها یکسان می‌مانند.'
  ro.a1.unit02.lesson01.teach.trei:
    title: سه
    gloss: سه
    note: '*Trei* برای همه‌ی جنسیت‌ها یکسان است.'
    example_gloss: سه، چهار، پنج.
  ro.a1.unit02.lesson01.teach.patru:
    title: چهار
    gloss: چهار
    note: '*Patru* تغییر نمی‌کند. به شکل کوتاه‌شده و بی‌قاعده‌اش در اعداد نوزده‌گان دقت کنید: *paisprezece* (۱۴)، نه *patrusprezece*.'
    example_gloss: چهار، پنج، شش.
  ro.a1.unit02.lesson01.teach.cinci:
    title: پنج
    gloss: پنج
    note: '*Cinci* تغییر نمی‌کند.'
    example_gloss: پنج، شش، هفت.
  ro.a1.unit02.lesson01.teach.sase:
    title: شش
    gloss: شش
    note: '*Șase* تغییر نمی‌کند.'
    example_gloss: شش، هفت، هشت.
  ro.a1.unit02.lesson01.teach.sapte:
    title: هفت
    gloss: هفت
    note: '*Șapte* تغییر نمی‌کند.'
    example_gloss: هفت، هشت، نه.
  ro.a1.unit02.lesson01.teach.opt:
    title: هشت
    gloss: هشت
    note: '*Opt* تغییر نمی‌کند.'
    example_gloss: هشت، نه، ده.
  ro.a1.unit02.lesson01.teach.noua:
    title: نه
    gloss: نه
    note: '*Nouă* تغییر نمی‌کند. اگر بدون نشانهٔ زیرش نوشته شود با *noua* («آن جدید»، مؤنث) یکی می‌شود؛ پس حتماً *ă* را تایپ کنید: پاسخ‌های تایپی همراه با نشانه‌هایشان بررسی می‌شوند.'
    example_gloss: نه، ده... تمام!
  ro.a1.unit02.lesson01.teach.zece:
    title: ده
    gloss: ده
    note: '*Zece* تغییر نمی‌کند و پایهٔ همهٔ اعداد یازده تا نوزده است (*zece* + *-sprezece*).'
    example_gloss: ده! آفرین!
  ro.a1.unit02.lesson02.teach.unsprezece:
    title: یازده
    gloss: یازده
    note: '*Unsprezece* در اصل از *unu* + *spre* + *zece* ساخته شده («یک بر ده»)؛ همهٔ اعداد یازده تا نوزده از همین الگو پیروی می‌کنند.'
    example_gloss: ده، یازده، دوازده.
  ro.a1.unit02.lesson02.teach.teens_pattern:
    title: دوازده تا نوزده
    gloss: doisprezece (12), treisprezece (13), paisprezece (14), cincisprezece (15), șaisprezece (16), șaptesprezece (17), optsprezece (18), nouăsprezece (19)
    note: 'در هر عدد، *-sprezece* به شکل معمولی رقم اضافه می‌شود: *doi* ← *doisprezece*، *trei* ← *treisprezece* و همین‌طور تا *nouă* ← *nouăsprezece*. دو عدد بی‌قاعده‌اند: چهارده، که در آن *patru* به *pai-* کوتاه می‌شود (*paisprezece* نه *patrusprezece*)، و شانزده، که در آن *șase* به *șai-* تبدیل می‌شود (*șaisprezece* نه *șasesprezece*).'
  ro.a1.unit02.lesson02.teach.douazeci:
    title: بیست
    gloss: بیست
    note: '*Douăzeci* («دو ده‌تایی») کلمه‌ای مستقل است و پایهٔ همهٔ اعداد ۲۱ تا ۲۹ است.'
    example_gloss: نوزده، بیست...
  ro.a1.unit02.lesson02.teach.douazeci_si_unu:
    title: بیست و یک
    gloss: بیست و یک
    note: 'از بیست‌ویک به بعد، رومانیایی ده‌گان و یکان را با *și* («و») وصل می‌کند: *douăzeci și unu*، *douăzeci și doi* و غیره -- برخلاف اعداد یازده تا نوزده که در یک کلمه ادغام می‌شوند.'
    example_gloss: بیست، بیست‌ویک، بیست‌ودو.
  ro.a1.unit02.lesson02.teach.tens_pattern:
    title: سی تا نود
    gloss: treizeci (30), patruzeci (40), cincizeci (50), șaizeci (60), șaptezeci (70), optzeci (80), nouăzeci (90)
    note: 'هر ده‌گان از سی به بعد از رقم + *-zeci* («ده‌ها») ساخته می‌شود -- *trei* ← *treizeci*، *patru* ← *patruzeci* و غیره. تنها تغییر املایی در شصت است: *șase* به *șai-* تبدیل می‌شود و *șaizeci* را می‌سازد (همان *șai-* در *șaisprezece*). برای ۷۰، ۸۰ و ۹۰ هم همین الگو برقرار است و شمارش بیست‌بیست در کار نیست.'
  ro.a1.unit02.lesson02.teach.o_suta:
    title: صد
    gloss: صد
    note: '*O sută* از *o* (شکل مؤنث «یک») استفاده می‌کند نه *un*، چون *sută* اسم مؤنث است.'
    example_gloss: نود، صد!
  ro.a1.unit02.lesson03.teach.cati_ani_ai:
    title: پرسیدن سن به‌صورت غیررسمی
    gloss: چند سالته؟
    note: تحت‌اللفظی یعنی «چند سال داری»؛ برای سن از فعل *avea* (داشتن) استفاده می‌شود، درست مثل الگوی *avoir* در فرانسوی. در فارسی هم برای سن از «داشتن» استفاده می‌کنیم. *Câți* (چند، مذکر) با *ani* (سال‌ها، مذکر) هماهنگ است.
  ro.a1.unit02.lesson03.teach.am_nouasprezece_ani:
    title: گفتن سن (زیر بیست سال)
    gloss: من نوزده سال دارم.
    note: '*Am* صرف *avea* برای *eu* است. برای اعداد زیر بیست، قبل از *ani* به *de* نیازی نیست.'
  ro.a1.unit02.lesson03.teach.cati_ani_aveti:
    title: پرسیدن سن به‌صورت رسمی
    gloss: چند سالته؟
    note: '*Aveți* صورت *dumneavoastră* از *avea* است و با لحن محترمانه‌ای که در درس ۱ دیدیم جور است.'
  ro.a1.unit02.lesson03.teach.am_treizeci_de_ani:
    title: گفتن سن (بیست سال و بالاتر)
    gloss: من سی سال دارم.
    note: '*De* اینجا آمده چون *treizeci* بیست یا بیشتر است -- قاعدهٔ کامل را در کارت بعدی ببینید.'
  ro.a1.unit02.lesson03.teach.de_insertion_rule:
    title: چه وقت قبل از اسم de می‌آید
    gloss: '۲ تا ۱۹: بدون de (doi ani) / ۲۰ به بالا: با de (treizeci de ani)'
    note: 'قاعده‌ای ویژهٔ رومانیایی که در فارسی موازی ندارد: اعداد ۲ تا ۱۹ مستقیم به اسم می‌چسبند (*doi ani*، دو سال؛ *nouăsprezece ani*، نوزده سال)، اما از ۲۰ به بالا بین عدد و اسم *de* می‌آید (*treizeci de ani*، سی سال؛ *o sută de ani*، صد سال). عدد یک حالت جداگانه دارد (*un an*، یک سال -- مفرد و در هر صورت بدون *de*).'
  ro.a1.unit02.lesson03.teach.care_e_numarul_tau:
    title: پرسیدن شمارهٔ تلفن به شکل صمیمی
    gloss: شماره تلفنت چنده؟
    note: برای پرسیدن یک شماره‌ی مشخص، طبیعی است که از *Care* (کدام) استفاده کنیم، نه *ce*. *Număr* اسم خنثی است و در مفرد مثل اسم مذکر رفتار می‌کند؛ برای همین می‌گوییم *numărul tău* و صفت ملکی *tău* است، نه *ta*.
  ro.a1.unit02.lesson03.teach.care_este_numarul_dvs:
    title: پرسیدن شمارهٔ تلفن به شکل رسمی
    gloss: شماره تلفنت چنده؟
    note: '*Este* صورت کامل *e* است که در گفتار دقیق یا رسمی بیشتر به کار می‌رود. *Dumneavoastră* گفتگو را محترمانه نگه می‌دارد، همان کلمه‌ای که در درس ۱ یاد گرفتید.'
  ro.a1.unit02.lesson03.teach.raspuns_telefon:
    title: گفتن شمارهٔ تلفن رقم به رقم
    gloss: 'شماره این است: صفر، هفت، دو، یک، چهار، پنج، شش، هفت، هشت، نه.'
    note: این درس به خواندن ساده و رقم‌به‌رقم بسنده می‌کند، مثل همان ساده‌سازی که در درس ۱ برای انتخاب لحن داشتیم -- ممکن است در عمل رقم‌ها را دوتادوتا هم بگویند، ولی تک‌تک گفتن همیشه فهمیده می‌شود.
