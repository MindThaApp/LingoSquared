  ro.a1.unit18.lesson03.vizita_la_ana:
    title: دیدار در خانه‌ی آنا
teaching:
  ro.a1.unit18.lesson01.teach.reminder_ana_mare:
    title: 'یادآوری: Ana، mare'
    gloss: Ana (اسم) · mare (بزرگ)
    note: Ana اسم شخصیت داستان است و از درس اول با آن آشنا شده‌اید؛ *mare* از درس ۵ و ۱۴ است. در این درس هر دو برای توصیف خانه‌ی او دوباره به کار می‌روند.
  ro.a1.unit18.lesson01.teach.reminder_articole_trei:
    title: 'یادآوری: un، o، și، trei'
    gloss: un/o (یک) · și (و) · trei (سه)
    note: '*Un*، *o* و *și* از درس ۵ هستند و *trei* از شمارش درس ۲ است. در این درس هر چهار کلمه برای شمردن و توصیف اتاق‌ها دوباره به کار می‌روند.'
  ro.a1.unit18.lesson01.teach.are_vocab:
    title: دارد
    gloss: Are (او دارد)
    note: شکل تازه‌ای از *a avea* (داشتن). *am* (من دارم، از درس ۲ و ۵) و *aveți* (شما دارید، رسمی) را از قبل می‌دانید؛ *are* شکل سوم شخص همین فعل است و برای گفتن اینکه کسی یا چیزی چه دارد به کار می‌رود.
  ro.a1.unit18.lesson01.teach.casa_vocab:
    title: خانه
    gloss: Casă (خانه)
    note: جایی که کسی در آن زندگی می‌کند.
    example_gloss:
    - آنا یک خانه‌ی بزرگ دارد.
  ro.a1.unit18.lesson01.teach.camera_vocab:
    title: اتاق
    gloss: Cameră (اتاق)
    note: کلمه‌ای کلی برای یک اتاق در خانه.
    example_gloss:
    - آنا یک اتاق بزرگ دارد.
  ro.a1.unit18.lesson01.teach.camere_plural:
    title: Cameră → camere
    gloss: cameră (اتاق) · camere (اتاق‌ها)
    note: جمع *cameră* می‌شود *camere*؛ وقتی بیشتر از یک اتاق را می‌شمارید از آن استفاده می‌کنید.
  ro.a1.unit18.lesson01.teach.dormitor_vocab:
    title: اتاق خواب
    gloss: Dormitor (اتاق خواب)
    note: اتاقی که در آن می‌خوابند.
    example_gloss:
    - آنا یک اتاق خواب دارد.
  ro.a1.unit18.lesson01.teach.bucatarie_vocab:
    title: آشپزخانه
    gloss: Bucătărie (آشپزخانه)
    note: اتاقی که در آن غذا می‌پزند.
    example_gloss:
    - آنا یک آشپزخانه دارد.
  ro.a1.unit18.lesson01.teach.baie_vocab:
    title: حمام
    gloss: Baie (حمام)
    note: اتاقی که وان یا دوش و توالت دارد.
    example_gloss:
    - آنا یک حمام دارد.
  ro.a1.unit18.lesson01.teach.casa_mare_phrase:
    title: 'آنا یک خانه‌ی بزرگ دارد. خانه سه اتاق دارد: یک اتاق خواب، یک آشپزخانه و یک حمام.'
    gloss: 'Ana are o casă mare. Casa are trei camere: un dormitor, o bucătărie și o baie.'
    note: 'همه‌ی کلمه‌ها قبلاً آموخته شده‌اند یا همین حالا معرفی شده‌اند و در دو جمله‌ی تازه درباره‌ی خانه‌ی آنا کنار هم آمده‌اند. *Casa* شکل معرفه‌ی *casă* است، یعنی «خانه‌ی مشخص»: اسم مؤنثی که به -ă ختم می‌شود، -ă را با -a عوض می‌کند، مثل *banca* (بانک) در درس ۸.'
  ro.a1.unit18.lesson02.teach.reminder_mihai_mic:
    title: 'یادآوری: Mihai، mic'
    gloss: Mihai (اسم) · mic (کوچک)
    note: Mihai اسم شخصیت داستان است و از درس اول با آن آشنا شده‌اید؛ *mic* از درس ۱۴ است. در این درس هر دو برای توصیف آپارتمان او دوباره به کار می‌روند.
  ro.a1.unit18.lesson02.teach.reminder_unde_este_doua:
    title: 'یادآوری: unde، este، două'
    gloss: unde (کجا) · este (است) · două (دو، مؤنث)
    note: '*Unde* و *este* از درس ۸ و ۹ هستند؛ *două* شکل مؤنث «دو» از درس ۲ است. در این درس هر سه برای پرسیدن درباره‌ی اتاق‌ها و شمردن آن‌ها دوباره به کار می‌روند.'
  ro.a1.unit18.lesson02.teach.apartament_vocab:
    title: آپارتمان
    gloss: Apartament (آپارتمان)
    note: خانه‌ی میهای -- جایگزینی کوچک‌تر برای خانه‌ی آنا.
    example_gloss:
    - میهای یک آپارتمان کوچک دارد.
  ro.a1.unit18.lesson02.teach.fereastra_vocab:
    title: پنجره
    gloss: Fereastră (پنجره)
    note: '*Apartamentul* شکل معرفه‌ی *apartament* است، یعنی «آپارتمان مشخص»: اسم خنثایی که به صامت ختم می‌شود، -ul می‌گیرد، مثل *magazinul* (مغازه) در درس ۸ (اما اسم مؤنث *casă* به *casa* تبدیل می‌شود).'
    example_gloss:
    - آپارتمان یک پنجره‌ی بزرگ دارد.
  ro.a1.unit18.lesson02.teach.apartament_mic_phrase:
    title: 'میهای یک آپارتمان کوچک دارد. آپارتمان دو اتاق دارد: یک اتاق خواب و یک آشپزخانه.'
    gloss: 'Mihai are un apartament mic. Apartamentul are două camere: un dormitor și o bucătărie.'
    note: همه‌ی کلمه‌ها قبلاً آموخته شده‌اند یا همین حالا معرفی شده‌اند و در دو جمله‌ی تازه درباره‌ی آپارتمان میهای کنار هم آمده‌اند.
  ro.a1.unit18.lesson02.teach.unde_este_baia_phrase:
    title: حمام کجاست؟
    gloss: Unde este baia؟ (حمام کجاست؟)
    note: '*Baia* شکل معرفه‌ی *baie* است، یعنی «حمام مشخص». وقتی به خانه‌ی کسی می‌روید، سؤال بسیار کاربردی‌ای است.'
  ro.a1.unit18.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'یادآوری: Bună، Ce mai faceți؟، Bine, mulțumesc'
    gloss: Bună (سلام) · Ce mai faceți؟ (حال شما چطور است؟، رسمی) · Bine, mulțumesc (خوبم، ممنون)
    note: همه از احوال‌پرسی ابتدای درس اول هستند و اینجا برای شروع گفت‌وگوی همین درس دوباره به کار می‌روند.
  ro.a1.unit18.lesson03.teach.reminder_la_revedere_mea_aproape_am:
    title: 'یادآوری: La revedere، Mea، Aproape، Am'
    gloss: La revedere (خداحافظ) · Mea (مال من، مؤنث) · Aproape (نزدیک) · Am (من دارم)
    note: '*La revedere* از درس ۱ است؛ *mea* از *Mama mea* در درس ۵ است؛ *aproape* از پاسخ‌های *Unde este...?* در درس ۸ و ۹ است؛ *am* از درس ۲ و ۵ است. همه‌ی این‌ها اینجا برای گفت‌وگوی دیدار از خانه دوباره به کار می‌روند.'
  ro.a1.unit18.lesson03.teach.line01:
    title: به آنا سلام کنید و حالش را بپرسید
    gloss: میهای به آنا سلام می‌کند و حالش را می‌پرسد.
    note: از جمله‌ی *Ce mai faceți?* در درس ۱ دوباره استفاده می‌کند.
  ro.a1.unit18.lesson03.teach.line02:
    title: جواب بدهید و خانه‌تان را توصیف کنید
    gloss: آنا جواب می‌دهد، بعد به میهای می‌گوید خانه‌اش بزرگ است و سه اتاق دارد.
    note: '*Bine, mulțumesc* از درس ۱ را با عبارت درس اول همین واحد ترکیب می‌کند.'
  ro.a1.unit18.lesson03.teach.line03:
    title: بپرسید حمام کجاست
    gloss: میهای از آنا می‌پرسد حمام کجاست.
    note: تقریباً همان عبارت درس دوم همین واحد را دوباره به کار می‌برد.
  ro.a1.unit18.lesson03.teach.line04:
    title: جواب بدهید حمام کجاست
    gloss: آنا به او می‌گوید نزدیک است.
    note: '*baia* را با *aproape* ترکیب می‌کند، همان الگوی پاسخ «... کجاست؟» که در درس ۸ و ۹ آمده بود.'
  ro.a1.unit18.lesson03.teach.line05:
    title: آپارتمان خودتان را توصیف کنید و خداحافظی کنید
    gloss: میهای می‌گوید یک آپارتمان کوچک با دو اتاق دارد، بعد خداحافظی می‌کند.
    note: عبارت درس دوم همین واحد را با جمله‌ی پایانی درس ۱ ترکیب می‌کند.
  ro.a1.unit18.lesson03.teach.line06:
    title: خداحافظی کنید
    gloss: آنا خداحافظی می‌کند.
    note: همان الگوی پایانی که گفت‌وگوی هر درس قبلی با آن تمام شده است.
