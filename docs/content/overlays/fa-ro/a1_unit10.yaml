  ro.a1.unit10.lesson03.rutina_mihai:
    title: برنامهٔ روزانهٔ میهای
teaching:
  ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine:
    title: 'یادآوری: dimineața، seara، noaptea، cafea، pâine'
    gloss: dimineața (صبح) · seara (عصر/شب) · noaptea (شب) · cafea (قهوه) · pâine (نان)
    note: همهٔ این‌ها قبلاً آمده‌اند -- dimineața/seara/noaptea از درس ۴ و cafea/pâine از درس ۶ -- و اینجا در جمله‌های برنامهٔ روزانهٔ همین درس کنار هم می‌آیند.
  ro.a1.unit10.lesson01.teach.ma_trezesc_vocab:
    title: بیدار می‌شوم
    gloss: Mă trezesc (بیدار می‌شوم)
    note: '*Mă* همان ضمیر انعکاسی‌ای است که در *mă numesc*/*mă cheamă* دیده‌اید -- رومانیایی برای «بیدار شدن» فعل انعکاسی به کار می‌برد، یعنی تقریباً «خودم را بیدار می‌کنم».'
    example_gloss:
    - صبح‌ها بیدار می‌شوم.
  ro.a1.unit10.lesson01.teach.ma_trezesc_phrase:
    title: صبح‌ها بیدار می‌شوم
    gloss: Mă trezesc dimineața. (صبح‌ها بیدار می‌شوم.)
    note: یک جملهٔ کوتاه و کامل -- ساده‌ترین جملهٔ برنامهٔ روزانه.
  ro.a1.unit10.lesson01.teach.mananc_vocab:
    title: می‌خورم
    gloss: Mănânc (می‌خورم)
    note: ضمیر «من» لازم نیست -- پایانهٔ فعل در رومانیایی نشان می‌دهد چه کسی حرف می‌زند، مثل *vreau*/*cumpăr*/*aș dori* که قبلاً دیده‌اید. در فارسی هم معمولاً همین‌طور است.
    example_gloss:
    - صبح‌ها نان می‌خورم.
  ro.a1.unit10.lesson01.teach.beau_vocab:
    title: می‌نوشم
    gloss: Beau (می‌نوشم)
    note: به‌طور طبیعی با نوشیدنی‌هایی که می‌شناسید، مثل *cafea* و *ceai*، می‌آید.
    example_gloss:
    - من صبح‌ها قهوه می‌خورم.
  ro.a1.unit10.lesson01.teach.mananc_beau_phrase:
    title: صبح‌ها نان می‌خورم و قهوه می‌نوشم
    gloss: Mănânc pâine și beau cafea dimineața. (صبح‌ها نان می‌خورم و قهوه می‌نوشم.)
    note: دو کار را با *și* (و) به هم وصل می‌کند، که از *ora unu și jumătate* در درس ۴ می‌شناسید.
  ro.a1.unit10.lesson02.teach.lucrez_vocab:
    title: کار می‌کنم
    gloss: Lucrez (کار می‌کنم)
    note: صورت اول‌شخص *lucrează* است که در درس ۴ دربارهٔ کار عصرِ میهای دیدید.
    example_gloss:
    - عصرها کار می‌کنم.
  ro.a1.unit10.lesson02.teach.lucrez_phrase:
    title: عصرها کار می‌کنم
    gloss: Lucrez seara. (عصرها کار می‌کنم.)
    note: یک جملهٔ کوتاه و کامل دربارهٔ زمان کار کردن.
  ro.a1.unit10.lesson02.teach.merg_vocab:
    title: می‌روم
    gloss: Merg (می‌روم)
    note: صورت اول‌شخص *mergeți* است، همان فعلی که در شکل امری قبلاً دیدید -- فعل یکی است، فقط شخص فرق می‌کند.
    example_gloss:
    - به خانه می‌روم.
  ro.a1.unit10.lesson02.teach.acasa_vocab:
    title: خانه
    gloss: Acasă (خانه)
    note: بدون حرف اضافه به کار می‌رود -- *merg acasă*، نه *merg la acasă*. در فارسی معمولاً حرف اضافه می‌گوییم («به خانه می‌روم»)، ولی در رومانیایی acasă خودش بدون حرف اضافه می‌آید.
    example_gloss:
    - شب‌ها به خانه می‌روم.
  ro.a1.unit10.lesson02.teach.merg_acasa_phrase:
    title: شب‌ها به خانه می‌روم
    gloss: Merg acasă noaptea. (شب‌ها به خانه می‌روم.)
    note: یک جملهٔ کوتاه و کامل -- پایان طبیعی یک روز کاری.
  ro.a1.unit10.lesson02.teach.lucrez_merg_phrase:
    title: عصرها کار می‌کنم و شب‌ها به خانه می‌روم
    gloss: Lucrez seara și merg acasă noaptea. (عصرها کار می‌کنم و شب‌ها به خانه می‌روم.)
    note: دو جملهٔ همین درس را با *și* در یک جمله ترکیب می‌کند.
  ro.a1.unit10.lesson03.teach.reminder_cursul_incepe_ora_apoi:
    title: 'یادآوری: cursul، începe، la ora nouă، apoi'
    gloss: cursul (کلاس) · începe (شروع می‌شود) · la ora nouă (ساعت نه) · apoi (بعد)
    note: Cursul/începe/la ora nouă از درس ۴ آمده‌اند (کلاس میهای ساعت نه صبح شروع می‌شود)؛ apoi از درس ۹ -- و اینجا در شرح برنامهٔ روزانهٔ خود میهای کنار هم می‌آیند.
  ro.a1.unit10.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'یادآوری: bună، mulțumesc، la revedere، da، Ana، Mihai'
    gloss: bună (سلام) · mulțumesc (ممنون) · la revedere (خداحافظ) · da (بله) · Ana، Mihai (نام‌ها)
    note: همهٔ این‌ها در درس‌های قبل آمده‌اند -- اینجا آنا دربارهٔ روز میهای می‌پرسد.
  ro.a1.unit10.lesson03.teach.ma_culc_vocab:
    title: می‌خوابم
    gloss: Mă culc (می‌خوابم)
    note: فعل انعکاسی دیگری، با همان الگوی *mă trezesc* -- تقریباً «خودم را می‌خوابانم».
    example_gloss:
    - شب‌ها می‌خوابم.
  ro.a1.unit10.lesson03.teach.ma_culc_phrase:
    title: شب‌ها می‌خوابم
    gloss: Mă culc noaptea. (شب‌ها می‌خوابم.)
    note: پایان طبیعی روز، که برنامهٔ شروع‌شده با *mă trezesc dimineața* را تمام می‌کند.
  ro.a1.unit10.lesson03.teach.line01:
    title: سلام و پرسیدن زمان شروع کلاس
    gloss: آنا به میهای سلام می‌کند و می‌پرسد کلاسش کی شروع می‌شود.
    note: همان سؤال درس ۴ دربارهٔ کلاس میهای را دوباره به کار می‌برد.
  ro.a1.unit10.lesson03.teach.line02:
    title: جواب با زمان کلاس
    gloss: میهای می‌گوید کلاسش ساعت نه صبح شروع می‌شود.
    note: دقیقاً همان جوابی که میهای در درس ۴ داد، که اینجا بخشی از برنامهٔ روزانهٔ کامل‌ترش است.
  ro.a1.unit10.lesson03.teach.line03:
    title: پرسیدن دربارهٔ عصر
    gloss: 'آنا یک سؤال کوتاه دنبال‌هدار می‌پرسد: «عصرها چی؟»'
    note: راهی طبیعی و کوتاه برای پرسیدن بقیهٔ برنامه، بدون کلمهٔ پرسشی تازه.
  ro.a1.unit10.lesson03.teach.line04:
    title: شرح بقیهٔ روز
    gloss: میهای می‌گوید عصرها کار می‌کند، بعد شب می‌خوابد.
    note: '*lucrez* و *mă culc* همین درس را با *apoi* به هم وصل می‌کند -- و با واقعیتی که در درس ۴ آمده هم می‌خواند: میهای عصرها کار می‌کند.'
  ro.a1.unit10.lesson03.teach.line05:
    title: تشکر و پایان گفتگو
    gloss: آنا می‌گوید «خوب!»، از میهای تشکر می‌کند و خداحافظی می‌کند.
    note: همان تشکر پایانی که در گفتگوهای درس ۱، ۸ و ۹ بود.
  ro.a1.unit10.lesson03.teach.line06:
    title: پایان دیدار
    gloss: میهای هم خداحافظی می‌کند و نام آنا را می‌آورد.
    note: همان الگوی دوستانهٔ پایانی که گفتگوهای همهٔ درس‌های قبل با آن تمام شد.
