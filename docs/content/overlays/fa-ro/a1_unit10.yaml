answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new verbs are all first-person singular (mă trezesc, mănânc, beau, lucrez, merg, mă culc) and are register-neutral -- Romanian's first-person verb form is the same regardless of tu/dumneavoastră, and this unit introduces no second-person forms. Ana and Mihai's closing dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09.
course:
  title: رومانیایی در فارسی A1
  description: توصیف یک برنامهٔ روزانهٔ ساده به رومانیایی -- mă trezesc (بیدار می‌شوم)، mănânc / beau (می‌خورم / می‌نوشم)، lucrez (کار می‌کنم)، merg acasă (به خانه می‌روم) و mă culc (می‌خوابم) -- در ادامهٔ داستان آنا و میهای، وقتی آنا دربارهٔ روز میهای می‌پرسد.
units:
  ro.a1.unit10.routines:
    title: برنامهٔ روزانه
