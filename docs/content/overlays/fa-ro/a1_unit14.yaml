teaching:
  ro.a1.unit14.lesson01.teach.reminder_mare:
    title: 'یادآوری: mare'
    gloss: mare (بزرگ)
    note: 'قبلاً در واحد ۳ ("literă mare"، حرف بزرگ) و واحد ۵ ("o familie mare"، یک خانواده‌ی بزرگ) آمده است؛ اینجا برای اولین بار هم‌نشین مقایسه‌ای واقعی پیدا می‌کند: *mic/mică*.'
  ro.a1.unit14.lesson01.teach.reminder_cafeaua_ceaiul_painea:
    title: 'یادآوری: cafeaua، ceaiul، pâinea، cafea، ceai'
    gloss: cafeaua (قهوه) · ceaiul (چای) · pâinea (نان) · cafea (قهوه) · ceai (چای)
    note: همه از واحدهای ۶ و ۱۳ هستند؛ این واحد شکل‌های معرفه را برای چیزهایی به کار می‌برد که اندازه‌شان مقایسه می‌شود و شکل‌های نکره را دوباره در تمرین جورکردن همین درس می‌آورد.
  ro.a1.unit14.lesson01.teach.mic_mica_vocab:
    title: کوچیک
    gloss: Mic (کوچک، مذکر/خنثی) · Mică (کوچک، مؤنث)
    note: 'در رومانیایی صفت با اسمی که توصیف می‌کند هم‌خوانی دارد: *ceai* (چای) شکل مذکر/خنثی *mic* را می‌گیرد، ولی *cafea* (قهوه) و *pâine* (نان) مؤنث‌اند و *mică* می‌گیرند. *Mare* (بزرگ) در مفرد برای مذکر و مؤنث یک شکل دارد، برای همین به این تقسیم نیاز نداشت.'
    example_gloss:
    - چای کوچک است.
    - قهوه کوچک است.
  ro.a1.unit14.lesson01.teach.ceaiul_e_mic_phrase:
    title: چای کوچک است
    gloss: Ceaiul e mic. (چای کوچک است.)
    note: '*Ceaiul* خنثی است، برای همین شکل مذکر/خنثی *mic* را می‌گیرد.'
  ro.a1.unit14.lesson01.teach.cafeaua_e_mica_phrase:
    title: قهوه کوچک است
    gloss: Cafeaua e mică. (قهوه کوچک است.)
    note: '*Cafeaua* مؤنث است، برای همین شکل مؤنث *mică* را می‌گیرد.'
  ro.a1.unit14.lesson01.teach.painea_e_mica_phrase:
    title: نان کوچک است
    gloss: Pâinea e mică. (نان کوچیکه.)
    note: '*Pâinea* هم مؤنث است، برای همین مثل *cafeaua* با *mică* می‌آید.'
  ro.a1.unit14.lesson02.teach.reminder_mare_mic_mica:
    title: 'یادآوری: Mare, Mic, Mică'
    gloss: Mare (بزرگ) · Mic (کوچک، مذکر/خنثی) · Mică (کوچک، مؤنث)
    note: همه از درس‌های همین واحد هستند؛ اینجا شکل تفضیلی پیدا می‌کنند.
  ro.a1.unit14.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'یادآوری: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (قهوه) · ceaiul (چای) · pâinea (نان)
    note: همه از واحد ۱۳ هستند و اینجا دوباره به‌عنوان چیزهایی که با هم مقایسه می‌شوند آمده‌اند.
  ro.a1.unit14.lesson02.teach.mai_vocab:
    title: بیشتر / ـتر
    gloss: Mai (بیشتر / ـتر، برای مقایسه)
    note: 'این همان *mai* به معنی ماه مه (واحد ۳) نیست. همان کلمهٔ کوچکی است که در ''Ce mai faceți?'' (واحد ۱) دیدید، ولی اینجا کار دیگری می‌کند: ذرهٔ مقایسه است. *mai* را قبل از صفت بگذارید تا معنی «بیشتر ___» یا «___تر» بدهد؛ روش معمول ساخت صفت تفضیلی در رومانیایی همین است.'
    example_gloss:
    - قهوه بزرگ‌تره.
  ro.a1.unit14.lesson02.teach.mai_mare_phrase:
    title: قهوه بزرگ‌تره
    gloss: Cafeaua e mai mare. (قهوه بزرگ‌تره.)
    note: '*Mai* + صفت؛ هیچ تغییر دیگری لازم نیست.'
  ro.a1.unit14.lesson02.teach.decat_vocab:
    title: از (در مقایسه)
    gloss: Decât (از، در مقایسه)
    note: 'مقایسه را کامل می‌کند: *mai* + صفت + *decât* + چیز دوم که با آن مقایسه می‌شود.'
    example_gloss:
    - قهوه از چای بزرگ‌تره.
  ro.a1.unit14.lesson02.teach.mai_mare_decat_phrase:
    title: قهوه از چای بزرگ‌تره
    gloss: Cafeaua e mai mare decât ceaiul. (قهوه از چای بزرگ‌تره.)
    note: 'الگوی کامل مقایسه: [چیز اول] + e + mai + [صفت] + decât + [چیز دوم].'
  ro.a1.unit14.lesson02.teach.mai_mica_decat_phrase:
    title: نان از قهوه کوچک‌تره
    gloss: Pâinea e mai mică decât cafeaua. (نان از قهوه کوچک‌تره.)
    note: همان الگو با *mică*، شکل مؤنث «کوچک» که در همین واحد یاد گرفتید.
  ro.a1.unit14.lesson03.teach.reminder_mai_decat_mare_mic_mica:
    title: 'یادآوری: Mai, Decât, Mare, Mic, Mică'
    gloss: Mai (بیشتر/ـتر) · Decât (از، در مقایسه) · Mare (بزرگ) · Mic (کوچک، مذکر/خنثی) · Mică (کوچک، مؤنث)
    note: همه از درس‌های همین واحد هستند؛ اینجا آنا و میهای آن‌ها را کنار هم به کار می‌برند.
  ro.a1.unit14.lesson03.teach.reminder_cafeaua_ceaiul_painea:
    title: 'یادآوری: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (قهوه) · ceaiul (چای) · pâinea (نان)
    note: همه از واحد ۱۳ هستند؛ سه چیزی که آنا و میهای مقایسه می‌کنند.
  ro.a1.unit14.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'یادآوری: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (سلام) · mulțumesc (ممنون) · la revedere (خداحافظ) · Ana, Mihai (اسم‌ها)
    note: همه در واحدهای قبلی آمده‌اند؛ همان شروع و پایان دوستانه‌ای که در همهٔ گفتگوهای این دوره بوده است.
  ro.a1.unit14.lesson03.teach.line01:
    title: سلام و پرسیدن دربارهٔ اندازه
    gloss: میهای به آنا سلام می‌کند و می‌پرسد قهوه بزرگه یا کوچیک.
    note: از *mare sau mică* (بزرگ یا کوچک) همین واحد برای سؤال دربارهٔ اندازه استفاده می‌کند؛ همان قالب «X یا Y؟» برای انتخاب که در *cafea sau ceai?* واحد ۱۳ دیدید.
  ro.a1.unit14.lesson03.teach.line02:
    title: توصیف اندازهٔ دو نوشیدنی
    gloss: آنا می‌گوید قهوه بزرگه و چای کوچیکه.
    note: فقط یک واقعیت دربارهٔ اندازه است، نه سلیقه؛ در این گفتگو معلوم نمی‌شود کی کدام نوشیدنی را دوست دارد یا سفارش می‌دهد، فقط اندازهٔ هرکدام گفته می‌شود.
  ro.a1.unit14.lesson03.teach.line03:
    title: پرسیدن برای تأیید مقایسه
    gloss: میهای می‌پرسد قهوه از چای بزرگ‌تره؟
    note: دو جملهٔ جدای آنا (خط دوم) را با *mai mare decât*، ساختار اصلی همین واحد، به یک مقایسهٔ مستقیم تبدیل می‌کند.
  ro.a1.unit14.lesson03.teach.line04:
    title: تأیید و اضافه کردن نان
    gloss: آنا تأیید می‌کند، بعد می‌گوید نان از قهوه کوچک‌تره.
    note: '*mai ... decât* را با مورد سوم، *pâinea*، دوباره به کار می‌برد، این بار با شکل تفضیلی «کوچک‌تر»، یعنی *mai mică*.'
  ro.a1.unit14.lesson03.teach.line05:
    title: تأیید، تشکر و خداحافظی
    gloss: میهای تأیید می‌کند که نان کوچیکه، از آنا تشکر می‌کند و خداحافظی می‌کند.
    note: همان پایان معمولی که گفتگوهای واحدهای قبلی هم داشتند.
  ro.a1.unit14.lesson03.teach.line06:
    title: پایان گفتگو
    gloss: آنا هم خداحافظی می‌کند و اسم میهای را می‌آورد.
    note: همان پایان دوستانه‌ای که گفتگوهای واحدهای قبلی هم داشتند.
