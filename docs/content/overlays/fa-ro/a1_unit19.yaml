teaching:
  ro.a1.unit19.lesson01.teach.reminder_ana_este:
    title: 'یادآوری: Ana، Este، Și'
    gloss: Ana (اسم) · Este (است) · Și (و)
    note: Ana اسم شخصیت داستان است و از درس اول با آن آشنا شده‌اید؛ *este* از درس‌های مکان‌ها در واحد ۸ است؛ *și* از واحد ۵ است. در این واحد هر سه برای توصیف هوای امروز دوباره به کار می‌روند.
  ro.a1.unit19.lesson01.teach.reminder_astazi:
    title: 'یادآوری: Astăzi'
    gloss: Astăzi (امروز)
    note: از واژه‌های تاریخ و زمان واحد ۳ است؛ اینجا برای گفتن از هوای امروز دوباره آمده است.
  ro.a1.unit19.lesson01.teach.vreme_vocab:
    title: آب‌وهوا
    gloss: Vreme (آب‌وهوا)
    note: '*Vremea* شکل معرفهٔ *vreme* است، یعنی «آب‌وهوای مشخص»: اسم مؤنثی که به -e ختم می‌شود، -a می‌گیرد، مثل *baie* ← *baia* (حمام) در واحد ۱۸.'
    example_gloss:
    - هوا چطور است؟
  ro.a1.unit19.lesson01.teach.cum_este_vremea_phrase:
    title: هوا چطور است؟
    gloss: Cum este vremea? (هوا چطور است؟)
    note: روش رایج پرسیدن دربارهٔ هوا؛ *cum* را در واحدهای ۱، ۹ و ۱۲ دیده‌اید.
  ro.a1.unit19.lesson01.teach.soare_vocab:
    title: آفتاب / آفتابی
    gloss: Soare (آفتاب / آفتابی)
    note: 'با *este* برای توصیف هوای آفتابی می‌آید: *Este soare* به‌معنای واقعی «آفتاب است» و یعنی «هوا آفتابی است».'
    example_gloss:
    - امروز هوا آفتابی است.
  ro.a1.unit19.lesson01.teach.cald_vocab:
    title: گرم / داغ
    gloss: Cald (گرم / داغ)
    note: واژه‌ای ثابت برای هوا است؛ در *Este cald* همیشه همین شکل می‌آید و تغییر نمی‌کند.
    example_gloss:
    - امروز هوا گرم است.
  ro.a1.unit19.lesson01.teach.astazi_soare_cald_phrase:
    title: امروز هوا آفتابی است. گرم است.
    gloss: Astăzi este soare. Este cald.
    note: همهٔ واژه‌های این‌جا قبلاً آمده‌اند یا همین حالا معرفی شده‌اند و در دو جملهٔ تازه دربارهٔ هوای امروز کنار هم آمده‌اند.
  ro.a1.unit19.lesson02.teach.reminder_mihai_maine:
    title: 'یادآوری: Mihai، Mâine'
    gloss: Mihai (اسم) · Mâine (فردا)
    note: Mihai اسم شخصیت داستان است و از درس اول با آن آشنا شده‌اید؛ *mâine* از واحدهای ۳ و ۱۲ است. در این واحد هر دو برای پیش‌بینی هوای فردا دوباره به کار می‌روند.
  ro.a1.unit19.lesson02.teach.reminder_nu_mergem_la_parc:
    title: 'یادآوری: Nu، Mergem، La parc'
    gloss: Nu (نه / نفی) · Mergem (می‌رویم) · La parc (به پارک)
    note: همه از واژه‌های برنامه‌ریزی واحد ۱۱ هستند؛ اینجا برای تصمیم دربارهٔ رفتن به پارک بسته به هوا دوباره آمده‌اند.
  ro.a1.unit19.lesson02.teach.ploua_vocab:
    title: باران می‌آید
    gloss: Plouă (باران می‌بارد)
    note: یک فعل بی‌فاعل است؛ به فاعل نیاز ندارد، درست مثل *Este cald*.
    example_gloss:
    - فردا باران می‌بارد.
  ro.a1.unit19.lesson02.teach.vant_vocab:
    title: باد
    gloss: Vânt (باد)
    note: 'مثل *soare* با *este* می‌آید: *Este vânt*، یعنی «باد می‌آید».'
    example_gloss:
    - فردا باد می‌آید.
  ro.a1.unit19.lesson02.teach.frig_vocab:
    title: سرد
    gloss: Frig (سرد)
    note: 'با *este* می‌آید: *Este frig*، یعنی «هوا سرد است».'
    example_gloss:
    - فردا هوا سرد است.
  ro.a1.unit19.lesson02.teach.maine_ploua_phrase:
    title: فردا باران می‌بارد. باد می‌آید و هوا سرد است.
    gloss: Mâine plouă. Este vânt și este frig.
    note: همهٔ واژه‌های این‌جا قبلاً آمده‌اند یا همین حالا معرفی شده‌اند و یک پیش‌بینی کامل برای فردا ساخته‌اند.
  ro.a1.unit19.lesson02.teach.nu_mergem_phrase:
    title: فردا به پارک نمی‌رویم.
    gloss: Nu mergem la parc mâine. (فردا به پارک نمی‌رویم.)
    note: برنامه‌ای که بسته به هوا ساخته می‌شود و این درس به آن می‌رسد؛ *mergem* و *la parc* از واحد ۱۱ با *nu* در ابتدا.
  ro.a1.unit19.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'یادآوری: Bună، Ce mai faceți?، Bine, mulțumesc'
    gloss: Bună (سلام) · Ce mai faceți? (حال شما چطور است؟، رسمی) · Bine, mulțumesc (خوبم، ممنون)
    note: همه از احوال‌پرسی آغازین واحد ۱ هستند و برای شروع گفتگوی این واحد دوباره آمده‌اند.
  ro.a1.unit19.lesson03.teach.reminder_sambata_la_revedere:
    title: 'یادآوری: Sâmbătă، La revedere'
    gloss: Sâmbătă (شنبه) · La revedere (خداحافظ)
    note: '*Sâmbătă* از واحدهای ۳، ۱۱ و ۱۲ است؛ *la revedere* از واحد ۱ است. هر دو برای گفتگوی برنامهٔ آخر هفته دوباره آمده‌اند.'
  ro.a1.unit19.lesson03.teach.line01:
    title: به میهای سلام کنید و حالش را بپرسید
    gloss: آنا به میهای سلام می‌کند و حالش را می‌پرسد.
    note: از احوال‌پرسی *Ce mai faceți?* در واحد ۱ دوباره استفاده شده است.
  ro.a1.unit19.lesson03.teach.line02:
    title: جواب بدهید و دربارهٔ هوای فردا بپرسید
    gloss: میهای جواب می‌دهد و بعد از آنا می‌پرسد هوای فردا چطور است.
    note: '*Bine, mulțumesc* از واحد ۱ را با عبارت درس اول همین واحد، *Cum este vremea?*، و *mâine* ترکیب می‌کند.'
  ro.a1.unit19.lesson03.teach.line03:
    title: پیش‌بینی هوای فردا را بگویید
    gloss: آنا می‌گوید باران می‌بارد و باد می‌آید و هوا سرد است.
    note: دقیقاً از عبارت درس دوم همین واحد استفاده شده است.
  ro.a1.unit19.lesson03.teach.line04:
    title: پیشنهاد بدهید فردا به پارک نروید و به‌جایش شنبه بروید
    gloss: میهای می‌گوید فردا به پارک نمی‌روند و به‌جایش دربارهٔ شنبه می‌پرسد.
    note: عبارت درس دوم همین واحد را با *mergem* از واحد ۱۱ و *sâmbătă* از همین واحد ترکیب می‌کند.
  ro.a1.unit19.lesson03.teach.line05:
    title: موافقت کنید و بگویید شنبه هوا آفتابی است
    gloss: آنا می‌گوید شنبه هوا آفتابی است و با برنامه موافقت می‌کند.
    note: '*soare* را با عبارت موافقت *Da, bine!* از واحد ۱۱ ترکیب می‌کند.'
  ro.a1.unit19.lesson03.teach.line06:
    title: خداحافظی کنید
    gloss: میهای خداحافظی می‌کند.
    note: همان الگوی پایانی که گفتگوی هر واحد قبلی با آن تمام شده است.
  ro.a1.unit19.lesson03.teach.line07:
    title: خداحافظی کنید
    gloss: آنا خداحافظی می‌کند.
    note: همان الگوی پایانی که گفتگوی هر واحد قبلی با آن تمام شده است.
