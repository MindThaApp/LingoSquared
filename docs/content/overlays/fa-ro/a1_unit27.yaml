teaching:
  ro.a1.unit27.lesson01.teach.fericit_trist_suparat:
    title: خوشحال، ناراحت و عصبانی
    gloss: خوشحال، ناراحت، عصبانی
    note: 'سه کلمهٔ ساده برای احساسات که با *a fi* (بودن) می‌آیند. هرکدام شکل مؤنثی با *-ă* دارند: *fericită*، *tristă*، *supărată*.'
    example_gloss:
    - من خوشحالم.
    - غمگینم.
    - من عصبانی هستم.
  ro.a1.unit27.lesson01.teach.sunt_fericit:
    title: گفتن اینکه خوشحالید
    gloss: من خوشحالم.
    note: '*Sunt* (از *a fi*، بودن) + صفتِ احساس الگوی اصلی است، مثل «من ... هستم» در فارسی. یک زن می‌گوید *Sunt fericită*.'
  ro.a1.unit27.lesson01.teach.nu_sunt_suparat:
    title: مقایسه‌ی احساسات
    gloss: من عصبانی نیستم، ناراحتم.
    note: '*Nu* قبل از فعل آن را منفی می‌کند: *Nu sunt supărat*. جملهٔ دوم بعد از آن احساس واقعی را می‌گوید.'
  ro.a1.unit27.lesson02.teach.de_ce_esti:
    title: پرسیدن دلیل
    gloss: چرا خوشحالی؟
    note: '*De ce* (چرا) پرسش معمول برای پرسیدن دلیل است.'
  ro.a1.unit27.lesson02.teach.sunt_fericit_pentru:
    title: گفتن دلیل
    gloss: من خوشحالم چون آپارتمان جدیدی دارم.
    note: '*Pentru că* (چون) جملهٔ دلیل را شروع می‌کند؛ ترتیب کلمات عادی می‌ماند: *am un apartament nou*.'
  ro.a1.unit27.lesson02.teach.sunt_trist_pentru:
    title: یک دلیل منفی
    gloss: من ناراحتم چون دارد باران می‌آید.
    note: '*Plouă* (باران می‌آید) در رومانیایی فاعل جداگانه ندارد، برای همین به‌تنهایی می‌تواند جملهٔ دلیل باشد.'
  ro.a1.unit27.lesson03.teach.emotionat:
    title: مضطرب
    gloss: مضطرب
    note: کلمه‌ی معمول برای استرس و دلهره.
    example_gloss: از اولین شیفت کاری‌ام استرس دارم.
  ro.a1.unit27.lesson03.teach.sunt_emotionat_pentru:
    title: گفتن اینکه برای چه چیزی دلشوره دارید
    gloss: از اولین شیفت کاری‌ام استرس دارم.
    note: '*Pentru* (در اصل «برای») نشان می‌دهد هیجان دربارهٔ چیست؛ در فارسی معمولاً «برای» یا «دربارهٔ» می‌گوییم.'
  ro.a1.unit27.lesson03.teach.nu_ti_face:
    title: دلداری دادن به کسی
    gloss: نگران نباش.
    note: '*Nu-ți face griji* (در اصل «برای خودت نگرانی درست نکن») عبارت ثابت و معمول برای دلداری است. به غریبه می‌گویید: *Nu vă faceți griji*.'
  ro.a1.unit27.lesson04.teach.cum_se_simte:
    title: پرسیدن حال کسی
    gloss: میهای چه حسی دارد؟
    note: '*A se simți* (حس کردن) بازتابی است: *mă simt* (من)، *te simți* (تو)، *se simte* (او). راه معمول پرسیدن یا گفتن احساسات است.'
  ro.a1.unit27.lesson04.teach.el_se_simte:
    title: توصیف حال کسی
    gloss: او استرس دارد.
    note: '*Se* ضمیر بازتابی برای او (مرد یا زن) است و قبل از فعل می‌آید: *se simte*.'
  ro.a1.unit27.lesson04.teach.de_ce_se:
    title: پرسیدن دلیل حال کسی
    gloss: چرا استرس دارد؟
    note: '*De ce* را با الگوی *se simte* از جملهٔ *El se simte emoționat* ترکیب می‌کند.'
  ro.a1.unit27.lesson05.teach.salut_ana_sunt:
    title: خواندن یک پیام درباره‌ی احساسات
    gloss: سلام آنا، من برای اولین شیفتِ تنهایم کمی هیجان‌زده‌ام. ولی خوشحال هم هستم، چون هم کار جدید دارم و هم آپارتمان جدید. فکر می‌کنم همه‌چیز درست می‌شود.
    note: دقت کنید نویسنده برای چه چیزی دلشوره دارد، چه چیزی او را خوشحال می‌کند و دید کلی‌اش چیست.
    glosses:
      puțin: یک کم
      emoționat: عصبی
      prima: اولین
      tură: شیفت
      singur: تنها
      fericit: خوشحال
      fiindcă: چون
      nou: جدید
      serviciu: شغل
      apartament: آپارتمان
      cred: فکر کردن
      rezolvă: 'درست می‌شود (اینجا: همه‌چیز درست می‌شود)'
  ro.a1.unit27.lesson06.teach.ana_salut_mihai:
    title: آنا از میهای می‌پرسد چه حسی دارد
    gloss: 'آنا: سلام میهای، قبل از اولین شیفتت چه حسی داری؟'
    note: در *Cum te simți* ضمیر بازتابی *te* («خودت») آمده؛ در *prima ta tură* صفت ملکی *ta* با *tură* که مؤنث است جور می‌شود.
  ro.a1.unit27.lesson06.teach.mihai_sunt_putin:
    title: میهای اعتراف می‌کند هیجان‌زده است
    gloss: 'میهای: راستش کمی هیجان‌زده‌ام.'
    note: '*Sincer să fiu* (راستش را بخواهید) اعتراف را نرم‌تر می‌کند.'
  ro.a1.unit27.lesson06.teach.ana_nu_ti:
    title: آنا به او دلداری می‌دهد
    gloss: 'آنا: نگران نباش، خوب از پسش برمی‌آیی!'
    note: '*O să te descurci bine* (در اصل «خوب از پسش برمی‌آیی») عبارت ثابت تشویقی است؛ *o să* + فعل آینده می‌سازد.'
  ro.a1.unit27.lesson06.teach.mihai_multumesc_chiar:
    title: میهای از او تشکر می‌کند
    gloss: 'میهای: ممنون، واقعاً کمک می‌کند.'
    note: '*Ajută* شکل سوم‌شخص مفرد فعل *a ajuta* (کمک کردن) است؛ اینجا یعنی «کمک می‌کند».'
  ro.a1.unit27.lesson06.teach.ana_si_dupa:
    title: آنا نتیجه را پیش‌بینی می‌کند
    gloss: 'آنا: و بعدش حتماً خیلی خوشحال و سربلند می‌شوی.'
    note: '*Sigur* (حتماً) پیش‌بینی با اطمینان را نشان می‌دهد؛ *mândru* (سربلند، مغرور به‌معنای مثبت) صفت تازه و مفیدی است (برای زن *mândră*).'
  ro.a1.unit27.lesson06.teach.mihai_da_si:
    title: میهای موافقت می‌کند
    gloss: 'میهای: آره، من هم همین‌طور فکر می‌کنم.'
    note: '*Și eu cred asta* (در اصل «من هم این را باور دارم») راه طبیعی موافقت با نظر کسی است.'
  ro.a1.unit27.lesson06.teach.mihai_este_emotionat:
    title: جمع‌بندی با este، lui و îl
    gloss: میهای برای اولین شیفتش هیجان‌زده است. آنا کمکش می‌کند.
    note: '*Este* شکل سوم‌شخص مفرد *a fi* (بودن) است؛ *lui* بعد از اسم یعنی «او (مرد)ِ ...»، مثل «شیفتِ او»؛ *îl* یعنی «او را» و قبل از فعل می‌آید: *îl ajută*. سه کلمهٔ کوچک ولی ضروری برای صحبت دربارهٔ دیگران.'
