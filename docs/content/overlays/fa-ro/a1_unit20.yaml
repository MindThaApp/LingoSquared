teaching:
  ro.a1.unit20.lesson01.teach.reminder_vreau_un_ce:
    title: 'یادآوری: Vreau, Un, Ce'
    gloss: Vreau (می‌خواهم) · Un (یک، برای مذکر و خنثی) · Ce (چه / چی)
    note: '*Vreau* (می‌خواهم)، *un* (یک) و *ce* (چه، مثل *Ce mai faceți?*) کلمه‌هایی هستند که از قبل بلدید؛ این‌جا برای درخواست یک لباس دوباره به کار می‌روند.'
  ro.a1.unit20.lesson01.teach.tricou_vocab:
    title: تی‌شرت
    gloss: تی‌شرت
    note: اسمی خنثی است؛ مثل بقیهٔ اسم‌های مذکر و خنثی که قبلاً دیده‌اید، مثل *un leu*، با *un* می‌آید، نه *o*.
    example_gloss:
    - یک تی‌شرت می‌خواهم.
  ro.a1.unit20.lesson01.teach.culoare_vocab:
    title: رنگ
    gloss: رنگ
    note: اسمی مؤنث است و برای پرسیدن از رنگ‌های موجود یک چیز به کار می‌رود.
    example_gloss:
    - چه رنگی؟
  ro.a1.unit20.lesson01.teach.rosu_vocab:
    title: قرمز
    gloss: قرمز
    note: 'بعد از اسمی می‌آید که توصیفش می‌کند، که ترتیب عادی صفت در رومانیایی است: *tricou roșu*، یعنی تحت‌اللفظی «تی‌شرت قرمز».'
    example_gloss:
    - یک تی‌شرت قرمز می‌خواهم.
  ro.a1.unit20.lesson01.teach.albastru_vocab:
    title: آبی
    gloss: آبی
    note: 'الگوی *roșu* را دارد و بعد از اسم می‌آید: *tricou albastru*.'
    example_gloss:
    - یک تی‌شرت آبی می‌خواهم.
  ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase:
    title: یک تی‌شرت قرمز می‌خواهم.
    gloss: یک تی‌شرت قرمز می‌خواهم.
    note: 'جملهٔ اصلی درخواست: *vreau* (می‌خواهم) + *un tricou* (یک تی‌شرت) + *roșu* (قرمز)، با رنگ بعد از اسم.'
  ro.a1.unit20.lesson02.teach.reminder_cat_costa_va_rog:
    title: 'یادآوری: Cât, Costă, Vă, Rog'
    gloss: Cât costă? (قیمتش چند است؟) · Vă rog (لطفاً، رسمی)
    note: '*Cât costă?* را از درس بازار یاد گرفته‌اید؛ *vă rog* «لطفاً»ی رسمی است. این‌جا برای پرسیدن قیمت لباس و مؤدبانه‌تر کردن درخواست دوباره به کار می‌روند.'
  ro.a1.unit20.lesson02.teach.reminder_mic_mica_mare:
    title: 'یادآوری: Mic, Mică, Mare'
    gloss: Mic/Mică (کوچک، مذکر و خنثی / مؤنث) · Mare (بزرگ، در مفرد مذکر و مؤنث یک شکل دارد)
    note: کلمه‌های اندازه‌ای که از مقایسهٔ خوراکی و نوشیدنی می‌شناسید؛ این‌جا برای سایز لباس دوباره به کار می‌روند.
  ro.a1.unit20.lesson02.teach.pantaloni_vocab:
    title: شلوار
    gloss: شلوار
    note: در رومانیایی معمولاً به شکل جمع به کار می‌رود؛ *pantaloni* یعنی یک عدد شلوار. در فارسی هم «شلوار» مفرد است، ولی در رومانیایی شکلش جمع است.
    example_gloss:
    - شلوار می‌خواهم.
  ro.a1.unit20.lesson02.teach.marime_vocab:
    title: سایز
    gloss: سایز
    note: اسمی مؤنث است؛ با *mică* (کوچک) مؤنث که بالا یادآوری شد و *mare* (بزرگ) که تغییر نمی‌کند، می‌آید.
    example_gloss:
    - چه سایزی؟
  ro.a1.unit20.lesson02.teach.ce_marime_phrase:
    title: چه سایزی؟
    gloss: چه سایزی؟
    note: سؤال همیشگی پشت پیشخوان مغازه؛ کوتاه و بدون فعل، با همان ساختار *Ce culoare?* (چه رنگی؟).
  ro.a1.unit20.lesson02.teach.marime_mica_va_rog_phrase:
    title: سایز کوچک، لطفاً.
    gloss: سایز کوچک، لطفاً.
    note: '*Mică* شکل مؤنث *mic* است و با اسم مؤنث *mărime* مطابقت می‌کند؛ همراه *vă rog* که یادآوری شد، برای گفتن مؤدبانهٔ سایزتان به کار می‌رود.'
  ro.a1.unit20.lesson02.teach.cat_costa_pantalonii_phrase:
    title: شلوار چند است؟
    gloss: شلوار چند است؟
    note: '*Pantalonii* شکل معرفهٔ *pantaloni* است (یعنی «آن شلوار») -- اسم‌های جمع مذکر برای معرفه شدن *-i* می‌گیرند (*pantaloni* ← *pantalonii*). همراه *cât costă* که یادآوری شد.'
  ro.a1.unit20.lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si:
    title: 'یادآوری: Bună, Mulțumesc, Bine, La revedere, Și'
    gloss: Bună (سلام) · Mulțumesc (ممنون) · Bine (خوب) · La revedere (خداحافظ) · Și (و)
    note: احوال‌پرسی‌های روزمره به‌اضافهٔ *și* (و)؛ این‌جا برای شروع و پایان گفت‌وگوی مغازه دوباره به کار می‌روند.
  ro.a1.unit20.lesson03.teach.reminder_zece_douazeci_de_lei:
    title: 'یادآوری: Zece, Douăzeci, De, Lei'
    gloss: Zece (ده) · Douăzeci (بیست) · De (حرف ربط قبل از lei از بیست به بالا) · Lei (واحد پول، جمع leu)
    note: عددها و واحد پول *leu/lei* را از قبل می‌شناسید؛ این‌جا برای قیمت تی‌شرت و شلوار دوباره به کار می‌روند.
  ro.a1.unit20.lesson03.teach.line01:
    title: به میهای سلام کنید و یک تی‌شرت قرمز بخواهید
    gloss: آنا به میهای سلام می‌کند و می‌گوید یک تی‌شرت قرمز می‌خواهد.
    note: 'جملهٔ درخواست از درس اول: *Vreau un tricou roșu.*'
  ro.a1.unit20.lesson03.teach.line02:
    title: بپرسید چه سایزی
    gloss: میهای می‌پرسد چه سایزی می‌خواهد.
    note: 'سؤال روزمرهٔ مغازه: *Ce mărime?* (چه سایزی؟).'
  ro.a1.unit20.lesson03.teach.line03:
    title: سایز را مؤدبانه بگویید و قیمت را بپرسید
    gloss: آنا سایز کوچک می‌خواهد، بعد می‌پرسد قیمتش چند است.
    note: '*Mărime mică, vă rog* (سایز کوچک، لطفاً)، بعد *Cât costă?* (قیمتش چند است؟).'
  ro.a1.unit20.lesson03.teach.line04:
    title: قیمت را بگویید
    gloss: میهای می‌گوید پنجاه لی است.
    note: از *cincizeci de lei* که یادآوری شد استفاده می‌کند.
  ro.a1.unit20.lesson03.teach.line05:
    title: موافقت کنید و دربارهٔ شلوار هم بپرسید
    gloss: آنا موافقت می‌کند، بعد می‌گوید شلوار هم می‌خواهد و قیمتش را می‌پرسد.
    note: '*Și* این‌جا یعنی «هم، همچنین»: *Vreau și pantaloni* -- «شلوار هم می‌خواهم.»'
  ro.a1.unit20.lesson03.teach.line06:
    title: قیمت شلوار را بگویید
    gloss: میهای می‌گوید شلوار صد و بیست لی است.
    note: 'از بیست به بالا، رومانیایی بین عدد و اسم *de* می‌گذارد: *o sută douăzeci de lei*.'
  ro.a1.unit20.lesson03.teach.line07:
    title: از میهای تشکر کنید و خداحافظی کنید
    gloss: آنا تشکر می‌کند و خداحافظی می‌کند.
    note: تشکر و خداحافظی مؤدبانه.
  ro.a1.unit20.lesson03.teach.line08:
    title: خداحافظی کنید
    gloss: میهای خداحافظی می‌کند.
    note: یک خداحافظی ساده، همراه با نام آنا.
