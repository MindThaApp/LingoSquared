    correct_option: tu
    distractors:
    - dumneavoastră
    accepted_answers:
    - tu
    feedback: Salut و tu با هم یک ترکیب خودمانی و هماهنگ می‌سازند.
  ro.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: پرسش محترمانهٔ حال‌پرسی را مرتب کنید.
    correct_response:
    - Ce
    - mai
    - faceți
  ro.a1.unit01.lesson01.exercise06.match_register:
    instruction: هر احوال‌پرسی را با لحنی که معمولاً در سطح مبتدی دارد جفت کنید.
    correct_response:
      Bună ziua: dumneavoastră
      Salut: تو
    pairs:
    - left: Bună ziua
      right: dumneavoastră
    - left: Salut
      right: تو
  ro.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: احوال‌پرسی را برای یک بزرگسال ناآشنا کامل کنید.
    accepted_answers:
    - dumneavoastră
    feedback: Dumneavoastră انتخاب مطمئن و محترمانه برای یک بزرگسال ناآشناست.
  ro.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: پرسش صمیمی‌ای را که می‌شنوید تایپ کنید.
    accepted_answers:
    - Ce mai faci?
    - Ce mai faci
  ro.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: خداحافظی معمولی و بی‌طرف را کامل کنید.
    accepted_answers:
    - revedere
  ro.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: محترمانه سلام کنید، حال طرف را بپرسید و گفت‌وگو را تمام کنید.
    accepted_answers:
    - Bună ziua. Ce mai faceți? La revedere.
    - Bună ziua, ce mai faceți? La revedere.
  ro.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: گوش دهید و پرسش محترمانهٔ اسم را انتخاب کنید.
    correct_option: Cum vă numiți?
    distractors:
    - Cum te cheamă?
    - Ce mai faceți?
    accepted_answers:
    - Cum vă numiți?
    - Cum va numiti?
  ro.a1.unit01.lesson02.exercise05.choose_reply_meaning:
    instruction: جواب Mihai چه معنایی دارد؟
    correct_option: از آشنایی با شما خوشحالم!
    distractors:
    - خداحافظ!
    - حالتان چطور است؟
    accepted_answers:
    - از آشنایی با شما خوشحالم!
  ro.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: جمله‌ی معرفی Ana را بسازید.
    correct_response:
    - Mă
    - numesc
    - Ana
  ro.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: هر سؤالِ مربوط به اسم را با جواب مناسبش جفت کنید.
    correct_response:
      Cum vă numiți?: Mă numesc Ana.
      Cum te cheamă?: Mă cheamă Mihai.
    pairs:
    - left: Cum vă numiți?
      right: Mă numesc Ana.
    - left: Cum te cheamă?
      right: Mă cheamă Mihai.
  ro.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: بعد از سلام خودمانی، اسم طرف مقابل را بپرسید.
    accepted_answers:
    - Cum te cheamă?
    - Cum te cheama?
  ro.a1.unit01.lesson02.exercise04.complete_ma_cheama:
    instruction: عبارتی را کامل کنید که اسم Mihai را می‌گوید.
    accepted_answers:
    - Mă
  ro.a1.unit01.lesson02.exercise06.return_polite_question:
    instruction: پرسش را برگردانید، بدون اینکه لحن محترمانه را عوض کنید.
    accepted_answers:
    - Și dumneavoastră?
    - Si dumneavoastra?
  ro.a1.unit01.lesson02.exercise08.write_introduction:
    instruction: 'شما Ana هستید. بنویسید: با Bună سلام کنید، با mă numesc اسمتان را بگویید، بعد بگویید «از آشنایی خوشحالم».'
    accepted_answers:
    - Bună. Mă numesc Ana. Îmi pare bine.
    - Buna. Ma numesc Ana. Imi pare bine.
  ro.a1.unit01.lesson03.exercise01.role_selection:
    instruction: در گفت‌وگو، کدام گوینده اسمش را با این عبارت می‌گوید؟
    correct_option: Ana
    distractors:
    - Mihai
    - هیچ‌کدام
    accepted_answers:
    - Ana
  ro.a1.unit01.lesson03.exercise02.comprehend_register:
    instruction: Ana و Mihai برای خطاب به هم از کدام ضمیر استفاده می‌کنند؟
    correct_option: dumneavoastră
    distractors:
    - tu
    - te
    accepted_answers:
    - dumneavoastră
  ro.a1.unit01.lesson03.exercise03.comprehend_names:
    instruction: کدام گوینده mă numesc به کار می‌برد و کدام mă cheamă؟
    correct_option: Ana uses mă numesc; Mihai uses mă cheamă.
    distractors:
    - Mihai uses mă numesc; Ana uses mă cheamă.
    - هر دو گوینده mă numesc به کار می‌برند.
    accepted_answers:
    - Ana uses mă numesc; Mihai uses mă cheamă.
    - Ana; Mihai
  ro.a1.unit01.lesson03.exercise05.order_closing:
    instruction: جواب پایانی و خداحافظی را بسازید.
    correct_response:
    - Bine,
    - mulțumesc.
    - La
    - revedere!
  ro.a1.unit01.lesson03.exercise04.role_response:
    instruction: جای Ana باشید. مؤدبانه جواب بدهید و سؤال را برگردانید.
    accepted_answers:
    - Bine, mulțumesc. Și dumneavoastră?
    - Bine, multumesc. Si dumneavoastra?
  ro.a1.unit01.lesson03.exercise06.speak_role:
    instruction: جای Ana باشید. رسمی به Mihai سلام کنید، اسمتان را بگویید، به حرفش جواب بدهید و گفت‌وگو را تمام کنید.
    accepted_answers:
    - Bună ziua. Mă numesc Ana. Îmi pare bine! La revedere!
    - Buna ziua. Ma numesc Ana. Imi pare bine! La revedere!
    - Bună ziua. Mă numesc Ana. Și mie îmi pare bine! La revedere!
  ro.a1.unit01.lesson01.exercise09.dictation_buna:
    instruction: چیزی را که می‌شنوید تایپ کنید.
    correct_option: Bună
    accepted_answers:
