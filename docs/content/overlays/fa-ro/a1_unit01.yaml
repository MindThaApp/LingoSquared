answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: رومانیایی در فارسی A1
  description: 'آموزش احوال‌پرسی‌های استاندارد رومانیایی و معرفی خود در اولین دیدار. تمرکز درس روی مهم‌ترین نکته‌ی این مرحله است: تفاوت tu (صمیمی) و dumneavoastră (محترمانه)، و دو روش رایج برای گفتن اسم (mă numesc... / mă cheamă...).'
units:
  ro.a1.unit01.greetings:
    title: سلام و اولین دیدار
lessons:
  ro.a1.unit01.lesson01.tu_dumneavoastra_greetings:
    title: 'احوال‌پرسی: tu و dumneavoastră'
  ro.a1.unit01.lesson02.names_introductions:
    title: اسم شما چیست؟
  ro.a1.unit01.lesson03.street_meeting:
    title: یک دیدار در خیابان
teaching:
  ro.a1.unit01.lesson01.teach.buna:
    title: احوال‌پرسی روزمره
    gloss: سلام
    note: Bună سلام روزمره و نیمه‌صمیمی است؛ با دوستان، هم‌سن‌وسال‌ها و در بیشتر برخوردهای معمولی روز، انتخاب بی‌خطری است.
    example_gloss: سلام، Mihai!
  ro.a1.unit01.lesson01.teach.salut:
    title: سلام صمیمی
    gloss: سلام؛ خداحافظ
    note: Salut صمیمی است و بین دوستان و هم‌سن‌وسال‌ها به کار می‌رود. هم برای شروع و هم برای پایان صحبت می‌شود از آن استفاده کرد، اما برای یک بزرگسال ناآشنا انتخاب مطمئنی نیست.
    example_gloss: سلام، Ana!
  ro.a1.unit01.lesson01.teach.buna_ziua:
    title: سلام رسمی
    gloss: روز بخیر؛ سلام (رسمی)
    note: Bună ziua سلام مؤدبانه و مطمئن برای یک بزرگسال ناآشنا، یک فروشنده یا هر کسی است که با dumneavoastră خطابش می‌کنید. معنی تحت‌اللفظی‌اش «روز خوب» است، ولی به‌عنوان سلام مؤدبانه‌ی عمومی به کار می‌رود، نه فقط نزدیک ظهر.
    example_gloss: روز بخیر، Ana!
  ro.a1.unit01.lesson01.teach.la_revedere:
    title: خداحافظی معمولی
    gloss: خداحافظ
    note: La revedere هم در موقعیت‌های رسمی و هم در موقعیت‌های صمیمی کاربرد دارد.
    example_gloss: روز بخیر! خداحافظ!
  ro.a1.unit01.lesson01.teach.tu:
    title: «تو» (مفرد صمیمی)
    gloss: تو (غیررسمی، مفرد)
    note: در فارسی هم مثل رومانیایی دو شکل خطاب داریم، «تو» و «شما». tu برای یک دوست، یک کودک یا کسی است که رابطه‌تان با او صمیمی است، و فعل مخصوص خودش را می‌گیرد (faci، نه faceți).
  ro.a1.unit01.lesson01.teach.dumneavoastra:
    title: «شما» (محترمانه یا جمع)
    gloss: شما (مفرد محترمانه یا جمع)
    note: Dumneavoastră انتخاب مطمئن برای یک بزرگسال ناآشناست و برای گروهی که مؤدبانه خطابشان می‌کنید هم به کار می‌رود؛ تقریباً همان نقش «شما» در فارسی را دارد. این واژه از domnia voastră (جناب‌عالی) آمده و فعل جمع می‌گیرد (faceți، numiți)، حتی وقتی فقط با یک نفر صحبت می‌کنید.
  ro.a1.unit01.lesson01.teach.ce_mai_faceti:
    title: پرسیدن حال به شکل رسمی
    gloss: حال شما چطوره؟
    note: Faceți شکل dumneavoastră فعل a face (انجام دادن/ساختن) است. این یک سؤال قراردادی و مؤدبانه است، نه پرسیدنِ واقعی از اینکه طرف مقابل چه کار می‌کند.
  ro.a1.unit01.lesson01.teach.ce_mai_faci:
    title: پرسیدن حال به شکل صمیمی
    gloss: حال شما چطوره؟
    note: Faci شکل tu فعل a face است. بین نسخه‌ی مؤدبانه و صمیمیِ این سؤال فقط پایانه‌ی فعل عوض می‌شود؛ ce mai در هر دو یکی است.
  ro.a1.unit01.lesson01.teach.bine_multumesc:
    title: پاسخ مثبت استاندارد
    gloss: خوبم، ممنون.
    note: Bine, mulțumesc جواب ce mai faci/faceți است، چه رسمی و چه صمیمی؛ خود جواب تغییر نمی‌کند.
    example_gloss: حالتان چطور است؟ خوبم، ممنون.
  ro.a1.unit01.lesson01.teach.register_choice:
    title: جور کردن سلام با نوع رابطه
    gloss: Bună ziua با dumneavoastră؛ Salut با tu
    note: این‌ها پیش‌فرض‌های مفیدند، نه قانون مطلق. Bună ziua می‌تواند شروع گفت‌وگوی رسمی هم باشد که بعد با dumneavoastră ادامه پیدا می‌کند؛ ولی به کار بردن Salut همراه با dumneavoastră معمولاً پیام‌های اجتماعی متناقضی می‌دهد.
  ro.a1.unit01.lesson02.teach.ma_numesc:
    title: گفتن اسم (استاندارد)
    gloss: اسم من Ana است.
    note: Mă numesc در اصل یعنی «خودم را می‌نامم»؛ روشی خنثی که همه‌جا جواب می‌دهد برای گفتن اسم، و از نظر لحن شبیه «اسم من ... است» در فارسی است.
    example_gloss: سلام! اسم من Ana است.
  ro.a1.unit01.lesson02.teach.cum_va_numiti:
    title: پرسیدن اسم به شکل مؤدبانه
    gloss: اسم شما چیه؟
    note: Numiți شکل dumneavoastră فعل a se numi (نامیده شدن) است. Vă ضمیر انعکاسی هماهنگ با dumneavoastră است و اینجا لازم است؛ در فارسی چنین ضمیری در این جمله نداریم.
  ro.a1.unit01.lesson02.teach.ma_cheama:
    title: گفتن اسم (محاوره‌ای)
    gloss: اسمم Mihai است.
    note: Mă cheamă روش محاوره‌ای‌تر برای گفتن اسم است و در اصل یعنی «مرا صدا می‌زنند». Mă numesc و mă cheamă هر دو درست و رایج‌اند؛ mă cheamă کمی غیررسمی‌تر است.
    example_gloss: سلام! اسمم Mihai است.
  ro.a1.unit01.lesson02.teach.cum_te_cheama:
    title: پرسیدن اسم به شکل صمیمی
    gloss: اسمت چیه؟
    note: Te ضمیر انعکاسی هماهنگ با tu است. دوستان و هم‌سن‌وسال‌ها در روزمره این‌طور اسم هم را می‌پرسند.
  ro.a1.unit01.lesson02.teach.imi_pare_bine:
    title: آشنایی با کسی
    gloss: از آشنایی با شما خوشحالم!
    note: Îmi pare bine در اصل یعنی «به نظرم خوب می‌آید»؛ یک عبارت ثابت اصطلاحی است و ترجمه‌ی کلمه‌به‌کلمه نیست. شکلش با جنسیت گوینده تغییر نمی‌کند.
    example_gloss: اسمم Mihai است. از آشنایی با شما خوشحالم!
  ro.a1.unit01.lesson02.teach.si_mie_imi_pare_bine:
    title: جواب دادن به همان احساس
    gloss: من هم از آشنایی با شما خوشحالم!
    note: Și mie یعنی «من هم / همین‌طور» و به اول همان عبارت ثابتی اضافه می‌شود که گفت‌وگو با آن شروع شده بود.
  ro.a1.unit01.lesson02.teach.si_dumneavoastra:
    title: پرسش را مؤدبانه برگرداندن
    gloss: شما چطور؟
    note: برای حفظ لحن مؤدبانه یا خطاب به یک گروه، dumneavoastră را به کار ببرید.
  ro.a1.unit01.lesson02.teach.si_tu:
    title: پرسش را صمیمی برگرداندن
    gloss: شما چطور؟
    note: وقتی صمیمی با یک دوست یا هم‌سن‌وسال صحبت می‌کنید، بعد از și از tu استفاده کنید.
  ro.a1.unit01.lesson03.teach.line01:
    title: شروع دیدار
    gloss: Ana رسمی به Mihai سلام می‌کند و اسمش را می‌گوید.
    note: Ana با bună ziua مؤدبانه شروع می‌کند که برای آشنایی با کسی که نمی‌شناسد مناسب است.
  ro.a1.unit01.lesson03.teach.line02:
    title: شروع دیدار، پاسخ
    gloss: Mihai همین احساس را برمی‌گرداند، اسمش را می‌گوید و حال او را می‌پرسد.
    note: Mihai همان لحن مؤدبانه‌ای را که Ana شروع کرده نگه می‌دارد؛ او ce mai faceți می‌پرسد، نه ce mai faci.
  ro.a1.unit01.lesson03.teach.line03:
    title: جواب دادن و برگرداندن سؤال
    gloss: Ana می‌گوید خوب است و همین سؤال را مؤدبانه از Mihai می‌پرسد.
    note: Și dumneavoastră گفت‌وگو را رسمی نگه می‌دارد، همان‌طور که شروع شده بود.
  ro.a1.unit01.lesson03.teach.line04:
    title: جواب دادن و تمام کردن
    gloss: Mihai می‌گوید او هم خوب است و خداحافظی می‌کند.
    note: La revedere خداحافظی خنثی است و چه گفت‌وگو رسمی باشد چه صمیمی، مناسب است.
  ro.a1.unit01.lesson03.teach.line05:
    title: تمام کردن دیدار
    gloss: Ana همان خداحافظی را تکرار می‌کند.
    note: تکرار la revedere راه طبیعی برای تأیید پایان دوستانه‌ی گفت‌وگوست.
exercises:
