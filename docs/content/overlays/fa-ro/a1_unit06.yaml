  ro.a1.unit06.lesson03.la_cafenea:
    title: در کافه
teaching:
  ro.a1.unit06.lesson01.teach.reminder_un_o_si:
    title: 'یادآوری: un، o، și'
    gloss: un/o (یک) · și (و)
    note: هر سه تا قبلاً در درس‌های قبل آمده‌اند (*și* در واحد ۱، *o* در واحد ۲، *un* در واحد ۴)؛ اینجا دوباره برای صحبت دربارهٔ غذا و نوشیدنی برمی‌گردند.
  ro.a1.unit06.lesson01.teach.as_dori:
    title: 'می‌خواستم ... '
    gloss: Aș dori ... (... می‌خواستم / ... لطفاً)
    note: روش مؤدبانهٔ همیشگی برای سفارش دادن در رومانیایی؛ یک شکل ثابت شرطی که با کلمهٔ بعدش تغییر نمی‌کند.
  ro.a1.unit06.lesson01.teach.apa:
    title: آب
    gloss: apă (آب)
    note: اسم مؤنث است و وقتی مقدارش مشخص نیست، بدون حرف تعریف می‌آید؛ در فارسی هم می‌گوییم «آب می‌خواهم» و نشانهٔ یک‌ای لازم نیست.
    example_gloss: آب می‌خواستم.
  ro.a1.unit06.lesson01.teach.cafea:
    title: قهوه
    gloss: cafea (قهوه)
    note: مؤنث است و مثل بقیهٔ اسم‌های مؤنث با *o* (یک) به کار می‌رود.
    example_gloss: یک قهوه می‌خواستم.
  ro.a1.unit06.lesson01.teach.ceai:
    title: چای
    gloss: ceai (چای)
    note: با *un* (یک) می‌آید، نه *o*؛ ceai اسم مذکر یا خنثی است.
    example_gloss: یک چای می‌خواستم.
  ro.a1.unit06.lesson01.teach.suc:
    title: آبمیوه
    gloss: suc (آبمیوه)
    note: این هم با *un* می‌آید، درست مثل ceai.
    example_gloss: یک آبمیوه می‌خواستم.
  ro.a1.unit06.lesson01.teach.lapte:
    title: شیر
    gloss: lapte (شیر)
    note: مثل apă، وقتی مقدارش مشخص نیست معمولاً بدون حرف تعریف گفته می‌شود.
    example_gloss: شیر می‌خواستم.
  ro.a1.unit06.lesson01.teach.mi_e_sete:
    title: تشنه‌ام است
    gloss: Mi-e sete (تشنه‌ام است)
    note: یک عبارت ثابت؛ تحت‌اللفظی یعنی «تشنگی برای من است»، نه «من تشنه هستم».
  ro.a1.unit06.lesson01.teach.as_dori_o_cafea:
    title: یک قهوه می‌خواهم
    gloss: یک قهوه می‌خواهم.
    note: عبارت سفارش و یک اسم نوشیدنی مؤنث را در یک جملهٔ کامل کنار هم می‌گذارد.
  ro.a1.unit06.lesson02.teach.reminder_multumesc_bine_da_nu:
    title: 'یادآوری: mulțumesc، bine، da، nu'
    gloss: mulțumesc (ممنون) · bine (خوب) · da (بله) · nu (نه)
    note: '*Mulțumesc* و *bine* اول بار در احوال‌پرسی‌های واحد ۱ آمدند و *da* و *nu* در واحد ۳ و ۵؛ اینجا دوباره دربارهٔ غذا و ادب برمی‌گردند.'
  ro.a1.unit06.lesson02.teach.mi_e_foame:
    title: گرسنه‌ام است
    gloss: Mi-e foame (گرسنه‌ام است)
    note: همان الگوی ثابت *Mi-e sete* است، فقط به جای sete (تشنگی) کلمهٔ foame (گرسنگی) آمده.
  ro.a1.unit06.lesson02.teach.paine:
    title: نان
    gloss: pâine (نان)
    note: معمولاً بدون حرف تعریف گفته می‌شود، مثل فارسی که می‌گوییم «نان می‌خواهم».
    example_gloss: گرسنه‌ام است. نان می‌خواستم.
  ro.a1.unit06.lesson02.teach.mancare:
    title: غذا
    gloss: mâncare (غذا)
    note: کلمهٔ کلی برای «غذا»، نه یک خوراک مشخص.
    example_gloss: غذا می‌خواستم.
  ro.a1.unit06.lesson02.teach.carne:
    title: گوشت
    gloss: carne (گوشت)
    note: کلمهٔ کلی برای «گوشت»؛ برای نوع مشخص (carne de vită، carne de porc) نوع بعد از آن می‌آید.
    example_gloss: گوشت می‌خواستم.
  ro.a1.unit06.lesson02.teach.pui:
    title: مرغ
    gloss: pui (مرغ)
    note: کلمهٔ مخصوص مرغ (به‌عنوان غذا)، جدا از carne که کلی است.
    example_gloss: مرغ می‌خواستم.
  ro.a1.unit06.lesson02.teach.fructe:
    title: میوه
    gloss: fructe (میوه)
    note: شکل جمع رایج که برای میوه به‌طور کلی به کار می‌رود؛ در فارسی «میوه» مفرد است ولی در رومانیایی جمع می‌آید.
    example_gloss: میوه می‌خواستم.
  ro.a1.unit06.lesson02.teach.va_rog:
    title: لطفاً (رسمی)
    gloss: vă rog (لطفاً، رسمی)
    note: روش مؤدبانه و رسمی برای گفتن «لطفاً»؛ با شکل رسمی dumneavoastră که در واحدهای ۱ و ۲ آمد هماهنگ است.
    example_gloss: یک قهوه، لطفاً.
  ro.a1.unit06.lesson02.teach.te_rog:
    title: لطفاً (دوستانه)
    gloss: te rog (لطفاً، دوستانه)
    note: شکل روزمره که با دوستان و کسانی که با *tu* خطابشان می‌کنید به کار می‌رود؛ با شکل tu در واحد ۱ هماهنگ است.
    example_gloss: یک چای، لطفاً.
  ro.a1.unit06.lesson03.teach.reminder_buna_ziua_bine_la_revedere:
    title: 'یادآوری: bună، ziua، bine، la revedere، Ana، Mihai'
    gloss: bună ziua (روز بخیر / سلام) · bine (خوب) · la revedere (خداحافظ) · Ana، Mihai (نام‌ها)
    note: همه در گفت‌وگوهای واحد ۱ و ۵ آمده‌اند؛ اینجا آنا و میهای دوباره همدیگر را می‌بینند، این بار در یک کافه.
  ro.a1.unit06.lesson03.teach.line01:
    title: سلام و گفتن اینکه گرسنه‌اید
    gloss: آنا به میهای سلام می‌کند و می‌گوید گرسنه‌اش است.
    note: عبارت *Mi-e foame* همین واحد درست در سلام به کار رفته است.
  ro.a1.unit06.lesson03.teach.line02:
    title: سفارش غذا
    gloss: میهای می‌گوید نان و مرغ می‌خواهد.
    note: واژه‌های pâine و pui همین واحد دوباره با عبارت Aș dori به کار رفته‌اند.
  ro.a1.unit06.lesson03.teach.line03:
    title: سفارش مؤدبانهٔ نوشیدنی
    gloss: آنا می‌گوید یک قهوه می‌خواهد، لطفاً.
    note: Aș dori و cafea و vă rog را کنار هم می‌آورد؛ سه چیزی که در این واحد جدا جدا یاد گرفتید.
  ro.a1.unit06.lesson03.teach.line04:
    title: سفارش نوشیدنی هم
    gloss: میهای می‌گوید یک چای می‌خواهد، لطفاً.
    note: همان الگوی جملهٔ آناست، فقط به جای cafea کلمهٔ ceai آمده.
  ro.a1.unit06.lesson03.teach.line05:
    title: تشکر و پایان گفت‌وگو
    gloss: آنا از میهای تشکر می‌کند و خداحافظی می‌کند.
    note: '*Mulțumesc* اینجا یک تشکر ساده برای پایان صحبت است، همان کلمه‌ای که در *Bine, mulțumesc.* واحد ۱ بود.'
  ro.a1.unit06.lesson03.teach.line06:
    title: پایان دیدار
    gloss: میهای هم خداحافظی می‌کند و نام آنا را می‌آورد.
    note: همان الگوی دوستانهٔ پایان که گفت‌وگوهای واحد ۱ و ۵ هر دو با آن تمام شدند.
