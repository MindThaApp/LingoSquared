answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: This unit's new "Ai frați?"/"Aveți frați?" and "Câți copii ai?"/"Câți copii aveți?" pairs are register-sensitive (tu vs. dumneavoastră, parallel to unit02's ai/aveți age questions) -- accept either register unless an exercise explicitly names one. Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: رومانیایی در فارسی A1
  description: صحبت درباره‌ی خانواده به رومانیایی — والدین، خواهر و برادر، فرزندان و وضعیت تأهل — با جفت واژه‌ی ملکی meu/mea و همان تفاوت پرسش‌های tu/dumneavoastră در پرسش‌های سن درس ۲ — ادامه‌ی ماجرای Ana و Mihai که با خانواده‌ی هم آشنا می‌شوند.
units:
  ro.a1.unit05.family:
    title: خانواده
lessons:
  ro.a1.unit05.lesson01.familia_mea:
    title: خانوادهٔ من
  ro.a1.unit05.lesson02.frati_si_copii:
    title: خواهر و برادر و فرزندان
  ro.a1.unit05.lesson03.o_discutie_despre_familie:
    title: گفتگو درباره‌ی خانواده
teaching:
  ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare:
    title: 'یادآوری: am, un, o, și, mare'
    gloss: دارم · یک · و · بزرگ
    note: هر پنج واژه قبلاً در درس‌های پیشین آمده‌اند (*și* در درس ۱، *am* و *o* در درس ۲، *mare* در نکته‌ی «حرف بزرگ» درس ۳ و *un* در درس ۴) — اینجا برای صحبت درباره‌ی خانواده برمی‌گردند.
  ro.a1.unit05.lesson01.teach.familie:
    title: خانواده
    gloss: خانواده
    note: اسمی مؤنث است — با *o* و صفتی مثل *mare* می‌شود «یک خانواده‌ی بزرگ».
    example_gloss: من یک خانواده‌ی بزرگ دارم.
  ro.a1.unit05.lesson01.teach.mama:
    title: مادر
    gloss: مادر
    note: شکل ساده‌ی فرهنگ لغتی برای «مادر» — چند کارت جلوتر می‌بینید «مادر من» را چطور می‌گویند.
    example_gloss: Mihai یک مادر و یک پدر دارد.
  ro.a1.unit05.lesson01.teach.tata:
    title: پدر
    gloss: پدر
    note: شکل ساده‌ی فرهنگ لغتی برای «پدر».
    example_gloss: پدر من معلم است.
  ro.a1.unit05.lesson01.teach.parintii:
    title: پدر و مادر
    gloss: پدر و مادر
    note: هر دو والد را با هم می‌گیرد، درست مثل «پدر و مادر» یا «والدین» در فارسی.
    example_gloss: پدر و مادر من در رومانی زندگی می‌کنند.
  ro.a1.unit05.lesson01.teach.meu_mea:
    title: '«من/مال من»: meu یا mea'
    gloss: مال من (مذکر) / مال من (مؤنث)
    note: واژه‌ی «مال من» در رومانیایی با جنسیت چیزِ مورد مالکیت هماهنگ می‌شود، نه با جنسیت گوینده — *meu* با اسم مذکر مثل *tată* و *mea* با اسم مؤنث مثل *mamă*.
  ro.a1.unit05.lesson01.teach.mama_mea:
    title: مادرم
    gloss: مادرم
    note: Mamă پیش از آمدن mea می‌شود mama (نشانه‌ی شناسایی می‌گیرد) — «مادر من» را واقعاً با همین شکل ترکیبی می‌گویند، نه با ترجمه‌ی کلمه‌به‌کلمه.
  ro.a1.unit05.lesson01.teach.tatal_meu:
    title: پدر من
    gloss: پدرم
    note: Tată پیش از آمدن meu می‌شود tatăl (نشانه‌ی شناسایی با -l، به‌صورت بی‌قاعده، چون tată از پیش به -ă ختم می‌شود).
  ro.a1.unit05.lesson01.teach.mama_si_tatal:
    title: مادر من و پدر من
    gloss: مادر من و پدر من.
    note: هر دو شکل ملکی را در یک جمله کنار هم می‌گذارد، هر کدام با هماهنگی جنسیت درست خودش.
  ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu:
    title: 'یادآوری: câți, ai, aveți, doi, nu'
    gloss: چند تا · داری/دارید (صمیمی/رسمی) · دو · نه/نیست
    note: '*Câți*، *ai* و *aveți* اولین بار در درس ۲ برای پرسیدن سن آمدند («Câți ani ai?»)؛ اینجا درباره‌ی خواهر و برادر و فرزندان می‌پرسند. *Doi* از اعداد درس ۲ و *nu* از درس ۳ است.'
  ro.a1.unit05.lesson02.teach.da:
    title: بله
    gloss: بله
    note: واژه‌ی روزمره برای «بله»، که جفت *nu* («نه») از درس ۳ است.
    example_gloss: بله، من یک برادر دارم.
  ro.a1.unit05.lesson02.teach.frate_sora:
    title: برادر، خواهر
    gloss: برادر / خواهر
    note: اسم‌های مذکر و مؤنث برای خواهر و برادر — مثل هر اسم دیگری با un/o به کار می‌روند.
    example_gloss:
    - من یک برادر دارم.
    - من یک خواهر دارم.
  ro.a1.unit05.lesson02.teach.frati_surori:
    title: برادرها، خواهرها
    gloss: برادرها / خواهرها
    note: شکل‌های جمع که برای پرسیدن کلی درباره‌ی خواهر و برادر به کار می‌روند — رومانیایی‌ها معمولاً می‌پرسند «Ai frați?» (یعنی «برادر داری؟») و منظورشان «خواهر یا برادر داری؟» است، و اغلب بعدش جداگانه می‌پرسند «Surori?» تا درباره‌ی خواهرها هم مطمئن شوند.
    example_gloss: برادر یا خواهر دارید؟
  ro.a1.unit05.lesson02.teach.ai_frati:
    title: خواهر یا برادر داری؟ (صمیمی)
    gloss: برادر داری؟
    note: شکل روزمره و صمیمی پرسیدن — جفت ضمیر *tu* از درس ۱ است.
  ro.a1.unit05.lesson02.teach.aveti_frati:
    title: خواهر یا برادر دارید؟ (رسمی)
    gloss: برادر دارید؟
    note: شکل مؤدبانه، با همان *aveți* که در پرسش سن درس ۲ بود.
  ro.a1.unit05.lesson02.teach.copil_copii:
    title: فرزند، فرزندان
    gloss: بچه / بچه‌ها
    note: جمع copil از جمع‌های دشوارتر رومانیایی است — copii، نه پایان منظم -i یا -e — و بهتر است مثل یک شکل جداگانه حفظ شود.
    example_gloss: من دو بچه دارم.
  ro.a1.unit05.lesson02.teach.fiu_fiica:
    title: پسر، دختر
    gloss: پسر / دختر
    note: واژه‌های اختصاصی برای پسر و دختر، جدا از واژه‌ی کلی copil/copii.
    example_gloss:
    - من یک پسر دارم.
    - من یک دختر دارم.
  ro.a1.unit05.lesson02.teach.cati_copii_ai:
    title: چند تا بچه دارید؟
    gloss: چند تا بچه داری؟
    note: Câți (چند تا) + copii (بچه‌ها) + ai (داری) — هر سه از قبل آشنا هستند.
  ro.a1.unit05.lesson02.teach.casatorit:
    title: متأهل
    gloss: متأهل
    note: پرسشی رایج درباره‌ی اطلاعات شخصی در گفتگوهای روزمره، درست مثل پرسیدن سن.
    example_gloss: متأهلی؟
  ro.a1.unit05.lesson03.teach.reminder_bine_la_revedere:
    title: 'یادآوری: bine, la revedere, Ana, Mihai'
    gloss: خوب · خداحافظ · Ana، Mihai (نام‌ها)
    note: واژه‌هایی را که در درس‌های قبل یاد گرفته‌اید مرور می‌کند و در گفتگوی این درس دوباره به کار می‌روند.
  ro.a1.unit05.lesson03.teach.line01:
    title: پرسیدن دربارهٔ خواهر و برادر
    gloss: Ana از Mihai می‌پرسد که خواهر یا برادر دارد یا نه.
    note: از *aveți* مؤدبانه استفاده می‌کند، مطابق با لحنی که از قبل بین این دو برقرار شده است.
  ro.a1.unit05.lesson03.teach.line02:
    title: جواب دادن و پرسیدن
    gloss: Mihai می‌گوید یک برادر و یک خواهر دارد و می‌پرسد Ana بچه دارد یا نه.
    note: واژه‌های frate/soră و copii همین درس را در یک گفتگو دوباره به کار می‌برد.
  ro.a1.unit05.lesson03.teach.line03:
    title: جواب دادن و پرسش را برگرداندن
    gloss: Ana می‌گوید یک دختر دارد و همان پرسش را از Mihai می‌پرسد.
    note: '*Și dumneavoastră?* («و شما؟») همان الگوی پرسش برگشتی در معرفی‌های درس ۱ است.'
  ro.a1.unit05.lesson03.teach.line04:
    title: جواب
    gloss: Mihai می‌گوید یک پسر دارد.
    note: جوابی کوتاه و مستقیم با واژه‌ی fiu همین درس.
  ro.a1.unit05.lesson03.teach.line05:
    title: واکنش و پایان گفتگو
    gloss: Ana واکنش مثبت نشان می‌دهد و خداحافظی می‌کند.
    note: '*Bine!* اینجا واکنشی مثبت و کوتاه است، همان واژه‌ی *Bine, mulțumesc.* در درس ۱.'
  ro.a1.unit05.lesson03.teach.line06:
    title: تمام کردن دیدار
    gloss: Mihai هم با گفتن نام Ana خداحافظی می‌کند.
    note: همان الگوی دوستانه‌ی پایان گفتگو که گفتگوهای درس ۱ و درس ۴ هم با آن تمام شدند.
