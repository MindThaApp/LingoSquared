teaching:
  ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau:
    title: 'یادآوری: mă, vă, ce, sau'
    gloss: mă (مرا / من) · vă (شما، رسمی) · ce (چه / چی) · sau (یا)
    note: Mă از واحد 1 و واحد 10 آمده است (mă numesc, mă trezesc)؛ vă از واحد 1، 6، 7 و 13 (vă rog)؛ ce از واحد 1، 3، 4 و 15؛ sau از واحد 13 -- این واحد هر چهار کلمه را برای کاربردی تازه، یعنی گفتن اینکه چه چیزی درد می‌کند، دوباره به کار می‌برد.
  ro.a1.unit16.lesson01.teach.doare_vocab:
    title: درد می‌کند
    gloss: درد می‌کند
    note: 'فعلی غیرشخصی است -- رومانیایی می‌گوید «مرا درد می‌کند» (*mă doare*). *Mă doare* به‌تنهایی یعنی «درد می‌کند»؛ برای گفتن اینکه کجا درد می‌کند، نام عضو بدن را اضافه کنید: *Mă doare capul*.'
    example_gloss:
    - درد می‌کند.
  ro.a1.unit16.lesson01.teach.cap_vocab:
    title: سر
    gloss: سر
    note: اسم خنثی است و به همخوان ختم می‌شود -- برای «سر» (با حرف تعریف) پایان *-ul* می‌گیرد، مثل *tren*->*trenul* و *peron*->*peronul*.
    example_gloss:
    - سرم درد می‌کنه.
  ro.a1.unit16.lesson01.teach.ce_va_doare_phrase:
    title: چی دردت می‌کنه؟
    gloss: چه چیزتان درد می‌کند؟
    note: '*Ce* (چه) + *vă* (شما، مفعول رسمی) + *doare* -- همهٔ این کلمه‌ها قبلاً آموخته شده یا همین حالا معرفی شده‌اند و حالا در یک پرسش تازه کنار هم آمده‌اند.'
  ro.a1.unit16.lesson01.teach.stomac_vocab:
    title: شکم
    gloss: معده
    note: اسم خنثی است و به همخوان ختم می‌شود، پس «معده» (با حرف تعریف) می‌شود *stomacul* -- همان پایان *-ul* مثل *cap*->*capul*.
    example_gloss:
    - شکمم درد می‌کند.
  ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase:
    title: سرتان درد می‌کند یا معده‌تان؟
    gloss: سرتان درد می‌کند یا معده‌تان؟
    note: آوردن *vă* (شما، رسمی) به‌جای *mă* جمله را به پرسشی دربارهٔ طرف مقابل تبدیل می‌کند؛ *sau* (یا، از واحد 13) دو عضو بدنی را که تازه یاد گرفتید به هم وصل می‌کند.
  ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de:
    title: 'یادآوری: nu, bine, am, un, de'
    gloss: نه · خوب · دارم · یک (مذکر/خنثی) · از
    note: Nu/bine از واحد 1، 6 و 11؛ am از واحد 2، 5 و 15؛ un/de از واحد 6، 7 و 15 آمده‌اند -- این واحد هر پنج کلمه را برای گفتن اینکه حالتان خوب نیست و به دکتر احتیاج دارید دوباره به کار می‌برد.
  ro.a1.unit16.lesson02.teach.ma_simt_vocab:
    title: احساس می‌کنم
    gloss: احساس می‌کنم
    note: فعلی بازتابی است، تحت‌اللفظی «خودم را حس می‌کنم» -- همان الگوی *mă* + فعل در *mă trezesc*/*mă culc* از واحد 10.
    example_gloss:
    - حالم خوب است.
  ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase:
    title: حالم خوب نیست
    gloss: حالم خوب نیست.
    note: '*Nu* جملهٔ *mă simt bine* را منفی می‌کند -- راه طبیعی برای گفتن اینکه مشکلی هست، بی‌آنکه هنوز نشانهٔ مشخصی را نام ببرید.'
  ro.a1.unit16.lesson02.teach.bolnav_vocab:
    title: بیمار
    gloss: بیمار (مذکر)
    note: شکل مذکر صفت است، همان‌طور که Mihai می‌گوید (*Sunt bolnav*). یک زن می‌گوید *Sunt bolnavă* (شکل مؤنث).
    example_gloss:
    - من بیمارم.
  ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase:
    title: به دکتر احتیاج دارم
    gloss: به دکتر احتیاج دارم.
    note: '*Am nevoie de* (احتیاج دارم، تحت‌اللفظی «نیاز دارم به») + *un doctor* -- عبارتی ثابت که برای درخواست کمک در هر موردی به کار می‌رود، نه فقط برای دکتر.'
  ro.a1.unit16.lesson02.teach.doctor_vocab:
    title: Doctor
    gloss: دکتر
    note: مذکر است، پس «یک دکتر» می‌شود *un doctor*.
    example_gloss:
    - به دکتر احتیاج دارم.
  ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da:
    title: 'یادآوری: Ce mai faceți?, Aveți, Da'
    gloss: حال شما چطور است؟ (رسمی) · دارید (رسمی) · بله
    note: Ce mai faceți از واحد 1، Aveți از واحد 5 و Da از واحد 6 و 11 آمده است -- همه برای گفتگوی احوال‌پرسی این واحد دوباره به کار رفته‌اند.
  ro.a1.unit16.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'یادآوری: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: سلام · ممنونم · خداحافظ · نام‌ها
    note: همه در واحدهای قبلی آمده‌اند -- همان الگوی دوستانهٔ شروع و پایان که هر گفتگوی این دوره داشته است.
  ro.a1.unit16.lesson03.teach.reminder_spitalul_vizavi_magazin:
    title: 'یادآوری: Spitalul este vizavi de magazin'
    gloss: بیمارستان روبه‌روی مغازه است.
    note: مستقیم از واحد 8 دوباره آمده است -- جای بیمارستان عوض نشده و یادداشت خواندنی همین واحد هم به آن برمی‌گردد.
  ro.a1.unit16.lesson03.teach.odihna_vocab:
    title: استراحت
    gloss: استراحت
    note: اسم مؤنث است -- چیزی که وقتی حالتان خوب نیست، دکتر (یا یک دوست) توصیه می‌کند.
    example_gloss:
    - شما باید استراحت کنید.
  ro.a1.unit16.lesson03.teach.multa_apa_vocab:
    title: آب فراوان
    gloss: آب زیاد
    note: '*Multă* (زیاد، مؤنث) با اسم مؤنث *apă* (آب، از واحد 6) هماهنگ است -- ترکیبی ثابت، از آن چیزهایی که یک دکتر ممکن است توصیه کند.'
    example_gloss:
    - استراحت و آب زیاد.
  ro.a1.unit16.lesson03.teach.line01:
    title: سلام و احوال‌پرسی
    gloss: Ana به Mihai سلام می‌کند و حالش را می‌پرسد.
    note: همان احوال‌پرسی *Ce mai faceți?* واحد 1 را دوباره به کار می‌برد.
  ro.a1.unit16.lesson03.teach.line02:
    title: بگویید حالتان خوب نیست
    gloss: Mihai می‌گوید حالش خوب نیست و سرش درد می‌کند.
    note: عبارت درس دوم و عبارت درس اول همین واحد را کنار هم می‌گذارد.
  ro.a1.unit16.lesson03.teach.line03:
    title: بپرسید به دکتر احتیاج دارد یا نه
    gloss: Ana می‌پرسد که به دکتر احتیاج دارد یا نه.
    note: عبارت درس دوم همین واحد را به‌صورت پرسش و با *aveți* از واحد 5 به کار می‌برد.
  ro.a1.unit16.lesson03.teach.line04:
    title: بگویید بیمارید و به دکتر احتیاج دارید
    gloss: Mihai می‌گوید بله، بیمار است و به دکتر احتیاج دارد.
    note: '*sunt bolnav* و *am nevoie de un doctor* همین واحد را کنار هم می‌گذارد.'
  ro.a1.unit16.lesson03.teach.line05:
    title: توصیه کنید و خداحافظی کنید
    gloss: Ana به او می‌گوید استراحت کند و آب زیاد بخورد و خداحافظی می‌کند.
    note: '*Odihnă și multă apă* همین درس را به کار می‌برد -- توصیه‌ای دربارهٔ سلامت، به‌جای خداحافظی ساده‌ای که معمولاً در این دوره می‌آید.'
  ro.a1.unit16.lesson03.teach.line06:
    title: تشکر کنید و خداحافظی کنید
    gloss: Mihai از Ana تشکر می‌کند و خداحافظی می‌کند.
    note: همان الگوی پایانی که گفتگوی هر واحد قبلی با آن تمام شده است.
