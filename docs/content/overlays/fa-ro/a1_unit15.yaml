answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (tren, pleacă, bilet, peron, București, Drum bun) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing formal register with each other; no new tu/dumneavoastră form is introduced this unit.
course:
  title: رومانیایی در فارسی A1
  description: انجام یک سفر ساده با قطار به رومانیایی -- Tren (قطار)، Bilet (بلیت)، Peron (سکو) و Pleacă (حرکت می‌کند) -- وقتی میهای سوار قطار بخارست می‌شود و آنا او را در ایستگاه بدرقه می‌کند.
units:
  ro.a1.unit15.travel:
    title: سفر
lessons:
  ro.a1.unit15.lesson01.trenul_pleaca:
    title: قطار حرکت می‌کند
  ro.a1.unit15.lesson02.un_bilet_va_rog:
    title: یک بلیت، لطفاً
  ro.a1.unit15.lesson03.la_gara:
    title: در ایستگاه قطار
teaching:
  ro.a1.unit15.lesson01.teach.reminder_gara_ora:
    title: 'یادآوری: gară, este, la, ce, oră, ora, nouă'
    gloss: gară (ایستگاه قطار) · este (است) · la (در/به) · ce (چه) · oră (ساعت) · ora (ساعتِ مشخص) · nouă (نه)
    note: 'Gară از واحد ۸ و ۹ است؛ este/la/ce/oră/ora/nouă از واحد ۴ (ساعت) هستند. اینجا الگوی "la ce oră" و "la ora nouă" واحد ۴ برای هدف تازه‌ای به کار می‌رود: پرسیدن دربارهٔ قطار به‌جای کلاس.'
  ro.a1.unit15.lesson01.teach.tren_vocab:
    title: قطار
    gloss: Tren (قطار)
    note: 'خنثی است و به صامت ختم می‌شود (در مفرد، اسم‌های خنثی مثل مذکر رفتار می‌کنند: *un tren*). برای «قطارِ مشخص» پسوند *-ul* می‌گیرد، مثل *magazin*->*magazinul*؛ اما اسم‌های ختم به *-ă* مثل *gară* به‌جای آن *-a* می‌گیرند (*gara*).'
    example_gloss:
    - قطار در ایستگاه است.
  ro.a1.unit15.lesson01.teach.pleaca_vocab:
    title: حرکت می‌کند / راه می‌افتد
    gloss: Pleacă (حرکت می‌کند / می‌رود، سوم شخص مفرد)
    note: فعلی برای حرکت قطار، اتوبوس یا هواپیما. می‌گوییم *Trenul pleacă* و نیازی به *este* نیست، چون *pleacă* خودش یک فعل کامل است.
    example_gloss:
    - قطار حرکت می‌کند.
  ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase:
    title: قطار ساعت نه حرکت می‌کند
    gloss: Trenul pleacă la ora nouă. (قطار ساعت نه حرکت می‌کند.)
    note: '*trenul* + *pleacă* را با *la ora nouă* از درس چهارم ترکیب می‌کند؛ لازم نیست واژهٔ تازه‌ای دربارهٔ ساعت یاد بگیرید.'
  ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase:
    title: قطار ساعت چند حرکت می‌کند؟
    gloss: La ce oră pleacă trenul? (قطار چه ساعتی حرکت می‌کند؟)
    note: همان الگوی پرسشی *La ce oră...?* از درس چهارم است، این بار دربارهٔ *trenul* به‌جای یک کلاس.
  ro.a1.unit15.lesson01.teach.peron_vocab:
    title: سکو
    gloss: Peron (سکو)
    note: سکوی ایستگاه قطار. در رومانیایی اسم خنثی است و به صامت ختم می‌شود، پس «سکو» با پایانهٔ *-ul* می‌شود *peronul*؛ مثل *tren* که *trenul* می‌شود.
    example_gloss:
    - قطار کنار سکوی سه است.
  ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase:
    title: قطار از کدام سکو حرکت می‌کند؟
    gloss: De la ce peron pleacă trenul? (قطار از کدام سکو حرکت می‌کند؟)
    note: '*De la* (از) + *ce peron* (کدام سکو)؛ همهٔ واژه‌های این جمله را قبلاً یاد گرفته‌اید و فقط در یک پرسش تازه کنار هم آمده‌اند.'
  ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa:
    title: 'یادآوری: aș dori, vă rog, cât costă, costă, lei'
    gloss: aș dori (می‌خواستم / مایلم) · vă rog (لطفاً، رسمی) · cât costă (قیمتش چقدر است) · costă (قیمتش … است) · lei (لِی، واحد پول)
    note: همه از درس ششم (غذا) و درس هفتم (خرید) هستند؛ این درس همین عبارت‌های درخواست مؤدبانه و قیمت را این بار برای خرید بلیت قطار به کار می‌برد، نه غذا.
  ro.a1.unit15.lesson02.teach.bilet_vocab:
    title: بلیت
    gloss: Bilet (بلیت)
    note: بلیت قطار. اسم خنثی است (در مفرد مثل اسم مذکر با *un* می‌آید)، پس «یک بلیت» می‌شود *un bilet*.
    example_gloss:
    - من بلیت دارم.
  ro.a1.unit15.lesson02.teach.bucuresti_vocab:
    title: بخارست
    gloss: București (بخارست)
    note: پایتخت رومانی؛ مقصد طبیعی برای مثال‌های این دوره.
    example_gloss:
    - قطار به مقصد بخارست حرکت می‌کند.
  ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase:
    title: لطفاً یک بلیت به بخارست می‌خواستم
    gloss: Aș dori un bilet la București, vă rog. (لطفاً یک بلیت به بخارست می‌خواستم.)
    note: الگوی مؤدبانهٔ *Aș dori... vă rog* از درس ششم و هفتم، این بار برای درخواست بلیت به‌جای غذا.
  ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase:
    title: یک بلیت به بخارست چند است؟
    gloss: Cât costă un bilet la București? (یک بلیت به بخارست چند است؟)
    note: همان پرسش قیمت *Cât costă...?* از درس هفتم، این بار دربارهٔ بلیت به‌جای یک کیلو سیب‌زمینی.
  ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase:
    title: چهل لِی می‌شود
    gloss: Costă patruzeci de lei. (چهل لِی می‌شود.)
    note: Zece (ده) در محدودهٔ ۲ تا ۱۹ است، پس قبل از *lei* به *de* نیازی نیست؛ همان قاعده‌ای که در درس هفتم گفته شد.
  ro.a1.unit15.lesson03.teach.reminder_travel_words:
    title: 'یادآوری: tren, pleacă, peron, bilet, București, trei, am'
    gloss: tren (قطار) · pleacă (حرکت می‌کند) · peron (سکو) · bilet (بلیت) · București (بخارست) · trei (سه، از درس دوم) · am (دارم، از درس دوم)
    note: tren، pleacă، peron، bilet و București از دو درس اول همین واحد هستند؛ trei و am از درس دوم (اعداد) دوباره آورده شده‌اند، چون Ana و Mihai حالا در ایستگاه «peronul trei» و «am un bilet» را با هم به کار می‌برند.
  ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'یادآوری: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (سلام) · mulțumesc (متشکرم) · la revedere (خداحافظ) · Ana, Mihai (اسم‌ها)
    note: همه در درس‌های قبل آمده‌اند؛ همان الگوی گرم آغاز و پایان که همهٔ گفت‌وگوهای این دوره داشته‌اند.
  ro.a1.unit15.lesson03.teach.drum_bun_vocab:
    title: سفر به‌خیر
    gloss: Drum bun (سفر به‌خیر / به سلامت)
    note: عبارتی ثابت برای خداحافظی با کسی که می‌خواهد سفر کند. تحت‌اللفظی یعنی «راه خوب»، ولی کاربردش مثل «سفر به‌خیر» یا «به سلامت» در فارسی است.
    example_gloss:
    - سفر به‌خیر، Mihai!
  ro.a1.unit15.lesson03.teach.line01:
    title: سلام و پرسیدن دربارهٔ قطار
    gloss: Ana به Mihai سلام می‌کند و می‌پرسد قطار چه ساعتی حرکت می‌کند.
    note: همان پرسش درس اول همین واحد است، این بار مستقیم از Mihai پرسیده می‌شود.
  ro.a1.unit15.lesson03.teach.line02:
    title: گفتن ساعت حرکت
    gloss: Mihai می‌گوید قطار ساعت نه حرکت می‌کند.
    note: دقیقاً همان جملهٔ درس اول همین واحد.
  ro.a1.unit15.lesson03.teach.line03:
    title: پرسیدن دربارهٔ سکو
    gloss: Ana می‌پرسد از کدام سکو.
    note: یک پرسش کوتاه برای ادامهٔ گفت‌وگو؛ *de la ce peron* در درس اول کامل پرسیده شد و اینجا Ana کوتاه می‌پرسد و انتظار دارد Mihai بقیه را بگوید.
  ro.a1.unit15.lesson03.teach.line04:
    title: گفتن سکو و بلیت
    gloss: Mihai می‌گوید سکوی سه، و اینکه بلیت بخارست دارد.
    note: واژه‌های peron و bilet/București همین واحد را در یک پاسخ کنار هم می‌آورد.
  ro.a1.unit15.lesson03.teach.line05:
    title: آرزوی سفر به‌خیر و خداحافظی
    gloss: Ana برای Mihai سفر به‌خیر آرزو می‌کند و خداحافظی می‌کند.
    note: '*Drum bun* از همین درس است؛ خداحافظیِ مخصوص سفر، به‌جای *la revedere* تنها که همیشه در این دوره می‌آمد.'
  ro.a1.unit15.lesson03.teach.line06:
    title: تشکر و خداحافظی
    gloss: Mihai از Ana تشکر می‌کند و خداحافظی می‌کند.
    note: همان الگوی پایانی که گفت‌وگوهای همهٔ درس‌های قبل با آن تمام می‌شدند.
