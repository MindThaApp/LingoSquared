teaching:
  ro.a1.unit30.lesson01.teach.a_citi_a:
    title: مطالعه، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل رایج سرگرمی: *a citi* (خواندن)، *a face sport* (ورزش کردن) و *a găti* (آشپزی کردن). شکل مصدری فعل‌های رومانیایی با *a* شروع می‌شود.'
    example_gloss:
    - دوست دارم کتاب بخونم.
    - شنبه‌ها ورزش می‌کنم.
    - دوست دارم برای دوستام آشپزی کنم.
  ro.a1.unit30.lesson01.teach.timpul_liber:
    title: اوقات فراغت
    gloss: اوقات فراغت
    note: '*Timpul liber* (اوقات فراغت) از اسم مذکر *timp* ساخته شده که artikol به آن چسبیده است. این عبارت کلیدی صحبت دربارهٔ سرگرمی‌هاست.'
    example_gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
  ro.a1.unit30.lesson01.teach.in_timpul_liber:
    title: گفتن اینکه در اوقات فراغتتان چه کار می‌کنید
    gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
    note: '*Citesc* صورت *eu* فعل *a citi* (خواندن) است؛ بعد از *îmi place să* فعل همین شکل را نگه می‌دارد.'
  ro.a1.unit30.lesson02.teach.a_asculta_muzica:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه سرگرمی دیگر: *a asculta muzică* (گوش دادن به موسیقی)، *a desena* (نقاشی کشیدن) و *a juca jocuri video* (بازی ویدیویی کردن).'
    example_gloss:
    - دوست دارم به موسیقی گوش بدم.
    - من اغلب نقاشی می‌کشم.
    - دوست دارم با دوستام بازی ویدیویی کنم.
  ro.a1.unit30.lesson02.teach.imi_place_sa:
    title: گفتن اینکه دوست دارید به موسیقی گوش بدید
    gloss: دوست دارم به موسیقی گوش بدم.
    note: '*Îmi place să ascult muzică*: *îmi place* («برایم خوشایند است») + *să* + فعل، راه معمول گفتن این است که کاری را دوست دارید.'
  ro.a1.unit30.lesson02.teach.imi_place_sa_2:
    title: گفتن اینکه دوست دارید با دوستانتان بازی ویدیویی کنید
    gloss: دوست دارم با دوستام بازی ویدیویی کنم.
    note: '*Cu prietenii* یعنی «با دوستان»: *cu* («با») حرف اضافه است و *prietenii* جمع معرفه است.'
  ro.a1.unit30.lesson03.teach.mereu_des_uneori:
    title: همیشه، اغلب، گاهی، هرگز
    gloss: همیشه، اغلب، گاهی، هرگز
    note: 'چهار قید بسامد اصلی: *mereu*، *des*، *uneori* و *niciodată*. معمولاً بعد از فعل می‌آیند: *Citesc des*.'
    example_gloss:
    - من شنبه‌ها همیشه ورزش می‌کنم.
    - من اغلب کتاب می‌خونم.
    - من گاهی نقاشی می‌کشم.
    - من هرگز بازی ویدیویی نمی‌کنم.
  ro.a1.unit30.lesson03.teach.in_fiecare_saptamana:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*În fiecare săptămână* و *în fiecare weekend* هر دو یعنی «هر ...»؛ *fiecare* هیچ‌وقت تغییر نمی‌کند، کارت بعدی را ببینید.'
    example_gloss:
    - من هر هفته برای دوستام آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  ro.a1.unit30.lesson03.teach.cuvantul_fiecare_nu:
    title: Fiecare تغییر نمی‌کند
    gloss: 'کلمهٔ fiecare تغییر نمی‌کند: în fiecare săptămână (هر هفته)، în fiecare weekend (هر آخر هفته).'
    note: '*Fiecare* پیش از *săptămână* و *weekend* و هر اسم دیگری ثابت می‌ماند، پس چیزی برای انتخاب کردن نیست.'
  ro.a1.unit30.lesson03.teach.ce_faci_in:
    title: پرسیدن دربارهٔ اوقات فراغت
    gloss: توی وقت آزادت چی کار می‌کنی؟
    note: این سؤال اصلی این درس است؛ با آن می‌توانید از هر کسی دربارهٔ سرگرمی‌هاش بپرسید.
  ro.a1.unit30.lesson04.teach.ana_ne_plimbam:
    title: Ana بحث سرگرمی‌ها را پیش می‌کشد
    gloss: 'Ana: ما اغلب با هم قدم می‌زنیم. ولی تو در اوقات فراغتت دیگر چه کار می‌کنی، Mihai؟'
    note: '*Ne plimbăm* («قدم می‌زنیم») صورت *noi* فعل بازتابی *a se plimba* است؛ به قدم‌زدن‌هایی اشاره دارد که هر دو دوست دوست دارند.'
  ro.a1.unit30.lesson04.teach.mihai_imi_place:
    title: سرگرمی‌های Mihai
    gloss: 'Mihai: من آشپزی را دوست دارم، در خانه هم. و زیاد ورزش می‌کنم.'
    note: '*Și acasă* (در خانه هم) روشن می‌کند که Mihai برای تفریح آشپزی می‌کند، نه فقط در کارش در رستوران.'
  ro.a1.unit30.lesson04.teach.ana_gatesti_si:
    title: Ana تعجب می‌کند
    gloss: 'Ana: در خانه هم آشپزی می‌کنی؟ تو که همهٔ روز را سر کار آشپزی می‌کنی!'
    note: '*Toată ziua* (تمام روز) تأکید می‌کند که Mihai سر کار هم خیلی آشپزی می‌کند؛ *deja* یعنی «از قبل، همین حالا هم».'
  ro.a1.unit30.lesson04.teach.mihai_da_dar:
    title: Mihai توضیح می‌دهد
    gloss: 'Mihai: آره، ولی به نظرم آشپزی آرامش‌بخش است. تو چی، دوست داری چه کار کنی؟'
    note: '*Gătitul mi se pare relaxant* تحت‌اللفظی یعنی «آشپزی به نظرم آرامش‌بخش می‌آید»: *mi se pare* راه رایجی برای بیان نظر است.'
  ro.a1.unit30.lesson04.teach.ana_imi_place:
    title: سرگرمی‌های Ana
    gloss: 'Ana: من دوست دارم کتاب بخوانم و اغلب موسیقی گوش می‌دهم.'
    note: دو فعل سرگرمی از درس‌های ۱ و ۲ را با *și* (و) در یک جمله ترکیب می‌کند.
  ro.a1.unit30.lesson04.teach.mihai_joci_si:
    title: Mihai دربارهٔ بازی ویدیویی می‌پرسد
    gloss: 'Mihai: تو هم بازی ویدیویی می‌کنی؟'
    note: یک پرسش کوتاه بله/خیر با *jocuri video* از درس ۲؛ *joci* صورت *tu* فعل *a juca* است.
  ro.a1.unit30.lesson04.teach.ana_nu_nu:
    title: Ana جواب می‌دهد
    gloss: 'Ana: نه، من هیچ‌وقت بازی ویدیویی نمی‌کنم. ولی گاهی نقاشی می‌کشم!'
    note: '*Niciodată* (هرگز) و *uneori* (گاهی) از درس ۳ در یک جواب کنار هم آمده‌اند؛ *nu ... niciodată* نفی مضاعف است.'
  ro.a1.unit30.lesson05.teach.mihai_si_cu:
    title: مقایسهٔ سرگرمی‌ها
    gloss: من و Mihai اغلب با هم قدم می‌زنیم. ولی علاقه‌های دیگری هم داریم. Mihai آشپزی را دوست دارد، در خانه هم، و زیاد ورزش می‌کند. من کتاب خواندن را دوست دارم و اغلب موسیقی گوش می‌دهم. گاهی نقاشی می‌کشم، ولی هیچ‌وقت بازی ویدیویی نمی‌کنم. تو در اوقات فراغتت دوست داری چه کار کنی؟
    note: پیام Ana مطالب درس‌های قبل را مرور می‌کند و با پرسش اصلی این واحد از خواننده تمام می‌شود.
    glosses:
      plimbăm: قدم می‌زنیم
      des: اغلب
      împreună: با هم
      alte: دیگر
      gătească: آشپزی می‌کند
      place: دوست دارد
      acasă: توی خانه
      sport: ورزش می‌کند
      citesc: بخوانم
      ascult: گوش می‌دهم
      muzică: موسیقی
      desenez: نقاشی می‌کشم
      uneori: گاهی
      joc: بازی ویدیویی می‌کنم
      niciodată: هرگز
      liber: آزاد
      timpul: وقت
  ro.a1.unit30.lesson06.teach.mihai_ce_faci:
    title: Mihai دربارهٔ آخر هفته می‌پرسد
    gloss: 'Mihai: این آخر هفته چه کار می‌کنی؟'
    note: '*În acest weekend* (این آخر هفته) برای «این» از *acest* استفاده می‌کند.'
  ro.a1.unit30.lesson06.teach.ana_inca_nu:
    title: Ana هنوز تصمیم نگرفته
    gloss: 'Ana: هنوز نمی‌دانم. دوست دارم کتاب بخوانم، ولی دلم می‌خواهد بیرون هم بروم.'
    note: '*Să ies afară* (بیرون رفتن) راه رایجی برای گفتن این است که می‌خواهید از خانه بیرون بروید؛ *vreau să* + فعل یعنی «می‌خواهم ...».'
  ro.a1.unit30.lesson06.teach.mihai_hai_sa:
    title: Mihai برنامه پیشنهاد می‌دهد
    gloss: 'Mihai: بیا با هم قدم بزنیم! بعدش من برای ما آشپزی می‌کنم.'
    note: '*După aceea* (بعد از آن) عبارتی برای ترتیب کارهاست؛ *Hai să* + فعل یعنی پیشنهاد انجام کاری با هم.'
  ro.a1.unit30.lesson06.teach.ana_buna_idee:
    title: Ana موافقت می‌کند
    gloss: 'Ana: فکر خوبی است! هم قدم زدن را دوست دارم، هم آشپزی را.'
    note: '*Și ..., și ...* («هم ... هم ...») نشان می‌دهد Ana دو کار را به یک اندازه دوست دارد، نه یکی را بیشتر.'
  ro.a1.unit30.lesson06.teach.mihai_perfect_atunci:
    title: Mihai قرار را تأیید می‌کند
    gloss: 'Mihai: عالی. پس شنبه می‌بینمت!'
    note: جملهٔ دوستانهٔ پایانی که قرار *sâmbătă* (شنبه) را تأیید می‌کند؛ *ne vedem* یعنی «همدیگر را می‌بینیم».
