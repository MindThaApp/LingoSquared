course:
  title: رومانیایی در فارسی A1
  description: 'رومانیایی مقدماتی برای صحبت دربارهٔ فعالیت‌های اوقات فراغت: واژگان سرگرمی‌ها، عبارت‌های بسامد، پرسیدن و جواب دادن دربارهٔ این‌که کسی در اوقات فراغتش چه می‌کند، و مقایسهٔ سرگرمی‌های دو نفر.'
