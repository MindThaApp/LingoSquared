answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Day and month names are correctly lowercase in standard Romanian writing (except sentence-initially); accept a learner's answer regardless of the case they happen to type it in -- this unit teaches the lowercase convention as a fact to recognize, not a hard-graded spelling rule.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: رومانیایی در فارسی A1
  description: روزهای هفته، ماه‌های سال و طرز گفتن تاریخ در رومانیایی (یک عدد اصلی ساده + نام ماه، به‌جز روز اول که کلمهٔ ویژهٔ întâi را دارد) -- در ادامهٔ ماجرای Ana و Mihai که جلسهٔ بعدی‌شان را برنامه‌ریزی می‌کنند.
units:
  ro.a1.unit03.dates:
    title: روزها و تاریخ‌ها
lessons:
  ro.a1.unit03.lesson01.zilele_saptamanii:
    title: روزهای هفته
  ro.a1.unit03.lesson02.lunile_si_datele:
    title: ماه‌های سال و طرز گفتن تاریخ
  ro.a1.unit03.lesson03.cand_ne_intalnim:
    title: کی دوباره همدیگر را می‌بینیم؟
teaching:
  ro.a1.unit03.lesson01.teach.este:
    title: 'یادآوری: este'
    gloss: است
    note: '*Este* قبلاً در درس ۲ آمده بود (*Care este numărul...?*). تغییر نمی‌کند -- چه فاعل روز باشد، چه تاریخ، چه چیز دیگر، همین است و بین tu و dumneavoastră هم فرقی نمی‌کند.'
  ro.a1.unit03.lesson01.teach.astazi_maine:
    title: امروز، فردا
    gloss: astăzi (امروز) / mâine (فردا)
    note: هر دو قید زمان‌اند، تغییر نمی‌کنند و اول جمله می‌آیند تا بگویند چه روز یا چه تاریخی است.
    example_gloss:
    - امروز دوشنبه است.
    - فردا سه‌شنبه است.
  ro.a1.unit03.lesson01.teach.luni_marti:
    title: دوشنبه، سه‌شنبه
    gloss: luni (دوشنبه) / marți (سه‌شنبه)
    note: برای گفتن نام روز (Astăzi este luni) از همین شکل ساده استفاده کنید. نام روزها شکل با حرف تعریف هم دارند -- lunea، marțea -- که یعنی «دوشنبه‌ها»، «سه‌شنبه‌ها»؛ بعداً با آن‌ها آشنا می‌شوید.
    example_gloss:
    - امروز دوشنبه است.
    - فردا سه‌شنبه است.
  ro.a1.unit03.lesson01.teach.miercuri_joi:
    title: چهارشنبه، پنجشنبه
    gloss: miercuri (چهارشنبه) / joi (پنجشنبه)
    note: مثل luni و marți، miercuri و joi هم در مفرد و جمع یک شکل دارند.
    example_gloss:
    - امروز چهارشنبه است.
    - فردا پنجشنبه است.
  ro.a1.unit03.lesson01.teach.vineri_sambata:
    title: جمعه، شنبه
    gloss: vineri (جمعه) / sâmbătă (شنبه)
    note: در املای امروزی، sâmbătă حرف â را وسط کلمه نگه می‌دارد، برخلاف املای قدیمی‌تر sîmbătă.
    example_gloss:
    - امروز جمعه است.
    - فردا شنبه است.
  ro.a1.unit03.lesson01.teach.duminica:
    title: یکشنبه
    gloss: یکشنبه
    note: Duminică هفته را کامل می‌کند. برای گفتن اینکه چه روزی است از همین شکل ساده استفاده کنید؛ شکل duminica یعنی «یکشنبه‌ها».
    example_gloss: امروز یکشنبه است.
  ro.a1.unit03.lesson01.teach.ce_zi_e_azi:
    title: پرسیدن اینکه چه روزی است
    gloss: امروز چه روزی است؟
    note: روش رایج برای پرسیدن اینکه چه روزی از هفته است -- zi (روز) کلمهٔ تازه است، کنار ce، este و astăzi که از قبل می‌شناسید.
  ro.a1.unit03.lesson01.teach.saptamana_ieri:
    title: هفته، دیروز، هفتهٔ پیش و هفتهٔ آینده
    gloss: săptămână (هفته) / ieri (دیروز) / săptămâna trecută (هفتهٔ پیش) / săptămâna viitoare (هفتهٔ آینده)
    note: مجموعه‌ای از واژه‌های اضافی که برای بیان نسبی زمان مفیدند؛ در تمرین‌های این درس به اندازهٔ نام روزهای هفته تکرار نمی‌شوند.
  ro.a1.unit03.lesson01.teach.lowercase_zile:
    title: نام روزها با حرف کوچک نوشته می‌شود
    gloss: 'نام روزها با حرف بزرگ نوشته نمی‌شود: luni، vineri.'
    note: در فارسی حروف بزرگ و کوچک نداریم، ولی در رومانیایی نام روزهای هفته وسط جمله با حرف بزرگ نوشته نمی‌شود -- *luni* نه *Luni* -- مگر اینکه خود کلمه اول جمله باشد.
  ro.a1.unit03.lesson02.teach.ian_feb_mar:
    title: ژانویه، فوریه، مارس
    gloss: ianuarie (ژانویه) / februarie (فوریه) / martie (مارس)
    note: برخلاف نام روزها، چند نام ماه شبیه نام‌های بین‌المللی آشنای خود هستند (مثل ژانویه و مارس) و راحت شناخته می‌شوند.
    example_gloss:
    - ژانویه است.
    - فوریه است.
    - مارس است.
  ro.a1.unit03.lesson02.teach.apr_mai_iun:
    title: آوریل، مه، ژوئن
    gloss: آوریل / مه / ژوئن
    note: Mai (مه) کوتاه است، ولی با mai به معنی «بیشتر» که جاهای دیگر این دوره می‌آید (ce mai faci) فرق دارد؛ از روی جمله همیشه معلوم می‌شود کدام است.
    example_gloss:
    - آوریل است.
    - مه است.
    - ژوئن است.
  ro.a1.unit03.lesson02.teach.iul_aug_sep:
    title: ژوئیه، اوت، سپتامبر
    gloss: ژوئیه / اوت / سپتامبر
    note: August شبیه نام بین‌المللی این ماه (آگوست) است؛ یکی از شفاف‌ترین کلمه‌های هم‌ریشه در این مجموعه. در فارسی معمولاً «اوت» می‌گوییم.
    example_gloss:
    - ژوئیه است.
    - اوت است.
    - سپتامبر است.
  ro.a1.unit03.lesson02.teach.oct_noi_dec:
    title: اکتبر، نوامبر، دسامبر
    gloss: اکتبر / نوامبر / دسامبر
    note: این سه ماه آخر، دوازده ماه را کامل می‌کنند؛ همه‌شان اسم‌هایی هستند که تغییر نمی‌کنند.
    example_gloss:
    - اکتبر است.
    - نوامبر است.
    - دسامبر است.
  ro.a1.unit03.lesson02.teach.intai:
    title: اول (ماه)
    gloss: اول
    note: 'یک قاعده‌ی مخصوص رومانیایی: در زبان معیار، اول هر ماه را *unu* (همان «یک» ساده) نمی‌گویند، بلکه کلمه‌ی ویژه‌ی *întâi* را به کار می‌برند. (در گفتار عامیانه ممکن است *unu* هم بشنوید، ولی *întâi* شکلی است که باید یاد بگیرید.) برای بقیه‌ی روزها، از دوم به بعد، همان عدد معمولی را می‌گویند.'
    example_gloss: امروز اول اوت است.
  ro.a1.unit03.lesson02.teach.date_rule:
    title: تاریخ را در رومانیایی چطور می‌گویند
    gloss: 'اول: întâi · دوم به بعد: همان عدد معمولی (doi, trei, patru...)'
    note: بعد از روز اول، تاریخ در رومانیایی فقط عدد اصلی ساده است (که قبلاً دیدید) و بعدش نام ماه می‌آید؛ نه شکل ترتیبی دارد و نه کلمه‌ی اضافه، مثلاً *trei aprilie* (سوم آوریل، تحت‌اللفظی «سه آوریل»).
  ro.a1.unit03.lesson02.teach.ce_data:
    title: پرسیدن تاریخ
    gloss: امروز چندم است؟
    note: Dată (تاریخ) اینجا کلمه‌ی جدید است؛ بقیه‌ی سؤال همان ce و este و astăzi است که در سؤال مربوط به روز در درس ۱ دیدید.
  ro.a1.unit03.lesson02.teach.raspuns_data:
    title: گفتن تاریخ
    gloss: امروز سوم آوریل است.
    note: Trei (سه) همان عدد اصلی واحد ۲ است؛ نه پسوند ترتیبی می‌گیرد و نه کلمه‌ای پیش از aprilie می‌آید.
  ro.a1.unit03.lesson02.teach.la_multi_ani:
    title: به مناسبت روز خاص به کسی تبریک بگویید
    gloss: تولدت مبارک! / سال نو مبارک!
    note: تحت‌اللفظی «(برای) سال‌های بسیار» است؛ رایج‌ترین تبریک رومانیایی برای تولد، روز نام و سال نو، و کلمه‌ی *ani* (سال‌ها) را از بخش سن در واحد ۲ می‌شناسید.
  ro.a1.unit03.lesson02.teach.lowercase_luni:
    title: نام ماه‌ها هم با حرف کوچک نوشته می‌شود
    gloss: 'نام ماه‌ها با حرف بزرگ نوشته نمی‌شود: ژانویه، مه.'
    note: 'همان قاعده‌ی نام روزهای هفته در درس ۱: نام ماه‌ها در رومانیایی وسط جمله با حرف کوچک نوشته می‌شود.'
  ro.a1.unit03.lesson03.teach.cand:
    title: کی؟
    gloss: کی؟
    note: Când سؤال درباره‌ی زمان را شروع می‌کند و معادل «کی؟» در فارسی است.
    example_gloss: جلسه کِی است؟
  ro.a1.unit03.lesson03.teach.intalnirea:
    title: جلسه
    gloss: جلسه
    note: Întâlnirea شکل معرفه است (همان جلسه)؛ شکل بدون نشانه‌ی معرفه‌اش întâlnire است.
    example_gloss: جلسه دوشنبه است.
  ro.a1.unit03.lesson03.teach.cand_e_intalnirea:
    title: بپرسید چیزی کی است
    gloss: جلسه کِی است؟
    note: când را با este که می‌شناسید و întâlnirea که در این درس جدید است کنار هم می‌گذارد.
  ro.a1.unit03.lesson03.teach.raspuns_intalnire:
    title: تاریخ یک رویداد را بگویید
    gloss: جلسه جمعه، اول اوت است.
    note: روز هفته و تاریخ را می‌شود با ویرگول کنار هم گفت.
  ro.a1.unit03.lesson03.teach.fara_de:
    title: برای روزها و تاریخ‌ها de لازم نیست
    gloss: 'برای روزها و تاریخ‌ها «de» لازم نیست: جمعه، اول اوت.'
    note: 'این با قاعده‌ی واحد ۲ فرق دارد: عددهای ۲۰ به بالا پیش از اسم معمولی *de* می‌گیرند (*treizeci de ani*)، اما روز هفته یا تاریخ مستقیم و بدون هیچ *de* می‌آید.'
  ro.a1.unit03.lesson03.teach.line01:
    title: بپرسید جلسه کی است
    gloss: Ana از Mihai می‌پرسد جلسه‌شان کی است.
    note: یک سؤال ساده و خنثی؛ este با tu یا dumneavoastră تغییر نمی‌کند.
  ro.a1.unit03.lesson03.teach.line02:
    title: گفتن تاریخ
    gloss: Mihai می‌گوید جلسه جمعه، اول اوت است.
    note: 'Mihai همان الگوی تاریخ درس قبل را به کار می‌برد: روز هفته، بعد întâi + ماه، بدون de.'
  ro.a1.unit03.lesson03.teach.line03:
    title: تأیید کنید و خداحافظی کنید
    gloss: Ana از او تشکر می‌کند و خداحافظی می‌کند.
    note: La revedere که در واحد ۱ یاد گرفتید، مثل همیشه گفت‌وگو را تمام می‌کند.
  ro.a1.unit03.lesson03.teach.line04:
    title: گفت‌وگو را تمام کنید
    gloss: Mihai هم خداحافظی می‌کند و اسم Ana را می‌آورد.
    note: گفتن la revedere همراه با اسم طرف مقابل، راهی طبیعی و دوستانه برای تمام کردن گفت‌وگوست.
