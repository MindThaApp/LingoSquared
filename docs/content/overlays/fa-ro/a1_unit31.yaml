      status: correct
    feedback: Ana are părul lung și blond.
  ro.a1.unit31.lesson02.exercise02.listen_mihai_are_parul:
    instruction: گوش بدهید و چیزی را که گوینده می‌گوید انتخاب کنید.
    correct_option: Mihai موی کوتاه و مشکی دارد.
    distractors:
    - Mihai موی بلند و مشکی دارد.
    - Mihai موی کوتاه و قهوه‌ای دارد.
    - Mihai موی کوتاه و بلوند دارد.
    accepted_answers:
    - value: Mihai موی کوتاه و مشکی دارد.
      status: correct
    feedback: Mihai are părul scurt și negru.
