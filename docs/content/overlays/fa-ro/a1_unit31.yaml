teaching:
  ro.a1.unit31.lesson01.teach.inalt_scund:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Înalt* آدم قدبلند و *scund* آدم قدکوتاه را توصیف می‌کند. هر دو شکل مؤنث هم دارند: *înaltă*، *scundă*.'
    example_gloss:
    - النا قدبلند است.
    - آندری قدکوتاه است.
  ro.a1.unit31.lesson01.teach.batran_tanar:
    title: مسن و جوان
    gloss: مسن / جوان
    note: '*Bătrân* و *tânăr* اینجا تصور کلی از سن را بیان می‌کنند، نه تعداد دقیق سال‌ها. شکل‌های مؤنث: *bătrână*، *tânără*.'
    example_gloss:
    - پدربزرگ مسنه.
    - میهای جوان است.
  ro.a1.unit31.lesson01.teach.pentru_varsta_exacta:
    title: 'Bătrân: تصور کلی یا عدد دقیق'
    gloss: برای سن دقیق می‌پرسید Câți ani ai?، ولی bătrân یک تصور کلی می‌دهد، مثل Bunicul este bătrân.
    note: با *Câți ani ai?* می‌توانید سن دقیق را بپرسید. اینجا *bătrân* می‌گوید کسی چند ساله «به نظر می‌رسد»، بدون هیچ عددی.
  ro.a1.unit31.lesson01.teach.elena_este_inalta:
    title: النا قدبلند است و آندری قدکوتاه
    gloss: النا قدبلند است و آندری قدکوتاه.
    note: 'یک جملهٔ ترکیبی ساده با *și* («و») که زمینه را برای مقایسهٔ مستقیم در درس ۵ آماده می‌کند؛ صفت با نهاد مطابقت می‌کند: *înaltă* برای النا، *scund* برای آندری.'
  ro.a1.unit31.lesson02.teach.parul:
    title: مو
    gloss: مو
    note: '*Păr* اسم مذکر است؛ حرف تعریف به آخر آن می‌چسبد: *părul* («مو»).'
    example_gloss: میهای موی کوتاه و مشکی دارد.
  ro.a1.unit31.lesson02.teach.blond_maro_carunt:
    title: بلوند، قهوه‌ای و خاکستری
    gloss: بلوند / قهوه‌ای / خاکستری
    note: سه رنگ مو. این‌ها بعد از اسم *păr* (مذکر) می‌آیند، پس می‌گویید *părul blond*، *păr maro*، *păr cărunt*.
    example_gloss:
    - آنا موی بلوند دارد.
    - آندری موی قهوه‌ای دارد.
    - پدربزرگ موهای خاکستری داره.
  ro.a1.unit31.lesson02.teach.lung_scurt:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Lung* (بلند) و *scurt* (کوتاه) طول مو را توصیف می‌کنند؛ مثل رنگ‌ها بعد از اسم می‌آیند.'
    example_gloss:
    - النا موی بلند دارد.
    - آندری موی کوتاه دارد.
  ro.a1.unit31.lesson02.teach.adjectivul_vine_dupa:
    title: صفت بعد از اسم می‌آید
    gloss: 'صفت بعد از اسم می‌آید: păr scurt, păr lung, păr blond, păr maro, păr cărunt, păr negru.'
    note: در رومانیایی صفت بعد از اسم می‌آید (*păr scurt*)، شبیه فارسی «موی کوتاه»، البته بدون کسرهٔ اضافه.
  ro.a1.unit31.lesson02.teach.posesivul_vine_dupa:
    title: «او» و «مال او» بعد از اسم می‌آیند
    gloss: 'صفت ملکی بعد از اسم می‌آید: părul ei (موی او)، ochii lui (چشم‌های او).'
    note: '*Ei* یعنی «مال او (زن)» و *lui* یعنی «مال او (مرد)»؛ هر دو بعد از اسم می‌آیند: *părul ei*. از موقعیت معلوم می‌شود منظور چه کسی است.'
  ro.a1.unit31.lesson02.teach.mihai_are_parul:
    title: میهای موی کوتاه و مشکی دارد
    gloss: میهای موی کوتاه و مشکی دارد.
    note: '*Negru* (مشکی) صفت رنگ است؛ بعد از اسم می‌آید: *păr negru*.'
  ro.a1.unit31.lesson02.teach.ana_are_parul:
    title: آنا موی بلند و بلوند دارد
    gloss: آنا موی بلند و بلوند دارد.
    note: واژه‌های طول و رنگ این درس در یک جمله‌ی طبیعی کنار هم آمده‌اند.
  ro.a1.unit31.lesson03.teach.ochii:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Ochi* (چشم/چشم‌ها) در مفرد و جمع یک شکل دارد؛ حرف تعریف تعداد را نشان می‌دهد: *ochiul* («چشم»)، *ochii* («چشم‌ها»).'
    example_gloss: میهای چشم‌های قهوه‌ای دارد.
  ro.a1.unit31.lesson03.teach.albastru_maro_verde:
    title: آبی، قهوه‌ای و سبز
    gloss: آبی / قهوه‌ای / سبز
    note: '*Albastru* (آبی)، *maro* (قهوه‌ای) و *verde* (سبز) صفت رنگ هستند. *Maro* هیچ‌وقت تغییر نمی‌کند؛ *albastru* در جمع *albaștri* و *verde* در جمع *verzi* می‌شود.'
    example_gloss:
    - آنا چشم‌های آبی دارد.
    - آندری چشم‌های قهوه‌ای دارد.
    - النا چشم‌های سبز دارد.
  ro.a1.unit31.lesson03.teach.la_plural_adjectivul:
    title: صفت‌ها در جمع
    gloss: 'در جمع صفت تغییر می‌کند: ochi albaștri, ochi maro, ochi verzi.'
    note: با *ochi* جمع، صفت شکل جمع می‌گیرد (*albaștri*، *verzi*)؛ *maro* همان می‌ماند. با مفرد *păr albastru* مقایسه کنید.
  ro.a1.unit31.lesson03.teach.cum_arata_ana:
    title: آنا چه شکلی است؟
    gloss: آنا چه شکلی است؟
    note: '*Cum arată ...?* سؤال اصلی این بخش است؛ با آن می‌توانید درباره ظاهر هر کسی بپرسید.'
  ro.a1.unit31.lesson03.teach.ana_are_parul:
    title: Ana موی بلند و بلوند و چشم آبی دارد
    gloss: Ana موی بلند و بلوند و چشم آبی دارد.
    note: جمله‌ای نمونه که مو و چشم را با *și* در یک جمله کنار هم می‌آورد.
  ro.a1.unit31.lesson04.teach.ana_vine_o:
    title: Ana، Nina را معرفی می‌کند
    gloss: 'Ana: یک دختر جدید به کافه زبان‌های خارجی می‌آید. اسمش Nina است.'
    note: '*Vine o fată nouă* («یک دختر جدید می‌آید») برای معرفی کسی تازه است؛ *O cheamă Nina* اسمش را می‌گوید.'
  ro.a1.unit31.lesson04.teach.mihai_bine_cum:
    title: Mihai می‌پرسد او چه شکلی است
    gloss: 'Mihai: خوب! چه شکلی است؟'
    note: 'همان سؤال اصلی این بخش را بدون اسم به کار می‌برد: *Cum arată?* (از موقعیت معلوم است درباره کیست).'
  ro.a1.unit31.lesson04.teach.ana_este_scunda:
    title: Ana قد و موی Nina را توصیف می‌کند
    gloss: 'Ana: قدش کوتاه است و موی کوتاه و بلوند دارد.'
    note: واژه *scundă* از درس ۱ را با واژگان مو از درس ۲ ترکیب می‌کند.
  ro.a1.unit31.lesson04.teach.mihai_si_ochii:
    title: Mihai درباره چشم‌هایش می‌پرسد
    gloss: 'Mihai: چشم‌هایش چطور؟'
    note: '*Și ochii?* («و چشم‌ها؟») یک سؤال کوتاه برای ادامه گفت‌وگو است؛ از موقعیت معلوم است درباره کیست.'
  ro.a1.unit31.lesson04.teach.ana_are_ochi:
    title: Ana چشم‌های Nina را توصیف می‌کند
    gloss: 'Ana: چشم‌هایش سبز است.'
    note: عبارت *ochi verzi* از درس ۳ دوباره به کار رفته است.
  ro.a1.unit31.lesson04.teach.mihai_multumesc_atunci:
    title: Mihai او را می‌شناسد
    gloss: 'Mihai: ممنون! پس حتماً می‌شناسمش.'
    note: '*O recunosc* یعنی «او را می‌شناسم/تشخیصش می‌دهم»: *o* ضمیر مفعولی «او» است و قبل از فعل می‌آید.'
  ro.a1.unit31.lesson05.teach.andrei_si_elena:
    title: مقایسه Andrei و Elena
    gloss: Andrei و Elena برادر و خواهرند، ولی ظاهرشان فرق دارد. Andrei قدش کوتاه است و موی کوتاه و قهوه‌ای و چشم قهوه‌ای دارد. Elena از Andrei قدبلندتر است و موی بلند و قهوه‌ای و چشم سبز دارد. شما چه شکلی هستید؟
    note: یک مقایسه‌ی کوتاه که همه‌ی واژه‌های رنگ و طولِ تا اینجا را دوباره به کار می‌برد و با سؤال اصلی این بخش خطاب به خواننده تمام می‌شود.
    glosses:
      frate: برادر
      soră: خواهر
      arată: به نظر رسیدن
      diferit: متفاوت
      scund: کوتاه‌قد
      scurt: کوتاه‌قد
      maro: قهوه‌ای
      părul: مو
      ochi: چشم‌ها
      înaltă: قدبلندتر
      lung: بلند
      verzi: سبز
      arăți: ظاهر داشتن، به نظر رسیدن
  ro.a1.unit31.lesson05.teach.comparativul_se_formeaza:
    title: مقایسه با mai ... decât
    gloss: 'صفت تفضیلی با mai + صفت + decât ساخته می‌شود: Elena este mai înaltă decât Andrei.'
    note: 'در رومانیایی *mai* («بیشتر») قبل از صفت و *decât* («از») قبل از نفر دوم می‌آید: *mai înaltă decât Andrei*.'
  ro.a1.unit31.lesson05.teach.elena_are_parul:
    title: موی Elena از موی Andrei بلندتر است
    gloss: موی Elena از Andrei بلندتر است.
    note: '*Mai lung* هم قبل از *decât* همین‌طور کار می‌کند: *părul mai lung decât Andrei*؛ صفت همچنان بعد از *părul* می‌آید.'
  ro.a1.unit31.lesson05.teach.am_parul_scurt:
    title: موی من کوتاه و قهوه‌ای است
    gloss: موی من کوتاه و قهوه‌ای است.
    note: جمله‌ای نمونه با *Am ...* برای اول‌شخص، که وقتی ظاهر خودتان را توصیف می‌کنید می‌توانید از آن استفاده کنید.
  ro.a1.unit31.lesson06.teach.mihai_uite_ea:
    title: Mihai، Nina را می‌بیند
    gloss: 'Mihai: ببین، او Nina است؟ موی کوتاه و بلوند و چشم سبز دارد.'
    note: '*Uite* («ببین») توجه را به چیزی جلب می‌کند؛ *ea e Nina?* یعنی «او Nina است؟».'
  ro.a1.unit31.lesson06.teach.ana_da_ea:
    title: Ana تأیید می‌کند
    gloss: 'Ana: بله، او Nina است!'
    note: یک تأیید کوتاه و طبیعی.
  ro.a1.unit31.lesson06.teach.nina_salut_tu:
    title: Nina به Mihai سلام می‌کند
    gloss: 'Nina: سلام، شما Mihai هستی؟'
    note: 'یک سؤال ساده و خودمانی برای احوال‌پرسی: *tu ești ...?*'
  ro.a1.unit31.lesson06.teach.mihai_da_ma:
    title: Mihai هم به Nina سلام می‌کند
    gloss: 'Mihai: بله! از آشنایی با تو خوشحالم، Nina.'
    note: '*Mă bucur să te cunosc* («از آشنایی با تو خوشحالم») عبارت معمول برای اولین دیدار است.'
  ro.a1.unit31.lesson06.teach.nina_si_eu:
    title: نینا هم همین را می‌گوید
    gloss: 'نینا: منم از آشنایی باهات خوشحالم!'
    note: گفت‌وگو را به پایان می‌برد؛ Mihai با توصیف Ana، Nina را درست شناخت.
