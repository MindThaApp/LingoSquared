    correct_option: Ana موی بلند و بلوند دارد.
    distractors:
    - Ana موی کوتاه و مشکی دارد.
    - Ana موی بلند و قهوه‌ای دارد.
    - Ana موی سفید دارد.
    accepted_answers:
