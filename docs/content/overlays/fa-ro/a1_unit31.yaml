  description: 'رومانیایی مقدماتی برای توصیف ظاهر ساده و بیرونی یک نفر: قد و تصور کلی از سن، رنگ مو و چشم، سؤال اصلی Cum arată ...؟ و مقایسهٔ ظاهر دو نفر.'
