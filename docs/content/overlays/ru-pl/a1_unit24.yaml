  pl.a1.unit24.lesson01.czytanie_sport_i_gotowanie:
    title: Чтение, спорт и готовка
  pl.a1.unit24.lesson02.muzyka_rysowanie_i_gry:
    title: Музыка, рисование и видеоигры
  pl.a1.unit24.lesson03.co_robisz_w_wolnym:
    title: Чем ты занимаешься в свободное время?
  pl.a1.unit24.lesson04.ewa_i_marek_rozmawiaja:
    title: Ewa и Marek говорят о хобби
  pl.a1.unit24.lesson05.marek_i_ewa_porownuja:
    title: Marek и Ewa сравнивают свои хобби
  pl.a1.unit24.lesson06.wspolne_planowanie_weekendu:
    title: Планируем выходные вместе
teaching:
  pl.a1.unit24.lesson01.teach.czytac_uprawiac_sport:
    title: Чтение, спорт, готовка
    gloss: читать, заниматься спортом, готовить
    note: 'Три распространённых глагола для хобби: *czytać* (читать), *uprawiać sport* (заниматься спортом) и *gotować* (готовить).'
    example_gloss:
    - Мне нравится читать книгу.
    - По субботам я занимаюсь спортом.
    - Мне нравится готовить для друзей.
  pl.a1.unit24.lesson01.teach.wolny_czas:
    title: Свободное время
    gloss: свободное время
    note: '*Wolny czas* — ключевое выражение для разговора о хобби. Прилагательное *wolny* (свободный) согласуется с существительным мужского рода *czas*; в *w wolnym czasie* оба слова стоят в местном падеже (локативе).'
    example_gloss: В свободное время я люблю читать.
  pl.a1.unit24.lesson01.teach.w_wolnym_czasie:
    title: Как сказать, чем занимаешься в свободное время
    gloss: В свободное время я люблю читать.
    note: 'После *lubię* (я люблю) идёт инфинитив: *lubię czytać*. *W wolnym czasie* — это *w* + местный падеж (локатив).'
  pl.a1.unit24.lesson02.teach.sluchac_muzyki_rysowac:
    title: Музыка, рисование, видеоигры
    gloss: слушать музыку, рисовать, играть в видеоигры
    note: 'Ещё три хобби: *słuchać muzyki* (слушать музыку), *rysować* (рисовать) и *grać w gry* (играть в игры).'
    example_gloss:
    - Я люблю слушать музыку.
    - Я часто рисую.
    - Я люблю играть в видеоигры с друзьями.
  pl.a1.unit24.lesson02.teach.lubie_sluchac_muzyki:
    title: Говорим, что любим слушать музыку
    gloss: Я люблю слушать музыку.
    note: 'После *słuchać* всегда стоит родительный падеж: *słucham muzyki*, а не *muzyka*.'
  pl.a1.unit24.lesson02.teach.lubie_grac_w:
    title: Говорим, что любим играть в видеоигры с друзьями
    gloss: Я люблю играть в видеоигры с друзьями.
    note: '*Z przyjaciółmi* («с друзьями») — это *z* + творительный падеж множественного числа.'
  pl.a1.unit24.lesson03.teach.zawsze_czesto_czasami:
    title: Всегда, часто, иногда, никогда
    gloss: всегда, часто, иногда, никогда
    note: 'Четыре основных наречия частоты: *zawsze*, *często*, *czasami*, *nigdy*. Они не изменяются, а после *nigdy* перед глаголом нужно *nie*: *Nigdy nie gram.*'
    example_gloss:
    - Я всегда занимаюсь спортом по субботам.
    - Я часто читаю книгу.
    - Иногда я рисую.
    - Я никогда не играю в видеоигры.
  pl.a1.unit24.lesson03.teach.co_tydzien_co:
    title: Каждую неделю, каждые выходные
    gloss: каждую неделю, каждые выходные
    note: '*Co tydzień* и *co weekend* означают «каждую ...»; после *co* стоит винительный падеж, а само co не изменяется — см. следующую карточку.'
    example_gloss:
    - Я каждую неделю готовлю для друзей.
    - Я занимаюсь спортом каждые выходные.
  pl.a1.unit24.lesson03.teach.co_biernik_co:
    title: Co + винительный падеж
    gloss: '*Co* + винительный падеж означает «каждый»: каждую неделю, каждые выходные, каждый месяц.'
    note: '*Co* — одно неизменяемое слово со значением «каждый», с любым существительным. У неодушевлённых существительных мужского рода, таких как *tydzień*, *weekend* и *miesiąc*, винительный падеж совпадает с именительным.'
  pl.a1.unit24.lesson03.teach.co_robisz_w:
    title: Спрашиваем о свободном времени
    gloss: Чем ты занимаешься в свободное время?
    note: Это главный вопрос этого раздела — с ним можно спросить любого человека о его увлечениях.
  pl.a1.unit24.lesson04.teach.ewa_czesto_razem:
    title: Ewa заговаривает о хобби
    gloss: 'Ewa: Мы часто гуляем вместе. А чем ещё ты занимаешься в свободное время, Marek?'
    note: '*Spacerujemy* — форма *my* (мы) глагола *spacerować*; *Marku* — звательный падеж (вокатив), который используют при прямом обращении к человеку.'
  pl.a1.unit24.lesson04.teach.marek_lubie_gotowac:
    title: Хобби Marek
    gloss: 'Marek: Я люблю готовить, в том числе и дома. И часто занимаюсь спортом.'
    note: '*Także w domu* («и дома») показывает, что Marek готовит ради удовольствия, а не только на работе в ресторане; *w domu* — местный падеж (локатив).'
  pl.a1.unit24.lesson04.teach.ewa_gotujesz_tez:
    title: Ewa удивлена
    gloss: 'Ewa: Ты и дома готовишь? Ты же целый день готовишь на работе!'
    note: '*Cały dzień* («целый день») подчёркивает, как много Marek уже готовит на работе; *przecież* добавляет оттенок «ведь» или «да ведь».'
  pl.a1.unit24.lesson04.teach.marek_tak_ale:
    title: Marek объясняет
    gloss: 'Marek: Да, но готовка меня расслабляет. А ты, что любишь делать?'
    note: '*Gotowanie mnie odpręża* буквально значит «готовка меня расслабляет»: в польском часто делают подлежащим само занятие, а *mnie* («меня») ставят в винительный падеж.'
  pl.a1.unit24.lesson04.teach.ewa_lubie_czytac:
    title: Хобби Ewa
    gloss: 'Ewa: Я люблю читать и часто слушаю музыку.'
    note: Два глагола о хобби из уроков 1 и 2 соединены в одном предложении союзом *i* (и).
  pl.a1.unit24.lesson04.teach.marek_grasz_tez:
    title: Marek спрашивает об играх
    gloss: 'Marek: Ты ещё и в игры играешь?'
    note: Короткий вопрос, на который можно ответить «да» или «нет», с выражением *grać w gry* из урока 2; *też* значит «тоже».
  pl.a1.unit24.lesson04.teach.ewa_nie_nigdy:
    title: Ewa отвечает
    gloss: 'Ева: Нет, я никогда не играю в игры. Но иногда рисую!'
    note: '*Nigdy* (никогда) и *czasami* (иногда) из урока 3 в одном ответе. Обрати внимание на двойное отрицание: *nigdy nie gram*.'
  pl.a1.unit24.lesson05.teach.marek_i_ja:
    title: Сравниваем увлечения
    gloss: Марек и я часто гуляем вместе. Но у нас есть и другие хобби. Марек любит готовить, в том числе дома, и часто занимается спортом. Я люблю читать и часто слушаю музыку. Иногда рисую, но никогда не играю в игры. Что ты любишь делать в свободное время?
    note: В сообщении Евы повторяются факты из урока 4, а в конце задан главный вопрос раздела.
    glosses:
      spacerujemy: гуляем
      często: часто
      razem: вместе
      inne: другие
      gotować: готовит
      lubi: нравится
      domu: дома
      uprawia: занимается спортом
      czytać: читать
      słucham: слушаю
      muzyki: музыка
      rysuję: рисую
      czasami: иногда
      gram: играть в видеоигры
      nigdy: никогда
      wolnym: свободное
      czasie: время
  pl.a1.unit24.lesson06.teach.marek_co_robisz:
    title: Марек спрашивает про выходные
    gloss: 'Марек: Что ты делаешь в эти выходные?'
    note: '*W ten weekend* (в эти выходные): для обозначения времени используется *w* + винительный падеж.'
  pl.a1.unit24.lesson06.teach.ewa_jeszcze_nie:
    title: Ева ещё не решила
    gloss: 'Ева: Пока не знаю. Я люблю читать, но ещё хочу выйти на улицу.'
    note: '*Wyjść na dwór* (выйти на улицу) — обычный способ сказать, что хочешь выйти из дома; *chcę* + инфинитив значит «я хочу».'
  pl.a1.unit24.lesson06.teach.marek_pojdziemy_razem:
    title: Марек предлагает план
    gloss: 'Марек: Пойдём вместе погуляем? Потом я приготовлю что-нибудь для нас.'
    note: '*Potem* (потом) — слово, которое показывает последовательность; *ugotuję* — глагол совершенного вида, потому что приготовление здесь — завершённый результат.'
  pl.a1.unit24.lesson06.teach.ewa_dobry_pomysl:
    title: Ева соглашается
    gloss: 'Ева: Хорошая идея! Я люблю и гулять, и готовить.'
    note: '*Lubię i ..., i ...* («и ..., и ...») показывает, что Еве одинаково нравятся оба занятия.'
  pl.a1.unit24.lesson06.teach.marek_swietnie_to:
    title: Марек подтверждает
    gloss: 'Марек: Отлично. Тогда увидимся в субботу!'
    note: Дружеская заключительная реплика, подтверждающая план на субботу; *w sobotę* — это *w* + винительный падеж для дня недели.
