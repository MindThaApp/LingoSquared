teaching:
  pl.a1.unit14.lesson01.teach.mlody:
    title: Молодой
    gloss: молодой
    note: Базовое прилагательное — отправная точка для сравнительных форм этого раздела.
    example_gloss: Марек молодой.
  pl.a1.unit14.lesson01.teach.stary:
    title: Старый
    gloss: старый
    note: Противоположность młody — ещё одно прилагательное, от которого в этом разделе образуется сравнительная степень.
    example_gloss: Дедушка пожилой.
  pl.a1.unit14.lesson01.teach.comparative_formation_note:
    title: 'Сравнение: добавляем -szy'
    gloss: 'У коротких прилагательных вроде stary и młody окончание -y меняется на -szy: stary → starszy, młody → młodszy. Так работает не каждое прилагательное.'
    note: 'Простая схема для этих двух слов: отбрось конечное *-y* и добавь *-szy* — получится сравнительная степень. У многих других прилагательных другое окончание, поэтому не применяй это правило ко всем.'
  pl.a1.unit14.lesson01.teach.starszy_starsza:
    title: Старше
    gloss: старше
    note: Starszy говорят о мужчине (или on), starsza — о женщине (или ona); это сравнительная степень от stary.
    example_gloss:
    - Дедушка старше отца.
    - Бабушка старше матери.
  pl.a1.unit14.lesson01.teach.mlodszy_mlodsza:
    title: Младше
    gloss: младше
    note: Młodszy — о мужчине, młodsza — о женщине; это сравнительная степень от młody.
    example_gloss:
    - Отец младше дедушки.
    - Мать младше бабушки.
  pl.a1.unit14.lesson01.teach.niz:
    title: Чем
    gloss: чем
    note: Niż соединяет две сравниваемые вещи; слово после niż остаётся в обычной начальной форме.
    example_gloss: Сын младше отца.
  pl.a1.unit14.lesson01.teach.gender_agreement_note:
    title: Сравнительная степень согласуется в роде
    gloss: Starszy/starsza и młodszy/młodsza изменяются по родам, как byłem/byłam. Starszy, młodszy — о мужчине (on); starsza, młodsza — о женщине (ona).
    note: 'Та же схема, что у *byłem*/*byłam*: окончание зависит от того, говоришь ты о мужчине или о женщине.'
  pl.a1.unit14.lesson01.teach.ewa_starsza:
    title: Ева старше Марека
    gloss: Ева старше Марека.
    note: 'Реальный факт о наших героях: Еве 32 года, Мареку 28.'
  pl.a1.unit14.lesson01.teach.marek_mlodszy:
    title: Марек младше Евы
    gloss: Марек младше Евы.
    note: Тот же факт, сказанный наоборот.
  pl.a1.unit14.lesson02.teach.dobry_recap:
    title: Снова «хороший»
    gloss: Dobry («хороший») — ты уже знаешь это слово из Dzień dobry.
    note: То же прилагательное, которое ты видишь с самого первого раздела; теперь от него образуется сравнительная степень.
  pl.a1.unit14.lesson02.teach.zly:
    title: Плохой
    gloss: плохой
    note: Противоположность dobry — совершенно новое слово в этом разделе.
    example_gloss: Это плохой день.
  pl.a1.unit14.lesson02.teach.irregular_comparative_note:
    title: Dobry и zły — неправильные
    gloss: 'Dobry и zły образуют сравнительную степень неправильно: dobry → lepszy, zły → gorszy; -szy не добавляется.'
    note: 'В отличие от *stary*/*młody*, эти два слова не следуют правилу с *-szy*: их сравнительные формы нужно просто выучить.'
  pl.a1.unit14.lesson02.teach.lepszy_lepsza:
    title: Лучше
    gloss: лучше
    note: Lepszy — о мужчине, lepsza — о женщине (или о слове женского рода, например kawa); это неправильная сравнительная степень от dobry.
    example_gloss:
    - Он лучше меня.
    - Кофе лучше чая.
  pl.a1.unit14.lesson02.teach.gorszy_gorsza:
    title: Хуже
    gloss: хуже
    note: Gorszy/gorsza — неправильная сравнительная степень от zły.
    example_gloss:
    - Он хуже меня.
    - Чай хуже кофе.
  pl.a1.unit14.lesson02.teach.kawa_herbata_recap:
    title: Снова кофе и чай
    gloss: Kawa и herbata — эти слова ты уже знаешь из предыдущего урока о напитках.
    note: Короткое напоминание перед тем, как в этом уроке они окажутся в сравнении.
  pl.a1.unit14.lesson02.teach.gender_note_recap:
    title: Та же схема, что раньше
    gloss: Lepszy/lepsza и gorszy/gorsza изменяются по родам так же, как starszy/starsza в прошлом уроке.
    note: То же деление на мужской и женский род, которое ты только что разобрал, теперь на новой паре слов.
  pl.a1.unit14.lesson03.teach.pronouns_recap:
    title: Я, я есть, ты
    gloss: Ja, jestem, ty — ты уже знаешь эти слова по прошлым урокам.
    note: Короткое напоминание перед диалогом этого урока.
  pl.a1.unit14.lesson03.teach.tak_nie_dobrze_recap:
    title: Да, нет, хорошо
    gloss: Tak, nie и dobrze — тоже уже знакомы.
    note: Ещё одно короткое напоминание перед диалогом.
  pl.a1.unit14.lesson03.teach.ale_recap:
    title: Но — ещё раз
    gloss: Ale («но») — ты уже знаешь это слово по прошлым урокам. Оно соединяет два противопоставленных предложения.
    note: Короткий союз, который вводит противопоставление, как русские «но» и «а».
  pl.a1.unit14.lesson03.teach.dialogue.line01:
    title: Марек говорит, что чай лучше
    gloss: Чай лучше, чем кофе!
    note: Марек начинает со своего мнения — того же, о котором он уже говорил на уроке о предпочтениях.
  pl.a1.unit14.lesson03.teach.dialogue.line02:
    title: Эва не согласна
    gloss: Нет, нет! Кофе лучше, чем чай!
    note: Эва возражает и высказывает своё мнение — тоже такое же, как раньше.
  pl.a1.unit14.lesson03.teach.dialogue.line03:
    title: Марек переводит разговор на возраст
    gloss: Ладно, ладно. Зато я моложе тебя!
    note: Марек уступает в споре о напитках и вспоминает о том, в чём он уверен.
  pl.a1.unit14.lesson03.teach.dialogue.line04:
    title: Эва соглашается и повторяет своё мнение
    gloss: Да, я старше. Но кофе лучше!
    note: Эва признаёт факт о возрасте, а потом возвращается к своему мнению о кофе.
