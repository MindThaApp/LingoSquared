answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Польский A1
  description: 'Польский для начинающих: описание внешности человека — рост и впечатление о возрасте, цвет волос и глаз, главный вопрос Jak wygląda ...? и сравнение внешности двух людей.'
units:
  pl.a1.unit25.wyglad:
    title: Описываем внешность
lessons:
  pl.a1.unit25.lesson01.wysoki_niski_stary_i:
    title: Высокий, низкий, пожилой и молодой
  pl.a1.unit25.lesson02.opisywanie_wlosow:
    title: Описываем волосы
  pl.a1.unit25.lesson03.oczy_i_jak_ktos:
    title: Глаза и вопрос «Как выглядит человек?»
  pl.a1.unit25.lesson04.ewa_opisuje_nine:
    title: Ева описывает Нину
  pl.a1.unit25.lesson05.porownanie_tomka_i_kasi:
    title: Сравниваем Томека и Касю
  pl.a1.unit25.lesson06.marek_rozpoznaje_nine:
    title: Марек узнаёт Нину
teaching:
  pl.a1.unit25.lesson01.teach.wysoki_niski:
    title: Высокий и низкий
    gloss: высокий / невысокий
    note: '*Wysoki* — высокий человек, *niski* — невысокий. Женщина — *wysoka* или *niska*.'
    example_gloss:
    - Кася высокая.
    - Томек невысокий.
  pl.a1.unit25.lesson01.teach.stary_mlody:
    title: Пожилой и молодой
    gloss: пожилой / молодой
    note: '*Stary* и *młody* здесь передают общее впечатление, а не точное количество лет.'
    example_gloss:
    - Дедушка пожилой.
    - Марек молодой.
  pl.a1.unit25.lesson01.teach.dziadek_jest_stary:
    title: 'Stary: впечатление или возраст'
    gloss: '*Stary* описывает общее впечатление, как в предложении *Dziadek jest stary*. Чтобы назвать точный возраст, в польском используется другая конструкция: *Ile masz lat?*'
    note: О том, как выглядит человек, говорят с помощью *stary* или *młody*; чтобы узнать точный возраст, спрашивают *Ile masz lat?*, а отвечают *mam ... lat* (мне ... лет).
  pl.a1.unit25.lesson01.teach.kasia_jest_wysoka:
    title: Кася высокая, а Томек низкий
    gloss: Кася высокая, а Томек низкий.
    note: Простое сложное предложение с союзом *a* (а — для противопоставления). Слова *wysoka* и *niski* согласуются с подлежащим женского и мужского рода и готовят сравнение в уроке 5.
  pl.a1.unit25.lesson02.teach.wlosy:
    title: Волосы
    gloss: волосы
    note: '*Włosy* в польском всегда во множественном числе: *długie włosy* (длинные волосы).'
    example_gloss: У Марека короткие чёрные волосы.
  pl.a1.unit25.lesson02.teach.blond_brazowe_siwe:
    title: Светлый, каштановый и седой
    gloss: светлый / каштановый / седой
    note: Три цвета волос. *Blond* не изменяется; *brązowe* и *siwe* — формы множественного числа, согласованные с *włosy*.
    example_gloss:
    - У Евы светлые волосы.
    - У Томека каштановые волосы.
    - У дедушки седые волосы.
  pl.a1.unit25.lesson02.teach.dlugie_krotkie:
    title: Длинные и короткие (волосы)
    gloss: длинный / короткий (о волосах)
    note: '*Długie* (длинные) и *krótkie* (короткие) — формы множественного числа, согласованные с *włosy*.'
    example_gloss:
    - У Каси длинные волосы.
    - У Томека короткие волосы.
  pl.a1.unit25.lesson02.teach.wlosy_sa_w:
    title: У слова włosy прилагательные во множественном числе
    gloss: '*Włosy* — множественное число, поэтому и прилагательное стоит во множественном числе: длинные волосы, короткие волосы, каштановые волосы, чёрные волосы.'
    note: 'Существительные во множественном числе, кроме мужских лиц, требуют прилагательных с окончанием *-e*: *długie włosy*. Исключение — *blond*: оно не изменяется (*blond włosy*).'
  pl.a1.unit25.lesson02.teach.wlosy_maja_tylko:
    title: 'Włosy: всегда множественное число'
    gloss: '*Włosy* (волосы) всегда во множественном числе: *jej włosy są długie* (её волосы длинные, буквально «её волосы суть длинные»). *Jej* значит «её».'
    note: Слово «волосы» в польском стоит во множественном числе, поэтому глагол и прилагательное тоже ставятся во множественном числе. *Jej* («её») не изменяется, сколько бы предметов ей ни принадлежало.
  pl.a1.unit25.lesson02.teach.marek_ma_krotkie:
    title: У Марека короткие чёрные волосы
    gloss: У Марека короткие чёрные волосы.
    note: '*Czarne* (чёрные) — форма множественного числа, согласованная с *włosy*.'
  pl.a1.unit25.lesson02.teach.ewa_ma_dlugie:
    title: У Евы длинные светлые волосы
    gloss: У Евы длинные светлые волосы.
    note: В одном естественном предложении соединены слова о длине и цвете из этого урока.
  pl.a1.unit25.lesson03.teach.oczy:
    title: Глаза
    gloss: глаза
    note: '*Oczy* — множественное число от *oko*; о глазах в польском обычно говорят во множественном числе.'
    example_gloss: У Марека карие глаза.
  pl.a1.unit25.lesson03.teach.niebieski_brazowy_zielony:
    title: Голубой, карий и зелёный
    gloss: голубой / карий / зелёный
    note: 'Три цвета глаз во множественном числе, согласованные с *oczy*: *niebieskie*, *brązowe*, *zielone*.'
    example_gloss:
    - У Евы голубые глаза.
    - У Томека карие глаза.
    - У Каси зелёные глаза.
  pl.a1.unit25.lesson03.teach.oczy_sa_w:
    title: У слова oczy окончание -e
    gloss: '*Oczy* — множественное число, поэтому прилагательное оканчивается на *-e*: голубые глаза, карие глаза, зелёные глаза.'
    note: 'То же окончание множественного числа, что и у *włosy* в уроке 2: *niebieskie oczy*, *brązowe oczy*, *zielone oczy*.'
  pl.a1.unit25.lesson03.teach.jak_wyglada_ewa:
    title: Как выглядит Ева?
    gloss: Как выглядит Ева?
    note: '*Jak wygląda ...?* — главный вопрос этого раздела; с его помощью можно спросить о внешности любого человека.'
  pl.a1.unit25.lesson03.teach.ewa_ma_dlugie:
    title: У Евы длинные светлые волосы и голубые глаза
    gloss: У Евы длинные светлые волосы и голубые глаза.
    note: 'Образец ответа: волосы и глаза в одном предложении, соединённые союзом *i* (и).'
  pl.a1.unit25.lesson04.teach.ewa_do_kawiarni:
    title: Ева представляет Нину
    gloss: 'Ева: В языковое кафе приходит новая девушка. Её зовут Нина.'
    note: '*Przychodzi* (приходит) вводит в рассказ нового человека; в *do kawiarni językowej* после *do* стоит родительный падеж.'
  pl.a1.unit25.lesson04.teach.marek_okej_jak:
    title: Марек спрашивает, как она выглядит
    gloss: 'Марек: Хорошо! Как она выглядит?'
    note: Снова главный вопрос раздела, теперь с *ona* (она) вместо имени.
  pl.a1.unit25.lesson04.teach.ewa_jest_niska:
    title: Ева описывает рост и волосы Нины
    gloss: 'Ева: Она низкая, и у неё короткие светлые волосы.'
    note: Объединяет *niska* из урока 1 (женский род от *niski*) и лексику о волосах из урока 2.
  pl.a1.unit25.lesson04.teach.marek_a_jej:
    title: Марек спрашивает о её глазах
    gloss: 'Марек: А глаза?'
    note: '*Jej* здесь — притяжательное «её», поэтому *jej oczy* значит «её глаза»; *jej* не изменяется.'
  pl.a1.unit25.lesson04.teach.ewa_ma_zielone:
    title: Ева описывает глаза Нины
    gloss: 'Ева: У неё зелёные глаза.'
    note: Снова *zielone oczy* из урока 3.
  pl.a1.unit25.lesson04.teach.marek_dzieki_wtedy:
    title: Марек узнает её
    gloss: 'Марек: Спасибо! Тогда я её узнаю.'
    note: '*Rozpoznam* — будущее время совершенного вида («узнаю»); *ją* — винительный падеж от *ona* (её).'
  pl.a1.unit25.lesson05.teach.tomek_i_kasia:
    title: Сравниваем Томека и Касю
    gloss: Томек и Кася — брат и сестра, но выглядят они по-разному. Томек низкий, у него короткие каштановые волосы и карие глаза. Кася выше Томека, у неё длинные каштановые волосы и зелёные глаза. А как выглядишь ты?
    note: Короткое сравнение, в котором встречаются все изученные слова о цвете и длине; в конце читателю задан главный вопрос раздела.
    glosses:
      brat: брат
      siostra: сестра
      wyglądają: выглядеть
      inaczej: разный
      niski: невысокий
      krótkie: невысокий
      brązowe: карий
      włosy: волосы
      oczy: глаза
      wyższa: выше
      długie: длинный
      zielone: зелёный
      wyglądasz: ты выглядишь (неформально), о внешности
  pl.a1.unit25.lesson05.teach.stopien_wyzszy_wysoki:
    title: Снова сравнительная степень
    gloss: 'Сравнительная степень: *wysoki* (высокий) становится *wyższy* (выше), а того, с кем сравнивают, ставят после *niż* (чем): Кася выше Томека.'
    note: 'В польском сравнительная степень образуется изменением окончания прилагательного, и оно по-прежнему согласуется в роде: *wyższa* для Каси (женский род).'
  pl.a1.unit25.lesson05.teach.kasia_ma_dluzsze:
    title: У Каси волосы длиннее, чем у Томека
    gloss: У Каси волосы длиннее, чем у Томека.
    note: '*Dłuższe* (длиннее) стоит во множественном числе, согласуясь с *włosy*, а *niż* (чем) вводит сравнение.'
  pl.a1.unit25.lesson05.teach.mam_krotkie_brazowe:
    title: У меня короткие каштановые волосы
    gloss: У меня короткие каштановые волосы.
    note: Образец предложения от первого лица с *Mam ...*; его удобно использовать, когда рассказываешь о своей внешности.
  pl.a1.unit25.lesson06.teach.marek_patrz_czy:
    title: Марек замечает Нину
    gloss: 'Марек: Смотри, это Нина? У неё короткие светлые волосы и зелёные глаза.'
    note: '*Patrz* (смотри) — повелительное наклонение от *patrzeć*. *Czy to Nina?* значит «это Нина?»'
  pl.a1.unit25.lesson06.teach.ewa_tak_to:
    title: Ева подтверждает
    gloss: 'Ева: Да, это Нина!'
    note: Короткое естественное подтверждение.
  pl.a1.unit25.lesson06.teach.nina_czesc_jestes:
    title: Нина здоровается с Мареком
    gloss: 'Нина: Привет, ты Марек?'
    note: 'Простой неформальный вопрос при знакомстве. После *być* имя ставится в творительный падеж: *jesteś Markiem?*'
  pl.a1.unit25.lesson06.teach.marek_tak_milo:
    title: Марек отвечает Нине
    gloss: 'Марек: Да! Приятно познакомиться, Нина.'
    note: '*Miło cię poznać* — стандартная фраза при первой встрече («приятно познакомиться»; *poznać* значит «познакомиться, узнать»). К Нине обращаются в звательном падеже: *Nino*.'
  pl.a1.unit25.lesson06.teach.nina_ciebie_tez:
    title: Нина отвечает на приветствие
    gloss: 'Нина: Я тоже рада познакомиться!'
    note: 'Завершает диалог: Марек успешно узнал Нину по описанию Евы.'
