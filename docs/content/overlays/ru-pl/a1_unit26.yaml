teaching:
  pl.a1.unit26.lesson01.teach.zwierze_zwierzak:
    title: Животное, питомец
    gloss: животное / домашнее животное
    note: '*Zwierzę* — общее слово для животного; *zwierzak* — обиходное слово для домашнего питомца.'
    example_gloss:
    - Собака — это животное.
    - Собака — ещё и домашний питомец.
  pl.a1.unit26.lesson01.teach.pies_kot:
    title: Собака и кот
    gloss: собака / кот
    example_gloss:
    - У Евы есть собака.
    - У Томека есть кот.
  pl.a1.unit26.lesson01.teach.ryba_ptak:
    title: Рыба и птица
    gloss: рыба / птица
    example_gloss:
    - У дедушки есть рыба.
    - У Нины есть птица.
  pl.a1.unit26.lesson01.teach.masz_zwierzaka:
    title: У тебя есть питомец?
    gloss: У тебя есть питомец?
    note: Тот же вопрос с *Masz ...?*, который ты уже знаешь по прошлым урокам; *masz* — форма *ty* глагола *mieć*.
  pl.a1.unit26.lesson01.teach.tak_mam_psa:
    title: Да, у меня есть собака
    gloss: Да, у меня есть собака.
    note: Простой утвердительный ответ с новой лексикой этого раздела.
  pl.a1.unit26.lesson01.teach.nie_nie_mam:
    title: Нет, у меня нет питомца
    gloss: Нет, у меня нет питомца.
    note: '*Nie mam* + родительный падеж: то, чего у тебя нет, стоит в родительном — *zwierzaka*. См. заметку о грамматике.'
  pl.a1.unit26.lesson01.teach.nie_mam_czasu:
    title: Nie mam + родительный падеж
    gloss: 'После *nie mam* дополнение стоит в родительном падеже: *Nie mam czasu* («У меня нет времени») и здесь *Nie mam zwierzaka* («У меня нет питомца»).'
    note: Здесь повторяется образец *Nie mam czasu*; новым является только существительное. У одушевлённых существительных мужского рода, как *zwierzak*, винительный и родительный падежи совпадают, а у существительных женского рода изменение видно (*Mam rybę* → *Nie mam ryby*).
  pl.a1.unit26.lesson02.teach.wyprowadzac_na_spacer:
    title: Выгуливать (животное)
    gloss: выгуливать (животное)
    note: '*Wyprowadzać na spacer* — устойчивое выражение для прогулки с животным; глагол несовершенного вида, потому что это привычное действие. См. заметку о грамматике.'
    example_gloss: Я выгуливаю собаку каждый день.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa:
    title: Несовершенный вид для привычных действий
    gloss: '*Wyprowadzać* (несовершенный вид) описывает привычное действие: *Codziennie wyprowadzam psa.* Совершенный вид *wyprowadzić* используется для одной завершённой прогулки.'
    note: 'Видовые пары: несовершенный вид (*wyprowadzać*) — для повторяющегося действия, совершенный (*wyprowadzić*) — для единичного, завершённого.'
  pl.a1.unit26.lesson02.teach.karmic:
    title: Кормить
    gloss: кормить
    example_gloss: Я кормлю кошку каждый день.
  pl.a1.unit26.lesson02.teach.bawic_sie_z:
    title: Играть с
    gloss: играть с
    example_gloss: Томек играет со своим котом.
  pl.a1.unit26.lesson02.teach.codziennie_wyprowadzam_psa_2:
    title: Я выгуливаю собаку каждый день
    gloss: Я выгуливаю собаку каждый день.
    note: Соединяет *wyprowadzać na spacer* с *codziennie* («каждый день»); дополнение *psa* стоит в винительном падеже.
  pl.a1.unit26.lesson02.teach.codziennie_karmie_kota:
    title: Я кормлю кота каждый день
    gloss: Я кормлю кота каждый день.
    note: '*Karmić* («кормить») требует винительного падежа животного: *karmię kota*. Здесь оно соединено с *codziennie*.'
  pl.a1.unit26.lesson03.teach.liczba_mnoga_pies:
    title: 'Множественное число: pies, psy'
    gloss: 'Множественное число: *pies* → *psy*, *kot* → *koty*, *ryba* → *ryby*, *ptak* → *ptaki*. Большинство форм мн. числа оканчивается на *-y*, а после k и g — на *-i*.'
    note: Регулярный образец множественного числа в польском; здесь он впервые показан на примере названий животных.
  pl.a1.unit26.lesson03.teach.psy_koty:
    title: Собаки и кошки
    gloss: собаки / коты
    example_gloss:
    - Марек любит собак.
    - Кася любит кошек.
  pl.a1.unit26.lesson03.teach.ryby_ptaki:
    title: Рыбы и птицы
    gloss: рыбы / птицы
    example_gloss:
    - Я обожаю рыбок.
    - Дедушка обожает птиц.
  pl.a1.unit26.lesson03.teach.kocham_zwierzeta:
    title: Я обожаю животных
    gloss: Я обожаю животных.
    note: '*Kocham* — форма *ja* глагола *kochać*; его дополнение *zwierzęta* стоит в винительном падеже множественного числа.'
  pl.a1.unit26.lesson03.teach.kasia_kocha_koty:
    title: Кася любит кошек, но у неё нет питомца
    gloss: Кася любит кошек, но у неё нет питомца.
    note: 'Готовит противопоставление, на котором построен текст для чтения: любить животных и иметь питомца.'
  pl.a1.unit26.lesson04.teach.marek_masz_zwierzaka:
    title: Марек спрашивает о питомце
    gloss: 'Марек: У тебя есть питомец, Ева?'
  pl.a1.unit26.lesson04.teach.ewa_tak_mam:
    title: У Евы есть собака
    gloss: 'Ева: Да, у меня есть собака.'
  pl.a1.unit26.lesson04.teach.marek_jak_on:
    title: Марек спрашивает, как он выглядит
    gloss: 'Марек: Как он выглядит?'
    note: Повторяется вопрос *Jak wygląda ...?* из прежнего урока, теперь о животном; *on* может относиться к собаке.
  pl.a1.unit26.lesson04.teach.ewa_ma_brazowa:
    title: Ева описывает свою собаку
    gloss: 'Ева: У него коричневая шерсть, и он маленький.'
    note: Слова о цвете волос и размере из раздела о внешности, но теперь они описывают шерсть животного, а не волосы человека.
  pl.a1.unit26.lesson04.teach.zwierzeta_maja_rodzaj:
    title: On и ona для животных
    gloss: 'У животных есть грамматический род: *on* («он») для *pies* и *kot*, *ona* («она») для *ryba*. Эти местоимения могут относиться и к животному, а не только к человеку.'
    note: 'Местоимение следует роду существительного: *pies* и *ptak* требуют *on*, *ryba* — *ona*, а *zwierzę* — *ono*.'
  pl.a1.unit26.lesson04.teach.marek_codziennie_wyprowadzasz:
    title: Марек спрашивает о прогулках
    gloss: 'Марек: Ты выгуливаешь его каждый день?'
  pl.a1.unit26.lesson04.teach.ewa_tak_codziennie:
    title: Эва рассказывает о своём распорядке дня
    gloss: 'Эва: Да, я каждый день вывожу его на прогулку и кормлю его.'
  pl.a1.unit26.lesson05.teach.marek_i_kasia:
    title: Марек, Кася и Томек о животных
    gloss: 'Марек и Кася оба любят животных, но ни у одного из них нет питомца. Марек любит собак, а Кася любит кошек. У Томека есть питомец: кот. Он часто играет со своим котом и каждый день его кормит. А у тебя есть питомец?'
    note: Противопоставляет любовь к животным и наличие собственного питомца — в этом коммуникативный смысл всего раздела.
    glosses:
      kochają: обожать
      oboje: оба
      zwierzęta: животные
      zwierzaka: питомец
      psy: собаки
      koty: коты
      kota: кот
      bawi: играет
      daje: даёт
      co: каждый
      jeść: еда
  pl.a1.unit26.lesson05.teach.tomek_czesto_bawi:
    title: Томек часто играет со своим котом
    gloss: Томек часто играет со своим котом.
    note: 'После *bawić się z* («играть с») стоит творительный падеж: *z kotem*. *Często* — наречие частоты, «часто».'
  pl.a1.unit26.lesson05.teach.kocham_psy_nie:
    title: Я обожаю собак. У меня нет питомца.
    gloss: Я обожаю собак. У меня нет питомца.
    note: Образец ответа из двух предложений, который можно использовать в письменном задании раздела.
  pl.a1.unit26.lesson06.teach.ewa_nino_ty:
    title: Эва спрашивает Нину
    gloss: 'Эва: Нина, а у тебя тоже есть питомец?'
  pl.a1.unit26.lesson06.teach.nina_tak_mam:
    title: У Nina есть птица по имени Pico
    gloss: 'Nina: Да, у меня есть птица. Её зовут Pico.'
    note: '*Ma na imię* («его зовут») — та же конструкция, которой мы раньше называли имя.'
  pl.a1.unit26.lesson06.teach.marek_jak_milo:
    title: Реакция Марека
    gloss: 'Марек: Как мило! Что ты делаешь с ним каждый день?'
  pl.a1.unit26.lesson06.teach.nina_codziennie_go:
    title: Nina кормит птицу каждый день
    gloss: 'Nina: Я кормлю его каждый день.'
  pl.a1.unit26.lesson06.teach.marek_ja_tez:
    title: Марек тоже любит птиц
    gloss: 'Марек: Я тоже люблю птиц.'
  pl.a1.unit26.lesson06.teach.ewa_fajnie_ze:
    title: Эва завершает разговор
    gloss: 'Эва: Здорово, что мы втроём любим животных!'
    note: Подводит итог всем фактам о животных, которые рассказали три героя раздела.
