answer_policy:
  diacritics: 'Same standing policy as unit01: display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent when every other letter and word is correct. Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.'
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Ewa, Marek).
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Польский A1
units:
  pl.a1.unit02.numbers:
    title: Числа
lessons:
  pl.a1.unit02.lesson01.numbers_zero_to_ten:
    title: Числа от нуля до десяти
  pl.a1.unit02.lesson02.numbers_and_prices:
    title: Числа от одиннадцати до ста и цены
  pl.a1.unit02.lesson03.phone_and_age:
    title: Номер телефона и возраст
teaching:
  pl.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: ноль
    note: Отправная точка для всех чисел в этом разделе.
    example_gloss: Сегодня ноль градусов.
  pl.a1.unit02.lesson01.teach.jeden:
    title: Один
    gloss: один
    note: После *jeden* стоит обычное существительное в единственном числе — в отличие от всех остальных чисел этого урока.
    example_gloss: У меня один телефон.
  pl.a1.unit02.lesson01.teach.dwa:
    title: Два
    gloss: два
    note: После *dwa*, *trzy* и *cztery* существительное стоит в особой форме множественного числа (как *psy*, «собаки») — она отличается от формы после *pięć* и далее.
    example_gloss: У меня две собаки.
  pl.a1.unit02.lesson01.teach.trzy:
    title: Три
    gloss: три
    note: 'Та же модель множественного числа, что и после *dwa*: *trzy złote* (три злотых), а не *trzy złotych*.'
    example_gloss: Кофе стоит три злотых.
  pl.a1.unit02.lesson01.teach.cztery:
    title: Четыре
    gloss: четыре
    note: Последнее из трёх чисел (*dwa*, *trzy*, *cztery*) с такой моделью множественного числа.
    example_gloss: У меня четыре книги.
  pl.a1.unit02.lesson01.teach.piec:
    title: Пять
    gloss: пять
    note: Начиная с *pięć*, после числа ставится другая форма множественного числа (родительный падеж мн. числа, например *minut*, а не *minuty*) — эта модель сохраняется до конца раздела.
    example_gloss: У меня есть пять минут.
  pl.a1.unit02.lesson01.teach.szesc:
    title: Шесть
    gloss: шесть
    note: 'Та же модель родительного падежа мн. числа, что и после *pięć*: *sześć jabłek* (шесть яблок).'
    example_gloss: У меня шесть яблок.
  pl.a1.unit02.lesson01.teach.siedem:
    title: Семь
    gloss: семь
    note: Полезное число, когда говоришь о днях недели.
    example_gloss: В неделе семь дней.
  pl.a1.unit02.lesson01.teach.osiem:
    title: Восемь
    gloss: восемь
    note: '*Mam osiem lat* буквально значит «я имею восемь лет»: в польском возраст выражается глаголом *mieć* («иметь»), а не формой «мне восемь лет», как в русском. Эту модель ты полностью отработаешь в уроке 3.'
    example_gloss: Мне восемь лет.
  pl.a1.unit02.lesson01.teach.dziewiec:
    title: Девять
    gloss: девять
    note: 'Снова родительный падеж мн. числа: *dziewięć osób* (девять человек).'
    example_gloss: Девять человек стоят в очереди.
  pl.a1.unit02.lesson01.teach.dziesiec:
    title: Десять
    gloss: десять
    note: Последнее из однозначных чисел — урок 2 продолжается числами от 11 и десятками.
    example_gloss: У меня десять пальцев.
  pl.a1.unit02.lesson02.teach.jedenascie:
    title: Одиннадцать
    gloss: одиннадцать
    note: 'Числа 11–19 оканчиваются на *-naście*, как русские числа на «-надцать». Как и *pięć* и далее, они требуют родительного падежа мн. числа: *jedenaście osób*.'
    example_gloss: В классе одиннадцать человек.
  pl.a1.unit02.lesson02.teach.dwanascie:
    title: Двенадцать
    gloss: двенадцать
    note: Та же модель *-naście*, что и в *jedenaście*.
    example_gloss: В году двенадцать месяцев.
  pl.a1.unit02.lesson02.teach.pietnascie:
    title: Пятнадцать
    gloss: пятнадцать
    note: 'Всё та же модель чисел на *-naście*: *piętnaście minut* (пятнадцать минут).'
    example_gloss: У меня пятнадцатиминутный перерыв.
  pl.a1.unit02.lesson02.teach.dwadziescia:
    title: Двадцать
    gloss: двадцать
    note: Числа 20–40 оканчиваются на *-dzieści* — это другая модель, чем у чисел на *-naście*. Само *dwadzieścia* по-прежнему требует родительного падежа мн. числа (*dwadzieścia lat*), но в уроке 3 посмотри, что происходит, когда к нему добавляется единица.
    example_gloss: Мне двадцать лет.
  pl.a1.unit02.lesson02.teach.dwadziescia_jeden:
    title: Двадцать один
    gloss: двадцать один
    note: 'Составные числа строятся так же, как в русском: сначала десяток, потом единица, без соединительного слова.'
  pl.a1.unit02.lesson02.teach.trzydziesci:
    title: Тридцать
    gloss: тридцать
    note: Всё та же модель *-dzieści*, что и в *dwadzieścia*.
    example_gloss: Билет стоит тридцать злотых.
  pl.a1.unit02.lesson02.teach.piecdziesiat:
    title: Пятьдесят
    gloss: пятьдесят
    note: Числа 50–90 переходят на третью модель, *-dziesiąt*, вместо *-dzieści*.
    example_gloss: У меня пятьдесят злотых.
  pl.a1.unit02.lesson02.teach.sto:
    title: Сто
    gloss: сто
    note: Круглое число без составных окончаний, о которых надо думать.
    example_gloss: Это стоит сто злотых.
  pl.a1.unit02.lesson02.teach.ile:
    title: Сколько
    gloss: сколько
    note: Вопросительное слово для любого вопроса о количестве или цене.
    example_gloss: Сколько это стоит?
  pl.a1.unit02.lesson02.teach.ile_to_kosztuje:
    title: Вопрос о цене
    gloss: Сколько это стоит?
    note: '*Kosztować* («стоить») — глагол, а *to* («это») — подлежащее. Весь вопрос — устойчивая и очень частая конструкция.'
  pl.a1.unit02.lesson02.teach.to_kosztuje_dwadziescia:
    title: Называем цену
    gloss: Это стоит двадцать злотых.
    note: '*Złotych* — родительный падеж мн. числа от *złoty* (польская валюта); такую же форму требует и само *dwadzieścia*.'
  pl.a1.unit02.lesson03.teach.jaki_jest_pana_numer:
    title: Спросить номер телефона у мужчины
    gloss: Какой у вас номер телефона? (мужчине, на вы)
    note: 'Буквально «какой номер телефона господина». *Pana* — притяжательная форма (родительный падеж) от *pan*: «господина», то есть «ваш».'
  pl.a1.unit02.lesson03.teach.jaki_jest_pani_numer:
    title: Спросить номер телефона у женщины
    gloss: Какой у вас номер телефона? (женщине, на вы)
    note: Замени *pana* на *pani*, чтобы вежливо обратиться к женщине, как в модели из раздела 1.
  pl.a1.unit02.lesson03.teach.jaki_jest_twoj_numer:
    title: Спросить номер телефона на ты
    gloss: Какой у тебя номер телефона? (на ты)
    note: '*Twój* («твой») заменяет *pana*/*pani* в разговоре с другом или ровесником.'
  pl.a1.unit02.lesson03.teach.numer_to:
    title: 'Назвать номер: начало фразы'
    gloss: Номер — ...
    note: Короткое естественное вступление перед тем, как назвать цифры по одной, — так поляки обычно диктуют номер телефона.
  pl.a1.unit02.lesson03.teach.przykladowy_numer:
    title: Пример номера телефона
    gloss: Шесть, один, пять, ноль, два.
    note: Здесь номер телефона читается по одной цифре, а все цифры уже изучены в этом разделе.
  pl.a1.unit02.lesson03.teach.ile_masz_lat:
    title: Спросить возраст на ты
    gloss: Сколько тебе лет? (неформально)
    note: 'Буквально «сколько лет ты имеешь»: в польском возраст выражается глаголом *mieć* («иметь») — та же модель, что мы видели на карточке *osiem* в уроке 1.'
  pl.a1.unit02.lesson03.teach.ile_pan_ma_lat:
    title: Спросить возраст вежливо
    gloss: Сколько вам лет? (мужчине, на вы)
    note: '*Ma* — та же форма третьего лица, которую мы видели в *pan jest*/*pan ma* в разделе 1: *pan* грамматически ведёт себя как «господин», то есть как подлежащее третьего лица.'
  pl.a1.unit02.lesson03.teach.mam_dwadziescia_osiem_lat:
    title: Назвать свой возраст
    gloss: Мне двадцать восемь лет.
    note: '*Mam* — форма первого лица от *mieć* («иметь»). *Dwadzieścia osiem* оканчивается на *osiem* (восемь), поэтому, как и все числа на 5–9, требует *lat*. В диалоге урока 3 найди число с другим окончанием.'
  pl.a1.unit02.lesson03.teach.dialogue.line01:
    title: Эва спрашивает номер Марека
    gloss: Эва вежливо спрашивает у Марека номер телефона.
    note: Точно тот же вежливый вопрос о номере телефона из этого урока.
  pl.a1.unit02.lesson03.teach.dialogue.line02:
    title: Марек называет свой номер
    gloss: Марек диктует свой номер телефона по цифрам.
    note: Все цифры здесь уже изучены в уроках 1–2 этого раздела.
  pl.a1.unit02.lesson03.teach.dialogue.line03:
    title: Эва спрашивает возраст Марека
    gloss: Эва благодарит и вежливо спрашивает о возрасте.
    note: '*Dziękuję* («спасибо») и *A* («а») не зависят от формальности, как и карточка *dziękuję* в разделе 1.'
  pl.a1.unit02.lesson03.teach.dialogue.line04:
    title: Марек называет возраст и задаёт тот же вопрос в ответ
    gloss: Марек говорит, что ему двадцать восемь, и вежливо спрашивает возраст Эвы.
    note: '*A pani?* вежливо возвращает вопрос женщине — по той же короткой модели, что и *A pan?* в разделе 1.'
  pl.a1.unit02.lesson03.teach.dialogue.line05:
    title: Эва называет свой возраст
    gloss: Эва говорит, что ей тридцать два.
    note: '*Trzydzieści dwa* оканчивается на *dwa* (два), поэтому, в отличие от *dwadzieścia osiem* (оканчивается на «восемь» и требует *lat*), здесь нужно *lata*. Числа на 2, 3, 4 (кроме 12–14) используют эту другую форму. Это реальная тонкость: *lat* и *lata* не взаимозаменяемы, и выбор зависит от последней цифры числа — похоже на русское «два года» и «пять лет».'
  pl.a1.unit02.lesson03.teach.dialogue.line06:
    title: Марек завершает разговор
    gloss: Марек говорит, что было приятно поговорить, и прощается.
    note: '*Do zobaczenia* — прощание «до встречи» из раздела 1.'
