  pl.a1.unit38.lesson03.teach.lubie_pora_roku:
    title: Конструкция Lubię
    gloss: '*Lubię* + время года говорит, какое время года тебе нравится: *Lubię lato.* Время года стоит в винительном падеже: *wiosnę*, *zimę*.'
    note: 'После *Lubię* («мне нравится») ставится винительный падеж: существительные женского рода на *-a* меняют окончание на *-ę* (*zima* -> *zimę*, *wiosna* -> *wiosnę*), а *jesień* и *lato* (существительное на *-o*) выглядят так же, как в именительном. Чтобы сказать, что ты думаешь о времени года, используй *Uważam* + винительный падеж + *za* + прилагательное: *Uważam jesień za ładną*.'
