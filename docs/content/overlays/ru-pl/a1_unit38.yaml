  pl.a1.unit38.lesson05.teach.teraz_jest_wiosna:
    title: Разговор о временах года
    gloss: 'Сейчас весна. Тюльпаны красивые. Nina спрашивает: Какое время года ты считаешь красивым? Marek говорит: Я люблю лето. Летом мы плаваем. Ewa говорит: Я люблю зиму. Зимой мы катаемся на коньках.'
    note: 'Краткий пересказ разговора в языковом кафе: реплики героев переданы прямой речью.'
    glosses:
      wiosna: весна
      Tulipany: тюльпаны
      ładne: красивые
      pyta: спрашивает
      porę: время года
      uważasz: считать, находить
      mówi: говорит
      lato: лето
      Lubię: приятный / весёлый
      pływamy: плаваем
      zimę: зима
      łyżwach: катаемся на коньках
  pl.a1.unit38.lesson05.teach.rozmowa_o_porach:
