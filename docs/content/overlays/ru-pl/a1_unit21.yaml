teaching:
  pl.a1.unit21.lesson01.teach.szczesliwy_smutny_zly:
    title: Радость, грусть и злость
    gloss: рад, грустный, сердитый
    note: Три базовых слова для чувств с *jestem* (я есть). Это мужские формы; женщина скажет *szczęśliwa, smutna, zła*.
    example_gloss:
    - Я рад.
    - Мне грустно.
    - Я сержусь.
  pl.a1.unit21.lesson01.teach.jestem_szczesliwy:
    title: Говорим, что ты рад
    gloss: Я счастлив.
    note: '*Jestem* (я есть, от *być*) + прилагательное — основная модель. В русском в настоящем времени связку обычно опускают («Я счастлив»), а в польском jestem нужно произносить. Прилагательное согласуется с говорящим: *szczęśliwy* (мужчина), *szczęśliwa* (женщина).'
  pl.a1.unit21.lesson01.teach.nie_jestem_zly:
    title: Противопоставляем чувства
    gloss: Я не сержусь, мне грустно.
    note: '*Nie* стоит прямо перед глаголом: *Nie jestem zły*. Вторая часть называет настоящее чувство.'
  pl.a1.unit21.lesson02.teach.dlaczego_jestes_szczesliwy:
    title: Спрашиваем «почему»
    gloss: Почему ты рад?
    note: '*Dlaczego* (почему) — стандартное вопросительное слово для причины.'
  pl.a1.unit21.lesson02.teach.jestem_szczesliwy_bo:
    title: Называем причину
    gloss: Я рад, потому что у меня новая квартира.
    note: '*Bo* (потому что) вводит причину; после *mam* (у меня есть) существительное стоит в винительном падеже: *nowe mieszkanie*.'
  pl.a1.unit21.lesson02.teach.jestem_smutny_bo:
    title: Грустная причина
    gloss: Мне грустно, потому что идёт дождь.
    note: '*Pada deszcz* (идёт дождь, буквально «дождь падает») — обычное выражение о погоде, здесь оно служит причиной.'
  pl.a1.unit21.lesson03.teach.zdenerwowany:
    title: Нервный
    gloss: нервный
    note: Обычное слово для обозначения волнения.
    example_gloss: Я нервничаю перед своей первой сменой.
  pl.a1.unit21.lesson03.teach.jestem_zdenerwowany_przed:
    title: Говорим, из-за чего ты нервничаешь
    gloss: Я нервничаю перед своей первой сменой.
    note: '*Przed* (буквально «перед») + творительный падеж показывает, перед чем волнуешься, как и в русском «перед первой сменой»: *przed pierwszą zmianą*.'
  pl.a1.unit21.lesson03.teach.nie_martw_sie:
    title: Успокаиваем человека
    gloss: Не волнуйся.
    note: '*Nie martw się* (буквально «не тревожь себя») — стандартная фраза, чтобы успокоить; *się* — возвратное местоимение.'
  pl.a1.unit21.lesson04.teach.jak_czuje_sie:
    title: Спрашиваем, как человек себя чувствует
    gloss: Как себя чувствует Марек?
    note: '*Czuć się* (чувствовать себя, возвратный глагол) — стандартный способ спросить о эмоциональном состоянии или описать его: *Jak czuje się Marek?*'
  pl.a1.unit21.lesson04.teach.on_czuje_sie:
    title: Описываем, как человек себя чувствует
    gloss: Он нервничает.
    note: '*Się* остаётся при глаголе: *on czuje się*. Прилагательное мужского рода, как и *on*: *zdenerwowany*.'
  pl.a1.unit21.lesson04.teach.dlaczego_on_czuje:
    title: Спрашиваем, почему человек так себя чувствует
    gloss: Почему он нервничает?
    note: Соединяет *dlaczego* (почему) с оборотом *czuje się* из фразы *On czuje się zdenerwowany*.
  pl.a1.unit21.lesson05.teach.czesc_ewo_jestem:
    title: Читаем сообщение о чувствах
    gloss: Привет, Эва, я немного нервничаю перед своей первой самостоятельной сменой. Но я ещё и счастлив, потому что у меня новая работа и новая квартира. Думаю, всё будет хорошо.
    note: Обрати внимание, из-за чего автор нервничает, что его радует и как он смотрит на будущее.
    glosses:
      trochę: немного
      zdenerwowany: нервный, взволнованный
      pierwszą: первый
      zmianą: смена
      samodzielną: один, самостоятельно
      szczęśliwy: довольный
      bo: потому что
      nową: новый
      pracę: работа
      nowe: новый
      mieszkanie: квартира
      myślę: думать
      będzie: 'получится, сложится (здесь: всё будет хорошо)'
  pl.a1.unit21.lesson06.teach.ewa_czesc_marku:
    title: Эва спрашивает, как чувствует себя Марек
    gloss: 'Эва: Привет, Марек, как ты себя чувствуешь перед первой сменой?'
    note: '*Przed pierwszą zmianą* (перед первой сменой) повторяет модель *przed* + творительный падеж из урока 3. *Czujesz się* — форма для *ty*.'
  pl.a1.unit21.lesson06.teach.marek_szczerze_mowiac:
    title: Марек признаётся, что нервничает
    gloss: 'Марек: Честно говоря, я немного нервничаю.'
    note: '*Szczerze mówiąc* (честно говоря, буквально «говоря искренне») смягчает признание.'
  pl.a1.unit21.lesson06.teach.ewa_nie_martw:
    title: Эва его успокаивает
    gloss: 'Эва: Не волнуйся, ты хорошо справишься!'
    note: '*Dobrze sobie poradzisz* (буквально «ты хорошо справишься») — ободряющее устойчивое выражение; *poradzisz* — форма будущего времени для *ty* от *poradzić sobie*.'
  pl.a1.unit21.lesson06.teach.marek_dzieki_to:
    title: Марек благодарит её
    gloss: 'Марек: Спасибо, это правда помогает.'
    note: '*Pomaga* — форма *on/ona/ono* от *pomagać* (помогать); *dzięki* — неформальное «спасибо».'
  pl.a1.unit21.lesson06.teach.ewa_a_potem:
    title: Эва предсказывает, чем всё кончится
    gloss: 'Эва: А потом ты наверняка будешь очень счастлив и горд.'
    note: '*Na pewno* (наверняка) выражает уверенное предсказание; *dumny* (гордый) — новое полезное прилагательное. *Będziesz* — будущее время от *być*.'
  pl.a1.unit21.lesson06.teach.marek_tak_ja:
    title: Марек соглашается
    gloss: 'Марек: Да, я тоже так думаю.'
    note: '*Ja też tak myślę* (буквально «я тоже так думаю») — естественный способ согласиться; *ja* здесь добавлено для противопоставления.'
  pl.a1.unit21.lesson06.teach.marek_jest_zdenerwowany:
    title: Обобщаем с помощью jest и mu
    gloss: Марек волнуется перед первой сменой. Эва ему помогает.
    note: '*Jest* — форма *on/ona* от *być* (быть); *mu* значит «ему» (дательный падеж, потому что *pomagać* требует дательного). Маленькие слова, но без них не рассказать о другом человеке.'
