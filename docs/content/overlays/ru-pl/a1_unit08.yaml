teaching:
  pl.a1.unit08.lesson01.teach.bank_poczta:
    title: Банк, почта
    gloss: банк; почта
    note: 'Два обычных повседневных дела: bank похоже на русское «банк», а poczta — место, куда идут, чтобы отправить письмо или посылку.'
    example_gloss:
    - Это банк.
    - Это почта.
  pl.a1.unit08.lesson01.teach.apteka_restauracja:
    title: Аптека, ресторан
    gloss: аптека; ресторан
    note: Apteka — место, где покупают лекарства (а не обычный магазин); restauracja похоже на русское «ресторан».
    example_gloss:
    - Это аптека.
    - Это ресторан.
  pl.a1.unit08.lesson01.teach.hotel_park:
    title: Hotel, park
    gloss: отель; парк
    note: Оба слова похожи на русские — их легко узнать и на письме, и на слух.
    example_gloss:
    - Это отель.
    - Это парк.
  pl.a1.unit08.lesson01.teach.gdzie_jest_note:
    title: Где находится + [место]?
    gloss: 'Где находится + [место]? — Gdzie («где») вместе с jest («есть, находится») спрашивает о местоположении: Где банк? Где аптека?'
    note: '*Gdzie* означает «где», а *jest* — «есть, находится». Вместе *Gdzie jest...?* — обычная модель вопроса о том, где находится то или иное место. Используй её так, как есть, когда спрашиваешь об одном месте; если мест несколько, в польском вместо неё появляется *są* («находятся»).'
  pl.a1.unit08.lesson01.teach.gdzie_jest_bank:
    title: Где банк?
    gloss: Где находится банк?
    note: Модель из грамматической заметки в деле — с первым словом урока, обозначающим место.
  pl.a1.unit08.lesson02.teach.blisko_daleko:
    title: Близко, далеко
    gloss: близко; далеко
    note: Простая пара противоположностей; употребляется прямо после jest, чтобы сказать, близко или далеко находится место.
    example_gloss:
    - Парк близко.
    - Отель далеко.
  pl.a1.unit08.lesson02.teach.niedaleko:
    title: Недалеко
    gloss: недалеко
    note: Буквально *nie* («не») плюс *daleko* («далеко»), слитые в одно слово, как и в русском. Это более мягкий и очень частый способ заверить, что до места легко добраться.
    example_gloss: Аптека недалеко.
  pl.a1.unit08.lesson02.teach.obok_naprzeciwko:
    title: Рядом, напротив
    gloss: рядом с; напротив
    note: Оба слова указывают положение места относительно ориентира, а не просто говорят, как оно близко. После обоих следующее существительное ставится в родительный падеж — см. грамматическую заметку этого урока.
    example_gloss:
    - Аптека рядом с банком.
    - Ресторан напротив отеля.
  pl.a1.unit08.lesson02.teach.genitive_note:
    title: 'После ''obok''/''naprzeciwko''/''blisko + существительное'': родительный падеж'
    gloss: 'После «рядом с»/«напротив»/«близко от + место» — родительный падеж: bank → банка, hotel → отеля, park → парка. Аптека рядом с банком. Ресторан напротив отеля. Ресторан близко от парка.'
    note: 'После *obok*, *naprzeciwko* и *blisko* (когда за ним следует место, а не стоит само по себе) нужен родительный падеж, поэтому следующее существительное меняет окончание. У этих трёх regularных существительных мужского рода к слову добавляется *-u*: *bank* → *banku*, *hotel* → *hotelu*, *park* → *parku*. Само по себе *blisko* родительного падежа не требует: *To jest blisko* («Это близко») так же правильно, как *blisko parku* («близко от парка»).'
  pl.a1.unit08.lesson02.teach.apteka_obok_banku:
    title: Аптека рядом с банком
    gloss: Аптека рядом с банком.
    note: 'Окончание -u из грамматической заметки в настоящем предложении: после obok слово bank превращается в banku.'
  pl.a1.unit08.lesson03.teach.przepraszam:
    title: Извините
    gloss: извините / простите
    note: Обычный способ привлечь внимание незнакомого человека перед вопросом — говорится до вопроса, а не после него.
    example_gloss: Извините, где банк?
  pl.a1.unit08.lesson03.teach.dialogue.line01:
    title: Ewa спрашивает, где аптека
    gloss: Ewa говорит «извините» и спрашивает, где аптека.
    note: 'Przepraszam открывает вопрос, как сказано в заметке к лексике этого урока: даже с хорошо знакомым человеком, как Marek, это вежливый способ обратиться, прежде чем что-то спросить.'
  pl.a1.unit08.lesson03.teach.dialogue.line02:
    title: Marek говорит, где находится аптека
    gloss: Marek говорит, что аптека недалеко, рядом с банком.
    note: Сочетает niedaleko и obok + banku — оба из грамматической заметки второго урока.
  pl.a1.unit08.lesson03.teach.dialogue.line03:
    title: Ewa благодарит Marka и спрашивает о ресторане
    gloss: Ewa говорит «спасибо» и спрашивает, где ресторан.
    note: Dziękuję уже встречалось в прошлых уроках; A («а») связывает новый вопрос с предыдущим.
  pl.a1.unit08.lesson03.teach.dialogue.line04:
    title: Марек объясняет, где находится ресторан
    gloss: Марек говорит, что ресторан напротив отеля, рядом с парком.
    note: Naprzeciwko + hotelu (родительный падеж, как в banku) и blisko для второго ориентира.
  pl.a1.unit08.lesson03.teach.dialogue.line05:
    title: Ева снова благодарит Марека
    gloss: Ева говорит «большое спасибо».
    note: Bardzo («очень») усиливает dziękuję, так же как в proszę bardzo.
  pl.a1.unit08.lesson03.teach.dialogue.line06:
    title: Марек отвечает
    gloss: Марек говорит «пожалуйста».
    note: Proszę bardzo — стандартный ответ на благодарность, он уже встречался в теме о покупках.
