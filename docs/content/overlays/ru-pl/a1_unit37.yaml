    title: Нина и Эва покупают тюльпаны
    gloss: Нина и Эва идут в субботу на цветочный рынок. Какой цвет хочет Эва? Эва хотела бы красные. Какой цвет хочет Нина? Нина хотела бы жёлтые. Они покупают пять тюльпанов. Это стоит двадцать пять злотых. Тюльпаны очень красивые!
