teaching:
  pl.a1.unit15.lesson01.teach.dworzec:
    title: Вокзал
    gloss: вокзал
    note: Место, откуда отправляются и куда прибывают поезда и автобусы, — отправная точка всего этого раздела.
    example_gloss: Вокзал недалеко от отеля.
  pl.a1.unit15.lesson01.teach.bilet:
    title: Билет
    gloss: билет
    note: Он понадобится тебе, прежде чем сесть в поезд или автобус.
    example_gloss: Билет стоит двадцать злотых.
  pl.a1.unit15.lesson01.teach.peron:
    title: Платформа
    gloss: платформа
    note: Место, где ты стоишь и ждёшь свой поезд.
    example_gloss: Платформа номер один вон там.
  pl.a1.unit15.lesson01.teach.peron_numer_note:
    title: Платформа номер один, два...
    gloss: 'Чтобы назвать номер платформы, можно сказать Peron numer + число: Peron numer jeden, Peron numer dwa.'
    note: 'Проще, чем кажется: *peron* + *numer* + обычное число, которое ты уже знаешь. (В объявлениях на вокзале часто используют порядковые числительные, например *peron pierwszy* — «первая платформа», — но *peron numer jeden* поймут всегда.)'
  pl.a1.unit15.lesson01.teach.pociag_recap:
    title: Поезд — ещё раз
    gloss: Pociąg odjeżdża o czwartej po południu — это предложение ты уже знаешь из урока о времени.
    note: Тот же факт из раздела о времени, теперь в сцене путешествия.
  pl.a1.unit15.lesson01.teach.krakow:
    title: Краков
    gloss: Краков
    note: Настоящий польский город — первый пункт назначения в этом разделе.
    example_gloss: Краков далеко.
  pl.a1.unit15.lesson01.teach.do_krakowa_note:
    title: В Краков
    gloss: 'Когда мы куда-то едем, мы говорим do + другая форма названия города: do Krakowa (не do Kraków). Запомни эту форму целиком.'
    note: Не пытайся выводить *Krakowa* по правилу — пока просто выучи *do Krakowa* как одно устойчивое выражение.
  pl.a1.unit15.lesson01.teach.bilet_do_krakowa:
    title: Билет до Кракова, пожалуйста
    gloss: Билет до Кракова, пожалуйста.
    note: Именно эту фразу говорят в кассе.
  pl.a1.unit15.lesson01.teach.jechac_note:
    title: To go (by vehicle)
    gloss: 'Jechać (ехать): jadę (я еду), jedzie (он/она едет). Завтра я еду в Краков. Марек едет в Краков.'
    note: 'Пока всего две формы: *jadę* — о себе, *jedzie* — о ком-то другом.'
  pl.a1.unit15.lesson01.teach.marek_jedzie:
    title: Марек едет в Краков
    gloss: Марек завтра едет в Краков.
    note: Собственная поездка Марека — его история продолжается в диалоге этого урока.
  pl.a1.unit15.lesson02.teach.autobus:
    title: Автобус
    gloss: автобус
    note: Ещё один распространённый способ ездить между городами.
    example_gloss: Автобус на вокзале.
  pl.a1.unit15.lesson02.teach.warszawa:
    title: Варшава
    gloss: Варшава
    note: Столица Польши — второй пункт назначения в этом уроке.
    example_gloss: Варшава далеко.
  pl.a1.unit15.lesson02.teach.do_warszawy_note:
    title: В Варшаву
    gloss: 'Варшава изменяется иначе, чем Краков: do Warszawy (а не do Warszawa). У каждого города своя форма — запомни обе отдельно.'
    note: Формы *Krakowa* и *Warszawy* образуются не по одной и той же модели — именно поэтому каждую из них запоминают отдельно, а не как одно общее правило.
  pl.a1.unit15.lesson02.teach.dokad:
    title: Куда
    gloss: куда
    note: Спрашивает о цели движения, а не о месте — это не то же самое, что спросить «где» что-то находится.
    example_gloss: Куда едет автобус?
  pl.a1.unit15.lesson02.teach.godzina_recap:
    title: Снова «в семь»
    gloss: Siódmej — эту форму часа ты уже знаешь из урока о времени (o siódmej = в семь часов).
    note: Та же модель формы часа (местный падеж), только теперь для времени отправления.
  pl.a1.unit15.lesson02.teach.autobus_odjezdza:
    title: Автобус в Варшаву отправляется в семь
    gloss: Автобус в Варшаву отправляется в семь.
    note: Объединяет модели этого урока — направление и время — в одном настоящем предложении.
  pl.a1.unit15.lesson02.teach.kiedy_recap:
    title: Снова «когда»
    gloss: Kiedy — это слово ты уже знаешь из урока о датах. Когда отправляется автобус?
    note: Естественный вопрос перед поездкой.
  pl.a1.unit15.lesson02.teach.ewa_jedzie:
    title: Эва едет в Варшаву
    gloss: Эва завтра едет в Варшаву.
    note: Собственная поездка Эвы — её история продолжается в диалоге этого урока вместе с историей Марека.
  pl.a1.unit15.lesson03.teach.ja_recap:
    title: Снова «я»
    gloss: Ja — это слово ты уже знаешь из прошлых уроков.
    note: Короткое напоминание перед диалогом этого урока.
  pl.a1.unit15.lesson03.teach.moj_recap:
    title: Снова «мой»
    gloss: Mój — это слово ты уже знаешь из урока о семье.
    note: Короткое напоминание перед диалогом этого урока.
  pl.a1.unit15.lesson03.teach.dziesiatej_rano_note:
    title: Снова «в десять утра»
    gloss: Dziesiątej и rano — обе формы ты уже знаешь из урока о времени (o dziesiątej rano = в десять утра).
    note: Короткое напоминание перед диалогом этого урока.
  pl.a1.unit15.lesson03.teach.dziekuje_recap:
    title: Спасибо и до встречи
    gloss: Dziękuję и Do zobaczenia — эти выражения ты уже знаешь из прошлых уроков.
    note: Короткое напоминание перед диалогом этого урока.
  pl.a1.unit15.lesson03.teach.mila_podrozy_note:
    title: Счастливого пути!
    gloss: Miłej podróży! — так желают человеку хорошей поездки. Это выражение используется целиком, его не переводят слово за словом.
    note: Устойчивое прощальное пожелание — выучи его как единое целое, так же как ты уже выучил *Dzień dobry*.
  pl.a1.unit15.lesson03.teach.dialogue.line01:
    title: Марек завтра едет в Краков
    gloss: Завтра я еду в Краков. Мой поезд отправляется в четыре часа дня.
    note: Марек начинает с рассказа о своём плане поездки — об этом мы уже узнали о нём в первом уроке.
  pl.a1.unit15.lesson03.teach.dialogue.line02:
    title: Эва завтра едет в Варшаву
    gloss: Я еду в Варшаву. Мой автобус отправляется в десять утра.
    note: Эва рассказывает о своём плане — об этом мы уже узнали о ней во втором уроке.
  pl.a1.unit15.lesson03.teach.dialogue.line03:
    title: Марек желает Эве счастливого пути
    gloss: Счастливого пути!
    note: Марек использует новое выражение этого урока, чтобы пожелать Эве добра.
  pl.a1.unit15.lesson03.teach.dialogue.line04:
    title: Эва благодарит Марека и прощается
    gloss: Спасибо! До встречи!
    note: Простое привычное завершение разговора.
