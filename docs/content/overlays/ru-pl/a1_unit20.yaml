teaching:
  pl.a1.unit20.lesson01.teach.recap_jest_sa_to_poprosze:
    title: Jest, są, To, Poproszę — снова
    gloss: Jest, są, To, Poproszę, Ile, kosztuje, złotych, chcę, do — ты уже знаешь эти слова из прошлых уроков.
    note: Краткое напоминание перед тем, как в этом уроке они пригодятся для разговора о покупке одежды.
  pl.a1.unit20.lesson01.teach.sklep:
    title: Магазин
    gloss: магазин
    note: Общее слово для магазина.
    example_gloss: Я иду в магазин.
  pl.a1.unit20.lesson01.teach.koszula:
    title: Рубашка
    gloss: рубашка
    note: Существительное женского рода — к нему подходят формы прилагательных женского рода.
    example_gloss: Это рубашка.
  pl.a1.unit20.lesson01.teach.spodnie:
    title: Брюки
    gloss: брюки
    note: В польском всегда во множественном числе, даже если речь об одной паре — формы единственного числа нет.
    example_gloss: Это брюки.
  pl.a1.unit20.lesson01.teach.kupic:
    title: Покупать
    gloss: покупать
    note: 'Употребляется после «*chcę*» (я хочу), как «*iść*» (идти) в одном из прошлых уроков: «*chcę kupić*» — я хочу купить.'
    example_gloss: Я хочу купить рубашку.
  pl.a1.unit20.lesson01.teach.chce_kupic_spodnie_phrase:
    title: Я хочу купить брюки
    gloss: Я хочу купить брюки.
    note: Та же конструкция chcę + инфинитив, но с брюками.
  pl.a1.unit20.lesson01.teach.ile_kosztuje_koszula_phrase:
    title: Сколько стоит рубашка?
    gloss: Сколько стоит рубашка?
    note: Естественный способ спросить цену конкретной вещи; «*Ile kosztuje*» ты уже знаешь из урока о покупках.
  pl.a1.unit20.lesson02.teach.jaki_note:
    title: Какой — форма мужского рода
    gloss: Jaki, Jaka — «*Jaki*» спрашивает о существительных мужского рода, «*Jaka*» — женского рода («*Jaka*» ты уже знаешь из урока о погоде).
    note: «*Kolor*» (цвет) — мужского рода, поэтому оно сочетается с «*Jaki*», а не с «*Jaka*».
  pl.a1.unit20.lesson02.teach.kolor:
    title: Цвет
    gloss: цвет
    note: Существительное мужского рода.
    example_gloss: Какого цвета?
  pl.a1.unit20.lesson02.teach.sukienka:
    title: Платье
    gloss: платье
    note: Ещё одно существительное женского рода, как «*koszula*».
    example_gloss: Это платье.
  pl.a1.unit20.lesson02.teach.niebieska_note:
    title: Синий
    gloss: Koszula jest niebieska. — «*niebieska*» согласуется с существительными женского рода, например «*koszula*».
    note: 'Только эта форма: в курсе пока она связана со словом «*koszula*».'
  pl.a1.unit20.lesson02.teach.czerwona_note:
    title: Красный
    gloss: Sukienka jest czerwona. — «*czerwona*» тоже согласуется с существительными женского рода, как и «*niebieska*».
    note: Здесь эта форма связана со словом «*sukienka*», так же как «*niebieska*» со словом «*koszula*».
  pl.a1.unit20.lesson02.teach.koszula_niebieska_phrase:
    title: Рубашка синяя
    gloss: Рубашка синяя.
    note: Эта фраза пригодится позже, когда Марек будет выбирать рубашку.
  pl.a1.unit20.lesson02.teach.sukienka_czerwona_phrase:
    title: Платье красное
    gloss: Платье красное.
    note: Та же конструкция jest + цвет, но с другой вещью.
  pl.a1.unit20.lesson03.teach.recap_words:
    title: Добрый день, пожалуйста, очень — снова
    gloss: Dzień, dobry, Proszę, bardzo, i, Dobrze, Co — ты уже знаешь эти слова из прошлых уроков.
    note: Краткое напоминание перед диалогом в магазине.
  pl.a1.unit20.lesson03.teach.rozmiar:
    title: Размер
    gloss: размер
    note: В Польше размеры одежды обычно обозначают просто буквами S, M и L, как и во многих других странах.
    example_gloss: Какой размер?
  pl.a1.unit20.lesson03.teach.pan_chce_note:
    title: Господин, хочет
    gloss: Co pan chce kupić? — «*pan*» — вежливое обращение к мужчине, как «*pani*» к женщине («*pani*» ты уже знаешь из урока о покупках).
    note: «*chce*» — форма он/она от «*chcieć*»; «*chcę*» (я хочу) и «*chcesz*» (ты хочешь) ты уже знаешь.
  pl.a1.unit20.lesson03.teach.co_pan_chce_kupic_phrase:
    title: Что вы хотите купить?
    gloss: Что вы хотите купить?
    note: Как продавец вежливо начинает разговор с покупателем-мужчиной.
  pl.a1.unit20.lesson03.teach.dialogue.line01:
    title: Продавец приветствует Марека
    gloss: Добрый день! Что вы хотите купить?
    note: Sprzedawca (продавец) начинает в том же вежливом тоне, что и торговец на рынке в предыдущем уроке о покупках.
  pl.a1.unit20.lesson03.teach.dialogue.line02:
    title: Марек говорит, что хочет купить
    gloss: Я хочу купить рубашку и брюки.
    note: Марек называет обе вещи, которые ищет.
  pl.a1.unit20.lesson03.teach.dialogue.line03:
    title: Продавец спрашивает про размер
    gloss: Какой размер?
    note: Короткий и естественный уточняющий вопрос.
  pl.a1.unit20.lesson03.teach.dialogue.line04:
    title: Марек называет свой размер
    gloss: Размер M.
    note: Марек отвечает просто буквой размера — так говорят естественнее всего.
  pl.a1.unit20.lesson03.teach.dialogue.line05:
    title: Продавец подтверждает наличие и называет цену
    gloss: У нас есть синяя рубашка и брюки. Всего 100 злотых.
    note: '*Mamy* значит «у нас есть» (как *mam*/*masz*). После него *koszula* превращается в *koszulę*, а *niebieska* — в *niebieską*, как и в *Chcę kupić koszulę*. Цвет совпадает с синей рубашкой из урока 2.'
  pl.a1.unit20.lesson03.teach.dialogue.line06:
    title: Марек соглашается
    gloss: Хорошо, я беру.
    note: Марек подтверждает покупку, и разговор заканчивается.
