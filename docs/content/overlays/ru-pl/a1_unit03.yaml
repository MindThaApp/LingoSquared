teaching:
  pl.a1.unit03.lesson01.teach.poniedzialek:
    title: Понедельник
    gloss: понедельник
    note: Первый день недели в польском календаре, как и в русском.
    example_gloss: Сегодня понедельник.
  pl.a1.unit03.lesson01.teach.wtorek:
    title: Вторник
    gloss: вторник
    note: 'Обрати внимание: во фразе «во вторник» перед *wtorek* ставится предлог *we*, а не *w*. Подробнее об этом позже в этом уроке.'
    example_gloss: Сегодня вторник.
  pl.a1.unit03.lesson01.teach.sroda:
    title: Среда
    gloss: среда
    note: Существительное женского рода, в отличие от большинства других дней недели.
    example_gloss: Сегодня среда.
  pl.a1.unit03.lesson01.teach.czwartek:
    title: Четверг
    gloss: четверг
    note: Тот же мужской род, что у *poniedziałek*, *wtorek* и *piątek*.
    example_gloss: Сегодня четверг.
  pl.a1.unit03.lesson01.teach.piatek:
    title: Пятница
    gloss: пятница
    note: 'Этот день ещё встретится в разделе: в него Ewa и Marek планируют новую встречу.'
    example_gloss: Сегодня пятница.
  pl.a1.unit03.lesson01.teach.sobota:
    title: Суббота
    gloss: суббота
    note: Суббота входит в выходные; многие поляки говорят и *weekend* — это заимствованное слово.
    example_gloss: Сегодня суббота.
  pl.a1.unit03.lesson01.teach.niedziela:
    title: Воскресенье
    gloss: воскресенье
    note: Последний из семи дней недели, которые изучаются в этом уроке.
    example_gloss: Сегодня воскресенье.
  pl.a1.unit03.lesson01.teach.jaki_dzien:
    title: Вопрос о дне недели
    gloss: Какой сегодня день недели?
    note: 'Прямой вопрос: *dzień tygodnia* буквально значит «день недели».'
  pl.a1.unit03.lesson01.teach.we_wtorek_note:
    title: Исключение w/we
    gloss: В понедельник, в четверг, в пятницу — но во вторник (для удобства произношения).
    note: 'Для большинства дней недели действует схема «*w* + день», то есть «в такой-то день». *Wtorek* — единственное настоящее исключение: поляки говорят *we wtorek*, а не *w wtorek*, просто потому что так удобнее произносить. Это реальная неправильность, а не опечатка.'
  pl.a1.unit03.lesson01.teach.w_piatek_kino:
    title: В пятницу я иду в кино
    gloss: В пятницу я иду в кино.
    note: '*Piątek* не меняется после *w*; изменились бы только *środa*, *sobota* и *niedziela* (на уровне A1 мы этого не разбираем, чтобы не усложнять).'
  pl.a1.unit03.lesson02.teach.styczen_luty_marzec:
    title: Январь, февраль, март
    gloss: январь; февраль; март
    note: '*Luty* — грамматически особое слово: оно изменяется как прилагательное, а не как обычное существительное (форму «в феврале» ты увидишь позже в этом разделе).'
    example_gloss:
    - Мой день рождения в январе.
    - В феврале я еду в Варшаву.
    - Мой день рождения в марте.
  pl.a1.unit03.lesson02.teach.kwiecien_maj_czerwiec:
    title: Апрель, май, июнь
    gloss: апрель; май; июнь
    note: '*Maj* — месяц, который встречается в обеих датах в истории этого раздела.'
    example_gloss:
    - В апреле я еду в Варшаву.
    - Мой день рождения в мае.
    - В июне я еду в Варшаву.
  pl.a1.unit03.lesson02.teach.lipiec_sierpien_wrzesien:
    title: Июль, август, сентябрь
    gloss: июль; август; сентябрь
    note: 'Ещё одна настоящая неправильность: «в сентябре» будет *we wrześniu*, а не *w wrześniu* — та же замена на *we* для удобства произношения, что и с *wtorek*.'
    example_gloss:
    - В июле я в отпуске.
    - В августе я еду в Варшаву.
    - Мой день рождения в сентябре.
  pl.a1.unit03.lesson02.teach.pazdziernik_listopad_grudzien:
    title: Октябрь, ноябрь, декабрь
    gloss: октябрь; ноябрь; декабрь
    note: Последние три месяца года; вместе с ними набор из двенадцати месяцев полон.
    example_gloss:
    - В октябре я еду в Варшаву.
    - Мой день рождения в ноябре.
    - В декабре я в отпуске.
  pl.a1.unit03.lesson02.teach.urodziny:
    title: День рождения
    gloss: день рождения
    note: '*Urodziny* в польском всегда стоит во множественном числе, даже если речь об одном дне рождения одного человека: слово сочетается с *są* («есть» во мн. ч.), а не с *jest*. Эту особенность ты отработаешь в упражнении позже в этом уроке.'
    example_gloss: Мой день рождения в мае.
  pl.a1.unit03.lesson02.teach.kiedy:
    title: Когда
    gloss: когда
    note: Вопросительное слово для любого вопроса о времени.
    example_gloss: Когда встреча?
  pl.a1.unit03.lesson02.teach.kiedy_sa_twoje_urodziny:
    title: Вопрос о дне рождения
    gloss: Когда у тебя день рождения?
    note: '*Są*, а не *jest*, согласуется с формой множественного числа *urodziny* — об этом говорилось на карточке *urodziny*.'
  pl.a1.unit03.lesson02.teach.moje_urodziny_sa_dziesiatego_maja:
    title: Называем дату дня рождения
    gloss: Мой день рождения десятого мая.
    note: '*Dziesiątego maja*: день оканчивается на *-ego*, месяц — на *-a*, и никакого предлога нет. Так по-польски называют конкретную дату; полную схему смотри в грамматической заметке позже в этом уроке.'
  pl.a1.unit03.lesson02.teach.kiedy_jest_spotkanie:
    title: Вопрос о дате встречи
    gloss: Когда встреча?
    note: '*Spotkanie* (встреча) — слово, которое ты ещё увидишь в диалоге третьего урока.'
  pl.a1.unit03.lesson02.teach.spotkanie_jest_pietnastego_maja:
    title: Называем дату встречи
    gloss: Встреча пятнадцатого мая.
    note: Та же схема даты с *-ego* и *-a*, что и в *dziesiątego maja*, только другое число.
  pl.a1.unit03.lesson02.teach.date_pattern_note:
    title: Как по-польски называют дату
    gloss: 'Дата: день оканчивается на -ego, месяц — на -a (но февраль — lutego), предлога нет — десятого мая, пятнадцатого мая.'
    note: 'Сравни с «в пятницу» (*w piątek*, предлог *w* нужен): при указании конкретной календарной даты всё иначе — предлога нет вообще.'
  pl.a1.unit03.lesson03.teach.kiedy_mozemy_sie_spotkac:
    title: Предлагаем встретиться снова
    gloss: Когда мы можем снова встретиться?
    note: '*Znowu* значит «снова» — естественный способ начать разговор о новой встрече.'
  pl.a1.unit03.lesson03.teach.czy_piatek_panu:
    title: Формально спрашиваем мужчину, подходит ли ему пятница
    gloss: Вам подходит пятница? (мужчине, формально)
    note: '*Panu* — это дательный падеж от *pan*: глагол *odpowiadać* («подходить, устраивать») всегда требует дополнения в дательном падеже, как и в русском: пятница *мне* подходит.'
  pl.a1.unit03.lesson03.teach.czy_piatek_pani:
    title: Формально спрашиваем женщину, подходит ли ей пятница
    gloss: Вам подходит пятница? (женщине, формально)
    note: Чтобы формально обратиться к женщине, замени *panu* на *pani*; *pani* здесь одинаково в именительном и дательном падеже, в отличие от *pan*/*panu*.
  pl.a1.unit03.lesson03.teach.czy_piatek_ci:
    title: Неформально спрашиваем друга, подходит ли ему пятница
    gloss: Тебе подходит пятница? (неформально)
    note: '*Ci* заменяет *panu*/*pani* в разговоре с другом или ровесником — это неформальное «тебе» в дательном падеже.'
  pl.a1.unit03.lesson03.teach.piatek_mi_odpowiada:
    title: Говорим, что пятница нам подходит
    gloss: Пятница мне подходит.
    note: '*Mi* — дательный падеж первого лица, та же модель, что у *panu*/*pani*/*ci*, только со значением «мне», а не «вам/тебе».'
  pl.a1.unit03.lesson03.teach.data:
    title: Дата
    gloss: дата (календарная)
    note: Слово похоже на русское «дата», так что его легко узнать.
    example_gloss: Какого это будет числа?
  pl.a1.unit03.lesson03.teach.jaka_to_bedzie_data:
    title: Спрашиваем, какая будет дата
    gloss: Какого это будет числа?
    note: Естественный следующий вопрос, когда двое уже договорились о дне недели, но ещё не о точной дате.
  pl.a1.unit03.lesson03.teach.dialogue.line01:
    title: Эва предлагает встретиться снова
    gloss: Эва спрашивает Марека, когда они смогут встретиться снова.
    note: Точно повторяет первый вопрос этого урока.
  pl.a1.unit03.lesson03.teach.dialogue.line02:
    title: Марек официально предлагает пятницу
    gloss: Марек официально спрашивает Эву, подходит ли ей пятница.
    note: К Эве обращаются через *pani* — это продолжение официального стиля, который используется с первого раздела.
  pl.a1.unit03.lesson03.teach.dialogue.line03:
    title: Эва соглашается и спрашивает дату
    gloss: Эва говорит, что пятница ей подходит, и спрашивает, какого числа это будет.
    note: '*Tak* («да»), знакомое по первому разделу, начинает согласие Эвы, после чего она спрашивает точную дату.'
  pl.a1.unit03.lesson03.teach.dialogue.line04:
    title: Марек называет дату
    gloss: 'Марек говорит: 15 мая.'
    note: Оба слова уже встречались во втором уроке этого раздела.
  pl.a1.unit03.lesson03.teach.dialogue.line05:
    title: Эва подтверждает и прощается
    gloss: Эва говорит «отлично» и «до встречи 15 мая».
    note: '*Do zobaczenia* — прощание из первого раздела, теперь с конкретной датой.'
  pl.a1.unit03.lesson03.teach.dialogue.line06:
    title: Марек завершает разговор
    gloss: Марек тоже прощается.
    note: Самое короткое завершение — только само прощание.
