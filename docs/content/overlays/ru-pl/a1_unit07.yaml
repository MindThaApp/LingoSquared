teaching:
  pl.a1.unit07.lesson01.teach.banan:
    title: Банан
    gloss: банан
    note: Распространённый фрукт; на рынке и в магазине его продают поштучно или на вес.
    example_gloss: Это банан.
  pl.a1.unit07.lesson01.teach.pomidor_ogorek:
    title: Помидор, огурец
    gloss: помидор; огурец
    note: Оба слова мужского рода, неодушевлённые. Их формы родительного падежа множественного числа (pomidorów, ogórków) пригодятся, когда вы будете покупать их килограммами, дальше в этом уроке.
    example_gloss:
    - Это помидор.
    - Это огурец.
  pl.a1.unit07.lesson01.teach.ziemniak_cebula:
    title: Картофель, лук
    gloss: картофель; лук
    note: Ziemniak — мужской род, неодушевлённое (родительный падеж множественного числа на -ów, как у banan и pomidor); cebula — женский род.
    example_gloss:
    - Это картофель.
    - Это луковица.
  pl.a1.unit07.lesson01.teach.tanio_drogo:
    title: Дёшево, дорого
    gloss: дёшево; дорого
    note: '*Tanio* и *drogo* — наречия, и в польском они употребляются прямо с глаголом *kosztować* («стоить»): *To kosztuje drogo* буквально значит «это стоит дорого». В русском тоже говорят «стоит дорого», так что параллель очевидна.'
    example_gloss:
    - Очень дёшево!
    - Очень дорого!
  pl.a1.unit07.lesson01.teach.kosztuje_kosztuja_note:
    title: 'Стоить: kosztuje, kosztują'
    gloss: 'стоить: стоит (один предмет), стоят (несколько) — Банан стоит дёшево. Бананы стоят дёшево.'
    note: '*Kosztować* — глагол «стоить». Для одного предмета используйте *kosztuje*, для нескольких — *kosztują*, как *jest* и *są* («есть» и «суть»), только для цен. Продавец поймёт вас в любом случае, но *banany kosztują* — так говорят носители.'
  pl.a1.unit07.lesson01.teach.ile_kosztuje_banan:
    title: Сколько стоит банан?
    gloss: Сколько стоит банан?
    note: 'Обычный вопрос, с которого начинается разговор о цене: *Ile* («сколько») и *kosztuje* в единственном числе, потому что спрашивают об одном банане.'
  pl.a1.unit07.lesson02.teach.grejpfrut:
    title: Грейпфрут
    gloss: грейпфрут
    note: Мужской род, неодушевлённое, как pomidor и ziemniak. Окончание после proszę o не меняется.
    example_gloss: Это грейпфрут.
  pl.a1.unit07.lesson02.teach.mandarynka_pomarancza:
    title: Мандарин, апельсин
    gloss: мандарин; апельсин
    note: Оба слова женского рода, как kawa и herbata из раздела о еде. В винительном падеже -a меняется на -ę, но в этом уроке нужна только обычная словарная форма.
    example_gloss:
    - Это мандарин.
    - Это апельсин.
  pl.a1.unit07.lesson02.teach.kilo_pol_kilo:
    title: Килограмм, полкило
    gloss: килограмм; полкило
    note: '*Kilo* не меняет своего окончания, что бы вы ни взвешивали и сколько бы ни просили. Меняется существительное после *kilo*, как объясняется в грамматической заметке этого урока.'
    example_gloss:
    - Килограмм помидоров, пожалуйста.
    - Полкило бананов, пожалуйста.
  pl.a1.unit07.lesson02.teach.poprosze:
    title: Мне, пожалуйста
    gloss: мне, пожалуйста / дайте мне, пожалуйста
    note: '*Poproszę* — чуть более изящная повседневная замена *proszę o* из раздела о еде. Оба варианта примерно значат «мне, пожалуйста», и поляки свободно используют и тот, и другой. После *Poproszę* сразу называют нужную вещь, без *o*.'
    example_gloss: Мне грейпфрут, пожалуйста.
  pl.a1.unit07.lesson02.teach.genitive_ow_note:
    title: 'После «kilo»: окончание -ów'
    gloss: 'Родительный падеж множественного числа после «kilo»: банан -> бананов, помидор -> помидоров, картофель -> картофелин.'
    note: 'Когда количество указывают в весе (*kilo*, *pół kilo*), следующее за ним существительное принимает другую форму — родительный падеж множественного числа. У этих трёх regular-существительных мужского рода достаточно добавить *-ów*: *banan* становится *bananów*, *pomidor* — *pomidorów*, *ziemniak* — *ziemniaków*.'
  pl.a1.unit07.lesson02.teach.poprosze_kilo_pomidorow:
    title: Килограмм помидоров, пожалуйста
    gloss: Килограмм помидоров, пожалуйста.
    note: 'Грамматическая модель с -ów работает в настоящей просьбе: pomidor после kilo становится pomidorów.'
  pl.a1.unit07.lesson03.teach.dla:
    title: Для
    gloss: для
    note: Простой предлог «для». Продавец использует его во фразе *Co dla pani?* (буквально «что для вас?»), вежливо спрашивая покупательницу, что ей нужно.
    example_gloss: Это для вас.
  pl.a1.unit07.lesson03.teach.swieze_bardzo:
    title: Свежий, очень
    gloss: свежие; очень
    note: 'Два слова, которые продавец на рынке повторяет постоянно: хвалит свежесть товара или говорит, как дёшево или дорого он стоит.'
    example_gloss:
    - Помидоры свежие.
    - Очень дёшево!
  pl.a1.unit07.lesson03.teach.trochę:
    title: Немного
    gloss: немного / чуть-чуть
    note: 'Смягчает жалобу: trochę drogo («немного дорого») звучит в дружеском торге гораздо естественнее, чем просто drogo.'
    example_gloss: Немного дорого.
  pl.a1.unit07.lesson03.teach.razem:
    title: Всего / вместе
    gloss: всего / вместе
    note: Это говорит продавец перед тем, как назвать итоговую сумму.
    example_gloss: Всего десять злотых.
  pl.a1.unit07.lesson03.teach.co_dla_pani:
    title: Что вы хотели бы?
    gloss: Что вы желаете?
    note: Буквально «что для вас (вежливо)» — естественный первый вопрос продавца к покупателю.
  pl.a1.unit07.lesson03.teach.dialogue.line01:
    title: Продавец приветствует Эву
    gloss: Продавец здоровается и спрашивает Эву, что ей нужно.
    note: Dzień dobry — из приветствий первого раздела.
  pl.a1.unit07.lesson03.teach.dialogue.line02:
    title: Эва спрашивает о бананах
    gloss: Эва спрашивает, сколько стоят бананы.
    note: Kosztują — форма множественного числа из грамматической заметки этого раздела, потому что речь о бананах вообще.
  pl.a1.unit07.lesson03.teach.dialogue.line03:
    title: Продавец называет цену
    gloss: 'Продавец говорит: пять злотых за килограмм, и бананы очень свежие.'
    note: 'Естественная краткая фраза о цене: «[цена] kilo» — так польский продавец называет цену за килограмм, без отдельного слова «за».'
  pl.a1.unit07.lesson03.teach.dialogue.line04:
    title: Эва заказывает бананы
    gloss: Эва соглашается и просит килограмм бананов.
    note: Сочетает poproszę с kilo + bananów — точная модель из грамматической заметки второго урока.
  pl.a1.unit07.lesson03.teach.dialogue.line05:
    title: Продавец упоминает помидоры
    gloss: Продавец спрашивает ещё и о помидорах и говорит, что они стоят восемь злотых за килограмм.
    note: Та же краткая модель цены, что и в третьей реплике, теперь для другого товара.
  pl.a1.unit07.lesson03.teach.dialogue.line06:
    title: Эва мягко торгуется и заказывает
    gloss: Эва говорит, что немного дорого, но берёт полкило.
    note: 'Trochę drogo смягчает жалобу: Эва всё равно покупает, только меньше.'
  pl.a1.unit07.lesson03.teach.dialogue.line07:
    title: Продавец называет итоговую сумму
    gloss: Продавец подаёт покупки и говорит, что всего девять злотых.
    note: 5 złotych за бананы плюс 4 złotych за полкило помидоров — всего девять złotych, как и все цены, названные раньше в сцене.
