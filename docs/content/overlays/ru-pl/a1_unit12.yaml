teaching:
  pl.a1.unit12.lesson01.teach.wczoraj:
    title: Вчера
    gloss: вчера
    note: Основное слово, когда говорят о недавнем, уже прошедшем дне. Естественно сочетается с формами прошедшего времени из этого урока.
    example_gloss: Вчера я был в кино.
  pl.a1.unit12.lesson01.teach.co_bylo_wczoraj:
    title: Что было вчера?
    gloss: Что было вчера?
    note: Естественный способ попросить рассказать о недавнем событии. Было не меняется в зависимости от того, кто отвечает, поэтому вопрос подходит любому собеседнику.
  pl.a1.unit12.lesson01.teach.bylo_note:
    title: Było
    gloss: 'Było — форма прошедшего времени глагола być (быть) в среднем роде. Она согласуется с co (что), поэтому используется, когда мы в общем спрашиваем, что произошло: Co było wczoraj? Слово одно и то же, независимо от того, кто отвечает.'
    note: '*Było* — форма среднего рода, «было». Она согласуется с *co* (что), а не с тем, кого ты спрашиваешь, поэтому в открытом вопросе вроде *Co było wczoraj?* значит «что было» / «что произошло».'
  pl.a1.unit12.lesson01.teach.bylem_bylam:
    title: Я был / я была
    gloss: я был (говорит мужчина) / я была (говорит женщина)
    note: 'Польское прошедшее время указывает на пол говорящего: byłem, если говорит мужчина, byłam, если говорит женщина. Оба слова значат «я был(а)».'
    example_gloss:
    - Вчера я был в кино.
    - Вчера я был в кино.
  pl.a1.unit12.lesson01.teach.gender_past_note:
    title: 'Прошедшее время: -em и -am'
    gloss: 'Глаголы в прошедшем времени оканчиваются по-разному в зависимости от пола говорящего: -em, когда говорит мужчина (byłem), -am, когда говорит женщина (byłam). Это относится к каждому глаголу в прошедшем времени, а не только к być.'
    note: 'Следи за последними буквами: *-em* — говорит мужчина, *-am* — говорит женщина. Эту же модель ты увидишь у каждого глагола прошедшего времени в этом уроке.'
  pl.a1.unit12.lesson01.teach.w_kinie_locative_note:
    title: В кино
    gloss: 'Kino меняет окончание после w: idę do kina («куда?») — другая форма, чем jestem w kinie («где?»). W kinie — местный падеж (miejscownik): он говорит, ГДЕ что-то происходит, а не куда кто-то идёт.'
    note: 'Два разных окончания — два разных вопроса: *do kina* отвечает на вопрос «куда?» (ты это учил(а) в уроке о планах), а *w kinie* — на вопрос «где?». Не путай их.'
  pl.a1.unit12.lesson01.teach.bylem_w_kinie:
    title: Вчера я был в кино (говорит мужчина)
    gloss: Вчера я был в кино.
    note: Здесь вместе стоят byłem, wczoraj и w kinie — так мужчина рассказал бы, где он был.
  pl.a1.unit12.lesson01.teach.bylam_w_kinie:
    title: Вчера я была в кино (говорит женщина)
    gloss: Вчера я была в кино.
    note: То же предложение с byłam — так женщина рассказала бы, где она была.
  pl.a1.unit12.lesson02.teach.film:
    title: Фильм
    gloss: фильм
    note: Повседневное слово, когда рассказываешь о том, что смотрел. Постоянно встречается, когда речь идёт о походе в кино.
    example_gloss: Я посмотрел хороший фильм.
  pl.a1.unit12.lesson02.teach.dobry:
    title: Хороший
    gloss: хороший
    note: Ты уже видел(а) dobry в выражении dzień dobry (добрый день). Здесь это слово употребляется само по себе как обычное прилагательное «хороший».
    example_gloss: Очень хороший фильм!
  pl.a1.unit12.lesson02.teach.zobaczylem_zobaczylam:
    title: Я увидел / я увидела
    gloss: я увидел (говорит мужчина) / я увидела (говорит женщина)
    note: 'Zobaczyć обозначает однократное, завершённое действие (в отличие от widzieć — видеть как процесс): zobaczyłem, если говорит мужчина, zobaczyłam, если говорит женщина — та же модель -em/-am, что и в byłem/byłam.'
    example_gloss:
    - Я посмотрел хороший фильм.
    - Я посмотрел хороший фильм.
  pl.a1.unit12.lesson02.teach.zobaczyc_pattern_note:
    title: Та же модель, что и byłem/byłam
    gloss: 'Та же модель, что и byłem/byłam: zobaczyłem говорит мужчина, zobaczyłam — женщина. Zobaczyć — глагол совершенного вида: он описывает одно завершённое событие.'
    note: 'То же окончание, новый глагол: *zobaczyłem/zobaczyłam* следует точно той же модели, которую ты только что выучил(а) на примере *byłem/byłam*.'
  pl.a1.unit12.lesson02.teach.zrobilem_zrobilam:
    title: Я сделал / я сделала
    gloss: я сделал (говорит мужчина) / я сделала (говорит женщина)
    note: 'Zrobić значит «сделать» (в том числе «приготовить») — одно завершённое действие: zrobiłem у мужчины, zrobiłam у женщины, снова та же модель.'
    example_gloss:
    - Я приготовил обед.
    - Я приготовил обед.
  pl.a1.unit12.lesson02.teach.obiad:
    title: Обед
    gloss: обед
    note: Возможно, ты помнишь obiad из урока о распорядке дня. Здесь это основной обед, который готовит Марек.
    example_gloss: Это вкусный обед.
  pl.a1.unit12.lesson02.teach.pyszny:
    title: Вкусный
    gloss: вкусный
    note: Тёплый повседневный способ похвалить еду. Естественно звучит сразу после obiad.
    example_gloss: Это вкусный обед.
  pl.a1.unit12.lesson03.teach.jaki:
    title: Какой
    gloss: какой
    note: 'Ты уже видел(а) jaki в вопросах о номерах телефонов и днях недели. Здесь оно используется так же, чтобы уточнить деталь: какой фильм?'
    example_gloss: Какой это фильм?
  pl.a1.unit12.lesson03.teach.elliptical_note:
    title: Короткие вопросы из одного слова
    gloss: В разговоре можно задать короткий вопрос из одного слова, например Pyszny? вместо полного вопроса Czy obiad był pyszny? Это звучит естественно и быстро, как в повседневной речи.
    note: 'В живом разговоре полное предложение опускают, если и так всё понятно: *Pyszny?* само по себе значит «Было вкусно?»'
  pl.a1.unit12.lesson03.teach.dialogue.line01:
    title: Марек спрашивает, что было
    gloss: Привет, Эва! Что было вчера?
    note: Это самый первый вопрос урока, теперь он открывает настоящий разговор.
  pl.a1.unit12.lesson03.teach.dialogue.line02:
    title: Эва была в кино
    gloss: Я была в кино! Я посмотрела хороший фильм.
    note: Byłam и zobaczyłam — женский род, оба слова показывают, что говорит Эва.
  pl.a1.unit12.lesson03.teach.dialogue.line03:
    title: Марек спрашивает, какой фильм
    gloss: Какой фильм?
    note: Короткий естественный уточняющий вопрос со словом jaki.
  pl.a1.unit12.lesson03.teach.dialogue.line04:
    title: Эва отвечает и спрашивает в ответ
    gloss: Очень хороший! А ты?
    note: A ty? («А ты?») возвращает разговор Мареку, и новая грамматика для этого не нужна.
  pl.a1.unit12.lesson03.teach.dialogue.line05:
    title: Марек приготовил обед
    gloss: Я приготовил обед!
    note: 'Zrobiłem (мужской род) показывает, что говорит Марек: это его собственное завершённое дело за день.'
  pl.a1.unit12.lesson03.teach.dialogue.line06:
    title: Эва спрашивает, было ли вкусно
    gloss: Вкусно?
    note: Вопрос из одного слова — ровно та модель, о которой говорилось в грамматической заметке урока.
