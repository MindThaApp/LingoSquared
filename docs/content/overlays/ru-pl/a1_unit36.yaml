    gloss: Нина новенькая в языковом кафе. Она спрашивает Марека, какие остальные. Марек рассказывает. Ева добрая и терпеливая; она работает медсестрой. Томек забавный и ходит на курс испанского. Кася любопытная; она любит узнавать новое. Сам Марек спокойный.
