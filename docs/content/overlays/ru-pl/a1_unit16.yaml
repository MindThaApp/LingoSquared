teaching:
  pl.a1.unit16.lesson01.teach.boli_note:
    title: Болит
    gloss: 'Boleć (болеть), настоящее время: boli (он/она/оно) и bolą (они). Głowa mnie boli значит «у меня болит голова», буквально: «голова меня болит».'
    note: 'Когда говорят о боли, *boleć* в настоящем времени употребляется только в этих двух формах: часть тела здесь подлежащее, а *mnie* показывает, чья она. Формы «я болею» здесь учить не нужно.'
  pl.a1.unit16.lesson01.teach.glowa:
    title: Голова
    gloss: голова
    note: Самое частое, на что жалуются.
    example_gloss: У меня болит голова.
  pl.a1.unit16.lesson01.teach.gardlo:
    title: Горло
    gloss: горло
    note: Пригодится, чтобы рассказать о простуде или больном горле.
    example_gloss: У меня болит горло.
  pl.a1.unit16.lesson01.teach.brzuch:
    title: Желудок
    gloss: живот
    note: Пригодится после обильной еды или когда что-то не пошло впрок.
    example_gloss: У меня болит живот.
  pl.a1.unit16.lesson01.teach.zeby:
    title: Зубы
    gloss: зубы
    note: Здесь слово всегда во множественном числе, как и говорят поляки, поэтому с ним стоит *bolą*, а не *boli*.
    example_gloss: У меня болят зубы.
  pl.a1.unit16.lesson01.teach.co_cie_boli:
    title: Что у вас болит?
    gloss: Что у тебя болит?
    note: Естественный вопрос человеку, которому нездоровится.
  pl.a1.unit16.lesson02.teach.czuc_sie_note:
    title: Как ты себя чувствуешь?
    gloss: 'Czuć się (чувствовать себя): czuję się (я), czujesz się (ты). Как ты себя чувствуешь?'
    note: 'Пока только две формы: *czuję* о себе, *czujesz* чтобы спросить другого.'
  pl.a1.unit16.lesson02.teach.dobrze_zle_contrast:
    title: Хорошо и плохо
    gloss: Я чувствую себя хорошо. Я чувствую себя плохо. Слово dobrze ты уже знаешь, а źle — его противоположность.
    note: То самое *dobrze*, которое ты используешь с первого урока, теперь в паре со своей противоположностью.
  pl.a1.unit16.lesson02.teach.zle:
    title: Плохо
    gloss: плохо
    note: Слово, чтобы сказать, что вам нездоровится.
    example_gloss: Я плохо себя чувствую.
  pl.a1.unit16.lesson02.teach.goraczka:
    title: Температура
    gloss: температура (жар)
    note: Один из самых распространённых простых симптомов.
    example_gloss: У меня температура.
  pl.a1.unit16.lesson02.teach.ewa_ma_recap:
    title: Ewa, ma — снова
    gloss: 'Ewa, ma: это имя и эту форму глагола mieć (иметь) ты уже знаешь из прошлых уроков (Mam, masz, ma).'
    note: 'Короткое напоминание: в этом уроке встретятся оба.'
  pl.a1.unit16.lesson02.teach.chory_chora:
    title: Больной
    gloss: больной / больная
    note: 'Та же модель -y/-a, что и в *młodszy/starsza*: *chory* о мужчине, *chora* о женщине.'
    example_gloss:
    - Он болен.
    - Она больна.
  pl.a1.unit16.lesson02.teach.ewa_line_preview:
    title: Еве нездоровится
    gloss: Мне плохо. У меня температура.
    note: Ewa рассказывает о своих симптомах, то же она повторит в диалоге этого раздела.
  pl.a1.unit16.lesson03.teach.marek_recap:
    title: Marek — снова
    gloss: 'Marek: это имя ты уже знаешь из прошлых уроков.'
    note: Короткое напоминание перед диалогом этого урока.
  pl.a1.unit16.lesson03.teach.i_recap:
    title: «И» — снова
    gloss: 'I («и»): это слово ты уже знаешь из прошлых уроков.'
    note: Короткое напоминание перед диалогом этого урока.
  pl.a1.unit16.lesson03.teach.prosze_wode_recap:
    title: «Пожалуйста» и «воду» — снова
    gloss: 'Proszę и wodę: оба слова ты уже знаешь из прошлых уроков.'
    note: Короткое напоминание перед диалогом этого урока.
  pl.a1.unit16.lesson03.teach.dziekuje_recap:
    title: «Спасибо» — снова
    gloss: 'Dziękuję: это слово ты уже знаешь из прошлых уроков.'
    note: Короткое напоминание перед диалогом этого урока.
  pl.a1.unit16.lesson03.teach.odpoczac:
    title: Отдыхать
    gloss: отдыхать
    note: 'Употребляется с *Proszę* так же, как когда вы просите идти прямо или повернуть: *Proszę* + инфинитив, повелительное наклонение не нужно.'
    example_gloss: Пожалуйста, отдохните.
  pl.a1.unit16.lesson03.teach.pic:
    title: Пить
    gloss: пить
    note: Ещё один инфинитив, который так же стоит после *Proszę*.
    example_gloss: Пожалуйста, пейте воду.
  pl.a1.unit16.lesson03.teach.dialogue.line01:
    title: Marek спрашивает, как себя чувствует Ewa
    gloss: Ева, как ты себя чувствуешь?
    note: Marek замечает, что что-то не так, и спрашивает прямо.
  pl.a1.unit16.lesson03.teach.dialogue.line02:
    title: Ewa описывает свои симптомы
    gloss: Мне плохо. У меня болит горло и температура.
    note: Ewa чётко называет два симптома, о которых мы уже узнали в этом разделе.
  pl.a1.unit16.lesson03.teach.dialogue.line03:
    title: Marek даёт простой совет
    gloss: Пожалуйста, отдохните и пейте воду.
    note: 'Простой совет без диагноза: не медицинское предписание, а здравый смысл.'
  pl.a1.unit16.lesson03.teach.dialogue.line04:
    title: Ewa благодарит Marek
    gloss: Хорошо, спасибо, Марек.
    note: Простое привычное завершение разговора.
