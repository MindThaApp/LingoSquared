teaching:
  pl.a1.unit18.lesson01.teach.dom_jest_ma_recap:
    title: Дом, есть, имеет — повторение
    gloss: 'Dom, jest, ma, Marek, Ewa — ты уже знаешь эти слова по прошлым урокам, например: «Dom jest tam» (дом там).'
    note: Краткое напоминание перед тем, как в этом уроке мы будем использовать их, чтобы рассказать о твоём доме.
  pl.a1.unit18.lesson01.teach.mieszkanie:
    title: Квартира
    gloss: квартира
    note: Именно квартира, а не целый дом.
    example_gloss: У Эвы есть квартира.
  pl.a1.unit18.lesson01.teach.duzy_note:
    title: Большой
    gloss: Дом большой. — «*duży*» сочетается с существительными мужского рода, например с «*dom*».
    note: Это первое слово в курсе, которое описывает размер, — пока оно относится только к «*dom*».
  pl.a1.unit18.lesson01.teach.marek_ma_dom_duzy:
    title: Дом Марека
    gloss: У Марека есть дом. Дом большой.
    note: Факт о Мареке, на котором строится весь этот урок.
  pl.a1.unit18.lesson01.teach.ewa_ma_mieszkanie:
    title: Дом Эвы
    gloss: У Эвы есть квартира.
    note: Факт об Эве, на котором строится весь этот урок.
  pl.a1.unit18.lesson01.teach.pokoj:
    title: Комната
    gloss: комната
    note: Общее слово для любой комнаты в доме.
    example_gloss: Где комната?
  pl.a1.unit18.lesson01.teach.ile_pokoi_note:
    title: Сколько комнат?
    gloss: Сколько у тебя комнат? У меня две комнаты. — ты уже знаешь «Ile», числительные и «mam»/«masz» по прошлым урокам; «*pokoi*» и «*pokoje*» — формы слова «*pokój*».
    note: «*Pokoi*» используется сразу после «*Ile*», а «*pokoje*» — после «*dwa*», «*trzy*» и «*cztery*» (два, три, четыре).
  pl.a1.unit18.lesson01.teach.ile_pokoi_masz_phrase:
    title: Сколько у тебя комнат?
    gloss: Сколько у тебя комнат?
    note: Естественный вопрос о чьём-либо жилье.
  pl.a1.unit18.lesson01.teach.mam_dwa_pokoje_phrase:
    title: У меня две комнаты
    gloss: У меня две комнаты.
    note: Естественный ответ на вопрос выше.
  pl.a1.unit18.lesson02.teach.kuchnia:
    title: Кухня
    gloss: кухня
    note: Одна из самых обычных комнат в доме.
    example_gloss: Кухня маленькая.
  pl.a1.unit18.lesson02.teach.mala_note:
    title: Маленький
    gloss: Кухня маленькая. — «*mała*» сочетается с существительными женского рода, например с «*kuchnia*».
    note: Это отдельное слово, не то же, что «*duży*» (большой), — пока оно относится только к «*kuchnia*».
  pl.a1.unit18.lesson02.teach.sypialnia:
    title: Спальня
    gloss: спальня
    note: Комната, где спят.
    example_gloss: Где спальня?
  pl.a1.unit18.lesson02.teach.lazienka:
    title: Ванная
    gloss: ванная
    note: Комната с душем и туалетом.
    example_gloss: Где ванная?
  pl.a1.unit18.lesson02.teach.gdzie_tam_recap:
    title: Где, там — повторение
    gloss: 'Gdzie, tam — ты уже знаешь эти слова по прошлым урокам, например: «Bank jest tam» (банк там).'
    note: Краткое напоминание перед тем, как в этом уроке мы будем использовать их, чтобы говорить о комнатах.
  pl.a1.unit18.lesson02.teach.w_pokoje_locative_note:
    title: В комнате, на кухне...
    gloss: 'W + комната, кухня, спальня, ванная: w pokoju, w kuchni, w sypialni, w łazience — по той же схеме, что w szkole (в школе) и w biurze (в офисе).'
    note: 'Та же идея, что и в словах о месте работы, которые ты уже выучил: окончание немного меняется, чтобы сказать «в» этой комнате.'
  pl.a1.unit18.lesson02.teach.gdzie_jest_lazienka_phrase:
    title: Где ванная?
    gloss: Где ванная? Ванная там.
    note: Обычный обмен репликами, когда нужно найти комнату в чужом доме.
  pl.a1.unit18.lesson02.teach.kuchnia_jest_mala_phrase:
    title: Кухня маленькая
    gloss: Кухня маленькая.
    note: Снова используем слово о размере из этого урока.
  pl.a1.unit18.lesson03.teach.recap_words:
    title: Да, и, являются — повторение
    gloss: Tak, i, są, A, ja, jeden — ты уже знаешь эти слова по прошлым урокам.
    note: Краткое напоминание перед диалогом этого урока.
  pl.a1.unit18.lesson03.teach.lodowka:
    title: Холодильник
    gloss: холодильник
    note: Обычная кухонная техника.
    example_gloss: На кухне есть холодильник.
  pl.a1.unit18.lesson03.teach.piekarnik:
    title: Духовка
    gloss: духовка
    note: Ещё одна обычная кухонная техника.
    example_gloss: На кухне есть духовка.
  pl.a1.unit18.lesson03.teach.dialogue.line01:
    title: Марек описывает свой дом
    gloss: У меня есть дом. Дом большой.
    note: Марек начинает разговор с описания своего жилья.
  pl.a1.unit18.lesson03.teach.dialogue.line02:
    title: Эва спрашивает о комнатах
    gloss: Сколько у тебя комнат?
    note: Эва задаёт естественный уточняющий вопрос.
  pl.a1.unit18.lesson03.teach.dialogue.line03:
    title: Марек отвечает
    gloss: У меня две комнаты. В доме есть кухня, спальня и ванная.
    note: Марек называет число комнат и перечисляет комнаты в своём доме.
  pl.a1.unit18.lesson03.teach.dialogue.line04:
    title: Эва описывает своё жильё
    gloss: А у меня квартира. У меня одна комната.
    note: Эва переходит к описанию своего, более маленького жилья.
  pl.a1.unit18.lesson03.teach.dialogue.line05:
    title: Эва спрашивает о кухне
    gloss: Кухня маленькая?
    note: Эва задаёт Мареку уточняющий вопрос о его кухне.
  pl.a1.unit18.lesson03.teach.dialogue.line06:
    title: Марек отвечает
    gloss: Да, кухня маленькая. На кухне есть холодильник и духовка.
    note: Марек подтверждает, что кухня маленькая, и называет два предмета в ней.
