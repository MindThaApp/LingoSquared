teaching:
  pl.a1.unit13.lesson01.teach.muzyka:
    title: Музыка
    gloss: музыка
    note: Частая тема, когда говорят о том, что нравится и что не нравится. Слово легко узнать, оно похоже на русское.
    example_gloss: Я люблю музыку.
  pl.a1.unit13.lesson01.teach.muzyke_accusative_note:
    title: Muzyka -> muzykę
    gloss: После lubić (любить, нравиться) с дополнением muzyka меняется на muzykę, так же как kawa на kawę. Lubię muzykę, а не Lubię muzyka.
    note: 'Та же модель, что ты уже знаешь: *muzyka* становится *muzykę* как дополнение при *lubię*, так же как *kawa* становится *kawę*.'
  pl.a1.unit13.lesson01.teach.lubisz:
    title: Ты любишь
    gloss: ты любишь (неформально, ty)
    note: Форма «ты» от lubić — она нужна, чтобы напрямую спросить друга, нравится ли ему что-то.
    example_gloss: Ты любишь музыку?
  pl.a1.unit13.lesson01.teach.lubic_paradigm_note:
    title: 'Lubić: lubię, lubisz, lubi'
    gloss: 'Lubić (любить): lubię (я), lubisz (ты), lubi (он/она). Lubię и lubi ты уже знаешь, а lubisz — новая форма для собеседника.'
    note: '*Lubię* и *lubi* тебе уже хорошо знакомы, а *lubisz* — недостающая форма «ты» того же глагола.'
  pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke:
    title: Ты любишь музыку?
    gloss: Ты любишь музыку?
    note: Czy открывает вопрос «да/нет» — естественный способ спросить друга о предпочтениях.
  pl.a1.unit13.lesson01.teach.tak_lubie:
    title: Да, люблю.
    gloss: Да, люблю.
    note: Короткий естественный ответ — слово muzykę повторять не нужно.
  pl.a1.unit13.lesson01.teach.nie_nie_lubie:
    title: Нет, не люблю.
    gloss: Нет, не люблю.
    note: 'Nie, nie lubię выглядит как повтор, но это не ошибка: первое nie отвечает на вопрос, второе nie отрицает lubię.'
  pl.a1.unit13.lesson01.teach.ellipsis_note:
    title: Короткие ответы
    gloss: 'Короткий ответ: Tak, lubię. / Nie, nie lubię. — слово muzykę повторять не нужно, потому что из вопроса и так ясно, о чём речь.'
    note: Как *Pyszny?* может стоять один, так и *Tak, lubię.* не нужно повторять, о чём речь, — это понятно из контекста.
  pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke:
    title: Я очень люблю музыку
    gloss: Я очень люблю музыку.
    note: Bardzo (очень / сильно) усиливает простое предпочтение — со словом bardzo ты знаком с первого урока.
  pl.a1.unit13.lesson02.teach.wole:
    title: Я предпочитаю
    gloss: я предпочитаю
    note: 'Совершенно новый глагол в этом уроке: woleć (предпочитать). Здесь дана только форма «я», как и у lubię.'
    example_gloss: Я предпочитаю чай.
  pl.a1.unit13.lesson02.teach.wolec_scope_note:
    title: 'Woleć: в этом уроке только wolę'
    gloss: 'Woleć (предпочитать): wolę (я) — в этом уроке даётся только форма «я», как и у lubię. Wolę kawę. = Я предпочитаю кофе.'
    note: Пока только форма *ja* (я) глагола *woleć*, в том же объёме, в каком когда-то был введён *lubię*.
  pl.a1.unit13.lesson02.teach.kawa_herbata_recap:
    title: Снова кофе и чай
    gloss: 'Wolę + дополнение: kawa становится kawę, herbata — herbatę. Это та же модель, которую ты уже знаешь.'
    note: 'Та же модель винительного падежа, только с новым глаголом: *wolę kawę*, *wolę herbatę*.'
  pl.a1.unit13.lesson02.teach.wole_kawe:
    title: Я предпочитаю кофе
    gloss: Я предпочитаю кофе.
    note: Простое высказывание о предпочтении с wolę.
  pl.a1.unit13.lesson02.teach.wole_herbate:
    title: Я предпочитаю чай
    gloss: Я предпочитаю чай.
    note: Та же модель, только с herbatę вместо kawę.
  pl.a1.unit13.lesson02.teach.czy_or_note:
    title: Czy в значении «или»
    gloss: 'Czy в вопросе Kawa czy herbata? — не то же самое czy, которое открывает вопрос «да/нет»: здесь оно соединяет два варианта, как русское «или». Kawa czy herbata? = Кофе или чай?'
    note: 'Осторожно: *czy* обычно открывает вопрос «да/нет», но между двумя существительными, как здесь, оно значит просто «или».'
  pl.a1.unit13.lesson02.teach.kawa_czy_herbata:
    title: Кофе или чай?
    gloss: Кофе или чай?
    note: Короткий естественный способ предложить выбор.
  pl.a1.unit13.lesson03.teach.ja_tez:
    title: Я тоже
    gloss: я тоже
    note: Короткий способ согласиться с тем, что только что сказали.
  pl.a1.unit13.lesson03.teach.ja_tez_note:
    title: Снова Ja też
    gloss: Ja też значит «я тоже» — ты уже знаешь это из урока о распорядке дня (Ja też wstaję o siódmej — «Я тоже встаю в семь»).
    note: 'Напоминание: эта фраза тебе уже встречалась.'
  pl.a1.unit13.lesson03.teach.elliptical_reminder_note:
    title: Kawa czy herbata? обходится без глагола
    gloss: Как и Pyszny? из прошлого урока, короткий вопрос Kawa czy herbata? не нуждается в глаголе — достаточно контекста.
    note: Та же модель, что и у *Pyszny?* — короткий вопрос без глагола, который ясен из контекста.
  pl.a1.unit13.lesson03.teach.dialogue.line01:
    title: Марек спрашивает Эву, любит ли она музыку
    gloss: Ты любишь музыку?
    note: Марек начинает разговор с вопроса, который ты разобрал в этом уроке.
  pl.a1.unit13.lesson03.teach.dialogue.line02:
    title: Эва любит музыку и задаёт встречный вопрос
    gloss: Да, очень люблю! А ты?
    note: A ty? (а ты?) возвращает вопрос Мареку — та же модель, что в прошлых уроках.
  pl.a1.unit13.lesson03.teach.dialogue.line03:
    title: Марек соглашается и спрашивает про напитки
    gloss: Я тоже. Кофе или чай?
    note: Ja też lubię подтверждает ответ самого Марека, после чего он меняет тему новым вопросом с выбором.
  pl.a1.unit13.lesson03.teach.dialogue.line04:
    title: Эва предпочитает кофе
    gloss: Я предпочитаю кофе.
    note: Собственное предпочтение Эвы с wolę — та же любительница кофе из урока о распорядке дня.
  pl.a1.unit13.lesson03.teach.dialogue.line05:
    title: Марек предпочитает чай
    gloss: Я предпочитаю чай.
    note: Собственное предпочтение Марека — противоположный выбор по сравнению с Эвой.
