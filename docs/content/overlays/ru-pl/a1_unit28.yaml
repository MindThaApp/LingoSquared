    gloss: 'Кася: А когда идёт дождь?'
  pl.a1.unit28.lesson04.teach.jezdzic_narzednik_jezdze:
    title: Jeździć требует творительного падежа
    gloss: 'Название транспорта в польском ставится в творительный падеж: *jeżdżę rowerem*, *jeżdżę samochodem*, *jadę pociągiem*. В русском для этого служит предлог «на» + предложный падеж, а в польском предлога нет.'
    note: 'Транспортное средство стоит в творительном падеже («на велосипеде»), а глагол спрягается как обычно: *jeżdżę*, *jeździsz*, *jeździ*.'
  pl.a1.unit28.lesson04.teach.marek_wtedy_jade:
    title: Марек отвечает
    gloss: 'Марек: Тогда я еду на поезде, вместе с Евой.'
  pl.a1.unit28.lesson05.teach.ewa_co_dzien:
    title: Кто как добирается?
    gloss: Ева каждый день ездит на работу на поезде. Марек обычно ездит на велосипеде, но когда идёт дождь, тоже едет на поезде. Томек предпочитает ездить на машине. Кася живёт рядом и ходит на работу пешком. А как ты добираешься до работы?
    note: В коротком тексте противопоставлены четыре способа добираться до работы и одно условие (дождь).
    glosses:
      podróżuje: ездит
      co: каждый
      dzień: день
      pociągiem: поезд
      pracy: работать
      jeździ: ездит на велосипеде
      zwykle: обычно
      pada: идёт дождь
      jedzie: едет, садится (на транспорт)
      jeździć: ездит на машине
      woli: предпочитает
      samochodem: машина
      mieszka: живёт
      blisko: близко
      chodzi: ходит пешком
      podróżujesz: ездишь, добираешься
  pl.a1.unit28.lesson05.teach.kasia_mieszka_blisko:
    title: Кася живёт рядом и ходит на работу пешком
    gloss: Кася живёт рядом и ходит на работу пешком.
  pl.a1.unit28.lesson06.teach.ewa_moze_pojedziemy:
    title: Ева предлагает
    gloss: 'Ева: Может, поедем вместе на велосипедах в языковое кафе?'
  pl.a1.unit28.lesson06.teach.tomek_wole_jezdzic:
    title: Томек предпочитает машину
