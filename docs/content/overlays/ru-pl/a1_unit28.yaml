    title: Często и codziennie с транспортом
    gloss: 'Ты уже знаешь слова *często* («часто») и *codziennie* («каждый день») из прошлых уроков. Их используют и с транспортом: я часто езжу на велосипеде, я каждый день езжу на поезде.'
