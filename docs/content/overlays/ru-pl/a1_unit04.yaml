teaching:
  pl.a1.unit04.lesson01.teach.pierwsza_druga_trzecia:
    title: Один, два, три часа
    gloss: час; два часа; три часа
    note: Время в польском называют порядковыми числительными женского рода, согласованными с невысказанным существительным *godzina* («час») — *pierwsza* буквально значит «первая (година)».
    example_gloss:
    - Час.
    - Два часа.
    - Три часа.
  pl.a1.unit04.lesson01.teach.czwarta_piata_szosta:
    title: Четыре, пять, шесть часов
    gloss: четыре часа; пять часов; шесть часов
    note: Та же модель порядковых числительных женского рода, что и у *pierwsza*, *druga*, *trzecia*.
    example_gloss:
    - Четыре часа.
    - Пять часов.
    - Шесть часов.
  pl.a1.unit04.lesson01.teach.siodma_osma_dziewiata:
    title: Семь, восемь, девять часов
    gloss: семь часов; восемь часов; девять часов
    note: Три средних часа из двенадцати, модель та же.
    example_gloss:
    - Семь часов.
    - Восемь часов.
    - Девять часов.
  pl.a1.unit04.lesson01.teach.dziesiata_jedenasta_dwunasta:
    title: Десять, одиннадцать, двенадцать часов
    gloss: десять часов; одиннадцать часов; двенадцать часов
    note: Последние три часа, которые завершают весь набор от 1 до 12.
    example_gloss:
    - Десять часов.
    - Одиннадцать часов.
    - Двенадцать часов.
  pl.a1.unit04.lesson01.teach.ktora_jest_godzina:
    title: Спрашиваем время
    gloss: Который час?
    note: Буквально «какая есть година?» — *która* согласуется с существительным женского рода *godzina*; такое же согласование будет встречаться в этом разделе повсюду.
  pl.a1.unit04.lesson01.teach.godzina_note:
    title: Godzina — женского рода
    gloss: Мы говорим pierwsza, druga, trzecia, а не pierwszy, drugi, trzeci.
    note: '*Pierwszy*, *drugi*, *trzeci* — мужские формы этих же порядковых числительных; в польском они используются с существительными мужского рода, но никогда — для обозначения времени, потому что *godzina* — женского рода.'
  pl.a1.unit04.lesson02.teach.rano_poludnie_popoludniu:
    title: Утро, полдень, день
    gloss: утром; в полдень; после полудня
    note: '*Rano* употребляется без предлога; *w południe* и *po południu* имеют каждое свой постоянный предлог. Эти три выражения лучше выучить как устойчивые сочетания, а не выводить из общего правила.'
    example_gloss:
    - Утром я пью кофе.
    - В полдень я обедаю.
    - Я работаю во второй половине дня.
  pl.a1.unit04.lesson02.teach.wieczorem_w_nocy:
    title: Вечер, ночь
    gloss: вечером; ночью
    note: '*Wieczorem* — устойчивая наречная форма (предлог не нужен); *w nocy* — это *w* с местным падежом слова *noc* (ночь).'
    example_gloss:
    - Вечером я смотрю телевизор.
    - Ночью я сплю.
  pl.a1.unit04.lesson02.teach.o_ktorej_godzinie:
    title: Как спросить, во сколько
    gloss: Во сколько?
    note: Используй этот вопрос вместо *Która jest godzina?*, когда спрашиваешь, когда что-то произойдёт, а не который сейчас час.
  pl.a1.unit04.lesson02.teach.locative_hour_note:
    title: Как сказать «в» такой-то час
    gloss: Четыре, семь, десять часов — но в четыре, в семь, в десять часов.
    note: 'После *o* («в») конечное *-a* в названии часа меняется на *-ej*: *czwarta* → *o czwartej*, *siódma* → *o siódmej*, *dziesiąta* → *o dziesiątej*. Все часы следуют этой модели; единственная особенность написания — *druga* → *o drugiej*, где после *g* добавляется *i*.'
  pl.a1.unit04.lesson02.teach.ewa_wstaje:
    title: Ewa встаёт рано
    gloss: Ewa встаёт в 7 утра.
    note: '*Wstaje* — форма 3-го лица единственного числа от глагола *wstawać* (вставать).'
  pl.a1.unit04.lesson02.teach.pociag_odjezdza:
    title: Время отправления поезда
    gloss: Поезд отправляется в 4 часа дня.
    note: '*Odjeżdża* — форма 3-го лица единственного числа от глагола *odjeżdżać* (отправляться, уезжать).'
  pl.a1.unit04.lesson03.teach.spotkanie:
    title: Встреча
    gloss: встреча
    note: То же слово, что в уроке 3 (*Kiedy jest spotkanie?*), когда Ewa и Marek договорились о дне и дате новой встречи.
    example_gloss: Встреча в пятницу.
  pl.a1.unit04.lesson03.teach.o_ktorej_mozemy_sie_spotkac:
    title: Как спросить, во сколько встретиться
    gloss: Во сколько мы можем встретиться в пятницу, 15 мая?
    note: 'Здесь *o której godzinie* из этого урока соединяется с днём и датой из урока 3: Ewa и Marek уже договорились о пятнице, 15 мая, и теперь им нужно назначить точное время.'
  pl.a1.unit04.lesson03.teach.moze_o_czwartej:
    title: Предлагаем время
    gloss: Может, в 4 часа дня?
    note: '*Może* само по себе значит «может быть» — это естественный мягкий способ предложить время.'
  pl.a1.unit04.lesson03.teach.czwarta_mi_odpowiada:
    title: Как подтвердить, что время подходит
    gloss: 4 часа дня мне подходит.
    note: 'Та же модель *[time] + mi + odpowiada*, что и в *Piątek mi odpowiada* из урока 3: само время — подлежащее, а глагол *odpowiadać* всегда требует лицо в дательном падеже (*mi*, «мне»).'
  pl.a1.unit04.lesson03.teach.do_zobaczenia_o_czwartej:
    title: Подтверждение всего плана
    gloss: До встречи 15 мая в 4 часа!
    note: Снова прощание *Do zobaczenia* из урока 1, теперь вместе с датой и временем.
  pl.a1.unit04.lesson03.teach.dialogue.line01:
    title: Ewa спрашивает о времени
    gloss: Ewa спрашивает Marek, во сколько они могут встретиться в пятницу, 15 мая.
    note: Тот же вопрос, с которого начался урок.
  pl.a1.unit04.lesson03.teach.dialogue.line02:
    title: Marek предлагает 4 часа дня
    gloss: Marek предлагает 4 часа дня.
    note: Это мягкое предложение, а не твёрдое утверждение — об этом говорит *może*.
  pl.a1.unit04.lesson03.teach.dialogue.line03:
    title: Ewa соглашается
    gloss: Ewa говорит, что 4 часа дня ей подходит.
    note: Та же конструкция с дательным падежом, что и в диалоге из урока 3 о том, что пятница подходит.
  pl.a1.unit04.lesson03.teach.dialogue.line04:
    title: Marek завершает договорённость
    gloss: Marek говорит «отлично» и «до встречи 15 мая в 4 часа!»
    note: '*Świetnie* — восклицание радости, уже знакомое из урока 3.'
  pl.a1.unit04.lesson03.teach.dialogue.line05:
    title: Ewa прощается
    gloss: Ewa прощается в ответ.
    note: Самое короткое завершение разговора — только само прощание.
