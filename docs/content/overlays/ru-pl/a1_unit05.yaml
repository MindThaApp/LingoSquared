teaching:
  pl.a1.unit05.lesson01.teach.rodzina:
    title: Семья
    gloss: семья
    note: Общее слово «семья» — относится ко всем домашним, а не к одному родственнику.
    example_gloss: Это моя семья.
  pl.a1.unit05.lesson01.teach.matka_ojciec:
    title: Мать, отец
    gloss: мать; отец
    note: Два основных слова для родителей. В повседневной речи часто слышны и ласковые mama и tata, но matka и ojciec — нейтральные стандартные формы, которые изучаются здесь.
    example_gloss:
    - Это моя мать.
    - Это мой отец.
  pl.a1.unit05.lesson01.teach.brat_siostra:
    title: Брат, сестра
    gloss: брат; сестра
    note: 'Оба слова — обычные существительные: brat мужского рода, siostra женского. Это важно для согласования mój/moja в грамматической заметке этого урока.'
    example_gloss:
    - Это мой брат.
    - Это моя сестра.
  pl.a1.unit05.lesson01.teach.rodzice:
    title: Родители
    gloss: родители
    note: Rodzice — существительное мужсколичного множественного числа. У него своя форма притяжательного местоимения — moi (не mój/moja), как в примере и грамматической заметке этого урока.
    example_gloss: Мои родители живут в Варшаве.
  pl.a1.unit05.lesson01.teach.moj_moja_note:
    title: 'Мой: mój, moja, moi'
    gloss: мой отец, мой брат — моя мать, моя сестра — мои родители.
    note: 'Польские притяжательные местоимения согласуются в роде с существительным: *mój* перед существительным мужского рода (*mój ojciec*, *mój brat*), *moja* перед существительным женского рода (*moja matka*, *moja siostra*), а особая неправильная форма *moi* употребляется именно с мужсколичным множественным числом *rodzice*.'
  pl.a1.unit05.lesson01.teach.to_jest_moj_ojciec:
    title: Это мой отец
    gloss: Это мой отец.
    note: '*To jest* («это») не зависит от рода существительного — меняется только притяжательное mój/moja.'
  pl.a1.unit05.lesson02.teach.dziadek_babcia:
    title: Дедушка, бабушка
    gloss: дедушка; бабушка
    note: Стандартные повседневные слова для дедушки и бабушки; их используют и дети, и взрослые.
    example_gloss:
    - Это мой дедушка.
    - Это моя бабушка.
  pl.a1.unit05.lesson02.teach.wujek_ciotka:
    title: Дядя, тётя
    gloss: дядя; тётя
    note: Так называют брата или сестру родителя, а также супруга или супругу брата или сестры родителя — как и русские «дядя» и «тётя».
    example_gloss:
    - Это мой дядя.
    - Это моя тётя.
  pl.a1.unit05.lesson02.teach.syn_corka:
    title: Сын, дочь
    gloss: сын; дочь
    note: 'В примерах показана форма винительного падежа, нужная после *mieć* («иметь»): *syn* превращается в *syna*, *córka* — в *córkę*. Почему меняется окончание, объясняют следующие грамматические заметки.'
    example_gloss:
    - У меня есть сын.
    - У меня есть дочь.
  pl.a1.unit05.lesson02.teach.miec_note:
    title: 'Иметь: mam, masz, ma'
    gloss: 'иметь: у меня есть, у тебя есть, у него/неё есть — у меня есть брат, у тебя есть сестра, у него/неё есть сын.'
    note: '*Mieć* — глагол «иметь». *Mam* («я имею», «у меня есть») и *ma* («он/она имеет») — главные новые формы этого урока; *masz* («ты имеешь») ты уже видел(а) во втором уроке, когда спрашивали о возрасте.'
  pl.a1.unit05.lesson02.teach.accusative_note:
    title: Как сказать, что у тебя есть
    gloss: 'После «иметь» окончание существительного меняется: brat -> brata, siostra -> siostrę, syn -> syna, córka -> córkę.'
    note: Это винительный падеж — форма существительного как прямого дополнения при глаголе вроде *mieć*. Существительные мужского рода, обозначающие людей (и животных), например *brat* и *syn*, получают окончание *-a*; существительные женского рода, например *siostra* и *córka*, меняют конечное *-a* на *-ę*.
  pl.a1.unit05.lesson02.teach.mam_brata_siostre:
    title: У меня есть брат и сестра
    gloss: У меня есть брат и сестра.
    note: Здесь окончания винительного падежа из грамматической заметки используются в целом предложении, а ещё появляется новый союз *i* («и»).
  pl.a1.unit05.lesson03.teach.lub:
    title: Или
    gloss: или
    note: Употребляется так же, как русское «или» в вопросе, где предлагаются два варианта.
    example_gloss: У тебя есть брат или сестра?
  pl.a1.unit05.lesson03.teach.tylko:
    title: Только
    gloss: только
    note: Ставится прямо перед словом, которое ограничивает, — как и русское «только».
    example_gloss: У меня есть только сестра.
  pl.a1.unit05.lesson03.teach.gdzie:
    title: Где
    gloss: где
    note: Основное вопросительное слово. Естественно сочетается с mieszkać («жить»), как в диалоге этого урока.
    example_gloss: Где живёт твой брат?
  pl.a1.unit05.lesson03.teach.on_ona_mieszka_note:
    title: Он, она — и «жить»
    gloss: 'on, ona = он, она — жить: я живу, он/она живёт. Он живёт в Гданьске. Она живёт в Кракове.'
    note: '*On* («он») и *ona* («она») — местоимения третьего лица. Глагол *mieszkać* («жить») образует формы 1-го и 3-го лица так же, как *mieć*: *mieszkam* («я живу», как в *Mieszkam w Warszawie* из первого урока) и *mieszka* («он/она живёт»). После *w* названия мест стоят в местном падеже: *Gdańsk* становится *w Gdańsku*, *Kraków* — *w Krakowie*, как и в *Mieszkam w Warszawie* из первого урока.'
  pl.a1.unit05.lesson03.teach.dialogue.line01:
    title: Марек спрашивает о братьях и сёстрах
    gloss: Марек спрашивает Эву, есть ли у неё брат или сестра.
    note: Вопрос «да/нет» со словом *Czy*, как и в первом уроке. Эва и Марек уже хорошо знакомы, поэтому перешли с вежливого *pan*/*pani* на неформальное *ty* (*masz*, *A ty?*, *twój*).
  pl.a1.unit05.lesson03.teach.dialogue.line02:
    title: Эва отвечает и спрашивает в ответ
    gloss: Эва говорит, что у неё есть брат и сестра, и задаёт Мареку тот же вопрос.
    note: '*A ty?* («А ты?») — краткий и естественный способ вернуть вопрос тому, кто его задал.'
  pl.a1.unit05.lesson03.teach.dialogue.line03:
    title: Марек отвечает
    gloss: Марек говорит, что у него есть только сестра и она живёт в Кракове, а потом спрашивает Эву о её брате.
    note: У Марека нет брата — только *tylko siostrę* («только сестра»). Вопрос о брате Эвы уместен, потому что Эва уже сказала, что он у неё есть.
  pl.a1.unit05.lesson03.teach.dialogue.line04:
    title: Эва отвечает
    gloss: Эва говорит, что её брат живёт в Гданьске и у него есть сын и дочь.
    note: Снова используется модель винительного падежа syn/córka из второго урока этого раздела.
  pl.a1.unit05.lesson03.teach.dialogue.line05:
    title: Марек реагирует
    gloss: 'Марек говорит: классная семья!'
    note: '*Fajna* — неформальное разговорное слово, означающее «классная», «здорово». Это естественная заключительная реплика, того же стиля, что и *Świetnie!* из четвёртого урока.'
