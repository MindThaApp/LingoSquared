teaching:
  pl.a1.unit17.lesson01.teach.jestem_zawod_note:
    title: Я инженер / учитель
    gloss: Я инженер. Я учительница. — Слова 'inżynier' и 'nauczycielka' меняют окончание после 'Jestem'.
    note: В этом курсе впервые окончание слова меняется, когда мы называем профессию. Пока это касается только этих двух слов.
  pl.a1.unit17.lesson01.teach.inzynier:
    title: Инженер
    gloss: инженер
    note: В повседневной речи это слово обычно остаётся *inżynier* и для женщины.
    example_gloss: Марек — инженер.
  pl.a1.unit17.lesson01.teach.nauczyciel_nauczycielka:
    title: Учительница
    gloss: учитель / учительница
    note: 'В отличие от *inżynier*, это слово меняется по роду: *nauczyciel* — мужчина, *nauczycielka* — женщина.'
    example_gloss:
    - Он учитель.
    - Эва — учительница.
  pl.a1.unit17.lesson01.teach.marek_ewa_recap:
    title: Марек и Эва снова
    gloss: Marek, Ewa — эти имена ты уже знаешь по прошлым урокам.
    note: Короткое напоминание перед уроком, где встретятся оба имени.
  pl.a1.unit17.lesson01.teach.jest_recap:
    title: Есть — снова
    gloss: Jest — это слово ты уже знаешь по прошлым урокам, например 'Dom jest tam' (дом там).
    note: Короткое напоминание перед уроком, где это слово помогает говорить о чьей-то профессии.
  pl.a1.unit17.lesson01.teach.marek_jest_inzynierem:
    title: Профессия Марека
    gloss: Марек — инженер.
    note: Факт о Мареке, на котором строится весь этот раздел.
  pl.a1.unit17.lesson01.teach.ewa_jest_nauczycielka:
    title: Профессия Эвы
    gloss: Эва — учительница.
    note: Факт об Эве, на котором строится весь этот раздел.
  pl.a1.unit17.lesson02.teach.pracowac_recap_pracujesz:
    title: Работать — ты работаешь
    gloss: 'Pracować (pracuję ты уже знаешь по прошлым урокам): pracuję (я), pracujesz (ты). Где ты работаешь?'
    note: 'Пока только две формы: *pracuję* — о себе, *pracujesz* — чтобы спросить другого. Так же, как с *czuć się* в прошлом разделе.'
  pl.a1.unit17.lesson02.teach.szkola:
    title: Школа
    gloss: школа
    note: Место, где работает учительница, например Эва.
    example_gloss: Я работаю в школе.
  pl.a1.unit17.lesson02.teach.biuro:
    title: Офис
    gloss: офис
    note: Место, где работает инженер, например Марек.
    example_gloss: Я работаю в офисе.
  pl.a1.unit17.lesson02.teach.w_miejsce_pracy_note:
    title: В школе, в офисе
    gloss: 'W + место работы: w szkole, w biurze — так же, как w Warszawie или w Krakowie.'
    note: 'Это та же идея, что и в названиях городов, которые ты уже выучил(а): *w Warszawie*, *w Krakowie*. Окончание немного меняется, чтобы сказать *в/на* этом месте.'
  pl.a1.unit17.lesson02.teach.gdzie_pracujesz_phrase:
    title: Где ты работаешь?
    gloss: Где ты работаешь?
    note: Естественный вопрос о чьей-то работе.
  pl.a1.unit17.lesson03.teach.a_ty_recap:
    title: А ты — снова
    gloss: A ty — это выражение ты уже знаешь по прошлым урокам.
    note: Короткое напоминание перед диалогом этого урока.
  pl.a1.unit17.lesson03.teach.dialogue.line01:
    title: Марек спрашивает Эву о работе
    gloss: Где ты работаешь, Эва?
    note: Марек начинает разговор с прямого вопроса.
  pl.a1.unit17.lesson03.teach.dialogue.line02:
    title: Эва отвечает
    gloss: Я работаю в школе. Я учительница.
    note: Эва называет и место работы, и профессию — те же факты, что были в этом разделе раньше.
  pl.a1.unit17.lesson03.teach.dialogue.line03:
    title: Эва спрашивает Марека в ответ
    gloss: А ты, Марек? Где ты работаешь?
    note: Эва возвращает вопрос Мареку.
  pl.a1.unit17.lesson03.teach.dialogue.line04:
    title: Марек отвечает
    gloss: Я работаю в офисе. Я инженер.
    note: Марек называет и место работы, и профессию — те же факты, что были в этом разделе раньше.
