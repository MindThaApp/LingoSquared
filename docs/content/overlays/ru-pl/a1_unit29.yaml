  pl.a1.unit29.lesson02.teach.znasz_juz_prognoze:
    title: 'Глаголы для сообщения: отправлять и читать'
    gloss: Ты уже знаешь *prognoza pogody* (прогноз погоды). *Wiadomość* (сообщение) можно отправить (*wysyłam*, *wysyłasz*) или прочитать (*czytam*, *czytasz*).
    note: Новое слово связано с уже изученным сложным существительным из темы погоды.
  pl.a1.unit29.lesson02.teach.ewa_wysyla_wiadomosc:
    title: Эва отправляет сообщение через приложение
    gloss: Эва отправляет сообщение через приложение.
    note: 'После *wysyłać* (отправлять) канал связи выражается через *przez* + винительный падеж: *przez aplikację*.'
  pl.a1.unit29.lesson02.teach.marek_czyta_wiadomosc:
