  pl.a1.unit29.lesson04.teach.tomek_widze_wiadomosc:
    title: Томек видит сообщение
    gloss: 'Томек: Вижу сообщение. До субботы!'
  pl.a1.unit29.lesson04.teach.znasz_juz_do:
    title: Do widzenia и do + день
    gloss: 'Ты уже знаешь *Do widzenia!* Можно также назвать день: *Do soboty!*, *Do jutra!* (после *do* стоит родительный падеж).'
    note: Модель прощания из темы приветствий переносится на конкретный день.
  pl.a1.unit29.lesson05.teach.ewa_dzwoni_do:
    title: Кто чем пользуется?
    gloss: Эва каждый день звонит Мареку. Она пользуется телефоном, а не приложением. У Марека дома нет компьютера, но он выходит в интернет с телефона. Томек каждое утро смотрит прогноз погоды. Потом идёт бегать. Кася часто пишет Эве сообщения. А ты тоже каждый день пользуешься телефоном?
    note: Сравнивает, как четыре героя пользуются устройствами, по образцу сравнительного текста из темы спорта.
    glosses:
      dzwoni: звонит
      każdego: каждый
      dnia: день
      używa: пользуется
      telefonu: телефон
      aplikacji: приложение
      komputera: компьютер
      domu: дома
      internetu: интернет
      sprawdza: ищет, смотрит
      ranka: утро
      prognozę: прогноз погоды
      idzie: идёт
      biegać: бегать
      wysyła: отправляет
      często: часто
      wiadomość: сообщение
      używasz: пользуешься
