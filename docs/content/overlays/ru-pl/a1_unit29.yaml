  pl.a1.unit29.lesson03.teach.po_sprawdzam_stoi:
    title: Два глагола — два падежа
    gloss: 'После *sprawdzam* стоит винительный падеж: *prognozę pogody*. После *używam* стоит родительный падеж: *telefonu*.'
    note: 'Большинство глаголов требует винительного падежа, но *używać* — исключение: после него нужен родительный падеж.'
  pl.a1.unit29.lesson03.teach.tomek_sprawdza_prognoze:
