  pl.a1.unit29.lesson04.teach.marek_dobry_pomysl:
    title: Марек соглашается
    gloss: 'Марек: Хорошая идея! Я посмотрю прогноз погоды.'
    note: '*Dobry pomysł!* — короткий ответ на предложение; прилагательное *dobry* согласуется с существительным мужского рода *pomysł*.'
  pl.a1.unit29.lesson04.teach.marek_w_sobote:
    title: Марек проверяет погоду
    gloss: 'Марек: В субботу будет солнечно!'
