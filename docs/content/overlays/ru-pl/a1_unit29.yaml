    title: Томек каждое утро смотрит прогноз
    gloss: Томек каждое утро смотрит прогноз погоды.
  pl.a1.unit29.lesson05.teach.kasia_czesto_wysyla:
    title: Кася часто пишет Эве
    gloss: Кася часто отправляет Эве сообщения.
  pl.a1.unit29.lesson06.teach.ewa_widze_wiadomosc:
    title: Эва подтверждает план
    gloss: 'Эва: Вижу сообщение. Позанимаемся в субботу в десять в парке?'
  pl.a1.unit29.lesson06.teach.marek_tak_a:
    title: Марек подтверждает прогноз
    gloss: 'Марек: Да, и в субботу будет солнечно!'
  pl.a1.unit29.lesson06.teach.tomek_wtedy_pobiegam:
    title: План Томека
    gloss: 'Томек: Тогда я побегаю. Потом ещё поиграю в футбол.'
    note: '*Wtedy* («тогда») и *potem* («потом») показывают последовательность событий; *pobiegam* и *zagram* — глаголы совершенного вида, поэтому звучат как планы.'
  pl.a1.unit29.lesson06.teach.kasia_wole_plywac:
    title: План Каси
    gloss: 'Кася: Я предпочитаю плавать, но в парк тоже приду.'
    note: '*Wolę* значит «я предпочитаю», после него стоит инфинитив: *wolę pływać*.'
  pl.a1.unit29.lesson06.teach.ewa_super_do:
    title: Эва завершает разговор
    gloss: 'Эва: Отлично! До субботы в парке!'
    note: Одной фразой завершает переписку этого урока и план из темы спорта.
