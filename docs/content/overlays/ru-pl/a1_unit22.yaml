teaching:
  pl.a1.unit22.lesson01.teach.dzwonic:
    title: Звонить
    gloss: звонить
    note: Инфинитив глагола, которым обозначают звонок по телефону.
    example_gloss: Мне нужно тебе позвонить.
  pl.a1.unit22.lesson01.teach.zadzwonie_do_ciebie:
    title: Говорим, что позвоним
    gloss: Я тебе позвоню.
    note: '*Zadzwonię* — будущее время совершенного вида от *zadzwonić* (позвонить, один раз). По-польски его используют для обещания, как и по-русски: «Я позвоню».'
  pl.a1.unit22.lesson01.teach.halo_tu_ewa:
    title: Отвечаем на звонок
    gloss: Алло, это Эва.
    note: '*Tu* + имя (буквально «здесь ...») — стандартный способ представиться по телефону; по-русски в этой ситуации говорят «Это ...».'
  pl.a1.unit22.lesson01.teach.halo_tu_marek:
    title: Марек отвечает так же
    gloss: Алло, это Марек.
    note: Та же модель *tu* + имя, что и в *Halo, tu Ewa*.
  pl.a1.unit22.lesson02.teach.z_kim_rozmawiam:
    title: Спрашиваем, кто звонит
    gloss: С кем я разговариваю?
    note: '*Z kim rozmawiam?* (буквально «с кем я разговариваю?») — стандартная фраза, когда звонит незнакомый человек; *kim* — творительный падеж после *z*.'
  pl.a1.unit22.lesson02.teach.rozmawia_pan_z:
    title: Представляемся официально
    gloss: С вами говорит Эва.
    note: '*Rozmawia pan z Ewą* — вежливая форма: *pan* (к мужчине) или *pani* (к женщине) с глаголом в 3-м лице и *z* + творительный падеж.'
  pl.a1.unit22.lesson03.teach.mozesz_to_powtorzyc:
    title: Просим повторить
    gloss: Ты можешь повторить?
    note: '*Możesz* (ты можешь, от *móc*) + инфинитив *powtórzyć* (повторить) + *to* (это).'
  pl.a1.unit22.lesson03.teach.nie_mow_tak:
    title: Просим говорить помедленнее
    gloss: Не говори так быстро, пожалуйста.
    note: '*Nie mów* — отрицательная форма повелительного наклонения (не говори); *tak szybko* значит «так быстро».'
  pl.a1.unit22.lesson03.teach.nie_slysze_cie:
    title: Говорим, что плохо слышно
    gloss: Я тебя плохо слышу.
    note: '*Nie słyszę cię dobrze* сообщает о проблемах со слышимостью; *cię* — винительный падеж от *ty*, а *dobrze* значит «хорошо».'
  pl.a1.unit22.lesson04.teach.sms:
    title: Сообщение
    gloss: сообщение
    note: '*SMS* — существительное мужского рода: *ten SMS*.'
    example_gloss: Сообщение от Эвы.
  pl.a1.unit22.lesson04.teach.wysle_ci_sms:
    title: Как сказать, что отправишь сообщение
    gloss: Я пришлю тебе сообщение.
    note: '*Wysłać* (отправить) требует дательного падежа *ci* (тебе) для адресата и винительного для того, что отправляют: *Wyślę ci SMS*.'
  pl.a1.unit22.lesson04.teach.oddzwonie_pozniej:
    title: Как сказать, что перезвонишь
    gloss: Я позвоню тебе позже.
    note: '*Oddzwonić* (перезвонить) в польском — один глагол: *oddzwonię później*.'
  pl.a1.unit22.lesson05.teach.marek_czesc_ewo:
    title: Прочитай переписку
    gloss: 'Марек: Привет, Эва, можешь мне позвонить? Мне нужно тебе кое-что сказать. Эва: Да, конечно, перезвоню через пять минут.'
    note: Обрати внимание, о чём просит Марек, зачем и когда Эва обещает перезвонить.
    glosses:
      Cześć: привет
      możesz: мочь
      zadzwonić: звонить
      Muszę: надо / должен
      coś: что-то
      powiedzieć: рассказать
      oczywiście: конечно
      oddzwonię: звонить
      pięć: пять
      minut: минуты
      za: обратно
  pl.a1.unit22.lesson06.teach.marek_halo_tu:
    title: Марек отвечает на звонок
    gloss: 'Марек: Алло, это Марек.'
    note: 'Та же модель *tu* + имя из урока 1, теперь в настоящем телефонном разговоре: тот, кто берёт трубку, говорит первым и называет своё имя.'
  pl.a1.unit22.lesson06.teach.ewa_czesc_marku:
    title: Эва представляется
    gloss: 'Эва: Привет, Марек, это Эва. Марек: Как здорово, что ты звонишь!'
    note: '*Fajnie, że* ... (здорово, что ...) выражает положительную реакцию на событие; *że* вводит придаточную часть.'
  pl.a1.unit22.lesson06.teach.ewa_jak_ci:
    title: Эва спрашивает про смену
    gloss: 'Эва: Как прошла твоя первая смена?'
    note: '*Jak ci poszła ...?* (буквально «как тебе пошла ...?») — вопрос о том, что уже произошло. *Ci* — дательный падеж от *ty*, а *poszła* согласуется с существительным женского рода *zmiana*.'
  pl.a1.unit22.lesson06.teach.marek_poszlo_bardzo:
    title: Марек рассказывает хорошую новость
    gloss: 'Марек: Всё прошло очень хорошо, лучше, чем я думал.'
    note: '*Poszło* — прошедшее время от *iść* с окончанием *-o* («оно»; здесь «сложилось, прошло»); *myślałem* — прошедшее время от *myśleć* (думать), форма говорящего-мужчины.'
  pl.a1.unit22.lesson06.teach.czas_przeszly_bylo:
    title: 'Прошедшее время: było, poszło, myślałem'
    gloss: 'Прошедшее время: *było* (было) от *być* (быть), *poszło* (пошло) от *iść* (идти), *myślałem* (я думал) от *myśleć* (думать).'
    note: 'Прошедшее время в польском образуется с помощью *-ł-* и родового окончания: *myślał* (он), *myślała* (она), *było* (оно). Пока выучи *było*, *poszło* и *myślałem* как готовые формы в тех ситуациях, где они встречаются в этом уроке.'
  pl.a1.unit22.lesson06.teach.ewa_jak_milo:
    title: Эва гордится
    gloss: 'Эва: Как приятно это слышать! Я горжусь тобой.'
    note: '*Dumny z* («гордый кем-то») — устойчивое сочетание: *z* + родительный падеж, поэтому *z ciebie*. Ева — женщина, поэтому она говорит *dumna*.'
  pl.a1.unit22.lesson06.teach.marek_dziekuje_ci:
    title: Марек тронут
    gloss: 'Марек: Большое спасибо, для меня это много значит.'
    note: '*Znaczy* — форма 3-го лица единственного числа (*on/ona/ono*) глагола *znaczyć* («значить»); *dla mnie* («для меня») показывает, для кого это важно.'
  pl.a1.unit22.lesson06.teach.jego_pierwsza_zmiana:
    title: Его
    gloss: Его первая смена прошла очень хорошо.
    note: '*Jego* («его») не изменяется и стоит перед существительным: *jego pierwsza zmiana*; существительное женского рода на него не влияет.'
