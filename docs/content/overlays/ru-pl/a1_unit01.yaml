answer_policy:
  diacritics: Display and teach all Polish diacritics (ą ć ę ł ń ó ś ź ż). In typed A1 answers, accept a variant with the diacritic dropped or swapped for its plain-letter equivalent (a/c/e/l/n/o/s/z/z) when every other letter and word is correct -- these are genuinely hard to type on a non-Polish keyboard and this is a beginner course, not a spelling test. Do not extend this tolerance to ł vs l at the START of a word where it changes which real word is meant (not a relevant case in this unit's vocabulary, but noted for future units). Punctuation marks (?, !) may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names (Anna, Marek, Kowalska, Wójcik) and in the place name Warszawie.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (pan/pani vs ty) rather than written punctuation or diacritics.
course:
  title: Польский A1
  description: Научись приветствовать людей, спрашивать, как дела, представляться и обмениваться основными сведениями о себе по-польски. Особое внимание уделено системе обращений pan/pani/ty (в польском это настоящее грамматическое различие, похожее на русское «вы» и «ты»), согласованию окончаний глаголов и выбору подходящего регистра.
units:
  pl.a1.unit01.greetings:
    title: Приветствия и первые встречи
lessons:
  pl.a1.unit01.lesson01.address_and_wellbeing:
    title: 'Pan, pani и ty: как спросить, как дела'
  pl.a1.unit01.lesson02.greetings_by_time:
    title: Приветствия и прощания в разное время суток
  pl.a1.unit01.lesson03.names_origin_and_smalltalk:
    title: Имя, фамилия и откуда ты
teaching:
  pl.a1.unit01.lesson01.teach.pan:
    title: Вежливое обращение к мужчине
    gloss: господин (вежливое обращение к мужчине)
    note: 'В русском вежливое обращение — это «вы», а в польском есть особое слово: *pan* употребляется при обращении к незнакомому или уважаемому по работе мужчине. Грамматически *pan* ведёт себя как подлежащее в третьем лице: «pan jest» буквально значит «господин есть», хотя по смыслу это «вы есть», а не настоящая форма второго лица.'
  pl.a1.unit01.lesson01.teach.pani:
    title: Вежливое обращение к женщине
    gloss: госпожа (вежливое обращение к женщине)
    note: 'Женский parallel к *pan*. Слово *pani* используется при обращении к незнакомой или уважаемой по работе женщине. К любой взрослой женщине обращаются *pani* независимо от семейного положения: в польском нет различия, как в старом русском «барышня»/«сударыня» по признаку замужества.'
  pl.a1.unit01.lesson01.teach.ty:
    title: Неформальное «ты»
    gloss: ты (неформально, один человек)
    note: '*Ty* используется при общении с одним другом, ровесником, родственником, ребёнком и вообще с тем, с кем отношения неформальные. В отличие от *pan*/*pani*, при *ty* глагол стоит в настоящей форме второго лица, например *masz* («у тебя есть»), а не в форме третьего лица.'
  pl.a1.unit01.lesson01.teach.jak_sie_pan_ma:
    title: Вежливый вопрос о самочувствии, к мужчине
    gloss: Как вы поживаете? (мужчине, на «вы»)
    note: 'Буквально: «как чувствует себя господин». *Ma* — форма третьего лица глагола (она согласуется с *pan* как подлежащим), та же, что и у *on* («он»).'
  pl.a1.unit01.lesson01.teach.jak_sie_pani_ma:
    title: 'Та же модель, что и в Jak się pan ma?, только вместо pan стоит pani. Форма глагола ma не меняется: это одно и то же окончание третьего лица независимо от пола собеседника.'
    gloss: Как дела? (к женщине, вежливо)
    note: 'Та же конструкция, что и *Jak się pan ma?*, только вместо *pan* стоит *pani*. Форма глагола *ma* не меняется: это одно и то же окончание 3-го лица, независимо от того, мужчина или женщина адресат.'
  pl.a1.unit01.lesson01.teach.jak_sie_masz:
    title: Неформальный вопрос о самочувствии
    gloss: Как дела? (на «ты»)
    note: 'С *ty* глагол принимает настоящее окончание 2-го лица *masz*, а не *ma*. Сравни вежливое *Jak się pan/pani ma?* и неформальное *Jak się masz?*: это самая полезная минимальная пара, чтобы услышать по самому глаголу разницу между pan/pani и ty.'
  pl.a1.unit01.lesson01.teach.dobrze_dziekuje:
    title: Стандартный ответ
    gloss: Хорошо, спасибо.
    note: '*Dziękuję* («спасибо») не меняется в зависимости от регистра: это то же слово, отвечаешь ли ты *pan*, *pani* или *ty*. Формальность выражается только в самом вопросе.'
  pl.a1.unit01.lesson01.teach.a_pan:
    title: Возвращаем вежливый вопрос
    gloss: А вы? (мужчине, на «вы»)
    note: Короткий способ вернуть вопрос мужчине, к которому ты обращаешься на «вы». Если собеседница — женщина, замени *pan* на *pani* («A pani?»).
  pl.a1.unit01.lesson01.teach.a_ty:
    title: Возвращаем неформальный вопрос
    gloss: А ты? (неформально)
    note: Используй *ty*, чтобы вернуть вопрос другу или ровеснику.
  pl.a1.unit01.lesson02.teach.czesc:
    title: Неформальные «привет» и «пока»
    gloss: привет; пока (неформально)
    note: '*Cześć* — необычное польское приветствие: оно работает и как «привет», и как «пока» в одном неформальном регистре. В русском для этого нужны два разных слова. Употребляется только в отношениях на *ty*, никогда с *pan*/*pani*.'
    example_gloss: Привет, как дела?
  pl.a1.unit01.lesson02.teach.dzien_dobry:
    title: Приветствие на весь день
    gloss: доброе утро; добрый день
    note: '*Dzień dobry* подходит в любое время до вечера и, в отличие от *cześć*, нейтрально по регистру: его можно сказать и *pan*, и *pani*, и *ty*. Это самое безопасное приветствие для человека, которого ты плохо знаешь.'
  pl.a1.unit01.lesson02.teach.dobry_wieczor:
    title: Вечернее приветствие
    gloss: добрый вечер
    note: Заменяет *dzień dobry*, когда наступает вечер. Нейтрально по регистру, как и dzień dobry.
  pl.a1.unit01.lesson02.teach.dobranoc:
    title: Прощание на ночь
    gloss: спокойной ночи
    note: 'В отличие от *dzień dobry*/*dobry wieczór*, *dobranoc* — это прощание, а не приветствие: его говорят, когда кто-то уходит или ложится спать, но никогда не начинают им разговор.'
    example_gloss: Спокойной ночи, Пётр!
  pl.a1.unit01.lesson02.teach.do_widzenia:
    title: Обычное прощание
    gloss: до свидания; прощай
    note: 'Нейтральный способ попрощаться, подходящий в любом регистре: с *pan*, *pani* и *ty*. Звучит более окончательно, чем *do zobaczenia*.'
  pl.a1.unit01.lesson02.teach.do_zobaczenia:
    title: Прощание «до встречи»
    gloss: увидимся
    note: 'Буквально: «пока [мы] не увидимся». Подразумевает, что вы ещё встретитесь, в отличие от более нейтрального *do widzenia*.'
  pl.a1.unit01.lesson02.teach.milego_dnia:
    title: Вежливое прощальное пожелание
    gloss: Хорошего дня!
    note: В *Miłego dnia* используется родительный падеж в пожелании, как и в *smacznego* («приятного аппетита»). Это устойчивая конструкция, которую лучше выучить целиком, а не разбирать по падежам на этом этапе.
  pl.a1.unit01.lesson03.teach.jak_sie_pan_nazywa:
    title: Спросить имя вежливо
    gloss: Как вас зовут? (мужчине, на «вы»)
    note: 'Буквально: «как господин называет себя». *Nazywać się* — возвратный глагол со значением «называться». Если обращаешься к женщине, замени *pan* на *pani*.'
  pl.a1.unit01.lesson03.teach.jak_masz_na_imie:
    title: Спросить имя неформально
    gloss: Как тебя зовут?
    note: Здесь другой оборот, *mieć na imię* («иметь в качестве имени»), и он спрашивает именно об имени, а не о фамилии или полном имени. Это естественный неформальный способ спросить имя у ровесника.
  pl.a1.unit01.lesson03.teach.nazywam_sie:
    title: Назвать полное имя
    gloss: Меня зовут Анна Ковальская.
    note: Форма первого лица от *nazywać się*; после неё обычно называют имя и фамилию вместе. Это более официальный и полный способ представиться.
  pl.a1.unit01.lesson03.teach.mam_na_imie:
    title: Назвать имя
    gloss: Меня зовут Анна.
    note: Форма первого лица от *mieć na imię*; после неё обычно называют только имя. Это неформальный вариант к *Nazywam się...*.
  pl.a1.unit01.lesson03.teach.bardzo_mi_milo:
    title: Радость от знакомства
    gloss: Очень приятно.
    note: Устойчивое, очень распространённое выражение при первой встрече; уместно и в официальной, и в неформальной обстановке.
  pl.a1.unit01.lesson03.teach.skad_jestes:
    title: Спросить, откуда ты, неформально
    gloss: Откуда вы?
    note: '*Skąd* значит «откуда». Здесь показана неформальная форма на *ty*; вежливый вариант *Skąd pan/pani jest?* встретится в заключительном диалоге урока.'
  pl.a1.unit01.lesson03.teach.jestem_z:
    title: Говорим о своём происхождении
    gloss: Я из Канады.
    note: После *z* («из») нужен родительный падеж, поэтому *Kanada* превращается в *Kanady*. Большинство названий стран после *z* ведут себя так же.
  pl.a1.unit01.lesson03.teach.mieszkam_w:
    title: Говорим, где живёшь
    gloss: Я живу в Варшаве.
    note: После *w* («в») здесь нужен местный падеж (локатив), поэтому *Warszawa* превращается в *Warszawie*. Происхождение (с *z*) и нынешнее место жительства (с *w*) требуют разных падежей названия места; стоит заметить эту закономерность, а не заучивать её как исключение.
  pl.a1.unit01.lesson03.teach.dialogue.line01:
    title: Начало встречи
    gloss: Эва здоровается с Мареком и вежливо спрашивает, как его зовут.
    note: 'Эва обращается на *pan* к человеку, которого только что встретила: это безопасный выбор для первой деловой или малознакомой встречи.'
  pl.a1.unit01.lesson03.teach.dialogue.line02:
    title: Начало встречи, ответ
    gloss: Марек называет полное имя и говорит, что ему приятно познакомиться.
    note: '*Nazywam się* с именем и фамилией — естественный и полный ответ на вежливый вопрос об имени.'
  pl.a1.unit01.lesson03.teach.dialogue.line03:
    title: Вопрос о происхождении
    gloss: Эва отвечает взаимностью и вежливо спрашивает, откуда Марек.
    note: '*Skąd pan jest?* — вежливый вариант к *Skąd jesteś?* из этого урока. Здесь стоит *jest*, та же форма третьего лица, что уже встречалась в *pan jest*/*pan ma*.'
  pl.a1.unit01.lesson03.teach.dialogue.line04:
    title: Вопрос о происхождении, ответ
    gloss: Марек говорит, что он из Канады, но живёт в Варшаве.
    note: '*Ale* («но») связывает противопоставление: откуда Марек родом и где живёт сейчас. Это то же различие, что передают *jestem z* и *mieszkam w*.'
  pl.a1.unit01.lesson03.teach.dialogue.line05:
    title: Вопрос о знании языка
    gloss: Эва вежливо спрашивает, говорит ли Марек по-польски.
    note: '*Czy* в начале предложения открывает вопрос с ответом «да» или «нет». В русском такой вопрос можно задать одной интонацией или частицей «ли», а в польском слово *czy* сразу показывает, что дальше идёт вопрос.'
  pl.a1.unit01.lesson03.teach.dialogue.line06:
    title: Вопрос о знании языка, ответ и прощание
    gloss: Марек говорит, что немного говорит и ещё учится, а затем прощается.
    note: '*Jeszcze się uczę* («я ещё учусь») — естественный и скромный способ сказать о своих усилиях. Это полезно и тебе как изучающему язык.'
exercises:
  pl.a1.unit01.lesson01.exercise01.select_formal_man:
    instruction: Какое слово служит вежливым и уважительным обращением к мужчине?
    correct_option: pan
    distractors:
    - pani
    - ty
    accepted_answers:
    - pan
    feedback: Pan — вежливое обращение к мужчине, глагол при нём стоит в форме третьего лица.
  pl.a1.unit01.lesson01.exercise02.select_formal_woman:
    instruction: Какое слово служит вежливым и уважительным обращением к женщине?
    correct_option: pani
    distractors:
    - pan
    - ty
    accepted_answers:
    - pani
    feedback: Pani — вежливое обращение к женщине; глагол при нём стоит в той же форме третьего лица, что и при pan.
  pl.a1.unit01.lesson01.exercise03.select_informal:
    instruction: Какое слово служит неформальным обращением к одному другу или ровеснику?
    correct_option: ty
    distractors:
    - pan
    - pani
    accepted_answers:
    - ty
    feedback: Ty употребляется с друзьями, ровесниками и в неформальных отношениях; глагол при нём имеет настоящие окончания второго лица.
  pl.a1.unit01.lesson01.exercise04.order_formal_wellbeing:
    instruction: Расставь в правильном порядке вежливый вопрос о самочувствии (к мужчине).
    accepted_answers:
    - - Jak
      - się
      - pan
      - ma
    - - Jak
      - pan
      - się
      - ma
  pl.a1.unit01.lesson01.exercise05.order_informal_wellbeing:
    instruction: Расставь в правильном порядке неформальный вопрос о самочувствии.
    correct_response:
    - Jak
    - się
    - masz
  pl.a1.unit01.lesson01.exercise06.return_formal:
    instruction: Верни вопрос, сохраняя вежливый регистр.
    correct_option: A pan?
    distractors:
    - A ty?
    - Jak się masz?
    accepted_answers:
    - A pan?
    - A pan
    - A pani?
    - A pani
    feedback: A pan?/A pani? сохраняет вежливый регистр, когда ты возвращаешь вопрос.
  pl.a1.unit01.lesson01.exercise07.return_informal:
    instruction: Верни вопрос другу или ровеснику.
    correct_option: A ty?
    distractors:
    - A pan?
    - A pani?
    accepted_answers:
    - A ty?
    - A ty
    feedback: A ty? — неформальный способ вернуть вопрос.
  pl.a1.unit01.lesson01.exercise08.correct_informal_agreement:
    instruction: 'Исправь неформальный вопрос: в нём ty сочетается с неверным окончанием глагола.'
    accepted_answers:
    - Jak się masz?
    - Jak się masz
    - Jak ty się masz?
    - Jak się ty masz?
    feedback: 'При ty нужно окончание masz, а не ma: ma используется только с pan/pani (или on/ona).'
  pl.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: Вежливо ответь на вопрос.
    accepted_answers:
    - Dobrze, dziękuję.
    - Dobrze, dziękuję
    - Dziękuję, dobrze.
    - Dobrze, dziękuję. A pan?
    - Dziękuję, dobrze. A pan?
    - Dobrze, dziękuję. A pani?
    - Dziękuję, dobrze. A pani?
  pl.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: Ответь неформально, поблагодари собеседника и задай вопрос в ответ.
    accepted_answers:
    - Dobrze, dziękuję. A ty?
    - Dobrze, dziękuję, a ty?
    - Dobrze, dziękuję. A ty
    - Dziękuję, dobrze. A ty?
  pl.a1.unit01.lesson02.exercise01.select_hi:
    instruction: Какое слово в неформальном общении может значить и «привет», и «пока»?
    correct_option: Cześć
    distractors:
    - Dzień dobry
    - Do widzenia
    accepted_answers:
    - Cześć
  pl.a1.unit01.lesson02.exercise02.select_evening:
    instruction: Какое приветствие используют вечером?
    correct_option: Dobry wieczór
    distractors:
    - Dzień dobry
    - Dobranoc
    accepted_answers:
    - Dobry wieczór
  pl.a1.unit01.lesson02.exercise03.select_night_meaning:
    instruction: Что значит это слово?
    correct_option: Спокойной ночи.
    distractors:
    - Добрый вечер.
    - До встречи.
    accepted_answers:
    - Спокойной ночи.
    feedback: Dobranoc — это прощание, которое говорят, когда кто-то уходит на ночь, а не приветствие.
  pl.a1.unit01.lesson02.exercise04.order_morning:
    instruction: Расставь в правильном порядке приветствие на весь день.
    correct_response:
    - Dzień
    - dobry
  pl.a1.unit01.lesson02.exercise05.order_goodbye:
    instruction: Расставь в правильном порядке обычное прощание.
    correct_response:
    - Do
    - widzenia
  pl.a1.unit01.lesson02.exercise06.order_see_you:
    instruction: Расставь в правильном порядке прощание «до встречи».
    correct_response:
    - Do
    - zobaczenia
  pl.a1.unit01.lesson02.exercise07.order_nice_day:
    instruction: Составь вежливое пожелание на прощание.
    correct_response:
    - Miłego
    - dnia
  pl.a1.unit01.lesson02.exercise08.reply_to_evening:
    instruction: Ответь на вечернее приветствие, а затем попрощайся.
    accepted_answers:
    - Dobry wieczór. Do widzenia.
    - Dobry wieczór, do widzenia.
  pl.a1.unit01.lesson02.exercise09.speak_friendly_closing:
    instruction: Скажи дружеское «до встречи».
    accepted_answers:
    - Do zobaczenia.
    - Do zobaczenia
  pl.a1.unit01.lesson03.exercise01.select_formal_name_question:
    instruction: Какой вопрос вежливо спрашивает имя мужчины?
    correct_option: Jak się pan nazywa?
    distractors:
    - Jak masz na imię?
    - Skąd jesteś?
    accepted_answers:
    - Jak się pan nazywa?
    - Jak się pan nazywa
  pl.a1.unit01.lesson03.exercise02.select_informal_name_question:
    instruction: Какой вопрос неформально спрашивает имя друга?
    correct_option: Jak masz na imię?
    distractors:
    - Jak się pan nazywa?
    - Jak się masz?
    accepted_answers:
    - Jak masz na imię?
    - Jak masz na imię
