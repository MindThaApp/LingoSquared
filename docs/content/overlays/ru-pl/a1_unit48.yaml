  pl.a1.unit48.lesson04.exercise02.comprehend_nowy_film:
    instruction: Послушай диалог и выбери, какой фильм хочет посмотреть Нина.
    correct_option: Новый фильм.
    distractors:
    - Детский сеанс.
    - Подойдёт любой фильм.
    - Она не говорит.
    accepted_answers:
    - value: Новый фильм.
      status: correct
    feedback: Нина хочет *nowy film*. Прилагательное *nowy* согласуется с существительным мужского рода *film*; как неодушевлённое дополнение оно в винительном падеже не меняется.
    prompt_blocks:
    - Какой фильм хочет посмотреть Нина?
  pl.a1.unit48.lesson04.exercise03.comprehend_a_na_ktora:
    instruction: Послушай диалог и выбери, о чём Ига спрашивает Нину дальше.
    correct_option: На какое время ей нужен сеанс.
    distractors:
    - Хочет ли она попкорн.
    - Нужен ли ей чек.
    - Она больше ни о чём не спрашивает.
    accepted_answers:
    - value: На какое время ей нужен сеанс.
      status: correct
    feedback: Ига спрашивает *a na którą godzinę?* *Na* с винительным падежом используется для времени, на которое заказан сеанс, а *którą* согласуется с существительным женского рода *godzina*.
    prompt_blocks:
    - О чём Ига спрашивает Нину дальше?
  pl.a1.unit48.lesson04.exercise04.comprehend_na_osma:
    instruction: Послушай диалог и выбери, на какое время Нина хочет сеанс.
    correct_option: На восемь часов.
    distractors:
    - На семь часов.
    - На шесть часов.
    - В диалоге об этом не сказано.
    accepted_answers:
    - value: На восемь часов.
      status: correct
    feedback: Нина говорит *na ósmą* («на восемь»). Порядковое числительное *ósma* согласуется с существительным женского рода *godzina* и стоит в винительном падеже после *na*.
