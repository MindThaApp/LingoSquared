teaching:
  pl.a1.unit23.lesson01.teach.ile_to_kosztuje:
    title: Спрашиваем общую стоимость
    gloss: Сколько это стоит всего?
    note: '*W sumie* («в сумме», «всего») уточняет, что тебя интересует полная общая цена, а не цена одной вещи.'
  pl.a1.unit23.lesson01.teach.w_sumie_to:
    title: Называем общую стоимость
    gloss: Всего это стоит сто злотых.
    note: '*Kosztuje* — форма 3-го лица единственного числа (*on/ona/ono*) глагола *kosztować* («стоить»). Числительные от 5 и выше требуют родительного падежа множественного числа: *sto złotych*.'
  pl.a1.unit23.lesson02.teach.placic_karta_placic:
    title: Оплата картой или наличными
    gloss: платить картой, платить наличными
    note: '*Płacić kartą* («платить картой») и *płacić gotówką* («платить наличными») используют творительный падеж после *płacić*: *kartą*, *gotówką*.'
    example_gloss:
    - Можно здесь заплатить картой?
    - Я плачу наличными.
  pl.a1.unit23.lesson02.teach.czy_moge_tu:
    title: Спрашиваем, можно ли платить картой
    gloss: Можно здесь заплатить картой?
    note: '*Tu* («здесь») привязывает вопрос к месту, где ты находишься; *czy* вводит вопрос с ответом «да/нет», а *mogę* значит «я могу».'
  pl.a1.unit23.lesson02.teach.czy_chce_pan:
    title: Спрашиваем о способе оплаты
    gloss: Вы хотите заплатить наличными или картой?
    note: '*Czy chce pan ...?* — вежливая форма от *Czy chcesz ...?*; здесь так говорит незнакомый кассир (*pan* — к мужчине, *pani* — к женщине).'
  pl.a1.unit23.lesson03.teach.rachunek:
    title: Счёт
    gloss: счёт
    note: 'Существительное мужского рода: *rachunek* (родительный падеж *rachunku*).'
    example_gloss: Разделим счёт?
  pl.a1.unit23.lesson03.teach.moze_podzielimy_rachunek:
    title: Предлагаем разделить счёт
    gloss: Разделим счёт?
    note: '*Może podzielimy ...?* — вежливый способ предложить что-то сделать вместе; *podzielimy* — форма 1-го лица множественного числа (*my*) от *podzielić*.'
  pl.a1.unit23.lesson03.teach.czy_moge_zaplacic:
    title: Просим заплатить раздельно
    gloss: Можно заплатить раздельно?
    note: '*Osobno* («отдельно») сочетается с *zapłacić* («заплатить», совершенный вид: одна завершённая оплата).'
  pl.a1.unit23.lesson04.teach.reszta:
    title: Сдача
    gloss: сдача
    note: 'Существительное женского рода: *reszta* (родительный падеж *reszty*, как в *nie potrzebuję reszty*).'
    example_gloss: Вот ваша сдача.
  pl.a1.unit23.lesson04.teach.oto_pana_reszta:
    title: Отдаём сдачу
    gloss: Вот ваша сдача.
    note: '*Pana* — вежливое «ваш» (к мужчине; к женщине — *pani*), что соответствует официальному тону у кассы.'
  pl.a1.unit23.lesson04.teach.nie_potrzebuje_reszty:
    title: Отказываемся от сдачи
    gloss: Сдача не нужна.
    note: '*Nie potrzebuję* + родительный падеж: при отрицании дополнение ставится в родительный падеж, поэтому *reszty*.'
  pl.a1.unit23.lesson05.teach.trzydziesci_piec:
    title: Тридцать пять
    gloss: тридцать пять
    note: '*Trzydzieści pięć* пишется двумя словами: сначала десятки, потом единицы (30 + 5).'
    example_gloss: Это стоит сто сорок злотых.
  pl.a1.unit23.lesson05.teach.rachunek_dwa_dania:
    title: Читаем счёт из ресторана
    gloss: 'Счёт: два основных блюда и два кофе. Итого: сто сорок злотых. Оплачено картой.'
    note: Обрати внимание, что заказали, какова итоговая сумма и как заплатили.
    glosses:
      Rachunek: счёт
      dwa: два
      dania: основные блюда (dania główne)
      kawy: кофе
      Razem: итого
      złotych: злотые
      Zapłacono: оплачено
      kartą: карта
      sto: сто
      czterdzieści: сорок
  pl.a1.unit23.lesson06.teach.ewa_moze_poprosimy:
    title: Ева просит счёт
    gloss: 'Ева: Попросим счёт?'
    note: 'После *poprosić o* («попросить что-то») стоит винительный падеж: *o rachunek*. *Poprosimy* — будущее время совершенного вида.'
  pl.a1.unit23.lesson06.teach.marek_tak_dobry:
    title: Марек спрашивает итоговую сумму
    gloss: 'Марек: Да, хорошая идея. Сколько это стоит всего?'
    note: Здесь повторяется вопрос *Ile to kosztuje w sumie?* из первого урока.
  pl.a1.unit23.lesson06.teach.ewa_to_trzydziesci:
    title: Ева называет сумму
    gloss: 'Ева: Это сто сорок злотых. Разделим счёт?'
    note: В *Podzielimy się?* (буквально «разделимся?») возвратная частица *się* передаёт значение «поделить счёт между собой».
  pl.a1.unit23.lesson06.teach.marek_nie_dzisiaj:
    title: Марек настаивает на оплате
    gloss: 'Марек: Нет, сегодня плачу я. Ты мне так помогла!'
    note: '*Dzisiaj ja płacę* (буквально «сегодня я плачу») — обычный способ предложить заплатить; *pomogłaś* — прошедшее время женского рода от *pomóc* («помочь»), потому что Марек обращается к Еве.'
  pl.a1.unit23.lesson06.teach.ewa_jak_milo:
    title: Ева тронута
    gloss: 'Ева: Как мило с твоей стороны! Спасибо.'
    note: '*Miło z twojej strony* («мило с твоей стороны») — тёплый, частый комплимент за щедрый жест; *z* + родительный падеж: *z twojej strony*.'
  pl.a1.unit23.lesson06.teach.marek_czy_moge:
    title: Марек спрашивает об оплате картой
    gloss: 'Марек: Можно здесь заплатить картой?'
    note: Здесь повторяется вопрос *Czy mogę tu zapłacić kartą?* из второго урока, теперь уже в настоящем ресторане.
  pl.a1.unit23.lesson06.teach.marek_placi_rachunek:
    title: 'Płaci: форма he/she'
    gloss: Марек платит по счёту.
    note: '*Płaci* — форма *on/ona/ono* глагола *płacić* (платить).'
