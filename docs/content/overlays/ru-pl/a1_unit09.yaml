teaching:
  pl.a1.unit09.lesson01.teach.isc_dojsc:
    title: Идти, дойти
    gloss: идти; дойти
    note: 'Два близких глагола движения: iść — общее «идти», а dojść — именно «дойти» до цели; он нужен для вопроса, который разбирается в этом уроке.'
    example_gloss:
    - Идите прямо, пожалуйста.
    - Как дойти до банка?
  pl.a1.unit09.lesson01.teach.prosto:
    title: Прямо
    gloss: прямо
    note: 'Самое простое слово для направления: его ставят сразу после iść, чтобы сказать «идти прямо».'
    example_gloss: Идите прямо до парка, пожалуйста.
  pl.a1.unit09.lesson01.teach.tam_potem:
    title: Там, потом
    gloss: там; потом
    note: Tam указывает на место, а potem выстраивает шаги по порядку («сначала это, потом то»); оба слова нужны, чтобы связать указания в цепочку.
    example_gloss:
    - Банк там.
    - Потом идите прямо, пожалуйста.
  pl.a1.unit09.lesson01.teach.prosze_bezokolicznik:
    title: Please + infinitive
    gloss: 'Proszę + инфинитив — Proszę («пожалуйста») плюс глагол в неопределённой форме — обычный вежливый способ указать дорогу без отдельной формы приказа: Идите прямо, пожалуйста.'
    note: '*Proszę* плюс глагол в инфинитиве — так по-польски вежливо просят что-то сделать: *Proszę iść prosto* («Идите прямо, пожалуйста»). Это безопасный вежливый вариант для разговора с незнакомым человеком, поэтому отдельная форма повелительного наклонения, чтобы дать или понять указание пути, не нужна. (Между друзьями обычно используют именно повелительное наклонение — оно встретится позже.)'
  pl.a1.unit09.lesson01.teach.jak_dojsc_note:
    title: Как дойти до + [место]?
    gloss: 'Как дойти до + [место]? — Jak («как») плюс dojść («дойти») спрашивает дорогу к месту: Как дойти до банка? Как дойти до отеля? Как дойти до парка? Существительное после do получает то же окончание родительного падежа -u, что и после «рядом с» и «напротив» в прошлой теме: bank -> banku, hotel -> hotelu, park -> parku.'
    note: '*Jak dojść do...?* — обычный вопрос, когда нужно узнать, как добраться до места. Название места после *do* получает то же окончание родительного падежа *-u*, которое ты уже знаешь по *obok* и *naprzeciwko*: *bank* становится *banku*, *hotel* — *hotelu*, *park* — *parku*. Схема та же, только предлог новый.'
  pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku:
    title: Как дойти до банка?
    gloss: Как мне пройти к банку?
    note: Схема из грамматической заметки в деле — с первым пунктом назначения в этом уроке.
  pl.a1.unit09.lesson02.teach.prawo_lewo:
    title: Право, лево
    gloss: право; лево
    note: 'Используются после na, чтобы сказать, где что-то находится или куда поворачивать: na prawo (направо / справа), na lewo (налево / слева).'
    example_gloss:
    - Банк справа.
    - Парк слева.
  pl.a1.unit09.lesson02.teach.skrecic:
    title: Повернуть
    gloss: повернуть
    note: 'Глагол для смены направления: с na prawo / na lewo он означает «повернуть направо» / «повернуть налево».'
    example_gloss: Поверните направо, пожалуйста.
  pl.a1.unit09.lesson02.teach.skrecic_na_lewo:
    title: Поверните налево, пожалуйста
    gloss: Поверните налево, пожалуйста.
    note: Та же схема Proszę + инфинитив, только теперь с skręcić и na lewo.
  pl.a1.unit09.lesson02.teach.ulica:
    title: Улица
    gloss: улица
    note: Обычное слово для любой улицы; пригодится, когда в указаниях называют конкретную улицу.
    example_gloss: Улица там.
  pl.a1.unit09.lesson02.teach.multi_step_note:
    title: Цепочка указаний с potem
    gloss: 'Идите прямо, потом поверните направо. — Несколько указаний можно соединить запятой и словом potem («потом»): сначала одно действие, затем следующее.'
    note: 'Чтобы дать несколько указаний подряд, просто соедини их запятой и словом *potem*: *Proszę iść prosto, potem skręcić na prawo* («Идите прямо, потом поверните направо»). Именно так строятся настоящие указания пути из нескольких шагов.'
  pl.a1.unit09.lesson03.teach.rozumiem:
    title: Я понимаю
    gloss: я понимаю
    note: Удобный способ подтвердить, что ты понял(а) объяснение, прежде чем задать уточняющий вопрос.
    example_gloss: Я понимаю, спасибо.
  pl.a1.unit09.lesson03.teach.dialogue.line01:
    title: Эва спрашивает, как дойти до парка
    gloss: Эва извиняется и спрашивает, как дойти до парка.
    note: Przepraszam открывает вопрос — та же вежливая привычка, что и в диалоге о местах в предыдущем разделе.
  pl.a1.unit09.lesson03.teach.dialogue.line02:
    title: Прохожий объясняет дорогу до парка
    gloss: Прохожий говорит идти прямо, потом повернуть налево. Парк там.
    note: Два указания подряд со словом potem — точно так, как описано в грамматической заметке этого урока.
  pl.a1.unit09.lesson03.teach.dialogue.line03:
    title: Эва подтверждает и спрашивает про банк
    gloss: Эва говорит, что поняла, и спрашивает, как дойти до банка.
    note: Rozumiem подтверждает, что она поняла первое объяснение, прежде чем задать новый вопрос.
  pl.a1.unit09.lesson03.teach.dialogue.line04:
    title: Прохожий объясняет дорогу до банка
    gloss: Прохожий говорит повернуть направо, потом идти прямо. Банк справа.
    note: Другой маршрут из двух шагов, чем до парка, с той же конструкцией Proszę + инфинитив.
  pl.a1.unit09.lesson03.teach.dialogue.line05:
    title: Эва благодарит
    gloss: Эва говорит «большое спасибо».
    note: Dziękuję bardzo — уже встречалось в разделах о покупках и о местах.
  pl.a1.unit09.lesson03.teach.dialogue.line06:
    title: Прохожий отвечает
    gloss: Прохожий говорит «пожалуйста».
    note: Proszę bardzo — стандартный ответ на благодарность, уже встречался в прежних разделах.
