teaching:
  pl.a1.unit06.lesson01.teach.chleb:
    title: Хлеб
    gloss: хлеб
    note: 'Базовое слово для еды: встречается постоянно, за любым столом.'
    example_gloss: Это хлеб.
  pl.a1.unit06.lesson01.teach.maslo_ser:
    title: Масло, сыр
    gloss: масло; сыр
    note: Masło — существительное среднего рода, ser — мужского рода (неодушевлённое). Ни одно из них не меняет окончание после proszę o, как объясняется в грамматической заметке этого урока.
    example_gloss:
    - Это масло.
    - Это сыр.
  pl.a1.unit06.lesson01.teach.woda_mleko:
    title: Вода, молоко
    gloss: вода; молоко
    note: Woda — женского рода (её форма винительного падежа wodę есть в грамматической заметке этого урока); mleko — среднего рода и не изменяется.
    example_gloss:
    - Это вода.
    - Это молоко.
  pl.a1.unit06.lesson01.teach.kawa_herbata:
    title: Кофе, чай
    gloss: кофе; чай
    note: 'Оба слова женского рода: при заказе говорят именно формы винительного падежа kawę/herbatę, о них речь в грамматической заметке этого урока.'
    example_gloss:
    - Это кофе.
    - Это чай.
  pl.a1.unit06.lesson01.teach.prosze_o_note:
    title: 'Заказ: proszę o + винительный падеж'
    gloss: 'Дайте, пожалуйста + винительный падеж: кофе -> kawę, чай -> herbatę, вода -> wodę. Хлеб, сыр и молоко не меняются.'
    note: После *Proszę o* («дайте, пожалуйста», буквально «прошу о») существительное стоит в винительном падеже. У существительных женского рода вроде *kawa*, *herbata* и *woda* окончание *-a* заменяется на *-ę*. Неодушевлённые существительные мужского рода (*chleb*, *ser*) и существительные среднего рода (*mleko*) остаются в той же форме, что и в словаре.
  pl.a1.unit06.lesson01.teach.prosze_o_kawe:
    title: Кофе, пожалуйста
    gloss: Кофе, пожалуйста.
    note: 'Обычный вежливый способ заказать одну позицию: здесь схема из грамматической заметки работает в целой фразе.'
  pl.a1.unit06.lesson02.teach.zupa:
    title: Суп
    gloss: суп
    note: Обычное блюдо на обед или ужин, часто блюдо дня, как в сцене в ресторане в этом юните.
    example_gloss: Это суп.
  pl.a1.unit06.lesson02.teach.sok:
    title: Сок
    gloss: сок
    note: 'Мужского рода (неодушевлённое), как chleb и ser: при заказе окончание не меняется.'
    example_gloss: Это сок.
  pl.a1.unit06.lesson02.teach.cukier:
    title: Сахар
    gloss: сахар
    note: Пригодится к кофе или чаю. Тоже мужского рода (неодушевлённое), окончание не меняется.
    example_gloss: Это сахар.
  pl.a1.unit06.lesson02.teach.rachunek:
    title: Счёт
    gloss: счёт
    note: 'Это то, о чём просят в конце трапезы: proszę o rachunek — стандартный вежливый способ попросить счёт.'
    example_gloss: Счёт, пожалуйста.
  pl.a1.unit06.lesson02.teach.lubic_note:
    title: 'Любить, нравиться: lubię, lubi'
    gloss: 'любить, нравиться: я люблю, он/она любит — Я люблю кофе. Он любит суп.'
    note: '*Lubić* — глагол «любить, нравиться». Здесь даются только формы 1-го лица (*lubię*) и 3-го лица (*lubi*). После *lubić* тоже стоит винительный падеж, как и после *proszę o*: *lubię kawę*, а не *lubię kawa*.'
  pl.a1.unit06.lesson02.teach.lubie_zupe:
    title: Я люблю суп
    gloss: Я люблю суп.
    note: Zupa в винительном падеже превращается в zupę — тот же сдвиг женского рода -a -> -ę, что и в грамматической заметке первого урока.
  pl.a1.unit06.lesson03.teach.danie_dnia:
    title: Блюдо дня
    gloss: Блюдо дня — суп.
    note: '*Dnia* — родительный падеж от *dzień* (день): *danie dnia* буквально «блюдо дня», так это устойчиво пишут в меню.'
  pl.a1.unit06.lesson03.teach.polecac_note:
    title: 'Рекомендовать: polecam, poleca'
    gloss: 'рекомендовать, советовать: я рекомендую, он/она рекомендует — Рекомендую кофе. Он рекомендует суп.'
    note: '*Polecać* — глагол «рекомендовать, советовать»: официант с его помощью предлагает блюдо, а посетитель с тем же глаголом просит совета. После него тоже стоит винительный падеж, как после *proszę o* и *lubić*.'
  pl.a1.unit06.lesson03.teach.co_pan_poleca:
    title: Что вы посоветуете?
    gloss: Что вы посоветуете?
    note: '*Co* (что) и вежливое *pan*: естественный вопрос официанту, с тем же вежливым обращением, что в первом юните.'
  pl.a1.unit06.lesson03.teach.prosze_bardzo:
    title: Вот, пожалуйста / Не за что
    gloss: Пожалуйста. (Вот, возьмите.)
    note: 'Гибкая повседневная фраза: её говорят, подавая что-то, а также отвечая на dziękuję (спасибо).'
  pl.a1.unit06.lesson03.teach.juz_podaje:
    title: Сейчас подам
    gloss: Сейчас подам.
    note: 'Буквально «уже подаю»: стандартный ответ официанта, подтверждающий, что заказ принят.'
  pl.a1.unit06.lesson03.teach.dialogue.line01:
    title: Официант объявляет блюдо дня
    gloss: Официант здоровается и сообщает, что блюдо дня сегодня — суп.
    note: Dzień dobry — приветствие из первого юнита.
  pl.a1.unit06.lesson03.teach.dialogue.line02:
    title: Эва просит совета
    gloss: Эва спрашивает официанта, что он посоветует.
    note: 'Вежливый вопрос: pan — уважительное обращение к официанту.'
  pl.a1.unit06.lesson03.teach.dialogue.line03:
    title: Официант советует кофе
    gloss: Официант советует взять кофе.
    note: Polecam — форма 1-го лица из грамматической заметки этого урока.
  pl.a1.unit06.lesson03.teach.dialogue.line04:
    title: Эва делает заказ
    gloss: Эва соглашается и заказывает кофе и суп.
    note: Здесь proszę o сочетается с союзом i (и) из юнита о семье; повторяются схема заказа из первого урока и слово «суп» из второго.
  pl.a1.unit06.lesson03.teach.dialogue.line05:
    title: Официант подтверждает заказ
    gloss: Официант говорит, что сейчас всё подаст.
    note: Короткое естественное подтверждение перед тем, как принесут еду.
  pl.a1.unit06.lesson03.teach.dialogue.line06:
    title: Эва просит счёт
    gloss: Эва благодарит и просит счёт.
    note: Повторяются dziękuję из первого юнита и proszę o + rachunek из второго урока.
  pl.a1.unit06.lesson03.teach.dialogue.line07:
    title: Официант приносит счёт
    gloss: 'Официант говорит: «Вот, пожалуйста».'
    note: Та же фраза proszę bardzo, которую мы разбирали раньше в этом уроке, теперь используется, когда подают счёт.
