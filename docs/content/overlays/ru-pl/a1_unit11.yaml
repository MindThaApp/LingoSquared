teaching:
  pl.a1.unit11.lesson01.teach.chciec_chce:
    title: Хотеть, я хочу
    gloss: хотеть; я хочу
    note: Chcieć — инфинитив; chcę — повседневная форма первого лица, которой ты будешь говорить, чего хочешь.
    example_gloss: Я хочу пойти в кино.
  pl.a1.unit11.lesson01.teach.chcesz:
    title: Ты хочешь
    gloss: ты хочешь
    note: Chcesz — это неформальная форма «ты», она используется так же, как masz и jesteś. Именно так ты спросишь друга, чего он хочет.
    example_gloss: Хочешь кофе?
  pl.a1.unit11.lesson01.teach.chciec_osoba_note:
    title: Я хочу, ты хочешь
    gloss: 'Chcę, chcesz — та же модель, что и masz (mieć) и jesteś (być): chcesz — форма «ты» (второе лицо), её используют, когда спрашивают собеседника, чего он хочет.'
    note: 'В этом уроке понадобится не только «я»: *chcę* (я хочу) и *chcesz* (ты хочешь) образуются по той же модели лица, которую ты уже знаешь по *masz* и *jesteś*, только с новым глаголом.'
  pl.a1.unit11.lesson01.teach.kino:
    title: Кинотеатр
    gloss: кино / кинотеатр
    note: Обычное слово для кинотеатра — оно постоянно встречается, когда люди строят планы.
    example_gloss: Это кинотеатр.
  pl.a1.unit11.lesson01.teach.razem:
    title: Вместе
    gloss: вместе
    note: Razem означает также «итого» в контексте покупок (возможно, ты помнишь это слово из урока о покупках). Здесь оно употребляется в другом повседневном значении — «вместе».
    example_gloss: Хочешь пойти вместе?
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_do_kina:
    title: Хочешь пойти в кино?
    gloss: Хочешь пойти в кино?
    note: Czy начинает вопрос, на который отвечают «да» или «нет»; chcesz iść do kina спрашивает, что хочет сделать собеседник. Это основной способ предложить план.
  pl.a1.unit11.lesson01.teach.czy_chcesz_isc_razem_do_kina_w_piatek:
    title: Хочешь пойти вместе в кино в пятницу?
    gloss: Хочешь пойти вместе в кино в пятницу?
    note: 'Полное предложение: к только что выученному вопросу добавляются razem (вместе) и w piątek (в пятницу).'
  pl.a1.unit11.lesson02.teach.moc_moge:
    title: Мочь, я могу
    gloss: мочь; я могу
    note: 'Móc — инфинитив, mogę — форма первого лица. Возможно, ты помнишь możemy («мы можем») из прежних уроков о датах и времени: это тот же глагол, только в единственном числе.'
    example_gloss: Я могу прийти в пятницу.
  pl.a1.unit11.lesson02.teach.mozesz:
    title: Ты можешь
    gloss: ты можешь
    note: Możesz — неформальная форма «ты», та же форма второго лица, что и chcesz. Ею спрашивают, может ли собеседник что-то сделать.
    example_gloss: Ты можешь в субботу?
  pl.a1.unit11.lesson02.teach.przyjsc:
    title: Прийти
    gloss: прийти
    note: Глагол для прихода на встречу. Естественно сочетается с mogę/możesz, чтобы сказать, кто может или не может прийти.
    example_gloss: Я хочу прийти в пятницу.
  pl.a1.unit11.lesson02.teach.moc_note:
    title: Я могу, ты можешь
    gloss: 'Móc: mogę, możesz — то же второе лицо (ты), что и в chcesz. Mogę и инфинитив говорят, что ты можешь сделать: mogę przyjść (я могу прийти), mogę iść (я могу пойти).'
    note: '*Mogę* и глагол в инфинитиве говорят, что ты можешь сделать: *mogę przyjść* («я могу прийти») и *mogę iść* («я могу пойти») строятся по одной и той же простой модели.'
  pl.a1.unit11.lesson02.teach.chetnie:
    title: С удовольствием
    gloss: охотно
    note: Тёплый, радостный способ принять предложение. Часто сочетается с tak (да) или bardzo (очень) для большей сердечности.
    example_gloss: Да, с большим удовольствием!
  pl.a1.unit11.lesson02.teach.niestety:
    title: К сожалению
    gloss: к сожалению
    note: Естественное слово, смягчающее вежливый отказ. Почти всегда после него идёт nie mogę (я не могу).
    example_gloss: К сожалению, я не могу.
  pl.a1.unit11.lesson02.teach.w_sobote_note:
    title: В субботу
    gloss: 'W и день недели: мужские названия дней (piątek, poniedziałek, czwartek) не меняют окончание — w piątek. Женские названия (sobota, środa, niedziela) получают окончание винительного падежа -ę, как kawa -> kawę — w sobotę.'
    note: 'После *w* не все дни ведут себя одинаково: женские названия дней, например *sobota*, превращаются в *sobotę* — это то же окончание *-a* -> *-ę*, которое ты уже знаешь по *kawa* -> *kawę* и *herbata* -> *herbatę*. Мужские названия, например *piątek*, остаются без изменений.'
  pl.a1.unit11.lesson02.teach.czy_mozesz_przyjsc_w_sobote:
    title: Ты можешь прийти в субботу?
    gloss: Ты можешь прийти в субботу?
    note: Соединяет możesz, przyjść и новую форму w sobotę — готовый способ спросить о другом дне.
  pl.a1.unit11.lesson03.teach.moze:
    title: Может быть, а как насчёт
    gloss: может быть / как насчёт
    note: Слово, чтобы предложить другой вариант. Оно нужно, когда первый план не подошёл и хочется предложить что-то другое.
    example_gloss: Как насчёт субботы?
  pl.a1.unit11.lesson03.teach.moze_vs_moge_note:
    title: Może и mogę
    gloss: 'Może и mogę похожи, но значат разное: może («может быть») предлагает что-то новое; mogę (форма «я» глагола, «я могу») говорит, что ты можешь сделать.'
    note: 'На письме их легко перепутать: *może* («может быть», здесь — чтобы что-то предложить) и *mogę* («я могу», глагол в первом лице) выполняют в предложении разные задачи, хотя происходят от одного корня. Следи за последней буквой.'
  pl.a1.unit11.lesson03.teach.o_ktorej_godzinie:
    title: Во сколько?
    gloss: Во сколько?
    note: Стандартный способ спросить точное время, когда день уже решён. Возможно, ты помнишь o której из прежнего урока о времени.
  pl.a1.unit11.lesson03.teach.dialogue.line01:
    title: Эва предлагает пойти в кино
    gloss: Эва спрашивает Марека, хочет ли он пойти в кино в пятницу.
    note: Снова самый первый вопрос этого урока, теперь уже в настоящем разговоре.
  pl.a1.unit11.lesson03.teach.dialogue.line02:
    title: Марек не может в пятницу
    gloss: Марек говорит, что, к сожалению, не может в пятницу.
    note: Niestety смягчает отказ, после чего nie mogę говорит о нём прямо.
  pl.a1.unit11.lesson03.teach.dialogue.line03:
    title: Марек предлагает субботу
    gloss: 'Марек спрашивает: как насчёт субботы?'
    note: Może предлагает другой вариант, а не просто завершает разговор отказом.
  pl.a1.unit11.lesson03.teach.dialogue.line04:
    title: Эва с радостью соглашается
    gloss: 'Эва говорит: В субботу? С удовольствием!'
    note: Повторяет предложенный день (с формой w sobotę), а затем соглашается словом chętnie.
  pl.a1.unit11.lesson03.teach.dialogue.line05:
    title: Эва спрашивает время
    gloss: 'Эва спрашивает: Во сколько?'
    note: Когда день определён, остаётся договориться о времени.
  pl.a1.unit11.lesson03.teach.dialogue.line06:
    title: Марек подтверждает время
    gloss: 'Марек говорит: В четыре часа дня.'
    note: Завершает договорённость конкретным временем, повторяя модель названия часа из прежних уроков о времени и распорядке дня.
