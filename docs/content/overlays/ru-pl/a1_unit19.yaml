    example_gloss: Я не иду в парк, потому что идёт дождь.
  pl.a1.unit19.lesson03.teach.nie_chce_isc_bo_pada_phrase:
    title: Не хочу идти, потому что идёт дождь
    gloss: Я не хочу идти в парк, потому что идёт дождь.
    note: Описание погоды вместе с реальным планом — именно к этому ведёт весь раздел.
  pl.a1.unit19.lesson03.teach.w_krakowie_recap:
    title: В Кракове — повторение
    gloss: 'W Krakowie — ты уже знаешь это по прошлым урокам, например: «Ona mieszka w Krakowie» (Она живёт в Кракове).'
    note: Короткое напоминание перед диалогом этого урока, где сравнивается погода в двух местах.
  pl.a1.unit19.lesson03.teach.dialogue.line01:
    title: Марек спрашивает о погоде
    gloss: Какая сегодня погода?
    note: Марек начинает разговор с вопроса о сегодняшней погоде.
  pl.a1.unit19.lesson03.teach.dialogue.line02:
    title: Ева отвечает
    gloss: Идёт дождь. Холодно.
    note: Ева описывает сегодняшнюю погоду.
  pl.a1.unit19.lesson03.teach.dialogue.line03:
    title: Марек реагирует и строит планы
    gloss: Какая ужасная погода! Я не хочу идти в парк, потому что идёт дождь.
    note: Марек реагирует на погоду и говорит о своих планах из-за неё.
  pl.a1.unit19.lesson03.teach.dialogue.line04:
    title: Ева соглашается
    gloss: Я тоже не иду в парк.
    note: У Евы тот же план, что и у Марека.
  pl.a1.unit19.lesson03.teach.dialogue.line05:
    title: Марек спрашивает о Кракове
    gloss: А в Кракове? Какая там погода?
    note: Марек переводит разговор на погоду в другом городе.
  pl.a1.unit19.lesson03.teach.dialogue.line06:
    title: Ева отвечает
    gloss: В Кракове идёт снег. Там очень холодно.
    note: Ева описывает другую, более холодную погоду в Кракове.
