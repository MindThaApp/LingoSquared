    title: Хорошая
    gloss: Pogoda jest dobra. — «*dobra*» согласуется с существительными женского рода, например «*pogoda*».
    note: Женская форма от «*dobry*» (как в «*Dzień dobry*») — та же пара -y/-a, что и в *chory/chora*.
  pl.a1.unit19.lesson02.teach.straszna_note:
    title: Ужасная
    gloss: Jaka straszna pogoda! — «*straszna*» тоже согласуется с «*pogoda*», как и «*dobra*».
    note: Сильное слово — используй его для по-настоящему плохой погоды.
