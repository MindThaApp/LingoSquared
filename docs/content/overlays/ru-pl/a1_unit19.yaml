  pl.a1.unit19.lesson03.teach.recap_words:
    title: Да, а, я, тоже — повторение
    gloss: Tak, A, ja, też, chcę, iść, idę, do, parku, tam, bardzo — ты уже знаешь эти слова по прошлым урокам.
