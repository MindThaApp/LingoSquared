    title: Сегодня холодно
    gloss: Сегодня холодно.
    note: Фраза о сегодняшней погоде, на которой строится весь этот раздел.
  pl.a1.unit19.lesson02.teach.pada:
    title: Идёт дождь
    gloss: идёт дождь
    note: Употребляется без подлежащего — так по-польски обычно говорят, что идёт дождь.
    example_gloss: Сегодня идёт дождь.
  pl.a1.unit19.lesson02.teach.snieg:
    title: Снег
    gloss: снег
    note: Слово «снег»; вместе с «*pada*» значит «идёт снег».
