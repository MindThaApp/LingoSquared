    example_gloss: Жарко.
  pl.a1.unit19.lesson01.teach.jest_pogoda_note:
    title: Холодно, жарко
    gloss: 'Jest zimno. Jest gorąco. — так по-польски описывают погоду: «*jest*» плюс слово о погоде, без согласования по роду.'
    note: Эта же простая модель подходит для всех слов о погоде в этом разделе.
  pl.a1.unit19.lesson01.teach.jaka_jest_pogoda_phrase:
    title: Какая погода?
    gloss: Какая погода?
    note: Естественный способ спросить о погоде сейчас.
