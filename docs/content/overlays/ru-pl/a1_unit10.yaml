teaching:
  pl.a1.unit10.lesson01.teach.wstawac_wstaje:
    title: Вставать, я встаю
    gloss: вставать; я встаю
    note: Wstawać — инфинитив; wstaję — повседневная форма «я», которой ты будешь рассказывать о своём распорядке дня.
    example_gloss: Я встаю в семь утра.
  pl.a1.unit10.lesson01.teach.jesc_jem:
    title: Есть, я ем
    gloss: есть; я ем
    note: 'Jeść немного неправильный глагол, но jem («я ем») — самая нужная форма: именно так поляк говорит «я ем» о любом приёме пищи.'
    example_gloss: Утром я ем завтрак.
  pl.a1.unit10.lesson01.teach.sniadanie:
    title: Завтрак
    gloss: завтрак
    note: 'Śniadanie не меняется после jem: «я ем завтрак» — просто jem śniadanie, без дополнительного окончания.'
    example_gloss: Утром я ем завтрак.
  pl.a1.unit10.lesson01.teach.pic_pije:
    title: Пить, я пью
    gloss: пить; я пью
    note: Pić — инфинитив; piję — форма «я», которая употребляется так же, как jem и wstaję.
    example_gloss: Я пью кофе по утрам.
  pl.a1.unit10.lesson01.teach.pierwsza_osoba_note:
    title: Рассказ о себе
    gloss: Wstaję, jem, piję — в этом разделе мы говорим только о себе, от первого лица (я), так же как ты описываешь свой день.
    note: В этом разделе мы намеренно используем только форму «я» каждого глагола — *wstaję* (я встаю), *jem* (я ем), *piję* (я пью), — чтобы ты мог сосредоточиться на рассказе о своём распорядке дня и не учил одновременно, как каждый глагол меняется для «ты», «он» или «она».
  pl.a1.unit10.lesson01.teach.o_siodmej_rano:
    title: Я встаю в семь утра
    gloss: Я встаю в семь утра.
    note: 'Правило из грамматической заметки в действии: o + форма местного падежа числительного (siódmej) значит «в» этот час, как в предыдущем разделе о времени.'
  pl.a1.unit10.lesson01.teach.sniadanie_kawa:
    title: Я ем завтрак и пью кофе
    gloss: Я ем завтрак и пью кофе.
    note: Два глагола в форме «я», соединённые союзом i («и») — естественный способ перечислить свои утренние дела.
  pl.a1.unit10.lesson02.teach.obiad:
    title: Обед
    gloss: обед
    note: 'Как и śniadanie, obiad не меняется после jem: jem obiad просто значит «я ем обед».'
    example_gloss: В полдень я ем обед.
  pl.a1.unit10.lesson02.teach.pracowac_pracuje:
    title: Работать, я работаю
    gloss: работать; я работаю
    note: Pracować спрягается по той же модели -ować → -uję, что и kosztować → kosztuje из раздела о покупках, только теперь в форме «я».
    example_gloss: Я работаю во второй половине дня.
  pl.a1.unit10.lesson02.teach.dom:
    title: Дом
    gloss: дом
    note: Повседневное слово для дома — постоянно встречается в выражениях «идти домой», «приходить домой».
    example_gloss: Дом там.
  pl.a1.unit10.lesson02.teach.do_domu_note:
    title: Домой
    gloss: 'Домой — после do ставится родительный падеж, а у dom он оканчивается на -u: domu, по той же модели, что bank → banku, park → parku, hotel → hotelu.'
    note: '*Do domu* («домой») использует то же окончание родительного падежа *-u*, которое ты уже встречал после *do* в словах bank, hotel и park. Ещё одно существительное по той же модели.'
  pl.a1.unit10.lesson02.teach.wracac_wracam:
    title: Возвращаться, я возвращаюсь
    gloss: возвращаться; я возвращаюсь
    note: Используется с do domu, чтобы сказать «я иду домой» или «я возвращаюсь домой». Это одна из самых частых повседневных фраз в польском.
    example_gloss: Вечером я возвращаюсь домой.
  pl.a1.unit10.lesson02.teach.pory_dnia:
    title: В полдень, после обеда, вечером
    gloss: в полдень; после обеда (во второй половине дня); вечером
    note: 'Повторение из предыдущего урока о времени: вместе с rano и w nocy эти выражения охватывают весь день.'
    example_gloss:
    - В полдень я обедаю.
    - Я работаю во второй половине дня.
    - Вечером я возвращаюсь домой.
  pl.a1.unit10.lesson02.teach.praca_dom_phrase:
    title: Я работаю после обеда, потом возвращаюсь домой
    gloss: Я работаю после обеда, потом возвращаюсь домой.
    note: Та же модель «запятая + potem» из урока о направлениях, теперь она связывает две части распорядка дня.
  pl.a1.unit10.lesson03.teach.spac_spie:
    title: Спать, я сплю
    gloss: спать; я сплю
    note: В форме śpię гласная меняется по сравнению с инфинитивом spać, но это очень частотный глагол, и его стоит просто запомнить.
    example_gloss: Я сплю ночью.
  pl.a1.unit10.lesson03.teach.a_ty_ja_tez:
    title: А ты? Я тоже.
    gloss: А ты? / Я тоже.
    note: A ty? — простой способ передать слово собеседнику; ja też значит «я тоже». Обе фразы постоянно звучат в обычной беседе.
    example_gloss: Я тоже завтракаю утром.
  pl.a1.unit10.lesson03.teach.ale_nie_herbata:
    title: Но, чай, не
    gloss: но; чай (в роли дополнения); не
    note: 'Ale вводит противопоставление; nie перед словом (а не перед глаголом) значит «не это»: piję herbatę, nie kawę — «я пью чай, а не кофе».'
    example_gloss: Я пью чай, но не кофе.
  pl.a1.unit10.lesson03.teach.dziesiatej_wczesnie_note:
    title: Рано, в десять часов
    gloss: рано; в десять часов — то же окончание -ej у часов после «o», что и в czwartej, siódmej из прошлого урока.
    note: '*O dziesiątej* («в десять») использует ту же модель для часов, которую ты уже знаешь: *dziesiąta* после *o* становится *dziesiątej*, как *czwarta* -> *czwartej* и *siódma* -> *siódmej*.'
  pl.a1.unit10.lesson03.teach.dialogue.line01:
    title: Эва рассказывает о своём утре
    gloss: Эва говорит, что встаёт в семь утра и пьёт кофе.
    note: Здесь повторяется самая первая модель предложения из этого раздела, теперь в настоящем диалоге.
  pl.a1.unit10.lesson03.teach.dialogue.line02:
    title: Эва продолжает рассказ о своём дне
    gloss: Эва говорит, что завтракает, а потом работает после обеда.
    note: Две последовательные ситуации от первого лица связаны словом potem, как в уроке 2.
  pl.a1.unit10.lesson03.teach.dialogue.line03:
    title: Эва заканчивает и спрашивает Марека
    gloss: Эва говорит, что вечером возвращается домой. А ты?
    note: A ty? передаёт слово Мареку, и для этого не нужна новая грамматика вопросов.
  pl.a1.unit10.lesson03.teach.dialogue.line04:
    title: Марек рассказывает о своём утре
    gloss: Марек говорит, что тоже встаёт в семь! Но пьёт чай, а не кофе.
    note: Ja też подтверждает общую деталь (время подъёма), а затем ale...nie противопоставляет напитки.
  pl.a1.unit10.lesson03.teach.dialogue.line05:
    title: Марек рассказывает о своём дне
    gloss: Марек говорит, что работает утром, а потом обедает в полдень.
    note: 'Порядок дня другой, чем у Эвы: сначала работа, потом обед в середине дня.'
  pl.a1.unit10.lesson03.teach.dialogue.line06:
    title: Марек рассказывает о сне
    gloss: Марек говорит, что рано ложится спать, в десять вечера.
    note: Разговор завершается новым глаголом spać/śpię и знакомой моделью для часов из этого урока.
