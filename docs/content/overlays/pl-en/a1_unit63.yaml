teaching:
  en.a1.unit63.lesson01.teach.help:
    title: help
    gloss: pomagać / pomoc
    note: '*help* może być czasownikiem „pomagać" albo rzeczownikiem „pomoc". W angielskim po *help* bezpośrednio stoi osoba, bez przyimka: *help me* (pomóż mi), bez *to*.'
    example_gloss: Możesz mi pomóc?
  en.a1.unit63.lesson01.teach.carry:
    title: carry
    gloss: nosić, nieść
    note: '*carry* znaczy trzymać coś i przenosić z miejsca na miejsce.'
    example_gloss: Mogę to nieść.
  en.a1.unit63.lesson01.teach.heavy:
    title: heavy
    gloss: ciężki
    note: '*heavy* znaczy ciężki (o wadze).'
    example_gloss: To jest ciężkie.
  en.a1.unit63.lesson01.teach.bag:
    title: bag
    gloss: torba
    note: '*bag* znaczy torba, także reklamówka lub worek.'
    example_gloss: Ta torba jest ciężka.
  en.a1.unit63.lesson01.teach.door:
    title: door
    gloss: drzwi
    note: '*door* znaczy drzwi. W angielskim to liczba pojedyncza: *the door*.'
    example_gloss: Otwórz drzwi.
  en.a1.unit63.lesson01.teach.shelf:
    title: shelf
    gloss: półka
    note: '*shelf* znaczy półka, na przykład na ścianie lub w szafie. Liczba mnoga to *shelves*.'
    example_gloss: Połóż to na półce.
  en.a1.unit63.lesson02.teach.can_you_help:
    title: Can you help me?
    gloss: Możesz mi pomóc?
    note: '*Can you...?* to bezpośredni, zwykły sposób proszenia o pomoc.'
  en.a1.unit63.lesson02.teach.bag_heavy:
    title: This bag is heavy.
    gloss: Ta torba jest ciężka.
    note: Używaj *this bag* o torbie, która jest blisko ciebie.
  en.a1.unit63.lesson02.teach.open_door:
    title: Could you open the door?
    gloss: Mógłbyś otworzyć drzwi?
    note: '*Could you...?* brzmi grzeczniej niż *Can you...?*. Odpowiada polskiemu trybowi warunkowemu „Mógłbyś ...?".'
  en.a1.unit63.lesson02.teach.i_can_help:
    title: I can help.
    gloss: Mogę pomóc.
    note: To zdanie oferuje pomoc.
  en.a1.unit63.lesson02.teach.thank_you_help:
    title: Thank you for your help.
    gloss: Dziękuję za pomoc.
    note: W *Thank you for...* używa się *for* na powód podziękowania, jak „dziękuję za".
  en.a1.unit63.lesson02.teach.put_on_shelf:
    title: Put it on the shelf.
    gloss: Połóż to na półce.
    note: '*put it on...* znaczy położyć lub postawić coś na czymś. Po angielsku nie rozróżnia się „położyć" i „postawić": w obu przypadkach jest *put*.'
  en.a1.unit63.lesson03.teach.dialogue_line1:
    title: "Leila prosi o pomoc"
    gloss: 'Leila mówi: Cześć, Daniel. Możesz mi pomóc?'
    note: '*Can you help me?* to podstawowe zdanie do proszenia o pomoc.'
  en.a1.unit63.lesson03.teach.dialogue_line2:
    title: "Daniel pyta, czego trzeba"
    gloss: 'Daniel mówi: Jasne. Czego potrzebujesz?'
    note: '*Of course* znaczy „oczywiście".'
  en.a1.unit63.lesson03.teach.dialogue_line3:
    title: "Torba jest ciężka"
    gloss: 'Leila mówi: Ta torba jest ciężka.'
    note: '*heavy* wyjaśnia, dlaczego potrzebna jest pomoc.'
  en.a1.unit63.lesson03.teach.dialogue_line4:
    title: "Daniel może nieść torbę"
    gloss: 'Daniel mówi: Mogę ją nieść.'
    note: '*carry it* odnosi się do torby. Po angielsku mówi się *it* o rzeczach; torba nie jest tu „ona" jak po polsku.'
  en.a1.unit63.lesson03.teach.dialogue_line5:
    title: "Leila prosi o otwarcie drzwi"
    gloss: 'Leila mówi: Mógłbyś też otworzyć drzwi?'
    note: '*Could you...?* sprawia, że prośba jest grzeczna.'
  en.a1.unit63.lesson03.teach.dialogue_line6:
    title: "Daniel pyta o półkę"
    gloss: 'Daniel mówi: Tak. Mogę położyć torbę na półce?'
    note: Zwrotem *Can I ...?* Daniel proponuje, że postawi torbę na półce.
  en.a1.unit63.lesson03.teach.dialogue_line7:
    title: "Leila dziękuje Danielowi"
    gloss: 'Leila mówi: Tak, proszę. Dziękuję za pomoc.'
    note: '*Thank you for your help* to stała formuła podziękowania.'
  en.a1.unit63.lesson03.teach.dialogue_line8:
    title: "Daniel odpowiada"
    gloss: 'Daniel mówi: Nie ma sprawy.'
    note: '*No problem* to krótka, przyjazna odpowiedź.'
  en.a1.unit63.lesson04.teach.help_note:
    title: "Kartka z prośbą o pomoc"
    gloss: 'Kartka z prośbą: Niebieska torba jest ciężka. Połóż ją, proszę, na półce przy drzwiach.'
    note: Kartka mówi, o którą torbę chodzi i gdzie ją położyć.
  en.a1.unit63.lesson04.teach.reading_passage:
    title: "Tekst: Pomocny sąsiad"
    gloss: 'Pomocny sąsiad: Leila miała ciężką niebieską torbę. Zobaczyła Daniela przy drzwiach i poprosiła o pomoc. Daniel zaniósł torbę do środka. Leila poprosiła go też, żeby otworzył drzwi. Potem Daniel położył torbę na półce przy drzwiach. Leila podziękowała Danielowi za pomoc. Daniel powiedział: Nie ma sprawy. Później Leila napisała krótką kartkę: Niebieska torba leży na półce.'
    note: '*carried* to czas przeszły od *carry*.'
