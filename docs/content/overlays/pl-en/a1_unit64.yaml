    title: You look great.
    gloss: Świetnie wyglądasz.
    note: '*look* oznacza tutaj wyglądać, a nie patrzeć.'
  en.a1.unit64.lesson02.teach.like_your_jacket:
    title: I like your jacket.
    gloss: Podoba mi się twoja kurtka.
    note: '*I like your...* to zwykły sposób, by pochwalić coś, co należy do kogoś.'
  en.a1.unit64.lesson02.teach.lovely_smile:
    title: What a lovely smile.
    gloss: Cóż za uroczy uśmiech.
    note: '*What a...* służy do wypowiedzenia komplementu w formie okrzyku.'
  en.a1.unit64.lesson02.teach.very_kind:
    title: That is very kind.
    gloss: To bardzo życzliwe z twojej strony.
    note: '*very* wzmacnia *kind*.'
  en.a1.unit64.lesson02.teach.thank_you_much:
    title: Thank you very much.
    gloss: Bardzo dziękuję.
    note: '*Thank you very much* to grzeczne, serdeczne podziękowanie.'
  en.a1.unit64.lesson03.teach.dialogue_line1:
    title: "Mia mówi komplement"
    gloss: 'Mia mówi: Cześć, Leila. Dziś świetnie wyglądasz.'
    note: '*You look great* to bezpośredni komplement.'
  en.a1.unit64.lesson03.teach.dialogue_line2:
    title: Leila dziękuje Mii
    gloss: 'Leila mówi: Dziękuję, Mia.'
    note: '*Thank you* oznacza: dziękuję.'
  en.a1.unit64.lesson03.teach.dialogue_line3:
    title: Mia zauważa zieloną kurtkę
    gloss: 'Mia mówi: Podoba mi się twoja zielona kurtka.'
    note: '*I like your green jacket* to komplement dotyczący ubrania.'
  en.a1.unit64.lesson03.teach.dialogue_line4:
    title: Leila odpowiada serdecznie
    gloss: 'Leila mówi: To bardzo miłe z twojej strony.'
    note: '*That is very kind* to odpowiedź na coś miłego, co ktoś powiedział.'
  en.a1.unit64.lesson03.teach.dialogue_line5:
    title: Mia chwali uśmiech
    gloss: 'Mia mówi: Masz też uroczy uśmiech! Zobacz, to moje zdjęcie.'
    note: '*too* oznacza tutaj też.'
  en.a1.unit64.lesson03.teach.dialogue_line6:
    title: Leila chwali zdjęcie
    gloss: 'Leila mówi: Bardzo dziękuję. Twoje zdjęcie jest ładne.'
    note: '*Your photo is nice* oddaje komplement.'
  en.a1.unit64.lesson03.teach.dialogue_line7:
    title: Mia wyjaśnia, czyje to zdjęcie
    gloss: 'Mia mówi: Dzięki. To dla Daniela.'
    note: '*Thanks* jest krótsze niż *thank you*.'
  en.a1.unit64.lesson04.teach.message:
    title: Miła wiadomość
    gloss: 'Miła wiadomość: Twoja zielona kurtka jest śliczna. Twoje zdjęcie jest ładne. Dziękuję, że jesteś taka miła.'
    note: Wiadomość zawiera dwa komplementy i podziękowanie.
  en.a1.unit64.lesson04.teach.reading_passage:
    title: 'Tekst: Komplement dla przyjaciółki'
    gloss: 'Komplement dla przyjaciółki: Mia zobaczyła Leilę w zielonej kurtce. Mia powiedziała, że Leila świetnie wygląda. Powiedziała też, że ma uroczy uśmiech. Leila podziękowała Mii. Potem Leila spojrzała na zdjęcie Mii i powiedziała, że jest ładne. Mia się ucieszyła, bo zdjęcie było dla Daniela. Później Leila napisała krótką wiadomość: Twoja zielona kurtka jest śliczna.'
    note: '*looked great* to czas przeszły od *look great*.'
