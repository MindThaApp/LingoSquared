teaching:
  en.a1.unit24.lesson01.teach.bedroom:
    title: bedroom
    gloss: sypialnia
    note: '*bedroom* znaczy sypialnia. Składa się z *bed* (łóżko) i *room* (pokój), ale po angielsku wymawia się i akcentuje je osobno.'
    example_gloss: Moja sypialnia jest obok łazienki.
  en.a1.unit24.lesson01.teach.kitchen:
    title: kitchen
    gloss: kuchnia
    note: '*kitchen* znaczy kuchnia. Wymowa to *KITCH-en*; *t* nie jest wymawiane osobno.'
    example_gloss: Kuchnia jest obok salonu.
  en.a1.unit24.lesson01.teach.bathroom:
    title: bathroom
    gloss: łazienka
    note: '*bathroom* znaczy łazienka. W USA to często także słowo na toaletę.'
    example_gloss: W łazience jest prysznic.
  en.a1.unit24.lesson01.teach.living_room:
    title: living room
    gloss: salon
    note: '*living room* znaczy salon, pokój dzienny. To dwa osobne słowa.'
    example_gloss: Oglądamy telewizję w salonie.
  en.a1.unit24.lesson01.teach.garden:
    title: garden
    gloss: ogród
    note: '*garden* znaczy ogród. W USA na ogródek za domem często mówi się też *yard*.'
    example_gloss: Nie ma ogrodu, ale jest balkon.
  en.a1.unit24.lesson01.teach.the_kitchen_is_a_room:
    title: This is the kitchen.
    gloss: To jest kuchnia.
    note: 'Zwrotem *This is ...* wskazujesz coś. *the* oznacza coś konkretnego: kuchnię tego mieszkania.'
  en.a1.unit24.lesson02.teach.how_many_rooms:
    title: How many rooms are there?
    gloss: Ile jest pokoi?
    note: Pytaniem *How many...are there?* pytasz o liczbę. *many* stoi przy rzeczach policzalnych w liczbie mnogiej; *are*, bo *rooms* jest w liczbie mnogiej.
  en.a1.unit24.lesson02.teach.there_is_a_kitchen:
    title: There's a small kitchen.
    gloss: Jest mała kuchnia.
    note: Zwrotem *There's...* (*there is*) mówisz, że gdzieś coś jest. Odpowiada polskiemu „jest/znajduje się"; przy kilku rzeczach mówi się *there are*.
  en.a1.unit24.lesson02.teach.next_to:
    title: next to
    gloss: obok
    note: '*next to* znaczy obok. To dwa słowa, które zawsze stoją razem.'
    example_gloss: Krzesło stoi obok stołu.
  en.a1.unit24.lesson03.teach.apartment:
    title: apartment
    gloss: mieszkanie
    note: '*apartment* znaczy mieszkanie (amerykańskie; w brytyjskim angielskim *flat*).'
    example_gloss: Mieszkanie Daniela ma dwie sypialnie.
  en.a1.unit24.lesson03.teach.home_text:
    title: "Tekst o mieszkaniu"
    gloss: Moje mieszkanie ma dwie sypialnie i jedną łazienkę. Obok salonu jest mała kuchnia.
    note: W tym krótkim tekście ktoś opisuje swoje mieszkanie i podaje liczbę pokoi.
  en.a1.unit24.lesson04.teach.favorite_room:
