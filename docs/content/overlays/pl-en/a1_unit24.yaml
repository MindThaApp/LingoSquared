    title: "Odpowiedź Daniela"
    gloss: 'Daniel mówi: Ma dwie sypialnie i jedną łazienkę. Obok salonu jest mała kuchnia.'
    note: Daniel podaje liczbę pokoi i mówi, gdzie jest kuchnia.
  en.a1.unit24.lesson04.teach.q_is_there_garden:
    title: "Pytanie o ogród"
    gloss: 'Leila pyta: Jest ogród?'
    note: Pytaniem *Is there...?* pytasz, czy coś jest.
  en.a1.unit24.lesson04.teach.a_no_but_balcony:
    title: "Odpowiedź Daniela"
    gloss: 'Daniel mówi: Nie ma, ale jest mały balkon.'
    note: Daniel najpierw mówi „nie", a potem podaje coś w zamian.
  en.a1.unit24.lesson04.teach.a_living_room_near_kitchen:
    title: "Ostatnia odpowiedź Daniela"
    gloss: 'Daniel mówi: Moim ulubionym pokojem jest salon. Jest blisko kuchni, więc łatwo tam zjeść kolację.'
    note: Daniel podaje swój ulubiony pokój i powód.
