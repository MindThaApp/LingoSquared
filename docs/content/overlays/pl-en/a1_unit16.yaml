teaching:
  en.a1.unit16.lesson01.teach.wake_up:
    title: Wake up
    gloss: budzić się
    note: '*wake up* znaczy budzić się. To czasownik z partykułą, pisany w dwóch słowach.'
  en.a1.unit16.lesson01.teach.get_dressed:
    title: Get dressed
    gloss: ubierać się
    note: '*get dressed* znaczy ubierać się. Po angielsku nie ma zaimka „się": nie mówi się *get yourself dressed*.'
  en.a1.unit16.lesson01.teach.go_to_work:
    title: Go to work
    gloss: iść do pracy
    note: '*go to work* znaczy iść do pracy. W tym stałym wyrażeniu przed *work* nie ma przedimka.'
  en.a1.unit16.lesson01.teach.have_dinner:
    title: Have dinner
    gloss: jeść kolację
    note: '*have dinner* znaczy jeść kolację. Posiłki występują bez przedimka: *have breakfast*, *have lunch*, *have dinner*.'
  en.a1.unit16.lesson01.teach.go_to_bed:
    title: Go to bed
    gloss: iść spać
    note: '*go to bed* znaczy iść do łóżka, żeby spać. Tu też przed *bed* nie ma przedimka.'
  en.a1.unit16.lesson02.teach.what_time_wake_up:
    title: What time do you wake up?
    gloss: O której się budzisz?
    note: 'Pytaniem *What time do you wake up?* pytasz o godzinę wstawania. Pytanie z *do* wymaga czasownika pomocniczego: nie mówi się *What time wake you up*.'
  en.a1.unit16.lesson02.teach.i_wake_up_at:
    title: I wake up at seven every day.
    gloss: Budzę się o siódmej każdego dnia.
    note: '*every day* używa się przy codziennym nawyku. Stoi na końcu albo na początku zdania.'
  en.a1.unit16.lesson02.teach.in_the_morning:
    title: I get dressed in the morning.
    gloss: Rano się ubieram.
    note: '*in the morning* podaje porę dnia, a nie dokładną godzinę. Polskie „rano" wyraża się przez *in the morning*.'
  en.a1.unit16.lesson02.teach.usually_at_night:
    title: I usually go to bed at eleven.
    gloss: Zwykle idę spać o jedenastej.
    note: '*usually* znaczy zwykle; opisuje nawyk, który nie zawsze jest dokładnie taki sam. Uwaga na szyk: po angielsku *usually* stoi przed czasownikiem głównym (*I usually go*). W polskim „zwykle" można przestawiać dość swobodnie, ale po angielsku nie; *I go usually to bed* jest błędne.'
  en.a1.unit16.lesson03.teach.then:
    title: Then
    gloss: potem / następnie
    note: '*then* znaczy potem lub następnie; pokazuje kolejność wydarzeń.'
    example_gloss: Jem śniadanie, a potem idę do pracy.
  en.a1.unit16.lesson03.teach.routine_text:
    title: "Tekst o planie dnia"
    gloss: Codziennie budzę się o siódmej. Potem się ubieram i jem śniadanie.
    note: To krótki opis porannego rytuału.
  en.a1.unit16.lesson04.teach.after_that:
    title: What do you do after that?
    gloss: Co robisz potem?
    note: Pytaniem *What do you do after that?* pytasz, co dzieje się dalej w planie dnia.
  en.a1.unit16.lesson04.teach.q_wake_time:
    title: "Pytanie o godzinę budzenia się"
    gloss: 'Leila pyta: O której się budzisz?'
    note: To samo pytanie co wcześniej.
  en.a1.unit16.lesson04.teach.a_wake_seven:
    title: "Odpowiedź o budzeniu się"
    gloss: 'Daniel mówi: Budzę się o siódmej każdego dnia.'
    note: Pełna odpowiedź podaje zarówno godzinę, jak i codzienne powtarzanie.
  en.a1.unit16.lesson04.teach.q_after_that:
    title: "Pytanie, co dzieje się dalej"
    gloss: 'Leila pyta: Co robisz potem?'
    note: To pytanie jest naturalną kontynuacją rozmowy o planie dnia.
  en.a1.unit16.lesson04.teach.a_full_routine:
    title: "Opis całego dnia"
    gloss: 'Daniel mówi: Ubieram się, jem śniadanie i idę do pracy. Zwykle idę spać o jedenastej.'
    note: Daniel wymienia kilka czynności po kolei, we właściwej kolejności.
