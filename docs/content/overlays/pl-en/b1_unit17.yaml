teaching:
  en.b1.unit17.lesson01.teach.regret:
    title: regret
    gloss: żal, skrucha
    note: '*regret* oznacza uczucie smutku z powodu czegoś, co się zrobiło lub czego się nie zrobiło.'
    example_gloss: Daniel żałował, że nie dotrzymał terminu.
  en.b1.unit17.lesson01.teach.wish:
    title: wish
    gloss: życzenie
    note: '*wish* oznacza pragnienie, by coś potoczyło się inaczej, niż się faktycznie potoczyło.'
    example_gloss: Daniel miał jedno życzenie dotyczące minionego tygodnia.
  en.b1.unit17.lesson01.teach.mistake:
    title: mistake
    gloss: błąd
    note: '*mistake* oznacza coś, co zrobiło się źle z powodu błędnej oceny sytuacji.'
    example_gloss: Tak długie zwlekanie z prośbą o pomoc było błędem.
  en.b1.unit17.lesson01.teach.hindsight:
    title: hindsight
    gloss: z perspektywy czasu
    note: '*hindsight* oznacza zrozumienie wydarzenia, które przychodzi dopiero po fakcie.'
    example_gloss: Z perspektywy czasu Daniel powinien był odezwać się wcześniej.
  en.b1.unit17.lesson01.teach.procrastinate:
    title: procrastinate
    gloss: odkładać na później
    note: '*procrastinate* oznacza odkładanie na później czegoś, co należy zrobić.'
    example_gloss: Daniel często odkłada zadania na później, gdy wydają mu się trudne.
  en.b1.unit17.lesson01.teach.delay:
    title: delay
    gloss: opóźnienie
    note: '*delay* oznacza okres, o który coś następuje później, niż zaplanowano.'
    example_gloss: Przez opóźnienie Daniel nie dotrzymał pierwszego terminu.
  en.b1.unit17.lesson02.teach.wish_had_asked:
    title: I wish I had + Partizip
    gloss: Gdybym tylko wcześniej poprosił o pomoc.
    note: '*I wish I had asked* wyraża życzenie dotyczące czegoś, co w przeszłości się nie wydarzyło.'
  en.b1.unit17.lesson02.teach.should_have_talked:
    title: I should have + Partizip
    gloss: Powinienem był wcześniej porozmawiać z przełożonym.
    note: '*I should have talked* mówi, jakie działanie byłoby z perspektywy czasu właściwe.'
  en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished:
    title: if I had + Partizip, I would have + Partizip
    gloss: Gdybym poprosił Mię o pomoc w pierwszym tygodniu, skończyłbym na czas.
    note: '*if I had asked..., I would have finished...* opisuje nierzeczywisty skutek w przeszłości.'
  en.b1.unit17.lesson02.teach.grammar_past_hypothetical:
    title: Formen, um Bedauern über die Vergangenheit auszudrücken
    gloss: Aby wyrazić żal z powodu przeszłości, używa się wish + past perfect (I wish I had asked...), should have + imiesłów (past participle) (I should have talked...) albo if + past perfect z would have + imiesłów (If I had asked..., I would have finished...). Wszystkie trzy opisują to, co w rzeczywistości się nie wydarzyło.
    note: 'Forma: wybierz między wish + had, should have albo if + had ... would have.'
  en.b1.unit17.lesson03.teach.looking_back:
    title: looking back
    gloss: z perspektywy czasu
    note: '*looking back* wprowadza refleksję nad przeszłością.'
    example_gloss: Z perspektywy czasu Daniel żałuje, że nie poprosił wcześniej o pomoc.
  en.b1.unit17.lesson03.teach.missed_deadline:
    title: missed deadline
    gloss: niedotrzymany termin
    note: '*missed deadline* oznacza termin, którego nie dotrzymano.'
    example_gloss: Daniel nie dotrzymał jednego terminu, zanim poprosił o pomoc.
  en.b1.unit17.lesson03.teach.reading_passage:
    title: 'Lesetext: Rückblick auf einen anstrengenden Monat'
    gloss: Cześć, Leila, z perspektywy czasu żałuję, że nie poprosiłem wcześniej o pomoc. Powinienem był wcześniej porozmawiać z przełożonym o nadmiarze obowiązków. Zanim to zrobiłem, nie dotrzymałem już jednego terminu. Gdybym poprosił Mię o pomoc w pierwszym tygodniu, skończyłbym oba projekty na czas. Błędem było czekać tak długo. Daniel
    note: Krótka, refleksyjna wiadomość.
  en.b1.unit17.lesson04.teach.q_wish_asked_sooner:
    title: Daniel beginnt mit einer Reflexion
    gloss: 'Daniel: Z perspektywy czasu żałuję, że nie poprosiłem wcześniej o pomoc.'
    note: '*looking back* rozpoczyna refleksyjną rozmowę.'
  en.b1.unit17.lesson04.teach.a_what_happened:
    title: Leila fragt nach
    gloss: 'Leila: Co się stało?'
    note: Krótkie, otwarte pytanie, żeby dowiedzieć się więcej.
  en.b1.unit17.lesson04.teach.q_should_have_talked_missed:
    title: Daniel erklärt, was er hätte tun sollen
    gloss: 'Daniel: Powinienem był wcześniej porozmawiać z przełożonym o nadmiarze obowiązków. Zanim to zrobiłem, nie dotrzymałem już jednego terminu.'
    note: '*should have talked* i *had already missed* łączą żal z konkretnym skutkiem.'
  en.b1.unit17.lesson04.teach.a_fair_regret_fixed:
    title: Leila beruhigt Daniel
    gloss: 'Leila: Nie martw się, w końcu sobie z tym poradziłeś.'
    note: '*Don''t worry* uspokaja kogoś, kto czuje się winny.'
  en.b1.unit17.lesson04.teach.q_true_if_had_asked:
    title: Daniel beschreibt, was anders hätte sein können
    gloss: 'Daniel: Prawda. Gdybym poprosił Mię o pomoc w pierwszym tygodniu, skończyłbym oba projekty na czas.'
    note: '*if I had asked..., I would have finished...* opisuje nierzeczywisty skutek w przeszłości.'
  en.b1.unit17.lesson04.teach.a_now_you_know:
    title: Leila schließt aufmunternd ab
    gloss: 'Leila: No cóż, teraz już wiesz na następny raz.'
    note: Krótkie, pozytywne zakończenie rozmowy.
