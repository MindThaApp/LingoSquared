teaching:
  en.a1.unit05.lesson01.teach.what_time:
    title: What time is it?
    gloss: Która jest godzina?
    note: '*What time is it?* to ogólne pytanie o godzinę.'
  en.a1.unit05.lesson01.teach.three_oclock:
    title: It's three o'clock.
    gloss: Jest trzecia.
    note: '*It''s three o''clock.* podaje pełną godzinę.'
  en.a1.unit05.lesson01.teach.half_past:
    title: It's half past three.
    gloss: Jest wpół do czwartej.
    note: 'Uwaga, prawdziwa pułapka: po angielsku *half past three* liczy pół godziny PO trzeciej, czyli 3:30, a po polsku mówi się „wpół do czwartej” (liczymy w stronę godziny, która nadchodzi). Dosłownie *half past three* brzmi jak „pół po trzeciej”, ale oznacza dokładnie 3:30, czyli to samo co „wpół do czwartej”.'
  en.a1.unit05.lesson01.teach.five_oclock:
    title: It's five o'clock.
    gloss: Jest piąta.
    note: '*It''s five o''clock.* podaje pełną godzinę 5:00.'
  en.a1.unit05.lesson02.teach.quarter_past:
    title: It's a quarter past three.
    gloss: Jest kwadrans po trzeciej.
    note: '*It''s a quarter past three.* oznacza 3:15.'
  en.a1.unit05.lesson02.teach.quarter_to:
    title: It's a quarter to four.
    gloss: Jest za kwadrans czwarta.
    note: '*It''s a quarter to four.* oznacza 3:45.'
  en.a1.unit05.lesson02.teach.ten_past:
    title: It's ten past four.
    gloss: Jest dziesięć po czwartej.
    note: '*It''s ten past four.* oznacza 4:10.'
  en.a1.unit05.lesson02.teach.ten_to:
    title: It's ten to five.
    gloss: Jest za dziesięć piąta.
    note: '*It''s ten to five.* oznacza 4:50.'
  en.a1.unit05.lesson03.teach.morning:
    title: morning
    gloss: ranek
    note: '*morning* oznacza ranek lub przedpołudnie, mniej więcej od 6 do 12.'
    example_gloss: Dzień dobry, Daniel!
  en.a1.unit05.lesson03.teach.afternoon:
    title: afternoon
    gloss: popołudnie
    note: '*afternoon* oznacza popołudnie, mniej więcej od 12 do 17.'
    example_gloss: Pracuję po południu.
  en.a1.unit05.lesson03.teach.evening:
    title: evening
    gloss: wieczór
    note: '*evening* oznacza wieczór, mniej więcej od 17 do 21; granice są płynne.'
    example_gloss: Dobry wieczór, Leila!
  en.a1.unit05.lesson03.teach.night:
    title: night
    gloss: noc
    note: '*night* oznacza noc, mniej więcej od 21 do 6.'
    example_gloss: Dobranoc, Daniel!
  en.a1.unit05.lesson03.teach.at_nine_am:
    title: The store opens at nine in the morning.
    gloss: Sklep otwiera się o dziewiątej rano.
    note: 'Przed godziną po angielsku stoi *at*, tak jak „o” po polsku: *at nine* (o dziewiątej).'
  en.a1.unit05.lesson03.teach.at_six_pm:
    title: The store closes at six in the evening.
    gloss: Sklep zamyka się o osiemnastej (szósta wieczorem).
    note: Po angielsku w codziennej mowie godzinę podaje się zwykle w systemie 12-godzinnym wraz z porą dnia (*six in the evening*), a po polsku w oficjalnych godzinach otwarcia często używa się systemu 24-godzinnego (osiemnasta).
  en.a1.unit05.lesson04.teach.opens_at:
    title: opens at
    gloss: otwiera o
    note: '*opens at* + godzina oznacza „otwiera o” + godzina.'
    example_gloss: Biblioteka otwiera się o dziewiątej.
  en.a1.unit05.lesson04.teach.closes_at:
    title: closes at
    gloss: zamyka o
    note: '*closes at* + godzina oznacza „zamyka o” + godzina.'
    example_gloss: Biblioteka zamyka się o szóstej.
  en.a1.unit05.lesson04.teach.q_open:
    title: Daniel fragt nach der Öffnungszeit
    gloss: 'Daniel: O której otwiera się biblioteka?'
    note: '*What time does ...?* pyta o dokładną godzinę. W pytaniu stoi *does*, dlatego jest *open* bez -s.'
  en.a1.unit05.lesson04.teach.a_open:
    title: Antwort zur Öffnungszeit
    gloss: 'Leila: Otwiera się o dziewiątej rano.'
    note: Pełna odpowiedź podaje dokładną godzinę i porę dnia.
  en.a1.unit05.lesson04.teach.q_close:
    title: Nach der Schließzeit fragen
    gloss: 'Daniel: A o której się zamyka?'
    note: '*And* wprowadza drugie pytanie w tej samej rozmowie.'
  en.a1.unit05.lesson04.teach.a_close:
    title: Antwort zur Schließzeit
    gloss: 'Leila: Zamyka się o osiemnastej (szósta wieczorem).'
    note: Pełna odpowiedź podaje także tutaj dokładną godzinę.
  en.a1.unit05.lesson04.teach.closing:
    title: Das Gespräch beenden
    gloss: 'Daniel: Świetnie, do zobaczenia o dziewiątej!'
    note: '*See you at nine!* oznacza, że zobaczycie się znowu o dziewiątej.'
