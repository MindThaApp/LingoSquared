teaching:
  en.b1.unit07.lesson01.teach.if:
    title: if
    gloss: jeśli, jeżeli
    note: '*if* wprowadza możliwy warunek.'
    example_gloss: Jeśli autobus się spóźni, zadzwonię do ciebie.
  en.b1.unit07.lesson01.teach.unless:
    title: unless
    gloss: chyba że, jeśli nie
    note: '*unless* znaczy mniej więcej tyle co *if not*: coś się stanie, chyba że warunek jednak się spełni.'
    example_gloss: Chyba że plan się zmieni, spotkamy się o dziesiątej.
  en.b1.unit07.lesson01.teach.condition:
    title: condition
    gloss: warunek
    note: '*condition* to sytuacja, która musi zaistnieć jako pierwsza.'
    example_gloss: 'Warunek jest jasny: zaczynamy, jeśli wszyscy dotrą.'
  en.b1.unit07.lesson01.teach.result:
    title: result
    gloss: wynik, skutek
    note: '*result* to to, co dzieje się na skutek warunku.'
    example_gloss: Skutek jest taki, że spotykamy się online.
  en.b1.unit07.lesson01.teach.delay:
    title: delay
    gloss: opóźnienie
    note: '*delay* oznacza, że coś dzieje się później, niż zaplanowano.'
    example_gloss: Opóźnienie może sprawić, że wszyscy się spóźnią.
  en.b1.unit07.lesson01.teach.reschedule:
    title: reschedule
    gloss: przełożyć na inny termin
    note: '*reschedule* znaczy wybrać nowy czas na wizytę lub spotkanie.'
    example_gloss: Jeśli lekarka ma dużo pracy, przełożymy wizytę.
  en.b1.unit07.lesson02.teach.if_meeting_late:
    title: Realny warunek ze skutkiem
    gloss: Jeśli spotkanie zacznie się późno, wyślę wszystkim wiadomość.
    note: 'Przy realnym warunku odnoszącym się do przyszłości po *if* stoi czas teraźniejszy: *If the meeting starts late*, a nie *will start*. Po polsku w takim zdaniu użyłbyś czasu przyszłego, więc łatwo o pomyłkę.'
  en.b1.unit07.lesson02.teach.if_not_ready:
    title: Warunek przeczący
    gloss: Jeśli raport nie będzie gotowy, przełożymy omówienie.
    note: '*if ... not* sprawia, że warunek jest przeczący.'
  en.b1.unit07.lesson02.teach.grammar_real_condition:
    title: Realne warunki dotyczące przyszłości
    gloss: Jeśli zacznie się późno, wyślę wiadomość. Jeśli raport nie będzie gotowy, przełożymy omówienie.
    note: Po *if* stoi czas teraźniejszy, a w skutku często pojawia się *will*.
  en.b1.unit07.lesson03.teach.backup_plan:
    title: backup plan
    gloss: plan zapasowy, plan B
    note: '*backup plan* to dodatkowy plan na wypadek, gdyby pierwszy się nie powiódł.'
    example_gloss: Potrzebujemy planu zapasowego na wypadek, gdyby sala była zajęta.
  en.b1.unit07.lesson03.teach.move_update:
    title: move the update
    gloss: przesunąć aktualizację
    note: '*move the update* znaczy omówić aktualizację w innym terminie.'
    example_gloss: Jeśli Leila się spóźni, przesuniemy jej aktualizację na jutro.
  en.b1.unit07.lesson03.teach.reading_passage:
    title: 'Tekst: plan zastępczy'
    gloss: Daniel pisze plan zapasowy na spotkanie zespołu. Jeśli sala konferencyjna jest wolna, zespół spotka się tam o dziesiątej. Jeśli sala jest zajęta, spotkają się online. Jeśli Leila nie dołączy do dziesiątej, Daniel przesunie jej aktualizację na jutro. Jeśli raport nie będzie gotowy, Mia wyśle zamiast tego krótszą aktualizację.
    note: Krótki tekst do czytania z realnymi warunkami, skutkami i słowem *unless*.
  en.b1.unit07.lesson04.teach.q_if_meeting_late:
    title: Mia pyta o plan
    gloss: 'Mia mówi: Daniel, co zrobimy, jeśli spotkanie zacznie się późno?'
    note: Pytanie o skutek możliwego warunku.
  en.b1.unit07.lesson04.teach.a_send_message:
    title: Daniel podaje wynik
    gloss: 'Daniel mówi: Jeśli zacznie się późno, wyślę wszystkim wiadomość.'
    note: '*If it starts late, I will...* łączy realną możliwość z konkretnym działaniem.'
  en.b1.unit07.lesson04.teach.q_if_leila_cannot_join:
    title: Mia pyta o Leilę
    gloss: 'Mia mówi: A jeśli Leila nie będzie mogła dołączyć?'
    note: Krótkie pytanie dopytujące z tą samą konstrukcją warunkową.
  en.b1.unit07.lesson04.teach.a_unless_she_joins:
    title: Daniel używa 'unless'
    gloss: 'Daniel mówi: Jeśli nie dołączy do dziesiątej, przesuniemy jej aktualizację na jutro.'
    note: '*unless she joins by ten* znaczy: jeśli nie dołączy najpóźniej o dziesiątej.'
  en.b1.unit07.lesson04.teach.q_room_busy:
    title: Mia pyta o pokój
    gloss: 'Mia mówi: Brzmi rozsądnie. A jeśli sala nadal będzie zajęta, spotkamy się wtedy online?'
    note: Mia sprawdza plan zapasowy na wypadek zajętej sali.
  en.b1.unit07.lesson04.teach.a_meet_online:
    title: Daniel potwierdza plan online
    gloss: 'Daniel mówi: Tak, jeśli sala jest zajęta, spotkamy się zamiast tego online.'
    note: '*instead* znaczy, że ten plan zastępuje poprzedni.'
