course:
  title: Angielski B1
  description: 'Nauka angielskiego na poziomie B1: obowiązki, możliwości, sytuacje hipotetyczne i opowiadanie o codziennych zdarzeniach, z obszernymi wyjaśnieniami po polsku.'
