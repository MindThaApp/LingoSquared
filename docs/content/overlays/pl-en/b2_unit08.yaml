course:
  title: Angielski B2
  description: 'Nauka angielskiego na poziomie B2: niuansowane rozmowy, argumenty, przypuszczenia i profesjonalna dyskusja, z wyjaśnieniami po polsku w swobodnym tonie.'
units:
  en.b2.unit08.synthesis:
    title: Where the sources agree and conflict
lessons:
  en.b2.unit08.lesson01_source_relationships:
    title: Zgodność, sprzeczność i uzasadnienie
  en.b2.unit08.lesson02_linking_sources:
    title: Both sources agree, but...
  en.b2.unit08.lesson03.reading_two_sources:
    title: 'Czytanie: ankieta i raport przewoźnika'
  en.b2.unit08.lesson04.the_synthesis_dialogue:
    title: Which account is better supported?
teaching:
  en.b2.unit08.lesson01.teach.source:
    title: source
    gloss: źródło
    note: '*source* to źródło dostarczające informacji. Nie używaj wszędzie *according to*; czasem chodzi o zgodność lub sprzeczność między źródłami.'
    example_gloss: Źródło dostarcza informacji.
  en.b2.unit08.lesson01.teach.synthesize:
    title: synthesize
    gloss: łączyć, syntetyzować
    note: '*synthesize* oznacza łączenie informacji z wielu źródeł w spójną odpowiedź.'
    example_gloss: Syntetyzować to łączyć informacje ze źródeł.
  en.b2.unit08.lesson01.teach.evaluate:
    title: evaluate
    gloss: oceniać
    note: '*evaluate* oznacza ocenę tego, jak mocne coś jest.'
    example_gloss: Oceniać to szacować, jak mocne coś jest.
  en.b2.unit08.lesson01.teach.agreement:
    title: agreement
    gloss: zgodność
    note: '*agreement* oznacza, że źródła mówią to samo w danej kwestii.'
    example_gloss: Zgodność oznacza, że źródła mówią to samo.
  en.b2.unit08.lesson01.teach.conflict:
    title: conflict
    gloss: sprzeczność, konflikt
    note: '*conflict* oznacza, że źródła przeczą sobie lub różnią się w danej kwestii.'
    example_gloss: Sprzeczność oznacza, że źródła się nie zgadzają.
  en.b2.unit08.lesson01.teach.judgement:
    title: judgment
    gloss: osąd, rzeczowa ocena
    note: '*judgment* to uzasadniona ocena tego, które źródło jest mocniejsze. W amerykańskim angielskim piszesz *judgment*; w brytyjskim spotkasz też *judgement*.'
    example_gloss: Osąd wyjaśnia, które źródło jest mocniejsze.
  en.b2.unit08.lesson02.teach_agree_conflict:
    title: Zgodność i sprzeczność
    gloss: Oba źródła zgadzają się, że popyt wzrósł, ale nie zgadzają się co do przyczyny.
    note: '*Both sources agree... but they disagree...* jest lepsze niż dwa osobne zdania z ciągłym *according to*.'
  en.b2.unit08.lesson02.teach_by_contrast:
    title: by contrast
    gloss: natomiast, w przeciwieństwie do tego
    note: '*By contrast* stosuj wtedy, gdy naprawdę zestawiasz dwa źródła lub punkty. Nie traktuj go jako uniwersalnego wypełniacza w miejsce polskiego „natomiast”.'
  en.b2.unit08.lesson02.teach_better_supported:
    title: better supported
    gloss: lepiej uzasadniony
    note: '*better supported on the cause* oznacza, że dowody dotyczące przyczyny są mocniejsze.'
  en.b2.unit08.lesson02.teach_grammar_synthesis:
    title: Budowanie syntezy
    gloss: Synteza powinna wskazywać, w czym źródła się zgadzają, w czym są sprzeczne i która relacja jest lepiej uzasadniona.
    note: Używaj *agree*, *conflict* i *better supported*, aby precyzyjnie opisać relacje między źródłami.
  en.b2.unit08.lesson03.teach_survey:
    title: survey
    gloss: ankieta, badanie ankietowe
    note: '*survey* zbiera odpowiedzi lub uwagi od wielu osób.'
    example_gloss: Ankieta może zebrać wiele uwag.
  en.b2.unit08.lesson03.teach_account:
    title: account
    gloss: relacja, opis
    note: '*account* to relacja lub wyjaśnienie tego, co się wydarzyło.'
    example_gloss: Relacja wyjaśnia, co się wydarzyło.
  en.b2.unit08.lesson03.teach.source_a:
    title: Source A
    gloss: 'Źródło A: Ankieta wśród pasażerów mówi, że spóźnione autobusy zdarzały się częściej po otwarciu nowego szpitala. Wielu pasażerów twierdzi, że trasa jest teraz zatłoczona, zwłaszcza rano. Ankieta przekonuje, że główną przyczyną jest większy popyt.'
    note: Źródło A zawiera wiele uwag pasażerów, ale to niekoniecznie najmocniejszy dowód co do przyczyny.
  en.b2.unit08.lesson03.teach.source_b:
    title: Source B
    gloss: 'Źródło B: Raport przewoźnika zgadza się, że popyt wzrósł po otwarciu szpitala, ale jako główną przyczynę opóźnień wskazuje braki kierowców. Raport zawiera dane o zatrudnieniu z tego samego okresu.'
    note: '*staffing records* dają mocniejszy dowód co do przyczyny niż same doświadczenia pasażerów.'
  en.b2.unit08.lesson04.teach.q_survey:
    title: Tessa wymienia źródło A
    gloss: 'Tessa mówi: Przeczytałam dwie relacje o spóźnionych autobusach. Ankieta wśród pasażerów mówi, że popyt wzrósł po otwarciu nowego szpitala.'
    note: To wprowadza źródło i kwestię większego popytu.
  en.b2.unit08.lesson04.teach.a_operator:
    title: Rowan wymienia źródło B
    gloss: 'Rowan mówi: Raport przewoźnika zgadza się, że popyt wzrósł, ale mówi, że głównym problemem były braki kierowców.'
    note: Źródło B potwierdza jedną kwestię, ale różni się co do przyczyny.
  en.b2.unit08.lesson04.teach.q_agree_conflict:
    title: Tessa dokonuje syntezy
    gloss: 'Tessa mówi: Czyli źródła zgadzają się co do większego popytu, ale są sprzeczne co do przyczyny.'
    note: '*agree on* i *conflict about* podsumowują relację między źródłami.'
  en.b2.unit08.lesson04.teach.a_better_supported:
    title: Rowan pyta o dowody
    gloss: 'Rowan pyta: Która relacja jest lepiej uzasadniona?'
    note: Prosi o osąd, a nie tylko o streszczenie.
  en.b2.unit08.lesson04.teach.q_evidence_compare:
    title: Tessa porównuje dowody
    gloss: 'Tessa mówi: Ankieta zawiera wiele uwag pasażerów, ale raport przewoźnika zawiera dane o zatrudnieniu.'
    note: 'To pytanie o dowody: uwagi kontra dane.'
  en.b2.unit08.lesson04.teach.a_judgement_question:
    title: Rowan prosi o osąd
    gloss: 'Rowan pyta: To jaki jest twój osąd?'
    note: '*judgment* wymaga uzasadnionego wniosku.'
  en.b2.unit08.lesson04.teach.q_final_judgement:
    title: Tessa wydaje osąd
    gloss: 'Tessa mówi: Raport przewoźnika jest lepiej uzasadniony co do przyczyny, chociaż ankieta jest przydatna, bo pokazuje doświadczenia pasażerów.'
    note: '*although* pozwala uwzględnić oba źródła, a mimo to wydać osąd.'
