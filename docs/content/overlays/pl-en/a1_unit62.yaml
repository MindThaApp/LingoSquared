teaching:
  en.a1.unit62.lesson01.teach.phone:
    title: phone
    gloss: telefon
    note: '*phone* znaczy telefon. W życiu codziennym *phone* to zwykle telefon komórkowy.'
    example_gloss: Mój telefon jest tutaj.
  en.a1.unit62.lesson01.teach.call:
    title: call
    gloss: dzwonić / telefon (rozmowa)
    note: '*call* może być rozmową telefoniczną albo znaczyć „dzwonić": *a call* (rzeczownik), *to call* (czasownik).'
    example_gloss: Mogę do ciebie zadzwonić.
  en.a1.unit62.lesson01.teach.message:
    title: message
    gloss: wiadomość
    note: '*message* znaczy wiadomość.'
    example_gloss: Zostaw wiadomość.
  en.a1.unit62.lesson01.teach.voicemail:
    title: voicemail
    gloss: poczta głosowa
    note: '*voicemail* znaczy nagraną wiadomość telefoniczną (pocztę głosową).'
    example_gloss: Wiadomość głosowa jest krótka.
  en.a1.unit62.lesson01.teach.repeat:
    title: repeat
    gloss: powtórzyć
    note: '*repeat* znaczy powiedzieć jeszcze raz.'
    example_gloss: Powtórz to, proszę.
  en.a1.unit62.lesson01.teach.slowly:
    title: slowly
    gloss: wolno
    note: '*slowly* znaczy wolno. To przysłówek zakończony na *-ly*; po polsku wystarczy samo „wolno".'
    example_gloss: Mów wolno, proszę.
  en.a1.unit62.lesson02.teach.this_is_leila:
    title: Hello, this is Leila.
    gloss: Cześć, tu Leila.
    note: Przez telefon po angielsku mówi się *this is...*, żeby powiedzieć, kto dzwoni. *My name is...* brzmi przez telefon nietypowo.
  en.a1.unit62.lesson02.teach.speak_to_mia:
    title: Can I speak to Mia?
    gloss: Czy mogę rozmawiać z Mią?
    note: '*speak to* znaczy rozmawiać z kimś. Polskie „z" staje się tu *to*.'
  en.a1.unit62.lesson02.teach.repeat_that:
    title: Please repeat that.
    gloss: Powtórz to, proszę.
    note: '*Please repeat that* to grzeczna prośba o powtórzenie.'
  en.a1.unit62.lesson02.teach.speak_slowly:
    title: Please speak slowly.
    gloss: Mów wolno, proszę.
    note: '*slowly* stoi tu po czasowniku *speak*.'
  en.a1.unit62.lesson02.teach.leave_message:
    title: Leave a message.
    gloss: Zostaw wiadomość.
    note: '*leave a message* to stałe wyrażenie na „zostawić wiadomość".'
  en.a1.unit62.lesson02.teach.call_back_later:
    title: I'll call back later.
    gloss: Oddzwonię później.
    note: '*call back* znaczy oddzwonić. Partykuła *back* stoi po czasowniku.'
  en.a1.unit62.lesson03.teach.dialogue_line1:
    title: "Mia odbiera telefon"
    gloss: 'Mia mówi: Cześć, tu Mia.'
    note: '*this is Mia* brzmi przez telefon naturalnie.'
  en.a1.unit62.lesson03.teach.dialogue_line2:
    title: "Leila się przedstawia"
    gloss: 'Leila mówi: Cześć, Mia, tu Leila.'
    note: Używaj *this is*, gdy przedstawiasz się przez telefon.
  en.a1.unit62.lesson03.teach.dialogue_line3:
    title: "Leila słabo słyszy"
    gloss: 'Leila mówi: Nie słyszę cię dobrze.'
    note: '*can''t hear you well* znaczy „nie słyszę cię dobrze".'
  en.a1.unit62.lesson03.teach.dialogue_line4:
    title: "Leila prosi, żeby mówić wolno"
    gloss: 'Leila mówi: Mów wolno, proszę.'
    note: '*Please speak slowly* to grzeczna prośba.'
  en.a1.unit62.lesson03.teach.dialogue_line5:
    title: "Mia podaje godzinę"
    gloss: 'Mia mówi: Jasne. Spotkanie jest o czwartej.'
    note: '*at four* używa *at* przy godzinie.'
  en.a1.unit62.lesson03.teach.dialogue_line6:
    title: "Leila prosi o powtórzenie"
    gloss: 'Leila mówi: Powtórz to, proszę.'
    note: '*repeat that* odnosi się do tego, co właśnie padło.'
  en.a1.unit62.lesson03.teach.dialogue_line7:
    title: "Mia powtarza: czwarta"
    gloss: 'Mia mówi: Czwarta.'
    note: '*Four o''clock* to pełna godzina.'
  en.a1.unit62.lesson03.teach.dialogue_line8:
    title: "Leila oddzwoni później"
    gloss: 'Leila mówi: Dzięki. Oddzwonię później.'
    note: '*I''ll* to skrót od *I will*.'
  en.a1.unit62.lesson04.teach.phone_note:
    title: "Wiadomość telefoniczna"
    gloss: 'Wiadomość telefoniczna: Mia dzwoniła o 3:00. Spotkanie w sali 5. Proszę oddzwonić.'
    note: Wiadomość podaje, kto dzwonił, godzinę, salę i co należy zrobić.
  en.a1.unit62.lesson04.teach.reading_passage:
    title: "Tekst: Krótka rozmowa telefoniczna"
    gloss: 'Krótka rozmowa telefoniczna: Mia zadzwoniła do Leili po południu. Dźwięk nie był wyraźny, więc Leila poprosiła Mię, żeby mówiła wolno. Mia powiedziała, że spotkanie jest o czwartej w sali 5. Leila poprosiła Mię o powtórzenie godziny. Później Leila napisała wiadomość telefoniczną. W wiadomości stało, że Mia dzwoniła o 3:00 i prosi o oddzwonienie.'
    note: '*called* to czas przeszły od *call*.'
