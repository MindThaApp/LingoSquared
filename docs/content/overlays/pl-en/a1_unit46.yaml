teaching:
  en.a1.unit46.lesson01.teach.lost:
    title: lost
    gloss: zgubiony / zgubiłem
    note: '*lost* znaczy tu zgubiony albo zgubił(em). To forma przeszła czasownika lose: po angielsku mówi się *I lost my wallet*, tak jak po polsku „zgubiłem portfel”.'
    example_gloss: Zgubiłem portfel.
  en.a1.unit46.lesson01.teach.found:
    title: found
    gloss: znaleziony / znalazłem
    note: '*found* to forma przeszła czasownika find, używana też w czasie present perfect: *I found your keys* = znalazłem twoje klucze.'
    example_gloss: Znalazłem twoje klucze!
  en.a1.unit46.lesson01.teach.keys:
    title: keys
    gloss: klucze
    note: '*keys* znaczy klucze.'
    example_gloss: To są moje klucze.
  en.a1.unit46.lesson01.teach.wallet:
    title: wallet
    gloss: portfel
    note: '*wallet* znaczy portfel.'
    example_gloss: Czy to twój portfel?
  en.a1.unit46.lesson01.teach.backpack:
    title: backpack
    gloss: plecak
    note: '*backpack* znaczy plecak.'
    example_gloss: Mój plecak jest czarny.
  en.a1.unit46.lesson02.teach.i_lost_my_wallet:
    title: I lost my wallet.
    gloss: Zgubiłem portfel.
    note: 'Dosłownie: „zgubiłem mój portfel”. Po angielsku używa się tu prostej formy przeszłej *lost*, a przed rzeczownikiem stoi *my* (mój).'
  en.a1.unit46.lesson02.teach.have_you_seen_my_keys:
    title: Have you seen my keys?
    gloss: Widziałeś moje klucze?
    note: '*Have you seen ...?* znaczy: widziałeś ...? Pytanie tworzysz z *have* przed podmiotem (*Have you ...*).'
  en.a1.unit46.lesson02.teach.has_anyone_found_a_backpack:
    title: Has anyone found a backpack?
    gloss: Czy ktoś znalazł plecak?
    note: '*Has anyone found ...?* znaczy: czy ktoś znalazł ...?'
  en.a1.unit46.lesson02.teach.its_black_with_a_red_strap:
    title: It's black with a red strap.
    gloss: Jest czarny z czerwonym paskiem.
    note: '*It''s black with a red strap.* znaczy: jest czarny z czerwonym paskiem.'
  en.a1.unit46.lesson02.teach.wheres_the_lost_and_found:
    title: Where's the lost and found?
    gloss: Gdzie jest biuro rzeczy znalezionych?
    note: '*the lost and found* to stała angielska nazwa biura rzeczy znalezionych, dosłownie „zgubione i znalezione”.'
  en.a1.unit46.lesson02.teach.yes_we_found_it:
    title: Yes, we found it!
    gloss: Tak, znaleźliśmy go!
    note: '*Yes, we found it!* znaczy: tak, znaleźliśmy to!'
  en.a1.unit46.lesson03.teach.dialogue_line1:
    title: Pytanie Daniela
    gloss: 'Daniel pyta: Mia, gdzie jest twój plecak? Jeszcze przed chwilą miałaś go przy fontannie.'
    note: '*had* to forma przeszła czasownika have (miał / miałam).'
  en.a1.unit46.lesson03.teach.dialogue_line2:
    title: Przerażenie Mii
    gloss: 'Mia mówi: O nie, masz rację! Nie mam go. Mój aparat jest w środku!'
    note: '*My camera is inside!* znaczy: mój aparat jest w środku!'
  en.a1.unit46.lesson03.teach.dialogue_line3:
    title: Propozycja Daniela
    gloss: 'Daniel mówi: Nie martw się, zadzwońmy do biura parku i zapytajmy.'
    note: '*Don''t worry* znaczy: nie martw się.'
  en.a1.unit46.lesson03.teach.dialogue_line4:
    title: Daniel belt
    gloss: 'Daniel mówi: Dzień dobry, zgubiliśmy czarny plecak przy fontannie. Czy ktoś taki znalazł?'
    note: '*we lost a black backpack* znaczy: zgubiliśmy czarny plecak. Po angielsku używa się tu prostej formy przeszłej *lost*.'
  en.a1.unit46.lesson03.teach.dialogue_line5:
    title: Pytanie Mii
    gloss: 'Mia mówi: Co powiedzieli?'
    note: '*did they say* używa did jako czasownika pomocniczego w czasie przeszłym.'
  en.a1.unit46.lesson03.teach.dialogue_line6:
    title: Dobre wieści od Daniela
    gloss: 'Daniel mówi: Znaleźli go! Jest czarny z żółtym paskiem, prawda? Trzymają go w recepcji.'
    note: '*right?* na końcu zdania to krótkie pytanie sprawdzające, podobne do „prawda?” po polsku.'
  en.a1.unit46.lesson03.teach.dialogue_line7:
    title: Ulga Mii
    gloss: 'Mia mówi: Tak, to ten! Chodźmy po niego od razu. Dzięki Bogu.'
    note: '*Let''s go get it* znaczy: chodźmy po to. Dwa czasowniki stoją obok siebie, bez *to*.'
  en.a1.unit46.lesson04.teach.reading_passage:
    title: Tekst o biurze rzeczy znalezionych
    gloss: 'Biuro rzeczy znalezionych: Jeśli zgubisz coś w parku, najpierw zastanów się, gdzie ostatnio to miałeś. Potem idź do biura parku przy głównej bramie i opisz przedmiot: podaj jego kolor i wszelkie szczególne cechy. Podaj swoje imię i numer telefonu, żeby pracownicy mogli do ciebie zadzwonić, jeśli później coś znajdą. Gdy Mia zgubiła plecak przy fontannie, ona i Daniel od razu zadzwonili do biura parku. Pracownicy już go znaleźli i trzymali w recepcji. Mia bardzo się ucieszyła, że odzyskała swój aparat w całości. Później opowiedziała całą historię Leili, a Leila powiedziała, że następnym razem pomoże Mii lepiej pilnować swoich rzeczy.'
    note: '*keep better track of your things* znaczy: lepiej pilnować swoich rzeczy.'
