    note: '*always* znaczy zawsze; stoi przed czasownikiem: *I always go running*.'
  en.a1.unit30.lesson02.teach.often:
    title: often
    gloss: często
    note: '*often* znaczy często. Zwróć uwagę na angielski szyk: *She often cooks dinner* (podmiot, *often*, czasownik). W polskim przysłówek może stać w wielu miejscach zdania (Często gotuje obiad dla rodziny; Gotuje często obiad dla rodziny), ale w angielskim *often* stoi zwykle między podmiotem a czasownikiem głównym, a podmiot zawsze poprzedza czasownik.'
  en.a1.unit30.lesson02.teach.sometimes:
    title: sometimes
    gloss: czasami
    note: '*sometimes* znaczy czasami. W polskim szyk zdania jest dość swobodny: Czasami chodzę biegać albo Chodzę czasami biegać. W angielskim po *sometimes* na początku zdania podmiot nadal stoi przed czasownikiem: *Sometimes I go running*.'
  en.a1.unit30.lesson02.teach.rarely:
    title: rarely
    gloss: rzadko
    note: '*rarely* znaczy rzadko.'
  en.a1.unit30.lesson02.teach.never:
    title: never
    gloss: nigdy
    note: '*never* znaczy nigdy; po polsku dodajemy jeszcze „nie”, a po angielsku *never* wystarczy.'
  en.a1.unit30.lesson02.teach.free_time_question:
    title: What do you do in your free time?
    gloss: Co robisz w wolnym czasie?
    note: '*free time* znaczy wolny czas.'
  en.a1.unit30.lesson03.teach.i_like_pattern:
    title: I like reading.
    gloss: Lubię czytać.
    note: '*I like* + czasownik z końcówką *-ing* mówi, że coś lubisz robić.'
  en.a1.unit30.lesson03.teach.dialogue_line1:
    title: Pytanie Leili
    gloss: 'Leila pyta: Co robisz w wolnym czasie, Daniel?'
    note: Leila zaczyna rozmowę bezpośrednim pytaniem do Daniela.
  en.a1.unit30.lesson03.teach.dialogue_line2:
    title: "Odpowiedź: Daniel"
    gloss: 'Daniel mówi: Często chodzę biegać. A czasami gotuję. A ty?'
    note: Daniel wymienia dwa hobby z częstotliwością i odbija pytanie słowami *What about you?*
  en.a1.unit30.lesson03.teach.dialogue_line3:
    title: Leila o malowaniu
    gloss: 'Leila mówi: Uwielbiam malować. Maluję prawie w każdy weekend.'
    note: '*almost every weekend* znaczy prawie w każdy weekend.'
  en.a1.unit30.lesson03.teach.dialogue_line4:
    title: Kolejne pytanie Daniela
    gloss: 'Daniel mówi: Świetnie! Grasz czasem w gry wideo?'
    note: '*Do you ever...?* służy do pytania, czy ktoś kiedykolwiek coś robi.'
  en.a1.unit30.lesson03.teach.dialogue_line5:
    title: Ostatnia odpowiedź Leili
    gloss: 'Leila mówi: Rzadko. Wolę poczytać książkę.'
    note: '*I prefer...* znaczy: wolę..., wolę robić...'
  en.a1.unit30.lesson04.teach.reading_passage:
    title: Tekst o hobby
    gloss: Daniel i Leila mają różne hobby. Daniel zawsze chodzi biegać w sobotnie poranki, a czasami gotuje obiad dla przyjaciół. Leila nigdy nie chodzi biegać, ale często maluje w weekend. Oboje lubią gry wideo, ale rzadko grają razem.
    note: Ten tekst bezpośrednio porównuje hobby Daniela i Leili oraz to, jak często je uprawiają.
