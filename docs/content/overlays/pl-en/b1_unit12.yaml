teaching:
  en.b1.unit12.lesson01.teach.although:
    title: although
    gloss: chociaż
    note: '*although* wprowadza przeciwieństwo w obrębie jednego zdania i łączy się z pełnym zdaniem podrzędnym.'
    example_gloss: Chociaż w biurze jest cicho, Mia woli pracować w domu.
  en.b1.unit12.lesson01.teach.even_though:
    title: even though
    gloss: mimo że, choć
    note: '*even though* podkreśla przeciwieństwo mocniej niż *although*.'
    example_gloss: Leila potrafi się skupić, mimo że jej mieszkanie jest małe.
  en.b1.unit12.lesson01.teach.despite:
    title: despite
    gloss: mimo, pomimo
    note: Po *despite* stoi rzeczownik lub forma z -ing, a nie pełne zdanie.
    example_gloss: Mimo rozpraszaczy Daniel kończy raport na czas.
  en.b1.unit12.lesson01.teach.however:
    title: however
    gloss: jednak, niemniej
    note: '*however* zaczyna nowe zdanie po kropce lub średniku.'
    example_gloss: W biurze jest cicho. Mimo to Mia woli pracować w domu.
  en.b1.unit12.lesson01.teach.valid_point:
    title: valid point
    gloss: trafna uwaga, dobry argument
    note: '*valid point* to rozsądny lub przekonujący argument.'
    example_gloss: To trafna uwaga, jeśli chodzi o skupienie.
  en.b1.unit12.lesson01.teach.convince:
    title: convince
    gloss: przekonać
    note: '*convince* oznacza sprawić, że ktoś zmieni zdanie lub uwierzy w coś.'
    example_gloss: Leila próbowała przekonać Mię, żeby wróciła do biura.
  en.b1.unit12.lesson02.teach.office_quiet_home:
    title: although + pełne zdanie podrzędne
    gloss: Chociaż w biurze jest cicho, Mia woli pracować w domu.
    note: '*although* + podmiot + czasownik tworzy pełne zdanie podrzędne przeciwstawne.'
  en.b1.unit12.lesson02.teach.distractions_report:
    title: despite + rzeczownik
    gloss: Mimo rozpraszaczy Daniel kończy raport na czas.
    note: Po *despite* następuje rzeczownik, a nie pełne zdanie podrzędne.
  en.b1.unit12.lesson02.teach.grammar_concession:
    title: although, despite i however
    gloss: '*Although* i *even though* wprowadzają pełne zdanie: *Although the office is quiet, Mia prefers home.* Po *despite* stoi rzeczownik lub forma z -ing, a nie zdanie: *Despite the distractions, Daniel finishes his report.* *However* zaczyna nowe zdanie po kropce lub średniku: *The office is quiet. However, Mia prefers home.*'
    note: 'Schemat: *although/even though* + zdanie podrzędne; *despite* + rzeczownik/forma z -ing; *however* jako przysłówek zdaniowy po kropce.'
  en.b1.unit12.lesson03.teach.flexibility:
    title: flexibility
    gloss: elastyczność
    note: '*flexibility* to zdolność łatwego zmieniania planów lub sposobu pracy.'
    example_gloss: Mia i Leila zgadzają się, że elastyczność jest ważna.
  en.b1.unit12.lesson03.teach.teamwork:
    title: teamwork
    gloss: praca zespołowa
    note: '*teamwork* oznacza współpracę w zespole.'
    example_gloss: Leila uważa, że w biurze lepiej się pracuje zespołowo.
  en.b1.unit12.lesson03.teach.reading_passage:
    title: 'Tekst: gdzie się pracuje'
    gloss: Mia i Leila mają różne zdania na temat tego, gdzie pracować. Mia pracuje w domu, bo jest jej tam wygodnie. Chociaż brakuje jej widoku współpracowników, w domu robi więcej. Leila woli biuro. Mimo hałasu lubi rozmawiać z kolegami w czasie przerw. Choć Mia trafnie zauważa, że w domu łatwiej się skupić, Leila nadal uważa, że biuro sprzyja lepszej pracy zespołowej. Mimo to obie zgadzają się, że elastyczność jest ważna.
    note: Krótki tekst z przeciwstawieniami.
  en.b1.unit12.lesson04.teach.q_although_nice_home:
    title: Mia wprowadza kontrast
    gloss: 'Mia mówi: Leila, chociaż w biurze jest miło, w domu zrobię więcej.'
    note: '*although* + pełne zdanie podrzędne na początku zdania.'
  en.b1.unit12.lesson04.teach.a_despite_noise_breaks:
    title: Leila przedstawia swój punkt widzenia
    gloss: 'Leila mówi: Rozumiem, ale mimo hałasu naprawdę lubię rozmawiać z ludźmi w czasie przerw.'
    note: '*despite* + rzeczownik (*the noise*).'
  en.b1.unit12.lesson04.teach.q_valid_point_however:
    title: Mia przyznaje rację, ale zostaje przy swoim zdaniu
    gloss: 'Mia mówi: To trafna uwaga. Mimo to nadal myślę, że lepiej skupiam się sama.'
    note: '*however* zaczyna tu nowe zdanie po kropce.'
  en.b1.unit12.lesson04.teach.a_even_though_convince:
    title: Leila droczy się z Mią
    gloss: 'Leila mówi: Mimo że wolę biuro, chyba nie przekonam cię do zmiany zdania, prawda?'
    note: '*even though* podkreśla przeciwieństwo.'
  en.b1.unit12.lesson04.teach.q_however_flexibility:
    title: Mia znajduje kompromis
    gloss: 'Mia mówi: Chyba nie! Ale możemy się zgodzić, że najważniejsza jest elastyczność.'
    note: '*however* łączy dwie przeciwstawne myśli jako nowe zdanie.'
  en.b1.unit12.lesson04.teach.a_despite_preferences_time:
    title: Leila kończy rozmowę pozytywnie
    gloss: 'Leila mówi: Mimo naszych różnych upodobań robimy wszystko na czas.'
    note: '*despite* + rzeczownik (*our different preferences*).'
