    note: '*What''s the name on the reservation?* znaczy: na jakie nazwisko jest rezerwacja?'
  en.a1.unit50.lesson03.teach.dialogue_line3:
    title: "Odpowiedź: Leila"
    gloss: 'Leila mówi: Jest na moje nazwisko, Leila.'
