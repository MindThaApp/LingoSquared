  en.a1.unit50.lesson03.teach.dialogue_line5:
    title: Pytanie Mii o internet
    gloss: 'Mia pyta: Czy w pokoju jest internet bezprzewodowy?'
    note: Powtórka pytania, którego uczyłeś się wcześniej.
  en.a1.unit50.lesson03.teach.dialogue_line6:
    title: Recepcjonista o śniadaniu
    gloss: 'Recepcjonista mówi: Tak, a śniadanie jest na dole od siódmej do dziesiątej.'
    note: '*from seven to ten* znaczy: od siódmej do dziesiątej.'
  en.a1.unit50.lesson03.teach.dialogue_line7:
    title: Pytanie Leili o wymeldowanie
    gloss: 'Leila mówi: Dziękuję! O której jest wymeldowanie?'
    note: Powtórka pytania *What time is check-out?*, którego uczyłeś się wcześniej.
  en.a1.unit50.lesson03.teach.dialogue_line8:
    title: Recepcjonista o wymeldowaniu
    gloss: 'Recepcjonista mówi: Wymeldowanie jest o jedenastej.'
    note: '*Check-out is at eleven o''clock.* znaczy: wymeldowanie jest o jedenastej.'
  en.a1.unit50.lesson04.teach.reading_passage:
    title: Tekst o weekendzie w pensjonacie
    gloss: 'Weekend w pensjonacie: Mia i Leila pojechały na krótki weekendowy wyjazd w góry. Mia uwielbia robić zdjęcia, a Leila uwielbia malować, więc było to idealne miejsce do odpoczynku. Gdy dotarły do pensjonatu, powiedziały recepcjoniście, że mają rezerwację na dwie noce, od 14 do 16 listopada. Recepcjonista zapytał o nazwisko, na które jest rezerwacja, a Leila powiedziała, że jest na jej nazwisko. W ich pokoju były dwa łóżka i internet bezprzewodowy, a śniadanie było wliczone w cenę i podawane codziennie rano od siódmej do dziesiątej. Wymeldowanie było o jedenastej. Mia zrobiła mnóstwo zdjęć gór, a Leila namalowała mały obraz widoku z ich okna. Daniel został w domu w ten weekend i ugotował sobie obiad według przepisu z książki kucharskiej wypożyczonej z biblioteki. Kiedy Mia i Leila wróciły, pokazały mu swoje zdjęcia i obraz, a one bardzo mu się spodobały.'
    note: '*Their room had two beds and wifi* znaczy: w ich pokoju były dwa łóżka i internet bezprzewodowy.'
