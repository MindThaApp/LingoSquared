  en.b1.unit19.lesson02.teach.grammar_summary_structure:
    title: Budowa podsumowania
    gloss: Zacznij streszczenie od zwrotu takiego jak In summary lub In short, a potem podaj tylko najważniejsze punkty we właściwej kolejności, w krótkim zdaniu. Użyj The main point was that..., żeby wyróżnić jedną najważniejszą myśl, oddzielnie od drobniejszych szczegółów.
    note: 'Forma: zacznij od In summary/In short i użyj The main point was that... dla najważniejszej myśli.'
