  en.b1.unit19.lesson03.teach.reading_passage:
    title: 'Tekst: streszczenie krótkiego artykułu'
    gloss: 'Leila przeczytała na kurs projektowania długi artykuł o komunikacji w miejscu pracy. Oryginalny artykuł zawierał wiele przykładów i informacji tła, ale Leila potrzebowała tylko najważniejszych punktów. Własnymi słowami napisała skrócone streszczenie: komunikacja w pracy działa najlepiej, gdy wiadomości są jasne i krótkie, a ludzie zadają pytania zamiast zgadywać. Pominęła większość przykładów, ponieważ były to szczegóły, a nie najważniejsze punkty. Jej wykładowca powiedział, że streszczenie zachowało ważne myśli we właściwej kolejności.'
    note: Krótki tekst do czytania.
  en.b1.unit19.lesson04.teach.q_missed_meeting:
    title: Daniel prosi o wyjaśnienie
    gloss: 'Daniel mówi: Ominęło mnie spotkanie. Możesz mi powiedzieć, co się działo?'
    note: Otwarte pytanie z prośbą o streszczenie.
  en.b1.unit19.lesson04.teach.a_in_short_budget_client:
    title: Mia robi krótkie podsumowanie
    gloss: 'Mia mówi: Jasne. Krótko mówiąc, rozmawialiśmy o budżecie i o nowym kliencie.'
    note: '*in short* otwiera szybkie, nieformalne podsumowanie.'
  en.b1.unit19.lesson04.teach.q_main_point_budget:
    title: Daniel pyta o główną myśl
    gloss: 'Daniel mówi: Co było najważniejsze w sprawie budżetu?'
    note: Konkretne pytanie o najważniejszą kwestię.
  en.b1.unit19.lesson04.teach.a_under_budget_this_month:
    title: Mia podaje główną myśl
    gloss: 'Mia mówi: Najważniejsze było to, że w tym miesiącu mieścimy się w budżecie.'
    note: '*the main point was that...* wyróżnia najważniejszą myśl.'
  en.b1.unit19.lesson04.teach.q_other_details:
    title: Daniel pyta o szczegóły
    gloss: 'Daniel mówi: Dobrze. Były jeszcze jakieś inne szczegóły?'
    note: Dopytanie o drobniejsze szczegóły.
  en.b1.unit19.lesson04.teach.a_client_meeting_moved:
    title: Mia podaje drobny szczegół
    gloss: 'Mia mówi: Tylko jeden drobny szczegół: spotkanie z klientem przeniesiono na przyszły tydzień.'
    note: '*just one small detail* wprowadza drobny, uzupełniający fakt.'
  en.b1.unit19.lesson04.teach.q_thanks_for_summary:
