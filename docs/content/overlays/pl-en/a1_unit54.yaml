    gloss: suszarka
    note: '*dryer* oznacza suszarkę do ubrań.'
    example_gloss: Włóż swoje ubrania do suszarki.
  en.a1.unit54.lesson01.teach.quarters:
    title: quarters
    gloss: ćwierćdolarówki (amerykańskie monety po 25 centów)
    note: '*quarters* to amerykańskie monety o wartości 25 centów – często potrzebne do pralek w pralni samoobsługowej. W polskim nie ma dokładnego odpowiednika, dlatego *quarters* zwykle zostaje po angielsku.'
    example_gloss: Maszyny przyjmują ćwierćdolarówki.
  en.a1.unit54.lesson01.teach.detergent:
    title: detergent
    gloss: proszek do prania
    note: '*detergent* oznacza proszek lub płyn do prania.'
    example_gloss: Potrzebujesz proszku do prania, żeby wyczyścić swoje ubrania.
  en.a1.unit54.lesson01.teach.load:
    title: load
    gloss: jedno pranie / ładunek
    note: '*load* oznacza tu jedno pranie – ilość rzeczy, które pierzesz naraz.'
    example_gloss: Mam duże pranie.
  en.a1.unit54.lesson02.teach.id_like_to_wash_a_few_things:
    title: I'd like to wash a few things, please.
    gloss: Chciałbym uprać kilka rzeczy, proszę.
    note: '*I''d like to* (skrót od *I would like to*) to grzeczny sposób proszenia o coś.'
  en.a1.unit54.lesson02.teach.do_you_have_change:
    title: Do you have change for the machines?
    gloss: Czy ma Pan/Pani drobne do pralek?
    note: '*change* oznacza tu drobne (pojedyncze monety), a nie zmianę.'
  en.a1.unit54.lesson02.teach.how_long_does_the_cycle_take:
    title: How long does the wash cycle take?
    gloss: Jak długo trwa cykl prania?
    note: '*take* oznacza tu „trwać” (potrzebować określonego czasu) – to zupełnie inne użycie niż w *the machines take quarters*, gdzie *take* znaczy „przyjmować”. W polskim to także dwa różne czasowniki.'
  en.a1.unit54.lesson02.teach.its_three_dollars_for_one_load:
    title: It's three dollars for one load.
    gloss: To trzy dolary za jedno pranie.
    note: '*for one load* oznacza za jedno pranie.'
  en.a1.unit54.lesson02.teach.what_time_do_you_close:
    title: What time do you close?
    gloss: O której godzinie zamykacie?
    note: '*do you close* używa pomocniczego *do* w pytaniu.'
  en.a1.unit54.lesson02.teach.please_pick_up_by_nine:
    title: Please pick up your laundry by nine o'clock.
    gloss: Proszę odebrać swoje pranie przed dziewiątą.
    note: '*pick up* oznacza odebrać – *by nine o''clock* oznacza przed dziewiątą (najpóźniej o tej godzinie).'
  en.a1.unit54.lesson03.teach.dialogue_line1:
    title: Pracownik wita ich
    gloss: 'Pracownik mówi: Cześć! Potrzebuje Pan/Pani pralki?'
    note: '*Do you need...?* używa pomocniczego *do* w pytaniu.'
  en.a1.unit54.lesson03.teach.dialogue_line2:
    title: Powód Leili
    gloss: 'Leila mówi: Tak, poproszę. Moja pralka w domu jest zepsuta.'
    note: '*at home* oznacza w domu.'
  en.a1.unit54.lesson03.teach.dialogue_line3:
    title: Prośba Daniela
    gloss: 'Daniel mówi: Ja też mam małe pranie. Czy mogę też użyć jednej pralki?'
    note: '*too* oznacza tu „też” i stoi na końcu zdania – *as well* znaczy to samo i stoi w drugim zdaniu.'
  en.a1.unit54.lesson03.teach.dialogue_line4:
    title: Pracownik o monetach
    gloss: 'Pracownik mówi: Jasne! Maszyny przyjmują ćwierćdolarówki.'
    note: '*take* oznacza tu przyjmować (jako płatność) – zwróć uwagę na różnicę w stosunku do *take* w *The wash cycle takes thirty minutes* poniżej, gdzie *take* znaczy trwać.'
  en.a1.unit54.lesson03.teach.dialogue_line5:
    title: Leila ma ćwierćdolarówki
    gloss: 'Leila mówi: Tak, mam ćwierćdolarówki.'
    note: Krótkie potwierdzenie, a nie nowa informacja.
  en.a1.unit54.lesson03.teach.dialogue_line6:
    title: Czas trwania prania
    gloss: 'Pracownik mówi: Cykl prania trwa trzydzieści minut.'
    note: '*take* oznacza tu trwać – to inne znaczenie niż *take* w *take quarters* powyżej.'
  en.a1.unit54.lesson03.teach.dialogue_line7:
    title: Daniel pyta o cenę
    gloss: 'Daniel mówi: A ile to kosztuje?'
    note: '*How much does it cost?* – znowu pomocnicze *do* (*does*) w pytaniu.'
  en.a1.unit54.lesson03.teach.dialogue_line8:
    title: Cena
    gloss: 'Pracownik mówi: To trzy dolary za jedno pranie.'
    note: Osobna informacja, niezależna od monet i czasu trwania.
  en.a1.unit54.lesson03.teach.dialogue_line9:
    title: Godzina zamknięcia
    gloss: 'Pracownik mówi: Pralnia zamyka się o dziewiątej, więc proszę odebrać pranie przed tym czasem.'
    note: '*so* oznacza tu „więc” – łączy godzinę zamknięcia z poleceniem, żeby przyjść na czas.'
  en.a1.unit54.lesson04.teach.reading_passage:
    title: 'Tekst: Wizyta w pralni'
    gloss: Pewnego popołudnia w domu Leili zepsuła się pralka. Postanowiła pójść do pralni samoobsługowej przy ulicy. Daniel poszedł z nią, bo on też miał małe pranie. W pralni pracownik wyjaśnił, że maszyny przyjmują ćwierćdolarówki, a cykl prania trwa trzydzieści minut. Jedno pranie kosztowało trzy dolary. Kiedy ich ubrania się prały, Daniel i Leila rozmawiali i pili kawę w kawiarni obok. Pralnia zamyka się o dziewiątej, więc dopilnowali, żeby odebrać pranie przed tą godziną. Leila była wdzięczna, że Daniel dotrzymał jej towarzystwa, i powiedziała, że pralka w domu pewnie zostanie naprawiona do weekendu.
    note: '*would be fixed* oznacza „zostałaby naprawiona” – Leila spodziewa się, że pralka zostanie naprawiona, ale nie jest to jeszcze pewne.'
