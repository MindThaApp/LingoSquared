    title: We close at eight o'clock.
    gloss: Zamykamy o ósmej.
    note: '*at eight o''clock* – po angielsku *at* podaje dokładną godzinę, podobnie jak polskie „o” w „o ósmej”.'
  en.a1.unit55.lesson03.teach.dialogue_line1:
    title: Ratownik wita ich
    gloss: 'Ratownik mówi: Cześć! Przyszliście dziś popływać?'
    note: '*Are you here to swim today?* używa *to swim*, by wskazać cel – podobnie jak polskie „żeby popływać”.'
  en.a1.unit55.lesson03.teach.dialogue_line2:
    title: Bilety Daniela
    gloss: 'Daniel mówi: Tak, dwa bilety, proszę.'
    note: Krótka, bezpośrednia prośba o dwa bilety.
  en.a1.unit55.lesson03.teach.dialogue_line3:
    title: Cena
    gloss: 'Ratownik mówi: Jasne! Jeden bilet kosztuje pięć dolarów.'
    note: 'Jedna osobna informacja: cena jednego biletu.'
  en.a1.unit55.lesson03.teach.dialogue_line4:
    title: Mia pyta o czepek
    gloss: 'Mia mówi: Czy potrzebujemy czepków?'
    note: '*Do we need...?* – znowu pomocnicze *do* w pytaniu.'
  en.a1.unit55.lesson03.teach.dialogue_line5:
    title: Zasada o czepkach
    gloss: 'Ratownik mówi: Tak, czepki są obowiązkowe na basenie.'
    note: '*swim caps are required* to strona bierna (pasywna) – formalny sposób wyrażania zasady, często używany na tablicach przy basenach i przez obsługę. Po polsku mówi się podobnie: „czepki są obowiązkowe” albo „obowiązuje noszenie czepka”.'
  en.a1.unit55.lesson03.teach.dialogue_line6:
    title: Daniel pyta o szafki
    gloss: 'Daniel mówi: Gdzie są szafki?'
    note: Krótkie pytanie, bez nowej informacji o cenie czy godzinie.
  en.a1.unit55.lesson03.teach.dialogue_line7:
    title: Miejsce szafek
    gloss: 'Ratownik mówi: Szafki są przy wejściu.'
    note: 'Jedna osobna informacja: gdzie są szafki – to coś innego niż to, czego szafki wymagają.'
  en.a1.unit55.lesson03.teach.dialogue_line8:
    title: Czego wymagają szafki
    gloss: 'Ratownik mówi: Potrzebują monety jednodolarowej.'
    note: '*a dollar coin* to połączenie dwóch angielskich słów (*dollar* + *coin*), pisanych osobno. Po polsku mówi się „moneta jednodolarowa” albo „moneta o wartości dolara”.'
  en.a1.unit55.lesson03.teach.dialogue_line9:
    title: Mia pyta o godzinę zamknięcia
    gloss: 'Mia mówi: O której zamykacie?'
    note: '*What time do you close?* używa pomocniczego *do* w pytaniu.'
  en.a1.unit55.lesson03.teach.dialogue_line10:
    title: Godzina zamknięcia
    gloss: 'Ratownik mówi: Zamykamy o ósmej.'
    note: 'Czwarta, osobna informacja: godzina zamknięcia.'
  en.a1.unit55.lesson04.teach.reading_passage:
    title: 'Tekst: Dzień na basenie'
    gloss: 'Pewnego gorącego popołudnia w lipcu Daniel i Mia postanowili ochłodzić się na miejskim basenie. Przy wejściu tablica podawała regulamin basenu: zakaz biegania, a czepki są obowiązkowe. Poprosili ratownika o dwa bilety. Jeden bilet kosztował pięć dolarów. Ratownik wyjaśnił, że szafki są przy wejściu i potrzebują monety jednodolarowej. Daniel i Mia schowali torby do szafki i pływali prawie dwie godziny. Zanim wyszli, jeszcze raz sprawdzili tablicę: basen zamyka się o ósmej. Mia powiedziała, że chce wrócić w przyszły weekend i spróbować skoków z trampoliny.'
    note: '*required* to strona bierna (pasywna) – *swim caps are required* oznacza, że czepki są obowiązkowe.'
