teaching:
  en.a1.unit66.lesson01.teach.symptom:
    title: symptom
    gloss: objaw
    note: '*symptom* znaczy objaw choroby, który odczuwasz. Wymawia się *SIMP-tum*.'
    example_gloss: To jest objaw.
  en.a1.unit66.lesson01.teach.cough:
    title: cough
    gloss: kaszel
    note: '*cough* znaczy kaszel. Wymowa to *kof*; *gh* czyta się tu jak *f*.'
    example_gloss: Mam kaszel.
  en.a1.unit66.lesson01.teach.fever:
    title: fever
    gloss: gorączka
    note: '*fever* znaczy gorączka. Wymawia się *FEE-ver*.'
    example_gloss: Masz gorączkę?
  en.a1.unit66.lesson01.teach.throat:
    title: throat
    gloss: gardło
    note: '*throat* znaczy gardło; na zewnętrzną szyję mówi się *neck*.'
    example_gloss: Boli mnie gardło.
  en.a1.unit66.lesson01.teach.headache:
    title: headache
    gloss: ból głowy
    note: '*headache* znaczy ból głowy (po angielsku w liczbie pojedynczej).'
    example_gloss: Boli mnie głowa.
  en.a1.unit66.lesson01.teach.medicine:
    title: medicine
    gloss: lek
    note: '*medicine* znaczy lek lub medycyna. To słowo jest niepoliczalne: *some medicine*.'
    example_gloss: Weź ten lek.
  en.a1.unit66.lesson02.teach.have_cough:
    title: I have a cough.
    gloss: Mam kaszel.
    note: Po angielsku mówi się *have a cough* z *a*; po polsku mówimy po prostu „mam kaszel", bez przedimka.
  en.a1.unit66.lesson02.teach.throat_hurts:
    title: My throat hurts.
    gloss: Boli mnie gardło.
    note: '*hurts* znaczy „boli". Po angielsku częścią ciała jest podmiot (*my throat hurts*); polskie „boli mnie gardło" ma inny szyk.'
  en.a1.unit66.lesson02.teach.have_headache:
    title: I have a headache.
    gloss: Boli mnie głowa.
    note: Po angielsku mówi się *have a headache* z *a*; po polsku mówimy „boli mnie głowa", bez przedimka.
  en.a1.unit66.lesson02.teach.have_medicine:
    title: Do you have medicine?
    gloss: Czy macie jakiś lek?
    note: '*Do you have...?* pyta, czy coś jest dostępne.'
  en.a1.unit66.lesson02.teach.with_water:
    title: Take this with water.
    gloss: Proszę to zażyć z wodą.
    note: '*with water* stoi na końcu zdania.'
  en.a1.unit66.lesson02.teach.ask_doctor:
    title: Please ask a doctor.
    gloss: Proszę zapytać lekarza.
    note: '*Please* sprawia, że zdanie jest grzeczne.'
  en.a1.unit66.lesson03.teach.dialogue_line1:
    title: "Leila podaje dolegliwość"
    gloss: 'Leila mówi: Dzień dobry. Mam kaszel.'
    note: '*I have a cough* podaje dolegliwość.'
  en.a1.unit66.lesson03.teach.dialogue_line2:
    title: "Farmaceuta pyta o gorączkę"
    gloss: 'Farmaceuta mówi: Ma Pani gorączkę?'
    note: '*Do you have a fever?* to pytanie, na które odpowiada się „tak" lub „nie".'
  en.a1.unit66.lesson03.teach.dialogue_line3:
    title: "Leila nie ma gorączki"
    gloss: 'Leila mówi: Nie, nie mam gorączki. Boli mnie gardło.'
    note: '*No, I do not have...* zaprzecza dolegliwość. Po angielsku przeczy się przez *do not*, a nie przez „nie mam" jak po polsku.'
  en.a1.unit66.lesson03.teach.dialogue_line4:
    title: "Farmaceuta pyta o ból głowy"
    gloss: 'Farmaceuta mówi: Boli Panią głowa?'
    note: '*headache* znaczy ból głowy.'
  en.a1.unit66.lesson03.teach.dialogue_line5:
    title: "Leila ma ból głowy"
    gloss: 'Leila mówi: Tak, boli mnie głowa.'
    note: '*Yes* znaczy „tak".'
  en.a1.unit66.lesson03.teach.dialogue_line6:
    title: "Rada farmaceuty"
    gloss: 'Farmaceuta mówi: Proszę zażyć ten lek z wodą. Jeśli poczuje się Pani gorzej, proszę zapytać lekarza.'
    note: '*if you feel worse* znaczy „jeśli poczuje się Pani gorzej".'
  en.a1.unit66.lesson03.teach.dialogue_line7:
    title: "Leila dziękuje"
    gloss: 'Leila mówi: Dziękuję.'
    note: '*Thank you* to krótka formuła podziękowania.'
  en.a1.unit66.lesson04.teach.pharmacy_note:
    title: "Kartka z apteki"
    gloss: 'Kartka z apteki: Kaszel i ból gardła. Bez gorączki. Zażywać lek z wodą. Jeśli gorzej, zapytać lekarza.'
    note: Kartka podaje dolegliwości i proste rady.
  en.a1.unit66.lesson04.teach.reading_passage:
    title: "Tekst: Wizyta w aptece"
    gloss: 'Wizyta w aptece: Leila poszła do apteki, bo miała kaszel i bolało ją gardło. Farmaceuta zapytał, czy ma gorączkę. Leila powiedziała, że nie ma gorączki, ale boli ją głowa. Farmaceuta dał jej lek i powiedział, żeby zażyła go z wodą. Na kartce było napisane, żeby zapytała lekarza, jeśli poczuje się gorzej.'
    note: '*felt worse* to czas przeszły od *feel worse*.'
