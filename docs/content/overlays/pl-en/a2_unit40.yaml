teaching:
  en.a2.unit40.lesson01.teach.order:
    title: order
    gloss: zamówienie
    note: '*order* to samo zamówienie. Jako czasownik *to order* znaczy „zamawiać”.'
    example_gloss: Moje zamówienie przyszło dwa dni za późno.
  en.a2.unit40.lesson01.teach.delivery:
    title: delivery
    gloss: dostawa
    note: '*delivery* to moment, w którym twoje zamówienie jest przywożone do domu.'
    example_gloss: Dostawa przyszła we wtorek przed południem.
  en.a2.unit40.lesson01.teach.parcel:
    title: parcel
    gloss: paczka
    note: '*parcel* to zapakowana paczka, którą zostawia się pod twoimi drzwiami.'
    example_gloss: Paczkę zostawiono przed moimi drzwiami.
  en.a2.unit40.lesson01.teach.damaged:
    title: damaged
    gloss: uszkodzony
    note: '*damaged* mówi, że coś zostało uszkodzone w drodze, ale może jeszcze działać. Najczęściej mówi się tak o opakowaniu.'
    example_gloss: Pudełko było uszkodzone, kiedy dotarło.
  en.a2.unit40.lesson01.teach.broken:
    title: broken
    gloss: zepsuty
    note: '*broken* jest mocniejsze niż *damaged*: rzecz już nie działa.'
    example_gloss: Lampa w paczce była zepsuta.
  en.a2.unit40.lesson01.teach.replacement:
    title: replacement
    gloss: produkt zastępczy, wysyłka w zamian
    note: '*replacement* to nowy egzemplarz w miejsce zepsutego. *refund* to zwrot pieniędzy.'
    example_gloss: Poprosiłem o nowy egzemplarz w zamian, a nie o zwrot pieniędzy.
  en.a2.unit40.lesson01.teach.grammar_arrived:
    title: arrived i has not arrived yet
    gloss: Moje zamówienie przyszło wczoraj. Moje zamówienie jeszcze nie przyszło.
    note: '*arrived* używasz z określonym momentem w przeszłości. *has not arrived yet* mówi, że nadal na nie czekasz.'
  en.a2.unit40.lesson02.teach.report_order_problem:
    title: Mówienie, w jakiej sprawie dzwonisz
    gloss: Chciałbym zgłosić problem z moim zamówieniem.
    note: '*I''d like to report a problem with ...* to ta sama uprzejma forma, której użyto przy zgłaszaniu nieszczelności w lekcji 29.'
  en.a2.unit40.lesson02.teach.lamp_arrived_broken:
    title: Mówienie, co jest nie tak
    gloss: Lampa przyszła zepsuta.
    note: '*arrived broken* znaczy, że lampa była już zepsuta, gdy dotarła.'
  en.a2.unit40.lesson02.teach.ask_for_replacement:
    title: Wybór między zamiennikiem a zwrotem pieniędzy
    gloss: Czy mogę dostać nowy egzemplarz w zamian, zamiast zwrotu pieniędzy?
    note: '*instead of* zestawia dwie możliwości: wybierasz pierwszą, a nie drugą.'
  en.a2.unit40.lesson02.teach.my_order_number:
    title: Podawanie numeru zamówienia
    gloss: Numer mojego zamówienia to 8154.
    note: Podaj numer zamówienia od razu, gdy ktoś o niego zapyta; dzięki temu pracownik znajdzie twoje zamówienie.
  en.a2.unit40.lesson02.teach.grammar_instead_of:
    title: instead of do wyboru
    gloss: Czy mogę dostać nowy egzemplarz w zamian, zamiast zwrotu pieniędzy? Wolałbym zwrot pieniędzy zamiast wymiany.
    note: 'Po *instead of* stoi rzeczownik albo forma z -ing (*instead of a refund*, *instead of getting a refund*), nigdy bezokolicznik: nie *instead of get a refund*.'
  en.a2.unit40.lesson03.teach.box:
    title: box
    gloss: pudełko, karton
    note: '*box* to pudełko, w którym znajduje się twoje zamówienie. *parcel* to cała paczka w takiej postaci, w jakiej jest dostarczana.'
    example_gloss: Lampa była w dużym pudełku.
  en.a2.unit40.lesson03.teach.return_message:
    title: Odpowiedź sklepu
    gloss: Dziękujemy za wiadomość. Przykro nam, że lampa przyszła zepsuta. Prosimy włożyć lampę z powrotem do pudełka i zanieść ją na pocztę. Nowa lampa zostanie wysłana w ciągu trzech dni roboczych. Numer zamówienia 8154.
    note: 'Odpowiedź obsługi klienta zawsze wskazuje: problem, co masz zrobić i co zrobi sklep.'
  en.a2.unit40.lesson03.teach.put_it_back_in_the_box:
    title: Co zrobić ze zepsutą lampą
    gloss: Prosimy włożyć lampę z powrotem do pudełka i zanieść ją na pocztę.
    note: '*put ... back in ...* znaczy włożyć coś z powrotem tam, skąd zostało wyjęte.'
  en.a2.unit40.lesson04.teach.q_report_a_problem:
    title: Leila dzwoni do sklepu internetowego
    gloss: 'Leila mówi: Dzień dobry, chciałabym zgłosić problem z moim zamówieniem.'
    note: Przez telefon od razu mówisz, w jakiej sprawie dzwonisz.
  en.a2.unit40.lesson04.teach.a_what_is_the_problem:
    title: Pracownik dopytuje
    gloss: 'Pracownik mówi: Przykro mi to słyszeć. Jaki to problem?'
    note: '*I''m sorry to hear that* to utarta, uprzejma reakcja pracownika na złe wiadomości.'
  en.a2.unit40.lesson04.teach.q_lamp_broken_box_damaged:
    title: Leila wyjaśnia problem
    gloss: 'Leila mówi: Lampa przyszła zepsuta. Pudełko było uszkodzone.'
    note: 'Zwróć uwagę na różnicę: pudełko jest *damaged*, a lampa jest *broken*.'
  en.a2.unit40.lesson04.teach.a_ask_order_number:
    title: Pracownik pyta o numer zamówienia
    gloss: 'Pracownik mówi: Rozumiem. Czy mogłaby mi Pani podać numer zamówienia?'
    note: Ta sama uprzejma forma pytania pośredniego *Could you tell me ...?* co w lekcji 39.
  en.a2.unit40.lesson04.teach.q_order_number_8154:
    title: Leila podaje numer zamówienia
    gloss: 'Leila mówi: Numer mojego zamówienia to 8154.'
    note: To samo zdanie, co w lekcji 2.
  en.a2.unit40.lesson04.teach.a_refund_or_replacement:
    title: Pracownik proponuje dwie możliwości
    gloss: 'Pracownik mówi: Dziękuję. Czy chce Pani zwrot pieniędzy, czy nowy egzemplarz w zamian?'
    note: '*or* zestawia tu dwie możliwości; wybierasz jedną z nich.'
  en.a2.unit40.lesson04.teach.q_replacement_please:
    title: Leila wybiera zamiennik
    gloss: 'Leila mówi: Czy mogę dostać nowy egzemplarz w zamian, zamiast zwrotu pieniędzy?'
    note: To samo pytanie, co w lekcji 2.
  en.a2.unit40.lesson04.teach.a_new_lamp_three_days:
    title: Pracownik załatwia sprawę
    gloss: 'Pracownik mówi: Oczywiście. Nowa lampa zostanie wysłana w ciągu trzech dni roboczych.'
    note: To samo zapewnienie, co w wiadomości w lekcji 3.
  en.a2.unit40.lesson04.teach.q_thank_you:
    title: Leila dziękuje pracownikowi
    gloss: 'Leila mówi: Bardzo dziękuję.'
    note: '*very much* nadaje podziękowaniu większą wagę.'
