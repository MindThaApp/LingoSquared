course:
  title: Angielski B2
  description: 'Nauka angielskiego na poziomie B2: niuansowane rozmowy, argumenty, przypuszczenia i profesjonalna dyskusja, z wyjaśnieniami po polsku w swobodnym tonie.'
units:
  en.b2.unit03.hedging_emphasis:
    title: It seems reasonable, but...
lessons:
  en.b2.unit03.lesson01.stance_words:
    title: Łagodzenie, zastrzeżenia i podkreślanie
  en.b2.unit03.lesson02.modulating_claims:
    title: Seems reasonable, does create work
  en.b2.unit03.lesson03.reading_nuanced_feedback:
    title: 'Czytanie: poparcie z zastrzeżeniami'
  en.b2.unit03.lesson04.the_nuance_dialogue:
    title: Broadly useful, provided...
teaching:
  en.b2.unit03.lesson01.teach.hedge:
    title: hedge
    gloss: formułować ostrożniej
    note: '*hedge* oznacza, że czynisz wypowiedź mniej kategoryczną. Polskie „trochę” nie zawsze trzeba tłumaczyć przez *a little*.'
    example_gloss: Leila używa *seems*, aby ostrożniej sformułować swoją opinię o polityce firmy.
  en.b2.unit03.lesson01.teach.qualify:
    title: qualify
    gloss: ograniczyć lub doprecyzować
    note: '*qualify* oznacza, że ograniczasz wypowiedź warunkiem lub wyjątkiem.'
    example_gloss: Wyrażenie „provided we agree” ogranicza poparcie Leili.
  en.b2.unit03.lesson01.teach.emphasize:
    title: emphasize
    gloss: podkreślać
    note: '*emphasize* oznacza, że wzmacniasz jedną część swojego przekazu.'
    example_gloss: Daniel podkreśla problem nadmiaru pracy.
  en.b2.unit03.lesson01.teach.to_some_extent:
    title: to some extent
    gloss: do pewnego stopnia
    note: '*to some extent* brzmi często naturalniej niż używanie wszędzie *a little*.'
    example_gloss: Do pewnego stopnia ta polityka odpowiada na obawy zespołu.
  en.b2.unit03.lesson01.teach.broadly:
    title: broadly
    gloss: w ogólnym zarysie, generalnie
    note: '*broadly* oznacza ogólne poparcie lub ogólną prawdziwość, z miejscem na wyjątki.'
    example_gloss: Propozycja jest generalnie przydatna, choć niedoskonała.
  en.b2.unit03.lesson01.teach.provided:
    title: provided
    gloss: pod warunkiem, że
    note: '*provided* wprowadza warunek. Podobnie jak polskie „pod warunkiem, że” brzmi dość formalnie i profesjonalnie.'
    example_gloss: Możemy poprzeć tę politykę, pod warunkiem że się zgodzimy.
  en.b2.unit03.lesson02.teach.seems_but_does:
    title: Ostrożność i nacisk
    gloss: Polityka wydaje się rozsądna, ale rzeczywiście generuje dodatkową pracę dla zespołu.
    note: '*seems* łagodzi pozytywne stwierdzenie, a *does create* podkreśla, że dodatkowa praca naprawdę powstaje. Po polsku robisz to słowami typu „rzeczywiście” czy „faktycznie”: faktycznie generuje dodatkową pracę.'
  en.b2.unit03.lesson02.teach.what_worries_me:
    title: Skupienie na obawie
    gloss: Martwi mnie dodatkowa praca dla zespołu.
    note: '*What worries me is...* wysuwa dany punkt na początek, by go uwydatnić. Potem zachowaj angielski szyk: *is the extra work*.'
  en.b2.unit03.lesson02.teach.broadly_provided:
    title: Ogólne poparcie z warunkiem
    gloss: Jest to generalnie przydatne, pod warunkiem że harmonogram zostanie dostosowany.
    note: '*broadly useful, provided...* wyraża poparcie z wyraźnym warunkiem.'
  en.b2.unit03.lesson02.teach.grammar_stance:
    title: Niuans i nacisk
    gloss: Użyj seems, broadly lub to some extent, aby wypowiedź była ostrożniejsza lub bardziej ograniczona. Użyj do lub does przed czasownikiem głównym, by podkreślić, że coś jest prawdą. Użyj What matters is... lub What worries me is..., aby skierować uwagę na jeden punkt.
    note: 'Najbardziej nietypowe jest *does create*: nie znaczy to „robi tworzyć”, tylko *does* dodaje nacisk na *create*, tak jak „faktycznie” czy „rzeczywiście” po polsku.'
  en.b2.unit03.lesson03.teach.overall:
    title: overall
    gloss: ogólnie rzecz biorąc
    note: '*overall* patrzy na całość, nawet jeśli są szczegóły lub wyjątki.'
    example_gloss: Ogólnie rzecz biorąc, Leila popiera tę politykę.
  en.b2.unit03.lesson03.teach.condition:
    title: condition
    gloss: warunek
    note: '*condition* to coś, co musi zostać spełnione, zanim coś zacznie obowiązywać.'
    example_gloss: Jej warunek jest taki, że harmonogram musi zostać dostosowany.
  en.b2.unit03.lesson03.teach.reading_passage:
    title: 'Tekst do czytania: poparcie z zastrzeżeniami'
    gloss: 'Opinia Leili jest pozytywna, ale starannie obwarowana. Mówi, że polityka przeglądów wydaje się ogólnie rozsądna, co łagodzi jej twierdzenie i pozwala uniknąć kategorycznego tonu. Mówi też, że jest generalnie przydatna, pod warunkiem że harmonogram zostanie dostosowany. Ten warunek ogranicza jej poparcie: nie akceptuje polityki dokładnie w obecnym kształcie. Daniel podkreśla inny punkt za pomocą konstrukcji wysuwającej: martwi go dodatkowa praca dla zespołu. Oboje popierają politykę co do zasady, ale ich język pokazuje różny stopień zaangażowania.'
    note: Tekst pokazuje, jak tę samą treść wyrazić łagodniej, mocniej lub warunkowo.
  en.b2.unit03.lesson04.teach.q_policy_seems:
    title: Leila formułuje się ostrożnie
    gloss: 'Leila mówi: Nowa polityka przeglądów wydaje się ogólnie rozsądna.'
    note: '*seems reasonable overall* jest bardziej pozytywne niż krytyka, ale nie kategoryczne.'
  en.b2.unit03.lesson04.teach.a_not_fully_ready:
    title: Daniel słyszy ostrożność
    gloss: 'Daniel mówi: To brzmi dość ostrożnie. Chcesz powiedzieć, że nie jest jeszcze w pełni gotowa?'
    note: Daniel zauważa, że Leila nie mówi po prostu *it is ready*.
  en.b2.unit03.lesson04.teach.q_workable_deadlines:
    title: Leila dodaje niuansów
    gloss: 'Leila mówi: Dokładnie. Może się sprawdzić, ale potrzebuje jaśniejszych terminów.'
    note: '*may be workable* zostawia miejsce na wątpliwości; *but* wskazuje ograniczenie.'
  en.b2.unit03.lesson04.teach.a_what_worries:
    title: Daniel wysuwa obawę
    gloss: 'Daniel mówi: Zgadzam się. Martwi mnie dodatkowa praca dla zespołu.'
    note: '*What worries me is...* kieruje uwagę na obawę.'
  en.b2.unit03.lesson04.teach.q_does_create_checks:
    title: Leila podkreśla przez does
    gloss: 'Leila mówi: Słusznie. Ta polityka rzeczywiście zapewnia lepszą kontrolę jakości, ale dodaje też jeszcze jeden etap zatwierdzania.'
    note: '*does create* podkreśla, że ta korzyść naprawdę istnieje, mimo późniejszego zastrzeżenia.'
  en.b2.unit03.lesson04.teach.a_support_conditions:
    title: Daniel podsumowuje warunek
    gloss: 'Daniel mówi: Czyli powinniśmy ją poprzeć z zastrzeżeniami?'
    note: Podsumowuje zniuansowane poparcie Leili.
  en.b2.unit03.lesson04.teach.q_broadly_useful:
    title: Leila wyraża warunkowe poparcie
    gloss: 'Leila mówi: Tak. Powiedziałabym, że jest generalnie przydatna, pod warunkiem że harmonogram zostanie dostosowany.'
    note: '*provided* oznacza tu „pod warunkiem, że”: poparcie obowiązuje tylko wtedy, gdy warunek zostanie spełniony.'
  en.b2.unit03.lesson04.teach.same_content_triad:
    title: Ta sama treść, trzy stopnie siły
    gloss: Polityka generuje dodatkową pracę. Polityka wydaje się generować dodatkową pracę. Polityka rzeczywiście generuje dodatkową pracę.
    note: Te trzy zdania ćwiczą wersję neutralną, ostrożniejszą z *seems to* i mocniejszą z *does*.
