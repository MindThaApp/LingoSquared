    title: pharmacist
    gloss: farmaceuta / farmaceutka
    note: '*pharmacist* to osoba, która wydaje ci leki.'
    example_gloss: Farmaceuta wyjaśnił mi, jak przyjmować ten lek.
  en.a2.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: tabletka
    note: '*tablet* to pojedyncza stała sztuka leku, którą się połyka.'
    example_gloss: Rano biorę jedną tabletkę, a wieczorem jeszcze jedną.
  en.a2.unit35.lesson01.teach.dose:
    title: dose
    gloss: dawka
    note: '*dose* to ilość leku przyjmowana jednorazowo.'
    example_gloss: Dawka to jedna tabletka dwa razy dziennie.
  en.a2.unit35.lesson01.teach.refill:
    title: refill
    gloss: kolejne opakowanie (na tę samą receptę)
    note: '*refill* to kolejne opakowanie tego samego leku, bez konieczności ponownej wizyty u lekarza.'
    example_gloss: Potrzebuję kolejnego opakowania, bo moje tabletki prawie się skończyły.
  en.a2.unit35.lesson01.teach.side_effects:
    title: side effects
    gloss: skutki uboczne
    note: '*side effects* to dodatkowe działania, jakie lek może wywołać w organizmie.'
    example_gloss: Farmaceuta wyjaśnił mi skutki uboczne tego leku.
  en.a2.unit35.lesson01.teach.grammar_frequency:
    title: Mówienie, jak często się coś przyjmuje
    gloss: raz dziennie, dwa razy dziennie, trzy razy dziennie, co osiem godzin
    note: '*once a day* = raz dziennie, *twice a day* = dwa razy dziennie, *three times a day* = trzy razy dziennie, *every eight hours* = co osiem godzin.'
  en.a2.unit35.lesson02.teach.pick_up_prescription:
    title: Mówienie, po co się stoi przy ladzie
    gloss: Chciałbym odebrać receptę.
    note: '*I''d like to...* to uprzejma, standardowa forma, którą mówisz, czego chcesz.'
  en.a2.unit35.lesson02.teach.take_one_tablet:
    title: Dawkowanie, które można usłyszeć
    gloss: Proszę przyjmować jedną tabletkę dwa razy dziennie podczas jedzenia.
    note: '*with food* znaczy „podczas jedzenia”, czyli nie na czczo.'
  en.a2.unit35.lesson02.teach.ask_how_many_days:
    title: Pytanie, jak długo trzeba to przyjmować
    gloss: Przez ile dni mam go przyjmować?
    note: '*How many...?* stosuje się przy rzeczach policzalnych, takich jak dni.'
  en.a2.unit35.lesson02.teach.ask_side_effects:
    title: Pytanie o skutki uboczne
    gloss: Czy są jakieś skutki uboczne?
    note: '*Are there any...?* to zwykły sposób, by zapytać, czy coś jest.'
  en.a2.unit35.lesson02.teach.grammar_should:
    title: should i shouldn't w instrukcjach
    gloss: Powinieneś przyjmować go podczas jedzenia. Nie powinieneś przerywać zbyt wcześnie.
    note: '*should* wyraża radę lub zalecenie; *shouldn''t* to forma przecząca.'
  en.a2.unit35.lesson03.teach.before_bed:
    title: before bed
    gloss: przed snem
    note: '*before bed* znaczy „przed pójściem spać”.'
    example_gloss: Niektóre leki działają lepiej, jeśli przyjmuje się je przed snem.
  en.a2.unit35.lesson03.teach.label_text:
    title: Etykieta apteczna
    gloss: 'Lek na przeziębienie. Przyjmować jedną tabletkę dwa razy dziennie podczas jedzenia, przez pięć dni. Nie przerywać przyjmowania tabletek zbyt wcześnie. Możliwe skutki uboczne: może wystąpić zmęczenie. Kolejne opakowania: jedno.'
    note: 'Etykieta z apteki jest krótka i zwięzła: krótkie zdania i brak form grzecznościowych.'
  en.a2.unit35.lesson03.teach.do_not_stop_early:
    title: Ostrzeżenie na etykiecie
    gloss: Nie przerywać przyjmowania tabletek zbyt wcześnie.
    note: '*Do not...* to zakaz w trybie rozkazującym, taki jak na etykietach i tablicach.'
  en.a2.unit35.lesson04.teach.q_pick_up:
    title: Daniel zgłasza się przy ladzie
    gloss: 'Daniel: Dzień dobry, chciałbym odebrać receptę.'
    note: '*Hi* jest swobodniejsze niż *Hello*, ale przy okienku w aptece jest zupełnie zwyczajne.'
  en.a2.unit35.lesson04.teach.a_what_is_your_name:
    title: Farmaceuta pyta o imię
    gloss: 'Farmaceuta: Oczywiście. Jak się Pan nazywa?'
    note: '*Of course* znaczy tu: „chętnie”, „nie ma problemu”.'
  en.a2.unit35.lesson04.teach.q_doctor_gave_me_medicine:
    title: Daniel podaje powód przyjmowania leku
    gloss: 'Daniel: Daniel. Lekarz przepisał mi lek na silne przeziębienie.'
    note: 'Nawiązuje to do wizyty u lekarza z rozdziału 28: to samo przeziębienie.'
  en.a2.unit35.lesson04.teach.a_here_it_is:
    title: Farmaceuta podaje dawkowanie
    gloss: 'Farmaceuta: Proszę bardzo. Proszę przyjmować jedną tabletkę dwa razy dziennie podczas jedzenia.'
    note: '*Here it is* mówi się, gdy komuś coś podajemy.'
  en.a2.unit35.lesson04.teach.q_how_many_days:
    title: Daniel pyta, jak długo
    gloss: 'Daniel pyta: Przez ile dni mam go przyjmować?'
    note: To samo pytanie co w lekcji 2.
  en.a2.unit35.lesson04.teach.a_five_days_no_stopping:
    title: Odpowiedź farmaceuty
    gloss: 'Farmaceuta: Przez pięć dni. Proszę nie przerywać przyjmowania tabletek zbyt wcześnie.'
    note: To samo zalecenie co na etykiecie w lekcji 3.
  en.a2.unit35.lesson04.teach.q_any_side_effects:
    title: Daniel pyta o skutki uboczne
    gloss: 'Daniel pyta: Czy są jakieś skutki uboczne?'
    note: To samo pytanie co w lekcji 2.
  en.a2.unit35.lesson04.teach.a_you_may_feel_tired:
    title: Farmaceuta wymienia skutek uboczny
    gloss: 'Farmaceuta: Może Pan poczuć zmęczenie, ale to wszystko.'
    note: '*but that''s all* znaczy tu: „ale to wszystko”.'
  en.a2.unit35.lesson04.teach.q_thank_you:
    title: Daniel dziękuje farmaceucie
    gloss: 'Daniel: Bardzo dziękuję.'
    note: '*very much* nadaje podziękowaniu większą wagę.'
