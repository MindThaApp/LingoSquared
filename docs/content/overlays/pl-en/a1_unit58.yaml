    note: '*guide* oznacza przewodnika – osobę, która oprowadza zwiedzających i wszystko tłumaczy.'
    example_gloss: Czy dziś jest przewodnik?
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_open:
    title: What time does the museum open?
    gloss: O której otwiera się muzeum?
    note: To pytanie zaczyna się od *what time*, a po nim stoi pomocnicze *does*, bo czasownik główny to *open*.
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_close:
    title: What time does the museum close?
    gloss: O której zamyka się muzeum?
    note: Ta sama budowa pytania co w *What time does the museum open?*, tylko z *close* zamiast *open*.
  en.a1.unit58.lesson02.teach.two_tickets_please:
    title: Two tickets, please.
    gloss: Poproszę dwa bilety.
    note: '*please* na końcu sprawia, że prośba jest grzeczna – tak samo jak przy zamawianiu jedzenia.'
  en.a1.unit58.lesson02.teach.is_there_a_guide_for_the_exhibition:
    title: Is there a guide for the exhibition?
    gloss: Czy jest przewodnik po wystawie?
    note: '*Is there...?* służy do pytania, czy coś jest na miejscu – tutaj przewodnik.'
  en.a1.unit58.lesson02.teach.the_museum_is_open_every_day:
    title: The museum is open every day.
    gloss: Muzeum jest otwarte codziennie.
    note: '*every day* oznacza codziennie i stoi na końcu zdania.'
  en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings:
    title: I really enjoyed the paintings!
    gloss: Obrazy bardzo mi się podobały!
    note: '*enjoyed* to czas przeszły od *enjoy* (cieszyć się czymś, dobrze się bawić); używamy go, gdy wspominamy coś przyjemnego.'
  en.a1.unit58.lesson03.teach.dialogue_line1:
    title: Pytanie Daniela
    gloss: 'Daniel mówi: Cześć! O której zamyka się muzeum?'
    note: '*Hi!* to nieformalne powitanie.'
  en.a1.unit58.lesson03.teach.dialogue_line2:
    title: Odpowiedź pracownika
    gloss: 'Pracownik mówi: Zamykamy o piątej.'
    note: '*at* + godzina wskazuje, kiedy coś się dzieje, jak w *at five o''clock*.'
  en.a1.unit58.lesson03.teach.dialogue_line3:
    title: Prośba Mii
    gloss: 'Mia mówi: Świetnie. Czy możemy prosić dwa bilety?'
    note: '*Can we have...?* to grzeczny sposób zamawiania czegoś lub proszenia o coś.'
  en.a1.unit58.lesson03.teach.dialogue_line4:
    title: Cena
    gloss: 'Pracownik mówi: Oczywiście. To dwanaście dolarów.'
    note: '*That''s* + kwota służy do podania ceny.'
  en.a1.unit58.lesson03.teach.dialogue_line5:
    title: Pytanie Daniela o przewodnika
    gloss: 'Daniel pyta: Czy jest przewodnik po wystawie?'
    note: Ta sama budowa *Is there...?* co wcześniej w lekcji 2.
  en.a1.unit58.lesson03.teach.dialogue_line6:
    title: Pracownik o przewodniku
    gloss: 'Pracownik mówi: Tak, przewodnik jest przy wejściu.'
    note: '*there''s* to skrócona forma od *there is*.'
  en.a1.unit58.lesson03.teach.dialogue_line7:
    title: Mia pyta o nazwę
    gloss: 'Mia pyta: Jak nazywa się ta wystawa?'
    note: '*What is ... called?* to zwykły sposób pytania o nazwę czegoś.'
  en.a1.unit58.lesson03.teach.dialogue_line8:
    title: Nazwa wystawy
    gloss: 'Pracownik mówi: Nazywa się Colors of the City.'
    note: '*It''s called...* to odpowiedź na pytanie *What is ... called?*.'
  en.a1.unit58.lesson03.teach.dialogue_line9:
    title: Zakończenie Daniela
    gloss: 'Daniel mówi: Dziękuję! Nie mogę się doczekać, żeby zobaczyć te obrazy.'
    note: '*can''t wait to...* oznacza, że bardzo chcesz coś zrobić.'
  en.a1.unit58.lesson04.teach.museum_notice:
    title: Tablica muzeum
    gloss: 'Muzeum Miejskie: otwarte codziennie, od 9:00 do 17:00. Bilet dla dorosłych: 6 dolarów. Aktualna wystawa: Colors of the City, sala 2.'
    note: Tablica podaje godziny otwarcia, cenę i nazwę wystawy.
  en.a1.unit58.lesson04.teach.reading_passage:
    title: Tekst o Danielu i Mii
    gloss: 'Wizyta w muzeum: W sobotę po południu Daniel i Mia postanowili razem odwiedzić Muzeum Miejskie. Przy wejściu pracownik powiedział im, że muzeum zamyka się o piątej. Kupili dwa bilety za dwanaście dolarów. Daniel zapytał o przewodnika, a pracownik odpowiedział, że jeden jest przy wejściu. Zwiedzili wystawę Colors of the City i zobaczyli wiele pięknych obrazów w sali 2. Danielowi podobał się obraz przedstawiający rynek starego miasta, a Mii obraz rzeki o zachodzie słońca. Kiedy wychodzili, Mia powiedziała, że następnym razem chce obejrzeć wystawę rzeźb.'
    note: '*decided to visit* – po *decided* używamy *to* + bezokolicznik, by powiedzieć, co ktoś postanowił zrobić.'
