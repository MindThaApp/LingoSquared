teaching:
  en.a1.unit34.lesson01.teach.soccer:
    title: soccer
    gloss: piłka nożna
    note: '*soccer* znaczy piłka nożna. Czasownik, który się z nim łączy, to *play*: *play soccer*. Po polsku mówimy „grać w piłkę nożną”, ale angielski dobiera czasownik do rodzaju sportu: *play*, *go* albo *do*. Przy każdej nazwie sportu trzeba zapamiętać, który z nich pasuje.'
    example_gloss: Gramy w piłkę nożną w soboty.
  en.a1.unit34.lesson01.teach.tennis:
    title: tennis
    gloss: tenis
    note: '*tennis* znaczy tenis. Tak jak przy *soccer*, używasz tu *play*: *play tennis*. Po polsku też „gramy w tenisa”, a po angielsku nazwa sportu zawsze idzie z *play*.'
    example_gloss: Ona gra w tenisa co weekend.
  en.a1.unit34.lesson01.teach.basketball:
    title: basketball
    gloss: koszykówka
    note: '*basketball* znaczy koszykówka. Tu również używasz *play*: *play basketball*, tak jak przy *soccer* i *tennis*. Przy sportach z piłką angielski używa zawsze *play* + nazwa sportu.'
    example_gloss: Grają w koszykówkę w parku.
  en.a1.unit34.lesson01.teach.swimming:
    title: swimming
    gloss: pływanie
    note: '*swimming* znaczy pływanie. Tutaj czasownik się zmienia: *go swimming* (a nie *play swimming*). Angielski używa *go* + forma z *-ing* przy takich aktywnościach jak pływanie czy bieganie. Po polsku wystarczy jeden czasownik („pływać”), a po angielsku trzeba dodać *go*.'
    example_gloss: Chodzę pływać dwa razy w tygodniu.
  en.a1.unit34.lesson01.teach.yoga:
    title: yoga
    gloss: joga
    note: '*yoga* znaczy joga. Czasownik to *do*: *do yoga*. Angielski używa *do* przy aktywnościach wykonywanych indywidualnie, takich jak joga, a nie *play* ani *go*. Pamiętaj więc, że są trzy czasowniki (*play*, *go*, *do*) i każdy pasuje do innego rodzaju sportu.'
    example_gloss: Rano ćwiczy jogę.
  en.a1.unit34.lesson01.teach.exercise:
    title: exercise
    gloss: ćwiczyć / uprawiać sport
    note: '*exercise* znaczy ćwiczyć, uprawiać sport: to ogólne słowo na aktywność fizyczną. W odróżnieniu od *soccer*, *swimming* i *yoga* możesz użyć *exercise* samodzielnie jako czasownika, bez *play*, *go* i *do*: *Do you exercise every day?*'
    example_gloss: Ćwiczysz codziennie?
  en.a1.unit34.lesson02.teach.twice_a_week:
    title: twice a week
    gloss: dwa razy w tygodniu
    note: '*twice a week* znaczy dwa razy w tygodniu. Słowo *a* nie znaczy tu „jeden”, tylko „na” lub „w”: liczba + *a* + jednostka czasu pokazuje, jak często coś się zdarza w danym okresie. Po polsku używamy w tym celu przyimka „w” (dwa razy w tygodniu).'
    example_gloss: Gra w tenisa dwa razy w tygodniu.
  en.a1.unit34.lesson02.teach.three_times_a_week:
    title: three times a week
    gloss: trzy razy w tygodniu
    note: '*three times a week* znaczy trzy razy w tygodniu. Tak jak przy *twice a week*, *a* nie znaczy tu „jeden”: *times* (razy) plus *a week* (w tygodniu) pokazuje, jak często w tygodniu.'
    example_gloss: Ona pływa trzy razy w tygodniu.
  en.a1.unit34.lesson02.teach.on_weekends:
    title: on weekends
    gloss: w weekendy
    note: '*on weekends* znaczy w weekendy. Angielski używa *on* przy dniach i weekendach, a polski przyimka „w” (w weekend, w sobotę).'
    example_gloss: Gramy w koszykówkę w weekendy.
  en.a1.unit34.lesson02.teach.gym:
    title: gym
    gloss: siłownia
    note: gym znaczy siłownia, miejsce ze sprzętem i zajęciami do ćwiczeń.
    example_gloss: Ćwiczy jogę na siłowni.
  en.a1.unit34.lesson02.teach.pool:
    title: pool
    gloss: basen
    note: pool znaczy basen, miejsce pełne wody do pływania.
    example_gloss: Pływam na basenie.
  en.a1.unit34.lesson02.teach.how_often_question:
    title: How often do you exercise?
    gloss: Jak często ćwiczysz?
    note: 'To pytanie zaczyna się od *how often* (jak często). Potem pojawia się czasownik pomocniczy *do*, bo czasownikiem głównym jest *exercise*: to ta sama konstrukcja z *do* co w innych angielskich pytaniach.'
  en.a1.unit34.lesson03.teach.dialogue_line1:
    title: Pytanie Daniela
    gloss: 'Daniel pyta: Chcesz zagrać z nami w piłkę nożną w sobotę?'
    note: Początek rozmowy z zaproszeniem do gry w piłkę nożną. Przy *soccer* używasz *play*.
  en.a1.unit34.lesson03.teach.dialogue_line2:
    title: "Odpowiedź: Leila"
    gloss: 'Leila mówi: Nie przepadam za piłką nożną. Wolę pływać.'
    note: '*don''t really like* znaczy „nie przepadam za”: łagodniejszy sposób, żeby odmówić.'
  en.a1.unit34.lesson03.teach.dialogue_line3:
    title: "Odpowiedź: Daniel"
    gloss: 'Daniel mówi: Nie ma sprawy! Jak często chodzisz pływać?'
    note: '*go swimming*: przy pływaniu używasz *go*, a nie *play* ani *do*.'
  en.a1.unit34.lesson03.teach.dialogue_line4:
    title: "Odpowiedź: Leila"
    gloss: 'Leila mówi: Dwa razy w tygodniu, zwykle na basenie blisko mojego domu.'
    note: '*Twice a week*: tutaj też *a* znaczy „w” (w tygodniu).'
  en.a1.unit34.lesson03.teach.dialogue_line5:
    title: "Odpowiedź: Daniel"
    gloss: 'Daniel mówi: Fajnie! Ja też czasem ćwiczę jogę, ale bieganie to nadal moja ulubiona aktywność.'
    note: '*do yoga*: przy jodze używasz *do*, a nie *play* ani *go*.'
  en.a1.unit34.lesson04.teach.reading_passage:
    title: Tekst o Danielu, Leili i Mii
    gloss: Daniel, Leila i Mia na swój sposób dbają o aktywność fizyczną. Daniel codziennie rano przed pracą chodzi biegać. Leila woli pływać; chodzi na basen dwa razy w tygodniu. Mia jest nowa w zespole, ale już co niedzielę gra w tenisa z sąsiadką. W soboty czasem wspólnie grają w piłkę nożną w parku, ale piłka nożna nie jest niczyim ulubionym sportem.
    note: 'W tekście pojawiają się wszystkie trzy czasowniki: *goes running* (*go*), *plays tennis* i *play soccer* (*play*). Każdy sport ma swój czasownik.'
