  en.a1.unit65.lesson04.teach.reading_passage:
    title: 'Tekst: Wymiana w sklepie'
    gloss: 'Wymiana w sklepie: Daniel kupił niebieską koszulę, ale rozmiar był za mały. Wrócił do sklepu z paragonem. Pracownik poprosił o paragon i zaproponował większy rozmiar. Daniel wymienił koszulę. Nie potrzebował zwrotu pieniędzy, bo większa niebieska koszula była dobra.'
    note: '*exchanged* to czas przeszły od *exchange*.'
