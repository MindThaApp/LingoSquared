course:
  title: Angielski B1
  description: 'Nauka angielskiego na poziomie B1: obowiązki, możliwości, sytuacje hipotetyczne i opowiadanie o codziennych zdarzeniach, z obszernymi wyjaśnieniami po polsku.'
units:
  en.b1.unit01.necessity:
    title: Rzeczy, które muszę lub powinienem zrobić
lessons:
  en.b1.unit01.lesson01.necessity_vocabulary:
    title: Must, have to i should
  en.b1.unit01.lesson02.saying_what_you_must_do:
    title: I must, I have to, she has to
  en.b1.unit01.lesson03.past_regret_and_prohibition:
    title: Should have, must not, don't have to
  en.b1.unit01.lesson04.the_gym_membership_dialogue:
    title: You must not forget again
teaching:
  en.b1.unit01.lesson01.teach.must:
    title: must
    gloss: musieć (silny, osobisty obowiązek)
    note: '*must* wyraża silny, osobisty obowiązek – coś, co sam uważasz za bardzo ważne.'
    example_gloss: Muszę dziś skończyć to zadanie.
  en.b1.unit01.lesson01.teach.have_to:
    title: have to
    gloss: musieć (obowiązek z zewnątrz)
    note: '*have to* wyraża obowiązek pochodzący z zewnątrz, na przykład z przepisu lub terminu.'
    example_gloss: Muszę zapłacić czynsz do piątku.
  en.b1.unit01.lesson01.teach.should:
    title: should
    gloss: powinien / powinieneś
    note: '*should* to zalecenie, a nie ścisły obowiązek.'
    example_gloss: Powinieneś niedługo zadzwonić do dentysty.
  en.b1.unit01.lesson01.teach.task:
    title: task
    gloss: zadanie
    note: '*task* oznacza zadanie lub pracę, którą trzeba wykonać.'
    example_gloss: Mam jeszcze jedno zadanie do zrobienia.
  en.b1.unit01.lesson01.teach.rent:
    title: rent
    gloss: czynsz
    note: '*rent* to pieniądze, które płacisz za mieszkanie.'
    example_gloss: Czynsz trzeba zapłacić w piątek.
  en.b1.unit01.lesson01.teach.appointment:
    title: appointment
    gloss: wizyta (umówiony termin)
    note: '*appointment* oznacza ustalony termin spotkania z kimś, na przykład u lekarza.'
    example_gloss: W tym tygodniu mam wizytę u dentysty.
  en.b1.unit01.lesson02.teach.must_finish_task:
    title: Wyrażanie silnego obowiązku
    gloss: Muszę dziś skończyć to zadanie.
    note: '*I must* wyraża silny, osobisty obowiązek.'
  en.b1.unit01.lesson02.teach.have_to_pay_rent:
    title: Wyrażanie obowiązku narzuconego z zewnątrz
    gloss: Muszę zapłacić czynsz do piątku.
    note: '*I have to* wyraża obowiązek pochodzący z zewnątrz, na przykład termin płatności.'
  en.b1.unit01.lesson02.teach.she_has_to_make:
    title: Forma przy 'she'
    gloss: Ona musi umówić się na wizytę.
    note: Przy *he/she/it* forma *have to* zmienia się w *has to*.
  en.b1.unit01.lesson02.teach.you_should_call:
    title: Udzielanie rekomendacji
    gloss: Powinieneś zadzwonić i potwierdzić wizytę.
    note: '*should* to zalecenie, a nie ścisły obowiązek jak *must* czy *have to*.'
  en.b1.unit01.lesson02.teach.grammar_agreement:
    title: Formy 'have to'
    gloss: Muszę iść. Ona musi iść. Musimy iść. Oni muszą iść.
    note: Tylko przy *he/she/it* *have* zmienia się w *has*; przy wszystkich pozostałych osobach zostaje *have to*.
  en.b1.unit01.lesson03.teach.should_have_called:
    title: Wyrażanie żalu z powodu przeszłości
    gloss: Trzeba było zadzwonić wcześniej.
    note: '*should have* + imiesłów wyraża żal z powodu czegoś, czego się nie zrobiło.'
    example_gloss: Trzeba było zadzwonić wcześniej.
  en.b1.unit01.lesson03.teach.must_not:
    title: must not
    gloss: nie wolno
    note: '*must not* oznacza zakaz – coś jest absolutnie niedozwolone. Uwaga: *must not* nie znaczy „nie musisz”, tylko „nie wolno”; „nie musisz” to *don''t have to*.'
    example_gloss: Nie wolno ci znowu zapomnieć.
  en.b1.unit01.lesson03.teach.dont_have_to:
    title: don't have to
    gloss: nie musi / nie trzeba
    note: '*don''t have to* oznacza, że coś nie jest obowiązkowe; to coś innego niż *must not* (zakaz).'
    example_gloss: Nie musisz przychodzić, jeśli jesteś zajęty.
  en.b1.unit01.lesson03.teach.grammar_past_regret:
    title: Żal, zakaz i brak obowiązku
    gloss: Trzeba było zadzwonić. Zapomniałem. Nie wolno ci znowu zapomnieć. Nie musisz przychodzić.
    note: '*should have* + imiesłów wyraża żal z powodu przeszłości. *must not* to zakaz; *don''t have to* oznacza brak obowiązku, ale to, że wolno.'
  en.b1.unit01.lesson03.teach.reading_passage:
    title: 'Tekst: siłownia'
    gloss: Wczoraj Daniel zapomniał przedłużyć karnet na siłownię. Powinien był ustawić sobie przypomnienie w telefonie. Teraz musi zapłacić opłatę za zwłokę. W przyszłym miesiącu nie może o tym znowu zapomnieć.
    note: Krótki tekst o błędzie Daniela i jego konsekwencjach.
  en.b1.unit01.lesson04.teach.q_renew_gym:
    title: Leila pyta o członkostwo
    gloss: 'Leila mówi: Daniel, przedłużyłeś karnet na siłownię?'
    note: Bezpośrednie pytanie, żeby sprawdzić, czy coś zostało już załatwione.
  en.b1.unit01.lesson04.teach.a_forgot_should_have:
    title: 'Odpowiedź Daniela: zapomniałem'
    gloss: 'Daniel mówi: O nie, zapomniałem! Powinienem był to zrobić w zeszłym tygodniu.'
    note: '*I should have done that* wyraża żal z powodu czegoś, czego nie zrobiono.'
  en.b1.unit01.lesson04.teach.q_call_today:
    title: Leila ostrzega Daniela
    gloss: 'Leila mówi: Musisz do nich dziś zadzwonić, bo inaczej zapłacisz opłatę za zwłokę.'
    note: '*must* oznacza tu pilne, osobiste ostrzeżenie.'
  en.b1.unit01.lesson04.teach.a_also_pay_rent:
    title: Daniel wymienia kolejne obowiązki
    gloss: 'Daniel mówi: Masz rację. Muszę też zapłacić czynsz do piątku i powinienem też zadzwonić do dentysty.'
    note: Daniel łączy w jednej odpowiedzi *have to* (obowiązek) i *should* (zalecenie).
  en.b1.unit01.lesson04.teach.q_dont_have_to:
    title: Leila uspokaja Daniela
    gloss: 'Leila mówi: Nie musisz robić wszystkiego dzisiaj. Ale nie wolno ci znowu zapomnieć o siłowni.'
    note: Leila zestawia *don't have to* (brak obowiązku) z *must not* (zakaz).
  en.b1.unit01.lesson04.teach.a_more_organized:
    title: Daniel robi postanowienie
    gloss: 'Daniel mówi: Wiem. W tym miesiącu muszę lepiej się zorganizować.'
    note: '*I must be* wyraża tu osobiste postanowienie.'
