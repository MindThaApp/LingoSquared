    title: Zaproszenie Mii
    gloss: 'Mia pyta: Dziś wieczorem robię makaron. Pomożesz mi gotować?'
    note: '*Do you want to help me* + czasownik*?* to naturalny sposób zaproszenia kogoś do pomocy.'
  en.a1.unit41.lesson03.teach.dialogue_line2:
    title: Odpowiedź Daniela
    gloss: 'Daniel mówi: Jasne! Tylko że nie jestem zbyt dobrym kucharzem.'
    note: '*though* na końcu zdania wprowadza lekkie przeciwstawienie, mniej więcej jak polskie „jednak” lub „tylko że”.'
  en.a1.unit41.lesson03.teach.dialogue_line3:
    title: Zachęta Mii
    gloss: 'Mia mówi: Nic nie szkodzi, pokażę ci. Możesz posiekać tę cebulę?'
    note: '*I''ll show you* znaczy: pokażę ci.'
  en.a1.unit41.lesson03.teach.dialogue_line4:
    title: Pytanie Daniela
    gloss: 'Daniel mówi: Jasne. Jak drobno mam ją posiekać?'
    note: '*should* służy tu do pytania o radę.'
  en.a1.unit41.lesson03.teach.dialogue_line5:
    title: Wyjaśnienie Mii
    gloss: 'Mia mówi: Na małe kawałki, tak jak tu. A teraz ugotujmy makaron.'
    note: '*like this* znaczy: tak, w ten sposób.'
  en.a1.unit41.lesson03.teach.dialogue_line6:
    title: Odpowiedź Daniela
    gloss: 'Daniel mówi: Mogę spróbować sosu? Pyszny!'
    note: '*Can I* + czasownik*?* to prośba o pozwolenie.'
  en.a1.unit41.lesson03.teach.dialogue_line7:
    title: Podsumowanie Mii
    gloss: 'Mia mówi: Świetnie! Kolacja jest prawie gotowa.'
    note: '*almost ready* znaczy prawie gotowy.'
  en.a1.unit41.lesson04.teach.reading_passage:
    title: Tekst o wspólnym gotowaniu
    gloss: Daniel, Leila i Mia gotują na różnym poziomie. Odkąd Leila przeprowadziła się do nowego mieszkania blisko Mii, troje przyjaciół często razem gotuje kolację. Leila jest dobrą kucharką. Często robi makaron według starego przepisu swojej mamy. Mia też uwielbia gotować i nauczyła Daniela kroić cebulę tak, żeby nie skaleczyć sobie palców. Daniel nie jest jeszcze świetnym kucharzem, ale szybko się uczy. Wczoraj wieczorem Mia poprosiła Daniela o pomoc w robieniu makaronu. Posiekał cebulę, a Mia ugotowała makaron i zrobiła sos. Daniel spróbował sosu i powiedział, że jest pyszny. Leila przyszła akurat wtedy, gdy kolacja była gotowa, i cała trójka zjadła razem w kuchni Mii.
    note: '*arrived just as dinner was ready* znaczy: przyszła akurat wtedy, gdy kolacja była gotowa.'
