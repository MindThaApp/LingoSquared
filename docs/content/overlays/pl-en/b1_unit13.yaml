    title: who
    gloss: który, która (o osobach)
    note: '*who* odnosi się w zdaniu względnym do osoby.'
    example_gloss: Daniel, który dołączył do zespołu w marcu, prowadzi już dwa projekty.
  en.b1.unit13.lesson01.teach.which:
