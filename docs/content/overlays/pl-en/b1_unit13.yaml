  en.b1.unit13.lesson01.teach.where:
    title: where
    gloss: gdzie, w którym
    note: '*where* odnosi się w zdaniu względnym do miejsca.'
    example_gloss: Biuro, w którym pracuje Daniel, jest w centrum miasta.
  en.b1.unit13.lesson01.teach.coworker:
    title: coworker
    gloss: współpracownik, współpracowniczka
    note: '*coworker* to osoba, z którą się współpracuje.'
    example_gloss: Mia ma koleżankę z pracy, która wieczorami uczy się hiszpańskiego.
  en.b1.unit13.lesson02.teach.colleague_organized:
    title: who w zdaniu względnym wyodrębniającym
    gloss: Koleżanka, która siedzi obok Mii, jest bardzo zorganizowana.
    note: '*who* wprowadza tu informację potrzebną, by wiedzieć, o kogo chodzi.'
  en.b1.unit13.lesson02.teach.daniel_leads_projects:
    title: who w zdaniu względnym niewyodrębniającym
    gloss: Daniel, który dołączył do zespołu w marcu, prowadzi już dwa projekty.
    note: Przecinki pokazują, że zdanie względne dodaje informację dodatkową, a nie taką, która jest potrzebna do zidentyfikowania osoby.
  en.b1.unit13.lesson02.teach.grammar_defining:
    title: Zdania względne wyodrębniające i niewyodrębniające
    gloss: 'Używaj zdania względnego określającego, bez przecinków, żeby dokładnie powiedzieć, o którą osobę lub rzecz chodzi: The colleague who sits next to Mia is organized. Używaj zdania względnego nieokreślającego, z przecinkami, żeby dodać informację o kimś, kto jest już znany: Daniel, who joined in March, already leads two projects. Uwaga: po polsku zdanie względne zawsze oddziela się przecinkami, a w angielskim tylko to nieokreślające.'
    note: 'Schemat: określające = bez przecinków, mówi, kto lub co jest na myśli; nieokreślające = przecinki, dodaje informację.'
  en.b1.unit13.lesson03.teach.deadline:
    title: deadline
    gloss: ostateczny termin
    note: '*deadline* to data lub godzina, do której coś musi być gotowe.'
    example_gloss: Koleżanka, która siedzi obok Mii, zawsze dotrzymuje terminów.
  en.b1.unit13.lesson03.teach.approve:
    title: approve
    gloss: zatwierdzić
    note: '*approve* oznacza oficjalnie coś zaakceptować.'
    example_gloss: Klient zatwierdził już pierwszą koncepcję.
  en.b1.unit13.lesson03.teach.reading_passage:
    title: 'Tekst: nowe biuro'
    gloss: Mia pracuje z kilkoma osobami, które ułatwiają jej pracę. Daniel, który dołączył do zespołu w marcu, prowadzi już dwa projekty. Koleżanka, która siedzi obok Mii, jest bardzo zorganizowana i zawsze dotrzymuje terminów. Ich biuro, które znajduje się na piątym piętrze, ma małą kuchnię, w której wszyscy razem jedzą lunch. Klient, którego projekt właśnie kończą, zatwierdził już pierwszą koncepcję.
    note: Krótki tekst do czytania ze zdaniami względnymi określającymi i nieokreślającymi.
  en.b1.unit13.lesson04.teach.q_met_the_woman:
    title: Mia przedstawia nową koleżankę
    gloss: 'Mia mówi: Leila, poznałaś już kobietę, która właśnie dołączyła do naszego zespołu?'
    note: '*who* odnosi się tu do *the woman*.'
  en.b1.unit13.lesson04.teach.a_whose_desk:
    title: Leila pyta o miejsce nowej koleżanki
    gloss: 'Leila mówi: Jeszcze nie. Czy to ta osoba, której biurko stoi przy oknie?'
    note: '*whose* wskazuje przynależność: *whose desk*.'
  en.b1.unit13.lesson04.teach.q_the_designer_who:
    title: Mia opisuje nową koleżankę
    gloss: 'Mia mówi: Tak, to ona. To projektantka, która skończyła projekt logo.'
    note: '*who* odnosi się do *the designer*.'
  en.b1.unit13.lesson04.teach.a_which_won_award:
    title: Leila wspomina projekt
    gloss: 'Leila mówi: Ach tak, pamiętam. Czy to ten projekt, który w zeszłym miesiącu wygrał nagrodę?'
    note: '*which* odnosi się do *the project*.'
  en.b1.unit13.lesson04.teach.q_office_smaller:
    title: Mia opowiada o swoim dawnym biurze
    gloss: 'Mia mówi: Dokładnie. Biuro, w którym kiedyś pracowała, było dużo mniejsze od naszego.'
    note: '*where* odnosi się do miejsca: *the office*.'
  en.b1.unit13.lesson04.teach.a_kitchen_where:
    title: Leila rozumie, dlaczego lubi kuchnię
    gloss: 'Leila mówi: To wyjaśnia, dlaczego tak lubi kuchnię, w której wszyscy razem jedzą lunch.'
    note: '*where* odnosi się do *the kitchen*.'
