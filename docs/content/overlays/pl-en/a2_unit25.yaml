teaching:
  en.a2.unit25.lesson01.teach.appointment:
    title: appointment
    gloss: termin, wizyta (umówiona)
    note: '*appointment* oznacza umówiony termin, na przykład w urzędzie.'
    example_gloss: W piątek mam wizytę w DMV (urzędzie ds. pojazdów i praw jazdy).
  en.a2.unit25.lesson01.teach.document:
    title: document
    gloss: dokument
    note: '*document* oznacza dokument urzędowy lub pismo.'
    example_gloss: Proszę przynieść jeden dokument potwierdzający miejsce zamieszkania.
  en.a2.unit25.lesson01.teach.proof_of_residency:
    title: proof of residency
    gloss: potwierdzenie zamieszkania
    note: '*proof of residency* oznacza dokument, który pokazuje, gdzie mieszkasz.'
    example_gloss: Rachunek za prąd może posłużyć jako potwierdzenie zamieszkania.
  en.a2.unit25.lesson01.teach.form:
    title: form
    gloss: formularz
    note: '*form* oznacza formularz, który się wypełnia.'
    example_gloss: Proszę wypełnić ten formularz przed wizytą.
  en.a2.unit25.lesson01.teach.confirmation_number:
    title: confirmation number
    gloss: numer potwierdzenia
    note: '*confirmation number* oznacza numer, który potwierdza Twój termin.'
    example_gloss: Pana numer potwierdzenia to 4471.
  en.a2.unit25.lesson02.teach.i_was_wondering_whether:
    title: I was wondering whether I could make an appointment.
    gloss: Chciałbym zapytać, czy mógłbym umówić się na wizytę.
    note: '*I was wondering whether...* to uprzejmy, formalny sposób zadawania pytania.'
  en.a2.unit25.lesson02.teach.would_it_be_possible:
    title: Would it be possible to come this Friday?
    gloss: Czy byłoby możliwe przyjść w ten piątek?
    note: '*Would it be possible...?* to bardzo uprzejma prośba.'
  en.a2.unit25.lesson02.teach.because_i_moved:
    title: I need to update my address because I moved last month.
    gloss: Muszę zmienić adres, ponieważ w zeszłym miesiącu się przeprowadziłem.
    note: '*because* wprowadza zdanie podrzędne, które podaje powód.'
  en.a2.unit25.lesson03.teach.photo_id:
    title: photo ID
    gloss: dokument ze zdjęciem
    note: '*photo ID* oznacza dokument tożsamości ze zdjęciem, na przykład dowód osobisty lub prawo jazdy.'
    example_gloss: Będzie Pan potrzebować dokumentu ze zdjęciem i potwierdzenia zamieszkania.
  en.a2.unit25.lesson03.teach.utility_bill:
    title: utility bill
    gloss: rachunek za media (prąd, gaz, wodę)
    note: '*utility bill* oznacza rachunek za prąd, gaz lub wodę.'
    example_gloss: Rachunek za prąd to częsty przykład potwierdzenia zamieszkania.
  en.a2.unit25.lesson03.teach.notice_text:
    title: Treść wskazówki
    gloss: Aby zmienić adres, prosimy przynieść dokument ze zdjęciem i jedno potwierdzenie zamieszkania, na przykład rachunek za media. Jeśli nie macie Państwo rachunku za media, można przynieść umowę najmu.
    note: 'To oficjalna informacja: mówi, co trzeba przynieść i co można przynieść zamiast tego.'
  en.a2.unit25.lesson03.teach.i_will_bring:
    title: I will bring a photo ID.
    gloss: Przyniosę dokument ze zdjęciem.
    note: '*will* służy do mówienia o tym, co się zrobi (czas przyszły).'
  en.a2.unit25.lesson04.teach.could_you_tell_me:
    title: Could you tell me what I need to bring?
    gloss: Czy może mi Pani powiedzieć, co powinienem przynieść?
    note: '*Could you tell me...?* to uprzejme pytanie pośrednie. Po *what* obowiązuje zwykły szyk zdania: *what I need to bring*.'
  en.a2.unit25.lesson04.teach.q_since_when:
    title: Pytanie, jak długo
    gloss: 'Urzędnik pyta: Jak długo mieszka Pan pod nowym adresem?'
    note: '*How long have you lived...?* pyta, jak długo coś trwa. Po angielsku używa się tu czasu Present Perfect (*have lived*), a nie zwykłego czasu teraźniejszego. Odpowiedź może zaczynać się od *since*: *Since last month.*'
  en.a2.unit25.lesson04.teach.a_since_last_month:
    title: Odpowiedź Daniela
    gloss: 'Daniel mówi: Od zeszłego miesiąca.'
    note: '*Since last month* znaczy „od zeszłego miesiąca”. Wystarczy tu krótka odpowiedź.'
  en.a2.unit25.lesson04.teach.q_would_it_be_possible:
    title: Pytanie o termin
    gloss: 'Daniel pyta: Czy byłoby możliwe przyjść w ten piątek?'
    note: To samo pytanie co w drugiej lekcji.
  en.a2.unit25.lesson04.teach.a_friday_works_confirmation:
    title: Odpowiedź urzędnika
    gloss: 'Urzędnik mówi: Tak, piątek o 10:00 pasuje. Pana numer potwierdzenia to 4471.'
    note: Urzędnik potwierdza godzinę i podaje numer potwierdzenia.
