course:
  title: Angielski B2
  description: 'Nauka angielskiego na poziomie B2: niuansowane rozmowy, argumenty, przypuszczenia i profesjonalna dyskusja, z wyjaśnieniami po polsku w swobodnym tonie.'
units:
  en.b2.unit01.argumentation:
    title: The evidence still supports it
lessons:
  en.b2.unit01.lesson01.argument_structure:
    title: Teza, dowody i obalanie zarzutów
  en.b2.unit01.lesson02.building_an_argument:
    title: I agree there are risks, but...
  en.b2.unit01.lesson03.reading_an_argument:
    title: 'Czytanie: obrona hybrydowego grafiku'
  en.b2.unit01.lesson04.the_argument_dialogue:
    title: The benefits outweigh the risks
teaching:
  en.b2.unit01.lesson01.teach.claim:
    title: claim
    gloss: teza, twierdzenie
    note: '*claim* to stanowisko, którego bronisz. W tym znaczeniu to nie jest skarga ani roszczenie odszkodowawcze.'
    example_gloss: Jej teza jest taka, że plan powinien być kontynuowany.
  en.b2.unit01.lesson01.teach.evidence:
    title: evidence
    gloss: dowody, argumenty na poparcie
    note: '*evidence* to fakty, liczby lub przykłady, którymi popierasz swoje stanowisko.'
    example_gloss: Ten przykład daje Mii dowody na poparcie jej tezy.
  en.b2.unit01.lesson01.teach.counterargument:
    title: counterargument
    gloss: kontrargument
    note: '*counterargument* to punkt, który przeczy twojemu stanowisku. W angielskim piszesz to jako jedno słowo.'
    example_gloss: Daniel przedstawia kontrargument.
  en.b2.unit01.lesson01.teach.rebut:
    title: rebut
    gloss: obalić (zarzut)
    note: '*rebut* oznacza, że odpowiadasz na kontrargument, nie rezygnując ze swojego stanowiska.'
    example_gloss: Mia obala obawy za pomocą dowodów.
  en.b2.unit01.lesson01.teach.concede:
    title: concede
    gloss: przyznać, uznać rację
    note: '*concede* oznacza, że uznajesz część cudzego punktu widzenia za rozsądną. To nie to samo, co porzucić całe swoje stanowisko.'
    example_gloss: Możesz uznać czyjeś obawy, nie rezygnując ze swojej głównej tezy.
  en.b2.unit01.lesson01.teach.outweigh:
    title: outweigh
    gloss: przeważać nad, mieć większą wagę niż
    note: '*outweigh* używasz, gdy korzyść, ryzyko lub powód jest ważniejszy niż coś innego.'
    example_gloss: Mocne dowody mogą przeważyć nad obawami.
  en.b2.unit01.lesson02.teach.position_with_evidence:
    title: Uznanie ryzyka i obrona stanowiska
    gloss: Zgadzam się, że plan niesie ryzyko, ale dowody nadal przemawiają za kontynuowaniem.
    note: '*I agree..., but...* najpierw uznaje cudzy punkt widzenia. Potem *but the evidence still supports...* pokazuje, że twoje stanowisko się nie zmienia.'
  en.b2.unit01.lesson02.teach.strongest_reason:
    title: Podanie najmocniejszego powodu
    gloss: Najmocniejszym powodem jest to, że wyniki ankiety były spójne.
    note: '*The strongest reason is that...* wprowadza twoje główne uzasadnienie. Zwróć uwagę na szyk po *that*: podmiot przed czasownikiem.'
  en.b2.unit01.lesson02.teach.fair_concern:
    title: Uznanie słusznej obawy
    gloss: To uzasadniona obawa; dane jednak wskazują w przeciwnym kierunku.
    note: '*That is a fair concern; however,...* brzmi profesjonalnie: uznajesz obawę, ale obalasz ją danymi.'
  en.b2.unit01.lesson02.teach.grammar_argument_shape:
    title: Obrona stanowiska
    gloss: Podaj swoją tezę, przedstaw dowody, uznaj najmocniejszy kontrargument i obal go. Zwroty takie jak That is a fair concern i However pozwalają brzmieć rozsądnie, bez rezygnowania z tezy.
    note: 'W angielskim zdaniu podrzędnym szyk pozostaje prosty: *the data points...*, a nie *the data in the other direction points*.'
  en.b2.unit01.lesson03.teach.retention:
    title: retention
    gloss: utrzymanie pracowników
    note: '*retention* oznacza tu, że pracownicy zostają w firmie zamiast odchodzić.'
    example_gloss: Lepsze utrzymanie pracowników oznacza, że mniej osób odchodzi z zespołu.
  en.b2.unit01.lesson03.teach.collaboration:
    title: collaboration
    gloss: współpraca
    note: '*collaboration* to wspólna praca nad zadaniem lub projektem. Słowo to nie ma tu negatywnego, historycznego zabarwienia, jakie bywa kojarzone z polskim słowem kolaboracja.'
    example_gloss: Dobra współpraca pomaga zespołowi skończyć pracę.
  en.b2.unit01.lesson03.teach.reading_passage:
    title: 'Tekst do czytania: obrona hybrydowego grafiku'
    gloss: 'Mia przekonuje, że firma powinna zachować hybrydowy grafik w następnym kwartale. Jej główna teza brzmi: praca hybrydowa poprawia utrzymanie pracowników bez obniżania wyników. Najmocniejszym dowodem jest ankieta wśród pracowników: osoby z zespołów hybrydowych rzadziej mówiły, że szukają innej pracy. Najmocniejszy kontrargument jest taki, że współpraca może na tym ucierpieć, gdy ludzie nie są w biurze codziennie. Mia przyznaje, że ta obawa jest zasadna, ale obala ją danymi z projektów: zespoły hybrydowe oddawały pracę na czas, a ich oceny były nieco wyższe. Dlatego dochodzi do wniosku, że korzyści przeważają nad ryzykiem.'
    note: 'Tekst buduje pełny argument: teza, dowody, kontrargument, obalenie i wniosek.'
  en.b2.unit01.lesson04.teach.q_keep_hybrid:
    title: Mia przedstawia swoje stanowisko
    gloss: 'Mia mówi: Myślę, że powinniśmy zachować hybrydowy grafik na następny kwartał.'
    note: Mia zaczyna od jasnego stanowiska, które można bronić.
  en.b2.unit01.lesson04.teach.a_strongest_reason:
    title: Daniel pyta o powód
    gloss: 'Daniel mówi: Jaki jest twój najmocniejszy powód?'
    note: Daniel nie pyta o opinię ogólnie, tylko o główne uzasadnienie.
  en.b2.unit01.lesson04.teach.q_retention_survey:
    title: Mia podaje dowody
    gloss: 'Mia mówi: Najmocniejszym powodem jest utrzymanie pracowników. W ankiecie wśród pracowników osoby pracujące hybrydowo rzadziej mówiły, że szukają innej pracy.'
    note: Mia opiera się na wynikach ankiety, a nie tylko na przeczuciu.
  en.b2.unit01.lesson04.teach.a_collaboration_weaker:
    title: Daniel przedstawia kontrargument
    gloss: 'Daniel mówi: Niektórzy menedżerowie twierdzą, że współpraca jest słabsza, gdy ludzie nie przychodzą do biura codziennie.'
    note: To kontrargument, na który Mia za chwilę odpowie.
  en.b2.unit01.lesson04.teach.q_data_rebuttal:
    title: Mia obala zarzut danymi
    gloss: 'Mia mówi: To uzasadniona obawa. Jednak dane z projektów jej nie potwierdzają. Zespoły hybrydowe oddawały pracę na czas, a ich oceny były nieco wyższe.'
    note: W *does not support it* pojawia się *does*, bo angielskie przeczenie w czasie teraźniejszym wymaga czasownika pomocniczego *do*.
  en.b2.unit01.lesson04.teach.a_benefits_outweigh:
    title: Daniel podsumowuje stanowisko
    gloss: 'Daniel mówi: Czyli twoje stanowisko jest takie, że korzyści przeważają nad ryzykiem?'
    note: '*outweigh* oddaje porównanie korzyści i ryzyka.'
  en.b2.unit01.lesson04.teach.q_improve_routines:
    title: Mia kończy propozycją rozwiązania
    gloss: 'Mia mówi: Dokładnie. Powinniśmy poprawić sposób prowadzenia spotkań, a nie rezygnować z grafiku.'
    note: Mia broni planu, ale proponuje też praktyczną poprawkę.
