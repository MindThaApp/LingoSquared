  en.a1.unit32.lesson01.teach.pet:
    title: pet
    gloss: zwierzę domowe
    note: '*pet* oznacza „zwierzę domowe”; *pets* to liczba mnoga. Zwróć uwagę na *any* w pytaniu *Do you have any pets?* W angielskim używasz *any* w pytaniach i przeczeniach z liczbą mnogą i rzeczownikami niepoliczalnych. Po polsku „Masz zwierzęta?” brzmi dobrze bez żadnego dodatku (najwyżej „jakieś”), ale po angielsku nie wolno pominąć *any*.'
    example_gloss: Masz zwierzęta?
  en.a1.unit32.lesson02.teach.name_is:
    title: Her name is Luna.
    gloss: Ma na imię Luna.
    note: W angielskim używasz *her*/*his* (oraz *she*/*he*) wobec zwierzęcia, gdy znasz jego płeć. W polskim rodzaj zależy od słowa (np. „kot” to „on”, nawet jeśli to kotka), a w angielskim decyduje rzeczywista płeć zwierzęcia. *Her name is Luna* mówi więc o samicy.
  en.a1.unit32.lesson02.teach.play:
    title: play
    gloss: bawić się
    note: '*play* oznacza „bawić się”.'
    example_gloss: Mój pies lubi się bawić.
  en.a1.unit32.lesson02.teach.walk:
    title: walk
    gloss: wyprowadzać na spacer
    note: '*walk* oznacza tutaj „wyprowadzać zwierzę na spacer”.'
    example_gloss: Codziennie wyprowadzam psa na spacer.
  en.a1.unit32.lesson02.teach.friendly:
    title: friendly
    gloss: przyjazny
    note: '*friendly* oznacza „przyjazny”.'
    example_gloss: Jej kot jest bardzo przyjazny.
  en.a1.unit32.lesson02.teach.small:
    title: small
    gloss: mały
    note: '*small* oznacza „mały”.'
    example_gloss: Ryba jest mała.
  en.a1.unit32.lesson03.teach.dialogue_line1:
    title: Pytanie Daniela
    gloss: 'Daniel pyta: Mia, masz zwierzęta?'
    note: W tym pytaniu *any* odpowiada co najwyżej polskiemu „jakieś”, które łatwo pominąć, ale w angielskim *any* pominąć nie wolno.
  en.a1.unit32.lesson03.teach.dialogue_line2:
    title: "Odpowiedź: Mia"
    gloss: 'Mia mówi: Tak, mam kota. Ma na imię Luna.'
    note: '*She* i *her* odnoszą się do kotki, bo znamy jej płeć (żeńską). Po angielsku liczy się rzeczywista płeć zwierzęcia, a nie rodzaj gramatyczny słowa jak w polskim.'
  en.a1.unit32.lesson03.teach.dialogue_line3:
    title: Kolejne pytanie Daniela
    gloss: 'Daniel mówi: Jak miło! Lubi się bawić?'
    note: '*Does* jest tu czasownikiem pomocniczym przy *she* (do-support). Po polsku nie potrzeba takiego słówka w pytaniu.'
  en.a1.unit32.lesson03.teach.dialogue_line4:
    title: "Odpowiedź: Mia"
    gloss: 'Mia mówi: Tak, uwielbia bawić się piłką. A ty?'
    note: '*What about you?* to krótki, naturalny sposób, by zadać rozmówcy to samo pytanie.'
  en.a1.unit32.lesson03.teach.dialogue_line5:
    title: "Odpowiedź: Daniel"
    gloss: 'Daniel mówi: Mam małą rybkę, ale chcę psa.'
    note: '*but* łączy tu dwie przeciwstawne myśli: Daniel ma już zwierzę, ale chce innego.'
  en.a1.unit32.lesson04.teach.reading_passage:
    title: Tekst o Leili i Danielu
    gloss: Leila ma psa o imieniu Max. Jest duży i bardzo przyjazny. Wyprowadza go codziennie rano. Daniel nie ma psa, ale ma małą rybkę. Rybki nie trzeba wyprowadzać, ale Daniel i tak lubi patrzeć, jak pływa.
    note: '*He* odnosi się do Maxa, bo to samiec. Także tu wybierasz *she* lub *he* według rzeczywistej płci zwierzęcia; *it* zostaje dla zwierząt, których płci nie znasz.'
