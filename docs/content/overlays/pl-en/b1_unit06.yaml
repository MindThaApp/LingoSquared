teaching:
  en.b1.unit06.lesson01.teach.while:
    title: while
    gloss: podczas gdy; w czasie, gdy
    note: '*while* oznacza, że coś dzieje się w tym samym czasie, co coś innego.'
    example_gloss: Podczas jazdy zaczęło padać.
  en.b1.unit06.lesson01.teach.flat_tire:
    title: flat tire
    gloss: złapana guma, przebita opona
    note: '*flat tire* to opona bez powietrza, która nie nadaje się już do jazdy.'
    example_gloss: Na autostradzie złapałem gumę.
  en.b1.unit06.lesson01.teach.pull_over:
    title: pull over
    gloss: zjechać na pobocze
    note: '*pull over* oznacza zatrzymać samochód przy krawędzi drogi.'
    example_gloss: Musiałem natychmiast zjechać na pobocze.
  en.b1.unit06.lesson01.teach.stranger:
    title: stranger
    gloss: nieznajomy, obcy
    note: '*stranger* to ktoś, kogo się nie zna.'
    example_gloss: Zatrzymał się nieznajomy, żeby mi pomóc.
  en.b1.unit06.lesson01.teach.mechanic:
    title: mechanic
    gloss: mechanik, mechanik samochodowy
    note: '*mechanic* to ktoś, kto naprawia samochody.'
    example_gloss: Mechanik szybko naprawił mi oponę.
  en.b1.unit06.lesson01.teach.said_that:
    title: said that
    gloss: powiedział, że
    note: '*said that* mówimy, gdy przytaczamy czyjeś słowa.'
    example_gloss: Powiedział, że może pomóc.
  en.b1.unit06.lesson02.teach.while_driving_tire_went_flat:
    title: Hintergrundgeschehen mit 'while'
    gloss: Jadąc do pracy, złapałem gumę.
    note: '*while* + czas przeszły z *was/were* + -ing opisuje tło wydarzeń, które coś innego przerywa.'
  en.b1.unit06.lesson02.teach.when_pulled_over_stranger_helped:
    title: Folgendes Ereignis mit 'when'
    gloss: Kiedy zjechałem na pobocze, zatrzymał się nieznajomy, żeby pomóc.
    note: '*when* wprowadza kolejne zdarzenie w opowieści.'
  en.b1.unit06.lesson02.teach.grammar_while_when_sequencing:
    title: '''while'' und ''when'' in einer Geschichte'
    gloss: Gdy jechałem, złapałem gumę. Kiedy zjechałem na pobocze, pomógł mi nieznajomy.
    note: '*while* wskazuje tło (czynność w toku); *when* wskazuje kolejne, krótsze zdarzenie, które się w tym tle wydarzyło.'
  en.b1.unit06.lesson03.teach.had_already_called:
    title: had already called
    gloss: już zadzwoniłem (wcześniej)
    note: '*had already* + imiesłów opisuje coś, co wydarzyło się wcześniej niż inny moment w przeszłości.'
    example_gloss: Kiedy przyjechał, już zadzwoniłem do Daniela.
  en.b1.unit06.lesson03.teach.kept_his_word:
    title: kept his word
    gloss: dotrzymał słowa
    note: '*kept his word* oznacza, że ktoś zrobił to, co obiecał.'
    example_gloss: Dotrzymał słowa i naprawił to w dziesięć minut.
  en.b1.unit06.lesson03.teach.reading_passage:
    title: 'Lesetext: die Geschichte vom Platten'
    gloss: Wczoraj rano, gdy Leila jechała do pracy, nagle złapała gumę. Zjechała na pobocze cichej ulicy. Nieznajomy zatrzymał samochód i zaproponował pomoc. Zanim przyjechał mechanik, Leila zdążyła już zadzwonić do Daniela, że się spóźni. Mechanik powiedział, że naprawi oponę w dziesięć minut. Dotrzymał słowa i Leila dotarła do pracy z dwudziestominutowym spóźnieniem.
    note: 'Opowieść w czasie przeszłym: tło wydarzeń (*while*), kolejność zdarzeń (*when*) i coś, co wydarzyło się wcześniej (*had already*).'
  en.b1.unit06.lesson04.teach.q_youre_late_what_happened:
    title: Daniel bemerkt, dass Leila zu spät ist
    gloss: 'Daniel mówi: Spóźniłaś się! Co się stało?'
    note: Bezpośrednie, zatroskane pytanie, od którego zaczyna się opowieść.
  en.b1.unit06.lesson04.teach.a_tire_went_flat_suddenly:
    title: Leila beginnt ihre Geschichte
    gloss: 'Leila mówi: Jadąc do pracy, nagle złapałam gumę.'
    note: '*while* wskazuje tło, na którym wydarzyło się coś innego.'
  en.b1.unit06.lesson04.teach.q_oh_no_what_did_you_do:
    title: Daniel fragt nach
    gloss: 'Daniel mówi: O nie! Co zrobiłaś?'
    note: Krótkie pytanie, które zachęca do dalszej opowieści.
  en.b1.unit06.lesson04.teach.a_pulled_over_stranger_helped:
    title: Leila erzählt weiter
    gloss: 'Leila mówi: Zjechałam na pobocze i zatrzymał się nieznajomy, żeby mi pomóc.'
    note: Kolejne zdarzenie w opowieści, po tle wydarzeń.
  en.b1.unit06.lesson04.teach.q_kind_of_him_call_mechanic:
    title: Daniel reagiert und fragt weiter
    gloss: 'Daniel mówi: Miło z jego strony. Dzwoniłaś po mechanika?'
    note: '*that was kind of him* to naturalna reakcja na czyjąś życzliwość.'
  en.b1.unit06.lesson04.teach.a_had_already_called_mechanic_said:
    title: Leila beendet die Geschichte
    gloss: 'Leila mówi: Tak, zadzwoniłam już po jednego, zanim nieznajomy przyjechał. Mechanik powiedział, że naprawi to w dziesięć minut, i naprawił!'
    note: '*had already called* pokazuje, co już się wydarzyło, zanim przyjechał nieznajomy.'
