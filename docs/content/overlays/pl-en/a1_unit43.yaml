  en.a1.unit43.lesson02.teach.dark_blue:
    title: dark blue
    gloss: ciemnoniebieski
    note: '*dark blue* pisze się po angielsku jako dwa osobne słowa, a nie łącznie, jak po polsku „ciemnoniebieski”.'
    example_gloss: Ma na sobie ciemnoniebieską koszulę.
  en.a1.unit43.lesson02.teach.light_green:
    title: light green
    gloss: jasnozielony
    note: '*light green* pisze się tak samo jak *dark blue*: jako dwa osobne słowa, a nie łącznie, jak po polsku „jasnozielony”.'
    example_gloss: Pomalowała swoją sypialnię na jasnozielono.
  en.a1.unit43.lesson02.teach.goes_well_with:
    title: goes well with
    gloss: pasuje do
    note: '*goes well with* znaczy, że dwa kolory lub elementy ubrania dobrze do siebie pasują.'
    example_gloss: Ta niebieska koszula pasuje do czarnych spodni.
  en.a1.unit43.lesson02.teach.too_bright:
    title: too bright
    gloss: zbyt jaskrawy
    note: '*too bright* znaczy zbyt jaskrawy, zbyt rzucający się w oczy.'
    example_gloss: Żółty to fajny kolor, ale jest zbyt jaskrawy do pracy.
  en.a1.unit43.lesson02.teach.whats_your_favorite_color:
    title: What's your favorite color?
    gloss: Jaki jest twój ulubiony kolor?
    note: '*What''s your favorite ...?* pyta o czyjąś preferencję.'
  en.a1.unit43.lesson02.teach.my_favorite_color_is:
    title: My favorite color is blue.
    gloss: Moim ulubionym kolorem jest niebieski.
    note: '*My favorite ... is ...* to stały sposób na powiedzenie, co lubisz najbardziej.'
  en.a1.unit43.lesson03.teach.dialogue_line1:
    title: Pytanie Daniela
    gloss: 'Daniel pyta: Potrzebuję nowej koszuli na naszą prezentację w przyszłym tygodniu. Pomożesz mi wybrać kolor?'
    note: '*Can you help me* + czasownik*?* to prośba o pomoc.'
  en.a1.unit43.lesson03.teach.dialogue_line2:
    title: Pytanie Mii
    gloss: 'Mia mówi: Jasne! Jakie kolory lubisz?'
    note: '*What colors do you like?* pyta o czyjeś ulubione kolory.'
  en.a1.unit43.lesson03.teach.dialogue_line3:
    title: "Odpowiedź: Daniel"
    gloss: 'Daniel mówi: Lubię niebieski i zielony, ale nie wiem, co wygląda profesjonalnie.'
    note: '*I''m not sure what looks professional* znaczy: nie wiem, co wygląda profesjonalnie.'
  en.a1.unit43.lesson03.teach.dialogue_line4:
    title: Rada Mii
    gloss: 'Mia mówi: Ciemnoniebieski to świetny wybór. Wygląda profesjonalnie i pasuje do czarnych spodni.'
    note: '*It looks professional* znaczy: wygląda profesjonalnie.'
  en.a1.unit43.lesson03.teach.dialogue_line5:
    title: Pytanie Daniela
    gloss: 'Daniel pyta: A co z tą żółtą?'
    note: '*What about ...?* służy do zaproponowania innej możliwości.'
  en.a1.unit43.lesson03.teach.dialogue_line6:
    title: Rada Mii
    gloss: 'Mia mówi: Żółty to fajny kolor, ale na prezentację jest zbyt jaskrawy. Wybrałabym ciemnoniebieską koszulę.'
    note: '*I''d choose* znaczy: wybrałbym / wybrałabym.'
  en.a1.unit43.lesson03.teach.dialogue_line7:
    title: Decyzja Daniela
    gloss: 'Daniel mówi: Dzięki, Mia. Niech będzie ciemnoniebieska!'
    note: '*Dark blue it is!* to nieformalny sposób potwierdzenia decyzji.'
  en.a1.unit43.lesson04.teach.reading_passage:
    title: Tekst o trzech ulubionych kolorach
    gloss: Daniel, Leila i Mia mają różne ulubione kolory. Ulubiony kolor Daniela to niebieski. Mówi, że to spokojny kolor i pasuje do prawie wszystkiego, co nosi do pracy. Ulubiony kolor Leili to zielony, kolor roślin i ogrodów, które uwielbia malować. Uważa, że jasnozielony jest wyjątkowo piękny. Ulubiony kolor Mii to żółty, bo kojarzy jej się ze słońcem i zawsze poprawia jej humor. Choć każde z nich lubi inny kolor, są zgodni, że kolory sprawiają, że każdy dzień jest przyjemniejszy.
    note: '*reminds her of the sun* znaczy: kojarzy jej się ze słońcem.'
