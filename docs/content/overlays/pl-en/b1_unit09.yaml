teaching:
  en.b1.unit09.lesson01.teach.said_that:
    title: said that
    gloss: powiedział(a), że
    note: '*said that* używamy, aby zrelacjonować, co powiedział ktoś inny.'
    example_gloss: Powiedziała, że jest bardzo zajęta.
  en.b1.unit09.lesson01.teach.told_me_that:
    title: told me that
    gloss: powiedział(a) mi, że
    note: '*told me that* używamy, gdy ktoś przekazał informację nam samym.'
    example_gloss: Powiedział mi, że spotkanie zostało odwołane.
  en.b1.unit09.lesson01.teach.asked_whether:
    title: asked whether
    gloss: zapytał(a), czy
    note: '*asked whether* przytacza pytanie typu tak/nie i brzmi nieco bardziej formalnie niż *asked if*.'
    example_gloss: Mia zapytała, czy potrzebujemy pomocy.
  en.b1.unit09.lesson01.teach.asked_if:
    title: asked if
    gloss: zapytał(a), czy
    note: '*asked if* przytacza pytanie typu tak/nie w mowie potocznej.'
    example_gloss: Mia zapytała, czy potrzebujemy pomocy.
  en.b1.unit09.lesson01.teach.message:
    title: message
    gloss: wiadomość
    note: '*message* oznacza krótką wiadomość, pisemną lub mówioną.'
    example_gloss: Leila wysłała wiadomość po obiedzie.
  en.b1.unit09.lesson01.teach.confirm:
    title: confirm
    gloss: potwierdzić
    note: '*confirm* oznacza powiedzieć, że coś jest pewne lub prawdziwe.'
    example_gloss: Potwierdź godzinę, zanim wyjdziesz.
  en.b1.unit09.lesson01.teach.available:
    title: available
    gloss: dostępny, mieć czas
    note: '*available* oznacza wolny albo mogący się spotkać.'
    example_gloss: Mia ma czas po obiedzie.
  en.b1.unit09.lesson02.teach.mia_available:
    title: Eine Aussage wiedergeben
    gloss: Mia powiedziała, że ma czas po obiedzie.
    note: 'W mowie zależnej *is* często zmienia się w *was*: *Mia said that she was available*. W polszczyźnie czas zwykle zostaje taki sam („Mia powiedziała, że ma czas”), a po angielsku czasownik cofa się do czasu przeszłego.'
  en.b1.unit09.lesson02.teach.leila_told_me:
    title: Informationen an Sie wiedergeben
    gloss: Leila powiedziała mi, że w biurze jest dużo pracy.
    note: '*told me that* używamy, gdy ktoś przekazał informację bezpośrednio nam.'
  en.b1.unit09.lesson02.teach.grammar_backshift:
    title: Direkte und indirekte Rede
    gloss: 'Mia mówi: „Mam czas”. Mia powiedziała, że ma czas.'
    note: 'Mowa niezależna: *I am available*. Mowa zależna: *Mia said that she was available*. W mowie zależnej pierwotna wypowiedź często cofa się o jeden czas.'
  en.b1.unit09.lesson03.teach.short_summary:
    title: short summary
    gloss: krótkie streszczenie
    note: '*short summary* oznacza krótką wersję zawierającą tylko najważniejsze punkty.'
    example_gloss: Na dzisiejsze spotkanie wystarczy krótkie streszczenie.
  en.b1.unit09.lesson03.teach.full_report:
    title: full report
    gloss: pełny raport
    note: '*full report* oznacza cały raport, a nie tylko skróconą wersję.'
    example_gloss: Mia zapytała, czy potrzebujemy pełnego raportu.
  en.b1.unit09.lesson03.teach.reading_passage:
    title: 'Lesetext: der Nachrichtenverlauf'
    gloss: Leila przeczytała wiadomość od Mii i zadzwoniła do Daniela. Powiedziała, że Mia ma czas po obiedzie. Powiedziała też, że Mia skończyła zestawienie liczb. Mia zapytała, czy zespół potrzebuje dziś pełnego raportu. Daniel powiedział Leili, że wystarczy krótkie streszczenie, ponieważ spotkanie potrwa tylko piętnaście minut.
    note: Krótki tekst do czytania o relacjonowaniu wypowiedzi i pytań.
  en.b1.unit09.lesson04.teach.q_mia_reply:
    title: Daniel fragt nach Mias Antwort
    gloss: 'Daniel mówi: Czy Mia odpowiedziała w sprawie przeglądu?'
    note: Pytanie typu tak/nie o wcześniejszą wiadomość.
  en.b1.unit09.lesson04.teach.a_she_said_available:
    title: Leila gibt Mias Aussage wieder
    gloss: 'Leila mówi: Tak, napisała, że ma czas po obiedzie.'
    note: '*she said that she was available* przytacza wypowiedź Mii.'
  en.b1.unit09.lesson04.teach.q_anything_else:
    title: Daniel fragt weiter
    gloss: 'Daniel mówi: Dobrze. Zapytała jeszcze o coś?'
    note: Pytanie dodatkowe, aby dowiedzieć się, czy w wiadomości było jeszcze jakieś pytanie.
  en.b1.unit09.lesson04.teach.a_asked_if_report:
    title: Leila gibt Mias Frage wieder
    gloss: 'Leila mówi: Zapytała, czy dziś potrzebujemy pełnego raportu.'
    note: '*asked if* zamienia bezpośrednie pytanie typu tak/nie w mowę zależną.'
  en.b1.unit09.lesson04.teach.q_what_tell_her:
    title: Daniel fragt nach Leilas Antwort
    gloss: 'Daniel mówi: Co jej odpowiedziałaś?'
    note: Pytanie o informację, którą przekazała Leila.
  en.b1.unit09.lesson04.teach.a_short_summary_enough:
    title: Leila gibt ihre Antwort wieder
    gloss: 'Leila mówi: Powiedziałam jej, że wystarczy krótkie streszczenie.'
    note: '*I told her that...* przytacza informacje, które przekazałeś komuś innemu.'
  en.b1.unit09.lesson04.teach.q_tell_team:
    title: Daniel beendet den Nachrichtenverlauf
    gloss: 'Daniel mówi: Świetnie. Powiem zespołowi, że możemy spotkać się o drugiej.'
    note: Daniel znów używa *tell ... that*, aby przekazać informacje.
