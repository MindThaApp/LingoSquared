  description: Angielski na poziomie A2 do nieco bardziej formalnych sytuacji codziennych, z obszernymi wyjaśnieniami po polsku.
units:
  en.a2.unit28.doctor:
    title: Wizyta u lekarza
lessons:
  en.a2.unit28.lesson01.health_followup_vocabulary:
    title: Leki i terminy wizyt
  en.a2.unit28.lesson02.calling_to_make_an_appointment:
    title: Telefon w sprawie umówienia wizyty
  en.a2.unit28.lesson03.reading_an_appointment_confirmation:
