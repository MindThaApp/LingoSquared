teaching:
  en.a2.unit28.lesson01.teach.medicine:
    title: medicine
    gloss: lek
    note: '*medicine* oznacza lek lub lekarstwo.'
    example_gloss: Lekarz dał mi lek na ból głowy.
  en.a2.unit28.lesson01.teach.prescription:
    title: prescription
    gloss: recepta
    note: '*prescription* to recepta wystawiana przez lekarza.'
    example_gloss: Lekarz wystawił mi receptę na ten lek.
  en.a2.unit28.lesson01.teach.follow_up_appointment:
    title: follow-up appointment
    gloss: wizyta kontrolna
    note: '*follow-up appointment* to kolejna wizyta, na której lekarz sprawdza, jak się czujesz.'
    example_gloss: Jeśli nie będzie lepiej, będzie Pan/Pani potrzebować wizyty kontrolnej.
  en.a2.unit28.lesson01.teach.getting_worse:
    title: getting worse
    gloss: pogarszać się
    note: '*getting worse* oznacza, że dolegliwości się nasilają.'
    example_gloss: Boli mnie głowa coraz bardziej, a nie mniej.
  en.a2.unit28.lesson01.teach.insurance_card:
    title: insurance card
    gloss: karta ubezpieczenia
    note: '*insurance card* to karta Twojego ubezpieczenia zdrowotnego. W Polsce zwykle wystarczy podać numer PESEL, ale w krajach anglojęzycznych pokazuje się taką kartę.'
    example_gloss: Proszę zabrać na wizytę kartę ubezpieczenia.
  en.a2.unit28.lesson01.teach.reused_symptoms:
    title: Dawne dolegliwości
    gloss: ból głowy, ból gardła, gorączka
    note: Te słowa znasz już z rozdziału 22; tutaj je powtarzamy.
    example_gloss:
    - Boli mnie głowa.
    - Boli mnie gardło.
    - Mam gorączkę.
  en.a2.unit28.lesson02.teach.appointment_request:
    title: Prośba o termin
    gloss: Chciałbym/Chciałabym umówić się na wizytę u lekarza.
    note: Za pomocą *I'd like to...* uprzejmie prosisz o wizytę.
  en.a2.unit28.lesson02.teach.symptom_duration:
    title: Mówienie, od jak dawna masz dolegliwości
    gloss: Od trzech dni boli mnie głowa i gardło, i jest coraz gorzej.
    note: 'Na określenie czegoś, co trwa już od jakiegoś czasu, angielski używa czasu *Present Perfect* (*I''ve had ... for three days*). Po polsku mówi się tu w czasie teraźniejszym z „od”: Od trzech dni boli mnie...'
  en.a2.unit28.lesson03.teach.arrive_early:
    title: arrive ten minutes early
    gloss: przyjść dziesięć minut wcześniej
    note: '*arrive ten minutes early* oznacza przyjść dziesięć minut przed wizytą.'
    example_gloss: Proszę przyjść dziesięć minut przed wizytą.
  en.a2.unit28.lesson03.teach.confirmation_text:
    title: Treść potwierdzenia
    gloss: Pana/Pani wizyta jest potwierdzona na dziś na godzinę 15:00. Proszę zabrać kartę ubezpieczenia i przyjść dziesięć minut wcześniej. Numer potwierdzenia to 7724.
    note: Oficjalne potwierdzenie z godziną, informacją, co należy zrobić, i numerem.
  en.a2.unit28.lesson04.teach.i_see:
    title: I see.
    gloss: Rozumiem.
    note: Za pomocą *I see* dajesz do zrozumienia, że rozumiesz.
  en.a2.unit28.lesson04.teach.q_whats_wrong:
    title: Pytanie, co się dzieje
    gloss: 'Lekarz pyta: Co Panu dolega?'
    note: To samo pytanie, które Leila zadała w rozdziale 22, tym razem zadaje je lekarz.
  en.a2.unit28.lesson04.teach.a_symptoms_duration:
    title: Odpowiedź Daniela o dolegliwościach
    gloss: 'Daniel mówi: Od trzech dni boli mnie głowa i gardło, i jest coraz gorzej.'
    note: To samo zdanie co w lekcji 2.
  en.a2.unit28.lesson04.teach.a_bad_cold:
    title: Diagnoza lekarza
    gloss: 'Lekarz mówi: Rozumiem. Ma Pan silne przeziębienie.'
    note: Prosta, codzienna diagnoza, nic poważnego.
  en.a2.unit28.lesson04.teach.q_medicine:
    title: Pytanie o leki
    gloss: 'Daniel pyta: Czy powinienem wziąć jakiś lek?'
    note: Daniel pyta o leczenie po usłyszeniu diagnozy.
  en.a2.unit28.lesson04.teach.a_medicine_instructions:
    title: Wskazówki dotyczące leku
    gloss: 'Lekarz mówi: Tak, proszę brać ten lek dwa razy dziennie przez pięć dni i pić dużo wody.'
    note: 'Dokładne zalecenie: dwa razy dziennie, przez pięć dni.'
  en.a2.unit28.lesson04.teach.q_follow_up:
    title: Pytanie o wizytę kontrolną
    gloss: 'Daniel pyta: Czy mam przyjść ponownie, jeśli nie będzie lepiej?'
    note: Daniel używa tego samego warunku (*if it doesn't get better*), którego użyła Leila w rozdziale 22.
  en.a2.unit28.lesson04.teach.a_followup_appointment:
    title: Odpowiedź lekarza o wizycie kontrolnej
    gloss: 'Lekarz mówi: Tak, jeśli w ciągu tygodnia nie będzie lepiej, proszę przyjść na wizytę kontrolną.'
    note: 'Lekarz dokładnie mówi, kiedy Daniel ma wrócić: jeśli w ciągu tygodnia nie będzie lepiej.'
