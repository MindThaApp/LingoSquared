  en.b1.unit10.lesson02.teach.grammar_purpose:
    title: '''in order to'' i ''so that'''
    gloss: Uczę się, aby poprawić swój angielski. Uczę się, żebym mógł zapamiętać więcej.
    note: '*in order to* stoi przed czasownikiem; *so that* stoi przed pełnym zdaniem podrzędnym. W polskim oba przypadki oddaje zwykle „żeby” lub „aby”: z bezokolicznikiem („żeby poprawić”) albo z formą osobową („żebym mógł zapamiętać”). Po angielsku *in order to* odpowiada pierwszemu wariantowi, a *so that* drugiemu.'
