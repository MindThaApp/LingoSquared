  en.b1.unit10.lesson03.teach.reading_passage:
    title: 'Tekst: jasne cele'
    gloss: Daniel i Leila mają jasne cele. Daniel chodzi na kurs wieczorowy, aby poprawić swój angielski do pracy. Ćwiczy pisanie krótkich komunikatów, żeby brzmieć bardziej profesjonalnie. Leila oszczędza pieniądze, żeby w przyszłym roku zapisać się na kurs projektowania. Czyta opisy kursów, aby wybrać odpowiedni program.
    note: Krótki tekst o celach z użyciem *in order to* i *so that*.
