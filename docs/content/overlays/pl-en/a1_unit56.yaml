  en.a1.unit56.lesson02.teach.could_we_have_the_bill:
    title: Could we have the bill, please?
    gloss: Czy moglibyśmy prosić o rachunek?
    note: '*Could we have...?* to grzeczny sposób proszenia. Po polsku też grzeczniej brzmi forma warunkowa: „moglibyśmy prosić”; po angielsku naturalnym, uprzejmym odpowiednikiem jest *could*.'
  en.a1.unit56.lesson02.teach.enjoy_your_meal:
    title: Enjoy your meal!
    gloss: Smacznego!
    note: '*Enjoy your meal!* to stałe wyrażenie, które kelner mówi, zanim zaczniesz jeść. Dosłownie znaczy „ciesz się posiłkiem”, ale polskie „Smacznego!” jest zbudowane inaczej. Naucz się tego zdania jako całości, nie słowo po słowie.'
  en.a1.unit56.lesson03.teach.dialogue_line1:
    title: Leila pyta o stolik
    gloss: 'Leila mówi: Dzień dobry! Czy ten stolik jest wolny?'
    note: '*Is this table free?* używa *free* w znaczeniu wolny, niezajęty.'
  en.a1.unit56.lesson03.teach.dialogue_line2:
    title: Kelner wskazuje stolik
    gloss: 'Kelner mówi: Tak, proszę tu usiąść.'
    note: '*please sit here* to krótkie, grzeczne zaproszenie.'
  en.a1.unit56.lesson03.teach.dialogue_line3:
    title: Mia pyta o kartę dań
    gloss: 'Mia mówi: Czy mogę prosić o kartę dań?'
    note: '*Could I see...?* – znowu grzeczne *could*, tak jak w *could we have the bill*.'
  en.a1.unit56.lesson03.teach.dialogue_line4:
    title: Kelner podaje kartę dań
    gloss: 'Kelner mówi: Oczywiście, proszę bardzo.'
    note: '*Of course, here you are* to stały sposób podawania czegoś komuś.'
  en.a1.unit56.lesson03.teach.dialogue_line5:
    title: Zamówienie Leili
    gloss: 'Leila mówi: Poproszę kurczaka.'
    note: 'Jedna osobna informacja: Leila zamawia kurczaka.'
  en.a1.unit56.lesson03.teach.dialogue_line6:
    title: Zamówienie Mii
    gloss: 'Mia mówi: Poproszę sałatkę.'
    note: 'Jedna osobna informacja: Mia zamawia sałatkę.'
  en.a1.unit56.lesson03.teach.dialogue_line7:
    title: Kelner życzy smacznego
    gloss: 'Kelner mówi: Dobry wybór! Smacznego!'
    note: '*Enjoy your meal!* – stałe zdanie na zakończenie, zanim goście zaczną jeść.'
  en.a1.unit56.lesson03.teach.dialogue_line8:
    title: Leila pyta o cenę kurczaka
    gloss: 'Leila mówi: Ile kosztuje kurczak?'
    note: '*How much is...?* pyta o cenę.'
  en.a1.unit56.lesson03.teach.dialogue_line9:
    title: Cena kurczaka
    gloss: 'Kelner mówi: Kurczak kosztuje dwanaście dolarów.'
    note: 'Jedna osobna informacja: cena kurczaka, niezależna od sałatki i całego rachunku.'
  en.a1.unit56.lesson03.teach.dialogue_line10:
    title: Mia pyta o cenę sałatki
    gloss: 'Mia mówi: Ile kosztuje sałatka?'
    note: '*How much is...?* – ta sama forma pytania co przy kurczaku.'
  en.a1.unit56.lesson03.teach.dialogue_line11:
    title: Cena sałatki
    gloss: 'Kelner mówi: Sałatka kosztuje siedem dolarów.'
    note: 'Druga osobna informacja: cena sałatki.'
  en.a1.unit56.lesson03.teach.dialogue_line12:
    title: "Leila prosi o rachunek"
    gloss: 'Leila mówi: Czy moglibyśmy prosić o rachunek?'
    note: '*Could we have...?* – znowu grzeczne *could*.'
  en.a1.unit56.lesson03.teach.dialogue_line13:
    title: Cały rachunek
    gloss: 'Kelner mówi: To będzie dziewiętnaście dolarów, proszę.'
    note: 'Trzecia osobna informacja: cały rachunek, inny niż osobne ceny kurczaka i sałatki.'
  en.a1.unit56.lesson04.teach.restaurant_menu:
    title: Karta dań
    gloss: 'Karta dań restauracji: Kurczak - $12. Sałatka - $7. Pizza - $10. Sok - $3.'
    note: Karta dań pokazuje cztery pozycje z cenami.
  en.a1.unit56.lesson04.teach.reading_passage:
    title: 'Tekst: Posiłek w restauracji'
    gloss: Pewnego wieczoru Leila i Mia postanowiły wypróbować nową restaurację w centrum. Kelner zaprowadził je do stolika przy oknie. Przyniósł im kartę dań z kurczakiem, sałatką, pizzą i sokiem. Leila zamówiła kurczaka, a Mia zamówiła sałatkę. Kurczak kosztował dwanaście dolarów, a sałatka siedem. Kiedy jadły, rozmawiały o zajęciach z fotografii Mii. Gdy skończyły, kelner przyniósł rachunek. Wyniósł dziewiętnaście dolarów za obie. Leila powiedziała, że restauracja była wspaniała, a Mia powiedziała, że następnym razem chce tu przyprowadzić Daniela.
    note: '*ordered* to czas przeszły od *order* (zamawiać).'
