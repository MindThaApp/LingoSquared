    example_gloss: Straż pożarna już jest.
  en.a1.unit45.lesson02.teach.call_911:
    title: Call 911!
    gloss: Zadzwoń pod 911!
    note: W Stanach Zjednoczonych w nagłym wypadku dzwoni się pod numer *911*, a nie pod *112*, jak w Polsce. To ważna różnica, którą warto zapamiętać.
  en.a1.unit45.lesson02.teach.i_need_help:
    title: I need help!
    gloss: Potrzebuję pomocy!
    note: '*I need help!* znaczy: potrzebuję pomocy!'
  en.a1.unit45.lesson02.teach.send_the_police:
    title: Send the police, please.
    gloss: Proszę przysłać policję.
    note: '*Send the police, please.* znaczy: proszę przysłać policję.'
  en.a1.unit45.lesson02.teach.send_an_ambulance:
    title: Send an ambulance, please.
    gloss: Proszę przysłać karetkę.
    note: '*Send an ambulance, please.* znaczy: proszę przysłać karetkę.'
  en.a1.unit45.lesson02.teach.theres_a_fire:
    title: There's a fire!
    gloss: Pali się!
    note: '*There''s a fire!* znaczy: pali się!'
  en.a1.unit45.lesson02.teach.whats_your_emergency:
    title: What's your emergency?
    gloss: Co się stało? (Jaki jest charakter zgłoszenia?)
    note: To standardowe pytanie amerykańskiego operatora numeru alarmowego, gdy zadzwonisz pod 911.
  en.a1.unit45.lesson03.teach.dialogue_line1:
    title: Leila czuje dym
    gloss: 'Leila pyta: Daniel, coś się pali? Czuję dym!'
    note: '*smell* + rzeczownik, bez przyimka: I smell smoke = czuję dym. Uwaga: *I smell of smoke* znaczy coś innego (pachnę dymem).'
  en.a1.unit45.lesson03.teach.dialogue_line2:
    title: Wyjaśnienie Daniela
    gloss: 'Daniel mówi: O nie, patelnia zapaliła się! Gotowałem obiad.'
    note: '*caught fire* to utarte wyrażenie na nagłe zapalenie się czegoś.'
  en.a1.unit45.lesson03.teach.dialogue_line3:
    title: Polecenia Leili
    gloss: 'Leila mówi: Spokojnie. Wyłącz kuchenkę! Wezwę pomoc.'
    note: '*call for help* znaczy wezwać pomoc. Nie pomijaj tu słowa *for*.'
  en.a1.unit45.lesson03.teach.dialogue_line4:
    title: Ostrzeżenie Daniela
    gloss: 'Daniel mówi: Szybko, ogień się powiększa!'
    note: '*getting bigger* znaczy stawać się większym: get + przymiotnik oznacza zmianę.'
  en.a1.unit45.lesson03.teach.dialogue_line5:
    title: Leila dzwoni pod numer alarmowy
    gloss: 'Leila mówi: Dzień dobry, to nagły wypadek. W kuchni mojego znajomego jest pożar. Proszę przysłać straż pożarną.'
    note: 'Tak wygląda rozmowa z amerykańskim numerem alarmowym: dzwoni się pod 911, a nie pod 112.'
  en.a1.unit45.lesson03.teach.dialogue_line6:
    title: Ulga Daniela
    gloss: 'Daniel mówi: Dzięki Bogu. Chyba już zgasło, ale na wszelki wypadek poczekajmy na zewnątrz.'
    note: '*just in case* znaczy na wszelki wypadek.'
  en.a1.unit45.lesson03.teach.dialogue_line7:
    title: Rada Leili
    gloss: 'Leila mówi: Dobry pomysł. Bezpieczniej jest czekać na zewnątrz, aż przyjadą.'
    note: '*safer* to wyższy stopień przymiotnika safe, tworzony przez końcówkę -er (po polsku: bezpieczny -> bezpieczniejszy).'
  en.a1.unit45.lesson04.teach.reading_passage:
    title: Tekst o postępowaniu w nagłych wypadkach
    gloss: 'W razie pożaru: Po pierwsze zachowaj spokój. Po drugie natychmiast opuść budynek. Nie korzystaj z windy, idź schodami. Po trzecie, gdy już będziesz na zewnątrz, zadzwoń pod 911 i podaj swój adres. Na koniec czekaj na zewnątrz, aż przyjedzie straż pożarna. Po pożarze w kuchni Daniela on i Leila czekali na zewnątrz, dokładnie tak, jak podawała instrukcja. Straż pożarna przyjechała szybko i upewniła się, że wszystko jest bezpieczne. Później Mia przyszła zobaczyć, co u nich, i odetchnęła z ulgą, że nikomu nic się nie stało.'
    note: '*elevator* to amerykańskie słowo oznaczające windę. W brytyjskim angielskim mówi się *lift*.'
