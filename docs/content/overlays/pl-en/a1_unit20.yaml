    title: Pytanie o torbę
    gloss: 'Leila pyta: Która torba ci się podoba, mała czy duża?'
    note: To pytanie jest podobne do tego z drugiej lekcji, ale teraz Leila pyta, która torba podoba się Danielowi.
  en.a1.unit20.lesson04.teach.a_big_nicer_small_cheaper:
    title: "Odpowiedź: Daniel"
    gloss: 'Daniel mówi: Duża jest ładniejsza, ale mała jest tańsza.'
    note: Za pomocą *but* Daniel zestawia dwa porównania.
  en.a1.unit20.lesson04.teach.q_how_much_cheaper:
    title: Pytanie o różnicę
    gloss: 'Leila pyta: O ile taniej?'
    note: To samo pytanie co wyżej.
  en.a1.unit20.lesson04.teach.a_ten_fifteen_dollars:
    title: Dokładne ceny
    gloss: 'Daniel mówi: Mała kosztuje dziesięć dolarów, a duża piętnaście dolarów.'
    note: 'Daniel podaje cenę obu toreb: dziesięć i piętnaście dolarów.'
  en.a1.unit20.lesson04.teach.a_cheaper_by_five:
    title: Wniosek Leili
    gloss: 'Leila mówi: Dobrze, mała jest tańsza o pięć dolarów. Biorę małą.'
    note: Piętnaście minus dziesięć to pięć, więc mała torba jest tańsza o pięć dolarów.
