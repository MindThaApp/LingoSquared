    title: Tekst o porównywaniu samochodów
    gloss: Czerwony samochód jest szybszy niż niebieski, ale niebieski jest tańszy. Biały samochód jest najtańszy z całej trójki.
    note: 'Ten tekst porównuje trzy samochody: czerwony jest szybszy niż niebieski, niebieski jest tańszy niż czerwony, a biały jest najtańszy.'
  en.a1.unit20.lesson04.teach.how_much_cheaper:
    title: How much cheaper?
    gloss: O ile taniej?
    note: '*How much...?* służy do pytania o wielkość różnicy.'
