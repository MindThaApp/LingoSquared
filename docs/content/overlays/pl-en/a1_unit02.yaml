  en.a1.unit02.lesson03.teach.role:
    title: Daniel nennt seinen Beruf
    gloss: 'Daniel mówi: Jestem inżynierem.'
    note: Przed nazwą zawodu po angielsku stoi *a* lub *an* (*I'm an engineer*); po polsku rodzajnika nie ma.
  en.a1.unit02.lesson03.teach.closing:
    title: Daniel und Leila schließen das Gespräch ab
    gloss: 'Daniel mówi: Witamy w bibliotece. Leila mówi: Dziękuję.'
    note: Uprzejme, przyjazne zakończenie.
