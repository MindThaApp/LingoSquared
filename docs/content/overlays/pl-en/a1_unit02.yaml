  en.a1.unit02.lesson03.teach.names:
    title: Leila antwortet
    gloss: 'Leila mówi: Cześć. Jestem Leila. Jestem studentką. Miło mi.'
    note: Leila podaje imię, swoją rolę i zwyczajową formułę grzecznościową.
  en.a1.unit02.lesson03.teach.room_and_member:
    title: Daniel fragt nach der Mitgliedschaft
    gloss: 'Daniel mówi: Mnie również. Czy jest Pani nową członkinią? Leila mówi: Tak, jestem.'
