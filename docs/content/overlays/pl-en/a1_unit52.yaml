  en.a1.unit52.lesson03.teach.dialogue_line2:
    title: Prośba Daniela
    gloss: 'Daniel mówi: Chciałbym się ostrzyc. Moja siostra przyjeżdża w odwiedziny w przyszłym tygodniu.'
    note: 'W zwrocie *I''d like a haircut* używa się rzeczownika *haircut*, natomiast po polsku naturalnie mówi się tutaj: chciałbym się ostrzyc.'
  en.a1.unit52.lesson03.teach.dialogue_line3:
    title: "Fryzjer pyta"
    gloss: 'Fryzjer pyta: Oczywiście, jaką fryzurę pan sobie życzy?'
    note: '*what style do you want* oznacza: jaką fryzurę chcesz?'
  en.a1.unit52.lesson03.teach.dialogue_line4:
    title: Życzenie Daniela
    gloss: 'Daniel mówi: Taka sama fryzura, tylko trochę krótsza.'
    note: '*just a little shorter* oznacza: tylko trochę krócej.'
  en.a1.unit52.lesson03.teach.dialogue_line5:
    title: Pytanie Mii
    gloss: 'Mia pyta: Czy może pani najpierw umyć mu włosy?'
    note: '*Can you wash his hair first?* oznacza: czy może pani najpierw umyć mu włosy?'
  en.a1.unit52.lesson03.teach.dialogue_line6:
    title: Potwierdzenie fryzjera
    gloss: 'Fryzjer mówi: Oczywiście, mycie jest wliczone w cenę strzyżenia.'
    note: '*included with* oznacza, że coś jest wliczone w cenę.'
  en.a1.unit52.lesson03.teach.dialogue_line7:
    title: Pytanie Daniela o cenę
    gloss: 'Daniel pyta: Świetnie. Ile to kosztuje?'
    note: '*Great.* oznacza tutaj: świetnie; jest to krótka reakcja.'
  en.a1.unit52.lesson03.teach.dialogue_line8:
    title: Cena
    gloss: 'Fryzjer mówi: To kosztuje dwadzieścia dolarów.'
    note: To powtórzenie poznanego wcześniej zdania.
  en.a1.unit52.lesson04.teach.reading_passage:
    title: Tekst o wizycie u fryzjera
    gloss: 'Wizyta u fryzjera: Siostra Daniela miała przyjechać z Chicago w przyszłym tygodniu, więc postanowił się ostrzyc. Mia poleciła mu swojego ulubionego fryzjera w małym salonie niedaleko jej mieszkania i poszła tam razem z nim. Fryzjer zapytał, jaką fryzurę chciałby mieć. Daniel odpowiedział, że taką samą, tylko trochę krótszą. Fryzjer najpierw umył mu włosy, a mycie było wliczone w cenę strzyżenia. Strzyżenie kosztowało dwadzieścia dolarów. Gdy skończyli, Mia powiedziała, że jego włosy wyglądają świetnie. W drodze do domu spotkali się z Leilą na kawę. Po przeziębieniu czuła się już znacznie lepiej i jej również bardzo spodobała się nowa fryzura Daniela.'
    note: '*looked great* oznacza: wyglądały świetnie.'
