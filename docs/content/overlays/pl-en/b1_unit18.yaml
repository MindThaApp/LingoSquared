  en.b1.unit18.lesson02.teach.meeting_leila_friday:
    title: I am + Verb-ing (feste Vereinbarung)
    gloss: W piątek spotykam się z Leilą na lunchu.
    note: '*I am meeting Leila for lunch on Friday* używa present continuous do mówienia o uzgodnionym terminie, ustalonym już z drugą osobą.'
  en.b1.unit18.lesson02.teach.going_to_start_project:
    title: I am going to + Verb (Absicht)
    gloss: Zamierzam rozpocząć nowy projekt z zespołem projektowym.
    note: '*I am going to start a new project* używa konstrukcji *going to* dla decyzji, która już zapadła, bez ustalonego terminu.'
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions:
    title: Feste Vereinbarungen und Absichten
    gloss: 'Użyj present continuous (*I am meeting Leila on Friday*) do uzgodnionego terminu: konkretnej pory, którą ustaliłeś już z kimś innym. Użyj *going to* (*I am going to start a new project*) do zamiaru lub decyzji, która już zapadła, nawet jeśli nie ma jeszcze ustalonego terminu. W polskim oba te znaczenia często wyraża się tą samą formą, a po angielsku trzeba wybrać odpowiednią konstrukcję.'
    note: 'Schemat: wybierz między present continuous dla uzgodnionego terminu a *going to* dla zamiaru.'
  en.b1.unit18.lesson03.teach.on_time:
    title: on time
    gloss: na czas, punktualnie
    note: '*on time* oznacza dokładnie o planowanej godzinie lub w planowanym dniu.'
    example_gloss: Daniel myśli, że projekt skończy się na czas.
  en.b1.unit18.lesson03.teach.confident:
    title: confident
    gloss: pewny siebie, przekonany o powodzeniu
    note: '*confident* oznacza być pewnym, że coś się uda.'
    example_gloss: Daniel jest dobrej myśli, jeśli chodzi o nowy projekt.
  en.b1.unit18.lesson03.teach.reading_passage:
    title: 'Lesetext: Daniels Pläne für nächsten Monat'
    gloss: W przyszłym miesiącu Daniel zacznie nowy projekt z zespołem projektowym. W piątek rano spotyka się z nimi, żeby zaplanować pierwsze kroki. Daniel jest dobrej myśli, ale nie ma całkowitej pewności, że projekt zakończy się na czas. Przewiduje, że zajmie to prawdopodobnie około dwóch miesięcy. Może poprosi Leilę, żeby dołączyła do zespołu, bo ma przydatne doświadczenie w projektowaniu. Jeśli się zgodzi, projekt na pewno ruszy szybciej.
    note: Krótki tekst o planach i przewidywaniach.
  en.b1.unit18.lesson04.teach.q_plans_next_month:
    title: Mia fragt nach Daniels Plänen
    gloss: 'Mia mówi: Daniel, jakie masz plany na przyszły miesiąc?'
    note: Otwarte pytanie, które zaczyna rozmowę.
  en.b1.unit18.lesson04.teach.a_going_to_start:
    title: Daniel nennt sein Vorhaben
    gloss: 'Daniel mówi: Zamierzam rozpocząć nowy projekt z zespołem projektowym.'
    note: '*going to* pokazuje decyzję, która już zapadła.'
  en.b1.unit18.lesson04.teach.q_meeting_this_week:
    title: Mia fragt weiter
    gloss: 'Mia mówi: Brzmi ciekawie. Spotykasz się z nimi w tym tygodniu?'
    note: Pytanie dopełniające o uzgodniony termin.
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning:
    title: Daniel bestätigt die feste Vereinbarung
    gloss: 'Daniel mówi: Tak, spotykam się z nimi w piątek rano.'
    note: '*I am meeting... on Friday morning* to present continuous użyty do uzgodnionego terminu.'
  en.b1.unit18.lesson04.teach.q_finish_on_time:
    title: Mia fragt nach dem Termin
    gloss: 'Mia mówi: Myślisz, że projekt skończy się na czas?'
    note: Pytanie o przewidywanie.
  en.b1.unit18.lesson04.teach.a_probably_two_months:
    title: Daniel gibt eine Vorhersage ab
    gloss: 'Daniel mówi: Nie jestem pewien, ale to prawdopodobnie zajmie jakieś dwa miesiące.'
    note: '*probably* pokazuje dość dużą, ale nie całkowitą pewność.'
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well:
    title: Mia ist optimistisch
    gloss: 'Mia mówi: No cóż, jestem pewna, że pójdzie dobrze.'
    note: Słowa otuchy.
  en.b1.unit18.lesson04.teach.a_might_ask_leila:
    title: Daniel nennt eine schwache Möglichkeit
    gloss: 'Daniel mówi: Dzięki. Może poproszę też Leilę, żeby dołączyła do zespołu.'
    note: '*might* pokazuje słabą możliwość.'
