teaching:
  en.b1.unit03.lesson01.teach.if:
    title: if
    gloss: jeśli, jeżeli
    note: '*if* wprowadza warunek. Gdy chodzi o czas (kiedy, gdy, za każdym razem, gdy), angielski używa *when*; *if* oznacza wyłącznie warunek.'
    example_gloss: Jeśli będzie padać, zostaniemy w domu.
  en.b1.unit03.lesson01.teach.rain:
    title: rain
    gloss: deszcz, padać (o deszczu)
    note: '*rain* oznacza wodę spadającą z nieba albo czasownik „padać” (o deszczu).'
    example_gloss: W ten weekend może padać.
  en.b1.unit03.lesson01.teach.stay_home:
    title: stay home
    gloss: zostać w domu
    note: '*stay home* oznacza nie wychodzić i zostać w domu.'
    example_gloss: Jeśli będzie padać, zostaniemy w domu.
  en.b1.unit03.lesson01.teach.weekend:
    title: weekend
    gloss: weekend
    note: '*weekend* oznacza sobotę i niedzielę.'
    example_gloss: Jakie masz plany na weekend?
  en.b1.unit03.lesson01.teach.free_time:
    title: free time
    gloss: wolny czas
    note: '*free time* to czas, w którym nie pracujesz i nie jesteś zajęty.'
    example_gloss: Teraz nie mam dużo wolnego czasu.
  en.b1.unit03.lesson01.teach.paint:
    title: paint
    gloss: malować
    note: '*paint* oznacza tworzenie obrazu za pomocą farby.'
    example_gloss: Leila uwielbia malować w weekendy.
  en.b1.unit03.lesson02.teach.if_rains_stay_home:
    title: Realny warunek dotyczący przyszłości
    gloss: Jeśli jutro będzie padać, zostaniemy w domu.
    note: '*if + present, will + bezokolicznik* wyraża realny, możliwy warunek w przyszłości.'
  en.b1.unit03.lesson02.teach.if_have_free_time_paint:
    title: Kolejny realny warunek
    gloss: Jeśli w ten weekend będę mieć wolny czas, będę malować.
    note: 'Ta sama konstrukcja: *if + present, will + bezokolicznik*.'
  en.b1.unit03.lesson02.teach.grammar_real_condition:
    title: Realne warunki
    gloss: Jeśli będzie padać, zostaniemy w domu. Jeśli będę mieć czas, będę malować.
    note: Po *if* angielski używa tu czasu teraźniejszego, mimo że mowa o przyszłości -- nie *will rain*.
  en.b1.unit03.lesson03.teach.would:
    title: would
    gloss: by (tryb warunkowy)
    note: '*would* + bezokolicznik wyraża sytuację nierzeczywistą lub hipotetyczną w teraźniejszości.'
    example_gloss: Gdybym miał więcej czasu, malowałbym codziennie.
  en.b1.unit03.lesson03.teach.class:
    title: class
    gloss: kurs, zajęcia
    note: '*class* oznacza zorganizowany kurs lub zajęcia prowadzone przez nauczyciela.'
    example_gloss: W pobliżu jej domu były zajęcia malarskie.
  en.b1.unit03.lesson03.teach.reading_passage:
    title: 'Tekst: gdyby miała więcej wolnego czasu'
    gloss: Leila uwielbia malować, ale nie ma dużo wolnego czasu. Gdyby miała więcej wolnego czasu, malowałaby codziennie. W zeszłym miesiącu w pobliżu jej domu były zajęcia malarskie. Gdyby wcześniej o nich wiedziała, zapisałaby się. Teraz co tydzień sprawdza, czy są nowe zajęcia.
    note: Krótki tekst do czytania z sytuacją nierzeczywistą w teraźniejszości i sytuacją nierzeczywistą w przeszłości.
  en.b1.unit03.lesson04.teach.q_weekend_plans:
    title: Daniel pyta o weekend
    gloss: 'Daniel mówi: Jakie masz plany na weekend?'
    note: Proste pytanie otwarte, od którego zaczyna się rozmowa.
  en.b1.unit03.lesson04.teach.a_walk_or_stay_home:
    title: Plany Leili zależne od pogody
    gloss: 'Leila mówi: Jeśli nie będzie padać, pójdę na spacer. Jeśli będzie padać, zostanę w domu i będę malować.'
    note: Dwa realne warunki jeden po drugim, zależne od pogody.
  en.b1.unit03.lesson04.teach.q_take_class:
    title: Daniel pyta o kurs malarstwa
    gloss: 'Daniel mówi: Brzmi fajnie. Byłaś w zeszłym miesiącu na tych zajęciach malarskich?'
    note: Pytanie uzupełniające o coś, co zdarzyło się w przeszłości.
  en.b1.unit03.lesson04.teach.a_would_have_signed_up:
    title: Żal Leili z powodu przeszłości
    gloss: 'Leila mówi: Nie. Gdybym wcześniej o nich wiedziała, zapisałabym się.'
    note: '*if + past perfect, would have + imiesłów* wyraża nierzeczywistą przeszłość lub żal.'
  en.b1.unit03.lesson04.teach.q_should_join:
    title: Daniel daje rekomendację
    gloss: 'Daniel mówi: Szkoda. Jeśli będą kolejne, powinnaś dołączyć.'
    note: Daniel używa *should*, żeby zachęcić Leilę do skorzystania z następnej okazji.
  en.b1.unit03.lesson04.teach.a_will_sign_up:
    title: Leila coś postanawia
    gloss: 'Leila mówi: Masz rację. Jeśli jakieś zobaczę, od razu się zapiszę.'
    note: Nowy realny warunek dotyczący przyszłości, już nie hipotetyczny.
