  en.a1.unit01.lesson01.everyday_greetings:
    title: Codzienne powitania
  en.a1.unit01.lesson03.wellbeing:
    title: Pytanie o samopoczucie i odpowiedzi
  en.a1.unit01.lesson05.noun_phrases_and_closings:
    title: Miłe pożegnania
teaching:
  en.a1.unit01.lesson01.teach.hello:
    title: Hello
    gloss: Cześć
    note: '*Hello* to neutralne, uniwersalne powitanie -- pasuje niemal w każdej sytuacji.'
    example_gloss: Cześć, Daniel!
  en.a1.unit01.lesson01.teach.hi:
    title: Hi
    gloss: Hej (swobodnie)
    note: '*Hi* jest mniej oficjalne niż *Hello*, podobnie jak polskie „hej” między znajomymi.'
    example_gloss: Hej, Leila!
  en.a1.unit01.lesson01.teach.good_morning:
    title: Good morning
    gloss: Dzień dobry (rano)
    note: '*Good morning* mówi się rano, tak samo jak „dzień dobry” z rana.'
  en.a1.unit01.lesson01.teach.good_afternoon:
    title: Good afternoon
    gloss: Dzień dobry (po południu)
    note: '*Good afternoon* mówi się po południu -- po angielsku nie ma odpowiednika polskiego „dzień dobry”, które pasuje przez cały dzień.'
  en.a1.unit01.lesson01.teach.good_evening:
    title: Good evening
    gloss: Dobry wieczór
    note: '*Good evening* mówi się wieczorem, tak samo jak „dobry wieczór”.'
  en.a1.unit01.lesson01.teach.goodbye:
    title: Goodbye
    gloss: Do widzenia
    note: '*Goodbye* to neutralne, uniwersalne pożegnanie.'
    example_gloss: Do widzenia, do jutra!
  en.a1.unit01.lesson01.teach.bye:
    title: Bye
    gloss: Pa
    note: '*Bye* jest mniej oficjalne niż *Goodbye*, podobnie jak polskie „pa”.'
    example_gloss: Pa, do zobaczenia wkrótce!
  en.a1.unit01.lesson03.teach.how_are_you:
    title: How are you?
    gloss: Jak się Pan/Pani miewa? / Jak się masz?
    note: '*How are you?* pasuje po angielsku zarówno w sytuacjach formalnych, jak i nieformalnych -- nie ma tu podziału na „ty” i „Pan/Pani”, jaki znasz z polskiego.'
  en.a1.unit01.lesson03.teach.im_fine:
    title: I'm fine, thanks.
    gloss: Dobrze, dziękuję.
    note: Prosta, neutralna odpowiedź.
  en.a1.unit01.lesson03.teach.im_good:
    title: I'm good, thanks.
    gloss: Dobrze, dziękuję.
    note: Znaczy to samo co *I'm fine, thanks* -- obie odpowiedzi są w codziennych rozmowach równie częste.
  en.a1.unit01.lesson03.teach.not_bad:
    title: Not bad, thanks.
    gloss: Nieźle, dziękuję.
    note: Swobodna, nieco powściągliwa odpowiedź -- ani szczególnie dobrze, ani źle.
  en.a1.unit01.lesson03.teach.and_you:
    title: And you?
    gloss: A Panu/Pani? / A tobie?
    note: Oddanie pytania rozmówcy -- działa w każdym rejestrze, bez rozróżnienia na formalny i nieformalny.
  en.a1.unit01.lesson03.teach.are_you_okay:
    title: Are you okay?
    gloss: Wszystko w porządku?
    note: '*Are you okay?* pyta raczej o to, czy komuś teraz czegoś nie brakuje, niż ogólnie o samopoczucie jak *How are you?*'
  en.a1.unit01.lesson05.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: Miło mi Pana/Panią poznać. / Miło mi cię poznać.
    note: Mówi się tak przy pierwszym spotkaniu.
  en.a1.unit01.lesson05.teach.nice_to_meet_you_too:
    title: Nice to meet you too.
    gloss: Mnie również miło.
    note: Odpowiednia odpowiedź na *Nice to meet you*.
  en.a1.unit01.lesson05.teach.see_you_later:
    title: See you later.
    gloss: Do zobaczenia później.
    note: Mówi się tak, gdy zobaczysz tę osobę jeszcze tego samego dnia, podobnie jak polskie „do zobaczenia później”.
  en.a1.unit01.lesson05.teach.have_a_good_day:
    title: Have a good day.
    gloss: Miłego dnia.
    note: Przyjazne pożegnanie, w którym życzysz komuś udanej reszty dnia.
