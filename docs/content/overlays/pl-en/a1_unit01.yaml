course:
  title: Angielski A1
  description: 'Nauka angielskiego na poziomie A1: powitania i krótkie codzienne rozmowy, z obszernymi wyjaśnieniami po polsku.'
units:
  en.a1.unit01.greetings:
    title: Powitania i krótkie rozmowy
