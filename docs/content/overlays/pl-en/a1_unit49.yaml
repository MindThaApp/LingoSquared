    title: The green bin is for glass.
    gloss: Zielony pojemnik jest na szkło.
    note: '*is for ...* znaczy: jest na ... lub jest do ..., służy do mówienia, do czego coś jest przeznaczone.'
  en.a1.unit49.lesson02.teach.can_you_take_out_the_trash:
    title: Can you take out the trash?
    gloss: Możesz wynieść śmieci?
    note: '*take out* to angielski czasownik złożony, który można rozdzielić: *take out the trash* i *take the trash out* są oba poprawne. Po polsku mówi się po prostu „wynieść”.'
  en.a1.unit49.lesson02.teach.collection_day_is_on_tuesday:
    title: Collection day is on Tuesday.
    gloss: Odbiór jest we wtorek.
    note: '*Collection day is on Tuesday.* znaczy: odbiór jest we wtorek.'
  en.a1.unit49.lesson02.teach.what_about_paper_and_food_waste:
    title: What about paper and food waste?
    gloss: A co z papierem i odpadami kuchennymi?
    note: '*What about ...?* znaczy: a co z ...? Służy do pytania o coś innego.'
  en.a1.unit49.lesson03.teach.dialogue_line1:
    title: Ostrzeżenie Mii
    gloss: 'Mia mówi: Czekaj, ten słoik po dżemie nie idzie do zwykłych śmieci!'
    note: '*doesn''t go in the trash* znaczy: nie idzie do zwykłych śmieci.'
  en.a1.unit49.lesson03.teach.dialogue_line2:
    title: Przeprosiny Daniela
    gloss: 'Daniel mówi: O nie, przepraszam! Do którego pojemnika to wrzucić?'
    note: '*Which bin does it go in?* powtarza pytanie, którego właśnie się nauczyłeś.'
  en.a1.unit49.lesson03.teach.dialogue_line3:
    title: Wyjaśnienie Mii
    gloss: 'Mia mówi: To idzie do zielonego pojemnika. Tutaj segregujemy szkło.'
    note: '*We recycle glass here.* znaczy: tutaj segregujemy szkło (oddajemy je do recyklingu).'
  en.a1.unit49.lesson03.teach.dialogue_line4:
    title: Pytanie Daniela
    gloss: 'Daniel pyta: A co z papierem i odpadami kuchennymi?'
    note: Powtórka pytania *What about ...?*, którego uczyłeś się wcześniej.
  en.a1.unit49.lesson03.teach.dialogue_line5:
    title: Wyjaśnienie Mii
    gloss: 'Mia mówi: Papier idzie do niebieskiego pojemnika, a odpady kuchenne do brązowego.'
    note: '*goes in ..., and ... goes in ...* powtarza tę samą budowę dla dwóch różnych rodzajów odpadów.'
  en.a1.unit49.lesson03.teach.dialogue_line6:
    title: Pytanie Daniela o dzień odbioru
    gloss: 'Daniel mówi: Jasne. Kiedy jest odbiór?'
    note: '*Got it.* to nieformalny sposób powiedzenia „rozumiem”.'
  en.a1.unit49.lesson03.teach.dialogue_line7:
    title: "Odpowiedź: Mia"
    gloss: 'Mia mówi: Pojemniki na odpady do recyklingu wystawia się we wtorki, a zwykłe śmieci w piątki.'
    note: 'Uwaga: Mia podaje tu dwa różne dni dla dwóch rodzajów odpadów: wtorek dla recyklingu, piątek dla zwykłych śmieci.'
  en.a1.unit49.lesson03.teach.dialogue_line8:
    title: Obietnica Daniela
    gloss: 'Daniel mówi: Dzięki! Następnym razem wszystko dobrze posegreguję.'
    note: '*I''ll sort everything correctly next time.* znaczy: następnym razem wszystko dobrze posegreguję.'
  en.a1.unit49.lesson04.teach.reading_passage:
    title: Tekst o tym, jak działa segregacja odpadów
    gloss: 'Jak segregować odpady: W wielu blokach są różne pojemniki na różne rodzaje odpadów. Szkło zwykle idzie do zielonego pojemnika, a papier do niebieskiego. Odpady kuchenne trafiają do brązowego pojemnika, a wszystko inne do czarnego, na zwykłe śmieci. Warto znać swój dzień odbioru, bo pojemniki są opróżniane tylko raz w tygodniu. Daniel ćwiczy przepisy z książki kucharskiej, którą wypożyczył z biblioteki, i często gotuje z Mią w jej mieszkaniu. Wczoraj wieczorem zrobił potrawę z tej książki, a potem prawie wrzucił szklany słoik do zwykłych śmieci. Mia go powstrzymała i pokazała mu, jak w jej bloku segreguje się odpady. Wyjaśniła, że pojemniki na odpady do recyklingu wystawia się we wtorki, a zwykłe śmieci w piątki. Daniel był wdzięczny i powiedział, że od teraz będzie wszystko dobrze segregować.'
    note: '*almost put a glass jar in the regular trash* znaczy: prawie wrzucił szklany słoik do zwykłych śmieci.'
