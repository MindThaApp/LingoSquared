teaching:
  en.a1.unit33.lesson01.teach.bus:
    title: bus
    gloss: autobus
    note: '*bus* znaczy autobus. Czasownik, który się z nim łączy, to *take*: *take the bus*. Zwróć uwagę: po angielsku każdy środek transportu ma swój czasownik (*take*, *drive*, *ride*), więc trzeba je zapamiętać osobno.'
    example_gloss: Jadę autobusem.
  en.a1.unit33.lesson01.teach.train:
    title: train
    gloss: pociąg
    note: '*train* znaczy pociąg. Tak jak przy *bus*, używasz tu czasownika *take*: *take the train*.'
    example_gloss: Ona jedzie pociągiem.
  en.a1.unit33.lesson01.teach.car:
    title: car
    gloss: samochód
    note: '*car* znaczy samochód. Przy samochodzie nie używasz *take*, tylko *drive*: *drive my car*. To inny czasownik niż przy autobusie czy pociągu.'
    example_gloss: Jeżdżę do pracy swoim samochodem.
  en.a1.unit33.lesson01.teach.bike:
    title: bike
    gloss: rower
    note: '*bike* znaczy rower. Tutaj znów pojawia się inny czasownik: *ride a bike* (nie *take* i nie *drive*).'
    example_gloss: Codziennie jeżdżę do pracy rowerem.
  en.a1.unit33.lesson01.teach.walk:
    title: walk
    gloss: chodzić pieszo
    note: '*walk* znaczy iść pieszo. Nie potrzebujesz tu dodatkowego czasownika jak *take*, *drive* czy *ride*, bo *walk* sam jest czasownikiem: *walk to work*, a nie *take a walk to work*.'
    example_gloss: Chodzę do pracy pieszo.
  en.a1.unit33.lesson02.teach.how_get_to:
    title: How do you get to work?
    gloss: Jak dojeżdżasz do pracy?
    note: 'To pytanie zaczyna się od czasownika pomocniczego *do*, bo właściwym czasownikiem jest *get*. W polskim pytaniu nie potrzeba takiego czasownika pomocniczego: wystarczy zaimek pytający, np. „Jak dojeżdżasz?”.'
  en.a1.unit33.lesson02.teach.usually:
    title: usually
    gloss: zwykle
    note: '*usually* znaczy zwykle. W angielskim ten przysłówek stoi najczęściej między podmiotem a czasownikiem głównym: *I usually take the bus*.'
    example_gloss: Zwykle jeżdżę autobusem.
  en.a1.unit33.lesson02.teach.minutes:
    title: minutes
    gloss: minuty
    note: '*minutes* znaczy minuty. W zdaniu *It takes twenty minutes* słowo *it* jest pustym podmiotem bez własnego znaczenia; tylko zajmuje miejsce podmiotu. Po polsku podmiot można pominąć („Zajmuje to dwadzieścia minut”), a po angielsku zdanie zawsze musi mieć podmiot, więc trzeba dodać *it*.'
    example_gloss: To zajmuje dwadzieścia minut.
  en.a1.unit33.lesson02.teach.late:
    title: late
    gloss: spóźniony
    note: '*late* znaczy spóźniony, późno (przyjeżdżający później, niż się spodziewano): *The bus is often late.*'
    example_gloss: Autobus często się spóźnia.
  en.a1.unit33.lesson02.teach.faster:
    title: faster
    gloss: szybszy
    note: '*faster* znaczy szybszy: to stopień wyższy od *fast* z końcówką *-er*. W porównaniu używasz *than*: *faster than the bus*.'
    example_gloss: Pociąg jest szybszy niż autobus.
  en.a1.unit33.lesson03.teach.dialogue_line1:
    title: Pytanie Leili
    gloss: 'Leila pyta: Jak dojeżdżasz do pracy, Daniel?'
    note: Początek rozmowy z pytaniem *How do you get to work?*
  en.a1.unit33.lesson03.teach.dialogue_line2:
    title: "Odpowiedź: Daniel"
    gloss: 'Daniel mówi: Zwykle jeżdżę autobusem. To zajmuje około dwudziestu minut.'
    note: 'Dwie rzeczy naraz: czasownik *take* przy autobusie oraz pusty podmiot *it* w zdaniu *It takes about twenty minutes*.'
  en.a1.unit33.lesson03.teach.dialogue_line3:
    title: Pytanie Leili
    gloss: 'Leila pyta: Lubisz to?'
    note: Pytanie zamknięte (tak/nie) z *Do*.
  en.a1.unit33.lesson03.teach.dialogue_line4:
    title: "Odpowiedź: Daniel"
    gloss: 'Daniel mówi: Jest w porządku, ale autobus często się spóźnia. A ty?'
    note: '*How about you?* znaczy „A ty?”: krótki sposób, żeby zadać to samo pytanie rozmówcy.'
  en.a1.unit33.lesson03.teach.dialogue_line5:
    title: "Odpowiedź: Leila"
    gloss: 'Leila mówi: Ja jeżdżę samochodem. Jest szybciej, ale parkowanie jest trudne.'
    note: Przy samochodzie używasz czasownika *drive*, a nie *take*.
  en.a1.unit33.lesson04.teach.reading_passage:
    title: Tekst o Leili i Danielu
    gloss: Leila codziennie jeździ do pracy samochodem. Przejazd zajmuje około piętnastu minut, ale parkowanie w pobliżu jej biura jest trudne. Daniel nie ma samochodu, więc jeździ autobusem. Jego przejazd autobusem trwa dwadzieścia minut i autobus czasem się spóźnia, ale Daniel nie musi martwić się o parking.
    note: 'Zwróć uwagę: *take* używasz przy autobusie i pociągu, a *drive* przy samochodzie.'
