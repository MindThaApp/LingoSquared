    title: Zustimmen und einen Grund nennen
    gloss: Zgadzam się, że praca z domu jest lepsza, bo oszczędza się czas.
    note: '*I agree that... because...* łączy opinię z powodem.'
  en.b1.unit04.lesson02.teach.disagree_that_miss_coworkers:
    title: Widersprechen und einen Grund nennen
    gloss: Nie zgadzam się, że to lepsze, bo tęskni się za współpracownikami.
    note: '*I disagree that... because...* łączy przeciwną opinię z powodem.'
  en.b1.unit04.lesson02.teach.grammar_agree_disagree_that:
    title: agree that / disagree that
    gloss: Zgadzam się, że jest lepiej. Nie zgadzam się, że jest lepiej.
    note: Po *agree*/*disagree* słowo *that* wprowadza zdanie podrzędne, które podaje opinię, z którą się zgadzasz lub nie. Po angielsku przed *that* nie ma przecinka (po polsku przed „że” zwykle go stawiamy).
