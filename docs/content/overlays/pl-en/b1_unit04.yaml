    title: respect
    gloss: szanować
    note: '*respect* znaczy szanować cudzą opinię, nawet jeśli się z nią nie zgadzasz.'
    example_gloss: Szanują wzajemnie swoje opinie.
  en.b1.unit04.lesson03.teach.reading_passage:
    title: 'Lesetext: zwei Meinungen'
    gloss: Mia uważa, że praca z domu jest lepsza, bo łatwiej jej się wtedy skupić. Leila ma inne zdanie. Wierzy, że lepiej chodzić do biura, bo lubi codziennie widywać współpracowników. Nie zgadzają się ze sobą, ale szanują wzajemnie swoje opinie.
    note: Krótki tekst do czytania z dwiema przeciwnymi opiniami.
  en.b1.unit04.lesson04.teach.q_working_from_home:
    title: Daniel eröffnet die Debatte
    gloss: 'Daniel mówi: Myślisz, że praca z domu jest lepsza niż praca w biurze?'
    note: Otwarte pytanie, które rozpoczyna spór opinii.
  en.b1.unit04.lesson04.teach.a_disagree_miss_coworkers:
    title: Leila sieht das anders
    gloss: 'Leila mówi: Nie zgadzam się, że to lepsze. Myślę, że traci się ważne rozmowy ze współpracownikami.'
    note: Leila podaje swoją opinię i powód.
  en.b1.unit04.lesson04.teach.q_fair_point_saves_time:
    title: Daniel erkennt Leilas Argument an, bleibt aber bei seiner Meinung
    gloss: 'Daniel mówi: Coś w tym jest, ale zgadzam się, że oszczędza to dużo czasu.'
    note: '*that''s a fair point* uznaje opinię rozmówcy, zanim przedstawisz własną.'
  en.b1.unit04.lesson04.teach.a_agree_saves_time_prefer_office:
    title: Leila gibt etwas zu, bleibt aber bei ihrer Vorliebe
    gloss: 'Leila mówi: Zgadzam się, że oszczędza to czas, ale i tak wolę pracować w biurze.'
    note: Leila przyznaje rację w jednym punkcie, nie zmieniając swojej ogólnej opinii.
  en.b1.unit04.lesson04.teach.q_everyone_different_opinion:
    title: Daniel beendet das Gespräch
    gloss: 'Daniel mówi: Rozumiem to. Każdy ma inną opinię.'
    note: Naturalny, życzliwy sposób na zakończenie sporu.
