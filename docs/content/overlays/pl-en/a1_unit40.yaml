  en.a1.unit40.lesson03.teach.dialogue_line1:
    title: Prośba Daniela
    gloss: 'Daniel mówi: Dzień dobry, chciałbym nadać tę paczkę.'
    note: '*I''d like to* + czasownik to grzeczny sposób proszenia o coś. Jest znacznie grzeczniejsze niż *I want*, które przy okienku brzmi dość ostro.'
  en.a1.unit40.lesson03.teach.dialogue_line2:
    title: Pytanie pracownika
    gloss: 'Pracownik mówi: Oczywiście! Dokąd ma iść?'
    note: '*Where is it going?* pyta o miejsce docelowe.'
  en.a1.unit40.lesson03.teach.dialogue_line3:
    title: "Odpowiedź: Daniel"
    gloss: 'Daniel mówi: Do Chicago. To prezent urodzinowy dla mojej siostry.'
    note: '*It''s a birthday gift for my sister* znaczy: to prezent urodzinowy dla mojej siostry.'
  en.a1.unit40.lesson03.teach.dialogue_line4:
    title: Pytanie pracownika
    gloss: 'Pracownik mówi: Czy chce Pan zwykłą przesyłkę, czy ekspresową? Ekspres idzie około dwóch dni.'
    note: '*regular or express mail* znaczy zwykła lub ekspresowa przesyłka.'
  en.a1.unit40.lesson03.teach.dialogue_line5:
    title: Wybór Daniela
    gloss: 'Daniel mówi: Poproszę ekspres. Ile to kosztuje?'
    note: '*I''ll take ...* to naturalny sposób dokonania wyboru u sprzedawcy lub usługodawcy.'
  en.a1.unit40.lesson03.teach.dialogue_line6:
    title: Odpowiedź pracownika
    gloss: 'Pracownik mówi: To dwanaście dolarów. Oto Pana paragon.'
    note: '*Here''s your receipt* znaczy: oto Pana paragon.'
  en.a1.unit40.lesson03.teach.dialogue_line7:
    title: Podziękowanie Daniela
    gloss: 'Daniel mówi: Dziękuję! Miłego dnia.'
    note: '*Have a good day* to grzeczne pożegnanie.'
  en.a1.unit40.lesson04.teach.reading_passage:
    title: Tekst o trzech wizytach na poczcie
    gloss: Daniel, Leila i Mia świetnie znają pocztę. W zeszłym tygodniu Daniel wysłał siostrze do Chicago paczkę urodzinową. Zapłacił za przesyłkę ekspresową, bo chciał, żeby dotarła szybko, i szła tylko dwa dni. Leila szykuje się do przeprowadzki w pobliże Mii, więc poszła na pocztę wysłać rodzicom trochę starych książek. Pracownik zważył paczkę i dał jej znaczek. Leila zapytała, jak długo paczka będzie szła, a pracownik odpowiedział, że około tygodnia, bo wybrała zwykłą przesyłkę. Mia nie wysyła paczek zbyt często, ale zawsze kupuje znaczek na listy, które pisze do babci. Mówi, że list ze znaczkiem jest bardziej osobisty niż SMS.
    note: '*getting ready to move* znaczy: szykować się do przeprowadzki.'
