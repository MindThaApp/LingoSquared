teaching:
  en.a1.unit36.lesson01.teach.class:
    title: class
    gloss: lekcja / zajęcia
    note: '*class* znaczy lekcja, zajęcia (spotkanie, na którym się czegoś uczysz).'
    example_gloss: Mam zajęcia w każdy wtorek wieczorem.
  en.a1.unit36.lesson01.teach.course:
    title: course
    gloss: kurs
    note: '*course* znaczy kurs (cykl zajęć na jeden temat).'
    example_gloss: W tym roku chodzi na kurs komputerowy.
  en.a1.unit36.lesson01.teach.student:
    title: student
    gloss: uczeń / student / kursant
    note: '*student* znaczy uczeń, student lub kursant: osoba, która uczy się w szkole albo na zajęciach.'
    example_gloss: Ona jest studentką w community college.
  en.a1.unit36.lesson01.teach.homework:
    title: homework
    gloss: praca domowa
    note: '*homework* znaczy praca domowa.'
    example_gloss: Odrabiam pracę domową po kolacji.
  en.a1.unit36.lesson01.teach.subject:
    title: subject
    gloss: przedmiot
    note: '*subject* znaczy przedmiot (dziedzina, której się uczysz).'
    example_gloss: Matematyka to mój ulubiony przedmiot.
  en.a1.unit36.lesson01.teach.test:
    title: test
    gloss: sprawdzian
    note: '*test* znaczy sprawdzian, test.'
    example_gloss: W piątek mamy sprawdzian.
  en.a1.unit36.lesson02.teach.take_a_class:
    title: take a class
    gloss: chodzić na zajęcia
    note: '*take a class* to stała angielska kombinacja oznaczająca uczęszczanie na zajęcia. Nie tłumacz dosłownie polskiego „chodzić na” ani „uczęszczać” (np. *go to a class* w tym znaczeniu brzmi nienaturalnie); używasz zawsze *take*.'
    example_gloss: Chodzę na zajęcia w każdy wtorek wieczorem.
  en.a1.unit36.lesson02.teach.do_homework:
    title: do homework
    gloss: odrabiać pracę domową
    note: '*do homework*: czasownik to *do*, a nie *make*. Polskie „robić” może odpowiadać zarówno *do*, jak i *make*, więc tu łatwo o pomyłkę.'
    example_gloss: On odrabia pracę domową po kolacji.
  en.a1.unit36.lesson02.teach.study_for_a_test:
    title: study for a test
    gloss: uczyć się do sprawdzianu
    note: '*study for a test* znaczy uczyć się do sprawdzianu. *For* wskazuje tu cel (po co się uczysz).'
    example_gloss: Uczę się do sprawdzianu w każdy piątek.
  en.a1.unit36.lesson02.teach.community_college:
    title: community college
    gloss: community college (lokalna szkoła policealna dla dorosłych)
    note: '*community college* to amerykańska placówka, w której głównie dorośli uczęszczają na kursy obok pracy. W Polsce nie ma dokładnego odpowiednika, dlatego zwykle zostawia się angielską nazwę.'
    example_gloss: Ona studiuje w community college.
  en.a1.unit36.lesson02.teach.in_the_evening:
    title: in the evening
    gloss: wieczorem
    note: '*in the evening* znaczy wieczorem.'
    example_gloss: Moje zajęcia są wieczorem.
  en.a1.unit36.lesson02.teach.what_are_you_studying_question:
    title: What are you studying?
    gloss: Czego się uczysz?
    note: To pytanie używa czasu present continuous (*are you studying*), bo dotyczy tego, czym zajmujesz się w tym okresie życia, a nie zwykłego czasu teraźniejszego.
  en.a1.unit36.lesson03.teach.dialogue_line1:
    title: Pytanie Daniela
    gloss: 'Daniel pyta: Robisz dziś coś po pracy?'
    note: '*anything* znaczy tu „coś” lub „cokolwiek” i występuje w pytaniu.'
  en.a1.unit36.lesson03.teach.dialogue_line2:
    title: "Odpowiedź: Mia"
    gloss: 'Mia mówi: Tak, dziś wieczorem mam zajęcia z fotografii.'
    note: '*tonight* znaczy dziś wieczorem.'
  en.a1.unit36.lesson03.teach.dialogue_line3:
    title: Reakcja Daniela
    gloss: 'Daniel mówi: O, super! Gdzie na nie chodzisz?'
    note: '*Where do you take it?*: tu też *take* pasuje do uczęszczania na zajęcia lub kurs, tak jak w *take a class*.'
  en.a1.unit36.lesson03.teach.dialogue_line4:
    title: "Odpowiedź: Mia"
    gloss: 'Mia mówi: W community college w centrum. Dwa razy w tygodniu.'
    note: '*twice a week*: tu *a* znaczy „w” (w tygodniu).'
  en.a1.unit36.lesson03.teach.dialogue_line5:
    title: Pytanie Daniela
    gloss: 'Daniel mówi: Jak ci idzie do tej pory?'
    note: '*so far* znaczy do tej pory.'
  en.a1.unit36.lesson03.teach.dialogue_line6:
    title: "Odpowiedź: Mia"
    gloss: 'Mia mówi: Bardzo mi się podoba. Uczę się lepiej obsługiwać aparat.'
    note: '*I''m learning how to ...*: present continuous dla umiejętności, którą właśnie rozwijasz.'
  en.a1.unit36.lesson03.teach.dialogue_line7:
    title: Ostatnia uwaga Daniela
    gloss: 'Daniel mówi: Świetnie! Może kiedyś mnie nauczysz.'
    note: '*sometime* znaczy „kiedyś” lub „któregoś razu”: nieokreślony moment w przyszłości.'
  en.a1.unit36.lesson04.teach.reading_passage:
    title: Tekst o Danielu, Leili i Mii
    gloss: Daniel, Leila i Mia uczą się czegoś nowego poza pracą. Daniel w poniedziałkowe wieczory chodzi na kurs komputerowy, żeby zdobyć nowe umiejętności do pracy. Leila uczy się hiszpańskiego, bo kiedyś chce pojechać do Meksyku. Mia ma dwa razy w tygodniu zajęcia z fotografii w community college i już robi dużo lepsze zdjęcia. Czasem rozmawiają razem o swoich zajęciach w porze lunchu.
    note: '*takes a computer course*: używasz *take*, a nie dosłownego odpowiednika polskiego „chodzić na”; ta sama pułapka co przy *take a class*.'
