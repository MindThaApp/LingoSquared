  en.a1.unit44.lesson03.teach.dialogue_line1:
    title: Pytanie Mii
    gloss: 'Mia pyta: Jaka jest twoja ulubiona pora roku, Leilo?'
    note: '*What''s your favorite ...?* pyta o czyjąś preferencję.'
  en.a1.unit44.lesson03.teach.dialogue_line2:
    title: "Odpowiedź: Leila"
    gloss: 'Leila mówi: Jesień. Liście zmieniają kolor, a pogoda jest wspaniała do malowania na dworze.'
    note: '*great weather for painting outside* znaczy: wspaniała pogoda do malowania na dworze.'
  en.a1.unit44.lesson03.teach.dialogue_line3:
    title: Reakcja Mii
    gloss: 'Mia mówi: Brzmi super. Moją ulubioną porą roku jest wiosna.'
    note: '*My favorite season is spring* znaczy: moją ulubioną porą roku jest wiosna.'
  en.a1.unit44.lesson03.teach.dialogue_line4:
    title: Pytanie Leili
    gloss: 'Leila pyta: Dlaczego wiosna?'
    note: '*Why spring?* to krótki sposób zapytania o powód.'
  en.a1.unit44.lesson03.teach.dialogue_line5:
    title: "Odpowiedź: Mia"
    gloss: 'Mia mówi: Kwiaty kwitną, a ja uwielbiam robić im zdjęcia na zajęcia z fotografii.'
    note: '*I love taking photos* znaczy: uwielbiam robić zdjęcia.'
  en.a1.unit44.lesson03.teach.dialogue_line6:
    title: Pytanie Leili
    gloss: 'Leila mówi: To ma sens! Czy tam, gdzie mieszkasz, wiosna jest ciepła czy zimna?'
    note: '*That makes sense!* to naturalna reakcja na dobre wyjaśnienie.'
  en.a1.unit44.lesson03.teach.dialogue_line7:
    title: "Odpowiedź: Mia"
    gloss: 'Mia mówi: Zwykle ciepła, z odrobiną deszczu. Idealna na spacery na świeżym powietrzu.'
    note: '*with a little rain* znaczy: z odrobiną deszczu.'
  en.a1.unit44.lesson04.teach.reading_passage:
    title: Tekst o trzech ulubionych porach roku
    gloss: Daniel, Leila i Mia mają różne ulubione pory roku. Ulubioną porą roku Daniela jest lato. Uwielbia grać w piłkę nożną i biegać, gdy pogoda jest ciepła i słoneczna. Ulubioną porą roku Leili jest jesień, bo uwielbia malować liście, gdy zmieniają kolor. Ulubioną porą roku Mii jest wiosna. Robi zdjęcia kwiatom na zajęcia z fotografii. Choć każde z nich lubi inną porę roku, zawsze znajdują czas, żeby razem cieszyć się światem na zewnątrz.
    note: '*even though* znaczy: choć, mimo że.'
