course:
  title: Angielski A2
  description: Angielski na poziomie A2 do nieco bardziej formalnych sytuacji codziennych, z obszernymi wyjaśnieniami po polsku.
units:
  en.a2.unit37.video_calls:
    title: Rozmowy o wideorozmowach
lessons:
  en.a2.unit37.lesson01.video_call_vocabulary:
    title: Kamera, mikrofon i połączenie
  en.a2.unit37.lesson02.describing_your_video_calls:
    title: Opowiadanie o swoich wideorozmowach i o tym, co wolisz
  en.a2.unit37.lesson03.reading_about_video_calls:
    title: Czytanie o tym, jak ktoś inny korzysta z wideorozmów
  en.a2.unit37.lesson04.video_calls_dialogue:
    title: Rozmowa z przyjacielem o wideorozmowach
teaching:
  en.a2.unit37.lesson01.teach.video_call:
    title: video call
    gloss: wideorozmowa
    note: '*video call* to rozmowa, podczas której widzicie się nawzajem. Po polsku mówi się też rozmowa wideo lub wideokonferencja.'
    example_gloss: Co poniedziałek mam wideorozmowę z moim zespołem.
  en.a2.unit37.lesson01.teach.camera:
    title: camera
    gloss: kamera
    note: '*camera* to urządzenie, które przesyła twój obraz.'
    example_gloss: Włącz proszę kamerę, zanim zacznie się spotkanie.
  en.a2.unit37.lesson01.teach.microphone:
    title: microphone
    gloss: mikrofon
    note: '*microphone* to urządzenie, które przesyła twój głos.'
    example_gloss: Mój mikrofon był wyłączony, więc inni mnie nie słyszeli.
  en.a2.unit37.lesson01.teach.connection:
    title: connection
    gloss: połączenie
    note: '*connection* to połączenie twojego komputera z internetem.'
    example_gloss: Połączenie było słabe, więc obraz się zatrzymał.
  en.a2.unit37.lesson01.teach.mute:
    title: mute
    gloss: wyciszyć
    note: '*mute* znaczy wyłączyć własny dźwięk, żeby inni cię nie słyszeli.'
    example_gloss: Wyciszam mikrofon, kiedy akurat nie mówię.
  en.a2.unit37.lesson01.teach.face_to_face:
    title: face to face
    gloss: osobiście / twarzą w twarz
    note: '*face to face* znaczy, że jesteście w tym samym pomieszczeniu i nie rozmawiacie przez ekran.'
    example_gloss: Niektóre spotkania są lepsze osobiście niż online.
  en.a2.unit37.lesson01.teach.grammar_comparison:
    title: Porównania z faster than i less ... than
    gloss: Wideorozmowa jest szybsza niż wizyta. Wideorozmowa jest mniej osobista niż spotkanie twarzą w twarz.
    note: Do krótkich przymiotników dodajesz *-er* i stawiasz po nich *than* (*faster than*). Przy dłuższych przymiotnikach używasz *less ... than* lub *more ... than*.
  en.a2.unit37.lesson02.teach.video_call_every_monday:
    title: Mówienie, jak często masz rozmowy wideo
    gloss: Co poniedziałek mam wideorozmowę z moim zespołem.
    note: '*every Monday* znaczy „w każdy poniedziałek” i opisuje stały zwyczaj.'
  en.a2.unit37.lesson02.teach.turn_on_your_camera:
    title: Prośba o włączenie kamery
    gloss: Możesz włączyć kamerę?
    note: '*turn on* znaczy „włączyć”, przeciwieństwem jest *turn off* („wyłączyć”).'
  en.a2.unit37.lesson02.teach.you_were_on_mute:
    title: Mówienie, że ktoś miał wyciszony mikrofon
    gloss: Przepraszam, twój mikrofon był wyciszony.
    note: '*you were on mute* to utarte wyrażenie, gdy kogoś nie było słychać, bo miał wyciszony mikrofon.'
  en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face:
    title: Wyrażanie opinii z preferencją
    gloss: Uważam, że wideorozmowy są praktyczne, ale wolę spotykać się z ludźmi osobiście.
    note: Za pomocą *I think ... but I prefer ...* najpierw mówisz, co myślisz, a potem, co wolisz.
  en.a2.unit37.lesson02.teach.grammar_prefer:
    title: prefer X to Y
    gloss: Wolę wideorozmowy od rozmów telefonicznych. Wolę spotkania osobiste od wideorozmów.
    note: 'Uwaga: po *prefer* stoi *to*, a nie *than*, choć po polsku mówimy „wolę X niż Y”: *I prefer video calls to phone calls*.'
  en.a2.unit37.lesson03.teach.headphones:
    title: headphones
    gloss: słuchawki
    note: '*headphones* zawsze występuje po angielsku w liczbie mnogiej, nawet jeśli używasz jednej pary.'
    example_gloss: Używam słuchawek, żeby moja rodzina nie słyszała spotkania.
  en.a2.unit37.lesson03.teach.leilas_message:
    title: Wiadomość od Leili
    gloss: Moje zajęcia online to teraz same wideorozmowy. Włączam kamerę, ale mikrofon mam wyciszony, dopóki nauczycielka nie zada pytania. Używam słuchawek, bo z nimi moje połączenie jest lepsze. Uważam, że wideorozmowy oszczędzają dużo czasu, ale mimo to wolę spotykać się z kolegami z kursu osobiście.
    note: Luźna wiadomość od Leili o jej zajęciach online.
  en.a2.unit37.lesson03.teach.mute_until_question:
    title: Mówienie, kiedy wyciszasz mikrofon
    gloss: Mikrofon mam wyciszony, dopóki nauczycielka nie zada pytania.
    note: '*until* znaczy „dopóki” lub „aż do”: coś trwa do określonego momentu.'
  en.a2.unit37.lesson04.teach.q_lot_of_video_calls:
    title: Leila pyta o pracę Daniela
    gloss: 'Leila pyta: Masz w pracy dużo wideorozmów?'
    note: '*a lot of* znaczy „dużo” i pasuje zarówno do rzeczowników policzalnych, jak i niepoliczalnych.'
  en.a2.unit37.lesson04.teach.a_call_every_monday:
    title: Daniel opowiada o swoim ustalonym terminie
    gloss: 'Daniel mówi: Tak, co poniedziałek mam wideorozmowę z moim zespołem.'
    note: To samo zdanie co w lekcji 2.
  en.a2.unit37.lesson04.teach.q_turn_on_camera:
    title: Leila pyta o kamerę
    gloss: 'Leila pyta: Włączasz kamerę?'
    note: Krótkie pytanie dodatkowe, żeby dowiedzieć się więcej.
  en.a2.unit37.lesson04.teach.a_always_but_mute:
    title: Nawyk Daniela podczas rozmowy wideo
    gloss: 'Daniel mówi: Zawsze, ale wyciszam mikrofon, kiedy nie mówię.'
    note: '*when I am not speaking* znaczy tu: w chwilach, gdy nie mówię.'
  en.a2.unit37.lesson04.teach.q_classes_are_video_calls:
    title: Leila opowiada o swoich kursach
    gloss: 'Leila mówi: Moje zajęcia online to teraz same wideorozmowy.'
    note: To nawiązuje do jej zajęć w poniedziałek i środę z lekcji 33.
  en.a2.unit37.lesson04.teach.a_what_do_you_think:
    title: Daniel pyta o jej zdanie
    gloss: 'Daniel pyta: Co o nich sądzisz?'
    note: '*What do you think about them?* pyta o zdanie na temat czegoś, o czym właśnie była mowa.'
  en.a2.unit37.lesson04.teach.q_useful_but_prefer:
    title: Leila mówi, co myśli
    gloss: 'Leila mówi: Uważam, że wideorozmowy są praktyczne, ale wolę spotykać się z ludźmi osobiście.'
    note: To samo zdanie co w lekcji 2.
  en.a2.unit37.lesson04.teach.a_agree_faster_less_personal:
    title: Daniel zgadza się z nią
    gloss: 'Daniel mówi: Zgadzam się z tobą. Wideorozmowa jest szybsza niż wizyta, ale mniej osobista.'
    note: Za pomocą *I agree* wyrażasz zgodę. Zwykle następnie podaje się własny powód.
  en.a2.unit37.lesson04.teach.q_exactly:
    title: Leila potwierdza
    gloss: 'Leila mówi: Dokładnie.'
    note: '*Exactly* to krótki sposób, by powiedzieć, że w pełni się zgadzasz.'
