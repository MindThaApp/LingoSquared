    title: one hundred
    gloss: sto
    note: W angielskim przed *hundred* zawsze stoi *one* lub *a* (*one hundred*, *a hundred*) -- po polsku wystarczy samo „sto”.
  en.a1.unit03.lesson03.teach.how_old:
    title: How old are you?
    gloss: Ile masz lat? / Ile ma Pan/Pani lat?
    note: '*How old are you?* pasuje w każdej sytuacji -- angielski nie rozróżnia form na ty i Pan/Pani.'
  en.a1.unit03.lesson03.teach.im_25:
    title: I'm twenty-five years old.
    gloss: Mam dwadzieścia pięć lat.
    note: 'Po angielsku nie mówisz „mam lat”, tylko „jestem”: *I''m* + liczba + *years old*.'
  en.a1.unit03.lesson03.teach.how_much:
    title: How much is this?
    gloss: Ile to kosztuje?
    note: Służy do pytania o cenę czegoś.
  en.a1.unit03.lesson03.teach.its_ten_dollars:
    title: It's ten dollars.
    gloss: To kosztuje dziesięć dolarów.
    note: Standardowa odpowiedź na pytanie o cenę.
  en.a1.unit03.lesson03.teach.phone_question:
    title: What's your phone number?
    gloss: Jaki jest Pana/Pani numer telefonu?
    note: Służy do pytania o numer telefonu.
  en.a1.unit03.lesson03.teach.phone_answer:
    title: It's five-five-five, one-two-three-four.
    gloss: To pięć-pięć-pięć, jeden-dwa-trzy-cztery.
    note: Po angielsku numery telefonów podaje się cyfra po cyfrze, z pauzami między grupami.
