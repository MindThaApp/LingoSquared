    gloss: trzynaście
    note: 'Od 13 do 19 angielski dodaje do liczby podstawowej końcówkę *-teen*, podobnie jak polskie -naście. Przy *thirteen* zmienia się jednak temat: *thir-* zamiast *three*.'
