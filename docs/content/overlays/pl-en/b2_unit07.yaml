course:
  title: Angielski B2
  description: 'Nauka angielskiego na poziomie B2: niuansowane rozmowy, argumenty, przypuszczenia i profesjonalna dyskusja, z wyjaśnieniami po polsku w swobodnym tonie.'
units:
  en.b2.unit07.negotiation:
    title: On condition that the scope is reduced
lessons:
  en.b2.unit07.lesson01_terms_and_concessions:
    title: Warunki, odmowy i ustępstwa
  en.b2.unit07.lesson02_conditional_terms:
    title: I can agree on condition that...
  en.b2.unit07.lesson03.reading_revised_terms:
    title: 'Czytanie: co ustalono?'
  en.b2.unit07.lesson04.the_negotiation_dialogue:
    title: Agreed, with a condition
teaching:
  en.b2.unit07.lesson01.teach.term:
    title: term
    gloss: postanowienie, punkt ustaleń
    note: '*term* to jeden z elementów ustaleń. Nie chodzi tu o „termin” w sensie daty ani okresu nauki.'
    example_gloss: Postanowienie to jeden z elementów umowy.
  en.b2.unit07.lesson01.teach.proposal:
    title: proposal
    gloss: propozycja
    note: '*proposal* to propozycja możliwych warunków.'
    example_gloss: Propozycja przedstawia możliwe warunki.
  en.b2.unit07.lesson01.teach.refusal:
    title: refusal
    gloss: odmowa, odrzucenie
    note: '*refusal* mówi, że dany warunek jest nie do przyjęcia. Po angielsku jasna odmowa często brzmi lepiej, gdy podasz powód.'
    example_gloss: Odmowa mówi, że dany warunek jest nie do przyjęcia.
  en.b2.unit07.lesson01.teach.concession:
    title: concession
    gloss: ustępstwo
    note: '*concession* oznacza, że rezygnujesz z części swojego stanowiska, aby umożliwić porozumienie.'
    example_gloss: Ustępstwo to rezygnacja z części stanowiska.
  en.b2.unit07.lesson01.teach.scope:
    title: scope
    gloss: zakres prac
    note: '*scope* to ilość prac objętych umową. W negocjacjach możesz zestawiać termin realizacji i zakres.'
    example_gloss: Zakres to ilość prac objętych umową.
  en.b2.unit07.lesson01.teach.condition:
    title: condition
    gloss: warunek
    note: '*condition* to coś, co musi być spełnione, zanim ustalenie zacznie działać.'
    example_gloss: Warunek musi zostać spełniony, zanim ustalenie zacznie działać.
  en.b2.unit07.lesson02.teach.condition_deadline:
    title: Warunkowe ustępstwo
    gloss: Mogę zgodzić się na wcześniejszy termin pod warunkiem, że zakres zostanie zmniejszony.
    note: '*I can agree... on condition that...* jest jasne, ale profesjonalne. Nie łagodzisz tu przez niejasność.'
  en.b2.unit07.lesson02.teach.cannot_agree:
    title: Stanowcza odmowa
    gloss: Nie mogę zgodzić się na wtorek przy pełnym zakresie.
    note: '*I cannot agree to...* brzmi bardziej rzeczowo niż bezpośrednie dosłowne „Nie, to niemożliwe” (*No, that is impossible*), które po angielsku wypadłoby zbyt ostro.'
  en.b2.unit07.lesson02.teach.accept_if:
    title: Akceptacja z if
    gloss: Mogę to zaakceptować, jeśli pełny załącznik zostanie dostarczony w przyszłym tygodniu.
    note: '*I can accept that if...* wyraźnie stawia warunek.'
  en.b2.unit07.lesson02.teach.grammar_concession:
    title: Odmowa, a mimo to negocjacje
    gloss: Użyj I cannot agree, aby wyraźnie postawić granicę. Użyj I can agree on condition that, aby zaproponować warunkowe ustępstwo.
    note: Bezpośredniość, która w polskim brzmi naturalnie, po angielsku może wydać się ostra. Podaj granicę, powód i warunek.
  en.b2.unit07.lesson03.teach.executive_summary:
    title: executive summary
    gloss: streszczenie dla kadry kierowniczej
    note: '*executive summary* to krótkie streszczenie głównych punktów raportu.'
    example_gloss: Streszczenie dla kadry kierowniczej przedstawia główne punkty raportu.
  en.b2.unit07.lesson03.teach.charts:
    title: charts
    gloss: wykresy, diagramy
    note: '*charts* pokazują informacje wizualnie.'
    example_gloss: Wykresy pokazują informacje wizualnie.
  en.b2.unit07.lesson03.teach.reading_passage:
    title: 'Tekst do czytania: zmienione warunki'
    gloss: 'Priya zaproponowała najpierw czwartek jako termin pełnego raportu. Marcus się sprzeciwił, ponieważ klient potrzebował czegoś wcześniej. Priya odmówiła wtorku przy pełnym zakresie, bo zagroziłoby to jakości. Następnie zaproponowała warunkowe ustępstwo: wtorek był możliwy, jeśli zakres zostanie zmniejszony do streszczenia dla kadry kierowniczej i wykresów. Marcus przyjął ten warunek, ale dodał jeszcze jedno postanowienie: pełny załącznik miał zostać dostarczony w przyszłym tygodniu. Ustalono więc wtorek dla streszczenia i wykresów, a przyszły tydzień dla załącznika.'
    note: 'Negocjacje są stanowcze, ale profesjonalne: odmowa, powód, warunek i zgoda.'
  en.b2.unit07.lesson04.teach.q_thursday:
    title: Priya składa propozycję
    gloss: 'Priya mówi: Możemy dostarczyć raport w czwartek, jeśli zakres pozostanie taki, jak planowano.'
    note: Od razu łączy termin z zakresem.
  en.b2.unit07.lesson04.teach.a_tuesday:
    title: Marcus się sprzeciwia
    gloss: 'Marcus mówi: Czwartek jest dla klienta za późno. Możesz dostarczyć to do wtorku?'
    note: Prosi o wcześniejszy termin, nie zmieniając od razu zakresu.
  en.b2.unit07.lesson04.teach.q_cannot_tuesday:
    title: Priya odmawia, podając powód
    gloss: 'Priya mówi: Nie mogę zgodzić się na wtorek przy pełnym zakresie. Zagroziłoby to jakości.'
    note: Powód sprawia, że odmowa jest profesjonalna i mniej szorstka.
  en.b2.unit07.lesson04.teach.a_what_possible:
    title: Marcus pyta o warunki
    gloss: 'Marcus mówi: Co sprawiłoby, że wtorek byłby możliwy?'
    note: To pytanie otwiera drogę do warunkowego ustępstwa.
  en.b2.unit07.lesson04.teach.q_condition:
    title: Priya stawia warunek
    gloss: 'Priya mówi: Mogę zgodzić się na wcześniejszy termin pod warunkiem, że zakres zostanie zmniejszony do streszczenia dla kadry kierowniczej i wykresów.'
    note: '*on condition that* jest wyraźne i profesjonalne.'
  en.b2.unit07.lesson04.teach.a_accept_appendix:
    title: Marcus akceptuje z dodatkowym warunkiem
    gloss: 'Marcus mówi: Mogę to zaakceptować, jeśli pełny załącznik zostanie dostarczony w przyszłym tygodniu.'
    note: Akceptuje, ale ustala, kiedy dostarczona zostanie reszta.
  en.b2.unit07.lesson04.teach.q_agreed:
    title: Priya zamyka ustalenia
    gloss: 'Priya mówi: Ustalone. Wtorek dla streszczenia i wykresów, a przyszły tydzień dla załącznika.'
    note: '*Agreed* krótko i jasno kończy negocjacje.'
