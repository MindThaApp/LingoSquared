  en.b2.unit04.lesson03.exercise05.write_interruption:
    instruction: Zaczynając od „While”, napisz, że zasilanie wyłączyło się, gdy Simon sprawdzał system nagłośnienia.
    accepted_answers:
    - value: While Simon was checking the sound system, the power went out.
      status: correct
    - value: While Simon was checking the sound system the power went out.
      status: correct
    feedback: 'Nie *has gone out*: w opowieści główne zdarzenie podajesz w simple past.'
  en.b2.unit04.lesson04.exercise01.choose_prior_event:
