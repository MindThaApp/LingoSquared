    - the team delayed the start
    - the lights had come back on
    accepted_answers:
    - value: he was checking the sound system
      status: correct
    feedback: '*was checking* wskazuje czynność w toku.'
  en.b2.unit04.lesson03.exercise03.match_chronology:
    instruction: Połącz każde angielskie słowo lub wyrażenie z właściwym polskim opisem.
    pairs:
    - left: earliest prior event
      right: koordynator przeniósł sprzęt do środka
    - left: background when Simon arrived
      right: wolontariusze ustawiali krzesła
    - left: ongoing action
