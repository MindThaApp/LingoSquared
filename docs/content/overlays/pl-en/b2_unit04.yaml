    accepted_answers:
    - value: When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside.
      status: correct
    - value: When I arrived the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside.
      status: correct
    - value: Sure. When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside.
      status: correct
    - value: Sure. When I arrived the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside.
      status: correct
    feedback: To zdanie łączy *were setting up* i *had already moved*.
  en.b2.unit04.lesson04.exercise05.speak_recount:
    instruction: 'Opowiedz na głos o incydencie na miejscu, uwzględniając cztery elementy: tło, wcześniejsze zdarzenie, przerwaną czynność i szczęśliwe zakończenie.'
    accepted_answers:
    - value: When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside. While I was checking the sound system, the power went out. We delayed the start, but by the time guests entered, the lights had come back on.
      status: correct
    - value: When I arrived the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside. While I was checking the sound system, the power went out. We delayed the start, but by the time guests entered, the lights had come back on.
      status: correct
    feedback: Chodzi o wyraźne pokazanie warstw czasowych, a nie o dosłowne tłumaczenie z polskiego.
  en.b2.unit04.lesson04.exercise06.write_complex_recount:
    instruction: 'Napisz jako Simon pełną relację w trzech zdaniach: kiedy przyjechałeś, wolontariusze ustawiali krzesła, ale koordynator zdążył już przenieść sprzęt do środka; gdy sprawdzałeś system nagłośnienia, wyłączyło się zasilanie; opóźniliście start, ale zanim goście weszli, światła znów się zapaliły.'
    accepted_answers:
    - value: When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside. While I was checking the sound system, the power went out. We delayed the start, but by the time guests entered, the lights had come back on.
      status: correct
    - value: When I arrived the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside. While I was checking the sound system, the power went out. We delayed the start, but by the time guests entered, the lights had come back on.
      status: correct
    feedback: Ćwiczysz tu opowiadanie historii z przesuwającymi się warstwami czasowymi.
