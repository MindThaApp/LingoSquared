      - the
      - time
      - I
      - arrived
      - the
      - coordinator
      - had
      - already
      - moved
      - the
      - equipment
      - inside
      status: correct
    feedback: Właściwa kolejność to *By the time I arrived, the coordinator had already moved the equipment inside*.
  en.b2.unit04.lesson02.exercise04.reply_while_checking:
    instruction: Ktoś pyta, co się stało. Opowiedz jako Simon, że zasilanie wyłączyło się, gdy sprawdzałeś system nagłośnienia. Zacznij od „While”.
    accepted_answers:
    - value: While I was checking the sound system, the power went out.
      status: correct
    - value: While I was checking the sound system the power went out.
      status: correct
    feedback: Użyj *was checking* dla czynności w toku i simple past *went out* dla zdarzenia.
  en.b2.unit04.lesson02.exercise05.write_prior_event:
    instruction: Napisz, używając past perfect i „already”, że koordynator zdążył już przenieść sprzęt do środka.
    accepted_answers:
    - value: The coordinator had already moved the equipment inside.
      status: correct
    - value: The coordinator had already moved the equipment inside
      status: correct
    feedback: '*had already moved* jest tu lepsze niż dosłowne tłumaczenie polskiego „przeniósł” przez *has moved*.'
  en.b2.unit04.lesson03.exercise01.choose_earliest_event:
    instruction: Które zdarzenie miało miejsce najwcześniej w tekście?
    correct_option: the coordinator had moved the equipment inside
    distractors:
    - the volunteers were setting up chairs
    - the power went out
    - the team delayed the start
    accepted_answers:
    - value: the coordinator had moved the equipment inside
      status: correct
    feedback: To wydarzyło się, zanim Simon przyjechał.
  en.b2.unit04.lesson03.exercise02.choose_interrupted_action:
