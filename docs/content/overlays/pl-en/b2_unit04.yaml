        right: wolontariusze ustawiali krzesła
      - left: ongoing action
        right: Simon sprawdzał system nagłośnienia
      - left: foreground interruption
        right: zasilanie się wyłączyło
      - left: later consequence
        right: zespół opóźnił start
      - left: final resolved moment
        right: światła znów się zapaliły
      status: correct
    feedback: Zwróć uwagę na kontrast między tym, co trwało, co się wydarzyło i co zdarzyło się wcześniej.
  en.b2.unit04.lesson03.exercise04.write_earliest_event:
    instruction: Napisz, używając past perfect i „before”, że koordynator przeniósł sprzęt do środka, zanim przyjechał Simon.
    accepted_answers:
    - value: The coordinator had moved the equipment inside before Simon arrived.
      status: correct
    - value: The coordinator had moved the equipment inside before Simon arrived
      status: correct
    - value: Before Simon arrived, the coordinator had moved the equipment inside.
      status: correct
    - value: The coordinator had already moved the equipment inside before Simon arrived.
