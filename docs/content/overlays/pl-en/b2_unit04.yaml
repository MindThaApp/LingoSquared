  en.b2.unit04.lesson01.exercise05.write_foreground:
    instruction: Napisz angielskie słowo oznaczające główne zdarzenie, do którego zmierza opowieść.
    accepted_answers:
    - value: foreground
      status: correct
    - value: Foreground
      status: correct
    feedback: '*foreground* to główna warstwa opowieści.'
  en.b2.unit04.lesson02.exercise01.choose_past_perfect:
    instruction: Które wyrażenie pokazuje, że coś wydarzyło się jeszcze przed przyjazdem?
    correct_option: the coordinator had already moved the equipment inside
    distractors:
    - the volunteers were setting up the chairs
    - the power went out
    - I was checking the sound system
    accepted_answers:
    - value: the coordinator had already moved the equipment inside
      status: correct
    feedback: '*had already moved* to past perfect: wcześniej niż *I arrived*.'
  en.b2.unit04.lesson02.exercise02.choose_interruption:
    instruction: Które zdanie pokazuje trwającą czynność przerwaną przez główne zdarzenie?
    correct_option: While I was checking the sound system, the power went out.
    distractors:
    - By the time I arrived, the coordinator had already moved the equipment inside.
    - When I arrived, the volunteers were setting up the chairs.
    - The coordinator had already moved the equipment inside.
    accepted_answers:
    - value: While I was checking the sound system, the power went out.
      status: correct
    feedback: '*was checking* to czynność w toku; *went out* to przerwanie.'
  en.b2.unit04.lesson02.exercise03.order_by_the_time:
    instruction: 'Ułóż słowa we właściwej kolejności: „zanim przyjechałem, koordynator zdążył już przenieść sprzęt do środka”.'
    accepted_answers:
    - value:
