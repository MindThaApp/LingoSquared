course:
  title: Angielski B2
  description: 'Nauka angielskiego na poziomie B2: niuansowane rozmowy, argumenty, przypuszczenia i profesjonalna dyskusja, z wyjaśnieniami po polsku w swobodnym tonie.'
units:
  en.b2.unit04.narrative_time:
    title: By the time I arrived
lessons:
  en.b2.unit04.lesson01.timeline_roles:
    title: Tło, główne zdarzenie i to, co było wcześniej
  en.b2.unit04.lesson02.shifting_time:
    title: While I was checking, the power went out
  en.b2.unit04.lesson03.reading_an_incident_account:
    title: 'Czytanie: problem na miejscu wydarzenia'
  en.b2.unit04.lesson04.the_narrative_dialogue:
    title: Walk me through what happened
teaching:
  en.b2.unit04.lesson01.teach.background:
    title: background
    gloss: tło
    note: '*background* to to, co już trwało, albo kontekst. W angielskich opowieściach tło często podajesz w czasie past continuous.'
    example_gloss: Informacje o tle mówią, co już się działo.
  en.b2.unit04.lesson01.teach.foreground:
    title: foreground
    gloss: główne zdarzenie
    note: '*foreground* to zdarzenie, do którego zmierza opowieść. Po angielsku często używasz wtedy simple past, a nie automatycznie present perfect.'
    example_gloss: Główne zdarzenie to najważniejsze wydarzenie w opowieści.
  en.b2.unit04.lesson01.teach.prior:
    title: prior
    gloss: wcześniejszy, poprzedzający
    note: '*prior* oznacza wcześniejszy niż inny moment w przeszłości. Zwykle wyraża się to czasem past perfect: *had moved*.'
    example_gloss: Wcześniejsze zdarzenie miało miejsce przed innym zdarzeniem z przeszłości.
  en.b2.unit04.lesson01.teach.interrupt:
    title: interrupt
    gloss: przerwać
    note: '*interrupt* używasz, gdy krótkie zdarzenie wdziera się w coś, co trwa.'
    example_gloss: Nagły problem może przerwać jakąś czynność.
  en.b2.unit04.lesson01.teach.ongoing:
    title: ongoing
    gloss: trwający, w toku
    note: '*ongoing* pasuje do czynności trwającej w danym momencie, np. „właśnie sprawdzałem”. W angielskim wyraża się to zwykle konstrukcją *was/were + -ing*.'
    example_gloss: Trwająca czynność ciągnie się przez jakiś czas.
  en.b2.unit04.lesson01.teach.chronology:
    title: chronology
    gloss: chronologia, faktyczna kolejność
    note: '*chronology* to faktyczna kolejność zdarzeń, nawet jeśli opowieść przedstawia je w innym porządku.'
    example_gloss: Chronologia to rzeczywista kolejność zdarzeń.
  en.b2.unit04.lesson02.teach.by_the_time:
    title: Coś wydarzyło się wcześniej
    gloss: Zanim przyjechałem, koordynator zdążył już przenieść sprzęt do środka.
    note: '*had already moved* pokazuje, że to wydarzyło się przed *I arrived*. W polszczyźnie nie ma osobnego czasu zaprzeszłego w użyciu, więc kolejność zdarzeń trzeba tu zaznaczyć gramatycznie: po angielsku użyj *had moved*, a nie *has moved*.'
  en.b2.unit04.lesson02.teach.while_checking:
    title: Trwanie i przerwanie
    gloss: Gdy sprawdzałem system nagłośnienia, wyłączyło się zasilanie.
    note: '*was checking* oddaje czynność w toku („sprawdzałem”). Samo przerwanie to simple past: *went out*.'
  en.b2.unit04.lesson02.teach.when_arrived_setting:
    title: Przyjazd w trakcie czynności w tle
    gloss: Kiedy przyjechałem, wolontariusze ustawiali krzesła.
    note: Użyj *were setting up* dla tego, co trwało, gdy zaszło główne zdarzenie.
  en.b2.unit04.lesson02.teach.grammar_shifted_time:
    title: Warstwy czasowe w opowieści
    gloss: Użyj past continuous dla czynności w tle, simple past dla głównych zdarzeń, a past perfect dla tego, co wydarzyło się wcześniej niż inny moment w przeszłości.
    note: 'W opowieści po angielsku główne zdarzenia podajesz zwykle w simple past, a nie w present perfect: *the power went out*, a nie *has gone out*.'
  en.b2.unit04.lesson03.teach.venue:
    title: venue
    gloss: miejsce wydarzenia, lokal
    note: '*venue* to miejsce, w którym odbywa się wydarzenie.'
    example_gloss: Miejsce wydarzenia to lokal, w którym ono się odbywa.
  en.b2.unit04.lesson03.teach.delayed:
    title: delayed
    gloss: opóźniony, z opóźnieniem
    note: '*delayed* oznacza, że coś zaczyna się lub dzieje później, niż planowano.'
    example_gloss: Wydarzenie rozpoczęło się z dwudziestominutowym opóźnieniem.
  en.b2.unit04.lesson03.teach.reading_passage:
    title: 'Tekst do czytania: problem w miejscu wydarzenia'
    gloss: Simon nie opowiedział tej historii w ścisłym porządku chronologicznym. Zanim przyjechał na miejsce, koordynator przeniósł sprzęt do środka, ponieważ spodziewano się deszczu. Kiedy Simon przyjechał, wolontariusze ustawiali krzesła. Gdy sprawdzał system nagłośnienia, wyłączyło się zasilanie. Zadzwonił do administratora budynku, który wyjaśnił, że ekipa remontowa pracowała w pobliżu wcześniej tego ranka. Zespół opóźnił start o dwadzieścia minut, ale zanim goście weszli, światła znów się zapaliły.
    note: 'Zwróć uwagę na angielskie warstwy czasowe: *had moved* dla tego, co wcześniej, *were setting up* dla tła i *went out* dla głównego zdarzenia.'
  en.b2.unit04.lesson04.teach.q_walk_me_through:
    title: Harper prosi o opowieść
    gloss: 'Harper pyta: Możesz mi krok po kroku opowiedzieć, co się stało na miejscu?'
    note: '*walk me through* oznacza przeprowadzić kogoś krok po kroku przez jakieś wydarzenie.'
  en.b2.unit04.lesson04.teach.a_arrived_volunteers:
    title: Simon łączy warstwy czasowe
    gloss: 'Simon mówi: Jasne. Kiedy przyjechałem, wolontariusze ustawiali krzesła, ale koordynator zdążył już przenieść sprzęt do środka, bo spodziewano się deszczu.'
    note: Dobra opowieść łączy czynność w tle z wcześniejszym zdarzeniem.
  en.b2.unit04.lesson04.teach.q_equipment_safe:
    title: Harper sprawdza kolejność
    gloss: 'Harper pyta: Czyli sprzęt był bezpieczny, zanim tam dotarłeś?'
    note: 'Pytanie dotyczy kolejności: sprzęt był już bezpieczny przed przyjazdem Simona.'
  en.b2.unit04.lesson04.teach.a_power_went_out:
    title: Simon wspomina o przerwaniu
    gloss: 'Simon mówi: Dokładnie. Potem, gdy sprawdzałem system nagłośnienia, wyłączyło się zasilanie.'
    note: '*while I was checking* to czynność w toku; *the power went out* to jej przerwanie.'
  en.b2.unit04.lesson04.teach.q_after_that:
    title: Harper pyta o następny krok
    gloss: 'Harper pyta: Co zrobiłeś potem?'
    note: '*What did you do...?* używa simple past z *did* w pytaniu o zakończony krok.'
  en.b2.unit04.lesson04.teach.a_repair_crew:
    title: Simon podaje wcześniejsze tło
    gloss: 'Simon mówi: Zadzwoniłem do administratora budynku, a on powiedział mi, że ekipa remontowa pracowała w pobliżu wcześniej tego ranka.'
    note: '*had been working* pokazuje, że ta praca trwała już wcześniej tego ranka.'
  en.b2.unit04.lesson04.teach.q_event:
    title: Harper pyta o wydarzenie
    gloss: 'Harper pyta: A samo wydarzenie?'
    note: To krótkie pytanie dotyczy skutku dla wydarzenia.
  en.b2.unit04.lesson04.teach.a_delayed_start:
    title: Simon kończy opowieść
    gloss: 'Simon mówi: Opóźniliśmy start o dwadzieścia minut, ale zanim goście weszli, światła znów się zapaliły.'
    note: '*had come back on* wydarzyło się przed momentem wejścia gości.'
