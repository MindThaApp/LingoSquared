  en.a1.unit67.lesson04.teach.reading_passage:
    title: 'Tekst: Dobre wieści rodzinne'
    gloss: 'Dobre wieści rodzinne: Mia zapytała Daniela o jego rodzinę. Daniel powiedział, że u nich wszystko dobrze. Potem podzielił się dobrą nowiną: jego siostra urodziła dziecko. Mia powiedziała, że to wspaniała wiadomość. Daniel powiedział, że wkrótce razem z rodziną ich odwiedzą. Był dumny ze swojej siostry. Później Mia wysłała krótką wiadomość: Cieszę się razem z twoją rodziną.'
    note: '*shared good news* oznacza podzielił się dobrą nowiną.'
