  en.a1.unit06.lesson02.teach.your_father:
    title: your father
    gloss: twój ojciec / Pana ojciec
    note: '*your* to po polsku „twój” (nieformalnie) albo „Pana/Pani” (formalnie) – wybór zależy od rozmówcy. Niezależnie od tego polska forma zmienia się według rodzaju rzeczownika, który po niej stoi: tu „twój ojciec” (ojciec jest rodzaju męskiego), przy matce byłoby „twoja matka”. Angielskie *your* zawsze zostaje takie samo.'
