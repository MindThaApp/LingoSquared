teaching:
  en.b1.unit16.lesson01.teach.advice:
    title: advice
    gloss: rada
    note: '*advice* oznacza opinię o tym, co ktoś powinien zrobić.'
    example_gloss: Leila dała Danielowi pożyteczną radę.
  en.b1.unit16.lesson01.teach.suggest:
    title: suggest
    gloss: zasugerować, zaproponować
    note: '*suggest* oznacza podsunąć pomysł do rozważenia.'
    example_gloss: Leila zaproponowała sposób na opanowanie jego nadmiaru obowiązków.
  en.b1.unit16.lesson01.teach.overwhelmed:
    title: overwhelmed
    gloss: przytłoczony, przeciążony
    note: '*overwhelmed* oznacza poczucie, że ma się do zrobienia więcej, niż się jest w stanie udźwignąć.'
    example_gloss: Daniel czuł się przytłoczony dwoma projektami.
  en.b1.unit16.lesson01.teach.prioritize:
    title: prioritize
    gloss: ustalać priorytety, nadawać priorytet
    note: '*prioritize* oznacza zająć się najpierw najważniejszym zadaniem.'
    example_gloss: Daniel postanowił nadać priorytet projektowi z bliższym terminem.
  en.b1.unit16.lesson01.teach.workload:
    title: workload
    gloss: ilość obowiązków, obciążenie pracą
    note: '*workload* oznacza całą ilość pracy, którą ktoś musi wykonać.'
    example_gloss: Obciążenie pracą Daniela wzrosło po tym, jak w marcu dołączył do zespołu.
  en.b1.unit16.lesson01.teach.decline:
    title: decline
    gloss: odmówić, odrzucić
    note: '*decline* oznacza uprzejmie odrzucić propozycję lub ofertę.'
    example_gloss: Daniel mógł przyjąć radę albo uprzejmie ją odrzucić.
  en.b1.unit16.lesson02.teach.if_i_were_you:
    title: if I were you, I would + Grundform
    gloss: Na twoim miejscu porozmawiałbym ze swoim przełożonym.
    note: '*if I were you, I would* to konstrukcja warunku nierzeczywistego, której używa się do udzielania rad.'
  en.b1.unit16.lesson02.teach.you_should_prioritize:
    title: you should + Grundform
    gloss: Powinieneś nadać priorytet projektowi z bliższym terminem.
    note: '*you should* to bezpośrednia rekomendacja.'
  en.b1.unit16.lesson02.teach.how_about:
    title: how about + -ing
    gloss: Może poprosisz koleżankę albo kolegę o pomoc?
    note: '*how about + -ing* to łagodniejszy sposób składania propozycji.'
  en.b1.unit16.lesson02.teach.grammar_advice_forms:
    title: Formen, um Rat zu geben
    gloss: 'Rady i propozycje wyrażamy na kilka sposobów: If I were you, I would... (hipoteza nierzeczywista), You should... (bezpośrednia rekomendacja) i How about + -ing...? (łagodniejsza propozycja). Wybierz mocniejszą lub łagodniejszą formę, zależnie od tego, jak stanowczo chcesz zabrzmieć.'
    note: 'Forma: wybierz między hipotezą nierzeczywistą, bezpośrednią rekomendacją a łagodną propozycją.'
  en.b1.unit16.lesson03.teach.deadline:
    title: deadline
    gloss: termin (ostateczny)
    note: '*deadline* oznacza datę, do której coś musi być gotowe.'
    example_gloss: Bliższy termin Daniela przypada w najbliższy piątek.
  en.b1.unit16.lesson03.teach.that_makes_sense:
    title: that makes sense. I'll try it.
    gloss: Ma to sens. Wypróbuję to.
    note: '*that makes sense* pokazuje, że rozumiesz radę i ją przyjmujesz.'
    example_gloss: Ma to sens. Wypróbuję to w tym tygodniu.
  en.b1.unit16.lesson03.teach.reading_passage:
    title: 'Lesetext: Rat bei zu viel Arbeit'
    gloss: Cześć, Leila, czuję się w tym tygodniu przytłoczony. Prowadzę dwa projekty, a do tego mam jeszcze zajęcia wieczorowe. Masz jakąś radę? Cześć, Daniel, na twoim miejscu porozmawiałabym z przełożonym o obciążeniu pracą. Powinieneś też nadać priorytet projektowi z bliższym terminem. Może poprosisz Mię o pomoc przy drugim? Dzięki, ma to sens. Wypróbuję to i dam znać, jak poszło.
    note: Krótka, serdeczna rada między współpracownikami.
  en.b1.unit16.lesson04.teach.q_overwhelmed_two_projects:
    title: Daniel erklärt sein Problem
    gloss: 'Daniel mówi: Czuję się trochę przytłoczony. Prowadzę dwa projekty, a do tego trzy razy w tygodniu mam jeszcze zajęcia wieczorowe.'
    note: '*a little overwhelmed* opisuje stan, w którym ma się trochę za dużo pracy.'
  en.b1.unit16.lesson04.teach.a_talk_to_manager:
    title: Leila gibt ihren ersten Rat
    gloss: 'Leila mówi: Na twoim miejscu porozmawiałabym z przełożonym o obciążeniu pracą.'
    note: '*if I were you, I would* to hipotetyczna konstrukcja nierzeczywista.'
  en.b1.unit16.lesson04.teach.q_dont_want_to_seem:
    title: Daniel zögert
    gloss: 'Daniel mówi: To dobry pomysł, ale nie chcę sprawiać wrażenia, że sobie nie radzę.'
    note: '*I don''t want to seem like* wyraża obawę o to, jak się wygląda w oczach innych.'
  en.b1.unit16.lesson04.teach.a_prioritize_and_how_about:
    title: Leila macht zwei konkrete Vorschläge
    gloss: 'Leila mówi: Powinieneś najpierw nadać priorytet projektowi z bliższym terminem. Może poprosisz koleżankę albo kolegę o pomoc przy drugim?'
    note: '*you should* i *how about* łączą bezpośrednią i łagodną propozycję.'
  en.b1.unit16.lesson04.teach.q_ask_mia_this_week:
    title: Daniel nimmt den Rat an
    gloss: 'Daniel mówi: Podoba mi się to. Zapytam Mię, czy ma czas w tym tygodniu.'
    note: '*I like that* pokazuje, że przyjmujesz radę.'
  en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan:
    title: Leila bestätigt den Plan
    gloss: 'Leila mówi: Brzmi to jak solidny plan.'
    note: Krótkie, dodające otuchy zakończenie rozmowy.
