    note: '*would rather* znaczy, że coś robisz chętniej niż coś innego.'
    example_gloss: Wolałbym chodzić na kurs weekendowy.
  en.b1.unit11.lesson01.teach.if_i_were:
    title: if I were
    gloss: gdybym był
    note: '*if I were* wprowadza sytuację nierzeczywistą dotyczącą ciebie.'
    example_gloss: Gdybym był dziś wieczorem wolny, poszedłbym.
  en.b1.unit11.lesson01.teach.opportunity:
    title: opportunity
    gloss: okazja, szansa
    note: '*opportunity* znaczy dobra okazja, żeby coś zrobić.'
