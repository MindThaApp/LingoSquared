    title: would
    gloss: by (tryb warunkowy)
    note: '*would* + bezokolicznik wyraża wyobrażony skutek albo uprzejmą preferencję.'
    example_gloss: Zapisałbym się, gdybym miał więcej czasu.
  en.b1.unit11.lesson01.teach.would_rather:
