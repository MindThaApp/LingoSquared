  en.b1.unit11.lesson01.teach.take_a_chance:
    title: take a chance
    gloss: zaryzykować, spróbować
    note: '*take a chance* znaczy spróbować czegoś, nawet jeśli powodzenie nie jest pewne.'
    example_gloss: Gdyby kurs był tańszy, zaryzykowałaby.
  en.b1.unit11.lesson02.teach.more_time_course:
    title: Eine unwirkliche Situation in der Gegenwart
    gloss: Gdybym miał więcej czasu, poszedłbym na kurs projektowania.
    note: 'Po *if* w sytuacji nierzeczywistej dotyczącej teraźniejszości stoi czas przeszły: *If I had more time*. W polskim odpowiada temu tryb warunkowy po „gdyby”.'
  en.b1.unit11.lesson02.teach.cheaper_sign_up:
    title: if it were cheaper
    gloss: Gdyby był tańszy, zapisałbym się dziś.
    note: '*were* brzmi naturalnie w nierzeczywistym warunku, także przy *it*.'
  en.b1.unit11.lesson02.teach.grammar_unreal_present:
    title: Unwirkliche Bedingungen in der Gegenwart
    gloss: Gdyby był tańszy, zapisałbym się.
    note: 'Budowa: *if* + czas przeszły, potem *would* + bezokolicznik.'
  en.b1.unit11.lesson03.teach.sooner:
    title: sooner
    gloss: wcześniej
    note: '*sooner* znaczy wcześniej niż w rzeczywistości.'
    example_gloss: Gdyby wiedziała o tym wcześniej, zaoszczędziłaby więcej pieniędzy.
  en.b1.unit11.lesson03.teach.confident:
    title: confident
    gloss: pewny siebie, pełen wiary
    note: '*confident* znaczy, że czujesz, iż dobrze sobie z czymś poradzisz.'
    example_gloss: Gdyby Daniel się zapisał, Leila czułaby się pewniej.
  en.b1.unit11.lesson03.teach.reading_passage:
    title: 'Lesetext: eine verpasste Gelegenheit'
    gloss: 'Leila znalazła kurs projektowania, na który bardzo chce chodzić. Jest przydatny, ale drogi. Gdyby był tańszy, zapisałaby się dziś. Gdyby Daniel też chodził na te zajęcia, czułaby się pewniej. Żałuje tylko tego, że za późno: gdyby wcześniej dowiedziała się o kursie, zaoszczędziłaby więcej pieniędzy.'
    note: Krótki tekst z nierzeczywistymi warunkami dotyczącymi teraźniejszości i przeszłości.
  en.b1.unit11.lesson04.teach.q_take_if_cheaper:
    title: Mia stellt eine hypothetische Frage
    gloss: 'Mia mówi: Leila, czy zapisałabyś się na kurs projektowania, gdyby był tańszy?'
    note: Uprzejme pytanie hipotetyczne z *would*.
  en.b1.unit11.lesson04.teach.a_sign_up_today:
    title: Leila nennt das vorgestellte Ergebnis
    gloss: 'Leila mówi: Zdecydowanie. Gdyby był tańszy, zapisałabym się dziś.'
    note: '*If it were cheaper, I would...* opisuje, co zrobiłaby w innej sytuacji.'
  en.b1.unit11.lesson04.teach.q_daniel_joined:
    title: Mia schlägt ein weiteres Szenario vor
    gloss: 'Mia mówi: A gdyby Daniel też się zapisał?'
    note: '*What if...* wprowadza wyobrażoną możliwość.'
  en.b1.unit11.lesson04.teach.a_more_confident:
    title: Leila beschreibt ihr Gefühl
    gloss: 'Leila mówi: Gdyby Daniel się zapisał, czułabym się pewniej.'
    note: '*joined* stoi w czasie przeszłym, bo sytuacja jest tylko wyobrażona.'
  en.b1.unit11.lesson04.teach.q_would_rather_weekend:
    title: Mia nennt ihre Vorliebe
    gloss: 'Mia mówi: Wolałabym chodzić na kurs weekendowy niż na wieczorny.'
    note: '*would rather ... than ...* porównuje dwie preferencje.'
  en.b1.unit11.lesson04.teach.a_known_sooner:
    title: Leila spricht über ein Bedauern in der Vergangenheit
    gloss: 'Leila mówi: Ja też. Gdybym wcześniej o tym wiedziała, zaoszczędziłabym więcej pieniędzy.'
    note: '*if + past perfect, would have* + imiesłów (past participle) opisuje sytuację nierzeczywistą w przeszłości.'
