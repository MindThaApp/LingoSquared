teaching:
  en.a1.unit31.lesson01.teach.tall:
    title: tall
    gloss: wysoki
    note: '*tall* znaczy wysoki (o wzroście osoby).'
    example_gloss: Mój brat jest wysoki.
  en.a1.unit31.lesson01.teach.short:
    title: short
    gloss: niski
    note: '*short* znaczy tu niski (o osobie); *short* znaczy też „krótki", na przykład o włosach.'
    example_gloss: Moja siostra jest niska.
  en.a1.unit31.lesson01.teach.hair:
    title: hair
    gloss: włosy
    note: '*hair* znaczy włosy. Po angielsku to rzeczownik niepoliczalny: *her hair is long*, a nie *her hairs are long*.'
    example_gloss: Ona ma długie włosy.
  en.a1.unit31.lesson01.teach.blond:
    title: blond
    gloss: blond
    note: '*blond* znaczy blond.'
    example_gloss: Jego włosy są blond.
  en.a1.unit31.lesson01.teach.curly:
    title: curly
    gloss: kręcony
    note: '*curly* znaczy kręcony.'
    example_gloss: Leila ma kręcone włosy.
  en.a1.unit31.lesson02.teach.eyes:
