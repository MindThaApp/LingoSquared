    gloss: oczy
    note: '*eyes* znaczy oczy (liczba mnoga).'
    example_gloss: Mam brązowe oczy.
  en.a1.unit31.lesson02.teach.blue:
    title: blue
    gloss: niebieski
    note: '*blue* znaczy niebieski.'
    example_gloss: Jej oczy są niebieskie.
  en.a1.unit31.lesson02.teach.brown:
    title: brown
    gloss: brązowy
    note: '*brown* znaczy brązowy.'
    example_gloss: Moje oczy są brązowe.
  en.a1.unit31.lesson02.teach.green:
    title: green
    gloss: zielony
    note: '*green* znaczy zielony.'
    example_gloss: On ma zielone oczy.
  en.a1.unit31.lesson02.teach.glasses:
    title: glasses
    gloss: okulary
    note: '*glasses* znaczy okulary. To słowo zawsze stoi w liczbie mnogiej; *wears glasses* znaczy „nosi okulary".'
    example_gloss: Mój ojciec nosi okulary.
  en.a1.unit31.lesson02.teach.what_look_like:
    title: What does she look like?
    gloss: Jak ona wygląda?
    note: 'Uważaj na budowę pytania: po polsku pytasz po prostu „Jak ona wygląda?", bez czasownika pomocniczego. Po angielsku przy zwykłym czasowniku (*look*) zawsze potrzebujesz *does* lub *do*: *What does she look like?*, nigdy *What looks she like?*. Czasownika pomocniczego *does* zapominają uczący się najczęściej.'
  en.a1.unit31.lesson03.teach.dialogue_line1:
    title: "Początek Leili"
    gloss: 'Leila mówi: Mamy dziś nową koleżankę w pracy. Ma na imię Mia.'
    note: '*starting today* znaczy „od dzisiaj".'
  en.a1.unit31.lesson03.teach.dialogue_line2:
    title: "Pytanie Daniela"
    gloss: 'Daniel pyta: Jak ona wygląda?'
    note: 'Jeszcze raz czasownik pomocniczy: nie pomijaj *does* i nie przestawiaj po prostu podmiotu i czasownika.'
  en.a1.unit31.lesson03.teach.dialogue_line3:
    title: "Opis Leili"
    gloss: 'Leila mówi: Jest wysoka i ma kręcone, blond włosy.'
    note: '*She''s* to skrót od *she is*.'
  en.a1.unit31.lesson03.teach.dialogue_line4:
    title: "Dopytanie Daniela"
    gloss: 'Daniel pyta: Nosi okulary?'
    note: 'Tu też potrzebujesz *does*: *Does she wear glasses?*, a nie *Wears she glasses?*.'
  en.a1.unit31.lesson03.teach.dialogue_line5:
    title: "Odpowiedź Leili"
    gloss: 'Leila mówi: Tak, nosi. Ma też zielone oczy.'
    note: '*Yes, she does* to krótka odpowiedź twierdząca, w której powtarza się czasownik pomocniczy *does*.'
  en.a1.unit31.lesson03.teach.dialogue_line6:
    title: "Ostatnia uwaga Daniela"
    gloss: 'Daniel mówi: Okej, chyba widzę ją teraz przy drzwiach.'
    note: '*at the door* znaczy przy drzwiach.'
  en.a1.unit31.lesson04.teach.reading_passage:
    title: "Tekst o Danielu i Leili"
    gloss: Daniel i Leila to dobrzy przyjaciele, ale nie wyglądają tak samo. Daniel jest wysoki i ma krótkie, czarne włosy. Nosi okulary. Leila jest niska i ma długie, kręcone, brązowe włosy. Ma niebieskie oczy, a Daniel ma brązowe oczy. Oboje dużo się śmieją.
    note: '*don''t look the same* znaczy „nie wyglądają tak samo". Tu też potrzebny jest czasownik pomocniczy (*don''t* = *do not*), nawet w przeczeniu.'
