    title: computer
    gloss: komputer
    note: '*computer* znaczy komputer.'
    example_gloss: Mamy w domu komputer.
  en.a1.unit35.lesson01.teach.app:
    title: app
    gloss: aplikacja
    note: '*app* znaczy aplikacja.'
    example_gloss: Mam nową aplikację w telefonie.
  en.a1.unit35.lesson01.teach.camera:
    title: camera
    gloss: aparat / kamera
    note: '*camera* znaczy aparat fotograficzny lub kamera.'
    example_gloss: Ten aparat robi świetne zdjęcia.
  en.a1.unit35.lesson02.teach.make_a_call:
    title: make a call
    gloss: zadzwonić
    note: '*make a call* to stała kombinacja czasownika i rzeczownika, którą trzeba zapamiętać w całości. Po polsku wystarczy jeden czasownik, „zadzwonić”, bez osobnego słowa na *call*.'
    example_gloss: Co niedzielę dzwonię do brata.
  en.a1.unit35.lesson02.teach.send_a_text:
    title: send a text
    gloss: wysłać SMS-a / napisać wiadomość
    note: '*send a text* to, tak jak *make a call*, stała kombinacja czasownika i rzeczownika. Po polsku mówimy „wysłać SMS-a” albo „napisać wiadomość”, a po angielsku zwykle *send a text*.'
    example_gloss: Co rano wysyła SMS-a do przyjaciółki.
  en.a1.unit35.lesson02.teach.download_an_app:
    title: download an app
    gloss: pobrać aplikację
    note: '*download an app*: czasownik *download* działa podobnie jak polskie „pobrać”, więc to najłatwiejsza z trzech stałych kombinacji.'
    example_gloss: Co tydzień pobiera nową aplikację.
  en.a1.unit35.lesson02.teach.wifi:
    title: wifi
    gloss: wifi
    note: '*wifi* znaczy wifi.'
    example_gloss: Wifi u mnie w domu jest szybkie.
  en.a1.unit35.lesson02.teach.battery:
    title: battery
    gloss: bateria
    note: '*battery* znaczy bateria.'
    example_gloss: Bateria w moim telefonie prawie się skończyła.
  en.a1.unit35.lesson02.teach.how_use_phone_question:
    title: How do you use your phone?
    gloss: Jak używasz swojego telefonu?
    note: '*Do you use ...?* używa czasownika pomocniczego *do*, tak jak inne angielskie pytania.'
  en.a1.unit35.lesson03.teach.dialogue_line1:
    title: Narzekanie Mii
    gloss: 'Mia mówi: Mój telefon jest taki stary. Jest naprawdę wolny.'
    note: '*so* + przymiotnik (*so old*) wzmacnia znaczenie, podobnie jak „taki” lub „bardzo” po polsku.'
  en.a1.unit35.lesson03.teach.dialogue_line2:
    title: Rada Leili
    gloss: 'Leila mówi: Powinnaś kupić nowy. Do czego najczęściej go używasz?'
    note: '*What do you use it for most?* kończy się przyimkiem *for*. Po polsku przyimek stoi na początku pytania („Do czego go używasz?”), a po angielsku pytanie zaczyna się od *what*, a *for* zostaje na końcu.'
  en.a1.unit35.lesson03.teach.dialogue_line3:
    title: "Odpowiedź: Mia"
    gloss: 'Mia mówi: Głównie piszę SMS-y do siostry i robię zdjęcia.'
    note: '*text* może być też czasownikiem (*I text my sister*). To częstsze niż *send a text*; obie formy są poprawne.'
  en.a1.unit35.lesson03.teach.dialogue_line4:
    title: Jak Leila używa telefonu
    gloss: 'Leila mówi: Co weekend dzwonię z telefonu do rodziców. Używam też wielu aplikacji.'
    note: '*call* jako czasownik (*I call my parents*) to zwykły, potoczny sposób. *Make a call* to stała kombinacja z wcześniejszej lekcji.'
  en.a1.unit35.lesson03.teach.dialogue_line5:
    title: Pytanie Mii
    gloss: 'Mia pyta: Jakich aplikacji używasz?'
    note: '*Which apps do you use?*: *which* pyta o wybór spośród grupy (aplikacji), podobnie jak polskie „które” lub „jakie”.'
  en.a1.unit35.lesson03.teach.dialogue_line6:
    title: Leila's apps
    gloss: 'Leila mówi: Używam aplikacji kulinarnej i aplikacji z mapą. Chcesz je pobrać?'
    note: '*Do you want to ...?* używa *do*, mimo że *want* to zwykły czasownik.'
  en.a1.unit35.lesson03.teach.dialogue_line7:
    title: "Odpowiedź: Mia"
    gloss: 'Mia mówi: Tak, poproszę, wyślij mi nazwy!'
    note: '*please* stoi tu przed czasownikiem (*please send ...*) i sprawia, że prośba brzmi uprzejmiej.'
  en.a1.unit35.lesson04.teach.reading_passage:
    title: Tekst o Danielu, Leili i Mii
    gloss: Daniel, Leila i Mia używają telefonów na różne sposoby. Daniel nie lubi pisać SMS-ów; woli dzwonić do ludzi. Leila używa telefonu do map. Korzysta też z aplikacji kulinarnej, gdy próbuje nowych przepisów. Mia robi dużo zdjęć i wysyła je rodzinie. Wszyscy używają laptopów do pracy, a w weekendy rozmawiają z przyjaciółmi przez wideo.
    note: '*He prefers to call people instead*: *instead* na końcu zdania znaczy „zamiast tego” (czyli zamiast pisać SMS-y).'
