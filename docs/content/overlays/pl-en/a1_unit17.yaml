teaching:
  en.a1.unit17.lesson01.teach.do_you_want_to:
    title: Do you want to see a movie this weekend?
    gloss: Chcesz pójść w ten weekend do kina?
    note: Pytaniem *Do you want to...?* proponujesz jakieś zajęcie. Po *to* stoi czasownik w formie podstawowej, bez żadnej końcówki.
  en.a1.unit17.lesson01.teach.would_you_like_to:
    title: Would you like to go for a walk?
    gloss: Czy masz ochotę pójść na spacer?
    note: '*Would you like to...?* jest nieco grzeczniejszym wariantem *Do you want to...?* Odpowiada polskiemu grzecznemu „Czy miałbyś ochotę...?".'
  en.a1.unit17.lesson02.teach.sure_id_love_to:
    title: Sure, I'd love to!
    gloss: Jasne, chętnie!
    note: Wyrażeniem *I'd love to* przyjmujesz zaproszenie z entuzjazmem. *I'd* to skrót od *I would*; po *to* pomija się czasownik, bo już padł w pytaniu.
  en.a1.unit17.lesson02.teach.sorry_cant_busy:
    title: Sorry, I can't. I'm busy on Saturday.
    gloss: Przykro mi, nie mogę. W sobotę mam inne plany.
    note: To zdanie odmawia i podaje powód. *can't* to skrót od *cannot*.
  en.a1.unit17.lesson02.teach.maybe_another_time:
    title: Maybe another time?
    gloss: Może innym razem?
    note: Tak pokazujesz, że chętnie przyjdziesz przy innej okazji.
  en.a1.unit17.lesson03.teach.have_lunch:
    title: have lunch
    gloss: zjeść lunch
    note: '*have lunch* znaczy zjeść lunch (obiad w porze południowej). Jak przy innych posiłkach, nie ma przedimka.'
  en.a1.unit17.lesson03.teach.invitation_text:
    title: "Tekst zaproszenia"
    gloss: Cześć! Chcesz zjeść lunch w piątek? Co powiesz na 13:00 w kawiarni?
    note: To zaproszenie na lunch.
  en.a1.unit17.lesson04.teach.works_for_me:
    title: Sunday works for me.
    gloss: W niedzielę mi pasuje.
    note: '*works for me* znaczy, że coś dobrze pasuje.'
  en.a1.unit17.lesson04.teach.q_movie_weekend:
    title: "Pytanie o film"
    gloss: Daniel pyta, czy pójdą w ten weekend do kina
    note: To samo pytanie co w pierwszej lekcji.
  en.a1.unit17.lesson04.teach.a_love_to_what_day:
    title: "Zgoda i pytanie o dzień"
    gloss: 'Leila mówi: Jasne, chętnie! Który dzień?'
    note: Leila najpierw się zgadza, a potem pyta o dzień.
  en.a1.unit17.lesson04.teach.q_saturday:
    title: "Propozycja soboty"
    gloss: 'Daniel mówi: Co powiesz na sobotę?'
    note: Pytaniem *How about...?* proponujesz konkretny termin.
  en.a1.unit17.lesson04.teach.a_busy_sunday:
    title: "Odmowa i propozycja niedzieli"
    gloss: 'Leila mówi: Przykro mi, nie mogę. W sobotę jestem zajęta. A co z niedzielą?'
    note: Leila odrzuca sobotę i proponuje niedzielę.
