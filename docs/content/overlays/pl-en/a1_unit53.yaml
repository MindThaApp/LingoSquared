teaching:
  en.a1.unit53.lesson01.teach.rent:
    title: rent
    gloss: wypożyczać
    note: '*rent* znaczy wypożyczać lub wynajmować. W języku angielskim czasownik *rent* może oznaczać zarówno branie czegoś w odpłatne użytkowanie, jak i oddawanie tego komuś w odpłatne użytkowanie — właściwe znaczenie wynika z kontekstu.'
    example_gloss: Chcę wypożyczyć rower.
  en.a1.unit53.lesson01.teach.deposit:
    title: deposit
    gloss: kaucja
    note: '*deposit* znaczy kaucja — pieniądze wpłacane z góry, które otrzymasz z powrotem, jeśli oddasz rower bez uszkodzeń.'
    example_gloss: Kaucja wynosi dwadzieścia dolarów.
  en.a1.unit53.lesson01.teach.return:
    title: return
    gloss: zwracać
    note: '*return* oznacza tutaj oddanie czegoś, a nie powrót.'
    example_gloss: Proszę zwrócić rower dzisiaj.
  en.a1.unit53.lesson01.teach.hour:
    title: hour
    gloss: godzina
    note: '*hour* znaczy godzina.'
    example_gloss: Kosztuje to dziesięć dolarów za godzinę.
  en.a1.unit53.lesson01.teach.size:
    title: size
    gloss: rozmiar
    note: '*size* znaczy rozmiar.'
    example_gloss: Jakiego rozmiaru Pan/Pani potrzebuje?
  en.a1.unit53.lesson01.teach.helmet:
    title: helmet
    gloss: kask
    note: '*helmet* znaczy kask.'
    example_gloss: Czy ma Pan/Pani kask?
  en.a1.unit53.lesson02.teach.id_like_to_rent_a_bike:
    title: I'd like to rent a bike, please.
    gloss: Chciałbym/Chciałabym wypożyczyć rower.
    note: '*I''d like to* (skrócona forma *I would like to*) to uprzejmy sposób wyrażania prośby — brzmi grzeczniej niż bezpośrednie *I want*.'
  en.a1.unit53.lesson02.teach.how_much_does_it_cost_per_hour:
    title: How much does it cost per hour?
    gloss: Ile to kosztuje za godzinę?
    note: W wyrażeniu *does it cost* występuje czasownik posiłkowy *does*, ponieważ czasownikiem głównym jest *cost* — to taka sama konstrukcja z *do* jak w innych angielskich pytaniach.
  en.a1.unit53.lesson02.teach.i_need_a_small_bike:
    title: I need a small bike.
    gloss: Potrzebuję małego roweru.
    note: W wyrażeniu *need a small bike* po czasowniku *need* występuje bezpośrednio rzeczownik. Po polsku zwykle mówimy „potrzebować czegoś”, więc rzeczownik przyjmuje dopełniacz.
  en.a1.unit53.lesson02.teach.can_i_have_a_helmet:
    title: Can I have a helmet, please?
    gloss: Czy mogę prosić o kask?
    note: '*Can I have ...?* to utarty, uprzejmy sposób proszenia o coś w sklepie. Nie należy tłumaczyć go dosłownie; po polsku naturalnie powiemy „Czy mogę prosić o...?”.'
  en.a1.unit53.lesson02.teach.when_do_i_need_to_return_it:
    title: When do I need to return it?
    gloss: Kiedy muszę go zwrócić?
    note: W konstrukcji *do I need to* czasownik posiłkowy *do* służy do utworzenia pytania.
  en.a1.unit53.lesson02.teach.its_ten_dollars_an_hour:
    title: It's ten dollars an hour.
    gloss: To kosztuje dziesięć dolarów za godzinę.
    note: '*an hour* znaczy tutaj „za godzinę” — rodzajnik *an* ma w tym wyrażeniu znaczenie „za”, podobnie jak *a* przy innych jednostkach czasu.'
  en.a1.unit53.lesson03.teach.dialogue_line1:
    title: Pracownik wypożyczalni wita klientki
    gloss: 'Pracownik wypożyczalni mówi: Dzień dobry! W czym mogę dziś paniom pomóc?'
    note: '*How can I help you today?* to utarte, uprzejme powitanie używane w sklepach i punktach usługowych.'
  en.a1.unit53.lesson03.teach.dialogue_line2:
    title: Prośba Mii
    gloss: 'Mia mówi: Chciałybyśmy wypożyczyć dwa rowery. Chcemy pojeździć wzdłuż rzeki.'
    note: W wyrażeniu *We'd like to rent* czasownik *rent* oznacza tutaj wypożyczenie czegoś ze sklepu, a nie oddanie czegoś komuś do odpłatnego użytkowania.
  en.a1.unit53.lesson03.teach.dialogue_line3:
    title: Pracownik wypożyczalni pyta o rozmiar
    gloss: 'Pracownik wypożyczalni mówi: Oczywiście. Jakiego rozmiaru panie potrzebują?'
    note: W pytaniu *What size do you need?* czasownik posiłkowy *do* służy do utworzenia formy pytającej.
  en.a1.unit53.lesson03.teach.dialogue_line4:
    title: Rozmiar Leili
    gloss: 'Leila mówi: Potrzebuję małego.'
    note: '*one* zastępuje tutaj słowo *bike*, aby nie trzeba było go powtarzać. Po polsku można w takiej sytuacji pominąć rzeczownik i powiedzieć po prostu „małego”, natomiast po angielsku potrzebne jest osobne słowo *one*.'
  en.a1.unit53.lesson03.teach.dialogue_line5:
    title: Rozmiar Mii
    gloss: 'Mia mówi: A ja potrzebuję średniego.'
    note: Także tutaj *one* zastępuje słowo *bike*, podobnie jak w poprzednim zdaniu Leili.
  en.a1.unit53.lesson03.teach.dialogue_line6:
    title: Cena i kaucja
    gloss: 'Pracownik wypożyczalni mówi: Świetnie, oto wasze rowery. Koszt to dziesięć dolarów za godzinę, a kaucja wynosi dwadzieścia dolarów.'
    note: To zdanie zawiera dwie odrębne informacje — stawkę godzinową i wysokość kaucji. Zwróć uwagę, aby ich nie pomylić.
  en.a1.unit53.lesson03.teach.dialogue_line7:
    title: Mia pyta o zwrot
    gloss: 'Mia mówi: Kiedy musimy je zwrócić?'
    note: '*them* odnosi się tutaj do rowerów, czyli do rzeczownika w liczbie mnogiej.'
  en.a1.unit53.lesson03.teach.dialogue_line8:
    title: Termin zwrotu
    gloss: 'Pracownik wypożyczalni mówi: Proszę je zwrócić najpóźniej o piątej.'
    note: '*by five o''clock* znaczy najpóźniej o piątej, a więc nie po tej godzinie.'
  en.a1.unit53.lesson03.teach.dialogue_line9:
    title: Leila dziękuje pracownikowi wypożyczalni
    gloss: 'Leila mówi: Świetnie, dziękujemy!'
    note: '*Great, thank you!* to krótki, typowy sposób uprzejmego zakończenia rozmowy.'
  en.a1.unit53.lesson04.teach.reading_passage:
    title: Tekst o wycieczce rowerowej wzdłuż rzeki
    gloss: Pewnego ciepłego popołudnia Mia zaprosiła Leilę na przejażdżkę rowerową wzdłuż rzeki niedaleko swojego mieszkania. Żadna z nich nie miała roweru, więc razem poszły do wypożyczalni. Pracownik zapytał, jakiego rozmiaru potrzebują. Leila wzięła mały rower, a Mia średni. Wypożyczenie kosztowało dziesięć dolarów za godzinę, a kaucja za oba rowery wynosiła dwadzieścia dolarów. Musiały zwrócić rowery najpóźniej o piątej. Trasa wzdłuż rzeki była piękna. Widziały ludzi spacerujących z psami i cieszących się słoneczną pogodą. Zwróciły rowery dokładnie na czas i odzyskały kaucję. Później opowiedziały Danielowi o wycieczce, a on powiedział, że następnym razem chciałby do nich dołączyć.
    note: '*owned* to forma czasu przeszłego czasownika *own* (mieć na własność) — *Neither of them owned a bike* znaczy, że żadna z nich nie miała roweru.'
