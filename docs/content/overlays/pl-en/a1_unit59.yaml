    gloss: 'Krótka wizyta w banku: Pewnego ranka Mia i Leila poszły razem do banku. Mia chciała sprawdzić saldo, a Leila potrzebowała gotówki. Pracownik powiedział, że bankomat jest na zewnątrz. Leila użyła karty i wypłaciła dwadzieścia dolarów. Mia wpisała PIN i sprawdziła saldo. Zanim wyszły, przeczytały komunikat. Bank był czynny od 9:00 do 16:00, a limit wypłaty wynosił $100. Mia powiedziała, że wizyta była łatwa.'
    note: '*took out* to czas przeszły od *take out* w znaczeniu wypłacić pieniądze.'
