course:
  title: Angielski B2
  description: 'Nauka angielskiego na poziomie B2: niuansowane rozmowy, argumenty, przypuszczenia i profesjonalna dyskusja, z wyjaśnieniami po polsku w swobodnym tonie.'
units:
  en.b2.unit05.register:
    title: Same message, different register
lessons:
  en.b2.unit05.lesson01.audience_and_formality:
    title: Nieformalnie, profesjonalnie i formalnie
  en.b2.unit05.lesson02_same_request_three_ways:
    title: Can you, could we, I would be grateful
  en.b2.unit05.lesson03.reading_same_message:
    title: 'Czytanie: trzy grupy odbiorców'
  en.b2.unit05.lesson04.the_register_dialogue:
    title: To a friend, yes. To the clinic, no.
teaching:
  en.b2.unit05.lesson01.teach.register:
    title: Register
    gloss: rejestr, poziom formalności języka
    note: '*register* to stopień formalności lub nieformalności twojej wypowiedzi. Angielski nie ma podziału na ty i Pan/Pani, jak polski; ton wynika głównie z doboru sformułowań.'
    example_gloss: Rejestr zmienia się, gdy zmieniają się odbiorcy.
  en.b2.unit05.lesson01.teach.casual:
    title: casual
    gloss: nieformalny, swobodny
    note: '*casual* pasuje do przyjaciela lub znajomego. Jest bardziej bezpośredni, ale nie musi być przez to niegrzeczny.'
    example_gloss: Nieformalna wiadomość pasuje do przyjaciela.
  en.b2.unit05.lesson01.teach.professional:
    title: professional
    gloss: profesjonalny, uprzejmy w sposób rzeczowy
    note: '*professional* pasuje do kolegi z pracy: jest uprzejmy i jasny, ale nie przesadnie formalny.'
    example_gloss: Profesjonalna wiadomość pasuje do kolegi z pracy.
  en.b2.unit05.lesson01.teach.formal:
    title: formal
    gloss: formalny, oficjalny
    note: '*formal* pasuje do instytucji. W angielskim osiąga się to często przez dłuższe, bardziej pośrednie prośby.'
    example_gloss: Formalna wiadomość pasuje do instytucji.
  en.b2.unit05.lesson01.teach.audience:
    title: audience
    gloss: odbiorcy, adresaci
    note: '*audience* to osoba lub grupa, do której piszesz albo mówisz.'
    example_gloss: Twoi odbiorcy wpływają na dobór słów.
  en.b2.unit05.lesson01.teach.institution:
    title: institution
    gloss: instytucja, organizacja
    note: '*institution* to organizacja taka jak klinika, bank czy uniwersytet.'
    example_gloss: Klinika jest instytucją.
  en.b2.unit05.lesson02.teach.formal_request:
    title: Formalna prośba
    gloss: Będę wdzięczny, jeśli będą Państwo mogli potwierdzić, czy mój termin można przesunąć na piątek.
    note: '*I would be grateful if you could...* jest formalne. Angielski nie potrzebuje do tego innego słowa zamiast *you*; uprzejmość tkwi w całej konstrukcji.'
  en.b2.unit05.lesson02.teach.casual_request:
    title: Nieformalna prośba
    gloss: Możesz przesunąć to na piątek?
    note: '*Can you...?* jest w porządku wobec przyjaciela, ale w kontakcie z instytucją łatwo brzmi zbyt bezpośrednio.'
  en.b2.unit05.lesson02.teach.professional_request:
    title: Profesjonalna prośba
    gloss: Czy moglibyśmy przesunąć termin na piątek, jeśli nadal ci to odpowiada?
    note: '*Could we...?* brzmi uprzejmie i partnersko wobec kolegi z pracy.'
  en.b2.unit05.lesson02.teach.to_whom:
    title: Dear scheduling team,
    gloss: Szanowny zespole ds. planowania,
    note: '*Dear...* to zwykły formalny początek wiadomości. Odpowiada mniej więcej polskiemu „Szanowni Państwo”, ale brzmi mniej uroczyście.'
  en.b2.unit05.lesson02.teach.grammar_register_shift:
    title: Zmiana rejestru
    gloss: Gdy zmieniasz rejestr, treść pozostaje taka sama. Nieformalny angielski może używać pytań wprost. Angielski profesjonalny często używa could. Angielski formalny często używa I would be grateful if you could.
    note: 'Nie myśl tylko o polskim podziale na ty i Pan/Pani: w angielskim zmienia się całe zdanie.'
  en.b2.unit05.lesson03.teach.stiff:
    title: stiff
    gloss: sztywny, zbyt formalny
    note: '*stiff* oznacza, że wiadomość brzmi niepotrzebnie formalnie jak na daną sytuację.'
    example_gloss: Sztywna wiadomość brzmi zbyt formalnie jak na tę sytuację.
  en.b2.unit05.lesson03.teach.appropriate:
    title: appropriate
    gloss: stosowny, odpowiedni
    note: '*appropriate* oznacza, że sformułowanie pasuje do odbiorców i sytuacji.'
    example_gloss: Odpowiednia wiadomość pasuje do odbiorców.
  en.b2.unit05.lesson03.teach.reading_passage:
    title: 'Tekst do czytania: ta sama wiadomość, trzech odbiorców'
    gloss: 'Nina musi przesunąć termin na piątek. Do przyjaciela pisze: Can you move it to Friday? Wiadomość jest bezpośrednia i nieformalna. Do kolegi z pracy pisze: Could we move the appointment to Friday if that still works for you? Wiadomość jest profesjonalna i uprzejma. Do kliniki pisze: I would be grateful if you could confirm whether my appointment can be moved to Friday. Treść we wszystkich trzech tekstach jest taka sama, ale rejestr zmienia się wraz z odbiorcą.'
    note: W angielskim rejestr zmienia się przez sformułowanie, a nie przez osobną formę grzecznościową zamiast ty.
  en.b2.unit05.lesson04.teach.q_need_ask:
    title: Nina pyta o sformułowanie
    gloss: 'Nina mówi: Muszę zapytać o przesunięcie mojego terminu. Czy mogę po prostu napisać: „Can you move it?”'
    note: '*just write* pokazuje, że ma wątpliwości, czy bezpośrednia forma pasuje.'
  en.b2.unit05.lesson04.teach.a_too_casual:
    title: Oscar zwraca uwagę na rejestr
    gloss: 'Oscar mówi: Do przyjaciela tak. Do kliniki to brzmi zbyt nieformalnie.'
    note: Także tutaj po angielsku używasz po prostu *you*, ale samo zdanie jest zbyt bezpośrednie wobec kliniki.
  en.b2.unit05.lesson04.teach.q_colleague:
    title: Nina pyta o rejestr dla kolegi z pracy
    gloss: 'Nina pyta: Co napisałbyś do kolegi z pracy?'
    note: Kolega z pracy wymaga rejestru profesjonalnego, a nie maksymalnie formalnego.
  en.b2.unit05.lesson04.teach.a_colleague_request:
    title: Oscar podaje wersję dla kolegi z pracy
    gloss: 'Oscar mówi: Napisałbym: „Could we move the appointment to Friday if that still works for you?”'
    note: '*Could we* i *if that still works for you* łagodzą prośbę.'
  en.b2.unit05.lesson04.teach.q_clinic:
    title: Nina pyta o klinikę
    gloss: 'Nina pyta: A do kliniki?'
    note: Instytucja wymaga bardziej formalnej konstrukcji prośby.
  en.b2.unit05.lesson04.teach.a_clinic_request:
    title: Oscar podaje wersję formalną
    gloss: 'Oscar mówi: Napisałbym: „I would be grateful if you could confirm whether my appointment can be moved to Friday.”'
    note: Ta wersja nie żąda działania wprost, tylko prosi o potwierdzenie.
  en.b2.unit05.lesson04.teach.q_same_message:
    title: Nina podsumowuje
    gloss: 'Nina mówi: Ta sama wiadomość, inny rejestr.'
    note: 'Treść pozostaje ta sama: przesunięcie terminu na piątek.'
  en.b2.unit05.lesson04.teach.a_content_stays:
    title: Oscar potwierdza
    gloss: 'Oscar mówi: Dokładnie. Treść pozostaje taka sama, ale zmienia się poziom formalności.'
    note: To sedno panowania nad rejestrem na poziomie B2.
