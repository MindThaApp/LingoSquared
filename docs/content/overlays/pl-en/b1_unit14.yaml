    title: Szef zespołu prosi o krótkie spotkanie
    gloss: 'Kierownik zespołu mówi: Dobry pomysł. Czy moglibyśmy może zmieścić to spotkanie w trzydziestu minutach?'
    note: '*could we possibly* uprzejmie prosi o coś, co obie strony zrobią razem.'
  en.b1.unit14.lesson04.teach.a_questions_in_advance:
    title: Mia prosi o coś na następny raz
    gloss: 'Mia mówi: Postaram się. Byłabym wdzięczna, gdyby następnym razem wszyscy wysyłali pytania z wyprzedzeniem.'
    note: '*I would appreciate it if* mówi, że ktoś byłby wdzięczny.'
  en.b1.unit14.lesson04.teach.q_fair_request_followup:
    title: Szef zespołu zgadza się i obiecuje wrócić do sprawy
    gloss: 'Kierownik zespołu mówi: To uzasadniona prośba. Przed następnym spotkaniem wyślę przypomnienie.'
    note: '*follow up* oznacza tu: wrócić do tematu później.'
  en.b1.unit14.lesson04.teach.a_send_updated_agenda:
    title: Mia kończy potwierdzeniem
    gloss: 'Mia mówi: Dziękuję. Zaktualizowany porządek obrad wyślę dziś po południu.'
    note: Krótkie, uprzejme zakończenie rozmowy.
