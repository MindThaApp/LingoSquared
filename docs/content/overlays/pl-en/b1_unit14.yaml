    title: I would appreciate it if
    gloss: byłbym/byłabym wdzięczny/wdzięczna, gdyby
    note: '*I would appreciate it if* mówi, że ktoś byłby wdzięczny, gdyby ktoś inny coś zrobił.'
    example_gloss: Będę wdzięczny/wdzięczna, jeśli wkrótce wyślesz notatki ze spotkania.
