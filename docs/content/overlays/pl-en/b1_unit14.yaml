    note: '*I was wondering if you could* to pośredni, uprzejmy sposób zadawania pytania.'
  en.b1.unit14.lesson02.teach.grammar_softened_requests:
    title: Złagodzone prośby w pracy
    gloss: W oficjalnych prośbach w pracy używaj złagodzonej formy warunkowej, takiej jak Would it be possible to... lub I was wondering if..., zamiast bezpośredniego rozkazu. Takie formy brzmią uprzejmiej niż Move the meeting czy Review my report.
    note: 'Forma: użyj złagodzonej formy warunkowej zamiast bezpośredniego rozkazu.'
