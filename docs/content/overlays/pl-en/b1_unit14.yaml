  en.b1.unit14.lesson03.teach.reading_passage:
    title: 'Tekst: wiadomość przed spotkaniem'
    gloss: Cześć Daniel, mam nadzieję, że u ciebie wszystko dobrze. Czy byłoby możliwe dodać aktualizację budżetu do porządku obrad jutrzejszego spotkania? Byłabym wdzięczna, gdybyś zabrał ze sobą najnowsze liczby. Czy moglibyśmy może zacząć dziesięć minut wcześniej, żebyśmy potem mieli czas na pytania? Dziękuję, Mia
    note: Krótka, profesjonalna wiadomość ze złagodzonymi prośbami.
  en.b1.unit14.lesson04.teach.q_start_budget_update:
    title: Szef zespołu uprzejmie otwiera spotkanie
    gloss: 'Kierownik zespołu mówi: Dzień dobry, Mio. Czy byłoby możliwe, żebyśmy dziś zaczęli od aktualizacji budżetu?'
    note: '*would it be possible to* uprzejmie pyta o kolejność na spotkaniu.'
  en.b1.unit14.lesson04.teach.a_add_new_client:
    title: Mia ma dodatkową prośbę
    gloss: 'Mia mówi: Oczywiście. Zastanawiałam się, czy moglibyśmy też dodać do porządku obrad nowego klienta.'
    note: '*I was wondering if we could* to pośredni, uprzejmy sposób składania propozycji.'
