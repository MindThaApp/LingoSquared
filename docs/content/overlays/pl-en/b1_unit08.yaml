  en.b1.unit08.lesson03.teach.reading_passage:
    title: 'Tekst: plan na wieczór'
    gloss: Daniel ma staranną wieczorną rutynę. Gdy wraca do domu, najpierw sprawdza pocztę. Po sprawdzeniu poczty zamyka drzwi wejściowe na klucz. Zanim zabierze się do kolacji, myje ręce i sprząta ze stołu. Kiedy Mia przyjeżdża, kuchnia jest już przygotowana, a jedzenie ciepłe.
    note: Krótki tekst z użyciem *when*, *after*, *before* i *by the time*.
