    title: Leila podaje moment
    gloss: 'Leila mówi: Świetnie. Zanim Mia przyjedzie, wszystko powinno być gotowe.'
    note: '*by the time* oznacza, że wszystko ma być gotowe najpóźniej w tym momencie.'
