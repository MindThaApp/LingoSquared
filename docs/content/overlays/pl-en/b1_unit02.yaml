  en.b1.unit02.lesson01.teach.license:
    title: license
    gloss: prawo jazdy
    note: '*license* oznacza tu oficjalny dokument uprawniający do prowadzenia pojazdu (skrót od *driver''s license*). W brytyjskim angielskim rzeczownik pisze się *licence*.'
