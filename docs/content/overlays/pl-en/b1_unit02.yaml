    gloss: Zdołałem wypełnić formularz w dziesięć minut.
    note: '*managed to* podkreśla, że coś się udało, często mimo wysiłku.'
  en.b1.unit02.lesson02.teach.grammar_present_past:
    title: Gegenwart und Vergangenheit mit 'be able to'
    gloss: Mogę go przedłużyć. Mogłem go przedłużyć. Mógłbym ci pomóc.
    note: '*am able to* (teraz), *was able to* (przeszłość) i *would be able to* (sytuacja hipotetyczna lub propozycja) to formy tej samej konstrukcji.'
