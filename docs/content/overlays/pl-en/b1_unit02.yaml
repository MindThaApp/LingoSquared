    title: Daniel denkt an nächstes Mal
    gloss: 'Daniel mówi: Następnym razem mógłbym zaoszczędzić czas, gdybym też załatwił to online.'
    note: '*would be able to* wyraża tu hipotetyczną możliwość w przyszłości.'
  en.b1.unit02.lesson04.teach.q_would_help:
    title: Leila bietet Hilfe an
    gloss: 'Leila mówi: Mogłabym ci pomóc następnym razem, jeśli chcesz.'
    note: '*would be able to* służy tu do grzecznej propozycji.'
  en.b1.unit02.lesson04.teach.a_thanks:
    title: Daniel bedankt sich
    gloss: 'Daniel mówi: Dzięki, chętnie.'
    note: '*I''d like that* to naturalny sposób, żeby z wdzięcznością przyjąć propozycję.'
