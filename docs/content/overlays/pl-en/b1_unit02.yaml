  en.b1.unit02.lesson03.teach.reading_passage:
    title: 'Lesetext: das neue System'
    gloss: W zeszłym roku ludzie nie mogli przedłużyć prawa jazdy online. Wszyscy musieli iść osobiście do urzędu. W tym roku system się zmienił. Teraz ludzie mogą załatwić wszystko z domu. Moja przyjaciółka Mia załatwiła swoje w dziesięć minut.
    note: Krótki tekst o tym, jak nowy system ułatwia przedłużanie dokumentów.
  en.b1.unit02.lesson04.teach.q_were_you_able:
    title: Leila fragt nach dem Führerschein
    gloss: 'Leila mówi: Czy mogłeś przedłużyć prawo jazdy online?'
    note: '*were you able to* pyta o możliwość w przeszłości.'
