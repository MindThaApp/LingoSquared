    title: 'Daniels Antwort: online ging es nicht'
    gloss: 'Daniel mówi: Nie, nie mogłem. Musiałem iść do urzędu osobiście.'
    note: '*wasn''t able to* to mówiona forma skrócona od *was not able to*.'
  en.b1.unit02.lesson04.teach.q_really_managed:
    title: Leila erzählt von ihrer Erfahrung
    gloss: 'Leila mówi: Naprawdę? Mnie udało się to załatwić online w dziesięć minut.'
    note: '*managed to* podkreśla, że Leili udało się to szybko i bez problemów.'
