    gloss: hydraulik
    note: '*plumber* to osoba, która naprawia problemy z rurami i instalacją wodną.'
    example_gloss: Zarządca budynku przysłał hydraulika, który to naprawi.
  en.a2.unit29.lesson01.teach.repair:
    title: repair
    gloss: naprawa
    note: '*repair* oznacza doprowadzenie czegoś zepsutego do porządku.'
    example_gloss: Naprawa odbędzie się jutro po południu.
