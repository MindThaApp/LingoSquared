    title: Słownictwo związane z mieszkaniem
    gloss: kuchnia, mieszkanie, łazienka
    note: Te słowa znasz już z lekcji 24; tutaj je powtarzamy.
    example_gloss:
    - Wyciek jest w kuchni.
    - Moje mieszkanie ma dwie sypialnie.
    - Łazienka jest tuż obok kuchni.
  en.a2.unit29.lesson02.teach.report_problem:
    title: Zgłaszanie problemu
    gloss: Chciałbym zgłosić problem z moim zlewem w kuchni.
    note: Za pomocą *I'd like to report...* uprzejmie zgłaszasz problem.
  en.a2.unit29.lesson02.teach.leaking_since_morning:
    title: Wyjaśnianie, od kiedy trwa problem
    gloss: Cieknie od dziś rano.
    note: 'Gdy coś trwa od jakiegoś czasu, angielski używa *It''s been leaking since...*, tak jak w *I''ve had ... for* w lekcji 28. Po polsku wystarczy czas teraźniejszy: cieknie od ...'
  en.a2.unit29.lesson02.teach.ask_repair_timing:
    title: Pytanie, kiedy będzie naprawa
    gloss: Kiedy ktoś może przyjść i to naprawić?
    note: Za pomocą *When can someone come to fix it?* uprzejmie pytasz, kiedy może odbyć się naprawa.
  en.a2.unit29.lesson03.teach.between_2_4:
    title: between 2pm and 4pm
    gloss: między 14 a 16
    note: '*between 2pm and 4pm* oznacza między 14 a 16. W angielskim godziny zapisuje się z *pm* zamiast w systemie 24-godzinnym.'
    example_gloss: Hydraulik przyjdzie między 14 a 16.
  en.a2.unit29.lesson03.teach.confirmation_text:
    title: Treść komunikatu o naprawie
    gloss: Zgłoszenie o cieknącym zlewie w kuchni zostało przyjęte. Jutro między 14 a 16 przyjdzie hydraulik. Numer naprawy to 6180.
    note: 'Oficjalne potwierdzenie: zgłoszenie zostało przyjęte, a do tego podano godzinę i numer.'
  en.a2.unit29.lesson04.teach.q_report_problem:
    title: Zgłaszanie problemu dozorcy
    gloss: 'Daniel mówi: Chciałbym zgłosić problem z moim zlewem w kuchni.'
    note: To samo zdanie, co w lekcji 2.
  en.a2.unit29.lesson04.teach.q_whats_wrong_sink:
    title: Pytanie o problem ze zlewem
    gloss: 'Zarządca budynku pyta: Co się dzieje ze zlewem?'
    note: Ta sama forma pytania, której lekarz użył w lekcji 28 (*What's wrong?*), tym razem dotyczy zlewu, a nie zdrowia.
  en.a2.unit29.lesson04.teach.a_leaking_since_morning_and_ask_timing:
    title: Odpowiedź Daniela o czasie trwania i pytanie o termin naprawy
    gloss: 'Daniel mówi: Cieknie od dziś rano. Kiedy ktoś może przyjść i to naprawić?'
    note: Dwa zdania z lekcji 2, tym razem jedno po drugim.
  en.a2.unit29.lesson04.teach.a_send_plumber:
    title: Odpowiedź dozorcy o hydrauliku
    gloss: 'Zarządca budynku mówi: Rozumiem. Jutro między 14 a 16 przyślę hydraulika.'
    note: Zarządca budynku podaje termin naprawy po wysłuchaniu opisu problemu.
  en.a2.unit29.lesson04.teach.q_need_to_be_home:
    title: Pytanie, czy trzeba być w domu
    gloss: 'Daniel pyta: Czy muszę być w domu?'
    note: Daniel zadaje to pytanie po usłyszeniu terminu naprawy.
  en.a2.unit29.lesson04.teach.a_confirm_window_number:
    title: Ostatnie potwierdzenie dozorcy
    gloss: 'Zarządca budynku mówi: Tak, proszę być w domu między 14 a 16. Oto Pana numer naprawy: 6180.'
    note: Zarządca budynku podaje dokładną godzinę i numer naprawy.
  en.a2.unit29.lesson04.teach.a_thank_you:
    title: Podziękowanie na zakończenie
    gloss: 'Daniel mówi: Bardzo serdecznie dziękuję.'
    note: '*Thank you very much* to uprzejmy, oficjalny sposób podziękowania, tak jak na końcu rozmowy w lekcji 25.'
