  en.a1.unit61.lesson02.teach.im_late:
    title: I'm late.
    gloss: Jestem spóźniony.
    note: '*late* oznacza tutaj spóźniony, a nie późno w nocy.'
  en.a1.unit61.lesson02.teach.bus_is_late:
    title: The bus is late.
    gloss: Autobus jest spóźniony.
    note: 'Po angielsku używasz tej samej budowy dla osoby i dla autobusu: *is late*.'
  en.a1.unit61.lesson02.teach.thats_okay:
    title: That's okay.
    gloss: W porządku.
    note: '*That''s okay* uprzejmie przyjmuje przeprosiny.'
  en.a1.unit61.lesson02.teach.no_problem:
    title: No problem.
    gloss: Nie ma sprawy.
    note: '*No problem* to krótka, nieformalna odpowiedź na przeprosiny lub podziękowanie.'
  en.a1.unit61.lesson02.teach.made_mistake:
    title: I made a mistake.
    gloss: Popełniłem błąd.
    note: Po angielsku mówi się *make a mistake* (dosłownie „zrobić błąd”), a nie *do a mistake*. Po polsku mówimy „popełnić błąd”, więc nie przenoś czasownika dosłownie.
  en.a1.unit61.lesson03.teach.dialogue_line1:
    title: "Daniel przeprasza"
    gloss: 'Daniel mówi: Cześć, Mia. Przepraszam, że jestem spóźniony.'
    note: '*I''m sorry I''m late* łączy przeprosiny z powodem.'
  en.a1.unit61.lesson03.teach.dialogue_line2:
    title: Mia przyjmuje przeprosiny
    gloss: 'Mia mówi: W porządku.'
    note: '*That''s okay* jest przyjazne i proste.'
  en.a1.unit61.lesson03.teach.dialogue_line3:
    title: Autobus się spóźnia
    gloss: 'Daniel mówi: Autobus jest spóźniony.'
    note: To zdanie podaje powód.
  en.a1.unit61.lesson03.teach.dialogue_line4:
    title: Mia mówi, że można poczekać
    gloss: 'Mia mówi: Nie ma sprawy. Możemy poczekać.'
    note: '*We can wait* oznacza, że czekanie jest możliwe.'
  en.a1.unit61.lesson03.teach.dialogue_line5:
    title: Daniel pomylił się z godziną
    gloss: 'Daniel mówi: Pomyliłem się z godziną.'
    note: '*with the time* oznacza: w sprawie godziny, co do godziny.'
  en.a1.unit61.lesson03.teach.dialogue_line6:
    title: Zajęcia zaczynają się o trzeciej
    gloss: 'Mia mówi: Nic nie szkodzi. Zajęcia zaczynają się o trzeciej.'
    note: '*at three* używa *at* przy godzinie na zegarze.'
  en.a1.unit61.lesson03.teach.dialogue_line7:
    title: Daniel dziękuje Mii
    gloss: 'Daniel mówi: Dziękuję, że poczekałaś.'
    note: W *Thank you for waiting* po *for* stoi forma z końcówką -ing.
  en.a1.unit61.lesson04.teach.class_note:
    title: Informacja o zajęciach
    gloss: 'Informacja o zajęciach: Zajęcia zaczynają się o 3:00. Proszę przyjść na czas. Jeśli się spóźnisz, wyślij wiadomość.'
    note: Informacja mówi, co zrobić, jeśli się spóźnisz.
  en.a1.unit61.lesson04.teach.reading_passage:
    title: 'Tekst: Przeprosiny przed zajęciami'
    gloss: 'Przeprosiny przed zajęciami: Daniel spóźnił się na zajęcia, bo autobus był spóźniony. Spotkał Mię przed salą. Daniel powiedział, że jest mu przykro. Powiedział też, że pomylił się z godziną. Mia powiedziała, że nic się nie stało. Zajęcia były o 3:00. Daniel wysłał krótką wiadomość do nauczyciela. Napisał w niej: „Przepraszam, że jestem spóźniony. Autobus jest spóźniony.”'
    note: '*because* podaje powód: bo autobus był spóźniony.'
