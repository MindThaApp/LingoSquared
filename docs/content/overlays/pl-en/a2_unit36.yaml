teaching:
  en.a2.unit36.lesson01.teach.certificate:
    title: certificate
    gloss: zaświadczenie
    note: '*certificate* to urzędowy dokument wydawany przez urząd; *registration certificate* to zaświadczenie o zameldowaniu.'
    example_gloss: Moje zaświadczenie o zameldowaniu przyszło dwa tygodnie po wizycie.
  en.a2.unit36.lesson01.teach.mistake:
    title: mistake
    gloss: błąd
    note: '*mistake* to coś, co zostało źle napisane lub źle zrobione.'
    example_gloss: W moim adresie na tym formularzu jest błąd.
  en.a2.unit36.lesson01.teach.spelled:
    title: spelled
    gloss: napisany, przeliterowany
    note: '*spelled* mówi, jakimi literami i w jakiej kolejności pisze się dane słowo.'
    example_gloss: Moje imię pisze się przez jedno L, nie dwa.
  en.a2.unit36.lesson01.teach.correct:
    title: correct
    gloss: poprawić, sprostować
    note: '*correct* jest tu czasownikiem: zmienić coś błędnego na prawidłowe.'
    example_gloss: Urzędnik może dziś poprawić moje nazwisko.
  en.a2.unit36.lesson01.teach.copy:
    title: copy
    gloss: kopia
    note: '*copy* to drugi, identyczny egzemplarz dokumentu.'
    example_gloss: Urząd zachowuje kopię każdego dokumentu.
  en.a2.unit36.lesson01.teach.passport:
    title: passport
    gloss: paszport
    note: '*passport* to dokument podróży z twoim zdjęciem.'
    example_gloss: Na wizytę w urzędzie zawsze zabieram paszport.
  en.a2.unit36.lesson01.teach.grammar_there_is_there_are:
    title: there is i there are
    gloss: Na moim zaświadczeniu jest jeden błąd. Na moim zaświadczeniu są dwa błędy.
    note: '*there is* używasz przy jednej rzeczy, *there are* przy więcej niż jednej, podobnie jak „jest” i „są” po polsku.'
  en.a2.unit36.lesson02.teach.there_is_a_mistake:
    title: Mówienie, że jest błąd
    gloss: Na moim zaświadczeniu o zameldowaniu jest błąd.
    note: '*There is a mistake on...* to rzeczowy, oficjalny sposób zgłoszenia błędu.'
  en.a2.unit36.lesson02.teach.name_spelled_wrong:
    title: Mówienie, co dokładnie jest nie tak
    gloss: Moje nazwisko jest źle napisane.
    note: '*last name* to nazwisko; *first name* to imię.'
  en.a2.unit36.lesson02.teach.could_you_correct_it:
    title: Pytanie, czy można to poprawić
    gloss: Czy mógłby Pan to poprawić?
    note: '*Could you...?* jest grzeczniejsze niż *Can you...?* i pasuje do okienka w urzędzie.'
  en.a2.unit36.lesson02.teach.how_long_correction:
    title: Pytanie, ile to potrwa
    gloss: Jak długo potrwa poprawienie?
    note: '*How long...?* pyta o czas trwania, a nie o długość.'
  en.a2.unit36.lesson02.teach.grammar_polite_request:
    title: Dwie uprzejme prośby
    gloss: Czy mógłby Pan to poprawić? Czy byłoby możliwe otrzymanie nowego zaświadczenia?
    note: '*Could you...?* prosi o zrobienie czegoś; *Would it be possible to...?* jest jeszcze ostrożniejsze i pyta, czy coś w ogóle jest możliwe.'
  en.a2.unit36.lesson03.teach.working_days:
    title: working days
    gloss: dni robocze
    note: '*working days* to dni od poniedziałku do piątku, czyli bez weekendu.'
    example_gloss: Urząd odpowiada na każdy list w ciągu pięciu dni roboczych.
  en.a2.unit36.lesson03.teach.notice_text:
    title: Pismo z korektą
    gloss: Wniosek o sprostowanie wpłynął. Pana/Pani zaświadczenie o zameldowaniu zostanie poprawione w ciągu pięciu dni roboczych. Prosimy zgłosić się do urzędu z paszportem i tym pismem. Numer sprawy 3092.
    note: 'Pismo urzędowe jest krótkie i rzeczowe: co się stało, co się stanie i co masz zrobić.'
  en.a2.unit36.lesson03.teach.bring_passport_and_notice:
    title: Co zabrać ze sobą
    gloss: Prosimy przynieść do urzędu paszport i to pismo.
    note: '*bring ... to ...* znaczy przynieść coś w jakieś miejsce.'
  en.a2.unit36.lesson04.teach.q_there_is_a_mistake:
    title: Leila zgłasza błąd
    gloss: 'Leila mówi: Dzień dobry, na moim zaświadczeniu o zameldowaniu jest błąd.'
    note: '*Hello* jest bardziej neutralne niż *Hi* i lepiej pasuje do okienka w urzędzie.'
  en.a2.unit36.lesson04.teach.a_what_is_wrong:
    title: Urzędnik dopytuje
    gloss: 'Urzędnik mówi: Rozumiem. Co jest nie tak?'
    note: '*I see* znaczy tu: rozumiem, słucham.'
  en.a2.unit36.lesson04.teach.q_name_spelled_wrong:
    title: Leila wyjaśnia błąd i prosi o poprawkę
    gloss: 'Leila mówi: Moje nazwisko jest źle napisane. Czy mógłby Pan to poprawić?'
    note: Te same dwa zdania co w lekcji 2, tym razem jedno po drugim.
  en.a2.unit36.lesson04.teach.a_do_you_have_passport:
    title: Urzędnik pyta o paszport
    gloss: 'Urzędnik mówi: Oczywiście. Ma Pani przy sobie paszport?'
    note: '*Do you have ... with you?* znaczy: Czy ma Pani to teraz przy sobie?'
  en.a2.unit36.lesson04.teach.q_here_it_is:
    title: Leila podaje paszport
    gloss: 'Leila mówi: Tak, proszę bardzo.'
    note: '*Here it is* mówi się, podając komuś coś do ręki.'
  en.a2.unit36.lesson04.teach.a_copy_and_send:
    title: Urzędnik wyjaśnia, co robi
    gloss: 'Urzędnik mówi: Dziękuję. Zrobię kopię i jeszcze dziś wyślę sprostowanie.'
    note: '*make a copy* to stałe połączenie: zrobić kopię.'
  en.a2.unit36.lesson04.teach.q_how_long:
    title: Leila pyta, ile to potrwa
    gloss: 'Leila pyta: Jak długo potrwa poprawienie?'
    note: To samo pytanie co w lekcji 2.
  en.a2.unit36.lesson04.teach.a_within_five_working_days:
    title: Odpowiedź urzędnika
    gloss: 'Urzędnik mówi: W ciągu pięciu dni roboczych.'
    note: '*within* oznacza „w ciągu” określonego czasu, więc trwa to najwyżej pięć dni roboczych.'
  en.a2.unit36.lesson04.teach.q_thank_you:
    title: Leila dziękuje urzędnikowi
    gloss: 'Leila mówi: Bardzo dziękuję.'
    note: '*very much* nadaje podziękowaniu mocniejszy wydźwięk.'
