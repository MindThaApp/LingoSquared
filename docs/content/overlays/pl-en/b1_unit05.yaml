  en.b1.unit05.lesson03.teach.reading_passage:
    title: 'Tekst: tygodniowy raport Daniela'
    gloss: Daniel odpowiada za miesięczny raport sprzedaży. Co tydzień przekazuje zespołowi krótką aktualizację. W tym tygodniu ma lekkie opóźnienie z powodu problemu technicznego, ale spodziewa się skończyć do piątku. Zawsze mówi zespołowi prawdę o opóźnieniach.
    note: Krótki tekst o tym, jak Daniel szczerze mówi o opóźnieniu.
  en.b1.unit05.lesson04.teach.q_could_you_help_review:
    title: Daniel prosi Mię o pomoc
    gloss: 'Daniel mówi: Mia, czy mogłabyś mi pomóc przejrzeć ten raport, zanim go wyślę?'
    note: '*could you help me...* to uprzejmy sposób poproszenia współpracownika o pomoc.'
  en.b1.unit05.lesson04.teach.a_of_course_what_help:
    title: Mia się zgadza
    gloss: 'Mia mówi: Oczywiście. W czym potrzebujesz pomocy?'
    note: '*of course* to przyjazny, bezpośredni sposób powiedzenia „tak”.'
  en.b1.unit05.lesson04.teach.q_make_sure_numbers:
    title: Daniel wyjaśnia, czego potrzebuje
    gloss: 'Daniel mówi: Chcę się upewnić, że liczby się zgadzają.'
    note: '*make sure* oznacza sprawdzić, czy coś jest poprawne.'
  en.b1.unit05.lesson04.teach.a_check_this_afternoon:
    title: Mia obiecuje to przejrzeć
    gloss: 'Mia mówi: Nie ma sprawy. Przejrzę go dziś po południu i prześlę ci uwagi.'
    note: '*I''ll check it this afternoon* to konkretna obietnica z podanym czasem.'
  en.b1.unit05.lesson04.teach.q_thank_you_appreciate:
    title: Daniel dziękuje Mii
    gloss: 'Daniel mówi: Dziękuję, naprawdę to doceniam.'
    note: '*I really appreciate it* to szczery sposób wyrażenia wdzięczności.'
  en.b1.unit05.lesson04.teach.a_youre_welcome_let_me_know:
    title: Mia oferuje dalszą pomoc
    gloss: 'Mia mówi: Proszę bardzo. Daj znać, jeśli będziesz potrzebować czegoś jeszcze.'
    note: '*let me know if...* zostawia otwartą furtkę na dalszą pomoc.'
