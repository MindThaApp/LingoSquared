course:
  title: Angielski B2
  description: 'Nauka angielskiego na poziomie B2: niuansowane rozmowy, argumenty, przypuszczenia i profesjonalna dyskusja, z wyjaśnieniami po polsku w swobodnym tonie.'
units:
  en.b2.unit02.speculation:
    title: It must have gone down overnight
lessons:
  en.b2.unit02.lesson01.certainty_and_deduction:
    title: May, might, must i cannot
  en.b2.unit02.lesson02.present_and_past_speculation:
    title: It must have been a system problem
  en.b2.unit02.lesson03.reading_an_incident_note:
    title: 'Czytanie: co prawdopodobnie się stało?'
  en.b2.unit02.lesson04.the_speculation_dialogue:
    title: A deduction, not just a guess
teaching:
  en.b2.unit02.lesson01.teach.may:
    title: may
    gloss: może, możliwe
    note: '*may* wyraża możliwość. W tym znaczeniu nie oznacza pozwolenia, jak w *May I...?*.'
    example_gloss: To może być prawda.
  en.b2.unit02.lesson01.teach.might:
    title: might
    gloss: mogłoby, być może
    note: '*might* wyraża ostrożną możliwość, często nieco mniej pewną niż *may*.'
    example_gloss: To mogłoby być prawdą.
  en.b2.unit02.lesson01.teach.must:
    title: must
    gloss: musi być, na pewno
    note: '*must* wyraża tu mocny wniosek oparty na dowodach, a nie obowiązek.'
    example_gloss: To musi być prawda.
  en.b2.unit02.lesson01.teach.cannot:
    title: cannot
    gloss: nie może być, niemożliwe
    note: '*cannot* używasz, gdy dowody coś wykluczają. Dla przeszłości powiesz *cannot have been*.'
    example_gloss: To nie może być prawda.
  en.b2.unit02.lesson01.teach.deduction:
    title: deduction
    gloss: wniosek oparty na dowodach
    note: '*deduction* to wnioskowanie na podstawie wskazówek, a nie zwykłe zgadywanie.'
    example_gloss: Wniosek Mii opiera się na dowodach.
  en.b2.unit02.lesson01.teach.guesswork:
    title: guesswork
    gloss: zgadywanie na ślepo
    note: '*guesswork* to domysł z małą ilością dowodów lub bez nich.'
    example_gloss: Bez dowodów to wyjaśnienie byłoby zgadywaniem na ślepo.
  en.b2.unit02.lesson01.teach.may_might_contrast:
    title: may en might
    gloss: May i might często się pokrywają. Oba wskazują możliwe wyjaśnienie; might brzmi zwykle nieco ostrożniej.
    note: Polskie „może” nie zawsze trzeba tłumaczyć przez *maybe*. W starannie sformułowanym zdaniu *may* i *might* są często lepsze.
  en.b2.unit02.lesson02.teach.must_have_gone_down:
    title: Mocny wniosek o przeszłości
    gloss: Serwer musiał paść w nocy, bo nie wygenerowano żadnych raportów.
    note: 'Polskie „musiał” w znaczeniu wniosku po angielsku oddajesz konstrukcją *must have* + imiesłów bierny (III forma): *must have gone down*.'
  en.b2.unit02.lesson02.teach.may_have_failed:
    title: Możliwa przyczyna w przeszłości
    gloss: Raporty mogły w nocy zakończyć się błędem.
    note: '*may have failed* to możliwa przyczyna, a nie pewny wniosek.'
  en.b2.unit02.lesson02.teach.might_have_permission:
    title: Ostrożna możliwość
    gloss: Przyczyną mógł też być problem z uprawnieniami.
    note: '*might have been* zostawia przyczynę otwartą i brzmi ostrożniej niż *must have been*.'
  en.b2.unit02.lesson02.teach.cannot_have_only_report:
    title: Wykluczenie czegoś
    gloss: To nie mógł być tylko problem z raportami.
    note: Polskie „nie mogło być” oddajesz tu jako *cannot have been* lub w mowie potocznej *can't have been*.
  en.b2.unit02.lesson02.teach.grammar_modal_deduction:
    title: Czasowniki modalne w spekulacjach
    gloss: Użyj must be dla mocnego wniosku o teraźniejszości i must have been dla mocnego wniosku o przeszłości. Użyj may/might dla możliwości w teraźniejszości, a may have/might have dla możliwości w przeszłości. Użyj cannot/cannot have been, gdy dowody wykluczają dane wyjaśnienie.
    note: 'Uwaga: *must* nie oznacza tu obowiązku (jak „musisz”), lecz „to na pewno tak jest”: wniosek.'
  en.b2.unit02.lesson03.teach.outage:
    title: outage
    gloss: awaria, przerwa w działaniu
    note: '*outage* to awaria, przez którą system lub usługa nie działa.'
    example_gloss: Awaria systemu sprawiła, że raporty się nie uruchomiły.
  en.b2.unit02.lesson03.teach.consequence:
    title: consequence
    gloss: konsekwencja, skutek
    note: '*consequence* to skutek jakiejś przyczyny lub problemu.'
    example_gloss: Jedną z konsekwencji jest to, że pulpit może pokazywać stare dane.
  en.b2.unit02.lesson03.teach.reading_passage:
    title: 'Czytanie: co prawdopodobnie się stało?'
    gloss: Nocne raporty się nie uruchomiły, a strona monitorowania jest pusta. Mia mówi, że serwer musiał paść w nocy. Daniel sugeruje, że mógł to być problem z uprawnieniami, ale to nie wyjaśnia pustej strony monitorowania. Dział finansów może nie mieć porannych liczb, a pulpit klienta może pokazywać stare dane, dopóki raporty nie zostaną odbudowane. Mia nie jest całkiem pewna, ale jej wyjaśnienie to wniosek wyciągnięty z dostępnych dowodów, a nie czyste zgadywanie.
    note: Tekst oddziela fakty, możliwe przyczyny, mocne wnioski, wykluczone wyjaśnienia i możliwe skutki.
  en.b2.unit02.lesson04.teach.q_no_reports:
    title: Daniel podaje fakt
    gloss: 'Daniel mówi: Żaden z nocnych raportów nie został wygenerowany.'
    note: To znany fakt, jeszcze nie spekulacja.
  en.b2.unit02.lesson04.teach.a_server_down:
    title: Mia wyciąga mocny wniosek
    gloss: 'Mia mówi: Serwer musiał paść w nocy.'
    note: '*must have gone down* to mocny wniosek o przeszłości.'
  en.b2.unit02.lesson04.teach.q_permission_issue:
    title: Daniel podaje możliwą przyczynę
    gloss: 'Daniel mówi: Przyczyną mógł być raczej problem z uprawnieniami.'
    note: '*might have been* zostawia opcję otwartą, ale nie czyni jej pewną.'
  en.b2.unit02.lesson04.teach.a_cannot_only_report:
    title: Mia wyklucza zbyt wąskie wyjaśnienie
    gloss: 'Mia mówi: Może, ale strona monitorowania też jest pusta, więc to nie mógł być tylko problem z raportami.'
    note: '*cannot have been only...* wyklucza to wyjaśnienie, bo dowody są szersze.'
  en.b2.unit02.lesson04.teach.q_consequences:
    title: Daniel pyta o skutki
    gloss: 'Daniel pyta: Jakich konsekwencji powinniśmy się spodziewać?'
    note: Po przyczynie pojawia się pytanie o możliwe skutki.
  en.b2.unit02.lesson04.teach.a_possible_consequences:
    title: Mia podaje możliwe skutki
    gloss: 'Mia mówi: Dział finansów może nie mieć porannych liczb, a pulpit klienta może pokazywać stare dane.'
    note: '*may be missing* i *might show* wyrażają możliwe skutki, a nie pewne fakty.'
  en.b2.unit02.lesson04.teach.q_deduction_guess:
    title: Daniel sprawdza stopień pewności
    gloss: 'Daniel mówi: Czyli to wniosek, a nie tylko domysł?'
    note: Daniel pyta, czy rozumowanie Mii opiera się na dowodach.
  en.b2.unit02.lesson04.teach.a_evidence_limited:
    title: Mia doprecyzowuje swój wniosek
    gloss: 'Mia mówi: Tak. Dowody są ograniczone, ale wskazują na awarię systemu.'
    note: Mocny wniosek może mimo to przyznawać, że dowody są ograniczone.
