teaching:
  en.a1.unit15.lesson01.teach.cash:
    title: Cash
    gloss: gotówka
    note: '*cash* to pieniądze w gotówce (banknoty i monety). W angielskim to rzeczownik niepoliczalny: mówimy *some cash*, nigdy *a cash*.'
    example_gloss: Mam trochę gotówki.
  en.a1.unit15.lesson01.teach.card:
    title: Card
    gloss: karta
    note: '*card* to ogólne słowo na każdą plastikową kartę płatniczą.'
    example_gloss: Moja karta jest niebieska.
  en.a1.unit15.lesson01.teach.credit_card:
    title: Credit card
    gloss: karta kredytowa
    note: '*credit card* to karta, którą pożyczasz pieniądze od banku i oddajesz je później. Odpowiada polskiej „karcie kredytowej".'
  en.a1.unit15.lesson01.teach.debit_card:
    title: Debit card
    gloss: karta debetowa
    note: '*debit card* to karta, przy której kwota od razu schodzi z konta. Zwykła polska karta do konta działa właśnie jako *debit card*.'
  en.a1.unit15.lesson01.teach.total:
    title: Total
    gloss: suma do zapłaty
    note: '*total* to cała kwota, którą musisz zapłacić.'
    example_gloss: Ile wynosi suma?
  en.a1.unit15.lesson02.teach.do_you_take_cards:
    title: Do you take credit cards?
    gloss: Czy przyjmujecie karty kredytowe?
    note: '*Do you take credit cards?* to typowe pytanie przed zapłatą. Czasownik *take* znaczy tu „przyjmować".'
  en.a1.unit15.lesson02.teach.cash_only:
    title: Sorry, cash only.
    gloss: Przepraszam, tylko gotówka.
    note: '*Sorry, cash only.* to typowa odpowiedź sklepów, które nie przyjmują kart.'
  en.a1.unit15.lesson02.teach.ill_pay_by_card:
    title: Yes, I'll pay by card.
    gloss: Tak, zapłacę kartą.
    note: '*Yes, I''ll pay by card.* to ostateczny wybór sposobu płatności. Po *by* stoi *card* bez przedimka (po angielsku nie mówimy *by a card*).'
  en.a1.unit15.lesson03.teach.tax:
    title: Tax
    gloss: podatek
    note: '*tax* to podatek; w większości amerykańskich sklepów doliczany jest dopiero przy kasie, a nie jest wliczony w cenę na półce, jak polski VAT.'
    example_gloss: Podatek to jeden dolar.
  en.a1.unit15.lesson03.teach.receipt_text:
    title: "Tekst paragonu"
    gloss: 'Kawa: 3 dolary. Kanapka: 6 dolarów. Podatek: 1 dolar. Razem: 10 dolarów.'
    note: To prawdziwy paragon.
  en.a1.unit15.lesson03.teach.total_summary_sentence:
    title: The total is $10.
    gloss: Suma do zapłaty to 10 dolarów.
    note: To zdanie podsumowuje całą kwotę z paragonu w jednym pełnym zdaniu.
  en.a1.unit15.lesson04.teach.q_total:
    title: "Pytanie o sumę do zapłaty"
    gloss: Leila pyta, ile wynosi suma do zapłaty
    note: '*How much is the total?* to typowe pytanie o kwotę końcową. *is* stoi w liczbie pojedynczej, bo *the total* to jedna suma.'
  en.a1.unit15.lesson04.teach.a_fifteen:
    title: "Odpowiedź o sumę do zapłaty"
    gloss: 'Kasjer mówi: To piętnaście dolarów.'
    note: '*It''s fifteen dollars.* to pełna odpowiedź na pytanie o sumę.'
  en.a1.unit15.lesson04.teach.q_cards:
    title: "Pytanie o płatność kartą"
    gloss: Leila pyta, czy przyjmują karty kredytowe
    note: To samo pytanie co wcześniej.
  en.a1.unit15.lesson04.teach.a_yes_we_do:
    title: "Odpowiedź o płatność kartą"
    gloss: 'Kasjer mówi: Tak, przyjmujemy.'
    note: '*Yes, we do.* to pełna krótka odpowiedź. Po angielsku powtarza się czasownik pomocniczy *do*, zamiast mówić samo „tak".'
  en.a1.unit15.lesson04.teach.closing_pay_by_card:
    title: "Wybór sposobu płatności"
    gloss: 'Leila mówi: Świetnie, zapłacę kartą.'
    note: To zdanie kończy rozmowę ostatecznym wyborem sposobu płatności.
