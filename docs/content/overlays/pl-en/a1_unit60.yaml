    gloss: Do zobaczenia o szóstej.
    note: '*at six* używa *at* przy godzinie na zegarze. Po polsku mówi się „o szóstej”, więc przyimek „o” jest tu dobrą podpowiedzią.'
  en.a1.unit60.lesson03.teach.dialogue_line1:
    title: Leila pyta, czy Daniel ma czas
    gloss: 'Leila mówi: Cześć, Danielu! Czy masz czas w sobotę?'
    note: '*Are you free...?* pyta, czy ktoś ma czas.'
  en.a1.unit60.lesson03.teach.dialogue_line2:
    title: Daniel ma czas
    gloss: 'Daniel mówi: Tak, mam czas.'
    note: '*I am free* oznacza: mam czas.'
  en.a1.unit60.lesson03.teach.dialogue_line3:
    title: Leila zaprasza Daniela
    gloss: 'Leila mówi: Czy chciałbyś przyjść na kolację?'
    note: '*Would you like to come...?* jest grzeczne i miłe.'
  en.a1.unit60.lesson03.teach.dialogue_line4:
    title: Daniel przyjmuje zaproszenie
    gloss: 'Daniel mówi: Tak, z przyjemnością.'
    note: '*I''d love to* to ciepły sposób powiedzenia „tak”.'
  en.a1.unit60.lesson03.teach.dialogue_line5:
    title: Leila prosi o napój
    gloss: 'Leila mówi: Proszę, przynieś coś do picia.'
    note: '*Please bring...* to grzeczna prośba.'
  en.a1.unit60.lesson03.teach.dialogue_line6:
    title: Daniel pyta o godzinę
    gloss: 'Daniel mówi: Jasne. O której?'
    note: '*What time?* to krótkie, naturalne pytanie.'
  en.a1.unit60.lesson03.teach.dialogue_line7:
    title: Leila podaje szóstą
    gloss: 'Leila mówi: Do zobaczenia o szóstej.'
    note: '*at six* używa *at* przy godzinie na zegarze.'
  en.a1.unit60.lesson03.teach.dialogue_line8:
    title: Daniel dziękuje Leili
    gloss: 'Daniel mówi: Świetnie. Dziękuję za zaproszenie.'
    note: '*Thank you for...* używa *for*, by podać powód podziękowania.'
  en.a1.unit60.lesson04.teach.invitation_message:
    title: Zaproszenie
    gloss: 'Zaproszenie na kolację: sobota, godz. 6:00. Proszę przynieść coś do picia. Adres: Park Street 18.'
    note: Zaproszenie podaje dzień, godzinę, co Daniel ma przynieść i adres.
  en.a1.unit60.lesson04.teach.reading_passage:
    title: 'Tekst: Kolacja u Leili'
    gloss: 'Kolacja u Leili: Leila zaprosiła Daniela na kolację w sobotę. Poprosiła go, żeby przyniósł coś do picia. Daniel powiedział, że może przyjść. W zaproszeniu było napisane, że kolacja jest o 6:00 przy Park Street 18. Daniel zapisał adres w telefonie. Chciał przyjść na czas. Leila była szczęśliwa, bo jej przyjaciel mógł przyjść.'
    note: '*invited Daniel to dinner* oznacza, że Leila zaprosiła Daniela na kolację.'
