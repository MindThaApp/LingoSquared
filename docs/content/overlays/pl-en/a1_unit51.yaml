  en.a1.unit51.lesson03.teach.dialogue_line1:
    title: Powitanie farmaceuty
    gloss: 'Farmaceuta mówi: Dzień dobry, czy mogę w czymś pomóc?'
    note: '*Hi, can I help you?* oznacza: dzień dobry, czy mogę w czymś pomóc?'
  en.a1.unit51.lesson03.teach.dialogue_line2:
    title: Dolegliwości Leili
    gloss: 'Leila mówi: Tak, mam silny kaszel i katar.'
    note: Powtórzenie wcześniej poznanego zdania.
  en.a1.unit51.lesson03.teach.dialogue_line3:
    title: Farmaceuta poleca syrop
    gloss: 'Farmaceuta mówi: Mam syrop na kaszel, który powinien pomóc. Proszę go przyjąć przed snem.'
    note: '*before bed* oznacza przed snem — dotyczy to syropu na kaszel, a nie tabletek.'
  en.a1.unit51.lesson03.teach.dialogue_line4:
    title: Pytanie Daniela
    gloss: 'Daniel pyta: Czy ma pan też coś na ból gardła?'
    note: '*too* na końcu zdania oznacza „też”.'
  en.a1.unit51.lesson03.teach.dialogue_line5:
    title: Farmaceuta poleca tabletki
    gloss: 'Farmaceuta mówi: Tak, te tabletki są dobre na ból gardła. Proszę przyjmować jedną co cztery godziny.'
    note: 'Chodzi o dawkowanie tabletek: co cztery godziny. Syrop przyjmuje się o innej porze, przed snem.'
  en.a1.unit51.lesson03.teach.dialogue_line6:
    title: Decyzja Leili
    gloss: 'Leila mówi: Świetnie, wezmę oba. Ile to kosztuje?'
    note: '*I''ll take both.* oznacza: wezmę oba.'
  en.a1.unit51.lesson03.teach.dialogue_line7:
    title: Cena
    gloss: 'Farmaceuta mówi: To kosztuje dziewięć dolarów.'
    note: Powtórzenie wcześniej poznanego zdania.
  en.a1.unit51.lesson03.teach.dialogue_line8:
    title: Leila płaci
    gloss: 'Leila mówi: Proszę. Dziękuję!'
    note: '*Here you go.* oznacza „proszę” i używa się tego zwrotu, podając komuś coś.'
  en.a1.unit51.lesson04.teach.reading_passage:
    title: Tekst o wizycie w aptece
    gloss: 'Wizyta w aptece: Kilka dni po wycieczce w góry z Mią Leila się przeziębiła. Miała silny kaszel i katar, a także bolało ją gardło. Daniel poszedł z nią do apteki niedaleko jej mieszkania. Farmaceuta wysłuchał, jakie Leila ma objawy, i polecił syrop na kaszel oraz tabletki. Powiedział, żeby przyjmowała syrop przed snem i jedną tabletkę co cztery godziny. Leila zapłaciła dziewięć dolarów za oba leki. W drodze do domu Daniel kupił jej też pudełko chusteczek. Leila przyjęła leki tego wieczoru, a przed weekendem jej kaszel był już znacznie łagodniejszy.'
    note: '*by the weekend* oznacza przed weekendem.'
