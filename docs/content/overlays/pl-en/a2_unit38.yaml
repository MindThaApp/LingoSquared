teaching:
  en.a2.unit38.lesson01.teach.reschedule:
    title: reschedule
    gloss: przełożyć (termin)
    note: '*reschedule* znaczy przenieść termin na inny czas.'
    example_gloss: Muszę przełożyć naprawę, bo wtedy będę w pracy.
  en.a2.unit38.lesson01.teach.neighbor:
    title: neighbor
    gloss: sąsiad / sąsiadka
    note: '*neighbor* to osoba, która mieszka obok ciebie. Angielskie słowo nie mówi, czy to mężczyzna, czy kobieta.'
    example_gloss: Moja sąsiadka może otworzyć drzwi hydraulikowi.
  en.a2.unit38.lesson01.teach.key:
    title: key
    gloss: klucz
    note: '*key* to mały metalowy przedmiot, którym otwiera się drzwi.'
    example_gloss: Zostawię klucz u mojej sąsiadki.
  en.a2.unit38.lesson01.teach.leak:
    title: leak
    gloss: nieszczelność, wyciek
    note: '*leak* jest tu rzeczownikiem: to samo miejsce, z którego wycieka woda. Czasownik *to leak* znaczy przeciekać lub cieknąć.'
    example_gloss: Wyciek pod moim zlewem jest coraz gorszy.
  en.a2.unit38.lesson01.teach.fixed:
    title: fixed
    gloss: naprawiony
    note: '*fixed* to imiesłów od *to fix* (naprawiać) i znaczy, że coś nie jest już zepsute.'
    example_gloss: Zlew jest już naprawiony i woda przestała wyciekać.
  en.a2.unit38.lesson01.teach.afternoon:
    title: afternoon
    gloss: popołudnie
    note: '*afternoon* to część dnia po południu; przedpołudnie to *morning*.'
    example_gloss: Hydraulik przyszedł po południu, a nie rano.
  en.a2.unit38.lesson01.teach.grammar_cant_wont:
    title: can't und won't, wenn etwas nicht klappt
    gloss: Nie mogę być w domu między 14:00 a 16:00. Po południu nie będzie mnie w domu.
    note: '*can''t* mówi, że coś jest niemożliwe. *won''t* mówi, że w przyszłości po prostu tak nie będzie.'
  en.a2.unit38.lesson02.teach.need_to_reschedule:
    title: Sagen, dass Sie den Termin verschieben möchten
    gloss: Muszę przełożyć naprawę.
    note: '*I need to ...* brzmi rzeczowo i neutralnie: wyraża konieczność, ale nie jest niegrzeczne.'
  en.a2.unit38.lesson02.teach.possible_in_the_morning:
    title: Um eine andere Uhrzeit bitten
    gloss: Czy byłoby możliwe, żeby zamiast tego przyszedł Pan rano?
    note: '*Would it be possible to ...?* to najostrożniejszy sposób proszenia o coś. *instead* znaczy ''zamiast tego''.'
  en.a2.unit38.lesson02.teach.leave_key_with_neighbor:
    title: Sagen, wo der Schlüssel ist
    gloss: Zostawię klucz u mojej sąsiadki.
    note: '*leave something with someone* znaczy zostawić coś u kogoś lub komuś przekazać.'
  en.a2.unit38.lesson02.teach.is_the_leak_fixed:
    title: Fragen, ob das Problem behoben ist
    gloss: Czy wyciek jest już naprawiony?
    note: '*Is ... fixed?* pyta o rezultat, a nie o samą pracę.'
  en.a2.unit38.lesson02.teach.grammar_because_reason:
    title: Einen Grund mit because nennen
    gloss: Nie mogę być w domu między 14:00 a 16:00, ponieważ wtedy jestem w pracy.
    note: '*because* łączy problem z przyczyną. Szyk zdania po nim się nie zmienia: czasownik zostaje na swoim zwykłym miejscu, po podmiocie.'
  en.a2.unit38.lesson03.teach.message:
    title: message
    gloss: wiadomość
    note: '*message* to każda krótka wiadomość tekstowa: SMS, wiadomość na czacie lub krótki e-mail.'
    example_gloss: Dostałem wiadomość o nowym terminie naprawy.
  en.a2.unit38.lesson03.teach.rescheduling_text:
    title: Die Nachricht über den neuen Termin
    gloss: Naprawa 6180 została przełożona. Hydraulik przyjdzie jutro między 9:00 a 11:00. Pana/Pani sąsiadka otworzy drzwi. Proszę dziś potwierdzić ten nowy termin wiadomością.
    note: 'Wiadomość od administracji budynku jest krótka i rzeczowa: co się zmieniło, kiedy i co jeszcze trzeba zrobić.'
  en.a2.unit38.lesson03.teach.confirm_by_message:
    title: Zur Bestätigung aufgefordert werden
    gloss: Proszę dziś potwierdzić ten nowy termin wiadomością.
    note: '*confirm* znaczy potwierdzić; *by message* znaczy wiadomością.'
  en.a2.unit38.lesson04.teach.q_need_to_reschedule:
    title: Daniel ruft die Hausverwaltung an
    gloss: 'Daniel mówi: Dzień dobry, muszę przełożyć naprawę.'
    note: Przez telefon zaczyna się od *Hello*, a potem od razu podaje się powód rozmowy.
  en.a2.unit38.lesson04.teach.a_which_repair:
    title: Die Hausverwaltung fragt, welche Reparatur
    gloss: 'Administracja mówi: Nie ma problemu. Której naprawy to dotyczy?'
    note: '*Which repair is it?* pyta o jedną rzecz spośród znanej grupy.'
  en.a2.unit38.lesson04.teach.q_repair_6180:
    title: Daniel nennt die Reparaturnummer
    gloss: 'Daniel mówi: Naprawa 6180, wyciek pod moim zlewem kuchennym.'
    note: 'Ten sam numer naprawy co w lekcji 29: ten sam cieknący zlew.'
  en.a2.unit38.lesson04.teach.a_why_cant_you_be_home:
    title: Die Hausverwaltung fragt nach dem Grund
    gloss: 'Administracja mówi: Rozumiem. Dlaczego nie może Pan być w domu?'
    note: '*Why can''t you ...?* pyta o powód, dla którego coś się nie udaje.'
  en.a2.unit38.lesson04.teach.q_at_work_ask_morning:
    title: Daniel nennt den Grund und bittet um den Vormittag
    gloss: 'Daniel mówi: Nie mogę być w domu między 14:00 a 16:00, ponieważ wtedy jestem w pracy. Czy byłoby możliwe, żeby zamiast tego przyszedł rano?'
    note: 'Najpierw powód, potem prośba: to brzmi grzeczniej niż żądanie od razu.'
  en.a2.unit38.lesson04.teach.a_plumber_can_come_morning:
    title: Die Hausverwaltung bietet einen neuen Zeitraum an
    gloss: 'Administracja mówi: Tak, hydraulik może przyjść między 9:00 a 11:00.'
    note: '*between 9am and 11am* to nowy przedział czasu.'
  en.a2.unit38.lesson04.teach.q_leave_key:
    title: Daniel regelt den Schlüssel
    gloss: 'Daniel mówi: Dziękuję bardzo. Zostawię klucz u mojej sąsiadki.'
    note: To samo zdanie co w lekcji 2.
  en.a2.unit38.lesson04.teach.a_please_confirm:
    title: Die Hausverwaltung bittet um Bestätigung
    gloss: 'Administracja mówi: Dobrze. Proszę dziś potwierdzić ten nowy termin wiadomością.'
    note: To samo wezwanie co w wiadomości z lekcji 3.
  en.a2.unit38.lesson04.teach.q_will_confirm_this_afternoon:
    title: Daniel sagt, wann er bestätigt
    gloss: 'Daniel mówi: Potwierdzę go dziś po południu.'
    note: '*this afternoon* znaczy dziś po południu, czyli dziś po godzinie 12.'
