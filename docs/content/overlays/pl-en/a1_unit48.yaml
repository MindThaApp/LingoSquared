    title: Reakcja Daniela
    gloss: 'Daniel mówi: Jasne! Chyba nigdy wcześniej nie wypożyczałem książki z biblioteki.'
    note: '*I don''t think I''ve ever ...* znaczy: chyba nigdy nie ... Używa się tu czasu present perfect (*have ever*).'
  en.a1.unit48.lesson03.teach.dialogue_line3:
    title: Leila przy ladzie
    gloss: 'Leila mówi: Dzień dobry, chciałabym oddać tę książkę i wypożyczyć też nową.'
    note: '*and I''d like to ... too* znaczy: i chciałabym też ...'
  en.a1.unit48.lesson03.teach.dialogue_line4:
    title: Bibliotekarka pyta
    gloss: 'Bibliotekarka mówi: Świetnie, dziękuję. Czy ma Pani kartę biblioteczną?'
    note: '*Do you have your library card?* znaczy: czy ma Pani swoją kartę biblioteczną?'
  en.a1.unit48.lesson03.teach.dialogue_line5:
    title: "Odpowiedź: Leila"
    gloss: 'Leila mówi: Tak, proszę.'
    note: '*here it is* znaczy: proszę, oto ona (tu: oto to, o co prosisz).'
  en.a1.unit48.lesson03.teach.dialogue_line6:
    title: Bibliotekarka wyjaśnia
    gloss: 'Bibliotekarka mówi: Doskonale. Tę nową książkę trzeba oddać za trzy tygodnie.'
    note: '*due back in three weeks* znaczy: do oddania za trzy tygodnie.'
  en.a1.unit48.lesson03.teach.dialogue_line7:
    title: Daniel też chce wypożyczyć
    gloss: 'Daniel mówi: Czy mogę też dostać kartę biblioteczną? Chciałbym wypożyczyć książkę kucharską.'
    note: '*Can I get ... too?* znaczy: czy mogę też dostać ...?'
  en.a1.unit48.lesson03.teach.dialogue_line8:
    title: Bibliotekarka pomaga Danielowi
    gloss: 'Bibliotekarka mówi: Oczywiście! Proszę tylko wypełnić ten formularz.'
    note: '*fill out this form* znaczy: wypełnić ten formularz. Po angielsku *fill out* to czasownik złożony z dwóch słów (*fill* + *out*).'
  en.a1.unit48.lesson04.teach.reading_passage:
    title: Tekst o tym, jak działa biblioteka
    gloss: 'Wizyta w bibliotece: W większości bibliotek można wypożyczać książki, a czasem także inne rzeczy, na kilka tygodni. Żeby coś wypożyczyć, zwykle potrzebujesz karty bibliotecznej. Gdy wypożyczasz książkę, bibliotekarka podaje ci termin zwrotu, czyli dzień, w którym musisz ją oddać. Jeśli do tego czasu jeszcze jej nie skończysz, często możesz poprosić bibliotekarkę o więcej czasu. Odkąd Leila przeprowadziła się do nowego mieszkania, ma mniej książek niż kiedyś, więc zaczęła je wypożyczać z biblioteki. W zeszłym tygodniu oddała jedną książkę i wzięła nową, a jej przyjaciel Daniel poszedł z nią. Nigdy wcześniej nie wypożyczył książki z biblioteki, więc dostał własną kartę biblioteczną i wypożyczył książkę kucharską, żeby ćwiczyć przepisy, których uczy go Mia. Bibliotekarka przypomniała im obojgu, żeby oddali książki przed terminem. Mia rzadko chodzi do biblioteki, ale kiedyś wypożyczyła książkę o fotografii na swoje zajęcia.'
    note: '*checked out a cookbook* znaczy: wypożyczył książkę kucharską (*check out* to stałe angielskie wyrażenie na wypożyczanie z biblioteki).'
