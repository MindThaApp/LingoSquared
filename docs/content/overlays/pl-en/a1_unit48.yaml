  en.a1.unit48.lesson03.teach.dialogue_line1:
    title: Propozycja Leili
    gloss: 'Leila mówi: Muszę oddać tę książkę do biblioteki. Chcesz pójść ze mną?'
    note: '*Do you want to come with me?* znaczy: chcesz pójść ze mną?'
