teaching:
  en.a1.unit39.lesson01.teach.neighborhood:
    title: neighborhood
    gloss: okolica / dzielnica
    note: '*neighborhood* znaczy okolica, dzielnica: teren wokół twojego domu, z pobliskimi ulicami i budynkami.'
    example_gloss: Kocham swoją okolicę.
  en.a1.unit39.lesson01.teach.neighbor:
    title: neighbor
    gloss: sąsiad / sąsiadka
    note: '*neighbor* znaczy sąsiad: osoba, która mieszka obok ciebie lub blisko ciebie.'
    example_gloss: Mój sąsiad jest bardzo pomocny.
  en.a1.unit39.lesson01.teach.nearby:
    title: nearby
    gloss: w pobliżu / niedaleko
    note: '*nearby* znaczy w pobliżu, niedaleko.'
    example_gloss: W pobliżu jest park.
  en.a1.unit39.lesson01.teach.quiet:
    title: quiet
    gloss: cichy / spokojny
    note: '*quiet* znaczy cichy, spokojny: bez wielu hałasów.'
    example_gloss: Moja ulica jest nocą bardzo cicha.
  en.a1.unit39.lesson01.teach.noisy:
    title: noisy
    gloss: hałaśliwy
    note: '*noisy* znaczy pełen głośnych dźwięków.'
    example_gloss: Ulica obok mojej jest hałaśliwa.
  en.a1.unit39.lesson01.teach.friendly:
    title: friendly
    gloss: przyjazny / życzliwy
    note: '*friendly* znaczy przyjazny, życzliwy.'
    example_gloss: Moi sąsiedzi są bardzo przyjaźni.
  en.a1.unit39.lesson02.teach.live_in_a_neighborhood:
    title: live in a neighborhood
    gloss: mieszkać w okolicy
    note: '*live in a neighborhood* znaczy mieszkać w jakiejś okolicy lub dzielnicy.'
    example_gloss: Mieszkam w spokojnej okolicy.
  en.a1.unit39.lesson02.teach.get_along_with_your_neighbors:
    title: get along with your neighbors
    gloss: dogadywać się z sąsiadami
    note: '*get along with your neighbors* znaczy mieć dobre, przyjazne relacje z ludźmi, którzy mieszkają blisko ciebie.'
    example_gloss: Dogaduję się z moimi sąsiadami.
  en.a1.unit39.lesson02.teach.close_to:
    title: close to
    gloss: blisko (czegoś)
    note: '*close to* znaczy blisko jakiegoś miejsca.'
    example_gloss: Moje mieszkanie jest blisko sklepu spożywczego.
  en.a1.unit39.lesson02.teach.a_five_minute_walk:
    title: a five-minute walk
    gloss: pięć minut pieszo
    note: 'W *a five-minute walk* liczba i rzeczownik tworzą stałą konstrukcję: łączy je łącznik, a rzeczownik *walk* stoi w liczbie pojedynczej, nawet gdy minut jest pięć. Po polsku mówimy po prostu „pięć minut pieszo”.'
    example_gloss: Park jest pięć minut pieszo od mojego domu.
  en.a1.unit39.lesson02.teach.say_hello_to:
    title: say hello to
    gloss: mówić „cześć” (komuś)
    note: '*say hello to* znaczy przywitać się z kimś, powiedzieć komuś „cześć”.'
    example_gloss: Rano zawsze mówię „cześć” mojemu sąsiadowi.
  en.a1.unit39.lesson02.teach.whats_your_neighborhood_like_question:
    title: What's your neighborhood like?
    gloss: Jaka jest twoja okolica?
    note: '*What''s ... like?* pyta o opis, a nie o preferencje.'
  en.a1.unit39.lesson03.teach.dialogue_line1:
    title: Pytanie Leili
    gloss: 'Leila mówi: Być może wkrótce się przeprowadzę. Jaka jest twoja okolica, Mia?'
    note: '*might* + czasownik wyraża możliwość: może tak, może nie.'
  en.a1.unit39.lesson03.teach.dialogue_line2:
    title: "Odpowiedź: Mia"
    gloss: 'Mia mówi: Bardzo ją lubię. Jest cicho, a w pobliżu jest park.'
    note: '*there''s a park nearby* znaczy: w pobliżu jest park.'
  en.a1.unit39.lesson03.teach.dialogue_line3:
    title: Pytanie Leili
    gloss: 'Leila mówi: Brzmi super. Czy jest blisko sklepu spożywczego?'
    note: '*That sounds nice* to naturalna reakcja na dobrą wiadomość.'
  en.a1.unit39.lesson03.teach.dialogue_line4:
    title: "Odpowiedź: Mia"
    gloss: 'Mia mówi: Tak, jeden jest zaledwie pięć minut pieszo od mojego budynku.'
    note: '*just* znaczy tu zaledwie, tylko: podkreśla, jak krótka jest odległość.'
  en.a1.unit39.lesson03.teach.dialogue_line5:
    title: Pytanie Leili
    gloss: 'Leila pyta: A co z twoimi sąsiadami? Są przyjaźni?'
    note: '*What about ...?* to naturalny sposób na wprowadzenie nowego tematu.'
  en.a1.unit39.lesson03.teach.dialogue_line6:
    title: "Odpowiedź: Mia"
    gloss: 'Mia mówi: Bardzo! Mój sąsiad, pan Lopez, podlewa mi rośliny, kiedy mnie nie ma.'
    note: '*waters my plants* znaczy podlewa moje rośliny. W tym zdaniu *water* jest czasownikiem.'
  en.a1.unit39.lesson03.teach.dialogue_line7:
    title: Reakcja Leili
    gloss: 'Leila mówi: Jak miło. Chyba chciałabym mieszkać blisko ciebie!'
    note: '*I''d like to* + czasownik znaczy: chciałbym / chciałabym coś zrobić.'
  en.a1.unit39.lesson04.teach.reading_passage:
    title: Tekst o trzech okolicach
    gloss: Daniel, Leila i Mia mieszkają w trzech różnych okolicach. Okolica Daniela jest ruchliwa, z restauracjami i sklepami blisko jego bloku. Zna kilku sąsiadów i często wita się z nimi na korytarzu. Leila mieszka w spokojnej okolicy, blisko basenu, na który chodzi pływać. Sąsiadka z drugiej strony ulicy ma dużego psa, który dużo szczeka. Okolica Mii też jest spokojna, a sklep spożywczy jest zaledwie pięć minut pieszo od jej budynku. Jej sąsiad, pan Lopez, jest bardzo przyjazny i podlewa jej rośliny, kiedy jej nie ma. Po rozmowie z Mią Leila postanowiła poszukać mieszkania w jej pobliżu.
    note: '*decided she wants to look for* znaczy: postanowiła, że chce poszukać mieszkania.'
