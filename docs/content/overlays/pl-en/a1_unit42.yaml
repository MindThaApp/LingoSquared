  en.a1.unit42.lesson03.teach.dialogue_line1:
    title: Pytanie Mii
    gloss: 'Mia pyta: W przyszłym tygodniu zaczynam nowy projekt z Danielem. Jaki on jest?'
    note: '*What''s he like?* pyta o czyjś charakter.'
  en.a1.unit42.lesson03.teach.dialogue_line2:
    title: "Odpowiedź: Leila"
    gloss: 'Leila mówi: Jest bardzo przyjazny i naprawdę zabawny.'
    note: '*and he''s really funny too* znaczy: i jest też naprawdę zabawny.'
  en.a1.unit42.lesson03.teach.dialogue_line3:
    title: Pytanie Mii
    gloss: 'Mia mówi: Miło to słyszeć! Dobrze się z nim pracuje?'
    note: '*Is he easy to work with?* pyta, czy miło się z kimś pracuje.'
  en.a1.unit42.lesson03.teach.dialogue_line4:
    title: "Odpowiedź: Leila"
    gloss: 'Leila mówi: Tak, jest też bardzo pracowity. Zawsze kończy swoje zadania na czas.'
    note: '*finishes his tasks on time* znaczy: kończy swoje zadania na czas.'
  en.a1.unit42.lesson03.teach.dialogue_line5:
    title: Pytanie Mii
    gloss: 'Mia pyta: Czy bywa nieśmiały na spotkaniach?'
    note: '*ever* znaczy tu: kiedykolwiek, czasem.'
  en.a1.unit42.lesson03.teach.dialogue_line6:
    title: "Odpowiedź: Leila"
    gloss: 'Leila mówi: Trochę, ale czuje się swobodniej, gdy cię pozna.'
    note: '*once he knows you* znaczy: gdy tylko cię pozna.'
  en.a1.unit42.lesson03.teach.dialogue_line7:
    title: Podziękowanie Mii
    gloss: 'Mia mówi: Dzięki, Leilo. Teraz czuję się dużo spokojniejsza o ten projekt.'
    note: '*I feel more relaxed* znaczy: czuję się spokojniej, swobodniej.'
  en.a1.unit42.lesson04.teach.reading_passage:
    title: Tekst o trzech osobowościach
    gloss: 'Daniel, Leila i Mia są bliskimi przyjaciółmi, ale mają bardzo różne osobowości. Daniel jest przyjazny i zabawny: zawsze rozśmiesza przyjaciół. Jest trochę nieśmiały wobec nowych ludzi, ale szybko się otwiera. Leila jest spokojna i kreatywna. Uwielbia malować, bo to pomaga jej się odprężyć, i rzadko się czymś denerwuje. Mia jest towarzyska i zorganizowana. Lubi planować wspólne wyjścia i jest bardzo cierpliwa, gdy uczy przyjaciół czegoś nowego: nauczyła Daniela gotować. Choć każde z nich jest inne, dobrze się dogadują i lubią spędzać razem czas.'
    note: '*even though* znaczy: choć, mimo że.'
