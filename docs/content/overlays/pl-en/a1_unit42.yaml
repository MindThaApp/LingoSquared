    gloss: trochę nieśmiały
    note: '*a little* znaczy tu trochę (stopień), a nie mały (rozmiar), więc nie tłumacz tego dosłownie jako „mały nieśmiały”.'
    example_gloss: Na początku jest trochę nieśmiały, ale szybko się rozkręca.
