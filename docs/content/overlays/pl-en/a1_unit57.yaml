    title: screen
    gloss: ekran
    note: '*screen* oznacza ekran.'
    example_gloss: Ekran jest bardzo duży.
  en.a1.unit57.lesson01.teach.popcorn:
    title: popcorn
    gloss: prażona kukurydza
    note: '*popcorn* oznacza prażoną kukurydzę, popularną przekąskę w kinie.'
    example_gloss: W kinie zawsze kupujemy prażoną kukurydzę.
  en.a1.unit57.lesson02.teach.what_time_does_the_film_start:
    title: What time does the film start?
    gloss: O której zaczyna się film?
    note: W *does the film start* pytanie tworzy się z pomocniczym *does*, bo czasownik główny to *start*.
  en.a1.unit57.lesson02.teach.two_tickets_for_the_seven_oclock_show:
    title: Two tickets for the seven o'clock show, please.
    gloss: Poproszę dwa bilety na seans o siódmej.
    note: '*for the seven o''clock show* wiąże bilety z konkretnym seansem.'
  en.a1.unit57.lesson02.teach.can_i_have_some_popcorn:
    title: Can I have some popcorn, please?
    gloss: Czy mogę prosić trochę popcornu?
    note: '*Can I have...?* to bezpośredni, bardzo częsty sposób zamawiania czegoś.'
  en.a1.unit57.lesson02.teach.how_much_is_that_in_total:
    title: How much is that in total?
    gloss: Ile to będzie razem?
    note: '*in total* oznacza razem, w sumie – tak pytasz o końcową cenę.'
  en.a1.unit57.lesson02.teach.thats_twenty_dollars:
    title: That's twenty dollars, please.
    gloss: To dwadzieścia dolarów, proszę.
    note: '*That''s* + kwota to stały sposób podawania ceny.'
  en.a1.unit57.lesson02.teach.i_really_liked_it:
    title: I really liked it!
    gloss: Bardzo mi się podobało!
    note: 'Po angielsku mówi się dosłownie „lubiłem to”: czasownik *like* z dopełnieniem *it*. Po polsku podobna myśl wyraża się inaczej („podobało mi się”). Ucz się tego zdania jako całości, nie słowo po słowie.'
  en.a1.unit57.lesson03.teach.dialogue_line1:
    title: Daniel pyta o godzinę seansu
    gloss: 'Daniel mówi: Cześć! O której zaczyna się film?'
    note: W *does the film start* pytanie tworzy się z pomocniczym *does*.
  en.a1.unit57.lesson03.teach.dialogue_line2:
    title: Godzina seansu
    gloss: 'Kasjer mówi: Następny seans jest o siódmej.'
    note: '*at seven o''clock* używa przyimka *at* przy godzinie – po polsku odpowiada mu „o” (o siódmej).'
  en.a1.unit57.lesson03.teach.dialogue_line3:
    title: Daniel zamawia bilety
    gloss: 'Daniel mówi: Świetnie. Czy możemy prosić dwa bilety?'
    note: 'Jedna osobna informacja: liczba biletów (dwa).'
  en.a1.unit57.lesson03.teach.dialogue_line4:
    title: Cena biletów
    gloss: 'Kasjer mówi: Oczywiście. To szesnaście dolarów.'
    note: 'Jedna osobna informacja: łączna cena dwóch biletów.'
  en.a1.unit57.lesson03.teach.dialogue_line5:
    title: Leila zamawia popcorn
    gloss: 'Leila mówi: Czy możemy prosić trochę popcornu?'
    note: To prośba, a nie nowa informacja o cenie.
  en.a1.unit57.lesson03.teach.dialogue_line6:
    title: Cena popcornu
    gloss: 'Kasjer mówi: Jasne. Popcorn kosztuje cztery dolary.'
    note: 'Druga osobna informacja: cena popcornu, osobno od biletów.'
  en.a1.unit57.lesson03.teach.dialogue_line7:
    title: Daniel pyta o sumę
    gloss: 'Daniel mówi: Ile to będzie razem?'
    note: '*in total* pyta o sumę wszystkich cen.'
  en.a1.unit57.lesson03.teach.dialogue_line8:
    title: Łączna kwota
    gloss: 'Kasjer mówi: To dwadzieścia dolarów, proszę.'
    note: 'Trzecia osobna informacja: łączna kwota, inna niż osobne ceny biletów i popcornu.'
  en.a1.unit57.lesson03.teach.dialogue_line9:
    title: Leila nie może się doczekać
    gloss: 'Leila mówi: Dziękuję! Nie mogę się doczekać, żeby go obejrzeć.'
    note: '*I can''t wait to...* to stały zwrot wyrażający entuzjazm.'
  en.a1.unit57.lesson04.teach.cinema_schedule:
    title: Repertuar kina
    gloss: 'Repertuar kina: Star Journey - 7:00, $8. The Great Race - 5:00, $10. Funny Family - 9:00, $6.'
    note: Repertuar pokazuje trzy filmy z godziną seansu i ceną.
  en.a1.unit57.lesson04.teach.reading_passage:
    title: 'Tekst: Wieczór w kinie'
    gloss: Pewnego wieczoru Daniel i Leila postanowili pójść razem do kina na film. Zapytali, o której zaczyna się film, a kasjer powiedział, że następny seans, Star Journey, jest o siódmej. Kupili dwa bilety za szesnaście dolarów i torebkę popcornu za cztery dolary. W sumie wyszło dwadzieścia dolarów. Obejrzeli film razem – był o badaczach kosmosu. Był bardzo zabawny. Gdy się skończył, Leila powiedziała, że bardzo jej się podobał, a Daniel powiedział, że chce obejrzeć też następny.
    note: '*watched* to czas przeszły od *watch* (oglądać).'
