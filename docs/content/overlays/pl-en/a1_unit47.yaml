  en.a1.unit47.lesson02.teach.id_like_to_make_an_appointment:
    title: I'd like to make an appointment.
    gloss: Chciałbym umówić wizytę.
    note: '*I''d* to skrócona forma *I would*. *I''d like to ...* brzmi uprzejmie i jest zwykłym sposobem proszenia o coś, podobnie jak polskie „chciałbym”.'
  en.a1.unit47.lesson02.teach.are_you_available_on_friday:
    title: Are you available on Friday?
    gloss: Czy jesteś dostępny w piątek?
    note: 'Przed nazwą dnia tygodnia po angielsku zawsze stoi przyimek *on*: *on Friday*. Po polsku mówi się po prostu „w piątek”.'
  en.a1.unit47.lesson02.teach.what_time_works_for_you:
    title: What time works for you?
    gloss: Jaka godzina ci odpowiada?
    note: '*works for you* znaczy tu: odpowiada ci, pasuje ci. To stałe wyrażenie, nie dosłowne „pracować”.'
  en.a1.unit47.lesson02.teach.that_time_works_for_me:
    title: That time works for me.
    gloss: Ta godzina mi odpowiada.
    note: '*That time works for me.* znaczy: ta godzina mi odpowiada.'
  en.a1.unit47.lesson02.teach.can_we_reschedule_for_monday:
    title: Can we reschedule for Monday?
    gloss: Możemy to przełożyć na poniedziałek?
    note: '*reschedule for ...* używa przyimka *for*, żeby podać nowy termin.'
  en.a1.unit47.lesson02.teach.your_appointment_is_confirmed:
    title: Your appointment is confirmed.
    gloss: Twoja wizyta jest potwierdzona.
    note: '*Your appointment is confirmed.* znaczy: twoja wizyta jest potwierdzona.'
  en.a1.unit47.lesson03.teach.dialogue_line1:
    title: Pytanie Mii
    gloss: 'Mia pyta: Leila, czy z Maxem wszystko w porządku? Ostatnio wydaje się trochę zmęczony.'
    note: '*He seems a little tired lately.* znaczy: ostatnio wydaje się trochę zmęczony.'
  en.a1.unit47.lesson03.teach.dialogue_line2:
    title: Wyjaśnienie Leili
    gloss: 'Leila mówi: Jest dobrze, nie martw się. Po prostu pora na jego coroczną kontrolę. Muszę zadzwonić do weterynarza.'
    note: '*due for* znaczy: przyszła pora na coś, coś jest już potrzebne.'
  en.a1.unit47.lesson03.teach.dialogue_line3:
    title: Leila dzwoni do weterynarza
    gloss: 'Leila mówi: Dzień dobry, chciałabym umówić wizytę na kontrolę mojego psa.'
    note: '*I''d like to* brzmi grzeczniej niż *I want to*. Podobnie po polsku „chciałbym” jest uprzejmiejsze niż „chcę”.'
  en.a1.unit47.lesson03.teach.dialogue_line4:
    title: Pytanie Mii
    gloss: 'Mia pyta: Co powiedzieli?'
    note: '*did they say* używa did jako czasownika pomocniczego w czasie przeszłym.'
  en.a1.unit47.lesson03.teach.dialogue_line5:
    title: "Odpowiedź: Leila"
    gloss: 'Leila mówi: Mają wolny termin w czwartek o piętnastej.'
    note: '*at 3pm* używa przyimka *at* przy podawaniu konkretnej godziny.'
  en.a1.unit47.lesson03.teach.dialogue_line6:
    title: Pytanie Mii
    gloss: 'Mia pyta: Czy ta godzina ci odpowiada?'
    note: '*Does that time work for you?* to pytanie utworzone z *does*, tak jak w innych pytaniach z czasownikiem pomocniczym.'
  en.a1.unit47.lesson03.teach.dialogue_line7:
    title: Potwierdzenie Leili
    gloss: 'Leila mówi: Tak, pasuje mi. Czwartek, piętnasta, dziękuję! Wizyta Maxa jest potwierdzona.'
    note: '*Max''s appointment* ma dopełniacz saksoński z końcówką *''s*: po polsku to „wizyta Maxa”.'
  en.a1.unit47.lesson04.teach.reading_passage:
    title: Tekst o umawianiu wizyty
    gloss: 'Jak umówić wizytę: Jeśli chcesz iść do lekarza, dentysty lub skorzystać z innej usługi, zwykle musisz najpierw umówić wizytę. Zadzwoń i powiedz, że chcesz umówić wizytę. Recepcjonistka powie ci, które dni i godziny są wolne. Wybierz termin, który ci odpowiada, a oni potwierdzą twoją wizytę. Jeśli coś się zmieni, zadzwoń ponownie i poproś o przełożenie wizyty. W zeszłym tygodniu Leila zadzwoniła do weterynarza, żeby umówić coroczną kontrolę swojego psa Maxa. Mieli wolny termin w czwartek o piętnastej i Leila potwierdziła godzinę. Daniel też ma wizytę: w poniedziałek rano idzie do dentysty na kontrolę. Powiedział, że się nie denerwuje, tylko ma w tym tygodniu trochę dużo zajęć.'
    note: '*a little busy this week* znaczy: trochę zajęty w tym tygodniu.'
