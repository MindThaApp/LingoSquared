teaching:
  en.b2.unit06.lesson01.teach.value:
    title: value
    gloss: wartość
    note: '*value* oznacza tutaj zasadę, którą ludzie uważają za ważną, a nie tylko wartość finansową.'
    example_gloss: Sprawiedliwość jest wartością.
  en.b2.unit06.lesson01.teach.fairness:
    title: fairness
    gloss: sprawiedliwość, słuszne traktowanie
    note: '*fairness* dotyczy słusznego traktowania ludzi. Jest mocniejsze i bardziej abstrakcyjne niż samo *nice*.'
    example_gloss: Sprawiedliwość oznacza, że traktujesz ludzi słusznie.
  en.b2.unit06.lesson01.teach.convenience:
    title: convenience
    gloss: wygoda, praktyczna użyteczność
    note: '*convenience* to wygoda i praktyczność. W tym kontekście B2 nie zastępuj go słowem *easiness*.'
    example_gloss: Wygoda ułatwia codzienne życie.
  en.b2.unit06.lesson01.teach.flexibility:
    title: flexibility
    gloss: elastyczność
    note: '*flexibility* to zdolność dostosowania się, gdy zmieniają się okoliczności.'
    example_gloss: Elastyczność pozwala na zmianę, gdy zmieniają się okoliczności.
  en.b2.unit06.lesson01.teach.qualify:
    title: qualify
    gloss: uściślać, ograniczać (np. twierdzenie)
    note: '*qualify* oznacza tutaj ograniczenie lub uściślenie własnej opinii. Nie oznacza zdobycia dyplomu czy kwalifikacji.'
    example_gloss: Możesz uściślić opinię, ograniczając ją.
  en.b2.unit06.lesson01.teach.prioritize:
    title: prioritize
    gloss: stawiać na pierwszym miejscu, nadawać priorytet
    note: '*prioritize fairness* oznacza, że uznajesz sprawiedliwość za ważniejszą niż inną wartość.'
    example_gloss: Nadanie sprawiedliwości priorytetu oznacza, że uważasz ją za ważniejszą od czegoś innego.
  en.b2.unit06.lesson02.teach.in_principle:
    title: Ważenie wartości
    gloss: W zasadzie wygoda jest ważna, ale sprawiedliwość powinna mieć większą wagę.
    note: '*In principle* znaczy „w zasadzie”. Nie używaj *eventually* jako odpowiednika polskiego „ewentualnie”; *eventually* znaczy „w końcu”.'
  en.b2.unit06.lesson02.teach.not_arguing_everywhere:
    title: Ograniczanie własnego stanowiska
    gloss: Nie opowiadam się za ciszą wszędzie.
    note: '*I am not arguing for...* ogranicza twoją tezę. Jest lepsze niż niejasne dosłowne tłumaczenie z użyciem *a little*.'
  en.b2.unit06.lesson02.teach.respond_opposing:
    title: Bezpośrednia odpowiedź drugiej stronie
    gloss: To słuszna uwaga i zgadzam się, że firmy potrzebują elastyczności.
    note: '*That is fair* uznaje argument, nie rezygnując z własnej wartości.'
  en.b2.unit06.lesson02.teach.grammar_abstract_response:
    title: Budowanie abstrakcyjnej opinii
    gloss: Mocna abstrakcyjna opinia nazywa wartość, uściśla tezę i odpowiada wprost na pogląd drugiej osoby.
    note: Używaj precyzyjnych słów poziomu B2, takich jak *in principle*, *fairness* i *carry more weight*, a nie ciągle *a bit* dla wyrażenia niuansu.
  en.b2.unit06.lesson03.teach.transparent:
    title: transparent
    gloss: przejrzysty, łatwy do zrozumienia
    note: '*transparent rules* to zasady łatwe do zrozumienia i sprawdzenia.'
    example_gloss: Przejrzyste zasady są łatwe do zrozumienia.
  en.b2.unit06.lesson03.teach.commercial:
    title: commercial
    gloss: handlowy, komercyjny
    note: '*commercial activity* to działalność związana z firmami i zyskiem.'
    example_gloss: Działalność komercyjna ma związek z firmami.
  en.b2.unit06.lesson03.teach.reading_passage:
    title: 'Tekst do czytania: ciche przestrzenie publiczne'
    gloss: 'Amara przekonuje, że ciche przestrzenie publiczne powinny być chronione, nawet jeśli ogranicza to część działalności komercyjnej. Jej pogląd nie jest absolutny: nie opowiada się za ciszą wszędzie i przyznaje, że firmy potrzebują pewnej elastyczności. Przeciwny pogląd Lea jest taki, że przepisy mogą utrudnić firmom przetrwanie. Amara odpowiada wprost na ten argument, mówiąc, że wygoda jest ważna, ale sprawiedliwość powinna mieć większą wagę, gdy przestrzeń należy do wszystkich. Jej stanowisko jest uściślone, ponieważ popiera ograniczone i przejrzyste zasady, a nie nieograniczone zakazy.'
    note: 'To abstrakcyjny angielski: nazywaj wartości i precyzyjnie ograniczaj swoją tezę.'
  en.b2.unit06.lesson04.teach.q_protect_spaces:
    title: Amara przedstawia swoje stanowisko
    gloss: 'Amara mówi: Uważam, że miasto powinno chronić ciche przestrzenie publiczne, nawet jeśli ogranicza to część działalności komercyjnej.'
    note: '*even if* pokazuje, że przyznaje, iż ma to pewną wadę.'
  en.b2.unit06.lesson04.teach.a_business_flexibility:
    title: Leo wskazuje drugą wartość
    gloss: 'Leo mówi: Ja też cenię ciszę, ale firmy potrzebują elastyczności, żeby przetrwać.'
    note: Leo przeciwstawia elastyczność naciskowi Amary na przestrzeń publiczną.
  en.b2.unit06.lesson04.teach.q_not_silence:
    title: Amara uściśla swoje stanowisko
    gloss: 'Amara mówi: To słuszna uwaga i nie opowiadam się za ciszą wszędzie. Chodzi mi o to, że wspólnych przestrzeni nie powinien kształtować wyłącznie zysk.'
    note: '*not arguing for silence everywhere* sprawia, że jej stanowisko nie brzmi absolutnie.'
  en.b2.unit06.lesson04.teach.a_prioritizing:
    title: Leo nazywa wartość
    gloss: 'Leo mówi: Czyli wartością, którą stawiasz na pierwszym miejscu, jest sprawiedliwość, a nie tylko komfort?'
    note: '*prioritizing* oznacza tutaj: uznawać za ważniejsze przy ważeniu racji.'
  en.b2.unit06.lesson04.teach.q_fairness_weight:
    title: Amara waży wartości
    gloss: 'Amara mówi: Dokładnie. W zasadzie wygoda jest ważna, ale sprawiedliwość powinna mieć większą wagę, gdy przestrzeń należy do wszystkich.'
    note: '*carry more weight* to naturalny angielski odpowiednik „mieć większą wagę”.'
  en.b2.unit06.lesson04.teach.a_accept_rules:
    title: Leo akceptuje pod warunkiem
    gloss: 'Leo mówi: Mogę to zaakceptować, jeśli zasady będą ograniczone i przejrzyste.'
    note: Akceptacja zależy od ograniczonego charakteru i przejrzystości zasad.
