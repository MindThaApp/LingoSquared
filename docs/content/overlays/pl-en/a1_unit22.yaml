teaching:
  en.a1.unit22.lesson01.teach.headache:
    title: headache
    gloss: ból głowy
    note: '*headache* znaczy ból głowy. Po angielsku mówi się *a headache*, czyli liczba pojedyncza z przedimkiem; nie mówi się *I have headache*.'
    example_gloss: Boli mnie głowa.
  en.a1.unit22.lesson01.teach.stomachache:
    title: stomachache
    gloss: ból brzucha
    note: '*stomachache* znaczy ból brzucha. Tu też liczba pojedyncza z przedimkiem (*a stomachache*).'
    example_gloss: Boli mnie brzuch.
  en.a1.unit22.lesson01.teach.fever:
    title: fever
    gloss: gorączka
    note: '*fever* znaczy gorączka. Mówi się *have a fever*, a nie *have fever*.'
    example_gloss: Chyba mam gorączkę.
  en.a1.unit22.lesson01.teach.cough:
    title: cough
    gloss: kaszel
    note: '*cough* znaczy kaszel. To słowo jest rzeczownikiem i czasownikiem: *a cough* (kaszel), *to cough* (kaszleć).'
    example_gloss: Daniel ma silny kaszel.
  en.a1.unit22.lesson01.teach.sore_throat:
    title: sore throat
    gloss: ból gardła
    note: '*sore throat* znaczy ból gardła. *sore* znaczy „obolały"; tu też występuje przedimek: *a sore throat*.'
    example_gloss: Boli mnie gardło.
  en.a1.unit22.lesson02.teach.whats_wrong:
    title: What's wrong?
    gloss: Co się stało?
    note: Pytaniem *What's wrong?* pytasz o problem. *What's* to skrót od *What is*.
  en.a1.unit22.lesson02.teach.i_have_a_headache:
    title: I have a headache.
    gloss: Boli mnie głowa.
    note: Zdaniem *I have a...* podajesz dolegliwość. Dosłownie to „Mam ...", ale po angielsku dolegliwość wymaga przedimka *a*, a po polsku mówimy „boli mnie ...".
  en.a1.unit22.lesson02.teach.i_feel_hot:
    title: I feel hot.
    gloss: Jest mi gorąco.
    note: Zdaniem *I feel...* mówisz, jak się czujesz fizycznie. *I feel hot* znaczy „jest mi gorąco"; podmiotem po angielsku jest *I*, a nie „mi".
  en.a1.unit22.lesson03.teach.rest:
    title: rest
    gloss: odpoczywać
    note: '*rest* znaczy odpoczywać.'
    example_gloss: Muszę odpocząć.
  en.a1.unit22.lesson03.teach.symptom_text:
    title: "Tekst o dolegliwościach"
    gloss: Boli mnie głowa i gardło. Chyba mam też gorączkę. Muszę odpocząć.
    note: W tym krótkim tekście ktoś opisuje kilka dolegliwości naraz.
  en.a1.unit22.lesson04.teach.see_a_doctor:
    title: You should see a doctor.
    gloss: Powinieneś pójść do lekarza.
    note: 'Zwrotem *You should...* dajesz prostą radę: „powinieneś ...". Po *should* czasownik stoi bez *to*.'
  en.a1.unit22.lesson04.teach.q_dont_look_well:
    title: "Pytanie, co się stało"
    gloss: 'Leila mówi: Nie wyglądasz dobrze. Co się stało?'
    note: '*You don''t look well* znaczy: Nie wyglądasz dobrze.'
  en.a1.unit22.lesson04.teach.a_headache_sore_throat:
    title: "Odpowiedź Daniela"
    gloss: 'Daniel mówi: Boli mnie głowa i gardło.'
    note: Daniel wymienia dwie dolegliwości naraz.
  en.a1.unit22.lesson04.teach.q_do_you_have_fever:
    title: "Pytanie o gorączkę"
    gloss: 'Leila pyta: Masz gorączkę?'
    note: Pytaniem *Do you have a fever?* pytasz o konkretną dolegliwość.
  en.a1.unit22.lesson04.teach.a_not_sure_feel_hot:
    title: "Odpowiedź Daniela"
    gloss: 'Daniel mówi: Nie jestem pewien, ale jest mi gorąco.'
    note: Daniel nie jest pewien, ale mówi, jak się czuje.
  en.a1.unit22.lesson04.teach.a_rest_water_doctor:
    title: "Rada Leili"
    gloss: 'Leila mówi: Powinieneś odpocząć i pić wodę. Jeśli ci nie przejdzie, powinieneś pójść do lekarza.'
    note: Leila najpierw daje prostą radę, a potem mówi, kiedy Daniel powinien pójść do lekarza.
  en.a1.unit22.lesson04.teach.a_okay_rest_today:
    title: "Ostatnia odpowiedź Daniela"
    gloss: 'Daniel mówi: Okej, dzięki. Dziś odpocznę.'
    note: Daniel przyjmuje radę i mówi, co zrobi dzisiaj.
