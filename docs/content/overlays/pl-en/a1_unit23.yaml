teaching:
  en.a1.unit23.lesson01.teach.teacher:
    title: teacher
    gloss: nauczyciel, nauczycielka
    note: '*teacher* znaczy nauczyciel lub nauczycielka. Angielski nie rozróżnia tu płci: *teacher* pasuje do obu.'
    example_gloss: Leila jest nauczycielką.
  en.a1.unit23.lesson01.teach.nurse:
    title: nurse
    gloss: pielęgniarz, pielęgniarka
    note: '*nurse* znaczy pielęgniarz lub pielęgniarka. To słowo jest takie samo dla kobiet i mężczyzn.'
    example_gloss: Jestem pielęgniarzem / pielęgniarką.
  en.a1.unit23.lesson01.teach.engineer:
    title: engineer
    gloss: inżynier, inżynierka
    note: '*engineer* znaczy inżynier lub inżynierka. Przed samogłoską stoi *an*: *an engineer*.'
    example_gloss: Daniel jest inżynierem.
  en.a1.unit23.lesson01.teach.cook:
    title: cook
    gloss: kucharz, kucharka
    note: '*cook* znaczy kucharz lub kucharka; to słowo jest też czasownikiem („gotować").'
    example_gloss: Mój brat jest kucharzem.
  en.a1.unit23.lesson01.teach.driver:
    title: driver
    gloss: kierowca
    note: '*driver* znaczy kierowca. W *bus driver* podaje się razem z pojazdem, który po angielsku stoi na początku.'
    example_gloss: On jest kierowcą autobusu.
  en.a1.unit23.lesson02.teach.what_do_you_do:
    title: What do you do?
    gloss: Czym się zajmujesz?
    note: Pytaniem *What do you do?* pytasz o zawód. Dosłownie to „Co robisz?", ale chodzi o „Czym się zajmujesz?".
  en.a1.unit23.lesson02.teach.im_a_nurse:
    title: I'm a nurse.
    gloss: Jestem pielęgniarzem / pielęgniarką.
    note: 'Zdaniem *I''m a...* podajesz swój zawód. Uwaga: po polsku mówimy „Jestem nauczycielem" bez przedimka, a po angielsku przed zawodem stoi *a* lub *an*.'
  en.a1.unit23.lesson02.teach.where_do_you_work:
    title: Where do you work?
    gloss: Gdzie pracujesz?
    note: Pytaniem *Where do you work?* pytasz o miejsce pracy.
  en.a1.unit23.lesson03.teach.patients:
    title: patients
    gloss: pacjenci
    note: '*patients* znaczy pacjenci (liczba mnoga). Wymawia się *PAY-shents*.'
    example_gloss: Codziennie pomagam pacjentom.
  en.a1.unit23.lesson03.teach.profile_text:
    title: "Tekst o zawodzie"
    gloss: Jestem pielęgniarzem / pielęgniarką. Pracuję w szpitalu. Codziennie pomagam pacjentom i piszę raporty.
    note: W tym krótkim opisie ktoś opowiada o swoim zawodzie i codziennej pracy.
  en.a1.unit23.lesson04.teach.interesting_work:
    title: It's interesting work.
    gloss: To ciekawa praca.
    note: '*interesting* znaczy ciekawy.'
  en.a1.unit23.lesson04.teach.q_what_do_you_do_daniel:
    title: "Pytanie Daniela o zawód"
    gloss: 'Leila pyta: Daniel, czym się zajmujesz?'
    note: To samo pytanie co w drugiej lekcji, tym razem z imieniem.
  en.a1.unit23.lesson04.teach.a_engineer_small_company:
    title: "Odpowiedź Daniela"
    gloss: 'Daniel mówi: Jestem inżynierem. Pracuję w małej firmie w centrum miasta.'
    note: Daniel podaje swój zawód i mówi, gdzie pracuje.
  en.a1.unit23.lesson04.teach.q_what_every_day:
    title: "Pytanie o codzienne zadania"
    gloss: 'Leila pyta: Co robisz codziennie?'
    note: To pytanie dotyczy codziennych zadań.
  en.a1.unit23.lesson04.teach.a_reports_emails_clients:
    title: "Odpowiedź Daniela"
    gloss: 'Daniel mówi: Piszę raporty i odpowiadam na e-maile. Czasem spotykam się z klientami.'
    note: Daniel wymienia kilka rzeczy, które robi codziennie.
  en.a1.unit23.lesson04.teach.q_like_your_job:
    title: "Pytanie, czy Daniel lubi swoją pracę"
    gloss: 'Leila pyta: Lubisz swoją pracę?'
    note: Pytaniem *Do you like your job?* pytasz, czy komuś podoba się jego praca.
  en.a1.unit23.lesson04.teach.a_yes_interesting:
    title: "Odpowiedź Daniela"
    gloss: 'Daniel mówi: Tak, bardzo. To ciekawa praca.'
    note: Daniel mówi „tak" i podaje też powód.
