    gloss: musieć
    note: '*need to* znaczy musieć coś zrobić.'
    example_gloss: W ten weekend muszę odkurzyć salon.
  en.a1.unit38.lesson02.teach.can_you_help_me_with_question:
    title: Can you help me with the dishes?
    gloss: Możesz mi pomóc ze zmywaniem?
    note: Uprzejmy sposób proszenia o pomoc przy obowiązku domowym.
  en.a1.unit38.lesson03.teach.dialogue_line1:
    title: Problem Mii
    gloss: 'Mia mówi: Moje mieszkanie to bałagan. W ten weekend mam gości.'
    note: '*a mess* znaczy bałagan.'
  en.a1.unit38.lesson03.teach.dialogue_line2:
    title: Propozycja Daniela
    gloss: 'Daniel pyta: Chcesz pomocy ze sprzątaniem?'
    note: '*Do you want some help ...ing?* to naturalny sposób, żeby zaoferować pomoc.'
  en.a1.unit38.lesson03.teach.dialogue_line3:
    title: "Odpowiedź: Mia"
    gloss: 'Mia mówi: Tak, poproszę! Muszę odkurzyć salon i pozmywać naczynia.'
    note: '*I need to* + czasownik znaczy „muszę” + czasownik.'
  en.a1.unit38.lesson03.teach.dialogue_line4:
    title: Propozycja Daniela
    gloss: 'Daniel mówi: Mogę odkurzyć za ciebie. Ty możesz pozmywać naczynia.'
    note: '*for you* znaczy tu „za ciebie”, czyli „zamiast ciebie”.'
  en.a1.unit38.lesson03.teach.dialogue_line5:
    title: Dodatek Mii
    gloss: 'Mia mówi: Dzięki! Muszę jeszcze zrobić pranie.'
    note: '*still need to* znaczy „muszę jeszcze”.'
  en.a1.unit38.lesson03.teach.dialogue_line6:
    title: Propozycja Daniela
    gloss: 'Daniel mówi: Dziś nie mam na to czasu, ale mogę wynieść śmieci, zanim wyjdę.'
    note: '*before I leave* znaczy „zanim wyjdę”.'
  en.a1.unit38.lesson03.teach.dialogue_line7:
    title: Podziękowanie Mii
    gloss: 'Mia mówi: To bardzo by pomogło. Bardzo dziękuję!'
    note: '*That would help a lot* znaczy „to bardzo by pomogło”. *Would* sprawia, że brzmi to uprzejmiej.'
  en.a1.unit38.lesson04.teach.reading_passage:
    title: Tekst o obowiązkach w domu
    gloss: Daniel, Leila i Mia mają swoje nawyki związane z obowiązkami domowymi. Daniel co wieczór po kolacji zmywa naczynia, a w soboty odkurza mieszkanie. Leila nie ma nic przeciwko robieniu prania, ale nienawidzi sprzątać łazienki. Kotka Mii, Luna, zostawia wszędzie sierść, więc Mia odkurza mieszkanie prawie codziennie. W zeszły weekend Mia miała gości, więc Daniel zaproponował jej pomoc. Odkurzył salon i wyniósł za nią śmieci. Mia była mu bardzo wdzięczna za pomoc.
    note: '*doesn''t mind* znaczy „nie ma nic przeciwko”.'
