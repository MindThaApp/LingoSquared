    title: wash the dishes
    gloss: zmywać naczynia
    note: '*wash the dishes* znaczy dosłownie myć naczynia. *Do the dishes* jest równie częste i znaczy to samo (zmywać).'
    example_gloss: Co wieczór zmywam naczynia.
