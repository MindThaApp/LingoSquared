    example_gloss: W niedziele ona robi pranie.
  en.a1.unit38.lesson02.teach.take_out_the_trash:
    title: take out the trash
    gloss: wynieść śmieci
    note: '*take out the trash* używa *take out*, a nie *do*. W odróżnieniu od *do the laundry* czy *do the dishes* nie możesz tu użyć *do*.'
    example_gloss: Możesz wynieść śmieci?
