teaching:
  en.a2.unit39.lesson01.teach.offer:
    title: offer
    gloss: oferta
    note: '*offer* to tu oferta pracy. Jako czasownik *to offer* znaczy proponować, oferować.'
    example_gloss: Dostałem ofertę pracy od Bright Path Marketing.
  en.a2.unit39.lesson01.teach.contract:
    title: contract
    gloss: umowa o pracę, umowa
    note: '*contract* to pisemne porozumienie między tobą a firmą.'
    example_gloss: Umowa jest na rok.
  en.a2.unit39.lesson01.teach.salary:
    title: salary
    gloss: wynagrodzenie, pensja
    note: '*salary* to kwota, którą zarabiasz miesięcznie lub rocznie.'
    example_gloss: O wynagrodzeniu możemy porozmawiać w przyszłym tygodniu.
  en.a2.unit39.lesson01.teach.accept:
    title: accept
    gloss: przyjąć
    note: '*accept* znaczy odpowiedzieć „tak” na to, co ci się proponuje.'
    example_gloss: Chciałbym przyjąć to stanowisko.
  en.a2.unit39.lesson01.teach.start_date:
    title: start date
    gloss: data rozpoczęcia pracy
    note: '*start date* to pierwszy dzień w nowej pracy.'
    example_gloss: Data rozpoczęcia pracy to pierwszy poniedziałek miesiąca.
  en.a2.unit39.lesson01.teach.reply:
    title: reply
    gloss: odpowiedź
    note: '*reply* to zarówno odpowiedź na wiadomość, jak i czasownik odpowiadać.'
    example_gloss: Odpowiedź wysłałem jeszcze tego samego dnia.
  en.a2.unit39.lesson01.teach.grammar_would_like_to:
    title: would like to w uprzejmym życzeniu
    gloss: Chciałbym przyjąć ofertę. Chciałbym zacząć w poniedziałek.
    note: '*I would like to ...* jest grzeczniejsze niż *I want to ...* i pasuje do kontaktów zawodowych.'
  en.a2.unit39.lesson02.teach.thank_you_for_the_interview:
    title: Rozpoczynanie wiadomości
    gloss: Dziękuję za wczorajszą rozmowę.
    note: '*Thank you for ...* to zwykły początek krótkiej służbowej wiadomości z podziękowaniem.'
  en.a2.unit39.lesson02.teach.still_interested:
    title: Mówienie, że nadal jesteś zainteresowany
    gloss: Nadal jestem bardzo zainteresowany tym stanowiskiem.
    note: '*still* znaczy „nadal” i stoi przed przymiotnikiem.'
  en.a2.unit39.lesson02.teach.could_you_tell_me_start_date:
    title: Uprzejme pytanie o termin rozpoczęcia
    gloss: Czy mógłby mi Pan podać datę rozpoczęcia pracy?
    note: '*Could you tell me ...?* to pytanie pośrednie, grzeczniejsze niż *When is the start date?*'
  en.a2.unit39.lesson02.teach.would_like_to_accept:
    title: Przyjmowanie oferty
    gloss: Chciałbym przyjąć ofertę.
    note: To standardowe zdanie, którym przyjmuje się ofertę pracy.
  en.a2.unit39.lesson02.teach.grammar_indirect_questions:
    title: Pytania pośrednie z Could you tell me
    gloss: Czy mógłby mi Pan podać datę rozpoczęcia pracy? Czy mógłby mi Pan powiedzieć coś o godzinach pracy?
    note: 'Po *Could you tell me* nie stosuje się szyku pytania: mówi się *the start date*, a nie *what is the start date*.'
  en.a2.unit39.lesson03.teach.full_time:
    title: full time
    gloss: pełny etat
    note: '*full time* oznacza pełny tydzień pracy; przeciwieństwem jest *part time* (niepełny etat).'
    example_gloss: To stanowisko jest na pełny etat, a nie tylko na dwa dni w tygodniu.
  en.a2.unit39.lesson03.teach.offer_message:
    title: Wiadomość z ofertą
    gloss: Droga Mio, dziękujemy za przyjście do nas we wtorek. Chcielibyśmy zaproponować Pani stanowisko koordynatorki marketingu. Umowa jest na pełny etat, a data rozpoczęcia pracy to poniedziałek. Prosimy o odpowiedź do piątku. Bright Path Marketing.
    note: 'Wiadomość z ofertą pracy zawsze podaje cztery rzeczy: stanowisko, rodzaj umowy, datę rozpoczęcia i termin na twoją odpowiedź.'
  en.a2.unit39.lesson03.teach.please_reply_by_friday:
    title: Termin odpowiedzi
    gloss: Proszę odpowiedzieć do piątku.
    note: '*by Friday* znaczy „najpóźniej do piątku”, czyli sam piątek jeszcze się liczy.'
  en.a2.unit39.lesson04.teach.q_calling_about_interview:
    title: Rekruterka dzwoni do Mii
    gloss: 'Rekruterka mówi: Dzień dobry, Mio, dzwonię w sprawie rozmowy we wtorek.'
    note: '*I am calling about ...* to zwykłe rozpoczęcie służbowej rozmowy telefonicznej.'
  en.a2.unit39.lesson04.teach.a_still_interested:
    title: Mia mówi, że nadal jest zainteresowana
    gloss: 'Mia mówi: Dziękuję za telefon. Nadal jestem bardzo zainteresowana tym stanowiskiem.'
    note: To samo zdanie co w lekcji 2.
  en.a2.unit39.lesson04.teach.q_offer_you_the_job:
    title: Rekruterka oferuje stanowisko
    gloss: 'Rekruterka mówi: Bardzo mnie to cieszy, ponieważ chcielibyśmy zaproponować Pani tę pracę.'
    note: '*because* łączy tu odpowiedź Mii z dobrą wiadomością, która za nią następuje.'
  en.a2.unit39.lesson04.teach.a_great_news_ask_start_date:
    title: Mia reaguje i pyta o termin rozpoczęcia
    gloss: 'Mia mówi: To świetna wiadomość. Czy mogłaby mi Pani podać datę rozpoczęcia pracy?'
    note: Najpierw krótko zareaguj na wiadomość, dopiero potem zadaj pytanie.
  en.a2.unit39.lesson04.teach.q_start_date_and_contract:
    title: Rekruterka podaje termin i umowę
    gloss: 'Rekruterka mówi: Data rozpoczęcia pracy to poniedziałek, a umowa jest na pełny etat.'
    note: Te same dwa fakty co w wiadomości w lekcji 3.
  en.a2.unit39.lesson04.teach.a_ask_working_hours:
    title: Mia pyta o godziny pracy
    gloss: 'Mia pyta: Czy mogłaby mi Pani powiedzieć coś o godzinach pracy?'
    note: Ta sama forma pytania pośredniego co przy dacie rozpoczęcia.
  en.a2.unit39.lesson04.teach.q_nine_to_five:
    title: Rekruterka podaje godziny pracy
    gloss: 'Rekruterka mówi: Od dziewiątej do siedemnastej, z godzinną przerwą na lunch.'
    note: '*from nine to five* to stałe wyrażenie opisujące dzień pracy.'
  en.a2.unit39.lesson04.teach.a_accept_the_offer:
    title: Mia przyjmuje ofertę
    gloss: 'Mia mówi: Dziękuję. Chciałabym przyjąć ofertę.'
    note: To samo zdanie co w lekcji 2.
  en.a2.unit39.lesson04.teach.q_send_the_contract:
    title: Rekruterka kończy rozmowę
    gloss: 'Rekruterka mówi: Wspaniale. Umowę wyślemy Pani jeszcze dzisiaj.'
    note: '*Wonderful* to ciepła, pozytywna reakcja, całkiem zwyczajna także w angielskim używanym w pracy.'
