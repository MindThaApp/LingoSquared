teaching:
  en.b1.unit15.lesson01.teach.complain:
    title: complain
    gloss: złożyć skargę
    note: '*complain* oznacza oficjalnie zgłosić, że coś jest nie w porządku lub nie spełnia oczekiwań.'
    example_gloss: Mia postanowiła złożyć skargę na uszkodzone krzesło.
  en.b1.unit15.lesson01.teach.damaged:
    title: damaged
    gloss: uszkodzony
    note: '*damaged* opisuje produkt, który jest zepsuty lub uszkodzony.'
    example_gloss: Krzesło dotarło uszkodzone.
  en.b1.unit15.lesson01.teach.refund:
    title: refund
    gloss: zwrot pieniędzy
    note: '*refund* to pieniądze zwracane za zwrócony lub wadliwy produkt.'
    example_gloss: Mia poprosiła o zwrot pieniędzy.
  en.b1.unit15.lesson01.teach.replacement:
    title: replacement
    gloss: wymiana, produkt zastępczy
    note: '*replacement* to nowy artykuł w miejsce wadliwego.'
    example_gloss: Firma zaproponowała zamiast tego wymianę.
  en.b1.unit15.lesson01.teach.resolve:
    title: resolve
    gloss: rozwiązać, załatwić
    note: '*resolve* oznacza całkowicie rozwiązać problem.'
    example_gloss: Konsultant obiecał szybko rozwiązać problem.
  en.b1.unit15.lesson01.teach.issue:
    title: issue
    gloss: problem, sprawa
    note: '*issue* to problem, którym trzeba się zająć.'
    example_gloss: Mia jasno opisała problem.
  en.b1.unit15.lesson02.teach.writing_to_complain:
    title: I'm writing to complain about + rzeczownik
    gloss: Piszę, aby złożyć skargę na uszkodzony produkt.
    note: '*I''m writing to complain about* rozpoczyna uprzejmą skargę na piśmie.'
  en.b1.unit15.lesson02.teach.would_like_refund:
    title: I would like + rzeczownik
    gloss: Proszę o zwrot pieniędzy za ten artykuł.
    note: '*I would like a refund for* uprzejmie prosi o zwrot pieniędzy.'
  en.b1.unit15.lesson02.teach.grammar_complaint_structure:
    title: Budowa uprzejmej skargi
    gloss: 'Uprzejma skarga na piśmie ma zwykle trzy części: nazwanie problemu (I''m writing to complain about...), napisanie, co się stało (it arrived damaged / it stopped working), i prośbę o konkretne rozwiązanie (I would like a refund / I would like a replacement).'
    note: 'Schemat: nazwij problem, napisz, co się stało, poproś o konkretne rozwiązanie.'
  en.b1.unit15.lesson03.teach.desk_chair:
    title: desk chair
    gloss: krzesło biurowe
    note: '*desk chair* to krzesło, na którym siedzi się przy biurku.'
    example_gloss: Mia zamówiła nowe krzesło biurowe do swojego domowego biura.
  en.b1.unit15.lesson03.teach.as_soon_as_possible:
    title: as soon as possible
    gloss: jak najszybciej
    note: '*as soon as possible* oznacza bez zbędnej zwłoki.'
    example_gloss: Mia poprosiła o wymianę jak najszybciej.
  en.b1.unit15.lesson03.teach.reading_passage:
    title: 'Tekst: skarga na krzesło biurowe'
    gloss: Szanowni Państwo z GreenDesk, piszę, aby złożyć skargę na uszkodzony produkt. W zeszłym tygodniu zamówiłam krzesło biurowe do domowego biura, ale dotarło z zepsutym kółkiem. Proszę o wymianę jak najszybciej. Proszę o informację, jak mam postąpić. Dziękuję, Mia
    note: Krótki, uprzejmy list ze skargą.
  en.b1.unit15.lesson04.teach.q_calling_to_complain:
    title: Mia dzwoni, żeby złożyć skargę na krzesło biurowe
    gloss: 'Mia mówi: Dzień dobry, dzwonię, żeby złożyć skargę na krzesło biurowe, które zamówiłam.'
    note: '*I''m calling to complain about* rozpoczyna uprzejmą skargę przez telefon.'
  en.b1.unit15.lesson04.teach.a_whats_the_issue:
    title: Pracownik pyta o problem
    gloss: 'Konsultant mówi: Przykro mi to słyszeć. Co jest z nim nie tak?'
    note: '*I''m sorry to hear that* to uprzejma, pełna empatii reakcja.'
  en.b1.unit15.lesson04.teach.q_broken_wheel_cant_use:
    title: Mia opisuje problem
    gloss: 'Mia mówi: Dotarło z zepsutym kółkiem, więc nie mogę z niego korzystać.'
    note: '*it arrived with a broken wheel* wyjaśnia, co się stało.'
  en.b1.unit15.lesson04.teach.a_refund_or_replacement:
    title: Pracownik proponuje rozwiązanie
    gloss: 'Konsultant mówi: Rozumiem. Woli Pani zwrot pieniędzy czy wymianę?'
    note: '*would you like... or...* daje klientowi wybór.'
  en.b1.unit15.lesson04.teach.q_prefer_replacement:
    title: Mia wybiera zamiennik
    gloss: 'Mia mówi: Wolałabym wymianę, jeśli to możliwe.'
    note: '*I would prefer a replacement, if that''s possible* uprzejmie wyraża preferencję.'
  en.b1.unit15.lesson04.teach.a_resolve_send_friday:
    title: Pracownik potwierdza rozwiązanie
    gloss: 'Konsultant mówi: Oczywiście. Załatwimy to i wyślemy Pani nowe krzesło do piątku.'
    note: '*we''ll resolve this and send... by Friday* to konkretna obietnica z terminem.'
