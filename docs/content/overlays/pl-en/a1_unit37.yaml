  en.a1.unit37.lesson03.teach.dialogue_line1:
    title: Pytanie Leili
    gloss: 'Leila pyta: Wiedziałeś, że Daniel ma urodziny 12 października?'
    note: '*Did you know ...?* to naturalny sposób, żeby zacząć rozmowę od nowej informacji.'
  en.a1.unit37.lesson03.teach.dialogue_line2:
    title: Reakcja Mii
    gloss: 'Mia mówi: Nie, nie wiedziałam! To już w przyszły piątek.'
    note: '*No, I didn''t!* to krótka przecząca odpowiedź na pytanie z *Did you know ...?*: „Nie, nie wiedziałam.”'
  en.a1.unit37.lesson03.teach.dialogue_line3:
    title: Propozycja Leili
    gloss: 'Leila mówi: Urządźmy mu przyjęcie-niespodziankę w biurze.'
    note: '*Let''s* + czasownik służy do składania propozycji, podobnie jak polskie „zróbmy”, „chodźmy”.'
  en.a1.unit37.lesson03.teach.dialogue_line4:
    title: Reakcja Mii
    gloss: 'Mia mówi: Świetny pomysł! Mogę zaprosić resztę zespołu.'
    note: '*the rest of the team* znaczy reszta zespołu.'
  en.a1.unit37.lesson03.teach.dialogue_line5:
    title: Plan Leili
    gloss: 'Leila mówi: Super. Kupię mu prezent, może nowe buty do biegania, bo uwielbia biegać.'
    note: '*since* znaczy tu „ponieważ” (powód), a nie „od” (czas).'
  en.a1.unit37.lesson03.teach.dialogue_line6:
    title: Propozycja Mii
    gloss: 'Mia mówi: To świetny pomysł. Może kupimy też tort?'
    note: '*Should we ...?* używasz, gdy wspólnie podejmujecie decyzję.'
  en.a1.unit37.lesson03.teach.dialogue_line7:
    title: "Odpowiedź: Leila"
    gloss: 'Leila mówi: Tak, na pewno! Wszyscy razem złożymy mu życzenia urodzinowe.'
    note: '*We''ll all wish him a happy birthday* znaczy: wszyscy złożymy mu życzenia urodzinowe.'
  en.a1.unit37.lesson04.teach.reading_passage:
    title: Tekst o przyjęciu-niespodziance
    gloss: Daniel nie wiedział, że Leila i Mia planują dla niego przyjęcie-niespodziankę. 12 października, w dniu jego urodzin, przyszedł do pracy i znalazł w pokoju socjalnym balony i tort. Wszyscy złożyli mu życzenia. Leila podarowała mu nową parę butów do biegania. Mia dała mu oprawione zdjęcie trojga współpracowników razem, które zrobiła sama. Daniel był bardzo szczęśliwy i podziękował wszystkim za wspaniałą niespodziankę.
    note: '*he arrived at work and found*: czas przeszły od *arrive* i *find* (przyszedł do pracy i znalazł ...).'
