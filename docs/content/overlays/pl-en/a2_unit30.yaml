teaching:
  en.a2.unit30.lesson01.teach.experience:
    title: experience
    gloss: doświadczenie
    note: '*experience* znaczy doświadczenie, zwłaszcza zawodowe.'
    example_gloss: Mam dwa lata doświadczenia w marketingu.
  en.a2.unit30.lesson01.teach.position:
    title: position
    gloss: stanowisko
    note: '*position* znaczy stanowisko lub posadę w firmie.'
    example_gloss: To stanowisko jest dla koordynatora lub koordynatorki marketingu.
  en.a2.unit30.lesson01.teach.availability:
    title: availability
    gloss: dostępność
    note: '*availability* oznacza, kiedy masz czas, na przykład żeby zacząć pracę.'
    example_gloss: Rekruterka zapytała mnie o moją dostępność.
  en.a2.unit30.lesson01.teach.strength:
    title: strength
    gloss: mocna strona
    note: '*strength* oznacza coś, co potrafisz szczególnie dobrze.'
    example_gloss: Jedną z moich mocnych stron jest dobra organizacja pracy.
  en.a2.unit30.lesson01.teach.requirement:
    title: requirement
    gloss: wymóg, wymaganie
    note: '*requirement* oznacza coś, czego wymaga się na danym stanowisku.'
    example_gloss: Dwa lata doświadczenia zawodowego to wymóg na to stanowisko.
  en.a2.unit30.lesson02.teach.two_years_experience:
    title: Die eigene Erfahrung beschreiben
    gloss: Mam dwa lata doświadczenia w marketingu w mediach społecznościowych.
    note: Tym zdaniem opisujesz na rozmowie kwalifikacyjnej swoje doświadczenie zawodowe.
  en.a2.unit30.lesson02.teach.one_strength_organized:
    title: Eine Stärke nennen
    gloss: Jedną z moich mocnych stron jest dobra organizacja pracy.
    note: '*One of my strengths is...* to typowy sposób, żeby na rozmowie kwalifikacyjnej wskazać swoją mocną stronę.'
  en.a2.unit30.lesson02.teach.available_next_monday:
    title: Die eigene Verfügbarkeit nennen
    gloss: Mogę zacząć w najbliższy poniedziałek.
    note: Wyrażeniem *I'm available to start...* mówisz, od kiedy możesz zacząć pracę.
  en.a2.unit30.lesson03.teach.resume:
    title: resume
    gloss: CV
    note: '*resume* znaczy CV, czyli życiorys zawodowy. To słowo jest używane głównie w amerykańskim angielskim.'
    example_gloss: Proszę przynieść CV na rozmowę.
  en.a2.unit30.lesson03.teach.deadline:
    title: deadline
    gloss: termin
    note: '*deadline* oznacza termin, do którego coś musi być gotowe. W polskich firmach często mówi się też po prostu „deadline”.'
    example_gloss: W pracy zawsze dotrzymuję terminów.
  en.a2.unit30.lesson03.teach.posting_text:
    title: Text der Stellenanzeige
    gloss: 'Bright Path Marketing poszukuje koordynatora lub koordynatorki marketingu. Wymagania: dwa lata doświadczenia zawodowego, dobre umiejętności pisania i gotowość do natychmiastowego rozpoczęcia pracy. Prosimy o przyniesienie CV na rozmowę.'
    note: Formalne ogłoszenie o pracę z wymaganiami i poleceniem.
  en.a2.unit30.lesson03.teach.i_meet_deadlines:
    title: Über die eigene Arbeitsweise sprechen
    gloss: Dotrzymuję terminów i dobrze pracuję w zespole.
    note: '*I meet deadlines* i *I work well in a team* to przydatne zdania do opisania swojego stylu pracy.'
  en.a2.unit30.lesson04.teach.q_tell_me_experience:
    title: Die Interviewerin fragt nach der Erfahrung
    gloss: 'Rekruterka mówi: Dziękuję, że przyszła Pani dzisiaj na spotkanie. Czy może mi Pani opowiedzieć o swoim doświadczeniu?'
    note: '*Thank you for coming in today* to uprzejme rozpoczęcie rozmowy kwalifikacyjnej.'
  en.a2.unit30.lesson04.teach.a_two_years_managed_team:
    title: Mias Antwort zur Erfahrung
    gloss: 'Mia mówi: Mam dwa lata doświadczenia w marketingu w mediach społecznościowych. Kierowałam też małym zespołem.'
    note: 'To samo zdanie o doświadczeniu co w lekcji 2, z dodatkowym szczegółem: Mia kierowała zespołem.'
  en.a2.unit30.lesson04.teach.q_what_strength:
    title: Nach einer Stärke fragen
    gloss: 'Rekruterka mówi: To świetnie. Jaka jest jedna z Pani mocnych stron?'
    note: Rekruterka reaguje pozytywnie, a potem zadaje kolejne pytanie.
  en.a2.unit30.lesson04.teach.a_organized_deadlines:
    title: Mias Antwort zu ihrer Stärke
    gloss: 'Mia mówi: Jestem bardzo dobrze zorganizowana i dotrzymuję terminów.'
    note: Mia wskazuje swoją mocną stronę (dobra organizacja) i podaje konkretny przykład (dotrzymywanie terminów).
  en.a2.unit30.lesson04.teach.q_have_questions:
    title: Fragen, ob es noch Fragen gibt
    gloss: 'Rekruterka pyta: Czy ma Pani jeszcze jakieś pytania dotyczące stanowiska?'
    note: Stałe pytanie na końcu rozmowy kwalifikacyjnej.
  en.a2.unit30.lesson04.teach.a_wondering_typical_week:
    title: Mia stellt eine eigene Frage
    gloss: 'Mia mówi: Tak, chciałabym zapytać, jak wygląda typowy tydzień na tym stanowisku.'
    note: '*I was wondering...* to uprzejmy sposób, żeby samemu zadać pytanie.'
