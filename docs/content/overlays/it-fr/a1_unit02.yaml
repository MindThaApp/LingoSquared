    title: Contare gli ingredienti con Inès e Mathieu
teaching:
  fr.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: zero
    note: '*Zéro* si usa sia come numero a sé sia come cifra quando si legge ad alta voce una sequenza di numeri.'
  fr.a1.unit02.lesson01.teach.un:
    title: Uno
    gloss: uno
    note: '*Un* è maschile; il femminile *une* compare davanti a un nome femminile (*une tasse*, una tazza). Da solo, per esempio quando si conta, resta *un*.'
  fr.a1.unit02.lesson01.teach.deux:
    title: Due
    gloss: due
    note: '*Deux* non cambia mai forma, qualunque sia il genere del nome.'
  fr.a1.unit02.lesson01.teach.trois:
    title: Tre
    gloss: tre
    note: '*Trois* è invariabile.'
  fr.a1.unit02.lesson01.teach.quatre:
    title: Quattro
    gloss: quattro
    note: '*Quatre* è invariabile.'
  fr.a1.unit02.lesson01.teach.cinq:
    title: Cinque
    gloss: cinque
    note: '*Cinq* è invariabile. La q finale di solito si pronuncia, a differenza delle consonanti finali mute di diversi altri numeri francesi.'
  fr.a1.unit02.lesson01.teach.six:
    title: Six
    gloss: sei
    note: '*Six* si pronuncia con una /s/ finale quando è detto da solo, ma la consonante finale cade davanti a un nome che inizia per consonante (*six livres* suona come «si livres»).'
  fr.a1.unit02.lesson01.teach.sept:
    title: Sette
    gloss: sette
    note: '*Sept* è invariabile; la p è muta, si pronuncia solo la t finale.'
  fr.a1.unit02.lesson01.teach.huit:
    title: Otto
    gloss: otto
    note: '*Huit* è invariabile. La h è muta, come in quasi tutte le parole francesi.'
  fr.a1.unit02.lesson01.teach.neuf:
    title: Nove
    gloss: nove
    note: '*Neuf* è invariabile.'
  fr.a1.unit02.lesson01.teach.dix:
    title: Dieci
    gloss: dieci
    note: '*Dix* si pronuncia con una /s/ finale quando è detto da solo, e segue lo stesso schema di *six*: la consonante finale cade davanti a una consonante.'
  fr.a1.unit02.lesson02.teach.onze:
    title: Undici
    gloss: undici
    note: Da *onze* a *seize* (11-16) ogni numero è una parola a sé e non è costruito su *dix*, a differenza dei numeri dal ventuno in poi, che riprendono *vingt*.
  fr.a1.unit02.lesson02.teach.douze:
    title: Dodici
    gloss: dodici
    note: '*Douze* è una parola unica. All’inizio ricorda *deux*, ma non vi si riconosce *dix*.'
  fr.a1.unit02.lesson02.teach.treize:
    title: Tredici
    gloss: tredici
    note: '*Treize* è una parola unica. Richiama *trois* all''inizio, ma non contiene nessun *dix* visibile.'
  fr.a1.unit02.lesson02.teach.quatorze:
    title: Quattordici
    gloss: quattordici
    note: '*Quatorze* è una parola unica. Richiama *quatre* all''inizio, ma non contiene nessun *dix* visibile.'
  fr.a1.unit02.lesson02.teach.quinze:
    title: Quindici
    gloss: quindici
    note: '*Quinze* è una parola unica. È lontanamente imparentata con *cinq*, ma non contiene nessun *dix* visibile.'
  fr.a1.unit02.lesson02.teach.seize:
    title: Sedici
    gloss: sedici
    note: '*Seize* è l''ultima delle parole «fuse» in -ze; da *dix-sept* (17) in poi, *dix* si unisce di nuovo in modo visibile all''unità.'
  fr.a1.unit02.lesson02.teach.vingt:
    title: Venti
    gloss: venti
    note: '*Vingt* è una parola a sé. Da ventuno in poi, decine e unità si combinano (*vingt et un*, *vingt-deux*) secondo uno schema che il corso riprende più avanti.'
  fr.a1.unit02.lesson02.teach.trente:
    title: Trenta
    gloss: trenta
    note: '*Trente* si unisce all''unità seguente con un trattino (*trente-quatre*), tranne che con uno, che prende *et* (*trente et un*).'
  fr.a1.unit02.lesson02.teach.trente_quatre:
    title: Trentaquattro
    gloss: trentaquattro
    note: '*Trente-quatre* si scrive con il trattino, mentre in italiano «trentaquattro» si scrive in una sola parola.'
  fr.a1.unit02.lesson02.teach.soixante:
    title: Sessanta
    gloss: sessanta
    note: '*Soixante* si comporta come una normale decina (*soixante-quatre*, 64) fino a sessantanove: la parte irregolare comincia da settanta, che vedremo subito dopo.'
  fr.a1.unit02.lesson02.teach.soixante_dix:
    title: Settanta
    gloss: settanta
    note: 'È la sorpresa più grande dei numeri francesi: non esiste una parola specifica per settanta. *Soixante-dix* significa letteralmente «sessanta-dieci» (60 + 10). Si continua a contare così fino a *soixante-dix-neuf* (79, «sessanta-diciannove»); poi *quatre-vingts* inizia una nuova base con ottanta.'
  fr.a1.unit02.lesson02.teach.quatre_vingts:
    title: Ottanta
    gloss: ottanta
    note: '*Quatre-vingts* significa letteralmente «quattro venti» (4 x 20), resto di un antico sistema di numerazione in base 20. Prende la s finale solo quando è da solo o chiude il numero (*quatre-vingts*, 80); la s cade quando segue un''unità (*quatre-vingt-un*, 81).'
  fr.a1.unit02.lesson02.teach.quatre_vingt_dix:
    title: Novanta
    gloss: novanta
    note: '*Quatre-vingt-dix* significa letteralmente «quattro venti più dieci» (4x20 + 10), con lo stesso schema in base 20 di settanta, fino a *quatre-vingt-dix-neuf* (99).'
  fr.a1.unit02.lesson02.teach.cent:
    title: Cento
    gloss: cento
    note: '*Cent* è la forma usata per 100 esatto, da solo e senza articolo (non «*un cent*»).'
  fr.a1.unit02.lesson03.teach.quel_age_as_tu:
    title: Chiedere l'età (informale)
    gloss: Quanti anni hai?
    note: Come in italiano, il francese chiede letteralmente che età hai usando *avoir* (avere) e non *être* («essere»).
  fr.a1.unit02.lesson03.teach.jai_vingt_huit_ans:
    title: Dire la propria età
    gloss: Ho ventotto anni.
    note: '*Ai* è la forma di *avoir* per je. Per dire l''età in francese bisogna sempre aggiungere *ans* (anni).'
  fr.a1.unit02.lesson03.teach.quel_age_avez_vous:
    title: Chiedere l'età (formale)
    gloss: Quanti anni hai?
    note: '*Avez-vous* è la forma di *avoir* con *vous*, in linea con il registro formale introdotto nell''Unità 1.'
  fr.a1.unit02.lesson03.teach.jai_trente_et_un_ans:
    title: Dire un'età con un numero composto
    gloss: Ho trentun anni.
    note: '*Trente et un* usa *et* (e), non il trattino, solo per le forme con «uno» di trenta, quaranta, cinquanta e sessanta (*trente et un*, *quarante et un*, *cinquante et un*, *soixante et un*). Settantuno rompe questo schema: è *soixante et onze* (sessanta + undici), non *soixante et un*, perché i numeri in 70 continuano con le forme di *dix* fino a *soixante-dix-neuf* (79).'
  fr.a1.unit02.lesson03.teach.et_toi_quel_age:
    title: Restituire la domanda sull'età
    gloss: E tu, quanti anni hai?
    note: '*Et toi* introduce la domanda di rimando; *toi* (e non *tu*) è il pronome tonico usato dopo *et* per enfasi.'
  fr.a1.unit02.lesson04.teach.quel_est_ton_numero:
    title: Chiedere il numero di telefono
    gloss: Qual è il tuo numero di telefono?
    note: '*Quel* si accorda con il sostantivo maschile *numéro*; con un sostantivo femminile ci vorrebbe *quelle*.'
  fr.a1.unit02.lesson04.teach.numero_ines:
    title: Un numero letto cifra per cifra
    gloss: Zero, sei, uno, cinque, zero, due, nove, sette, quattro, tre
    note: I veri numeri di telefono francesi hanno dieci cifre e di solito si leggono a coppie (*zéro six*, *quinze*, *zéro deux*...). I numeri di questa unità hanno il vero formato a dieci cifre (06 15 02 97 43), ma si leggono cifra per cifra, così puoi esercitarti prima con le cifre singole.
  fr.a1.unit02.lesson04.teach.cest_le:
    title: Introdurre il numero
    gloss: È il...
    note: '*Le* (articolo maschile «il») si usa perché *numéro* è un sostantivo maschile.'
  fr.a1.unit02.lesson04.teach.tu_peux_repeter:
    title: Chiedere di ripetere
    gloss: Puoi ripetere, per favore?
    note: '*Peux* è la forma di *pouvoir* (potere) con *tu*, utile ogni volta che un numero detto a voce passa troppo in fretta per essere afferrato.'
  fr.a1.unit02.lesson04.teach.bien_sur:
    title: Accettare volentieri
    gloss: Certo; ma sì
    note: '*Bien sûr* è un modo comune e cordiale per accettare una richiesta.'
  fr.a1.unit02.lesson05.teach.jai_besoin_trois_oeufs:
    title: Dire una quantità necessaria
    gloss: Mi servono tre uova.
    note: '*J''ai besoin de* (letteralmente «ho bisogno di») è il modo francese di dire che ti serve qualcosa: come in italiano si usa *avoir* più un nome, non un verbo specifico.'
  fr.a1.unit02.lesson05.teach.combien_oeufs:
    title: Chiedere quante ne servono
    gloss: Quante uova ti servono?
    note: '*De combien d''œufs* mette *de combien* («di quanti») prima dell''elemento, con lo stesso ordine dell''italiano «di quante uova».'
  fr.a1.unit02.lesson05.teach.deux_tasses_farine:
    title: Dire una quantità misurata
    gloss: Due tazze di farina
    note: '*De* collega l''unità di misura (*tasses*, tazze) a ciò che si misura (*farine*, farina), proprio come «di» in italiano.'
  fr.a1.unit02.lesson05.teach.demi_tasse:
    title: Dire una mezza quantità
    gloss: Mezza tazza di zucchero
    note: '*Demi-* resta invariabile come prefisso davanti al nome (*une demi-tasse*), a differenza dell''aggettivo *demi* messo dopo il nome, che si accorda (*une heure et demie*).'
  fr.a1.unit02.lesson05.teach.jai_quatre_oeufs:
    title: Dire cosa si ha a disposizione
    gloss: Ho quattro uova sul tavolo.
    note: '*J''ai* (ho) indica ciò che hai già a disposizione, ed è diverso da *j''ai besoin de* (ho bisogno di), che indica ciò che ancora manca.'
  fr.a1.unit02.lesson06.teach.line01:
    title: Chiedere quante uova
    gloss: Inès chiede a Mathieu di quante uova ha bisogno per la ricetta.
    note: 'Inès e Mathieu ora si danno del *tu* invece del *vous* dell''Unità 1: essendo compagni di laboratorio, sono passati subito al registro informale.'
  fr.a1.unit02.lesson06.teach.line02:
    title: Dire gli ingredienti
    gloss: Mathieu dice che ha bisogno di tre uova e due tazze di farina.
    note: '*J''ai besoin de* indica ciò che serve ancora per la ricetta.'
  fr.a1.unit02.lesson06.teach.line03:
    title: Offrire ciò che si ha
    gloss: Inès dice che ha quattro uova sul tavolo e chiede se gli serve anche lo zucchero.
    note: '*J''ai* indica ciò che Inès ha già a disposizione, cosa diversa da ciò che Mathieu ha detto di aver bisogno.'
  fr.a1.unit02.lesson06.teach.line04:
    title: Confermare una piccola quantità
    gloss: 'Mathieu dice di sì, un po'': circa mezza tazza.'
    note: Qui *environ* significa «circa» o «più o meno» e attenua la quantità esatta.
  fr.a1.unit02.lesson06.teach.line05:
    title: Chiedere il numero di telefono
    gloss: Inès dice che va benissimo, poi chiede il numero di telefono di Mathieu per scrivergli riguardo al prossimo corso.
    note: '*Comme ça je t''écris* («così ti scrivo») spiega perché lo chiede: è un''abitudine naturale nella conversazione prima di chiedere un contatto.'
  fr.a1.unit02.lesson06.teach.line06:
    title: Dare il numero di telefono
    gloss: Mathieu dice il suo numero cifra per cifra.
    note: '*C''est le* introduce il numero, in accordo con il sostantivo maschile *numéro*.'
  fr.a1.unit02.lesson06.teach.line07:
    title: Ringraziare e chiedere l'età
    gloss: 'Inès lo ringrazia, poi fa un''ultima domanda: quanti anni ha.'
    note: '*Une dernière question* («un''ultima domanda») segnala un naturale cambio di argomento all''interno della stessa conversazione.'
  fr.a1.unit02.lesson06.teach.line08:
    title: Dire la sua età
    gloss: Mathieu dice di avere ventotto anni e fa la stessa domanda a Inès.
    note: '*J''ai vingt-huit ans* usa la forma composta con il trattino, come abbiamo visto per i numeri di questa unità.'
  fr.a1.unit02.lesson06.teach.line09:
    title: Dire la sua età
    gloss: Inès dice di avere trentuno anni.
    note: '*J''ai trente et un ans* usa *et* (e) e non il trattino, perché trentuno è una delle forme con «uno» viste in precedenza.'
