answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francese A1
  description: 'Descrivere una semplice routine quotidiana con i verbi riflessivi (se réveiller, se lever, se coucher) e le parole per sequenziare (d''abord, ensuite), continuando il racconto del laboratorio di cucina di Inès e Mathieu: Inès chiede a Mathieu del suo sabato. In francese i verbi riflessivi richiedono sempre un pronome riflessivo (je ME réveille), come in italiano (mi sveglio), ma attenzione: alcuni verbi sono riflessivi in francese e non in italiano, o viceversa.'
units:
  fr.a1.unit10.routines:
    title: La routine del sabato
