teaching:
  fr.a1.unit10.lesson01.teach.se_reveiller:
    title: Svegliarsi
    gloss: svegliarsi
    note: 'Verbo riflessivo: *je me réveille*, *tu te réveilles*. Il pronome *me/te/se* concorda sempre con il soggetto.'
    example_gloss: Mi sveglio alle sette.
  fr.a1.unit10.lesson01.teach.se_lever:
    title: Alzarsi
    gloss: alzarsi
    note: 'Diverso da *se réveiller* (svegliarsi): *se lever* indica l''atto fisico di alzarsi dal letto.'
    example_gloss: Mi alzo subito dopo.
  fr.a1.unit10.lesson01.teach.prendre_une_douche:
    title: Fare la doccia
    gloss: fare la doccia
    note: '*Prendre une douche* (letteralmente «prendere una doccia») usa *prendre*, lo stesso verbo dei pasti e dei mezzi di trasporto.'
    example_gloss: Faccio la doccia la mattina.
  fr.a1.unit10.lesson01.teach.shabiller:
    title: Vestirsi
    gloss: vestirsi
    note: 'Un altro verbo riflessivo: *je m''habille*, con *m''* elisione davanti a vocale.'
    example_gloss: Mi vesto prima della colazione.
  fr.a1.unit10.lesson01.teach.le_petit_dejeuner:
    title: La colazione
    gloss: colazione
    note: '*Prendre le petit-déjeuner* (fare colazione) riprende lo stesso schema di *prendre* usato in *prendre une douche*.'
    example_gloss: Faccio colazione alle otto.
  fr.a1.unit10.lesson01.teach.quitter_la_maison:
    title: Uscire di casa
    gloss: uscire di casa
    note: 'Qui *quitter* significa «lasciare (un luogo)»: non confonderlo con *partir*, che non vuole il complemento oggetto.'
    example_gloss: Esco di casa alle nove.
  fr.a1.unit10.lesson01.teach.dabord_ensuite:
    title: Prima... poi...
    gloss: Prima mi alzo, poi mi vesto.
    note: '*D''abord* (prima) ed *ensuite* (poi) sono le parole di base per descrivere una routine passo dopo passo.'
  fr.a1.unit10.lesson02.teach.rentrer:
    title: Rientrare a casa
    gloss: rientrare a casa
    note: '*Rentrer* implica tornare a casa propria, a differenza del più generico *retourner* (tornare in un luogo).'
    example_gloss: Rientro a casa dopo il lavoro.
  fr.a1.unit10.lesson02.teach.diner:
    title: Cenare
    gloss: cenare
    note: '*Dîner* può essere un verbo (cenare) o un nome (*le dîner*, la cena): il contesto li distingue.'
    example_gloss: Il sabato sera ceniamo insieme.
  fr.a1.unit10.lesson02.teach.se_coucher:
    title: Andare a letto
    gloss: andare a letto
    note: La conclusione naturale della sequenza della routine quotidiana, in coppia con *se lever* all'inizio.
    example_gloss: Vado a letto verso le undici.
  fr.a1.unit10.lesson02.teach.le_weekend:
    title: Il fine settimana
    gloss: il fine settimana
    note: '*Le week-end* è un prestito dall''inglese, usato spesso anche in italiano, ma in francese si scrive con il trattino.'
    example_gloss: Il laboratorio si tiene nel fine settimana.
  fr.a1.unit10.lesson02.teach.dhabitude:
    title: Di solito
    gloss: di solito
    note: '*D''habitude* introduce un''abitudine, a differenza di *aujourd''hui* (oggi), che indica un evento isolato.'
    example_gloss: Di solito mi alzo alle sette.
  fr.a1.unit10.lesson02.teach.ma_routine_du_samedi:
    title: Descrivere un sabato
    gloss: Il sabato mi alzo tardi, poi vado al mercato prima del laboratorio.
    note: Unisce una sequenza simile a *d'abord/ensuite* (qui con *puis*, «poi») per descrivere un sabato.
  fr.a1.unit10.lesson02.teach.quest_ce_que_tu_fais:
    title: Che cosa fai?
    gloss: Che cosa fai il sabato?
    note: '*Qu''est-ce que tu fais... ?* è il modo informale standard per chiedere a qualcuno che cosa fa.'
  fr.a1.unit10.lesson03.teach.line01:
    title: Chiedere del sabato
    gloss: Inès chiede a Mathieu che cosa fa il sabato prima del laboratorio.
    note: '*Tu fais quoi... ?* è il modo informale e naturale per chiedere «che fai...?», più colloquiale di *Qu''est-ce que tu fais ?*'
  fr.a1.unit10.lesson03.teach.line02:
    title: Descrivere il risveglio
    gloss: Mathieu dice che prima si sveglia tardi, verso le nove.
    note: '*Vers neuf heures* (verso le nove) riprende lo schema *vers* + ora per indicare un orario approssimativo.'
  fr.a1.unit10.lesson03.teach.line03:
    title: Chiedere che cosa succede dopo
    gloss: Inès chiede che cosa succede dopo.
    note: Una breve domanda naturale per far proseguire la descrizione di una routine.
  fr.a1.unit10.lesson03.teach.line04:
    title: Descrivere colazione e mercato
    gloss: Mathieu dice che poi fa colazione e va al mercato.
    note: Due azioni collegate con *et*, che continuano la sequenza iniziata con *d'abord*.
  fr.a1.unit10.lesson03.teach.line05:
    title: Chiedere del rientro
    gloss: Inès chiede a che ora Mathieu rientra.
    note: '*Tu rentres à quelle heure ?* riprende *rentrer* di questa unità in una domanda diretta.'
  fr.a1.unit10.lesson03.teach.line06:
    title: Descrivere il pomeriggio
    gloss: Mathieu dice che rientra verso mezzogiorno e che nel pomeriggio si riposa prima del laboratorio serale.
    note: '*Se reposer* (riposarsi) è un altro verbo riflessivo: *je me repose*.'
