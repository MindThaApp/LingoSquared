teaching:
  fr.a1.unit50.lesson01.teach.appeler:
    title: Chiamare
    gloss: chiamare
    note: L'infinito del verbo per fare una telefonata.
    example_gloss: Devo chiamarti.
  fr.a1.unit50.lesson01.teach.je_t_appelle:
    title: Dire che chiamerai
    gloss: Ti chiamo io.
    note: '*Appelle* è la forma di *je* di *appeler*; qui il francese usa il presente dove in italiano si usa spesso il futuro («chiamerò») o il presente.'
  fr.a1.unit50.lesson01.teach.allo_c_est:
    title: Rispondere al telefono
    gloss: Pronto, sono Camille.
    note: '*C''est* + nome è il modo standard in francese per presentarsi al telefono; in italiano si dice «sono» + nome.'
  fr.a1.unit50.lesson01.teach.allo_c_est_2:
    title: Mathieu risponde allo stesso modo
    gloss: Pronto, sono Mathieu.
    note: Stesso schema *c'est* + nome di *Allô, c'est Camille*.
  fr.a1.unit50.lesson02.teach.qui_est_a:
    title: Chiedere chi sta chiamando
    gloss: Con chi parlo?
    note: '*Qui est à l''appareil ?* è il modo standard per chiedere a chi chiama, e non si conosce, chi sia.'
  fr.a1.unit50.lesson02.teach.vous_parlez_avec:
    title: Presentarsi in modo formale
    gloss: Sta parlando con Camille.
    note: '*Vous parlez avec* + nome è la controparte formale di *c''est* + nome.'
  fr.a1.unit50.lesson03.teach.tu_peux_repeter:
    title: Chiedere di ripetere
    gloss: Puoi ripetere?
    note: '*Tu peux ...* (Puoi ...?) più l''infinito *répéter* (ripetere).'
  fr.a1.unit50.lesson03.teach.ne_parle_pas:
    title: Chiedere a qualcuno di rallentare
    gloss: Non parlare così in fretta, per favore.
    note: '*Ne parle pas si vite* è la forma negativa del verbo: *ne ... pas* racchiude *parle*, e *si* significa «così».'
  fr.a1.unit50.lesson03.teach.je_ne_t:
    title: Dire che non senti bene
    gloss: Non ti sento bene.
    note: '*Entendre* (sentire con le orecchie) con *ne ... pas bien* indica un problema di udito, diverso da *comprendre* (capire).'
  fr.a1.unit50.lesson04.teach.le_sms:
    title: Messaggio
    gloss: il messaggio
    note: '*SMS* è maschile: *un SMS*, come in italiano «un SMS».'
    example_gloss: Il messaggio è di Camille.
  fr.a1.unit50.lesson04.teach.je_t_envoie:
    title: Dire che manderai un messaggio
    gloss: Ti mando un messaggio.
    note: '*Envoyer* (inviare) vuole il pronome *te* (qui *t''*) prima del verbo, poi *un SMS*.'
  fr.a1.unit50.lesson04.teach.je_te_rappelle:
    title: Dire che richiamerai
    gloss: Ti chiamo più tardi.
    note: '*Rappeler* (richiamare) contiene già l''idea di «di nuovo» nel prefisso *re-*; *plus tard* significa «più tardi».'
  fr.a1.unit50.lesson05.teach.mathieu_salut_camille:
    title: Leggi uno scambio di messaggi
    gloss: 'Mathieu: Ciao Camille, puoi chiamarmi? Devo dirti una cosa. Camille: Sì, certo, ti richiamo tra cinque minuti.'
    note: Segui cosa chiede Mathieu, perché, e quando Camille dice che richiamerà.
    glosses:
      Salut: ciao
      peux: puoi
      m'appeler: chiamare
      dois: devo
      truc: qualcosa
      dire: raccontare
      évidemment: certo
      rappelle: restituire
      cinq: cinque
      minutes: minuti
  fr.a1.unit50.lesson06.teach.mathieu_allo_c:
    title: Mathieu risponde alla chiamata
    gloss: 'Mathieu: Pronto, sono Mathieu.'
    note: 'Lo stesso schema *c''est* + nome della lezione 1, ora usato in una vera telefonata: chi risponde parla per primo e dice il proprio nome.'
  fr.a1.unit50.lesson06.teach.camille_salut_mathieu:
    title: Camille si presenta
    gloss: 'Camille: Ciao Mathieu, sono Camille. Mathieu: Che bello che mi chiami!'
    note: '*C''est sympa que* ... (che bello che ...) esprime una reazione positiva a un fatto; *appelles* è una forma particolare che qui puoi semplicemente memorizzare.'
  fr.a1.unit50.lesson06.teach.camille_comment_s:
    title: Camille chiede del turno
    gloss: 'Camille: Com''è andato il tuo primo turno?'
    note: '*Comment s''est passé ... ?* usa il passé composé di *se passer* (succedere, andare), formato con *être*, per chiedere come è andato qualcosa.'
  fr.a1.unit50.lesson06.teach.mathieu_ca_s:
    title: Mathieu dà una buona notizia
    gloss: 'Mathieu: È andato molto bene, meglio di quanto pensassi.'
    note: '*Ça s''est très bien passé* e *je pensais* sono espressioni fisse in questo caso; *je pensais* è l''imperfetto di *penser* (pensare).'
  fr.a1.unit50.lesson06.teach.au_passe_compose:
    title: Passé composé con avoir e être
    gloss: s'est passé → andare, succedere; j'ai pensé → pensare; je suis allé → andare
    note: 'Il passé composé si forma con *avoir* o *être* + un participio: *j''ai pensé*, *je suis allé*. *Ça s''est passé* è un''espressione fissa per «è andato»; per ora memorizzala nei contesti in cui compare in questa lezione.'
  fr.a1.unit50.lesson06.teach.camille_ca_fait:
    title: Camille è orgogliosa
    gloss: 'Camille: Che piacere sentirlo! Sono fiera di te.'
    note: '*Fière de* (fiera di) è una combinazione fissa; ci vuole *de*, non *pour*; *fière* qui è femminile.'
  fr.a1.unit50.lesson06.teach.mathieu_merci_beaucoup:
    title: Mathieu è commosso
    gloss: 'Mathieu: Grazie mille, per me conta molto.'
    note: 'Qui *compter* significa «contare, essere importante»: *ça compte pour moi* (per me conta); *pour moi* dice per chi conta.'
  fr.a1.unit50.lesson06.teach.son_premier_service:
    title: Il suo
    gloss: Il suo primo turno è andato molto bene.
    note: 'Qui *son* è l''aggettivo possessivo «suo», non un verbo: *son premier service* (il suo primo turno); *son* concorda con *service*, maschile.'
