  fr.a1.unit52.lesson06.planifier_un_week_end:
    title: Programmare un fine settimana insieme
teaching:
  fr.a1.unit52.lesson01.teach.lire_faire_du:
    title: Leggere, fare sport, cucinare
    gloss: leggere, fare sport, cucinare
    note: 'Tre verbi comuni per gli hobby: *lire* (leggere), *faire du sport* (fare sport) e *cuisiner* (cucinare).'
    example_gloss:
    - Mi piace leggere un libro.
    - Faccio sport il sabato.
    - Mi piace cucinare per gli amici.
  fr.a1.unit52.lesson01.teach.le_temps_libre:
    title: Tempo libero
    gloss: tempo libero
    note: '*Temps libre* è maschile: *le temps libre*. È l''espressione chiave per parlare degli hobby.'
    example_gloss: Nel mio tempo libero mi piace leggere.
  fr.a1.unit52.lesson01.teach.pendant_mon_temps:
    title: Dire che cosa fai nel tempo libero
    gloss: Nel mio tempo libero mi piace leggere.
    note: '*Lis* è la forma *je* di *lire* (leggere); la *s* finale non si pronuncia.'
  fr.a1.unit52.lesson02.teach.ecouter_de_la:
    title: Musica, disegno, videogiochi
    gloss: ascoltare musica, disegnare, giocare ai videogiochi
    note: 'Altri tre hobby: *écouter de la musique*, *dessiner* e *jouer aux jeux vidéo*. Con i giochi, *jouer à* + *les* diventa *jouer aux*.'
    example_gloss:
    - Mi piace ascoltare musica.
    - Disegno spesso.
    - Mi piace giocare ai videogiochi con gli amici.
  fr.a1.unit52.lesson02.teach.j_aime_ecouter:
    title: Dire che ti piace ascoltare musica
    gloss: Mi piace ascoltare musica.
    note: '*Écouter* vuole il complemento diretto, senza preposizione: *écouter de la musique*.'
  fr.a1.unit52.lesson02.teach.j_aime_jouer:
    title: Dire che ti piace giocare ai videogiochi con gli amici
    gloss: Mi piace giocare ai videogiochi con gli amici.
    note: '*Avec des amis* (con degli amici) riprende *amis* dalla lezione 1; *des* è il plurale indefinito.'
  fr.a1.unit52.lesson03.teach.toujours_souvent_parfois:
    title: Sempre, spesso, a volte, mai
    gloss: sempre, spesso, a volte, mai
    note: I quattro avverbi di frequenza principali. *Souvent* potrebbe già essere noto; *toujours*, *parfois* e *jamais* sono nuovi. *Jamais* richiede *ne* davanti al verbo.
    example_gloss:
    - Faccio sempre sport il sabato.
    - Leggo spesso un libro.
    - A volte disegno.
    - Non gioco mai ai videogiochi.
  fr.a1.unit52.lesson03.teach.chaque_semaine_chaque:
    title: Ogni settimana, ogni fine settimana
    gloss: ogni settimana, ogni fine settimana
    note: '*Chaque semaine* e *chaque week-end* significano entrambi «ogni». *Chaque* non cambia mai, qualunque sia il genere del nome.'
    example_gloss:
    - Cucino per gli amici ogni settimana.
    - Faccio sport ogni fine settimana.
  fr.a1.unit52.lesson03.teach.chaque_ne_change:
    title: Chaque non cambia mai
    gloss: '*Chaque* resta invariato davanti a nomi maschili e femminili: *chaque semaine*, *chaque week-end*.'
    note: '*Semaine* è femminile e *week-end* è maschile, eppure *chaque* è identico per entrambi. Confronta con *tous les* / *toutes les*, che invece cambia.'
  fr.a1.unit52.lesson03.teach.qu_est_ce:
    title: Chiedere del tempo libero
    gloss: Che cosa fai nel tempo libero?
    note: 'Questa è la domanda chiave dell''unità: usala per chiedere a chiunque dei suoi hobby.'
  fr.a1.unit52.lesson04.teach.camille_on_se:
    title: Camille introduce il discorso sugli hobby
    gloss: 'Camille: Facciamo spesso passeggiate insieme. Ma tu che altro fai nel tempo libero, Mathieu?'
    note: '*On se promène souvent* usa *on* per «noi», e *souvent* sta subito dopo il verbo.'
  fr.a1.unit52.lesson04.teach.mathieu_j_aime:
    title: Gli hobby di Mathieu
    gloss: 'Mathieu: Mi piace cucinare, anche a casa. E faccio spesso sport.'
    note: '*Même à la maison* (anche a casa) chiarisce che Mathieu cucina per piacere, non solo per lavoro.'
  fr.a1.unit52.lesson04.teach.camille_tu_cuisines:
    title: Camille è sorpresa
    gloss: 'Camille: Cucini anche a casa? Cucini già tutto il giorno al lavoro!'
    note: '*Toute la journée* (tutto il giorno) sottolinea quanto Mathieu cucini già al lavoro.'
  fr.a1.unit52.lesson04.teach.mathieu_oui_mais:
    title: Mathieu spiega
    gloss: 'Mathieu: Sì, ma cucinare per me è rilassante. E tu, che cosa ti piace fare?'
    note: '*Cuisiner, je trouve ça relaxant* mette *cuisiner* all''inizio per enfasi: letteralmente «cucinare, lo trovo rilassante».'
  fr.a1.unit52.lesson04.teach.camille_j_aime:
    title: Gli hobby di Camille
    gloss: 'Camille: Mi piace leggere e ascolto spesso musica.'
    note: Unisce in una frase due hobby delle lezioni 1 e 2 con *et* (e).
  fr.a1.unit52.lesson04.teach.mathieu_tu_joues:
    title: Mathieu chiede dei videogiochi
    gloss: 'Mathieu: Giochi anche tu ai videogiochi?'
    note: 'Una breve domanda sì/no: *Tu joues aussi aux jeux vidéo ?* L''intonazione ascendente la rende una domanda.'
  fr.a1.unit52.lesson04.teach.camille_non_je:
    title: Camille risponde
    gloss: 'Camille: No, non gioco mai ai videogiochi. Ma a volte disegno!'
    note: '*Jamais* (mai) e *parfois* (a volte) della lezione 3, messi a confronto in un''unica risposta.'
  fr.a1.unit52.lesson05.teach.mathieu_et_moi:
    title: Confronto tra hobby
    gloss: Mathieu e io facciamo spesso passeggiate insieme. Ma abbiamo anche altri hobby. A Mathieu piace cucinare, anche a casa, e fa spesso sport. A me piace leggere e ascolto spesso musica. A volte disegno, ma non gioco mai ai videogiochi. Che cosa ti piace fare nel tempo libero?
    note: Il messaggio di Camille riassume ciò che è stato detto nella lezione 4 e finisce con la domanda centrale dell'unità.
    glosses:
      promène: passeggiamo
      souvent: spesso
      ensemble: insieme
      d'autres: altri
      cuisiner: cucina
      aime: piace
      maison: a casa
      sport: fa sport
      lire: leggere
      j'écoute: ascolto
      musique: musica
      dessine: disegno
      parfois: a volte
      jeux: gioco ai videogiochi
      jamais: mai
      libre: libero
      temps: tempo
  fr.a1.unit52.lesson06.teach.mathieu_qu_est:
    title: Mathieu chiede del weekend
    gloss: 'Mathieu: Che cosa fai questo weekend?'
    note: '*Ce week-end* (questo weekend) usa *ce* perché *week-end* è maschile.'
  fr.a1.unit52.lesson06.teach.camille_je_ne:
    title: Camille è indecisa
    gloss: 'Camille: Non so ancora. Mi piace leggere, ma voglio anche uscire.'
    note: '*Sortir* (uscire) è un modo comune per dire che hai voglia di uscire di casa.'
  fr.a1.unit52.lesson06.teach.mathieu_on_se:
    title: Mathieu propone un programma
    gloss: 'Mathieu: Facciamo una passeggiata insieme? Dopo cucino io per noi.'
    note: '*Après* (dopo) mette in sequenza due programmi, come *d''abord* e *ensuite*.'
  fr.a1.unit52.lesson06.teach.camille_bonne_idee:
    title: Camille accetta
    gloss: 'Camille: Buona idea! Mi piace tanto passeggiare quanto cucinare.'
    note: '*Autant ... que* (tanto ... quanto) mostra che a Camille piacciono due cose allo stesso modo, senza preferenze.'
  fr.a1.unit52.lesson06.teach.mathieu_parfait_alors:
    title: Mathieu conferma
    gloss: 'Mathieu: Perfetto. Allora ci vediamo sabato!'
    note: Una frase finale cordiale che conferma il programma per *samedi* (sabato).
