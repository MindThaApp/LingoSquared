    gloss: cercare (informazioni)
    example_gloss: Cerco le previsioni del tempo.
  fr.a1.unit57.lesson03.teach.chercher_est_un:
    title: Chercher è un verbo regolare in -er
    gloss: '*Chercher* è un verbo regolare in *-er*, come *utiliser*: *je cherche, tu cherches*; *j''utilise, tu utilises*.'
    note: 'Come i verbi della routine, *chercher* vuole il complemento oggetto subito dopo: *Je cherche la météo.*'
  fr.a1.unit57.lesson03.teach.thomas_cherche_la:
    title: Thomas cerca le previsioni del tempo
    gloss: Thomas cerca le previsioni del tempo.
  fr.a1.unit57.lesson03.teach.ensuite_il_va:
    title: Poi va a correre
    gloss: Poi va a correre.
    note: '*Il va courir* è *aller* + infinito, il futuro prossimo; *courir* l''hai già incontrato nell''unità sullo sport.'
  fr.a1.unit57.lesson04.teach.camille_on_fait:
    title: Camille propone
    gloss: 'Camille: Facciamo sport sabato alle dieci?'
  fr.a1.unit57.lesson04.teach.mathieu_bonne_idee:
    title: Mathieu accetta
    gloss: 'Mathieu: Bella idea! Cerco le previsioni del tempo.'
    note: Riprende *Bonne idée !*, già visto nelle unità sui progetti e sulle preferenze.
  fr.a1.unit57.lesson04.teach.mathieu_samedi_il:
    title: Mathieu controlla il meteo
    gloss: 'Mathieu: Sabato c''è il sole!'
    note: '*Il y a du soleil* descrive il tempo soleggiato, come nell''unità sul meteo.'
  fr.a1.unit57.lesson04.teach.thomas_je_vois:
    title: Thomas vede il messaggio
    gloss: 'Thomas: Vedo il messaggio. A sabato!'
  fr.a1.unit57.lesson04.teach.tu_connais_deja:
    title: Au revoir e À + un giorno
    gloss: 'Conosci già *Au revoir !* Puoi anche nominare un giorno: *À samedi !*, *À demain !*'
    note: Estende lo schema di saluto dell'unità sui saluti a un giorno preciso.
  fr.a1.unit57.lesson05.teach.camille_appelle_mathieu:
    title: Chi usa cosa?
    gloss: Camille chiama Mathieu tutti i giorni. Usa il telefono, non un'app. Mathieu non ha un computer a casa, ma usa internet sul telefono. Thomas cerca le previsioni del tempo ogni mattina. Poi va a correre. Léa manda spesso un messaggio a Camille. E tu, usi anche il telefono tutti i giorni?
    note: Confronta le abitudini dei quattro personaggi con i dispositivi, come la lettura di confronto dell'unità sullo sport.
