    title: La météo e il message
    gloss: Conosci già *la météo* (le previsioni del tempo). Un *message* si può mandare (*j'envoie*, *tu envoies*) o leggere (*je lis*, *tu lis*).
    note: Collega la parola nuova al sostantivo composto già visto nell'unità sul tempo atmosferico.
