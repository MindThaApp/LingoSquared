answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francese A1
  description: Il lessico del mercato, come chiedere prezzi e quantità con combien/kilo/litre e il contrasto tra du/de la e il semplice de dopo le espressioni di quantità, continuando la storia del laboratorio di cucina di Inès e Mathieu in una situazione di spesa al mercato. Una guida specifica sottolinea che il francese elimina del tutto l'articolo partitivo dopo una quantità esplicita (un kilo de tomates, non un kilo des tomates).
units:
  fr.a1.unit04.shopping:
    title: La spesa con Inès
lessons:
  fr.a1.unit04.lesson01.au_marche:
    title: Al mercato
  fr.a1.unit04.lesson02.combien_ca_coute:
    title: Quanto costa?
  fr.a1.unit04.lesson03.dialogue_marche:
    title: Al mercato con Inès e Mathieu
teaching:
  fr.a1.unit04.lesson01.teach.marche:
    title: Il mercato
    gloss: il mercato
    note: '*Marché* è maschile.'
    example_gloss: Il mercato è aperto il sabato.
  fr.a1.unit04.lesson01.teach.boulangerie:
    title: La panetteria
    gloss: la panetteria
    note: '*Boulangerie* è femminile; è il negozio specifico per il pane, diverso dalla *pâtisserie* (pasticceria).'
    example_gloss: C'è una buona panetteria qui vicino.
  fr.a1.unit04.lesson01.teach.legumes:
    title: Le verdure
    gloss: verdura
    note: '*Légumes* è maschile plurale.'
    example_gloss: Compro verdure fresche per il laboratorio.
  fr.a1.unit04.lesson01.teach.fruits:
    title: La frutta
    gloss: frutta
    note: '*Fruits* è maschile plurale. Il francese usa spesso il plurale (*les fruits*) dove l''italiano dice di solito «la frutta» al singolare.'
    example_gloss: Questo mese la frutta costa cara.
  fr.a1.unit04.lesson01.teach.prix:
    title: Il prezzo
    gloss: il prezzo
    note: '*Prix* è maschile e invariabile: si scrive allo stesso modo al singolare e al plurale.'
    example_gloss: Qual è il prezzo del pane?
  fr.a1.unit04.lesson01.teach.cher:
    title: Caro
    gloss: caro
    note: '*Cher* è la forma maschile; *chère* è il femminile, *chers*/*chères* i plurali, e concordano con il nome a cui si riferiscono.'
    example_gloss: Questo formaggio è troppo caro.
  fr.a1.unit04.lesson01.teach.pas_cher:
    title: Non caro oggi
    gloss: Oggi le verdure non costano care.
    note: '*Pas cher(s)* (senza *ne*) è il modo più comune, nel parlato, per dire che qualcosa costa poco; la forma completa scritta è *ne sont pas chers*.'
  fr.a1.unit04.lesson02.teach.un_kilo_de:
    title: Un chilo di
    gloss: un chilo di
    note: '*De* segue direttamente la quantità, senza articolo: vedi la nota di grammatica su *de after quantity* qui sotto.'
    example_gloss: Vorrei un chilo di pomodori.
  fr.a1.unit04.lesson02.teach.un_litre_de:
    title: Un litro di
    gloss: un litro di
    note: '*Litre* è maschile e si usa per i liquidi come *kilo* si usa per i solidi.'
    example_gloss: Un litro di latte, per favore.
  fr.a1.unit04.lesson02.teach.euro:
    title: Un euro
    gloss: un euro
    note: '*Euro* fa il plurale in modo regolare: *deux euros*, *cinq euros*.'
    example_gloss: Costa cinque euro.
  fr.a1.unit04.lesson02.teach.de_after_quantity:
    title: De dopo una quantità
    gloss: di
    note: 'Dopo una parola di quantità (*un kilo*, *un litre*, *beaucoup*, come in *beaucoup de cousins*), il francese usa semplicemente *de* ed elimina del tutto *du*/*de la*/*des*: *un kilo de tomates*, mai *un kilo des tomates*.'
  fr.a1.unit04.lesson02.teach.combien_ca_coute:
    title: Chiedere il prezzo
    gloss: Quanto costa?
    note: '*Combien* (quanto) più *ça coûte* (costa) è il modo generico per chiedere un prezzo.'
  fr.a1.unit04.lesson02.teach.cest_combien_pain:
    title: Chiedere il prezzo di un prodotto preciso
    gloss: Quanto costa il pane?
    note: '*C''est combien, [item] ?* nomina il prodotto di cui si chiede il prezzo; è un''alternativa frequente a *Combien ça coûte ?*.'
  fr.a1.unit04.lesson02.teach.ca_fait_combien:
    title: Chiedere il totale
    gloss: Quanto fa in totale?
    note: '*Ça fait combien ?* chiede il totale, di solito alla fine degli acquisti e non per un singolo prodotto.'
  fr.a1.unit04.lesson03.teach.line01:
    title: Ordinare i pomodori
    gloss: Inès saluta il venditore e chiede un chilo di pomodori.
    note: Unisce *Bonjour* alla struttura *je voudrais* + quantità.
  fr.a1.unit04.lesson03.teach.line02:
    title: Chiedere se serve altro
    gloss: Il venditore conferma e chiede se le serve altro.
    note: '*Autre chose ?* (altro?) è la domanda standard del commerciante.'
  fr.a1.unit04.lesson03.teach.line03:
    title: Aggiungere il formaggio e chiederne il prezzo
    gloss: Inès aggiunge un po' di formaggio e ne chiede il prezzo.
    note: '*Un peu de fromage* (un po'' di formaggio) usa lo stesso *de* senza articolo di *un kilo de*.'
  fr.a1.unit04.lesson03.teach.line04:
    title: Dire un prezzo al chilo
    gloss: Il venditore dice che costa otto euro al chilo.
    note: '*X euros le kilo* è il modo naturale in francese di indicare un prezzo per unità; qui *le* corrisponde a «al» (al chilo), non a «il».'
  fr.a1.unit04.lesson03.teach.line05:
    title: Spiegare perché compra il pane qui
    gloss: Mathieu dice che vuole anche del pane, ma oggi la panetteria è chiusa.
    note: '*Fermée* (chiusa) è la forma femminile e concorda con *la boulangerie*.'
  fr.a1.unit04.lesson03.teach.line06:
    title: Proporre un'alternativa
    gloss: 'Inès lo rassicura: il pane si può comprare anche qui.'
    note: '*On peut* (si può / possiamo) + infinito è un modo informale e frequente di esprimere una possibilità.'
  fr.a1.unit04.lesson03.teach.line07:
    title: Confermare e dare il totale
    gloss: Il venditore conferma di avere pane fresco, si chiede quanto fa in tutto e dice tredici euro e cinquanta.
    note: Qui *Ça fait combien en tout ?* è il venditore che pensa ad alta voce prima di dire il totale, non una vera domanda a Inès.
  fr.a1.unit04.lesson03.teach.line08:
    title: Ringraziare il venditore
    gloss: Inès lo ringrazia calorosamente mentre paga.
    note: 'Qui *Voilà* accompagna la consegna del pagamento: è una parola che si dice con il gesto.'
