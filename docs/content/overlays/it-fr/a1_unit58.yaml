    gloss: Thomas non fa solo il lavoratore, studia anche. Segue un corso di spagnolo all'università popolare. Ogni settimana impara parole nuove. Léa fa una formazione alla scuola superiore. Lì studia sanità. A tutti e due piace studiare. E tu, che cosa studi, o che cosa ti piacerebbe imparare?
