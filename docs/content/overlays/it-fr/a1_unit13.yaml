  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francese A1
  description: Esprimere e chiedere gusti, cose che non piacciono e preferenze di base, continuando la storia del laboratorio di cucina di Inès e Mathieu, che scelgono tra due ricette per sabato. In francese *préférer X à Y* (preferire X a Y) si costruisce con *à*, non con *que*.
units:
  fr.a1.unit13.preferences:
    title: Cosa preferisci?
lessons:
  fr.a1.unit13.lesson01.vocabulaire_preferences:
    title: Amare, preferire, detestare
  fr.a1.unit13.lesson02.demander_les_preferences:
    title: Chiedere le preferenze
  fr.a1.unit13.lesson03.dialogue_choisir_la_recette:
    title: Scegliere la ricetta di sabato
teaching:
  fr.a1.unit13.lesson01.teach.preferer:
    title: Preferire
    gloss: preferire
    note: '*Préférer* è un verbo in -ER con cambio di accento: *je préfère*, ma *nous préférons* (nelle forme *nous/vous* l''accento non cambia).'
    example_gloss: Preferisco la torta al cioccolato.
  fr.a1.unit13.lesson01.teach.aimer_mieux:
    title: Preferire, piacere di più
    gloss: preferire, piacere di più
    note: '*Aimer mieux* è un''alternativa comune a *préférer*, ma il confronto si fa con *que* (*aimer mieux X que Y*), mentre *préférer* usa *à* (*préférer X à Y*).'
    example_gloss: Mi piacciono di più i piatti salati che quelli dolci.
  fr.a1.unit13.lesson01.teach.detester:
    title: Detestare
    gloss: detestare
    note: '*Détester* esprime un forte rifiuto, più forte di *ne pas aimer* (non amare, non piacere).'
    example_gloss: Mathieu detesta le spezie troppo forti; preferisce i piatti delicati.
  fr.a1.unit13.lesson01.teach.plutot:
    title: Piuttosto
    gloss: piuttosto
    note: '*Plutôt* attenua una preferenza: «piuttosto» questo, senza escludere del tutto l''alternativa.'
    example_gloss: Prendo piuttosto del formaggio.
  fr.a1.unit13.lesson01.teach.sucre:
    title: Dolce
    gloss: dolce
    note: '*Sucré* descrive un cibo zuccherato; non va confuso con *doux* (morbido, delicato, mite), che in italiano si può rendere anche con «dolce».'
    example_gloss: Questo dolce è molto zuccherato.
  fr.a1.unit13.lesson01.teach.sale:
    title: Salato
    gloss: salato
    note: '*Salé* è il contrario abituale di *sucré* nel lessico francese del cibo: come l''italiano «salato», indica sia ciò che è salato di sapore sia ciò che non è dolce.'
    example_gloss: Il formaggio è salato.
  fr.a1.unit13.lesson01.teach.la_recette:
    title: La ricetta
    gloss: la ricetta
    note: '*La recette* è sempre femminile.'
    example_gloss: Questa ricetta è facile.
  fr.a1.unit13.lesson02.teach.quest_ce_que_tu_preferes:
    title: Chiedere una preferenza
    gloss: Cosa preferisci?
    note: '*Qu''est-ce que...* è il modo abituale di formare una domanda aperta con «cosa» nel francese parlato.'
  fr.a1.unit13.lesson02.teach.je_prefere_x_a_y:
    title: Dire la preferenza tra due cose
    gloss: Preferisco la torta alla quiche.
    note: '*Préférer X à Y* usa *à* per introdurre l''opzione meno gradita, come in italiano «preferire X a Y»; non si usa *que*.'
  fr.a1.unit13.lesson02.teach.tu_aimes_plutot:
    title: Chiedere una tendenza generale
    gloss: Ti piace di più il dolce o il salato?
    note: Unisce *plutôt* (lezione 1) a una domanda a scelta con *ou* (o).
  fr.a1.unit13.lesson02.teach.moi_aussi_moi_non:
    title: Essere d'accordo o no
    gloss: Anch'io. / Io no.
    note: '*Moi aussi* conferma un''affermazione positiva; *moi non* dissente o esprime la preferenza opposta.'
  fr.a1.unit13.lesson02.teach.ca_ne_me_derange_pas:
    title: Dire che per te è indifferente
    gloss: Per me è indifferente.
    note: '*Ça ne me dérange pas* è un modo utile e neutro per accettare entrambe le opzioni quando ti chiedono di scegliere.'
  fr.a1.unit13.lesson02.teach.on_pourrait_faire:
    title: Proporre un'opzione
    gloss: Potremmo fare una quiche, no?
    note: '*On pourrait* (potremmo) + infinito propone con garbo un''opzione, invitando all''accordo con *non ?* finale.'
  fr.a1.unit13.lesson03.teach.line01:
    title: Chiedere cosa preparare
    gloss: 'Mathieu chiede cosa preparano sabato: una torta o una quiche?'
    note: '*Qu''est-ce qu''on prépare... ?* (cosa prepariamo) usa *on* per «noi», come si fa di solito nel parlato informale.'
  fr.a1.unit13.lesson03.teach.line02:
    title: Dire una preferenza e chiedere all'altro
    gloss: Inès dice che preferisce la torta, piuttosto dolce, e lo chiede a Mathieu.
    note: '*Et toi ?* (e tu?) è il modo più semplice per rivolgere all''altro la stessa domanda.'
  fr.a1.unit13.lesson03.teach.line03:
    title: Dire la preferenza opposta
    gloss: Mathieu dice che gli piace di più il salato e che preferisce la quiche alla torta.
    note: Riprende direttamente la struttura *préférer X à Y* della lezione 2.
  fr.a1.unit13.lesson03.teach.line04:
    title: Proporre un compromesso
    gloss: Inès propone di farle tutte e due, no?
    note: '*Les deux* (tutti e due) risolve il disaccordo proponendo di fare entrambe le ricette.'
  fr.a1.unit13.lesson03.teach.line05:
    title: Accettare il compromesso
    gloss: Mathieu dice che è una buona idea e che per lui va benissimo.
    note: '*Ça ne me dérange pas du tout* rafforza la frase della lezione 2 con *du tout* (affatto).'
  fr.a1.unit13.lesson03.teach.line06:
    title: Confermare la decisione
    gloss: 'Inès dice: perfetto, una torta dolce e una quiche salata per sabato.'
    note: Riassume chiaramente la decisione finale, chiudendo lo scambio.
