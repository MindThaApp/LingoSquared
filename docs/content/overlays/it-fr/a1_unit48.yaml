teaching:
  fr.a1.unit48.lesson01.teach.le_manteau_le:
    title: Cappotto, maglione
    gloss: il cappotto, il maglione
    note: '*Le manteau* e *le pull* sono entrambi maschili.'
    example_gloss:
    - Cerco un cappotto.
    - Ho un maglione.
  fr.a1.unit48.lesson01.teach.le_pantalon_les:
    title: Pantaloni, scarpe
    gloss: i pantaloni, le scarpe
    note: 'In italiano si dice «i pantaloni» al plurale, ma in francese *pantalon* è singolare: *un pantalon* per un paio. *Chaussures* è il plurale di *chaussure*; le scarpe si menzionano di solito al plurale, come in italiano.'
    example_gloss:
    - Cerco dei pantaloni.
    - Cerco delle scarpe.
  fr.a1.unit48.lesson01.teach.je_cherche_un:
    title: Dire che cosa cerchi
    gloss: Cerco un cappotto.
    note: '*Chercher* (cercare) vuole il complemento diretto senza preposizione, come in italiano: *je cherche un manteau*.'
  fr.a1.unit48.lesson02.teach.la_taille:
    title: Taglia
    gloss: la taglia
    note: '*Taille* è femminile: *la taille*.'
    example_gloss: Che taglia porti?
  fr.a1.unit48.lesson02.teach.quelle_taille_faites:
    title: Chiedere la taglia
    gloss: Che taglia porti?
    note: '*Quelle taille ?* usa *quelle* (quale) perché *taille* è femminile e le risposte possibili sono poche (S, M, L o un numero).'
  fr.a1.unit48.lesson02.teach.je_fais_du:
    title: Dire la propria taglia
    gloss: Porto la taglia M.
    note: '*Faire du M* significa portare la taglia M: il francese usa *faire* (fare) dove l''italiano dice «portare» o «essere».'
  fr.a1.unit48.lesson03.teach.noir_bleu:
    title: Nero, blu
    gloss: nero, blu
    note: I due aggettivi di colore di base di questa lezione.
    example_gloss:
    - Voglio il cappotto nero.
    - Ha anche questo in blu?
  fr.a1.unit48.lesson03.teach.je_veux_le:
    title: Chiedere un colore
    gloss: Voglio il cappotto nero.
    note: '*En* + colore è il modo standard per indicare il colore di un capo quando lo si chiede o lo si ordina.'
  fr.a1.unit48.lesson03.teach.avez_vous_aussi:
    title: Chiedere un altro colore
    gloss: Ha anche questo in blu?
    note: '*Aussi* (anche) serve a chiedere se è disponibile un altro colore, qui con il registro formale *vous*.'
  fr.a1.unit48.lesson04.teach.est_ce_que:
    title: Chiedere se calza bene
    gloss: Questo cappotto ti sta bene?
    note: '*Aller* (andare) è il verbo naturale per la vestibilità: *il me va bien*, letteralmente «mi va bene».'
  fr.a1.unit48.lesson04.teach.il_me_va:
    title: Confermare che calza bene
    gloss: Mi sta bene.
    note: '*Bien* (bene) descrive come il capo calza.'
  fr.a1.unit48.lesson04.teach.c_est_trop:
    title: Troppo piccolo
    gloss: È troppo piccolo.
    note: '*Trop* (troppo) sta prima dell''aggettivo per esprimere eccesso.'
  fr.a1.unit48.lesson04.teach.c_est_trop_2:
    title: Troppo grande
    gloss: È troppo grande.
    note: Stessa struttura *trop* + aggettivo del *trop petit* della scheda precedente.
  fr.a1.unit48.lesson05.teach.quatre_vingt_dix:
    title: Novanta
    gloss: novanta
    note: '*Quatre-vingt-dix* è il numero 90 (letteralmente «quattro venti dieci»), usato qui nel prezzo del cappotto.'
    example_gloss: Il cappotto costa novanta euro.
  fr.a1.unit48.lesson05.teach.le_manteau_coute:
    title: Dire un prezzo
    gloss: Il cappotto costa novanta euro.
    note: '*Coûte* è la forma di *coûter* (costare) per *il*.'
  fr.a1.unit48.lesson05.teach.parka_taille_m:
    title: Leggere uno scontrino del negozio
    gloss: 'Giaccone invernale: taglia M, colore nero. Prezzo: novanta euro. Questo cappotto mi sta bene ed è caldo.'
    note: Individua la taglia, il colore, il prezzo e le due qualità citate per il cappotto.
    glosses:
      Parka: giaccone invernale
      taille: taglia
      couleur: colore
      noire: nero
      Prix: prezzo
      quatre-vingt-dix: novanta
      euros: euro
      manteau: cappotto
      va: sta bene
      chaud: caldo
  fr.a1.unit48.lesson06.teach.camille_ce_manteau:
    title: Camille nota il cappotto
    gloss: 'Camille: Questo cappotto è bellissimo! Che taglia porti?'
    note: '*Joli* (bello, carino) è una reazione positiva generica; qui è maschile perché concorda con *manteau*.'
  fr.a1.unit48.lesson06.teach.mathieu_je_fais:
    title: Mathieu chiede di provarlo
    gloss: 'Mathieu: Porto la M. Posso provarlo?'
    note: '*Je peux ... ?* è il modo standard per chiedere il permesso; *l''essayer* significa «provarlo» e *l''* sostituisce il cappotto.'
  fr.a1.unit48.lesson06.teach.camille_bien_sur:
    title: Camille chiede come calza
    gloss: 'Camille: Certo. Ti sta bene?'
    note: '*Il* (lui, esso) riprende *le manteau*, un nome maschile.'
  fr.a1.unit48.lesson06.teach.mathieu_oui_il:
    title: Mathieu conferma
    gloss: 'Mathieu: Sì, mi sta bene ed è caldo.'
    note: 'Corrisponde esattamente allo scontrino letto prima: è lo stesso cappotto.'
  fr.a1.unit48.lesson06.teach.camille_super_tu:
    title: Camille chiede il colore
    gloss: 'Camille: Fantastico! Lo vuoi nero o blu?'
    note: '*Tu le veux en ... ou en ... ?* propone una scelta; *le* sostituisce il cappotto.'
  fr.a1.unit48.lesson06.teach.mathieu_je_le:
    title: Mathieu decide
    gloss: 'Mathieu: Lo prendo nero.'
    note: '*Prendre* (prendere) è il verbo naturale per concludere la scelta di un acquisto, in linea con il colore indicato nello scontrino.'
  fr.a1.unit48.lesson06.teach.on_ecrit_prends:
    title: Prends o prend
    gloss: '*Prends* è la forma di *prendre* (prendere) per io e tu; *prend* è la forma per lui/lei.'
    note: 'Lo schema di *prendre*: *je prends, tu prends, il/elle prend*.'
