teaching:
  fr.a1.unit49.lesson01.teach.content_triste_en:
    title: Felice, triste e arrabbiato
    gloss: contento, triste, arrabbiato
    note: Tre parole di base per le emozioni, usate con *être* (essere); *content* ha il femminile *contente*, mentre *triste* e *en colère* non cambiano.
    example_gloss:
    - Sono contento.
    - Sono triste.
    - Sono arrabbiato.
  fr.a1.unit49.lesson01.teach.je_suis_content:
    title: Dire che si è contenti
    gloss: Sono contento.
    note: Il modello di base è *être* (essere) + aggettivo di emozione, come in italiano «sono ...».
  fr.a1.unit49.lesson01.teach.je_ne_suis:
    title: Contrapporre le emozioni
    gloss: Non sono arrabbiato, sono triste.
    note: '*Ne ... pas* racchiude il verbo; la seconda frase indica poi l''emozione reale.'
  fr.a1.unit49.lesson02.teach.pourquoi_es_tu:
    title: Chiedere perché
    gloss: Perché sei contento?
    note: '*Pourquoi* (perché) è la parola interrogativa standard per chiedere un motivo.'
  fr.a1.unit49.lesson02.teach.je_suis_content:
    title: Dare un motivo
    gloss: Sono contento perché ho un nuovo appartamento.
    note: '*Parce que* (perché) introduce la causa; davanti a *il* diventa *parce qu''*.'
  fr.a1.unit49.lesson02.teach.je_suis_triste:
    title: Un motivo negativo
    gloss: Sono triste perché piove.
    note: Riprende *il pleut* (piove) dell'unità sul meteo come causa.
  fr.a1.unit49.lesson03.teach.nerveux:
    title: Nervoso
    gloss: nervoso
    note: La parola standard per indicare il nervosismo.
    example_gloss: Sono agitato per il mio primo turno.
  fr.a1.unit49.lesson03.teach.je_suis_nerveux:
    title: Dire per che cosa si è agitati
    gloss: Sono agitato per il mio primo turno.
    note: '*Avant* (letteralmente «prima di») introduce ciò che causa il nervosismo, dove in italiano si dice «per».'
  fr.a1.unit49.lesson03.teach.ne_t_inquiete:
    title: Rassicurare qualcuno
    gloss: Non ti preoccupare.
    note: '*Ne t''inquiète pas* (letteralmente «non ti preoccupare») è la formula fissa standard per rassicurare; *s''inquiéter* è riflessivo.'
  fr.a1.unit49.lesson04.teach.comment_se_sent:
    title: Chiedere come si sente qualcuno
    gloss: Come si sente Mathieu?
    note: '*Se sentir* (sentirsi, riflessivo) è il modo standard per chiedere o descrivere uno stato d''animo; compare anche nell''unità sulla salute.'
  fr.a1.unit49.lesson04.teach.il_se_sent:
    title: Descrivere come si sente qualcuno
    gloss: Si sente agitato.
    note: '*Se* (si) è il pronome riflessivo di terza persona, abbinato a *sent*.'
  fr.a1.unit49.lesson04.teach.pourquoi_se_sent:
    title: Chiedere perché qualcuno si sente in un certo modo
    gloss: Perché si sente agitato?
    note: Unisce *pourquoi* a *se sentir* come in *Il se sent nerveux*; *sent-il* si scrive con il trattino.
  fr.a1.unit49.lesson05.teach.salut_camille_je:
    title: Leggi un messaggio sulle emozioni
    gloss: Ciao Camille, sono un po' agitato per il mio primo turno da solo. Ma sono anche contento, perché ho un nuovo lavoro e un nuovo appartamento. Penso che andrà bene.
    note: Cerca di capire per che cosa è agitato chi scrive, che cosa lo rende contento e come vede la situazione nel complesso.
    glosses:
      peu: un po'
      nerveux: nervoso
      premier: primo
      service: turno
      seul: da solo
      content: contento
      car: perché
      nouveau: nuovo
      travail: lavoro
      nouvel: nuovo
      appartement: appartamento
      pense: pensare
      aller: 'andare (qui: andrà bene)'
  fr.a1.unit49.lesson06.teach.camille_salut_mathieu:
    title: Camille chiede a Mathieu come si sente
    gloss: 'Camille: Ciao Mathieu, come ti senti prima del tuo primo turno?'
    note: '*Avant ton premier service* (prima del tuo primo turno) riprende la struttura *avant* + nome della lezione 3.'
  fr.a1.unit49.lesson06.teach.mathieu_je_suis:
    title: Mathieu ammette di essere agitato
    gloss: 'Mathieu: Sono un po'' agitato, sinceramente.'
    note: '*Honnêtement* (sinceramente) attenua l''ammissione.'
  fr.a1.unit49.lesson06.teach.camille_ne_t:
    title: Camille lo rassicura
    gloss: 'Camille: Non ti preoccupare, ce la farai!'
    note: '*Tu vas y arriver* (letteralmente «ci arriverai») è un''espressione fissa di incoraggiamento; *aller* + infinito forma il futuro prossimo.'
  fr.a1.unit49.lesson06.teach.mathieu_merci_ca:
    title: Mathieu la ringrazia
    gloss: 'Mathieu: Grazie, mi aiuta davvero.'
    note: '*Aide* è la forma *il/elle* di *aider* (aiutare); *m''* sta per *me*.'
  fr.a1.unit49.lesson06.teach.camille_et_apres:
    title: Camille prevede come andrà a finire
    gloss: 'Camille: E dopo sarai sicuramente molto contento e fiero.'
    note: '*Sûrement* (sicuramente) esprime una previsione sicura; *fier* (fiero) è un aggettivo nuovo e utile.'
  fr.a1.unit49.lesson06.teach.mathieu_oui_je:
    title: Mathieu è d'accordo
    gloss: 'Mathieu: Sì, lo penso anch''io.'
    note: '*Je pense aussi* è il modo naturale per dirsi d''accordo con l''opinione di qualcuno.'
  fr.a1.unit49.lesson06.teach.il_remplace_mathieu:
    title: Riassumere con il, elle e l'
    gloss: Mathieu è agitato per il suo primo turno. Camille lo aiuta.
    note: '*Il* sostituisce il nome di un uomo (*il est nerveux*), *elle* sostituisce il nome di una donna, e *l''* (*elle l''aide*) significa «lo»: tre parole piccole ma essenziali per parlare di un''altra persona.'
