  fr.a1.unit54.lesson06.l_oiseau_de_nina:
    title: L'uccellino di Nina
teaching:
  fr.a1.unit54.lesson01.teach.l_animal_un:
    title: Animale, animale domestico
    gloss: l'animale / un animale domestico
    note: '*Un animal* è la parola generale; *un animal de compagnie* (letteralmente «un animale di compagnia») indica specificamente un animale domestico.'
    example_gloss:
    - Il cane è un animale.
    - Il cane è anche un animale domestico.
  fr.a1.unit54.lesson01.teach.le_chien_le:
    title: Cane e gatto
    gloss: il cane / il gatto
    example_gloss:
    - Camille ha un cane.
    - Thomas ha un gatto.
  fr.a1.unit54.lesson01.teach.le_poisson_l:
    title: Pesce e uccello
    gloss: il pesce / l'uccello
    example_gloss:
    - Il nonno ha un pesce.
    - Nina ha un uccellino.
  fr.a1.unit54.lesson01.teach.tu_as_un:
    title: Hai un animale domestico?
    gloss: Hai un animale domestico?
    note: Lo stesso schema di domanda *Tu as ... ?* che conosci già dalle unità precedenti.
  fr.a1.unit54.lesson01.teach.oui_j_ai:
    title: Sì, ho un cane
    gloss: Sì, ho un cane.
    note: Una semplice risposta affermativa con il lessico nuovo di questa unità.
  fr.a1.unit54.lesson01.teach.non_je_n:
    title: No, non ho un animale domestico
    gloss: No, non ho un animale domestico.
    note: '*Pas d''* sostituisce *un* dopo una negazione: *Je n''ai pas d''animal de compagnie.* Vedi la nota di grammatica.'
  fr.a1.unit54.lesson01.teach.apres_ne_pas:
    title: 'Pas de: la negazione di un/une/des'
    gloss: Dopo *ne ... pas*, *un*, *une* e *des* diventano *de* o *d'*, come in *Je n'ai pas de temps* (che già conosci) e qui in *Je n'ai pas d'animal de compagnie*.
    note: 'Riprende lo schema già visto con *Je n''ai pas de temps*: non è una grammatica nuova, solo un nuovo nome a cui applicarla.'
  fr.a1.unit54.lesson02.teach.promener:
    title: Portare a spasso (un animale)
    gloss: portare a spasso (un animale)
    note: '*Promener* (portare a spasso) è un verbo regolare in *-er*; vedi la nota di grammatica.'
    example_gloss: Porto a spasso il cane ogni giorno.
  fr.a1.unit54.lesson02.teach.promener_est_un:
    title: Promener è un verbo regolare in -er
    gloss: '*Promener* è un verbo regolare in *-er*, come *cuisiner*: *je promène, tu promènes, il promène le chien*. L''accento sulla *e* indica che si pronuncia.'
    note: Il verbo resta sempre in un unico pezzo, come gli altri verbi in *-er* che già conosci.
  fr.a1.unit54.lesson02.teach.donner_a_manger:
    title: Dare da mangiare
    gloss: dare da mangiare
    example_gloss: Do da mangiare al gatto ogni giorno.
  fr.a1.unit54.lesson02.teach.jouer_avec:
    title: Giocare con
    gloss: giocare con
    example_gloss: Thomas gioca con il suo gatto.
  fr.a1.unit54.lesson02.teach.je_promene_le:
    title: Porto a spasso il cane ogni giorno
    gloss: Porto a spasso il cane ogni giorno.
    note: Unisce *promener* a *tous les jours* (ogni giorno), già visto in un'unità precedente.
  fr.a1.unit54.lesson02.teach.je_donne_a:
    title: Do da mangiare al gatto ogni giorno
    gloss: Do da mangiare al gatto ogni giorno.
    note: Unisce *donner à manger* (letteralmente «dare da mangiare») a *tous les jours*.
  fr.a1.unit54.lesson03.teach.au_pluriel_on:
    title: 'Plurale: chien -> chiens'
    gloss: 'Il plurale di solito aggiunge una *s* che non si sente: *chien -> chiens*, *chat -> chats*. I nomi in *-al* diventano *-aux*: *animal -> animaux*.'
    note: Il modello regolare del plurale francese, presentato qui per la prima volta con i nomi di animali come esempi.
  fr.a1.unit54.lesson03.teach.chiens_chats:
    title: Cani e gatti
    gloss: cani / gatti
    example_gloss:
    - Mathieu adora i cani.
    - Léa adora i gatti.
  fr.a1.unit54.lesson03.teach.poissons_oiseaux:
    title: Pesci e uccelli (plurale)
    gloss: pesci / uccelli
    example_gloss:
    - Adoro i pesci.
    - Il nonno adora gli uccelli.
  fr.a1.unit54.lesson03.teach.j_adore_les:
    title: Adoro gli animali
    gloss: Adoro gli animali.
    note: '*Adorer* (adorare) è seguito direttamente dal nome, e un gusto generale richiede *les*: *J''adore les animaux.*'
  fr.a1.unit54.lesson03.teach.lea_adore_les:
    title: Léa adora i gatti, ma non ha un animale domestico
    gloss: Léa adora i gatti, ma non ha un animale domestico.
    note: Prepara il contrasto su cui è costruita la lettura della lezione 5.
  fr.a1.unit54.lesson04.teach.mathieu_tu_as:
    title: Mathieu chiede di un animale domestico
    gloss: 'Mathieu: Hai un animale domestico, Camille?'
  fr.a1.unit54.lesson04.teach.camille_oui_j:
    title: Camille ha un cane
    gloss: 'Camille: Sì, ho un cane.'
  fr.a1.unit54.lesson04.teach.mathieu_comment_est:
    title: Mathieu chiede com'è
    gloss: 'Mathieu: Com''è?'
    note: Riprende *Comment est-il ?* dall'unità sull'aspetto fisico, ora riferito a un animale.
  fr.a1.unit54.lesson04.teach.camille_il_a:
    title: Camille descrive il suo cane
    gloss: 'Camille: Ha il pelo marrone ed è piccolo.'
    note: Riprende il lessico dei colori dei capelli e delle dimensioni dell'unità sull'aspetto fisico, ora per descrivere il pelo di un animale invece dei capelli di una persona.
  fr.a1.unit54.lesson04.teach.il_et_le:
    title: Il/le per gli animali
    gloss: '*Il* (lui) e *le* (lo) si usano anche per un animale maschio, non solo per una persona.'
    note: Finora nel corso *il* e *le* indicavano sempre una persona; qui si precisa che valgono anche per gli animali.
  fr.a1.unit54.lesson04.teach.mathieu_tu_le:
    title: Mathieu chiede delle passeggiate
    gloss: 'Mathieu: Lo porti a spasso ogni giorno?'
  fr.a1.unit54.lesson04.teach.camille_oui_je:
    title: Camille racconta la sua routine
    gloss: 'Camille: Sì, lo porto a spasso ogni giorno e gli do da mangiare.'
  fr.a1.unit54.lesson05.teach.mathieu_et_lea:
    title: Mathieu, Léa e Thomas e gli animali
    gloss: 'Mathieu e Léa adorano entrambi gli animali, ma nessuno dei due ha un animale domestico. Mathieu adora i cani e Léa adora i gatti. Thomas, invece, ha un animale domestico: un gatto. Gioca spesso con il suo gatto e gli dà da mangiare ogni giorno. E tu, hai un animale domestico?'
    note: 'Contrappone l''amare gli animali all''averne davvero uno: è lo scopo comunicativo dell''obiettivo.'
    glosses:
      adorent: adorare / piacere molto
      tous: entrambi
      animaux: animali
      deux: entrambi
      compagnie: animale domestico
      chiens: cani
      chats: gatti
      chat: gatto
      joue: gioca
      donne: dà
      chaque: ogni / tutti
      manger: cibo
  fr.a1.unit54.lesson05.teach.thomas_joue_souvent:
    title: Thomas gioca spesso con il suo gatto
    gloss: Thomas gioca spesso con il suo gatto.
    note: '*Souvent* (spesso) si mette subito dopo il verbo, come nelle routine già viste.'
  fr.a1.unit54.lesson05.teach.j_adore_les:
    title: Adoro i cani. Non ho un animale domestico.
    gloss: Adoro i cani. Non ho un animale domestico.
    note: Una risposta modello di due frasi, da riutilizzare per l'esercizio di scrittura dell'unità.
  fr.a1.unit54.lesson06.teach.camille_nina_tu:
    title: Camille chiede a Nina
    gloss: 'Camille: Nina, hai anche tu un animale domestico?'
  fr.a1.unit54.lesson06.teach.nina_oui_j:
    title: Nina ha un uccellino di nome Pico
    gloss: 'Nina: Sì, ho un uccellino. Si chiama Pico.'
    note: '*Il s''appelle* (si chiama) riprende il verbo di presentazione della primissima unità.'
  fr.a1.unit54.lesson06.teach.mathieu_comme_c:
    title: Mathieu reagisce
    gloss: 'Mathieu: Che bello! Che cosa fai con lui ogni giorno?'
  fr.a1.unit54.lesson06.teach.nina_je_lui:
    title: Nina gli dà da mangiare ogni giorno
    gloss: 'Nina: Gli do da mangiare ogni giorno.'
  fr.a1.unit54.lesson06.teach.mathieu_j_adore:
    title: Anche Mathieu adora gli uccelli
    gloss: 'Mathieu: Anch''io adoro gli uccelli.'
  fr.a1.unit54.lesson06.teach.camille_c_est:
    title: Camille chiude la conversazione
    gloss: 'Camille: Che bello, amiamo tutti e tre gli animali!'
    note: Chiude il cerchio sulle informazioni sugli animali dei tre personaggi di questa unità.
