answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francese A1
  description: Il lessico della famiglia stretta e allargata, il sistema degli aggettivi possessivi mon/ma/mes e la descrizione di una famiglia, in continuità con la storia del laboratorio di cucina di Inès e Mathieu delle unità 01-02. Come in italiano, i possessivi francesi si accordano con il genere del nome, non con quello di chi possiede.
units:
  fr.a1.unit03.family:
    title: Le famiglie di Inès e Mathieu
lessons:
  fr.a1.unit03.lesson01.immediate_family:
    title: La famiglia stretta
  fr.a1.unit03.lesson02.possessives_mon_ma_mes:
    title: 'Possessivi: mon, ma, mes'
  fr.a1.unit03.lesson03.extended_family:
    title: La famiglia allargata
  fr.a1.unit03.lesson04.describing_family_size:
    title: Quanti siamo a casa
  fr.a1.unit03.lesson05.reading_a_family_profile:
    title: Leggere il profilo di una famiglia
  fr.a1.unit03.lesson06.family_photos_dialogue:
    title: Foto di famiglia con Inès e Mathieu
teaching:
  fr.a1.unit03.lesson01.teach.mere:
    title: Madre
    gloss: madre
    note: '*Mère* è femminile. *Maman* è la parola più comune nell''uso quotidiano in famiglia, mentre *mère* è neutra e compare nelle liste di vocabolario di questo corso.'
  fr.a1.unit03.lesson01.teach.pere:
    title: Padre
    gloss: padre
    note: '*Père* è maschile. *Papa* è l''equivalente di uso quotidiano, in parallelo a *mère*/*maman*.'
  fr.a1.unit03.lesson01.teach.frere:
    title: Fratello
    gloss: fratello
    note: '*Frère* è maschile singolare.'
  fr.a1.unit03.lesson01.teach.soeur:
    title: Sorella
    gloss: sorella
    note: '*Sœur* è femminile singolare. Il segno œ è una sola lettera nell''ortografia francese, non due lettere separate.'
  fr.a1.unit03.lesson01.teach.fils:
    title: Figlio
    gloss: figlio
    note: '*Fils* è maschile; attenzione: la s finale, di solito muta, qui si pronuncia (è un''eccezione), mentre la l non si pronuncia.'
  fr.a1.unit03.lesson01.teach.fille:
    title: Figlia
    gloss: figlia
    note: '*Fille* è femminile singolare; la stessa parola significa anche «ragazza» o «bambina» in altri contesti.'
  fr.a1.unit03.lesson01.teach.parents:
    title: Parents
    gloss: genitori
    note: '*Parents* è maschile plurale e indica insieme madre e padre.'
  fr.a1.unit03.lesson01.teach.freres_et_soeurs:
    title: Fratelli e sorelle
    gloss: fratelli e sorelle
    note: 'Il francese non usa il maschile plurale per un gruppo misto come fa spesso l''italiano con «fratelli»: *frères et sœurs* nomina esplicitamente entrambi.'
  fr.a1.unit03.lesson02.teach.ma_mere:
    title: Mia madre
    gloss: mia madre
    note: '*Ma* è il possessivo femminile singolare «mia», usato perché *mère* è femminile.'
  fr.a1.unit03.lesson02.teach.mon_pere:
    title: Mio padre
    gloss: mio padre
    note: '*Mon* è il possessivo maschile singolare «mio», usato perché *père* è maschile.'
  fr.a1.unit03.lesson02.teach.mes_freres_et_soeurs:
    title: I miei fratelli e sorelle
    gloss: i miei fratelli e sorelle
    note: '*Mes* è il possessivo plurale «miei/mie», usato con qualsiasi nome plurale, sia maschile sia femminile: segue lo stesso schema di *ma*/*mon*, ma in base al numero e non al genere.'
  fr.a1.unit03.lesson02.teach.as_tu_des_freres_et_soeurs:
    title: Chiedere dei fratelli
    gloss: Hai fratelli o sorelle?
    note: '*As-tu* è la forma interrogativa con inversione di *tu as* (tu hai), una domanda molto comune al livello A1.'
  fr.a1.unit03.lesson02.teach.jai_deux_soeurs:
    title: Dire quanti fratelli si hanno
    gloss: Ho due sorelle.
    note: '*J''ai* (io ho) seguito da un numero e dal nome del familiare è il modo standard per parlare dei propri fratelli e sorelle.'
  fr.a1.unit03.lesson02.teach.ta_famille_est_grande:
    title: Chiedere se una famiglia è numerosa
    gloss: La tua famiglia è grande?
    note: '*Ta* è il possessivo femminile singolare informale «tua», concordato con il nome femminile *famille*.'
  fr.a1.unit03.lesson02.teach.ma_famille_est_petite:
    title: Descrivere una famiglia piccola
    gloss: La mia famiglia è piccola.
    note: '*Petite* concorda con il nome femminile *famille*; con un nome maschile si userebbe invece *petit*. Attenzione: è un tipo di concordanza diverso da quello di *mon*/*ma*/*mes*, che concorda anch''esso con il nome ma indica il POSSESSO, mentre qui si descrive una qualità.'
  fr.a1.unit03.lesson03.teach.grand_pere:
    title: Nonno
    gloss: nonno
    note: '*Grand-père* è un composto con trattino, maschile.'
  fr.a1.unit03.lesson03.teach.grand_mere:
    title: Nonna
    gloss: nonna
    note: '*Grand-mère* è un composto con trattino, femminile. Nota che *grand-* resta invariato e non diventa *grande-mère*.'
  fr.a1.unit03.lesson03.teach.grands_parents:
    title: I nonni
    gloss: i nonni
    note: In *grands-parents* entrambe le parti del composto vanno al plurale (*grands*, non *grand-*), a differenza di *grand-mère*/*grand-père*, dove al singolare *grand-* non cambia.
  fr.a1.unit03.lesson03.teach.oncle:
    title: Zio
    gloss: zio
    note: '*Oncle* è maschile.'
  fr.a1.unit03.lesson03.teach.tante:
    title: Zia
    gloss: zia
    note: '*Tante* è femminile.'
  fr.a1.unit03.lesson03.teach.cousin:
    title: Cugino
    gloss: cugino
    note: '*Cousin* è maschile singolare; come in italiano («cugino»), il francese distingue il genere del cugino.'
  fr.a1.unit03.lesson03.teach.cousine:
    title: Cugina
    gloss: cugina
    note: '*Cousine* è femminile singolare e si forma aggiungendo -e a *cousin*.'
  fr.a1.unit03.lesson03.teach.mes_grands_parents:
    title: I miei nonni
    gloss: i miei nonni
    note: Si usa *mes* perché *grands-parents* è plurale, anche se il composto comprende (implicitamente) membri sia maschili sia femminili.
  fr.a1.unit03.lesson04.teach.combien_de_freres_et_soeurs:
    title: Chiedere quanti fratelli ha qualcuno
    gloss: Quanti fratelli hai?
    note: '*Combien de* (quanti/quante) si mette direttamente davanti al nome, e il verbo segue con il soggetto invertito.'
  fr.a1.unit03.lesson04.teach.on_est_cinq:
    title: Dire quante persone siete in casa
    gloss: Siamo in sei a casa.
    note: '*On est* (letteralmente «si è», ma usato come «siamo» informale) è il modo naturale e frequentissimo di indicare quante persone vivono in casa nel francese parlato; *nous sommes* è più formale o scritto.'
  fr.a1.unit03.lesson04.teach.ma_famille_est_grande:
    title: Descrivere una famiglia numerosa
    gloss: La mia famiglia è grande.
    note: '*Grande* concorda con il nome femminile *famille*; con un nome maschile si userebbe invece *grand*.'
  fr.a1.unit03.lesson04.teach.jai_beaucoup_de_cousins:
    title: Dire che hai molti cugini
    gloss: Ho molti cugini.
    note: '*Beaucoup de* (molti) precede il nome; qui *de* non diventa *du*/*des* perché *beaucoup* quantifica già il nome.'
  fr.a1.unit03.lesson04.teach.tu_habites_pres_de_tes_parents:
    title: Chiedere se si vive vicino ai genitori
    gloss: Vivi vicino ai tuoi genitori?
    note: '*Tes* è il possessivo plurale informale «tuoi/tue», necessario perché *parents* è plurale.'
  fr.a1.unit03.lesson04.teach.jhabite_avec_mes_grands_parents:
    title: Dire con chi vivi
    gloss: Vivo con i miei nonni.
    note: '*Avec* (con) introduce le persone con cui si vive; *j''habite* è la forma con *je* di *habiter*, già vista nell''Unità 1 con *j''habite à Montreuil*.'
  fr.a1.unit03.lesson05.teach.profile_reading:
    title: Il profilo familiare di Inès
    gloss: 'Mi chiamo Inès. Ho trentuno anni e vivo con i miei nonni a Parigi. Mia madre e mio padre vivono a Lille. Ho due sorelle e un fratello: siamo in sei a casa. La mia sorellina si chiama Camille e ha vent''anni.'
    note: 'Questo profilo riprende il lessico e le strutture delle lezioni 1-4 in un breve testo coerente invece che in frasi isolate: è la stessa abilità di capire «chi è chi» su cui si concentra la verifica di lettura dell''unità.'
    glosses:
      trente: trenta
      ans: anni
      grands-parents: i nonni
      mère: madre
      père: padre
      habitent: abitano / vivono (da habiter)
      deux: due
      sœurs: sorelle
      frère: fratello
      six: sei
      maison: casa
      petite: minore / piccola
      sœur: sorella
      vingt: venti
  fr.a1.unit03.lesson05.teach.petite_soeur:
    title: Sorella minore / sorellina
    gloss: sorella minore; sorellina
    note: '*Petite* (femminile di *petit*) precede il nome, come la maggior parte degli aggettivi brevi e comuni in francese; la maggior parte degli altri aggettivi, invece, segue il nome.'
  fr.a1.unit03.lesson05.teach.habite_third_person:
    title: Vive (terza persona)
    gloss: vive
    note: '*Habite* è la terza persona singolare di *habiter*, usata per parlare DI qualcuno (*Inès habite...*) e non in prima persona (*j''habite*, vista nell''Unità 1 e nella lezione 4 di questa unità).'
  fr.a1.unit03.lesson05.teach.ses_third_person_plural:
    title: Suoi / loro (nome plurale)
    gloss: suoi / loro
    note: '*Ses* è il plurale di *sa*/*son*: come *sa*/*son* corrispondono a «suo/sua» con un nome singolare, così al plurale si usa «suoi/sue». *ses grands-parents* significa «i suoi nonni» quando si parla di Inès in terza persona.'
  fr.a1.unit03.lesson05.teach.a_third_person_avoir:
    title: Ha (terza persona)
    gloss: ha
    note: '*A* è la terza persona singolare di *avoir*, usata per parlare DI qualcuno (*elle a vingt ans*) e non in prima persona (*j''ai* / *as-tu*, visti in tutte le lezioni 2-4 di questa unità).'
  fr.a1.unit03.lesson06.teach.line01:
    title: Mostrare le foto di famiglia
    gloss: Inès mostra a Mathieu una foto e presenta i suoi genitori e la sua sorellina.
    note: '*Voici* (ecco) introduce qualcosa che si sta indicando, ed è una frase naturale per mostrare una foto.'
  fr.a1.unit03.lesson06.teach.line02:
    title: Reagire e chiedere dei fratelli
    gloss: Mathieu reagisce con affetto e le chiede se ha altri fratelli e sorelle.
    note: '*C''est adorable* è una reazione naturale e affettuosa davanti alla foto di un fratellino o una sorellina.'
  fr.a1.unit03.lesson06.teach.line03:
    title: Dire quanti siete in casa e ricambiare la domanda
    gloss: Inès dice di avere due sorelle e un fratello, in sei a casa, poi chiede della famiglia di Mathieu.
    note: '*On est six à la maison* indica il numero totale di persone in casa e riprende lo schema della lezione 4.'
  fr.a1.unit03.lesson06.teach.line04:
    title: Descrivere una famiglia più piccola
    gloss: 'Mathieu dice che la sua famiglia è più piccola, sono solo in tre: i suoi genitori e lui, ma ha molti cugini.'
    note: '*Mais* (ma) segnala il contrasto tra una famiglia ristretta piccola e tanti parenti più lontani.'
  fr.a1.unit03.lesson06.teach.line05:
    title: Chiedere della vicinanza ai genitori
    gloss: Inès chiede a Mathieu se abita vicino ai suoi genitori.
    note: '*Près de* (vicino a) è un modo comune per indicare la vicinanza fisica.'
  fr.a1.unit03.lesson06.teach.line06:
    title: Spiegare la distanza e come restare in contatto
    gloss: Mathieu dice di no, loro abitano a Lione, e si sentono al telefono ogni settimana.
    note: 'Continua quanto stabilito nell''Unità 1, cioè che Mathieu viene da Lione: i suoi genitori restano lì mentre lui vive a Saint-Ouen.'
  fr.a1.unit03.lesson06.teach.line07:
    title: Mostrare comprensione e parlare della propria situazione
    gloss: Inès dice che capisce e che lei abita qui a Parigi con i suoi nonni.
    note: '*Je comprends* (capisco) è un modo breve e naturale per reagire a ciò che qualcuno ha appena raccontato, prima di aggiungere un proprio dettaglio.'
  fr.a1.unit03.lesson06.teach.line08:
    title: Chiudere con un commento caloroso
    gloss: Mathieu dice che è bello avere la famiglia vicino.
    note: '*C''est bien d''avoir sa famille près de soi* chiude lo scambio con una nota calda e riflessiva, riprendendo lo schema di *près de* della lezione 4.'
