teaching:
  fr.a1.unit46.lesson01.teach.l_appartement_le:
    title: Appartamento, soggiorno, camera
    gloss: l'appartamento, il soggiorno, la camera
    note: '*L''appartement* è maschile e *le* diventa *l''* davanti a vocale; *le salon* è maschile e *la chambre* è femminile.'
    example_gloss:
    - Ho un appartamento.
    - Ho un soggiorno.
    - Ho una camera.
  fr.a1.unit46.lesson01.teach.la_cuisine_la:
    title: Cucina, bagno
    gloss: la cucina, il bagno
    note: '*La cuisine* e *la salle de bains* sono entrambi femminili.'
    example_gloss:
    - Ho una cucina.
    - Ho un bagno.
  fr.a1.unit46.lesson01.teach.j_ai_un:
    title: Dire che hai un appartamento
    gloss: Ho un appartamento.
    note: '*Avoir* (avere) è il verbo naturale per dire che casa hai, come in italiano. Questo è un esempio generico; l''appartamento di Mathieu (a Lione) arriva più avanti in questa unità.'
  fr.a1.unit46.lesson01.teach.j_ai_un_2:
    title: Elencare tutte le stanze
    gloss: Ho un soggiorno, una camera da letto, una cucina e un bagno.
    note: Elenca in una sola frase le quattro stanze del vocabolario di questa lezione, separate da virgole e con *et* prima dell'ultima.
  fr.a1.unit46.lesson02.teach.tu_as_combien:
    title: Chiedere quante stanze ci sono
    gloss: Quante stanze hai?
    note: 'Dopo *combien de* (quanti/quante) si usa un nome al plurale: *combien de pièces*.'
  fr.a1.unit46.lesson02.teach.j_ai_deux:
    title: Dire quante camere ci sono
    gloss: Ho due camere.
    note: '*Chambres* è il plurale di *chambre*, formato regolarmente con una *-s* muta.'
  fr.a1.unit46.lesson02.teach.l_appartement_a:
    title: Dire il numero totale di stanze
    gloss: L'appartamento ha tre stanze.
    note: '*Pièces* è un termine generale per indicare le stanze, non solo le camere da letto.'
  fr.a1.unit46.lesson03.teach.le_balcon_le:
    title: Balcone, giardino
    gloss: il balcone, il giardino
    note: '*Le balcon* e *le jardin* sono entrambi maschili.'
    example_gloss:
    - C'è un balcone.
    - Non c'è il giardino.
  fr.a1.unit46.lesson03.teach.il_y_a:
    title: Dire che qualcosa c'è
    gloss: C'è un balcone.
    note: '*Il y a* è la costruzione standard per dire che qualcosa esiste, equivalente a «c''è» / «ci sono» in italiano.'
  fr.a1.unit46.lesson03.teach.il_n_y:
    title: Dire che qualcosa non c'è
    gloss: Non c'è il giardino.
    note: '*Pas de* nega un nome indeterminato: *pas de jardin*, non *pas un jardin*.'
  fr.a1.unit46.lesson04.teach.cosy:
    title: Accogliente
    gloss: accogliente
    note: Un aggettivo francese molto comune e caratteristico per indicare un'atmosfera calda e piacevole; non corrisponde esattamente a una sola parola italiana.
    example_gloss: L'appartamento è piccolo ma accogliente.
  fr.a1.unit46.lesson04.teach.l_appartement_est:
    title: Uno schema comune di descrizione
    gloss: L'appartamento è piccolo ma accogliente.
    note: '*Petit mais cosy* è un modo molto naturale in cui i francesi descrivono in positivo una casa piccola.'
  fr.a1.unit46.lesson04.teach.le_salon_est:
    title: Descrivere la grandezza di una stanza
    gloss: Il soggiorno è grande.
    note: '*Grand* descrive una stanza precisa, non tutta la casa; concorda con *le salon*, che è maschile.'
  fr.a1.unit46.lesson04.teach.la_cuisine_est:
    title: Descrivere la grandezza di un'altra stanza
    gloss: La cucina è piccola.
    note: 'Stesso schema di *grand* nella scheda precedente, con un''altra stanza: *la cuisine* è femminile, quindi *petite*.'
  fr.a1.unit46.lesson05.teach.appartement_a_lyon:
    title: Leggere un annuncio immobiliare
    gloss: 'Appartamento a Lione: una camera da letto, un soggiorno, una cucina e un bagno. C''è un balcone, ma non c''è il giardino. L''appartamento è piccolo ma accogliente.'
    note: Fai attenzione al numero di stanze, a ciò che c'è e a ciò che non c'è, e all'impressione generale che viene data.
    glosses:
      Appartement: appartamento
      chambre: la camera
      salon: il soggiorno
      cuisine: la cucina
      bains: il bagno
      balcon: balcone
      jardin: giardino
      petit: piccolo
      cosy: accogliente
  fr.a1.unit46.lesson06.teach.camille_salut_mathieu:
    title: Camille chiede dell'appartamento
    gloss: 'Camille: Ciao Mathieu, com''è il tuo nuovo appartamento a Lione?'
    note: '*Nouvel* è la forma di *nouveau* (nuovo) usata davanti a un nome maschile che inizia per vocale: *un nouvel appartement*.'
  fr.a1.unit46.lesson06.teach.mathieu_il_est:
    title: Mathieu lo descrive
    gloss: 'Mathieu: È piccolo ma accogliente. Ho una camera da letto, un soggiorno, una cucina e un bagno.'
    note: 'Corrisponde esattamente all''annuncio immobiliare letto prima: è proprio l''appartamento di Mathieu.'
  fr.a1.unit46.lesson06.teach.camille_tu_as:
    title: Camille chiede del balcone
    gloss: 'Camille: Hai un balcone?'
    note: Una domanda diretta con risposta sì/no, con *Tu as ... ?*
  fr.a1.unit46.lesson06.teach.mathieu_oui_j:
    title: Mathieu risponde
    gloss: 'Mathieu: Sì, ho un balcone, ma non il giardino.'
    note: 'Corrisponde ai dati dell''annuncio: c''è il balcone, non c''è il giardino.'
  fr.a1.unit46.lesson06.teach.balcon_est_masculin:
    title: Il genere di balcon
    gloss: '*Balcon* è maschile: un balcone, è piccolo.'
    note: '*Il* sostituisce un nome maschile come *balcon*, quindi anche l''aggettivo è maschile: *il est petit*.'
  fr.a1.unit46.lesson06.teach.camille_ca_a:
    title: Camille reagisce con calore
    gloss: 'Camille: Sembra carino! Passerò a trovarti presto.'
    note: '*Je passerai te voir* (passerò a trovarti) usa il futuro *passerai* più *te voir*, «vederti».'
  fr.a1.unit46.lesson06.teach.mathieu_super_tu:
    title: Mathieu le dà il benvenuto
    gloss: 'Mathieu: Perfetto, sei sempre la benvenuta.'
    note: '*Toujours la bienvenue* (sempre la benvenuta) è un modo caloroso per invitare qualcuno a tornare; *bienvenue* è femminile qui perché si riferisce a Camille.'
