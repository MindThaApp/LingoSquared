teaching:
  fr.a1.unit44.lesson01.teach.je_ne_me:
    title: Non sentirsi bene
    gloss: Non mi sento bene.
    note: '*Se sentir* è riflessivo (*je me sens*); *ne ... pas bien* è il modo generico e leggero per dire che qualcosa non va.'
  fr.a1.unit44.lesson01.teach.malade:
    title: Malato
    gloss: malato
    note: 'L''aggettivo di base, usato con *être*: *je suis malade*.'
    example_gloss: Sono malato.
  fr.a1.unit44.lesson01.teach.je_suis_malade:
    title: Essere malati
    gloss: Sono malato.
    note: '*Malade* indica uno stato più generale e più forte di *pas bien*.'
  fr.a1.unit44.lesson01.teach.mal_a_la:
    title: Mal di testa
    gloss: un mal di testa
    note: '*Mal à la tête* si usa con *avoir*: *j''ai mal à la tête*; *à la* perché *tête* è femminile.'
    example_gloss: Ho mal di testa.
  fr.a1.unit44.lesson01.teach.j_ai_mal:
    title: Avere mal di testa
    gloss: Ho mal di testa.
    note: 'I sintomi si usano con *avoir* (avere): *j''ai mal*.'
  fr.a1.unit44.lesson01.teach.mal_au_ventre:
    title: Mal di stomaco
    gloss: un mal di stomaco
    note: '*Mal au ventre*: *au* è *à* + *le* uniti, perché *ventre* è maschile.'
    example_gloss: Ho mal di stomaco.
  fr.a1.unit44.lesson01.teach.j_ai_mal_2:
    title: Avere mal di stomaco
    gloss: Ho mal di stomaco.
    note: Stesso schema con *avoir* di *mal à la tête*, con *au* al posto di *à la*.
  fr.a1.unit44.lesson02.teach.qu_est_ce:
    title: Chiedere in generale
    gloss: Che cos'hai?
    note: Un modo generico, valido in ogni situazione, per chiedere se c'è qualche problema.
  fr.a1.unit44.lesson02.teach.qu_est_ce_2:
    title: Un'espressione comune
    gloss: Che cos'hai?
    note: '*Qu''est-ce qui ne va pas ?* è una domanda fissa, letteralmente «che cosa non va»; non va tradotta parola per parola.'
  fr.a1.unit44.lesson02.teach.mal_a_la:
    title: Mal di gola
    gloss: un mal di gola
    note: '*Mal à la gorge* segue *mal à la tête*: *gorge* è femminile, quindi *à la*.'
    example_gloss: Ho mal di gola.
  fr.a1.unit44.lesson02.teach.j_ai_mal:
    title: Avere mal di gola
    gloss: Ho mal di gola.
    note: Segue lo stesso schema con *avoir* degli altri sintomi.
  fr.a1.unit44.lesson02.teach.ca_va_non:
    title: Chiedere a qualcuno come sta
    gloss: Stai bene? No, non mi sento bene.
    note: '*Ça va ?* è una domanda molto comune e informale per chiedere come va tra amici.'
  fr.a1.unit44.lesson03.teach.la_fievre:
    title: Febbre
    gloss: una febbre
    note: '*La fièvre* è femminile; dopo *avoir* prende *de la*: *j''ai de la fièvre*.'
    example_gloss: Ho la febbre.
  fr.a1.unit44.lesson03.teach.j_ai_de:
    title: Avere la febbre
    gloss: Ho la febbre.
    note: Segue lo schema con *avoir*, con il partitivo *de la*.
  fr.a1.unit44.lesson03.teach.le_rhume:
    title: Essere raffreddato
    gloss: raffreddato / avere il raffreddore
    note: '*Le rhume* è un nome maschile usato con *avoir*, non un aggettivo usato con *être*.'
    example_gloss: Ho il raffreddore.
  fr.a1.unit44.lesson03.teach.j_ai_un:
    title: Dire che hai il raffreddore
    gloss: Ho il raffreddore.
    note: In francese si dice *j'ai un rhume* («ho un raffreddore»); non si dice *je suis rhume*.
  fr.a1.unit44.lesson03.teach.malade_se_dit:
    title: Être o avoir?
    gloss: '*Malade* è un aggettivo e si usa con *être*: sono malato. *Mal*, *fièvre* e *rhume* sono nomi e si usano con *avoir*: ho il raffreddore.'
    note: 'La scelta tra *être* e *avoir* dipende dal tipo di parola: un aggettivo come *malade* va con *être*, un nome come *fièvre* va con *avoir*, per quanto breve sia la malattia.'
  fr.a1.unit44.lesson04.teach.la_pharmacie:
    title: La farmacia
    gloss: la farmacia
    note: '*Pharmacie* è femminile: *la pharmacie*.'
    example_gloss: Vado in farmacia.
  fr.a1.unit44.lesson04.teach.je_peux_vous:
    title: Il saluto del farmacista
    gloss: Come posso aiutarla?
    note: '*Je peux vous aider ?* è un saluto di servizio formale molto comune; *vous* è la forma di cortesia.'
  fr.a1.unit44.lesson04.teach.avez_vous_quelque:
    title: Chiedere qualcosa per un sintomo
    gloss: Ha qualcosa per il mal di testa?
    note: '*Quelque chose contre* + sintomo è il modo naturale di chiedere un rimedio.'
  fr.a1.unit44.lesson04.teach.un_comprime:
    title: Una pastiglia
    gloss: una pastiglia / compressa
    note: '*Comprimé* è maschile: *un comprimé*.'
    example_gloss: Prendo una pastiglia.
  fr.a1.unit44.lesson04.teach.prenez_un_comprime:
    title: Istruzioni per la dose
    gloss: Prendi una pastiglia due volte al giorno.
    note: '*Prenez* è l''imperativo con *vous* di *prendre* (prendere), usato per le istruzioni.'
  fr.a1.unit44.lesson04.teach.a_la_pharmacie:
    title: Il registro in farmacia
    gloss: In farmacia si usa la forma di cortesia *vous*.
    note: Il farmacista è un adulto sconosciuto che offre un servizio, quindi si dice *vous*, come allo sportello dei biglietti.
  fr.a1.unit44.lesson05.teach.conseil_prends_un:
    title: Leggi un consiglio della farmacia
    gloss: 'Consiglio: prendi una pastiglia due volte al giorno con acqua. Riposa bene e bevi molta acqua. Dopo tre giorni continui a non sentirti bene? Allora vai dal medico.'
    note: Individua la posologia, i due consigli che non riguardano il farmaco e quando andare dal medico.
    glosses:
      Conseil: consiglio
      prends: prendi
      fois: volte
      jour: giorno
      comprimé: pastiglia
      Repose-toi: riposa
      bois: bevi
      sens: sentirsi
      toujours: ancora
      bien: bene
      médecin: medico
  fr.a1.unit44.lesson06.teach.camille_salut_mathieu:
    title: Camille chiede come va
    gloss: 'Camille: Ciao Mathieu, come va? Ti senti già meglio?'
    note: '*Déjà* (già) mostra che Camille vuole sapere se Mathieu sta meglio dall''ultima volta che si sono sentiti.'
  fr.a1.unit44.lesson06.teach.mathieu_pas_encore:
    title: Mathieu non sta ancora bene
    gloss: 'Mathieu: Non ancora molto bene. Ho ancora mal di testa e sono stanco.'
    note: '*Toujours* (ancora) indica che il mal di testa non è passato; *fatigué* (stanco) è un aggettivo nuovo e utile.'
  fr.a1.unit44.lesson06.teach.camille_tu_as:
    title: Camille chiede della medicina
    gloss: 'Camille: Hai preso una compressa?'
    note: '*Pris* è il participio passato di *prendre*, usato con *as*, da *avoir*: *tu as pris*.'
  fr.a1.unit44.lesson06.teach.mathieu_oui_j:
    title: Mathieu conferma
    gloss: 'Mathieu: Sì, ho preso una compressa. Adesso vado a riposarmi.'
    note: '*Je vais me reposer* (vado a riposarmi) usa *aller* + infinito per il futuro prossimo.'
  fr.a1.unit44.lesson06.teach.camille_bonne_idee:
    title: Camille gli augura di stare meglio
    gloss: 'Camille: Buona idea. Riposati bene. Buona guarigione!'
    note: '*Bon rétablissement !* è l''espressione fissa abituale per augurare a qualcuno una pronta guarigione.'
  fr.a1.unit44.lesson06.teach.mathieu_merci_a:
    title: Mathieu saluta
    gloss: 'Mathieu: Grazie, a domani!'
    note: '*À demain !* usa *à* + un momento nei saluti di congedo: *à demain*, *à bientôt*.'
