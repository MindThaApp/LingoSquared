answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francese A1
  description: Proporre, accettare, rifiutare e organizzare un semplice programma, proseguendo la storia del laboratorio di cucina di Inès e Mathieu, che si mettono d'accordo per fare insieme la spesa per gli ingredienti prima della sessione di sabato. In francese *se retrouver* (incontrarsi) è un verbo pronominale reciproco, e *vers* + ora indica un orario approssimativo, non esatto.
units:
  fr.a1.unit11.plans:
    title: Quando ci vediamo?
lessons:
  fr.a1.unit11.lesson01.vocabulaire_projets:
    title: Proporre un orario
  fr.a1.unit11.lesson02.accepter_refuser:
    title: Accettare o rifiutare
  fr.a1.unit11.lesson03.dialogue_projet_courses:
    title: Organizzare la spesa
teaching:
  fr.a1.unit11.lesson01.teach.libre:
    title: Libero / disponibile
    gloss: libero / disponibile
    note: Qui *libre* descrive la disponibilità di una persona; per ciò che non costa nulla il francese usa *gratuit*.
    example_gloss: Sei libero sabato?
  fr.a1.unit11.lesson01.teach.occupe:
    title: Occupato
    gloss: occupato / impegnato
    note: 'Il contrario diretto di *libre*. Concorda in genere: *occupé* / *occupée*.'
    example_gloss: Venerdì sera sono impegnato.
  fr.a1.unit11.lesson01.teach.se_retrouver:
    title: Incontrarsi
    gloss: incontrarsi / ritrovarsi
    note: In questo senso *se retrouver* è reciproco (due o più persone che si incontrano), a differenza di *trouver* (trovare).
    example_gloss: Dove ci incontriamo stasera?
  fr.a1.unit11.lesson01.teach.vers:
    title: Verso (un'ora)
    gloss: verso / intorno a (un'ora)
    note: '*Vers* + un''ora indica un orario approssimativo, più morbido di un''ora precisa.'
    example_gloss: Passo verso le sette.
  fr.a1.unit11.lesson01.teach.ca_te_dit_de:
    title: Ti va di... ?
    gloss: Ti va di fare la spesa insieme?
    note: '*Ça te dit de... ?* + infinito è un modo comune e informale per proporre un''attività, più rilassato di *Voulez-vous... ?*'
  fr.a1.unit11.lesson01.teach.venir_chercher:
    title: Passare a prendere (qualcuno)
    gloss: Vieni a prendermi verso le 18?
    note: '*Venir chercher quelqu''un* significa passare a prendere qualcuno, non semplicemente «cercare».'
  fr.a1.unit11.lesson01.teach.daccord_a_tout_a_lheure:
    title: D'accordo, a presto
    gloss: Va bene, a più tardi!
    note: '*D''accord* (va bene) conferma un programma; *à tout à l''heure* si usa per rivedere qualcuno più tardi nella stessa giornata.'
  fr.a1.unit11.lesson02.teach.je_ne_peux_pas:
    title: Rifiutare un programma
    gloss: Non posso, sono impegnato.
    note: '*Je ne peux pas* (non posso) + un motivo è un modo semplice e cortese per rifiutare.'
  fr.a1.unit11.lesson02.teach.avec_plaisir:
    title: Accettare con entusiasmo
    gloss: Con piacere!
    note: '*Avec plaisir* (letteralmente «con piacere») è un modo caloroso ed entusiasta di accettare un invito.'
  fr.a1.unit11.lesson02.teach.a_quelle_heure_on_se_voit:
    title: Chiedere l'ora
    gloss: A che ora ci vediamo?
    note: '*On se voit* (informale, «ci vediamo») è un''alternativa comune e informale a *se retrouver* per darsi appuntamento.'
  fr.a1.unit11.lesson02.teach.devant_le_marche:
    title: Proporre un luogo
    gloss: Davanti al mercato, ti va bene?
    note: '*Ça te va ?* (ti va bene?) serve a chiedere all''altro se un dettaglio proposto gli sta bene.'
  fr.a1.unit11.lesson02.teach.parfait_alors:
    title: Confermare il programma
    gloss: Perfetto, allora a venerdì!
    note: Qui *alors* significa «allora» nel senso di confermare un accordo, e chiude lo scambio di organizzazione.
  fr.a1.unit11.lesson03.teach.line01:
    title: Proporre di fare la spesa insieme
    gloss: Inès chiede a Mathieu se ha voglia di fare la spesa insieme prima del laboratorio.
    note: '*Ça te dit de... ?* apre lo scambio con un suggerimento informale.'
  fr.a1.unit11.lesson03.teach.line02:
    title: Accettare e chiedere dove
    gloss: Mathieu risponde con piacere e chiede dove si incontrano.
    note: Unisce *Avec plaisir* (con piacere) a *se retrouver* (incontrarsi).
  fr.a1.unit11.lesson03.teach.line03:
    title: Proporre luogo e giorno
    gloss: Inès propone davanti al mercato, venerdì sera.
    note: Una breve proposta che unisce il luogo (*devant le marché*) e il giorno (*vendredi soir*).
  fr.a1.unit11.lesson03.teach.line04:
    title: Accettare e chiedere l'ora
    gloss: Mathieu è d'accordo e chiede a che ora.
    note: '*D''accord* conferma luogo e giorno; la domanda successiva serve a precisare l''ora.'
  fr.a1.unit11.lesson03.teach.line05:
    title: Proporre un'ora precisa
    gloss: Inès chiede a Mathieu se passa a prenderla verso le 18.
    note: Usa *venir chercher* + *vers* con un'ora precisa.
  fr.a1.unit11.lesson03.teach.line06:
    title: Confermare tutto
    gloss: Mathieu dice perfetto, allora a venerdì, alle 18 davanti al mercato.
    note: Riprende insieme i tre dettagli del programma (giorno, ora, luogo) per chiudere chiaramente lo scambio.
