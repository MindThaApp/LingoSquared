  fr.a1.unit06.lesson01.moments_de_la_journee:
    title: Le parti della giornata
  fr.a1.unit06.lesson02.dire_lheure:
    title: Dire l'ora
  fr.a1.unit06.lesson03.dialogue_prochain_atelier:
    title: Il prossimo laboratorio
teaching:
  fr.a1.unit06.lesson01.teach.heure:
    title: L'ora
    gloss: l'ora
    note: '*Heure* è femminile; è anche l''unità usata per dire l''ora (*dix heures* = le dieci).'
    example_gloss: Che ore sono?
  fr.a1.unit06.lesson01.teach.matin:
    title: La mattina
    gloss: la mattina
    note: '*Matin* è maschile.'
    example_gloss: Il mercato è aperto la mattina.
  fr.a1.unit06.lesson01.teach.apres_midi:
    title: Il pomeriggio
    gloss: il pomeriggio
    note: '*Après-midi* può essere maschile o femminile (il maschile è più comune); *l''* si elide davanti al suo suono vocalico.'
    example_gloss: Lavoro il pomeriggio.
  fr.a1.unit06.lesson01.teach.soir:
    title: La sera
    gloss: la sera
    note: '*Soir* è maschile.'
    example_gloss: Il laboratorio di cucina è la sera.
  fr.a1.unit06.lesson01.teach.midi:
    title: Mezzogiorno
    gloss: mezzogiorno
    note: '*Midi* non vuole l''articolo quando indica l''ora (*à midi*, non *au midi*).'
    example_gloss: Mangiamo a mezzogiorno.
  fr.a1.unit06.lesson01.teach.minuit:
    title: Mezzanotte
    gloss: mezzanotte
    note: '*Minuit* segue la stessa regola di *midi*: niente articolo.'
    example_gloss: Il laboratorio non finisce mai dopo mezzanotte.
  fr.a1.unit06.lesson01.teach.latelier_commence_le_soir:
    title: Dire quando si tiene il laboratorio
    gloss: Il laboratorio inizia la sera, non la mattina.
    note: Mette a confronto *le soir* e *le matin*, riprendendo due nomi del lessico di questa lezione.
  fr.a1.unit06.lesson02.teach.quelle_heure_est_il:
    title: Chiedere l'ora
    gloss: Che ore sono?
    note: '*Quelle heure est-il ?* è il modo standard, adatto a ogni situazione, per chiedere l''ora; *-il* è invertito dopo il verbo e segnala la domanda.'
  fr.a1.unit06.lesson02.teach.il_est_dix_heures:
    title: Dire l'ora esatta
    gloss: Sono le dieci.
    note: '*Il est* + numero + *heures* è la struttura base per dire qualsiasi ora; *heures* resta plurale tranne in *une heure* (l''una).'
  fr.a1.unit06.lesson02.teach.et_quart:
    title: Dire «e un quarto»
    gloss: Sono le dieci e un quarto.
    note: '*Et quart* (e un quarto) aggiunge quindici minuti all''ora indicata.'
  fr.a1.unit06.lesson02.teach.et_demie:
    title: Dire «e mezza»
    gloss: Sono le dieci e mezza.
    note: '*Et demie* (e mezza) aggiunge trenta minuti; *demie* prende la -e del femminile perché concorda con *heure*.'
  fr.a1.unit06.lesson02.teach.moins_le_quart:
    title: Dire «meno un quarto»
    gloss: Sono le undici meno un quarto.
    note: '*Moins le quart* (meno il quarto) si conta all''indietro a partire dall''ora SUCCESSIVA, non da quella in corso: in italiano è lo stesso (le undici meno un quarto), quindi fai attenzione a dire l''ora giusta.'
  fr.a1.unit06.lesson02.teach.a_quelle_heure:
    title: Chiedere a che ora inizia qualcosa
    gloss: A che ora inizia il laboratorio?
    note: '*À quelle heure ?* (a che ora) si usa per chiedere di un evento in programma, diversamente dalla domanda generale *Quelle heure est-il ?*.'
  fr.a1.unit06.lesson03.teach.line01:
    title: Chiedere l'ora d'inizio della prossima settimana
    gloss: Inès chiede a che ora è il laboratorio della prossima settimana.
    note: '*La semaine prochaine* (la settimana prossima) si combina con la domanda *à quelle heure* di questa lezione.'
  fr.a1.unit06.lesson03.teach.line02:
    title: Dire l'ora d'inizio
    gloss: Mathieu dice che inizia alle diciotto e trenta (le 18:30), credo.
    note: '*Dix-huit heures trente* usa le 24 ore, comuni in francese quando si parla di orari, diversamente dalle forme colloquiali con *et demie*.'
  fr.a1.unit06.lesson03.teach.line03:
    title: Confermare che è la sera
    gloss: 'Inès verifica: la sera, non la mattina?'
    note: Una breve domanda di conferma che mette a confronto *le soir* e *le matin*.
  fr.a1.unit06.lesson03.teach.line04:
    title: Confermare e spiegare il motivo
    gloss: Mathieu conferma che è la sera, più comodo dopo il lavoro.
    note: '*Après le travail* (dopo il lavoro) dà una semplice ragione pratica.'
  fr.a1.unit06.lesson03.teach.line05:
    title: Chiedere l'ora di fine
    gloss: Inès chiede a che ora finisce.
    note: '*Finit* (finisce) si contrappone direttamente a *commence* (inizia) della battuta 2.'
  fr.a1.unit06.lesson03.teach.line06:
    title: Dire l'ora di fine
    gloss: Mathieu dice verso le venti e quindici (le 20:15), come al solito.
    note: '*Vers* (verso, circa) indica un''ora approssimativa, più vaga del preciso *à*.'
  fr.a1.unit06.lesson03.teach.line07:
    title: Confermare il programma
    gloss: 'Inès conferma: a la settimana prossima, alle diciotto e trenta!'
    note: Chiude lo scambio ripetendo l'ora concordata, un modo naturale per confermare un programma in francese.
