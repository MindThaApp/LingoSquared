course:
  title: Francese A1
  description: Le parti della giornata e come dire l'ora (heure(s), et quart, et demie, moins le quart), proseguendo la storia del laboratorio di cucina di Inès e Mathieu con l'organizzazione del loro prossimo incontro. Si sottolinea che il francese, nei contesti formali e per gli orari, usa le 24 ore (dix-huit heures trente), accanto alle forme più colloquiali con le 12 ore già viste nell'unità.
units:
  fr.a1.unit06.time:
    title: Che ore sono?
