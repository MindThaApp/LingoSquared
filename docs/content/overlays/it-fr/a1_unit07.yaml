  fr.a1.unit07.lesson03.dialogue_chercher_pharmacie:
    title: Alla ricerca della farmacia
teaching:
  fr.a1.unit07.lesson01.teach.gare:
    title: La stazione
    gloss: la stazione
    note: '*Gare* è femminile.'
    example_gloss: La stazione è grande.
  fr.a1.unit07.lesson01.teach.pharmacie:
    title: La farmacia
    gloss: la farmacia
    note: '*Pharmacie* è femminile.'
    example_gloss: La farmacia apre alle nove.
  fr.a1.unit07.lesson01.teach.banque:
    title: La banca
    gloss: la banca
    note: '*Banque* è femminile.'
    example_gloss: La banca è chiusa la domenica.
  fr.a1.unit07.lesson01.teach.ecole:
    title: La scuola
    gloss: la scuola
    note: '*École* è femminile; *l''* si elide davanti alla vocale iniziale.'
    example_gloss: La scuola è accanto al parco.
  fr.a1.unit07.lesson01.teach.cafe:
    title: Il bar
    gloss: il bar
    note: '*Café* è maschile; in altri contesti significa anche «caffè».'
    example_gloss: Il bar è aperto tutto il giorno.
  fr.a1.unit07.lesson01.teach.poste:
    title: L'ufficio postale
    gloss: l'ufficio postale
    note: '*Poste* (femminile) qui significa «ufficio postale»; *le poste* (maschile, con un altro significato) può indicare «il posto/l''impiego»: il genere cambia il significato.'
    example_gloss: L'ufficio postale chiude alle sei.
  fr.a1.unit07.lesson01.teach.la_gare_est_grande:
    title: Confrontare due luoghi
    gloss: La stazione è grande e la farmacia è piccola.
    note: '*Grande* e *petite* concordano entrambi con nomi femminili (*la gare*, *la pharmacie*).'
  fr.a1.unit07.lesson02.teach.ou_est_la_gare:
    title: Chiedere dove si trova un luogo
    gloss: Dov'è la stazione, per favore?
    note: '*Où est... ?* è il modo standard e universale per chiedere dove si trova un luogo.'
  fr.a1.unit07.lesson02.teach.en_face_de:
    title: Dire che qualcosa è di fronte a
    gloss: La banca è di fronte alla stazione.
    note: '*En face de* («di fronte a») termina in *de*, seguito dal luogo di riferimento: *en face de la banque*. Davanti a un nome maschile si contrae: *en face du café*.'
  fr.a1.unit07.lesson02.teach.a_cote_de:
    title: Dire che qualcosa è accanto a
    gloss: La farmacia è accanto alla banca.
    note: '*À côté de* («accanto a») segue lo stesso schema con *de* di *en face de*.'
  fr.a1.unit07.lesson02.teach.pres_de:
    title: Dire che qualcosa è vicino
    gloss: La scuola è vicino a qui.
    note: '*Près de* («vicino a») diventa *près d''* davanti a un suono vocalico, come in *près d''ici* («qui vicino»).'
  fr.a1.unit07.lesson02.teach.loin_de:
    title: Dire che qualcosa è lontano
    gloss: L'ufficio postale è lontano da qui.
    note: '*Loin de* («lontano da») è l''esatto contrario di *près de*.'
  fr.a1.unit07.lesson02.teach.cest_loin:
    title: Chiedere se qualcosa è lontano
    gloss: È lontano da qui? — No, non è lontano.
    note: '*C''est loin d''ici ?* è la domanda naturale da fare dopo aver ricevuto un''indicazione. Per rispondere di no, metti *ne... pas* attorno al verbo: *ce n''est pas loin* («non è lontano»).'
  fr.a1.unit07.lesson03.teach.line01:
    title: Chiedere indicazioni a uno sconosciuto
    gloss: Mathieu chiede gentilmente a un passante dove sia la farmacia.
    note: '*Excusez-moi* («mi scusi») è la formula di cortesia standard per rivolgersi a uno sconosciuto, insieme a *vous*.'
  fr.a1.unit07.lesson03.teach.line02:
    title: Indicare il luogo
    gloss: Lei dice che è di fronte alla banca, accanto al bar.
    note: Unisce *en face de* e *à côté de* in una sola frase per dare un'indicazione precisa. *De* + *le café* si contrae in *du café*.
  fr.a1.unit07.lesson03.teach.line03:
    title: Chiedere se è lontano
    gloss: Mathieu chiede se è lontano da qui.
    note: È la stessa *C'est loin d'ici ?* che hai imparato per chiedere la distanza.
  fr.a1.unit07.lesson03.teach.line04:
    title: Rassicurare che è vicino
    gloss: 'Lei risponde di no, è vicinissimo: cinque minuti a piedi.'
    note: '*À pied* («a piedi») è il modo standard per indicare che si va camminando.'
  fr.a1.unit07.lesson03.teach.line05:
    title: Ringraziarla
    gloss: Mathieu la ringrazia con calore.
    note: '*Merci beaucoup* rafforza il semplice *merci* già incontrato nelle unità precedenti.'
  fr.a1.unit07.lesson03.teach.line06:
    title: Rispondere a un ringraziamento
    gloss: 'Lei risponde: «Prego».'
    note: '*Je vous en prie* è un «prego» più formale, in linea con il registro del *vous* usato con uno sconosciuto; *De rien* è un''alternativa meno formale e di uso quotidiano.'
