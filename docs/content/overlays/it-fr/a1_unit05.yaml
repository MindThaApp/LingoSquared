  fr.a1.unit05.lesson01.a_table:
    title: A tavola
  fr.a1.unit05.lesson02.au_cafe:
    title: Al bar
  fr.a1.unit05.lesson03.dialogue_cafe:
    title: Al bar dopo il laboratorio
teaching:
  fr.a1.unit05.lesson01.teach.poulet:
    title: Il pollo
    gloss: pollo
    note: '*Poulet* è maschile.'
    example_gloss: Vorrei del pollo.
  fr.a1.unit05.lesson01.teach.poisson:
    title: Il pesce
    gloss: pesce
    note: '*Poisson* è maschile.'
    example_gloss: Oggi il pesce è fresco.
  fr.a1.unit05.lesson01.teach.salade:
    title: L'insalata
    gloss: insalata
    note: '*Salade* è femminile.'
    example_gloss: Sta mangiando un'insalata.
  fr.a1.unit05.lesson01.teach.riz:
    title: Il riso
    gloss: riso
    note: '*Riz* è maschile e invariabile (si scrive allo stesso modo al singolare e al plurale, come *prix*).'
    example_gloss: Il riso si abbina bene al pollo.
  fr.a1.unit05.lesson01.teach.eau:
    title: L'acqua
    gloss: acqua
    note: '*Eau* è femminile; *l''* si elide davanti al suo suono vocalico, come *l''addition* più avanti in questa unità.'
    example_gloss: Vorrei dell'acqua, per favore.
  fr.a1.unit05.lesson01.teach.vin:
    title: Il vino
    gloss: vino
    note: '*Vin* è maschile.'
    example_gloss: Il vino rosso è delizioso.
  fr.a1.unit05.lesson01.teach.je_voudrais_poulet_salade:
    title: Ordinare pollo e insalata
    gloss: Vorrei del pollo e dell'insalata.
    note: '*Du poulet* (maschile) e *de la salade* (femminile) sono articoli partitivi («del», «della») che concordano con il genere del nome, a differenza di ciò che accade dopo una quantità (*un kilo de*), dove si usa soltanto *de*.'
  fr.a1.unit05.lesson02.teach.dessert:
    title: Dessert
    gloss: dolce
    note: '*Dessert* è maschile.'
    example_gloss: Oggi il dessert è offerto.
  fr.a1.unit05.lesson02.teach.addition:
    title: Il conto
    gloss: il conto
    note: '*Addition* è femminile; *l''* si elide davanti al suo suono vocalico. È il termine standard al ristorante in francese, non *facture* (una fattura formale).'
    example_gloss: Il conto, per favore.
  fr.a1.unit05.lesson02.teach.vous_avez_choisi:
    title: Chiedere se si è pronti a ordinare
    gloss: Avete deciso?
    note: La domanda tipica del cameriere quando si avvicina al tavolo per prendere l'ordinazione, con il passé composé di *choisir* (scegliere).
  fr.a1.unit05.lesson02.teach.je_voudrais_un_cafe:
    title: Ordinare un caffè
    gloss: Vorrei un caffè, per favore.
    note: '*Je voudrais* + oggetto, la stessa struttura usata per gli acquisti, ora per cibo e bevande.'
  fr.a1.unit05.lesson02.teach.qcq_comme_dessert:
    title: Chiedere cosa c'è
    gloss: Cosa avete come dessert?
    note: '*Qu''est-ce que vous avez comme...?* è un modo naturale e molto usato per chiedere quali opzioni ci sono in una categoria.'
  fr.a1.unit05.lesson02.teach.cest_delicieux:
    title: Dire che qualcosa è delizioso
    gloss: È delizioso!
    note: Una reazione entusiasta e comune davanti al cibo; qui *délicieux* resta al maschile singolare perché *c'est* non si riferisce a un nome preciso.
  fr.a1.unit05.lesson03.teach.line01:
    title: Salutare e chiedere se si è pronti a ordinare
    gloss: Il cameriere li saluta e chiede se sono pronti a ordinare.
    note: Si apre con *Bonjour*, il registro cortese negli scambi di servizio.
  fr.a1.unit05.lesson03.teach.line02:
    title: Ordinare insalata e acqua
    gloss: Inès ordina un'insalata e dell'acqua.
    note: Unisce *je voudrais* e *et* per collegare due cose ordinate nella stessa battuta.
  fr.a1.unit05.lesson03.teach.line03:
    title: Ordinare pollo con riso
    gloss: Mathieu ordina pollo con riso.
    note: '*Avec* (con) collega il piatto principale al contorno: una costruzione semplice e comune per ordinare.'
  fr.a1.unit05.lesson03.teach.line04:
    title: Confermare e chiedere le bevande
    gloss: Il cameriere conferma e chiede che cosa vogliono da bere.
    note: '*Et comme boisson pour vous ?* riprende lo schema con *comme* di *Qu''est-ce que vous avez comme dessert ?*, ora per le bevande.'
  fr.a1.unit05.lesson03.teach.line05:
    title: Ordinare un bicchiere di vino
    gloss: Mathieu ordina un bicchiere di vino rosso.
    note: '*Un verre de* (un bicchiere di) è il modo standard per ordinare il vino al bicchiere.'
  fr.a1.unit05.lesson03.teach.line06:
    title: Commentare il cibo
    gloss: Inès dice che l'insalata è deliziosa.
    note: Riprende *C'est délicieux !*, ora riferito a un piatto preciso (*cette salade*). *Délicieux* resta maschile dopo *c'est* anche se *salade* è femminile; *Elle est délicieuse, cette salade !* è l'alternativa con l'accordo.
  fr.a1.unit05.lesson03.teach.line07:
    title: Spiegare la fame e chiedere il conto
    gloss: Mathieu dice che il laboratorio ha fatto venire loro fame e chiede il conto.
    note: '*Nous a donné faim* (letteralmente «ci ha dato fame») è il modo naturale in francese per dire che qualcosa ti ha fatto venire fame.'
  fr.a1.unit05.lesson03.teach.line08:
    title: Confermare che il conto sta arrivando
    gloss: Il cameriere conferma che lo porta subito.
    note: '*Tout de suite* (subito) è una formula rassicurante e comune negli scambi di servizio.'
