teaching:
  fr.a1.unit43.lesson01.teach.le_billet:
    title: Il biglietto
    gloss: il biglietto
    note: '*Billet* è maschile: *le billet*, *un billet*.'
    example_gloss: Vorrei un biglietto per Lione.
  fr.a1.unit43.lesson01.teach.je_voudrais_un:
    title: Chiedere un biglietto
    gloss: Vorrei un biglietto per Lione.
    note: '*Je voudrais* attenua la richiesta; è più cortese di *je veux*.'
  fr.a1.unit43.lesson01.teach.voulez_vous_un:
    title: L'addetto chiede che tipo di biglietto
    gloss: Desidera un biglietto di sola andata o di andata e ritorno?
    note: '*Voulez-vous* è la forma di cortesia con *vous* di *vouloir*, usata qui con un impiegato della stazione che non conosci.'
  fr.a1.unit43.lesson01.teach.un_aller_retour:
    title: Rispondere con cortesia
    gloss: Andata e ritorno, per favore.
    note: '*S''il vous plaît* è il «per favore» formale, in linea con il registro con *vous* dello scambio.'
  fr.a1.unit43.lesson01.teach.au_guichet_on:
    title: Il registro allo sportello
    gloss: Allo sportello di solito si usa la forma di cortesia *vous*.
    note: A chi svolge un servizio e non conosci si dà del *vous*; ad amici e familiari si dà del *tu*.
  fr.a1.unit43.lesson02.teach.le_quai:
    title: Il binario
    gloss: il binario
    note: '*Quai* è maschile: *le quai*.'
    example_gloss: Da quale binario parte il treno per Lione?
  fr.a1.unit43.lesson02.teach.de_quel_quai:
    title: Chiedere quale binario
    gloss: Da quale binario parte il treno per Lione?
    note: '*De quel quai* chiede specificamente il binario; *quel* concorda con il nome maschile *quai*.'
  fr.a1.unit43.lesson02.teach.le_train_part:
    title: Indicare i dettagli della partenza
    gloss: Il treno parte alle dieci meno un quarto dal binario cinque.
    note: '*Dix heures moins le quart* significa «le dieci meno un quarto»: anche l''italiano dice «meno» per le ore che precedono l''ora piena, e il francese usa *moins* allo stesso modo.'
  fr.a1.unit43.lesson02.teach.a_quelle_heure:
    title: Chiedere l'orario di arrivo
    gloss: A che ora arriva il treno?
    note: '*À quelle heure arrive ... ?* chiede l''ora; *arriver* è un normale verbo in *-er*: *le train arrive*.'
  fr.a1.unit43.lesson02.teach.le_train_arrive:
    title: Indicare l'orario di arrivo
    gloss: Il treno arriva alle undici.
    note: '*Arrive* è la forma di *il/elle* di *arriver*; i verbi in *-er* terminano in *-e* con *il* e *elle*.'
  fr.a1.unit43.lesson03.teach.a_l_heure:
    title: In orario / il ritardo
    gloss: in orario; il ritardo
    note: '*À l''heure* è un''espressione fissa per ciò che avviene in orario. *Le retard* («il ritardo») è maschile.'
    example_gloss:
    - Il treno non parte in orario.
    - 'Attenzione: il treno per Lione è in ritardo.'
  fr.a1.unit43.lesson03.teach.attention_le_train:
    title: Un annuncio
    gloss: 'Attenzione: il treno per Lione è in ritardo.'
    note: '*Attention* apre un annuncio in stazione, come l''italiano «Attenzione, viaggiatori».'
  fr.a1.unit43.lesson03.teach.le_train_ne:
    title: Negare «in orario»
    gloss: Il treno non parte in orario.
    note: '*Ne ... pas* circonda il verbo: *ne part pas à l''heure*.'
  fr.a1.unit43.lesson03.teach.le_train_part:
    title: Un cambio di binario
    gloss: Il treno parte dal binario tre invece che dal binario cinque.
    note: '*Au lieu du* significa «al posto del»; *de* + *le* si fonde in *du*.'
  fr.a1.unit43.lesson03.teach.le_train_a:
    title: Indicare la durata del ritardo
    gloss: Il treno ha dieci minuti di ritardo.
    note: '*A ... de retard* (letteralmente «ha ... di ritardo») è il modo naturale per dire che qualcosa è in ritardo; in francese si usa *avoir*.'
  fr.a1.unit43.lesson04.teach.l_entree_la:
    title: Ingresso, uscita, sala d'attesa
    gloss: l'ingresso; l'uscita; la sala d'attesa
    note: '*L''entrée* perde la *e* dell''articolo davanti a vocale (*l''*); *la sortie* e *la salle d''attente* sono femminili.'
    example_gloss:
    - Dov'è l'ingresso?
    - Dov'è l'uscita?
    - Dov'è la sala d'attesa?
  fr.a1.unit43.lesson04.teach.ou_est_le:
    title: Chiedere dov'è un binario
    gloss: Dov'è il binario sette?
    note: '*Où est ... ?* chiede dove si trova qualcosa; *le quai sept* è maschile.'
  fr.a1.unit43.lesson04.teach.tout_droit_puis:
    title: Dare indicazioni
    gloss: Dritto e poi a destra.
    note: '*Tout droit* e *à droite* sono le parole per le direzioni; *à* va davanti a *droite*.'
  fr.a1.unit43.lesson04.teach.ou_est_la:
    title: Chiedere della sala d'attesa
    gloss: Dov'è la sala d'attesa?
    note: Lo stesso schema di domanda applicato a un nuovo luogo.
  fr.a1.unit43.lesson05.teach.billet_paris_gare:
    title: Leggere un biglietto stampato
    gloss: 'Biglietto: Parigi Gare de Lyon – Lione Part-Dieu. Partenza: dieci e dieci, binario sette. Arrivo: le undici meno dieci. Andata e ritorno. Prezzo: dodici euro e quaranta.'
    note: Individua l'orario di partenza e il binario, l'orario di arrivo, il tipo di biglietto e il prezzo.
    glosses:
      Billet: biglietto
      Départ: partenza
      dix: dieci
      quai: binario
      sept: sette
      Arrivée: arrivo
      onze: undici
      Aller-retour: biglietto di andata e ritorno
      Prix: prezzo
      douze: dodici
      euros: euro
      quarante: quaranta
  fr.a1.unit43.lesson06.teach.mathieu_on_doit:
    title: Mathieu espone il piano
    gloss: 'Mathieu: Dobbiamo andare al binario sette. Il treno parte alle dieci e dieci.'
    note: '*On doit* (da *devoir*) esprime qui una necessità pratica, non un obbligo rigido.'
  fr.a1.unit43.lesson06.teach.camille_regarde_voila:
    title: Camille legge il cartello
    gloss: 'Camille: Guarda, ecco il cartello: ritardo, dieci minuti.'
    note: '*Voilà* indica ciò che c''è: *voilà le panneau*.'
  fr.a1.unit43.lesson06.teach.mathieu_pas_de:
    title: Mathieu resta calmo
    gloss: 'Mathieu: Nessun problema, abbiamo ancora il tempo di prendere un caffè.'
    note: '*Pas de problème* è una rassicurazione comune e informale.'
  fr.a1.unit43.lesson06.teach.camille_bonne_idee:
    title: Arriva il treno
    gloss: 'Camille: Bella idea. Oh, ecco già il treno. Binario sette, puntuale!'
    note: '*Déjà* («già») indica che il treno è arrivato prima del previsto, visto il ritardo appena annunciato.'
  fr.a1.unit43.lesson06.teach.mathieu_allez_on:
    title: Salgono sul treno
    gloss: 'Mathieu: Dai, saliamo. Lione, stiamo arrivando!'
    note: '*On* è un *noi* di uso quotidiano, con il verbo alla forma di *il*: *on monte*. *On arrive !* è il modo naturale per dire «eccoci!»; una traduzione parola per parola suonerebbe strana.'
