course:
  title: Francese A1
  description: 'Fare un breve resoconto di un evento recente e concluso con il passé composé, usando sia l''ausiliare avoir sia l''ausiliare être, e proseguendo il racconto del laboratorio di cucina di Inès e Mathieu: Mathieu racconta un imprevisto della sessione di sabato scorso. Come in italiano, il francese ha due ausiliari: avoir per la maggior parte dei verbi, être per un piccolo gruppo di verbi (tra cui aller, arriver, rester). Con être il participio concorda con il soggetto, come in arrivé/arrivée.'
units:
  fr.a1.unit12.past_events:
    title: Che cosa è successo?
lessons:
  fr.a1.unit12.lesson01.passe_compose_avoir:
    title: Il passé composé con avoir
  fr.a1.unit12.lesson02.passe_compose_etre:
    title: Il passé composé con être
  fr.a1.unit12.lesson03.dialogue_atelier_dernier:
    title: Il laboratorio di sabato scorso
teaching:
  fr.a1.unit12.lesson01.teach.jai_prepare:
    title: Ho preparato
    gloss: ho preparato
    note: 'I verbi regolari in -ER formano il participio del passé composé in *-é*: *préparer* → *préparé*, con l''ausiliare *avoir*.'
    example_gloss: Ho preparato una torta per il laboratorio.
  fr.a1.unit12.lesson01.teach.jai_achete:
    title: ho comprato
    gloss: ho comprato
    note: '*Acheter* segue lo stesso schema di *préparer*: *avoir* + *-é*.'
    example_gloss: Ho comprato delle verdure al mercato.
  fr.a1.unit12.lesson01.teach.jai_oublie:
    title: ho dimenticato
    gloss: ho dimenticato
    note: '*Oublier* → *oublié*: ancora lo stesso schema regolare.'
    example_gloss: Ho dimenticato il burro a casa!
  fr.a1.unit12.lesson01.teach.tu_as_aime:
    title: Ti è piaciuto
    gloss: ti è piaciuto
    note: '*Tu as* + participio è la forma con *tu* della stessa costruzione con *avoir*.'
    example_gloss: Ti è piaciuta la torta?
  fr.a1.unit12.lesson01.teach.il_a_goute:
    title: Ha assaggiato
    gloss: ha assaggiato
    note: '*Il a* + participio è la forma con *il*: l''ausiliare *avoir* cambia con il soggetto, il participio resta uguale.'
    example_gloss: Mathieu ha assaggiato la salsa.
  fr.a1.unit12.lesson01.teach.grammar_avoir_participe:
    title: Avoir + participio passato
    gloss: avoir + participio passato (-é)
    note: La maggior parte dei verbi francesi forma il passé composé con l'ausiliare *avoir*, seguito da un participio passato che per i verbi regolari in -ER termina in *-é*.
  fr.a1.unit12.lesson01.teach.la_semaine_derniere:
    title: La settimana scorsa
    gloss: la settimana scorsa
    note: '*Dernière* («scorsa») concorda con il femminile *semaine*; il maschile è *dernier*, come in *samedi dernier* («sabato scorso»).'
    example_gloss: La settimana scorsa ho preparato una torta.
  fr.a1.unit12.lesson02.teach.je_suis_arrive:
    title: sono arrivato
    gloss: sono arrivato
    note: '*Arriver* fa parte di un piccolo gruppo di verbi (per lo più di movimento) che usano *être* invece di *avoir* come ausiliare.'
    example_gloss: Sono arrivato in ritardo al laboratorio.
  fr.a1.unit12.lesson02.teach.je_suis_alle:
    title: sono andato
    gloss: sono andato
    note: 'Anche *aller* vuole *être*. Il participio concorda con il soggetto: *allé* (maschile) o *allée* (femminile, come direbbe Inès).'
    example_gloss: Sono andata al mercato prima del laboratorio.
  fr.a1.unit12.lesson02.teach.il_est_reste:
    title: È rimasto
    gloss: è rimasto
    note: '*Rester* («rimanere») è un altro verbo con l''ausiliare *être*, con la stessa regola di concordanza.'
    example_gloss: Mathieu è rimasto a pulire la cucina.
  fr.a1.unit12.lesson02.teach.grammar_etre_accord:
    title: Être + concordanza del participio passato
    gloss: être + participio passato (concorda con il soggetto)
    note: Con i verbi che usano l'ausiliare *être*, il participio passato concorda in genere e numero con il soggetto, a differenza dei verbi con *avoir*.
  fr.a1.unit12.lesson02.teach.en_retard:
    title: In ritardo
    gloss: in ritardo
    note: '*En retard* indica che si arriva dopo l''orario previsto: è un compagno frequente di *arriver*.'
    example_gloss: L'autobus è arrivato in ritardo.
  fr.a1.unit12.lesson02.teach.finalement:
    title: Alla fine / finalmente
    gloss: alla fine / finalmente
    note: '*Finalement* conclude un breve racconto e indica l''esito finale dopo le complicazioni precedenti.'
    example_gloss: Alla fine, la torta era deliziosa.
  fr.a1.unit12.lesson02.teach.quest_ce_qui_sest_passe:
    title: Che cosa è successo?
    gloss: Che cosa è successo?
    note: '*Qu''est-ce qui s''est passé ?* è il modo standard per chiedere che cosa è successo.'
    example_gloss: Che cosa è successo al laboratorio?
  fr.a1.unit12.lesson03.teach.line01:
    title: Chiedere che cosa è successo
    gloss: 'Inès chiede che cosa è successo al laboratorio di sabato scorso: lei non è potuta venire.'
    note: '*Qu''est-ce qui s''est passé ?* («che cosa è successo?») è il modo standard per chiedere di un evento passato.'
  fr.a1.unit12.lesson03.teach.line02:
    title: Raccontare l'imprevisto
    gloss: Mathieu dice che, ahimè, è arrivato in ritardo e ha dimenticato il burro a casa!
    note: 'Due forme di passé composé in una sola frase: con *être* (*je suis arrivé*) e con *avoir* (*j''ai oublié*).'
  fr.a1.unit12.lesson03.teach.line03:
    title: Chiedere che cosa ha fatto
    gloss: Inès gli chiede che cosa ha fatto dopo.
    note: '*Qu''est-ce que tu as fait ?* («che cosa hai fatto?») usa il participio irregolare di *faire* nel passé composé.'
  fr.a1.unit12.lesson03.teach.line04:
    title: Descrivere la soluzione
    gloss: Mathieu dice che è andato di corsa al negozio di alimentari all'angolo.
    note: '*L''épicerie du coin* («il negozio di alimentari all''angolo») usa *coin* come in *au coin de la rue*.'
  fr.a1.unit12.lesson03.teach.line05:
    title: Chiedere se ha funzionato
    gloss: Inès gli chiede se ha trovato del burro là.
    note: '*Tu as trouvé... ?* («hai trovato...?») è un''altra domanda regolare con l''ausiliare *avoir*.'
  fr.a1.unit12.lesson03.teach.line06:
    title: Dare il lieto fine
    gloss: Mathieu dice di sì, e che alla fine la torta era deliziosa!
    note: Chiude il racconto in positivo con *finalement*, risolvendo l'imprevisto iniziale.
