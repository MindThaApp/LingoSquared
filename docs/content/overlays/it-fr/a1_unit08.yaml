  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francese A1
  description: I giorni della settimana e come indicare la data nel calendario (le + numero cardinale + mese, con le premier come unica eccezione ordinale), proseguendo la storia del laboratorio di cucina di Inès e Mathieu con la pianificazione dell'ultimo incontro. In francese le date usano sempre i numeri cardinali (le quinze mars, come in italiano «il quindici marzo»), tranne il primo del mese.
units:
  fr.a1.unit08.dates:
    title: Che data è?
