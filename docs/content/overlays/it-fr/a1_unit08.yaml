  fr.a1.unit08.lesson01.jours_de_la_semaine:
    title: I giorni della settimana
  fr.a1.unit08.lesson02.donner_la_date:
    title: Dire la data
  fr.a1.unit08.lesson03.dialogue_derniere_seance:
    title: L'ultimo incontro del laboratorio
teaching:
  fr.a1.unit08.lesson01.teach.lundi:
    title: lunedì
    gloss: lunedì
    note: In francese i giorni della settimana sono maschili e non si scrivono con la maiuscola, come in italiano.
    example_gloss: Il laboratorio non si tiene mai il lunedì.
  fr.a1.unit08.lesson01.teach.samedi:
    title: sabato
    gloss: sabato
    note: '*Le samedi* (con l''articolo) significa «il sabato», cioè ogni sabato, per abitudine; *samedi* da solo indica un sabato preciso, il più vicino, futuro o appena trascorso a seconda del tempo del verbo.'
    example_gloss: Il laboratorio si tiene il sabato.
  fr.a1.unit08.lesson01.teach.dimanche:
    title: domenica
    gloss: domenica
    note: 'Stesso schema degli altri giorni: maschile e senza maiuscola.'
    example_gloss: La panetteria è chiusa la domenica.
  fr.a1.unit08.lesson01.teach.aujourdhui:
    title: Oggi
    gloss: oggi
    note: '*Aujourd''hui* è una parola unica e invariabile, anche se per ragioni storiche sembra formata da più parti.'
    example_gloss: Oggi è sabato.
  fr.a1.unit08.lesson01.teach.demain:
    title: Domani
    gloss: domani
    note: '*Demain* è invariabile e si usa allo stesso modo in ogni contesto.'
    example_gloss: La farmacia apre domani.
  fr.a1.unit08.lesson01.teach.hier:
    title: Ieri
    gloss: ieri
    note: '*Hier* è l''esatto opposto di *demain*.'
    example_gloss: Ieri ho mangiato del pesce.
  fr.a1.unit08.lesson01.teach.quel_jour_sommes_nous:
    title: Chiedere il giorno
    gloss: Che giorno è?
    note: '*Quel jour sommes-nous ?* (letteralmente «che giorno siamo») è il modo standard per chiedere che giorno della settimana è.'
  fr.a1.unit08.lesson02.teach.mars:
    title: marzo
    gloss: marzo
    note: In francese i mesi, come i giorni, sono maschili e non si scrivono con la maiuscola, proprio come in italiano.
    example_gloss: Il laboratorio finisce a marzo.
  fr.a1.unit08.lesson02.teach.quelle_est_la_date:
    title: Chiedere la data
    gloss: Qual è la data di oggi?
    note: '*Quelle est la date... ?* è il modo standard per chiedere la data completa, a differenza di *Quel jour sommes-nous ?*, che chiede solo il giorno della settimana.'
  fr.a1.unit08.lesson02.teach.cest_le_quinze_mars:
    title: Dire una data
    gloss: È il quindici marzo.
    note: '*Le* + numero cardinale + mese è lo schema normale delle date in francese, come in italiano: *quinze* (quindici), non un ordinale.'
  fr.a1.unit08.lesson02.teach.nous_sommes_le:
    title: Dire la data di oggi
    gloss: Oggi è il quindici marzo.
    note: '*Nous sommes le...* è un''alternativa altrettanto comune a *C''est le...* per dire la data di oggi.'
  fr.a1.unit08.lesson02.teach.le_premier:
    title: Il primo (del mese)
    gloss: il primo
    note: '*Le premier* è l''UNICA eccezione alla regola del numero cardinale: tutti gli altri giorni del mese usano un semplice cardinale (*le deux*, *le trois*...), mentre il primo usa l''ordinale *premier*.'
  fr.a1.unit08.lesson02.teach.le_vingt_deux:
    title: Dire la data di fine
    gloss: Il laboratorio finisce il ventidue marzo.
    note: '*Se termine* (finisce) è un verbo riflessivo; *vingt-deux* è un semplice numero cardinale, secondo la stessa regola di *le quinze mars*.'
  fr.a1.unit08.lesson03.teach.line01:
    title: Chiedere quando è l'ultimo incontro
    gloss: Inès chiede quando è l'ultimo incontro del laboratorio.
    note: '*C''est quand... ?* (quando è) è un modo semplice e naturale per chiedere informazioni sui tempi.'
  fr.a1.unit08.lesson03.teach.line02:
    title: Dire la data e il giorno
    gloss: Mathieu dice il ventidue marzo, credo, un sabato.
    note: '*Un samedi* (un sabato, senza *le*) indica semplicemente in quale giorno della settimana cade quella data.'
  fr.a1.unit08.lesson03.teach.line03:
    title: Chiedere la data di oggi
    gloss: Inès chiede che data è oggi.
    note: La stessa *Quelle est la date aujourd'hui ?* che hai imparato per chiedere la data.
  fr.a1.unit08.lesson03.teach.line04:
    title: Dire la data di oggi e quanto manca
    gloss: Mathieu dice che oggi è il quindici marzo, quindi manca una settimana.
    note: '*Dans une semaine* (tra una settimana) esprime una distanza di tempo a partire da oggi.'
  fr.a1.unit08.lesson03.teach.line05:
    title: Reagire con un progetto
    gloss: Inès dice che va benissimo, ha il tempo di preparare un dolce per l'occasione.
    note: '*J''ai le temps de* + infinito (ho il tempo di) è un modo comune per dire che c''è abbastanza tempo per fare qualcosa.'
  fr.a1.unit08.lesson03.teach.line06:
    title: Confermare il programma
    gloss: 'Mathieu dice che è una bella idea: allora ci vediamo sabato prossimo, il ventidue.'
    note: '*Samedi prochain* (sabato prossimo) conferma insieme il giorno e la data, chiudendo lo scambio.'
