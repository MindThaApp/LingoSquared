    gloss: Che sport pratichi?
  fr.a1.unit55.lesson01.teach.je_joue_au:
    title: Gioco a calcio
    gloss: Gioco a calcio.
    note: '*Jouer au* + uno sport con la palla è il modo abituale per dire che giochi a calcio. Per gli altri sport usa *faire du* o *faire de la*; vedi la nota di grammatica.'
  fr.a1.unit55.lesson01.teach.faire_du_de:
    title: Faire du / de la + sport
    gloss: '*Faire du*, *de la* o *de l''* + sport dice quale sport pratichi: *faire du yoga*, *faire de la natation*, *faire de la course à pied*. Per il calcio si dice *jouer au football*.'
    note: 'Una sola costruzione vale per tutti gli sport: a questo livello non serve imparare un verbo diverso per ogni sport.'
  fr.a1.unit55.lesson02.teach.fois_par_semaine:
    title: Volte a settimana
    gloss: volte a settimana
    example_gloss: Faccio yoga due volte a settimana.
  fr.a1.unit55.lesson02.teach.tu_connais_deja:
    title: Fois par semaine, tous les jours e souvent
    gloss: Conosci già *tous les jours* (ogni giorno) e *souvent* (spesso). *Deux fois par semaine* (due volte a settimana) è un modo nuovo e più preciso per dire quanto spesso.
    note: Amplia il lessico della frequenza già introdotto nell'unità sugli hobby.
  fr.a1.unit55.lesson02.teach.je_fais_du:
    title: Faccio yoga due volte a settimana
    gloss: Faccio yoga due volte a settimana.
  fr.a1.unit55.lesson02.teach.mathieu_joue_souvent:
