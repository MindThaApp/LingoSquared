    gloss: Mathieu gioca spesso a calcio.
    note: Riprende *souvent* (spesso), già visto per le routine in un'unità precedente.
  fr.a1.unit55.lesson03.teach.tu_connais_deja:
    title: Faire du sport e faire de la + sport
    gloss: 'Conosci già *faire du sport* dalla lezione sugli hobby (*Je fais du sport le samedi*). *Faire de la* + sport indica lo sport specifico: *Je fais de la natation*. Entrambe le forme sono corrette in francese.'
    note: '*Faire du sport* è già noto dall''unità sugli hobby. Qui lo si confronta con la forma che nomina uno sport specifico: un modo generico e uno specifico di parlare di attività fisica.'
