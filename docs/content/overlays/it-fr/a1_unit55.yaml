    gloss: Camille fa yoga due volte a settimana. Ama muoversi con dolcezza. Léa non fa yoga, ma ama nuotare. Léa nuota spesso, quasi ogni settimana. Tu che sport fai?
    note: Mette a confronto due sport diversi e due espressioni di frequenza diverse, come nella lettura sugli animali dell'unità precedente.
