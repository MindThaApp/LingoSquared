    gloss: '*Courir* (correre) è irregolare: *je cours, tu cours, il court*. La *s* e la *t* finali non si pronunciano.'
    note: '*Courir* non segue il modello regolare in *-er*, quindi conviene imparare a memoria le sue forme: *je cours*, *tu cours*, *il court*.'
  fr.a1.unit55.lesson04.teach.mathieu_super_j:
