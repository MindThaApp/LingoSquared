answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francese A1
  description: 'Chiedere e dare semplici indicazioni stradali (à gauche/à droite, tout droit, au coin de la rue, traverser), proseguendo la storia del laboratorio di cucina di Inès e Mathieu mentre Inès cerca un negozio di utensili da cucina. In francese le indicazioni si possono dare con l''imperativo di cortesia ("Tournez à gauche") oppure con il presente ("Tu tournes à gauche"): in italiano si usano forme simili, ma conviene abituarsi a riconoscere entrambe.'
units:
  fr.a1.unit09.directions:
    title: Come si arriva?
lessons:
  fr.a1.unit09.lesson01.vocabulaire_directions:
    title: Le parole per orientarsi
  fr.a1.unit09.lesson02.donner_des_indications:
