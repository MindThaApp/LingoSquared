teaching:
  fr.a1.unit09.lesson01.teach.a_gauche:
    title: A sinistra
    gloss: a sinistra
    note: '*À gauche* si usa sia per indicare un luogo ("è a sinistra") sia una direzione ("gira a sinistra").'
    example_gloss: Giri a sinistra dopo la panetteria.
  fr.a1.unit09.lesson01.teach.a_droite:
    title: A destra
    gloss: a destra
    note: È l'esatto contrario di *à gauche* e si usa allo stesso modo.
    example_gloss: La farmacia è a destra del bar.
  fr.a1.unit09.lesson01.teach.tout_droit:
    title: Dritto
    gloss: dritto
    note: '*Tout droit* significa "dritto": non confonderlo con *à droite* ("a destra"), che gli somiglia ma ha un altro significato.'
    example_gloss: Continui dritto fino al mercato.
  fr.a1.unit09.lesson01.teach.au_coin_de_la_rue:
    title: All'angolo della strada
    gloss: all'angolo della strada
    note: '*Au coin de* significa "all''angolo di"; *au coin de la rue* (all''angolo della strada) è un''espressione molto comune per indicare un punto di riferimento.'
    example_gloss: Il negozio è all'angolo della strada.
  fr.a1.unit09.lesson01.teach.traverser:
    title: Attraversare
    gloss: attraversare
    note: '*Traverser* è un verbo regolare in -ER: *je traverse*, *tu traverses* e così via.'
    example_gloss: Devi attraversare la strada per arrivare al negozio.
  fr.a1.unit09.lesson01.teach.la_boutique:
    title: Il negozio
    gloss: il negozio
    note: '*La boutique* indica di solito un piccolo negozio specializzato, diverso da un grande magazzino.'
    example_gloss: Il negozio è all'angolo della strada, sulla destra.
  fr.a1.unit09.lesson01.teach.le_carrefour:
    title: L'incrocio
    gloss: l'incrocio
    note: '*Le carrefour* è il punto in cui si incrociano due strade: un punto di riferimento frequente nelle indicazioni a voce.'
    example_gloss: Giri a sinistra all'incrocio.
  fr.a1.unit09.lesson02.teach.pour_aller_a:
    title: Chiedere come arrivare in un posto
    gloss: Mi scusi, come si arriva al negozio, per favore?
    note: '*Pour aller à... ?* (letteralmente "per andare a...") è il modo cortese standard per chiedere come arrivare in un luogo.'
  fr.a1.unit09.lesson02.teach.tournez_a_gauche:
    title: Girare a sinistra
    gloss: Giri a sinistra dopo la farmacia.
    note: '*Tournez* è l''imperativo di *tourner* (girare) alla forma *vous*: il registro normale per dare indicazioni a una persona che non si conosce bene.'
  fr.a1.unit09.lesson02.teach.continuez_tout_droit:
    title: Continua dritto
    gloss: Continui dritto fino all'incrocio.
    note: '*Continuez* (continui) + *tout droit* (dritto) è il modo standard per dire a qualcuno di proseguire senza girare.'
  fr.a1.unit09.lesson02.teach.cest_au_coin:
    title: Indicare il luogo
    gloss: È all'angolo della strada, sulla destra.
    note: Unisce *au coin de la rue* e *à droite* per dare un'indicazione precisa.
  fr.a1.unit09.lesson02.teach.cest_loin:
    title: Dire che non è lontano
    gloss: Non è lontano, è a cinque minuti a piedi.
    note: '*À cinq minutes à pied* (a cinque minuti a piedi) è la stessa struttura per indicare il tempo a piedi che hai visto quando Mathieu ha chiesto della farmacia.'
  fr.a1.unit09.lesson03.teach.line01:
    title: Chiedere di un negozio
    gloss: Inès chiede a Mathieu se conosce un negozio dove comprare utensili da cucina.
    note: '*Tu connais... ?* (conosci) è il modo informale standard per chiedere se qualcuno conosce un luogo.'
  fr.a1.unit09.lesson03.teach.line02:
    title: Dare il primo passo
    gloss: 'Mathieu dice di sì, ce n''è uno non lontano da qui: si gira a sinistra all''incrocio.'
    note: '*Il y en a une* (ce n''è una) usa *en* per non ripetere *boutique*, come il «ne» italiano: è una scorciatoia molto comune nel francese parlato.'
  fr.a1.unit09.lesson03.teach.line03:
    title: Confermare e chiedere ancora
    gloss: 'Inès conferma: a sinistra all''incrocio, e chiede cosa deve fare dopo.'
    note: '*Et ensuite ?* (e poi?) è un modo semplice e naturale per chiedere il passaggio successivo.'
  fr.a1.unit09.lesson03.teach.line04:
    title: Dare il secondo passo
    gloss: Mathieu dice che poi si continua dritto e si attraversa la strada.
    note: 'Due verbi di movimento uniti da *et*: un modo naturale per dare un breve percorso.'
  fr.a1.unit09.lesson03.teach.line05:
    title: Chiedere dov'è esattamente
    gloss: Inès chiede dove sia esattamente il negozio.
    note: '*Exactement* (esattamente) chiede una risposta più precisa di una direzione generica.'
  fr.a1.unit09.lesson03.teach.line06:
    title: Dare il luogo preciso
    gloss: Mathieu dice che è all'angolo della strada, proprio di fronte alla panetteria.
    note: '*En face de* (di fronte a) indica un luogo tramite un punto di riferimento, un modo naturale per concludere le indicazioni.'
