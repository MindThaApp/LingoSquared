teaching:
  fr.a1.unit45.lesson01.teach.tu_fais_quoi:
    title: Chiedere a qualcuno che lavoro fa
    gloss: Che lavoro fai?
    note: Un modo standard e informale per chiedere a qualcuno che lavoro fa.
  fr.a1.unit45.lesson01.teach.le_metier_cuisinier:
    title: Mestiere / cuoco
    gloss: il mestiere; cuoco
    note: '*Métier* (mestiere) è maschile: *le métier*. *Cuisinier* cambia al femminile: *un cuisinier*, *une cuisinière*.'
    example_gloss:
    - Che lavoro fai?
    - Lavoro come cuoco.
  fr.a1.unit45.lesson01.teach.je_travaille_comme:
    title: Dire che fai il cuoco
    gloss: Lavoro come cuoco.
    note: '*Travailler comme* + professione è la struttura standard per dire il proprio lavoro, senza articolo davanti al nome della professione.'
  fr.a1.unit45.lesson01.teach.infirmiere:
    title: Infermiere
    gloss: infermiera
    note: Il termine moderno e neutro per questa professione, usato per qualsiasi genere.
    example_gloss: Lavoro come infermiera.
  fr.a1.unit45.lesson01.teach.je_travaille_comme_2:
    title: Dire che fai l'infermiere
    gloss: Lavoro come infermiera.
    note: Segue lo stesso schema di *travailler comme* usato con *cuisinier*; il femminile è *infirmière*.
  fr.a1.unit45.lesson02.teach.ou_travailles_tu:
    title: Chiedere dove si lavora
    gloss: Dove lavori?
    note: Una domanda diretta che segue *Tu fais quoi dans la vie ?*
  fr.a1.unit45.lesson02.teach.je_travaille_dans:
    title: Lavorare in un ristorante
    gloss: Lavoro in un ristorante.
    note: '*Un restaurant* vuole qui l''articolo indeterminativo, perché è uno dei tanti ristoranti.'
  fr.a1.unit45.lesson02.teach.l_hopital:
    title: L'ospedale
    gloss: l'ospedale
    note: '*Hôpital* è maschile e inizia con un suono vocalico: *l''hôpital*.'
    example_gloss: Lavoro in ospedale.
  fr.a1.unit45.lesson02.teach.je_travaille_a:
    title: Lavorare in ospedale
    gloss: Lavoro in ospedale.
    note: '*À l''hôpital* vuole l''articolo determinativo, perché è un luogo preciso e noto; *le* diventa *l''* davanti a un suono vocalico.'
  fr.a1.unit45.lesson02.teach.certaines_personnes_travaillent:
    title: Lavorare in un ufficio
    gloss: Alcune persone lavorano in un ufficio.
    note: '*Dans un bureau* (in un ufficio) vuole l''articolo, come *dans un restaurant*.'
  fr.a1.unit45.lesson03.teach.je_commence_a:
    title: L'orario di inizio
    gloss: Comincio alle nove.
    note: '*Commence* è la forma di *je* del verbo *commencer* (cominciare); *à neuf heures* indica l''ora.'
  fr.a1.unit45.lesson03.teach.je_travaille_du:
    title: I giorni di lavoro
    gloss: Lavoro dal lunedì al venerdì.
    note: '*Du lundi au vendredi* significa dal lunedì al venerdì; *du* è *de* + *le* e *au* è *à* + *le*.'
  fr.a1.unit45.lesson03.teach.la_pause:
    title: La pausa
    gloss: la pausa
    note: '*Pause* è femminile: *la pause*.'
    example_gloss: Ho una pausa alle dodici.
  fr.a1.unit45.lesson03.teach.j_ai_une:
    title: Fare una pausa
    gloss: Ho una pausa alle dodici.
    note: '*Avoir une pause* (avere una pausa) è la costruzione fissa naturale.'
  fr.a1.unit45.lesson03.teach.je_finis_a:
    title: L'orario di fine
    gloss: Finisco alle cinque.
    note: '*Finis* è la forma di *je* del verbo *finir* (finire).'
  fr.a1.unit45.lesson03.teach.je_commence_a_2:
    title: Una giornata di lavoro completa
    gloss: Comincio alle nove e finisco alle cinque.
    note: Unisce *je commence* e *je finis* con *et* in un'unica frase che descrive un'intera giornata di lavoro.
  fr.a1.unit45.lesson04.teach.avec_il_ou:
    title: Le desinenze del verbo con il e elle
    gloss: 'Con lui o lei, i verbi regolari in -er mantengono la stessa forma di io: io lavoro, lui lavora, lei lavora.'
    note: '*Travaille* è uguale per *je*, *il* e *elle*: i verbi regolari in *-er* non aggiungono nulla alla terza persona.'
  fr.a1.unit45.lesson04.teach.camille_travaille_comme:
    title: Il lavoro di Camille
    gloss: Camille lavora come infermiera.
    note: '*Travaille* va con *je*, *il* e *elle*: la desinenza non si pronuncia, quindi le tre forme suonano uguali.'
  fr.a1.unit45.lesson04.teach.mathieu_travaille_comme:
    title: Il lavoro di Mathieu
    gloss: Mathieu lavora come cuoco.
    note: Stessa desinenza di *Camille travaille comme infirmière*.
  fr.a1.unit45.lesson04.teach.elle_travaille_a:
    title: Usare i pronomi
    gloss: Lei lavora in ospedale. Lui lavora in un ristorante.
    note: '*Elle* e *il* sostituiscono i nomi Camille e Mathieu, ma il verbo mantiene la stessa forma.'
  fr.a1.unit45.lesson05.teach.camille_travaille_comme:
    title: Leggi due profili di lavoro
    gloss: Camille lavora come infermiera all'ospedale. Comincia alle sette e lavora dal lunedì al venerdì. Mathieu lavora come cuoco in un ristorante. Comincia alle undici e fa una pausa alle quattro.
    note: Tieni separati il lavoro, il luogo di lavoro e l'orario di ciascuna persona.
    glosses:
      travaille: lavora
      infirmière: infermiera
      l'hôpital: ospedale
      commence: inizia
      sept: sette
      lundi: lunedì
      vendredi: venerdì
      cuisinier: cuoco / chef
      restaurant: ristorante
      onze: undici
      pause: pausa
  fr.a1.unit45.lesson06.teach.camille_salut_mathieu:
    title: Camille chiede del lavoro
    gloss: 'Camille: Ciao Mathieu! Sono curiosa, che lavoro fai, a proposito?'
    note: '*Au fait* (a proposito) addolcisce la domanda e la rende una curiosità amichevole, non un interrogatorio.'
  fr.a1.unit45.lesson06.teach.mathieu_je_travaille:
    title: Mathieu risponde
    gloss: 'Mathieu: Lavoro come cuoco in un ristorante. E tu?'
    note: '*Et toi ?* è il modo usuale per rivolgere la domanda all''altra persona.'
  fr.a1.unit45.lesson06.teach.camille_je_travaille:
    title: Camille risponde
    gloss: 'Camille: Lavoro come infermiera all''ospedale.'
    note: Corrisponde al lavoro e al luogo di lavoro già presentati nelle lezioni precedenti.
  fr.a1.unit45.lesson06.teach.mathieu_tu_fais:
    title: Mathieu chiede degli orari
    gloss: 'Mathieu: Che orari fai?'
    note: '*Tu fais quels horaires ?* è un modo naturale di chiedere l''orario di lavoro di qualcuno; *quels* concorda con il plurale *horaires*.'
  fr.a1.unit45.lesson06.teach.camille_je_commence:
    title: Camille dice i suoi orari
    gloss: 'Camille: Comincio alle sette e lavoro dal lunedì al venerdì.'
    note: Corrisponde all'orario già presentato nel testo di lettura della lezione.
  fr.a1.unit45.lesson06.teach.mathieu_c_est:
    title: Mathieu reagisce
    gloss: 'Mathieu: È presto! Io comincio più tardi, alle undici.'
    note: Corrisponde all'orario di inizio di Mathieu già presentato nella lezione.
  fr.a1.unit45.lesson06.teach.camille_chaque_metier:
    title: Camille chiude il discorso
    gloss: 'Camille: Ogni mestiere ha il suo ritmo, credo.'
    note: 'Una battuta finale naturale e riflessiva: riconoscila per il significato, non serve saperla riprodurre esattamente.'
