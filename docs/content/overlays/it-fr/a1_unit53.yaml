answer_policy:
  diacritics: 'Teach and display standard French accents and the cedilla. For free-typed A1 answers, accept otherwise-correct forms without diacritics, including ca for ça, tres for très, and enchante for enchanté. This leniency does not erase meaningful letters: masculine enchanté and feminine enchantée remain distinct through the final e even when accents are omitted.'
  apostrophes: Accept straight and typographic apostrophes interchangeably. Require the apostrophe when an exercise specifically tests elision, such as j’habite; do not accept jhabite in that exercise.
  hyphens: Teach the standard hyphens in inverted questions such as allez-vous and vas-tu. In free transcription exercises, accept an otherwise-correct spaced version at A1, but retain the hyphenated form as the model answer.
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of French spacing before question or exclamation marks. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
course:
  title: Francese A1
  description: 'Francese per principianti per descrivere l''aspetto fisico di una persona: impressioni su altezza ed età, colore di capelli e occhi, la domanda fondamentale Comment est ... ? e il confronto dell''aspetto di due persone.'
units:
  fr.a1.unit53.apparence:
    title: Descrivere l'aspetto
lessons:
  fr.a1.unit53.lesson01.grand_petit_vieux_et:
    title: Alto, basso, anziano e giovane
  fr.a1.unit53.lesson02.decrire_les_cheveux:
    title: Descrivere i capelli
  fr.a1.unit53.lesson03.les_yeux_et_comment:
    title: Gli occhi e «Com'è?»
  fr.a1.unit53.lesson04.camille_decrit_nina:
    title: Camille descrive Nina
  fr.a1.unit53.lesson05.comparer_thomas_et_lea:
    title: Confronto tra Thomas e Léa
  fr.a1.unit53.lesson06.mathieu_reconnait_nina:
    title: Mathieu riconosce Nina
teaching:
  fr.a1.unit53.lesson01.teach.grand_petit:
    title: Alto e basso
    gloss: alto / basso
    note: '*Grand* descrive una persona alta e *petit* una persona bassa. Si accordano con la persona: *grand/grande*, *petit/petite*.'
    example_gloss:
    - Léa è alta.
    - Thomas è basso.
  fr.a1.unit53.lesson01.teach.vieux_jeune:
    title: Anziano e giovane
    gloss: anziano / giovane
    note: '*Vieux* e *jeune* qui danno un''impressione generale dell''età, non un numero preciso di anni.'
    example_gloss:
    - Il nonno è anziano.
    - Mathieu è giovane.
  fr.a1.unit53.lesson01.teach.pour_un_age:
    title: 'L''età: un numero o un''impressione'
    gloss: Per l'età precisa il francese usa *avoir* (*Il a vingt ans*), mentre *être vieux* dà un'impressione generale (*Mon grand-père est vieux*).
    note: Conosci già *Quel âge as-tu ?* per chiedere l'età precisa. Qui *vieux* descrive quanti anni qualcuno DIMOSTRA, senza alcun numero.
  fr.a1.unit53.lesson01.teach.lea_est_grande:
    title: Léa è alta e Thomas è basso
    gloss: Léa è alta e Thomas è basso.
    note: Una semplice frase composta con *et* (e), che prepara il confronto diretto della lezione 5.
  fr.a1.unit53.lesson02.teach.les_cheveux:
    title: I capelli
    gloss: i capelli
    note: '*Les cheveux* è sempre plurale e maschile in francese, mentre in italiano «i capelli» è plurale ma l''ambito è diverso: ricordalo come un plurale fisso.'
    example_gloss: Mathieu ha i capelli corti e neri.
  fr.a1.unit53.lesson02.teach.blonds_bruns_gris:
    title: Biondo, castano e grigio
    gloss: biondo / castano / grigio
    note: 'Tre colori di capelli. Con *cheveux* il colore prende la *s* del plurale: *blonds*, *bruns*. *Gris* termina già in *s*, e *noirs* (neri) è ripreso dall''unità sull''abbigliamento.'
    example_gloss:
    - Camille ha i capelli biondi.
    - Thomas ha i capelli castani.
    - Il nonno ha i capelli grigi.
  fr.a1.unit53.lesson02.teach.longs_courts:
    title: Lunghi e corti (capelli)
    gloss: lungo / corto (capelli)
    note: '*Longs* (lunghi) riprende l''idea di altezza della lezione 1, ora per descrivere la lunghezza dei capelli. *Courts* (corti) è nuovo, ed entrambi prendono la *s* del plurale con *cheveux*.'
    example_gloss:
    - Léa ha i capelli lunghi.
    - Thomas ha i capelli corti.
  fr.a1.unit53.lesson02.teach.cheveux_est_toujours:
    title: Cheveux vuole l'aggettivo al plurale
    gloss: '*Cheveux* è sempre plurale, quindi l''aggettivo prende una *s*: *longs*, *courts*, *blonds*, *bruns*, *noirs*. *Gris* termina già in *s*.'
    note: 'Colori e lunghezze si accordano al plurale con *cheveux*: *les cheveux longs*. Confronta con *yeux* nella lezione 3, dove *marron* non cambia.'
  fr.a1.unit53.lesson02.teach.ses_est_le:
    title: 'Ses: suo o sua'
    gloss: '*Ses* significa "suoi" o "sue" davanti a un nome plurale: *ses cheveux*, *ses yeux*. Si accorda con la cosa posseduta, non con il possessore.'
    note: 'In italiano "i suoi occhi" vale per lui e per lei, e lo stesso accade in francese: *ses yeux* può essere di un uomo o di una donna, e lo capisci dal contesto.'
  fr.a1.unit53.lesson02.teach.mathieu_a_les:
    title: Mathieu ha i capelli corti e neri
    gloss: Mathieu ha i capelli corti e neri.
    note: Riprende *noirs* (neri) dall'unità sull'abbigliamento.
  fr.a1.unit53.lesson02.teach.camille_a_les:
    title: Camille ha i capelli lunghi e biondi
    gloss: Camille ha i capelli lunghi e biondi.
    note: Unisce in un'unica frase naturale il lessico di lunghezza e colore di questa lezione.
  fr.a1.unit53.lesson03.teach.les_yeux:
    title: Gli occhi
    gloss: gli occhi
    note: '*Les yeux* è il plurale di *l''œil* (l''occhio); *yeux* termina in *x*, non in *s*.'
    example_gloss: Mathieu ha gli occhi marroni.
  fr.a1.unit53.lesson03.teach.bleus_marron_verts:
    title: Azzurro, marrone e verde
    gloss: azzurro / marrone / verde
    note: '*Bleus* (azzurri, blu) è già stato visto per i vestiti; *marron* (marroni) non cambia mai; *verts* (verdi) è nuovo.'
    example_gloss:
    - Camille ha gli occhi azzurri.
    - Thomas ha gli occhi marroni.
    - Léa ha gli occhi verdi.
  fr.a1.unit53.lesson03.teach.avec_yeux_pluriel:
    title: Yeux prende la -s, marron resta invariato
    gloss: 'Con *yeux* (plurale) l''aggettivo prende una *s*: *yeux bleus*, *yeux verts*. *Marron* non cambia mai: *yeux marron*.'
    note: 'Confronta con *cheveux* della lezione 2: un nome plurale richiede un aggettivo plurale, tranne i colori come *marron*, derivati da un nome.'
  fr.a1.unit53.lesson03.teach.comment_est_camille:
    title: Com'è Camille?
    gloss: Com'è Camille?
    note: '*Comment est ... ?* è la domanda centrale di questa unità: usala per chiedere l''aspetto di chiunque.'
  fr.a1.unit53.lesson03.teach.camille_a_les:
    title: Camille ha i capelli lunghi e biondi e gli occhi azzurri
    gloss: Camille ha i capelli lunghi e biondi e gli occhi azzurri.
    note: Una risposta modello che unisce capelli e occhi in una sola frase con *et*.
  fr.a1.unit53.lesson04.teach.camille_une_nouvelle:
    title: Camille presenta Nina
    gloss: 'Camille: Una nuova ragazza viene al caffè delle lingue. Si chiama Nina.'
    note: '*Une nouvelle fille vient* introduce una persona nuova nella scena; *vient* viene da *venir* (venire).'
  fr.a1.unit53.lesson04.teach.mathieu_d_accord:
    title: Mathieu chiede com'è
    gloss: 'Mathieu: D''accordo! Com''è?'
    note: 'Riprende la domanda centrale con *elle* (lei) al posto del nome: *Comment est-elle ?* Il trattino unisce il verbo e il pronome.'
  fr.a1.unit53.lesson04.teach.camille_elle_est:
    title: Camille descrive altezza e capelli di Nina
    gloss: 'Camille: È bassa e ha i capelli corti e biondi.'
    note: Unisce *petite* della lezione 1 al lessico dei capelli della lezione 2; *petite* prende una *e* per una ragazza.
  fr.a1.unit53.lesson04.teach.mathieu_et_ses:
    title: Mathieu chiede degli occhi
    gloss: 'Mathieu: E i suoi occhi?'
    note: '*Ses yeux* qui significa "i suoi occhi": *ses* si accorda con *yeux*, non con la ragazza.'
  fr.a1.unit53.lesson04.teach.camille_elle_a:
    title: Camille descrive gli occhi di Nina
    gloss: 'Camille: Ha gli occhi verdi.'
    note: Riprende *yeux verts* dalla lezione 3.
  fr.a1.unit53.lesson04.teach.mathieu_merci_alors:
    title: Mathieu la riconoscerà
    gloss: 'Mathieu: Grazie! Allora la riconoscerò.'
    note: '*Je vais la reconnaître* usa *aller* + infinito per il futuro prossimo, e *la* significa "la" (lei).'
  fr.a1.unit53.lesson05.teach.thomas_et_lea:
    title: Thomas e Léa a confronto
    gloss: 'Thomas e Léa sono fratello e sorella, ma non si somigliano: sono molto diversi. Thomas è basso, ha i capelli corti e castani e gli occhi marroni. Léa è più alta di Thomas, ha i capelli lunghi e castani e gli occhi verdi. E tu, come sei?'
    note: Un breve confronto che riprende tutte le parole di colore e lunghezza viste finora e termina con la domanda chiave dell'unità rivolta a chi legge.
    glosses:
      frère: fratello
      sœur: sorella
      ressemblent: essere (di aspetto)
      différents: diverso
      petit: basso
      courts: basso
      bruns: castano
      cheveux: i capelli
      marron: castano
      yeux: gli occhi
      grande: più alto
      longs: lungo
      verts: verde
      se: (parte di 'se ressemblent' = si somigliano)
  fr.a1.unit53.lesson05.teach.tu_connais_deja:
    title: Plus ... que con le persone
    gloss: 'Conosci già la struttura *plus* + aggettivo + *que*. Qui la usi per le persone: Léa è più alta di Thomas.'
    note: La stessa struttura *plus ... que* dell'unità sullo shopping, ora applicata alle persone invece che agli oggetti. *Grande* si accorda con *Léa*, che è femminile.
  fr.a1.unit53.lesson05.teach.lea_a_les:
    title: Léa ha i capelli più lunghi di Thomas
    gloss: Léa ha i capelli più lunghi di Thomas.
    note: '*Plus longs que* si accorda con *cheveux* (plurale): *les cheveux plus longs que Thomas*.'
  fr.a1.unit53.lesson05.teach.j_ai_les:
    title: Ho i capelli corti e castani
    gloss: Ho i capelli corti e castani.
    note: Una frase modello in prima persona con *J'ai ...*, da riutilizzare per descrivere il tuo aspetto.
  fr.a1.unit53.lesson06.teach.mathieu_regarde_c:
    title: Mathieu nota Nina
    gloss: 'Mathieu: Guarda, è Nina? Ha i capelli corti e biondi e gli occhi verdi.'
    note: '*Regarde* (guarda) è l''imperativo di *regarder* alla forma *tu*, già usato allo stesso modo in un dialogo precedente.'
  fr.a1.unit53.lesson06.teach.camille_oui_c:
    title: Camille conferma
    gloss: 'Camille: Sì, è Nina!'
    note: Una conferma breve e naturale.
  fr.a1.unit53.lesson06.teach.nina_salut_tu:
    title: Nina saluta Mathieu
    gloss: 'Nina: Ciao, sei Mathieu?'
    note: 'Una semplice domanda di saluto informale: *Tu es ... ?*'
  fr.a1.unit53.lesson06.teach.mathieu_oui_ravi:
    title: Mathieu risponde al saluto di Nina
    gloss: 'Mathieu: Sì! Piacere di conoscerti, Nina.'
    note: '*Ravi de te rencontrer* è la formula abituale per un primo incontro vero e proprio (*ravi* per un uomo, *ravie* per una donna), non *content de te revoir*, che si usa con qualcuno che già conosci.'
  fr.a1.unit53.lesson06.teach.nina_ravie_de:
    title: Nina ricambia il saluto
    gloss: 'Nina: Piacere di conoscerti anch''io!'
    note: 'Chiude il dialogo: Mathieu ha riconosciuto Nina grazie alla descrizione di Camille.'
