teaching:
  fr.a1.unit01.lesson01.teach.bonjour:
    title: Saluto neutro
    gloss: salve; buongiorno
    note: Bonjour va bene con sconosciuti, colleghi e amici durante il giorno. Come il nostro «buongiorno», esprime l'augurio di una buona giornata, ma in francese si usa in modo ancora più generale.
  fr.a1.unit01.lesson01.teach.salut:
    title: Saluto informale
    gloss: ciao
    note: Salut si usa in un rapporto informale. Può aprire o chiudere uno scambio, ma non è la scelta più sicura con un adulto che non conosci.
  fr.a1.unit01.lesson01.teach.au_revoir:
    title: Congedo neutro
    gloss: arrivederci; addio
    note: Au revoir va bene sia nelle situazioni formali sia in quelle informali.
  fr.a1.unit01.lesson01.teach.tu:
    title: «Tu» informale al singolare
    gloss: tu (singolare, informale)
    note: Come in italiano, tu si usa con un amico, un bambino o una persona con cui il rapporto è esplicitamente informale. In francese richiede forme verbali proprie, e il pronome soggetto va sempre espresso.
  fr.a1.unit01.lesson01.teach.vous:
    title: «Voi» o «Lei» di cortesia
    gloss: Lei (di cortesia); voi (plurale)
    note: 'Vous è la scelta sicura per un adulto sconosciuto ed è anche la forma per rivolgersi a più persone. In italiano la cortesia si esprime con il Lei, che in francese non esiste: con una sola persona si usa vous, che è anche il plurale.'
  fr.a1.unit01.lesson01.teach.comment_allez_vous:
    title: Domanda di cortesia sul benessere
    gloss: Come sta?
    note: Allez è la forma di vous del verbo aller. Verbo e pronome sono invertiti e uniti da un trattino. È una domanda di cortesia convenzionale, non una richiesta letterale su dove stia andando qualcuno.
  fr.a1.unit01.lesson01.teach.comment_vas_tu:
    title: Domanda informale sul benessere
    gloss: Come sta?
    note: Vas è la forma di tu del verbo aller. In francese, quando il rapporto diventa informale, allez-vous diventa vas-tu, un po' come in italiano «come sta?» diventa «come stai?».
  fr.a1.unit01.lesson01.teach.register_choice:
    title: Abbina saluto e rapporto
    gloss: Bonjour con vous; salut con tu
    note: Questi abbinamenti sono indicazioni utili, non regole assolute. Bonjour si può usare anche con gli amici, ma salut insieme a vous di solito manda segnali sociali contrastanti.
  fr.a1.unit01.lesson02.teach.je_mappelle:
    title: Dire il proprio nome
    gloss: Mi chiamo Camille.
    note: Je m’appelle significa letteralmente «mi chiamo». A differenza dell'italiano, il francese richiede normalmente il soggetto je. La vocale di me cade davanti ad appelle, e si ottiene m’appelle.
  fr.a1.unit01.lesson02.teach.comment_appelez_vous:
    title: Chiedere il nome con cortesia
    gloss: Come si chiama?
    note: 'Appelez è la forma di vous del verbo appeler. Il secondo vous segue il verbo perché la domanda usa l''inversione: vous appelez-vous.'
  fr.a1.unit01.lesson02.teach.tu_tappelles:
    title: Chiedere il nome in modo informale
    gloss: Come si chiama?
    note: T’appelles è la forma di tu con il pronome riflessivo te abbreviato davanti a vocale. Questa domanda di uso quotidiano mantiene tu prima del verbo e mette comment alla fine.
  fr.a1.unit01.lesson02.teach.moi_cest:
    title: Presentazione colloquiale
    gloss: Io sono Noé.
    note: Moi, c’est è una presentazione tipica del parlato. È più colloquiale di una traduzione parola per parola di «io sono».
  fr.a1.unit01.lesson02.teach.enchante:
    title: Accordo al maschile
    gloss: Piacere.
    note: Un uomo scrive normalmente enchanté. Come in italiano «lieto» o «lieta», questo aggettivo cambia secondo il genere di chi parla.
  fr.a1.unit01.lesson02.teach.enchantee:
    title: Accordo al femminile
    gloss: Piacere.
    note: Una donna scrive normalmente enchantée, con una e finale. Enchanté ed enchantée di solito si pronunciano allo stesso modo, quindi la differenza è più evidente nello scritto che nel parlato.
  fr.a1.unit01.lesson02.teach.et_vous:
    title: Restituire la domanda con cortesia
    gloss: E Lei?
    note: Usa vous per mantenere il registro formale o per rivolgerti a più persone.
  fr.a1.unit01.lesson02.teach.et_toi:
    title: Restituire la domanda in modo informale
    gloss: E Lei?
    note: Toi è la forma tonica legata a tu. Dopo et il francese usa toi, non tu.
  fr.a1.unit01.lesson03.teach.elision_jhabite:
    title: Elisione davanti a vocale
    gloss: abito
    note: 'Je perde la vocale davanti a habite e l''apostrofo segnala l''elisione: j’habite. La h di habiter non impedisce l''elisione.'
  fr.a1.unit01.lesson03.teach.liaison_vous_etes:
    title: Liaison dopo vous
    gloss: voi siete; Lei è
    note: 'La s finale di vous normalmente è muta, ma davanti alla vocale di êtes si lega con un suono z: vous êtes suona più o meno «vu-ZÈT». La liaison appartiene alla frase pronunciata, non alla sua grafia.'
  fr.a1.unit01.lesson03.teach.liaison_un_atelier:
    title: Liaison dopo un
    gloss: un laboratorio
    note: La n finale di un si lega ad atelier. Evita di inserire una pausa netta tra le due parole.
  fr.a1.unit01.lesson03.teach.final_e_enchante:
    title: Grafia al maschile
    gloss: piacere (detto da un uomo)
    note: 'Enchanté termina in é se chi parla è un uomo. La sillaba -an- è una vocale nasale: non pronunciare una n distinta come faresti in italiano leggendo «an».'
  fr.a1.unit01.lesson03.teach.final_e_enchantee:
    title: Grafia al femminile
    gloss: piacere (detto da una donna)
    note: Enchantée aggiunge una e per l'accordo al femminile, ma questa e in più normalmente non aggiunge una sillaba pronunciata.
  fr.a1.unit01.lesson03.teach.question_liaison:
    title: Leggere una domanda con inversione
    gloss: Come sta?
    note: Mantieni allez-vous legato come un'unica unità di domanda. La z scritta di allez qui non si pronuncia come una z in più; la pronuncia standard è più o meno «a-lè vu».
  fr.a1.unit01.lesson04.teach.ca_va:
    title: Domanda quotidiana su come si sta
    gloss: Come va?; Tutto bene?
    note: Ça contiene una cediglia, che fa suonare la c come s davanti ad a. La stessa espressione può essere una domanda o una risposta, a seconda dell'intonazione.
  fr.a1.unit01.lesson04.teach.tres_bien:
    title: Risposta molto positiva
    gloss: Molto bene, grazie.
    note: Très rafforza bien. La sua s finale è muta.
  fr.a1.unit01.lesson04.teach.ca_va_bien:
    title: Risposta positiva
    gloss: Sto bene.
    note: 'In questa risposta fissa il francese non usa il soggetto, e in italiano accade lo stesso: non serve un pronome corrispondente a «io».'
  fr.a1.unit01.lesson04.teach.pas_mal:
    title: Risposta moderatamente positiva
    gloss: Non c'è male.
    note: Pas mal è spesso moderatamente positivo, come il suo equivalente italiano «non c'è male».
  fr.a1.unit01.lesson04.teach.fatigue:
    title: Accordo dell'aggettivo al maschile
    gloss: Sono un po' stanco.
    note: Suis è la forma di je del verbo être. Un uomo scrive fatigué. Come in italiano «stanco» e «stanca», l'aggettivo cambia secondo il genere di chi parla, ma in francese il pronome je va sempre espresso.
  fr.a1.unit01.lesson04.teach.fatiguee:
    title: Accordo dell'aggettivo al femminile
    gloss: Sono un po' stanco.
    note: Una donna scrive fatiguée con una e finale. Le forme maschile e femminile normalmente si pronunciano allo stesso modo.
  fr.a1.unit01.lesson04.teach.et_vous:
    title: Restituire la domanda con cortesia
    gloss: E Lei?
    note: Vous mantiene il registro rispettoso usato con un adulto che non conosci.
  fr.a1.unit01.lesson04.teach.et_toi:
    title: Restituire la domanda in modo informale
    gloss: E Lei?
    note: Usa toi dopo et quando parli in modo informale a un amico o a un coetaneo.
  fr.a1.unit01.lesson05.teach.here_for_workshop:
    title: Confermare il motivo della presenza di qualcuno
    gloss: È qui per il laboratorio?
    note: Êtes è la forma di vous del verbo être. Come in italiano, la domanda si forma con l'intonazione ascendente, senza bisogno di altre parole.
  fr.a1.unit01.lesson05.teach.yes_thats_it:
    title: Confermare un'ipotesi
    gloss: Sì, è giusto.
    note: C’est ça è una conferma naturale, non un letterale «è questo».
  fr.a1.unit01.lesson05.teach.live_neighborhood:
    title: Chiedere dove abita qualcuno
    gloss: Abita nel quartiere?
    note: Habitez è la forma di vous del verbo habiter. Come in italiano, la domanda può avere l'ordine della frase affermativa con l'intonazione interrogativa.
  fr.a1.unit01.lesson05.teach.i_live:
    title: Dire dove si vive
    gloss: Abito a Montreuil.
    note: J’habite è la forma di je del verbo habiter con elisione. À indica un luogo come una città e non va confuso con a, la forma verbale che significa «ha».
  fr.a1.unit01.lesson05.teach.from_here:
    title: Chiedere l'origine locale
    gloss: È di qui?
    note: D’ici unisce de e ici tramite elisione. Êtes resta la forma di vous del verbo être.
  fr.a1.unit01.lesson05.teach.from_lille:
    title: Dire la propria provenienza
    gloss: Sono di Lille.
    note: Suis è la forma di je del verbo être. Per indicare la provenienza il francese usa de davanti a una città, come l'italiano «di».
  fr.a1.unit01.lesson05.teach.workshop_starts:
    title: L'attività comincia
    gloss: Il laboratorio sta per iniziare.
    note: Atelier è maschile, quindi il suo articolo singolare è le. Davanti a vocale, le diventa l’. Commence è la forma della terza persona singolare.
  fr.a1.unit01.lesson05.teach.see_you_shortly:
    title: Congedo a breve termine
    gloss: A tra poco; a più tardi
    note: À tout à l’heure implica un nuovo incontro più tardi nella stessa giornata, a differenza di un congedo generico senza un momento previsto.
  fr.a1.unit01.lesson06.teach.line01:
    title: Aprire l'incontro
    gloss: Inès saluta Mathieu e verifica che sia lì per il laboratorio di cucina.
    note: I due iniziano con vous perché sono adulti che non si conoscono.
  fr.a1.unit01.lesson06.teach.line02:
    title: Aprire l'incontro, risposta
    gloss: Mathieu conferma e dice il suo nome, poi chiede il nome di lei.
    note: Je m’appelle è il modo standard di dire il proprio nome.
  fr.a1.unit01.lesson06.teach.line03:
    title: Scambiarsi i nomi
    gloss: Inès dice il suo nome e che le fa piacere conoscerlo.
    note: Enchantée si accorda con Inès (femminile); la desinenza -e si scrive ma normalmente non si sente.
  fr.a1.unit01.lesson06.teach.line04:
    title: Scambiarsi i nomi, risposta
    gloss: Mathieu ricambia e chiede se lei abita nei dintorni.
    note: 'Enchanté si accorda con Mathieu (maschile): è la stessa parola appena usata da Inès, senza la -e muta.'
  fr.a1.unit01.lesson06.teach.line05:
    title: Scambiarsi informazioni sul quartiere
    gloss: Inès conferma e dice la sua via, poi pone la stessa domanda a Mathieu.
    note: Con J’habite e il nome di una via non si usa alcuna preposizione davanti a rue.
  fr.a1.unit01.lesson06.teach.line06:
    title: Scambiarsi informazioni sul quartiere, risposta
    gloss: Mathieu dice che abita a Saint-Ouen e chiede se lei è originaria di qui.
    note: J’habite à usa à davanti al nome di un luogo, a differenza dell'espressione con la via usata poco fa da Inès.
  fr.a1.unit01.lesson06.teach.line07:
    title: Scambiarsi informazioni sulla provenienza
    gloss: Inès dice che non è di qui, che è di Lille, poi lo chiede a Mathieu.
    note: Je suis de + nome di città indica di dove si è.
  fr.a1.unit01.lesson06.teach.line08:
    title: Scambiarsi le origini, risposta
    gloss: Mathieu dice di essere di Lione.
    note: Stesso schema je suis de appena usato da Inès.
  fr.a1.unit01.lesson06.teach.line09:
    title: Interrompere la conversazione
    gloss: Inès nota che il laboratorio sta per iniziare e dice che si rivedranno a breve.
    note: À tout à l’heure va bene perché entrambi resteranno nello stesso evento.
  fr.a1.unit01.lesson06.teach.line10:
    title: Interrompere la conversazione, risposta
    gloss: Mathieu ripete lo stesso saluto.
    note: Ripetere à tout à l’heure è il modo naturale di confermare.
