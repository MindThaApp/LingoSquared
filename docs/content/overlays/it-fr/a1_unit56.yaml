  fr.a1.unit56.lesson04.teach.pour_les_transports:
    title: À vélo, en train
    gloss: Il francese usa *à* per i mezzi su cui si sale in sella o che si usano camminando (*à vélo*, *à pied*) e *en* per i mezzi in cui si sta dentro (*en train*, *en voiture*).
    note: 'In italiano si dice «in bici» e «in treno», ma in francese le preposizioni cambiano: non dire *par vélo* né *dans le train*. Considera *à vélo*, *à pied*, *en train* e *en voiture* come espressioni fisse.'
