  fr.a1.unit56.lesson05.teach.camille_voyage_tous:
    title: Chi viaggia come?
    gloss: Camille viaggia in treno tutti i giorni per andare al lavoro. Mathieu va soprattutto in bici, ma quando piove prende anche il treno. Thomas preferisce andare in macchina. Léa abita vicinissimo e va al lavoro a piedi. Tu come vai al lavoro?
    note: Mette a confronto quattro modi diversi di andare al lavoro e una condizione (la pioggia), come nel testo di confronto sullo sport dell'unità precedente.
