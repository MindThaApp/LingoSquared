answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francese A1
  description: Fare confronti di base (plus/moins/aussi... que) e superlativi (le/la plus...), proseguendo la storia del laboratorio di cucina di Inès e Mathieu mentre confrontano due formaggi facendo la spesa. Si sottolinea che *meilleur* (migliore) e *le meilleur* (il migliore) sono irregolari, a differenza dello schema regolare *plus... que* usato per la maggior parte degli altri aggettivi.
units:
  fr.a1.unit14.comparisons:
    title: Più o meno?
lessons:
  fr.a1.unit14.lesson01.vocabulaire_comparaisons:
    title: Più, meno, quanto
  fr.a1.unit14.lesson02.superlatifs:
    title: Il più, il meno
  fr.a1.unit14.lesson03.dialogue_comparer_fromages:
    title: Confrontare due formaggi al mercato
teaching:
  fr.a1.unit14.lesson01.teach.plus_que:
    title: Più... di
    gloss: più... di / che
    note: '*Plus + adjectif + que* è il comparativo francese standard: come in italiano, basta mettere «plus» davanti all''aggettivo, senza cambiarne la forma.'
    example_gloss: Questo formaggio è più caro dell'altro.
  fr.a1.unit14.lesson01.teach.moins_que:
    title: Meno... di
    gloss: meno... di / che
    note: '*Moins* è l''esatto opposto di *plus* nello stesso schema comparativo.'
    example_gloss: Questa ricetta è meno difficile dell'altra.
  fr.a1.unit14.lesson01.teach.aussi_que:
    title: Così... come
    gloss: così... come / tanto... quanto
    note: '*Aussi + adjective + que* esprime uguaglianza tra due cose: in italiano corrisponde a «così... come» o «tanto... quanto».'
    example_gloss: La torta è buona quanto la quiche.
  fr.a1.unit14.lesson01.teach.meilleur_que:
    title: Migliore di
    gloss: migliore di
    note: '*Meilleur* è il comparativo irregolare di *bon* (buono): in francese non si dice *plus bon*. Anche in italiano esiste «migliore», accanto a «più buono».'
    example_gloss: Questo dolce è migliore del primo.
  fr.a1.unit14.lesson01.teach.cher_bon_marche:
    title: Caro, economico
    gloss: caro, economico / conveniente
    note: '*Bon marché* è invariabile (non cambia mai forma), anche se potrebbe sembrare che si accordi come gli altri aggettivi.'
    example_gloss:
    - Il formaggio è caro.
    - Le verdure costano poco.
  fr.a1.unit14.lesson01.teach.facile_difficile:
    title: Facile, difficile
    gloss: facile, difficile
    note: 'Una coppia di aggettivi molto comune per descrivere le ricette: hanno la stessa forma al maschile e al femminile; al plurale si aggiunge -s (*faciles*, *difficiles*).'
    example_gloss:
    - Questa ricetta è facile.
    - La quiche è un po' difficile.
  fr.a1.unit14.lesson02.teach.le_plus_cher:
    title: Il più caro
    gloss: il più caro
    note: '*Le/la plus + aggettivo* forma il superlativo: l''articolo determinativo è obbligatorio, a differenza del comparativo.'
    example_gloss: È il formaggio più caro del mercato.
  fr.a1.unit14.lesson02.teach.la_moins_chere:
    title: La meno cara
    gloss: la meno cara
    note: '*La moins chère* si accorda con il femminile *recette*; la forma maschile è *le moins cher*.'
    example_gloss: È la ricetta meno cara.
  fr.a1.unit14.lesson02.teach.le_meilleur:
    title: Il migliore
    gloss: il migliore
    note: '*Le meilleur* è il superlativo irregolare di *bon*, in coppia con il comparativo irregolare *meilleur* della prima lezione.'
    example_gloss: È il miglior dolce del laboratorio!
  fr.a1.unit14.lesson02.teach.la_plus_facile:
    title: La più facile
    gloss: la più facile
    note: Un superlativo regolare, che segue direttamente lo schema *le/la plus + aggettivo*.
    example_gloss: È la ricetta più facile da fare.
  fr.a1.unit14.lesson02.teach.grammar_superlative_note:
    title: Schema del superlativo
    gloss: le/la plus + aggettivo; meilleur è irregolare
    note: La maggior parte dei superlativi francesi è regolare (*le/la plus + aggettivo*), ma *bon* → *meilleur* → *le meilleur* è un'eccezione da memorizzare.
  fr.a1.unit14.lesson02.teach.comparer_les_prix:
    title: Proporre di confrontare i prezzi
    gloss: Confrontiamo i prezzi prima di comprare.
    note: '*Comparons* è l''imperativo alla forma *nous* di *comparer*, cioè «confrontiamo»: una frase naturale quando si fa la spesa.'
  fr.a1.unit14.lesson03.teach.line01:
    title: Accorgersi di due possibilità
    gloss: 'Inès dice di guardare, ci sono due tipi di formaggio: quale prendono?'
    note: '*Lequel* («quale») chiede all''altra persona di scegliere tra due opzioni già nominate.'
  fr.a1.unit14.lesson03.teach.line02:
    title: Confrontare e notare la qualità
    gloss: Mathieu dice che questo è più caro dell'altro, ma sembra migliore.
    note: '*Avoir l''air* + aggettivo («sembrare») attenua un giudizio sulla qualità di qualcosa che non è ancora stato assaggiato.'
  fr.a1.unit14.lesson03.teach.line03:
    title: Non essere d'accordo su un confronto
    gloss: Inès gli chiede se ne è sicuro e dice che secondo lei l'altro è buono altrettanto, e costa meno.
    note: Usa *aussi* e *moins* della prima lezione in un'unica risposta per dissentire con garbo; *que* è omesso perché il formaggio di confronto (quello di Mathieu) è chiaro dal contesto.
  fr.a1.unit14.lesson03.teach.line04:
    title: Ammettere il punto sul prezzo
    gloss: 'Mathieu è d''accordo: è vero, è il meno caro dei due.'
    note: '*Des deux* («dei due») limita il superlativo a questa coppia, e non a tutto il mercato.'
  fr.a1.unit14.lesson03.teach.line05:
    title: Prendere la decisione finale
    gloss: Inès dice che allora prendono quello, è l'opzione migliore per il laboratorio.
    note: '*Celui-là* («quello») rimanda al formaggio meno caro di cui si è appena parlato.'
  fr.a1.unit14.lesson03.teach.line06:
    title: Notare il vantaggio
    gloss: Mathieu è d'accordo e dice che gli resteranno più soldi per il dessert!
    note: '*Il nous reste* (letteralmente «ci resta») è un modo comune per dire «ci rimane...».'
