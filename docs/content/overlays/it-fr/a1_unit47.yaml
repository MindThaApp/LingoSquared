teaching:
  fr.a1.unit47.lesson01.teach.le_temps:
    title: Il tempo
    gloss: il tempo (meteorologico)
    note: '*Le temps* significa sia «tempo atmosferico» sia «tempo» (cronologico); è maschile.'
    example_gloss: Che tempo fa?
  fr.a1.unit47.lesson01.teach.quel_temps_fait:
    title: Chiedere che tempo fa
    gloss: Che tempo fa?
    note: '*Quel temps fait-il ?* è la domanda standard sul tempo atmosferico; *quel* concorda con il nome maschile *temps*.'
  fr.a1.unit47.lesson01.teach.le_temps_est:
    title: Soleggiato
    gloss: C'è il sole.
    note: '*Le temps est* + aggettivo è una struttura standard; l''aggettivo concorda con il nome maschile *temps*.'
  fr.a1.unit47.lesson01.teach.il_pleut:
    title: Pioggia
    gloss: Piove.
    note: '*Pleuvoir* (piovere) si usa in modo impersonale: *il pleut*, senza bisogno di un aggettivo.'
  fr.a1.unit47.lesson01.teach.le_temps_est_2:
    title: Nuvoloso
    gloss: È nuvoloso.
    note: Segue la stessa struttura *le temps est* + aggettivo di *ensoleillé*.
  fr.a1.unit47.lesson02.teach.il_fait_froid:
    title: Freddo
    gloss: Oggi fa freddo.
    note: '*Aujourd''hui* (oggi) colloca il tempo atmosferico nel tempo; *il fait froid* usa *faire*, non *être*.'
  fr.a1.unit47.lesson02.teach.il_fait_chaud:
    title: Caldo
    gloss: Oggi fa caldo.
    note: '*Il fait chaud* copre sia «fa caldo» sia «fa molto caldo» nel linguaggio quotidiano sul tempo.'
  fr.a1.unit47.lesson02.teach.il_ne_fait:
    title: Temperature a confronto
    gloss: Non fa freddo, fa caldo.
    note: '*Ne ... pas* racchiude il verbo: *il ne fait pas froid*.'
  fr.a1.unit47.lesson03.teach.la_meteo:
    title: Le previsioni del tempo
    gloss: le previsioni del tempo
    note: '*La météo* è femminile ed è l''abbreviazione di *la météorologie*.'
    example_gloss: Quali sono le previsioni del tempo?
  fr.a1.unit47.lesson03.teach.demain_le_temps:
    title: Il tempo di domani
    gloss: Domani c'è il sole.
    note: '*Demain* apre la frase, seguito da una virgola; il resto mantiene il suo ordine normale.'
  fr.a1.unit47.lesson03.teach.samedi_le_temps:
    title: Previsioni per due giorni
    gloss: Sabato c'è il sole e fa caldo, ma domenica piove tutto il giorno.
    note: '*Toute la journée* (tutto il giorno) sottolinea quanto dura la pioggia.'
  fr.a1.unit47.lesson04.teach.la_promenade:
    title: La passeggiata
    gloss: la passeggiata
    note: '*Promenade* è femminile: *la promenade*.'
    example_gloss: Facciamo una passeggiata?
  fr.a1.unit47.lesson04.teach.on_fait_une:
    title: Proporre una passeggiata
    gloss: Facciamo una passeggiata?
    note: '*On fait une promenade ?* è un modo amichevole per proporre un programma; *faire une promenade* è l''espressione fissa per dire «fare una passeggiata».'
  fr.a1.unit47.lesson04.teach.s_il_pleut:
    title: Un programma condizionato
    gloss: Se piove, restiamo in casa.
    note: '*S''il pleut* (se piove): *si* + *il* diventa *s''il*; poi *on reste à l''intérieur* dice cosa si fa.'
  fr.a1.unit47.lesson04.teach.bonne_idee_faisons:
    title: Accettare e proporre
    gloss: Buona idea! Facciamo una passeggiata.
    note: '*Faisons ...* («facciamo ...») è un altro modo comune per proporre un''attività, accanto a *On ... ?*'
  fr.a1.unit47.lesson05.teach.meteo_samedi_le:
    title: Leggi le previsioni di due giorni
    gloss: 'Previsioni del tempo: sabato c''è il sole e fa caldo. Domenica piove tutto il giorno.'
    note: Fai attenzione a quale giorno ha quali condizioni.
    glosses:
      Météo: previsioni del tempo
      samedi: sabato
      ensoleillé: soleggiato
      chaud: caldo
      Dimanche: domenica
      pleut: piove
      toute: intera
      journée: giorno
  fr.a1.unit47.lesson06.teach.camille_quel_temps:
    title: Camille chiede del fine settimana
    gloss: 'Camille: Che tempo fa questo fine settimana?'
    note: '*Ce week-end* (questo fine settimana) colloca la domanda nel futuro prossimo.'
  fr.a1.unit47.lesson06.teach.mathieu_samedi_le:
    title: Mathieu dà le previsioni
    gloss: 'Mathieu: Sabato c''è il sole e fa caldo, ma domenica piove tutto il giorno.'
    note: Corrisponde esattamente alle previsioni lette nella lezione 5.
  fr.a1.unit47.lesson06.teach.camille_alors_on:
    title: Camille propone un programma
    gloss: 'Camille: Allora facciamo una passeggiata sabato?'
    note: '*Alors* (allora) collega la proposta al bel tempo appena descritto da Mathieu.'
  fr.a1.unit47.lesson06.teach.mathieu_bonne_idee:
    title: Mathieu accetta e organizza la domenica
    gloss: 'Mathieu: Buona idea. E domenica restiamo tranquillamente in casa.'
    note: '*Tranquillement* qui significa «con calma, senza fretta» e rende piacevole l''idea di restare in casa.'
  fr.a1.unit47.lesson06.teach.camille_parfait_alors:
    title: Camille conferma il programma
    gloss: 'Camille: Perfetto, allora guardiamo un film.'
    note: '*Regarder* (guardare) si abbina naturalmente a *un film* (un film).'
