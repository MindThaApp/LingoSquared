teaching:
  fr.a1.unit51.lesson01.teach.combien_ca_coute:
    title: Chiedere il prezzo totale
    gloss: Quanto costa in totale?
    note: '*En tout* (in tutto) chiarisce che vuoi il prezzo complessivo, non quello di un solo articolo.'
  fr.a1.unit51.lesson01.teach.ca_coute_vingt:
    title: Dire il prezzo totale
    gloss: Costa venticinque euro in totale.
    note: '*Ça coûte* usa *ça* (esso) con *coûte*, la forma di *coûter* (costare) usata per una sola cosa.'
  fr.a1.unit51.lesson02.teach.payer_par_carte:
    title: Pagare con la carta o in contanti
    gloss: pagare con la carta, pagare in contanti
    note: '*Payer par carte* è il modo abituale per dire che si paga con carta, e *payer en espèces* significa pagare in contanti. Usa *par* con *carte* e *en* con *espèces*.'
    example_gloss:
    - Posso pagare con la carta qui?
    - Pago in contanti.
  fr.a1.unit51.lesson02.teach.je_peux_payer:
    title: Chiedere se si può pagare con la carta
    gloss: Posso pagare con la carta qui?
    note: '*Ici* (qui) colloca la domanda alla cassa, dove ti trovi.'
  fr.a1.unit51.lesson02.teach.vous_voulez_payer:
    title: Chiedere come si preferisce pagare
    gloss: Preferisce pagare in contanti o con la carta?
    note: '*Vous voulez ... ?* è il modo formale di chiedere, usato da un cassiere che non conosci; gli amici direbbero *tu veux ... ?*.'
  fr.a1.unit51.lesson03.teach.l_addition:
    title: Il conto
    gloss: il conto
    note: '*Addition* è femminile: *l''addition*. *La* diventa *l''* davanti a vocale.'
    example_gloss: Dividiamo il conto?
  fr.a1.unit51.lesson03.teach.on_partage_l:
    title: Proporre di dividere il conto
    gloss: Dividiamo il conto?
    note: '*On ... ?* propone di fare qualcosa insieme, come in *On partage ?*. *Partager* (dividere) si usa con *l''addition*.'
  fr.a1.unit51.lesson03.teach.je_peux_payer:
    title: Chiedere di pagare separatamente
    gloss: Posso pagare separatamente?
    note: '*Séparément* (separatamente) va subito dopo *payer*; è il modo educato di chiedere di pagare la propria parte del conto.'
  fr.a1.unit51.lesson04.teach.la_monnaie:
    title: Il resto
    gloss: il resto
    note: '*Monnaie* è femminile: *la monnaie*. Indica le monete e le banconote che ricevi come resto.'
    example_gloss: Ecco il suo resto.
  fr.a1.unit51.lesson04.teach.voici_votre_monnaie:
    title: Dare il resto
    gloss: Ecco il suo resto.
    note: '*Votre* è il «vostro/suo» di cortesia, in linea con il registro *vous* alla cassa.'
  fr.a1.unit51.lesson04.teach.je_n_ai:
    title: Rifiutare il resto
    gloss: Non mi serve il resto.
    note: '*Avoir besoin de* (aver bisogno di) è seguito da un nome: *Je n''ai pas besoin de monnaie.* Dopo *ne ... pas*, *de* sostituisce *de la*.'
  fr.a1.unit51.lesson05.teach.trente_cinq:
    title: Trentacinque
    gloss: trentacinque
    note: '*Trente-cinq* si scrive con il trattino e mette prima le decine: trenta + cinque.'
    example_gloss: Costa trentacinque euro.
  fr.a1.unit51.lesson05.teach.addition_deux_plats:
    title: Leggere un conto del ristorante
    gloss: 'Conto: due piatti principali e due caffè. Totale: trentacinque euro. Pagato con carta.'
    note: Individua che cosa è stato ordinato, il totale e come è stato pagato.
    glosses:
      Addition: conto
      deux: due
      plats: piatti principali
      cafés: caffè
      Total: totale
      trente-cinq: trentacinque
      euros: euro
      Payé: pagato
      carte: carta
  fr.a1.unit51.lesson06.teach.camille_on_demande:
    title: Camille chiede il conto
    gloss: 'Camille: Chiediamo il conto?'
    note: '*Demander* (chiedere) ha come complemento diretto *l''addition*, senza altre parole.'
  fr.a1.unit51.lesson06.teach.mathieu_oui_bonne:
    title: Mathieu chiede il totale
    gloss: 'Mathieu: Sì, buona idea. Quanto costa in tutto?'
    note: Riprende la domanda *Combien ça coûte en tout ?* della lezione 1.
  fr.a1.unit51.lesson06.teach.camille_ca_fait:
    title: Camille dice il totale
    gloss: 'Camille: Sono trentacinque euro. Dividiamo?'
    note: '*Ça fait* + una somma indica il totale, e *partager* si riferisce al conto.'
  fr.a1.unit51.lesson06.teach.mathieu_non_laisse:
    title: Mathieu insiste per pagare
    gloss: 'Mathieu: No, lascia pagare me oggi. Mi hai aiutato tantissimo.'
    note: '*Laisse-moi* + infinito serve a offrirsi di fare qualcosa, e *aidé* è il participio passato di *aider* (aiutare).'
  fr.a1.unit51.lesson06.teach.camille_c_est:
    title: Camille è commossa
    gloss: 'Camille: Che gentile da parte tua! Grazie.'
    note: '*C''est gentil de ta part* (è gentile da parte tua) è un complimento caloroso e molto comune per un gesto generoso.'
  fr.a1.unit51.lesson06.teach.mathieu_je_peux:
    title: Mathieu chiede di pagare con la carta
    gloss: 'Mathieu: Posso pagare con la carta qui?'
    note: Riprende *Je peux payer par carte ici ?* della lezione 2, ora nel ristorante vero e proprio.
  fr.a1.unit51.lesson06.teach.mathieu_paie_l:
    title: 'Paie: la forma di lui/lei'
    gloss: Mathieu paga il conto.
    note: '*Paie* è la forma *il/elle* di *payer* (pagare): *je paie, tu paies, il paie*.'
