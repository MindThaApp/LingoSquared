  es.a1.unit07.lesson01.el_mercado:
    title: 市场
  es.a1.unit07.lesson02.preguntar_el_precio:
    title: 询问价格
  es.a1.unit07.lesson03.cantidades:
    title: 数量：一打、一公斤、一点
  es.a1.unit07.lesson04.una_compra_sencilla:
    title: 一次简单的购物
  es.a1.unit07.lesson05.leer_las_etiquetas_de_precio:
    title: 看懂价格标签
  es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue:
    title: Elena 和 Mateo 去市场
teaching:
  es.a1.unit07.lesson01.teach.el_mercado:
    title: 市场
    gloss: 市场
    note: '*Mercado* 是阳性名词。'
    example_gloss: 我们去市场吧。
  es.a1.unit07.lesson01.teach.fruta_verdura:
    title: 水果、蔬菜
    gloss: 水果，蔬菜
    note: '*Verdura* 泛指蔬菜(通常指绿叶菜);它是阴性单数名词，也可以作集合名词使用，类似中文的“蔬菜”。'
    example_gloss:
    - 我想买水果。
    - 蔬菜很新鲜。
  es.a1.unit07.lesson01.teach.huevos_pan:
    title: 鸡蛋、面包
    gloss: 鸡蛋，面包
    note: '*Huevos* 本身已经是复数（单数是 *huevo*）；*pan*（面包）是不可数名词，日常用法中没有自然的复数形式。'
    example_gloss:
    - 我需要鸡蛋。
    - 这面包是今天早上的。
  es.a1.unit07.lesson02.teach.cuanto_cuesta:
    title: 询问价格
    gloss: 多少钱？
    note: '*Cuesta* 是动词 *costar*（值多少钱）的第三人称形式，是本单元的新动词。'
  es.a1.unit07.lesson02.teach.cuanto_es:
    title: 询问价格的另一种说法
    gloss: 一共多少钱？
    note: 请看下一张语法卡片，其中比较了这句和 *¿Cuánto cuesta?* 的用法。
  es.a1.unit07.lesson02.teach.cuesta_dos:
    title: 说出价格
    gloss: 价格是二。
    note: 这是简短而完整的报价回答：货币或单位可以从语境中得知，就像中文购物时也常常只说一个数字，比如“两块”或直接说“二”。
  es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note:
    title: Cuánto cuesta 与 Cuánto es
    gloss: 两种同样自然的询价说法。
    note: 请看卡片上的说明。
    target_text: '*¿Cuánto cuesta?*(多少钱？)和 *¿Cuánto es?*(一共多少钱？)都是询问价格的自然说法——在日常购物中可以互换。'
  es.a1.unit07.lesson03.teach.una_docena_de_huevos:
    title: 要一打鸡蛋
    gloss: 请给我一打鸡蛋。
    note: '*Docena*（一打）在西班牙语中是名词，后面总是接 *de* 再加物品名称，这与中文“一打鸡蛋”直接用量词加名词的结构不同。'
  es.a1.unit07.lesson03.teach.un_kilo_de_tomates:
    title: 要一公斤西红柿
    gloss: 请给我一公斤西红柿。
    note: '*Kilo* 与 *docena* 一样，采用 *de* 加物品的结构。'
  es.a1.unit07.lesson03.teach.medio_kilo:
    title: 半公斤
    gloss: 半公斤
    note: '*Medio*（半）放在所修饰的名词之前，并与名词的性保持一致（*medio kilo* 是阳性；*media docena* 则是阴性）。'
    example_gloss: 请给我半公斤面包。
  es.a1.unit07.lesson03.teach.un_poco_de:
    title: 一点
    gloss: 一点
    note: '*Un poco de* 用于表示不确定的少量，不需要说出确切数量时使用。'
    example_gloss: 我想要一点水果。
  es.a1.unit07.lesson04.teach.necesita_algo_mas:
    title: 询问是否还需要别的
    gloss: 您还需要别的吗？
    note: '*Necesita* 是 *necesitar* 的 *usted* 形式，是小贩对顾客通常使用的礼貌说法。'
  es.a1.unit07.lesson04.teach.no_creo_que_ya_tenemos_todo:
    title: 表示东西都买齐了
    gloss: 不用了，我想我们都买齐了。
    note: '*Creo que*（我想……）是常见的委婉说法，这里用来确认购物清单已经齐全。'
  es.a1.unit07.lesson04.teach.gracias_vendedor:
    title: 向小贩道谢
    gloss: 太好了，谢谢。
    note: 这是买东西结束时简短自然的收尾用语。
  es.a1.unit07.lesson05.teach.etiquetas_reading:
    title: 看懂价格标签
    gloss: 罗莎的摊位：西红柿，每公斤二。鸡蛋，每打四。面包，六。新鲜水果，每天供应。
    note: 这是典型的市场摊位价格标签：先写商品，再写价格，最后写价格对应的单位（*el kilo*、*la docena*）。*Puesto* 指市场摊位，这个摊位是罗莎经营的。
    glosses:
      Puesto: 摊位
      tomates: 西红柿
      kilo: 公斤
      Huevos: 鸡蛋
      docena: 一打
      Pan: 面包
      Fruta: 水果
      fresca: 新鲜的
      todos: 每一
      días: 天
  es.a1.unit07.lesson05.teach.el_kilo_note:
    title: El kilo 表示“每公斤”
    gloss: 价格后面的单位词如何表示“每”个这样的单位。
    note: 请看卡片上的说明。
    target_text: 价格后面的 *El kilo*(如“tomates, dos el kilo”)表示“每公斤”——这个价格适用于你买的每一公斤。
  es.a1.unit07.lesson06.teach.line01:
    title: 提议去市场
    gloss: 埃琳娜提议去市场买下次课的食材。
    note: '*Para la próxima clase* 的意思是“为下一次课”，指烹饪工作坊的下一节课。'
  es.a1.unit07.lesson06.teach.line02:
    title: 表示同意并询问需要什么
    gloss: 马特奥表示同意，并问他们需要什么。
    note: '*¿Qué necesitamos?* 使用 *necesitar* 的 *nosotros* 形式，表示“我们”一起需要。'
  es.a1.unit07.lesson06.teach.line03:
    title: 指出新鲜的西红柿
    gloss: 埃琳娜说先买蔬菜，并指出西红柿看起来多么新鲜。
    note: '*¡Qué tomates tan frescos!*（多新鲜的西红柿啊！）是用 *qué* 构成的感叹句，和第3单元的 *¡Qué bonito!* 类似，但这里带有名词：*qué* + 名词 + *tan* + 形容词。'
  es.a1.unit07.lesson06.teach.line04:
    title: 小贩询问数量
    gloss: 小贩问埃琳娜想要多少。
    note: '*Señorita* 是称呼年轻女士的礼貌说法，与小贩对顾客使用的 *usted* 敬称相配（如今有些人觉得这个词略显老派）。'
  es.a1.unit07.lesson06.teach.line05:
    title: 要一公斤并询问价格
    gloss: 埃琳娜要了一公斤，并询问价格。
    note: 在一次自然的对话中，把 *un kilo* 与本单元前面学过的 *¿Cuánto cuesta?* 结合在一起。
  es.a1.unit07.lesson06.teach.line06:
    title: 说出价格
    gloss: 小贩说要两块。
    note: '*Cuesta dos*——简短的报价回答，货币可以从语境中得知。'
  es.a1.unit07.lesson06.teach.line07:
    title: 马特奥要鸡蛋和面包
    gloss: 马特奥说他需要一打鸡蛋和面包。
    note: 把本单元前面学过的 *huevos*/*pan* 与 *una docena de* 结合起来；*yo* 可以省略，加上它会略带强调（“我需要……”）。
  es.a1.unit07.lesson06.teach.line08:
    title: 小贩说出两种价格
    gloss: 小贩说鸡蛋四块，面包六块。
    note: '*Cuestan*（复数，值……钱）与复数主语 *los huevos* 一致，不同于西红柿所用的单数 *cuesta*。'
  es.a1.unit07.lesson06.teach.line09:
    title: 向小贩道谢
    gloss: 马特奥说好的，谢谢。
    note: 与本单元前面相同的简短收尾用语。
  es.a1.unit07.lesson06.teach.line10:
    title: 问朋友是否还需要别的
    gloss: 埃琳娜问马特奥还需要别的吗。
    note: '*¿Necesitas...?* 是 *tú* 形式，用于朋友之间；小贩说的 *¿Necesita...?* 则是 *usted* 形式。'
  es.a1.unit07.lesson06.teach.line11:
    title: 表示东西都买齐了
    gloss: 马特奥说不用了，他想他们已经都有了。
    note: '*Creo que*（我想……）使回答更委婉；*ya* 的意思是“已经”。'
