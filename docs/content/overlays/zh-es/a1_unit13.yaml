course:
  title: 西班牙语 A1
  description: 谈论自己的工作，延续埃琳娜和马特奥的故事：7月22日工作坊课间休息时，他们聊起各自的本职工作——马特奥是会计，埃琳娜是老师——并发现两人都更喜欢一起做饭。
