    gloss: 这个服务台
    note: '*Escritorio* 是阳性名词。'
    example_gloss: 这是我的办公桌。
  es.a1.unit13.lesson01.teach.la_escuela:
    title: 学校
    gloss: 学校
    note: '*Escuela* 是阴性名词。'
    example_gloss: 我在一所学校教书。
  es.a1.unit13.lesson01.teach.los_estudiantes:
    title: 学生们
    gloss: 学生们
    note: '*Estudiante* 无论男女形式都相同；复数 *los estudiantes* 可以指男女混合的一群人。'
    example_gloss: 我有二十名学生。
  es.a1.unit13.lesson02.teach.trabajar:
    title: 工作
    gloss: 工作
    note: 动词的不定式形式，用于 *me gusta trabajar*(我喜欢工作)这类结构。
  es.a1.unit13.lesson02.teach.soy_contador:
    title: 说你是会计
    gloss: 我是会计。
    note: 表示职业时用 *ser* + 职业，不加冠词——见下面的语法卡片。
  es.a1.unit13.lesson02.teach.soy_profesora:
    title: 说你是老师(阴性)
    gloss: 我是老师。
    note: '*Profesora* 是 *profesor* 的阴性形式。'
  es.a1.unit13.lesson02.teach.enseno_en_una_escuela:
    title: 说你在哪里教书
    gloss: 我在一所学校教书。
    note: '*Enseño*(我教)是 *enseñar* 的第一人称形式，这里和 *escuela*(学校)搭配。'
  es.a1.unit13.lesson02.teach.contador_vs_profesora_note:
    title: 用 ser 表示职业
    gloss: 西班牙语表示职业时不加冠词的方式。
    note: 见卡片本身的内容。
    target_text: 表示职业时，用 *ser* + 职业，不加冠词：*soy contador*(我是会计),而不是 *soy un contador*。*Contador* 有对应的阴性形式 *contadora*;*profesor/profesora* 也是同类的阳性/阴性一对，表示“老师”(女性加 *-a*)。
  es.a1.unit13.lesson03.teach.en_que_trabajas:
    title: 询问别人的工作
    gloss: 你是做什么工作的？
    note: '*¿En qué trabajas?*(字面意思是“你在什么上工作？”)是询问别人职业的标准说法。'
  es.a1.unit13.lesson03.teach.trabajo_en_una_oficina_soy_contador:
    title: 回答你的工作
    gloss: 我在办公室工作。我是会计。
    note: 把 *oficina* 和 *soy contador* 组合成自然的两句回答。
  es.a1.unit13.lesson04.teach.me_gusta_mi_trabajo:
    title: 说你喜欢自己的工作
    gloss: 我喜欢我的工作。
    note: 再次使用 *gustar* 结构，搭配 *mi trabajo*(我的工作)。
  es.a1.unit13.lesson04.teach.pero_prefiero_cocinar:
    title: 表达偏好
    gloss: 但我更喜欢做饭。
    note: '*Prefiero*(我更喜欢)你之前见过；*cocinar*(做饭)是整个故事主线中核心活动的不定式形式。'
  es.a1.unit13.lesson04.teach.los_dos_preferimos_esto:
    title: 说你们两人都更喜欢这个
    gloss: 我们两人都更喜欢这个。
    note: '*Preferimos* 是 *preferir* 的 *nosotros* 形式，用于埃琳娜和马特奥达成一致时。'
  es.a1.unit13.lesson05.teach.trabajos_reading:
    title: 阅读：他们的工作
    gloss: 马特奥在伦敦的一间办公室工作。他是会计。埃琳娜在一所学校教书。她是老师，有二十名学生。两人都喜欢自己的工作，但他们更喜欢周二一起做饭。
    note: 简要介绍马特奥和埃琳娜的本职工作。
    glosses:
      trabaja: 工作(来自 trabajar)
      oficina: 办公室
      contador: 会计
      enseña: 教(来自 enseñar)
      escuela: 学校
      profesora: 老师
      tiene: 有(来自 tener)
      veinte: 二十
      estudiantes: 学生们
      gusta: 令人喜欢、被喜欢(来自 gustar)
      trabajo: 工作
      prefieren: 更喜欢
      cocinar: 做饭
      juntos: 一起
      martes: 每个星期二
  es.a1.unit13.lesson05.teach.a_los_dos_les_gusta_note:
    title: A los dos les gusta
    gloss: gustar 如何用于复数的间接宾语。
    note: 见卡片本身的内容。
    target_text: '*A los dos les gusta*(他们两人都喜欢)把你已经学过的 *gustar* 结构扩展到复数间接宾语：用 *les*(对他们)而不是 *me/te*(对我/你)。'
  es.a1.unit13.lesson06.teach.line01:
    title: 询问马特奥的工作
    gloss: 埃琳娜问马特奥是做什么工作的。
    note: 这是你之前学过的问句，现在直接称呼马特奥来问。
  es.a1.unit13.lesson06.teach.line02:
    title: 回答自己的工作
    gloss: 马特奥说他在一间办公室工作，是会计。
    note: 这是你之前学过的完整回答：先说在哪里工作，再说职业。
  es.a1.unit13.lesson06.teach.line03:
    title: 回应并介绍她自己的工作
    gloss: 埃琳娜觉得很有意思，并说自己是老师。
    note: '*Interesante*（有趣的）是一个新的同源词，词形和意思都很容易辨认；其余部分 *soy profesora* 和 *enseño en una escuela* 你已经学过。'
  es.a1.unit13.lesson06.teach.line04:
    title: 问她是否喜欢教书
    gloss: 马特奥问她是否喜欢教书。
    note: '*¿Te gusta enseñar?* 把已学过的 *gustar* 问句结构与动词原形 *enseñar* 结合在一起。'
  es.a1.unit13.lesson06.teach.line05:
    title: 肯定并补充自己的偏好
    gloss: 埃琳娜说她很喜欢，但更喜欢星期二和他一起做饭。
    note: '*Contigo*（和你一起）是介词与代词合成的新形式；*los martes*（每个星期二）用复数冠词表示每周固定的某一天。'
  es.a1.unit13.lesson06.teach.line06:
    title: 表示同样的偏好
    gloss: 马特奥说他也喜欢自己的工作，但更喜欢做饭。
    note: '*A mí también*（我也是）是 *gustar* 表示赞同的强调说法：*a mí* 强调是谁喜欢。'
  es.a1.unit13.lesson06.teach.line07:
    title: 得出结论
    gloss: 埃琳娜总结说，他们两个人都更喜欢这件事（一起做饭）。
    note: '*Entonces*（那么、所以）是一个新的逻辑连接词；其余部分是 *los dos preferimos esto*（我们俩都更喜欢这个）。'
  es.a1.unit13.lesson06.teach.line08:
    title: 热情地表示同意
    gloss: 马特奥表示同意，说当然。
    note: '*Definitivamente*（绝对地、当然）是一个新的同源副词，为这一幕收尾。'
