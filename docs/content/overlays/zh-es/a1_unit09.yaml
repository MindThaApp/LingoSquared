course:
  title: 西班牙语 A1
  description: 学习问路和按指示走路的基本表达，延续第8单元埃琳娜和马特奥的故事，这次由埃琳娜带马特奥去图书馆。本单元会说明 doblar 和 girar 是可以互换的地区性说法，意思上没有区别。
