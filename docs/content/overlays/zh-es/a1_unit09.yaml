    example_gloss: 银行在拐角处。
  es.a1.unit09.lesson02.teach.seguir_derecho:
    title: 一直往前走
    gloss: 一直往前走。
    note: '*Sigue* 是动词 *seguir*（跟随、继续）的非正式命令式，本单元的指路中会反复用到。'
  es.a1.unit09.lesson02.teach.doblar_izquierda:
    title: 向左拐
    gloss: 向左转。
    note: '*Dobla* 是动词 *doblar*（转弯、折叠）的非正式命令式。请看后面关于 *doblar* 和 *girar* 的语法说明。'
  es.a1.unit09.lesson02.teach.girar_derecha:
    title: 向右拐
    gloss: 向右转。
    note: '*Gira* 是动词 *girar*（转弯、转动）的非正式命令式，和 *doblar* 完全可以互换。'
  es.a1.unit09.lesson02.teach.cruzar_la_calle:
    title: 过马路
    gloss: 过马路。
    note: '*Cruza* 是动词 *cruzar*（穿过）的非正式命令式。'
  es.a1.unit09.lesson02.teach.doblar_vs_girar_note:
    title: Doblar 与 girar
    gloss: 表示“转弯”的两个同样自然的词。
    note: 请看卡片上的说明。
    target_text: '*Doblar* 和 *girar* 都表示“转弯”，在这里完全可以互换，只是不同地区的习惯不同，并不是语体或意思上的差别。本单元两个词都会用到。'
  es.a1.unit09.lesson03.teach.como_llego_a_la_biblioteca:
    title: 问怎么去某个地方
    gloss: 我怎么去图书馆？
    note: '*Cómo llego a*（我怎么去）是询问去某个具体地点怎么走的标准说法。'
  es.a1.unit09.lesson03.teach.es_facil:
    title: 说“很容易”
    gloss: 很容易。
    note: 指路前常说的一句让人安心的话。
  es.a1.unit09.lesson03.teach.sigue_derecho_por_esta_calle:
    title: 沿着这条街一直走
    gloss: 沿着这条街一直走。
    note: '*Por esta calle*（沿着这条街）指明要沿着哪条街走。'
  es.a1.unit09.lesson03.teach.dobla_a_la_izquierda_en_la_esquina:
    title: 在拐角处向左拐
    gloss: 在拐角处向左拐。
    note: '*En la esquina*（在拐角处）说明在哪里转弯。'
  es.a1.unit09.lesson04.teach.esta_bien_asi:
    title: 请对方确认
    gloss: 这样对吗？
    note: '*¿Está bien así?*（这样可以吗？）用于复述路线后确认自己有没有听懂，是听完指路后很自然的下一步。'
  es.a1.unit09.lesson04.teach.si_asi_es:
    title: 确认
    gloss: 对，就是这样。
    note: '*Así es*（就是这样）是自然简短的确认说法。'
  es.a1.unit09.lesson04.teach.no_te_pierdas:
    title: 别迷路
    gloss: 别迷路了！
    note: '*No te pierdas* 是动词 *perderse*（迷路）的非正式否定命令式，是一句亲切随意的道别话。'
  es.a1.unit09.lesson05.teach.direcciones_reading:
    title: 阅读书面指路
    gloss: 从市场去图书馆：沿着这条街一直走。在拐角处向左拐。然后过马路。图书馆就在右边。
    note: 书面指路按顺序列出步骤：*Para llegar a...*（要去……）说明目的地，然后每一步都用 *tú* 的命令式（*sigue*、*dobla*、*cruza*），*después*（然后）把各个步骤连接起来。
    glosses:
      llegar: 到达
      biblioteca: 图书馆
      desde: 从
      mercado: 市场
      sigue: 继续走（来自 seguir）
      derecho: 一直向前
      calle: 街道
      Dobla: 转弯（来自 doblar）
      izquierda: 左
      esquina: 拐角
      Después: 然后
      cruza: 穿过（来自 cruzar）
      está: 位于（来自 estar）
      derecha: 右
  es.a1.unit09.lesson05.teach.desde_note:
    title: Desde（从）
    gloss: desde 如何表示路线的起点。
    note: 请看卡片上的说明。
    target_text: '*Desde*（从）表示路线的起点，与表示目的地的 *a*（到）搭配使用：*desde el mercado* ... *a la biblioteca*。'
  es.a1.unit09.lesson06.teach.line01:
    title: 问路
    gloss: 马特奥问埃琳娜从市场怎么去图书馆。
    note: 还是本单元前面学过的 *¿Cómo llego a...?* 这个问句，这次加上了起点：*desde el mercado*（从市场）。
  es.a1.unit09.lesson06.teach.line02:
    title: 说出第一步
    gloss: 埃琳娜说很容易，并给出第一个指示。
    note: '*Es fácil*（很容易）是在说出第一步之前让对方放心的话。'
  es.a1.unit09.lesson06.teach.line03:
    title: 复述并问下一步
    gloss: 马特奥复述指示，并问接下来怎么走。
    note: '*Sigo derecho*（我一直往前走）是 *seguir* 的第一人称形式，表示马特奥一边听一边在确认。'
  es.a1.unit09.lesson06.teach.line04:
    title: 说出第二步
    gloss: 埃琳娜告诉他在拐角处向左拐。
    note: '*Dobla*（拐）——这里用 *gira* 意思也一样。'
  es.a1.unit09.lesson06.teach.line05:
    title: 复述并确认
    gloss: 马特奥复述转弯的步骤，并问这样对不对。
    note: '*Doblo*（我拐）与前面的 *Sigo derecho* 相呼应——马特奥用 *yo* 的形式逐步复述每一步来核对。'
  es.a1.unit09.lesson06.teach.line06:
    title: 确认并说出最后几步
    gloss: 埃琳娜确认无误，然后告诉他过马路，图书馆就在右边。
    note: '*Sí, así es*（对，没错）用来确认，然后 *después*（然后）引出路线的最后几步。'
  es.a1.unit09.lesson06.teach.line07:
    title: 感谢 Elena
    gloss: Mateo 热情地感谢 Elena。
    note: '*Muchas gracias*（非常感谢）比简单的 *gracias* 更热情。'
  es.a1.unit09.lesson06.teach.line08:
    title: 回应并道别
    gloss: Elena 说不客气，并叮嘱他别迷路。
    note: '*De nada*（不客气）是回应 *gracias* 的标准说法。'
