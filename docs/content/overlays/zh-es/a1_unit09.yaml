teaching:
  es.a1.unit09.lesson01.teach.la_calle:
    title: 街道
    gloss: 街道
    note: '*Calle* 是阴性名词。'
    example_gloss: 我住在这条街上。
  es.a1.unit09.lesson01.teach.la_esquina:
    title: 拐角
    gloss: 拐角
