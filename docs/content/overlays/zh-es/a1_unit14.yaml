teaching:
  es.a1.unit14.lesson01.teach.el_apartamento:
    title: 公寓
    gloss: 公寓
    note: '*Apartamento* 是阳性名词。'
    example_gloss: 我住在一套小公寓里。
  es.a1.unit14.lesson01.teach.la_cocina:
    title: 厨房
    gloss: 厨房
    note: 这个词还有“烹饪”的意思，请看下面的语法说明。
    example_gloss: 我的厨房很小。
  es.a1.unit14.lesson01.teach.el_dormitorio:
    title: 卧室
    gloss: 卧室
    note: '*Dormitorio* 是阳性名词，来自 *dormir*（睡觉）。'
    example_gloss: 卧室里有一张大床。
  es.a1.unit14.lesson01.teach.el_bano:
    title: 卫生间
    gloss: 卫生间
    note: '*Baño* 是阳性名词。'
    example_gloss: 这套公寓有一个卫生间。
  es.a1.unit14.lesson01.teach.la_sala:
    title: 客厅
    gloss: 客厅
    note: '*Sala* 是阴性名词。'
    example_gloss: 我们在客厅看电视。
  es.a1.unit14.lesson01.teach.cocina_ambiguity_note:
    title: Cocina：厨房与烹饪
    gloss: cocina（厨房）与 cocinar（做饭）有什么不同。
    note: 请看卡片上的说明。
    target_text: 这里的 *La cocina* 指“厨房”（一个房间），与整个故事中一直用来指烹饪工坊的 *cocina*／*cocinar*（烹饪／做饭）意思不同。可以靠上下文区分：在 *taller de cocina* 中它指烹饪；住宅或公寓的 *la cocina* 是房间；*cocinar* 是动词“做饭”。
  es.a1.unit14.lesson02.teach.alquilar:
    title: 租
    gloss: 租
    note: 动词不定式，用于 *quiero alquilar*（我想租）。
  es.a1.unit14.lesson02.teach.el_edificio:
    title: 楼房
    gloss: 楼房
    note: '*Edificio* 是阳性名词。'
    example_gloss: 这栋楼在公园附近。
  es.a1.unit14.lesson02.teach.desocupado:
    title: 空置的／可入住的
    gloss: 空置的／可入住的
    note: '*Desocupado* 用来形容目前空着、可以入住的出租房。'
  es.a1.unit14.lesson02.teach.grande:
    title: 大
    gloss: 大的
    note: '*Grande* 不随阴阳性变化（不同于以 -o/-a 结尾的形容词）。'
  es.a1.unit14.lesson02.teach.pequeno:
    title: 小
    gloss: 小的
    note: '*Pequeño/pequeña* 与 *grande* 意思相反。'
  es.a1.unit14.lesson03.teach.cuantos_dormitorios_tiene:
    title: 询问有几间卧室
    gloss: 有几间卧室？
    note: '*¿Cuántos...tiene?*（有多少……？）是询问住所特点的常用句型。'
  es.a1.unit14.lesson03.teach.tiene_dos_dormitorios_y_una_cocina_grande:
    title: 描述卧室和厨房
    gloss: 有两间卧室和一个大厨房。
    note: '*Tiene*（有）＋数量＋名词，这里搭配 *dormitorio*、*cocina* 和 *grande*。'
  es.a1.unit14.lesson04.teach.quiero_alquilar_un_apartamento_con_una_cocina_grande:
    title: 说明租房目标
    gloss: 我想租一套厨房很大的公寓。
    note: '*Quiero*（我想）＋不定式 *alquilar*，用 *con*（带有）引出想要的特点。'
  es.a1.unit14.lesson04.teach.asi_puedes_cocinar_en_casa:
    title: 说明好处
    gloss: 这样你在家也可以做饭了。
    note: '*Así*（这样）＋*puedes*（你可以）＋不定式，把租房目标与整个故事的烹饪主题联系起来。'
  es.a1.unit14.lesson05.teach.anuncio_reading:
    title: 阅读公寓广告
    gloss: 公园附近楼房中的空置公寓。有两间卧室、一个卫生间、一间客厅和一个大厨房。非常适合想在家做饭的人。
    note: 一则贴近真实的分类广告。
    glosses:
      desocupado: 空置的／可入住的
      edificio: 楼房
      cerca: 附近／靠近
      parque: 公园
      Tiene: 有（来自 tener）
      dormitorios: 卧室
      baño: 卫生间
      sala: 客厅
      grande: 大的
      perfecto: 完美的
      quiere: 想要（来自 querer）
      cocinar: 做饭
  es.a1.unit14.lesson05.teach.para_alguien_que_note:
    title: Para alguien que...
    gloss: 关系从句如何描述理想的租客。
    note: 请看卡片上的说明。
    target_text: '*Para alguien que quiere*（给想要……的人）用 *alguien*（某人）+ *que*（……的）引出一个关系从句，这是描述理想租客的分类广告中常见的结构。'
  es.a1.unit14.lesson06.teach.line01:
    title: 说出问题和目标
    gloss: 马特奥说他的厨房很小，想租一套厨房大的公寓。
    note: 把 *mi cocina es muy pequeña*（我的厨房很小）和目标句 *quiero alquilar un apartamento con una cocina grande*（我想租一套厨房很大的公寓）结合在一起。
  es.a1.unit14.lesson06.teach.line02:
    title: 提议看广告
    gloss: 埃莲娜提议看看报纸，上面有很多广告。
    note: '*El periódico*（报纸）和 *anuncios*（广告）是现实生活中分类广告的新词汇。'
  es.a1.unit14.lesson06.teach.line03:
    title: 找到一则广告
    gloss: 马特奥找到一栋有空置公寓的楼。
    note: '*Este edificio*（这栋楼）和 *desocupado*（空置的、可入住的）。'
  es.a1.unit14.lesson06.teach.line04:
    title: 询问卧室数量
    gloss: 埃莲娜问有几间卧室。
    note: 询问住所特点的常用问句。
  es.a1.unit14.lesson06.teach.line05:
    title: 回答具体情况
    gloss: 马特奥说有两间卧室和一个大厨房。
    note: '*Tiene*（有）＋数量＋名词。'
  es.a1.unit14.lesson06.teach.line06:
    title: 确认更多特点
    gloss: 埃莲娜很高兴，并说还有一个卫生间和一间客厅。
    note: '*Baño*（卫生间）和 *sala*（客厅）补全了房间清单；*también*（也）放在句末。'
  es.a1.unit14.lesson06.teach.line07:
    title: 决定打电话
    gloss: 马特奥决定今天就给中介打电话。
    note: '*Voy a llamar*（我要打电话）＋*hoy mismo*（就在今天）；*la agencia* 是租房中介。'
  es.a1.unit14.lesson06.teach.line08:
    title: 表示赞同，呼应主题
    gloss: 埃莲娜表示赞同，并指出他在家也可以做饭了。
    note: '*Así puedes cocinar en casa también*（这样你在家也可以做饭了）为这一场景收尾。'
