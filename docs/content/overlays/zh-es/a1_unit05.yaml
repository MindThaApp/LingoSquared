    title: 埃琳娜和马特奥计划午餐
teaching:
  es.a1.unit05.lesson01.teach.que_hora_es:
    title: 询问时间
    gloss: 几点了？
    note: '*Qué hora*（什么时间）问的是钟点，不同于 *qué fecha*（哪一天的日期）。'
  es.a1.unit05.lesson01.teach.es_la_una:
    title: 一点钟
    gloss: 一点钟。
    note: 为什么只有一点钟用 *es*（而不是 *son*），请看下一张语法说明。
  es.a1.unit05.lesson01.teach.es_vs_son_note:
    title: 表示时间的 es 与 son
    gloss: 为什么一点钟和其他整点不同。
    note: '*Es la una*（单数），但是 *son las dos, son las tres...*（复数）。'
    target_text: 一点钟用单数动词 *es*（Es la una），其他整点都用复数 *son*（Son las dos、Son las tres……），因为 *la una* 是单数（“一点”），而 *las dos*、*las tres* 等是复数。
  es.a1.unit05.lesson01.teach.son_las_horas:
    title: 两点、四点、五点、七点
    gloss: 两点钟，四点钟，五点钟，七点钟。
    note: 除一点外，其他整点都用复数 *Son las...*，与上一张语法说明一致。
    example_gloss:
    - 两点钟。
    - 四点钟。
    - 五点钟。
    - 七点钟。
  es.a1.unit05.lesson02.teach.y_cuarto:
    title: 过一刻
    gloss: 四点一刻（四点十五分）。
    note: '*Y cuarto*（加一刻钟）表示在所说整点的基础上加十五分钟。'
  es.a1.unit05.lesson02.teach.y_media:
    title: 过半点
    gloss: 七点半（七点三十分）。
    note: '*Y media*（加半小时）表示在所说整点的基础上加三十分钟。'
  es.a1.unit05.lesson02.teach.menos_cuarto:
    title: 差一刻
    gloss: 差一刻五点（四点四十五分）。
    note: '*menos* 如何表示距下一个整点还差多少，请看下一张语法说明。'
  es.a1.unit05.lesson02.teach.menos_note:
    title: Menos（差几分到整点）
    gloss: 西班牙语如何表示距下一个整点还差几分钟。
    note: '*Las cinco menos cuarto* = 差一刻五点（4:45）。'
    target_text: '*Menos*（减、差）表示距离下一个整点还差多少：*las cinco menos cuarto* 是4:45，即“差一刻五点”。'
  es.a1.unit05.lesson03.teach.partes_del_dia:
    title: 早上、下午、晚上
    gloss: 早上，下午，晚上
    note: '*De la mañana/tarde/noche* 放在钟点之后，用来说明是上午还是下午、晚上，类似汉语在钟点前加“早上”“下午”“晚上”。'
    example_gloss:
    - 现在是早上八点。
    - 工作坊下午四点开始。
    - 现在是晚上十点。
  es.a1.unit05.lesson03.teach.taller_empieza_cuatro_tarde:
    title: 工作坊四点开始
    gloss: 工作坊下午四点开始。
    note: '*Empieza*（开始）是动词 *empezar* 的第三人称形式，是本单元的新动词。'
  es.a1.unit05.lesson03.teach.a_que_hora_empieza:
    title: 询问某事几点开始
    gloss: 工作坊几点开始？
    note: '*A qué hora*（在几点）是询问某个具体活动何时发生的标准说法，不同于泛泛询问现在时间的 *qué hora es*（现在几点）。'
  es.a1.unit05.lesson04.teach.nos_vemos_a_que_hora:
    title: 询问何时见面
    gloss: 我们几点见面？
    note: '*Nos vemos*（我们彼此见面／我们见面）是一种自反式结构，用于约定与某人见面。'
  es.a1.unit05.lesson04.teach.nos_vemos_tres_y_media:
    title: 提议见面时间
    gloss: 我们三点半见面好吗？
    note: 把 *y media* 与 *nos vemos* 结合起来，提议一个具体的时间。
  es.a1.unit05.lesson04.teach.antes_del_taller:
    title: 工作坊之前
    gloss: 那是在工作坊之前。
    note: '*Antes de*(在……之前)与 *después*(之后)意思相反。'
  es.a1.unit05.lesson04.teach.de_acuerdo:
    title: 好的／同意
    gloss: 好的／同意
    note: '*De acuerdo* 是确认计划时自然而简短的说法,作用与 *Muy bien* 相似。'
    example_gloss: 好的,我们三点半见。
  es.a1.unit05.lesson05.teach.horario_dia_reading:
    title: 阅读一天的日程
    gloss: 工作坊下午四点开始。在此之前,Elena 和 Mateo 三点半见面。工作坊六点结束。第二天,他们一点见面吃午饭。
    note: 一天的简短日程:见面、工作坊,以及第二天的午饭。
    glosses:
      taller: 工作坊
      empieza: 开始(来自 empezar)
      cuatro: 四
      tarde: 下午
      Antes: 之前
      ven: 见面(来自 verse)
      tres: 三
      media: 半
      termina: 结束(来自 terminar)
      seis: 六
      día: 天
      siguiente: 下一个
      almorzar: 吃午饭
  es.a1.unit05.lesson05.teach.al_dia_siguiente:
    title: 第二天
    gloss: 第二天／次日
    note: '*Al día siguiente*(到下一天)是把故事推进到新的一天的常用说法,不同于 *la próxima clase*(下一节课,指具体的事件,而不是日历上的一天)。'
  es.a1.unit05.lesson06.teach.line01:
    title: 询问工作坊之后吃饭的事
    gloss: Mateo 说工作坊六点结束,并问 Elena 之后饿不饿。
    note: '*Tienes hambre*(你饿了)是一个新的习惯表达,字面意思是“你有饿”,与 *tener ... años* 和 *tener hermanos* 用的是同一种“有”的结构。'
  es.a1.unit05.lesson06.teach.line02:
    title: 同意并提议改到第二天
    gloss: Elena 说有一点饿,并提议改到第二天再吃。
    note: '*¿Comemos mañana?* 提议明天吃,而不是工作坊一结束就吃,为接下来商定具体时间的对话做铺垫。'
  es.a1.unit05.lesson06.teach.line03:
    title: 同意并询问时间
    gloss: Mateo 觉得这个主意不错,并问几点。
    note: '*Buena idea*(好主意)是表示赞同建议的自然而简短的说法。'
  es.a1.unit05.lesson06.teach.line04:
    title: 提议一点钟
    gloss: Elena 提议一点钟见面。
    note: '*A la una*(在一点)使用单数的 *la una*,和 *Es la una* 一样。'
  es.a1.unit05.lesson06.teach.line05:
    title: 确认时间并提到一家餐厅
    gloss: Mateo 确认一点可以,并提到附近有一家餐厅。
    note: '*Hay un restaurante cerca de aquí*:*cerca de*(靠近),如 *cerca de tus padres*,这里用于一个地方。'
  es.a1.unit05.lesson06.teach.line06:
    title: 热情地结束对话
    gloss: Elena 高兴地回应,并说明天见。
    note: '*¡Genial!*(太棒了!)以热情的语气结束对话,作用与 *¡Qué bien!* 相似。'
