course:
  title: 西班牙语 A1
  description: 学习如何说和询问钟点、一天中的时段以及安排见面，延续第01至04单元中埃琳娜和马特奥的烹饪工作坊故事。重点讲解表示时间时 es／son 的单复数变化，以及 cuarto、media、menos 等分数表达。
