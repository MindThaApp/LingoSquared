course:
  title: 西班牙语 A1
  description: 常见的街区场所和方位介词，延续埃琳娜和马特奥的故事：刚搬来不久的马特奥打听街区的情况。课程会把五个方位介词作为各不相同、不能互换的空间关系来讲解。
