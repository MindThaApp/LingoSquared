teaching:
  es.a1.unit08.lesson01.teach.banco_farmacia:
    title: 银行，药店
    gloss: 银行，药店
    note: '*Banco* 是阳性；*farmacia* 是阴性。'
    example_gloss:
    - 我去银行。
    - 药店九点开门。
  es.a1.unit08.lesson01.teach.parque_restaurante:
    title: 公园，餐厅
    gloss: 公园，餐厅
    note: 这两个名词都是阳性。
    example_gloss:
    - 公园很漂亮。
    - 我们在餐厅吃饭。
  es.a1.unit08.lesson01.teach.biblioteca:
    title: 图书馆
    gloss: 图书馆
    note: '*Biblioteca* 是阴性。'
    example_gloss: 我在图书馆学习。
  es.a1.unit08.lesson02.teach.cerca_de:
    title: 近
    gloss: 餐厅离市场很近。
    note: '*Cerca de*（靠近）后面接参照地点时，总是要带 *de*。'
  es.a1.unit08.lesson02.teach.lejos_de:
    title: 远离
    gloss: 公园离市场很远。
    note: '*Lejos de*（远离）与 *cerca de* 意思相反。'
  es.a1.unit08.lesson02.teach.al_lado_de:
    title: 在旁边
    gloss: 银行在市场旁边。
    note: '*Al lado de*（在……旁边）是固定搭配（*al* = *a* + *el lado*）。在 *mercado* 这样的阳性名词前，*de* + *el* 要缩合为 *del*：*al lado del mercado*。'
  es.a1.unit08.lesson02.teach.enfrente_de:
    title: 在对面
    gloss: 药店在市场对面。
    note: '*Enfrente de*（在……对面）表示两个地方分处某物（比如一条街）的两侧。'
  es.a1.unit08.lesson02.teach.entre:
    title: 在……之间
    gloss: 图书馆在银行和公园之间。
    note: '*Entre*（在……之间）需要两个参照点，这里用 *y*（和）连接。'
  es.a1.unit08.lesson03.teach.donde_esta_el_banco:
    title: 询问银行在哪里
    gloss: 银行在哪里？
    note: '*Dónde está*（……在哪里）是询问某个地方位置的标准问法。'
  es.a1.unit08.lesson03.teach.esta_al_lado_del_mercado:
    title: 用方位来回答
    gloss: 它在市场旁边。
    note: '*Del* 是 *de* + *el* 的缩合形式，在阳性的 *mercado* 前必须使用。'
  es.a1.unit08.lesson03.teach.donde_esta_la_farmacia:
    title: 询问药店在哪里
    gloss: 药店在哪里？
    note: 同样的提问句式,用在阴性冠词的名词上——问句本身不会因词的性而改变。
  es.a1.unit08.lesson03.teach.esta_enfrente_del_mercado:
    title: 回答:在……对面
    gloss: 它在市场对面。
    note: '*Enfrente de* + *el mercado* 变成 *enfrente del mercado*,和 *al lado del mercado* 一样,都使用 *del* 这一缩合形式。'
  es.a1.unit08.lesson04.teach.esta_lejos:
    title: 询问是否很远
    gloss: 远吗？
    note: 这是一个简短的追问句,上下文已经清楚时可以省略主语。
  es.a1.unit08.lesson04.teach.no_esta_cerca:
    title: 回答:不,很近
    gloss: 不，很近。
    note: 单独使用 *cerca*(不带 *de*)可以作简短回答;而说出具体地点时,要用完整的 *cerca de*。
  es.a1.unit08.lesson04.teach.si_esta_lejos:
    title: 回答:是的,相当远
    gloss: 是的，挺远的。
    note: '*Bastante*(相当)用来加强 *lejos* 的程度,但语气没有 *muy*(很)那么强。'
  es.a1.unit08.lesson05.teach.barrio_reading:
    title: 阅读街区介绍
    gloss: 这个街区有很多实用的地方。银行在市场旁边。药店在市场对面。公园很远,但图书馆在银行和公园之间。餐厅离市场很近。
    note: 这段短文把本单元学过的方位表达集中在一段街区描述里。
    glosses:
      barrio: 街区
      hay: 有(haber 的变位形式)
      muchos: 许多
      lugares: 地方
      útiles: 有用的
      banco: 银行
      está: 位于(estar 的变位形式)
      lado: 旁边
      mercado: 市场
      farmacia: 药店
      enfrente: 对面
      parque: 公园
      lejos: 远
      biblioteca: 图书馆
      entre: 在……之间
      restaurante: 餐厅
      cerca: 近
  es.a1.unit08.lesson05.teach.hay_note:
    title: Hay(有)
    gloss: 为什么 hay 不随单数或复数变化。
    note: 请看卡片上的说明。
    target_text: '*Hay*（有）不随单复数变化：*hay un banco* 和 *hay muchos lugares* 用的是同一个词。'
  es.a1.unit08.lesson06.teach.line01:
    title: 询问银行在哪里
    gloss: 马特奥问埃琳娜银行在哪里。
    note: 这就是本单元前面学过的 *¿Dónde está...?* 问句,开头先叫出埃琳娜的名字来引起她的注意。
  es.a1.unit08.lesson06.teach.line02:
    title: 回答并提到市场
    gloss: 埃琳娜说银行在市场旁边,就是他们买鸡蛋的地方。
    note: '*Donde compramos los huevos*(我们买鸡蛋的地方)指的是他们在第7单元的购物经历。'
  es.a1.unit08.lesson06.teach.line03:
    title: 询问药店
    gloss: 马特奥表示想起来了,接着问药店在哪里。
    note: '*Ah, sí*(啊,对)是在问下一个问题之前自然的简短回应。'
  es.a1.unit08.lesson06.teach.line04:
    title: 回答:在……对面
    gloss: 埃琳娜说药店在市场对面。
    note: 简短的回答:主语(*la farmacia*)因为问句里已经很清楚,所以被省略了。
  es.a1.unit08.lesson06.teach.line05:
    title: 询问公园
    gloss: 马特奥问公园在哪里,近不近。
    note: 在一次发言中连问两个问题,这在日常交谈中很自然。
  es.a1.unit08.lesson06.teach.line06:
    title: 回答:很远,然后提到图书馆
    gloss: 埃琳娜说公园很远,但图书馆在银行和公园之间。
    note: '*Pero*(但是)把公园的距离远和图书馆位置更方便形成对比。'
  es.a1.unit08.lesson06.teach.line07:
    title: 道谢并询问餐厅
    gloss: 马特奥向埃琳娜道谢,并问他们吃过饭的那家餐厅在哪里。
    note: '*El restaurante donde comimos*(我们吃饭的那家餐厅)指的是他们在第6单元的午餐。'
  es.a1.unit08.lesson06.teach.line08:
    title: 确认很近
    gloss: 埃琳娜确认餐厅离市场很近。
    note: '*Muy cerca*(很近):*muy*(很)比 *bastante*(相当)语气更强,例如 *bastante lejos*(相当远)。'
