    title: 一起规划周末
teaching:
  es.a1.unit48.lesson01.teach.leer_hacer_deporte:
    title: 阅读、锻炼、做饭
    gloss: 阅读、锻炼／做运动、做饭
    note: 三个常见的爱好动词：*leer*（读书）、*hacer deporte*（做运动）和 *cocinar*（做饭）。
    example_gloss:
    - 我喜欢读书。
    - 我每逢星期六都锻炼。
    - 我喜欢为朋友们做饭。
  es.a1.unit48.lesson01.teach.el_tiempo_libre:
    title: 空闲时间
    gloss: 空闲时间
    note: '*El tiempo libre* 是阳性名词短语，是谈论爱好时的关键短语。'
    example_gloss: 我空闲时喜欢阅读。
  es.a1.unit48.lesson01.teach.en_mi_tiempo:
    title: 表达你空闲时做什么
    gloss: 我空闲时喜欢阅读。
    note: '*Me gusta leer*（我喜欢读书）使用 *gustar* + 动词原形；无论是什么活动，*me gusta* 都保持不变。'
  es.a1.unit48.lesson02.teach.escuchar_musica_dibujar:
    title: 音乐、画画、电子游戏
    gloss: 听音乐、画画、玩电子游戏
    note: 另外三个爱好动词：*escuchar música*（听音乐）、*dibujar*（画画）和 *jugar videojuegos*（玩电子游戏）。
    example_gloss:
    - 我喜欢听音乐。
    - 我经常画画。
    - 我喜欢和朋友们一起玩电子游戏。
  es.a1.unit48.lesson02.teach.me_gusta_escuchar:
    title: 表达你喜欢听音乐
    gloss: 我喜欢听音乐。
    note: '*Escuchar* 直接带宾语，中间不加介词：*escuchar música*。'
  es.a1.unit48.lesson02.teach.me_gusta_jugar:
    title: 表达喜欢和朋友一起玩电子游戏
    gloss: 我喜欢和朋友们一起玩电子游戏。
    note: '*Con amigos*（和朋友一起）再次用到了前面课程中学过的介词 *con*。'
  es.a1.unit48.lesson03.teach.siempre_a_menudo:
    title: 总是、经常、有时、从不
    gloss: 总是、经常、有时、从不
    note: 四个最基本的频率副词：*siempre*（总是）、*a menudo*（经常）、*a veces*（有时）、*nunca*（从不）。它们通常放在动词前或句首。
    example_gloss:
    - 我每周六都锻炼。
    - 我经常读书。
    - 我有时画画。
    - 我从不玩电子游戏。
  es.a1.unit48.lesson03.teach.cada_semana_cada:
    title: 每周、每个周末
    gloss: 每周、每个周末
    note: '*Cada semana* 和 *cada fin de semana* 都表示“每”；*cada* 的形式永远不变。'
    example_gloss:
    - 我每周都为朋友做饭。
    - 我每个周末都锻炼。
  es.a1.unit48.lesson03.teach.con_palabras_femeninas:
    title: Cada 永远不变
    gloss: Cada 的形式不变：cada semana、cada fin de semana。
    note: '*Cada* 永远不变：无论后面是阴性名词（*semana*）还是阳性名词（*fin de semana*），形式都一样。'
  es.a1.unit48.lesson03.teach.que_haces_en:
    title: 询问空闲时间
    gloss: 你空闲时做什么？
    note: 这是本单元的核心问题，可以用它询问任何人的爱好。
  es.a1.unit48.lesson04.teach.elena_a_menudo:
    title: Elena聊起爱好
    gloss: Elena：我们经常一起散步。不过你在空闲时间还做些什么呢，Mateo？
    note: '*A menudo paseamos juntos*（我们经常一起散步）：*paseamos* 是 *pasear* 的 *nosotros* 形式。'
  es.a1.unit48.lesson04.teach.mateo_me_gusta:
    title: Mateo的爱好
    gloss: Mateo：我喜欢做饭，在家也做。我还经常做运动。
    note: '*También en casa*（在家也一样）表明Mateo做饭是出于兴趣，不只是在餐厅工作。'
  es.a1.unit48.lesson04.teach.elena_cocinas_tambien:
    title: Elena很惊讶
    gloss: Elena：你在家也做饭？你上班时已经做了一整天饭了！
    note: '*Todo el día*（一整天）强调Mateo在工作中已经做了很多饭。'
  es.a1.unit48.lesson04.teach.mateo_si_pero:
    title: Mateo解释
    gloss: Mateo：是的，但我觉得做饭很放松。你呢，你喜欢做什么？
    note: '*Cocinar me parece relajante* 字面意思是“做饭对我来说显得很放松”：*me parece* + 形容词是表达看法的自然说法。'
  es.a1.unit48.lesson04.teach.elena_me_gusta:
    title: Elena的爱好
    gloss: Elena：我喜欢读书，还经常听音乐。
    note: 用 *y*（和）把前面课程中的两个爱好动词连在一个句子里。
  es.a1.unit48.lesson04.teach.mateo_tu_tambien:
    title: Mateo问起电子游戏
    gloss: Mateo：你也玩电子游戏吗？
    note: 一个用到第2课 *jugar videojuegos* 的简短是非问句；*tú también*（你也）使用的是非正式的 *tú*。
  es.a1.unit48.lesson04.teach.elena_no_nunca:
    title: Elena的回答
    gloss: Elena：不，我从不玩电子游戏。不过我有时画画！
    note: 第3课学过的 *nunca*（从不）和 *a veces*（有时）在同一个回答中形成对比。
  es.a1.unit48.lesson05.teach.mateo_y_yo:
    title: 比较爱好
    gloss: Mateo和我经常一起散步。不过我们还有其他爱好。Mateo喜欢做饭，在家也做，还经常做运动。我喜欢读书，也经常听音乐。我有时画画，但从不玩电子游戏。你在空闲时间喜欢做什么？
    note: Elena的消息回顾了前面课程中的内容，并以本单元的核心问题向读者提问作结。
    glosses:
      paseamos: 散步
      menudo: 经常
      juntos: 一起
      otras: 其他的
      cocinar: 做饭
      gusta: 喜欢
      casa: 在家
      deporte: 锻炼
      leer: 阅读
      escucho: 听
      música: 音乐
      dibujo: 画画
      veces: 有时
      videojuegos: 玩电子游戏
      nunca: 从不
      libre: 空闲的
      tiempo: 时间
  es.a1.unit48.lesson06.teach.mateo_que_haces:
    title: Mateo问起周末
    gloss: Mateo：这个周末你做什么？
    note: '*Este fin de semana*（这个周末）中，*este* 与阳性名词 *fin de semana* 搭配。'
  es.a1.unit48.lesson06.teach.elena_todavia_no:
    title: Elena还没决定
    gloss: Elena：我还不知道。我喜欢读书，但也想出去走走。
    note: '*Quiero salir*（我想出去）是表达想出门的常用说法。'
  es.a1.unit48.lesson06.teach.mateo_paseamos_juntos:
    title: Mateo提了个计划
    gloss: Mateo：我们一起去散步吧？之后我给我们做饭。
    note: '*Después*（之后）是表示先后顺序的词：*primero*、*luego*、*después*。'
  es.a1.unit48.lesson06.teach.elena_buena_idea:
    title: Elena同意
    gloss: Elena：好主意！这两件事我都喜欢：散步和做饭。
    note: '*Las dos cosas*（两件事）表示Elena同样喜欢这两件事，没有偏爱哪一个。'
  es.a1.unit48.lesson06.teach.mateo_perfecto_entonces:
    title: Mateo确认
    gloss: Mateo：太好了！那星期六见！
    note: 一句友好的结束语，确认了 *el sábado*（星期六）的计划；西班牙语在说具体的某一天时，要在前面加 *el*。
