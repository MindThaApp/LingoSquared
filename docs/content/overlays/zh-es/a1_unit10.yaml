teaching:
  es.a1.unit10.lesson01.teach.el_tiempo:
    title: 天气
    gloss: 天气
    note: '*Tiempo* 还表示“时间”,要根据上下文区分这两个意思。'
    example_gloss: 今天天气怎么样?
  es.a1.unit10.lesson01.teach.el_sol:
    title: 太阳
    gloss: 太阳
    note: '*Sol* 是阳性名词。'
    example_gloss: 今天阳光很强。
  es.a1.unit10.lesson01.teach.la_lluvia:
    title: 雨
    gloss: 雨
    note: '*Lluvia* 是阴性名词。'
    example_gloss: 我不喜欢雨。
  es.a1.unit10.lesson01.teach.el_viento:
    title: 风
    gloss: 风
    note: '*Viento* 是阳性名词。'
    example_gloss: 今天风很大。
  es.a1.unit10.lesson01.teach.la_nube:
    title: 云
    gloss: 云
    note: '*Nube* 是阴性名词。'
    example_gloss: 一朵云也没有。
  es.a1.unit10.lesson02.teach.hace_calor:
    title: 天气热
    gloss: 天气热。
    note: '*Hace calor*(字面意思是“造出热”)是描述天气热的标准固定说法。'
    example_gloss: 七月很热。
  es.a1.unit10.lesson02.teach.hace_frio:
    title: 天气冷
    gloss: 天气冷。
    note: '*Hace frío* 和 *hace calor* 一样,都是 *hace* + 名词的结构。'
    example_gloss: 十二月天气冷。
  es.a1.unit10.lesson02.teach.hace_sol:
    title: 天晴
    gloss: 天气晴朗。
    note: '*Hace sol* 在同样的固定结构中使用了 *el sol*(太阳)。'
  es.a1.unit10.lesson02.teach.llueve:
    title: 下雨
    gloss: 在下雨。
    note: '*Llueve* 是独立的动词变位形式(来自 *llover*,下雨),不属于 *hace* 结构,请看后面的语法说明。'
  es.a1.unit10.lesson02.teach.esta_nublado:
    title: 多云
    gloss: 天气多云。
    note: '*Está nublado* 使用 *estar* + 形容词,是第三种不同的天气表达结构。'
  es.a1.unit10.lesson02.teach.hace_vs_esta_note:
    title: Hace、llueve、está:三种结构
    gloss: 描述天气的三种不同语法结构。
    note: 请看本卡片的正文。
    target_text: 带 *hace* 的天气表达（hace calor、hace frío、hace sol）是固定说法，字面意思是“制造热／冷／太阳”。*Llueve*（下雨）是一个独立的动词变位形式，而 *está nublado*（多云）则是 *estar* + 形容词——同样是描述天气，却有三种不同的结构。
  es.a1.unit10.lesson03.teach.que_tiempo_hace_hoy:
    title: 询问天气
    gloss: 今天天气怎么样?
    note: '*¿Qué tiempo hace hoy?* 是询问当前天气的标准问法,其中用到 *el tiempo*(天气)。'
  es.a1.unit10.lesson03.teach.hace_mucho_calor_y_sol:
    title: 描述炎热晴朗的天气
    gloss: 天气又热又晴。
    note: 用 *y*(和)连接两个 *hace* 表达。
  es.a1.unit10.lesson03.teach.hace_calor_pero_hay_viento:
    title: 描述炎热有风的天气
    gloss: 天气热,不过有风。
    note: '*Pero*(但是)连接两个互相对照的天气情况:热与有风,其中像 *hay mucho viento* 一样使用 *hay* + 名词。'
  es.a1.unit10.lesson04.teach.en_invierno_hace_frio_en_madrid:
    title: 谈谈马德里的冬天
    gloss: 马德里的冬天很冷。
    note: '*En invierno*(在冬天)引出一个季节词,下面会与 *en julio* 形成对比。'
  es.a1.unit10.lesson04.teach.en_julio_hace_demasiado_calor:
    title: 谈谈七月的酷热
    gloss: 七月太热了。
    note: '*Demasiado*（太，过于）比单纯的 *mucho*（很，非常）更强调 *calor* 的程度。'
  es.a1.unit10.lesson04.teach.necesitamos_agua:
    title: 说明为什么需要水
    gloss: 我们需要水,因为天气热。
    note: '*Porque*(因为)把需求和天气原因联系起来,是一个与工作坊相关的实用句子。'
  es.a1.unit10.lesson05.teach.pronostico_reading:
    title: 阅读天气预报
    gloss: 今天是7月22日,天气很热,阳光明媚。一朵云也没有。还有一点风。这是去烹饪工作坊的好天气,不过带水很重要。
    note: 一则7月22日的简短天气预报,这天是烹饪课的日子。
    glosses:
      Hoy: 今天
      veintidós: 第二十二
      julio: 七月
      hace: (天气)是……(来自 hacer)
      calor: 热天气;热
      sol: 晴朗;太阳
      hay: 有(来自 haber)
      nube: 云
      También: 也
      poco: 一点
      viento: 风
      buen: 好
      día: 天
      ir: 去
      taller: 工作坊
      cocina: 烹饪
      importante: 重要的
      llevar: 带;携带
      agua: 水
  es.a1.unit10.lesson05.teach.un_poco_de_note:
    title: Un poco de(一点)
    gloss: un poco de 如何表示少量。
    note: 请看本卡片的正文。
    target_text: '*Un poco de*（一点）可以用于食物的数量，这里用来表示少量的风——结构相同，只是换了名词。'
  es.a1.unit10.lesson06.teach.line01:
    title: 感叹天气热
    gloss: 埃莱娜感叹今天真热。
    note: '*¡Qué calor hace hoy!*(今天好热啊!)是 *hace calor* 这一固定说法的感叹用法。'
  es.a1.unit10.lesson06.teach.line02:
    title: 表示赞同并补充细节
    gloss: 马特奥表示同意,并说一朵云也没有。
    note: 把 *hace mucho calor y hace sol* 和 *no hay ni una nube* 结合在一起。
  es.a1.unit10.lesson06.teach.line03:
    title: 建议带水
    gloss: 埃莱娜说他们路上需要水。
    note: '*El camino*(路、路途)指他们去工作坊的路程。'
  es.a1.unit10.lesson06.teach.line04:
    title: 表示赞同并指出一家商店
    gloss: 马特奥表示同意,并说附近有一家商店。
    note: '*Cerca de aquí*(离这儿近)使用了表示位置的短语 *cerca de*(靠近)。'
  es.a1.unit10.lesson06.teach.line05:
    title: 对比冬天和夏天
    gloss: 埃莱娜把马德里寒冷的冬天和今天七月的酷热作对比。
    note: 把两个季节句 *en invierno hace mucho frío* 和 *en julio hace demasiado calor* 结合在一起。
  es.a1.unit10.lesson06.teach.line06:
    title: 说出自己的偏好
    gloss: 马特奥说他更喜欢热天气,因为伦敦几乎天天下雨。
    note: '*Prefiero*(我更喜欢)是新的第一人称动词变位形式;*casi todos los días*(几乎每天)是实用的频率表达。'
  es.a1.unit10.lesson06.teach.line07:
    title: 表示赞同并催促出发
    gloss: 埃莱娜表示同意,并说他们该走了,否则上课要迟到。
    note: '*Es verdad* 的意思是“没错”;这里的 *o*(或者)表示后果,相当于“否则”。'
  es.a1.unit10.lesson06.teach.line08:
    title: 表示赞同并出发
    gloss: 马特奥同意她说得对,然后他们出发。
    note: '*Tienes razón*(你说得对)是常用的表示赞同的说法。'
