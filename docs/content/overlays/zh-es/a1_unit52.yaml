  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: 西班牙语 A1
  description: 初级西班牙语，学习描述一个人的基本外貌：身高和年龄印象、头发和眼睛的颜色、核心问句 ¿Cómo es ...?，以及比较两个人的外貌。
units:
  es.a1.unit52.appearance:
    title: 描述外貌
lessons:
  es.a1.unit52.lesson01.alto_bajo_mayor_y:
    title: 高、矮、年老和年轻
  es.a1.unit52.lesson02.describir_el_pelo:
    title: 描述头发
  es.a1.unit52.lesson03.los_ojos_y_como:
    title: 眼睛和询问某人的外貌
  es.a1.unit52.lesson04.elena_describe_a_nina:
    title: Elena 描述 Nina
  es.a1.unit52.lesson05.comparar_a_diego_y:
    title: 比较 Diego 和 Lucía
  es.a1.unit52.lesson06.mateo_reconoce_a_nina:
    title: Mateo 认出了 Nina
teaching:
  es.a1.unit52.lesson01.teach.alto_bajo:
    title: 高和矮
    gloss: 高的／矮的
    note: '*Alto* 形容个子高，*bajo* 形容个子矮；两者都要与所描述的人保持一致：*alta*、*baja*。'
    example_gloss:
    - Lucía 个子高。
    - Diego 个子矮。
  es.a1.unit52.lesson01.teach.mayor_joven:
    title: 年老和年轻
    gloss: 年老的／年轻的
    note: '*Mayor* 和 *joven* 表示对年龄的大致印象，而不是确切的岁数。'
    example_gloss:
    - 爷爷年纪大了。
    - Mateo 很年轻。
  es.a1.unit52.lesson01.teach.para_dar_la:
    title: Mayor：表示印象，而不是数字
    gloss: 要说确切的年龄，用 tener años，例如 ¿Cuántos años tienes?；mayor 只给出笼统的印象，不带数字，例如 El abuelo es mayor.
    note: 要说确切的年龄，用 *tener años*：*¿Cuántos años tienes?* *Mayor* 只表示笼统的印象，不带数字。
  es.a1.unit52.lesson01.teach.lucia_es_alta:
    title: Lucía 个子高，Diego 个子矮
    gloss: Lucía 个子高，Diego 个子矮。
    note: 用 *y*（“和”）连接的简单复合句，为以后课程中的直接比较做铺垫。
  es.a1.unit52.lesson02.teach.el_pelo:
    title: 头发
    gloss: 头发
    note: '*El pelo* 是阳性名词；泛指某人的头发时用单数。'
    example_gloss: Mateo 留着黑色短发。
  es.a1.unit52.lesson02.teach.rubio_castano_gris:
    title: 金色、棕色和灰白色
    gloss: 金色的／棕色的／灰白的
    note: 三种发色：*rubio*（金色）、*castaño*（棕色）和 *gris*（灰色）。*Rubio* 要与名词保持一致：*pelo rubio*、*melena rubia*。
    example_gloss:
    - Elena 留着金发。
    - Diego 留着棕色头发。
    - 爷爷头发灰白。
  es.a1.unit52.lesson02.teach.largo_corto:
    title: 长和短（头发）
    gloss: 长的／短的（头发）
    note: '*Largo*（长）在身高那一课出现过，这里用来说头发的长度；*corto*（短）是新词：*el pelo largo*、*el pelo corto*。'
    example_gloss:
    - Lucía 留着长发。
    - Diego 留着短发。
  es.a1.unit52.lesson02.teach.el_adjetivo_va:
    title: 形容词放在名词后面
    gloss: 形容词放在名词之后：el pelo corto、el pelo largo、el pelo rubio、el pelo castaño、el pelo gris、el pelo negro。
    note: 与汉语把形容词放在名词前面不同，西班牙语的形容词放在名词之后，并与名词保持一致：*el pelo corto*、*el pelo rubio*。
  es.a1.unit52.lesson02.teach.pelo_y_cabello:
    title: Pelo 和 cabello
    gloss: Pelo 和 cabello 意思相同。本课程使用 pelo：el pelo largo。
    note: 在日常西班牙语中，*pelo* 和 *cabello* 都表示“头发”；本课程使用 *pelo*。
  es.a1.unit52.lesson02.teach.mateo_tiene_el:
    title: Mateo 留着黑色短发
    gloss: Mateo 留着黑色短发。
    note: 这里再次用到服装单元中学过的 *negro*（黑色）。
  es.a1.unit52.lesson02.teach.elena_tiene_el:
    title: Elena 留着金色长发
    gloss: Elena 留着金色长发。
    note: 这个自然的句子结合了本课表示头发长度和颜色的词汇。
  es.a1.unit52.lesson03.teach.los_ojos:
    title: 眼睛
    gloss: 眼睛
    note: '*Los ojos* 是 *el ojo* 的复数，两者都是阳性。'
    example_gloss: Mateo 的眼睛是棕色的。
  es.a1.unit52.lesson03.teach.azul_marron_verde:
    title: 蓝色、棕色和绿色
    gloss: 蓝色的／棕色的／绿色的
    note: '*Azul*（蓝色）和 *verde*（绿色）不分阴阳性，形式相同；*marrón*（棕色）是形容眼睛颜色的常用词，而头发则用 *castaño*。'
    example_gloss:
    - Elena 的眼睛是蓝色的。
    - Diego 的眼睛是棕色的。
    - Lucía 的眼睛是绿色的。
  es.a1.unit52.lesson03.teach.con_ojos_plural:
    title: Ojos 搭配复数形容词
    gloss: ojos 是复数，形容词也要用复数：ojos azules、ojos marrones、ojos verdes。
    note: 形容词要与名词在数上保持一致：*ojos* 是复数，所以用 *azules*、*marrones*、*verdes*。
  es.a1.unit52.lesson03.teach.como_es_elena:
    title: Elena 长什么样？
    gloss: Elena 长什么样？
    note: '*¿Cómo es ...?* 是本单元的核心问句；可以用它来询问任何人的外貌。'
  es.a1.unit52.lesson03.teach.elena_tiene_el:
    title: Elena 留着金色长发，眼睛是蓝色的
    gloss: Elena 留着金色长发，眼睛是蓝色的。
    note: 用 *y* 把头发和眼睛合在一个句子里的示范回答。
  es.a1.unit52.lesson04.teach.elena_viene_una:
    title: Elena 介绍 Nina
    gloss: Elena：语言咖啡馆来了一个新女孩，她叫 Nina。
    note: '*Viene*（“来了”）用来介绍新来的人；*se llama* 的意思是“名叫”。'
  es.a1.unit52.lesson04.teach.mateo_genial_como:
    title: Mateo 问她长什么样
    gloss: Mateo：太好了！她长什么样？
    note: 不带名字，再次使用本单元的核心问句：*¿Cómo es?*
  es.a1.unit52.lesson04.teach.elena_es_baja:
    title: Elena 描述 Nina 的身高和头发
    gloss: Elena：她个子矮，留着金色短发。
    note: 把第一课的 *baja* 与头发词汇结合起来；因为 Nina 是女孩，所以 *baja* 用阴性形式。
  es.a1.unit52.lesson04.teach.mateo_y_los:
    title: Mateo 问她的眼睛
    gloss: Mateo：那眼睛呢？
    note: '*¿Y los ojos?* 用定冠词引出话题，所以西班牙语这里不需要 *sus*。'
  es.a1.unit52.lesson04.teach.elena_tiene_los:
    title: Elena 描述 Nina 的眼睛
    gloss: Elena：她的眼睛是绿色的。
    note: 再次用到眼睛那一课的 *los ojos verdes*。
  es.a1.unit52.lesson04.teach.mateo_gracias_entonces:
    title: Mateo 会认出她
    gloss: Mateo：谢谢！那我就能认出她了。
    note: '*La reconoceré*（“我会认出她”）是将来时形式；*la* 指“她”，放在动词前面。'
  es.a1.unit52.lesson05.teach.diego_es_el:
    title: 比较 Diego 和 Lucía
    gloss: Diego 和 Lucía 是兄妹，但他们长得不一样。Diego 个子矮，留着棕色短发，眼睛是棕色的。Lucía 比 Diego 高，留着棕色长发，眼睛是绿色的。你呢，你长什么样？
    note: 这段简短的比较复习了目前学过的所有颜色和长度词，最后用本单元的核心问题询问你的外貌。
    glosses:
      hermano: 兄弟
      hermana: 姐妹
      eres: 看起来
      diferentes: 不同的
      bajo: 矮的
      corto: 矮的
      castaño: 棕色的
      pelo: 头发
      marrones: 棕色的
      ojos: 眼睛
      alta: 更高的
      largo: 长的
      verdes: 绿色的
      cómo: （“cómo es”的一部分 = ……是什么样的）
  es.a1.unit52.lesson05.teach.ya_conoces_el:
    title: 再次使用比较结构
    gloss: 你已经学过比较的结构：más + 形容词 + que。这里用在人身上：Lucía es más alta que Diego.
    note: '*más + adjective + que* 这个结构在比较那一单元学过，现在用来比较人，而不是物品。'
  es.a1.unit52.lesson05.teach.lucia_tiene_el:
    title: Lucía 的头发比 Diego 的长
    gloss: Lucía 的头发比 Diego 的长。
    note: '*Más largo que* 用来比较两者：*el pelo más largo que Diego*；*largo* 保持阳性，因为 *pelo* 是阳性。'
  es.a1.unit52.lesson05.teach.tengo_el_pelo:
    title: 我留着棕色短发
    gloss: 我留着棕色短发。
    note: 以 *tengo* 开头的第一人称示范句，描述自己时可以直接使用。
  es.a1.unit52.lesson06.teach.mateo_mira_es:
    title: Mateo 发现了 Nina
    gloss: Mateo：看，那是 Nina 吗？她留着金色短发，眼睛是绿色的。
    note: '*Mira*（“看”）是 *mirar* 的非正式命令形式，这里用来指给对方看。'
  es.a1.unit52.lesson06.teach.elena_si_esa:
    title: Elena 确认
    gloss: Elena：对，那就是 Nina！
    note: 这是一个简短自然的肯定回答。
  es.a1.unit52.lesson06.teach.nina_hola_eres:
    title: Nina 向 Mateo 问好
    gloss: Nina：你好，你是 Mateo 吗？
    note: 一个简单的非正式问候问句：*¿Eres ...?*
  es.a1.unit52.lesson06.teach.mateo_si_encantado:
    title: Mateo 回应 Nina 的问候
    gloss: Mateo：是的！很高兴认识你，Nina。
    note: '*Encantado de conocerte* 是初次见面的标准说法；女性说 *Encantada*。'
  es.a1.unit52.lesson06.teach.nina_encantada_de:
    title: Nina 回应问候
    gloss: Nina：我也很高兴认识你！
    note: 对话到此结束——Mateo 根据 Elena 之前的描述成功认出了 Nina。
