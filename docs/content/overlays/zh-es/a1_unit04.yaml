  es.a1.unit04.lesson01.dias_de_la_semana:
    title: 星期
  es.a1.unit04.lesson02.los_meses_del_ano:
    title: 一年中的月份
  es.a1.unit04.lesson03.preguntar_y_decir_la_fecha:
    title: 询问和表达日期
  es.a1.unit04.lesson04.el_cumpleanos:
    title: 埃琳娜和马特奥的生日
  es.a1.unit04.lesson05.leer_el_horario_del_taller:
    title: 阅读工作坊日程
  es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue:
    title: 埃琳娜和马特奥计划下一节课
teaching:
  es.a1.unit04.lesson01.teach.dias_entre_semana:
    title: 星期一至星期五
    gloss: 星期一、星期二、星期三、星期四、星期五
    note: 西班牙语的星期名称一律小写,只有在句首时才大写。
    example_gloss:
    - 烹饪工作坊在每周二。
    - 每周四我学西班牙语。
  es.a1.unit04.lesson01.teach.fin_de_semana:
    title: 星期六、星期日
    gloss: 星期六、星期日
    note: 在星期名称中,只有 *sábado* 和 *domingo* 的复数要加 -s(*los sábados*,*los domingos*);其他星期名称的单复数形式相同。
    example_gloss:
    - 每周六我去市场。
    - 每周日我休息。
  es.a1.unit04.lesson01.teach.hoy_es_viernes:
    title: 今天是星期五
    gloss: 今天是星期五。
    note: '*Hoy*(今天)加 *es*(是)再加星期名称,就直接说明今天是星期几,不需要冠词。'
  es.a1.unit04.lesson01.teach.el_taller_es_los_martes:
    title: 工作坊在每周二
    gloss: 烹饪工作坊在每周二。
    note: '*Los martes*(带复数冠词 *los*)表示“每周二”,指固定的周期安排,而不只是某一个星期二。'
  es.a1.unit04.lesson02.teach.meses_primer_semestre:
    title: 一月至六月
    gloss: 一月、二月、三月、四月、五月、六月
    note: 和星期名称一样,西班牙语的月份名称也是小写,只有在句首时才大写。
    example_gloss:
    - 我的生日在三月。
    - 六月很热。
  es.a1.unit04.lesson02.teach.meses_segundo_semestre:
    title: 七月至十二月
    gloss: 七月、八月、九月、十月、十一月、十二月
    note: '*Septiembre* 的词尾是 -mbre,而 octubre、noviembre、diciembre 也都以 -bre 结尾,这几个月份的写法很有规律,便于记忆。'
    example_gloss:
    - 烹饪工作坊七月开始。
    - 十二月我去看望家人。
  es.a1.unit04.lesson02.teach.mi_cumpleanos_es_en_marzo:
    title: 我的生日在三月
    gloss: 我的生日在三月。
    note: 只说月份、不说具体哪一天时,用 *en*(在)。
  es.a1.unit04.lesson03.teach.que_fecha_es_hoy:
    title: 询问今天的日期
    gloss: 今天是几月几号?
    note: '*Qué fecha*(什么日期)是询问日历日期的标准说法,与询问时间的 *qué hora*(几点)不同,后者将在以后的单元中学习。'
  es.a1.unit04.lesson03.teach.hoy_es_el_veintidos_de_julio:
    title: 表达日期
    gloss: 今天是七月二十二日。
    note: '*El veintidós de julio* 字面意思是“七月的二十二”:西班牙语日期中的“日”用普通的基数词,并且顺序是“日 + de + 月”。'
  es.a1.unit04.lesson03.teach.formato_fecha_note:
    title: 西班牙语的日期格式
    gloss: 西班牙语如何表达日历日期。
    note: 基数词 + de + 月份。每月一日常说 *el primero*（尤其在拉丁美洲），也可以说 *el uno*，在西班牙尤为常用。
    target_text: 西班牙语表示日期时,用“基数词 + de + 月份”的结构:el veintidós de julio 字面意思是“七月的二十二”。每月一号,许多人(尤其在拉丁美洲)说 *el primero*(第一);*el uno* 也很常见,在西班牙尤其如此。
  es.a1.unit04.lesson03.teach.cuando_es_el_taller:
    title: 询问工作坊是什么时候
    gloss: 工作坊是什么时候？
    note: '*Cuándo*（什么时候）泛指询问时间；*qué fecha*（本课的另一个问句）专门询问日历上的日期——这里两种问法都很自然。'
  es.a1.unit04.lesson03.teach.el_taller_es_el_veintidos_de_julio:
    title: 说出工作坊的日期
    gloss: 工作坊在7月22日。
    note: 沿用了 *hoy es el veintidós de julio* 中的日期结构，只是主语换成了 *el taller*。
  es.a1.unit04.lesson04.teach.cuando_es_tu_cumpleanos:
    title: 询问某人的生日
    gloss: 你的生日是什么时候?
    note: '*Tu cumpleaños*（你的生日，非正式）用于朋友之间，使用 *tú* 称呼。'
  es.a1.unit04.lesson04.teach.mi_cumpleanos_es_el_diez_de_marzo:
    title: 说出自己的生日
    gloss: 我的生日是3月10日。
    note: 与 *en marzo*（在三月，只说月份）不同，完整的生日日期要用 *el* 加日期数字，结构与 *el veintidós de julio* 相同。
  es.a1.unit04.lesson04.teach.el_de_mateo_es_el_veintidos_de_agosto:
    title: 说出第三人的生日
    gloss: Mateo 的生日是8月22日。
    note: '*El cumpleaños de Mateo*（Mateo 的生日）用 *de* 表示所属，结构与 *la familia de Elena* 相同。'
  es.a1.unit04.lesson04.teach.felicidades:
    title: 祝贺!
    gloss: 恭喜！／生日快乐！
    note: '*¡Felicidades!* 是通用的祝贺用语，既可用于生日，也可用于其他喜事。'
    example_gloss: Elena，恭喜！今天是你的生日。
  es.a1.unit04.lesson05.teach.horario_reading:
    title: 阅读工作坊日程
    gloss: 烹饪工作坊在每周二。下一次课是7月22日。之后，7月29日还有一次课。工作坊在8月12日结束。
    note: 这段简短的日程把你学过的星期名称和日期结构放在了一个连贯的文本里。
    glosses:
      taller: 工作坊
      cocina: 烹饪
      martes: 每周二
      próxima: 下一个
      clase: 课
      veintidós: 二十二
      julio: 七月
      Después: 之后
      hay: 有（表示存在）
      veintinueve: 二十九
      termina: 结束
      doce: 十二
      agosto: 八月
  es.a1.unit04.lesson05.teach.la_proxima_clase:
    title: 下一次课
    gloss: 下一次课
    note: '*Próxima*（下一个）要与阴性名词 *clase* 保持一致；阳性形式是 *próximo*。'
  es.a1.unit04.lesson05.teach.despues_note:
    title: Después（之后）
    gloss: '*después* 如何按先后顺序连接事件。'
    note: '*Después* = 之后，然后。'
    target_text: '*Después*(之后,然后)用来连接先后发生的两件事:先做一件事,再做下一件。'
  es.a1.unit04.lesson06.teach.line01:
    title: 询问下一次课
    gloss: Mateo 问 Elena 工作坊的下一次课是什么时候。
    note: '*La próxima clase del taller* = 工作坊的下一次课。'
  es.a1.unit04.lesson06.teach.line02:
    title: 说出日期
    gloss: Elena 确认是7月22日，星期二。
    note: Elena 在日期后补充了 *un martes*（一个星期二），确认这次课在工作坊平常上课的日子——星期二。
  es.a1.unit04.lesson06.teach.line03:
    title: 询问工作坊何时结束
    gloss: Mateo 问工作坊什么时候结束。
    note: '*Perfecto*（太好了）是在追问之前自然的简短回应。'
  es.a1.unit04.lesson06.teach.line04:
    title: 说出结束日期
    gloss: Elena 说工作坊在8月12日结束。
    note: 结束日期与印刷日程上的相同。
  es.a1.unit04.lesson06.teach.line05:
    title: 在谈话中途询问生日
    gloss: Mateo 说“顺便问一下”，然后问 Elena 的生日是什么时候。
    note: '*Por cierto*（顺便说一下）可以在谈话过程中自然地引出新话题。'
  es.a1.unit04.lesson06.teach.line06:
    title: 说出日期并把问题抛回去
    gloss: Elena 说是3月10日，然后问“你的呢？”
    note: '*¿Y el tuyo?*（你的呢？）使用物主代词 *tuyo*，这是一种新的简短说法，用来就已经提到的事物（*cumpleaños*，阳性，所以用 *tuyo* 而不是 *tuya*）把问题抛回给对方。'
  es.a1.unit04.lesson06.teach.line07:
    title: 说出 Mateo 的生日
    gloss: Mateo 说是8月22日。
    note: 简短而完整的回答，沿用日期结构，省略了“mi cumpleaños es”——在快速的口语交流中很自然。
  es.a1.unit04.lesson06.teach.line08:
    title: 作出回应并指出时间先后
    gloss: Elena 热情地回应，并指出他的生日在工作坊结束之后。
    note: '*Es después del taller*（在工作坊之后）：8月22日在工作坊8月12日结束之后。'
