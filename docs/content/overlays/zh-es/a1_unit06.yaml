teaching:
  es.a1.unit06.lesson01.teach.sandwich_ensalada:
    title: 三明治、沙拉
    gloss: 三明治、沙拉
    note: 这两个名词都是借用或改写而来的词：*sándwich* 直接借自外语，加上重音符号来标示重读音节。
    example_gloss:
    - 我想要一个三明治。
    - 沙拉里有番茄。
  es.a1.unit06.lesson01.teach.sopa:
    title: 汤
    gloss: 汤
    note: '*Sopa* 是阴性名词，和大多数以 -a 结尾的西班牙语名词一样。'
    example_gloss: 汤非常好喝。
  es.a1.unit06.lesson01.teach.agua_cafe:
    title: 水、咖啡
    gloss: 水、咖啡
    note: '*Agua* 是阴性名词，但单数时因为以重读的 *a* 音开头，要搭配阳性冠词 *el*（而不是 *la*）。这是西班牙语真正的特殊情况，不是拼写错误。'
    example_gloss:
    - 请给我一杯水。
    - 我要一杯咖啡。
  es.a1.unit06.lesson02.teach.quiero_un_sandwich:
    title: 我要一个三明治
    gloss: 我想要一个三明治。
    note: '*Quiero*（我想要）是动词 *querer* 的第一人称形式，是本单元的新动词。'
  es.a1.unit06.lesson02.teach.para_mi_un_cafe:
    title: 我要一杯咖啡
    gloss: 我要一杯咖啡。
    note: '*Para mí*（我的话要……）是另一种常见的点餐说法，直接说出菜品，不必重复动词。详见接下来的语法说明。'
  es.a1.unit06.lesson02.teach.que_quieres_comer:
    title: 问别人想吃什么
    gloss: 你想吃什么？
    note: '*Quieres* 是 *querer* 的 *tú* 形式，用于朋友之间的非正式场合。'
  es.a1.unit06.lesson02.teach.quiero_vs_para_mi_note:
    title: Quiero 与 Para mí
    gloss: 两种同样自然的点餐方式。
    note: 点餐时，*Quiero un café* 和 *Para mí, un café* 都可以说。
    target_text: '*Quiero*（“我要”）和 *Para mí*（“我的话要……”，先说这句再说菜名）在非正式场合点餐时都很自然，也同样礼貌，没有哪一种更正确。'
  es.a1.unit06.lesson03.teach.el_menu:
    title: 菜单
    gloss: 菜单
    note: '*Menú* 带有书写重音符号，因为重音落在最后一个音节上。'
    example_gloss: 我们可以看一下菜单吗？
  es.a1.unit06.lesson03.teach.podemos_ver_el_menu:
    title: 要求看菜单
    gloss: 我们可以看一下菜单吗？
    note: '*Podemos*（我们可以）是动词 *poder* 的第一人称复数形式，是本单元的新动词。'
  es.a1.unit06.lesson03.teach.aqui_tiene:
    title: 给您
    gloss: 给您。
    note: '*Aquí tiene* 是服务员把东西递给顾客时的常用说法，即使在其他方面很随意的对话中，也使用表示尊敬的 *usted* 动词形式。这是固定的礼貌用语，并不是语体的转换。'
  es.a1.unit06.lesson03.teach.buen_provecho:
    title: 祝您用餐愉快
    gloss: 祝您用餐愉快
    note: '*Buen provecho* 是在别人开始吃饭前说的常用祝愿语，作用类似于中文的“请慢用”“祝您好胃口”。'
    example_gloss: 给您。祝您用餐愉快。
  es.a1.unit06.lesson04.teach.el_postre:
    title: 甜点
    gloss: 甜点
    note: '*Postre* 是阳性名词。'
    example_gloss: 甜点我要蛋糕。
  es.a1.unit06.lesson04.teach.de_postre_quiero_pastel:
    title: 点甜点
    gloss: 甜点我要蛋糕。
    note: '*De postre*（甜点方面）用来引出最后一道菜的点单，和用 *para mí* 引出主菜的方式相同。'
  es.a1.unit06.lesson04.teach.la_cuenta_por_favor:
    title: 请求结账
    gloss: 请结账。
    note: '*La cuenta*（账单）是用餐结束时要求付款的标准说法。'
  es.a1.unit06.lesson05.teach.menu_reading:
    title: 看菜单
    gloss: 菜单：三明治，五。沙拉，八。汤，三。咖啡或水，已包含。甜点：蛋糕。
    note: 这是真实的印刷菜单格式，用的是本单元的食物词汇，并标有价格。
    glosses:
      Menú: 菜单
      sándwich: 三明治
      Ensalada: 沙拉
      Sopa: 汤
      Café: 咖啡
      agua: 水
      incluido: 已包含
      Postre: 甜点
      pastel: 蛋糕
  es.a1.unit06.lesson05.teach.incluido_note:
    title: Incluido（已包含）
    gloss: 饮料标注“已包含”是什么意思。
    note: '*Incluido* = 已包含，不另收费。'
    target_text: '*Incluido*（已包含）表示饮料随餐附送，不另收费。'
  es.a1.unit06.lesson06.teach.line01:
    title: 问候并询问点餐
    gloss: 服务员问候埃琳娜和马特奥，并问他们想吃什么。
    note: '*Buenas tardes*（下午好）从中午起使用，所以适合午餐时间。'
  es.a1.unit06.lesson06.teach.line02:
    title: 埃琳娜点餐
    gloss: 埃琳娜点了一份沙拉和一杯水。
    note: '*Una ensalada y agua* = 一份沙拉和一杯水。'
  es.a1.unit06.lesson06.teach.line03:
    title: 马特奥点餐
    gloss: 马特奥为自己点了一个三明治和一杯咖啡。
    note: 这里用 *Para mí*，而不是重复 *Quiero*。
  es.a1.unit06.lesson06.teach.line04:
    title: 询问是否要甜点
    gloss: 服务员表示认可，并问他们要不要甜点。
    note: '*¿Algo de postre?*（要点甜点吗？）是一种自然简短的推荐甜点的说法。'
  es.a1.unit06.lesson06.teach.line05:
    title: 点一份甜点共享
    gloss: 埃琳娜说好，两个人要一个蛋糕。
    note: '*Para los dos*（我们两个人一起）表示两人共享一份甜点，这是现实中很自然的选择。'
  es.a1.unit06.lesson06.teach.line06:
    title: 同意并要求结账
    gloss: 马特奥表示同意，并请服务员结账。
    note: '*La cuenta, por favor* = 请结账。'
  es.a1.unit06.lesson06.teach.line07:
    title: 递上账单
    gloss: 服务员把账单递给他们。
    note: 递东西给别人时说 *Aquí tiene*。
  es.a1.unit06.lesson06.teach.line08:
    title: 愉快地收尾
    gloss: Elena 感谢服务员,说这顿饭真好吃。
    note: '*¡Qué buena comida!* 和 *¡Qué bien!*、*¡Qué bonito!* 一样,都使用 *¡Qué ...!* 感叹句型。'
