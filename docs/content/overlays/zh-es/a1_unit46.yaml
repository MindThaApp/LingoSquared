teaching:
  es.a1.unit46.lesson01.teach.no_me_siento:
    title: 觉得不舒服
    gloss: 我感觉不舒服。
    note: '*Sentirse* 是反身动词(*me siento*、*te sientes*);*no me siento bien* 是表示感觉有点不对劲的一般说法，语气较轻。'
  es.a1.unit46.lesson01.teach.enfermo:
    title: 生病
    gloss: 生病的
    note: 这是一个基础形容词，与表示状态的 *estar* 连用：*estoy enfermo*。
    example_gloss: 我生病了。
  es.a1.unit46.lesson01.teach.estoy_enfermo:
    title: 生病了
    gloss: 我生病了。
    note: '*Enfermo* 表示的状态比 *no me siento bien* 更笼统、更严重；它会随说话人的性别变化(*enferma*)。'
  es.a1.unit46.lesson01.teach.dolor_de_cabeza:
    title: 头疼
    gloss: 头疼
    note: 西班牙语中 *dolor de cabeza* 与 *tener* 连用，且不带冠词：*tengo dolor de cabeza*。
    example_gloss: 我头痛。
  es.a1.unit46.lesson01.teach.tengo_dolor_de:
    title: 头疼
    gloss: 我头痛。
    note: 症状与 *tener*(有)搭配：*tengo dolor de cabeza*,和中文“我头疼”的说法相近。
  es.a1.unit46.lesson01.teach.dolor_de_estomago:
    title: 胃痛
    gloss: 胃痛
    note: 和 *dolor de cabeza* 一样不带冠词：*dolor de estómago*。
    example_gloss: 我胃痛。
  es.a1.unit46.lesson01.teach.tengo_dolor_de_2:
    title: 胃痛
    gloss: 我胃痛。
    note: 与 *dolor de cabeza* 一样，使用 *tener* 的结构。
  es.a1.unit46.lesson02.teach.que_pasa:
    title: 一般性的询问
    gloss: 你怎么了？
    note: 这是询问是否出了什么问题的通用说法。
  es.a1.unit46.lesson02.teach.que_te_pasa:
    title: 常用习惯说法
    gloss: 你怎么了？
    note: '*¿Qué te pasa?* 是询问对方出了什么问题的自然说法(字面意思是“什么事发生在你身上？”);不要逐字翻译。'
  es.a1.unit46.lesson02.teach.dolor_de_garganta:
    title: 喉咙痛
    gloss: 喉咙痛
    note: 结构与 *dolor de cabeza*、*dolor de estómago* 相同：*dolor de garganta*。
    example_gloss: 我喉咙痛。
  es.a1.unit46.lesson02.teach.tengo_dolor_de:
    title: 喉咙痛
    gloss: 我喉咙痛。
    note: 与其他症状一样，使用 *tener* 的结构。
  es.a1.unit46.lesson02.teach.estas_bien_no:
    title: 关心某人
    gloss: 你还好吗？不，我觉得不舒服。
    note: '*¿Estás bien?* 是朋友之间很常用的随意问候；对用 *usted* 称呼的人，则说 *¿Está bien?*。'
  es.a1.unit46.lesson03.teach.fiebre:
    title: 发烧
    gloss: 发烧
    note: 与其他症状一样，在 *tener* 之后不带冠词：*tengo fiebre*。
    example_gloss: 我发烧了。
  es.a1.unit46.lesson03.teach.tengo_fiebre:
    title: 发烧
    gloss: 我发烧了。
    note: 使用 *tener* 的结构。
  es.a1.unit46.lesson03.teach.resfriado:
    title: 感冒
    gloss: 感冒了
    note: '*Resfriado* 是与 *estar* 连用的形容词；也可以把 *resfriado* 当作名词，说 *tengo un resfriado*。'
    example_gloss: 请翻译成中文：Estoy resfriado
  es.a1.unit46.lesson03.teach.estoy_resfriado:
    title: 说自己感冒了
    gloss: 请翻译成中文：Estoy resfriado
    note: 西班牙语用形容词说 *estoy resfriado*(字面是“我处于感冒的状态”),而中文说“我感冒了”;这个形容词会随说话人的性别变化(*resfriada*)。
  es.a1.unit46.lesson03.teach.enfermo_y_resfriado:
    title: 用 estar 还是 tener,取决于词的类型
    gloss: Enfermo 和 resfriado 是形容词，与 estar 连用：我生病了，我感冒了。Fiebre 和 dolor de cabeza 是名词，与 tener 连用：我发烧了，我头疼。
    note: '*estar* 和 *tener* 的选择取决于词的类型：形容词(*enfermo*、*resfriado*)用 *estar*,表示症状的名词(*fiebre*、*dolor de cabeza*)用 *tener*。'
  es.a1.unit46.lesson04.teach.la_farmacia:
    title: 药店
    gloss: 药店
    note: 这是一个阴性名词：*la farmacia*。
    example_gloss: 我去药店。
  es.a1.unit46.lesson04.teach.en_que_puedo:
    title: 药剂师的问候
    gloss: 您需要什么？
    note: '*¿En qué puedo ayudarle?* 是标准的正式服务用语；*ayudarle* 使用了敬称 *usted* 的宾语代词 *le*。'
  es.a1.unit46.lesson04.teach.tiene_algo_para:
    title: 为某种症状求药
    gloss: 您有治头痛的药吗？
    note: '*Algo para* + 症状是请求药物的自然说法：*algo para el dolor de cabeza*。'
  es.a1.unit46.lesson04.teach.una_pastilla:
    title: 一片药
    gloss: 药片
    note: 这是一个阴性名词：*la pastilla*;*una pastilla* 指一片药。
    example_gloss: 我吃一片药。
  es.a1.unit46.lesson04.teach.toma_una_pastilla:
    title: 用药说明
    gloss: 一天吃两次，每次一片。
    note: '*Toma* 是 *tomar*(服用)的非正式命令式，用于给出指示。'
  es.a1.unit46.lesson04.teach.en_la_farmacia:
    title: 在药店使用的称呼
    gloss: 在药店要使用礼貌的敬称 usted。
    note: 药剂师是提供服务的陌生成年人，所以要用 *usted*：说 *¿Tiene algo...?*,而不是 *¿Tienes algo...?*。
  es.a1.unit46.lesson05.teach.consejo_toma_una:
    title: 阅读药店的建议
    gloss: 建议：一天吃两次药片，每次一片，用水送服。好好休息，多喝水。三天后还是觉得不舒服吗？那就去看医生。
    note: 请留意用药剂量、两条药物之外的建议，以及什么时候该去看医生。
    glosses:
      Consejo: 建议
      toma: 服用
      veces: 次
      día: 天
      pastilla: 药片
      Descansa: 休息
      bebe: 喝
      sentirte: 感觉
      sigues: 仍然
      bien: 好地
      médico: 医生
  es.a1.unit46.lesson06.teach.elena_hola_mateo:
    title: 埃莱娜来问候
    gloss: 埃莱娜：你好，马特奥，你怎么样？现在感觉好一点了吗？
    note: '*Ya*(已经)表示埃莱娜想知道马特奥自上次聊天以来是否好转了；*te sientes* 是 *sentirse* 的非正式 *tú* 形式。'
  es.a1.unit46.lesson06.teach.mateo_todavia_no:
    title: 马特奥还是不舒服
    gloss: 马特奥：还不是很好。我还是头疼，而且很累。
    note: '*Sigo con*(我仍然有)表示头痛还没有好；*cansado*(累的)是一个实用的新形容词，会随性别变化(*cansada*)。'
  es.a1.unit46.lesson06.teach.elena_has_tomado:
    title: 埃莱娜问起药的事
    gloss: 埃莱娜：你吃药了吗？
    note: '*Has tomado* 是现在完成时：*has* + 过去分词 *tomado*,和 *me has ayudado* 的结构相同。'
  es.a1.unit46.lesson06.teach.mateo_si_he:
    title: 马特奥确认
    gloss: 马特奥：吃了，我吃了一片药。我现在要去休息。
    note: '*Voy a descansar*(我要去休息)使用近将来结构 *ir a* + 动词原形。'
  es.a1.unit46.lesson06.teach.elena_buena_idea:
    title: 埃莱娜祝他早日康复
    gloss: 埃莱娜：好主意。好好休息。祝你早日康复！
    note: '*¡Que te mejores!* 是祝人早日康复的标准固定表达；其中的 *mejores* 使用了虚拟式。'
  es.a1.unit46.lesson06.teach.mateo_gracias_hasta:
    title: 马特奥道别
    gloss: 马特奥：谢谢，明天见！
    note: '*Hasta mañana* 和 *hasta luego* 一样，都是 *hasta* + 时间的告别用语。'
