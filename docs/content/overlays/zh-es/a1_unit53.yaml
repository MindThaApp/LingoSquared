teaching:
  es.a1.unit53.lesson01.teach.el_animal_la:
    title: 动物与宠物
    gloss: 动物／宠物
    note: '*Animal* 是泛指“动物”的词，*mascota* 专指“宠物”；*mascota* 是阴性词，即使指雄性动物也一样。'
    example_gloss:
    - 狗是一种动物。
    - 狗也是一种宠物。
  es.a1.unit53.lesson01.teach.el_perro_el:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - 埃莱娜有一只狗。
    - 迭戈有一只猫。
  es.a1.unit53.lesson01.teach.el_pez_el:
    title: 鱼和鸟
    gloss: 鱼／鸟
    example_gloss:
    - 爷爷养了一条鱼。
    - Nina 养了一只鸟。
  es.a1.unit53.lesson01.teach.tienes_mascota:
    title: 你养宠物吗？
    gloss: 你养宠物吗？
    note: 这个 *¿Tienes ...?* 的问句结构你在前面的单元已经学过。
  es.a1.unit53.lesson01.teach.si_tengo_un:
    title: 是的，我有一只狗
    gloss: 是的，我有一只狗。
    note: 使用本单元的新词汇作简单的肯定回答。
  es.a1.unit53.lesson01.teach.no_no_tengo:
    title: 不，我没有宠物
    gloss: 不，我没有宠物。
    note: '*No tengo mascota* 只是把 *no* 放在动词前面；请看语法说明。'
  es.a1.unit53.lesson01.teach.para_decir_que:
    title: No tengo：表示你没有某样东西
    gloss: 要表示你没有某样东西，就把 no 放在 tengo 前面：No tengo tiempo, no tengo mascota.
    note: 沿用了 *No tengo tiempo* 中学过的 *no tengo* 结构，只是换了新的名词。
  es.a1.unit53.lesson02.teach.sacar_a_pasear:
    title: 遛（动物）
    gloss: 遛（动物）
    note: '*Sacar a pasear* 是固定短语：*sacar*（“带出去”）+ *a pasear*（“去散步”）。'
    example_gloss: 我每天遛狗。
  es.a1.unit53.lesson02.teach.cuando_el_objeto:
    title: Sacar a pasear 和人称宾语前的 a
    gloss: 当宾语是动物或人时，前面要加 a：saco al perro a pasear.
    note: 沿用上一张卡片中的 *saco al perro*；在你关爱的动物或人前面，要加人称宾语的 *a*。
  es.a1.unit53.lesson02.teach.dar_de_comer:
    title: 喂食
    gloss: 喂食
    example_gloss: 我每天给猫喂食。
  es.a1.unit53.lesson02.teach.jugar_con:
    title: 和……玩
    gloss: 和……玩
    example_gloss: 迭戈和他的猫玩。
  es.a1.unit53.lesson02.teach.saco_al_perro:
    title: 我每天遛狗
    gloss: 我每天遛狗。
    note: '*Sacar a pasear* 可以和前面单元学过的 *todos los días*（每天）搭配；*a* + *el* 变成 *al*。'
  es.a1.unit53.lesson02.teach.le_doy_de:
    title: 我每天喂猫
    gloss: 我每天给猫喂食。
    note: '*Dar de comer*（字面“给吃的”）意思是喂养；*le* 指代这只动物：*le doy de comer al gato*。'
  es.a1.unit53.lesson03.teach.el_plural_termina:
    title: 'Plural: perro → perros'
    gloss: 复数以 -s 结尾：perro → perros，gato → gatos。以辅音结尾时加 -es：animal → animales。
    note: 这是西班牙语规则复数的构成方式，这里首次以动物名词为例。汉语名词一般没有复数词尾，而西班牙语名词的复数要在词尾变化。
  es.a1.unit53.lesson03.teach.perros_gatos:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - 马特奥很喜欢狗。
    - 卢西亚很喜欢猫。
  es.a1.unit53.lesson03.teach.peces_pajaros:
    title: 鱼和鸟（复数）
    gloss: 鱼（复数）／鸟
    example_gloss:
    - 我喜欢鱼。
    - 爷爷喜欢鸟。
  es.a1.unit53.lesson03.teach.me_encantan_los:
    title: 我喜欢动物
    gloss: 我喜欢动物。
    note: '*Me encantan* 用复数，因为 *los animales* 是复数：动词要和你喜爱的事物保持一致。'
  es.a1.unit53.lesson03.teach.a_lucia_le:
    title: 卢西亚喜欢猫，但没有宠物
    gloss: 卢西亚很喜欢猫，但她没有宠物。
    note: 这里引出了第 05 课阅读部分所围绕的对比。
  es.a1.unit53.lesson04.teach.mateo_tienes_mascota:
    title: 马特奥询问宠物的事
    gloss: 马特奥：埃莱娜，你有宠物吗？
  es.a1.unit53.lesson04.teach.elena_si_tengo:
    title: 埃莱娜有一只狗
    gloss: 埃莱娜：有，我有一只狗。
  es.a1.unit53.lesson04.teach.mateo_como_es:
    title: 马特奥问它长什么样
    gloss: 马特奥：它长什么样？
    note: 沿用前面外貌单元中的 *¿Cómo es?*，这次问的是动物。
  es.a1.unit53.lesson04.teach.elena_tiene_el:
    title: 埃莱娜描述她的狗
    gloss: 埃莱娜：它是棕色的毛，个头很小。
    note: 这里再次使用外貌单元学过的毛发颜色和体型词汇，不过描述的是动物的皮毛，而不是人的头发。
  es.a1.unit53.lesson04.teach.el_y_lo:
    title: 用于动物的 Él 和 lo
    gloss: Él 和 lo 也可以指动物，不只是指人。
    note: 本课程之前出现的 *él* 都指人；这里明确说明它也可以用于动物，并介绍作宾语代词的 *lo*（“他，它”）。
  es.a1.unit53.lesson04.teach.mateo_lo_sacas:
    title: 马特奥问遛狗的事
    gloss: 马特奥：你每天都带它去散步吗？
  es.a1.unit53.lesson04.teach.elena_si_lo:
    title: 埃莱娜说她的日常
    gloss: 埃莱娜：是的，我每天都带它去散步，还喂它吃东西。
  es.a1.unit53.lesson05.teach.a_mateo_y:
    title: 马特奥、卢西亚和迭戈谈动物
    gloss: 马特奥和卢西亚都很喜欢动物，但两个人都没有宠物。马特奥喜欢狗，卢西亚喜欢猫。迭戈有宠物：一只猫。他经常和他的猫玩，每天都喂它。你有宠物吗？
    note: 这里对比了喜欢动物与真正饲养宠物，是本部分要表达的重点。
    glosses:
      encantan: 喜爱
      dos: 二
      animales: 动物
      ninguno: 两者都不
      mascota: 宠物
      perros: 狗
      gatos: 猫
      gato: 猫
      juega: 玩
      da: 给
      todos: 每一
      comer: 食物
  es.a1.unit53.lesson05.teach.diego_juega_a:
    title: 迭戈经常和他的猫玩
    gloss: 迭戈经常和他的猫玩。
    note: 沿用前面单元学过的 *a menudo*（经常）。
  es.a1.unit53.lesson05.teach.me_encantan_los:
    title: 我喜欢狗。我没有宠物。
    gloss: 我喜欢狗。我没有宠物。
    note: 这是一个由两句话组成的示范答案，可以直接套用在本单元的写作题中。
  es.a1.unit53.lesson06.teach.elena_nina_tu:
    title: 埃莱娜问尼娜
    gloss: 埃莱娜：尼娜，你也有宠物吗？
  es.a1.unit53.lesson06.teach.nina_si_tengo:
    title: Nina 有一只名叫 Pico 的鸟
    gloss: Nina：是的，我有一只鸟。它叫 Pico。
    note: '*Se llama*（“叫……”）沿用了第一个单元学过的说名字的表达。'
  es.a1.unit53.lesson06.teach.mateo_que_bien:
    title: 马特奥的反应
    gloss: 马特奥：真好！你每天都和它做什么？
  es.a1.unit53.lesson06.teach.nina_le_doy:
    title: Nina 每天给它喂食
    gloss: Nina：我每天都给它喂食。
  es.a1.unit53.lesson06.teach.mateo_a_mi:
    title: 马特奥也喜欢鸟
    gloss: 马特奥：我也很喜欢鸟。
  es.a1.unit53.lesson06.teach.elena_que_bien:
    title: 埃莱娜结束对话
    gloss: 埃莱娜：真好！我们三个人都喜欢动物！
    note: 这句话将本单元三个人物与动物有关的信息串联起来，为对话收尾。
