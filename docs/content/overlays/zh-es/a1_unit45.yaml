teaching:
  es.a1.unit45.lesson01.teach.cuanto_cuesta_en:
    title: 询问总价
    gloss: 总共多少钱？
    note: '*En total* 表示你问的是全部合计的价格，而不是单个物品的价格。'
  es.a1.unit45.lesson01.teach.cuesta_veinticinco_euros:
    title: 说出总价
    gloss: 一共二十五欧元。
    note: '*Cuesta* 是 *costar*(价钱为)的第三人称单数；当词干元音重读时，*o* 变成 *ue*。'
  es.a1.unit45.lesson02.teach.pagar_con_tarjeta:
    title: 刷卡或用现金付款
    gloss: 刷卡支付，用现金支付
    note: '*Pagar con tarjeta*(刷卡支付)和 *pagar en efectivo*(用现金支付)用的介词不同：工具用 *con*,钱的形式用 *en*。'
    example_gloss:
    - 我可以在这里刷卡支付吗？
    - 我付现金。
  es.a1.unit45.lesson02.teach.puedo_pagar_con:
    title: 询问是否可以刷卡
    gloss: 我可以在这里刷卡支付吗？
    note: '*Puedo*(我可以)是 *poder* 的 *yo* 形式；*aquí*(这里)把问题限定在当前所在的地方。'
  es.a1.unit45.lesson02.teach.quiere_pagar_en:
    title: 询问付款偏好
    gloss: 您想用现金还是刷卡？
    note: '*Quiere* 是 *querer* 的敬称 *usted* 形式，这里是不熟悉的收银员对顾客使用；对朋友则说 *¿quieres pagar...?*'
  es.a1.unit45.lesson03.teach.la_cuenta:
    title: 账单
    gloss: 这份账单
    note: 阴性名词：*la cuenta*。在餐厅里指账单，在银行里指账户。
    example_gloss: 我们分摊账单好吗？
  es.a1.unit45.lesson03.teach.dividimos_la_cuenta:
    title: 提议分摊账单
    gloss: 我们分摊账单好吗？
    note: '*¿Dividimos...?* 用 *nosotros* 形式提出建议，相当于汉语的“我们……好吗？”。'
  es.a1.unit45.lesson03.teach.puedo_pagar_por:
    title: 请求分开付款
    gloss: 我可以分开付款吗？
    note: '*Por separado*(分开地)说明付款的方式；*pagar*(付款)是表示这个意思的日常动词。'
  es.a1.unit45.lesson04.teach.el_cambio:
    title: 找零
    gloss: 找零
    note: 阳性名词：*el cambio*。它也可以指任何变化，例如 *un cambio de planes*。
    example_gloss: 这是您的找零。
  es.a1.unit45.lesson04.teach.aqui_tiene_su:
    title: 递上找零
    gloss: 这是您的找零。
    note: '*Su* 是与敬称 *usted* 对应的物主词(“您的”);*Aquí tiene* 是递东西给对方时常用的礼貌说法。'
  es.a1.unit45.lesson04.teach.no_necesito_cambio:
    title: 谢绝找零
    gloss: 我不需要找零。
    note: '*Necesitar*(需要)后面直接接宾语，不加介词：*necesito cambio*;*no* 否定动词。'
  es.a1.unit45.lesson05.teach.treinta_y_cinco:
    title: 三十五
    gloss: 三十五
    note: '*Treinta y cinco*(三十五)：从 31 到 99,西班牙语用 *y* 连接十位和个位，并且分开写成单独的词。'
    example_gloss: 三十五欧元。
  es.a1.unit45.lesson05.teach.cuenta_dos_platos:
    title: 阅读餐厅账单
    gloss: 账单：两份主菜和两杯咖啡。总计：三十五欧元。已刷卡支付。
    note: 注意点了什么、总额是多少以及付款方式。
    glosses:
      Cuenta: 账单
      dos: 二
      platos: 主菜
      cafés: 咖啡
      Total: 总额
      treinta: 三十五
      euros: 欧元
      Pagado: 已支付
      tarjeta: 银行卡
  es.a1.unit45.lesson06.teach.elena_pedimos_la:
    title: Elena 要求买单
    gloss: Elena：我们叫服务员买单好吗？
    note: '*Pedir*(要求、点)以 *la cuenta* 作直接宾语：*pedimos la cuenta*(我们要账单)。'
  es.a1.unit45.lesson06.teach.mateo_si_buena:
    title: Mateo 询问总额
    gloss: Mateo：好，好主意。一共多少钱？
    note: 重复使用了第一课的问句 *¿cuánto cuesta en total?*。
  es.a1.unit45.lesson06.teach.elena_son_treinta:
    title: Elena 说出总额
    gloss: Elena：一共三十五欧元。我们分摊好吗？
    note: 说钱数时用 *son*:*son treinta y cinco euros* 用复数动词，因为金额是复数。
  es.a1.unit45.lesson06.teach.mateo_no_deja:
    title: Mateo 坚持要付钱
    gloss: Mateo：不用，今天让我来付。你帮了我很多。
    note: '*Deja que pague yo*(让我来付)在 *que* 之后使用了虚拟式 *pague*;目前把它当作固定的表达来记。*Me has ayudado* 是现在完成时(你帮过我)。'
  es.a1.unit45.lesson06.teach.elena_que_amable:
    title: Elena 很感动
    gloss: Elena：你真好！非常感谢。
    note: '*¡Qué amable eres!*(你真好！)用 *qué* + 形容词对慷慨的举动表示热情的回应；*muchas gracias* 比 *gracias* 语气更强。'
  es.a1.unit45.lesson06.teach.mateo_puedo_pagar:
    title: Mateo 询问能否刷卡
    gloss: Mateo：这里可以刷卡吗？
    note: 重复使用了第二课的问句 *¿puedo pagar con tarjeta aquí?*,这次是在真实的餐厅场景中。
  es.a1.unit45.lesson06.teach.mateo_paga_la:
    title: Paga：第三人称单数形式
    gloss: Mateo 付账单。
    note: '*Paga* 是 *pagar*(付款)的第三人称单数：*Mateo paga la cuenta*。'
