teaching:
  es.a1.unit12.lesson01.teach.nervioso:
    title: 紧张
    gloss: 紧张
    note: '*Nervioso*(阳性)/ *nerviosa*(阴性)——标准的 -o/-a 形容词对。'
    example_gloss:
    - Mateo 很紧张。
    - Elena 很紧张。
  es.a1.unit12.lesson01.teach.contento:
    title: 开心
    gloss: 开心；满意
    note: '*Contento/contenta* 表示感到开心或满意，而不是长久的特征。'
    example_gloss:
    - Mateo 很开心。
    - Elena 很开心。
  es.a1.unit12.lesson01.teach.cansado:
    title: 累的
    gloss: 累的
    note: '*Cansado/cansada*,来自 *cansar*(使疲倦)。'
    example_gloss:
    - 工作坊结束后，我很累。(男性)
    - 工作坊结束后，我很累。(女性)
  es.a1.unit12.lesson01.teach.preocupado:
    title: 担心
    gloss: 担心
    note: '*Preocupado/preocupada*,来自 *preocupar*(使担心)。'
    example_gloss:
    - Mateo 很担心。
    - Elena 很担心。
  es.a1.unit12.lesson01.teach.orgulloso:
    title: 自豪
    gloss: 自豪
    note: '*Orgulloso/orgullosa*——*estoy orgulloso/a de...*(我为……感到自豪),在所自豪的对象前要用 *de*。'
    example_gloss:
    - 我为你感到自豪。(男性)
    - 我为你感到自豪。(女性)
  es.a1.unit12.lesson02.teach.estoy_nervioso:
    title: 我很紧张(男性)
    gloss: 我很紧张。
    note: '*Estoy*(我是，来自 *estar*)+ 阳性形容词。'
  es.a1.unit12.lesson02.teach.estoy_nerviosa:
    title: 我很紧张(女性)
    gloss: 我很紧张。
    note: 结构相同，使用阴性形容词。
  es.a1.unit12.lesson02.teach.estoy_contento:
    title: 我很开心(男性)
    gloss: 我很开心。
    note: '*Estoy contento*——同样是 *estar* + 形容词的结构。'
  es.a1.unit12.lesson02.teach.estar_vs_ser_note:
    title: 表达感受用 estar 而不是 ser
    gloss: 为什么表达感受通常用 estar,而不用 ser。
    note: 见卡片正文。
    target_text: '*Estar* + 形容词表示暂时的状态或感受(estoy nervioso——我现在很紧张),而 *ser* + 形容词表示长久的特征。表达感受通常用 *estar*。'
  es.a1.unit12.lesson03.teach.como_te_sientes:
    title: 询问他人的感受
    gloss: 你感觉怎么样？
    note: '*¿Cómo te sientes?* 用的是 *sentirse*(感觉),一个反身动词，与 *estar* + 形容词的结构不同。'
  es.a1.unit12.lesson03.teach.me_siento_nervioso_pero_contento:
    title: 描述复杂的心情
    gloss: 我有点紧张，但很开心。
    note: '*Me siento*(我感觉)+ 形容词，再用 *pero*(但是)把两种感受对照起来——这是回答 *¿Cómo te sientes?* 的自然说法。'
  es.a1.unit12.lesson04.teach.algo_se_quema:
    title: 有东西烧焦了
    gloss: 有东西烧焦了！
    note: '*Se quema* 是 *quemar*(烧)的自复形式，字面意思是“它自己烧起来”,是不点明是谁造成时，表达“有东西烧着了/烧焦了”的自然说法。'
  es.a1.unit12.lesson04.teach.estoy_preocupado:
    title: 我很担心(男性说)
    gloss: 我很担心。
    note: '*Preocupado* 用在 *estoy* + 形容词的结构中。'
  es.a1.unit12.lesson04.teach.no_te_preocupes:
    title: 别担心
    gloss: 别担心。
    note: 请看下面的语法说明。
  es.a1.unit12.lesson04.teach.podemos_empezar_de_nuevo:
    title: 建议重新开始
    gloss: 我们可以重新开始。
    note: '*Podemos*(我们可以)+ 动词原形；*de nuevo*(重新)是表示重做某事的常用短语。'
  es.a1.unit12.lesson04.teach.no_te_preocupes_note:
    title: No te preocupes
    gloss: “别担心”背后的否定命令式结构。
    note: 见卡片正文。
    target_text: '*No te preocupes*(别担心)是否定的非正式命令式，结构为 *no* + 反身代词(*te*)+ 动词。'
  es.a1.unit12.lesson05.teach.reflexion_reading:
    title: 对这节课的回顾
    gloss: 上课前，Elena 和 Mateo 有点紧张。上课时，有东西烧焦了，两个人都很担心。但他们重新开始，最后蛋糕做得很完美。现在两个人都非常自豪，也很开心。
    note: '*Estaban*(他们当时是)描述当时的感受；*están*(他们现在是)描述现在的感受。'
    glosses:
      Antes: 之前
      clase: 课
      estaban: 当时是(estar 的变位)
      poco: 一点
      nerviosos: 紧张
      Durante: 在……期间
      algo: 某事物
      quemó: 烧焦了(quemarse 的变位)
      dos: 两个人
      preocupados: 担心
      Pero: 但是
      empezaron: 开始了(empezar 的变位)
      nuevo: 重新
      final: 最后
      pastel: 蛋糕
      salió: 做出来了(salir 的变位)
      perfecto: 完美的
      Ahora: 现在
      están: 是(estar 的变位)
      orgullosos: 自豪
      contentos: 高兴的
  es.a1.unit12.lesson05.teach.plural_adjective_note:
    title: 形容词复数的性数一致
    gloss: 为什么男女混合的群体要用阳性复数形容词。
    note: 见卡片正文。
    target_text: 描述 Elena 和 Mateo 两个人时，形容词用阳性复数形式(nerviosos, preocupados, orgullosos, contentos)——这是西班牙语的通用规则：只要群体中至少有一名男性，就用阳性。
  es.a1.unit12.lesson06.teach.line01:
    title: 询问 Mateo 的感受
    gloss: Elena 问 Mateo 上课前感觉怎么样。
    note: '*¿Cómo te sientes?* 用来询问别人的感受。'
  es.a1.unit12.lesson06.teach.line02:
    title: 用复杂的心情回答
    gloss: Mateo 说他有点紧张，但很开心。
    note: Mateo 使用阳性形式 *nervioso* 和 *contento*。
  es.a1.unit12.lesson06.teach.line03:
    title: 对意外状况作出反应
    gloss: Elena 表示同感，然后发现有东西烧焦了。
    note: '*¡Ay, no!*(哎呀，不！)是表示惊慌的常用感叹语。'
  es.a1.unit12.lesson06.teach.line04:
    title: 表达担心
    gloss: Mateo 说他很担心，并问该怎么办。
    note: '*¿Qué hacemos?*(我们怎么办？)是一个实用的问句。'
  es.a1.unit12.lesson06.teach.line05:
    title: 安慰并提出解决办法
    gloss: Elena 叫他别担心——他们可以重新开始。
    note: 结合了 *no te preocupes* 和 *podemos empezar de nuevo*。
  es.a1.unit12.lesson06.teach.line06:
    title: 同意并再试一次
    gloss: Mateo 表示同意，并提议再试一次。
    note: '*Vamos a intentarlo otra vez*(我们再试一次吧)沿用了前面单元学过的 *vamos a* + 动词原形结构，这次加上了宾语代词 *lo*。'
  es.a1.unit12.lesson06.teach.line07:
    title: 宣布成功
    gloss: Elena 宣布蛋糕现在很完美。
    note: '*¡Mira!*(看！)是引起注意的感叹词；*el pastel*(蛋糕)就是这次意外的中心。'
  es.a1.unit12.lesson06.teach.line08:
    title: 庆祝并表达自豪
    gloss: Mateo 欢呼庆祝，并说他为他们两人感到自豪。
    note: '*¡Qué bien!*(太好了！)用的是 *¡Qué...!* 感叹句式，就像 *¡Qué calor!*;*de nosotros*(为我们)把 *estoy orgulloso de ti* 扩展到了一群人。'
  es.a1.unit12.lesson06.teach.line09:
    title: 分享自豪
    gloss: Elena 表示她也很自豪——是他们一起做到的。
    note: '*Lo logramos juntos*(我们一起做到了)是自然的结束语，这里首次使用 *lograr*(做到、成功)。'
