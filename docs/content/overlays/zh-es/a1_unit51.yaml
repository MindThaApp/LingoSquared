teaching:
  es.a1.unit51.lesson01.teach.el_billete:
    title: 门票
    gloss: 这张门票
    note: '*El billete* 是阳性名词,所以说 *un billete*,不用 *una*。'
    example_gloss: 我想要一张去托莱多的票。
  es.a1.unit51.lesson01.teach.quisiera_un_billete:
    title: 请求买票
    gloss: 我想要一张去托莱多的票。
    note: '*Quisiera*(“我想要”)能让请求的语气更委婉,比 *quiero* 更有礼貌。'
  es.a1.unit51.lesson01.teach.quiere_un_billete:
    title: 售票员询问票种
    gloss: 您要单程票还是往返票?
    note: '*Quiere* 是 *querer* 的 *usted* 敬称形式,这里用于称呼不熟悉的车站工作人员。'
  es.a1.unit51.lesson01.teach.ida_y_vuelta:
    title: 礼貌地回答
    gloss: 请给我往返票。
    note: '*Por favor* 就是“请”的意思,这样说既礼貌又简短。'
  es.a1.unit51.lesson01.teach.en_la_taquilla:
    title: 售票窗口的称呼方式
    gloss: 在售票窗口,通常使用敬称 usted。
    note: 对从事服务工作的陌生人,要用 *usted* 称呼,而不用 *tú*。
  es.a1.unit51.lesson02.teach.el_anden:
    title: 站台
    gloss: 站台
    note: '*El andén* 是阳性名词:*un andén*、*el andén*。'
    example_gloss: 去托莱多的火车从哪个站台发车？
  es.a1.unit51.lesson02.teach.de_que_anden:
    title: 询问站台
    gloss: 去托莱多的火车从哪个站台发车？
    note: '*¿De qué andén ...?* 专门询问站台,而不是泛指某个地点。'
  es.a1.unit51.lesson02.teach.el_tren_sale:
    title: 说明发车信息
    gloss: 火车九点三刻从五号站台发车。
    note: '*Las diez menos cuarto* 沿用了时间一课中学过的“差一刻”的说法。'
  es.a1.unit51.lesson02.teach.a_que_hora:
    title: 询问到达时间
    gloss: 火车几点到?
    note: '*¿A qué hora llega ...?* 用来询问到达时间;*llegar* 是规则动词,时间前面要用 *a las*。'
  es.a1.unit51.lesson02.teach.el_tren_llega:
    title: 说明到达时间
    gloss: 火车十一点到。
    note: '*Llega a las once* 使用了 *llegar*(到达),时间前面加 *a las*。'
  es.a1.unit51.lesson03.teach.a_tiempo_el:
    title: 准时/延误
    gloss: 准时;延误
    note: '*A tiempo* 是固定表达,表示按计划进行。*El retraso*(延误)是阳性名词。'
    example_gloss:
    - 火车没有准时发车。
    - 请注意:开往托莱多的火车晚点了。
  es.a1.unit51.lesson03.teach.atencion_el_tren:
    title: 一则广播
    gloss: 请注意:开往托莱多的火车晚点了。
    note: '*Atención* 用在车站广播的开头,相当于中文的“请注意”或“各位旅客请注意”。'
  es.a1.unit51.lesson03.teach.el_tren_no:
    title: 否定“准时”
    gloss: 火车没有准时发车。
    note: '*No* 直接放在动词前面,否定整个句子:*no sale a tiempo*。'
  es.a1.unit51.lesson03.teach.el_tren_sale:
    title: 站台变更
    gloss: 火车改从三号站台发车,而不是五号站台。
    note: '*En lugar de* 的意思是“而不是”“代替”。'
  es.a1.unit51.lesson03.teach.el_tren_lleva:
    title: 说明晚点时长
    gloss: 火车晚点十分钟。
    note: '*Lleva retraso*(字面意思是“带着延误”)是表示晚点的自然说法。'
  es.a1.unit51.lesson04.teach.la_entrada_la:
    title: 入口、出口、候车室
    gloss: 入口;出口;候车室
    note: '*La entrada*、*la salida* 和 *la sala de espera* 都是阴性名词。'
    example_gloss:
    - 入口在哪里?
    - 出口在哪里?
    - 候车室在哪里?
  es.a1.unit51.lesson04.teach.donde_esta_el:
    title: 询问站台在哪里
    gloss: 七号站台在哪里？
    note: 这里沿用了问路课中学过的 *¿Dónde está ...?* 句型。
  es.a1.unit51.lesson04.teach.todo_recto_y:
    title: 指路
    gloss: 一直往前走,然后向右转。
    note: '*Todo recto* 和 *a la derecha* 是问路课中学过的方向用语,这里用在车站里。'
  es.a1.unit51.lesson04.teach.donde_esta_la:
    title: 询问候车室
    gloss: 候车室在哪里?
    note: 同一个问句句型,用在新的地点上。
  es.a1.unit51.lesson05.teach.billete_madrid_atocha:
    title: 读一张车票
    gloss: 车票:马德里阿托查至托莱多。发车:十点十分,七号站台。到达:十一点差十分。往返票。票价:十二欧元四十分。
    note: 请找出发车时间和站台、到达时间、票种以及票价。
    glosses:
      Billete: 门票
      Salida: 发船
      diez: 十
      andén: 站台
      siete: 七
      Llegada: 到达
      once: 十一
      vuelta: 往返票
      Precio: 票价
      doce: 十二
      euros: 欧元
      cuarenta: 四十
  es.a1.unit51.lesson06.teach.mateo_tenemos_que:
    title: 马特奥说明计划
    gloss: 马特奥:我们得去七号站台。火车十点十分发车。
    note: '*Tenemos que* + 动词原形(“我们必须”)表示实际需要。'
  es.a1.unit51.lesson06.teach.elena_mira_ahi:
    title: 埃莱娜看指示牌
    gloss: 埃莱娜:看,那边的显示屏:晚点,十分钟。
    note: '*Ahí está*(“就在那儿”)用来指出那块牌子;*el panel* 是信息显示屏。'
  es.a1.unit51.lesson06.teach.mateo_no_hay:
    title: 马特奥保持镇定
    gloss: 马特奥:没问题,我们还有时间喝杯咖啡。
    note: '*No hay problema* 是常用的随意安慰说法,意思是“没问题”。'
  es.a1.unit51.lesson06.teach.elena_buena_idea:
    title: 火车到了
    gloss: 埃莱娜:好主意。啊,火车已经到了!正好是七号站台!
    note: '*Ya*(“已经”)表示火车比刚刚广播的晚点情况来得更早。'
  es.a1.unit51.lesson06.teach.mateo_vamos_que:
    title: 他们上了火车
    gloss: 马特奥:走吧,大家都在上车了!托莱多,我们来啦!
    note: '*Suben*(“他们上车”)来自 *subir*,意为上车;*¡Allá vamos!* 是表达“我们出发啦”的自然说法。'
