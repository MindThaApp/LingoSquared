  es.a1.unit15.lesson01.mas_menos_tan_vocabulario:
    title: 更多、更少、一样
  es.a1.unit15.lesson02.comparar_los_apartamentos:
    title: 新的比旧的大
  es.a1.unit15.lesson03.cual_es_mas_grande:
    title: 哪套公寓更大？
  es.a1.unit15.lesson04.tan_bien_como:
    title: 马特奥做饭和埃琳娜一样好
  es.a1.unit15.lesson05.leer_la_comparacion:
    title: 比较两套公寓
  es.a1.unit15.lesson06.comparar_apartamentos_dialogue:
    title: 埃琳娜和马特奥比较公寓
teaching:
  es.a1.unit15.lesson01.teach.mas_que:
    title: 比……更……
    gloss: 比……更……
    note: '*Más...que* 用来比较两个不同的数量或事物——见下面的语法说明。'
    example_gloss: 新公寓比旧公寓大。
  es.a1.unit15.lesson01.teach.menos_que:
    title: 比……更不……
    gloss: 比……更不……
    note: '*Menos...que*，与 *más...que* 相反。'
    example_gloss: 旧公寓没有新公寓那么大。
  es.a1.unit15.lesson01.teach.tan_como:
    title: 和……一样……
    gloss: 和……一样……
    note: '*Tan...como* 用来比较两个相等的事物——这是与 *más/menos* 真正不同的结构，不只是同一意思的另一种说法。'
    example_gloss: 马特奥做饭做得和埃琳娜一样好。
  es.a1.unit15.lesson01.teach.mas_menos_tan_note:
    title: 不等与相等
    gloss: más/menos...que 与 tan...como 的区别。
    note: 见卡片上的正文。
    target_text: '*Más...que*（比……更……）和 *menos...que*（比……更不……）用来比较两个不同的事物或数量。*Tan...como*（和……一样……）用来比较两个相等的事物——这是另一种结构，不只是 *más/menos* 的同义说法。'
  es.a1.unit15.lesson02.teach.el_nuevo_es_mas_grande:
    title: 比较新公寓
    gloss: 新公寓比旧公寓大。
    note: '*Más grande que*（比……大）把 *grande*（大）放进 *más...que* 结构中。'
  es.a1.unit15.lesson02.teach.el_viejo_es_mas_pequeno:
    title: 比较旧公寓
    gloss: 旧公寓比新公寓小。
    note: '*Más pequeño que*（比……小）使用 *pequeño*（小），从相反的方向表达比较。'
  es.a1.unit15.lesson03.teach.cual_apartamento_es_mas_grande:
    title: 问哪个更大
    gloss: 哪套公寓更大？
    note: '*¿Cuál...?*(哪一个……?)加比较级形容词,是询问比较结果的标准说法。'
  es.a1.unit15.lesson03.teach.el_nuevo_es_mas_grande_reply:
    title: 回答哪个更大
    gloss: 新的比旧的大。
    note: 同样的比较,这次直接回答 *¿cuál...?* 的问题;*el nuevo*(新的那个)省略了重复的名词。
  es.a1.unit15.lesson04.teach.mateo_cocina_tan_bien_como_elena:
    title: 比较做饭水平相当
    gloss: 马特奥做饭做得和埃琳娜一样好。
    note: '*Tan bien como*(和……一样好)用 *tan* + 副词 + *como*,是表示同等的句型,这里用来比较动作的方式,而不是名词的大小。'
  es.a1.unit15.lesson04.teach.somos_un_buen_equipo:
    title: 说我们是一个好团队
    gloss: 我们是一个好团队。
    note: '*Somos*(我们是)+ *un buen equipo*(一个好团队),是同等比较之后很自然的收尾句。'
  es.a1.unit15.lesson05.teach.comparacion_reading:
    title: 比较两套公寓
    gloss: 马特奥的旧公寓厨房很小。新公寓更大,厨房也更大。旧的比新的小,所以马特奥想搬家。新公寓有更多的空间做饭。
    note: 一段比较两个公寓的实用小结。
    glosses:
      viejo: 旧的
      tiene: 有(tener 的变位)
      pequeña: 小的
      nuevo: 新的
      grande: 大的
      también: 也
      pequeño: 小的
      eso: 比
      quiere: 想要(querer 的变位)
      mudarse: 搬家
      espacio: 空间
      cocinar: 做饭
  es.a1.unit15.lesson05.teach.por_eso_note:
    title: Por eso(所以)
    gloss: por eso 如何把原因和结果联系起来。
    note: 见卡片上的正文。
    target_text: '*Por eso*（所以／因此）把原因和结果连接起来——厨房小就是马特奥想搬家的原因，这与你已经见过的 *porque* 的因果逻辑相同。'
  es.a1.unit15.lesson06.teach.line01:
    title: 问他是否看过了
    gloss: 埃琳娜问马特奥是否已经看过新公寓了。
    note: '*¿Ya viste...?*(你已经看过……了吗?)是一种新的过去时疑问句型。'
  es.a1.unit15.lesson06.teach.line02:
    title: 确认新的更大
    gloss: 马特奥确认新公寓比旧的大,厨房也一样。
    note: '*más...que* 比较句,后面再加上 *la cocina también*(厨房也是)。'
  es.a1.unit15.lesson06.teach.line03:
    title: 问哪个更小
    gloss: 埃琳娜问那么哪个公寓更小。
    note: '*Entonces*(那么、于是)是你以前见过的逻辑连接词;这个问句是 *¿Cuál...?* 句型,只是把 *grande* 换成了 *pequeño*。'
  es.a1.unit15.lesson06.teach.line04:
    title: 回答并解释
    gloss: 马特奥说旧的更小,所以他想搬家。
    note: '*El viejo es más pequeño que el nuevo* 加上 *por eso quiero mudarme*(所以我想搬家)。'
  es.a1.unit15.lesson06.teach.line05:
    title: 表示赞同有道理
    gloss: 埃琳娜说很有道理——新公寓有更多做饭的空间。
    note: '*Tiene mucho sentido*(很有道理)是一个新的表示赞同的说法;*más espacio para cocinar* 的意思是更多做饭的空间。'
  es.a1.unit15.lesson06.teach.line06:
    title: 继续推理
    gloss: 马特奥表示同意,并补充说埃琳娜做饭和他一样好,所以他们需要够两个人用的空间。
    note: '*Tan bien como*(和……一样好),这里用在对话中,搭配 *tú cocinas*(你做饭)。'
  es.a1.unit15.lesson06.teach.line07:
    title: 回以赞美
    gloss: 埃琳娜热情地表示同意,并说他做饭和她一样好。
    note: '*¡Es verdad!*(没错!)+ *tú cocinas tan bien como yo*(你做饭和我一样好)——同样的 *tan bien como* 比较,这次反过来说马特奥。'
  es.a1.unit15.lesson06.teach.line08:
    title: 以团队精神结束
    gloss: 马特奥总结说他们是一个好团队。
    note: '*Somos un buen equipo*(我们是一个好团队)为对话收尾。'
