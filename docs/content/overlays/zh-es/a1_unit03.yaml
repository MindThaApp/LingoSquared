  es.a1.unit03.lesson01.immediate_family:
    title: 近亲
  es.a1.unit03.lesson02.possessives_and_asking:
    title: 物主形容词：mi、tu、su
  es.a1.unit03.lesson03.extended_family:
    title: 其他亲戚
  es.a1.unit03.lesson04.describing_family_size:
    title: 家里有几口人
  es.a1.unit03.lesson05.reading_a_family_profile:
    title: 阅读家庭简介
  es.a1.unit03.lesson06.family_photos_dialogue:
    title: Elena和Mateo的家庭照片
teaching:
  es.a1.unit03.lesson01.teach.madre:
    title: 母亲
    gloss: 母亲
    note: '*Madre* 是阴性名词。家人之间日常更常说 *mamá*，而 *madre* 是中性的说法，本课程的词汇表中使用它。'
  es.a1.unit03.lesson01.teach.padre:
    title: 父亲
    gloss: 父亲
    note: '*Padre* 是阳性名词。*Papá* 是日常说法，与 *madre*/*mamá* 的关系相同。'
  es.a1.unit03.lesson01.teach.hermano:
    title: 哥哥／弟弟
    gloss: 兄弟
    note: '*Hermano* 是阳性单数。中文要区分哥哥和弟弟，西班牙语则不分长幼。'
  es.a1.unit03.lesson01.teach.hermana:
    title: 姐姐／妹妹
    gloss: 姐妹
    note: '*Hermana* 是阴性单数。中文要区分姐姐和妹妹，西班牙语则不分长幼。'
  es.a1.unit03.lesson01.teach.hijo:
    title: 儿子
    gloss: 儿子
    note: '*Hijo* 是阳性单数。'
  es.a1.unit03.lesson01.teach.hija:
    title: 女儿
    gloss: 女儿
    note: '*Hija* 是阴性单数。'
  es.a1.unit03.lesson01.teach.padres:
    title: 父母
    gloss: 父母
    note: '*Padres*（阳性复数）可以指父母二人，即男女混合的一对；只要一个群体中至少有一名男性，西班牙语就使用阳性复数。'
  es.a1.unit03.lesson01.teach.hermanos:
    title: 兄弟姐妹
    gloss: 兄弟姐妹；兄弟
    note: '*Hermanos* 可以指“兄弟”（全是男性），也可以指“兄弟姐妹”（男女混合），与 *padres* 一样遵循阳性复数包含混合群体的规则。'
  es.a1.unit03.lesson02.teach.mi_familia:
    title: 我的家庭
    gloss: 我的家庭
    note: '*Mi*（无重音符号）是物主形容词“我的”；它不随阴阳性变化，只随数变化（复数名词用 *mis*）。'
  es.a1.unit03.lesson02.teach.tu_familia:
    title: 你的家庭（非正式）
    gloss: 你的家庭
    note: '*Tu*（无重音符号，不同于代词 *tú*）是非正式的物主形容词，与第1单元的 *tú* 用法一致。'
  es.a1.unit03.lesson02.teach.su_familia:
    title: 您的／他的／她的家庭（正式或第三人称）
    gloss: 他／她／您的家庭
    note: '*Su* 既可以表示“他的”“她的”，也可以表示正式的“您的”（*usted*）；单靠物主形容词无法区分，需要根据上下文来判断。'
  es.a1.unit03.lesson02.teach.tienes_hermanos:
    title: 询问有没有兄弟姐妹
    gloss: 你有兄弟姐妹吗？
    note: '*Tienes* 是 *tener* 的 *tú* 变位形式，第2单元表达年龄时用的就是这个动词。'
  es.a1.unit03.lesson02.teach.tengo_dos_hermanas:
    title: 说明兄弟姐妹的数量
    gloss: 我有两个姐妹。
    note: '*Tengo*（我有）加数字和亲属名词，是描述兄弟姐妹的标准说法。'
  es.a1.unit03.lesson02.teach.tu_familia_es_grande:
    title: 询问家庭是否很大
    gloss: 你的家庭很大吗？
    note: '*Grande*（大）不随阴阳性变化，只随数变化（*grandes*）。'
  es.a1.unit03.lesson02.teach.mi_familia_es_pequena:
    title: 描述一个小家庭
    gloss: 我的家庭很小。
    note: '*Pequeña* 与阴性名词 *familia* 一致；若名词是阳性，则要用阳性形式 *pequeño*。'
  es.a1.unit03.lesson03.teach.abuelo:
    title: 祖父
    gloss: 祖父
    note: '*Abuelo* 是阳性单数。'
  es.a1.unit03.lesson03.teach.abuela:
    title: 祖母
    gloss: 祖母
    note: '*Abuela* 是阴性单数。'
  es.a1.unit03.lesson03.teach.abuelos:
    title: 祖父母
    gloss: 祖父母
    note: '*Abuelos*（阳性复数）可以指男女混合的一对，规则与 *padres*、*hermanos* 相同。'
  es.a1.unit03.lesson03.teach.tio:
    title: 叔叔／舅舅
    gloss: 叔叔／舅舅
    note: '*Tío* 带有重音符号，因为重音落在 *í* 上，这样就不会读成一个双元音。'
  es.a1.unit03.lesson03.teach.tia:
    title: 阿姨／姑姑
    gloss: 阿姨／姑姑
    note: '*Tía* 的重音符号规则与 *tío* 相同，原因也相同。'
  es.a1.unit03.lesson03.teach.primo:
    title: 堂兄弟／表兄弟
    gloss: 堂兄弟／表兄弟
    note: '*Primo* 是阳性单数；西班牙语会标明堂（表）兄弟姐妹的性别，中文也要区分堂兄弟和堂姐妹，但西班牙语不区分长幼，也不区分父系和母系。'
  es.a1.unit03.lesson03.teach.prima:
    title: 堂姐妹／表姐妹
    gloss: 堂姐妹／表姐妹
    note: '*Prima* 是阴性单数。'
  es.a1.unit03.lesson03.teach.mis_abuelos:
    title: 我的祖父母
    gloss: 我的祖父母
    note: '*Mis* 是 *mi* 的复数形式；只要所修饰的名词是复数，无论阴阳性都必须使用。'
  es.a1.unit03.lesson04.teach.cuantos_hermanos_tienes:
    title: 询问有几个兄弟姐妹
    gloss: 你有几个兄弟姐妹？
    note: '*Cuántos*（阳性复数，因为 *hermanos* 可以包括男女混合的群体）与所询问的名词保持一致。'
  es.a1.unit03.lesson04.teach.somos_cinco:
    title: 说明家里的人数
    gloss: 我们家有五口人。
    note: 用 *Somos*（我们是）来说明家里的总人数是西班牙语的自然说法，不是逐字对应“有”的直译。
  es.a1.unit03.lesson04.teach.mi_familia_es_grande:
    title: 描述大家庭
    gloss: 我的家庭很大。
    note: 这里的 *Grande* 修饰阴性名词 *familia*，形式仍是 *grande*，因为像 *grande* 这样以 -e 结尾的形容词不随阴阳性变化。
  es.a1.unit03.lesson04.teach.tengo_muchos_primos:
    title: 说明你有很多堂表兄弟姐妹
    gloss: 我有很多堂表兄弟姐妹。
    note: 这里用 *Muchos*（阳性复数），因为 *primos* 与 *hermanos*、*padres* 一样，可以指男女混合的一群人。
  es.a1.unit03.lesson04.teach.vives_cerca_de_tus_padres:
    title: 询问是否住在父母附近
    gloss: 你住在父母附近吗？
    note: '*Tus* 是 *tu* 的复数形式，因为 *padres* 是复数，所以必须用它。'
  es.a1.unit03.lesson04.teach.vivo_con_mis_abuelos:
    title: 说明你和谁住在一起
    gloss: 我和祖父母住在一起。
    note: '*Con*（和……一起）用来引出同住的人；*vivo* 是 *vivir* 的 *yo* 变位形式，在第1单元的 *vivo en Londres* 中已经见过。'
  es.a1.unit03.lesson05.teach.profile_reading:
    title: 埃莱娜的家庭简介
    gloss: 我叫埃莱娜。我三十一岁，和祖父母住在西班牙。我的妈妈和爸爸住在巴塞罗那。我有一个姐妹和一个兄弟：我们家有五口人。我的妹妹叫索菲亚，今年二十岁。
    note: 这份简介把第1至4课的词汇和结构放进一段连贯的短文里，而不是孤立的句子，训练的正是本单元阅读测验所关注的“谁是谁”的阅读能力。
    glosses:
      llamo: 叫（来自 llamarse）
      Tengo: 我是／我有（来自 tener）
      treinta: 三十
      años: 岁
      vivo: 住（来自 vivir）
      abuelos: 祖父母
      madre: 母亲
      padre: 父亲
      viven: 住（来自 vivir）
      hermana: 姐妹
      hermano: 兄弟
      somos: 我们是（来自 ser）
      cinco: 五
      casa: 家
      menor: 较年幼的
      tiene: 是／有（来自 tener）
      veinte: 二十
  es.a1.unit03.lesson05.teach.hermana_menor:
    title: 妹妹
    gloss: 妹妹
    note: '*Menor*（较年幼的）放在所修饰的名词之后，形式不随性别变化。'
  es.a1.unit03.lesson05.teach.vive_third_person:
    title: 住（第三人称）
    gloss: 住
    note: '*Vive* 是 *vivir* 的第三人称单数形式，用来谈论别人（*Elena vive*……），而不是说自己（*vivo*，在第1单元第4课首次出现，本单元第4课又出现过）。'
  es.a1.unit03.lesson05.teach.sus_third_person_plural:
    title: 她的／他的／他们的（修饰复数名词）
    gloss: 她的／他的／他们的
    note: '*Sus* 是 *su* 的复数形式。*su* 修饰单数名词时可以表示“他的／她的／您的”，sus 同理——以第三人称谈到埃莱娜时，*sus abuelos* 就是“她的祖父母”。'
  es.a1.unit03.lesson06.teach.line01:
    title: 展示家人照片
    gloss: 埃莱娜给马特奥看一张照片，介绍她的父母和妹妹。
    note: '*Estos son*（这些是，阳性或混合复数）用来介绍父母；*esta es*（这是，阴性单数）用来介绍妹妹。'
  es.a1.unit03.lesson06.teach.line02:
    title: 作出回应并询问兄弟姐妹
    gloss: 马特奥热情地回应，并问她是否还有其他兄弟姐妹。
    note: '*Qué bonito* 是看到照片时自然而亲切的反应，作用类似第1单元的 *Qué bien*。'
  es.a1.unit03.lesson06.teach.line03:
    title: 说明家里的人数并反问对方
    gloss: 埃莱娜说她有一个姐妹和一个兄弟，家里一共五口人，然后问起马特奥的家人。
    note: '*Somos cinco en casa* 说明家里的总人数，延续了第4课的句型。'
  es.a1.unit03.lesson06.teach.line04:
    title: 描述较小的家庭
    gloss: 马特奥说他的家庭比较小，只有三口人：他的父母和他自己，但他有很多堂表兄弟姐妹。
    note: '*Pero*（但是）表示小小的核心家庭与众多亲戚之间的对比。'
  es.a1.unit03.lesson06.teach.line05:
    title: 询问是否住得离父母近
    gloss: 埃莱娜问马特奥是否住在父母附近。
    note: '*Cerca de*（在……附近）是描述距离很近的常用说法。'
  es.a1.unit03.lesson06.teach.line06:
    title: 说明距离并保持联系
    gloss: 马特奥说不，他们住在哥伦比亚，他们每周通电话。
    note: 延续第1单元已确立的设定：马特奥来自哥伦比亚，但住在伦敦，他的父母仍留在哥伦比亚。
  es.a1.unit03.lesson06.teach.line07:
    title: 表示理解并分享自己的情况
    gloss: 埃莱娜说她理解，并说自己在西班牙这里和祖父母住在一起。
    note: '*Entiendo*（我明白）是简短自然的回应方式，用来回应对方刚分享的内容，再补充自己的相关情况。'
  es.a1.unit03.lesson06.teach.line08:
    title: 以温暖的话作结
    gloss: 马特奥说家人在身边真好。
    note: '*Qué bien tener a la familia cerca* 以温暖而有感触的话结束对话，呼应了整段对话中 *qué bien*／*qué bonito* 的句型。'
