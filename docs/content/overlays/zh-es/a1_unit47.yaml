teaching:
  es.a1.unit47.lesson01.teach.llamar:
    title: 打电话
    gloss: 打电话
    note: 表示打电话的动词的不定式。
    example_gloss: 我得给你打电话。
  es.a1.unit47.lesson01.teach.te_llamo:
    title: 说你会打电话
    gloss: 我给你打电话。
    note: '*Llamo* 是 *llamar* 的 *yo* 变位形式；加上 *te* 就是“我给你打电话”。西班牙语在这里用现在时表示即将发生的动作，这和汉语用“我给你打电话”“我打给你”这类说法的习惯相近。'
  es.a1.unit47.lesson01.teach.hola_soy_elena:
    title: 接电话
    gloss: 你好，我是埃琳娜。
    note: 西班牙语在电话里用 *soy* + 名字（字面意思是“我是”）来表明身份，和汉语的“我是……”一样。
  es.a1.unit47.lesson01.teach.hola_soy_mateo:
    title: 马特奥也这样回答
    gloss: 你好，我是马特奥。
    note: 和 *Hola, soy Elena* 一样，都是 *soy* + 名字的结构。
  es.a1.unit47.lesson02.teach.con_quien_hablo:
    title: 询问对方是谁
    gloss: 请问您是哪位？
    note: 不知道是谁打来电话时，用 *¿Con quién hablo?* 是标准的说法。
  es.a1.unit47.lesson02.teach.habla_con_elena:
    title: 礼貌地表明身份
    gloss: 您找的是埃琳娜。
    note: '*Habla con* + 名字使用 *hablar* 的敬称 *usted* 形式：是 *soy* + 名字的礼貌说法。'
  es.a1.unit47.lesson03.teach.puedes_repetir_eso:
    title: 请对方重复
    gloss: 你能重复一遍吗？
    note: '*¿Puedes...?*（你能……吗？）加 *repetir*（重复）再加 *eso*（那个）。'
  es.a1.unit47.lesson03.teach.no_hables_tan:
    title: 请对方说慢一点
    gloss: 请别说得这么快。
    note: '*No hables* 是 *hablar* 的非正式否定命令式；*tan rápido*（这么快）表示程度。'
  es.a1.unit47.lesson03.teach.no_te_oigo:
    title: 说你听不清
    gloss: 我听不清你说话。
    note: '*Oír*（听见）加 *no ... bien*（不太好）表示听力上的问题，与 *entender*（听懂）不同；*te oigo* 的意思是“我听得到你”。'
  es.a1.unit47.lesson04.teach.el_mensaje:
    title: 短信
    gloss: 短信
    note: 阳性名词：*el mensaje*。西语使用者也说 *el SMS* 或 *el texto*，但 *mensaje* 是最中性的选择。
    example_gloss: 这条短信是埃琳娜发的。
  es.a1.unit47.lesson04.teach.te_envio_un:
    title: 说你会发短信
    gloss: 我给你发条短信。
    note: '*Enviar*（发送）位于代词 *te*（给你）之后：*te envío un mensaje*。'
  es.a1.unit47.lesson04.teach.te_llamo_mas:
    title: 说你会回电话
    gloss: 我稍后给你回电话。
    note: '*Más tarde*（稍后）放在句末：*te llamo más tarde*。'
  es.a1.unit47.lesson05.teach.mateo_hola_elena:
    title: 阅读短信对话
    gloss: 马特奥：你好，埃琳娜，你能给我打个电话吗？我有件事要告诉你。埃琳娜：好的，当然，我五分钟后给你回电话。
    note: 注意马特奥请求什么、原因是什么，以及埃琳娜说什么时候回电话。
    glosses:
      Hola: 你好
      puedes: 能够;可以
      llamarme: 打电话;称呼
      Tengo: 必须;得
      algo: 某事;东西
      contarte: 讲述;告诉
      claro: 当然
      llamada: 打电话;称呼
      cinco: 五
      minutos: 分钟
      devuelvo: 回;返回
  es.a1.unit47.lesson06.teach.mateo_hola_soy:
    title: 马特奥接电话
    gloss: 马特奥:你好,我是马特奥。
    note: 这里用的是第一课学过的 *soy* + 名字句型,现在放到真实的电话场景中:接电话的人先开口,并报上自己的名字。
  es.a1.unit47.lesson06.teach.elena_hola_mateo:
    title: 埃莱娜报上自己的名字
    gloss: 埃莱娜:你好,马特奥,我是埃莱娜。马特奥:谢谢你打来!
    note: '*Gracias por llamar*(谢谢你打电话)的结构是 *gracias por* + 动词原形。'
  es.a1.unit47.lesson06.teach.elena_como_ha:
    title: 埃莱娜询问班次情况
    gloss: 埃莱娜:你的第一个班怎么样?
    note: '*Ha ido* 是 *ir* 的现在完成时(这里表示“进展、结果如何”):*ha* + 过去分词 *ido*。'
  es.a1.unit47.lesson06.teach.mateo_ha_ido:
    title: 马特奥报告好消息
    gloss: 马特奥:非常顺利,比我预想的还要好。
    note: '*Ha ido muy bien* 沿用了问句中的现在完成时;*mejor de lo esperado*(比预期的更好)用 *de lo* 来表示比较。'
  es.a1.unit47.lesson06.teach.ha_ido_ir:
    title: Ha ido、es、esperado 与它们的动词原形对照
    gloss: ha ido → ir(去),es → ser(是),esperado → esperar(期待)
    note: '*Ha ido*、*es*、*esperado* 分别对应动词原形 *ir*、*ser*、*esperar*。目前先把 *ha ido muy bien* 当作固定说法记住;现在完成时之后会专门练习。'
  es.a1.unit47.lesson06.teach.elena_que_bien:
    title: 埃莱娜很自豪
    gloss: 埃莱娜:听到这个真高兴!我为你感到骄傲。
    note: '*Orgulloso/a de*(为……骄傲)是与 *de* 固定搭配的用法;形容词要与说话人的性别一致(埃莱娜用 *orgullosa*)。'
  es.a1.unit47.lesson06.teach.mateo_muchas_gracias:
    title: 马特奥很感动
    gloss: 马特奥:非常感谢,这对我来说意义重大。
    note: '*Significa* 是 *significar*(意味着)的第三人称形式;*para mí*(对我来说)说明这件事对谁重要。'
  es.a1.unit47.lesson06.teach.su_primer_turno:
    title: 他的
    gloss: 他的第一个班进行得非常顺利。
    note: 这里的 *Su* 是物主词“他的”(也可以指“她的”,或对 *usted* 说的“您的”);具体指谁要看上下文。
