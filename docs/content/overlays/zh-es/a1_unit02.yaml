teaching:
  es.a1.unit02.lesson01.teach.cero:
    title: 零
    gloss: 零
    note: '*Cero* 既可以作为数字本身，也可以在逐位念一串数字时作为其中一位数字。'
  es.a1.unit02.lesson01.teach.uno:
    title: 一
    gloss: 一
    note: '*Uno* 在阳性单数名词前变为 *un*（*un huevo*，一个鸡蛋），在阴性名词前变为 *una*（*una taza*，一杯）。单独使用，比如数数时，仍是 *uno*。'
  es.a1.unit02.lesson01.teach.dos:
    title: 二
    gloss: 二
    note: 无论名词是阳性还是阴性，*dos* 的形式都不变。
  es.a1.unit02.lesson01.teach.tres:
    title: 三
    gloss: 三
    note: '*Tres* 和 *dos* 一样，形式不变。'
  es.a1.unit02.lesson01.teach.cuatro:
    title: 四
    gloss: 四
    note: '*Cuatro* 形式不变。'
  es.a1.unit02.lesson01.teach.cinco:
    title: 五
    gloss: 五
    note: '*Cinco* 形式不变。'
  es.a1.unit02.lesson01.teach.seis:
    title: 六
    gloss: 六
    note: '*Seis* 形式不变。'
  es.a1.unit02.lesson01.teach.siete:
    title: 七
    gloss: 七
    note: '*Siete* 形式不变。'
  es.a1.unit02.lesson01.teach.ocho:
    title: 八
    gloss: 八
    note: '*Ocho* 形式不变。'
  es.a1.unit02.lesson01.teach.nueve:
    title: 九
    gloss: 九
    note: '*Nueve* 形式不变。'
  es.a1.unit02.lesson01.teach.diez:
    title: 十
    gloss: 十
    note: '*Diez* 形式不变。'
  es.a1.unit02.lesson02.teach.once:
    title: 十一
    gloss: 十一
    note: '*Once* 到 *quince*（11–15）都是独立的单词，需要成组记忆；从十六到十九，数字则由 *diez* 构成（*dieciséis*、*diecisiete*……）。'
  es.a1.unit02.lesson02.teach.doce:
    title: 十二
    gloss: 十二
    note: '*Doce* 是一个独立的单词；它和 *dos* 相似，但拼写是自己独立的形式。'
  es.a1.unit02.lesson02.teach.trece:
    title: 十三
    gloss: 十三
    note: '*Trece* 是一个独立的单词；它和 *tres* 相似，但拼写是自己独立的形式。'
  es.a1.unit02.lesson02.teach.catorce:
    title: 十四
    gloss: 十四
    note: '*Catorce* 是一个独立的单词；它和 *cuatro* 相似，但拼写是自己独立的形式。'
  es.a1.unit02.lesson02.teach.quince:
    title: 十五
    gloss: 十五
    note: '*Quince* 是最后一个合成的“十几”数字，从十六起构成方式就变了。'
  es.a1.unit02.lesson02.teach.veinte:
    title: 二十
    gloss: 二十
    note: '*Veinte* 是独立的单词。从 *veintiuno*（21）起到二十九，十位和个位合写成一个词；本课程会在第3课的 *veintiocho* 中再次出现这一规律。'
  es.a1.unit02.lesson02.teach.treinta:
    title: 三十
    gloss: 三十
    note: 从三十起，十位和个位用 *y*（和）连接，写成三个分开的词，不像二十几那样合写。
  es.a1.unit02.lesson02.teach.treinta_y_cuatro:
    title: 三十四
    gloss: 三十四
    note: '*Treinta y cuatro* 写成三个分开的词：十位、*y* 和个位。'
  es.a1.unit02.lesson02.teach.cien:
    title: 一百
    gloss: 一百
    note: '*Cien* 用于单独表示正好100；当数字继续往后时要用 *ciento*（*ciento uno*，101），本单元暂不讲授。'
  es.a1.unit02.lesson03.teach.cuantos_anos_tienes:
    title: 非正式地询问年龄
    gloss: 你多大了？
    note: 西班牙语字面上问的是“你有多少年”，用的是 *tener*（有），而不是 *ser* 或 *estar*。汉语则说“你几岁”或“你多大了”。
  es.a1.unit02.lesson03.teach.tengo_veintiocho:
    title: 说出自己的年龄
    gloss: 我二十八岁。
    note: '*Tengo* 是 *tener* 的第一人称单数形式。完整的回答通常带上 *años*（岁）；如果话题已经是年龄，也可以省略，如 *Tengo treinta y uno*。'
  es.a1.unit02.lesson03.teach.cuantos_anos_tiene_usted:
    title: 正式地询问年龄
    gloss: 你多大了？
    note: '*Tiene* 是 *tener* 对应 *usted* 的形式，与第1单元中出现的正式用语一致。'
  es.a1.unit02.lesson03.teach.tengo_treinta_y_uno:
    title: 说出带个位的年龄
    gloss: 我三十一岁。
    note: 这里的 *treinta y uno* 保留 *uno*（而不是 *un*），因为在这句回答中后面没有紧跟名词。
  es.a1.unit02.lesson03.teach.y_tu_cuantos:
    title: 反问对方的年龄
    gloss: 那你呢，你多大了？
    note: 当话题已经明确时，*tienes* 后面不再重复 *años*，是自然又常见的省略说法。
  es.a1.unit02.lesson04.teach.cual_es_tu_numero:
    title: 询问电话号码
    gloss: 你的电话号码是多少？
    note: 当要求对方从若干可能中选出或提供某一个具体的项目（比如电话号码）时，自然的说法是用 *cuál*，而不是 *qué*。
  es.a1.unit02.lesson04.teach.numero_elena:
    title: 逐位读出的数字
    gloss: 六、一、五、零、二、九、七、三
    note: 电话号码可以像这里一样一位一位地读。很多说西班牙语的人也会把数字两两分组来读，所以两种方式都要留心听。
  es.a1.unit02.lesson04.teach.es_el:
    title: 引出号码
    gloss: 是……
    note: 这里用 *el*（阳性的“这个”），因为 *número* 是阳性名词。
  es.a1.unit02.lesson04.teach.puedes_repetir:
    title: 请求重复
    gloss: 你能重复一遍吗？
    note: '*Puedes* 是动词 *poder*（能、可以）的 *tú* 形式。当别人说的数字太快没听清时，这句话很有用。'
  es.a1.unit02.lesson04.teach.claro:
    title: 爽快答应
    gloss: 当然；没问题
    note: '*Claro* 是答应别人请求时常用的友好说法。'
  es.a1.unit02.lesson05.teach.necesito_tres_huevos:
    title: 说明需要的数量
    gloss: 我需要三个鸡蛋。
    note: '*Necesito* 是动词 *necesitar*（需要）的 yo 形式。数字大于一时，*huevos*（鸡蛋）始终用复数。'
  es.a1.unit02.lesson05.teach.cuantos_huevos_necesitas:
    title: 询问需要多少
    gloss: 你需要几个鸡蛋？
    note: '*Cuántos* 要与所问的名词在性和数上一致；*huevos* 是阳性复数，所以用 *cuántos*，而不是 *cuántas*。'
  es.a1.unit02.lesson05.teach.dos_tazas_harina:
    title: 说明计量的数量
    gloss: 两杯面粉
    note: '*De* 把计量单位（*tazas*，杯）和被计量的东西（*harina*，面粉）连接起来。汉语里直接说“两杯面粉”，不需要对应的连接词，而西班牙语必须加 de。'
  es.a1.unit02.lesson05.teach.media_taza:
    title: 说明半份的数量
    gloss: 半杯糖
    note: '*Media* 与阴性名词 *taza* 保持一致；阳性名词则要用阳性形式 *medio*。'
  es.a1.unit02.lesson05.teach.tengo_cuatro_huevos:
    title: 说明手头有什么
    gloss: 我桌上有四个鸡蛋。
    note: '*Tengo*（我有）说的是已经有的东西，而 *necesito*（我需要）说的是还缺的东西，两者不同。'
  es.a1.unit02.lesson06.teach.line01:
    title: 询问要几个鸡蛋
    gloss: Elena 问 Mateo 做这道菜需要几个鸡蛋。
    note: 两位同伴之间延续第1单元的 *tú* 语体。
  es.a1.unit02.lesson06.teach.line02:
    title: 说出所需食材
    gloss: Mateo 说他需要三个鸡蛋和两杯面粉。
    note: '*Necesito* 表示做这道菜还需要什么。'
  es.a1.unit02.lesson06.teach.line03:
    title: 说出手头现有的东西
    gloss: Elena 说她桌上有四个鸡蛋，并问他是否还需要糖。
    note: '*Tengo* 说的是 Elena 已经有的东西，与 Mateo 说的需要的东西是分开的。'
  es.a1.unit02.lesson06.teach.line04:
    title: 确认需要少量
    gloss: Mateo 说需要，要一点，大约半杯。
    note: 这里的 *Como* 表示“大约”“差不多”，而不是更常见的“像”或“如同”的意思。
  es.a1.unit02.lesson06.teach.line05:
    title: 询问电话号码
    gloss: Elena 说太好了，然后问 Mateo 的电话号码，好给他发消息通知下一节课。
    note: '*Así te escribo*（“这样我就能给你发消息”）说明了她为什么问，在索要联系方式之前这样解释是很自然的交谈习惯。'
  es.a1.unit02.lesson06.teach.line06:
    title: 报出电话号码
    gloss: Mateo 一位一位地读出他的号码。
    note: '*Es el* 用来引出号码，与阳性名词 *número* 一致。'
  es.a1.unit02.lesson06.teach.line07:
    title: 道谢并询问年龄
    gloss: Elena 向他道谢，然后再问一个问题：他多大了。
    note: '*Una pregunta más*（“再问一个问题”）表示在同一场对话中自然地转换话题。'
  es.a1.unit02.lesson06.teach.line08:
    title: 说出他的年龄
    gloss: Mateo 说他二十八岁，并反问 Elena 同样的问题。
    note: '*Tengo veintiocho años* 使用二十几的连写形式，与本单元第2课的规律一致。'
  es.a1.unit02.lesson06.teach.line09:
    title: 说出她的年龄
    gloss: Elena 说她三十一岁。
    note: '*Tengo treinta y uno* 在这里省略了 *años*，因为从上下文已经知道话题是年龄。话题明确后这样简略很自然，与第3课反问时不重复 *años* 的做法一致。'
