course:
  title: 西班牙语 A1
  description: 0到100的数字、年龄、电话号码和食谱用量，延续第1单元中 Elena 和 Mateo 在烹饪工作坊的故事。重点讲解用 tener 表达年龄的说法，以及数量短语中的性别一致。
