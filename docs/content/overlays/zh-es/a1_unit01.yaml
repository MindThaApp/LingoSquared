answer_policy:
  accent_marks: Display and teach all Spanish accent marks. In typed A1 answers, accept a variant without acute accents when every other letter and word is correct. Do not treat n as a substitute for ñ because ñ is a separate Spanish letter. Inverted question and exclamation marks may be omitted in typed answers, but the fully punctuated form remains the model answer.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal and place names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation.
course:
  title: 西班牙语 A1
  description: 学习中性的泛西语区问候、介绍，以及初次见面时实用的寒暄。针对中文学习者的提示会突出西班牙语的语体、性数一致、主语省略和动词变位。
units:
  es.a1.unit01.greetings:
    title: 问候与初次见面
lessons:
  es.a1.unit01.lesson01.tu_and_usted:
    title: 选择 tú 还是 usted
  es.a1.unit01.lesson02.greetings_by_time:
    title: 一天中的问候与道别
  es.a1.unit01.lesson03.names_and_introductions:
    title: 姓名与介绍
  es.a1.unit01.lesson04.origin_and_language:
    title: 来自哪里、住在哪里和使用的语言
  es.a1.unit01.lesson05.shared_activity_small_talk:
    title: 共同活动中的寒暄
  es.a1.unit01.lesson06.cooking_workshop_dialogue:
    title: 烹饪工坊上的初次见面
teaching:
  es.a1.unit01.lesson01.teach.usted:
    title: 尊敬的“您”
    gloss: 您(敬称)
    note: 中文有“你”和“您”之分，西班牙语也要做这样的选择。Usted 适用于不熟悉的成年人，或需要表示尊重的场合。虽然它的意思是“您”,但动词形式与 él 或 ella 相同。
  es.a1.unit01.lesson01.teach.tu:
    title: 非正式的“你”
    gloss: 你(非正式单数)
    note: Tú 用于关系不拘礼的单个人，如朋友、同辈或孩子。重音符号用来区分代词 tú 和物主词 tu(“你的”)。
  es.a1.unit01.lesson01.teach.como_esta_usted:
    title: 正式的问候语：近况
    gloss: 您好吗？
    note: Está 是 estar 的 usted 变位形式。这里西班牙语用 estar 表示人当前的状态。Cómo 是疑问词，所以带重音符号。
  es.a1.unit01.lesson01.teach.como_estas:
    title: 非正式的问候语：近况
    gloss: 您好吗？
    note: Estás 是 estar 的 tú 变位形式。中文靠“你”和“您”区分称呼，西班牙语则连动词也随之变化：está 变成 estás。
  es.a1.unit01.lesson01.teach.bien_gracias:
    title: 简短的回答
    gloss: 很好，谢谢。
    note: 西班牙语可以只用 bien 回答，不必重复主语或动词。
  es.a1.unit01.lesson01.teach.muy_bien:
    title: 积极的回答
    gloss: 非常好，谢谢。
    note: Muy 用来加强 bien,自身形式不变。
  es.a1.unit01.lesson01.teach.and_usted:
    title: 把正式的问题回问对方
    gloss: 您呢？
    note: 回问时如果采用的是尊敬的语气，就继续使用 usted。
  es.a1.unit01.lesson01.teach.and_tu:
    title: 把非正式的问题回问对方
    gloss: 您呢？
    note: 交流不拘礼时使用 tú。书写时的重音很重要，因为没有重音的 tu 表示“你的”。
  es.a1.unit01.lesson02.teach.hola:
    title: 通用的问候语
    gloss: 你好；嗨
    note: Hola 在一天中的任何时间、正式或非正式的场合都可以使用。
  es.a1.unit01.lesson02.teach.buenos_dias:
    title: 早晨的问候
    gloss: 早上好
    note: 西班牙语的名词有语法性别，中文的名词则没有。Días 是阳性复数，所以形容词用 buenos。
  es.a1.unit01.lesson02.teach.buenas_tardes:
    title: 下午的问候
    gloss: 下午好
    note: Tardes 是阴性复数，所以 buenas 要与它保持一致。从 buenos 变为 buenas 是语法上的性数一致，并不代表礼貌程度的变化。
  es.a1.unit01.lesson02.teach.buenas_noches:
    title: 晚上或夜里的问候
    gloss: 晚上好；晚安
    note: Noches 是阴性复数，因此用 buenas。这句话既可以在夜晚见面时问候，也可以在睡前道别时使用。
  es.a1.unit01.lesson02.teach.adios:
    title: 直接的道别
    gloss: 再见
    note: Adiós 是中性的说法，但听起来可能比“回头见”之类的表达更有告别的意味。
  es.a1.unit01.lesson02.teach.hasta_luego:
    title: 回头见
    gloss: 待会儿见
    note: Hasta luego 是惯用的道别语，不必逐字直译。
  es.a1.unit01.lesson02.teach.nos_vemos:
    title: 友好的道别
    gloss: 回头见
    note: 字面上，nos vemos 更接近“我们互相见面”。
  es.a1.unit01.lesson02.teach.good_day:
    title: 礼貌的祝福语
    gloss: 祝您今天愉快。
    note: Tenga 是这句礼貌祝福中使用的 usted 形式。Buen 是 bueno 在 día 前面的阳性单数缩略形式。
  es.a1.unit01.lesson03.teach.formal_name_question:
    title: 正式地询问姓名
    gloss: 您叫什么名字？
    note: 西班牙语的说法大致相当于“您称呼自己什么”。Se 与敬称 usted 的动词形式 llama 搭配。中文用“您”来表示敬意，西班牙语则通过动词形式体现。
  es.a1.unit01.lesson03.teach.my_name_lucia:
    title: 说出你的名字
    gloss: 我叫Lucía。
    note: Me llamo 字面意思是“我称呼自己”。动词词尾已经表明说话人是谁，所以西班牙语在这里通常省略 yo。
  es.a1.unit01.lesson03.teach.informal_name_question:
    title: 非正式地询问姓名
    gloss: 您叫什么名字？
    note: Te 与非正式的 tú 搭配，llamas 带有 tú 的词尾 -as。比较正式的 se llama 和非正式的 te llamas。
  es.a1.unit01.lesson03.teach.i_am_diego:
    title: 用 ser 介绍自己
    gloss: 我是Diego。
    note: Soy 是 ser 的第一人称单数形式。西班牙语用 ser 表示身份，而暂时的状态通常用 estar 表示。
  es.a1.unit01.lesson03.teach.mucho_gusto:
    title: 认识某人时表达愉快
    gloss: 很高兴认识你。
    note: Mucho gusto 是固定的、通行很广的表达。它不像 encantado 或 encantada 那样随说话人的性别变化。
  es.a1.unit01.lesson03.teach.igualmente:
    title: 回应同样的心情
    gloss: 彼此彼此。
    note: Igualmente 是对 Mucho gusto 的简短回应。
  es.a1.unit01.lesson03.teach.este_carlos:
    title: 介绍一位男士
    gloss: 这位是Carlos。
    note: 中文的“这”没有语法性别。西班牙语中，所指的人或事物在语法上是阳性时，用 este。
  es.a1.unit01.lesson03.teach.esta_ana:
    title: 介绍一位女士
    gloss: 这位是Ana。
    note: 所指为阴性时用 esta。这里的 esta 没有重音符号；带重音的 está 是 estar 的一种形式，表示“是”或“在”。
  es.a1.unit01.lesson04.teach.formal_origin_question:
    title: 正式地询问来自哪里
    gloss: 您是哪里人？
    note: Es 是 ser 的 usted 变位形式。西班牙语表示来源用 ser,而不用 estar。在直接疑问句中，dónde 带有重音符号。
  es.a1.unit01.lesson04.teach.from_mexico:
    title: 说明你来自哪里
    gloss: 我来自墨西哥。
    note: Soy 是 ser 的 yo 变位形式。不需要主语 yo,因为 soy 已经表明了说话人。
  es.a1.unit01.lesson04.teach.informal_origin_question:
    title: 非正式地询问来自哪里
    gloss: 您是哪里人？
    note: Eres 是 ser 的 tú 变位形式。比较正式的 es(对应 usted)和非正式的 eres。
  es.a1.unit01.lesson04.teach.from_colombia:
    title: 另一种说明来源的句子
    gloss: 我来自哥伦比亚。
    note: 说明来源时，用 soy de 加上地点。
  es.a1.unit01.lesson04.teach.live_london:
    title: 说明你住在哪里
    gloss: 我住在伦敦。
    note: Vivo 是 vivir 的 yo 变位形式。西班牙语不需要 yo,因为词尾 -o 已表明说话人。
  es.a1.unit01.lesson04.teach.speak_spanish:
    title: 正式地询问是否会说西班牙语
    gloss: 您会说西班牙语吗？
    note: 西班牙语构成是非问句时不需要额外的助词或助动词。Habla 是 usted 形式；靠语调和问号来表示这是个问句。
  es.a1.unit01.lesson04.teach.yes_a_little:
    title: 能力有限
    gloss: 是的，会一点。
    note: 带重音的 Sí 表示“是的”。没有重音的 si 表示“如果”,不过在 A1 阶段，这里允许输入没有重音的拼写。
  es.a1.unit01.lesson04.teach.still_learning:
    title: 描述正在进行的情况
    gloss: 我还在学习。
    note: Estoy 是 estar 的 yo 变位形式。这里 estar 表示正在进行的活动，而 Soy de Colombia 中的 soy 表示来源或身份。
  es.a1.unit01.lesson05.teach.formal_first_time:
    title: 正式地询问是否第一次来
    gloss: 这是您第一次来这里吗？
    note: 称呼对方为 usted 时，用 su 表示“您的”。中文有“您的”和“你的”之分，西班牙语的 su 和 tu 同样保留了正式与非正式的选择。
  es.a1.unit01.lesson05.teach.informal_first_time:
    title: 非正式地询问是否第一次来
    gloss: 这是您第一次来这里吗？
    note: 没有重音的 tu 是非正式的物主词“你的”。请与带重音的代词 tú 区分开。
  es.a1.unit01.lesson05.teach.first_time_answer:
    title: 确认这是你第一次来
    gloss: 是的，这是我第一次来。
    note: Primera 是阴性，因为它要与 vez 保持一致。中文的形容词不会随名词的性别变化。
  es.a1.unit01.lesson05.teach.cooking_workshop:
    title: 说出你要去的地方
    gloss: 我是来参加烹饪工坊的。
    note: Vengo 是 venir 的 yo 变位形式，意思是“我来”或“我正在来”。Al 是 a 加 el 必须缩合成的形式。
  es.a1.unit01.lesson05.teach.me_too:
    title: 表示情况相同
    gloss: 我也是。
    note: 当对方所说的情况也适用于你时，可以用 Yo también。
  es.a1.unit01.lesson05.teach.like_cooking:
    title: 询问兴趣爱好
    gloss: 你喜欢做饭吗？
    note: Gustar 的结构与中文的“喜欢”不同。Te 表示感到喜欢的人，cocinar 则是令人喜欢的事。动词仍用 gusta,因为这项活动按单数处理。
  es.a1.unit01.lesson05.teach.yes_very_much:
    title: 表达浓厚的兴趣
    gloss: 是的，很喜欢。
    note: Mucho 回答的是程度问题，在这里形式不变。
  es.a1.unit01.lesson05.teach.thats_good:
    title: 积极的反应
    gloss: 太好了。
    note: 在这个感叹句中，Qué 带重音符号。它表示一种积极的反应，而不是提问。
  es.a1.unit01.lesson06.teach.line01:
    title: 开启对话
    gloss: Elena 向 Mateo 问好，并问他是不是第一次来这里。
    note: 两人都用非正式的 tú 形式，因为他们在同一个活动中是平辈关系。
  es.a1.unit01.lesson06.teach.line02:
    title: 开启对话，回答
    gloss: Mateo 说是的，这是他第一次来，并说明他是来参加烹饪工作坊的。
    note: Vengo al taller 说明来到这里的原因，用现在时表示正在持续的情况。
  es.a1.unit01.lesson06.teach.line03:
    title: 互相介绍姓名
    gloss: Elena 说她也是第一次来，告诉对方自己的名字，并问 Mateo 叫什么。
    note: Me llamo 是介绍姓名的自然说法；西班牙语通常省略 yo，因为动词的变位形式已经表明了说话的人。
  es.a1.unit01.lesson06.teach.line04:
    title: 互相介绍姓名，回答
    gloss: Mateo 说出自己的名字，并说很高兴认识她。
    note: Soy 是介绍姓名的另一种自然说法，用的是 ser，而不是自反动词 llamarse。
  es.a1.unit01.lesson06.teach.line05:
    title: 询问来自哪里
    gloss: Elena 回应对方的客套话（彼此彼此），并问 Mateo 是哪里人。
    note: De dónde eres 用非正式的 tú 形式询问对方来自哪里。
  es.a1.unit01.lesson06.teach.line06:
    title: 询问来自哪里，回答
    gloss: Mateo 来自哥伦比亚，但住在伦敦，然后他也问 Elena 同样的问题。
    note: Soy de 表示来自哪里，vivo en 表示现在住在哪里。Pero 连接这两个对比的事实。
  es.a1.unit01.lesson06.teach.line07:
    title: 谈论兴趣
    gloss: Elena 说她来自西班牙，并问 Mateo 是否喜欢做饭。
    note: Soy 表示来自哪里，与 Mateo 刚才用的句型相同。
  es.a1.unit01.lesson06.teach.line08:
    title: 谈论兴趣，回答
    gloss: Mateo 说他很喜欢做饭，但还在学习。
    note: Estoy aprendiendo 表示正在进行的活动，由 estar 加现在分词构成。
  es.a1.unit01.lesson06.teach.line09:
    title: 结束对话
    gloss: Elena 说她也在学习，并说一会儿里面见。
    note: Nos vemos 表示稍后会再见面，dentro 说明在哪里见。
  es.a1.unit01.lesson06.teach.line10:
    title: 结束对话，回答
    gloss: Mateo 表示同意，并确认他们会见面。
    note: Sí 先确认 Elena 的提议，然后再重复 nos vemos。
exercises:
  es.a1.unit01.lesson01.exercise01.select_formal_pronoun:
    instruction: 哪一个表示“你”的形式是尊敬或正式的？
    correct_option: usted
    distractors:
    - tú
    - tu
    accepted_answers:
    - usted
    feedback: Usted 是表示尊敬的单数形式，动词使用第三人称形式。
  es.a1.unit01.lesson01.exercise02.select_informal_pronoun:
    instruction: 哪一个形式用来非正式地称呼一位朋友或平辈？
    correct_option: tú
    distractors:
    - usted
    - tu
    accepted_answers:
    - tú
    feedback: 代词写作 tú；不带重音的 tu 意思是“你的”。
  es.a1.unit01.lesson01.exercise03.listen_formal_question:
    instruction: 听音频，选择你听到的句子。
    correct_option: ¿Cómo está usted?
    distractors:
    - ¿Cómo estás?
    - ¿Y usted?
    accepted_answers:
    - ¿Cómo está usted?
    - Como esta usted
  es.a1.unit01.lesson01.exercise04.listen_informal_question:
    instruction: 输入你听到的非正式问句。
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
  es.a1.unit01.lesson01.exercise05.order_formal_question:
    instruction: 把这个正式问句排成正确的顺序。
    correct_response:
    - Cómo
    - está
    - usted
  es.a1.unit01.lesson01.exercise06_choose_formal_return:
    instruction: 选择保持尊敬语体的反问句。
    correct_option: ¿Y usted?
    distractors:
    - ¿Y tú?
    - ¿Cómo estás?
    accepted_answers:
    - ¿Y usted?
    - Y usted
  es.a1.unit01.lesson01.exercise07_choose_informal_return:
    instruction: 选择用于朋友或平辈的反问句。
    correct_option: ¿Y tú?
    distractors:
    - ¿Y usted?
    - ¿Cómo está usted?
    accepted_answers:
    - ¿Y tú?
    - Y tú
    - Y tu
  es.a1.unit01.lesson01.exercise08.check_informal_agreement:
    instruction: 改正这个非正式问句。
    accepted_answers:
    - ¿Cómo estás?
    - Cómo estás
    - Como estas
    - ¿Cómo estás tú?
    - Como estas tu
    feedback: Tú 要搭配 estás；está 与 usted 搭配使用。
  es.a1.unit01.lesson01.exercise09.reply_formally:
    instruction: 礼貌地回答这个问题。
    accepted_answers:
    - Bien, gracias.
    - Bien, gracias
    - Muy bien, gracias.
    - Muy bien, gracias
    - Bien, gracias. ¿Y usted?
    - Muy bien, gracias. ¿Y usted?
  es.a1.unit01.lesson01.exercise10.speak_informally:
    instruction: 用非正式的方式回答，向对方道谢，并反问对方。
    accepted_answers:
    - Muy bien, gracias. ¿Y tú?
    - Muy bien, gracias. Y tú?
    - Muy bien, gracias. Y tu?
    - Muy bien, gracias, ¿y tú?
    - Bien, gracias. ¿Y tú?
    - Bien, gracias. Y tu?
    - Bien, gracias, ¿y tú?
  es.a1.unit01.lesson02.exercise01.listen_hola:
    instruction: 听音频，选出问候语。
    correct_option: Hola
    distractors:
    - Adiós
    - Hasta luego
    accepted_answers:
    - Hola
  es.a1.unit01.lesson02.exercise02.listen_morning:
    instruction: 输入你听到的早上问候语。
    accepted_answers:
    - Buenos días
    - Buenos dias
  es.a1.unit01.lesson02.exercise03.order_afternoon:
    instruction: 把下午的问候语排成正确的顺序。
    correct_response:
    - Buenas
    - tardes
  es.a1.unit01.lesson02.exercise04.select_night:
    instruction: 在晚上的问候中，这个短语是什么意思？
    correct_option: 晚上好。
    distractors:
    - 早上好。
    - 回头见。
    accepted_answers:
    - 晚上好。
  es.a1.unit01.lesson02.exercise05.listen_night:
    instruction: 听音频，选择你听到的短语。
    correct_option: Buenas noches
    distractors:
    - Buenos días
    - Buenas tardes
    accepted_answers:
    - Buenas noches
  es.a1.unit01.lesson02.exercise06.choose_farewell:
    instruction: 这个词的作用是什么？
    correct_option: 用来道别。
    distractors:
    - 用来询问姓名。
    - 用来表示感谢。
    accepted_answers:
    - 用来道别。
  es.a1.unit01.lesson02.exercise07.listen_until_later:
    instruction: 把你听到的告别语排成正确的顺序。
    correct_response:
    - Hasta
    - luego
  es.a1.unit01.lesson02.exercise08.reply_to_afternoon:
    instruction: 先回应问候，然后结束这段简短的对话。
    accepted_answers:
    - Buenas tardes. Hasta luego.
    - Buenas tardes, hasta luego.
    - Buenas tardes. Adiós.
    - Buenas tardes. Nos vemos.
    - Buenas tardes. Que tenga un buen día.
  es.a1.unit01.lesson02.exercise09.order_good_day:
    instruction: 组成这句礼貌的祝福语。
    correct_response:
    - Que
    - tenga
