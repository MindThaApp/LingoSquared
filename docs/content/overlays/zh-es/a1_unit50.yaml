teaching:
  es.a1.unit50.lesson01.teach.juntos:
    title: 一起
    gloss: 一起
    note: '*Juntos* 表明大家一起做这件事；它要和人物的性别一致（全是女性时用 *juntas*）。'
    example_gloss: 我们一起喝杯咖啡好吗？
  es.a1.unit50.lesson01.teach.tomar_un_cafe:
    title: 喝咖啡
    gloss: 喝咖啡
    note: 西班牙语说 *tomar un café*（字面是“拿一杯咖啡”），而不是“喝咖啡”那样的动词。
  es.a1.unit50.lesson01.teach.ir_al_cine:
    title: 去看电影
    gloss: 去看电影
    note: '*Ir al cine*（字面是“去电影院”）是表示去看电影的常用说法；*al* 是 *a* + *el*。'
  es.a1.unit50.lesson01.teach.tomamos_un_cafe:
    title: 我们喝杯咖啡好吗？
    gloss: 我们喝杯咖啡好吗？
    note: '*¿Tomamos ...?* 用 *nosotros* 的现在时来提议大家一起做某事。'
  es.a1.unit50.lesson01.teach.tomamos_algo_es:
    title: 使用 ¿Tomamos ...?
    gloss: ¿Tomamos + 某物？是提议一起做某事的常用说法。
    note: '*nosotros* 形式（*tomamos*）可以用来提议“我们……好吗”：*¿Tomamos un café?*'
  es.a1.unit50.lesson01.teach.tienes_ganas_de:
    title: 你想去看电影吗？
    gloss: 你想去看电影吗？
    note: '*¿Tienes ganas de ...?* 用来随意地询问对方是否想做某事；*de* 后面接动词原形。'
  es.a1.unit50.lesson02.teach.si_que_bien:
    title: 好呀，太好了！
    gloss: 好呀，太好了！
    note: '*¡Sí, qué bien!* 是一种简短、热情的接受方式。'
  es.a1.unit50.lesson02.teach.buena_idea:
    title: 好主意
    gloss: 好主意！
    note: '*¡Buena idea!* 通过称赞提议来表示接受。'
  es.a1.unit50.lesson02.teach.es_un_buen:
    title: 这是个好计划
    gloss: 这是个好计划。
    note: 这是一种稍微完整一点的肯定回答。
  es.a1.unit50.lesson02.teach.lo_siento_no:
    title: 说明理由的拒绝
    gloss: 对不起，我去不了，因为我要工作。
    note: '*Lo siento* 使拒绝的语气更委婉，*porque* 引出简短的理由。'
  es.a1.unit50.lesson02.teach.no_tengo_tiempo:
    title: 我没有时间
    gloss: 我没有时间。
    note: '*No tengo tiempo* 是直接但很常见的拒绝理由；*no* 放在动词前面。'
  es.a1.unit50.lesson02.teach.lo_siento_no_2:
    title: 友好的拒绝
    gloss: Lo siento + no puedo + 简短的理由，可以让拒绝显得友好。
    note: 在对话中理由不是必须的，但加上理由会让这个说法更实用、更礼貌。
  es.a1.unit50.lesson03.teach.quedar:
    title: 约见面
    gloss: 约定见面
    note: '*Quedar* 表示约定见面：*¿Quedamos el viernes?* 许多拉丁美洲人会说 *¿Nos vemos el viernes?*。'
    example_gloss: 我们星期五两点半见面好吗？
  es.a1.unit50.lesson03.teach.quedamos_el_viernes:
    title: 星期五两点半见面
    gloss: 我们星期五两点半见面好吗？
    note: 这句话把星期 *el viernes* 与 *a las* 加时间组合在一起。
  es.a1.unit50.lesson03.teach.las_dos_y:
    title: Y media 表示半点
    gloss: las dos y media = 两点半；a las dos y media 表示见面的时间。
    note: 西班牙语从刚过去的整点开始数：*las dos y media* 是两点半，字面意思是“两点和一半”。
  es.a1.unit50.lesson03.teach.el_viernes_17:
    title: 日期和时间
    gloss: 4月17日星期五三点一刻
    note: 西班牙语中星期和月份用小写，日期中要用 *de*:*el viernes 17 de abril*。与中文“4月17日星期五”的顺序也不同。
  es.a1.unit50.lesson03.teach.si_el_viernes:
    title: 确认时间
    gloss: 好的，星期五两点半我可以。
    note: '*Me viene bien*(“对我合适”)用来确认所提议的时间可行。'
  es.a1.unit50.lesson04.teach.el_mensaje_la:
    title: 消息、邀请、语言咖啡馆
    gloss: 消息、邀请、语言咖啡馆
    note: '*Un mensaje* 是简短的书面或电子消息，*una invitación* 是邀请别人参加活动，*el café de idiomas* 是小组聚会的地点。'
    example_gloss:
    - 我收到了埃琳娜的一条消息。
    - 这是语言咖啡馆的邀请。
    - 我们在语言咖啡馆喝咖啡。
  es.a1.unit50.lesson04.teach.hola_mateo_tienes:
    title: 埃琳娜的邀请
    gloss: 你好，马特奥，你想在4月18日星期六两点半去语言咖啡馆喝杯咖啡吗？致敬，埃琳娜。
    note: 阅读时注意四个细节：活动、日期、时间和地点。
    glosses:
      Hola: 你好
      ganas: 愿望(tener ganas de = 想要做某事)
      sábado: 星期六
      abril: 四月
      media: 半(y media = 半点)
      dos: 二
      café: 咖啡
      tomar: 喝
      idiomas: 语言咖啡馆
      saludo: 此致
  es.a1.unit50.lesson05.teach.hola_mateo_vamos:
    title: 一条提议的消息
    gloss: 你好，马特奥，我们星期五两点半去喝杯咖啡好吗？此致，埃琳娜。
    note: 这条消息包括问候、活动、日期、时间和结束语。
    glosses:
      Hola: 你好
      vamos: (我们)去……好吗
      viernes: 星期五
      media: 半(y media = 半点)
      dos: 二
      café: 咖啡
      tomar: 喝
      saludo: 此致
  es.a1.unit50.lesson05.teach.hola_elena_si:
    title: 一条确认的消息
    gloss: 你好，埃琳娜，好啊，太好了！星期五两点半我可以。星期五见！马特奥。
    note: 这条回复既接受了活动，又重复了时间安排来加以确认。
    glosses:
      Hola: 你好
      bien: 真好 / 太好了
      viernes: 星期五
      media: 半(y media = 半点)
      dos: 二
      viene: 好 / 合适
      Hasta: 到……为止 / 再见
  es.a1.unit50.lesson05.teach.un_mensaje_corto:
    title: 消息包含什么
    gloss: 一条简短的消息要说明活动、日期或星期几，以及时间。
    note: 问候和结束语很有用，但最重要的细节是活动和发生的时间。
  es.a1.unit50.lesson06.teach.elena_tomamos_un:
    title: 埃琳娜提议喝咖啡
    gloss: 埃琳娜：我们星期五喝杯咖啡好吗？马特奥：好啊，太好了！几点？
    note: 马特奥先接受了这个活动，然后问时间。
  es.a1.unit50.lesson06.teach.elena_a_las:
    title: 埃琳娜说的第一个时间
    gloss: 埃琳娜：两点半。
    note: '*Las dos y media* 表示两点半，和报时那一课讲的一样。'
  es.a1.unit50.lesson06.teach.mateo_lo_siento:
    title: 马特奥提议另一个时间
    gloss: 马特奥：对不起，两点半我不行。三点一刻可以吗？
    note: '*¿Puede ser a ...?* 是询问另一个时间是否可行的简洁说法。'
  es.a1.unit50.lesson06.teach.elena_si_a:
    title: 他们确认最终计划
    gloss: 埃琳娜：好的，三点一刻我可以。马特奥：好计划。那我们星期五三点一刻见。
    note: 这里的 *quedamos* 又是 *nosotros* 的形式，用来确认计划。
