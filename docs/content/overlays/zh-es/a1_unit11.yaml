teaching:
  es.a1.unit11.lesson01.teach.la_camisa:
    title: 衬衫
    gloss: 衬衫
    note: '*Camisa* 是阴性名词。'
    example_gloss: 我喜欢这件衬衫。
  es.a1.unit11.lesson01.teach.el_pantalon:
    title: 裤子
    gloss: 裤子
    note: '*Pantalón* 在西班牙语中是单数名词，指一条裤子；复数形式 pantalones 也很常用。'
    example_gloss: 这条裤子二十。
  es.a1.unit11.lesson01.teach.la_chaqueta:
    title: 夹克
    gloss: 夹克
    note: '*Chaqueta* 是阴性名词。'
    example_gloss: 我冬天需要一件夹克。
  es.a1.unit11.lesson01.teach.los_zapatos:
    title: 鞋子
    gloss: 鞋子
    note: '*Zapatos* 是复数形式，因为鞋子通常成双出现。'
    example_gloss: 这双鞋很舒服。
  es.a1.unit11.lesson01.teach.el_delantal:
    title: 围裙
    gloss: 围裙
    note: '*Delantal* 是阳性名词，指埃琳娜和马特奥为工作坊需要的那件物品。'
    example_gloss: 我们为工作坊需要一条围裙。
  es.a1.unit11.lesson02.teach.que_talla_usas:
    title: 询问尺码
    gloss: 你穿什么尺码？
    note: '*¿Qué talla usas?* 是询问他人衣服尺码的标准说法。'
  es.a1.unit11.lesson02.teach.uso_la_talla_mediana:
    title: 说出自己的尺码
    gloss: 我穿中号。
    note: '*Uso*（我穿）+ *la talla*（尺码）+ 表示尺码的词。'
  es.a1.unit11.lesson02.teach.me_queda_bien:
    title: 说合身
    gloss: 我穿着很合身。
    note: '*Me queda bien* 使用动词 *quedar*（合身、适合），详见后面的语法说明。'
  es.a1.unit11.lesson02.teach.me_queda_mal:
    title: 说不合身
    gloss: 我穿着不合身。
    note: 与 *me queda bien* 相反，把 *bien* 换成 *mal*。
  es.a1.unit11.lesson02.teach.queda_note:
    title: Quedar bien/mal
    gloss: quedar 描述的是合不合身，而不是一般的好坏。
    note: 见本卡片正文。
    target_text: '*Me queda bien*（很合身）用的是 *quedar*（合身、适合），它和 *ser*、*estar* 都不同，字面意思是“穿在我身上停留得很好”。这里的 *bien* 和 *mal* 说的是合不合身，而不是质量好坏。'
  es.a1.unit11.lesson03.teach.cuanto_cuesta_este_delantal:
    title: 询问围裙的价格
    gloss: 这条围裙多少钱？
    note: 使用 *¿Cuánto cuesta?* 句型，并用 *este*（这个）指明具体物品。
  es.a1.unit11.lesson03.teach.cuesta_doce:
    title: 说出价格
    gloss: 十二。
    note: '*Cuesta* + 数字表示价格。'
  es.a1.unit11.lesson03.teach.este_vs_esta_note:
    title: Este 与 esta
    gloss: 指示词如何与名词的性保持一致。
    note: 见本卡片正文。
    target_text: '*Este*（这个，阳性）与 *el delantal* 搭配；*esta*（这个，阴性）与 *esta camisa* 搭配——指示词随名词的性而变化，规律和其他形容词一样。'
  es.a1.unit11.lesson04.teach.me_gusta_este:
    title: 说你喜欢这个
    gloss: 我喜欢这个。
    note: 这里的 *Este* 单独作代词（“这一个”），指代刚刚提到的那件物品。
  es.a1.unit11.lesson04.teach.voy_a_comprarlo:
    title: 说你要买它
    gloss: 我打算买下它。
    note: '*Voy a* + 动词原形是近将来的结构；*comprarlo* 把宾语代词 *lo*（它）接在动词原形 *comprar* 后面。'
  es.a1.unit11.lesson04.teach.compramos_dos:
    title: 说你们买两个
    gloss: 我们买两个。
    note: '*Compramos*（我们买）是 *nosotros* 的变位形式，用于埃琳娜和马特奥共同做决定时。'
  es.a1.unit11.lesson05.teach.precios_reading:
    title: 阅读价目表
    gloss: 在这家店里，衬衫十五，裤子二十，外套三十，鞋子二十五。围裙最便宜：只要十二。
    note: 一份商店价目表：单件物品用 *cuesta*（价格是），像 *los zapatos* 这样的复数物品用 *cuestan*。
    glosses:
      tienda: 商店
      camisa: 衬衫
      cuesta: 价格是（costar 的变位）
      quince: 十五
      pantalón: 裤子
      veinte: 二十
      chaqueta: 外套
      treinta: 三十
      zapatos: 鞋子
      cuestan: 价格是（costar 的变位）
      veinticinco: 二十五
      delantal: 围裙
      barato: 便宜
      solo: 只
      doce: 十二
  es.a1.unit11.lesson05.teach.el_mas_barato_note:
    title: El más barato（最便宜的）
    gloss: el/la + más + 形容词如何构成最高级。
    note: 见本卡片正文。
    target_text: '*El más barato*（最便宜的）是最高级——*el/la* + *más* + 形容词，再用 *de/en* 指出比较的范围。本单元还不讲完整的比较结构，只学这个常见的购物说法。'
  es.a1.unit11.lesson06.teach.line01:
    title: 说出需求
    gloss: 埃琳娜说他们为工作坊需要围裙。
    note: '*Delantales* 是 *el delantal* 的复数形式。'
  es.a1.unit11.lesson06.teach.line02:
    title: 同意并建议去一家店
    gloss: 马特奥表示同意，并建议去那家店。
    note: '*Tienes razón* 的意思是“你说得对”；*esa tienda* 的意思是“那家店”。'
  es.a1.unit11.lesson06.teach.line03:
    title: 店员打招呼
    gloss: 店员向他们问好，并询问是否需要帮忙。
    note: '*¿Los ayudo?*（需要我帮你们吗？）是店员常用的招呼语，这里同时对埃琳娜和马特奥两人说。'
  es.a1.unit11.lesson06.teach.line04:
    title: 说出在找什么
    gloss: 埃琳娜说是的，他们在找围裙。
    note: '*Buscamos*（我们在找）是 *buscar* 的 *nosotros* 变位形式。'
  es.a1.unit11.lesson06.teach.line05:
    title: 店员展示款式并询问尺码
    gloss: 店员拿出几条围裙，并询问他们的尺码。
    note: '*¿Qué talla usan?* 使用复数形式 *usan*（你们穿），同时问两个人，不同于单数的 *usas*。'
  es.a1.unit11.lesson06.teach.line06:
    title: 说出尺码
    gloss: 马特奥说他穿中码。
    note: '*Uso la talla mediana* 是他为自己回答 *¿Qué talla usan?*。'
  es.a1.unit11.lesson06.teach.line06b:
    title: 埃琳娜表示同样
    gloss: 埃琳娜说她也是同一个尺码。
    note: '*Yo también* 的意思是“我也是”。'
  es.a1.unit11.lesson06.teach.line07:
    title: 询问价格
    gloss: 马特奥问这条围裙多少钱。
    note: '*Este*（这个）指的是他面前的那条围裙。'
  es.a1.unit11.lesson06.teach.line07b:
    title: 说出价格
    gloss: 店员说十二。
    note: '*Cuesta* + 数字表示价格。'
  es.a1.unit11.lesson06.teach.line08:
    title: 确认合身并决定购买
    gloss: 埃琳娜说很合身，她喜欢这条，打算买下来。
    note: 依次结合了 *me queda bien*、*me gusta este* 和 *voy a comprarlo*。
  es.a1.unit11.lesson06.teach.line09:
    title: 同意并买两条
    gloss: 马特奥说他穿也很合身，他们买两条。
    note: '*A mí también*（我也是，带强调）在 *también* 表示赞同的用法上加了强调代词；*compramos dos* 为这一场景收尾。'
