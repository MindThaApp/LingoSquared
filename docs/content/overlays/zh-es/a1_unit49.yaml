teaching:
  es.a1.unit49.lesson01.teach.levantarse_me_levanto:
    title: 起床
    gloss: 起床 → 我起床
    note: '*Levantarse* 是反身动词：代词 *me* 放在动词前面，即 *Me levanto*。'
  es.a1.unit49.lesson01.teach.vestirse_me_visto:
    title: 穿衣服
    gloss: 穿衣服 → 我穿衣服
    note: '*Vestirse* 也是反身动词：*Me visto*。这里的 *me* 表示“自己”。'
  es.a1.unit49.lesson01.teach.desayunar_desayuno:
    title: 吃早餐
    gloss: 吃早餐 → 我吃早餐
    note: '*Desayunar* 不是反身动词：*Desayuno*，没有 *me*。'
  es.a1.unit49.lesson01.teach.trabajar_trabajo:
    title: 工作
    gloss: 工作 → 我工作
    note: '*Trabajar* 是规则的 -ar 动词，*yo* 的变位以 -o 结尾：*trabajo*。'
  es.a1.unit49.lesson01.teach.comer_como:
    title: 吃
    gloss: 吃 → 我吃
    note: '*Comer* 是规则的 -er 动词，*yo* 的变位以 -o 结尾：*como*。'
  es.a1.unit49.lesson01.teach.lavar_los_platos:
    title: 洗碗
    gloss: 洗碗 → 我洗碗
    note: '*Lavar los platos* 不是自反动词：*Lavo los platos*。宾语 *los platos* 仍放在动词后面。'
  es.a1.unit49.lesson01.teach.dormir_duermo:
    title: 睡觉
    gloss: 睡觉 → 我睡觉
    note: '*Dormir* 在 *yo* 变位中词干元音发生变化：*duermo*（o 变成 ue）。'
  es.a1.unit49.lesson02.teach.con_levantarse_y:
    title: 自反结构
    gloss: 在 levantarse 和 vestirse 中，代词放在动词前面：levantarse → Me levanto。
    note: 自反动词要把 *me* 放在变位动词之前：说 *Me levanto*，不说 *Levanto me*。
  es.a1.unit49.lesson02.teach.levantarse_me_levanto:
    title: 句中的 Levantarse
    gloss: 起床：我七点起床。
    note: 时间短语放在动词后面：*Me levanto a las siete*。
  es.a1.unit49.lesson02.teach.vestirse_me_visto:
    title: 句中的 Vestirse
    gloss: 穿衣服：我穿衣服。
    note: 结构是 *me* + *visto*：代词紧挨在动词前面。
  es.a1.unit49.lesson02.teach.lavar_los_platos:
    title: 句中的 Lavar los platos
    gloss: 洗碗：我吃完饭后洗碗。
    note: '*Después de comer*（“吃完饭后”）由 *de* 加动词原形构成，可以放在句末。'
  es.a1.unit49.lesson02.teach.sin_pronombre_desayuno:
    title: 不带 me 的动词
    gloss: 不带代词：我吃早餐。我工作。我睡觉。这些动词不是自反动词。
    note: '*Desayuno*、*trabajo* 和 *duermo* 都没有 *me*：这些动词不是自反动词。'
  es.a1.unit49.lesson03.teach.me_levanto_a:
    title: 七点半起床
    gloss: 我七点半起床。
    note: 西班牙语用 *y media* 表示“半”：*las siete y media* 就是 7:30。时间前要用 *a las*。
  es.a1.unit49.lesson03.teach.me_visto_a:
    title: 七点四十五分穿衣服
    gloss: 我七点四十五分穿衣服。
    note: '*Las ocho menos cuarto* 是从下一个整点往回数：7:45。'
  es.a1.unit49.lesson03.teach.desayuno_a_las:
    title: 八点吃早餐
    gloss: 我八点吃早餐。
    note: 时间前用 *a las*：*a las ocho*。一点则说 *a la una*。
  es.a1.unit49.lesson03.teach.trabajo_de_nueve:
    title: 从九点工作到五点
    gloss: 我从九点工作到五点。
    note: '*De ... a ...* 表示开始和结束的时间：*de nueve a cinco*。'
  es.a1.unit49.lesson03.teach.como_a_las:
    title: 六点半吃饭
    gloss: 我下午六点半吃饭。
    note: '*De la tarde* 明确指出是傍晚，所以这里的 *las seis y media* 是 18:30。'
  es.a1.unit49.lesson03.teach.duermo_a_las:
    title: 十一点睡觉
    gloss: 我十一点睡觉。
    note: 时间前用 *a las*：*a las once*。
  es.a1.unit49.lesson04.teach.primero_luego_despues:
    title: 首先、然后、之后
    gloss: 首先、然后、之后
    note: '*Primero* 表示第一件事，*luego* 表示下一件事，*después* 表示接下来的事。'
    example_gloss:
    - 首先我起床。
    - 然后我穿衣服。
    - 之后我吃早餐。
  es.a1.unit49.lesson04.teach.primero_me_levanto:
    title: 早晨的三个步骤
    gloss: 首先我起床。然后我穿衣服。之后我吃早餐。
    note: 自反动词的 *me* 要放在动词前面：*me levanto*、*me visto*。
  es.a1.unit49.lesson04.teach.primero_luego_y:
    title: 顺序词
    gloss: Primero、luego 和 después 用来排列你做事的顺序；动词形式不变：Después desayuno。
    note: 顺序词放在句首，动词形式不变：*Después desayuno*。
  es.a1.unit49.lesson05.teach.mi_dia_me:
    title: 我的一天
    gloss: 我的一天——我七点半起床。之后我穿衣服，八点吃早餐。我从九点工作到五点。下午六点半我吃饭。之后我洗碗。十一点我睡觉。
    note: 阅读时既要注意活动的顺序，也要注意时间。留意带 *me* 的 *me levanto* 和 *me visto*。
    glosses:
      Mi: 我的
      día: 天
      levanto: 起床
      media: 半（y media 表示“半”）
      ocho: 八
      Después: 之后
      visto: 穿衣服
      las: 冠词（用于钟点前：las ocho）
      desayuno: 吃早餐
      Trabajo: 工作
      nueve: 九
      cinco: 五
      siete: 七
      tarde: 在傍晚
      como: 吃饭
      lavo: 洗碗
      once: 十一
      duermo: 睡觉
  es.a1.unit49.lesson06.teach.elena_como_es:
    title: 询问一天的安排
    gloss: 埃莱娜：马特奥，你的一天是怎么过的？
    note: '*¿Cómo es tu día?* 是请对方描述自己一天的随意说法；*tu* 是非正式的“你的”。'
  es.a1.unit49.lesson06.teach.mateo_me_levanto:
    title: 马特奥的早晨
    gloss: 马特奥：我七点半起床。之后我穿衣服，八点吃早餐。
    note: 马特奥用 *después* 和 *y* 连接早晨的三件事。
  es.a1.unit49.lesson06.teach.elena_cuando_trabajas:
    title: 马特奥的工作日
    gloss: 埃莱娜：你什么时候工作？马特奥：我从九点工作到五点。
    note: 埃莱娜和马特奥彼此使用非正式的 *tú* 变位：*¿Cuándo trabajas?*
  es.a1.unit49.lesson06.teach.mateo_a_las:
    title: 马特奥的晚上
    gloss: 马特奥：下午六点半我吃饭。之后我洗碗。十一点我睡觉。
    note: '*Después* 放在句首，动词形式不变：*después lavo*。'
  es.a1.unit49.lesson06.teach.elena_me_levanto:
    title: 埃莱娜的早晨
    gloss: 埃莱娜：我六点起床，但要到六点半才吃早餐。
    note: '*No ... hasta* 表示“直到……才”。埃莱娜对比了起床时间和吃早餐的时间。'
