teaching:
  fa.a1.unit20.lesson01.teach.shirt_word:
    title: پیراهن
    gloss: پیراهن
    note: پیراهن واژه‌ی عمومی برای پیراهن (شرت) است.
    example_gloss: من یک پیراهن می‌خواهم.
  fa.a1.unit20.lesson01.teach.pants_word:
    title: پتلون
    gloss: پتلون
    note: شلوار یعنی پتلون.
    example_gloss: این پتلون‌ها چند است؟
  fa.a1.unit20.lesson01.teach.shoes_word:
    title: کفش
    gloss: بوت
    note: کفش یعنی بوت.
    example_gloss: بوت دارید؟
  fa.a1.unit20.lesson01.teach.jacket_word:
    title: کوتی
    gloss: جاکت
    note: کت یعنی کوتی (مثل کوتی رسمی یا بلیزر)؛ برای بالاپوش ضخیم زمستانی معمولاً واژه‌ی دیگری به کار می‌رود.
    example_gloss: کوتی می‌خواهم.
  fa.a1.unit20.lesson01.teach.nice_word:
    title: قشنگ / زیبا
    gloss: قشنگ
    note: قشنگ واژه‌ی رایج روزمره برای قشنگ/زیبا است و اغلب با کوتاه‌شده‌ی «-ه» (قشنگه) می‌آید.
    example_gloss: این کوتی قشنگ است.
  fa.a1.unit20.lesson01.teach.want_word:
    title: می‌خواهم (مرور)
    gloss: می‌خواهم
    note: '*می‌خوام* شکل گفتاری روزمره‌ی *می‌خواهم* است. آن را در یک واحد قبلی دیده‌اید؛ در این واحد برای درخواست لباس بارها به کار می‌رود.'
    target_text: می‌خوام (می‌خواهم)
  fa.a1.unit20.lesson01.teach.va_word:
    title: و (مرور)
    gloss: و
    note: '*و* واژه‌ی عمومی پیوند دهنده برای «و» است که از یک واحد قبلی مرور می‌شود.'
    target_text: و (و)
  fa.a1.unit20.lesson02.teach.color_word:
    title: رنگ
    gloss: رنگ
    note: رنگ واژه‌ی عمومی برای رنگ است.
    example_gloss: چه رنگی می‌خواهید؟
  fa.a1.unit20.lesson02.teach.red_word:
    title: سرخ
    gloss: سرخ
    note: قرمز یعنی سرخ.
    example_gloss: این پیراهن سرخ است.
  fa.a1.unit20.lesson02.teach.blue_word:
    title: آبی
    gloss: آبی
    note: آبی یعنی رنگ آبی، با کوتاه‌شده‌ی «-ه» (آبیه) برای «آبی است».
    example_gloss: پتلون من آبی است.
  fa.a1.unit20.lesson02.teach.black_word:
    title: سیاه
    gloss: سیاه
    note: سیاه یعنی رنگ سیاه.
    example_gloss: بوت‌های سیاه قشنگ اند.
  fa.a1.unit20.lesson02.teach.white_word:
    title: سفید
    gloss: سفید
    note: سفید یعنی رنگ سفید.
    example_gloss: یک کوت سفید می‌خواهم.
  fa.a1.unit20.lesson03.teach.size_word:
    title: اندازه
    gloss: اندازه
    note: سایز کلمهٔ رایج برای اندازهٔ لباس است.
    example_gloss: چه سایزی می‌خواهید؟
  fa.a1.unit20.lesson03.teach.big_word:
    title: بزرگ
    gloss: بزرگ
    note: بزرگ یعنی کلان یا بزرگ.
    example_gloss: سایز بزرگ می‌خواهم.
  fa.a1.unit20.lesson03.teach.small_word:
    title: کوچک
    gloss: کوچک
    note: کوچیک یعنی خورد و کوچک؛ کوچیکه با شکل کوتاه -ه یعنی «کوچک است».
    example_gloss: این بوت‌ها کوچک اند.
  fa.a1.unit20.lesson03.teach.medium_word:
    title: متوسط
    gloss: متوسط
    note: متوسط یعنی سایز میانه.
    example_gloss: سایز متوسط دارید؟
  fa.a1.unit20.lesson04.teach.try_on_question:
    title: خواستن اجازه برای پوشیدن لباس
    gloss: می‌توانم آن را امتحان کنم؟
    note: می‌تونم امتحانش کنم؟ شکل محاوره‌ای و رایج برای خواستن اجازهٔ امتحان کردن لباس در فارسی ایران است.
  fa.a1.unit20.lesson04.teach.yes_go_ahead:
    title: بله، بفرمایید
    gloss: بله، بفرمایید.
    note: '*بله، بفرمایید* راه مؤدبانهٔ دکاندار برای موافقت است و *بفرمایید* را از درس قبلی دوباره می‌بینید.'
  fa.a1.unit20.lesson04.teach.contraction_note:
    title: شکل محاوره‌ای می‌تونم (مرور)
    gloss: من می‌توانم (شکل گفتاری)
    note: 'در گفتار روزمرهٔ فارسی ایران، -ان- نوشتاری اغلب به -ون- تبدیل می‌شود: *می‌توانم* به *می‌تونم* (من می‌توانم) تبدیل می‌شود. همین تغییر را قبلاً در *تومن*، شکل گفتاری *تومان*، دیده‌اید.'
  fa.a1.unit20.lesson05.teach.label_text:
    title: یک برچسب لباس
    gloss: 'سایز: بزرگ. رنگ: سرخ.'
    note: یک برچسب کوتاه لباس، به همان شکلی که روی لباس‌های واقعی می‌بینید.
  fa.a1.unit20.lesson06.teach.please_review:
    title: بفرمایید (مرور)
    gloss: بفرمایید
    note: از درس قبلی مرور شده است.
  fa.a1.unit20.lesson06.teach.thanks_review:
    title: تشکر (مرور)
    gloss: تشکر
    note: از درس قبلی مرور شده است.
  fa.a1.unit20.lesson06.teach.ok_review:
    title: خوب است (مرور)
    gloss: خوب
    note: از درس قبلی مرور شده است.
  fa.a1.unit20.lesson06.teach.turn01:
    title: دکاندار مشتری را سلام می‌دهد
    gloss: سلام، بفرمایید.
  fa.a1.unit20.lesson06.teach.turn02:
    title: نیما پیراهن آبی می‌خواهد
    gloss: سلام. یک پیراهن آبی می‌خواهم.
  fa.a1.unit20.lesson06.teach.turn03:
    title: دکاندار از سایز می‌پرسد
    gloss: چه سایزی می‌خواهید؟
  fa.a1.unit20.lesson06.teach.turn04:
    title: نیما سایز را می‌گوید و اجازهٔ امتحان کردن می‌خواهد
    gloss: سایز متوسط. می‌توانم آن را امتحان کنم؟
  fa.a1.unit20.lesson06.teach.turn05:
    title: دکاندار موافقت می‌کند
    gloss: بله، بفرمایید.
  fa.a1.unit20.lesson06.teach.turn06:
    title: نیما را خوش می‌آید و قیمت را می‌پرسد
    gloss: قشنگ است. این چند است؟
  fa.a1.unit20.lesson06.teach.turn07:
    title: دکاندار قیمت را می‌گوید
    gloss: سی هزار تومان است.
  fa.a1.unit20.lesson06.teach.turn08:
    title: نیما قبول می‌کند نقد پرداخت کند
    gloss: خوب است، نقد پرداخت می‌کنم. تشکر.
