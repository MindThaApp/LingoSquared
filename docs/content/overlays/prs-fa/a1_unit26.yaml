teaching:
  fa.a1.unit26.lesson01.teach.man_review:
    title: من
    gloss: من
    note: '*من* که قبلاً خوب آموخته‌اید، اینجا دوباره می‌آید تا دربارهٔ حیوان خانگی خودتان صحبت کنید.'
  fa.a1.unit26.lesson01.teach.oo_review:
    title: او
    gloss: او
    note: '*او* اینجا دوباره می‌آید.'
  fa.a1.unit26.lesson01.teach.daram_family_review:
    title: من دارم / او دارد / من ندارم
    gloss: من دارم / او دارد / من ندارم
    note: '*دارم*/*داره* با حیوان خانگی هم به همین شکل کار می‌کنند. *ندارم* (من ندارم) و *نداره* (او ندارد) شکل منفی آن‌ها هستند -- هر دو قبلاً در گفتگوی خانوادهٔ واحد ۴ با هم آمده بودند.'
  fa.a1.unit26.lesson01.teach.heyvan_word:
    title: حیوان
    gloss: حیوان
    note: '*حیوان* یعنی حیوان.'
    example_gloss: گربه یک حیوان است.
  fa.a1.unit26.lesson01.teach.heyvane_khoonegi_phrase:
    title: حیوان خانگی
    gloss: حیوان خانگی
    note: '*حیوان خونگی* در اصل یعنی «حیوان خانه» -- شکل معمول گفتن «حیوان خانگی» است.'
  fa.a1.unit26.lesson01.teach.sag_word:
    title: سگ
    gloss: سگ
    note: '*سگ* یعنی سگ.'
    example_gloss: من یک سگ دارم.
  fa.a1.unit26.lesson01.teach.gorbe_word:
    title: گربه
    gloss: گربه
    note: '*گربه* یعنی گربه.'
    example_gloss: او یک گربه دارد.
  fa.a1.unit26.lesson02.teach.parande_word:
    title: پرنده
    gloss: پرنده
    note: '*پرنده* یعنی پرنده.'
    example_gloss: او یک پرنده دارد.
  fa.a1.unit26.lesson02.teach.mahi_word:
    title: ماهی
    gloss: ماهی
    note: '*ماهی* یعنی ماهی.'
    example_gloss: من یک ماهی دارم.
  fa.a1.unit26.lesson02.teach.dari_review:
    title: تو داری
    gloss: تو داری
    note: '*داری* اینجا دوباره با همین شکل دوم شخص غیررسمی می‌آید.'
  fa.a1.unit26.lesson02.teach.have_a_pet_question:
    title: حیوان خانگی داری؟
    gloss: حیوان خانگی داری؟
    note: '*حیوان خونگی داری؟* *حیوان خونگی* درس اول را با *داری* یکجا می‌کند -- شکل طبیعی پرسیدن از کسی که حیوان خانگی دارد یا نه.'
  fa.a1.unit26.lesson02.teach.are_review:
    title: بلی
    gloss: بلی
    note: '*آره* کلمهٔ عادی و محاوره‌یی برای «بلی» در فارسی ایران است.'
  fa.a1.unit26.lesson03.teach.esm_review:
    title: نام
    gloss: نام
    note: '*اسم* برای نام حیوان خانگی هم به همین شکل استفاده می‌شود.'
  fa.a1.unit26.lesson03.teach.esmesh_chiye_phrase:
    title: نامش چیست؟
    gloss: نامش چیست؟
    note: '*اسمش چیه؟* پسوند ملکی *-ش* (که در واحد ۲۵ در *قدش*/*موهاش* دیده بودید) را با *چیه؟* از واحد ۲ یکجا می‌کند -- «نامش چیست؟»'
  fa.a1.unit26.lesson03.teach.ghaza_word:
    title: غذا
    gloss: غذا
    note: '*غذا* همان کلمه‌یی است که برای غذای حیوان خانگی هم استفاده می‌شود.'
    example_gloss: من غذا را دوست دارم.
  fa.a1.unit26.lesson03.teach.midam_word:
    title: من غذا می‌دهم
    gloss: من غذا می‌دهم
    note: '*می‌دم* (در اصل «می‌دهم»)، که در واحد ۲۴ در *گوش می‌دم* دیده بودید، همراه با *غذا* فعل عادی برای غذا دادن به حیوان خانگی است.'
  fa.a1.unit26.lesson03.teach.sagam_word:
    title: سگ من
    gloss: سگ من
    note: '*سگم* از *سگ* و پسوند ملکی *-م* ساخته شده -- «سگ من»، به همان شکل یکجا شدهٔ *اسمم* از واحد ۲.'
  fa.a1.unit26.lesson03.teach.feed_my_dog_phrase:
    title: من به سگم غذا می‌دهم.
    gloss: من به سگم غذا می‌دهم.
    note: '*سگم رو غذا می‌دم* از *رو* (نشانهٔ مفعول، که در واحد ۱۴ در *قهوه رو بیشتر دوست دارم* دیده بودید) استفاده می‌کند تا *سگم* را چیزی که غذا می‌گیرد نشان بدهد.'
  fa.a1.unit26.lesson04.teach.che_rangiye_review:
    title: چه رنگی است؟
    gloss: چه رنگی است؟
    note: '*چه رنگیه؟* برای گفتن رنگ حیوان خانگی هم به همین شکل استفاده می‌شود.'
  fa.a1.unit26.lesson04.teach.sefid_word:
    title: سفید
    gloss: سفید
    note: '*سفید* اینجا برای رنگ حیوان خانگی دوباره آمده است. *گربه‌ی* شکل اضافهٔ *گربه* پیش از صاحب آن است، مثل *گربه‌ی من* (گربهٔ من) -- همان الگوی *خونه‌ی من* در واحد ۱۹، که برای اسم‌های مختوم به مصوت به‌جای پسوند چسبیده به کار می‌رود.'
    example_gloss: گربهٔ من سفید است.
  fa.a1.unit26.lesson04.teach.koochik_word:
    title: کوچک
    gloss: کوچک
    note: '*کوچیک* اینجا برای اندازهٔ حیوان خانگی دوباره آمده است.'
    example_gloss: ماهی من کوچک است.
  fa.a1.unit26.lesson04.teach.bozorg_word:
    title: بزرگ
    gloss: بزرگ
    note: '*بزرگ* اینجا برای اندازهٔ حیوان خانگی دوباره آمده است.'
    example_gloss: سگ من بزرگ است.
  fa.a1.unit26.lesson05.teach.sara_review:
    title: سارا
    gloss: سارا
    note: '*سارا* که در واحد ۲ به‌عنوان یک شخصیت معرفی شد، اینجا دوباره می‌آید.'
    example_gloss: سارا گربه دارد.
  fa.a1.unit26.lesson05.teach.yek_review:
    title: یک
    gloss: یک
    note: '*یک* اینجا مثل نشانهٔ نکره به کار رفته است، به معنای «یک».'
  fa.a1.unit26.lesson05.teach.va_review:
    title: و
    gloss: و
    note: '*و* به معنای «و» است -- که در واحدهای ۱۴، ۲۴ و ۲۵ هم به همین شکل استفاده شده بود.'
  fa.a1.unit26.lesson05.teach.pashmak_name:
    title: پشمک
    gloss: پشمک
    note: '*پشمک* (در اصل نوعی شیرینی) در ایران یک نام رایج برای حیوان خانگی است -- نام گربهٔ سارا.'
    example_gloss: نام گربهٔ سارا پشمک است.
  fa.a1.unit26.lesson05.teach.har_rooz_review:
    title: هر روز
    gloss: هر روز
    note: '*هر روز* اینجا برای غذا دادن به حیوان خانگی هم به همین شکل به کار می‌رود.'
  fa.a1.unit26.lesson05.teach.mide_word:
    title: او غذا می‌دهد
    gloss: او غذا می‌دهد
    note: '*می‌ده* شکل محاوره‌یی شخص سوم همان فعل *می‌دم* (من می‌دهم) از درس ۳ است.'
  fa.a1.unit26.lesson05.teach.reading_text:
    title: 'خواندنی: گربهٔ سارا'
    gloss: سارا یک گربه دارد. نامش پشمک است. پشمک سفید و کوچک است. سارا هر روز به پشمک غذا می‌دهد.
    note: این متن همهٔ ساختارهای درس‌های ۱ تا ۴ را دوباره به کار می‌برد -- تقریباً هیچ واژهٔ تازه ندارد و فقط شناختن آنها در یک متن پیوسته است.
  fa.a1.unit26.lesson06.teach.in_word:
    title: این
    gloss: این
    note: '*این* به معنای «این» است.'
  fa.a1.unit26.lesson06.teach.kiye_review:
    title: از کیست؟
    gloss: از کیست؟
    note: '*کیه* اینجا برای پرسیدن اینکه حیوان خانگی از کیست به کار می‌رود.'
  fa.a1.unit26.lesson06.teach.mane_word:
    title: از من است
    gloss: از من است
    note: '*منه* شکل کوتاه محاوره‌یی *من است* است -- «از من است». *گربه‌ی منه* یعنی «گربهٔ من است».'
  fa.a1.unit26.lesson06.teach.sagame_word:
    title: سگ من است
    gloss: سگ من است
    note: '*سگمه* از *سگم* (سگ من) در درس ۳ و همان پایانهٔ *-ه* به معنای «است» مثل *منه* ساخته شده -- «سگ من است».'
  fa.a1.unit26.lesson06.teach.khoshgel_word:
    title: قشنگ
    gloss: قشنگ
    note: '*خوشگل* یعنی قشنگ و زیبا. *خیلی* یعنی «بسیار».'
    example_gloss: گربهٔ سارا بسیار قشنگ است.
  fa.a1.unit26.lesson06.teach.mamnoon_review:
    title: تشکر
    gloss: تشکر
    note: '*ممنون* اینجا دوباره به‌عنوان جملهٔ پایانی طبیعی می‌آید.'
  fa.a1.unit26.lesson06.teach.dialogue_line1:
    title: 'نیما: این گربهٔ کیست؟'
    gloss: این گربهٔ کیست؟
  fa.a1.unit26.lesson06.teach.dialogue_line2:
    title: 'سارا: گربهٔ من است. نامش پشمک است.'
    gloss: گربهٔ من است. نامش پشمک است.
  fa.a1.unit26.lesson06.teach.dialogue_line3:
    title: 'نیما: چه رنگی است؟'
    gloss: چه رنگی است؟
  fa.a1.unit26.lesson06.teach.dialogue_line4:
    title: 'سارا: سفید و کوچک است.'
    gloss: سفید و کوچک است.
  fa.a1.unit26.lesson06.teach.dialogue_line5:
    title: 'نیما: بسیار قشنگ است!'
    gloss: بسیار قشنگ است!
  fa.a1.unit26.lesson06.teach.dialogue_line6:
    title: 'سارا: تشکر!'
    gloss: تشکر!
