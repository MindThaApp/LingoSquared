course:
  title: فارسی ایران A1
  description: 'فارسی ایران برای مبتدیان: نام بردن حیوانات خانگی و حیوانات عام (سگ، گربه، پرنده، ماهی)، پرسیدن «حیوان خانگی داری؟»، گفتن نام حیوان خانگی و غذا دادن به آن، توصیف رنگ و اندازهٔ حیوان خانگی، یک متن کوتاه دربارهٔ گربهٔ سارا به نام پشمک، و یک گفتگوی پایانی میان سارا و نیما که پشمک را تعریف می‌کنند.'
