    gloss: نشانه‌ها
    note: '*علائم* کلمهٔ عمومی برای نشانه‌های مریضی است.'
    example_gloss: داکتر دربارهٔ نشانه‌های مریضی‌ام پرسید.
  fa.a2.unit12.lesson01.teach.duration_word:
    title: مدت
    gloss: مدت / دورهٔ زمانی
    note: '*مدت* کلمهٔ عمومی برای یک دوره یا اندازهٔ زمان است.'
    example_gloss: چه مدت می‌شود که این‌طور استید؟
  fa.a2.unit12.lesson01.teach.prescription_word:
    title: نسخه
    gloss: نسخه
    note: '*نسخه* یعنی نسخهٔ داکتر.'
    example_gloss: داکتر یک نسخه داد.
  fa.a2.unit12.lesson01.teach.rest_word:
    title: استراحت
    gloss: استراحت
    note: '*استراحت* یعنی استراحت و آرام گرفتن.'
    example_gloss: باید چند روز استراحت کنم.
  fa.a2.unit12.lesson01.teach.bayad_note:
    title: باید
    gloss: باید / لازم است
    note: '*باید* الزام یا مشوره را می‌رساند -- «باید» یا «بهتر است»؛ دستور سطح A2 که هدایات داکتر در این واحد از آن استفاده می‌کند.'
    target_text: باید (لازم است / بهتر است)
  fa.a2.unit12.lesson02.teach.headache_three_days_severe:
    title: بیان یک نشانه همراه با مدت و شدت
    gloss: سه روز می‌شود که سردردی شدید دارم.
    note: '*از ... پیش* (از ... قبل) مدت را بیان می‌کند؛ *شدید* (سخت) شدت را بیان می‌کند -- گامی بالاتر از سطح A1 که فقط نام نشانه را می‌گفت.'
  fa.a2.unit12.lesson02.teach.doctor_instruction:
    title: هدایت دکتر
    gloss: دکتر گفت که باید نسخه را بگیرم و استراحت کنم.
    note: '*باید* در اینجا هدایت دکتر را به شکل یک مشوره بازگو می‌کند.'
  fa.a2.unit12.lesson02.teach.full_symptom_and_instruction:
    title: ترکیب علامت مریضی و هدایت دکتر
    gloss: از سه روز به این طرف سردرد شدید دارم. دکتر گفت که باید استراحت کنم.
    note: الگوی کامل علامت مریضی همراه با هدایت دکتر که این درس بر آن ساخته شده است.
  fa.a2.unit12.lesson03.teach.appointment_word:
    title: وقت ملاقات
    gloss: وعده ملاقات
    note: '*نوبت* کلمهٔ عمومی برای وقت ملاقات یا نوبت است.'
    example_gloss: نوبت من روز سه‌شنبه ساعت ۱۱ صبح است.
  fa.a2.unit12.lesson03.teach.earlier_word:
    title: زودتر
    gloss: زودتر
    note: '*زودتر* یعنی پیشتر یا قبل از وقت.'
    example_gloss: لطفاً ۱۵ دقیقه زودتر بیایید.
  fa.a2.unit12.lesson03.teach.confirmation_text:
    title: تأیید وقت ملاقات
    gloss: نوبت شما با دکتر رضایی روز سه‌شنبه ساعت ۱۱ صبح است. لطفاً ۱۵ دقیقه زودتر بیایید. اگر بعد از یک هفته علامت‌ها بهتر نشد، دوباره تماس بگیرید.
    note: یک تأییدیهٔ کوتاه و رسمی وقت ملاقات، به سبک نوشتاری که این واحد آموزش می‌دهد.
  fa.a2.unit12.lesson04.teach.whats_wrong:
    title: چی شده؟
    gloss: بفرمایید، چه شده؟
    note: '*بفرمایید، چی شده؟* جملهٔ آغازین معمول و مؤدبانه در مطب دکتر است.'
  fa.a2.unit12.lesson04.teach.turn01:
    title: دکتر رضایی می‌پرسد چه شده
    gloss: دکتر رضایی او را به صحبت دعوت می‌کند و می‌پرسد مشکل چیست.
    note: همین جملهٔ آغازین این درس دوباره آمده است.
  fa.a2.unit12.lesson04.teach.turn02:
    title: نیما علامت مریضی‌اش را توضیح می‌دهد
    gloss: نیما می‌گوید از سه روز به این طرف سردرد شدید دارد.
    note: الگوی علامت مریضی همراه با مدت و شدت از درس دوم دوباره آمده است.
  fa.a2.unit12.lesson04.teach.turn03:
    title: دکتر رضایی دربارهٔ تب می‌پرسد
    gloss: دکتر رضایی می‌پرسد که آیا تب هم دارد.
    note: '*تب هم دارید؟* دربارهٔ یک علامت اضافی می‌پرسد.'
  fa.a2.unit12.lesson04.teach.turn04:
    title: نیما دربارهٔ تب جواب می‌دهد
    gloss: نیما می‌گوید نه، فقط سردرد است، اما شدید است.
    note: '*فقط ... ولی ...* موضوع را محدود می‌کند و تضاد می‌آورد.'
  fa.a2.unit12.lesson04.teach.turn05:
    title: دکتر رضایی هدایت می‌دهد
    gloss: دکتر رضایی می‌گوید خوب است، این نسخه را بگیرید و چند روز استراحت کنید.
    note: هدایت دکتر برای تداوی، شامل نسخه و استراحت.
  fa.a2.unit12.lesson04.teach.turn06:
    title: نیما از دکتر تشکر می‌کند
    gloss: نیما می‌گوید بالای چشم، تشکر دکتر صاحب.
    note: '*چشم* راه مؤدبانه و با احترام برای گفتن «حتماً» یا «انجام می‌دهم» به کسی است که مقام بالاتر دارد.'
