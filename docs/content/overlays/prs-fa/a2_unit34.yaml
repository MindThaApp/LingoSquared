    distractors:
    - به خاطر کار، پروژه را تغییر دادم.
    - به خاطر پروژه دیر کردم.
    - به خاطر ترافیک یک پروژه داشتم.
    accepted_answers:
    - value: به خاطر پروژه کار اضافه داشتم.
      status: correct
    feedback: '*به خاطر پروژه* دلیل را می‌رساند؛ *اضافه‌کاری داشتم* یعنی «اضافه‌کاری داشتم.»'
  fa.a2.unit34.lesson02.exercise01.recognize_khater_traffic:
