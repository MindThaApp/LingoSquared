teaching:
  fa.a2.unit34.lesson01.teach.reason_nouns:
    title: کلمه‌های دلیل
    gloss: باران، ترافیک، کار، مریض، دیروز، امروز
    note: '*بارون* شکل محاوره‌ای «باران» است. این‌ها دلیل‌های روزمره برای بهانه و تغییر برنامه اند.'
    example_gloss:
    - دیروز باران بود.
    - امروز ترافیک است.
    - امروز کار دارم.
    - دیروز کار داشتم.
    - دیروز مریض بودم.
  fa.a2.unit34.lesson01.teach.past_actions:
    title: نتیجه‌ها
    gloss: باران آمد، نیامدم، نمی‌آیم، دیر رسیدم
    note: 'این شکل‌های کوتاه نتیجه اند که آن‌ها را به یک دلیل وصل می‌کنید (گذشته: *نیومدم*؛ حال: *نمیام*). *نیومدم* منفی *اومدم* (آمدم) است.'
    example_gloss:
    - دیروز باران آمد.
    - دیروز نیامدم.
    - امروز نمی‌آیم.
    - امروز دیر رسیدم.
  fa.a2.unit34.lesson01.teach.connectors:
    title: سه حرف ربط
    gloss: چون، پس / به همین دلیل، به سبب
    note: سه راه برای وصل کردن دلیل و نتیجه. *چون* و *به خاطر* دلیل را نشان می‌دهند؛ *برای همین* نتیجه را نشان می‌دهد.
    example_gloss:
    - چون باران آمد، نیامدم.
    - باران آمد، پس نیامدم.
    - به سبب باران نیامدم.
  fa.a2.unit34.lesson01.teach.weather_causes:
    title: دلیل‌های هوا
    gloss: گرمی، سردی
    note: این اسم‌های مربوط به هوا را بعد از *به خاطر* بیاورید تا دلیل بگویید.
    example_gloss:
    - از گرمی مریض شدم.
    - از سردی مریض شدم.
  fa.a2.unit34.lesson01.teach.everyday_causes:
    title: دلیل‌های روزمره
    gloss: خستگی، خواب، کار اضافه، پروژه
    note: این اسم‌ها دلیل‌های معمول مربوط به خستگی و کار را می‌رسانند.
    example_gloss:
    - از خستگی دیر رسیدم.
    - از خواب دیر رسیدم.
    - به خاطر پروژه کار اضافه داشتم.
  fa.a2.unit34.lesson01.teach.chon:
    title: «چون» دلیل را معرفی می‌کند
    gloss: چون باران آمد، نیامدم.
    note: '*چون* + یک جمله کامل (با فعل خودش) دلیل را می‌گوید و نتیجه بعد از کاما می‌آید: *چون بارون اومد، نیومدم*.'
  fa.a2.unit34.lesson01.teach.baraye_hamin:
    title: «برای همین» نتیجه را معرفی می‌کند
    gloss: باران آمد، پس نیامدم.
    note: 'اول دلیل را در یک جمله جداگانه بگویید، بعد *برای همین* + نتیجه: *بارون اومد، برای همین نیومدم*. معنی‌اش «به همین دلیل» است.'
  fa.a2.unit34.lesson02.teach.plan_changes:
    title: بهانه‌ها و تغییر برنامه
    gloss: موترم خراب شد، به کار نرفتم، نتوانستم بیایم، قرارمان را تغییر دادیم
    note: '*قرار* وعده یا برنامه‌ای است که با کسی تعیین می‌کنید. *سر کار نرفتم* = «به کار نرفتم». *نتونستم بیام* = «نتوانستم بیایم».'
    example_gloss:
    - موترم خراب شد.
    - دیروز به کار نرفتم.
    - امروز نتوانستم بیایم.
    - قرارمان را تغییر دادیم.
  fa.a2.unit34.lesson02.teach.khater:
    title: «به خاطر» + اسم
    gloss: به سبب باران نیامدم.
    note: 'بعد از *به خاطر* یک اسم می‌آید، بدون فعل خودش: *به خاطر بارون*، *به خاطر ترافیک*، *به خاطر کار*. بقیه جمله نتیجه را می‌گوید: *به خاطر ترافیک دیر رسیدم*.'
  fa.a2.unit34.lesson02.teach.khater_vs_chon:
    title: یک معنی، دو شکل
    gloss: به سبب ترافیک = چون ترافیک بود
    note: '*به خاطر ترافیک* و *چون ترافیک بود* یک دلیل را می‌گویند. وقتی دلیل فقط یک اسم است *به خاطر* بیاورید و وقتی یک جمله کامل می‌گویید *چون* را.'
  fa.a2.unit34.lesson03.teach.order:
    title: اول دلیل، بعد نتیجه
    gloss: چون کار داشتم، نیامدم / کار داشتم، به همین دلیل نیامدم
    note: با *چون*، جمله دلیل در آغاز می‌آید و نتیجه در آخر. با *برای همین*، دلیل اول یک جمله جداگانه است و نتیجه بعد از *برای همین* می‌آید. در هر دو، دلیل پیش از نتیجه گفته می‌شود.
  fa.a2.unit34.lesson03.teach.clause_vs_noun:
    title: جمله یا اسم
    gloss: «چون» + جمله، «به خاطر» + اسم
    note: بعد از *چون* فعل لازم است (*بارون اومد*، *ترافیک بود*). بعد از *به خاطر* فقط اسم می‌آید (*بارون*، *ترافیک*). برای «چون باران آمد» نگویید *به خاطر بارون اومد*.
  fa.a2.unit34.lesson03.teach.one_connector:
    title: برای هر پیوند یک حرف ربط
    gloss: «چون» و «برای همین» را در یک پیوند با هم نیاورید
    note: برای یک دلیل و یک نتیجه یا *چون ... ،* بگویید یا *... ، برای همین ...*. گفتن هر دو در یک پیوند معنی را تکرار می‌کند و درست نیست.
  fa.a2.unit34.lesson04.teach.excuse_questions:
    title: پرسیدن سبب
    gloss: چرا، ببخشید، رسیدی، نیامدی، و
    note: '*چرا* دلیل می‌پرسد. *ببخشید* آغاز معذرت است. *و* دو واقعیت را وصل می‌کند.'
    example_gloss:
    - چرا دیروز نیامدی؟
    - چرا دیر رسیدی؟
    - ببخشید، دیر رسیدم.
    - باران آمد و ترافیک بود.
  fa.a2.unit34.lesson04.teach.answer_chon:
    title: جواب دادن به «چرا»
    gloss: جواب «چرا» با «چون» شروع می‌شود
    note: 'جواب طبیعی *چرا* با *چون* شروع می‌شود و فقط دلیل را می‌گوید: *چون ترافیک بود*. اگر بخواهید، با جملهٔ دوم نتیجه را هم بگویید.'
  fa.a2.unit34.lesson05.teach.message:
    title: پیامی دربارهٔ یک قرار که نشد
    gloss: سلام سارا. دیروز نتوانستم بیایم، چون موترم خراب شد. به خاطر باران ترافیک هم بود. امروز مریضم، برای همین قرارمان را تغییر دادم.
    note: یک بار بخوانید تا سه دلیل را پیدا کنید، بعد دوباره بخوانید تا ببینید از هر کدام چه نتیجه شد.
  fa.a2.unit34.lesson06.teach.dialogue_words:
    title: کلمه‌های گفتگو
    gloss: ما، بلی، خوب، نه، قرار داشتیم، می‌آیی، می‌آیم، نمی‌آیم
    note: '*آره* شکل محاوره‌ای «بلی» است. *میای؟* یعنی «می‌آیی؟»؛ جواب‌ها *میام* و *نمیام* اند.'
    example_gloss:
    - دیروز ما قرار داشتیم.
    - بلی، می‌آیم.
    - خوب، امروز می‌آیی؟
    - نه، امروز نمی‌آیم.
  fa.a2.unit34.lesson06.teach.turn01:
    title: سارا دلیل را می‌پرسد
    gloss: 'سارا از نیما می‌پرسد: نیما، چرا دیروز نیامدی؟'
    note: سوال *چرا* دلیل می‌پرسد.
  fa.a2.unit34.lesson06.teach.turn02:
    title: نیما دلیل را می‌گوید
    gloss: 'نیما: چون باران آمد.'
    note: جواب کوتاه *چرا* با *چون* شروع می‌شود.
  fa.a2.unit34.lesson06.teach.turn03:
    title: سارا یادآوری می‌کند
    gloss: 'سارا: اما ما قرار داشتیم.'
    note: '*قرار داشتیم* یعنی «ما قرار داشتیم».'
  fa.a2.unit34.lesson06.teach.turn04:
    title: نیما نتیجه را توضیح می‌دهد
    gloss: 'نیما: بلی، باران آمد و ترافیک بود، برای همین نتوانستم بیایم.'
    note: دو دلیل با *و* وصل شده اند، بعد *برای همین* نتیجه را می‌گوید.
  fa.a2.unit34.lesson06.teach.turn05:
    title: سارا دربارهٔ امروز می‌پرسد
    gloss: 'سارا: خوب، امروز می‌آیی؟'
    note: یک سوال زمان حال دربارهٔ قرار.
  fa.a2.unit34.lesson06.teach.turn06:
    title: نیما دلیل حال را می‌گوید
    gloss: 'نیما: نه، چون امروز کار دارم، نمی‌آیم.'
    note: یک دلیل زمان حال با *چون*، بعد نتیجه.
