teaching:
  fa.a2.unit29.lesson01.teach.places:
    title: قانون‌ها و جاها
    gloss: قانون، قانون‌های خانه، کتابخانه، حوض شنا، باشگاه ورزشی
    note: '*قانون* یعنی اصل و مقرره. خانه، کتابخانه، حوض شنا و باشگاه ورزشی همه *قانون‌ها* دارند.'
    example_gloss:
    - کتابخانه قانون دارد.
    - حوض شنا و باشگاه ورزشی هم قانون دارند.
    - خانه هم قانون دارد.
  fa.a2.unit29.lesson01.teach.must:
    title: 'باید: چیزی لازمی است'
    gloss: باید بروی؛ باید دوش بگیری؛ باید کارت بیاوری
    note: '*باید* + فعل التزامی = «باید». فعل بعد از *باید* به شکل التزامی می‌آید (*بری*، *بگیری*، *بیاری*) و *می‌* ندارد.'
  fa.a2.unit29.lesson01.teach.must_not:
    title: 'نباید: چیزی ممنوع است'
    gloss: نباید غذا بخوری؛ نباید فریاد بزنی
    note: '*نباید* + فعل التزامی = «نباید». یعنی آن کار ممنوع است. فعل بعد از آن مثبت می‌آید: *بخوری*، *بزنی*.'
  fa.a2.unit29.lesson01.teach.not_needed:
    title: 'لازم نیست: ضرورت ندارد'
    gloss: ضرورت نیست بیایی؛ ضرورت نیست پول بدهی
    note: '*لازم نیست* + فعل التزامی = «ضرورت ندارد». آن کار اختیاری است، ممنوع نیست.'
  fa.a2.unit29.lesson02.teach.rule_phrases:
    title: عبارت‌های قانون
    gloss: خاموش باشی، کتاب را پس بدهی، دستمال حمام بیاوری، بوت ورزشی بپوشی، بدوی
    note: هر عبارت یک فعل التزامی با پایانهٔ *-ی* برای دوست («تو») است. آن را بعد از *باید* یا *نباید* به کار ببر.
    example_gloss:
    - باید خاموش باشی.
    - باید کتاب را پس بدهی.
    - باید بوت ورزشی بپوشی.
  fa.a2.unit29.lesson02.teach.where:
    title: قانون کجا و کی اجرا می‌شود
    gloss: در کتابخانه، در حوض شنا، در باشگاه ورزشی، پیش از حوض شنا
    note: '*توی* یعنی «در» و *قبل از* یعنی «پیش از». معمولاً در آغاز قانون می‌آیند.'
    example_gloss:
    - در کتابخانه باید خاموش باشی.
    - پیش از حوض شنا باید دوش بگیری.
    - در باشگاه ورزشی باید بوت ورزشی بپوشی.
  fa.a2.unit29.lesson02.teach.polite:
    title: 'بیگانه‌ها و اعلان‌ها: پایانهٔ شما'
    gloss: باید خاموش باشید (محترمانه یا جمع)؛ باید دوش بگیرید (محترمانه یا جمع)
    note: 'برای اشخاص ناآشنا، مسئولان یا چند نفر، پایانه از *-ی* به *-ید* تغییر می‌کند: *باشی* می‌شود *باشید* و *بگیری* می‌شود *بگیرید*. اعلان‌ها از همین شکل استفاده می‌کنند.'
  fa.a2.unit29.lesson02.teach.no_mi:
    title: بعد از باید، می‌ نمی‌آید
    gloss: باید بروی؛ نباید بروی
    note: بعد از *باید*، *نباید* و *لازم نیست*، فعل التزامی ساده (*بری*) می‌آید، نه شکل حال با *می‌*.
  fa.a2.unit29.lesson03.teach.contrast:
    title: نباید با لازم نیست فرق دارد
    gloss: نباید بیایی؛ ضرورت نیست بیایی
    note: این دو یکی نیستند. *نباید بیای* = آمدن ممنوع است. *لازم نیست بیای* = می‌توانی بیایی، اما مجبور نیستی.
  fa.a2.unit29.lesson03.teach.notice_form:
    title: 'اعلان‌ها: ممنوعه'
    gloss: غذا خوردن ممنوع است؛ دویدن ممنوع است
    note: 'تخته‌ها و اعلان‌ها اغلب نام کار را می‌آورند و *ممنوعه* را اضافه می‌کنند: *غذا خوردن ممنوعه*. به دوست می‌گویی *نباید غذا بخوری*.'
  fa.a2.unit29.lesson03.teach.extra_rules:
    title: دو قانون دیگر
    gloss: تکت بخری، ظرف‌ها را بشویی
    note: 'این عبارت‌ها در تمرین‌ها بعد از *لازم نیست* می‌آیند: می‌توانی آن را بکنی، اما ضرور نیست.'
    example_gloss:
    - ضرورت نیست تکت بخری.
    - ضرورت نیست ظرف‌ها را بشویی.
    - در حوض شنا نباید غذا بخوری.
  fa.a2.unit29.lesson04.teach.permission:
    title: اجازه خواستن
    gloss: آمده می‌توانم؟ اگر اینجا بنشینم مشکلی نیست؟
    note: '*می‌تونم* + فعل التزامی یعنی «آیا می‌توانم؟» (*می‌تونم بیام؟*). *مشکلی نداره* + فعل التزامی یعنی «اگر ... مشکلی نیست؟» (*مشکلی نداره بشینم؟*).'
  fa.a2.unit29.lesson04.teach.answers:
    title: جواب دادن به سؤال اجازه
    gloss: بله، می‌توانی. نخیر، نمی‌توانی. بله، مشکلی نیست. نخیر، ممنوع است.
    note: برای «بله» بگو *آره، می‌تونی* یا *آره، مشکلی نداره*. برای «نخیر» بگو *نه، نمی‌تونی* یا *نه، ممنوعه*.
  fa.a2.unit29.lesson04.teach.ejaze:
    title: یک سؤال مؤدبانهٔ دیگر
    gloss: اجازه است داخل شوم؟
    note: '*اجازه هست؟* راه مؤدبانه برای پرسیدن است که آیا اجازه داری کاری بکنی. در این درس فقط باید آن را بشناسی.'
  fa.a2.unit29.lesson04.teach.house:
    title: 'قانون‌های خانه: جدا کردن کثافات'
    gloss: کثافات را جدا کنی، پلاستیک را در سطل کاغذ بیندازی
    note: '*زباله رو جدا کردن* یعنی کثافات را جدا کردن. قانون می‌گوید پلاستیک در سطل کاغذ انداخته نمی‌شود.'
    example_gloss:
    - باید کثافات را جدا کنی.
    - نباید پلاستیک را در سطل کاغذ بیندازی.
  fa.a2.unit29.lesson04.teach.night:
    title: قانون ساعت‌های آرام
    gloss: در شب نباید بلند صحبت کنی
    note: '*بلند حرف زدن* یعنی با آواز بلند صحبت کردن. *شب* (در شب) اول می‌آید.'
    example_gloss:
    - در شب نباید بلند صحبت کنی.
  fa.a2.unit29.lesson05.teach.notice:
    title: اعلان قانون‌ها
    gloss: قانون‌ها. در کتابخانه باید خاموش باشید. غذا خوردن ممنوع است. پیش از حوض شنا باید دوش بگیرید. در حوض شنا دویدن ممنوع است. در باشگاه ورزشی باید بوت ورزشی بپوشید، اما ضرورت نیست دستمال حمام بیاورید. کثافات را باید جدا کنید.
    note: اعلان با اشخاص ناآشنا صحبت می‌کند، پس پایانهٔ *-ید* را به کار می‌برد. یک بار بخوان و بفهم چه چیز لازم، چه چیز ممنوع و چه چیز اختیاری است.
  fa.a2.unit29.lesson06.teach.turn01:
    title: ثنا اجازه می‌خواهد
    gloss: ثنا می‌پرسد که آیا او هم می‌تواند به حوض شنا بیاید.
    note: '*مشکلی نداره* + فعل التزامی اجازه می‌خواهد.'
  fa.a2.unit29.lesson06.teach.turn02:
    title: اجازه و یک الزام
    gloss: نیما می‌گوید بله، و این‌که اول باید دوش بگیرد.
    note: جواب اجازه می‌دهد و بعد یک الزام اضافه می‌کند.
  fa.a2.unit29.lesson06.teach.turn03:
    title: ثنا می‌پرسد چه چیز لازم است
    gloss: ثنا می‌پرسد که آیا باید دستمال حمام بیاورد.
    note: '*باید* + *بیارم* دربارهٔ یک الزام می‌پرسد.'
  fa.a2.unit29.lesson06.teach.turn04:
    title: اختیاری و ممنوع
    gloss: نیما می‌گوید لازم نیست دستمال حمام بیاورد، اما در حوض شنا نباید بدود.
    note: '*لازم نیست* اختیاری است؛ *نباید* ممنوع است.'
  fa.a2.unit29.lesson06.teach.turn05:
    title: سؤال دوم
    gloss: ثنا می‌پرسد که بعد از آن می‌تواند به باشگاه ورزشی بیاید یا نه.
    note: '*می‌تونم* + فعل التزامی یعنی «آیا می‌توانم؟»'
  fa.a2.unit29.lesson06.teach.turn06:
    title: آخرین قانون
    gloss: نیما می‌گوید بله، اما باید بوت ورزشی بپوشد.
    note: 'باز هم: اول اجازه، بعد قانون.'
