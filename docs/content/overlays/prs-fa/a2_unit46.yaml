teaching:
  fa.a2.unit46.lesson01.teach.things:
    title: چیزهایی برای گپ زدن
    gloss: کتاب، تحفه، کیف
    note: '*یه* در گفتار یعنی «یک».'
    example_gloss:
    - من یک کتاب دارم.
    - من یک تحفه دارم.
    - من یک کیف دارم.
  fa.a2.unit46.lesson01.teach.verbs:
    title: فعل‌های گذشته
    gloss: خریدم، دیدم، خواندم، گرفتم، (نشانهٔ مفعول)
    note: '*رو* بعد از چیزی می‌آید که فعل بالایش اثر می‌کند. پایان‌های گذشته *-م* (من)، *-ی* (تو) و هیچ (او) استند.'
    example_gloss:
    - کتاب را خریدم.
    - تحفه را دیدم.
    - کتاب را خواندم.
    - کیف را گرفتم.
  fa.a2.unit46.lesson01.teach.clitic:
    title: فعل به‌علاوهٔ ش
    gloss: آن را خریدم، آن را دیدم، آن را خواندم، آن را گرفتم
    note: 'پایان *-ش* به چیز یا کسی اشاره می‌کند که پیشتر گفته شده: «آن»، «او». این پایان در آخر فعل می‌آید.'
    example_gloss:
    - دیروز آن را خریدم.
    - دیروز آن را دیدم.
    - دیروز آن را خواندم.
    - دیروز آن را گرفتم.
  fa.a2.unit46.lesson01.teach.you:
    title: پرسیدن «آن را دیدی؟»
    gloss: تو دیدی، آن را دیدی، تو گرفتی
    note: '*دیدی* یعنی «تو دیدی»؛ *-ش* را اضافه کنید، می‌شود «آن را دیدی».'
    example_gloss:
    - تحفه را دیدی؟
    - آن را کجا دیدی؟
    - کیف را گرفتی؟
  fa.a2.unit46.lesson01.teach.rule:
    title: یک بار بگویید، بعد ش را بیاورید
    gloss: کتاب را خریدم؛ آن را خریدم
    note: 'بار اول چیز را با *رو* نام بگیرید. بعد از آن اسم و *رو* را بیندازید و *-ش* را به فعل اضافه کنید: *کتاب رو خریدم*، بعد *خریدمش*.'
  fa.a2.unit46.lesson02.teach.people:
    title: آدم‌ها
    gloss: دوستم، دوستانم، بچه‌ها
    note: '*دوستم* یعنی «دوست من» و *دوستام* یعنی «دوستان من».'
    example_gloss:
    - دوستم را دیدم.
    - دوستانم را دیدم.
    - بچه‌ها را دیدم.
  fa.a2.unit46.lesson02.teach.them:
    title: گفتن «شان» و «تو»
    gloss: آن‌ها را دیدم، تو را دیدم
    note: پایان *-شون* یعنی «آن‌ها»؛ *-ت* یعنی «تو». هر دو مثل *-ش* به فعل اضافه می‌شوند.
    example_gloss:
    - دیروز آن‌ها را دیدم.
    - دیروز تو را دیدم.
  fa.a2.unit46.lesson02.teach.when:
    title: دیروز و کجا
    gloss: دیروز، کجا
    note: '*دیروز* یعنی «دیروز»؛ *کجا* یعنی «کجا».'
    example_gloss:
    - دیروز تو را دیدم.
    - آن را کجا دیدی؟
  fa.a2.unit46.lesson02.teach.three:
    title: سه پایان
    gloss: او / آن را دیدم؛ آن‌ها را دیدم؛ تو را دیدم
    note: '*-ش* یک نفر یا یک چیز است، *-شون* بیشتر از یکی است و *-ت* یعنی «تو». برای بیشتر از یک نفر یا چیز، *-شون* را به کار ببرید.'
  fa.a2.unit46.lesson03.teach.actions:
    title: دادن، پس دادن، قرض گرفتن
    gloss: دادم، پس، قرض گرفتم
    note: '*پس دادم* یعنی «واپس دادم»؛ *قرض گرفتم* یعنی «قرض گرفتم».'
    example_gloss:
    - کتاب را دادم.
    - کتاب را پس دادم.
    - کتاب را قرض گرفتم.
  fa.a2.unit46.lesson03.teach.fused:
    title: حرف اضافه به‌علاوهٔ ش
    gloss: به او، از او، برای او، با او
    note: 'در گفتار *به، از، برای، با* با ضمیر شخص یکجا می‌شوند: *بهش, ازش, براش, باهاش*. این‌ها به شخصی اشاره می‌کنند که پیشتر نامش گرفته شده است.'
    example_gloss:
    - کتاب را به او دادم.
    - آن را از او قرض گرفتم.
    - تحفه را برای او خریدم.
    - با او رفتم.
  fa.a2.unit46.lesson03.teach.me:
    title: به من، برای من
    gloss: به من، برای من
    note: با *-م* همین کلمه‌ها یعنی «به من» و «برای من».
    example_gloss:
    - او آن را به من داد.
    - او آن را برای من خرید.
  fa.a2.unit46.lesson03.teach.names:
    title: اول نام بردن از شخص
    gloss: نیما، سارا، رفتم
    note: 'اول شخص را نام ببر، بعد به او اشاره کن: *از نیما قرض گرفتم*، بعد *ازش*.'
    example_gloss:
    - از نیما قرض گرفتم.
    - با سارا رفتم.
  fa.a2.unit46.lesson03.teach.rule:
    title: ضمیرهای پیوسته بعد از حرف اضافه
    gloss: از نیما قرض گرفتم؛ از او قرض گرفتم
    note: به‌جای *از نیما* بگو *ازش*، به‌جای *با سارا* بگو *باهاش*، به‌جای *برای مینا* بگو *براش*. شخص از قبل معلوم است، پس نام لازم نیست.
  fa.a2.unit46.lesson04.teach.questions:
    title: پرسیدن درباره‌اش
    gloss: آن را خریدی؟، آن را خواندی؟، آن را گرفتی؟
    note: 'برای «تو» در گذشته اول پایان *-ی* می‌آید و بعد *-ش*: *خریدی* می‌شود *خریدیش*.'
    example_gloss:
    - تحفه را خریدی؟
    - دیروز آن را خریدی؟
    - دیروز آن را خواندی؟
    - دیروز آن را گرفتی؟
  fa.a2.unit46.lesson04.teach.negative:
    title: جواب منفی دادن
    gloss: آن را ندیدم، آن را نخریدم، آن را نخواندم، آن را نگرفتم
    note: '*ن* را پیش از فعل گذشته بگذار: *دیدم* می‌شود *ندیدم*، و *-ش* باز هم در آخر می‌آید: *ندیدمش*.'
    example_gloss:
    - دیروز آن را ندیدم.
    - دیروز آن را نخریدم.
    - دیروز آن را نخواندم.
    - دیروز آن را نگرفتم.
  fa.a2.unit46.lesson04.teach.answers:
    title: بله و نه
    gloss: بلی، نه
    note: '*آره* «بلی»ِ گفتاری است.'
    example_gloss:
    - بلی، دیدمش.
    - نه، ندیدمش.
  fa.a2.unit46.lesson04.teach.rule:
    title: جواب‌های کوتاه
    gloss: کتاب را خواندی؟ بلی، خواندمش. نه، نخواندمش.
    note: 'جواب کوتاه اسم نمی‌خواهد. فعل را با *-ش* تکرار کن: *آره، خوندمش* یا *نه، نخوندمش*.'
  fa.a2.unit46.lesson05.teach.words:
    title: واژه‌های متن
    gloss: روز تولد، بود، دکان، در، بعد، خوش، شد، هم، داد
    note: '*خوشحال شد* یعنی «خوش شد». *هم* یعنی «همچنان / نیز».'
    example_gloss:
    - دیروز روز تولد نیما بود.
    - در دکان یک کتاب دیدم.
    - بعد کتاب را به او دادم.
    - او بسیار خوش شد.
    - نیما هم یک کیف داد.
  fa.a2.unit46.lesson05.teach.reading:
    title: روز تولد نیما
    gloss: دیروز روز تولد نیما بود. در دکان یک کتاب دیدم و خریدمش. بعد کتاب را به او دادم. او بسیار خوش شد. نیما یک کیف هم به من داد.
    note: یک بار بخوان تا بفهمی چه اتفاق افتاد، بعد دوباره بخوان و ببین هر ش به چه اشاره می‌کند.
  fa.a2.unit46.lesson06.teach.turn01:
    title: سارا درباره کتاب می‌پرسد
    gloss: 'سارا: نیما، کتاب را خواندی؟'
    note: اسم *کتاب* یک بار با *رو* می‌آید.
  fa.a2.unit46.lesson06.teach.turn02:
    title: نیما جواب می‌دهد
    gloss: 'نیما: بلی، خواندمش. بسیار خوب بود.'
    note: '*خوندمش* به کتاب برمی‌گردد.'
  fa.a2.unit46.lesson06.teach.turn03:
    title: سارا درباره تحفه می‌پرسد
    gloss: 'سارا: تحفه را برای مینا خریدی؟'
    note: '*مینا* یک نام است؛ تحفه یک بار نام برده می‌شود.'
  fa.a2.unit46.lesson06.teach.turn04:
    title: نیما جواب می‌دهد
    gloss: 'نیما: بلی، خریدمش و دیروز به او دادم.'
    note: '*خریدمش* به تحفه برمی‌گردد و *بهش* به مینا.'
  fa.a2.unit46.lesson06.teach.turn05:
    title: سارا درباره مینا می‌پرسد
    gloss: 'سارا: خوش شد؟'
    note: فاعل از گفتگو معلوم است.
  fa.a2.unit46.lesson06.teach.turn06:
    title: نیما جواب می‌دهد
    gloss: 'نیما: بلی، بسیار خوش شد.'
    note: یک جواب کوتاه و طبیعی.
