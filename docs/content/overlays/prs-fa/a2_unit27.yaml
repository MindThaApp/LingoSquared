  fa.a2.unit27.lesson01.exercise04.order_tomorrow_class:
    instruction: 'کلمه‌ها را طوری ترتیب کنید که معنایش این باشد: فردا صنف را شروع می‌کنم.'
    accepted_answers:
    - value:
      - فردا
      - کلاس
      - شروع
      - می‌کنم
      status: correct
