teaching:
  fa.a2.unit27.lesson01.teach.time_words:
    title: کلمه‌های زمان برای پلان‌ها
    gloss: فردا، رخصتی آخر هفته، هفتهٔ آینده، ماه آینده، سال آینده، امروز، حالا
    note: '*هفته‌ی بعد*، *ماه دیگه* و *سال دیگه* شکل‌های روزمره برای «هفتهٔ آینده / ماه آینده / سال آینده» اند. *آخر هفته* یعنی «رخصتی آخر هفته»؛ از متن معلوم می‌شود که کدام آخر هفته است.'
    example_gloss:
    - فردا صنف دارم.
    - ماه آینده سفر می‌کنم.
    - سال آینده خانهٔ نو خواهم داشت.
  fa.a2.unit27.lesson01.teach.course_house:
    title: دوره‌ها و تبدیل کردن خانه
    gloss: دوره، صنف، زبان، ثبت‌نام، خانه، بکس
    note: '*ثبت‌نام* یعنی «راجستر شدن / نام نوشتن». این کلمه‌ها را برای دورهٔ زبان سارا و تبدیل کردن خانهٔ نیما به کار می‌بری.'
    example_gloss:
    - من یک دورهٔ زبان دارم.
    - من صنف زبان دارم.
    - من بکس دارم.
  fa.a2.unit27.lesson01.teach.plan_verbs:
    title: فعل‌های پلان
    gloss: می‌روم، شروع می‌کنم، ثبت‌نام می‌کنم، خانه عوض می‌کنم، بکس می‌خرم
    note: '*خونه عوض کردن* شکل گفتاری برای «کوچ کردن به خانهٔ دیگر» است (لفظ به لفظ «عوض کردن خانه»).'
    example_gloss:
    - فردا به صنف می‌روم.
    - هفتهٔ آینده صنف را شروع می‌کنم.
    - فردا ثبت‌نام می‌کنم.
    - ماه آینده خانه‌ام را عوض می‌کنم.
    - فردا بکس می‌خرم.
  fa.a2.unit27.lesson01.teach.things_to_buy:
    title: چیزهایی که می‌خریم
    gloss: قالین، پرده، کیک
    note: این اسم‌های روزمره را وقتی دربارهٔ کارهای بیرون و چیزهایی که می‌خواهی بخری صحبت می‌کنی به کار ببر.
    example_gloss:
    - فردا قالین می‌خرم.
    - فردا پرده می‌خرم.
    - فردا کیک می‌خرم.
  fa.a2.unit27.lesson01.teach.places_and_events:
    title: جاها و محفل‌ها
    gloss: رستورانت، کافه، مهمانی
    note: '*مهمونی* شکل معمول گفتاری «مهمانی» است.'
    example_gloss:
    - فردا به رستورانت می‌روم.
    - فردا به کافه می‌روم.
    - آخر هفته مهمانی دارم.
  fa.a2.unit27.lesson01.teach.present_for_future:
    title: زمان حال می‌تواند پلان را برساند
    gloss: فردا می‌روم؛ هفتهٔ آینده شروع می‌کنم
    note: در فارسی گفتاری برای پلان از حال معمولی (*می‌رم*، *شروع می‌کنم*) کار گرفته می‌شود. کلمهٔ زمان مثل *فردا* یا *هفته‌ی بعد* نشان می‌دهد که کار در آینده است. در صحبت روزمره فعل آیندهٔ جداگانه وجود ندارد.
  fa.a2.unit27.lesson02.teach.i_want:
    title: من می‌خواهم، تو می‌خواهی
    gloss: می‌خواهم، می‌خواهی، یک
    note: '*یه* شکل گفتاری معمول «یک» است. *تو چی می‌خوای؟* یعنی «تو چه می‌خواهی؟»'
    example_gloss:
    - می‌خواهم یک خانه بخرم.
    - تو چه می‌خواهی؟
  fa.a2.unit27.lesson02.teach.short_verbs:
    title: شکل‌های کوتاه فعل
    gloss: رفتن، خریدن، شروع کردن، ثبت‌نام کردن، پیدا کردن، یاد گرفتن
    note: 'این‌ها شکل‌های کوتاه فعل اند که بعد از *می‌خوام* می‌آیند. در فعل‌های دوبخشی، بخش دوم تغییر می‌کند: *شروع کنم*، *ثبت‌نام کنم*، *پیدا کنم*.'
    example_gloss:
    - می‌خواهم به صنف بروم.
    - می‌خواهم بکس بخرم.
    - می‌خواهم یک خانه پیدا کنم.
    - می‌خواهم یک زبان یاد بگیرم.
  fa.a2.unit27.lesson02.teach.want_plus_short:
    title: می‌خوام + فعل کوتاه
    gloss: می‌خواهم بروم؛ می‌خواهم بخرم؛ می‌خواهم شروع کنم
    note: 'برای گفتن اینکه چه می‌خواهی یا قصد داری انجام بدهی، *می‌خوام* را با یک فعل کوتاه به کار ببر. فعل دوم *می‌* ندارد: بگو *می‌خوام برم*، نه *می‌خوام می‌رم*. ختم فعل دوم با شخصی که می‌خواهد مطابقت می‌کند.'
  fa.a2.unit27.lesson02.teach.person_endings:
    title: فعل دوم از شخص پیروی می‌کند
    gloss: می‌خواهم بروم؛ می‌خواهی بروی؛ او می‌خواهد برود
    note: 'فعل کوتاه با شخص تغییر می‌کند: *برم* (من)، *بری* (تو)، *بره* (او). همین الگو با *بخرم / بخری / بخره* هم کار می‌کند. در این درس بیشتر شکل‌های *من* را می‌سازی.'
  fa.a2.unit27.lesson03.teach.habit_words:
    title: کلمه‌های عادت
    gloss: هر روز، هر هفته، همیشه، معمولاً
    note: این کلمه‌ها عادتِ تکرار شونده را نشان می‌دهند. فعل همان حال است که در پلان هم می‌آید؛ کلمهٔ زمان معلوم می‌کند که معنی کدام است.
    example_gloss:
    - من هر روز به صنف می‌روم.
    - من همیشه به صنف می‌روم.
    - من معمولاً در خانه می‌مانم.
    - من هر هفته دو روز صنف دارم.
  fa.a2.unit27.lesson03.teach.habit_vs_plan:
    title: یک فعل، کلمهٔ زمان متفاوت
    gloss: هر روز می‌روم؛ فردا می‌روم
    note: '*می‌رم* می‌تواند عادت یا پلان باشد. *هر روز* و *همیشه* آن را عادت می‌سازند؛ *فردا*، *هفته‌ی بعد* و *ماه دیگه* آن را پلان می‌سازند. همیشه اول به کلمهٔ زمان نگاه کن.'
  fa.a2.unit27.lesson03.teach.plan_vs_want:
    title: پلان یا قصد؟
    gloss: فردا می‌روم؛ می‌خواهم بروم
    note: '*فردا می‌رم* با کلمهٔ زمان یک پلان را اعلام می‌کند. *می‌خوام برم* آنچه را که می‌خواهی یا قصد داری می‌گوید و به کلمهٔ زمان ضرورت ندارد. یادت باشد: بعد از *می‌خوام* فعل دوم *می‌* را از دست می‌دهد.'
  fa.a2.unit27.lesson03.teach.decided:
    title: تصمیم گرفتن، قصد داشتن
    gloss: تصمیم گرفتم، قصد دارم
    note: '*تصمیم گرفتم* و *قصد دارم* دو راه دیگر برای گفتن از یک قصد اند. بعد از هر دو یک شکل کوتاه فعل می‌آید.'
    example_gloss:
    - تصمیم گرفتم خانه‌ام را عوض کنم.
    - قصد دارم یک زبان یاد بگیرم.
  fa.a2.unit27.lesson03.teach.decided_plus_short:
    title: تصمیم گرفتم + فعل کوتاه
    gloss: تصمیم گرفتم بروم؛ تصمیم گرفتم شروع کنم
    note: '*گرفتم* گذشته است چون تصمیم گرفتن تمام شده، اما فعل بعد از آن شکل کوتاه است (*برم*، *شروع کنم*) چون آن کار هنوز در پیش است. به آن *می‌* نگذار.'
  fa.a2.unit27.lesson04.teach.plan_questions:
    title: پرسیدن دربارهٔ پلان‌ها
    gloss: فردا چه کار می‌کنی؟ می‌خواهی چه کار کنی؟ و تو؟
    note: دربارهٔ پلان با زمان حال و یک کلمهٔ زمان بپرس. دربارهٔ قصد با *می‌خوای ... کنی؟* بپرس.
    example_gloss:
    - آخر هفته چه کار می‌کنی؟
    - سال آینده می‌خواهی چه کار کنی؟
    - من صنف را شروع می‌کنم؛ و تو؟
  fa.a2.unit27.lesson04.teach.answer_mirrors_question:
    title: جواب مثل سؤال ساخته می‌شود
    gloss: تو می‌کنی ← من می‌کنم؛ تو می‌خواهی بکنی ← من می‌خواهم بکنم
    note: 'به سؤال پلانِ حال با حال و همان کلمهٔ زمان جواب بده: *فردا جعبه می‌خرم*. به سؤال قصد با *می‌خوام* و یک فعل کوتاه جواب بده که ختمش از «تو» به «من» تغییر می‌کند: *می‌خوای چیکار کنی؟* می‌شود *می‌خوام ... کنم*.'
  fa.a2.unit27.lesson05.teach.reading_words:
    title: کلمه‌ها برای یک پیام
    gloss: سلام، کار، نمی‌روم، سفر
    note: '*نمی‌رم* منفی *می‌رم* است: «نمی‌روم». *برم سفر* یعنی «به سفر بروم».'
    example_gloss:
    - سلام سارا!
    - من هر روز به کار می‌روم.
    - فردا به صنف نمی‌روم.
    - سال آینده به سفر می‌روم.
  fa.a2.unit27.lesson05.teach.reading:
    title: پیامی از نیما
    gloss: سلام سارا! من هر روز به کار می‌روم، ولی فردا نمی‌روم. فردا بکس می‌خرم. ماه آینده خانه‌ام را عوض می‌کنم. تصمیم گرفتم سال آینده به سفر بروم.
    note: یک بار بخوان و عادت، پلان‌های نزدیک و قصد بعدی را پیدا کن.
  fa.a2.unit27.lesson06.teach.nice:
    title: چه خبر خوب!
    gloss: چه خوب
    note: '*چه خوب!* واکنش دوستانه به پلان‌های کسی است.'
    example_gloss:
    - چه خوب! فردا ثبت‌نام می‌کنی؟
  fa.a2.unit27.lesson06.teach.turn01:
    title: سارا دربارهٔ فردا می‌پرسد
    gloss: 'سارا از نیما می‌پرسد: فردا چه کار می‌کنی؟'
    note: سؤال با زمان حال و یک کلمهٔ زمان ساخته شده است.
  fa.a2.unit27.lesson06.teach.turn02:
    title: نیما دو پلان می‌گوید
    gloss: 'نیما: فردا بکس می‌خرم. ماه آینده خانه‌ام را عوض می‌کنم. و تو؟'
    note: دو پلان با دو کلمهٔ زمان.
  fa.a2.unit27.lesson06.teach.turn03:
    title: سارا پلان‌هایش را می‌گوید
    gloss: 'سارا: فردا ثبت‌نام می‌کنم. هفتهٔ آینده صنف زبان را شروع می‌کنم.'
    note: '*من* در اینجا برای جواب دادن به *تو چی؟* گفته شده است.'
  fa.a2.unit27.lesson06.teach.turn04:
    title: نیما دربارهٔ قصدها می‌پرسد
    gloss: 'نیما: چه خوب! سال آینده می‌خواهی چه کار کنی؟'
    note: در این سوال *می‌خوای ... کنی؟* استفاده شده است.
  fa.a2.unit27.lesson06.teach.turn05:
    title: سارا تصمیمش را می‌گوید
    gloss: 'سارا: تصمیم گرفتم زبان یاد بگیرم. تو چطور؟'
    note: بعد از *تصمیم گرفتم* شکل کوتاه فعل می‌آید.
  fa.a2.unit27.lesson06.teach.turn06:
    title: نیما قصدش را می‌گوید
    gloss: 'نیما: می‌خواهم به سفر بروم.'
    note: '*می‌خوام برم* قصد را بیان می‌کند.'
exercises:
  fa.a2.unit27.lesson01.exercise01.recognize_next_week:
    instruction: این جمله دربارهٔ پلان گوینده چه می‌گوید؟
    correct_option: هفتهٔ آینده یک صنف را شروع می‌کنم.
    distractors:
    - هفتهٔ گذشته یک صنف را شروع کردم.
    - هر هفته یک صنف را شروع می‌کنم.
    - نمی‌خواهم صنف را شروع کنم.
    accepted_answers:
    - value: هفتهٔ آینده یک صنف را شروع می‌کنم.
      status: correct
    feedback: '*هفته‌ی بعد* فعل حال را به آینده تبدیل می‌کند: هفتهٔ آینده شروع می‌کنم.'
  fa.a2.unit27.lesson01.exercise02.recognize_next_month:
    instruction: این جمله چه معنا دارد؟
    correct_option: ماه آینده خانه‌ام را عوض می‌کنم.
    distractors:
    - هر ماه خانه‌ام را عوض می‌کنم.
    - ماه گذشته خانه‌ام را عوض کردم.
    - فردا خانه‌ام را عوض می‌کنم.
    accepted_answers:
    - value: ماه آینده خانه‌ام را عوض می‌کنم.
      status: correct
    feedback: '*ماه دیگه* یعنی «ماه آینده» و *خونه عوض می‌کنم* یعنی «خانه‌ام را عوض می‌کنم».'
