      - کلاس
      - فردا
      - شروع
      - می‌کنم
      status: correct
    feedback: در *فردا کلاس شروع می‌کنم* کلمهٔ زمان اول می‌آید.
  fa.a2.unit27.lesson01.exercise05.fill_register:
    instruction: شکل حالی را کامل کنید که معنایش «هفتهٔ آینده ثبت‌نام می‌کنم» باشد.
    accepted_answers:
    - value: می‌کنم
      status: correct
    feedback: 'جملهٔ کامل این است: *هفته‌ی بعد ثبت‌نام می‌کنم*.'
  fa.a2.unit27.lesson01.exercise06.translate_tomorrow_class:
    instruction: 'با فردا و زمان حال ترجمه کنید: فردا به صنف می‌روم.'
    accepted_answers:
    - value: فردا می‌رم کلاس
      status: correct
    - value: فردا به کلاس می‌رم
      status: correct
