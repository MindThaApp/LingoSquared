teaching:
  fa.a1.unit36.lesson01.teach.mehrabun:
    title: مهربان
    gloss: مهربان / خوش‌برخورد
    note: '*مهربون* کسی را توصیف می‌کند که مهربان و دل‌نرم است.'
    example_gloss: سارا خیلی مهربان است.
  fa.a1.unit36.lesson01.teach.bamaze:
    title: خنده‌دار
    gloss: خنده‌دار
    note: '*بامزه* کسی را توصیف می‌کند که بامزه و خنده‌دار است.'
    example_gloss: نیما بامزه است.
  fa.a1.unit36.lesson01.teach.khejalati:
    title: شرمگین
    gloss: شرمگین
    note: '*خجالتی* کسی را توصیف می‌کند که شرمگین است.'
    example_gloss: او یک کم شرمگین است.
  fa.a1.unit36.lesson01.teach.jeddi:
    title: جدی
    gloss: جدی
    note: '*جدی* کسی را توصیف می‌کند که جدی است.'
    example_gloss: معلم ما جدی است.
  fa.a1.unit36.lesson01.teach.review_copula_fusion:
    title: چه‌گونه «است» به واژه‌های شخصیت وصل می‌شود
    gloss: او مهربان / بامزه / شرمگین است
    note: '*مهربونه* مستقیم از *مهربون* + *است* ساخته شده، چون *مهربون* به یک صامت ختم می‌شود. *بامزه‌ست* پیش از *ست* یک نیم‌فاصله دارد، چون *بامزه* از قبل به مصوت *ه* ختم شده است. *خجالتیه* حرف *ه* را مستقیم به کلمهٔ ختم‌شده به *ی* وصل می‌کند، درست مثل *قهوه‌ایه* در بخش ظاهر.'
    target_text: مهربونه = مهربون + است (فعل «است» به شکل وصل‌شده، بعد از حرف بی‌صدا) / بامزه‌ست = بامزه + است (بعد از حرف صدادار، با نیم‌فاصله) / خجالتیه = خجالتی + ه (که به «ی» ختم می‌شود)
  fa.a1.unit36.lesson02.teach.zerang:
    title: باهوش
    gloss: باهوش / زرنگ
    note: '*زرنگ* کسی را توصیف می‌کند که باهوش و زرنگ است، به‌خصوص در پیدا کردن راه‌حل‌های عملی.'
    example_gloss: مریم خیلی باهوش است.
  fa.a1.unit36.lesson02.teach.tanbal:
    title: تنبل
    gloss: تنبل
    note: '*تنبل* کسی را توصیف می‌کند که کار کردن را دوست ندارد و سستی می‌کند.'
    example_gloss: امروز یک کم تنبل استم.
  fa.a1.unit36.lesson02.teach.zahmatkesh:
    title: محنتی
    gloss: محنتی
    note: '*زحمت‌کش* کسی را توصیف می‌کند که زیاد کار می‌کند و تلاش واقعی دارد.'
    example_gloss: پدرم خیلی محنتی است.
  fa.a1.unit36.lesson02.teach.sabur:
    title: صبور
    gloss: صبور
    note: '*صبور* کسی را توصیف می‌کند که صبر و حوصله دارد.'
    example_gloss: استاد ما خیلی با حوصله است.
  fa.a1.unit36.lesson02.teach.review_negation:
    title: منفی کردن صفت شخصیتی
    gloss: او تنبل نیست
    note: '*نیست* فعل ربط پیوسته را منفی می‌کند: *تنبل نیست* یعنی «او تنبل نیست»؛ همان *نیست* که پیش‌تر برای منفی کردن احساسات یاد گرفتید.'
    target_text: تنبل نیست (او تنبل نیست)
  fa.a1.unit36.lesson03.teach.shakhsiat_word:
    title: شخصیت
    gloss: شخصیت
    note: '*شخصیت* یعنی خصوصیات و خُلق و خوی یک فرد.'
    example_gloss: شخصیتش خیلی خوب است.
  fa.a1.unit36.lesson03.teach.ask_shakhsiat:
    title: شخصیتش چطور است؟
    gloss: شخصیتش چطور است؟
    note: '*چطوره؟* («چطور است؟») را پیش‌تر در بخش سلام و احوال‌پرسی یاد گرفتید؛ *ش* ضمیر ملکی «او» است که به *شخصیت* می‌چسبد.'
  fa.a1.unit36.lesson03.teach.answer_mehrabun_zerang:
    title: او خیلی مهربان و باهوش است
    gloss: او خیلی مهربان و باهوش است
    note: '*و* دو صفت شخصیتی را به هم وصل می‌کند.'
  fa.a1.unit36.lesson03.teach.che_joriye:
    title: او چطور آدمی است؟
    gloss: او چطور آدمی است؟
    note: '*چه جوریه؟* راه عامیانهٔ پرسیدن دربارهٔ شخصیت کسی است و جایگزین *شخصیتش چطوره؟* می‌شود.'
  fa.a1.unit36.lesson03.teach.review_shakhsiat_words:
    title: شخصیت / چطور است؟ / چگونه است؟
    gloss: شخصیت / چطور است؟ / چه‌گونه است؟
    note: با این سه عبارت می‌توانید دربارهٔ شخصیت کسی بپرسید و آن را بیان کنید.
    target_text: شخصیت (خصلت و شخصیت) / چطوره؟ (چطور است؟) / چه جوریه؟ (چه‌گونه است؟)
  fa.a1.unit36.lesson04.teach.review_dialogue_words:
    title: نیما / سارا / مریم / اصلاً / فقط / خوب
    gloss: نیما / سارا / مریم / اصلاً / فقط / خوب
    note: '*مریم* دوست *سارا* است و پیش‌تر در بخش ظاهر معرفی شده بود. *اصلاً* یعنی «هرگز، به هیچ‌وجه». *فقط* یعنی «تنها». *باحال* یعنی «خوب و جالب».'
  fa.a1.unit36.lesson04.teach.get_to_know:
    title: دوست دارم بیشتر با او آشنا شوم
    gloss: دوست دارم بیشتر با او آشنا شوم
    note: '*بیشتر* یعنی «زیادتر». *باهاش* یعنی «با او». *آشنا بشم* یعنی «آشنا شوم».'
  fa.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'نیما: سارا، مریم چطور آدمی است؟'
    gloss: سارا، مریم چطور آدمی است؟
  fa.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'سارا: خیلی مهربان و باهوش است.'
    gloss: خیلی مهربان و باهوش است.
  fa.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'نیما: تنبل نیست؟'
    gloss: تنبل نیست؟
  fa.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'سارا: نه، اصلاً؛ خیلی هم محنتی است. فقط یک کم شرمگین است.'
    gloss: نه، اصلاً؛ خیلی هم محنتی است. فقط یک کم شرمگین است.
  fa.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'نیما: خوب است، دوست دارم بیشتر با او آشنا شوم.'
    gloss: خوب است، دوست دارم بیشتر با او آشنا شوم.
  fa.a1.unit36.lesson05.teach.reading_text:
    title: 'خواندنی: شخصیت مریم'
    gloss: مریم دوست سارا است. او خیلی مهربان و باهوش است. در کارش هم محنتی است و هیچ‌وقت تنبل نیست. فقط یک کم شرمگین است، به همین خاطر در جمع‌های بزرگ زیاد حرف نمی‌زند.
    note: در این متن شخصیت مریم با ضمیر سوم شخص توصیف شده و صفت‌ها همان‌هایی است که در گفت‌وگو آمد.
  fa.a1.unit36.lesson05.teach.reading_note:
    title: هرگز (با فعل منفی)
    gloss: هرگز
    note: '*هیچ‌وقت* با فعل منفی (*نیست*، *نمی‌زنه*) می‌آید و معنایش «هرگز» است؛ در دری هم همین‌طور است: «هیچ‌وقت نمی‌گوید».'
  fa.a1.unit36.lesson06.teach.self_description:
    title: فکر می‌کنم خیلی محنتی استم، ولی یک کم تنبل هم استم
    gloss: فکر می‌کنم خیلی محنتی استم، ولی یک کم تنبل هم استم
    note: '*فکر می‌کنم* یعنی «گمان دارم». *زحمت‌کشم* از پیوست *زحمت‌کش* + *هستم* («استم») ساخته شده. *هستم* شکل کامل و جدا از هم است که اینجا بعد از *هم* («نیز») برای تأکید می‌آید.'
  fa.a1.unit36.lesson06.teach.friend_request:
    title: شخصیتت چطور است؟
    gloss: شخصیتت چطور است؟
    note: '*شخصیتت* پسوند ملکی غیررسمی *ت* («تو» یا «از تو») را به *شخصیت* وصل می‌کند و شکل مخصوص *تو* برای *شخصیتش* است.'
  fa.a1.unit36.lesson06.teach.review_trait_words:
    title: مهربان / بامزه / شرمگین / جدی / باهوش / تنبل / محنتی / با حوصله
    gloss: مهربان / بامزه / شرمگین / جدی / باهوش / تنبل / محنتی / با حوصله
    note: این‌ها هشت واژهٔ اصلی شخصیت در این بخش اند.
