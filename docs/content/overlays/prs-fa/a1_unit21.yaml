    gloss: لطفاً تبدیل کنید
    note: لطفاً تبدیل کنید شکل مؤدبانهٔ امری فعل تبدیل کردن است.
  fa.a1.unit21.lesson06.teach.turn01:
    title: سارا می‌خواهد پول تبدیل کند
    gloss: سارا به کارمند سلام می‌کند و می‌گوید که می‌خواهد دالر را به تومان تبدیل کند.
    note: جملهٔ می‌خوام دلار به تومن تبدیل کنم از درس دوم دوباره به کار رفته است.
  fa.a1.unit21.lesson06.teach.turn02:
    title: کارمند می‌پرسد چند دالر دارد
    gloss: کارمند به سارا سلام می‌کند و می‌پرسد که چند دالر دارد.
    note: جملهٔ چقدر دلار دارید؟ از درس دوم دوباره به کار رفته است.
  fa.a1.unit21.lesson06.teach.turn03:
    title: سارا مقدار را می‌گوید و نرخ را می‌پرسد
    gloss: سارا می‌گوید صد دالر دارد و نرخ امروز را می‌پرسد.
    note: صد (۱۰۰) تازه است؛ نرخ امروز چنده؟ پرسش نرخ از درس پنجم است که دوباره آمده است.
  fa.a1.unit21.lesson06.teach.turn04:
    title: کارمند نرخ را می‌گوید
    gloss: کارمند می‌گوید هر دالر سی تومان است.
    note: جملهٔ هر دلار سی تومنه از درس پنجم دوباره به کار رفته است.
  fa.a1.unit21.lesson06.teach.turn05:
    title: سارا موافقت می‌کند و از کارمند می‌خواهد ادامه بدهد
    gloss: سارا موافقت می‌کند و از کارمند می‌خواهد که لطفاً تبدیل کند.
    note: لطفاً تبدیل کنید، که در همین درس آموخته شد.
  fa.a1.unit21.lesson06.teach.turn06:
    title: کارمند مجموع را می‌دهد
    gloss: بفرمایید، سه هزار تومان.
    note: '*سه هزار تومن* = ۱۰۰ دالر × ۳۰ تومان برای هر دالر. *هزار* (هزار) از درس اعداد مرور می‌شود.'
  fa.a1.unit21.lesson06.teach.turn07:
    title: سارا از کارمند تشکر می‌کند و پول خورد هم می‌خواهد
    gloss: تشکر. پول خورد هم دارید؟
    note: جملهٔ پول خرد دارید؟ از درس چهارم با هم (هم، نیز) دوباره به کار رفته است.
  fa.a1.unit21.lesson06.teach.turn08:
    title: کارمند تأیید می‌کند و پول را می‌دهد
    gloss: بلی، بفرمایید.
    note: بله (بلی) کلمهٔ مرورشده است؛ بفرمایید معامله را تمام می‌کند.
