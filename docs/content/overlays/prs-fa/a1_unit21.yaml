    title: بگویید که می‌خواهید پول تبدیل کنید
    gloss: می‌خواهم دالر را به تومان تبدیل کنم.
    note: می‌خوام دلار به تومن تبدیل کنم از به (به) برای نشان دادن واحد پولیِ مقصد استفاده می‌کند.
  fa.a1.unit21.lesson02.teach.how_much_dollar:
    title: بپرسید چند دالر دارید
    gloss: چند دالر دارید؟
    note: '*چقدر دلار دارید؟* از *چقدر* (چند/چقدر) استفاده می‌کند، کلمه‌ای که در پرسش‌های مقدار قبلی دیده‌اید.'
  fa.a1.unit21.lesson03.teach.atm_word:
    title: ای‌تی‌ام
    gloss: ای‌تی‌ام
    note: خودپرداز در اصل به معنای «خودخدمت/خودپرداز» است و کلمهٔ معمول برای دستگاه ای‌تی‌ام می‌باشد.
    example_gloss: ای‌تی‌ام آنجاست.
  fa.a1.unit21.lesson03.teach.withdraw_phrase:
    title: بگویید که می‌خواهید پول بکشید
    gloss: می‌خواهم از ای‌تی‌ام پول بکشم.
    note: می‌خوام از خودپرداز پول بردارم از از (از) و بردارم (برمی‌دارم/بیرون می‌کشم) استفاده می‌کند.
  fa.a1.unit21.lesson04.teach.change_question:
    title: پول خورد بخواهید
    gloss: پول خورد دارید؟
    note: پول خرد دارید؟ بعد از پول (پول)، کلمهٔ خرد (خورد/ریزه) را به کار می‌برد.
  fa.a1.unit21.lesson04.teach.here_you_are:
    title: بفرمایید (مرور)
    gloss: بفرمایید
    note: '*بفرمایید* در یک درس قبلی معرفی شده بود؛ اینجا هنگام دادن چیزی به کسی به کار می‌رود.'
  fa.a1.unit21.lesson05.teach.rate_word:
