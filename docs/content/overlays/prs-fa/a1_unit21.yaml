    note: نرخ کلمه‌ای برای نرخ (تبدیل پول) است.
    example_gloss: نرخ امروز چند است؟
  fa.a1.unit21.lesson05.teach.per_dollar_rate:
    title: نرخ هر دالر را بگویید
    gloss: هر دالر سی تومان است.
    note: هر دلار سی تومنه از هر (هر) و شکل کوتاه گفتاری -e (*تومنه* = *تومن است*) استفاده می‌کند که قبلاً با آن آشنا شده‌اید.
  fa.a1.unit21.lesson06.teach.hundred_word:
    title: صد
    gloss: صد
    note: صد عدد ۱۰۰ است.
    example_gloss: صد دالر دارم.
  fa.a1.unit21.lesson06.teach.please_do:
