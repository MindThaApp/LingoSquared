  fa.a1.unit21.lesson01.teach.dollar_word:
    title: دالر
    gloss: دالر
    note: دلار کلمه‌ای برای دالر (امریکایی) است، رایج‌ترین پول خارجی که در گفت‌وگوهای روزمرهٔ تبدیل پول از آن یاد می‌شود.
    example_gloss: من دالر دارم.
  fa.a1.unit21.lesson01.teach.exchange_word:
    title: تبدیل
    gloss: تبدیل
    note: تبدیل یعنی عوض کردن، و با کردن به شکل تبدیل کردن به کار می‌رود.
    example_gloss: می‌خواهم (پول) تبدیل کنم.
  fa.a1.unit21.lesson01.teach.va_word:
    title: و
    gloss: و
    note: و حرف ربط عمومی است و از درس‌های پیشین مرور می‌شود.
    target_text: و
