    title: نگار نظرش را می‌گوید
    gloss: نگار می‌گوید به نظر او کار از راه دور بهتر است.
    note: الگوی *به نظر من ... بهتره* درس دوم دوباره استفاده شده.
  fa.a2.unit10.lesson04.teach.turn02:
    title: آرش مخالفت می‌کند
    gloss: آرش می‌گوید موافق نیست.
    note: '*من موافق نیستم* از اول همین درس.'
  fa.a2.unit10.lesson04.teach.turn03:
    title: نگار می‌پرسد چرا
    gloss: نگار می‌پرسد چرا.
    note: '*چرا؟* کلمهٔ روزمره برای «چرا؟» است.'
  fa.a2.unit10.lesson04.teach.turn04:
    title: آرش دلیل‌هایش را می‌گوید
    gloss: آرش می‌گوید در خانه تمرکز کرده نمی‌تواند و دوست دارد همکارانش را ببیند.
    note: دو دلیل که با *و* وصل شده‌اند.
  fa.a2.unit10.lesson04.teach.turn05:
    title: نگار قبول می‌کند اما دلیلش را دوباره می‌گوید
    gloss: نگار می‌گوید باشد، اما به نظر او ترافیک وقت زیادی می‌گیرد.
    note: '*باشه، ولی...* یک نکته را مودبانه قبول می‌کند، پیش از آن‌که نظر خودت را دوباره بگویی.'
  fa.a2.unit10.lesson04.teach.turn06:
    title: آرش موافقت می‌کند اما توضیح می‌دهد
    gloss: آرش می‌گوید درست است، اما او عادت دارد.
    note: '*درسته، ولی...* حرف طرف مقابل را قبول می‌کند.'
