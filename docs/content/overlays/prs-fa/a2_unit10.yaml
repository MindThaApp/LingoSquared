  fa.a2.unit10.lesson03.teach.message_text:
    title: یک پیام نوشته‌شده که نظر می‌دهد
    gloss: به نظر من، کار از راه دور خیلی بهتر است، چون در ترافیک تهران وقت زیادی ضایع می‌شود و می‌توانم بیشتر پیش خانواده‌ام باشم.
    note: یک نظر کوتاه نوشته‌شده با دو دلیل که با *و* وصل شده‌اند، به سبک راحت گفتاری که مردم در پیام به همکاران استفاده می‌کنند.
