teaching:
  fa.a2.unit31.lesson01.teach.polite_words:
    title: واژه‌های آغازین مودبانه
    gloss: سلام، ببخشید، آیا ممکن است، لطفاً، تشکر
    note: '*ببخشید* برای جلب توجه مودبانه است و *لطفا* یعنی «لطفاً». *می‌شه* در اصل می‌پرسد «ممکن است؟»'
    example_gloss:
    - سلام، ببخشید.
    - تشکر، لطفاً.
  fa.a2.unit31.lesson01.teach.things:
    title: چیزهایی که می‌خواهید
    gloss: دروازه، کلکین، آب، گیلاس، نان، (نشانهٔ مفعول)، یک
    note: '*رو* مفعول معین را در گفتار نشان می‌دهد: *در رو*، *پنجره رو*. *یه* همان «یک» گفتاری است.'
    example_gloss:
    - یک گیلاس آب.
    - یک نان.
    - دروازه و کلکین.
  fa.a2.unit31.lesson01.teach.request_verbs:
    title: فعل‌های درخواست مودبانه
    gloss: ببندید، باز کنید، بیاورید، بدهید، کمک کنید
    note: این‌ها شکل‌های جمع مودبانه با پایان *-ید* استند. با همسایه، دکاندار و دیگر ناآشنایان از همین شکل‌ها کار می‌گیرید.
    example_gloss:
    - دروازه را ببندید.
    - کلکین را باز کنید.
    - یک گیلاس آب بیاورید.
    - به من کمک کنید.
  fa.a2.unit31.lesson01.teach.mishe_subjunctive:
    title: می‌شه + التزامی
    gloss: دروازه را بسته کرده می‌توانید؟ به من کمک کرده می‌توانید؟
    note: 'برای درخواست مودبانه، *می‌شه* بگویید و بعد فعل التزامی با *ب-*: *می‌شه در رو ببندید؟* در فعل مرکب جزء کمکی تغییر می‌کند: *می‌شه کمکم کنید؟*، *می‌شه پنجره رو باز کنید؟* مفعول پیش از فعل می‌آید.'
  fa.a2.unit31.lesson02.teach.offer_words:
    title: پیشنهاد کمک
    gloss: کمک می‌خواهید؟ بگذارید من ...
    note: '*کمک می‌خواید؟* می‌پرسد که آیا کسی کمک می‌خواهد. *بذارید من ...* یعنی «بگذارید من ...» و بعد از آن فعلی با شکل *من* می‌آید: *بیارم*، *بخرم*، *ببندم*، *کنم*.'
    example_gloss:
    - کمک می‌خواهید؟
    - بگذارید من آب بیاورم.
    - بگذارید من نان بخرم.
    - بگذارید من دروازه را ببندم.
    - بگذارید کمکتان کنم.
    - نان خریده می‌توانید؟
  fa.a2.unit31.lesson02.teach.reply_words:
    title: قبول کردن و رد کردن
    gloss: بلی، نه، حتماً، خودم، انجام می‌دهم، خواهش می‌کنم
    note: '*بله، لطفا* پیشنهاد را قبول می‌کند. *نه، ممنون* آن را رد می‌کند و *خودم انجام می‌دم* یعنی «خودم انجام می‌دهم». *خواهش می‌کنم* جواب تشکر است.'
    example_gloss:
    - بلی، لطفاً.
    - نه، تشکر، خودم انجام می‌دهم.
    - خواهش می‌کنم.
  fa.a2.unit31.lesson02.teach.offer_pattern:
    title: 'درخواست در برابر پیشنهاد: شما یا من'
    gloss: بگذارید من دروازه را ببندم.
    note: در درخواست با *می‌شه* فعل با شکل *شما* (*ببندید*) می‌آید، چون از طرف مقابل خواهش می‌کنید. در پیشنهاد با *بذارید من* فعل با شکل *من* (*ببندم*) می‌آید، چون کار را خودتان انجام می‌دهید. *می‌شه در رو ببندید؟* را با *بذارید من در رو ببندم* مقایسه کنید.
  fa.a2.unit31.lesson02.teach.reply_pattern:
    title: جواب مودبانه دو بخش دارد
    gloss: بلی، لطفاً. نه، تشکر، خودم انجام می‌دهم.
    note: با *بله* و *لطفا* قبول کنید. با *نه، ممنون* رد کنید و وقتی می‌خواهید بگویید خودتان از عهده برمی‌آیید، *خودم انجام می‌دم* را اضافه کنید.
  fa.a2.unit31.lesson03.teach.positive_imperatives:
    title: امرهای مثبت
    gloss: برو، بیا، بکن؛ بروید (محترمانه)، بکنید (محترمانه)
    note: 'به دوست شکل کوتاه می‌گویید: *برو*، *بیا*، *بکن*. به ناآشنایان و گروه شکل *-ید* را: *برید*، *بکنید*.'
    example_gloss:
    - آنجا برو.
    - اینجا بیا.
    - این را بکن.
    - آنجا بروید (محترمانه).
  fa.a2.unit31.lesson03.teach.negative_imperatives:
    title: امرهای منفی
    gloss: نرو، نیا، نکن؛ شکل‌های محترمانه و جمع
    note: '*ب-* را با *نـ* عوض کنید: *برو* می‌شود *نرو*، *بکن* می‌شود *نکن*، *بیا* می‌شود *نیا*. شکل‌های محترمانه *نرید*، *نکنید* و عبارت ثابت *دست نزنید* استند.'
    example_gloss:
    - آنجا نرو.
    - اینجا نیا.
    - این را نکن.
    - آنجا نروید (محترمانه).
    - این را نکنید (محترمانه).
    - دست نزنید (محترمانه).
  fa.a2.unit31.lesson03.teach.negative_rule:
    title: نـ جای ب- را می‌گیرد
    gloss: برو و نرو، بیا و نیا، بکن و نکن
    note: 'امر مثبت با *ب-* شروع می‌شود و امر منفی با *نـ*. *بیا* و *نیا* هم به همین شکل‌اند: فقط در حرف اول فرق دارند. تنها شکل منفی معنی را به «نکن» تبدیل می‌کند.'
  fa.a2.unit31.lesson03.teach.polite_plural:
    title: دوست یا جمع مؤدبانه
    gloss: نرو (به دوست) و نروید (مؤدبانه)
    note: 'برای یک شخص ناآشنا یا برای بیشتر از یک نفر *-ید* اضافه کنید: *نرو* می‌شود *نرید* و *نکن* می‌شود *نکنید*. تابلوها و دکان‌داران شکل‌های *-ید* را به کار می‌برند: *لطفا دست نزنید*.'
  fa.a2.unit31.lesson04.teach.places_people:
    title: همسایه‌ها و دکان‌ها
    gloss: همسایه، دکان، دکان‌دار، کیف، چای
    note: '*کیفم* یعنی «کیف من»؛ پسوند *-م* یعنی «من/ام». *تو مغازه* یعنی «در دکان».'
    example_gloss:
    - ببخشید، یک چای داده می‌توانید؟
    - ببخشید، کیفم را داده می‌توانید؟
    - سلام همسایه، کمک می‌خواهید؟
    - در دکان به هیچ چیز دست نزنید.
  fa.a2.unit31.lesson04.teach.shop_request:
    title: درخواست مؤدبانه در دکان
    gloss: ببخشید، یک چای داده می‌توانید؟ تشکر.
    note: با *ببخشید* شروع کنید، با *می‌شه* و یک فعل مؤدبانه بپرسید و با *ممنون* ختم کنید.
  fa.a2.unit31.lesson05.teach.reading:
    title: یادداشت برای همسایه
    gloss: سلام، ببخشید. امروز یک نان خریده می‌توانید؟ من خانه نیستم. لطفاً دروازه را بسته کنید و به کیفم دست نزنید. تشکر.
    note: یک بار برای درخواست بخوانید، بعد دوباره برای هدایت دست نزدن به کیف.
  fa.a2.unit31.lesson06.teach.turn01:
    title: سارا کمک می‌خواهد
    gloss: 'سارا: ببخشید، به من کمک کرده می‌توانید؟'
    note: یک درخواست مؤدبانه با *می‌شه* و پایانهٔ *شما*.
  fa.a2.unit31.lesson06.teach.turn02:
    title: همسایه موافقت می‌کند
    gloss: 'همسایه: بلی، حتماً. چه کنم؟'
    note: '*چیکار کنم؟* می‌پرسد که چه کار کند.'
  fa.a2.unit31.lesson06.teach.turn03:
    title: یک درخواست مشخص
    gloss: 'سارا: دروازه را باز کرده می‌توانید؟'
    note: مفعول *در رو* پیش از فعل مؤدبانه می‌آید.
  fa.a2.unit31.lesson06.teach.turn04:
    title: همسایه بیشتر پیشنهاد می‌کند
    gloss: 'همسایه: بلی. بگذارید من کیفتان را ببرم.'
    note: '*بذارید من ... ببرم* با پایانهٔ *من* می‌آید.'
  fa.a2.unit31.lesson06.teach.turn05:
    title: سارا رد می‌کند
    gloss: 'سارا: نه، تشکر، خودم انجام می‌دهم.'
    note: ردِ مؤدبانه همراه با دلیل.
  fa.a2.unit31.lesson06.teach.turn06:
    title: همسایه جواب می‌دهد
    gloss: 'همسایه: خواهش می‌کنم.'
    note: '*خواهش می‌کنم* جواب معمول برای تشکر است.'
