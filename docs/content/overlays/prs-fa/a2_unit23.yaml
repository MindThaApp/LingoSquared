      - پیاده
      - مدرسه
      - می‌رفتم
      status: correct
    feedback: '*هر روز پیاده می‌رفتم مدرسه* ترتیب طبیعیِ گفتاری است.'
  fa.a2.unit23.lesson01.exercise04.fill_used_to_go:
    instruction: جمله را با شکل گذشتهٔ تکراریِ اول شخصِ رفتن که یاد گرفته‌اید کامل کنید.
    accepted_answers:
    - value: می‌رفتم
