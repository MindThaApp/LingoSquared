teaching:
  fa.a2.unit23.lesson01.teach.time_words:
    title: واژه‌های زمانی کودکی
    gloss: پیش‌تر، آن وقت، وقتی طفل بودم، هر روز، هر تابستان
    note: '*قبلا* و *اون موقع* صحنهٔ گذشته را می‌سازند. *هر روز* و *هر تابستون* تکرار را نشان می‌دهند، به همین سبب طبیعی است که با گذشتهٔ عادتی با *می‌* بیایند.'
    example_gloss:
    - هر روز پیاده به مکتب می‌رفتم.
    - آن وقت من طفل بودم.
    - هر تابستان ما در پارک بازی می‌کردیم.
  fa.a2.unit23.lesson01.teach.places:
    title: جاهای خانه و محله
    gloss: خانه، حویلی، محله، مکتب، پارک
    note: '*توی* شکل گفتاری معمول «در» است. با *رفتن*، گوینده‌ها می‌توانند *به* را نگه دارند یا حذف کنند: *به مدرسه می‌رفتم* و *می‌رفتم مدرسه*.'
    example_gloss:
    - خانهٔ ما حویلی داشت.
    - محلهٔ ما آرام بود.
    - پیاده به مکتب می‌رفتم.
    - ما در پارک بازی می‌کردیم.
  fa.a2.unit23.lesson01.teach.descriptions:
    title: توصیف جاها
    gloss: آرام، شلوغ، بزرگ، نزدیک، دور
    note: اینها را با *بود* گذشته بیاورید تا بگویید جایی چطور بود. در فارسی گفتاری *دوره* یعنی «دور است».
    example_gloss:
    - محله آرام بود.
    - مکتب شلوغ بود.
    - حویلی بزرگ بود.
    - مکتب نزدیک بود.
    - حالا پارک دور است.
  fa.a2.unit23.lesson01.teach.activities:
    title: فعالیت‌های کودکی
    gloss: پیاده، کتاب، فوتبال، بازی کردن، خواندن، ساختن
    note: '*بازی کردن* فعل مرکب است. در گذشتهٔ عادتی، *می‌* روی *کردن* می‌آید: *بازی می‌کردم*.'
    example_gloss:
    - پیاده به مکتب می‌رفتم.
    - کتاب می‌خواندم.
    - فوتبال بازی می‌کردم.
    - آنها در حویلی چیزی می‌ساختند.
  fa.a2.unit23.lesson01.teach.habit_shape:
    title: شکل گذشتهٔ عادتی
    gloss: می‌رفتم، می‌خواندم، می‌کردم، می‌ساختند
    note: 'برای عادتِ تکراری در گذشته، *می‌* را پیش از ریشهٔ گذشته بگذارید و شناسهٔ شخص را اضافه کنید: *می‌رفت + م* ← *می‌رفتم*. بعد از *می‌* نیم‌فاصله (ZWNJ) را نگه دارید.'
  fa.a2.unit23.lesson02.teach.people_and_links:
    title: آدم‌ها و واژه‌های پرکاربرد
    gloss: من، ما، آنها، با، یک، چیزی، وقت‌های عصر
    note: در فارسیِ گفتاری اغلب ضمیر فاعل حذف می‌شود؛ وقتی لازم باشد، این واژه‌ها شخص یا موقعیت را روشن می‌کنند.
    example_gloss:
    - من هر روز یک کتاب می‌خواندم.
    - ما در پارک بازی می‌کردیم.
    - آنها چیزی می‌ساختند.
    - من با نیما فوتبال بازی می‌کردم.
    - ما یک حویلی بزرگ داشتیم.
    - ما وقت‌های عصر بازی می‌کردیم.
  fa.a2.unit23.lesson02.teach.now_words:
    title: حالا و دیگر نه
    gloss: حالا، دیگر، نه، آنجا، چطور
    note: '*دیگه* با فعل منفی یعنی «دیگر نه / حالا نه»: *دیگه بازی نمی‌کنم*.'
    example_gloss:
    - حالا محله شلوغ است.
    - من دیگر آنجا بازی نمی‌کنم.
    - نه، مکتب دور نبود.
    - محلهٔ شما چطور بود؟
  fa.a2.unit23.lesson02.teach.full_forms:
    title: شناسه‌های شخص با می‌رفت
    gloss: من، تو، او، ما، آنها می‌رفتم/می‌رفتی/می‌رفت/می‌رفتیم/می‌رفتند
    note: 'شناسه‌های گذشته همان‌ها می‌مانند: *-م، -ی،* بدون شناسه، *-یم، -ن*. سوم شخص جمع در گفتار *می‌رفتن* است.'
  fa.a2.unit23.lesson02.teach.other_habits:
    title: عادت‌های خواندن و بازی
    gloss: تو/او/ما می‌خواندی/می‌خواند/می‌خواندیم؛ من/ما بازی می‌کردم/بازی می‌کردیم
    note: 'همین الگو با ریشه‌های گذشتهٔ دیگر هم کار می‌کند. فعل مرکب اسمش را جدا نگه می‌دارد: *بازی می‌کردیم*.'
  fa.a2.unit23.lesson02.teach.past_states:
    title: حالت‌های گذشته با بودن و داشتن
    gloss: من بچه بودم؛ محله آرام بود؛ ما یک حویلی بزرگ داشتیم
    note: برای توصیف‌های پس‌زمینه، *بودن* و *داشتن* را در گذشته به کار ببرید. اینها حالت‌اند، پس شکل‌های طبیعی *بودم، بود، داشتیم* هستند، بدون *می‌*ی تکراری.
  fa.a2.unit23.lesson03.teach.simple_contrast:
    title: عادت در برابر یک رویداد
    gloss: من هر روز به مکتب می‌رفتم. دیروز به مکتب رفتم.
    note: '*هر روز می‌رفتم* گذشتهٔ تکراری است. *دیروز رفتم* یک رفتنِ تمام‌شده است. عبارت زمانی و بودن یا نبودنِ *می‌* با هم کار می‌کنند.'
  fa.a2.unit23.lesson03.teach.negative_habit:
    title: گذشتهٔ تکراریِ منفی
    gloss: نمی‌رفتم؛ نمی‌خواندم؛ بازی نمی‌کردم
    note: '*نـ* را پیش از *می‌* بیاورید: *نمی‌رفتم، نمی‌خوندم، بازی نمی‌کردم*. *نمی‌* را با نیم‌فاصله (ZWNJ) به ریشه وصل نگه دارید.'
  fa.a2.unit23.lesson04.teach.then_now:
    title: آن وقت در برابر حالا
    gloss: محلهٔ ما پیش‌ازین آرام بود؛ حالا شلوغ است.
    note: '*قبلا* یا *اون موقع* را با توصیف گذشته بیاورید، بعد *حالا* را با تضاد حالِ حاضر.'
  fa.a2.unit23.lesson05.teach.reading:
    title: محلهٔ دوران کودکی
    gloss: وقتی بچه بودم، محلهٔ ما آرام بود. ما یک خانه با حویلی بزرگ داشتیم. هر روز پیاده به مکتب می‌رفتم. وقت‌های عصر در حویلی فوتبال بازی می‌کردم. حالا محله شلوغ است و من دیگر آنجا بازی نمی‌کنم.
    note: این متن یک حالت گذشته، عادت‌های تکراری و یک تضاد با امروز را کنار هم می‌آورد.
  fa.a2.unit23.lesson06.teach.names:
    title: سارا و نیما
    gloss: سارا، نیما
    note: سارا و نیما دوستان همیشگیِ این گفتگو هستند.
    example_gloss:
    - سارا از دوران کودکی‌اش حرف می‌زند.
    - نیما از محله‌اش حرف می‌زند.
  fa.a2.unit23.lesson06.teach.turn01:
    title: سارا دربارهٔ محلهٔ قدیم می‌پرسد
    gloss: وقتی بچه بودی، محلهٔ شما چطور بود؟
    note: سارا با شکل گذشتهٔ فعل بودن دربارهٔ یک حالت در گذشته می‌پرسد.
  fa.a2.unit23.lesson06.teach.turn02:
    title: نیما دوران کودکی‌اش را شرح می‌دهد
    gloss: محلهٔ ما آرام بود. ما یک خانه با حویلی بزرگ داشتیم. هر روز پیاده به مکتب می‌رفتم و وقت‌های عصر در حویلی فوتبال بازی می‌کردم. تو چطور؟
    note: نیما حالت‌های گذشته (بود، داشتیم) را با عادت‌های تکراری (پیاده می‌رفتم، بازی می‌کردم) ترکیب می‌کند.
  fa.a2.unit23.lesson06.teach.turn03:
    title: سارا تضاد آن وقت و حالا را اضافه می‌کند
    gloss: مکتب ما نزدیک بود. هر تابستان در پارک بازی می‌کردیم. حالا پارک دور است و من دیگر آنجا بازی نمی‌کنم.
    note: سارا با *حالا ... دیگه ... نمی‌کنم* حال را با گذشته در تضاد می‌گذارد.
