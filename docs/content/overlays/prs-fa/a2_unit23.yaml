  fa.a2.unit23.lesson01.form_recognition:
    title: شناخت عادت‌های کودکی
  fa.a2.unit23.lesson02.form_drag:
    title: ساختن گذشتهٔ عادتی
  fa.a2.unit23.lesson03.habit_or_event:
