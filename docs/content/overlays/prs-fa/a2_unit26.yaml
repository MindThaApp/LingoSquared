    gloss: وقتی، تا وقتی که، پیش‌تر، دیگر، هنوز، تازه
    note: '*قبلا* و *دیگه* اغلب تأکید می‌کنند که کار از پیش تمام شده بود؛ *هنوز* با فعل منفی یعنی «تا حال نه».'
    example_gloss:
    - وقتی رسیدم، قطار رفته بود.
    - تا وقتی که رسیدم، دوکان بسته شده بود.
    - من از پیش تکت خریده بودم.
    - قطار از قبل رفته بود.
    - من هنوز غذا نخورده بودم.
    - من تازه رسیده بودم.
  fa.a2.unit26.lesson01.teach.travel:
