    gloss: قطار، تکت، ایستگاه، رسیدم، دیر
    note: کلمه‌های اساسی برای قطار از دست رفته و دیر رسیدن.
    example_gloss:
    - قطار رفته بود.
    - من تکت خریده بودم.
    - من به ایستگاه رسیدم.
    - من دیر رسیدم.
