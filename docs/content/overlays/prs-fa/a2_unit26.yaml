    - من کلیدها را در خانه جا گذاشته بودم.
    - من به خانه برگشتم.
  fa.a2.unit26.lesson02.teach.people_forms:
    title: اشخاص و حرف‌های ربط
    gloss: من، تو، آن‌ها، نیما، سارا، نشانهٔ مفعول، به، و، ولی، هم
