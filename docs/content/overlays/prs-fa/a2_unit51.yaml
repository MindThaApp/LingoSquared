teaching:
  fa.a2.unit51.short_story.lesson01.teach.place_words:
    title: جاها و چیزهای خوش برای یک روز بیرون
    gloss: باغ وحش، قایق، شهربازی، آیس‌کریم
    note: '*سوار قایق شدن* یعنی «در قایق سوار شدن / با قایق گشتن».'
    example_gloss:
    - دیروز به باغ وحش رفتیم.
    - سوار قایق شدیم.
    - فردا به شهربازی می‌رویم.
    - آیس‌کریم خوردیم.
  fa.a2.unit51.short_story.lesson01.teach.we_past_verbs:
    title: 'کارهایی که کردیم: گذشته با ـیم'
    gloss: رفتیم، دیدیم، خریدیم، خوردیم، گرفتیم، سوار شدیم
    note: نشانه‌ی «ما» در گذشته *ـیم* است. فعل معمولاً در آخر جمله می‌آید.
    example_gloss:
    - شیر و فیل دیدیم.
    - تکت خریدیم.
    - عکس گرفتیم.
    - سوار قایق شدیم.
  fa.a2.unit51.short_story.lesson01.teach.order_words:
    title: کلمه‌هایی که رویدادها را به ترتیب می‌آورند
    gloss: اول، بعد / بعدش، بعد از آن، آخر سر
    note: '*بعدش* و *بعد* هر دو یعنی «بعد از آن». *آخرش* یعنی «آخر سر» و رویداد آخر را شروع می‌کند.'
    example_gloss:
    - اول تکت خریدیم.
    - بعد یک شیر دیدیم.
    - بعد از آن عکس گرفتیم.
    - آخر سر آیس‌کریم خوردیم.
  fa.a2.unit51.short_story.lesson01.teach.tell_in_order:
    title: قصه کردن یک روز به ترتیب
    gloss: اول به باغ وحش رفتیم، بعد سوار قایق شدیم، آخر سر به شهربازی رفتیم.
    note: قصه از ترتیب رویدادها پیروی می‌کند. *اول*، *بعدش* یا *بعد*، و *آخرش* را در آغاز هر بخش بیاورید و در هر بخش یک فعل گذشته بگذارید. *ما* را می‌توانید نیاورید، چون نشانه‌ی *ـیم* خودش «ما» را می‌رساند.
  fa.a2.unit51.short_story.lesson02.teach.they_past_verbs:
    title: 'کارهایی که آنها کردند: گذشته با ـن'
    gloss: رفتند، دیدند، خریدند، خوردند، رسیدند، برگشتند
    note: در گذشته، «آنها» با *ـن* ختم می‌شود (*رفتن*) و «ما» با *ـیم* (*رفتیم*). *ـن* در گفتار همان شکل مصدر را دارد، پس از خود جمله معلوم می‌شود که فاعل کیست.
    example_gloss:
    - سارا و نیما دیروز به باغ وحش رفتند.
    - آنها یک شیر دیدند.
    - آنها تکت خریدند.
    - آخر سر به خانه برگشتند.
  fa.a2.unit51.short_story.lesson02.teach.feeling_verbs:
    title: ترسید، خندید
    gloss: او ترسید، او خندید، آنها ترسیدند، آنها خندیدند
    note: '*ترسید* و *خندید* شکل «او» هستند؛ *ترسیدن* و *خندیدن* شکل «آنها» هستند.'
    example_gloss:
    - نیما ترسید.
    - سارا خندید.
    - سارا و نیما خیلی خندیدند.
    - آنها ترسیدند.
  fa.a2.unit51.short_story.lesson02.teach.when_past:
    title: وقتی در قصه
    gloss: وقتی رسیدند، تکت خریدند. وقتی سوار کشتی شدند، نیما ترسید.
    note: در قصه، بعد از *وقتی* یک فعل گذشته می‌آید و بعد فعل گذشتهٔ اصلی. بخش *وقتی* لحظه را مشخص می‌کند و جملهٔ اصلی می‌گوید که در آن لحظه چه شد.
  fa.a2.unit51.short_story.lesson02.teach.people_events:
    title: شروع یک قصه
    gloss: سارا و نیما دیروز به باغ وحش رفتند.
    note: 'قصه معمولاً با این شروع می‌شود: کی، چه وقت و کجا.'
  fa.a2.unit51.short_story.lesson03.teach.progressive_forms:
    title: چیزی که جریان داشت
    gloss: ما می‌رفتیم، او می‌رفت، آنها می‌خوردند، او عکس می‌گرفت
    note: '*داشت* با فعل *می‌* کاری را نشان می‌دهد که در جریان بود. از آن برای چیزی استفاده کن که هنگام اتفاق افتادن کار دیگر جریان داشت.'
    example_gloss:
    - ما به باغ وحش می‌رفتیم.
    - سارا عکس می‌گرفت.
    - آنها بستنی می‌خوردند.
    - من عکس می‌گرفتم.
    - کشتی می‌رفت.
  fa.a2.unit51.short_story.lesson03.teach.progressive_note:
    title: دو کار که همزمان جریان داشت
    gloss: وقتی کشتی در حرکت بود، سارا عکس می‌گرفت.
    note: بخش اول صحنه را می‌سازد (*قایق داشت می‌رفت*)؛ بخش دوم می‌گوید که دیگر چه جریان داشت (*سارا داشت عکس می‌گرفت*). این شکل فقط برای جملهٔ مثبت است، نه برای منفی.
  fa.a2.unit51.short_story.lesson03.teach.past_perfect_forms:
    title: آنچه قبلاً شده بود
    gloss: او خریده بود، ما رفته بودیم، آنها رسیده بودند، من دیده بودم
    note: '*بود/بودیم/بودن/بودم* بعد از شکل *ـه* فعل یعنی «ماضی بعید».'
    example_gloss:
    - نیما تکت‌ها را خریده بود.
    - ما قبلاً رفته بودیم.
    - آنها رسیده بودند.
    - من قبلاً شیر دیده بودم.
  fa.a2.unit51.short_story.lesson03.teach.past_perfect_note:
    title: چیزی که قبلاً اتفاق افتاده بود
    gloss: وقتی رسیدیم، نیما تکت‌ها را از قبل خریده بود.
    note: 'ماضی بعید نشان می‌دهد که یک رویداد گذشته پیش از رویداد دیگر شده بود. دو رویداد این‌هاست: *رسیدیم* (بعدتر) و *خریده بود* (قبلتر).'
  fa.a2.unit51.short_story.lesson04.teach.habit_words:
    title: هر سال، وقتی بچه بودم
    gloss: هر سال، من بچه بودم، مادرم
    note: '*هر سال* و *وقتی بچه بودم* می‌گویند که چیزی در گذشته بارها تکرار می‌شد.'
    example_gloss:
    - هر سال ما به شهربازی می‌رفتیم.
    - وقتی بچه بودم، با مادرم می‌رفتیم.
    - مادرم شهربازی را دوست دارد.
  fa.a2.unit51.short_story.lesson04.teach.perfect_forms:
    title: تا حال رفته‌ای؟
    gloss: تا حال / هرگز، من رفته‌ام، من نرفته‌ام، ما رفته‌ایم، تو شده‌ای / سوار شده‌ای
    note: '*تا حالا* می‌پرسد یا می‌گوید که آیا چیزی تا حال شده است. در گفتار می‌توانی ماضی ساده را هم به کار ببری: *تا حالا سوار قایق شدی؟*'
    example_gloss:
    - من هرگز به شهربازی نرفته‌ام.
    - تا حال سوار کشتی شده‌ای؟
    - ما به باغ وحش رفته‌ایم.
  fa.a2.unit51.short_story.lesson04.teach.tense_choice:
    title: کدام گذشته برای کدام قصه؟
    gloss: ما دیروز رفتیم؛ هر سال می‌رفتیم؛ رفته بودیم؛ تا حال رفته‌ایم.
    note: ماضی ساده را برای یک رویداد تمام‌شده به کار ببر، گذشتهٔ *می‌ـ* را برای عادت، *بود* را برای «ماضی بعید»، و *تا حالا* را با شکل *ـه* برای تجربه تا حال.
  fa.a2.unit51.short_story.lesson04.teach.ever_phrase:
    title: پرسیدن دربارهٔ تجربه
    gloss: تا حال سوار کشتی شده‌ای؟ بلی، یک بار.
    note: 'یک پرسش کوتاه و یک جواب کوتاه: *یه بار* یعنی «یک بار».'
  fa.a2.unit51.short_story.lesson05.teach.reading:
    title: یک روز بیرون
    gloss: دیروز سارا و نیما به باغ وحش رفتند. وقتی رسیدند، نیما تکت‌ها را از قبل خریده بود. اول شیر و فیل دیدند. بعد سوار کشتی شدند. وقتی کشتی در حرکت بود، نیما ترسید ولی سارا عکس می‌گرفت. بعد به شهربازی رفتند و خیلی خندیدند. آخر بستنی خوردند و به خانه برگشتند.
    note: یک بار بخوان تا ترتیب جاها را بفهمی، بعد دوباره بخوان تا ببینی کی چه کرد.
  fa.a2.unit51.short_story.lesson06.teach.turn01:
    title: نیما شروع می‌کند
    gloss: سارا، دیروز خیلی خوش گذشت!
    note: نیما با گفتن اینکه روز چطور بود شروع می‌کند.
  fa.a2.unit51.short_story.lesson06.teach.turn02:
    title: سارا قصه را شروع می‌کند
    gloss: بلی! اول به باغ وحش رفتیم و شیر و فیل دیدیم.
    note: '*اول* بازگویی را شروع می‌کند.'
  fa.a2.unit51.short_story.lesson06.teach.turn03:
    title: نیما ادامه می‌دهد
    gloss: بعد سوار کشتی شدیم. وقتی کشتی در حرکت بود، من ترسیدم.
    note: '*بعدش* ترتیب را ادامه می‌دهد؛ *داشت می‌رفت* پس‌زمینه است.'
  fa.a2.unit51.short_story.lesson06.teach.turn04:
    title: سارا اضافه می‌کند
    gloss: ولی من خندیدم و عکس گرفتم! بعد به شهربازی رفتیم.
    note: '*بعد* قصه را پیش می‌برد.'
  fa.a2.unit51.short_story.lesson06.teach.turn05:
    title: نیما تمام می‌کند
    gloss: آخر بستنی خوردیم. من پیش از این هرگز به شهربازی نرفته بودم.
    note: '*نرفته بودم* به چیزی قبلتر برمی‌گردد.'
  fa.a2.unit51.short_story.lesson06.teach.turn06:
    title: سارا سفر دیگری را پلان می‌کند
    gloss: پس هفتهٔ آینده دوباره می‌رویم!
    note: یک پلان با زمان حال ساده.
