teaching:
  fa.a2.unit38.lesson01.teach.polite_words:
    title: آغاز مؤدبانه
    gloss: ببخشید، می‌دانید (محترمانه)، نمی‌دانم
    note: '*ببخشید* پرسش مؤدبانه از یک شخص ناآشنا را شروع می‌کند. *می‌دونید* شکل محترمانهٔ *شما* برای «می‌دانید» است.'
    example_gloss:
    - ببخشید، می‌دانید ساعت چند است؟
    - نمی‌دانم، ببخشید.
  fa.a2.unit38.lesson01.teach.places:
    title: جاها و یک تکت
    gloss: ایستگاه، دفتر، موزیم، کتابخانه، تکت
    note: '*کتابخونه* شکل عادی گفتاری «کتابخانه» است؛ در نوشتار رسمی *کتابخانه* نوشته می‌شود.'
    example_gloss:
    - ایستگاه آن‌طرف است.
    - دفتر این‌جاست.
    - موزیم آن‌طرف است.
    - کتابخانه اینجاست.
    - تکت این‌جاست.
  fa.a2.unit38.lesson01.teach.where_time:
    title: کجاست؟ ساعت چند است؟
    gloss: کجاست، ساعت چند است، این‌جاست، آن‌طرف است
    note: '*ساعت چنده* وقت را می‌پرسد. *اینجاست* و *اونجاست* جواب‌های کوتاه و معمول دربارهٔ یک جا هستند.'
    example_gloss:
    - دفتر کجاست؟
    - ساعت چند است؟
    - کتابخانه اینجاست.
  fa.a2.unit38.lesson01.teach.frame:
    title: 'قالب مؤدبانه: می‌دونید + پرسش'
    gloss: ببخشید، می‌دانید ایستگاه کجاست؟ ببخشید، می‌دانید ساعت چند است؟
    note: 'برای پرسیدن مؤدبانه از یک شخص ناآشنا، *ببخشید، می‌دونید* را پیش از پرسش عادی بگذارید. خود پرسش تغییر نمی‌کند: *ایستگاه کجاست؟* می‌شود *ببخشید، می‌دونید ایستگاه کجاست؟*.'
  fa.a2.unit38.lesson02.teach.open_closed:
    title: باز، بسته، امروز، فردا
    gloss: باز، بسته، امروز، فردا
    note: '*باز* یعنی «گشوده» و *بسته* یعنی «مسدود». *هست* می‌گوید که چیزی چنین است.'
    example_gloss:
    - موزیم امروز باز است.
    - دفتر امروز بسته است.
    - موزیم فردا باز است.
    - کتابخانه فردا بسته است.
  fa.a2.unit38.lesson02.teach.when_or_not:
    title: کی، یا، نه، بلی
    gloss: کی، می‌شود / واقع می‌شود، یا، نه / نی، بلی
    note: '*باز می‌شه* یعنی «باز می‌شود»؛ *بسته می‌شه* یعنی «بسته می‌شود». *نه* یعنی «نه» و پایان جفت *یا نه* («یا نه») هم هست.'
    example_gloss:
    - موزیم کی باز می‌شود؟
    - باز است یا نه؟
    - بلی، باز است.
  fa.a2.unit38.lesson02.teach.when_pattern:
    title: '«کی» در پرسش درونی: کلمهٔ پرسش در جای خود می‌ماند'
    gloss: می‌دانید موزیم کی باز می‌شود؟
    note: 'در فارسی ایران ترتیب کلمات تغییر نمی‌کند: *موزه کی باز می‌شه؟* درست بعد از *می‌دونید* می‌آید. کلمهٔ پرسش *کی* همان جایی می‌ماند که در پرسش مستقیم است.'
  fa.a2.unit38.lesson02.teach.whether_pattern:
    title: 'پرسش بلی/نه درونی: ... یا نه'
    gloss: می‌دانید موزیم باز است (یا نه)؟
    note: برای معنای «آیا»، جملهٔ ساده *موزه باز هست* را می‌گیرید و آخرش *یا نه* می‌آورید. در فارسی ایران برای این کار کلمهٔ جداگانه‌ای در آغاز لازم نیست؛ *یا نه* در آخر جمله می‌آید.
  fa.a2.unit38.lesson03.teach.you_forms:
    title: تو برای دوست، شما برای شخص ناآشنا
    gloss: تو (دوست)، شما (محترمانه)، می‌دانی (دوست)
    note: سارا و نیما دوست اند، پس *تو* و *می‌دونی* می‌گویند. به شخص ناآشنا *شما* و *می‌دونید* بگویید.
    example_gloss:
    - سارا، می‌دانی دفتر کجاست؟
    - می‌دانید دفتر کجاست؟ (به یک شخص ناآشنا)
  fa.a2.unit38.lesson03.teach.same_order:
    title: ترتیب کلمات تغییر نمی‌کند
    gloss: ایستگاه کجاست؟ می‌دانید ایستگاه کجاست؟
    note: 'پرسش مستقیم و پرسش درونی دقیقاً همان کلمات را به همان ترتیب دارند: *ایستگاه کجاست؟* / *می‌دونید ایستگاه کجاست؟*. فقط قالب مؤدبانه اضافه می‌شود. در فارسی ایران پرسش جابه‌جا نمی‌شود.'
  fa.a2.unit38.lesson03.teach.friend_stranger:
    title: می‌دونی یا می‌دونید؟
    gloss: می‌دانی (دوست)؛ می‌دانید (شخص ناآشنا)
    note: '*می‌دونی* را با دوست و *می‌دونید* را با شخص ناآشنا، کارمند یا هر کسی که محترمانه خطاب می‌کنید به کار ببرید. پرسش مؤدبانه از شخص ناآشنا با *ببخشید* هم شروع می‌شود.'
  fa.a2.unit38.lesson03.teach.dont_know:
    title: 'نمی‌دانم ...: یک جمله خبری، نه پرسش'
    gloss: نمی‌دانم ایستگاه کجاست؛ نمی‌دانم که ایستگاه کجاست
    note: '*نمی‌دونم* همان پرسش درونی را می‌گیرد: *نمی‌دونم موزه کی باز می‌شه*. این جمله خبری است، پس علامت پرسش ندارد. می‌توانید بعد از آن *که* بیاورید (*نمی‌دونم که ...*)، ولی در گفتار فارسی ایران معمولاً نمی‌آید.'
  fa.a2.unit38.lesson03.teach.ke:
    title: که (کلمهٔ پیوند اختیاری)
    gloss: که (کلمهٔ پیوند اختیاری)
    note: در این‌جا *که* فقط *نمی‌دونم* را به پرسش وصل می‌کند. چیزی به معنا نمی‌افزاید و معمولاً حذف می‌شود.
    example_gloss:
    - نمی‌دانم دفتر کجاست.
  fa.a2.unit38.lesson04.teach.directions:
    title: راهنمایی‌هایی که ممکن است بشنوید
    gloss: مستقیم، بروید (محترمانه)، طرف، راست، چپ، بعد، و
    note: 'یک شخص ناآشنا با امر مؤدبانه جواب می‌دهد: *مستقیم برید* یعنی «مستقیم بروید». *سمت راست* یعنی «طرف راست» و *سمت چپ* یعنی «طرف چپ».'
    example_gloss:
    - مستقیم بروید.
    - طرف راست بروید.
    - مستقیم بروید و بعد طرف چپ.
  fa.a2.unit38.lesson04.teach.times_thanks:
    title: ساعت و تشکر
    gloss: ساعت هشت، ساعت پنج، تشکر
    note: '*ساعت هشت* یعنی «در ساعت هشت». بعد از هر جواب *ممنون* بگویید.'
    example_gloss:
    - موزیم ساعت هشت باز می‌شود.
    - دفتر ساعت پنج بسته می‌شود.
    - تشکر!
  fa.a2.unit38.lesson04.teach.package:
    title: یک بستهٔ مؤدبانه
    gloss: ببخشید، می‌دانید دفتر کی بسته می‌شود؟
    note: 'هر پرسش مؤدبانه را در سه گام بسازید: *ببخشید*، بعد *می‌دونید*، بعد پرسش عادی با کلمهٔ پرسش خودش (*کجاست*، *کی ... می‌شه*، *... هست یا نه*). هیچ چیز در داخل پرسش جابه‌جا نمی‌شود.'
  fa.a2.unit38.lesson05.teach.greeting:
    title: سلام و من
    gloss: سلام، من
    note: '*من* کمتر ضرورت می‌شود، چون ختم فعل خودش به معنای «من» است. برای تأکید و مقایسه اضافه می‌شود.'
    example_gloss:
    - سلام، من نمی‌دانم.
    - فردا من به موزیم می‌روم.
  fa.a2.unit38.lesson05.teach.reading:
    title: یک یادداشت کوتاه برای پرسیدن معلومات
    gloss: سلام. ببخشید، می‌دانید دفتر کجاست؟ می‌دانید فردا باز است یا نه؟ من نمی‌دانم. تشکر. نیما
    note: یک بار بخوانید تا دو سوال را پیدا کنید، بعد دوباره بخوانید تا قالب مؤدبانهٔ هر کدام را ببینید.
  fa.a2.unit38.lesson06.teach.passerby:
    title: رهگذر
    gloss: رهگذر (یک آدم ناآشنا در سرک)
    note: 'توجه کنید که سوال داخل جمله بعد از *می‌دونه* («او می‌داند») هم درست به همین شکل می‌آید: هیچ چیز جابه‌جا نمی‌شود.'
    example_gloss:
    - رهگذر می‌داند که دفتر کجاست.
  fa.a2.unit38.lesson06.teach.turn01:
    title: سارا از دوستش می‌پرسد
    gloss: 'سارا با شکل دوستانه از نیما می‌پرسد: می‌دانی دفتر کجاست؟'
    note: او *می‌دونی* را استفاده می‌کند، چون آن‌ها دوست هستند.
  fa.a2.unit38.lesson06.teach.turn02:
    title: نیما از یک آدم ناآشنا می‌پرسد
    gloss: نیما نمی‌داند، پس با قالب مؤدبانه از یک رهگذر می‌پرسد.
    note: او برای آدم ناآشنا به *می‌دونید* تغییر می‌دهد.
  fa.a2.unit38.lesson06.teach.turn03:
    title: رهگذر او را رهنمایی می‌کند
    gloss: 'بلی: مستقیم بروید. دفتر طرف راست است.'
    note: جواب از امر مؤدبانه کار می‌گیرد.
  fa.a2.unit38.lesson06.teach.turn04:
    title: نیما می‌پرسد که باز است یا نه
    gloss: تشکر. می‌دانید دفتر باز است یا نه؟
    note: سوال دوم از *یا نه* کار می‌گیرد.
  fa.a2.unit38.lesson06.teach.turn05:
    title: باز است و ساعت پنج بسته می‌شود
    gloss: بلی، باز است. ساعت پنج بسته می‌شود.
    note: 'دو معلومات: حالا باز است، ساعت پنج بسته می‌شود.'
  fa.a2.unit38.lesson06.teach.turn06:
    title: نیما تشکر می‌کند و به سارا می‌گوید
    gloss: تشکر. سارا، دفتر آنجاست.
    note: او از آدم ناآشنا تشکر می‌کند و به دوستش می‌گوید.
