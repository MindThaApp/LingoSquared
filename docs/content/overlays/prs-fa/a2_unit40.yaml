teaching:
  fa.a2.unit40.lesson01.teach.things:
    title: چیزهای روزمره
    gloss: کتاب، کیف، کلید، موبایل، ساعت
    note: '*ساعت* هم به معنای «ساعت دستی» است و هم «ساعت (زمان)»؛ جمله نشان می‌دهد کدام است.'
    example_gloss:
    - من یک کتاب دارم.
    - من یک کیف دارم.
    - من یک کلید دارم.
    - من موبایل دارم.
    - من یک ساعت دارم.
  fa.a2.unit40.lesson01.teach.verbs:
    title: خریدم، گم کردم، پیدا کردم
    gloss: خریدم، گم کردم، پیدا کردم
    note: 'هر سه فعل ماضی ساده و شخص اول هستند. *گم کردم* و *پیدا کردم* فعل‌های دوکلمه‌ای اند: اسم اول می‌آید.'
    example_gloss:
    - دیروز یک کتاب خریدم.
    - دیروز یک کلید گم کردم.
    - دیروز یک موبایل پیدا کردم.
  fa.a2.unit40.lesson01.teach.rel1:
    title: 'اسم + ی + که: «... که ...»'
    gloss: کتابی که خریدم؛ کیفی که گم کردم؛ کلیدی که پیدا کردم
    note: 'برای گفتن اینکه کدام چیز را می‌گویید، به اسم *ی* و بعد *که* و یک جملهٔ کوتاه اضافه کنید: *کتاب* + *ی* + *که خریدم*. کل این گروه مثل یک اسم کار می‌کند. در فارسی ایران، مثل دری، در جمله بعد از که ضمیر اضافی نمی‌آید: *کتابی که خریدم*، نه «کتابی که خریدمش».'
  fa.a2.unit40.lesson01.teach.rel2:
    title: گروه، نهاد جمله است
    gloss: کتابی که خریدم خوب است؛ کیفی که گم کردم کوچک بود
    note: 'گروه *کتابی که خریدم* مثل هر اسم دیگر می‌تواند در آغاز جمله بیاید و بعد از آن فعل یا صفت می‌آید: *کتابی که خریدم خوبه*.'
  fa.a2.unit40.lesson02.teach.people:
    title: مردم در محل کار
    gloss: همکار، مدیر، مشتری، مرد، خانم
    note: '*همکارم* یعنی «همکارم». *خانم* کلمهٔ مؤدبانه برای «خانم» هم است.'
    example_gloss:
    - همکارم اینجاست.
    - مدیر آنجاست.
    - مشتری اینجاست.
    - آن مرد آنجاست.
    - آن خانم اینجاست.
  fa.a2.unit40.lesson02.teach.verbs:
    title: کار می‌کند، نشسته است، زنگ زد
    gloss: او کار می‌کند، نشسته است، زنگ زد
    note: '*نشسته* یعنی «نشسته است» (یک حالت). *زنگ زد* یعنی «تیلفون کرد».'
    example_gloss:
    - همکارم در بانک کار می‌کند.
    - مدیر آنجا نشسته است.
    - مشتری دیروز تیلفون کرد.
  fa.a2.unit40.lesson02.teach.rel_subject:
    title: '«که» برای کس: همان الگو برای آدم‌ها'
    gloss: مردی که آنجا نشسته است؛ همکاری که در بانک کار می‌کند؛ مشتری‌ای که تیلفون کرد
    note: برای آدم‌ها هم مثل چیزها همان *که* به کار می‌رود؛ کلمهٔ جداگانه‌ای برای «کسی که» وجود ندارد. شخص، انجام‌دهندهٔ فعل در آن جمله است.
  fa.a2.unit40.lesson02.teach.rel_spelling:
    title: املای ی بعد از ه و ی
    gloss: 'بعد از حرف بی‌صدا: ی؛ بعد از ه بی‌صدا یا ی آخر: ‌ای'
    note: 'بعد از حرف بی‌صدا پایان *ی* است (*کتابی*). بعد از *ه* بی‌صدا یا بعد از *ی* با یک فاصلهٔ کوچک *ای* نوشته می‌شود: *خونه‌ای*، *مشتری‌ای*. در تلفظ همان صدای «ی» شنیده می‌شود.'
  fa.a2.unit40.lesson03.teach.which:
    title: کدام، آن، همان
    gloss: کدام، آن، همان یکی
    note: '*کدوم؟* یعنی «کدام؟». *اون* به چیزی اشاره می‌کند؛ *همون* یعنی «همان یکی».'
    example_gloss:
    - کدام کتاب؟
    - آن کتاب خوب است.
    - همان کتاب اینجاست.
  fa.a2.unit40.lesson03.teach.answer:
    title: به «کدام؟» با گروه «که» جواب بدهید
    gloss: کدام کیف؟ کیفی که گم کردم.
    note: 'آسان‌ترین جواب به *کدوم؟* یک گروه با «که» است. می‌توانید پیشش *اون* یا *همون* بگذارید: *همون کیفی که گم کردم* (همان کیفی که گم کردم).'
  fa.a2.unit40.lesson03.teach.time:
    title: کلمات بیشتر در داخل گروه
    gloss: کتابی که دیروز خریدم؛ ساعتی که امروز پیدا کردم
    note: 'جمله می‌تواند کلمات بیشتری (قید زمان، جای) پیش از فعل داشته باشد. فعل باز هم آخر می‌آید: *کتابی که دیروز خریدم*.'
  fa.a2.unit40.lesson04.teach.lost_things:
    title: چیزهایی که مردم گم می‌کنند
    gloss: عینک، کیف پول، رنگ
    note: '*کیف پول* یعنی «بٹوه»: *کیف* + *پول*.'
    example_gloss:
    - عینکم اینجاست.
    - کیف پولم آنجاست.
    - این رنگ قشنگ است.
  fa.a2.unit40.lesson04.teach.colours:
    title: رنگ‌ها و «چه رنگ؟»
    gloss: سیاه، سرخ، آبی، چه
    note: '*چه رنگیه؟* یعنی «چه رنگ است؟».'
    example_gloss:
    - کیفم سیاه است.
    - عینکم سرخ است.
    - موبایلم آبی است.
    - کیف شما چه رنگ است؟
  fa.a2.unit40.lesson04.teach.describe:
    title: توصیف چیزی که گم کرده‌اید
    gloss: کیفی که گم کردید چه رنگ است؟ کیفی که گم کردم سیاه است.
    note: 'در دفتر اشیای گم‌شده کارمند دربارهٔ چیز گمشده با یک گروه «که» می‌پرسد و شما با گروه دیگری یا فقط با رنگ جواب می‌دهید: *سیاهه*. کارمند *شما* می‌گوید (*گم کردید*).'
  fa.a2.unit40.lesson05.teach.reading:
    title: یک کیف گم‌شده
    gloss: 'سارا دیروز کیفش را گم کرد. کیفی که گم کرد سیاه بود. در کیف یک موبایل و یک کلید بود. امروز سارا به دفتر اشیای گم‌شده رفت. کارمندی که آنجا کار می‌کند گفت: «کیفی که پیدا کردیم سیاه است.» سارا خوش شد.'
    note: یک بار بخوانید تا بفهمید چه شد، بعد دوباره برای گروه‌هایی که *که* دارند.
  fa.a2.unit40.lesson06.teach.turn01:
    title: نیما گم شدن کیف را گزارش می‌دهد
    gloss: 'نیما: ببخشید، من یک کیف گم کرده‌ام.'
    note: '*گم کردم* یعنی «گم کردم».'
  fa.a2.unit40.lesson06.teach.turn02:
    title: کارمند مشخصات را می‌پرسد
    gloss: 'کارمند: کیفی که گم کردید چه رنگ است؟'
    note: 'کارمند *شما* می‌گوید: *گم کردید*.'
  fa.a2.unit40.lesson06.teach.turn03:
    title: نیما جواب می‌دهد
    gloss: 'نیما: سیاه است.'
    note: یک جواب کوتاه کافی است.
  fa.a2.unit40.lesson06.teach.turn04:
    title: کارمند می‌پرسد کدام یک
    gloss: 'کارمند: کدام کیف؟ آنی که کوچک است؟'
    note: '*اونی که کوچیکه* یعنی «آنی که کوچک است»: *اونی* جای اسم را می‌گیرد.'
  fa.a2.unit40.lesson06.teach.turn05:
    title: نیما تأیید می‌کند
    gloss: 'نیما: بلی، همان کیفی که کوچک است.'
    note: '*همون کیفی که کوچیکه* توضیح را تکرار می‌کند.'
  fa.a2.unit40.lesson06.teach.turn06:
    title: کارمند به همکارش اشاره می‌کند
    gloss: 'کارمند: همکاری که آنجا نشسته، کیف را پیدا کرده. کیفی که پیدا کرده، سیاه است.'
    note: '*پیدا کرده* ماضی نقلی است، یعنی «پیدا کرده است».'
