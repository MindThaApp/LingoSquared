teaching:
  fa.a2.unit45.lesson01.teach.time:
    title: امروز و اندازه
    gloss: امروز، بسیار، کمی
    note: امروز زمان را می‌گوید؛ *خیلی* و *یکم* اندازه را می‌گویند.
    example_gloss:
    - امروز بسیار خوشحال استم.
    - امروز کمی خسته استم.
  fa.a2.unit45.lesson01.teach.feel:
    title: احساسات
    gloss: خوشحال استم، ناراحت استم، خسته استم، خشمگین استم، پریشان استم
    note: 'پسوند گفتاری *-م* یعنی «استم»: *خسته‌م* یعنی «خسته استم».'
    example_gloss:
    - امروز خوشحال استم.
    - امروز ناراحت استم.
    - امروز خسته استم.
    - امروز خشمگین استم.
    - امروز پریشان استم.
  fa.a2.unit45.lesson01.teach.hal:
    title: چه احساسی دارید
    gloss: حال من، حال تو، خوب است، بد است، چطور است
    note: '*حال* وضعیتی است که در آن استید؛ پس *حالم* یعنی «حال من» و *حالت* یعنی «حال تو». *حالم خوبه* یعنی «حالم خوب است»؛ *حالم بده* یعنی «حالم بد است».'
    example_gloss:
    - حالم خوب است.
    - حالم بد است.
    - حالت چطور است؟
  fa.a2.unit45.lesson01.teach.shape:
    title: دو راه برای گفتن حال خود
    gloss: خسته استم؛ حالم بد است؛ حالت چطور است؟
    note: 'یا *-م* را به کلمهٔ احساس بیفزایید (*خسته‌م*، *نگرانم*)، یا *حالم* را با *خوبه* یا *بده* بگویید. برای پرسیدن، پسوند را عوض کنید: *حالت چطوره؟*'
  fa.a2.unit45.lesson02.teach.care:
    title: مراقبت و «از»
    gloss: مراقبت، از
    note: '*مراقبت می‌کنم* یعنی «مراقبت می‌کنم». کسی که از او مراقبت می‌کنید بعد از *از* می‌آید.'
    example_gloss:
    - از دوستم مراقبت می‌کنم.
  fa.a2.unit45.lesson02.teach.verbs:
    title: زمان حال کردن
    gloss: من می‌کنم، تو می‌کنی، او می‌کند، ما می‌کنیم، شما می‌کنید، آن‌ها می‌کنند
    note: 'این‌ها پسوندهای گفتاری زمان حال استند: *-م, -ی, -ه, -یم, -ین, -ن*.'
    example_gloss:
    - مراقبت می‌کنم.
    - مراقبت می‌کنی.
    - او مراقبت می‌کند.
    - ما مراقبت می‌کنیم.
    - شما مراقبت می‌کنید.
    - آن‌ها مراقبت می‌کنند.
  fa.a2.unit45.lesson02.teach.self_sg:
    title: خودم، خودت، خودش
    gloss: خودم، خودت، خودش
    note: '*خود* به معنی «نفس خود شخص» است. مثل اسم‌های دیگر پسوند می‌گیرد: *-م* (من)، *-ت* (تو)، *-ش* (او).'
    example_gloss:
    - من از خودم مراقبت می‌کنم.
    - تو از خودت مراقبت می‌کنی.
    - او از خودش مراقبت می‌کند.
  fa.a2.unit45.lesson02.teach.self_pl:
    title: خودما، خودتان، خودشان
    gloss: خودما، خودتان (یا شما، محترمانه)، خودشان
    note: در گفتار، پسوندهای جمع *-مون, -تون, -شون* استعمال می‌شوند. *خودتون* برای یک نفر هم شکل مؤدبانه است.
    example_gloss:
    - ما از خودما مراقبت می‌کنیم.
    - شما از خودتان مراقبت می‌کنید.
    - آن‌ها از خودشان مراقبت می‌کنند.
  fa.a2.unit45.lesson02.teach.careful:
    title: مواظب باش
    gloss: مواظب، باش (به یک دوست)، باشید (به چند نفر، یا محترمانه)
    note: '*مواظب خودت باش* را به دوستی می‌گویند که می‌رود یا مریض است. برای چند نفر یا برای احترام، *مواظب خودتون باشین* می‌گویند.'
    example_gloss:
    - مواظب خودت باش.
    - مواظب خودتان باشید.
  fa.a2.unit45.lesson02.teach.agree:
    title: خود با فاعل مطابقت می‌کند
    gloss: من از خودم مراقبت می‌کنم؛ تو از خودت مراقبت می‌کنی
    note: 'پسوند *خود* با فاعل مطابقت دارد و فعل هم همچنین: *من* با *خودم* و *می‌کنم* می‌آید؛ *تو* با *خودت* و *می‌کنی*؛ *ما* با *خودمون* و *می‌کنیم*.'
  fa.a2.unit45.lesson03.teach.when:
    title: وقتی که این کار را می‌کنید
    gloss: صبح‌ها، شب‌ها، هر روز
    note: پسوند *-ها* بر *صبح* و *شب* معنای «صبح‌ها» و «شب‌ها» را به شکل عادت می‌دهد.
    example_gloss:
    - صبح‌ها دوش می‌گیرم.
    - شب‌ها دندان‌هایم را مسواک می‌کنم.
    - هر روز ورزش می‌کنم.
  fa.a2.unit45.lesson03.teach.body:
    title: شستن و پاک‌کاری
    gloss: دوش، مسواک، دست‌هایم، رویم
    note: '*دوش* همان دوش گرفتن است و *مسواک* برس دندان؛ *دست‌هام* یعنی «دست‌هایم» و *صورتم* یعنی «رویم».'
    example_gloss:
    - دوش می‌گیرم.
    - دندان‌هایم را مسواک می‌کنم.
    - دست‌هایم را می‌شویم.
    - رویم را می‌شویم.
  fa.a2.unit45.lesson03.teach.verbs:
    title: فعل‌های مراقبت
    gloss: می‌گیرم، می‌زنم (مسواک)، می‌شویم
    note: 'در فارسی ایران برای هر کدام فعل جداگانه‌ای به کار می‌رود: *دوش می‌گیرم* (دوش گرفتن)، *مسواک می‌زنم* (مسواک کردن)، *می‌شورم* (شستن).'
    example_gloss:
    - دوش می‌گیرم.
    - دندان‌هایم را مسواک می‌کنم.
    - رویم را می‌شویم.
  fa.a2.unit45.lesson03.teach.rest:
    title: ورزش و آرام گرفتن
    gloss: ورزش، استراحت، می‌خوابم، زود
    note: '*ورزش* و *استراحت* با *می‌کنم* می‌آیند: *ورزش می‌کنم* و *استراحت می‌کنم*.'
    example_gloss:
    - من هر روز ورزش می‌کنم.
    - کمی استراحت می‌کنم.
    - زود می‌خوابم.
  fa.a2.unit45.lesson03.teach.light:
    title: اسم و فعل
    gloss: دوش می‌گیرم؛ مسواک می‌کنم؛ ورزش می‌کنم؛ استراحت می‌کنم
    note: بیشتر کارهای مراقبت از خود، اسم و فعل‌اند. اسم ثابت می‌ماند؛ فقط فعل با شخص تغییر می‌کند. فعل برای هر اسم معین است، پس آن‌ها را جفت جفت یاد بگیرید.
  fa.a2.unit45.lesson03.teach.ask:
    title: پرسیدن «چطور»
    gloss: چطور از خودت مراقبت می‌کنی؟
    note: '*چطور* یعنی «چگونه».'
  fa.a2.unit45.lesson03.teach.phrase:
    title: مراقبت از خود
    gloss: به خودم می‌رسم (به ظاهر و سلامتی خودم)
    note: '*به خودم می‌رسم* عبارت ثابت روزمره برای وقت گذاشتن روی خود است. آن را یک‌جا یاد بگیرید.'
  fa.a2.unit45.lesson04.teach.state:
    title: آماده شدن، خسته شدن
    gloss: آماده، خسته، (نشانهٔ مفعول)، کردم
    note: '*آماده کردم* یعنی «آماده ساختم» و *خسته کردم* یعنی «خسته ساختم»؛ با *خودم رو* می‌شود «خودم را آماده کردم» و «خودم را خسته کردم». *رو* چیزی را نشان می‌دهد که کار بر آن انجام می‌شود.'
    example_gloss:
    - خودم را آماده کردم.
    - خودم را خسته کردم.
  fa.a2.unit45.lesson04.teach.time:
    title: این هفته
    gloss: این، هفته
    note: '*این هفته* یعنی «همین هفته».'
    example_gloss:
    - این هفته خودم را خسته کردم.
  fa.a2.unit45.lesson04.teach.make:
    title: پختن شام
    gloss: شام، درست، کردی
    note: '*درست کردم* یعنی «پختم»: *شام درست کردم* یعنی «شام پختم».'
    example_gloss:
    - شام را خودم پختم.
    - آیا خودت آن را پختی؟
  fa.a2.unit45.lesson04.teach.reflexive:
    title: خود به حیث مفعول
    gloss: خودم را آماده کردم؛ خودم را خسته کردم
    note: 'وقتی کار بر خود شخص انجام می‌شود، *خود* با پسوندش *رو* می‌گیرد و پیش از فعل می‌آید: *خودم رو آماده کردم*. در گفتار تند، *خودم رو* اغلب *خودمو* گفته می‌شود.'
  fa.a2.unit45.lesson04.teach.emphatic:
    title: خود برای تأکید
    gloss: شام را خودم پختم؛ آیا خودت آن را پختی؟
    note: '*خود* پیش از فعل و بدون *رو* تأکید می‌کند که خودت این کار را کردی، نه کس دیگر. جمله درست مثل حالتی ساخته می‌شود که *خودم* در آن نباشد.'
  fa.a2.unit45.lesson05.teach.words:
    title: کلمه‌های متن
    gloss: کار، داشتم، بودم، بود، بد، جمعه، اول، بعدش، یک، ساعت، حالا، و
    note: '*بودم* یعنی «بودم» و *بود* یعنی «بود»؛ *داشتم* یعنی «داشتم».'
    example_gloss:
    - این هفته کار داشتم.
    - خسته بودم و حالم خراب بود.
    - روز جمعه اول دوش گرفتم.
    - بعد یک ساعت استراحت کردم.
    - حالا خوشحالم.
  fa.a2.unit45.lesson05.teach.reading:
    title: یک هفته و یک جمعه
    gloss: این هفته خیلی کار داشتم. خسته بودم و حالم خراب بود. روز جمعه از خودم مراقبت کردم. اول دوش گرفتم. بعد یک ساعت استراحت کردم. حالا خوشحالم و حالم خوب است.
    note: یک بار برای احساسات بخوانید، بار دوم برای اینکه گوینده برای بهتر شدن حالش چه کرد.
  fa.a2.unit45.lesson06.teach.turn01:
    title: سارا از نیما می‌پرسد حالش چطور است
    gloss: 'سارا: نیما، حالت چطور است؟'
    note: '*حالت چطوره؟* می‌پرسد حالت چطور است.'
  fa.a2.unit45.lesson06.teach.turn02:
    title: نیما می‌گوید خسته است
    gloss: 'نیما: خیلی خسته استم. این هفته خودم را خسته کردم.'
    note: '*خودم رو خسته کردم* الگوی انعکاسی را نشان می‌دهد.'
  fa.a2.unit45.lesson06.teach.turn03:
    title: سارا نصیحت می‌کند
    gloss: 'سارا: باید از خودت مراقبت کنی.'
    note: '*باید* با *کنی* می‌گوید کسی چه باید بکند.'
  fa.a2.unit45.lesson06.teach.turn04:
    title: نیما برنامهٔ روزانه‌اش را تعریف می‌کند
    gloss: 'نیما: بلی. صبح‌ها دوش می‌گیرم، اما ورزش نمی‌کنم.'
    note: '*ولی* یعنی «اما»؛ *نمی‌کنم* شکل منفی *می‌کنم* است.'
  fa.a2.unit45.lesson06.teach.turn05:
    title: سارا می‌گوید مواظب باش
    gloss: 'سارا: مواظب خودت باش! کمی استراحت کن.'
    note: '*استراحت کن* امر دوستانه است: *می‌* و پسوند شخص را بردار.'
  fa.a2.unit45.lesson06.teach.turn06:
    title: نیما موافقت می‌کند
    gloss: 'نیما: خوب. امشب زود می‌خوابم.'
    note: '*باشه* یعنی «باشد، خوب».'
exercises:
  fa.a2.unit45.lesson01.exercise01.recognize_tired:
    instruction: این جمله چه معنا دارد؟
    correct_option: امروز خیلی خسته استم.
    distractors:
    - امروز خیلی خسته بودم.
    - امروز کمی خسته استم.
    - امروز خیلی پریشان استم.
    accepted_answers:
    - value: امروز خیلی خسته استم.
      status: correct
    feedback: '*خیلی* یعنی «بسیار» و *خسته‌م* یعنی «خسته استم».'
  fa.a2.unit45.lesson01.exercise02.recognize_bad:
    instruction: این جمله چه معنا دارد؟
    correct_option: حالم بد است.
    distractors:
    - حالم خوب است.
    - من غصه دارم.
    - حالت چطور است؟
    accepted_answers:
    - value: حالم بد است.
      status: correct
    feedback: '*حالم بده* یعنی «حالم خراب است».'
  fa.a2.unit45.lesson01.exercise03.match_feelings:
    instruction: هر مورد فارسی را با معنایش وصل کنید.
    accepted_answers:
    - value:
        خوشحالم: من خوشحال هستم
        ناراحتم: من ناراحتم
        خسته‌م: من خسته هستم
        عصبانیم: من خشمگینم
        نگرانم: من پریشانم
        حالم خوبه: حالم خوب است
        حالم بده: حالم بد است
        خیلی: بسیار
      status: correct
    feedback: هر کلمهٔ احساس به *-م* ختم می‌شود، یعنی «استم».
    pairs:
    - left: خوشحالم
      right: من خوشحال هستم
    - left: ناراحتم
      right: من ناراحتم
    - left: خسته‌م
      right: من خسته هستم
    - left: عصبانیم
      right: من خشمگینم
    - left: نگرانم
      right: من پریشانم
    - left: حالم خوبه
      right: حالم خوب است
    - left: حالم بده
      right: حالم بد است
    - left: خیلی
      right: بسیار
  fa.a2.unit45.lesson01.exercise04.order_happy:
    instruction: 'کلمه‌ها را مرتب کنید تا بگویین: امروز خیلی خوشحال استم.'
    accepted_answers:
    - value:
      - امروز
      - خیلی
      - خوشحالم
      status: correct
    - value:
      - خیلی
      - خوشحالم
      - امروز
      status: correct
    feedback: '*امروز خیلی خوشحالم*: زمان، درجه، احساس.'
  fa.a2.unit45.lesson01.exercise05.fill_worried:
    instruction: 'جمله را با کلمهٔ احساس کامل کنید: امروز خیلی پریشان استم.'
    accepted_answers:
    - value: نگرانم
      status: correct
    feedback: جملهٔ کامل *امروز خیلی نگرانم* است.
  fa.a2.unit45.lesson01.exercise06.answer_feeling:
    instruction: 'به فارسی ایران جواب بدهین: بگویین امروز حالتان خراب است.'
    accepted_answers:
    - value: حالم بده
      status: correct
    - value: امروز حالم بده
      status: correct
    - value: من امروز حالم بده
      status: acceptable_with_note
      note: '*من* درست است، اما معمولاً گفته نمی‌شود.'
    feedback: 'نمونه: *امروز حالم بده.*'
  fa.a2.unit45.lesson01.exercise07.translate_worried:
    instruction: 'به فارسی ایران ترجمه کنید: امروز کمی نگرانم.'
    accepted_answers:
    - value: امروز یکم نگرانم
      status: correct
    - value: یکم نگرانم امروز
      status: correct
    - value: من امروز یکم نگرانم
      status: acceptable_with_note
      note: '*من* درست است، اما معمولاً گفته نمی‌شود.'
    - value: امروز یکم نگران هستم
      status: acceptable_with_note
      note: این درست است، اما از شکل گفتاری رسمی‌تر معلوم می‌شود.
    feedback: 'نمونه: *امروز یکم نگرانم.*'
  fa.a2.unit45.lesson02.exercise01.recognize_myself:
    instruction: این جمله چه معنا دارد؟
    correct_option: من از خودم مراقبت می‌کنم.
    distractors:
    - از تو مراقبت می‌کنم.
    - او از خودش مراقبت می‌کند.
    - ما از خودما مراقبت می‌کنیم.
    accepted_answers:
    - value: من از خودم مراقبت می‌کنم.
      status: correct
    feedback: '*خودم* و *می‌کنم* هر دو به «من» اشاره می‌کنند.'
  fa.a2.unit45.lesson02.exercise02.recognize_take_care:
    instruction: این جمله چه معنا دارد؟
