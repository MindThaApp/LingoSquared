teaching:
  fa.a2.unit13.lesson01.teach.pipe_word:
    title: نل
    gloss: نل
    note: '*لوله* کلمهٔ عمومی برای نل یا پایپ آب است.'
    example_gloss: نل حمام چکه می‌کند.
  fa.a2.unit13.lesson01.teach.leak_word:
    title: چکه
    gloss: چکه / چکیدن
    note: '*چکه* یعنی چکیدن آب؛ با *کردن* به شکل *چکه کردن* (چکیدن) استفاده می‌شود.'
    example_gloss: نل چکه می‌کند.
  fa.a2.unit13.lesson01.teach.radiator_word:
    title: شوفاژ
    gloss: شوفاژ / بخاری
    note: '*شوفاژ* کلمهٔ عام فارسی ایران برای رادیاتور یا بخاری است.'
    example_gloss: شوفاژ خراب شده است.
  fa.a2.unit13.lesson01.teach.broken_word:
    title: خراب
    gloss: خراب
    note: '*خراب* یعنی از کار افتاده؛ با *شدن* به شکل *خراب شدن* (از کار افتادن) استفاده می‌شود.'
    example_gloss: شوفاژ خراب شده است.
  fa.a2.unit13.lesson01.teach.super_word:
    title: سرایدار
    gloss: سرایدار / چوکیدار ساختمان
    note: '*سرایدار* کسی است که یک ساختمان آپارتمانی را اداره و نگهداری می‌کند.'
    example_gloss: من به سرایدار زنگ زدم.
  fa.a2.unit13.lesson01.teach.repair_word:
    title: تعمیر
    gloss: ترمیم
    note: '*تعمیر* کلمهٔ عام برای درست کردن چیز خراب است.'
    example_gloss: تعمیرش کی می‌آید؟
  fa.a2.unit13.lesson01.teach.va_word:
    title: و
    gloss: و
    note: '*و* حرف ربطی است که در این بخش بسیار استفاده می‌شود.'
    target_text: و (حرف عطف)
  fa.a2.unit13.lesson01.teach.ra_note:
    title: Object marker
    gloss: (مفعول معین را نشان می‌دهد)
    note: '*رو* (شکل محاوره‌ای *را*) مفعول معین را نشان می‌دهد و درست بعد از چیزی می‌آید که روی آن کار انجام می‌شود.'
    target_text: رو (نشانهٔ مفعول)
  fa.a2.unit13.lesson02.teach.pipe_leaking:
    title: بیان مشکل
    gloss: نل حمام چکه می‌کند.
    note: '*داره چکه می‌کنه* از ساختار حال استمراری *داره + فعل* استفاده می‌کند تا مشکلی را که ادامه دارد بیان کند، نه یک واقعیت یک‌باره.'
  fa.a2.unit13.lesson02.teach.when_can_repair:
    title: پرسیدن دربارهٔ وقت تعمیر
    gloss: کی می‌توانید بیایید و آن را تعمیر کنید؟
    note: '*کی می‌تونید ...؟* با احترام می‌پرسد که کسی چه وقت می‌تواند کاری را انجام دهد.'
  fa.a2.unit13.lesson02.teach.full_report_and_question:
    title: ترکیب گزارش و سوال
    gloss: نل حمام چکه می‌کند. کی می‌توانید بیایید و آن را تعمیر کنید؟
    note: الگوی کامل گزارش و سوال که این درس بر آن ساخته شده است.
  fa.a2.unit13.lesson03.teach.request_word:
    title: درخواست
    gloss: درخواست
    note: '*درخواست* کلمهٔ عام برای خواهش یا طلب است که اینجا با *ثبت شد* (ثبت گردید) آمده است.'
    example_gloss: درخواست تعمیر شما ثبت شد.
  fa.a2.unit13.lesson03.teach.repairman_word:
    title: تعمیرکار
    gloss: تعمیرکار
    note: '*تعمیرکار* کسی است که برای تعمیر می‌آید.'
    example_gloss: تعمیرکار فردا می‌آید.
  fa.a2.unit13.lesson03.teach.notice_text:
    title: تأییدیهٔ درخواست تعمیر
    gloss: درخواست تعمیر شما ثبت شد. تعمیرکار فردا ساعت ۱۰ صبح می‌آید. لطفاً در خانه باشید.
    note: یک تأییدیهٔ رسمی کوتاه به سبک نوشتاری معمولی، اما باز هم از *میاد* و *خونه* که در گفتار روزمره استفاده می‌شود، کار گرفته است.
  fa.a2.unit13.lesson04.teach.since_when:
    title: پرسیدن از چه وقت
    gloss: از کی به این حالت است؟
    note: '*از کی این‌طوریه؟* می‌پرسد که مشکل از چه وقت شروع شده است.'
  fa.a2.unit13.lesson04.teach.turn01:
    title: سارا مشکل را می‌گوید
    gloss: سارا سلام می‌کند و می‌گوید نل حمام من چکه می‌کند.
    note: همان ساختار حال استمراری درس دوم دوباره آمده است.
  fa.a2.unit13.lesson04.teach.turn02:
    title: سرایدار می‌پرسد از کی
    gloss: سرایدار می‌پرسد که از کی این‌طور است.
    note: سوال آغازین همین درس دوباره آمده است.
  fa.a2.unit13.lesson04.teach.turn03:
    title: سارا مدت و جزئیات بیشتر را می‌گوید
    gloss: سارا می‌گوید از دیروز. آب روی زمین می‌رود.
    note: '*از دیروز* مدت را بیان می‌کند؛ جملهٔ دوم جزئیات بیشتر می‌دهد.'
  fa.a2.unit13.lesson04.teach.turn04:
    title: سرایدار موافقت می‌کند که بیاید
    gloss: سرایدار می‌گوید باشه، فردا صبح می‌آیم و تعمیرش می‌کنم.
    note: '*میام* (شکل محاوره‌ای *می‌آیم*) برنامهٔ خود گوینده را بیان می‌کند.'
  fa.a2.unit13.lesson04.teach.turn05:
    title: سارا تأیید می‌کند که در خانه است
    gloss: سارا تشکر می‌کند و می‌گوید تا ساعت ۱۱ در خانه است.
    note: '*خونه‌ام* (شکل محاوره‌ای *خانه هستم*) آماده بودن خود گوینده را بیان می‌کند.'
  fa.a2.unit13.lesson04.teach.turn06:
    title: سرایدار تأیید می‌کند
    gloss: سرایدار می‌گوید بسیار خوب، آن وقت می‌بینمتان.
    note: '*می‌بینمتون* (شما را می‌بینم) تماس را با احترام تمام می‌کند.'
