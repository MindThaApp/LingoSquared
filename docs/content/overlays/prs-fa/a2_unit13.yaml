  description: 'فارسی ایرانی سطح ابتدایی بالا: گزارش دادن نل چکان به سرایدار ساختمان، خواندن تأییدیهٔ درخواست ترمیم و دنبال کردن گفتگوی تلفنی که ترمیم را تنظیم می‌کند.'
