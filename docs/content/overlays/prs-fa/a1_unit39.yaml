    gloss: حالت اضطراری
    note: '*اورژانس* به معنای «حالت اضطراری» است و همین واژه برای بخش اضطراری شفاخانه هم استفاده می‌شود.'
    example_gloss: حالت اضطراری است! کمک!
  fa.a1.unit39.lesson04.teach.review_alo_bashe_mamnoon:
    title: 'مرور: الو / خوب / تشکر'
    gloss: الو (در تیلفون) / خوب / تشکر
    note: '*الو*، *باشه* و *ممنون* پیشتر معرفی شدند.'
  fa.a1.unit39.lesson04.teach.review_miad:
    title: می‌آید
    gloss: می‌آید
    note: '*میاد* («او می‌آید») از همان الگوی شناسه‌ها پیروی می‌کند که *میام* («من می‌آیم») که پیشتر یاد گرفتید.'
  fa.a1.unit39.lesson04.teach.zud_biayid:
    title: زود بیایید!
    gloss: زود بیایید!
    note: '*زود* به معنای «زود، تند» است؛ *بیایید* امر مؤدبانهٔ «بیایید!» است.'
