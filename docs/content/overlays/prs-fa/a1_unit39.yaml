    title: ضروری
    gloss: لازم است
    note: '*لازمه* یک کلمه است به معنی «لازم است»، و مثل *قشنگه* («قشنگ است») و *گرمه* («گرم است») ساخته شده.'
    example_gloss: کمک لازم است!
  fa.a1.unit39.lesson01.teach.polis:
    title: پولیس
    gloss: پولیس
    note: '*پلیس* به معنای «پولیس» است، یک واژهٔ قرضی که در گفتار روزمره استفاده می‌شود.'
    example_gloss: پولیس لازم است!
  fa.a1.unit39.lesson01.teach.ambulance:
    title: امبولانس
    gloss: آمبولانس
    note: '*آمبولانس* به معنای «امبولانس» است.'
    example_gloss: امبولانس لازم است!
  fa.a1.unit39.lesson02.teach.atashneshani:
    title: اداره آتش‌نشانی
    gloss: اداره آتش‌نشانی
    note: '*آتش‌نشانی* به معنای «اداره آتش‌نشانی» یا «دستهٔ آتش‌نشانی» است.'
    example_gloss: اداره آتش‌نشانی لازم است!
  fa.a1.unit39.lesson02.teach.atash:
    title: آتش
    gloss: آتش‌سوزی
    note: '*آتش* به معنای «آتش» است و ریشهٔ *آتش‌نشانی* («اداره آتش‌نشانی») می‌باشد.'
    example_gloss: آتش! اداره آتش‌نشانی لازم است!
  fa.a1.unit39.lesson02.teach.khatar:
    title: خطر
    gloss: خطر
    note: '*خطر* به معنای «خطر» است.'
    example_gloss: خطر! پولیس لازم است!
  fa.a1.unit39.lesson03.teach.review_ken_konid:
    title: 'مرور: امر رسمی و غیررسمی'
    gloss: بکنید! (رسمی) / بکن! (غیررسمی)
    note: '*کنید* پسوند امر رسمی یا جمع است. *کن* که غیررسمی است و با دوستان در *استراحت کن* («آرام بگیر!») به کار بردید، برای یک نفر است که او را خوب می‌شناسید.'
  fa.a1.unit39.lesson03.teach.komak_konid:
    title: کمک!
    gloss: کمک!
    note: '*کمک کنید!* شیوهٔ مؤدبانهٔ کمک خواستن است و برای آدم‌های ناشناس و کارمندان امدادی مناسب است.'
  fa.a1.unit39.lesson03.teach.tasadof:
