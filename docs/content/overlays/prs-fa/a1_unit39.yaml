    title: تیلفون کنید!
    gloss: تیلفون کنید!
    note: '*زنگ بزنید!* امر مؤدبانه از مصدر *زنگ زدن* («تیلفون کردن») است که پیشتر یاد گرفتید.'
  fa.a1.unit39.lesson04.teach.dialogue_line1:
    title: 'نیما: الو! کمک! پولیس لازم است!'
    gloss: الو! کمک! پولیس لازم است!
  fa.a1.unit39.lesson04.teach.dialogue_line2:
    title: 'سارا: خوب. پولیس می‌آید.'
    gloss: خوب. پولیس می‌آید.
  fa.a1.unit39.lesson04.teach.dialogue_line3:
    title: 'نیما: تشکر! زود بیایید!'
    gloss: تشکر! زود بیایید!
  fa.a1.unit39.lesson04.teach.dialogue_line4:
    title: 'سارا: خوب!'
    gloss: خوب!
  fa.a1.unit39.lesson05.teach.reading_note:
    title: دربارهٔ این اعلان
    gloss: حادثه / خطر / آتش
    note: در این اعلان، بعد از هر نوع حالت اضطراری علامت سؤال آمده است، مثل این‌که بپرسد «در صورت حادثه؟». خدمتی که باید به آن تیلفون کرد بلافاصله بعد از آن می‌آید.
  fa.a1.unit39.lesson05.teach.reading_text:
    title: 'خواندن: اعلان اضطراری'
    gloss: حادثه؟ امبولانس لازم است! خطر؟ پولیس لازم است! آتش؟ اداره آتش‌نشانی لازم است! زود تیلفون کنید!
    note: یک اعلان کوتاه که نشان می‌دهد برای هر نوع حالت اضطراری به کدام خدمت باید تیلفون کرد.
