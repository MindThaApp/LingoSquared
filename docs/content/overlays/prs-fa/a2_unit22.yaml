teaching:
  fa.a2.unit22.lesson01.teach.people_time:
    title: آدم‌ها و وقت
    gloss: من، تو، سارا، نیما، امروز، صبح، دیر
    note: '*امروز صبح* یعنی «همین صبح». در فارسی ایران اغلب *من* گفته نمی‌شود، چون شناسهٔ فعل خودش «من» را نشان می‌دهد.'
    example_gloss:
    - امروز صبح دیر بیدار شدم.
    - سارا امروز به نیما تیلفون کرد.
  fa.a2.unit22.lesson01.teach.morning_nouns:
    title: کلمه‌های صبح و رفت‌وآمد
    gloss: خانه، دوش، لباس، ناشتا، کلید، دروازه، موتر، بس
    note: '*صبحونه* شکل عادیِ گفتاری «ناشتا» است؛ در نوشتار دقیق *صبحانه* نوشته می‌شود.'
    example_gloss:
    - در خانه دوش گرفتم.
    - ناشتا خوردم و لباس پوشیدم.
    - کلیدم در موتر بود.
  fa.a2.unit22.lesson01.teach.actions:
    title: چهار کار صبح
    gloss: بیدار شدم، دوش گرفتم، لباس پوشیدم، ناشتا خوردم
    note: هر عبارت به یک فعل سبکِ گذشتهٔ ساده ختم می‌شود. هر عبارت را یکجا، به‌عنوان یک کار یاد بگیرید.
    example_gloss:
    - امروز صبح بیدار شدم.
    - بعد دوش گرفتم.
    - لباس پوشیدم و ناشتا خوردم.
  fa.a2.unit22.lesson01.teach.compound_shape:
    title: فعل‌های مرکب در گذشته
    gloss: بیدار شدم، دوش گرفتم، لباس پوشیدم
    note: 'بسیاری از کارها در فارسی ایران دو بخش دارند: یک اسم یا صفت و یک فعل سبک. بخش دوم زمان گذشته را نشان می‌دهد: *بیدار شدم*، *دوش گرفتم*، *لباس پوشیدم*.'
  fa.a2.unit22.lesson02.teach.more_actions:
    title: دروازه، موتر، تیلفون و نامه
    gloss: دروازه را باز کردم، دروازه را بستم، موتر را روشن کردم، تیلفون کردم، نامه نوشتم
    note: '*رو* مفعولِ معلوم را در گفتار نشان می‌دهد: *در رو* یعنی «دروازه» و *ماشین رو* یعنی «موتر».'
    example_gloss:
    - دروازه را باز کردم و بعد بستمش.
    - موتر را روشن کردم.
    - به سارا تیلفون کردم و نامه نوشتم.
  fa.a2.unit22.lesson02.teach.small_words:
    title: کلمه‌های کوچکِ کارآمد
    gloss: به، یک، و، ولی، چه، رسیدم
    note: '*یه* شکل عادیِ گفتاری «یک» است. *رسیدم* گزارش رفت‌وآمد را تمام می‌کند: «رسیدم».'
    example_gloss:
    - به سارا تیلفون کردم.
    - نامه نوشتم ولی دیر رسیدم.
  fa.a2.unit22.lesson02.teach.sequence:
    title: کلمه‌های ترتیب
    gloss: اول، بعد، بعدش، آخر، تا آن وقت
    note: 'با این کلمه‌ها ترتیب کارها را روشن بگویید. *تا اون موقع* یعنی «تا آن وقت». با آن، کار پیشین به ماضی بعید (صفت مفعولی + بود) می‌آید: *اتوبوس رفته بود* = بس رفته بود. این شکل را در یک درس بعدی تمرین می‌کنید.'
    example_gloss:
    - اول دروازه را باز کردم.
    - بعدش موتر را روشن کردم.
    - تا آن وقت دیر شده بود؛ آخر رسیدم.
  fa.a2.unit22.lesson02.teach.light_verbs:
    title: فعل سبک زمان را نشان می‌دهد
    gloss: باز کرد، روشن کرد، تیلفون کرد، بیدار شد
    note: 'بخش اول نام کار است؛ بخش دوم با زمان و شخص تغییر می‌کند: *باز کردم*، *روشن کردم*، *زنگ زدم*، *بیدار شدم*.'
  fa.a2.unit22.lesson02.teach.ro_rule:
    title: رو برای معلوم، یه برای نامعلوم
    gloss: دروازه را باز کردم؛ یک نامه نوشتم
    note: 'بعد از مفعولِ معلوم *رو* بگویید: *در رو باز کردم*. مفعولِ نامعلوم با *یه* معمولاً *رو* ندارد: *یه نامه نوشتم*.'
  fa.a2.unit22.lesson03.teach.negative_forms:
    title: فعل‌های مرکبِ منفی
    gloss: کار نکردم، تیلفون نکردم، ناشتا نخوردم، دروازه را باز نکردم
    note: '*نـ* را بر فعل سبکِ صرف‌شده بگذارید: *کار نکردم*، *زنگ نزدم*، *صبحونه نخوردم*. اسم تغییر نمی‌کند.'
  fa.a2.unit22.lesson03.teach.negative_place:
    title: فعل سبک را منفی کنید، نه اسم را
    gloss: نـ به فعل سبک می‌چسبد
    note: '*کار نکردم* و *زنگ نزدم* بگویید. اگر منفی را به اسم بچسبانید، شکل غلط می‌شود.'
  fa.a2.unit22.lesson03.teach.definite_indefinite:
    title: رو هست یا نیست
    gloss: دروازه را بستم؛ یک نامه نوشتم
    note: '*در* دروازهٔ معلوم است، پس *رو* می‌گیرد. *یه نامه* نامعلوم است، پس رو نمی‌گیرد.'
  fa.a2.unit22.lesson04.teach.problem_actions:
    title: وقتی صبح خراب می‌شود
    gloss: پیدایش کردم، پیدایش نکردم، فراموشم شد، بس از دستم رفت
    note: '*از دستم رفت* در اصل یعنی چیزی «از دستم رفت»؛ درباره بس یعنی «بسم رفت».'
    example_gloss:
    - کلیدم را پیدا کردم.
    - کلیدم را پیدا نکردم و بس از دستم رفت.
    - نامه از یادم رفت.
  fa.a2.unit22.lesson04.teach.question:
    title: بعد چه شد؟
    gloss: امروز صبح چه شد؟ بعدش چه شد؟
    note: این پرسش‌ها گزارشی به ترتیب می‌خواهند؛ پس با کلمه‌های ترتیب و شکل‌های گذشته جواب بدهید.
  fa.a2.unit22.lesson05.teach.reading:
    title: صبحی که خراب شد
    gloss: امروز صبح دیر بیدار شدم. اول دوش گرفتم و لباس پوشیدم. ناشتا نخوردم. بعدش دروازه را بستم، ولی کلیدم را پیدا نکردم. تا آن وقت بس رفته بود. آخر به سارا تیلفون کردم و با موتر رسیدم.
    note: یک بار برای ترتیب کارها بخوانید، بار دوم برای دو مرحله‌ای که طبق نقشه پیش نرفت.
  fa.a2.unit22.lesson06.teach.turn01:
    title: سارا می‌پرسد چه شد
    gloss: 'سارا از نیما می‌پرسد: امروز صبح چه شد؟'
    note: این آغاز، کل ماجرا را به ترتیب می‌پرسد.
  fa.a2.unit22.lesson06.teach.turn02:
    title: نیما ماجرا را شروع می‌کند
    gloss: نیما دیر بیدار شد
    showered and dressed: null
    but did not eat breakfast.: null
    note: مرحلهٔ منفی با مرحله‌های انجام‌شده فرق دارد.
  fa.a2.unit22.lesson06.teach.turn03:
    title: سارا مرحلهٔ بعد را می‌پرسد
    gloss: 'سارا می‌پرسد: بعدش چه شد؟'
    note: '*بعدش* روایت را پیش می‌برد.'
  fa.a2.unit22.lesson06.teach.turn04:
    title: مشکل رفت‌وآمد
    gloss: نیما کلیدش را پیدا کرده نتوانست و تا آن وقت بس رفته بود.
    note: این دو واقعیت نشان می‌دهند که صبح از کجا خراب شد.
  fa.a2.unit22.lesson06.teach.turn05:
    title: سارا از آخر ماجرا می‌پرسد
    gloss: 'سارا می‌پرسد: آخرش چه کار کردی؟'
    note: '*آخرش* قدم آخر را نشان می‌دهد.'
  fa.a2.unit22.lesson06.teach.turn06:
    title: نیما قصه‌اش را تمام می‌کند
    gloss: نیما به سارا زنگ زد و موترش را روشن کرد. آخرش رسید.
    started the car: null
    and finally arrived.: null
    note: این دو کار آخر که تمام شده‌اند، مشکل رفت‌وآمد را حل می‌کنند.
