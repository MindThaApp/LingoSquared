  fa.a1.unit22.lesson05.teach.goodbye_call:
    title: خداحافظ، بعداً صحبت می‌کنیم
    gloss: خداحافظ، بعداً صحبت می‌کنیم
    note: بعداً یعنی «بعد از این»؛ صحبت می‌کنیم زمان حال/آینده است، یعنی «صحبت می‌کنیم / صحبت خواهیم کرد».
  fa.a1.unit22.lesson05.teach.better_now:
    title: حالا بهتر شد؟
    gloss: حالا بهتر شد؟
    note: الان یعنی «حالا»؛ بهتر شد در اصل «بهتر گردید» است. در فارسی ایران برای پرسیدن حال و وضعیت، به‌طور طبیعی از زمان گذشته استفاده می‌شود.
  fa.a1.unit22.lesson06.teach.how_are_you:
    title: سلام نرگس، چطوری؟
    gloss: سلام نرگس، چطوری؟
    note: '*چطوری* شکل غیررسمی «حال شما چطور است» است و اینجا مناسب است، چون علی و نرگس دوست هستند.'
  fa.a1.unit22.lesson06.teach.cutting_out:
    title: صدایت قطع و وصل می‌شود
    gloss: صدایت قطع و وصل می‌شود
    note: قطع و وصل می‌شه در اصل «قطع و وصل می‌شود» است؛ عبارت رایج فارسی برای وقتی که صدای تلفن بریده‌بریده می‌آید.
  fa.a1.unit22.lesson06.teach.turn01:
    title: علی جواب می‌دهد
    gloss: 'علی: الو، بفرمایید.'
  fa.a1.unit22.lesson06.teach.turn02:
    title: نرگس خودش را معرفی می‌کند
    gloss: 'نرگس: سلام علی، من نرگس هستم.'
  fa.a1.unit22.lesson06.teach.turn03:
    title: علی جواب سلام را می‌دهد
    gloss: 'علی: سلام نرگس، چطوری؟'
  fa.a1.unit22.lesson06.teach.turn04:
    title: نرگس از او می‌خواهد آهسته‌تر صحبت کند
    gloss: 'نرگس: خوبم، تشکر. لطفاً آهسته‌تر صحبت کرده می‌توانی؟ صدایت قطع و وصل می‌شود.'
  fa.a1.unit22.lesson06.teach.turn05:
    title: علی می‌پرسد
    gloss: 'علی: باشه، حالا بهتر شد؟'
  fa.a1.unit22.lesson06.teach.turn06:
    title: نرگس پیام را می‌دهد
    gloss: 'نرگس: بلی، بهتر است. یک پیام برایت دارم، فردا ساعت چهار به کافه بیا.'
  fa.a1.unit22.lesson06.teach.they_go:
    title: آن‌ها می‌روند (محاوره‌ای)
    gloss: آنها می‌روند (شکل گفتاری)
    note: '*می‌رن* شکل گفتاری و غیررسمی *می‌روند* است، در همان سبک گفتاری که در بقیهٔ این کورس به کار رفته.'
    target_text: می‌رن (آن‌ها می‌روند، محاوره‌یی)
  fa.a1.unit22.lesson06.teach.turn07:
    title: علی تأیید می‌کند
    gloss: 'علی: باشه، حتماً می‌آیم.'
  fa.a1.unit22.lesson06.teach.turn08:
    title: نرگس تماس را ختم می‌کند
    gloss: 'نرگس: خداحافظ، بعداً صحبت می‌کنیم.'
  fa.a1.unit22.lesson06.teach.turn09:
    title: علی خداحافظی می‌کند
    gloss: 'علی: خداحافظ.'
