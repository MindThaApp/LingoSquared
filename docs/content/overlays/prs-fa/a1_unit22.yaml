    note: تلفن واژهٔ عمومی برای تلفون است.
    example_gloss: تلفونم کجاست؟
  fa.a1.unit22.lesson01.teach.message_word:
    title: پیام
    gloss: پیام
    note: پیام یعنی پیام نوشته‌شده یا متنی.
    example_gloss: یک پیام دارم.
  fa.a1.unit22.lesson01.teach.call_word:
    title: زنگ زدن
    gloss: زنگ زدن
    note: زنگ زدن (لفظاً «زنگ کردن») فعل روزمره برای تلفون کردن به کسی است.
    example_gloss: به من تلفون کن.
  fa.a1.unit22.lesson01.teach.voice_word:
    title: صدا
    gloss: صدا
    note: صدا یعنی آواز و صدای کسی؛ برای گفتن اینکه کسی در تلفون چطور به گوش می‌رسد.
    example_gloss: صدایت خوب است.
  fa.a1.unit22.lesson01.teach.va_word:
    title: و
    gloss: و
    note: و حرف ربط رایج است و از واحدهای پیشین مرور می‌شود.
    target_text: و (حرف ربط)
  fa.a1.unit22.lesson02.teach.hello_phone:
    title: سلام (در تلفون)
    gloss: سلام، بگویید
    note: الو سلام مخصوص تلفون است (رو در رو گفته نمی‌شود)؛ بفرمایید اینجا یعنی «بگویید، گوش می‌کنم».
  fa.a1.unit22.lesson02.teach.its_me:
    title: من استم، نرگس
    gloss: سلام، من نرگس استم
    note: '*منم* از *من* و پسوند فعل -م («استم») ساخته شده، پس یعنی «من استم» -- راه بسیار رایج معرفی خود در تلفون. (همین املا می‌تواند «من هم» هم باشد که *من هم* نوشته می‌شود؛ اینجا از متن معلوم است.)'
  fa.a1.unit22.lesson03.teach.can_you_repeat:
    title: تکرار کرده می‌توانی؟
    gloss: می‌توانید تکرار کنید؟
    note: می‌شه (محاوره‌یی برای می‌شود، «ممکن است») + تکرار کنید (تکرار کنید) شکل معیاری درخواست مودبانه است.
  fa.a1.unit22.lesson03.teach.speak_slower:
    title: لطفاً آهسته‌تر صحبت کنید
    gloss: لطفاً آهسته‌تر صحبت کنید
    note: آهسته‌تر شکل تفضیلی آهسته است، یعنی «آهسته‌تر».
  fa.a1.unit22.lesson04.teach.message_for_you:
    title: یک پیام برایت دارم
    gloss: یک پیام برایت دارم
