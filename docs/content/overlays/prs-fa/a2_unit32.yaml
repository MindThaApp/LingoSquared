teaching:
  fa.a2.unit32.lesson01.teach.problems:
    title: مشکلات کوچک
    gloss: سرم درد می‌کند، حالم خراب است، امتحان دارم، پول ندارم
    note: 'این‌ها مشکلاتی هستند که این واحد دربارهٔ آن‌ها نصیحت می‌دهد: صحت، درس و پول. *سرم درد می‌کنه* یعنی «سرم درد می‌کند».'
    example_gloss:
    - امروز سرم درد می‌کند.
    - فردا امتحان دارم.
    - حالم خراب است و پول ندارم.
  fa.a2.unit32.lesson01.teach.helpers:
    title: واژه‌های صحت، درس و پول
    gloss: استراحت، دوکتور، دواخانه، دوا، آب، قهوه، درس، خرچ
    note: '*داروخونه* شکل عادی گفتاری «دواخانه» است. *درس* هم «درس» است و هم مفعول «درس خواندن»: *درس بخونی*.'
    example_gloss:
    - من آب و قهوه دارم.
    - امشب درس دارم.
    - دوکتور و دواخانه.
  fa.a2.unit32.lesson01.teach.advice_verbs:
    title: شکل‌های فعل برای نصیحت
    gloss: تو استراحت کنی، بروی، بنوشی، درس بخوانی، بخوابی، خرچ کنی؛ زود، بیشتر، کمتر
    note: 'این‌ها شکل‌های *تو* با پایانهٔ *-ی* هستند: *کنی، بری، بخوری، بخونی، بخوابی*. این‌ها وجه التزامی هستند و بعد از *بهتره* می‌آیند.'
    example_gloss:
    - (که) زود بخوابی.
    - (که) بیشتر درس بخوانی.
    - (که) کمتر خرچ کنی.
  fa.a2.unit32.lesson01.teach.bahtare:
    title: بهتره + وجه التزامی
    gloss: بهتر است نزد دوکتور بروی؛ بهتر است استراحت کنی
    note: '*بهتره* یعنی «بهتر است (که)…» و نصیحت نرم می‌دهد. فعل بعد از آن به وجه التزامی است، اینجا با پایانهٔ *-ی* برای *تو*: *بهتره بری*، *بهتره استراحت کنی*. میان *بهتره* و فعل هیچ کلمهٔ اضافی نمی‌آید.'
  fa.a2.unit32.lesson02.teach.my_opinion:
    title: به نظر من
    gloss: فکر می‌کنم، به نظر من
    note: '*به نظرم* یعنی «به دید من» و راه معمول نرم کردن نصیحت است.'
    example_gloss:
    - به نظرم بهتر است آب بنوشی.
    - به نظرم بهتر است نزد دوکتور بروی.
  fa.a2.unit32.lesson02.teach.opinion_rule:
    title: به نظرم پیش از بهتره
    gloss: به نظرم بهتر است بیشتر درس بخوانی
    note: '*به نظرم* را اول بگو و بعد از آن همان ساختار را نگه دار: *به نظرم بهتره + التزامی*. این کار نصیحت را مثل نظر خودت نشان می‌دهد، نه مثل امر.'
  fa.a2.unit32.lesson03.teach.negative_verbs:
    title: شکل‌های منفی فعل
    gloss: (که) تو نخوری، نروی، نخوابی، نکنی؛ دیر، زیاد، خیلی
    note: 'منفی هر شکل التزامی برای *تو* با افزودن *نـ* در پیشِ فعل ساخته می‌شود: *بخوری → نخوری*، *بری → نری*، *بخوابی → نخوابی*، *کنی → نکنی*.'
    example_gloss:
    - (که) تو قهوه نخوری.
    - (که) تو دیر نخوابی.
    - (که) تو زیاد خرچ نکنی.
  fa.a2.unit32.lesson03.teach.must:
    title: باید
    gloss: باید، مجبور بودن
    note: '*باید* ضرورت قوی را می‌رساند: *باید بری دکتر* = «تو باید پیش دوکتور بروی.»'
    example_gloss:
    - فردا باید بیشتر درس بخوانی.
    - امروز باید پیش دوکتور بروی.
  fa.a2.unit32.lesson03.teach.negative_rule:
    title: مشورهٔ منفی
    gloss: بهتر است قهوه نخوری؛ بهتر است دیر نخوابی
    note: 'برای «بهتر است نکنی»، *بهتره* را نگه دار و *نـ* را به فعل بیفزا: *بهتره قهوه نخوری*. به خود *بهتره* منفی نیاور.'
  fa.a2.unit32.lesson03.teach.must_vs_better:
    title: باید از بهتره قوی‌تر است
    gloss: باید پیش دوکتور بروی؛ بهتر است پیش دوکتور بروی
    note: '*بهتره* را برای مشورهٔ دوستانه‌ای به کار ببر که می‌شود نادیده‌اش گرفت و *باید* را وقتی چیزی واقعاً ضروری است. بعد از هر دو، همان شکل فعلِ مثل *بری* می‌آید.'
  fa.a2.unit32.lesson04.teach.question:
    title: چه کنم؟
    gloss: چه کنم؟
    note: '*چیکار کنم؟* شکل معمول گفتاری برای مشوره خواستن است. فعل *کنم* شکل التزامی برای *من* است.'
  fa.a2.unit32.lesson04.teach.responses:
    title: جواب دادن به مشوره
    gloss: بلی، حق با تو است، فکر خوبی است، نمی‌دانم، شاید، نه
    note: '*حق با توئه* به معنای لفظی «حق با تو است» می‌باشد. این‌ها راه‌های دوستانه برای قبول کردن مشوره، تردید کردن یا رد کردن آن هستند.'
    example_gloss:
    - بلی، حق با تو است.
    - فکر خوبی است.
    - نمی‌دانم، شاید.
  fa.a2.unit32.lesson04.teach.respond_rule:
    title: سه راه جواب دادن به مشوره
    gloss: بلی، فکر خوبی است؛ نمی‌دانم، شاید
    note: با *آره، حق با توئه* یا *فکر خوبیه* موافقت کن. اگر مطمئن نیستی، بگو *نمی‌دونم، شاید*. گفتن یک *نه* ساده ممکن است، اما تند به نظر می‌رسد.
  fa.a2.unit32.lesson05.teach.reading:
    title: یک پیام و یک جواب
    gloss: سلام سارا. فردا امتحان دارم، اما سرم درد می‌کند و حالم خراب است. چه کنم؟ سلام نیما. به نظرم بهتر است امشب استراحت کنی و آب بنوشی. بهتر است قهوه نخوری و زود بخوابی.
    note: سه جملهٔ اول پیام نیما است؛ بقیه جواب سارا است. اول مشکل را پیدا کن، بعد سه مشورە را.
  fa.a2.unit32.lesson06.teach.turn01:
    title: نوبت ۱
    gloss: نیما مشکلش را می‌گوید و می‌پرسد چه کند.
    note: او دو واقعیت را می‌گوید، بعد مشوره می‌خواهد.
  fa.a2.unit32.lesson06.teach.turn02:
    title: نوبت ۲
    gloss: سارا دو مشوره می‌دهد.
    note: '*به نظرم* مشوره را نرم‌تر می‌کند.'
  fa.a2.unit32.lesson06.teach.turn03:
    title: نوبت ۳
    gloss: نیما مشوره را قبول می‌کند، اما می‌گوید باید درس بخواند.
    note: '*باید* اینجا ضرورتِ قویِ خودِ نیما است.'
  fa.a2.unit32.lesson06.teach.turn04:
    title: نوبت ۴
    gloss: سارا به او مشوره می‌دهد امشب درس نخواند و زود بخوابد.
    note: اول مشورهٔ منفی، بعد مشورهٔ مثبت.
  fa.a2.unit32.lesson06.teach.turn05:
    title: نوبت ۵
    gloss: نیما مطمئن نیست، اما قبول می‌کند که شاید سارا حق داشته باشد.
    note: جواب مردد به مشوره.
  fa.a2.unit32.lesson06.teach.turn06:
    title: نوبت ۶
    gloss: 'سارا می‌افزاید: پس بهتر است فردا پیش دوکتور بروی.'
    note: '*پس* یعنی «بنابراین، آن‌وقت».'
