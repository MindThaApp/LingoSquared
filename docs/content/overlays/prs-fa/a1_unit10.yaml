teaching:
  fa.a1.unit10.lesson01.teach.shanbe_yekshanbe:
    title: شنبه، یکشنبه
    gloss: شنبه، یکشنبه
    note: شنبه و یکشنبه دو روز اول هفتهٔ ایرانی هستند که از شنبه شروع می‌شود.
    example_gloss:
    - امروز شنبه است.
    - فردا یکشنبه است.
  fa.a1.unit10.lesson01.teach.doshanbe_seshanbe:
    title: دوشنبه، سه‌شنبه
    gloss: دوشنبه، سه‌شنبه
    note: دوشنبه و سه‌شنبه بعد از شنبه و یکشنبه می‌آیند.
    example_gloss:
    - من روز دوشنبه صنف دارم.
    - من روز سه‌شنبه ملاقات دارم.
  fa.a1.unit10.lesson01.teach.chaharshanbe_panjshanbe:
    title: چهارشنبه، پنجشنبه
    gloss: چهارشنبه، پنجشنبه
    note: چهارشنبه و پنجشنبه روزهای میانه تا آخر هفته هستند.
    example_gloss:
    - من روز چهارشنبه کار می‌کنم.
    - روز پنجشنبه شما را می‌بینم.
  fa.a1.unit10.lesson01.teach.jome:
    title: جمعه
    gloss: جمعه
    note: جمعه آخرین روز هفته و رخصتی هفته‌گی سنتی در ایران است.
    example_gloss: جمعه رخصتی است.
  fa.a1.unit10.lesson01.teach.weekend_note:
    title: رخصتی هفته‌گی
    gloss: جمعه رخصتی هفته‌گی است.
    note: جمعه (روز جمعه) روز رخصتی سنتی هفته در ایران است، هرچند بعضی جاهای کار امروزی پنجشنبه بعد از چاشت را هم بسته می‌کنند.
  fa.a1.unit10.lesson02.teach.farvardin:
    title: حمل (ماه اول)
    gloss: حمل، ماه اول سال شمسی
    note: فروردین سال شمسی ایران را شروع می‌کند، تقریباً در اواخر مارچ (نزدیک اعتدال بهاری و نوروز).
    example_gloss: حمل ماه اول سال است.
  fa.a1.unit10.lesson02.teach.ordibehesht:
    title: ثور (ماه دوم)
    gloss: ثور، ماه دوم
    note: اردیبهشت بعد از فروردین می‌آید، تقریباً اپریل تا می.
    example_gloss: هوا در ثور خوب است.
  fa.a1.unit10.lesson02.teach.khordad:
    title: جوزا (ماه سوم)
    gloss: جوزا، ماه سوم
    note: خرداد بعد از اردیبهشت می‌آید، تقریباً می تا جون.
    example_gloss: من در جوزا به دنیا آمدم.
  fa.a1.unit10.lesson02.teach.calendar_note:
    title: تقویم شمسی ایران
    gloss: ایران از تقویم هجری شمسی استفاده می‌کند.
    note: '*ایران از تقویم هجری شمسی استفاده می‌کنه* می‌گوید که ایران این تقویم را برای تاریخ‌های روزمره به کار می‌برد؛ افغانستان هم از همین نوع تقویم استفاده می‌کند، اما نام ماه‌ها فرق دارد: در ایران نام‌های فارسی باستانی مثل فروردین و در افغانستان نام‌هایی مثل حمل و ثور.'
  fa.a1.unit10.lesson03.teach.what_day_today:
    title: امروز چه روز است؟
    gloss: امروز چه روز است؟
    note: امروز چندشنبه‌ست؟ در اصل می‌پرسد «امروز کدام روز هفته است؟»؛ ـه در آخر شکل گفتاری چندشنبه است می‌باشد.
  fa.a1.unit10.lesson03.teach.today_word:
    title: امروز
    gloss: امروز
    note: امروز یعنی همین روزی که در آن هستیم.
    example_gloss: امروز تاریخ چند است؟
  fa.a1.unit10.lesson04.teach.give_full_date:
    title: امروز پنجشنبه، دهم ثور است.
    gloss: امروز پنجشنبه، دهم ثور است.
    note: امروز پنجشنبه، دهم اردیبهشته نام روز، تاریخ ترتیبی و نام ماه را در یک جمله می‌آورد و از شکل گفتاری ـه استفاده می‌کند (اردیبهشته = اردیبهشت است).
  fa.a1.unit10.lesson04.teach.tarikh_word:
    title: تاریخ
    gloss: تاریخ
    note: '*تاریخ* کلمهٔ عمومی برای تاریخ تقویمی است، مثل *تاریخ جلسه*.'
    example_gloss: تاریخ امروز چند است؟
  fa.a1.unit10.lesson05.teach.which_day_meeting:
    title: جلسه کدام روز است؟
    gloss: جلسه کدام روز است؟
    note: جلسه کدوم روزه؟ می‌پرسد که یک برنامه در کدام روز هفته است.
  fa.a1.unit10.lesson05.teach.which_date:
    title: سه‌شنبه در ثور چندم است؟
    gloss: سه‌شنبه در اردیبهشت چندم است؟
    note: سه‌شنبه چندم اردیبهشته؟ تاریخ مشخص عددی یک روز نام‌برده‌شده را می‌پرسد.
  fa.a1.unit10.lesson06.teach.hashtom:
    title: هشتم
    gloss: هشتم
    note: '*هشتم* یعنی روز هشتم ماه.'
    example_gloss: امروز هشتم است.
  fa.a1.unit10.lesson06.teach.turn01:
    title: رضا، جلسه کدام روز است؟
    gloss: رضا، جلسه کدام روز است؟
    note: مریم گفتگو را با پرسیدن مستقیم از رضا و گفتن نامش شروع می‌کند.
  fa.a1.unit10.lesson06.teach.turn02:
    title: فکر می‌کنم سه‌شنبه باشد.
    gloss: فکر می‌کنم سه‌شنبه باشد.
    note: فکر کنم (فکر می‌کنم) جواب رضا را نرم می‌سازد، یعنی کاملاً مطمئن نیست.
  fa.a1.unit10.lesson06.teach.turn03:
    title: سه‌شنبه در اردیبهشت چندم است؟
    gloss: سه‌شنبه در اردیبهشت چندم است؟
    note: مریم دوباره تاریخ مشخص عددی را می‌پرسد.
  fa.a1.unit10.lesson06.teach.turn04:
    title: سه‌شنبه هشتم اردیبهشت است.
    gloss: سه‌شنبه هشتم اردیبهشت است.
    note: رضا تاریخ مشخص را می‌گوید.
  fa.a1.unit10.lesson06.teach.turn05:
    title: خوب است، باشه. جمعه چطور، وقت داری؟
    gloss: خوب است، باشه. جمعه چطور، وقت داری؟
    note: مریم تاریخ را تأیید می‌کند و بعد درباره یک روز دیگر می‌پرسد.
  fa.a1.unit10.lesson06.teach.turn06:
    title: نه، جمعه مصروف استم.
    gloss: نه، جمعه مصروف استم.
    note: سرم شلوغه (لفظاً «سرم شلوغ است») در فارسی ایران راه عادی و محاوره‌ای گفتن «مصروفم» است.
  fa.a1.unit10.lesson06.teach.turn07:
    title: مشکلی نیست، سه‌شنبه می‌بینمت.
    gloss: مشکلی نیست، سه‌شنبه می‌بینمت.
    note: مشکلی نیست (مشکلی نیست) نپذیرفتن رضا را مؤدبانه قبول می‌کند و می‌بینمت یعنی «تو را می‌بینم»؛ سه‌شنبه را به‌عنوان روز جلسه تأیید می‌کند، مطابق نوبت‌های ۰۲ و ۰۴.
  fa.a1.unit10.lesson06.teach.va_and:
    title: و
    gloss: و
    note: '*و* حرف ربط است. می‌تواند دو روز را وصل کند، مثل *دوشنبه و سه‌شنبه*، یا دو سؤال مرتبط را، مثل *جلسه کدوم روزه و چندم اردیبهشته؟*'
    example_gloss: من روزهای دوشنبه و سه‌شنبه صنف دارم.
