teaching:
  fa.a2.unit39.lesson01.teach.basic_words:
    title: آدم‌ها، روزها و واژه‌های کوچک
    gloss: من، تو، او، آنها، سارا، نیما، امروز، فردا، دیر، یک، و، یا، نه
    note: '*اون* یعنی «او / آن» و *اونا* یعنی «آنها». در فارسی ایران برای «او» مذکر و مؤنث جدا وجود ندارد.'
    example_gloss:
    - تو و من.
    - سارا و نیما.
    - امروز یا فردا.
  fa.a2.unit39.lesson01.teach.have_forms:
    title: کار یا وقت داشتن
    gloss: من کار دارم، تو وقت داری، او وقت دارد
    note: '*کار دارم* یعنی «من کار دارم / مصروف هستم». شناسه با شخص تغییر می‌کند: *دارم*، *داری*، *داره*.'
    example_gloss:
    - امروز کار دارم.
    - فردا وقت داری؟
    - سارا فردا وقت دارد.
  fa.a2.unit39.lesson01.teach.message_words:
    title: پیغام‌ها و یادداشت‌ها
    gloss: پیغام، یادداشت، موبایل، همکارم، دوستم
    note: پیغامی که با تلفون برسد *پیغام* است؛ پیغام نوشته‌شده می‌تواند *یادداشت* باشد. *همکارم* و *دوستم* نشان نمی‌دهند که شخص مرد است یا زن.
    example_gloss:
    - دوستم یک پیغام دارد.
    - همکارم یک یادداشت دارد.
    - سارا موبایل دارد.
  fa.a2.unit39.lesson01.teach.home_forms:
    title: در خانه بودن
    gloss: خانه، است، نیست، تو هستی
    note: '*خونه هست* یعنی «در خانه است». *هستی* شکل «تو» و *هست* شکل «او» است.'
    example_gloss:
    - نیما در خانه است.
    - سارا در خانه نیست.
    - تو در خانه استی؟
  fa.a2.unit39.lesson01.teach.say_verbs:
    title: فعل‌هایی برای رساندن پیام
    gloss: او می‌گوید، آنها می‌گویند، او می‌پرسد، او می‌خواهد
    note: هر فعل زمان حال و شخص سوم است. *می‌گه* را برای رساندن یک خبر، *می‌پرسه* را برای یک سوال و *می‌خواد* را برای یک خواهش به کار ببرید.
    example_gloss:
    - دوستم می‌گوید.
    - آنها می‌گویند.
    - همکارم می‌پرسد.
    - سارا می‌خواهد.
  fa.a2.unit39.lesson01.teach.arrive_forms:
    title: دیر رسیدن
    gloss: من دیر می‌رسم، او دیر می‌رسد
    note: فعل *می‌رسه* هم برای «او» (مرد) و هم برای «او» (زن) استفاده می‌شود.
    example_gloss:
    - من امروز دیر می‌رسم.
    - سارا دیر می‌رسد.
  fa.a2.unit39.lesson01.teach.say_that:
    title: 'رساندن یک خبر: می‌گه که'
    gloss: من دیر می‌رسم. سارا می‌گوید که او دیر می‌رسد.
    note: 'برای رساندن یک خبر، اول بگویید چه کسی حرف زده، بعد *می‌گه که* و بعد چیزی که گفته شده. فعل در زمان حال می‌ماند. شخص تغییر می‌کند: *دیر می‌رسم* (من) می‌شود *دیر می‌رسه* (او). *که* را در گفتار می‌شود نیاورد، ولی با آن گزارش واضح‌تر می‌شود.'
  fa.a2.unit39.lesson02.teach.object_pronouns:
    title: به من، به تو، به او، برای تو
    gloss: به من، به تو، به او، برای تو
    note: 'این شکل‌های کوتاه شخص را به عبارت فعلی می‌چسبانند: *بهم* (به من)، *بهت* (به تو)، *بهش* (به او).'
    example_gloss:
    - برایت یک پیام دارم.
    - سارا برای او یک پیام دارد.
    - نیما برایم یک پیام دارد.
  fa.a2.unit39.lesson02.teach.request_verbs:
    title: آنچه او از تو می‌خواهد
    gloss: زنگ بزن، بیا، جواب بده، بخوان
    note: 'بعد از *می‌خواد که* فعل دوم شکل «تو» با *ب* است: *بزنی*، *بیای*، *بدی*، *بخونی*.'
    example_gloss:
    - سارا می‌خواهد که تو به او زنگ بزنی.
    - نیما می‌خواهد که تو فردا بیایی.
    - همکارم می‌خواهد که تو جواب بدهی.
    - دوستم می‌خواهد که تو یادداشت را بخوانی.
  fa.a2.unit39.lesson02.teach.call_forms:
    title: زنگ می‌زنم، او زنگ می‌زند
    gloss: زنگ می‌زنم، او زنگ می‌زند
    note: 'زمان حال برای یک برنامه هم استفاده می‌شود: *فردا زنگ می‌زنم* می‌تواند یعنی «فردا زنگ می‌زنم»، یعنی کاری که در آینده می‌کنم.'
    example_gloss:
    - فردا زنگ می‌زنم.
    - سارا فردا زنگ می‌زند.
  fa.a2.unit39.lesson02.teach.when_forms:
    title: کی؟ تو می‌رسی
    gloss: کی، تو می‌رسی
    note: '*کی* کلمهٔ پرسش است. در سوالِ رسانده‌شده هم همان می‌ماند: *می‌پرسه که کی می‌رسی*.'
    example_gloss:
    - فردا کی می‌رسی؟
    - همکارم می‌پرسد که تو کی می‌رسی.
    - کی در خانه استی؟
  fa.a2.unit39.lesson02.teach.asks_whether:
    title: 'رساندن یک سوال: می‌پرسه'
    gloss: او می‌پرسد که وقت داری یا نه. او می‌پرسد که کی می‌رسی.
    note: 'سوال بلی/نخیر می‌شود *می‌پرسه که … یا نه*: *می‌پرسه که وقت داری یا نه*. کلمهٔ پرسش در جای خود می‌ماند: *می‌پرسه که کی می‌رسی*. علامت سوال می‌افتد و فعل در زمان حال می‌ماند.'
  fa.a2.unit39.lesson02.teach.wants_you_to:
    title: 'رساندن یک خواهش: می‌خواد که + شکل با ب'
    gloss: او می‌خواهد که تو به او زنگ بزنی.
    note: 'برای رساندن یک خواهش، *می‌خواد که* و فعلی با *ب* به کار ببرید: *می‌خواد که بهش زنگ بزنی*. این معنی «می‌خواهد زنگ بزند» را نمی‌دهد: پایانهٔ «تو» یعنی *ـی* نشان می‌دهد که تو باید این کار را بکنی. *که* را می‌شود نیاورد: *می‌خواد بهش زنگ بزنی*.'
  fa.a2.unit39.lesson03.teach.key_car:
    title: کلید و موتر
    gloss: کلید، موتر، کلید من، کلید او، موتر است
    note: '*ـم* را برای «من» و *ـش* را برای «او» اضافه کنید: *کلیدم*، *کلیدش*. در *تو ماشینه*، *تو* یعنی «در» و *ـه* یعنی «است».'
    example_gloss:
    - کلید من در موتر است.
    - کلید او در موتر است.
    - سارا موتر دارد.
  fa.a2.unit39.lesson03.teach.they_forms:
    title: آنها می‌رسند، آنها دارند
    gloss: آنها می‌رسند، آنها دارند
    note: 'پایانهٔ «آنها» *ـن* است: *می‌رسن*، *دارن*، *می‌گن*.'
    example_gloss:
    - آنها دیر می‌رسند.
    - آنها فردا کار دارند.
  fa.a2.unit39.lesson03.teach.three_verbs:
    title: خبر، سوال یا خواهش؟
    gloss: او می‌گوید که فردا وقت دارد. او می‌پرسد که فردا وقت داری یا نه. او می‌خواهد که زنگ بزنی.
    note: فعل نشان می‌دهد که پیام از کدام نوع است. *می‌گه* خبر است و با فعل «او» (*داره*) تمام می‌شود. *می‌پرسه* سوال است و فعلش دربارهٔ «تو» است (*داری*). *می‌خواد* خواهش است و بعدش فعلی با *ب* می‌آید (*بزنی*).
  fa.a2.unit39.lesson03.teach.person_shift:
    title: وقتی پیام را می‌رسانید چه تغییر می‌کند
    gloss: من کار دارم. او می‌گوید که کار دارد. کلید من. کلید او.
    note: 'وقتی پیام را می‌رسانید، «من» در گفتهٔ اصلی «او» می‌شود. پایانهٔ فعل *ـم* می‌شود *ـه* (*دارم* به *داره*) و ملکیت *ـم* می‌شود *ـش* (*کلیدم* به *کلیدش*). در فارسی جنسیت نشان داده نمی‌شود، پس *داره* هم «او (مرد) دارد» و هم «او (زن) دارد» معنی می‌دهد. زمان تغییر نمی‌کند: حال در حال می‌ماند.'
  fa.a2.unit39.lesson03.teach.says_vs_they_say:
    title: 'یک نفر یا چند نفر: می‌گه و می‌گن'
    gloss: او می‌گوید که دیر می‌رسد. آنها می‌گویند که دیر می‌رسند.
    note: 'یک حرف یک نفر را از چند نفر جدا می‌کند: *می‌گه … می‌رسه* (او) و *می‌گن … می‌رسن* (آنها). هر دو فعل در گزارش باید با هم مطابقت کنند.'
  fa.a2.unit39.lesson04.teach.time_words:
    title: حالا، امشب، جلسه
    gloss: حالا، امشب، جلسه
    note: '*جلسه* یک نشست است، اکثراً در محل کار.'
    example_gloss:
    - حالا جلسه دارم.
    - امشب در خانه استی؟
    - همکارم امشب جلسه دارد.
  fa.a2.unit39.lesson04.teach.phone_phrases:
    title: عبارت‌های پیام تلفونی
    gloss: همکارت چه می‌گوید؟ دیگر چه؟ از کی؟ بلی.
    note: این عبارت‌های کوتاه گفتگوی پیام را پیش می‌برند.
  fa.a2.unit39.lesson04.teach.note_pattern:
    title: یک یادداشت با خبر و سوال
    gloss: همکارم می‌گوید که امروز دیر می‌رسد و می‌پرسد که تو در خانه استی یا نه.
    note: 'در یک یادداشت نوشتاری، دو گزارش را با *و* وصل کنید و فعل را برای هر کدام تکرار کنید: *می‌گه که …* و *می‌پرسه که … یا نه*. گوینده اول می‌آید و تکرار نمی‌شود.'
  fa.a2.unit39.lesson05.teach.reading:
    title: یک یادداشت برای نیما
    gloss: نیما، یک پیام برایت دارم. همکارت می‌گوید که امروز جلسه دارد و دیر می‌رسد. می‌پرسد که فردا وقت داری یا نه و می‌خواهد که به او زنگ بزنی.
    note: یک بار بخوانید تا بدانید پیام را چه کسی فرستاده، بعد دوباره بخوانید تا خبر، سوال و خواهش را از هم جدا کنید.
  fa.a2.unit39.lesson06.teach.turn01:
    title: سارا یک پیام دارد
    gloss: سارا به نیما می‌گوید که برایش یک پیام دارد.
    note: آغاز گفتگو از پیام نام می‌برد.
  fa.a2.unit39.lesson06.teach.turn02:
    title: نیما می‌پرسد از طرف کی است
    gloss: از کی؟
    note: یک سوال کوتاه فرستنده را می‌پرسد.
  fa.a2.unit39.lesson06.teach.turn03:
    title: سارا فرستنده و اولین خبر را می‌گوید
    gloss: از همکارت. می‌گوید که امروز دیر می‌رسد.
    note: سارا با *می‌گه که* یک خبر را می‌رساند.
  fa.a2.unit39.lesson06.teach.turn04:
    title: نیما بیشتر می‌پرسد
    gloss: دیگر چه می‌گوید؟
    note: '*دیگه چی* بخش بعدی را می‌پرسد.'
  fa.a2.unit39.lesson06.teach.turn05:
    title: سارا یک سوال و یک خواهش را می‌رساند
    gloss: می‌پرسد که فردا وقت داری یا نه و می‌خواهد که به او زنگ بزنی.
    note: یک گزارش سوال است و دیگری خواهش.
  fa.a2.unit39.lesson06.teach.turn06:
    title: نیما جواب می‌دهد
    gloss: بلی، فردا وقت دارم. حالا به او زنگ می‌زنم.
    note: نیما به شکل اول شخص جواب می‌دهد، چون از طرف خودش حرف می‌زند.
exercises:
  fa.a2.unit39.lesson01.exercise01.recognize_says:
    instruction: این گزارش چه معنی دارد؟
    correct_option: او می‌گوید که دیر می‌رسد.
    distractors:
    - او می‌پرسد که دیر می‌رسد یا نه.
    - او می‌خواهد که تو دیر برسی.
    - آنها می‌گویند که دیر می‌رسند.
    accepted_answers:
    - value: او می‌گوید که دیر می‌رسد.
      status: correct
    feedback: '*می‌گه که* یک خبر را می‌رساند؛ *می‌رسه* یعنی «او می‌رسد».'
  fa.a2.unit39.lesson01.exercise02.recognize_asks:
    instruction: این گزارش چه معنی دارد؟
    correct_option: او می‌پرسد که نیما در خانه است یا نه.
    distractors:
    - او می‌گوید که نیما در خانه است.
    - او می‌خواهد که نیما در خانه باشد.
    - او می‌پرسد که نیما کجاست.
    accepted_answers:
    - value: او می‌پرسد که نیما در خانه است یا نه.
      status: correct
    feedback: '*می‌پرسه … هست یا نه* یک سوال بلی/نخیر را می‌رساند.'
  fa.a2.unit39.lesson01.exercise03.match_report_words:
    instruction: هر مورد فارسی را با معنای مشخص آن وصل کنید.
    accepted_answers:
    - value:
        می‌گه که: او می‌گوید که
        می‌پرسه که: او می‌پرسد که آیا
        می‌خواد که: او می‌خواهد که
        می‌گن که: آنها می‌گویند که
        پیغام: پیام
        یادداشت: یادداشت
        گوشی: موبایل
        همکارم: همکارم
      status: correct
    feedback: این فعل‌ها و اسم‌ها ابزار اصلی رساندن پیام اند.
    pairs:
    - left: می‌گه که
      right: او می‌گوید که
    - left: می‌پرسه که
      right: او می‌پرسد که آیا
    - left: می‌خواد که
      right: او می‌خواهد که
    - left: می‌گن که
      right: آنها می‌گویند که
    - left: پیغام
      right: پیام
    - left: یادداشت
      right: یادداشت
    - left: گوشی
      right: موبایل
    - left: همکارم
      right: همکارم
  fa.a2.unit39.lesson01.exercise04.order_says_late:
    instruction: 'کلمه‌ها را طوری ترتیب کنید که بگویین: سارا می‌گوید که دیر می‌رسد.'
    accepted_answers:
    - value:
      - سارا
      - می‌گه
      - که
      - دیر
      - می‌رسه
      status: correct
    feedback: '*سارا می‌گه که دیر می‌رسه*: گوینده، فعل، *که* و بعد پیام.'
  fa.a2.unit39.lesson01.exercise05.fill_says:
    instruction: 'گزارش را با فعل خبر کامل کنید: سارا می‌گوید که امروز کار دارد.'
    accepted_answers:
    - value: می‌گه
      status: correct
    feedback: گزارش کامل *سارا می‌گه که امروز کار داره* است.
  fa.a2.unit39.lesson01.exercise06.translate_colleague_time:
    instruction: 'با فعل بیان خبر به فارسی ایران ترجمه کنید: همکارم می‌گوید که فردا وقت دارد.'
    accepted_answers:
    - value: همکارم می‌گه که فردا وقت داره
      status: correct
    - value: همکارم می‌گه فردا وقت داره
      status: correct
    - value: اون می‌گه که فردا وقت داره
      status: acceptable_with_note
      note: وقتی همکار از قبل معلوم باشد، این هم درست است؛ نمونهٔ جواب او را نام برده است.
    feedback: 'نمونه: *همکارم می‌گه که فردا وقت داره.*'
  fa.a2.unit39.lesson02.exercise01.recognize_wants:
    instruction: این گزارش چه معنی دارد؟
    correct_option: سارا می‌خواهد که تو به او تیلفون کنی.
    distractors:
