teaching:
  fa.a2.unit48.lesson01.teach.greet_words:
    title: کلمه‌های شروع و ختم
    gloss: سلام، چطور استی، چه خبر، ببخش، فعلاً خداحافظ
    note: پیام دوستانه با *سلام* و نام شروع می‌شود، بعد اغلب *خوبی؟* یا *چه خبر؟* می‌آید. *ببخش که ...* یک معذرت‌خواهی کوتاه است. *فعلا* پیام را مثل «فعلاً خداحافظ» ختم می‌کند.
    example_gloss:
    - سلام نیما، چطور استی؟
    - چه خبر؟
    - ببخش که زنگ نزدم.
    - فعلاً خداحافظ، سارا
  fa.a2.unit48.lesson01.teach.time_words:
    title: کلمه‌های وقت برای پیام
    gloss: دیروز، آخر هفته، جمعه، شنبه، فردا، بعداً
    note: 'کلمهٔ وقت را اول بگذار: به دوستت نشان می‌دهد که از چیزی که شده حرف می‌زنی یا از چیزی که می‌شود.'
    example_gloss:
    - دیروز خسته بودم.
    - آخر هفته کار داشتم.
    - روز جمعه به پارک رفتم.
    - فردا برایت زنگ می‌زنم.
    - روز شنبه می‌آیم.
    - بعداً برایت زنگ می‌زنم.
  fa.a2.unit48.lesson01.teach.message_shape:
    title: ساختار یک پیام دوستانه
    gloss: سلام سارا، چطور استی؟ روز جمعه به پارک رفتم. فردا می‌خواهم به سینما بروم. فعلاً خداحافظ، نیما
    note: 'پیام غیررسمی چهار بخش دارد: سلام، آنچه شده (گذشته)، آنچه می‌شود (آینده) و خداحافظی. جمله‌های کوتاه و شکل‌های گفتاری مثل *می‌خوام* و *بهت* عادی‌اند؛ به آغاز رسمی نامه ضرورت نیست.'
  fa.a2.unit48.lesson02.teach.birthday_gift:
    title: تولد و تحفه
    gloss: تولد (محفل)، تحفه
    note: '*تولد* روز میلاد است و در گفتار *رفتم تولد دوستم* یعنی «به محفل تولد دوستم رفتم» هم.'
    example_gloss:
    - روز جمعه به محفل تولد دوستم رفتم.
    - برای دوستم تحفه خریدم.
    - سارا تحفه دارد.
  fa.a2.unit48.lesson02.teach.celebration_words:
    title: جشن و تبریکی
    gloss: جشن، عروسی، تبریک، مبارک
    note: '*جشن* مراسم شادی است، *عروسی* مراسم ازدواج است و *مبارک* در تبریکی‌های کوتاه دوستانه بعد از مناسبت می‌آید.'
    example_gloss:
    - روز جمعه به یک جشن رفتم.
    - عروسی روز جمعه بود.
    - تولدت مبارک، تبریک!
  fa.a2.unit48.lesson02.teach.message_news:
    title: رساندن خبر در پیام
    gloss: فرستادم، شنیدم، موفقیت، تشکر
    note: از این کلمه‌ها استفاده کن تا بگویی چه فرستادی یا چه شنیدی و به موفقیت دوستت واکنش نشان بدهی.
    example_gloss:
    - یک پیام فرستادم.
    - خبر را شنیدم.
    - موفقیتت مبارک!
  fa.a2.unit48.lesson02.teach.past_verbs:
    title: فعل‌های گذشته برای گفتن آنچه شده
    gloss: رفتم، دیدم، خوردم، آمدم، ماندم، خریدم، نوشتم، ما رفتیم
    note: 'پایانهٔ گذشته برای «من» *ـم* و برای «ما» *ـیم* است. منفی *ن* می‌گیرد: *نرفتم*، *نیومدم*، *نزدم*.'
    example_gloss:
    - دیروز به سینما رفتم.
    - یک فلم دیدم.
    - شام خوردم و به خانه آمدم.
    - روز شنبه در خانه ماندم.
    - برایت یک پیام نوشتم.
    - من و سارا به پارک رفتیم.
  fa.a2.unit48.lesson02.teach.past_story:
    title: گفتن رویدادها به ترتیب
    gloss: روز جمعه به محفل تولد دوستم رفتم و تحفه خریدم؛ به سینما رفتیم و بعدش شام خوردیم
    note: اول وقت را بگو، بعد رویدادها را به ترتیبی که شده‌اند. آنها را با *و* وصل کن و برای قدم بعدی *بعدش* («بعد از آن») بگذار. همهٔ فعل‌ها در گذشتهٔ ساده می‌مانند.
  fa.a2.unit48.lesson03.teach.want_to:
    title: گفتن آنچه می‌خواهی بکنی
    gloss: می‌خواهم بروم، می‌خواهم بیایم، می‌خواهم بخرم، می‌خواهم بخورم
    note: '*می‌خوام* با یک فعل کوتاه (*برم*، *بیام*، *بخرم*، *بخورم*) راه معمول گفتن آنچه می‌خواهی بکنی است. در پیام مثل یک پلان خوانده می‌شود، نه فقط یک آرزو.'
    example_gloss:
    - فردا می‌خواهم به سینما بروم.
    - روز شنبه می‌خواهم بیایم.
    - می‌خواهم یک تحفه بخرم.
    - بعد از سینما می‌خواهم شام بخورم.
  fa.a2.unit48.lesson03.teach.feelings_and_memories:
    title: احساس و خاطره
    gloss: خاطره، ناراحت، دلتنگ، جالب
    note: '*ناراحت* می‌گوید که ناراحت استی، اما *دلتنگ* می‌گوید که دلت برای کسی تنگ شده. *جالب* چیزی را که دلچسپ است توصیف می‌کند.'
    example_gloss:
    - خاطره جالب بود.
    - دیروز ناراحت بودم.
    - دلم برایت تنگ بود.
  fa.a2.unit48.lesson03.teach.plain_present:
    title: زمان حال ساده برای پلان‌ها
    gloss: می‌آیم، می‌روم، می‌خرم، برایت زنگ می‌زنم
    note: با کلمهٔ وقت مثل *فردا* یا *بعدا*، حال ساده معنای آینده هم دارد. هم *می‌خوام برم* و هم *می‌رم* در پیام درست است.
    example_gloss:
    - روز شنبه می‌آیم.
    - فردا به پارک می‌روم.
    - بعداً یک تحفه می‌خرم.
    - فردا برایت زنگ می‌زنم.
  fa.a2.unit48.lesson03.teach.next_pattern:
    title: بعدش چه می‌شود
    gloss: فردا می‌خواهم به سینما بروم؛ بعد از سینما برایت زنگ می‌زنم
    note: کلمهٔ وقت را اول بگذار، بعد پلان را. *بعد از* را با مکان یا رویداد (*بعد از سینما*) به کار ببر و *بعدش* را وقتی که قدم قبلی روشن است.
  fa.a2.unit48.lesson04.teach.reasons:
    title: دلیل‌ها در گذشته
    gloss: خسته بودم، کار داشتم، مریض بودم، هوا خوب بود
    note: 'دلیل‌های مربوط به گذشته با زمان گذشته گفته می‌شوند: *بودم*، *داشتم*. هوا سوم شخص است: *هوا خوب بود*.'
    example_gloss:
    - دیروز خسته بودم.
    - آخر هفته کار داشتم.
    - روز شنبه مریض بودم.
    - روز جمعه هوا خوب بود.
  fa.a2.unit48.lesson04.teach.because_so:
    title: چون و برای همین
    gloss: چون خسته بودم، نیامدم؛ خسته بودم، برای همین نیامدم
    note: '*چون* دلیل را معرفی می‌کند: *چون خسته بودم، نیومدم* یا *نیومدم، چون خسته بودم*. *برای همین* نتیجه را معرفی می‌کند و بعد از دلیل می‌آید: *خسته بودم، برای همین نیومدم*. هر دو را در یک جمله نیاورید.'
  fa.a2.unit48.lesson05.teach.reading:
    title: پیام از نیما
    gloss: سلام سارا، خوبستی؟ ببخش که زنگ نزدم، چون آخر هفته کار زیاد داشتم. روز جمعه به محفل میلاد دوستم رفتم و تحفه خریدم. میلاد خیلی خوب بود، اما دیر خانه آمدم و خسته بودم. برای همین روز شنبه به صنف نرفتم. فردا می‌خواهم سینما بروم و بعد از سینما به تو زنگ می‌زنم. فعلاً، نیما
    note: یک بار بخوانید تا چهار بخش را بیابید (سلام، آنچه شد، برنامهٔ بعدی، خداحافظی)، بعد دوباره بخوانید تا دلیل‌ها را پیدا کنید.
  fa.a2.unit48.lesson06.teach.turn01:
    title: سارا احوال می‌پرسد
    gloss: سلام نیما! چه خبر؟ آخر هفته چه کار کردی؟
    note: سارا به نیما سلام می‌دهد و می‌پرسد که چه کار کرده است.
  fa.a2.unit48.lesson06.teach.turn02:
    title: نیما می‌گوید چه شد
    gloss: سلام سارا! روز جمعه به محفل میلاد دوستم رفتم. تحفه خریدم و خیلی خوب بود.
    note: نیما برای رویدادها از گذشتهٔ ساده کار می‌گیرد.
  fa.a2.unit48.lesson06.teach.turn03:
    title: سارا دربارهٔ شنبه می‌پرسد
    gloss: عالی! شنبه چطور؟
    note: یک پرسش کوتاه برای ادامهٔ گپ.
  fa.a2.unit48.lesson06.teach.turn04:
    title: نیما دلیل می‌گوید
    gloss: روز شنبه خانه ماندم، چون خسته بودم.
    note: '*چون* دلیل را می‌رساند.'
  fa.a2.unit48.lesson06.teach.turn05:
    title: سارا دربارهٔ فردا می‌پرسد
    gloss: فردا چه کار می‌خواهی کنی؟
    note: سارا دربارهٔ برنامه می‌پرسد.
  fa.a2.unit48.lesson06.teach.turn06:
    title: نیما می‌گوید بعد چه می‌کند
    gloss: فردا می‌خواهم سینما بروم. بعد از سینما به تو زنگ می‌زنم.
    note: برای برنامه‌ها *می‌خوام* و زمان حال ساده به کار می‌رود.
  fa.a2.unit48.lesson06.teach.turn07:
    title: سارا خداحافظی می‌کند
    gloss: باشه. فعلاً!
    note: گپ با *فعلا* تمام می‌شود.
