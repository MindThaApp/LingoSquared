teaching:
  fa.a2.unit25.lesson01.teach.time_words:
    title: تا حال، هرگز، هنوز، قبلاً، یک بار
    gloss: تا حال؛ هرگز؛ هنوز؛ قبلاً؛ یک بار
    note: '*تا حالا* تجربهٔ زندگی را نشان می‌دهد. برای «هرگز» *هیچ‌وقت* را با فعل منفی و برای «هنوز نه» *هنوز* را با فعل منفی به کار ببرید.'
    example_gloss:
    - آیا تا حال شیراز رفته‌ای؟
    - من هرگز غذای هندی نخورده‌ام.
    - من هنوز اصفهان نرفته‌ام.
    - من این فلم را قبلاً دیده‌ام.
    - من یک بار اسب سواری کرده‌ام.
  fa.a2.unit25.lesson01.teach.people_places:
    title: مردم و جاها
    gloss: من، تو، سارا، نیما، شیراز، اصفهان
    note: در فارسی اغلب *من* و *تو* حذف می‌شود، چون ختم فعل شخص را نشان می‌دهد. سارا و نیما دوستان قدیمی‌اند.
    example_gloss:
    - من شیراز رفته‌ام.
    - آیا تو اصفهان رفته‌ای؟
    - سارا قبلاً شیراز رفته است.
    - نیما هنوز اصفهان نرفته است.
    - من شیراز رفته‌ام.
    - من اصفهان نرفته‌ام.
  fa.a2.unit25.lesson01.teach.experiences:
    title: غذا، فلم و سواری
    gloss: غذای هندی، غذای کوریایی، فلم، سوار بر اسب
    note: '*رو* نشانهٔ مفعول در گفتار است، مثل *این فیلم رو دیده‌م*. عبارت *سوار اسب شدن* یعنی اسب سواری کردن.'
    example_gloss:
    - من غذای هندی خورده‌ام.
    - من غذای کوریایی نخورده‌ام.
    - من این فلم را دیده‌ام.
    - من اسب سواری کرده‌ام.
  fa.a2.unit25.lesson01.teach.perfect_shape:
    title: ماضی نقلی گفتاری
    gloss: من رفته‌ام، خورده‌ام، دیده‌ام، شده‌ام / سوار شده‌ام
    note: 'ماضی نقلی از صفت مفعولی با *-ه* و یک ختم کوتاه شخص ساخته می‌شود. برای «من»، در گفتار *-م* می‌آید: *رفت + ه + م* ← *رفته‌م*.'
  fa.a2.unit25.lesson01.teach.negative_shape:
    title: ماضی نقلی منفی
    gloss: من نرفته‌ام، نخورده‌ام، ندیده‌ام، سوار نشده‌ام
    note: '*نـ* را در آغاز صفت مفعولی بگذارید: *رفته‌م* ← *نرفته‌م*. با *هیچ‌وقت* فعل باید منفی بماند.'
  fa.a2.unit25.lesson01.teach.written_recognition:
    title: 'شکل نوشتاری: فقط شناخت'
    gloss: رفته‌ام شکل نوشتاری رفته‌م گفتاری است
    note: در نوشتهٔ دقیق ممکن است *رفته‌ام* را ببینید. آن را بشناسید، اما در تمرین‌های این درس از شکل گفتاری *رفته‌م* استفاده کنید.
  fa.a2.unit25.lesson02.teach.verbs:
    title: چهار فعل تجربه
    gloss: رفتن، خوردن، دیدن، شدن
    note: صفت‌های مفعولی آن‌ها *رفته، خورده، دیده، شده* است. با *سوار اسب*، *شدن* تجربهٔ «اسب سواری کردن» را می‌سازد.
    example_gloss:
    - رفتن به شیراز خوب است.
    - خوردن غذای هندی خوب است.
    - دیدن این فلم خوب است.
    - اسب سواری خوب است.
  fa.a2.unit25.lesson02.teach.pronouns:
    title: او، ما، شما، آن‌ها
    gloss: او، ما، شما (جمع/محترمانه)، آن‌ها
    note: این ضمیرها ختم‌های شخص را روشن نشان می‌دهند. در گفتگوی عادی، وقتی موضوع معلوم است، ضمیر را نیاورید.
    example_gloss:
    - او شیراز رفته است.
    - ما شیراز رفته‌ایم.
    - آیا شما شیراز رفته‌اید؟
    - آن‌ها شیراز رفته‌اند.
  fa.a2.unit25.lesson02.teach.clitics:
    title: ختم‌های شخص
    gloss: من، تو، او، ما، شما، آن‌ها رفته‌ایم/رفته‌اید… (رفته‌ام، رفته‌ای، رفته است، رفته‌ایم، رفته‌اید، رفته‌اند)
    note: 'مجموعهٔ گفتاری این است: *-م، -ای،* بدون ختم، *-ایم، -این، -ن*. این درس فقط شکل‌هایی را تمرین می‌کند که اینجا آمده‌اند.'
  fa.a2.unit25.lesson02.teach.other_participles:
    title: همین ختم‌ها بر صفت‌های مفعولی دیگر
    gloss: تو/او خورده‌ای/خورده است، دیده‌ای/دیده است، سوار شده‌ای/سوار شده است
    note: 'ختم شخص به همین شکل بر هر صفت مفعولی می‌چسبد: *خورده‌ای، دیده‌ای، شده‌ای*.'
  fa.a2.unit25.lesson03.teach.specific_time:
    title: سال گذشته، دیروز
    gloss: سال گذشته، دیروز
    note: این‌ها زمان تمام‌شده را نام می‌برند، پس ماضی ساده به کار می‌رود، نه ماضی نقلی تجربه.
    example_gloss:
    - من سال گذشته شیراز رفتم.
    - من دیروز غذای هندی خوردم.
  fa.a2.unit25.lesson03.teach.simple_past:
    title: رویداد تمام‌شده در برابر تجربه
    gloss: من سال گذشته شیراز رفتم. من شیراز رفته‌ام.
    note: '*پارسال* زمان وقوع را می‌گوید، پس *رفتم* به کار می‌رود. با *تا حالا* و بدون زمان تمام‌شده، برای تجربهٔ زندگی *رفته‌م* می‌آید.'
  fa.a2.unit25.lesson04.teach.responses:
    title: بلی؛ من هم
    gloss: بلی؛ من هم
    note: به پرسش تجربه با همان شکل ماضی نقلی جواب بدهید. *منم* یعنی «من هم».
    example_gloss:
    - بلی، یک بار رفته‌ام.
    - من هم هنوز نخورده‌ام.
  fa.a2.unit25.lesson04.teach.question_pattern:
    title: آیا تا حال شیراز رفته‌ای؟
    gloss: آیا تا حال شیراز رفته‌ای؟
    note: 'برای پرسیدن دربارهٔ تجربه، *تا حالا* را با ماضی نقلی شخص دوم *رفته‌ای؟* بیاورید. در گفتار روزمره مردم اغلب با *تا حالا* ماضی ساده را به کار می‌برند: *تا حالا رفتی؟*. هر دو درست است.'
  fa.a2.unit25.lesson05.teach.reading:
    title: یک پیام تجربه
    gloss: من شیراز رفته‌ام و قبلاً غذای هندی خورده‌ام. هرگز اسب سواری نکرده‌ام و هنوز غذای کوریایی نخورده‌ام. تو تا حال شیراز رفته‌ای؟
    note: یک بار برای تجربه‌هایی که اتفاق افتاده‌اند بخوانید، بعد دوباره برای تجربه‌هایی که هرگز یا هنوز اتفاق نیفتاده‌اند.
  fa.a2.unit25.lesson06.teach.turn01:
    title: سارا از نیما می‌پرسد
    gloss: نیما، تا حال شیراز رفته‌ای؟
    note: سارا با *تا حالا* یک پرسش تجربه می‌پرسد.
  fa.a2.unit25.lesson06.teach.turn02:
    title: نیما جواب می‌دهد و می‌پرسد
    gloss: بلی، یک بار رفته‌ام. تو تا حال غذای هندی خورده‌ای؟
    note: نیما یک تجربه را می‌گوید و یک پرسش تجربهٔ تازه برمی‌گرداند.
  fa.a2.unit25.lesson06.teach.turn03:
    title: سارا دو غذا را مقایسه می‌کند
    gloss: بلی، قبلاً خورده‌ام، ولی هرگز غذای کوریایی نخورده‌ام.
    note: '*ولی* یک تجربهٔ مثبت را با چیزی که سارا هرگز نکرده، در برابر هم می‌گذارد.'
  fa.a2.unit25.lesson06.teach.turn04:
    title: نیما موافقت می‌کند
    gloss: من هم هنوز نخورده‌ام.
    note: '*هنوز نخورده‌م* یعنی تا حال اتفاق نیفتاده است.'
exercises:
  fa.a2.unit25.lesson01.exercise01.recognize_ever:
    instruction: این سوال چه می‌پرسد؟
    correct_option: آیا تا حال شیراز رفته‌ای؟
    distractors:
    - آیا سال گذشته شیراز رفتی؟
    - آیا حالا به شیراز می‌روی؟
    - آیا در شیراز زندگی می‌کنی؟
    accepted_answers:
    - value: آیا تا حال شیراز رفته‌ای؟
      status: correct
    feedback: '*تا حالا* با *رفته‌ای؟* دربارهٔ تجربهٔ زندگی می‌پرسد.'
  fa.a2.unit25.lesson01.exercise02.recognize_never:
    instruction: این جمله چه معنا دارد؟
    correct_option: من هرگز غذای هندی نخورده‌ام.
    distractors:
    - من دیروز غذای هندی خوردم.
    - من یک بار غذای هندی خورده‌ام.
    - من هنوز غذای هندی نپخته‌ام.
    accepted_answers:
    - value: من هرگز غذای هندی نخورده‌ام.
      status: correct
    feedback: '*هیچ‌وقت* با *نخورده‌م* یعنی «من هرگز نخورده‌ام».'
  fa.a2.unit25.lesson01.exercise03.match_meanings:
    instruction: هر شکل فارسی را با معنی‌اش جور کنید.
    accepted_answers:
    - value:
        تا حالا: تا حال / تا اکنون
        هیچ‌وقت: هرگز
        هنوز: هنوز
        قبلا: پیش از
        یه بار: یک بار
        رفته‌م: من رفته‌ام
        نرفته‌م: من نرفته‌ام
      status: correct
    feedback: کلمه‌های زمان تجربه را چارچوب می‌دهند؛ فعل می‌گوید که اتفاق افتاده یا نه.
    pairs:
    - left: تا حالا
      right: تا حال / تا اکنون
    - left: هیچ‌وقت
      right: هرگز
    - left: هنوز
      right: هنوز
    - left: قبلا
      right: پیش از
    - left: یه بار
      right: یک بار
    - left: رفته‌م
      right: من رفته‌ام
    - left: نرفته‌م
      right: من نرفته‌ام
  fa.a2.unit25.lesson01.exercise04.order_ever_shiraz:
    instruction: 'کلمه‌ها را مرتب کنید و با ماضی نقلی محاوره‌یی بپرسین: آیا تا حال شیراز رفته‌ای؟'
    accepted_answers:
    - value:
      - تا
      - حالا
      - شیراز
      - رفته‌ای
      status: correct
    feedback: '*تا حالا شیراز رفته‌ای؟* دربارهٔ تجربه می‌پرسد.'
  fa.a2.unit25.lesson01.exercise05.fill_gone:
    instruction: جمله را با ماضی نقلی محاوره‌یی «من رفته‌ام» کامل کنید.
    accepted_answers:
    - value: رفته‌م
      status: correct
    feedback: 'جملهٔ کامل این است: *تا حالا شیراز رفته‌م.*'
  fa.a2.unit25.lesson01.exercise06.translate_never_indian:
    instruction: 'به فارسی ترجمه کنید، با استفاده از هیچ‌وقت و ماضی نقلی منفی محاوره‌یی: من هرگز غذای هندی نخورده‌ام.'
    accepted_answers:
    - value: هیچ‌وقت غذای هندی نخورده‌م
