    - value: من هیچ‌وقت غذای هندی نخورده‌م
      status: correct
    feedback: '*هیچ‌وقت غذای هندی نخورده‌م.*'
  fa.a2.unit25.lesson02.exercise01.recognize_we:
    instruction: این شکل ماضی نقلی گفتاری به چه کسی اشاره دارد؟
    correct_option: ما
