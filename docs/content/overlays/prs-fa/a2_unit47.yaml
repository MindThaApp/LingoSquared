teaching:
  fa.a2.unit47.lesson01.teach.now:
    title: همین حالا
    gloss: حالا، همین حالا، کتاب، چه کار می‌کنی
    note: '*الان* یعنی «حالا»؛ *همین الان* یعنی «همین حالا، همین لحظه».'
    example_gloss:
    - حالا کتاب می‌خوانم.
    - همین حالا کتاب می‌خوانم.
    - حالا چه کار می‌کنی؟
  fa.a2.unit47.lesson01.teach.persons:
    title: در میان کار بودن
    gloss: من دارم (می‌کنم)، تو داری، او دارد، ما داریم، شما دارید، آن‌ها دارند
    note: '*دارم* (یا *داری, داره …*) را پیش از فعل حال بگذارید. این نشان می‌دهد که همین حالا در میان کار هستید.'
    example_gloss:
    - من دارم کتاب می‌خوانم.
    - تو داری کتاب می‌خوانی.
    - او دارد کتاب می‌خواند.
    - ما داریم کتاب می‌خوانیم.
    - شما دارید کتاب می‌خوانید.
    - آن‌ها دارند کتاب می‌خوانند.
  fa.a2.unit47.lesson01.teach.verbs:
    title: زمان حال خوندن
    gloss: من می‌خوانم، تو می‌خوانی، او می‌خواند، ما می‌خوانیم، شما می‌خوانید، آن‌ها می‌خوانند
    note: 'هر دو بخش فعل استمراری شخص یکسان می‌گیرند: *دارم … می‌خونم*، *داری … می‌خونی*.'
    example_gloss:
    - من هر روز می‌خوانم.
    - تو هر روز می‌خوانی.
    - او هر روز می‌خواند.
    - ما هر روز می‌خوانیم.
    - شما هر روز می‌خوانید.
    - آن‌ها هر روز می‌خوانند.
  fa.a2.unit47.lesson01.teach.shape:
    title: دارم همراه با فعل حال
    gloss: من دارم کتاب می‌خوانم؛ او دارد کتاب می‌خواند
    note: 'فعل حال گفتاری (*می‌خونم*) را بگیرید و *دارم* را پیش از آن بگذارید. هر دو را مطابق شخص تغییر بدهید: *دارم … می‌خونم*، *داره … می‌خونه*. مفعول در میان این دو می‌آید.'
  fa.a2.unit47.lesson02.teach.habit:
    title: کلمه‌های عادت
    gloss: هر، روز، شب‌ها، کار
    note: '*هر روز* و *شب‌ها* نشان می‌دهند که کار یک عادت است، نه چیزی که همین حالا جریان دارد.'
    example_gloss:
    - من هر روز کار می‌کنم.
    - شب‌ها من کتاب می‌خوانم.
  fa.a2.unit47.lesson02.teach.work:
    title: کار کردن
    gloss: کار می‌کنم، دارم کار می‌کنم
    note: '*کار می‌کنم* می‌تواند عادت باشد («کار می‌کنم»)؛ *دارم کار می‌کنم* می‌گوید همین لحظه مصروف کار هستید.'
    example_gloss:
    - همین حالا دارم کار می‌کنم.
    - من هر روز کار می‌کنم.
  fa.a2.unit47.lesson02.teach.contrast:
    title: عادت یا همین حالا
    gloss: هر روز کار می‌کنم؛ همین حالا مصروف کار هستم
    note: حال ساده (*کار می‌کنم*) برای عادت‌ها و حقیقت‌هاست. با *دارم* همان فعل می‌گوید که همین حالا در میان کار هستید. در گفتار، حال ساده را برای همین حالا هم می‌توان به کار برد، اما *دارم* آن را روشن می‌سازد.
  fa.a2.unit47.lesson02.teach.negative:
    title: گفتن «نه»
    gloss: حالا کتاب نمی‌خوانم
    note: 'برای منفی، *دارم* به کار نمی‌رود. حال منفی ساده را به کار ببرید: *الان کتاب نمی‌خونم*.'
    example_gloss:
    - من حالا کتاب نمی‌خوانم.
  fa.a2.unit47.lesson03.teach.things:
    title: کلمه‌های کار خانه
    gloss: لباس‌ها، ظرف‌ها، جارو کردن، شام
    note: '*لباس‌ها* و *ظرف‌ها* اسم‌های جمع هستند؛ با *رو* چیزهایی اند که شسته می‌شوند.'
    example_gloss:
    - حالا دارم لباس‌ها را می‌شویم.
    - حالا دارم ظرف‌ها را می‌شویم.
    - حالا دارم جارو می‌کنم.
    - حالا دارم شام می‌پزم.
  fa.a2.unit47.lesson03.teach.verbs:
    title: فعل‌های کار خانه
    gloss: می‌شویم، جارو می‌کنم، درست می‌کنم
    note: '*شستن* می‌شود *می‌شورم*؛ *جارو کردن* و *درست کردن* جفت‌های اسم و فعل هستند.'
    example_gloss:
    - دارم لباس‌ها را می‌شویم.
    - دارم جارو می‌کنم.
    - دارم شام درست می‌کنم.
  fa.a2.unit47.lesson03.teach.others:
    title: شخص دیگر
    gloss: نیما، او می‌شوید، او می‌کند
    note: 'برای شخص دیگر، هم *دارم* و هم فعل را تغییر بدهید: *داره … می‌شوره*.'
    example_gloss:
    - نیما دارد ظرف‌ها را می‌شوید.
    - نیما دارد جارو می‌کند.
  fa.a2.unit47.lesson03.teach.rule:
    title: مفعول در میان دو بخش
    gloss: دارم ظرف‌ها را می‌شویم؛ نیما دارد ظرف‌ها را می‌شوید
    note: مفعول همراه *رو* در میان *دارم* و فعل می‌آید. با جفت اسم و فعل مثل *جارو می‌کنم*، *دارم* پیش از کل عبارت می‌آید.
  fa.a2.unit47.lesson04.teach.calls:
    title: آغاز تماس تلیفونی
    gloss: هلو (در تلیفون)، کجا هستی، چه می‌کنی
    note: '*الو* همان چیزی است که هنگام جواب دادن یا آغاز تماس تلیفونی می‌گویید.'
    example_gloss:
    - الو، کجا هستی؟
    - الو، حالا چه می‌کنی؟
  fa.a2.unit47.lesson04.teach.arrive:
    title: در راه هستم
    gloss: می‌آیم، می‌رسم
    note: '*دارم میام* یعنی «در راه هستم»؛ *دارم می‌رسم* یعنی «همین حالا می‌رسم».'
    example_gloss:
    - دارم می‌آیم.
    - دارم می‌رسم.
  fa.a2.unit47.lesson04.teach.talk:
    title: صحبت و زنگ زدن
    gloss: با، مادرم، صحبت، صحبت می‌کنم، زنگ زدن، او زنگ می‌زند
    note: '*حرف زدن* یعنی «صحبت کردن» و *زنگ زدن* یعنی «تلیفون کردن».'
    example_gloss:
    - دارم با مادرم صحبت می‌کنم.
    - مادرم زنگ می‌زند.
  fa.a2.unit47.lesson04.teach.rule:
    title: فعل استمراری در تلیفون
    gloss: دارم می‌آیم؛ دارم با مادرم صحبت می‌کنم
    note: 'در صحبت تلیفونی فعل استمراری زیاد به کار می‌رود: به طرف مقابل می‌گویید در میان چه کاری هستید. *میام* شکل عادی گفتاری «می‌آیم» است؛ *دارم میام* یعنی در راه هستم.'
  fa.a2.unit47.lesson05.teach.words:
    title: کلمه‌های متن
    gloss: شب است، همه، ما در خانه هستیم، بچه‌ها، تلویزیون، می‌بینند، هم
    note: '*شبه* یعنی «شب است»؛ *خونه‌ایم* یعنی «ما در خانه هستیم».'
    example_gloss:
    - حالا شب است و همه ما در خانه هستیم.
    - بچه‌ها تلویزیون تماشا می‌کنند.
    - مادرم هم زنگ می‌زند.
  fa.a2.unit47.lesson05.teach.reading:
    title: یک شب در خانه
    gloss: حالا شب است و همه ما در خانه هستیم. من دارم شام درست می‌کنم. نیما دارد ظرف‌ها را می‌شوید. بچه‌ها دارند تلویزیون تماشا می‌کنند. مادرم هم دارد زنگ می‌زند.
    note: یک بار بخوانید تا بفهمید کی چی کار می‌کند، بعد دوباره بخوانید و به شکل‌های فعل با *دارم, داره, دارن* توجه کنید.
  fa.a2.unit47.lesson06.teach.turn01:
    title: سارا به نیما زنگ می‌زند
    gloss: 'سارا: الو نیما، کجا هستی؟'
    note: '*کجایی؟* می‌پرسد کجا هستید.'
  fa.a2.unit47.lesson06.teach.turn02:
    title: نیما در راه است
    gloss: 'نیما: در راه هستم. تو چه می‌کنی؟'
    note: '*دارم میام* می‌گوید او در راه است.'
  fa.a2.unit47.lesson06.teach.turn03:
    title: سارا شام می‌پزد
    gloss: 'سارا: دارم شام درست می‌کنم.'
    note: '*دارم … درست می‌کنم* فعل استمراری است.'
  fa.a2.unit47.lesson06.teach.turn04:
    title: نیما درباره بچه‌ها می‌پرسد
    gloss: 'نیما: بچه‌ها چطور؟'
    note: یک پرسش کوتاه که موضوع را دنبال می‌کند.
  fa.a2.unit47.lesson06.teach.turn05:
    title: سارا جواب می‌دهد
    gloss: 'سارا: دارند تلویزیون تماشا می‌کنند.'
    note: '*دارن … می‌بینن* شکل «آن‌ها» است.'
  fa.a2.unit47.lesson06.teach.turn06:
    title: نیما می‌رسد
    gloss: 'نیما: خوب است. دارم می‌رسم.'
    note: '*دارم می‌رسم* می‌گوید او تقریباً رسیده است.'
