  description: 'فارسی ایرانی برای مبتدیان: واژه‌های غذا و نوشیدنی، سفارش دادن مؤدبانه در رستوران، پرسیدن درباره‌ی منو و پیشنهادها، مقدار و اندازه‌ها، و آداب رستوران از جمله خواستن صورت‌حساب.'
