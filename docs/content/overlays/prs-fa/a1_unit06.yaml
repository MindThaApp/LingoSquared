teaching:
  fa.a1.unit06.lesson01.teach.naan:
    title: نان
    gloss: نان
    note: نان در هر وعده‌ی غذایی ایرانی‌ها جای دارد؛ اغلب نان پهن است که با تقریباً همه چیز خورده می‌شود.
    example_gloss: من نان دوست دارم.
  fa.a1.unit06.lesson01.teach.berenj:
    title: برنج
    gloss: برنج
    note: برنج بخش اصلی بیشتر غذاهای ایرانی است.
    example_gloss: برنج با مرغ خوشمزه است.
  fa.a1.unit06.lesson01.teach.morgh:
    title: مرغ
    gloss: گوشت مرغ
    note: مرغ هم به خود پرنده می‌گویند و هم به گوشت آن.
    example_gloss: من مرغ می‌خورم.
  fa.a1.unit06.lesson01.teach.ab:
    title: آب
    gloss: آب
    note: آب واژه‌ی معمولی برای «آب» است.
    example_gloss: آب می‌خواهم.
  fa.a1.unit06.lesson01.teach.chai:
    title: چای
    gloss: چای
    note: چای نوشیدنی همیشگی است که تقریباً همه جای ایران تعارف می‌شود؛ پیش‌تر در درس تعارف واحد ۱ دیدیم.
    example_gloss: یک چای، لطفاً.
  fa.a1.unit06.lesson01.teach.ghahve:
    title: قهوه
    gloss: قهوه
    note: قهوه در شهرهای ایران کم‌کم در کنار چای رایج‌تر می‌شود.
    example_gloss: قهوه گرم است.
  fa.a1.unit06.lesson01.teach.mive:
    title: میوه
    gloss: میوه
    note: میوه واژه‌ی عمومی برای هر نوع میوه است.
    example_gloss: من میوه دوست دارم.
  fa.a1.unit06.lesson01.teach.va_ya:
    title: و / یا
    gloss: و، یا
    note: هر دو از واژه‌های پیوندی رایج‌اند و برای وصل کردن غذاها و نوشیدنی‌ها در سفارش به کار می‌روند.
    target_text: و (و)، یا (یا)
  fa.a1.unit06.lesson02.teach.mikhastam_chai:
    title: مؤدبانه چای سفارش بدهید
    gloss: یک چای می‌خواستم.
    note: می‌خواستم در اصل شکل گذشته‌ی «خواستن» است، اما به عنوان درخواست مؤدبانه و نرم به کار می‌رود؛ لحن مناسب برای پیشخدمت یا دکاندار ناآشنا.
  fa.a1.unit06.lesson02.teach.lotfan:
    title: لطفاً
    gloss: لطفاً
    note: لطفاً را می‌شود به تقریباً هر درخواست اضافه کرد تا نرم‌تر شود.
    example_gloss: لطفاً به من کمک کنید.
  fa.a1.unit06.lesson02.teach.mikham_informal:
    title: غیررسمی چای سفارش بدهید
    gloss: یک چای می‌خواهم.
    note: یه چای می‌خوام از «یه» (یک) و «می‌خوام» (می‌خواهم) محاوره‌ای استفاده می‌کند؛ آن را فقط با دوست نزدیک یا اعضای خانواده به کار ببرید، نه با پیشخدمتی که تازه دیده‌اید.
  fa.a1.unit06.lesson02.teach.register_note:
    title: انتخاب فعل درست برای سفارش
    gloss: با ناآشنا یا پیشخدمت می‌خواستم بگویید؛ می‌خوام را فقط با دوست نزدیک به کار ببرید.
    note: این همان تفاوت سطح گفتار است که در واحد ۱ برای سلام و احوال‌پرسی دیدیم، اینجا برای سفارش دادن.
  fa.a1.unit06.lesson02.teach.mikhastam_naan:
    title: مؤدبانه نان سفارش بدهید
    gloss: کمی نان می‌خواستم.
    note: همین الگوی می‌خواستم برای هر نام غذا یا نوشیدنی به کار می‌رود.
  fa.a1.unit06.lesson03.teach.menu_word:
    title: مینو
    gloss: مینو
    note: منو واژه‌ی قرضی است و در فارسی ایرانی همان‌گونه به کار می‌رود که در دری «مینو» یا «فهرست غذا» گفته می‌شود.
    example_gloss: منو، لطفاً.
  fa.a1.unit06.lesson03.teach.menu_question:
    title: منو بخواهید
    gloss: منو دارید؟
    note: منو دارید؟ در اصل می‌پرسد «منو دارید؟»؛ شیوه‌ی معمول برای خواستن آن.
  fa.a1.unit06.lesson03.teach.recommend_question:
    title: پیشنهاد بخواهید
    gloss: چه توصیه می‌کنید؟
    note: چی توصیه می‌کنید؟ پرسش طبیعی و رایج از پیشخدمت است.
  fa.a1.unit06.lesson03.teach.waiter_question:
    title: پیشخدمت از شما چه می‌پرسد
    gloss: چه می‌خواهید؟
    note: چی میل دارید؟ شیوه‌ی مؤدبانه و معمول پیشخدمت برای آغاز سفارش گرفتن است.
  fa.a1.unit06.lesson03.teach.jooje_kabab:
    title: جوجه‌کباب
    gloss: جوجه‌کباب
    note: جوجه‌کباب (مرغ مزه‌دار شده‌ی کبابی) یکی از رایج‌ترین غذاها در منوی ایرانی است.
    example_gloss: جوجه‌کباب سفارش می‌دهم.
  fa.a1.unit06.lesson03.teach.khoobe:
    title: پیشخدمت غذا را پیشنهاد می‌کند
    gloss: جوجه‌کباب امروز بسیار خوب است.
    note: خوبه شکل محاوره‌ای و گفتاری «خوب است» است و در پیشنهاد ساده‌ی پیشخدمت طبیعی است.
  fa.a1.unit06.lesson03.teach.bale_befarmaeed:
    title: بله، بفرمایید
    gloss: بله، بفرمایید.
    note: بله یعنی «آری»؛ بفرمایید (که در درس تعارف واحد ۱ دیدیم) اینجا هنگام دادن چیزی، مثلاً منو، به کسی دوباره به کار می‌رود.
  fa.a1.unit06.lesson04.teach.yek_livan:
    title: یک گیلاس چای
    gloss: یک گیلاس چای
    note: لیوان (گیلاس) واحد شمارش برای نوشیدنی‌هایی است که در گیلاس داده می‌شوند.
  fa.a1.unit06.lesson04.teach.do_ta_naan:
    title: دو دانه نان
    gloss: دو دانه نان
    note: تا واحد شمارش است که بعد از عدد برای شمردن بیشتر چیزهای قابل‌شمارش می‌آید، اینجا دو دانه نان.
  fa.a1.unit06.lesson04.teach.yek_boshghab:
    title: یک بشقاب برنج
    gloss: یک بشقاب برنج
    note: بشقاب واحد شمارش برای غذایی است که در بشقاب داده می‌شود.
  fa.a1.unit06.lesson04.teach.combined_order:
    title: سفارش کامل بدهید
    gloss: یک بشقاب برنج و دو دانه نان، لطفاً.
    note: چند مقدار را می‌توان در یک سفارش با «و» به هم وصل کرد.
  fa.a1.unit06.lesson04.teach.se_ta:
    title: واحد شمارش تا
    gloss: 'تا بعد از عدد برای چیزهای قابل‌شمارش می‌آید: دو تا، سه تا.'
    note: این همان الگوی شمارشی است که در واحد ۳ با عددها آموختید، اینجا برای سفارش غذا.
  fa.a1.unit06.lesson05.teach.hesab_word:
    title: حساب
    gloss: صورت‌حساب
    note: صورت‌حساب واژه‌ی معیاری برای بل رستوران است.
    example_gloss: بل را بیاورید، لطفاً.
  fa.a1.unit06.lesson05.teach.bill_request:
    title: صورت‌حساب بخواهید
    gloss: لطفاً صورت‌حساب را بیاورید.
    note: صورت‌حساب رو لطف می‌کنید؟ شیوه‌ی مؤدبانه و طبیعی برای خواستن بل در رستوران است.
  fa.a1.unit06.lesson05.teach.khoshmaze:
    title: بگویید غذا خوشمزه بود
    gloss: بسیار خوشمزه بود.
    note: خیلی خوشمزه بود تعریف طبیعی است که بعد از غذا به پیشخدمت یا میزبان گفته می‌شود.
  fa.a1.unit06.lesson05.teach.nooshe_jan:
    title: نوش جان
    gloss: نوش جان؛ نوش جانت باشد
    note: نوش جان به کسی گفته می‌شود که غذا می‌خورد یا می‌خواهد بخورد؛ خود شخصی که غذا می‌خورد آن را درباره‌ی غذای خودش نمی‌گوید.
  fa.a1.unit06.lesson05.teach.chashm:
    title: تأیید مؤدبانه‌ی پیشخدمت
    gloss: همین حالا.
    note: چشم، الان میارم شیوه‌ی محترمانه‌ی کارمندان برای پذیرفتن درخواست و گفتن اینکه فوراً می‌آورند.
  fa.a1.unit06.lesson06.teach.restaurant_word:
    title: رستوران
    gloss: رستورانت
    note: رستوران واژه‌ی معمول برای رستورانت است و فضای گفتگوی این واحد.
    example_gloss: این رستوران خوب است.
  fa.a1.unit06.lesson06.teach.turn01:
    title: پیشخدمت مشتری را خوش‌آمد می‌گوید
    gloss: پیشخدمت خوش‌آمد می‌گوید و می‌پرسد مشتری چی میل دارد.
    note: چی میل دارید؟ همان پرسش مؤدبانه‌ی آغازین از درس سوم است.
  fa.a1.unit06.lesson06.teach.turn02:
    title: مشتری منو می‌خواهد
    gloss: مشتری به پیشخدمت سلام می‌کند و منو می‌خواهد.
    note: منو دارید؟ گفتگوی سفارش را آغاز می‌کند.
  fa.a1.unit06.lesson06.teach.turn03:
    title: پیشخدمت منو را می‌دهد
    gloss: پیشخدمت تأیید می‌کند و منو را می‌دهد.
    note: بفرمایید همان واژه‌ی مؤدبانه‌ی واحد ۱ است که اینجا هنگام دادن چیزی به کسی به کار رفته است.
  fa.a1.unit06.lesson06.teach.turn04:
    title: مشتری پیشنهاد می‌خواهد
    gloss: مشتری می‌پرسد پیشخدمت چی پیشنهاد می‌کند.
    note: چی توصیه می‌کنید؟ از درس سوم.
  fa.a1.unit06.lesson06.teach.turn05:
    title: پیشخدمت یک غذا را پیشنهاد می‌کند
    gloss: پیشخدمت می‌گوید جوجه‌کباب امروز بسیار خوب است.
    note: جوجه‌کباب امروز خیلی خوبه شکل محاوره‌ای خوبه را دارد که در پیشنهادهای گفتاری طبیعی است.
  fa.a1.unit06.lesson06.teach.turn06:
    title: مشتری سفارش کامل می‌دهد
    gloss: مشتری موافقت می‌کند و جوجه‌کباب با برنج و یک چای سفارش می‌دهد.
    note: اینجا «می‌خواستم» استفاده شده که برای گارسونی که مشتری او را از نزدیک نمی‌شناسد، مناسب است.
  fa.a1.unit06.lesson06.teach.turn07:
    title: گارسون سفارش را قبول می‌کند
    gloss: گارسون می‌گوید که همین حالا می‌آورد.
    note: «چشم، الان میارم» از درس پنجم.
  fa.a1.unit06.lesson06.teach.turn08:
    title: مشتری از غذا تعریف می‌کند و بل را می‌خواهد
    gloss: مشتری می‌گوید خیلی خوشمزه بود و بل را می‌خواهد.
    note: هر دو جمله مستقیماً از واژه‌های درس پنجم استفاده می‌کنند.
  fa.a1.unit06.lesson06.teach.turn09:
    title: گارسون بل را می‌آورد
    gloss: گارسون قبول می‌کند و می‌گوید همین حالا می‌آورد.
    note: «البته» اینجا یک جواب مثبت مؤدبانهٔ طبیعی است.
exercises:
  fa.a1.unit06.lesson01.exercise01.recognize_naan:
    instruction: این کلمه چه معنا دارد؟
    correct_option: نان
    distractors:
    - برنج
    - مرغ
    - میوه
    accepted_answers:
    - value: نان
      status: correct
    feedback: «نان» یعنی نان (روٹی).
  fa.a1.unit06.lesson01.exercise02.recognize_drinks:
    instruction: کدام یکی از این‌ها نوشیدنی است، نه غذا؟
    correct_option: چای
    distractors:
    - نان
    - برنج
    - مرغ
    accepted_answers:
    - value: چای
      status: correct
    feedback: «چای» نوشیدنی است؛ بقیه غذا هستند.
  fa.a1.unit06.lesson01.exercise03.recognize_naan_reading:
    instruction: این کلمه چه معنا دارد؟
    correct_option: نان
    distractors:
    - قهوه
    - چای
    - water
    accepted_answers:
    - value: نان
      status: correct
    feedback: «نان» یعنی نان (روٹی).
  fa.a1.unit06.lesson01.exercise04.match_food_words:
    instruction: هر کلمه را با معنی‌اش در دری جور کنید.
    accepted_answers:
    - value:
        نان: نان
        برنج: برنج
        مرغ: مرغ
        آب: آب
        چای: چای
        قهوه: قهوه
        میوه: میوه
      status: correct
    feedback: این هفت کلمه، واژه‌های اساسی غذا و نوشیدنی این بخش را در بر می‌گیرند.
    pairs:
    - left: نان
      right: نان
    - left: برنج
      right: برنج
    - left: مرغ
      right: مرغ
    - left: آب
      right: آب
    - left: چای
      right: چای
    - left: قهوه
      right: قهوه
    - left: میوه
      right: میوه
  fa.a1.unit06.lesson01.exercise05.order_food_word:
    instruction: کلمه‌ها را طوری ردیف کنید که بگویین نان و برنج و مرغ.
    accepted_answers:
    - value:
      - نان
      - و
      - برنج
      - و
      - مرغ
      status: correct
    feedback: «نان و برنج و مرغ» سه غذا را با «و» به هم وصل می‌کند.
  fa.a1.unit06.lesson01.exercise06.translate_fruit:
    instruction: 'به فارسی (ایران) ترجمه کنید: میوه.'
    accepted_answers:
    - value: میوه
      status: correct
    feedback: «میوه» یعنی میوه.
  fa.a1.unit06.lesson01.exercise07.write_own_drink:
    instruction: 'کلمهٔ فارسی (ایران) یک نوشیدنی را که دوست دارید بنویسین: چای یا قهوه.'
    accepted_answers:
    - value: چای
      status: correct
    - value: قهوه
      status: correct
    feedback: هم «چای» و هم «قهوه» قبول است.
  fa.a1.unit06.lesson02.exercise01.recognize_polite_order:
    instruction: این عبارت چه معنا دارد؟
    correct_option: یک چای می‌خواستم. (مؤدبانه)
    distractors:
    - یک چای می‌خواهم. (غیررسمی)
    - چای دارید؟
    - چای خوب است.
    accepted_answers:
    - value: یک چای می‌خواستم. (مؤدبانه)
      status: correct
    feedback: «می‌خواستم» شکل مؤدبانهٔ سفارش دادن برای کسی است که او را خوب نمی‌شناسید.
  fa.a1.unit06.lesson02.exercise02.recognize_informal_order:
    instruction: «یه چای می‌خوام» برای گفتن به چه کسی مناسب است؟
    correct_option: دوست نزدیکی که در خانه چای دَم می‌کند
    distractors:
    - گارسونی که تازه او را دیده‌اید
    - دوکان‌داری که او را نمی‌شناسید
    - یک بزرگ‌سال در یک دعوت رسمی
    accepted_answers:
    - value: دوست نزدیکی که در خانه چای دَم می‌کند
      status: correct
    feedback: «می‌خوام» غیررسمی و محاوره‌ای است و برای محیط‌های نزدیک و آشنا می‌باشد.
  fa.a1.unit06.lesson02.exercise03.recognize_polite_order_reading:
    instruction: این عبارت چه معنا دارد؟
    correct_option: یک چای می‌خواستم، لطفاً. (مؤدبانه)
    distractors:
    - یک چای می‌خواهم. (غیررسمی)
    - منو دارید؟
    - چه توصیه می‌کنید؟
    accepted_answers:
    - value: یک چای می‌خواستم، لطفاً. (مؤدبانه)
      status: correct
