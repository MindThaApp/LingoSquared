course:
  title: فارسی ایران A1
  description: 'فارسی ایرانی برای مبتدی‌ها: نام بردن راه‌های رفت‌وآمد (بس، مترو، موتر، بایسکل، پیاده، تکسی)، گفتن اینکه معمولاً چطور می‌روید (هر روز با بس سر کار)، پرسیدن اینکه کدام وسیله بهتر است (اتوبوس یا مترو، کدوم بهتره؟)، پرسیدن قیمت بلیط محلی و خواندن یک جملهٔ کوتاه جدول زمانی، یک متن خواندنی دربارهٔ رفت‌وآمد همیشگی نیما و سارا، و یک گفتگوی پایانی میان نیما و سارا که در آن رفت‌وآمد خود را با هم مقایسه می‌کنند.'
