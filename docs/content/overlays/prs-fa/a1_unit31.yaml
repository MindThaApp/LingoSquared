  description: 'فارسی ایرانی برای مبتدیان: نام بردن لغت‌های جشن و تولد (تولد، مهمانی، کیک، تحفه)، پرسیدن و گفتن اینکه تولدت کی است (*تولدت کِیه؟*) با استفاده از لغت‌های ماه و عددهای ترتیبی که قبلاً یاد گرفته‌اید، دعوت کردن کسی به مهمانی و قبول کردن دعوت (*میای به مهمونی؟* / *آره، حتماً میام*)، یک گفتگوی تولد میان نیما و سارا که *تولدت مبارک* را معرفی می‌کند، یک متن خواندنی دربارهٔ تولد نیما، و در پایان یک مرور که در آن جشن‌هایی را که دوست داری نام می‌بری و پیام دعوت یا تبریکی خودت را می‌نویسی.'
