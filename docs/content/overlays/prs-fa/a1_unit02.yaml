teaching:
  fa.a1.unit02.lesson01.teach.noon_te:
    title: حرف‌های ن و ت
    gloss: ن (n) و ت (t)
    note: ن صدای n را می‌دهد. ت صدای t را می‌دهد؛ هر دو از دو طرف وصل می‌شوند.
  fa.a1.unit02.lesson01.teach.sheen_che:
    title: حرف‌های ش و چ
    gloss: ش (sh) و چ (ch)
    note: ش صدای sh را می‌دهد و چ صدای ch را.
  fa.a1.unit02.lesson01.teach.ye_he:
    title: حرف‌های ی و ه
    gloss: ی (y یا i بلند) و ه (h)
    note: ی مانند y یا مانند ī بلند صدا می‌دهد. ه صدای h دارد و هنگام وصل شدن شکلش تغییر می‌کند.
  fa.a1.unit02.lesson01.teach.ke_gaf:
    title: حرف‌های ک و گ
    gloss: ک (k) و گ (g)
    note: ک صدای k را می‌دهد؛ هنگام تایپ، ک فارسی را بنویسید نه حرف عربی شبیه آن را. گ یک خط اضافه بر ک دارد و صدای g را می‌دهد.
  fa.a1.unit02.lesson01.teach.jim_dal:
    title: حرف‌های ج و د
    gloss: ج (j) و د (d)
    note: ج صدای j را می‌دهد. د صدای d را می‌دهد و به حرف بعدی در سمت چپ وصل نمی‌شود.
  fa.a1.unit02.lesson01.teach.re_fe:
    title: حرف‌های ر و ف
    gloss: ر (r) و ف (f)
    note: ر صدای r را می‌دهد و به حرف بعدی وصل نمی‌شود؛ ف صدای f را می‌دهد.
  fa.a1.unit02.lesson01.teach.vav_be:
    title: حرف‌های و و ب
    gloss: و (v/o/u) و ب (b)
    note: و می‌تواند صدای v یا یک مصوت را بدهد و به حرف بعدی وصل نمی‌شود. ب صدای b را می‌دهد.
  fa.a1.unit02.lesson01.teach.khe_ze:
    title: حرف‌های خ و ز
    gloss: خ (kh) و ز (z)
    note: خ صدایی است که معمولاً kh نوشته می‌شود؛ ز صدای z را می‌دهد.
  fa.a1.unit02.lesson02.teach.esm:
    title: نام
    gloss: نام
    note: اسم در فارسی عادی ایران esm خوانده می‌شود.
    example_gloss: نام من سارا است.
  fa.a1.unit02.lesson02.teach.man:
    title: من
    gloss: من
    note: من ضمیر شخصی اول شخص مفرد است.
  fa.a1.unit02.lesson02.teach.sara:
    title: سارا
    gloss: سارا
    note: سارا یک نام معمول ایرانی است.
    example_gloss: سارا دوست من است.
  fa.a1.unit02.lesson02.teach.formal_name:
    title: معرفی رسمی یا نوشتاری
    gloss: نام من سارا است.
    note: '*اسم من سارا است* درست است، اما رسمی است؛ بیشتر در نوشته دیده می‌شود.'
  fa.a1.unit02.lesson02.teach.spoken_name:
    title: معرفی طبیعی در گفتار
    gloss: نام من سارا است.
    note: اسمم شکل کوتاه اسم من است و ساراست از پیوستن سارا و است ساخته شده.
  fa.a1.unit02.lesson02.teach.polite_question:
    title: پرسیدن نام به شکل مؤدبانه
    gloss: نامت چیست؟
    note: اسم شما چیه؟ در گفتار عادی فارسی ایران، مؤدبانه و معمولی است.
  fa.a1.unit02.lesson02.teach.informal_question:
    title: پرسیدن نام به شکل غیررسمی
    gloss: نامت چیست؟
    note: اسمت چیه؟ برای یک نفر و غیررسمی است؛ فقط وقتی به کار ببرید که رابطه اجازه بدهد.
  fa.a1.unit02.lesson03.teach.man:
    title: من
    gloss: من
    note: من جنسیت دستوری ندارد.
  fa.a1.unit02.lesson03.teach.to:
    title: تو، غیررسمی برای یک نفر
    gloss: تو
    note: تو غیررسمی و مفرد است؛ برای خطاب مؤدبانه معمولاً شما استفاده می‌شود.
  fa.a1.unit02.lesson03.teach.oo:
    title: او
    gloss: او
    note: او جنسیت ندارد و هم برای مرد و هم برای زن به کار می‌رود.
  fa.a1.unit02.lesson03.teach.man_hastam:
    title: من هستم
    gloss: من هستم
    note: هستم شکل کامل اول شخص مفرد فعل بودن است.
  fa.a1.unit02.lesson03.teach.to_hasti:
    title: تو هستی
    gloss: شما استید
    note: هستی با تو (غیررسمی، مفرد) می‌آید.
  fa.a1.unit02.lesson03.teach.oo_hast:
    title: او هست
    gloss: او هست؛ او موجود است
    note: هست شکل کامل سوم شخص مفرد است و اغلب معنی وجود یا تأکید دارد.
  fa.a1.unit02.lesson03.teach.oo_ast:
    title: جمله رسمی برای معرفی هویت
    gloss: او ایرانی است.
    note: در یک جملهٔ هویتی رسمی و نوشتاری، «است» فعل ربطی معمولی سوم شخص است.
  fa.a1.unit02.lesson03.teach.spoken_copula:
    title: خبر هویتی در گفتار
    gloss: او ایرانی است.
    note: ایرانیه شکل کوتاه‌شدهٔ گفتاری ایرانی است در فارسی ایران است.
  fa.a1.unit02.lesson04.teach.iran:
    title: ایران
    gloss: ایران
    note: ایران نام یک کشور است.
    example_gloss: من اهل ایران استم.
  fa.a1.unit02.lesson04.teach.iranian:
    title: ایرانی
    gloss: ایرانی
    note: ایرانی می‌تواند ملیت یا اصلیت را نشان دهد.
    example_gloss: من ایرانی استم.
  fa.a1.unit02.lesson04.teach.england:
    title: انگلستان
    gloss: انگلستان
    note: '*انگلیس* معمولاً به معنای انگلستان است؛ ایرانی‌ها در گفتار روزمره اغلب آن را برای تمام بریتانیا هم به کار می‌برند.'
    example_gloss: من اهل انگلستان استم.
  fa.a1.unit02.lesson04.teach.english:
    title: انگلیسی
    gloss: انگلیسی
    note: انگلیسی می‌تواند ملیت، زبان یا چیزی مربوط به انگلستان را برساند؛ معنی آن از روی متن روشن می‌شود.
    example_gloss: من انگلیسی استم.
  fa.a1.unit02.lesson04.teach.france:
    title: فرانسه
    gloss: فرانسه
    note: فرانسه نام کشور فرانسه است.
    example_gloss: من اهل فرانسه استم.
  fa.a1.unit02.lesson04.teach.french:
    title: فرانسوی
    gloss: فرانسوی
    note: فرانسوی می‌تواند ملیت یا چیزی مربوط به فرانسه را برساند.
    example_gloss: من فرانسوی استم.
  fa.a1.unit02.lesson04.teach.country:
    title: کشور
    gloss: کشور
    note: کشور واژهٔ عمومی برای «کشور» است.
    example_gloss: ایران یک کشور است.
  fa.a1.unit02.lesson04.teach.nationality:
    title: ملیت
    gloss: ملیت
    note: ملیت اسم رسمی برای «تابعیت/ملیت» است.
    example_gloss: ملیت شما چیست؟
  fa.a1.unit02.lesson05.teach.ahl:
    title: اهل یا اصلاً از
    gloss: اهل / اصلاً از
    note: اهل شخص را به جای اصلی‌اش وصل می‌کند؛ فقط به معنای زندگی کردن فعلی در یک جا نیست.
    example_gloss: او اهل انگلستان است.
  fa.a1.unit02.lesson05.teach.koja:
    title: کجا
    gloss: کجا
    note: کجا دربارهٔ مکان می‌پرسد.
    example_gloss: شما اهل کجا استید؟
  fa.a1.unit02.lesson05.teach.formal_question:
    title: پرسش معیار رسمی
    gloss: شما از کجا استید؟
    note: اهل کجا هستید؟ فارسی معیار و مؤدبانه است و برای گفتار رسمی یا خواندن با دقت مناسب است.
  fa.a1.unit02.lesson05.teach.polite_spoken_question:
    title: پرسش گفتاری مؤدبانه و عادی
    gloss: شما از کجا استید؟
    note: اهل کجا هستین؟ شکل گفتاری معمولی و مؤدبانه در فارسی ایران است.
  fa.a1.unit02.lesson05.teach.informal_question:
    title: پرسش غیررسمی
    gloss: شما از کجا استید؟
    note: اهل کجایی؟ شکل غیررسمی و مفرد است.
  fa.a1.unit02.lesson05.teach.origin_answer:
    title: بیان محل اصلی
    gloss: من اهل ایران استم.
    note: من اهل ایران هستم جای اصلی را می‌گوید، نه محل زندگی فعلی را.
  fa.a1.unit02.lesson05.teach.nationality_answer:
    title: پاسخ کوتاه دربارهٔ ملیت
    gloss: من ایرانی استم.
    note: '*ایرانی‌ام* پسوند *ـام* (استم) را به *ایرانی* اضافه می‌کند و پیش از پسوند یک نیم‌فاصله نوشته می‌شود.'
  fa.a1.unit02.lesson06.teach.arrival:
    title: پرسیدن دربارهٔ مکان
    gloss: سارا می‌پرسد که این صنف فارسی است یا نه.
    note: ببخشید برای جلب توجه مؤدبانه پیش از یک پرسش عملی به کار می‌رود.
  fa.a1.unit02.lesson06.teach.yes:
    title: بلی
    gloss: بلی
    note: بله کلمهٔ عادی و مؤدبانه برای «بلی/بله» است.
    example_gloss: بله، البته.
  fa.a1.unit02.lesson06.teach.meet_mina:
    title: مینا خودش را معرفی می‌کند
    gloss: مینا تأیید می‌کند، خودش را معرفی می‌کند و نام سارا را می‌پرسد.
    note: این پرسش مؤدبانهٔ گفتاری برای دو بزرگسال که در صنف باهم آشنا می‌شوند مناسب است.
  fa.a1.unit02.lesson06.teach.sara_name:
    title: سارا نامش را می‌گوید
    gloss: نام من سارا است.
    note: سارا از الگوی کوتاه گفتاری که قبلاً آموخته شد استفاده می‌کند.
  fa.a1.unit02.lesson06.teach.ask_origin:
    title: مینا دربارهٔ اصلیت می‌پرسد
    gloss: شما از کجا استید؟
    note: هستین گفت‌وگو را مؤدبانه، ولی خودمانی نگه می‌دارد.
  fa.a1.unit02.lesson06.teach.exchange_origins_sara:
    title: تبادل معلومات دربارهٔ اصلیت
    gloss: سارا می‌گوید اهل انگلستان است و می‌پرسد مینا اهل ایران است یا نه.
    note: هر دو گوینده شکل‌های مؤدبانه را نگه می‌دارند، چون تازه باهم آشنا شده‌اند.
  fa.a1.unit02.lesson06.teach.exchange_origins_mina:
    title: گفتن اهل کجا بودن، جواب
    gloss: مینا تأیید می‌کند که ایرانی است.
    note: '*ایرانی‌ام* شکل کوتاه *ایرانی هستم* (من ایرانی استم) است.'
  fa.a1.unit02.lesson06.teach.pleased:
    title: پاسخ به معرفی
    gloss: سارا می‌گوید از آشنایی با مینا خوشحال است.
    note: از آشنایی با شما خوشوقتم پایان طبیعی برای این گفت‌وگو است.
  fa.a1.unit02.lesson06.teach.pleased_and_enter:
    title: جواب سلام و داخل شدن به صنف
    gloss: مینا می‌گوید او هم خوشحال است و از سارا می‌خواهد داخل شود.
    note: من هم همین‌طور احوال‌پرسی مؤدبانهٔ سارا را جواب می‌دهد و بعد بفرمایید داخل صحنهٔ صنف را پیش می‌برد.
