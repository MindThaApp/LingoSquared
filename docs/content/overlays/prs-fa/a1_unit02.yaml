course:
  title: فارسی ایران A1
  description: فارسی ایرانی برای مبتدیان، با تمرکز بر خواندن خط، فهمیدن گفتار روزمره و انجام مؤدبانهٔ گفتگوهای عملی.
units:
  fa.a1.unit02.introductions:
    title: نام‌ها، اصلیت و معرفی
lessons:
  fa.a1.unit02.lesson01.script_ramp:
    title: حرف‌هایی را بخوانید که در معرفی به کار می‌روند
  fa.a1.unit02.lesson02.names:
    title: نام را پرسیدن و گفتن
  fa.a1.unit02.lesson03.pronouns_and_boodan:
    title: ضمیرهای مفرد و فعل بودن
  fa.a1.unit02.lesson04.countries_nationalities:
    title: کشورها و ملیت‌ها
  fa.a1.unit02.lesson05.origin:
    title: پرسیدن اینکه کسی از کجاست
  fa.a1.unit02.lesson06.language_class_dialogue:
