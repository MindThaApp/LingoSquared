teaching:
  fa.a2.unit49.lesson01.teach.event_words:
    title: جاها و مراسمی که می‌شود کسی را به آن دعوت کرد
    gloss: سینما، کنسرت، تیاتر، تولد، تکت
    note: '*کنسرت* همان کنسرت است و *تئاتر* نمایش یا تیاتر است. *بلیت* تکتی است که برای یک مراسم می‌گیرید.'
    example_gloss:
    - من دو تکت کنسرت دارم.
    - نمایش بسیار خوب بود.
    - روز جمعه به سینما می‌روم.
    - برای تولد دوستم تحفه خریدم.
  fa.a2.unit49.lesson01.teach.invite_words:
    title: دعوت و «برویم»
    gloss: دعوت، برویم
    note: '*دعوت* یعنی دعوت. *بریم* (یعنی «برویم») در آخر یک پیشنهاد دوستانه می‌آید، اغلب با *با هم*.'
    example_gloss:
    - تشکر از دعوت.
    - نیما سارا را دعوت می‌کند.
    - با هم به سینما برویم؟
    - امشب به پارک برویم؟
  fa.a2.unit49.lesson01.teach.more_events:
    title: انواع دیگر دورهمی
    gloss: مهمانی، پکنیک، دورهمی، جشن
    note: '*مهمونی* یعنی مهمانی، *پیک‌نیک* یعنی پکنیک، *دورهمی* یک جمع شدن ساده و دوستانه است و *جشن* یعنی محفل شادی.'
    example_gloss:
    - امشب مهمانی داریم.
    - روز جمعه به پکنیک می‌رویم.
    - روز شنبه جشن و دورهمی داریم.
  fa.a2.unit49.lesson01.teach.invitation_extras:
    title: کلمه‌های بیشتر دعوت
    gloss: ناهار، گشت‌وگذار، کارت دعوت
    note: '*ناهار* یعنی غذای چاشت، *گردش* یعنی گشت‌وگذار و *دعوتنامه* یعنی کارت دعوت یا دعوت نوشته‌شده.'
    example_gloss:
    - روز جمعه ناهار داریم.
    - با هم برای گشت‌وگذار برویم؟
    - من یک کارت دعوت دارم.
  fa.a2.unit49.lesson01.teach.invite_forms:
    title: سه راه آسان برای دعوت کردن
    gloss: می‌خواهی به کنسرت بیایی؟ با من به تیاتر می‌آیی؟ با هم به سینما برویم؟
    note: هر سه جمله پرسش اند. *می‌خوای بیای ...؟* می‌پرسد که طرف مقابل می‌خواهد بیاید یا نه. *با من میای ...؟* مستقیم می‌پرسد. *با هم بریم ...؟* پیشنهاد رفتن با هم است. اول یک کلمهٔ زمان بگو (*فردا*، *جمعه شب*) تا دعوت واضح شود.
  fa.a2.unit49.lesson02.teach.accept_words:
    title: کلمه‌ها برای گفتن «بله»
    gloss: بلی، حتماً، چه خوب، عالی است، باشه، می‌آیم
    note: '*آره* و *باشه* یعنی بلی. *حتما* معنای «حتماً» را اضافه می‌کند. *چه خوب* و *عالیه* نشان می‌دهند که خوش شده‌اید.'
    example_gloss:
    - بلی، حتماً می‌آیم.
    - چه خوب! تشکر.
    - باشه، ساعت هشت خوب است.
    - عالی است! روز شنبه می‌آیم.
  fa.a2.unit49.lesson02.teach.detail_words:
    title: پرسیدن جزئیات
    gloss: ساعت چند، کجا، کی
    note: 'بعد از قبول کردن، جزئیاتی را که لازم داری بپرس: *ساعت چند؟* (چه وقت از ساعت)، *کجا؟* (چی جا)، *کی؟* (چه وقت).'
    example_gloss:
    - ساعت چند می‌رویم؟
    - کجا می‌رویم؟
    - کی می‌رویم؟
  fa.a2.unit49.lesson02.teach.accept_forms:
    title: گفتن بلی و گفتن شاید
    gloss: از دعوت تشکر! حتماً می‌آیم؛ می‌توانم بیایم؛ شاید بتوانم بیایم
    note: بلی قطعی *حتما میام* است. *می‌تونم بیام* می‌گوید که توانایی آمدن را داری. *شاید بتونم بیام* یک «شاید» محتاطانه است و قول نیست. برای مؤدب بودن با *ممنون از دعوت* شروع کن.
  fa.a2.unit49.lesson03.teach.decline_words:
    title: کلمه‌ها برای مؤدبانه نه گفتن
    gloss: متأسفانه، ببخشید، نمی‌توانم، اما
    note: رد کردن را با *متاسفانه* یا *ببخشید* پیش از *نمی‌تونم بیام* نرم کن.
    example_gloss:
    - متأسفانه نمی‌توانم بیایم.
    - ببخشید، روز جمعه نمی‌توانم.
    - تشکر، اما نمی‌توانم.
  fa.a2.unit49.lesson03.teach.reason_words:
    title: دلیل‌ها برای نه گفتن
    gloss: کار دارم، قرار دارم، جلسه دارم، مریض استم، باید درس بخوانم، باید به صنف بروم
    note: '*باید* پیش از یک فعل کوتاه می‌آید: *باید درس بخونم*، *باید برم کلاس*. دلیل‌های دیگر با *دارم* می‌آیند: *کار دارم*، *قرار دارم*.'
    example_gloss:
    - روز جمعه کار دارم.
    - امشب قرار دارم.
    - فردا جلسه دارم.
    - امروز مریض استم.
    - باید درس بخوانم.
    - باید به صنف بروم.
  fa.a2.unit49.lesson03.teach.future_reasons:
    title: دلیل دربارهٔ پلان‌های تو
    gloss: چون فردا به شمال می‌روم، چون آخر هفته به تهران می‌روم
    note: 'دلیل می‌تواند یک پلان باشد: *چون* به‌علاوهٔ *می‌خوام برم* و یک جا.'
    example_gloss:
    - چون فردا به شمال می‌روم.
    - چون آخر هفته به تهران می‌روم.
  fa.a2.unit49.lesson03.teach.host_schedule:
    title: میزبانی و برنامهٔ تو
    gloss: میزبان، مهمان، مصروف، فارغ
    note: '*میزبان* کسی است که مهمان می‌گیرد و *مهمون* کسی است که مهمان است. وقتی مصروف استی *مشغولم* و وقتی فارغ استی *آزادم* بگو.'
    example_gloss:
    - سارا میزبان محفل است.
    - امشب مهمان دارم.
    - روز جمعه مصروف استم و روز شنبه فارغ.
  fa.a2.unit49.lesson03.teach.hosting_extras:
    title: میزبانی و وقت داشتن
    gloss: میزبانی، پذیرایی از مهمان، فرصت / وقت
    note: '*میزبانی* یعنی مهمان گرفتن. *پذیرایی* یعنی از مهمان‌ها خدمت کردن. *فرصت* یعنی موقع یا وقت کافی برای انجام دادن کاری.'
    example_gloss:
    - سارا میزبانی می‌کند.
    - سارا از مهمان پذیرایی می‌کند.
    - من روز شنبه وقت دارم.
  fa.a2.unit49.lesson03.teach.decline_pattern:
    title: نه گفتن با دلیل
    gloss: ببخشید، نمی‌توانم بیایم، چون باید درس بخوانم
    note: 'رد کردن مؤدبانه سه بخش دارد: عذرخواهی (*ببخشید* یا *متاسفانه*)، رد کردن (*نمی‌تونم بیام*) و دلیل با *چون*. دلیل را می‌شود اول هم گفت: *چون باید درس بخونم، نمی‌تونم بیام*.'
  fa.a2.unit49.lesson04.teach.alt_words:
    title: پیشنهاد روز دیگر
    gloss: اما، شنبه چطور است، هفتهٔ آینده، یک وقت دیگر
    note: '*ولی* («اما») رد کردن را به فکر نو وصل می‌کند. *شنبه چطوره؟* یک روز دیگر پیشنهاد می‌کند.'
    example_gloss:
    - روز جمعه نمی‌توانم، اما روز شنبه می‌توانم.
    - روز شنبه چطور است؟
    - هفتهٔ آینده می‌توانم.
    - یک وقت دیگر می‌رویم.
  fa.a2.unit49.lesson04.teach.if_plan:
    title: اگر وقت داری
    gloss: اگر وقت داری
    note: '*اگه* («اگر») با زمان حال یک شرط دوستانه می‌سازد: *اگه وقت داری، با هم می‌ریم*.'
    example_gloss:
    - اگر وقت داری، با هم می‌رویم.
    - اگر روز شنبه وقت داری، بیا.
  fa.a2.unit49.lesson04.teach.alt_pattern:
    title: نه، با دلیل و فکر دیگر
    gloss: نمی‌توانم بیایم، چون کار دارم. اما شنبه می‌توانم
    note: 'یک رد کردن خوب فقط به نه ختم نمی‌شود. دلیل را با *چون* بگو، بعد با *ولی* وقت دیگر پیشنهاد کن: *ولی شنبه می‌تونم*. همچنان می‌توانی بپرسی *شنبه چطوره؟*'
  fa.a2.unit49.lesson05.teach.reading_invite:
    title: دعوت سارا
    gloss: سلام نیما! جمعه شب من دو ټکت کنسرت دارم. می‌خواهی با من بیایی؟ ساعت هشت می‌رویم. فعلاً، سارا
    note: محفل، روز و وقت را پیدا کن.
  fa.a2.unit49.lesson05.teach.reading_reply:
    title: جواب نیما
    gloss: سلام سارا! از دعوت تشکر. متأسفانه جمعه نمی‌توانم بیایم، چون باید درس بخوانم. اما شنبه می‌توانم. شنبه شب با هم به تیاتر برویم؟ فعلاً، نیما
    note: تشکر، رد کردن، دلیل و فکر نو را پیدا کن.
  fa.a2.unit49.lesson06.teach.turn01:
    title: سارا نیما را دعوت می‌کند
    gloss: سلام نیما! جمعه شب می‌خواهی با من به کنسرت بیایی؟
    note: سارا با *می‌خوای* دعوت می‌کند.
  fa.a2.unit49.lesson06.teach.turn02:
    title: نیما تشکر می‌کند و نه می‌گوید
    gloss: از دعوت تشکر! اما متأسفانه جمعه نمی‌توانم، چون باید درس بخوانم.
    note: تشکر، رد کردن و دلیل در یک جواب.
  fa.a2.unit49.lesson06.teach.turn03:
    title: سارا روز دیگر پیشنهاد می‌کند
    gloss: شنبه چطور است؟ می‌خواهی به تیاتر برویم؟
    note: یک روز نو و یک برنامهٔ نو.
  fa.a2.unit49.lesson06.teach.turn04:
    title: نیما قبول می‌کند و وقت را می‌پرسد
    gloss: بلی، شنبه می‌توانم. ساعت چند؟
    note: نیما قبول می‌کند و جزئیات می‌پرسد.
  fa.a2.unit49.lesson06.teach.turn05:
    title: سارا وقت را می‌گوید
    gloss: ساعت هشت.
    note: یک جواب کوتاه.
  fa.a2.unit49.lesson06.teach.turn06:
    title: نیما تأیید می‌کند
    gloss: عالی است! پس شنبه می‌آیم. فعلاً!
    note: '*پس* پلان را تأیید می‌کند.'
