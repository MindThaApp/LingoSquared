teaching:
  fa.a2.unit30.lesson01.teach.people_time:
    title: مردم و وقت
    gloss: من، تو، سارا، نیما، امشب، فردا
    note: '*امشب* یعنی «همین شب» و *فردا* یعنی «روز بعد». در فارسی ایران معمولاً *من* گفته نمی‌شود، چون آخر فعل شخص را نشان می‌دهد.'
    example_gloss:
    - فردا آمده می‌توانم.
    - سارا امشب آمده نمی‌تواند.
  fa.a2.unit30.lesson01.teach.skills:
    title: مهارت‌ها
    gloss: گیتار زدن، موتر راندن، آشپزی کردن، شنا کردن، انگلیسی صحبت کردن
    note: این‌ها مهارت استند. هر کدام یک اسم و یک فعل کمکی است و فعل کمکی با شخص تغییر می‌کند.
    example_gloss:
    - من گیتار زده می‌توانم.
    - من موتر رانده نمی‌توانم.
    - نیما انگلیسی صحبت کرده می‌تواند.
  fa.a2.unit30.lesson01.teach.verbs_after:
    title: فعل‌ها بعد از «می‌توانم»
    gloss: که بیایم، که بروم، که بزنم، که بخوانم، که بکنم
    note: این‌ها شکل‌های «که من...» فعل استند (فعل التزامی). در فارسی گفتاری ایران یکی از آن‌ها بعد از *می‌تونم* می‌آید.
    example_gloss:
    - آمده می‌توانم.
    - رفته نمی‌توانم.
    - انگلیسی صحبت کرده می‌توانم.
  fa.a2.unit30.lesson01.teach.can_forms:
    title: می‌توانم و نمی‌توانم
    gloss: می‌توانم، می‌توانی، می‌تواند؛ نمی‌توانم، نمی‌توانی، نمی‌تواند
    note: 'فعل گفتاری «توانستن» در فارسی ایران *می‌تونم*، *می‌تونی*، *می‌تونه* است. برای منفی *نـ* پیش از آن می‌آید: *نمی‌تونم*.'
  fa.a2.unit30.lesson01.teach.can_plus_subjunctive:
    title: می‌توانم + فعل «که من...»
    gloss: آمده می‌توانم؛ صحبت کرده نمی‌توانم
    note: 'بعد از *می‌تونم* فعل دوم التزامی می‌آید، نه مصدر: *می‌تونم بیام*، *نمی‌تونم صحبت کنم*. فعل دوم همان شناسه‌ی *می‌تونم* را دارد.'
  fa.a2.unit30.lesson02.teach.person_word:
    title: تو و او
    gloss: تو، او
    note: در فارسی گفتاری ایران *اون* یعنی «او»؛ آخر فعل نشان می‌دهد که منظور کیست.
    example_gloss:
    - او آمده می‌تواند.
    - تو رفته می‌توانی.
  fa.a2.unit30.lesson02.teach.endings:
    title: سه شخص
    gloss: که من/تو/او بیایم، بروم، بزنم
    note: 'شناسه‌ی فعل التزامی با شخص می‌آید: -م (من)، -ی (تو)، -ه یا -د (او). همین الگو در هر فعل تکرار می‌شود.'
    example_gloss:
    - تو گیتار زده می‌توانی.
    - او رفته می‌تواند.
  fa.a2.unit30.lesson02.teach.work_tech:
    title: مهارت‌های کاری و تکنالوژی
    gloss: ایمیل فرستادن، عکس گرفتن، فارسی خواندن، با کمپیوتر کار کردن، با موبایل
    note: این مهارت‌ها از کار و تکنالوژی می‌آیند. *با* یعنی «با» یا «روی».
    example_gloss:
    - نیما با کمپیوتر کار کرده می‌تواند.
    - من ایمیل فرستاده می‌توانم.
    - تو با موبایل عکس گرفته می‌توانی.
  fa.a2.unit30.lesson02.teach.person_agreement:
    title: هر دو فعل هماهنگ استند
    gloss: آمده می‌توانم، آمده می‌توانی، آمده می‌تواند
    note: 'شخص را در هر دو فعل با هم تغییر بدهید: *می‌تونم بیام*، *می‌تونی بیای*، *می‌تونه بیاد*. ناهماهنگی مثل *می‌تونی بیام* غلط است.'
  fa.a2.unit30.lesson03.teach.three_words:
    title: باید، شاید، ممکن است
    gloss: باید، ممکن است، شاید
    note: '*باید* ضرورت را می‌رساند. *ممکنه* و *شاید* هر دو امکان را می‌رسانند. بعد از هر سه فعل التزامی می‌آید.'
    example_gloss:
    - باید بروم.
    - ممکن است بیایم.
    - شاید بروم.
  fa.a2.unit30.lesson03.teach.late_rain:
    title: دیر، باران، نیامدن
    gloss: دیر، که برسم، باران، که نروم، که نیایم
    note: '*نیام* و *نرم* التزامی منفی استند: *نـ* پیش از فعل می‌آید.'
    example_gloss:
    - شاید دیر برسم.
    - ممکن است باران ببارد.
    - ممکن است نیایم.
  fa.a2.unit30.lesson03.teach.can_must_might:
    title: می‌توانم، باید، شاید
    gloss: رفته می‌توانم؛ باید بروم؛ شاید بروم
    note: 'فعل بعدی همان است، اما کلمه‌ی اول معنی را تغییر می‌دهد: *می‌تونم برم* (توانایی یا فرصت دارم)، *باید برم* (مجبورم)، *ممکنه برم* (امکان دارد بروم).'
  fa.a2.unit30.lesson03.teach.possibility_rule:
    title: 'امکان: ممکنه / شاید + التزامی'
    gloss: شاید دیر برسم؛ شاید باران ببارد؛ شاید نیایم
    note: '*ممکنه* با شخص تغییر نمی‌کند؛ فعل بعد از آن تغییر می‌کند: *ممکنه دیر برسم*، *ممکنه نیما نیاد*. *شاید* هم همین‌طور است. برای «شاید نیایم» فعل دوم را منفی کنید: *ممکنه نیام*.'
  fa.a2.unit30.lesson04.teach.availability:
    title: وقت داشتن
    gloss: وقت دارم، وقت ندارم، فارغ استم، مصروفم، جلسه دارم، آخر هفته
    note: '*وقت دارم* و *آزادم* می‌رسانند که شما وقت دارید؛ *وقت ندارم* و *مشغولم* می‌رسانند که وقت ندارید.'
    example_gloss:
    - فردا وقت دارم.
    - امشب مصروفم.
    - آخر هفته فارغ استم.
  fa.a2.unit30.lesson04.teach.linkers:
    title: چون، ولی، نه، و
    gloss: چون، ولی، نه، و
    note: '*چون* دلیل می‌آورد و *ولی* تضاد را اضافه می‌کند.'
    example_gloss:
    - امشب آمده نمی‌توانم، چون جلسه دارم.
    - فردا فارغ استم، ولی شاید دیر شوم.
  fa.a2.unit30.lesson04.teach.maybe_able:
    title: 'شاید بتوانم: شاید بتونم'
    gloss: شاید بتوانم بیایم
    note: 'برای گفتن «شاید بتوانم»، *شاید* را پیش از *بتونم* (التزامی «توانستن») بگذارید و بعد یک فعل التزامی دیگر بیاورید: *شاید بتونم بیام*. این کورس *شاید بتونم* را به‌عنوان نمونه یاد می‌دهد.'
  fa.a2.unit30.lesson04.teach.reason_for_no:
    title: نمی‌توانم + دلیل
    gloss: امشب آمده نمی‌توانم، چون جلسه دارم
    note: 'رد کردن با دلیل طبیعی به نظر می‌رسد: *نمی‌تونم بیام، چون ...*. دلیل یک جمله‌ی ساده‌ی زمان حال است.'
  fa.a2.unit30.lesson05.teach.reading:
    title: پیامی از نیما
    gloss: سلام سارا! امشب آمده نمی‌توانم، چون جلسه دارم. فردا فارغ استم و آمده می‌توانم، ولی شاید دیر برسم. با کمپیوتر کار کرده می‌توانم، ولی گیتار زده نمی‌توانم. شاید عکس هم گرفته بتوانم.
    note: یک بار بخوانید تا بفهمید نیما چه کاری می‌تواند و چه کاری نمی‌تواند، بعد دوباره بخوانید تا بفهمید چه چیزی ممکن است اتفاق بیفتد.
  fa.a2.unit30.lesson06.teach.dialogue_words:
    title: کلمه‌های جواب
    gloss: بلی، باشد، مشکلی نیست، زودتر
    note: '*اشکالی نداره* جواب دوستانه به معنی «مشکلی نیست» است. *زودتر* یعنی «پیش‌تر».'
    example_gloss:
    - باشد، مشکلی نیست.
    - شاید بتوانم زودتر بیایم.
  fa.a2.unit30.lesson06.teach.turn01:
    title: سارا نیما را دعوت می‌کند
    gloss: 'سارا می‌پرسد: نیما، امشب آمده می‌توانی؟'
    note: سؤال اول درباره‌ی توانایی و وقت داشتن است.
  fa.a2.unit30.lesson06.teach.turn02:
    title: نیما نمی‌پذیرد
    gloss: 'نیما: نه، امشب آمده نمی‌توانم. جلسه دارم.'
    note: رد کردن با دلیل.
  fa.a2.unit30.lesson06.teach.turn03:
    title: سارا درباره فردا می‌پرسد
    gloss: 'سارا: فردا چطور؟ فردا وقت داری؟'
    note: '*فردا چی؟* صحبت را به وقت دیگری می‌برد.'
  fa.a2.unit30.lesson06.teach.turn04:
    title: 'نیما: می‌تواند بیاید، ولی شاید دیر برسد'
    gloss: 'نیما: بلی، فردا آزاد استم. آمده می‌توانم، ولی شاید دیر برسم.'
    note: توانایی و امکان در یک جواب.
  fa.a2.unit30.lesson06.teach.turn05:
    title: سارا درباره عکس‌ها می‌پرسد
    gloss: 'سارا: خوب است، مشکلی نیست. با موبایل عکس گرفته می‌توانی؟'
    note: یک سوال تازه درباره توانایی.
  fa.a2.unit30.lesson06.teach.turn06:
    title: نیما گفتگو را تمام می‌کند
    gloss: 'نیما: بلی، می‌توانم. شاید زودتر آمده بتوانم.'
    note: توانایی، بعد یک امکان امیدوارکننده.
