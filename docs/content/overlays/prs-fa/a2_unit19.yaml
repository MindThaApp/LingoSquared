teaching:
  fa.a2.unit19.lesson01.teach.weekend_phrase:
    title: آخر هفتهٔ گذشته
    gloss: آخر هفتهٔ گذشته
    note: '*آخر هفته‌ی پیش* در اصل یعنی «پایان هفتهٔ گذشته»، و فارسی ایرانی این‌گونه «آخر هفتهٔ گذشته» را می‌گوید. در ایران آخر هفته پنجشنبه و جمعه است.'
    example_gloss: آخر هفتهٔ گذشته در خانه ماندم.
  fa.a2.unit19.lesson01.teach.days:
    title: پنجشنبه، جمعه
    gloss: پنجشنبه، جمعه
    note: این دو روز آخر هفتهٔ ایرانی را می‌سازند، به همین دلیل معمولاً در گزارش آخر هفته از آن‌ها گفته می‌شود.
    example_gloss:
    - روز پنجشنبه به پارک رفتم.
    - روز جمعه در خانه ماندم.
  fa.a2.unit19.lesson01.teach.parts_of_day:
    title: صبح، چاشت، عصر
    gloss: صبح، چاشت، عصر
    note: '*عصر* وقت بعد از ظهر و آغاز شام را در بر می‌گیرد. وقت روز را درست بعد از روز بیاورید: *پنجشنبه صبح* یعنی «روز پنجشنبه صبح».'
    example_gloss:
    - پنجشنبه صبح به خریداری رفتم.
    - تا چاشت خوابیدم.
    - عصر به پارک رفتم.
  fa.a2.unit19.lesson01.teach.places:
    title: پارک، سینما، بانک
    gloss: پارک، سینما، بانک
    note: 'با *رفتن* (رفتن)، *به* در گفتار اغلب حذف می‌شود: *به پارک رفتم* و *رفتم پارک* هر دو یعنی «به پارک رفتم».'
    example_gloss:
    - روز پنجشنبه به پارک رفتم.
    - روز جمعه به سینما رفتم.
    - روز پنجشنبه به بانک رفتم.
  fa.a2.unit19.lesson01.teach.errands:
    title: خریداری
    gloss: خریداری
    note: '*رفتم خرید* یعنی «به خریداری رفتم». همین واژهٔ *خرید* شکل گذشتهٔ سوم شخص مفرد *خریدن* هم است: «او خرید».'
    example_gloss: پنجشنبه صبح به خریداری رفتم.
  fa.a2.unit19.lesson01.teach.home_book_film:
    title: خانه، کتاب، فلم
    gloss: خانه، کتاب، فلم
    note: '*خونه* شکل گفتاری *خانه* است. در گفتار *یه کتاب* شکل معمول *یک کتاب* است؛ هر دو درست‌اند.'
    example_gloss:
    - روز جمعه در خانه ماندم.
    - یک کتاب خواندم.
    - من فلم تماشا کردم.
  fa.a2.unit19.lesson01.teach.people:
    title: دوستم، مادرکلانم
    gloss: دوستم، مادرکلانم
    note: 'پسوند *-م* بر اسم یعنی «من»: *دوست* می‌شود *دوستم* (دوست من).'
    example_gloss:
    - روز پنجشنبه دوستم آمد.
    - روز جمعه مادرکلانم آمد.
  fa.a2.unit19.lesson01.teach.visit:
    title: دیدن و ملاقات
    gloss: دیدن / ملاقات
    note: '*رفتن دیدن* به‌همراه نام یک شخص یعنی رفتن به دیدار او: *رفتم دیدن دوستم* یعنی «به دیدن دوستم رفتم». همین واژهٔ *دیدن* معنی «دیدن» را هم دارد.'
    example_gloss: به دیدن مادرکلانم رفتم.
  fa.a2.unit19.lesson01.teach.verbs_go_stay:
    title: رفتم، آمدم، ماندم
    gloss: رفتم، آمدم، ماندم
    note: این‌ها شکل‌های ماضی ساده برای *من* استند. در گفتار فارسی ایران *اومدم* و *موندم* گفته می‌شود، ولی در نوشتار دقیق *آمدم* و *ماندم* نوشته می‌شود.
    example_gloss:
    - روز پنجشنبه به پارک رفتم.
    - روز جمعه به خانه آمدم.
    - آخر هفتهٔ گذشته در خانه ماندم.
  fa.a2.unit19.lesson01.teach.verbs_eat_see:
    title: خوردم، دیدم، خواندم، خوابیدم
    gloss: خوردم، دیدم، خواندم، خوابیدم
    note: چهار شکل دیگر ماضی ساده برای *من*. *خوندم* شکل گفتاری *خواندم* است.
    example_gloss:
    - ناهار خوردم.
    - من فلم تماشا کردم.
    - یک کتاب خواندم.
    - روز جمعه خوابیدم.
  fa.a2.unit19.lesson02.teach.pronouns:
    title: من، تو، او، ما
    gloss: من، تو (غیررسمی)، او، ما
    note: در فارسی ایران محاوره‌یی معمولاً ضمیر را نمی‌آرند، چون آخر فعل نشان می‌دهد که کار را کی کرده. ضمیر را برای تأکید یا مقایسه می‌آرند. *اون* هم «او» (مذکر) و هم «او» (مؤنث) معنا می‌دهد.
    example_gloss:
    - من روز پنج‌شنبه به پارک رفتم.
    - تو در خانه ماندی؟
    - او روز جمعه آمد.
    - ما روز پنج‌شنبه به پارک رفتیم.
  fa.a2.unit19.lesson02.teach.stem_rule:
    title: ریشه‌ی گذشته
    gloss: 'ریشه‌های گذشته: رفت، خورد، دید، خواند، ماند، آمد، خوابید'
    note: 'شکل مصدر فعل به *-ن* ختم می‌شود. اگر آن را بیندازی، ریشه‌ی گذشته به دست می‌آید: *رفتن* ← *رفت*، *خوردن* ← *خورد*، *دیدن* ← *دید*، *خوندن* ← *خوند*، *موندن* ← *موند*، *اومدن* ← *اومد*، *خوابیدن* ← *خوابید*. همه‌ی گذشته‌ی ساده بر همین ریشه ساخته می‌شود.'
  fa.a2.unit19.lesson02.teach.endings:
    title: شناسه‌ها بر ریشه‌ی گذشته
    gloss: رفتم، رفتی، رفت، رفتیم، رفتید، رفتند
    note: 'شناسه را به ریشه اضافه کن: *-م* (من)، *-ی* (تو)، بدون شناسه (او)، *-یم* (ما)، *-ین* (شما یا رسمی، در محاوره: *رفتین*)، *-ن* (آن‌ها). در نوشتار دقیق برای «شما» *-ید* (*رفتید*) و برای «آن‌ها» *-ند* (*رفتند*) می‌آید. توجه کن که *رفتن* معنای «رفتن» (مصدر) هم دارد؛ از روی جمله فرق‌شان را می‌فهمی. و دو *-م* را با هم اشتباه نکن: بر اسم یعنی «ام/م» ملکیت (*دوستم*)، و بر فعل گذشته یعنی «من» (*رفتم*).'
  fa.a2.unit19.lesson02.teach.eat_forms:
    title: همین شناسه‌ها بر خورد
    gloss: خوردم، خوردی، خورد، خوردیم
    note: 'همان شناسه‌ها، ریشه‌ی دیگر: *خورد* + *-م*، *-ی*، هیچ، *-یم*.'
  fa.a2.unit19.lesson02.teach.stay_forms:
    title: همین شناسه‌ها بر موند
    gloss: ماندم، ماندی، ماند، ماندیم
    note: 'ریشه‌ی *موند* همین شناسه‌ها را می‌گیرد. در شکل «او» چیزی اضافه نمی‌شود: *اون خونه موند*.'
  fa.a2.unit19.lesson03.teach.and_but:
    title: اما، و
    gloss: اما، و
    note: '*ولی* دو جمله‌ی متضاد را وصل می‌کند؛ *و* فقط یک چیز دیگر اضافه می‌کند.'
    example_gloss:
    - به پارک رفتم، اما به سینما نرفتم.
    - روز جمعه در خانه ماندم و کتاب خواندم.
  fa.a2.unit19.lesson03.teach.time_words:
    title: دیروز، امروز، هر روز
    gloss: دیروز، امروز، هر روز
    note: 'کلمه‌های زمان در انتخاب زمان فعل کمک می‌کنند: *دیروز* به گذشته اشاره دارد و *هر روز* (عادت) به حال. *امروز* با هر دو آمده می‌تواند: *امروز نمی‌رم پارک* «امروز به پارک نمی‌روم»، ولی *امروز رفتم پارک* «امروز به پارک رفتم» وقتی که کار انجام شده باشد.'
    example_gloss:
    - دیروز به پارک رفتم.
    - امروز به پارک نمی‌روم.
    - هر روز به پارک می‌روم.
  fa.a2.unit19.lesson03.teach.negative_rule:
    title: 'گذشته‌ی منفی: نـ + فعل'
    gloss: نرفتم، نخوردم، ندیدم، نخواندم، نماندم
    note: 'برای گفتن اینکه کاری را نکردی، *نـ* را مستقیم پیش از فعل گذشته بگذار و چیز دیگری را تغییر نده: *رفتم* ← *نرفتم*، *خوردم* ← *نخوردم*، *ندیدم*، *نخوندم*، *نموندم*. شناسه‌ها همان می‌مانند: *نرفتم*، *نرفتی*، *نرفت*، *نرفتیم*. *نـ* را به فعل چسپان بنویس؛ این کلمه‌ی جداگانه‌ی *نه* («نخیر») نیست: *نه، نرفتم* یعنی «نه، نرفتم».'
  fa.a2.unit19.lesson03.teach.neg_aamad:
    title: 'استثنا: اومدن'
    gloss: نیامدم، نیامدی، نیامد، نیامدیم
    note: '*اومدن* («آمدن») با مصوت شروع می‌شود، پس *نـ* + *ا* به *نی* تبدیل می‌شود: *اومدم* ← *نیومدم* (هرگز *ناومدم* نه). بقیه‌ی شناسه‌ها از قاعده‌ی عادی پیروی می‌کنند: *نیومدی*، *نیومد*، *نیومدیم*. در نوشتار دقیق *آمدم* ← *نیامدم* است.'
  fa.a2.unit19.lesson03.teach.past_vs_present:
    title: گذشته یا حال؟
    gloss: می‌روم، رفتم، نمی‌روم، نرفتم
    note: 'گذشته‌ی ساده *می‌* ندارد و ریشه‌ی گذشته را به کار می‌برد (*رفتم*)؛ حال *می‌* به‌علاوه‌ی ریشه‌ی حال دارد (*می‌رم*). ریشه و *می‌* با هم زمان را نشان می‌دهند. منفی‌ها هم همین‌طور است: *نرفتم* «نرفتم» ولی *نمی‌رم* «نمی‌روم / نمی‌روم الان». تلفظ: منفی گذشته *na-* است (*نرفتم*، ''na-raftam'')، ولی *نمی‌* *ne-* است (*نمی‌رم*، ''ne-miram'').'
  fa.a2.unit19.lesson04.teach.sequence_words:
    title: اول، بعد، آخرش
    gloss: اول، بعد / پس از آن، آخرش
    note: '*اول* ترتیب را شروع می‌کند، *بعد* آن را ادامه می‌دهد (می‌توانی تکرارش کنی) و *آخرش* آن را تمام می‌کند.'
    example_gloss:
    - اول به بانک رفتم.
    - بعد به خرید رفتم.
    - آخرش به خانه آمدم.
  fa.a2.unit19.lesson04.teach.sequence_note:
    title: بیان رویدادها به ترتیب
    gloss: اول به بانک رفتم، بعد به خرید رفتم، آخرش به خانه آمدم.
    note: 'رویدادها را به همان ترتیبی که رخ داده‌اند بگو. هر جمله فعل گذشته‌ی خودش را دارد (با *رفتن* فعل اغلب پیش از جا می‌آید: *رفتم بانک*). جمله‌ها را با کاما یا با *و* وصل کن: *اول رفتم بانک و بعد رفتم خرید*. رویداد منفی را در جای خودش در قصه بگذار: *بعد رفتم پارک، ولی سینما نرفتم* یا *بعد رفتم خرید، ولی ورزش نکردم*. *اومدم خونه* («به خانه آمدم») راه طبیعی برای ختم کردن یک روز است.'
  fa.a2.unit19.lesson04.teach.question:
    title: آخر هفته‌ی گذشته چه کار کردی؟
    gloss: آخر هفته‌ی گذشته چه کار کردی؟
    note: '*چیکار کردی؟* (به معنای «چه کار کردی؟») شیوه‌ی معیاری پرسیدن است. با فعل‌های گذشته جواب می‌دهی، برای هر کاری که کردی یک جمله.'
  fa.a2.unit19.lesson04.teach.sport:
    title: ورزش
    gloss: ورزش
    note: '*ورزش کردن* یعنی ورزش کردن.'
    example_gloss: روز پنج‌شنبه ورزش کردم.
  fa.a2.unit19.lesson04.teach.compound_negative:
    title: منفی کردن فعل‌هایی مثل خرید کردن
    gloss: خرید کردم، خرید نکردم، ورزش کردم، ورزش نکردم
    note: 'فعل‌هایی مثل *خرید کردن* («خرید کردن») و *ورزش کردن* از یک اسم و *کردن* ساخته شده‌اند. *نـ* را بر فعل بگذار، نه بر اسم: *خرید نکردم*، هرگز *نخرید کردم* نه. شکل «او» *نکرد* است: *ورزش نکرد*.'
  fa.a2.unit19.lesson04.teach.no_answer:
    title: جواب دادن به سوال بلی/نخیر در گذشته
    gloss: به سینما رفتی؟ نه، نرفتم.
    note: 'برای جواب منفی به سوالی درباره‌ی گذشته، فعل را با *نـ* تکرار کن: *نرفتم*. آوردن *نه* («نخیر») پیش از آن بسیار معمول است. برای جواب مثبت، فعل را بدون آن تکرار کن: *رفتم*.'
  fa.a2.unit19.lesson05.teach.spot_negative:
    title: منفی را پیدا کن
    gloss: نکردم، نرفتم، ندیدم
    note: 'وقتی می‌خوانی یا گوش می‌کنی، آغاز هر فعل را خوب ببین. یک *نـ* کوچک معنا را کاملاً برمی‌گرداند: *رفتم* «رفتم» ولی *نرفتم* «نرفتم». در گزارش آخر هفته، منفی‌ها نشان می‌دهند چه چیزی رخ نداده، پس به آن‌ها هم مثل فعالیت‌ها دقت کن.'
  fa.a2.unit19.lesson05.teach.reading_message:
    title: پیام سارا به دوستش
    gloss: سلام! آخر هفته‌ی گذشته، روز پنج‌شنبه صبح به خرید رفتم. بعد به پارک رفتم. عصر به دیدن مادرکلانم رفتم. روز جمعه در خانه ماندم و کتاب خواندم. اما ورزش نکردم و به سینما نرفتم.
    note: یک گزارش کوتاه نوشتاری از آخر هفته. یک بار آن را برای فعالیت‌ها و ترتیب‌شان بخوان، بار دوم برای دو کاری که او نکرد.
  fa.a2.unit19.lesson06.teach.names:
    title: سارا، نیما
    gloss: سارا، نیما
    note: دو دوست از درس‌های پیشین.
    example_gloss:
    - سارا روز پنج‌شنبه به پارک رفت.
    - نیما روز جمعه آمد.
  fa.a2.unit19.lesson06.teach.until:
    title: تا
    gloss: تا
    note: '*تا* پیش از وقت یا روز یعنی «تا»: *تا ظهر* «تا چاشت».'
    example_gloss: تا چاشت خوابیدم.
  fa.a2.unit19.lesson06.teach.what_about:
    title: و ... چه؟
    gloss: جمعه چطور؟ تو چطور؟
    note: '*چی؟* بعد از یک کلمه یعنی «و درباره‌ی آن چطور؟» -- راه سریع برای پیش بردن صحبت.'
  fa.a2.unit19.lesson06.teach.how_nice:
    title: چه خوب!
    gloss: چه خوب!
    note: واکنش دوستانه به خبر خوب.
  fa.a2.unit19.lesson06.teach.turn01:
    title: سارا درباره‌ی آخر هفته می‌پرسد
    gloss: سارا از نیما می‌پرسد که آخر هفته‌ی گذشته چه کار کرد.
    note: سوال معیاری برای گزارش آخر هفته‌ی گذشته.
  fa.a2.unit19.lesson06.teach.turn02:
    title: پنج‌شنبه‌ی نیما
    gloss: نیما می‌گوید که روز پنج‌شنبه اول به بانک رفت، بعد به خرید رفت.
    note: '*اول ... بعد ...* دو کار را به ترتیب می‌آورد.'
  fa.a2.unit19.lesson06.teach.turn03:
    title: سارا درباره‌ی جمعه می‌پرسد
    gloss: 'سارا می‌پرسد: جمعه چطور؟ ورزش کردی؟'
    note: '*ورزش کردی؟* سوال بلی/نخیر درباره‌ی کاری در گذشته است.'
  fa.a2.unit19.lesson06.teach.turn04:
    title: جمعه‌ی نیما
    gloss: 'نیما می‌گوید نه، ورزش نکرد. تا چاشت خوابید و عصر به دیدن دوستش رفت. از سارا می‌پرسد: تو چطور؟'
    note: '*ورزش نکردم* -- *نـ* بر فعل می‌آید. بقیه‌ی جمعه‌ی او مثبت است.'
  fa.a2.unit19.lesson06.teach.turn05:
    title: آخر هفته‌ی سارا
    gloss: سارا می‌گوید که روز پنج‌شنبه به پارک رفت، و روز جمعه در خانه ماند و کتاب خواند.
    note: سارا برای جواب دادن به *تو چی؟* از *من* کار می‌گیرد -- جایی که آوردن ضمیر طبیعی است.
  fa.a2.unit19.lesson06.teach.turn06:
    title: واکنش نیما
    gloss: 'نیما می‌گوید: چه خوب!'
    note: یک واکنش کوتاه و دوستانه در پایان.
  fa.a2.unit19.lesson06.teach.third_person:
    title: صحبت درباره‌ی دیگران
    gloss: نیما رفت، سارا ماند، نیما نرفت، سارا نکرد
    note: 'وقتی درباره‌ی کار دیگری گزارش می‌دهی، برای «او» ریشه‌ی خالی را به کار ببر: *نیما رفت بانک*، *سارا خونه موند*. منفی هم باز *نـ* + ریشه است: *نیما نرفت*، *سارا ورزش نکرد*. هیچ شناسه‌یی اضافه نمی‌شود، پس نام (یا *اون*) نشان می‌دهد که کی کار را کرده.'
