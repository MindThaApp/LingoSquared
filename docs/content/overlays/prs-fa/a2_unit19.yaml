course:
  title: فارسی ایرانی A2
  description: 'فارسی ایرانی سطح ابتدایی‌بالا با ستون فقرات دستوری: بانک، نظرها، وقت‌های ملاقات و بیشتر؛ حالا گذشتهٔ ساده به صورت یک نظام آغاز می‌شود (ریشه‌ها، پایان‌ها و گذشتهٔ منفی).'
units:
