      status: correct
    feedback: صبح بخیر، سلام بیتکلف و مؤدبانهٔ صبح است.
  fa.a1.unit01.lesson02.exercise03.goodbye_meaning:
    instruction: معنای خداحافظ را انتخاب کنید.
    correct_option: خدا حافظ
    distractors:
    - سلام
    - تشکر
    - شام بخیر
    accepted_answers:
    - value: خدا حافظ
      status: correct
    feedback: خداحافظ، خداحافظی عمومی و معمول است.
  fa.a1.unit01.lesson02.exercise04.recognize_evening_reading:
    instruction: این سلام و احوالپرسی چه معنی دارد؟
    correct_option: عصر بخیر / شام بخیر
    distractors:
    - صبح بخیر
    - خدا حافظ
    - سلام
    accepted_answers:
    - value: عصر بخیر / شام بخیر
      status: correct
    feedback: عصر بخیر در وقت‌های بعدی روز گفته می‌شود.
  fa.a1.unit01.lesson02.exercise05.order_youre_welcome:
