teaching:
  fa.a1.unit01.lesson01.teach.rtl:
    title: جهت نوشتن فارسی از راست به چپ است
    gloss: فارسی از راست به چپ نوشته می‌شود.
    note: فارسی را از کنارهٔ راست به طرف چپ بخوانید.
  fa.a1.unit01.lesson01.teach.seen:
    title: حرف س
    gloss: s
    note: س معمولاً صدای s را نشان می‌دهد.
  fa.a1.unit01.lesson01.teach.lam:
    title: حرف ل
    gloss: l
    note: ل صدای l را نشان می‌دهد و به حرف‌های پیش و پس از خود وصل می‌شود.
  fa.a1.unit01.lesson01.teach.alef:
    title: حرف ا
    gloss: ā / a
    note: ا اغلب ā کشیده را نشان می‌دهد و به حرف بعدی وصل نمی‌شود.
  fa.a1.unit01.lesson01.teach.mim:
    title: حرف م
    gloss: m
    note: م صدای m را نشان می‌دهد و هنگام وصل شدن شکلش تغییر می‌کند.
  fa.a1.unit01.lesson01.teach.salam_shape:
    title: سلام را بسازید
    gloss: سلام
    note: سلام «salâm» خوانده می‌شود. مصوت‌های کوتاه معمولاً در نوشتن فارسی نوشته نمی‌شوند.
    example_gloss: سلام! من نیما استم.
  fa.a1.unit01.lesson02.teach.salam:
    title: سلام
    gloss: سلام
    note: سلام هم در موقعیت‌های رسمی و هم در موقعیت‌های غیررسمی مناسب است.
    example_gloss: سلام، حال تان خوب است؟
  fa.a1.unit01.lesson02.teach.sobh_bekheyr:
    title: صبح بخیر
    gloss: صبح بخیر
    note: صبح بخیر سلام و احوالپرسی معمولی و محترمانهٔ صبح است.
  fa.a1.unit01.lesson02.teach.asr_bekheyr:
    title: عصر بخیر یا شام بخیر
    gloss: عصر بخیر / شام بخیر
    note: عصر بخیر از بعدازظهر دیر تا شام گفته می‌شود.
  fa.a1.unit01.lesson02.teach.khodahafez:
    title: خداحافظی
    gloss: خداحافظ
    note: خداحافظ «khodâhâfez» خوانده می‌شود و خداحافظی عمومی معمول است.
    example_gloss: خداحافظ، بعداً می‌بینیم!
  fa.a1.unit01.lesson02.teach.mamnoon:
    title: تشکر
    gloss: تشکر
    note: ممنون رایج و طبیعی است؛ متشکرم کمی رسمی‌تر است.
    example_gloss: بسیار تشکر.
  fa.a1.unit01.lesson02.teach.khahesh_mikonam:
    title: خواهش می کنم
    gloss: خواهش می‌کنم
    note: خواهش می‌کنم جواب معمول تشکر است.
  fa.a1.unit01.lesson02.teach.hale_shoma:
    title: 'احوالپرسی: شکل گفتاری محترمانه'
    gloss: شما چطور استید؟
    note: حالتون چطوره؟ شکل گفتاری محترمانهٔ معمولی در فارسی ایران است. حال شما چطور است؟ شکل رسمی‌تر یا نوشتاری آن است.
  fa.a1.unit01.lesson02.teach.khoobam:
    title: من خوب استم
    gloss: خوب استم
    note: خوبم از کلمهٔ خوب و پسوند شخص اول ـم ساخته شده است.
  fa.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: روز خوش
    gloss: روز خوش
    note: روز بخیر محترمانه است، اما در صحبت‌های دوستانه کمتر از سلام به کار می‌رود.
  fa.a1.unit01.lesson03.teach.shab_bekheyr:
    title: شب بخیر
    gloss: شب بخیر
    note: شب بخیر معمولاً برای خداحافظی یا پیش از خواب گفته می‌شود، نه برای شروع دیدار.
  fa.a1.unit01.lesson03.teach.khosh_amadeed:
    title: خوش آمدید
    gloss: خوش آمدید
    note: خوش آمدید شکل محترمانه برای یک مهمان یا چند مهمان است.
  fa.a1.unit01.lesson03.teach.be_omide_didar:
    title: به امید دیدن تان
    gloss: به امید دیدار / تا دیدار بعدی
    note: به امید دیدار خداحافظی آراسته و محترمانهٔ معمولی است.
  fa.a1.unit01.lesson03.teach.fealan:
    title: فعلاً خداحافظ
    gloss: فعلاً خداحافظ
    note: فعلاً گفتاری است و از خداحافظ غیررسمی‌تر است.
  fa.a1.unit01.lesson03.teach.rooze_khoobi:
    title: روز خوب داشته باشید
    gloss: روز تان خوش باشد
    note: باشید در این خداحافظی ثابت شکل محترمانه را نشان می‌دهد.
  fa.a1.unit01.lesson04.teach.formal_question:
    title: شکل گفتاری محترمانهٔ معمولی
    gloss: شما چطور استید؟
    note: حالتون چطوره؟ را با یک بزرگسال ناآشنا یا در گفتگوی محترمانهٔ عادی به کار ببرید. شکل کاملاً رسمی یا نوشتاری آن حال شما چطور است؟ می‌باشد.
  fa.a1.unit01.lesson04.teach.informal_question:
    title: غیررسمی
    gloss: شما چطور استید؟
    note: چطوری؟ گفتاری است و وقتی رابطه اجازه بدهد، با دوستان، خانواده و هم‌سن‌وسالان مناسب است.
  fa.a1.unit01.lesson04.teach.to:
    title: «تو» به شکل غیررسمی
    gloss: تو
    note: تو مفرد و غیررسمی است؛ آن را با یک بزرگسال ناآشنا به کار نبرید.
  fa.a1.unit01.lesson04.teach.very_well:
    title: بسیار خوب
    gloss: من بسیار خوب استم
    note: خیلی معنی خوبم را قوی‌تر می‌کند.
  fa.a1.unit01.lesson04.teach.not_bad:
    title: بد نیست
    gloss: بد نیستم، تشکر
    note: بد نیستم جواب معتدل و طبیعی است، نه شکایت.
  fa.a1.unit01.lesson04.teach.and_you_formal:
    title: و شما؟ محترمانه
    gloss: و شما؟
    note: شما چطور؟ را برای پرسیدن متقابل به شکل محترمانه به کار ببرید.
  fa.a1.unit01.lesson04.teach.and_you_informal:
    title: و تو؟ غیررسمی
    gloss: و شما؟
    note: تو چطور؟ با رابطهٔ غیررسمی مطابقت دارد.
  fa.a1.unit01.lesson05.teach.chai:
    title: چای
    gloss: چای
    note: '*چای* نوشیدنی است. آن را در تعارف *چای بفرمایید* (چای بگیرید) می‌شنوید.'
    example_gloss: لطفاً، چای میل دارید؟
  fa.a1.unit01.lesson05.teach.befarmaeed:
    title: بفرمایید، لطفاً
    gloss: بفرمایید / لطفاً / بگیرید
    note: '*بفرمایید* به موقعیت فرق می‌کند: می‌تواند به معنی بگیرید (هنگام تعارف چای)، لطفاً داخل شوید (پهلوی در) یا شما اول بروید باشد.'
  fa.a1.unit01.lesson05.teach.lotf_dareed:
    title: لطف شما زیاد است
    gloss: لطف شما زیاد است
    note: لطف دارید برای جواب محترمانه به تعریف گفته می‌شود.
  fa.a1.unit01.lesson05.teach.zahmat_nakeshid:
    title: لطفاً زحمت نکشید
    gloss: لطفاً خود تان را به زحمت نیندازید
    note: زحمت نکشید می‌تواند رد صادقانه یا جواب اول محترمانه به یک پیشنهاد مشخص باشد.
  fa.a1.unit01.lesson05.teach.mamnoon_lotf:
    title: از لطف شما تشکر
    gloss: از لطف شما تشکر
    note: این از ممنون به‌تنهایی گرم‌تر و روشن‌تر است.
  fa.a1.unit01.lesson05.teach.cultural_pattern:
    title: تعارف
    gloss: آداب محترمانه‌گری ایرانی که به موقعیت بستگی دارد
    note: تعارف به آداب وابسته به موقعیت در پیشنهاد کردن، رد کردن، تشکر کردن و ابراز احترام گفته می‌شود. عمل به آن با رابطه، نسل، منطقه و موقعیت فرق می‌کند؛ هیچ تعداد ثابتی از ردکردن‌ها یا تکرارها مشخص نمی‌کند که پیشنهاد صادقانه است یا نه.
  fa.a1.unit01.lesson06.teach.line01:
    title: خوش آمدید
    gloss: علی از نرگس استقبال می‌کند.
    note: گفتگو پیش از معرفی با سلام شروع می‌شود.
  fa.a1.unit01.lesson06.teach.line02:
    title: خوش آمدید، جواب
    gloss: نرگس جواب سلامش را می‌دهد و تشکر می‌کند.
    note: ممنون (تشکر) جواب طبیعی به خوش‌آمدگویی است.
  fa.a1.unit01.lesson06.teach.line03:
    title: معرفی نام
    gloss: علی می‌گوید که کیست.
    note: '*من علی هستم* یعنی من علی استم. *هستم* (استم) در آخر جمله می‌آید.'
  fa.a1.unit01.lesson06.teach.line04:
    title: معرفی نام، جواب
    gloss: نرگس می‌گوید که کیست.
    note: همان الگوی *من ... هستم* که علی همین حالا به کار برد.
  fa.a1.unit01.lesson06.teach.line05:
    title: خوشبخت شدم
    gloss: علی می‌گوید از آشنایی با او خوش شده است.
    note: '*خوشوقتم* یعنی خوش شدم. با *از آشنایی با شما* عبارت محترمانهٔ معمول هنگام آشنایی با کسی است.'
  fa.a1.unit01.lesson06.teach.line06:
    title: از آشنایی، جواب
    gloss: نرگس همین احساس را برمی‌گرداند.
    note: همین‌طور در این جواب یعنی مثل شما، به همین ترتیب.
  fa.a1.unit01.lesson06.teach.line07:
    title: پرسیدن احوال
    gloss: علی محترمانه احوال او را می‌پرسد.
    note: چون این اولین دیدار محترمانه است، علی شکل گفتاری محترمانهٔ ـتون را به کار می‌برد.
  fa.a1.unit01.lesson06.teach.line08:
    title: پرسیدن احوال، جواب
    gloss: نرگس جواب می‌دهد و پرسش را برمی‌گرداند.
    note: شما چطور؟ همان پرسش را دوباره می‌پرسد؛ یک راه کوتاه و معمول.
  fa.a1.unit01.lesson06.teach.line09:
    title: دعوت
    gloss: علی می‌گوید او هم خوب است و نرگس را به داخل دعوت می‌کند.
    note: '*بفرمایید داخل* یعنی لطفاً داخل شوید. *داخل* (درون) نشان می‌دهد چه چیزی تعارف می‌شود.'
  fa.a1.unit01.lesson06.teach.line10:
    title: رد محترمانه
    gloss: نرگس تشکر می‌کند اما می‌گوید که باید برود.
    note: رد محترمانه هم پیش از نه گفتن با تشکر شروع می‌شود. *ولی باید برم* یعنی اما باید بروم.
  fa.a1.unit01.lesson06.teach.line11:
    title: ختم صحبت
    gloss: علی جواب او را می‌پذیرد و امید دیدار دوباره دارد.
    note: دعوتِ ردشده حالا به شکل طبیعی به خداحافظی می‌رسد.
  fa.a1.unit01.lesson06.teach.line12:
    title: ختم صحبت، جواب
    gloss: نرگس خداحافظی می‌کند.
    note: '*خداحافظ* خداحافظی عمومی معمول است.'
exercises:
  fa.a1.unit01.lesson01.exercise01.recognize_salam:
