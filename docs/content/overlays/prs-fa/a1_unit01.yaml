    accepted_answers:
    - value:
      - خواهش
      - می‌کنم
      status: correct
    feedback: خواهش می‌کنم جواب معمول تشکر است.
  fa.a1.unit01.lesson02.exercise06.reply_how_are_you:
    instruction: با عبارتی که آموختید، مؤدبانه جواب بتین.
