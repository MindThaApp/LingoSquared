    - ا
    - م
    accepted_answers:
    - value: ل
      status: correct
    feedback: حرفی که افتاده «ل» است.
  fa.a1.unit01.lesson01.exercise06.match_letters:
    instruction: هر حرف فارسی را با آوای تقریبی لاتین آن جور کنید.
    accepted_answers:
    - value:
        س: s
        ل: l
        ا: ā
        م: m
      status: correct
    feedback: این چهار پیوند، کلمهٔ سلام را می‌سازند.
    pairs:
    - left: س
      right: s
    - left: ل
      right: l
    - left: ا
      right: ā
    - left: م
      right: m
  fa.a1.unit01.lesson01.exercise07.rtl_direction:
    instruction: آیا این کلمهٔ فارسی از طرف راست شروع به خوانده می‌شود؟
    correct_option: بلی
    distractors:
    - نخیر
    accepted_answers:
    - value: بلی
      status: correct
    feedback: فارسی از راست به چپ خوانده می‌شود.
  fa.a1.unit01.lesson01.exercise08.romanize_salam:
    instruction: یک آوانویسی رایج سلام را با حروف لاتین بنویسین.
    answer_language_code: en
