teaching:
  fa.a2.unit21.lesson01.teach.appointment:
    title: وقت، آرایشگاه
    gloss: وقت ملاقات، آرایشگاه (سالون)
    note: '*وقت* هم به معنای «زمان» است و هم «وقت ملاقات»: *وقت دارم* = «وقت ملاقات دارم» (یا «فرصت دارم»). *آرایشگاه* سالون آرایش یا سلمانی است.'
    example_gloss:
    - روز پنجشنبه در آرایشگاه وقت دارم.
    - پیش دکتر وقت دارم.
  fa.a2.unit21.lesson01.teach.change_cancel:
    title: عوض کردن، لغو کردن
    gloss: عوض کردن (وقت)، لغو کردن
    note: 'هر دو فعل با *کردن* ساخته شده‌اند. مفعول *وقتم* با *رو* می‌آید: *وقتم رو عوض می‌کنم*. *کنسل کردن* کلمهٔ رایج برای لغو کردن است.'
    example_gloss:
    - وقتم را عوض می‌کنم.
    - وقتم را لغو می‌کنم.
  fa.a2.unit21.lesson01.teach.sorry:
    title: متأسفانه، ببخشید
    gloss: متأسفانه، ببخشید
    note: '*متأسفانه* برای رد مؤدبانه یا خبر بد می‌آید. *ببخشید* همان «ببخشید / معذرت» روزمره است. *متأسفانه* اکثراً بدون همزه به شکل *متاسفانه* هم نوشته می‌شود؛ هر دو پذیرفته می‌شوند.'
    example_gloss:
    - متأسفانه نمی‌توانم.
    - ببخشید، آمده می‌توانم؟
  fa.a2.unit21.lesson01.teach.cant_come_phrase:
    title: متأسفانه پنجشنبه آمده نمی‌توانم.
    gloss: متأسفانه پنجشنبه آمده نمی‌توانم.
    note: '*نمی‌تونم* (نمی‌توانم) فعل کوتاه *بیام* (از *اومدن*، آمدن) را می‌گیرد. روز پیش از فعل می‌آید: *پنجشنبه نمی‌تونم بیام*.'
  fa.a2.unit21.lesson01.teach.can_change:
    title: وقتم را عوض کرده می‌توانم؟
    gloss: وقتم را عوض کرده می‌توانم؟
    note: '*می‌تونم* (می‌توانم) + فعل کوتاه *کنم*. این راه مؤدبانهٔ خواستن برای تغییر دادن وقت است.'
  fa.a2.unit21.lesson01.teach.can_rule:
    title: توانستن و نتوانستن + فعل کوتاه
    gloss: آمده می‌توانم، آمده نمی‌توانم، عوض کرده می‌توانم
    note: 'بعد از *می‌تونم* (توانستن من) و *نمی‌تونم* (نتوانستن من) شکل کوتاه فعل با *be-* می‌آید: *بیام*، *کنم*. هر دو فعل ختم یکسان (*-م*) دارند: *نمی‌تونم بیام*. برای *شما* (محترمانه) هر دو *-ید* می‌گیرند: *می‌تونید بیاید؟*'
  fa.a2.unit21.lesson02.teach.days:
    title: یک روز دیگر، شنبه، دوشنبه
    gloss: یک روز دیگر، شنبه، دوشنبه
    note: '*دیگه* بعد از اسم یعنی «دیگر» یا «بیشتر»: *یه روز دیگه* یعنی «یک روز دیگر». هفتهٔ ایرانی‌ها از *شنبه* آغاز می‌شود.'
    example_gloss:
    - یک روز دیگر وقت دارم.
    - روز شنبه نمی‌توانم.
    - روز دوشنبه وقت دارم.
  fa.a2.unit21.lesson02.teach.can_it_be:
    title: می‌شود دوشنبه باشد؟
    gloss: می‌شود دوشنبه باشد؟
    note: '*می‌شه* (ممکن است) + روز + *باشه* (باشد). این راه معمول پیشنهاد کردن روز دیگر است: *می‌شه شنبه باشه؟*'
  fa.a2.unit21.lesson02.teach.suits_you:
    title: شنبه برای شما مناسب است؟
    gloss: شنبه برای شما مناسب است؟ (مؤدبانه)
    note: '*براتون مناسبه؟* می‌پرسد که آیا چیزی برای شما مناسب است. *براتون* شکل محترمانهٔ *شما* است؛ با دوست می‌گویید *برات مناسبه؟*'
  fa.a2.unit21.lesson02.teach.yes_fine:
    title: بله، خوب است.
    gloss: بله، خوب است.
    note: '*خوبه* (خوب است) راه کوتاه قبول کردن یک وقت است.'
  fa.a2.unit21.lesson02.teach.no_sorry:
    title: نه، متأسفانه نه.
    gloss: نه، متأسفانه نه.
    note: 'یک راه مؤدبانهٔ رد کردن: *نه* همراه با *متأسفانه* جواب را نرم‌تر می‌سازد.'
  fa.a2.unit21.lesson02.teach.you_rule:
    title: «تو»ی دوستانه و «شما»ی مؤدبانه
    gloss: برایت مناسب است؟ (دوست / مؤدبانه)
    note: 'با دوست پسوند *-ت* می‌آید: *برات*. برای دفتر خدمات یا کسی که نمی‌شناسید *-تون* می‌آید: *براتون*. در این درس آرایشگاه شکل مؤدبانه را به کار می‌برد.'
  fa.a2.unit21.lesson03.teach.because:
    title: چون، مریض استم
    gloss: چون، مریض استم
    note: '*چون* دلیل را به جملهٔ اصلی وصل می‌کند: *نمی‌تونم بیام چون مریضم*. *مریضم* یعنی *مریض* + *-م* (استم).'
    example_gloss:
    - چون مریض استم، آمده نمی‌توانم.
    - چون کار دارم، نمی‌توانم.
  fa.a2.unit21.lesson03.teach.reason_work:
    title: چون باید کار کنم.
    gloss: چون باید کار کنم.
    note: '*باید* (لازم است) + فعل کوتاه *کنم*: *باید کار کنم*.'
  fa.a2.unit21.lesson03.teach.reason_other:
    title: چون یک وقت دیگر دارم.
    gloss: چون یک وقت دیگر دارم.
    note: '*یه وقت دیگه* یعنی «یک وقت دیگر».'
  fa.a2.unit21.lesson03.teach.reason_ill:
    title: چرا نمی‌توانی؟ چون مریضم.
    gloss: چرا نمی‌توانی؟ چون مریضم.
    note: '*چرا؟* یعنی «به چه دلیل؟»؛ یک دلیل کوتاه که با *چون* شروع شود، به تنهایی هم جواب شده می‌تواند. *نمی‌تونی* شکلِ *تو* برای *نمی‌تونم* است.'
  fa.a2.unit21.lesson03.teach.sorry_trouble:
    title: ببخشید بابت زحمت.
    gloss: ببخشید بابت زحمت.
    note: '*بابت زحمت* یعنی «به خاطر زحمت». وقتی برای کسی زحمت اضافی می‌دهید، مثلاً وقتی وقت را تغییر می‌دهید، این را بگویید.'
  fa.a2.unit21.lesson03.teach.reason_rule:
    title: اول جملهٔ اصلی، بعد دلیل
    gloss: نمی‌توانم بیایم چون باید کار کنم.
    note: 'اول انکار را بگویید و دلیل را بعد از *چون* بیاورید. یک جواب کوتاه هم می‌تواند با *چون* شروع شود: *چرا نمی‌تونی؟* *چون مریضم.*'
  fa.a2.unit21.lesson04.teach.time_words:
    title: ساعت ده، یک روز پیش
    gloss: ساعت ده، یک روز پیش
    note: 'ساعت را با *ساعت* + عدد می‌گویند: *ساعت ده*. *قبل* یعنی «پیش»: *یه روز قبل* یعنی «یک روز پیش».'
    example_gloss:
    - دوشنبه ساعت ده خوب است.
    - یک روز پیش زنگ می‌زنم.
  fa.a2.unit21.lesson04.teach.monday_ten:
    title: دوشنبه ساعت ده خوب است.
    gloss: دوشنبه ساعت ده خوب است.
    note: 'اول روز، بعد وقت: *دوشنبه ساعت ده*.'
  fa.a2.unit21.lesson04.teach.can_you_come:
    title: می‌توانید دوشنبه ساعت ده بیایید؟
    gloss: می‌توانید دوشنبه ساعت ده بیایید؟ (محترمانه)
    note: '*می‌تونید* و *بیاید* پایان محترمانهٔ *شما* یعنی *-ید* را دارند.'
  fa.a2.unit21.lesson04.teach.see_you:
    title: پس دوشنبه شما را می‌بینم.
    gloss: پس دوشنبه شما را می‌بینم. (محترمانه)
    note: '*پس* برای جمع‌بندی قرار می‌آید؛ *می‌بینمتون* یعنی «شما را می‌بینم» (محترمانه).'
  fa.a2.unit21.lesson04.teach.new_appointment:
    title: یک وقت تازه می‌گیرم.
    gloss: یک وقت تازه می‌گیرم.
    note: '*وقت گرفتن* (لفظاً «گرفتن وقت») راه معمول گفتن برای رزرو کردن وقت است.'
  fa.a2.unit21.lesson04.teach.time_rule:
    title: اول روز، بعد وقت
    gloss: دوشنبه ساعت ده
    note: 'اول روز را بگویید و بعد ساعت را، بدون حرف اضافه: *دوشنبه ساعت ده*. اگر فعل را هم بیاورید، آخر می‌آید: *دوشنبه ساعت ده بیاید*.'
  fa.a2.unit21.lesson05.teach.spot_time:
    title: روز و وقت را پیدا کنید
    gloss: دوشنبه ساعت ده، یک روز پیش
    note: وقتی پیامی دربارهٔ وقت ملاقات می‌خوانید، دنبال روز، ساعت و کاری که باید بکنید بگردید، اگر آن وقت برایتان مناسب نباشد.
  fa.a2.unit21.lesson05.teach.reading_sms:
    title: پیامی از آرایشگاه
    gloss: سلام آقای نیما! وقت شما به دوشنبه ساعت ده تغییر کرد. اگر این وقت مناسب نیست، لطفاً یک روز پیش زنگ بزنید. یک وقت تازه می‌گیریم.
    note: پیام کوتاهی از آرایشگاه. یک بار برای وقت تازه بخوانید، بار دیگر برای اینکه اگر مناسب نبود چه باید کرد.
  fa.a2.unit21.lesson06.teach.names:
    title: نیما، سلمانی
    gloss: نیما، سلمانی
    note: نیما، دوست درس‌های پیشین، به سلمانی زنگ می‌زند. گوینده‌ای که از آرایشگاه جواب می‌دهد با *آرایشگاه* نشان داده شده است.
    example_gloss:
    - نیما به سلمانی زنگ می‌زند.
  fa.a2.unit21.lesson06.teach.please_great:
    title: بفرمایید، البته، تشکر، خواهش می‌کنم
    gloss: بفرمایید، البته، تشکر، خواهش می‌کنم
    note: '*بفرمایید* را کسی که تیلفون را جواب می‌دهد می‌گوید تا شما صحبت کنید. *البته* یعنی «حتماً»، *ممنون* یعنی «تشکر» و *خواهش می‌کنم* جواب «تشکر» است.'
    example_gloss:
    - آرایشگاه، بفرمایید.
    - بله، البته.
    - تشکر. خواهش می‌کنم.
  fa.a2.unit21.lesson06.teach.dlg1:
    title: آرایشگاه جواب می‌دهد
    gloss: آرایشگاه تیلفون را جواب می‌دهد.
    note: 'یک راه محترمانهٔ جواب دادن: نام جا و *بفرمایید*.'
  fa.a2.unit21.lesson06.teach.dlg2:
    title: نیما توضیح می‌دهد و می‌پرسد
    gloss: نیما می‌گوید روز پنجشنبه وقت دارد ولی متأسفانه آمده نمی‌تواند و می‌پرسد که می‌تواند آن را تغییر بدهد یا نه.
    note: '*ولی* وقت و مشکل را به هم وصل می‌کند.'
  fa.a2.unit21.lesson06.teach.dlg3:
    title: آرایشگاه روز شنبه را پیشنهاد می‌کند
    gloss: آرایشگاه می‌گوید بله، حتماً، و می‌پرسد که شنبه برایش مناسب است یا نه.
    note: '*براتون* شکل محترمانه است.'
  fa.a2.unit21.lesson06.teach.dlg4:
    title: نیما نه می‌گوید و دوشنبه را پیشنهاد می‌کند
    gloss: نیما می‌گوید متأسفانه نه، چون باید کار کند، و می‌پرسد که دوشنبه شده می‌تواند یا نه.
    note: یک انکار، یک دلیل و یک پیشنهاد تازه.
  fa.a2.unit21.lesson06.teach.dlg5:
    title: آرایشگاه قبول می‌کند
    gloss: آرایشگاه می‌گوید دوشنبه ساعت ده خوب است.
    note: اول روز، بعد وقت.
  fa.a2.unit21.lesson06.teach.dlg6:
    title: نیما تشکر می‌کند و معذرت می‌خواهد
    gloss: نیما می‌گوید عالی است، تشکر، و ببخشید بابت زحمت.
    note: '*ببخشید بابت زحمت* معذرت‌خواهی محترمانه در آخر صحبت است.'
  fa.a2.unit21.lesson06.teach.dlg7:
    title: آرایشگاه صحبت را ختم می‌کند
    gloss: آرایشگاه می‌گوید خواهش می‌کنم، و دوشنبه می‌بینیم.
    note: '*خواهش می‌کنم* جواب «تشکر» است.'
  fa.a2.unit21.lesson06.teach.third_person:
    title: او آمده نمی‌تواند، می‌گوید
    gloss: او آمده نمی‌تواند، او می‌گوید، او می‌خواهد
    note: 'برای گفتن از کار یا توانایی کسی دیگر، پایان‌های *او* را به کار ببرید: *نمی‌تونه* (نمی‌تواند)، *می‌گه* (می‌گوید)، *می‌خواد* (می‌خواهد) و فعل کوتاه *بیاد* (بیاید).'
    example_gloss:
    - نیما روز پنجشنبه آمده نمی‌تواند.
    - آرایشگاه می‌گوید دوشنبه ساعت ده خوب است.
exercises:
  fa.a2.unit21.lesson01.exercise01.recognize_cant_come:
    instruction: این جمله چه معنا دارد؟
    correct_option: آمده نمی‌توانم.
    distractors:
    - آمده می‌توانم.
    - نیامدم.
    - دیگر برنمی‌گردم.
    accepted_answers:
    - value: آمده نمی‌توانم.
      status: correct
    feedback: '*نمی‌تونم بیام* -- *نـ* پیش از *می‌تونم* آن را منفی می‌سازد.'
  fa.a2.unit21.lesson01.exercise02.recognize_can_change:
    instruction: این سوال چه می‌پرسد؟
    correct_option: وقتم را عوض کرده می‌توانم؟
    distractors:
    - می‌توانم وقتم را لغو کنم؟
    - می‌توانم سلمانی‌ام را تغییر بدهم؟
    - من وقت دارم؟
    accepted_answers:
    - value: وقتم را عوض کرده می‌توانم؟
      status: correct
    feedback: '*وقتم رو عوض کنم* -- وقتم را تغییر بدهم.'
  fa.a2.unit21.lesson01.exercise03.match_cant_words:
    instruction: هر کلمه یا عبارت را با معنایش جور کنید.
    accepted_answers:
    - value:
        وقت: قرار ملاقات
        آرایشگاه: آرایشگاه
        عوض کردن: عوض کردن
        کنسل کردن: لغو کردن
        متأسفانه: افسوس، متأسفانه
        ببخشید: ببخشید
        نمی‌تونم بیام: آمده نمی‌توانم
        می‌تونم عوض کنم: عوض کرده می‌توانم
      status: correct
    feedback: کلمه‌های وقت و معذرت‌خواهی، بنیاد این درس‌اند.
    pairs:
    - left: وقت
      right: قرار ملاقات
    - left: آرایشگاه
      right: آرایشگاه
    - left: عوض کردن
      right: عوض کردن
    - left: کنسل کردن
      right: لغو کردن
    - left: متأسفانه
      right: افسوس، متأسفانه
    - left: ببخشید
      right: ببخشید
    - left: نمی‌تونم بیام
      right: آمده نمی‌توانم
    - left: می‌تونم عوض کنم
      right: عوض کرده می‌توانم
  fa.a2.unit21.lesson01.exercise04.order_cant_thursday:
    instruction: 'کلمه‌ها را طوری بچینید که بگویین: روز پنجشنبه آمده نمی‌توانم.'
    accepted_answers:
    - value:
      - پنجشنبه
      - نمی‌تونم
      - بیام
      status: correct
    - value:
      - نمی‌تونم
      - پنجشنبه
      - بیام
