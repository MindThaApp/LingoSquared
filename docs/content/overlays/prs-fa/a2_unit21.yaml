course:
  title: فارسی ایرانی A2
  description: 'فارسی ایرانی سطح ابتدایی بالا با ستون گرامری: بانک، نظر دادن، وقت‌ملاقات و بیشتر؛ حالا تغییر دادن وقت: گفتن اینکه آمده نمی‌توانید، پیشنهاد روز دیگر، دلیل آوردن و توافق بر وقت نو.'
