teaching:
  fa.a2.unit11.lesson01.teach.bank_word:
    title: بانک
    gloss: بانک
    note: '*بانک* کلمه‌ی عمومی برای بانک است.'
    example_gloss: بانک نزدیک خانه‌ی نوی من است.
  fa.a2.unit11.lesson01.teach.account_word:
    title: حساب
    gloss: حساب
    note: '*حساب* کلمه‌ی عمومی برای حساب بانکی است.'
    example_gloss: می‌خواهم یک حساب باز کنم.
  fa.a2.unit11.lesson01.teach.bank_card_word:
    title: کارت بانکی
    gloss: کارت بانکی
    note: '*کارت بانکی* کارت معمولی بانک است که وقت باز کردن حساب داده می‌شود.'
    example_gloss: کارت بانکی من رمز دارد.
  fa.a2.unit11.lesson01.teach.pin_word:
    title: رمز
    gloss: رمز کارت / پسورد
    note: '*رمز* کلمه‌ی رمز کارت یا پسورد است.'
    example_gloss: رمز کارتت را فراموش نکن.
  fa.a2.unit11.lesson01.teach.balance_word:
    title: موجودی
    gloss: موجودی
    note: '*موجودی* کلمه‌ی پولی است که در حساب باقی مانده.'
    example_gloss: موجودی حساب من کم است.
  fa.a2.unit11.lesson01.teach.document_word:
    title: سند
    gloss: سند
    note: '*مدرک* کلمه‌ی عمومی برای سند است که از واحد ثبت‌نام قبلی دوباره آمده است.'
    example_gloss: برای باز کردن حساب یک سند لازم است.
  fa.a2.unit11.lesson01.teach.baz_kardan_note:
    title: باز کردن (فعل مرکب)
    gloss: باز کردن
    note: '*باز کردن* در اصل یعنی «باز کردن» با فعل کمکی؛ در فارسی ایرانی فعل‌های زیادی این‌گونه از یک اسم یا صفت و فعل کمکی مثل *کردن* ساخته می‌شوند.'
  fa.a2.unit11.lesson01.teach.ra_note:
    title: نشانه‌ی مفعول
    gloss: (مفعول معین را نشان می‌دهد)
    note: '*رو* (شکل محاوره‌ای *را*) مفعول معین را نشان می‌دهد -- درست بعد از چیزی می‌آید که کار روی آن انجام می‌شود.'
  fa.a2.unit11.lesson01.teach.recap_registration_terms:
    title: کارت هویت و سند آدرس
    gloss: کارت هویت ملی و سند آدرس
    note: '*کارت ملی* و *مدرک آدرس* دو سندی هستند که برای رفتن به بانک در این واحد لازم است -- از واحد ثبت‌نام قبلی آمده‌اند.'
  fa.a2.unit11.lesson02.teach.i_want_to_open_account:
    title: درخواست باز کردن حساب
    gloss: می‌خواستم یک حساب بانکی باز کنم.
    note: '*می‌خواستم ...* همان شکل نرم و مودبانه‌ی درخواست از واحد ثبت‌نام قبلی است.'
  fa.a2.unit11.lesson02.teach.if_bring_documents:
    title: بیان شرط با اگر
    gloss: اگر سندهایتان را بیاورید، می‌توانید همین امروز حساب باز کنید.
    note: '*اگر ...، ...* قدم بالاتر در سطح A2 است -- اول شرط را بگویید، بعد نتیجه را.'
  fa.a2.unit11.lesson02.teach.full_request_with_condition:
    title: ترکیب درخواست و شرط
    gloss: می‌خواستم یک حساب بانکی باز کنم. اگر سندهایتان را بیاورید، همین امروز شده می‌تواند.
    note: الگوی کامل درخواست همراه با شرط که این درس بر آن ساخته شده است.
  fa.a2.unit11.lesson03.teach.necessary_word:
    title: لازم
    gloss: لازم / ضروری
    note: '*لازم* کلمه‌ی عمومی برای ضروری یا درکار است.'
    example_gloss: برای باز کردن حساب کارت هویت لازم است.
  fa.a2.unit11.lesson03.teach.working_hours_word:
    title: ساعات کاری
    gloss: ساعات کاری
    note: '*ساعت کاری* عبارت معمول برای ساعات کار یک اداره یا دکان است.'
    example_gloss: ساعات کاری بانک از ۸ صبح تا ۲ بعد از چاشت است.
  fa.a2.unit11.lesson03.teach.notice_text:
    title: اعلان بانک درباره‌ی باز کردن حساب
    gloss: برای باز کردن حساب، کارت هویت ملی و یک سند آدرس لازم است. ساعات کاری بانک از ۸ صبح تا ۲ بعد از چاشت است.
    note: یک اعلان رسمی کوتاه به سبک نوشتاری معمولی، اما هنوز *لازمه* گفتاری روزمره در آن آمده است.
  fa.a2.unit11.lesson04.teach.how_can_i_help:
    title: چطور کمک کرده می‌توانم؟
    gloss: بفرمایید، چطور کمک کرده می‌توانم؟
    note: '*بفرمایید، چه کمکی می‌تونم بکنم؟* جملهٔ آغازین معمول و مودبانه پای کاونتر خدمات است.'
  fa.a2.unit11.lesson04.teach.turn01:
    title: کارمند به سارا سلام می‌دهد
    gloss: کارمند سلام می‌دهد و می‌پرسد چطور کمک کرده می‌تواند.
    note: عبارت آغازین همین درس دوباره آمده است.
  fa.a2.unit11.lesson04.teach.turn02:
    title: سارا درخواستش را می‌گوید
    gloss: سارا می‌گوید که می‌خواهد یک حساب بانکی باز کند.
    note: الگوی *می‌خواستم ...* درس دوم دوباره آمده است.
  fa.a2.unit11.lesson04.teach.turn03:
    title: کارمند مدارک می‌خواهد
    gloss: کارمند می‌پرسد که تذکره و یک سند آدرس دارد یا نه.
    note: '*کارت ملی* و *مدرک آدرس* در درس ثبت‌نام پیشین معرفی شده بودند.'
  fa.a2.unit11.lesson04.teach.turn04:
    title: سارا تأیید می‌کند که چه آورده است
    gloss: سارا می‌گوید بله، تذکره و بل برق خانهٔ جدیدش را آورده است.
    note: '*قبض برق* (بل برق) واژهٔ *قبض* را از درس ثبت‌نام پیشین دوباره به کار می‌برد.'
  fa.a2.unit11.lesson04.teach.turn05:
    title: کارمند زمان را تأیید می‌کند
    gloss: کارمند می‌گوید عالی است، کارت بانکی‌اش تا سه روز دیگر آماده می‌شود.
    note: '*تا سه روز دیگه* (تا سه روز دیگر) مدت آماده شدن را می‌گوید.'
  fa.a2.unit11.lesson04.teach.turn06:
    title: سارا دربارهٔ رمز می‌پرسد
    gloss: سارا می‌پرسد که رمز کارت را کی می‌گیرد.
    note: '*کی* در اینجا یعنی «چه وقت»؛ همین کلمه «چه کسی» هم معنا می‌دهد و از روی موضوع فرق می‌شود.'
  fa.a2.unit11.lesson04.teach.turn07:
    title: کارمند دربارهٔ رمز جواب می‌دهد
    gloss: کارمند می‌گوید در همان روزی که کارت را تحویل می‌گیرد.
    note: '*همون روزی که ...* یعنی «در همان روزی که ...».'
