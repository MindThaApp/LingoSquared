    gloss: زحمتی نیست / خواهش می‌کنم
    note: قابلی نداره راه فروتنانه و رایج برای پاسخ به تشکر است که قبلاً در یک درس پیشین دیده بودید.
  fa.a1.unit08.lesson06.teach.turn01:
    title: دکاندار به مشتری سلام می‌دهد
    gloss: دکاندار به مشتری سلام می‌دهد و او را دعوت می‌کند.
    note: بفرمایید مشتری را دعوت می‌کند که نگاه کند یا چیزی بپرسد.
  fa.a1.unit08.lesson06.teach.turn02:
    title: مشتری قیمت را می‌پرسد
    gloss: مشتری به دکاندار سلام می‌دهد و قیمت سیب‌ها را می‌پرسد.
    note: این چنده؟ از درس دوم، این‌جا دربارهٔ سیب‌ها (سیب‌ها) به کار رفته است.
  fa.a1.unit08.lesson06.teach.turn03:
    title: دکاندار قیمت را می‌گوید
    gloss: دکاندار می‌گوید کیلویی ۳۰ تومن است.
    note: کیلویی سی تومنه از درس دوم.
  fa.a1.unit08.lesson06.teach.turn04:
    title: مشتری سفارش می‌دهد و تخفیف می‌خواهد
    gloss: مشتری می‌گوید یک کیلو می‌خواهد و تخفیف می‌خواهد.
    note: این جمله الگوی مقدار از درس سوم را با پرسش تخفیف از درس چهارم یکجا می‌آورد.
  fa.a1.unit08.lesson06.teach.turn05:
    title: دکاندار به قیمت کمتر موافقت می‌کند
    gloss: دکاندار موافقت می‌کند و ۲۸ تومن پیشنهاد می‌کند.
    note: باشه (قبول) پیش از گفتن قیمت تخفیف‌شده، موافقت را نشان می‌دهد.
  fa.a1.unit08.lesson06.teach.turn06:
    title: مشتری تشکر می‌کند و پول می‌دهد
    gloss: مشتری از دکاندار تشکر می‌کند و می‌گوید نقد پول می‌دهد.
    note: این جمله واژه‌های پرداخت از درس پنجم را با یک تشکر ساده یکجا می‌آورد.
  fa.a1.unit08.lesson06.teach.turn07:
    title: دکاندار گفت‌وگو را به پایان می‌رساند
    gloss: دکاندار تشکر را رد می‌کند و مشتری را دعوت می‌کند.
    note: قابلی نداره، بفرمایید معامله را مؤدبانه تمام می‌کند.
