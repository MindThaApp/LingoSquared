teaching:
  fa.a2.unit17.lesson01.teach.week_word:
    title: هفته
    gloss: هفته
    note: '*هفته* کلمه‌ی عمومی برای یک هفته است.'
    example_gloss: این هفته خیلی مصروف است.
  fa.a2.unit17.lesson01.teach.weekend_word:
    title: آخر هفته
    gloss: آخر هفته
    note: '*آخر هفته* در لفظ یعنی «پایان هفته» -- در ایران این روزها *پنجشنبه*/*جمعه* است، نه شنبه/یکشنبه.'
    example_gloss: آخر هفته کار نمی‌کنم.
  fa.a2.unit17.lesson01.teach.rest_word:
    title: استراحت
    gloss: استراحت
    note: '*استراحت کردن* (آرام گرفتن) یک ساخت فعل ترکیبی است، مثل *باز کردن* از بخش بانک که قبلاً خواندید.'
    example_gloss: روزهای جمعه استراحت می‌کنم.
  fa.a2.unit17.lesson01.teach.first_word:
    title: اول
    gloss: اول
    note: '*اول* ترتیب کارها را شروع می‌کند.'
    example_gloss: اول ناشتا می‌خورم.
  fa.a2.unit17.lesson01.teach.then_word:
    title: بعد
    gloss: بعد
    note: '*بعد* ترتیب کارها را ادامه می‌دهد؛ *بعدش* (بعد از آن) شکل رایج گفتاری آن است.'
    example_gloss: بعد از آن سر کار می‌روم.
  fa.a2.unit17.lesson01.teach.finally_word:
    title: سرانجام
    gloss: سرانجام / در آخر
    note: '*در آخر* ترتیب کارها را به پایان می‌رساند.'
    example_gloss: در آخر استراحت می‌کنم.
  fa.a2.unit17.lesson01.teach.recap_weekdays:
    title: روزهای هفته
    gloss: شنبه، یکشنبه، دوشنبه، سه‌شنبه، چهارشنبه، پنجشنبه، جمعه
    note: مرور نام روزهای هفته از بخش تاریخ‌ها، که اینجا برای برنامه‌ی هفتگی دوباره استفاده می‌شود.
  fa.a2.unit17.lesson02.teach.until_word:
    title: تا (دامنه‌ی روزها)
    gloss: تا
    note: '*تا* دو روز را به شکل یک دامنه وصل می‌کند، مثلاً *شنبه تا چهارشنبه*.'
  fa.a2.unit17.lesson02.teach.work_days_sentence:
    title: روزهای کارتان را به شکل یک دامنه بگویید
    gloss: از شنبه تا چهارشنبه کار می‌کنم.
    note: این هفته‌ی کاری رایج در ایران است (بسیاری از اداره‌ها و دکان‌ها از شنبه تا چهارشنبه کار می‌کنند)، نه الگوی دوشنبه تا جمعه.
  fa.a2.unit17.lesson02.teach.thursdays_habitual_note:
    title: پسوند -ها برای عادت روی نام روز
    gloss: روزهای پنجشنبه (هر هفته)
    note: '*پنجشنبه‌ها* (پنجشنبه + -ها) یعنی «روزهای پنجشنبه» به شکل عادت تکرار شونده، نه یک پنجشنبه‌ی مشخص.'
  fa.a2.unit17.lesson02.teach.during_vs_weekend_sentence:
    title: مقایسه‌ی هفته با آخر هفته
    gloss: در طول هفته کار می‌کنم، ولی آخر هفته استراحت می‌کنم.
    note: '*در طول هفته* با *آخر هفته* مقایسه شده و با *ولی* (اما) وصل شده است.'
  fa.a2.unit17.lesson03.teach.clean_word:
    title: پاک کردن
    gloss: پاک کردن
    note: '*تمیز کردن* یک ساخت فعل ترکیبی دیگر است: *تمیز* (پاک) + *کردن*.'
    example_gloss: روزهای پنجشنبه خانه را پاک می‌کنم.
  fa.a2.unit17.lesson03.teach.schedule_note_text:
    title: برنامه‌ی هفتگی نوشته‌شده‌ی سارا
    gloss: 'برنامه‌ی هفته‌ی من: از شنبه تا چهارشنبه کار می‌کنم. روزهای پنجشنبه خرید می‌کنم و خانه را پاک می‌کنم. روزهای جمعه، آخر هفته، دوستانم را می‌بینم و استراحت می‌کنم.'
    note: یادداشت کوتاه برنامه‌ی هفتگی که به سبک گفتاری راحت نوشته شده است (*خونه*، *دوستامو*).
  fa.a2.unit17.lesson04.teach.good_week_phrase:
    title: چه هفته‌ی خوبی داری!
    gloss: چه هفته‌ی خوبی داری!
    note: یک جمله‌ی دوستانه بعد از شنیدن برنامه‌ی هفتگی کسی. درباره‌ی هفته‌ای است که آن شخص دارد؛ دعای خداحافظی «هفته‌ات خوب باشد» نیست.
  fa.a2.unit17.lesson04.teach.turn01:
    title: نیما از هفته‌ی سارا می‌پرسد
    gloss: نیما از سارا می‌پرسد هفته‌اش چطور است و برنامه‌اش چیست.
    note: '*چطوره* و *چیه* شکل‌های کوتاه‌شده‌ی گفتاری «چطور است» و «چیست» اند.'
  fa.a2.unit17.lesson04.teach.turn02:
    title: سارا با روزهای کاری‌اش شروع می‌کند
    gloss: سارا می‌گوید اول، از شنبه تا چهارشنبه سر کار می‌رود.
    note: '*سر کار می‌رم* (سر کار می‌روم) همان عبارت «رفتن به کار» است که قبلاً خواندید.'
  fa.a2.unit17.lesson04.teach.turn03:
    title: نیما می‌پرسد بعدش چه
    gloss: 'نیما می‌پرسد: بعدش چه؟'
    note: '*بعدش چی؟* راه کوتاه و طبیعی برای پرسیدن از کار بعدی است.'
  fa.a2.unit17.lesson04.teach.turn04:
    title: سارا روزهای پنجشنبه را توضیح می‌دهد
    gloss: سارا می‌گوید بعد، روزهای پنجشنبه خرید می‌کند و خانه را پاک می‌کند.
    note: جمله‌ی پنجشنبه‌ی درس سوم دوباره آمده است.
  fa.a2.unit17.lesson04.teach.turn05:
    title: سارا روزهای جمعه را توضیح می‌دهد
    gloss: سارا می‌گوید در آخر، روزهای جمعه استراحت می‌کند و دوستانش را می‌بیند.
    note: ترتیب کارها را با *در آخر* (سرانجام) به پایان می‌رساند.
  fa.a2.unit17.lesson04.teach.turn06:
    title: نیما گفتگو را تمام می‌کند
    gloss: 'نیما می‌گوید: چه هفته‌ی خوبی داری!'
    note: عبارت پایانیِ همین درس دوباره می‌آید.
