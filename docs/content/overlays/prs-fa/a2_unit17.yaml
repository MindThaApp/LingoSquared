course:
  title: فارسی ایرانی A2
  description: 'فارسی ایرانی سطح پیش‌متوسط: توضیح دادن یک هفته‌ی عادی، ترتیب دادن کارها با اول/بعد/در آخر، و مقایسه‌ی روزهای هفته با هفته‌ی کاری واقعی ایران، یعنی شنبه تا چهارشنبه، و آخر هفته‌ی پنجشنبه/جمعه.'
