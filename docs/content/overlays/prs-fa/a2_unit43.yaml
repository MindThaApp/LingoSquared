  fa.a2.unit43.lesson01.teach.pointing:
    title: این، آن، یکی، چند
    gloss: این، آن، یکی (از آن‌ها)، چند است
    note: '*این یکی* یعنی «این یکی»، *اون یکی* یعنی «آن یکی».'
    example_gloss:
    - این سیب چند است؟
    - آن مالته ارزان است.
    - این یکی قیمت است.
    - آن یکی ارزان است.
  fa.a2.unit43.lesson01.teach.oneword:
    title: این و اون پیش از اسم می‌آیند
    gloss: این سیب؛ آن مالته؛ این یکی؛ آن یکی
    note: '*این* به چیز نزدیک اشاره می‌کند و *اون* به چیز دور. این‌ها پیش از اسم می‌آیند. برای تکرار نکردن اسم، *یکی* را به کار ببرید: *این یکی*، *اون یکی*.'
  fa.a2.unit43.lesson01.teach.want:
    title: 'انتخاب کردن: آن یکی را می‌خواهم'
    gloss: آن یکی را می‌خواهم؛ این یکی را می‌خواهم
    note: 'وقتی چیز مشخصی را انتخاب می‌کنید، *رو* بعد از آن می‌آید: *اون یکی رو می‌خوام*.'
  fa.a2.unit43.lesson02.teach.flowers:
    title: گل‌ها و کتاب‌ها
    gloss: گل، کتاب، رمان
    note: '*گل* یعنی پُشپ.'
    example_gloss:
    - گل قشنگ است.
    - کتاب اینجاست.
    - رمان آنجاست.
  fa.a2.unit43.lesson02.teach.plural:
    title: این / اون + جمع
    gloss: این سیب‌ها؛ آن گل‌ها؛ این کتاب‌ها؛ آن مالته‌ها
    note: '*‌ها* را (با نیم‌فاصله) به اسم اضافه کنید و *این* یا *اون* را پیش از آن نگه دارید: *این سیب‌ها* یعنی «این سیب‌ها». در محاوره *-ها* اکثراً به *-ا* تبدیل می‌شود (*سیبا*).'
  fa.a2.unit43.lesson02.teach.plural_use:
    title: پرسیدن و انتخاب کردن با جمع
    gloss: این سیب‌ها چند است؟ من آن گل‌ها را می‌خواهم.
    note: چیزی که از میان چند جمع انتخاب می‌کنید هم *رو* می‌گیرد. بعد از *این* یا *اون* + جمع، معمولاً برای پرسیدن قیمت از *چنده؟* کار می‌گیرند.
  fa.a2.unit43.lesson03.teach.bookshop:
    title: در کتاب‌فروشی
    gloss: می‌خواهم، دارید، بدهید
    note: '*دارید؟* شکل محترمانهٔ «دارید؟» و *بدید* شکل محترمانهٔ «بدهید» است.'
    example_gloss:
    - من یک کتاب می‌خواهم.
    - رمان دارید؟
    - آن کتاب را به من بدهید.
  fa.a2.unit43.lesson03.teach.indef:
    title: 'پسوند -ی: یک / کدام'
    gloss: یک کتاب (هر کتابی) می‌خواهم؛ رمان دارید؟
    note: 'وقتی منظورتان «یک / کدام» است و فرقی نمی‌کند کدام یکی باشد، *ی* را به اسم اضافه کنید. معمولاً *رو* نمی‌آید: *کتابی می‌خوام*.'
  fa.a2.unit43.lesson03.teach.indef_def:
    title: نامعین یا معین؟
    gloss: من یک کتاب می‌خواهم. من آن کتاب را می‌خواهم.
    note: 'مقایسه کنید: *کتابی* هر کتابی است (بدون *رو*)؛ *اون کتاب رو* یک کتاب مشخص است (با *رو*).'
  fa.a2.unit43.lesson04.teach.shopwords:
    title: چیزی، نانوایی، گل‌فروشی
    gloss: چیزی، نانوایی، گل‌فروشی
    note: '*چیزی* یعنی «چیزی»؛ این کلمه از پیش *ی* نامعین دارد.'
    example_gloss:
    - من چیزی می‌خواهم.
    - نانوایی آن طرف است.
    - گل‌فروشی این‌جاست.
  fa.a2.unit43.lesson04.teach.yeh:
    title: 'یه ... ی: یک مقدار، یک چیزی'
    gloss: کمی نان؛ یک گل؛ یک شیرینی؛ یک چیزی
    note: 'در محاوره اکثراً *یه* پیش از اسم و *ی* بعد از آن با هم می‌آیند: *یه نونی*، *یه گلی*. معنایش «یک چیزی / یک ... مثلاً» است. بعد از *ی* آخر کلمه، پسوند به شکل *ای* نوشته می‌شود: *یه شیرینی‌ای*.'
  fa.a2.unit43.lesson04.teach.yeh_use:
    title: خواستن چیزی نامشخص
    gloss: کمی نان بدهید. یک گل می‌خواهم.
    note: وقتی چیزی می‌خواهید و فرقی نمی‌کند کدام یکی باشد، از *یه ... ی* کار بگیرید؛ مثلاً در نانوایی یا گل‌فروشی.
  fa.a2.unit43.lesson05.teach.reading:
    title: سفری به بازار
    gloss: امروز به بازار رفتم. اول به نانوایی رفتم. کمی نان خریدم. بعد به گل‌فروشی رفتم. آن گل‌های سرخ را دیدم. این گل‌ها ارزان بود، ولی آن گل‌ها قیمت بود. دو گل خریدم. بعد یک کتاب هم خریدم.
    note: یک بار برای دکان‌ها بخوانید، بعد دوباره برای *این*، *اون* و پسوندهای *-ی*.
  fa.a2.unit43.lesson06.teach.turn01:
    title: دکاندار به سارا خوش‌آمد می‌گوید
    gloss: 'دکاندار: بفرمایید. چه می‌خواهید؟'
    note: '*می‌خواید* شکل محترمانهٔ «می‌خواهید» است.'
  fa.a2.unit43.lesson06.teach.turn02:
    title: سارا گلی می‌خواهد
    gloss: 'سارا: یک گل می‌خواهم. این گل‌ها چند است؟'
    note: '*یه گلی* نامشخص است؛ *این گل‌ها* به این‌ها اشاره می‌کند.'
  fa.a2.unit43.lesson06.teach.turn03:
    title: دکاندار مقایسه می‌کند
    gloss: 'دکاندار: آن گل‌های سرخ ارزان است. این یکی قیمت است.'
    note: '*گل‌های قرمز*: اسم جمع + صفت که با اضافه به هم وصل شده‌اند (صدای *-e* که بعد از مصوت اینجا با *ی* نوشته می‌شود).'
  fa.a2.unit43.lesson06.teach.turn04:
    title: سارا انتخاب می‌کند
    gloss: 'سارا: آن یکی را می‌خواهم. دو تا بدهید.'
    note: '*دو تا* یعنی «دو دانه (از آن‌ها)».'
  fa.a2.unit43.lesson06.teach.turn05:
    title: دکاندار آن‌ها را می‌دهد
    gloss: 'دکاندار: بفرمایید.'
    note: وقتی چیزی را به کسی می‌دهید، *بفرمایید* می‌گویید.
