teaching:
  fa.a2.unit09.lesson01.teach.vaght_word:
    title: وقت ملاقات
    gloss: وقت ملاقات / نوبت
    note: '*وقت* در اصل به معنای «زمان» است؛ *وقت گرفتن* در فارسی ایرانی راه معمول گفتن «وقت ملاقات گرفتن» است.'
  fa.a2.unit09.lesson01.teach.madrak_word:
    title: سند
    gloss: سند
    note: '*مدرک* واژه عمومی برای سند رسمی یا کاغذ هویتی است.'
  fa.a2.unit09.lesson01.teach.address_word:
    title: آدرس
    gloss: آدرس
    note: '*آدرس* واژه روزمره برای آدرس خانه یا آدرس پستی است.'
  fa.a2.unit09.lesson01.teach.ghabz_word:
    title: بل برق و آب
    gloss: بل برق و آب
    note: '*قبض* به بل (آب، برق، گاز) گفته می‌شود — معمولاً به‌حیث سند اثبات سکونت قبول می‌شود.'
  fa.a2.unit09.lesson01.teach.national_id_word:
    title: تذکره
    gloss: تذکره
    note: '*کارت ملی* کارت هویت ملی ایران است؛ سندی که در این درس تازه می‌شود.'
  fa.a2.unit09.lesson01.teach.va_word:
    title: و
    gloss: و
    note: '*و* حرف ربط معمول است که در سراسر این درس به کار می‌رود.'
  fa.a2.unit09.lesson02.teach.request_appointment:
    title: خواستن وقت ملاقات
    gloss: می‌خواستم برای تغییر آدرسم وقت بگیرم.
    note: '*می‌خواستم* (در اصل «می‌خواستم») درخواست را نرم‌تر می‌کند؛ در دری هم گاهی برای مؤدب بودن از زمان گذشته کار گرفته می‌شود، و در فارسی ایرانی این شکل برای درخواست مؤدبانه خیلی رایج است.'
  fa.a2.unit09.lesson02.teach.because_moved:
    title: دلیل آوردن با چون
    gloss: چون خانه‌ام را عوض کردم، باید آدرسم را تغییر بدهم.
    note: '*چون* دلیل را معرفی می‌کند — یک جمله پیرو در سطح A2، یک قدم بالاتر از جمله‌های ساده A1.'
  fa.a2.unit09.lesson02.teach.what_should_i_bring:
    title: مؤدبانه پرسیدن که چه بیاورید
    gloss: لطفاً بگویید چه چیزی را باید بیاورم؟
    note: '*می‌شه...؟* («آیا ممکن است...؟») شکل مؤدبانه سوال غیرمستقیم است.'
  fa.a2.unit09.lesson03.teach.lease_word:
    title: کرایه‌نامه
    gloss: قرارداد کرایه
    note: '*اجاره‌نامه* قرارداد کرایه است و یکی از اسناد ممکن برای اثبات سکونت.'
  fa.a2.unit09.lesson03.teach.deadline_word:
    title: مهلت
    gloss: آخرین مهلت
    note: '*مهلت* واژه عمومی برای آخرین زمان یا محدودیت زمانی است.'
  fa.a2.unit09.lesson03.teach.notice_text:
    title: اعلان اداره درباره تغییر آدرس
    gloss: برای تغییر آدرس، لطفاً تذکره قدیم و یک بل آب یا برق بیاورید. مهلت ثبت نام تا آخر همین ماه است.
    note: یک اعلان کوتاه رسمی به سبک نوشتاری عادی. با این هم، شکل محاوره‌ای *بیارید* (به‌جای *بیاورید*) در آن آمده که اعلان‌ها اغلب چنین نوشته می‌شوند.
  fa.a2.unit09.lesson03.teach.i_will_bring_bill:
    title: گفتن اینکه چه چیزی می‌آورید
    gloss: بل آب را می‌آرم.
    note: '*میارم* شکل محاوره‌ای روزمره *می‌آورم* است.'
  fa.a2.unit09.lesson04.teach.turn01:
    title: کارمند به سارا خوش‌آمد می‌گوید
    gloss: کارمند او را دعوت می‌کند و می‌پرسد چه کمکی کرده می‌تواند.
    note: '*بفرمایید* او را به پیش دعوت می‌کند؛ *چه کمکی از دستم برمیاد؟* راه مؤدبانه و عادی است که یک کارمند کمک پیشنهاد می‌کند.'
  fa.a2.unit09.lesson04.teach.turn02:
    title: سارا وقت می‌خواهد
    gloss: سارا می‌گوید می‌خواهد برای تغییر آدرسش وقت بگیرد.
    note: الگوی درخواست *می‌خواستم* از درس دوم دوباره به کار رفته است.
  fa.a2.unit09.lesson04.teach.turn03:
    title: کارمند می‌پرسد از کی
    gloss: کارمند می‌پرسد او از کی در آدرس جدید زندگی می‌کند.
    note: '*از کی...؟* یعنی «از چه وقت». '
  fa.a2.unit09.lesson04.teach.turn04:
    title: سارا جواب می‌دهد و می‌پرسد چه بیاورد
    gloss: او می‌گوید از ماه گذشته، و می‌پرسد چه چیزی را باید بیاورد.
    note: حقیقت *از ماه پیش* با پرسش *می‌شه بگید...؟* از درس دوم یکجا شده است.
  fa.a2.unit09.lesson04.teach.turn05:
    title: کارمند اسناد را می‌شمارد
    gloss: کارمند می‌گوید تذکره قدیم و یک بل آب یا برق کافی است.
    note: '*کافیه* (شکل محاوره‌ای *کافی است*) یعنی «بس است».'
  fa.a2.unit09.lesson04.teach.turn06:
    title: سارا یک روز پیشنهاد می‌کند
    gloss: او می‌پرسد که روز سه‌شنبه آمده می‌تواند یا نه.
    note: '*می‌تونم...؟* درباره توانایی یا اجازه می‌پرسد؛ شکل محاوره‌ای *می‌توانم*.'
  fa.a2.unit09.lesson04.teach.turn07:
    title: کارمند تأیید می‌کند و کود پیگیری می‌دهد
    gloss: کارمند سه‌شنبه ساعت ده را تأیید می‌کند و کود پیگیری ۲۲۱۴ را می‌دهد.
    note: '*کد پیگیری* کود مراجعه برای پیگیری وقت ملاقات است.'
