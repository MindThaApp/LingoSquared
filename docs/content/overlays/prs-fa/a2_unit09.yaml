course:
  title: فارسی ایرانی A2
  description: 'فارسی ایرانی سطح پایین‌متوسط: گرفتن وقت رسمی برای تغییر آدرس در یک اداره خدمات دولتی — واژه‌ها، گرفتن وقت، خواندن اعلان رسمی و خود ملاقات.'
