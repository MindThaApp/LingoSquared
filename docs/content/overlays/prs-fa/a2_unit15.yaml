  fa.a2.unit15.lesson01.teach.platform_word:
    title: پلاتفورم
    gloss: پلاتفورم
    note: '*سکو* کلمه‌ای برای پلاتفورم قطار است؛ *سکوی* شکل اضافی آن پیش از عدد است، مثلاً *سکوی سه* (پلاتفورم سه).'
    example_gloss: قطار از پلاتفورم سه حرکت می‌کند.
  fa.a2.unit15.lesson01.teach.cancel_word:
    title: لغو شد
    gloss: لغو شد
    note: '*لغو* کلمه‌ای برای لغو شده است؛ *لغو شدن* ساختار فعل مرکب ساخته‌شده از آن است.'
    example_gloss: تکت قطار لغو شد.
  fa.a2.unit15.lesson01.teach.announcement_word:
    title: اعلامیه
    gloss: اعلامیه
    note: '*اعلامیه* کلمه‌ای برای اطلاعیه یا اعلان کتبی است.'
    example_gloss: این اعلامیه بسیار مهم است.
  fa.a2.unit15.lesson01.teach.alternative_route_word:
    title: مسیر جایگزین
    gloss: مسیر جایگزین
    note: '*مسیر جایگزین* از *مسیر* (راه) و *جایگزین* (بدیل) ساخته شده است.'
    example_gloss: مسیر جایگزین از پلاتفورم پنج حرکت می‌کند.
  fa.a2.unit15.lesson01.teach.recap_numbers_time:
    title: وقت‌ها و عددهای این واحد
    gloss: ساعت نُه، ساعت ده، سه، پنج
    note: مرور عددها و وقت‌هایی که صحنهٔ این واحد به آن ضرورت دارد.
  fa.a2.unit15.lesson02.teach.when_does_it_leave:
    title: ببخشید، قطار کی حرکت می‌کند؟
    gloss: ببخشید، قطار کی حرکت می‌کند؟
    note: '*ببخشید* پرسش را با ادب نزد یک ناآشنا یا کارمند آغاز می‌کند.'
  fa.a2.unit15.lesson02.teach.is_there_an_alternative:
