    example_gloss: قطار به خاطر مشکل فنی تأخیر دارد.
  fa.a2.unit15.lesson03.teach.notice_text:
    title: یک اعلان ایستگاه دربارهٔ تأخیر
    gloss: 'توجه: قطار ساعت نُه به اصفهان به خاطر مشکل فنی یک ساعت تأخیر دارد و ساعت ده از پلاتفورم سه حرکت می‌کند. بس جایگزین ساعت نُه و نیم از پلاتفورم پنج حرکت می‌کند.'
    note: یک اعلان رسمی کوتاه ایستگاه به سبک نوشتاری معیاری، اما هنوز از آخر فعل‌های گفتاری روزمره (*داره*، *می‌کنه*) کار می‌گیرد.
  fa.a2.unit15.lesson04.teach.i_will_wait:
    title: من منتظر قطار می‌مانم
    gloss: من منتظر قطار می‌مانم.
    note: '*منتظر ... می‌مونم* (منتظر ... می‌مانم) روش معمول گفتن این است که منتظر چیزی می‌مانید.'
  fa.a2.unit15.lesson04.teach.turn01:
    title: نیما می‌پرسد قطار کی حرکت می‌کند
    gloss: نیما با ادب می‌پرسد که قطار ساعت نُه به اصفهان کی حرکت می‌کند.
    note: عبارت آغازین همین درس دوباره به کار رفته است.
  fa.a2.unit15.lesson04.teach.turn02:
    title: کارمند دلیل تأخیر را توضیح می‌دهد
    gloss: کارمند می‌گوید متأسفانه به‌خاطر یک مشکل تخنیکی، قطار یک ساعت تأخیر دارد و حالا ساعت ده از سکوی سه حرکت می‌کند.
    note: '*متاسفانه* (افسوس، متأسفانه) وقتی خبر بد می‌دهید، لحن را نرم‌تر می‌سازد.'
  fa.a2.unit15.lesson04.teach.turn03:
    title: نیما از یک راه دیگر می‌پرسد
    gloss: نیما می‌پرسد که راه دیگری هست که زودتر برسد یا نه.
    note: سوال کامل راه جایگزین از درس دوم دوباره استفاده شده است.
  fa.a2.unit15.lesson04.teach.turn04:
    title: کارمند بس جایگزین را پیشنهاد می‌کند
    gloss: کارمند می‌گوید بلی، یک بس ساعت نُه و نیم از سکوی پنج حرکت می‌کند، ولی نیما باید تکت نو بخرد.
    note: '*باید ... بخرید* (باید بخرید) هزینهٔ واقعی راه جایگزین را بیان می‌کند.'
  fa.a2.unit15.lesson04.teach.turn05:
    title: نیما قبول نمی‌کند و انتظار می‌کشد
    gloss: نیما می‌گوید نه، مشکلی نیست؛ او منتظر قطار می‌ماند.
    note: '*مشکلی نیست* (مشکلی نیست، خیر است) پیشنهاد را مؤدبانه رد می‌کند.'
  fa.a2.unit15.lesson04.teach.turn06:
    title: کارمند برنامه را تأیید می‌کند
    gloss: کارمند می‌گوید خوب است، پس ساعت ده در سکوی سه منتظر باشید.
    note: '*پس* از آنچه نیما همین حالا تصمیم گرفت، نتیجه می‌گیرد.'
