  fa.a2.unit15.lesson02.teach.full_alternative_question:
    title: پرسیدن مؤدبانه دربارهٔ مسیر جایگزین زودتر
    gloss: ببخشید، مسیر جایگزینی هست که زودتر برسم؟
    note: '*که زودتر برسم* (تا زودتر برسم) مقصد را به پرسش ساده دربارهٔ وجود اضافه می‌کند.'
  fa.a2.unit15.lesson03.teach.because_of_note:
    title: به خاطر (+ اسم)
    gloss: به خاطر ...
    note: '*به خاطر* مستقیماً بعد از خود یک اسم می‌گیرد (*به خاطر مشکل فنی*) -- برخلاف *چون* که یک جملهٔ کامل می‌گیرد.'
  fa.a2.unit15.lesson03.teach.technical_problem_word:
    title: مشکل فنی
    gloss: مشکل فنی
