teaching:
  fa.a1.unit04.lesson01.teach.madar:
    title: مادر
    gloss: مادر
    note: مادر کلمهٔ بی‌طرف نوشتاری و رسمی برای مادر است.
    example_gloss: مادرم مهربان است.
  fa.a1.unit04.lesson01.teach.maman:
    title: مامان
    gloss: مامان
    note: مامان کلمهٔ رایج گفتاری است که بیشتر خانواده‌ها از آن استفاده می‌کنند.
    example_gloss: مامان، من گشنه استم.
  fa.a1.unit04.lesson01.teach.pedar:
    title: پدر
    gloss: پدر
    note: پدر کلمهٔ معیار و رسمی نوشتاری برای «پدر» است.
    example_gloss: پدر من داکتر است.
  fa.a1.unit04.lesson01.teach.baba:
    title: بابا
    gloss: بابا
    note: بابا کلمهٔ رایج گفتاری است که بیشتر خانواده‌ها از آن استفاده می‌کنند.
    example_gloss: بابا، شما کجا استید؟
  fa.a1.unit04.lesson01.teach.baradar:
    title: برادر
    gloss: برادر
    note: برادر؛ شکل گفتاری و محبت‌آمیز آن، یعنی داداش، بعداً در همین بخش می‌آید.
    example_gloss: من یک برادر دارم.
  fa.a1.unit04.lesson01.teach.khahar:
    title: خواهر
    gloss: خواهر
    note: خواهر، کلمهٔ معیار برای «خواهر» است.
    example_gloss: خواهر من محصل است.
  fa.a1.unit04.lesson01.teach.register_note:
    title: کلمه‌های رسمی و کلمه‌های روزمره
    gloss: مامان و بابا مثل مادر و پدر استند، اما خودمانی‌تر اند.
    note: در فارسی (ایران) برای والدین دو سطح واقعی وجود دارد، نه یک تفاوت قطعی رسمی و غیررسمی؛ مامان/بابا همان چیزی است که بیشتر مردم والدین خود را با آن صدا می‌زنند، حتی در جمع رسمی.
  fa.a1.unit04.lesson02.teach.daram:
    title: من دارم
    gloss: من دارم
    note: '*دارم* شکل اول شخص مفرد *داشتن* است؛ فعل اصلی برای معرفی خانواده.'
  fa.a1.unit04.lesson02.teach.yek:
    title: یک
    gloss: یک
    note: یک پیش از اسم شمارش‌شده می‌آید، مثلاً یک برادر.
    example_gloss: من یک خواهر دارم.
  fa.a1.unit04.lesson02.teach.one_brother:
    title: من یک برادر دارم.
    gloss: من یک برادر دارم.
    note: 'ترتیب جمله: نهاد، شمار+اسم، فعل؛ ترتیب معمول فارسی (ایران) یعنی فاعل-مفعول-فعل.'
  fa.a1.unit04.lesson02.teach.no_sister:
    title: من خواهر ندارم.
    gloss: من خواهر ندارم.
    note: ندارم شکل منفی دارم است؛ به کلمهٔ جداگانه‌ای برای «یک» ضرورت نیست.
  fa.a1.unit04.lesson02.teach.family_big:
    title: خانوادهٔ من کلان است.
    gloss: خانوادهٔ من کلان است.
    note: بزرگه شکل گفتاری و کوتاه‌شدهٔ «بزرگ است» می‌باشد.
  fa.a1.unit04.lesson02.teach.family_small:
    title: خانوادهٔ ما کوچک است.
    gloss: خانوادهٔ ما کوچک است.
    note: کوچیکه شکل گفتاری و کوتاه‌شدهٔ «کوچک است» می‌باشد، با تلفظ محاوره‌ای کوچیک به‌جای کوچک نوشتاری.
  fa.a1.unit04.lesson03.teach.pedarbozorg:
    title: پدرکلان
    gloss: پدرکلان
    note: پدربزرگ، در اصل «پدر بزرگ»؛ برای هر دو طرف خانواده به کار می‌رود.
    example_gloss: پدرکلان من پیر است.
  fa.a1.unit04.lesson03.teach.madarbozorg:
    title: مادرکلان
    gloss: مادرکلان
    note: مادربزرگ، در اصل «مادر بزرگ»؛ برای هر دو طرف خانواده به کار می‌رود.
    example_gloss: مادرکلان من مهربان است.
  fa.a1.unit04.lesson03.teach.amoo:
    title: کاکا (برادر پدر)
    gloss: کاکا (برادر پدر)
    note: عمو دقیقاً یعنی برادر پدر، نه کلمهٔ عمومی برای هر «کاکا» یا «ماما».
    example_gloss: کاکای من در تهران زندگی می‌کند.
  fa.a1.unit04.lesson03.teach.amme:
    title: عمه (خواهر پدر)
    gloss: عمه (خواهر پدر)
    note: عمه دقیقاً یعنی خواهر پدر.
    example_gloss: عمهٔ من معلم است.
  fa.a1.unit04.lesson03.teach.dayi:
    title: ماما (برادر مادر)
    gloss: ماما (برادر مادر)
    note: دایی دقیقاً یعنی برادر مادر؛ در فارسی (ایران) مانند دری، هر کاکا و خاله و عمه از یک طرف خانواده مشخص می‌شود.
    example_gloss: مامای من انجنیر است.
  fa.a1.unit04.lesson03.teach.khale:
    title: خاله (خواهر مادر)
    gloss: خاله (خواهر مادر)
    note: خاله دقیقاً یعنی خواهر مادر.
    example_gloss: خالهٔ من در اصفهان زندگی می‌کند.
  fa.a1.unit04.lesson03.teach.register_note:
    title: طرف پدر و طرف مادر
    gloss: کاکا و عمه از طرف پدر اند؛ ماما و خاله از طرف مادر اند.
    note: این تقسیم چهارگانه (عمو/عمه در برابر دایی/خاله) در فارسی (ایران) با چهار کلمهٔ جدا بیان می‌شود و باید هر کدام را جداگانه یاد بگیرید.
  fa.a1.unit04.lesson04.teach.chand_ta:
    title: چند
    gloss: چند
    note: چند تا در گفتار روزمره پیش از شمردن آدم‌ها یا چیزها به کار می‌رود.
    example_gloss: شما چند خواهر دارید؟
  fa.a1.unit04.lesson04.teach.polite_question:
    title: شما چند خواهر و برادر دارید؟ (محترمانه)
    gloss: چند خواهر و برادر داری؟
    note: دارید شکل محترمانه و جمع فعل «داشتن» است که با شما می‌آید.
  fa.a1.unit04.lesson04.teach.spoken_question:
    title: تو چند خواهر و برادر داری؟ (خودمانی)
    gloss: چند خواهر و برادر داری؟
    note: داری شکل خودمانی مفرد است و با هم‌سن یا کوچک‌تر به کار می‌رود.
  fa.a1.unit04.lesson04.teach.family_size_question:
    title: خانوادهٔ شما چند نفر است؟
    gloss: خانوادهٔ شما چند نفر است؟
    note: نفر کلمهٔ شمارش برای آدم‌هاست؛ نفرن شکل گفتاری و کوتاه‌شدهٔ «نفر هستند» است.
  fa.a1.unit04.lesson04.teach.answer_example:
    title: 'ما چهار نفر استیم: من، مامانم، بابایم و برادرم.'
    gloss: 'ما چهار نفر استیم: من، مامانم، بابایم و برادرم.'
    note: نفریم = «نفر هستیم» (ما ... نفر هستیم) کوتاه‌شده، در گفتار.
  fa.a1.unit04.lesson05.teach.showhar:
    title: شوهر
    gloss: شوهر
    note: شوهر، کلمهٔ معیار برای «شوهر» است.
    example_gloss: شوهر من انجنیر است.
  fa.a1.unit04.lesson05.teach.zan:
    title: زن
    gloss: زن
    note: زن به معنی «بانو» هم می‌آید؛ از سیاق جمله معنی روشن می‌شود.
    example_gloss: زن من معلم است.
  fa.a1.unit04.lesson05.teach.motahel:
    title: متأهل
    gloss: متأهل
    note: متأهل، صفت بی‌طرف و پرکاربرد برای وضعیت تأهل است.
    example_gloss: او متأهل است.
  fa.a1.unit04.lesson05.teach.mojarad:
    title: مجرد
    gloss: مجرد (بی‌زن یا بی‌شوهر)
    note: مجرد، کلمهٔ معیار برای کسی است که ازدواج نکرده.
    example_gloss: من مجرد استم.
  fa.a1.unit04.lesson05.teach.i_am_single:
    title: من مجردم.
    gloss: من مجردم.
    note: مجردم = مجرد + م («استم»)، همان الگوی پسوند اول شخص مثل خوبم.
  fa.a1.unit04.lesson05.teach.i_am_married:
    title: من متأهلم.
    gloss: من متأهلم.
    note: متأهلم = متأهل + م («استم»)، همان الگوی مجردم.
  fa.a1.unit04.lesson05.teach.nave:
    title: نواسه
    gloss: نواسه
    note: نوه هم برای نواسهٔ پسر و هم دختر به کار می‌رود؛ جنسیت را مشخص نمی‌کند.
    example_gloss: او یک نواسه دارد.
  fa.a1.unit04.lesson05.teach.example:
    title: برادرم متأهل است؛ یک پسر دارد.
    gloss: برادرم متأهل است؛ یک پسر دارد.
    note: متأهله = «متأهل است» کوتاه‌شده در گفتار؛ داره = «دارد» در گفتار.
  fa.a1.unit04.lesson06.teach.in_photo:
    title: این عکس خانوادهٔ توست؟
    gloss: این عکس خانوادهٔ توست؟
    note: خانواده‌ته = «خانوادهٔ تو است» کوتاه‌شده، الگوی بسیار رایج گفتاری.
  fa.a1.unit04.lesson06.teach.yes_mom_dad:
    title: بلی. این مامانم است، این هم بابایم.
    gloss: بلی. این مامانم است، این هم بابایم.
    note: '*آره* «بلی» در گفتار است (در برابر *بله* رسمی). *مامانمه* از *مامانم* و پسوند گفتاری «است» ساخته شده.'
  fa.a1.unit04.lesson06.teach.who_is_he:
    title: این آقا کیست؟
    gloss: این آقا کیست؟
    note: کیه = «کی است» کوتاه‌شده در گفتار.
  fa.a1.unit04.lesson06.teach.brother_answer:
    title: برادرم است. من یک برادر دارم، خواهر ندارم.
    gloss: برادرم است. من یک برادر دارم، خواهر ندارم.
    note: داداش کلمهٔ محبت‌آمیز و روزمره برای برادر است که اینجا به‌جای برادر بی‌طرف درس اول آمده.
  fa.a1.unit04.lesson06.teach.opposite_family:
    title: خانوادهٔ من برعکس است؛ من دو خواهر دارم، برادر ندارم.
    gloss: خانوادهٔ من برعکس است؛ من دو خواهر دارم، برادر ندارم.
    note: برعکسه = «برعکس است» کوتاه‌شده.
  fa.a1.unit04.lesson06.teach.closing:
    title: پس خانوادهٔ تو هم پررونق است!
    gloss: پس خانوادهٔ تو هم پررونق است!
    note: شلوغه = «شلوغ است» کوتاه‌شده؛ شیوهٔ گرم و رایج برای توصیف خانواده‌ای که چند فرزند دارد.
  fa.a1.unit04.lesson06.teach.formal_register_note:
    title: 'شکل رسمی: دارد / ندارد / است'
    gloss: 'در گفتار: داره، نداره. در نوشتار رسمی: دارد، ندارد؛ او برادرم است.'
    note: دارد/ندارد/است شکل‌های رسمی نوشتاری داره/نداره‌اند که در این گفتگو آمده؛ در نوشتار رسمی داداش محبت‌آمیز هم با برادر بی‌طرف عوض می‌شود.
