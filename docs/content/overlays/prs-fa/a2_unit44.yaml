teaching:
  fa.a2.unit44.lesson01.teach.orders:
    title: سفارش‌ها و رزروها
    gloss: سفارش، اتاق، رزرو، آماده
    note: '*سفارش دادن* یعنی «فرمایش دادن»؛ *رزرو کردن* یعنی «از پیش گرفتن جا».'
    example_gloss:
    - سفارش رسیده.
    - اتاق اینجاست.
    - رزرو اینجاست.
    - اتاق آماده است.
  fa.a2.unit44.lesson01.teach.neg:
    title: هنوز نه
    gloss: هنوز نه، نرسیده، ندادم، نکردم
    note: '*هنوز* با فعل منفی یعنی «تا حال نه».'
    example_gloss:
    - سفارشم هنوز نرسیده.
    - هنوز سفارش نداده‌ام.
    - هنوز رزرو نکرده‌ام.
    - اتاق هنوز آماده نیست.
  fa.a2.unit44.lesson01.teach.rule:
    title: هنوز + منفی = تا حال نه
    gloss: سفارشم هنوز نرسیده؛ هنوز سفارش نداده‌ام؛ اتاق هنوز آماده نیست
    note: '*هنوز* را پیش از فعل منفی بیاورید تا بگویید کاری تا حال نشده است. هم ماضی نقلی (*نیومده*) و هم ماضی ساده (*ندادم*) درست است. با فعل مثبت، *هنوز* یعنی «همین حالا هم»: *اتاق هنوز اینجاست* (اتاق هنوز هم اینجاست).'
  fa.a2.unit44.lesson02.teach.appointments:
    title: وقت ملاقات
    gloss: وقت ملاقات، داکتر، خالی، کار
    note: '*وقت* یعنی وقت ملاقات یا زمان خالی.'
    example_gloss:
    - وقت ملاقات داکتر اینجاست.
    - داکتر اینجاست.
    - این وقت خالی است.
  fa.a2.unit44.lesson02.teach.dige:
    title: دیگر نه
    gloss: دیگر، نمی‌خواهم، او (کار) نمی‌کند
    note: '*دیگه* با فعل منفی یعنی «دیگر نه».'
    example_gloss:
    - من دیگر آن را نمی‌خواهم.
    - داکتر دیگر اینجا کار نمی‌کند.
    - این وقت دیگر خالی نیست.
  fa.a2.unit44.lesson02.teach.rule:
    title: دیگه + منفی = دیگر نه
    gloss: من دیگر قهوه نمی‌خواهم؛ داکتر دیگر اینجا کار نمی‌کند؛ این وقت دیگر خالی نیست
    note: '*دیگه* را پیش از فعل منفی بیاورید تا بگویید چیزی پیش‌تر درست بود، اما حالا درست نیست. *دیگه* در جمله‌های دیگر به معنی «یک دیگر / غیر از این» هم می‌آید، اما با فعل منفی یعنی «دیگر نه».'
  fa.a2.unit44.lesson03.teach.hich_words:
    title: هیچ چیز، هیچ کس، هیچ ...
    gloss: هیچ چیز، هیچ کس، هیچ
    note: '*هیچ* با فعل منفی یعنی «هیچ / هیچ‌کدام / هیچ چیز».'
    example_gloss:
    - من هیچ چیز نمی‌خواهم.
    - هیچ کس اینجا نیست.
    - هیچ میزی خالی نیست.
    - میز اینجاست.
  fa.a2.unit44.lesson03.teach.rule:
    title: هیچ + فعل منفی
    gloss: من هیچ چیز نمی‌خواهم؛ هیچ کس نیامد؛ هیچ میزی خالی نیست؛ هیچ اتاقی آماده نیست
    note: 'در فارسی ایران، *هیچ* همراه با فعل منفی می‌آید: *هیچی نمی‌خوام*. با اسم، *ی* اضافه می‌شود: *هیچ میزی*، *هیچ اتاقی*. در دری فقط یک نفی می‌آید، اما در فارسی ایران دو نفی می‌آید (*هیچ* و فعل).'
  fa.a2.unit44.lesson04.teach.answers:
    title: جواب‌های کوتاه
    gloss: آرڈر داده‌اید؟ نه، هنوز نه. قهوه می‌خواهید؟ نه، دیگر نه. چیزی می‌خواهید؟ نه، هیچ چیز.
    note: 'برای اصلاح سریع، با *نه* شروع کنید و بعد یک کلمهٔ کوتاه بگویید: *هنوز نه*، *دیگه نه*، *هیچی*. بعد می‌توانید جملهٔ کامل را هم اضافه کنید.'
  fa.a2.unit44.lesson04.teach.phrases:
    title: تأیید و اصلاح
    gloss: درست است، فقط، آب
    note: '*درسته؟* یعنی «درست است؟»'
    example_gloss:
    - دو قهوه، درست است؟
    - من فقط آب می‌خواهم.
  fa.a2.unit44.lesson05.teach.reading:
    title: مشکل در بوکینگ
    gloss: 'نیما برای دو شب یک اتاق بوکینگ کرد. امروز به هوتل رفت، اما اتاق هنوز آماده نبود. کارمند گفت: «هیچ اتاقی خالی نیست.» نیما گفت: «پس من دیگر این هوتل را نمی‌خواهم.»'
    note: یک بار بخوانید تا بفهمید چه شد، بعد دوباره برای *هنوز*، *هیچ* و *دیگه* بخوانید.
  fa.a2.unit44.lesson06.teach.turn01:
    title: پیشخدمت سفارش را می‌آورد
    gloss: 'پیشخدمت: ببخشید، سفارش شما آماده است. دو قهوه، درست است؟'
    note: '*درسته؟* برای تأیید پرسیده می‌شود.'
  fa.a2.unit44.lesson06.teach.turn02:
    title: 'نیما اصلاح می‌کند: هنوز نه'
    gloss: 'نیما: نه، من هنوز سفارش نداده‌ام.'
    note: '*هنوز ... ندادم* یعنی «تا حالا نه».'
  fa.a2.unit44.lesson06.teach.turn03:
    title: 'پیشخدمت: پس این قهوه‌ها از شما نیست.'
    gloss: 'پیشخدمت: پس این قهوه‌ها از شما نیست.'
    note: '*مال شما نیست* منفی *مال شماست* است.'
  fa.a2.unit44.lesson06.teach.turn04:
    title: نیما دوباره اصلاح می‌کند
    gloss: 'نیما: من امروز قهوه نوشیده‌ام، پس دیگر قهوه نمی‌خواهم. هیچ چیز نمی‌خواهم، فقط آب.'
    note: '*دیگه* و *هیچی* هر دو با فعل منفی می‌آیند.'
