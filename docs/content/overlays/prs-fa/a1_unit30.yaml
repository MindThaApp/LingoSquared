course:
  title: فارسی ایران A1
  description: 'فارسی ایرانی برای مبتدیان: نام بردن کلمه‌های پوهنتون و درس خواندن (پوهنتون، محصل، درس/مضمون، زبان)، گفتن این‌که چه مضمونی می‌خوانید یا یاد می‌گیرید (ریاضی، رشته، انگلیسی به‌عنوان مضمون)، پرسیدن و جواب دادن این‌که کجا درس می‌خوانید (*کجا درس می‌خونی؟*) و هر چند وقت می‌روید، یک متن خواندنی درباره‌ی درس‌های *نیما* و *سارا*، و یک گفت‌وگوی پایانی میان *نیما* و *سارا* درباره‌ی مضمون‌هایشان و احساسشان نسبت به آن‌ها (سخت ولی جالب).'
