  fa.a2.unit50.changing_arrangement.lesson01.exercise04.order_polite_change:
    instruction: 'کلمه‌ها را طوری ترتیب کنید که بپرسین: وعده‌مان را تغییر داده می‌توانیم؟'
    accepted_answers:
    - value:
      - می‌شه
      - قرارمون
      - رو
      - عوض
      - کنیم
      status: correct
    feedback: اول *می‌شه* می‌آید، بعد مفعول با *رو*، و بعد فعل.
  fa.a2.unit50.changing_arrangement.lesson01.exercise05.fill_change:
    instruction: 'درخواست را تکمیل کنید: وعده‌مان را تغییر داده می‌توانیم؟'
    accepted_answers:
    - value: عوض
      status: correct
    feedback: 'جملهٔ پرسشی کامل این است: *می‌شه قرارمون رو عوض کنیم؟*'
  fa.a2.unit50.changing_arrangement.lesson01.exercise06.translate_polite_change:
    instruction: 'به فارسی (ایران) ترجمه کنید و کلمهٔ مؤدبانهٔ «آیا ممکن است» را به کار ببرید: ببخشید، وعده‌مان را تغییر داده می‌توانیم؟'
    accepted_answers:
    - value: ببخشید می‌شه قرارمون رو عوض کنیم
      status: correct
    - value: ببخشید می‌تونیم قرارمون رو عوض کنیم
      status: correct
    - value: می‌شه قرارمون رو عوض کنیم
      status: acceptable_with_note
      note: کلمهٔ «ببخشید» نیست، اما درخواست باز هم مؤدبانه است.
    - value: می‌تونیم قرارمون رو عوض کنیم
      status: acceptable_with_note
      note: کلمهٔ «ببخشید» نیست، اما درخواست باز هم مؤدبانه است.
    feedback: 'نمونه: *ببخشید، می‌شه قرارمون رو عوض کنیم؟*'
  fa.a2.unit50.changing_arrangement.lesson02.exercise01.recognize_reason:
    instruction: چرا این شخص آمده نمی‌تواند؟
    correct_option: او باید کار کند.
    distractors:
    - او مریض است.
    - او دیر مانده است.
    - او روز جمعه وقت ندارد.
    accepted_answers:
    - value: او باید کار کند.
