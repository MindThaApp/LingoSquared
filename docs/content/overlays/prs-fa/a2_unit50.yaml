teaching:
  fa.a2.unit50.changing_arrangement.lesson01.teach.arrangement_words:
    title: قرار و تغییر دادن آن
    gloss: قرار، قرار ما، تغییر دادن، فردا
    note: '*قرار* یعنی وعدهٔ دیدار. *قرارمون* یعنی «قرار ما» (*ـمون* یعنی «ما/مان»). *عوض کردن* یعنی «تغییر دادن» و با *رو* استفاده می‌شود.'
    example_gloss:
    - فردا با نیما قرار دارم.
    - ما قرارمان را تغییر می‌دهیم.
    - ما امروز قرارمان را تغییر دادیم.
  fa.a2.unit50.changing_arrangement.lesson01.teach.sorry_words:
    title: ببخشید، متأسفانه، نمی‌توانم
    gloss: ببخشید، متأسفانه، نمی‌توانم، نمی‌توانیم
    note: '*ببخشید* و *متأسفانه* خبر بد را نرم‌تر می‌سازند. *نمی‌تونم* یعنی «نمی‌توانم» و *نمی‌تونیم* یعنی «نمی‌توانیم».'
    example_gloss:
    - ببخشید، فردا آمده نمی‌توانم.
    - متأسفانه فردا کار دارم.
    - متأسفانه نیما فردا آمده نمی‌تواند.
  fa.a2.unit50.changing_arrangement.lesson01.teach.delay_words:
    title: تأخیر و مصروفیت
    gloss: تأخیر، مصروفم، عاجل
    note: '*تأخیر دارم* یعنی دیر شده‌ام. *گرفتارم* یعنی مصروف هستم و *فوری* یعنی عاجل.'
    example_gloss:
    - من تأخیر دارم.
    - گرفتارم؛ آمده نمی‌توانم.
    - کار عاجل دارم.
  fa.a2.unit50.changing_arrangement.lesson01.teach.polite_change:
    title: درخواست مؤدبانهٔ تغییر
    gloss: ببخشید، می‌شود قرارمان را تغییر بدهیم؟
    note: '*می‌شه … ؟* مؤدبانه می‌پرسد که آیا چیزی ممکن است. فعل به *ـیم* («ما») ختم می‌شود، چون درخواست با «ما» بیان می‌شود.'
  fa.a2.unit50.changing_arrangement.lesson01.teach.ask_to_change:
    title: 'دو راه پرسیدن: می‌شه و می‌تونیم'
    gloss: آیا ممکن است قرارمان را تغییر بدهیم؟ آیا می‌توانیم قرارمان را تغییر بدهیم؟
    note: هر دو پرسش مؤدبانه‌اند. *می‌شه* شکل رایج گفتاری است؛ *می‌تونیم* کمی مستقیم‌تر به نظر می‌رسد. بعد از هر دو، فعل به شکل *کنیم* می‌آید، نه *می‌کنیم*.
  fa.a2.unit50.changing_arrangement.lesson02.teach.reason_words:
    title: گفتن سبب
    gloss: چون، باید، کار، مریضم
    note: '*چون* دلیل را معرفی می‌کند و می‌تواند اول یا دوم جمله بیاید. *باید کار کنم* یعنی «باید کار کنم».'
    example_gloss:
    - چون مریض هستم، آمده نمی‌توانم.
    - چون باید کار کنم، دیر می‌رسم.
    - چون کار دارم، نمی‌توانم.
  fa.a2.unit50.changing_arrangement.lesson02.teach.so_phrase:
    title: 'اول دلیل، بعد نتیجه: برای همین'
    gloss: مریضم، برای همین آمده نمی‌توانم.
    note: '*برای همین* یعنی «به همین دلیل». آن را بعد از دلیل به‌جای *چون* به کار ببرید؛ هر دو را در یک جمله نیاورید.'
  fa.a2.unit50.changing_arrangement.lesson02.teach.new_time:
    title: روز و ساعت برای وقت تازه
    gloss: پنجشنبه، جمعه، ساعت چهار، ساعت شش
    note: اول روز را بگویید و بعد *ساعت* و عدد را.
    example_gloss:
    - جمعه ساعت چهار وقت دارم.
    - پنجشنبه ساعت شش آمده می‌توانم.
    - فردا ساعت شش کار دارم.
  fa.a2.unit50.changing_arrangement.lesson02.teach.is_it_good:
    title: پیشنهاد وقت
    gloss: جمعه ساعت چهار برایت خوب است؟ آمده می‌توانی؟
    note: '*برات خوبه؟* می‌پرسد که آیا وقت برای یک نفر آشنا مناسب است. برای کسی که او را *شما* خطاب می‌کنید، بگویید *براتون خوبه؟*.'
  fa.a2.unit50.changing_arrangement.lesson02.teach.reason_then_time:
    title: تغییر قرار در سه مرحله
    gloss: فردا آمده نمی‌توانم چون باید کار کنم. جمعه ساعت چهار برایت خوب است؟
    note: اول بگویید که آمده نمی‌توانید، بعد با *چون* دلیل را بگویید، سپس یک روز و ساعت تازه پیشنهاد کنید. دلیل، درخواست را مؤدبانه‌تر می‌سازد.
  fa.a2.unit50.changing_arrangement.lesson03.teach.finish_words:
    title: تمام شدن و زنگ زدن
    gloss: تمام شد، تمام شود / تمام است، به تو زنگ می‌زنم، به من زنگ بزن
    note: '*تموم شد* گذشته است («تمام شد»)؛ *تموم بشه* شکلی است که بعد از *وقتی* برای آینده به کار می‌رود.'
    example_gloss:
    - کارم تمام شد.
    - کارم ساعت شش تمام می‌شود.
    - فردا به تو زنگ می‌زنم.
    - لطفاً به من زنگ بزن.
  fa.a2.unit50.changing_arrangement.lesson03.teach.confirm_or_postpone:
    title: تأیید یا به تعویق انداختن
    gloss: قطعی، عقب / بعدتر، بیندازیم
    note: '*قطعی* می‌گوید که قرار تأیید شده است. *عقب بندازیم* راه طبیعی گفتاری برای گفتن «بیایید آن را به تعویق بیندازیم» است.'
    example_gloss:
    - قرارمان قطعی شد.
    - بیایید قرارمان را عقب بیندازیم.
  fa.a2.unit50.changing_arrangement.lesson03.teach.when_clause:
    title: وقتی با آینده و گذشته
    gloss: وقتی کارم خلاص شود، به تو زنگ می‌زنم. وقتی کارم خلاص شد، به تو زنگ زدم.
    note: برای آینده، جملهٔ بعد از *وقتی* شکل *ب* را می‌گیرد (*تموم بشه*) و فعل اصلی حال ساده است (*زنگ می‌زنم*). برای گذشته، هر دو فعل گذشته‌اند.
  fa.a2.unit50.changing_arrangement.lesson03.teach.before_after:
    title: قبل از اینکه و بعد از اینکه
    gloss: پیش از آنکه بروم، به تو زنگ می‌زنم. بعد از آنکه برسم، به تو زنگ می‌زنم.
    note: 'بعد از *قبل از اینکه* («پیش از آنکه») و *بعد از اینکه* («بعد از آنکه») وقتی برنامه مربوط به آینده است، فعل با *ب* می‌آید: *برم*، *برسم*.'
  fa.a2.unit50.changing_arrangement.lesson03.teach.time_phrases:
    title: همین الگو در گذشته
    gloss: وقتی رسیدم، به تو زنگ زدم. بعد از آنکه رسیدم، به تو زنگ زدم.
    note: 'در گذشته، جمله یک فعل گذشتهٔ معمولی دارد: *رسیدم*. آن را با آینده، *برسم*، مقایسه کنید.'
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_words:
    title: اگر، مناسب، چطور است، آرایشگاه، بایسکل
    gloss: اگر، مناسب نیست، چطور است؟، آرایشگاه، بایسکل
    note: '*چطوره؟* یک پیشنهاد دیگر می‌دهد: *دوشنبه چطوره؟* یعنی «دوشنبه چطور است؟»'
    example_gloss:
    - دوشنبه چطور است؟
    - شنبه برایت مناسب نیست؟
    - پنجشنبه در آرایشگاه وقت دارم.
    - من یک بایسکل می‌خواهم.
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_clause:
    title: اگه برای وضعیت ممکن
    gloss: اگر وقت داشته باشی، شنبه رفته می‌توانیم. اگر باران ببارد، قرارمان را تغییر می‌دهیم.
    note: بعد از *اگه* شکل *ب* یا *داشته باشی* را به کار ببرید؛ جملهٔ اصلی حال ساده است. بخش *اگه* را اول بیاورید و بعدش ویرگول بگذارید.
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_cant:
    title: برنامهٔ دوم با اگه
    gloss: اگر آمده نمی‌توانی، به من زنگ بزن. اگر شنبه برایت مناسب نیست، دوشنبه چطور است؟
    note: '*اگه … نمی‌تونی* برای طرف مقابل راه خروج می‌دهد و *چطوره؟* یک روز نو پیشنهاد می‌کند.'
  fa.a2.unit50.changing_arrangement.lesson04.teach.polite_please:
    title: درخواست‌های مؤدبانه از یک مرکز خدماتی
    gloss: لطفاً یک وقت دیگر بدهید. آیا وقتم را تغییر داده می‌توانم؟
    note: نزد آرایشگر، دکان یا جای کرایه، *لطفا* و فعل *شما* (*بدید*) را به کار ببرید. *می‌شه … ؟* هم با *شما* کار می‌کند و هم با *تو*.
  fa.a2.unit50.changing_arrangement.lesson05.teach.reading:
    title: یک پیام برای تغییر دادن وعدهٔ ملاقات
    gloss: سارا، سلام! متأسفانه فردا آمده نمی‌توانم، چون باید کار کنم. وعده‌مان را تغییر داده می‌توانیم؟ روز جمعه ساعت چهار برایت خوب است؟ اگر جمعه نمی‌توانی، روز شنبه ساعت ده می‌توانم. وقتی کارم خلاص شود، برایت زنگ می‌زنم.
    note: یک بار برای دانستن دلیل بخوانید، بار دوم برای دو وقتی که پیشنهاد شده است.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn01:
    title: سارا به نیما یادآوری می‌کند
    gloss: نیما، فردا ساعت ده وعده داریم.
    note: سارا از وعده یاد می‌کند.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn02:
    title: نیما می‌خواهد وعده را تغییر بدهد
    gloss: ببخش سارا، متأسفانه فردا آمده نمی‌توانم، چون باید کار کنم. وعده‌مان را تغییر داده می‌توانیم؟
    note: نیما معذرت می‌خواهد، دلیلش را می‌گوید و مؤدبانه درخواست می‌کند.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn03:
    title: سارا قبول می‌کند و جمعه را پیشنهاد می‌کند
    gloss: بلی، مشکلی نیست. روز جمعه ساعت ده برایت خوب است؟
    note: سارا قبول می‌کند و یک وقت نو پیشنهاد می‌کند.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn04:
    title: نیما نمی‌پذیرد و شنبه را پیشنهاد می‌کند
    gloss: روز جمعه نمی‌توانم، چون وقت دوکتور دارم. شنبه چطور است؟
    note: نیما دلیل و یک پیشنهاد دیگر می‌دهد.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn05:
    title: سارا شنبه را قبول می‌کند
    gloss: شنبه ساعت ده خوب است. من بایسکل‌ها را برای شنبه می‌گیرم.
    note: بایسکل‌ها هم به روز نو انتقال می‌یابند.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn06:
    title: نیما از سارا تشکر می‌کند
    gloss: عالی است، تشکر! وقتی کارم خلاص شود، برایت زنگ می‌زنم.
    note: نیما با یک جملهٔ زمانی صحبت را ختم می‌کند.
exercises:
  fa.a2.unit50.changing_arrangement.lesson01.exercise01.recognize_request:
    instruction: این شخص چه می‌خواهد؟
    correct_option: وعده را تغییر بدهد.
    distractors:
    - وعده را تأیید کند.
    - بگوید که او دیر مانده است.
    - بپرسد که ملاقات کجاست.
    accepted_answers:
    - value: وعده را تغییر بدهد.
      status: correct
    feedback: '*قرارمون رو عوض کنیم* یعنی «وعدهٔ ما را تغییر بدهیم».'
  fa.a2.unit50.changing_arrangement.lesson01.exercise02.recognize_sorry:
    instruction: این چه معنی دارد؟
    correct_option: متأسفانه فردا آمده نمی‌توانم.
    distractors:
    - متأسفانه تو فردا آمده نمی‌توانی.
    - متأسفانه دیروز آمده نتوانستم.
    - خوش هستم که فردا بیایم.
    accepted_answers:
    - value: متأسفانه فردا آمده نمی‌توانم.
      status: correct
    feedback: '*نمی‌تونم* یعنی «نمی‌توانم»؛ *فردا* یعنی «فردا».'
  fa.a2.unit50.changing_arrangement.lesson01.exercise03.match_change_words:
