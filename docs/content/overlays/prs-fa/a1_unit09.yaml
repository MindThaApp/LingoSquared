teaching:
  fa.a1.unit09.lesson01.teach.hour_word:
    title: ساعت
    gloss: ساعت
    note: ساعت هم به معنای «ساعت زمانی» است و هم «ساعت دیواری/دستی»؛ کلمهٔ اصلی برای گفتن وقت است.
    example_gloss: ساعت چند است؟
  fa.a1.unit09.lesson01.teach.minute_word:
    title: دقیقه
    gloss: دقیقه
    note: دقیقه کلمه‌ای برای واحد دقیقه است.
    example_gloss: پنج دقیقه صبر کن.
  fa.a1.unit09.lesson01.teach.half_word:
    title: نیم
    gloss: نیم
    note: نیم یعنی نصف و برای نیم ساعت استفاده می‌شود.
    example_gloss: ساعت هفت و نیم است.
  fa.a1.unit09.lesson01.teach.quarter_word:
    title: ربع
    gloss: ربع
    note: ربع یعنی یک‌چهارم و برای ربع ساعت استفاده می‌شود.
    example_gloss: یک ربع به هشت است.
  fa.a1.unit09.lesson01.teach.va_word:
    title: و
    gloss: و
    note: و کلمهٔ پیوند عادی است که در سراسر این بخش به کار می‌رود.
    target_text: و (و)
  fa.a1.unit09.lesson02.teach.what_time_question:
    title: پرسیدن ساعت
    gloss: ساعت چند است؟
    note: ساعت چنده؟ شکل محاوره‌ای و روزمرهٔ پرسیدن ساعت در فارسی ایران است.
  fa.a1.unit09.lesson02.teach.contraction_note:
    title: کوتاه‌شدهٔ محاوره‌ای «ـه» (مرور)
    gloss: چنده شکل کوتاه‌شدهٔ گفتاری چند است است.
    note: این همان الگوی کوتاه‌شدنی است که پیش‌تر در واژه‌های هوا و خرید مثل آفتابیه و تومنه دیدید.
  fa.a1.unit09.lesson03.teach.three_oclock_half:
    title: گفتن «ساعت سه و نیم است»
    gloss: ساعت سه و نیم است.
    note: ساعت سه و نیمه از ساعت، «و» و نیمهٔ کوتاه‌شده (نیم) ساخته شده است.
  fa.a1.unit09.lesson03.teach.contraction_note2:
    title: کوتاه‌شدهٔ محاوره‌ای «ـه» برای نیم
    gloss: نیمه شکل کوتاه‌شدهٔ گفتاری نیم است است.
    note: همان الگوی چنده است، اما برای نیم به جای چند.
  fa.a1.unit09.lesson04.teach.sobh:
    title: صبح
    gloss: صبح
    note: صبح نام بخش بامدادی روز است.
    example_gloss: صبح زود از خواب بیدار می‌شوم.
  fa.a1.unit09.lesson04.teach.zohr:
    title: ظهر
    gloss: چاشت
    note: ظهر نام وقت نیمروز است.
    example_gloss: من در ظهر چاشت می‌خورم.
  fa.a1.unit09.lesson04.teach.asr:
    title: بعد از چاشت
    gloss: بعدازظهر
    note: عصر نام بخش بعد از چاشت تا آغاز شام روز است.
    example_gloss: من بعدازظهر کار می‌کنم.
  fa.a1.unit09.lesson04.teach.shab:
    title: شب
    gloss: شب
    note: شب نام وقت شب است.
    example_gloss: شب زود می‌خوابم.
  fa.a1.unit09.lesson05.teach.appointment_word:
    title: وقت ملاقات
    gloss: وعده ملاقات
    note: قرار کلمهٔ عمومی برای وعدهٔ ملاقات یا دیدار از پیش تعیین‌شده است.
    example_gloss: من یک وعدهٔ ملاقات دارم.
  fa.a1.unit09.lesson05.teach.appointment_question:
    title: پرسیدن وقت ملاقات
    gloss: وقت ملاقات چه ساعتی است؟
    note: قرار ساعت چنده؟ پرسش وقت را که در درس دوم آموختید، دربارهٔ یک ملاقات مشخص به کار می‌برد.
  fa.a1.unit09.lesson05.teach.four_oclock:
    title: گفتن وقت همراه با بخشی از روز
    gloss: ساعت چهار بعد از چاشت
    note: ساعت چهار عصر، ساعت را با عصر یکجا می‌کند تا فرق صبح و بعد از ظهر معلوم شود.
  fa.a1.unit09.lesson06.teach.tomorrow_review:
    title: فردا (مرور)
    gloss: فردا
    note: فردا در یک درس پیشین آمده بود؛ این‌جا برای ساختن جملهٔ ملاقات به کار می‌رود.
    example_gloss: فردا من یک وعدهٔ ملاقات دارم.
  fa.a1.unit09.lesson06.teach.late_word:
    title: گفتن اینکه کمی دیر می‌رسید
    gloss: من کمی دیر می‌شوم.
    note: '*یکم دیر می‌شه* کلمهٔ محاوره‌یی *یکم* (کمی) و *دیر* را به کار می‌برد.'
  fa.a1.unit09.lesson06.teach.turn01:
    title: نگار از وقت ملاقات فردا می‌پرسد
    gloss: نگار می‌پرسد که ملاقات فردا چه ساعتی است.
    note: قرار فردا ساعت چنده؟ پرسش ملاقات درس پنجم را با فردا یکجا می‌کند.
  fa.a1.unit09.lesson06.teach.turn02:
    title: آرش با تردید جواب می‌دهد
    gloss: آرش می‌گوید فکر می‌کند ساعت چهار است.
    note: فکر کنم (فکر می‌کنم) جواب را نرم می‌سازد، چون آرش کاملاً مطمئن نیست.
  fa.a1.unit09.lesson06.teach.turn03:
    title: نگار می‌پرسد صبح است یا عصر
    gloss: نگار می‌پرسد که ساعت چهار بعد از چاشت است یا صبح.
    note: این پرسش ابهام را روشن می‌کند، چون ساعت چهار به‌تنهایی معلوم نمی‌کند کدام چهار است.
  fa.a1.unit09.lesson06.teach.turn04:
    title: آرش روشن می‌کند
    gloss: آرش می‌گوید بعد از چاشت.
    note: وقتی زمینهٔ پرسش روشن شد، جواب یک‌کلمه‌یی طبیعی است.
  fa.a1.unit09.lesson06.teach.turn05:
    title: نگار موافقت می‌کند و وقت رسیدنش را تنظیم می‌کند
    gloss: نگار موافقت می‌کند و می‌گوید ساعت چهار و پانزده دقیقه می‌آید.
    note: ساعت چهار و ربع، ساعت را با ربع (یک‌چهارم) یکجا می‌کند.
  fa.a1.unit09.lesson06.teach.turn06:
    title: آرش می‌پرسد چرا یک ربع اضافه
    gloss: آرش می‌پرسد چرا می‌گوید چهار و ربع.
    note: '*چرا ربع؟* راه کوتاه پرسیدن «چرا ربع؟» است.'
  fa.a1.unit09.lesson06.teach.turn07:
    title: نگار توضیح می‌دهد که کمی دیر می‌شود
    gloss: نگار توضیح می‌دهد که از سر کار کمی دیر می‌شود.
    note: '*چون* دلیل را معرفی می‌کند و *یکم دیر می‌شه* را که در همین درس آموختید به کار می‌برد.'
  fa.a1.unit09.lesson06.teach.turn08:
    title: آرش او را آرام می‌کند
    gloss: آرش می‌گوید خوب است، مشکلی نیست.
    note: مشکلی نیست به نگار اطمینان می‌دهد که این تأخیر کوچک اشکالی ندارد.
