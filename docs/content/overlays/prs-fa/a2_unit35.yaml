teaching:
  fa.a2.unit35.lesson01.teach.connectors:
    title: سه پیوند زمانی
    gloss: پیش از آنکه، بعد از آنکه، وقتی که
    note: '*قبل از اینکه* یعنی «پیش از آنکه»، *بعد از اینکه* یعنی «بعد از آنکه» و *وقتی* یعنی «زمانی که». هر کدام جمله‌ای را شروع می‌کند که می‌گوید چیزی کی اتفاق می‌افتد.'
    example_gloss:
    - قبل از اینکه بروم، دروازه را می‌بندم.
    - بعد از اینکه رسیدم، به سارا تیلفون کردم.
    - وقتی رسیدم، به سارا تیلفون کردم.
  fa.a2.unit35.lesson01.teach.home_words:
    title: کلمه‌های خانه و زندگی روزمره
    gloss: خانه، دروازه، چراغ، مسواک، ناشتا، غذا، چای
    note: '*رو* در گفتار نشانهٔ مفعول معین است: *در رو* یعنی «دروازه» (مشخص). *مسواک* هم نام برس است و هم کار را می‌رساند، مثل *مسواک می‌زنم*.'
    example_gloss:
    - دروازه را می‌بندم.
    - چراغ را خاموش می‌کنم.
    - غذا خوردم و چای نوشیدم.
  fa.a2.unit35.lesson01.teach.subjunctive_verbs:
    title: فعل‌ها بعد از «قبل از اینکه»
    gloss: می‌روم، می‌خوابم، می‌رسم، می‌خرم، می‌پزم، سوار می‌شوم
    note: 'بعد از *قبل از اینکه* فعل به شکل التزامی می‌آید: *ب* + بن فعل + شناسه (*برم، بخوابم، برسم*). در این فعل *می‌* نمی‌آید. فعل اصلی عادت را می‌رساند: *می‌بندم، می‌زنم*.'
    example_gloss:
    - قبل از اینکه بخوابم، مسواک می‌کنم.
    - قبل از اینکه برسم، به سارا تیلفون می‌کنم.
    - قبل از اینکه سوار شوم، تکت می‌خرم.
    - قبل از اینکه غذا بپزم، سبزی را می‌شویم.
  fa.a2.unit35.lesson01.teach.past_verbs:
    title: فعل‌های ماضی ساده
    gloss: رسیدم، تیلفون کردم، خوردم
    note: این‌ها فعل‌های عادی ماضی ساده استند. بعد از *بعد از اینکه* و *وقتی* در قصه، ماضی ساده به کار می‌رود.
    example_gloss:
    - به ایستگاه رسیدم.
    - به سارا تیلفون کردم.
    - خوردم.
  fa.a2.unit35.lesson01.teach.before_subjunctive:
    title: قبل از اینکه + التزامی
    gloss: قبل از اینکه بروم، دروازه را می‌بندم
    note: 'بعد از *قبل از اینکه* فعل التزامی می‌آید: *برم، بخوابم، برسم*. کاری که در جملهٔ *قبل از اینکه* است دوم اتفاق می‌افتد و کار جملهٔ اصلی اول. در *قبل از اینکه برم، در رو می‌بندم* اول دروازه بسته می‌شود، بعد می‌روی.'
  fa.a2.unit35.lesson02.teach.travel_words:
    title: کلمه‌های سفر
    gloss: قطار، تکت، ایستگاه، سوار شدم، خریدم
    note: '*سوار شدم* تمام کار «سوار شدم» را می‌رساند (قطار، بس). *بلیت* یعنی تکت.'
    example_gloss:
    - تکت خریدم.
    - سوار قطار شدم.
    - به ایستگاه رسیدم.
  fa.a2.unit35.lesson02.teach.cook_and_day_verbs:
    title: فعل‌های ماضی بیشتر
    gloss: شستم، پختم، خواب شدم، گرفتم
    note: این شکل‌های ماضی ساده (*شستم، پختم، خوابیدم، گرفتم*) فعل‌هایی استند که بعد از *بعد از اینکه* به کار می‌بریم.
    example_gloss:
    - سبزی را شستم.
    - پختم.
    - شاور گرفتم.
    - خواب شدم.
  fa.a2.unit35.lesson02.teach.after_past:
    title: بعد از اینکه + ماضی ساده
    gloss: بعد از اینکه رسیدم، تیلفون کردم
    note: 'بعد از *بعد از اینکه* ماضی ساده به کار می‌رود: *رسیدم، خریدم، شستم*. کار جملهٔ *بعد از اینکه* اول اتفاق افتاده است. مثال: *بعد از اینکه بلیت خریدم، سوار قطار شدم* یعنی اول تکت خریدی، بعد سوار قطار شدی. اینجا التزامی نمی‌آید.'
  fa.a2.unit35.lesson03.teach.contrast_verbs:
    title: رفتن و بستن، ماضی و حال
    gloss: رفتم، بستم، می‌روم
    note: 'این‌ها شکل‌هایی استند که مقایسه می‌کنیم: *رفتم* (رفتم) و *می‌رم* (می‌روم) در برابر التزامی *برم*.'
    example_gloss:
    - از خانه برآمدم.
    - دروازه را بستم.
    - دارم می‌روم.
  fa.a2.unit35.lesson03.teach.contrast_forms:
    title: التزامی بعد از قبل، ماضی بعد از بعد
    gloss: قبل از اینکه بروم / بعد از اینکه رفتم
    note: 'این دو پیوند به دو شکل فعل فرق دارند. *قبل از اینکه برم* (قبل از اینکه بروم): التزامی، چون کار هنوز اتفاق نیفتاده است. *بعد از اینکه رفتم* (بعد از اینکه رفتم): ماضی ساده، چون کار تمام شده است. مقایسه کنید: *برم / رفتم*، *بخرم / خریدم*، *برسم / رسیدم*.'
  fa.a2.unit35.lesson03.teach.before_any_tense:
    title: فعل بعد از قبل، التزامی می‌ماند
    gloss: قبل از اینکه بروم، دروازه را بستم
    note: 'فعل بعد از *قبل از اینکه* التزامی است، حتی وقتی فعل اصلی ماضی باشد: *قبل از اینکه برم، در رو بستم* یعنی «قبل از اینکه بروم، دروازه را بستم». هرگز *رفتم* را بعد از *قبل از اینکه* نگذارید.'
  fa.a2.unit35.lesson04.teach.when_words:
    title: کلمه‌ها برای «وقتی»
    gloss: موسیقی، گوش می‌دهم، آمد، می‌رسم، می‌پزم
    note: '*گوش می‌دم* یعنی «گوش می‌دهم». *اومد* شکل گفتاری «آمد» است. *رسیدی* یعنی «رسیدی» و *چیکار کردی؟* یعنی «چه کار کردی؟»'
    example_gloss:
    - وقتی غذا می‌پزم، موسیقی گوش می‌دهم.
    - وقتی قطار آمد، سوار شدم.
    - وقتی می‌رسم، به سارا تیلفون می‌کنم.
  fa.a2.unit35.lesson04.teach.when_forms:
    title: وقتی + ماضی یا حال
    gloss: وقتی رسیدم، تیلفون کردم؛ وقتی می‌رسم، تیلفون می‌کنم
    note: '*وقتی* فعل را مطابق زمان می‌گیرد. برای کاری که تمام شده، گذشتهٔ ساده می‌آید: *وقتی رسیدم، زنگ زدم* (وقتی رسیدم، زنگ زدم). برای عادت یا پلان، حال با *می‌* می‌آید: *وقتی می‌رسم، زنگ می‌زنم* (وقتی می‌رسم، زنگ می‌زنم). *وقتی* نمی‌گوید کدام کار اول است؛ پس برای ترتیب دقیق از *قبل از اینکه* یا *بعد از اینکه* کار بگیر.'
  fa.a2.unit35.lesson05.teach.yesterday_words:
    title: کلمات برای متن خواندنی
    gloss: دیروز، صبح، خاموش کردم
    note: '*خاموش کردم* گذشتهٔ ساده به معنای «خاموش کردم» است. *دیروز صبح* یعنی «صبح دیروز».'
    example_gloss:
    - دیروز صبح دوش گرفتم.
    - چراغ را خاموش کردم.
  fa.a2.unit35.lesson05.teach.reading:
    title: یک صبح و یک ریل
    gloss: دیروز صبح بعد از اینکه دوش گرفتم، ناشتا خوردم. قبل از اینکه از خانه بروم، چراغ را خاموش کردم و دروازه را بستم. وقتی به ایستگاه رسیدم، تکت خریدم. بعد از اینکه ریل آمد، سوار شدم.
    note: 'یک بار بخوان تا ترتیب کارها را بفهمی، بعد سه کلمهٔ پیوندی را پیدا کن: *بعد از اینکه، قبل از اینکه، وقتی*.'
  fa.a2.unit35.lesson06.teach.dialogue_words:
    title: کلمات برای گفتگو
    gloss: فردا، به من، تو برسی، ما خوردیم، ما می‌خوریم
    note: '*بهم* یعنی «به من» و *بهت* یعنی «به تو». *برسی* وجه التزامی است، یعنی «تو برسی». *خوردیم* یعنی «ما خوردیم» و *می‌خوریم* یعنی «ما می‌خوریم».'
    example_gloss:
    - فردا به من زنگ می‌زنی؟
    - بلی، به تو تیلفون می‌کنم.
    - ما غذا خوردیم و بعد چای می‌خوریم.
  fa.a2.unit35.lesson06.teach.turn01:
    title: سارا دربارهٔ دیروز می‌پرسد
    gloss: 'سارا از نیما می‌پرسد: دیروز بعد از اینکه به ایستگاه رسیدی، چه کار کردی؟'
    note: سارا *بعد از اینکه* را با گذشته به کار می‌برد.
  fa.a2.unit35.lesson06.teach.turn02:
    title: نیما ترتیب کارها را می‌گوید
    gloss: بعد از اینکه رسیدم، تکت خریدم. وقتی ریل آمد، سوار شدم.
    note: نیما با *بعد از اینکه* و *وقتی* جواب می‌دهد، هر دو با فعل گذشته.
  fa.a2.unit35.lesson06.teach.turn03:
    title: سارا دربارهٔ فردا می‌پرسد
    gloss: فردا قبل از اینکه برسی، به من زنگ می‌زنی؟
    note: سارا *قبل از اینکه* را با وجه التزامی *برسی* به کار می‌برد.
  fa.a2.unit35.lesson06.teach.turn04:
    title: نیما قبول می‌کند
    gloss: بلی، قبل از اینکه برسم، به تو زنگ می‌زنم.
    note: 'نیما وجه التزامی را با پایان خودش تکرار می‌کند: *برسم*.'
  fa.a2.unit35.lesson06.teach.turn05:
    title: سارا برای شام پلان می‌گیرد
    gloss: خوب است. قبل از اینکه تو برسی، من غذا می‌پزم.
    note: 'هر دو نفر فاعل خود را دارند: *من* و *تو*.'
  fa.a2.unit35.lesson06.teach.turn06:
    title: نیما برای چای پلان می‌گیرد
    gloss: عالی است! بعد از اینکه غذا خوردیم، چای می‌خوریم.
    note: اینجا جملهٔ *بعد از اینکه* گذشته است و جملهٔ اصلی پلان است.
