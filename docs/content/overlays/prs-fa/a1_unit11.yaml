teaching:
  fa.a1.unit11.lesson01.teach.bidar_misham:
    title: من بیدار می‌شوم
    gloss: من بیدار می‌شوم
    note: بیدار می‌شم شکل محاوره‌ای تهرانی بیدار می‌شوم است. در دری می‌گوییم «بیدار می‌شوم».
