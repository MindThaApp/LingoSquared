  fa.a1.unit11.lesson01.teach.sobhune_mikhoram:
    title: صبحانه می‌خورم
    gloss: صبحانه می‌خورم
    note: صبحونه می‌خورم شکل محاوره‌ای صبحونه (صبحانه) را دارد، نه شکل رسمی‌تر صبحانه.
    example_gloss: صبحانه می‌خورم و سر کار می‌روم.
  fa.a1.unit11.lesson01.teach.miram_sarkar:
    title: سر کار می‌روم
    gloss: سر کار می‌روم
    note: میرم سر کار شکل محاوره‌ای می‌روم سر کار است.
    example_gloss: بعد از آن سر کار می‌روم.
  fa.a1.unit11.lesson01.teach.mikhabam:
    title: می‌خوابم
    gloss: می‌خوابم
    note: می‌خوابم یعنی خواب می‌کنم یا به خواب می‌روم.
    example_gloss: شب زود می‌خوابم.
  fa.a1.unit11.lesson01.teach.va_word:
    title: و
    gloss: و
    note: '*و* حرف ربط عام برای وصل کردن کارهای برنامهٔ روزانه است، چنان‌که در بخش ۹ معرفی شد.'
    example_gloss: بیدار می‌شوم و صبحانه می‌خورم.
  fa.a1.unit11.lesson02.teach.che_saat_bidar:
    title: ساعت چند بیدار می‌شوی؟
    gloss: ساعت چند بیدار می‌شوی؟
    note: '*ساعت چند بیدار می‌شی؟* عبارت *ساعت چند* را از درس‌های ساعت‌گفتن بخش ۹ دوباره به کار می‌برد.'
