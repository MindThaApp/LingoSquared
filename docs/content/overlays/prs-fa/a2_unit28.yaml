      right: فردا هوا سرد می‌شود
    - left: فردا هوا گرم می‌شه
      right: فردا هوا گرم می‌شود
    - left: فردا هوا آفتابیه
      right: فردا هوا آفتابی است
    - left: فردا
      right: فردا
