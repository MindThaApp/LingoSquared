teaching:
  fa.a2.unit28.lesson01.teach.weather_words:
    title: کلمه‌های هوا برای گزارش هواشناسی
    gloss: فردا، هوا، باران، برف، سرد، گرم، آفتابی
    note: '*بارون* شکل محاوره‌ای «باران» است؛ در نوشتار دقیق *باران* نوشته می‌شود. *آفتابیه* یعنی «هوا آفتابی است».'
    example_gloss:
    - فردا هوا آفتابی می‌باشد.
    - فردا باران می‌بارد.
    - فردا برف می‌بارد.
  fa.a2.unit28.lesson01.teach.forecast_verbs:
    title: دو فعل پیش‌بینی هوا
    gloss: می‌بارد، می‌شود
    note: '*می‌باره* یعنی «باران/برف می‌بارد». *می‌شه* یعنی «می‌شود» و با صفت می‌آید: *سرد می‌شه* = «سرد می‌شود».'
    example_gloss:
    - فردا هوا سرد می‌شود.
    - فردا هوا گرم می‌شود.
  fa.a2.unit28.lesson01.teach.present_for_future:
    title: حال گفتاری برای آینده
    gloss: فردا باران می‌بارد. فردا هوا سرد می‌شود.
    note: 'فارسی‌زبانان در گفتار برای پیش‌بینی از زمان حال معمولی همراه با یک کلمه زمان کار می‌گیرند. *فردا بارون می‌باره* یعنی «فردا باران می‌بارد». در گفتار زمان آینده جداگانه‌ای نیست: *فردا* نشان می‌دهد که موضوع به آینده تعلق دارد.'
  fa.a2.unit28.lesson02.teach.possibility_words:
    title: شاید و احتمالاً
    gloss: شاید، احتمالاً، نیما، سارا
    note: '*شاید* یعنی «شاید» و *احتمالا* یعنی «احتمالاً». نیما و سارا دوستان همیشگی این کورس هستند.'
    example_gloss:
    - شاید نیما بیاید.
    - احتمالاً باران می‌بارد.
  fa.a2.unit28.lesson02.teach.subjunctive_verbs:
    title: فعل‌ها بعد از شاید
    gloss: می‌آید، نمی‌آید، می‌شود
    note: 'بعد از *شاید* فعل به شکل التزامی می‌آید: *بیاد* (بیاید)، *نیاد* (نیاید)، *بشه* (شود). شکل التزامی *ب-* دارد و *می‌* ندارد.'
    example_gloss:
    - شاید باران ببارد.
    - شاید باران نبارد.
    - شاید هوا سرد شود.
  fa.a2.unit28.lesson02.teach.shayad_note:
    title: شاید + التزامی
    gloss: شاید باران ببارد. شاید هوا سرد شود. شاید باران نبارد.
    note: 'وقتی چیزی فقط ممکن است، *شاید* به کار می‌رود. فعل التزامی است و *می‌* ندارد: *شاید بارون بیاد*. منفی: *شاید بارون نیاد*. با پیش‌بینی ساده *بارون می‌باره* که *می‌* دارد، مقایسه کنید.'
  fa.a2.unit28.lesson02.teach.ehtemalan_note:
    title: احتمالاً + حال
    gloss: احتمالاً باران می‌بارد. احتمالاً هوا سرد می‌شود.
    note: 'وقتی چیزی محتمل است، *احتمالا* به کار می‌رود. فعل در حال معمولی می‌ماند، درست مثل پیش‌بینی ساده: *احتمالا بارون می‌باره*. فقط کلمه *احتمالا* میزان یقین را تغییر می‌دهد.'
  fa.a2.unit28.lesson03.teach.negative_forecast:
    title: پیش‌بینی منفی
    gloss: نمی‌بارد
    note: '*نمی‌باره* منفی *می‌باره* است: *فردا بارون نمی‌باره* = «فردا باران نمی‌بارد».'
    example_gloss:
    - فردا باران نمی‌بارد.
    - فردا احتمالاً باران نمی‌بارد.
  fa.a2.unit28.lesson03.teach.certainty_contrast:
    title: یقینی، محتمل یا ممکن؟
    gloss: باران می‌بارد. احتمالاً باران می‌بارد. شاید باران ببارد.
    note: 'سه درجه. پیش‌بینی ساده: *بارون می‌باره* (حال، *می‌*). محتمل: *احتمالا بارون می‌باره* (حال، *می‌*). فقط ممکن: *شاید بارون بیاد* (التزامی، بدون *می‌*). اینجا *شاید* را با *می‌باره*ی ساده به کار نبرید.'
  fa.a2.unit28.lesson03.teach.negative_contrast:
    title: منفی‌ها پهلوی هم
    gloss: باران نمی‌بارد. شاید باران نبارد.
    note: 'منفی ساده: *نمی‌باره* (حال، *نمی‌*). منفی احتمالی: *شاید بارون نیاد* (فعل التزامی *نیاد*). در هر دو *ن-* هست، اما در دومی *می‌* وجود ندارد.'
  fa.a2.unit28.lesson04.teach.promise_words:
    title: کلمه‌های قول دادن
    gloss: قول می‌دهم، حتماً، دیر، زنگ (تماس تیلفونی)، کمکت، پس، نمی‌باشی
    note: '*قول می‌دم* = «قول می‌دهم.» *حتما* = «حتماً.» *زنگ* با *زدن* یعنی «تیلفون کردن.» *کمکت* از *کمک* + *ت* ساخته شده، یعنی «کمکت.» *دیر* = «دیر.»'
    example_gloss:
    - حتماً تیلفون می‌کنم.
    - قول می‌دهم کمکت کنم.
  fa.a2.unit28.lesson04.teach.promise_verbs:
    title: فعل‌ها برای قول دادن
    gloss: نکنم، تیلفون کنم (التزامی)، کنم (التزامی)، بیایم (التزامی)، تیلفون می‌کنم، تیلفون می‌کنی
    note: 'بعد از *قول می‌دم* فعل التزامی می‌آید: *نکنم*، *بزنم*، *کنم*، *بیام*. حالِ ساده‌ی *می‌زنم* با *حتما* به کار می‌رود.'
    example_gloss:
    - قول می‌دهم دیر نکنم.
    - قول می‌دهم تیلفون کنم.
    - قول می‌دهم بیایم.
  fa.a2.unit28.lesson04.teach.promise_note:
    title: قول می‌دم + فعل التزامی
    gloss: قول می‌دهم دیر نکنم. قول می‌دهم تیلفون کنم. قول می‌دهم بیایم.
    note: 'قول دادن یعنی *قول می‌دم* و بعدش فعل التزامی (بدون *می‌*): *قول می‌دم دیر نکنم*. نفی *ن-* روی فعل التزامی می‌آید. در فارسی ایران اینجا زمان آینده به کار نمی‌رود؛ فعل التزامی نشان می‌دهد که به انجام دادن چه کاری متعهد می‌شوی.'
  fa.a2.unit28.lesson04.teach.hatman_note:
    title: حتما + حال، شاید + التزامی
    gloss: حتماً تیلفون می‌کنم. شاید تیلفون کنم.
    note: برای قول قطعی می‌توانی بگویی *حتما زنگ می‌زنم* (حال با *می‌*). برای چیزی که مطمئن نیستی، *شاید زنگ بزنم* (التزامی، بدون *می‌*). همان تفاوتی که در مورد هوا دیدیم.
  fa.a2.unit28.lesson05.teach.message_words:
    title: کلمه‌ها برای یک پیام
    gloss: سلام، بعد، از، کار، قرار ملاقات، داریم، آخر، هفته، به تو، و، اما، ساعت، ده، همچنان، چطور است
    note: '*قرار داریم* یعنی «وعده‌ی ملاقات داریم.» *بعد از کار* یعنی «بعد از کار.» *آخر هفته* یعنی «آخر هفته.» *بهت* در محاوره یعنی «به تو.»'
    example_gloss:
    - فردا بعد از کار قرار ملاقات داریم.
    - آخر هفته هوا آفتابی می‌باشد.
    - حتماً برایت تیلفون می‌کنم.
  fa.a2.unit28.lesson05.teach.bulletin_words:
    title: کلمه‌های اعلامیه‌ها و اطلاعیه‌ها
    gloss: هواشناسی، باران (نوشتاری)، ابری، اطلاعیه، اداره، تعطیل، خواهد، بود/باشد، بارید، شد
    note: این کلمه‌ها به اعلامیه‌های نوشتاری هواشناسی و اطلاعیه‌ها تعلق دارند. *باران* شکل نوشتاری *بارون* گفتاری است. *خواهد* شکل نوشتاری آینده است، در *خواهد بود* و *خواهد شد*.
    example_gloss:
    - اطلاعیه‌ی هوا
    - فردا اداره تعطیل می‌باشد.
  fa.a2.unit28.lesson05.teach.formal_future_note:
    title: آینده‌ی نوشتاری با خواهد (فقط شناخت)
    gloss: هوا ابری می‌شود. باران می‌بارد. اداره تعطیل می‌باشد.
    note: 'فقط نوشتاری/رسمی. اعلامیه‌های هوا و اطلاعیه‌ها آینده‌ی نوشتاری به کار می‌برند: *خواهد* + شکل کوتاه فعل، مثل *خواهد شد* (می‌شود)، *خواهد بارید* (می‌بارد)، *خواهد بود* (می‌باشد). هنگام خواندن فقط باید آن را بشناسی. در گفتار و پیام به دوستان بگو *می‌شه*، *می‌باره*، *هست*؛ خودت *خواهد* به کار نبر.'
  fa.a2.unit28.lesson05.teach.reading_message:
    title: پیام از سارا
    gloss: سلام نیما! فردا بعد از کار قرار ملاقات داریم. فردا هوا سرد می‌شود و احتمالاً باران می‌بارد. شاید آخر هفته برف بیاید. قول می‌دهم دیر نکنم و حتماً برایت تیلفون می‌کنم.
    note: یک بار برای پیش‌بینی ساده بخوان، بعد برای چیزی که محتمل یا ممکن است، و بعد برای قول.
  fa.a2.unit28.lesson05.teach.reading_bulletin:
    title: یک اعلامیه‌ی هواشناسی
    gloss: 'اطلاعیه‌ی هواشناسی: فردا هوا ابری می‌شود و باران می‌بارد. آخر هفته هوا سرد می‌باشد.'
    note: این یک اعلامیه‌ی نوشتاری است. شکل‌های *خواهد* فقط برای شناخت‌اند.
  fa.a2.unit28.lesson06.teach.turn01:
    title: سارا درباره‌ی فردا می‌پرسد
    gloss: 'سارا از نیما می‌پرسد: فردا هوا چطور می‌باشد؟'
    note: این پرسش یک پیش‌بینی می‌خواهد.
  fa.a2.unit28.lesson06.teach.turn02:
    title: نیما پیش‌بینی می‌کند
    gloss: 'نیما: احتمالاً باران می‌بارد. شاید برف هم بیاید.'
    note: '*احتمالا* یعنی محتمل است؛ *شاید* فقط ممکن است.'
  fa.a2.unit28.lesson06.teach.turn03:
    title: سارا برنامه را بررسی می‌کند
    gloss: 'سارا: فردا ساعت ده قرار ملاقات داریم. دیر نمی‌کنی؟'
    note: سارا با *دیر نمی‌کنی؟* تعهد می‌خواهد.
  fa.a2.unit28.lesson06.teach.turn04:
    title: نیما قول می‌دهد
    gloss: 'نیما: قول می‌دهم دیر نکنم.'
    note: '*قول می‌دم* + فعل التزامی.'
  fa.a2.unit28.lesson06.teach.turn05:
    title: سارا درباره‌ی تیلفون می‌پرسد
    gloss: 'سارا: پس تیلفون می‌کنی؟'
    note: حال با *می‌* درباره‌ی یک برنامه‌ی قطعی می‌پرسد.
  fa.a2.unit28.lesson06.teach.turn06:
    title: نیما تعهد می‌کند
    gloss: 'نیما: حتماً تیلفون می‌کنم.'
    note: '*حتما* + حال یک قول قطعی می‌دهد.'
