      status: correct
    feedback: جمله‌ی کامل *فردا بارون می‌باره* است.
  fa.a2.unit28.lesson01.exercise06.translate_snow:
    instruction: 'با فردا و حال گفتاری ترجمه کن: فردا برف می‌بارد.'
    accepted_answers:
    - value: فردا برف می‌باره
      status: correct
    - value: برف فردا می‌باره
      status: acceptable_with_note
      note: ممکن است، اما معمولاً کلمه‌ی زمان اول می‌آید.
    feedback: '*فردا برف می‌باره* نمونه‌ی آموخته‌شده است.'
  fa.a2.unit28.lesson02.exercise01.recognize_maybe_rain:
