  fa.a2.unit18.lesson01.teach.return_item_note:
    title: پس دادن جنس (فعل سبک)
    gloss: پس دادن (جنس)
    note: '*پس دادن* در اصل یعنی «پس دادن» -- ساختار دیگری از فعل سبک، مانند *باز کردن* از بخش بانک پیشتر.'
