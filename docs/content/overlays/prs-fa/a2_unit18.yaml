  fa.a2.unit18.lesson01.teach.deadline_word:
    title: مهلت / مدت مجاز
    gloss: مهلت / مدت مجاز
    note: '*مهلت* واژهٔ عمومی برای وقت تعیین‌شده یا مدت مجاز است.'
