    note: '*لطفاً* واژهٔ مؤدبانه‌ای است که در آخر درخواست می‌آید.'
    example_gloss: لطفاً آن را تعویض کنید.
  fa.a2.unit18.lesson04.teach.turn01:
    title: نیما مشکل را می‌گوید
    gloss: نیما مؤدبانه می‌گوید که این هدفون را خریده، ولی صدا ندارد.
    note: عبارت مرور درس اول را با *صدا نداره* از درس دوم یکجا می‌کند.
  fa.a2.unit18.lesson04.teach.turn02:
    title: فروشنده رسید و تاریخ را می‌پرسد
    gloss: کارمند می‌پرسد که رسید دارد یا نه و چه روزی خریده است.
    note: '*خریدینش* شکل محاوره‌ای مؤدبانهٔ «شما آن را خریدید» است (در نوشتار *خریدید*، با ضمیر *-ش* برای «آن»).'
  fa.a2.unit18.lesson04.teach.turn03:
    title: نیما تأیید می‌کند و تاریخ را می‌گوید
    gloss: نیما می‌گوید بله، بفرمایید -- سه روز پیش آن را خریده است.
    note: '*بفرمایید* اینجا وقت دادن چیزی یعنی «بفرمایید، این است».'
  fa.a2.unit18.lesson04.teach.turn04:
    title: فروشنده تأیید می‌کند که در مهلت است و انتخاب می‌دهد
    gloss: کارمند می‌گوید مشکلی نیست، او در مهلت هفت روزه است -- تعویض می‌خواهد یا پولش را پس بگیرد؟
    note: '*تو مهلت هفت روزه هستید* (شما در مهلت هفت روزه هستید) تأیید می‌کند که او حق دارد.'
  fa.a2.unit18.lesson04.teach.turn05:
    title: نیما تعویض را می‌خواهد
    gloss: نیما مؤدبانه تعویض را می‌خواهد.
    note: '*کنید* شکل امر مؤدبانهٔ *کردن* است.'
  fa.a2.unit18.lesson04.teach.turn06:
    title: فروشنده تعویض را تمام می‌کند
    gloss: کارمند می‌گوید باشد، همین حالا یک هدفون نو به او می‌دهد.
    note: '*بهتون می‌دم* (به شما می‌دهم) تعویض را تمام می‌کند.'
