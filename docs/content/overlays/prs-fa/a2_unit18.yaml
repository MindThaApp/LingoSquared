    gloss: من این هدفون را خریدم، ولی صدا ندارد. می‌خواهم آن را تعویض کنم یا پولم را پس بگیرم.
    note: 'الگوی کامل شکایت که این درس بر آن ساخته شده است: اول مشکل را بگو، بعد خواستت را.'
