teaching:
  fa.a1.unit03.lesson01.teach.adad:
    title: عدد
    gloss: عدد
    note: عدد کلمهٔ عمومی برای «عدد» است.
    example_gloss: این یک عدد است.
  fa.a1.unit03.lesson01.teach.zero:
    title: صفر
    gloss: ۰ — صفر
    note: صفر برای عدد صفر استفاده می‌شود، همچنین به حیث رقم در عدد درازتر مثل شمارهٔ تلفن.
    example_gloss: صفر یک عدد است.
  fa.a1.unit03.lesson01.teach.one:
    title: یک
    gloss: ۱ — یک
    note: یک یعنی عدد یک.
    example_gloss: من یک کتاب دارم.
  fa.a1.unit03.lesson01.teach.two:
    title: دو
    gloss: ۲ — دو
    note: دو یعنی عدد دو.
    example_gloss: من دو سیب دارم.
  fa.a1.unit03.lesson01.teach.three:
    title: سه
    gloss: ۳ — سه
    note: سه یعنی عدد سه.
    example_gloss: او سه برادر دارد.
  fa.a1.unit03.lesson01.teach.four:
    title: چهار
    gloss: ۴ — چهار
    note: چهار یعنی عدد چهار.
    example_gloss: ساعت چهار است.
  fa.a1.unit03.lesson01.teach.five:
    title: پنج
    gloss: ۵ — پنج
    note: پنج یعنی عدد پنج.
    example_gloss: پنج دقیقه صبر کنید.
  fa.a1.unit03.lesson01.teach.six:
    title: شش
    gloss: ۶ — شش
    note: شش یعنی عدد شش.
    example_gloss: شش چوکی هست.
  fa.a1.unit03.lesson01.teach.seven:
    title: هفت
    gloss: ۷ — هفت
    note: هفت یعنی عدد هفت.
    example_gloss: در یک هفته هفت روز است.
  fa.a1.unit03.lesson01.teach.eight:
    title: هشت
    gloss: ۸ — هشت
    note: هشت یعنی عدد هشت.
    example_gloss: ساعت هشت شما را می‌بینم.
  fa.a1.unit03.lesson01.teach.nine:
    title: نه
    gloss: ۹ — نُه
    note: نه یعنی عدد نُه. همچنین کلمهٔ معمول برای «نه» (نفی) است؛ از روی موقعیت، مثلاً وقتی در شمارش یا در یک عدد شنیده شود، معلوم می‌شود کدام معنی است.
    example_gloss: نُه شاگرد اینجا استند.
  fa.a1.unit03.lesson01.teach.ten:
    title: ده
    gloss: ۱۰ — ده
    note: ده یعنی عدد ده.
    example_gloss: من ده انگشت دارم.
  fa.a1.unit03.lesson02.teach.eleven:
    title: یازده
    gloss: ۱۱ — یازده
    note: یازده یعنی عدد یازده.
    example_gloss: ساعت یازده صنف دارم.
  fa.a1.unit03.lesson02.teach.twelve:
    title: دوازده
    gloss: ۱۲ — دوازده
    note: دوازده یعنی عدد دوازده.
    example_gloss: در یک سال دوازده ماه است.
  fa.a1.unit03.lesson02.teach.thirteen:
    title: سیزده
    gloss: ۱۳ — سیزده
    note: سیزده یعنی عدد سیزده.
    example_gloss: او سیزده ساله است.
  fa.a1.unit03.lesson02.teach.fourteen:
    title: چهارده
    gloss: ۱۴ — چهارده
    note: چهارده یعنی عدد چهارده.
    example_gloss: چهارده روز دیگر می‌آیم.
  fa.a1.unit03.lesson02.teach.fifteen:
    title: پانزده
    gloss: ۱۵ — پانزده
    note: پانزده یعنی عدد پانزده.
    example_gloss: او پانزده کتاب دارد.
  fa.a1.unit03.lesson02.teach.sixteen:
    title: شانزده
    gloss: ۱۶ — شانزده
    note: شانزده یعنی عدد شانزده — از شش و ده قابل پیش‌بینی نیست، پس بهتر است مثل یک کلمهٔ جداگانه یاد گرفته شود.
    example_gloss: او شانزده ساله است.
  fa.a1.unit03.lesson02.teach.seventeen:
    title: هفده
    gloss: ۱۷ — هفده
    note: هفده یعنی عدد هفده.
    example_gloss: هفده نفر آمدند.
  fa.a1.unit03.lesson02.teach.eighteen:
    title: هجده
    gloss: ۱۸ — هجده
    note: هجده یعنی عدد هجده.
    example_gloss: او هجده ساله است.
  fa.a1.unit03.lesson02.teach.nineteen:
    title: نوزده
    gloss: ۱۹ — نوزده
    note: نوزده یعنی عدد نوزده.
    example_gloss: نوزده روز باقی مانده است.
  fa.a1.unit03.lesson02.teach.twenty:
    title: بیست
    gloss: ۲۰ — بیست
    note: بیست یعنی عدد بیست.
    example_gloss: بیست جلد کتاب دارم.
  fa.a1.unit03.lesson02.teach.thirty:
    title: سی
    gloss: ۳۰ — سی
    note: سی یعنی عدد سی.
    example_gloss: این ماه سی روز دارد.
  fa.a1.unit03.lesson02.teach.forty_to_ninety:
    title: چهل تا نود
    gloss: 40, 50, 60, 70, 80, 90
    note: چهل، پنجاه، شصت، هفتاد، هشتاد، نود ده‌گانِ باقی‌مانده استند.
    example_gloss:
    - او چهل ساله است.
    - پنجاه چوکی هست.
    - شصت دقیقه یک ساعت است.
    - این کتاب هفتاد صفحه دارد.
    - او هشتاد کتاب دارد.
    - او نود ساله است.
  fa.a1.unit03.lesson02.teach.combining:
    title: ترکیب ده‌گان و یکان
    gloss: بیست و پنج
    note: بیست و پنج در اصل یعنی «بیست و پنج» — کلمهٔ ده‌گان، و، کلمهٔ یکان.
  fa.a1.unit03.lesson03.teach.shomare:
    title: شماره (چیزی)
    gloss: عدد
    note: شماره برای عدد شناسایی مثل شمارهٔ تلفن یا خانه استفاده می‌شود و با معنی عمومی «عدد» فرق دارد.
    example_gloss: این شمارهٔ تلفن من است.
  fa.a1.unit03.lesson03.teach.telefon:
    title: تلفون
    gloss: تلیفون
    note: تلفن به طور کلی برای همه نوع تلفن استفاده می‌شود، از جمله تلفن موبایل.
    example_gloss: من تلفن ندارم.
  fa.a1.unit03.lesson03.teach.digit_by_digit:
    title: پرسیدن نمبر تیلفون
    gloss: نمبر تیلفونت چند است؟
    note: شماره تلفنتون چنده؟ شکل عادی و مؤدبانهٔ پرسیدن شمارهٔ تلفن است. خواندن شماره رقم به رقم همیشه فهمیده می‌شود و برای مبتدیان بهترین راه است؛ در گفتار واقعی گروه‌گروه خواندن رقم‌ها هم عادی است، اما این درس اول شکل ساده‌تر یعنی رقم به رقم را تمرین می‌کند.
  fa.a1.unit03.lesson03.teach.chande:
    title: چقدر / چند است؟
    gloss: چند است؟ / قیمتش چند است؟
    note: چنده؟ شکل کوتاه‌شدهٔ چند است است و بسته به موقعیت، عدد، مقدار یا قیمت را می‌پرسد.
  fa.a1.unit03.lesson03.teach.read_number:
    title: خواندن شماره رقم به رقم
    gloss: صفر، نُه، یک، دو، سه، چهار، پنج، شش، هفت، هشت، هشت
    note: این درس خواندن شماره‌ها را رقم به رقم تمرین می‌کند. شمارهٔ موبایل واقعی در ایران ۱۱ رقم دارد و با ۰ شروع می‌شود، مثلاً ۰۹۱۲ ۳۴۵ ۶۷۸۸.
  fa.a1.unit03.lesson04.teach.sal:
    title: سال
    gloss: سال
    note: سال هم برای سال تقویم و هم برای گفتن عمر کسی استفاده می‌شود.
    example_gloss: عمرم بیست سال است.
  fa.a1.unit03.lesson04.teach.man_recap:
    title: من (مرور)
    gloss: من
    note: یادآوری کوتاه از من که اینجا برای گفتن عمر خودتان در یک جملهٔ کامل لازم است.
  fa.a1.unit03.lesson04.teach.chand_saale:
    title: پرسیدن عمر کسی (غیررسمی)
    gloss: عمرت چند سال است؟
    note: چند سالته؟ شکل غیررسمی برای یک نفر است؛ چند سالتونه؟ شکل مؤدبانهٔ آن است.
  fa.a1.unit03.lesson04.teach.salame:
    title: گفتن سن خود
    gloss: من بیست و پنج ساله هستم.
    note: سالمه پسوند مالکیت ـم (من) را مستقیم به سال وصل می‌کند و بعد فعل ربطی گفتاری ـه (است) را می‌افزاید — یعنی تقریباً «سال من است».
  fa.a1.unit03.lesson04.teach.ta:
    title: شمارنده
    gloss: (کلمهٔ شمارش؛ در دری معادل مستقیم ندارد)
    note: 'تا کلمهٔ شمارشِ عمومی است که هنگام شمردن بیشتر چیزها به کار می‌رود: عدد + تا + اسم.'
  fa.a1.unit03.lesson04.teach.sib:
    title: سیب
    gloss: سیب
    note: سیب یعنی سیب.
    example_gloss: من سیب دوست دارم.
  fa.a1.unit03.lesson04.teach.ketab:
    title: کتاب
    gloss: کتاب
    note: کتاب یعنی کتاب.
    example_gloss: این یک کتاب خوب است.
  fa.a1.unit03.lesson04.teach.do_ta_sib:
    title: درخواست مقدار
    gloss: دو سیب می‌خواهم.
    note: دو تا سیب می‌خوام مقدار شمرده‌شده را مثل همیشه با تا پیش از اسم می‌آورد.
  fa.a1.unit03.lesson05.teach.gheymat:
    title: قیمت
    gloss: قیمت
    note: قیمت کلمهٔ عمومی برای بها است.
    example_gloss: قیمت این چند است؟
  fa.a1.unit03.lesson05.teach.toman:
    title: تومان
    gloss: تومان (واحد پول ایران، در استفادهٔ روزمره)
    note: واحد رسمی پول ایران ریال است، اما قیمت‌ها در گفتار روزمره تقریباً همیشه به تومان گفته می‌شود (۱ تومان = ۱۰ ریال).
    example_gloss: این ده هزار تومان است.
  fa.a1.unit03.lesson05.teach.hezar:
    title: هزار
    gloss: هزار
    note: هزار یعنی هزار؛ قیمت‌ها معمولاً به هزار تومان گفته می‌شود.
    example_gloss: من هزار تومان دارم.
  fa.a1.unit03.lesson05.teach.ask_price:
    title: پرسیدن قیمت
    gloss: این چند است؟
    note: این چنده؟ شکل عادی پرسیدن قیمت چیزی است که پیش روی شماست.
  fa.a1.unit03.lesson05.teach.price_answer:
    title: گفتن قیمت
    gloss: سی هزار تومان است.
    note: 'تومنه شکل کوتاه‌شدهٔ تومن است است؛ الگوی کامل: عدد + هزار + تومنه.'
  fa.a1.unit03.lesson06.teach.practice_together:
    title: سارا پیشنهاد تمرین با هم می‌دهد
    gloss: سارا می‌گوید می‌خواهد با هم فارسی تمرین کنند و شمارهٔ تلفن مینا را می‌پرسد.
    note: باهم یعنی «با یکدیگر»؛ می‌خوام ... تمرین کنیم یعنی «می‌خواهم ما تمرین کنیم» — تمرین کنیم به تنهایی و به شکل سؤال هم می‌تواند یعنی «تمرین کنیم؟»
  fa.a1.unit03.lesson06.teach.mina_gives_number:
    title: مینا شمارهٔ خود را می‌دهد
    gloss: مینا موافقت می‌کند و شمارهٔ ۱۱ رقمی‌اش را رقم به رقم می‌خواند.
    note: شماره‌ام شکل کوتاه‌شدهٔ شمارهٔ من است؛ هشته شکل کوتاه‌شدهٔ هشت است است و شمارش را تمام می‌کند.
  fa.a1.unit03.lesson06.teach.sara_confirms:
    title: سارا مطمئن می‌شود که درست نوشته است
    gloss: سارا از مینا می‌خواهد صبر کند تا شماره را بنویسد، بعد برای تأیید آن را دوباره می‌خواند.
    note: درسته؟ («درست است؟») راه رایج برای تأیید شماره یا چیزی است که تازه شنیده‌اید.
  fa.a1.unit03.lesson06.teach.mina_confirms_asks:
    title: مینا تأیید می‌کند و در عوض می‌پرسد
    gloss: مینا تأیید می‌کند که درست است و شمارهٔ سارا را می‌پرسد.
    note: آره «بله»ی غیررسمی است، گفتاری‌تر از بله.
  fa.a1.unit03.lesson06.teach.sara_gives_number:
    title: سارا شمارهٔ خود را می‌دهد
    gloss: سارا شمارهٔ ۱۱ رقمی خودش را رقم به رقم می‌خواند.
    note: یکه شکل کوتاه‌شدهٔ یک است است و شمارش را همان‌طور تمام می‌کند که هشته شمارهٔ مینا را تمام کرد.
  fa.a1.unit03.lesson06.teach.mina_will_call:
    title: مینا قبول می‌کند زنگ بزند
    gloss: مینا می‌گوید فردا به سارا زنگ می‌زند.
    note: زنگ می‌زنم بهت یعنی «به تو تلفن می‌کنم» — تحت‌اللفظی «زنگ را به تو می‌زنم».
