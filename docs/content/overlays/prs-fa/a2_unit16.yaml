    title: محبوب
    gloss: محبوب
    note: '*مورد علاقه* یعنی محبوب؛ در *علاقه‌ام* پسوند «ـم» به معنی «من» به آن وصل شده است.'
    example_gloss: رنگ محبوب من آبی است.
  fa.a2.unit16.lesson04.teach.turn01:
    title: نیما از استفادهٔ سارا از شبکه‌های اجتماعی می‌پرسد
    gloss: نیما از سارا می‌پرسد که هر روز چقدر از شبکه‌های اجتماعی استفاده می‌کند.
    note: همان پرسش «چقدر» از درس دوم دوباره آمده است.
  fa.a2.unit16.lesson04.teach.turn02:
    title: سارا عادتش را می‌گوید
    gloss: سارا می‌گوید حدود دو ساعت؛ اپلیکیشن محبوبش اینستاگرام است.
    note: الگوی *حدود* (تقریباً) از درس دوم دوباره آمده است.
  fa.a2.unit16.lesson04.teach.turn03:
    title: نیما نظر او را می‌پرسد
    gloss: نیما می‌پرسد که به نظر او مفید است یا نه.
    note: '*به نظرت* (به نظر تو) شکل دوم شخص *به نظر من* است.'
  fa.a2.unit16.lesson04.teach.turn04:
    title: سارا نظرش را می‌دهد
    gloss: سارا می‌گوید به نظر او هم سرگرم‌کننده است و هم گاهی وقت ضایع می‌شود.
    note: '*هم ... هم ...* دو ویژگی یک چیز را به هم وصل می‌کند؛ اینجا یکی خوب و دیگری بد.'
  fa.a2.unit16.lesson04.teach.turn05:
    title: نیما عادت خودش را در مقابل می‌گذارد
    gloss: نیما می‌گوید بیشتر خبر می‌خواند، نه شبکه‌های اجتماعی.
    note: '*بیشتر ..., نه ...* (بیشتر ...، نه ...) ترجیح را با مقایسه بیان می‌کند.'
  fa.a2.unit16.lesson04.teach.turn06:
    title: سارا واکنش نشان می‌دهد
    gloss: 'سارا می‌گوید: چه خوب!'
    note: 'یک واکنش کوتاه روزمره: *چه خوب!* یعنی «چه خوب!».'
