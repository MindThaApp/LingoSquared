  fa.a2.unit16.lesson03.teach.message_text:
    title: یک پیام درباره خواندن خبر در انترنت
    gloss: سلام! من هر روز حدود یک ساعت خبر می‌خوانم. به نظر من خواندن خبر مفید است، چون از دنیا خبر دارم.
    note: یک پیام کوتاه با الگوی *به نظر من ... چون ...*، به سبک محاوره‌ای که مردم در پیام به دوستان استفاده می‌کنند.
