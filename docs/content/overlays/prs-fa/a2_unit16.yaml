    gloss: هر روز چقدر از شبکه‌های اجتماعی استفاده می‌کنی؟
    note: '*چقدر* مقدار را می‌پرسد؛ اینجا درباره وقتی که برای یک کار صرف می‌شود.'
  fa.a2.unit16.lesson02.teach.my_habit_sentence:
    title: عادت خودت را با بسامد بگو
    gloss: من هر روز حدود دو ساعت از شبکه‌های اجتماعی استفاده می‌کنم.
    note: '*هر روز* (هر روز) و *حدود دو ساعت* (تقریباً دو ساعت) با هم می‌آیند تا عادت همراه با مدت بیان شود.'
  fa.a2.unit16.lesson03.teach.world_word:
