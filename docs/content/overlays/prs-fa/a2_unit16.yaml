    example_gloss: صفحهٔ موبایل من بزرگ است.
  fa.a2.unit16.lesson01.teach.useful_word:
    title: مفید
    gloss: مفید
    note: '*مفید* یعنی سودمند؛ *مفیده* شکل محاوره‌ای آن است (*مفید* + *است*).'
    example_gloss: خواندن خبر مفید است.
  fa.a2.unit16.lesson01.teach.news_word:
    title: خبر
    gloss: خبر
    note: '*خبر* کلمهٔ عمومی برای خبر است.'
    example_gloss: من هر روز خبر می‌خوانم.
  fa.a2.unit16.lesson01.teach.entertaining_word:
    title: سرگرم‌کننده
    gloss: سرگرم‌کننده / مزه‌دار
