      status: correct
    feedback: '*سعی کردم* + شکل *ب-* یعنی «تلاش کردم که ...».'
  fa.a2.unit33.lesson02.exercise02.recognize_forgot_call:
    instruction: این جمله چه معنا دارد؟
    correct_option: یادم رفت زنگ بزنم.
    distractors:
    - تلاش کردم زنگ بزنم.
    - شروع کردم زنگ زدن.
    - دیگر زنگ نمی‌زنم.
    accepted_answers:
    - value: یادم رفت زنگ بزنم.
      status: correct
    feedback: '*یادم رفت* + شکل *ب-* یعنی «یادم رفت که ...».'
  fa.a2.unit33.lesson02.exercise03.match_try_forget:
