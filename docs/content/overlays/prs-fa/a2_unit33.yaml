    - یادم رفت بدوم.
    - دیگر نمی‌دوم.
    accepted_answers:
    - value: شروع کردم به دویدن.
      status: correct
    feedback: '*شروع کردم به دویدن* یعنی «شروع کردم به دویدن».'
  fa.a2.unit33.lesson01.exercise02.recognize_no_soda:
    instruction: این جمله چه معنا دارد؟
    correct_option: دیگر نوشابه نمی‌نوشم.
    distractors:
    - شروع کردم نوشابه بنوشم.
    - تلاش کردم نوشابه نخورم.
    - یادم رفت نوشابه بخرم.
    accepted_answers:
    - value: دیگر نوشابه نمی‌نوشم.
      status: correct
    feedback: '*دیگه ... نمی‌خورم* یعنی «دیگر ... نمی‌...».'
  fa.a2.unit33.lesson01.exercise03.match_start_stop:
    instruction: هر جملهٔ فارسی را با معنایش وصل کنید.
    accepted_answers:
    - value:
        شروع کردم به دویدن: دویدن را شروع کردم
        شروع کردم به شنا کردن: شنا کردن را شروع کردم
        شروع کردم به ورزش کردن: ورزش کردن را شروع کردم
        شروع کردم به کتاب خوندن: کتاب خواندن را شروع کردم
        دیگه نوشابه نمی‌خورم: دیگر نوشابه نمی‌نوشم
        دیگه نمی‌دوم: دیگر نمی‌دوم
        شیرینی رو ترک کردم: شیرینی را ترک کردم
        دیگه ورزش نمی‌کنم: دیگر ورزش نمی‌کنم
      status: correct
    feedback: عادت‌های شروع‌شده با *شروع کردم به* می‌آیند؛ عادت‌های ترک‌شده با *دیگه ... نمی‌* یا *ترک کردم*.
    pairs:
    - left: شروع کردم به دویدن
      right: دویدن را شروع کردم
    - left: شروع کردم به شنا کردن
      right: شنا کردن را شروع کردم
    - left: شروع کردم به ورزش کردن
      right: ورزش کردن را شروع کردم
    - left: شروع کردم به کتاب خوندن
      right: کتاب خواندن را شروع کردم
    - left: دیگه نوشابه نمی‌خورم
      right: دیگر نوشابه نمی‌نوشم
    - left: دیگه نمی‌دوم
      right: دیگر نمی‌دوم
    - left: شیرینی رو ترک کردم
      right: شیرینی را ترک کردم
    - left: دیگه ورزش نمی‌کنم
      right: دیگر ورزش نمی‌کنم
  fa.a2.unit33.lesson01.exercise04.order_started_swimming:
    instruction: 'کلمه‌ها را مرتب کنید تا بگویین: شروع کردم به شنا کردن.'
    accepted_answers:
    - value:
      - شروع
      - کردم
      - به
      - شنا
      - کردن
      status: correct
    feedback: '*شروع کردم به شنا کردن*: بعد از *به* اسم فعل می‌آید.'
  fa.a2.unit33.lesson01.exercise05.fill_no_soda:
    instruction: جمله را برای «دیگر نوشابه نمی‌نوشم» کامل کنید.
    accepted_answers:
    - value: نمی‌خورم
      status: correct
    feedback: جملهٔ کامل *دیگه نوشابه نمی‌خورم* است.
  fa.a2.unit33.lesson01.exercise06.translate_gave_up_sweets:
    instruction: 'به فارسی ایران ترجمه کنید و از ترک کردم استفاده کنید: شیرینی را ترک کردم.'
