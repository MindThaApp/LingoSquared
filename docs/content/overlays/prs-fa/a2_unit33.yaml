teaching:
  fa.a2.unit33.lesson01.teach.people:
    title: آدم‌ها
    gloss: من، سارا، نیما
    note: سارا و نیما دوست هستند و دربارهٔ عادت‌هایشان صحبت می‌کنند. *من* معمولاً گفته نمی‌شود، چون آخر فعل «من» را نشان می‌دهد.
    example_gloss:
    - من نیما را دیدم.
    - سارا و نیما دوست هستند.
  fa.a2.unit33.lesson01.teach.sport_words:
    title: کلمه‌های ورزش و سرگرمی
    gloss: دویدن، شنا کردن، ورزش کردن، کتاب خواندن، باشگاه، پارک
    note: 'کارها با مصدری که به *-ن* ختم می‌شود نام برده می‌شوند: *دویدن*، *خوندن*. ترکیب‌ها با *کردن* می‌آیند: *شنا کردن*، *ورزش کردن*.'
    example_gloss:
    - من در پارک شروع کردم به دویدن.
    - من در باشگاه ورزش می‌کنم.
  fa.a2.unit33.lesson01.teach.screen_food:
    title: وقت صرف‌شده با صفحه و کلمه‌های خوراکی
    gloss: موبایل، تلویزیون، نوشابه، شیرینی، آب، ساعت
    note: '*نگاه کردن* فعل معمول گفتاری برای تماشای تلویزیون است: *تلویزیون نگاه کردن*. جمع *شب‌ها* به معنای «شبانه، در شب» به صورت عادت است.'
    example_gloss:
    - شب‌ها یک ساعت تلویزیون تماشا می‌کنم.
    - یک ساعت از موبایلم استفاده می‌کنم.
  fa.a2.unit33.lesson01.teach.time_words:
    title: کلمه‌های زمان و عادت
    gloss: هر روز، ماه، هفته، پیش، از، دیگر، زود، دیر، کمتر
    note: '*از ماه پیش* یعنی «از یک ماه پیش تا حالا»؛ *پیش* بعد از کلمهٔ زمان یعنی «قبل». *دیگه* با فعل منفی یعنی «دیگر».'
    example_gloss:
    - از یک ماه پیش هر روز می‌دوم.
    - از هفتهٔ گذشته شب‌ها زود می‌خوابم.
  fa.a2.unit33.lesson01.teach.start_form:
    title: 'شروع کردن: شروع کردم به + اسم فعل'
    gloss: شروع کردم به دویدن؛ شروع کردم به شنا کردن
    note: 'برای گفتن اینکه عادتی را شروع کرده‌اید، *شروع کردم به* و بعد از آن اسم فعل (شکل *-ن*) را بیاورید: *شروع کردم به دویدن*. فعل دوم را صرف نکنید.'
  fa.a2.unit33.lesson01.teach.stop_form:
    title: 'ترک کردن: دیگه ... نمی‌کنم و ترک کردم'
    gloss: دیگر نوشابه نمی‌نوشم؛ شیرینی را ترک کردم
    note: 'دو راه طبیعی برای گفتن ترک کردن: *دیگه* با فعل حال منفی (*دیگه نمی‌دوم* = دیگر نمی‌دوم)، یا *X رو ترک کردم* (X را ترک کردم) با نشانهٔ مفعول معین *رو*.'
  fa.a2.unit33.lesson02.teach.subjunctive_verbs:
    title: فعل‌ها در شکل «خواستن»
    gloss: که بخوابم، بیدار شوم، بدوم، بخورم/بنوشم، زنگ بزنم، بروم، بکنم
    note: 'این پایان‌ها (*-م*) بعد از *سعی* و *یادم رفت* می‌آیند. فعل‌های مرکب اسم را نگه می‌دارند و جزء سبک را تغییر می‌دهند: *ورزش کنم*، *زنگ بزنم*، *بیدار شم*.'
    example_gloss:
    - می‌خواهم هر روز بدوم.
    - باید زود بیدار شوم.
  fa.a2.unit33.lesson02.teach.try_forget_words:
    title: تلاش و فراموشی
    gloss: تلاش، فراموش کردم، که، دیروز، امروز
    note: '*یادم رفت* از *یاد* + *م* + *رفت* ساخته شده است: «از یادم رفت». همین ساختار برای هر شخص کار می‌کند: *یادش رفت*، *یادت رفت*.'
    example_gloss:
    - دیروز یادم رفت آب بنوشم.
    - امروز تلاش می‌کنم زود بخوابم.
  fa.a2.unit33.lesson02.teach.try_form:
    title: 'تلاش کردن: سعی می‌کنم / سعی کردم + شکل «خواستن»'
    gloss: تلاش می‌کنم زود بخوابم؛ تلاش کردم زود بیدار شوم
    note: '*سعی می‌کنم* یعنی «تلاش می‌کنم» و *سعی کردم* یعنی «تلاش کردم». فعل دوم همیشه به شکل *ب-* با همان پایان شخص می‌آید و *به* ندارد: *سعی کردم زود بیدار شم*.'
  fa.a2.unit33.lesson02.teach.forget_form:
    title: 'فراموش کردن: یادم رفت (که) + شکل «خواستن»'
    gloss: یادم رفت زنگ بزنم؛ یادم رفت آب بنوشم
    note: '*یادم رفت* با شکل *ب-* یعنی «یادم رفت که فلان کار را بکنم». کلمهٔ *که* در گفتار اختیاری است: *یادم رفت زنگ بزنم* = *یادم رفت که زنگ بزنم*.'
  fa.a2.unit33.lesson02.teach.subjunctive_shape:
    title: شکل «خواستن» چطور ساخته می‌شود
    gloss: ب + ریشهٔ فعل + پایان شخص
    note: 'بیشتر فعل‌ها پیش از ریشه *ب-* می‌گیرند: *بدوم*، *بخورم*، *بخوابم*. فعل‌های مرکب آن را روی جزء سبک می‌گذارند (*زنگ بزنم*) یا از *کنم* و *شم* استفاده می‌کنند. در گفتار *بیدار بشم* اغلب کوتاه شده و *بیدار شم* گفته می‌شود.'
  fa.a2.unit33.lesson03.teach.four_frames:
    title: چهار ساختار، چهار معنی
    gloss: شروع به دویدن کردم / تلاش کردم بدوم / یادم رفت بدوم / دیگر نمی‌دوم
    note: 'یک فعالیت با ساختار تغییر معنی می‌دهد: *شروع کردم به دویدن* (شروع کردم)، *سعی کردم بدوم* (تلاش کردم)، *یادم رفت بدوم* (فراموش کردم)، *دیگه نمی‌دوم* (دیگر نمی‌دوم).'
  fa.a2.unit33.lesson03.teach.noun_or_subjunctive:
    title: اسم فعل یا شکل «خواستن»؟
    gloss: به + اسم فعل در برابر شکل ب-
    note: 'بعد از *شروع کردم به* اسم فعل (*شنا کردن*) بیاید. بعد از *سعی کردم* و *یادم رفت* شکل شخصی با *-م* (*شنا کنم*) بیاید. این‌ها را مخلوط نکنید: *سعی کردم به شنا کردن* غلط است.'
  fa.a2.unit33.lesson03.teach.dige_negative:
    title: دیگه + منفی یعنی «دیگر نه»
    gloss: دیگر شب‌ها تلویزیون تماشا نمی‌کنم
    note: '*دیگه* پیش از فعل منفی می‌گوید کاری قبلاً انجام می‌شد و حالا متوقف شده است. بدون *دیگه*، *نوشابه نمی‌خورم* یک واقعیت عمومی است («نوشابه نمی‌نوشم») نه یک تغییر.'
  fa.a2.unit33.lesson04.teach.questions:
    title: پرسش دربارهٔ عادت‌ها
    gloss: از کی شروع کردی؟ چی را ترک کردی؟
    note: 'پرسش به شکل «تو» با *-ی* پایان می‌یابد: *شروع کردی* = شروع کردی، *ترک کردی* = ترک کردی. جواب را با شکل *-م* بدهید.'
    example_gloss:
    - از کی شروع کردی؟
    - چی را ترک کردی؟
  fa.a2.unit33.lesson04.teach.answer_since:
    title: جواب دادن با زمان شروع
    gloss: از یک ماه پیش شروع کردم به دویدن
    note: 'زمان را اول بگذارید: *از ماه پیش شروع کردم به دویدن*. برای ترک کردن، مفعول را اول بگذارید و *رو* بیاورید: *نوشابه رو ترک کردم*.'
  fa.a2.unit33.lesson05.teach.link_words:
    title: کلمه‌های ربط
    gloss: ولی، هم، خاموش
    note: '*هم* بعد از اسم یا گروه فعلی یعنی «همچنین». *خاموش کردن* یعنی «خاموش کردن» و با مفعول معین *رو* می‌آید.'
    example_gloss:
    - موبایل را خاموش کردم.
    - تلاش کردم، ولی یادم رفت.
  fa.a2.unit33.lesson05.teach.reading_note:
    title: متنی دربارهٔ عادت‌های تغییریافته
    gloss: ''
    note: یک بار برای دو تغییر بخوانید (یکی شروع شده، دو تا ترک شده)، بعد دوباره برای اینکه گوینده به چه چیزی تلاش می‌کند و چه چیزی را فراموش کرده است.
  fa.a2.unit33.lesson06.teach.chat_words:
    title: کلمه‌های گپ
    gloss: چطور است، خوب است، آفرین، ببخش، پس، چرا، نه، می‌خوری/می‌نوشی، زنگ نزدی
    note: '*آفرین* دوست را تشویق می‌کند («شاباش»). *ببخش* «ببخش» غیررسمی است؛ با آدم‌های غریب *ببخشید* بگویید.'
    example_gloss:
    - ورزش چطور پیش می‌رود؟ خوب!
    - پس چرا زنگ نزدی؟
  fa.a2.unit33.lesson06.teach.turn01:
    title: سارا از ورزش می‌پرسد
    gloss: 'سارا از نیما می‌پرسد: ورزش چطور پیش می‌رود؟'
    note: این پرسش گفتگو را دربارهٔ عادت‌های تازهٔ او آغاز می‌کند.
  fa.a2.unit33.lesson06.teach.turn02:
    title: نیما می‌گوید چه چیزی را شروع کرده
    gloss: 'نیما: خوب است! یک ماه پیش شروع کردم به دویدن.'
    note: '*شروع کردم به* با اسم فعل *دویدن*.'
  fa.a2.unit33.lesson06.teach.turn03:
    title: سارا آفرین می‌گوید و می‌پرسد
    gloss: 'سارا: آفرین! نوشابه هم می‌نوشی؟'
    note: '*هم* یعنی «همچنین».'
  fa.a2.unit33.lesson06.teach.turn04:
    title: نیما نوشابه را ترک کرده
    gloss: 'نیما: نه، نوشابه را ترک کردم. تلاش می‌کنم از موبایل هم کمتر استفاده کنم.'
    note: یک ترک کردن (*ترک کردم*) و یک تلاش (*سعی می‌کنم*).
  fa.a2.unit33.lesson06.teach.turn05:
    title: سارا می‌پرسد چرا زنگ نزده
    gloss: 'سارا: پس چرا دیروز زنگ نزدی؟'
    note: پرسش از شکل «تو» با *-ی* استفاده می‌کند.
  fa.a2.unit33.lesson06.teach.turn06:
    title: نیما اعتراف می‌کند که فراموش کرده
    gloss: 'نیما: ببخش، یادم رفت زنگ بزنم.'
    note: '*یادم رفت* با شکل *ب-*.'
