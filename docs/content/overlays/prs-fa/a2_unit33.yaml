    feedback: '*شیرینی رو ترک کردم* نمونهٔ درست است: مفعول معین *رو* می‌گیرد.'
  fa.a2.unit33.lesson02.exercise01.recognize_tried_early:
    instruction: این جمله چه معنا دارد؟
    correct_option: تلاش کردم زود بیدار شوم.
    distractors:
    - یادم رفت زود بیدار شوم.
    - شروع کردم زود بیدار شدن.
    - دیگر زود بیدار نمی‌شوم.
    accepted_answers:
