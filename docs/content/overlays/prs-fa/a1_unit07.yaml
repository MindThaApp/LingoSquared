teaching:
  fa.a1.unit07.lesson01.teach.sunny:
    title: آفتابی
    gloss: آفتابی
    note: آفتابی هوای آفتابی را توصیف می‌کند.
    example_gloss: امروز هوا آفتابی است.
  fa.a1.unit07.lesson01.teach.rainy:
    title: بارانی
    gloss: بارانی
    note: بارونی شکل گفتاری و روزمرهٔ بارانی است.
    example_gloss: فردا هوا بارانی می‌باشد.
  fa.a1.unit07.lesson01.teach.cloudy:
    title: ابری
    gloss: ابری
    note: ابری هوای ابری را توصیف می‌کند.
    example_gloss: هوا ابری است.
  fa.a1.unit07.lesson01.teach.snowy:
    title: برفی
    gloss: برفی
    note: برفی هوای برفی را توصیف می‌کند.
    example_gloss: در زمستان هوا برفی می‌باشد.
  fa.a1.unit07.lesson01.teach.or_word:
    title: یا
    gloss: یا
    note: یا دو حالت متفاوت هوا را به هم وصل می‌کند.
    target_text: یا (or)
  fa.a1.unit07.lesson02.teach.hot:
    title: گرم
    gloss: گرم
    note: گرم هوا یا درجهٔ حرارت گرم را به‌طور کلی توصیف می‌کند.
    example_gloss: امروز هوا گرم است.
  fa.a1.unit07.lesson02.teach.cold:
    title: سرد
    gloss: سرد
    note: سرد هوا یا درجهٔ حرارت سرد را به‌طور کلی توصیف می‌کند.
    example_gloss: در زمستان هوا سرد است.
  fa.a1.unit07.lesson02.teach.cool:
    title: خنک
    gloss: خنک
    note: خنک هوای ملایم و خنک را توصیف می‌کند، میان گرم و سرد.
    example_gloss: شام‌ها هوا خنک است.
  fa.a1.unit07.lesson03.teach.weather_word:
    title: هوا
    gloss: هوا
    note: هوا کلمهٔ عمومی برای وضع هواست (به معنی هوا در فضا هم می‌آید).
    example_gloss: امروز هوا چطور است؟
  fa.a1.unit07.lesson03.teach.weather_question:
    title: پرسیدن از وضع هوا
    gloss: هوا چطور است؟
    note: هوا چطوره؟ همان کلمهٔ پرسشی گفتاری چطوره را دارد که در حالتون چطوره؟ در بخش ۱ دیده‌اید.
  fa.a1.unit07.lesson03.teach.today_word:
    title: امروز
    gloss: امروز
    note: امروز روز جاری را می‌رساند.
    example_gloss: امروز هوا خوب است.
  fa.a1.unit07.lesson03.teach.tomorrow_word:
    title: فردا
    gloss: فردا
    note: فردا روز بعد را می‌رساند.
    example_gloss: فردا می‌بینمت.
  fa.a1.unit07.lesson04.teach.today_sunny:
    title: بگویید که امروز هوا آفتابی است
    gloss: امروز هوا آفتابی است.
    note: امروز هوا آفتابیه از شکل کوتاه گفتاری -ه استفاده می‌کند (آفتابیه = آفتابی است) که در این کورس قبلاً آمده است.
  fa.a1.unit07.lesson04.teach.today_cold:
    title: بگویید که امروز سرد است
    gloss: امروز هوا سرد است.
    note: امروز سرده همین الگوی کوتاه‌شده را دارد.
  fa.a1.unit07.lesson04.teach.contraction_note:
    title: شکل کوتاه گفتاری -ه
    gloss: آفتابیه شکل کوتاه گفتاری و روزمرهٔ آفتابی است است.
    note: 'همین الگو (صفت + ه) برای هر کلمهٔ هوا به کار می‌رود: سرده، گرمه، بارونیه، ابریه، برفیه.'
  fa.a1.unit07.lesson04.teach.today_rainy:
    title: بگویید که امروز هوا بارانی است
    gloss: امروز هوا بارانی است.
    note: امروز بارونیه همین شکل کوتاه -ه را برای بارونی به کار می‌برد.
  fa.a1.unit07.lesson05.teach.because_word:
    title: چون / زیرا
    gloss: چون / زیرا
    note: «چون» دلیلِ یک پیشنهاد را معرفی می‌کند.
    example_gloss: کوت پوشیده‌ام چون سرد است.
  fa.a1.unit07.lesson05.teach.better_to:
    title: پیشنهاد آوردن چتری
    gloss: بهتر است چتری با خود ببریم.
    note: «بهتره چتر ببریم» از شکل محاوره‌ای «بهتره» (بهتر است) برای یک پیشنهاد نرم استفاده می‌کند.
  fa.a1.unit07.lesson05.teach.full_suggestion:
    title: ترکیب دلیل و پیشنهاد
    gloss: چون باران می‌بارد، بهتر است چتری با خود ببریم.
    note: «چون بارونیه، بهتره چتر ببریم» یک دلیلِ مربوط به هوا را با یک پیشنهاد وصل می‌کند.
  fa.a1.unit07.lesson05.teach.coat_suggestion:
    title: پیشنهاد پوشیدن کوت
    gloss: چون سرد است، بهتر است کوت بپوشیم.
    note: «چون سرده، بهتره کت بپوشیم» از همان الگوی دلیل + پیشنهاد پیروی می‌کند، این بار برای هوای سرد.
  fa.a1.unit07.lesson06.teach.coat_review:
    title: پیشنهاد پوشیدن کوت
    gloss: بهتر است کوت بپوشیم
    note: «کت بپوشیم» از همان الگوی «بهتره» + فعل مثل «چتر ببریم» پیروی می‌کند، این بار برای هوای سرد.
    example_gloss: هوا سرد است، کوت بپوشیم.
  fa.a1.unit07.lesson06.teach.turn01:
    title: سارا درباره هوای امروز می‌پرسد
    gloss: سارا می‌پرسد که هوای امروز چطور است.
    note: «هوا چطوره؟» همان پرسش درس سوم را دوباره به کار می‌برد.
  fa.a1.unit07.lesson06.teach.turn02:
    title: رضا می‌گوید باران می‌بارد
    gloss: رضا می‌گوید فکر می‌کند باران می‌بارد.
    note: «فکر کنم» (گمان می‌کنم) سخن را نرم‌تر می‌سازد، چون رضا حدس می‌زند و مطمئن نیست.
  fa.a1.unit07.lesson06.teach.turn03:
    title: سارا پیشنهاد می‌کند چتر ببرند
    gloss: سارا می‌گوید پس بهتر است چتری با خود ببرند.
    note: «پس» حقیقتِ مربوط به هوا را به پیشنهاد وصل می‌کند.
  fa.a1.unit07.lesson06.teach.turn04:
    title: رضا موافقت می‌کند و درباره فردا می‌پرسد
    gloss: رضا موافقت می‌کند و می‌پرسد فردا چطور است.
    note: «فردا چی؟» راه طبیعی و کوتاه برای پرسیدن درباره روز بعد است.
  fa.a1.unit07.lesson06.teach.turn05:
    title: سارا هوای فردا را توصیف می‌کند
    gloss: سارا می‌گوید فردا آفتابی و گرم است.
    note: «آفتابیه و گرمه» دو شکل کوتاه‌شدهٔ هوا را با «و» وصل می‌کند.
  fa.a1.unit07.lesson06.teach.turn06:
    title: رضا پیشنهاد می‌کند به پارک بروند
    gloss: رضا می‌گوید عالی است، پس برویم پارک.
    note: «عالیه» (عالی است) پیش از پیشنهادِ برنامه، واکنش مثبت نشان می‌دهد.
  fa.a1.unit07.lesson06.teach.turn07:
    title: سارا موافقت می‌کند و خداحافظی می‌کند
    gloss: سارا موافقت می‌کند و می‌گوید فردا او را می‌بیند.
    note: «باشه» (باشد) راه محاوره‌ای و رایج برای موافقت با یک برنامه است.
