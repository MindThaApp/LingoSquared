teaching:
  fa.a2.unit36.lesson01.teach.going:
    title: رفتن به جاها
    gloss: رفتم، می‌روم، دیروز، امروز
    note: '*رفتم* ماضی ساده است (من رفتم)؛ *می‌رم* حالِ گفتاری است (می‌روم / می‌روم).'
    example_gloss:
    - دیروز من به بازار رفتم.
    - امروز به بانک می‌روم.
  fa.a2.unit36.lesson01.teach.places:
    title: جاهای کار روزمره
    gloss: بانک، پوستخانه، بازار
    note: فارسی گفتاری می‌گوید *رفتم بانک* بدون حرف اضافه برای «به».
    example_gloss:
    - دیروز به بانک رفتم.
    - امروز به پوستخانه می‌روم.
    - دیروز من به بازار رفتم.
  fa.a2.unit36.lesson01.teach.things:
    title: چیزهای کار روزمره
    gloss: پول، بسته، نامه، کتاب، یک
    note: '*یه* شکل عادی گفتاری «یک» است.'
    example_gloss:
    - من پول دارم.
    - من یک بسته دارم.
    - یک نامه دارم.
    - من یک کتاب دارم.
  fa.a2.unit36.lesson01.teach.connectors:
    title: دو راه برای گفتن «برای اینکه»
    gloss: برای اینکه / تا، تا / که (کوتاه، گفتاری)
    note: '*برای اینکه* پیوند کامل است؛ *تا* کوتاه‌تر و در گفتار بسیار رایج است. بعد از هر دو همان شکل فعل می‌آید.'
    example_gloss:
    - به بانک رفتم برای اینکه پول بگیرم.
    - به بانک رفتم تا پول بگیرم.
  fa.a2.unit36.lesson01.teach.purpose_verbs:
    title: فعل‌های هدف
    gloss: (تا) بگیرم، (تا) بخرم، (تا) بفرستم
    note: این پایان‌ها (*بـ* + ریشه + *م*) التزامی اند. آنها هدفی را نشان می‌دهند که هنوز اتفاق نیفتاده است.
    example_gloss:
    - به بانک رفتم تا پول بگیرم.
    - به بازار رفتم تا یک کتاب بخرم.
    - به پوستخانه رفتم تا یک نامه بفرستم.
  fa.a2.unit36.lesson01.teach.post_items:
    title: پُست و اسناد سفر
    gloss: پاکت، تمبر، پاسپورت، مدارک
    note: '*پاکت* و *تمبر* در پوستخانه به کار می‌آیند؛ *پاسپورت* و *مدارک* چیزهایی اند که پیش از سفر آماده می‌شوند.'
    example_gloss:
    - من یک پاکت و یک تمبر دارم.
    - پاسپورت و مدارکم را دارم.
  fa.a2.unit36.lesson01.teach.travel_items:
    title: آماده‌گی برای سفر
    gloss: چمدان، پول خارجی، فهرست، مقصد
    note: '*چمدون* شکل روزمرهٔ گفتاری چمدان است. *مقصد* جایی است که قصد دارید به آن برسید.'
    example_gloss:
    - من یک چمدان دارم.
    - من پول خارجی و یک فهرست دارم.
    - رفتن به مقصد.
  fa.a2.unit36.lesson01.teach.purpose_clause:
    title: برای اینکه + التزامی
    gloss: به بانک رفتم تا پول بگیرم
    note: 'اول بگویید چه کردید، بعد *برای اینکه*، بعد هدف را با التزامی: *رفتم بانک برای اینکه پول بگیرم*. فعلِ هدف گذشته را نشان نمی‌دهد: به سوی هدف اشاره می‌کند.'
  fa.a2.unit36.lesson02.teach.learning_words:
    title: کلمه‌های یاد گرفتن
    gloss: کلاس، انگلیسی، (تا) یاد بگیرم، (تا) حرف بزنم
    note: '*یاد بگیرم* و *حرف بزنم* فعل‌های دوبخشی استند؛ *بـ* التزامی روی بخش فعلی می‌آید (*بگیرم*، *بزنم*).'
    example_gloss:
    - من برای اینکه انگلیسی یاد بگیرم، به صنف می‌روم.
    - من کتاب می‌خوانم تا بتوانم انگلیسی صحبت کنم.
  fa.a2.unit36.lesson02.teach.saving_words:
    title: جمع کردن پول و خواندن
    gloss: پول جمع می‌کنم، موتر، (که) بخوانم
    note: '*پول جمع می‌کنم* عبارت معمول برای جمع کردن پول است. *جمع کنم* شکل التزامی آن است.'
    example_gloss:
    - پول جمع می‌کنم تا یک موتر بخرم.
    - من کتاب می‌خوانم تا انگلیسی یاد بگیرم.
  fa.a2.unit36.lesson02.teach.subjunctive_shape:
    title: ساختن شکل التزامی
    gloss: می‌گیرم، تا بگیرم؛ می‌خرم، تا بخرم
    note: '*می‌* را بیندازید و *بـ* را پیش از ریشهٔ فعل بگذارید: *می‌گیرم* می‌شود *بگیرم*، *می‌خرم* می‌شود *بخرم*. با *کردن* معمولاً *بـ* نمی‌آید: *جمع می‌کنم* می‌شود *جمع کنم*. شناسه‌ها همان می‌مانند (*-م* برای «من»).'
  fa.a2.unit36.lesson02.teach.ta_connector:
    title: تا + التزامی (و تا بتونم)
    gloss: تا پول بگیرم؛ تا بتوانم انگلیسی صحبت کنم
    note: '*تا* مثل *برای اینکه* کار می‌کند: *رفتم بانک تا پول بگیرم*. وقتی هدف توانستن کاری باشد، *تا بتونم* («تا بتوانم») را به کار ببرید؛ *بتونم* خودش التزامی است و فعل بعدی هم التزامی می‌آید.'
  fa.a2.unit36.lesson02.teach.baraye_noun:
    title: برای + اسم یا اسم فعل
    gloss: برای خرید؛ برای فرستادن یک نامه
    note: بعد از *برای* می‌توانید یک اسم ساده (*خرید*) یا اسم فعل با *-ن* (*فرستادن*) بیاورید. در این حالت نه التزامی می‌آید و نه *اینکه*.
  fa.a2.unit36.lesson03.teach.reason_words:
    title: کلمه‌های دلیل
    gloss: چون، چرا، چه، ضرورت داشتم، دوست دارم
    note: '*چون* دلیل را می‌رساند. *لازم داشتم* («ضرورت داشتم») و *دوست دارم* فعل‌های معمولی استند، التزامی نیستند.'
    example_gloss:
    - به بانک رفتم چون پول ضرورت داشتم.
    - من به صنف می‌روم چون انگلیسی را دوست دارم.
  fa.a2.unit36.lesson03.teach.reason_vs_purpose:
    title: دلیل (چون) در برابر هدف (تا)
    gloss: چون پول ضرورت داشتم / تا پول بگیرم
    note: '*چون* به علت گذشته نگاه می‌کند و فعل معمولی می‌آورد: *چون پول لازم داشتم*. *تا* و *برای اینکه* به هدف آینده نگاه می‌کنند و التزامی می‌آورند: *تا پول بگیرم*.'
  fa.a2.unit36.lesson03.teach.which_verb_form:
    title: با فعل تفاوت را بفهمید
    gloss: چون پول ضرورت داشتم / برای اینکه پول بگیرم
    note: اگر جمله زمان معمولی داشته باشد (*داشتم*، *دارم*)، حرف ربط *چون* است. اگر التزامی داشته باشد (*بگیرم*، *بخرم*)، حرف ربط *برای اینکه* یا *تا* است.
  fa.a2.unit36.lesson04.teach.purpose_questions:
    title: پرسیدن برای چه
    gloss: برای چه به بانک رفتی؟ برای چه پول می‌خواهی؟ برای چه به صنف می‌روی؟
    note: '*برای چی؟* دربارهٔ هدف می‌پرسد. جواب، هدفی است با *تا* یا *برای اینکه*.'
  fa.a2.unit36.lesson04.teach.answer_pattern:
    title: سوال و جواب
    gloss: برای چه به بانک رفتی؟ رفتم تا پول بگیرم.
    note: به *برای چی؟* با کار + *تا* یا *برای اینکه* + التزامی جواب بدهید. جواب کوتاه، فقط *تا پول بگیرم*، هم طبیعی است.
  fa.a2.unit36.lesson05.teach.reading:
    title: یک روز کارهای بیرون
    gloss: امروز کار داشتم. اول به بانک رفتم تا پول بگیرم. بعد به پوسته‌خانه رفتم برای فرستادن یک نامه. آخر به بازار رفتم برای خرید. من پول جمع می‌کنم تا موتر بخرم.
    note: یک بار بخوانید تا سه کار را بفهمید، بعد دوباره بخوانید تا هدف هر کدام را پیدا کنید.
  fa.a2.unit36.lesson06.teach.turn01:
    title: سارا می‌پرسد نیما چرا دیر آمده
    gloss: 'سارا می‌پرسد: نیما، چرا دیر آمدی؟'
    note: '*چرا* دلیل را می‌پرسد.'
  fa.a2.unit36.lesson06.teach.turn02:
    title: نیما دلیل می‌دهد
    gloss: 'نیما: چون بانک شلوغ بود.'
    note: '*چون* + فعل ماضی معمولی دلیل را می‌رساند.'
  fa.a2.unit36.lesson06.teach.turn03:
    title: سارا می‌پرسد برای چه
    gloss: 'سارا: برای چه به بانک رفتی؟'
    note: حالا *برای چی* دربارهٔ هدف می‌پرسد.
  fa.a2.unit36.lesson06.teach.turn04:
    title: دو کار با هدف‌هایشان
    gloss: 'نیما: به بانک رفتم تا پول بگیرم. بعد به پوسته‌خانه رفتم برای فرستادن یک بسته.'
    note: یک هدف با *تا* + التزامی آمده و دیگری با *برای* + اسم فعل.
  fa.a2.unit36.lesson06.teach.turn05:
    title: سارا دربارهٔ پول می‌پرسد
    gloss: 'سارا: پول را برای چه می‌خواهی؟'
    note: یک سوال دیگر با *برای چی* دربارهٔ هدف.
  fa.a2.unit36.lesson06.teach.turn06:
    title: نیما هدف را می‌گوید
    gloss: 'نیما: پول جمع می‌کنم تا موتر بخرم.'
    note: '*تا ماشین بخرم* هدف را می‌گوید.'
