  description: 'فارسی ایرانی سطح پیش‌متوسط با ستون فقرات دستوری: بانک، نظرها، وقت ملاقات و بیشتر؛ حالا گفتن این‌که چه کار می‌کنید: پلان‌های نزدیک، قصد، شاید و حتماً.'
units:
