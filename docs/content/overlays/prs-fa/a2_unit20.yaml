teaching:
  fa.a2.unit20.lesson01.teach.holiday:
    title: رخصتی، تابستان
    gloss: رخصتی، تابستان
    note: در گفتار *تابستون* شکل معمول *تابستان* است. *تعطیلات* جمع به نظر می‌رسد، اما کلمهٔ عادی برای «یک رخصتی» است.
    example_gloss:
    - در تابستان رخصتی دارم.
    - رخصتی عالی است.
  fa.a2.unit20.lesson01.teach.when:
    title: هفتهٔ آینده، سال آینده، مرداد
    gloss: هفتهٔ آینده، سال آینده، مرداد
    note: '*بعد* بعد از کلمهٔ زمان یعنی «آینده»: *هفته‌ی بعد*، *سال بعد*. *مرداد* ماه ایرانی است که بیشتر با اسد برابر می‌افتد.'
    example_gloss:
    - هفتهٔ آینده وقت ملاقات دارم.
    - سال آینده به اصفهان می‌روم.
    - در مرداد رخصتی دارم.
  fa.a2.unit20.lesson01.teach.travel_verbs:
    title: سفر کردن، رزرو کردن
    gloss: سفر کردن، رزرو کردن
    note: 'هر دو اسم + *کردن* اند: *سفر* + *کردن* = سفر کردن؛ *رزرو* + *کردن* = رزرو کردن. در زمان حال *می‌* بالای *کردن* می‌آید: *سفر می‌کنم*، *رزرو می‌کنم*.'
    example_gloss:
    - هفتهٔ آینده سفر می‌کنم.
    - هوتل رزرو می‌کنم.
  fa.a2.unit20.lesson01.teach.north:
    title: شمال، هوتل
    gloss: شمال (ساحل بحر خزر)، هوتل
    note: 'ایرانی‌ها *شمال* را برای ساحل بحر خزر هم می‌گویند، منطقهٔ معمول رخصتی تابستانی: *می‌رم شمال* = «برای رخصتی به شمال می‌روم».'
    example_gloss:
    - در تابستان به شمال می‌روم.
    - در شمال هوتل رزرو می‌کنم.
  fa.a2.unit20.lesson01.teach.sister_mom:
    title: با، خواهرم، مادرم، برادرم
    gloss: با، خواهرم، مادرم، برادرم
    note: 'پسوند *-م* یعنی «من/ام»: *خواهر* می‌شود *خواهرم*، *مامان* می‌شود *مامانم*، *برادر* می‌شود *برادرم*.'
    example_gloss:
    - با خواهرم به شمال می‌روم.
    - در خانهٔ مادرم می‌مانم.
    - با برادرم سفر می‌کنم.
  fa.a2.unit20.lesson01.teach.question:
    title: در تابستان چه می‌کنی؟
    gloss: در تابستان چه می‌کنی؟
    note: 'همان سؤالی که می‌پرسد «چه می‌کنی؟» می‌پرسد «چه خواهی کرد؟» هم: کلمهٔ زمان (*تابستون*) نشان می‌دهد که دربارهٔ آینده است.'
  fa.a2.unit20.lesson01.teach.present_for_plans:
    title: پلان‌های نزدیک با زمان حال
    gloss: در مرداد به شمال می‌روم، هوتل رزرو می‌کنم.
    note: 'فارسی در گفتار روزمره زمان آیندهٔ ساده ندارد. برای پلان‌های قطعی یا نزدیک، زمان حال را با *می‌* به کار ببرید و یک کلمهٔ زمان اضافه کنید: *مرداد می‌رم شمال* لفظاً «در مرداد شمال می‌روم» است و یعنی «در مرداد به شمال می‌روم». کلمهٔ زمان به شنونده می‌فهماند که صحبت از آینده است.'
  fa.a2.unit20.lesson02.teach.course_money:
    title: دوره، پول
    gloss: دوره، پول
    note: '*دوره* یک کورس یا سلسلهٔ درس‌هاست: *یه دوره‌ی زبان* (یک کورس زبان). *-ی* در *دوره‌ی* آن را به اسم بعدی وصل می‌کند.'
    example_gloss:
    - یک کورس زبان دارم.
    - هیچ پول ندارم.
  fa.a2.unit20.lesson02.teach.later:
    title: بعداً، یک ماه دیگر
    gloss: بعداً، یک ماه دیگر
    note: '*یه ماه دیگه* در اصل «یک ماه دیگر» است و به معنی «بعد از یک ماه» می‌آید. *بعدا* «بعداً» به شکل عمومی است.'
    example_gloss:
    - بعداً به شمال می‌روم.
    - یک ماه دیگر سفر می‌کنم.
  fa.a2.unit20.lesson02.teach.want_course:
    title: می‌خواهم یک دوره بگیرم.
    gloss: می‌خواهم یک دوره بگیرم. / قصد دارم یک دوره بگیرم.
    note: '*می‌خوام* (می‌خواهم) با فعل دوم به شکل کوتاه با *be-*: *بگیرم* (از *گرفتن*). هر دو فعل پسوند *-م* می‌گیرند: *می‌خوام بگیرم*. با *رفتن* همین ساختار می‌شود *می‌خوام برم*.'
  fa.a2.unit20.lesson02.teach.want_house:
    title: می‌خواهم خانه عوض کنم.
    gloss: می‌خواهم خانه عوض کنم. / قصد دارم خانه عوض کنم.
    note: '*خونه عوض کردن* یعنی خانه تبدیل کردن. در ساختار *می‌خوام* فعل به شکل *کنم* می‌آید: *می‌خوام خونه عوض کنم*.'
  fa.a2.unit20.lesson02.teach.want_save:
    title: می‌خواهم پول جمع کنم.
    gloss: می‌خواهم پول جمع کنم. / قصد دارم پول جمع کنم.
    note: '*پول جمع کردن* یعنی پس‌انداز کردن (در اصل «پول جمع کردن»). همان ساختار: *می‌خوام پول جمع کنم*.'
  fa.a2.unit20.lesson02.teach.qasd:
    title: قصد دارم یک دوره بگیرم.
    gloss: قصد دارم یک دوره بگیرم.
    note: '*قصد دارم* کمی رسمی‌تر از *می‌خوام* است، ولی بعد از آن همان فعل کوتاه می‌آید: *قصد دارم بگیرم*.'
  fa.a2.unit20.lesson02.teach.want_pattern:
    title: می‌خوام + فعل کوتاه
    gloss: می‌خواهم بروم، می‌خواهم بگیرم، می‌خواهم پس‌انداز کنم
    note: 'برای پلان‌هایی که دورتر اند یا آرزو اند، *می‌خوام* + فعل دوم به شکل کوتاه با *be-* را بگیرید: *برم* (بروم)، *بگیرم* (بگیرم)، *بخرم* (بخرم) و *کنم* (کنم، مثل *پول جمع کنم*). هر دو فعل پسوند یکسان دارند (برای «من» *-م*): *می‌خوام برم*. برای پلان‌های نزدیک و قطعی، حالت حال ساده را بگیرید: *فردا می‌رم*، ولی *سال بعد می‌خوام یه دوره بگیرم*.'
  fa.a2.unit20.lesson03.teach.maybe_certain:
    title: شاید، حتماً
    gloss: شاید، حتماً
    note: '*شاید* و *حتما* در آغاز جمله می‌آیند و نشان می‌دهند که چقدر مطمئن استید.'
    example_gloss:
    - شاید به سینما بروم.
    - حتماً می‌روم.
  fa.a2.unit20.lesson03.teach.this_year:
    title: امسال، این تابستان
    gloss: امسال، این تابستان
    note: '*این* پیش از واژهٔ زمان یعنی «این»: *این تابستون*. *امسال* یک کلمه برای «این سال» است.'
    example_gloss:
    - امسال در خانه می‌مانم.
    - این تابستان کار می‌کنم.
  fa.a2.unit20.lesson03.teach.maybe_rule:
    title: شاید با فعل کوتاه می‌آید
    gloss: شاید بروم، حتماً می‌روم
    note: 'بعد از *شاید* شکل کوتاه با *be-* (*برم*) می‌آید، چون پلان فقط یک احتمال است. بعد از *حتما* حال ساده (*می‌رم*) می‌آید، چون پلان قطعی است: *شاید برم سینما* ولی *حتما می‌رم سینما*.'
  fa.a2.unit20.lesson03.teach.not_want:
    title: نمی‌خواهم
    gloss: نمی‌خواهم
    note: '*نـ* را پیش از *می‌خوام* بگذارید تا بگویید نمی‌خواهید یا قصد ندارید: *نمی‌خوام برم*. برای پلان منفی ساده، حال را منفی کنید: *می‌رم* می‌شود *نمی‌رم*.'
    example_gloss:
    - نمی‌خواهم خانه عوض کنم.
    - امسال به شمال نمی‌روم.
    - این تابستان سفر نمی‌کنم.
  fa.a2.unit20.lesson03.teach.later_cinema:
    title: شاید بعداً به سینما بروم.
    gloss: شاید بعداً به سینما بروم.
    note: واژهٔ زمان *بعدا* می‌تواند میان *شاید* و فعل بیاید.
  fa.a2.unit20.lesson04.teach.q_words:
    title: کجا، با کی، چند هفته
    gloss: کجا، با کی، چند هفته
    note: '*با کی* در اصل «با کی» است: می‌پرسد با چه کسی می‌روید. *چند هفته* مدت را می‌پرسد (چند هفته).'
    example_gloss:
    - کجا می‌روی؟
    - با کی می‌روی؟
    - چند هفته می‌مانی؟
  fa.a2.unit20.lesson04.teach.q_where:
    title: کجا می‌روی؟
    gloss: کجا می‌روی؟
    note: 'اول کلمهٔ پرسشی می‌آید و فعل پسوند *-ی* (تو) می‌گیرد: *می‌ری* (می‌روی).'
  fa.a2.unit20.lesson04.teach.q_who:
    title: با کی می‌روی؟
    gloss: با کی می‌روی؟
    note: 'جواب را با *با* + شخص + فعل بدهید: *با خواهرم می‌رم*.'
  fa.a2.unit20.lesson04.teach.q_howlong:
    title: چند هفته می‌مانی؟
    gloss: چند هفته می‌مانی؟
    note: '*می‌مونی* شکل *تو* در فعل *می‌مونم* است (من می‌مانم).'
  fa.a2.unit20.lesson04.teach.durations:
    title: یک هفته، دو هفته، دو روز
    gloss: یک هفته، دو هفته، دو روز
    note: 'بعد از عدد، اسم مفرد می‌ماند: *دو هفته*، *دو روز*. *یه هفته* شکل گفتاری «یک هفته» است.'
    example_gloss:
    - یک هفته می‌مانم.
    - دو هفته سفر می‌کنم.
    - دو روز آنجا می‌مانم.
  fa.a2.unit20.lesson04.teach.you_forms:
    title: تو می‌خواهی، تو کنی (شکل کوتاه)
    gloss: تو می‌خواهی، تو کنی (شکل کوتاه)
    note: '*می‌خوای* شکل *تو* در فعل *می‌خوام* است؛ فعل کوتاهی که بعد از آن می‌آید هم ختم *تو* را می‌گیرد: *کنی* (از *کنم*)، *بری* (از *برم*).'
    example_gloss:
    - چه کار کنی؟ چه کار می‌خواهی بکنی؟
    - می‌خواهی بروی؟
  fa.a2.unit20.lesson04.teach.answer_pair:
    title: تو می‌روی / من می‌روم
    gloss: می‌روی؟ می‌روم.
    note: در سؤال ختم *تو* یعنی *-ی* می‌آید (*می‌ری*، *می‌مونی*، *می‌کنی*)؛ در جواب ختم *من* یعنی *-م* می‌آید (*می‌رم*، *می‌مونم*، *می‌کنم*). زمان و فعل تغییر نمی‌کنند.
  fa.a2.unit20.lesson05.teach.spot_plans:
    title: نوع پلان را تشخیص دهید
    gloss: می‌روم، می‌خواهم، شاید بروم
    note: 'وقتی می‌خوانید، توجه کنید که هر پلان چقدر قطعی است: حال ساده با *می‌* (*می‌رم*) قطعی است، *می‌خوام* یک قصد است و *شاید* فقط یک احتمال است.'
  fa.a2.unit20.lesson05.teach.reading_message:
    title: پیامی دربارهٔ رخصتی
    gloss: سلام! در تابستان رخصتی دارم. در ماه اسد با خواهرم به شمال می‌روم. یک هفته در هوتل می‌مانیم. بعد از آن دو روز به خانهٔ مادرم می‌روم. سال آینده می‌خواهم یک دوره بگیرم. شاید هم به اصفهان بروم.
    note: یک پیام کوتاه دربارهٔ پلان‌های تابستان. یک بار برای پلان‌ها بخوانید، بار دوم برای اینکه هر پلان چقدر قطعی است.
  fa.a2.unit20.lesson06.teach.names:
    title: سارا، نیما
    gloss: سارا، نیما
    note: آن دو دوست از درس‌های پیشین.
    example_gloss:
    - سارا در تیر کار می‌کند.
    - نیما در مرداد به ترکیه می‌رود.
  fa.a2.unit20.lesson06.teach.dlg1:
    title: سارا دربارهٔ رخصتی می‌پرسد
    gloss: سارا از نیما می‌پرسد که در رخصتی تابستان چه کار می‌کند.
    note: پرسش معمول دربارهٔ پلان رخصتی.
  fa.a2.unit20.lesson06.teach.dlg2:
    title: پلان نیما
    gloss: نیما می‌گوید در مرداد به ترکیه می‌رود و هوتل بوک می‌کند.
    note: دو پلان قطعی، هر دو در حال ساده با *می‌*.
  fa.a2.unit20.lesson06.teach.dlg3:
    title: سارا می‌پرسد با کی
    gloss: سارا می‌گوید چه خوب و می‌پرسد با کی می‌رود.
    note: '*با کی* می‌پرسد که با چه کسی می‌رود.'
  fa.a2.unit20.lesson06.teach.dlg4:
    title: با کی و چه مدت
    gloss: نیما می‌گوید با برادرش می‌رود و یک هفته آنجا می‌مانند.
    note: 'در جواب می‌شود فعل را نگفت: *با برادرم* کافی است.'
  fa.a2.unit20.lesson06.teach.dlg5:
    title: سارا دربارهٔ سال آینده می‌پرسد
    gloss: 'سارا می‌پرسد: سال آینده چه؟ می‌خواهی چه کار کنی؟'
    note: '*می‌خوای* شکل *تو* فعل *می‌خوام* است؛ *کنی* شکل کوتاه فعل با ختم *تو* است.'
  fa.a2.unit20.lesson06.teach.dlg6:
    title: قصد نیما
    gloss: 'نیما می‌گوید می‌خواهد یک دوره بگیرد و از سارا می‌پرسد: تو چه؟'
    note: یک قصد با *می‌خوام* و یک فعل کوتاه.
  fa.a2.unit20.lesson06.teach.dlg7:
    title: پلان‌های سارا
    gloss: سارا می‌گوید در تیر کار می‌کند و شاید بعد از آن به خانهٔ مادرش برود.
    note: یک پلان قطعی در حال ساده و یک احتمال با *شاید*.
  fa.a2.unit20.lesson06.teach.third_person:
    title: او می‌رود، می‌ماند، می‌کند، می‌خواهد
    gloss: او می‌رود، می‌ماند، می‌کند، می‌خواهد
    note: 'برای گفتن از نقشهٔ یک شخص دیگر، در زمان حال ختم *او* یعنی *-ه* می‌آید (*می‌ره*، *می‌مونه*، *می‌کنه*). *می‌خواد* شکل *او* در فعل *می‌خوام* است و فعل کوتاه بعد از آن هم به *-ه* ختم می‌شود: *می‌خواد بره*، *می‌خواد بگیره*.'
    example_gloss:
    - نیما می‌خواهد یک دوره بگیرد.
    - سارا می‌خواهد به خانهٔ مادرش برود.
exercises:
  fa.a2.unit20.lesson01.exercise01.recognize_holiday:
    instruction: این کلمه چه معنا دارد؟
    correct_option: رخصتی
    distractors:
    - وقت ملاقات
    - آخر هفته
    - تابستان
    accepted_answers:
    - value: رخصتی
      status: correct
    feedback: '*تعطیلات* یعنی رخصتی.'
  fa.a2.unit20.lesson01.exercise02.recognize_next_week_travel:
    instruction: کدام جمله با این جملهٔ فارسی مطابقت دارد؟
    correct_option: هفتهٔ آینده سفر می‌کنم.
    distractors:
    - هفتهٔ گذشته سفر کردم.
    - هفتهٔ آینده در خانه می‌مانم.
    - سال آینده سفر می‌کنم.
    accepted_answers:
    - value: هفتهٔ آینده سفر می‌کنم.
      status: correct
