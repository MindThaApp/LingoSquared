    title: 'متن: وقت آزاد نیما'
    gloss: نیما کتاب خواندن را دوست دارد. او هر هفته چندتا کتاب می‌خواند. گاهی فوتبال هم بازی می‌کند.
    note: '*چند تا* پیش از *کتاب* یعنی «چندتا کتاب»؛ *می‌خونه* و *می‌کنه* شکل‌های محاوره‌ای سوم شخص هستند که برای گفتن درباره‌ی کس دیگر استفاده می‌شوند.'
