    note: '*چیکار می‌کنی* پیشتر آمده بود — این‌جا برای پرسیدن درباره‌ی وقت آزاد دوباره استفاده شده است.'
  fa.a1.unit24.lesson05.teach.nima_review:
    title: نیما
    gloss: نیما
    note: '*نیما* که در درس ۱۱ به‌عنوان یک شخصیت معرفی شد، دوباره این‌جا آمده است.'
    example_gloss: نیما کتاب خواندن را دوست دارد.
  fa.a1.unit24.lesson05.teach.chand_ta_phrase:
    title: چند تا / چندتا
    gloss: چند تا
    note: '*چند* با شمارنده‌ی *تا* می‌آید و پیش از اسم قابل شمارش یعنی «چندتا» یا «چند عدد».'
  fa.a1.unit24.lesson05.teach.mikhone_word:
