    note: '*سرگرمی* یعنی کاری که آدم در وقت فراغت برای تفریح می‌کند.'
    example_gloss: کتاب خواندن یک سرگرمی است.
  fa.a1.unit24.lesson01.teach.ketab_khoondan_phrase:
    title: کتاب خواندن
    gloss: کتاب خواندن
    note: '*کتاب خوندن* در اصل «کتاب‌خوانی» است — *کتاب* پیشتر آمده بود و *خوندن* (خواندن) در این‌جا تازه است.'
  fa.a1.unit24.lesson01.teach.doost_daram_review:
    title: من ... دوست دارم
    gloss: دوست دارم
    note: '*دوست دارم* با یک کار هم مثل یک چیز استفاده می‌شود: *کتاب خوندن دوست دارم* یعنی «کتاب خواندن را دوست دارم.»'
  fa.a1.unit24.lesson02.teach.musiqi_review:
    title: موسیقی
    gloss: موسیقی
    note: '*موسیقی* دوباره این‌جا آمده است.'
    example_gloss: من موسیقی گوش می‌دهم.
  fa.a1.unit24.lesson02.teach.goosh_midam_phrase:
    title: گوش می‌دهم
    gloss: گوش می‌دهم
    note: '*گوش می‌دم* در اصل یعنی «گوش می‌دهم» — راه طبیعی گفتن همین مفهوم در فارسی ایران.'
  fa.a1.unit24.lesson02.teach.film_review:
    title: فلم
    gloss: فلم
    note: '*فیلم* دوباره این‌جا آمده است.'
    example_gloss: من فلم تماشا می‌کنم.
  fa.a1.unit24.lesson02.teach.mibinam_word:
    title: می‌بینم / تماشا می‌کنم
    gloss: می‌بینم / تماشا می‌کنم
    note: '*می‌بینم* شکل زمان حال همان فعلی است که زمان گذشته‌اش (*دیدم*) پیشتر آمده بود.'
  fa.a1.unit24.lesson03.teach.varzesh_word:
    title: ورزش
    gloss: ورزش
    note: '*ورزش* هم معنی «ورزش» را دارد و هم کارهای بدنی عمومی را.'
    example_gloss: من ورزش می‌کنم.
  fa.a1.unit24.lesson03.teach.mikonam_review:
    title: می‌کنم
    gloss: می‌کنم
    note: '*می‌کنم* فعل عمومی «انجام می‌دهم» است و در فعل‌های مرکب مثل *ورزش می‌کنم* می‌آید.'
  fa.a1.unit24.lesson03.teach.footbal_word:
    title: فوتبال
    gloss: فوتبال
    note: '*فوتبال* یعنی همان بازی با توپ که با پا بازی می‌شود.'
    example_gloss: من فوتبال را دوست دارم.
  fa.a1.unit24.lesson03.teach.bazi_phrase:
    title: من فوتبال بازی می‌کنم
    gloss: فوتبال بازی می‌کنم
    note: '*بازی* یعنی بازی کردن — *فوتبال بازی می‌کنم* در اصل «بازیِ فوتبال می‌کنم» است.'
  fa.a1.unit24.lesson04.teach.hafte_word:
    title: هفته
    gloss: هفته
    note: '*هفته* یعنی هفت روز.'
    example_gloss: هر هفته ورزش می‌کنم.
  fa.a1.unit24.lesson04.teach.har_hafte_phrase:
    title: هر هفته
    gloss: هر هفته
    note: '*هر* به همین شکل با *هفته* می‌آید و *هر هفته* (هر هفته) می‌سازد.'
  fa.a1.unit24.lesson04.teach.gahi_word:
