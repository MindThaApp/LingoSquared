  fa.a1.unit24.lesson06.teach.che_khoob_phrase:
    title: چه خوب!
    gloss: چه خوب!
    note: '*چه خوب!* پیشتر آمده بود — یک واکنش مثبت و رایج، مثل «عالی است!»'
  fa.a1.unit24.lesson06.teach.dialogue_line1:
    title: 'نیما: سارا، در وقت آزاد چه می‌کنی؟'
    gloss: سارا، در وقت آزاد چه می‌کنی؟
  fa.a1.unit24.lesson06.teach.dialogue_line2:
    title: 'سارا: من فلم دیدن را دوست دارم...'
    gloss: من فلم دیدن را دوست دارم. هر هفته به سینما می‌روم. تو چطور؟
  fa.a1.unit24.lesson06.teach.dialogue_line3:
    title: 'نیما: من کتاب خواندن را دوست دارم...'
    gloss: من کتاب خواندن را دوست دارم. گاهی فوتبال هم بازی می‌کنم.
  fa.a1.unit24.lesson06.teach.dialogue_line4:
    title: 'سارا: چه خوب!'
    gloss: چه خوب!
