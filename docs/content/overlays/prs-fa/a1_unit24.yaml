course:
  title: فارسی ایران A1
  description: 'فارسیِ ایران برای مبتدیان: نام بردن مفهوم سرگرمی و وقت فراغت، چهار فعالیت روزمره (کتاب خواندن، گوش دادن به موسیقی، تماشای فلم، ورزش و فوتبال)، گفتن اینکه هر چند وقت یک بار این کارها را می‌کنید، پرسیدن از کسی که در وقت فراغتش چه می‌کند، یک متن کوتاه درباره‌ی سرگرمی‌های نیما و یک گفتگوی پایانی بین نیما و سارا.'
