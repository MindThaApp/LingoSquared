teaching:
  fa.a2.unit42.lesson01.teach.clothes:
    title: لباس و کیف
    gloss: پیراهن، بوت، کیف، پتلون، پالتو
    note: '*کفش* یعنی «بوت» (یک کلمه برای هر دو لنگه).'
    example_gloss:
    - من یک پیراهن دارم.
    - من یک جوره بوت دارم.
    - من یک کیف دارم.
    - من یک پتلون دارم.
    - من یک پالتو دارم.
  fa.a2.unit42.lesson01.teach.colours:
    title: رنگ‌ها
    gloss: سفید، سیاه، سرخ، آبی، سبز
    note: رنگ‌ها صفت اند و بعد از اسم می‌آیند.
    example_gloss:
    - پیراهن من سفید است.
    - کیف من سیاه است.
    - بوت‌های من سرخ اند.
    - پتلون من آبی است.
    - پالتوی من سبز است.
  fa.a2.unit42.lesson01.teach.size_age:
    title: بزرگ، کوچک، نو، کهنه
    gloss: بزرگ، کوچک، نو، کهنه
    note: '*نو* و *قدیمی* نشان می‌دهند که چیزی چقدر نو یا کهنه است.'
    example_gloss:
    - کیف من بزرگ است.
    - بوت‌های من کوچک اند.
    - پالتوی من نو نیست.
    - پیراهن من کهنه است.
  fa.a2.unit42.lesson01.teach.ezafe:
    title: 'اسم + صفت: صدای پیوندی'
    gloss: یک کیف سرخ؛ یک پیراهن سفید؛ بوت‌های نو
    note: 'در فارسی ایران صفت بعد از اسم می‌آید. وقتی صحبت می‌کنید، یک مصوت پیوندی کوتاه *-e* (اضافه) آن‌ها را وصل می‌کند: *کیف قرمز* «kif-e qermez» خوانده می‌شود. بعد از صامت این مصوت نوشته نمی‌شود.'
  fa.a2.unit42.lesson02.teach.owners:
    title: مالکان
    gloss: سارا، نیما، کی، از کیست
    note: '*کیه؟* یعنی «این کیست؟» یا «از کیست؟».'
    example_gloss:
    - این کیف از کیست؟
    - این بوت‌ها از کیست؟
  fa.a2.unit42.lesson02.teach.owner_rule:
    title: اسم + مالک
    gloss: کیف سارا؛ بوت‌های نیما؛ پیراهن مدیر
    note: 'مالک بعد از چیز می‌آید و با همان *-e* پیوندی وصل می‌شود: *کیف سارا* «kif-e Sara» خوانده می‌شود. این ترتیب مانند دری افغانستان است: «کیف سارا».'
  fa.a2.unit42.lesson02.teach.whose:
    title: از کیست؟
    gloss: این کیف از کیست؟ کیف سارا.
    note: 'با *این ... کیه؟* بپرسید و با چیز و مالکش جواب بدهید. برای گفتن «از نیماست»، *است* را به نام وصل کنید: *این کفش نیماست*.'
  fa.a2.unit42.lesson03.teach.things:
    title: خانه و لباس
    gloss: خانه، پالتو، چوکی، میز
    note: '*خونه* به یک *ه* بی‌صدا ختم می‌شود؛ *پالتو* به مصوت *و* ختم می‌شود؛ *صندلی* به *ی* ختم می‌شود.'
    example_gloss:
    - خانه بزرگ است.
    - پالتو سیاه است.
    - چوکی اینجا است.
    - میز اون طرف است.
  fa.a2.unit42.lesson03.teach.rule_h:
    title: 'بعد از ه‌ی بی‌صدا: ه‌ی'
    gloss: خانهٔ بزرگ؛ خانهٔ نیما
    note: 'بعد از *ه*ی بی‌صدا، مصوت پیوندی به شکل *ی* با نیم‌فاصله نوشته می‌شود: *خونه‌ی بزرگ*، *خونه‌ی نیما*.'
  fa.a2.unit42.lesson03.teach.rule_v:
    title: بعد از و و ی
    gloss: پالتوی سیاه؛ پالتوی سارا؛ چوکی نیما
    note: 'بعد از *و* مصوت پیوندی به شکل *ی* نوشته می‌شود: *پالتوی سیاه*. بعد از *ی* «-ye» گفته می‌شود، ولی چیزی اضافه نوشته نمی‌شود: *صندلی نیما*.'
  fa.a2.unit42.lesson04.teach.materials:
    title: جنس‌ها و یک مبل
    gloss: چرمی، چوبی، مبل
    note: '*چرمی* یعنی «ساخته‌شده از چرم»، *چوبی* «ساخته‌شده از چوب».'
    example_gloss:
    - کیف من چرمی است.
    - میز چوبی است.
    - مبل اینجا است.
  fa.a2.unit42.lesson04.teach.chain1:
    title: اسم + صفت + مالک
    gloss: کیف سرخ سارا؛ پالتوی سیاه نیما؛ خانهٔ بزرگ نیما
    note: 'بعد از اسم می‌توانی کلمه‌ها را یکی پی دیگر اضافه کنی و هر کدام با مصوت پیوندی وصل می‌شوند. مالک در آخر می‌آید: *کیف قرمز سارا* (kif-e qermez-e Sara). مالک آخرین حلقهٔ زنجیر است.'
  fa.a2.unit42.lesson04.teach.chain2:
    title: اسم + دو صفت
    gloss: یک کیف چرمی سیاه؛ یک میز چوبی بزرگ؛ یک مبل نوی سرخ
    note: 'دو صفت هم از همین الگو پیروی می‌کنند. هر دو ترتیب دیده می‌شود؛ آوردن جنس پیش از رنگ یا اندازه کمی رایج‌تر است: *کیف چرمی سیاه*، *میز چوبی بزرگ*.'
  fa.a2.unit42.lesson05.teach.reading:
    title: یک کیف گم‌شده
    gloss: من کیفم را گم کردم. کیفم سرخ و چرمی و کوچک است. در کیف یک موبایل سیاه است. موبایل سیاهم کهنه است. در کیف یک عینک آبی هم است. عینک آبی از نیما است.
    note: یک بار برای کیف بخوانید، بعد دوباره برای چیزهایی که در آن است.
  fa.a2.unit42.lesson06.teach.turn01:
    title: فروشنده یک پالتو نشان می‌دهد
    gloss: 'فروشنده: ببخشید، این پالتوی سیاه از شما است؟'
    note: '*مال شماست* شکل مؤدبانهٔ «از شما است» است.'
  fa.a2.unit42.lesson06.teach.turn02:
    title: نیما پالتوی خودش را توضیح می‌دهد
    gloss: 'نیما: نه، پالتوی من آبی است. پالتوی آبی من بزرگ است.'
    note: '*پالتوی آبی من*: اسم + صفت + مالک.'
  fa.a2.unit42.lesson06.teach.turn03:
    title: فروشنده یک کیف پیشنهاد می‌کند
    gloss: 'فروشنده: پالتوی آبی بزرگ ندارم. این کیف چرمی سرخ چطور است؟'
    note: '*کیف قرمز چرمی*: اسم + رنگ + جنس (*کیف چرمی قرمز* هم درست است).'
  fa.a2.unit42.lesson06.teach.turn04:
    title: نیما مالک را می‌گوید
    gloss: 'نیما: آن کیف سارا است. کیف سارا سرخ است.'
    note: '*ساراست* شکل گفتاری *سارا است* است.'
