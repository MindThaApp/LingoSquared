teaching:
  fa.a2.unit41.lesson01.teach.phones:
    title: کلمه‌های موبایل
    gloss: موبایل، کمره، بیتری
    note: '*گوشی* کلمه‌ی عادی برای موبایل است.'
    example_gloss:
    - موبایل من کمره دارد.
    - این موبایل بیتری دارد.
    - این موبایل است.
  fa.a2.unit41.lesson01.teach.adjs:
    title: ارزان، گران، خوب، بد
    gloss: ارزان، گران، خوب، بد
    note: '*ارزون* و *گرون* شکل‌های معمول گفتاری اند.'
    example_gloss:
    - این موبایل ارزان است.
    - آن موبایل گران است.
    - این موبایل خوب است.
    - آن موبایل بد است.
  fa.a2.unit41.lesson01.teach.comparative:
    title: 'مرور صفت تفضیلی: -تر'
    gloss: ارزان‌تر، گران‌تر، بهتر، بدتر
    note: 'شما *-تر* را برای «بیشتر» می‌دانید: *ارزون‌تر*. *بهتر* و *بدتر* شکل‌های «خوب» و «بد» اند.'
  fa.a2.unit41.lesson01.teach.superlative:
    title: 'صفت عالی: -ترین پیش از اسم'
    gloss: ارزان‌ترین موبایل، گران‌ترین موبایل، بهترین موبایل، بدترین موبایل
    note: 'به صفت تفضیلی *-ین* اضافه کنید و آن را پیش از اسم بگذارید: *ارزون‌تر* می‌شود *ارزون‌ترین گوشی*. میان این دو کلمه اضافه (*ـِ*) نمی‌آید.'
  fa.a2.unit41.lesson02.teach.housing:
    title: کلمه‌های خانه
    gloss: آپارتمان، اتاق، خانه، ایستگاه
    note: '*خونه* شکل گفتاری *خانه* است.'
    example_gloss:
    - آپارتمان اینجاست.
    - اتاق آنجاست.
    - خانه اینجاست.
    - ایستگاه آنجاست.
  fa.a2.unit41.lesson02.teach.size:
    title: بزرگ، کوچک، نزدیک، دور، زیبا
    gloss: بزرگ، کوچک، نزدیک، دور، زیبا
    note: '*کوچیک* شکل معمول گفتاری *کوچک* است.'
    example_gloss:
    - آپارتمان بزرگ است.
    - اتاق کوچک است.
    - ایستگاه نزدیک است.
    - خانه دور است.
    - خانه زیبا است.
  fa.a2.unit41.lesson02.teach.forms:
    title: هر صفت + ترین
    gloss: بزرگ‌ترین آپارتمان؛ کوچک‌ترین اتاق؛ نزدیک‌ترین ایستگاه؛ زیباترین خانه
    note: 'الگو برای هر صفت یکی است: صفت + *‌ترین* (با فاصله‌ی کوچک، که با نیم‌فاصله نوشته می‌شود) پیش از اسم.'
  fa.a2.unit41.lesson02.teach.spoken:
    title: 'در گفتار: از همه + صفت تفضیلی'
    gloss: این آپارتمان از همه بزرگ‌تر است؛ این اتاق از همه کوچک‌تر است
    note: 'وقتی صفت عالی خبر جمله باشد، در گفتار اغلب «از همه بزرگ‌تر» می‌گویند: *از همه بزرگ‌تره*. معنایش «بزرگ‌ترین» است. صفت عالی می‌تواند خودش هم خبر باشد: *این بزرگ‌ترینه* («این بزرگ‌ترین است»).'
  fa.a2.unit41.lesson03.teach.holiday:
    title: کلمه‌های رخصتی
    gloss: هوتل، سفر، دریا، کوه
    note: '*سفر* یعنی مسافرت.'
    example_gloss:
    - هوتل اینجاست.
    - سفر خیلی خوب است.
    - دریا آنجاست.
    - کوه دور است.
  fa.a2.unit41.lesson03.teach.opinion:
    title: به نظر من، کدام
    gloss: به نظر من، کدام، کدام است
    note: '*به نظر من* برای گفتن نظر شما می‌آید. *کدومه؟* یعنی «کدام یک است؟».'
    example_gloss:
    - به نظر من این هوتل خوب است.
    - کدام هوتل؟
  fa.a2.unit41.lesson03.teach.choose:
    title: پرسیدن بهترین
    gloss: کدام هوتل از همه ارزان‌تر است؟ هوتل کوه از همه ارزان‌تر است.
    note: برای انتخاب یکی از میان سه گزینه، بپرسید *کدوم ... از همه ...؟* و با همین الگو جواب بدهید.
  fa.a2.unit41.lesson04.teach.asas:
    title: به اندازه‌ی ...
    gloss: به اندازه‌ی، نیست
    note: بعد از *به اندازه‌ی* چیزی می‌آید که با آن مقایسه می‌کنید.
    example_gloss:
    - این موبایل به اندازه‌ی آن موبایل ارزان است.
    - آن موبایل به اندازه‌ی این موبایل خوب نیست.
  fa.a2.unit41.lesson04.teach.asas_rule:
    title: برابر و نابرابر
    gloss: این خانه به اندازهٔ آن خانه کلان است؛ این اتاق به اندازهٔ آن اتاق کلان نیست
    note: '*به اندازه‌ی* + اسم + صفت می‌رساند که دو چیز برابر اند. برای «به اندازهٔ ... نیست» جمله را با *نیست* ختم کنید. در حالت مثبت، صفت فعل ربطی گفتاری می‌گیرد (*بزرگه* = *بزرگ* + *است*). در حالت منفی، فعل ربطی با *نیست* عوض می‌شود؛ پس می‌گویید *بزرگ نیست*، نه *بزرگه نیست*.'
  fa.a2.unit41.lesson05.teach.reading:
    title: سه آپارتمان
    gloss: می‌خواهم یک آپارتمان بگیرم. سه آپارتمان دیدم. آپارتمان اول ارزان‌ترین بود، اما از همه کوچک‌تر بود. آپارتمان دوم کلان‌ترین بود، اما بسیار دور بود. آپارتمان سوم به اندازهٔ آپارتمان دوم کلان نبود، اما نزدیک‌ترین بود. به نظر من آپارتمان سوم بهترین است.
    note: یک بار برای فهمیدن سه آپارتمان بخوانید، بار دوم برای کلمه‌هایی که به *-ترین* ختم می‌شوند.
  fa.a2.unit41.lesson06.teach.turn01:
    title: سارا می‌پرسد کدام گوشی بهتر است
    gloss: 'سارا: نیما، کدام گوشی بهتر است؟'
    note: '*بهتره* صفت تفضیلی «بهتر» است.'
  fa.a2.unit41.lesson06.teach.turn02:
    title: نیما نظرش را می‌گوید
    gloss: 'نیما: به نظر من این گوشی بهترین گوشی است.'
    note: '*بهترین گوشی*: صفت عالی پیش از اسم می‌آید.'
  fa.a2.unit41.lesson06.teach.turn03:
    title: سارا به قیمت اشاره می‌کند
    gloss: 'سارا: اما این گوشی از همه قیمت‌تر است.'
    note: '*از همه گرون‌تره* در گفتار یعنی «قیمت‌ترین».'
  fa.a2.unit41.lesson06.teach.turn04:
    title: نیما مقایسه می‌کند
    gloss: 'نیما: بلی. آن گوشی ارزان‌ترین است، اما به اندازهٔ این گوشی خوب نیست.'
    note: '*ارزون‌ترینه*: صفت عالی که در جای خبر آمده است.'
  fa.a2.unit41.lesson06.teach.turn05:
    title: سارا تصمیم می‌گیرد
    gloss: 'سارا: پس این را می‌خرم.'
    note: '*می‌خرم* در گفتار به معنی «خواهم خرید» هم می‌آید.'
