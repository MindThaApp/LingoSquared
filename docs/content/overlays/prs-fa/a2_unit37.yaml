      right: باران
    - left: برف
      right: برف
    - left: آفتابی
      right: آفتابی
    - left: سرد
      right: سرد
    - left: گرم
      right: گرم
    - left: پارک
      right: پارک
    - left: خونه
      right: خانه
    - left: بیرون
      right: بیرون
    - left: سینما
      right: سینما
    - left: فردا
      right: فردا
  fa.a2.unit37.lesson01.exercise04.order_snow_home:
    instruction: 'کلمه‌ها را طوری ترتیب کنید که معنی این جمله را بدهد: اگر برف ببارد، ما در خانه می‌مانیم.'
    accepted_answers:
    - value:
      - اگه
      - برف
      - بیاد
      - تو
      - خونه
      - می‌مونیم
      status: correct
    - value:
      - تو
      - خونه
      - می‌مونیم
      - اگه
      - برف
      - بیاد
      status: correct
    feedback: '*اگه برف بیاد، تو خونه می‌مونیم*: شرط اول می‌آید و نتیجه دوم؛ ترتیب را می‌شود برعکس هم کرد.'
  fa.a2.unit37.lesson01.exercise05.fill_rain_verb:
    instruction: 'شرط را با فعل شرطی (التزامی) «باران ببارد» (سوم شخص) کامل کنید: اگر باران ببارد، ما در خانه می‌مانیم.'
    accepted_answers:
    - value: بیاد
      status: correct
    feedback: 'جمله کامل این است: *اگه بارون بیاد، تو خونه می‌مونیم*.'
  fa.a2.unit37.lesson01.exercise06.translate_warm_outside:
    instruction: 'با اگه و باشه ترجمه کنید: اگر هوا گرم باشد، ما بیرون می‌رویم.'
    accepted_answers:
    - value: اگه هوا گرم باشه، می‌ریم بیرون
      status: correct
    - value: اگه هوا گرم باشه می‌ریم بیرون
      status: correct
    - value: می‌ریم بیرون اگه هوا گرم باشه
      status: acceptable_with_note
      note: نتیجه می‌تواند اول بیاید، اما معمولاً شرط اول می‌آید.
    feedback: 'نمونه: *اگه هوا گرم باشه، می‌ریم بیرون.*'
  fa.a2.unit37.lesson02.exercise01.recognize_time_condition:
    instruction: این جمله چه معنا دارد؟
    correct_option: اگر وقت داشته باشم، می‌آیم.
    distractors:
    - اگر شما وقت داشته باشید، من می‌آیم.
