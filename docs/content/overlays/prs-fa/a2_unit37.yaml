teaching:
  fa.a2.unit37.lesson01.teach.weather_words:
    title: کلمه‌های هوا
    gloss: هوا، باران، برف، آفتابی، سرد، گرم، فردا، امروز
    note: '*بارون* شکل عادی گفتاری «باران» است؛ در نوشتار دقیق *باران* نوشته می‌شود. در گفتار، *آفتابیه*، *سرده* و *گرمه* با *-ه* به معنی «است» ختم می‌شوند.'
    example_gloss:
    - فردا هوا آفتابی است.
    - امروز هوا سرد است.
    - هوا گرم است.
  fa.a2.unit37.lesson01.teach.plan_words:
    title: جاها و فعل‌های پلان
    gloss: پارک، خانه، بازار، سینما، بیرون، در، می‌رویم، نمی‌رویم، می‌مانیم
    note: 'برای پلان‌ها زمان حال استفاده می‌شود: *می‌ریم* یعنی «می‌رویم» یا «می‌رویم (پلان داریم)» و *نمی‌ریم* یعنی «نمی‌رویم».'
    example_gloss:
    - فردا ما به پارک می‌رویم.
    - ما در خانه می‌مانیم.
    - امروز ما بیرون نمی‌رویم.
  fa.a2.unit37.lesson01.teach.if_words:
    title: اگه و فعل‌های شرط
    gloss: اگر، بیاید (باران بیاید)، باشد، می‌آید (حال)
    note: '*اگه* شکل گفتاری *اگر* است. *بارون بیاد* لفظاً «باران بیاید» است و فارسی ایرانی همین‌طور «باران می‌آید» را بیان می‌کند.'
    example_gloss:
    - اگر برف ببارد، ما بیرون نمی‌رویم.
    - اگر هوا سرد باشد، ما به پارک نمی‌رویم.
  fa.a2.unit37.lesson01.teach.subjunctive_condition:
    title: اگه به‌علاوهٔ فعل التزامی
    gloss: اگر باران بیاید، ما به پارک نمی‌رویم.
    note: 'برای شرطِ ممکن، فعل بعد از *اگه* به شکل التزامی می‌آید: *بیاد*، *باشه*. نتیجه در زمان حال عادی است: *نمی‌ریم*. بین دو بخش کامه بگذارید.'
  fa.a2.unit37.lesson01.teach.present_condition:
    title: اگه به‌علاوهٔ زمان حال
    gloss: اگر فردا باران بیاید، ما در خانه می‌مانیم.
    note: 'بعد از *اگه* زمان حال را هم می‌شنوید: *اگه بارون میاد*. معنی‌اش همان شرطِ واقعی است. در این بخش شما شکل التزامی (*بیاد*) را تولید می‌کنید؛ شکل حال برای شناخت چیزی است که می‌شنوید.'
  fa.a2.unit37.lesson02.teach.time_tired:
    title: وقت، خسته، کار
    gloss: وقت، خسته، کار، من، ما
    note: '*وقت دارم* یعنی «فرصت دارم». معنی ساعت را نمی‌دهد.'
    example_gloss:
    - فردا من فرصت دارم.
    - امروز من فرصت ندارم.
    - امروز ما کار داریم.
  fa.a2.unit37.lesson02.teach.come_forms:
    title: شکل‌های آمدن و وقت داشتن
    gloss: می‌آیم، می‌آیی، نمی‌آیم، داشته باشم، داشته باشی، خسته باشیم
    note: '*میام* شکل گفتاری «می‌آیم / می‌آیم (در آینده)» است. در شرط از *داشته باشم*، *داشته باشی*، *خسته باشیم* کار گرفته می‌شود: این‌ها شکل‌های التزامی هستند.'
    example_gloss:
    - فردا می‌آیی؟
    - امروز نمی‌آیم.
  fa.a2.unit37.lesson02.teach.person_endings:
    title: پایان را با شخص جور کنید
    gloss: دارم، داری، دارد، داریم
    note: 'پایان بعد از *داشته* با شخص تغییر می‌کند: *باشم* (من)، *باشی* (تو)، *باشه* (او)، *باشیم* (ما). فارسی معمولاً ضمیر را نمی‌آورد، چون پایان فعل شخص را نشان می‌دهد.'
  fa.a2.unit37.lesson02.teach.result_tense:
    title: نتیجه در زمان حال است
    gloss: اگر وقت داشته باشم، می‌آیم.
    note: فارسی در اینجا شکل جداگانهٔ آینده لازم ندارد. زمان حال در نتیجه، *میام*، خودش «می‌آیم (در آینده)» معنی می‌دهد.
  fa.a2.unit37.lesson03.teach.time_clause_words:
    title: وقتی، رسیدن، کار تمام شود، دوکان
    gloss: وقتی، برسم، کارم، تمام، شود، دوکان، باز، به، به تو زنگ می‌زنم
    note: '*وقتی* یعنی «زمانی که». *کارم تموم بشه* یعنی «کارم تمام شود». *بهت زنگ می‌زنم* یعنی «به تو زنگ می‌زنم».'
    example_gloss:
    - وقتی کارم تمام شود، می‌آیم.
    - فردا به تو زنگ می‌زنم.
  fa.a2.unit37.lesson03.teach.negative_forms:
    title: شکل‌های منفی شرط و رفتن/ماندن
    gloss: نیایی، نیاید، نباشد، نداشته باشم، تنها، می‌روم، می‌مانم
    note: 'برای منفی ساختن شرط، *نـ* را بر فعل التزامی بگذارید: *نیای*، *نیاد*، *نباشه*، *نداشته باشم*.'
    example_gloss:
    - من تنها می‌روم.
    - امروز من در خانه می‌مانم.
  fa.a2.unit37.lesson03.teach.negative_condition:
    title: شرط منفی
    gloss: اگر نیایی، من تنها می‌روم. اگر باران نیاید، به پارک می‌رویم.
    note: 'شرط منفی هم یک شرط ممکن است. فعل التزامی را با *نـ* منفی کنید: *اگه نیای*، *اگه بارون نیاد*. نتیجه می‌تواند مثبت یا منفی باشد.'
  fa.a2.unit37.lesson03.teach.if_vs_when:
    title: اگه یعنی شاید، وقتی یعنی حتماً
    gloss: وقتی کارم تمام شود، می‌آیم. اگر وقت داشته باشم، می‌آیم.
    note: وقتی که رویداد حتماً اتفاق می‌افتد و فقط زمانش را می‌گویید، *وقتی* بگویید. وقتی ممکن است اتفاق نیفتد، *اگه* بگویید. بعد از هر دو فعل التزامی و نتیجه در زمان حال می‌آید.
  fa.a2.unit37.lesson04.teach.shop_words:
    title: کلمه‌های دوکان
    gloss: رسید، پول، جنس، خراب، تخفیف، این، شما دارید، باز است
    note: '*جنس* یعنی کالا یا چیزی که می‌خرید. *رسید دارید؟* پرسش محترمانه از مشتری است.'
    example_gloss:
    - این جنس خراب است.
    - رسید دارید؟
    - دوکان امروز باز است.
  fa.a2.unit37.lesson04.teach.policy_verbs:
    title: فعل‌های قاعده‌های دوکان
    gloss: آن را تبدیل می‌کنیم، پس می‌دهیم، بخرید، می‌گیرید، داشته باشید، پول شما را
    note: 'کارکنان دوکان با مشتری‌ها با پایان‌های محترمانهٔ *شما* صحبت می‌کنند: *داشته باشید*، *بخرید*، *می‌گیرید* و *-تون* در *پولتون*. *رو* بعد از مفعول معین می‌آید.'
    example_gloss:
    - ما این جنس را تبدیل می‌کنیم.
    - امروز تخفیف می‌گیرید.
  fa.a2.unit37.lesson04.teach.shop_pattern:
    title: قاعدهٔ دوکان با اگه
    gloss: اگر رسید داشته باشید، پول شما را پس می‌دهیم.
    note: 'قاعدهٔ دوکان همان ساختار پلان را دارد: *اگه* به‌علاوهٔ شرط التزامی، بعد نتیجه در زمان حال. با مشتری‌ها از پایان‌های محترمانهٔ *-ید* و *-تون* کار بگیرید.'
  fa.a2.unit37.lesson04.teach.what_if_phrase:
    title: اگر... چی؟
    gloss: اگر باران بیاید چی؟ اگر رسید نداشته باشم چی؟
    note: بعد از شرط *چی؟* را بیفزایید تا بپرسید «اگر... چی؟».
  fa.a2.unit37.lesson04.teach.what_if_question:
    title: اگه ... چی؟
    gloss: اگر باران بیاید چی؟
    note: 'شرط فعل التزامی‌اش را نگه می‌دارد و *چی؟* آخر می‌آید، بدون جملهٔ نتیجه. طرف مقابل با نتیجه جواب می‌دهد: *اگه بارون بیاد، می‌ریم سینما.*'
  fa.a2.unit37.lesson05.teach.reading_words:
    title: کلمه‌های پیام و اطلاعیه
    gloss: سلام، خوب، بیا (امر)، نمی‌توانی، آمدن، به من، بزن (امر)، اطلاعیه
    note: '*بیا* و *بزن* امرهای دوستانه هستند. *بهم زنگ بزن* یعنی «به من زنگ بزن».'
    example_gloss:
    - سلام! هوا خوب است.
    - اگر نمی‌توانی بیایی، به من زنگ بزن.
  fa.a2.unit37.lesson05.teach.message:
    title: پیامی دربارهٔ فردا
    gloss: سلام نیما! فردا اگر هوا آفتابی باشد، به پارک می‌رویم. اگر باران بیاید، به سینما می‌رویم. اگر وقت داشته باشی، بیا. اگر نمی‌توانی بیایی، به من زنگ بزن.
    note: برای هر شرط و نتیجه‌اش بخوانید.
  fa.a2.unit37.lesson05.teach.notice:
    title: یک اطلاعیهٔ دوکان
    gloss: 'اطلاعیهٔ دوکان: اگر جنس خراب باشد، آن را تبدیل می‌کنیم. اگر رسید داشته باشید، پول شما را پس می‌دهیم. اگر رسید نداشته باشید، پول پس نمی‌دهیم. اگر امروز بخرید، تخفیف می‌گیرید.'
    note: هر جمله یک قاعده با یک شرط و یک نتیجه است.
  fa.a2.unit37.lesson06.teach.dialogue_words:
    title: بلی، خوب است، بعد از آن
    gloss: بلی، خوب است، بعد از آن
    note: '*آره* «بلی» عادی گفتاری است. *بعدش* یعنی «بعد از آن».'
    example_gloss:
    - بلی، فردا می‌رویم.
    - خوب است! بعد از آن به بازار می‌رویم.
  fa.a2.unit37.lesson06.teach.turn01:
    title: سارا پارک را پیشنهاد می‌کند
    gloss: 'سارا می‌پرسد: نیما، فردا به پارک می‌رویم؟'
    note: پرسش در زمان حال می‌تواند دربارهٔ یک پلان باشد.
  fa.a2.unit37.lesson06.teach.turn02:
    title: نیما یک شرط می‌گوید
    gloss: 'نیما جواب می‌دهد: بلی، اگر باران نیاید.'
    note: 'یک شرط منفی می‌تواند تمام جواب باشد: *اگه بارون نیاد، آره.*'
  fa.a2.unit37.lesson06.teach.turn03:
    title: سارا می‌پرسد اگر چی
    gloss: 'سارا می‌پرسد: اگر باران بیاید چی؟'
    note: '*اگه ... چی؟* دربارهٔ امکان دیگر می‌پرسد.'
  fa.a2.unit37.lesson06.teach.turn04:
    title: نیما پلان دیگر را می‌گوید
    gloss: 'نیما جواب می‌دهد: اگر باران بیاید، به سینما می‌رویم.'
    note: جواب یک شرط به‌علاوهٔ نتیجه در زمان حال است.
  fa.a2.unit37.lesson06.teach.turn05:
    title: سارا پلان دوم را می‌افزاید
    gloss: 'سارا می‌گوید: خوب است. اگر وقت داشته باشی، بعد از آن به بازار می‌رویم.'
    note: پلان دوم به یک شرط تازه وابسته است.
  fa.a2.unit37.lesson06.teach.turn06:
    title: نیما اگه و وقتی را جدا می‌کند
    gloss: 'نیما می‌گوید: اگر وقت داشته باشم، می‌آیم. وقتی کارم تمام شود، به تو زنگ می‌زنم.'
    note: '*اگه* یک امکان است؛ *وقتی* چیزی است که اتفاق می‌افتد.'
exercises:
  fa.a2.unit37.lesson01.exercise01.recognize_rain_condition:
    instruction: این جمله چه معنا دارد؟
    correct_option: اگر باران بیاید، ما به پارک نمی‌رویم.
    distractors:
    - وقتی باران می‌آید، ما همیشه به پارک می‌رویم.
    - باران می‌آید، پس ما به پارک می‌رویم.
    - چه باران بیاید چه نیاید، ما به پارک می‌رویم.
    accepted_answers:
    - value: اگر باران بیاید، ما به پارک نمی‌رویم.
      status: correct
    feedback: '*اگه بارون بیاد* شرط «اگر باران بیاید» است؛ *نمی‌ریم پارک* نتیجه است.'
  fa.a2.unit37.lesson01.exercise02.recognize_present_condition:
    instruction: این جمله چه معنی دارد؟ بعد از اگه زمان حال آمده است.
    correct_option: اگر فردا باران بیاید، ما در خانه می‌مانیم.
    distractors:
    - اگر دیروز باران باریده باشد، ما در خانه ماندیم.
    - فردا باران می‌بارد و ما بیرون می‌رویم.
    - اگر ما در خانه بمانیم، باران می‌بارد.
    accepted_answers:
    - value: اگر فردا باران بیاید، ما در خانه می‌مانیم.
      status: correct
    feedback: '*اگه بارون میاد* شکل زمان حال همین شرط واقعی است.'
  fa.a2.unit37.lesson01.exercise03.match_weather_plan_words:
    instruction: هر کلمه فارسی را با معنایش وصل کنید.
    accepted_answers:
