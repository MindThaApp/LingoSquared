        برف: برف
        آفتابی: آفتابی
        سرد: سرد
        گرم: گرم
        پارک: پارک
        خونه: خانه
        بیرون: بیرون
        سینما: سینما
        فردا: فردا
      status: correct
    feedback: این‌ها واژه‌های هوا و جاها برای ساختن پلان‌ها هستند.
    pairs:
