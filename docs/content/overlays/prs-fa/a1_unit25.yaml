teaching:
  fa.a1.unit25.lesson01.teach.oo_review:
    title: او
    gloss: او
    note: '*او* اینجا دوباره به عنوان فاعل در توصیف ظاهر می‌آید.'
  fa.a1.unit25.lesson01.teach.ghad_review:
    title: قد
    gloss: قد
    note: '*قد* دوباره اینجا می‌آید. *قدش* پسوند ملکیت *-ش* (قد او) را می‌گیرد، مثل *امتحانش* در واحد ۲۰.'
    example_gloss: نیما قدبلند است.
  fa.a1.unit25.lesson01.teach.boland_word:
    title: قدبلند
    gloss: دراز
    note: '*بلند* یعنی دراز (یا طولانی). *قدش بلنده* لفظاً یعنی «قدش دراز است» و شیوهٔ عادیِ گفتاری برای گفتن قدبلند بودن کسی است.'
    example_gloss: قدش دراز است.
  fa.a1.unit25.lesson01.teach.kotah_word:
    title: کوتاه‌قد
    gloss: کوتاه
    note: '*کوتاه* یعنی کم‌طول یا کم‌قد.'
    example_gloss: قدش کوتاه است.
  fa.a1.unit25.lesson02.teach.mo_word:
    title: مو
    gloss: موی سر
    note: '*مو* یعنی موی سر. *موی* شکل اضافه (پیوندی) است که پیش از صفت می‌آید، مثل *موی بلند* (موی دراز).'
    example_gloss: او موهای دراز دارد.
  fa.a1.unit25.lesson02.teach.moohash_word:
    title: موهایش
    gloss: موهایش
    note: '*موهاش* از جمع *موها* و پسوند ملکیت *-ش* ساخته شده است، یعنی «موهای او».'
  fa.a1.unit25.lesson02.teach.meshki_word:
    title: سیاه
    gloss: سیاه
    note: '*مشکی* واژهٔ روزمرهٔ گفتاری برای موی یا چشم سیاه است؛ در اینجا از *سیاه* واحد ۲۰ طبیعی‌تر است، چون سیاه برای لباس مناسب‌تر است تا برای مو.'
    example_gloss: موهایش سیاه است.
  fa.a1.unit25.lesson02.teach.bolond_word:
    title: بلوند
    gloss: بلوند
    note: '*بلوند* (واژهٔ قرضی) یعنی موی زرد یا طلایی.'
    example_gloss: موهایش بلوند است.
  fa.a1.unit25.lesson03.teach.cheshm_word:
    title: چشم
    gloss: چشم
    note: '*چشم* یعنی چشم. *چشمای* شکل گفتاریِ جمع همراه با اضافه است (چشم‌های ...)، مثل *چشمای آبی* (چشم‌های آبی).'
    example_gloss: او چشم‌های قهوه‌یی دارد.
  fa.a1.unit25.lesson03.teach.cheshmash_word:
    title: چشم‌هایش
    gloss: چشم‌هایش
    note: '*چشماش* از جمعِ گفتاریِ *چشما* و پسوند ملکیت *-ش* ساخته شده است، یعنی «چشم‌های او». توجه: *چشماش آبیه* با وجود جمع بودن *چشما* پایانهٔ مفرد *-ه* دارد؛ این در فارسی ایران عادی است، چون برای جمعِ غیرانسان معمولاً فعل مفرد می‌آید.'
  fa.a1.unit25.lesson03.teach.ghahveei_word:
    title: قهوه‌یی
    gloss: قهوه‌یی
    note: '*قهوه‌ای* (لفظاً «به رنگ قهوه») یعنی رنگ قهوه‌یی.'
    example_gloss: چشم‌هایش قهوه‌یی است.
  fa.a1.unit25.lesson03.teach.sabz_word:
    title: سبز
    gloss: سبز
    note: '*سبز* یعنی رنگ سبز.'
    example_gloss: چشم‌هایش سبز است.
  fa.a1.unit25.lesson03.teach.abi_review:
    title: آبی
    gloss: آبی
    note: '*آبی* اینجا دوباره برای رنگ چشم می‌آید.'
    example_gloss: چشم‌هایش آبی است.
  fa.a1.unit25.lesson04.teach.man_review:
    title: من
    gloss: من
    note: '*من* که پیش‌تر خوب یاد گرفته‌اید، اینجا دوباره برای معرفی ظاهر خود می‌آید.'
    example_gloss: من موی قهوه‌یی دارم.
  fa.a1.unit25.lesson04.teach.daram_review:
    title: دارم / دارد
    gloss: دارم / دارد
    note: '*دارم*/*داره* با ویژگی ظاهری هم به همین شکل کار می‌کنند: *موی مشکی دارم* یعنی «موی سیاه دارم».'
  fa.a1.unit25.lesson04.teach.eynak_word:
    title: عینک
    gloss: عینک
    note: '*عینک* یعنی عینک چشم.'
    example_gloss: او عینک می‌زند.
  fa.a1.unit25.lesson04.teach.mizane_word:
    title: او می‌زند
    gloss: عینک می‌زند
    note: '*می‌زنه* (لفظاً «می‌زند») فعل طبیعی برای عینک به چشم داشتن است؛ *عینک می‌زنه* یعنی «عینک می‌زند». این فعل با *می‌کنم* (کردن) در واحد ۸ و ۲۴ فرق دارد.'
  fa.a1.unit25.lesson04.teach.che_shekliye_phrase:
    title: چه شکلی دارد؟
    gloss: چه شکلی دارد؟
    note: '*چه شکلیه؟* لفظاً یعنی «چه شکلی است؟» و شیوهٔ معمولِ گفتاری برای پرسیدن از ظاهر کسی است.'
  fa.a1.unit25.lesson04.teach.va_review:
    title: و
    gloss: و
    note: '*و* یعنی «و» و پیش‌تر در واحد ۱۴ و ۲۴ هم به همین معنا آمده است.'
    example_gloss: قدش دراز و موهایش سیاه است.
  fa.a1.unit25.lesson05.teach.nima_review:
    title: نیما
    gloss: نیما
    note: '*نیما* که از واحد ۱۱ به‌عنوان یک شخصیت معرفی شده بود، اینجا دوباره می‌آید.'
    example_gloss: نیما دوست سارا است.
  fa.a1.unit25.lesson05.teach.reading_text:
    title: 'متن خواندنی: ظاهر نیما'
    gloss: نیما قدبلند است. موهایش سیاه و چشم‌هایش قهوه‌یی است. عینک می‌زند.
    note: این متن همهٔ ساختارهای درس‌های ۱ تا ۴ را دوباره به کار می‌برد؛ تقریباً واژهٔ تازه ندارد و فقط باید آنها را در متنِ پیوسته بشناسید.
  fa.a1.unit25.lesson06.teach.maryam_name:
    title: مریم
    gloss: مریم
    note: '*مریم* شخصیت تازه‌ای است؛ دوست سارا که نیما هنوز او را ندیده است.'
    example_gloss: مریم دوست سارا است.
  fa.a1.unit25.lesson06.teach.alan_review:
    title: حالا
    gloss: حالا
    note: '*الان* اینجا دوباره می‌آید.'
    example_gloss: مریم همین حالا می‌آید.
  fa.a1.unit25.lesson06.teach.miad_word:
    title: می‌آید
    gloss: می‌آید
    note: '*میاد* شکل گفتاریِ زمان حال *آمدن* است.'
    example_gloss: مریم همین حالا می‌آید.
  fa.a1.unit25.lesson06.teach.rangiye_phrase:
    title: چه رنگی است؟
    gloss: چه رنگی است؟
    note: '*چه رنگیه؟* از *چه* (از درس ۴)، *رنگی* (از *رنگ* + *-ی*) و *-ه* (است) ساخته شده و یعنی «چه رنگی است؟»'
  fa.a1.unit25.lesson06.teach.bashe_mamnoon_review:
    title: خوب است، تشکر
    gloss: خوب است، تشکر
    note: '*باشه* و *ممنون* که هر دو پیش‌تر آمده‌اند، اینجا برای پایان گفتگو کنار هم می‌آیند.'
  fa.a1.unit25.lesson06.teach.dialogue_line1:
    title: 'سارا: مریم همین حالا می‌آید.'
    gloss: مریم همین حالا می‌آید.
  fa.a1.unit25.lesson06.teach.dialogue_line2:
    title: 'نیما: مریم چه شکلی دارد؟'
    gloss: مریم چه شکلی دارد؟
  fa.a1.unit25.lesson06.teach.dialogue_line3:
    title: 'سارا: قدش دراز و موهایش سیاه است.'
    gloss: قدش دراز و موهایش سیاه است.
  fa.a1.unit25.lesson06.teach.dialogue_line4:
    title: 'نیما: چشم‌هایش چه رنگ است؟'
    gloss: چشم‌هایش چه رنگ است؟
  fa.a1.unit25.lesson06.teach.dialogue_line5:
    title: 'سارا: چشم‌هایش قهوه‌یی است.'
    gloss: چشم‌هایش قهوه‌یی است.
  fa.a1.unit25.lesson06.teach.dialogue_line6:
    title: 'نیما: خوب است، تشکر.'
    gloss: خوب است، تشکر.
