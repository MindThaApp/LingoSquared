  description: 'فارسی ایران برای مبتدی: توصیف قد (بلند/کوتاه)، مو (طول و رنگ: سیاه، بلوند)، رنگ چشم (قهوه‌ای، سبز، آبی) و عینک زدن، پرسیدن «او چه شکلی است؟»، یک متن کوتاه دربارهٔ ظاهر نیما و یک گفتگوی پایانی بین نیما و سارا دربارهٔ شناختن مریم، دوست سارا.'
