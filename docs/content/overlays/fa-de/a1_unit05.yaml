teaching:
  de.a1.unit05.lesson01.teach.wie_spaet:
    title: Wie spät ist es?
    gloss: ساعت چند است؟
    note: معنای تحت‌اللفظی‌اش «چقدر دیر است؟» است -- روش معمول برای پرسیدن ساعت.
  de.a1.unit05.lesson01.teach.drei_uhr:
    title: Es ist drei Uhr.
    gloss: ساعت سه است.
    note: '*Uhr* = «ساعت». ساعت دقیق یعنی عدد + *Uhr*.'
  de.a1.unit05.lesson01.teach.halb_vier:
    title: halb vier = 3:30
    gloss: ساعت سه و نیم است (۳:۳۰).
    note: 'در فارسی می‌گوییم «سه و نیم»، ولی آلمانی نیم‌ساعت را نسبت به ساعتی می‌گوید که در پیش است: *halb vier* = «نیمِ راه تا چهار» = ۳:۳۰، نه ۴:۳۰.'
  de.a1.unit05.lesson01.teach.fuenf_uhr:
    title: Es ist fünf Uhr.
    gloss: ساعت پنج است.
  de.a1.unit05.lesson02.teach.viertel_nach:
    title: Es ist Viertel nach drei.
    gloss: ساعت سه و ربع است (۳:۱۵).
    note: '*Viertel* = «ربع»؛ *nach* = «بعد از».'
  de.a1.unit05.lesson02.teach.viertel_vor:
    title: Es ist Viertel vor vier.
    gloss: ساعت یک ربع به چهار است (۳:۴۵).
    note: '*vor* = «قبل از» (در ساعت‌گویی: «به»).'
  de.a1.unit05.lesson02.teach.zehn_nach:
    title: Es ist zehn nach vier.
    gloss: ساعت چهار و ده دقیقه است (۴:۱۰).
    note: 'ترتیب این است: دقیقه + *nach* + ساعت. پس zehn nach vier یعنی چهار و ده دقیقه.'
  de.a1.unit05.lesson02.teach.zehn_vor:
    title: Es ist zehn vor fünf.
    gloss: ساعت ده دقیقه به پنج است (۴:۵۰).
    note: 'ترتیب این است: دقیقه + *vor* + ساعت بعدی؛ فارسی هم همین را می‌گوید: «ده دقیقه به پنج».'
  de.a1.unit05.lesson03.teach.morgen:
    title: Morgen
    gloss: صبح
    note: '*Morgen* اسم «صبح» است، تقریباً از ۶ تا ۱۲ ظهر.'
    example_gloss: صبح بخیر، فلیکس!
  de.a1.unit05.lesson03.teach.mittag:
    title: Mittag
    gloss: ظهر
    note: '*Mittag* خود ظهر است، یعنی وسط Morgen و Nachmittag.'
    example_gloss: ظهر است.
  de.a1.unit05.lesson03.teach.nachmittag:
    title: Nachmittag
    gloss: بعدازظهر
    note: '*Nachmittag* تقریباً از ۱۲ ظهر تا ۶ عصر است.'
    example_gloss: من بعدازظهرها کار می‌کنم.
  de.a1.unit05.lesson03.teach.abend:
    title: Abend
    gloss: عصر / شب (اول شب)
    note: '*Abend* تقریباً از ۶ عصر تا ۱۰ شب است.'
    example_gloss: عصر بخیر، آنا!
  de.a1.unit05.lesson03.teach.nacht:
    title: Nacht
    gloss: شب
    note: '*Nacht* تقریباً از ۱۰ شب تا ۶ صبح است.'
    example_gloss: شب بخیر، فلیکس!
  de.a1.unit05.lesson03.teach.mitternacht:
    title: Mitternacht
    gloss: نیمه‌شب
    note: '*Mitternacht* دقیقاً ساعت ۱۲ شب / 0 Uhr است.'
    example_gloss: مهمانی نیمه‌شب تمام می‌شود.
  de.a1.unit05.lesson03.teach.achtzehn:
    title: achtzehn
    gloss: هجده
    note: '*achtzehn* = ۱۸؛ اینجا در ساعت ۲۴ ساعته برای ساعت‌های رسمی به کار رفته است (achtzehn Uhr = ۶ عصر).'
    example_gloss: مغازه ساعت ۱۸:۰۰ (۶ عصر) بسته می‌شود.
  de.a1.unit05.lesson03.teach.laden_oeffnet:
    title: Der Laden öffnet um neun Uhr morgens.
    gloss: مغازه ساعت نه صبح باز می‌شود.
    note: '*um* + ساعت = «در / ساعتِ ...»؛ *morgens* = «صبح‌ها / در صبح».'
  de.a1.unit05.lesson03.teach.laden_schliesst:
    title: Der Laden schließt um achtzehn Uhr.
    gloss: مغازه ساعت ۱۸:۰۰ (۶ عصر) بسته می‌شود.
    note: '*schließt* = «بسته می‌شود». ساعت کاری رسمی با ساعت ۲۴ ساعته گفته می‌شود.'
  de.a1.unit05.lesson04.teach.wann:
    title: Wann
    gloss: کی / چه وقت
    note: '*Wann* سؤال دربارهٔ زمان را شروع می‌کند.'
    example_gloss: شما کی می‌آیید؟
  de.a1.unit05.lesson04.teach.oeffnet_die:
    title: öffnet die
    gloss: باز می‌شود (فعل) + حرف تعریف مؤنث/جمع
    note: '*öffnet* سوم‌شخص مفرد فعل *öffnen* (باز کردن / باز شدن) است؛ *die* artikel معرفهٔ مؤنث و جمع است و با *die Bibliothek* می‌آید.'
    example_gloss: کتابخانه کی باز می‌شود؟
  de.a1.unit05.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: کتابخانه
    note: '*Bibliothek* اسم مؤنث است (*die Bibliothek*)، همان مکانی که در درس ۴ آمد.'
    example_gloss: دارم می‌روم کتابخانه.
  de.a1.unit05.lesson04.teach.sie_pronomen:
    title: sie
    gloss: آن / او (زن) / آن‌ها (با حرف کوچک)
    note: اینجا *sie* ضمیر سوم‌شخص است و جای اسم مؤنث *die Bibliothek* نشسته است -- یعنی «آن». با *Sie* (با حرف بزرگ، «شما»ی رسمی) که آنا و فلیکس به هم می‌گویند اشتباه نگیرید.
    example_gloss: من کتابخانه را دوست دارم. اغلب به آن سر می‌زنم.
  de.a1.unit05.lesson04.teach.dann:
    title: dann
    gloss: بعد / آن موقع
    note: '*dann* اینجا در خداحافظی *Bis dann!* («تا آن موقع!») آمده است.'
    example_gloss: پس بعداً می‌بینیم!
  de.a1.unit05.lesson04.teach.line01:
    title: فلیکس درباره‌ی کتابخانه می‌پرسد
    gloss: 'فلیکس می‌گوید: کتابخانه کی باز می‌شود؟'
  de.a1.unit05.lesson04.teach.line02:
    title: آنا جواب می‌دهد
    gloss: 'آنا می‌گوید: ساعت نه صبح باز می‌شود.'
    note: '*Sie* اینجا یعنی «آن» و به *die Bibliothek* برمی‌گردد. فقط چون اول جمله آمده، با حرف بزرگ نوشته شده.'
  de.a1.unit05.lesson04.teach.line03:
    title: فلیکس سؤال بعدی را می‌پرسد
    gloss: 'فلیکس می‌گوید: و کی بسته می‌شود؟'
  de.a1.unit05.lesson04.teach.line04:
    title: آنا دوباره جواب می‌دهد
    gloss: 'آنا می‌گوید: ساعت ۱۸ (شش عصر) بسته می‌شود.'
  de.a1.unit05.lesson04.teach.line05:
    title: فلیکس خداحافظی می‌کند
    gloss: 'فلیکس می‌گوید: خوبه، پس بعداً می‌بینیم!'
  de.a1.unit05.lesson04.teach.schild:
    title: تابلویی روی در
    gloss: 'ساعت کاری: از ۹ تا ۱۸.'
    note: '*Öffnungszeiten* یعنی «ساعت کاری»؛ *bis* یعنی «تا».'
