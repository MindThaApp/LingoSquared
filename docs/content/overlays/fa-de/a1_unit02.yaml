teaching:
  de.a1.unit02.lesson01.teach.wie_heissen_sie:
    title: Wie heißen Sie?
    gloss: اسم شما چیه؟ (رسمی)
    note: '*Wie heißen Sie?* تحت‌اللفظی می‌پرسد «چطور صدا زده می‌شوید؟» و از *Sie* رسمی درس ۱ استفاده می‌کند.'
  de.a1.unit02.lesson01.teach.ich_heisse_anna:
    title: Ich heiße Anna.
    gloss: اسم من آنا است.
    note: '*heißen* یعنی «نام داشتن»؛ این روش استاندارد گفتن اسم است.'
  de.a1.unit02.lesson01.teach.wie_heisst_du:
    title: Wie heißt du?
    gloss: اسمت چیه؟ (غیررسمی)
    note: شکل غیررسمی، با *du* که در درس ۱ دیدید.
  de.a1.unit02.lesson01.teach.ich_heisse_felix:
    title: Ich heiße Felix.
    gloss: اسم من فلیکس است.
    note: ساختارش همان *Ich heiße Anna* است، فقط اسم فرق می‌کند.
  de.a1.unit02.lesson01.teach.freut_mich:
    title: Freut mich.
    gloss: خوشبختم.
    note: راهی کوتاه و رایج برای گفتن اینکه از آشنایی خوشحالید؛ هم در موقعیت رسمی و هم غیررسمی کاربرد دارد.
  de.a1.unit02.lesson01.teach.ganz_meinerseits:
    title: Ganz meinerseits.
    gloss: من هم همین‌طور.
    note: جواب طبیعی به *Freut mich*؛ تحت‌اللفظی یعنی «کاملاً از طرف من».
  de.a1.unit02.lesson02.teach.ich:
    title: ich
    gloss: من
    note: '*ich* جز اول جمله (مثل *Ich bin Anna.*) با حرف کوچک نوشته می‌شود. در فارسی اصلاً حروف بزرگ و کوچک نداریم، ولی در آلمانی باید به این نکته توجه کنید.'
  de.a1.unit02.lesson02.teach.du:
    title: du
    gloss: تو (غیررسمی)
    note: در درس ۱ معرفی شد؛ اینجا به‌عنوان فاعل یک جملهٔ کامل مرور می‌شود.
  de.a1.unit02.lesson02.teach.ich_bin_anna:
    title: Ich bin Anna.
    gloss: من آنا هستم.
    note: '*bin* صرف *ich* از فعل *sein* (بودن) است.'
  de.a1.unit02.lesson02.teach.du_bist_felix:
    title: Du bist Felix.
    gloss: تو فلیکس هستی.
    note: '*bist* صرف *du* از فعل *sein* است.'
  de.a1.unit02.lesson03.teach.deutschland:
    title: Deutschland
    gloss: آلمان
    note: 'مثل فارسی، نام کشورها در آلمانی معمولاً حرف تعریف نمی‌گیرد: فقط *Deutschland*، نه *das Deutschland*.'
    example_gloss: من اهل آلمان هستم.
  de.a1.unit02.lesson03.teach.england:
    title: England
    gloss: انگلستان
    note: England در آلمانی با تلفظ آلمانی گفته می‌شود، تقریباً «اِنگلَنت».
    example_gloss: من اهل انگلستان هستم.
  de.a1.unit02.lesson03.teach.frankreich:
    title: Frankreich
    gloss: فرانسه
    note: حواستان باشد که املای این کلمه در آلمانی با *France* در زبان فرانسه فرق دارد.
    example_gloss: من اهل فرانسه هستم.
  de.a1.unit02.lesson03.teach.italien:
    title: Italien
    gloss: ایتالیا
    note: 'تلفظ تقریبی: «ای‌تا‌لی‌ین»، با تکیه روی «تا».'
    example_gloss: من اهل ایتالیا هستم.
  de.a1.unit02.lesson03.teach.spanien:
    title: Spanien
    gloss: اسپانیا
    note: 'تلفظ تقریبی: «شپا‌نی‌ین»، با تکیه روی «پا».'
    example_gloss: من اهل اسپانیا هستم.
  de.a1.unit02.lesson03.teach.russland:
    title: Russland
    gloss: روسیه
    note: از *Russ-* و *-land* ساخته شده، مثل *Deutschland*.
    example_gloss: من اهل روسیه هستم.
  de.a1.unit02.lesson04.teach.woher_kommen_sie:
    title: Woher kommen Sie?
    gloss: اهل کجایید؟ (رسمی)
    note: '*Woher* یعنی «از کجا»؛ معنی «از» در خود این کلمه است، در حالی که در فارسی «از» و «کجا» دو کلمهٔ جدا هستند.'
  de.a1.unit02.lesson04.teach.ich_komme_aus_deutschland:
    title: Ich komme aus Deutschland.
    gloss: من اهل آلمان هستم.
    note: '*aus* + نام کشور مبدأ را نشان می‌دهد؛ در این مرحله به صفت ملیتِ جنسیت‌دار نیازی نیست.'
  de.a1.unit02.lesson04.teach.woher_kommst_du:
    title: Woher kommst du?
    gloss: اهل کجایی؟ (غیررسمی)
    note: شکل غیررسمی، با *du*.
  de.a1.unit02.lesson04.teach.ich_komme_aus_england:
    title: Ich komme aus England.
    gloss: من اهل انگلستان هستم.
    note: ساختارش همان *Ich komme aus Deutschland* است، فقط کشور فرق می‌کند.
  de.a1.unit02.lesson04.teach.und_sie:
    title: Und Sie?
    gloss: و شما؟ (رسمی)
    note: راهی کوتاه برای برگرداندن سؤال، هماهنگ با شکل رسمی *Sie*.
  de.a1.unit02.lesson05.teach.line01:
    title: فلیکس به آنا سلام می‌کند
    gloss: 'فلیکس می‌گوید: روز بخیر!'
    note: فلیکس و آنا همسایه‌اند و قبلاً یک بار همدیگر را دیده‌اند (درس ۱)، ولی هنوز اسم هم را نمی‌دانند؛ حالا دوباره در ایستگاه اتوبوس به هم برخورده‌اند.
  de.a1.unit02.lesson05.teach.line02:
    title: آنا سلام را جواب می‌دهد و اسم او را می‌پرسد
    gloss: 'آنا می‌گوید: روز بخیر! اسم شما چیست؟'
    note: آنا از *Sie* ی رسمی استفاده می‌کند، یعنی همان لحنی که در درس ۱ بین دو غریبه به کار رفت.
  de.a1.unit02.lesson05.teach.line03:
    title: فلیکس اسمش را می‌گوید و همین سؤال را برمی‌گرداند
    gloss: 'فلیکس می‌گوید: اسم من فلیکس است. شما چطور؟'
    note: فلیکس جواب می‌دهد و سؤال را به شکل رسمی برمی‌گرداند.
  de.a1.unit02.lesson05.teach.line04:
    title: آنا اسمش را می‌گوید
    gloss: 'آنا می‌گوید: اسم من آناست. از آشنایی با شما خوشوقتم.'
    note: آنا هم همین‌طور جواب می‌دهد و یک جمله‌ی مؤدبانه اضافه می‌کند.
  de.a1.unit02.lesson05.teach.line05:
    title: فلیکس جواب می‌دهد و می‌پرسد او اهل کجاست
    gloss: 'فلیکس می‌گوید: من هم همین‌طور. شما اهل کجایید؟'
    note: فلیکس تعارف مؤدبانه را برمی‌گرداند و بحث را به محل زندگی و اصالت می‌کشاند.
  de.a1.unit02.lesson05.teach.line06:
    title: آنا جواب می‌دهد و سؤال را برمی‌گرداند
    gloss: 'آنا می‌گوید: من اهل آلمان هستم. شما چطور؟'
    note: این جمله نشان می‌دهد آنا آلمانی است؛ با این موضوع که آن‌ها همسایه‌ی هم در یک شهر آلمانی‌زبان‌اند جور است.
  de.a1.unit02.lesson05.teach.line07:
    title: فلیکس جواب می‌دهد
    gloss: 'فلیکس می‌گوید: من اهل انگلستان هستم.'
    note: حالا می‌فهمیم فلیکس اهل انگلستان است؛ یعنی همسایه‌ای انگلیسی که در آلمان زندگی می‌کند.
  de.a1.unit02.lesson05.teach.line08:
    title: آنا خداحافظی می‌کند
    gloss: 'آنا می‌گوید: خداحافظ!'
    note: خداحافظی رسمی از درس ۱، مطابق با همان لحن رسمی *Sie* که تا آخر ادامه دارد.
  de.a1.unit02.lesson05.teach.line09:
    title: فلیکس خداحافظی می‌کند
    gloss: 'فلیکس می‌گوید: خداحافظ!'
    note: فلیکس هم به همان شکل تمام می‌کند و در کل این گفتگو لحن رسمی را حفظ می‌کند.
  de.a1.unit02.lesson05.teach.steckbrief:
    title: یک پروفایل کوتاه نوشتاری
    gloss: 'نام: فلیکس. کشور: انگلستان.'
    note: یک کارت پروفایل ساده با اسم و یک مشخصه‌ی هویتی؛ همان اطلاعاتی که فلیکس قبلاً در گفتگو به زبان آورد.
