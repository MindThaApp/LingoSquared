teaching:
  de.a1.unit55.lesson01.teach.gross_klein:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Groß* برای آدم قدبلند و *klein* برای آدم کوتاه‌قد است. در آلمانی برای آدم‌ها از groß (بزرگ) استفاده می‌شود، نه lang (دراز).'
    example_gloss:
    - لنا قدبلند است.
    - یوناس کوتاه‌قد است.
  de.a1.unit55.lesson01.teach.alt_jung:
    title: مسن و جوان
    gloss: مسن / جوان
    note: '*Alt* و *jung* اینجا حس کلی از سن را می‌رسانند، نه تعداد دقیق سال‌ها را.'
    example_gloss:
    - پدربزرگ مسنه.
    - فلیکس جوان است.
  de.a1.unit55.lesson01.teach.alt_kann_eine:
    title: 'Alt: عدد یا حس کلی'
    gloss: Alt می‌تواند همراه تعداد سال بیاید، مثل Ich bin dreißig Jahre alt، یا حس کلی را برساند، مثل Opa ist alt.
    note: سن دقیق کسی را می‌توانید با *Wie alt bist du?* بپرسید. اینجا *alt* توصیف می‌کند کسی چند ساله به نظر می‌رسد، بدون هیچ عددی.
  de.a1.unit55.lesson01.teach.lena_ist_gross:
    title: لنا قدبلند است و یوناس کوتاه‌قد
    gloss: لنا قدبلند است و یوناس کوتاه‌قد.
    note: یک جملهٔ ساده با *und* (و) که زمینه را برای مقایسهٔ مستقیم در درس پنجم آماده می‌کند.
  de.a1.unit55.lesson02.teach.die_haare:
    title: مو
    gloss: مو
    note: '*Haare* اسم جمع است: *die Haare*. در آلمانی مفرد das Haar هم هست، ولی برای موی سر معمولاً Haare می‌گویند.'
    example_gloss: فلیکس موهای مشکی کوتاه دارد.
  de.a1.unit55.lesson02.teach.blond_braun_grau:
    title: بلوند، قهوه‌ای و خاکستری
    gloss: بلوند / قهوه‌ای / خاکستری
    note: 'سه رنگ مو: blond، braun، grau. قبل از اسم جمع بدون حرف تعریف، آخرشان -e می‌گیرد: blonde، braune، graue Haare.'
    example_gloss:
    - آنا موهای بلوند دارد.
    - یوناس موهای قهوه‌ای دارد.
    - پدربزرگ موهای خاکستری داره.
  de.a1.unit55.lesson02.teach.lang_kurz:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Kurz* (کوتاه) و *lang* (بلند) طول مو را توصیف می‌کنند. باز هم پایانهٔ -e: kurze Haare، lange Haare.'
    example_gloss:
    - لنا موهای بلند دارد.
    - یوناس موهای کوتاه دارد.
  de.a1.unit55.lesson02.teach.haare_ist_plural:
    title: Haare پایانهٔ -e می‌گیرد
    gloss: 'Haare جمع است و حرف تعریف ندارد، برای همین صفت به -e ختم می‌شود: kurze Haare، lange Haare، blonde Haare، braune Haare، graue Haare، schwarze Haare.'
    note: وقتی حرف تعریف نباشد، صفتِ قبل از اسم جمع پایانهٔ -e می‌گیرد. الگویش همان الگوی *Augen* در درس سوم است.
  de.a1.unit55.lesson02.teach.anna_hat_lange:
    title: 'Ihre: مال او (زن)'
    gloss: 'Ihre اینجا یعنی «مال او (زن)»: ihre Haare = موهای او. آنا موهای بلند دارد و موهایش بلوند است.'
    note: '*Ihre* (با i کوچک) صفت ملکی «مال او (زن)» است و با اسم جمع Haare مطابقت دارد. با I بزرگ، *Ihre* یعنی «مال شما» (رسمی).'
  de.a1.unit55.lesson02.teach.felix_hat_kurze:
    title: فلیکس موهای مشکی کوتاه دارد
    gloss: فلیکس موهای مشکی کوتاه دارد.
    note: 'کلمهٔ *schwarz* (مشکی) دوباره آمده، این بار برای مو: schwarze Haare.'
  de.a1.unit55.lesson02.teach.anna_hat_lange_2:
    title: آنا موهای بلوند بلند دارد
    gloss: آنا موهای بلوند بلند دارد.
    note: واژه‌های طول و رنگ این درس در یک جمله‌ی طبیعی کنار هم آمده‌اند.
  de.a1.unit55.lesson03.teach.die_augen:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Augen* جمع *das Auge* است. در آلمانی معمولاً جمع را به کار می‌برند، چون آدم دو چشم دارد.'
    example_gloss: فلیکس چشم‌های قهوه‌ای دارد.
  de.a1.unit55.lesson03.teach.blau_braun_gruen:
    title: آبی، قهوه‌ای و سبز
    gloss: آبی / قهوه‌ای / سبز
    note: 'رنگ‌ها: blau (آبی)، braun (قهوه‌ای) و grün (سبز).'
    example_gloss:
    - آنا چشم‌های آبی دارد.
    - یوناس چشم‌های قهوه‌ای دارد.
    - لنا چشم‌های سبز دارد.
  de.a1.unit55.lesson03.teach.augen_ist_plural:
    title: Augen پایانهٔ -e می‌گیرد
    gloss: 'Augen جمع است، برای همین صفت به -e ختم می‌شود: blaue Augen، braune Augen، grüne Augen.'
    note: 'قاعده همان قاعدهٔ Haare است: بدون حرف تعریف و با اسم جمع، پایانهٔ -e می‌آید.'
  de.a1.unit55.lesson03.teach.wie_sieht_anna:
    title: آنا چه شکلی است؟
    gloss: آنا چه شکلی است؟
    note: '*Wie sieht ... aus?* سؤال اصلی این واحد است. فعل *aussehen* جدا می‌شود: sieht ... aus.'
  de.a1.unit55.lesson03.teach.anna_hat_lange:
    title: آنا موهای بلوند بلند و چشم‌های آبی دارد
    gloss: آنا موهای بلوند بلند و چشم‌های آبی دارد.
    note: یک جواب نمونه که مو و چشم را با *und* در یک جمله کنار هم می‌آورد.
  de.a1.unit55.lesson04.teach.anna_ein_neues:
    title: آنا نینا را معرفی می‌کند
    gloss: 'آنا: یک دختر تازه به کافهٔ زبان می‌آید. اسمش نینا است.'
    note: '*Ein neues Mädchen kommt* برای معرفی کسی تازه است. بعد از *kommt*، جهتِ *ins* (در das) Sprachcafé مفعولی (آکوزاتیو) می‌گیرد.'
  de.a1.unit55.lesson04.teach.felix_okay_wie:
    title: فلیکس می‌پرسد چه شکلی است
    gloss: 'فلیکس: باشه! چه شکلی است؟'
    note: 'همان سؤال اصلی این واحد، این بار با *sie* (او، زن) به جای اسم: wie sieht sie aus?'
  de.a1.unit55.lesson04.teach.anna_sie_ist:
    title: آنا قد و موی نینا را توصیف می‌کند
    gloss: 'آنا: کوتاه‌قد است و موهای بلوند کوتاه دارد.'
    note: '*klein* با واژه‌های مو در درس دوم ترکیب شده است. *sie* دوم حذف می‌شود: sie ist klein und hat ...'
  de.a1.unit55.lesson04.teach.felix_und_ihre:
    title: فلیکس دربارهٔ چشم‌هایش می‌پرسد
    gloss: 'فلیکس: چشم‌هایش چی؟'
    note: '*Ihre* اینجا یعنی «مال او (زن)» (صفت ملکی) و شکلی از «شما» نیست. با اسم جمع Augen مطابقت دارد.'
  de.a1.unit55.lesson04.teach.anna_sie_hat:
    title: آنا چشم‌های Nina را توصیف می‌کند
    gloss: 'آنا: چشم‌هایش سبز است.'
    note: عبارت *grüne Augen* را از درس ۳ می‌شناسید.
  de.a1.unit55.lesson04.teach.felix_danke_dann:
    title: Felix او را تشخیص می‌دهد
    gloss: 'Felix: ممنون! پس حتماً تشخیصش می‌دهم.'
    note: '*Dann erkenne ich sie bestimmt* یعنی «پس حتماً تشخیصش می‌دهم». بعد از *dann* فعل در جایگاه دوم می‌آید: dann erkenne ich sie.'
  de.a1.unit55.lesson05.teach.jonas_und_lena:
    title: مقایسهٔ Jonas و Lena
    gloss: Jonas و Lena برادر و خواهرند، اما قیافه‌شان فرق می‌کند. Jonas قدکوتاه است و موهای کوتاه قهوه‌ای و چشم‌های قهوه‌ای دارد. Lena از Jonas قدبلندتر است و موهای بلند قهوه‌ای و چشم‌های سبز دارد. شما چه شکلی هستید؟
    note: یک مقایسه‌ی کوتاه که همه‌ی واژه‌های رنگ و طولِ تا اینجا را دوباره به کار می‌برد و با سؤال اصلی این بخش خطاب به خواننده تمام می‌شود.
    glosses:
      Bruder: برادر
      Schwester: خواهر
      sehen: به نظر رسیدن
      unterschiedlich: متفاوت
      klein: کوتاه‌قد
      kurze: کوتاه‌قد
      braune: قهوه‌ای
      Haare: مو
      Augen: چشم‌ها
      größer: قدبلندتر
      lange: بلند
      grüne: سبز
      aus: (بخشی از فعل aussehen = ظاهر داشتن، به نظر رسیدن)
  de.a1.unit55.lesson05.teach.das_muster_kennst:
    title: دوباره صفت تفضیلی
    gloss: 'الگوی «صفت + -er + als» (از) را از قبل می‌شناسید. اینجا برای آدم‌ها به کار می‌رود: Lena از Jonas قدبلندتر است.'
    note: 'همان الگوی *-er + als* از درس مقایسه‌ها. Groß به größer تبدیل می‌شود: مصوت اومlaut می‌گیرد.'
  de.a1.unit55.lesson05.teach.lena_hat_laengere:
    title: موهای Lena از موهای Jonas بلندتر است
    gloss: موهای Lena از موهای Jonas بلندتر است.
    note: '*Längere Haare*: länger پیش از اسم جمعِ بدون حرف تعریف، پسوند -e می‌گیرد، و lang در حالت تفضیلی اومlaut پیدا می‌کند.'
  de.a1.unit55.lesson05.teach.ich_habe_kurze:
    title: موی من کوتاه و قهوه‌ای است
    gloss: موی من کوتاه و قهوه‌ای است.
    note: یک جملهٔ نمونه با *Ich habe ...* که می‌توانید برای توصیف ظاهر خودتان از آن استفاده کنید.
  de.a1.unit55.lesson06.teach.felix_schau_mal:
    title: Felix، Nina را می‌بیند
    gloss: 'Felix: ببین، این Nina است؟ موهای کوتاه بلوند و چشم‌های سبز دارد.'
    note: '*Schau mal* (یه نگاه بنداز) راهی صمیمی برای نشان دادن چیزی است. این شکل امری برای du است.'
  de.a1.unit55.lesson06.teach.anna_ja_das:
    title: آنا تأیید می‌کند
    gloss: 'آنا: آره، Nina است!'
    note: یک تأیید کوتاه و طبیعی.
  de.a1.unit55.lesson06.teach.nina_hallo_bist:
    title: Nina به Felix سلام می‌کند
    gloss: 'Nina: سلام، تو Felix هستی؟'
    note: 'یک سؤال ساده و صمیمی: *bist du ...?* (تو ... هستی؟). Bist شکل du فعل sein است.'
  de.a1.unit55.lesson06.teach.felix_ja_freut:
    title: Felix جواب سلام را می‌دهد
    gloss: 'Felix: بله! از آشنایی با تو خوشحالم، Nina.'
    note: '*Freut mich* عبارت معمول برای اولین دیدار است، مثل واحد ۲. برای کسی که از قبل می‌شناسید می‌گویید *Schön, dich zu sehen*.'
  de.a1.unit55.lesson06.teach.nina_freut_mich:
    title: نینا هم همین را می‌گوید
    gloss: 'نینا: منم از آشنایی باهات خوشحالم!'
    note: گفت‌وگو را تمام می‌کند؛ Felix با توصیف قبلی آنا، Nina را درست تشخیص داد.
