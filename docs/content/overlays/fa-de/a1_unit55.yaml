course:
  title: آلمانی A1
  description: 'آلمانی مقدماتی برای توصیف ظاهر اولیهٔ یک آدم: قد و حس سن، رنگ مو و چشم، سؤال اصلی Wie sieht ... aus? و مقایسهٔ ظاهر دو نفر.'
