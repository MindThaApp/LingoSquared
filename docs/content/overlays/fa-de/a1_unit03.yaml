    note: اعداد ۵ تا ۱۰ در زبان آلمانی.
    example_gloss:
    - من پنج تا سیب دارم.
    - من شش تا سیب دارم.
    - من هفت تا سیب دارم.
    - من هشت تا سیب دارم.
    - من نه تا سیب دارم.
    - من ده تا سیب دارم.
  de.a1.unit03.lesson02.teach.elf_zwoelf:
    title: elf, zwölf
    gloss: یازده، دوازده
    note: '*elf* و *zwölf* بی‌قاعده هستند و از الگوی اعداد ۱۳ به بعد پیروی نمی‌کنند؛ درست مثل «یازده» و «دوازده» در فارسی که از الگوی بقیهٔ اعداد پیروی نمی‌کنند.'
    example_gloss:
    - شمارهٔ خانهٔ من یازده است.
    - شمارهٔ خانهٔ من دوازده است.
  de.a1.unit03.lesson02.teach.dreizehn_bis_sechzehn:
    title: dreizehn, vierzehn, fünfzehn, sechzehn
    gloss: سیزده، چهارده، پانزده، شانزده
    note: 'از ۱۳ به بعد، عددهای آلمانی از رقم پایه + *-zehn* ساخته می‌شوند، درست مثل «سیزده» و «چهارده» در فارسی که آخرشان «ده» دارد. پسوند آلمانی همیشه -zehn است، نه *-teen*. حواستان باشد: *sechzehn* درست است، نه *sechszehn*؛ حرف *s* حذف می‌شود.'
    example_gloss:
    - شمارهٔ خانهٔ من سیزده است.
    - شمارهٔ خانهٔ من چهارده است.
    - شمارهٔ خانهٔ من پانزده است.
    - شمارهٔ خانهٔ من شانزده است.
  de.a1.unit03.lesson02.teach.siebzehn_bis_zwanzig:
    title: siebzehn, achtzehn, neunzehn, zwanzig
    gloss: هفده، هجده، نوزده، بیست
    note: به *siebzehn* دقت کنید، نه *siebenzehn*؛ پسوند *-en* در *sieben* قبل از *-zehn* حذف می‌شود.
    example_gloss:
    - شمارهٔ خانهٔ من هفده است.
    - شمارهٔ خانهٔ من هجده است.
    - شمارهٔ خانهٔ من نوزده است.
    - شمارهٔ خانهٔ من بیست است.
  de.a1.unit03.lesson03.teach.dreissig_bis_fuenfzig:
    title: dreißig, vierzig, fünfzig
    gloss: سی، چهل، پنجاه
    note: به *dreißig* دقت کنید، نه *dreizig*؛ عدد ۳۰ به جای *-zig* به *-ßig* ختم می‌شود (عدد ۲۰ یعنی *zwanzig* هم بی‌قاعده است).
    example_gloss:
    - این سی یورو است.
    - این چهل یورو است.
    - این پنجاه یورو است.
  de.a1.unit03.lesson03.teach.sechzig_bis_neunzig:
    title: sechzig, siebzig, achtzig, neunzig
    gloss: شصت، هفتاد، هشتاد، نود
    note: 'از ۴۰ به بعد الگو منظم است: رقم + *-zig* (با همان کوتاه‌شدن‌های *sech-* و *sieb-* مثل اعداد ۱۳ تا ۱۹).'
    example_gloss:
    - این شصت یورو است.
    - این هفتاد یورو است.
    - این هشتاد یورو است.
    - این نود یورو است.
  de.a1.unit03.lesson03.teach.hundert:
    title: hundert
    gloss: صد
    note: '*hundert* به‌تنهایی یعنی «صد»؛ لازم نیست قبلش *ein* بگذارید (*einhundert* هم درست است، ولی در گفتار روزمره کمتر به کار می‌رود).'
    example_gloss: این صد یورو است.
  de.a1.unit03.lesson03.teach.einundzwanzig:
    title: einundzwanzig
    gloss: بیست و یک
    note: 'در آلمانی، اعداد مرکب ۲۱ تا ۹۹ این‌طور ساخته می‌شوند: رقم یکان + *und* («و») + رقم دهگان، همه به‌صورت یک کلمه. یعنی ترتیب برعکس فارسی است که اول دهگان را می‌گوییم. *einundzwanzig* = *ein* (یک) + *und* (و) + *zwanzig* (بیست)، یعنی تحت‌اللفظی «یک و بیست».'
  de.a1.unit03.lesson03.teach.zweiunddreissig:
    title: zweiunddreißig
    gloss: سی و دو
    note: 'همان الگو: *zwei* (دو) + *und* + *dreißig* (سی) = «دو و سی» = ۳۲.'
  de.a1.unit03.lesson04.teach.wie_alt_sind_sie:
    title: Wie alt sind Sie?
    gloss: شما چند سال دارید؟ (رسمی)
    note: '*alt* یعنی «پیر، مسن»؛ تحت‌اللفظی یعنی «چقدر سن دارید».'
  de.a1.unit03.lesson04.teach.wie_alt_bist_du:
    title: Wie alt bist du?
    gloss: تو چند سالته؟ (صمیمی)
    note: شکل صمیمی که با *du* ساخته می‌شود.
  de.a1.unit03.lesson04.teach.ich_bin_jahre_alt:
    title: Ich bin achtundzwanzig Jahre alt.
    gloss: من بیست و هشت سال دارم.
    note: '*Jahre alt* (سال سن) همیشه بعد از عدد می‌آید. در آلمانی سن را با ساختار «من ... سال سن دارم» می‌گویند، یعنی از فعل sein (بودن) استفاده می‌شود، نه «داشتن» مثل فارسی.'
  de.a1.unit03.lesson05.teach.line01:
    title: فلیکس از آنا سنش را می‌پرسد
    gloss: 'فلیکس می‌گوید: ببخشید، می‌شود بپرسم شما چند سال دارید؟'
    note: '*wenn ich fragen darf* («اگر اجازه بدهید بپرسم») سؤالی را که ممکن است کمی رک به نظر برسد ملایم‌تر می‌کند؛ نشانهٔ ادب که با لحن رسمی *Sie* بین آن‌ها هم‌خوان است.'
  de.a1.unit03.lesson05.teach.line02:
    title: آنا جواب می‌دهد و سؤال را برمی‌گرداند
    gloss: 'آنا می‌گوید: من بیست و هشت سال دارم. شما چطور؟'
    note: آنا سنش را می‌گوید و همان سؤال را برمی‌گرداند، مثل الگوی درس دوم.
  de.a1.unit03.lesson05.teach.line03:
    title: فلیکس جواب می‌دهد
    gloss: 'فلیکس می‌گوید: من سی و یک سال دارم.'
    note: پس معلوم می‌شود فلیکس سه سال از آنا بزرگ‌تر است.
