  de.a1.unit17.lesson01.teach.kopfschmerzen:
    title: Kopfschmerzen
    gloss: سردرد
    note: '*Kopfschmerzen* از نظر شکل جمع است، ولی برای «یک سردرد» به کار می‌رود.'
    example_gloss: سردرد دارم.
  de.a1.unit17.lesson01.teach.bauchschmerzen:
    title: Bauchschmerzen
    gloss: دل‌درد
    note: '*Bauch* یعنی شکم و دل؛ *Schmerzen* یعنی دردها.'
    example_gloss: من دل‌درد دارم.
  de.a1.unit17.lesson01.teach.hals:
    title: Hals
    gloss: گلو / گردن
    note: '*Hals* بسته به موقعیت یعنی گلو یا گردن.'
    example_gloss: گلویم درد می‌کند.
  de.a1.unit17.lesson01.teach.weh:
    title: Mein Kopf tut weh.
    gloss: سرم درد می‌کند.
    note: 'در آلمانی می‌گویند عضو بدن «درد می‌کند» با عبارت *tut weh*؛ در فارسی هم عضو بدن فاعل جمله است: «سرم درد می‌کند».'
    example_gloss: شکمم درد می‌کند.
  de.a1.unit17.lesson01.teach.mir_ist_schlecht:
    title: Mir ist schlecht.
    gloss: حالم بد است.
    note: آن را کلمه‌به‌کلمه ترجمه نکنید؛ *Mir ist schlecht* عبارت طبیعی برای «حالم بد است» است.
    example_gloss: حالم بد است؛ دل‌درد دارم.
  de.a1.unit17.lesson02.teach.brauchen_sie_hilfe:
    title: Brauchen Sie Hilfe?
    gloss: کمک لازم دارید؟
    note: '*Sie* رسمی سؤال را مؤدبانه نگه می‌دارد.'
  de.a1.unit17.lesson02.teach.ich_brauche:
    title: Ich brauche Wasser.
    gloss: من آب لازم دارم.
    note: '*brauche* یعنی «لازم دارم»، نه «استفاده می‌کنم».'
    example_gloss: 'در موقعیت واقعی: من آب و یک استراحت لازم دارم.'
  de.a1.unit17.lesson02.teach.pause:
    title: Pause
    gloss: استراحت / وقفه
    note: '*eine Pause* یعنی یک استراحت یا وقفه‌ی کوتاه.'
    example_gloss: من یک استراحت لازم دارم.
  de.a1.unit17.lesson02.teach.health_instruction:
    title: Trinken Sie Wasser.
    gloss: آب بنوشید. کمی استراحت کنید.
    note: '*Sie* رسمی دستور را مؤدبانه نگه می‌دارد.'
    example_gloss: کمی استراحت کنید.
  de.a1.unit17.lesson02.teach.gesundheit_text:
    title: مشکل آنا
    gloss: مشکل آنا
    note: متن کوتاه علامت بیماری و نیاز فوری را می‌گوید.
    example_gloss: او آب لازم دارد.
  de.a1.unit17.lesson02.teach.line01:
    title: فلیکس از حال آنا می‌پرسد
    gloss: 'فلیکس: آنا، حالتان خوب است؟'
    note: فلیکس با آنا رسمی صحبت می‌کند و *Ihnen* می‌گوید.
  de.a1.unit17.lesson02.teach.line02:
    title: آنا مشکلش را می‌گوید
    gloss: 'آنا: نه، سردرد دارم.'
    note: جواب، علامت بیماری را ساده می‌گوید.
  de.a1.unit17.lesson02.teach.line03:
    title: فلیکس کمک پیشنهاد می‌دهد
    gloss: 'فلیکس: کمک لازم دارید؟'
    note: یک پیشنهاد ساده‌ی کمک.
  de.a1.unit17.lesson02.teach.line04:
    title: آنا می‌گوید چه لازم دارد
    gloss: 'آنا: بله، لطفاً. آب و یک استراحت لازم دارم.'
    note: جواب با *Ja, bitte* شروع می‌شود و نیازهای فوری را می‌گوید.
    example_gloss: 'در موقعیت واقعی: آب و یک استراحت لازم دارم.'
