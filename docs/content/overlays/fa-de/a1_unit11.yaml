course:
  title: آلمانی A1
  description: آلمانی در سطح A1 را برای گفت‌وگوهای روزمره یاد بگیرید، با توضیحات فارسی.
units:
  de.a1.unit11.alltag:
    title: برنامه‌ی روزانه
teaching:
  de.a1.unit11.lesson01.teach.aufstehen:
    title: aufstehen
    gloss: بیدار شدن، از خواب بلند شدن
    note: '*aufstehen* جداشدنی است: در *Ich stehe ... auf*، *auf* به آخر جمله می‌رود.'
    example_gloss: 'در جمله: ساعت هفت بیدار می‌شوم.'
  de.a1.unit11.lesson01.teach.fruehstuecken:
    title: frühstücken
    gloss: صبحانه خوردن
    note: '*frühstücken* فعل باقاعده‌ای است به معنی صبحانه خوردن.'
    example_gloss: شما کی صبحانه می‌خورید؟
  de.a1.unit11.lesson01.teach.arbeiten:
    title: arbeiten
    gloss: کار کردن
    note: '*arbeiten* پایانِ معمولِ *ich* را می‌گیرد: *ich arbeite*.'
    example_gloss: 'در جمله: بعدازظهر کار می‌کنم.'
  de.a1.unit11.lesson01.teach.lernen:
    title: lernen
    gloss: یاد گرفتن / درس خواندن
    note: '*lernen* وقتی مفعولش یک درس یا زبان مثل آلمانی باشد، به معنی «خواندن» هم هست.'
    example_gloss: 'در جمله: شب‌ها آلمانی می‌خوانم.'
  de.a1.unit11.lesson01.teach.schlafen:
    title: schlafen gehen
    gloss: خوابیدن / به رختخواب رفتن
    note: '*schlafen gehen* یعنی برای خواب شبانه به رختخواب رفتن.'
    example_gloss: 'در جمله: ساعت ده می‌خوابم.'
  de.a1.unit11.lesson01.teach.dann:
    title: Dann frühstücke ich.
    gloss: بعد صبحانه می‌خورم.
    note: 'در آلمانی بعد از *dann* معمولاً فعل بلافاصله می‌آید: *Dann frühstücke ich*، نه *Dann ich frühstücke*. در فارسی فاعل معمولاً قبل از فعل می‌آید، ولی در آلمانی بعد از dann فعل جلوتر از فاعل قرار می‌گیرد.'
  de.a1.unit11.lesson02.teach.wann_stehen_sie_auf:
    title: Wann stehen Sie auf?
    gloss: شما چه ساعتی بیدار می‌شوید؟
    note: سؤال رسمی با *Sie*؛ جزء جداشدنی *auf* آخر جمله می‌آید.
  de.a1.unit11.lesson02.teach.ich_stehe_auf:
    title: Ich stehe um sieben Uhr auf.
    gloss: ساعت هفت بیدار می‌شوم.
    note: '*um* برای بیان ساعت به کار می‌رود.'
  de.a1.unit11.lesson02.teach.am_nachmittag:
    title: am Nachmittag
    gloss: بعدازظهر
    note: '*am* با بخش‌های روز به کار می‌رود، مثل *am Nachmittag* و *am Abend*.'
    example_gloss: 'در جمله: بعدازظهر کار می‌کنم.'
  de.a1.unit11.lesson02.teach.routine_text:
    title: Annas Tag
    gloss: روز آنا
    note: یک متن کوتاه درباره برنامه روزانه، کارها را با ساعت‌ها به هم وصل می‌کند.
    example_gloss: 'در جمله: عصر آلمانی می‌خواند. در آلمانی am Abend اول جمله می‌آید و بعد از آن فعل قرار می‌گیرد، نه فاعل.'
  de.a1.unit11.lesson02.teach.line01:
    title: فلیکس درباره برنامه روزانه می‌پرسد
    gloss: 'فلیکس: شما چه ساعتی بیدار می‌شوید؟'
    note: فلیکس رسمی درباره برنامه روزانه آنا می‌پرسد.
  de.a1.unit11.lesson02.teach.line02:
    title: آنا صبح خودش را توضیح می‌دهد
    gloss: 'آنا: ساعت هفت بیدار می‌شوم. بعد صبحانه می‌خورم.'
    note: دو کار روزمره به ترتیب.
    example_gloss: 'در جمله: ساعت هفت بیدار می‌شوم.'
  de.a1.unit11.lesson02.teach.line03:
    title: فلیکس درباره کار می‌پرسد
    gloss: 'فلیکس: امروز کار می‌کنید؟'
    note: '*Sie* رسمی با شکل فعلی *arbeiten*.'
  de.a1.unit11.lesson02.teach.line04:
    title: آنا بقیه روزش را توضیح می‌دهد
    gloss: 'آنا: بله، بعدازظهر در کافه کار می‌کنم. عصر آلمانی می‌خوانم و ساعت ده می‌خوابم.'
    note: برای گفتن برنامه روزانه می‌شود از چند جمله کوتاه پشت سر هم استفاده کرد.
    example_gloss: 'در جمله: بله، بعدازظهر در کافه کار می‌کنم.'
