units:
  de.a1.unit10.wegbeschreibungen:
    title: پرسیدن و دنبال کردن آدرس
teaching:
  de.a1.unit10.lesson01.teach.links_abbiegen:
    title: Biegen Sie links ab.
    gloss: به چپ بپیچ.
    note: '*abbiegen* (پیچیدن) فعل جداشدنی است: پیشوند *ab* به آخر جمله می‌رود: *Biegen Sie... ab*، نه *Sie biegen ab* و نه *Abbiegen Sie*.'
  de.a1.unit10.lesson01.teach.rechts_abbiegen:
    title: Biegen Sie rechts ab.
    gloss: به راست بپیچ.
    note: همان الگوی فعل جداشدنی *links abbiegen* است، فقط این بار با *rechts* (راست).
  de.a1.unit10.lesson01.teach.geradeaus_gehen:
    title: Gehen Sie geradeaus.
    gloss: مستقیم برو.
    note: '*geradeaus* یعنی «مستقیم». این‌جا پیشوند جداشدنی نداریم و امرِ رسمی ساده‌تر است.'
  de.a1.unit10.lesson01.teach.hier_anhalten:
    title: Halten Sie hier an.
    gloss: همین‌جا بایستید.
    note: '*anhalten* (ایستادن، توقف کردن) هم جداشدنی است: *an* به آخر جمله می‌رود، مثل *abbiegen*.'
  de.a1.unit10.lesson01.teach.ecke:
    title: Ecke
    gloss: گوشه، سر نبش
    note: '*Ecke* یعنی گوشه یا نبش؛ اسم مؤنث است: *die Ecke*.'
    example_gloss: سر نبش به چپ بپیچید.
  de.a1.unit10.lesson02.teach.wie_komme_ich_zur_bank:
    title: Wie komme ich zur Bank?
    gloss: چطور به بانک برسم؟
    note: '*zur* مخفف *zu der* است (حالت داتیو، مؤنث، die Bank). الگوی ادغام آن مثل *vom* (von + dem) در درس ۹ است.'
  de.a1.unit10.lesson02.teach.geradeaus_dann_links:
    title: Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.
    gloss: مستقیم بروید، بعد سر نبش به چپ بپیچید.
    note: '*dann* (بعد) دو مرحله‌ی مسیر را به هم وصل می‌کند؛ *an der Ecke* (سر نبش) از حرف تعریف داتیوِ مؤنث استفاده می‌کند، مثل الگوی حرف اضافه‌ی مکان در درس ۹.'
  de.a1.unit10.lesson02.teach.ist_es_weit:
    title: Ist es weit?
    gloss: دوره؟
    note: '*weit* یعنی دور.'
  de.a1.unit10.lesson02.teach.zwei_minuten:
    title: Es ist nur zwei Minuten von hier.
    gloss: فقط دو دقیقه از اینجا فاصله دارد.
    note: '*nur* یعنی «فقط».'
  de.a1.unit10.lesson02.teach.nicht_verfehlen:
    title: Das können Sie nicht verfehlen.
    gloss: حتماً پیداش می‌کنید.
    note: '*verfehlen* یعنی «پیدا نکردن، گم کردن». تحت‌اللفظی: «این را شما نمی‌توانید گم کنید.»'
  de.a1.unit10.lesson03.teach.erste_strasse:
    title: Nehmen Sie die erste Straße links.
    gloss: اولین خیابان سمت چپ را بگیرید.
    note: '*erste* یعنی «اول»؛ عدد ترتیبی است.'
  de.a1.unit10.lesson03.teach.zweite_strasse:
    title: Nehmen Sie die zweite Straße rechts.
    gloss: دومین خیابان سمت راست را بگیرید.
    note: '*zweite* یعنی «دوم».'
  de.a1.unit10.lesson03.teach.route_text:
    title: Wegbeschreibung zur Apotheke
    gloss: آدرس دادن برای رسیدن به داروخانه
    note: چند جمله‌ی کوتاهِ مسیر که از عبارت‌های آموخته‌شده ساخته شده است.
  de.a1.unit10.lesson04.teach.line01:
    title: فلیکس آدرس می‌پرسد
    gloss: 'فلیکس: ببخشید، چطور به بانک برسم؟'
    note: همان شروع مؤدبانه‌ی درس ۹، فقط این بار برای پرسیدن مسیر، نه فقط مکان.
  de.a1.unit10.lesson04.teach.line02:
    title: آنا مسیر را می‌گوید
    gloss: 'آنا: مستقیم بروید، بعد سر نبش به چپ بپیچید.'
    note: یک جواب کامل دو مرحله‌ی مسیر را با *dann* به هم وصل می‌کند.
  de.a1.unit10.lesson04.teach.line03:
    title: فلیکس مسیر را تأیید می‌کند و بیشتر می‌پرسد
    gloss: 'فلیکس: سر نبش به چپ، باشه. دور است؟'
    note: فلیکس مسیر را تکرار می‌کند تا مطمئن شود درست فهمیده، بعد یک سؤال طبیعی می‌پرسد.
  de.a1.unit10.lesson04.teach.line04:
    title: آنا فاصله را می‌گوید
    gloss: 'آنا: نه، فقط دو دقیقه از اینجا فاصله دارد. حتماً پیداش می‌کنید.'
    note: یک جواب کامل و اطمینان‌بخش.
