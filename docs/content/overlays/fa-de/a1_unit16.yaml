    gloss: 'کارمند: قطار ساعت نه از سکوی سه حرکت می‌کند.'
    note: مهم‌ترین اطلاعات سفر، ساعت و سکو هستند.
  de.a1.unit16.lesson02.teach.line05:
    title: فلیکس می‌پرسد سکو کجاست
    gloss: 'فلیکس: ممنون. سکوی سه کجاست؟'
    note: یک سؤال کاربردی بعدی در ایستگاه.
    example_gloss: 'در موقعیت واقعی: سکوی سه کجاست؟'
  de.a1.unit16.lesson02.teach.line06:
    title: کارمند راه را نشان می‌دهد
    gloss: 'کارمند: مستقیم بروید و بعد به راست.'
    note: در سفر می‌شود از عبارت‌های جهت‌یابی درس ۱۰ دوباره استفاده کرد.
