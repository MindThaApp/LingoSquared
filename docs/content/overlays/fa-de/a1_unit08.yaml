course:
  title: آلمانی A1
  description: آلمانی در سطح A1 را برای احوال‌پرسی‌های روزمره و گفت‌وگوهای کوتاه اجتماعی یاد بگیرید، با توضیحات کامل به فارسی.
units:
  de.a1.unit08.einkaufen:
    title: 'خرید: قیمت‌ها و مقدارها'
teaching:
  de.a1.unit08.lesson01.teach.ein_pfund:
    title: ein Pfund Äpfel
    gloss: نیم‌کیلو سیب
    note: در آلمان *Pfund* هنوز در گفتار غیررسمی زیاد به کار می‌رود. یک *Pfund* آلمانی دقیقاً ۵۰۰ گرم (نیم‌کیلو) است، با اینکه واحدهای رسمی کشور متریک است.
  de.a1.unit08.lesson01.teach.ein_dutzend:
    title: ein Dutzend Eier
    gloss: یک دوجین تخم‌مرغ
    note: '*Dutzend* یعنی دوجین (دوازده‌تا).'
  de.a1.unit08.lesson01.teach.eine_flasche:
    title: eine Flasche Wasser
    gloss: یک بطری آب
    note: '*Flasche* یعنی بطری.'
  de.a1.unit08.lesson01.teach.eine_tuete:
    title: eine Tüte Reis
    gloss: یک کیسه برنج
    note: '*Tüte* یعنی کیسه.'
  de.a1.unit08.lesson01.teach.ein_kilo:
    title: ein Kilo Tomaten
    gloss: یک کیلو گوجه‌فرنگی
    note: '*Kilo* واحد استاندارد وزن در سیستم متریک است و برای مقدارهای غیر از خریدهای روزمره و کوچک، خیلی بیشتر از *Pfund* به کار می‌رود.'
  de.a1.unit08.lesson02.teach.was_kosten_die_aepfel:
    title: Was kosten die Äpfel?
    gloss: سیب‌ها چند است؟
    note: '*kosten* یعنی «قیمت داشتن». جمله تحت‌اللفظی می‌شود «سیب‌ها چه قیمتی دارند؟»'
  de.a1.unit08.lesson02.teach.sie_kosten_zwei_euro:
    title: Sie kosten zwei Euro das Pfund.
    gloss: کیلویی ... نه، نیم‌کیلویی دو یورو.
    note: '*Sie* اینجا یعنی «آن‌ها» (اشاره به سیب‌ها) و *Sie* محترمانهٔ «شما» نیست. *Sie* محترمانه و sie به معنی «آن‌ها» فعل یکسانی می‌گیرند (*kosten*) و اول جمله هر دو با حرف بزرگ نوشته می‌شوند. پس فقط از روی موقعیت می‌فهمیم: اینجا دربارهٔ سیب‌ها حرف می‌زنیم، نه دربارهٔ یک شخص.'
  de.a1.unit08.lesson02.teach.kann_ich_zwei_pfund:
    title: Kann ich zwei Pfund haben, bitte?
    gloss: می‌شود یک کیلو بدهید، لطفاً؟
    note: یک الگوی مؤدبانه برای درخواست، شبیه *Ich möchte..., bitte* از درس هفتم.
  de.a1.unit08.lesson02.teach.ist_es_frisch:
    title: Ist es frisch?
    gloss: تازه است؟
    note: '*frisch* یعنی تازه. *es* برای اسم خنثی است (مثل das Brot). برای اسم مذکر می‌گویید *Ist er frisch?* (der Reis) و برای اسم مؤنث *Ist sie frisch?* (die Milch). ضمیر با جنسیت اسم عوض می‌شود و همیشه *es* نیست.'
  de.a1.unit08.lesson03.teach.pro_pfund:
    title: pro Pfund
    gloss: نیم‌کیلویی
    note: '*pro* یعنی «به ازای هر» و هم روی برچسب قیمت‌ها و هم در گفتار برای گفتن قیمت به کار می‌رود.'
    example_gloss: سیب‌ها نیم‌کیلویی دو یورو است.
  de.a1.unit08.lesson03.teach.preisschild_text:
    title: Markt-Preisschild
    gloss: تابلوی قیمت بازار
    note: یک تابلوی قیمت ساده که سه کالا را با قیمت واحدشان نشان می‌دهد.
  de.a1.unit08.lesson04.teach.das_macht_acht_euro:
    title: Das macht acht Euro.
    gloss: می‌شود هشت یورو.
    note: '*Das macht...* روش معمول گفتن مبلغ کل است که در درس هفتم هم دیده‌اید.'
  de.a1.unit08.lesson04.teach.line01:
    title: فلیکس قیمت را می‌پرسد
    gloss: 'فلیکس می‌گوید: سیب‌ها چند است؟'
    note: همان سؤال درس دوم، این بار در یک گفتگوی واقعی.
  de.a1.unit08.lesson04.teach.line02:
    title: آنا قیمت را می‌گوید
    gloss: 'آنا می‌گوید: نیم‌کیلویی دو یورو.'
    note: یک جواب کامل، قیمت را به ازای هر واحد می‌گوید.
  de.a1.unit08.lesson04.teach.line03:
    title: فلیکس سفارش می‌دهد
    gloss: 'فلیکس می‌گوید: باشه، می‌شود یک کیلو بدهید، لطفاً؟'
    note: '*Gut* اینجا یعنی «باشه / خوب است» و فلیکس قبل از سفارش، قیمت را قبول می‌کند.'
  de.a1.unit08.lesson04.teach.line04:
    title: آنا می‌پرسد چیز دیگری می‌خواهد یا نه
    gloss: 'آنا می‌گوید: البته. چیز دیگری هم می‌خواهید؟'
    note: '*Natürlich* یعنی «البته / طبیعتاً».'
  de.a1.unit08.lesson04.teach.line05:
    title: فلیکس بیشتر سفارش می‌دهد
    gloss: 'فلیکس می‌گوید: بله، یک دوجین تخم‌مرغ هم.'
    note: '*auch* یعنی «هم / همچنین».'
  de.a1.unit08.lesson04.teach.line06:
    title: آنا مبلغ کل را می‌گوید
    gloss: 'آنا می‌گوید: می‌شود هشت یورو.'
    note: دو پوند سیب (۴ یورو) به‌علاوهٔ یک دوجین تخم‌مرغ (۴ یورو) در مجموع هشت یورو می‌شود.
