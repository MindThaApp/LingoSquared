teaching:
  de.a1.unit01.lesson01.teach.hallo:
    title: Hallo
    gloss: سلام
    note: '*Hallo* یک سلام دوستانه و همه‌کاره است که در هر ساعتی از روز می‌شود به کار برد.'
    example_gloss: سلام فلیکس!
  de.a1.unit01.lesson01.teach.guten_morgen:
    title: Guten Morgen
    gloss: صبح بخیر
    note: '*Guten Morgen* را صبح‌ها و تقریباً تا نزدیک ظهر می‌گویند.'
  de.a1.unit01.lesson01.teach.guten_tag:
    title: Guten Tag
    gloss: روز بخیر / سلام
    note: '*Guten Tag* سلام معمولی و کمی رسمی‌تر روزهاست و از اواخر صبح تا بعدازظهر به کار می‌رود.'
  de.a1.unit01.lesson01.teach.guten_abend:
    title: Guten Abend
    gloss: عصر بخیر
    note: '*Guten Abend* را هنگام رسیدن به جایی در عصر یا شب می‌گویند؛ سلام است، نه خداحافظی.'
  de.a1.unit01.lesson02.teach.tschuss:
    title: Tschüss
    gloss: خداحافظ
    note: '*Tschüss* روش خودمانی و بسیار رایج خداحافظی بین دوستان و آشناهاست.'
    example_gloss: خداحافظ، به‌زودی می‌بینمت!
  de.a1.unit01.lesson02.teach.auf_wiedersehen:
    title: Auf Wiedersehen
    gloss: خداحافظ (رسمی)
    note: '*Auf Wiedersehen* به معنای واقعی یعنی «تا دیدار دوباره»؛ خداحافظی معمول و رسمی‌تر است و با غریبه‌ها یا در محیط کاری به کار می‌رود.'
  de.a1.unit01.lesson02.teach.bis_bald:
    title: Bis bald
    gloss: به‌زودی می‌بینمت
    note: '*Bis bald* روش دوستانه خداحافظی است، وقتی انتظار دارید به‌زودی دوباره طرف مقابل را ببینید.'
  de.a1.unit01.lesson02.teach.bis_spater:
    title: Bis später
    gloss: بعداً می‌بینمتون
    note: '*Bis später* را وقتی می‌گویند که همان روز، دیرتر، دوباره همدیگر را می‌بینید.'
  de.a1.unit01.lesson02.teach.gute_nacht:
    title: Gute Nacht
    gloss: شب بخیر
    note: '*Gute Nacht* را وقتی می‌گویند که کسی می‌خواهد بخوابد یا روزش را تمام می‌کند. برخلاف *Guten Abend*، این یک خداحافظی است، نه سلام.'
  de.a1.unit01.lesson03.teach.sie:
    title: Sie
    gloss: شما (رسمی)
    note: '*Sie* «شما»ی رسمی است که حتی وسط جمله هم با حرف بزرگ نوشته می‌شود و برای غریبه‌ها، بزرگ‌ترها یا موقعیت‌های رسمی و کاری به کار می‌رود. فارسی هم «تو» و «شما» دارد، ولی در آلمانی این تفاوت با فعل و ضمیر دیگری هم همراه است.'
  de.a1.unit01.lesson03.teach.du:
    title: du
    gloss: تو (خودمانی)
    note: '*du* «تو»ی خودمانی است و با دوستان، خانواده و بچه‌ها به کار می‌رود. گفتن *du* به یک غریبه ممکن است بیش از حد صمیمی یا حتی بی‌ادبانه به نظر برسد.'
  de.a1.unit01.lesson03.teach.wie_geht_es_ihnen:
    title: Wie geht es Ihnen?
    gloss: حال شما چطور است؟ (رسمی)
    note: روش رسمی پرسیدن حال کسی؛ *Ihnen* شکل رسمی «شما» در حالت دادی است و با *Sie* هماهنگ است.
  de.a1.unit01.lesson03.teach.wie_gehts:
    title: Wie geht's?
    gloss: حالت چطوره؟ (خودمانی)
    note: '*Wie geht''s* شکل کوتاه‌شده *Wie geht es* است و روش معمول و خودمانی پرسیدن حال کسی است.'
  de.a1.unit01.lesson03.teach.gut_danke:
    title: Gut, danke.
    gloss: خوبم، ممنون.
    note: یک پاسخ ساده و خنثی که در هر دو حالت رسمی و خودمانی می‌شود گفت.
  de.a1.unit01.lesson03.teach.sehr_gut_danke:
    title: Sehr gut, danke.
    gloss: خیلی خوبم، ممنون.
    note: پاسخی پرانرژی‌تر از *Gut, danke.*
  de.a1.unit01.lesson03.teach.und_ihnen:
    title: Und Ihnen?
    gloss: شما چطورید؟ (رسمی)
    note: روش رسمی پرسیدن همان سؤال از طرف مقابل، هماهنگ با *Sie*.
  de.a1.unit01.lesson03.teach.und_dir:
    title: Und dir?
    gloss: تو چطوری؟ (خودمانی)
    note: روش خودمانی پرسیدن همان سؤال از طرف مقابل؛ *dir* شکل خودمانی «تو» در حالت دادی است و با *du* هماهنگ است.
  de.a1.unit01.lesson04.teach.danke:
    title: Danke
    gloss: ممنون
    note: '*Danke* را قبلاً در پاسخ‌ها دیدید؛ اینجا به‌صورت یک کلمه مستقل آمده است.'
    example_gloss: خیلی ممنون!
  de.a1.unit01.lesson04.teach.bitte:
    title: Bitte
    gloss: لطفاً / خواهش می‌کنم
    note: '*Bitte* واقعاً دو معنای رایج دارد: وقتی درخواستی می‌کنید یعنی «لطفاً» و وقتی جواب تشکر است یعنی «خواهش می‌کنم». معنی را از موقعیت می‌فهمید؛ اشتباه یا اتفاقی نیست و هر دو کاربرد کاملاً معمول‌اند.'
    example_gloss:
    - یک قهوه، لطفاً.
    - خواهش می‌کنم، قابل نداشت!
  de.a1.unit01.lesson04.teach.entschuldigung:
    title: Entschuldigung
    gloss: ببخشید / معذرت می‌خواهم
    note: '*Entschuldigung* هم برای جلب‌توجه مؤدبانه کسی به کار می‌رود و هم برای عذرخواهی کوتاه.'
    example_gloss: ببخشید، دستشویی کجاست؟
  de.a1.unit01.lesson04.teach.kein_problem:
    title: Kein Problem
    gloss: مشکلی نیست
    note: پاسخی خودمانی و دوستانه که از نظر لحن شبیه «مشکلی نیست» یا «اشکالی نداره» در فارسی است.
  de.a1.unit01.lesson04.teach.gern_geschehen:
    title: Gern geschehen
    gloss: خواهش می‌کنم
    note: روشی کامل‌تر و صریح‌تر برای گفتن «خواهش می‌کنم» نسبت به *Bitte* که کوتاه‌تر است.
  de.a1.unit01.lesson05.teach.line01:
    title: آنا به فلیکس سلام می‌کند
    gloss: 'آنا می‌گوید: روز بخیر!'
    note: آنا و فلیکس برای اولین بار به‌عنوان همسایه در ساختمان آپارتمانی‌شان همدیگر را می‌بینند.
  de.a1.unit01.lesson05.teach.line02:
    title: فلیکس جواب سلام را می‌دهد و حال او را می‌پرسد
    gloss: 'فلیکس می‌گوید: روز بخیر! حال شما چطور است؟'
    note: فلیکس چون تازه با آنا آشنا شده، از شکل رسمی *Sie* استفاده می‌کند.
  de.a1.unit01.lesson05.teach.line03:
    title: آنا جواب می‌دهد و همان سؤال را می‌پرسد
    gloss: 'آنا می‌گوید: ممنون، خوبم. شما چطورید؟'
    note: آنا جواب می‌دهد و مثل فلیکس، رسمی سؤال را برمی‌گرداند.
  de.a1.unit01.lesson05.teach.line04:
    title: فلیکس جواب می‌دهد
    gloss: 'فلیکس می‌گوید: خیلی خوبم، ممنون.'
    note: پاسخی کمی پرانرژی‌تر از یک *Gut, danke.* ساده.
  de.a1.unit01.lesson05.teach.line05:
    title: آنا خداحافظی می‌کند
    gloss: 'آنا می‌گوید: خداحافظ!'
    note: آنا از خداحافظی رسمی‌تر استفاده می‌کند، مطابق با لحن رسمی *Sie* که از اول گفت‌وگو داشتند.
  de.a1.unit01.lesson05.teach.line06:
    title: فلیکس خداحافظی می‌کند و می‌گوید به‌زودی می‌بینمتان
    gloss: 'فلیکس می‌گوید: خداحافظ، به‌زودی می‌بینمتان!'
    note: فلیکس خداحافظی رسمی را با «به‌زودی می‌بینمتان» ترکیب می‌کند و مثل هر دو نفر در این اولین دیدار، لحن رسمی *Sie* را نگه می‌دارد.
