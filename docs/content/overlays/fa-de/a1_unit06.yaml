    title: Ihr Vater
    gloss: پدر شما (رسمی)
    note: '*Ihr* با حرف بزرگ یعنی «شما» در حالت رسمی و با *Sie* جور است. اسم مذکر *Ihr* می‌گیرد (*Ihr Vater*) و اسم مؤنث *Ihre* (*Ihre Mutter*).'
  de.a1.unit06.lesson02.teach.wer_ist_ihr_vater:
    title: Wer ist Ihr Vater?
    gloss: پدر شما کیست؟ (رسمی)
    note: '*Wer* یعنی «چه کسی».'
  de.a1.unit06.lesson03.teach.das_ist_mein_bruder:
    title: Das ist mein Bruder.
    gloss: این برادر من است.
    note: '*Das ist...* یعنی «این ... است» یا «آن ... است»؛ راه ساده‌ی معرفی کردن یک نفر.'
  de.a1.unit06.lesson03.teach.er_ist_zwanzig:
    title: Er ist zwanzig Jahre alt.
    gloss: او بیست سال دارد.
    note: '*Er* یعنی «او (مرد)». سن را با همان الگوی درس ۳ می‌گویند: عدد + *Jahre alt*.'
  de.a1.unit06.lesson03.teach.ich_habe_zwei_schwestern:
    title: Ich habe zwei Schwestern.
    gloss: من دو تا خواهر دارم.
    note: '*Schwestern* جمع *Schwester* است.'
  de.a1.unit06.lesson03.teach.haben_sie_geschwister:
    title: Haben Sie Geschwister?
    gloss: شما خواهر و برادر دارید؟
    note: '*Geschwister* یعنی «خواهر و برادر» با هم؛ آلمانی برای این معنی یک واژه‌ی رایج دارد.'
  de.a1.unit06.lesson03.teach.nein_einzelkind:
    title: Nein, ich habe keine Geschwister. Ich bin Einzelkind.
    gloss: نه، من خواهر و برادر ندارم. تک‌فرزندم.
    note: '*keine* یعنی «هیچ / نه». *Einzelkind* یعنی «تک‌فرزند»؛ در آلمانی اینجا حرف تعریف نمی‌آید: *Ich bin Einzelkind*.'
  de.a1.unit06.lesson04.teach.foto:
    title: Foto
    gloss: عکس
    example_gloss: من یک عکس دارم.
  de.a1.unit06.lesson04.teach.line01:
    title: فلیکس درباره‌ی عکس می‌پرسد
    gloss: 'فلیکس می‌گوید: این خانواده‌ی شماست؟'
    note: '*Ihre Familie* — *Familie* مؤنث است، برای همین «شما»ی رسمی در اینجا *Ihre* می‌شود.'
  de.a1.unit06.lesson04.teach.line02:
    title: آنا پدر و مادرش را معرفی می‌کند
    gloss: 'آنا می‌گوید: بله. این مادرم است و این هم پدرم.'
  de.a1.unit06.lesson04.teach.line03:
    title: فلیکس می‌پرسد این کیست
    gloss: 'فلیکس می‌گوید: این کیست؟'
  de.a1.unit06.lesson04.teach.line04:
    title: آنا خواهرش را معرفی می‌کند
    gloss: 'آنا می‌گوید: این خواهرم است. خواهرم معلم است.'
    note: 'در آلمانی، مثل فارسی، قبل از شغل حرف تعریف نمی‌آید: *Meine Schwester ist Lehrerin* = «خواهرم معلم است.» *Lehrerin* شکل مؤنث *Lehrer* است.'
  de.a1.unit06.lesson04.teach.line05:
    title: فلیکس درباره‌ی برادرها می‌پرسد
    gloss: 'فلیکس می‌گوید: برادر دارید؟'
    note: '*Brüder* جمع *Bruder* است.'
  de.a1.unit06.lesson04.teach.line06:
    title: آنا جواب می‌دهد
    gloss: 'آنا می‌گوید: نه. من فقط یک خواهر دارم.'
    note: '*nur* یعنی «فقط».'
  de.a1.unit06.lesson04.teach.bildunterschrift:
    title: زیرنویس یک عکس
    gloss: 'خانواده‌ی من: مادرم، پدرم و خواهرم.'
