teaching:
  de.a1.unit54.lesson01.teach.lesen_sport_treiben:
    title: مطالعه، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل رایج سرگرمی: *lesen* (خواندن)، *Sport treiben* (ورزش کردن) و *kochen* (آشپزی کردن). Sport اسم است، برای همین با حرف بزرگ نوشته می‌شود.'
    example_gloss:
    - دوست دارم کتاب بخونم.
    - شنبه‌ها ورزش می‌کنم.
    - دوست دارم برای دوستام آشپزی کنم.
  de.a1.unit54.lesson01.teach.die_freizeit:
    title: اوقات فراغت
    gloss: اوقات فراغت
    note: '*Die Freizeit* اسم مؤنث است: همیشه آن را با حرف تعریف die یاد بگیرید. این واژه برای صحبت درباره سرگرمی‌ها کلیدی است.'
    example_gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
  de.a1.unit54.lesson01.teach.in_meiner_freizeit:
    title: گفتن اینکه در اوقات فراغتتان چه کار می‌کنید
    gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
    note: '*Lese* صورت ich از *lesen* (خواندن) است. جمله با یک عبارت زمانی شروع شده، ولی فعل باز هم در جایگاه دوم است: in meiner Freizeit lese ich gern.'
  de.a1.unit54.lesson02.teach.musik_hoeren_zeichnen:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه عبارت سرگرمی دیگر: *Musik hören* (موسیقی گوش دادن)، *zeichnen* (نقاشی کردن) و *Videospiele spielen* (بازی ویدیویی کردن). Musik و Videospiele اسم‌اند، برای همین با حرف بزرگ نوشته می‌شوند.'
    example_gloss:
    - دوست دارم به موسیقی گوش بدم.
    - من اغلب نقاشی می‌کشم.
    - دوست دارم با دوستام بازی ویدیویی کنم.
  de.a1.unit54.lesson02.teach.ich_hoere_gern:
    title: گفتن اینکه دوست دارید به موسیقی گوش بدید
    gloss: دوست دارم به موسیقی گوش بدم.
    note: در آلمانی *Musik hören* بدون حرف اضافه گفته می‌شود، در حالی که در فارسی می‌گوییم «به موسیقی گوش دادن».
  de.a1.unit54.lesson02.teach.ich_spiele_gern:
    title: گفتن اینکه دوست دارید با دوستانتان بازی ویدیویی کنید
    gloss: دوست دارم با دوستام بازی ویدیویی کنم.
    note: '*Mit Freunden* (با دوستان): بعد از mit همیشه حالت داتیو می‌آید، برای همین Freunde به Freunden تبدیل می‌شود.'
  de.a1.unit54.lesson03.teach.immer_oft_manchmal:
    title: همیشه، اغلب، گاهی، هرگز
    gloss: همیشه، اغلب، گاهی، هرگز
    note: 'چهار قید اصلی تکرار: immer, oft, manchmal, nie. معمولاً درست بعد از فعل می‌آیند: ich spiele nie.'
    example_gloss:
    - من شنبه‌ها همیشه ورزش می‌کنم.
    - من اغلب کتاب می‌خونم.
    - من گاهی نقاشی می‌کشم.
    - من هرگز بازی ویدیویی نمی‌کنم.
  de.a1.unit54.lesson03.teach.jede_woche_jedes:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*Jede Woche* و *jedes Wochenende* هر دو یعنی «هر»، اما پایانه بسته به جنسیت اسم عوض می‌شود: کارت بعدی را ببینید.'
    example_gloss:
    - من هر هفته برای دوستام آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  de.a1.unit54.lesson03.teach.die_woche_jede:
    title: Jede یا jedes
    gloss: Die Woche مؤنث است، پس jede Woche. Das Wochenende خنثی است، پس jedes Wochenende.
    note: '*Woche* مؤنث است (*die Woche*)، برای همین با *jede* می‌آید؛ *Wochenende* خنثی است (*das Wochenende*)، برای همین با *jedes* می‌آید. هر اسم را همراه با artikel‌اش یاد بگیرید تا پایانه‌اش را بدانید.'
  de.a1.unit54.lesson03.teach.was_machst_du:
    title: پرسیدن دربارهٔ اوقات فراغت
    gloss: توی وقت آزادت چی کار می‌کنی؟
    note: این سؤال اصلی این درس است؛ با آن می‌توانید از هر کسی دربارهٔ سرگرمی‌هاش بپرسید.
  de.a1.unit54.lesson04.teach.anna_wir_gehen:
    title: آنا صحبت از سرگرمی‌ها را پیش می‌کشد
    gloss: 'آنا: ما اغلب با هم قدم می‌زنیم. ولی فلیکس، تو در اوقات فراغتت دیگر چه کار می‌کنی؟'
    note: '*Wir gehen oft zusammen spazieren* از gehen همراه با یک فعل دوم استفاده می‌کند: فعل صرف‌شده gehen در جایگاه دوم است و مصدر spazieren به آخر جمله می‌رود.'
  de.a1.unit54.lesson04.teach.felix_ich_koche:
    title: سرگرمی‌های فلیکس
    gloss: 'فلیکس: من آشپزی را دوست دارم، توی خانه هم. و اغلب ورزش می‌کنم.'
    note: '*Auch zu Hause* (توی خانه هم) روشن می‌کند که فلیکس برای تفریح آشپزی می‌کند، نه فقط در کارش در رستوران.'
  de.a1.unit54.lesson04.teach.anna_kochst_du:
    title: آنا تعجب می‌کند
    gloss: 'آنا: توی خانه هم آشپزی می‌کنی؟ تو که تمام روز سر کار آشپزی می‌کنی!'
    note: '*Den ganzen Tag* (تمام روز) در حالت اکوزاتیو است، برای همین der Tag به den Tag تبدیل می‌شود. بازه‌های زمانی از این نوع حالت اکوزاتیو می‌گیرند.'
  de.a1.unit54.lesson04.teach.felix_ja_aber:
    title: فلیکس توضیح می‌دهد
    gloss: 'فلیکس: آره، ولی من آشپزی کردن را آرامش‌بخش می‌دانم. تو چی؟ تو چه کاری را دوست داری؟'
    note: در *Kochen finde ich entspannend* برای تأکید، Kochen اول آمده است. فعل باز هم در جایگاه دوم می‌ماند، برای همین ich بعد از آن می‌آید.
  de.a1.unit54.lesson04.teach.anna_ich_lese:
    title: سرگرمی‌های آنا
    gloss: 'آنا: من مطالعه را دوست دارم و اغلب موسیقی گوش می‌دهم.'
    note: دو فعل سرگرمی از درس‌های ۰۱ و ۰۲ را با *und* (و) در یک جمله کنار هم می‌آورد.
  de.a1.unit54.lesson04.teach.felix_spielst_du:
    title: فلیکس درباره بازی ویدیویی می‌پرسد
    gloss: 'فلیکس: تو بازی ویدیویی هم می‌کنی؟'
    note: 'یک سؤال کوتاه بله/خیر: فعل اول می‌آید، spielst du ...؟'
  de.a1.unit54.lesson04.teach.anna_nein_ich:
    title: آنا جواب می‌دهد
    gloss: 'آنا: نه، من هیچ‌وقت بازی ویدیویی نمی‌کنم. ولی گاهی نقاشی می‌کشم!'
    note: '*Nie* (هیچ‌وقت) و *manchmal* (گاهی) از درس ۰۳ در یک پاسخ در برابر هم قرار گرفته‌اند. هر دو درست بعد از فعل می‌آیند.'
  de.a1.unit54.lesson05.teach.felix_und_ich:
    title: مقایسهٔ سرگرمی‌ها
    gloss: من و فلیکس اغلب با هم قدم می‌زنیم. ولی سرگرمی‌های دیگری هم داریم. فلیکس آشپزی را دوست دارد، توی خانه هم، و اغلب ورزش می‌کند. من مطالعه را دوست دارم و اغلب موسیقی گوش می‌دهم. گاهی نقاشی می‌کشم، ولی هیچ‌وقت بازی ویدیویی نمی‌کنم. تو در اوقات فراغتت دوست داری چه کار کنی؟
    note: پیام آنا اطلاعات درس ۰۴ را مرور می‌کند و با پرسش اصلی این واحد از خواننده تمام می‌شود.
    glosses:
      spazieren: قدم می‌زنیم
      oft: اغلب
      zusammen: با هم
      andere: دیگر
      kocht: آشپزی می‌کند
      gern: دوست دارد
      Hause: توی خانه
      Sport: ورزش می‌کند
      lese: بخوانم
      höre: گوش می‌دهم
      Musik: موسیقی
      zeichne: نقاشی می‌کشم
      manchmal: گاهی
      spiele: بازی ویدیویی می‌کنم
      nie: هرگز
      freien: آزاد
      Zeit: وقت
  de.a1.unit54.lesson06.teach.felix_was_machst:
    title: فلیکس درباره آخر هفته می‌پرسد
    gloss: 'فلیکس: این آخر هفته چه کار می‌کنی؟'
    note: '*Dieses Wochenende* (این آخر هفته) پایانه خنثی -es دارد، چون das Wochenende خنثی است.'
  de.a1.unit54.lesson06.teach.anna_ich_weiss:
    title: آنا مردد است
    gloss: 'آنا: هنوز نمی‌دانم. مطالعه را دوست دارم، ولی دلم می‌خواهد بروم بیرون هم.'
    note: '*Nach draußen* (بیرون، تحت‌اللفظی «به بیرون») راه رایجی برای گفتن این است که می‌خواهید از خانه بیرون بروید.'
  de.a1.unit54.lesson06.teach.felix_gehen_wir:
    title: فلیکس یک برنامه پیشنهاد می‌دهد
    gloss: 'فلیکس: با هم برویم قدم بزنیم؟ بعدش من برای ما آشپزی می‌کنم.'
    note: '*Danach* (بعدش) اول می‌آید، پس فعل بعد از آن و فاعل بعد از فعل می‌آید: danach koche ich.'
  de.a1.unit54.lesson06.teach.anna_gute_idee:
    title: آنا موافقت می‌کند
    gloss: 'آنا: فکر خوبی است! هم قدم زدن را دوست دارم و هم آشپزی را.'
    note: '*Gern* بعد از فعل نشان می‌دهد از کاری لذت می‌برید: ich gehe gern spazieren, ich koche gern. تقریباً با هر فعلی کار می‌کند.'
  de.a1.unit54.lesson06.teach.felix_perfekt_dann:
    title: فلیکس قرار را قطعی می‌کند
    gloss: 'فلیکس: عالی. پس شنبه می‌بینمت!'
    note: 'یک جمله پایانی دوستانه که برنامه *Samstag* (شنبه) را تأیید می‌کند. روزهای هفته با *am* می‌آیند: am Samstag.'
