  description: 'آلمانی مقدماتی برای صحبت درباره فعالیت‌های اوقات فراغت: واژه‌های سرگرمی، عبارت‌های بیان تکرار، پرسیدن و پاسخ دادن درباره اینکه کسی در اوقات فراغتش چه کار می‌کند، و مقایسه سرگرمی‌های دو نفر.'
