units:
  de.a1.unit09.orte:
    title: مکان‌ها و جاهای رایج
teaching:
  de.a1.unit09.lesson01.teach.bank:
    title: Bank
    gloss: بانک
    note: '*Bank* یعنی بانک؛ اسم مؤنث است: *die Bank*.'
    example_gloss: من باید برم بانک.
  de.a1.unit09.lesson01.teach.krankenhaus:
    title: Krankenhaus
    gloss: بیمارستان
    note: '*Krankenhaus* تحت‌اللفظی یعنی «خانهٔ بیمار» و اسم خنثی است: *das Krankenhaus*.'
    example_gloss: دوستم تو بیمارستانه.
  de.a1.unit09.lesson01.teach.apotheke:
    title: Apotheke
    gloss: داروخانه
    note: '*Apotheke* یعنی داروخانه و اسم مؤنث است: *die Apotheke*.'
    example_gloss: داروخانه امروز بازه.
  de.a1.unit09.lesson01.teach.park:
    title: Park
    gloss: پارک
    note: '*Park* یعنی پارک و اسم مذکر است: *der Park*.'
    example_gloss: ما دوست داریم تو پارک قدم بزنیم.
  de.a1.unit09.lesson01.teach.restaurant:
    title: Restaurant
    gloss: رستوران
    note: '*Restaurant* یعنی رستوران و اسم خنثی است: *das Restaurant*.'
    example_gloss: غذای این رستوران خوبه.
  de.a1.unit09.lesson02.teach.neben:
    title: Die Apotheke ist neben dem Park.
    gloss: داروخانه کنار پارکه.
    note: '*neben* یعنی «کنار». این حرف اضافه دوحالته است و برای مکان ثابت (مثل اینجا) حالت datif می‌گیرد؛ برای همین *der Park* (مذکر) می‌شود *dem Park*.'
  de.a1.unit09.lesson02.teach.gegenueber_von:
    title: Die Apotheke ist gegenüber vom Krankenhaus.
    gloss: داروخانه روبه‌روی بیمارستانه.
    note: '*gegenüber von* یعنی «روبه‌روی». *vom* شکل ادغام‌شدهٔ *von dem* است (datif خنثی، *das Krankenhaus*) و هم در گفتار و هم در نوشتار به کار می‌رود.'
  de.a1.unit09.lesson02.teach.zwischen:
    title: Die Apotheke ist zwischen der Bank und dem Park.
    gloss: داروخانه بین بانک و پارکه.
    note: '*zwischen* یعنی «بین». به هر دو شکل datif دقت کنید: *der Bank* (مؤنث) و *dem Park* (مذکر).'
  de.a1.unit09.lesson02.teach.hinter:
    title: Das Restaurant ist hinter der Bank.
    gloss: رستوران پشت بانکه.
    note: '*hinter* یعنی «پشت»؛ *der Bank* شکل datif مؤنث است.'
  de.a1.unit09.lesson02.teach.vor:
    title: Der Park ist vor dem Krankenhaus.
    gloss: پارک جلوی بیمارستانه.
    note: '*vor* یعنی «جلوی»؛ *dem Krankenhaus* شکل datif خنثی است.'
  de.a1.unit09.lesson03.teach.wo_ist_die_bank:
    title: Wo ist die Bank?
    gloss: بانک کجاست؟
    note: '*Wo ist...?* روش معمول برای پرسیدن مکان چیزی است.'
  de.a1.unit09.lesson03.teach.sie_ist_neben:
    title: Sie ist neben dem Park.
    gloss: کنار پارکه.
    note: '*Sie* اینجا یعنی «آن» و به *die Bank* (مؤنث) برمی‌گردد. فقط چون اول جمله آمده با حرف بزرگ نوشته شده. فعل *ist* نشان می‌دهد این «شما»ی رسمی نیست؛ آن می‌شد *Sie sind*.'
  de.a1.unit09.lesson03.teach.ist_es_weit:
    title: Ist es weit von hier?
    gloss: از اینجا دوره؟
    note: '*weit* یعنی دور. *es* اینجا یک ضمیر کلی برای موقعیت است و با جنسیت اسم خاصی مطابقت ندارد.'
  de.a1.unit09.lesson03.teach.nicht_weit:
    title: Nein, es ist nicht weit.
    gloss: نه، دور نیست.
    note: '*nicht* صفت *weit* را منفی می‌کند.'
  de.a1.unit09.lesson04.teach.entschuldigung_wo:
    title: Entschuldigung, wo ist die Apotheke?
    gloss: ببخشید، داروخانه کجاست؟
    note: '*Entschuldigung* قبلاً به معنی «ببخشید / متأسفم» آمده بود؛ اینجا مؤدبانه شروع سؤال است.'
  de.a1.unit09.lesson04.teach.line01:
    title: فلیکس آدرس می‌پرسد
    gloss: 'فلیکس می‌گوید: ببخشید، داروخانه کجاست؟'
    note: همان شروع مؤدبانهٔ عبارت قبلی، این بار در یک گفت‌وگوی واقعی.
  de.a1.unit09.lesson04.teach.line02:
    title: آنا مکان را می‌گوید
    gloss: 'آنا می‌گوید: روبه‌روی بیمارستانه.'
    note: یک جواب کامل، مکان داروخانه را نسبت به یک نشانهٔ شناخته‌شده می‌گوید.
  de.a1.unit09.lesson04.teach.line03:
    title: فلیکس فاصله را می‌پرسد
    gloss: 'فلیکس می‌گوید: از اینجا دوره؟'
    note: وقتی جهت کلی را می‌دانید، این سؤال بعدی طبیعی است.
  de.a1.unit09.lesson04.teach.line04:
    title: آنا دربارهٔ فاصله جواب می‌دهد
    gloss: 'آنا می‌گوید: نه، دور نیست. بین بانک و پارکه.'
    note: یک جواب کامل اول دربارهٔ فاصله خیال طرف را راحت می‌کند، بعد نشانهٔ دقیق‌تری می‌دهد.
