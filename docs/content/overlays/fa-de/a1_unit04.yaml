course:
  title: آلمانی A1
  description: آلمانی در سطح A1 را برای احوال‌پرسی‌های روزمره و گفت‌وگوهای کوتاه اجتماعی یاد بگیرید، با توضیحات کامل به فارسی.
units:
  de.a1.unit04.daten:
    title: روزها، ماه‌ها و تاریخ
lessons:
  de.a1.unit04.lesson01.wochentage:
    title: روزهای هفته
  de.a1.unit04.lesson02.monate:
    title: ماه‌ها
  de.a1.unit04.lesson03.das_datum:
    title: گفتن تاریخ
  de.a1.unit04.lesson04.im_gespraech_ueber_das_datum:
    title: صحبت درباره‌ی تاریخ‌ها
teaching:
  de.a1.unit04.lesson01.teach.montag:
    title: Montag
    gloss: دوشنبه
    note: در کشورهای آلمانی‌زبان، *Montag* اولین روز هفته است؛ در ایران هفته از شنبه شروع می‌شود.
    example_gloss: دوشنبه وقت دارم.
  de.a1.unit04.lesson01.teach.dienstag:
    title: Dienstag
    gloss: سه‌شنبه
    note: '*Dienstag* دومین روز هفته است.'
    example_gloss: سه‌شنبه وقت دارم.
  de.a1.unit04.lesson01.teach.mittwoch:
    title: Mittwoch
    gloss: چهارشنبه
    note: '*Mittwoch* یعنی «میانه‌ی هفته» و واقعاً روز وسطِ هفته‌ی کاری در آلمان است.'
    example_gloss: چهارشنبه وقت دارم.
  de.a1.unit04.lesson01.teach.donnerstag:
    title: Donnerstag
    gloss: پنجشنبه
    note: '*Donnerstag* از نام خدای ژرمنی دونار (تور) گرفته شده است.'
    example_gloss: پنجشنبه وقت دارم.
  de.a1.unit04.lesson01.teach.freitag:
    title: Freitag
    gloss: جمعه
    note: '*Freitag* از نام الهه‌ی ژرمنی فریگ گرفته شده است.'
    example_gloss: جمعه وقت دارم.
  de.a1.unit04.lesson01.teach.samstag:
    title: Samstag
    gloss: شنبه
    note: '*Samstag* در بیشتر نقاط آلمان کلمه‌ی استاندارد برای شنبه است؛ *Sonnabend* گونه‌ای منطقه‌ای است (شمال و شرق آلمان).'
    example_gloss: شنبه وقت دارم.
  de.a1.unit04.lesson01.teach.sonntag:
    title: Sonntag
    gloss: یکشنبه
    note: '*Sonntag* یعنی «روزِ خورشید».'
    example_gloss: یکشنبه وقت دارم.
  de.a1.unit04.lesson01.teach.welcher_tag:
    title: Welcher Tag ist heute?
    gloss: امروز چه روزی است؟
    note: '*heute* یعنی «امروز»؛ *Welcher Tag* یعنی «کدام روز».'
  de.a1.unit04.lesson02.teach.januar:
    title: Januar
    gloss: ژانویه
    note: '*Januar* اولین ماه سال (میلادی) است.'
    example_gloss: تولدم در ژانویه است.
  de.a1.unit04.lesson02.teach.maerz:
    title: März
    gloss: مارس
    note: '*März* سومین ماه سال (میلادی) است.'
    example_gloss: تولدم در ماه مارس است.
  de.a1.unit04.lesson02.teach.mai:
    title: Mai
    gloss: مه
    note: '*Mai* کوتاه است و یادگرفتنش آسان.'
    example_gloss: تولدم در مه است.
  de.a1.unit04.lesson02.teach.juli:
    title: Juli
    gloss: ژوئیه
    note: '*Juli* هفتمین ماه سال (میلادی) است.'
    example_gloss: تولدم در ژوئیه است.
  de.a1.unit04.lesson02.teach.september:
    title: September
    gloss: سپتامبر
    note: '*September* نهمین ماه سال (میلادی) است.'
    example_gloss: تولدم در سپتامبر است.
  de.a1.unit04.lesson02.teach.dezember:
    title: Dezember
    gloss: دسامبر
    note: '*Dezember* آخرین ماه سال (میلادی) است.'
    example_gloss: تولدم در دسامبر است.
  de.a1.unit04.lesson02.teach.welcher_monat:
    title: Welcher Monat ist es?
    gloss: کدام ماه است؟
    note: '*Monat* یعنی «ماه»؛ *es* یعنی «آن».'
  de.a1.unit04.lesson03.teach.wievielte:
    title: Der Wievielte ist heute?
    gloss: امروز چندم است؟
    note: تحت‌اللفظی یعنی «چندمین است امروز؟»؛ روش استاندارد پرسیدن تاریخ در آلمانی.
  de.a1.unit04.lesson03.teach.siebte_juli:
    title: Heute ist der siebte Juli.
    gloss: امروز هفتم ژوئیه است.
    note: 'مثل فارسی، در آلمانی هم اول روز و بعد ماه گفته می‌شود: *der siebte Juli* یعنی «هفتمِ ژوئیه». *der siebte Juli* را یکجا یاد بگیرید.'
  de.a1.unit04.lesson03.teach.dienstag_siebte_juli:
    title: Heute ist Dienstag, der siebte Juli.
    gloss: امروز سه‌شنبه، هفتم ژوئیه است.
    note: نام روز هفته را پیش از تاریخ می‌آورید و با ویرگول جدایش می‌کنید.
  de.a1.unit04.lesson03.teach.numerische_form:
    title: Man kann es auch als 7.7. schreiben.
    gloss: می‌شود آن را به صورت 7.7. هم نوشت.
    note: 'در تاریخ عددی آلمانی اول روز و بعد ماه می‌آید و بعد از هر کدام نقطه می‌گذارند: 7.7. یعنی هفتم ژوئیه. ترتیب آن مثل تاریخ‌نویسیِ فارسی (روز/ماه) است، فقط جداکننده نقطه است.'
  de.a1.unit04.lesson03.teach.geburtstag_frage:
    title: Wann haben Sie Geburtstag?
    gloss: تولد شما کی است؟ (رسمی)
    note: تحت‌اللفظی یعنی «کی تولد دارید؟»؛ در آلمانی می‌گویند تولد *دارید*.
  de.a1.unit04.lesson03.teach.geburtstag_antwort:
    title: Mein Geburtstag ist der dritte März.
    gloss: تولدم سوم مارس است.
    note: '*Mein Geburtstag* یعنی «تولدم»؛ *der dritte März* یعنی «سوم مارس» (اول روز، بعد ماه).'
  de.a1.unit04.lesson04.teach.oeffnet:
    title: öffnet
    gloss: باز می‌شود
    note: '*öffnet* سومِ شخصِ مفرد *öffnen* (باز کردن) است و برای «باز می‌شود» مثلاً درباره‌ی مغازه یا کتابخانه به کار می‌رود.'
    example_gloss: مغازه دوشنبه باز می‌شود.
  de.a1.unit04.lesson04.teach.wieder:
    title: wieder
    gloss: دوباره
    note: '*wieder* یعنی «دوباره»؛ اینجا برای پرسیدن زمان بازگشایی دوباره‌ی جایی به کار رفته است.'
    example_gloss: کتابخانه دوشنبه دوباره باز می‌شود.
  de.a1.unit04.lesson04.teach.die:
    title: die
    gloss: حرف تعریفِ مؤنث و جمع
    note: '*die* حرف تعریف برای اسم‌های مؤنثِ مفرد و همه‌ی جمع‌هاست؛ اینجا با اسم مؤنث *Bibliothek* آمده است.'
    example_gloss: کتابخانه بزرگ است.
  de.a1.unit04.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: کتابخانه
    note: '*Bibliothek* اسم مؤنث است (*die Bibliothek*).'
    example_gloss: دارم به کتابخانه می‌روم.
  de.a1.unit04.lesson04.teach.am:
    title: am
    gloss: در / سرِ (روز یا تاریخ)
    note: '*am* مخفف *an dem* است و پیش از روزهای هفته و تاریخ‌ها می‌آید (*am Montag* یعنی «دوشنبه»).'
    example_gloss: دوشنبه کار می‌کنم.
  de.a1.unit04.lesson04.teach.den:
    title: den
    gloss: حرف تعریفِ مذکر در حالت مفعولی
    note: '*den* شکل مفعولیِ مذکرِ *der* است. در تاریخ کامل بعد از نام روز می‌آید، مثل *am Donnerstag, den neunten Juli*؛ آن را به‌صورت یک الگوی ثابت یاد بگیرید و فعلاً به تحلیل حالت دستوری نپردازید. (بعد از *am* گاهی *dem* هم می‌بینید که آن هم درست است.)'
    example_gloss: پنجشنبه، نهم ژوئیه همدیگر را می‌بینیم.
  de.a1.unit04.lesson04.teach.neunten:
    title: neunten
    gloss: نهم
    note: '*neunten* شکل صرف‌شده‌ی عدد ترتیبیِ *neun* (نه) است که در تاریخ‌ها می‌آید: *der neunte Juli* در این ساختار تاریخ کامل به *den neunten Juli* تبدیل می‌شود.'
    example_gloss: تولدم نهم ژوئیه است.
  de.a1.unit04.lesson04.teach.line01:
    title: فلیکس تاریخ را می‌پرسد
    gloss: 'فلیکس می‌گوید: امروز چندم است؟'
  de.a1.unit04.lesson04.teach.line02:
    title: آنا تاریخ را می‌گوید
    gloss: 'آنا می‌گوید: امروز سه‌شنبه، هفتم ژوئیه است.'
  de.a1.unit04.lesson04.teach.line03:
    title: فلیکس درباره‌ی کتابخانه می‌پرسد
    gloss: 'فلیکس می‌گوید: کتابخانه کی دوباره باز می‌شود؟'
  de.a1.unit04.lesson04.teach.line04:
    title: آنا جواب می‌دهد
    gloss: 'آنا می‌گوید: پنجشنبه، نهم ژوئیه دوباره باز می‌شود.'
    note: '*Sie* اینجا یعنی «آن» و به *die Bibliothek* (اسم مؤنث) برمی‌گردد.'
  de.a1.unit04.lesson04.teach.line05:
    title: فلیکس خداحافظی می‌کند
    gloss: 'فلیکس می‌گوید: خوب، تا پنجشنبه.'
    note: '*bis Donnerstag* یعنی «تا پنجشنبه»؛ روشی رایج برای گفتن «پنجشنبه می‌بینمت».'
  de.a1.unit04.lesson04.teach.notiz:
    title: یادداشتی روی در
    gloss: تا پنجشنبه، نهم ژوئیه تعطیل است.
    note: '*Geschlossen* یعنی «بسته».'
