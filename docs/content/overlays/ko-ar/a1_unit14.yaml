teaching:
  ar.a1.unit14.lesson01.teach.like:
    title: 좋아해요
    gloss: 좋아해요
    note: أحب (uḥibbu)는 '좋아해요'라는 뜻이에요. 아랍어는 일반적인 것을 말할 때 ال(그)을 붙여서, '커피를 좋아해요'는 أحب القهوة, 직역하면 '그 커피를 좋아해요'예요.
    example_gloss: 저는 커피를 좋아해요.
  ar.a1.unit14.lesson01.teach.tea:
    title: 차
    gloss: 차
    note: شاي (shāy)는 '차'예요. الشاي (ash-shāy)는 ال이 붙은 형태로, 아랍어에서 차를 일반적으로 말할 때 이렇게 해요.
    example_gloss: 저는 차를 좋아하지 않아요.
  ar.a1.unit14.lesson01.teach.dislike:
    title: 좋아하지 않아요
    gloss: 좋아하지 않아요
    note: 아랍어는 동사 앞에 لا를 붙여 부정해요. 한국어에서 동사 뒤에 '-지 않아요'를 붙이는 것과 달리, لا는 أحب 앞에 와요.
    example_gloss: 저는 차를 좋아하지 않아요.
  ar.a1.unit14.lesson01.teach.water:
    title: 물
    gloss: 물
    note: الماء (al-māʾ)는 ماء(물, 음식 단원에 나와요)에 ال이 붙은 형태로, 물을 일반적으로 말할 때 써요.
    example_gloss: 저는 물을 좋아해요.
  ar.a1.unit14.lesson01.teach.and_not:
    title: 그리고 ~ 않아요
    gloss: 그리고 ~ 않아요
    note: ولا (wa-lā)는 و(그리고)와 لا(아니다)가 붙은 말로, 좋아하는 것 뒤에 싫어하는 것을 덧붙일 때 써요.
    example_gloss: 저는 커피를 좋아하고 차는 좋아하지 않아요.
  ar.a1.unit14.lesson02.teach.prefer:
    title: 더 좋아해요
    gloss: 더 좋아해요
    note: أفضل (ufaḍḍilu)는 '더 좋아해요'라는 뜻이에요. 여러 선택지 중 하나를 고를 때 써요.
    example_gloss: 저는 커피를 더 좋아해요.
  ar.a1.unit14.lesson02.teach.what_prefer:
    title: 무엇을 더 좋아해요?
    gloss: 무엇을 더 좋아해요?
    note: 여기서 تفضل은 tufaḍḍil로 '당신이 더 좋아해요'라는 뜻이고, 남자에게 하는 말이에요. 여자에게는 تفضلين (tufaḍḍilīn)이라고 해요. 음식 단원의 تفضل (tafaḍḍal, '여기 있어요')과는 철자가 같지만 다른 단어예요.
    example_gloss: '누르가 말했어요: 유수프, 뭘 더 좋아해요?'
  ar.a1.unit14.lesson02.teach.line01:
    title: 누르가 물어요
    gloss: 누르가 유수프에게 무엇을 더 좋아하는지 물어요.
    note: نور(누르)는 유수프의 여동생이에요. 남자에게 묻기 때문에 تفضل이라고 해요. 여자에게는 ماذا تفضلين؟라고 해요.
    example_gloss: '누르가 말했어요: 유수프, 뭘 더 좋아해요?'
  ar.a1.unit14.lesson02.teach.line02:
    title: 유수프는 커피를 더 좋아해요
    gloss: 유수프가 커피를 더 좋아한다고 말해요.
    note: أفضل는 여러 선택지 중 하나를 고르는 말이고, أحب는 그냥 무언가를 좋아한다고 말해요.
    example_gloss: '유수프가 말했어요: 저는 커피를 더 좋아해요.'
  ar.a1.unit14.lesson02.teach.line03:
    title: 유수프는 차를 좋아하지 않아요
    gloss: 유수프가 차를 좋아하지 않는다고 말해요.
    note: لا أحب는 싫어함을 간단히 표현해요.
    example_gloss: '유수프가 말했어요: 저는 차를 좋아하지 않아요.'
  ar.a1.unit14.lesson02.teach.line04:
    title: 누르는 물을 좋아해요
    gloss: 누르가 물을 좋아한다고 말해요.
    note: أنا(저)를 강조하려고 덧붙일 수 있어요.
    example_gloss: '누르가 말했어요: 저는 물을 좋아해요.'
