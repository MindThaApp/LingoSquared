    note: ما تاريخ اليوم؟는 시간이 아니라 달력의 날짜를 물어요.
    example_gloss: 라일라가 말했어요. "오늘 날짜가 어떻게 돼요?"
  ar.a1.unit04.lesson02.teach.line02:
