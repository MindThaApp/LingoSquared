  ar.a1.unit04.lesson02.teach.line03:
    title: 수업 이야기하기
    gloss: 라일라가 오늘 수업이 있다고 말해요.
    note: عندي는 '나는 ~이 있다'라는 뜻이고, 앞서 숫자와 함께 나왔어요.
    example_gloss: 라일라가 말했어요. "고마워요. 오늘 수업이 있어요."
  ar.a1.unit04.lesson02.teach.line04:
