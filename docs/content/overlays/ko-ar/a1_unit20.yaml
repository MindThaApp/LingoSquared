    title: 화창하고 더워요
    gloss: 유수프가 날씨가 화창하고 덥다고 말해요.
    note: 'و (wa, 그리고)는 두 날씨 단어를 이어 주고, 다음 단어에 붙여 써요: وحار.'
    example_gloss: 유수프가 말했어요. "날씨가 화창하고 더워요."
  ar.a1.unit20.lesson02.teach.line03:
