    example_gloss: 레일라가 말했어요. "우리 카페에 갈까요?"
  ar.a1.unit20.lesson02.teach.line04:
    title: 물 마실 계획
    gloss: 유수프가 그렇다고 답하며 물을 마시자고 제안해요.
    note: هيا نشرب는 '마시자'라는 뜻이에요.
    example_gloss: 유수프가 말했어요. "네, 물을 마시자요."
