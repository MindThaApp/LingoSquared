teaching:
  ar.a1.unit13.lesson01.teach.yesterday:
    title: 어제
    gloss: 어제
    note: أمس(ams)는 '어제'라는 뜻이에요. ذهبت 같은 과거형 동사와 함께 쓰이고, 문장 끝이나 문장 처음에 올 수 있어요.
    example_gloss: 어제 시장에 갔어요.
  ar.a1.unit13.lesson01.teach.went:
    title: 나는 갔다
    gloss: 나는 갔다
    note: ذهبت(dhahabtu)는 '나는 갔다'라는 뜻이에요. 과거형 어미 -tu가 '나'를 나타내요. 모음 부호가 없으면 같은 글자를 dhahabta / dhahabti(너는 갔다, 남성 / 여성)나 dhahabat(그녀는 갔다)로 읽을 수도 있어요. 어느 쪽인지는 문맥으로 알 수 있어요.
    example_gloss: 시장에 갔어요.
  ar.a1.unit13.lesson01.teach.bought:
    title: 나는 샀다
    gloss: 나는 샀다
    note: اشتريت(ishtaraytu)는 '나는 샀다'라는 뜻이에요. ذهبت처럼 '나'를 나타내는 -tu로 끝나요.
    example_gloss: 사과를 샀어요.
  ar.a1.unit13.lesson01.teach.apples_object:
    title: 사과
    gloss: 사과
    note: تفاحا(tuffāḥan)는 تفاح(사과, 쇼핑 단원에서 배운 단어)가 동사의 목적어로 쓰인 형태예요. 덧붙은 ا는 -an 어미를 나타내는 철자예요.
    example_gloss: 사과를 샀어요.
  ar.a1.unit13.lesson02.teach.what_did:
    title: 어제 뭐 했어요?
    gloss: 어제 무엇을 하셨어요?
    note: ماذا(mādhā)는 '무엇'을 묻는 말이고, 여기서 فعلت는 '너는 했다'라는 뜻이에요. 남성에게는 faʿalta, 여성에게는 faʿalti이고 쓰는 글자는 같아요. 유수프가 레일라에게 묻고 있으니 faʿalti라고 말해요.
    example_gloss: 유수프가 말했어요. "어제 뭐 했어요?"
  ar.a1.unit13.lesson02.teach.drank:
    title: 마셨어요
    gloss: 마셨어요
    note: شربت(sharibtu)는 '나는 마셨다'라는 뜻이에요. ذهبت, اشتريت와 같은 '나'를 나타내는 -tu 어미가 붙어요.
    example_gloss: 커피를 마셨어요.
  ar.a1.unit13.lesson02.teach.event_sequence:
    title: 최근에 있었던 일 말하기
    gloss: 시장에 갔어요. 사과를 샀어요. 커피를 마셨어요.
    note: 짧은 과거형 문장을 이어서 말하면 무엇을 했는지 이야기할 수 있어요. 동사는 모두 '나'를 나타내는 -tu로 끝나요.
    example_gloss: 어제 시장에 갔어요. 사과를 샀어요. 커피를 마셨어요.
  ar.a1.unit13.lesson02.teach.line01:
    title: 어제 일 묻기
    gloss: 유수프가 레일라에게 어제 뭐 했는지 물어요.
    note: 유수프는 여성인 레일라에게 묻고 있어서 فعلت를 faʿalti로 읽어요. 남성에게 말할 때는 faʿalta예요.
    example_gloss: 유수프가 말했어요. "어제 뭐 했어요?"
  ar.a1.unit13.lesson02.teach.line02:
    title: 시장에 갔어요
    gloss: 레일라가 시장에 갔다고 말해요.
    note: ذهبت는 이미 끝난 이동을 나타내요.
    example_gloss: 레일라가 말했어요. "시장에 갔어요."
  ar.a1.unit13.lesson02.teach.line03:
    title: 사과를 샀어요
    gloss: 레일라가 사과를 샀다고 말해요.
    note: 이렇게 끝난 행동이 하나 더 추가돼요.
    example_gloss: 레일라가 말했어요. "사과를 샀어요."
  ar.a1.unit13.lesson02.teach.line04:
    title: 커피를 마셨어요
    gloss: 레일라가 커피를 마셨다고 말해요.
    note: 이것으로 짧은 이야기가 마무리돼요.
    example_gloss: 레일라가 말했어요. "커피를 마셨어요."
