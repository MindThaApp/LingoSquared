teaching:
  ar.a1.unit23.lesson01.teach.phone:
    title: 전화기
    gloss: 전화기
    note: هاتف (hātif)는 '전화기'라는 뜻이에요.
    example_gloss: 이것은 전화기예요.
  ar.a1.unit23.lesson01.teach.hear:
    title: 말씀이 들려요
    gloss: 말씀이 들려요
    note: أسمعك(남성에게는 asmaʿuka, 여성에게는 asmaʿuki)은 '당신의 말이 들려요'라는 뜻이고, لا أسمعك (lā asmaʿuk)은 '당신의 말이 안 들려요'라는 뜻이에요.
    example_gloss: 말씀이 안 들려요.
  ar.a1.unit23.lesson01.teach.repeat:
    title: 다시 말하기
    gloss: 다시 말해 주세요
    note: أعد (aʿid)는 남성에게 하는 말이고, 여성에게는 أعيدي (aʿīdī)라고 해요. أعد من فضلك은 상대에게 정중하게 다시 말해 달라고 부탁하는 표현이에요.
    example_gloss: 말씀이 안 들려요. 다시 말해 주세요.
  ar.a1.unit23.lesson01.teach.slowly:
    title: 천천히 말하기
    gloss: 천천히 말해 주세요
    note: تكلم ببطء (takallam bi-buṭʾ)는 남성에게 하는 말이고, 여성에게는 تكلمي ببطء (takallamī bi-buṭʾ)라고 해요.
    example_gloss: 천천히 말해 주세요.
  ar.a1.unit23.lesson02.teach.message:
    title: 메시지
    gloss: 메시지
    note: رسالة (risāla)는 '메시지'이고, '편지'라는 뜻으로도 쓰여요.
    example_gloss: 이것은 메시지예요.
  ar.a1.unit23.lesson02.teach.appointment:
    title: 약속
    gloss: 예약
    note: موعد (mawʿid)는 '약속'이라는 뜻이고, الموعد (al-mawʿid)는 '그 약속'이에요.
    example_gloss: 약속은 5시예요.
  ar.a1.unit23.lesson02.teach.line01:
    title: 전화 받기
    gloss: 유수프가 전화로 레일라에게 인사하고 자기 이름을 말해요.
    note: 전화에서 أنا يوسف (anā Yūsuf)는 누가 전화했는지 밝히는 말이에요.
    example_gloss: '유수프가 말했어요: 여보세요, 저는 유수프예요.'
  ar.a1.unit23.lesson02.teach.line02:
    title: 안 들림
    gloss: 레일라가 유수프의 말이 들리지 않는다고 말해요.
    note: 이 문장은 다시 말해 달라는 부탁으로 이어져요.
    example_gloss: '레일라가 말했어요: 여보세요, 유수프. 말씀이 안 들려요.'
  ar.a1.unit23.lesson02.teach.line03:
    title: 천천히 말해 달라고 부탁하기
    gloss: 레일라가 유수프에게 천천히 말해 달라고 부탁해요.
    note: من فضلك은 부탁을 공손하게 만들어 줘요. 레일라는 남성에게 말하므로 تكلم이라고 해요.
    example_gloss: '레일라가 말했어요: 천천히 말해 주세요.'
  ar.a1.unit23.lesson02.teach.line04:
    title: 핵심 정보
    gloss: 유수프가 약속이 5시라고 말해요.
    note: في الساعة الخامسة (fī s-sāʿa l-khāmisa)는 '5시에'라는 뜻이에요.
    example_gloss: 유수프가 말했어요. 약속은 5시예요.
  ar.a1.unit23.lesson02.teach.line05:
    title: 다시 말해 달라고 부탁하기
    gloss: 레일라가 유수프에게 다시 말해 달라고 부탁해요.
    note: أعد من فضلك은(는) 다시 말해 달라고 부탁하는 표현이에요.
    example_gloss: 레일라가 말했어요. 다시 말해 주세요.
  ar.a1.unit23.lesson02.teach.line06:
    title: 세부 내용 다시 말하기
    gloss: 유수프가 약속 시간을 다시 말해 줘요.
    note: 다시 말한 문장으로 시간을 확인해요.
    example_gloss: 유수프가 말했어요. 약속은 5시예요.
