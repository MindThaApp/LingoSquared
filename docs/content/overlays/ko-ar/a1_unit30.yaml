  ar.a1.unit30.lesson04.teach.ila_allqaa_abara:
    title: إلى اللقاء + 요일
    gloss: 'إلى اللقاء (ilā al-liqāʾ, 안녕히 가세요/다음에 봐요)는 이미 아는 표현이에요. 뒤에 날을 붙일 수도 있어요: إلى اللقاء يوم السبت (ilā al-liqāʾ yawm as-sabt, 토요일에 봐요), إلى اللقاء غدا (ilā al-liqāʾ ghadan, 내일 봐요).'
    note: 인사 단원의 작별 인사 패턴을 특정한 요일로 넓혀 줘요.
  ar.a1.unit30.lesson05.teach.lyla_ttsl_bywsf:
    title: 누가 무엇을 사용할까요?
