  ar.a1.unit30.lesson06.teach.sara_afdl_alsbaha:
    title: 사라의 계획
    gloss: '사라: 저는 수영이 더 좋지만, 공원에도 갈게요.'
    note: أفضل (ufaḍḍil)은 '저는 더 좋아해요'라는 뜻이에요. لكنني (lākinnanī)는 '하지만 저는'이라는 뜻이고, سآتي (sa-ātī)는 '저는 올 거예요'라는 뜻이에요.
