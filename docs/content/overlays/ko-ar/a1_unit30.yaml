    gloss: 그러고 나서 그는 조깅하러 가요.
    note: ثم (thumma)은 '그다음에'라는 뜻이며, و와 달리 독립된 단어예요. يذهب للركض (yadhhab li-r-rakḍ)은 '달리기하러 가요'라는 뜻이에요. ل + الركض이 للركض이 돼요.
