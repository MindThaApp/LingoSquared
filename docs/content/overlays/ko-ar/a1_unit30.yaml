    title: عن과 함께 쓰는 동사
    gloss: '동사 أبحث (abḥath) 뒤에는 عن (ʿan)이 와요: أبحث عن توقعات الطقس (abḥath ʿan tawaqquʿāt aṭ-ṭaqs). 하지만 أستخدم (astakhdim)은 목적어가 바로 와요: أستخدم هاتفي.'
    note: عن (ʿan)은 '~에 대해' 또는 '~을 찾아'라는 뜻이에요. 아랍어 동사마다 쓰는 전치사가 정해져 있으니 함께 익히세요.
