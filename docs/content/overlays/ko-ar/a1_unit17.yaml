teaching:
  ar.a1.unit17.lesson01.teach.pain:
    title: 통증
    gloss: 통증
    note: ألم (alam)은 '통증'이라는 뜻이고, عندي ألم (ʿindī alam)은 '아파요'라는 뜻이에요.
    example_gloss: 아파요.
  ar.a1.unit17.lesson01.teach.head:
    title: 머리
    gloss: 머리
    note: الرأس (ar-raʾs)는 '머리'예요. 아랍어는 عندي ألم في الرأس, 즉 '머리에 통증이 있어요'라고 말해요. 한국어의 '머리가 아파요'처럼 한 단어로 된 동사를 쓰지 않아요.
    example_gloss: 머리가 아파요.
  ar.a1.unit17.lesson01.teach.stomach:
    title: 위
    gloss: 배
    note: البطن (al-baṭn)은 배, 복부 부위를 뜻해요.
    example_gloss: 배가 아파요.
  ar.a1.unit17.lesson01.teach.problem_sentence:
    title: 머리 통증
    gloss: 머리가 아파요
    note: عندي ألم은 직역하면 '나에게 통증이 있다'로, 아랍어에서 '아프다'를 말하는 방식이에요. في + 신체 부위로 아픈 곳을 말해요.
    example_gloss: 라일라가 말했어요. "머리가 아파요."
  ar.a1.unit17.lesson02.teach.problem_question:
    title: 무슨 문제예요?
    gloss: 무슨 문제예요?
    note: ما (mā)는 '무엇'을 묻고, المشكلة (al-mushkila)는 '문제'라는 뜻이에요.
    example_gloss: 라일라, 무슨 문제예요?
  ar.a1.unit17.lesson02.teach.drink:
    title: 물을 마셔요
    gloss: 물을 마셔요
    note: اشربي (ishrabī)는 여성에게, 여기서는 라일라에게 하는 '마셔요!'라는 명령형이에요. 남성에게는 اشرب (ishrab)라고 해요.
    example_gloss: 유수프가 말했어요. "물을 마셔요."
  ar.a1.unit17.lesson02.teach.rest:
    title: 쉬어요
    gloss: 쉬어요
    note: استريحي (istarīḥī)는 여성에게 하는 '쉬어요!'라는 명령형이에요. 남성에게는 استرح (istariḥ)라고 해요.
    example_gloss: 오늘은 쉬어요.
  ar.a1.unit17.lesson02.teach.need_help:
    title: 도움이 필요해요
    gloss: 도움이 필요해요
    note: أحتاج (aḥtāj)는 '필요해요', مساعدة (musāʿada)는 '도움'이라는 뜻이에요. إلى가 들어간 أحتاج إلى مساعدة도 쓰이는데, 둘 다 맞아요.
    example_gloss: 아파요. 도움이 필요해요.
  ar.a1.unit17.lesson02.teach.line01:
    title: 문제 묻기
    gloss: 유수프가 라일라에게 무슨 문제인지 물어요.
    note: يا ليلى는 라일라를 이름으로 불러요.
    example_gloss: 유수프가 말했어요. "라일라, 무슨 문제예요?"
  ar.a1.unit17.lesson02.teach.line02:
    title: 증상 말하기
    gloss: 라일라가 머리가 아프다고 말해요.
    note: 증상을 직접 말하는 표현이에요.
    example_gloss: 라일라가 말했어요. "머리가 아파요."
  ar.a1.unit17.lesson02.teach.line03:
    title: 간단한 조언
    gloss: 유수프가 레일라에게 물을 마시고 쉬라고 말해요.
    note: '유수프가 레일라에게 말하는 것이라 두 명령형 모두 여성형이에요. و(wa, 그리고)는 다음 단어에 붙여 써요: واستريحي.'
    example_gloss: 유수프가 말했어요. 물을 마시고 쉬세요.
  ar.a1.unit17.lesson02.teach.line04:
    title: 감사
    gloss: 레일라가 고맙다고 말해요.
    note: شكرا로 짧은 대화를 마무리해요.
    example_gloss: 레일라가 말했어요. 고마워요.
