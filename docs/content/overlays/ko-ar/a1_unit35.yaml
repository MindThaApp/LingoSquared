    note: 소포에 관한 짧은 글이에요. 동사는 주어와 일치해요. 남성 명사는 الطرد يصل (aṭ-ṭard yaṣil)처럼, 여성인 라일라는 ليلى تشتري (Layla tashtarī)처럼 써요.
