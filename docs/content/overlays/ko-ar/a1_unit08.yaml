    example_gloss: 사과 두 개 주세요.
  ar.a1.unit08.lesson02.teach.line01:
    title: 가격 묻기
    gloss: 라일라가 사과 가격을 물어봐요.
    note: 앞에서 본 가격 묻기 표현과 같은 패턴이에요.
    example_gloss: 라일라가 말했어요. "사과는 얼마예요?"
  ar.a1.unit08.lesson02.teach.line02:
    title: 가격 말하기
    gloss: 판매원이 사과는 10디르함이라고 말해요.
    note: بعشرة는 عشرة에 가격을 나타내는 접두사가 붙은 형태예요.
    example_gloss: 판매원이 말했어요. "사과는 10디르함이에요."
  ar.a1.unit08.lesson02.teach.line03:
    title: 수량 요청하기
    gloss: 라일라가 공손하게 사과 두 개를 부탁해요.
    note: من فضلك를 붙이면 공손한 부탁이 돼요.
    example_gloss: 라일라가 말했어요. "사과 두 개 주세요."
  ar.a1.unit08.lesson02.teach.line04:
    title: 물건 건네기
    gloss: 판매원이 "여기 있어요"라고 말해요.
    note: تفضلي는 음식 단원에서 배웠어요. 여성에게 하는 말이고, 남성에게는 تفضل이라고 해요.
    example_gloss: 판매원이 말했어요. "여기 있어요."
