teaching:
  ar.a1.unit25.lesson01.teach.alqraaa_mmarsa_alryada:
    title: 독서, 운동, 요리
    gloss: 읽다, 운동하다, 요리하다
    note: القراءة (al-qirāʾa)는 '독서', ممارسة الرياضة (mumārasat ar-riyāḍa)는 '운동하기', الطبخ (aṭ-ṭabkh)는 '요리'예요. 모두 명사라서 관사 ال가 붙어 있어요.
    example_gloss:
    - 저는 책 읽는 것을 좋아해요.
    - 저는 토요일마다 운동해요.
    - 저는 친구들을 위해 요리하는 것을 좋아해요.
  ar.a1.unit25.lesson01.teach.wqt_alfragh:
    title: 여가 시간
    gloss: 여가 시간
    note: وقت الفراغ (waqt al-farāgh)는 문자 그대로 '빈 공간의 시간'이라는 뜻이에요. 첫 번째 단어에는 ال가 없고, 두 번째 단어에만 붙어요.
    example_gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
  ar.a1.unit25.lesson01.teach.fy_wqt_fraghy:
    title: 여가 시간에 하는 일 말하기
    gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
    note: أحب (uḥibb)는 '저는 좋아해요'라는 뜻이며 남자와 여자가 똑같이 써요. فراغي (farāghī) 끝의 ي는 '나의'라는 뜻이에요.
  ar.a1.unit25.lesson02.teach.alastmaa_ila_almwsyqa:
    title: 음악, 그림 그리기, 비디오 게임
    gloss: 음악을 듣다, 그림을 그리다, 비디오 게임을 하다
    note: الاستماع إلى الموسيقى (al-istimāʿ ilā al-mūsīqā)는 '음악 듣기', الرسم (ar-rasm)는 '그림 그리기', لعب ألعاب الفيديو (laʿb alʿāb al-fīdiyū)는 '비디오 게임 하기'예요.
    example_gloss:
    - 저는 음악 듣는 것을 좋아해요.
    - 저는 그림을 자주 그려요.
    - 저는 친구들과 비디오 게임 하는 것을 좋아해요.
  ar.a1.unit25.lesson02.teach.ahb_alastmaa_ila:
    title: 음악 듣기를 좋아한다고 말하기
    gloss: 저는 음악 듣는 것을 좋아해요.
    note: 'الاستماع (al-istimāʿ) 뒤에는 듣는 대상 앞에 إلى (ilā, ''~을/를'')가 필요해요: الاستماع إلى الموسيقى.'
  ar.a1.unit25.lesson02.teach.ahb_lab_alaab:
    title: 친구들과 게임하는 것을 좋아한다고 말하기
    gloss: 저는 친구들과 비디오 게임 하는 것을 좋아해요.
    note: 'مع (maʿa)는 ''~와 함께''라는 뜻이에요: مع الأصدقاء (maʿa al-aṣdiqāʾ). 관사 ال는 الأصدقاء에 그대로 붙어 있어요.'
  ar.a1.unit25.lesson03.teach.daima_kthyra_ahyana:
    title: 항상, 자주, 가끔, 전혀 ~않다
    gloss: 항상, 자주, 가끔, 절대 ~않다
    note: دائما (dāʾiman), كثيرا (kathīran), أحيانا (aḥyānan), أبدا (abadan)는 부사라서 성별에 따라 변하지 않아요. 끝의 ا(알리프)는 따로 부호 없이 써요.
    example_gloss:
    - 저는 토요일마다 항상 운동해요.
    - 저는 책을 자주 읽어요.
    - 저는 가끔 그림을 그려요.
    - 저는 게임을 전혀 안 해요.
  ar.a1.unit25.lesson03.teach.kl_asbwa_kl:
    title: 매주, 주말마다
    gloss: 매주, 주말마다
    note: كل أسبوع (kull usbūʿ)와 كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ)는 모두 كل (kull, '매~')을 써요. 다음 카드를 보세요.
    example_gloss:
    - 저는 매주 친구들을 위해 요리해요.
    - 저는 주말마다 운동해요.
  ar.a1.unit25.lesson03.teach.bad_kl_yaty:
    title: '매~: كل'
    gloss: 'كل (kull, ''매~'') 뒤에는 단수 명사가 오고 ال는 붙지 않아요: كل أسبوع (kull usbūʿ), كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ).'
    note: كل (kull)은 형태가 변하지 않아요. أسبوع 같은 남성 명사 앞에서도, عطلة 같은 여성 명사 앞에서도 같은 단어를 써요.
  ar.a1.unit25.lesson03.teach.madha_tfal_fy:
    title: 여가 시간에 대해 묻기
    gloss: 여가 시간에 무엇을 하나요?
    note: 이 단원의 핵심 질문이에요. 누구에게든 취미를 물을 때 이 문장을 쓰세요.
  ar.a1.unit25.lesson04.teach.lyla_ntmsha_maa:
    title: 레일라가 취미 이야기를 꺼내요
    gloss: '레일라: 우리는 함께 자주 산책하죠. 그런데 유수프, 여가 시간에 또 뭐 하세요?'
    note: نتمشى (natamashshā)의 첫 글자 ن (na-)은 '우리'를 뜻해서, 아랍어에는 '우리'에 해당하는 별도의 단어가 필요 없어요. معا (maʿan)는 '함께'라는 뜻이에요.
  ar.a1.unit25.lesson04.teach.ywsf_ahb_altbkh:
    title: 유수프의 취미
    gloss: '유수프: 저는 요리를 좋아해요, 집에서도요. 그리고 운동도 자주 해요.'
    note: في البيت أيضا (fī al-bayt ayḍan)는 '집에서도'라는 뜻을 더해요. وأمارس (wa-umāris)는 و ('그리고')가 동사에 붙어 한 단어로 쓰여요.
  ar.a1.unit25.lesson04.teach.lyla_hl_ttbkh:
    title: 레일라가 놀라요
    gloss: '레일라: 집에서도 요리하세요? 일하면서 이미 하루 종일 요리하시잖아요!'
    note: تطبخ (taṭbukh)는 남자에게 쓰는 '당신은 요리해요'이고, 여자에게는 تطبخين (taṭbukhīn)이라고 해요. طوال اليوم (ṭawāl al-yawm)은 '하루 종일'이라는 뜻이에요.
  ar.a1.unit25.lesson04.teach.ywsf_nam_lknny:
    title: 유수프가 설명해요
    gloss: '유수프: 네, 하지만 저는 요리가 편안하게 느껴져요. 그럼 레일라는 뭐 하는 걸 좋아해요?'
    note: أجد (ajid)는 '저는 ~라고 느껴요', مريحا (murīḥan)는 '편안한'이라는 뜻이에요. وأنت (wa-anta)는 و가 أنت에 붙은 형태로 '그리고 당신은'이라는 뜻이에요.
  ar.a1.unit25.lesson04.teach.lyla_ahb_alqraaa:
    title: 레일라의 취미
    gloss: '레일라: 저는 독서를 좋아하고 음악을 자주 들어요.'
    note: 'و는 두 취미를 이어 줘요: أحب القراءة (uḥibb al-qirāʾa)와 وأستمع (wa-astamiʿ, ''그리고 저는 들어요''). 다음 단어에 붙여 써요.'
  ar.a1.unit25.lesson04.teach.ywsf_hl_tlabyn:
    title: 유수프가 게임에 대해 물어요
    gloss: '유수프: 비디오 게임도 하세요?'
    note: تلعبين (talʿabīn)은 여자에게 쓰는 '당신은 해요'예요. 유수프가 레일라에게 묻고 있기 때문이에요. 남자에게는 تلعب (talʿab)이라고 해요. هل (hal)은 예/아니요 질문을 시작해요.
  ar.a1.unit25.lesson04.teach.lyla_la_la:
    title: 레일라가 대답해요
    gloss: '레일라: 아니요, 저는 비디오 게임은 절대 안 해요. 하지만 가끔 그림은 그려요!'
    note: 'أبدا (abadan)는 ''절대'', أحيانا (aḥyānan)는 ''가끔''이라는 뜻이에요. 동사는 لا (lā)로 부정해요: لا ألعب (lā alʿab)는 ''저는 하지 않아요''라는 뜻이에요.'
  ar.a1.unit25.lesson05.teach.ana_wywsf_ntmsha:
    title: 취미 비교하기
    gloss: 유수프와 저는 함께 자주 산책해요. 하지만 다른 취미도 있어요. 유수프는 요리를 좋아해서 집에서도 요리하고, 운동도 자주 해요. 저는 독서를 좋아하고 음악을 자주 들어요. 가끔 그림을 그리지만 비디오 게임은 절대 하지 않아요. 여러분은 여가 시간에 무엇을 하는 걸 좋아하세요?
    note: 레일라의 메시지는 앞에서 나온 내용을 정리하고, 이 단원의 핵심 질문을 읽는 사람에게 던지며 끝나요.
    glosses:
      نتمشى: 산책하다
      كثيرا: 자주
      معا: 함께
      أخرى: 다른
      يطبخ: 요리하다
      يحب: 즐겨
      البيت: 집 (집에서)
      ويمارس: 운동하다
      أقرأ: 읽다
      وأستمع: 듣다
      الموسيقى: 음악
      أرسم: 그리다
      أحيانا: 가끔
      ألعب: (비디오 게임을) 하다
      أبدا: 전혀 하지 않다
      فراغك: 당신의 여가 (시간)
      وقت: 시간
  ar.a1.unit25.lesson06.teach.ywsf_madha_stfalyn:
    title: 유수프가 주말 계획을 물어요
    gloss: '유수프: 이번 주말에 뭐 할 거예요?'
    note: ستفعلين (sa-tafʿalīn)은 미래형이에요. 첫 글자 س (sa-)가 미래를 나타내고, 끝의 ين은 여자에게 쓰는 형태예요. عطلة نهاية الأسبوع (ʿuṭlat nihāyat al-usbūʿ)는 '주말'이에요.
  ar.a1.unit25.lesson06.teach.lyla_la_aarf:
    title: 레일라가 아직 정하지 못했어요
    gloss: '레일라: 아직 모르겠어요. 독서도 좋아하지만, 밖에 나가고도 싶어요.'
    note: لا أعرف بعد (lā aʿrif baʿd)는 '아직 모르겠어요'라는 뜻이에요. أن أخرج (an akhruj)는 '나가는 것'이라는 뜻이에요.
  ar.a1.unit25.lesson06.teach.ywsf_hl_ntmsha:
    title: 유수프가 계획을 제안해요
    gloss: '유수프: 같이 산책할까요? 그다음에 제가 우리를 위해 요리할게요.'
    note: هل نتمشى (hal natamashshā)는 함께 무언가를 제안할 때 쓰는 일반적인 표현으로, هل + '우리' 동사 형태예요. لنا (lanā)는 ل ('~를 위해')과 نا ('우리')가 합쳐져 한 단어로 쓰여요.
  ar.a1.unit25.lesson06.teach.lyla_fkra_jyda:
    title: 레일라가 동의해요
    gloss: '레일라: 좋은 생각이에요! 저는 산책도 요리도 둘 다 좋아해요.'
    note: 'كليهما (kilayhimā)는 ''둘 다''라는 뜻이며 끝에 와서 두 가지를 가리켜요: المشي والطبخ (al-mashy wa-aṭ-ṭabkh).'
  ar.a1.unit25.lesson06.teach.ywsf_mmtaz_idhn:
    title: 유수프가 확정해요
    gloss: '유수프: 좋아요. 그럼 토요일에 봐요!'
    note: يوم السبت (yawm as-sabt)는 '토요일에'라는 뜻이에요. ال의 ل은 태양 글자인 س 앞에서 발음되지 않아서 as-sabt라고 써요.
