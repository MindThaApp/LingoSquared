teaching:
  ar.a1.unit02.lesson01.teach.ma_ismuka:
    title: 이름이 뭐예요?
    gloss: 성함이 어떻게 되세요?
    note: ما اسمك؟ (mā ismuk)는 이름을 묻는 표준 표현이에요. 모음 표시 없이 쓴 형태는 누구에게나 똑같이 쓸 수 있어요.
  ar.a1.unit02.lesson01.teach.ismee:
    title: 제 이름은 ~예요
    gloss: 제 이름은 ~예요
    note: اسمي (ismī)는 اسم(이름)에 소유를 나타내는 어미 ـي(나의)가 붙은 형태예요.
    example_gloss: 제 이름은 카림이에요.
  ar.a1.unit02.lesson01.teach.ana:
    title: 나
    gloss: 나
    note: أنا (anā)는 "나"를 뜻하는 독립 대명사예요. 아랍어 동사는 스스로 인칭도 나타내지만, أنا는 강조할 때나 이 문장처럼 간단한 명사문에서 써요.
    example_gloss: 저는 사라예요.
  ar.a1.unit02.lesson01.teach.tasharrafna:
    title: 만나서 반가워요
    gloss: 만나서 반갑습니다
    note: تشرفنا (tasharrafnā)는 직역하면 "우리가 영광이에요"라는 뜻으로, 처음 만났을 때 서로 주고받는 표준 표현이에요. 누가 먼저 말해도 돼요.
  ar.a1.unit02.lesson02.teach.min_ayna:
    title: 어디에서 왔어요?
    gloss: 어디에서 왔어요?
    note: من أين أنت؟ (남성에게는 min ayna anta, 여성에게는 min ayna anti)는 출신을 묻는 표현이에요. 모음 없이 쓴 철자는 둘 다 같아요.
  ar.a1.unit02.lesson02.teach.ana_min:
    title: 저는 ~ 출신이에요
    gloss: 저는 ~ 출신이에요
    note: أنا من (anā min) 바로 뒤에 나라나 도시 이름이 와요.
  ar.a1.unit02.lesson02.teach.lubnan:
    title: 레바논
    gloss: 레바논
    note: لبنان (lubnān)은 이 단원의 다른 대부분의 나라와 달리 정관사를 붙이지 않아요.
    example_gloss: 저는 레바논 출신이에요.
  ar.a1.unit02.lesson02.teach.misr:
    title: 이집트
    gloss: 이집트
    note: مصر (miṣr)도 정관사를 붙이지 않아요.
    example_gloss: 저는 이집트 출신이에요.
  ar.a1.unit02.lesson02.teach.urdun:
    title: 요르단
    gloss: 요르단
    note: الأردن (al-ʾurdun)은 이 단원의 المغرب, العراق처럼 이름에 항상 정관사 الـ가 붙어요.
    example_gloss: 저는 요르단 출신이에요.
  ar.a1.unit02.lesson02.teach.maghrib:
    title: 모로코
    gloss: 모로코
    note: المغرب (al-maghrib)는 문자 그대로 '서쪽'이라는 뜻이에요. 해 질 녘 예배 시간(마그리브)에 쓰이는 것과 같은 어근이에요.
    example_gloss: 저는 모로코 출신이에요.
  ar.a1.unit02.lesson02.teach.soorya:
    title: 시리아
    gloss: 시리아
    note: سوريا (sūryā)에는 정관사가 붙지 않아요.
    example_gloss: 저는 시리아 출신이에요.
  ar.a1.unit02.lesson02.teach.iraq:
    title: 이라크
    gloss: 이라크
    note: العراق (al-ʿirāq)에는 정관사가 붙어요.
    example_gloss: 저는 이라크 출신이에요.
  ar.a1.unit02.lesson03.teach.hal_anta_min:
    title: ~ 출신이에요?
    gloss: 이집트 출신이에요?
    note: هل (hal)은 문장 맨 앞에 놓여 '예/아니요'로 답하는 의문문을 만드는 말이에요. 그 자체에는 따로 뜻이 없어요.
  ar.a1.unit02.lesson03.teach.naam:
    title: 네
    gloss: 네
    note: نعم (naʿam)은 긍정으로 답할 때 쓰는 기본적인 말이에요.
    example_gloss: 네, 저는 이집트 출신이에요.
  ar.a1.unit02.lesson03.teach.laa:
    title: 아니요
    gloss: 아니요
    note: لا (lā)는 부정으로 답할 때 쓰는 기본적인 말이에요.
    example_gloss: 아니요, 저는 레바논 출신이에요.
  ar.a1.unit02.lesson03.teach.saidtu_biliqaaik:
    title: 만나서 기뻤어요
    gloss: 만나서 기뻤어요
    note: سعدت بلقائك (saʿidtu bi-liqāʾik)는 تشرفنا보다 더 따뜻한 마무리 인사로, 헤어지기 직전에 자주 써요.
  ar.a1.unit02.lesson03.teach.marhaban_bik:
    title: 환영해요
    gloss: 환영해요 / 언제든 오세요
    note: مرحبا بك (marḥaban bik)에는 '당신에게'라는 뜻의 بك이 붙어요. 전치사 بـ에 '당신'을 나타내는 접미 대명사 ـك이 결합한 형태로, أهلا بك의 بك과 같아요.
  ar.a1.unit02.lesson04.teach.line01:
    title: 첫인사
    gloss: 유수프가 레일라에게 인사해요.
    note: 이름을 주고받기 전에 간단한 مرحبا로 대화를 시작해요.
  ar.a1.unit02.lesson04.teach.line02:
    title: 첫인사, 답
    gloss: 레일라도 인사로 답해요.
    note: 같은 말 مرحبا를 인사하는 양쪽 모두 쓸 수 있어요.
  ar.a1.unit02.lesson04.teach.line03:
    title: 이름 묻기
    gloss: 유수프가 레일라의 이름을 물어요.
    note: ما اسمك؟로 자기소개를 시작해요.
  ar.a1.unit02.lesson04.teach.line04:
    title: 이름 묻기, 답
    gloss: 레일라가 대답하고 되물어요.
    note: وأنت؟는 문장을 전부 반복하지 않고 같은 질문을 되묻는 흔한 줄임 표현이에요.
  ar.a1.unit02.lesson04.teach.line05:
    title: 대답과 서로의 기쁨
    gloss: 유수프가 이름을 말하고 만나서 반갑다고 해요.
    note: تشرفنا로 이름 주고받기를 마무리해요.
  ar.a1.unit02.lesson04.teach.line06:
    title: 서로의 기쁨, 답
    gloss: 레일라도 같은 말로 답해요.
    note: تشرفنا는 한 사람만이 아니라 두 사람 모두 자연스럽게 말해요.
  ar.a1.unit02.lesson04.teach.line07:
    title: 출신 묻기
    gloss: 유수프가 레일라의 출신을 물어요.
    note: من أين أنت؟로 대화가 출신 이야기로 넘어가요.
  ar.a1.unit02.lesson04.teach.line08:
    title: 출신 묻기, 답
    gloss: 레일라가 대답하고 되물어요.
    note: 레일라는 앞에서처럼 وأنت؟라는 줄임 표현으로 다시 되물어요.
  ar.a1.unit02.lesson04.teach.line09:
    title: 출신 말하기
    gloss: 유수프가 레바논 출신이라고 말해요.
    note: أنا من لبنان은 앞서 배운 것과 같은 패턴이에요.
  ar.a1.unit02.lesson04.teach.line10:
    title: 대화 마무리
    gloss: 레일라가 만나서 기뻤다고 말해요.
    note: سعدت بلقائك는 대화가 자연스럽게 끝나 간다는 신호예요.
  ar.a1.unit02.lesson04.teach.line11:
    title: 작별 인사
    gloss: 유수프가 언제든 또 오라고 하며 작별 인사를 해요.
    note: دائما(항상, 언제나)는 مرحبا بك을 언제든 오라는 초대로 부드럽게 만든 뒤, 작별 인사 مع السلامة로 이어져요.
  ar.a1.unit02.lesson04.teach.line12:
    title: 작별 인사, 답
    gloss: 레일라도 작별 인사를 해요.
    note: مع السلامة로 대화를 마무리해요. a1_unit01에서 배웠어요.
