teaching:
  ar.a1.unit26.lesson01.teach.twyl_qsyr:
    title: 키가 큰, 키가 작은
    gloss: 키가 큰 / 키가 작은
    note: 'طويل (ṭawīl)은 ''키가 크다'', قصير (qaṣīr)는 ''키가 작다''는 뜻이에요. 여자에게는 ة가 붙어요: طويلة (ṭawīla), قصيرة (qaṣīra).'
    example_gloss:
    - 사라는 키가 커요.
    - 카림은 키가 작아요.
  ar.a1.unit26.lesson01.teach.kbyr_fy_alsn:
    title: 나이 든, 젊은
    gloss: 나이 든 / 젊은
    note: كبير في السن (kabīr fī as-sinn)과 صغير في السن (ṣaghīr fī as-sinn)은 정확한 나이가 아니라 대략적인 나이 인상을 나타내요.
    example_gloss:
    - 할아버지는 나이가 많으세요.
    - 유수프는 젊어요.
  ar.a1.unit26.lesson01.teach.km_amrk_sual:
    title: '나이: 숫자 또는 인상'
    gloss: 'كم عمرك؟ (kam ʿumruka?)는 몇 살인지 숫자를 묻는 말이고, كبير في السن (kabīr fī as-sinn)은 숫자 없이 대략적인 인상을 말해요. 예: الجد كبير في السن (al-jadd kabīr fī as-sinn).'
    note: 정확히 몇 살인지 물을 때는 كم عمرك؟를 쓰세요. 여기서 كبير في السن은 나이 들어 보인다는 것만 나타내요.
  ar.a1.unit26.lesson01.teach.sara_twyla_wkrym:
    title: 사라는 키가 크고 카림은 키가 작아요
    gloss: 사라는 키가 크고 카림은 키가 작아요.
    note: 'و (wa-)는 두 문장을 이어 주고, 다음 단어에 붙여 써요: وكريم (wa-karīm). 형용사는 성에 일치해요: سارة طويلة은 여성형이고 كريم قصير는 남성형이에요.'
  ar.a1.unit26.lesson02.teach.alshar:
    title: 머리카락
    gloss: 머리카락
    note: 'الشعر (ash-shaʿr)는 ''머리카락''이라는 뜻이에요. ش는 태양 문자이므로 ال의 ل은 발음하지 않아요: ash-shaʿr.'
    example_gloss: 유수프는 짧은 검은 머리예요.
  ar.a1.unit26.lesson02.teach.ashqr_bny_rmady:
    title: 금발, 갈색, 회색
    gloss: 금발 / 갈색 / 회색
    note: 'أشقر (ashqar), بني (bunnī), رمادي (ramādī)는 머리카락을 묘사하며 명사 뒤에 와요: شعر أشقر (shaʿr ashqar).'
    example_gloss:
    - 레일라는 금발 머리예요.
    - 카림은 갈색 머리예요.
    - 할아버지는 백발이에요.
  ar.a1.unit26.lesson02.teach.shar_twyl_shar:
    title: 긴 머리, 짧은 머리
    gloss: 긴 / 짧은 (머리)
    note: 'طويل (ṭawīl)과 قصير (qaṣīr)는 머리카락에도 쓰여요: شعر طويل (shaʿr ṭawīl), شعر قصير (shaʿr qaṣīr). شعر는 남성이므로 그 뒤에 와요.'
    example_gloss:
    - 사라는 긴 머리예요.
    - 카림은 짧은 머리예요.
  ar.a1.unit26.lesson02.teach.alsfa_taty_bad:
    title: 형용사는 명사 뒤에 와요
    gloss: '아랍어에서 형용사는 명사 뒤에 오며 명사에 일치해요: شعر قصير (shaʿr qaṣīr), شعر طويل (shaʿr ṭawīl), شعر أشقر (shaʿr ashqar), شعر بني (shaʿr bunnī), شعر رمادي (shaʿr ramādī), شعر أسود (shaʿr aswad).'
    note: شعر (shaʿr)는 남성이므로 형용사도 남성형이에요. 한정되지 않은 명사에서는 두 단어 모두 ال을 붙이지 않아요.
  ar.a1.unit26.lesson02.teach.ndyf_aldmyr_ha:
    title: 머리카락과 그녀의 머리카락
    gloss: شعر (shaʿr)는 '머리카락'이에요. 대명사 ها (hā, 그녀의)를 붙이면 شعرها (shaʿruhā, 그녀의 머리카락)가 돼요.
    note: '어미 ها는 소유자를 나타내요: شعرها (그녀의 머리카락), اسمها (그녀의 이름), عيناها (그녀의 눈). 단어에 붙여 써요.'
  ar.a1.unit26.lesson02.teach.lywsf_shar_qsyr:
    title: 유수프는 짧은 검은 머리예요
    gloss: 유수프는 짧은 검은 머리예요.
    note: 'ليوسف شعر قصير أسود (li-yūsuf shaʿr qaṣīr aswad): 이름 앞의 ل (li-)는 ''~에게 있다''는 뜻이며, 이름에 붙여 써요.'
  ar.a1.unit26.lesson02.teach.llyla_shar_twyl:
    title: 레일라는 긴 금발 머리예요
    gloss: 레일라는 긴 금발 머리예요.
    note: 이번 과의 길이와 색 어휘를 자연스러운 한 문장에 모았어요.
  ar.a1.unit26.lesson03.teach.alaynan:
    title: 눈
    gloss: 눈
    note: العينان (al-ʿaynān)은 '눈'이라는 뜻이에요. 쌍수 명사로, 아랍어에는 정확히 둘을 나타내는 특별한 어미 ان이 있어요.
    example_gloss: 유수프는 갈색 눈을 가졌어요.
  ar.a1.unit26.lesson03.teach.azrq_bny_akhdr:
    title: 파란색, 갈색, 초록색
    gloss: 파란색 / 갈색 / 초록색
    note: أزرق(azraq, 파란색), بني(bunnī, 갈색), أخضر(akhḍar, 초록색)는 남성형이에요. عينان(눈 두 개)과 함께 쓸 때는 쌍수형인 زرقاوان(zarqāwān), بنيتان(bunnīyatān), خضراوان(khaḍrāwān)을 써요.
    example_gloss:
    - 레일라는 눈이 파란색이에요.
    - 카림은 눈이 갈색이에요.
    - 사라는 눈이 초록색이에요.
  ar.a1.unit26.lesson03.teach.aynan_mthna_ldhlk:
    title: 쌍수 명사 눈, 쌍수 형용사
    gloss: 'عينان(ʿaynān)은 쌍수라서 형용사도 쌍수로 써요: عينان زرقاوان(ʿaynān zarqāwān), عينان بنيتان(ʿaynān bunnīyatān), عينان خضراوان(ʿaynān khaḍrāwān).'
    note: 쌍수에서는 명사와 형용사 모두에 어미 ان이 붙어요. 또 عين은 여성 명사이기 때문에 형용사도 여성형이에요.
  ar.a1.unit26.lesson03.teach.kyf_tbdw_lyla:
    title: 레일라는 어떻게 생겼나요?
    gloss: 레일라는 어떻게 생겼나요?
    note: كيف تبدو ليلى؟(kayfa tabdū laylā?)는 레일라가 어떻게 생겼는지 묻는 말이에요. 레일라가 여자라서 تبدو(tabdū)를 쓰고, 남자일 때는 يبدو(yabdū)를 써요.
  ar.a1.unit26.lesson03.teach.llyla_shar_twyl:
    title: 레일라는 금발 장발에 파란 눈이에요
    gloss: 레일라는 긴 금발 머리에 파란 눈을 가졌어요.
    note: 'لليلى شعر طويل أشقر وعينان زرقاوان(li-laylā shaʿr ṭawīl ashqar wa-ʿaynān zarqāwān): ل + 이름은 ''~은(는) …을 가졌다''는 뜻이고, و는 머리카락과 눈을 이어 줘요.'
  ar.a1.unit26.lesson04.teach.lyla_staty_ftaa:
    title: 레일라가 누르를 소개해요
    gloss: '레일라: 새로운 여자아이가 언어 카페에 올 거예요. 이름은 누르예요.'
    note: ستأتي(sa-taʾtī)는 '그녀가 올 것이다'라는 뜻이에요. س(sa-)는 미래를, ت(ta-)는 '그녀'를 나타내요. اسمها(ismuhā)는 '그녀의 이름'이라는 뜻이에요.
  ar.a1.unit26.lesson04.teach.ywsf_hsna_kyf:
    title: 유수프가 어떻게 생겼는지 물어요
    gloss: '유수프: 좋아요! 어떻게 생겼어요?'
    note: كيف تبدو؟(kayfa tabdū?)에는 이번에 이름이 없어요. 동사 تبدو 자체가 '그녀가 ~해 보인다'는 뜻이기 때문이에요.
  ar.a1.unit26.lesson04.teach.lyla_hy_qsyra:
    title: 레일라가 누르의 키와 머리카락을 설명해요
    gloss: '레일라: 키가 작고 짧은 금발 머리예요.'
    note: قصيرة(qaṣīra)는 누르가 여자라서 여성형이지만, شعر قصير أشقر는 شعر가 남성 명사라서 남성형 그대로예요.
  ar.a1.unit26.lesson04.teach.ywsf_waynaha:
    title: 유수프가 눈에 대해 물어요
    gloss: '유수프: 눈은요?'
    note: وعيناها(wa-ʿaynāhā)는 '그리고 그녀의 눈'이라는 뜻이에요. و(wa-)는 명사에 붙여 쓰고, 끝의 ها(hā)는 '그녀의'를 뜻해요.
  ar.a1.unit26.lesson04.teach.lyla_lha_aynan:
    title: 레일라가 누르의 눈을 설명해요
    gloss: '레일라: 초록색 눈을 가졌어요.'
    note: لها(lahā)는 '그녀는 ~을 가졌다'라는 뜻으로, ل(la-) + ها(hā)예요. عينان خضراوان(ʿaynān khaḍrāwān)은 쌍수 명사에 쌍수 형용사가 온 표현이에요.
  ar.a1.unit26.lesson04.teach.ywsf_shkra_idhn:
    title: 유수프가 누르를 알아볼 거예요
    gloss: '유수프: 고마워요! 그럼 제가 알아볼 수 있겠네요.'
    note: سأتعرف عليها(sa-ataʿarraf ʿalayhā)는 '제가 그녀를 알아볼 것이다'라는 뜻이에요. س(sa-)는 미래를 나타내고, عليها의 ها는 '그녀'를 뜻해요.
  ar.a1.unit26.lesson05.teach.sara_akht_krym:
    title: 카림과 사라 비교하기
    gloss: 카림과 사라는 남매이지만 생김새가 달라요. 카림은 키가 작고 짧은 갈색 머리에 갈색 눈이에요. 사라는 카림보다 키가 크고 긴 갈색 머리에 초록색 눈이에요. 당신은 어떻게 생겼어요?
    note: 지금까지 배운 색과 길이 어휘를 모두 다시 쓴 짧은 비교 글이에요. 마지막에는 이번 단원의 핵심 질문을 읽는 사람에게 던져요.
    glosses:
      أخ: 남자 형제
      أخت: 여자 형제
      تبدو: ~해 보이다
      مختلفان: 다른
      القامة: 키가 작은
      قصير: 키가 작은
      بني: 갈색의
      شعر: 머리카락
      بنيتان: 갈색의
      وعينان: 눈
      أطول: 키가 더 큰
      طويل: 긴
      خضراوان: 초록색
      المظهر: 외모, 생김새
  ar.a1.unit26.lesson05.teach.llmqarna_nstkhdm_afal:
    title: أفعل로 비교하기
    gloss: '비교할 때는 أفعل(afʿal) 형태 + من(min)을 써요: سارة أطول من كريم(sāra aṭwal min karīm), 사라는 카림보다 키가 커요.'
    note: 비교급에서 طويل(ṭawīl)은 أطول(aṭwal)로 바뀌고, من(min)은 '~보다'라는 뜻이에요. 이 형태는 여성에게 쓸 때도 변하지 않아요.
  ar.a1.unit26.lesson05.teach.lsara_shar_atwl:
    title: 사라는 카림보다 머리카락이 길어요
    gloss: 사라는 카림보다 머리카락이 길어요.
    note: 'لسارة شعر أطول من شعر كريم(li-sāra shaʿr aṭwal min shaʿr karīm): شعر가 남성 명사라서 أطول은 남성형 그대로예요.'
  ar.a1.unit26.lesson05.teach.ldy_shar_qsyr:
    title: 저는 짧은 갈색 머리예요
    gloss: 저는 짧은 갈색 머리예요.
    note: 'لدي(ladayya)는 ''저는 ~을 가지고 있다''라는 뜻이에요. 아랍어에는 ''가지다''에 해당하는 동사가 따로 없어요. 형용사는 명사 뒤에 와요: شعر قصير بني(shaʿr qaṣīr bunnī).'
  ar.a1.unit26.lesson06.teach.ywsf_anzry_hl:
    title: 유수프가 누르를 발견해요
    gloss: '유수프: 봐요, 저 사람이 누르인가요? 짧은 금발 머리에 초록색 눈이네요.'
    note: انظري(unẓurī)는 여성에게 하는 명령형이에요. 유수프가 레일라에게 말하고 있기 때문이에요. 남성에게는 انظر(unẓur)라고 해요. هذه(hādhihi)는 여성 명사에 쓰는 '이것'이에요.
  ar.a1.unit26.lesson06.teach.lyla_nam_hdhh:
    title: 레일라가 확인해 줘요
    gloss: '레일라: 네, 누르예요!'
    note: 짧고 자연스러운 확인 표현이에요.
  ar.a1.unit26.lesson06.teach.nwr_mrhba_hl:
    title: 누르가 유수프에게 인사해요
    gloss: '누르: 안녕하세요, 유수프 씨인가요?'
    note: هل أنت يوسف؟(hal anta yūsuf?)는 예/아니요로 답하는 질문이에요. هل(hal) + '이다'에 해당하는 동사가 없는 문장으로 이루어져 있어요.
  ar.a1.unit26.lesson06.teach.ywsf_nam_tshrft:
    title: 유수프도 누르에게 인사해요
    gloss: '유수프: 네! 만나서 반가워요, 누르.'
    note: تشرفت بمعرفتك(tasharraftu bi-maʿrifatika)는 처음 만났을 때 하는 공손한 인사말이에요. ب(bi-)는 معرفتك에 붙여 쓰고, 끝의 ك는 '당신'을 뜻해요.
  ar.a1.unit26.lesson06.teach.nwr_wana_ayda:
    title: 누르도 인사에 답해요
    gloss: '누르: 저도 만나서 반가워요!'
    note: 대화가 마무리돼요. 유수프는 레일라의 설명 덕분에 누르를 잘 알아봤어요.
exercises:
  ar.a1.unit26.lesson01.exercise01.choose_sara_twyla:
    instruction: '''سارة طويلة.''의 뜻을 한국어로 고르세요.'
    correct_option: 사라는 키가 커요.
    distractors:
    - 사라는 키가 작아요.
    - 사라는 나이가 많아요.
    - 사라는 나이가 어려요.
    accepted_answers:
    - value: 사라는 키가 커요.
      status: correct
    feedback: سارة طويلة.
  ar.a1.unit26.lesson01.exercise02.listen_krym_qsyr:
    instruction: 듣고 화자가 말하는 내용을 고르세요.
    correct_option: 카림은 키가 작아요.
    distractors:
    - 카림은 키가 커요.
    - 카림은 나이가 많아요.
    - 카림은 나이가 어려요.
    accepted_answers:
    - value: 카림은 키가 작아요.
      status: correct
    feedback: كريم قصير.
  ar.a1.unit26.lesson01.exercise03.match_twyl_qsyr_kbyr:
    instruction: 각 아랍어 단어나 표현을 알맞은 뜻과 연결하세요.
