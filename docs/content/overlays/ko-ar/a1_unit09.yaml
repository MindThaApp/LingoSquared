teaching:
  ar.a1.unit09.lesson01.teach.place:
    title: 장소
    gloss: 장소
    note: مكان (makān)은 '장소'를 뜻하는 일반적인 단어예요. هذا('이것')는 숫자 단원에서 배웠어요.
    example_gloss: 여기는 어떤 장소예요.
  ar.a1.unit09.lesson01.teach.library:
    title: 도서관
    gloss: 도서관
    note: مكتبة (maktaba)는 '도서관' 또는 '서점'을 뜻할 수 있는데, 여기서는 도서관이에요. المكتبة (al-maktaba)는 '그 도서관'이라는 뜻이에요.
    example_gloss: 도서관은 여기 있어요.
  ar.a1.unit09.lesson01.teach.market:
    title: 시장
    gloss: 시장
    note: سوق (sūq)는 '시장'을 뜻하고, السوق (as-sūq)는 '그 시장'이라는 뜻이에요.
    example_gloss: 시장은 여기 있어요.
  ar.a1.unit09.lesson01.teach.cafe:
    title: 카페
    gloss: 카페
    note: مقهى (maqhā)는 '카페'라는 뜻이고, قهوة(커피)와 관련된 단어예요. المقهى (al-maqhā)는 '그 카페'예요.
    example_gloss: 카페는 여기에 있어요.
  ar.a1.unit09.lesson01.teach.here:
    title: 여기
    gloss: 여기
    note: هنا (hunā)는 보통 장소 뒤에 와요. المقهى هنا는 '카페는 여기에 있어요'라는 뜻이에요. 이 문장에서 아랍어는 '있다'에 해당하는 단어가 필요 없어요.
    example_gloss: 카페는 여기에 있어요.
  ar.a1.unit09.lesson02.teach.where_library:
    title: 도서관은 어디에 있어요?
    gloss: 도서관은 어디에 있어요?
    note: أين (ayna)은 '어디'를 묻는 말이에요. من أين أنت؟(어디 출신이에요?)에서 이미 만났어요.
    example_gloss: '유세프가 말했어요: 도서관은 어디에 있어요?'
  ar.a1.unit09.lesson02.teach.near:
    title: 가까이
    gloss: 근처에
    note: قرب (qurba)는 '가까이'라는 뜻이고, 가리키는 장소 앞에 와요. قرب المكتبة는 '도서관 근처'예요. بالقرب من (bi-l-qurbi min)도 같은 뜻이에요.
    example_gloss: 카페는 도서관 근처에 있어요.
  ar.a1.unit09.lesson02.teach.library_near_market:
    title: 도서관은 시장 근처에 있어요
    gloss: 도서관은 시장 근처에 있어요
    note: 이 문장에서 아랍어는 '있다'에 해당하는 별도의 단어가 필요 없어요.
    example_gloss: '레일라가 말했어요: 도서관은 시장 근처에 있어요.'
  ar.a1.unit09.lesson02.teach.line01:
    title: 어디인지 묻기
    gloss: 유세프가 도서관이 어디에 있는지 물어요.
    note: أين으로 위치를 묻는 질문을 시작해요.
    example_gloss: '유세프가 말했어요: 도서관은 어디에 있어요?'
  ar.a1.unit09.lesson02.teach.line02:
    title: 도서관 위치 말하기
    gloss: 레일라가 도서관은 여기, 시장 근처에 있다고 말해요.
    note: 'هنا와 قرب는 함께 쓸 수 있어요: 여기, 시장 근처.'
    example_gloss: '레일라가 말했어요: 도서관은 여기 시장 근처에 있어요.'
  ar.a1.unit09.lesson02.teach.line03:
    title: 카페가 어디인지 묻기
    gloss: 유세프가 카페가 어디에 있는지 물어요.
    note: 'و (wa, 그리고)는 다음 단어에 붙여 써요: وأين (wa-ayna)는 ''그럼 어디''라는 뜻이에요.'
    example_gloss: '유세프가 말했어요: 그럼 카페는 어디에 있어요?'
  ar.a1.unit09.lesson02.teach.line04:
    title: 카페 위치 말하기
    gloss: 레일라가 카페는 도서관 근처에 있다고 말해요.
    note: '장소 + قرب + 다른 장소: المقهى قرب المكتبة는 ''카페는 도서관 근처에 있어요''예요.'
    example_gloss: '레일라가 말했어요: 카페는 도서관 근처에 있어요.'
