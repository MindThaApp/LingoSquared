    gloss: 네, 5시에요
    note: نعم과 시각만으로 대답할 수 있어요. 동사는 필요 없어요.
    example_gloss: '유수프가 말했어요: 네, 5시에요.'
  ar.a1.unit12.lesson02.teach.decline:
    title: 간단히 거절하기
    gloss: 아니요, 수업이 있어요
    note: لا로 간단히 거절하고, 이어서 عندي(저는 ~이 있어요)로 이유를 말해요.
    example_gloss: 아니요, 내일 수업이 있어요.
  ar.a1.unit12.lesson02.teach.line01:
    title: 레일라의 제안
    gloss: 레일라가 내일 카페에 가자고 제안해요.
