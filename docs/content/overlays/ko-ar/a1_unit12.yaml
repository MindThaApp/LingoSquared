    gloss: 유수프가 수락하며 시간을 말해요.
    note: 이제 계획에 할 일, 날짜, 시간이 모두 갖춰졌어요.
    example_gloss: '유수프가 말했어요: 네, 5시에요.'
  ar.a1.unit12.lesson02.teach.line03:
    title: 레일라의 확정
    gloss: 레일라가 좋다고 말하고 작별 인사를 해요.
    note: جيد(jayyid)는 '좋아요'라는 뜻이고, 여기서는 계획을 확정해요. إلى اللقاء는 인사 단원에서 배운 작별 인사예요.
    example_gloss: '레일라가 말했어요: 좋아요. 또 만나요.'
