teaching:
  ar.a1.unit01.lesson01.teach.rtl:
    title: 아랍어는 오른쪽에서 왼쪽으로 써요
    gloss: 아랍어는 오른쪽에서 왼쪽으로 써요.
    note: 아랍어는 오른쪽 끝에서 왼쪽으로 읽어요.
  ar.a1.unit01.lesson01.teach.mim:
    title: 글자 م
    gloss: m
    note: م은 m 소리를 나타내며, 단어 안에서의 위치에 따라 모양이 바뀌어요.
  ar.a1.unit01.lesson01.teach.ra:
    title: 글자 ر
    gloss: r
    note: ر은 혀를 굴리는 r 소리를 나타내며, 뒤에 오는 글자와는 이어지지 않아요.
  ar.a1.unit01.lesson01.teach.ha:
    title: 글자 ح
    gloss: ḥ
    note: ح은 목 깊은 곳에서 바람을 내며 내는 h 소리예요. 한국어의 ㅎ보다 훨씬 깊고 거칠게 소리 나요.
  ar.a1.unit01.lesson01.teach.ba:
    title: 글자 ب
    gloss: b
    note: ب은 b 소리를 나타내며, 앞뒤 글자와 이어져요.
  ar.a1.unit01.lesson01.teach.alef:
    title: 글자 ا
    gloss: ā / a
    note: ا는 긴 ā 모음을 나타내며, 뒤에 오는 글자와는 이어지지 않아요.
  ar.a1.unit01.lesson01.teach.marhaba_shape:
    title: مرحبا 만들기
    gloss: 안녕하세요
    note: مرحبا는 marḥaban이라고 읽어요. 아랍어 표기에서는 보통 짧은 모음을 쓰지 않아요.
    example_gloss: 안녕하세요! 저는 사라예요.
  ar.a1.unit01.lesson02.teach.marhaba:
    title: 안녕하세요
    gloss: 안녕하세요
    note: مرحبا는 거의 모든 상황에서 쓸 수 있는 따뜻한 인사말이에요.
    example_gloss: 안녕, 잘 지내?
  ar.a1.unit01.lesson02.teach.sabah_alkhayr:
    title: 좋은 아침이에요
    gloss: 좋은 아침이에요
    note: صباح الخير는 ṣabāḥ al-khayr라고 읽으며, 직역하면 '좋음의 아침'이에요.
  ar.a1.unit01.lesson02.teach.masaa_alkhayr:
    title: 좋은 오후 또는 저녁이에요
    gloss: 좋은 오후예요 / 좋은 저녁이에요
    note: مساء الخير는 masāʾ al-khayr라고 읽으며, 늦은 오후부터 저녁까지 쓰는 인사말이에요.
  ar.a1.unit01.lesson02.teach.maa_alsalama:
    title: 작별 인사
    gloss: 안녕히 가세요
    note: مع السلامة는 maʿa as-salāma라고 읽으며, 직역하면 '안전과 함께'예요. 가장 일반적인 작별 인사예요.
    example_gloss: 고마워요, 안녕히 가세요!
  ar.a1.unit01.lesson02.teach.shukran:
    title: 고맙습니다
    gloss: 고맙습니다
    note: شكرا는 shukran이라고 읽으며, 어떤 상황에서든 쓸 수 있어요.
    example_gloss: 정말 고맙습니다.
  ar.a1.unit01.lesson02.teach.afwan:
    title: 천만에요
    gloss: 천만에요
    note: عفوا(ʿafwan)는 شكرا에 대한 일반적인 대답이에요. 다른 상황에서는 '실례합니다'라는 뜻으로도 쓸 수 있어요.
  ar.a1.unit01.lesson03.teach.tusbih_ala_khayr:
    title: 안녕히 주무세요
    gloss: 잘 자요
    note: تصبح على خير(tuṣbiḥ ʿalā khayr)는 밤에 헤어지거나 잠자리에 들 때 하는 말이며, 처음 만났을 때 하는 인사는 아니에요. تصبح는 남자에게 하는 형태이고, 여자에게는 تصبحين على خير(tuṣbiḥīna ʿalā khayr)라고 해요.
  ar.a1.unit01.lesson03.teach.ahlan_wa_sahlan:
    title: 환영해요
    gloss: 환영해요
    note: أهلا وسهلا(ahlan wa sahlan)는 손님을 맞이하거나 도착한 사람에게 따뜻하게 인사할 때 써요.
    example_gloss: 환영해요! 어서 오세요.
  ar.a1.unit01.lesson03.teach.ila_alliqaa:
    title: 또 만나요
    gloss: 또 만나요 / 다시 만날 때까지
    note: إلى اللقاء(ilā al-liqāʾ)는 격식 있고 중립적인 작별 인사예요.
  ar.a1.unit01.lesson03.teach.sabah_alnoor:
    title: 좋은 아침이에요, 대답
    gloss: 좋은 아침이에요 [대답]
    note: صباح النور(ṣabāḥ an-nūr, '빛의 아침')는 صباح الخير에 대한 일반적인 대답이에요.
  ar.a1.unit01.lesson03.teach.masaa_alnoor:
    title: 좋은 저녁이에요, 대답
    gloss: 좋은 저녁이에요 [대답]
    note: مساء النور(masāʾ an-nūr)는 مساء الخير에 대한 일반적인 대답이에요.
  ar.a1.unit01.lesson03.teach.yawman_saeedan:
    title: 좋은 하루 보내세요
    gloss: 좋은 하루 보내세요
    note: يوما سعيدا(yawman saʿīdan)는 마무리할 때 건네는 따뜻한 덕담이에요.
  ar.a1.unit01.lesson04.teach.kayfa_haluk:
    title: 어떻게 지내요?
    gloss: 어떻게 지내요?
    note: كيف حالك؟(kayfa ḥāluk)는 안부를 묻는 가장 기본적인 표현이에요. 모음 부호 없이 쓰면 듣는 사람이 누구든 같은 표기를 쓸 수 있어요.
  ar.a1.unit01.lesson04.teach.gender_note:
    title: 남성에게 쓰는 “너”와 여성에게 쓰는 “너”
    gloss: 너 (남성) / 너 (여성)
    note: 말할 때는 أنتَ(anta, 남자에게)와 أنتِ(anti, 여자에게)를 구분하고, حالَك와 حالِك도 같은 방식으로 구분해요. 여기에 나온 모음 부호가 없으면, 이 과정에서 쓰는 표기는 남녀 모두 똑같아요.
  ar.a1.unit01.lesson04.teach.bikhayr:
    title: 잘 지내요
    gloss: 잘 지내요
    note: بخير(bikhayr)는 كيف حالك؟에 대한 가장 기본적인 긍정 대답이에요.
    example_gloss: 저는 오늘 잘 지내요.
  ar.a1.unit01.lesson04.teach.alhamdulillah:
    title: 하느님 덕분이에요
    gloss: 덕분에요 / 하느님을 찬양해요
    note: الحمد لله(al-ḥamdu lillāh)는 말하는 사람의 종교와 상관없이 대답할 때 بخير 뒤에 아주 흔히 붙어요. 한국어의 '덕분에요'처럼 대화를 마무리하는 일상적인 표현이에요.
    example_gloss: 잘 지내요, 덕분에요.
  ar.a1.unit01.lesson04.teach.wa_anta:
    title: 당신은요?
    gloss: 당신은요?
    note: وأنت؟(남자에게는 wa anta, 여자에게는 wa anti)는 같은 질문을 되돌려 묻는 말이에요. 모음 부호 없는 표기는 둘 다 같아요.
  ar.a1.unit01.lesson04.teach.mumtaz:
    title: 아주 좋아요
    gloss: 아주 좋아요 / 최고예요
    note: ممتاز(mumtāz)는 بخير보다 더 신나는 느낌의 표현이에요.
    example_gloss: 저는 오늘 아주 좋아요!
  ar.a1.unit01.lesson04.teach.la_bas:
    title: 나쁘지 않아요
    gloss: 나쁘지 않아요
    note: لا بأس(lā baʾs)는 불평이 아니라 적당히 괜찮다는 자연스러운 대답이에요.
