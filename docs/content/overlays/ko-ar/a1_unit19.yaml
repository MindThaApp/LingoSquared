teaching:
  ar.a1.unit19.lesson01.teach.house:
    title: 집
    gloss: 집
    note: بيت(bayt)는 '집'이에요. 어미 ـي는 '나의'라는 뜻이라서 بيتي(baytī)는 '우리 집/내 집'이에요.
    example_gloss: 우리 집은 도서관 근처에 있어요.
  ar.a1.unit19.lesson01.teach.room:
    title: 방
    gloss: 방
    note: غرفة(ghurfa)는 여성 명사예요(ة로 끝나요). 그래서 여성형 واحدة가 뒤에 와요.
    example_gloss: 우리 집에는 방이 하나 있어요.
  ar.a1.unit19.lesson01.teach.kitchen:
    title: 부엌
    gloss: 주방
    note: مطبخ(maṭbakh)는 '부엌'이에요. 아랍어에는 여기서 '있다'에 해당하는 단어가 없고, في بيتي(우리 집에)로 시작하면 그 역할을 해요.
    example_gloss: 우리 집에는 부엌이 있어요.
  ar.a1.unit19.lesson01.teach.one_room:
    title: 방 하나
    gloss: 방 하나
    note: '숫자 1은 명사 뒤에 오고 명사와 성이 일치해요: غرفة واحدة(ghurfa wāḥida). 남성 명사에는 واحد를 써요.'
    example_gloss: 우리 집에는 방이 하나 있어요.
  ar.a1.unit19.lesson02.teach.table:
    title: 탁자
    gloss: 탁자
    note: طاولة(ṭāwila)는 '탁자'예요. غرفة처럼 ة로 끝나는 여성 명사예요.
    example_gloss: 방에 탁자가 있어요.
  ar.a1.unit19.lesson02.teach.in_room:
    title: 방 안에
    gloss: 방 안에
    note: الغرفة(al-ghurfa)는 '그 방'이라는 뜻이에요.
    example_gloss: 탁자는 방 안에 있어요.
  ar.a1.unit19.lesson02.teach.near_library:
    title: 도서관 근처
    gloss: 도서관 근처
    note: قرب(qurb)는 '근처'라는 뜻이고, المكتبة는 장소 단원에서 배운 '도서관'이에요.
    example_gloss: 우리 집은 도서관 근처에 있어요.
  ar.a1.unit19.lesson02.teach.line01:
    title: 어디인지 묻기
    gloss: 레일라가 유수프의 집이 어디인지 물어요.
    note: أين은 '어디'를 묻는 말이에요. بيتك(baytuka)는 남성에게 하는 '당신의 집'이고, 여성에게는 baytuki이며 표기는 같아요.
    example_gloss: 레일라가 말했어요. "유수프, 당신 집은 어디예요?"
  ar.a1.unit19.lesson02.teach.line02:
    title: 집의 위치
    gloss: 유수프가 자기 집은 도서관 근처라고 말해요.
    note: بيتي는 '우리 집/내 집'이라는 뜻이에요.
    example_gloss: 유수프가 말했어요. "우리 집은 도서관 근처에 있어요."
  ar.a1.unit19.lesson02.teach.line03:
    title: 방
    gloss: 유수프가 자기 집에 방이 하나와 부엌이 있다고 말해요.
    note: 'و(wa, 그리고)는 집의 두 특징을 이어 주며 다음 단어에 붙여 써요: ومطبخ.'
    example_gloss: 유수프가 말했어요. "우리 집에는 방이 하나 있고 부엌도 있어요."
  ar.a1.unit19.lesson02.teach.line04:
    title: 물건 묻기
    gloss: 레일라가 유수프에게 탁자가 있는지 물어요.
    note: هل은 예/아니요로 답하는 질문을 시작해요. عندك(ʿindaka)는 남성에게 하는 '당신은 가지고 있다'이고, 여성에게는 ʿindaki이며 표기는 같아요.
    example_gloss: 레일라가 말했어요. "탁자가 있어요?"
  ar.a1.unit19.lesson02.teach.line05:
    title: 물건의 위치
    gloss: 유수프가 방에 탁자가 있다고 말해요.
    note: عندي는 '나에게 있다', 즉 소유를 나타내요.
    example_gloss: 유수프가 말했어요. "네, 방에 탁자가 있어요."
