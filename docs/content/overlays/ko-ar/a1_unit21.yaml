teaching:
  ar.a1.unit21.lesson01.teach.clothes:
    title: 옷
    gloss: 옷
    note: ملابس (malābis)는 '옷'을 뜻하는 복수 명사예요.
    example_gloss: 옷을 원해요.
  ar.a1.unit21.lesson01.teach.shirt:
    title: 셔츠
    gloss: 셔츠
    note: قميص (qamīṣ)는 '셔츠'라는 뜻이에요. أريد 뒤에서는 목적어 어미 -an이 붙어 قميصا (qamīṣan)가 돼요.
    example_gloss: 셔츠를 원해요.
  ar.a1.unit21.lesson01.teach.blue:
    title: 파란색
    gloss: 파란색
    note: 'أزرق (azraq)는 قميص에 맞춘 남성형이에요. 여성 명사와 쓰면 زرقاء (zarqāʾ)가 돼요. أريد 뒤에서도 أزرق에는 알리프를 더 붙이지 않아요: قميصا أزرق.'
    example_gloss: 파란 셔츠를 원해요.
  ar.a1.unit21.lesson01.teach.blue_shirt:
    title: 파란 셔츠
    gloss: 파란 셔츠
    note: '아랍어에서는 색깔이 물건 뒤에 와요: قميصا أزرق (qamīṣan azraq).'
    example_gloss: 파란 셔츠를 원해요.
  ar.a1.unit21.lesson02.teach.size:
    title: 사이즈
    gloss: 사이즈
    note: مقاس (maqās)는 '사이즈'라는 뜻이에요. ما المقاس؟ (mā l-maqās)는 사이즈를 물을 때 써요.
    example_gloss: 무슨 사이즈예요?
  ar.a1.unit21.lesson02.teach.medium:
    title: 중간 사이즈
    gloss: 중간 사이즈
    note: 'متوسط (mutawassiṭ)는 ''중간''이라는 뜻이에요. بـ (bi-, ~로/~의)를 쓰면 물건에 붙일 수 있어요: قميصا بمقاس متوسط (qamīṣan bi-maqāsin mutawassiṭ), 중간 사이즈 셔츠.'
    example_gloss: 중간 사이즈 셔츠를 원해요.
  ar.a1.unit21.lesson02.teach.price:
    title: 10디르함
    gloss: 10디르함
    note: بعشرة (bi-ʿashara)는 '10(디르함)에'라는 뜻이에요. 쇼핑 단원에서처럼 بـ 접두사가 가격을 나타내요.
    example_gloss: 셔츠는 10디르함이에요.
  ar.a1.unit21.lesson02.teach.line01:
    title: 물건 요청하기
    gloss: 레일라가 파란 셔츠를 달라고 해요.
    note: من فضلك을 붙이면 공손한 요청이 돼요.
    example_gloss: 레일라가 말했어요. 파란 셔츠를 원해요, 부탁드려요.
  ar.a1.unit21.lesson02.teach.line02:
    title: 사이즈 묻기
    gloss: 판매원이 사이즈를 물어요.
    note: '판매원이 사이즈를 물어요: ما المقاس؟'
    example_gloss: 판매원이 말했어요. 사이즈가 어떻게 되세요?
  ar.a1.unit21.lesson02.teach.line03:
    title: 사이즈 말하기
    gloss: 레일라가 중간 사이즈라고 말해요.
    note: 사이즈를 묻는 질문에 바로 답하는 말이에요.
    example_gloss: 레일라가 말했어요. 중간 사이즈요.
  ar.a1.unit21.lesson02.teach.line04:
    title: 물건과 가격 건네기
    gloss: 판매원이 셔츠를 건네며 가격을 말해요.
    note: تفضلي (tafaḍḍalī)는 여성에게 무언가를 건넬 때 하는 말이에요. 남성에게는 تفضل (tafaḍḍal)이라고 해요.
    example_gloss: 판매원이 말했어요. 여기 있어요. 셔츠는 10디르함이에요.
