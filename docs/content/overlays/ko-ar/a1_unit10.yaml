teaching:
  ar.a1.unit10.lesson01.teach.right:
    title: 오른쪽
    gloss: 오른쪽 (방향)
    note: يمين (yamīn)은 오른쪽을 뜻하고, اليمين (al-yamīn)은 '그 오른쪽'이에요.
    example_gloss: 오른쪽으로.
  ar.a1.unit10.lesson01.teach.left:
    title: 왼쪽
    gloss: 왼쪽 (방향)
    note: يسار (yasār)는 왼쪽을 뜻하고, اليسار (al-yasār)는 '그 왼쪽'이에요.
    example_gloss: 왼쪽으로.
  ar.a1.unit10.lesson01.teach.forward:
    title: 직진
    gloss: 곧장, 똑바로
    note: إلى الأمام (ilā l-amām)은 글자 그대로는 '앞쪽으로'라는 뜻이고, '앞으로 쭉'이나 '직진'을 말할 때 흔히 써요.
    example_gloss: 도서관은 앞으로 쭉 가면 있어요.
  ar.a1.unit10.lesson01.teach.to_right:
    title: 오른쪽으로
    gloss: 오른쪽으로
    note: إلى (ilā)는 어떤 방향이나 장소를 향한 이동을 나타내요.
    example_gloss: 시장은 오른쪽에 있어요.
  ar.a1.unit10.lesson02.teach.walk:
    title: 걷다
    gloss: 걸으세요
    note: امش (imshi)는 남성에게 하는 명령형 '걸으세요!'이고, 여성에게는 امشي (imshī)라고 해요. 걸어서 길을 안내할 때 흔히 쓰는 동사예요.
    example_gloss: 앞으로 쭉 가세요.
  ar.a1.unit10.lesson02.teach.then:
    title: 그다음에
    gloss: 그때 / 그러고 나서
    note: ثم (thumma)는 길 안내의 두 단계를 순서대로 이어 줘요.
    example_gloss: 앞으로 쭉 가다가 오른쪽으로 가세요.
  ar.a1.unit10.lesson02.teach.route:
    title: 길 안내 두 단계
    gloss: 앞으로 쭉 가다가 오른쪽으로 가세요
    note: 첫 번째 단계 + ثم + 두 번째 단계 순서예요. ثم 뒤에서는 동사를 반복하지 않아요.
    example_gloss: '레일라가 말했어요: 앞으로 쭉 가다가 오른쪽으로 가세요.'
  ar.a1.unit10.lesson02.teach.line01:
    title: 도서관 위치 묻기
    gloss: 유수프가 도서관이 어디인지 물어요.
    note: أين المكتبة؟는 장소 단원에서 이미 나왔어요.
    example_gloss: '유수프가 말했어요: 도서관이 어디예요?'
  ar.a1.unit10.lesson02.teach.line02:
    title: 길 안내하기
    gloss: 레일라가 기본적인 두 단계 길 안내를 해요.
    note: 레일라는 남성에게 말하기 때문에 امش라고 해요. 여성에게는 امشي라고 해요.
    example_gloss: '레일라가 말했어요: 앞으로 쭉 가다가 오른쪽으로 가세요.'
  ar.a1.unit10.lesson02.teach.line03:
    title: 고마움 표현하기
    gloss: 유수프가 고맙다고 말해요.
    note: شكرا는 도움을 주고받은 대화를 공손하게 마무리해 줘요.
    example_gloss: '유수프가 말했어요: 고마워요.'
  ar.a1.unit10.lesson02.teach.line04:
    title: 장소 확인하기
    gloss: 레일라가 도서관은 시장 근처에 있다고 말해요.
    note: 장소 단원에서 배운 قرب를 다시 써요. 도서관은 시장 근처에 있어요.
    example_gloss: '레일라가 말했어요: 도서관은 시장 근처에 있어요.'
