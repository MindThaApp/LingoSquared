teaching:
  ar.a1.unit18.lesson01.teach.work:
    title: 직업
    gloss: 일
    note: عمل(ʿamal)은 '일'이라는 뜻이에요. ما عملك؟는 상대의 직업을 묻는 말이에요. 어미 ـك는 '당신의'라는 뜻으로, 남성에게는 ʿamaluka, 여성에게는 ʿamaluki라고 읽지만 표기는 같아요.
    example_gloss: 무슨 일을 하세요?
  ar.a1.unit18.lesson01.teach.engineer:
    title: 엔지니어
    gloss: 엔지니어
    note: مهندس(muhandis)는 남성형으로 유수프에게 쓰였어요. 여성은 أنا مهندسة(anā muhandisa)라고 말해요.
    example_gloss: 저는 엔지니어예요.
  ar.a1.unit18.lesson01.teach.office:
    title: 사무실
    gloss: 사무실
    note: مكتب(maktab)은 '사무실'이에요. في مكتب은 '사무실에서'라는 뜻이에요.
    example_gloss: 저는 사무실에서 일해요.
  ar.a1.unit18.lesson01.teach.workplace_sentence:
    title: 저는 사무실에서 일해요
    gloss: 저는 사무실에서 일해요
    note: أعمل(aʿmal)은 '저는 일해요'라는 뜻이에요. 어근이 عمل(일)과 같고, 맨 앞의 أ가 '저는'을 나타내요.
    example_gloss: 유수프가 말했어요. 저는 사무실에서 일해요.
  ar.a1.unit18.lesson02.teach.write:
    title: 저는 써요
    gloss: 저는 써요
    note: أكتب(aktub)은 '저는 써요'라는 뜻이에요.
    example_gloss: 저는 직장에서 글을 써요.
  ar.a1.unit18.lesson02.teach.read:
    title: 저는 읽어요
    gloss: 저는 읽어요
    note: أقرأ(aqraʾ)는 '저는 읽어요'라는 뜻이에요.
    example_gloss: 저는 직장에서 읽어요.
  ar.a1.unit18.lesson02.teach.at_work:
    title: 직장에서
    gloss: 직장에서
    note: العمل(al-ʿamal)은 '그 일, 직장'이에요. في العمل은 '직장에서'라는 뜻이에요.
    example_gloss: 저는 직장에서 글을 쓰고 읽어요.
  ar.a1.unit18.lesson02.teach.line01:
    title: 직업 묻기
    gloss: 레일라가 유수프에게 무슨 일을 하는지 물어요.
    note: يا يوسف는 유수프의 이름을 부르는 말이에요.
    example_gloss: 레일라가 말했어요. 유수프, 무슨 일을 하세요?
  ar.a1.unit18.lesson02.teach.line02:
    title: 직업 말하기
    gloss: 유수프가 엔지니어라고 말해요.
    note: '''~이다''에 해당하는 별도의 단어가 필요 없어요.'
    example_gloss: 유수프가 말했어요. 저는 엔지니어예요.
  ar.a1.unit18.lesson02.teach.line03:
    title: 일하는 곳 말하기
    gloss: 유수프가 사무실에서 일한다고 말해요.
    note: أعمل في 뒤에 일하는 장소가 와요.
    example_gloss: 유수프가 말했어요. 저는 사무실에서 일해요.
  ar.a1.unit18.lesson02.teach.line04:
    title: 하는 일 묻기
    gloss: 레일라가 유수프에게 매일 무엇을 하는지 물어요.
    note: 일과를 묻는 질문을 다시 쓴 거예요. تفعل은 남성에게 하는 말이고, 여성에게는 ماذا تفعلين كل يوم؟라고 해요.
    example_gloss: 레일라가 말했어요. 매일 무엇을 하세요?
  ar.a1.unit18.lesson02.teach.line05:
    title: 하는 일 말하기
    gloss: 유수프가 직장에서 글을 쓰고 읽는다고 말해요.
    note: 'و(wa, 그리고)가 두 가지 활동을 이어 주고, 다음 단어에 붙여 써요: وأقرأ.'
    example_gloss: 유수프가 말했어요. 저는 직장에서 글을 쓰고 읽어요.
