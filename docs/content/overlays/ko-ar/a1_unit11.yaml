teaching:
  ar.a1.unit11.lesson01.teach.every_day:
    title: 매일
    gloss: 매일
    note: كل يوم (kull yawm)은 보통 동사 뒤에 오지만(أدرس كل يوم) 문장 맨 앞에 올 수도 있어요(كل يوم أدرس).
    example_gloss: 저는 매일 공부해요.
  ar.a1.unit11.lesson01.teach.wake:
    title: 일어나요
    gloss: 저는 일어나요
    note: أستيقظ (astayqiẓ)는 '저는 일어나요'라는 뜻이에요. 현재형 동사 맨 앞의 أ는 '나(1인칭)'를 나타내요. السابعة (as-sābiʿa)는 시각을 말할 때 '7(시)'이에요.
    example_gloss: 저는 일곱 시에 잠에서 깨요.
  ar.a1.unit11.lesson01.teach.study:
    title: 저는 공부해요
    gloss: 저는 공부해요
    note: أدرس (adrus)는 '저는 공부해요'라는 뜻이고, 어근이 درس(수업)와 같아요. التاسعة (at-tāsiʿa)는 시각을 말할 때 '9(시)'예요.
    example_gloss: 저는 9시에 공부해요.
  ar.a1.unit11.lesson01.teach.sleep:
    title: 저는 자요
    gloss: 저는 자요 / 저는 잠자리에 들어요
    note: أنام (anām)은 '저는 자요'라는 뜻이고, 시각과 함께 쓰면 '잠자리에 들어요'라는 뜻이 돼요. العاشرة (al-ʿāshira)는 시각을 말할 때 '10(시)'이에요.
    example_gloss: 저는 10시에 자요.
  ar.a1.unit11.lesson02.teach.what_do:
    title: 매일 뭐 해요?
    gloss: 매일 뭐 해요?
    note: ماذا (mādhā)는 '무엇'을 묻고, تفعل (tafʿal)은 남성에게 하는 '당신이 해요'예요. 여성에게는 تفعلين (tafʿalīn)이라고 해요.
    example_gloss: '레일라가 말했어요: 매일 뭐 해요?'
  ar.a1.unit11.lesson02.teach.routine_sequence:
    title: 일과를 말하는 문장 세 개
    gloss: 저는 7시에 일어나요. 9시에 공부해요. 10시에 자요.
    note: 각 문장은 동사 + في الساعة + 시각으로 이루어져 있어요. 세 문장이 모이면 하루가 완성돼요.
    example_gloss: 저는 매일 7시에 일어나요. 9시에 공부해요. 10시에 자요.
  ar.a1.unit11.lesson02.teach.line01:
    title: 일과 묻기
    gloss: 레일라가 유수프에게 매일 뭐 하는지 물어요.
    note: 레일라는 남성에게 묻기 때문에 تفعل이라고 해요. 여성에게는 ماذا تفعلين كل يوم؟라고 해요.
    example_gloss: '레일라가 말했어요: 매일 뭐 해요?'
  ar.a1.unit11.lesson02.teach.line02:
    title: 기상 시간
    gloss: 유수프가 7시에 일어난다고 말해요.
    note: 시각 앞에는 في الساعة를 써요.
    example_gloss: '유수프가 말했어요: 저는 7시에 일어나요.'
  ar.a1.unit11.lesson02.teach.line03:
    title: 공부 시간
    gloss: 유수프가 9시에 공부한다고 말해요.
    note: أدرس에도 같은 시각 표현 패턴을 써요.
    example_gloss: '유수프가 말했어요: 저는 9시에 공부해요.'
  ar.a1.unit11.lesson02.teach.line04:
    title: 취침 시간
    gloss: 유수프가 10시에 잠자리에 든다고 말해요.
    note: 하루의 마지막 활동에도 أنام과 함께 같은 시각 표현 패턴을 써요.
    example_gloss: '유수프가 말했어요: 저는 10시에 자요.'
