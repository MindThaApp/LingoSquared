teaching:
  ar.a1.unit15.lesson01.teach.than:
    title: ~보다
    gloss: ~보다
    note: من (min)은 '~에서'라는 뜻의 من(أنا من لبنان)과 같은 단어예요. 비교를 나타내는 말 뒤에서는 '~보다'라는 뜻이 돼요.
    example_gloss: 시장이 카페보다 더 커요.
  ar.a1.unit15.lesson01.teach.bigger:
    title: 더 큰
    gloss: 더 큰
    note: أكبر (akbar)는 كبير (kabīr, 큰)에서 나왔어요. أكبر, أصغر, أقرب, أرخص 같은 비교 표현은 모두 أ로 시작하고, 남성 명사에도 여성 명사에도 같은 형태를 써요.
    example_gloss: 시장이 카페보다 더 커요.
  ar.a1.unit15.lesson01.teach.smaller:
    title: 더 작은
    gloss: 더 작은
    note: '''더 작은''이라는 뜻의 أصغر (aṣghar)는 أكبر와 같은 أ 형태예요.'
    example_gloss: 카페가 시장보다 더 작아요.
  ar.a1.unit15.lesson01.teach.nearer:
    title: 더 가까운
    gloss: 더 가까운
    note: أقرب (aqrab)는 거리를 비교해서 '더 가까운'이라는 뜻이에요.
    example_gloss: 카페가 시장보다 더 가까워요.
  ar.a1.unit15.lesson01.teach.bigger_sentence:
    title: 시장이 더 커요
    gloss: 시장이 카페보다 더 커요
    note: 아랍어는 이런 비교 문장에서 '~이다'에 해당하는 별도의 단어가 필요 없어요.
    example_gloss: 유수프가 말했어요. "시장이 카페보다 더 커요."
  ar.a1.unit15.lesson02.teach.nearer:
    title: 더 가까운
    gloss: 더 가까운
    note: أقرب (aqrab)는 거리를 비교해서 '더 가까운'이라는 뜻이에요.
    example_gloss: 카페가 시장보다 더 가까워요.
  ar.a1.unit15.lesson02.teach.cheaper:
    title: 더 싼
    gloss: 더 저렴한
    note: أرخص (arkhaṣ)는 가격을 비교해서 '더 싼'이라는 뜻이에요.
    example_gloss: 물이 커피보다 더 싸요.
  ar.a1.unit15.lesson02.teach.nearer_sentence:
    title: 카페가 더 가까워요
    gloss: 카페가 시장보다 더 가까워요
    note: 두 번째 대상 앞에는 꼭 من을 써요.
    example_gloss: 유수프가 말했어요. "카페가 시장보다 더 가까워요."
  ar.a1.unit15.lesson02.teach.line01:
    title: 선호 묻기
    gloss: 레일라가 유수프에게 무엇을 더 좋아하는지 물어요.
    note: 레일라는 남자에게 묻기 때문에 تفضل (tufaḍḍil)이라고 말해요. 여자에게 물을 때는 ماذا تفضلين؟라고 해요.
    example_gloss: 레일라가 말했어요. "뭐가 더 좋아요?"
  ar.a1.unit15.lesson02.teach.line02:
    title: 카페가 더 좋아요
    gloss: 유수프가 카페를 더 좋아한다고 말해요.
    note: أفضل 뒤에 장소를 써서 더 좋아하는 선택지를 말할 수 있어요.
    example_gloss: 유수프가 말했어요. "저는 카페가 더 좋아요."
  ar.a1.unit15.lesson02.teach.line03:
    title: 거리 비교하기
    gloss: 유수프가 카페가 시장보다 더 가깝다고 말해요.
    note: أقرب من으로 이유를 말해요.
    example_gloss: 유수프가 말했어요. "카페가 시장보다 더 가까워요."
  ar.a1.unit15.lesson02.teach.line04:
    title: 크기 비교하기
    gloss: 누르가 시장이 카페보다 더 크다고 덧붙여요.
    note: والسوق (was-sūq)는 و('그리고')가 السوق에 붙은 말로, '그리고 시장'이라는 뜻이에요.
    example_gloss: 누르가 말했어요. "그리고 시장은 카페보다 더 커요."
