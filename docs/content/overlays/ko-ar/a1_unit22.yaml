    note: 이 문장은 기분과 그 이유를 함께 말해요.
    example_gloss: '유수프가 말했어요: 날씨가 화창해서 행복해요.'
  ar.a1.unit22.lesson02.teach.line03:
    title: 또 다른 기분
    gloss: 레일라가 일이 있어서 피곤하다고 말해요.
    note: متعبة는 여성인 레일라에 맞춘 형태예요.
    example_gloss: '레일라가 말했어요: 일이 있어서 피곤해요.'
  ar.a1.unit22.lesson02.teach.line04:
    title: 괜찮은지 확인하기
    gloss: 유수프가 레일라에게 괜찮은지 물어봐요.
    note: هل (hal)은 '네/아니요'로 답하는 질문을 시작해요. 유수프가 레일라에게 묻고 있으므로 أنت는 anti(남성에게는 anta)로 읽어요.
    example_gloss: '유수프가 말했어요: 괜찮아요?'
  ar.a1.unit22.lesson02.teach.line05:
    title: '''네''라고 말하기'
    gloss: 레일라가 '네'라고 답하고 고맙다고 말해요.
    note: نعم은 '네'라는 대답이에요.
    example_gloss: '레일라가 말했어요: 네, 고마워요.'
