teaching:
  ar.a1.unit27.lesson01.teach.alhywan_hywan_alyf:
    title: 동물, 반려동물
    gloss: 동물 / 반려동물
    note: حيوان (ḥayawān)은 동물, حيوان أليف (ḥayawān alīf)는 반려동물이라는 뜻이에요. أليف (alīf)는 '길든'이라는 뜻의 형용사로, 명사 뒤에 와요.
    example_gloss:
    - 개는 동물이에요.
    - 개는 반려동물이기도 해요.
  ar.a1.unit27.lesson01.teach.alklb_alqta:
    title: 개와 고양이
    gloss: 개 / 고양이
    example_gloss:
    - 레일라에게는 개가 있어요.
    - 카림에게는 고양이가 있어요.
  ar.a1.unit27.lesson01.teach.alsmka_altair:
    title: 물고기와 새
    gloss: 물고기 / 새
    example_gloss:
    - 할아버지에게는 물고기가 있어요.
    - 누르에게는 새가 있어요.
  ar.a1.unit27.lesson01.teach.hl_ldyk_hywan:
    title: 반려동물이 있어요?
    gloss: 반려동물이 있어요?
    note: هل لديك (hal ladayka)는 '당신은 ~이 있나요?'라고 묻는 말이에요. 여자에게는 글씨는 같지만 마지막 모음이 i가 되어 ladayki라고 읽어요. هل (hal)은 예/아니요 질문을 시작해요.
  ar.a1.unit27.lesson01.teach.nam_ldy_klb:
    title: 네, 개가 있어요
    gloss: 네, 저는 개가 있어요.
    note: 이 단원의 새 어휘를 사용한 간단한 긍정 대답이에요.
  ar.a1.unit27.lesson01.teach.la_lys_ldy:
    title: 아니요, 반려동물이 없어요
    gloss: 아니요, 저는 반려동물이 없어요.
    note: ليس لدي (laysa ladayya)는 '나는 ~이 없어요'라는 뜻이에요. ليس (laysa)는 부정하고, لدي (ladayya)는 '나에게 있다'라는 뜻이에요.
  ar.a1.unit27.lesson01.teach.nnfy_almlkya_babara:
    title: '없다고 말하기: ليس لدي'
    gloss: 무언가가 없다고 말할 때는 ليس لدي (laysa ladayya)를 써요. ليس لدي وقت (나는 시간이 없어요), ليس لدي حيوان أليف (나는 반려동물이 없어요).
    note: ليس لدي는 어떤 명사와도 쓰이며 성에 따라 변하지 않아요. '그'와 '그녀'는 ليس لديه (laysa ladayhi), ليس لديها (laysa ladayhā)라고 해요.
  ar.a1.unit27.lesson02.teach.akhdh_alhywan_fy:
    title: (동물을) 산책시키다
    gloss: (동물을) 산책시키다
    note: أخذ الحيوان في نزهة (akhdh al-ḥayawān fī nuzha)은 직역하면 '동물을 산책에 데리고 가기'예요. 동사는 '가져가다, 데려가다'라는 뜻의 أخذ예요.
    example_gloss: 저는 매일 개를 산책시켜요.
  ar.a1.unit27.lesson02.teach.ytghyr_alfal_ma:
    title: 동사는 인칭에 따라 바뀌어요
    gloss: 동사는 주어에 따라 변해요. آخذ الكلب في نزهة (ākhudh al-kalb fī nuzha)은 '나는 개를 산책시켜요', كريم يأخذ كلبه في نزهة (karīm yākhudh kalbahu fī nuzha)는 '카림은 자기 개를 산책시켜요'예요.
    note: 맨 앞의 أ (a-)는 '나'를, ي (ya-)는 '그'를 나타내요. نزهة (nuzha)는 산책이나 짧은 나들이를 뜻해요.
  ar.a1.unit27.lesson02.teach.itaam_alhywan:
    title: 먹이를 주다
    gloss: 먹이를 주다
    example_gloss: 저는 매일 고양이에게 먹이를 줘요.
  ar.a1.unit27.lesson02.teach.allab_ma_alhywan:
    title: ~와 놀다
    gloss: ~와 놀다
    example_gloss: 카림은 자기 고양이와 놀아 줘요.
  ar.a1.unit27.lesson02.teach.akhdh_alklb_fy:
    title: 저는 매일 개를 산책시켜요
    gloss: 저는 매일 개를 산책시켜요.
    note: كل يوم (kull yawm)은 '매일'이라는 뜻이에요. كل 뒤에는 ال이 없는 단수 명사가 와요.
  ar.a1.unit27.lesson02.teach.atam_alqta_kl:
    title: 저는 매일 고양이에게 먹이를 줘요
    gloss: 저는 매일 고양이에게 먹이를 줘요.
    note: أطعم (uṭʿim)은 '나는 먹이를 줘요'라는 뜻이에요. القطة (al-qiṭṭa)는 여성 명사이고, ال은 명사에 붙여 써요.
  ar.a1.unit27.lesson03.teach.jma_klb_hw:
    title: '복수형: كلب → كلاب'
    gloss: 불규칙 복수형이 많으니 명사와 함께 외우세요. كلب (kalb)는 كلاب (kilāb), قطة (qiṭṭa)는 قطط (qiṭaṭ), طائر (ṭāʾir)는 طيور (ṭuyūr)가 돼요.
    note: 아랍어 복수형은 대부분 불규칙(broken) 복수형이라서 각 복수형을 명사와 함께 익혀야 해요. 동물의 복수형에는 여성 단수 형용사가 와요.
  ar.a1.unit27.lesson03.teach.klab_qtt:
    title: 개와 고양이
    gloss: 개들 / 고양이들
    example_gloss:
    - 유수프는 개를 좋아해요.
    - 사라는 고양이를 좋아해요.
  ar.a1.unit27.lesson03.teach.asmak_tywr:
    title: 물고기와 새 (복수)
    gloss: 물고기들 / 새들
    example_gloss:
    - 저는 물고기를 아주 좋아해요.
    - 할아버지는 새를 아주 좋아하세요.
  ar.a1.unit27.lesson03.teach.ahb_alhywanat:
    title: 저는 동물을 아주 좋아해요
    gloss: 저는 동물을 정말 좋아해요.
    note: أحب الحيوانات (uḥibb al-ḥayawānāt)은 '나는 동물을 좋아해요'라는 뜻이에요. 복수형은 ات로 끝나고 관사 ال이 붙어요.
  ar.a1.unit27.lesson03.teach.sara_thb_alqtt:
    title: 사라는 고양이를 좋아하지만 반려동물은 없어요
    gloss: 사라는 고양이를 좋아하지만 반려동물은 없어요.
    note: 이 단원의 읽기 글에 나오는 대비를 미리 보여 주는 문장이에요.
  ar.a1.unit27.lesson04.teach.ywsf_hl_ldyk:
    title: 유수프가 반려동물에 대해 물어요
    gloss: '유수프: 레일라, 반려동물 있어요?'
  ar.a1.unit27.lesson04.teach.lyla_nam_ldy:
    title: 레일라에게는 개가 있어요
    gloss: '레일라: 네, 개가 있어요.'
  ar.a1.unit27.lesson04.teach.ywsf_kyf_ybdw:
    title: 유수프가 어떻게 생겼는지 물어요
    gloss: '유수프: 어떻게 생겼어요?'
    note: كيف يبدو؟ (kayfa yabdū?)는 '그는 어떻게 생겼어요?'라는 뜻이에요. 개(كلب)는 남성 명사라서 يبدو도 남성형이에요.
  ar.a1.unit27.lesson04.teach.lyla_lh_shar:
    title: 레일라가 자기 개를 설명해요
    gloss: '레일라: 갈색 털에 작아요.'
    note: 외모 단원에서 배운 머리 색과 크기 표현을 이번에는 사람의 머리카락이 아니라 동물의 털을 설명하는 데 써요.
  ar.a1.unit27.lesson04.teach.nqwl_hw_llklb:
    title: 동물을 가리키는 대명사
    gloss: 모든 동물 단어는 남성이거나 여성이에요. 개는 هو (huwa, 그), 고양이는 هي (hiya, 그녀)예요. أطعمه (uṭʿimuhu)의 어미 ه는 '그를' 또는 '그것을'이라는 뜻이에요.
    note: كلب처럼 남성인 동물 단어에는 남성 대명사와 형용사가, قطة처럼 여성인 단어에는 여성 대명사와 형용사가 와요.
  ar.a1.unit27.lesson04.teach.ywsf_hl_takhdhynh:
    title: 유수프가 산책에 대해 물어요
    gloss: '유수프: 매일 산책시켜 줘요?'
  ar.a1.unit27.lesson04.teach.lyla_nam_akhdhh:
    title: 레일라가 일과를 설명해요
    gloss: '레일라: 네, 매일 산책시키고 먹이도 줘요.'
  ar.a1.unit27.lesson05.teach.ywsf_wsara_yhban:
    title: 유수프, 사라, 카림이 말하는 동물
    gloss: 유수프와 사라는 둘 다 동물을 좋아하지만, 둘 중 누구도 반려동물이 없어요. 유수프는 개를 좋아하고 사라는 고양이를 좋아해요. 카림은 반려동물이 있는데, 바로 고양이예요. 카림은 고양이와 자주 놀아 주고 매일 먹이를 줘요. 당신은 반려동물이 있나요?
    note: 동물을 좋아하는 것과 실제로 키우는 것의 차이를 보여 줘요. 이 단원이 전하려는 핵심이에요.
    glosses:
      يحبان: 사랑해요
      كلاهما: 둘 다
      الحيوانات: 동물들
      منهما: 그들 중 (둘 중 누구도)
      أليف: '반려동물 (직역: 길든)'
      الكلاب: 개들
      القطط: 고양이들
      قطة: 고양이
      يلعب: 놀아요
      ويعطي: 줘요
      كل: 매
      طعاما: 먹이
  ar.a1.unit27.lesson05.teach.krym_ylab_ma:
    title: 카림은 자기 고양이와 자주 놀아 줘요
    gloss: 카림은 자기 고양이와 자주 놀아 줘요.
    note: قطته (qiṭṭatuhu)는 '그의 고양이'라는 뜻이에요. 어미 ه (hu)는 '그의'를 뜻하고, قطة의 ة는 그 앞에서 ت로 바뀌어요.
  ar.a1.unit27.lesson05.teach.ahb_alklab_lys:
    title: 저는 개를 좋아해요. 반려동물은 없어요.
    gloss: 저는 개를 좋아해요. 반려동물은 없어요.
    note: 이 단원의 쓰기 과제에 그대로 쓸 수 있는 두 문장짜리 모범 답안이에요.
  ar.a1.unit27.lesson06.teach.lyla_ya_nwr:
    title: 레일라가 누르에게 물어봐요
    gloss: '레일라: 누르, 당신도 반려동물이 있어요?'
  ar.a1.unit27.lesson06.teach.nwr_nam_ldy:
    title: 누르에게는 피코라는 새가 있어요
    gloss: '누르: 네, 새가 있어요. 이름은 피코예요.'
    note: اسمه (ismuhu)는 '그의 이름'이라는 뜻이에요. 끝의 ه는 '그의'를 뜻해요. بيكو (bīkū)는 새의 이름이에요.
  ar.a1.unit27.lesson06.teach.ywsf_ma_ajml:
    title: 유수프의 반응
    gloss: '유수프: 정말 멋지네요! 매일 그 아이와 무엇을 해요?'
  ar.a1.unit27.lesson06.teach.nwr_atamh_kl:
    title: 누르는 매일 먹이를 줘요
    gloss: '누르: 매일 먹이를 줘요.'
  ar.a1.unit27.lesson06.teach.ywsf_wana_ayda:
    title: 유수프도 새를 좋아해요
    gloss: '유수프: 저도 새를 좋아해요.'
  ar.a1.unit27.lesson06.teach.lyla_ma_ajml:
    title: 레일라가 대화를 마무리해요
    gloss: '레일라: 우리 셋 모두 동물을 좋아하다니 정말 좋네요!'
    note: 이 단원에 나온 세 사람의 동물 이야기를 하나로 마무리해요.
