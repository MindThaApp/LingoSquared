teaching:
  ar.a1.unit06.lesson01.teach.family:
    title: 가족
    gloss: 가족
    note: عائلة(ʿāʾila)는 '가족'을 뜻하는 일반적인 단어예요. 예문의 هذه는 هذا(이것)의 여성형인데, عائلة가 여성 명사라서 써요.
    example_gloss: 이 사람들은 한 가족이에요.
  ar.a1.unit06.lesson01.teach.father:
    title: 아버지
    gloss: 아버지
    note: أب(ab)는 '아버지'라는 뜻이에요.
    example_gloss: 저는 아버지가 계세요.
  ar.a1.unit06.lesson01.teach.mother:
    title: 어머니
    gloss: 어머니
    note: أم(umm)은 '어머니'라는 뜻이에요.
    example_gloss: 저는 어머니가 계세요.
  ar.a1.unit06.lesson01.teach.brother:
    title: 형, 오빠, 남동생
    gloss: 남자 형제
    note: أخ(akh)는 '남자 형제'라는 뜻이에요.
    example_gloss: 저는 남자 형제가 한 명 있어요.
  ar.a1.unit06.lesson01.teach.sister:
    title: 누나, 언니, 여동생
    gloss: 여자 형제
    note: أخت(ukht)는 '여자 형제'라는 뜻이에요.
    example_gloss: 저는 남자 형제와 여자 형제가 있어요.
  ar.a1.unit06.lesson01.teach.i_have:
    title: 저는 ~이/가 있어요
    gloss: 저는 ~이/가 있어요
    note: عندي(ʿindī, 직역하면 '내 곁에')는 무언가를 가지고 있다고 말하는 A1 수준의 간단한 표현이에요. لدي(ladayya)는 더 격식 있는 표현이에요.
    example_gloss: 저는 여자 형제가 한 명 있어요.
  ar.a1.unit06.lesson02.teach.in_family:
    title: 당신의 가족 중에
    gloss: 당신의 가족 중에
    note: 여기서 من은 '누구'를 뜻하는 man이에요. من أين أنت؟의 '~에서'(min)와는 달라요. 두 단어는 철자가 같아요. عائلتك는 '당신의 가족'이라는 뜻으로, 남성에게는 ʿāʾilatuka, 여성에게는 ʿāʾilatuki라고 읽어요.
    example_gloss: 가족 중에 누가 있어요?
  ar.a1.unit06.lesson02.teach.sister_name:
    title: 그녀의 이름은 누르예요
    gloss: 그녀의 이름은 누르예요
    note: اسمها는 '그녀의 이름'이라는 뜻이에요.
    example_gloss: 유수프가 말했어요. "그녀의 이름은 누르예요."
  ar.a1.unit06.lesson02.teach.line01:
    title: 가족에 대해 묻기
    gloss: 레일라가 유수프의 가족 중에 누가 있는지 물어요.
    note: 여기서 من(man)은 '누구'라는 뜻이에요. يا يوسف는 유수프의 이름을 부르는 말이에요.
    example_gloss: 레일라가 말했어요. "유수프, 가족 중에 누가 있어요?"
  ar.a1.unit06.lesson02.teach.line02:
    title: 가족 소개하기
    gloss: 유수프는 아버지, 어머니, 여자 형제가 있다고 말해요.
    note: و는 가족 구성원을 이어 줘요.
    example_gloss: 유수프가 말했어요. "저는 아버지, 어머니, 여자 형제가 있어요."
  ar.a1.unit06.lesson02.teach.line03:
    title: 여자 형제의 이름 묻기
    gloss: 레일라가 유수프의 여자 형제 이름을 물어요.
    note: أختك는 '당신의 여자 형제'라는 뜻으로, 남성에게는 ukhtuka, 여성에게는 ukhtuki라고 읽어요. 여기서는 레일라가 유수프에게 묻고 있으므로 ukhtuka예요.
    example_gloss: 레일라가 말했어요. "여자 형제 이름이 뭐예요?"
  ar.a1.unit06.lesson02.teach.line04:
    title: 이름 알려 주기
    gloss: 유수프는 그녀의 이름이 누르라고 말해요.
    note: '어미 ـها는 ''그녀의''라는 뜻이에요: اسمها(ismuhā), 그녀의 이름.'
    example_gloss: 유수프가 말했어요. "그녀의 이름은 누르예요."
