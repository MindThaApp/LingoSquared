  fr.a1.unit76.lesson04.exercise02.comprehend_le_nouveau_film:
    instruction: Escucha el diálogo y elige qué película quiere ver Nina.
    correct_option: La película nueva.
    distractors:
    - La sesión infantil.
    - Cualquier película le va bien.
    - No lo dice.
    accepted_answers:
    - value: La película nueva.
      status: correct
    feedback: 'Nina dice: *Je voudrais voir le nouveau film, s''il vous plaît.* En francés, *nouveau* va antes del sustantivo y toma la forma masculina para concordar con *film*.'
    prompt_blocks:
