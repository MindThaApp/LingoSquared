  fr.a1.unit76.lesson04.exercise03.comprehend_pour_quelle_heure:
    instruction: Escucha el diálogo y elige qué le pregunta Claire a Nina a continuación.
    correct_option: A qué hora quiere la sesión.
    distractors:
    - Si quiere palomitas.
    - Si quiere un recibo.
    - No pregunta nada.
    accepted_answers:
    - value: A qué hora quiere la sesión.
      status: correct
    feedback: 'Claire dice: *pour quelle heure ?* *Quelle heure* significa «qué hora», y *pour* relaciona la entrada con la hora de la sesión.'
    prompt_blocks:
    - ¿Qué le pregunta Claire a Nina a continuación?
