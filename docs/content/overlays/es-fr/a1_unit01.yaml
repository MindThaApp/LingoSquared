teaching:
  fr.a1.unit01.lesson01.teach.bonjour:
    title: Saludo neutro
    gloss: hola; buenos días
    note: Bonjour sirve con desconocidos, compañeros de trabajo y amigos durante el día. Como el «buenos días» español, lleva implícita la idea de desearle un buen día a la otra persona.
  fr.a1.unit01.lesson01.teach.salut:
    title: Saludo informal
    gloss: hola; adiós
    note: Salut se usa en una relación informal. Puede abrir o cerrar una conversación, pero no es la mejor opción para dirigirse a un adulto que no conoces.
  fr.a1.unit01.lesson01.teach.au_revoir:
    title: Despedida neutra
    gloss: adiós
    note: Au revoir sirve tanto en situaciones formales como informales.
  fr.a1.unit01.lesson01.teach.tu:
    title: Tú (singular informal)
    gloss: tú
    note: Igual que en español, el francés distingue entre un trato informal y uno formal. Tu se dirige a un amigo, un niño o una persona con quien hay una relación claramente informal, y exige sus propias formas verbales.
  fr.a1.unit01.lesson01.teach.vous:
    title: Usted o ustedes / vosotros
    gloss: usted; ustedes
    note: 'Vous es la opción segura para un adulto desconocido y también la forma para cualquier grupo. A diferencia del español, no hay distinción entre «usted» y «ustedes»: vous sirve para ambos, y solo el contexto indica si es una persona o varias.'
  fr.a1.unit01.lesson01.teach.comment_allez_vous:
    title: Pregunta formal sobre cómo estás
    gloss: ¿Cómo está usted?
    note: Allez es la forma de vous del verbo aller. El verbo y el pronombre se invierten y se unen con un guion. Es una pregunta de cortesía convencional, no una pregunta literal sobre adónde va alguien.
  fr.a1.unit01.lesson01.teach.comment_vas_tu:
    title: Pregunta informal sobre cómo estás
    gloss: ¿Cómo está usted?
    note: Vas es la forma de tu del verbo aller. Igual que en español pasamos de «¿cómo está usted?» a «¿cómo estás?», en francés se pasa de allez-vous a vas-tu cuando la relación es informal.
  fr.a1.unit01.lesson01.teach.register_choice:
    title: Combinar saludo y relación
    gloss: Bonjour con vous; salut con tu
    note: Estas combinaciones son pautas útiles, no leyes absolutas. Bonjour también puede usarse con amigos, pero salut junto con vous suele dar señales sociales contradictorias.
  fr.a1.unit01.lesson02.teach.je_mappelle:
    title: Decir tu nombre
    gloss: Me llamo Camille.
    note: Je m’appelle significa literalmente «yo me llamo». A diferencia del español, que suele omitir el sujeto, el francés exige normalmente el pronombre je. La vocal de me desaparece ante appelle y da m’appelle.
  fr.a1.unit01.lesson02.teach.comment_appelez_vous:
    title: Preguntar el nombre con cortesía
    gloss: ¿Cómo se llama usted?
    note: 'Appelez es la forma de vous del verbo appeler. El segundo vous va después del verbo porque la pregunta usa inversión: vous appelez-vous.'
  fr.a1.unit01.lesson02.teach.tu_tappelles:
    title: Preguntar el nombre de manera informal
    gloss: ¿Cómo se llama usted?
    note: T’appelles es la forma de tu con el pronombre reflexivo te abreviado ante vocal. Esta pregunta cotidiana mantiene tu antes del verbo y coloca comment al final.
  fr.a1.unit01.lesson02.teach.moi_cest:
    title: Presentación coloquial
    gloss: Yo soy Noé.
    note: Moi, c’est es una forma hablada e idiomática de presentarse. Es más conversacional que traducir literalmente «yo soy» palabra por palabra.
  fr.a1.unit01.lesson02.teach.enchante:
    title: Concordancia masculina
    gloss: Encantado.
    note: Un hombre escribe normalmente enchanté. Como en español («encantado» / «encantada»), este adjetivo francés cambia según el género de quien habla.
  fr.a1.unit01.lesson02.teach.enchantee:
    title: Concordancia femenina
    gloss: Encantado.
    note: Una mujer escribe normalmente enchantée, con una e final. Enchanté y enchantée suelen pronunciarse igual, así que la diferencia se nota más al escribir que al hablar.
  fr.a1.unit01.lesson02.teach.et_vous:
    title: Devolver una pregunta con cortesía
    gloss: ¿Y usted?
    note: Usa vous para mantener el registro formal o para dirigirte a un grupo.
  fr.a1.unit01.lesson02.teach.et_toi:
    title: Devolver una pregunta de manera informal
    gloss: ¿Y usted?
    note: Toi es la forma tónica asociada a tu. En francés se dice et toi, no et tu.
  fr.a1.unit01.lesson03.teach.elision_jhabite:
    title: Elisión ante vocal
    gloss: vivo
    note: 'Je pierde su vocal ante habite, y el apóstrofo señala esa elisión: j’habite. La h de habiter no impide la elisión.'
  fr.a1.unit01.lesson03.teach.liaison_vous_etes:
    title: Liaison after vous
    gloss: usted es; ustedes son
    note: 'La s final de vous suele ser muda, pero ante el sonido vocálico de êtes se enlaza con sonido de z: vous êtes suena aproximadamente «vu-SET». La liaison pertenece a la frase hablada, no a su ortografía.'
  fr.a1.unit01.lesson03.teach.liaison_un_atelier:
    title: Liaison tras un
    gloss: un taller
    note: La n final de un se enlaza con atelier. Evita hacer una pausa marcada entre las dos palabras.
  fr.a1.unit01.lesson03.teach.final_e_enchante:
    title: Ortografía masculina
    gloss: encantado
    note: Enchanté termina en é cuando habla un hombre. El -an- es una vocal nasal, así que no pronuncies una n separada como lo harías al leer en español.
  fr.a1.unit01.lesson03.teach.final_e_enchantee:
    title: Ortografía femenina
    gloss: encantada
    note: Enchantée añade una e por la concordancia femenina, pero esa e extra normalmente no añade otra sílaba al pronunciar.
  fr.a1.unit01.lesson03.teach.question_liaison:
    title: Leer una pregunta con inversión
    gloss: ¿Cómo está usted?
    note: Mantén allez-vous unido como una sola unidad. La z escrita de allez no se pronuncia aquí como una z adicional; la pronunciación estándar es aproximadamente «a-LÉ vu».
  fr.a1.unit01.lesson04.teach.ca_va:
    title: Pregunta cotidiana sobre cómo estás
    gloss: ¿Qué tal?; ¿estás bien?
    note: Ça lleva cedilla, que hace que la c suene como s ante a. La misma expresión puede ser pregunta o respuesta según la entonación.
  fr.a1.unit01.lesson04.teach.tres_bien:
    title: Respuesta muy positiva
    gloss: Muy bien, gracias.
    note: Très refuerza a bien. Su s final es muda.
  fr.a1.unit01.lesson04.teach.ca_va_bien:
    title: Respuesta positiva
    gloss: Estoy bien.
    note: 'Como en español, en esta respuesta fija no hace falta decir el sujeto: no aparece ningún pronombre que corresponda a «yo».'
  fr.a1.unit01.lesson04.teach.pas_mal:
    title: Respuesta moderadamente positiva
    gloss: No está mal.
    note: Pas mal suele ser algo positivo, como «no está mal» en español.
  fr.a1.unit01.lesson04.teach.fatigue:
    title: Concordancia del adjetivo masculino
    gloss: Estoy un poco cansado.
    note: Suis es la forma de je del verbo être. Un hombre escribe fatigué. Como en español («cansado» / «cansada»), el adjetivo cambia según el género de quien habla.
  fr.a1.unit01.lesson04.teach.fatiguee:
    title: Concordancia del adjetivo femenino
    gloss: Estoy un poco cansado.
    note: Una mujer escribe fatiguée, con una e final. Las formas masculina y femenina suelen pronunciarse igual.
  fr.a1.unit01.lesson04.teach.et_vous:
    title: Devolver la pregunta con cortesía
    gloss: ¿Y usted?
    note: Vous mantiene el registro respetuoso que se usa con un adulto desconocido.
  fr.a1.unit01.lesson04.teach.et_toi:
    title: Devolver la pregunta de manera informal
    gloss: ¿Y usted?
    note: Usa toi después de et cuando hablas de manera informal con un amigo o un igual.
  fr.a1.unit01.lesson05.teach.here_for_workshop:
    title: Confirmar el motivo de alguien
    gloss: ¿Está usted aquí por el taller?
    note: 'Êtes es la forma de vous del verbo être. Como en español, no hace falta ningún auxiliar para preguntar: la entonación ascendente convierte la frase en pregunta.'
  fr.a1.unit01.lesson05.teach.yes_thats_it:
    title: Confirmar una suposición
    gloss: Sí, así es.
    note: C’est ça es una confirmación natural, no un literal «es eso».
  fr.a1.unit01.lesson05.teach.live_neighborhood:
    title: Preguntar dónde vive alguien
    gloss: ¿Vive usted en el barrio?
    note: Habitez es la forma de vous del verbo habiter. Como en español, el francés puede usar el orden de una afirmación con entonación de pregunta.
  fr.a1.unit01.lesson05.teach.i_live:
    title: Decir dónde vives
    gloss: Vivo en Montreuil.
    note: J’habite es la forma de je del verbo habiter con elisión. À indica una ciudad como lugar y no debe confundirse con a, la forma verbal que significa «tiene».
  fr.a1.unit01.lesson05.teach.from_here:
    title: Preguntar por el origen local
    gloss: ¿Es usted de aquí?
    note: D’ici une de y ici mediante elisión. Êtes sigue siendo la forma de vous del verbo être.
  fr.a1.unit01.lesson05.teach.from_lille:
    title: Decir de dónde eres
    gloss: Soy de Lille.
    note: Suis es la forma de je del verbo être. El francés usa de ante una ciudad para indicar el origen, igual que el español.
  fr.a1.unit01.lesson05.teach.workshop_starts:
    title: Empieza la actividad
    gloss: El taller está empezando.
    note: Atelier es masculino, así que su artículo singular es le. Ante vocal, le se convierte en l’. Commence es la forma de tercera persona del singular.
  fr.a1.unit01.lesson05.teach.see_you_shortly:
    title: Short-term farewell
    gloss: hasta luego; nos vemos más tarde hoy
    note: À tout à l’heure implica que habrá otro encuentro más tarde el mismo día, a diferencia de una despedida general sin hora prevista.
  fr.a1.unit01.lesson06.teach.line01:
    title: Abrir el encuentro
    gloss: Inès saluda a Mathieu y comprueba que está allí para el taller de cocina.
    note: Los hablantes empiezan con vous porque son adultos que no se conocen.
  fr.a1.unit01.lesson06.teach.line02:
    title: Abrir el encuentro, respuesta
    gloss: Mathieu confirma y dice su nombre; luego le pregunta el suyo a ella.
    note: Je m’appelle es la forma habitual de decir el nombre.
  fr.a1.unit01.lesson06.teach.line03:
    title: Intercambiar nombres
    gloss: Inès dice su nombre y le dice que encantada de conocerlo.
    note: Enchantée concuerda con Inès (femenino); la -e final se escribe, pero normalmente no se oye.
  fr.a1.unit01.lesson06.teach.line04:
    title: Intercambiar nombres, respuesta
    gloss: Mathieu responde con la misma cortesía y le pregunta si vive cerca.
    note: 'Enchanté concuerda con Mathieu (masculino): es la misma palabra que acaba de usar Inès, sin la -e muda.'
  fr.a1.unit01.lesson06.teach.line05:
    title: Intercambiar datos del barrio
    gloss: Inès confirma y dice su calle; luego le hace la misma pregunta a Mathieu.
    note: J’habite más el nombre de una calle no lleva preposición ante rue.
  fr.a1.unit01.lesson06.teach.line06:
    title: Intercambiar datos del barrio, respuesta
    gloss: Mathieu dice que vive en Saint-Ouen y le pregunta si ella es de aquí.
    note: J’habite à usa à ante el nombre de un lugar, a diferencia de la expresión con calle que acaba de usar Inès.
  fr.a1.unit01.lesson06.teach.line07:
    title: Intercambiar orígenes
    gloss: Inès dice que no es de aquí, que es de Lille, y luego le pregunta a Mathieu.
    note: Je suis de más una ciudad indica de dónde es alguien.
  fr.a1.unit01.lesson06.teach.line08:
    title: Intercambiar orígenes, respuesta
    gloss: Mathieu dice que es de Lyon.
    note: Es el mismo patrón je suis de que acaba de usar Inès.
  fr.a1.unit01.lesson06.teach.line09:
    title: Pausar la conversación
    gloss: Inès se da cuenta de que el taller empieza y dice que lo verá en un rato.
    note: À tout à l’heure encaja porque ambos se quedarán en el mismo evento.
  fr.a1.unit01.lesson06.teach.line10:
    title: Pausar la conversación, respuesta
    gloss: Mathieu repite la misma despedida.
    note: Repetir à tout à l’heure es la manera natural de confirmarlo.
