teaching:
  fr.a1.unit48.lesson01.teach.le_manteau_le:
    title: Abrigo, jersey
    gloss: el abrigo, el jersey
    note: '*Le manteau* y *le pull* son ambos masculinos.'
    example_gloss:
    - Busco un abrigo.
    - Tengo un jersey.
  fr.a1.unit48.lesson01.teach.le_pantalon_les:
    title: Pantalón, zapatos
    gloss: el pantalón, los zapatos
    note: '*Pantalon* va en singular en francés: *un pantalon* para un solo pantalón. *Chaussures* es el plural de *chaussure*; los zapatos suelen mencionarse en plural, como en español.'
    example_gloss:
    - Busco un pantalón.
    - Busco zapatos.
  fr.a1.unit48.lesson01.teach.je_cherche_un:
    title: Decir lo que buscas
    gloss: Busco un abrigo.
    note: '*Chercher* (buscar) lleva complemento directo sin preposición, igual que en español: *je cherche un manteau*.'
  fr.a1.unit48.lesson02.teach.la_taille:
    title: Talla
    gloss: la talla
    note: '*Taille* es femenino: *la taille*.'
    example_gloss: ¿Qué talla usas?
  fr.a1.unit48.lesson02.teach.quelle_taille_faites:
    title: Preguntar por la talla
    gloss: ¿Qué talla usas?
    note: '*Quelle taille ?* usa *quelle* (qué) porque *taille* es femenino y hay pocas respuestas posibles (S, M, L o un número).'
  fr.a1.unit48.lesson02.teach.je_fais_du:
    title: Decir tu talla
    gloss: Soy talla M.
    note: '*Faire du M* significa ser talla M: el francés usa *faire* (hacer) donde en español decimos «ser» o «usar» la talla.'
  fr.a1.unit48.lesson03.teach.noir_bleu:
    title: Negro, azul
    gloss: negro, azul
    note: Los dos adjetivos de color básicos de esta lección.
    example_gloss:
    - Quiero el abrigo en negro.
    - ¿Tiene también este en azul?
  fr.a1.unit48.lesson03.teach.je_veux_le:
    title: Pedir un color
    gloss: Quiero el abrigo en negro.
    note: '*En* + color es la forma habitual de indicar el color de una prenda al pedirla.'
  fr.a1.unit48.lesson03.teach.avez_vous_aussi:
    title: Preguntar por otro color
    gloss: ¿Tiene también este en azul?
    note: '*Aussi* (también) pregunta si hay otro color disponible, con el trato formal de *vous*.'
  fr.a1.unit48.lesson04.teach.est_ce_que:
    title: Preguntar cómo queda
    gloss: ¿Te queda bien este abrigo?
    note: '*Aller* (ir) es el verbo natural para cómo sienta una prenda: *il me va bien*, literalmente «me va bien», igual que en español.'
  fr.a1.unit48.lesson04.teach.il_me_va:
    title: Confirmar que queda bien
    gloss: Me queda bien.
    note: '*Bien* describe cómo queda la prenda.'
  fr.a1.unit48.lesson04.teach.c_est_trop:
    title: Demasiado pequeño
    gloss: Es demasiado pequeño.
    note: '*Trop* (demasiado) va antes del adjetivo para expresar exceso.'
  fr.a1.unit48.lesson04.teach.c_est_trop_2:
    title: Demasiado grande
    gloss: Es demasiado grande.
    note: Mismo patrón *trop* + adjetivo que *trop petit* en la tarjeta anterior.
  fr.a1.unit48.lesson05.teach.quatre_vingt_dix:
    title: Noventa
    gloss: noventa
    note: '*Quatre-vingt-dix* es el número 90 (literalmente «cuatro veintes diez»), usado aquí en el precio del abrigo.'
    example_gloss: El abrigo cuesta noventa euros.
  fr.a1.unit48.lesson05.teach.le_manteau_coute:
    title: Decir un precio
    gloss: El abrigo cuesta noventa euros.
    note: '*Coûte* es la forma de *il* del verbo *coûter* (costar).'
  fr.a1.unit48.lesson05.teach.parka_taille_m:
    title: Lee un ticket de tienda
    gloss: 'Abrigo de invierno: talla M, color negro. Precio: noventa euros. Este abrigo me queda bien y es abrigado.'
    note: Fíjate en la talla, el color, el precio y las dos cualidades que se mencionan del abrigo.
    glosses:
      Parka: abrigo de invierno
      taille: talla
      couleur: color
      noire: negro
      Prix: precio
      quatre-vingt-dix: noventa
      euros: euros
      manteau: abrigo
      va: queda bien
      chaud: abrigado
  fr.a1.unit48.lesson06.teach.camille_ce_manteau:
    title: Camille se fija en el abrigo
    gloss: 'Camille: ¡Qué bonito abrigo! ¿Qué talla usas?'
    note: '*Joli* (bonito) es una reacción positiva general; aquí es masculino para concordar con *manteau*.'
  fr.a1.unit48.lesson06.teach.mathieu_je_fais:
    title: Mathieu pide probárselo
    gloss: 'Mathieu: Soy talla M. ¿Puedo probármelo?'
    note: '*Je peux ... ?* es la forma habitual de pedir permiso; *l''essayer* significa «probárselo», y *l''* representa el abrigo.'
  fr.a1.unit48.lesson06.teach.camille_bien_sur:
    title: Camille pregunta cómo le queda
    gloss: 'Camille: Claro. ¿Te queda bien?'
    note: '*Il* (él, ello) se refiere de nuevo a *le manteau*, un sustantivo masculino.'
  fr.a1.unit48.lesson06.teach.mathieu_oui_il:
    title: Mathieu lo confirma
    gloss: 'Mathieu: Sí, me queda bien y es abrigado.'
    note: 'Coincide exactamente con el ticket leído antes: es el mismo abrigo.'
  fr.a1.unit48.lesson06.teach.camille_super_tu:
    title: Camille pregunta por el color
    gloss: 'Camille: ¡Genial! ¿Lo quieres en negro o en azul?'
    note: '*Tu le veux en ... ou en ... ?* ofrece una elección; *le* representa el abrigo.'
  fr.a1.unit48.lesson06.teach.mathieu_je_le:
    title: Mathieu decide
    gloss: 'Mathieu: Me lo llevo en negro.'
    note: '*Prendre* (tomar, llevarse) es el verbo natural para cerrar la elección de una compra, con el color indicado en el ticket.'
  fr.a1.unit48.lesson06.teach.on_ecrit_prends:
    title: Prends o prend
    gloss: '*Prends* es la forma de yo y de tú del verbo *prendre* (tomar); *prend* es la forma de él y de ella.'
    note: 'El patrón de *prendre*: *je prends, tu prends, il/elle prend*.'
