answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francés A1
  description: Lugares comunes del barrio y cómo pedir y dar indicaciones sencillas (en face de, à côté de, près de, loin de), continuando la búsqueda de una farmacia cerca del taller por parte de Mathieu. Las explicaciones destacan que estas expresiones de lugar terminan todas en de, que se contrae en du/des ante un sustantivo masculino o plural (du café, des arbres), de forma parecida al «del» español.
