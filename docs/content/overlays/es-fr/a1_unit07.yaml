teaching:
  fr.a1.unit07.lesson01.teach.gare:
    title: La estación de tren
    gloss: la estación de tren
    note: '*Gare* es femenino.'
    example_gloss: La estación de tren es grande.
  fr.a1.unit07.lesson01.teach.pharmacie:
    title: La farmacia
    gloss: la farmacia
    note: '*Pharmacie* es femenino.'
    example_gloss: La farmacia abre a las nueve.
  fr.a1.unit07.lesson01.teach.banque:
    title: El banco
    gloss: el banco
    note: '*Banque* es femenino.'
    example_gloss: El banco está cerrado los domingos.
  fr.a1.unit07.lesson01.teach.ecole:
    title: La escuela
    gloss: la escuela
    note: '*École* es femenino; *l''* se elide ante su sonido vocálico.'
    example_gloss: La escuela está al lado del parque.
  fr.a1.unit07.lesson01.teach.cafe:
    title: El café
    gloss: el café
    note: '*Café* es masculino; en otros contextos también significa la bebida «café».'
    example_gloss: El café está abierto todo el día.
  fr.a1.unit07.lesson01.teach.poste:
    title: Correos
    gloss: correos
    note: '*Poste* (femenino) significa aquí «oficina de correos»; *le poste* (masculino, con otro significado) puede ser «el puesto» o «el empleo»: el género cambia el significado.'
    example_gloss: Correos cierra a las seis.
  fr.a1.unit07.lesson01.teach.la_gare_est_grande:
    title: Comparar dos lugares
    gloss: La estación de tren es grande y la farmacia es pequeña.
    note: '*Grande*/*petite* concuerdan aquí con sustantivos femeninos (*la gare*, *la pharmacie*).'
  fr.a1.unit07.lesson02.teach.ou_est_la_gare:
    title: Preguntar dónde está un lugar
    gloss: ¿Dónde está la estación de tren, por favor?
    note: '*Où est... ?* es la forma estándar y general de preguntar dónde está un lugar.'
  fr.a1.unit07.lesson02.teach.en_face_de:
    title: Decir que algo está enfrente
    gloss: El banco está enfrente de la estación de tren.
    note: '*En face de* (enfrente de) termina en *de*, seguido del lugar de referencia: *en face de la banque*. Ante un sustantivo masculino se contrae: *en face du café*.'
  fr.a1.unit07.lesson02.teach.a_cote_de:
    title: Decir que algo está al lado
    gloss: La farmacia está al lado del banco.
    note: '*À côté de* (al lado de) sigue el mismo patrón de enlace con *de* que *en face de*.'
  fr.a1.unit07.lesson02.teach.pres_de:
    title: Decir que algo está cerca
    gloss: La escuela está cerca de aquí.
    note: '*Près de* (cerca de) se contrae en *près d''* ante un sonido vocálico, como en *près d''ici* (cerca de aquí).'
  fr.a1.unit07.lesson02.teach.loin_de:
    title: Decir que algo está lejos
    gloss: Correos está lejos de aquí.
    note: '*Loin de* (lejos de) es lo contrario directo de *près de*.'
  fr.a1.unit07.lesson02.teach.cest_loin:
    title: Preguntar si algo está lejos
    gloss: ¿Está lejos de aquí? — No, no está lejos.
    note: '*C''est loin d''ici ?* es la pregunta natural de seguimiento después de recibir una indicación. Para decir que no, pon *ne... pas* alrededor del verbo: *ce n''est pas loin* (no está lejos).'
  fr.a1.unit07.lesson03.teach.line01:
    title: Pedir indicaciones a un desconocido
    gloss: Mathieu le pregunta con educación a un transeúnte dónde está la farmacia.
    note: '*Excusez-moi* (disculpe) es la fórmula cortés habitual para acercarse a un desconocido, junto con *vous*.'
  fr.a1.unit07.lesson03.teach.line02:
    title: Dar la ubicación
    gloss: Ella dice que está enfrente del banco, al lado del café.
    note: Combina *en face de* y *à côté de* en una sola frase para dar una ubicación precisa. *De* + *le café* se contrae en *du café*.
  fr.a1.unit07.lesson03.teach.line03:
    title: Preguntar si está lejos
    gloss: Mathieu pregunta si está lejos de aquí.
    note: La misma *C'est loin d'ici ?* que aprendiste para preguntar por la distancia.
  fr.a1.unit07.lesson03.teach.line04:
    title: 'Tranquilizar: está cerca'
    gloss: 'Ella dice que no, que está muy cerca: cinco minutos a pie.'
    note: '*À pied* (a pie) es la forma estándar de indicar que se va andando.'
  fr.a1.unit07.lesson03.teach.line05:
    title: Darle las gracias
    gloss: Mathieu le da las gracias con cariño.
    note: '*Merci beaucoup* refuerza el *merci* básico que ya conoces de unidades anteriores.'
  fr.a1.unit07.lesson03.teach.line06:
    title: Responder a las gracias
    gloss: 'Ella responde: de nada.'
    note: '*Je vous en prie* es un «de nada» más formal, acorde con el registro de *vous* que se usa con un desconocido; *De rien* es una alternativa menos formal y cotidiana.'
