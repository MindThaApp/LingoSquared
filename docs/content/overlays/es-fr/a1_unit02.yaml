teaching:
  fr.a1.unit02.lesson01.teach.zero:
    title: Cero
    gloss: cero
    note: '*Zéro* se usa tanto como número como cifra al leer en voz alta una serie de dígitos.'
  fr.a1.unit02.lesson01.teach.un:
    title: Uno
    gloss: uno
    note: '*Un* es masculino; la forma femenina *une* aparece ante un sustantivo femenino (*une tasse*, una taza). Solo, como al contar, se queda en *un*.'
  fr.a1.unit02.lesson01.teach.deux:
    title: Dos
    gloss: dos
    note: '*Deux* nunca cambia de forma, sea cual sea el género del sustantivo.'
  fr.a1.unit02.lesson01.teach.trois:
    title: Tres
    gloss: tres
    note: '*Trois* es invariable.'
  fr.a1.unit02.lesson01.teach.quatre:
    title: Cuatro
    gloss: cuatro
    note: '*Quatre* es invariable.'
  fr.a1.unit02.lesson01.teach.cinq:
    title: Cinco
    gloss: cinco
    note: '*Cinq* es invariable. La q final normalmente se pronuncia, a diferencia de las consonantes finales mudas de otros números franceses.'
  fr.a1.unit02.lesson01.teach.six:
    title: Six
    gloss: seis
    note: '*Six* se pronuncia con una /s/ final cuando se dice solo, pero esa consonante final desaparece ante un sustantivo que empieza por consonante (*six livres* suena como «si livres»).'
  fr.a1.unit02.lesson01.teach.sept:
    title: Siete
    gloss: siete
    note: '*Sept* es invariable; la p es muda y solo se pronuncia la t final.'
  fr.a1.unit02.lesson01.teach.huit:
    title: Ocho
    gloss: ocho
    note: '*Huit* es invariable. La h es muda, como en casi todas las palabras francesas.'
  fr.a1.unit02.lesson01.teach.neuf:
    title: Nueve
    gloss: nueve
    note: '*Neuf* es invariable.'
  fr.a1.unit02.lesson01.teach.dix:
    title: Diez
    gloss: diez
    note: '*Dix* se pronuncia con una /s/ final cuando se dice solo, y pierde esa consonante ante otra consonante, igual que *six*.'
  fr.a1.unit02.lesson02.teach.onze:
    title: Once
    gloss: once
    note: De *onze* a *seize* (11-16) cada número es una palabra propia, no se construye con *dix* como los números desde el veintiuno, que reutilizan *vingt*.
  fr.a1.unit02.lesson02.teach.douze:
    title: Doce
    gloss: doce
    note: '*Douze* es una sola palabra. Empieza como *deux*, pero no se ve *dix* en ella.'
  fr.a1.unit02.lesson02.teach.treize:
    title: Trece
    gloss: trece
    note: '*Treize* es una sola palabra. Empieza como *trois*, pero no se ve *dix* en ella.'
  fr.a1.unit02.lesson02.teach.quatorze:
    title: Catorce
    gloss: catorce
    note: '*Quatorze* es una sola palabra. Empieza como *quatre*, pero no se ve *dix* en ella.'
  fr.a1.unit02.lesson02.teach.quinze:
    title: Quince
    gloss: quince
    note: '*Quinze* es una sola palabra. Está emparentada de lejos con *cinq*, pero no se ve *dix* en ella.'
  fr.a1.unit02.lesson02.teach.seize:
    title: Dieciséis
    gloss: dieciséis
    note: '*Seize* es la última de las palabras fusionadas; desde *dix-sept* (17), *dix* vuelve a unirse visiblemente a la unidad.'
  fr.a1.unit02.lesson02.teach.vingt:
    title: Veinte
    gloss: veinte
    note: '*Vingt* es una palabra propia. Desde el veintiuno, decenas y unidades se combinan (*vingt et un*, *vingt-deux*) con un patrón que este curso retoma más adelante.'
  fr.a1.unit02.lesson02.teach.trente:
    title: Treinta
    gloss: treinta
    note: '*Trente* se une a la unidad siguiente con un guion (*trente-quatre*), salvo el uno, que lleva *et* (*trente et un*).'
  fr.a1.unit02.lesson02.teach.trente_quatre:
    title: Treinta y cuatro
    gloss: treinta y cuatro
    note: '*Trente-quatre* se escribe con guion, a diferencia del español, que escribe «treinta y cuatro» con la conjunción y sin guion.'
  fr.a1.unit02.lesson02.teach.soixante:
    title: Sesenta
    gloss: sesenta
    note: '*Soixante* se comporta como una decena normal (*soixante-quatre*, 64) hasta el sesenta y nueve; lo irregular empieza en el setenta, que se enseña a continuación.'
  fr.a1.unit02.lesson02.teach.soixante_dix:
    title: Setenta
    gloss: setenta
    note: 'Esta es la mayor sorpresa de los números franceses: no existe una palabra propia para setenta. *Soixante-dix* significa literalmente «sesenta-diez» (60 + 10). Los números siguen así hasta *soixante-dix-neuf* (79, «sesenta-diecinueve») antes de que *quatre-vingts* inicie una nueva base en el ochenta.'
  fr.a1.unit02.lesson02.teach.quatre_vingts:
    title: Ochenta
    gloss: ochenta
    note: '*Quatre-vingts* significa literalmente «cuatro veintes» (4 x 20), un resto de un antiguo sistema de base 20. Lleva una s final solo cuando está solo o cierra el número (*quatre-vingts*, 80); la s desaparece cuando le sigue una unidad (*quatre-vingt-un*, 81).'
  fr.a1.unit02.lesson02.teach.quatre_vingt_dix:
    title: Noventa
    gloss: noventa
    note: '*Quatre-vingt-dix* significa literalmente «cuatro veintes más diez» (4x20 + 10), con el mismo patrón de base 20 que el setenta, hasta *quatre-vingt-dix-neuf* (99).'
  fr.a1.unit02.lesson02.teach.cent:
    title: Cien
    gloss: cien
    note: '*Cent* es la forma que se usa para el 100 exacto, sin artículo (no «*un cent*»).'
  fr.a1.unit02.lesson03.teach.quel_age_as_tu:
    title: Preguntar la edad con tú
    gloss: ¿Qué edad tienes?
    note: Igual que el español usa «tener», el francés pregunta literalmente qué edad tienes con *avoir* (tener), no con una forma de *être* (ser).
  fr.a1.unit02.lesson03.teach.jai_vingt_huit_ans:
    title: Decir tu edad
    gloss: Tengo veintiocho años.
    note: '*Ai* es la forma de je del verbo *avoir*. *Ans* (años) es obligatorio en francés, igual que en español «tengo veintiocho años».'
  fr.a1.unit02.lesson03.teach.quel_age_avez_vous:
    title: Preguntar la edad con usted
    gloss: ¿Qué edad tienes?
    note: '*Avez-vous* usa la forma de *vous* del verbo *avoir*, en el registro formal que se vio en la unidad 1.'
  fr.a1.unit02.lesson03.teach.jai_trente_et_un_ans:
    title: Decir una edad compuesta
    gloss: Tengo treinta y un años.
    note: '*Trente et un* usa *et* (y), no un guion, justo en las formas terminadas en uno de treinta, cuarenta, cincuenta y sesenta (*trente et un*, *quarante et un*, *cinquante et un*, *soixante et un*). El setenta y uno rompe este patrón: es *soixante et onze* (sesenta + once), no *soixante et un*, porque los setenta siguen contando con las formas de *dix* hasta *soixante-dix-neuf* (79).'
  fr.a1.unit02.lesson03.teach.et_toi_quel_age:
    title: Devolver la pregunta de la edad
    gloss: Y tú, ¿qué edad tienes?
    note: '*Et toi* abre la pregunta de vuelta; *toi* (no *tu*) es el pronombre tónico que se usa tras *et* para dar énfasis.'
  fr.a1.unit02.lesson04.teach.quel_est_ton_numero:
    title: Pedir un número de teléfono
    gloss: ¿Cuál es tu número de teléfono?
    note: '*Quel* concuerda con el sustantivo masculino *numéro*; un sustantivo femenino exigiría *quelle*.'
  fr.a1.unit02.lesson04.teach.numero_ines:
    title: Un número leído cifra a cifra
    gloss: Cero, seis, uno, cinco, cero, dos, nueve, siete, cuatro, tres
    note: Los números de teléfono franceses reales tienen diez cifras y suelen leerse de dos en dos (*zéro six*, *quinze*, *zéro deux*...). Los de esta unidad tienen el formato real de diez cifras (06 15 02 97 43), pero se leen cifra a cifra para que practiques primero los dígitos sueltos.
  fr.a1.unit02.lesson04.teach.cest_le:
    title: Introducir el número
    gloss: Es el...
    note: Se usa *le* (artículo masculino) porque *numéro* es un sustantivo masculino.
  fr.a1.unit02.lesson04.teach.tu_peux_repeter:
    title: Pedir que repitan
    gloss: ¿Puedes repetirlo, por favor?
    note: '*Peux* es la forma de *tu* del verbo *pouvoir* (poder), muy útil cuando un número se dice demasiado rápido para entenderlo.'
  fr.a1.unit02.lesson04.teach.bien_sur:
    title: Aceptar sin problema
    gloss: claro; por supuesto
    note: '*Bien sûr* es una forma habitual y amable de aceptar una petición.'
  fr.a1.unit02.lesson05.teach.jai_besoin_trois_oeufs:
    title: Decir una cantidad necesaria
    gloss: Necesito tres huevos.
    note: '*J''ai besoin de* (literalmente «tengo necesidad de») es la forma francesa de expresar que necesitas algo: usa *avoir* en lugar de un verbo propio como «necesitar».'
  fr.a1.unit02.lesson05.teach.combien_oeufs:
    title: Preguntar cuántos se necesitan
    gloss: ¿Cuántos huevos necesitas?
    note: '*De combien d''œufs* empieza con *de* porque avoir besoin de exige esa preposición: en francés se pregunta «de cuántos huevos» tienes necesidad.'
  fr.a1.unit02.lesson05.teach.deux_tasses_farine:
    title: Decir una cantidad medida
    gloss: Dos tazas de harina
    note: '*De* une la unidad de medida (*tasses*, tazas) con lo que se mide (*farine*, harina), el mismo patrón que el español con «de».'
  fr.a1.unit02.lesson05.teach.demi_tasse:
    title: Decir una media cantidad
    gloss: Media taza de azúcar
    note: '*Demi-* es invariable como prefijo ante el sustantivo (*une demi-tasse*), a diferencia del adjetivo *demi* colocado detrás de un sustantivo, que sí concuerda (*une heure et demie*).'
  fr.a1.unit02.lesson05.teach.jai_quatre_oeufs:
    title: Decir lo que tienes
    gloss: Tengo cuatro huevos sobre la mesa.
    note: '*J''ai* (tengo) indica lo que ya hay disponible, a diferencia de *j''ai besoin de* (necesito), que indica lo que aún falta.'
  fr.a1.unit02.lesson06.teach.line01:
    title: Preguntar cuántos huevos
    gloss: Inès le pregunta a Mathieu cuántos huevos necesita para la receta.
    note: 'Inès y Mathieu ahora se tutean (*tu*) en vez de usar *vous* como en la unidad 1: al ser compañeros de taller, han pasado pronto al registro informal.'
  fr.a1.unit02.lesson06.teach.line02:
    title: Decir los ingredientes
    gloss: Mathieu dice que necesita tres huevos y dos tazas de harina.
    note: '*J''ai besoin de* nombra lo que aún hace falta para la receta.'
  fr.a1.unit02.lesson06.teach.line03:
    title: Ofrecer lo que tienes
    gloss: Inès dice que tiene cuatro huevos sobre la mesa y le pregunta si también necesita azúcar.
    note: '*J''ai* indica lo que Inès ya tiene, algo distinto de lo que Mathieu dijo que necesita.'
  fr.a1.unit02.lesson06.teach.line04:
    title: Confirmar una cantidad pequeña
    gloss: 'Mathieu dice que sí, un poco: más o menos media taza.'
    note: '*Environ* aquí significa «aproximadamente» o «más o menos» y suaviza la cantidad exacta.'
  fr.a1.unit02.lesson06.teach.line05:
    title: Pedir un número de teléfono
    gloss: Inès dice que perfecto y le pide el número de teléfono a Mathieu para escribirle sobre la próxima clase.
    note: '*Comme ça je t''écris* («así te escribo») explica por qué lo pide, una costumbre natural de la conversación antes de pedir datos de contacto.'
  fr.a1.unit02.lesson06.teach.line06:
    title: Dar el número de teléfono
    gloss: Mathieu lee su número cifra a cifra.
    note: '*C''est le* introduce el número y concuerda con el sustantivo masculino *numéro*.'
  fr.a1.unit02.lesson06.teach.line07:
    title: Darle las gracias y preguntarle la edad
    gloss: 'Inès le da las gracias y le hace una última pregunta: cuántos años tiene.'
    note: '*Une dernière question* («una última pregunta») marca un cambio natural de tema dentro de la misma conversación.'
  fr.a1.unit02.lesson06.teach.line08:
    title: Decir su edad
    gloss: Mathieu dice que tiene veintiocho años y le hace la misma pregunta a Inès.
    note: '*J''ai vingt-huit ans* usa la forma compuesta con guion, igual que el patrón de la lección 2.'
  fr.a1.unit02.lesson06.teach.line09:
    title: Decir la edad de ella
    gloss: Inès dice que tiene treinta y un años.
    note: '*J''ai trente et un ans* usa *et* (y) en lugar de un guion, porque treinta y uno es una de las formas terminadas en uno que se vieron en la lección 3.'
