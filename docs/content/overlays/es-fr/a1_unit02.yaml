  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francés A1
  description: Números del 0 al 100 (incluidas las formas soixante-dix, quatre-vingts y quatre-vingt-dix), edades, números de teléfono y cantidades de recetas, continuando con Inès y Mathieu del taller de cocina de la unidad 1. Las explicaciones se centran en las expresiones de edad con avoir, los restos del sistema de veintes en los números franceses y la concordancia de género en las expresiones de cantidad.
