  fr.a1.unit03.lesson01.immediate_family:
    title: La familia cercana
  fr.a1.unit03.lesson02.possessives_mon_ma_mes:
    title: 'Posesivos: mon, ma, mes'
  fr.a1.unit03.lesson03.extended_family:
    title: La familia extensa
  fr.a1.unit03.lesson04.describing_family_size:
    title: Cuántos somos en casa
  fr.a1.unit03.lesson05.reading_a_family_profile:
    title: Leer el perfil de una familia
  fr.a1.unit03.lesson06.family_photos_dialogue:
    title: Fotos de familia con Inès y Mathieu
teaching:
  fr.a1.unit03.lesson01.teach.mere:
    title: Madre
    gloss: madre
    note: '*Mère* es femenino. *Maman* es la palabra cotidiana más habitual en la familia, mientras que *mère* es neutra y es la que aparece en las listas de vocabulario de este curso.'
  fr.a1.unit03.lesson01.teach.pere:
    title: Padre
    gloss: padre
    note: '*Père* es masculino. *Papa* es el equivalente cotidiano, igual que *maman* con *mère*.'
  fr.a1.unit03.lesson01.teach.frere:
    title: Hermano
    gloss: hermano
    note: '*Frère* es masculino singular.'
  fr.a1.unit03.lesson01.teach.soeur:
    title: Hermana
    gloss: hermana
    note: '*Sœur* es femenino singular. La ligadura œ es una sola letra en la ortografía francesa, no dos letras separadas.'
  fr.a1.unit03.lesson01.teach.fils:
    title: Son
    gloss: hijo
    note: '*Fils* es masculino; ten en cuenta que aquí la s final sí se pronuncia (es una excepción), mientras que la l es muda.'
  fr.a1.unit03.lesson01.teach.fille:
    title: Daughter
    gloss: hija
    note: '*Fille* es femenino singular; la misma palabra significa también «chica» en otros contextos.'
  fr.a1.unit03.lesson01.teach.parents:
    title: Parents
    gloss: padres
    note: '*Parents* es masculino plural y abarca a la madre y al padre juntos.'
  fr.a1.unit03.lesson01.teach.freres_et_soeurs:
    title: Hermanos
    gloss: hermanos y hermanas; hermanos
    note: 'A diferencia del español, donde «hermanos» sirve para un grupo mixto, el francés no tiene una sola palabra neutra equivalente: *frères et sœurs* nombra a ambos explícitamente.'
  fr.a1.unit03.lesson02.teach.ma_mere:
    title: Mi madre
    gloss: mi madre
    note: '*Ma* es el posesivo femenino singular «mi», que se usa porque *mère* es femenino.'
  fr.a1.unit03.lesson02.teach.mon_pere:
    title: Mi padre
    gloss: mi padre
    note: '*Mon* es el posesivo masculino singular «mi», que se usa porque *père* es masculino.'
  fr.a1.unit03.lesson02.teach.mes_freres_et_soeurs:
    title: Mis hermanos
    gloss: mis hermanos
    note: '*Mes* es el posesivo plural «mis» y se usa con cualquier sustantivo plural, sea cual sea su género; sigue el mismo patrón de concordancia que *ma*/*mon*, pero por número y no por género.'
  fr.a1.unit03.lesson02.teach.as_tu_des_freres_et_soeurs:
    title: Preguntar por los hermanos
    gloss: ¿Tienes hermanos?
    note: '*As-tu* es la forma de pregunta con inversión de *tu as* (tú tienes), un patrón de pregunta muy común en A1.'
  fr.a1.unit03.lesson02.teach.jai_deux_soeurs:
    title: Decir cuántos hermanos tienes
    gloss: Tengo dos hermanas.
    note: '*J''ai* (tengo) junto con un número y el sustantivo familiar es la forma habitual de hablar de los hermanos.'
  fr.a1.unit03.lesson02.teach.ta_famille_est_grande:
    title: Preguntar si una familia es grande
    gloss: ¿Tu familia es grande?
    note: '*Ta* es el posesivo informal femenino singular «tu», que concuerda con el sustantivo femenino *famille*.'
  fr.a1.unit03.lesson02.teach.ma_famille_est_petite:
    title: Describir una familia pequeña
    gloss: Mi familia es pequeña.
    note: '*Petite* concuerda con el sustantivo femenino *famille*; con un sustantivo masculino aparecería la forma masculina *petit*. Es un tipo de concordancia distinto del de *mon*/*ma*/*mes*, que también concuerda con el sustantivo pero marca la POSESIÓN en lugar de describir una cualidad.'
  fr.a1.unit03.lesson03.teach.grand_pere:
    title: Abuelo
    gloss: abuelo
    note: '*Grand-père* es un compuesto con guion, masculino.'
  fr.a1.unit03.lesson03.teach.grand_mere:
    title: Abuela
    gloss: abuela
    note: '*Grand-mère* es un compuesto con guion, femenino. Fíjate en que *grand-* se mantiene invariable y no se dice *grande-mère*.'
  fr.a1.unit03.lesson03.teach.grands_parents:
    title: Grandparents
    gloss: abuelos
    note: '*Grands-parents* pone en plural las dos partes del compuesto (*grands*, no *grand-*), a diferencia de *grand-mère*/*grand-père*, donde la parte *grand-* no cambia en singular.'
  fr.a1.unit03.lesson03.teach.oncle:
    title: Tío
    gloss: tío
    note: '*Oncle* es masculino.'
  fr.a1.unit03.lesson03.teach.tante:
    title: Tía
    gloss: tía
    note: '*Tante* es femenino.'
  fr.a1.unit03.lesson03.teach.cousin:
    title: Primo
    gloss: primo
    note: '*Cousin* es masculino singular; como en español («primo» / «prima»), el francés marca el género del pariente.'
  fr.a1.unit03.lesson03.teach.cousine:
    title: Prima
    gloss: prima
    note: '*Cousine* es femenino singular y se forma añadiendo -e a *cousin*.'
  fr.a1.unit03.lesson03.teach.mes_grands_parents:
    title: Mis abuelos
    gloss: mis abuelos
    note: Se usa *mes* porque *grands-parents* es plural, aunque el compuesto incluya a un miembro masculino y (implícitamente) a uno femenino.
  fr.a1.unit03.lesson04.teach.combien_de_freres_et_soeurs:
    title: Preguntar cuántos hermanos
    gloss: ¿Cuántos hermanos tienes?
    note: '*Combien de* (cuántos, de) va directamente delante del sustantivo y lleva siempre la preposición de: combien de frères et sœurs.'
  fr.a1.unit03.lesson04.teach.on_est_cinq:
    title: Decir cuántos viven en casa
    gloss: Somos seis en casa.
    note: '*On est* (literalmente «uno es», pero con valor informal de «somos») es la forma natural y muy habitual de indicar cuántas personas viven en casa en el francés hablado; *nous sommes* es más formal o escrito.'
  fr.a1.unit03.lesson04.teach.ma_famille_est_grande:
    title: Describir una familia grande
    gloss: Mi familia es grande.
    note: '*Grande* concuerda con el sustantivo femenino *famille*; con un sustantivo masculino aparecería la forma masculina *grand*.'
  fr.a1.unit03.lesson04.teach.jai_beaucoup_de_cousins:
    title: Decir que tienes muchos primos
    gloss: Tengo muchos primos.
    note: '*Beaucoup de* (muchos) va delante del sustantivo; *de* no se convierte en *du*/*des* aquí porque *beaucoup* ya expresa la cantidad.'
  fr.a1.unit03.lesson04.teach.tu_habites_pres_de_tes_parents:
    title: Preguntar si vives cerca de tus padres
    gloss: ¿Vives cerca de tus padres?
    note: '*Tes* es el posesivo informal plural «tus», obligatorio porque *parents* es plural.'
  fr.a1.unit03.lesson04.teach.jhabite_avec_mes_grands_parents:
    title: Decir con quién vives
    gloss: Vivo con mis abuelos.
    note: '*Avec* (con) introduce a las personas con las que alguien vive; *j''habite* es la forma de *je* de *habiter*, que ya apareció en *j''habite à Montreuil* de la unidad 1.'
  fr.a1.unit03.lesson05.teach.profile_reading:
    title: El perfil familiar de Inès
    gloss: 'Me llamo Inès. Tengo treinta y un años y vivo con mis abuelos en París. Mi madre y mi padre viven en Lille. Tengo dos hermanas y un hermano: somos seis en casa. Mi hermana pequeña se llama Camille y tiene veinte años.'
    note: Este perfil reutiliza el vocabulario y las estructuras de las lecciones 1 a 4 en un texto corto y conectado, en lugar de frases aisladas; es la misma habilidad de saber quién es quién que evalúa la lectura de esta unidad.
    glosses:
      trente: treinta
      ans: años
      grands-parents: abuelos
      mère: madre
      père: padre
      habitent: viven (de habiter)
      deux: dos
      sœurs: hermanas
      frère: hermano
      six: seis
      maison: casa
      petite: pequeña; menor
      sœur: hermana
      vingt: veinte
  fr.a1.unit03.lesson05.teach.petite_soeur:
    title: Hermana menor
    gloss: hermana menor; hermana pequeña
    note: '*Petite* (femenino de *petit*) va delante del sustantivo, como muchos adjetivos cortos y frecuentes del francés; la mayoría de los adjetivos, en cambio, va detrás.'
  fr.a1.unit03.lesson05.teach.habite_third_person:
    title: Vive (tercera persona)
    gloss: vive
    note: '*Habite* es la forma de tercera persona del singular de *habiter*, que se usa para hablar DE alguien (*Inès habite...*) y no como uno mismo (*j''habite*, de la unidad 1 y de la lección 4 de esta unidad).'
  fr.a1.unit03.lesson05.teach.ses_third_person_plural:
    title: Su (con sustantivo plural)
    gloss: sus
    note: '*Ses* es el plural de *sa*/*son*: igual que *sa*/*son* equivalen a «su» con un sustantivo singular, ses equivale a «sus» con uno plural; *ses grands-parents* significa «sus abuelos» cuando se habla de Inès en tercera persona.'
  fr.a1.unit03.lesson05.teach.a_third_person_avoir:
    title: Tiene (tercera persona)
    gloss: tiene
    note: '*A* es la forma de tercera persona del singular de *avoir*, que se usa para hablar DE alguien (*elle a vingt ans*) y no como uno mismo (*j''ai* / *as-tu*, vistos en las lecciones 2 a 4 de esta unidad).'
  fr.a1.unit03.lesson06.teach.line01:
    title: Enseñar fotos de familia
    gloss: Inès le enseña una foto a Mathieu y le presenta a sus padres y a su hermana pequeña.
    note: '*Voici* (aquí está / aquí están) introduce algo que se señala, una frase natural para enseñar una foto.'
  fr.a1.unit03.lesson06.teach.line02:
    title: Reaccionar y preguntar por los hermanos
    gloss: Mathieu reacciona con cariño y le pregunta si tiene más hermanos.
    note: '*C''est adorable* es una reacción natural y cariñosa al ver una foto de un hermano pequeño.'
  fr.a1.unit03.lesson06.teach.line03:
    title: Decir cuántos son en casa y devolver la pregunta
    gloss: Inès dice que tiene dos hermanas y un hermano, seis en casa, y luego le pregunta por la familia de Mathieu.
    note: '*On est six à la maison* indica cuántas personas viven en casa, siguiendo el patrón de la lección 4.'
  fr.a1.unit03.lesson06.teach.line04:
    title: Describir una familia más pequeña
    gloss: 'Mathieu dice que su familia es más pequeña, solo tres: sus padres y él, pero que tiene muchos primos.'
    note: '*Mais* (pero) marca el contraste entre una familia cercana pequeña y muchos parientes lejanos.'
  fr.a1.unit03.lesson06.teach.line05:
    title: Preguntar si vive cerca de sus padres
    gloss: Inès le pregunta a Mathieu si vive cerca de sus padres.
    note: '*Près de* (cerca de) es una forma habitual de describir la proximidad física.'
  fr.a1.unit03.lesson06.teach.line06:
    title: Explicar la distancia y cómo mantienen el contacto
    gloss: Mathieu dice que no, que viven en Lyon, y que hablan por teléfono cada semana.
    note: 'Continúa con el dato de la unidad 1 de que Mathieu es de Lyon: sus padres siguen allí mientras él vive en Saint-Ouen.'
  fr.a1.unit03.lesson06.teach.line07:
    title: Mostrar empatía y contar tu propia situación
    gloss: Inès dice que lo entiende y que ella vive con sus abuelos aquí en París.
    note: '*Je comprends* (entiendo) es una forma breve y natural de reconocer lo que alguien acaba de contar antes de añadir un detalle propio.'
  fr.a1.unit03.lesson06.teach.line08:
    title: Cerrar con un comentario cálido
    gloss: Mathieu dice que es bonito tener a la familia cerca.
    note: '*C''est bien d''avoir sa famille près de soi* cierra el intercambio con un tono cálido y reflexivo, y retoma el patrón de *près de* de la lección 4.'
