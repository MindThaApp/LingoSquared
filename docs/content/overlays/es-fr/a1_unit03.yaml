answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francés A1
  description: Vocabulario de la familia cercana y extensa, el sistema de adjetivos posesivos mon/ma/mes y la descripción de un hogar, continuando la historia de Inès y Mathieu en el taller de cocina de las unidades 1 y 2. Las explicaciones destacan que los posesivos franceses concuerdan en género con el sustantivo, no con el poseedor.
units:
  fr.a1.unit03.family:
    title: Las familias de Inès y Mathieu
