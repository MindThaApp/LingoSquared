answer_policy:
  diacritics: 'Teach and display standard French accents and the cedilla. For free-typed A1 answers, accept otherwise-correct forms without diacritics, including ca for ça, tres for très, and enchante for enchanté. This leniency does not erase meaningful letters: masculine enchanté and feminine enchantée remain distinct through the final e even when accents are omitted.'
  apostrophes: Accept straight and typographic apostrophes interchangeably. Require the apostrophe when an exercise specifically tests elision, such as j’habite; do not accept jhabite in that exercise.
  hyphens: Teach the standard hyphens in inverted questions such as allez-vous and vas-tu. In free transcription exercises, accept an otherwise-correct spaced version at A1, but retain the hyphenated form as the model answer.
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of French spacing before question or exclamation marks. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
course:
  title: Francés A1
  description: 'Francés para principiantes para describir el aspecto físico básico de una persona: impresiones de estatura y de edad, color del pelo y de los ojos, la pregunta clave Comment est ... ? y la comparación del aspecto de dos personas.'
units:
  fr.a1.unit53.apparence:
    title: Describir el aspecto
lessons:
  fr.a1.unit53.lesson01.grand_petit_vieux_et:
    title: Alto, bajo, viejo y joven
  fr.a1.unit53.lesson02.decrire_les_cheveux:
    title: Describir el pelo
  fr.a1.unit53.lesson03.les_yeux_et_comment:
    title: Los ojos y ¿cómo es alguien?
  fr.a1.unit53.lesson04.camille_decrit_nina:
    title: Camille describe a Nina
  fr.a1.unit53.lesson05.comparer_thomas_et_lea:
    title: Comparar a Thomas y Léa
  fr.a1.unit53.lesson06.mathieu_reconnait_nina:
    title: Mathieu reconoce a Nina
teaching:
  fr.a1.unit53.lesson01.teach.grand_petit:
    title: Alto y bajo
    gloss: alto / bajo
    note: '*Grand* describe a una persona alta y *petit* a una baja. Concuerdan con la persona: *grand/grande*, *petit/petite*.'
    example_gloss:
    - Léa es alta.
    - Thomas es bajo.
  fr.a1.unit53.lesson01.teach.vieux_jeune:
    title: Viejo y joven
    gloss: viejo / joven
    note: Aquí *vieux* y *jeune* dan una impresión general de la edad, no un número exacto de años.
    example_gloss:
    - El abuelo es viejo.
    - Mathieu es joven.
  fr.a1.unit53.lesson01.teach.pour_un_age:
    title: 'La edad: un número o una impresión'
    gloss: Para una edad exacta el francés usa *avoir* (*Il a vingt ans*), pero *être vieux* da una impresión general (*Mon grand-père est vieux*).
    note: Ya conoces *Quel âge as-tu ?* para preguntar la edad exacta. Aquí *vieux* describe qué edad PARECE tener alguien, sin ningún número.
  fr.a1.unit53.lesson01.teach.lea_est_grande:
    title: Léa es alta y Thomas es bajo
    gloss: Léa es alta y Thomas es bajo.
    note: Una frase sencilla con *et* (y) que prepara la comparación directa de la lección 5.
  fr.a1.unit53.lesson02.teach.les_cheveux:
    title: El pelo
    gloss: el pelo
    note: '*Les cheveux* es siempre plural y masculino en francés, aunque en español decimos «el pelo» o «el cabello» en singular.'
    example_gloss: Mathieu tiene el pelo corto y negro.
  fr.a1.unit53.lesson02.teach.blonds_bruns_gris:
    title: Rubio, castaño y gris
    gloss: rubio / castaño / gris
    note: 'Tres colores de pelo. Con *cheveux* el color lleva una *s* de plural: *blonds*, *bruns*. *Gris* ya termina en *s*, y *noirs* (negro) se repite de la unidad de la ropa.'
    example_gloss:
    - Camille tiene el pelo rubio.
    - Thomas tiene el pelo castaño.
    - El abuelo tiene el pelo gris.
  fr.a1.unit53.lesson02.teach.longs_courts:
    title: Largo y corto (pelo)
    gloss: largo / corto (pelo)
    note: '*Longs* (largo) retoma la idea de la estatura de la lección 1, ahora para la longitud del pelo. *Courts* (corto) es nuevo aquí, y ambos llevan una *s* de plural con *cheveux*.'
    example_gloss:
    - Léa tiene el pelo largo.
    - Thomas tiene el pelo corto.
  fr.a1.unit53.lesson02.teach.cheveux_est_toujours:
    title: Cheveux lleva adjetivo en plural
    gloss: '*Cheveux* es siempre plural, así que el adjetivo lleva una *s*: *longs*, *courts*, *blonds*, *bruns*, *noirs*. *Gris* ya termina en *s*.'
    note: 'Los colores y las longitudes concuerdan con *cheveux* en plural: *les cheveux longs*. Compara con *yeux* en la lección 3, donde *marron* no cambia.'
  fr.a1.unit53.lesson02.teach.ses_est_le:
    title: 'Ses: su o sus (de él o de ella)'
    gloss: '*Ses* significa «sus» (de él o de ella) delante de un sustantivo plural: *ses cheveux*, *ses yeux*. Concuerda con lo que se posee, no con quien lo posee.'
    note: 'Como en español con «su» y «sus», el francés no distingue aquí entre «de él» y «de ella»: *ses yeux* puede ser «los ojos de ella» o «los ojos de él», y el contexto indica cuál.'
  fr.a1.unit53.lesson02.teach.mathieu_a_les:
    title: Mathieu tiene el pelo corto y negro
    gloss: Mathieu tiene el pelo corto y negro.
    note: Retoma *noirs* (negro) de la unidad de la ropa.
  fr.a1.unit53.lesson02.teach.camille_a_les:
    title: Camille tiene el pelo largo y rubio
    gloss: Camille tiene el pelo largo y rubio.
    note: Combina el vocabulario de longitud y de color de esta lección en una frase natural.
  fr.a1.unit53.lesson03.teach.les_yeux:
    title: Los ojos
    gloss: los ojos
    note: '*Les yeux* es el plural de *l''œil* (el ojo); *yeux* termina en *x*, no en *s*.'
    example_gloss: Mathieu tiene los ojos marrones.
  fr.a1.unit53.lesson03.teach.bleus_marron_verts:
    title: Azul, marrón y verde
    gloss: azul / marrón / verde
    note: '*Bleus* (azul) ya se vio con la ropa; *marron* (marrón) nunca cambia; *verts* (verde) es nuevo.'
    example_gloss:
    - Camille tiene los ojos azules.
    - Thomas tiene los ojos marrones.
    - Léa tiene los ojos verdes.
  fr.a1.unit53.lesson03.teach.avec_yeux_pluriel:
    title: Yeux lleva -s, marron no cambia
    gloss: 'Con *yeux* (plural), el adjetivo lleva una *s*: *yeux bleus*, *yeux verts*. *Marron* nunca cambia: *yeux marron*.'
    note: 'Compara con *cheveux* de la lección 2: un sustantivo plural lleva un adjetivo plural, salvo los colores como *marron* que vienen de un sustantivo.'
  fr.a1.unit53.lesson03.teach.comment_est_camille:
    title: ¿Cómo es Camille?
    gloss: ¿Cómo es Camille?
    note: '*Comment est ... ?* es la pregunta clave de esta unidad; úsala para preguntar por el aspecto de cualquier persona.'
  fr.a1.unit53.lesson03.teach.camille_a_les:
    title: Camille tiene el pelo largo y rubio y los ojos azules
    gloss: Camille tiene el pelo largo y rubio y los ojos azules.
    note: Una respuesta modelo que combina pelo y ojos en una sola frase con *et*.
  fr.a1.unit53.lesson04.teach.camille_une_nouvelle:
    title: Camille presenta a Nina
    gloss: 'Camille: Una chica nueva viene al café de idiomas. Se llama Nina.'
    note: '*Une nouvelle fille vient* presenta a alguien nuevo en la escena; *vient* viene de *venir*.'
  fr.a1.unit53.lesson04.teach.mathieu_d_accord:
    title: Mathieu pregunta cómo es ella
    gloss: 'Mathieu: ¡Vale! ¿Cómo es?'
    note: 'Retoma la pregunta clave con *elle* (ella) en lugar de un nombre: *Comment est-elle ?* El guion une el verbo y el pronombre.'
  fr.a1.unit53.lesson04.teach.camille_elle_est:
    title: Camille describe la estatura y el pelo de Nina
    gloss: 'Camille: Es bajita y tiene el pelo corto y rubio.'
    note: Combina *petite* de la lección 1 con el vocabulario del pelo de la lección 2; *petite* lleva una *e* para una chica.
  fr.a1.unit53.lesson04.teach.mathieu_et_ses:
    title: Mathieu pregunta por sus ojos
    gloss: 'Mathieu: ¿Y sus ojos?'
    note: 'Aquí *ses yeux* significa «sus ojos» (los de ella): *ses* concuerda con *yeux*, no con la chica.'
  fr.a1.unit53.lesson04.teach.camille_elle_a:
    title: Camille describe los ojos de Nina
    gloss: 'Camille: Tiene los ojos verdes.'
    note: Retoma *yeux verts* de la lección 3.
  fr.a1.unit53.lesson04.teach.mathieu_merci_alors:
    title: Mathieu la reconocerá
    gloss: 'Mathieu: ¡Gracias! Entonces la reconoceré.'
    note: '*Je vais la reconnaître* usa *aller* + infinitivo para el futuro próximo, y *la* significa «la».'
  fr.a1.unit53.lesson05.teach.thomas_et_lea:
    title: Comparar a Thomas y Léa
    gloss: Thomas y Léa son hermano y hermana, pero no se parecen. Thomas es bajo y tiene el pelo corto y castaño y los ojos marrones. Léa es más alta que Thomas y tiene el pelo largo y castaño y los ojos verdes. ¿Y tú, cómo eres?
    note: Una breve comparación que reúne todas las palabras de color y de longitud vistas hasta ahora y termina con la pregunta clave de la unidad dirigida al lector.
    glosses:
      frère: hermano
      sœur: hermana
      ressemblent: parecerse
      différents: diferentes
      petit: bajo
      courts: bajo
      bruns: castaño
      cheveux: pelo
      marron: castaño
      yeux: ojos
      grande: más alta
      longs: largo
      verts: verdes
      se: (parte de «se ressemblent» = se parecen)
  fr.a1.unit53.lesson05.teach.tu_connais_deja:
    title: Plus ... que con personas
    gloss: 'Ya conoces el modelo *plus* + adjetivo + *que*. Aquí lo usas con personas: Léa es más alta que Thomas.'
    note: El mismo modelo *plus ... que* de la unidad de compras, ahora aplicado a personas en lugar de objetos. *Grande* concuerda con *Léa*, que es femenino.
  fr.a1.unit53.lesson05.teach.lea_a_les:
    title: Léa tiene el pelo más largo que Thomas
    gloss: Léa tiene el pelo más largo que Thomas.
    note: '*Plus longs que* concuerda con *cheveux* (plural): *les cheveux plus longs que Thomas*.'
  fr.a1.unit53.lesson05.teach.j_ai_les:
    title: Tengo el pelo corto y castaño
    gloss: Tengo el pelo corto y castaño.
    note: Una frase modelo en primera persona con *J'ai ...*, lista para usarla al describir tu propio aspecto.
  fr.a1.unit53.lesson06.teach.mathieu_regarde_c:
    title: Mathieu spots Nina
    gloss: 'Mathieu: Mira, ¿es Nina? Tiene el pelo corto y rubio y los ojos verdes.'
    note: '*Regarde* (mira) es la forma de imperativo de *tu* de *regarder*, ya usada igual en un diálogo anterior.'
  fr.a1.unit53.lesson06.teach.camille_oui_c:
    title: Camille confirma
    gloss: 'Camille: ¡Sí, es Nina!'
    note: Una confirmación breve y natural.
  fr.a1.unit53.lesson06.teach.nina_salut_tu:
    title: Nina greets Mathieu
    gloss: 'Nina: Hola, ¿eres Mathieu?'
    note: 'Una pregunta de saludo informal y sencilla: *Tu es ... ?*'
  fr.a1.unit53.lesson06.teach.mathieu_oui_ravi:
    title: Mathieu saluda a Nina
    gloss: 'Mathieu: ¡Sí! Encantado de conocerte, Nina.'
    note: '*Ravi de te rencontrer* es la fórmula habitual para un primer encuentro de verdad (*ravi* si eres hombre, *ravie* si eres mujer), no *content de te revoir*, que se usa con alguien a quien ya conoces.'
  fr.a1.unit53.lesson06.teach.nina_ravie_de:
    title: Nina responde al saludo
    gloss: 'Nina: ¡Encantada de conocerte también!'
    note: 'Cierra el diálogo: Mathieu ha reconocido a Nina gracias a la descripción de Camille.'
