teaching:
  fr.a1.unit44.lesson01.teach.je_ne_me:
    title: No sentirse bien
    gloss: No me siento bien.
    note: '*Se sentir* es reflexivo (*je me sens*); *ne ... pas bien* es la forma general y suave de decir que algo no va bien.'
  fr.a1.unit44.lesson01.teach.malade:
    title: Enfermo
    gloss: enfermo
    note: 'El adjetivo básico, que se usa con *être*: *je suis malade*.'
    example_gloss: Estoy enfermo.
  fr.a1.unit44.lesson01.teach.je_suis_malade:
    title: Estar enfermo
    gloss: Estoy enfermo.
    note: '*Malade* describe un estado más general y más fuerte que *pas bien*.'
  fr.a1.unit44.lesson01.teach.mal_a_la:
    title: Dolor de cabeza
    gloss: dolor de cabeza
    note: '*Mal à la tête* va con *avoir*: *j''ai mal à la tête*; *à la* porque *tête* es femenino.'
    example_gloss: Me duele la cabeza.
  fr.a1.unit44.lesson01.teach.j_ai_mal:
    title: Tener dolor de cabeza
    gloss: Me duele la cabeza.
    note: 'Los síntomas se combinan con *avoir* (tener): *j''ai mal*.'
  fr.a1.unit44.lesson01.teach.mal_au_ventre:
    title: Dolor de estómago
    gloss: dolor de estómago
    note: '*Mal au ventre*: *au* es *à* + *le* unidos, porque *ventre* es masculino.'
    example_gloss: Me duele el estómago.
  fr.a1.unit44.lesson01.teach.j_ai_mal_2:
    title: Tener dolor de estómago
    gloss: Me duele el estómago.
    note: El mismo patrón con *avoir* que *mal à la tête*, con *au* en lugar de *à la*.
  fr.a1.unit44.lesson02.teach.qu_est_ce:
    title: Preguntar en general
    gloss: ¿Qué pasa?
    note: Una forma general, válida para todo, de preguntar si ocurre algo.
  fr.a1.unit44.lesson02.teach.qu_est_ce_2:
    title: Una expresión muy común
    gloss: ¿Qué ocurre?
    note: '*Qu''est-ce qui ne va pas ?* es una pregunta fija, literalmente ''qué es lo que no va bien''; no la traduzcas palabra por palabra.'
  fr.a1.unit44.lesson02.teach.mal_a_la:
    title: Dolor de garganta
    gloss: dolor de garganta
    note: '*Mal à la gorge* sigue a *mal à la tête*: *gorge* es femenino, por eso *à la*.'
    example_gloss: Me duele la garganta.
  fr.a1.unit44.lesson02.teach.j_ai_mal:
    title: Tener dolor de garganta
    gloss: Me duele la garganta.
    note: Sigue el mismo patrón con *avoir* que los demás síntomas.
  fr.a1.unit44.lesson02.teach.ca_va_non:
    title: Preguntarle a alguien cómo está
    gloss: ¿Estás bien? No, no me siento bien.
    note: '*Ça va ?* es una pregunta muy común e informal entre amigos para saber cómo está alguien.'
  fr.a1.unit44.lesson03.teach.la_fievre:
    title: Fiebre
    gloss: fiebre
    note: '*La fièvre* es femenino; después de *avoir* lleva *de la*: *j''ai de la fièvre*.'
    example_gloss: Tengo fiebre.
  fr.a1.unit44.lesson03.teach.j_ai_de:
    title: Tener fiebre
    gloss: Tengo fiebre.
    note: Sigue el patrón con *avoir*, con el partitivo *de la*.
  fr.a1.unit44.lesson03.teach.le_rhume:
    title: Tener un resfriado
    gloss: tener un resfriado
    note: '*Le rhume* es un sustantivo masculino que se usa con *avoir*, no un adjetivo que se use con *être*.'
    example_gloss: Tengo un resfriado.
  fr.a1.unit44.lesson03.teach.j_ai_un:
    title: Decir que tienes un resfriado
    gloss: Tengo un resfriado.
    note: El francés dice *j'ai un rhume* ('tengo un resfriado'); no se dice *je suis rhume*.
  fr.a1.unit44.lesson03.teach.malade_se_dit:
    title: ¿Être o avoir?
    gloss: '*Malade* es un adjetivo y usa *être*: estoy enfermo. *Mal*, *fièvre* y *rhume* son sustantivos y usan *avoir*: tengo un resfriado.'
    note: 'La elección entre *être* y *avoir* depende de la clase de palabra: un adjetivo como *malade* va con *être* y un sustantivo como *fièvre* va con *avoir*, por breve que sea la enfermedad.'
  fr.a1.unit44.lesson04.teach.la_pharmacie:
    title: La farmacia
    gloss: la farmacia
    note: '*Pharmacie* es femenino: *la pharmacie*.'
    example_gloss: Voy a la farmacia.
  fr.a1.unit44.lesson04.teach.je_peux_vous:
    title: El saludo del farmacéutico
    gloss: ¿En qué puedo ayudarle?
    note: '*Je peux vous aider ?* es un saludo formal habitual en el servicio al cliente; *vous* es la forma de cortesía.'
  fr.a1.unit44.lesson04.teach.avez_vous_quelque:
    title: Pedir algo para un síntoma
    gloss: ¿Tiene algo para el dolor de cabeza?
    note: '*Quelque chose contre* + síntoma es la forma natural de pedir un remedio.'
  fr.a1.unit44.lesson04.teach.un_comprime:
    title: Una pastilla
    gloss: una pastilla
    note: '*Comprimé* es masculino: *un comprimé*.'
    example_gloss: Tomo una pastilla.
  fr.a1.unit44.lesson04.teach.prenez_un_comprime:
    title: Indicaciones de dosis
    gloss: Tome una pastilla dos veces al día.
    note: '*Prenez* es el imperativo de *vous* de *prendre* (tomar), que se usa para dar instrucciones.'
  fr.a1.unit44.lesson04.teach.a_la_pharmacie:
    title: El registro en la farmacia
    gloss: En la farmacia se usa la forma de cortesía *vous*.
    note: El farmacéutico es un adulto desconocido que presta un servicio, así que se le dice *vous*, como en la ventanilla de billetes.
  fr.a1.unit44.lesson05.teach.conseil_prends_un:
    title: Leer una nota de consejos de la farmacia
    gloss: 'Consejo: toma una pastilla dos veces al día con agua. Descansa bien y bebe mucha agua. ¿Todavía no te sientes bien después de tres días? Entonces ve al médico.'
    note: Fíjate en la dosis, en las dos recomendaciones que no son medicamentos y en cuándo ir al médico.
    glosses:
      Conseil: consejo
      prends: toma
      fois: veces
      jour: día
      comprimé: pastilla
      Repose-toi: descansa
      bois: bebe
      sens: sientes
      toujours: todavía
      bien: bien
      médecin: médico
  fr.a1.unit44.lesson06.teach.camille_salut_mathieu:
    title: Camille pregunta cómo está
    gloss: 'Camille: Hola, Mathieu, ¿qué tal? ¿Ya te sientes mejor?'
    note: '*Déjà* (ya) muestra que Camille quiere saber si Mathieu ha mejorado desde la última vez que hablaron.'
  fr.a1.unit44.lesson06.teach.mathieu_pas_encore:
    title: Mathieu sigue mal
    gloss: 'Mathieu: Todavía no muy bien. Sigo con dolor de cabeza y estoy cansado.'
    note: '*Toujours* (todavía) indica que el dolor de cabeza no se ha ido; *fatigué* (cansado) es un adjetivo nuevo y útil.'
  fr.a1.unit44.lesson06.teach.camille_tu_as:
    title: Camille pregunta por el medicamento
    gloss: 'Camille: ¿Tomaste una pastilla?'
    note: '*Pris* es el participio pasado de *prendre*, y se usa con *as* de *avoir*: *tu as pris*.'
  fr.a1.unit44.lesson06.teach.mathieu_oui_j:
    title: Mathieu lo confirma
    gloss: 'Mathieu: Sí, tomé una pastilla. Ahora voy a descansar.'
    note: '*Je vais me reposer* (voy a descansar) usa *aller* + infinitivo para el futuro próximo.'
  fr.a1.unit44.lesson06.teach.camille_bonne_idee:
    title: Camille le desea que se mejore
    gloss: 'Camille: Buena idea. Descansa bien. ¡Que te mejores pronto!'
    note: '*Bon rétablissement !* es la expresión fija habitual para desear a alguien una pronta recuperación.'
  fr.a1.unit44.lesson06.teach.mathieu_merci_a:
    title: Mathieu se despide
    gloss: 'Mathieu: Gracias, ¡hasta mañana!'
    note: '*À demain !* usa *à* + un momento para las despedidas: *à demain*, *à bientôt*.'
