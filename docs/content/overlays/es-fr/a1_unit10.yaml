answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francés A1
  description: Describir una rutina diaria sencilla con verbos reflexivos (se réveiller, se lever, se coucher) y palabras de secuencia (d'abord, ensuite), con la continuación de la historia del taller de cocina de Inès y Mathieu mientras Inès pregunta por el sábado de Mathieu. Igual que en español (me levanto, te acuestas), los verbos reflexivos franceses necesitan un pronombre reflexivo (je ME réveille); lo que cambia son las formas del pronombre y el hecho de que en francés nunca se omite.
