teaching:
  fr.a1.unit10.lesson01.teach.se_reveiller:
    title: Despertarse
    gloss: despertarse
    note: 'Verbo reflexivo: *je me réveille*, *tu te réveilles*. El pronombre *me/te/se* siempre concuerda con el sujeto.'
    example_gloss: Me despierto a las siete.
  fr.a1.unit10.lesson01.teach.se_lever:
    title: Levantarse
    gloss: levantarse
    note: 'Es distinto de *se réveiller* (despertarse): *se lever* es el acto físico de salir de la cama.'
    example_gloss: Me levanto justo después.
  fr.a1.unit10.lesson01.teach.prendre_une_douche:
    title: Ducharse
    gloss: ducharse
    note: '*Prendre une douche* (literalmente "tomar una ducha") usa *prendre*, el mismo verbo que se emplea para las comidas y los transportes.'
    example_gloss: Me ducho por la mañana.
  fr.a1.unit10.lesson01.teach.shabiller:
    title: Vestirse
    gloss: vestirse
    note: 'Otro verbo reflexivo: *je m''habille*, con *m''* elidido ante vocal.'
    example_gloss: Me visto antes del desayuno.
  fr.a1.unit10.lesson01.teach.le_petit_dejeuner:
    title: El desayuno
    gloss: el desayuno
    note: '*Prendre le petit-déjeuner* (desayunar) reutiliza el mismo patrón con *prendre* que *prendre une douche*.'
    example_gloss: Desayuno a las ocho.
  fr.a1.unit10.lesson01.teach.quitter_la_maison:
    title: Salir de casa
    gloss: salir de casa
    note: '*Quitter* significa aquí "dejar (un lugar)"; no lo confundas con *partir*, que no lleva complemento directo.'
    example_gloss: Salgo de casa a las nueve.
  fr.a1.unit10.lesson01.teach.dabord_ensuite:
    title: Primero... luego...
    gloss: Primero me levanto, luego me visto.
    note: '*D''abord* (primero) y *ensuite* (luego) son las palabras básicas de secuencia para describir una rutina paso a paso.'
  fr.a1.unit10.lesson02.teach.rentrer:
    title: Volver a casa
    gloss: volver a casa
    note: '*Rentrer* implica volver a la propia casa, a diferencia del más general *retourner* (volver a un lugar).'
    example_gloss: Vuelvo a casa después del trabajo.
  fr.a1.unit10.lesson02.teach.diner:
    title: Cenar
    gloss: cenar
    note: '*Dîner* puede ser un verbo (cenar) o un sustantivo (*le dîner*, la cena); el contexto los distingue.'
    example_gloss: Cenamos juntos los sábados por la noche.
  fr.a1.unit10.lesson02.teach.se_coucher:
    title: Acostarse
    gloss: acostarse
    note: El final natural de la secuencia de la rutina diaria, que se empareja con *se lever* al principio.
    example_gloss: Me acuesto hacia las once de la noche.
  fr.a1.unit10.lesson02.teach.le_weekend:
    title: El fin de semana
    gloss: el fin de semana
    note: '*Le week-end* es un préstamo del inglés muy extendido en francés y se escribe con guion.'
    example_gloss: El taller se celebra el fin de semana.
  fr.a1.unit10.lesson02.teach.dhabitude:
    title: Normalmente
    gloss: normalmente
    note: '*D''habitude* introduce una rutina habitual, a diferencia de *aujourd''hui* (hoy), que se refiere a algo puntual.'
    example_gloss: Normalmente me levanto a las siete.
  fr.a1.unit10.lesson02.teach.ma_routine_du_samedi:
    title: Describir un sábado
    gloss: Los sábados me levanto tarde y luego voy al mercado antes del taller.
    note: Combina una secuencia como la de *d'abord/ensuite* (aquí con *puis*, "luego") para describir un sábado.
  fr.a1.unit10.lesson02.teach.quest_ce_que_tu_fais:
    title: ¿Qué haces?
    gloss: ¿Qué haces los sábados?
    note: '*Qu''est-ce que tu fais... ?* es la forma informal habitual de preguntar qué hace alguien.'
  fr.a1.unit10.lesson03.teach.line01:
    title: Preguntar por el sábado
    gloss: Inès le pregunta a Mathieu qué hace los sábados antes del taller.
    note: '*Tu fais quoi... ?* es la forma informal natural de preguntar "¿qué haces...?", más coloquial que *Qu''est-ce que tu fais ?*'
  fr.a1.unit10.lesson03.teach.line02:
    title: Describir el despertar
    gloss: Mathieu dice que primero se despierta tarde, hacia las nueve.
    note: '*Vers neuf heures* (hacia las nueve) reutiliza el patrón *vers* + hora para una hora aproximada.'
  fr.a1.unit10.lesson03.teach.line03:
    title: Preguntar qué sigue
    gloss: Inès pregunta qué pasa después.
    note: Una pregunta corta y natural para que la descripción de la rutina continúe.
  fr.a1.unit10.lesson03.teach.line04:
    title: Describir el desayuno y el mercado
    gloss: Mathieu dice que luego desayuna y va al mercado.
    note: Dos acciones unidas con *et*, que continúan la secuencia iniciada con *d'abord*.
  fr.a1.unit10.lesson03.teach.line05:
    title: Preguntar por la vuelta a casa
    gloss: Inès pregunta a qué hora vuelve Mathieu.
    note: '*Tu rentres à quelle heure ?* reutiliza el verbo *rentrer* de esta unidad en una pregunta directa.'
  fr.a1.unit10.lesson03.teach.line06:
    title: Describir la tarde
    gloss: Mathieu dice que vuelve hacia el mediodía y que por la tarde descansa antes del taller de la noche.
    note: '*Se reposer* (descansar) es otro verbo reflexivo: *je me repose*.'
