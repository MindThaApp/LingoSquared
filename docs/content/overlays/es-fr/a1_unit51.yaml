teaching:
  fr.a1.unit51.lesson01.teach.combien_ca_coute:
    title: Preguntar el precio total
    gloss: ¿Cuánto cuesta en total?
    note: '*En tout* (en total) deja claro que quieres el precio completo y no el de un solo artículo.'
  fr.a1.unit51.lesson01.teach.ca_coute_vingt:
    title: Decir el precio total
    gloss: Cuesta veinticinco euros en total.
    note: '*Ça coûte* usa *ça* (esto) con *coûte*, la forma de *coûter* (costar) para una sola cosa.'
  fr.a1.unit51.lesson02.teach.payer_par_carte:
    title: Pagar con tarjeta o en efectivo
    gloss: pagar con tarjeta, pagar en efectivo
    note: '*Payer par carte* es la forma habitual de decir que pagas con tarjeta, y *payer en espèces* significa pagar en efectivo. Se usa *par* con *carte* y *en* con *espèces*.'
    example_gloss:
    - ¿Puedo pagar con tarjeta aquí?
    - Pago en efectivo.
  fr.a1.unit51.lesson02.teach.je_peux_payer:
    title: Preguntar si se puede pagar con tarjeta
    gloss: ¿Puedo pagar con tarjeta aquí?
    note: '*Ici* (aquí) sitúa la pregunta en el mostrador donde estás.'
  fr.a1.unit51.lesson02.teach.vous_voulez_payer:
    title: Preguntar la forma de pago preferida
    gloss: ¿Quiere pagar en efectivo o con tarjeta?
    note: '*Vous voulez ... ?* es la forma formal de preguntar, la que usa un cajero que no conoces; entre amigos se diría *tu veux ... ?*.'
  fr.a1.unit51.lesson03.teach.l_addition:
    title: La cuenta
    gloss: la cuenta
    note: '*Addition* es femenino: *l''addition*. *La* se reduce a *l''* ante vocal.'
    example_gloss: ¿Dividimos la cuenta?
  fr.a1.unit51.lesson03.teach.on_partage_l:
    title: Proponer dividir la cuenta
    gloss: ¿Dividimos la cuenta?
    note: '*On ... ?* propone hacer algo juntos, como en *On partage ?*. *Partager* (compartir, dividir) funciona con *l''addition*.'
  fr.a1.unit51.lesson03.teach.je_peux_payer:
    title: Pedir pagar por separado
    gloss: ¿Puedo pagar por separado?
    note: '*Séparément* (por separado) va justo después de *payer*; es la forma educada de pedir pagar solo tu parte de la cuenta.'
  fr.a1.unit51.lesson04.teach.la_monnaie:
    title: El cambio
    gloss: el cambio
    note: '*Monnaie* es femenino: *la monnaie*. Son las monedas y billetes que te devuelven.'
    example_gloss: Aquí tiene su cambio.
  fr.a1.unit51.lesson04.teach.voici_votre_monnaie:
    title: Entregar el cambio
    gloss: Aquí tiene su cambio.
    note: '*Votre* es el posesivo formal «su», acorde con el trato de *vous* en un mostrador.'
  fr.a1.unit51.lesson04.teach.je_n_ai:
    title: Rechazar el cambio
    gloss: No necesito el cambio.
    note: '*Avoir besoin de* (necesitar) va seguido de un sustantivo: *Je n''ai pas besoin de monnaie.* Después de *ne ... pas*, *de* sustituye a *de la*.'
  fr.a1.unit51.lesson05.teach.trente_cinq:
    title: Thirty-five
    gloss: treinta y cinco
    note: '*Trente-cinq* se escribe con guion, sin «et», y pone primero las decenas: treinta + cinco.'
    example_gloss: Cuesta treinta y cinco euros.
  fr.a1.unit51.lesson05.teach.addition_deux_plats:
    title: Lee la cuenta de un restaurante
    gloss: 'Cuenta: dos platos principales y dos cafés. Total: treinta y cinco euros. Pagado con tarjeta.'
    note: Fíjate en lo que se pidió, en el total y en cómo se pagó.
    glosses:
      Addition: cuenta
      deux: dos
      plats: platos principales
      cafés: cafés
      Total: total
      trente-cinq: treinta y cinco
      euros: euros
      Payé: pagado
      carte: tarjeta
  fr.a1.unit51.lesson06.teach.camille_on_demande:
    title: Camille pide la cuenta
    gloss: 'Camille: ¿Pedimos la cuenta?'
    note: '*Demander* (pedir) lleva *l''addition* como complemento directo, sin ninguna palabra más.'
  fr.a1.unit51.lesson06.teach.mathieu_oui_bonne:
    title: Mathieu pregunta el total
    gloss: 'Mathieu: Sí, buena idea. ¿Cuánto cuesta en total?'
    note: Reutiliza la pregunta *Combien ça coûte en tout ?* de la lección 1.
  fr.a1.unit51.lesson06.teach.camille_ca_fait:
    title: Camille dice el total
    gloss: 'Camille: Son treinta y cinco euros. ¿Dividimos?'
    note: '*Ça fait* + una cantidad indica el total, y *partager* se refiere a la cuenta.'
  fr.a1.unit51.lesson06.teach.mathieu_non_laisse:
    title: Mathieu insiste en pagar
    gloss: 'Mathieu: No, déjame pagar hoy. Me has ayudado muchísimo.'
    note: '*Laisse-moi* + infinitivo ofrece hacer algo, y *aidé* es el participio de *aider* (ayudar).'
  fr.a1.unit51.lesson06.teach.camille_c_est:
    title: Camille está conmovida
    gloss: 'Camille: ¡Qué amable de tu parte! Gracias.'
    note: '*C''est gentil de ta part* («qué amable de tu parte») es un cumplido cálido y habitual por un gesto generoso.'
  fr.a1.unit51.lesson06.teach.mathieu_je_peux:
    title: Mathieu pregunta si puede pagar con tarjeta
    gloss: 'Mathieu: ¿Puedo pagar con tarjeta aquí?'
    note: Reutiliza *Je peux payer par carte ici ?* de la lección 2, ahora en el restaurante de verdad.
  fr.a1.unit51.lesson06.teach.mathieu_paie_l:
    title: 'Paie: la forma de él y ella'
    gloss: Mathieu paga la cuenta.
    note: '*Paie* es la forma de *il/elle* de *payer* (pagar): *je paie, tu paies, il paie*.'
