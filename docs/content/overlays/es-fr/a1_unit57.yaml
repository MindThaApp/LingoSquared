    title: Au revoir frente a À + un día
    gloss: 'Ya conoces *Au revoir !* También puedes nombrar un día: *À samedi !*, *À demain !*'
    note: Amplía la fórmula de despedida de la unidad de saludos a un día concreto.
  fr.a1.unit57.lesson05.teach.camille_appelle_mathieu:
    title: ¿Quién usa qué?
    gloss: Camille llama a Mathieu todos los días. Usa su teléfono, no una aplicación. Mathieu no tiene ordenador en casa, pero usa internet en el teléfono. Thomas consulta la previsión del tiempo cada mañana. Luego se va a correr. Léa envía a menudo un mensaje a Camille. ¿Tú también usas el teléfono todos los días?
    note: Compara los hábitos tecnológicos de los cuatro personajes, con la misma forma que la lectura comparativa de la unidad de deportes.
