  fr.a1.unit57.lesson03.teach.chercher_est_un:
    title: Chercher es un verbo regular en -er
    gloss: '*Chercher* es un verbo regular en *-er*, igual que *utiliser*: *je cherche, tu cherches*; *j''utilise, tu utilises*.'
    note: 'Como los verbos de rutina, *chercher* lleva su complemento justo detrás: *Je cherche la météo.*'
  fr.a1.unit57.lesson03.teach.thomas_cherche_la:
