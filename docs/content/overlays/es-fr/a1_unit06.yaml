course:
  title: Francés A1
  description: Partes del día y cómo decir la hora (heure(s), et quart, et demie, moins le quart), continuando la historia de Inès y Mathieu del taller de cocina al organizar su próxima sesión. Las explicaciones destacan que el francés usa el formato de 24 horas en contextos formales y de horarios (dix-huit heures trente) junto con las formas informales de 12 horas vistas antes en la unidad.
units:
  fr.a1.unit06.time:
    title: ¿Qué hora es?
