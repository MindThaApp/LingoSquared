  fr.a1.unit06.lesson03.dialogue_prochain_atelier:
    title: El próximo taller
teaching:
  fr.a1.unit06.lesson01.teach.heure:
    title: La hora
    gloss: la hora
    note: '*Heure* es femenino; también es la unidad que se usa para decir la hora del reloj (*dix heures* = las diez).'
    example_gloss: ¿Qué hora es?
  fr.a1.unit06.lesson01.teach.matin:
    title: La mañana
    gloss: la mañana
    note: '*Matin* es masculino.'
    example_gloss: El mercado está abierto por la mañana.
  fr.a1.unit06.lesson01.teach.apres_midi:
    title: La tarde
    gloss: la tarde
    note: '*Après-midi* puede ser masculino o femenino (el masculino es más habitual); *l''* se elide ante su sonido vocálico.'
    example_gloss: Trabajo por la tarde.
  fr.a1.unit06.lesson01.teach.soir:
    title: La noche
    gloss: la noche
    note: '*Soir* es masculino.'
    example_gloss: El taller de cocina es por la noche.
  fr.a1.unit06.lesson01.teach.midi:
    title: Mediodía
    gloss: mediodía
    note: '*Midi* no lleva artículo cuando es una referencia horaria (*à midi*, no *au midi*).'
    example_gloss: Comemos a mediodía.
  fr.a1.unit06.lesson01.teach.minuit:
    title: Medianoche
    gloss: medianoche
    note: '*Minuit* sigue el mismo patrón sin artículo que *midi*.'
    example_gloss: El taller nunca termina después de medianoche.
  fr.a1.unit06.lesson01.teach.latelier_commence_le_soir:
    title: Decir cuándo es el taller
    gloss: El taller empieza por la noche, no por la mañana.
    note: Contrasta directamente *le soir* y *le matin*, reutilizando los dos sustantivos del vocabulario de esta lección.
  fr.a1.unit06.lesson02.teach.quelle_heure_est_il:
    title: Preguntar la hora
    gloss: ¿Qué hora es?
    note: '*Quelle heure est-il ?* es la forma estándar y general de preguntar la hora; *-il* se invierte con el verbo como marca de pregunta.'
  fr.a1.unit06.lesson02.teach.il_est_dix_heures:
    title: Decir la hora en punto
    gloss: Son las diez.
    note: '*Il est* + número + *heures* es el patrón básico para decir cualquier hora; *heures* queda en plural salvo en *une heure* (la una).'
  fr.a1.unit06.lesson02.teach.et_quart:
    title: Decir la hora y cuarto
    gloss: Son las diez y cuarto.
    note: '*Et quart* (y cuarto) suma quince minutos a la hora indicada.'
  fr.a1.unit06.lesson02.teach.et_demie:
    title: Decir la hora y media
    gloss: Son las diez y media.
    note: '*Et demie* (y media) suma treinta minutos; *demie* lleva la -e femenina para concordar con *heure*.'
  fr.a1.unit06.lesson02.teach.moins_le_quart:
    title: Decir menos cuarto
    gloss: Son las once menos cuarto.
    note: '*Moins le quart* (menos cuarto) cuenta hacia atrás desde la hora SIGUIENTE, no desde la actual, igual que en español «las once menos cuarto».'
  fr.a1.unit06.lesson02.teach.a_quelle_heure:
    title: Preguntar a qué hora empieza algo
    gloss: ¿A qué hora empieza el taller?
    note: '*À quelle heure ?* (¿a qué hora?) se usa para preguntar por un evento programado, distinto del general *Quelle heure est-il ?*.'
  fr.a1.unit06.lesson03.teach.line01:
    title: Preguntar la hora de inicio de la semana que viene
    gloss: Inès pregunta a qué hora es el taller de la semana que viene.
    note: '*La semaine prochaine* (la semana que viene) se combina con el patrón de pregunta *à quelle heure* de esta lección.'
  fr.a1.unit06.lesson03.teach.line02:
    title: Decir la hora de inicio
    gloss: Mathieu dice que empieza a las dieciocho treinta (18:30), según cree.
    note: '*Dix-huit heures trente* usa el formato de 24 horas, habitual en los horarios franceses, distinto de las formas informales con *et demie*.'
  fr.a1.unit06.lesson03.teach.line03:
    title: Confirmar que es por la noche
    gloss: 'Inès comprueba: ¿por la noche, no por la mañana?'
    note: Una pregunta breve de confirmación que contrasta *le soir* y *le matin*.
  fr.a1.unit06.lesson03.teach.line04:
    title: Confirmar y explicar por qué
    gloss: Mathieu confirma que es por la noche, que es más cómodo después del trabajo.
    note: '*Après le travail* (después del trabajo) da una razón sencilla y práctica.'
  fr.a1.unit06.lesson03.teach.line05:
    title: Preguntar la hora de fin
    gloss: Inès pregunta a qué hora termina.
    note: '*Finit* (termina) contrasta directamente con *commence* (empieza), visto en la línea anterior.'
  fr.a1.unit06.lesson03.teach.line06:
    title: Decir la hora de fin
    gloss: Mathieu dice que hacia las veinte quince (20:15), como siempre.
    note: '*Vers* (hacia, alrededor de) indica una hora aproximada, más suave que un *à* preciso.'
  fr.a1.unit06.lesson03.teach.line07:
    title: Confirmar el plan
    gloss: 'Inès confirma: ¡hasta la semana que viene a las dieciocho treinta!'
    note: Cierra el intercambio repitiendo la hora confirmada, una forma natural de confirmar un plan en francés.
