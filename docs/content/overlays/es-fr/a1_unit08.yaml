course:
  title: Francés A1
  description: Días de la semana y fechas del calendario (le + número cardinal + mes, con le premier como única excepción ordinal), continuando la historia de Inès y Mathieu del taller de cocina al planear su última sesión. Las explicaciones destacan que las fechas francesas usan números cardinales (le quinze mars) salvo el primero del mes, y que, a diferencia del español, no llevan la preposición «de» entre el día y el mes.
