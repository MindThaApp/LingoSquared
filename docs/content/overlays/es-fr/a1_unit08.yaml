  fr.a1.unit08.lesson03.dialogue_derniere_seance:
    title: La última sesión del taller
teaching:
  fr.a1.unit08.lesson01.teach.lundi:
    title: Lunes
    gloss: Lunes
    note: Los días de la semana son masculinos y NO se escriben con mayúscula en francés, igual que en español.
    example_gloss: El taller nunca se reúne los lunes.
  fr.a1.unit08.lesson01.teach.samedi:
    title: Sábado
    gloss: Sábado
    note: '*Le samedi* (con artículo) significa «los sábados» de forma habitual; *samedi* solo significa un sábado concreto: el más cercano, próximo o recién pasado según el tiempo verbal.'
    example_gloss: El taller se reúne los sábados.
  fr.a1.unit08.lesson01.teach.dimanche:
    title: Domingo
    gloss: Domingo
    note: 'El mismo patrón que los demás días: masculino y sin mayúscula.'
    example_gloss: La panadería está cerrada los domingos.
  fr.a1.unit08.lesson01.teach.aujourdhui:
    title: Hoy
    gloss: hoy
    note: '*Aujourd''hui* es una sola palabra fija, aunque históricamente se componga de varias partes.'
    example_gloss: Hoy es sábado.
  fr.a1.unit08.lesson01.teach.demain:
    title: Mañana
    gloss: mañana
    note: '*Demain* es invariable y se usa igual en cualquier contexto.'
    example_gloss: La farmacia abre mañana.
  fr.a1.unit08.lesson01.teach.hier:
    title: Ayer
    gloss: ayer
    note: '*Hier* es lo contrario directo de *demain*.'
    example_gloss: Ayer comí pescado.
  fr.a1.unit08.lesson01.teach.quel_jour_sommes_nous:
    title: Preguntar el día
    gloss: ¿Qué día es hoy?
    note: '*Quel jour sommes-nous ?* (literalmente «¿qué día somos?») es la forma estándar de preguntar qué día de la semana es.'
  fr.a1.unit08.lesson02.teach.mars:
    title: Marzo
    gloss: Marzo
    note: Los meses, como los días, son masculinos y no se escriben con mayúscula en francés, igual que en español.
    example_gloss: El taller termina en marzo.
  fr.a1.unit08.lesson02.teach.quelle_est_la_date:
    title: Preguntar la fecha
    gloss: ¿Qué fecha es hoy?
    note: '*Quelle est la date... ?* es la forma estándar de preguntar la fecha completa, a diferencia de *Quel jour sommes-nous ?*, que solo pregunta el día de la semana.'
  fr.a1.unit08.lesson02.teach.cest_le_quinze_mars:
    title: Decir una fecha
    gloss: Es el quince de marzo.
    note: '*Le* + número cardinal + mes es el patrón francés habitual para las fechas: *quinze* (quince), como en español, y sin la preposición «de» entre el día y el mes.'
  fr.a1.unit08.lesson02.teach.nous_sommes_le:
    title: Decir la fecha de hoy
    gloss: Hoy es quince de marzo.
    note: '*Nous sommes le...* es una alternativa igual de habitual a *C''est le...* para decir la fecha de hoy.'
  fr.a1.unit08.lesson02.teach.le_premier:
    title: El primero (del mes)
    gloss: el primero
    note: '*Le premier* es la ÚNICA excepción a la regla del número cardinal: todos los demás días del mes usan un cardinal sencillo (*le deux*, *le trois*...), pero el primero usa el ordinal *premier*, algo que también ocurre en español con «el primero».'
  fr.a1.unit08.lesson02.teach.le_vingt_deux:
    title: Decir una fecha de fin
    gloss: El taller termina el veintidós de marzo.
    note: '*Se termine* (termina) es un verbo reflexivo; *vingt-deux* es un cardinal sencillo, según la misma regla que *le quinze mars*.'
  fr.a1.unit08.lesson03.teach.line01:
    title: Preguntar cuándo es la última sesión
    gloss: Inès pregunta cuándo es la última sesión del taller.
    note: '*C''est quand... ?* (¿cuándo es?) es una forma natural y sencilla de preguntar por el momento de algo.'
  fr.a1.unit08.lesson03.teach.line02:
    title: Decir la fecha y el día
    gloss: Mathieu dice que el veintidós de marzo, cree; un sábado.
    note: '*Un samedi* (un sábado, sin *le*) simplemente indica en qué día de la semana cae esa fecha.'
  fr.a1.unit08.lesson03.teach.line03:
    title: Preguntar la fecha de hoy
    gloss: Inès pregunta qué fecha es hoy.
    note: La misma *Quelle est la date aujourd'hui ?* que aprendiste para preguntar la fecha.
  fr.a1.unit08.lesson03.teach.line04:
    title: Decir la fecha de hoy y cuánto falta
    gloss: Mathieu dice que hoy es quince de marzo, así que falta una semana.
    note: '*Dans une semaine* (dentro de una semana) expresa una distancia en el tiempo desde hoy.'
  fr.a1.unit08.lesson03.teach.line05:
    title: Reaccionar con un plan
    gloss: Inès dice que perfecto, que tiene tiempo para preparar un postre para la ocasión.
    note: '*J''ai le temps de* + infinitivo (tengo tiempo de) es una forma habitual de decir que hay tiempo suficiente para algo.'
  fr.a1.unit08.lesson03.teach.line06:
    title: Confirmar el plan
    gloss: Mathieu dice que buena idea, que entonces se ven el sábado que viene, el veintidós.
    note: '*Samedi prochain* (el sábado que viene) confirma a la vez el nombre del día y la fecha, y cierra el intercambio.'
