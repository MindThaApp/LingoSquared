  fr.a1.unit12.lesson03.dialogue_atelier_dernier:
    title: El taller del sábado pasado
teaching:
  fr.a1.unit12.lesson01.teach.jai_prepare:
    title: Preparé
    gloss: preparé / hice
    note: 'Los verbos regulares en -ER forman el participio del passé composé en *-é*: *préparer* → *préparé*, con *avoir*.'
    example_gloss: Hice un pastel para el taller.
  fr.a1.unit12.lesson01.teach.jai_achete:
    title: Compré
    gloss: Compré
    note: '*Acheter* sigue el mismo patrón *avoir* + *-é* que *préparer*.'
    example_gloss: Compré verduras en el mercado.
  fr.a1.unit12.lesson01.teach.jai_oublie:
    title: Olvidé
    gloss: Olvidé
    note: '*Oublier* → *oublié*, de nuevo el mismo patrón regular.'
    example_gloss: ¡Olvidé la mantequilla en casa!
  fr.a1.unit12.lesson01.teach.tu_as_aime:
    title: Te gustó
    gloss: te gustó
    note: '*Tu as* + participio es la forma de *tu* de la misma construcción con *avoir*.'
    example_gloss: ¿Te gustó el pastel?
  fr.a1.unit12.lesson01.teach.il_a_goute:
    title: Probó
    gloss: probó
    note: '*Il a* + participio es la forma de *il*: el auxiliar *avoir* cambia con el sujeto y el participio se queda igual.'
    example_gloss: Mathieu probó la salsa.
  fr.a1.unit12.lesson01.teach.grammar_avoir_participe:
    title: Avoir + participio pasado
    gloss: avoir + participio pasado (-é)
    note: La mayoría de los verbos franceses forman el passé composé con *avoir* como auxiliar, más un participio pasado que termina en *-é* en los verbos regulares en -ER.
  fr.a1.unit12.lesson01.teach.la_semaine_derniere:
    title: La semana pasada
    gloss: la semana pasada
    note: '*Dernière* (pasada) concuerda con el femenino *semaine*; la forma masculina es *dernier*, como en *samedi dernier* (el sábado pasado).'
    example_gloss: La semana pasada hice un pastel.
  fr.a1.unit12.lesson02.teach.je_suis_arrive:
    title: Llegué
    gloss: Llegué
    note: '*Arriver* es uno de los pocos verbos (sobre todo de movimiento) que usan *être* en lugar de *avoir* como auxiliar.'
    example_gloss: Llegué tarde al taller.
  fr.a1.unit12.lesson02.teach.je_suis_alle:
    title: Fui
    gloss: Fui
    note: '*Aller* también lleva *être*. El participio concuerda con el sujeto: *allé* (masculino) o *allée* (femenino, como diría Inès).'
    example_gloss: Fui al mercado antes del taller.
  fr.a1.unit12.lesson02.teach.il_est_reste:
    title: Se quedó
    gloss: se quedó
    note: '*Rester* (quedarse) es otro verbo con auxiliar *être*, con el mismo patrón de concordancia.'
    example_gloss: Mathieu se quedó para limpiar la cocina.
  fr.a1.unit12.lesson02.teach.grammar_etre_accord:
    title: Concordancia de être + participio pasado
    gloss: être + participio pasado (concuerda con el sujeto)
    note: En los verbos con auxiliar *être*, el participio pasado concuerda en género y número con el sujeto, a diferencia de los verbos con auxiliar *avoir*.
  fr.a1.unit12.lesson02.teach.en_retard:
    title: Tarde
    gloss: tarde
    note: '*En retard* describe llegar después de la hora prevista; es un compañero habitual de *arriver*.'
    example_gloss: El autobús llegó tarde.
  fr.a1.unit12.lesson02.teach.finalement:
    title: Finalmente / al final
    gloss: finalmente / al final
    note: '*Finalement* cierra una historia corta y señala el desenlace tras las complicaciones anteriores.'
    example_gloss: Al final, el pastel estaba delicioso.
  fr.a1.unit12.lesson02.teach.quest_ce_qui_sest_passe:
    title: ¿Qué pasó?
    gloss: ¿Qué pasó?
    note: '*Qu''est-ce qui s''est passé ?* es la forma habitual de preguntar qué ha pasado.'
    example_gloss: ¿Qué pasó en el taller?
  fr.a1.unit12.lesson03.teach.line01:
    title: Preguntar qué pasó
    gloss: Inès pregunta qué pasó en el taller del sábado pasado; ella no pudo ir.
    note: '*Qu''est-ce qui s''est passé ?* (¿qué pasó?) es la forma habitual de preguntar por un hecho pasado.'
  fr.a1.unit12.lesson03.teach.line02:
    title: Contar el percance
    gloss: 'Mathieu dice: ¡ay, ay, ay!, que llegó tarde y que olvidó la mantequilla en casa.'
    note: 'Dos formas del passé composé en una misma frase: con *être* (*je suis arrivé*) y con *avoir* (*j''ai oublié*).'
  fr.a1.unit12.lesson03.teach.line03:
    title: Preguntar qué hizo
    gloss: Inès pregunta qué hizo después.
    note: '*Qu''est-ce que tu as fait ?* (¿qué hiciste?) usa el passé composé irregular de *faire*.'
  fr.a1.unit12.lesson03.teach.line04:
    title: Describir la solución
    gloss: Mathieu dice que fue rápidamente a la tienda de comestibles de la esquina.
    note: '*L''épicerie du coin* (la tienda de comestibles de la esquina) usa *coin* como en *au coin de la rue*.'
  fr.a1.unit12.lesson03.teach.line05:
    title: Preguntar si funcionó
    gloss: Inès pregunta si encontró mantequilla allí.
    note: '*Tu as trouvé... ?* (¿encontraste... ?) es otra pregunta regular con auxiliar *avoir*.'
  fr.a1.unit12.lesson03.teach.line06:
    title: Dar el final feliz
    gloss: Mathieu dice que sí, y que al final el pastel estaba delicioso.
    note: Cierra la historia en positivo con *finalement*, resolviendo el percance anterior.
