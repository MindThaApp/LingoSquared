answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francés A1
  description: 'Contar brevemente un hecho reciente ya terminado con el passé composé, tanto con el auxiliar avoir como con être, con la continuación de la historia del taller de cocina de Inès y Mathieu mientras Mathieu cuenta un percance de la sesión del sábado pasado. En francés hay dos auxiliares: avoir para la mayoría de los verbos y être para un grupo reducido (aller, arriver, rester, entre otros), mientras que el pretérito perfecto español usa siempre haber; además, los participios con être concuerdan en género con el sujeto (arrivé/arrivée).'
units:
  fr.a1.unit12.past_events:
    title: ¿Qué pasó?
lessons:
  fr.a1.unit12.lesson01.passe_compose_avoir:
    title: El passé composé con avoir
  fr.a1.unit12.lesson02.passe_compose_etre:
