answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francés A1
  description: Vocabulario básico de comida y bebida y una conversación para pedir en un café, continuando la historia de Inès y Mathieu del taller de cocina con una comida juntos después de la clase. Las explicaciones destacan los artículos partitivos du/de la/de l' que se usan con los alimentos no contables, algo que el español no tiene.
units:
  fr.a1.unit05.food:
    title: Una comida después del taller
