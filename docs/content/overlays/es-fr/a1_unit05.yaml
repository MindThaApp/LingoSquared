  fr.a1.unit05.lesson01.a_table:
    title: A la mesa
  fr.a1.unit05.lesson02.au_cafe:
    title: En el café
  fr.a1.unit05.lesson03.dialogue_cafe:
    title: En el café después del taller
teaching:
  fr.a1.unit05.lesson01.teach.poulet:
    title: Pollo
    gloss: pollo
    note: '*Poulet* es masculino.'
    example_gloss: Quisiera un poco de pollo.
  fr.a1.unit05.lesson01.teach.poisson:
    title: Pescado
    gloss: pescado
    note: '*Poisson* es masculino.'
    example_gloss: El pescado está fresco hoy.
  fr.a1.unit05.lesson01.teach.salade:
    title: Ensalada
    gloss: ensalada
    note: '*Salade* es femenino.'
    example_gloss: Ella está comiendo una ensalada.
  fr.a1.unit05.lesson01.teach.riz:
    title: Arroz
    gloss: arroz
    note: '*Riz* es masculino e invariable (se escribe igual en singular y en plural, como *prix*).'
    example_gloss: El arroz acompaña bien al pollo.
  fr.a1.unit05.lesson01.teach.eau:
    title: Agua
    gloss: agua
    note: '*Eau* es femenino; *l''* se elide ante su sonido vocálico, el mismo patrón que *l''addition* más adelante en esta unidad.'
    example_gloss: Quisiera un poco de agua, por favor.
  fr.a1.unit05.lesson01.teach.vin:
    title: Vino
    gloss: vino
    note: '*Vin* es masculino.'
    example_gloss: El vino tinto es delicioso.
  fr.a1.unit05.lesson01.teach.je_voudrais_poulet_salade:
    title: Pedir pollo y ensalada
    gloss: Quisiera pollo y ensalada.
    note: '*Du poulet* (masculino) y *de la salade* (femenino) son artículos partitivos («algo de») que concuerdan con el género del sustantivo, a diferencia de lo que ocurre tras una cantidad (*un kilo de*), donde solo se usa *de*.'
  fr.a1.unit05.lesson02.teach.dessert:
    title: Dessert
    gloss: postre
    note: '*Dessert* es masculino.'
    example_gloss: El postre es gratis hoy.
  fr.a1.unit05.lesson02.teach.addition:
    title: La cuenta
    gloss: la cuenta
    note: '*Addition* es femenino; *l''* se elide ante su sonido vocálico. Es el término estándar en un restaurante francés, no *facture* (una factura formal).'
    example_gloss: La cuenta, por favor.
  fr.a1.unit05.lesson02.teach.vous_avez_choisi:
    title: Preguntar si ya han elegido
    gloss: ¿Ya han elegido?
    note: Es la pregunta habitual del camarero al acercarse a la mesa para tomar nota; usa el passé composé de *choisir* (elegir).
  fr.a1.unit05.lesson02.teach.je_voudrais_un_cafe:
    title: Pedir un café
    gloss: Quisiera un café, por favor.
    note: '*Je voudrais* + producto, el mismo patrón que al hacer compras, ahora con comida y bebida.'
  fr.a1.unit05.lesson02.teach.qcq_comme_dessert:
    title: Preguntar qué hay
    gloss: ¿Qué tienen de postre?
    note: '*Qu''est-ce que vous avez comme...?* es una forma natural y habitual de preguntar qué opciones hay dentro de una categoría.'
  fr.a1.unit05.lesson02.teach.cest_delicieux:
    title: Decir que algo está delicioso
    gloss: ¡Está delicioso!
    note: Una reacción entusiasta y habitual ante la comida; *délicieux* es invariable aquí porque *c'est* no va con un sustantivo con género.
  fr.a1.unit05.lesson03.teach.line01:
    title: Saludar y preguntar si ya han elegido
    gloss: El camarero los saluda y les pregunta si ya pueden pedir.
    note: Empieza con *Bonjour*, el registro cortés en un trato de servicio.
  fr.a1.unit05.lesson03.teach.line02:
    title: Pedir ensalada y agua
    gloss: Inès pide una ensalada y agua.
    note: Combina *je voudrais* con *et* para unir dos productos pedidos en una misma intervención.
  fr.a1.unit05.lesson03.teach.line03:
    title: Pedir pollo con arroz
    gloss: Mathieu pide pollo con arroz.
    note: '*Avec* (con) une el plato principal con su guarnición, una construcción sencilla y habitual al pedir.'
  fr.a1.unit05.lesson03.teach.line04:
    title: Confirmar y preguntar por las bebidas
    gloss: El camarero confirma y pregunta por las bebidas.
    note: '*Et comme boisson pour vous ?* retoma el patrón con *comme* de *Qu''est-ce que vous avez comme dessert ?*, ahora para las bebidas.'
  fr.a1.unit05.lesson03.teach.line05:
    title: Pedir una copa de vino
    gloss: Mathieu pide una copa de vino tinto.
    note: '*Un verre de* (una copa de) es la forma habitual de pedir vino por copas.'
  fr.a1.unit05.lesson03.teach.line06:
    title: Reaccionar ante la comida
    gloss: Inès dice que la ensalada está deliciosa.
    note: Retoma *C'est délicieux !*, ahora aplicado a un plato concreto (*cette salade*). *Délicieux* se queda en masculino tras *c'est* aunque *salade* sea femenino; *Elle est délicieuse, cette salade !* es la alternativa con concordancia.
  fr.a1.unit05.lesson03.teach.line07:
    title: Explicar su hambre y pedir la cuenta
    gloss: Mathieu dice que el taller les ha dado hambre y pide la cuenta.
    note: '*Nous a donné faim* (literalmente «nos dio hambre») es la forma francesa natural de decir que algo te ha dado hambre, igual que en español.'
  fr.a1.unit05.lesson03.teach.line08:
    title: Confirmar que traen la cuenta
    gloss: El camarero confirma que se la trae enseguida.
    note: '*Tout de suite* (enseguida) es una frase habitual y tranquilizadora en el servicio.'
