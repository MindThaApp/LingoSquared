teaching:
  fr.a1.unit47.lesson01.teach.le_temps:
    title: El tiempo
    gloss: el tiempo (clima)
    note: '*Le temps* significa a la vez «tiempo» atmosférico y «tiempo» cronológico, como en español; es masculino.'
    example_gloss: ¿Qué tiempo hace?
  fr.a1.unit47.lesson01.teach.quel_temps_fait:
    title: Preguntar por el tiempo
    gloss: ¿Qué tiempo hace?
    note: '*Quel temps fait-il ?* es la pregunta habitual sobre el tiempo; *quel* concuerda con el sustantivo masculino *temps*.'
  fr.a1.unit47.lesson01.teach.le_temps_est:
    title: Soleado
    gloss: Hace sol.
    note: '*Le temps est* + adjetivo es un patrón habitual; el adjetivo concuerda con el sustantivo masculino *temps*.'
  fr.a1.unit47.lesson01.teach.il_pleut:
    title: Lloviendo
    gloss: Llueve.
    note: '*Pleuvoir* (llover) se usa de forma impersonal: *il pleut*, sin necesidad de un adjetivo aparte.'
  fr.a1.unit47.lesson01.teach.le_temps_est_2:
    title: Nublado
    gloss: Está nublado.
    note: Sigue el mismo patrón *le temps est* + adjetivo que *ensoleillé*.
  fr.a1.unit47.lesson02.teach.il_fait_froid:
    title: Frío
    gloss: Hoy hace frío.
    note: '*Aujourd''hui* (hoy) sitúa el tiempo en el día presente; *il fait froid* usa *faire* (hacer), como en español, y no *être*.'
  fr.a1.unit47.lesson02.teach.il_fait_chaud:
    title: Calor
    gloss: Hoy hace calor.
    note: '*Il fait chaud* sirve para decir tanto «hace calor» como «hace mucho calor» al hablar del tiempo a diario.'
  fr.a1.unit47.lesson02.teach.il_ne_fait:
    title: Contrastar temperaturas
    gloss: No hace frío, hace calor.
    note: '*Ne ... pas* rodea al verbo: *il ne fait pas froid*.'
  fr.a1.unit47.lesson03.teach.la_meteo:
    title: El pronóstico del tiempo
    gloss: el pronóstico del tiempo
    note: '*La météo* es femenino y es la forma corta de *la météorologie*.'
    example_gloss: ¿Cuál es el pronóstico del tiempo?
  fr.a1.unit47.lesson03.teach.demain_le_temps:
    title: El tiempo de mañana
    gloss: Mañana hace sol.
    note: '*Demain* abre la frase, seguido de una coma; el resto mantiene su orden normal.'
  fr.a1.unit47.lesson03.teach.samedi_le_temps:
    title: Un pronóstico de dos días
    gloss: El sábado hace sol y calor, pero el domingo llueve todo el día.
    note: '*Toute la journée* (todo el día) refuerza cuánto dura la lluvia.'
  fr.a1.unit47.lesson04.teach.la_promenade:
    title: El paseo
    gloss: el paseo
    note: '*Promenade* es femenino: *la promenade*.'
    example_gloss: ¿Vamos a dar un paseo?
  fr.a1.unit47.lesson04.teach.on_fait_une:
    title: Proponer un paseo
    gloss: ¿Vamos a dar un paseo?
    note: '*On fait une promenade ?* es una forma amistosa de proponer un plan; *faire une promenade* es la expresión fija para «dar un paseo».'
  fr.a1.unit47.lesson04.teach.s_il_pleut:
    title: Un plan condicional
    gloss: Si llueve, nos quedamos dentro.
    note: '*S''il pleut* (si llueve): *si* + *il* se convierte en *s''il*; después *on reste à l''intérieur* dice lo que se hace.'
  fr.a1.unit47.lesson04.teach.bonne_idee_faisons:
    title: Aceptar y proponer
    gloss: ¡Buena idea! Vamos a dar un paseo.
    note: '*Faisons ...* («hagamos ...») es otra forma habitual de proponer una actividad, junto a *On ... ?*'
  fr.a1.unit47.lesson05.teach.meteo_samedi_le:
    title: Lee un pronóstico de dos días
    gloss: 'Pronóstico del tiempo: el sábado hace sol y calor. El domingo llueve todo el día.'
    note: Fíjate en qué día tiene qué condiciones.
    glosses:
      Météo: pronóstico del tiempo
      samedi: sábado
      ensoleillé: soleado
      chaud: caluroso
      Dimanche: domingo
      pleut: llueve
      toute: toda
      journée: día
  fr.a1.unit47.lesson06.teach.camille_quel_temps:
    title: Camille pregunta por el fin de semana
    gloss: 'Camille: ¿Qué tiempo hará este fin de semana?'
    note: '*Ce week-end* (este fin de semana) sitúa la pregunta en un futuro cercano.'
  fr.a1.unit47.lesson06.teach.mathieu_samedi_le:
    title: Mathieu da el pronóstico
    gloss: 'Mathieu: El sábado hace sol y calor, pero el domingo llueve todo el día.'
    note: Coincide exactamente con el pronóstico leído antes.
  fr.a1.unit47.lesson06.teach.camille_alors_on:
    title: Camille propone un plan
    gloss: 'Camille: Entonces, ¿damos un paseo el sábado?'
    note: '*Alors* (entonces) enlaza la propuesta con el buen tiempo que Mathieu acaba de describir.'
  fr.a1.unit47.lesson06.teach.mathieu_bonne_idee:
    title: Mathieu acepta y planea el domingo
    gloss: 'Mathieu: Buena idea. Y el domingo nos quedamos tranquilos dentro.'
    note: '*Tranquillement* aquí significa «a gusto, sin prisa» y hace que quedarse dentro suene agradable.'
  fr.a1.unit47.lesson06.teach.camille_parfait_alors:
    title: Camille cierra el plan
    gloss: 'Camille: Perfecto, entonces vemos una película.'
    note: '*Regarder* (ver, mirar) combina de forma natural con *un film* (una película).'
