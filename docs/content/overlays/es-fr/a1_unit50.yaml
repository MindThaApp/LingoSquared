teaching:
  fr.a1.unit50.lesson01.teach.appeler:
    title: Llamar
    gloss: llamar
    note: El infinitivo del verbo para hacer una llamada telefónica.
    example_gloss: Tengo que llamarte.
  fr.a1.unit50.lesson01.teach.je_t_appelle:
    title: Decir que vas a llamar
    gloss: Te llamo.
    note: '*Appelle* es la forma de *je* de *appeler*; el francés usa el presente para esta acción cercana, como el español coloquial («te llamo»).'
  fr.a1.unit50.lesson01.teach.allo_c_est:
    title: Contestar al teléfono
    gloss: Hola, soy Camille.
    note: '*C''est* + nombre («es ...») es la forma habitual en francés de identificarse por teléfono, mientras que en español se dice «soy ...».'
  fr.a1.unit50.lesson01.teach.allo_c_est_2:
    title: Mathieu contesta igual
    gloss: Hola, soy Mathieu.
    note: Mismo patrón *c'est* + nombre que en *Allô, c'est Camille*.
  fr.a1.unit50.lesson02.teach.qui_est_a:
    title: Preguntar quién llama
    gloss: ¿Con quién hablo?
    note: '*Qui est à l''appareil ?* es la forma habitual de preguntar quién es a alguien que llama y no conocemos.'
  fr.a1.unit50.lesson02.teach.vous_parlez_avec:
    title: Identificarse de manera formal
    gloss: Está hablando con Camille.
    note: '*Vous parlez avec* + nombre es el equivalente formal de *c''est* + nombre.'
  fr.a1.unit50.lesson03.teach.tu_peux_repeter:
    title: Pedir que repitan
    gloss: ¿Puedes repetirlo?
    note: '*Tu peux ...* («¿puedes ...?») más el infinitivo *répéter* (repetir).'
  fr.a1.unit50.lesson03.teach.ne_parle_pas:
    title: Pedir a alguien que vaya más despacio
    gloss: No hables tan rápido, por favor.
    note: '*Ne parle pas si vite* niega el verbo: *ne ... pas* rodea a *parle*, y *si* significa «tan».'
  fr.a1.unit50.lesson03.teach.je_ne_t:
    title: Decir que no oyes bien
    gloss: No te oigo bien.
    note: '*Entendre* (oír) con *ne ... pas bien* expresa un problema para oír, distinto de *comprendre* (entender).'
  fr.a1.unit50.lesson04.teach.le_sms:
    title: Mensaje de texto
    gloss: el mensaje de texto
    note: '*SMS* es masculino: *un SMS*, una sigla internacional que también usamos en español.'
    example_gloss: El mensaje es de Camille.
  fr.a1.unit50.lesson04.teach.je_t_envoie:
    title: Decir que vas a enviar un mensaje
    gloss: Te envío un mensaje.
    note: '*Envoyer* (enviar) lleva el pronombre *te* (aquí *t''*) antes del verbo, y después *un SMS*.'
  fr.a1.unit50.lesson04.teach.je_te_rappelle:
    title: Decir que volverás a llamar
    gloss: Te vuelvo a llamar más tarde.
    note: '*Rappeler* (volver a llamar) ya lleva la idea de repetición en *re-*; *plus tard* significa «más tarde».'
  fr.a1.unit50.lesson05.teach.mathieu_salut_camille:
    title: Lee una conversación por mensajes
    gloss: 'Mathieu: Hola, Camille, ¿puedes llamarme? Tengo que contarte algo. Camille: Sí, claro, te vuelvo a llamar en cinco minutos.'
    note: Fíjate en qué pide Mathieu, por qué y cuándo dice Camille que volverá a llamar.
    glosses:
      Salut: hola
      peux: puedes
      m'appeler: llamar
      dois: deber / tener que
      truc: algo
      dire: decir
      évidemment: claro
      rappelle: de vuelta
      cinq: cinco
      minutes: minutos
  fr.a1.unit50.lesson06.teach.mathieu_allo_c:
    title: Mathieu contesta la llamada
    gloss: 'Mathieu: Hola, soy Mathieu.'
    note: 'El mismo patrón *c''est* + nombre de la lección 1, ahora en una llamada real: quien descuelga habla primero y dice su nombre.'
  fr.a1.unit50.lesson06.teach.camille_salut_mathieu:
    title: Camille se identifica
    gloss: 'Camille: Hola, Mathieu, soy Camille. Mathieu: ¡Qué bien que llames!'
    note: '*C''est sympa que* ... («qué bien que ...») expresa una reacción positiva ante un hecho; *appelles* es una forma especial que aquí basta con memorizar.'
  fr.a1.unit50.lesson06.teach.camille_comment_s:
    title: Camille pregunta por el turno
    gloss: 'Camille: ¿Cómo fue tu primer turno?'
    note: '*Comment s''est passé ... ?* usa el passé composé de *se passer* (pasar, ocurrir), formado con *être*, para preguntar cómo fue algo.'
  fr.a1.unit50.lesson06.teach.mathieu_ca_s:
    title: Mathieu cuenta una buena noticia
    gloss: 'Mathieu: Salió muy bien, mejor de lo que pensaba.'
    note: '*Ça s''est très bien passé* y *je pensais* son expresiones fijas aquí; *je pensais* es el imparfait de *penser* (pensar).'
  fr.a1.unit50.lesson06.teach.au_passe_compose:
    title: Passé composé con avoir y être
    gloss: s'est passé → pasar, ocurrir; j'ai pensé → pensar; je suis allé → ir
    note: 'El passé composé usa *avoir* o *être* + un participio: *j''ai pensé*, *je suis allé*. *Ça s''est passé* es una expresión fija para «salió, fue»; por ahora basta con memorizarla en los contextos en que aparece en esta lección.'
  fr.a1.unit50.lesson06.teach.camille_ca_fait:
    title: Camille está orgullosa
    gloss: 'Camille: ¡Qué alegría oírlo! Estoy orgullosa de ti.'
    note: '*Fière de* (orgullosa de) es una combinación fija; se usa *de*, no *pour*; *fière* es femenino aquí.'
  fr.a1.unit50.lesson06.teach.mathieu_merci_beaucoup:
    title: Mathieu está conmovido
    gloss: 'Mathieu: Muchas gracias, significa mucho para mí.'
    note: '*Compter* significa aquí «importar»: *ça compte pour moi* (me importa); *pour moi* indica para quién importa.'
  fr.a1.unit50.lesson06.teach.son_premier_service:
    title: Su
    gloss: Su primer turno salió muy bien.
    note: '*Son* es aquí el posesivo «su», no un verbo: *son premier service* (su primer turno); *son* concuerda con el masculino *service*.'
