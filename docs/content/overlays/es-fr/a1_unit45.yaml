answer_policy:
  diacritics: 'Teach and display standard French accents and the cedilla. For free-typed A1 answers, accept otherwise-correct forms without diacritics, including ca for ça, tres for très, and enchante for enchanté. This leniency does not erase meaningful letters: masculine enchanté and feminine enchantée remain distinct through the final e even when accents are omitted.'
  apostrophes: Accept straight and typographic apostrophes interchangeably. Require the apostrophe when an exercise specifically tests elision, such as j’habite; do not accept jhabite in that exercise.
  hyphens: Teach the standard hyphens in inverted questions such as allez-vous and vas-tu. In free transcription exercises, accept an otherwise-correct spaced version at A1, but retain the hyphenated form as the model answer.
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of French spacing before question or exclamation marks. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
course:
  title: Francés A1
  description: 'Francés para principiantes: decir tu profesión, tu lugar de trabajo y un horario sencillo.'
units:
  fr.a1.unit45.travail:
    title: Trabajo y profesión
lessons:
  fr.a1.unit45.lesson01.tu_fais_quoi_dans:
    title: ¿A qué te dedicas?
  fr.a1.unit45.lesson02.ou_travailles_tu:
    title: ¿Dónde trabajas?
  fr.a1.unit45.lesson03.ma_journee_de_travail:
    title: Mi jornada
  fr.a1.unit45.lesson04.decrire_des_collegues:
    title: Describir a los compañeros
  fr.a1.unit45.lesson05.lire_des_profils_professionnels:
    title: Leer perfiles laborales
  fr.a1.unit45.lesson06.une_conversation_sur_le:
    title: Una conversación sobre el trabajo
teaching:
  fr.a1.unit45.lesson01.teach.tu_fais_quoi:
    title: Preguntar por el trabajo de alguien
    gloss: ¿A qué te dedicas?
    note: Una forma habitual e informal de preguntar a qué se dedica alguien.
  fr.a1.unit45.lesson01.teach.le_metier_cuisinier:
    title: Profesión / cocinero
    gloss: la profesión; cocinero
    note: '*Métier* (profesión) es masculino: *le métier*. *Cuisinier* cambia en femenino: *un cuisinier*, *une cuisinière*.'
    example_gloss:
    - ¿Cuál es tu profesión?
    - Trabajo como cocinero.
  fr.a1.unit45.lesson01.teach.je_travaille_comme:
    title: Decir que eres cocinero
    gloss: Trabajo como cocinero.
    note: '*Travailler comme* + profesión es la estructura habitual para decir qué trabajo haces, sin artículo delante del nombre de la profesión.'
  fr.a1.unit45.lesson01.teach.infirmiere:
    title: Enfermero
    gloss: enfermero
    note: El término habitual de esta profesión; se adapta según sea un hombre o una mujer.
    example_gloss: Trabajo como enfermero.
  fr.a1.unit45.lesson01.teach.je_travaille_comme_2:
    title: Decir que eres enfermero
    gloss: Trabajo como enfermero.
    note: Sigue la misma estructura *travailler comme* que con *cuisinier*; el femenino es *infirmière*.
  fr.a1.unit45.lesson02.teach.ou_travailles_tu:
    title: Preguntar por el lugar de trabajo
    gloss: ¿Dónde trabajas?
    note: Una pregunta natural para continuar después de *Tu fais quoi dans la vie ?*
  fr.a1.unit45.lesson02.teach.je_travaille_dans:
    title: Trabajar en un restaurante
    gloss: Trabajo en un restaurante.
    note: '*Un restaurant* lleva artículo indefinido aquí porque es uno entre muchos restaurantes.'
  fr.a1.unit45.lesson02.teach.l_hopital:
    title: El hospital
    gloss: el hospital
    note: '*Hôpital* es masculino y empieza con sonido vocálico: *l''hôpital*.'
    example_gloss: Trabajo en el hospital.
  fr.a1.unit45.lesson02.teach.je_travaille_a:
    title: Trabajar en el hospital
    gloss: Trabajo en el hospital.
    note: '*À l''hôpital* lleva artículo definido porque es un lugar concreto y conocido; *le* se convierte en *l''* ante sonido vocálico.'
  fr.a1.unit45.lesson02.teach.certaines_personnes_travaillent:
    title: Trabajar en una oficina
    gloss: Algunas personas trabajan en una oficina.
    note: '*Dans un bureau* (en una oficina) lleva artículo, igual que *dans un restaurant*.'
  fr.a1.unit45.lesson03.teach.je_commence_a:
    title: Hora de inicio
    gloss: Empiezo a las nueve.
    note: '*Commence* es la forma de *je* del verbo *commencer* (empezar); *à neuf heures* indica la hora.'
  fr.a1.unit45.lesson03.teach.je_travaille_du:
    title: Días de trabajo
    gloss: Trabajo de lunes a viernes.
    note: '*Du lundi au vendredi* significa de lunes a viernes; *du* es *de* + *le* y *au* es *à* + *le*.'
  fr.a1.unit45.lesson03.teach.la_pause:
    title: El descanso
    gloss: el descanso
    note: '*Pause* es femenino: *la pause*.'
    example_gloss: Tengo un descanso a las doce.
  fr.a1.unit45.lesson03.teach.j_ai_une:
    title: Tener un descanso
    gloss: Tengo un descanso a las doce.
    note: '*Avoir une pause* (tener un descanso) es la expresión fija y natural.'
  fr.a1.unit45.lesson03.teach.je_finis_a:
    title: Hora de salida
    gloss: Termino a las cinco.
    note: '*Finis* es la forma de *je* del verbo *finir* (terminar).'
  fr.a1.unit45.lesson03.teach.je_commence_a_2:
    title: Una jornada completa
    gloss: Empiezo a las nueve y termino a las cinco.
    note: Une *je commence* y *je finis* con *et* en una sola frase que describe toda la jornada.
  fr.a1.unit45.lesson04.teach.avec_il_ou:
    title: Terminaciones verbales con il y elle
    gloss: 'Con él o ella, los verbos regulares en -er conservan la misma forma que con yo: yo trabajo, él trabaja, ella trabaja.'
    note: '*Travaille* es igual para *je*, *il* y *elle*: los verbos regulares en *-er* no añaden nada en la tercera persona.'
  fr.a1.unit45.lesson04.teach.camille_travaille_comme:
    title: El trabajo de Camille
    gloss: Camille trabaja como enfermera.
    note: '*Travaille* va con *je*, *il* y *elle*: la terminación es muda, así que las tres formas suenan igual.'
  fr.a1.unit45.lesson04.teach.mathieu_travaille_comme:
    title: El trabajo de Mathieu
    gloss: Mathieu trabaja como cocinero.
    note: Misma terminación que en *Camille travaille comme infirmière*.
  fr.a1.unit45.lesson04.teach.elle_travaille_a:
    title: Usar pronombres
    gloss: Ella trabaja en el hospital. Él trabaja en un restaurante.
    note: '*Elle* e *il* sustituyen a los nombres Camille y Mathieu, pero el verbo mantiene la misma forma.'
  fr.a1.unit45.lesson05.teach.camille_travaille_comme:
    title: Lee dos perfiles laborales
    gloss: Camille trabaja como enfermera en el hospital. Empieza a las siete y trabaja de lunes a viernes. Mathieu trabaja como cocinero en un restaurante. Empieza a las once y hace un descanso a las cuatro.
    note: Fíjate por separado en el trabajo, el lugar y el horario de cada persona.
    glosses:
      travaille: trabaja
      infirmière: enfermero
      l'hôpital: hospital
      commence: empieza
      sept: siete
      lundi: lunes
      vendredi: viernes
      cuisinier: cocinero / chef
      restaurant: restaurante
      onze: once
      pause: descanso
  fr.a1.unit45.lesson06.teach.camille_salut_mathieu:
    title: Camille pregunta por el trabajo
    gloss: 'Camille: ¡Hola, Mathieu! Tengo curiosidad: ¿a qué te dedicas, por cierto?'
    note: '*Au fait* (por cierto) suaviza la pregunta y la convierte en simple curiosidad amistosa, no en un interrogatorio.'
  fr.a1.unit45.lesson06.teach.mathieu_je_travaille:
    title: Mathieu responde
    gloss: 'Mathieu: Trabajo como cocinero en un restaurante. ¿Y tú?'
    note: '*Et toi ?* es la forma habitual de devolver la pregunta a la otra persona.'
  fr.a1.unit45.lesson06.teach.camille_je_travaille:
    title: Camille responde
    gloss: 'Camille: Trabajo como enfermera en el hospital.'
    note: Coincide con el trabajo y el lugar ya vistos en las lecciones anteriores.
  fr.a1.unit45.lesson06.teach.mathieu_tu_fais:
    title: Mathieu pregunta por el horario
    gloss: 'Mathieu: ¿Qué horario tienes?'
    note: '*Tu fais quels horaires ?* es una forma natural de preguntar por el horario de trabajo de alguien; *quels* concuerda con el plural *horaires*.'
  fr.a1.unit45.lesson06.teach.camille_je_commence:
    title: Camille dice su horario
    gloss: 'Camille: Empiezo a las siete y trabajo de lunes a viernes.'
    note: Coincide con el horario ya visto en el perfil de lectura.
  fr.a1.unit45.lesson06.teach.mathieu_c_est:
    title: Mathieu reacts
    gloss: 'Mathieu: ¡Qué temprano! Yo empiezo más tarde, a las once.'
    note: Coincide con la hora de inicio de Mathieu ya vista antes.
  fr.a1.unit45.lesson06.teach.camille_chaque_metier:
    title: Camille cierra el tema
    gloss: 'Camille: Cada trabajo tiene su propio ritmo, creo.'
    note: 'Un comentario final natural y reflexivo: basta con entender su significado, no hace falta reproducirlo exactamente.'
