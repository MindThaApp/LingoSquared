  fr.a1.unit55.lesson05.teach.camille_fait_du:
    title: Camille y Léa hablan de deporte
    gloss: Camille hace yoga dos veces por semana. Le encanta moverse con calma. Léa no hace yoga, pero le encanta nadar. Léa nada a menudo, casi todas las semanas. ¿Y tú, qué deporte practicas?
    note: Contrasta dos deportes distintos y dos expresiones de frecuencia distintas, igual que la lectura de los animales de la unidad anterior.
