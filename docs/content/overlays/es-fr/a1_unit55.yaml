  fr.a1.unit55.lesson04.teach.courir_est_un:
    title: Courir es irregular
    gloss: '*Courir* (correr) es irregular: *je cours, tu cours, il court*. La *s* y la *t* finales no se pronuncian.'
    note: '*Courir* no sigue el modelo regular de los verbos en *-er*, así que conviene aprender sus formas de memoria: *je cours*, *tu cours*, *il court*.'
