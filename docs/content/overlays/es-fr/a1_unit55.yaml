    title: Juego al fútbol
    gloss: Juego al fútbol.
    note: '*Jouer au* + un juego de pelota es la forma habitual de decir que juegas al fútbol. Para otros deportes usa *faire du* o *faire de la*; mira la nota de gramática.'
  fr.a1.unit55.lesson01.teach.faire_du_de:
    title: Faire du / de la + sport
    gloss: '*Faire du*, *de la* o *de l''* + un deporte dice qué deporte practicas: *faire du yoga*, *faire de la natation*, *faire de la course à pied*. Para el fútbol se dice *jouer au football*.'
    note: 'Una sola construcción sirve para todos los deportes: en este nivel no hace falta aprender un verbo distinto para cada uno.'
  fr.a1.unit55.lesson02.teach.fois_par_semaine:
    title: Veces por semana
    gloss: veces por semana
    example_gloss: Hago yoga dos veces por semana.
  fr.a1.unit55.lesson02.teach.tu_connais_deja:
    title: Fois par semaine vs tous les jours/souvent
    gloss: Ya conoces *tous les jours* (todos los días) y *souvent* (a menudo). *Deux fois par semaine* (dos veces por semana) es una forma nueva y más precisa de decir la frecuencia.
    note: Amplía el vocabulario de frecuencia que ya se vio en la unidad de pasatiempos.
  fr.a1.unit55.lesson02.teach.je_fais_du:
    title: Hago yoga dos veces por semana
    gloss: Hago yoga dos veces por semana.
