  fr.a1.unit55.lesson03.teach.tu_connais_deja:
    title: Faire du sport frente a faire de la + deporte
    gloss: 'Ya conoces *faire du sport* de la lección de pasatiempos (*Je fais du sport le samedi*). *Faire de la* + deporte nombra el deporte concreto: *Je fais de la natation*. Ambas formas son correctas en francés.'
    note: '*Faire du sport* se retoma de la unidad de pasatiempos; no es nuevo. Aquí se contrasta con nombrar un deporte concreto: una forma general y otra específica de hablar del ejercicio.'
