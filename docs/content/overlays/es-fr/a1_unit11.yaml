  fr.a1.unit11.lesson03.dialogue_projet_courses:
    title: Planear las compras
teaching:
  fr.a1.unit11.lesson01.teach.libre:
    title: Libre / disponible
    gloss: libre / disponible
    note: '*Libre* describe aquí la disponibilidad de una persona; para algo que no cuesta nada, el francés usa *gratuit*.'
    example_gloss: ¿Estás libre el sábado?
  fr.a1.unit11.lesson01.teach.occupe:
    title: Ocupado
    gloss: ocupado
    note: 'Es el opuesto exacto de *libre*. Concuerda en género: *occupé* / *occupée*.'
    example_gloss: Estoy ocupado el viernes por la noche.
  fr.a1.unit11.lesson01.teach.se_retrouver:
    title: Quedar
    gloss: quedar / encontrarse
    note: En este sentido *se retrouver* es recíproco (dos o más personas que se encuentran entre sí), a diferencia de *trouver* (encontrar).
    example_gloss: ¿Dónde quedamos esta noche?
  fr.a1.unit11.lesson01.teach.vers:
    title: Hacia (una hora)
    gloss: hacia (una hora)
    note: '*Vers* + una hora expresa una hora aproximada, más flexible que dar una hora exacta.'
    example_gloss: Paso hacia las siete.
  fr.a1.unit11.lesson01.teach.ca_te_dit_de:
    title: ¿Te apetece... ?
    gloss: ¿Te apetece hacer la compra juntos?
    note: '*Ça te dit de... ?* + infinitivo es una forma habitual y coloquial de proponer una actividad, más relajada que *Voulez-vous... ?*'
  fr.a1.unit11.lesson01.teach.venir_chercher:
    title: Venir a recoger
    gloss: ¿Vienes a recogerme hacia las seis de la tarde?
    note: '*Venir chercher quelqu''un* significa ir a buscar o a recoger a alguien, no solo "buscar".'
  fr.a1.unit11.lesson01.teach.daccord_a_tout_a_lheure:
    title: De acuerdo, hasta ahora
    gloss: De acuerdo, ¡hasta luego!
    note: '*D''accord* (de acuerdo) confirma un plan; *à tout à l''heure* se usa para volver a ver a alguien más tarde el mismo día.'
  fr.a1.unit11.lesson02.teach.je_ne_peux_pas:
    title: Rechazar un plan
    gloss: No puedo, estoy ocupado.
    note: '*Je ne peux pas* (no puedo) + un motivo es una forma sencilla y educada de rechazar.'
  fr.a1.unit11.lesson02.teach.avec_plaisir:
    title: Aceptar con gusto
    gloss: ¡Con mucho gusto!
    note: '*Avec plaisir* (literalmente "con placer") es una forma cálida y entusiasta de aceptar una invitación.'
  fr.a1.unit11.lesson02.teach.a_quelle_heure_on_se_voit:
    title: Preguntar la hora
    gloss: ¿A qué hora quedamos?
    note: '*On se voit* (informal, "nos vemos") es una alternativa común y coloquial a *se retrouver* para quedar con alguien.'
  fr.a1.unit11.lesson02.teach.devant_le_marche:
    title: Proponer un lugar
    gloss: Delante del mercado, ¿te viene bien?
    note: '*Ça te va ?* (¿te viene bien?) comprueba si un detalle propuesto le parece bien a la otra persona.'
  fr.a1.unit11.lesson02.teach.parfait_alors:
    title: Confirmar el plan
    gloss: Perfecto, ¡entonces hasta el viernes!
    note: '*Alors* significa aquí "entonces", en el sentido de confirmar lo acordado y cerrar la conversación sobre el plan.'
  fr.a1.unit11.lesson03.teach.line01:
    title: Proponer hacer la compra juntos
    gloss: Inès le pregunta a Mathieu si le apetece hacer la compra juntos antes del taller.
    note: '*Ça te dit de... ?* abre la conversación con una sugerencia informal.'
  fr.a1.unit11.lesson03.teach.line02:
    title: Aceptar y preguntar dónde
    gloss: Mathieu dice que con mucho gusto y pregunta dónde quedan.
    note: Combina *Avec plaisir* (con mucho gusto) con *se retrouver* (quedar).
  fr.a1.unit11.lesson03.teach.line03:
    title: Proponer lugar y día
    gloss: Inès propone delante del mercado, el viernes por la noche.
    note: Una propuesta corta que combina lugar (*devant le marché*) y día (*vendredi soir*).
  fr.a1.unit11.lesson03.teach.line04:
    title: Aceptar y preguntar la hora
    gloss: Mathieu está de acuerdo y pregunta a qué hora.
    note: '*D''accord* confirma el lugar y el día; la pregunta siguiente concreta la hora.'
  fr.a1.unit11.lesson03.teach.line05:
    title: Proponer una hora concreta
    gloss: Inès pregunta si Mathieu vendrá a recogerla hacia las seis de la tarde.
    note: Usa *venir chercher* + *vers* con una hora concreta.
  fr.a1.unit11.lesson03.teach.line06:
    title: Confirmarlo todo
    gloss: Mathieu dice perfecto, hasta el viernes entonces, a las seis de la tarde delante del mercado.
    note: Repite juntos los tres datos del plan (día, hora y lugar) para cerrar la conversación con claridad.
