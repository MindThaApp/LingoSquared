answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francés A1
  description: Proponer, aceptar, rechazar y concretar un plan sencillo, con la continuación de la historia del taller de cocina de Inès y Mathieu mientras quedan para comprar ingredientes juntos antes de la sesión del sábado. *Se retrouver* (quedar, encontrarse) es un verbo pronominal recíproco, y *vers* + hora expresa una hora aproximada, no exacta, para el encuentro.
units:
  fr.a1.unit11.plans:
    title: ¿Cuándo quedamos?
lessons:
  fr.a1.unit11.lesson01.vocabulaire_projets:
    title: Proponer una hora
  fr.a1.unit11.lesson02.accepter_refuser:
