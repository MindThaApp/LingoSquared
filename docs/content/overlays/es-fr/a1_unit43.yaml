teaching:
  fr.a1.unit43.lesson01.teach.le_billet:
    title: El billete
    gloss: el billete
    note: '*Billet* es masculino: *le billet*, *un billet*.'
    example_gloss: Quisiera un billete para Lyon.
  fr.a1.unit43.lesson01.teach.je_voudrais_un:
    title: Pedir un billete
    gloss: Quisiera un billete para Lyon.
    note: '*Je voudrais* suaviza una petición; es más cortés que *je veux* (quiero).'
  fr.a1.unit43.lesson01.teach.voulez_vous_un:
    title: El empleado pregunta de qué tipo
    gloss: ¿Desea un billete de ida o de ida y vuelta?
    note: '*Voulez-vous* es la forma formal de *vous* de *vouloir*, que aquí se usa con un empleado de la estación al que no conoces.'
  fr.a1.unit43.lesson01.teach.un_aller_retour:
    title: Responder con cortesía
    gloss: Uno de ida y vuelta, por favor.
    note: '*S''il vous plaît* es el "por favor" formal, acorde con el registro de *vous* de la conversación.'
  fr.a1.unit43.lesson01.teach.au_guichet_on:
    title: El registro en la ventanilla
    gloss: En la ventanilla se suele usar la forma de cortesía *vous*.
    note: A los desconocidos que prestan un servicio se les habla de *vous*; a los amigos y a la familia, de *tu*.
  fr.a1.unit43.lesson02.teach.le_quai:
    title: El andén
    gloss: el andén
    note: '*Quai* es masculino: *le quai*.'
    example_gloss: ¿De qué andén sale el tren a Lyon?
  fr.a1.unit43.lesson02.teach.de_quel_quai:
    title: Preguntar por el andén
    gloss: ¿De qué andén sale el tren a Lyon?
    note: '*De quel quai* pregunta específicamente por el andén; *quel* concuerda con el sustantivo masculino *quai*.'
  fr.a1.unit43.lesson02.teach.le_train_part:
    title: Indicar los datos de salida
    gloss: El tren sale del andén cinco a las diez menos cuarto.
    note: '*Dix heures moins le quart* significa las diez menos cuarto: como en español, para las horas anteriores a la hora en punto se resta con *moins* (menos).'
  fr.a1.unit43.lesson02.teach.a_quelle_heure:
    title: Preguntar la hora de llegada
    gloss: ¿A qué hora llega el tren?
    note: '*À quelle heure arrive ... ?* pregunta la hora; *arriver* es un verbo regular en *-er*: *le train arrive*.'
  fr.a1.unit43.lesson02.teach.le_train_arrive:
    title: Indicar la hora de llegada
    gloss: El tren llega a las once.
    note: '*Arrive* es la forma de *il/elle* de *arriver*; los verbos en *-er* terminan en *-e* con *il* y *elle*.'
  fr.a1.unit43.lesson03.teach.a_l_heure:
    title: A la hora / el retraso
    gloss: a la hora; el retraso
    note: '*À l''heure* es una expresión fija para algo que ocurre según lo previsto. *Le retard* (el retraso) es masculino.'
    example_gloss:
    - El tren no sale a la hora.
    - 'Atención: el tren a Lyon lleva retraso.'
  fr.a1.unit43.lesson03.teach.attention_le_train:
    title: Un aviso
    gloss: 'Atención: el tren a Lyon lleva retraso.'
    note: '*Attention* abre un aviso en la estación, como "Atención, viajeros".'
  fr.a1.unit43.lesson03.teach.le_train_ne:
    title: Negar que sea a la hora
    gloss: El tren no sale a la hora.
    note: '*Ne ... pas* rodea al verbo: *ne part pas à l''heure*.'
  fr.a1.unit43.lesson03.teach.le_train_part:
    title: Un cambio de andén
    gloss: El tren sale del andén tres en lugar del andén cinco.
    note: '*Au lieu du* significa ''en lugar del''; *de* + *le* se unen en *du*.'
  fr.a1.unit43.lesson03.teach.le_train_a:
    title: Indicar cuánto dura el retraso
    gloss: El tren lleva diez minutos de retraso.
    note: '*A ... de retard* (literalmente ''tiene ... de retraso'') es la forma natural de decir que algo va tarde; usa *avoir*.'
  fr.a1.unit43.lesson04.teach.l_entree_la:
    title: Entrada, salida, sala de espera
    gloss: la entrada; la salida; la sala de espera
    note: '*L''entrée*: el artículo se reduce a *l''* ante la vocal inicial *e*; *la sortie* y *la salle d''attente* son femeninos.'
    example_gloss:
    - ¿Dónde está la entrada?
    - ¿Dónde está la salida?
    - ¿Dónde está la sala de espera?
  fr.a1.unit43.lesson04.teach.ou_est_le:
    title: Preguntar dónde está un andén
    gloss: ¿Dónde está el andén siete?
    note: '*Où est ... ?* pregunta dónde está algo; *le quai sept* es masculino.'
  fr.a1.unit43.lesson04.teach.tout_droit_puis:
    title: Dar indicaciones
    gloss: Todo recto y luego a la derecha.
    note: '*Tout droit* y *à droite* son las palabras de dirección; *à* va delante de *droite*.'
  fr.a1.unit43.lesson04.teach.ou_est_la:
    title: Preguntar por la sala de espera
    gloss: ¿Dónde está la sala de espera?
    note: El mismo patrón de pregunta aplicado a un lugar nuevo.
  fr.a1.unit43.lesson05.teach.billet_paris_gare:
    title: Leer un billete impreso
    gloss: 'Billete: Paris Gare de Lyon a Lyon Part-Dieu. Salida: las diez y diez, andén siete. Llegada: las once menos diez. Ida y vuelta. Precio: doce euros cuarenta.'
    note: Fíjate en la hora y el andén de salida, la hora de llegada, el tipo de billete y el precio.
    glosses:
      Billet: billete
      Départ: salida
      dix: diez
      quai: andén
      sept: siete
      Arrivée: llegada
      onze: once
      Aller-retour: billete de ida y vuelta
      Prix: precio
      douze: doce
      euros: euros
      quarante: cuarenta
  fr.a1.unit43.lesson06.teach.mathieu_on_doit:
    title: Mathieu expone el plan
    gloss: 'Mathieu: Tenemos que ir al andén siete. El tren sale a las diez y diez.'
    note: '*On doit* (de *devoir*) expresa aquí una necesidad práctica, no una obligación estricta.'
  fr.a1.unit43.lesson06.teach.camille_regarde_voila:
    title: Camille lee el cartel
    gloss: 'Camille: Mira, ahí está el cartel: retraso, diez minutos.'
    note: '*Voilà* señala lo que hay: *voilà le panneau*.'
  fr.a1.unit43.lesson06.teach.mathieu_pas_de:
    title: Mathieu mantiene la calma
    gloss: 'Mathieu: No hay problema, todavía tenemos tiempo para tomar un café.'
    note: '*Pas de problème* es una frase tranquilizadora habitual e informal.'
  fr.a1.unit43.lesson06.teach.camille_bonne_idee:
    title: Llega el tren
    gloss: 'Camille: Buena idea. Oh, ya está aquí el tren. ¡Andén siete, justo!'
    note: '*Déjà* (ya) indica que el tren llegó antes de lo esperado, dado el retraso que se acababa de anunciar.'
  fr.a1.unit43.lesson06.teach.mathieu_allez_on:
    title: Suben al tren
    gloss: 'Mathieu: Vamos, subamos. ¡Lyon, ya llegamos!'
    note: '*On* es un *nosotros* cotidiano que lleva el verbo en la forma de *il*: *on monte*. *On arrive !* es la forma natural de decir "ya llegamos"; una traducción palabra por palabra sonaría extraña.'
