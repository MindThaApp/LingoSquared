course:
  title: Francés A1
  description: Expresar y preguntar gustos, disgustos y preferencias básicas, con la continuación de la historia del taller de cocina de Inès y Mathieu mientras eligen entre dos recetas para el sábado. *Préférer X à Y* usa *à*, igual que el español "preferir X a Y", y no *que*.
units:
  fr.a1.unit13.preferences:
    title: ¿Qué prefieres?
lessons:
  fr.a1.unit13.lesson01.vocabulaire_preferences:
    title: Gustar, preferir, detestar
  fr.a1.unit13.lesson02.demander_les_preferences:
    title: Preguntar por preferencias
  fr.a1.unit13.lesson03.dialogue_choisir_la_recette:
    title: Elegir la receta del sábado
teaching:
  fr.a1.unit13.lesson01.teach.preferer:
    title: Preferir
    gloss: preferir
    note: '*Préférer* es un verbo en -ER con cambio de acento: *je préfère*, pero *nous préférons* (sin cambio de acento en las formas de *nous/vous*).'
    example_gloss: Prefiero la tarta de chocolate.
  fr.a1.unit13.lesson01.teach.aimer_mieux:
    title: Gustar más
    gloss: gustar más
    note: '*Aimer mieux* es una alternativa habitual a *préférer*, pero compara con *que* (*aimer mieux X que Y*), mientras que *préférer* usa *à* (*préférer X à Y*).'
    example_gloss: Me gustan más los platos salados que los dulces.
  fr.a1.unit13.lesson01.teach.detester:
    title: Detestar
    gloss: detestar
    note: '*Détester* expresa un rechazo fuerte, más que *ne pas aimer* (no gustar).'
    example_gloss: Mathieu detesta las especias demasiado fuertes; prefiere los platos suaves.
  fr.a1.unit13.lesson01.teach.plutot:
    title: Más bien
    gloss: más bien
    note: '*Plutôt* matiza una preferencia: "más bien" esto, sin descartar del todo la alternativa.'
    example_gloss: Mejor tomo queso.
  fr.a1.unit13.lesson01.teach.sucre:
    title: Sweet
    gloss: dulce
    note: '*Sucré* describe un alimento con azúcar; no lo confundas con *doux* (suave).'
    example_gloss: Este postre es muy dulce.
  fr.a1.unit13.lesson01.teach.sale:
    title: Salado
    gloss: salado
    note: '*Salé* es el opuesto habitual de *sucré* en el vocabulario de la comida y vale tanto para "salado" como para "no dulce".'
    example_gloss: El queso es salado.
  fr.a1.unit13.lesson01.teach.la_recette:
    title: La receta
    gloss: la receta
    note: '*La recette* es siempre femenino.'
    example_gloss: Esta receta es fácil.
  fr.a1.unit13.lesson02.teach.quest_ce_que_tu_preferes:
    title: Preguntar una preferencia
    gloss: ¿Qué prefieres?
    note: '*Qu''est-ce que...* es la forma habitual de formar una pregunta abierta con "qué" en el francés hablado.'
  fr.a1.unit13.lesson02.teach.je_prefere_x_a_y:
    title: Expresar una preferencia entre dos cosas
    gloss: Prefiero la tarta a la quiche.
    note: '*Préférer X à Y* usa *à* para introducir la opción menos preferida, igual que el español "preferir X a Y"; no se usa *que*.'
  fr.a1.unit13.lesson02.teach.tu_aimes_plutot:
    title: Preguntar por una tendencia general
    gloss: ¿Te gusta más lo dulce o lo salado?
    note: Combina *plutôt* (de la primera lección) con una pregunta de elección con *ou* (o).
  fr.a1.unit13.lesson02.teach.moi_aussi_moi_non:
    title: Estar de acuerdo o no
    gloss: Yo también. / Yo no.
    note: '*Moi aussi* coincide con una afirmación positiva; *moi non* discrepa o expresa la preferencia contraria.'
  fr.a1.unit13.lesson02.teach.ca_ne_me_derange_pas:
    title: Decir que no te importa
    gloss: No me molesta.
    note: '*Ça ne me dérange pas* es una forma útil y neutra de aceptar cualquiera de las dos opciones cuando te piden elegir.'
  fr.a1.unit13.lesson02.teach.on_pourrait_faire:
    title: Sugerir una opción
    gloss: Podríamos hacer una quiche, ¿no?
    note: '*On pourrait* (podríamos) + infinitivo sugiere una opción con suavidad y pide conformidad con la coletilla *non ?*'
  fr.a1.unit13.lesson03.teach.line01:
    title: Preguntar qué preparar
    gloss: 'Mathieu pregunta qué van a preparar el sábado: ¿una tarta o una quiche?'
    note: '*Qu''est-ce qu''on prépare... ?* (¿qué preparamos?) usa *on* para "nosotros", como es habitual en el habla informal.'
  fr.a1.unit13.lesson03.teach.line02:
    title: Expresar una preferencia y preguntar al otro
    gloss: Inès dice que prefiere la tarta, más bien dulce, y le pregunta a Mathieu.
    note: '*Et toi ?* (¿y tú?) es la forma más sencilla de convertir una afirmación en una pregunta para el otro.'
  fr.a1.unit13.lesson03.teach.line03:
    title: Expresar la preferencia contraria
    gloss: Mathieu dice que le gusta más lo salado y que prefiere la quiche a la tarta.
    note: Reutiliza directamente el patrón *préférer X à Y* de la segunda lección.
  fr.a1.unit13.lesson03.teach.line04:
    title: Proponer un acuerdo
    gloss: Inès sugiere que podrían hacer las dos, ¿no?
    note: '*Les deux* (las dos) resuelve el desacuerdo proponiendo hacer ambas recetas.'
  fr.a1.unit13.lesson03.teach.line05:
    title: Aceptar el acuerdo
    gloss: Mathieu dice que es buena idea y que no le molesta en absoluto.
    note: '*Ça ne me dérange pas du tout* refuerza la frase de la segunda lección con *du tout* (en absoluto).'
  fr.a1.unit13.lesson03.teach.line06:
    title: Confirmar la decisión
    gloss: Inès dice perfecto, una tarta dulce y una quiche salada para el sábado.
    note: Repite con claridad la decisión final y cierra la conversación.
