answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francés A1
  description: Preguntar y dar indicaciones básicas para orientarse en la calle (à gauche/à droite, tout droit, au coin de la rue, traverser), con la continuación de la historia del taller de cocina de Inès y Mathieu mientras Inès busca una tienda de utensilios de cocina. En francés las indicaciones se pueden dar con el imperativo de vous ("Tournez à gauche") o con el presente ("Tu tournes à gauche"); en español también se alterna entre el imperativo y el presente, pero conviene fijarse en la forma francesa.
units:
  fr.a1.unit09.directions:
    title: ¿Cómo se llega?
