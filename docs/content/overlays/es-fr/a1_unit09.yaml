teaching:
  fr.a1.unit09.lesson01.teach.a_gauche:
    title: A la izquierda
    gloss: a la izquierda
    note: '*À gauche* se usa tanto para la ubicación ("está a la izquierda") como para la dirección ("gira a la izquierda").'
    example_gloss: Gira a la izquierda después de la panadería.
  fr.a1.unit09.lesson01.teach.a_droite:
    title: A la derecha
    gloss: a la derecha
    note: Es el opuesto exacto de *à gauche* y se usa de la misma manera.
    example_gloss: La farmacia está a la derecha del café.
  fr.a1.unit09.lesson01.teach.tout_droit:
    title: Todo recto
    gloss: todo recto
    note: '*Tout droit* significa "todo recto"; no lo confundas con *à droite* ("a la derecha"), que se parece pero significa otra cosa.'
    example_gloss: Sigue todo recto hasta el mercado.
  fr.a1.unit09.lesson01.teach.au_coin_de_la_rue:
    title: En la esquina de la calle
    gloss: en la esquina de la calle
    note: '*Au coin de* significa "en la esquina de"; *au coin de la rue* (en la esquina de la calle) es una referencia muy habitual.'
    example_gloss: La tienda está en la esquina de la calle.
  fr.a1.unit09.lesson01.teach.traverser:
    title: Cruzar
    gloss: cruzar
    note: '*Traverser* es un verbo regular en -ER: *je traverse*, *tu traverses*, etc.'
    example_gloss: Hay que cruzar la calle para llegar a la tienda.
  fr.a1.unit09.lesson01.teach.la_boutique:
    title: La tienda
    gloss: la tienda
    note: '*La boutique* suele ser una tienda pequeña y especializada, distinta de un gran almacén.'
    example_gloss: La tienda está en la esquina de la calle, a la derecha.
  fr.a1.unit09.lesson01.teach.le_carrefour:
    title: El cruce
    gloss: el cruce
    note: '*Le carrefour* es el lugar donde se cruzan dos calles; es una referencia muy habitual al dar indicaciones de palabra.'
    example_gloss: Gira a la izquierda en el cruce.
  fr.a1.unit09.lesson02.teach.pour_aller_a:
    title: Preguntar cómo llegar
    gloss: Perdone, ¿cómo se va a la tienda, por favor?
    note: '*Pour aller à... ?* (literalmente "para ir a...") es la forma educada habitual de preguntar cómo llegar a un lugar.'
  fr.a1.unit09.lesson02.teach.tournez_a_gauche:
    title: Gira a la izquierda
    gloss: Gire a la izquierda después de la farmacia.
    note: '*Tournez* es el imperativo de *vous* de *tourner* (girar), el registro normal para dar indicaciones a alguien que no conoces bien.'
  fr.a1.unit09.lesson02.teach.continuez_tout_droit:
    title: Sigue todo recto
    gloss: Siga todo recto hasta el cruce.
    note: '*Continuez* (siga) + *tout droit* (todo recto) es la forma habitual de decirle a alguien que siga caminando sin girar.'
  fr.a1.unit09.lesson02.teach.cest_au_coin:
    title: Indicar la ubicación
    gloss: Está en la esquina de la calle, a la derecha.
    note: Combina *au coin de la rue* con *à droite* para dar una ubicación precisa.
  fr.a1.unit09.lesson02.teach.cest_loin:
    title: Decir que no está lejos
    gloss: No está lejos, está a cinco minutos a pie.
    note: '*À cinq minutes à pied* (a cinco minutos a pie) es el mismo patrón de tiempo caminando que viste cuando Mathieu habló de la farmacia.'
  fr.a1.unit09.lesson03.teach.line01:
    title: Preguntar por una tienda
    gloss: Inès le pregunta a Mathieu si conoce una tienda para comprar utensilios de cocina.
    note: '*Tu connais... ?* (¿conoces...?) es la forma informal habitual de preguntar si alguien conoce un lugar.'
  fr.a1.unit09.lesson03.teach.line02:
    title: Dar el primer paso
    gloss: 'Mathieu dice que sí, que hay una no muy lejos de aquí: giras a la izquierda en el cruce.'
    note: '*Il y en a une* (hay una) usa *en* para no repetir *boutique*; es un atajo muy común en el francés hablado.'
  fr.a1.unit09.lesson03.teach.line03:
    title: Confirmar y pedir más
    gloss: Inès confirma que es a la izquierda en el cruce y pregunta qué viene después.
    note: '*Et ensuite ?* (¿y luego?) es una forma sencilla y natural de pedir el siguiente paso de las indicaciones.'
  fr.a1.unit09.lesson03.teach.line04:
    title: Dar el segundo paso
    gloss: Mathieu dice que después sigues todo recto y cruzas la calle.
    note: Dos verbos de dirección unidos con *et*; una forma natural de dar un recorrido corto.
  fr.a1.unit09.lesson03.teach.line05:
    title: Preguntar dónde exactamente
    gloss: Inès pregunta dónde está exactamente la tienda.
    note: '*Exactement* (exactamente) pide una respuesta más precisa que una dirección general.'
  fr.a1.unit09.lesson03.teach.line06:
    title: Dar la ubicación precisa
    gloss: Mathieu dice que está en la esquina de la calle, justo enfrente de la panadería.
    note: '*En face de* (enfrente de) da una ubicación basada en un punto de referencia, una forma natural de terminar unas indicaciones.'
