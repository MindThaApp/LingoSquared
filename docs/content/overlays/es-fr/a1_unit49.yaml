teaching:
  fr.a1.unit49.lesson01.teach.content_triste_en:
    title: Contento, triste y enfadado
    gloss: contento, triste, enfadado
    note: Tres palabras básicas de sentimientos que se usan con *être* (ser, estar); *content* tiene el femenino *contente*, mientras que *triste* y *en colère* no cambian.
    example_gloss:
    - Estoy contento.
    - Estoy triste.
    - Estoy enfadado.
  fr.a1.unit49.lesson01.teach.je_suis_content:
    title: Decir que estás contento
    gloss: Estoy contento.
    note: '*Être* + adjetivo de sentimiento es el patrón básico; el francés usa un solo verbo donde el español elige entre «ser» y «estar».'
  fr.a1.unit49.lesson01.teach.je_ne_suis:
    title: Contrastar sentimientos
    gloss: No estoy enfadado, estoy triste.
    note: '*Ne ... pas* rodea al verbo; la segunda parte indica el sentimiento real.'
  fr.a1.unit49.lesson02.teach.pourquoi_es_tu:
    title: Preguntar por qué
    gloss: ¿Por qué estás contento?
    note: '*Pourquoi* (por qué) es la palabra interrogativa habitual para preguntar una razón.'
  fr.a1.unit49.lesson02.teach.je_suis_content:
    title: Dar una razón
    gloss: Estoy contento porque tengo un apartamento nuevo.
    note: '*Parce que* (porque) introduce la razón; ante *il* se acorta a *parce qu''*.'
  fr.a1.unit49.lesson02.teach.je_suis_triste:
    title: Una razón negativa
    gloss: Estoy triste porque llueve.
    note: Reutiliza *il pleut* (llueve) de la unidad del tiempo como razón.
  fr.a1.unit49.lesson03.teach.nerveux:
    title: Nervioso
    gloss: nervioso
    note: La palabra habitual para el nerviosismo.
    example_gloss: Estoy nervioso por mi primer turno.
  fr.a1.unit49.lesson03.teach.je_suis_nerveux:
    title: Decir por qué estás nervioso
    gloss: Estoy nervioso por mi primer turno.
    note: '*Avant* (literalmente «antes de») introduce lo que causa el nerviosismo, donde en español usamos «por» o «ante».'
  fr.a1.unit49.lesson03.teach.ne_t_inquiete:
    title: Tranquilizar a alguien
    gloss: No te preocupes.
    note: '*Ne t''inquiète pas* (literalmente «no te preocupes a ti mismo») es la fórmula fija habitual para tranquilizar; *s''inquiéter* es reflexivo.'
  fr.a1.unit49.lesson04.teach.comment_se_sent:
    title: Preguntar cómo se siente alguien
    gloss: ¿Cómo se siente Mathieu?
    note: '*Se sentir* (sentirse, reflexivo) es la forma habitual de preguntar por un estado de ánimo o de describirlo; también aparece en la unidad de salud.'
  fr.a1.unit49.lesson04.teach.il_se_sent:
    title: Describir cómo se siente alguien
    gloss: Él se siente nervioso.
    note: '*Se* (a sí mismo) es el pronombre reflexivo de tercera persona, que acompaña a *sent*.'
  fr.a1.unit49.lesson04.teach.pourquoi_se_sent:
    title: Preguntar por qué alguien se siente así
    gloss: ¿Por qué se siente nervioso?
    note: Combina *pourquoi* con *se sentir* de *Il se sent nerveux*; *sent-il* se escribe con guion.
  fr.a1.unit49.lesson05.teach.salut_camille_je:
    title: Lee un mensaje sobre sentimientos
    gloss: Hola, Camille, estoy un poco nervioso por mi primer turno solo. Pero también estoy contento, porque tengo un trabajo nuevo y un apartamento nuevo. Creo que irá bien.
    note: Fíjate en por qué está nervioso el autor, qué lo hace feliz y cómo ve el futuro en general.
    glosses:
      peu: un poco
      nerveux: nervioso
      premier: primer
      service: turno
      seul: solo
      content: contento
      car: porque
      nouveau: nuevo
      travail: trabajo
      nouvel: nuevo
      appartement: apartamento
      pense: creo
      aller: irá (bien)
  fr.a1.unit49.lesson06.teach.camille_salut_mathieu:
    title: Camille pregunta cómo se siente Mathieu
    gloss: 'Camille: Hola, Mathieu, ¿cómo te sientes ante tu primer turno?'
    note: '*Avant ton premier service* (antes de tu primer turno) reutiliza el patrón *avant* + sustantivo de la lección 3.'
  fr.a1.unit49.lesson06.teach.mathieu_je_suis:
    title: Mathieu admite que está nervioso
    gloss: 'Mathieu: Estoy un poco nervioso, la verdad.'
    note: '*Honnêtement* (honestamente) suaviza la confesión.'
  fr.a1.unit49.lesson06.teach.camille_ne_t:
    title: Camille lo tranquiliza
    gloss: 'Camille: No te preocupes, ¡lo conseguirás!'
    note: '*Tu vas y arriver* (literalmente «llegarás allí») es una expresión fija de ánimo; *aller* + infinitivo forma el futuro cercano.'
  fr.a1.unit49.lesson06.teach.mathieu_merci_ca:
    title: Mathieu le da las gracias
    gloss: 'Mathieu: Gracias, me ayuda mucho.'
    note: '*Aide* es la forma de *il/elle* del verbo *aider* (ayudar); *m''* representa *me*.'
  fr.a1.unit49.lesson06.teach.camille_et_apres:
    title: Camille predice el resultado
    gloss: 'Camille: Y después seguro que estarás muy contento y orgulloso.'
    note: '*Sûrement* (seguramente) expresa una predicción segura; *fier* (orgulloso) es un adjetivo nuevo y útil.'
  fr.a1.unit49.lesson06.teach.mathieu_oui_je:
    title: Mathieu está de acuerdo
    gloss: 'Mathieu: Sí, yo también lo creo.'
    note: '*Je pense aussi* es la forma natural de coincidir con la opinión de alguien.'
  fr.a1.unit49.lesson06.teach.il_remplace_mathieu:
    title: Resumir con il, elle y l'
    gloss: Mathieu está nervioso por su primer turno. Camille lo ayuda.
    note: '*Il* sustituye al nombre de un hombre (*il est nerveux*), *elle* sustituye al de una mujer, y *l''* (*elle l''aide*) significa «lo»: tres palabras pequeñas pero esenciales para hablar de otra persona.'
