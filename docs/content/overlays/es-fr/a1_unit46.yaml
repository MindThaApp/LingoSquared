teaching:
  fr.a1.unit46.lesson01.teach.l_appartement_le:
    title: Apartamento, salón, dormitorio
    gloss: el apartamento, el salón, el dormitorio
    note: '*L''appartement* es masculino y *le* pierde la *e*; *le salon* es masculino y *la chambre* es femenino.'
    example_gloss:
    - Tengo un apartamento.
    - Tengo un salón.
    - Tengo un dormitorio.
  fr.a1.unit46.lesson01.teach.la_cuisine_la:
    title: Cocina, baño
    gloss: la cocina, el baño
    note: '*La cuisine* y *la salle de bains* son ambos femeninos.'
    example_gloss:
    - Tengo una cocina.
    - Tengo un baño.
  fr.a1.unit46.lesson01.teach.j_ai_un:
    title: Decir que tienes un apartamento
    gloss: Tengo un apartamento.
    note: '*Avoir* (tener) es el verbo natural para decir qué vivienda tienes, igual que en español. Este es un ejemplo general; el apartamento de Mathieu (en Lyon) aparece más adelante en esta unidad.'
  fr.a1.unit46.lesson01.teach.j_ai_un_2:
    title: Enumerar todas las habitaciones
    gloss: Tengo un salón, un dormitorio, una cocina y un baño.
    note: Enumera las cuatro habitaciones del vocabulario de esta lección en una sola frase, separadas por comas y con un *et* final.
  fr.a1.unit46.lesson02.teach.tu_as_combien:
    title: Preguntar cuántas habitaciones
    gloss: ¿Cuántas habitaciones tienes?
    note: '*Combien de* (cuántos) va seguido de un sustantivo en plural: *combien de pièces*.'
  fr.a1.unit46.lesson02.teach.j_ai_deux:
    title: Decir cuántos dormitorios
    gloss: Tengo dos dormitorios.
    note: '*Chambres* es el plural de *chambre*, que se forma de manera regular con una *-s* muda.'
  fr.a1.unit46.lesson02.teach.l_appartement_a:
    title: Decir el total de habitaciones
    gloss: El apartamento tiene tres habitaciones.
    note: '*Pièces* es una palabra general para las habitaciones, no solo los dormitorios.'
  fr.a1.unit46.lesson03.teach.le_balcon_le:
    title: Balcón, jardín
    gloss: el balcón, el jardín
    note: '*Le balcon* y *le jardin* son ambos masculinos.'
    example_gloss:
    - Hay un balcón.
    - No hay jardín.
  fr.a1.unit46.lesson03.teach.il_y_a:
    title: Decir que algo existe
    gloss: Hay un balcón.
    note: '*Il y a* es la construcción habitual para indicar que algo existe, equivalente a «hay».'
  fr.a1.unit46.lesson03.teach.il_n_y:
    title: Decir que algo no existe
    gloss: No hay jardín.
    note: '*Pas de* niega un sustantivo indefinido: *pas de jardin*, no *pas un jardin*.'
  fr.a1.unit46.lesson04.teach.cosy:
    title: Acogedor
    gloss: acogedor
    note: Un adjetivo muy común y muy francés para hablar de un ambiente cálido y agradable; no tiene una traducción exacta con una sola palabra.
    example_gloss: El apartamento es pequeño pero acogedor.
  fr.a1.unit46.lesson04.teach.l_appartement_est:
    title: Una forma habitual de describir
    gloss: El apartamento es pequeño pero acogedor.
    note: '*Petit mais cosy* es una forma muy natural que usan los franceses para describir en positivo una vivienda pequeña.'
  fr.a1.unit46.lesson04.teach.le_salon_est:
    title: Describir el tamaño de una habitación
    gloss: El salón es grande.
    note: '*Grand* describe una habitación concreta, no toda la casa; concuerda con *le salon*, que es masculino.'
  fr.a1.unit46.lesson04.teach.la_cuisine_est:
    title: Describir el tamaño de otra habitación
    gloss: La cocina es pequeña.
    note: 'Mismo patrón que *grand* en la tarjeta anterior, con otra habitación: *la cuisine* es femenino, por eso *petite*.'
  fr.a1.unit46.lesson05.teach.appartement_a_lyon:
    title: Lee un anuncio de vivienda
    gloss: 'Apartamento en Lyon: un dormitorio, un salón, una cocina y un baño. Hay un balcón, pero no jardín. El apartamento es pequeño pero acogedor.'
    note: Fíjate en el número de habitaciones, en qué elementos hay o no hay y en la impresión general.
    glosses:
      Appartement: apartamento
      chambre: dormitorio
      salon: salón
      cuisine: cocina
      bains: baño
      balcon: balcón
      jardin: jardín
      petit: pequeño
      cosy: acogedor
  fr.a1.unit46.lesson06.teach.camille_salut_mathieu:
    title: Camille pregunta por el apartamento
    gloss: 'Camille: Hola, Mathieu, ¿cómo es tu nuevo apartamento en Lyon?'
    note: '*Nouvel* es la forma de *nouveau* (nuevo) que se usa ante un sustantivo masculino que empieza por vocal: *un nouvel appartement*.'
  fr.a1.unit46.lesson06.teach.mathieu_il_est:
    title: Mathieu lo describe
    gloss: 'Mathieu: Es pequeño pero acogedor. Tengo un dormitorio, un salón, una cocina y un baño.'
    note: 'Coincide exactamente con el anuncio de vivienda leído antes: este es el apartamento real de Mathieu.'
  fr.a1.unit46.lesson06.teach.camille_tu_as:
    title: Camille pregunta por el balcón
    gloss: 'Camille: ¿Tienes balcón?'
    note: Una pregunta directa de sí o no con *Tu as ... ?*
  fr.a1.unit46.lesson06.teach.mathieu_oui_j:
    title: Mathieu responde
    gloss: 'Mathieu: Sí, tengo balcón, pero no jardín.'
    note: 'Coincide con los datos del anuncio: balcón y sin jardín.'
  fr.a1.unit46.lesson06.teach.balcon_est_masculin:
    title: El género de balcon
    gloss: '*Balcon* es masculino: un balcón, es pequeño.'
    note: '*Il* (él, ello) sustituye a un sustantivo masculino como *balcon*, así que el adjetivo también es masculino: *il est petit*.'
  fr.a1.unit46.lesson06.teach.camille_ca_a:
    title: Camille reacciona con cariño
    gloss: 'Camille: ¡Qué buena pinta! Pasaré a verte pronto.'
    note: '*Je passerai te voir* (pasaré a verte) usa el futuro *passerai* más *te voir*, «verte».'
  fr.a1.unit46.lesson06.teach.mathieu_super_tu:
    title: Mathieu le da la bienvenida
    gloss: 'Mathieu: Genial, siempre eres bienvenida.'
    note: '*Toujours la bienvenue* (siempre bienvenida) es una forma cálida de invitar a alguien a volver; *bienvenue* es femenino aquí porque se refiere a Camille.'
