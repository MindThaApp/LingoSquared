teaching:
  fr.a1.unit54.lesson01.teach.l_animal_un:
    title: Animal, mascota
    gloss: el animal / una mascota
    note: '*Un animal* es la palabra general; *un animal de compagnie* (literalmente «un animal de compañía») significa en concreto una mascota.'
    example_gloss:
    - Un perro es un animal.
    - Un perro también es una mascota.
  fr.a1.unit54.lesson01.teach.le_chien_le:
    title: Perro y gato
    gloss: el perro / el gato
    example_gloss:
    - Camille tiene un perro.
    - Thomas tiene un gato.
  fr.a1.unit54.lesson01.teach.le_poisson_l:
    title: Pez y pájaro
    gloss: el pez / el pájaro
    example_gloss:
    - El abuelo tiene un pez.
    - Nina tiene un pájaro.
  fr.a1.unit54.lesson01.teach.tu_as_un:
    title: ¿Tienes una mascota?
    gloss: ¿Tienes una mascota?
    note: La misma estructura de pregunta *Tu as ... ?* que ya conoces de unidades anteriores.
  fr.a1.unit54.lesson01.teach.oui_j_ai:
    title: Sí, tengo un perro
    gloss: Sí, tengo un perro.
    note: Una respuesta afirmativa sencilla con el vocabulario nuevo de esta unidad.
  fr.a1.unit54.lesson01.teach.non_je_n:
    title: No, no tengo mascota
    gloss: No, no tengo mascota.
    note: '*Pas d''* sustituye a *un* después de una negación: *Je n''ai pas d''animal de compagnie.* Mira la nota de gramática.'
  fr.a1.unit54.lesson01.teach.apres_ne_pas:
    title: 'Pas de: negar un/une/des'
    gloss: Después de *ne ... pas*, *un*, *une* y *des* pasan a ser *de* o *d'*, como en *Je n'ai pas de temps* (que ya conoces) y aquí en *Je n'ai pas d'animal de compagnie*.
    note: 'Retoma el modelo que ya se enseñó con *Je n''ai pas de temps*: no es gramática nueva, solo un sustantivo nuevo al que aplicarla.'
  fr.a1.unit54.lesson02.teach.promener:
    title: Pasear (a un animal)
    gloss: pasear (a un animal)
    note: '*Promener* (sacar a pasear) es un verbo regular en *-er*; mira la nota de gramática.'
    example_gloss: Paseo al perro todos los días.
  fr.a1.unit54.lesson02.teach.promener_est_un:
    title: Promener es un verbo regular en -er
    gloss: '*Promener* es un verbo regular en *-er*, como *cuisiner*: *je promène, tu promènes, il promène le chien*. El acento en la *e* indica que se pronuncia.'
    note: El verbo siempre se queda en una sola pieza, como los demás verbos en *-er* que ya conoces.
  fr.a1.unit54.lesson02.teach.donner_a_manger:
    title: Dar de comer
    gloss: dar de comer
    example_gloss: Le doy de comer al gato todos los días.
  fr.a1.unit54.lesson02.teach.jouer_avec:
    title: Jugar con
    gloss: jugar con
    example_gloss: Thomas juega con su gato.
  fr.a1.unit54.lesson02.teach.je_promene_le:
    title: Paseo al perro todos los días
    gloss: Paseo al perro todos los días.
    note: Combina *promener* con *tous les jours* (todos los días), ya conocido de una unidad anterior.
  fr.a1.unit54.lesson02.teach.je_donne_a:
    title: Le doy de comer al gato todos los días
    gloss: Le doy de comer al gato todos los días.
    note: Combina *donner à manger* (literalmente «dar para comer») con *tous les jours*.
  fr.a1.unit54.lesson03.teach.au_pluriel_on:
    title: 'Plural: chien -> chiens'
    gloss: 'El plural suele añadir una *s* que no se oye: *chien -> chiens*, *chat -> chats*. Los sustantivos en *-al* cambian a *-aux*: *animal -> animaux*.'
    note: El patrón regular del plural en francés, presentado aquí por primera vez con sustantivos de animales como ejemplo.
  fr.a1.unit54.lesson03.teach.chiens_chats:
    title: Perros y gatos
    gloss: perros / gatos
    example_gloss:
    - Mathieu adora a los perros.
    - Léa adora a los gatos.
  fr.a1.unit54.lesson03.teach.poissons_oiseaux:
    title: Peces y pájaros (plural)
    gloss: peces / pájaros
    example_gloss:
    - Adoro los peces.
    - El abuelo adora los pájaros.
  fr.a1.unit54.lesson03.teach.j_adore_les:
    title: Adoro a los animales
    gloss: Adoro a los animales.
    note: '*Adorer* (adorar) va seguido directamente del sustantivo, y un gusto general lleva *les*: *J''adore les animaux.*'
  fr.a1.unit54.lesson03.teach.lea_adore_les:
    title: Léa adora a los gatos, pero no tiene mascota
    gloss: Léa adora a los gatos, pero no tiene mascota.
    note: Prepara el contraste en torno al cual se construye la lectura de la lección 5.
  fr.a1.unit54.lesson04.teach.mathieu_tu_as:
    title: Mathieu pregunta por una mascota
    gloss: 'Mathieu: ¿Tienes una mascota, Camille?'
  fr.a1.unit54.lesson04.teach.camille_oui_j:
    title: Camille tiene un perro
    gloss: 'Camille: Sí, tengo un perro.'
  fr.a1.unit54.lesson04.teach.mathieu_comment_est:
    title: Mathieu pregunta cómo es
    gloss: 'Mathieu: ¿Cómo es?'
    note: Retoma *Comment est-il ?* de la unidad del aspecto físico, ahora aplicada a un animal.
  fr.a1.unit54.lesson04.teach.camille_il_a:
    title: Camille describe a su perro
    gloss: 'Camille: Tiene el pelo marrón y es pequeño.'
    note: Retoma el vocabulario de color del pelo y de tamaño de la unidad del aspecto físico, ahora para describir el pelaje de un animal y no el pelo de una persona.
  fr.a1.unit54.lesson04.teach.il_et_le:
    title: Il y le para animales
    gloss: '*Il* («él») y *le* («lo») también se usan para un animal macho, no solo para una persona.'
    note: Todos los usos anteriores de *il* y *le* en este curso se referían a una persona; esta nota señala expresamente que también valen para animales.
  fr.a1.unit54.lesson04.teach.mathieu_tu_le:
    title: Mathieu pregunta por los paseos
    gloss: 'Mathieu: ¿Lo paseas todos los días?'
  fr.a1.unit54.lesson04.teach.camille_oui_je:
    title: Camille describe su rutina
    gloss: 'Camille: Sí, lo paseo todos los días y le doy de comer.'
  fr.a1.unit54.lesson05.teach.mathieu_et_lea:
    title: Mathieu, Léa y Thomas hablan de animales
    gloss: 'A Mathieu y a Léa les encantan los animales a los dos, pero ninguno de los dos tiene mascota. Mathieu adora a los perros y Léa adora a los gatos. Thomas sí tiene una mascota: un gato. Juega a menudo con su gato y le da de comer todos los días. ¿Tienes tú una mascota?'
    note: Contrasta querer a los animales con tener uno de verdad, que es el objetivo comunicativo de la unidad.
    glosses:
      adorent: adorar
      tous: los dos
      animaux: animales
      deux: los dos
      compagnie: mascota
      chiens: perros
      chats: gatos
      chat: gato
      joue: juega
      donne: da
      chaque: cada
      manger: comida
  fr.a1.unit54.lesson05.teach.thomas_joue_souvent:
    title: Thomas juega a menudo con su gato
    gloss: Thomas juega a menudo con su gato.
    note: '*Souvent* (a menudo) va justo después del verbo, como en las rutinas anteriores.'
  fr.a1.unit54.lesson05.teach.j_adore_les:
    title: Adoro a los perros. No tengo mascota.
    gloss: Adoro a los perros. No tengo mascota.
    note: Una respuesta modelo de dos frases, lista para reutilizar en el ejercicio de escritura de la unidad.
  fr.a1.unit54.lesson06.teach.camille_nina_tu:
    title: Camille pregunta a Nina
    gloss: 'Camille: Nina, ¿tú también tienes una mascota?'
  fr.a1.unit54.lesson06.teach.nina_oui_j:
    title: Nina tiene un pájaro llamado Pico
    gloss: 'Nina: Sí, tengo un pájaro. Se llama Pico.'
    note: '*Il s''appelle* («se llama») retoma el verbo de presentación de la primera unidad.'
  fr.a1.unit54.lesson06.teach.mathieu_comme_c:
    title: Mathieu reacciona
    gloss: 'Mathieu: ¡Qué bonito! ¿Qué haces con él todos los días?'
  fr.a1.unit54.lesson06.teach.nina_je_lui:
    title: Nina le da de comer todos los días
    gloss: 'Nina: Le doy de comer todos los días.'
  fr.a1.unit54.lesson06.teach.mathieu_j_adore:
    title: A Mathieu también le encantan los pájaros
    gloss: 'Mathieu: A mí también me encantan los pájaros.'
  fr.a1.unit54.lesson06.teach.camille_c_est:
    title: Camille cierra la conversación
    gloss: 'Camille: ¡Qué bien que a los tres nos encanten los animales!'
    note: Cierra el círculo con los datos sobre animales de los tres personajes de esta unidad.
