  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francés A1
  description: Hacer comparaciones básicas (plus/moins/aussi... que) y superlativos (le/la plus...), con la continuación de la historia del taller de cocina de Inès y Mathieu mientras comparan dos quesos en las compras. *Meilleur* (mejor) y *le meilleur* (el mejor) son irregulares, a diferencia del patrón regular *plus... que* que se usa con la mayoría de los demás adjetivos.
units:
  fr.a1.unit14.comparisons:
    title: ¿Más o menos?
lessons:
  fr.a1.unit14.lesson01.vocabulaire_comparaisons:
    title: Más, menos, tan
  fr.a1.unit14.lesson02.superlatifs:
    title: El más, el menos
  fr.a1.unit14.lesson03.dialogue_comparer_fromages:
    title: Comparar dos quesos en el mercado
teaching:
  fr.a1.unit14.lesson01.teach.plus_que:
    title: Más... que
    gloss: más... que
    note: '*Plus + adjetivo + que* es el comparativo habitual en francés, igual que "más + adjetivo + que" en español.'
    example_gloss: Este queso es más caro que el otro.
  fr.a1.unit14.lesson01.teach.moins_que:
    title: Menos... que
    gloss: menos... que
    note: '*Moins* es el opuesto exacto de *plus* en este mismo patrón comparativo.'
    example_gloss: Esta receta es menos difícil que la otra.
  fr.a1.unit14.lesson01.teach.aussi_que:
    title: Tan... como
    gloss: tan... como
    note: '*Aussi + adjective + que* expresa igualdad entre dos cosas.'
    example_gloss: La tarta es tan buena como la quiche.
  fr.a1.unit14.lesson01.teach.meilleur_que:
    title: Mejor que
    gloss: mejor que
    note: '*Meilleur* es el comparativo irregular de *bon* (bueno): en francés NO se dice *plus bon*.'
    example_gloss: Este pastel es mejor que el primero.
  fr.a1.unit14.lesson01.teach.cher_bon_marche:
    title: Caro, barato
    gloss: caro, barato / económico
    note: '*Bon marché* es invariable (nunca cambia de forma), aunque parezca que debería concordar como los demás adjetivos.'
    example_gloss:
    - El queso es caro.
    - Las verduras son baratas.
  fr.a1.unit14.lesson01.teach.facile_difficile:
    title: Fácil, difícil
    gloss: fácil, difícil
    note: 'Un par de adjetivos habitual para describir recetas: los dos tienen la misma forma en masculino y femenino; en plural se añade -s (*faciles*, *difficiles*).'
    example_gloss:
    - Esta receta es fácil.
    - La quiche es algo difícil.
  fr.a1.unit14.lesson02.teach.le_plus_cher:
    title: El más caro
    gloss: el más caro
    note: '*Le/la plus + adjetivo* forma el superlativo; el artículo definido es obligatorio, a diferencia del comparativo.'
    example_gloss: Es el queso más caro del mercado.
  fr.a1.unit14.lesson02.teach.la_moins_chere:
    title: La menos cara
    gloss: la menos cara
    note: '*La moins chère* concuerda con el femenino *recette*; la forma masculina es *le moins cher*.'
    example_gloss: Es la receta menos cara.
  fr.a1.unit14.lesson02.teach.le_meilleur:
    title: El mejor
    gloss: el mejor
    note: '*Le meilleur* es el superlativo irregular de *bon*, que corresponde al comparativo irregular *meilleur* de la primera lección.'
    example_gloss: ¡Es el mejor pastel del taller!
  fr.a1.unit14.lesson02.teach.la_plus_facile:
    title: La más fácil
    gloss: la más fácil
    note: Un superlativo regular, que sigue directamente el patrón *le/la plus + adjetivo*.
    example_gloss: Es la receta más fácil de hacer.
  fr.a1.unit14.lesson02.teach.grammar_superlative_note:
    title: Patrón del superlativo
    gloss: le/la plus + adjetivo; meilleur es irregular
    note: La mayoría de los superlativos franceses son regulares (*le/la plus + adjetivo*), pero *bon* → *meilleur* → *le meilleur* es una excepción que hay que memorizar.
  fr.a1.unit14.lesson02.teach.comparer_les_prix:
    title: Proponer comparar precios
    gloss: Comparemos los precios antes de comprar.
    note: '*Comparons* es el imperativo de *nous* de *comparer* ("comparemos"), una frase natural para ir de compras.'
  fr.a1.unit14.lesson03.teach.line01:
    title: Notar dos opciones
    gloss: 'Inès dice: mira, hay dos tipos de queso; ¿cuál llevamos?'
    note: '*Lequel* (cuál) pide al otro que elija entre dos opciones ya mencionadas.'
  fr.a1.unit14.lesson03.teach.line02:
    title: Comparar y señalar la calidad
    gloss: Mathieu dice que este es más caro que el otro, pero parece mejor.
    note: '*Avoir l''air* + adjetivo (parecer) suaviza una afirmación sobre la calidad que aún no se ha probado.'
  fr.a1.unit14.lesson03.teach.line03:
    title: No estar de acuerdo con una comparación
    gloss: Inès pregunta si está seguro y dice que ella encuentra el otro igual de bueno, y más barato.
    note: Usa *aussi* y *moins* de la primera lección en una misma respuesta para discrepar con educación; se omite *que* porque por el contexto está claro qué queso se compara (el de Mathieu).
  fr.a1.unit14.lesson03.teach.line04:
    title: Admitir el precio
    gloss: 'Mathieu está de acuerdo: es verdad, es el más barato de los dos.'
    note: '*Des deux* (de los dos) limita el superlativo a este par, y no a todo el mercado.'
  fr.a1.unit14.lesson03.teach.line05:
    title: Tomar la decisión final
    gloss: Inès dice que entonces llevan ese, que es la mejor opción para el taller.
    note: '*Celui-là* (ese) remite al queso más barato del que se acaba de hablar.'
  fr.a1.unit14.lesson03.teach.line06:
    title: Notar la ventaja
    gloss: Mathieu está de acuerdo y dice que les quedará más dinero para el postre.
    note: '*Il nous reste* (nos queda) es una forma habitual de decir "nos queda... ".'
