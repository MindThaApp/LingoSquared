answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: Francés A1
  description: Vocabulario del mercado, cómo preguntar precios y cantidades con combien/kilo/litre, y el contraste entre du/de la y el simple de tras las expresiones de cantidad, continuando la historia de Inès y Mathieu del taller de cocina en una escena de compras en el mercado. Las explicaciones destacan que el francés suprime por completo el artículo partitivo tras una cantidad explícita (un kilo de tomates, no un kilo des tomates).
units:
  fr.a1.unit04.shopping:
    title: Compras con Inès
lessons:
  fr.a1.unit04.lesson01.au_marche:
    title: En el mercado
  fr.a1.unit04.lesson02.combien_ca_coute:
    title: ¿Cuánto cuesta?
  fr.a1.unit04.lesson03.dialogue_marche:
    title: En el mercado con Inès y Mathieu
teaching:
  fr.a1.unit04.lesson01.teach.marche:
    title: El mercado
    gloss: el mercado
    note: '*Marché* es masculino.'
    example_gloss: El mercado está abierto los sábados.
  fr.a1.unit04.lesson01.teach.boulangerie:
    title: La panadería
    gloss: la panadería
    note: '*Boulangerie* es femenino; es la tienda específica de pan, distinta de una *pâtisserie* (pastelería).'
    example_gloss: Hay una buena panadería cerca de aquí.
  fr.a1.unit04.lesson01.teach.legumes:
    title: Verduras
    gloss: verduras
    note: '*Légumes* es masculino plural.'
    example_gloss: Compro verduras frescas para el taller.
  fr.a1.unit04.lesson01.teach.fruits:
    title: Fruta
    gloss: fruta
    note: '*Fruits* es masculino plural. El francés usa a menudo el plural (*les fruits*) donde el español dice «la fruta» en singular.'
    example_gloss: La fruta está cara este mes.
  fr.a1.unit04.lesson01.teach.prix:
    title: El precio
    gloss: el precio
    note: '*Prix* es masculino e invariable: se escribe igual en singular y en plural.'
    example_gloss: ¿Cuánto cuesta el pan?
  fr.a1.unit04.lesson01.teach.cher:
    title: Caro
    gloss: caro
    note: '*Cher* es la forma masculina; *chère* es femenina y *chers*/*chères* son plurales, y concuerdan con el sustantivo al que describen.'
    example_gloss: Este queso es demasiado caro.
  fr.a1.unit04.lesson01.teach.pas_cher:
    title: No son caras hoy
    gloss: Las verduras no están caras hoy.
    note: '*Pas cher(s)* (sin *ne*) es la forma hablada habitual de decir que algo es barato; la forma escrita completa es *ne sont pas chers*.'
  fr.a1.unit04.lesson02.teach.un_kilo_de:
    title: Un kilo de
    gloss: un kilo de
    note: '*De* va justo después de la cantidad, sin artículo; consulta la nota gramatical *de after quantity* más abajo.'
    example_gloss: Quisiera un kilo de tomates.
  fr.a1.unit04.lesson02.teach.un_litre_de:
    title: Un litro de
    gloss: un litro de
    note: '*Litre* es masculino y se usa para los líquidos igual que *kilo* para los sólidos.'
    example_gloss: Un litro de leche, por favor.
  fr.a1.unit04.lesson02.teach.euro:
    title: Un euro
    gloss: un euro
    note: '*Euro* forma el plural de manera regular: *deux euros*, *cinq euros*.'
    example_gloss: Eso cuesta cinco euros.
  fr.a1.unit04.lesson02.teach.de_after_quantity:
    title: De tras una cantidad
    gloss: de
    note: 'Tras una palabra de cantidad explícita (*un kilo*, *un litre*, *beaucoup*, como en *beaucoup de cousins*), el francés usa solo *de* y suprime por completo *du*/*de la*/*des*: *un kilo de tomates*, nunca *un kilo des tomates*. Es un patrón parecido al español «un kilo de tomates».'
  fr.a1.unit04.lesson02.teach.combien_ca_coute:
    title: Preguntar el precio
    gloss: ¿Cuánto cuesta?
    note: '*Combien* (cuánto) más *ça coûte* (cuesta) es la forma general para preguntar un precio.'
  fr.a1.unit04.lesson02.teach.cest_combien_pain:
    title: Preguntar el precio de un producto concreto
    gloss: ¿Cuánto cuesta el pan?
    note: '*C''est combien, [item] ?* nombra el producto concreto cuyo precio se pregunta, una alternativa habitual a *Combien ça coûte ?*.'
  fr.a1.unit04.lesson02.teach.ca_fait_combien:
    title: Preguntar el total
    gloss: ¿Cuánto es en total?
    note: '*Ça fait combien ?* pregunta por el total acumulado, normalmente al final de una compra y no por un solo producto.'
  fr.a1.unit04.lesson03.teach.line01:
    title: Pedir tomates
    gloss: Inès saluda al vendedor y le pide un kilo de tomates.
    note: Combina *Bonjour* con el patrón *je voudrais* + cantidad.
  fr.a1.unit04.lesson03.teach.line02:
    title: Preguntar si se necesita algo más
    gloss: El vendedor lo confirma y le pregunta si necesita algo más.
    note: '*Autre chose ?* (¿algo más?) es la pregunta habitual de un comerciante después de un pedido.'
  fr.a1.unit04.lesson03.teach.line03:
    title: Añadir queso y preguntar su precio
    gloss: Inès añade un poco de queso y pregunta su precio.
    note: '*Un peu de fromage* (un poco de queso) usa el mismo patrón de *de* sin artículo que *un kilo de*.'
  fr.a1.unit04.lesson03.teach.line04:
    title: Decir un precio por kilo
    gloss: El vendedor dice que son ocho euros el kilo.
    note: '*X euros le kilo* es la forma francesa natural de dar un precio por unidad, con *le* en el sentido de «por», igual que en español «ocho euros el kilo».'
  fr.a1.unit04.lesson03.teach.line05:
    title: Explicar por qué necesita pan aquí
    gloss: Mathieu dice que él también quiere pan, pero que la panadería está cerrada hoy.
    note: '*Fermée* (cerrada) es la forma femenina, que concuerda con *la boulangerie*.'
  fr.a1.unit04.lesson03.teach.line06:
    title: Ofrecer una alternativa
    gloss: 'Inès lo tranquiliza: aquí también se puede comprar pan.'
    note: '*On peut* (se puede / podemos) + infinitivo es una forma informal habitual de expresar una posibilidad.'
  fr.a1.unit04.lesson03.teach.line07:
    title: Confirmar y dar el total
    gloss: El vendedor confirma que tiene pan fresco, calcula el total y dice trece euros con cincuenta.
    note: '*Ça fait combien en tout ?* aquí es el vendedor pensando en voz alta antes de decir el total, no una pregunta a Inès.'
  fr.a1.unit04.lesson03.teach.line08:
    title: Dar las gracias al vendedor
    gloss: Inès le da las gracias con cariño mientras paga.
    note: '*Voilà* aquí acompaña la entrega del pago, una palabra que va con el gesto.'
