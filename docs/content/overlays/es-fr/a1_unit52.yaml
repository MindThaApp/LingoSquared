teaching:
  fr.a1.unit52.lesson01.teach.lire_faire_du:
    title: Leer, hacer deporte, cocinar
    gloss: leer, hacer deporte, cocinar
    note: 'Tres verbos habituales de aficiones: *lire* (leer), *faire du sport* (hacer deporte) y *cuisiner* (cocinar).'
    example_gloss:
    - Me gusta leer un libro.
    - Hago deporte los sábados.
    - Me gusta cocinar para mis amigos.
  fr.a1.unit52.lesson01.teach.le_temps_libre:
    title: El tiempo libre
    gloss: tiempo libre
    note: '*Temps libre* es masculino: *le temps libre*. Es la expresión clave para hablar de aficiones.'
    example_gloss: En mi tiempo libre me gusta leer.
  fr.a1.unit52.lesson01.teach.pendant_mon_temps:
    title: Decir qué haces en tu tiempo libre
    gloss: En mi tiempo libre me gusta leer.
    note: '*Lis* es la forma de *je* de *lire* (leer); la *s* final no se pronuncia.'
  fr.a1.unit52.lesson02.teach.ecouter_de_la:
    title: Música, dibujo y videojuegos
    gloss: escuchar música, dibujar, jugar a videojuegos
    note: 'Tres aficiones más: *écouter de la musique*, *dessiner* y *jouer aux jeux vidéo*. Con los juegos, *jouer à* + *les* se convierte en *jouer aux*.'
    example_gloss:
    - Me gusta escuchar música.
    - Dibujo a menudo.
    - Me gusta jugar a videojuegos con amigos.
  fr.a1.unit52.lesson02.teach.j_aime_ecouter:
    title: Decir que te gusta escuchar música
    gloss: Me gusta escuchar música.
    note: '*Écouter* lleva su complemento directamente, sin ninguna palabra más: *écouter de la musique*.'
  fr.a1.unit52.lesson02.teach.j_aime_jouer:
    title: Decir que te gusta jugar a videojuegos con amigos
    gloss: Me gusta jugar a videojuegos con amigos.
    note: '*Avec des amis* (con amigos) reutiliza *amis* de la lección 1; *des* es el plural «unos».'
  fr.a1.unit52.lesson03.teach.toujours_souvent_parfois:
    title: Siempre, a menudo, a veces, nunca
    gloss: siempre, a menudo, a veces, nunca
    note: Los cuatro adverbios de frecuencia básicos. *Souvent* quizá ya te suene; *toujours*, *parfois* y *jamais* son nuevos. *Jamais* necesita *ne* delante del verbo.
    example_gloss:
    - Siempre hago deporte los sábados.
    - A menudo leo un libro.
    - A veces dibujo.
    - Nunca juego a videojuegos.
  fr.a1.unit52.lesson03.teach.chaque_semaine_chaque:
    title: Cada semana, cada fin de semana
    gloss: cada semana, cada fin de semana
    note: '*Chaque semaine* y *chaque week-end* significan «cada». *Chaque* nunca cambia, sea cual sea el género del sustantivo.'
    example_gloss:
    - Cocino para mis amigos cada semana.
    - Hago deporte cada fin de semana.
  fr.a1.unit52.lesson03.teach.chaque_ne_change:
    title: Chaque nunca cambia
    gloss: '*Chaque* se queda igual ante sustantivos masculinos y femeninos: *chaque semaine*, *chaque week-end*.'
    note: '*Semaine* es femenino y *week-end* es masculino, pero *chaque* es idéntico para ambos. Compáralo con *tous les* / *toutes les*, que sí cambia.'
  fr.a1.unit52.lesson03.teach.qu_est_ce:
    title: Preguntar por el tiempo libre
    gloss: ¿Qué haces en tu tiempo libre?
    note: 'Esta es la pregunta central de la unidad: úsala para preguntar a cualquiera por sus aficiones.'
  fr.a1.unit52.lesson04.teach.camille_on_se:
    title: Camille saca el tema de las aficiones
    gloss: 'Camille: A menudo paseamos juntos. Pero ¿qué más haces en tu tiempo libre, Mathieu?'
    note: '*On se promène souvent* usa *on* para «nosotros», y *souvent* va justo después del verbo.'
  fr.a1.unit52.lesson04.teach.mathieu_j_aime:
    title: Las aficiones de Mathieu
    gloss: 'Mathieu: Me gusta cocinar, también en casa. Y hago deporte a menudo.'
    note: '*Même à la maison* (incluso en casa) deja claro que Mathieu cocina por gusto, no solo en su trabajo.'
  fr.a1.unit52.lesson04.teach.camille_tu_cuisines:
    title: Camille está sorprendida
    gloss: 'Camille: ¿También cocinas en casa? ¡Ya cocinas todo el día en el trabajo!'
    note: '*Toute la journée* (todo el día) subraya cuánto cocina ya Mathieu en el trabajo.'
  fr.a1.unit52.lesson04.teach.mathieu_oui_mais:
    title: Mathieu lo explica
    gloss: 'Mathieu: Sí, pero a mí cocinar me parece relajante. Y tú, ¿qué te gusta hacer?'
    note: '*Cuisiner, je trouve ça relaxant* pone *cuisiner* al principio para enfatizar: literalmente «cocinar, lo encuentro relajante».'
  fr.a1.unit52.lesson04.teach.camille_j_aime:
    title: Las aficiones de Camille
    gloss: 'Camille: Me gusta leer y a menudo escucho música.'
    note: Combina dos aficiones de las lecciones 1 y 2 en una sola frase con *et* (y).
  fr.a1.unit52.lesson04.teach.mathieu_tu_joues:
    title: Mathieu pregunta por los videojuegos
    gloss: 'Mathieu: ¿Tú también juegas a videojuegos?'
    note: 'Una pregunta corta de sí o no: *Tu joues aussi aux jeux vidéo ?* La entonación ascendente la convierte en pregunta.'
  fr.a1.unit52.lesson04.teach.camille_non_je:
    title: Camille responde
    gloss: 'Camille: No, nunca juego a videojuegos. ¡Pero a veces dibujo!'
    note: '*Jamais* (nunca) y *parfois* (a veces) de la lección 3, contrastados en una misma respuesta.'
  fr.a1.unit52.lesson05.teach.mathieu_et_moi:
    title: Comparar aficiones
    gloss: Mathieu y yo paseamos a menudo juntos. Pero también tenemos otras aficiones. A Mathieu le gusta cocinar, también en casa, y hace deporte a menudo. A mí me gusta leer y a menudo escucho música. A veces dibujo, pero nunca juego a videojuegos. ¿Qué te gusta hacer en tu tiempo libre?
    note: El mensaje de Camille resume datos de las lecciones anteriores y termina haciendo al lector la pregunta central de la unidad.
    glosses:
      promène: pasea
      souvent: a menudo
      ensemble: juntos
      d'autres: otros
      cuisiner: cocina
      aime: le gusta
      maison: en casa
      sport: hace deporte
      lire: leer
      j'écoute: escucho
      musique: música
      dessine: dibujo
      parfois: a veces
      jeux: juego a videojuegos
      jamais: nunca
      libre: libre
      temps: tiempo
  fr.a1.unit52.lesson06.teach.mathieu_qu_est:
    title: Mathieu pregunta por el fin de semana
    gloss: 'Mathieu: ¿Qué haces este fin de semana?'
    note: '*Ce week-end* (este fin de semana) usa *ce* porque *week-end* es masculino.'
  fr.a1.unit52.lesson06.teach.camille_je_ne:
    title: Camille está indecisa
    gloss: 'Camille: Todavía no lo sé. Me gusta leer, pero también quiero salir.'
    note: '*Sortir* (salir) es una forma habitual de decir que quieres salir de casa.'
  fr.a1.unit52.lesson06.teach.mathieu_on_se:
    title: Mathieu propone un plan
    gloss: 'Mathieu: ¿Paseamos juntos? Después cocino para nosotros.'
    note: '*Après* (después) ordena dos planes en secuencia, igual que *d''abord* y *ensuite*.'
  fr.a1.unit52.lesson06.teach.camille_bonne_idee:
    title: Camille acepta
    gloss: 'Camille: ¡Buena idea! Me gusta tanto pasear como cocinar.'
    note: '*Autant ... que* («tanto ... como») muestra que a Camille le gustan las dos cosas por igual, sin preferir una.'
  fr.a1.unit52.lesson06.teach.mathieu_parfait_alors:
    title: Mathieu lo confirma
    gloss: 'Mathieu: Perfecto. ¡Entonces nos vemos el sábado!'
    note: Una despedida amistosa que confirma el plan para *samedi* (el sábado).
