    title: À vélo, en train
    gloss: El francés usa *à* para el vélo y para ir andando (*à vélo*, *à pied*) y *en* para los transportes en los que te sientas dentro (*en train*, *en voiture*).
    note: 'No digas *par vélo* ni *dans le train*: lo correcto es *à vélo*, *à pied*, *en train* y *en voiture*. Apréndelos como expresiones fijas.'
