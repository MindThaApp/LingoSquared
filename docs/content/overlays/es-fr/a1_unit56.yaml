    title: ¿Quién viaja cómo?
    gloss: Camille viaja en tren al trabajo todos los días. Mathieu va sobre todo en bicicleta, pero cuando llueve también coge el tren. Thomas prefiere ir en coche. Léa vive cerca y va andando al trabajo. ¿Cómo vas tú al trabajo?
    note: Contrasta cuatro maneras distintas de ir al trabajo y una condición (la lluvia), igual que la lectura de deporte de la unidad anterior.
