course:
  title: Дари A1
  description: 'Дари для начинающих (Афганистан): обмен именами, рассказ о том, откуда ты и чем занимаешься, представление третьего человека, вежливые обращения и правильный уровень вежливости при первой встрече.'
units:
  prs.a1.unit02.introductions:
    title: Знакомство и представление
lessons:
  prs.a1.unit02.lesson01.name_exchange:
    title: Спросить и назвать имя
  prs.a1.unit02.lesson02.origin_and_hometown:
    title: Спросить о родном городе и стране
  prs.a1.unit02.lesson03.occupation:
    title: Спроси о чьей-то работе
  prs.a1.unit02.lesson04.introducing_others:
    title: Представить третье лицо
  prs.a1.unit02.lesson05.polite_titles_and_register:
    title: Вежливые обращения и нужный регистр
  prs.a1.unit02.lesson06.gathering_dialogue:
    title: Знакомство с людьми на встрече
teaching:
  prs.a1.unit02.lesson01.teach.name_question_polite:
    title: Вежливо спросить имя
    gloss: Как вас зовут?
    note: نام‌تان چیست؟ — уважительная форма для нового знакомого-взрослого; она продолжает регистр شما/استین из Урока 1.
  prs.a1.unit02.lesson01.teach.name_answer:
    title: Назвать своё имя с است
    gloss: Меня зовут Фаридун.
    note: نام من ... است — письменный способ назвать имя. В разговоре обычно говорят نامم ... است (نامم = نام + -م, «моё имя»). Оба варианта верны.
  prs.a1.unit02.lesson01.teach.i_am_name:
    title: Назвать себя с استم
    gloss: Я Фаридун.
    note: استم стоит сразу после имени; это та же связка 1-го лица из Урока 1.
  prs.a1.unit02.lesson01.teach.name_question_informal:
    title: Спросить имя близкого друга
    gloss: Как тебя зовут?
    note: نامت چیست؟ использует неформальное притяжательное окончание -ت. Говори так только ровеснику или близкому другу, как تو/استی в Уроке 1.
  prs.a1.unit02.lesson01.teach.what_is_your_name_word:
    title: Слово «имя»
    gloss: имя
    note: نام — самостоятельное существительное, которое используется и в вежливом, и в неформальном вопросе выше.
    example_gloss: Как тебя зовут?
  prs.a1.unit02.lesson01.teach.register_note:
    title: Вежливое притяжательное окончание и окончание для близкого друга
    gloss: -تان — для того, к кому обращаешься уважительно; -ت — для близкого друга.
    note: То же деление по регистру, что в Уроке 1 (شما/تو), переносится на притяжательные окончания у слова نام.
  prs.a1.unit02.lesson02.teach.where_from_polite:
    title: Спросить, откуда человек
    gloss: Откуда вы?
    note: شما از کجا استین؟ сохраняет уважительную пару شما/استین.
  prs.a1.unit02.lesson02.teach.from_kabul:
    title: Сказать, что ты из Кабула
    gloss: Я из Кабула.
    note: من از کابل استم построено по модели من از [место] استم, годной для любого города.
  prs.a1.unit02.lesson02.teach.from_herat:
    title: Сказать, что ты из Герата
    gloss: Я из Герата.
    note: هرات — крупный город на западе Афганистана.
  prs.a1.unit02.lesson02.teach.from_mazar:
    title: Сказать, что ты из Мазар-и-Шарифа
    gloss: Я из Мазар-и-Шарифа.
    note: مزار شریف пишется в два слова и обозначает крупный город на севере Афганистана.
  prs.a1.unit02.lesson02.teach.country:
    title: Афганистан
    gloss: Афганистан
    note: افغانستان употребляется после از так же, как название города.
    example_gloss: Я из Афганистана.
  prs.a1.unit02.lesson02.teach.city_word:
    title: Слово «город»
    gloss: город
    note: شهر обозначает город вообще, в отличие от названия конкретного города.
    example_gloss: Кабул — большой город.
  prs.a1.unit02.lesson03.teach.occupation_question:
    title: Спросить, чем занимается человек
    gloss: Кем вы работаете?
    note: کار شما چیست؟ буквально значит «какая у вас работа?» — обычный способ спросить о профессии.
  prs.a1.unit02.lesson03.teach.doctor:
    title: Врач
    gloss: врач
    note: داکتر — обычное дари слово для профессии врача; в неформальной речи так называют и людей с докторской степенью.
    example_gloss: Он/она — врач.
  prs.a1.unit02.lesson03.teach.teacher:
    title: Учительница
    gloss: учитель
    note: معلم — общее слово «учитель» для школы любого уровня.
    example_gloss: Он/она — учитель(ница).
  prs.a1.unit02.lesson03.teach.engineer:
    title: Инженер
    gloss: инженер
    note: مهندس означает инженера вообще, без указания конкретной специальности.
    example_gloss: Он/она — инженер.
  prs.a1.unit02.lesson03.teach.shopkeeper:
    title: Продавец
    gloss: владелец магазина, продавец
    note: دوکاندار (от دوکان, «лавка») — повседневное кабульское слово; в этом курсе используется написание دوکان, а не иранское персидское مغازه.
    example_gloss: Он/она — владелец лавки.
  prs.a1.unit02.lesson03.teach.i_am_teacher:
    title: Назвать профессию
    gloss: Я учитель.
    note: من [профессия] استم — модель для любой профессии из этого урока.
  prs.a1.unit02.lesson04.teach.introduce_formal:
    title: Официально представить человека
    gloss: Позвольте представить моего коллегу.
    note: اجازه بدهین همکارم را معرفی کنم — уважительный способ ввести в разговор третье лицо.
  prs.a1.unit02.lesson04.teach.this_is:
    title: Назвать представляемого человека
    gloss: Это моя коллега Арзу.
    note: این [человек] است прямо называет того, кого представляют.
  prs.a1.unit02.lesson04.teach.pleased_after_intro:
    title: Сказать, что рад знакомству
    gloss: Приятно познакомиться.
    note: از آشنایی با شما خوش شدم — та же фраза первой встречи из Урока 1, здесь она повторяется после представления третьего лица.
  prs.a1.unit02.lesson04.teach.pleased_reply:
    title: Ответить, что тоже рад знакомству
    gloss: Я тоже рад(а) знакомству.
    note: من هم خوش شدم — естественный краткий ответ.
  prs.a1.unit02.lesson04.teach.friend_word:
    title: Друг
    gloss: друг
    note: دوست — общее слово «друг», без указания степени близости.
    example_gloss: Он/она — мой друг (моя подруга).
  prs.a1.unit02.lesson04.teach.colleague_word:
    title: Коллега
    gloss: коллега
    note: همکار обозначает сослуживца; слово уже встречалось в диалоге на работе в Уроке 1.
    example_gloss: Он/она — мой коллега (моя коллега).
  prs.a1.unit02.lesson05.teach.title_jenab:
    title: Господин
    gloss: господин
    note: جناب ставится перед именем или званием мужчины как уважительное обращение; оно обычно в повседневной речи афганских горожан.
    example_gloss: Господин, прошу вас.
  prs.a1.unit02.lesson05.teach.title_khanom:
    title: Госпожа
    gloss: госпожа
    note: خانم ставится перед именем женщины независимо от её семейного положения.
    example_gloss: Госпожа, прошу вас.
  prs.a1.unit02.lesson05.teach.title_with_name:
    title: Вежливо обратиться к мужчине
    gloss: господин Фаридун
    note: جناب с личным именем — обычное вежливое обращение; фамилия не обязательна.
  prs.a1.unit02.lesson05.teach.title_with_name_female:
    title: Вежливо обратиться к женщине
    gloss: госпожа Арзу
    note: خانم с личным именем работает так же, как جناب для мужчины.
  prs.a1.unit02.lesson05.teach.register_reminder:
    title: Когда какой регистр использовать
    gloss: С недавно встреченным человеком используй شما и استین; تو и استی — только с близким другом.
    note: Здесь правило регистра из Урока 1 напоминается применительно к знакомству.
  prs.a1.unit02.lesson05.teach.polite_could_you:
    title: Вежливо попросить повторить имя
    gloss: Не могли бы вы повторить своё имя?
    note: می‌توانین نام‌تان را دوباره بگویین؟ — естественный вежливый способ попросить повторить, не создавая неловкости.
  prs.a1.unit02.lesson06.teach.gathering_word:
    title: Встреча / вечеринка
    gloss: встреча в гостях
    note: مهمانی обозначает неформальную встречу гостей — обстановку диалога этого урока.
    example_gloss: Вечер в гостях удался.
  prs.a1.unit02.lesson06.teach.turn01:
    title: Лейла начинает знакомство
    gloss: Лейла здоровается с Фаридуном и спрашивает его имя, уважительно обращаясь к нему جناب.
    note: Лейла и Фаридун раньше не встречались, поэтому она с самого начала использует уважительный регистр.
  prs.a1.unit02.lesson06.teach.turn02:
    title: Фаридун называет своё имя
    gloss: Фаридун отвечает на приветствие и называет своё имя.
    note: سلام علیکم — более полное приветствие из Урока 1, уместное при первой встрече. В разговоре Фаридун говорит نامم فریدون است (نامم = نام من, «моё имя») — обычная разговорная форма.
  prs.a1.unit02.lesson06.teach.turn03:
    title: Лейла спрашивает, откуда он
    gloss: Лейла говорит, что рада знакомству, и спрашивает, откуда он.
    note: Та же фраза از آشنایی با شما خوش شدم перешла из диалога на работе в Уроке 1.
  prs.a1.unit02.lesson06.teach.turn04:
    title: Фаридун отвечает и возвращает вопрос
    gloss: Фаридун говорит, что он из Герата, и задаёт Лейле тот же вопрос.
    note: و شما؟ — краткий способ вернуть вопрос, как в Уроке 1.
  prs.a1.unit02.lesson06.teach.turn05:
    title: Лейла отвечает и спрашивает о работе
    gloss: Лейла говорит, что она из Кабула, и спрашивает Фаридуна о его профессии.
    note: Разговор естественно переходит от происхождения к профессии.
  prs.a1.unit02.lesson06.teach.turn06:
    title: Фаридун отвечает и возвращает вопрос
    gloss: Фаридун говорит, что он инженер, и задаёт Лейле тот же вопрос.
    note: شما چطور؟ — краткий способ вернуть вопрос, понятный из контекста.
  prs.a1.unit02.lesson06.teach.turn07:
    title: Лейла называет свою профессию
    gloss: Лейла говорит, что она учительница.
    note: Завершает обмен о профессиях по модели, изученной ранее в этом уроке.
  prs.a1.unit02.lesson06.teach.turn08:
    title: Фаридун представляет третье лицо
    gloss: Фаридун представляет свою коллегу Арзу.
    note: Так в разговор вступает третий участник, с помощью формальной фразы представления из lesson04.
  prs.a1.unit02.lesson06.teach.turn09:
    title: Лейла приветствует Арзу
    gloss: Лейла приветствует Арезу, уважительно обращаясь к ней словом خانم.
    note: خوش آمدین — приветствие из модуля 1, здесь обращённое к только что представленному человеку.
  prs.a1.unit02.lesson06.teach.turn10:
    title: Арезу отвечает
    gloss: Арезу благодарит Лейлу и говорит, что рада знакомству.
    note: 'از دیدن شما خوشحال شدم — естественный вариант фразы «приятно познакомиться»: вместо آشنایی здесь используется دیدن («видеть»).'
exercises:
  prs.a1.unit02.lesson01.exercise01.recognize_name_question:
    instruction: Какая фраза вежливо спрашивает имя человека?
    correct_option: Как вас зовут? (вежливо)
    distractors:
    - Как тебя зовут? (неформально)
    - Кем вы работаете?
    - Откуда ты?
    accepted_answers:
    - value: Как вас зовут? (вежливо)
      status: correct
    feedback: نام‌تان چیست؟ — уважительная форма для нового знакомого.
  prs.a1.unit02.lesson01.exercise02.recognize_polite_vs_informal:
    instruction: نامت چیست؟ уместно спрашивать...
    correct_option: близкого друга
    distractors:
    - незнакомого человека, которого ты только что встретил
    - старшего по возрасту на официальном мероприятии
    - покупателя в твоём магазине
    accepted_answers:
    - value: близкого друга
      status: correct
    feedback: Неформальное притяжательное -ت в слове نامت подходит только близкому другу или ровеснику — то же правило, что и для تو/استی в модуле 1.
  prs.a1.unit02.lesson01.exercise03.recognize_name_question_reading:
    instruction: О чём спрашивает этот вопрос?
    correct_option: Как тебя зовут?
    distractors:
    - Кем вы работаете?
    - Откуда ты?
    - А вы?
    accepted_answers:
    - value: Как тебя зовут?
      status: correct
    feedback: نام‌تان چیست؟ — вопрос о том, как тебя зовут.
  prs.a1.unit02.lesson01.exercise04.match_name_forms:
    instruction: Соедини каждую фразу с её значением.
    accepted_answers:
    - value:
        نام‌تان چیست؟: Как вас зовут?
        نامت چیست؟: Как тебя зовут?
        نام: имя
      status: correct
    feedback: نام‌تان и نامت различаются только уровнем вежливости, а не значением.
    pairs:
    - left: نام‌تان چیست؟
      right: Как вас зовут?
    - left: نامت چیست؟
      right: Как тебя зовут?
    - left: نام
      right: имя
  prs.a1.unit02.lesson01.exercise05.order_name_answer:
    instruction: Составь из слов фразу «Меня зовут Фаридун».
    accepted_answers:
    - value:
      - نام
      - من
      - فریدون
      - است
      status: correct
    feedback: نام من فریدون است строится по схеме «существительное + است».
  prs.a1.unit02.lesson01.exercise06.translate_name_answer:
    instruction: 'Переведи на дари: Меня зовут Фаридун.'
    accepted_answers:
    - value: نام من فریدون است
      status: correct
    - value: فریدون استم
      status: correct
    - value: من فریدون استم
      status: correct
    - value: نامم فریدون است
      status: correct
    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
    feedback: نام من فریدون است означает «Меня зовут Фаридун».
  prs.a1.unit02.lesson01.exercise07.translate_own_name:
    instruction: 'Переведи на дари: Меня зовут Фаридун.'
    accepted_answers:
    - value: نام من فریدون است
      status: correct
    - value: فریدون استم
      status: correct
    - value: من فریدون استم
      status: correct
    - value: نامم فریدون است
      status: correct
    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
    feedback: И نام من فریدون است, и فریدون استم правильно называют имя; та же модель подходит для любого имени.
  prs.a1.unit02.lesson01.exercise08.speak_name_exchange:
    instruction: Ответь вслух на вопрос نام‌تان چیست؟, сказав, что тебя зовут Фаридун.
    accepted_answers:
    - value: نام من فریدون است
      status: correct
    - value: فریدون استم
      status: correct
    - value: من فریدون استم
      status: correct
    - value: نامم فریدون است
      status: correct
    - value: فریدون هستم
      status: correct
    - value: من فریدون هستم
      status: correct
    feedback: Любая из двух моделей правильно отвечает на вопрос; та же модель подходит для любого имени.
  prs.a1.unit02.lesson02.exercise01.recognize_origin_question:
    instruction: Какая фраза спрашивает, откуда человек родом?
    correct_option: Откуда вы?
    distractors:
    - Кем вы работаете?
    - Как вас зовут?
    - Как у вас дела? (вежливо)
    accepted_answers:
    - value: Откуда вы?
      status: correct
    feedback: شما از کجا استین؟ — вопрос о происхождении; используются از («из») и کجا («где, откуда»).
  prs.a1.unit02.lesson02.exercise02.recognize_city_names:
    instruction: Что из этого — город в Афганистане?
    correct_option: هرات
    distractors:
    - افغانستان
    - شهر
    - کار
    accepted_answers:
    - value: هرات
      status: correct
    feedback: هرات — город; افغانستان — страна, а شهر — общее слово «город».
  prs.a1.unit02.lesson02.exercise03.recognize_origin_question_reading:
    instruction: О чём спрашивает этот вопрос?
    correct_option: Откуда вы?
    distractors:
    - Кем вы работаете?
    - Как вас зовут?
    - А вы?
    accepted_answers:
    - value: Откуда вы?
      status: correct
    feedback: شما از کجا استین؟ — вопрос о том, откуда ты родом.
  prs.a1.unit02.lesson02.exercise04.match_cities:
    instruction: Соедини каждое место с его русским названием.
    accepted_answers:
    - value:
        کابل: Кабул
        هرات: Герат
        مزار شریف: Мазари-Шариф
        افغانستان: Афганистан
      status: correct
    feedback: کابل، هرات и مزار شریف — города; افغانستان — страна.
    pairs:
    - left: کابل
      right: Кабул
    - left: هرات
      right: Герат
    - left: مزار شریف
      right: Мазари-Шариф
    - left: افغانستان
      right: Афганистан
  prs.a1.unit02.lesson02.exercise05.order_origin_answer:
    instruction: Составь из слов фразу «Я из Кабула».
    accepted_answers:
    - value:
      - من
      - از
      - کابل
      - استم
