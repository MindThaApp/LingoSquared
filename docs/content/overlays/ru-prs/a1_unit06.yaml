    title: Основные слова направлений
  prs.a1.unit06.lesson02.giving_turn_instructions:
    title: Указываем повороты
  prs.a1.unit06.lesson03.sequencing_directions:
    title: Объясняем маршрут по шагам
  prs.a1.unit06.lesson04.politely_asking_directions:
    title: Вежливо спрашиваем дорогу
  prs.a1.unit06.lesson05.landmark_directions:
    title: Объясняем дорогу по ориентирам
  prs.a1.unit06.lesson06.giving_directions_dialogue:
    title: Находим путь к аптеке
teaching:
  prs.a1.unit06.lesson01.teach.straight:
    title: Прямо
    gloss: прямо
    note: مستقیم означает движение прямо вперёд.
    example_gloss: Идите прямо.
  prs.a1.unit06.lesson01.teach.left:
    title: Лево
    gloss: налево
    note: چپ — это направление «лево».
    example_gloss: Поверни налево.
  prs.a1.unit06.lesson01.teach.right:
    title: Право
    gloss: направо
    note: راست — это направление «право».
    example_gloss: Поверни направо.
  prs.a1.unit06.lesson01.teach.turn_verb:
    title: Поверните (вежливое повелительное)
    gloss: поверните
    note: بپیچین — вежливая повелительная форма глагола «поворачивать»; её используют, объясняя кому-то дорогу.
    example_gloss: Поверни направо.
  prs.a1.unit06.lesson01.teach.to_word:
    title: К / в сторону
    gloss: к / в сторону
    note: به сочетается со словом направления, как в به چپ («налево»).
    target_text: به (к / в сторону)
  prs.a1.unit06.lesson02.teach.go_straight:
    title: Сказать, чтобы шли прямо
    gloss: Иди прямо.
    note: مستقیم بروین — основное указание направления в вежливой повелительной форме.
  prs.a1.unit06.lesson02.teach.turn_left:
    title: Сказать, чтобы повернули налево
    gloss: Поверни налево.
    note: به چپ بپیچین буквально значит «поверните налево».
  prs.a1.unit06.lesson02.teach.turn_right:
    title: Сказать, чтобы повернули направо
    gloss: Поверни направо.
    note: به راست بپیچین строится так же, только вместо چپ стоит راست.
  prs.a1.unit06.lesson03.teach.first_word:
    title: Сначала
    gloss: сначала
    note: اول отмечает первый шаг в последовательности указаний.
    example_gloss: Сначала идите прямо.
  prs.a1.unit06.lesson03.teach.then_word:
    title: Потом
    gloss: тогда
    note: بعد отмечает следующий шаг после первого.
    example_gloss: Потом поверни налево.
  prs.a1.unit06.lesson03.teach.sequenced_example:
    title: Соединяем два шага маршрута
    gloss: Сначала идите прямо, потом поверните направо.
    note: С помощью اول и بعد можно выстроить в одном указании несколько шагов маршрута.
  prs.a1.unit06.lesson04.teach.polite_ask:
    title: Вежливо спросить, как куда-то добраться
    gloss: Не могли бы вы подсказать, как пройти на рынок?
    note: می‌توانین بگویین...؟ — вежливый способ спросить «Не могли бы вы сказать...?»; подходит, чтобы спросить дорогу у незнакомого человека. بروم значит «я иду», так что вся фраза спрашивает, как мне туда добраться.
  prs.a1.unit06.lesson04.teach.bebakhshid_review:
    title: Спрашиваем, где находится место (повторение)
    gloss: Извините, где находится аптека?
    note: ببخشین، [place] کجاست؟ мы уже проходили в уроках о местах; это естественное начало перед вопросом о дороге.
  prs.a1.unit06.lesson04.teach.fahmidam:
    title: Подтвердить, что вы поняли
    gloss: Большое спасибо, я понял.
    note: تشکر زیاد، فهمیدم вежливо завершает разговор и подтверждает, что объяснение было понятным.
  prs.a1.unit06.lesson04.teach.daftar_review:
    title: Офис (повторение)
    gloss: офис
    note: دفتر уже встречалось в одном из прошлых уроков; здесь это место назначения для отработки вежливого вопроса о дороге.
    example_gloss: Офис близко.
  prs.a1.unit06.lesson05.teach.after_word:
    title: После
    gloss: после
    note: بعد از указывает на ориентир, который находится перед пунктом назначения.
    example_gloss: После мечети будет банк.
  prs.a1.unit06.lesson05.teach.opposite_review:
    title: Напротив
    gloss: напротив
    note: روبه‌رو — новый синоним слова مقابل («напротив»), которое мы проходили в уроках о местах; в повседневном дари используются оба.
    example_gloss: Банк напротив мечети.
  prs.a1.unit06.lesson05.teach.landmark_example:
    title: Объяснить дорогу по ориентиру
    gloss: После мечети банк будет напротив вас.
    note: بعد از مسجد، بانک روبه‌روی شماست сочетает ориентир (بعد از مسجد) с указанием относительного положения (روبه‌روی شماست).
  prs.a1.unit06.lesson05.teach.maktab_review:
    title: Школа (повторение)
    gloss: школа
    note: مکتب мы проходили в уроках о местах; здесь это слово служит ориентиром в тренировочном предложении.
    example_gloss: Школа близко.
  prs.a1.unit06.lesson06.teach.turn01:
    title: Сohaila спрашивает дорогу
    gloss: Сохайла вежливо спрашивает продавца, как пройти в аптеку.
    note: ببخشین начинает вопрос уважительно, а می‌توانین بگویین؟ — вежливая фраза для вопроса о дороге из урока 4.
  prs.a1.unit06.lesson06.teach.turn02:
    title: Продавец называет первый шаг
    gloss: Продавец отвечает утвердительно и говорит сначала идти прямо.
    note: اول مستقیم بروین начинает цепочку указаний.
  prs.a1.unit06.lesson06.teach.turn03:
    title: Сохайла подтверждает и спрашивает, что дальше
    gloss: Сохайла повторяет «прямо», чтобы подтвердить, и спрашивает, что дальше.
    note: بعد چطور؟ — естественный и краткий способ спросить о следующем шаге.
  prs.a1.unit06.lesson06.teach.turn04:
    title: Продавец называет второй шаг и ориентир
    gloss: Продавец говорит повернуть налево, а затем указывает, где аптека, по ориентирам — мечети и банку.
    note: Здесь соединяются указание поворота из урока 2 и образец с ориентиром из урока 5.
  prs.a1.unit06.lesson06.teach.turn05:
    title: Сохайла благодарит и говорит, что поняла
    gloss: Сохайла горячо благодарит и говорит, что поняла.
    note: تشکر زیاد، فهمیدم завершает разговор, как мы разбирали в уроке 4.
  prs.a1.unit06.lesson06.teach.turn06:
    title: Скромный ответ продавца и пожелание на дорогу
    gloss: Продавец скромно отвечает на благодарность и желает ей доброго пути.
    note: قابلی نداره мы проходили в уроках о местах; سفر خوش («доброго пути») — естественное пожелание тому, кто собирается идти куда-то.
