course:
  title: Дари A2
  description: 'Дари Афганистана, уровень ниже среднего: разговор о привычках в интернете — лексика о соцсетях и времени за экраном, простое выражение мнения, чтение о времени за экраном и живая беседа двух друзей об их собственных привычках.'
units:
  prs.a2.unit16.online_habits:
    title: Привычки в интернете
lessons:
  prs.a2.unit16.lesson01.online_habits_vocabulary:
    title: Слова об интернет-привычках
  prs.a2.unit16.lesson02.describing_and_giving_an_opinion:
    title: Описание и выражение мнения
  prs.a2.unit16.lesson03.reading_about_screen_time:
    title: Читаем о времени за экраном
  prs.a2.unit16.lesson04.friends_dialogue:
    title: Разговор друзей
teaching:
  prs.a2.unit16.lesson01.teach.social_media_word:
    title: Социальные сети
    gloss: социальные сети
    note: '*شبکهٔ اجتماعی* буквально значит «социальная сеть».'
    example_gloss: Зармина каждый день сидит в соцсетях.
  prs.a2.unit16.lesson01.teach.video_word:
    title: Видео
    gloss: видео
    note: '*ویدیو* — прямое заимствование, как и русское «видео».'
    example_gloss: Хумайун любит смотреть видео.
  prs.a2.unit16.lesson01.teach.download_word:
    title: Скачивание
    gloss: скачивать
    note: '*دانلود کردن* — *دانلود* заимствованное слово, которое сочетается с *کردن* («делать»).'
    example_gloss: Я скачиваю музыку.
  prs.a2.unit16.lesson01.teach.messaging_app_word:
    title: Мессенджер
    gloss: мессенджер
    note: '*پیام‌رسان* буквально значит «передатчик сообщений».'
    example_gloss: Я пишу друзьям в мессенджере.
  prs.a2.unit16.lesson01.teach.computer_game_word:
    title: Компьютерная игра
    gloss: компьютерная игра
    note: '*بازی کمپیوتری* — *بازی* значит «игра», а *کمپیوتری* — «компьютерный».'
    example_gloss: Хумайун играет в компьютерные игры.
  prs.a2.unit16.lesson01.teach.free_time_word:
    title: Свободное время
    gloss: свободное время
    note: '*وقت آزاد* — *وقت* значит «время», а *آزاد* — «свободный».'
    example_gloss: В свободное время я сижу в соцсетях.
  prs.a2.unit16.lesson01.teach.usually_grammar:
    title: «Обычно» — معمولاً
    gloss: Обычно в свободное время я сижу в соцсетях.
    note: '*معمولاً* («обычно») — первое наречие частотности уровня A2 в этом уроке.'
  prs.a2.unit16.lesson01.teach.sometimes_grammar:
    title: «Иногда» — بعضی اوقات
    gloss: Иногда это отнимает слишком много времени.
    note: '*بعضی اوقات* («иногда») — второе наречие частотности в этом уроке, противопоставленное *معمولاً*.'
  prs.a2.unit16.lesson01.teach.va_word:
    title: И
    gloss: и
    note: '*و* («и») — обычный соединительный союз, которым в этом уроке связываются части предложения.'
    target_text: و (и)
  prs.a2.unit16.lesson01.teach.every_day_grammar:
    title: «Каждый день» — هر روز
    gloss: Я каждый день сижу в соцсетях.
    note: '*هر روز* значит «каждый день»; само по себе *روز* — «день».'
  prs.a2.unit16.lesson02.teach.ask_how_much_time:
    title: Спросить, сколько времени человек проводит
    gloss: Сколько времени ты проводишь в соцсетях?
    note: '*تو* — неформальное «ты», которое используют между друзьями, в отличие от вежливых форм *شما*/-*ین*, которые в этом курсе употребляются с незнакомыми людьми.'
  prs.a2.unit16.lesson02.teach.opinion_phrase:
    title: Высказать простое мнение
    gloss: По-моему, интернет полезен, но иногда отнимает слишком много времени.
    note: Снова используется уже знакомая модель выражения мнения *به نظر من* («по моему мнению») из урока 10.
  prs.a2.unit16.lesson02.teach.limit_use_phrase:
    title: Сказать, что нужно ограничивать пользование
    gloss: Нам нужно ограничить своё время.
    note: '*محدود کردن* значит «ограничивать».'
  prs.a2.unit16.lesson02.teach.mostly_word:
    title: Mostly
    gloss: в основном
    note: '*بیشتر* здесь значит «в основном» (а вообще ещё и «больше»).'
    target_text: بیشتر (в основном)
  prs.a2.unit16.lesson03.teach.user_word:
    title: Пользователь
    gloss: пользователь
    note: '*کاربر* — общее слово для пользователя приложения, устройства или сервиса.'
    example_gloss: Многие пользователи каждый день пользуются телефоном.
  prs.a2.unit16.lesson03.teach.limit_word:
    title: Ограничивать
    gloss: ограничивать
    note: '*محدود کردن* — то же выражение, что и в предыдущем уроке, но здесь оно употреблено в общем утверждении о людях, а не о «нас».'
    example_gloss: Некоторые люди ограничивают своё время.
  prs.a2.unit16.lesson03.teach.article_text:
    title: Короткая статья о времени за экраном
    gloss: Многие люди несколько часов в день пользуются соцсетями. Некоторые ограничивают своё время, чтобы больше времени оставалось семье и друзьям.
    note: Короткий информационный текст в том стиле, который изучается в этом уроке.
  prs.a2.unit16.lesson04.teach.turn01:
    title: همایون спрашивает زرمینه о времени, проводимом в сети
    gloss: همایون спрашивает زرمینه, сколько времени она проводит в соцсетях.
    note: Тот же вопрос, что в предыдущем уроке, и неформальное *تو*, уже знакомое по этой паре друзей.
  prs.a2.unit16.lesson04.teach.turn02:
    title: زرمینه отвечает и спрашивает в ответ
    gloss: Обычно час в день. Она задаёт ему тот же вопрос.
    note: '*چطور* здесь значит «а ты?» / «а у тебя как?».'
  prs.a2.unit16.lesson04.teach.turn03:
    title: همایون рассказывает о своей привычке
    gloss: Он в основном смотрит видео. Может быть, два часа в день.
    note: '*بیشتر* здесь значит «в основном».'
  prs.a2.unit16.lesson04.teach.turn04:
    title: زرمینه высказывает своё мнение
    gloss: По её мнению, это слишком много.
    note: Снова модель выражения мнения *به نظر من* из предыдущего урока.
  prs.a2.unit16.lesson04.teach.turn05:
    title: همایون соглашается, но говорит, что ему это нравится
    gloss: Возможно, но ему это нравится.
    note: '*لذت می‌برم* значит «я получаю удовольствие (от этого)».'
  prs.a2.unit16.lesson04.teach.turn06:
    title: زرمینه предлагает ограничить пользование
    gloss: Она говорит, что иногда нам нужно ограничивать своё время.
    note: Снова точно та же форма *محدود کنیم* из предыдущего урока.
  prs.a2.unit16.lesson04.teach.turn07:
    title: همایون соглашается пользоваться меньше
    gloss: Верно. Со следующего дня он будет пользоваться меньше.
    note: '*کمتر* значит «меньше».'
  prs.a2.unit16.lesson04.teach.turn08:
    title: زرمینه одобряет
    gloss: زرمینه говорит, что это здорово.
    note: '*عالی است!* — распространённый способ сказать «замечательно!».'
