course:
  title: Дари A2
  description: 'Афганский дари, уровень ниже среднего: официальная запись на приём в муниципалитет для регистрации нового адреса — лексика, запись на приём, чтение официального объявления и сам приём.'
units:
  prs.a2.unit09.bureaucracy:
    title: Административные дела
lessons:
  prs.a2.unit09.lesson01.bureaucracy_vocabulary:
    title: Слова для общения в учреждении
  prs.a2.unit09.lesson02.making_an_appointment:
    title: Запись на приём
  prs.a2.unit09.lesson03.reading_the_notice:
    title: Читаем объявление
  prs.a2.unit09.lesson04.at_the_municipality_office:
    title: В муниципалитете
teaching:
  prs.a2.unit09.lesson01.teach.vaght_word:
    title: Встреча
    gloss: приём / время приёма
    note: '*وقت* буквально означает «время»; *وقت گرفتن* (взять время приёма) — обычный способ сказать «записаться на приём».'
  prs.a2.unit09.lesson01.teach.sanad_word:
    title: Документ
    gloss: документ
    note: '*سند* — общее слово для официального документа.'
  prs.a2.unit09.lesson01.teach.address_word:
    title: Адрес
    gloss: адрес
    note: '*آدرس* — обычное слово для домашнего адреса.'
  prs.a2.unit09.lesson01.teach.tazkira_word:
    title: Удостоверение личности
    gloss: удостоверение личности (тазкира)
    note: '*تذکره* — документ, который обновляют в этом уроке, — это афганское национальное удостоверение личности в виде книжечки; это отдельный документ, не то же самое, что иранская *کارت ملی*.'
  prs.a2.unit09.lesson01.teach.municipality_word:
    title: Муниципалитет
    gloss: муниципалитет
    note: '*شاروالی* — афганское название городского муниципалитета; в иранском фарси для этого используется другое слово — *شهرداری*.'
  prs.a2.unit09.lesson01.teach.va_word:
    title: И
    gloss: и
    note: '*و* — распространённый соединительный союз, который встречается во всём этом уроке.'
    target_text: و (и)
  prs.a2.unit09.lesson02.teach.request_appointment:
    title: Просим записать на приём
    gloss: Я хотел бы записаться на приём по поводу смены адреса.
    note: '*می‌خواستم* (буквально «я хотел») смягчает просьбу и делает её вежливой.'
  prs.a2.unit09.lesson02.teach.because_moved:
    title: Объясняем причину с помощью چون («потому что»)
    gloss: Поскольку я сменил жильё, мне нужно изменить адрес.
    note: '*چون* («потому что») вводит придаточное причины, после которого идёт следствие.'
  prs.a2.unit09.lesson02.teach.what_should_i_bring:
    title: Вежливо спрашиваем, что принести
    gloss: Не могли бы вы сказать, что мне нужно принести?
    note: '*می‌شود بگویین...؟* («не могли бы вы сказать...?») — вежливая форма косвенного вопроса.'
  prs.a2.unit09.lesson03.teach.rent_receipt_word:
    title: Квитанция об оплате аренды
    gloss: квитанция об оплате аренды жилья
    note: '*رسید کرایه خانه* — квитанция об оплате аренды жилья, один из документов, принимаемых как подтверждение места проживания.'
  prs.a2.unit09.lesson03.teach.deadline_word:
    title: Срок
    gloss: крайний срок
    note: '*مهلت* — общее слово для крайнего срока или временного ограничения.'
  prs.a2.unit09.lesson03.teach.notice_text:
    title: Объявление в учреждении о смене адреса
    gloss: Для смены адреса, пожалуйста, принесите удостоверение личности (тазкира) и квитанцию об оплате аренды жилья. Срок регистрации — до конца этого месяца.
    note: Короткое официальное объявление в формальном письменном стиле, которому учит этот урок.
  prs.a2.unit09.lesson03.teach.i_will_bring_receipt:
    title: Говорим, что принесём
    gloss: Я принесу квитанцию об оплате аренды.
    note: '*می‌آورم* означает «я приношу» / «я принесу».'
  prs.a2.unit09.lesson04.teach.turn01:
    title: Служащий приветствует Карима
    gloss: Служащий приглашает его войти и спрашивает, чем может ему помочь.
    note: '*بفرمایین* приглашает подойти; *چه خدمتی می‌توانم برایتان انجام بدهم؟* — вежливый официальный способ предложить помощь, как это делает служащий.'
  prs.a2.unit09.lesson04.teach.turn02:
    title: Карим просит записать его на приём
    gloss: Карим говорит, что хотел бы записаться на приём по поводу смены адреса.
    note: Та же вежливая просьба с *می‌خواستم*, что и раньше.
  prs.a2.unit09.lesson04.teach.turn03:
    title: Служащий спрашивает, с каких пор
    gloss: Служащий спрашивает, с каких пор он живёт в новом доме.
    note: '*از کی...؟* означает «с каких пор?».'
  prs.a2.unit09.lesson04.teach.turn04:
    title: Карим отвечает и спрашивает, что принести
    gloss: Он отвечает, что с прошлого месяца, и спрашивает, что ему нужно принести.
    note: Сочетание *از ماه گذشته* («с прошлого месяца») и вежливого вопроса *می‌شود بگویین...؟*.
  prs.a2.unit09.lesson04.teach.turn05:
    title: Служащий перечисляет документы
    gloss: Служащий говорит, что достаточно удостоверения личности (тазкира) и квитанции об оплате аренды.
    note: '*کافی است* означает «достаточно».'
  prs.a2.unit09.lesson04.teach.turn06:
    title: Карим предлагает день
    gloss: Он спрашивает, можно ли прийти во вторник.
    note: '*می‌توانم...؟* спрашивает о возможности или разрешении.'
  prs.a2.unit09.lesson04.teach.turn07:
    title: Служащий подтверждает и называет номер для отслеживания
    gloss: 'Служащий подтверждает вторник, десять часов, и называет номер для отслеживания: три тысячи пятьдесят.'
    note: '*نمبر پیگیری* — номер для отслеживания записи на приём. *نمبر* — распространённое в Афганистане заимствованное слово («номер»), оно соединено с *پیگیری* («отслеживание»). *بلی* — слово «да» в дари.'
