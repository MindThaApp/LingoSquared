  prs.a1.unit53.lesson05.teach.review_he_exhibition_photo_object_interesting:
    title: 'Повторение: он/она, выставка, фотография, показатель прямого объекта, интересный'
    gloss: он/она / выставка / фотография / (показатель прямого объекта) / интересный
    note: 'Это слова для повторения: они встречаются в тексте для чтения.'
    target_text: او (он, она) / نمایشگاه (выставка) / عکس (фото) / را (маркер прямого дополнения) / جالب (интересный)
