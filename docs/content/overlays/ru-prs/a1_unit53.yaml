    title: Увидел(а)
    gloss: увидел(а)
    note: Это форма прошедшего времени 3-го лица от того же глагола, который ты уже изучал(а) в значении «я увидел(а)».
    example_gloss: Он/она увидел(а) выставку.
  prs.a1.unit53.lesson05.teach.reading_passage:
    title: Читаем о музее
    gloss: Хумайун в музее. Он увидел фотовыставку. Выставка интересная.
