    note: Союз «но» противопоставляет время открытия и время закрытия музея.
  prs.a1.unit53.lesson06.teach.review_your_ticket_how_much:
    title: 'Повторение: ваш билет, сколько'
    gloss: ваш билет / сколько
    note: «Ваш билет» образуется с тем же вежливым суффиксом, что «ваш билет в бассейн» в уроке 50 и «ваш билет в кино» в уроке 52.
    target_text: تکت‌تان (ваш билет) / چند (сколько)
  prs.a1.unit53.lesson06.teach.your_ticket_question_phrase:
    title: Сколько стоит ваш билет?
    gloss: Сколько стоит ваш билет?
    note: Это вежливый вопрос о цене билета в музей с суффиксом.
