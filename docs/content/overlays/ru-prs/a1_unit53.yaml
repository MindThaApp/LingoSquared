course:
  title: Дари A1
  description: 'Начальный кабульский дари: посетите музей, прочитайте о выставке и цене билета, купите входной билет, спросите о часах работы и просто расскажите о том, что вы увидели.'
units:
  prs.a1.unit53.museum:
    title: Музей
    description: Сходи в музей, купи входной билет, спроси о выставке или часах работы и просто расскажи о том, что ты увидел.
lessons:
  prs.a1.unit53.lesson01.museum_and_staff_vocabulary:
    title: Музей и сотрудник
  prs.a1.unit53.lesson02.exhibition_and_ticket_price:
    title: Выставка и цена билета
  prs.a1.unit53.lesson03.asking_about_the_exhibition_and_getting_a_ticket:
    title: Вопрос о выставке и покупка билета
  prs.a1.unit53.lesson04.museum_dialogue:
    title: Диалог в музее
  prs.a1.unit53.lesson05.reading:
    title: Читаем о музее
  prs.a1.unit53.lesson06.wrap_up:
    title: Итоги
teaching:
  prs.a1.unit53.lesson01.teach.review_this_is_in_good:
    title: 'Повторение: этот, есть, в, хороший'
    gloss: этот / есть / в / хороший
    note: Это слова для повторения (они встречаются на протяжении всего курса), с их помощью мы говорим о музее.
    target_text: این (этот, это) / است (есть, является) / در (в) / خوب (хороший)
  prs.a1.unit53.lesson01.teach.museum_word:
    title: Музей
    gloss: музей
    note: Это обычное слово афганского дари для музея; в иранском персидском говорят موزه.
    example_gloss: Музей хороший.
  prs.a1.unit53.lesson01.teach.review_staff_word:
    title: 'Повторение: сотрудник'
    gloss: сотрудник
    note: Это то же общее слово для сотрудника, которое уже встречалось в темах о кинотеатре и бассейне; здесь оно относится к кассе музея.
    target_text: کارمند (сотрудник)
  prs.a1.unit53.lesson01.teach.this_is_museum_phrase:
    title: Это музей
    gloss: Это музей.
    note: Здесь соединяются слова «этот», «есть» и «музей» так же, как эти слова соединяются в других местах курса.
  prs.a1.unit53.lesson01.teach.staff_at_museum_phrase:
    title: Сотрудник в музее
    gloss: Сотрудник в музее.
    note: Здесь соединяются слова «сотрудник», «в» и «музей».
  prs.a1.unit53.lesson02.teach.review_price_and_exhibit_words:
    title: 'Повторение: сколько, афгани, есть, сорок, в, фото, интересный, билет'
    gloss: сколько / афгани / есть / сорок / в / фото / интересный / билет
    note: Это слова для повторения (из предыдущих уроков), с их помощью мы говорим о цене и выставке в музее.
    target_text: چند (сколько) / افغانی (афгани) / است (есть, является) / چهل (сорок) / در (в) / عکس (фото) / جالب (интересный) / تکت (билет)
  prs.a1.unit53.lesson02.teach.exhibition_word:
    title: Выставка
    gloss: выставка
    note: 'Это обычное слово дари и персидского для выставки: نمایش (показ) плюс گاه (место).'
    example_gloss: Фотовыставка интересная.
  prs.a1.unit53.lesson02.teach.museum_notice_reading:
    title: Читаем объявление в музее
    gloss: В музее проходит фотовыставка. Билет стоит 40 афгани.
  prs.a1.unit53.lesson02.teach.ask_museum_ticket_price_phrase:
    title: Сколько стоит билет в музей?
    gloss: Сколько стоит билет в музей?
    note: Здесь соединяются слова, изученные раньше в этом уроке.
  prs.a1.unit53.lesson02.teach.museum_ticket_price_answer_phrase:
    title: Билет стоит 40 афгани
    gloss: Билет стоит 40 афгани.
    note: Здесь названа цена билета в музей из объявления.
  prs.a1.unit53.lesson03.teach.review_ask_want_setup:
    title: 'Повторение: вы (вежливо), что это, я, я хочу, один'
    gloss: вы (вежливо) / что это / я / я хочу / один
    note: 'Это слова для повторения: с ними можно спросить и сказать, что тебе нужно.'
    target_text: شما (вы, вежливо) / چیست (что это) / من (я) / می‌خواهم (я хочу) / یک (один, какой-то)
  prs.a1.unit53.lesson03.teach.review_exhibition_word:
    title: 'Повторение: выставка'
    gloss: выставка
    note: Это слово для повторения, с ним можно спросить, что за выставка.
    target_text: نمایشگاه (выставка)
  prs.a1.unit53.lesson03.teach.ask_exhibition_phrase:
    title: Что это за выставка?
    gloss: Что это за выставка?
    note: Здесь снова используется уже знакомая в этом курсе модель вопроса «что это?», теперь о выставке.
  prs.a1.unit53.lesson03.teach.exhibition_is_photos_phrase:
    title: Выставка фотографий
    gloss: Выставка фотографий.
    note: Здесь названа тема выставки.
  prs.a1.unit53.lesson03.teach.review_ticket_please:
    title: 'Повторение: билет, пожалуйста'
    gloss: билет / пожалуйста
    note: Это слова для повторения, с ними можно попросить билет.
    target_text: تکت (билет) / لطفاً (пожалуйста)
  prs.a1.unit53.lesson03.teach.want_ticket_please_phrase:
    title: Один билет, пожалуйста
    gloss: Один билет, пожалуйста.
    note: Здесь соединяются слова «билет», «хочу» и «пожалуйста».
  prs.a1.unit53.lesson04.teach.review_hello_want_ticket:
    title: 'Повторение: здравствуйте, один, билет, я хочу'
    gloss: здравствуйте / один / билет / я хочу
    note: Это слова для повторения, с них начинается диалог.
    target_text: سلام (здравствуйте) / یک (один, какой-то) / تکت (билет) / می‌خواهم (я хочу)
  prs.a1.unit53.lesson04.teach.review_welcome_open_hours:
    title: 'Повторение: пожалуйста (возьмите), музей, с, час, девять, открыт'
    gloss: пожалуйста (возьмите) / музей / с / час / девять / открыт
    note: Это слова для повторения, с их помощью называют час открытия музея.
    target_text: بفرمایین (пожалуйста, возьмите) / موزیم (музей) / از (с, от) / ساعت (час, в … часов) / نه (девять) / باز (открыт)
  prs.a1.unit53.lesson04.teach.review_ask_exhibition:
    title: 'Повторение: выставка, что это'
    gloss: выставка / что это
    note: Это слова для повторения, с их помощью спрашивают о выставке.
    target_text: نمایشگاه (выставка) / چیست (что это)
  prs.a1.unit53.lesson04.teach.review_photos_and_price:
    title: 'Повторение: фото, сорок, афгани, есть'
    gloss: фото / сорок / афгани / есть
    note: 'Это слова для повторения: с их помощью называют тему выставки и цену билета.'
    target_text: عکس (фото) / چهل (сорок) / افغانی (афгани) / است (есть, является)
  prs.a1.unit53.lesson04.teach.review_thanks_welcome:
    title: 'Повторение: большое спасибо, пожалуйста'
    gloss: большое спасибо / пожалуйста
    note: 'Это слова для повторения: с их помощью завершают диалог.'
    target_text: تشکر زیاد (большое спасибо) / خواهش می‌کنم (не за что)
  prs.a1.unit53.lesson04.teach.dialogue_line1:
    title: 'Хумайун: Здравствуйте. Мне нужен билет.'
    gloss: Здравствуйте. Мне нужен билет.
  prs.a1.unit53.lesson04.teach.dialogue_line2:
    title: 'Сотрудник: Здравствуйте, прошу вас. Музей открыт с девяти.'
    gloss: Здравствуйте, прошу вас. Музей открыт с девяти.
  prs.a1.unit53.lesson04.teach.dialogue_line3:
    title: 'Хумайун: Что за выставка?'
    gloss: Что за выставка?
  prs.a1.unit53.lesson04.teach.dialogue_line4:
    title: 'Сотрудник: Это фотовыставка. Билет стоит 40 афгани.'
    gloss: Это фотовыставка. Билет стоит 40 афгани.
  prs.a1.unit53.lesson04.teach.dialogue_line5:
    title: 'Хумайун: Большое спасибо.'
    gloss: Большое спасибо.
  prs.a1.unit53.lesson04.teach.dialogue_line6:
    title: 'Сотрудник: Пожалуйста.'
    gloss: Пожалуйста.
  prs.a1.unit53.lesson05.teach.review_this_is_in_museum:
    title: 'Повторение: этот, есть, в, музей'
    gloss: этот / есть, является / в / музей
    note: 'Это слова для повторения: они встречаются в тексте для чтения.'
