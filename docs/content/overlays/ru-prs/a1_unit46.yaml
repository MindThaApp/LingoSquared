course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: попросить в аптеке простое лекарство, описать несложный симптом (головная боль, боль в животе или зубная боль), попросить таблетку или сироп и понять простое указание по дозировке.'
units:
  prs.a1.unit46.pharmacy:
    title: Аптека и лекарства
    description: Попросить у фармацевта простое лекарство, описать несложный симптом, попросить таблетку или сироп и понять простое указание по дозировке.
lessons:
  prs.a1.unit46.lesson01.pharmacy_and_pharmacist_vocabulary:
    title: Аптека и фармацевт
  prs.a1.unit46.lesson02.symptom_vocabulary:
    title: Головная боль, боль в животе и зубная боль
  prs.a1.unit46.lesson03.medicine_forms:
    title: Таблетка и сироп
  prs.a1.unit46.lesson04.pharmacy_dialogue:
    title: Диалог в аптеке
  prs.a1.unit46.lesson05.reading:
    title: Читаем рецепт
  prs.a1.unit46.lesson06.wrap_up:
    title: Итоги
teaching:
  prs.a1.unit46.lesson01.teach.review_this_is_in:
    title: 'Повторение: этот, есть, в'
    gloss: этот / есть, является / в
    note: این, است и در (они встречаются во всём курсе) — слова для повторения, с их помощью можно говорить об аптеке.
    target_text: این (этот) / است (есть, является) / در (в)
  prs.a1.unit46.lesson01.teach.pharmacy_word:
    title: Аптека
    gloss: аптека
    note: دواخانه буквально означает «дом лекарств» — слово образовано так же, как کتابخانه («дом книг», библиотека, урок 43).
    example_gloss: Это аптека.
  prs.a1.unit46.lesson01.teach.this_is_pharmacy_phrase:
    title: Это аптека
    gloss: Это аптека.
    note: این دواخانه است складывается из слов, изученных ранее в этом уроке.
  prs.a1.unit46.lesson01.teach.pharmacist_word:
    title: Фармацевт
    gloss: фармацевт
    note: دواساز буквально означает «делающий лекарства».
    example_gloss: Фармацевт в аптеке.
  prs.a1.unit46.lesson01.teach.pharmacist_in_pharmacy_phrase:
    title: Фармацевт в аптеке
    gloss: Фармацевт в аптеке.
    note: دواساز در دواخانه است складывается из слов دواساز (фармацевт) и دواخانه (аптека).
  prs.a1.unit46.lesson01.teach.review_medicine_want:
    title: 'Повторение: лекарство, я хочу'
    gloss: лекарство / я хочу
    note: دوا и می‌خواهم — слова для повторения, с их помощью просят лекарство.
    target_text: دوا (лекарство) / می‌خواهم (я хочу)
  prs.a1.unit46.lesson01.teach.want_medicine_phrase:
    title: Мне нужно лекарство
    gloss: Мне нужно лекарство.
    note: دوا می‌خواهم складывается из слов دوا (лекарство) и می‌خواهم (я хочу).
  prs.a1.unit46.lesson02.teach.review_headache_stomachache_have:
    title: 'Повторение: головная боль, боль в животе, у меня есть, у вас есть'
    gloss: головная боль / боль в животе / у меня есть / у вас есть (вежливо)
    note: سردرد, دل‌درد, دارم и دارین — слова для повторения, с их помощью описывают симптом.
    target_text: سردرد (головная боль) / دل‌درد (боль в животе) / دارم (у меня есть) / دارین (у вас есть, вежливо)
  prs.a1.unit46.lesson02.teach.review_very_yes_no:
    title: 'Повторение: очень, да, нет'
    gloss: очень / да / нет
    note: بسیار, بلی и نخیر (из прошлых уроков) — слова для повторения, с их помощью отвечают на вопрос о симптоме.
    target_text: بسیار (очень) / بلی (да) / نخیر (нет)
  prs.a1.unit46.lesson02.teach.toothache_word:
    title: Зубная боль
    gloss: зубная боль
    note: دندان‌درد состоит из دندان (зуб, урок 42) и той же части -درد («боль»), что и в словах سردرد и دل‌درد.
    example_gloss: У меня болит зуб.
  prs.a1.unit46.lesson02.teach.severe_toothache_phrase:
    title: У меня сильно болит зуб
    gloss: У меня сильно болит зуб.
    note: В بسیار دندان‌درد دارم слово بسیار («очень») усиливает симптом.
  prs.a1.unit46.lesson02.teach.do_you_have_headache_phrase:
    title: У вас болит голова?
    gloss: У вас болит голова?
    note: سردرد دارین؟ — вопрос, на который отвечают «да» или «нет»; он образуется повышением интонации, без отдельного вопросительного слова.
  prs.a1.unit46.lesson02.teach.no_toothache_phrase:
    title: Нет, у меня болит зуб
    gloss: Нет, у меня болит зуб.
    note: نخیر — это ответ на предыдущий вопрос, и тут же названа настоящая жалоба.
  prs.a1.unit46.lesson03.teach.review_want_one:
    title: 'Повторение: я хочу, один/одна'
    gloss: я хочу / один, одна, одно
    note: 'Слова می‌خواهم и یک (из прежних уроков) повторяются здесь: с их помощью просят нужную форму лекарства.'
    target_text: می‌خواهم (я хочу) / یک (один)
  prs.a1.unit46.lesson03.teach.tablet_word:
    title: Таблетка
    gloss: таблетка
    note: قرص — обычное дарийское слово для таблетки.
    example_gloss: Мне нужна таблетка.
  prs.a1.unit46.lesson03.teach.want_tablet_phrase:
    title: Мне нужна таблетка
    gloss: Мне нужна таблетка.
    note: یک قرص می‌خواهم состоит из یک («один») и قرص («таблетка»).
  prs.a1.unit46.lesson03.teach.syrup_word:
    title: Сироп
    gloss: сироп
    note: شربت — обычное дарийское слово для жидкого лекарства, сиропа.
    example_gloss: Мне нужен сироп.
  prs.a1.unit46.lesson03.teach.want_syrup_phrase:
    title: Мне нужен сироп
    gloss: Мне нужен сироп.
    note: شربت می‌خواهم состоит из شربت («сироп») и می‌خواهم («я хочу»).
  prs.a1.unit46.lesson03.teach.review_which_medicine_want_polite:
    title: 'Повторение: какой, лекарство, вы хотите (вежливо)'
    gloss: какой / лекарство / вы хотите (вежливо)
    note: 'Слова کدام, دوا и می‌خواهین повторяются здесь: с их помощью спрашивают покупателя, что ему нужно.'
    target_text: کدام (какой) / دوا (лекарство) / می‌خواهین (вы хотите, вежливо)
  prs.a1.unit46.lesson03.teach.which_medicine_phrase:
    title: Какое лекарство вы хотите?
    gloss: Какое лекарство вам нужно?
    note: کدام دوا می‌خواهین؟ — вежливый вопрос, который задаёт аптекарь.
  prs.a1.unit46.lesson04.teach.review_hello_stomachache_have:
    title: 'Повторение: здравствуйте, боль в животе, у меня есть'
    gloss: здравствуйте / боль в животе / у меня есть
    note: 'Слова سلام, دل‌درد и دارم (из прежних уроков) повторяются здесь: с них начинается диалог.'
    target_text: سلام (здравствуйте) / دل‌درد (боль в животе) / دارم (у меня есть)
  prs.a1.unit46.lesson04.teach.review_medicine_want_polite_yes:
    title: 'Повторение: лекарство, вы хотите (вежливо), да'
    gloss: лекарство / вы хотите (вежливо) / да
    note: 'Слова دوا, می‌خواهین и بلی (из прежних уроков) повторяются здесь: они звучат в вопросах аптекаря.'
    target_text: دوا (лекарство) / می‌خواهین (вы хотите, вежливо) / بلی (да)
  prs.a1.unit46.lesson04.teach.review_this_tablet_good_is:
    title: 'Повторение: этот, таблетка, хороший, есть/является'
    gloss: этот / таблетка / хороший / есть, является
    note: 'Слова این, قرص, خوب и است (из прежних уроков и этого урока) повторяются здесь: с их помощью описывают лекарство.'
    target_text: این (этот) / قرص (таблетка) / خوب (хороший) / است (есть, является)
  prs.a1.unit46.lesson04.teach.piece_word:
    title: Штука
    gloss: штука / доза
    note: دانه — счётное слово для штуки или дозы; его используют при счёте таблеток.
    example_gloss: Три штуки.
  prs.a1.unit46.lesson04.teach.take_word:
    title: Принимать
    gloss: принимайте (вежливо)
    note: بگیرین — вежливая форма повелительного наклонения «принимайте»; окончание -ین то же, что в کنین и بنوشین в других уроках курса.
    example_gloss: Принимайте по три штуки в день.
  prs.a1.unit46.lesson04.teach.review_day_three_thanks_welcome:
    title: 'Повторение: день, три, большое спасибо, пожалуйста'
    gloss: день / три / большое спасибо / пожалуйста
    note: 'Слова روز, سه, تشکر زیاد и خواهش می‌کنم (из прежних уроков) повторяются здесь: ими заканчивается диалог.'
    target_text: روز (день) / سه (три) / تشکر زیاد (большое спасибо) / خواهش می‌کنم (пожалуйста)
  prs.a1.unit46.lesson04.teach.dialogue_line1:
    title: 'Хумаюн: Здравствуйте. У меня болит живот.'
    gloss: Здравствуйте. У меня болит живот.
  prs.a1.unit46.lesson04.teach.dialogue_line2:
    title: 'Аптекарь: Здравствуйте. Вам нужно лекарство?'
    gloss: Здравствуйте. Вам нужно лекарство?
  prs.a1.unit46.lesson04.teach.dialogue_line3:
    title: 'Хумаюн: Да, мне нужна таблетка.'
    gloss: Да, мне нужна таблетка.
  prs.a1.unit46.lesson04.teach.dialogue_line4:
    title: 'Аптекарь: Эта таблетка хорошая. Принимайте по три в день.'
    gloss: Эта таблетка хорошая. Принимайте по три в день.
  prs.a1.unit46.lesson04.teach.dialogue_line5:
    title: 'Хумаюн: Большое спасибо.'
    gloss: Большое спасибо.
  prs.a1.unit46.lesson04.teach.dialogue_line6:
    title: 'Аптекарь: Пожалуйста.'
    gloss: Пожалуйста.
  prs.a1.unit46.lesson05.teach.review_this_is_from:
    title: 'Повторение: этот, есть/является, Хумаюн, от/из'
    gloss: этот / есть, является / Хумаюн / от, из
    note: 'Слова این, است и همایون повторяются здесь: они встречаются в тексте для чтения. Предлог از (из прежних уроков, обычно «из, от») здесь стоит с است и показывает принадлежность: این نسخه از همایون است буквально значит «этот рецепт от Хумаюна», а по смыслу — «это рецепт Хумаюна». Так же строится این کتاب از من است — «эта книга моя».'
    target_text: این (этот) / است (есть, является) / همایون / از (от, из)
  prs.a1.unit46.lesson05.teach.review_one_tablet_day_three_piece_take:
    title: 'Повторение: один, таблетка, день, три, штука, принимайте'
    gloss: один / таблетка / день / три / штука / принимайте
    note: 'Слова یک, قرص, روز, سه, دانه и بگیرین (из этого урока) повторяются здесь: они встречаются в тексте для чтения.'
    target_text: یک (один) / قرص (таблетка) / روز (день) / سه (три) / دانه (штука) / بگیرین (примите)
  prs.a1.unit46.lesson05.teach.prescription_word:
    title: Рецепт
    gloss: рецепт
    note: نسخه — обычное дарийское слово для рецепта или этикетки с указанием приёма лекарства.
    example_gloss: Это рецепт.
  prs.a1.unit46.lesson05.teach.reading_passage:
    title: Читаем рецепт
    gloss: Это рецепт Хумаюна. Одна таблетка. Принимайте по три штуки в день.
  prs.a1.unit46.lesson06.teach.review_but_formal_you_how_many:
    title: 'Повторение: но, вы (вежливо), сколько'
    gloss: но / вы (вежливо) / сколько
    note: 'Слова اما, شما и چند (из прежних уроков) повторяются здесь: с их помощью описывают режим приёма.'
    target_text: اما (но) / شما (вы, вежливо) / چند (сколько)
  prs.a1.unit46.lesson06.teach.review_morning_night_two_three_piece_is_prescription:
    title: 'Повторение: утро, ночь, два, три, штука, есть/является, ваш рецепт'
    gloss: утро / ночь / два / три / штука / есть, является / ваш рецепт
    note: 'Слова صبح, شب, دو, سه, دانه, است (из прежних уроков и этого урока) и نسخه‌تان («ваш рецепт»; суффикс -تان тот же, что в نام‌تان и تلفن‌تان в других уроках курса) повторяются здесь: ими завершается урок.'
    target_text: صبح (утро) / شب (вечер, ночь) / دو (два) / سه (три) / دانه (штука) / است (есть, является) / نسخه‌تان (ваш рецепт)
  prs.a1.unit46.lesson06.teach.morning_night_contrast_phrase:
    title: Утром две штуки, а ночью три штуки
    gloss: Утром две штуки, а ночью три штуки.
    note: اما противопоставляет утреннюю дозу ночной.
  prs.a1.unit46.lesson06.teach.your_prescription_question_phrase:
    title: Сколько штук в вашем рецепте?
    gloss: Сколько штук в вашем рецепте?
    note: 'Вежливый вопрос о дозировке в рецепте: форма с суффиксом -تان, обращённая к شما.'
