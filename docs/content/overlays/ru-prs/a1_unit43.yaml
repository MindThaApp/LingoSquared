course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: взять и вернуть книгу в библиотеке, спросить срок возврата и прочитать короткий текст о взятой книге. Ты научишься спрашивать, какую книгу хотят, называть и подтверждать срок возврата и понимать простой разговор в библиотеке.'
units:
  prs.a1.unit43.library:
    title: Библиотека
    description: Попросить книгу, взять и вернуть её, спросить и подтвердить срок возврата, прочитать короткий текст о взятой книге.
lessons:
  prs.a1.unit43.lesson01.library_vocabulary:
    title: Слова для библиотеки
  prs.a1.unit43.lesson02.asking_return_date:
    title: Вопрос о сроке возврата
  prs.a1.unit43.lesson03.borrowing_and_returning:
    title: Взять и вернуть книгу
  prs.a1.unit43.lesson04.library_dialogue:
    title: Диалог в библиотеке
  prs.a1.unit43.lesson05.reading:
    title: Читаем о взятой книге
  prs.a1.unit43.lesson06.wrap_up:
    title: Итоги
teaching:
  prs.a1.unit43.lesson01.teach.review_book_have_is_in:
    title: 'Повторение: книга, у меня есть, есть, в'
    gloss: книга / у меня есть / есть / в
    note: Слова کتاب, دارم, است и در уже знакомы тебе; с их помощью можно говорить о книге.
    target_text: کتاب (книга) / دارم (у меня есть) / است (есть, является) / در (в)
  prs.a1.unit43.lesson01.teach.review_want_one:
    title: 'Повторение: я хочу, один'
    gloss: я хочу / один
    note: می‌خواهم и یک вместе помогают сказать, чего ты хочешь.
    target_text: می‌خواهم (я хочу) / یک (один)
  prs.a1.unit43.lesson01.teach.library_word:
    title: Библиотека
    gloss: библиотека
    note: کتابخانه — стандартное слово для «библиотеки» в дари; оно состоит из کتاب (книга) и خانه (дом).
    example_gloss: Книга в библиотеке.
  prs.a1.unit43.lesson01.teach.librarian_word:
    title: Библиотекарь
    gloss: библиотекарь
    note: کتابدار буквально значит «хранитель книг» (тот, кто присматривает за книгами); слово образовано так же, как دوکاندار («владелец лавки», урок 8).
    example_gloss: Библиотекарь в библиотеке.
  prs.a1.unit43.lesson01.teach.want_book_phrase:
    title: Я хочу книгу
    gloss: Я хочу книгу.
    note: یک کتاب می‌خواهم состоит из یک (один), کتاب (книга) и می‌خواهم (я хочу).
  prs.a1.unit43.lesson01.teach.review_from_object_marker:
    title: 'Повторение: из, показатель дополнения'
    gloss: из / (показатель дополнения)
    note: از (из, от) и را (отмечает прямое дополнение в предложении; уроки 14 и 26) — уже знакомые слова.
    target_text: از (из, от) / را (показатель прямого дополнения)
  prs.a1.unit43.lesson01.teach.want_book_from_librarian_phrase:
    title: Я хочу взять книгу у библиотекаря
    gloss: Я хочу взять книгу у библиотекаря.
    note: К фразе کتاب را می‌خواهم добавляется از کتابدار (у библиотекаря).
  prs.a1.unit43.lesson01.teach.want_one_book_from_librarian_phrase:
    title: Я хочу взять книгу у библиотекаря
    gloss: Я хочу взять книгу у библиотекаря.
    note: Здесь یک (один) соединяется с фразой کتاب را از کتابدار می‌خواهم.
  prs.a1.unit43.lesson02.teach.review_date_day_monday:
    title: 'Повторение: дата, день, понедельник'
    gloss: дата / день / понедельник
    note: تاریخ, روز и دوشنبه (все из урока 9) уже знакомы тебе; они нужны, чтобы спросить о сроке возврата.
    target_text: تاریخ (дата) / روز (день) / دوشنبه (понедельник)
  prs.a1.unit43.lesson02.teach.review_which_is:
    title: 'Повторение: какой, есть'
    gloss: какой / есть
    note: Слова کدام и است нужны, чтобы задать вопрос.
    target_text: کدام (какой) / است (есть, является)
  prs.a1.unit43.lesson02.teach.return_giving_back_word:
    title: Возврат
    gloss: возврат
    note: 'پس دادن буквально значит «отдавать назад»: پس (назад) сочетается с دادن (давать).'
    example_gloss: Дата возврата — понедельник.
  prs.a1.unit43.lesson02.teach.ask_return_date_phrase:
    title: В какой день нужно вернуть?
    gloss: В какой день нужно вернуть книгу?
    note: تاریخ پس دادن کتاب کدام روز است؟ — вопрос о том, когда нужно вернуть взятую книгу.
  prs.a1.unit43.lesson02.teach.return_date_answer_phrase:
    title: Дата возврата — понедельник
    gloss: Дата возврата — понедельник.
    note: تاریخ پس دادن دوشنبه است — ответ на вопрос с названием конкретного дня.
  prs.a1.unit43.lesson03.teach.review_want_book_one_this:
    title: 'Повторение: я хочу, книга, один, этот'
    gloss: я хочу / книга / один / этот
    note: می‌خواهم، کتاب، یک и این — слова для повторения; с ними можно попросить конкретную книгу.
    target_text: می‌خواهم (я хочу) / کتاب (книга) / یک (один) / این (этот)
  prs.a1.unit43.lesson03.teach.get_word:
    title: Получить / взять
    gloss: получить / взять
    note: 'بگیرم — сослагательная форма («чтобы я взял»), та же, что в уроке 42 после می‌خواهم: «я хочу взять».'
    example_gloss: Я хочу взять книгу.
  prs.a1.unit43.lesson03.teach.loan_word:
    title: Заём
    gloss: заём
    note: قرض означает заём; قرض گرفتن («взять в заём») — обычный способ сказать на дари «взять взаймы».
    example_gloss: Эта книга взята взаймы.
  prs.a1.unit43.lesson03.teach.want_borrow_book_phrase:
    title: Я хочу взять книгу взаймы
    gloss: Я хочу взять книгу взаймы.
    note: می‌خواهم کتاب را قرض بگیرم объединяет می‌خواهم، کتاب را، قرض и сослагательную форму بگیرم.
  prs.a1.unit43.lesson03.teach.give_back_word:
    title: Отдать (назад)
    gloss: отдать (назад)
    note: بدهم — сослагательная форма глагола دادن (давать); с پس (назад) означает «вернуть, отдать обратно».
    example_gloss: Я хочу это вернуть.
  prs.a1.unit43.lesson03.teach.want_return_book_phrase:
    title: Я хочу вернуть книгу
    gloss: Я хочу вернуть книгу.
    note: می‌خواهم کتاب را پس بدهم объединяет می‌خواهم، کتاب را، پس и сослагательную форму بدهم.
  prs.a1.unit43.lesson03.teach.review_very_good:
    title: 'Повторение: очень, хорошо'
    gloss: очень / хорошо
    note: بسیار и خوب — слова для повторения; с их помощью можно подтвердить что-либо.
    target_text: بسیار (очень) / خوب (хороший)
  prs.a1.unit43.lesson03.teach.good_answer_phrase:
    title: Хорошо
    gloss: Хорошо.
    note: خوب است — так подтверждают, что всё подходит.
  prs.a1.unit43.lesson04.teach.review_hello_want:
    title: 'Повторение: здравствуйте, я хочу'
    gloss: здравствуйте / я хочу
    note: سلام и می‌خواهم — слова для повторения, они используются в диалоге.
    target_text: سلام (здравствуйте) / می‌خواهم (я хочу)
  prs.a1.unit43.lesson04.teach.review_very_thanks_welcome:
    title: 'Повторение: очень, большое спасибо, пожалуйста'
    gloss: очень / большое спасибо / пожалуйста
    note: بسیار، تشکر زیاد и خواهش می‌کنم — слова для повторения, они используются в диалоге.
    target_text: بسیار (очень) / تشکر زیاد (большое спасибо) / خواهش می‌کنم (пожалуйста)
  prs.a1.unit43.lesson04.teach.dialogue_line1:
    title: 'Хумаюн: Здравствуйте. Я хочу взять книгу.'
    gloss: Здравствуйте. Я хочу взять книгу.
  prs.a1.unit43.lesson04.teach.dialogue_line2:
    title: 'Библиотекарь: Здравствуйте. Какую книгу вы хотите?'
    gloss: Здравствуйте. Какую книгу вы хотите?
    note: 'می‌خواهین — вежливая форма множественного числа: «вы хотите».'
  prs.a1.unit43.lesson04.teach.dialogue_line3:
    title: 'Хумаюн: Я хочу эту книгу.'
    gloss: Я хочу эту книгу.
  prs.a1.unit43.lesson04.teach.dialogue_line4:
    title: 'Библиотекарь: Хорошо. Дата возврата — понедельник.'
    gloss: Хорошо. Дата возврата — понедельник.
  prs.a1.unit43.lesson04.teach.dialogue_line5:
    title: 'Хумаюн: Очень хорошо. Большое спасибо.'
    gloss: Очень хорошо. Большое спасибо.
  prs.a1.unit43.lesson04.teach.dialogue_line6:
    title: 'Библиотекарь: Пожалуйста.'
    gloss: Пожалуйста.
  prs.a1.unit43.lesson05.teach.review_he_she_has:
    title: 'Повторение: Хумаюн, он/она, у него/неё есть'
    gloss: Хумаюн / он/она / у него/неё есть
    note: همایون، او и دارد — слова для повторения, они используются в тексте для чтения.
    target_text: همایون (Хумаюн) / او (он, она) / دارد (у него, у неё есть)
  prs.a1.unit43.lesson05.teach.reading_passage:
    title: Текст о взятой книге
    gloss: У Хумаюна есть книга. Его книга из библиотеки. Дата возврата его книги — понедельник. Хумаюн доволен.
  prs.a1.unit43.lesson06.teach.review_wrap_up_words:
    title: 'Повторение: у меня нет, но, вы (вежливо)'
    gloss: у меня нет / но / вы (вежливо)
    note: ندارم، اما и شما — слова для повторения, с их помощью противопоставляются два дня.
    target_text: ندارم (у меня нет) / اما (но) / شما (вы)
  prs.a1.unit43.lesson06.teach.review_tuesday:
    title: 'Повторение: вторник'
    gloss: вторник
    note: سه‌شنبه — слово для повторения.
    target_text: سه‌شنبه (вторник)
  prs.a1.unit43.lesson06.teach.contrast_phrase:
    title: В понедельник у меня есть книга, а во вторник нет
    gloss: В понедельник у меня есть книга, но во вторник книги нет.
    note: اما противопоставляет наличие книги в понедельник её отсутствию во вторник.
  prs.a1.unit43.lesson06.teach.formal_question_phrase:
    title: Какую книгу вы хотите?
    gloss: Какую книгу вы хотите?
    note: Вежливый вариант вопроса о том, какую книгу хочет собеседник, со словом شما.
