    accepted_answers:
    - value: بخوابی
      status: correct
    feedback: '*بخوابی* — сослагательная форма после *نباید*. *نباید دیر بخوابی* — «тебе нельзя поздно ложиться спать».'
  prs.a2.unit32.lesson02.exercise06.translate_must_study:
    instruction: 'Переведи на дари, обращаясь к другу: «Ты должен учиться каждый день».'
    accepted_answers:
    - value: باید هر روز درس بخوانی.
      status: correct
    - value: هر روز باید درس بخوانی.
      status: correct
    - value: تو باید هر روز درس بخوانی.
      status: correct
    - value: تو هر روز باید درس بخوانی.
      status: correct
    feedback: '*باید هر روز درس بخوانی.* *تو* можно опустить, а *هر روز* может стоять перед *باید*.'
  prs.a2.unit32.lesson03.exercise01.recognize_suggest_save:
    instruction: Что означает это предложение?
    correct_option: Я советую тебе копить деньги
    distractors:
    - Я накопил деньги
    - Ты должен копить деньги
    - Лучше тратить деньги
