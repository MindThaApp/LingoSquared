      right: ему или ей надо идти
    - left: باید برویم
      right: нам надо идти
    - left: باید بروین
      right: вам надо идти (вежливо или мн. число)
    - left: باید بروند
      right: им надо идти
    - left: نباید بروی
      right: тебе не надо идти
    - left: درس
      right: урок
    - left: امتحان
      right: экзамен
    - left: زود
      right: рано
    - left: دیر
