course:
  title: Дари A2
  description: 'Дари Афганистана, уровень ниже среднего: учимся давать и принимать простые советы о здоровье, учёбе и деньгах с помощью сослагательного наклонения. Мягкий совет с بهتر است که, категоричный совет с باید и نباید, вежливое предложение с پیشنهاد می‌کنم که, вопрос «что делать?», а также согласие, сомнение и отказ в ответ на совет.'
units:
  prs.a2.unit32.giving_advice:
    title: Даём советы
lessons:
  prs.a2.unit32.lesson01.better_to_go:
    title: Лучше бы тебе сходить к врачу
  prs.a2.unit32.lesson02.must_and_must_not:
    title: Надо и не надо
  prs.a2.unit32.lesson03.i_suggest:
    title: Я предлагаю, чтобы
  prs.a2.unit32.lesson04.ask_and_answer:
    title: Просим совета и отвечаем на него
  prs.a2.unit32.lesson05.reading_and_listening:
    title: Читаем и слушаем о здоровье
  prs.a2.unit32.lesson06.money_conversation:
    title: Разговор о деньгах
teaching:
  prs.a2.unit32.lesson01.teach.doctor:
    title: Врач
    gloss: врач
    note: '*داکتر* — афганское слово, обозначающее врача. Чтобы сказать «идти к врачу», говорят *به داکتر رفتن*: *به داکتر می‌روم* — «я иду к врачу».'
    example_gloss: Врач сегодня в кабинете.
  prs.a2.unit32.lesson01.teach.medicine:
    title: Лекарство
    gloss: лекарство
    note: '*دوا* — лекарство. На дари его не «пьют» и не «принимают», а «едят»: *دوا خوردن*. *دوا را می‌خورم* — «я принимаю лекарство».'
    example_gloss: Лекарство я принимаю после еды.
  prs.a2.unit32.lesson01.teach.sick:
    title: Больной
    gloss: больной
    note: '*مریض* означает «больной». *مریض استم* — «я болен/больна», а *او مریض است* — «он или она болен/больна».'
    example_gloss: Мой брат болен.
  prs.a2.unit32.lesson01.teach.rest:
    title: Отдыхать
    gloss: отдыхать
    note: '*استراحت کردن* — «отдыхать». Это глагол из двух слов: *استراحت* остаётся впереди, меняется только *کردن*, например *استراحت می‌کنم* («я отдыхаю»).'
    example_gloss: После работы я отдыхаю.
  prs.a2.unit32.lesson01.teach.sleep:
    title: Спать
    gloss: спать, ложиться спать
    note: '*خوابیدن* — «спать» или «ложиться спать». *شب‌ها* — «по ночам, по вечерам»: *شب‌ها زود می‌خوابم* — «по вечерам я рано ложусь спать». *دیر خوابیدن* — «поздно ложиться спать».'
    example_gloss: Рано ложиться спать — это важно.
  prs.a2.unit32.lesson01.teach.head:
    title: У меня болит голова
    gloss: У меня болит голова.
    note: 'Чтобы сказать, что болит какая-то часть тела, добавь *-م* к названию части тела и поставь *درد می‌کند*: *سرم درد می‌کند* («у меня болит голова»). Это обычная жалоба, после которой друг даёт совет.'
  prs.a2.unit32.lesson01.teach.stem:
    title: 'Совет выражается сослагательным наклонением: повелительная форма + ی'
    gloss: 'иди: чтобы ты пошёл; ешь: чтобы ты поел; спи: чтобы ты лёг спать; отдыхай: чтобы ты отдохнул'
    note: 'Чтобы дать совет, используется глагольная форма, которая называется сослагательным наклонением. Для друга (*تو*) она проста: возьми повелительную форму, с которой обращаешься к другу, и добавь *ی*. *برو* («иди») даёт *بروی*, *بخور* («ешь») даёт *بخوری*, *بخواب* («спи») даёт *بخوابی*, *استراحت کن* («отдыхай») даёт *استراحت کنی*. У большинства глаголов повелительная форма начинается с *ب-*; у глаголов с *کردن* *ب-* нет (в этом разделе *کن*, а не *بکن*).'
  prs.a2.unit32.lesson01.teach.paradigm:
    title: 'Сослагательное наклонение глагола رفتن: все шесть лиц'
    gloss: чтобы я пошёл, чтобы ты пошёл (друг), чтобы он/она пошёл/пошла, чтобы мы пошли, чтобы вы пошли (вежливо или мн. число), чтобы они пошли
    note: 'К основе повелительной формы *برو* добавляются окончания: *بروم* (я), *بروی* (ты, другу), *برود* (он или она), *برویم* (мы), *بروین* (вы, вежливо или мн. число), *بروند* (они). Окончания: *-م، -ی، -د، -یم، -ین، -ند*. В этом разделе окончание 2-го лица мн. числа пишется *-ین*, как и в остальном курсе. Сослагательное наклонение не указывает на время: смысл задают совет или главный глагол рядом.'
  prs.a2.unit32.lesson01.teach.better:
    title: Совет с بهتر است که
    gloss: Лучше бы тебе сходить к врачу.
    note: '*بهتر است* («лучше») + *که* + сослагательное наклонение — мягкий, дружеский способ дать совет: *بهتر است که به داکتر بروی* — «лучше бы тебе сходить к врачу». *که* можно опустить: *بهتر است به داکتر بروی* означает то же самое. В этом разделе всегда пишется полная форма *است*; более короткой формы в письменном дари курса нет. Кто должен действовать, видно только по окончанию сослагательной формы: *بروی* — «ты».'
  prs.a2.unit32.lesson01.teach.better_more:
    title: Ещё советы больному другу
    gloss: Лучше бы тебе принять лекарство. Лучше бы тебе лечь спать. Лучше бы тебе отдохнуть.
    note: 'Та же модель с другими глаголами: *دوا بخوری* («чтобы ты принял лекарство»), *بخوابی* («чтобы ты лёг спать»), *استراحت کنی* («чтобы ты отдохнул»). Меняется только глагол в конце; *بهتر است که* остаётся прежним.'
  prs.a2.unit32.lesson01.teach.neg:
    title: 'Отрицание: ن вместо ب'
    gloss: Лучше бы тебе не ходить. Лучше бы тебе не ложиться поздно спать.
    note: 'Чтобы сказать, чего другу делать не стоит, поставь *ن-* вместо *ب-*: *بروی* становится *نروی*, *بخوری* — *نخوری*, *بخوابی* — *نخوابی*. У глаголов с *کردن* отрицание — *نکنی*. Так, *بهتر است که دیر نخوابی* — «лучше бы тебе не ложиться поздно спать».'
  prs.a2.unit32.lesson01.teach.formal:
    title: 'Совет уважаемому человеку: ین'
    gloss: Лучше бы вам сходить к врачу. (вежливо или мн. число)
    note: 'Когда обращаешься к человеку, которого уважаешь, — к старшему, незнакомцу или к нескольким людям, — используй *شما* и окончание *-ین*: *بروین، بخورین، بخوابین، کنین*. *بهتر است که شما به داکتر بروین* — «лучше бы вам сходить к врачу». С другом используй *بروی*.'
  prs.a2.unit32.lesson01.teach.water:
    title: Пей побольше воды
    gloss: Лучше бы тебе пить много воды.
    note: 'На дари воду, как и лекарство, «едят»: *آب خوردن* — «пить воду». *آب زیاد* — «много воды». Очень частый совет больному другу.'
  prs.a2.unit32.lesson02.teach.lesson:
    title: Урок, учёба
    gloss: урок, школьное задание
    note: '*درس* — урок или школьное задание. *درس خواندن* — «учиться, заниматься» (буквально «читать урок»): *درس می‌خوانم* — «я занимаюсь».'
    example_gloss: Я занимаюсь каждый день.
  prs.a2.unit32.lesson02.teach.exam:
    title: Экзамен
    gloss: экзамен, испытание
    note: '*امتحان* — экзамен или проверочная работа. Советы об учёбе очень часто связаны с предстоящим *امتحان*.'
    example_gloss: Мой экзамен завтра.
  prs.a2.unit32.lesson02.teach.book:
    title: Книга
    gloss: книга
    note: '*کتاب* — книга. Добавь *-م*, чтобы получить «моя»: *کتابم*. Множественное число пишется *کتاب‌ها*.'
    example_gloss: Моя книга в школе.
  prs.a2.unit32.lesson02.teach.review:
    title: Повторять
    gloss: повторять, перепроходить заново
    note: '*تکرار کردن* — «повторять» или «проходить что-то ещё раз». Это обычный совет перед экзаменом: *درس را تکرار کن* («повтори урок»).'
    example_gloss: Каждый вечер я повторяю урок.
  prs.a2.unit32.lesson02.teach.early:
    title: Рано, скоро
    gloss: рано, скоро
    note: '*زود* означает «рано» или «скоро». *زود خوابیدن* — «рано ложиться спать», а *صبح زود* — «рано утром».'
    example_gloss: Рано утром я иду в школу.
  prs.a2.unit32.lesson02.teach.late:
    title: С опозданием
    gloss: с опозданием
    note: '*دیر* означает «поздно»; это противоположность *زود*. *دیر خوابیدن* — «поздно ложиться спать».'
    example_gloss: Сегодня он или она пришёл/пришла поздно.
  prs.a2.unit32.lesson02.teach.must:
    title: 'باید + сослагательное наклонение: «надо»'
    gloss: Ты должен учиться каждый день.
    note: 'После *باید* (должен, нужно) тоже ставится сослагательная форма (конъюнктив): *باید هر روز درس بخوانی* — «ты должен учиться каждый день». Само *باید* не изменяется; кто выполняет действие, показывает окончание глагола. *باید* сильнее, чем *بهتر است که*: это долг или явная необходимость. Порядок слов свободный: *هر روز باید درس بخوانی* тоже правильно.'
  prs.a2.unit32.lesson02.teach.must_paradigm:
    title: باید со всеми шестью лицами
    gloss: я должен идти, ты должен идти, он/она должен идти, мы должны идти, вы должны идти (вежливо или мн. число), они должны идти
    note: 'Меняется только окончание глагола в сослагательной форме: *باید بروم* (я должен идти), *باید بروی* (ты должен идти), *باید برود* (он или она должен идти), *باید برویم* (мы должны идти), *باید بروین* (вы должны идти — вежливо или мн. число), *باید بروند* (они должны идти).'
  prs.a2.unit32.lesson02.teach.must_not:
    title: 'نباید: нельзя, не должен'
    gloss: Тебе нельзя поздно ложиться спать.
    note: '*نباید* («не должен», «нельзя») — это *باید* с приставкой *ن-*. Глагол после него остаётся в утвердительной форме: *نباید دیر بخوابی* — «тебе нельзя поздно ложиться спать». Второе *ن-* добавлять не нужно: говорят *نباید بخوابی*, а не *نباید نخوابی*.'
  prs.a2.unit32.lesson02.teach.soft_strong:
    title: Мягкий и строгий совет
    gloss: Лучше бы ты лёг спать пораньше. Ты должен лечь спать рано.
    note: 'Оба предложения дают один и тот же совет, но разной силы. *بهتر است که زود بخوابی* звучит дружелюбно и мягко: «было бы лучше, если бы…». *باید زود بخوابی* звучит твёрдо: «тебе really нужно». Используй *بهتر است که* с другом, когда только советуешь, а *باید* — когда это важно, например перед экзаменом.'
  prs.a2.unit32.lesson02.teach.review_adv:
    title: Совет перед экзаменом
    gloss: Лучше бы ты повторил урок.
    note: 'То, над чем ты работаешь, ставится перед глаголом с *را*: *درس را تکرار کنی* («чтобы ты повторил урок»). Это хороший совет для учёбы.'
  prs.a2.unit32.lesson03.teach.money:
    title: Деньги
    gloss: деньги
    note: '*پول* — деньги. *پولم* — мои деньги. *پولم کم است* — «у меня мало денег».'
    example_gloss: У меня мало денег.
  prs.a2.unit32.lesson03.teach.spend:
    title: Тратить
    gloss: тратить
    note: '*خرج کردن* — тратить деньги. Деньги стоят перед глаголом: *پول خرج کردن*. *زیاد خرج کردن* — «тратить много».'
    example_gloss: Каждый месяц он или она тратит много денег.
  prs.a2.unit32.lesson03.teach.save:
    title: Копить
    gloss: копить, откладывать (деньги)
    note: '*پس‌انداز کردن* — копить, откладывать деньги. Как и *خرج کردن*, это глагол из двух слов. *پس‌انداز* пишется с небольшим промежутком между *پس* и *انداز*.'
    example_gloss: Каждый месяц я откладываю немного денег.
  prs.a2.unit32.lesson03.teach.expensive:
    title: Дорогой
    gloss: дорогой
    note: '*گران* значит «дорогой». Противоположное слово — *ارزان* («дешёвый»).'
    example_gloss: Эта машина дорогая.
  prs.a2.unit32.lesson03.teach.cheap:
    title: Дешёвый
    gloss: дешёвый
    note: '*ارزان* значит «дешёвый». Противоположное слово — *گران*.'
    example_gloss: Эта книга дешёвая.
  prs.a2.unit32.lesson03.teach.month:
    title: Месяц
    gloss: месяц
    note: '*ماه* — месяц. *هر ماه* — каждый месяц. Это полезное слово, когда говоришь о деньгах: многие получают и тратят деньги каждый месяц.'
    example_gloss: Каждый месяц я хожу в банк.
  prs.a2.unit32.lesson03.teach.suggest:
    title: پیشنهاد می‌کنم که и сослагательная форма
    gloss: Я советую тебе каждый месяц откладывать деньги.
    note: '*پیشنهاد می‌کنم* значит «я предлагаю», а *که* с сослагательной формой называет, что именно ты предлагаешь: *پیشنهاد می‌کنم که هر ماه پول پس‌انداز کنی* — «я предлагаю тебе каждый месяц откладывать деньги». У глагола *می‌کنم* есть приставка *می‌* и окончание *-م* («я»). Глагол после *که* снова стоит в сослагательной форме: *پس‌انداز کنی*. Чтобы предложить что-то от лица нескольких людей, скажи *پیشنهاد می‌کنیم که* («мы предлагаем»).'
  prs.a2.unit32.lesson03.teach.three:
    title: Три способа дать один и тот же совет
    gloss: Лучше бы ты откладывал деньги. Ты должен откладывать деньги. Я советую тебе откладывать деньги.
    note: Теперь ты знаешь три конструкции, и все они требуют сослагательной формы. *بهتر است که* — мягкий, дружеский совет. *باید* — твёрдое требование. *پیشنهاد می‌کنم که* — вежливое и ясное предложение, оно звучит как совет от человека, который тебя уважает; его используют, когда вы с собеседником не близки.
  prs.a2.unit32.lesson03.teach.we_suggest:
    title: Мы предлагаем
    gloss: Мы советуем тебе лечь спать пораньше.
    note: 'Для «мы» окончание глагола *می‌کنم* становится *-یم*: *پیشنهاد می‌کنیم* — «мы предлагаем». Используй это, когда говоришь от имени группы, например семьи или команды.'
  prs.a2.unit32.lesson03.teach.suggest_neg:
    title: Совет, чего не делать
    gloss: Я советую тебе не тратить много денег.
    note: 'После *پیشنهاد می‌کنم که* для того, чего не нужно делать, ставится отрицательная сослагательная форма: *نکنی* от *کردن*, *نخری* от *خریدن*. Часть *می‌کنم* остаётся утвердительной: ты предлагаешь, а то, что ты предлагаешь, — отрицательное.'
  prs.a2.unit32.lesson03.teach.expensive_things:
    title: Не покупай дорогие вещи
    gloss: Я советую тебе не покупать дорогие вещи.
    note: '*چیزهای گران* — «дорогие вещи»: множественное число от *چیز* — *چیزها*, а соединительное *-ی* связывает его с определением, которое идёт следом. *نخری* — отрицание от *بخری* («чтобы ты купил»), от глагола *خریدن*.'
  prs.a2.unit32.lesson04.teach.what_do:
    title: Что мне делать?
    gloss: Что мне делать?
    note: 'Чтобы попросить совета, тоже используется сослагательная форма: *چه کار کنم؟* — «что мне делать?» (а не «что я делаю?»). Во множественном числе: *چه کار کنیم؟* («что нам делать?»). Сначала назови проблему, потом спроси: *سرم درد می‌کند. چه کار کنم؟*'
  prs.a2.unit32.lesson04.teach.your_view:
    title: Обращение к уважаемому человеку
    gloss: Как вы думаете, что мне делать?
    note: '*به نظر شما* — «по вашему мнению». Со старшим по возрасту или с незнакомым человеком это вежливый способ попросить совета: *به نظر شما چه کار کنم؟*. После этого собеседник может ответить с *بهتر است که* или *پیشنهاد می‌کنم که*.'
  prs.a2.unit32.lesson04.teach.what_suggest:
    title: Что вы посоветуете?
    gloss: Что вы посоветуете?
    note: '*شما چه پیشنهاد می‌کنین؟* — так спрашивают человека, которого уважают, что он советует. Здесь используется окончание *-ین*, которое соответствует *شما*. С другом говорят *تو چه پیشنهاد می‌کنی؟*.'
  prs.a2.unit32.lesson04.teach.accept:
    title: Принять совет
    gloss: Хорошая мысль. Так и сделаю.
    note: '*فکر خوبی است* — «хорошая мысль». *همین کار را می‌کنم* — «так и сделаю». Настоящее время *می‌کنم* также используется, когда говоришь о принятом решении. Эти два предложения пригодятся, когда ты хочешь последовать совету.'
  prs.a2.unit32.lesson04.teach.thanks:
    title: Поблагодарить за совет
    gloss: Спасибо за твой совет.
    note: '*از پیشنهادت ممنون* — «спасибо за твой совет». *پیشنهادت* — это *پیشنهاد* с окончанием *-ت*, «твой». Это дружеский способ завершить разговор после любого совета.'
  prs.a2.unit32.lesson04.teach.decline:
    title: Сказать, что не можешь так сделать
    gloss: Не могу, потому что у меня нет времени.
    note: 'Когда ты не можешь последовать совету, скажи об этом и назови причину: *نمی‌توانم، چون وقت ندارم* — «не могу, потому что у меня нет времени». *می‌توانم* — «я могу», а *نمی‌توانم* — «я не могу». Причина называется после *چون*.'
  prs.a2.unit32.lesson04.teach.maybe:
    title: Более мягкий совет с شاید и сослагательной формой глагола بودن
    gloss: Может быть, лучше тебе отдохнуть. Может быть, это верно.
    note: 'После *شاید* («возможно») ставится сослагательная форма. Сослагательная форма глагола *بودن*: *باشم، باشی، باشد، باشیم، باشین، باشند*. Так, *شاید بهتر باشد که استراحت کنی* — «может быть, тебе лучше отдохнуть»: очень мягкий совет. Также можно отреагировать на совет словами *شاید درست باشد* («может быть, это верно»), когда ты ещё не уверен. *ممکن است درست باشد* («это может быть верно») значит почти то же самое.'
  prs.a2.unit32.lesson04.teach.agree:
    title: Согласиться
    gloss: Это верно. Так и сделаю.
    note: '*درست است* — «это верно». После совета это значит, что ты согласен. Вместе с *همین کار را می‌کنم* это однозначное «да».'
  prs.a2.unit32.lesson05.teach.three:
    title: Три
    gloss: три
    note: '*سه* — три. *سه روز* — три дня. Врач часто говорит, сколько дней тебе нужно отдыхать.'
    example_gloss: Я был в Кабуле три дня.
  prs.a2.unit32.lesson05.teach.said:
    title: Он или она сказал(а)
    gloss: он или она сказал(а)
    note: '*گفت* — прошедшее время глагола *گفتن* («говорить») для «он/она». После *گفت* следует короткое предложение, например *داکتر گفت: ...* («врач сказал: ...»).'
    example_gloss: 'Он сказал: я приду завтра.'
  prs.a2.unit32.lesson05.teach.please_wait:
    title: Ждать, терпеть
    gloss: ждать, терпеть
    note: '*صبر کردن* — ждать или быть терпеливым. *نباید صبر کنی* — «не нужно ждать», то есть сделай это сразу.'
    example_gloss: Подожди немного.
  prs.a2.unit32.lesson05.teach.dlg1_turn01:
    title: Джамиля говорит, что случилось
    gloss: Закария, у меня болит голова, и по ночам я плохо сплю. Что мне делать?
    note: 'Джамиля описывает проблему словами *سرم درد می‌کند* и *خوب نمی‌خوابم* («я плохо сплю»), а потом просит совета: *چه کار کنم؟*.'
  prs.a2.unit32.lesson05.teach.dlg1_turn02:
    title: Закария даёт два совета
    gloss: Лучше бы ты сходила к врачу. Тебе нужно пить много воды.
    note: Сначала Закария использует мягкое *بهتر است که به داکتر بروی*, затем более твёрдое *باید آب زیاد بخوری*. Он говорит с подругой, поэтому окончание — *-ی*.
  prs.a2.unit32.lesson05.teach.dlg1_turn03:
    title: Джамиля соглашается и планирует на завтра
    gloss: Хорошая мысль. Завтра я пойду к врачу.
    note: 'Джамиля соглашается словами *فکر خوبی است*. Она планирует пойти завтра: *فردا به داکتر می‌روم* — настоящее время со словом, указывающим на время.'
  prs.a2.unit32.lesson05.teach.dlg1_turn04:
    title: 'Закария говорит: иди сегодня'
    gloss: Советую тебе пойти сегодня. Нельзя ждать.
    note: 'Закария говорит, что это срочно: *پیشنهاد می‌کنم که امروز بروی*, а словами *نباید صبر کنی* добавляет «не жди». Обрати внимание: он не повторяет *به داکتر*, потому что и так понятно.'
  prs.a2.unit32.lesson05.teach.dlg1_turn05:
    title: Джамиля соглашается
    gloss: Хорошо, пойду сегодня. Спасибо.
    note: 'Джамиля меняет план на сегодня: *امروز می‌روم*. Она вежливо заканчивает словом *ممنون*.'
  prs.a2.unit32.lesson05.teach.message:
    title: Сообщение после визита к врачу
    gloss: 'Привет, Закария. Спасибо за совет. Сегодня я ходила к врачу. Врач сказал: лучше тебе отдохнуть три дня, и нужно принимать лекарство. Нельзя поздно ложиться спать по вечерам. Завтра я не иду в школу.'
    note: 'Джамиля пишет следующее сообщение. Врач дал советы с помощью тех же трёх конструкций: *بهتر است که* (отдыхать три дня), *باید* (принимать лекарство) и *نباید* (не ложиться спать поздно). Совет передаётся после *گفت:* в той же форме.'
  prs.a2.unit32.lesson06.teach.start:
    title: Начинать
    gloss: начинать, приступать
    note: '*شروع کردن* — начинать. *از امروز شروع می‌کنم* — «я начинаю с сегодняшнего дня»: обещание после того, как ты принял совет.'
    example_gloss: Я начинаю с завтрашнего дня.
  prs.a2.unit32.lesson06.teach.only:
    title: Только
    gloss: только, лишь
    note: '*فقط* значит «только». *فقط چیزهای مهم* — «только важные вещи».'
    example_gloss: У меня только одна книга.
  prs.a2.unit32.lesson06.teach.dlg2_turn01:
    title: Закария говорит, что случилось
    gloss: Джамиля, у меня мало денег, а каждый месяц я трачу много. Что мне делать?
    note: 'Закария описывает проблему в двух частях: *پولم کم است* и *هر ماه زیاد خرج می‌کنم*. Затем он просит совета: *چه کار کنم؟*.'
  prs.a2.unit32.lesson06.teach.dlg2_turn02:
    title: Джамиля советует копить
    gloss: Советую тебе каждый месяц откладывать немного денег.
    note: Джамиля использует вежливую конструкцию *پیشنهاد می‌کنم که* с сослагательной формой *پس‌انداز کنی*. *کمی* значит «немного».
  prs.a2.unit32.lesson06.teach.dlg2_turn03:
    title: Закария говорит, что не может
    gloss: Хорошая мысль, но я не могу. Всё дорого.
    note: 'Закария говорит, что мысль хорошая, но называет причину, почему не может ей последовать: *همه چیز گران است* («всё дорого»).'
  prs.a2.unit32.lesson06.teach.dlg2_turn04:
    title: Джамиля советует, чего не покупать
    gloss: Тогда тебе нельзя покупать дорогие вещи. Лучше покупай только важное.
    note: 'Джамиля меняет совет: *نباید چیزهای گران بخری* (твёрдое правило) и *بهتر است که فقط چیزهای مهم بخری* (мягкое предложение).'
  prs.a2.unit32.lesson06.teach.dlg2_turn05:
    title: Закария соглашается и начинает
    gloss: Это верно. Начну с сегодняшнего дня. Спасибо.
    note: 'Закария соглашается словами *درست است* и обещает: *از امروز شروع می‌کنم*.'
exercises:
  prs.a2.unit32.lesson01.exercise01.recognize_go_doctor:
    instruction: Что означает это предложение?
    correct_option: Лучше бы тебе сходить к врачу
    distractors:
    - Ты ходил к врачу
    - Я схожу к врачу
    - Врач здесь
    accepted_answers:
    - value: Лучше бы тебе сходить к врачу
      status: correct
    feedback: '*بهتر است که به داکتر بروی* — «лучше бы ты сходил к врачу»: *بهتر است که* + сослагательная форма (конъюнктив) *بروی*.'
  prs.a2.unit32.lesson01.exercise02.recognize_rest:
    instruction: Что означает это предложение?
    correct_option: Лучше бы тебе отдохнуть
    distractors:
    - Я отдыхаю после работы
    - Ты сейчас отдыхаешь
    - Остальное лучше
    accepted_answers:
    - value: Лучше бы тебе отдохнуть
      status: correct
    feedback: '*بهتر است که استراحت کنی* — «лучше, чтобы ты отдохнул». *کنی* — это повелительная форма *کن* + *ی*.'
  prs.a2.unit32.lesson01.exercise03.match_subjunctive:
    instruction: Соедини каждое слово на дари с его значением.
    accepted_answers:
    - value:
        بروم: чтобы я пошёл
        بروی: чтобы ты пошёл (другу)
        برود: чтобы он или она пошёл/пошла
        برویم: чтобы мы пошли
        بروین: чтобы вы пошли (вежливо или мн. число)
        بروند: чтобы они пошли
        داکتر: врач
        دوا: лекарство
        مریض: больной
      status: correct
    feedback: 'Меняется только окончание в зависимости от лица: *-م* — я, *-ی* — ты (неформально), *-د* — он/она, *-یم* — мы, *-ین* — вы (вежливо или мн. число), *-ند* — они.'
    pairs:
    - left: بروم
      right: чтобы я пошёл
    - left: بروی
      right: чтобы ты пошёл (другу)
    - left: برود
      right: чтобы он или она пошёл/пошла
    - left: برویم
      right: чтобы мы пошли
    - left: بروین
      right: чтобы вы пошли (вежливо или мн. число)
    - left: بروند
      right: чтобы они пошли
    - left: داکتر
      right: врач
    - left: دوا
      right: лекарство
    - left: مریض
      right: больной
  prs.a2.unit32.lesson01.exercise04.order_sleep_early:
    instruction: 'Расставь слова так, чтобы получилось: «Лучше тебе лечь спать пораньше».'
    accepted_answers:
    - value:
      - بهتر
      - است
      - که
      - زود
      - بخوابی
      status: correct
    feedback: В *بهتر است که زود بخوابی* глагол в сослагательной форме *بخوابی* стоит в конце.
  prs.a2.unit32.lesson01.exercise05.complete_medicine:
    instruction: 'Закончи предложение: «Лучше тебе принять лекарство».'
    accepted_answers:
    - value: بخوری
      status: correct
    feedback: '*بخوری* — это повелительная форма *بخور* + *ی*. *بهتر است که دوا بخوری* — «лучше тебе принять лекарство».'
  prs.a2.unit32.lesson01.exercise06.translate_go_doctor:
    instruction: 'Переведи на дари, обращаясь к другу: «Тебе лучше сходить к врачу».'
    accepted_answers:
    - value: بهتر است که به داکتر بروی.
      status: correct
    - value: بهتر است که پیش داکتر بروی.
      status: correct
    - value: بهتر است که تو به داکتر بروی.
      status: correct
    - value: بهتر است که تو پیش داکتر بروی.
      status: correct
    - value: بهتر است به داکتر بروی.
      status: correct
    - value: بهتر است پیش داکتر بروی.
      status: correct
    - value: بهتر است تو به داکتر بروی.
      status: correct
    - value: بهتر است تو پیش داکتر بروی.
      status: correct
    feedback: '*بهتر است که به داکتر بروی.* *که* и *تو* можно опустить; для «к врачу» говорят также *پیش داکتر*.'
  prs.a2.unit32.lesson02.exercise01.recognize_must_study:
    instruction: Что означает это предложение?
    correct_option: Ты должен учиться каждый день
    distractors:
    - Ты учился каждый день
    - Лучше учиться каждый день
    - Я учусь каждый день
    accepted_answers:
    - value: Ты должен учиться каждый день
      status: correct
    feedback: '*باید هر روز درس بخوانی* — «ты должен учиться каждый день»: *باید* + сослагательная форма *بخوانی*.'
  prs.a2.unit32.lesson02.exercise02.recognize_must_not:
    instruction: Что означает это предложение?
    correct_option: Тебе не надо поздно ложиться спать
    distractors:
    - Ты должен поздно ложиться спать
    - Ты не лёг спать
    - Лучше поздно ложиться спать
    accepted_answers:
    - value: Тебе не надо поздно ложиться спать
      status: correct
    feedback: '*نباید دیر بخوابی* — «тебе нельзя поздно ложиться спать»: *نباید* значит «нельзя, не должен», а *بخوابی* — сослагательная форма.'
  prs.a2.unit32.lesson02.exercise03.match_must:
    instruction: Соедини каждое слово на дари с его значением.
    accepted_answers:
    - value:
        باید بروم: мне надо идти
        باید بروی: тебе надо идти (другу)
        باید برود: ему или ей надо идти
        باید برویم: нам надо идти
        باید بروین: вам надо идти (вежливо или мн. число)
        باید بروند: им надо идти
        نباید بروی: тебе не надо идти
        درس: урок
        امتحان: экзамен
        زود: рано
        دیر: с опозданием
