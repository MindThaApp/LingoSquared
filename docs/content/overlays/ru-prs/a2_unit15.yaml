course:
  title: Дари A2
  description: 'Уровень A2 афганского дари: что делать при сбое в поездке — отмена междугороднего автобуса, вопросы об альтернативах, чтение объявления на станции и сам разговор с сотрудниками станции.'
units:
  prs.a2.unit15.travel_disruption:
    title: Сбой в поездке
lessons:
  prs.a2.unit15.lesson01.disruption_vocabulary:
    title: Слова о сбоях в поездке
  prs.a2.unit15.lesson02.asking_about_alternatives:
    title: Вопросы об альтернативах
  prs.a2.unit15.lesson03.reading_a_station_notice:
    title: Читаем объявление на станции
  prs.a2.unit15.lesson04.station_dialogue:
    title: На автовокзале
teaching:
  prs.a2.unit15.lesson01.teach.delay_word:
    title: Задержка
    gloss: задержка
    note: '*تأخیر* — общее слово для задержки: автобус, встреча, всё, что опаздывает.'
    example_gloss: Сегодня автобус опаздывает на час.
  prs.a2.unit15.lesson01.teach.cancellation_word:
    title: Отмена
    gloss: отмена
    note: '*لغو* употребляется с *شدن* (*لغو شده* — «отменён»).'
    example_gloss: Автобус в 9 часов отменён.
  prs.a2.unit15.lesson01.teach.closed_word:
    title: Закрыт
    gloss: закрыт
    note: '*بسته* говорят о дороге, магазине или офисе, которые закрыты.'
    example_gloss: Дорога Кабул — Мазари-Шариф закрыта.
  prs.a2.unit15.lesson01.teach.alternative_route_word:
    title: Альтернативный маршрут
    gloss: альтернативный маршрут
    note: '*مسیر بدیل* — *مسیر* значит «маршрут», а *بدیل* — «альтернативный».'
    example_gloss: Альтернативного маршрута нет.
  prs.a2.unit15.lesson01.teach.snowfall_word:
    title: Снегопад
    gloss: снегопад
    note: '*برفباری* — *برف* («снег») плюс суффикс, который превращает слово в «снегопад».'
    example_gloss: Из-за снегопада дорога закрыта.
  prs.a2.unit15.lesson01.teach.notice_word:
    title: Объявление
    gloss: объявление
    note: '*اطلاعیه* — вывешенное объявление, например на стене станции.'
    example_gloss: Я прочитал(а) объявление на станции.
  prs.a2.unit15.lesson01.teach.due_to_grammar:
    title: «Из-за», с به دلیل
    gloss: Из-за снегопада автобус отменён.
    note: '*به دلیل* + существительное указывает на причину. Это новый грамматический шаг уровня A2: причинная конструкция в дополнение к *چون* («потому что») из Урока 10, после которого стоит целое предложение.'
  prs.a2.unit15.lesson01.teach.wait_phrase:
    title: Сказать, что нужно подождать
    gloss: Вам нужно подождать до завтрашнего утра.
    note: '*باید ... صبر کنین* — «вам нужно подождать»: окончание глагола во множественном числе вежливой формы, как при обращении к незнакомому человеку.'
  prs.a2.unit15.lesson01.teach.va_word:
    title: И
    gloss: и
    note: '*و* («и») — обычный соединительный союз, которым в этом уроке связываются части предложения.'
    target_text: و (и)
  prs.a2.unit15.lesson01.teach.first_person_wait:
    title: Мне тоже нужно подождать
    gloss: Мне тоже нужно подождать.
    note: В *من هم باید صبر کنم* встречается сослагательная форма 1-го лица *کنم* («я сделаю»). После *باید* («нужно, должен») она стоит без префикса *می‌*.
  prs.a2.unit15.lesson02.teach.ask_next_bus:
    title: Спросить, когда отправляется следующий автобус
    gloss: Когда отправляется следующий автобус?
    note: '*بعدی* означает «следующий».'
  prs.a2.unit15.lesson02.teach.ask_alternative_route:
    title: Спросить про запасной маршрут
    gloss: Есть ли запасной маршрут?
    note: '*وجود دارد؟* — буквально «существует ли?» — распространённый способ спросить, есть ли что-то в наличии.'
  prs.a2.unit15.lesson02.teach.tomorrow_departure:
    title: Назвать время отправления завтра
    gloss: Автобус отправляется завтра в 8 утра.
    note: Здесь снова используется уже знакомая конструкция со словом *ساعت* («час, в … часов»).
  prs.a2.unit15.lesson03.teach.station_word:
    title: Вокзал
    gloss: вокзал
    note: '*ایستگاه* употребляется и для автовокзала, и для железнодорожного вокзала.'
    example_gloss: Хумаюн поехал на автовокзал.
  prs.a2.unit15.lesson03.teach.passengers_word:
    title: Пассажиры
    gloss: пассажиры
    note: '*مسافران* — множественное число от *مسافر* («пассажир, путешественник»).'
    example_gloss: Пассажиры должны подождать.
  prs.a2.unit15.lesson03.teach.notice_text:
    title: Объявление на станции об отменённом автобусе
    gloss: Сегодняшний автобус в Мазари-Шариф в 9 часов отменён из-за снегопада. Дорога Кабул — Мазари-Шариф закрыта. Пассажирам нужно подождать до завтрашнего утра. Следующий автобус отправляется завтра в 8 утра.
    note: Короткое официальное объявление на станции, написанное в формальном письменном стиле, который изучается в этом уроке.
  prs.a2.unit15.lesson04.teach.turn01:
    title: Сотрудник станции приветствует Хумаюна
    gloss: Сотрудник станции спрашивает, чем он может ему помочь.
    note: Вежливое приветствие, как у служащего в Уроке 9 (*بفرمایین، چه خدمتی...*), но здесь со словом *کمکی* («помощь») вместо *خدمتی* («услуга»).
  prs.a2.unit15.lesson04.teach.turn02:
    title: Хумаюн спрашивает про автобус в 9 часов
    gloss: Хумаюн спрашивает, когда отправляется автобус в Мазари-Шариф в 9 часов.
    note: Снова используется вопросительная модель *کی ... می‌کند؟* из второго урока.
  prs.a2.unit15.lesson04.teach.turn03:
    title: Сотрудник станции объясняет отмену
    gloss: Сотрудник станции извиняется и говорит, что этот автобус отменён из-за снегопада.
    note: '*متأسفم* означает «мне жаль, сожалею».'
  prs.a2.unit15.lesson04.teach.turn04:
    title: Хумаюн спрашивает об альтернативе
    gloss: Хумаюн спрашивает, есть ли запасной маршрут.
    note: Тот же вопрос, что и во втором уроке.
  prs.a2.unit15.lesson04.teach.turn05:
    title: Сотрудник станции отвечает и называет срок ожидания
    gloss: Нет, дорога закрыта. Вам нужно подождать до завтрашнего утра.
    note: '*نخیر* — более формальное «нет», парное к *بلی* («да»), как это уже используется в курсе.'
  prs.a2.unit15.lesson04.teach.turn06:
    title: Хумаюн спрашивает про завтрашний автобус
    gloss: Хумаюн спрашивает, в котором часу отправляется завтрашний автобус.
    note: '*چند* здесь означает «который (час)».'
  prs.a2.unit15.lesson04.teach.turn07:
    title: Сотрудник станции называет время
    gloss: Завтрашний автобус отправляется в 8 утра.
    note: Тот же факт, что и во втором уроке, потому что это та же самая информация.
  prs.a2.unit15.lesson04.teach.turn08:
    title: Хумаюн благодарит сотрудника
    gloss: Хумаюн благодарит за информацию.
    note: '*معلومات‌تان* — «ваша информация»: к слову присоединён вежливый притяжательный суффикс *-تان*.'
