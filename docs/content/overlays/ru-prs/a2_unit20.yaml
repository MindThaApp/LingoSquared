teaching:
  prs.a2.unit20.lesson01.teach.rkhst_rkhst_tabstan:
    title: Отпуск
    gloss: отпуск / летний отпуск
    note: '*رخصتی* — обычное слово для отпуска или каникул, а *رخصتی تابستان* — это долгие летние каникулы. *تابستان* — лето.'
    example_gloss:
    - В августе у меня отпуск.
    - Летний отпуск начинается в июле.
  prs.a2.unit20.lesson01.teach.hfth_andh_sal:
    title: Когда что-то происходит
    gloss: на следующей неделе / в следующем году / скоро
    note: '*آینده* означает «следующий, будущий» и стоит после существительного: *هفته آینده* — следующая неделя, *سال آینده* — следующий год. *به‌زودی* означает «скоро».'
    example_gloss:
    - На следующей неделе у меня встреча.
    - В следующем году я хочу поехать в Бельгию.
    - Скоро у меня отпуск.
  prs.a2.unit20.lesson01.teach.sfr_rdn_rzrw:
    title: Три глагола о путешествиях
    gloss: путешествовать / бронировать / оставаться
    note: '*سفر کردن* — это «поездка» + *کردن*, а *رزرو کردن* — «бронь» + *کردن*. В предложении меняется только *کردن*: *سفر می‌کنم*, *رزرو می‌کنم*. *ماندن* означает «оставаться».'
    example_gloss:
    - Я люблю путешествовать на поезде.
    - Я хочу забронировать номер.
    - Я остаюсь на неделю.
  prs.a2.unit20.lesson01.teach.hwtl_m:
    title: Где остановиться
    gloss: отель / кемпинг
    note: '*هوتل* — обычное афганское написание слова «отель». *کمپ* — кемпинг. Ночевать можно *در هوتل* или *در کمپ*.'
    example_gloss:
    - Отель находится близко к пляжу.
    - Мы ночуем в кемпинге.
  prs.a2.unit20.lesson01.teach.dr_rkhst_tabstan:
    title: Вопрос о планах на отпуск
    gloss: Что ты будешь делать в летние каникулы?
    note: 'В дари нет особой вспомогательной формы для ближайших планов: используется обычное настоящее время *می‌کنی*, а вопросительное слово *چه* стоит перед глаголом, который находится в конце предложения.'
  prs.a2.unit20.lesson01.teach.dr_mah_ast:
    title: 'Ближайшие планы: настоящее время'
    gloss: В августе я поеду в Германию. Я забронирую отель.
    note: 'Чтобы сказать, что вы собираетесь сделать в ближайшее время, в дари используется настоящее время со словом, указывающим на время: *می‌روم* (я иду, я поеду) с *در ماه اگست* (в августе). К основе добавляются приставка настоящего времени *می‌* и окончание *-م*: *رزرو می‌کنم*. Глагол всегда стоит в самом конце предложения, а слово со значением времени может стоять в начале: *هفته آینده یک هوتل رزرو می‌کنم*. Без слова о времени та же форма может означать и обычную привычку.'
  prs.a2.unit20.lesson01.teach.mn_hwtl_rzrw:
    title: Бронирование отеля
    gloss: Я собираюсь забронировать отель.
  prs.a2.unit20.lesson02.teach.wrs_rftn_w:
    title: Три плана на потом
    gloss: пойти на курсы / переехать / копить деньги
    note: '*کورس گرفتن* — устойчивое выражение со значением «пойти на курсы». *کوچ کردن* — переезжать в новый дом.'
    example_gloss:
    - Я хочу пойти на курсы.
    - Мой дядя хочет переехать.
    - Я хочу накопить на новый велосипед.
  prs.a2.unit20.lesson02.teach.bad_bad_az:
    title: Дальше в будущем
    gloss: потом / через месяц
    note: '*بعد از یک ماه* означает «через месяц». Так можно сказать и с другими промежутками времени: *بعد از یک هفته*.'
    example_gloss:
    - Потом я хочу купить дом.
    - Через месяц начинаются мои курсы.
  prs.a2.unit20.lesson02.teach.bad_az_mah:
    title: Курсы, которые начинаются
    gloss: Через месяц начинаются мои курсы.
  prs.a2.unit20.lesson02.teach.mn_qsd_darm:
    title: 'Намерения: قصد دارم + сослагательное наклонение'
    gloss: Я собираюсь пойти на курсы.
    note: 'Чтобы сказать, что вы намереваетесь сделать, используйте *قصد دارم* («я намереваюсь»), а второй глагол ставьте в форму субъюнктива: *قصد دارم یک کورس بگیرم*. Субъюнктив образуется так: приставка *بـ* + основа + личное окончание: *بـ* + *گیر* + *-م* = *بگیرم*. Составные глаголы с *کردن* не принимают *بـ*: *پس‌انداز کنم*. Эту конструкцию используйте для того, что вы хотите сделать, а не для твёрдых договорённостей.'
  prs.a2.unit20.lesson02.teach.mn_qsd_darm_2:
    title: Планы на переезд
    gloss: Я планирую переехать.
  prs.a2.unit20.lesson02.teach.mn_qsd_darm_3:
    title: Планы копить деньги
    gloss: Я планирую откладывать деньги.
  prs.a2.unit20.lesson02.teach.frda_bh_bazar:
    title: Настоящее время или قصد دارم?
    gloss: Завтра я иду на базар. Потом я собираюсь переехать.
    note: 'Настоящее время со словом о времени используется для ближайшего, решённого будущего: *فردا به بازار می‌روم*. *قصد دارم* + субъюнктив используется для намерения, которое более отдалено или менее определённо: *بعد قصد دارم کوچ کنم*.'
  prs.a2.unit20.lesson03.teach.shad_htma:
    title: Может быть и непременно
    gloss: возможно / обязательно
    note: '*شاید* выражает сомнение, после него употребляется субъюнктив. *حتما* означает «обязательно» или «непременно».'
    example_gloss:
    - Возможно, завтра будет дождь.
    - Это, конечно, весело.
  prs.a2.unit20.lesson03.teach.amsal_an_tabstan:
    title: В этом году, этим летом
    gloss: в этом году / этим летом
    note: '*امسال* — одно слово со значением «в этом году». *این تابستان* — «этим летом»: *این* означает «этот» и стоит перед существительным.'
    example_gloss:
    - В этом году я не еду в отпуск.
    - Этим летом я остаюсь дома.
    - Ты едешь в отпуск в этом году?
  prs.a2.unit20.lesson03.teach.an_tabstan_dr:
    title: Остаться дома
    gloss: Этим летом я остаюсь дома.
  prs.a2.unit20.lesson03.teach.frda_ar_mnm:
    title: شاید и сослагательное наклонение
    gloss: Завтра я работаю. Может быть, потом схожу в кино.
    note: 'После *شاید* глагол стоит в субъюнктиве: *شاید بعد به سینما بروم* (*بـ* + основа *رو* + *-م*), а не *می‌روم*. Глагол остаётся в конце предложения. После обычного слова о времени используется простое настоящее время: *فردا کار می‌کنم*.'
  prs.a2.unit20.lesson03.teach.bh_rkhst_nmrwm:
    title: Как сказать, что не собираешься
    gloss: Я не еду в отпуск. Я не собираюсь переезжать.
    note: 'Настоящее время отрицается постановкой *ن* перед приставкой глагола: *می‌روم* превращается в *نمی‌روم*: *به رخصتی نمی‌روم*. Чтобы отрицать намерение, отрицайте *دارم*: *قصد ندارم کوچ کنم* («я не намереваюсь переезжать»); второй глагол остаётся в субъюнктиве.'
  prs.a2.unit20.lesson04.teach.ba_h_mdt:
    title: Два вопросительных выражения
    gloss: с кем / как долго
    note: '*با کی* спрашивает, с кем вы что-то делаете; *با* означает «с». *چه مدت* спрашивает о промежутке времени.'
    example_gloss:
    - С кем ты идёшь на пляж?
    - Как долго ты остаёшься?
  prs.a2.unit20.lesson04.teach.ja_mrw:
    title: Куда ты идёшь?
    gloss: Куда ты идёшь?
    note: '*کجا* означает «где», а с глаголом движения — ещё и «куда»: *کجا می‌روی؟* Вопросительное слово стоит в середине предложения, прямо перед глаголом.'
  prs.a2.unit20.lesson04.teach.ba_bh_rkhst:
    title: С кем?
    gloss: С кем ты едешь в отпуск?
  prs.a2.unit20.lesson04.teach.h_mdt_anja:
    title: Как долго?
    gloss: Как долго ты там пробудешь?
  prs.a2.unit20.lesson04.teach.ba_khwahrm_mrwm:
    title: Ответ
    gloss: Я еду с сестрой.
  prs.a2.unit20.lesson04.teach.hfth_dw_hfth:
    title: Недели
    gloss: одна неделя / две недели
    note: 'После числительного существительное в дари остаётся в единственном числе: *دو هفته*, а не *دو هفته‌ها*.'
    example_gloss:
    - Я остаюсь на неделю.
    - Мы пробудем там две недели.
  prs.a2.unit20.lesson04.teach.ja_mrw_ba:
    title: Вопросы о планах
    gloss: Куда ты едешь? С кем ты едешь? Как долго ты пробудешь?
    note: 'В вопросах дари сохраняется обычный порядок слов: вопросительное слово ставится туда, где стоял бы ответ, а глагол остаётся в конце: *با کی به رخصتی می‌روی؟*, *چه مدت می‌مانی؟*. При обращении к другу глагол оканчивается на *-ی*: *می‌روی*, *می‌مانی*.'
  prs.a2.unit20.lesson05.teach.slam_zrmnh_bhzwd:
    title: Сообщение от Марьям
    gloss: Привет, Зармина! Скоро у меня отпуск. В августе я еду с сестрой в Бельгию, и мы проведём неделю в отеле. Потом я на два дня поеду к родителям. В следующем году я собираюсь пойти на курсы, а может быть, ещё и переехать. А ты что делаешь?
    note: 'Марьям рассказывает о ближайших планах в настоящем времени, а о более далёком намерении — с *قصد دارم*. Обратите внимание, что каждый глагол стоит в конце своего предложения: *می‌مانیم*, *بگیرم*, *کنم*.'
    glosses:
      به‌زودی: скоро
      رخصتی: отпуск
      اگست: август
      خواهرم: сестра
      به: в, к
      بلجیم: Бельгия
      هوتل: отель
      می‌مانیم: оставаться
      بعد: после этого
      والدینم: родители
      روز: дни
      آینده: следующий
      سال: год
      قصد: намерение (قصد دارم = я намереваюсь)
      کورس: курс
      بگیرم: брать, пойти (на курсы)
      شاید: может быть
      کوچ: переезжать
      آن‌وقت: потом
      هم: также
  prs.a2.unit20.lesson06.teach.slam_hmawn_bra:
    title: Зармина спрашивает Хомаюна о его планах
    gloss: 'Зармина: Привет, Хомаюн! У тебя уже есть планы на летние каникулы?'
  prs.a2.unit20.lesson06.teach.bl_dr_mah:
    title: Хомаюн отвечает
    gloss: 'Хомаюн: Да! В августе я еду в Германию. Я забронирую отель.'
  prs.a2.unit20.lesson06.teach.aal_ba_mrw:
    title: Зармина спрашивает, с кем он едет
    gloss: 'Зармина: Здорово! С кем ты едешь?'
  prs.a2.unit20.lesson06.teach.ba_aam_ma:
    title: Хомаюн говорит, с кем и на сколько
    gloss: 'Хомаюн: С дядей. Мы пробудем неделю.'
  prs.a2.unit20.lesson06.teach.w_bad_h:
    title: Зармина спрашивает о более далёком будущем
    gloss: 'Зармина: А потом? Что ты собираешься делать?'
  prs.a2.unit20.lesson06.teach.sal_andh_qsd:
    title: Хомаюн называет намерение и спрашивает в ответ
    gloss: 'Хомаюн: В следующем году я собираюсь пойти на курсы. А ты?'
  prs.a2.unit20.lesson06.teach.dr_mah_jwla:
    title: Зармина отвечает
    gloss: 'Зармина: В июле я работаю. Может быть, после этого поеду к родителям.'
