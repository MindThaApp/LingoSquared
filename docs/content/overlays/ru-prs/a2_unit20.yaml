course:
  title: Дари A2
  description: 'Афганский дари, уровень ниже среднего: разговор о планах на отпуск. Настоящее время со словом о времени для ближайших планов, قصد دارم + сослагательное наклонение для намерений, شاید + сослагательное наклонение для сомнения, отрицание и вопросы о планах.'
