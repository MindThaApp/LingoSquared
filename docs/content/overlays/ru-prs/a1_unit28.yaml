  prs.a1.unit28.lesson03.teach.big_word:
    title: Большой
    gloss: большой
    note: بزرگ — «большой» (повторение из Урока 15 о сравнении).
    example_gloss: Моя собака большая.
  prs.a1.unit28.lesson03.teach.combined_sentence:
    title: Моя собака чёрная и большая
    gloss: Моя собака чёрная и большая.
    note: Два признака соединены через و («и», повторение).
  prs.a1.unit28.lesson04.teach.review_to_dari:
    title: Ты / у тебя есть
    gloss: ты (неформально) / у тебя есть (неформально)
    note: تو («ты») и داری («у тебя есть») — повторение; они звучат в неформальном диалоге близких друзей в этом уроке.
    target_text: تو (ты) / داری (у тебя есть)
  prs.a1.unit28.lesson04.teach.review_che_har_roz:
    title: Что / каждый день
    gloss: что / какой / каждый день
    note: چه («что, какой», повторение из вопроса «какой цвет» в Уроке 21) и هر روز («каждый день», повторение из Урока 24) вместе помогают спросить об уходе за питомцем.
    target_text: چه (что/какой) / هر روز (каждый день)
  prs.a1.unit28.lesson04.teach.dialogue_line1:
    title: 'Хумаюн: Зармина, у тебя есть питомец?'
    gloss: 'Хумаюн: Зармина, у тебя есть питомец?'
    note: Неформальный вопрос между друзьями с формой داری («у тебя есть»).
  prs.a1.unit28.lesson04.teach.dialogue_line2:
    title: 'Зармина: Да, у меня есть кошка'
    gloss: 'Зармина: Да, у меня есть кошка.'
    note: Ответ строится из بلی и یک پشک دارم.
  prs.a1.unit28.lesson04.teach.dialogue_line3:
    title: 'Хумаюн: Какого цвета твоя кошка?'
    gloss: 'Хумаюн: Какого цвета твоя кошка?'
    note: Здесь چه رنگ («какого цвета») — та же модель, что в вопросе о покупках в Уроке 21.
  prs.a1.unit28.lesson04.teach.dialogue_line4:
    title: 'Зармина: Белая'
    gloss: 'Зармина: Белая.'
    note: 'Короткий ответ: только цвет и است. Из вопроса и так ясно, что речь о кошке, поэтому پشک не повторяется.'
  prs.a1.unit28.lesson04.teach.dialogue_line5:
    title: 'Хумаюн: Ты кормишь её каждый день?'
    gloss: 'Хумаюн: Ты кормишь её каждый день?'
    note: 'Новое выражение غذا می‌دهی («ты кормишь», неформально): غذا («еда») + می‌دهی — неформальная пара к می‌دهد из Урока 18.'
  prs.a1.unit28.lesson04.teach.dialogue_line6:
    title: 'Зармина: Да, кормлю каждый день'
    gloss: 'Зармина: Да, я кормлю её каждый день.'
    note: هر روز («каждый день») стоит с می‌دهم («я кормлю», 1-е лицо).
  prs.a1.unit28.lesson05.teach.reading_passage:
    title: Читаем о питомце
    gloss: У Зармины есть кошка. Её кошка белая и маленькая. Зармина кормит кошку каждый день.
    note: Короткий текст повторяет слова урока о питомцах и вводит دارد («у неё есть», 3-е лицо, повторение из Уроков 26–27) и می‌دهد («даёт, кормит», 3-е лицо, повторение из Урока 18).
  prs.a1.unit28.lesson06.teach.review_ama:
    title: Но
    gloss: но
    note: اما — «но» (повторение из прошлых уроков).
    target_text: اما (но)
  prs.a1.unit28.lesson06.teach.review_astam:
    title: Я есть / я
    gloss: я есть, я являюсь
    note: استم («я есть, я являюсь») — повторение из прошлых уроков.
    target_text: استم (я являюсь, я)
  prs.a1.unit28.lesson06.teach.wrap_summary:
    title: У меня есть собака, но нет кошки
    gloss: У меня есть собака, но нет кошки.
    note: Два факта о питомцах соединены словом اما.
