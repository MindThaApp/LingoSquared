  prs.a1.unit28.lesson05.reading_animals:
    title: Читаем о животных
  prs.a1.unit28.lesson06.wrap_up:
    title: Итоги
teaching:
  prs.a1.unit28.lesson01.teach.animal_word:
    title: Животное
    gloss: животное
    note: حیوان — «животное», общее слово для домашних питомцев и других живых существ.
    example_gloss: Собака — это животное.
  prs.a1.unit28.lesson01.teach.dog_word:
    title: Собака
    gloss: собака
    note: سگ — «собака».
    example_gloss: У меня есть собака.
  prs.a1.unit28.lesson01.teach.cat_word:
    title: Кошка
    gloss: кошка
    note: پشک — «кошка»; это обычное слово в дари и в Афганистане, в отличие от иранского персидского گربه.
    example_gloss: У меня есть кошка.
  prs.a1.unit28.lesson01.teach.bird_word:
    title: Птица
    gloss: птица
    note: پرنده — «птица».
    example_gloss: У меня есть птица.
  prs.a1.unit28.lesson01.teach.fish_word:
    title: Рыба
    gloss: рыба
    note: ماهی — «рыба».
    example_gloss: У меня есть рыба.
  prs.a1.unit28.lesson01.teach.pet_phrase:
    title: Домашний питомец
    gloss: домашний питомец
    note: 'حیوان خانگی буквально значит «домашнее животное»: حیوان (животное, повторение) + خانگی (домашний).'
    example_gloss: Собака — мой питомец.
  prs.a1.unit28.lesson01.teach.review_daram_dast:
    title: У меня есть / у вас есть (вежливо) / есть
    gloss: у меня есть / у вас есть (вежливо) / есть, является
    note: دارم («у меня есть»), دارین («у вас есть», вежливая форма) и است («есть, является») уже встречались раньше; в этом уроке они нужны, чтобы говорить о питомцах.
    target_text: دارم (я имею, у меня есть) / دارین (вы имеете, вежливая форма) / است (есть, является)
  prs.a1.unit28.lesson02.teach.pet_question:
    title: У тебя есть питомец?
    gloss: У тебя есть питомец?
    note: حیوان خانگی دارین؟ — вежливый вопрос о том, есть ли у человека питомец.
  prs.a1.unit28.lesson02.teach.yes_answer:
    title: Да, у меня есть собака
    gloss: Да, у меня есть собака.
    note: بلی («да», повторение из Урока 3) вместе с новым سگ دارم.
  prs.a1.unit28.lesson02.teach.no_answer:
    title: Нет, у меня нет питомца
    gloss: Нет, у меня нет питомца.
    note: نخیر (вежливое «нет», повторение из Урока 3) вместе с حیوان خانگی ندارم («у меня нет питомца»).
  prs.a1.unit28.lesson02.teach.review_bali_nakhair:
    title: Да / нет / у меня нет
    gloss: да / нет / у меня нет
    note: بلی, نخیر и ندارم уже встречались в Уроке 3 в разговоре о членах семьи; здесь они используются для ответа о питомцах.
    target_text: بلی (да) / نخیر (нет) / ندارم (у меня нет)
  prs.a1.unit28.lesson03.teach.review_rang:
    title: Цвет
    gloss: цвет
    note: رنگ — «цвет» (повторение из Урока 21 об одежде).
    target_text: رنگ (цвет)
  prs.a1.unit28.lesson03.teach.black_word:
    title: Чёрный
    gloss: чёрный
    note: سیاه — «чёрный».
    example_gloss: Моя собака чёрная.
  prs.a1.unit28.lesson03.teach.white_word:
    title: Белый
    gloss: белый
    note: سفید — «белый».
    example_gloss: Моя кошка белая.
  prs.a1.unit28.lesson03.teach.small_word:
    title: Маленький
