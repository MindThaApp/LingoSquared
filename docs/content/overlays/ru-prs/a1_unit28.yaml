course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: названия животных и домашних питомцев (собака, кошка, птица, рыба), вопрос и ответ о том, есть ли у тебя питомец, с фразой حیوان خانگی دارین؟, описание размера и цвета питомца, а также диалог Зар={Зармины} и Хумаюна о том, как завести кошку и кормить её.'
units:
  prs.a1.unit28.animals:
    title: Животные
    description: 'Говорим о домашних питомцах и обычных животных: есть ли у тебя питомец и как за ним ухаживать.'
