course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: оформить заселение в отель, спросить об удобствах номера (ванная, завтрак, вайфай) и о ключе, сказать, на сколько ночей вы остаётесь, прочитать короткое подтверждение брони и спросить о времени выезда.'
units:
  prs.a1.unit45.accommodation:
    title: Отель и номер
    description: Заселитесь в отель, спросите об удобствах номера и о ключе, скажите, на сколько ночей остаётесь, прочитайте подтверждение брони и спросите о времени выезда.
lessons:
  prs.a1.unit45.lesson01.hotel_room_key_vocabulary:
    title: Отель, номер и ключ
  prs.a1.unit45.lesson02.bathroom_and_reservation:
    title: Ванная и бронь
  prs.a1.unit45.lesson03.room_number_and_nights:
    title: Номер комнаты и количество ночей
  prs.a1.unit45.lesson04.hotel_checkin_dialogue:
    title: Диалог при заселении в отель
  prs.a1.unit45.lesson05.reading:
    title: Читаем о брони Хумайуна
  prs.a1.unit45.lesson06.wrap_up:
    title: Итоги
teaching:
  prs.a1.unit45.lesson01.teach.review_this_is_in:
    title: 'Повторение: это, есть, в'
    gloss: это / есть (является) / в
    note: Слова این, است и در (они встречались на протяжении всего курса) — повторяем их, чтобы говорить об отелях и номерах.
    target_text: این (этот, это) / است (есть, является) / در (в)
  prs.a1.unit45.lesson01.teach.hotel_word:
    title: Отель
    gloss: отель
    note: هوتل — афганское дари слово для «отеля», пишется с буквой «вав»; оно отличается от иранского персидского هتل.
    example_gloss: Это отель.
  prs.a1.unit45.lesson01.teach.room_word:
    title: Комната
    gloss: комната
    note: اتاق — обычное дари слово для комнаты.
    example_gloss: Номер находится в отеле.
  prs.a1.unit45.lesson01.teach.room_in_hotel_phrase:
    title: Номер в отеле
    gloss: Номер находится в отеле.
    note: اتاق در هوتل است — фраза из слов, которые мы выучили раньше в этом уроке.
  prs.a1.unit45.lesson01.teach.key_word:
    title: Ключ
    gloss: ключ
    note: کلید — стандартное дари слово для ключа.
    example_gloss: Это ключ.
  prs.a1.unit45.lesson01.teach.room_key_phrase:
    title: Ключ от номера
    gloss: ключ от номера
    note: کلید اتاق соединяет کلید («ключ») и اتاق («комната»).
  prs.a1.unit45.lesson01.teach.this_is_room_key_phrase:
    title: Это ключ от номера
    gloss: Это ключ от номера.
    note: این کلید اتاق است — фраза из слов, которые мы выучили раньше в этом уроке.
  prs.a1.unit45.lesson02.teach.review_have:
    title: 'Повторение: у меня есть, у него есть'
    gloss: у меня есть / в нём есть
    note: Слова دارم и دارد — повторение; они нужны, чтобы спрашивать об удобствах номера.
    target_text: دارم (у меня есть) / دارد (у него, у неё есть)
  prs.a1.unit45.lesson02.teach.bathroom_word:
    title: Ванная
    gloss: ванная
    note: تشناب — обычное дари слово для ванной комнаты или туалета.
    example_gloss: В номере есть ванная.
  prs.a1.unit45.lesson02.teach.room_has_bathroom_question_phrase:
    title: В номере есть ванная?
    gloss: В номере есть ванная?
    note: اتاق تشناب دارد؟ — вопрос с ответом «да/нет», он строится только интонацией, без отдельного вопросительного слова.
  prs.a1.unit45.lesson02.teach.yes_has_bathroom_phrase:
    title: Да, ванная есть
    gloss: Да, в номере есть ванная.
    note: بلی — уже знакомое слово «да».
  prs.a1.unit45.lesson02.teach.reservation_word:
    title: Бронь
    gloss: бронь
    note: رزرو — широко употребительное заимствование со значением «бронь, бронирование».
    example_gloss: У меня есть бронь.
  prs.a1.unit45.lesson02.teach.have_reservation_phrase:
    title: У меня есть бронь
    gloss: У меня есть бронь.
    note: رزرو دارم соединяет رزرو («бронь») и دارم («у меня есть»).
  prs.a1.unit45.lesson03.teach.review_which_number_for:
    title: 'Повторение: сколько/какой номер, для, я хочу'
    gloss: сколько / какой номер / для / я хочу
    note: Слова چند, برای и می‌خواهم — повторение; они нужны, чтобы спрашивать о номере.
    target_text: چند (сколько) / برای (для) / می‌خواهم (я хочу)
  prs.a1.unit45.lesson03.teach.number_word:
    title: Номер
    gloss: номер
    note: نمبر — обычное афганское дари заимствование со значением «номер»; его используют для номеров комнат, телефонов и т. п.
    example_gloss: номер комнаты
  prs.a1.unit45.lesson03.teach.what_is_room_number_phrase:
    title: Какой номер комнаты?
    gloss: Какой номер комнаты?
    note: نمبر اتاق چند است؟ — вопрос о номере комнаты со словом چند.
  prs.a1.unit45.lesson03.teach.review_night_numbers:
    title: 'Повторение: ночь, два, три'
    gloss: ночь / два / три
    note: Слова شب, دو и سه — повторение; они нужны, чтобы назвать срок проживания.
    target_text: شب (ночь) / دو (два) / سه (три)
  prs.a1.unit45.lesson03.teach.stay_word:
    title: Я остаюсь
    gloss: я остаюсь
    note: می‌مانم происходит от ماندن — «оставаться».
    example_gloss: Я остаюсь на две ночи.
  prs.a1.unit45.lesson03.teach.stay_two_nights_phrase:
    title: Я остаюсь на две ночи
    gloss: Я остаюсь на две ночи.
    note: دو شب می‌مانم соединяет دو شب («две ночи») и می‌مانم («я остаюсь»).
  prs.a1.unit45.lesson03.teach.for_two_nights_phrase:
    title: Я хочу на две ночи
    gloss: Я хочу на две ночи.
    note: برای دو شب می‌خواهم — здесь برای («для, на») употребляется со знакомым словом می‌خواهم.
  prs.a1.unit45.lesson03.teach.review_stay_formal:
    title: 'Повторение: вы остаётесь (вежливо)'
    gloss: вы остаётесь (вежливо)
    note: می‌مانین — вежливая форма «вы» от می‌مانم; она относится к тому же ряду на -ین, что می‌خواهین и کنین в других частях курса.
    target_text: می‌مانین (вы остаётесь, вежливая форма)
  prs.a1.unit45.lesson03.teach.how_many_nights_formal_phrase:
    title: Сколько ночей вы остаётесь?
    gloss: Сколько ночей вы остаётесь?
    note: چند شب می‌مانین؟ — вежливый вопрос, который задаёт администратор отеля.
  prs.a1.unit45.lesson04.teach.review_welcome_name_am:
    title: 'Повторение: добро пожаловать, как вас зовут?, я есть'
    gloss: добро пожаловать / как вас зовут? / я (есть)
    note: Выражения خوش آمدین, نام‌تان چیست؟ и استم — повторение; они нужны при заселении.
    target_text: خوش آمدین (добро пожаловать) / نام‌تان چیست؟ (как вас зовут?) / استم (я есть)
  prs.a1.unit45.lesson04.teach.review_also_how_about_please_thanks:
    title: 'Повторение: тоже, а как насчёт, пожалуйста (вот), большое спасибо'
    gloss: тоже / а как насчёт / вот, пожалуйста / большое спасибо
    note: Слова هم, چطور, بفرمایین и تشکر زیاد (из прошлых уроков) — повторение; они нужны, чтобы завершить диалог.
    target_text: هم (тоже) / چطور (а как насчёт) / بفرمایین (пожалуйста, вот) / تشکر زیاد (большое спасибо)
  prs.a1.unit45.lesson04.teach.breakfast_phrase:
    title: Завтрак
    gloss: завтрак
    note: چای صبح буквально значит «утренний чай» — так в Афганистане обычно называют завтрак; слово составлено из چای («чай», урок 8) и صبح («утро», урок 16).
  prs.a1.unit45.lesson04.teach.included_word:
    title: Включено
    gloss: включённый
    note: شامل значит «включён»; так говорят, что услуга входит в стоимость номера.
    example_gloss: Завтрак включён.
  prs.a1.unit45.lesson04.teach.wifi_word:
    title: Вайфай
    gloss: вайфай
    note: وای‌فای — стандартное заимствование со значением «вайфай».
    example_gloss: Вайфай тоже есть.
  prs.a1.unit45.lesson04.teach.dialogue_line1:
    title: 'Хумайун: Здравствуйте. У меня есть бронь. Я остаюсь на две ночи.'
    gloss: Здравствуйте. У меня есть бронь. Я остаюсь на две ночи.
  prs.a1.unit45.lesson04.teach.dialogue_line2:
    title: 'Администратор отеля: Добро пожаловать. Как вас зовут?'
    gloss: Добро пожаловать. Как вас зовут?
  prs.a1.unit45.lesson04.teach.dialogue_line3:
    title: 'Хумайун: Я Хумайун.'
    gloss: Я Хумайун.
  prs.a1.unit45.lesson04.teach.dialogue_line4:
    title: 'Администратор отеля: Очень хорошо. В номере есть ванная, завтрак включён.'
    gloss: Очень хорошо. В номере есть ванная, и завтрак включён.
  prs.a1.unit45.lesson04.teach.dialogue_line5:
    title: 'Хумаюн: А как насчёт вайфая?'
    gloss: А как насчёт вайфая?
  prs.a1.unit45.lesson04.teach.dialogue_line6:
    title: 'Администратор отеля: Да, вайфай тоже есть. Вот ключ.'
    gloss: Да, вайфай тоже есть. Вот ключ.
  prs.a1.unit45.lesson05.teach.review_reading_words:
    title: 'Повторение: бронь, номер, пять, понедельник, вторник, и'
    gloss: бронь / номер / пять / понедельник / вторник / и
    note: Слова رزرو, نمبر (из этого урока), پنج, دوشنبه, سه‌شنبه и و повторяются в тексте для чтения.
    target_text: رزرو (бронь) / نمبر (номер) / پنج (пять) / دوشنبه (понедельник) / سه‌شنبه (вторник) / و (и)
  prs.a1.unit45.lesson05.teach.review_stays_third_person:
    title: 'Повторение: он/она остаётся'
    gloss: он/она остаётся
    note: می‌ماند — форма 3-го лица от глагола, формы которого می‌مانم/می‌مانین ты уже видел(а) в этом уроке.
    target_text: می‌ماند (он, она остаётся)
  prs.a1.unit45.lesson05.teach.reading_passage:
    title: Текст о брони Хумаюна
    gloss: 'Это бронь Хумаюна. Номер комнаты — пять. Хумаюн остаётся на две ночи: в понедельник и вторник. В номере есть ванная, и завтрак включён.'
  prs.a1.unit45.lesson06.teach.review_but_formal_you_hour_time_numbers:
    title: 'Повторение: но, вы (вежливо), час, время, семь, двенадцать'
    gloss: но / вы (вежливо) / час / время / семь / двенадцать
    note: Слова اما, شما, ساعت, وقت (из предыдущих уроков) и هفت/دوازده повторяются, чтобы назвать расписание.
    target_text: اما (но) / شما (вы, вежливая форма) / ساعت (час) / وقت (время) / هفت (семь) / دوازده (двенадцать)
  prs.a1.unit45.lesson06.teach.checkout_word:
    title: Выезд из отеля / выход
    gloss: выезд / выход
    note: خروج обозначает выезд из отеля, как в сочетании وقت خروج.
    example_gloss: время выезда
  prs.a1.unit45.lesson06.teach.checkout_time_phrase:
    title: Выезд в двенадцать часов
    gloss: Время выезда — двенадцать часов.
    note: وقت خروج ساعت دوازده است — так называют время выезда.
  prs.a1.unit45.lesson06.teach.contrast_breakfast_checkout_phrase:
    title: Завтрак в семь, а выезд в двенадцать
    gloss: Завтрак в семь часов, но время выезда — двенадцать часов.
    note: اما противопоставляет время завтрака и время выезда.
  prs.a1.unit45.lesson06.teach.checkout_time_question_phrase:
    title: Во сколько у вас выезд?
    gloss: Во сколько у вас выезд?
    note: Вежливый вопрос о времени выезда с использованием شما («вы»).
  prs.a1.unit45.lesson04.teach.review_very_good_tea_morning_and:
    target_text: بسیار خوب (очень хорошо) / چای (чай) / صبح (утро) / و (и)
