  prs.a1.unit30.lesson03.frequency_question:
    title: Сколько раз в день?
  prs.a1.unit30.lesson04.tech_dialogue:
    title: Диалог о технологиях
  prs.a1.unit30.lesson05.reading_technology:
    title: Читаем о технологиях
  prs.a1.unit30.lesson06.wrap_up:
    title: Итоги
teaching:
  prs.a1.unit30.lesson01.teach.tech_word:
    title: Технология
    gloss: технология
    note: تکنالوژی — это «технология»; так слово пишут в Афганистане, в отличие от иранского написания تکنولوژی.
    example_gloss: Технология — это хорошо.
  prs.a1.unit30.lesson01.teach.mobile_word:
    title: Мобильный телефон
    gloss: мобильный телефон
    note: موبایل — это «мобильный телефон», в отличие от более общего слова تلفن («телефон», повторение из Урока 7).
    example_gloss: У меня есть мобильный телефон.
  prs.a1.unit30.lesson01.teach.computer_word:
    title: Компьютер
    gloss: компьютер
    note: کمپیوتر — это «компьютер»; обычное заимствование, общее для персидского и дари.
    example_gloss: Компьютер в офисе.
  prs.a1.unit30.lesson01.teach.internet_word:
    title: Интернет
    gloss: интернет
    note: انترنت — это «интернет»; обычное заимствование, общее для персидского и дари.
    example_gloss: Интернет медленный.
  prs.a1.unit30.lesson01.teach.app_word:
    title: Приложение
    gloss: приложение
    note: اپلیکیشن — это «приложение» (мобильное); обычное заимствование, общее для персидского и дари.
    example_gloss: Это приложение хорошее.
  prs.a1.unit30.lesson01.teach.photo_word:
    title: Фото
    gloss: фотография
    note: عکس — это «фото» или «снимок».
    example_gloss: Это фото хорошее.
  prs.a1.unit30.lesson01.teach.review_estefade_kardan:
    title: Пользоваться
    gloss: использование + делать → я пользуюсь
    note: استفاده («использование») сочетается с کردن («делать», повторение) и даёт استفاده می‌کنم («я пользуюсь») — это та же модель «имя + глагол-связка», что уже встречалась в курсе, например بازی می‌کنم (Урок 29) и ورزش می‌کنم (Урок 29).
    target_text: استفاده (использование) + کردن (делать) = استفاده می‌کنم (я пользуюсь)
  prs.a1.unit30.lesson01.teach.combined_sentence:
    title: Я пользуюсь интернетом
    gloss: Я пользуюсь интернетом.
    note: Сочетает من («я», повторение), از («из/с помощью», повторение), انترنت и استفاده می‌کنم.
  prs.a1.unit30.lesson02.teach.review_peyam:
    title: Сообщение
    gloss: сообщение
    note: پیام — это «сообщение».
    target_text: پیام (сообщение)
  prs.a1.unit30.lesson02.teach.mifrestam_phrase:
    title: Я отправляю сообщение
    gloss: Я отправляю сообщение
    note: می‌فرستم значит «я отправляю» — это новый глагол, не похожий на глагол بگذارم («оставить сообщение») из Урока 7.
  prs.a1.unit30.lesson02.teach.review_zang_mizanam:
    title: Я звоню
    gloss: я звоню
    note: زنگ می‌زنم значит «я звоню».
    target_text: زنگ می‌زنم (я звоню)
  prs.a1.unit30.lesson02.teach.akas_migiram_phrase:
    title: Я делаю фото
    gloss: Я делаю фото
    note: В عکس می‌گیرم используется می‌گیرم («я беру/получаю», повторение из Урока 23) со словом عکس.
  prs.a1.unit30.lesson02.teach.download_word:
    title: Скачивание
    gloss: скачивать
    note: دانلود — обычное заимствование в дари для «скачивания»; оно сочетается с کردن («делать») как глагол-связка, например دانلود می‌کنم («я скачиваю»).
    example_gloss: Я скачиваю приложение.
  prs.a1.unit30.lesson02.teach.want_download_app_phrase:
    title: Я хочу скачать приложение
    gloss: Я хочу скачать приложение
    note: Здесь та же модель می‌خواهم + сослагательное наклонение, что и в می‌خواهم یک پیام بگذارم («я хочу оставить сообщение») из Урока 7.
  prs.a1.unit30.lesson03.teach.review_chand_bar:
    title: Сколько / раз
    gloss: сколько / раз
    note: چند بار используется здесь, чтобы спросить о частоте.
    target_text: چند (сколько) / بار (раз)
  prs.a1.unit30.lesson03.teach.review_ruz:
    title: День
    gloss: день
    note: روز — это «день».
    target_text: روز (день)
  prs.a1.unit30.lesson03.teach.review_mikonin:
    title: Вы пользуетесь (вежливо)
    gloss: вы пользуетесь (вежливая форма)
    note: استفاده می‌کنین — вежливая форма «вы пользуетесь», как и ورزش می‌کنین из Урока 29.
    target_text: استفاده می‌کنین (вы пользуетесь, вежливая форма)
  prs.a1.unit30.lesson03.teach.question_frequency:
    title: Сколько раз в день вы пользуетесь мобильным телефоном?
    gloss: Сколько раз в день вы пользуетесь мобильным телефоном?
    note: Сочетает چند بار («сколько раз»), در روز («в день»), از موبایل («мобильным телефоном») и استفاده می‌کنین.
  prs.a1.unit30.lesson03.teach.answer_har_ruz:
    title: Я каждый день пользуюсь интернетом
    gloss: Я каждый день пользуюсь интернетом.
    note: هر روز сочетается с از انترنت استفاده می‌کنم.
  prs.a1.unit30.lesson04.teach.review_mikonad:
    title: Он/она пользуется
    gloss: он/она пользуется
    note: استفاده می‌کند — форма 3-го лица, как می‌کند, которое повторялось в Уроке 29.
    target_text: استفاده می‌کند (он/она пользуется, 3-е лицо)
  prs.a1.unit30.lesson04.teach.review_to_miokni:
    title: Ты / ты пользуешься
    gloss: ты / ты пользуешься
    note: تو и می‌کنی — неформальное обращение, которое используют друг с другом Хомаюн и Зармина.
    target_text: تو (ты) / می‌کنی (ты пользуешься)
  prs.a1.unit30.lesson04.teach.review_koja:
    title: Где
    gloss: где
    note: کجا — это «где».
    target_text: کجا (где)
  prs.a1.unit30.lesson04.teach.dialogue_line1:
    title: 'Хомаюн: Зармина, сколько раз в день ты пользуешься мобильным телефоном?'
    gloss: Зармина, сколько раз в день ты пользуешься мобильным телефоном?
  prs.a1.unit30.lesson04.teach.dialogue_line2:
    title: 'Зармина: Я много пользуюсь мобильным телефоном. Я делаю фото и отправляю сообщения.'
    gloss: Я много пользуюсь мобильным телефоном. Я делаю фото и отправляю сообщения.
  prs.a1.unit30.lesson04.teach.dialogue_line3:
    title: 'Хомаюн: Ты пользуешься компьютером?'
    gloss: Ты пользуешься компьютером?
  prs.a1.unit30.lesson04.teach.dialogue_line4:
    title: 'Зармина: Да, в офисе я пользуюсь компьютером.'
    gloss: Да, в офисе я пользуюсь компьютером.
  prs.a1.unit30.lesson04.teach.dialogue_line5:
    title: 'Хомаюн: Я каждый день пользуюсь интернетом.'
    gloss: Я каждый день пользуюсь интернетом.
  prs.a1.unit30.lesson04.teach.dialogue_line6:
    title: 'Зармина: Отлично!'
    gloss: Отлично!
  prs.a1.unit30.lesson05.teach.reading_passage:
    title: Читаем о технологиях
    gloss: Зармина каждый день пользуется мобильным телефоном. Она делает фото и отправляет сообщения. В офисе она пользуется компьютером. Хомаюн каждый день пользуется интернетом.
  prs.a1.unit30.lesson06.teach.review_ama:
    title: Но
    gloss: но
    note: اما — это «но».
    target_text: اما (но)
  prs.a1.unit30.lesson06.teach.review_like_have_time:
    title: Мне нравится / время / у меня нет
    gloss: я люблю / время / у меня нет
    note: دوست دارم («мне нравится»), وقت («время») и ندارم («у меня нет») — всё это повторение из Уроков 11, 14, 26 и 29.
    target_text: دوست دارم (я люблю) / وقت (время) / ندارم (у меня нет)
  prs.a1.unit30.lesson06.teach.wrap_summary:
    title: Я люблю технологии, но у меня нет времени
    gloss: Я люблю технологии, но у меня нет времени.
    note: Сочетает تکنالوژی را دوست دارم («я люблю технологии», знакомая конструкция) с اما وقت ندارم («но у меня нет времени»).
