course:
  title: Дари A1
  description: 'Дари Кабула для начинающих: лексика о технике и устройствах (мобильный телефон, компьютер, интернет, приложение, фото), выражения о действиях с телефоном (отправить сообщение, позвонить, сделать фото, скачать приложение), вопрос и ответ о том, сколько раз в день ты пользуешься мобильным телефоном, и диалог Зармины и Хомаюна о телефоне, компьютере и интернете.'
units:
  prs.a1.unit30.technology:
    title: Технологии
    description: Говори о телефонах, компьютерах, интернете и приложениях и о том, как часто ты ими пользуешься.
