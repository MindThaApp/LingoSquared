course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: базовая лексика для поездок, покупка билета, вопросы о времени отправления и платформе, чтение короткого расписания и диалог у кассы.'
units:
  prs.a1.unit16.travel:
    title: Путешествие
    description: Разбираться в базовой информации о транспорте, билетах, пунктах назначения и отправлении.
lessons:
  prs.a1.unit16.lesson01.basic_travel_vocab:
    title: Базовая лексика для поездок
  prs.a1.unit16.lesson02.buying_a_ticket:
    title: Покупка билета
  prs.a1.unit16.lesson03.asking_departure_details:
    title: Вопросы о времени отправления и платформе
  prs.a1.unit16.lesson04.reading_a_schedule:
    title: Чтение расписания отправлений
  prs.a1.unit16.lesson05.ticket_counter_dialogue:
    title: Диалог у кассы
  prs.a1.unit16.lesson06.confirming_travel_plans:
    title: Подтверждение планов поездки
teaching:
  prs.a1.unit16.lesson01.teach.belit_word:
    title: Билет
    gloss: билет
    note: تکت означает «билет». Это обычное слово в афганском дари; بلیط (также пишется بلیت, слово в иранском стиле) понятно и допустимо, но чаще всего вы услышите именно تکت.
    example_gloss: У меня есть билет.
  prs.a1.unit16.lesson01.teach.qatar_word:
    title: Поезд
    gloss: поезд
    note: قطار означает «поезд».
    example_gloss: Поезд хороший.
  prs.a1.unit16.lesson01.teach.bas_word:
    title: Автобус
    gloss: автобус
    note: بس означает «автобус» — обычное слово в афганском дари.
    example_gloss: Автобус хороший.
  prs.a1.unit16.lesson01.teach.maidan_hawayi_word:
    title: Аэропорт
    gloss: аэропорт
    note: میدان هوایی означает «аэропорт» — устоявшийся в этом курсе афганский термин (не иранское فرودگاه), как и в Уроке 5.
    example_gloss: Аэропорт хороший.
  prs.a1.unit16.lesson01.teach.yak_word:
    title: Один
    gloss: один
    note: یک означает «один»; здесь оно стоит перед существительным в значении «какой-то, один» (один билет).
    target_text: یک (один)
  prs.a1.unit16.lesson01.teach.az_word:
    title: Из / от
    gloss: от, из
    note: از означает «из, от» и указывает на место отправления (в сравнениях у него другое значение — «чем»).
    target_text: از (из, от)
  prs.a1.unit16.lesson01.teach.doo_word:
    title: Два
    gloss: два
    note: دو означает «два».
    example_gloss: У меня два билета.
  prs.a1.unit16.lesson01.teach.sekooye_word:
    title: Платформа два
    gloss: второй перрон
    note: سکوی دو соединяет سکو (платформа) с изафетом -ی и دو (два).
    target_text: سکوی دو (платформа два)
  prs.a1.unit16.lesson02.teach.herat_word:
    title: Герат
    gloss: Герат
    note: Крупный город на западе Афганистана.
    example_gloss: Я еду в Герат.
  prs.a1.unit16.lesson02.teach.mikhaham_word:
    title: Я хочу
    gloss: я хочу
    note: می‌خواهم — полная, нестянутая форма «я хочу», в соответствии с регистром этого курса.
    target_text: می‌خواهم (я хочу)
  prs.a1.unit16.lesson02.teach.be_word:
    title: В / до
    gloss: в
    note: 'به указывает пункт назначения: به هرات означает «в Герат».'
    target_text: به (в, к)
  prs.a1.unit16.lesson02.teach.belit_be_herat_phrase:
    title: Я хочу билет в Герат
    gloss: Я хочу билет в Герат
    note: یک تکت به هرات می‌خواهم объединяет лексику этого урока в стандартную фразу для просьбы о билете.
  prs.a1.unit16.lesson03.teach.sekoo_word:
    title: Платформа
    gloss: платформа
    note: سکو означает «платформа» (на железнодорожной станции).
    example_gloss: Поезд отправляется со второй платформы.
  prs.a1.unit16.lesson03.teach.harekat_mikonad_phrase:
    title: Он отправляется
    gloss: он отправляется
    note: حرکت می‌کند — полная, неслитная форма глагола «отправляется, движется».
    target_text: حرکت می‌کند (отправляется)
  prs.a1.unit16.lesson03.teach.kay_word:
    title: Когда
    gloss: когда
    note: کی означает «когда» и используется, чтобы спросить о времени.
    target_text: کی (когда)
  prs.a1.unit16.lesson04.teach.sobh_word:
    title: Утро
    gloss: утро
    note: صبح означает «утро».
    example_gloss: Поезд отправляется в восемь утра.
  prs.a1.unit16.lesson04.teach.schedule_text:
    title: Пример расписания
    gloss: Поезд на Герат отправляется со второй платформы в восемь утра.
    note: Короткое информационное объявление, в котором собрана лексика этого урока о поездках. Поскольку звуковых записей на дари нет, этот письменный текст заменяет объявление на вокзале.
  prs.a1.unit16.lesson05.teach.farda_word:
    title: Завтра
    gloss: завтра
    note: فردا означает «завтра».
    example_gloss: Я поеду завтра утром.
  prs.a1.unit16.lesson05.teach.besyar_khoob_word:
    title: Очень хорошо / ладно
    gloss: очень хорошо / ладно
    note: بسیار خوب — полная, вежливая форма для «ладно, очень хорошо», она соответствует стилю этого курса (в отличие от разговорного باشه).
    example_gloss: Поезд очень хороший.
  prs.a1.unit16.lesson05.teach.dialogue_line1:
    title: Путешественник говорит
    gloss: Мне нужен билет до Герата.
  prs.a1.unit16.lesson05.teach.dialogue_line2:
    title: Продавец спрашивает
    gloss: Когда вы хотите ехать?
  prs.a1.unit16.lesson05.teach.dialogue_line3:
    title: Путешественник отвечает
    gloss: Завтра утром.
  prs.a1.unit16.lesson05.teach.dialogue_line4:
    title: Продавец подтверждает
    gloss: Очень хорошо, поезд отправляется со второй платформы в восемь утра.
  prs.a1.unit16.lesson06.teach.tashakor_ziyad_word:
    title: Большое спасибо
    gloss: большое спасибо
    note: تشکر زیاد — распространённый вежливый способ сказать «большое спасибо», уже встречавшийся в уроках 5 и 6.
  prs.a1.unit16.lesson06.teach.qabeli_nadara_phrase:
    title: Пожалуйста
    gloss: не за что
    note: قابلی نداره — стандартный вежливый ответ на благодарность («не за что»), уже встречавшийся в уроках 5 и 6.
  prs.a1.unit16.lesson06.teach.safar_khosh_phrase:
    title: Счастливого пути
    gloss: счастливого пути
    note: سفر خوش — распространённое пожелание тому, кто собирается в дорогу; уже встречалось в уроке 6.
  prs.a1.unit16.lesson06.teach.va_word:
    title: И
    gloss: и
    note: و означает «и» и соединяет две части предложения или два элемента.
    target_text: و (и)
