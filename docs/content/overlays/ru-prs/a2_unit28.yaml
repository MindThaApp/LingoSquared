course:
  title: Дари A2
  description: 'Дари Афганистана, уровень выше начального: как предсказывать события и давать обещания. Настоящее время со словом времени (فردا باران می‌بارد), «может быть» и «вероятно» с конъюнктивом, обещания с حتماً и قول می‌دهم, а также письменное будущее время для чтения прогнозов и объявлений.'
units:
  prs.a2.unit28.predictions_promises:
    title: Предсказания и обещания
lessons:
  prs.a2.unit28.lesson01.weather_predictions:
    title: Погода и предсказания в настоящем времени
  prs.a2.unit28.lesson02.maybe_and_probably:
    title: «Может быть» и «вероятно»
  prs.a2.unit28.lesson03.promises:
    title: Обещания
  prs.a2.unit28.lesson04.sure_or_maybe:
    title: Точно, вероятно, может быть
  prs.a2.unit28.lesson05.forecast_and_notice:
    title: Читаем и слушаем о погоде
  prs.a2.unit28.lesson06.meeting_conversation:
    title: Разговор о встрече
teaching:
  prs.a2.unit28.lesson01.teach.weather:
    title: Погода
    gloss: погода, воздух
    note: '*هوا* — это погода, а также воздух. *هوای کابل* — погода в Кабуле: чтобы связать два слова, перед названием места добавляется *-ی*.'
    example_gloss: Сегодня в Кабуле холодно.
  prs.a2.unit28.lesson01.teach.cold:
    title: Холодно
    gloss: холодно
    note: '*سرد* — холодный. Противоположное слово — *گرم* (тёплый, жаркий), оно тебе уже знакомо. *هوا سرد است* — «сейчас холодно», а *هوا سرد می‌شود* — «становится холодно».'
    example_gloss: Завтра утром похолодает.
  prs.a2.unit28.lesson01.teach.sunny:
    title: Солнечно
    gloss: солнечный
    note: '*آفتابی* — солнечный: *هوا آفتابی است* значит «день солнечный».'
    example_gloss: Сегодня солнечная погода.
  prs.a2.unit28.lesson01.teach.cloudy:
    title: Облачно
    gloss: облачно
    note: '*ابری* — облачный. Облака часто приходят перед *باران* (дождём) и *برف* (снегом).'
    example_gloss: Сегодня вечером небо затянет облаками.
  prs.a2.unit28.lesson01.teach.forecast:
    title: Прогноз
    gloss: прогноз, предсказание
    note: '*پیش‌بینی* — прогноз или предсказание. *پیش‌بینی هوا* — прогноз погоды. Это слово звучит по радио, по телевизору и по телефону, когда планируют поездку.'
    example_gloss: Я видел(а) прогноз погоды.
  prs.a2.unit28.lesson01.teach.tonight:
    title: Сегодня вечером
    gloss: сегодня вечером, сегодня ночью
    note: '*امشب* — сегодня вечером. Это слово времени, как *فردا* (завтра) и *امروز* (сегодня). Это первое из слов времени, которые нужны, чтобы говорить о том, что произойдёт.'
    example_gloss: Сегодня вечером будет дождь.
  prs.a2.unit28.lesson01.teach.dayafter:
    title: Послезавтра
    gloss: послезавтра
    note: '*پس‌فردا* — послезавтра. Внутри слова пишется небольшой промежуток (полупробел), как в *می‌شود*.'
    example_gloss: Послезавтра потеплеет.
  prs.a2.unit28.lesson01.teach.predict_form:
    title: 'Предсказание: می‌ и слово времени'
    gloss: Завтра будет дождь. Сегодня вечером похолодает. Послезавтра будет солнечно.
    note: 'Чтобы сказать, что произойдёт, используй настоящее время с *می‌* и добавь в предложение слово времени. Глагол не меняется: *می‌بارد* («идёт») и *فردا باران می‌بارد* («завтра будет дождь») — один и тот же глагол. Слово времени *فردا*, *امشب* или *پس‌فردا* показывает слушающему, что речь о будущем. Для погоды часто берут *می‌شود* («становится»): *فردا هوا سرد می‌شود* — «завтра похолодает». Это обычный разговорный способ предсказать то, в чём ты довольно уверен.'
  prs.a2.unit28.lesson01.teach.plans_form:
    title: Одна и та же форма для планов и событий
    gloss: Завтра я иду на базар. На следующей неделе мы едем в Бамиан.
    note: 'То же настоящее время с *می‌* и словом времени подходит и для людей: *فردا به بازار می‌روم* — «завтра я пойду на базар», а *هفتهٔ آینده به بامیان می‌رویم* — «на следующей неделе мы поедем в Бамиан». Здесь выучи форму для *ما*: *می‌رویم* («мы идём, едем»). Другие слова времени: *امسال* (в этом году), *هفتهٔ آینده* (на следующей неделе), *بعد* (потом).'
  prs.a2.unit28.lesson01.teach.sentence:
    title: Завтра погода станет холодной
    gloss: Завтра похолодает.
    note: 'Это модель всего урока: слово времени, подлежащее и глагол в настоящем времени с *می‌*. Никакого особого окончания будущего времени не нужно.'
  prs.a2.unit28.lesson02.teach.maybe:
    title: Может быть
    gloss: может быть, возможно
    note: '*شاید* значит «может быть». Оно стоит в начале предложения, а глагол после него стоит в конъюнктиве (в той же форме, что и после *باید*), потому что говорящий не уверен: *شاید برف ببارد* — «может быть, пойдёт снег». *ممکن است برف ببارد* значит то же самое.'
    example_gloss: Может быть, завтра будет дождь.
  prs.a2.unit28.lesson02.teach.probably:
    title: Вероятно
    gloss: вероятно, скорее всего
    note: '*احتمالاً* сильнее, чем *شاید*: ты считаешь, что это скорее случится, чем нет. После него идёт обычное настоящее время, а не конъюнктив: *احتمالاً امشب برف می‌بارد*.'
    example_gloss: Сегодня вечером, вероятно, пойдёт снег.
  prs.a2.unit28.lesson02.teach.possible:
    title: Возможно, пойдёт снег
    gloss: Возможно, пойдёт снег.
    note: '*ممکن است* значит «возможно, что». Как и после *شاید*, дальше идёт конъюнктив: *ممکن است برف ببارد*.'
  prs.a2.unit28.lesson02.teach.subj_form:
    title: 'Конъюнктив: ب и основа настоящего времени'
    gloss: чтобы я пошёл, чтобы ты пошёл, чтобы он пошёл, чтобы мы пошли, чтобы вы пошли (вежливая форма или множественное число), чтобы они пошли
    note: 'Конъюнктив — это основа настоящего времени с *ب* спереди и теми же окончаниями, что и в настоящем времени: *می‌روم* («я иду») превращается в *بروم* («чтобы я пошёл»). Окончания — *-م، -ی، -د، -یم، -ین، -ند*, получаются формы *بروم، بروی، برود، برویم، بروین، بروند*. Эту форму ты уже знаешь по *باید*; *شاید* требует той же формы. Не ставь перед ней *می‌*.'
  prs.a2.unit28.lesson02.teach.subj_more:
    title: Конъюнктив других глаголов
    gloss: Может быть, он придёт. Может быть, автобус приедет. Может быть, пойдёт снег. Может быть, это сломается.
    note: 'Правило одинаково для каждого глагола: *آمدن* даёт *بیاید* («чтобы он пришёл»), *رسیدن* даёт *برسد* («чтобы он прибыл»), *باریدن* даёт *ببارد* («чтобы пошёл снег или дождь»). У *شدن* краткая форма *شود*, поэтому говорят *شاید خراب شود* («может быть, это сломается»). У *بودن* конъюнктив — *باشد*: *شاید در خانه باشد* («может быть, он дома»).'
  prs.a2.unit28.lesson02.teach.subj_negative:
    title: 'Отрицание: ن перед конъюнктивом'
    gloss: Может быть, он не придёт. Может быть, мы не пойдём. Может быть, снег не пойдёт.
    note: 'Чтобы сказать «может быть, не», поставь *ن* перед конъюнктивом и убери *ب*: *بروم* становится *نروم*, *برویم* — *نرویم*, *ببارد* — *نبارد*. Глагол *آمدن* надо запомнить отдельно: его отрицание — *نیاید* (а не *نبیاید*).'
  prs.a2.unit28.lesson02.teach.sentence:
    title: Может быть, завтра пойдёт снег
    gloss: Может быть, завтра пойдёт снег.
    note: Сравни с *فردا برف می‌بارد*. Это предложение говорит, что снег пойдёт, а то, что с شاید, — что он может пойти.
  prs.a2.unit28.lesson02.teach.sure_vs_maybe:
    title: Уверен или не уверен
    gloss: Он придёт завтра. Может быть, он придёт завтра.
    note: 'Глагол показывает слушающему, насколько ты уверен. С *می‌* ты уверен: *فردا می‌آید* — «он придёт завтра». С *شاید* глагол стоит в конъюнктиве, и ты не уверен: *شاید فردا بیاید* — «может быть, он придёт завтра».'
  prs.a2.unit28.lesson03.teach.surely:
    title: Обязательно
    gloss: обязательно, непременно
    note: '*حتماً* значит «обязательно, непременно». Поставь его перед обычным глаголом с *می‌*, чтобы дать обещание или выразить твёрдое решение: *حتماً می‌آیم* — «я обязательно приду».'
    example_gloss: Завтра я обязательно приду.
  prs.a2.unit28.lesson03.teach.promise_word:
    title: Обещание
    gloss: обещание, слово
    note: '*قول* — это обещание. *قول می‌دهم* значит «обещаю», буквально «даю обещание». Можно добавить *که* и придаточную часть: *قول می‌دهم که می‌آیم*.'
    example_gloss: Обещаю, что приду.
  prs.a2.unit28.lesson03.teach.give_promise:
    title: Обещаю
    gloss: Обещаю.
    note: '*می‌دهم* — «я даю». Ты уже знаешь *می‌دهین* («вы даёте»); это форма для *من*. Говори *قول می‌دهم*, когда хочешь, чтобы собеседник тебе поверил.'
  prs.a2.unit28.lesson03.teach.forget:
    title: Забыть
    gloss: забытый; забывать, забыть
    note: '*فراموش کردن* — «забыть». Обещание часто заканчивается словами *فراموش نمی‌کنم* («не забуду»).'
    example_gloss: Я не забуду свой ключ.
  prs.a2.unit28.lesson03.teach.later:
    title: Позже
    gloss: позже, потом
    note: '*بعداً* — «позже». Это слово времени для обещания, которое ты выполнишь скоро, но не сейчас.'
    example_gloss: Я позвоню позже.
  prs.a2.unit28.lesson03.teach.promise_form:
    title: 'Обещание: حتماً и простое настоящее время'
    gloss: Я обязательно приду. Я обязательно позвоню. Я обязательно помогу. Я обязательно отправлю.
    note: 'Обещание состоит из двух частей: *حتماً* и обычного глагола с *می‌* в форме для *من*. Особой формы нет. Слово времени можно добавить или опустить: *حتماً امشب تیلفون می‌کنم* — «я обязательно позвоню сегодня вечером». Если обещаешь кому-то, можно сначала сказать *قول می‌دهم*.'
  prs.a2.unit28.lesson03.teach.you_come_q:
    title: Вы придёте?
    gloss: Ты придёшь? Придёшь?
    note: '*می‌آیی* — «ты приходишь/придёшь» (другу). Настоящее время с *می‌* спрашивает о будущем так же, как и сообщает о нём: *تو می‌آیی؟* — «ты придёшь?». Ответ часто бывает обещанием: *حتماً می‌آیم*.'
  prs.a2.unit28.lesson03.teach.negative_promise:
    title: Обещание не делать чего-то
    gloss: Я больше не буду опаздывать. Я никогда не забуду.
    note: 'Чтобы пообещать, что ты чего-то не сделаешь, используй *نمی‌* по той же схеме: *دیگر دیر نمی‌آیم* — «я больше не приду поздно», а *هرگز فراموش نمی‌کنم* — «я никогда не забуду». *دیگر* с отрицательным глаголом значит «больше не».'
  prs.a2.unit28.lesson03.teach.sentence:
    title: Я обязательно позвоню сегодня вечером
    gloss: Я обязательно позвоню сегодня вечером.
    note: 'Обещание со словом времени: *حتماً*, *امشب* и *تیلفون می‌کنم*.'
  prs.a2.unit28.lesson04.teach.important:
    title: Важный
    gloss: важный
    note: '*مهم* — «важный». *جلسه مهم* — важная встреча, на которую обещают прийти.'
    example_gloss: Сегодня важное собрание.
  prs.a2.unit28.lesson04.teach.ladder:
    title: От уверенности к неуверенности
    gloss: Он обязательно придёт. Он, вероятно, придёт. Может быть, он придёт. Возможно, он не придёт.
    note: 'Выбирай слово в зависимости от того, насколько ты уверен. *حتماً* и обычный глагол с *می‌* — уверенность. *احتمالاً* и обычное настоящее время — «вероятно». *شاید* и сослагательная форма — «может быть». *ممکن است* и сослагательная форма — «возможно»; она может быть и отрицательной: *ممکن است نیاید* («возможно, он не придёт»).'
  prs.a2.unit28.lesson04.teach.maybe_but:
    title: Может, опоздаю, но обещаю
    gloss: Может быть, я опоздаю, но обязательно приду.
    note: '«Может быть» и обещание можно соединить словом *ولی* («но»): *شاید دیر برسم، ولی حتماً می‌آیم*. Первая часть говорит о том, в чём ты не можешь быть уверен, вторая — о том, что ты обещаешь. Используй *شاید* для того, что от тебя не зависит, а *حتماً* — для того, что зависит.'
  prs.a2.unit28.lesson04.teach.meeting_tomorrow:
    title: Встреча завтра
    gloss: Завтра встреча. Ты придёшь?
    note: Вопрос о завтрашнем дне задаётся в настоящем времени со словом времени. Лучший ответ — обещание с *حتماً*.
  prs.a2.unit28.lesson05.teach.future_written:
    title: 'Письменное будущее время: только для понимания'
    gloss: Погода будет холодной. Пойдёт снег. Автобус отправится. Автобус не пойдёт.
    note: 'В новостях, прогнозах и объявлениях ты встретишь письменное будущее время: *خواهد* и краткий инфинитив, например *سرد خواهد بود* («будет холодно»), *خواهد بارید* («пойдёт дождь или снег»), *حرکت خواهد کرد* («отправится»). Отрицание — *نخواهد*: *نخواهد رفت* («не пойдёт»). Эту форму нужно только понимать при чтении. Когда говоришь или пишешь другу, используй форму, которую ты выучил: *فردا برف می‌بارد* и *حتماً می‌روم*.'
  prs.a2.unit28.lesson05.teach.forecast_reading:
    title: Прогноз погоды
    gloss: 'Прогноз погоды: в пятницу в Бамиане будет холодно. Возможно, пойдёт снег. На следующей неделе погода станет солнечной.'
    note: Короткий прогноз по радио. В первом предложении письменное будущее *خواهد بود*. Во втором — *شاید* и сослагательная форма, потому что снег не гарантирован. В третьем — обычное *می‌شود* со словом времени. Вместе они показывают, как в прогнозе говорят о том, что точно, что неточно и что будет на следующей неделе.
  prs.a2.unit28.lesson05.teach.notice_reading:
    title: Объявление для пассажиров
    gloss: 'Объявление для пассажиров, едущих в Бамиан: на следующей неделе, в пятницу в восемь часов, автобус отправится со станции. Пожалуйста, будьте на станции в семь. Автобус не отправится позже.'
    note: 'Объявление на автобусной станции. Для плана используются письменное будущее *حرکت خواهد کرد* и отрицание *حرکت نخواهد کرد*, а для вежливой просьбы — *لطفاً* и сослагательная форма *باشین* («будьте»). Время — *ساعت هشت*: автобус отправляется в восемь, а пассажиры должны прийти на час раньше.'
  prs.a2.unit28.lesson05.teach.d1_t1:
    title: Басира спрашивает о прогнозе
    gloss: Надер, ты видел прогноз погоды на пятницу?
    note: 'Басира спрашивает о прогнозе в простом прошедшем времени: *دیدی*. *هوای جمعه* — «погода в пятницу».'
  prs.a2.unit28.lesson05.teach.d1_t2:
    title: Надер сообщает прогноз
    gloss: Да. В пятницу похолодает, и, может быть, пойдёт снег.
    note: 'Надер использует обе формы в одном предложении: обычное *می‌شود* для холода, в котором он уверен, и *شاید* с *ببارد* для снега, в котором не уверен.'
  prs.a2.unit28.lesson05.teach.d1_t3:
    title: Басира решает, что, возможно, лучше не ехать
    gloss: Тогда, может быть, мы не поедем в Бамиан в пятницу.
    note: '*شاید* с отрицательной сослагательной формой *نرویم* значит «может быть, мы не поедем».'
  prs.a2.unit28.lesson05.teach.d1_t4:
    title: Надер предлагает следующую неделю
    gloss: Да. Поедем на следующей неделе. Погода будет солнечной.
    note: Надер переносит поездку на *هفتهٔ آینده*, используя обычное *می‌رویم* и слово времени.
  prs.a2.unit28.lesson05.teach.d1_t5:
    title: Басира соглашается
    gloss: Хорошо. На следующей неделе мы обязательно поедем.
    note: 'Басира отвечает с *حتماً*: она уверена в следующей неделе.'
  prs.a2.unit28.lesson05.teach.d1_t6:
    title: Надер обещает
    gloss: Обещаю.
    note: Надер заканчивает словами *قول می‌دهم* — это обещание.
  prs.a2.unit28.lesson06.teach.d2_t1:
    title: Басира спрашивает Надера
    gloss: Надер, завтра важная встреча. Ты придёшь?
    note: Басира использует настоящее время со словом *فردا*, чтобы спросить о завтрашнем дне. Встреча *مهم* («важная»), поэтому ей нужен твёрдый ответ.
  prs.a2.unit28.lesson06.teach.d2_t2:
    title: Надер обещает, но с сомнением
    gloss: Я обязательно приду. Но, может быть, опоздаю, потому что много машин на дорогах.
    note: 'Надер обещает: *حتماً می‌آیم*, а затем говорит о том, в чём не уверен: *شاید دیر برسم*. *چون* вводит причину.'
  prs.a2.unit28.lesson06.teach.d2_t3:
    title: Басира просит позвонить
    gloss: Ничего страшного. Ты позвонишь сегодня вечером?
    note: 'Басира принимает возможное опоздание словами *مشکلی نیست* и просит ещё одно обещание: позвонить вечером.'
  prs.a2.unit28.lesson06.teach.d2_t4:
    title: Надер обещает позвонить
    gloss: Обещаю. Я обязательно позвоню сегодня вечером. Не забуду.
    note: 'Три обещания подряд: *قول می‌دهم*, *حتماً امشب تیلفون می‌کنم* и *فراموش نمی‌کنم*.'
