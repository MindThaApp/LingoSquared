course:
  title: Дари A2
  description: 'Дари Афганистана для среднего уровня: как сказать, что нужно, нельзя или не обязательно делать, и как спросить, можно ли что-то. Правила библиотеки, бассейна и спортзала со словами باید، نباید، لازم نیست، اجازه دارم и می‌توانم.'
units:
  prs.a2.unit29.rules_permission:
    title: Правила и разрешение
lessons:
  prs.a2.unit29.lesson01.must_and_places:
    title: Должен, и места в центре
  prs.a2.unit29.lesson02.must_not:
    title: 'Нельзя: правила в библиотеке'
  prs.a2.unit29.lesson03.ask_permission:
    title: 'Спрашиваем: можно ли? могу ли я?'
  prs.a2.unit29.lesson04.no_need:
    title: 'Не нужно: ты не обязан'
  prs.a2.unit29.lesson05.reading_and_listening:
    title: Читаем и слушаем о правилах
  prs.a2.unit29.lesson06.gym_conversation:
    title: Разговор в спортзале и бассейне
teaching:
  prs.a2.unit29.lesson01.teach.library:
    title: Библиотека
    gloss: библиотека
    note: '*کتابخانه* — это библиотека. Куда идёшь, говорится с *به*: *به کتابخانه می‌روم* — «я иду в библиотеку». Этот урок посвящён правилам общественного центра, в котором есть библиотека, бассейн и спортзал.'
    example_gloss: Библиотека рядом с моим домом.
  prs.a2.unit29.lesson01.teach.pool:
    title: Бассейн
    gloss: бассейн
    note: '*حوض آب‌بازی* — это бассейн. Это слово из урока про бассейн.'
    example_gloss: Я хожу в бассейн каждую неделю.
  prs.a2.unit29.lesson01.teach.gym:
    title: Спортзал
    gloss: спортзал, спортивный клуб
    note: '*باشگاه* — это спортзал или спортивный клуб. Это слово из урока про спортзал.'
    example_gloss: Спортзал открыт в шесть часов.
  prs.a2.unit29.lesson01.teach.rules:
    title: Правила
    gloss: 'правила (ед. ч.: правило, закон)'
    note: '*قانون* — это правило, а *قانون‌ها* — правила. Место добавляется после него с помощью *-ی*: *قانون‌های کتابخانه* — «правила библиотеки». Окончание множественного числа пишется отдельной небольшой частью после существительного, через полупробел.'
    example_gloss: Правила спортзала лежат в офисе.
  prs.a2.unit29.lesson01.teach.membership:
    title: Членская карта
    gloss: членская карта
    note: '*کارت عضویت* — это членская карта, по которой можно брать книги или заниматься в спортзале. Слово *کارت* ты уже знаешь.'
    example_gloss: Моя членская карта дома.
  prs.a2.unit29.lesson01.teach.sports_shoes:
    title: Спортивная обувь
    gloss: спортивная обувь, кроссовки
    note: '*کفش* — это обувь, а *ورزشی* значит «спортивный», от слова *ورزش*. Значит, *کفش ورزشی* — спортивная обувь.'
    example_gloss: Моя спортивная обувь новая.
  prs.a2.unit29.lesson01.teach.must:
    title: 'Должен: باید и сослагательная форма'
    gloss: я должен идти, ты должен идти (другу), он/она должен идти, мы должны идти, вы должны идти (вежливо или мн. ч.), они должны идти
    note: '*باید* значит «должен, нужно». Оно не изменяется. Лицо видно по глаголу после него, который стоит в сослагательной форме: *بروم، بروی، برود، برویم، بروین، بروند*. Окончания те же, что в настоящем времени, *-م، -ی، -د، -یم، -ین، -ند*, но глагол начинается с *ب-* вместо *می‌*. Эту форму ты уже встречал после *می‌خواهم* (*می‌خواهم یک تکت بگیرم*). Порядок слов: сначала *باید*, глагол в конце: *من باید به کتابخانه بروم*. Местоимение *من* можно опустить, потому что окончание уже показывает, кто действует.'
  prs.a2.unit29.lesson01.teach.formation:
    title: Как образуется сослагательная форма
    gloss: 'я иду: чтобы я пошёл. Я иду (сюда): чтобы я пришёл. Я делаю: чтобы я сделал. Я беру (получаю): чтобы я взял. Я даю: чтобы я дал. Я несу: чтобы я понёс.'
    note: 'Возьми настоящее время, отбрось *می‌* и поставь впереди *ب-*: *می‌روم* превращается в *بروم*, *می‌گیرم* — в *بگیرم*, *می‌دهم* — в *بدهم*, *می‌برم* — в *ببرم*. Два глагола отличаются. От *آمدن* получается *بیایم* (не *بآیم*), а от *کردن* — *کنم* без *ب-* (можно услышать и *بکنم*, это тоже правильно). В глаголах из двух слов меняется только глагольная часть: *پس بدهم*, *کار کنم*, *دوش بگیرم*. Остальные лица имеют те же окончания: *بگیری، بگیرد، بگیریم، بگیرین، بگیرند*.'
  prs.a2.unit29.lesson01.teach.wear:
    title: Носить, надевать
    gloss: носить, надевать
    note: '*پوشیدن* — носить или надевать одежду и обувь. Сослагательная форма: *بپوشم، بپوشی، بپوشد، بپوشیم، بپوشین، بپوشند*, поэтому *باید کفش بپوشم* — «я должен надеть обувь».'
    example_gloss: В спортзале я должен надевать новую обувь.
  prs.a2.unit29.lesson01.teach.more_verbs:
    title: Должен с другими глаголами
    gloss: Я должен получить карту. Ты должен принять душ. Мы должны вернуть книгу. Вы должны надеть спортивную обувь. Они должны прийти в спортзал.
    note: 'Та же схема работает с любым глаголом: *باید* и затем сослагательная форма с нужным окончанием. *دوش گرفتن* — «принимать душ», а *پس دادن* — «возвращать», поэтому *باید کتاب را پس بدهیم* — «мы должны вернуть книгу». То, что отдаёшь или берёшь, стоит перед глаголом, с *را*, если предмет определённый: *کتاب را*.'
  prs.a2.unit29.lesson01.teach.sentence:
    title: Я должен пойти в библиотеку
    gloss: Я должен пойти в библиотеку.
    note: Это образец для всего урока. *باید* показывает, что это правило или обязанность, а *بروم* указывает лицо. Все в центре соблюдают одни и те же правила.
  prs.a2.unit29.lesson02.teach.quiet:
    title: Молчаливый
    gloss: тихий, молчаливый
    note: '*ساکت* значит «тихий, молчаливый». *ساکت باشین* — «пожалуйста, ведите себя тихо» (нескольким людям или тому, кого уважаешь).'
    example_gloss: В библиотеке тихо.
  prs.a2.unit29.lesson02.teach.be_paradigm:
    title: 'Должен быть: باشم'
    gloss: я должен быть тихим, ты должен быть тихим, он/она должен быть тихим, мы должны быть тихими, вы должны быть тихими (вежливо или мн. ч.), они должны быть тихими
    note: 'Сослагательная форма глагола *بودن* («быть») — *باشم، باشی، باشد، باشیم، باشین، باشند*. После *باید* она показывает, что кто-то должен находиться в каком-то состоянии: *باید ساکت باشین* — «вы должны вести себя тихо». Формы *باشد* и *باشین* ты уже встречал; *باشم، باشی، باشیم* дополняют ряд.'
  prs.a2.unit29.lesson02.teach.food:
    title: Еда
    gloss: еда, пища
    note: '*غذا* — еда или блюдо. *غذا خوردن* — «есть, принимать пищу», а *غذا بخورم* — сослагательная форма этого глагола.'
    example_gloss: Мы едим дома.
  prs.a2.unit29.lesson02.teach.cigarette:
    title: Сигарета
    gloss: сигарета
    note: '*سگرت* — сигарета. *سگرت کشیدن* — «курить», с глаголом *کشیدن*.'
    example_gloss: Он курит сигареты каждый день.
  prs.a2.unit29.lesson02.teach.forbidden:
    title: Запрещено
    gloss: запрещённый, нельзя
    note: '*ممنوع* значит «запрещено» и встречается на табличках: *غذا خوردن ممنوع است* — «есть нельзя». Сначала идёт действие в инфинитиве (*کشیدن، خوردن، گرفتن*), затем *ممنوع است*.'
    example_gloss: Курить в спортзале запрещено.
  prs.a2.unit29.lesson02.teach.loud:
    title: Громкий, громко
    gloss: 'громкий, громко (также: высокий)'
    note: '*بلند* значит «громко», когда говорится, как человек говорит: *بلند صحبت کردن* — «говорить громко». Глагол *صحبت کردن* ты уже знаешь.'
    example_gloss: Он говорит громко.
  prs.a2.unit29.lesson02.teach.must_not:
    title: 'Нельзя: نباید и сослагательная форма'
    gloss: мне нельзя есть, тебе нельзя есть, ему/ей нельзя есть, нам нельзя есть, вам нельзя есть (вежливо или мн. ч.), им нельзя есть
    note: '*نباید* — отрицание от *باید*, оно значит «нельзя, не должен». Частица *ن* ставится к *باید*, а глагол после него остаётся утвердительным: *نباید غذا بخورین* — «вам нельзя есть». Глагол имеет те же окончания сослагательной формы, что и после *باید*. *نباید* используется для правила или строгого совета, поэтому так говорят сотрудники библиотеки или бассейна.'
  prs.a2.unit29.lesson02.teach.forbidden_same:
    title: Два способа сказать, что нельзя
    gloss: Есть запрещено. Вам нельзя есть.
    note: '*ممنوع است* и *نباید* говорят одно и то же. Табличка использует инфинитив: *غذا خوردن ممنوع است*. Человек, обращаясь к тебе, говорит *نباید* с сослагательной формой: *نباید غذا بخورین*.'
  prs.a2.unit29.lesson02.teach.no_eat_library:
    title: В библиотеке нельзя есть
    gloss: В библиотеке нельзя есть.
    note: Сначала идёт место, затем *نباید*, затем предмет, а глагол стоит в конце.
  prs.a2.unit29.lesson02.teach.quiet_library:
    title: В библиотеке нужно соблюдать тишину
    gloss: В библиотеке нужно соблюдать тишину.
    note: '*باید ساکت باشین* — правило, которое говорит, что нужно делать, а *نباید* говорит, чего делать нельзя.'
  prs.a2.unit29.lesson02.teach.phone_forms:
    title: Нельзя с другими лицами
    gloss: Мне нельзя разговаривать по телефону. Тебе нельзя разговаривать по телефону (другу). Вам нельзя разговаривать по телефону (вежливо или мн. ч.).
    note: 'В глаголе из двух слов, например *صحبت کردن*, меняется только глагольная часть: *صحبت کنم، صحبت کنی، صحبت کنین*. Другу говоришь *نباید ... کنی*, нескольким людям или тому, кого уважаешь, — *نباید ... کنین*.'
  prs.a2.unit29.lesson02.teach.no_phone_gym:
    title: В спортзале нельзя разговаривать по телефону
    gloss: В спортзале нельзя разговаривать по телефону.
    note: '*با تیلفون صحبت کردن* — «разговаривать по телефону». *صحبت کنین* — сослагательная форма глагола *صحبت کردن* для *شما*.'
  prs.a2.unit29.lesson03.teach.here:
    title: Здесь
    gloss: здесь
    note: '*اینجا* значит «здесь». Слово *آنجا* («там») ты уже знаешь: *اینجا* — это то, что близко.'
    example_gloss: Библиотека здесь.
  prs.a2.unit29.lesson03.teach.permission:
    title: Разрешение
    gloss: разрешение
    note: '*اجازه* — разрешение. *اجازه دارم* — «мне разрешено» (у меня есть разрешение), а *اجازه ندارم* — «мне не разрешено». О другом человеке говорят *اجازه دارین* («вам разрешено») или *اجازه ندارین* («вам не разрешено»).'
    example_gloss: Вам здесь можно.
  prs.a2.unit29.lesson03.teach.photo:
    title: Фото
    gloss: фото, снимок
    note: '*عکس* — это фотография. *عکس گرفتن* — сфотографировать, с глаголом *گرفتن*.'
    example_gloss: Мои фотографии в моём телефоне.
  prs.a2.unit29.lesson03.teach.ask_allowed:
    title: Можно мне? اجازه دارم и сослагательное наклонение
    gloss: Можно мне здесь сфотографировать? Можно мне взять книгу домой? Можно мне воспользоваться телефоном?
    note: 'Чтобы спросить разрешения, скажи *اجازه دارم*, а затем глагол в сослагательной форме: *اجازه دارم اینجا عکس بگیرم؟* — «Можно мне здесь сфотографировать?» Для вежливости начни со слова *ببخشین* («извините»). Лицо выражено глаголом после *اجازه دارم*, поэтому для другого лица меняются обе части: *اجازه دارین عکس بگیرین* — «вам можно фотографировать».'
  prs.a2.unit29.lesson03.teach.can_paradigm:
    title: 'Мочь: می‌توانم'
    gloss: я могу, ты можешь (другу), он/она может, мы можем, вы можете (вежливо или мн. число), они могут
    note: '*می‌توانم* — «я могу». Между *می* и *توانم* пишется небольшой промежуток. Формы: *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. Дальше идёт сослагательная форма: *می‌توانم اینجا عکس بگیرم؟* — «Можно мне здесь сфотографировать?» Вопрос *می‌توانم ...؟* — ещё один способ попросить разрешения, он так же частотен, как *اجازه دارم ...؟*.'
  prs.a2.unit29.lesson03.teach.answers:
    title: Ответ «да» или «нет»
    gloss: Да, вам можно. Да, вы можете. Нет, вам нельзя. Нет, вы не можете. Нет, это запрещено.
    note: 'Отвечай тем же глаголом, что в вопросе: на *اجازه دارم؟* отвечают *اجازه دارین / اجازه ندارین*, а на *می‌توانم؟* — *می‌توانین / نمی‌توانین*. Если правило запрещает, можно сказать и *ممنوع است*. Можно добавить *بلی، البته* («да, конечно»).'
  prs.a2.unit29.lesson03.teach.polite_ask:
    title: Извините, можно мне взять эту книгу домой?
    gloss: Извините, можно мне взять эту книгу домой?
    note: '*ببخشین* вежливо начинает вопрос. *به خانه ببرم* — «отнести домой».'
  prs.a2.unit29.lesson03.teach.answer_yes:
    title: Да, можно
    gloss: Да, вам можно.
    note: Короткое вежливое «да» в ответ на вопрос с *اجازه دارم*.
  prs.a2.unit29.lesson03.teach.answer_no_photo:
    title: Нет, здесь фотографировать запрещено
    gloss: Нет, здесь фотографировать нельзя.
    note: 'Отказ с объяснением причины через *ممنوع*: *عکس گرفتن ممنوع است*.'
  prs.a2.unit29.lesson04.teach.no_need:
    title: 'Не нужно: لازم نیست и сослагательное наклонение'
    gloss: Нам не нужно приходить. Вам не нужно платить.
    note: '*لازم نیست* значит «не нужно», то есть «не обязательно». За ним следует сослагательная форма, как и после *باید*: *لازم نیست پول بدهین* — «вам не нужно платить». *لازم نیست* ничего не запрещает, оно лишь говорит, что это на ваше усмотрение.'
  prs.a2.unit29.lesson04.teach.no_need_formal:
    title: 'Более официально: ضرورت ندارد'
    gloss: Приносить карту не нужно.
    note: '*ضرورت ندارد* значит то же, что *لازم نیست*, но звучит немного официальнее и встречается на объявлениях: *ضرورت ندارد کارت بیاورین* — «приносить карту не нужно». Глагол после него снова в сослагательной форме. В повседневной речи обычно говорят *لازم نیست*.'
  prs.a2.unit29.lesson04.teach.three_meanings:
    title: Три разных значения
    gloss: Я должен прийти. Мне нельзя приходить. Мне не обязательно приходить.
    note: '*باید بیایم* — обязанность, *نباید بیایم* — запрет, а *لازم نیست بیایم* — свобода: я могу прийти, но не обязан. Не путай *نباید* и *لازم نیست*: *نباید* запрещает, *لازم نیست* — нет.'
  prs.a2.unit29.lesson04.teach.towel:
    title: Полотенце
    gloss: полотенце
    note: '*حوله* — «полотенце». *حوله‌ام* — «моё полотенце».'
    example_gloss: Моё полотенце в спортзале.
  prs.a2.unit29.lesson04.teach.everyone:
    title: Все
    gloss: все
    note: '*همه* значит «все». Слово полезно для правил, которые касаются каждого: *همه باید ساکت باشند* — «все должны молчать».'
    example_gloss: В библиотеке все молчат.
  prs.a2.unit29.lesson04.teach.bring:
    title: Приносить
    gloss: приносить
    note: '*آوردن* — «приносить». Сослагательная форма: *بیاورم، بیاوری، بیاورد، بیاوریم، بیاورین، بیاورند*. Ты уже знаешь *بیاورم*: *لازم نیست حوله بیاوری* — «тебе не нужно приносить полотенце».'
    example_gloss: Завтра ты должен принести мои книги.
  prs.a2.unit29.lesson04.teach.towel_phrase:
    title: В спортзале не нужно приносить полотенце
    gloss: В спортзале не нужно приносить полотенце.
    note: 'В спортзале есть свои полотенца, поэтому приносить своё не обязательно. Это хороший пример *لازم نیست*: не запрещено, просто не нужно.'
  prs.a2.unit29.lesson04.teach.pay_phrase:
    title: Вам не нужно платить
    gloss: Вам не нужно платить.
    note: Членство в библиотеке бесплатное, поэтому платить не нужно. *پول بدهین* — сослагательная форма от *پول دادن*.
  prs.a2.unit29.lesson05.teach.centre:
    title: Центр
    gloss: центр
    note: '*مرکز اجتماعی* — общественный центр, здание с библиотекой, бассейном и спортзалом. Слово *اجتماعی* ты знаешь по прежним урокам.'
    example_gloss: Общественный центр находится рядом с моим домом.
  prs.a2.unit29.lesson05.teach.rubbish:
    title: Мусор, мусорное ведро
    gloss: 'мусор (а также: мусорное ведро)'
    note: '*زباله* — «мусор», *سطل* — «ведро, урна». Оба слова из урока об отходах. Глагол — *انداختن*, «бросать»: *زباله را در سطل بیندازین* — «бросьте мусор в урну».'
    example_gloss: Мусор в урне.
  prs.a2.unit29.lesson05.teach.run:
    title: Бегать
    gloss: бегать
    note: '*دویدن* — «бегать». Сослагательная форма: *بدوم، بدوی، بدود، بدویم، بدوین، بدوند*, поэтому *نباید بدوین* — «вам нельзя бегать».'
    example_gloss: В бассейне нельзя бегать.
  prs.a2.unit29.lesson05.teach.throw:
    title: Бросать, класть
    gloss: бросать, выбросить
    note: '*انداختن* — «бросать». Сослагательная форма: *بیندازم، بیندازی، بیندازد، بیندازیم، بیندازین، بیندازند*, поэтому *باید زباله را در سطل بیندازین* — «вы должны бросать мусор в урну».'
    example_gloss: Бросьте мусор в урну.
  prs.a2.unit29.lesson05.teach.library_turn01:
    title: Шакила просит взять книгу домой
    gloss: Извините, можно мне взять эту книгу домой?
    note: Шакила впервые в библиотеке и спрашивает с помощью *اجازه دارم* и сослагательной формы *ببرم*. Для вежливости она говорит *ببخشین*.
  prs.a2.unit29.lesson05.teach.library_turn02:
    title: Насир говорит, что сначала нужна карта
    gloss: Да, но сначала вам нужно получить читательский билет.
    note: 'Насир — библиотекарь, поэтому он обращается на *شما* в форме на *-ین*: *بگیرین*. *اول باید* значит «сначала ты должен».'
  prs.a2.unit29.lesson05.teach.library_turn03:
    title: Шакила спрашивает об оплате
    gloss: Мне нужно платить?
    note: '*باید پول بدهم؟* — вопрос с *باید*: «мне нужно платить?»'
  prs.a2.unit29.lesson05.teach.library_turn04:
    title: 'Насир: платить не нужно, но книгу надо вернуть'
    gloss: Нет, платить не нужно. Книгу нужно вернуть в течение двух недель.
    note: '*لازم نیست* говорит, что платить не нужно. *باید کتاب را تا دو هفته پس بدهین* — обязанность: книгу надо вернуть в течение двух недель.'
  prs.a2.unit29.lesson05.teach.library_turn05:
    title: Шакила спрашивает про еду
    gloss: Здесь можно есть?
    note: '*می‌توانم ...؟* спрашивает, можно ли. Сослагательная форма — *بخورم*.'
  prs.a2.unit29.lesson05.teach.library_turn06:
    title: 'Насир: есть нельзя, нужно молчать'
    gloss: Нет, есть нельзя. Также нужно соблюдать тишину.
    note: '*نباید غذا بخورین* — запрет, а *باید ساکت هم باشین* — обязанность. *هم* значит «тоже, также».'
  prs.a2.unit29.lesson05.teach.notice:
    title: Объявление о правилах центра
    gloss: 'Объявление. Правила общественного центра. Библиотека: в библиотеке нельзя есть и нужно соблюдать тишину. Бассейн: перед входом в бассейн нужно принять душ. В бассейне нельзя бегать. Спортзал: в спортзале нужно быть в спортивной обуви. Приносить полотенце не нужно. Мусор нужно бросать в урну.'
    note: 'В настоящем объявлении встречаются все три вида правил: *باید* — что нужно делать, *نباید* — чего нельзя делать, *لازم نیست* — что не обязательно. Объявление обращено ко всем, поэтому в нём форма на *-ین*.'
  prs.a2.unit29.lesson06.teach.first_time:
    title: Первый раз
    gloss: первый раз
    note: '*اولین بار* — «первый раз». *اولین* значит «первый», а *بار* — «раз», как в *هر بار* («каждый раз»).'
    example_gloss: Я иду в эту библиотеку в первый раз.
  prs.a2.unit29.lesson06.teach.what_must_i:
    title: Что мне нужно делать?
    gloss: Что мне нужно делать?
    note: 'Полезный вопрос: *چه* («что»), *باید* и сослагательная форма *بکنم*. Здесь подходят и *بکنم*, и *کنم*.'
  prs.a2.unit29.lesson06.teach.gym_turn01:
    title: Назила спрашивает, что ей нужно делать
    gloss: Фахим, завтра я иду в спортзал в первый раз. Что мне нужно делать?
    note: Назила говорит подруге и другу «ты» (*تو*). *فردا ... می‌روم* — обычное настоящее время для обозначения завтрашнего дня.
  prs.a2.unit29.lesson06.teach.gym_turn02:
    title: Фахим называет обязанность и то, что не нужно
    gloss: Нужно надеть спортивную обувь. Полотенце приносить не нужно, в спортзале есть полотенца.
    note: 'Фахим говорит с другом, поэтому глаголы оканчиваются на *-ی*: *بپوشی، بیاوری*. *باید* — обязанность, *لازم نیست* — не нужно.'
  prs.a2.unit29.lesson06.teach.gym_turn03:
    title: Назила спрашивает про бассейн
    gloss: После спортзала можно мне пойти в бассейн?
    note: '*می‌توانم ... بروم؟* спрашивает, можно ли ей пойти.'
  prs.a2.unit29.lesson06.teach.gym_turn04:
    title: Фахим говорит «да» и называет два правила
    gloss: Да, но сначала нужно принять душ. И в бассейне нельзя бегать.
    note: '*اول باید دوش بگیری* — обязанность, а *نباید بدوی* — запрет. В обоих случаях окончание *-ی* для друга.'
  prs.a2.unit29.lesson06.teach.gym_turn05:
    title: Назила благодарит его
    gloss: Хорошо! Спасибо.
    note: Короткое дружеское завершение. *تشکر* — «спасибо».
exercises:
  prs.a2.unit29.lesson01.exercise01.recognize_must_go:
    instruction: Что означает это предложение?
    correct_option: я должен пойти
    distractors:
    - Я хочу пойти
    - Я ходил вчера
    - Я не хочу идти
    accepted_answers:
    - value: я должен пойти
      status: correct
    feedback: '*من باید بروم* — «мне нужно идти»: *باید* и сослагательная форма *بروم*.'
  prs.a2.unit29.lesson01.exercise02.recognize_get_card:
    instruction: Что означает это предложение?
    correct_option: Вам нужно получить читательский билет
    distractors:
    - У вас есть читательский билет
    - Вам нужно вернуть карту
    - Мне нужно получить карту
    accepted_answers:
    - value: Вам нужно получить читательский билет
      status: correct
    feedback: '*بگیرین* — сослагательная форма для *شما*, поэтому *شما باید کارت عضویت بگیرین* — «вам нужно получить читательский билет».'
  prs.a2.unit29.lesson01.exercise03.match_places_and_must:
    instruction: Соедини каждое слово или выражение на дари с его значением.
    accepted_answers:
    - value:
        کتابخانه: библиотека
        حوض آب‌بازی: бассейн
        باشگاه: спортзал
        قانون: правило
        کارت عضویت: членская карта
        کفش ورزشی: спортивная обувь
        باید بروم: я должен пойти
        باید بروی: ты должен пойти (другу)
        باید برود: он или она должен пойти
        باید برویم: мы должны пойти
        باید بروین: вы должны пойти (вежливо или во множественном числе)
        باید بروند: они должны идти
      status: correct
    feedback: 'С лицом меняется только окончание глагола: *بروم* — я, *بروی* — ты (друг), *برود* — он или она, *برویم* — мы, *بروین* — вы (вежливо или мн. число), *بروند* — они.'
    pairs:
    - left: کتابخانه
      right: библиотека
    - left: حوض آب‌بازی
      right: бассейн
    - left: باشگاه
      right: спортзал
    - left: قانون
      right: правило
    - left: کارت عضویت
      right: членская карта
    - left: کفش ورزشی
      right: спортивная обувь
    - left: باید بروم
      right: я должен пойти
    - left: باید بروی
      right: ты должен пойти (другу)
    - left: باید برود
      right: он или она должен пойти
    - left: باید برویم
      right: мы должны пойти
    - left: باید بروین
      right: вы должны пойти (вежливо или во множественном числе)
    - left: باید بروند
      right: они должны идти
  prs.a2.unit29.lesson01.exercise04.order_go_library:
    instruction: 'Расставь слова, чтобы сказать: «Мне нужно пойти в библиотеку».'
    accepted_answers:
    - value:
      - من
      - باید
      - به
      - کتابخانه
      - بروم
      status: correct
    - value:
      - من
      - به
      - کتابخانه
      - باید
      - بروم
      status: correct
    feedback: '*من باید به کتابخانه بروم.* Глагол *بروم* стоит в конце. *به کتابخانه* может стоять и перед *باید*.'
  prs.a2.unit29.lesson01.exercise05.complete_go_gym:
    instruction: 'Заполни пропуск: Мы должны пойти в спортзал.'
    accepted_answers:
    - value: برویم
      status: correct
    feedback: '*برویم* — сослагательная форма глагола *رفتن* для *ما*. *ما باید به باشگاه برویم* значит «мы должны пойти в спортзал».'
  prs.a2.unit29.lesson01.exercise06.translate_get_card:
    instruction: 'Переведи на дари, используя باید: Я должен получить членский билет.'
    accepted_answers:
    - value: من باید کارت عضویت بگیرم.
      status: correct
    - value: باید کارت عضویت بگیرم.
      status: correct
    - value: من باید یک کارت عضویت بگیرم.
      status: correct
    - value: باید یک کارت عضویت بگیرم.
      status: correct
    - value: من کارت عضویت باید بگیرم.
      status: correct
    - value: کارت عضویت باید بگیرم.
      status: correct
    feedback: '*من باید کارت عضویت بگیرم.* — «Я должен получить членский билет». *من* можно опустить, а *یک* перед *کارت* тоже допустимо.'
  prs.a2.unit29.lesson02.exercise01.recognize_no_eat:
    instruction: Что означает это предложение?
    correct_option: В библиотеке нельзя есть
    distractors:
    - В библиотеке нужно есть
    - В библиотеке можно есть
    - Еда находится в библиотеке
    accepted_answers:
    - value: В библиотеке нельзя есть
      status: correct
    feedback: '*نباید غذا بخورین* — «вы не должны есть»: *نباید* плюс сослагательная форма *بخورین*.'
  prs.a2.unit29.lesson02.exercise02.recognize_no_smoking:
    instruction: Что означает этот знак?
    correct_option: Курить запрещено
    distractors:
    - Здесь курить разрешено
    - Здесь нужно курить
    - Сигарета новая
    accepted_answers:
    - value: Курить запрещено
      status: correct
    feedback: '*ممنوع است* значит «запрещено», поэтому *سگرت کشیدن ممنوع است* — «курить запрещено».'
  prs.a2.unit29.lesson02.exercise03.match_not_rules:
    instruction: Соедини каждое слово или выражение на дари с его значением.
    accepted_answers:
    - value:
        ساکت: молчаливый
        غذا: еда
        سگرت: сигарета
        ممنوع: запрещено
        بلند: громкий, громко
        نباید غذا بخورم: мне нельзя есть
        نباید غذا بخوری: тебе нельзя есть (другу)
        باید ساکت باشم: я должен молчать
        باید ساکت باشین: вы должны молчать (вежливо или мн. ч.)
        نباید غذا بخورند: им нельзя есть
      status: correct
    feedback: '*باید* означает «должен», а *نباید* — «не должен, нельзя». Окончание глагола по-прежнему показывает лицо.'
    pairs:
    - left: ساکت
      right: молчаливый
    - left: غذا
      right: еда
    - left: سگرت
      right: сигарета
    - left: ممنوع
      right: запрещено
    - left: بلند
      right: громкий, громко
    - left: نباید غذا بخورم
      right: мне нельзя есть
    - left: نباید غذا بخوری
      right: тебе нельзя есть (другу)
    - left: باید ساکت باشم
      right: я должен молчать
    - left: باید ساکت باشین
      right: вы должны молчать (вежливо или мн. ч.)
    - left: نباید غذا بخورند
      right: им нельзя есть
  prs.a2.unit29.lesson02.exercise04.order_no_loud:
    instruction: 'Расставь слова, чтобы сказать: В библиотеке нельзя громко разговаривать.'
    accepted_answers:
    - value:
      - در
      - کتابخانه
      - نباید
      - بلند
      - صحبت
      - کنین
      status: correct
    - value:
      - نباید
      - در
      - کتابخانه
      - بلند
      - صحبت
      - کنین
      status: correct
    feedback: '*در کتابخانه نباید بلند صحبت کنین.* Место может стоять в начале или после *نباید*. Глагол *کنین* остаётся в конце.'
  prs.a2.unit29.lesson02.exercise05.complete_no_eat:
    instruction: 'Заполни пропуск: В библиотеке нельзя есть.'
    accepted_answers:
    - value: نباید
      status: correct
    feedback: '*نباید* значит «нельзя, не должен». *در کتابخانه نباید غذا بخورین* — «в библиотеке нельзя есть».'
  prs.a2.unit29.lesson02.exercise06.translate_be_quiet:
    instruction: 'Переведи на дари, используя باید: В библиотеке вы должны соблюдать тишину.'
    accepted_answers:
    - value: در کتابخانه باید ساکت باشین.
      status: correct
    - value: باید در کتابخانه ساکت باشین.
      status: correct
    - value: شما در کتابخانه باید ساکت باشین.
      status: correct
    - value: شما باید در کتابخانه ساکت باشین.
      status: correct
    feedback: '*در کتابخانه باید ساکت باشین.* — «В библиотеке вы должны соблюдать тишину». *شما* можно опустить, а *در کتابخانه* можно переставить.'
  prs.a2.unit29.lesson03.exercise01.recognize_may_photo:
    instruction: Что значит этот вопрос?
    correct_option: Можно мне здесь сфотографировать?
    distractors:
    - Я здесь сфотографировал
    - Я должен здесь сфотографировать
    - У вас есть фотография?
    accepted_answers:
    - value: Можно мне здесь сфотографировать?
      status: correct
    feedback: '*اجازه دارم* — просьба о разрешении, а *بگیرم* — сослагательная форма глагола *گرفتن*: «можно мне здесь сфотографировать?»'
  prs.a2.unit29.lesson03.exercise02.recognize_no_cannot:
    instruction: Что означает этот ответ?
    correct_option: Нет, вам нельзя
    distractors:
    - Да, можно
    - Нет, мне нельзя
    - Да, я могу
    accepted_answers:
    - value: Нет, вам нельзя
      status: correct
    feedback: '*نمی‌توانین* значит «вы не можете», здесь — «вам нельзя». Это ответ на *می‌توانم ...؟*.'
  prs.a2.unit29.lesson03.exercise03.match_permission_words:
    instruction: Соедини каждое слово или выражение на дари с его значением.
    accepted_answers:
    - value:
        اجازه دارم: мне разрешено
        اجازه ندارم: мне не разрешено
        اجازه دارین: вам разрешено (вежливо или мн. ч.)
        اجازه ندارین: вам не разрешено (вежливо или мн. ч.)
        می‌توانم: я могу
        می‌توانی: ты можешь (другу)
        می‌توانیم: мы можем
        می‌توانین: вы можете (вежливо или мн. ч.)
        می‌توانند: они могут
        عکس: фото
      status: correct
    feedback: '*اجازه دارم* и *می‌توانم* оба служат для вопроса «можно ли мне». Окончания *-م، -ی، -یم، -ین، -ند* показывают лицо.'
    pairs:
    - left: اجازه دارم
      right: мне разрешено
    - left: اجازه ندارم
      right: мне не разрешено
    - left: اجازه دارین
      right: вам разрешено (вежливо или мн. ч.)
    - left: اجازه ندارین
      right: вам не разрешено (вежливо или мн. ч.)
    - left: می‌توانم
      right: я могу
    - left: می‌توانی
      right: ты можешь (другу)
    - left: می‌توانیم
      right: мы можем
    - left: می‌توانین
      right: вы можете (вежливо или мн. ч.)
    - left: می‌توانند
      right: они могут
    - left: عکس
      right: фото
  prs.a2.unit29.lesson03.exercise04.order_take_book:
    instruction: 'Расставь слова, чтобы сказать: Можно мне взять книгу домой?'
    accepted_answers:
    - value:
      - اجازه
      - دارم
      - کتاب
      - را
      - به
      - خانه
      - ببرم
      status: correct
