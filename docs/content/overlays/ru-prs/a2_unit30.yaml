    instruction: 'Заверши предложение: Я умею водить машину.'
    accepted_answers:
    - value: کنم
      status: correct
    - value: بکنم
      status: acceptable_with_note
      note: Такая форма тоже существует, но с составным глаголом в курсе используется کنم.
    feedback: '*رانندگی کنم* — сослагательная форма от *رانندگی کردن*. Составной глагол принимает *کنم*.'
  prs.a2.unit30.lesson01.exercise06.translate_cook:
    instruction: 'Переведи на дари: Я умею готовить.'
    accepted_answers:
