course:
  title: Дари A2
  description: 'Дари Афганистана, уровень ниже среднего: как сказать, что ты можешь и не можешь, когда ты свободен или занят и что может случиться. Модальное می‌توانم с сослагательным (конъюнктивом), ممکن است и شاید с конъюнктивом, а также как назначить время, когда ты можешь прийти.'
units:
  prs.a2.unit30.can_and_might:
    title: Что я могу и что возможно
lessons:
  prs.a2.unit30.lesson01.what_i_can_do:
    title: Что я умею
  prs.a2.unit30.lesson02.all_persons_and_no:
    title: Все лица и отрицание
  prs.a2.unit30.lesson03.free_or_busy:
    title: Свободен или занят
  prs.a2.unit30.lesson04.might_and_maybe:
    title: Может быть, возможно
  prs.a2.unit30.lesson05.reading_and_listening:
    title: Читаем и слушаем о свободном времени
  prs.a2.unit30.lesson06.plans_conversation:
    title: Разговор о пятнице
teaching:
  prs.a2.unit30.lesson01.teach.swim:
    title: Плавать
    gloss: плавать
    note: '*شنا کردن* — «плавать». Это глагол из двух слов: существительное *شنا* плюс *کردن*. Многие умения называются так: *آشپزی کردن* (готовить), *رانندگی کردن* (водить машину), *صحبت کردن* (говорить).'
    example_gloss: Я хорошо плаваю.
  prs.a2.unit30.lesson01.teach.paint:
    title: Рисовать, писать красками
    gloss: рисовать, писать красками
    note: '*نقاشی کردن* — «рисовать» или «писать красками». Как и *شنا کردن*, это существительное плюс *کردن*.'
    example_gloss: Мой друг рисует.
  prs.a2.unit30.lesson01.teach.letter:
    title: Письмо
    gloss: письмо
    note: '*نامه* — «письмо». Глагол «писать» — *نوشتن*, а письмо — то, что пишут: *نامه نوشتن* значит «писать письмо».'
    example_gloss: Письмо дома.
  prs.a2.unit30.lesson01.teach.dari:
    title: Дари
    gloss: дари (язык)
    note: '*دری* — название языка, который ты изучаешь. Говорить на нём — *صحبت کردن*: *دری صحبت کردن*, а *انگلیسی صحبت کردن* значит «говорить по-английски». В дари название языка стоит прямо перед глаголом, без предлога, в отличие от русского «на дари».'
    example_gloss: Я немного говорю на дари.
  prs.a2.unit30.lesson01.teach.can:
    title: 'می‌توانم: я могу'
    gloss: Я могу пойти. Я могу прийти. Я умею готовить.
    note: '*می‌توانم* значит «я могу, я в состоянии». За ним всегда следует второй глагол в конъюнктиве: *می‌توانم بروم* (я могу пойти), *می‌توانم بیایم* (я могу прийти), *می‌توانم آشپزی کنم* (я умею готовить). Оба глагола стоят вместе и оба в первом лице. Пиши *می‌توانم* с полупробелом (ZWNJ) между *می* и *توانم*, а не с обычным пробелом.'
  prs.a2.unit30.lesson01.teach.subjunctive:
    title: 'Конъюнктив: ب + настоящая основа + م'
    gloss: я (мог бы) пойти, поесть, прочитать, написать, приготовить, купить, увидеть, сказать
    note: 'Конъюнктив состоит из трёх частей: *ب* + основа настоящего времени + личное окончание. Для «я» окончание *-م*. Основа настоящего времени глагола *رفتن* — *رو*, поэтому получается *بروم*. По тому же правилу: *خوردن* → *بخورم*, *خواندن* → *بخوانم*, *نوشتن* → *بنویسم*, *پختن* → *بپزم*, *خریدن* → *بخرم*, *دیدن* → *ببینم*, *گفتن* → *بگویم*. Эту форму ты уже встречал после *باید*. После *می‌توانم* она служит вторым глаголом. *آمدن* — неправильный глагол: *بیایم*.'
  prs.a2.unit30.lesson01.teach.compound:
    title: У глаголов из двух слов нет ب
    gloss: я могу готовить, водить, плавать, говорить, рисовать
    note: 'Глагол из существительного и *کردن* не принимает *ب*. Меняется только вспомогательный глагол: *کنم*. Стандартная письменная форма — *آشپزی کنم*; в речи также слышно *آشپزی بکنم*. Сравни: *می‌توانم آشپزی کنم* (я умею готовить) и *می‌توانم بروم* (я могу пойти). Та же схема работает для *رانندگی کنم*, *شنا کنم*, *صحبت کنم*, *نقاشی کنم*. Простой глагол *کردن* сам по себе даёт *بکنم*.'
  prs.a2.unit30.lesson01.teach.cook:
    title: Я умею готовить
    gloss: Я умею готовить.
    note: 'Это основная схема: подлежащее (по желанию), *می‌توانم*, умение и конъюнктив глагола *کردن*.'
  prs.a2.unit30.lesson01.teach.speak_dari:
    title: Я могу говорить на дари
    gloss: Я могу говорить на дари.
    note: Подлежащее *من* можно опустить, потому что *می‌توانم* уже показывает, кто говорит. Глагол *صحبت کنم* завершает предложение.
  prs.a2.unit30.lesson02.teach.paradigm:
    title: Вся парадигма
    gloss: я могу пойти, ты можешь пойти, он/она может пойти, мы можем пойти, вы (вежливо или мн. число) можете пойти, они могут пойти
    note: 'Оба глагола меняются по лицам. Модальный глагол: *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. Конъюнктив: *بروم، بروی، برود، برویم، بروین، بروند*. Так, *می‌توانی بروی* — «ты можешь пойти» (другу), *می‌تواند برود* — «он или она может пойти», *می‌توانیم برویم* — «мы можем пойти», *می‌توانین بروین* — «вы можете пойти» (вежливо, к одному уважаемому человеку, или к нескольким), *می‌توانند بروند* — «они могут пойти». Окончание второго лица множественного числа в обоих глаголах — *-ین*.'
  prs.a2.unit30.lesson02.teach.agreement:
    title: 'Глаголы из двух слов: меняется только کنم'
    gloss: Он умеет водить. Вы умеете водить. Мы умеем готовить.
    note: 'У глаголов из двух слов существительное не меняется, меняется только *کنم*: *کنم، کنی، کند، کنیم، کنین، کنند*. Так: *می‌توانم رانندگی کنم*, *می‌توانی رانندگی کنی*, *می‌تواند رانندگی کند*, *می‌توانیم رانندگی کنیم*, *می‌توانین رانندگی کنین*, *می‌توانند رانندگی کنند*. Лицо в обоих глаголах должно совпадать.'
  prs.a2.unit30.lesson02.teach.negative:
    title: 'Отрицание: نمی‌توانم'
    gloss: я не могу пойти, ты не можешь пойти, он/она не может пойти, мы не можем пойти, вы не можете пойти, они не могут пойти
    note: 'Чтобы сказать, что ты не можешь что-то сделать, добавь *ن* к модальному глаголу: *می‌توانم* превращается в *نمی‌توانم*. Второй глагол остаётся утвердительным: *نمی‌توانم بروم* (я не могу пойти), а не *نمی‌توانم نروم*. Все окончания такие же, как в утвердительной парадигме.'
  prs.a2.unit30.lesson02.teach.help_q:
    title: Вы можете мне помочь?
    gloss: Вы можете мне помочь?
    note: 'Так спрашивают друга, может ли он что-то сделать: *می‌توانی* плюс конъюнктив. Уважаемому человеку или нескольким людям скажи *می‌توانین به من کمک کنین؟*.'
  prs.a2.unit30.lesson02.teach.no_drive:
    title: Он не умеет водить
    gloss: Он не умеет водить. / Она не умеет водить.
    note: '*او* значит «он» или «она», поэтому в предложении речь об одном человеке, который не может водить. *نمی‌تواند* — отрицательная форма; *کند* — конъюнктив глагола *کردن* для «он/она».'
  prs.a2.unit30.lesson03.teach.busy:
    title: Занятой
    gloss: занят
    note: '*مشغول* значит «занят». Говорят *مشغول استم* (я занят), это противоположность *آزاد استم* (я свободен).'
    example_gloss: Сегодня я занят.
  prs.a2.unit30.lesson03.teach.tonight:
    title: Сегодня вечером
    gloss: сегодня вечером
    note: '*امشب* — «сегодня вечером». Как *فردا* (завтра) и *امروز* (сегодня), это слово времени, которое стоит перед глаголом.'
    example_gloss: Сегодня вечером я дома.
  prs.a2.unit30.lesson03.teach.five:
    title: Пять
    gloss: пять
    note: '*پنج* — «пять». *ساعت پنج* — «пять часов», а *بعد از ساعت پنج* — «после пяти часов».'
    example_gloss: В пять часов я иду домой.
  prs.a2.unit30.lesson03.teach.time_word:
    title: Слово времени плюс می‌توانم
    gloss: Завтра я могу прийти. Сегодня вечером я не могу прийти. В пятницу я могу прийти.
    note: 'Чтобы сказать, когда ты можешь что-то сделать, добавь в предложение слово времени: *فردا*, *امشب*, *روز جمعه*. Глаголы остаются прежними, *می‌توانم بیایم*; слово времени показывает, что речь о будущем, поэтому другая форма будущего не нужна. Слово времени может стоять в начале (*فردا می‌توانم بیایم*) или после модального глагола (*می‌توانم فردا بیایم*). Вопрос: *فردا می‌توانی بیایی؟* (Ты можешь прийти завтра?).'
  prs.a2.unit30.lesson03.teach.reply:
    title: Да, нет, потому что, но
    gloss: Да, я могу прийти. Нет, я не могу прийти, потому что я занят. Но в пятницу я свободен.
    note: 'Чтобы согласиться, ответь *بلی* и повтори модальный глагол: *بلی، می‌توانم بیایم*. Чтобы отказаться, ответь *نخیر* и назови причину с *چون*: *نخیر، نمی‌توانم بیایم، چون مشغول استم*. Затем *ولی* («но») предлагает другое время: *ولی روز جمعه آزاد استم*. *آزاد استم* — «я свободен», а *مشغول استم* — «я занят». Можно также сказать *کار دارم* (у меня дела).'
  prs.a2.unit30.lesson03.teach.after_five:
    title: Свободен после пяти
    gloss: После пяти часов я свободен.
    note: Так ты говоришь собеседнику, когда ты свободен. *بعد از ساعت پنج* — после пяти часов.
  prs.a2.unit30.lesson03.teach.when_q:
    title: Когда ты можешь прийти?
    gloss: Когда ты можешь прийти?
    note: '*کی* спрашивает о времени. Ответ — слово со временем в той же конструкции: *فردا می‌توانم بیایم* или *بعد از ساعت پنج می‌توانم بیایم*.'
  prs.a2.unit30.lesson04.teach.possible:
    title: Возможно, может быть
    gloss: возможно, что; может быть
    note: '*ممکن است* значит «возможно», «может быть». После него идёт придаточная часть с глаголом в сослагательной форме (конъюнктив): *ممکن است باران ببارد* (может пойти дождь). *ممکن* не изменяется; лицо показывает глагол после него.'
    example_gloss: Завтра может пойти дождь.
  prs.a2.unit30.lesson04.teach.maybe:
    title: Может быть
    gloss: может быть, возможно
    note: '*شاید* значит «может быть». Как и *ممکن است*, после него стоит глагол в сослагательной форме: *شاید بیایم* (может быть, я приду), *شاید او بیاید* (может быть, он придёт). *شاید* короче и чаще встречается в разговорной речи.'
    example_gloss: Может быть, он придёт.
  prs.a2.unit30.lesson04.teach.rain:
    title: Дождь
    gloss: дождь
    note: '*باران* — дождь. Глагол — *باریدن*: *باران ببارد* (может пойти дождь), *باران نبارد* (может не пойти дождь). Сослагательная форма от *باریدن* — *ببارد*.'
    example_gloss: Сегодня идёт дождь.
  prs.a2.unit30.lesson04.teach.sure:
    title: Конечно
    gloss: уверенный
    note: '*مطمئن* значит «уверенный». *مطمئن نیستم* — «я не уверен». Это естественная фраза перед тем, как добавить *شاید* или *ممکن است*.'
    example_gloss: Я не уверен.
  prs.a2.unit30.lesson04.teach.possible_subj:
    title: ممکن است и сослагательная форма
    gloss: Я могу опоздать. Он может прийти. Может пойти дождь.
    note: 'После *ممکن است* глагол стоит в сослагательной форме в нужном лице: *بیایم* (я приду), *بیایی* (ты придёшь), *بیاید* (он придёт), *بیاییم* (мы придём), *بیایین* (вы придёте), *بیایند* (они придут). Отрицание: *ن* ставится перед глаголом в сослагательной форме: *ممکن است نیاید* (он может не прийти). Сравни с *می‌توانم*: оно говорит «я способен», а *ممکن است* — «возможно, что это произойдёт».'
  prs.a2.unit30.lesson04.teach.maybe_subj:
    title: شاید и сослагательная форма
    gloss: Может быть, я приду. Может быть, ты придёшь. Может быть, он придёт. Может быть, они не придут.
    note: '*شاید* работает так же, как *ممکن است*: после него стоит сослагательная форма, а лицо показывает окончание глагола: *شاید بیایم، شاید بیایی، شاید بیاید، شاید بیاییم، شاید بیایین، شاید بیایند*. Отрицание — *ن* перед глаголом: *شاید نیایند* (может быть, они не придут). Впереди может стоять слово со временем: *شاید فردا بیایم*.'
  prs.a2.unit30.lesson04.teach.can_maybe:
    title: 'شاید بتوانم: может быть, смогу'
    gloss: Может быть, я смогу прийти. Может быть, я не смогу прийти. Возможно, он сможет прийти.
    note: 'Эти две идеи можно соединить: *شاید* или *ممکن است*, затем сослагательная форма глагола *توانستن* — *بتوانم، بتوانی، بتواند، بتوانیم، بتوانین، بتوانند* — и второй глагол. Так *شاید بتوانم بیایم* значит «может быть, я смогу прийти». Отрицание — *نتوانم*: *شاید نتوانم بیایم* — «может быть, я не смогу прийти». Это удобно, когда ты ещё не знаешь, свободен ли ты.'
  prs.a2.unit30.lesson04.teach.maybe_tomorrow:
    title: Может быть, завтра я смогу прийти
    gloss: Может быть, завтра я смогу прийти.
    note: Ты не уверен, но шанс есть. Слово со временем *فردا* стоит после *شاید*.
  prs.a2.unit30.lesson04.teach.rain_phrase:
    title: Может пойти дождь
    gloss: Может пойти дождь.
    note: '*ممکن است* и *ببارد*: возможность, а не обещание.'
  prs.a2.unit30.lesson05.teach.fix:
    title: Чинить
    gloss: чинить, ремонтировать, готовить
    note: '*درست کردن* — это «починить, отремонтировать что-то», а также «приготовить», например *چای درست کردن* (заварить чай). Сначала идёт предмет с *را*: *کمپیوترم را درست می‌کنم*.'
    example_gloss: Мой друг чинит мою машину.
  prs.a2.unit30.lesson05.teach.problem:
    title: Проблема
    gloss: проблема, трудность
    note: '*مشکل* — проблема. *مشکل کوچک* — маленькая проблема.'
    example_gloss: Проблема небольшая.
  prs.a2.unit30.lesson05.teach.turn01:
    title: Вахида спрашивает, сможет ли Сахи прийти
    gloss: Сахи, ты можешь завтра прийти к нам домой?
    note: 'Вахида спрашивает друга, свободен ли он завтра: *فردا می‌توانی ... بیایی؟*. Она говорит ему *تو*, потому что Сахи — друг.'
  prs.a2.unit30.lesson05.teach.turn02:
    title: Сахи называет своё время
    gloss: Утром не могу, потому что у меня работа в офисе. Но после пяти часов я свободен.
    note: Сахи отказывается от утра с помощью *نمی‌توانم* и объясняет причину с *چون*. После *نمی‌توانم* второй глагол опущен, потому что *بیایم* понятно из вопроса. Затем он предлагает другое время с *ولی*.
  prs.a2.unit30.lesson05.teach.turn03:
    title: Вахида просит о помощи
    gloss: Хорошо. Мой компьютер сломан. Ты можешь его починить?
    note: '*می‌توانی ... درست کنی؟* спрашивает, способен ли он это починить. *آن را* («его») указывает на компьютер.'
  prs.a2.unit30.lesson05.teach.turn04:
    title: Сахи не уверен
    gloss: Может быть, смогу. Возможно, проблема небольшая.
    note: Сахи не уверен, поэтому говорит *شاید بتوانم* («может быть, смогу») и *ممکن است ... باشد* («возможно, это ...»). После обоих стоит сослагательная форма.
  prs.a2.unit30.lesson05.teach.message:
    title: Сообщение от друга
    gloss: Привет, мой друг. Завтра я не смогу прийти, потому что утром у меня работа в офисе. После пяти часов я свободен, но могу опоздать. Может быть, в четверг я смогу прийти. Ты свободен в четверг?
    note: 'Короткое сообщение, где есть все три идеи урока: что автор не может сделать (*نمی‌توانم بیایم*), когда он свободен (*بعد از ساعت پنج آزاد استم*) и что может случиться (*ممکن است دیر برسم، شاید ... بتوانم*).'
  prs.a2.unit30.lesson06.teach.park:
    title: Парк
    gloss: парк
    note: '*پارک* — парк. Ты идёшь *به پارک* («в парк») и находишься *در پارک* («в парке»).'
    example_gloss: Парк находится в Кабуле.
  prs.a2.unit30.lesson06.teach.tea:
    title: Чай
    gloss: чай
    note: '*چای* — чай. *چای درست کردن* — заваривать чай, с глаголом из прошлого урока.'
    example_gloss: Чай горячий.
  prs.a2.unit30.lesson06.teach.turn01:
    title: Хамид спрашивает о пятнице
    gloss: Палваша, ты идёшь в пятницу в парк?
    note: '*جمعه به پارک می‌روی؟* спрашивает о плане: простое настоящее *می‌روی* и слово со временем. Палваша — подруга, поэтому он говорит *تو*.'
  prs.a2.unit30.lesson06.teach.turn02:
    title: Палваша не уверена
    gloss: Может быть, пойду. Может пойти дождь.
    note: Палваша не уверена. *شاید بروم* — «может быть, пойду», а *ممکن است باران ببارد* — «может пойти дождь». Оба глагола стоят в сослагательной форме.
  prs.a2.unit30.lesson06.teach.turn03:
    title: Хамид предлагает и спрашивает
    gloss: Я могу приготовить еду. Ты можешь заварить чай?
    note: Хамид говорит, что он умеет (*می‌توانم غذا بپزم*), и спрашивает, что может Палваша (*می‌توانی چای درست کنی؟*).
  prs.a2.unit30.lesson06.teach.turn04:
    title: Палваша соглашается, но с условием
    gloss: Да, могу. Но если пойдёт дождь, мы не сможем остаться в парке.
    note: '*بلی، می‌توانم* — согласие. Затем *اگر باران ببارد* («если пойдёт дождь») задаёт условие, а *نمی‌توانیم ... بمانیم* говорит, чего они не смогут. После *اگر* тоже стоит сослагательная форма.'
  prs.a2.unit30.lesson06.teach.turn05:
    title: У Хамида есть другая идея
    gloss: Тогда, может быть, поедим у меня дома.
    note: '*شاید ... بخوریم* — предложение, которое может сработать: может быть, поедим у меня дома. *پس* («тогда», «значит») следует из проблемы с дождём.'
exercises:
  prs.a2.unit30.lesson01.exercise01.recognize_swim:
    instruction: Что означает это предложение?
    correct_option: Я умею плавать
    distractors:
    - Вчера я плавал
    - Я люблю воду
    - Я хочу научиться плавать
    accepted_answers:
    - value: Я умею плавать
      status: correct
    feedback: '*می‌توانم شنا کنم* — «я умею плавать»: *می‌توانم* и сослагательная форма *کنم*.'
  prs.a2.unit30.lesson01.exercise02.recognize_letter:
    instruction: Что означает это предложение?
    correct_option: Я могу написать письмо
    distractors:
    - Я написал письмо
    - У меня есть письмо
    - Я должен написать письмо
    accepted_answers:
    - value: Я могу написать письмо
      status: correct
    feedback: '*می‌توانم نامه بنویسم* — «я могу написать письмо»: *نامه* — письмо, а *بنویسم* — сослагательная форма от *نوشتن*.'
  prs.a2.unit30.lesson01.exercise03.match_skills:
    instruction: Соедини каждое предложение на дари с его значением.
    accepted_answers:
    - value:
        می‌توانم شنا کنم: Я умею плавать
        می‌توانم آشپزی کنم: Я умею готовить
        می‌توانم رانندگی کنم: Я умею водить машину
        می‌توانم نقاشی کنم: Я умею рисовать
        می‌توانم نامه بنویسم: Я могу написать письмо
        می‌توانم دری صحبت کنم: Я могу говорить на дари
        می‌توانم انگلیسی صحبت کنم: Я могу говорить по-английски
        می‌توانم کتاب بخوانم: Я могу прочитать книгу
      status: correct
    feedback: 'Каждое предложение состоит из *می‌توانم*, умения и сослагательной формы: *کنم* для составных глаголов, *بنویسم* и *بخوانم* для простых глаголов.'
