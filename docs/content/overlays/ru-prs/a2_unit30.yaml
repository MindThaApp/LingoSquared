      status: correct
    - value: می‌توانم آشپزی کنم.
      status: correct
    - value: من می‌توانم آشپزی کنم
      status: correct
    - value: می‌توانم آشپزی کنم
      status: correct
    feedback: '*من می‌توانم آشپزی کنم.* *من* можно опустить.'
  prs.a2.unit30.lesson02.exercise01.recognize_he_drive:
    instruction: Что означает это предложение?
    correct_option: Он или она умеет водить машину
    distractors:
    - Он или она водил(а) машину
    - Я умею водить машину
    - Они умеют водить машину
    accepted_answers:
    - value: Он или она умеет водить машину
      status: correct
    feedback: '*می‌تواند* — форма модального глагола для «он» или «она», а *کند* — соответствующая сослагательная форма.'
  prs.a2.unit30.lesson02.exercise02.match_paradigm:
    instruction: Соедини каждую форму на дари с её значением.
    accepted_answers:
    - value:
        می‌توانم بروم: Я могу пойти
        می‌توانی بروی: ты можешь пойти (другу)
        می‌تواند برود: он или она может пойти
        می‌توانیم برویم: мы можем пойти
        می‌توانین بروین: вы можете пойти (вежливо или во множественном числе)
        می‌توانند بروند: они могут пойти
        نمی‌توانم بروم: Я не могу пойти
        نمی‌توانند بروند: они не могут пойти
      status: correct
    feedback: 'Оба глагола изменяются по лицам: *-م* — я, *-ی* — ты (друг), *-د* — он или она, *-یم* — мы, *-ین* — вы (вежливо или во множественном числе), *-ند* — они. В отрицании *ن* ставится только перед *می‌توانم*.'
    pairs:
    - left: می‌توانم بروم
      right: Я могу пойти
    - left: می‌توانی بروی
      right: ты можешь пойти (другу)
    - left: می‌تواند برود
      right: он или она может пойти
    - left: می‌توانیم برویم
      right: мы можем пойти
    - left: می‌توانین بروین
      right: вы можете пойти (вежливо или во множественном числе)
    - left: می‌توانند بروند
      right: они могут пойти
    - left: نمی‌توانم بروم
      right: Я не могу пойти
    - left: نمی‌توانند بروند
      right: они не могут пойти
  prs.a2.unit30.lesson02.exercise03.order_you_help:
    instruction: 'Расставь слова так, чтобы получилось: Вы можете помочь. (нескольким людям или человеку, которого ты уважаешь)'
