    correct_option: Он может приготовить еду
    distractors:
    - Он может заварить чай
    - Он умеет водить машину
    - Он может починить компьютер
    accepted_answers:
    - value: Он может приготовить еду
      status: correct
    feedback: '*من می‌توانم غذا بپزم* значит «я могу приготовить еду». Про чай спрашивают Палвашу.'
  prs.a2.unit30.lesson06.exercise03.recognize_you_pl:
    instruction: Что означает это предложение?
    correct_option: Вы можете прийти (вежливо или мн. число)
    distractors:
    - Вы пришли (вежливо или мн. число)
    - Вы не можете прийти (вежливо или мн. число)
    - Они могут прийти
    accepted_answers:
    - value: Вы можете прийти (вежливо или мн. число)
      status: correct
    feedback: '*می‌توانین* и *بیایین* оба оканчиваются на *-ین*: это «вы» — вежливое или во множественном числе.'
  prs.a2.unit30.lesson06.exercise04.order_friday_rain:
    instruction: 'Расставь слова так, чтобы получилось: В пятницу, возможно, пойдёт дождь.'
    accepted_answers:
    - value:
      - ممکن
      - است
      - جمعه
      - باران
      - ببارد
      status: correct
    - value:
      - جمعه
      - ممکن
      - است
      - باران
      - ببارد
      status: correct
    feedback: В *ممکن است جمعه باران ببارد* слово со значением времени стоит после *ممکن است*. *جمعه ممکن است باران ببارد* тоже верно.
  prs.a2.unit30.lesson06.exercise05.answer_make_tea:
    instruction: 'Хамид спрашивает: تو می‌توانی چای درست کنی؟ (Ты можешь заварить чай?) Ответь на дари как Палваша: Да, я могу заварить чай.'
