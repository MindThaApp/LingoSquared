      right: Я умею плавать
    - left: می‌توانم آشپزی کنم
      right: Я умею готовить
    - left: می‌توانم رانندگی کنم
      right: Я умею водить машину
    - left: می‌توانم نقاشی کنم
      right: Я умею рисовать
    - left: می‌توانم نامه بنویسم
      right: Я могу написать письмо
    - left: می‌توانم دری صحبت کنم
      right: Я могу говорить на дари
    - left: می‌توانم انگلیسی صحبت کنم
      right: Я могу говорить по-английски
    - left: می‌توانم کتاب بخوانم
      right: Я могу прочитать книгу
  prs.a2.unit30.lesson01.exercise04.order_speak_dari:
    instruction: 'Расставь слова так, чтобы получилось: Я могу говорить на дари.'
    accepted_answers:
    - value:
      - من
      - می‌توانم
      - دری
      - صحبت
      - کنم
      status: correct
    feedback: В *من می‌توانم دری صحبت کنم* слово *می‌توانم* стоит после подлежащего, а сослагательная форма *کنم* — в конце.
