course:
  title: Дари A2
  description: 'Дари Афганистана, уровень ниже среднего: как назвать причину и следствие в одном сообщении. Причина с چون (и زیرا для чтения), следствие с به همین دلیل / برای همین и بنابراین, а также به دلیل с существительным; лексика для отговорок и изменения планов.'
units:
  prs.a2.unit34.because_so:
    title: Потому что и поэтому
lessons:
  prs.a2.unit34.lesson01.ask_and_give_reasons:
    title: Почему? Потому что…
  prs.a2.unit34.lesson02.order_and_not_coming:
    title: Порядок частей предложения и «я не пришёл»
  prs.a2.unit34.lesson03.because_of_this:
    title: 'Вот почему: به همین دلیل и برای همین'
  prs.a2.unit34.lesson04.because_of_and_therefore:
    title: به دلیل, بنابراین и زیرا
  prs.a2.unit34.lesson05.reading_and_listening:
    title: Читаем и слушаем о причинах
  prs.a2.unit34.lesson06.change_of_plan:
    title: Разговор об изменении плана
teaching:
  prs.a2.unit34.lesson01.teach.headache:
    title: Головная боль
    gloss: головная боль
    note: '*سردرد* — головная боль. Говорят *سردرد دارم* (у меня болит голова) и *سردرد داشتم* (у меня болела голова). Это очень частая причина, когда не можешь что-то сделать.'
    example_gloss: Вчера у меня болела голова.
  prs.a2.unit34.lesson01.teach.tired:
    title: Усталый
    gloss: усталый
    note: '*خسته* — усталый. Это прилагательное, поэтому оно употребляется с *استم* (я есть) и *بودم* (я был): *خسته بودم* — «я устал(а)».'
    example_gloss: Сегодня я очень устал(а).
  prs.a2.unit34.lesson01.teach.busy:
    title: Занятой
    gloss: занятой
    note: '*مصروف* — занятой. *مصروف بودم* — «я был(а) занят(а)». Это обычная короткая причина, когда пропускаешь встречу или визит.'
    example_gloss: На этой неделе я занят(а).
  prs.a2.unit34.lesson01.teach.weather:
    title: Погода
    gloss: погода, воздух
    note: '*هوا* — погода, а также воздух. *هوا خوب است* — «погода хорошая».'
    example_gloss: Сегодня хорошая погода.
  prs.a2.unit34.lesson01.teach.cold:
    title: Холодно
    gloss: холодно
    note: '*سرد* — холодный. *هوا سرد است* — «холодно», о погоде.'
    example_gloss: Ночью холодно.
  prs.a2.unit34.lesson01.teach.excuse:
    title: Отговорка
    gloss: отговорка, названная причина
    note: '*عذر* — причина, которую называют, когда чего-то не сделали; отговорка, оправдание. Хороший *عذر* отвечает на вопрос *چرا؟*.'
    example_gloss: Его отговоркой была головная боль.
  prs.a2.unit34.lesson01.teach.why_because:
    title: Спрашиваем «почему» и отвечаем «потому что»
    gloss: Почему ты не пошёл в офис? Потому что я устал.
    note: '*چرا* спрашивает о причине, а *چون* её называет. Ответом может быть целое придаточное: *چون خسته بودم* («потому что я устал(а)»). В коротком ответе остальную часть вопроса не повторяют. Внутри части после *چون* ничего не меняется: глагол стоит в конце, как в любом предложении на дари.'
  prs.a2.unit34.lesson01.teach.reason_sentence:
    title: Я не пошёл в офис, потому что болел
    gloss: Я не пошёл(ла) в офис, потому что был(а) болен(больна).
    note: 'Это основная модель урока: сначала то, что произошло, затем запятая, затем *چون* и причина. Две части можно поменять местами: *چون مریض بودم، به دفتر نرفتم*.'
  prs.a2.unit34.lesson02.teach.friends:
    title: Марджан и Харун
    gloss: Марджан и Харун — друзья.
    note: 'Марджан и Харун — два друга в этом уроке. Они обращаются друг к другу на *تو*. Окончание *-ند* в *استند* — форма множественного числа от *است*: «они есть».'
  prs.a2.unit34.lesson02.teach.came:
    title: 'Приходить: простое прошедшее время'
    gloss: я пришёл(ла), ты пришёл(ла), он/она пришёл/пришла, мы пришли, вы пришли (вежливо или мн. ч.), они пришли
    note: 'Прошедшее время от *آمدن*: *آمدم، آمدی، آمد، آمدیم، آمدین، آمدند*. Куда пришли, говорят с *به*: *به جلسه آمدم* — «я пришёл(ла) на встречу». Окончания те же, что у всех известных тебе глаголов в прошедшем времени.'
  prs.a2.unit34.lesson02.teach.did_not_come:
    title: 'Я не пришёл: ن + یامد'
    gloss: я не пришёл(ла), ты не пришёл(ла), он/она не пришёл/не пришла, мы не пришли, вы не пришли, они не пришли
    note: 'Отрицание от *آمدن* в прошедшем времени — *نیامدم* («я не пришёл(ла)»). Перед глаголом ставится *ن*: *نـ + آمدم* превращается в *نیامدم*, между двумя звуками *ا* появляется *ی*. Остальные формы: *نیامدی، نیامد، نیامدیم، نیامدین، نیامدند*. У *رفتن* всё просто: *نرفتم، نرفتی، نرفت*.'
  prs.a2.unit34.lesson02.teach.stay:
    title: Оставаться
    gloss: оставаться, пребывать
    note: '*ماندن* — оставаться. Прошедшее время: *ماندم، ماندی، ماندیم*, настоящее: *می‌مانم، می‌مانی، می‌مانیم*. *در خانه ماندم* — «я остался(лась) дома»; это очень частое следствие плохой погоды или болезни.'
    example_gloss: Сегодня я остаюсь дома.
  prs.a2.unit34.lesson02.teach.either_order:
    title: Причина может стоять в начале или в конце
    gloss: Поскольку холодно, я остаюсь дома. / Я остаюсь дома, потому что холодно.
    note: 'Часть с *چون* может стоять перед главной частью или после неё, смысл тот же. Если она стоит первой, после неё ставится запятая: *چون هوا سرد است، در خانه می‌مانم*. В обоих случаях глагол остаётся в конце своей части, поэтому порядок слов внутри частей не меняется.'
  prs.a2.unit34.lesson02.teach.sorry:
    title: Мне жаль, я не пришёл на встречу
    gloss: Мне жаль, я не пришёл(ла) на встречу.
    note: '*متأسفم* — «мне жаль». Часто сначала говорят это, а потом называют причину с *چون*.'
  prs.a2.unit34.lesson02.teach.stayed_home:
    title: Поскольку я устал, я остался дома
    gloss: Поскольку я устал(а), я остался(лась) дома.
    note: Причина (*خسته بودم*) стоит в прошедшем времени, и следствие (*در خانه ماندم*) тоже.
  prs.a2.unit34.lesson03.teach.so_dalil:
    title: 'به همین دلیل: по этой причине, поэтому'
    gloss: Я был(а) занят(а). Поэтому я не пришёл(ла).
    note: '*به همین دلیل* вводит следствие того, что только что было сказано. Значит «по этой самой причине, поэтому». Оно начинает второе предложение: сначала причина (*مصروف بودم*), затем следствие (*به همین دلیل نیامدم*). Это зеркальная пара к *چون*: *چون* вводит причину, а *به همین دلیل* — следствие.'
  prs.a2.unit34.lesson03.teach.so_hamin:
    title: 'برای همین: поэтому'
    gloss: Было холодно. Поэтому мы остались дома.
    note: '*برای همین* значит то же, что *به همین دلیل*, но короче. Оно частое в разговоре, а *به همین دلیل* звучит чуть аккуратнее. Перед любым из них можно поставить *و*: *هوا سرد بود و برای همین در خانه ماندیم*.'
  prs.a2.unit34.lesson03.teach.because_vs_so:
    title: Два способа сказать одно и то же
    gloss: Поскольку я был(а) болен(больна), я не пришёл(ла). / Я был(а) болен(больна). Поэтому я не пришёл(ла).
    note: 'Эти два высказывания значат одно и то же. С *چون* причина стоит в начале или в конце одного предложения. С *به همین دلیل* получаются два предложения: сначала причина, потом следствие. Смысл причины всегда один. Для одной связи берут один союз: *چون* и *به همین دلیل* в одном предложении не ставят.'
  prs.a2.unit34.lesson03.teach.busy_not_come:
    title: Я был занят. Поэтому я не пришёл
    gloss: Я был(а) занят(а). Поэтому я не пришёл(ла).
    note: 'Короткое сообщение, объясняющее отсутствие: сначала причина, потом следствие.'
  prs.a2.unit34.lesson03.teach.cold_stayed:
    title: Было холодно. Поэтому мы остались дома
    gloss: Было холодно. Поэтому мы остались дома.
    note: Та же модель с *برای همین*. *ماندیم* — «мы остались».
  prs.a2.unit34.lesson03.teach.car_broken:
    title: Моя машина сломалась. Поэтому я опоздал
    gloss: Моя машина сломалась. Поэтому я опоздал(а).
    note: 'Следствием может быть и другое действие: не только остаться дома, но и опоздать.'
  prs.a2.unit34.lesson04.teach.be_dalil:
    title: 'به دلیل + существительное: из-за'
    gloss: из-за снега, из-за головной боли, из-за работы
    note: '*به دلیل* значит «из-за» и после него идёт существительное, а не целое предложение: *به دلیل برف* («из-за снега»), *به دلیل سردرد* («из-за головной боли»). Следующее предложение — следствие. *به دلیل برف* выполняет ту же задачу, что и *چون برف می‌بارید*, но короче. Если у тебя есть глагол, используй *چون*; если только существительное — *به دلیل*.'
  prs.a2.unit34.lesson04.teach.snow_cancel:
    title: Из-за снега встречу отменили
    gloss: Из-за снега встречу отменили.
    note: '*لغو شد* — «была отменена». Оборот с *به دلیل* часто стоит в начале, и после него ставится запятая.'
  prs.a2.unit34.lesson04.teach.headache_office:
    title: Из-за головной боли я не пошёл в офис
    gloss: Из-за головной боли я не пошёл(ла) в офис.
    note: 'Та же модель с другим существительным. Его можно поставить и в конец: *به دفتر نرفتم، به دلیل سردرد*.'
  prs.a2.unit34.lesson04.teach.change_plan:
    title: Менять
    gloss: менять, изменять
    note: '*تغییر دادن* — менять что-либо. То, что меняют, стоит перед глаголом с *را*: *برنامه را تغییر دادیم* — «мы изменили план». Прошедшее время: *دادم، دادی، دادیم*, настоящее: *می‌دهیم*: *برنامه را تغییر می‌دهیم* — «мы меняем план».'
    example_gloss: Мы изменили план.
  prs.a2.unit34.lesson04.teach.banabarin:
    title: 'بنابراین: следовательно, поэтому'
    gloss: Дорога была закрыта. Поэтому автобус не поехал.
    note: '*بنابراین* значит «поэтому, следовательно» и начинает предложение с результатом: сначала причина, затем *بنابراین* и результат. Оно выполняет ту же задачу, что и *به همین دلیل*, но звучит более официально. Чаще всего его встретишь в письменных сообщениях, объявлениях и отчётах. В речи предпочитают *برای همین* или *به همین دلیل*.'
  prs.a2.unit34.lesson04.teach.zira:
    title: 'زیرا: потому что (в письменной речи)'
    gloss: Собрание отменили, потому что руководитель не пришёл.
    note: '*زیرا* тоже значит «потому что», но встречается в письменной речи, а не в устной. Обычно оно стоит после результата и запятой: сначала результат, затем *زیرا* и причина. В разговоре и в сообщении другу используй *چون*. *زیرا* нужно только узнавать.'
  prs.a2.unit34.lesson04.teach.connectors:
    title: Слова причины и слова результата
    gloss: 'потому что, потому что (в письменной речи), из-за: причина. по этой причине, поэтому, следовательно: результат.'
    note: Раздели слова по их роли. *چون*, *زیرا* и *به دلیل* употребляются с причиной. *به همین دلیل*, *برای همین* и *بنابراین* употребляются с результатом. В разговоре используй *چون* и *برای همین*. В официальном сообщении используй *زیرا*, *به دلیل* и *بنابراین*.
  prs.a2.unit34.lesson05.teach.meeting_today:
    title: Собрание (связанная форма)
    gloss: собрание (чего-либо) (связанная форма)
    note: 'Когда после *جلسه* стоит другое слово, которое его уточняет, оба слова соединяет небольшой знак (хамза над конечной *ه*): *جلسهٔ امروز* — это сегодняшнее собрание. В обычном письме этот знак часто опускают.'
    example_gloss: Сегодняшнее собрание в десять часов.
  prs.a2.unit34.lesson05.teach.niloufar:
    title: Нилуфар (имя)
    gloss: Нилуфар (женское имя)
    note: '*نیلوفر* — женское имя. Это она написала сообщение, которое ты прочитаешь.'
    example_gloss: Нилуфар работает в офисе.
  prs.a2.unit34.lesson05.teach.d1_t1:
    title: Марджан спрашивает Харуна, почему он не пришёл
    gloss: Харун, почему ты вчера не пришёл на собрание?
    note: Марджан задаёт вопрос со словом *چرا* и глаголом в простом прошедшем времени с отрицанием *نیامدی*. Она говорит с другом, поэтому использует *تو*.
  prs.a2.unit34.lesson05.teach.d1_t2:
    title: Харун объясняет
    gloss: Прости. У меня болела голова, поэтому я остался дома.
    note: Харун извиняется и в двух коротких предложениях называет причину (*سردرد داشتم*) и результат (*به همین دلیل در خانه ماندم*).
  prs.a2.unit34.lesson05.teach.d1_t3:
    title: Марджан спрашивает про звонок
    gloss: Почему ты не позвонил?
    note: '*تیلفون نکردی* значит «ты не позвонил». Она спрашивает ещё об одной причине со словом *چرا*.'
  prs.a2.unit34.lesson05.teach.d1_t4:
    title: Харун называет вторую причину
    gloss: Потому что мой телефон был сломан.
    note: 'Короткий ответ: *چون* и причина, больше ничего.'
  prs.a2.unit34.lesson05.teach.d1_t5:
    title: Марджан реагирует
    gloss: Как жаль! Ты теперь здоров?
    note: '*چه بد!* — дружеская реакция на плохую новость. *استی* — разговорная форма «ты есть» (ты…) в общении с другом.'
  prs.a2.unit34.lesson05.teach.d1_t6:
    title: Харун отвечает
    gloss: Да, теперь я здоров.
    note: '*استم* значит «я есть» (я…).'
  prs.a2.unit34.lesson05.teach.message:
    title: Сообщение от Нилуфар
    gloss: Здравствуй, Марджан. Прости, сегодняшнее собрание отменили, потому что руководитель не пришёл в офис. Из-за снега дорога была закрыта. Поэтому собрание будет в четверг. Нилуфар
    note: 'Короткое письменное сообщение. В нём используются письменные слова причины: *زیرا* для причины, *به دلیل برف* для причины, выраженной существительным, и *بنابراین* для результата.'
  prs.a2.unit34.lesson06.teach.d2_t1:
    title: Харун предлагает день
    gloss: Марджан, пойдём в среду в парк?
    note: 'Простое настоящее время *می‌رویم* с днём недели обозначает план: мы идём в среду. Вопрос заканчивается повышением голоса.'
  prs.a2.unit34.lesson06.teach.d2_t2:
    title: Марджан называет причину
    gloss: В среду не получится, потому что пойдёт снег.
    note: Марджан отказывается со словом *نه* и называет причину с *چون*. Настоящее время *برف می‌بارد* так же используют, когда говорят о погоде на завтра.
  prs.a2.unit34.lesson06.teach.d2_t3:
    title: Харун меняет план
    gloss: Тогда изменим план. Пойдём в четверг?
    note: '*پس* значит «тогда, итак». *برنامه را تغییر می‌دهیم* значит «мы меняем план».'
  prs.a2.unit34.lesson06.teach.d2_t4:
    title: Марджан не может в четверг
    gloss: В четверг у меня собрание, поэтому я не могу.
    note: Причина (*جلسه دارم*) и результат (*به همین دلیل نمی‌توانم*) в одном предложении, разделённые запятой. *نمی‌توانم* значит «я не могу».
  prs.a2.unit34.lesson06.teach.d2_t5:
    title: Харун выбирает другой день
    gloss: Хорошо, тогда пойдём в пятницу.
    note: '*پس* здесь значит «тогда»: вопрос решён.'
  prs.a2.unit34.lesson06.teach.d2_t6:
    title: Марджан соглашается
    gloss: Да, пятница подходит.
    note: '*جمعه خوب است* значит «пятница подходит»; так соглашаются с планом.'
exercises:
  prs.a2.unit34.lesson01.exercise01.recognize_headache:
    instruction: Что это значит?
    correct_option: Потому что у меня болит голова
    distractors:
    - Потому что у меня болела голова
    - Почему у меня болит голова?
    - Потому что я устал
    accepted_answers:
