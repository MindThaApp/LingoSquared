course:
  title: Дари A2
  description: 'Дари Афганистана, уровень ниже среднего: последовательность событий с помощью придаточных времени, например: до того как я ушёл, после того как я приехал и когда закипела вода. «До» и «после» с существительным, بعد از اینکه с прошедшим временем, قبل از اینکه с сослагательным наклонением и وقتی که.'
units:
  prs.a2.unit35.before_after_when:
    title: До, после, когда
lessons:
  prs.a2.unit35.lesson01.before_after_nouns:
    title: «До» и «после» с существительным
  prs.a2.unit35.lesson02.after_clause_travel:
    title: После придаточного и работа в поездке
  prs.a2.unit35.lesson03.before_clause_cooking:
    title: До придаточного и готовка
  prs.a2.unit35.lesson04.when_clause:
    title: Когда
  prs.a2.unit35.lesson05.reading_and_listening:
    title: 'Чтение и аудирование: рис и поездка'
  prs.a2.unit35.lesson06.morning_conversation:
    title: Разговор об утре
teaching:
  prs.a2.unit35.lesson01.teach.before:
    title: До
    gloss: перед (с существительным)
    note: '*قبل از* означает «перед, до». После него стоит существительное, своего глагола нет: *قبل از صبحانه* — «перед завтраком».'
    example_gloss: Перед завтраком я принимаю душ.
  prs.a2.unit35.lesson01.teach.after:
    title: После
    gloss: после (с существительным)
    note: '*بعد از* означает «после», и после него тоже стоит существительное: *بعد از مکتب* — «после школы».'
    example_gloss: После школы я иду домой.
  prs.a2.unit35.lesson01.teach.dinner:
    title: Ужин
    gloss: ужин
    note: '*شام* — «ужин». *می‌خورم* — «я ем» или «я пью»: *شام می‌خورم* — «я ужинаю», а *چای می‌خورم* — «я пью чай». В дари для того и другого один глагол.'
    example_gloss: После ужина я пью чай.
  prs.a2.unit35.lesson01.teach.get_dressed:
    title: Одеваться
    gloss: одеваться
    note: '*لباس* — «одежда», *پوشیدن* — «надевать». *لباس می‌پوشم* — «я одеваюсь»; *می‌پوشم* — форма настоящего времени для «я».'
    example_gloss: Каждое утро я одеваюсь.
  prs.a2.unit35.lesson01.teach.wake_up:
    title: Просыпаться
    gloss: просыпаться
    note: '*بیدار شدن* — «просыпаться». *شدن* значит «становиться», поэтому *بیدار می‌شوم* — «я просыпаюсь», буквально «становлюсь бодрствующим».'
    example_gloss: Я просыпаюсь в шесть часов.
  prs.a2.unit35.lesson01.teach.noun_pattern:
    title: «До» и «после» с существительным
    gloss: перед завтраком, после завтрака, перед школой, после школы, перед ужином, после ужина
    note: 'Поставьте существительное сразу после *قبل از* или *بعد از*, чтобы сказать, когда что-то происходит: *قبل از صبحانه* («перед завтраком»), *بعد از مکتب* («после школы»). У этого оборота нет своего глагола; глагол стоит в главной части предложения. Оборот может стоять в начале предложения (*بعد از شام چای می‌خورم*) или в конце (*چای می‌خورم بعد از شام*).'
  prs.a2.unit35.lesson01.teach.sequence_words:
    title: Сначала, потом, после этого, наконец
    gloss: Сначала я просыпаюсь. Потом принимаю душ. После этого завтракаю. В конце иду в школу.
    note: 'Чтобы рассказать о дне по порядку, используют короткие связки: *اول* («сначала»), *بعد* («потом»), *بعد از آن* («после этого») и *در آخر* («наконец, в конце»). *بعد از آن* — это *بعد از* с существительным *آن* («то»), поэтому оно отсылает к только что названному шагу.'
  prs.a2.unit35.lesson01.teach.phrase_school:
    title: После завтрака я иду в школу
    gloss: После завтрака я иду в школу.
    note: Существительное *صبحانه* стоит после *بعد از*, а глагол *می‌روم* — в конце. Это самый простой способ сказать, что за чем следует.
  prs.a2.unit35.lesson02.teach.ticket:
    title: Билет
    gloss: билет (на самолёт или автобус)
    note: '*تکت* — билет на самолёт или автобус. *تکت گرفتن* — «взять, купить билет».'
    example_gloss: Я взял билет на самолёт.
  prs.a2.unit35.lesson02.teach.suitcase:
    title: Чемодан
    gloss: чемодан
    note: '*چمدان* — «чемодан». Добавьте *-م* («мой»): *چمدانم* — «мой чемодан».'
    example_gloss: Мой чемодан дома.
  prs.a2.unit35.lesson02.teach.pack:
    title: я собрал чемодан
    gloss: Я собрал чемодан.
    note: '*چمدان را بستن* — «собрать чемодан» (глагол *بستن* тот же, что в *دروازه بسته است*). Сначала идёт чемодан, затем *را*, затем глагол: *بستم* — простое прошедшее для «я».'
  prs.a2.unit35.lesson02.teach.after_past:
    title: بعد از اینکه + прошедшее
    gloss: После того как я взял билет, я собрал чемодан.
    note: '*بعد از اینکه* означает «после того как» и начинает придаточное со своим глаголом. Когда вы рассказываете о прошлом, этот глагол стоит в простом прошедшем: *بعد از اینکه تکت را گرفتم* — «после того как я взял билет». Главная часть говорит о том, что было дальше: *چمدانم را بستم*. Событие в придаточном с *بعد از اینکه* произошло первым.'
  prs.a2.unit35.lesson02.teach.after_habit:
    title: بعد از اینکه для привычных действий
    gloss: После того как я приезжаю на станцию, я беру билет.
    note: 'Если действие повторяется, поставьте глагол в настоящее время с *می‌*: *بعد از اینکه به ایستگاه می‌رسم* — «после того как я приезжаю на станцию», а *تکت می‌گیرم* — «беру билет». *می‌رسم* — настоящее время от *رسیدن* для «я».'
  prs.a2.unit35.lesson02.teach.swap:
    title: Части предложения можно поменять местами
    gloss: Я собрал чемодан, после того как взял билет.
    note: 'Придаточное с *بعد از اینکه* можно поставить вторым. Смысл не меняется: событие в придаточном с *بعد از اینکه* всё равно произошло первым. Меняется только порядок слов, а не порядок событий.'
  prs.a2.unit35.lesson02.teach.noun_or_clause:
    title: Существительное или придаточное
    gloss: после ужина / после того как я поужинал
    note: С существительным используйте *بعد از*, а с целым придаточным — *بعد از اینکه*. *بعد از شام* — «после ужина». *بعد از اینکه شام خوردم* — «после того как я поужинал». Во втором случае есть глагол, поэтому можно сказать и о том, кто это сделал.
  prs.a2.unit35.lesson02.teach.phrase_station:
    title: После того как я приехал на станцию, я позвонил
    gloss: После того как я приехал на станцию, я позвонил по телефону.
    note: 'Типичная последовательность в поездке: сначала *رسیدم* («приехал»), затем *تیلفون کردم* («позвонил»). *تیلفون کردن* — обычный способ сказать «позвонить по телефону».'
  prs.a2.unit35.lesson03.teach.subjunctive_forms:
    title: قبل از اینکه + сослагательное наклонение
    gloss: до того как я приеду, до того как я пойду, до того как я поем, до того как я приду, до того как я куплю
    note: '*قبل از اینکه* означает «до того как» и начинает придаточное со своим глаголом. Этот глагол стоит не в прошедшем времени, а в сослагательном наклонении — той же форме, что и после *باید*: *ب-* + настоящая основа + окончание. От *رسیدن* получается *برسم*, от *رفتن* — *بروم*, от *خوردن* — *بخورم*, от *آمدن* — *بیایم*, от *خریدن* — *بخرم*.'
  prs.a2.unit35.lesson03.teach.subjunctive_paradigm:
    title: Окончания сослагательного наклонения
    gloss: чтобы я приехал, чтобы ты приехал, чтобы он/она приехал(а), чтобы мы приехали, чтобы вы приехали (вежливо или мн. ч.), чтобы они приехали
    note: 'Окончания: *-م، -ی، -د، -یم، -ین، -ند*. Так, *قبل از اینکه من برسم* — «до того как я приеду», *قبل از اینکه تو برسی* — «до того как ты приедешь» (другу), *قبل از اینکه او برسد* — «до того как он или она приедет», *قبل از اینکه ما برسیم* — «до того как мы приедем», *قبل از اینکه شما برسین* — «до того как вы приедете» (вежливо или мн. ч.), *قبل از اینکه آن‌ها برسند* — «до того как они приедут». Во 2-м лице мн. числа в дари окончание *-ین*; написание *-ید* тоже понимают.'
  prs.a2.unit35.lesson03.teach.past_story:
    title: Даже в рассказе о прошлом
    gloss: Перед тем как уйти из дома, я собрал чемодан.
    note: 'Рассказ в прошедшем времени, поэтому после *قبل از اینکه* можно ожидать глагол в прошедшем. Но используется сослагательное наклонение: *بروم*, а не *رفتم*. Причина в том, что в момент сборов чемодана уход ещё не произошёл. Не говорите в таком случае *قبل از اینکه رفتم* или *قبل از اینکه می‌روم*. Главная часть стоит в простом прошедшем: *چمدانم را بستم*.'
  prs.a2.unit35.lesson03.teach.noun_or_clause:
    title: Существительное или придаточное
    gloss: перед ужином / перед тем как я поужинаю
    note: 'С существительным используйте *قبل از*: *قبل از شام*. С придаточным добавьте *اینکه* и поставьте глагол в сослагательное наклонение: *قبل از اینکه شام بخورم*. Это зеркально *بعد از شام* и *بعد از اینکه شام خوردم*, только после *بعد از اینکه* глагол стоит в прошедшем, а после *قبل از اینکه* — в сослагательном.'
  prs.a2.unit35.lesson03.teach.rice:
    title: Рис
    gloss: рис
    note: '*برنج* — «рис». Это одно из главных блюд афганской кухни.'
    example_gloss: Я ем рис.
  prs.a2.unit35.lesson03.teach.onion:
    title: Лук
    gloss: лук
    note: '*پیاز* — «лук». Многие блюда начинаются с лука.'
    example_gloss: Дома есть лук.
  prs.a2.unit35.lesson03.teach.chop:
    title: Нарезать
    gloss: мелко нарезать, крошить
    note: '*خرد کردن* — «мелко нарезать». Сначала идёт то, что режут, с *را*: *پیاز را خرد می‌کنم* — «я режу лук».'
    example_gloss: Я режу лук.
  prs.a2.unit35.lesson03.teach.cook:
    title: Готовить
    gloss: варить, готовить (еду)
    note: '*پختن* — «готовить еду». Основа настоящего времени — *پز*: *می‌پزم* — «я готовлю», *بپزم* — «чтобы я приготовил» (сослагательное, после *قبل از اینکه*), а *پختم* — «я приготовил».'
    example_gloss: Я варю рис.
  prs.a2.unit35.lesson03.teach.sleep:
    title: Спать
    gloss: спать, ложиться спать
    note: '*خوابیدن* — «спать» или «ложиться спать». *می‌خوابم* — «я сплю», а *بخوابم* — «чтобы я лёг спать» (сослагательное).'
    example_gloss: Я ложусь спать в десять часов.
  prs.a2.unit35.lesson03.teach.phrase_cook:
    title: Перед тем как сварить рис, я режу лук
    gloss: Перед тем как сварить рис, я режу лук.
    note: 'Шаг приготовления по порядку. *بپزم* — сослагательное после *قبل از اینکه*; *خرد می‌کنم* — настоящее время для привычки или рецепта: сначала лук, потом рис.'
  prs.a2.unit35.lesson04.teach.when_past:
    title: وقتی که для одного события в прошлом
    gloss: Когда я пришёл домой, я поужинал.
    note: '*وقتی که* означает «когда» и начинает придаточное со своим глаголом. Для одного события в прошлом в обеих частях стоит простое прошедшее: *وقتی که به خانه رسیدم* («когда я пришёл домой»), *شام خوردم* («я поужинал»). Два события происходят примерно одновременно или одно сразу за другим.'
  prs.a2.unit35.lesson04.teach.when_habit:
    title: وقتی که для привычки
    gloss: Когда я прихожу домой, я пью чай.
    note: 'Если что-то происходит каждый раз, в обеих частях ставится настоящее время с *می‌*: *وقتی که به خانه می‌رسم، چای می‌خورم* — «когда я прихожу домой, я пью чай».'
  prs.a2.unit35.lesson04.teach.when_future:
    title: وقتی که для того, что ещё впереди
    gloss: Завтра, когда я приеду в Герат, я позвоню.
    note: 'Если время ещё не наступило, глагол после *وقتی که* стоит в сослагательном наклонении (*برسم*), а главный глагол — в настоящем времени с *می‌* и словом со значением времени: *فردا ... تیلفون می‌کنم* («завтра звоню», то есть «позвоню»). Особая форма будущего времени не нужна.'
  prs.a2.unit35.lesson04.teach.water:
    title: Вода
    gloss: вода
    note: '*آب* — «вода». Холодная вода — *آب سرد*; горячая — *آب گرم*.'
    example_gloss: Вода горячая.
  prs.a2.unit35.lesson04.teach.boil:
    title: Кипеть
    gloss: закипать, кипеть (о воде)
    note: '*جوش شدن* — «закипать». Простое прошедшее — *جوش شد*, настоящее — *جوش می‌شود*: *آب جوش می‌شود* — «вода закипает».'
    example_gloss: Вода закипела.
  prs.a2.unit35.lesson04.teach.salt:
    title: Соль
    gloss: соль
    note: '*نمک* — «соль». Вместе с *برنج* и *آب* она входит в простой рецепт.'
    example_gloss: Дома есть соль и рис.
  prs.a2.unit35.lesson04.teach.throw_in:
    title: Класть
    gloss: бросать, класть (во что-то)
    note: '*انداختن* — «бросать» или «класть что-то во что-то». В кулинарии это обычный глагол для добавления: *نمک را می‌اندازم* — «я кладу соль». Простое прошедшее — *انداختم*.'
    example_gloss: Я кладу соль в воду.
  prs.a2.unit35.lesson04.teach.phrase_boil:
    title: Когда вода закипает, я кладу рис
    gloss: Когда вода закипает, я кладу рис.
    note: 'Привычное действие в рецепте: оба глагола стоят в настоящем времени с *می‌*.'
  prs.a2.unit35.lesson04.teach.when_short:
    title: وقتی که или просто وقتی
    gloss: когда я приехал / когда я приехал
    note: Обе формы правильны. *وقتی که* чуть полнее, а *وقتی* короче, смысл один и тот же. В курсе сначала используется *وقتی که*; можно вводить любой вариант.
  prs.a2.unit35.lesson04.teach.phrase_ready:
    title: Когда рис был готов, я его съел
    gloss: Когда рис был готов, я его съел.
    note: '*آماده شد* — «стал готовым». *آن را* («его», с *را*) указывает на рис.'
  prs.a2.unit35.lesson05.teach.pack_present:
    title: Собирать чемодан
    gloss: собирать чемодан
    note: '*چمدان بستن* — «собирать чемодан». Настоящее время для «я» — *می‌بندم*: *چمدانم را می‌بندم* — «я собираю чемодан». Простое прошедшее — *بستم*.'
    example_gloss: Перед поездкой я собираю чемодан.
  prs.a2.unit35.lesson05.teach.travel_turn01:
    title: Нargес спрашивает о времени вылета
    gloss: Акбар, во сколько завтра вылетает самолёт?
    note: Наргес спрашивает о времени с помощью *ساعت چند*. *حرکت می‌کند* — настоящее время от *حرکت کردن* («отправляться»); вместе с *فردا* оно говорит о том, что произойдёт завтра.
  prs.a2.unit35.lesson05.teach.travel_turn02:
    title: Акбар называет время и первое действие
    gloss: В десять. Перед тем как поехать в аэропорт, я соберу чемодан.
    note: Акбар называет время, а затем говорит, что сделает сначала, с помощью оборота с *قبل از اینکه*. *بروم* — сослагательная форма, а *می‌بندم* — настоящее время со значением будущего.
  prs.a2.unit35.lesson05.teach.travel_turn03:
    title: Наргес спрашивает про билет
    gloss: У тебя есть билет?
    note: '*تکت داری؟* — дружеский вопрос к приятелю: *داری* — «у тебя есть», неформальная форма единственного числа.'
  prs.a2.unit35.lesson05.teach.travel_turn04:
    title: Акбар говорит, что билет у него есть
    gloss: Да, вчера я взял билет.
    note: '*گرفتم* — простое прошедшее: он взял билет вчера. *بلی* — «да».'
  prs.a2.unit35.lesson05.teach.travel_turn05:
    title: Наргес просит позвонить по приезде
    gloss: Когда приедешь в Герат, позвонишь мне?
    note: Оборот *وقتی که به هرات برسی* относится к будущему, поэтому глагол стоит в сослагательной форме *برسی* («ты приедешь»). *به من تیلفون می‌کنی؟* — «ты позвонишь мне?»
  prs.a2.unit35.lesson05.teach.travel_turn06:
    title: Акбар обещает
    gloss: Да. Когда приеду, позвоню.
    note: 'Акбар использует ту же модель: *وقتی که برسم* — сослагательная форма для «я», затем *تیلفون می‌کنم*.'
  prs.a2.unit35.lesson05.teach.message:
    title: Сообщение о приготовлении риса
    gloss: Привет, Акбар. Вчера я дома варила рис. Сначала я нарезала лук. После того как вода закипела, я положила соль и рис. Когда рис был готов, я его съела. Перед тем как лечь спать, я выпила чая.
    note: 'Короткое письменное сообщение, в котором все три союза помогают рассказать о действиях по порядку: *اول*, *بعد از اینکه*, *وقتی که* и *قبل از اینکه*.'
  prs.a2.unit35.lesson06.teach.work_my:
    title: Моя работа
    gloss: моя работа, моё дело
    note: '*کار* — «работа», *کارم* — «моя работа». *کارم را شروع می‌کنم* — «я начинаю работу».'
    example_gloss: Моя работа в офисе.
  prs.a2.unit35.lesson06.teach.morning_turn01:
    title: Насрин спрашивает, когда Юсуф встаёт
    gloss: Юсуф, во сколько ты встаёшь каждое утро?
    note: '*هر صبح* — «каждое утро». *چه وقت* — «когда», а *بیدار می‌شوی* — «ты просыпаешься, встаёшь» (другу).'
  prs.a2.unit35.lesson06.teach.morning_turn02:
    title: Юсуф называет время и первое действие
    gloss: В шесть. После того как я проснусь, я принимаю душ.
    note: 'Это привычка, поэтому после *بعد از اینکه* глаголы стоят в настоящем времени с *می‌*: *بیدار می‌شوم*, затем *دوش می‌گیرم*.'
  prs.a2.unit35.lesson06.teach.morning_turn03:
    title: Насрин спрашивает, что дальше
    gloss: Что ты делаешь после этого?
    note: '*بعد از آن* — «после этого». Это указывает на только что названное действие.'
  prs.a2.unit35.lesson06.teach.morning_turn04:
    title: Юсуф называет следующие действия
    gloss: Одеваюсь. Перед тем как пойти в офис, завтракаю.
    note: '*لباس می‌پوشم* — следующее действие. Затем оборот с *قبل از اینکه*: *بروم* — сослагательная форма, а *صبحانه می‌خورم* — главный глагол.'
  prs.a2.unit35.lesson06.teach.morning_turn05:
    title: Насрин спрашивает о времени выхода в офис
    gloss: Во сколько ты идёшь в офис?
    note: '*ساعت چند* спрашивает о времени, а *می‌روی* — «ты идёшь».'
  prs.a2.unit35.lesson06.teach.morning_turn06:
    title: Юсуф рассказывает, что делает в офисе
    gloss: В восемь. Когда прихожу, сначала начинаю работу.
    note: '*وقتی که می‌رسم* — «когда я прихожу» (привычка: каждый день), а *اول کارم را شروع می‌کنم* — «сначала я начинаю работу».'
  prs.a2.unit35.lesson06.teach.summary:
    title: Три союза вместе
    gloss: прежде чем я уйду; после того как я приехал; когда я приехал
    note: 'Три союза — три модели. *قبل از اینکه* + сослагательная форма (*بروم*): глагол имеет приставку *ب-*. *بعد از اینکه* + простое прошедшее (*رسیدم*) в рассказе или настоящее время для привычки (*بیدار می‌شوم*): первое действие уже завершено. *وقتی که* + простое прошедшее, настоящее или сослагательная форма: время глагола показывает, было ли это однократно, привычно или ещё предстоит. С существительным используется только *قبل از* или *بعد از*.'
