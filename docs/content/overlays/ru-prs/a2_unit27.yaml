course:
  title: Дари A2
  description: 'Дари Афганистана, ниже среднего уровня: как сказать, что ты собираешься делать в ближайшее время и что намерен сделать позже. Настоящее время с обозначением времени для планов (завтра, на следующей неделе, летом), می‌خواهم с сослагательным наклонением и تصمیم دارم для намерений; темы — отпуск, курсы и переезд.'
units:
  prs.a2.unit27.my_plans:
    title: Мои планы
lessons:
  prs.a2.unit27.lesson01.tomorrow_and_next_week:
    title: 'Завтра и на следующей неделе: настоящее время для планов'
  prs.a2.unit27.lesson02.everyone_and_holiday:
    title: 'Планы всех: лица, вопросы, отпуск'
  prs.a2.unit27.lesson03.i_want_to:
    title: 'Я хочу: намерения с می‌خواهم'
  prs.a2.unit27.lesson04.decisions_and_moving:
    title: Решения, курсы и переезд
  prs.a2.unit27.lesson05.reading_and_listening:
    title: Читаем и слушаем о планах
  prs.a2.unit27.lesson06.conversation_and_writing:
    title: Разговор о новом доме и письмо
teaching:
  prs.a2.unit27.lesson01.teach.names:
    title: Махтаб и Латиф
    gloss: Махтаб и Латиф — друзья.
    note: В этом разделе две подруги и друга, *مهتاب* (женщина) и *لطیف* (мужчина), рассказывают о своих планах. Они говорят друг с другом как друзья, поэтому используют *تو*.
  prs.a2.unit27.lesson01.teach.tomorrow:
    title: Завтра
    gloss: завтра
    note: '*فردا* — «завтра». Это слово о времени, которое ты будешь чаще всего использовать, говоря о плане.'
    example_gloss: Завтра я еду в Кабул.
  prs.a2.unit27.lesson01.teach.next_week:
    title: На следующей неделе
    gloss: на следующей неделе
    note: '*هفتهٔ آینده* — «на следующей неделе». *آینده* значит «будущий, следующий» и сочетается с другими словами о времени: *ماه آینده* (в следующем месяце), *سال آینده* (в следующем году).'
    example_gloss: На следующей неделе я еду в Герат.
  prs.a2.unit27.lesson01.teach.next_month:
    title: В следующем месяце
    gloss: в следующем месяце
    note: '*ماه آینده* — «в следующем месяце». Модель та же, что в *هفتهٔ آینده*.'
    example_gloss: В следующем месяце я еду в Мазар.
  prs.a2.unit27.lesson01.teach.next_year:
    title: В следующем году
    gloss: в следующем году
    note: '*سال آینده* — «в следующем году».'
    example_gloss: В следующем году я приезжаю в Кабул.
  prs.a2.unit27.lesson01.teach.summer:
    title: Лето
    gloss: лето, летом
    note: '*تابستان* — «лето». Оно же значит «летом»: отдельное слово для «в» не нужно.'
    example_gloss: Летом я еду в Бамиан.
  prs.a2.unit27.lesson01.teach.plan:
    title: План
    gloss: план, программа
    note: '*برنامه* — «план». *برنامه دارم* — «у меня есть план»; так обычно говорят о своих планах.'
    example_gloss: У меня есть план на лето.
  prs.a2.unit27.lesson01.teach.rule:
    title: Настоящее время с обозначением времени выражает план
    gloss: Завтра я еду. На следующей неделе я еду. Летом я еду.
    note: 'В дари нет отдельного повседневного слова для будущего времени. Чтобы говорить о плане, используют обычное настоящее время — *می‌* и основу настоящего времени — и добавляют слово о времени, указывающее на будущее: *فردا می‌روم* — «завтра я еду», *هفتهٔ آینده می‌روم* — «на следующей неделе я еду». Именно слово о времени показывает собеседнику, что план относится к будущему. Без него *می‌روم* значит просто «я иду / еду» сейчас. В русском в таких случаях тоже часто можно использовать настоящее время («завтра еду»), и по-русски можно сказать и «поеду». Порядок слов свободный: слово о времени обычно стоит в начале, но *به هرات فردا می‌روم* тоже верно.'
  prs.a2.unit27.lesson01.teach.paradigm:
    title: Настоящее время глагола رفتن для всех лиц
    gloss: я иду, ты идёшь, он/она идёт, мы идём, вы идёте (вежливо или мн. ч.), они идут
    note: 'Настоящее время образуется с приставкой *می‌* (пишется с полупробелом), основой настоящего времени *رو* и личным окончанием: *می‌روم* (я), *می‌روی* (ты, друг), *می‌رود* (он, она), *می‌رویم* (мы), *می‌روین* (вы, вежливая форма или мн. число), *می‌روند* (они). Местоимение необязательно, потому что окончание уже показывает лицо. В этом курсе окончание 2-го лица мн. числа — *-ین*.'
  prs.a2.unit27.lesson01.teach.sentence:
    title: Завтра я еду в Герат
    gloss: Завтра я еду в Герат.
    note: 'Это основная модель урока: слово со значением времени, затем место с *به*, затем глагол в настоящем времени в конце.'
  prs.a2.unit27.lesson02.teach.holiday:
    title: Отпуск
    gloss: отпуск, каникулы, выходные
    note: '*رخصتی* — это отпуск или свободное от работы или учёбы время. Это афганское слово, которое ты услышишь чаще всего.'
    example_gloss: В отпуск я еду в Герат.
  prs.a2.unit27.lesson02.teach.travel:
    title: Путешествовать
    gloss: путешествовать, ездить в поездку
    note: '*سفر کردن* значит «путешествовать». Куда — говорится с *به*: *به بامیان سفر می‌کنم* — «я еду в Бамиан». Окончание присоединяется к *کردن*, поэтому глагол изменяется, как любой глагол в настоящем времени: *سفر می‌کنم، سفر می‌کنی، سفر می‌کند*.'
    example_gloss: В отпуск он (она) едет в Бамиан.
  prs.a2.unit27.lesson02.teach.hotel:
    title: Забронировать отель
    gloss: бронировать отель
    note: '*رزرو کردن* значит «бронировать», а *هوتل* — «отель». Бронирование — типичный план, поэтому подходит настоящее время со словом о времени: *فردا هوتل رزرو می‌کنم*.'
    example_gloss: Завтра я бронирую отель.
  prs.a2.unit27.lesson02.teach.buy:
    title: Покупать
    gloss: покупать
    note: '*خریدن* значит «покупать». Основа настоящего времени — *خر*: *می‌خرم، می‌خری، می‌خرد*.'
    example_gloss: Завтра я покупаю фрукты.
  prs.a2.unit27.lesson02.teach.more_verbs:
    title: Настоящее время глагола آمدن
    gloss: я прихожу, ты приходишь, он/она приходит, мы приходим, вы приходите (вежливая форма или мн. число), они приходят
    note: 'Основа настоящего времени глагола *آمدن* — *آی*, поэтому он спрягается так: *می‌آیم، می‌آیی، می‌آید، می‌آییم، می‌آیین، می‌آیند*. Те же окончания у всех глаголов: *می‌مانم* (я остаюсь), *می‌گیرم* (я беру), *می‌خرم* (я покупаю), *می‌کنم* (я делаю). Любая из этих форм может выражать план, если добавить слово о времени: *هفتهٔ آینده می‌آیم* — «на следующей неделе я приду».'
  prs.a2.unit27.lesson02.teach.negative:
    title: 'Отрицание: نمی‌ для всех лиц'
    gloss: я не иду, ты не идёшь, он/она не идёт, мы не идём, вы не идёте, они не идут
    note: 'Чтобы сказать, что ты чего-то не собираешься делать, поставь *ن* перед *می‌*: *می‌روم* превращается в *نمی‌روم*. Окончания остаются теми же. *جمعه به مکتب نمی‌روم* — «в пятницу я не иду в школу». Не забывай про полупробел между *نمی‌* и основой.'
  prs.a2.unit27.lesson02.teach.questions:
    title: Вопросы о планах
    gloss: Что ты делаешь завтра? Куда ты едешь на следующей неделе? С кем ты едешь?
    note: 'О плане спрашивают тем же настоящим временем: *فردا چه می‌کنی؟* — «что ты делаешь завтра?», *کجا می‌روی؟* — «куда ты идёшь?», *با کی می‌روی؟* — «с кем ты идёшь?». Ответ тоже в настоящем времени, так что для разговора о планах новая форма глагола не нужна.'
  prs.a2.unit27.lesson02.teach.stay:
    title: Я останусь там на неделю
    gloss: Я остаюсь там на неделю.
    note: '*می‌مانم* значит «я остаюсь». Срок, например *یک هفته*, ставится перед глаголом, и отдельного слова для «на» не нужно.'
  prs.a2.unit27.lesson03.teach.pattern:
    title: 'Намерение: می‌خواهم и сослагательное наклонение'
    gloss: Я хочу поехать в Герат. Я хочу прийти. Я хочу купить книгу.
    note: 'Чтобы сказать, что ты намерен или хочешь сделать, используй *می‌خواهم* («я хочу») и второй глагол в сослагательном наклонении: *می‌خواهم بروم* — «я хочу пойти». В дари, как и в русском, после «хочу» может стоять другой глагол, но не инфинитив, а личная форма с окончанием: *می‌خواهم بروم* буквально «хочу, чтобы я пошёл». Оба глагола стоят в одном лице: می‌خواهم بروم (я хочу пойти), *می‌خواهیم برویم* (мы хотим пойти). Не ставь инфинитив после *می‌خواهم*. Слово *که* здесь не нужно.'
  prs.a2.unit27.lesson03.teach.subjunctive:
    title: 'Сослагательное наклонение: بـ и основа настоящего времени'
    gloss: чтобы я пошёл, чтобы ты пошёл, чтобы он/она пошёл(а), чтобы мы пошли, чтобы вы пошли, чтобы они пошли
    note: 'Сослагательное наклонение образуется из *بـ*, основы настоящего времени и тех же окончаний, что и в настоящем времени: от *رو* получаем *بروم، بروی، برود، برویم، بروین، بروند*. Другие глаголы: *بخرم* (чтобы я купил), *بگیرم* (чтобы я взял), *بمانم* (чтобы я остался), *بخورم* (чтобы я поел). *آمدن* — исключение: *بیایم* (чтобы я пришёл). Ты встретишь эту форму после *می‌خواهم*, а также после *باید*.'
  prs.a2.unit27.lesson03.teach.want_paradigm:
    title: Настоящее время глагола خواستن
    gloss: я хочу, ты хочешь, он/она хочет, мы хотим, вы хотите (вежливая форма или мн. число), они хотят
    note: 'У глагола *خواستن* основа настоящего времени — *خواه*: *می‌خواهم، می‌خواهی، می‌خواهد، می‌خواهیم، می‌خواهین، می‌خواهند*. Второй глагол стоит в том же лице: *او می‌خواهد برود* (он или она хочет пойти), *ما می‌خواهیم برویم* (мы хотим пойти).'
  prs.a2.unit27.lesson03.teach.want_negative:
    title: Я не хочу
    gloss: Я не хочу идти. Мы не хотим приходить.
    note: 'Поставь *ن* перед *می‌خواهم*, чтобы сказать «не хочу»: *نمی‌خواهم بروم* — «я не хочу идти». Второй глагол остаётся в сослагательном наклонении и второго отрицания не получает.'
  prs.a2.unit27.lesson03.teach.plan_vs_intention:
    title: План и намерение
    gloss: Завтра я еду в Герат. Я хочу поехать в Герат.
    note: 'Сравни две фразы. *فردا به هرات می‌روم* — это план: он решён, указано время, используется настоящее время. *می‌خواهم به هرات بروم* — это намерение или желание: ты этого хочешь, но ещё ничего не решено, поэтому точного времени часто нет. Когда есть время и всё организовано, говори как о плане. Когда ты только хочешь, говори *می‌خواهم*.'
  prs.a2.unit27.lesson03.teach.course:
    title: Курс
    gloss: курс, занятия
    note: '*کورس* — это курс, например языковой или компьютерный. «Записаться на курс» говорится с *گرفتن*: *کورس گرفتن* — «проходить курс».'
    example_gloss: Я хочу пройти курс английского.
  prs.a2.unit27.lesson03.teach.start:
    title: Начинаться
    gloss: начинаться
    note: '*شروع شدن* значит «начинаться». Так говорят о том, что начинается: курс, собрание, урок. *شروع می‌شود* — «начинается». Со словом о времени это тоже план.'
    example_gloss: Курс начинается на следующей неделе.
  prs.a2.unit27.lesson03.teach.university:
    title: Университет
    gloss: университет
    note: '*پوهنتون* — это университет. Это афганское слово; куда идёшь — говорится с *به*.'
    example_gloss: Я хочу поступить в университет.
  prs.a2.unit27.lesson04.teach.move:
    title: Переехать на другую квартиру
    gloss: переезжать, менять жильё
    note: '*عوض کردن* значит «менять», поэтому *خانه عوض کردن* — «переезжать на другое жильё». Правильно и *خانه را عوض می‌کنم*. Окончание присоединяется к *کردن*: *خانه عوض می‌کنم، خانه عوض می‌کنی*.'
    example_gloss: В следующем месяце я переезжаю.
  prs.a2.unit27.lesson04.teach.rent:
    title: Снимать (в аренду)
    gloss: снимать (дом, жильё)
    note: '*کرایه* — это арендная плата. *کرایه گرفتن* — «снимать дом для себя», например *یک خانه کرایه می‌گیرم*. После *می‌خواهم* второй глагол — *بگیرم*.'
    example_gloss: Я хочу снять новый дом.
  prs.a2.unit27.lesson04.teach.near:
    title: Близко
    gloss: близко, рядом
    note: '*نزدیک* значит «близко». Что рядом — говорится сразу после него: *نزدیک مکتب* — «рядом со школой».'
    example_gloss: Новый дом рядом со школой.
  prs.a2.unit27.lesson04.teach.decide:
    title: 'تصمیم دارم: я решил(а)'
    gloss: Я намерен(на) поступить в университет в следующем году.
    note: '*تصمیم دارم* значит «я решил(а)», «я намерен (намерена)». Это немного сильнее, чем *می‌خواهم*: ты уже обдумал(а) это. Как и после *می‌خواهم*, дальше стоит сослагательное наклонение: *تصمیم دارم بروم* — «я решил пойти». Ты уже знаешь *قصد دارم* из урока об отпуске: оно значит то же самое и тоже подходит. Глагол в сослагательном наклонении стоит в конце предложения, после слова о времени и места.'
  prs.a2.unit27.lesson04.teach.written_future:
    title: 'Книжное будущее время: خواهم رفت'
    gloss: Завтра я поеду в Герат. (письменная форма)
    note: 'В объявлениях, новостях и официальных текстах ты увидишь *خواهم رفت*, *خواهد رفت*, *خواهیم رفت*: *خواه-* с окончанием и затем основа прошедшего времени *رفت*. Это значит «поеду, пойду». Её нужно только узнавать. В разговоре используй настоящее время со словом о времени: *فردا به هرات می‌روم*.'
  prs.a2.unit27.lesson04.teach.because:
    title: Потому что мой дом маленький
    gloss: Потому что мой дом маленький.
    note: '*چون* значит «потому что». После него идёт короткая причина, здесь со связкой *است*.'
  prs.a2.unit27.lesson05.teach.morning:
    title: Утро
    gloss: утро, утром
    note: '*صبح* — это утро. *فردا صبح* — «завтра утром».'
    example_gloss: Завтра утром я еду в Бамиан.
  prs.a2.unit27.lesson05.teach.holiday_turn01:
    title: Махтаб спрашивает об отпуске
    gloss: Латиф, у тебя есть планы на отпуск?
    note: Махтаб спрашивает Латифа о планах на отпуск. *برنامه داری؟* — «у тебя есть планы?»; она говорит ему «ты» (*تو*), потому что он её друг.
  prs.a2.unit27.lesson05.teach.holiday_turn02:
    title: Латиф рассказывает о своих планах
    gloss: Да. На следующей неделе я еду в Герат. Я останусь там на неделю.
    note: 'Латиф отвечает *بلی* («да»). В его плане есть слово о времени *هفتهٔ آینده* и настоящее время: *می‌روم*. *یک هفته آنجا می‌مانم* — второй план, тоже в настоящем времени.'
  prs.a2.unit27.lesson05.teach.holiday_turn03:
    title: Махтаб спрашивает о том, что будет потом
    gloss: Как хорошо! А что ты будешь делать после этого?
    note: '*بعد از آن* значит «после этого». Вопрос стоит в настоящем времени, как всегда, когда речь о плане.'
  prs.a2.unit27.lesson05.teach.holiday_turn04:
    title: Латиф говорит, чего он хочет
    gloss: Я хочу пройти курс английского.
    note: 'У Латифа нет точной даты, поэтому он говорит о намерении: *می‌خواهم* и сослагательное наклонение *بگیرم*.'
  prs.a2.unit27.lesson05.teach.holiday_turn05:
    title: Махтаб спрашивает, когда начинается курс
    gloss: Здорово! Когда начинается курс?
    note: '*کورس کی شروع می‌شود؟* — «когда начинается курс?». Настоящее время *شروع می‌شود* говорит о дате в будущем.'
  prs.a2.unit27.lesson05.teach.holiday_turn06:
    title: Латиф называет месяц
    gloss: Со следующего месяца.
    note: '*از ماه آینده* — «со следующего месяца». Достаточно короткого ответа.'
  prs.a2.unit27.lesson05.teach.message:
    title: Сообщение о планах
    gloss: Привет, Махтаб. Завтра утром я еду в Бамиан и останусь там на два дня. На следующей неделе я работаю в офисе. В следующем году я намерен поступить в университет.
    note: Короткое письменное сообщение. В нём есть план на завтра, план на следующую неделю и намерение на следующий год. Все планы выражены настоящим временем со словом о времени, а для намерения используется *تصمیم دارم* и сослагательное наклонение.
  prs.a2.unit27.lesson06.teach.help:
    title: Помогать
    gloss: помогать
    note: '*کمک* — это помощь. *کمک کردن* значит «помогать»: *فردا کمک می‌کنم* — «завтра я помогу». Окончание присоединяется к *کردن*.'
    example_gloss: Завтра я помогаю своему другу.
  prs.a2.unit27.lesson06.teach.house_turn01:
    title: Латиф спрашивает о следующем месяце
    gloss: Махтаб, что ты делаешь в следующем месяце?
    note: 'Латиф спрашивает о плане: слово о времени *ماه آینده* и настоящее время.'
  prs.a2.unit27.lesson06.teach.house_turn02:
    title: Махтаб рассказывает о своём плане
    gloss: В следующем месяце я переезжаю.
    note: '*خانه عوض می‌کنم* — «я переезжаю». Это план, поэтому используется настоящее время со словом о времени.'
  prs.a2.unit27.lesson06.teach.house_turn03:
    title: Латиф спрашивает почему
    gloss: Почему?
    note: '*چرا؟* значит «почему?». Вопрос из одного слова естественен в разговоре между друзьями.'
  prs.a2.unit27.lesson06.teach.house_turn04:
    title: Махтаб объясняет
    gloss: Потому что мой дом маленький. Я хочу снять новый дом рядом со школой.
    note: '*چون* вводит причину со связкой *است*. Затем идёт намерение: *می‌خواهم* и сослагательное наклонение *بگیرم*, потому что дом она ещё не нашла.'
  prs.a2.unit27.lesson06.teach.house_turn05:
    title: Латиф предлагает помощь
    gloss: Хорошо! Завтра я приду и помогу.
    note: 'Латиф строит план прямо на ходу, со словом *فردا* и настоящим временем: *می‌آیم* и *کمک می‌کنم*. *کمک کردن* значит «помогать».'
  prs.a2.unit27.lesson06.teach.house_turn06:
    title: Махтаб благодарит его
    gloss: Спасибо!
    note: '*تشکر!* — короткий способ поблагодарить друга.'
