    - value: لطفاً میز را به اتاق ببرین.
      status: correct
    - value: این میز را به اتاق ببرین، لطفاً.
      status: correct
    - value: میز را به اتاق ببرین، لطفاً.
      status: correct
    - value: لطفاً این میز را به اتاق ببرید.
      status: correct
    - value: لطفاً میز را به اتاق ببرید.
      status: correct
    - value: این میز را به اتاق ببرید، لطفاً.
      status: correct
    - value: میز را به اتاق ببرید، لطفاً.
      status: correct
    feedback: '*لطفاً این میز را به اتاق ببرین.* Стол получает *را*, а *به اتاق* указывает, куда его нужно отнести.'
  prs.a2.unit31.lesson03.exercise01.recognize_bag_offer:
    instruction: Что имеет в виду продавец?
    correct_option: Дать вам ещё и пакет?
    distractors:
    - Дайте мне, пожалуйста, ещё и пакет
    - Я дал вам пакет
    - Где пакет?
    accepted_answers:
    - value: Дать вам ещё и пакет?
      status: correct
    feedback: '*بدهم* оканчивается на *-م*, значит, продавец предлагает: «Дать?»'
  prs.a2.unit31.lesson03.exercise02.accept_tea:
    instruction: 'Кто-то спрашивает: چای بیاورم؟ (Принести чаю?) Какой ответ принимает предложение?'
    correct_option: بلی، لطفاً.
    distractors:
    - نه، تشکر.
    - لازم نیست.
    - خودم می‌کنم.
    accepted_answers:
    - value: بلی، لطفاً.
      status: correct
    feedback: '*بلی، لطفاً.* — это согласие. Остальные три ответа — отказ.'
  prs.a2.unit31.lesson03.exercise03.match_offers_replies:
    instruction: Соотнеси каждое предложение или ответ с его значением.
    accepted_answers:
    - value:
        کمک کنم؟: Помочь вам?
        چای بیاورم؟: Принести чай?
        کیسه هم بدهم؟: Дать ещё и пакет?
        بلی، لطفاً.: Да, пожалуйста.
        بلی، تشکر. لطف می‌کنین.: Да, спасибо. Это очень любезно с вашей стороны.
        نه، تشکر.: Нет, спасибо.
        لازم نیست.: Не нужно.
        خودم می‌کنم.: Я сделаю это сам.
      status: correct
    feedback: Три предложения оканчиваются на *-م*. Первые два ответа — согласие, последние три — вежливый отказ.
    pairs:
    - left: کمک کنم؟
      right: Помочь вам?
    - left: چای بیاورم؟
      right: Принести чай?
    - left: کیسه هم بدهم؟
      right: Дать ещё и пакет?
    - left: بلی، لطفاً.
      right: Да, пожалуйста.
    - left: بلی، تشکر. لطف می‌کنین.
      right: Да, спасибо. Это очень любезно с вашей стороны.
    - left: نه، تشکر.
      right: Нет, спасибо.
    - left: لازم نیست.
      right: Не нужно.
    - left: خودم می‌کنم.
      right: Я сделаю это сам.
  prs.a2.unit31.lesson03.exercise04.order_tea:
    instruction: 'Расставь слова, чтобы сказать: Принести ещё и чаю?'
    accepted_answers:
    - value:
      - چای
      - هم
      - بیاورم
      status: correct
    feedback: '*چای هم بیاورم؟* — предложение принести чай.'
  prs.a2.unit31.lesson03.exercise05.complete_bag_offer:
    instruction: 'Закончи предложение продавца: Дать вам ещё и пакет?'
    accepted_answers:
    - value: بدهم
      status: correct
    feedback: '*بدهم* — форма на *-م* от *دادن*, она используется для предложения: *کیسه هم بدهم؟*'
  prs.a2.unit31.lesson03.exercise06.decline_bag:
    instruction: 'Продавец предлагает вам пакет. Вежливо откажитесь на дари: Нет, спасибо.'
    accepted_answers:
    - value: نه، تشکر.
      status: correct
    - value: نه، تشکر. لازم نیست.
      status: correct
    - value: لازم نیست.
      status: correct
    - value: نه، لازم نیست.
      status: correct
    - value: نه، تشکر، کیسه دارم.
      status: correct
    - value: نه، تشکر. کیسه دارم.
      status: correct
    - value: نه، خودم دارم.
      status: correct
    - value: خودم کیسه دارم.
      status: correct
    - value: نه، تشکر. خودم دارم.
      status: correct
    feedback: 'Продавец говорит: کیسه هم بدهم؟ Вежливый отказ — *نه، تشکر.* Можно добавить *لازم نیست.*'
  prs.a2.unit31.lesson03.exercise07.write_offer:
    instruction: 'Напиши на дари соседу: Хотите, я помогу?'
    accepted_answers:
    - value: می‌خواهین که کمک کنم؟
      status: correct
    - value: می‌خواهین کمک کنم؟
      status: correct
    - value: کمک کنم؟
      status: correct
    feedback: '*می‌خواهین که کمک کنم؟* *کنم* оканчивается на *-م*, потому что помогать буду я. *که* необязательно.'
  prs.a2.unit31.lesson04.exercise01.recognize_not_late:
    instruction: Что означает это предложение?
    correct_option: Пожалуйста, не опаздывайте
    distractors:
    - Пожалуйста, приходите пораньше
    - Пожалуйста, подождите здесь
    - Я не опоздаю
    accepted_answers:
    - value: Пожалуйста, не опаздывайте
      status: correct
    feedback: '*نکنین* — отрицательная команда, поэтому *دیر نکنین* значит «не опаздывайте».'
  prs.a2.unit31.lesson04.exercise02.neg_of_come:
    instruction: Какая форма — правильное отрицание к بیایین (приходите, вежливо)?
    correct_option: نیایین
    distractors:
    - نبیایین
    - نمی‌آیین
    - بیایین نه
    accepted_answers:
