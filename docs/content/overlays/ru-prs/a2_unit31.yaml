course:
  title: Дари A2
  description: 'Дари Афганистана, уровень ниже среднего: вежливые просьбы с می‌شود که и لطفاً, предложение помощи, вежливое согласие и отказ, а также просьба не делать что-либо с помощью отрицательного повелительного наклонения (نکنین).'
units:
  prs.a2.unit31.polite_requests:
    title: Не могли бы вы...? Вежливые просьбы и предложения
lessons:
  prs.a2.unit31.lesson01.polite_request:
    title: Не могли бы вы...? Вежливые просьбы
  prs.a2.unit31.lesson02.please_and_commands:
    title: «Пожалуйста» и повелительное наклонение
  prs.a2.unit31.lesson03.offers_and_replies:
    title: Предложить помощь, согласиться и отказаться
  prs.a2.unit31.lesson04.dont:
    title: 'Не...: отрицательное повелительное наклонение'
  prs.a2.unit31.lesson05.reading_and_listening:
    title: Читаем и слушаем про соседа
  prs.a2.unit31.lesson06.shop_call:
    title: Телефонный звонок в магазин
teaching:
  prs.a2.unit31.lesson01.teach.neighbour:
    title: Сосед
    gloss: сосед
    note: '*همسایه* — это сосед. Соседи часто просят друг друга о небольших услугах, так что именно к ним вы будете обращаться с вежливыми просьбами в первую очередь.'
    example_gloss: Наш сосед очень хороший.
  prs.a2.unit31.lesson01.teach.shopkeeper:
    title: Продавец
    gloss: владелец магазина, продавец
    note: '*دوکاندار* — это человек, который работает в *دوکان* (магазин). Вы просите у *دوکاندار* то, что вам нужно, а он (или она) может предложить вам что-то ещё.'
    example_gloss: Продавец в магазине.
  prs.a2.unit31.lesson01.teach.milk:
    title: Молоко
    gloss: молоко
    note: '*شیر* — это молоко. Его часто просят в магазине, как и *نان* (хлеб).'
    example_gloss: Я пью молоко каждый день.
  prs.a2.unit31.lesson01.teach.bag:
    title: Сумка
    gloss: пакет, сумка-пакет
    note: '*کیسه* — это пакет, например тот, в который продавец кладёт ваши покупки.'
    example_gloss: Я купил(а) пакет хлеба.
  prs.a2.unit31.lesson01.teach.frame:
    title: 'Вежливая просьба: می‌شود که ...؟'
    gloss: 'Не могли бы вы дать мне немного хлеба? (букв.: Возможно ли, чтобы вы дали немного хлеба?)'
    note: 'Чтобы вежливо о чём-то попросить, начните с *می‌شود که* (возможно ли, чтобы) и поставьте глагол в сослагательное наклонение (конъюнктив): *می‌شود که کمی نان بدهین؟* Глагол после *که* имеет ту же форму, что и после *باید*, и оканчивается на *-ین*, когда вы вежливо обращаетесь к одному человеку или говорите с несколькими (*شما*). Просьба — это вопрос, поэтому предложение заканчивается знаком *؟*. В разговорной речи есть более короткий вариант без *که*: *می‌شود کمی نان بدهین؟*. Можно также спросить с *می‌توانین*: *می‌توانین کمی نان بدهین؟*'
  prs.a2.unit31.lesson01.teach.subj:
    title: Сослагательное наклонение глагола دادن
    gloss: чтобы я дал, чтобы ты дал, чтобы он/она дал(а), чтобы мы дали, чтобы вы дали (вежливо или мн. ч.), чтобы они дали
    note: 'Сослагательное наклонение образуется из *ب*, основы настоящего времени и окончаний *-م، -ی، -د، -یم، -ین، -ند*. У глагола *دادن* основа — *ده*, поэтому получаются формы *بدهم، بدهی، بدهد، بدهیم، بدهین، بدهند*. Для просьбы к соседу или продавцу нужна форма на *-ین*: *بدهین*.'
  prs.a2.unit31.lesson01.teach.subj_more:
    title: Просьбы с другими глаголами
    gloss: дать, принести, отправить, взять/получить, унести, сказать, сделать
    note: 'Ставьте ту же форму на *-ین* после *می‌شود که* с любым глаголом: *بیاورین* (принести), *بفرستین* (отправить), *بگیرین* (получить), *ببرین* (отнести что-либо куда-либо), *بگویین* (сказать) и *کنین* (сделать). Глаголы, образованные с *کردن*, после первого слова используют *کنین*: *کمک کنین* (помочь), *صبر کنین* (подождать), *تیلفون کنین* (позвонить), *باز کنین* (открыть).'
  prs.a2.unit31.lesson01.teach.help_req:
    title: Не могли бы вы помочь?
    gloss: Не могли бы вы помочь?
    note: '*می‌شود که کمک کنین؟* — обычный способ попросить соседа о помощи. Если вы плохо знаете человека, начните с *ببخشین* (извините).'
  prs.a2.unit31.lesson01.teach.bag_req:
    title: Извините, не могли бы вы дать мне пакет?
    gloss: Извините, не могли бы вы дать мне пакет?
    note: '*ببخشین* — вежливое начало фразы, а не настоящее извинение. Дальше идёт сама просьба: *می‌شود که یک کیسه بدهین؟*'
  prs.a2.unit31.lesson01.teach.yes_sure:
    title: Да, конечно
    gloss: Да, конечно.
    note: '*بلی، حتماً.* — вежливое «да» в ответ на просьбу. *البته.* (конечно) означает то же самое.'
  prs.a2.unit31.lesson02.teach.table:
    title: Стол
    gloss: стол
    note: '*میز* — это стол. Возможно, вам понадобится помощь, чтобы его отнести или передвинуть.'
    example_gloss: Стол в комнате.
  prs.a2.unit31.lesson02.teach.here:
    title: Здесь
    gloss: здесь
    note: '*اینجا* значит «здесь, в этом месте». Противоположное слово — *آنجا* (там).'
    example_gloss: Ключ здесь.
  prs.a2.unit31.lesson02.teach.imp_pl:
    title: Вежливое повелительное наклонение с -ین
    gloss: приходите, идите, дайте, скажите, возьмите, принесите, сделайте (соседу или нескольким людям)
    note: 'Приказ или просьба к *شما* (соседу, пожилому человеку или нескольким людям) оканчивается на *-ین*: *بیایین* (приходите), *بروین* (идите), *بدهین* (дайте), *بگویین* (скажите), *بگیرین* (возьмите), *بیاورین* (принесите), *کنین* (сделайте). Это та же форма, что и сослагательное наклонение после *می‌شود که*.'
  prs.a2.unit31.lesson02.teach.imp_sg:
    title: Повелительное наклонение для друга (без окончания)
    gloss: приходи, иди, дай, скажи, возьми, принеси, сделай (другу или ребёнку)
    note: 'К одному другу или ребёнку обращайтесь без *-ین*: *بیا، برو، بده، بگو، بگیر، بیاور، کن*. Эта голая форма сама по себе звучит резко, поэтому используйте её только с теми, кому говорите *تو*. Соседу или продавцу всегда говорите в форме на *-ین*.'
  prs.a2.unit31.lesson02.teach.imp_rule:
    title: Как образуется повелительное наклонение
    gloss: 'Схема: б + основа настоящего времени'
    note: 'Повелительное наклонение — это *ب* плюс основа настоящего времени (*رو، ده، گو، گیر*), а для *شما* добавляется *-ین*. У глагола *کردن* нет *ب* (*کن، کنین*), а у *آمدن* формы *بیا، بیایین*. Глагол *آوردن*: *بیاور* для друга и *بیاورین* в вежливой форме.'
  prs.a2.unit31.lesson02.teach.please_wait:
    title: Пожалуйста, подождите немного
    gloss: Пожалуйста, подождите немного.
    note: '*لطفاً* (пожалуйста) ставится в начале приказа и делает его вежливым: *لطفاً کمی صبر کنین.*'
  prs.a2.unit31.lesson02.teach.please_bring:
    title: Пожалуйста, принесите пакет
    gloss: Пожалуйста, принесите пакет.
    note: 'Дополнение стоит перед глаголом и принимает *را*, если речь о конкретном предмете: *کیسه را بیاورین*.'
  prs.a2.unit31.lesson02.teach.please_table:
    title: Пожалуйста, отнесите этот стол в комнату
    gloss: Пожалуйста, отнесите этот стол в комнату.
    note: '*ببرین* значит «отнести что-либо куда-либо». *به اتاق* указывает, куда.'
  prs.a2.unit31.lesson02.teach.two_ways:
    title: Два способа попросить
    gloss: Пожалуйста, откройте калитку. / Извините, не могли бы вы открыть калитку?
    note: '*لطفاً* с повелительным наклонением — короткий и прямой вариант; он подходит, когда от человека ожидают, что он это сделает, например от продавца. *می‌شود که ...؟* звучит мягче и лучше подходит для просьбы к соседу. Оба варианта вежливы.'
  prs.a2.unit31.lesson03.teach.offer_forms:
    title: 'Предложение помощи: глагол с -م'
    gloss: Помочь вам? Принести чай? Дать ещё и пакет? Отправить ещё и чай?
    note: 'Чтобы что-то предложить, задайте вопрос с формой сослагательного наклонения для *من*: *کنم* (чтобы я сделал), *بیاورم* (чтобы я принёс), *بدهم* (чтобы я дал), *بفرستم* (чтобы я отправил). *کمک کنم؟* значит «Помочь вам?». Можно добавить *هم* (тоже, ещё): *کیسه هم بدهم؟*'
  prs.a2.unit31.lesson03.teach.want_that:
    title: Хотите, чтобы я помог?
    gloss: Хотите, чтобы я помог?
    note: '*می‌خواهین که ...؟* — ещё один способ предложить помощь. Так вы спрашиваете, хочет ли собеседник этого, а глагол после *که* снова стоит в форме на *-م*.'
  prs.a2.unit31.lesson03.teach.offer_vs_request:
    title: Предложение или просьба?
    gloss: Принести чай? / Пожалуйста, принесите чай.
    note: 'Окончание показывает, кто совершает действие. *بیاورم* (я принесу) — предложение: я сделаю это для вас. *بیاورین* (вы принесите) — просьба: вы сделайте это для меня. Поэтому *کیسه هم بدهم؟* говорит продавец, предлагая пакет, а *کیسه بدهین* говорит покупатель, прося его.'
  prs.a2.unit31.lesson03.teach.sugar:
    title: Сахар
    gloss: сахар
    note: '*قند* — это сахар. В Афганистане чай пьют и с *قند*, и без него.'
    example_gloss: Чай с сахаром — это хорошо.
  prs.a2.unit31.lesson03.teach.kindness:
    title: Любезность
    gloss: любезность, одолжение
    note: '*لطف* — это любезность, доброта. *لطف می‌کنین* — вежливая благодарность: вы очень любезны.'
    example_gloss: Спасибо за вашу любезность.
  prs.a2.unit31.lesson03.teach.self:
    title: Сам
    gloss: сам, сама, самостоятельно
    note: '*خودم* значит «я сам(а)». *خودم می‌کنم* — «я сделаю это сам(а)».'
    example_gloss: Я сам(а) сделаю эту работу.
  prs.a2.unit31.lesson03.teach.yes_please:
    title: Да, пожалуйста
    gloss: Да, пожалуйста.
    note: Так принимают предложение. После *بلی* можно добавить *تشکر*.
  prs.a2.unit31.lesson03.teach.yes_kind:
    title: Да, спасибо, это любезно
    gloss: Да, спасибо. Это очень любезно с вашей стороны.
    note: Более тёплый способ согласиться. *لطف می‌کنین* означает, что собеседник проявляет любезность.
  prs.a2.unit31.lesson03.teach.no_thanks:
    title: Нет, спасибо
    gloss: Нет, спасибо.
    note: 'Самый простой вежливый отказ. Всегда добавляйте *تشکر*: просто *نه* звучит резко.'
  prs.a2.unit31.lesson03.teach.no_need:
    title: Не нужно
    gloss: Не нужно.
    note: '*لازم نیست* значит «не нужно». Так можно любезно отказаться от предложения. Можно сказать *نه، تشکر. لازم نیست.* или *خودم می‌کنم.*'
  prs.a2.unit31.lesson04.teach.neg_pl:
    title: 'Не...: отрицательное повелительное наклонение с نـ'
    gloss: не делайте, не ходите, не говорите, не давайте, не берите, не приходите
    note: 'Чтобы сказать «не», поставьте *نـ* вместо *بـ*: *بروین* становится *نروین*, *بگویین* — *نگویین*, *بدهین* — *ندهین*, *بگیرین* — *نگیرین*. У *کنین* нет *بـ*, поэтому *نـ* просто ставится перед ним: *نکنین*. Особый случай — *بیایین*: оно превращается в *نیایین*.'
  prs.a2.unit31.lesson04.teach.neg_sg:
    title: Отрицательное повелительное наклонение для друга
    gloss: не делай, не ходи, не говори, не давай, не приходи, не бери
    note: 'Другу можно сказать то же самое без окончания: *نکن، نرو، نگو، نده، نیا، نگیر*. Одно *نکن* звучит резко, поэтому его говорят только друзьям и детям. Соседу всегда говори *نکنین* и добавляй *لطفاً*.'
  prs.a2.unit31.lesson04.teach.leave:
    title: 'Положить, оставить: بگذارین и نگذارین'
    gloss: положи/оставь, положите/оставьте; не клади/не оставляй, не кладите/не оставляйте
    note: '*گذاشتن* значит «положить» или «оставить» что-либо где-либо. *دروازه را باز بگذارین* — «оставьте ворота открытыми», *دروازه را باز نگذارین* — «не оставляйте ворота открытыми».'
  prs.a2.unit31.lesson04.teach.dont_late:
    title: Пожалуйста, не опаздывайте
    gloss: Пожалуйста, не опаздывайте.
    note: '*دیر کردن* значит «опаздывать» или «задерживаться». *لطفاً دیر نکنین* — вежливое напоминание перед тем, как кто-то должен что-то принести или прислать.'
  prs.a2.unit31.lesson04.teach.dont_go:
    title: Пожалуйста, не ходите завтра
    gloss: Пожалуйста, не ходите завтра.
    note: '*لطفاً* с отрицательной командой — вежливая просьба не делать что-либо.'
  prs.a2.unit31.lesson04.teach.dont_come_late:
    title: Пожалуйста, не приходите поздно
    gloss: Пожалуйста, не приходите поздно.
    note: '*نیایین* — отрицательная форма от *بیایین* («приходите»).'
  prs.a2.unit31.lesson04.teach.gate_open:
    title: Пожалуйста, не оставляйте калитку открытой
    gloss: Пожалуйста, не оставляйте ворота открытыми.
    note: Типичная просьба к соседу или посетителю магазина.
  prs.a2.unit31.lesson04.teach.park:
    title: Пожалуйста, не оставляйте здесь машину
    gloss: Пожалуйста, не оставляйте здесь машину.
    note: 'Ещё один бытовой случай с *نگذارین*: «пожалуйста, не parkуйте здесь».'
  prs.a2.unit31.lesson04.teach.no_trouble:
    title: Пожалуйста, не беспокойтесь
    gloss: Пожалуйста, не беспокойтесь.
    note: '*زحمت کشیدن* значит «трудиться, беспокоиться». *لطفاً زحمت نکشین* говорят, когда предлагают чай или помощь: так вежливо отказываются и благодарят.'
  prs.a2.unit31.lesson04.teach.better_not:
    title: Лучше не ходить завтра
    gloss: Лучше бы вы завтра не ходили.
    note: '*بهتر است* («лучше») — более мягкий способ сказать «не делайте». Это совет, а не приказ.'
  prs.a2.unit31.lesson05.teach.mrs:
    title: Госпожа, ханум
    gloss: Госпожа, ханум
    note: '*خانم* ставится перед женским именем как вежливое обращение: *خانم رحیمه*.'
    example_gloss: Госпожа Рахима — наша соседка.
  prs.a2.unit31.lesson05.teach.mr:
    title: Господин
    gloss: господин
    note: '*آقای* ставится перед мужским именем: *آقای مسعود*.'
    example_gloss: Господин Масуд в магазине.
  prs.a2.unit31.lesson05.teach.flower:
    title: Цветок
    gloss: цветок
    note: '*گل* — «цветок». Добавь *‌ها* для множественного числа и *-م* для «мой»: *گل‌هایم* («мои цветы»).'
    example_gloss: Мои цветы дома.
  prs.a2.unit31.lesson05.teach.water:
    title: Вода
    gloss: вода
    note: '*آب* — «вода». *آب دادن* значит «поливать растение»: *به گل‌ها آب بدهین*.'
    example_gloss: Я пью воду.
  prs.a2.unit31.lesson05.teach.not_home:
    title: Меня не будет дома до пятницы
    gloss: Меня не будет дома до пятницы.
    note: '*نیستم* — «меня нет, я не». *تا جمعه* — «до пятницы».'
  prs.a2.unit31.lesson05.teach.may_i:
    title: Можно ...?
    gloss: Можно оставить ключ у вас?
    note: 'С формой на *-م* *می‌شود که ...؟* спрашивает разрешения: *می‌شود که کلید را پیش شما بگذارم؟* — «можно оставить ключ у вас?» С формой на *-ین* это просьба к собеседнику. Сравни: *می‌شود که کمک کنم؟* («можно помочь?») и *می‌شود که کمک کنین؟* («не могли бы вы помочь?»).'
  prs.a2.unit31.lesson05.teach.people:
    title: Маджида и Шафик — соседи
    gloss: Маджида и Шафик — соседи.
    note: В тексте ниже Маджида оставляет записку соседу Шафику.
  prs.a2.unit31.lesson05.teach.d1_t1:
    title: Масуд просит о помощи
    gloss: Здравствуйте, госпожа Рахима. Извините, не могли бы вы сегодня немного помочь?
    note: Масуд начинает с приветствия и *ببخشین*, затем просит с помощью *می‌شود که* и формы на *-ین* — *کنین*.
  prs.a2.unit31.lesson05.teach.d1_t2:
    title: Рахима соглашается
    gloss: Здравствуйте, господин Масуд. Конечно. Что мне сделать?
    note: '*البته* — вежливое «да». *چه کار کنم؟* — форма на *-م*, так спрашивают, что нужно сделать.'
  prs.a2.unit31.lesson05.teach.d1_t3:
    title: Масуд говорит, что ему нужно
    gloss: Не могли бы вы отнести этот стол со мной в комнату?
    note: Вторая просьба, теперь о конкретном предмете. *با من* — «со мной».
  prs.a2.unit31.lesson05.teach.d1_t4:
    title: Рахима соглашается
    gloss: Да, конечно.
    note: Короткое тёплое согласие.
  prs.a2.unit31.lesson05.teach.d1_t5:
    title: Масуд предлагает чай
    gloss: Большое спасибо. Принести чай?
    note: '*خیلی تشکر* — «большое спасибо». *چای بیاورم؟* — предложение с формой на *-م*.'
  prs.a2.unit31.lesson05.teach.d1_t6:
    title: Рахима отказывается
    gloss: Нет, спасибо. Пожалуйста, не беспокойтесь.
    note: Рахима отказывается словами *نه، تشکر*, а затем использует отрицательную команду *نکشین* — «не беспокойтесь».
  prs.a2.unit31.lesson05.teach.message:
    title: Записка соседу
    gloss: Здравствуйте, господин Шафик. Завтра я уезжаю в Мазар и до пятницы не буду дома. Можно оставить у вас ключ от моего дома? Пожалуйста, поливайте мои цветы каждый день. Пожалуйста, не оставляйте ворота открытыми. Благодарю за вашу доброту. Маджида
    note: 'Короткая записка: одна просьба о разрешении, одна просьба и одна просьба «не делать». Обрати внимание: здесь те же конструкции, что и в разговоре.'
  prs.a2.unit31.lesson06.teach.d2_t1:
    title: Фарзана звонит в магазин
    gloss: Алло, здравствуйте. Не могли бы вы прислать к нам домой два хлеба и пакет молока?
    note: Фарзана звонит в магазин. *الو* — «алло» по телефону. *بفرستین* — вежливая форма просьбы от *فرستادن* («посылать»).
  prs.a2.unit31.lesson06.teach.d2_t2:
    title: Продавец соглашается и спрашивает время
    gloss: Да, конечно. Во сколько прислать?
    note: Продавец соглашается и спрашивает «когда» с помощью формы на *-م* — *بفرستم*.
  prs.a2.unit31.lesson06.teach.d2_t3:
    title: Фарзана называет время
    gloss: В пять часов. Пожалуйста, не опаздывайте.
    note: Фарзана отвечает, называя время, и добавляет отрицательную команду.
  prs.a2.unit31.lesson06.teach.d2_t4:
    title: Продавец обещает и предлагает чай
    gloss: Нет, я не опоздаю. Прислать ещё и чай?
    note: '*نه* здесь соглашается с отрицательной просьбой: «нет, я не опоздаю». Затем он предлагает чай.'
  prs.a2.unit31.lesson06.teach.d2_t5:
    title: Фарзана отказывается
    gloss: Нет, спасибо. Чай у меня есть.
    note: 'Она отказывается и объясняет причину: чай у неё уже есть.'
  prs.a2.unit31.lesson06.teach.d2_t6:
    title: Продавец завершает разговор
    gloss: Хорошо.
    note: Короткое завершение разговора.
  prs.a2.unit31.lesson06.teach.cannot:
    title: Простите, сейчас я не могу
    gloss: Простите, сейчас я не могу.
    note: 'Чтобы отказать в просьбе, скажи «простите» — *متأسفم* или *ببخشین* — а затем объясни, почему или когда: *متأسفم، فردا نمی‌توانم.*'
  prs.a2.unit31.lesson06.teach.summary:
    title: Вся система
    gloss: Просьба, вежливая команда, отрицательная команда, предложение
    note: 'Просьба: *می‌شود که ... بدهین؟* или *لطفاً ... بدهین*. Просьба не делать: *لطفاً ... نکنین*. Предложение: *... بدهم؟* или *می‌خواهین که ... کنم؟*. Ответы: *بلی، لطفاً.* или *نه، تشکر.* Отказ на просьбу: *متأسفم، نمی‌توانم.*'
exercises:
  prs.a2.unit31.lesson01.exercise01.recognize_bread:
    instruction: Что означает это предложение?
    correct_option: Не могли бы вы дать мне немного хлеба?
    distractors:
    - Я дал вам хлеба
    - Хлеб лежит на столе
    - Я хочу много хлеба
    accepted_answers:
    - value: Не могли бы вы дать мне немного хлеба?
      status: correct
    feedback: '*می‌شود که* начинает вежливую просьбу, а *بدهین* — глагол: «не могли бы вы дать».'
  prs.a2.unit31.lesson01.exercise02.recognize_help:
    instruction: Что означает это предложение?
    correct_option: Извините, не могли бы вы мне помочь?
    distractors:
    - Извините, я вам помогу
    - Извините, где магазин?
    - Извините, мне нужен пакет
    accepted_answers:
    - value: Извините, не могли бы вы мне помочь?
      status: correct
    feedback: '*ببخشین* — «извините», а *می‌شود که کمک کنین؟* — «не могли бы вы помочь?»'
  prs.a2.unit31.lesson01.exercise03.match_requests:
    instruction: Соедини каждую просьбу с её значением. Каждую из них можно сказать после می‌شود که.
    accepted_answers:
    - value:
        کمی نان بدهین: дайте мне немного хлеба
        یک شیر بدهین: дайте мне пакет молока
        یک کیسه بدهین: дайте мне пакет
        کمک کنین: помогите мне
        صبر کنین: подождите
        تیلفون کنین: позвоните мне
        به خانه بفرستین: отправьте это домой
        دروازه را باز کنین: откройте ворота
      status: correct
    feedback: 'После *می‌شود که* все эти глаголы стоят в сослагательной форме на *-ین*. В составных глаголах первое слово сохраняется: *کمک کنین، صبر کنین، تیلفون کنین، باز کنین*.'
    pairs:
    - left: کمی نان بدهین
      right: дайте мне немного хлеба
    - left: یک شیر بدهین
      right: дайте мне пакет молока
    - left: یک کیسه بدهین
      right: дайте мне пакет
    - left: کمک کنین
      right: помогите мне
    - left: صبر کنین
      right: подождите
    - left: تیلفون کنین
      right: позвоните мне
    - left: به خانه بفرستین
      right: отправьте это домой
    - left: دروازه را باز کنین
      right: откройте ворота
  prs.a2.unit31.lesson01.exercise04.order_bread:
    instruction: 'Расставь слова так, чтобы получилось: «Не могли бы вы дать мне немного хлеба?»'
    accepted_answers:
    - value:
      - می‌شود
      - که
      - کمی
      - نان
      - بدهین
      status: correct
    feedback: В *می‌شود که کمی نان بدهین؟* глагол стоит в конце.
  prs.a2.unit31.lesson01.exercise05.complete_milk:
    instruction: 'Закончи просьбу: «Не могли бы вы дать мне пакет молока?»'
    accepted_answers:
    - value: بدهین
      status: correct
    feedback: '*بدهین* — вежливая сослагательная форма от *دادن*: *می‌شود که یک شیر بدهین؟*'
  prs.a2.unit31.lesson01.exercise06.translate_bag:
    instruction: 'Переведи на дари: «Не могли бы вы дать мне пакет?»'
    accepted_answers:
    - value: می‌شود که یک کیسه بدهین؟
      status: correct
    - value: ببخشین، می‌شود که یک کیسه بدهین؟
      status: correct
    - value: می‌شود یک کیسه بدهین؟
      status: correct
    - value: ببخشین، می‌شود یک کیسه بدهین؟
      status: correct
    - value: می‌توانین یک کیسه بدهین؟
      status: correct
    - value: ببخشین، می‌توانین یک کیسه بدهین؟
      status: correct
    - value: ممکن است که یک کیسه بدهین؟
      status: correct
    feedback: '*می‌شود که یک کیسه بدهین؟* — «не могли бы вы дать мне пакет?» Можно добавить *ببخشین*, опустить *که* или спросить с *می‌توانین*.'
  prs.a2.unit31.lesson02.exercise01.recognize_come_here:
    instruction: Что означает это предложение?
    correct_option: Пожалуйста, придите сюда
    distractors:
    - Пожалуйста, идите туда
    - Я иду сюда
    - Пожалуйста, дайте мне ключ
    accepted_answers:
    - value: Пожалуйста, придите сюда
      status: correct
    feedback: '*بیایین* — вежливая команда «придите», а *اینجا* — «здесь, сюда».'
  prs.a2.unit31.lesson02.exercise02.which_polite:
    instruction: Ты говоришь с соседкой и обращаешься к ней на «вы» (شما). Какое предложение правильное?
    correct_option: لطفاً بیایین.
    distractors:
    - لطفاً بیا.
    - لطفاً می‌آیم.
    - لطفاً آمد.
    accepted_answers:
    - value: لطفاً بیایین.
      status: correct
    feedback: 'Соседу говорят команду на *-ین*: *لطفاً بیایین.* Форма *بیا* без окончания — для друга.'
  prs.a2.unit31.lesson02.exercise03.match_commands:
    instruction: Соедини каждую команду с её значением.
    accepted_answers:
    - value:
        بیا: приходи (другу)
        بروین: идите (к соседу)
        بده: дай (другу)
        بگویین: скажите (вежливо)
        بگیرین: взять, получить (вежливо)
        بیاورین: принести (вежливо)
        کنین: делайте (вежливо)
        ببرین: отнести, отвезти куда-либо (вежливо)
      status: correct
    feedback: Формы без окончания *بیا، بده* — для друга. Формы на *-ین* (*بروین، بگویین، بگیرین، بیاورین، کنین، ببرین*) — для соседа или для нескольких человек.
    pairs:
    - left: بیا
      right: приходи (другу)
    - left: بروین
      right: идите (к соседу)
    - left: بده
      right: дай (другу)
    - left: بگویین
      right: скажите (вежливо)
    - left: بگیرین
      right: взять, получить (вежливо)
    - left: بیاورین
      right: принести (вежливо)
    - left: کنین
      right: делайте (вежливо)
    - left: ببرین
      right: отнести, отвезти куда-либо (вежливо)
  prs.a2.unit31.lesson02.exercise04.order_wait:
    instruction: 'Расставь слова так, чтобы получилось: «Пожалуйста, подождите немного.»'
    accepted_answers:
    - value:
      - لطفاً
      - کمی
      - صبر
      - کنین
      status: correct
    feedback: '*لطفاً کمی صبر کنین.* *لطفاً* стоит в начале, а глагол — в конце.'
  prs.a2.unit31.lesson02.exercise05.complete_wait:
    instruction: 'Закончи предложение: «Пожалуйста, подождите немного.»'
    accepted_answers:
    - value: کنین
      status: correct
    - value: کنید
      status: correct
    feedback: '*صبر کنین* — «подождите». Вежливая форма повелительного наклонения от *کردن* — *کنین*.'
  prs.a2.unit31.lesson02.exercise06.translate_bring:
    instruction: 'Переведи на дари, обращаясь к соседу: Принесите, пожалуйста, сумку.'
    accepted_answers:
    - value: لطفاً کیسه را بیارین.
      status: correct
    - value: کیسه را بیارین، لطفاً.
      status: correct
    - value: لطفاً کیسه را بیاورین.
      status: correct
    - value: کیسه را بیاورین، لطفاً.
      status: correct
    - value: لطفاً کیسه را بیارید.
      status: correct
    - value: کیسه را بیارید، لطفاً.
      status: correct
    - value: لطفاً کیسه را بیاورید.
      status: correct
    - value: کیسه را بیاورید، لطفاً.
      status: correct
    feedback: '*لطفاً کیسه را بیاورین.* После «сумки» стоит *را*, а команда — в конце. *لطفاً* может стоять и в конце.'
  prs.a2.unit31.lesson02.exercise07.write_table:
    instruction: 'Напиши на дари соседу, используя لطفاً: Отнесите, пожалуйста, этот стол в комнату.'
    accepted_answers:
