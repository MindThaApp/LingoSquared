course:
  title: Дари A1
  description: 'Начальный кабульский дари: лексика о внешности (высокий, низкий, волосы, глаза, борода, очки), вопрос о том, как выглядит человек, — قیافه‌اش چطور است؟, цвет волос и глаз (رنگ مو/رنگ چشم) и диалог Зармины и Хумаюна о том, как узнать человека по внешности.'
units:
  prs.a1.unit27.appearance:
    title: Внешность
    description: Описывай внешность человека и спрашивай, как он выглядит.
lessons:
