  prs.a1.unit27.lesson05.reading_appearance:
    title: Читаем о внешности
  prs.a1.unit27.lesson06.wrap_up:
    title: Итоги
teaching:
  prs.a1.unit27.lesson01.teach.tall_phrase:
    title: Высокий
    gloss: высокий
    note: 'قد بلند буквально означает «длинный рост»: قد (рост) + بلند (длинный, высокий).'
    example_gloss: Он/она высокий(-ая).
  prs.a1.unit27.lesson01.teach.short_phrase:
    title: Низкий
    gloss: низкий (о росте)
    note: 'قد کوتاه буквально означает «короткий рост»: قد (рост, повторение) + کوتاه (короткий).'
    example_gloss: Он/она невысокого роста.
  prs.a1.unit27.lesson01.teach.hair_word:
    title: Волосы
    gloss: волосы
    note: مو означает «волосы»; موی — та же форма слова перед другим словом (изафет), например موی سیاه, «чёрные волосы».
    example_gloss: У него/неё чёрные волосы.
  prs.a1.unit27.lesson01.teach.eye_word:
    title: Глаз
    gloss: глаз
    note: چشم означает «глаз». Для описания цвета глаз слово стоит в единственном числе — это обычная норма.
    example_gloss: У него/неё чёрные глаза.
  prs.a1.unit27.lesson01.teach.beard_word:
    title: Борода
    gloss: борода
    note: ریش означает «борода».
    example_gloss: У него/неё есть борода.
  prs.a1.unit27.lesson01.teach.glasses_word:
    title: Очки
    gloss: очки
    note: عینک означает «очки».
    example_gloss: У него/неё есть очки.
  prs.a1.unit27.lesson01.teach.review_ast_dast:
    title: Есть / имеет (3-е лицо)
    gloss: есть, является / имеет (3-е лицо)
    note: است («есть, является») и دارد («имеет», 3-е лицо) уже знакомы по прошлым урокам; в этом разделе с ними описывают внешность.
    target_text: است (есть, является) / دارد (имеет, 3-е лицо)
  prs.a1.unit27.lesson02.teach.qiyafa_word:
    title: Внешность
    gloss: внешность
    note: قیافه означает «внешность», «облик» человека (например, خوش قیافه — «красивый, привлекательный»).
    example_gloss: У него/неё приятная внешность.
  prs.a1.unit27.lesson02.teach.review_chetor:
    title: Как
    gloss: какой
    note: چطور означает «как» (слово уже встречалось раньше, в приветствии چطور استین؟).
    target_text: چطور (как)
  prs.a1.unit27.lesson02.teach.qiyafash_word:
    title: Его/её внешность
    gloss: его/её внешность
    note: قیافه‌اش — это قیافه («внешность») с притяжательным суффиксом ‌اش («его/её»).
  prs.a1.unit27.lesson02.teach.question_appearance:
    title: Как он/она выглядит?
    gloss: Как он/она выглядит?
    note: قیافه‌اش چطور است؟ — естественный вопрос о том, как выглядит человек. Одно چطور است؟ без слова قیافه‌اش звучит как «Как он/она поживает?» (вопрос о самочувствии).
  prs.a1.unit27.lesson02.teach.answer_tall:
    title: Он/она высокий(-ая)
    gloss: Он/она высокий(-ая).
    note: Соединяет او («он/она», повторение) с قد بلند است из этого раздела.
  prs.a1.unit27.lesson02.teach.answer_black_hair:
    title: У него/неё чёрные волосы
    gloss: У него/неё чёрные волосы.
    note: Соединяет موی («волосы»), سیاه («чёрный») и دارد («имеет»).
  prs.a1.unit27.lesson02.teach.answer_beard:
    title: У него/неё есть борода
    gloss: У него/неё есть борода.
    note: Здесь ریش دارد — та же конструкция с «иметь», что и в выражении про чёрные волосы.
  prs.a1.unit27.lesson03.teach.review_rang:
    title: Цвет
    gloss: цвет
    note: رنگ означает «цвет» (слово уже встречалось раньше, в теме одежды в разделе 21).
    target_text: رنگ (цвет)
  prs.a1.unit27.lesson03.teach.blue_word:
    title: Синий
    gloss: синий
    note: آبی означает «синий, голубой».
    example_gloss: У него/неё голубые глаза.
  prs.a1.unit27.lesson03.teach.brown_word:
    title: Коричневый
    gloss: коричневый
    note: قهوه‌ای означает «коричневый» (о цвете волос или глаз).
    example_gloss: У него/неё каштановые волосы.
  prs.a1.unit27.lesson03.teach.eye_color_phrase:
    title: Цвет глаз
    gloss: цвет глаз
    note: 'رنگ چشم буквально означает «цвет глаза»: رنگ («цвет») + چشم («глаз»).'
  prs.a1.unit27.lesson03.teach.hair_color_phrase:
    title: Цвет волос
    gloss: цвет волос
    note: 'رنگ مو буквально означает «цвет волос»: رنگ («цвет») + مو («волосы»).'
  prs.a1.unit27.lesson03.teach.eye_blue_sentence:
    title: У него/неё голубые глаза
    gloss: У него/неё голубые глаза.
    note: Слово آبی из этого урока употреблено со словом چشم.
  prs.a1.unit27.lesson03.teach.hair_brown_sentence:
    title: У него/неё каштановые волосы
    gloss: У него/неё каштановые волосы.
    note: Слово قهوه‌ای из этого урока употреблено со словом موی.
  prs.a1.unit27.lesson04.teach.review_baradar:
    title: Брат / твой брат
    gloss: брат / твой брат (неформально)
    note: برادر («брат») уже было в разделе 3; برادرت добавляет неформальный притяжательный суффикс ‌ت («твой») — как в обращении на «ты» (تو).
    target_text: برادر (брат) / برادرت (твой брат, неформально)
  prs.a1.unit27.lesson04.teach.review_bali_tashakor:
    title: Да / спасибо / тоже
    gloss: да / спасибо / тоже
    note: بلی («да»), تشکر («спасибо») и هم («тоже») уже знакомы по прошлым урокам.
    target_text: بلی (да) / تشکر (спасибо) / هم (тоже)
  prs.a1.unit27.lesson04.teach.dialogue_line1:
    title: 'Хумаюн: Зармина, как выглядит твой брат?'
    gloss: 'Хумаюн: Зармина, как выглядит твой брат?'
    note: Неформальный вопрос между друзьями; к слову برادر добавлен суффикс ‌ت («твой»).
  prs.a1.unit27.lesson04.teach.dialogue_line2:
    title: 'Зармина: Он высокий, с чёрными волосами'
    gloss: 'Зармина: Он высокий, и у него чёрные волосы.'
    note: Два признака соединены союзом و («и»).
  prs.a1.unit27.lesson04.teach.dialogue_line3:
    title: 'Хумаюн: У него есть борода?'
    gloss: 'Хумаюн: У него есть борода?'
    note: Вопрос «да/нет» образуется просто повышением интонации в ریش دارد.
  prs.a1.unit27.lesson04.teach.dialogue_line4:
    title: 'Зармина: Да, у него борода, и ещё он носит очки'
    gloss: 'Зармина: Да, у него борода, и очки тоже есть.'
    note: Слово هم («тоже») добавляет второй признак.
  prs.a1.unit27.lesson04.teach.dialogue_line5:
    title: 'Хумаюн: Хорошо, спасибо'
    gloss: 'Хумаюн: Хорошо, спасибо.'
    note: خوب («хорошо») — новое простое слово для завершения разговора; تشکر («спасибо») уже знакомо.
  prs.a1.unit27.lesson05.teach.reading_passage:
    title: Читаем о внешности
    gloss: Карим высокий. У него чёрные волосы и карие глаза. Бороды у него нет, но есть очки.
    note: Короткий текст повторяет слова о внешности из этого раздела. Здесь снова встречается персонаж کریم (Карим) из раздела о сравнении и новое слово ندارد («не имеет», отрицательная форма دارد в 3-м лице).
  prs.a1.unit27.lesson06.teach.review_ama:
    title: Но
    gloss: но
    note: اما означает «но» (встречалось раньше в этом разделе, в тексте пятого урока, и в предыдущих разделах).
    target_text: اما (но)
  prs.a1.unit27.lesson06.teach.review_astam:
    title: Я есть / у меня есть
    gloss: я являюсь, я есть / у меня есть
    note: استم («я есть, я являюсь») и دارم («у меня есть») уже знакомы по прошлым урокам; здесь они нужны, чтобы описать свою внешность.
    target_text: استم (я есть, я являюсь) / دارم (я имею)
  prs.a1.unit27.lesson06.teach.wrap_summary:
    title: Я невысокого роста, но у меня чёрные волосы
    gloss: Я невысокого роста, но у меня чёрные волосы.
    note: Два факта о внешности соединены словом اما («но»).
