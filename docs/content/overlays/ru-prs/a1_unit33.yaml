course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: лексика домашних дел (домашние дела, веник, посуда, чистый, помощь), как сказать с помощью باید, какое дело нужно сделать сегодня, как попросить кого-то помочь, и диалог Вахида и Шукрии о распределении домашних дел.'
units:
