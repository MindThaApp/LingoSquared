    note: شستن (мыть) — совершенно новый глагол; کردن (делать) и می‌کنم (я делаю) уже знакомы по прошлым урокам.
    target_text: شستن (мыть) / کردن (делать) — می‌شویم (я мою) / می‌کنم (я делаю)
