    feedback: '*باشم* — форма 1-го лица единственного числа сослагательного наклонения глагола *بودن*. С *داشته* означает «если у меня есть»: *اگر پول داشته باشم*.'
  prs.a2.unit37.lesson02.exercise04.match_conditions:
    instruction: Соедини каждое выражение на дари с его значением.
    accepted_answers:
