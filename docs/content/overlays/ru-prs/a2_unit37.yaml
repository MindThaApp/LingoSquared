  prs.a2.unit37.lesson02.exercise01.recognize_have_time:
    instruction: Что означает это предложение?
    correct_option: Если у меня будет время, я приду
    distractors:
    - Если бы у меня было время, я пришёл
    - У меня нет времени, поэтому я не прихожу
    - Если у тебя есть время, приходи
    accepted_answers:
    - value: Если у меня будет время, я приду
      status: correct
    feedback: '*اگر وقت داشته باشم* — «если у меня будет время», а *می‌آیم* — «я прихожу» или «я приду».'
  prs.a2.unit37.lesson02.exercise02.recognize_friend_comes:
    instruction: Что означает это предложение?
    correct_option: Если мой друг придёт, мы пойдём в парк вместе
    distractors:
    - Если мой друг придёт, я пойду в парк один
    - Мой друг пришёл, и мы пошли в парк
    - Если мы пойдём в парк, мой друг придёт
