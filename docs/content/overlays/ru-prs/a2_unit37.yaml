course:
  title: Дари A2
  description: 'Афганский дари для уровня ниже среднего: рассказываем, что происходит или произойдёт, если выполнено условие, например если завтра пойдёт дождь или если у тебя есть чек. اگر и сослагательное наклонение, а в главной части — настоящее время или повелительное наклонение; планы в зависимости от погоды и правила магазинов.'
units:
  prs.a2.unit37.if_conditions:
    title: Если пойдёт дождь
