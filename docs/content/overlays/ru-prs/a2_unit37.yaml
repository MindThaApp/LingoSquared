teaching:
  prs.a2.unit37.lesson01.teach.weather:
    title: Погода
    gloss: погода, воздух
    note: '*هوا* — это погода, а также воздух. *هوا خوب است* значит «погода хорошая», а *هوا بد است* — «погода плохая».'
    example_gloss: Сегодня хорошая погода.
  prs.a2.unit37.lesson01.teach.cold:
    title: Холодно
    gloss: холодно
    note: '*سرد* значит «холодный». Противоположное слово — *گرم* («тёплый, горячий»), ты его уже знаешь.'
    example_gloss: Сегодня холодно.
  prs.a2.unit37.lesson01.teach.outside:
    title: Снаружи
    gloss: снаружи
    note: '*بیرون* значит «снаружи, на улице». *بیرون می‌روم* — «я выхожу на улицу», а *بیرون از خانه* — «вне дома».'
    example_gloss: Я нахожусь вне дома.
  prs.a2.unit37.lesson01.teach.if_pattern:
    title: 'اگر: реальное условие'
    gloss: Если погода хорошая, я иду в парк. Если пойдёт дождь, я остаюсь дома.
    note: '*اگر* значит «если». Оно вводит условие, которое может на самом деле осуществиться, и глагол условия стоит в сослагательном наклонении: *باشد*, *ببارد*. Это та же форма, что и после *باید*: к основе настоящего времени спереди добавляется *ب-* (*ببارد*), а *باشد* — форма от *بودن*, и *ب-* ей не нужно. Главная часть говорит о том, что происходит, и стоит в обычном настоящем времени с *می‌*: *به پارک می‌روم*. Настоящее время с *می‌* выражает и будущее, поэтому особая форма будущего не нужна. После условия ставится запятая.'
  prs.a2.unit37.lesson01.teach.paradigm_ro:
    title: Сослагательное наклонение глагола رفتن после اگر
    gloss: если я пойду, если ты пойдёшь, если он или она пойдёт, если мы пойдём, если вы пойдёте (вежливо или мн. ч.), если они пойдут
    note: 'Основа настоящего времени глагола *رفتن* — *رو*. Спереди добавляем *ب-*, а в конце — окончания: *بروم* (я), *بروی* (ты, неформально), *برود* (он, она, оно), *برویم* (мы), *بروین* (вы, вежливо или мн. ч.), *بروند* (они). Все глаголы принимают одни и те же шесть окончаний: *-م، -ی، -د، -یم، -ین، -ند*. Окончание *-ین* — для «вы» (вежливое или множественное). Формы на *-ید* тоже понимают, но в этом курсе пишется *-ین*.'
  prs.a2.unit37.lesson01.teach.snow_phrase:
    title: Если пойдёт снег, я не выхожу на улицу
    gloss: Если пойдёт снег, я не выхожу на улицу.
    note: 'Главная часть может быть отрицательной. Перед основой настоящего времени ставится *نمی‌*: *نمی‌روم* — «я не иду». Условие остаётся прежним: *اگر برف ببارد* — «если пойдёт снег».'
  prs.a2.unit37.lesson01.teach.cold_phrase:
    title: Если погода холодная, я остаюсь дома
    gloss: Если погода холодная, я остаюсь дома.
    note: '*اگر هوا سرد باشد* — «если погода холодная». Когда в условии есть *هوا* и прилагательное, оно всегда заканчивается на *باشد*.'
  prs.a2.unit37.lesson02.teach.weekend:
    title: Выходные
    gloss: выходные, конец недели
    note: '*آخر هفته* — «выходные». *آخر* значит «конец», а *هفته* — «неделя».'
    example_gloss: В выходные мы идём в парк.
  prs.a2.unit37.lesson02.teach.tonight:
    title: Сегодня вечером
    gloss: сегодня вечером, нынешним вечером
    note: '*امشب* — «сегодня вечером». Это слово со значением времени, поэтому его можно использовать в главной части с *می‌*: *امشب می‌روم* — «сегодня вечером я иду».'
    example_gloss: Сегодня вечером я иду в кино.
  prs.a2.unit37.lesson02.teach.formation:
    title: Сослагательное наклонение других глаголов
    gloss: чтобы я купил, чтобы я взял, чтобы я дал, чтобы я пришёл, чтобы я остался, чтобы я поел
    note: 'Правило, которое мы видели на примере *رفتن*, работает для любого глагола: основа настоящего времени, *ب-* спереди, затем окончания. Из *خر* получается *بخرم* («я куплю»), из *گیر* — *بگیرم* («я возьму»), из *ده* — *بدهم* («я дам»), из *مان* — *بمانم* («я останусь»), из *خور* — *بخورم* («я поем»). Запомнить нужно *آمدن*: его сослагательное наклонение — *بیایم، بیایی، بیاید، بیاییم، بیایین، بیایند*, с дополнительной *ی*. После *اگر* эти формы значат «если я куплю», «если я возьму» и так далее.'
  prs.a2.unit37.lesson02.teach.be_have:
    title: Сослагательное наклонение глаголов بودن и داشتن
    gloss: чтобы я был, чтобы ты был, чтобы он или она был(а), чтобы мы были, чтобы вы были (вежливо или мн. ч.), чтобы они были
    note: '*باشم، باشی، باشد، باشیم، باشین، باشند* — шесть форм сослагательного наклонения глагола *بودن*; *ب-* они не принимают. Чтобы сказать «если у меня есть», в дари используют *داشته باشم*: причастие *داشته* и *باشم*. Так, *اگر وقت داشته باشم* — «если у меня будет время», а *اگر پول داشته باشی* — «если у тебя будут деньги». Для возможной ситуации в будущем это обычная форма.'
  prs.a2.unit37.lesson02.teach.money_phrase:
    title: Если у меня будут деньги, я куплю книгу
    gloss: Если у меня будут деньги, я куплю книгу.
    note: '*اگر پول داشته باشم* — «если у меня будут деньги». Главная часть стоит в обычном настоящем времени: *کتاب می‌خرم* — «я покупаю книгу» или «я куплю книгу».'
  prs.a2.unit37.lesson02.teach.negative:
    title: 'Отрицание: ن вместо ب'
    gloss: если я не пойду, если я не приду, если я не куплю, если этого не будет, если не будет дождя
    note: 'Чтобы сделать условие отрицательным, замени *ب-* на *ن-*: *بروم* превращается в *نروم*, *بخرم* — в *نخرم*, а *بیایم* — в *نیایم*. *باشد* и *ببارد* превращаются в *نباشد* и *نبارد*. Так, *اگر باران نبارد* — «если не будет дождя».'
  prs.a2.unit37.lesson02.teach.friend_phrase:
    title: Если придёт мой друг, мы вместе поиграем в футбол
    gloss: Если придёт мой друг, мы вместе поиграем в футбол.
    note: 'В условии стоит *بیاید* (сослагательное наклонение глагола *آمدن* для «он, она»). В главной части теперь говорится о «мы»: *می‌کنیم* — «мы делаем» или «мы играем», а *می‌رویم* — «мы идём». *با هم* значит «вместе».'
  prs.a2.unit37.lesson02.teach.norain_phrase:
    title: Если не будет дождя, мы пойдём в парк
    gloss: Если не будет дождя, мы пойдём в парк.
    note: '*اگر باران نبارد* — «если не будет дождя». Главная часть утвердительная, а *می‌رویم* значит «мы идём».'
  prs.a2.unit37.lesson02.teach.time_phrase:
    title: Если у меня будет время, сегодня вечером я пойду в кино
    gloss: Если у меня будет время, сегодня вечером я пойду в кино.
    note: Условие о наличии времени строится с *داشته باشم*. Слово *امشب* в главной части показывает, что планы на сегодняшний вечер.
  prs.a2.unit37.lesson03.teach.clothes:
    title: Одежда
    gloss: одежда
    note: '*لباس* — это одежда или предмет одежды. *لباس گرم* — тёплая одежда для холодной погоды.'
    example_gloss: У меня есть тёплая одежда.
  prs.a2.unit37.lesson03.teach.imperative:
    title: 'Приказ: после اگر главная часть может быть приказом'
    gloss: возьми (другу; вежливо или во мн. ч.), надень, приходи, позвони
    note: 'Главная часть может быть и приказом. Другу приказ дают так: *ب-* плюс основа настоящего времени без окончания: *بگیر* (возьми), *بپوش* (надень), *بیا* (приходи). Для вежливого обращения или нескольких человек добавляется *-ین*: *بگیرین، بپوشین، بیایین*. У составных глаголов нет *ب-*: *تیلفون کن* (другу), *تیلفون کنین* (вежливо или во мн. ч.). Так *اگر باران ببارد، چتر بگیر* значит «если пойдёт дождь, возьми зонт».'
  prs.a2.unit37.lesson03.teach.neg_imperative:
    title: Отрицательный приказ
    gloss: не ходи, не приходи, не делай (другу; вежливо или во мн. ч.)
    note: 'В отрицательном приказе вместо *ب-* ставится *ن-*: *نرو* (не ходи), *نیا* (не приходи), *نکن* (не делай). Для вежливой формы или множественного числа добавляется *-ین*: *نروین، نیایین، نکنین*. Например, *اگر باران ببارد، بیرون نرو* значит «если пойдёт дождь, не выходи на улицу».'
  prs.a2.unit37.lesson03.teach.present_state:
    title: 'Настоящее время в условии: то, что верно сейчас'
    gloss: Если у тебя есть время, приходи. Если тебе холодно, надень тёплую одежду.
    note: 'Когда условие — это то, что верно в данный момент, в нём вместо сослагательного наклонения можно употребить обычное настоящее время: *اگر وقت داری* (если у тебя сейчас есть время) и *اگر سردت است* (если тебе холодно). Форма *اگر وقت داشته باشی* тоже верна и звучит скорее как возможная ситуация в будущем. Тот, кому холодно, говорит *سردم است*; *سردت است* значит «тебе холодно».'
  prs.a2.unit37.lesson03.teach.rain_umbrella:
    title: Если пойдёт дождь, возьми зонт
    gloss: Если пойдёт дождь, возьми зонт.
    note: 'Условие стоит в сослагательном наклонении *ببارد*, а главная часть — приказ другу: *بگیر*.'
  prs.a2.unit37.lesson03.teach.late_phone:
    title: Если опоздаешь, позвони
    gloss: Если опоздаешь, позвони.
    note: '*دیر شوی* — сослагательное наклонение от *دیر شدن* для «ты» (друг): если ты опоздаешь. *تیلفون کن* — приказ другу.'
  prs.a2.unit37.lesson03.teach.problem_phone:
    title: Если у вас есть проблема, позвоните
    gloss: Если у вас есть проблема, позвоните.
    note: 'Когда обращаются к покупателю или к нескольким людям, в обеих частях используется *-ین*: *دارین* (у вас есть) и *کنین* (позвоните). Так мог бы написать магазин в объявлении.'
  prs.a2.unit37.lesson04.teach.item:
    title: Товар
    gloss: товар, вещь, изделие
    note: '*کالا* — это товар, то, что покупают в магазине.'
    example_gloss: Этот товар испорчен.
  prs.a2.unit37.lesson04.teach.customer:
    title: Покупатель
    gloss: покупатель
    note: '*مشتری* — покупатель. Множественное число — *مشتریان*, с окончанием *-ان* для людей.'
    example_gloss: Покупатель в магазине.
  prs.a2.unit37.lesson04.teach.receipt:
    title: Квитанция
    gloss: квитанция
    note: '*رسید* — чек, бумага, которая показывает, сколько вы заплатили. Слово похоже на прошедшее время глагола *رسیدن* («он прибыл»), но в магазине оно значит «чек».'
    example_gloss: Чек у вас с собой?
  prs.a2.unit37.lesson04.teach.exchange:
    title: Обменивать
    gloss: обменять, поменять
    note: '*عوض کردن* — обменять или поменять что-либо. Предмет ставится перед глаголом с *را*: *کالا را عوض می‌کنم* значит «я меняю товар».'
    example_gloss: Я хочу поменять книгу.
  prs.a2.unit37.lesson04.teach.give_back:
    title: Вернуть
    gloss: вернуть, отдать обратно, возместить
    note: '*پس دادن* — отдать обратно. Магазин, возвращающий деньги, говорит *پول را پس می‌دهیم* («мы возвращаем деньги»).'
    example_gloss: Мы возвращаем деньги.
  prs.a2.unit37.lesson04.teach.modal:
    title: 'Мочь: می‌توانم'
    gloss: я могу, ты можешь, он/она может, мы можем, вы можете (вежливо или во мн. ч.), они могут
    note: '*می‌توانم* — «я могу»; пишется всегда с *می‌* и небольшим промежутком. Шесть форм: *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. Следующий глагол стоит в сослагательном наклонении в том же лице: *می‌توانیم عوض کنیم* значит «мы можем обменять». Для отрицания спереди добавляется *ن*: *نمی‌توانیم* — «мы не можем».'
  prs.a2.unit37.lesson04.teach.shop_if:
    title: Правила магазина с اگر
    gloss: Если товар испорчен, мы его обменяем. Если чек у вас с собой, мы можем обменять товар.
    note: 'Магазины используют *اگر*, чтобы сказать, что они делают в каждом случае. В условии стоит *باشد* (*خراب باشد*, *همراه‌تان باشد*), а главная часть — простое настоящее время (*عوض می‌کنیم*) или *می‌توانیم* с сослагательным наклонением. *همراه‌تان باشد* значит «он у вас с собой» (буквально: он с вами).'
  prs.a2.unit37.lesson04.teach.no_receipt:
    title: 'Правило с отрицанием: нет чека'
    gloss: Если у вас нет чека, мы не можем вернуть деньги.
    note: '*نداشته باشین* — отрицание от *داشته باشین* («если у вас есть»). Главная часть тоже отрицательная: *نمی‌توانیم پول را پس بدهیم* — «мы не можем вернуть деньги». Обращаясь к покупателю, магазин использует *-ین*.'
  prs.a2.unit37.lesson04.teach.seven_days:
    title: Если принесёте в течение семи дней, мы обменяем товар
    gloss: Если принесёте в течение семи дней, мы обменяем товар.
    note: '*تا هفت روز* — «до семи дней», то есть в течение семи дней. *بیاورین* — сослагательное наклонение от *آوردن* для «вы» (вежливо или во мн. ч.): если принесёте.'
  prs.a2.unit37.lesson05.teach.notice:
    title: Объявление в магазине
    gloss: Объявление магазина для покупателей об обмене товаров и возврате денег.
    note: 'Такое объявление можно увидеть в магазине. Читай, обращая внимание на условия: что делает магазин, если у вас есть чек, если товар испорчен, если чека нет и если у вас проблема. Каждое правило — это часть с *اگر* и главная часть.'
  prs.a2.unit37.lesson05.teach.weather_turn01:
    title: Зейнаб спрашивает о завтрашнем дне
    gloss: Шахин, что ты делаешь завтра?
    note: Зейнаб спрашивает друга о его планах вопросом *فردا چه می‌کنی؟* («что ты делаешь завтра?»), используя настоящее время для будущего.
  prs.a2.unit37.lesson05.teach.weather_turn02:
    title: Шахин называет два плана
    gloss: Если погода хорошая, я пойду в парк с друзьями. Если пойдёт дождь, останусь дома.
    note: У Шахина два условия и два плана. В обоих условиях стоит сослагательное наклонение (*باشد، ببارد*), а в обеих главных частях — настоящее время (*می‌روم، می‌مانم*).
  prs.a2.unit37.lesson05.teach.weather_turn03:
    title: Зейнаб, возможно, придёт
    gloss: Если у меня будет время, я тоже приду.
    note: '*داشته باشم* — сослагательное наклонение, «если у меня будет». *من هم* значит «я тоже».'
  prs.a2.unit37.lesson05.teach.weather_turn04:
    title: Шахин приглашает её
    gloss: Отлично! Если придёшь, мы ещё и в футбол поиграем.
    note: '*بیایی* — сослагательное наклонение от *آمدن* для «ты» (друг). Главная часть — о «нас»: *می‌کنیم*.'
  prs.a2.unit37.lesson05.teach.weather_turn05:
    title: Зейнаб спрашивает о времени
    gloss: Во сколько вы идёте?
    note: '*می‌روین* — «вы идёте» (вежливо или во мн. ч.): Зейнаб спрашивает обо всей компании.'
  prs.a2.unit37.lesson05.teach.weather_turn06:
    title: Шахин просит позвонить
    gloss: В десять. Если опоздаешь, позвони.
    note: Условие — *دیر شوی*, а главная часть — приказ *تیلفون کن*.
  prs.a2.unit37.lesson05.teach.weather_turn07:
    title: Зейнаб делает своё предложение
    gloss: Хорошо. Если пойдёт дождь, я позвоню.
    note: 'Зейнаб тоже использует *اگر* с *ببارد*, а в главной части стоит настоящее время: *تیلفون می‌کنم*.'
  prs.a2.unit37.lesson06.teach.shop_turn01:
    title: Фариба рассказывает о своей проблеме
    gloss: Извините, я вчера купила в этом магазине зонт. Зонт сломан.
    note: Фариба вежливо начинает со слова *ببخشین*. Она говорит, что зонт *خراب* («испорчен») и что купила его *دیروز* («вчера»).
  prs.a2.unit37.lesson06.teach.shop_turn02:
    title: Продавец называет условие
    gloss: Если чек у вас с собой, мы можем его обменять.
    note: 'Магазин использует образец из объявления: условие с *باشد* и *می‌توانیم* с сослагательным наклонением. *آن را* значит «его».'
  prs.a2.unit37.lesson06.teach.shop_turn03:
    title: У Фарибы есть чек
    gloss: Да, вот чек.
    note: '*رسید این است* — «вот чек». *بلی* — «да».'
  prs.a2.unit37.lesson06.teach.shop_turn04:
    title: Продавец предлагает два варианта
    gloss: Хорошо. Если хотите другой зонт, возьмите. Если не хотите, мы вернём вам деньги.
    note: 'Два условия, оба в настоящем времени: *اگر ... می‌خواهین* («если вы хотите») с приказом *بگیرین* и *اگر نمی‌خواهین* («если вы не хотите») с *پس می‌دهیم*.'
  prs.a2.unit37.lesson06.teach.shop_turn05:
    title: Фариба выбирает
    gloss: Я возьму другой зонт. Спасибо.
    note: 'Фариба отвечает в настоящем времени: *می‌گیرم* — «я беру», то есть она уже решила.'
  prs.a2.unit37.lesson06.teach.want:
    title: Если вы не хотите другой зонт, мы вернём вам деньги
    gloss: Если вы не хотите другой зонт, мы вернём вам деньги.
    note: 'Для желания в настоящем времени условие может стоять в обычном настоящем времени: *می‌خواهین* — «вы хотите», а *نمی‌خواهین* — «вы не хотите». Главная часть говорит, что делает магазин.'
exercises:
  prs.a2.unit37.lesson01.exercise01.recognize_good_weather:
    instruction: Что означает это предложение?
    correct_option: Если погода хорошая, я иду в парк
    distractors:
    - Если пойдёт дождь, я иду в парк
    - Погода была хорошая, поэтому я пошёл в парк
    - Я не иду в парк
    accepted_answers:
    - value: Если погода хорошая, я иду в парк
      status: correct
    feedback: '*اگر هوا خوب باشد* — «если погода хорошая», а *به پارک می‌روم* — то, что тогда происходит.'
  prs.a2.unit37.lesson01.exercise02.recognize_rain_home:
    instruction: Что означает это предложение?
    correct_option: Если пойдёт дождь, я остаюсь дома
    distractors:
    - Если пойдёт дождь, я выхожу на улицу
    - Шёл дождь, поэтому я остался дома
    - Я никогда не остаюсь дома
    accepted_answers:
    - value: Если пойдёт дождь, я остаюсь дома
      status: correct
    feedback: '*اگر باران ببارد* — «если пойдёт дождь», а *در خانه می‌مانم* — «я остаюсь дома».'
  prs.a2.unit37.lesson01.exercise03.complete_warm:
    instruction: 'Дополни предложение: Если погода тёплая, я выхожу на улицу.'
    accepted_answers:
    - value: باشد
      status: correct
    feedback: '*باشد* — сослагательное наклонение от *بودن*. После *اگر هوا گرم* оно образует условие: если погода тёплая.'
  prs.a2.unit37.lesson01.exercise04.match_subjunctive_weather:
    instruction: Соедини каждое слово на дари с его значением.
    accepted_answers:
    - value:
        اگر بروم: если я пойду
        اگر بروی: если ты пойдёшь (неформально)
        اگر برود: если он, она или оно пойдёт
        اگر برویم: если мы пойдём
        اگر بروین: если вы пойдёте (вежливо или мн. ч.)
        اگر بروند: если они пойдут
        هوا: погода
        سرد: холодно
        بیرون: снаружи
      status: correct
    feedback: 'С лицом меняется только окончание сослагательного наклонения: *-م* — я, *-ی* — ты (друг), *-د* — он или она, *-یم* — мы, *-ین* — вы (вежливо или во мн. ч.), *-ند* — они.'
    pairs:
    - left: اگر بروم
      right: если я пойду
    - left: اگر بروی
      right: если ты пойдёшь (неформально)
    - left: اگر برود
      right: если он, она или оно пойдёт
    - left: اگر برویم
      right: если мы пойдём
    - left: اگر بروین
      right: если вы пойдёте (вежливо или мн. ч.)
    - left: اگر بروند
      right: если они пойдут
    - left: هوا
      right: погода
    - left: سرد
      right: холодно
    - left: بیرون
      right: снаружи
  prs.a2.unit37.lesson01.exercise05.order_rain_home:
    instruction: 'Расставь слова, чтобы получилось: Если пойдёт дождь, я останусь дома.'
    accepted_answers:
