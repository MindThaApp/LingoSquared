teaching:
  prs.a1.unit32.lesson01.teach.birthday_word:
    title: День рождения
    gloss: день рождения
    note: تولد означает «день рождения» — это ключевое слово урока.
    example_gloss: Мой день рождения в месяце хамаль.
  prs.a1.unit32.lesson01.teach.celebration_word:
    title: Праздник
    gloss: праздник
    note: جشن означает «праздник» или «торжество».
    example_gloss: Наш праздник большой.
  prs.a1.unit32.lesson01.teach.cake_word:
    title: Торт
    gloss: торт
    note: کیک означает «торт» — это общее для персидского и дари заимствованное слово.
    example_gloss: Торт вкусный.
  prs.a1.unit32.lesson01.teach.gift_word:
    title: Подарок
    gloss: подарок
    note: هدیه означает «подарок» — это обычное повседневное слово в дари и персидском (также употребляется تحفه).
    example_gloss: Этот подарок для вас.
  prs.a1.unit32.lesson01.teach.congratulations_word:
    title: Поздравление
    gloss: поздравление
    note: تبریک означает «поздравление»; в повседневной фразе تبریک می‌گویم («поздравляю») оно употребляется с глаголом می‌گویم («говорю»).
    example_gloss: Поздравляю!
  prs.a1.unit32.lesson01.teach.review_mubarak:
    title: С днём рождения (как строится фраза)
    gloss: твой день рождения + благословенный → С днём рождения
    note: تولدت состоит из تولد («день рождения») и суффикса -ت, означающего «твой» (в неформальном обращении); مبارک значит «благословенный, счастливый». Вместе تولدت مبارک — стандартное поздравление с днём рождения в дари и персидском.
    target_text: تولدت (твой день рождения, неформально) + مبارک (благословенный) = تولدت مبارک (С днём рождения)
  prs.a1.unit32.lesson01.teach.happy_birthday_phrase:
    title: С днём рождения!
    gloss: С днём рождения!
    note: Настоящее, широко употребляемое поздравление с днём рождения в дари и персидском (تولدتان مبارک — вежливый вариант, в упражнениях этого урока он не проверяется).
  prs.a1.unit32.lesson02.teach.review_shoma_dar_ast:
    title: Вы / в / есть
    gloss: вы (вежливо) / в, на / есть, является
    note: شما («вы»), در («в, на») и است («есть, является») — повторение из прошлых уроков.
    target_text: شما (вы, вежливо) / در (в, на) / است (есть, является)
  prs.a1.unit32.lesson02.teach.review_man_kodam:
    title: Я / какой
    gloss: я / какой
    note: من («я») и کدام («какой») — повторение из прошлых уроков.
    target_text: من (я) / کدام (какой)
  prs.a1.unit32.lesson02.teach.month_word:
    title: Месяц
    gloss: месяц
    note: ماه означает «месяц» — это новое слово в нашем курсе.
    example_gloss: Этот месяц тёплый.
  prs.a1.unit32.lesson02.teach.review_hamal:
    title: Хамал
    gloss: Хамаль (первый месяц)
    note: حمل — первый месяц солнечного хиджрийского календаря.
    target_text: حمل (Хамаль, первый месяц)
  prs.a1.unit32.lesson02.teach.question_which_month:
    title: В каком месяце твой день рождения?
    gloss: В каком месяце ваш день рождения?
    note: Сочетает تولد («день рождения», повторение), شما («вы», вежливое, повторение), در («в», повторение), کدام («какой», повторение) и ماه («месяц»).
  prs.a1.unit32.lesson02.teach.answer_hamal:
    title: Мой день рождения в месяце хамаль
    gloss: Мой день рождения в месяце хамаль.
    note: Сочетает знакомую конструкцию تولد من در ... است («мой день рождения в ...») со словом حمل («хамаль»).
  prs.a1.unit32.lesson03.teach.review_dawat_mehmani:
    title: Приглашение / гости
    gloss: приглашение / вечеринка
    note: Слова دعوت и مهمانی повторяются здесь, чтобы в каждом уроке был полный набор нужной лексики.
    target_text: دعوت (приглашение) / مهمانی (вечеринка, приём гостей)
  prs.a1.unit32.lesson03.teach.review_ra_ba:
    title: Показатель прямого объекта / к
    gloss: показатель прямого дополнения / к, на
    note: را (показатель прямого дополнения) и به («к, на») — служебные слова, повторение.
    target_text: را (показатель прямого дополнения) / به (к, в сторону)
  prs.a1.unit32.lesson03.teach.review_mikonam:
    title: Я делаю
    gloss: я делаю → я приглашаю
    note: می‌کنم («я делаю», повторение) вместе с دعوت образует сочетание دعوت می‌کنم («я приглашаю»).
    target_text: می‌کنم (я делаю) — دعوت می‌کنم (я приглашаю)
  prs.a1.unit32.lesson03.teach.invite_sentence:
    title: Я приглашаю вас на день рождения
    gloss: Я приглашаю вас на день рождения.
    note: Сочетает знакомую конструкцию من ... را به ... دعوت می‌کنم («я приглашаю ... на ...») со словосочетанием جشن تولد («празднование дня рождения»).
  prs.a1.unit32.lesson03.teach.review_miyayin:
    title: Вы придёте? (вежливо)
    gloss: вы придёте? (вежливо)
    note: می‌آیین образовано по знакомой модели вежливого окончания -ین (как استین, می‌خوانین, می‌کنین).
    target_text: می‌آیین؟ (вы придёте? вежливо)
  prs.a1.unit32.lesson03.teach.will_you_come_question:
