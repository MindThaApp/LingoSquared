    note: او («он/она», повторение из урока 31) и یک («один», повторение из урока 4) повторяются здесь.
    target_text: او (он, она) / یک (один, какой-то)
  prs.a1.unit32.lesson05.teach.review_miyayad_miyawarad:
    title: Он/она приходит / он/она приносит
    gloss: он/она приходит / он/она приносит
    note: می‌آید и می‌آورد — формы 3-го лица с привычным окончанием -د (как می‌خواند из урока 31).
    target_text: می‌آید (он/она приходит) / می‌آورد (он/она приносит)
  prs.a1.unit32.lesson05.teach.reading_passage:
    title: Читаем о празднике
    gloss: День рождения Басира в пятницу. Он в семь часов. Марьям придёт на праздник. Она принесёт подарок. Басир счастлив.
