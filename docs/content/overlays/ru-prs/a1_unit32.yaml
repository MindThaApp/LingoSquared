    note: جمعه, ساعت, چند и هفت — повторение из прошлых уроков (дни и время).
    target_text: جمعه (пятница) / ساعت (час, часы) / چند (сколько, какой) / هفت (семь)
  prs.a1.unit32.lesson04.teach.review_informal_come:
