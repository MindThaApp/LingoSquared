    note: تو, می‌آیی, می‌آیم, بلی, بسیار خوب и تشکر زیاد — повторение; здесь они собраны для неформального диалога.
    target_text: تو (ты, неформально) / می‌آیی (ты приходишь, неформально) / می‌آیم (я прихожу) / بلی (да) / بسیار خوب (очень хорошо) / تشکر زیاد (большое спасибо)
  prs.a1.unit32.lesson04.teach.dialogue_line1:
    title: 'Басир: Марьям, в пятницу мой день рождения. Ты придёшь?'
    gloss: Марьям, в пятницу мой день рождения. Ты придёшь?
  prs.a1.unit32.lesson04.teach.dialogue_line2:
