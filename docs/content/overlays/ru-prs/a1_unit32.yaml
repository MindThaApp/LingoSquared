course:
  title: Дари A1
  description: 'Начальный уровень, кабульский дари: лексика праздника и дня рождения (день рождения, праздник, торт, подарок, поздравление), вопрос о месяце дня рождения и ответ на него, вежливая фраза-приглашение и диалог Басира и Марьям о дне рождения.'
units:
  prs.a1.unit32.celebrations:
