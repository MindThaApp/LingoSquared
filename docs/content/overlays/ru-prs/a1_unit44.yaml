    target_text: است (есть, является) / در (в)
  prs.a1.unit44.lesson01.teach.review_colors:
    title: 'Повторение: цвет, зелёный, синий'
    gloss: цвет / зелёный / синий
    note: Слова رنگ, سبز и آبی — повторение; ими называют два мусорных бака.
    target_text: رنگ (цвет) / سبز (зелёный) / آبی (синий, голубой)
  prs.a1.unit44.lesson01.teach.bin_word:
    title: Бак
    gloss: бак
    note: سطل — обычное дари слово для обозначения бака или ведра.
    example_gloss: Бак зелёный.
  prs.a1.unit44.lesson01.teach.waste_word:
    title: Мусор
    gloss: мусор
    note: زباله означает бытовой мусор, отходы.
