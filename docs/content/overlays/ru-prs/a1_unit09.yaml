teaching:
  prs.a1.unit09.lesson01.teach.shanbe_yakshanbe:
    title: Суббота и воскресенье
    gloss: суббота, воскресенье
    note: شنبه (суббота) — первый день недели в Афганистане; за ним следует یکشنبه (воскресенье).
    example_gloss:
    - Сегодня суббота.
    - Завтра воскресенье.
  prs.a1.unit09.lesson01.teach.doshanbe_seshanbe:
    title: Понедельник и вторник
    gloss: понедельник, вторник
    note: دوشنبه и سه‌شنبه буквально означают «второй день» и «третий день» после شنبه.
    example_gloss:
    - В понедельник у меня занятие.
    - Во вторник у меня встреча.
  prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe:
    title: Среда и четверг
    gloss: среда, четверг
    note: 'Слова چهارشنبه и پنجشنبه продолжают ту же модель: «четвёртый день» и «пятый день».'
    example_gloss:
    - В среду я работаю.
    - Увидимся в четверг.
  prs.a1.unit09.lesson01.teach.jomeh:
    title: Пятница
    gloss: пятница
    note: جمعه — еженедельный выходной в Афганистане; по роли он похож на выходной в конце недели в других странах.
    example_gloss: Пятница — выходной.
  prs.a1.unit09.lesson01.teach.tarikh_word:
    title: Дата
    gloss: дата
    note: تاریخ — общее слово для календарной даты.
    example_gloss: Какое сегодня число?
  prs.a1.unit09.lesson01.teach.va_word:
    title: И
    gloss: и
    note: و — обычный соединительный союз («и»), он встречается во всём этом уроке.
    target_text: و (и)
  prs.a1.unit09.lesson01.teach.weekend_note:
    title: Еженедельный выходной
    gloss: Пятница — еженедельный выходной день.
    note: В отличие от выходных в субботу и воскресенье, главный еженедельный выходной в Афганистане — *جمعه* (пятница); четверг часто бывает сокращённым рабочим днём.
  prs.a1.unit09.lesson02.teach.hamal:
    title: Хамал (1-й месяц)
    gloss: Хамал, первый месяц солнечного календаря хиджры (примерно конец марта — апрель)
    note: حمل открывает афганский солнечный год и совпадает с новогодним праздником Навруз.
    example_gloss: Хамал — первый месяц года.
  prs.a1.unit09.lesson02.teach.sawr:
    title: Саур (2-й месяц)
    gloss: Саур, второй месяц (примерно апрель — май)
    note: ثور идёт после حمل.
    example_gloss: В месяце саур погода хорошая.
  prs.a1.unit09.lesson02.teach.jawza:
    title: Джавза (3-й месяц)
    gloss: Джавза, третий месяц (примерно май — июнь)
    note: جوزا идёт после ثور.
    example_gloss: Я родился в месяце джавза.
  prs.a1.unit09.lesson02.teach.calendar_note:
    title: Календарь Афганистана
    gloss: Афганистан пользуется солнечным календарём хиджры (хиджри-шамси).
    note: Это та же солнечная календарная система, что и в Иране; она отличается и от григорианского, и от лунного календаря хиджры.
  prs.a1.unit09.lesson03.teach.what_day_today:
    title: Спросить, какой сегодня день недели
    gloss: Какой сегодня день недели?
    note: امروز چند شنبه است؟ буквально значит «сегодня какая по счёту -шанбе»; так естественно спрашивают о дне недели.
  prs.a1.unit09.lesson03.teach.today_word:
    title: Сегодня
    gloss: сегодня
    note: امروز обозначает текущий день.
    example_gloss: Какое сегодня число?
  prs.a1.unit09.lesson04.teach.give_full_date:
    title: Назвать полную дату
    gloss: Сегодня четверг, пятнадцатое хамала.
    note: امروز پنجشنبه، پانزدهم حمل است соединяет день недели, порядковое числительное для даты и название месяца.
  prs.a1.unit09.lesson05.teach.which_day_meeting:
    title: Спросить, в какой день событие
    gloss: В какой день собрание?
    note: В جلسه کدام روز است؟ слово کدام («какой», «который из») используется, чтобы спросить о дне события.
  prs.a1.unit09.lesson05.teach.which_date:
    title: Спросить конкретное число
    gloss: Какого числа хамала понедельник?
    note: دوشنبه چندم حمل است؟ спрашивает, на какое число месяца приходится понедельник.
  prs.a1.unit09.lesson06.teach.nozdahom:
    title: 19-е
    gloss: 19-е
    note: '*نوزدهم* — порядковая форма числа «девятнадцать»; она образуется так же, как *پانزدهم* (15-е).'
    example_gloss: Сегодня 19-е.
  prs.a1.unit09.lesson06.teach.turn01:
    title: Хумаюн спрашивает о дне собрания
    gloss: Хумаюн спрашивает Башира, в какой день собрание.
    note: 'Эта фраза уже встречалась в предыдущих уроках: جلسه کدام روز است؟'
  prs.a1.unit09.lesson06.teach.turn02:
    title: Башир отвечает
    gloss: Башир говорит, что, кажется, в понедельник.
    note: 'فکر می‌کنم («я думаю») смягчает ответ: Башир не совсем уверен.'
  prs.a1.unit09.lesson06.teach.turn03:
    title: Хумаюн спрашивает точную дату
    gloss: Хумаюн спрашивает, какого числа хамала понедельник.
    note: 'Эта фраза уже встречалась в предыдущих уроках: دوشنبه چندم حمل است؟'
  prs.a1.unit09.lesson06.teach.turn04:
    title: Башир называет точную дату
    gloss: Башир говорит, что понедельник — 19-е хамала.
    note: '*دوشنبه نوزدهم حمل است* соединяет день недели, порядковую дату и месяц по уже знакомой модели.'
  prs.a1.unit09.lesson06.teach.turn05:
    title: Хумаюн спрашивает о пятнице
    gloss: Хумаюн соглашается и спрашивает, свободен ли Башир в пятницу.
    note: وقت داری؟ («у тебя есть время?») — естественный способ спросить, свободен ли человек.
  prs.a1.unit09.lesson06.teach.turn06:
    title: Башир говорит, что занят
    gloss: 'Башир отвечает «нет»: в пятницу он занят.'
    note: مصروف استم («я занят») объясняет, почему пятница не подходит.
  prs.a1.unit09.lesson06.teach.turn07:
    title: Хумаюн подтверждает понедельник
    gloss: 'Хумаюн говорит, что это не проблема: он увидится с Баширом в понедельник.'
    note: مشکل نیست («не проблема») сглаживает неудобство с датой перед тем, как подтвердить исходный план на понедельник.
