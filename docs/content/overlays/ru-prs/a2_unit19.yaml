course:
  title: Дари A2
  description: 'Дари (Афганистан), уровень ниже среднего: рассказываем, что ты делал в прошедшие выходные, по порядку, включая то, чего ты не делал. Простое прошедшее время как система (основа прошедшего времени плюс окончания), отрицательное прошедшее и сравнение с настоящим.'
units:
  prs.a2.unit19.last_weekend:
    title: Прошлые выходные
lessons:
  prs.a2.unit19.lesson01.weekend_words_and_past_form:
    title: Слова о выходных и форма прошедшего времени
  prs.a2.unit19.lesson02.building_the_past:
    title: Образуем прошедшее время от других глаголов
  prs.a2.unit19.lesson03.negative_past:
    title: Отрицательное прошедшее; прошедшее и настоящее
  prs.a2.unit19.lesson04.telling_in_order:
    title: Рассказываем по порядку
  prs.a2.unit19.lesson05.reading_and_listening:
    title: Читаем и слушаем о выходных
  prs.a2.unit19.lesson06.weekend_conversation:
    title: Разговор о выходных
teaching:
  prs.a2.unit19.lesson01.teach.last_weekend:
    title: Прошлые выходные
    gloss: прошлые выходные
    note: '*آخر هفته* — это выходные, а *گذشته* означает «прошедший». Вместе *آخر هفتهٔ گذشته* — «прошлые выходные», временные рамки всего этого урока.'
    example_gloss: В прошлые выходные я ходил на базар.
  prs.a2.unit19.lesson01.teach.thursday_friday:
    title: Четверг, пятница
    gloss: Четверг, пятница
    note: В Афганистане пятница — еженедельный выходной, а многие начинают выходные уже в четверг после обеда. Поэтому *پنجشنبه* и *جمعه* — два дня, которые чаще всего нужны в рассказах о выходных.
    example_gloss:
    - В четверг после обеда я ходил в банк.
    - В пятницу я ходил в парк.
  prs.a2.unit19.lesson01.teach.afternoon:
    title: День (после полудня)
    gloss: вторая половина дня, предвечернее время
    note: '*عصر* — время ближе к вечеру. Оно стоит после названия дня: *پنجشنبه عصر* — «в четверг во второй половине дня».'
    example_gloss: В четверг после обеда я ходил в банк.
  prs.a2.unit19.lesson01.teach.yesterday:
    title: Вчера
    gloss: вчера
    note: '*دیروز* — слово, которое ты уже знаешь из урока о прошлых событиях. С ним употребляется тот же глагол прошедшего времени, который ты построишь в этом уроке.'
    example_gloss: Вчера я позавтракал.
  prs.a2.unit19.lesson01.teach.in_bazaar:
    title: На базаре
    gloss: на базаре
    note: '*در* означает «в» или «на», а *بازار* — базар, рынок, место многих выходных дел.'
    example_gloss: На базаре я купил хлеб и фрукты.
  prs.a2.unit19.lesson01.teach.bank:
    title: Банк
    gloss: банк
    note: '*بانک* — банк. Это ещё одно место, куда ходят по делам.'
    example_gloss: После обеда я ходил в банк.
  prs.a2.unit19.lesson01.teach.park:
    title: Парк
    gloss: парк
    note: '*پارک* — парк, слово, которое ты знаешь из уроков о прогулках.'
    example_gloss: В пятницу я ходил в парк с друзьями.
  prs.a2.unit19.lesson01.teach.shopping:
    title: Делать покупки
    gloss: ходить за покупками, делать покупки
    note: '*خرید کردن* — обычный способ сказать, что ты ходил за покупками. *خرید* — «покупки», а *کردن* — глагол «делать».'
    example_gloss: Я сделал покупки на базаре.
  prs.a2.unit19.lesson01.teach.visiting:
    title: Пойти навестить
    gloss: пойти навестить кого-то
    note: '*به دیدن* плюс человек плюс *رفتن* означает «пойти навестить этого человека»: *به دیدن فامیلم رفتم* — «я ходил навестить свою семью». Визиты — вторая большая тема этого урока.'
    example_gloss: В пятницу я ходил навестить свою семью.
  prs.a2.unit19.lesson01.teach.family:
    title: Семья, родственники
    gloss: семья, родственники
    note: '*فامیل* — твоя семья и родственники. Добавь *-م*, чтобы сказать «мой»: *فامیلم* — «моя семья».'
    example_gloss: Моя семья в Кабуле.
  prs.a2.unit19.lesson01.teach.errands:
    title: Иметь дела
    gloss: иметь дела, быть занятым делами
    note: '*کار* — это работа, но ещё и задача, дело. *کار داشتن* — «иметь дела». *چند* означает «несколько» или «сколько».'
    example_gloss: В четверг после обеда у меня было несколько дел.
  prs.a2.unit19.lesson01.teach.go_paradigm:
    title: 'Простое прошедшее: основа прошедшего времени плюс окончания'
    gloss: я ходил, ты ходил, он/она ходил(а), мы ходили, вы ходили (вежливо или мн. ч.), они ходили
    note: 'Простое прошедшее — это система, а не список слов для заучивания. Возьми инфинитив *رفتن* («идти») и отбрось конечное *ن*: основа прошедшего времени — *رفت*. Затем добавь окончание: *-م* для «я» (*رفتم*), *-ی* для «ты» (*رفتی*), ничего для «он/она» (*رفت*), *-یم* для «мы» (*رفتیم*), *-ین* для «вы» вежливого или множественного числа (*رفتین*), *-ند* для «они» (*رفتند*). Местоимение (*من، تو، او*) необязательно, потому что окончание уже показывает, кто действовал. Обрати внимание: перед прошедшим временем нет *می*, которое стоит в настоящем.'
  prs.a2.unit19.lesson02.teach.eat_paradigm:
    title: 'То же правило, новый глагол: есть'
    gloss: я ел, ты ел, он/она ел(а), мы ели, вы ели (вежливо или мн. ч.), они ели
    note: 'Правило, которое ты узнал на примере *رفتن*, работает почти для всех глаголов. У *خوردن* («есть») отбрасывается *ن*, и получается основа прошедшего времени *خورد*, затем идут те же шесть окончаний: *خوردم، خوردی، خورد، خوردیم، خوردین، خوردند*. Форма «он/она» — это просто голая основа, поэтому *خورد* значит «он/она ел(а)».'
  prs.a2.unit19.lesson02.teach.breakfast:
    title: Вчера я позавтракал
    gloss: Вчера я позавтракал.
    note: '*صبحانه* — завтрак, слово из уроков о распорядке дня. *خوردم* — прошедшее время от *خوردن* с окончанием *-م*.'
  prs.a2.unit19.lesson02.teach.bread_fruit:
    title: Хлеб и фрукты
    gloss: хлеб и фрукты
    note: '*نان* — хлеб, *میوه* — фрукты. *و* означает «и».'
    example_gloss: На базаре я купил хлеб и фрукты.
  prs.a2.unit19.lesson02.teach.more_verbs:
    title: Ещё пять глаголов, одно правило
    gloss: видеть, покупать, делать, становиться, иметь — в прошедшем времени
    note: 'Все эти глаголы подчиняются одному правилу: отбрось *ن*, затем добавь окончание. *دیدن* («видеть») даёт *دیدم* («я видел») и *دیدی* («ты видел»). *خریدن* («покупать») даёт *خریدم* («я купил»). *کردن* («делать») даёт *کردم* («я сделал») и *کردی* («ты сделал»). *شدن* («становиться») даёт *شدم* («я стал»). *داشتن* («иметь») даёт *داشتم* («у меня было»). Меняется только конец глагола, основа остаётся прежней. Обрати внимание: *خرید* — это и основа прошедшего времени от *خریدن* («купил»), и существительное «покупки», как в *خرید کردن*.'
  prs.a2.unit19.lesson02.teach.movie:
    title: Я смотрел фильм
    gloss: Я смотрел фильм.
    note: '*فلم* — фильм. На дари говорят *فلم دیدن*, буквально «видеть фильм», поэтому глагол здесь *دیدم*.'
  prs.a2.unit19.lesson02.teach.exercise:
    title: Я занимался спортом
    gloss: Я занимался спортом.
    note: '*ورزش* — спорт, физические упражнения. *ورزش کردن* означает «заниматься спортом», а окончание добавляется к *کردن*: *ورزش کردم*.'
  prs.a2.unit19.lesson02.teach.woke_late:
    title: Я поздно проснулся
    gloss: Я поздно проснулся.
    note: '*دیر* означает «поздно», а *بیدار شدن* — «просыпаться». *بیدار شدم* — «я проснулся», а *دیر* стоит перед ним.'
  prs.a2.unit19.lesson03.teach.neg_paradigm:
    title: 'Отрицательное прошедшее: ن плюс глагол в прошедшем времени'
    gloss: я не ходил, ты не ходил, он/она не ходил(а), мы не ходили, вы не ходили (вежливо или мн. ч.), они не ходили
    note: 'Чтобы сказать, что ты чего-то не делал, поставь *ن* в самое начало глагола в прошедшем времени: *رفتم* («я ходил») превращается в *نرفتم* («я не ходил»). Больше ничего не меняется, окончания те же шесть: *نرفتم، نرفتی، نرفت، نرفتیم، نرفتین، نرفتند*. В отрицательном простом прошедшем нет *نمی*. Завершённое действие, которого не было, — это просто *ن* плюс глагол в прошедшем времени.'
  prs.a2.unit19.lesson03.teach.neg_breakfast:
    title: Я не завтракал
    gloss: Я не завтракал.
    note: '*نخوردم* — это *ن* плюс *خوردم*: «я не ел».'
  prs.a2.unit19.lesson03.teach.neg_more:
    title: То же ن с другими глаголами
    gloss: я не видел, я не купил, у меня не было, я не сделал
    note: 'Правило работает для всех глаголов, которые ты уже знаешь: *ندیدم* («я не видел»), *نخریدم* («я не купил»), *نداشتم* («у меня не было»), *نکردم* («я не сделал»). Всегда сначала *ن*, потом глагол в прошедшем времени. У некоторых глаголов, начинающихся с آ, меняется написание: *آمدم* («я пришёл») превращается в *نیامدم* («я не пришёл»).'
  prs.a2.unit19.lesson03.teach.neg_compound:
    title: Отрицание глаголов с کردن
    gloss: Я не делал покупок на базаре. Я не занимался спортом.
    note: 'Некоторые глаголы состоят из существительного и *کردن*, например *خرید کردن* («делать покупки») и *ورزش کردن* («заниматься спортом»). Ставь *ن* на *کردن*, а не на существительное: *خرید نکردم*, *ورزش نکردم*. Писать *نخرید کردم* неправильно.'
  prs.a2.unit19.lesson03.teach.past_vs_present:
    title: Прошедшее и настоящее
    gloss: Я иду на базар. / Я ходил на базар. / Я не ходил на базар.
    note: 'Настоящее время этого глагола — *می‌روم* («я иду, я хожу»): *می* плюс основа настоящего времени *رو* плюс окончание. Прошедшее — *رفتم*, без *می*. Чтобы поставить настоящее в отрицание, используют *نمی‌روم*, а для прошедшего — только *ن*: *نرفتم*. Прошедшее время употребляй для завершённого действия, например в прошлые выходные, а настоящее — для того, что ты делаешь регулярно или делаешь сейчас.'
  prs.a2.unit19.lesson04.teach.first:
    title: Сначала
    gloss: сначала
    note: '*اول* открывает последовательность. Это слово ты знаешь из урока о недельном расписании.'
    example_gloss: Сначала я позавтракал.
  prs.a2.unit19.lesson04.teach.then:
    title: Потом, после этого
    gloss: потом, после этого
    note: '*بعد* продолжает последовательность после *اول*.'
    example_gloss: Потом я пошёл в банк.
  prs.a2.unit19.lesson04.teach.but:
    title: Но
    gloss: но
    note: '*ولی* соединяет то, что ты сделал, с тем, чего не сделал: оно противопоставляет эти две части.'
    example_gloss: Я ходил на базар, но покупок не делал.
  prs.a2.unit19.lesson04.teach.no:
    title: Нет
    gloss: нет
    note: '*نخیر* — вежливое повседневное «нет» на дари, им отвечают на вопрос, требующий ответа «да» или «нет».'
    example_gloss: Нет, я не смотрел фильм.
  prs.a2.unit19.lesson04.teach.finally:
    title: В конце концов
    gloss: наконец, в конце
    note: '*در آخر* завершает последовательность после *اول* и *بعد*. Оба слова, входящие в него, ты уже знаешь.'
    example_gloss: В конце я ходил навестить свою семью.
  prs.a2.unit19.lesson04.teach.home:
    title: Дом
    gloss: дом, жильё
    note: '*خانه* — дом, слово из урока о жилье.'
    example_gloss: В конце я пошёл домой.
  prs.a2.unit19.lesson04.teach.order_grammar:
    title: Рассказываем о выходных по порядку
    gloss: В четверг сначала я пошёл в банк, потом сделал покупки на базаре, а в конце пошёл домой.
    note: 'Чтобы рассказать по порядку, что ты делал, поставь каждое завершённое действие в прошедшее время и покажи порядок словами *اول، بعد، در آخر*. Действия идут в том порядке, в каком происходили: *اول به بانک رفتم، بعد در بازار خرید کردم و در آخر به خانه رفتم.* Части можно соединять запятой, точкой или *و*. Чтобы добавить то, чего ты не делал, используй *ولی* и отрицательный глагол в прошедшем времени: *به بازار رفتم، ولی خرید نکردم.*'
  prs.a2.unit19.lesson05.teach.also:
    title: Тоже, также
    gloss: тоже, также
    note: '*هم* означает «тоже» или «также» и стоит после того, что оно добавляет: *فلم هم ندیدم* — «фильм я тоже не смотрел».'
    example_gloss: Я тоже ходил на базар.
  prs.a2.unit19.lesson05.teach.my_friend:
    title: Мой друг
    gloss: мой друг
    note: '*دوست* — друг, а *-م* добавляет «мой»: *دوستم* — «мой друг».'
    example_gloss: В пятницу я ходил навестить своего друга.
  prs.a2.unit19.lesson05.teach.my_friends:
    title: Мои друзья
    gloss: мои друзья
    note: '*دوستان* — это «друзья» (множественное число от *دوست*), а *-م* добавляет значение «мои»: *دوستانم* — «мои друзья».'
    example_gloss: В пятницу я ходил в парк с друзьями.
  prs.a2.unit19.lesson05.teach.with:
    title: С
    gloss: с
    note: '*با* означает «с». Оно стоит перед словом, обозначающим человека: *با دوستانم* — «с моими друзьями».'
    example_gloss: Я ходил на базар с друзьями.
  prs.a2.unit19.lesson05.teach.message:
    title: Сообщение о прошедших выходных
    gloss: В прошлые выходные, в четверг после обеда, у меня было несколько дел. Сначала я пошёл в банк, потом купил на базаре хлеб и фрукты. В пятницу я поздно проснулся и позавтракал, потом пошёл навестить родных. Я не занимался спортом и фильм тоже не смотрел.
    note: 'Короткий письменный рассказ о выходных, где события идут в том порядке, в котором происходили. Два действия не состоялись, и каждое выражено глаголом в отрицательной форме прошедшего времени: *ورزش نکردم* и *فلم ندیدم*.'
  prs.a2.unit19.lesson05.teach.exchange_q:
    title: Хомаюн спрашивает Зармину о четверге
    gloss: Зармина, ты ходила в четверг в банк?
    note: Хомаюн задаёт вопрос глаголом в прошедшем времени *رفتی* — это форма «ты» (для друга). Это вопрос с ответом «да» или «нет» о завершённом действии.
  prs.a2.unit19.lesson05.teach.exchange_a:
    title: Зармина отвечает
    gloss: Нет, в банк я не ходила. Я смотрела фильм.
    note: Зармина сначала говорит, чего не было, — *به بانک نرفتم*, а затем, что было, — *فلم دیدم*.
  prs.a2.unit19.lesson06.teach.turn01:
    title: Зармина спрашивает о прошедших выходных
    gloss: Хомаюн, что ты делал в прошлые выходные?
    note: '*چه کار کردی؟* означает «что ты делал?». Вопрос о завершённом действии, поэтому используется прошедшее время *کردی*.'
  prs.a2.unit19.lesson06.teach.turn02:
    title: Хомаюн рассказывает о своих делах и о визите
    gloss: В четверг после обеда у меня было несколько дел. Сначала я пошёл в банк, потом купил на базаре хлеб и фрукты. В пятницу я ходил навестить родных.
    note: Хомаюн перечисляет дела по порядку с помощью *اول* и *بعد*, а затем переходит к пятнице.
  prs.a2.unit19.lesson06.teach.turn03:
    title: Зармина спрашивает о спорте
    gloss: Ты занимался спортом?
    note: Вопрос с ответом «да» или «нет» о завершённом действии, с глаголом в прошедшем времени *کردی*.
  prs.a2.unit19.lesson06.teach.turn04:
    title: Хомаюн отвечает «нет» и задаёт встречный вопрос
    gloss: Нет, спортом я не занимался. А ты?
    note: '*نخیر، ورزش نکردم* — ответ глаголом в отрицательной форме прошедшего времени. *تو چطور؟* — короткий способ спросить «а ты?».'
  prs.a2.unit19.lesson06.teach.turn05:
    title: Зармина рассказывает о своих выходных
    gloss: В четверг я смотрела фильм. В пятницу я ходила с друзьями на базар, но ничего не покупала.
    note: 'Зармина использует *ولی*, чтобы противопоставить то, что она сделала (пошла на базар), тому, чего не сделала: *خرید نکردم*.'
  prs.a2.unit19.lesson06.teach.turn06:
    title: Хомаюн реагирует
    gloss: Как хорошо!
    note: '*چه خوب!* означает «как хорошо!» — доброжелательная реакция на хорошую новость.'
exercises:
