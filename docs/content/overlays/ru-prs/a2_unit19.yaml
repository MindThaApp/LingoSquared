  prs.a2.unit19.lesson01.exercise04.match_go_forms:
    instruction: Соедини каждое слово на дари с его значением.
    accepted_answers:
    - value:
        رفتم: я пошёл / я пошла
        رفتی: ты ходил (другу)
        رفت: он или она ходил(а)
        رفتیم: мы ходили
        رفتین: вы ходили (вежливо или мн. ч.)
        رفتند: они ходили
        بازار: базар
        بانک: банк
        پارک: парк
      status: correct
    feedback: 'Окончание показывает, кто ходил: *-م* — я, *-ی* — ты (друг), без окончания — он или она, *-یم* — мы, *-ین* — вы (вежливо или во множественном числе), *-ند* — они.'
    pairs:
    - left: رفتم
      right: я пошёл / я пошла
    - left: رفتی
      right: ты ходил (другу)
    - left: رفت
      right: он или она ходил(а)
    - left: رفتیم
      right: мы ходили
    - left: رفتین
      right: вы ходили (вежливо или мн. ч.)
    - left: رفتند
      right: они ходили
    - left: بازار
      right: базар
    - left: بانک
      right: банк
    - left: پارک
      right: парк
