      status: correct
    feedback: В *بعد از مکتب با دوستانم فوتبال بازی می‌کردم* глагол привычного действия *بازی می‌کردم* стоит в конце.
  prs.a2.unit23.lesson02.exercise05.complete_tea:
    instruction: 'Закончи предложение глаголом в прошедшем многократном: «Каждое утро я пил чай».'
    accepted_answers:
    - value: می‌خوردم
      status: correct
    feedback: '*می‌خوردم* — прошедшее многократное от *خوردن* с окончанием *-م*. *می‌* показывает привычку, а *-م* — «я».'
  prs.a2.unit23.lesson02.exercise06.translate_read:
    instruction: 'Переведи на дари, используя می‌ и основу прошедшего времени глагола خواندن: «Каждый вечер я читал книгу».'
    accepted_answers:
    - value: هر شب کتاب می‌خواندم.
      status: correct
    - value: من هر شب کتاب می‌خواندم.
      status: correct
    - value: هر شب یک کتاب می‌خواندم.
      status: correct
    - value: من هر شب یک کتاب می‌خواندم.
      status: correct
    feedback: '*هر شب کتاب می‌خواندم.* — «Каждый вечер я читал книгу». *من* и *یک* можно опустить.'
  prs.a2.unit23.lesson03.exercise01.recognize_one_day:
    instruction: Что означает это предложение?
    correct_option: Однажды я пошёл на базар
    distractors:
    - Я ходил на базар каждый день
    - Каждый день я хожу на базар
    - Я не ходил на базар
    accepted_answers:
    - value: Однажды я пошёл на базар
      status: correct
    feedback: '*یک روز* вводит одно событие, поэтому у глагола *رفتم* нет *می‌*: «однажды я пошёл на базар».'
  prs.a2.unit23.lesson03.exercise02.recognize_no_longer:
    instruction: Что означает это предложение?
    correct_option: я больше не играю в футбол
    distractors:
    - я играл в футбол
    - Вчера я не играл в футбол
    - Я снова буду играть в футбол
    accepted_answers:
    - value: я больше не играю в футбол
      status: correct
    feedback: '*دیگر ... نمی‌کنم* — «больше не»: предложение о настоящем, а футбол остался в прошлом.'
  prs.a2.unit23.lesson03.exercise03.match_three_forms:
    instruction: Соедини каждое слово или форму на дари с её значением.
    accepted_answers:
    - value:
        رفتم: я сходил, я пошёл (одно завершённое событие)
        می‌رفتم: я ходил (повторяющаяся привычка)
        می‌روم: я иду, я хожу (сейчас)
        نرفتم: я не ходил (один раз)
        نمی‌رفتم: я обычно не ходил (привычка)
        نمی‌روم: я не хожу (сейчас)
        قبلاً: раньше, в прошлом
        حالا: сейчас
        یک روز: однажды
        هر روز: каждый день
      status: correct
    feedback: Без *می‌* — одно завершённое событие. *می‌* + основа прошедшего времени — привычка в прошлом. *می‌* + основа настоящего времени (*رو*) — «сейчас». Приставка *ن* отрицает простое прошедшее, а *نمی‌* — две другие формы.
    pairs:
    - left: رفتم
      right: я сходил, я пошёл (одно завершённое событие)
    - left: می‌رفتم
      right: я ходил (повторяющаяся привычка)
    - left: می‌روم
      right: я иду, я хожу (сейчас)
    - left: نرفتم
      right: я не ходил (один раз)
    - left: نمی‌رفتم
      right: я обычно не ходил (привычка)
    - left: نمی‌روم
      right: я не хожу (сейчас)
    - left: قبلاً
      right: раньше, в прошлом
    - left: حالا
      right: сейчас
    - left: یک روز
      right: однажды
    - left: هر روز
      right: каждый день
  prs.a2.unit23.lesson03.exercise04.order_then_now:
    instruction: 'Расставь слова так, чтобы получилось: «Раньше я ходил в школу, а теперь хожу в офис».'
    accepted_answers:
    - value:
      - قبلاً
      - به
      - مکتب
      - می‌رفتم
      - ولی
      - حالا
      - به
      - دفتر
      - می‌روم
      status: correct
    feedback: '*قبلاً به مکتب می‌رفتم، ولی حالا به دفتر می‌روم.* Прошедшее многократное связано с *قبلاً*, а настоящее — с *حالا*.'
  prs.a2.unit23.lesson03.exercise05.complete_then_now:
    instruction: 'Закончи предложение глаголом в прошедшем многократном («я ходил»): «Раньше я каждый день ходил в школу, а теперь хожу в офис».'
    accepted_answers:
    - value: می‌رفتم
      status: correct
    feedback: '*می‌رفتم* — прошедшее многократное, оно согласуется с *قبلاً هر روز*. Вторая половина, *حالا ... می‌روم*, — настоящее время.'
  prs.a2.unit23.lesson03.exercise06.translate_no_longer:
    instruction: 'Переведи на дари, используя دیگر и глагол в отрицательной форме настоящего времени: «Я больше не хожу в школу».'
    accepted_answers:
    - value: دیگر به مکتب نمی‌روم.
      status: correct
    - value: من دیگر به مکتب نمی‌روم.
      status: correct
    - value: حالا دیگر به مکتب نمی‌روم.
      status: correct
    - value: من حالا دیگر به مکتب نمی‌روم.
      status: correct
    feedback: '*دیگر به مکتب نمی‌روم.* — «Я больше не хожу в школу». *من* и *حالا* можно опустить.'
  prs.a2.unit23.lesson04.exercise01.recognize_neighbours:
