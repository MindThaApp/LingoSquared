course:
  title: Дари A2
  description: 'Дари Афганистана, уровень ниже среднего: рассказ о том, как жизнь шла раньше — в детстве, в прежнем доме или на прежней работе, — и как она устроена теперь. Прошедшее habitual-время (می‌ плюс основа прошедшего), его отрицание и сравнение с простым прошедшим и настоящим.'
units:
  prs.a2.unit23.how_it_used_to_be:
    title: Как жизнь шла раньше
lessons:
  prs.a2.unit23.lesson01.then_and_now_words:
    title: Слова «раньше и теперь» и форма повторяющегося действия
  prs.a2.unit23.lesson02.more_verbs:
    title: Прошедшее повторяющегося действия с другими глаголами
  prs.a2.unit23.lesson03.past_or_habit_or_now:
    title: Простое прошедшее, прошедшее повторяющегося действия, настоящее и отрицание
  prs.a2.unit23.lesson04.my_old_life:
    title: 'Моя прежняя жизнь: район, школа и работа'
  prs.a2.unit23.lesson05.reading_and_listening:
    title: Читаем и слушаем о детстве
  prs.a2.unit23.lesson06.conversation_then_and_now:
    title: Разговор о прошлом и настоящем
teaching:
  prs.a2.unit23.lesson01.teach.before:
    title: Раньше, в прошлом
    gloss: раньше, прежде, в прошлом
    note: '*قبلاً* обращает взгляд к более раннему времени твоей жизни. С этого слова начинается большинство предложений о том, как было раньше: *قبلاً در هرات زندگی می‌کردم.* Само по себе оно не делает глагол повторяющимся; это делает глагол, как ты увидишь ниже.'
    example_gloss: Раньше я жил в Герате.
  prs.a2.unit23.lesson01.teach.now:
    title: Сейчас
    gloss: сейчас, теперь
    note: '*حالا* значит «сейчас» — это вторая половина любого сравнения «раньше и теперь». После *حالا* глагол стоит в обычном настоящем времени: *حالا در کابل زندگی می‌کنم.*'
    example_gloss: Теперь я живу в Кабуле.
  prs.a2.unit23.lesson01.teach.every_day:
    title: Каждый день
    gloss: каждый день
    note: '*هر* значит «каждый», а *روز* — «день». *هر روز* — самое ясное выражение времени для повторяющегося действия, и в прошлом, и в настоящем.'
    example_gloss: Каждый день я ходил в школу.
  prs.a2.unit23.lesson01.teach.always:
    title: Всегда
    gloss: всегда
    note: '*همیشه* значит «всегда». Как и *هر روز*, это слово естественно сочетается с привычным действием и показывает, что что-то происходило снова и снова.'
    example_gloss: Я всегда играл с друзьями.
  prs.a2.unit23.lesson01.teach.when_small:
    title: Когда я был маленьким
    gloss: когда я был маленьким, когда я был ребёнком
    note: '*وقتی* значит «когда», *کوچک* — «маленький», а *بودم* — «я был». Вместе *وقتی کوچک بودم* — обычное начало рассказа о своём детстве.'
  prs.a2.unit23.lesson01.teach.school:
    title: Школа
    gloss: школа
    note: '*مکتب* — обычное афганское слово для школы. Ученик — *شاگرد*, но здесь тебе нужно только *مکتب*.'
    example_gloss: Я хожу в школу каждый день.
  prs.a2.unit23.lesson01.teach.on_foot:
    title: Пешком
    gloss: пешком
    note: '*پیاده* значит «пешком». Оно стоит перед глаголом: *پیاده به مکتب می‌رفتم* — «я ходил в школу пешком».'
    example_gloss: Я хожу в школу пешком.
  prs.a2.unit23.lesson01.teach.cities:
    title: Герат, Кабул
    gloss: Герат, Кабул
    note: '*هرات* и *کابل* — два афганских города. Перед названиями городов ставится *در* («в»): *در هرات* — «в Герате», *در کابل* — «в Кабуле».'
    example_gloss:
    - Он или она в Герате.
    - Мы в Кабуле.
  prs.a2.unit23.lesson01.teach.to_live:
    title: Жить
    gloss: жить, проживать где-то
    note: '*زندگی کردن* значит «жить» в смысле проживать в каком-то месте. *زندگی* — «жизнь», а *کردن* — глагол, который принимает окончания: *زندگی می‌کنم* — «я живу».'
    example_gloss: Мы живём в Кабуле.
  prs.a2.unit23.lesson01.teach.go_paradigm:
    title: 'Прошедшее повторяющегося действия: می + основа прошедшего + окончания'
    gloss: я ходил, ты ходил, он или она ходил(а), мы ходили, вы ходили (вежливо или мн. ч.), они ходили
    note: 'Чтобы сказать, что происходило снова и снова, поставь *می‌* перед основой прошедшего времени и добавь те же окончания, что ты знаешь из простого прошедшего. Основа прошедшего у глагола *رفتن* («идти, ходить») — *رفت* (отбрось конечное *ن*). Получается: *می‌رفتم* (я ходил), *می‌رفتی* (ты, другу), *می‌رفت* (он или она), *می‌رفتیم* (мы), *می‌رفتین* (вы, вежливо или мн. ч.) и *می‌رفتند* (они). Сравни простое прошедшее *رفتم* — одно завершённое событие, и настоящее *می‌روم*, которое образуется от основы настоящего *رو*. Такую форму можно передать по-русски и как «я обычно ходил», и как «я ходил (бывало)». Местоимение (*من، تو، او*) необязательно, потому что окончание уже показывает лицо. Не путай *می‌رفتم* и *می‌روم*: перед окончанием меняется лишь одна буква, но первая форма — прошлое, а вторая — настоящее.'
  prs.a2.unit23.lesson01.teach.do_forms:
    title: 'То же правило, новый глагол: делать'
    gloss: я делал, ты делал, он или она делал(а), мы делали, вы делали (вежливо или мн. ч.), они делали
    note: 'У глагола *کردن* («делать») основа прошедшего — *کرد*. Прошедшее повторяющегося действия: *می‌کردم، می‌کردی، می‌کرد، می‌کردیم، می‌کردین، می‌کردند*. Этот глагол очень полезен, потому что многие глаголы дари состоят из существительного и *کردن*: *زندگی کردن* («жить»), *بازی کردن* («играть»), *کار کردن* («работать»). *می‌* и окончание всегда присоединяются к *کردن*, а не к существительному: *زندگی می‌کردم* — «я жил».'
  prs.a2.unit23.lesson01.teach.zwnj:
    title: 'Написание: после می‌ и نمی‌ ставится полупробел'
    gloss: я ходил (обычно) и я обычно не ходил
    note: 'На письме *می‌* и *نمی‌* — отдельные приставки, поэтому после них ставится непробельный разделитель нулевой ширины (ZWNJ, «полупробел»): *می‌رفتم*, *نمی‌رفتم*. Они не соединяются с глаголом, но и не отделяются полным пробелом. Если ты печатаешь на персидской клавиатуре, используй клавишу полупробела (часто Shift плюс пробел) после *می* и *نمی*. Тот же полупробел ставится во множественном числе с *ها* и в слове *آن‌ها*.'
  prs.a2.unit23.lesson02.teach.eat_paradigm:
    title: 'То же правило, новый глагол: есть'
    gloss: я обычно ел(а), ты обычно ел(а), он или она обычно ел(а), мы обычно ели, вы (вежливая форма или мн. число) обычно ели, они обычно ели
    note: 'Правило глагола *رفتن* работает для всех правильных глаголов. У *خوردن* (есть) отпадает *ن*, и получается основа прошедшего времени *خورد*. Поставь перед ней *می‌* и добавь окончания: *می‌خوردم، می‌خوردی، می‌خورد، می‌خوردیم، می‌خوردین، می‌خوردند*. Форма «он, она» — это просто основа с *می‌*, поэтому *می‌خورد* значит «он или она обычно ел(а)».'
  prs.a2.unit23.lesson02.teach.tea:
    title: Чай
    gloss: чай
    note: '*چای* — это чай, напиток, который афганцы пьют почти за каждой едой. Ты *چای می‌خوری*, то есть пьёшь чай, и для этого используется глагол *خوردن*.'
    example_gloss: Каждое утро я пил(а) чай.
  prs.a2.unit23.lesson02.teach.morning:
    title: Утро
    gloss: утро, утром
    note: '*صبح* — это утро. *هر روز صبح* — каждое утро, а *هر شب* — каждый вечер или каждую ночь.'
    example_gloss: Каждое утро я ходил(а) в школу.
  prs.a2.unit23.lesson02.teach.night:
    title: Ночь
    gloss: ночь, вечер
    note: '*شب* — это ночь или вечер. *هر شب* — каждый вечер, каждую ночь. Это слово повторения из уроков о распорядке дня.'
    example_gloss: Каждый вечер я читал(а) книгу.
  prs.a2.unit23.lesson02.teach.book:
    title: Книга
    gloss: книга
    note: '*کتاب* — это книга. С глаголом *خواندن* (читать) говорят *کتاب خواندن* — читать книгу. С тем же глаголом говорят и *درس خواندن* — учиться.'
    example_gloss: Я читал(а) книгу.
  prs.a2.unit23.lesson02.teach.football:
    title: Играть в футбол
    gloss: играть в футбол
    note: '*بازی کردن* — играть, а *فوتبال* — футбол. Как и в других глаголах вида «существительное + *کردن*», *می‌* и окончание присоединяются к *کردن*: *فوتبال بازی می‌کردم*.'
    example_gloss: Я играл(а) в футбол с друзьями.
  prs.a2.unit23.lesson02.teach.after_school:
    title: После школы
    gloss: после школы
    note: '*بعد از* значит «после», и за ним следует существительное: *بعد از مکتب* — после школы.'
    example_gloss: После школы я приходил(а) домой.
  prs.a2.unit23.lesson02.teach.friends:
    title: Мои друзья
    gloss: мои друзья
    note: '*دوستان* — друзья, а *-م* добавляет «мои»: *دوستانم* — мои друзья, слово для повторения. «С» передаётся словом *با*: *با دوستانم*.'
    example_gloss: Мои друзья приходили к нам домой.
  prs.a2.unit23.lesson02.teach.more_verbs:
    title: Ещё четыре глагола, одно правило
    gloss: видеть, делать, приходить, читать в многократном прошедшем времени
    note: 'Каждый правильный глагол образует эту форму одинаково: убери *ن* из инфинитива и поставь *می‌* перед основой прошедшего времени с окончаниями. *دیدن* (видеть) даёт *می‌دیدم*. *کردن* (делать) даёт *می‌کردم*. *آمدن* (приходить) даёт *می‌آمدم*; основа *آمد* после *می‌* сохраняет долгое *آ*, поэтому пиши *می‌آمدم*, а не *می‌امدم*. *خواندن* (читать, учиться) даёт *می‌خواندم*. Эта форма используется и в разговорной, и в письменной речи.'
  prs.a2.unit23.lesson02.teach.be_have:
    title: Быть и иметь в прошедшем времени
    gloss: я был(а), ты был(а), он или она был(а), мы были, вы (вежливая форма или мн. число) были, они были; у меня был, у тебя был, ...
    note: 'Прошедшее время глагола *بودن* (быть) — *بودم، بودی، بود، بودیم، بودین، بودند*, а глагола *داشتن* (иметь) — *داشتم، داشتی، داشت، داشتیم، داشتین، داشتند*. Эти два глагола описывают состояния, поэтому они уже означают «был» и «имел» в длительном смысле, и *می‌* обычно не добавляется: *وقتی کوچک بودم، یک بایسکل داشتم* — «когда я был маленьким, у меня был велосипед».'
  prs.a2.unit23.lesson02.teach.bicycle:
    title: Велосипед
    gloss: велосипед
    note: '*بایسکل* — афганское слово для велосипеда. *یک* значит «один» или «какой-то».'
    example_gloss: Когда я был маленьким, у меня был велосипед.
  prs.a2.unit23.lesson03.teach.contrast:
    title: Одно событие, привычка или настоящее
    gloss: Однажды я пошёл на базар. Каждый день я ходил в школу. Теперь я хожу в офис.
    note: 'Три глагольные формы могут выглядеть похоже, поэтому спроси себя, о чём предложение. Если это ОДНО завершённое событие, используй простое прошедшее: *یک روز به بازار رفتم* (однажды я пошёл на базар). Если действие повторялось в прошлом снова и снова, используй *می‌* с основой прошедшего времени: *هر روز به مکتب می‌رفتم* (каждый день я ходил в школу). Если это верно сейчас, используй *می‌* с основой настоящего времени: *حالا به دفتر می‌روم* (сейчас я хожу в офис). Слова времени помогают: *یک روز، دیروز* сочетаются с простым прошедшим; *هر روز، همیشه، قبلاً* — с многократным прошедшим; *حالا* — с настоящим.'
  prs.a2.unit23.lesson03.teach.one_day:
    title: Однажды
    gloss: однажды, один раз
    note: '*یک روز* значит «однажды». Это слово вводит ОДНО событие в прошлом, поэтому глагол стоит в простом прошедшем времени без *می‌*.'
    example_gloss: Однажды я пошёл на базар.
  prs.a2.unit23.lesson03.teach.yesterday:
    title: Вчера
    gloss: вчера
    note: '*دیروز* — вчера. Это слово указывает на один завершённый день, поэтому глагол стоит в простом прошедшем: *دیروز به دفتر رفتم*.'
    example_gloss: Вчера я ходил(а) в офис.
  prs.a2.unit23.lesson03.teach.office:
    title: Офис
    gloss: офис
    note: '*دفتر* — офис, место работы. Туда идут с предлогом *به*.'
    example_gloss: Теперь я каждый день хожу в офис.
  prs.a2.unit23.lesson03.teach.bus:
    title: Автобус
    gloss: автобус
    note: '*بس* — афганское слово для автобуса. «На чём» передаётся словом *با*: *با بس* — на автобусе.'
    example_gloss: Я езжу в офис на автобусе.
  prs.a2.unit23.lesson03.teach.neg_paradigm:
    title: 'Отрицательное многократное прошедшее: نمی + основа прошедшего времени'
    gloss: я не ходил(а), ты не ходил(а), он или она не ходил(а), мы не ходили, вы (вежливая форма или мн. число) не ходили, они не ходили
    note: 'Чтобы сказать, что что-то обычно НЕ происходило, поставь *نمی‌* вместо *می‌*: *نمی‌رفتم* (я не ходил(а), я никогда не ходил(а)), *نمی‌رفتی، نمی‌رفت، نمی‌رفتیم، نمی‌رفتین، نمی‌رفتند*. Не путай это с простым отрицательным прошедшим *نرفتم*, которое говорит, что одно завершённое событие не произошло. Сравни: *دیروز به مکتب نرفتم* (вчера я не ходил(а) в школу) и *جمعه به مکتب نمی‌رفتم* (по пятницам я не ходил(а) в школу — как привычка). Пиши с полупробелом: *نمی‌*.'
  prs.a2.unit23.lesson03.teach.no_longer:
    title: 'Больше не: دیگر + отрицание'
    gloss: Я больше не играю в футбол.
    note: '*دیگر* с отрицательным глаголом значит «больше не»: *دیگر فوتبال بازی نمی‌کنم* — «я больше не играю в футбол». Глагол стоит в отрицательном настоящем *نمی‌کنم*, потому что предложение о настоящем. Когда говорят о том, что делал раньше и перестал, часто соединяют две части: *قبلاً هر روز فوتبال بازی می‌کردم، ولی دیگر بازی نمی‌کنم* (раньше я каждый день играл(а) в футбол, но больше не играю).'
  prs.a2.unit23.lesson04.teach.neighbourhood:
    title: Район
    gloss: район, часть города
    note: '*محله* — это район, часть города, где ты живёшь. *قدیمی* значит «старый».'
    example_gloss: Наш дом был в старом районе.
  prs.a2.unit23.lesson04.teach.old:
    title: Старый
    gloss: старый (о месте или вещи)
    note: '*قدیمی* — «старый», о вещах и местах, которые существуют давно. Оно стоит после существительного: *محلهٔ قدیمی*.'
    example_gloss: У нас был старый дом.
  prs.a2.unit23.lesson04.teach.neighbours:
    title: Соседи
    gloss: соседи
    note: '*همسایه* — сосед. Множественное число образуется с полупробелом: *همسایه‌ها*. Соседи — важная часть жизни в афганском районе.'
    example_gloss: Соседи всегда приходили к нам домой.
  prs.a2.unit23.lesson04.teach.grandmother:
    title: Бабушка
    gloss: бабушка
    note: '*مادرکلان* — бабушка, стандартное слово. *-م* добавляет «моя»: *مادرکلانم* — моя бабушка.'
    example_gloss: По пятницам мы ходили навещать мою бабушку.
  prs.a2.unit23.lesson04.teach.fridays:
    title: По пятницам
    gloss: по пятницам, каждую пятницу
    note: '*جمعه‌ها* (пятницы, с полупробелом) значит «каждую пятницу». Это ещё один способ сказать, что что-то повторялось снова и снова.'
    example_gloss: По пятницам мы ходили в парк.
  prs.a2.unit23.lesson04.teach.shop:
    title: Магазин
    gloss: магазин
    note: '*دوکان* — афганское слово для магазина или лавки. *در دوکان کار کردن* — работать в магазине.'
    example_gloss: Раньше я работал(а) в магазине.
  prs.a2.unit23.lesson04.teach.where_before:
    title: Где ты раньше жил(а)?
    gloss: Где ты раньше жил(а)?
    note: '*کجا* значит «где». Друг спрашивает *قبلاً کجا زندگی می‌کردی؟*, используя многократное прошедшее в форме «ты» для друга. С малознакомым человеком скажи *می‌کردین*.'
  prs.a2.unit23.lesson05.teach.street:
    title: Улица
    gloss: улица, дорога
    note: '*سرک* — афганское слово для улицы или дороги. Играть или гулять можно *در سرک* — на улице.'
    example_gloss: Мы играли на улице.
  prs.a2.unit23.lesson05.teach.yes:
    title: Да
    gloss: да
    note: '*بلی* — «да» на дари, а противоположное слово — *نخیر* («нет»). Используй *بلی*, чтобы ответить на вопрос, на который отвечают «да» или «нет».'
    example_gloss: Да, я ходил(а) каждый день.
  prs.a2.unit23.lesson05.teach.but:
    title: Но
    gloss: но
    note: '*ولی* противопоставляет две вещи. В рассказе о прошлом и настоящем оно часто соединяет то, что было раньше, с тем, что теперь иначе.'
    example_gloss: Раньше я ходил(а), но теперь не хожу.
  prs.a2.unit23.lesson05.teach.read_text:
    title: Детство в Герате
    gloss: Когда я был маленьким, мы жили в Герате. Наш дом был в старом районе. Каждое утро я ходил в школу пешком. После школы я играл с друзьями в футбол на улице. По пятницам мы ходили навещать мою бабушку. Теперь я живу в Кабуле и езжу в офис на автобусе. Я больше не играю в футбол.
    note: 'Короткий письменный рассказ о детстве в Герате. Обрати внимание на смену времён: многократное прошедшее (*می‌رفتم، بازی می‌کردم، می‌رفتیم*) описывает прежнюю жизнь, а настоящее время (*زندگی می‌کنم، می‌روم*) описывает жизнь сейчас. Последнее предложение, *دیگر فوتبال بازی نمی‌کنم*, говорит о том, что прекратилось.'
  prs.a2.unit23.lesson05.teach.audio_q:
    title: Салима спрашивает Джавида о школе
    gloss: Джавид, ты каждый день ходил в школу?
    note: Салима спрашивает о прошлой привычке, используя многократное прошедшее в форме «ты» для друга, *می‌رفتی*. Это вопрос, на который отвечают «да» или «нет».
  prs.a2.unit23.lesson05.teach.audio_a:
    title: Джавид отвечает
    gloss: Да, я каждый день ходил пешком, но по пятницам не ходил.
    note: 'Сначала Джавид говорит, что он делал, потом — чего не делал: *جمعه نمی‌رفتم*. Отрицательное многократное прошедшее *نمی‌رفتم* показывает, что по пятницам он никогда не ходил.'
  prs.a2.unit23.lesson06.teach.turn01:
    title: Салима спрашивает Джавида, где он раньше жил
    gloss: Джавид, где ты раньше жил?
    note: Салима спрашивает о прошлом, используя *می‌کردی* — многократное прошедшее в форме «ты» для друга.
  prs.a2.unit23.lesson06.teach.turn02:
    title: Джавид рассказывает о своём детстве
    gloss: Когда я был маленьким, мы жили в Герате. Каждый день я ходил в школу пешком, а после школы играл с друзьями в футбол.
    note: 'Джавид использует многократное прошедшее для всего, что повторялось снова и снова: *زندگی می‌کردیم، می‌رفتم، بازی می‌کردم*.'
  prs.a2.unit23.lesson06.teach.turn03:
    title: Салима спрашивает о настоящем
    gloss: Ты и сейчас играешь в футбол?
    note: '*حالا هم* спрашивает о настоящем: «и сейчас тоже?» Глагол переходит в *می‌کنی* (настоящее время, «ты»).'
  prs.a2.unit23.lesson06.teach.turn04:
    title: Джавид рассказывает, что изменилось
    gloss: Нет, я больше не играю в футбол. Теперь я живу в Кабуле и езжу в офис на автобусе. А ты?
    note: '*دیگر ... نمی‌کنم* значит «больше не». Остальная часть ответа стоит в настоящем времени, потому что она о том, что сейчас. *تو چطور؟* — короткий способ сказать «а ты?».'
  prs.a2.unit23.lesson06.teach.turn05:
    title: Салима рассказывает о своей прежней работе
    gloss: Раньше я работала в магазине, а теперь работаю в офисе.
    note: Салима противопоставляет многократное прошедшее *کار می‌کردم* и настоящее *کار می‌کنم*, соединяя их словом *ولی*.
  prs.a2.unit23.lesson06.teach.turn06:
    title: Джавид реагирует
    gloss: Как хорошо!
    note: '*چه خوب!* — дружелюбная реакция на хорошую новость.'
exercises:
  prs.a2.unit23.lesson01.exercise01.recognize_every_day:
    instruction: Что означает это предложение?
    correct_option: Я каждый день ходил(а) в школу
    distractors:
    - Вчера я ходил(а) в школу
    - Теперь я каждый день хожу в школу
    - Я не ходил(а) в школу
    accepted_answers:
    - value: Я каждый день ходил(а) в школу
      status: correct
    feedback: '*هر روز به مکتب می‌رفتم* значит «я каждый день ходил(а) в школу»: *می‌* плюс основа прошедшего времени *رفت* плюс *-م*.'
  prs.a2.unit23.lesson01.exercise02.recognize_used_to_live:
    instruction: Что означает это предложение?
    correct_option: Раньше я жил(а) в Герате
    distractors:
    - Теперь я живу в Герате
    - Я буду жить в Герате
    - Я не жил(а) в Герате
    accepted_answers:
    - value: Раньше я жил(а) в Герате
      status: correct
    feedback: '*قبلاً در هرات زندگی می‌کردم* значит «раньше я жил(а) в Герате»: *می‌کردم* — многократное прошедшее глагола *کردن*.'
  prs.a2.unit23.lesson01.exercise03.recognize_always_played:
    instruction: Что означает это предложение?
    correct_option: Я всегда играл(а) с друзьями
    distractors:
    - Вчера я играл(а) с друзьями
    - Я никогда не играл(а) с друзьями
    - Сейчас я играю с друзьями
    accepted_answers:
    - value: Я всегда играл(а) с друзьями
      status: correct
    feedback: '*همیشه* («всегда») сочетается с прошедшим habitual-временем: *بازی می‌کردم* — «я (обычно) играл».'
  prs.a2.unit23.lesson01.exercise04.match_go_forms:
    instruction: Соедини каждое слово на дари с его значением.
    accepted_answers:
    - value:
        می‌رفتم: я ходил (обычно, раньше)
        می‌رفتی: ты ходил (обычно, раньше; другу)
        می‌رفت: он или она ходил(а) (обычно, раньше)
        می‌رفتیم: мы ходили (обычно, раньше)
        می‌رفتین: вы ходили (обычно, раньше; вежливо или мн. ч.)
        می‌رفتند: они ходили (обычно, раньше)
        قبلاً: раньше, в прошлом
        حالا: сейчас
        هر روز: каждый день
        همیشه: всегда
      status: correct
    feedback: 'Окончание показывает лицо: *-م* — я, *-ی* — ты (друг), без окончания — он или она, *-یم* — мы, *-ین* — вы (вежливо или мн. число), *-ند* — они. Приставка *می‌* делает прошедшее время многократным, привычным.'
    pairs:
    - left: می‌رفتم
      right: я ходил (обычно, раньше)
    - left: می‌رفتی
      right: ты ходил (обычно, раньше; другу)
    - left: می‌رفت
      right: он или она ходил(а) (обычно, раньше)
    - left: می‌رفتیم
      right: мы ходили (обычно, раньше)
    - left: می‌رفتین
      right: вы ходили (обычно, раньше; вежливо или мн. ч.)
    - left: می‌رفتند
      right: они ходили (обычно, раньше)
    - left: قبلاً
      right: раньше, в прошлом
    - left: حالا
      right: сейчас
    - left: هر روز
      right: каждый день
    - left: همیشه
      right: всегда
  prs.a2.unit23.lesson01.exercise05.order_walked_school:
    instruction: 'Расставь слова так, чтобы получилось: «Каждый день я ходил пешком в школу».'
    accepted_answers:
    - value:
      - هر روز
      - پیاده
      - به
      - مکتب
      - می‌رفتم
      status: correct
    - value:
      - پیاده
      - هر روز
      - به
      - مکتب
      - می‌رفتم
      status: correct
    - value:
      - هر روز
      - به
      - مکتب
      - پیاده
      - می‌رفتم
      status: correct
    feedback: В *هر روز پیاده به مکتب می‌رفتم* сначала стоит время, затем способ, а глагол привычного действия — в конце.
  prs.a2.unit23.lesson01.exercise06.translate_used_to_live:
    instruction: 'Переведи на дари, используя می‌ и основу прошедшего времени: «Раньше я жил в Герате».'
    accepted_answers:
    - value: قبلاً در هرات زندگی می‌کردم.
      status: correct
    - value: در هرات زندگی می‌کردم.
      status: correct
    - value: من قبلاً در هرات زندگی می‌کردم.
      status: correct
    - value: من در هرات زندگی می‌کردم.
      status: correct
    feedback: '*قبلاً در هرات زندگی می‌کردم.* — «Раньше я жил в Герате». *قبلاً* и *من* можно опустить.'
  prs.a2.unit23.lesson02.exercise01.recognize_ate:
    instruction: Что означает это предложение?
    correct_option: Каждое утро я пил чай
    distractors:
    - Сегодня утром я выпил чаю
    - Каждое утро я пью чай
    - Завтра утром я выпью чаю
    accepted_answers:
    - value: Каждое утро я пил чай
      status: correct
    feedback: '*می‌خوردم* — прошедшее многократное от *خوردن*: *چای می‌خوردم* — «я (обычно) пил чай».'
  prs.a2.unit23.lesson02.exercise02.recognize_friends_came:
    instruction: Что означает это предложение?
    correct_option: Мои друзья (обычно) приходили к нам домой
    distractors:
    - Мои друзья вчера пришли к нам домой
    - Мои друзья сейчас идут к нам домой
    - Мои друзья не пришли к нам домой
    accepted_answers:
    - value: Мои друзья (обычно) приходили к нам домой
      status: correct
    feedback: '*می‌آمدند* — «они (обычно) приходили»: окончание *-ند* указывает на нескольких человек.'
  prs.a2.unit23.lesson02.exercise03.match_habitual_verbs:
    instruction: Соотнеси каждый глагол в прошедшем времени с его значением.
    accepted_answers:
    - value:
        می‌خوردم: я обычно ел или пил
        می‌کردم: я обычно делал
        می‌دیدم: я обычно видел
        می‌آمدم: я обычно приходил
        می‌خواندم: я обычно читал
        بودم: я был
        داشتم: у меня было
        می‌خوردی: ты обычно ел или пил (другу)
        می‌آمد: он или она обычно приходил(а)
        می‌کردند: они обычно делали
      status: correct
    feedback: Большинство этих форм — *می‌* + основа прошедшего времени + окончание. *بودم* и *داشتم* обозначают состояния и *می‌* не принимают.
    pairs:
    - left: می‌خوردم
      right: я обычно ел или пил
    - left: می‌کردم
      right: я обычно делал
    - left: می‌دیدم
      right: я обычно видел
    - left: می‌آمدم
      right: я обычно приходил
    - left: می‌خواندم
      right: я обычно читал
    - left: بودم
      right: я был
    - left: داشتم
      right: у меня было
    - left: می‌خوردی
      right: ты обычно ел или пил (другу)
    - left: می‌آمد
      right: он или она обычно приходил(а)
    - left: می‌کردند
      right: они обычно делали
  prs.a2.unit23.lesson02.exercise04.order_football:
