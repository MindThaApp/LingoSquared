course:
  title: Дари A1
  description: 'Дари Афганистана для начинающих: счёт от одного до ста, вопросы о возрасте и ответы на них, обмен номерами телефонов.'
units:
  prs.a1.unit04.numbers:
    title: Счёт и числа
lessons:
  prs.a1.unit04.lesson01.numbers_one_to_ten:
    title: Счёт от одного до десяти
  prs.a1.unit04.lesson02.numbers_eleven_to_twenty:
    title: Счёт от одиннадцати до двадцати
  prs.a1.unit04.lesson03.tens:
    title: Десятки до ста
  prs.a1.unit04.lesson04.asking_age:
    title: Спросить о возрасте и назвать свой
  prs.a1.unit04.lesson05.phone_numbers:
    title: Обмен номерами телефонов
  prs.a1.unit04.lesson06.numbers_exchange_dialogue:
    title: Двое друзей сравнивают возраст и номера телефонов
teaching:
  prs.a1.unit04.lesson01.teach.one_to_three:
    title: Один, два, три
    gloss: 1, 2, 3
    note: یک، دو، سه — базовые персидские числительные, общие для дари и фарси.
    example_gloss:
    - У меня один брат.
    - У меня две книги.
    - У меня три сестры.
  prs.a1.unit04.lesson01.teach.four_to_six:
    title: Четыре, пять, шесть
    gloss: 4, 5, 6
    note: چهار — стандартная письменная форма; в разговорной речи некоторые произносят چار, но в этом курсе используется стандартное написание.
    example_gloss:
    - У меня четыре книги.
    - Подожди пять минут.
    - У него/неё шесть книг.
  prs.a1.unit04.lesson01.teach.seven_eight:
    title: Семь, восемь
    gloss: 7, 8
    note: هفت، هشت продолжают ряд чисел.
    example_gloss:
    - В неделе семь дней.
    - Я приду в восемь часов.
  prs.a1.unit04.lesson01.teach.nine_ten:
    title: Девять, десять
    gloss: 9, 10
    note: نه، ده завершают числа от одного до десяти.
    example_gloss:
    - В классе девять человек.
    - У меня десять пальцев.
  prs.a1.unit04.lesson02.teach.eleven_thirteen:
    title: Одиннадцать, двенадцать, тринадцать
    gloss: 11, 12, 13
    note: یازده، دوازده، سیزده — отдельные слова, а не простое сочетание единиц с десятком.
    example_gloss:
    - У меня занятие в одиннадцать.
    - В году двенадцать месяцев.
    - Ему/ей тринадцать лет.
  prs.a1.unit04.lesson02.teach.fourteen_sixteen:
    title: Четырнадцать, пятнадцать, шестнадцать
    gloss: 14, 15, 16
    note: چهارده، پانزده، شانزده продолжают числа второго десятка.
    example_gloss:
    - Я приду через четырнадцать дней.
    - У него/неё пятнадцать книг.
    - Ему/ей шестнадцать лет.
  prs.a1.unit04.lesson02.teach.seventeen_nineteen:
    title: Семнадцать, восемнадцать, девятнадцать
    gloss: 17, 18, 19
    note: هفده، هجده، نوزده завершают числа второго десятка.
    example_gloss:
    - У него/неё семнадцать книг.
    - Ему/ей восемнадцать лет.
    - Осталось девятнадцать дней.
  prs.a1.unit04.lesson02.teach.twenty:
    title: Двадцать
    gloss: '20'
    note: بیست открывает ряд десятков, подробно они разобраны в следующем уроке.
    example_gloss: У меня двадцать книг.
  prs.a1.unit04.lesson03.teach.twenty_thirty_forty:
    title: Двадцать, тридцать, сорок
    gloss: 20, 30, 40
    note: بیست، سی، چهل — названия десятков; каждое из них — отдельная форма, а не образовано по предсказуемой схеме.
    example_gloss:
    - Мне двадцать лет.
    - В этом месяце тридцать дней.
    - Ему/ей сорок лет.
  prs.a1.unit04.lesson03.teach.fifty_sixty:
    title: Пятьдесят, шестьдесят
    gloss: 50, 60
    note: پنجاه، شصت продолжают ряд десятков.
    example_gloss:
    - У него/неё пятьдесят книг.
    - Шестьдесят минут — это один час.
  prs.a1.unit04.lesson03.teach.seventy_eighty:
    title: Семьдесят, восемьдесят
    gloss: 70, 80
    note: هفتاد، هشتاد продолжают ряд десятков.
    example_gloss:
    - В этой книге семьдесят страниц.
    - У него/неё восемьдесят книг.
  prs.a1.unit04.lesson03.teach.ninety_hundred:
    title: Девяносто, сто
    gloss: 90, 100
    note: نود، صد завершают ряд чисел до ста.
    example_gloss:
    - Ему/ей девяносто лет.
    - У него/неё сто книг.
  prs.a1.unit04.lesson03.teach.combining_tens:
    title: Как соединять десятки и единицы
    gloss: 25 буквально — «двадцать и пять».
    note: 'Слово для десятков и слово для единиц соединяются с помощью و («и») — того же союза, который встречается и в других местах курса, например: بیست و پنج (25).'
  prs.a1.unit04.lesson04.teach.chand:
    title: Сколько
    gloss: сколько
    note: چند вводит вопрос о количестве, в том числе о возрасте.
    example_gloss: Сколько вам лет?
  prs.a1.unit04.lesson04.teach.sal_word:
    title: Год
    gloss: год
    note: سال используется, когда называют возраст; буквально — «годы».
    example_gloss: Мне двадцать лет.
  prs.a1.unit04.lesson04.teach.age_question_polite:
    title: Вежливо спросить о возрасте
    gloss: Сколько тебе лет?
    note: چند ساله استین؟ буквально значит «скольки вы лет?» и использует уважительную форму استین — так говорят с малознакомым человеком.
  prs.a1.unit04.lesson04.teach.age_question_informal:
    title: Спросить о возрасте близкого друга
    gloss: Сколько тебе лет?
    note: چند ساله استی؟ использует неформальную форму استی; её стоит оставить для близкого друга или ровесника — это то же правило обращения, что и в других частях курса.
  prs.a1.unit04.lesson04.teach.age_answer:
    title: Назвать свой возраст
    gloss: Мне 25 лет.
    note: بیست و پنج ساله استم состоит из числа, слова ساله («-летний») и استم.
  prs.a1.unit04.lesson05.teach.number_word:
    title: Номер
    gloss: номер
    note: نمبر — широко распространённое в повседневной речи афганцев слово (из персидского/английского) для обозначения номера, особенно номера телефона.
    example_gloss: Это мой номер телефона.
  prs.a1.unit04.lesson05.teach.telephone_word:
    title: Телефон
    gloss: телефон
    note: تلفن — стандартное слово для обозначения телефона.
    example_gloss: Мой телефон сломан.
  prs.a1.unit04.lesson05.teach.phone_question:
    title: Спросить номер телефона
    gloss: Какой у тебя номер телефона?
    note: نمبر تلفن‌تان چند است؟ строится по той же модели с چند, что и вопрос о возрасте, но применяется к номеру телефона.
  prs.a1.unit04.lesson05.teach.zero_word:
    title: Ноль
    gloss: ноль
    note: صفر нужен, чтобы произносить большинство афганских номеров телефона.
    example_gloss: Ноль — это число.
  prs.a1.unit04.lesson05.teach.phone_answer:
    title: Назвать свой номер телефона
    gloss: Мой номер телефона — 079-345-678.
    note: Афганские номера телефонов обычно называют короткими группами цифр, а не по одной цифре, как показано здесь.
  prs.a1.unit04.lesson06.teach.turn01:
    title: Хумаюн здоровается с Баширом
    gloss: Хумаюн спрашивает Башира, как у него дела, используя неформальное обращение, уместное между близкими друзьями.
    note: جور استی؟ показывает, что эти двое уже близкие друзья, поэтому во всём диалоге уместно неформальное обращение.
  prs.a1.unit04.lesson06.teach.turn02:
    title: Башир отвечает и спрашивает о возрасте Хумаюна
    gloss: Башир говорит, что у него всё хорошо, и спрашивает, сколько Хумаюну лет.
    note: چند ساله استی؟ использует неформальное обращение, что соответствует их дружбе.
  prs.a1.unit04.lesson06.teach.turn03:
    title: Хумаюн отвечает и задаёт тот же вопрос в ответ
    gloss: Хумаюн говорит, что ему 28, и задаёт Баширу тот же вопрос.
    note: Здесь напрямую повторяется модель ответа о возрасте из урока 4.
  prs.a1.unit04.lesson06.teach.turn04:
    title: Башир отвечает
    gloss: Башир говорит, что ему 26.
    note: Это завершает обмен репликами о возрасте.
  prs.a1.unit04.lesson06.teach.turn05:
    title: Хумаюн спрашивает номер телефона Башира
    gloss: Хумаюн спрашивает номер телефона Башира.
    note: تلفنت использует неформальное притяжательное окончание, что соответствует стилю всего остального диалога.
  prs.a1.unit04.lesson06.teach.turn06:
    title: Башир называет свой номер телефона
    gloss: Башир называет свой номер телефона короткими группами цифр.
    note: Номер произносится так же естественно, группами, как в примере из урока 5.
  prs.a1.unit04.lesson06.teach.turn07:
    title: Хумаюн подтверждает, что сохранил номер
    gloss: Хумаюн благодарит и говорит, что сейчас же сохранит номер.
    note: سیف می‌کنم (от английского «save») — распространённое неформальное афганское заимствование из мира технологий, уместное в непринуждённом разговоре между друзьями.
