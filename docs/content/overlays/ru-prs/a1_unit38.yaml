course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: называть и описывать цвета повседневных предметов, спрашивать, какого цвета что-то, говорить и спрашивать о цветовых предпочтениях и описывать чей-то дом в коротком тексте.'
units:
  prs.a1.unit38.colors:
    title: Цвета
    description: Называй и описывай цвета повседневных предметов.
lessons:
  prs.a1.unit38.lesson01.primary_colors:
    title: Основные цвета
  prs.a1.unit38.lesson02.more_colors:
    title: Другие цвета
  prs.a1.unit38.lesson03.asking_about_colors:
    title: Вопросы о цвете
  prs.a1.unit38.lesson04.colors_dialogue:
    title: Диалог о цветах
  prs.a1.unit38.lesson05.colors_reading:
    title: Читаем о цветах
  prs.a1.unit38.lesson06.wrap_up:
    title: Итоги
teaching:
  prs.a1.unit38.lesson01.teach.review_basics:
    title: 'Повторение: цвет, есть, чёрный, белый, красный'
    gloss: цвет / есть / чёрный / белый / красный
    note: Слова رنگ, است, سیاه, سفید и سرخ повторяются на протяжении всего урока.
    target_text: رنگ (цвет) / است (есть, является) / سیاه (чёрный) / سفید (белый) / سرخ (красный)
  prs.a1.unit38.lesson01.teach.review_objects:
    title: 'Повторение: этот, рубашка, машина, книга, я, и, но'
    gloss: этот / рубашка / машина / книга / я / и / но
    note: Слова این, پیراهن, موتر, کتاب, من, و и اما повторяются и помогают строить предложения о цветах в этом уроке.
    target_text: این (этот) / پیراهن (рубашка) / موتر (машина) / کتاب (книга) / من (я) / و (и) / اما (но)
  prs.a1.unit38.lesson01.teach.abi_word:
    title: Синий
    gloss: синий
    note: آبی — стандартное слово дари для синего цвета.
    example_gloss: Машина синяя.
  prs.a1.unit38.lesson01.teach.zard_word:
    title: Жёлтый
    gloss: жёлтый
    note: زرد означает «жёлтый».
    example_gloss: Эта рубашка жёлтая.
  prs.a1.unit38.lesson01.teach.sabz_word:
    title: Зелёный
    gloss: зелёный
    note: سبز означает «зелёный».
    example_gloss: Книга зелёная.
  prs.a1.unit38.lesson01.teach.narenji_word:
    title: Оранжевый
    gloss: оранжевый
    note: نارنجی означает «оранжевый» (цвет).
    example_gloss: Эта рубашка оранжевая.
  prs.a1.unit38.lesson01.teach.blue_and_white_phrase:
    title: Моя рубашка синяя с белым
    gloss: Моя рубашка синяя с белым.
    note: Союз و соединяет два цвета в одно предложение.
  prs.a1.unit38.lesson01.teach.black_but_orange_phrase:
    title: Машина чёрная, а рубашка оранжевая
    gloss: Машина чёрная, а рубашка оранжевая.
    note: اما противопоставляет цвета двух разных предметов в одном предложении.
  prs.a1.unit38.lesson02.teach.review_house:
    title: 'Повторение: дом'
    gloss: дом
    note: خانه — слово для повторения, оно используется в предложениях о цветах в этом уроке.
    target_text: خانه (дом)
  prs.a1.unit38.lesson02.teach.khakestari_word:
    title: Серый
    gloss: серый
    note: خاکستری означает «серый».
    example_gloss: Машина серая.
  prs.a1.unit38.lesson02.teach.banafsh_word:
    title: Фиолетовый
    gloss: фиолетовый
    note: بنفش означает «фиолетовый».
    example_gloss: Эта рубашка фиолетовая.
  prs.a1.unit38.lesson02.teach.qahwei_word:
    title: Коричневый
    gloss: коричневый
    note: قهوه‌یی буквально связано со словом قهوه (кофе) — цвета кофе; это стандартное дари-слово для коричневого.
    example_gloss: Дом коричневый.
  prs.a1.unit38.lesson02.teach.gray_and_brown_phrase:
    title: Дом серый и коричневый
    gloss: Дом серый и коричневый.
    note: Два цвета одного предмета соединяются с помощью و.
  prs.a1.unit38.lesson02.teach.purple_but_blue_phrase:
    title: Рубашка фиолетовая, а книга синяя
    gloss: Рубашка фиолетовая, а книга синяя.
    note: اما противопоставляет цвета двух разных предметов.
  prs.a1.unit38.lesson03.teach.review_what_which:
    title: 'Повторение: что, какой'
    gloss: что / какой
    note: چه и کدام — уже знакомые слова, с их помощью спрашивают о цвете.
    target_text: چه (что, какой) / کدام (который, какой)
  prs.a1.unit38.lesson03.teach.what_color_question_phrase:
    title: Какого цвета эта книга?
    gloss: Какого цвета эта книга?
    note: 'این کتاب چه رنگ است؟ буквально: «эта книга какой цвет есть?» — это естественный способ спросить о цвете предмета.'
  prs.a1.unit38.lesson03.teach.review_like_formal:
    title: 'Повторение: вам нравится (вежливо), показатель прямого объекта'
    gloss: вам нравится (вежливо) / показатель прямого объекта
    note: دوست دارین и را — уже знакомые формы, с их помощью спрашивают о предпочтениях в цвете.
    target_text: دوست دارین (вы любите, вежливая форма) / را (показатель прямого дополнения)
  prs.a1.unit38.lesson03.teach.which_color_like_question_phrase:
    title: Какой цвет вам нравится?
    gloss: Какой цвет вам нравится?
    note: 'کدام رنگ را دوست دارین؟ буквально: «какой цвет [показатель объекта] любите?»'
  prs.a1.unit38.lesson03.teach.i_like_green_phrase:
    title: Я люблю зелёный цвет
    gloss: Я люблю зелёный цвет.
    note: دوست دارم — форма 1-го лица от دوست داشتن («любить, нравиться»).
  prs.a1.unit38.lesson04.teach.review_dialogue_words:
    title: 'Повторение: вы (вежливо)'
    gloss: вы (вежливое)
    note: شما — слово для повторения, оно используется в диалоге о цветах.
    target_text: شما (вы, вежливая форма)
  prs.a1.unit38.lesson04.teach.dialogue_line1:
    title: 'Хумаюн: Зармина, какого цвета твоя машина?'
    gloss: Зармина, какого цвета ваша машина?
  prs.a1.unit38.lesson04.teach.dialogue_line2:
    title: 'Зармина: Моя машина синяя.'
    gloss: Моя машина синяя.
  prs.a1.unit38.lesson04.teach.dialogue_line3:
    title: 'Хумаюн: Какого цвета ваша рубашка?'
    gloss: Какого цвета ваша рубашка?
  prs.a1.unit38.lesson04.teach.dialogue_line4:
    title: 'Зармина: Моя рубашка зелёная с белым.'
    gloss: Моя рубашка зелёная с белым.
  prs.a1.unit38.lesson04.teach.dialogue_line5:
    title: 'Хумаюн: Какой цвет вам нравится?'
    gloss: Какой цвет вам нравится?
  prs.a1.unit38.lesson04.teach.dialogue_line6:
    title: 'Зармина: Мне нравится синий цвет.'
    gloss: Я люблю синий цвет.
  prs.a1.unit38.lesson05.teach.review_reading_words:
    title: 'Повторение: он/она, комната, стол, ему/ей нравится'
    gloss: он/она / комната / стол / ему/ей нравится
    note: او, اتاق и میز — слова для повторения; دوست دارد — форма 3-го лица от دوست داشتن («любить, нравиться»), которая встречалась в курсе и для других лиц.
    target_text: او (он/она) / اتاق (комната) / میز (стол) / دوست دارد (он/она любит)
  prs.a1.unit38.lesson05.teach.reading_passage:
    title: Чтение о доме Зармины
    gloss: Это дом Зармины. Её дом бело-синий. Её комната зелёная. Её стол коричневый. Ей нравится зелёный цвет.
  prs.a1.unit38.lesson06.teach.review_like_dislike:
    title: 'Повторение: мне нравится, мне не нравится'
    gloss: мне нравится / мне не нравится
    note: دوست دارم и دوست ندارم — утвердительная и отрицательная формы от دوست داشتن («любить, нравиться»), впервые встретившиеся в lesson03; в этом заключительном уроке они противопоставляются с помощью اما.
    target_text: دوست دارم (я люблю) / دوست ندارم (я не люблю)
  prs.a1.unit38.lesson06.teach.contrast_phrase:
    title: Я люблю красный, но не люблю чёрный
    gloss: Я люблю красный цвет, но не люблю чёрный.
    note: اما противопоставляет любимый цвет нелюбимому; вместе используются دوست دارم и دوست ندارم.
  prs.a1.unit38.lesson06.teach.formal_question_phrase:
    title: Какой цвет вам нравится?
    gloss: А вам какой цвет нравится?
    note: Добавляется شما (вы, вежливо) к тому же вопросу из lesson03/04, теперь он обращён прямо к тебе.
