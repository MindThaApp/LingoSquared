course:
  title: Дари A2
  description: 'Дари Афганистана, уровень ниже среднего: визит к врачу -- лексика, подробное описание симптома, чтение подтверждения записи на приём и сам визит.'
units:
  prs.a2.unit12.doctor:
    title: У врача
lessons:
  prs.a2.unit12.lesson01.doctor_vocabulary:
    title: Слова для визита к врачу
  prs.a2.unit12.lesson02.describing_a_symptom:
    title: Описание симптома
  prs.a2.unit12.lesson03.reading_an_appointment_confirmation:
    title: Чтение подтверждения записи на приём
  prs.a2.unit12.lesson04.doctor_visit_dialogue:
    title: Визит к врачу
teaching:
  prs.a2.unit12.lesson01.teach.symptom_word:
    title: Симптом
    gloss: симптом
    note: '*علامت* -- общее слово для симптома или признака болезни.'
    example_gloss: Симптом Башира -- головная боль.
  prs.a2.unit12.lesson01.teach.duration_word:
    title: Продолжительность
    gloss: продолжительность, срок
    note: '*مدت* помогает спросить или сказать, как долго что-то длится.'
    example_gloss: Моя болезнь длится два дня.
  prs.a2.unit12.lesson01.teach.severe_word:
    title: Сильный
    gloss: сильный, острый
    note: '*شدید* описывает сильный, острый симптом.'
    example_gloss: У меня очень сильная головная боль.
  prs.a2.unit12.lesson01.teach.exam_word:
    title: Медицинский анализ
    gloss: медицинский анализ, обследование
    note: '*آزمایش* -- медицинский анализ, например анализ крови.'
    example_gloss: Врач назначает анализ крови.
  prs.a2.unit12.lesson01.teach.prescription_slip_word:
    title: Рецепт
    gloss: рецепт (бумажка с назначением)
    note: '*نسخه* — это сам рецепт, бумажный бланк с назначением.'
    example_gloss: Врач выписал мне рецепт.
  prs.a2.unit12.lesson01.teach.prescribe_word:
    title: Назначать (лечение)
    gloss: назначать (лечение)
    note: '*تجویز* — это назначение лекарства или лечения врачом.'
    example_gloss: Врач назначил новое лекарство.
  prs.a2.unit12.lesson01.teach.since_ago_grammar:
    title: «Уже два дня» с از ... پیش
    gloss: уже два дня (с двух дней назад)
    note: '*از ... پیش* — «с такого-то времени назад»; так говорят, как долго длится симптом.'
    target_text: از دو روز پیش (уже два дня, с двух дней назад)
  prs.a2.unit12.lesson02.teach.headache_severe_since:
    title: Описать сильный затяжной симптом
    gloss: У меня очень сильная головная боль, она началась два дня назад.
    note: Здесь *شدید* («сильный») сочетается с конструкцией длительности *از ... پیش*.
  prs.a2.unit12.lesson02.teach.need_test_question:
    title: Спросить, нужен ли анализ
    gloss: Нужно ли мне сдавать анализ из-за этой проблемы?
    note: '*آیا* вводит вопрос с ответом «да/нет»; *باید* значит «нужно, должен».'
  prs.a2.unit12.lesson02.teach.take_medicine_twice:
    title: Сказать, как принимать лекарство
    gloss: Мне нужно принимать это лекарство два раза в день.
    note: '*روزی دو بار* значит «два раза в день»; буквально — «два раза в день» в форме «по два раза на день».'
  prs.a2.unit12.lesson03.teach.confirmation_word:
    title: Подтверждение
    gloss: подтверждение
    note: '*تاییدی* — письменное подтверждение, например записи на приём.'
    example_gloss: Подтверждение моей записи пришло.
  prs.a2.unit12.lesson03.teach.checkup_word:
    title: Осмотр / обследование
    gloss: осмотр / обследование
    note: '*معاینه* — это сам врачебный осмотр пациента.'
    example_gloss: Врач провёл короткий осмотр.
  prs.a2.unit12.lesson03.teach.notice_text:
    title: Уведомление о подтверждении записи
    gloss: Ваш приём у врача в среду в девять утра. Пожалуйста, принесите удостоверение личности (тазкира). Если не сможете прийти, позвоните за один день.
    note: Короткое официальное уведомление о записи на приём, написанное в формальном письменном стиле, который изучается в этом уроке.
  prs.a2.unit12.lesson04.teach.turn01:
    title: Врач здоровается с بشیر
    gloss: Врач здоровается с ним и спрашивает, что его беспокоит.
    note: '*چطور استین؟* — вежливый вопрос «как вы поживаете?».'
  prs.a2.unit12.lesson04.teach.turn02:
    title: بشیر отвечает на приветствие и называет симптом
    gloss: Он почтительно здоровается с врачом и говорит, что у него очень сильная головная боль.
    note: '*داکتر صاحب* — уважительное обращение к врачу в Афганистане.'
  prs.a2.unit12.lesson04.teach.turn03:
    title: Врач спрашивает, с каких пор
    gloss: Врач спрашивает, когда это началось.
    note: '*از کی...؟* значит «с каких пор?».'
  prs.a2.unit12.lesson04.teach.turn04:
    title: بشیر отвечает
    gloss: Уже два дня.
    note: Здесь используется конструкция длительности *از ... پیش* («с ... назад»).
  prs.a2.unit12.lesson04.teach.turn05:
    title: Врач спрашивает о температуре
    gloss: Врач спрашивает, есть ли у него ещё и температура.
    note: '*آیا ... هم ...؟* значит «а ещё... есть?».'
  prs.a2.unit12.lesson04.teach.turn06:
    title: بشیر подтверждает небольшую температуру
    gloss: Да, у него небольшая температура.
    note: '*یک‌کمی* значит «немного».'
  prs.a2.unit12.lesson04.teach.turn07:
    title: Врач даёт указания
    gloss: Ему нужно принимать это лекарство два раза в день. Если лучше не станет, пусть придёт снова.
    note: '*اگر بهتر نشدین، دوباره بیایین* — «если вам не станет лучше, приходите снова» — условная конструкция с *اگر* («если»).'
  prs.a2.unit12.lesson04.teach.turn08:
    title: بشیر благодарит врача
    gloss: بشیر почтительно благодарит врача.
    note: '*داکتر صاحب* снова выражает уважительное обращение к врачу.'
exercises:
