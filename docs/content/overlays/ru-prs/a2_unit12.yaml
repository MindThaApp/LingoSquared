  prs.a2.unit12.lesson01.exercise04.order_since_two_days:
    instruction: Расставь слова так, чтобы получилось «уже два дня».
    accepted_answers:
    - value:
      - از
      - دو
      - روز
      - پیش
      status: correct
    feedback: '*از دو روز پیش* означает «уже два дня, с двух дней назад».'
  prs.a2.unit12.lesson01.exercise05.write_prescription:
    instruction: Напиши на дари слово «рецепт».
    accepted_answers:
    - value: نسخه
      status: correct
    feedback: '*نسخه* означает «рецепт».'
  prs.a2.unit12.lesson02.exercise01.recognize_headache_severe_since:
    instruction: Какое предложение описывает сильную головную боль, которая длится два дня?
    correct_option: У меня очень сильная головная боль, она началась два дня назад.
    distractors:
    - Нужно ли мне сдавать анализ?
    - Мне нужно принимать это лекарство два раза в день.
    - Моя болезнь длится два дня.
    accepted_answers:
    - value: У меня очень сильная головная боль, она началась два дня назад.
      status: correct
    feedback: '*سردردم خیلی شدید است و از دو روز پیش شروع شده.* описывает и силу боли, и её длительность.'
  prs.a2.unit12.lesson02.exercise02.order_take_medicine_twice:
    instruction: Расставь слова так, чтобы получилось «мне нужно принимать это лекарство два раза в день».
    accepted_answers:
    - value:
      - باید
      - این
      - دوا
      - را
      - روزی
      - دو
      - بار
      - بخورم
      status: correct
    feedback: '*باید این دوا را روزی دو بار بخورم.* — так формулируется указание по приёму.'
  prs.a2.unit12.lesson02.exercise03.dialogue_response_describe_problem:
    instruction: 'Врач спрашивает: «Что вас беспокоит?» Опиши свою сильную головную боль и когда она началась.'
    accepted_answers:
    - value: سردردم خیلی شدید است و از دو روز پیش شروع شده.
      status: correct
    - value: سردردم خیلی شدید است. از دو روز پیش شروع شده.
      status: correct
    - value: سردردم خیلی شدید است، از دو روز پیش شروع شده.
      status: correct
    feedback: Соединить силу боли и длительность можно через *و*, точкой или запятой — все варианты одинаково естественны.
  prs.a2.unit12.lesson02.exercise04.translate_need_test:
    instruction: 'Переведите: Нужно ли мне сдавать тест?'
    accepted_answers:
    - value: آیا باید آزمایش بدهم؟
      status: correct
    - value: آیا باید آزمایش بدهم
      status: correct
    feedback: '*آیا باید آزمایش بدهم؟* — вопрос о том, нужен ли анализ.'
  prs.a2.unit12.lesson02.exercise05.write_take_medicine_twice:
    instruction: Напиши на дари, что тебе нужно принимать это лекарство два раза в день.
    accepted_answers:
    - value: باید این دوا را روزی دو بار بخورم.
      status: correct
    - value: باید این دوا را روزی دو بار بخورم
      status: correct
    feedback: '*باید این دوا را روزی دو بار بخورم.* — так формулируется указание по приёму.'
  prs.a2.unit12.lesson03.exercise01.read_appointment_day:
    instruction: Согласно уведомлению, в какой день и во сколько приём?
    correct_option: В среду в девять утра
    distractors:
    - В среду в девять вечера
    - В четверг в девять утра
    - В среду в десять утра
    accepted_answers:
    - value: В среду в девять утра
      status: correct
    feedback: '*نوبت داکتر شما روز چهارشنبه ساعت نه صبح است* — в среду в девять утра.'
  prs.a2.unit12.lesson03.exercise02.read_what_to_bring:
    instruction: Что, согласно уведомлению, нужно принести на приём?
    correct_option: удостоверение личности (тазкира)
    distractors:
    - квитанцию об оплате аренды
    - паспорт
    - ничего
    accepted_answers:
    - value: удостоверение личности (тазкира)
      status: correct
    feedback: В уведомлении просят принести *تذکره*.
  prs.a2.unit12.lesson03.exercise03.recognize_confirmation_word:
    instruction: Что значит это слово?
    correct_option: подтверждение
    distractors:
    - осмотр
    - симптом
    - продолжительность
    accepted_answers:
    - value: подтверждение
      status: correct
    feedback: '*تاییدی* означает «подтверждение».'
  prs.a2.unit12.lesson03.exercise04.order_appointment_day:
    instruction: Расставь слова так, чтобы получилось «ваш приём у врача в среду в девять утра».
    accepted_answers:
    - value:
      - نوبت
      - داکتر
      - شما
      - روز
      - چهارشنبه
      - ساعت
      - نه
      - صبح
      - است
      status: correct
    feedback: '*نوبت داکتر شما روز چهارشنبه ساعت نه صبح است* — запись на приём, точно как в уведомлении.'
  prs.a2.unit12.lesson03.exercise05.write_call_if_cannot_come:
    instruction: 'Напиши на дари: если не сможете прийти, позвоните за один день.'
    accepted_answers:
    - value: اگر نتوانین بیایین، یک روز پیش زنگ بزنین.
      status: correct
    - value: اگر نتوانین بیایین. یک روز پیش زنگ بزنین.
      status: correct
    - value: اگر نتوانین بیایین و یک روز پیش زنگ بزنین
      status: correct
    feedback: Соединить условие и указание можно запятой, точкой или *و* — все варианты одинаково естественны.
  prs.a2.unit12.lesson04.exercise01.comprehend_since_when:
    instruction: С каких пор у بشیر болит голова?
    correct_option: уже два дня (с двух дней назад)
    distractors:
    - со вчерашнего дня
    - уже неделю
    - с сегодняшнего утра
    accepted_answers:
    - value: уже два дня (с двух дней назад)
      status: correct
    feedback: '*از دو روز پیش* — уже два дня.'
  prs.a2.unit12.lesson04.exercise02.comprehend_medicine_instructions:
    instruction: Как часто بشیر должен принимать лекарство?
    correct_option: два раза в день
    distractors:
    - раз в день
    - три раза в день
    - раз в неделю
    accepted_answers:
    - value: два раза в день
      status: correct
    feedback: '*روزی دو بار* — два раза в день.'
  prs.a2.unit12.lesson04.exercise03.recognize_other_symptom:
    instruction: Какой ещё симптом, кроме головной боли, называет بشیر?
    correct_option: небольшая температура
    distractors:
    - боль в животе
    - кашель
    - других симптомов нет
    accepted_answers:
    - value: небольшая температура
      status: correct
    feedback: '*یک‌کمی تب دارم* — у меня небольшая температура.'
  prs.a2.unit12.lesson04.exercise04.order_since_when_question:
    instruction: Расставь слова так, чтобы спросить, с каких пор начался симптом.
    accepted_answers:
    - value:
      - از
      - کی
      - شروع
      - شده
      status: correct
    feedback: '*از کی شروع شده؟* — «с каких пор это началось?»'
  prs.a2.unit12.lesson04.exercise05.dialogue_response_as_bashir:
    instruction: 'Врач спрашивает: «Как вы поживаете? Что вас беспокоит?» Ответь как بشیر: почтительно поздоровайся с врачом и назови свой симптом.'
    accepted_answers:
    - value: سلام داکتر صاحب. سردردم خیلی شدید است.
      status: correct
    - value: سلام داکتر صاحب، سردردم خیلی شدید است.
      status: correct
    feedback: '*سلام داکتر صاحب. سردردم خیلی شدید است.* — приветствие врачу и название симптома; вместо точки так же естественно подойдёт запятая.'
  prs.a2.unit12.lesson04.exercise06.write_doctor_instruction:
    instruction: Напиши, цитируя врача, как часто нужно принимать лекарство.
    accepted_answers:
    - value: باید این دوا را روزی دو بار بخورین.
      status: correct
    - value: باید این دوا را روزی دو بار بخورین
      status: correct
    feedback: '*باید این دوا را روزی دو بار بخورین.* — это прямое указание врача, приведённое как цитата.'
