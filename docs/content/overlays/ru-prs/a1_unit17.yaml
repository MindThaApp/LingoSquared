course:
  title: Дари A1
  description: 'Начальный кабульский дари: основные симптомы (головная боль, температура, боль в животе), как сказать, что тебе нездоровится, как попросить врача или лекарство, чтение короткой записки с советами по здоровью и короткого сообщения о симптомах, диалог с врачом.'
units:
  prs.a1.unit17.health:
    title: Здоровье
    description: Сообщить о простой проблеме со здоровьем и понять несложный совет на ближайшее время.
lessons:
  prs.a1.unit17.lesson01.symptom_words:
    title: Слова для симптомов
  prs.a1.unit17.lesson02.feeling_unwell:
    title: Как сказать, что тебе нездоровится
  prs.a1.unit17.lesson03.asking_for_help:
    title: Как попросить врача или лекарство
  prs.a1.unit17.lesson04.reading_health_advice:
    title: Чтение записки с советами по здоровью
  prs.a1.unit17.lesson05.reading_a_health_message:
    title: Чтение сообщения о здоровье
  prs.a1.unit17.lesson06.doctor_dialogue:
    title: Диалог с врачом
teaching:
  prs.a1.unit17.lesson01.teach.headache_word:
    title: Головная боль
    gloss: головная боль
    note: سردرد — сложное слово из سر («голова») и درد («боль»).
    example_gloss: У меня болит голова.
  prs.a1.unit17.lesson01.teach.fever_word:
    title: Температура
    gloss: температура (жар)
    note: تب означает «жар, температура».
    example_gloss: У меня температура.
  prs.a1.unit17.lesson01.teach.stomachache_word:
    title: Боль в животе
    gloss: боль в животе
    note: دل‌درد — сложное слово из دل («живот», в разговорной речи) и درد («боль»).
    example_gloss: У меня болит живот.
  prs.a1.unit17.lesson01.teach.have_word:
    title: У меня есть
    gloss: у меня есть
    note: دارم — форма 1-го лица настоящего времени глагола داشتن («иметь»).
    target_text: دارم (у меня есть)
  prs.a1.unit17.lesson02.teach.sick_word:
    title: Больной
    gloss: больной
    note: مریض означает «больной».
    example_gloss: Я болен.
  prs.a1.unit17.lesson02.teach.am_word:
    title: Я есть / я
    gloss: я есть
    note: استم — вежливая форма связки 1-го лица, в соответствии с формами استم/استین, принятыми в этом курсе.
    target_text: استم (я есть, я являюсь)
  prs.a1.unit17.lesson02.teach.my_condition_word:
    title: Как я себя чувствую
    gloss: как я себя чувствую / моё состояние
    note: حالم (حال + م) буквально означает «моё состояние»; حالم خوب نیست значит «мне нехорошо».
    target_text: حالم (как я себя чувствую / моё состояние)
  prs.a1.unit17.lesson02.teach.good_word:
    title: Хороший
    gloss: хороший
    note: خوب означает «хороший» или «хорошо».
    example_gloss: Мне нехорошо.
  prs.a1.unit17.lesson02.teach.not_word:
    title: Не является
    gloss: не является
    note: نیست — отрицательная форма связки; خوب نیست значит «нехороший, нехорошо».
    target_text: نیست (нет, не является)
  prs.a1.unit17.lesson03.teach.doctor_word:
    title: Врач
    gloss: врач
    note: داکتر — стандартное афганское написание и произношение слова «врач» (в отличие от иранского دکتر).
    example_gloss: Мне нужен врач.
  prs.a1.unit17.lesson03.teach.medicine_word:
    title: Лекарство
    gloss: лекарство
    note: دوا означает «лекарство».
    example_gloss: Мне нужно лекарство.
  prs.a1.unit17.lesson03.teach.want_word:
    title: Я хочу
    gloss: я хочу
    note: می‌خواهم означает «я хочу».
    target_text: می‌خواهم (я хочу)
  prs.a1.unit17.lesson04.teach.rest_word:
    title: Отдых
    gloss: отдохни
    note: 'استراحت — существительное «отдых»; вместе с کنین оно образует повелительное наклонение: «Отдыхайте!»'
    example_gloss: Отдыхайте.
  prs.a1.unit17.lesson04.teach.do_word:
    title: Делайте (вежливо)
    gloss: делайте (вежливое повелительное наклонение)
    note: کنین — вежливое повелительное наклонение от کردن («делать»); استراحت کنین буквально значит «делайте отдых», то есть «Отдыхайте».
    target_text: کنین (делать — вежливое повелительное наклонение)
  prs.a1.unit17.lesson04.teach.water_word:
    title: Вода
    gloss: вода
    note: آب означает «вода».
    example_gloss: Пейте много воды.
  prs.a1.unit17.lesson04.teach.a_lot_word:
    title: Много
    gloss: много
    note: زیاد означает «много».
    example_gloss: Пейте много воды.
  prs.a1.unit17.lesson04.teach.drink_word:
    title: Пейте (вежливо)
    gloss: пейте (вежливое повелительное наклонение)
    note: بنوشین — вежливое повелительное наклонение от نوشیدن («пить»).
    target_text: بنوشین (пить — вежливое повелительное наклонение)
  prs.a1.unit17.lesson04.teach.advice_text:
    title: Записка с советами по здоровью
    gloss: Отдыхайте. Пейте много воды.
    note: Короткая записка с двумя простыми советами по здоровью.
  prs.a1.unit17.lesson05.teach.hello_word:
    title: Привет
    gloss: привет
    note: سلام означает «здравствуйте».
    example_gloss: Здравствуйте. Я болен.
  prs.a1.unit17.lesson05.teach.and_word:
    title: И
    gloss: и
    note: و означает «и»; оно соединяет два слова или две части предложения.
    target_text: و (и)
  prs.a1.unit17.lesson05.teach.message_text:
    title: Короткое сообщение о здоровье
    gloss: Здравствуйте. Я болен. У меня болит голова и температура.
    note: Короткое сообщение от первого лица с описанием двух симптомов.
  prs.a1.unit17.lesson06.teach.names:
    title: Башир и врач
    gloss: Башир, врач
    note: Башир — постоянный персонаж этого курса; к врачу обращаются с почтительным словом صاحب.
    example_gloss:
    - Я Башир.
    - Я врач.
  prs.a1.unit17.lesson06.teach.how_word:
    title: Как
    gloss: какой
    note: چطور означает «как».
    target_text: چطور (как)
  prs.a1.unit17.lesson06.teach.are_you_word:
    title: Вы есть (вежливо)
    gloss: вы есть; вы
    note: استین — вежливая форма связки 2-го лица, в соответствии с формами استم/استین, принятыми в этом курсе.
    target_text: استین (вы есть — вежливая форма)
  prs.a1.unit17.lesson06.teach.thanks_word:
    title: Благодарность
    gloss: спасибо
    note: تشکر означает «спасибо».
    example_gloss: Спасибо, доктор.
  prs.a1.unit17.lesson06.teach.sir_word:
    title: Господин
    gloss: господин
    note: صاحب — почтительное слово, которое ставится после имени или звания; داکتر صاحب значит «уважаемый доктор». Это типично афганский способ обращения.
    example_gloss: Спасибо, доктор.
  prs.a1.unit17.lesson06.teach.dialogue_line1:
    title: Врач здоровается с Баширом
    gloss: Здравствуйте. Как вы себя чувствуете?
  prs.a1.unit17.lesson06.teach.dialogue_line2:
    title: Ответ Башира
    gloss: Здравствуйте. Я болен. У меня болит голова и температура.
  prs.a1.unit17.lesson06.teach.dialogue_line3:
    title: Совет врача
    gloss: Отдыхайте. Пейте много воды.
  prs.a1.unit17.lesson06.teach.dialogue_line4:
    title: Башир благодарит врача
    gloss: Спасибо, доктор.
