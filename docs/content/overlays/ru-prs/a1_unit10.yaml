teaching:
  prs.a1.unit10.lesson01.teach.dokan:
    title: Магазин
    gloss: магазин
    note: دوکان — настоящее афганское слово для небольшого местного магазина; в иранском фарси для этого говорят مغازه.
    example_gloss: Этот магазин большой.
  prs.a1.unit10.lesson01.teach.qeymat:
    title: Цена
    gloss: цена
    note: قیمت означает «цена».
    example_gloss: Сколько это стоит?
  prs.a1.unit10.lesson01.teach.arzan:
    title: Дешёвый
    gloss: дешёвый
    note: ارزان означает «дешёвый», «недорогой».
    example_gloss: Это дёшево.
  prs.a1.unit10.lesson01.teach.gran:
    title: Дорогой
    gloss: дорогой
    note: گران — противоположность слова ارزان.
    example_gloss: Это дорого.
  prs.a1.unit10.lesson01.teach.takhfif:
    title: Скидка
    gloss: скидка
    note: تخفیف означает скидку на цену.
    example_gloss: У вас есть скидка?
  prs.a1.unit10.lesson01.teach.va_word:
    title: И
    gloss: и
    note: و — обычный соединительный союз, которым связывают две короткие фразы или просьбы.
    example_gloss: Я покупаю яблоки и хлеб.
  prs.a1.unit10.lesson02.teach.qeymatesh_chand:
    title: Сколько это стоит?
    gloss: Сколько это?
    note: 'قیمتش چند است؟ буквально: «его цена — сколько?»'
  prs.a1.unit10.lesson02.teach.sad_afghani:
    title: Сто афгани.
    gloss: Сто афгани.
    note: صد افغانی است называет цену в афгани — афганской валюте.
  prs.a1.unit10.lesson03.teach.sib:
    title: Яблоки
    gloss: яблоки
    note: سیب означает «яблоко»; здесь употреблено в общем значении — яблоки на продажу.
    example_gloss: Я хочу килограмм яблок.
  prs.a1.unit10.lesson03.teach.kilo:
    title: Килограмм
    gloss: килограмм
    note: کیلو — стандартная единица, в которой продают товары на вес.
    example_gloss: Я хочу килограмм яблок.
  prs.a1.unit10.lesson03.teach.label_text:
    title: 'Яблоки: килограмм — сто афгани'
    gloss: 'Яблоки: килограмм — сто афгани'
    note: 'سیب: یک کیلو صد افغانی — типичный рыночный ценник.'
  prs.a1.unit10.lesson04.teach.yak_kilo_sib:
    title: Мне нужен килограмм яблок.
    gloss: Мне, пожалуйста, килограмм яблок.
    note: Фраза یک کیلو سیب می‌خواهم построена по той же модели یک [item] می‌خواهم, которую ты изучал(а) в теме о заказе еды в Уроке 8.
  prs.a1.unit10.lesson04.teach.do_kilo:
    title: Мне два килограмма.
    gloss: Мне два килограмма.
    note: В фразе دو کیلو می‌خواهم слово دو («два») заменяет «один» и обозначает большее количество.
  prs.a1.unit10.lesson05.teach.takhfif_mitanin:
    title: Вы можете сделать скидку?
    gloss: Вы можете сделать скидку?
    note: Фраза تخفیف می‌توانین بدهین؟ вежливо просит снизить цену; в ней используется می‌توانین («вы можете»).
  prs.a1.unit10.lesson05.teach.baraye_shoma:
    title: Для вас выйдет 180 афгани.
    gloss: Для вас выйдет 180 афгани.
    note: 'Фраза برای شما صد و هشتاد افغانی می‌شه называет итоговую цену со скидкой: на 20 афгани меньше полных 200 за два килограмма по 100 за каждый.'
  prs.a1.unit10.lesson06.teach.befarmayin:
    title: Прошу, пожалуйста
    gloss: прошу, пожалуйста
    note: بفرمایین — тёплое вежливое приглашение, которым продавец встречает покупателя.
    example_gloss: Пожалуйста, вот цена.
  prs.a1.unit10.lesson06.teach.turn01:
    title: Здравствуйте, прошу вас.
    gloss: Здравствуйте, прошу вас.
    note: Продавец тепло приветствует покупателя.
  prs.a1.unit10.lesson06.teach.turn02:
    title: Здравствуйте. Сколько стоят яблоки?
    gloss: Здравствуйте. Сколько стоят яблоки?
    note: Покупатель спрашивает цену яблок.
  prs.a1.unit10.lesson06.teach.turn03:
    title: Килограмм стоит сто афгани.
    gloss: Килограмм стоит сто афгани.
    note: Продавец называет цену за килограмм.
  prs.a1.unit10.lesson06.teach.turn04:
    title: Мне два килограмма. Вы можете сделать скидку?
    gloss: Мне два килограмма. Вы можете сделать скидку?
    note: Покупатель называет количество и просит скидку.
  prs.a1.unit10.lesson06.teach.turn05:
    title: Да, для вас два килограмма выйдут в 180 афгани.
    gloss: Да, для вас два килограмма выйдут в 180 афгани.
    note: Продавец соглашается и называет итоговую цену со скидкой — она согласуется с ценой 100 афгани за килограмм из третьей реплики (200 минус скидка 20 афгани).
  prs.a1.unit10.lesson06.teach.turn06:
    title: Очень хорошо, спасибо.
    gloss: Очень хорошо, спасибо.
    note: Покупатель принимает цену и благодарит продавца.
