    instruction: 'Скажи полным предложением от первого лица, когда ты получишь ПИН-код: в тот же день, когда заберёшь карту.'
    accepted_answers:
    - value: رمزش را همان روزی می‌گیرم که کارت را تحویل می‌گیرم.
      status: correct
    - value: رمزش را همان روزی می‌گیرم که کارت را تحویل می‌گیرم
      status: correct
    - value: رمزش را همان روزی که کارت را تحویل می‌گیرم می‌گیرم.
      status: correct
    - value: همان روزی که کارت را تحویل می‌گیرم، رمزش را می‌گیرم.
      status: correct
    - value: همان روزی که کارت را تحویل می‌گیرم رمزش را می‌گیرم
