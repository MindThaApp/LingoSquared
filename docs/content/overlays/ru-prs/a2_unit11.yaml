    feedback: '*رمزش را همان روزی می‌گیرم که کارت را تحویل می‌گیرم.* превращает ответ сотрудника (*تحویل می‌گیرین*, «вы заберёте») в предложение от первого лица («я получу его в тот день, когда заберу карту»).'
