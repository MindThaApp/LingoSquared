course:
  title: Дари A2
  description: 'Дари Афганистана, уровень ниже среднего: открытие простого банковского счёта — лексика, просьба об открытии счёта, чтение банковского объявления и сам разговор у банковской стойки.'
units:
  prs.a2.unit11.banking:
    title: Открытие банковского счёта
lessons:
  prs.a2.unit11.lesson01.banking_vocabulary:
    title: Слова для банка
  prs.a2.unit11.lesson02.requesting_an_account:
    title: Просьба открыть счёт
  prs.a2.unit11.lesson03.reading_a_bank_notice:
    title: Читаем банковское объявление
  prs.a2.unit11.lesson04.bank_counter_dialogue:
    title: У банковской стойки
teaching:
  prs.a2.unit11.lesson01.teach.bank_word:
    title: Банк
    gloss: банк
    note: '*بانک* — обычное слово для обозначения банка.'
    example_gloss: Банк находится рядом с домом Хумайуна.
  prs.a2.unit11.lesson01.teach.account_word:
    title: Банковский счёт
    gloss: банковский счёт
    note: '*حساب بانکی* — слово *حساب* само по себе тоже может означать «счёт» в более общем смысле.'
    example_gloss: Хумайун хочет открыть банковский счёт.
  prs.a2.unit11.lesson01.teach.card_word:
    title: Банковская карта
    gloss: банковская карта
    note: '*کارت بانکی* — слово *کارت* само по себе — общее слово для «карты».'
    example_gloss: Я потерял свою банковскую карту.
  prs.a2.unit11.lesson01.teach.pin_word:
    title: ПИН-код
    gloss: ПИН-код / пароль
    note: '*رمز* обозначает и банковский ПИН-код, и обычный пароль.'
    example_gloss: Я забыл ПИН-код своей банковской карты.
  prs.a2.unit11.lesson01.teach.balance_word:
    title: Остаток на счёте
    gloss: остаток на счёте
    note: '*موجودی* — сумма денег, которая в данный момент лежит на счёте.'
    example_gloss: На моём счёте мало денег.
  prs.a2.unit11.lesson01.teach.signature_word:
    title: Подпись
    gloss: подпись
    note: '*امضا* означает и сам процесс подписания, и саму подпись.'
    example_gloss: Пожалуйста, распишитесь здесь.
  prs.a2.unit11.lesson01.teach.if_grammar:
    title: «Если» с اگر
    gloss: Если у вас есть тазкира (удостоверение личности), вы можете открыть счёт.
    note: '*اگر* вводит условное придаточное предложение — новый вид придаточного наряду с *چون* («потому что»).'
  prs.a2.unit11.lesson01.teach.open_account_word:
    title: Открыть счёт
    gloss: открытие счёта
    note: '*باز کردن حساب* — *باز کردن* означает «открывать».'
  prs.a2.unit11.lesson01.teach.va_word:
    title: И
    gloss: и
    note: '*و* — обычный соединительный союз, который встречается во всём этом разделе.'
    target_text: و («и»)
  prs.a2.unit11.lesson02.teach.request_account:
    title: Просьба открыть счёт
    gloss: Я хотел бы открыть банковский счёт.
    note: Снова используется уже знакомая вежливая форма просьбы с *می‌خواستم*.
  prs.a2.unit11.lesson02.teach.if_documents:
    title: Называем требование с اگر
    gloss: Если у вас есть тазкира (удостоверение личности) и квитанция об оплате аренды дома, вы можете открыть счёт.
    note: '*اگر... داشته باشین* — «если у вас есть...» — сочетает новое условное предложение со словами *رسید کرایه خانه* («квитанция об оплате аренды дома»).'
  prs.a2.unit11.lesson02.teach.card_ready_timeline:
    title: Говорим, когда будет готова карта
    gloss: Ваша банковская карта будет готова через три дня.
    note: '*تا سه روز دیگر* означает «через три дня», «не позже чем через три дня».'
  prs.a2.unit11.lesson03.teach.fee_word:
    title: Комиссия
    gloss: комиссия
    note: '*کارمزد* — плата за обслуживание или за операцию.'
    example_gloss: За этот счёт комиссия не взимается.
  prs.a2.unit11.lesson03.teach.minimum_word:
    title: Минимум
    gloss: минимум
    note: '*حداقل* означает «минимум» или «как минимум».'
    example_gloss: Минимальный остаток на счёте — 500 афгани.
  prs.a2.unit11.lesson03.teach.notice_text:
    title: Банковское объявление об открытии счёта
    gloss: Для открытия счёта принесите, пожалуйста, тазкиру (удостоверение личности) и квитанцию об оплате аренды дома. Минимальный остаток на счёте — 500 афгани. Ежемесячной комиссии нет.
    note: Короткое официальное объявление банка, написанное в формальном письменном стиле, который изучается в этом разделе.
  prs.a2.unit11.lesson04.teach.turn01:
    title: Сотрудник приветствует Хумайуна
    gloss: Сотрудник приглашает его войти и спрашивает, чем может ему помочь.
    note: Такое же формальное приветствие используют служащие, когда предлагают помощь.
  prs.a2.unit11.lesson04.teach.turn02:
    title: Хумайун просит открыть счёт
    gloss: Хумайун говорит, что хотел бы открыть банковский счёт.
    note: Та же вежливая форма просьбы с *می‌خواستم*, что и раньше.
  prs.a2.unit11.lesson04.teach.turn03:
    title: Сотрудник спрашивает о документах
    gloss: Сотрудник спрашивает, есть ли у него тазкира (удостоверение личности) и квитанция об оплате аренды дома.
    note: '*دارین؟* -- «у вас есть?» -- вежливая форма вопроса.'
  prs.a2.unit11.lesson04.teach.turn04:
    title: همایون подтверждает, что документы у него есть
    gloss: Да, вот его удостоверение личности (тазкира) и квитанция об оплате аренды жилья.
    note: '*این هم ...* («вот ...») говорят, когда что-то передают.'
  prs.a2.unit11.lesson04.teach.turn05:
    title: Сотрудник подтверждает и называет срок
    gloss: Хорошо. Его банковская карта будет готова через три дня.
    note: Повторяется срок *تا سه روز دیگر آماده می‌شود* («будет готова не позже чем через три дня»).
  prs.a2.unit11.lesson04.teach.turn06:
    title: همایون спрашивает про ПИН-код
    gloss: Он спрашивает, когда получит ПИН-код.
    note: '*رمزش* -- «его ПИН-код» -- присоединяет к *رمز* притяжательный суффикс *-ش*.'
  prs.a2.unit11.lesson04.teach.turn07:
    title: Сотрудник отвечает
    gloss: 'Сотрудник говорит: в тот же день, когда он заберёт карту.'
    note: '*همان روزی که ...* означает «в тот самый день, когда ...».'
  prs.a2.unit11.lesson04.teach.turn08:
    title: همایون благодарит сотрудника
    gloss: همایون благодарит сотрудника за уделённое время.
    note: '*تشکر از وقت‌تان* («спасибо за ваше время») -- вежливая заключительная фраза.'
