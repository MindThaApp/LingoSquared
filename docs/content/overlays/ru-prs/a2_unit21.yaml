teaching:
  prs.a2.unit21.lesson01.teach.tghr_dadn_lghw:
    title: Изменение встречи
    gloss: перенести (встречу) / отменить
    note: '*قرار را تغییر دادن* значит перенести встречу на другое время. *لغو کردن* значит отменить её совсем.'
    example_gloss:
    - Я хочу перенести свою встречу.
    - Мне нужно отменить свою встречу.
  prs.a2.unit21.lesson01.teach.mtasfanh_bbkhshn:
    title: Как извиниться
    gloss: к сожалению / извините
    note: '*متأسفانه* — вежливый способ сообщить неприятную новость. *ببخشین* — обычное извинение в повседневной речи.'
    example_gloss:
    - К сожалению, я не могу прийти.
    - Извините, я слишком опоздал.
  prs.a2.unit21.lesson01.teach.slman:
    title: Парикмахерская
    gloss: парикмахерская (салон)
    note: '*سلمانی* — это мужская парикмахерская, место. *دلاک* — традиционное слово для самого парикмахера.'
    example_gloss: Салон открыт с девяти до шести.
  prs.a2.unit21.lesson01.teach.mtwanm_qrarm_ra:
    title: Просьба перенести встречу
    gloss: Можно перенести мою запись?
    note: 'Вопрос с ответом «да/нет» сохраняет порядок слов утверждения, меняется только интонация: *می‌توانم قرارم را تغییر بدهم؟* Второй глагол, *تغییر بدهم*, стоит в конце.'
  prs.a2.unit21.lesson01.teach.mn_mtasfanh_nmtwanm:
    title: Как сказать, что не можешь прийти
    gloss: К сожалению, я не могу прийти.
  prs.a2.unit21.lesson01.teach.njshnbh_nmtwanm_bam:
    title: می‌توانم + сослагательное наклонение
    gloss: В четверг я не могу прийти. Могу я перенести встречу?
    note: 'После *می‌توانم* (я могу) второй глагол стоит в сослагательном наклонении и в конце предложения: *می‌توانم بیایم*. Для значения *не могу* частица *ن* ставится перед вспомогательным глаголом: *نمی‌توانم بیایم*. Слово с названием дня стоит в начале: *پنجشنبه نمی‌توانم بیایم*. Порядок слов в вопросе такой же, меняется только интонация: *می‌توانم قرار را تغییر بدهم؟*'
  prs.a2.unit21.lesson02.teach.rwz_dr:
    title: Другой день
    gloss: другой день
    note: '*دیگر* значит «другой» и стоит после существительного: *یک روز دیگر* — другой день.'
    example_gloss: А в другой день можно?
  prs.a2.unit21.lesson02.teach.dwshnbh_hm_mmn:
    title: Предлагаем день
    gloss: Может, и в понедельник?
    note: 'Перед названием дня недели предлог не нужен: *دوشنبه هم ممکن است؟* *هم* значит «тоже» и стоит после названия дня.'
  prs.a2.unit21.lesson02.teach.jmah_bra_shma:
    title: Вам подходит?
    gloss: Вам подходит пятница? (вежливо)
    note: '*مناسب* значит «подходящий». *برای شما مناسب است* — вежливый вопрос о том, подходит ли время человеку, которого вы знаете не очень хорошо. *برایم* — краткая форма от *برای من* («для меня»).'
  prs.a2.unit21.lesson02.teach.bl_bram_mnasb:
    title: Говорим «да»
    gloss: Да, мне это подходит.
  prs.a2.unit21.lesson02.teach.mtasfanh_nh:
    title: Вежливо отказываем
    gloss: К сожалению, нет.
  prs.a2.unit21.lesson02.teach.jmah_bra_shma_2:
    title: Вам подходит?
    gloss: Вам подходит пятница? Да, мне это подходит. Нет, к сожалению, нет.
    note: Чтобы спросить, подходит ли время собеседнику, используй *برای شما مناسب است؟* с вежливым *شما*. Ответ *بلی، برایم مناسب است* означает согласие, а *متأسفانه نه* — вежливый отказ. *برای* с личным окончанием (*برایم*, *برایتان*) значит «для меня», «для вас».
  prs.a2.unit21.lesson03.teach.wn_mtasfm:
    title: Потому что и «мне жаль»
    gloss: потому что / мне жаль
    note: '*چون* соединяет два полных предложения и вводит причину. *متأسفم* — более官 вежливое извинение, чем *ببخشین*.'
    example_gloss:
    - Я не могу прийти, потому что я болен.
    - Мне очень жаль.
  prs.a2.unit21.lesson03.teach.zhmt:
    title: Беспокойство
    gloss: беспокойство
    note: '*بابت زحمت ببخشین* — вежливая фраза, когда вы доставили человеку лишние хлопоты. *زحمت* значит «хлопоты, труд».'
    example_gloss: Извините за беспокойство.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn:
    title: 'Причина: работа'
    gloss: Я не могу прийти, потому что мне нужно работать.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn_2:
    title: 'Причина: другая встреча'
    gloss: Я не могу прийти, потому что у меня другая встреча.
  prs.a2.unit21.lesson03.teach.nmtwanm_bam_wn_3:
    title: 'Потому что: болезнь'
    gloss: Я не могу прийти, потому что я болен.
    note: 'После *چون* идёт обычное предложение, глагол стоит в конце. Перед ним ставится запятая: *نمی‌توانم بیایم، چون مریض استم.* Форма *استم* — это форма для *я* от *است*.'
  prs.a2.unit21.lesson04.teach.qrar_dhashtn_az:
    title: Договариваться и «заранее»
    gloss: договариваться / заранее
    note: '*قرار گذاشتن* значит вместе договориться о времени или месте. *از قبل* значит «заранее».'
    example_gloss:
    - Давай договоримся?
    - Позвоните за день заранее.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh:
    title: Принимаем время
    gloss: Понедельник, десять часов — хорошо.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh_2:
    title: Спрашиваем, подходит ли время
    gloss: Вы можете прийти в понедельник в десять часов? (вежливо)
    note: '*می‌توانین* — вежливая форма для *вы* от *می‌توانی*; окончание множественного числа *-ین* сочетается с *شما*. Второй глагол, *بیایین*, стоит в конце.'
  prs.a2.unit21.lesson04.teach.s_shma_ra:
    title: Завершаем договорённость
    gloss: Тогда увидимся в понедельник.
  prs.a2.unit21.lesson04.teach.s_qrar_jdd:
    title: Назначаем новую встречу
    gloss: Тогда я назначу новую встречу.
  prs.a2.unit21.lesson04.teach.dwshnbh_saat_dh_3:
    title: Сначала день, потом время
    gloss: В понедельник в десять часов хорошо. Вы можете прийти в понедельник в десять часов?
    note: 'Когда называешь день и время, сначала идёт день, затем *ساعت* + число: *دوشنبه ساعت ده*. В вежливом вопросе используй *می‌توانین ...؟* и ставь глагол в конец.'
  prs.a2.unit21.lesson05.teach.hmawn_azz_qrartan:
    title: Сообщение из салона
    gloss: Уважаемый Хумаюн, ваша встреча перенесена. Ваша новая встреча — в понедельник в десять часов. Вам это не подходит? Тогда позвоните нам за день заранее. Тогда мы назначим новую встречу. До понедельника! Парикмахерская «Ариана»
    note: Это типичное короткое сообщение от организации, поэтому в нём используется вежливое окончание *-تان* (*قرارتان*, *برایتان*). *تغییر داده شد* значит «было перенесено».
    glosses:
      عزیز: дорогой, уважаемый
      همایون: Хумаюн
      قرارتان: ваш (вежливо)
      قرار: запись на приём
      تغییر: перенесено
      جدیدتان: новый
      دوشنبه: понедельник
      ده: десять
      ساعت: час
      مناسب: подходящий
      این: это
      نیست: не
      برایتان: для вас (вежливо)
      تماس: звонить
      با: с нами (با ما)
      پس: тогда
      قبل: заранее
      می‌گذاریم: делать; назначать
      ما: мы
      تا: до; до встречи
      سلمانی: парикмахерская
      آریانا: Ариана
  prs.a2.unit21.lesson06.teach.slman_arana_rwz:
    title: Салон отвечает
    gloss: 'Парикмахер: Парикмахерская «Ариана», добрый день.'
  prs.a2.unit21.lesson06.teach.rwz_bkhr_hmawn:
    title: Хумаюн объясняет и спрашивает
    gloss: 'Хумаюн: Добрый день, вас беспокоит Хумаюн. У меня запись на четверг, но, к сожалению, я не смогу прийти. Можно перенести запись?'
  prs.a2.unit21.lesson06.teach.albth_jmah_bra:
    title: Парикмахер предлагает пятницу
    gloss: 'Парикмахер: Конечно. Вам подойдёт пятница?'
  prs.a2.unit21.lesson06.teach.mtasfanh_nh_wn:
    title: Хумаюн предлагает понедельник
    gloss: 'Хумаюн: К сожалению, нет, потому что мне нужно работать. А в понедельник можно?'
  prs.a2.unit21.lesson06.teach.dwshnbh_saat_dh:
    title: Парикмахер соглашается
    gloss: 'Парикмахер: Понедельник в десять часов — хорошо.'
  prs.a2.unit21.lesson06.teach.bram_mnasb_ast:
    title: Хумаюн соглашается и извиняется
    gloss: 'Хумаюн: Мне это подходит. Большое спасибо и извините за беспокойство.'
  prs.a2.unit21.lesson06.teach.mshl_nst_ta:
    title: Парикмахер заканчивает разговор
    gloss: 'Парикмахер: Никаких проблем. До понедельника!'
