course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: лексика об образовании и учёбе (университет, школа, специальность, студент, урок), названия специальностей (медицина, право, экономика, литература), вопрос и ответ о том, где ты учишься, и диалог Карима и Парвин об учёбе и об отношении к ней.'
units:
  prs.a1.unit31.education:
    title: Образование
    description: Расскажи, что и где ты изучаешь и как к этому относишься.
