    title: Итоги
teaching:
  prs.a1.unit31.lesson01.teach.education_word:
    title: Образование
    gloss: образование / учёба
    note: تحصیل означает образование или учёбу в целом; это ключевое слово урока.
    example_gloss: Образование — это хорошо.
  prs.a1.unit31.lesson01.teach.university_word:
    title: Университет
    gloss: университет
    note: پوهنتون означает «университет». Это стандартное слово в Афганистане (как в названии Кабульского университета); в Иране говорят دانشگاه.
    example_gloss: Университет находится в Кабуле.
  prs.a1.unit31.lesson01.teach.school_word:
    title: Школа
    gloss: школа
    note: مکتب означает «школа».
    example_gloss: Эта школа хорошая.
  prs.a1.unit31.lesson01.teach.field_word:
    title: Специальность
    gloss: специальность / направление обучения
    note: رشته означает направление обучения или специальность в вузе; это обычное слово, общее для персидского и дари.
    example_gloss: Моя специальность — медицина.
  prs.a1.unit31.lesson01.teach.student_word:
    title: Студент
    gloss: студент
    note: محصل означает «студент вуза». Это стандартное слово дари в Афганистане; в Иране говорят دانشجو.
    example_gloss: Он/она — студент(ка).
  prs.a1.unit31.lesson01.teach.lesson_word:
    title: Урок
    gloss: урок
    note: درس означает «урок». Вместе с خواندن («читать») образует составной глагол со значением «учиться, заниматься».
    example_gloss: Я занимаюсь каждый день.
  prs.a1.unit31.lesson01.teach.review_khandan:
    title: Учиться
    gloss: урок + читать → я учусь
    note: درس («урок») вместе с خواندن («читать») образует درس می‌خوانم («я учусь»); буквально «я читаю урок». Это новая для курса модель составного глагола.
    target_text: درس (урок) + خواندن (читать) = درس می‌خوانم (я учусь)
  prs.a1.unit31.lesson01.teach.combined_sentence:
    title: Я учусь в университете
    gloss: Я учусь в университете.
    note: Сочетает من («я», повторение), در («в», повторение), پوهنتون и درس می‌خوانم.
  prs.a1.unit31.lesson02.teach.medicine_word:
    title: Лекарство
    gloss: лекарство
    note: طب означает «медицина» как область учёбы; это обычное слово, общее для персидского и дари.
    example_gloss: Медицина — это трудно.
  prs.a1.unit31.lesson02.teach.law_word:
    title: Право
    gloss: право
    note: حقوق означает «право» как область учёбы; это обычное слово, общее для персидского и дари.
    example_gloss: Право — это интересно.
  prs.a1.unit31.lesson02.teach.economics_word:
    title: Экономика
    gloss: экономика
    note: اقتصاد означает «экономика» как область учёбы; это обычное слово, общее для персидского и дари.
    example_gloss: Экономика тоже трудная.
  prs.a1.unit31.lesson02.teach.literature_word:
    title: Литература
    gloss: литература
    note: ادبیات означает «литература» как область учёбы; это обычное слово, общее для персидского и дари.
    example_gloss: Я люблю литературу.
  prs.a1.unit31.lesson02.teach.reshte_ast_phrase:
    title: Моя специальность — медицина
    gloss: Моя специальность — медицина.
    note: Сочетает رشته من («моя специальность», повторение) с است («есть, является»), которое вводится здесь.
  prs.a1.unit31.lesson02.teach.mikhanam_subject_phrase:
    title: Я изучаю медицину
    gloss: Я изучаю медицину.
    note: Модель من ... می‌خوانم («я учу, изучаю», повторение) используется прямо с названием предмета, например طب.
  prs.a1.unit31.lesson03.teach.review_koja:
    title: Где
    gloss: где
    note: کجا означает «где».
    target_text: کجا (где)
  prs.a1.unit31.lesson03.teach.review_mikhanin:
    title: Вы учитесь (вежливо)
    gloss: вы учитесь (вежливое)
    note: درس می‌خوانین — вежливое «вы учитесь»; оно строится по уже знакомой модели с окончанием -ین (например, استفاده می‌کنین из урока 30).
    target_text: درس می‌خوانین (вы учитесь, вежливая форма)
  prs.a1.unit31.lesson03.teach.question_where:
    title: Где вы учитесь?
    gloss: Где вы учитесь?
    note: Сочетает شما («вы», вежливое, повторение), کجا («где»), درس и می‌خوانین.
  prs.a1.unit31.lesson03.teach.answer_kabul_university:
    title: Я учусь в Кабульском университете
    gloss: Я учусь в Кабульском университете.
    note: Сочетает من در ... درس می‌خوانم («я учусь в ...», повторение) с پوهنتون کابل («Кабульский университет»).
  prs.a1.unit31.lesson04.teach.review_mikhanad:
    title: Он/она учится
    gloss: он/она учится
    note: درس می‌خواند — форма 3-го лица; она строится по уже знакомой модели с окончанием -د (например, استفاده می‌کند из урока 30).
    target_text: درس می‌خواند (он/она учится, 3-е лицо)
  prs.a1.unit31.lesson04.teach.review_to_mikhani:
    title: Ты / ты учишься
    gloss: ты (неформальное) / ты учишься (неформальное)
    note: تو и می‌خوانی — неформальное обращение, которое используют между собой Карим и Парвин.
    target_text: تو (ты) / می‌خوانی (ты учишься)
  prs.a1.unit31.lesson04.teach.dialogue_line1:
    title: 'Карим: Парвин, где ты учишься?'
    gloss: Парвин, где ты учишься?
  prs.a1.unit31.lesson04.teach.dialogue_line2:
    title: 'Парвин: Я учусь в Кабульском университете. Моя специальность — медицина.'
    gloss: Я учусь в Кабульском университете. Моя специальность — медицина.
  prs.a1.unit31.lesson04.teach.dialogue_line3:
    title: 'Карим: Медицина — это трудно?'
    gloss: Медицина — это трудно?
  prs.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'Парвин: Да, это трудно, но интересно. А ты?'
    gloss: Да, это трудно, но интересно. А ты?
  prs.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'Карим: Я учусь в школе.'
    gloss: Я учусь в школе.
  prs.a1.unit31.lesson04.teach.dialogue_line6:
    title: 'Парвин: Отлично!'
    gloss: Отлично!
  prs.a1.unit31.lesson05.teach.reading_passage:
    title: Читаем об образовании
    gloss: Парвин учится в Кабульском университете. Её специальность — медицина. Медицина трудная, но интересная. Карим учится в школе.
  prs.a1.unit31.lesson06.teach.review_like_have_time:
    title: Мне нравится / время / у меня нет
    gloss: нравится, люблю / время / у меня нет
    note: دوست دارم («мне нравится, я люблю»), وقت («время») и ندارم («у меня нет») — повторение из уроков 11, 14, 26, 29 и 30.
    target_text: دوست دارم (я люблю, мне нравится) / وقت (время) / ندارم (у меня нет)
  prs.a1.unit31.lesson06.teach.wrap_summary:
    title: Я люблю учёбу, но у меня нет времени
    gloss: Я люблю учёбу, но у меня нет времени.
    note: Сочетает تحصیل را دوست دارم («я люблю учёбу», уже знакомая конструкция) с اما وقت ندارم («но у меня нет времени»).
