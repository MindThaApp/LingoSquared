        می‌رفتم: я шёл (я ходил)
        می‌رفتی: ты шёл (другу)
        می‌رفت: он или она шла (ходил, ходила)
        می‌رفتیم: мы шли (мы ходили)
        می‌رفتین: вы шли (вежливо или во мн. числе)
        می‌رفتند: они шли (они ходили)
        سرک: улица
        پیاده: пешком
        ترافیک: движение на дороге, пробки
        باد: ветер
      status: correct
    feedback: 'Каждое окончание показывает, кто шёл: *-م* — я, *-ی* — ты (с другом), без окончания — он или она, *-یم* — мы, *-ین* — вы (вежливо или мн. число), *-ند* — они.'
