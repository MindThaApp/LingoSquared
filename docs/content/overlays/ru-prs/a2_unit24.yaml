      right: я шёл (я ходил)
    - left: می‌رفتی
      right: ты шёл (другу)
    - left: می‌رفت
      right: он или она шла (ходил, ходила)
    - left: می‌رفتیم
      right: мы шли (мы ходили)
    - left: می‌رفتین
      right: вы шли (вежливо или во мн. числе)
    - left: می‌رفتند
      right: они шли (они ходили)
    - left: سرک
      right: улица
    - left: پیاده
      right: пешком
    - left: ترافیک
      right: движение на дороге, пробки
    - left: باد
      right: ветер
