  prs.a2.unit24.lesson05.exercise06.match_incident_sentences:
    instruction: Соедини каждое предложение из сообщения с его значением.
    accepted_answers:
    - value:
        به دفتر می‌رفتم: Я шёл в офис
        در سرک ترافیک زیاد بود: На улице были большие пробки
        در بس منتظر بودم: Я ждал в автобусе
        باران شروع شد: Начался дождь
        همان وقت تیلفونم زنگ زد: Именно в этот момент мне позвонили
