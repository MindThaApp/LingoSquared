  prs.a2.unit24.lesson05.exercise01.read_waiting:
    instruction: Прочитай сообщение. Что делал автор, когда начался дождь?
    correct_option: Ждал автобус
    distractors:
    - Шёл пешком по улице
    - Завтракал
    - Работал в офисе
    accepted_answers:
    - value: Ждал автобус
      status: correct
    feedback: '*وقتی که در بس منتظر بودم، باران شروع شد* значит «пока я ждал автобус, начался дождь».'
  prs.a2.unit24.lesson05.exercise02.read_same_moment:
    instruction: Прочитай сообщение. Что произошло в тот же момент, что и дождь?
    correct_option: Зазвонил его телефон
    distractors:
    - Автобус сломался
    - Отключили электричество
    - Пришёл друг
    accepted_answers:
    - value: Зазвонил его телефон
      status: correct
    feedback: '*همان وقت تیلفونم زنگ زد* значит «в тот же момент зазвонил мой телефон».'
  prs.a2.unit24.lesson05.exercise03.read_traffic:
    instruction: Прочитай сообщение. Какое было движение на улице?
