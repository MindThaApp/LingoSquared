    feedback: '*برف* — это «снег», поэтому *برف می‌بارید* значит «шёл снег».'
  prs.a2.unit24.lesson01.exercise04.match_forms_and_words:
    instruction: Соедини каждое слово на дари с его значением.
    accepted_answers:
