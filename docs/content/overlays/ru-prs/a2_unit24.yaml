course:
  title: Дари A2
  description: 'Дари Афганистана, уровень выше начального: как рассказать, что происходило, когда случилось что-то другое. Длительное прошедшее время с می‌ и основой прошедшего времени, необязательная конструкция در حال ... بودم, простое прошедшее для прервавшего события, связки وقتی که, ناگهان и همان وقت.'
units:
  prs.a2.unit24.what_was_happening:
    title: Что происходило, когда...
lessons:
  prs.a2.unit24.lesson01.words_and_continuing_past:
    title: Погода, слова об улице и форма می‌رفتم
  prs.a2.unit24.lesson02.more_verbs_and_things:
    title: Ещё глаголы и слова из истории
  prs.a2.unit24.lesson03.contrast_finished_or_ongoing:
    title: Завершённое действие или действие в процессе
  prs.a2.unit24.lesson04.telling_what_was_happening:
    title: 'Рассказываем, что происходило: وقتی که …'
  prs.a2.unit24.lesson05.reading_and_listening:
    title: Читаем и слушаем о происшествии
  prs.a2.unit24.lesson06.conversation_and_mixed:
    title: Разговор о вчерашнем вечере
teaching:
  prs.a2.unit24.lesson01.teach.sarak:
    title: Улица
    gloss: улица, дорога
    note: '*سرک* — это улица или дорога. С предлогом *در* значит «на улице»: *در سرک*. Мы начинаем юнит с улицы, потому что именно там происходит большинство наших небольших случаев.'
    example_gloss: Наш офис находится недалеко от дороги.
  prs.a2.unit24.lesson01.teach.piyada:
    title: Пешком
    gloss: пешком
    note: '*پیاده* значит «пешком». *پیاده می‌روم* — «я иду пешком». Здесь глагол в настоящем времени *می‌روم*; в этом юните ты встретишь прошедшее время той же модели.'
    example_gloss: Каждый день я хожу в офис пешком.
  prs.a2.unit24.lesson01.teach.rain:
    title: Дождь
    gloss: дождь
    note: '*باران* — это дождь. *شروع شد* значит «начался»: *باران شروع شد* — «начался дождь». Эту пару ты будешь использовать для прервавшего события на протяжении всего юнита.'
    example_gloss: Начался дождь.
  prs.a2.unit24.lesson01.teach.snow:
    title: Идёт дождь, идёт снег
    gloss: идёт дождь, идёт снег
    note: '*برف* — это снег. Глагол *باریدن* (идти — о дожде и снеге) употребляется в обоих случаях: *باران می‌بارد* — идёт дождь, *برف می‌بارد* — идёт снег. Обе формы — настоящее время с *می*.'
    example_gloss:
    - Сегодня идёт дождь.
    - В Кабуле идёт снег.
  prs.a2.unit24.lesson01.teach.wind:
    title: Ветер
    gloss: ветер
    note: '*باد* — это ветер. Чтобы сказать «ветрено», говорят «много ветра»: *باد زیاد است*.'
    example_gloss: Сегодня сильный ветер.
  prs.a2.unit24.lesson01.teach.traffic:
    title: Пробки
    gloss: движение на дороге, пробки
    note: '*ترافیک* — это дорожное движение. *ترافیک زیاد* — это большие пробки, очень частая причина опоздания.'
    example_gloss: На улице большие пробки.
  prs.a2.unit24.lesson01.teach.imperfect_paradigm:
    title: 'Я шёл (длительное прошлое): می + основа прошедшего времени + окончания'
    gloss: я шёл, ты шёл, он/она шёл(шла), мы шли, вы шли (вежливая форма или мн. число), они шли
    note: 'Простое прошедшее время для завершённого действия ты уже знаешь: *رفتم* — «я пошёл, я ходил». Чтобы сказать, что происходило в какой-то момент в прошлом, поставь *می‌* перед глаголом в прошедшем времени: *می‌رفتم* — «я шёл». Схема такая: *می‌* + основа прошедшего времени (*رفت*) + те же окончания: *می‌رفتم، می‌رفتی، می‌رفت، می‌رفتیم، می‌رفتین، می‌رفتند*. Местоимения *من، تو، او، ما، شما، آن‌ها* необязательны. С погодой так же: *باران می‌بارید* — «шёл дождь», *برف می‌بارید* — «шёл снег». Сравни с настоящим временем *می‌روم* («я иду»): меняются только основа и окончание. Та же форма *می‌رفتم* может означать и «я обычно ходил» (привычка), например *هر روز پیاده می‌رفتم*; какое значение имеется в виду, подскажет остальная часть предложения. В этом уроке чаще всего она будет означать «я шёл».'
  prs.a2.unit24.lesson02.teach.car:
    title: Машина
    gloss: машина
    note: '*موتر* — обычное афганское слово для автомобиля. *در موتر* — в машине.'
    example_gloss: Наша машина новая.
  prs.a2.unit24.lesson02.teach.phone:
    title: Телефон
    gloss: телефон
    note: '*تیلفون* — телефон. Добавь *-م*, чтобы сказать «мой»: *تیلفونم* — мой телефон.'
    example_gloss: Мой телефон включён.
  prs.a2.unit24.lesson02.teach.umbrella:
    title: Зонт
    gloss: зонт
    note: '*چتر* — зонт. Дождь и зонт связаны: *چتر دارم* — «у меня есть зонт», *چتر ندارم* — «у меня нет зонта».'
    example_gloss: Сегодня идёт дождь, у меня есть зонт.
  prs.a2.unit24.lesson02.teach.wet:
    title: Промокнуть
    gloss: промокнуть
    note: '*خیس* — мокрый, а *خیس شدن* — промокнуть. *خیس شدم* — «я промок», частое следствие дождя.'
    example_gloss: Если пойдёт дождь, я промокну.
  prs.a2.unit24.lesson02.teach.ring:
    title: Звонить
    gloss: звонить; позвонить кому-то
    note: 'У *زنگ زدن* два значения. Телефон может звонить: *تیلفونم زنگ زد* (мой телефон зазвонил). Человек может позвонить кому-то: *دوستم به من زنگ زد* (мой друг мне позвонил). Основа прошедшего времени — *زد*, от *زدن*.'
    example_gloss: Мой друг мне позвонил.
  prs.a2.unit24.lesson02.teach.driving:
    title: Водить машину
    gloss: водить машину, ездить за рулём
    note: '*رانندگی کردن* — водить машину. *رانندگی* — «вождение», а *کردن* — глагол «делать», как в *خرید کردن*. Это существительное плюс *کردن*, поэтому меняется именно глагольная часть: *رانندگی کردم*.'
    example_gloss: Я езжу за рулём каждый день.
  prs.a2.unit24.lesson02.teach.more_verbs:
    title: Та же схема с другими глаголами
    gloss: я делал, ты делал, я ел, я видел или смотрел, я приходил (шёл)
    note: 'Все глаголы подчиняются одному правилу: *می‌* + основа прошедшего времени + окончание. От *کردن* получаем *می‌کردم* («я делал») и *می‌کردی* («ты делал»). От *خوردن* — *می‌خوردم* («я ел»). От *دیدن* — *می‌دیدم* («я видел»; о фильме — «я смотрел»). От *آمدن* — *می‌آمدم* («я шёл, я приходил»). В глаголе вроде *آشپزی کردن* меняется только глагольная часть: *آشپزی می‌کردم* — «я готовил», а не *می‌آشپزی*. Основа не меняется, меняются только окончания.'
  prs.a2.unit24.lesson02.teach.cooking:
    title: я готовил
    gloss: Я готовил.
    note: '*آشپزی* — приготовление еды, слово, которое повторяется из уроков о распорядке дня. *آشپزی می‌کردم* означает, что ты как раз был за готовкой.'
  prs.a2.unit24.lesson02.teach.watching:
    title: Я смотрел фильм дома
    gloss: Я смотрел фильм дома.
    note: '*فلم دیدن* — смотреть фильм, поэтому длительное прошлое — *فلم می‌دیدم*. *در خانه* — дома.'
  prs.a2.unit24.lesson02.teach.driving_car:
    title: Я вёл машину
    gloss: Я ехал за рулём машины.
    note: '*در موتر* — в машине, а *رانندگی می‌کردم* — «я вёл машину».'
  prs.a2.unit24.lesson03.teach.was_paradigm:
    title: 'Был, была, были: بودن в прошедшем времени'
    gloss: я был(а), ты был(а), он/она/оно был(а), мы были, вы были (вежливая форма или мн. число), они были
    note: '*بودن* — «быть». Прошедшее время образуется как у любого другого глагола: основа *بود* плюс окончания *بودم، بودی، بود، بودیم، بودین، بودند*. Так говорят «был» или «были»: *در موتر بودم* (я был в машине), *ترافیک زیاد بود* (были большие пробки). Не путай с настоящим временем *استم، استی، است*. Состояние, например нахождение где-то или ожидание, не требует *می‌*, потому что *بودم* уже описывает ситуацию в тот момент в прошлом.'
  prs.a2.unit24.lesson03.teach.waiting:
    title: Ждать
    gloss: ждать, находиться в ожидании
    note: '*منتظر بودن* — ждать. Ожидание — это состояние, поэтому прошедшее время просто *منتظر بودم* («я ждал»), без *می‌*. То, чего ждёшь, ставится перед *منتظر*: *منتظر بس بودم*.'
    example_gloss: На остановке я ждал автобус.
  prs.a2.unit24.lesson03.teach.negative_continuing:
    title: 'Не шёл: نمی + основа прошедшего времени'
    gloss: я не шёл, я не ел, я не видел, я не делал
    note: 'Чтобы сказать, что в тот момент ты чего-то не делал, поставь *نمی‌* перед основой прошедшего времени вместо *می‌*: *نمی‌رفتم* («я не шёл»), *نمی‌خوردم* («я не ел»), *نمی‌دیدم* («я не видел»), *نمی‌کردم* («я не делал»). Сравни с простым отрицательным прошедшим из урока о выходных: *نرفتم* — «я не пошёл» (завершённый факт: этого не произошло), а *نمی‌رفتم* — «я не шёл» (в тот момент не был в процессе) или «я обычно не ходил».'
  prs.a2.unit24.lesson03.teach.finished_vs_ongoing:
    title: Пошёл и шёл
    gloss: Я пошёл домой. / Я шёл домой.
    note: 'Эти две формы выглядят почти одинаково, но рассказывают о разном. *به خانه رفتم* — «я пошёл домой»: путь завершён. *به خانه می‌رفتم* — «я шёл домой»: я был в дороге, ещё не дошёл, и по пути что-то могло случиться. Когда рассказываешь о происходящем, более долгое фоновое действие ставится с *می‌*, а внезапное событие — в простом прошедшем без *می‌*.'
  prs.a2.unit24.lesson03.teach.when_two_pasts:
    title: Когда + простое прошедшее или когда + می
    gloss: Когда я пришёл домой, начался дождь. / Когда я шёл по улице, начался дождь.
    note: 'В обоих предложениях есть *وقتی که* («когда»), но значение определяется глаголом после него. С простым прошедшим, *وقتی که به خانه رسیدم، باران شروع شد*, первое событие завершено, а второе следует за ним: после того как я пришёл домой, начался дождь. С *می‌*, *وقتی که در سرک می‌رفتم، باران شروع شد*, первое действие ещё продолжалось, и дождь начался посреди него. Чтобы рассказать, что происходило, нужна вторая схема.'
  prs.a2.unit24.lesson03.teach.in_progress_emphasis:
    title: 'Необязательная форма: در حال … بودم'
    gloss: Я как раз шёл. / Я как раз готовил. / Я как раз иду.
    note: 'В дари есть второй, чуть более сильный способ сказать, что действие шло: *در حال* + инфинитив + *بودم*. *در حال رفتن بودم* — «я как раз шёл»; с существительным и *کردن* инфинитив ставится целиком: *در حال آشپزی کردن بودم*. Значение то же, что у простых *می‌رفتم* и *آشپزی می‌کردم*; просто сильнее подчёркивается, что действие шло в этот момент. Использовать её не обязательно, обе формы везде в этом уроке правильны. В настоящем времени есть такая же подчёркнутая форма: *در حال رفتن استم* — «я как раз иду», но обычно говорят просто *می‌روم*.'
  prs.a2.unit24.lesson04.teach.when_pattern:
    title: 'Схема: وقتی که + می, затем событие'
    gloss: Когда я шёл по улице, начался дождь.
    note: 'Чтобы сказать, что происходило, когда что-то случилось, построй предложение из двух частей. Сначала фон: *وقتی که* + действие в процессе с *می‌*: *وقتی که در سرک می‌رفتم*. Затем запятая и событие, которое прервало его, в простом прошедшем без *می‌*: *باران شروع شد*. Получается: *وقتی که در سرک می‌رفتم، باران شروع شد.* Длительное действие (*می‌رفتم*) уже шло, и короткое событие (*شروع شد*) вклинилось в него. То же получается и с необязательной подчёркнутой формой: *وقتی که در حال رفتن بودم، باران شروع شد*. *که* можно опустить и сказать просто *وقتی*.'
  prs.a2.unit24.lesson04.teach.suddenly:
    title: Вдруг
    gloss: вдруг, внезапно
    note: '*ناگهان* значит «вдруг». Оно ставится прямо перед глаголом внезапного события, как в *ناگهان باران شروع شد*. Хорошо сочетается с прерывающим глаголом, который стоит в простом прошедшем.'
    example_gloss: Вдруг начался дождь.
  prs.a2.unit24.lesson04.teach.same_time:
    title: В этот момент
    gloss: в тот же момент
    note: '*همان وقت* — «в тот же момент». Ставится в начале нового предложения, чтобы добавить второе событие, случившееся одновременно: *همان وقت تیلفونم زنگ زد*.'
    example_gloss: В тот же момент зазвонил мой телефон.
  prs.a2.unit24.lesson04.teach.power_cut:
    title: Отключили электричество
    gloss: отключили электричество
    note: '*برق* — электричество. *برق رفت* — «отключили электричество» (электричество ушло), небольшое происшествие, которое прерывает то, чем ты занимался.'
    example_gloss: Вдруг отключили электричество.
  prs.a2.unit24.lesson04.teach.event_vs_background:
    title: У какого глагола есть می, а у какого нет
    gloss: Когда я смотрел фильм, вдруг отключили электричество. В тот же момент зазвонил мой телефон.
    note: 'Проверь в каждом предложении два вида глаголов. У фонового действия есть *می‌*: *فلم می‌دیدم* («я смотрел фильм»), потому что оно длится какое-то время. У прерывающего события *می‌* нет: *برق رفت* («отключили электричество»), потому что это случается один раз и заканчивается. *ناگهان* или *همان وقت* относятся к событию, а не к фону. Если бы у обоих глаголов был *می‌* или у обоих его не было, предложение перестало бы показывать, какое действие прервало другое.'
  prs.a2.unit24.lesson05.teach.got_wet_we:
    title: Мы промокли
    gloss: мы промокли
    note: '*شدیم* — «мы стали», простое прошедшее от *شدن* с окончанием *-یم*. *خیس شدیم* — «мы промокли».'
    example_gloss: На улице начался дождь, и мы промокли.
  prs.a2.unit24.lesson05.teach.friend_pl:
    title: С моими друзьями
    gloss: с моими друзьями
    note: '*دوستانم* — «мои друзья», а *با* — «с»: *با دوستانم* — «с моими друзьями». Ты услышишь это в следующем диалоге.'
    example_gloss: В пятницу я был на базаре с друзьями.
  prs.a2.unit24.lesson05.teach.message:
    title: Сообщение о вчерашнем утре
    gloss: Вчера утром я ехал в офис. На улице были большие пробки. Пока я ждал в автобусе, начался дождь. В тот же момент зазвонил мой телефон. Это был мой друг. Я опоздал в офис.
    note: 'Короткий письменный рассказ о небольшом происшествии. У фона есть *می‌*: *به دفتر می‌رفتم*. Ожидание — это состояние, *منتظر بودم*. Два события стоят в простом прошедшем: *باران شروع شد* и *تیلفونم زنگ زد*.'
  prs.a2.unit24.lesson05.teach.exchange_q:
    title: Хумаюн спрашивает Зарминa о пятнице
    gloss: Зармина, что случилось на базаре в пятницу?
    note: Хумаюн спрашивает *چه شد؟* — «что случилось?». Это обычный способ попросить рассказать о небольшом происшествии.
  prs.a2.unit24.lesson05.teach.exchange_a:
    title: Зармина рассказывает, что случилось
    gloss: Когда я шла по базару с подругами, начался дождь. Зонта у меня не было, и мы промокли.
    note: Зармина даёт фон с *می‌* (*می‌رفتم*), а затем событие (*باران شروع شد*). Её итог, *خیس شدیم*, тоже стоит в простом прошедшем.
  prs.a2.unit24.lesson06.teach.turn01:
    title: Хумаюн спрашивает, чем занималась Зармина
    gloss: Зармина, что ты делала вчера вечером?
    note: '*چه کار می‌کردی؟* — «что ты делала?». Вопрос о действии в процессе, поэтому используется *می‌کردی*, а не завершённое *کردی*.'
  prs.a2.unit24.lesson06.teach.turn02:
    title: Зармина говорит, что делала и что случилось
    gloss: Когда я смотрела фильм, вдруг отключили электричество.
    note: Фон — *فلم می‌دیدم*, затем событие *برق رفت* с *ناگهان*.
  prs.a2.unit24.lesson06.teach.turn03:
    title: Хумаюн спрашивает, что она сделала потом
    gloss: Что ты сделала потом?
    note: '*چه کار کردی؟* в простом прошедшем спрашивает о завершённом действии: «что ты сделала?»'
  prs.a2.unit24.lesson06.teach.turn04:
    title: Зармина рассказывает о звонке и спрашивает в ответ
    gloss: В тот же момент зазвонил мой телефон. Это была моя подруга. Я с ней поговорила. А ты?
    note: '*همان وقت* добавляет второе событие. *با او صحبت کردم* — «я с ней поговорила», а *تو چطور؟* — «а ты?».'
  prs.a2.unit24.lesson06.teach.turn05:
    title: Хумаюн рассказывает об автобусе и погоде
    gloss: Я ехал домой из офиса. Я был в автобусе. Были большие пробки, и ещё шёл дождь.
    note: Он использует *می‌آمدم* для поездки, *بودم* и *زیاد بود* для обстановки и *می‌بارید* для идущего дождя.
  prs.a2.unit24.lesson06.teach.bad:
    title: Как плохо!
    gloss: плохо; как жаль!
    note: '*بد* значит «плохой». *چه بد!* — «как плохо!» или «как жаль!», дружеская реакция на маленькую неудачу.'
    example_gloss: Сегодня идёт дождь и пробки ужасные.
  prs.a2.unit24.lesson06.teach.turn06:
    title: Зармина реагирует
    gloss: Как плохо!
    note: '*چه بد!* — дружеская реакция на плохие новости, противоположность *چه خوب!*.'
exercises:
  prs.a2.unit24.lesson01.exercise01.recognize_it_was_raining:
    instruction: Что означает это предложение?
