course:
  title: Дари A1
  description: 'Начальный дари Афганистана: лексика еды и напитков, вежливый заказ, вопрос о том, что есть в наличии, количества и этикет в ресторане, включая просьбу принести счёт.'
units:
  prs.a1.unit08.food:
    title: Еда и заказ блюд
lessons:
  prs.a1.unit08.lesson01.food_and_drink_vocabulary:
    title: Еда и напитки
  prs.a1.unit08.lesson02.polite_ordering:
    title: Вежливый заказ
  prs.a1.unit08.lesson03.asking_whats_available:
    title: Спросить, что есть
  prs.a1.unit08.lesson04.quantities:
    title: Заказ определённого количества
  prs.a1.unit08.lesson05.restaurant_etiquette_and_bill:
    title: Этикет в ресторане и счёт
  prs.a1.unit08.lesson06.restaurant_dialogue:
    title: Полный разговор в чайхане
teaching:
  prs.a1.unit08.lesson01.teach.naan:
    title: Хлеб
    gloss: хлеб
    note: نان — основа любой афганской трапезы.
    example_gloss: Хлеб свежий.
  prs.a1.unit08.lesson01.teach.palaw:
    title: Плов
    gloss: плов
    note: پلو — афганский плов, особым образом приправленный и часто приготовленный с мясом, морковью или изюмом, а не просто отварной рис.
    example_gloss: Плов очень вкусный.
  prs.a1.unit08.lesson01.teach.qorma:
    title: Мясное блюдо с овощами
    gloss: рагу из мяса с овощами
    note: قورمه — общее название тушёного блюда из мяса и овощей, которое обычно подают к پلو.
    example_gloss: Я ем рагу с пловом.
  prs.a1.unit08.lesson01.teach.chai_review:
    title: Чай (повторение)
    gloss: чай
    note: چای — напиток, который предлагают почти везде в Афганистане.
    example_gloss: Один чай, пожалуйста.
  prs.a1.unit08.lesson01.teach.ab_water:
    title: Вода
    gloss: вода
    note: آب — обычное слово для обозначения воды.
    example_gloss: Один стакан воды, пожалуйста.
  prs.a1.unit08.lesson01.teach.va_word:
    title: И
    gloss: и
    note: و — обычный соединительный союз, которым связывают перечень блюд.
    target_text: و (и)
  prs.a1.unit08.lesson02.teach.mikham_chai:
    title: Вежливо заказываем чай
    gloss: Мне, пожалуйста, чай.
    note: 'یک چای می‌خواهم — нейтральный вежливый способ сделать заказ: используется می‌خواهم («я хочу») напрямую, без более уклончивой конструкции.'
  prs.a1.unit08.lesson02.teach.lotfan:
    title: Пожалуйста
    gloss: пожалуйста
    note: لطفاً можно добавить, чтобы смягчить почти любую просьбу.
    example_gloss: Помогите, пожалуйста.
  prs.a1.unit08.lesson02.teach.mikham_naan:
    title: Вежливо заказываем хлеб
    gloss: Мне, пожалуйста, одну лепёшку хлеба.
    note: Та же модель یک [предмет] می‌خواهم подходит для любого названия еды или напитка.
  prs.a1.unit08.lesson03.teach.what_do_you_have:
    title: Спросить, что есть
    gloss: Что у вас есть?
    note: چی دارین؟ — естественный вопрос к продавцу или официанту о том, какая еда есть.
  prs.a1.unit08.lesson03.teach.we_have_both:
    title: Отвечаем, что есть в наличии
    gloss: У нас есть плов и рагу.
    note: В پلو و قورمه داریم использовано داریم («у нас есть») — форма «мы» от دارم. Продавец говорит «мы», потому что говорит от имени всего заведения.
  prs.a1.unit08.lesson03.teach.fresh_word:
    title: Свежий
    gloss: свежий
    note: تازه говорят о только что приготовленной еде.
    example_gloss: Этот хлеб свежий.
  prs.a1.unit08.lesson04.teach.yek_boshghab:
    title: Тарелка плова
    gloss: тарелка плова
    note: بشقاب («тарелка») — счётное слово для еды, которую подают на тарелке.
  prs.a1.unit08.lesson04.teach.do_ta_naan:
    title: Две лепёшки хлеба
    gloss: две лепёшки хлеба
    note: تا — общее счётное слово, которое ставится после числительного при большинстве исчисляемых предметов; здесь — две штуки хлеба.
  prs.a1.unit08.lesson04.teach.combined_order:
    title: Составляем полный заказ
    gloss: Тарелку плова и две лепёшки хлеба, пожалуйста.
    note: Несколько названий с количеством можно соединить в одном заказе с помощью و («и»).
  prs.a1.unit08.lesson05.teach.bill_word:
    title: Счёт
    gloss: счёт
    note: بل (от английского «bill») — обычное афганское слово для счёта в ресторане.
    example_gloss: Счёт, пожалуйста.
  prs.a1.unit08.lesson05.teach.bill_request:
    title: Спрашиваем, сколько составляет счёт
    gloss: Сколько с нас?
    note: 'بل چند می‌شه؟ буквально: «счёт становится сколько» — естественный повседневный вопрос об итоговой сумме. می‌شه — разговорная форма от می‌شود; именно её слышишь в магазине, а на письме используется می‌شود.'
  prs.a1.unit08.lesson05.teach.khoshmaze:
    title: Говорим, что еда была вкусной
    gloss: Было очень вкусно.
    note: خیلی خوش‌مزه بود — естественный комплимент после еды.
  prs.a1.unit08.lesson05.teach.chaikhana:
    title: Чайхана
    gloss: чайхана / простая столовая
    note: چایخانه — распространённый в Афганистане, особенно в Кабуле, тип простого заведения, где подают чай и несложные блюда.
  prs.a1.unit08.lesson06.teach.welcome_review:
    title: Добро пожаловать (повторение)
    gloss: добро пожаловать
    note: خوش آمدین встречалось в уроке о приветствиях; здесь это приветствие продавца.
  prs.a1.unit08.lesson06.teach.turn01:
    title: Продавец приветствует покупателя
    gloss: Продавец приветствует покупателя и спрашивает, что тот желает.
    note: چی میل دارین؟ — вежливый вопрос в начале разговора, по смыслу похожий на چی دارین؟, но с упором на желание покупателя.
  prs.a1.unit08.lesson06.teach.turn02:
    title: Покупатель спрашивает, что есть
    gloss: Покупатель здоровается с продавцом и спрашивает, что есть в наличии.
    note: چی دارین؟ начинает разговор о заказе, из урока 3.
  prs.a1.unit08.lesson06.teach.turn03:
    title: Продавец перечисляет, что есть
    gloss: Продавец говорит, что у них есть плов и рагу, и то и другое свежее.
    note: هردو («оба») подтверждает, что оба упомянутых блюда свежие.
  prs.a1.unit08.lesson06.teach.turn04:
    title: Покупатель делает полный заказ
    gloss: Покупатель соглашается и заказывает тарелку плова с рагу и ещё чай.
    note: Здесь соединяются модель с количеством из урока 4 и названия еды из урока 1.
  prs.a1.unit08.lesson06.teach.turn05:
    title: Продавец принимает заказ
    gloss: Продавец говорит, что сейчас же принесёт заказ.
    note: چشم, буквально «на мой глаз», — уважительный способ сказать «непременно». می‌آرم — разговорная форма от می‌آورم («я приношу»), а همین حالا означает «прямо сейчас».
  prs.a1.unit08.lesson06.teach.turn06:
    title: Покупатель хвалит еду и просит счёт
    gloss: Покупатель говорит, что было вкусно, и спрашивает, сколько с него.
    note: Обе фразы напрямую повторяют лексику урока 5.
  prs.a1.unit08.lesson06.teach.turn07:
    title: Продавец называет сумму
    gloss: Продавец благодарит и говорит, что с покупателя двести афгани.
    note: افغانی — валюта Афганистана; دوصد («двести») вместе с названием валюты обозначает цену.
