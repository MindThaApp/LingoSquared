  prs.a1.unit18.lesson06.teach.you_word:
    title: Вы (вежливо)
    gloss: вы
    note: شما — вежливое местоимение 2-го лица («вы»).
    target_text: شما (вы — вежливо)
  prs.a1.unit18.lesson06.teach.what_is_word:
    title: Что такое
    gloss: что есть
    note: چیست значит «что (это) есть»; کار شما چیست؟ — «Кем вы работаете?» (букв. «Какое ваше дело?»).
    target_text: چیست (что такое / что)
  prs.a1.unit18.lesson06.teach.yes_word:
    title: Да
    gloss: да
    note: بلی — вежливое, официальное «да», что соответствует стилю этого курса.
    example_gloss: Да, я работаю каждый день.
  prs.a1.unit18.lesson06.teach.dialogue_line1:
    title: Башир спрашивает
    gloss: Кем вы работаете?
  prs.a1.unit18.lesson06.teach.dialogue_line2:
    title: Негар отвечает
    gloss: Я врач. Я работаю в больнице.
  prs.a1.unit18.lesson06.teach.dialogue_line3:
    title: Башир спрашивает
    gloss: Вы работаете каждый день?
  prs.a1.unit18.lesson06.teach.dialogue_line4:
    title: Негар отвечает
    gloss: Да, я работаю каждый день.
