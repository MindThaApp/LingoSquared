    title: Есть (3-е лицо)
    gloss: есть (он/она — 3-е лицо)
    note: 'است — связка 3-го лица: معلم است значит «он/она учитель(ница)».'
    target_text: است (есть; он/она — , 3-е лицо)
  prs.a1.unit18.lesson04.teach.he_she_works_word:
    title: Он/она работает
    gloss: он/она работает
    note: 'می‌کند — настоящее время 3-го лица от کردن («делать»): کار می‌کند значит «он/она работает».'
    target_text: کار می‌کند (он/она работает)
  prs.a1.unit18.lesson04.teach.laila_word:
    title: Лайла
    gloss: Лайла
    note: Имя персонажа, который встречается в этом курсе не раз; впервые оно появилось в теме о знакомстве.
    example_gloss: Лайла — учительница.
  prs.a1.unit18.lesson04.teach.profile_text:
    title: Краткий рассказ о работе
    gloss: Лайла — учительница. Она работает в школе.
    note: 'Краткий рассказ о человеке в 3-м лице: профессия и место работы.'
  prs.a1.unit18.lesson05.teach.every_word:
    title: Каждый
    gloss: каждый
    note: هر означает «каждый».
    example_gloss: Я работаю каждый день.
  prs.a1.unit18.lesson05.teach.day_word:
    title: День
    gloss: день
    note: روز означает «день»; هر روز — «каждый день».
    example_gloss: Она преподаёт каждый день.
  prs.a1.unit18.lesson05.teach.lesson_word:
    title: Урок
    gloss: урок
    note: درس означает «урок».
    example_gloss: Лайла преподаёт.
  prs.a1.unit18.lesson05.teach.gives_word:
    title: Он/она даёт
    gloss: он/она даёт
    note: 'می‌دهد — настоящее время 3-го лица от دادن («давать»): درس می‌دهد буквально значит «даёт уроки», то есть «преподаёт».'
    target_text: می‌دهد (он/она даёт — درس می‌دهد значит «преподаёт»)
  prs.a1.unit18.lesson05.teach.longer_profile_text:
    title: Более подробный рассказ о работе
    gloss: Лайла — учительница. Она работает в школе. Она преподаёт каждый день.
    note: Тот же рассказ, дополненный ежедневным занятием.
  prs.a1.unit18.lesson06.teach.names:
    title: Башир и Негар
    gloss: Башир, Негар
    note: Персонажи, которые встречаются в этом курсе не раз.
    example_gloss:
