course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: основные профессии (учитель, инженер, врач, лавочник), места работы (офис, лавка, больница, школа), сочетание профессии и места работы, чтение короткого и более длинного рассказа о работе, диалог о чьей-то профессии.'
units:
