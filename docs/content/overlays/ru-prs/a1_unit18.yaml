    example_gloss: Я лавочник.
  prs.a1.unit18.lesson01.teach.work_word:
    title: Работа
    gloss: работа
    note: کار означает «работа».
    example_gloss: У меня есть дело.
  prs.a1.unit18.lesson01.teach.am_word:
    title: Я есть / я
    gloss: я есмь (я — )
    note: استم — вежливая форма связки для 1-го лица, в соответствии с формами استم/استین, принятыми в этом курсе.
    target_text: استم (я есмь; я — )
  prs.a1.unit18.lesson02.teach.office_word:
    title: Офис
    gloss: офис
    note: دفتر означает «офис».
    example_gloss: Я работаю в офисе.
  prs.a1.unit18.lesson02.teach.shop_word:
    title: Лавка
    gloss: лавка
    note: دوکان означает «лавка».
    example_gloss: Я работаю в лавке.
  prs.a1.unit18.lesson02.teach.hospital_word:
    title: Больница
    gloss: больница
    note: شفاخانه — настоящее афганское слово «больница», уже встречавшееся в разделе о местах.
    example_gloss: Я работаю в больнице.
  prs.a1.unit18.lesson02.teach.school_word:
    title: Школа
    gloss: школа
    note: مکتب — настоящее афганское слово «школа», уже встречавшееся в разделе о местах.
    example_gloss: Я работаю в школе.
  prs.a1.unit18.lesson02.teach.in_word:
    title: В
    gloss: в / на
    note: 'در указывает место, где что-то происходит: در مکتب означает «в школе».'
    target_text: در (в / на)
  prs.a1.unit18.lesson02.teach.i_work_word:
    title: Я работаю
    gloss: я делаю / я работаю
    note: 'می‌کنم — форма 1-го лица настоящего времени от کردن («делать»): کار می‌کنم буквально значит «делаю работу», то есть «работаю».'
    target_text: کار می‌کنم (я работаю)
  prs.a1.unit18.lesson03.teach.where_word:
    title: Где
    gloss: где
    note: کجا означает «где».
    target_text: کجا (где)
  prs.a1.unit18.lesson03.teach.you_work_word:
    title: Вы работаете (вежливо)
    gloss: вы работаете
    note: کار می‌کنین означает «вы работаете» (вежливая форма).
    target_text: کار می‌کنین (вы работаете — вежливо)
  prs.a1.unit18.lesson03.teach.and_word:
    title: И
    gloss: и
    note: و означает «и» и соединяет две части предложения или два элемента.
    target_text: و (и)
