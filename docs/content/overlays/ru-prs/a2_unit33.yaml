course:
  title: Дари A2
  description: 'Дари Афганистана, уровень ниже среднего: как сказать, что ты начал, бросил, попытался сделать или забыл сделать. Начало с вещью и را, с به и инфинитивом или с که и сослагательным наклонением; отказ от привычки с ترک کردن и دیگر; «пытаться» и «забыть» с که и сослагательным наклонением.'
units:
  prs.a2.unit33.starting_stopping_trying:
    title: Начать, бросить, попытаться
lessons:
  prs.a2.unit33.lesson01.starting:
    title: 'Начать что-то: «Я начал бегать»'
  prs.a2.unit33.lesson02.that_i_run:
    title: '«Чтобы я бежал»: начать и попытаться с که'
  prs.a2.unit33.lesson03.stopping:
    title: 'Бросить: ترک کردن и «больше не»'
  prs.a2.unit33.lesson04.forgetting:
    title: Забыть что-то сделать
  prs.a2.unit33.lesson05.reading_and_listening:
    title: Читаем и слушаем о привычках
  prs.a2.unit33.lesson06.gym_conversation:
    title: Разговор в спортзале
teaching:
  prs.a2.unit33.lesson01.teach.gym:
    title: Спортзал
    gloss: спортзал, спортивный клуб
    note: '*باشگاه* — это спортзал или спортивный клуб. Туда идут с *به*: *به باشگاه می‌روم* — «я иду в спортзал».'
    example_gloss: Спортзал находится рядом с домом.
  prs.a2.unit33.lesson01.teach.run:
    title: Бегать
    gloss: бегать
    note: '*دویدن* — «бегать». Основа настоящего времени — *دو*, поэтому *می‌دوم* — «я бегу». Как и любой инфинитив, *دویدن* оканчивается на *-ن*; эту форму на *-ن* в этом уроке ты будешь использовать после *به*.'
    example_gloss: Я бегаю каждое утро.
  prs.a2.unit33.lesson01.teach.exercise:
    title: Заниматься спортом
    gloss: заниматься спортом
    note: '*ورزش کردن* — «заниматься спортом». Это глагол из двух слов: *ورزش* остаётся впереди, меняется только *کردن*, например *ورزش می‌کنم* («я занимаюсь спортом») и *ورزش کردم* («я занимался спортом»).'
    example_gloss: Я занимаюсь спортом каждый день.
  prs.a2.unit33.lesson01.teach.half_hour:
    title: Полчаса
    gloss: полчаса
    note: '*نیم ساعت* — «полчаса». *نیم* означает «половина» и стоит перед существительным: *نیم ساعت*, *نیم ساعت ورزش*.'
    example_gloss: Каждое утро я занимаюсь спортом полчаса.
  prs.a2.unit33.lesson01.teach.habit:
    title: Привычка
    gloss: привычка
    note: '*عادت* — «привычка». Весь этот раздел о привычках: как начать хорошую, бросить плохую, стараться сохранить привычку и забыть о ней.'
    example_gloss: Спорт — хорошая привычка.
  prs.a2.unit33.lesson01.teach.start_noun:
    title: 'Начать что-то: вещь + را + شروع کردن'
    gloss: Я начал заниматься спортом. Ты начал бегать. Он или она начал(а) работу.
    note: 'Чтобы сказать, что ты начал что-то, поставь это перед *را* и используй *شروع کردن* («начинать»): *ورزش را شروع کردم* — «я начал заниматься спортом». Это глагол из двух слов, как *ورزش کردن*, поэтому меняется только *کردن*: *شروع کردم، شروع کردی، شروع کرد، شروع کردیم، شروع کردین، شروع کردند*. Начинать можно существительное (*کار*, «работа») или инфинитив (*دویدن*, «бегать»). Местоимение необязательно, потому что окончание уже показывает лицо.'
  prs.a2.unit33.lesson01.teach.month_ago:
    title: Я начал заниматься спортом месяц назад
    gloss: Месяц назад я начал заниматься спортом.
    note: '*پیش* после слова о времени означает «назад»: *یک ماه پیش* — «месяц назад», *دو هفته پیش* — «две недели назад». Слово о времени обычно стоит в начале предложения.'
  prs.a2.unit33.lesson01.teach.start_to:
    title: 'Начать делать что-то: به + инфинитив + شروع کردن'
    gloss: Я начал бегать. Ты начал заниматься спортом. Он или она начал(а) читать.
    note: 'Чтобы сказать, что ты начал какое-то действие, поставь *به* и инфинитив (глагол в форме на *-ن*) перед *شروع کردن*: *به دویدن شروع کردم* — «я начал бегать». В глаголе из двух слов оба слова остаются в инфинитиве: *به ورزش کردن شروع کردم* — «я начал заниматься спортом». Часто слышен и другой порядок, *شروع کردم به دویدن*, с тем же значением. Сравни две модели: *ورزش را شروع کردم* называет вещь, которую ты начал, а *به ورزش کردن شروع کردم* — действие.'
  prs.a2.unit33.lesson01.teach.read_start:
    title: Две недели назад он или она начал(а) читать книги
    gloss: Две недели назад он или она начал(а) читать книги.
    note: '*خواندن* — «читать» (и «учиться»). Инфинитив *خواندن* стоит после *به*, а его объект *کتاب* может идти следом: *به خواندن کتاب شروع کرد*.'
  prs.a2.unit33.lesson02.teach.sleep:
    title: Спать, ложиться спать
    gloss: спать, ложиться спать
    note: '*خوابیدن* — «спать» или «ложиться спать». Основа настоящего времени — *خواب*: *می‌خوابم* — «я сплю». *شب‌ها* означает «по вечерам» или «по ночам» и служит словом о времени.'
    example_gloss: По вечерам я рано ложусь спать.
  prs.a2.unit33.lesson02.teach.try:
    title: Пытаться
    gloss: пытаться, стараться
    note: '*کوشش* — «усилие», а *کوشش کردن* — «пытаться, стараться». Это глагол из двух слов: *کوشش می‌کنم* — «я стараюсь», *کوشش کردم* — «я пытался». То, что ты пытаешься сделать, стоит после *که* в сослагательном наклонении.'
    example_gloss: Я стараюсь рано вставать.
  prs.a2.unit33.lesson02.teach.subjunctive:
    title: 'Сослагательное наклонение: ب + основа настоящего времени + окончание'
    gloss: чтобы я бежал, чтобы я спал, чтобы я читал, чтобы я ел, чтобы я шёл, чтобы я видел; чтобы я занимался спортом, чтобы я проснулся
    note: 'Сослагательное наклонение — форма глагола для того, что ты начинаешь, пытаешься сделать или забываешь сделать. Ты уже знаешь его по *باید*, например *باید بروم*. Чтобы образовать его, возьми основу настоящего времени, поставь впереди *ب-* и добавь окончания *-م، -ی، -د، -یم، -ین، -ند*. Для *دویدن* (основа *دو*): *بدوم، بدوی، بدود، بدویم، بدوین، بدوند*. Другие глаголы: *خوابیدن* даёт *بخوابم*, *خواندن* — *بخوانم*, *خوردن* — *بخورم*, *رفتن* — *بروم*, *دیدن* — *ببینم*. У глагола из двух слов *ب-* нет: первое слово остаётся, меняется только *کردن* или *شدن*, поэтому *ورزش کنم* («чтобы я занимался спортом») и *بیدار شوم* («чтобы я проснулся»).'
  prs.a2.unit33.lesson02.teach.che_pattern:
    title: شروع کردن и کوشش کردن с که
    gloss: Я начал бегать. Я стараюсь рано ложиться спать. Я пытался заниматься спортом.
    note: 'После *شروع کردن* и *کوشش کردن* добавляются *که* и глагол в сослагательном наклонении. *شروع کردم که بدوم* значит то же, что *به دویدن شروع کردم*: «я начал бегать». *کوشش می‌کنم که زود بخوابم* — «я стараюсь рано ложиться спать». Подлежащее обычно остаётся тем же, поэтому окончание сослагательного наклонения показывает то же лицо, что и главный глагол: *کوشش کردم که بروم*, *کوشش کردی که بروی*, *کوشش کرد که برود*. Время задаёт первый глагол («я пытался», «я пытаюсь»); у самого сослагательного наклонения собственного времени нет.'
  prs.a2.unit33.lesson02.teach.negative_subj:
    title: 'Отрицательное сослагательное наклонение: ن вместо ب'
    gloss: Я стараюсь не есть сладкое. Я стараюсь не ложиться поздно.
    note: 'Чтобы сказать «стараюсь не...», поставь *ن-* на место *ب-*: *بخورم* становится *نخورم* («чтобы я не ел»), *بخوابم* — *نخوابم*, *بروم* — *نروم*. Не пиши *نبخورم*. У глагола из двух слов *ن-* ставится перед глагольной частью: *ورزش نکنم* («чтобы я не занимался спортом»).'
  prs.a2.unit33.lesson02.teach.he_tried:
    title: Он или она старался (старалась) рано проснуться
    gloss: Он или она старался (старалась) рано проснуться.
    note: 'Окончание сослагательного наклонения показывает подлежащее: *شود* — это он или она, поэтому *او کوشش کرد که زود بیدار شود* значит «Он или она постарался(-лась) проснуться рано».'
  prs.a2.unit33.lesson02.teach.we_started:
    title: Мы начали заниматься спортом каждый день
    gloss: Мы начали заниматься спортом каждый день.
    note: 'Окончание *-یم* означает «мы» в обоих глаголах: *شروع کردیم* и *ورزش کنیم*.'
  prs.a2.unit33.lesson03.teach.quit:
    title: Бросить, отказаться
    gloss: бросить, отказаться от
    note: '*ترک کردن* значит «бросить» привычку или «отказаться» от чего-то. Это глагол из двух слов: *ترک کردم* — «я бросил(а)», *ترک می‌کنم* — «я бросаю».'
    example_gloss: Он или она перестал(а) есть сладкое.
  prs.a2.unit33.lesson03.teach.sweets:
    title: Сладости
    gloss: сладости, пирожные, сладкое
    note: '*شیرینی* — это сладости и пирожные. Хороший пример привычки, от которой люди пытаются избавиться.'
    example_gloss: Я люблю сладкое.
  prs.a2.unit33.lesson03.teach.for_hours:
    title: Часами
    gloss: часами
    note: '*ساعت‌ها* — множественное число от *ساعت*, означает «часами, долгое время». Так говорят о времени перед экраном: *ساعت‌ها ویدیو دیدم* — «Я часами смотрел(а) видео».'
    example_gloss: Он или она часами смотрит видео.
  prs.a2.unit33.lesson03.teach.sometimes:
    title: Иногда
    gloss: иногда
    note: '*گاهی* значит «иногда». Стоит в начале предложения или перед глаголом и противоположно по смыслу словам *همیشه* («всегда») и *هرگز* («никогда»).'
    example_gloss: Иногда я смотрю видео.
  prs.a2.unit33.lesson03.teach.quit_pattern:
    title: 'Отказ от привычки: привычка + را + ترک کردن'
    gloss: Я перестал(а) есть сладкое. Ты перестал(а) поздно ложиться. Он или она перестал(а) смотреть видео.
    note: 'Чтобы сказать, что ты бросил(а) привычку, поставь её перед *را* и добавь *ترک کردن*. Привычка выражается инфинитивной группой: *شیرینی خوردن* («есть сладкое»), *دیر خوابیدن* («поздно ложиться спать»), *ویدیو دیدن* («смотреть видео»). Схема та же, что в *ورزش را شروع کردم*: предмет, *را*, затем глагол. Можно также сказать *عادت بد را ترک کردم* («Я бросил(а) вредную привычку»).'
  prs.a2.unit33.lesson03.teach.no_longer:
    title: 'Больше не: دیگر + отрицательный глагол'
    gloss: Я больше не ем сладкое. Я больше не смотрю видео. Я больше не ложусь поздно.
    note: '*دیگر* с отрицательным глаголом значит «больше не»: *دیگر شیرینی نمی‌خورم* — «Я больше не ем сладкое». Это описывает положение дел сейчас, после отказа от чего-то. В рассказе о прошлом можно употребить *دیگر* с отрицательным простым прошедшим: *از آن روز دیگر شیرینی نخوردم* — «С того дня я больше не ел(а) сладкого». В настоящем *ترک کردم* говорит о принятом решении, а *دیگر نمی‌خورم* — о результате.'
  prs.a2.unit33.lesson03.teach.from_today:
    title: С сегодняшнего дня я больше не ложусь поздно
    gloss: С сегодняшнего дня я больше не ложусь поздно.
    note: '*از امروز* значит «с сегодняшнего дня». Вместе с *دیگر* и отрицательным глаголом это объявляет о новой привычке.'
  prs.a2.unit33.lesson03.teach.bad_habit:
    title: Я бросил(а) вредную привычку
    gloss: Я бросил(а) вредную привычку.
    note: '*عادت بد* — «вредная привычка». Прилагательное *بد* стоит после существительного.'
  prs.a2.unit33.lesson03.teach.less_phone:
    title: По вечерам я меньше пользуюсь телефоном
    gloss: По вечерам я меньше пользуюсь телефоном.
    note: '*کمتر* значит «меньше». Сократить время перед экраном — ещё один способ избавиться от привычки: ты не бросаешь совсем, а делаешь это реже.'
  prs.a2.unit33.lesson04.teach.forget:
    title: Забыть
    gloss: забыть
    note: '*فراموش کردن* значит «забыть». Это глагол из двух слов: *فراموش کردم* — «я забыл(а)», *فراموش نکردم* — «я не забыл(а)».'
    example_gloss: Извините, я забыл(а).
  prs.a2.unit33.lesson04.teach.why_not_come:
    title: Почему ты вчера не пришёл (не пришла)?
    gloss: Почему ты вчера не пришёл (не пришла)?
    note: '*نیامدی* — отрицательное простое прошедшее от *آمدن* для одного друга: «ты не пришёл». Вопрос *چرا* значит «почему».'
  prs.a2.unit33.lesson04.teach.forget_pattern:
    title: 'Забыть что-то сделать: فراموش کردن که + сослагательное наклонение'
    gloss: Я забыл(а) позвонить. Я забыл(а) принести книгу. Я забыл(а) лечь спать рано.
    note: 'Чтобы сказать, что ты забыл(а) что-то сделать, используй *فراموش کردن* с *که* и глаголом в сослагательном наклонении: *فراموش کردم که تیلفون کنم* — «Я забыл(а) позвонить», то есть звонка не было. Это то же сослагательное наклонение, что и в прошлых уроках, и подлежащее обычно остаётся тем же. *فراموش کردم* стоит в прошедшем времени, то есть речь о моменте, который уже прошёл; у сослагательного после *که* собственного времени нет.'
  prs.a2.unit33.lesson04.teach.not_forget:
    title: 'Я не забыл(а): فراموش نکردم که'
    gloss: Я не забыл(а) позвонить. Я не забыл(а) принести книгу.
    note: 'В *فراموش نکردم* отрицание стоит при *کردم*: «я не забыл(а)». После этого действие было выполнено: *فراموش نکردم که کتابم را بیاورم* — «Я не забыл(а) принести книгу», то есть я её принёс(ла). Сравни: *فراموش کردم که کتابم را بیاورم* («Я забыл(а) принести книгу», то есть не принёс(ла)).'
  prs.a2.unit33.lesson04.teach.four_verbs:
    title: Четыре глагола — четыре модели
    gloss: Я начал(а). Я бросил(а). Я постарался (постаралась). Я забыл(а).
    note: 'Все четыре глагола оканчиваются на *کردن*, поэтому личные окончания всегда одинаковы (*کردم، کردی، کرد، کردیم، کردین، کردند*). Различается то, что идёт дальше. *شروع کردن*: предмет и *را*, либо *به* и инфинитив, либо *که* и сослагательное наклонение. *ترک کردن*: привычка и *را*. *کوشش کردن*: *که* и сослагательное наклонение. *فراموش کردن*: *که* и сослагательное наклонение. Чтобы сказать, что ты больше чего-то не делаешь, используй *دیگر* и отрицательный глагол настоящего времени.'
  prs.a2.unit33.lesson04.teach.sorry_forgot_sleep:
    title: Я забыл(а) лечь спать рано
    gloss: Я забыл(а) лечь спать рано.
    note: Так говорят, когда что-то пошло не так из-за того, что ты не выдержал(а) привычку.
  prs.a2.unit33.lesson05.teach.read_book:
    title: Читать книгу
    gloss: читать книгу
    note: '*کتاب خواندن* значит «читать книгу». Настоящее время — *کتاب می‌خوانم* («я читаю книгу»); *خواندن* также значит «учиться».'
    example_gloss: Каждый вечер я читаю книгу полчаса.
  prs.a2.unit33.lesson05.teach.two_weeks:
    title: Две недели назад я начал(а) читать книги
    gloss: Две недели назад я начал(а) читать книги.
    note: 'Схема та же, что в первом уроке: слово со временем и *پیش*, затем *به* и инфинитив, затем *شروع کردم*.'
  prs.a2.unit33.lesson05.teach.dlg_turn01:
    title: Наджиба спрашивает Ясина, когда он начал
    gloss: Ясин, когда ты начал заниматься спортом?
    note: В *ورزش را کی شروع کردی؟* использована схема «предмет + *را* + *شروع کردی*». *کی* значит «когда». Говорящие — друзья, поэтому они обращаются на *تو*.
  prs.a2.unit33.lesson05.teach.dlg_turn02:
    title: Ясин говорит, когда и сколько
    gloss: Месяц назад. Теперь я каждое утро полчаса бегаю в спортзале.
    note: '*یک ماه پیش* — отправная точка. *حالا هر صبح نیم ساعت در باشگاه می‌دوم* — его нынешняя привычка.'
  prs.a2.unit33.lesson05.teach.dlg_turn03:
    title: Наджиба спрашивает про сладкое
    gloss: Очень хорошо! А сладкое ты ешь?
    note: '*خیلی خوب* — дружеская реакция. *شیرینی هم می‌خوری؟* — вопрос, ест ли он ещё и сладкое.'
  prs.a2.unit33.lesson05.teach.dlg_turn04:
    title: Ясин говорит, что бросил сладкое
    gloss: Нет, я перестал есть сладкое. Я больше не ем сладкого.
    note: '*شیرینی خوردن را ترک کردم* называет решение, а *دیگر شیرینی نمی‌خورم* — результат.'
  prs.a2.unit33.lesson05.teach.dlg_turn05:
    title: Наджиба спрашивает про видео
    gloss: Ты смотришь видео по вечерам?
    note: '*شب‌ها* — слово со значением времени, «по вечерам (ночам)», а *می‌بینی* значит «ты смотришь».'
  prs.a2.unit33.lesson05.teach.dlg_turn06:
    title: Ясин говорит, что старается смотреть меньше
    gloss: Да, но я стараюсь смотреть меньше.
    note: В *کوشش می‌کنم که کمتر ببینم* глагол *کوشش کردن* стоит с сослагательным *ببینم*. Видео он не бросил, он только пытается.
  prs.a2.unit33.lesson05.teach.khalida_message:
    title: Сообщение о новых привычках
    gloss: Привет, Наджиба. Две недели назад я начала читать книги. Каждый вечер я читаю полчаса. Я бросила смотреть видео, поэтому по вечерам больше не смотрю видео. Я стараюсь ложиться спать рано. Вчера я забыла позвонить тебе. Халида
    note: 'Короткое письменное сообщение, в котором есть все четыре модели: начало (*به خواندن کتاب شروع کردم*), отказ (*ویدیو دیدن را ترک کردم*), попытка (*کوشش می‌کنم که زود بخوابم*) и забывание (*فراموش کردم که تیلفون کنم*). Автор — не Ясин, а другой человек.'
  prs.a2.unit33.lesson06.teach.late_wake:
    title: Утром я проснулся (проснулась) поздно
    gloss: Утром я проснулся (проснулась) поздно.
    note: '*بیدار شدن* значит «проснуться». *دیر* — «поздно», *زود* — «рано»: *صبح زود بیدار شدم* — «Я проснулся (проснулась) рано утром».'
  prs.a2.unit33.lesson06.teach.every_night:
    title: Я стараюсь каждый вечер ложиться спать рано
    gloss: Я стараюсь каждый вечер ложиться спать рано.
    note: '*هر شب* значит «каждый вечер (каждую ночь)». Слово со значением времени вроде *هر شب* может стоять до *زود* или после него; здесь оно стоит после *که*.'
  prs.a2.unit33.lesson06.teach.dlg_turn01:
    title: Ясин спрашивает, почему Наджиба не пришла
    gloss: Наджиба, почему ты вчера не пришла в спортзал?
    note: '*چرا* значит «почему», а *نیامدی* — «ты не пришёл (не пришла)». *به باشگاه* — «в спортзал».'
  prs.a2.unit33.lesson06.teach.dlg_turn02:
    title: Наджиба говорит, что она забыла
    gloss: Я забыла лечь спать рано, поэтому утром проснулась поздно.
    note: '*فراموش کردم که زود بخوابم* — причина, с сослагательным *بخوابم*. *پس* («поэтому») вводит следствие: *صبح دیر بیدار شدم*.'
  prs.a2.unit33.lesson06.teach.dlg_turn03:
    title: Ясин спрашивает про сегодня
    gloss: Ты сегодня придёшь?
    note: '*می‌آیی* значит «ты приходишь» или «ты придёшь», для одного друга. В дари простое настоящее время со словом о времени может относиться и к ближайшему будущему.'
  prs.a2.unit33.lesson06.teach.dlg_turn04:
    title: Наджиба говорит, что придёт, и о том, что она старается делать
    gloss: Да, сегодня я приду в шесть часов. Я стараюсь каждый вечер ложиться спать рано.
    note: '*امروز ساعت شش می‌آیم* — простое настоящее время со словом о времени. *کوشش می‌کنم که هر شب زود بخوابم* — новая привычка, которую она хочет сохранить.'
  prs.a2.unit33.lesson06.teach.dlg_turn05:
    title: Реакция Ясина
    gloss: Очень хорошо!
    note: '*خیلی خوب* — короткая дружеская реакция.'
exercises:
  prs.a2.unit33.lesson01.exercise01.recognize_started_running:
    instruction: Что означает это предложение?
    correct_option: Я начал(а) бегать
    distractors:
    - Я перестал(а) бегать
    - Я побегу завтра
    - Я бегал(а) вчера
    accepted_answers:
    - value: Я начал(а) бегать
      status: correct
    feedback: '*به دویدن شروع کردم* значит «Я начал(а) бегать»: *به* и инфинитив *دویدن*, затем *شروع کردم*.'
  prs.a2.unit33.lesson01.exercise02.recognize_started_exercise_month:
    instruction: Что означает это предложение?
    correct_option: Я начал заниматься спортом месяц назад
    distractors:
    - В следующем месяце я начну заниматься спортом
    - Месяц назад я перестал(а) заниматься спортом
    - Я занимаюсь спортом месяц
    accepted_answers:
    - value: Я начал заниматься спортом месяц назад
      status: correct
    feedback: '*یک ماه پیش* значит «месяц назад», а *ورزش را شروع کردم* — «я начал(а) заниматься спортом».'
  prs.a2.unit33.lesson01.exercise03.match_start_words:
    instruction: Соедини каждое слово или выражение на дари с его значением.
    accepted_answers:
    - value:
        باشگاه: спортзал
        دویدن: бег, бегать
        ورزش کردن: заниматься спортом
        نیم ساعت: полчаса
        عادت: привычка
        شروع کردم: я начал(а)
        شروع کردی: ты начал(а) (другу)
        شروع کرد: он или она начал(а)
        یک ماه پیش: месяц назад
      status: correct
    feedback: 'Только окончание после *کردن* меняется в зависимости от лица: *شروع کردم* — «я начал(а)», *شروع کردی* — «ты начал(а)», *شروع کرد* — «он или она начал(а)».'
    pairs:
    - left: باشگاه
      right: спортзал
    - left: دویدن
      right: бег, бегать
    - left: ورزش کردن
      right: заниматься спортом
    - left: نیم ساعت
      right: полчаса
    - left: عادت
      right: привычка
    - left: شروع کردم
      right: я начал(а)
    - left: شروع کردی
      right: ты начал(а) (другу)
    - left: شروع کرد
      right: он или она начал(а)
    - left: یک ماه پیش
      right: месяц назад
  prs.a2.unit33.lesson01.exercise04.order_started_exercising:
    instruction: 'Расставь слова так, чтобы получилось: «Я начал(а) заниматься спортом».'
    accepted_answers:
    - value:
      - به
      - ورزش
      - کردن
      - شروع
      - کردم
      status: correct
    - value:
      - شروع
      - کردم
      - به
      - ورزش
      - کردن
      status: correct
    feedback: '*به ورزش کردن شروع کردم.* Инфинитив *ورزش کردن* стоит после *به*. Порядок *شروع کردم به ورزش کردن* тоже правильный.'
  prs.a2.unit33.lesson01.exercise05.complete_started_running:
    instruction: 'Заверши предложение: «Месяц назад я начал(а) бегать».'
    accepted_answers:
    - value: شروع
      status: correct
    feedback: '*شروع* — первая часть глагола из двух слов *شروع کردن*: *به دویدن شروع کردم*.'
  prs.a2.unit33.lesson01.exercise06.translate_started_running:
    instruction: 'Переведи на дари, используя شروع کردن: «Я начал(а) бегать».'
    accepted_answers:
    - value: به دویدن شروع کردم.
      status: correct
    - value: من به دویدن شروع کردم.
      status: correct
    - value: شروع کردم به دویدن.
      status: correct
    - value: من شروع کردم به دویدن.
      status: correct
    - value: دویدن را شروع کردم.
      status: correct
    - value: من دویدن را شروع کردم.
      status: correct
    - value: شروع کردم که بدوم.
      status: correct
    - value: من شروع کردم که بدوم.
      status: correct
    feedback: '*به دویدن شروع کردم.* — «Я начал(а) бегать». Также правильны *دویدن را شروع کردم* (предмет и *را*) и *شروع کردم که بدوم* (с *که*, в следующем уроке).'
  prs.a2.unit33.lesson02.exercise01.recognize_started_that_run:
    instruction: Что означает это предложение?
    correct_option: Я начал(а) бегать
    distractors:
    - Я забыл(а) побежать
    - Я перестал(а) бегать
    - Я хочу бегать завтра
    accepted_answers:
    - value: Я начал(а) бегать
      status: correct
    feedback: '*شروع کردم که بدوم* — «я начал бегать»: *که* плюс сослагательная форма *بدوم*.'
  prs.a2.unit33.lesson02.exercise02.recognize_try_sleep_early:
    instruction: Что означает это предложение?
    correct_option: я стараюсь ложиться спать рано
    distractors:
    - Я забыл(а) лечь спать рано
    - Я хочу спать целый день
    - Я перестал ложиться спать рано
    accepted_answers:
    - value: я стараюсь ложиться спать рано
      status: correct
    feedback: '*کوشش می‌کنم* — «я стараюсь», а *که زود بخوابم* — «лечь спать рано».'
  prs.a2.unit33.lesson02.exercise03.match_subjunctives:
    instruction: Соедини каждую дари-форму сослагательного наклонения с её значением.
    accepted_answers:
    - value:
        بدوم: чтобы я бежал(а)
        بخوابم: чтобы я спал(а)
        بخوانم: чтобы я читал(а)
        بخورم: чтобы я ел(а)
        بروم: чтобы я шёл (шла)
        ببینم: чтобы я видел(а)
        ورزش کنم: чтобы я занимался (занималась) спортом
        بیدار شوم: чтобы я проснулся (проснулась)
      status: correct
    feedback: 'Каждая форма — это *ب-* плюс основа настоящего времени и *-م*. У глаголов из двух слов нет *ب-*: *ورزش کنم*, *بیدار شوم*.'
    pairs:
    - left: بدوم
      right: чтобы я бежал(а)
    - left: بخوابم
      right: чтобы я спал(а)
    - left: بخوانم
      right: чтобы я читал(а)
    - left: بخورم
      right: чтобы я ел(а)
    - left: بروم
      right: чтобы я шёл (шла)
    - left: ببینم
      right: чтобы я видел(а)
    - left: ورزش کنم
      right: чтобы я занимался (занималась) спортом
    - left: بیدار شوم
      right: чтобы я проснулся (проснулась)
  prs.a2.unit33.lesson02.exercise04.order_try_sleep_early:
    instruction: 'Расставь слова так, чтобы получилось: «Я стараюсь ложиться спать рано».'
    accepted_answers:
    - value:
      - کوشش
      - می‌کنم
      - که
      - زود
      - بخوابم
      status: correct
    feedback: '*کوشش می‌کنم که زود بخوابم.* Сослагательная форма стоит в конце, после *که*.'
  prs.a2.unit33.lesson02.exercise05.complete_started_exercise_that:
    instruction: 'Дополни предложение: «Я начал заниматься спортом».'
    accepted_answers:
    - value: کنم
      status: correct
    feedback: '*کنم* — сослагательная форма глагола *کردن*: *ورزش کنم*. У глагола из двух слов нет *ب-*.'
  prs.a2.unit33.lesson02.exercise06.translate_try_wake_early:
    instruction: 'Переведи на дари, используя کوشش کردن: «Я стараюсь рано вставать».'
    accepted_answers:
    - value: کوشش می‌کنم که زود بیدار شوم.
      status: correct
    - value: کوشش می‌کنم زود بیدار شوم.
      status: correct
    - value: سعی می‌کنم که زود بیدار شوم.
      status: correct
    - value: سعی می‌کنم زود بیدار شوم.
      status: correct
    - value: من کوشش می‌کنم که زود بیدار شوم.
      status: correct
    - value: من کوشش می‌کنم زود بیدار شوم.
      status: correct
    - value: من سعی می‌کنم که زود بیدار شوم.
      status: correct
    - value: من سعی می‌کنم زود بیدار شوم.
      status: correct
    feedback: '*کوشش می‌کنم که زود بیدار شوم.* *کوشش* и *که* употребляются вместе; *من* можно не говорить.'
  prs.a2.unit33.lesson03.exercise01.recognize_quit_sweets:
    instruction: Что означает это предложение?
    correct_option: Я бросил есть сладкое
    distractors:
    - Я начал есть сладкое
    - Я забыл поесть сладкого
    - Я люблю сладкое
    accepted_answers:
    - value: Я бросил есть сладкое
      status: correct
    feedback: '*شیرینی خوردن را ترک کردم* — «я бросил есть сладкое»: сначала привычка, затем *را*, затем *ترک کردم*.'
  prs.a2.unit33.lesson03.exercise02.recognize_no_longer_video:
    instruction: Что означает это предложение?
    correct_option: Я больше не смотрю видео
    distractors:
    - Я смотрю видео каждый день
    - Я посмотрю видео позже
    - Я забыл посмотреть видео
    accepted_answers:
    - value: Я больше не смотрю видео
      status: correct
    feedback: '*دیگر* с отрицательным глаголом *نمی‌بینم* означает «я больше не смотрю видео».'
  prs.a2.unit33.lesson03.exercise03.match_stopping_words:
    instruction: Соедини каждое слово или выражение на дари с его значением.
    accepted_answers:
    - value:
        ترک کردم: я бросил(а), я перестал(а)
        دیگر: больше не
        شیرینی: сладости
        ساعت‌ها: часами
        گاهی: иногда
        ویدیو: видео
        عادت بد: вредная привычка
        تیلفون: телефон
        کمتر: меньше
      status: correct
    feedback: '*ترک کردم* — «я бросил», *دیگر* — «больше не», *کمتر* — «меньше»: три способа сказать, что ты делаешь что-то по-другому.'
    pairs:
    - left: ترک کردم
      right: я бросил(а), я перестал(а)
    - left: دیگر
      right: больше не
    - left: شیرینی
      right: сладости
    - left: ساعت‌ها
      right: часами
    - left: گاهی
      right: иногда
    - left: ویدیو
      right: видео
    - left: عادت بد
      right: вредная привычка
    - left: تیلفون
      right: телефон
    - left: کمتر
      right: меньше
  prs.a2.unit33.lesson03.exercise04.order_no_longer_sweets:
    instruction: 'Расставь слова так, чтобы получилось: «Я больше не ем сладкое».'
    accepted_answers:
    - value:
      - دیگر
      - شیرینی
      - نمی‌خورم
      status: correct
    - value:
      - شیرینی
      - دیگر
      - نمی‌خورم
      status: correct
    feedback: '*دیگر شیرینی نمی‌خورم.* *دیگر* стоит перед дополнением; *شیرینی دیگر نمی‌خورم* тоже верно.'
  prs.a2.unit33.lesson03.exercise05.complete_quit_video:
    instruction: 'Дополни предложение: «Он бросил смотреть видео».'
    accepted_answers:
    - value: ترک
      status: correct
    feedback: '*ترک* — первая часть глагола из двух слов *ترک کردن*: *او ویدیو دیدن را ترک کرد*.'
  prs.a2.unit33.lesson03.exercise06.translate_no_longer_sweets:
    instruction: 'Переведи на дари, используя دیگر: «Я больше не ем сладкое».'
    accepted_answers:
    - value: دیگر شیرینی نمی‌خورم.
      status: correct
    - value: من دیگر شیرینی نمی‌خورم.
      status: correct
    - value: شیرینی دیگر نمی‌خورم.
      status: correct
    - value: من شیرینی دیگر نمی‌خورم.
      status: correct
    - value: دیگر من شیرینی نمی‌خورم.
      status: correct
    feedback: '*دیگر شیرینی نمی‌خورم.* *من* можно не говорить, а *دیگر* может стоять и после *شیرینی*.'
  prs.a2.unit33.lesson04.exercise01.recognize_forgot_phone:
    instruction: Что означает это предложение?
    correct_option: я забыл(а) позвонить
    distractors:
    - Я позвонил
    - Я пытался позвонить
    - Я бросил звонить
    accepted_answers:
    - value: я забыл(а) позвонить
      status: correct
    feedback: '*فراموش کردم که تیلفون کنم* — «я забыл позвонить»: *فراموش کردم* плюс *که* и сослагательная форма.'
  prs.a2.unit33.lesson04.exercise02.recognize_did_not_forget_book:
    instruction: Что означает это предложение?
    correct_option: Я не забыл принести свою книгу
    distractors:
    - Я забыл принести свою книгу
    - Я потерял свою книгу
    - Я не принёс никакой книги
    accepted_answers:
    - value: Я не забыл принести свою книгу
      status: correct
    feedback: '*فراموش نکردم* — «я не забыл», значит, книга принесена.'
  prs.a2.unit33.lesson04.exercise03.match_four_verbs:
    instruction: Соедини каждое выражение на дари с его значением.
    accepted_answers:
    - value:
        شروع کردم: я начал(а)
        ترک کردم: я бросил(а)
        کوشش کردم: я пытался (пыталась)
        فراموش کردم: я забыл(а)
        فراموش نکردم: я не забыл(а)
        دیگر نمی‌کنم: я больше этого не делаю
        کوشش می‌کنم: я стараюсь
        شروع می‌کنم: я начинаю
      status: correct
    feedback: Все они образованы с помощью *کردن*. *نکردم* в *فراموش نکردم* превращает значение в «я не забыл».
    pairs:
    - left: شروع کردم
      right: я начал(а)
    - left: ترک کردم
      right: я бросил(а)
    - left: کوشش کردم
      right: я пытался (пыталась)
