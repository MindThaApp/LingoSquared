    - value: فلم هرگز ندیده‌ام
      status: correct
    - value: من هرگز فلم ندیده‌ام
      status: correct
    - value: من فلم هرگز ندیده‌ام
      status: correct
    - value: هرگز فلم ندیدیم
      status: correct
    - value: فلم هرگز ندیدیم
      status: correct
    - value: من هرگز فلم ندیدیم
      status: correct
    - value: من فلم هرگز ندیدیم
      status: correct
    feedback: '*هرگز فلم ندیده‌ام* — «я никогда не смотрел(а) фильмов». *هرگز* употребляется с отрицательным причастием *ندیده*, а *من* можно опустить.'
  prs.a2.unit25.lesson04.exercise01.recognize_not_yet:
    instruction: Что означает это предложение?
    correct_option: Я ещё не бывал(а) в Герате
    distractors:
    - Я уже бывал(а) в Герате
    - Я ездил(а) в Герат в прошлом году
    - Я не поеду в Герат
    accepted_answers:
    - value: Я ещё не бывал(а) в Герате
      status: correct
    feedback: '*هنوز* с отрицательным причастием *نرفته‌ام* означает «ещё не»: я ещё не бывал(а) в Герате.'
  prs.a2.unit25.lesson04.exercise02.recognize_already:
    instruction: Что означает это предложение?
    correct_option: Я уже бывал(а) в Герате
    distractors:
    - Я ещё не бывал(а) в Герате
    - Я ездил(а) в Герат в прошлом году
    - Я никогда не был(а) в Герате
    accepted_answers:
    - value: Я уже бывал(а) в Герате
      status: correct
    feedback: '*قبلا* означает «уже, раньше»: *قبلا به هرات رفته‌ام* — «я уже бывал(а) в Герате».'
  prs.a2.unit25.lesson04.exercise03.recognize_how_many:
    instruction: Что значит этот вопрос?
    correct_option: Сколько раз ты был в Мазари-Шарифе?
    distractors:
