  prs.a2.unit25.lesson02.exercise05.complete_eaten:
    instruction: 'Дополни предложение перфектом глагола خوردن: «Я ел(а) манту».'
    accepted_answers:
    - value: خورده‌ام
      status: correct
    - value: خوردیم
      status: correct
    feedback: '*خورده‌ام* — это причастие *خورده* плюс *-ام*. Разговорная форма *خوردیم* тоже правильна.'
  prs.a2.unit25.lesson02.exercise06.translate_seen_movie:
    instruction: 'Переведи на дари, используя перфект глагола دیدن: «Я смотрел(а) фильм».'
    accepted_answers:
    - value: فلم دیده‌ام
      status: correct
    - value: یک فلم دیده‌ام
      status: correct
    - value: من فلم دیده‌ام
      status: correct
    - value: من یک فلم دیده‌ام
      status: correct
    - value: فلم دیدیم
      status: correct
    - value: یک فلم دیدیم
      status: correct
    - value: من فلم دیدیم
      status: correct
    - value: من یک فلم دیدیم
      status: correct
    feedback: '*فلم دیده‌ام* — «я смотрел(а) фильм». *من* («я») и *یک* («один») можно опустить, а *فلم دیدیم* — разговорная форма.'
  prs.a2.unit25.lesson03.exercise01.recognize_negative:
    instruction: Что означает это предложение?
    correct_option: я не был(а) в Бамиане
    distractors:
    - Я бывал(а) в Бамиане
    - Я не еду в Бамиан
    - Он не бывал в Бамиане
    accepted_answers:
    - value: я не был(а) в Бамиане
      status: correct
    feedback: '*نرفته‌ام* — это *ن* плюс *رفته‌ام*: *به بامیان نرفته‌ام* означает «я не бывал(а) в Бамиане».'
  prs.a2.unit25.lesson03.exercise02.recognize_last_year:
    instruction: Что означает это предложение?
    correct_option: В прошлом году я ездил(а) в Герат
    distractors:
    - Я когда-то бывал(а) в Герате
    - Я никогда не был(а) в Герате
    - В прошлом году я не ездил(а) в Герат
    accepted_answers:
    - value: В прошлом году я ездил(а) в Герат
      status: correct
    feedback: '*پارسال* указывает время, поэтому глагол стоит в простом прошедшем *رفتم*: «в прошлом году я ездил(а) в Герат».'
  prs.a2.unit25.lesson03.exercise03.choose_experience_form:
    instruction: Какое предложение говорит, что ты когда-либо в жизни бывал(а) в Герате, без указания времени?
    correct_option: به هرات رفته‌ام
    distractors:
    - پارسال به هرات رفتم
    - به هرات می‌روم
    - به هرات نرفته‌ام
    accepted_answers:
    - value: به هرات رفته‌ام
      status: correct
    feedback: '*به هرات رفته‌ام* не указывает время и сообщает об опыте. *پارسال به هرات رفتم* называет время, *به هرات می‌روم* — настоящее время, а *به هرات نرفته‌ام* — отрицание.'
  prs.a2.unit25.lesson03.exercise04.match_positive_negative:
    instruction: Соедини каждое слово на дари с его значением.
    accepted_answers:
    - value:
        رفته‌ام: я был(а)
        نرفته‌ام: я не был(а)
        خورده‌ام: я поел(а)
        نخورده‌ام: я не ел(а)
        دیده‌ام: я видел(а)
        ندیده‌ام: я не видел(а)
        پخته‌ام: я приготовил(а)
        نپخته‌ام: я не готовил(а)
        پارسال: в прошлом году (используется простое прошедшее)
        هرگز: никогда
      status: correct
    feedback: Начальная *ن* у причастия делает его отрицательным. *پارسال* называет время, а *هرگز* означает «никогда».
    pairs:
    - left: رفته‌ام
      right: я был(а)
    - left: نرفته‌ام
      right: я не был(а)
    - left: خورده‌ام
      right: я поел(а)
    - left: نخورده‌ام
      right: я не ел(а)
    - left: دیده‌ام
      right: я видел(а)
    - left: ندیده‌ام
      right: я не видел(а)
    - left: پخته‌ام
      right: я приготовил(а)
    - left: نپخته‌ام
      right: я не готовил(а)
    - left: پارسال
      right: в прошлом году (используется простое прошедшее)
    - left: هرگز
      right: никогда
  prs.a2.unit25.lesson03.exercise05.order_last_year:
    instruction: 'Расставь слова так, чтобы сказать: «В прошлом году я ездил(а) в Герат».'
    accepted_answers:
    - value:
      - پارسال
      - به
      - هرات
      - رفتم
      status: correct
    - value:
      - به
      - هرات
      - پارسال
      - رفتم
      status: correct
    feedback: '*پارسال به هرات رفتم*: сначала время, в конце глагол в простом прошедшем. Слово со значением времени может стоять и после места.'
  prs.a2.unit25.lesson03.exercise06.complete_never_bamyan:
    instruction: 'Дополни предложение отрицательным перфектом глагола رفتن: «Я никогда не бывал(а) в Бамиане».'
    accepted_answers:
    - value: نرفته‌ام
      status: correct
    - value: نرفتیم
      status: correct
    feedback: '*هرگز* требует отрицательного глагола: *نرفته‌ام* (или разговорное *نرفتیم*).'
  prs.a2.unit25.lesson03.exercise07.translate_never_movie:
    instruction: 'Переведи на дари, используя هرگز и перфект глагола دیدن: «Я никогда не смотрел(а) фильмов».'
    accepted_answers:
    - value: هرگز فلم ندیده‌ام
