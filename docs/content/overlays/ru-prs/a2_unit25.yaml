course:
  title: Дари A2
  description: 'Афганский дари, ниже среднего уровня: рассказываем и спрашиваем, что ты делал или никогда не делал. Перфект (причастие плюс краткая связка) в письменной форме رفته‌ام и в разговорной кабульской форме رفتیم, отрицание и отличие от простого прошедшего времени.'
units:
  prs.a2.unit25.have_you_ever:
    title: Ты когда-нибудь...?
lessons:
  prs.a2.unit25.lesson01.experience_words_and_perfect_forms:
    title: Слова об опыте и форма رفته‌ام
  prs.a2.unit25.lesson02.more_participles_and_spoken_forms:
    title: Ещё причастия и разговорные формы
  prs.a2.unit25.lesson03.negative_and_simple_past_contrast:
    title: Отрицание и перфект в сравнении с простым прошедшим
  prs.a2.unit25.lesson04.ever_never_already_yet:
    title: Когда-либо, никогда, уже и ещё не
  prs.a2.unit25.lesson05.reading_and_listening:
    title: Читаем и слушаем об опыте
  prs.a2.unit25.lesson06.conversation_about_experiences:
    title: Разговор об опыте
teaching:
  prs.a2.unit25.lesson01.teach.ever:
    title: До сих пор, когда-либо
    gloss: до сих пор, до настоящего времени, когда-либо
    note: '*تا حال* значит «до сих пор». В вопросе оно спрашивает обо всей жизни до сегодняшнего дня: *آیا تا حال به هرات رفته‌ای؟* — «Ты когда-нибудь был в Герате?» *آیا* вводит вопрос, на который отвечают «да» или «нет».'
    example_gloss: Ты когда-нибудь был в Герате?
  prs.a2.unit25.lesson01.teach.herat:
    title: Герат
    gloss: Герат
    note: '*هرات* — большой город на западе Афганистана, известный старой цитаделью и рынками.'
    example_gloss: Мой друг из Герата.
  prs.a2.unit25.lesson01.teach.mazar:
    title: Мазари-Шариф
    gloss: Мазари-Шариф
    note: '*مزار شریف* — большой город на севере Афганистана, известный мечетью-святилищем с голубой облицовкой.'
    example_gloss: Мой друг живёт в Мазари-Шарифе.
  prs.a2.unit25.lesson01.teach.bamyan:
    title: Бамиан
    gloss: Бамиан
    note: '*بامیان* — долина в центральном нагорье Афганистана, известная горными пейзажами.'
    example_gloss: Мой друг был в Бамиане.
  prs.a2.unit25.lesson01.teach.qabili:
    title: Кабули палау
    gloss: кабули палау (рис с мясом, морковью и изюмом)
    note: '*قابلی پلو* — рис, приготовленный с мясом, морковью и изюмом, любимое афганское блюдо.'
    example_gloss: Кабули палау очень вкусный.
  prs.a2.unit25.lesson01.teach.mantu:
    title: Манту
    gloss: манту (пельмени, приготовленные на пару)
    note: '*منتو* — пельмени на пару с начинкой из мяса и лука.'
    example_gloss: Я люблю манту.
  prs.a2.unit25.lesson01.teach.plane:
    title: Самолёт
    gloss: самолёт
    note: '*طیاره* — афганское слово, обозначающее самолёт.'
    example_gloss: Самолёт прибыл в Кабул.
  prs.a2.unit25.lesson01.teach.travel:
    title: Путешествовать
    gloss: путешествовать
    note: '*سفر کردن* — путешествовать. Способ передвижения выражается с помощью *با*: *با بس سفر کردن* — ехать на автобусе.'
    example_gloss: Мой друг поехал на автобусе.
  prs.a2.unit25.lesson01.teach.been_herat:
    title: я был(а) в Герате
    gloss: Я был в Герате.
    note: '*به* значит «в, к». Это первое предложение в перфекте в этом уроке: *رفته‌ام* говорит, что ты когда-то в жизни где-то побывал, не уточняя когда.'
  prs.a2.unit25.lesson01.teach.formal_paradigm:
    title: 'Перфект, письменная форма: причастие и окончание'
    gloss: я был(а), ты был(а), он/она был(а), мы были, вы были (вежливо или во мн. ч.), они были
    note: 'Перфект рассказывает о том, что ты делал или не делал в жизни до настоящего момента, не указывая когда. Он состоит из двух частей. Сначала причастие прошедшего времени: возьми основу прошедшего времени и добавь *ه*. Основа прошедшего времени глагола *رفتن* (идти, ехать) — *رفت*, поэтому причастие — *رفته*. Затем краткое окончание, соответствующее лицу: *رفته‌ام* (я был), *رفته‌ای* (ты, другу), *رفته است* (он или она был(а)), *رفته‌ایم* (мы), *رفته‌این* (вы, вежливая форма или множественное число; допустимо также *رفته‌اید*), *رفته‌اند* (они). На письме окончания присоединяются к причастию через полупробел. Местоимение (*من، تو، او*) необязательно, так как окончание уже указывает на лицо. Это официальная письменная форма, которую ты встретишь в письмах, новостях и книгах.'
  prs.a2.unit25.lesson01.teach.spoken_paradigm:
    title: 'Перфект: разговорная кабульская форма'
    gloss: я был(а), ты был(а), он/она был(а), мы были, вы были (вежливо или во мн. ч.), они были
    note: 'В повседневной кабульской речи причастие и окончание сливаются в одно короткое слово, образованное от основы прошедшего времени: *رفتیم* (я ходил), *رفتی* (ты, другу), *رفته* (он или она), *رفتیم* (мы), *رفتین* (вы, мн. число), *رفتن* (они). 3-е лицо единственного числа — просто голое причастие *رفته*. Будь внимателен с 1-м лицом: разговорное *رفتیم* (я ходил, перфект) — это не простое прошедшее *رفتم* (я пошёл); оно оканчивается на *-یم* и пишется так же, как форма множественного числа *رفتیم* (мы ходили). Различить их помогает контекст: *تا حال، هرگز، هنوز، قبلا* и вопрос об опыте указывают на перфект (*تا حال رفتیم* = я до сих пор бывал), а указанное время, например *پارسال* или *دیروز*, указывает на простое прошедшее (*پارسال رفتم*). Официальные формы с присоединяемыми окончаниями (*رفته‌ام*) тоже изучаются, и в этом курсе в каждом ответе принимаются обе формы: присоединяемые формы используй в письме и в официальной речи, а сокращённые разговорные — с друзьями и семьёй. Окончание «вы» во множественном числе в обеих формах одно: *-ین*: *رفته‌این* и *رفتین*.'
  prs.a2.unit25.lesson02.teach.participle_rule:
    title: 'Причастие прошедшего времени: основа прошедшего времени + ه'
    gloss: ходивший, съеденный, увиденный, приготовленный, сделанный
    note: 'Одно правило даёт причастие почти любого глагола: возьми инфинитив, отбрось *ن* — получится основа прошедшего времени, — и добавь *ه*. От *رفتن* получаем *رفت*, затем *رفته* (был, ходил). От *خوردن* — *خورد* и *خورده* (съел). От *دیدن* — *دید* и *دیده* (видел). От *پختن* — *پخت* и *پخته* (приготовил). От *کردن* — *کرد* и *کرده* (сделал). Причастие не меняется по лицам; меняется только окончание после него.'
  prs.a2.unit25.lesson02.teach.eat_paradigm:
    title: 'Те же окончания, другой глагол: есть, кушать'
    gloss: я поел(а), ты поел(а), он/она поел(а), мы поели, вы поели (вежливая форма или мн. число), они поели
    note: 'Окончания, которые ты выучил с *رفته*, подходят к любому причастию: *خورده‌ام، خورده‌ای، خورده است، خورده‌ایم، خورده‌این، خورده‌اند*. В речи то же причастие сокращается: *خوردیم، خوردی، خورده، خوردیم، خوردین، خوردن*. Поэтому, чтобы сказать, что ты видел фильм, можно написать *فلم دیده‌ام* или сказать *فلم دیدیم*.'
  prs.a2.unit25.lesson02.teach.spoken_more:
    title: Разговорные формы тех же глаголов
    gloss: я поел(а), ты поел(а), он/она поел(а), вы поели (мн. число), они поели; я видел(а), ты видел(а); я приготовил(а), ты приготовил(а); я сделал(а), ты сделал(а)
    note: 'Разговорные формы строятся одинаково у всех глаголов: возьми основу прошедшего времени и добавь окончание. От *خورد* — *خوردیم، خوردی، خورده، خوردین، خوردن*; от *دید* — *دیدیم، دیدی*; от *پخت* — *پختیم، پختی*; от *کرد* — *کردیم، کردی*. Помни, что разговорное *خوردیم* (я поел, перфект) — это не простое прошедшее *خوردم* (я съел); на перфект указывают слова вроде *تا حال* или *هرگز* либо отсутствие указания времени.'
  prs.a2.unit25.lesson02.teach.movie:
    title: Фильм
    gloss: фильм
    note: '*فلم* — афганское слово для фильма. Фильм смотрят с глаголом *دیدن*: *فلم دیدن* — смотреть фильм.'
    example_gloss: Вчера вечером я смотрел фильм.
  prs.a2.unit25.lesson02.teach.kebab:
    title: Кебаб
    gloss: кебаб, мясо на гриле
    note: '*کباب* — мясо на гриле, одно из самых распространённых блюд, которые можно попробовать в Афганистане.'
    example_gloss: Вчера я ел кебаб.
  prs.a2.unit25.lesson02.teach.mantu_qabili:
    title: Я ел манты и кабули палау
    gloss: Я ел манты и кабули палау.
    note: '*و* означает «и». Одно причастие в конце, *خورده‌ام*, относится к обоим блюдам.'
  prs.a2.unit25.lesson02.teach.seen_herat:
    title: Я видел Герат
    gloss: Я видел Герат.
    note: '*را* ставится после определённого предмета, например названия города, на который направлено действие: *هرات را* — город Герат. *دیده‌ام* — причастие от *دیدن* плюс *-ام*.'
  prs.a2.unit25.lesson02.teach.cooked:
    title: Я готовил кабули палау
    gloss: Я готовил кабули палау.
    note: '*پخته‌ام* — причастие от *پختن* (готовить) плюс *-ام*. В речи: *قابلی پلو پختیم*.'
  prs.a2.unit25.lesson03.teach.last_year:
    title: В прошлом году
    gloss: в прошлом году
    note: '*پارسال* — прошлый год. Такое слово привязывает событие к определённому моменту, поэтому после него глагол стоит в простом прошедшем, а не в перфекте.'
    example_gloss: В прошлом году я ездил в Кабул.
  prs.a2.unit25.lesson03.teach.two_years_ago:
    title: Два года назад
    gloss: два года назад
    note: '*پیش* после обозначения времени означает «назад»: *دو سال پیش* — два года назад. Это ещё одно слово времени, требующее простого прошедшего.'
    example_gloss: Два года назад я ездил в Мазари-Шариф.
  prs.a2.unit25.lesson03.teach.never:
    title: Никогда
    gloss: никогда, ни разу
    note: '*هرگز* означает «никогда». Оно употребляется с отрицательным глаголом, так что отрицание всё равно выражается через *ن*: *به بامیان هرگز نرفته‌ام* — я никогда не был в Бамиане.'
    example_gloss: Я никогда не был в Бамиане.
  prs.a2.unit25.lesson03.teach.never_alt:
    title: Никогда (другое слово)
    gloss: никогда, ни разу
    note: '*هیچ‌وقت* здесь значит то же, что *هرگز*, и тоже требует отрицательного глагола: *هیچ‌وقت فلم ندیده‌ام* — я никогда не смотрел фильмов. Оно чуть более разговорное, чем *هرگز*.'
    example_gloss: Я никогда не был в Бамиане.
  prs.a2.unit25.lesson03.teach.neg_formal:
    title: 'Отрицание: ن перед причастием'
    gloss: я не был(а), ты не был(а), он/она не был(а), мы не были, вы не были (вежливая форма или мн. число), они не были
    note: 'Чтобы сказать, что ты чего-то не делал, поставь *ن* перед причастием и сохрани те же окончания: *رفته‌ام* (я был) превращается в *نرفته‌ام* (я не был). Полный набор: *نرفته‌ام، نرفته‌ای، نرفته است، نرفته‌ایم، نرفته‌این، نرفته‌اند*. Частица *ن* относится к причастию, а не к окончанию.'
  prs.a2.unit25.lesson03.teach.neg_spoken:
    title: Отрицание в разговорной форме
    gloss: я не был(а), ты не был(а), он/она не был(а), мы не были, вы не были (вежливая форма или мн. число), они не были
    note: 'Разговорное отрицание строится так же: *ن* ставится перед сокращённой формой: *نرفتیم، نرفتی، نرفته، نرفتیم، نرفتین، نرفتن*. И *نرفته‌ام*, и *نرفتیم* правильны и означают «я не был». Не путай разговорное *نرفتیم* (я не был, перфект) с отрицательным простым прошедшим *نرفتم* (я не пошёл): указанное время, например *دیروز*, употребляется с *نرفتم*.'
  prs.a2.unit25.lesson03.teach.neg_more:
    title: То же ن с другими глаголами
    gloss: я не ел(а), я не видел(а), я не готовил(а), я не делал(а)
    note: 'Правило одно и то же для всех глаголов: *نخورده‌ام* (я не ел), *ندیده‌ام* (я не видел), *نپخته‌ام* (я не готовил), *نکرده‌ام* (я не делал). У глаголов, состоящих из слова и *کردن*, *ن* ставится перед *کرده*: *سفر نکرده‌ام* (я не путешествовал), но никогда не *نسفر کرده‌ام*. В речи: *نخوردیم، ندیدیم، نپختیم، نکردیم*.'
  prs.a2.unit25.lesson03.teach.contrast:
    title: Перфект или простое прошедшее?
    gloss: В прошлом году я ездил в Герат. / Я бывал в Герате. / Я еду в Герат.
    note: 'Простое прошедшее употребляется, когда ты говоришь, когда что-то произошло: *پارسال به هرات رفتم* (в прошлом году я ездил в Герат) или *دو سال پیش رفتم*. Перфект употребляется, когда время не указано и ты лишь сообщаешь, что это часть твоего опыта: *به هرات رفته‌ام* (я бывал в Герате). Настоящее время — это другое: *به هرات می‌روم* (я еду в Герат или езжу). Поэтому слово времени, такое как *پارسال* или *دیروز*, сочетается с *رفتم*, а *تا حال* и *هرگز* — с *رفته‌ام* и *نرفته‌ام*.'
  prs.a2.unit25.lesson04.teach.already:
    title: Уже, раньше
    gloss: уже, раньше
    note: '*قبلا* означает «до настоящего момента» или «уже». Оно употребляется с утвердительным перфектом: *قبلا به هرات رفته‌ام* — я уже бывал в Герате.'
    example_gloss: Я уже бывал в Герате.
  prs.a2.unit25.lesson04.teach.not_yet:
    title: Ещё не, всё ещё
    gloss: ещё (не), до сих пор
    note: '*هنوز* с отрицательным перфектом означает «ещё не»: *هنوز به هرات نرفته‌ام* — я ещё не был в Герате.'
    example_gloss: Я ещё не был в Герате.
  prs.a2.unit25.lesson04.teach.times:
    title: Один раз, два раза
    gloss: один раз, два раза
    note: '*بار* — раз, случай. *یک بار* — один раз, *دو بار* — два раза. Число стоит перед *بار*, а в предложении по-прежнему используется перфект.'
    example_gloss:
    - Я был в Мазари-Шарифе два раза.
    - Я летал на самолёте один раз.
  prs.a2.unit25.lesson04.teach.how_many:
    title: Сколько раз ты был?
    gloss: Сколько раз ты был в Мазари-Шарифе?
    note: '*چند* означает «сколько». *چند بار* спрашивает «сколько раз», а ответ — число плюс *بار*: *دو بار*.'
  prs.a2.unit25.lesson04.teach.yes_no:
    title: Да, нет
    gloss: да, нет
    note: '*بلی* — «да», а *نخیر* — вежливое повседневное «нет». Короткий ответ повторяет причастие: *بلی، رفته‌ام* или *نخیر، نرفته‌ام*.'
    example_gloss:
    - Да, я бывал в Герате.
    - Нет, я ещё не был в Герате.
  prs.a2.unit25.lesson04.teach.but:
    title: Но
    gloss: но
    note: '*ولی* соединяет то, что ты делал, с тем, чего не делал: *به مزار شریف رفته‌ام، ولی به هرات نرفته‌ام*.'
    example_gloss: Я был в Мазари-Шарифе, но в Герате не был.
  prs.a2.unit25.lesson04.teach.qa:
    title: Вопрос об опыте и ответ на него
    gloss: Ты когда-нибудь был в Герате? Да, был. Нет, ни разу.
    note: 'Чтобы спросить, делал ли кто-то что-то когда-нибудь, используй *آیا* и *تا حال* с перфектом: *آیا تا حال به هرات رفته‌ای؟* С другом можно использовать и разговорную форму: *آیا تا حال به هرات رفتی؟* Отвечай *بلی* и причастием (*بلی، رفته‌ام*) или *نخیر* и отрицанием (*نخیر، تا حال نرفته‌ام*). Можно добавить, как часто: *بلی، دو بار رفته‌ام*. Вопросительное слово *آیا* в речи можно опустить, если вопрос ясен по интонации.'
  prs.a2.unit25.lesson04.teach.adverbs:
    title: Уже, ещё не, никогда
    gloss: Я уже был. Я ещё не был. Я никогда не был.
    note: 'Три маленьких слова отвечают на вопрос, делал ли ты что-то уже. *قبلا رفته‌ام* означает «я уже был». *هنوز نرفته‌ام* означает «я ещё не был» и намекает, что ты ещё можешь поехать. *هرگز نرفته‌ام* означает «я никогда не был» без такого намёка. *قبلا* употребляется с утвердительным причастием; *هنوز* и *هرگز* — с отрицательным. Все три стоят перед причастием, обычно после места: *به هرات هنوز نرفته‌ام*. Разговорные формы работают так же: *هنوز نرفتیم*.'
  prs.a2.unit25.lesson05.teach.also:
    title: Тоже, также
    gloss: тоже, также
    note: '*هم* означает «тоже» или «также». Оно стоит сразу после того, что добавляется: *قابلی پلو هم پخته‌ام* — я и кабули палау готовил.'
    example_gloss: Я и кабули палау готовил.
  prs.a2.unit25.lesson05.teach.profile:
    title: Зармина пишет о своём опыте
    gloss: Я Зармина. До сих пор я была в Герате и Мазари-Шарифе, но в Бамиане не была. Я ела манты и кабули палау. Кабули палау я тоже готовила. На самолёте я не путешествовала.
    note: 'Короткий рассказ о себе в официальной письменной форме. Четыре вещи, которые она делала, и две, которых не делала: *به بامیان نرفته‌ام* и *با طیاره سفر نکرده‌ام*.'
  prs.a2.unit25.lesson05.teach.ex_q:
    title: Хумаюн спрашивает Зармину о полётах
    gloss: Зармина, ты когда-нибудь путешествовала на самолёте?
    note: Хумаюн использует с другом разговорную форму *سفر کردی*. Вопрос начинается с *آیا تا حال*.
  prs.a2.unit25.lesson05.teach.ex_a:
    title: Зармина говорит, что никогда не летала
    gloss: Нет, на самолёте я никогда не путешествовала. А ты?
    note: '*هرگز* стоит перед отрицательным причастием *نکردیم*. *تو چطور؟* — короткий способ спросить «а ты?».'
  prs.a2.unit25.lesson05.teach.ex_a2:
    title: 'Хумаюн отвечает: один раз'
    gloss: Да, один раз путешествовал.
    note: '*بلی* — ответ «да», а *یک بار* говорит, сколько раз. Место не названо, потому что оно ясно из вопроса.'
  prs.a2.unit25.lesson06.teach.turn01:
    title: Зармина спрашивает Хумаюна о Мазари-Шарифе
    gloss: Хумаюн, ты когда-нибудь был в Мазари-Шарифе?
    note: Зармина использует с другом разговорную форму *رفتی*. Вопрос начинается с *آیا تا حال*.
  prs.a2.unit25.lesson06.teach.turn02:
    title: 'Хумаюн говорит: два раза, а потом: ещё нет'
    gloss: Да, был два раза. Но в Герате я ещё не был. А ты?
    note: '*دو بار* говорит, сколько раз. *ولی هنوز به هرات نرفتیم* противопоставляет место, где он ещё не был, тому, где был.'
  prs.a2.unit25.lesson06.teach.turn03:
    title: Зармина рассказывает о Герате и Бамиане
    gloss: В Герате я была один раз, а в Бамиане никогда не была.
    note: '*یک بار* — один раз, а *به بامیان هرگز نرفتیم* — никогда. *هرگز* употребляется с отрицательным причастием.'
  prs.a2.unit25.lesson06.teach.turn04:
    title: Хумаюн спрашивает о готовке
    gloss: Ты когда-нибудь готовила кабули палау?
    note: Вопрос «да или нет» об опыте, с *تا حال* и разговорным *پختی*.
  prs.a2.unit25.lesson06.teach.turn05:
    title: Зармина уже готовила это блюдо
    gloss: Да, раньше готовила. А ты?
    note: '*قبلا پختیم* означает «я уже готовила». Блюдо не названо, потому что оба собеседника знают, о чём речь.'
  prs.a2.unit25.lesson06.teach.turn06:
    title: Хумаюн ещё не готовил его
    gloss: Нет, я ещё не готовил. Но ел.
    note: '*هنوز نپختیم* — «ещё не», с *ن* перед причастием. *ولی خوردیم* добавляет то, что он делал.'
  prs.a2.unit25.lesson06.teach.turn07:
    title: Зармина реагирует
    gloss: Как хорошо!
    note: '*چه خوب!* — дружелюбная реакция на хорошую новость.'
exercises:
  prs.a2.unit25.lesson01.exercise01.recognize_been_herat:
    instruction: Что означает это предложение?
    correct_option: я был(а) в Герате
    distractors:
    - Я еду в Герат
    - Я никогда не был(а) в Герате
    - Он бывал в Герате
    accepted_answers:
    - value: я был(а) в Герате
      status: correct
    feedback: '*رفته‌ام* — это причастие *رفته* плюс окончание *-ام*: *به هرات رفته‌ام* означает «я бывал(а) в Герате».'
  prs.a2.unit25.lesson01.exercise02.recognize_we_bamyan:
    instruction: Что означает это предложение?
    correct_option: Мы бывали в Бамиане
    distractors:
    - Я бывал(а) в Бамиане
    - Они бывали в Бамиане
    - Он бывал в Бамиане
    accepted_answers:
    - value: Мы бывали в Бамиане
      status: correct
    feedback: 'Окончание *-ایم* в *رفته‌ایم* означает «мы»: *ما به بامیان رفته‌ایم* — «мы бывали в Бамиане».'
  prs.a2.unit25.lesson01.exercise03.recognize_spoken_you:
    instruction: Что означает это предложение в разговорной форме?
    correct_option: Ты бывал(а) в Герате (другу)
    distractors:
    - я был(а) в Герате
    - Он бывал в Герате
    - Мы бывали в Герате
    accepted_answers:
    - value: Ты бывал(а) в Герате (другу)
      status: correct
    feedback: 'В разговорной речи *-ی* — окончание «ты» (к другу): *تو به هرات رفتی* означает «ты бывал(а) в Герате».'
  prs.a2.unit25.lesson01.exercise04.match_perfect_forms:
    instruction: Соедини каждое слово на дари с его значением.
    accepted_answers:
    - value:
        رفته‌ام: я был(а)
        رفته‌ای: ты был(а) (другу, на «ты»)
        رفته است: он или она был(а)
        رفته‌ایم: мы были
        رفته‌این: вы были (вежливо или во мн. ч.)
        رفته‌اند: они были
        هرات: Герат
        بامیان: Бамиан
        مزار شریف: Мазари-Шариф
      status: correct
    feedback: 'Каждое окончание показывает, кто был: *-ام* — я, *-ای* — ты (друг), *است* — он или она, *-ایم* — мы, *-این* — вы (вежливо или мн. число), *-اند* — они.'
    pairs:
    - left: رفته‌ام
      right: я был(а)
    - left: رفته‌ای
      right: ты был(а) (другу, на «ты»)
    - left: رفته است
      right: он или она был(а)
    - left: رفته‌ایم
      right: мы были
    - left: رفته‌این
      right: вы были (вежливо или во мн. ч.)
    - left: رفته‌اند
      right: они были
    - left: هرات
      right: Герат
    - left: بامیان
      right: Бамиан
    - left: مزار شریف
      right: Мазари-Шариф
  prs.a2.unit25.lesson01.exercise05.order_ever_herat:
    instruction: 'Расставь слова так, чтобы спросить друга: «Ты когда-нибудь бывал(а) в Герате?»'
    accepted_answers:
    - value:
      - آیا
      - تا
      - حال
      - به
      - هرات
      - رفته‌ای
      status: correct
    feedback: '*آیا تا حال به هرات رفته‌ای؟* начинается с *آیا*, а причастие с окончанием стоит в конце.'
  prs.a2.unit25.lesson01.exercise06.translate_been_herat:
    instruction: 'Переведи на дари, используя перфект глагола رفتن: «Я бывал(а) в Герате».'
    accepted_answers:
    - value: به هرات رفته‌ام
      status: correct
    - value: من به هرات رفته‌ام
      status: correct
    - value: به هرات رفتیم
      status: correct
    - value: من به هرات رفتیم
      status: correct
    feedback: '*به هرات رفته‌ام* — «я бывал(а) в Герате». Разговорная форма *به هرات رفتیم* так же правильна, а *من* можно опустить.'
  prs.a2.unit25.lesson02.exercise01.recognize_eaten:
    instruction: Что означает это предложение?
    correct_option: я ел(а) кабули палау
    distractors:
    - Я готовил кабули палау
    - Я видел(а) кабули палау
    - Я покупал(а) кабули палау
    accepted_answers:
    - value: я ел(а) кабули палау
      status: correct
    feedback: '*خورده‌ام* — это причастие глагола *خوردن* («есть») плюс *-ام*: *قابلی پلو خورده‌ام* означает «я ел(а) кабули палау».'
  prs.a2.unit25.lesson02.exercise02.recognize_seen_herat:
    instruction: Что означает это предложение?
    correct_option: Ты видел(а) Герат
    distractors:
    - Я видел Герат
    - Он видел Герат
    - Мы видели Герат
    accepted_answers:
    - value: Ты видел(а) Герат
      status: correct
    feedback: '*دیده‌ای* — это *دیده* плюс окончание *-ای* («ты»): *هرات را دیده‌ای* означает «ты видел(а) Герат».'
  prs.a2.unit25.lesson02.exercise03.match_participles:
    instruction: Соедини каждую форму на дари с её значением.
    accepted_answers:
    - value:
        رفته: побывавший, ходивший
        خورده: съеденный
        دیده: увиденный
        پخته: приготовленный
        کرده: сделанный
        خوردیم: я поел(а)
        دیدی: ты видел(а) (другу, на «ты»)
        پختیم: мы приготовили
        کردن: они сделали
        رفتین: вы были (вежливо или во мн. ч.)
      status: correct
    feedback: 'Причастие само по себе не указывает на лицо. Лицо показывает разговорное окончание, встроенное в глагол: *-یم، -ی، -یم، -ین، -ن*, а у 3-го лица единственного числа окончания нет совсем.'
    pairs:
    - left: رفته
      right: побывавший, ходивший
    - left: خورده
      right: съеденный
    - left: دیده
      right: увиденный
    - left: پخته
      right: приготовленный
    - left: کرده
      right: сделанный
    - left: خوردیم
      right: я поел(а)
    - left: دیدی
      right: ты видел(а) (другу, на «ты»)
    - left: پختیم
      right: мы приготовили
    - left: کردن
      right: они сделали
    - left: رفتین
      right: вы были (вежливо или во мн. ч.)
  prs.a2.unit25.lesson02.exercise04.order_mantu_qabili:
    instruction: 'Расставь слова так, чтобы сказать: «Я ел(а) манту и кабули палау».'
    accepted_answers:
    - value:
      - منتو
      - و
      - قابلی
      - پلو
      - خورده‌ام
      status: correct
    - value:
