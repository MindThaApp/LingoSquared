course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: называй кухонные предметы и продукты, описывай действия при готовке, следуй простым рецептам и рассказывай о приготовлении еды.'
units:
  prs.a1.unit36.cooking:
    title: Готовка
    description: Называй основные действия на кухне, рассказывай о приготовлении еды, понимай и давай простые указания по готовке.
lessons:
  prs.a1.unit36.lesson01.cooking_words:
    title: Слова о готовке
  prs.a1.unit36.lesson02.cooking_actions:
