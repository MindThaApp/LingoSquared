  prs.a1.unit36.lesson03.cooking_steps:
    title: Этапы готовки
  prs.a1.unit36.lesson04.kitchen_dialogue:
    title: Диалог на кухне
  prs.a1.unit36.lesson05.cooking_reading:
    title: Читаем о готовке
  prs.a1.unit36.lesson06.wrap_up:
    title: Повторение
teaching:
  prs.a1.unit36.lesson01.teach.kitchen_word:
    title: Кухня
    gloss: кухня
    note: آشپزخانه — стандартное слово дари для кухни.
    example_gloss: Сегодня я на кухне.
  prs.a1.unit36.lesson01.teach.food_word:
    title: Еда
    gloss: еда / блюдо
    note: غذا означает еду или трапезу в целом, в отличие от конкретного блюда, например پلو.
    example_gloss: Еда вкусная.
  prs.a1.unit36.lesson01.teach.onion_word:
    title: Лук
    gloss: лук
    note: پیاز — обычное слово дари для лука; его постоянно используют в афганской кухне.
    example_gloss: Лук свежий.
  prs.a1.unit36.lesson01.teach.meat_word:
    title: Мясо
    gloss: мясо
    note: گوشت означает мясо.
    example_gloss: Мясо свежее.
  prs.a1.unit36.lesson01.teach.review_basics:
    title: 'Повторение: один, хочу, в, я есть'
    gloss: один / я хочу / в, на / я есть, я нахожусь
    note: یک, می‌خواهم, در и استم — уже знакомые формы, которые встречаются в предложениях о готовке в этом уроке.
    target_text: یک (один) / می‌خواهم (я хочу) / در (в, на) / استم (я есть, я нахожусь)
  prs.a1.unit36.lesson01.teach.cook_food_phrase:
    title: Я готовлю еду
    gloss: Я готовлю еду.
    note: می‌پزم — форма 1-го лица настоящего времени от پختن, «готовить, варить, печь».
  prs.a1.unit36.lesson01.teach.in_kitchen_phrase:
    title: Я на кухне
    gloss: Я на кухне.
    note: استم — форма 1-го лица связки «быть»; здесь она употреблена с در для указания места.
  prs.a1.unit36.lesson02.teach.salt_word:
    title: Соль
    gloss: соль
    note: نمک означает соль.
    example_gloss: Мне нужна соль.
  prs.a1.unit36.lesson02.teach.rice_grain_word:
    title: Рис
    gloss: рис
    note: برنج — это сырой рис (крупа), в отличие от پلو, готового блюда из риса, которое изучается в уроке о еде.
    example_gloss: Я варю рис.
  prs.a1.unit36.lesson02.teach.review_do_cut:
    title: 'Повторение: я делаю, мелко нарезанный'
    gloss: я делаю / мелко нарезанный
    note: می‌کنم уже знакомо; خرد — новое слово, которое вместе с формами глагола کردن означает «резать, измельчать».
    target_text: می‌کنم (я делаю) / خرد (мелко нарезанный)
  prs.a1.unit36.lesson02.teach.chop_onion_phrase:
    title: Я режу лук
    gloss: Я режу лук.
    note: خرد می‌کنم буквально значит «делаю мелко нарезанным» — это типичная модель составного глагола.
  prs.a1.unit36.lesson02.teach.add_salt_phrase:
    title: Я добавляю соль
    gloss: Я добавляю соль.
    note: می‌اندازم (от انداختن, «бросать, класть») — естественный глагол дари для добавления продукта.
  prs.a1.unit36.lesson02.teach.cook_meat_phrase:
    title: Я готовлю мясо
    gloss: Я готовлю мясо.
    note: Замени گوشت на برنج, чтобы назвать другое блюдо или продукт, который ты готовишь.
  prs.a1.unit36.lesson03.teach.review_first_then:
    title: 'Повторение: сначала, потом'
    gloss: сначала / потом
    note: Слова اول и بعد повторяются здесь, чтобы выстраивать по порядку шаги приготовления.
    target_text: اول (сначала) / بعد (потом)
  prs.a1.unit36.lesson03.teach.review_water_hot:
    title: 'Повторение: вода, горячий'
    gloss: вода / горячий
    note: آب и گرم — слова для повторения из предыдущих уроков.
    target_text: آب (вода) / گرم (горячий)
  prs.a1.unit36.lesson03.teach.pour_word:
    title: Я вливаю
    gloss: я вливаю
    note: می‌ریزم (от ریختن, «лить») — естественный глагол для добавления жидкости; для твёрдых ингредиентов, в отличие от него, используется می‌اندازم.
    example_gloss: Я наливаю воду.
  prs.a1.unit36.lesson03.teach.first_chop_phrase:
    title: Сначала я нарезаю лук
    gloss: Сначала я нарезаю лук.
    note: Слово اول обозначает первый шаг в последовательности.
  prs.a1.unit36.lesson03.teach.then_cook_meat_phrase:
    title: Потом я готовлю мясо
    gloss: Потом я готовлю мясо.
    note: Слово بعد обозначает следующий шаг в последовательности.
  prs.a1.unit36.lesson03.teach.pour_hot_water_phrase:
    title: Я наливаю горячую воду
    gloss: Я наливаю горячую воду.
    note: Здесь گرم («горячий») сочетается с می‌ریزم («я наливаю»).
  prs.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Здравствуйте / да / пожалуйста / хорошо / спасибо / рагу / вкусный / есть
    gloss: здравствуйте / да / пожалуйста / хорошо, конечно / спасибо / корма (тушёное блюдо) / вкусный / есть, является
    note: Слова سلام, بلی, لطفاً, چشم, تشکر, قورمه, خوش‌مزه и است повторяются здесь — они нужны в диалоге на кухне.
    target_text: سلام (здравствуйте) / بلی (да) / لطفاً (пожалуйста) / چشم (хорошо, конечно) / تشکر (спасибо) / قورمه (тушёное блюдо) / خوش‌مزه (вкусный) / است (есть, является)
  prs.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Надия: Здравствуйте, что вы готовите?'
    gloss: Здравствуйте, что вы готовите?
    note: В вопросе چی می‌پزین؟ использована вежливая форма «вы» — می‌پزین.
  prs.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Фарид: Я готовлю корму.'
    gloss: Я готовлю корму.
  prs.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Надия: Вам помочь?'
    gloss: Вам помочь?
    note: کمک می‌کنم؟ буквально значит «Я помогаю?» — это естественный способ предложить помощь.
  prs.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Фарид: Да, пожалуйста, нарежьте лук.'
    gloss: Да, пожалуйста, нарежьте лук.
    note: 'کنین — вежливая форма повелительного наклонения: «сделайте!».'
  prs.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Надия: Конечно.'
    gloss: Конечно.
  prs.a1.unit36.lesson04.teach.dialogue_line6:
    title: 'Фарид: Спасибо, еда очень вкусная.'
    gloss: Спасибо, еда очень вкусная.
  prs.a1.unit36.lesson05.teach.review_he_she_words:
    title: Он/она, в, делает, готовит, очень, радостный, является
    gloss: он, она / в, на (о месте) / он, она делает / он, она готовит / очень / счастливый / есть, является
    note: او — местоимение дари, которое означает и «он», и «она»; می‌کند и می‌پزد — формы 3-го лица глаголов, которые встречались раньше в этом уроке.
    target_text: او (он, она) / در (в, на) / می‌کند (он, она делает) / می‌پزد (он, она готовит) / بسیار (очень) / خوشحال (счастливый) / است (есть, является)
  prs.a1.unit36.lesson05.teach.reading_passage:
    title: Текст о том, как Надия готовит
    gloss: Надия на кухне. Она нарезает лук. Потом она готовит мясо. Еда очень вкусная. Надия счастлива.
  prs.a1.unit36.lesson06.teach.review_like_but_time:
    target_text: دوست دارم (я люблю) / را (показатель прямого дополнения) / اما (но) / وقت ندارم (у меня нет времени)
