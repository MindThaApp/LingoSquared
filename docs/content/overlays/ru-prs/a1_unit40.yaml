course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: научись распознавать простую экстренную ситуацию, звать на помощь, говорить, нужна ли полиция, скорая помощь или пожарная служба, описывать травму и читать короткий текст на тему экстренной помощи.'
units:
  prs.a1.unit40.emergencies:
    title: Экстренные ситуации
    description: Научись распознавать простую экстренную ситуацию, звать на помощь и говорить, какая помощь нужна (полиция, скорая помощь или пожарная служба).
lessons:
  prs.a1.unit40.lesson01.emergency_types:
    title: Экстренная помощь
  prs.a1.unit40.lesson02.asking_for_help:
    title: Просьба о помощи
  prs.a1.unit40.lesson03.describing_the_emergency:
    title: Ранение и кровотечение
  prs.a1.unit40.lesson04.emergency_dialogue:
    title: Диалог в экстренной ситуации
  prs.a1.unit40.lesson05.emergency_reading:
    title: Читаем об экстренной помощи
  prs.a1.unit40.lesson06.wrap_up:
    title: Итоги
teaching:
  prs.a1.unit40.lesson01.teach.review_help_want:
    title: 'Повторение: помощь, я хочу'
    gloss: помощь / я хочу
    note: 'Слова کمک и می‌خواهم повторяются во всём уроке: с их помощью ты говоришь, какая помощь нужна.'
    target_text: کمک (помощь) / می‌خواهم (я хочу)
  prs.a1.unit40.lesson01.teach.review_this_is:
    title: 'Повторение: это, является'
    gloss: это / есть, является
    note: 'Слова این и است — раннее повторение: с ними можно сказать, что за ситуация перед тобой.'
    target_text: این (это) / است (есть, является)
  prs.a1.unit40.lesson01.teach.emergency_word:
    title: Экстренная ситуация
    gloss: экстренный случай
    note: اضطراری означает «экстренный, срочный».
    example_gloss: Это экстренная ситуация.
  prs.a1.unit40.lesson01.teach.police_word:
    title: Полиция
    gloss: полиция
    note: پولیس — стандартное слово для обозначения полиции в афганском дари; как и в русском, оно заимствовано из европейских языков.
    example_gloss: Мне нужна полиция.
  prs.a1.unit40.lesson01.teach.ambulance_word:
    title: Скорая помощь
    gloss: скорая помощь
    note: امبولانس означает «скорая помощь».
    example_gloss: Мне нужна скорая помощь.
  prs.a1.unit40.lesson01.teach.fire_word:
    title: Огонь
    gloss: пожар
    note: آتش означает «огонь, пожар».
    example_gloss: Пожар!
  prs.a1.unit40.lesson01.teach.fire_brigade_word:
    title: Пожарная служба
    gloss: пожарная служба
    note: اطفائیه — обычное в Кабуле название пожарной службы.
    example_gloss: Мне нужна пожарная служба.
  prs.a1.unit40.lesson01.teach.emergency_help_phrase:
    title: Это экстренная ситуация! Мне нужна полиция!
    gloss: Это экстренная ситуация! Мне нужна полиция!
    note: این اضطراری است состоит из این («это»), اضطراری («экстренный случай») и است («есть, является»).
  prs.a1.unit40.lesson02.teach.review_can_you_do:
    title: 'Повторение: вы можете, сделайте, к/для, быстро'
    gloss: вы можете / сделайте / к, для / быстро
    note: Слова می‌توانین, کنین, به и زود (из прошлых уроков) сочетаются с другими словами в вежливых просьбах и приказах.
    target_text: می‌توانین (можете ли вы) / کنین (сделайте — вежливая форма приказа) / به (к, для) / زود (быстро)
  prs.a1.unit40.lesson02.teach.mera_word:
    title: Меня
    gloss: меня
    note: 'مه ره — разговорная кабульская форма вместо مرا («меня» как прямое дополнение): مه — разговорная форма من, а ره — разговорная форма показателя дополнения را. На письме чаще встречается مرا; этот вариант тоже принимается.'
    example_gloss: Ты можешь мне помочь?
  prs.a1.unit40.lesson02.teach.can_you_help_me_phrase:
    title: Вы можете мне помочь?
    gloss: Вы можете мне помочь?
    note: Настоящая, часто употребляемая фраза на дари, чтобы прямо попросить о помощи.
  prs.a1.unit40.lesson02.teach.call_word:
    title: Позвоните! (повелительное наклонение)
    gloss: позвоните
    note: زنگ بزنین — вежливая форма повелительного наклонения от زنگ زدن («звонить»); она опирается на уже изученное زنگ می‌زنم («я звоню»).
    example_gloss: Позвоните в полицию!
  prs.a1.unit40.lesson02.teach.come_word:
    title: Приходите! (повелительное наклонение)
    gloss: приходите
    note: بیایین — вежливая форма повелительного наклонения от آمدن («приходить»).
    example_gloss: Приходите скорее!
  prs.a1.unit40.lesson02.teach.call_ambulance_phrase:
    title: Вызовите скорую помощь!
    gloss: Вызовите скорую помощь!
    note: به («к, для») + امبولانس («скорая помощь») + повелительная форма زنگ بزنین.
  prs.a1.unit40.lesson03.teach.review_he_she_has:
    title: 'Повторение: он/она, у него/неё есть'
    gloss: он/она / у него/неё есть
    note: 'Формы او и دارد — повторение: с их помощью ты описываешь состояние другого человека в экстренной ситуации.'
    target_text: او (он/она) / دارد (у него/неё есть)
  prs.a1.unit40.lesson03.teach.injured_word:
    title: Раненый
    gloss: раненый
    note: زخمی означает «раненый, травмированный».
    example_gloss: Он/она ранен(а).
  prs.a1.unit40.lesson03.teach.bleeding_word:
    title: Кровотечение
    gloss: кровотечение
    note: خون‌ریزی означает «кровотечение».
    example_gloss: У него/неё кровотечение.
  prs.a1.unit40.lesson03.teach.injured_ambulance_phrase:
    title: Он/она ранен(а)! Мне нужна скорая помощь!
    gloss: Он/она ранен(а)! Мне нужна скорая помощь!
    note: Слово زخمی сочетается с уже изученным امبولانس می‌خواهم.
  prs.a1.unit40.lesson03.teach.bleeding_come_quickly_phrase:
    title: У него/неё кровотечение! Приходите скорее!
    gloss: У него/неё кровотечение! Приходите скорее!
    note: Слово خون‌ریزی сочетается с уже изученным زود بیایین.
  prs.a1.unit40.lesson04.teach.review_dialogue_words:
    title: 'Повторение: что, он/она приходит, я звоню, большое спасибо'
    gloss: что / он/она приходит / я звоню / большое спасибо
    note: 'Слова چه, می‌آید, زنگ می‌زنم и تشکر زیاد — повторение: они встречаются в диалоге об экстренной ситуации.'
    target_text: چه (что) / می‌آید (он/она приходит) / زنگ می‌زنم (я звоню) / تشکر زیاد (большое спасибо)
  prs.a1.unit40.lesson04.teach.dialogue_line1:
    title: 'Хумайун: Зармина, помоги! На помощь!'
    gloss: Зармина, помоги! На помощь!
  prs.a1.unit40.lesson04.teach.dialogue_line2:
    title: 'Зармина: Что?'
    gloss: Что?
  prs.a1.unit40.lesson04.teach.dialogue_line3:
    title: 'Хумайун: Он/она ранен(а)! У него/неё кровотечение!'
    gloss: Он/она ранен(а)! У него/неё кровотечение!
  prs.a1.unit40.lesson04.teach.dialogue_line4:
    title: 'Зармина: Мне нужна скорая помощь. Я звоню!'
    gloss: Мне нужна скорая помощь. Я звоню!
  prs.a1.unit40.lesson04.teach.dialogue_line5:
    title: 'Хумайун: Большое спасибо!'
    gloss: Большое спасибо!
  prs.a1.unit40.lesson04.teach.dialogue_line6:
    title: 'Зармина: Скорая помощь скоро приедет.'
    gloss: Скорая помощь скоро приедет.
  prs.a1.unit40.lesson05.teach.review_reading_words:
    title: 'Повторение: один, человек, город, он/она делает, в'
    gloss: один / человек / город / он/она делает / в
    note: 'Слова یک, نفر, شهر, می‌کند и در — повторение: они встречаются в этом тексте для чтения.'
    target_text: یک (один) / نفر (человек) / شهر (город) / می‌کند (он/она делает) / در (в)
  prs.a1.unit40.lesson05.teach.reading_passage:
    title: Читаем об экстренной ситуации
    gloss: В городе кто-то ранен. У него/неё кровотечение. Хумайун помогает. Приезжает скорая помощь.
  prs.a1.unit40.lesson06.teach.review_wrap_up_words:
    title: 'Повторение: телефон, у меня нет, но, вы (вежливо)'
    gloss: телефон / у меня нет / но / вы (вежливо)
    note: 'Слова تلفن, ندارم, اما и شما — повторение: с ними можно противопоставить нужду и ограничение и задать вежливый вопрос.'
    target_text: تلفن (телефон) / ندارم (у меня нет) / اما (но) / شما (вы, вежливая форма)
  prs.a1.unit40.lesson06.teach.contrast_phrase:
    title: Мне нужна помощь, но у меня нет телефона
    gloss: Мне нужна помощь, но у меня нет телефона.
    note: اما противопоставляет потребность в помощи и отсутствие телефона, чтобы её вызвать.
  prs.a1.unit40.lesson06.teach.formal_question_phrase:
    title: Ты можешь помочь?
    gloss: Вы можете помочь?
    note: Вежливый вариант с شما — для прямой и учтивой просьбы о помощи.
