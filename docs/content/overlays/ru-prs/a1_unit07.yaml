course:
  title: Дари A1
  description: 'Дари Афганистана для начинающих: как ответить на звонок, представиться по телефону, попросить повторить или говорить медленнее, оставить сообщение и написать простое SMS.'
units:
  prs.a1.unit07.communication:
    title: Разговор по телефону
lessons:
  prs.a1.unit07.lesson01.answering_the_phone:
    title: Отвечаем на звонок
  prs.a1.unit07.lesson02.identifying_yourself:
    title: Представляемся по телефону
  prs.a1.unit07.lesson03.asking_to_repeat_or_slow_down:
    title: Просим повторить или говорить медленнее
  prs.a1.unit07.lesson04.leaving_a_message:
    title: Оставляем сообщение
  prs.a1.unit07.lesson05.text_messages:
    title: Читаем и пишем короткое SMS
  prs.a1.unit07.lesson06.phone_call_dialogue:
    title: Целый телефонный разговор
teaching:
  prs.a1.unit07.lesson01.teach.alo:
    title: Алло (по телефону)
    gloss: алло
    note: الو используется именно для ответа на звонок или начала телефонного разговора, в отличие от سلام при личной встрече.
    example_gloss: Алло, это Карим.
  prs.a1.unit07.lesson01.teach.goosh_astam:
    title: Приглашаем звонящего говорить
    gloss: Да, слушаю вас.
    note: بلی، بفرمایین — естественный ответ после того, как берёшь трубку. Здесь используется всё та же вежливая форма بفرمایین («пожалуйста», «прошу»), уже встречавшаяся в курсе; это не буквальный перевод фразы «Слушаю вас».
  prs.a1.unit07.lesson01.teach.telephone_review:
    title: Телефон (повторение)
    gloss: телефон
    note: Слово تلفن появилось в разделе о числах; здесь оно задаёт тему всего раздела.
    example_gloss: Мой телефон сломан.
  prs.a1.unit07.lesson02.teach.who_speaking:
    title: Спрашиваем, кто звонит
    gloss: Извините, кто говорит?
    note: ببخشین، کی صحبت می‌کند؟ — вежливый вопрос о том, кто звонит.
  prs.a1.unit07.lesson02.teach.this_is_speaking:
    title: Представляемся
    gloss: Это Фарид.
    note: من فرید استم прямо сообщает, кто звонит; здесь используется уже знакомая по прошлым разделам форма استم.
  prs.a1.unit07.lesson02.teach.colleague_context:
    title: Объясняем, как мы связаны с тем, кому звоним
    gloss: Я коллега Хумаюна.
    note: همکار همایون استم объясняет, почему вы звоните; это полезно, когда отвечающий вас не знает.
  prs.a1.unit07.lesson03.teach.speak_slowly:
    title: Просим говорить медленно
    gloss: Говорите, пожалуйста, медленно.
    note: لطفاً آهسته صحبت کنین — естественная вежливая просьба при плохой связи или если вы только учите язык.
  prs.a1.unit07.lesson03.teach.repeat_review:
    title: Просим повторить (повторение)
    gloss: Не могли бы вы повторить?
    note: می‌توانین دوباره بگویین؟ встречалась в разделе о знакомстве; она так же уместна и в телефонном разговоре.
  prs.a1.unit07.lesson03.teach.combined_request:
    title: Соединяем две просьбы
    gloss: Говорите, пожалуйста, медленно и повторите.
    note: و соединяет две просьбы в одну естественную фразу.
  prs.a1.unit07.lesson04.teach.payam_word:
    title: Сообщение
    gloss: сообщение
    note: پیام — общее слово для сообщения, устного или письменного.
    example_gloss: У меня для вас сообщение.
  prs.a1.unit07.lesson04.teach.want_to_leave_message:
    title: Говорим, что хотим оставить сообщение
    gloss: Я хочу оставить сообщение.
    note: می‌خواهم یک پیام بگذارم — так говорят, когда человека, которому вы звоните, нет на месте.
  prs.a1.unit07.lesson04.teach.will_call_later:
    title: Говорим, что перезвоним позже
    gloss: Я позвоню позже.
    note: بعد زنگ می‌زنم — простая альтернатива тому, чтобы оставлять сообщение.
  prs.a1.unit07.lesson05.teach.short_message:
    title: Сообщение
    gloss: SMS (короткое сообщение)
    note: پیام کوتاه буквально значит «короткое сообщение»; так в повседневной речи называют SMS.
  prs.a1.unit07.lesson05.teach.meeting_tomorrow:
    title: Пример сообщения
    gloss: Завтра совещание в девять часов.
    note: فردا جلسه ساعت نه است — естественная законченная информация, которую можно передать в сообщении.
  prs.a1.unit07.lesson05.teach.will_deliver:
    title: Подтверждаем, что передадим сообщение
    gloss: Я передам.
    note: می‌رسانم подтверждает, что сообщение дойдёт до адресата.
  prs.a1.unit07.lesson06.teach.turn01:
    title: Лима отвечает на звонок
    gloss: Лима отвечает телефонным приветствием.
    note: الو؟ — стандартный способ ответить на входящий звонок.
  prs.a1.unit07.lesson06.teach.turn02:
    title: Фарид здоровается и уточняет, с кем говорит
    gloss: Фарид здоровается и спрашивает, Лима ли это.
    note: الو، سلام сочетает телефонное приветствие с обычным.
  prs.a1.unit07.lesson06.teach.turn03:
    title: Лима предлагает ему говорить и спрашивает, кто звонит
    gloss: Лима предлагает ему говорить и спрашивает, кто звонит.
    note: بلی، بفرمایین и کی صحبت می‌کند؟ — обе фразы из прошлых уроков этого раздела (lesson01 и lesson02).
  prs.a1.unit07.lesson06.teach.turn04:
    title: Фарид представляется
    gloss: Фарид говорит, что он коллега Хумаюна.
    note: 'Здесь повторяется модель с «коллегой» из второго урока: она даёт Лиме повод доверять звонку.'
  prs.a1.unit07.lesson06.teach.turn05:
    title: Лима просит его говорить медленнее
    gloss: Лима здоровается и просит говорить медленно.
    note: آهسته صحبت کنین، لطفاً повторяет просьбу из третьего урока.
  prs.a1.unit07.lesson06.teach.turn06:
    title: Фарид соглашается и просит оставить сообщение
    gloss: Фарид соглашается и говорит, что хочет оставить сообщение для Хумаюна.
    note: 'Модель с پیام из четвёртого урока расширяется: теперь называется адресат (برای همایون, «для Хумаюна»).'
  prs.a1.unit07.lesson06.teach.turn07:
    title: Лима соглашается записать
    gloss: Лима предлагает ему говорить и сообщает, что записывает.
    note: بفرمایین здесь приглашает Фарида продолжать.
  prs.a1.unit07.lesson06.teach.turn08:
    title: Фарид диктует сообщение
    gloss: Фарид просит передать, что совещание завтра в девять.
    note: Здесь напрямую используется пример сообщения из пятого урока.
  prs.a1.unit07.lesson06.teach.turn09:
    title: Лима подтверждает и обещает передать
    gloss: Лима повторяет детали и говорит, что передаст сообщение.
    note: می‌رسانم завершает приём сообщения в разговоре, как в пятом уроке.
  prs.a1.unit07.lesson06.teach.turn10:
    title: Фарид благодарит и прощается
    gloss: Фарид горячо благодарит её и прощается.
    note: تشکر زیاد и خدا حافظ — слова из предыдущих разделов.
  prs.a1.unit07.lesson06.teach.turn11:
    title: Лима прощается
    gloss: Лима прощается.
    note: خدا حافظ завершает разговор.
  prs.a1.unit07.lesson06.teach.past_tense_left:
    title: Говорим, что кто-то оставил сообщение (прошедшее время)
    gloss: Фарид оставил сообщение.
    note: گذاشت — простое прошедшее время («оставил») глагола из фразы می‌خواهم یک پیام بگذارم в четвёртом уроке, где بگذارم значит «я оставлю». С его помощью можно подвести итог тому, что произошло после звонка.
    target_text: فرید پیام گذاشت (Фарид оставил сообщение)
