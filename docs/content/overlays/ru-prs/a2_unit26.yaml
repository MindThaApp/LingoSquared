course:
  title: Дари A2
  description: 'Дари Афганистана, уровень ниже среднего: как сказать, что что-то уже произошло до определённого момента в прошлом, например что автобус уехал до твоего приезда. Предпрошедшее время (причастие и прошедшее время глагола بودن), его отрицание и отличие от простого прошедшего.'
units:
  prs.a2.unit26.already_happened:
    title: Это уже случилось
lessons:
  prs.a2.unit26.lesson01.form_and_travel_words:
    title: Форма «уже ушёл» и слова о поездках
  prs.a2.unit26.lesson02.more_verbs_with_bud:
    title: Другие глаголы в предпрошедшем времени
  prs.a2.unit26.lesson03.earlier_and_later:
    title: Более раннее и более позднее событие
  prs.a2.unit26.lesson04.time_words:
    title: Уже, раньше, ещё не
  prs.a2.unit26.lesson05.reading_and_listening:
    title: 'Чтение и аудирование: опоздание'
  prs.a2.unit26.lesson06.airport_conversation:
    title: Разговор о пропущенном самолёте
teaching:
  prs.a2.unit26.lesson01.teach.bus:
    title: Автобус
    gloss: автобус
    note: '*بس* — это автобус, обычный способ ездить между городами в Афганистане. Это повторение слова из раздела о транспорте.'
    example_gloss: Автобус идёт в Мазар.
  prs.a2.unit26.lesson01.teach.station:
    title: Вокзал
    gloss: станция, остановка
    note: '*ایستگاه* — станция или остановка. *ایستگاه بس* — автобусная станция.'
    example_gloss: Автобусная станция находится в Кабуле.
  prs.a2.unit26.lesson01.teach.plane:
    title: Самолёт
    gloss: самолёт
    note: '*طیاره* — афганское слово, означающее «самолёт».'
    example_gloss: Самолёт прилетает в Кабул.
  prs.a2.unit26.lesson01.teach.airport:
    title: Аэропорт
    gloss: аэропорт
    note: '*میدان هوایی* — это аэропорт. Самолёты вылетают из *میدان هوایی*, а автобусы отправляются с *ایستگاه*.'
    example_gloss: Аэропорт находится в Кабуле.
  prs.a2.unit26.lesson01.teach.car:
    title: Машина
    gloss: машина
    note: '*موتر* — афганское слово, означающее «машина». Если добавить *-م*, получится «моя машина»: *موترم*.'
    example_gloss: Моя машина новая.
  prs.a2.unit26.lesson01.teach.arrive:
    title: Приходить, прибывать
    gloss: прибывать, добираться
    note: '*رسیدن* — «прибывать, добираться». Место, куда ты прибываешь, указывается с помощью *به*: *به ایستگاه رسیدم* — «я добрался до станции». Основа прошедшего времени — *رسید*, отсюда *رسیدم، رسیدی، رسید، رسیدیم*.'
    example_gloss: Мы добрались до станции.
  prs.a2.unit26.lesson01.teach.return:
    title: Вернуться
    gloss: возвращаться, вернуться
    note: '*برگشتن* — «возвращаться, вернуться». Основа прошедшего времени — *برگشت*: *برگشتم* — «я вернулся (вернулась)».'
    example_gloss: Вчера я вернулся домой.
  prs.a2.unit26.lesson01.teach.passport:
    title: Паспорт
    gloss: паспорт
    note: '*پاسپورت* — паспорт. Добавь *-م*, чтобы сказать «мой»: *پاسپورتم*.'
    example_gloss: Мой паспорт дома.
  prs.a2.unit26.lesson01.teach.key:
    title: Ключ
    gloss: ключ
    note: '*کلید* — ключ. *کلیدم* — «мой ключ».'
    example_gloss: Мой ключ дома.
  prs.a2.unit26.lesson01.teach.phone:
    title: Телефон
    gloss: телефон
    note: '*تیلفون* — телефон. *تیلفونم* — «мой телефон». *تیلفون کردن* — «звонить по телефону».'
    example_gloss: Мой телефон новый.
  prs.a2.unit26.lesson01.teach.lose:
    title: Потерять
    gloss: терять, потерять
    note: '*گم کردن* — «потерять что-либо». *گم* значит «потерянный», а *کردن* — глагол «делать». Потерянная вещь ставится перед глаголом вместе с *را*, например: *کلیدم را گم کردم* («я потерял свой ключ»).'
    example_gloss: Вчера я потерял свой ключ.
  prs.a2.unit26.lesson01.teach.when:
    title: Когда
    gloss: когда
    note: '*وقتی* начинает придаточную часть, которая указывает момент времени, здесь — в прошлом: *وقتی رسیدم* — «когда я прибыл». Эта часть служит точкой отсчёта для всего урока.'
    example_gloss: Когда я пришёл домой, я позавтракал.
  prs.a2.unit26.lesson01.teach.participle:
    title: 'Причастие прошедшего времени: основа прошедшего времени + ه'
    gloss: ушедший, съеденный, увиденный, прибывший, пришедший, сделанный, ставший (причастия)
    note: 'Предпрошедшее время строится из причастия прошедшего времени, поэтому сначала выучи его. Возьми инфинитив, отбрось конечное *ن* — получится основа прошедшего времени — и добавь *ه*: у *رفتن* основа *رفت*, значит, причастие — *رفته*. По тому же правилу: *خوردن* — *خورده*, *دیدن* — *دیده*, *رسیدن* — *رسیده*, *آمدن* — *آمده*, *کردن* — *کرده*, *شدن* — *شده*. Причастие не изменяется по лицам: оно одинаково для «я», «ты», «он» и «они». Это же причастие входит в форму *رفته‌ام* («я ходил(а)»), которую ты встретишь в уроке об жизненном опыте; в этом уроке оно используется только с прошедшим временем глагола *بودن*.'
  prs.a2.unit26.lesson01.teach.paradigm:
    title: 'Предпрошедшее время: причастие + прошедшее время глагола بودن'
    gloss: я уже ушёл, ты уже ушёл, он/она/оно уже ушёл(а), мы уже ушли, вы уже ушли (вежливая форма или множественное число), они уже ушли
    note: 'Предпрошедшее время показывает, что что-то уже произошло до другого момента в прошлом. Оно образуется из причастия и прошедшего времени глагола *بودن* («быть»): *بودم، بودی، بود، بودیم، بودین، بودند*. Так, *رفته بودم* — «я уже ушёл», *رفته بودی* — «ты уже ушёл» (другу), *رفته بود* — «он, она, оно уже ушёл(а)» (форма *بود* без окончания), *رفته بودیم* — «мы уже ушли», *رفته بودین* — «вы уже ушли» (вежливая форма или множественное число), *رفته بودند* — «они уже ушли». Местоимение необязательно, потому что окончание и так показывает лицо. Причастие и *بود-* пишутся как два отдельных слова.'
  prs.a2.unit26.lesson01.teach.sentence:
    title: Когда я добрался до станции, автобус уже ушёл
    gloss: Когда я добрался до станции, автобус уже ушёл.
    note: 'Это образец для всего урока. *وقتی به ایستگاه رسیدم* — момент твоего прибытия (простое прошедшее). *بس رفته بود* — то, что уже произошло до этого момента (предпрошедшее): сначала ушёл автобус, потом прибыл ты.'
  prs.a2.unit26.lesson02.teach.more_participles:
    title: Одно правило для всех глаголов
    gloss: я уже поел, ты уже увидел, он/она уже прибыл(а), мы уже пришли, вы уже сделали, они уже вернулись
    note: 'Правило, показанное на *رفتن*, работает для любого глагола: основа прошедшего времени + *ه*, затем *بودم، بودی، بود، بودیم، بودین، بودند*. *خورده بودم* — «я уже поел», *دیده بودی* — «ты уже увидел», *رسیده بود* — «он или она уже прибыл(а)», *آمده بودیم* — «мы уже пришли», *کرده بودین* — «вы уже сделали», *برگشته بودند* — «они уже вернулись». Меняется только *بود-*, причастие — никогда.'
  prs.a2.unit26.lesson02.teach.compound_verbs:
    title: Глаголы из двух слов
    gloss: я уже потерял; он уже был закрыт; он уже сломался
    note: 'Многие глаголы состоят из слова и *کردن* или *شدن*. Причастие образуется от второй части, а первая часть остаётся впереди: *گم کردن* даёт *گم کرده بودم* («я уже потерял»), *بسته شدن* даёт *بسته شده بود* («он уже был закрыт»), *خراب شدن* даёт *خراب شده بود* («он уже сломался»). *شدن* удобен, когда что-то случилось с предметом: с воротами, машиной, учреждением.'
  prs.a2.unit26.lesson02.teach.gate:
    title: Ворота, дверь
    gloss: ворота, дверь
    note: '*دروازه* — это ворота или большая дверь, например, ворота в аэропорту или дверь учреждения.'
    example_gloss: Ворота открыты.
  prs.a2.unit26.lesson02.teach.gate_closed:
    title: Ворота уже были закрыты
    gloss: Ворота уже были закрыты.
    note: '*بسته شده بود* говорит о том, что ворота были закрыты ещё до твоего прихода. Это предпрошедшее время глагола *بسته شدن*.'
  prs.a2.unit26.lesson02.teach.break_down:
    title: Сломаться
    gloss: ломаться, выходить из строя
    note: '*خراب* значит «сломанный» или «испорченный», а *شدن* — «становиться», поэтому *خراب شدن* — «сломаться». Простое прошедшее — *خراب شد*: *موترم خراب شد* — «моя машина сломалась».'
    example_gloss: Моя машина сломалась.
  prs.a2.unit26.lesson02.teach.ate_breakfast:
    title: Я уже позавтракал
    gloss: Я уже позавтракал.
    note: '*صبحانه خورده بودم* говорит о том, что завтрак уже закончился до того момента, о котором ты рассказываешь.'
  prs.a2.unit26.lesson02.teach.meeting:
    title: Встреча
    gloss: встреча
    note: '*جلسه* — собрание, совещание. Это ещё одна встреча, на которую можно не попасть или опоздать.'
    example_gloss: Совещание началось в девять.
  prs.a2.unit26.lesson02.teach.manager:
    title: Руководитель
    gloss: руководитель, директор
    note: '*مدیر* — руководитель или директор учреждения.'
    example_gloss: Директор в офисе.
  prs.a2.unit26.lesson03.teach.contrast:
    title: Предпрошедшее и простое прошедшее
    gloss: Когда я приехал, автобус уже ушёл. / Когда я приехал, автобус ушёл.
    note: 'Когда два события рассказываются вместе, то, что произошло раньше, ставится в предпрошедшее время, а более позднее событие, точка отсчёта, — в простое прошедшее. В *وقتی رسیدم، بس رفته بود* ты прибыл вторым, а автобус ушёл первым, поэтому ты его не застал: автобуса уже нет. В *وقتی رسیدم، بس رفت* оба глагола в простом прошедшем, поэтому автобус ушёл после твоего прибытия или как раз в этот момент. Части предложения могут стоять и в обратном порядке: *بس رفته بود، وقتی رسیدم*.'
  prs.a2.unit26.lesson03.teach.bus_left_simple:
    title: Когда я приехал, автобус ушёл
    gloss: Когда я приехал, автобус ушёл.
    note: Сравни с *بس رفته بود*. Здесь автобус ушёл после твоего прибытия. Ты ещё мог бы за ним побежать. С *رفته بود* его уже не было.
  prs.a2.unit26.lesson03.teach.manager_left:
    title: Когда я приехал, директор уже ушёл
    gloss: Когда я приехал, директор уже ушёл.
    note: 'Та же схема, что и с автобусом: *وقتی رسیدم* — твоё прибытие, *مدیر رفته بود* — более раннее событие. Так говорят, когда приходят на встречу, а человека уже нет.'
  prs.a2.unit26.lesson03.teach.negative:
    title: 'Отрицание: ن перед причастием'
    gloss: я ещё не ушёл, ты ещё не ушёл, он/она ещё не ушёл(а), мы ещё не ушли, вы ещё не ушли, они ещё не ушли
    note: 'Чтобы сказать, что что-то ещё не произошло, поставь *ن* в начало причастия, а не к *بود*: *رفته بودم* превращается в *نرفته بودم* («я не уходил (не ушла)»). У *بود-* окончания остаются прежними: *نرفته بودم، نرفته بودی، نرفته بود، نرفته بودیم، نرفته بودین، نرفته بودند*. Не пиши *رفته نبودم* в этом значении.'
  prs.a2.unit26.lesson03.teach.negative_more:
    title: Отрицательные причастия других глаголов
    gloss: я не ел, я не видел, я не прибыл, я не приходил
    note: 'То же *ن* ставится перед любым причастием: *نخورده* («не съеден»), *ندیده* («не увиден»), *نرسیده* («не прибыл»). Исключение, которое нужно запомнить, — глагол *آمدن*: его причастие *آمده* принимает *نیـ*, поэтому отрицание — *نیامده* («не пришёл»), как в *نیامده بودم*. В глаголах из двух слов *ن* ставится перед второй частью: *گم نکرده بودم* («я не терял»).'
  prs.a2.unit26.lesson04.teach.already:
    title: Уже, раньше
    gloss: уже, раньше, ранее
    note: '*قبلاً* значит «до этого момента» или «ранее». Слово подчёркивает, что действие было сделано раньше, и ставится перед причастием или в начале предложения.'
    example_gloss: Я уже раньше позавтракал.
  prs.a2.unit26.lesson04.teach.from_before:
    title: Уже, заранее
    gloss: уже, заранее
    note: '*از قبل* значит «заранее» или «уже, с более раннего времени». Оно стоит перед причастием: *از قبل رفته بود* — «он уже ушёл». Очень часто встречается с предпрошедшим временем.'
    example_gloss: Автобус уже ушёл.
  prs.a2.unit26.lesson04.teach.not_yet:
    title: Ещё, пока не
    gloss: 'ещё; с отрицанием: ещё не'
    note: '*هنوز* с отрицательным глаголом значит «ещё не». *هنوز نیامده بود* — «он ещё не пришёл». Отрицательное предпрошедшее и *هنوز* употребляются вместе: то, чего ты ждал, к тому моменту ещё не произошло.'
    example_gloss: Он ещё не пришёл.
  prs.a2.unit26.lesson04.teach.before_clause:
    title: 'قبل از اینکه: до того, как я приехал'
    gloss: До того как я приехал, самолёт уже улетел. / До того как мы приехали, самолёт уже улетел.
    note: '*قبل از اینکه* значит «до того, как» и вводит часть со своим глаголом. Глагол после него стоит в сослагательном наклонении — в той же форме, что и после *باید*: *برسم* («чтобы я прибыл»), *برسیم* («чтобы мы прибыли»). Это не форма прошедшего времени, хотя рассказ идёт о прошлом. Главная часть сообщает, что уже произошло: *طیاره رفته بود*. Поэтому *قبل از اینکه من برسم، طیاره رفته بود* значит то же, что *وقتی رسیدم، طیاره رفته بود*: самолёт улетел первым. Части можно менять местами.'
  prs.a2.unit26.lesson04.teach.friend_not_yet:
    title: Когда я приехал, мой друг ещё не пришёл
    gloss: Когда я приехал, мой друг ещё не пришёл.
    note: Здесь более раннее событие — то, что ещё не произошло. *هنوز نیامده بود* помещает отсутствующее событие перед точкой отсчёта *وقتی رسیدم*.
  prs.a2.unit26.lesson04.teach.what_happened:
    title: Когда ты добрался до станции, что случилось?
    gloss: Когда ты добрался до станции, что случилось?
    note: '*چه شد؟* спрашивает «что случилось?». Ответ обычно стоит в предпрошедшем времени: *بس از قبل رفته بود* («автобус уже ушёл»).'
  prs.a2.unit26.lesson05.teach.four:
    title: Четыре
    gloss: четыре
    note: '*چهار* — четыре. Используется для времени: *ساعت چهار* — «четыре часа».'
    example_gloss: Я пришёл домой в четыре часа.
  prs.a2.unit26.lesson05.teach.staff:
    title: Сотрудники, персонал
    gloss: сотрудники, персонал
    note: '*کارمندان* — множественное число от *کارمند* («сотрудник»). Окончание *-ان* образует множественное число для людей.'
    example_gloss: Сотрудники в офисе.
  prs.a2.unit26.lesson05.teach.passport_office:
    title: Паспортный стол
    gloss: паспортный стол
    note: '*دفتر پاسپورت* — учреждение, где получают или обновляют паспорт. Оба слова ты уже знаешь.'
    example_gloss: Паспортный стол находится в Кабуле.
  prs.a2.unit26.lesson05.teach.bus_turn01:
    title: Шакиба спрашивает Нэмата о вчерашнем дне
    gloss: Нэмат, ты вчера ездил в Мазар?
    note: Шакиба задаёт вопрос с ответом «да» или «нет» о завершённом действии в простом прошедшем *رفتی*. Собеседник — друг, поэтому она говорит *تو*.
  prs.a2.unit26.lesson05.teach.bus_turn02:
    title: Нэмат рассказывает, что обнаружил
    gloss: Нет. Когда я добрался до станции, автобус уже ушёл.
    note: Нэмат отвечает *نخیر*, затем называет точку отсчёта в простом прошедшем — *وقتی به ایستگاه رسیدم* — и более раннее событие в предпрошедшем — *بس رفته بود*.
  prs.a2.unit26.lesson05.teach.bus_turn03:
    title: Шакиба спрашивает о времени
    gloss: Во сколько ушёл автобус?
    note: '*ساعت چند* спрашивает о времени. *حرکت کرد* — простое прошедшее от *حرکت کردن*, «отправляться».'
  prs.a2.unit26.lesson05.teach.bus_turn04:
    title: Нэмат называет два времени
    gloss: В восемь. Я приехал в девять.
    note: 'Два времени, два события: автобус ушёл в *ساعت هشت*, а Нэмат приехал в *ساعت نه*. Восемь раньше девяти, поэтому автобус ушёл первым.'
  prs.a2.unit26.lesson05.teach.bus_turn05:
    title: Шакиба спрашивает, что было потом
    gloss: Что ты потом сделал?
    note: '*بعد چه کردی؟* — вопрос о том, что ты сделал потом. Здесь используется простое прошедшее время, потому что это новое действие после приезда.'
  prs.a2.unit26.lesson05.teach.bus_turn06:
    title: Наимат вернулся домой
    gloss: Я вернулся домой.
    note: '*برگشتم* — простое прошедшее время от *برگشتن*: он вернулся домой.'
  prs.a2.unit26.lesson05.teach.message:
    title: Сообщение об опоздании
    gloss: Привет, Шакиба. Сегодня в четыре часа я приехал в паспортный стол, но он уже был закрыт. Сотрудники ушли. Моя машина сломалась, поэтому я опоздал. Завтра утром поеду снова.
    note: 'Короткое письменное сообщение в предпрошедшем времени. В нём автор рассказывает, что он застал по приезде: офис был закрыт, а сотрудники ушли. Также названа более ранняя причина опоздания: сломалась машина.'
  prs.a2.unit26.lesson06.teach.herat:
    title: Герат
    gloss: Герат (город на западе Афганистана)
    note: '*هرات* — город Герат на западе Афганистана. Туда летают из Кабула.'
    example_gloss: Самолёт летит в Герат.
  prs.a2.unit26.lesson06.teach.find:
    title: Найти
    gloss: найти
    note: '*پیدا کردن* — найти то, что искал. Предмет стоит перед глаголом с *را*: *کلیدم را پیدا کردم* — я нашёл свой ключ. Отрицание: *پیدا نکردم* (я не нашёл).'
    example_gloss: Я нашёл свой ключ.
  prs.a2.unit26.lesson06.teach.bad:
    title: Плохой
    gloss: плохой
    note: '*بد* значит «плохой». *چه بد!* — дружеская реакция на плохую новость, противоположность *چه خوب!*.'
    example_gloss: Как жаль!
  prs.a2.unit26.lesson06.teach.airport_turn01:
    title: Наимат спрашивает, почему Шакиба не поехала
    gloss: Шакиба, почему ты не поехала в Герат на прошлой неделе?
    note: Наимат задаёт вопрос с *چرا* и отрицательной формой простого прошедшего времени *نرفتی*. Они друзья, поэтому он говорит ей *تو*.
  prs.a2.unit26.lesson06.teach.airport_turn02:
    title: Шакиба объясняет причину
    gloss: Потому что я потеряла паспорт. Я не могла найти его до десяти часов.
    note: '*چون* («потому что») вводит причину, а причина — более раннее событие, поэтому используется предпрошедшее время: *گم کرده بودم*. *آن را* («его») указывает на паспорт.'
  prs.a2.unit26.lesson06.teach.airport_turn03:
    title: Наимат спрашивает, что было в аэропорту
    gloss: Когда ты приехала в аэропорт, что случилось?
    note: Точка отсчёта — *وقتی به میدان هوایی رسیدی* в простом прошедшем времени. *چه شد؟* спрашивает о том, что уже было к этому моменту.
  prs.a2.unit26.lesson06.teach.airport_turn04:
    title: Шакиба рассказывает, что увидела и что сделала
    gloss: Самолёт уже улетел. Потом я вернулась домой и позвонила по телефону.
    note: '*طیاره رفته بود* — более раннее событие, оно в предпрошедшем времени. После него идут два новых действия в простом прошедшем времени: *برگشتم* и *تیلفون کردم*.'
  prs.a2.unit26.lesson06.teach.airport_turn05:
    title: Наимат реагирует
    gloss: Какая жалость!
    note: '*چه بد!* — короткая дружеская реакция на плохую новость.'
exercises:
  prs.a2.unit26.lesson01.exercise01.recognize_plane_left:
    instruction: Что означает это предложение?
    correct_option: Самолёт уже улетел
    distractors:
    - Самолёт улетает
    - Самолёт улетит
    - Самолёт в аэропорту
    accepted_answers:
    - value: Самолёт уже улетел
      status: correct
    feedback: '*طیاره رفته بود* — «самолёт уже улетел»: причастие *رفته* плюс *بود*.'
  prs.a2.unit26.lesson01.exercise02.recognize_lost_passport:
    instruction: Что означает это предложение?
    correct_option: я уже потерял(а) свой паспорт
    distractors:
    - Я нашёл паспорт
    - Мой паспорт дома
    - Мне нужен паспорт
    accepted_answers:
    - value: я уже потерял(а) свой паспорт
      status: correct
    feedback: '*گم کرده بودم* — «я потерял (до того)»: причастие *گم کرده* плюс *بودم*.'
  prs.a2.unit26.lesson01.exercise03.recognize_we_arrived:
    instruction: Что означает это предложение?
    correct_option: Мы уже приехали
    distractors:
    - Они уже приехали
    - я уже прибыл(а)
    - Мы приезжаем каждый день
    accepted_answers:
    - value: Мы уже приехали
      status: correct
    feedback: 'Окончание *بودیم* означает «мы»: *ما رسیده بودیم* — «мы уже приехали».'
  prs.a2.unit26.lesson01.exercise04.match_form_and_words:
    instruction: Соедини каждое слово на дари с его значением.
    accepted_answers:
    - value:
        رفته بودم: я уже ушёл(ла)
        رفته بودی: ты уже ушёл(ла) (другу)
        رفته بود: он, она или оно уже ушли
        رفته بودیم: мы уже ушли
        رفته بودین: вы уже ушли (вежливо или мн. ч.)
        رفته بودند: они уже ушли
        طیاره: самолёт
        میدان هوایی: аэропорт
        ایستگاه: вокзал, станция
      status: correct
    feedback: 'Меняется только *بود-*: *بودم* — я, *بودی* — ты (друг), *بود* — он или она, *بودیم* — мы, *بودین* — вы (вежливо или мн. число), *بودند* — они.'
    pairs:
    - left: رفته بودم
      right: я уже ушёл(ла)
    - left: رفته بودی
      right: ты уже ушёл(ла) (другу)
    - left: رفته بود
      right: он, она или оно уже ушли
    - left: رفته بودیم
      right: мы уже ушли
    - left: رفته بودین
      right: вы уже ушли (вежливо или мн. ч.)
    - left: رفته بودند
      right: они уже ушли
    - left: طیاره
      right: самолёт
    - left: میدان هوایی
      right: аэропорт
    - left: ایستگاه
      right: вокзал, станция
  prs.a2.unit26.lesson01.exercise05.order_we_arrived_station:
    instruction: 'Расставь слова, чтобы получилось: Мы уже приехали на станцию.'
    accepted_answers:
    - value:
      - ما
      - به
      - ایستگاه
      - رسیده
      - بودیم
      status: correct
    feedback: В *ما به ایستگاه رسیده بودیم* причастие стоит первым, а *بودیم* — последним.
  prs.a2.unit26.lesson01.exercise06.translate_bus_left:
    instruction: 'Переведи на дари, используя предпрошедшее время глагола رفتن: Автобус уже ушёл.'
    accepted_answers:
    - value: بس رفته بود.
      status: correct
    - value: آن بس رفته بود.
      status: correct
    feedback: '*بس رفته بود* — «автобус уже ушёл». *آن* («тот») необязательно.'
  prs.a2.unit26.lesson02.exercise01.recognize_had_eaten:
    instruction: Что означает это предложение?
    correct_option: Я уже позавтракал
    distractors:
    - Я буду завтракать
    - Я завтракаю
    - Я не хочу завтракать
    accepted_answers:
    - value: Я уже позавтракал
      status: correct
    feedback: '*خورده بودم* — «я (уже) поел»: причастие *خورده* плюс *بودم*.'
  prs.a2.unit26.lesson02.exercise02.recognize_gate_closed:
    instruction: Что означает это предложение?
    correct_option: Ворота уже были закрыты
    distractors:
    - Ворота открыты
    - Ворота закроются завтра
    - Ворота в аэропорту
    accepted_answers:
    - value: Ворота уже были закрыты
      status: correct
    feedback: '*بسته شده بود* — предпрошедшее время от *بسته شدن*: ворота были закрыты.'
  prs.a2.unit26.lesson02.exercise03.match_participles:
    instruction: Соедини каждый глагол в предпрошедшем времени с его значением.
    accepted_answers:
    - value:
        رفته بود: он или она уже ушли
        خورده بود: он или она уже поели
        دیده بود: он или она уже видели
        رسیده بود: он или она уже прибыли
        آمده بود: он или она уже пришли
        کرده بود: он или она уже сделали
        برگشته بود: он или она уже вернулись
        گم کرده بود: он или она уже потеряли
        خراب شده بود: оно уже сломалось
      status: correct
    feedback: 'Все эти формы — причастие на *ه* плюс *بود*. У составных глаголов первое слово остаётся впереди: *گم کرده بود*, *خراب شده بود*.'
    pairs:
    - left: رفته بود
      right: он или она уже ушли
    - left: خورده بود
      right: он или она уже поели
    - left: دیده بود
      right: он или она уже видели
    - left: رسیده بود
      right: он или она уже прибыли
    - left: آمده بود
      right: он или она уже пришли
    - left: کرده بود
      right: он или она уже сделали
    - left: برگشته بود
      right: он или она уже вернулись
    - left: گم کرده بود
      right: он или она уже потеряли
    - left: خراب شده بود
      right: оно уже сломалось
  prs.a2.unit26.lesson02.exercise04.order_lost_key:
    instruction: 'Расставь слова, чтобы получилось: Я потерял свой ключ.'
    accepted_answers:
    - value:
      - کلیدم
      - را
      - گم
      - کرده
      - بودم
      status: correct
    feedback: В *کلیدم را گم کرده بودم* частица *را* стоит после потерянного предмета, а глагол — в конце.
  prs.a2.unit26.lesson02.exercise05.complete_gate:
    instruction: 'Закончи предложение: Ворота были закрыты.'
    accepted_answers:
    - value: بود
      status: correct
    feedback: '*بود* — прошедшее время от *بودن*. Вместе с *بسته شده* оно образует предпрошедшее время.'
  prs.a2.unit26.lesson02.exercise06.translate_car_broke_down:
    instruction: 'Переведи на дари, используя предпрошедшее время глагола خراب شدن: Моя машина сломалась.'
    accepted_answers:
    - value: موترم خراب شده بود.
      status: correct
    - value: موتر من خراب شده بود.
      status: correct
    feedback: '*موترم خراب شده بود* — «моя машина (уже) сломалась». *موتر من* — то же самое, но с явным местоимением.'
  prs.a2.unit26.lesson03.exercise01.which_first:
    instruction: Прочитай предложение. Что произошло раньше?
    correct_option: Автобус уже ушёл
    distractors:
    - я приехал(а)
    - Я пошёл домой
    - Я купил билет
    accepted_answers:
    - value: Автобус уже ушёл
      status: correct
    feedback: '*بس رفته بود* — более раннее событие, значит, автобус ушёл раньше. *وقتی رسیدم* — более поздняя точка отсчёта.'
  prs.a2.unit26.lesson03.exercise02.bus_left_after:
    instruction: Прочитай предложение. Какое утверждение верно?
    correct_option: Автобус ушёл после того, как я приехал
    distractors:
    - Автобус ушёл до того, как я приехал
    - Автобус так и не ушёл
    - Я не приехал
    accepted_answers:
    - value: Автобус ушёл после того, как я приехал
      status: correct
    feedback: 'Оба глагола в простом прошедшем времени, поэтому порядок событий совпадает с порядком слов: сначала *رسیدم*, потом *بس رفت*.'
  prs.a2.unit26.lesson03.exercise03.match_simple_perfect:
    instruction: Соотнеси каждый глагол на дари с его значением.
    accepted_answers:
    - value:
        رسیدم: я приехал(а)
        رسیده بودم: я уже прибыл(а)
        رفت: он, она или оно уехали
        رفته بود: он, она или оно уже уехали
        دیدم: я видел(а)
        دیده بودم: я уже видел(а)
        گم کردم: я потерял(а)
        گم کرده بودم: я уже потерял(а)
        نرفته بودم: я не ездил(а)
      status: correct
    feedback: Простое прошедшее время — это основа прошедшего времени плюс окончание. Предпрошедшее добавляет причастие и *بود-*, поэтому состоит из двух слов.
    pairs:
    - left: رسیدم
      right: я приехал(а)
    - left: رسیده بودم
      right: я уже прибыл(а)
    - left: رفت
      right: он, она или оно уехали
    - left: رفته بود
      right: он, она или оно уже уехали
    - left: دیدم
      right: я видел(а)
    - left: دیده بودم
      right: я уже видел(а)
    - left: گم کردم
      right: я потерял(а)
    - left: گم کرده بودم
      right: я уже потерял(а)
    - left: نرفته بودم
      right: я не ездил(а)
  prs.a2.unit26.lesson03.exercise04.order_plane_left:
    instruction: 'Расставь слова, чтобы получилось: Когда я приехал, самолёт уже улетел.'
    accepted_answers:
    - value:
      - وقتی
      - رسیدم
      - طیاره
      - رفته
      - بود
      status: correct
    - value:
      - طیاره
      - رفته
      - بود
      - وقتی
      - رسیدم
      status: correct
    feedback: '*وقتی رسیدم، طیاره رفته بود.* Приезд — точка отсчёта, а отлёт самолёта — более раннее событие. Две части предложения можно поменять местами.'
  prs.a2.unit26.lesson03.exercise05.complete_bus_left:
    instruction: 'Закончи предложение: Когда я приехал на станцию, автобус уже ушёл.'
    accepted_answers:
    - value: رفته
      status: correct
    feedback: '*رفته* — причастие от *رفتن*. Вместе с *بود* получается *رفته بود* — «ушёл (уже)».'
  prs.a2.unit26.lesson03.exercise06.translate_manager_left:
    instruction: 'Переведи на дари, используя предпрошедшее время глагола رفتن: Когда я приехал, директор уже ушёл.'
    accepted_answers:
    - value: وقتی رسیدم، مدیر رفته بود.
      status: correct
    - value: وقتی رسیدم مدیر رفته بود.
      status: correct
    - value: مدیر رفته بود، وقتی رسیدم.
      status: correct
    - value: مدیر رفته بود وقتی رسیدم.
      status: correct
    feedback: '*وقتی رسیدم، مدیر رفته بود.* — «когда я приехал, директор уже ушёл». Запятая необязательна, а части предложения можно поменять местами.'
  prs.a2.unit26.lesson04.exercise01.recognize_already_left:
    instruction: Что означает это предложение?
    correct_option: Автобус уже ушёл
    distractors:
    - Автобус сейчас уходит
    - Автобус ещё не ушёл
    - Автобус скоро уйдёт
    accepted_answers:
    - value: Автобус уже ушёл
      status: correct
    feedback: '*از قبل* значит «уже». *بس از قبل رفته بود* — «автобус уже ушёл».'
  prs.a2.unit26.lesson04.exercise02.recognize_not_yet:
    instruction: Что означает это предложение?
    correct_option: Он ещё не пришёл
    distractors:
    - Он уже пришёл
    - Он не хотел приходить
    - Он пришёл вчера
    accepted_answers:
    - value: Он ещё не пришёл
      status: correct
    feedback: '*هنوز* с отрицательным *نیامده بود* значит «ещё не»: он ещё не пришёл.'
  prs.a2.unit26.lesson04.exercise03.order_before_arrive:
    instruction: 'Расставь слова, чтобы получилось: До того как я приехал, самолёт уже улетел.'
    accepted_answers:
    - value:
      - قبل
      - از
      - اینکه
      - من
      - برسم
      - طیاره
      - رفته
      - بود
      status: correct
    - value:
      - طیاره
      - رفته
      - بود
      - قبل
      - از
      - اینکه
      - من
      - برسم
      status: correct
    feedback: '*قبل از اینکه من برسم، طیاره رفته بود.* После *قبل از اینکه* глагол стоит в форме *برسم*, а в главной части — предпрошедшее время.'
  prs.a2.unit26.lesson04.exercise04.complete_already:
    instruction: 'Закончи предложение: Я уже позавтракал.'
    accepted_answers:
    - value: خورده
      status: correct
    feedback: '*خورده* — причастие от *خوردن*. *قبلاً صبحانه خورده بودم* — «я уже позавтракал».'
  prs.a2.unit26.lesson04.exercise05.answer_what_happened:
    instruction: 'Друг спрашивает: وقتی به ایستگاه رسیدی، چه شد؟ (Когда ты приехал на станцию, что случилось?) Ответь на дари в предпрошедшем времени: Автобус уже ушёл.'
    accepted_answers:
    - value: بس از قبل رفته بود.
      status: correct
    - value: بس قبلاً رفته بود.
      status: correct
    - value: بس رفته بود.
      status: correct
    - value: وقتی رسیدم، بس از قبل رفته بود.
      status: correct
    - value: وقتی رسیدم، بس قبلاً رفته بود.
      status: correct
    - value: وقتی رسیدم، بس رفته بود.
      status: correct
    feedback: '*بس از قبل رفته بود.* — «автобус уже ушёл». Верны также варианты с *قبلاً* вместо *از قبل* и вообще без слова со значением «уже».'
  prs.a2.unit26.lesson04.exercise06.write_friend_not_yet:
    instruction: 'Напиши на дари, используя هنوز и отрицательное предпрошедшее время глагола آمدن: Когда я приехал, мой друг ещё не пришёл.'
    accepted_answers:
    - value: وقتی رسیدم، دوستم هنوز نیامده بود.
      status: correct
    - value: وقتی رسیدم دوستم هنوز نیامده بود.
      status: correct
