  description: 'Кабульский дари для начинающих: уважительное повседневное общение.'
units:
  prs.a1.unit03.family:
    title: Семья и родственники
lessons:
  prs.a1.unit03.lesson01.immediate_family:
    title: Члены ближайшей семьи
  prs.a1.unit03.lesson02.extended_family:
    title: Родственники по материнской и отцовской линии
  prs.a1.unit03.lesson03.family_size:
    title: Сколько человек в твоей семье?
  prs.a1.unit03.lesson04.ask_about_family:
    title: Расспроси о семье другого человека
  prs.a1.unit03.lesson05.marital_status:
