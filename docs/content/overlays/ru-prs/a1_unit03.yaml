  prs.a1.unit03.lesson06.family_dialogue:
    title: Разговор о семье Фереште
teaching:
  prs.a1.unit03.lesson01.teach.mother:
    title: Мать
    gloss: мать
    note: مادر — нейтральное слово для обозначения матери в дари.
    example_gloss: Моя мама добрая.
  prs.a1.unit03.lesson01.teach.father:
    title: Отец
    gloss: отец
    note: پدر — нейтральное слово для обозначения отца в дари.
    example_gloss: Мой папа — врач.
  prs.a1.unit03.lesson01.teach.brother:
    title: Брат
    gloss: брат
    note: برادر означает «брат».
    example_gloss: У меня есть один брат.
  prs.a1.unit03.lesson01.teach.sister:
    title: Сестра
    gloss: сестра
    note: خواهر означает «сестра».
    example_gloss: Моя сестра — учительница.
  prs.a1.unit03.lesson01.teach.parents:
    title: Родители
    gloss: отец и мать; родители
    note: Говоря о своих родителях, на дари обычно употребляют پدر و مادر.
    example_gloss: Мои родители живут в Кабуле.
  prs.a1.unit03.lesson01.teach.my_mother:
    title: Скажи, кто твоя мама
    gloss: Это моя мама.
    note: Окончание ـم в слове مادرم означает «мой/моя».
  prs.a1.unit03.lesson02.teach.grandfather:
    title: Дедушка
    gloss: дедушка
    note: پدرکلان — обычное слово для деда в афганском дари; буквально «большой, старший отец».
    example_gloss: Мой дедушка старый.
  prs.a1.unit03.lesson02.teach.grandmother:
    title: Бабушка
    gloss: бабушка
    note: مادرکلان — обычное слово для бабушки в афганском дари; буквально «большая, старшая мать».
    example_gloss: Моя бабушка добрая.
  prs.a1.unit03.lesson02.teach.paternal_uncle:
    title: Брат отца
    gloss: дядя по отцу
    note: کاکا обозначает именно брата твоего отца.
    example_gloss: Мой дядя живёт в Герате.
  prs.a1.unit03.lesson02.teach.paternal_aunt:
    title: Сестра отца
    gloss: тётя по отцу
    note: عمه обозначает именно сестру твоего отца.
    example_gloss: Моя тётя — учительница.
  prs.a1.unit03.lesson02.teach.maternal_uncle:
    title: Брат матери
    gloss: дядя по матери
    note: ماما в дари обозначает именно брата твоей матери.
    example_gloss: Мой дядя (брат матери) — инженер.
  prs.a1.unit03.lesson02.teach.maternal_aunt:
    title: Сестра матери
    gloss: тётя по матери
    note: خاله обозначает именно сестру твоей матери.
    example_gloss: Моя тётя (сестра матери) живёт в Кабуле.
  prs.a1.unit03.lesson02.teach.side_distinction:
    title: Различай две линии родства
    gloss: Кака и амма — родственники по отцу; мама и хала — по матери.
    note: В русском слова «дядя» и «тётя» не показывают, с какой стороны родство, а в дари для этого есть четыре разных слова.
  prs.a1.unit03.lesson03.teach.family:
    title: Семья
    gloss: семья
    note: فامیل — обычное слово для «семьи» в афганском дари.
    example_gloss: Моя семья большая.
  prs.a1.unit03.lesson03.teach.how_many_people:
    title: Вежливо спроси, сколько человек в семье
    gloss: Сколько человек в вашей семье?
    note: ـتان обозначает вежливое «ваш»; نفر — счётное слово для людей.
  prs.a1.unit03.lesson03.teach.five_people:
    title: Назови размер семьи
    gloss: В нашей семье пять человек.
    note: На дари состав семьи называют числом людей с نفر است.
  prs.a1.unit03.lesson03.teach.have_siblings:
    title: Посчитай братьев и сестёр
    gloss: У меня один брат и две сестры.
    note: دارم означает «у меня есть». После числительного существительное остаётся в единственном числе.
  prs.a1.unit03.lesson03.teach.only_child:
    title: Единственный ребёнок
    gloss: Я единственный ребёнок в семье.
    note: استم — форма первого лица в кабульском дари, которая изучается в этом курсе.
  prs.a1.unit03.lesson03.teach.possession:
    title: Формы глагола «иметь»
    gloss: у меня есть; у нас есть; у вас есть
    note: دارین — вежливая форма или форма множественного числа «у вас есть» в образованной разговорной речи Кабула.
  prs.a1.unit03.lesson04.teach.have_siblings_question:
    title: Спросить о братьях и сёстрах
    gloss: У вас есть братья и сёстры?
    note: Форма دارین делает вопрос вежливым или обращённым к нескольким людям.
  prs.a1.unit03.lesson04.teach.how_many_siblings:
    title: Спросить, сколько братьев и сестёр
    gloss: Сколько у вас братьев и сестёр?
    note: چند спрашивает «сколько».
  prs.a1.unit03.lesson04.teach.parents_well:
    title: Спроси о здоровье родителей собеседника
    gloss: Ваши родители здоровы?
    note: جور استند — привычный афганский способ сказать «у них всё хорошо».
  prs.a1.unit03.lesson04.teach.yes_answer:
    title: Утвердительный ответ
    gloss: Да, у меня один брат.
    note: بلی — вежливое стандартное «да», принятое в Афганистане.
  prs.a1.unit03.lesson04.teach.no_answer:
    title: Отрицательный ответ
    gloss: Нет, сестры у меня нет.
    note: نخیر — вежливое «нет»; ندارم означает «у меня нет».
  prs.a1.unit03.lesson04.teach.polite_your:
    title: Вежливое «ваш»
    gloss: твоя семья; твоя мама; твой отец
    note: Притяжательное окончание ـتان выражает уважение или множественное число. В этом курсе оно присоединяется через ZWNJ (нулевой соединитель).
  prs.a1.unit03.lesson05.teach.married:
    title: Женат / замужем
    gloss: женат / замужем
    note: متأهل — нейтральное слово для обозначения семейного положения.
    example_gloss: Он женат. / Она замужем.
  prs.a1.unit03.lesson05.teach.single:
    title: Холост
    gloss: холостой; не состоящий в браке
    note: В этом контексте مجرد означает «не состоящий в браке».
    example_gloss: Я не женат. / Я не замужем.
  prs.a1.unit03.lesson05.teach.husband:
    title: Муж
    gloss: муж
    note: شوهر — обычное слово для обозначения мужа.
    example_gloss: Мой муж — инженер.
  prs.a1.unit03.lesson05.teach.wife:
    title: Жена
    gloss: жена
    note: خانم может означать «жена» или вежливое обращение к женщине; значение определяется по контексту.
    example_gloss: Моя жена — учительница.
  prs.a1.unit03.lesson05.teach.marriage_question:
    title: Вежливо спросить о браке
    gloss: Вы женаты? / Вы замужем?
    note: Буквально это вопрос «Вы вступили в брак?». Окончание ـین — вежливая кабульская форма.
  prs.a1.unit03.lesson05.teach.married_answer:
    title: Сказать, что вы состоите в браке
    gloss: Да, я женат. / Да, я замужем.
    note: استم — связка 1-го лица в афганском дари, используемая здесь.
  prs.a1.unit03.lesson05.teach.children:
    title: Спросить о детях
    gloss: У тебя есть дети?
    note: اولاد — распространённое собирательное слово для обозначения ребёнка или детей.
  prs.a1.unit03.lesson06.teach.turn01:
    title: Марьям спрашивает о составе семьи
    gloss: Сколько человек в вашей семье?
    note: Марьям использует вежливое ـتان.
  prs.a1.unit03.lesson06.teach.turn02:
    title: Фереште рассказывает о своих братьях и сёстрах
    gloss: Нас пять человек. У меня один брат и одна сестра.
    note: Членов семьи считают со словом نفر.
  prs.a1.unit03.lesson06.teach.turn03:
    title: Марьям спрашивает о браке
    gloss: Вы замужем?
    note: Вопрос по форме вежливый и нейтральный.
  prs.a1.unit03.lesson06.teach.turn04:
    title: Фереште рассказывает о своём муже
    gloss: Да, я замужем. Мой муж — студент университета.
    note: Для слова «студент» здесь используется устоявшееся афганское слово محصل, а не иранское دانشجو.
  prs.a1.unit03.lesson06.teach.turn05:
    title: Марьям спрашивает о детях
    gloss: У тебя есть дети?
    note: دارین сохраняет вежливое обращение.
  prs.a1.unit03.lesson06.teach.turn06:
    title: Фереште отвечает
    gloss: Нет, у нас пока нет детей.
    note: نخیر — вежливое «нет»; نداریم означает «у нас нет».
exercises:
  prs.a1.unit03.lesson01.exercise01.recognize_mother:
    instruction: Выбери значение слова مادر.
    correct_option: мать
    distractors:
    - отец
    - брат
    - сестра
    accepted_answers:
    - value: мать
      status: correct
    feedback: مادر означает «мать».
  prs.a1.unit03.lesson01.exercise02.recognize_siblings:
    instruction: Какая пара означает «брат и сестра»?
    correct_option: برادر و خواهر
    distractors:
    - پدر و مادر
    - کاکا و عمه
    - ماما و خاله
    accepted_answers:
    - value: برادر و خواهر
      status: correct
    feedback: برادر и خواهر — это «брат» и «сестра».
  prs.a1.unit03.lesson01.exercise03.match_immediate:
    instruction: Соедини каждое слово о близких родственниках с его значением.
    accepted_answers:
    - value:
        مادر: мать
        پدر: отец
        برادر: брат
        خواهر: сестра
      status: correct
    feedback: Это четыре слова о близких родственниках, которые вводятся здесь.
    pairs:
    - left: مادر
      right: мать
    - left: پدر
      right: отец
    - left: برادر
      right: брат
    - left: خواهر
      right: сестра
  prs.a1.unit03.lesson01.exercise04.order_parents:
    instruction: Расположи слова так, чтобы получилось выражение на дари со значением «родители».
    accepted_answers:
    - value:
      - پدر
      - و
      - مادر
      status: correct
    feedback: پدر و مادر буквально значит «отец и мать».
  prs.a1.unit03.lesson01.exercise05.translate_this_is_mother:
    instruction: 'Переведи на дари: Это моя мама.'
    accepted_answers:
    - value: این مادرم است
      status: correct
    - value: این مادر من است
      status: correct
    feedback: این مادرم است означает «Это моя мама».
    prompt_blocks:
    - Это моя мама.
  prs.a1.unit03.lesson01.exercise06.translate_sister:
    instruction: 'Переведи на дари: Это моя сестра.'
    accepted_answers:
    - value: این خواهرم است
      status: correct
    - value: این خواهر من است
      status: correct
    feedback: Притяжательное окончание в خواهرم означает «мой».
  prs.a1.unit03.lesson01.exercise07.speak_family_member:
    instruction: Покажи на фотографии брата или сестру и назови этого человека на дари.
    accepted_answers:
    - value: این برادرم است
      status: correct
    - value: این خواهرم است
      status: correct
    - value: این برادر من است
      status: correct
    - value: این خواهر من است
      status: correct
    feedback: Используй این, название родства с окончанием «мой» и است.
  prs.a1.unit03.lesson02.exercise01.recognize_grandparents:
    instruction: Выбери значение слова پدرکلان.
    correct_option: дедушка
    distractors:
    - бабушка
    - отец
    - дядя по отцу
    accepted_answers:
    - value: дедушка
      status: correct
    feedback: В афганском дари پدرکلان означает «дедушка».
  prs.a1.unit03.lesson02.exercise02.recognize_maternal_uncle:
    instruction: Какого родственника обозначает ماما?
    correct_option: брат матери
    distractors:
    - брат отца
    - сестра матери
    - сестра отца
    accepted_answers:
    - value: брат матери
      status: correct
    feedback: ماما — именно дядя со стороны матери.
  prs.a1.unit03.lesson02.exercise03.match_sides:
    instruction: Соедини каждое слово с его значением.
    accepted_answers:
    - value:
        کاکا: брат отца
        عمه: сестра отца
        ماما: брат матери
        خاله: сестра матери
        مادر: мать
        پدر: отец
        برادر: брат
        خواهر: сестра
      status: correct
    feedback: В дари различается, с какой стороны, отцовской или материнской, тётя или дядя; последние четыре слова повторяют близких родственников из первого урока.
    pairs:
    - left: کاکا
      right: брат отца
    - left: عمه
      right: сестра отца
    - left: ماما
      right: брат матери
    - left: خاله
      right: сестра матери
    - left: مادر
      right: мать
    - left: پدر
      right: отец
    - left: برادر
      right: брат
    - left: خواهر
      right: сестра
  prs.a1.unit03.lesson02.exercise04.order_grandmother:
    instruction: 'Расположи слова: Это моя бабушка.'
    accepted_answers:
    - value:
      - این
      - مادرکلان
      - من
      - است
      status: correct
    feedback: مادرکلان من означает «моя бабушка».
  prs.a1.unit03.lesson02.exercise05.complete_uncle:
    instruction: 'Закончи предложение: Брат моей матери — мой дядя по матери.'
    accepted_answers:
    - value: مامایم
      status: correct
    - value: ماما
      status: correct
    feedback: مامایم означает «мой дядя по матери».
  prs.a1.unit03.lesson02.exercise06.translate_paternal_aunt:
    instruction: 'Переведи на дари: Она моя тётя по отцу.'
    accepted_answers:
    - value: او عمه‌ام است
      status: correct
    - value: او عمه ام است
      status: acceptable_with_note
      note: Допускается написание с пробелом при вводе с клавиатуры; в стандартной орфографии используется ZWNJ.
    - value: او عمهٔ من است
      status: correct
    feedback: عمه означает сестру отца.
  prs.a1.unit03.lesson02.exercise07.speak_distinction:
    instruction: 'Объясни родство, не называя конкретного человека: скажи, что کاکا — это брат твоего отца, а ماما — брат твоей матери.'
    accepted_answers:
    - value: کاکایم برادر پدرم است. مامایم برادر مادرم است.
      status: correct
    - value: کاکایم برادر پدرم است و مامایم برادر مادرم است
      status: correct
    feedback: کاکا — родственник со стороны отца; ماما — со стороны матери.
  prs.a1.unit03.lesson03.exercise01.recognize_size:
    instruction: Сколько человек в этой семье?
    correct_option: пять
    distractors:
    - четыре
    - шесть
    - семь
    accepted_answers:
    - value: пять
      status: correct
    feedback: پنج نفر означает «пять человек».
  prs.a1.unit03.lesson03.exercise02.recognize_only_child:
    instruction: Выбери значение фразы من تک‌فرزند استم.
    correct_option: Я единственный ребёнок в семье.
    distractors:
    - У меня один ребёнок.
    - У меня один брат.
    - Мы одна семья.
    accepted_answers:
    - value: Я единственный ребёнок в семье.
      status: correct
    feedback: تک‌فرزند означает «единственный ребёнок».
  prs.a1.unit03.lesson03.exercise03.match_have_forms:
    instruction: Соедини каждое слово или фразу с её значением.
    accepted_answers:
    - value:
        دارم: у меня есть
        داریم: у нас есть
        دارین: у вас есть (вежливо)
        فامیل: семья
        تک‌فرزند: единственный ребёнок
        یک برادر و دو خواهر دارم: У меня один брат и две сестры.
      status: correct
    feedback: Окончания различают «я», «мы» и вежливое или множественное «вы»; последние три слова показывают лексику о семье и دارم в целом предложении, всё из этого же урока.
    pairs:
    - left: دارم
      right: у меня есть
    - left: داریم
      right: у нас есть
    - left: دارین
      right: у вас есть (вежливо)
    - left: فامیل
      right: семья
    - left: تک‌فرزند
      right: единственный ребёнок
    - left: یک برادر و دو خواهر دارم
      right: У меня один брат и две сестры.
  prs.a1.unit03.lesson03.exercise04.order_size:
    instruction: 'Расположи слова: В нашей семье шесть человек.'
    accepted_answers:
    - value:
      - فامیل
      - ما
      - شش
      - نفر
      - است
      status: correct
    feedback: فامیل ما شش نفر است указывает, что в семье шесть человек.
  prs.a1.unit03.lesson03.exercise05.complete_siblings:
    instruction: 'Закончи предложение: У меня один брат.'
    accepted_answers:
    - value: دارم
      status: correct
    feedback: دارم означает «у меня есть».
  prs.a1.unit03.lesson03.exercise06.translate_size:
