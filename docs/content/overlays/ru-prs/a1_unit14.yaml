course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: говорим о том, что нравится и не нравится, спрашиваем о предпочтениях, выбираем из двух вариантов, называем простые причины; в конце — короткий текст и диалог о предпочтениях двух людей.'
units:
  prs.a1.unit14.preferences:
    title: Предпочтения
    description: Учимся говорить и спрашивать о том, что нравится и не нравится, и называть простые причины.
lessons:
  prs.a1.unit14.lesson01.basic_likes:
    title: Простые «нравится» и «не нравится»
  prs.a1.unit14.lesson02.asking_preferences:
    title: Спрашиваем о предпочтениях
  prs.a1.unit14.lesson03.choosing_between_options:
    title: Выбор из двух вариантов
  prs.a1.unit14.lesson04.giving_reasons:
    title: Называем причину
  prs.a1.unit14.lesson05.reading_about_preferences:
    title: Читаем о предпочтениях
  prs.a1.unit14.lesson06.preferences_dialogue:
    title: Диалог о предпочтениях
teaching:
  prs.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: Мне нравится
    gloss: я люблю
    note: دوست دارم буквально значит «у меня есть дружба (с этим)» — это обычный способ сказать «мне нравится».
  prs.a1.unit14.lesson01.teach.qahwa_word:
    title: Кофе
    gloss: кофе
    note: قهوه означает «кофе».
    example_gloss: Мне нравится кофе.
  prs.a1.unit14.lesson01.teach.chai_word:
    title: Чай
    gloss: чай
    note: چای означает «чай».
    example_gloss: Я не люблю чай.
  prs.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: Мне не нравится
    gloss: мне не нравится
    note: دوست ندارم — отрицательная форма к دوست دارم.
  prs.a1.unit14.lesson01.teach.man_word:
    title: Я
    gloss: я
    note: من — отдельное местоимение первого лица, «я».
    example_gloss: Мне нравится кофе.
  prs.a1.unit14.lesson01.teach.ra_word:
    title: (показатель прямого дополнения)
    gloss: (отмечает прямое дополнение)
    note: را отмечает определённое прямое дополнение. В дари оно используется и в устной речи, и на письме; иранское رو не употребляется.
    target_text: را (показатель прямого дополнения)
  prs.a1.unit14.lesson02.teach.kodam_word:
    title: Какой
    gloss: какой
    note: کدام означает «какой (из)».
    example_gloss: Какой тебе нравится?
  prs.a1.unit14.lesson02.teach.moosiqi_word:
    title: Музыка
    gloss: музыка
    note: موسیقی означает «музыка».
    example_gloss: Я люблю музыку.
  prs.a1.unit14.lesson02.teach.darid_grammar:
    title: У вас есть / вам нравится (вежливо)
    gloss: у вас есть / вам нравится
    note: دارین — вежливая форма (или форма множественного числа) 2-го лица от داشتن («иметь»), в согласии с вежливым регистром курса استم/استین.
    target_text: دارین (у вас есть / вам нравится, вежливая форма)
  prs.a1.unit14.lesson02.teach.kodam_ra_question:
    title: Какой тебе нравится?
    gloss: Какой тебе нравится?
    note: کدام را دوست دارین؟ — را отмечает дополнение, здесь то, что ты выбираешь.
  prs.a1.unit14.lesson03.teach.bishtar_word:
    title: Больше
    gloss: больше
    note: بیشتر означает «больше».
    example_gloss: Кофе я люблю больше.
  prs.a1.unit14.lesson03.teach.ya_word:
    title: Или
    gloss: или
    note: یا означает «или» и предлагает выбор из двух вариантов.
    target_text: یا (или)
  prs.a1.unit14.lesson03.teach.qahwa_ya_chai_question:
    title: Кофе или чай?
    gloss: Кофе или чай?
    note: قهوه یا چای؟ предлагает выбрать один из двух напитков, изученных в первом уроке.
  prs.a1.unit14.lesson04.teach.choon_word:
    title: Потому что
    gloss: потому что
    note: چون вводит причину.
    target_text: چون (потому что)
  prs.a1.unit14.lesson04.teach.khoshmaza_ast_word:
    title: Это вкусно
    gloss: вкусно
    note: 'خوش‌مزه است — полная, нестянутая форма («это вкусно»): в этом курсе است пишется отдельно и не сливается со словом.'
    example_gloss: Я люблю кофе, потому что он вкусный.
  prs.a1.unit14.lesson04.teach.jaleb_ast_word:
    title: Это интересно
    gloss: интересно
    note: جالب است — полная, нестянутая форма («это интересно»).
    example_gloss: Я люблю музыку, потому что она интересная.
  prs.a1.unit14.lesson04.teach.va_word:
    title: И
    gloss: и
    note: و означает «и» и соединяет две части предложения или два элемента.
    target_text: و (и)
  prs.a1.unit14.lesson05.teach.negar_name:
    title: Негар
    gloss: Негар
    note: Распространённое афганское женское имя.
    example_gloss: Негар любит чай.
  prs.a1.unit14.lesson05.teach.darad_grammar:
    title: Ему/ей нравится
    gloss: ему/ей нравится
    note: دارد — полная форма 3-го лица от داشتن («иметь»); دوست دارد значит «ему/ей нравится», как دوست دارم в первом лице.
    target_text: دوست دارد (ему/ей нравится, полная форма 3-го лица)
  prs.a1.unit14.lesson05.teach.nadarad_grammar:
    title: Ему/ей не нравится
    gloss: ему/ей не нравится
    note: ندارد — полная отрицательная форма 3-го лица; دوست ندارد значит «ему/ей не нравится».
    target_text: دوست ندارد (ему/ей не нравится, полная форма 3-го лица)
  prs.a1.unit14.lesson05.teach.garm_ast_word:
    title: Это тёплое
    gloss: тёплый
    note: گرم است — полная, нестянутая форма («это тёплое»).
    example_gloss: Негар любит чай, потому что он тёплый.
  prs.a1.unit14.lesson05.teach.reading_text:
    title: Пример текста о предпочтениях
    gloss: Негар любит чай, потому что он тёплый. Негар не любит музыку.
    note: Короткий рассказ о третьем лице с лексикой этого урока о предпочтениях.
  prs.a1.unit14.lesson06.teach.names:
    title: Карим и Негар
    gloss: Карим, Негар
    note: Распространённые афганские имена, которые встречаются на протяжении всего курса.
    example_gloss:
    - Я Карим.
    - Я Негар.
  prs.a1.unit14.lesson06.teach.shoma_chetor_phrase:
    title: А вы?
    gloss: А вы?
    note: شما چطور؟ — вежливый способ вернуть вопрос собеседнику, с обращением на «вы».
  prs.a1.unit14.lesson06.teach.aali_ast_word:
    title: Это здорово
    gloss: это здорово
    note: عالی است — полная форма без сокращения («это замечательно»).
    example_gloss: Кофе замечательный.
  prs.a1.unit14.lesson06.teach.dialogue_line1:
    title: Карим спрашивает
    gloss: Чай или кофе — что вы больше любите?
  prs.a1.unit14.lesson06.teach.dialogue_line2:
    title: Ответ Негар
    gloss: Я больше люблю кофе, потому что он вкусный. А вы?
  prs.a1.unit14.lesson06.teach.dialogue_line3:
    title: Карим отвечает
    gloss: Я люблю чай, потому что он тёплый.
  prs.a1.unit14.lesson06.teach.dialogue_line4:
    title: Реакция Негар
    gloss: Здорово!
