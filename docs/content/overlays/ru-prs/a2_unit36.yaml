teaching:
  prs.a2.unit36.lesson01.errands_and_for.teach.friends:
    title: Фарузан и Ариф
    gloss: Это Фарузан. Это Ариф. Они друзья.
    note: '*فروزان* и *عارف* — двое друзей, которые встречаются в диалогах и примерах этого раздела. Фарузан — женщина, Ариф — мужчина.'
  prs.a2.unit36.lesson01.errands_and_for.teach.post:
    title: Почта
    gloss: почта
    note: '*پُسته خانه* — это почта (почтовое отделение). Туда ходят, чтобы отправить письмо или посылку.'
    example_gloss: Почта рядом.
  prs.a2.unit36.lesson01.errands_and_for.teach.letter:
    title: Письмо
    gloss: письмо
    note: '*نامه* — это письмо. Письмо отправляют с *را*: *نامه را می‌فرستم*.'
    example_gloss: Письмо на почте.
  prs.a2.unit36.lesson01.errands_and_for.teach.bank:
    title: Банк
    gloss: банк
    note: '*بانک* — это банк. Туда ходят, чтобы снять деньги (*پول*) или положить деньги на счёт.'
    example_gloss: Банк на рынке.
  prs.a2.unit36.lesson01.errands_and_for.teach.send:
    title: Отправлять
    gloss: отправлять
    note: '*فرستادن* — это «отправлять». Это также инфинитив, который ставится после *برای*: *برای فرستادن نامه* — чтобы отправить письмо.'
    example_gloss: Отправить письмо легко.
  prs.a2.unit36.lesson01.errands_and_for.teach.shopping:
    title: Покупки
    gloss: покупки
    note: '*خرید* — это покупки, то, что ты покупаешь. *خرید دارم* означает «мне нужно сделать покупки».'
    example_gloss: Сегодня у меня много покупок.
  prs.a2.unit36.lesson01.errands_and_for.teach.for_noun:
    title: 'برای + существительное: для чего ты что-то делаешь'
    gloss: Я иду на рынок за покупками. Я приезжаю в Кабул по работе. Я иду домой отдохнуть.
    note: 'Поставь *برای* перед существительным, чтобы сказать, для чего ты что-то делаешь: *برای خرید* (за покупками), *برای کار* (по работе), *برای استراحت* (отдохнуть). Место по-прежнему оформляется с *به*: *به بازار می‌روم*. В русском цель выражается по-разному: предлогами «за», «по», «для», а в дари перед существительным всегда стоит *برای*.'
  prs.a2.unit36.lesson01.errands_and_for.teach.for_inf:
    title: 'برای + инфинитив: чтобы что-то сделать'
    gloss: Чтобы отправить письмо, я иду на почту. Чтобы купить хлеб, я иду в лавку. Чтобы получить деньги, я иду в банк.
    note: 'Чтобы сказать, ради какого действия ты что-то делаешь, поставь инфинитив после *برای*: *فرستادن* (отправить), *خریدن* (купить), *گرفتن* (взять, получить). Инфинитив оканчивается на *ن*. То, что отправляют, покупают или берут, стоит после инфинитива: *فرستادن نامه*, *خریدن نان*, *گرفتن پول*.'
  prs.a2.unit36.lesson01.errands_and_for.teach.order_question:
    title: Цель может стоять в конце; вопрос «зачем»
    gloss: Я иду в банк, чтобы получить деньги. Зачем ты идёшь в банк?
    note: 'Цель может стоять и в конце: *به بانک می‌روم برای گرفتن پول*. Чтобы спросить «зачем», скажи *برای چه؟*: *برای چه به بانک می‌روی؟* — «зачем ты идёшь в банк?». Отвечают с *برای* и существительным или инфинитивом.'
  prs.a2.unit36.lesson01.errands_and_for.teach.sentence:
    title: Чтобы отправить письмо, я иду на почту
    gloss: Чтобы отправить письмо, я иду на почту.
    note: 'Это модель первого урока: сначала *برای* + инфинитив, затем место с *به*, а глагол в конце.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.subj_form:
    title: 'Сослагательная форма: ب + основа настоящего времени + окончание'
    gloss: чтобы я купил, чтобы я пошёл, чтобы я взял, чтобы я отправил, чтобы я прочитал, чтобы я увидел, чтобы я пришёл, чтобы я принёс
    note: 'Сослагательная форма — это форма глагола, которая ставится после *برای اینکه* и *تا*. Она образуется от основы настоящего времени: впереди добавляется *ب-*, затем личное окончание. Для «я» окончание *-م*: *بخرم* (чтобы я купил), *بروم* (чтобы я пошёл), *بگیرم* (чтобы я взял). Это та же форма, что ты уже знаешь по *می‌خواهم بروم* и *باید بیایم*. Две формы пишутся иначе, их лучше запомнить: *بیایم* (от *آمدن*) и *بیاورم* (от *آوردن*).'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.subj_paradigm:
    title: Шесть лиц сослагательной формы
    gloss: чтобы я купил, чтобы ты купил, чтобы он или она купил(а), чтобы мы купили, чтобы вы купили (вежливо или мн. число), чтобы они купили
    note: 'Окончания: *-م، -ی، -د، -یم، -ین، -ند*. Окончание для «вы» (вежливо или мн. число) — *-ین*, как и везде в этом курсе. В сослагательной форме нет *می‌*: сравни *می‌خرم* (я покупаю) и *بخرم* (чтобы я купил).'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.for_that:
    title: 'برای اینکه + сослагательная форма: чтобы я что-то сделал'
    gloss: Чтобы купить хлеб, я иду в лавку. Чтобы получить деньги, я иду в банк.
    note: '*برای اینکه* означает «для того чтобы». Оно начинает придаточную часть со своим глаголом в сослагательной форме, и глагол показывает лицо: *برای اینکه نان بخرم* — «чтобы я купил хлеб». Главная часть говорит, что ты делаешь. Как и в русском «чтобы я купил», в дари глагол изменяется по лицу. Части можно поменять местами: *به دوکان می‌روم برای اینکه نان بخرم*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.more_verbs:
    title: Ещё примеры и составные глаголы
    gloss: Чтобы отправить письмо, я иду на почту. Чтобы увидеть друга, я еду в Кабул. Чтобы сэкономить, я хожу пешком.
    note: 'Правило одинаково для всех глаголов. У составного глагола, например *پس‌انداز کردن*, меняется только глагольная часть, и *ب-* нет: *پس‌انداز کنم* (чтобы я сэкономил), *کار کنم* (чтобы я работал). То, что ты видишь или берёшь, ставится с *را* перед глаголом: *دوستم را ببینم*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.sentence:
    title: Чтобы купить хлеб, я иду в лавку
    gloss: Чтобы купить хлеб, я иду в лавку.
    note: 'Сравни с первым уроком: *برای خریدن نان* (инфинитив) и *برای اینکه نان بخرم* (придаточная часть с сослагательной формой) говорят одно и то же.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.ta:
    title: 'تا + сослагательная форма: краткий вариант'
    gloss: Я иду в лавку, чтобы купить хлеб. Я иду в банк, чтобы получить деньги. Я иду на почту, чтобы отправить письмо.
    note: '*تا* — краткая форма *برای اینکه*. Оно стоит после главной части, а за ним идёт глагол в сослагательной форме: *به دوکان می‌روم تا نان بخرم*. У *تا* есть и другие значения, например «до» в *تا ساعت ده*. Если следом идёт глагол в сослагательной форме с *ب-*, оно значит «чтобы».'
  prs.a2.unit36.lesson03.ta_and_negative.teach.persons:
    title: 'Другие лица: мы, он, они'
    gloss: Мы идём, чтобы купить хлеб. Он идёт, чтобы отправить письмо. Они идут, чтобы получить деньги.
    note: 'Когда подлежащее одно и то же, оба глагола стоят в одном лице: *می‌رویم* и *بخریم* оба оканчиваются на *-یم* (мы). Окончания сослагательной формы: *-م، -ی، -د، -یم، -ین، -ند*, поэтому *بفرستد* — «чтобы он или она отправил(а)», а *بگیرند* — «чтобы они взяли».'
  prs.a2.unit36.lesson03.ta_and_negative.teach.negative:
    title: 'Отрицание: ن + основа'
    gloss: Я выхожу пораньше, чтобы не опоздать. Чтобы не опоздать, я выхожу пораньше.
    note: 'Чтобы сказать, чего ты хочешь избежать, поставь *ن-* перед основой и убери *ب-*: *برسم* (чтобы я пришёл) превращается в *نرسم* (чтобы я не пришёл). Главная часть говорит, что ты делаешь, чтобы этого избежать: *زود می‌روم*.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.negative_two_word:
    title: Отрицание составных глаголов
    gloss: Я кладу деньги в банк, чтобы не потерять их.
    note: 'У составного глагола *ن-* ставится на глагольную часть: *گم کنم* (чтобы я потерял) превращается в *گم نکنم* (чтобы я не потерял). *آن را* («его», «их») указывает на деньги.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.sentence:
    title: Я выхожу пораньше, чтобы не опоздать
    gloss: Я выхожу пораньше, чтобы не опоздать.
    note: '*تا دیر نرسم* называет то, чего ты не хочешь, а *زود می‌روم* — что ты для этого делаешь.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.lesson:
    title: Урок, учёба
    gloss: урок, занятие
    note: '*درس* — это урок или занятие. С *خواندن* означает «учиться, заниматься»: *درس خواندن*.'
    example_gloss: Урок английского в четыре часа.
  prs.a2.unit36.lesson04.learning_and_saving.teach.exam:
    title: Экзамен
    gloss: экзамен
    note: '*امتحان* — это экзамен. Ты сдаёшь экзамен и получаешь оценку (*نمبر*).'
    example_gloss: Экзамен завтра.
  prs.a2.unit36.lesson04.learning_and_saving.teach.learn:
    title: Учить
    gloss: учить, узнавать
    note: '*یاد گرفتن* — это «учить, выучить». *یاد* — первая часть, *گرفتن* — глагол. Сослагательная форма для «я» — *یاد بگیرم*, с *ب-* перед *گیر*.'
    example_gloss: Я учу английский.
  prs.a2.unit36.lesson04.learning_and_saving.teach.study:
    title: Изучать
    gloss: изучать, учиться
    note: '*درس خواندن* — «учиться, заниматься». *می‌خوانم* — «я читаю» или «я учусь». درس остаётся впереди, как в *درس می‌خوانم*.'
    example_gloss: Каждый вечер я занимаюсь.
  prs.a2.unit36.lesson04.learning_and_saving.teach.expensive:
    title: Дорогой
    gloss: дорогой
    note: '*گران* означает «дорогой». Противоположное слово — *ارزان* (дешёвый).'
    example_gloss: Курс дорогой.
  prs.a2.unit36.lesson04.learning_and_saving.teach.cheap:
    title: Дешёвый
    gloss: дешёвый
    note: '*ارزان* означает «дешёвый». Если вещи *ارزان*, на них можно сэкономить.'
    example_gloss: Велосипед дешёвый.
  prs.a2.unit36.lesson04.learning_and_saving.teach.spend:
    title: Тратить деньги
    gloss: тратить (деньги)
    note: '*خرج کردن* — «тратить деньги». В отрицании составного глагола *ن* ставится на *کردن*: *خرج نکنم* (чтобы я не тратил).'
    example_gloss: Я не трачу много денег.
  prs.a2.unit36.lesson04.learning_and_saving.teach.for_noun2:
    title: برای + существительное со словами об учёбе и накоплении
    gloss: Я занимаюсь для экзамена. Я коплю деньги на курс.
    note: 'Модель из первого урока работает и с этими словами: *برای امتحان* (для экзамена), *برای کورس* (на курс). Существительное после *برای* — краткий способ сказать, ради чего стараешься.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.learn_clause:
    title: Придаточные цели об учёбе
    gloss: Чтобы выучить английский, я каждый вечер читаю книгу. Чтобы получить на экзамене хорошую оценку, я много занимаюсь.
    note: 'Используй *برای اینکه* или *تا* с глаголом в сослагательной форме, чтобы сказать, зачем ты учишься: *یاد بگیرم* (чтобы я выучил), *نمبر خوب بگیرم* (чтобы я получил хорошую оценку). Части можно ставить в любом порядке.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.save_clause:
    title: Придаточные цели о накоплении денег
    gloss: Я коплю деньги, чтобы купить велосипед. Я покупаю дешёвую книгу, чтобы не тратить много денег.
    note: Когда речь о накоплении денег, главная часть говорит, что ты делаешь, а часть с *تا* — зачем. Отрицание *خرج نکنم* говорит о том, чего ты не хочешь.
  prs.a2.unit36.lesson04.learning_and_saving.teach.sentence:
    title: Я коплю, чтобы купить велосипед
    gloss: Я коплю деньги, чтобы купить велосипед.
    note: 'Короткое предложение: сначала действие, потом цель.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.narges:
    title: Фозия
    gloss: Фозия — подруга Фарозан.
    note: '*فوزیه* — ещё одна подруга. Она пишет сообщение в этом уроке. Это не та же самая особа, что Фарозан.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.fare:
    title: 'Платить за проезд: کرایه دادن'
    gloss: Я плачу за проезд. Я не плачу за проезд. Чтобы не платить за проезд, я хожу пешком.
    note: '*کرایه دادن* — «платить за проезд» в такси или автобусе. Настоящее время — *می‌دهم*, отрицание — *نمی‌دهم*, а отрицательная сослагательная форма — *ندهم* (чтобы я не давал). *پیاده می‌روم* — «я иду пешком».'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn01:
    title: Фарозан спрашивает, куда идёт Ариф
    gloss: Ариф, куда ты сегодня идёшь?
    note: Фарозан спрашивает *به کجا می‌روی؟* в настоящем времени, *می‌روی*. Она его подруга, поэтому говорит *تو*.
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn02:
    title: Ариф называет два дела
    gloss: Сначала я иду на почту, чтобы отправить это письмо. Потом иду в банк.
    note: 'У первого дела есть цель: *تا این نامه را بفرستم*. *اول* и *بعد* расставляют два дела по порядку.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn03:
    title: Фарозан спрашивает о банке
    gloss: Какое у тебя дело в банке?
    note: '*چه کار داری؟* спрашивает, какое у тебя где-то дело.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn04:
    title: Ариф говорит, зачем
    gloss: Иду получить деньги.
    note: Короткий ответ *می‌روم تا پول بگیرم* выражает цель с помощью *تا* и сослагательной формы *بگیرم*.
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn05:
    title: Фарозан спрашивает, как он добирается
    gloss: Ты поедешь на машине?
    note: '*با موتر* — «на машине».'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn06:
    title: Ариф идёт пешком, чтобы сэкономить на проезде
    gloss: Нет, я иду пешком, чтобы не платить за проезд.
    note: '*نخیر* — «нет». *تا کرایه ندهم* — отрицательная цель: он идёт пешком, чтобы сэкономить деньги.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.message:
    title: Сообщение о накоплении денег
    gloss: Привет, Фарозан. Каждый месяц я коплю две тысячи афгани, чтобы купить велосипед. Чтобы не платить за проезд, я хочу ездить в школу на велосипеде. Завтра я иду в банк, чтобы забрать свои деньги. Фозия
    note: 'Короткое сообщение с тремя целями: *تا یک بایسکل بخرم* (чтобы купить велосипед), *برای اینکه کرایه ندهم* (чтобы не платить за проезд) и *تا پولم را بگیرم* (чтобы забрать свои деньги). Для плана Фозия использует простое настоящее время *می‌روم* со словом *فردا*.'
  prs.a2.unit36.lesson06.english_conversation.teach.give_book:
    title: 'Два разных подлежащих: я даю, чтобы ты не тратил'
    gloss: Я даю тебе свою книгу. Я даю тебе свою книгу, чтобы ты не тратил деньги.
    note: 'У двух глаголов могут быть разные подлежащие. В *کتابم را به تو می‌دهم تا پول خرج نکنی* даёт «я» (*می‌دهم*), а не тратит «ты» (*نکنی*). Сослагательная форма согласуется со своим подлежащим: *-ی* для «ты».'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn01:
    title: Ариф спрашивает, почему Фарозан читает каждый вечер
    gloss: Фарозан, почему ты каждый вечер читаешь книгу?
    note: '*می‌خوانی* — «ты читаешь». *چرا* спрашивает «почему» и предполагает ответ с причиной или целью.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn02:
    title: Фарозан говорит, ради чего она занимается
    gloss: Чтобы выучить английский.
    note: 'Короткий ответ — только придаточная цели: *برای اینکه انگلیسی یاد بگیرم*. Главная часть опущена, потому что она уже прозвучала в вопросе.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn03:
    title: Ариф спрашивает о более глубокой цели
    gloss: Зачем?
    note: '*برای چه؟* спрашивает о следующей цели, которая стоит за первой.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn04:
    title: Фарузан называет следующую цель
    gloss: Чтобы получить хорошую оценку на экзамене.
    note: '*تا در امتحان نمبر خوب بگیرم* — самостоятельное придаточное с *تا*. *نمبر* — это оценка, балл.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn05:
    title: Ариф тоже хочет учиться
    gloss: Я тоже хочу изучать английский, но курсы дорогие.
    note: В *می‌خواهم انگلیسی بخوانم* после *می‌خواهم* стоит сослагательное наклонение *بخوانم*.
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn06:
    title: Фарузан предлагает свою книгу
    gloss: Я даю тебе свою книгу, чтобы ты не тратил деньги.
    note: 'В *تا پول خرج نکنی* подлежащее другое, чем у главного глагола: книгу даю я, а деньги не тратишь ты.'
exercises:
  prs.a2.unit36.lesson01.errands_and_for.exercise01.recognize_send_letter:
    instruction: Что означает это предложение?
    correct_option: Я иду на почту, чтобы отправить письмо
    distractors:
    - Я отправлю письмо в банк
    - Почта близко
    - Я не хочу отправлять письмо
    accepted_answers:
    - value: Я иду на почту, чтобы отправить письмо
      status: correct
    feedback: '*برای فرستادن نامه* — «чтобы отправить письмо», а *به پُسته خانه می‌روم* — «я иду на почту».'
  prs.a2.unit36.lesson01.errands_and_for.exercise02.recognize_shopping:
    instruction: Что означает это предложение?
    correct_option: Я иду на рынок за покупками
    distractors:
    - Рынок далеко от дома
    - Я не хожу на рынок
    - Вчера я купил хлеб на рынке
    accepted_answers:
    - value: Я иду на рынок за покупками
      status: correct
    feedback: '*برای خرید* — «за покупками». Вместе с *به بازار می‌روم* получается «я иду на рынок за покупками».'
  prs.a2.unit36.lesson01.errands_and_for.exercise03.match_errand_words:
    instruction: Соедини каждое слово на дари с его значением.
    accepted_answers:
    - value:
        پُسته خانه: почта
        نامه: письмо
        بانک: банк
        فرستادن: отправлять
        خریدن: покупать
        گرفتن: брать, получать
        خرید: покупки
        استراحت: отдых
        برای: для, чтобы
      status: correct
    feedback: Это слова, обозначающие дела из этого урока. *برای* ставится перед существительным или инфинитивом и показывает, ради чего что-то делают.
    pairs:
    - left: پُسته خانه
      right: почта
    - left: نامه
      right: письмо
    - left: بانک
      right: банк
    - left: فرستادن
      right: отправлять
    - left: خریدن
      right: покупать
    - left: گرفتن
      right: брать, получать
    - left: خرید
      right: покупки
    - left: استراحت
      right: отдых
    - left: برای
      right: для, чтобы
  prs.a2.unit36.lesson01.errands_and_for.exercise04.order_buy_bread:
    instruction: 'Расставь слова так, чтобы получилось: Чтобы купить хлеб, я иду в лавку.'
    accepted_answers:
    - value:
      - برای
      - خریدن
      - نان
      - به
      - دوکان
      - می‌روم
      status: correct
    - value:
      - به
      - دوکان
      - می‌روم
      - برای
      - خریدن
      - نان
      status: correct
    feedback: '*برای خریدن نان به دوکان می‌روم.* Цель может стоять и в начале, и в конце, а глагол *می‌روم* остаётся в конце своей части.'
  prs.a2.unit36.lesson01.errands_and_for.exercise05.complete_send:
    instruction: 'Дополни предложение: Чтобы отправить письмо, я иду на почту.'
    accepted_answers:
    - value: فرستادن
      status: correct
    feedback: '*فرستادن* — инфинитив. *برای فرستادن نامه* — «чтобы отправить письмо».'
  prs.a2.unit36.lesson01.errands_and_for.exercise06.translate_get_money:
    instruction: 'Переведи на дари, используя برای и инфинитив: Я иду в банк, чтобы получить деньги.'
    accepted_answers:
    - value: برای گرفتن پول به بانک می‌روم.
      status: correct
    - value: من برای گرفتن پول به بانک می‌روم.
      status: correct
    - value: به بانک می‌روم برای گرفتن پول.
      status: correct
    - value: من به بانک می‌روم برای گرفتن پول.
      status: correct
    feedback: '*برای گرفتن پول به بانک می‌روم.* Цель может стоять в конце, а *من* необязательно, потому что окончание *-م* уже означает «я».'
  prs.a2.unit36.lesson02.for_that_subjunctive.exercise01.recognize_buy_bread:
    instruction: Что означает это предложение?
    correct_option: Чтобы купить хлеб, я иду в лавку
    distractors:
    - Вчера я купил хлеб в лавке
    - Я не покупаю хлеб в лавке
    - В лавке продают хлеб
    accepted_answers:
    - value: Чтобы купить хлеб, я иду в лавку
      status: correct
    feedback: '*برای اینکه نان بخرم* — «чтобы я купил хлеб». Глагол *بخرم* — сослагательное наклонение от *خریدن*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.exercise02.choose_subjunctive:
    instruction: 'Выбери глагол, который завершает предложение: Чтобы получить деньги, я иду в банк.'
    correct_option: بگیرم
    distractors:
    - گرفتم
    - می‌گیرم
    - گرفتن
    accepted_answers:
    - value: بگیرم
      status: correct
    feedback: 'После *برای اینکه* нужно сослагательное наклонение: *بگیرم*, а не прошедшее *گرفتم* и не настоящее *می‌گیرم*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.exercise03.match_subjunctive:
    instruction: Соотнеси каждый глагол в сослагательном наклонении с его значением.
    accepted_answers:
    - value:
        بخرم: чтобы я купил(а)
        بروم: чтобы я пошёл/пошла
        بگیرم: чтобы я взял(а), получил(а)
        بفرستم: чтобы я отправил(а)
        بخوانم: чтобы я прочитал(а)
        ببینم: чтобы я увидел(а)
        بیایم: чтобы я пришёл/пришла
        بیاورم: чтобы я принёс/принесла
      status: correct
    feedback: 'Большинство форм строится так: *ب-* + основа настоящего времени + *-م*. *بیایم* (от *آمدن*) и *بیاورم* (от *آوردن*) пишутся иначе, их нужно запомнить.'
    pairs:
    - left: بخرم
      right: чтобы я купил(а)
    - left: بروم
      right: чтобы я пошёл/пошла
    - left: بگیرم
      right: чтобы я взял(а), получил(а)
    - left: بفرستم
      right: чтобы я отправил(а)
    - left: بخوانم
      right: чтобы я прочитал(а)
    - left: ببینم
      right: чтобы я увидел(а)
    - left: بیایم
      right: чтобы я пришёл/пришла
    - left: بیاورم
      right: чтобы я принёс/принесла
  prs.a2.unit36.lesson02.for_that_subjunctive.exercise04.order_get_money:
    instruction: 'Расставь слова так, чтобы получилось: Чтобы получить деньги, я иду в банк.'
    accepted_answers:
    - value:
      - برای
      - اینکه
      - پول
      - بگیرم
      - به
      - بانک
      - می‌روم
      status: correct
    - value:
      - به
      - بانک
      - می‌روم
      - برای
      - اینکه
      - پول
      - بگیرم
      status: correct
    feedback: '*برای اینکه پول بگیرم، به بانک می‌روم.* Глагол в сослагательном наклонении *بگیرم* завершает свою часть, а части можно менять местами.'
  prs.a2.unit36.lesson02.for_that_subjunctive.exercise05.complete_see_friend:
    instruction: 'Дополни предложение: Чтобы увидеть друга, я еду в Кабул.'
    accepted_answers:
    - value: ببینم
      status: correct
    feedback: '*ببینم* — сослагательное наклонение от *دیدن* для «я»: *برای اینکه دوستم را ببینم* — «чтобы я увидел своего друга».'
  prs.a2.unit36.lesson02.for_that_subjunctive.exercise06.translate_send_letter:
    instruction: 'Переведи на дари, используя برای اینکه: Чтобы отправить письмо, я иду на почту.'
    accepted_answers:
    - value: برای اینکه نامه بفرستم، به پُسته خانه می‌روم.
      status: correct
    - value: برای اینکه نامه بفرستم به پُسته خانه می‌روم.
      status: correct
    - value: به پُسته خانه می‌روم برای اینکه نامه بفرستم.
      status: correct
    - value: برای اینکه نامه بفرستم، من به پُسته خانه می‌روم.
      status: correct
    - value: برای اینکه نامه بفرستم من به پُسته خانه می‌روم.
      status: correct
    - value: من به پُسته خانه می‌روم برای اینکه نامه بفرستم.
      status: correct
    feedback: '*برای اینکه نامه بفرستم، به پُسته خانه می‌روم.* Запятую можно ставить и не ставить, части можно менять местами, а *من* необязательно.'
  prs.a2.unit36.lesson03.ta_and_negative.exercise01.recognize_not_late:
    instruction: Что означает это предложение?
    correct_option: Я выхожу пораньше, чтобы не опоздать
    distractors:
    - Я опоздал, потому что вышел рано
    - Я не выхожу рано
    - Я выхожу поздно, чтобы прийти рано
    accepted_answers:
    - value: Я выхожу пораньше, чтобы не опоздать
      status: correct
    feedback: '*تا دیر نرسم* — «чтобы не опоздать». *نرسم* — отрицательное сослагательное наклонение от *رسیدن*.'
  prs.a2.unit36.lesson03.ta_and_negative.exercise02.match_purpose_clauses:
    instruction: Соотнеси каждое придаточное цели на дари с его значением.
    accepted_answers:
    - value:
        تا نان بخرم: чтобы я купил(а) хлеб
        تا پول بگیرم: чтобы я получил(а) деньги
        تا نامه بفرستم: чтобы я отправил(а) письмо
        تا دیر نرسم: чтобы я не опоздал(а)
        تا آن را گم نکنم: чтобы я не потерял(а) это
        تا دوستم را ببینم: чтобы я увидел(а) своего друга
        تا کتاب بخوانم: чтобы я почитал(а) книгу
      status: correct
    feedback: 'Каждое придаточное состоит из *تا* и глагола в сослагательном наклонении. В отрицательных формах перед основой стоит *ن-*: *نرسم*, *نکنم*.'
    pairs:
    - left: تا نان بخرم
      right: чтобы я купил(а) хлеб
    - left: تا پول بگیرم
      right: чтобы я получил(а) деньги
    - left: تا نامه بفرستم
      right: чтобы я отправил(а) письмо
    - left: تا دیر نرسم
      right: чтобы я не опоздал(а)
    - left: تا آن را گم نکنم
      right: чтобы я не потерял(а) это
    - left: تا دوستم را ببینم
      right: чтобы я увидел(а) своего друга
    - left: تا کتاب بخوانم
      right: чтобы я почитал(а) книгу
  prs.a2.unit36.lesson03.ta_and_negative.exercise03.order_we_buy_bread:
    instruction: 'Расставь слова так, чтобы получилось: Мы идём в лавку, чтобы купить хлеб.'
    accepted_answers:
    - value:
      - به
      - دوکان
      - می‌رویم
      - تا
      - نان
      - بخریم
      status: correct
    - value:
      - تا
      - نان
      - بخریم
      - به
      - دوکان
      - می‌رویم
      status: correct
    feedback: '*به دوکان می‌رویم تا نان بخریم.* Придаточное с *تا* обычно стоит в конце. Оба глагола оканчиваются на *-یم*, потому что подлежащее — «мы».'
  prs.a2.unit36.lesson03.ta_and_negative.exercise04.complete_not_late:
    instruction: 'Дополни предложение: Я выхожу пораньше, чтобы не опоздать.'
    accepted_answers:
    - value: نرسم
      status: correct
    feedback: '*نرسم* — отрицательное сослагательное наклонение. *زود می‌روم تا دیر نرسم* — «я выхожу пораньше, чтобы не опоздать».'
  prs.a2.unit36.lesson03.ta_and_negative.exercise05.answer_what_for:
    instruction: 'Фарузан спрашивает: عارف، برای چه به بانک می‌روی؟ (Ариф, зачем ты идёшь в банк?) Ответь за Арифа, указав цель: Чтобы получить деньги.'
    accepted_answers:
    - value: تا پول بگیرم.
      status: correct
    - value: برای اینکه پول بگیرم.
      status: correct
    - value: برای گرفتن پول.
      status: correct
    - value: می‌روم تا پول بگیرم.
      status: correct
    - value: به بانک می‌روم تا پول بگیرم.
      status: correct
    - value: می‌روم برای اینکه پول بگیرم.
      status: correct
    - value: به بانک می‌روم برای اینکه پول بگیرم.
      status: correct
    - value: می‌روم برای گرفتن پول.
      status: correct
    - value: به بانک می‌روم برای گرفتن پول.
      status: correct
    - value: من به بانک می‌روم تا پول بگیرم.
      status: correct
    - value: من می‌روم تا پول بگیرم.
      status: correct
    - value: من به بانک می‌روم برای اینکه پول بگیرم.
      status: correct
    - value: من به بانک می‌روم برای گرفتن پول.
      status: correct
    feedback: '*تا پول بگیرم.* — самый короткий ответ. *برای اینکه پول بگیرم* и *برای گرفتن پول* тоже верны, и можно добавить *به بانک می‌روم*.'
  prs.a2.unit36.lesson03.ta_and_negative.exercise06.write_money_in_bank:
    instruction: 'Напиши на дари, используя تا и отрицательное сослагательное наклонение: Я кладу деньги в банк, чтобы не потерять их.'
    accepted_answers:
    - value: پولم را در بانک می‌گذارم تا آن را گم نکنم.
      status: correct
    - value: پولم را در بانک می‌گذارم برای اینکه آن را گم نکنم.
      status: correct
    - value: پولم را در بانک می‌گذارم تا گم نکنم.
      status: correct
    - value: پولم را در بانک می‌گذارم برای اینکه گم نکنم.
      status: correct
    - value: من پولم را در بانک می‌گذارم تا آن را گم نکنم.
      status: correct
    - value: من پولم را در بانک می‌گذارم برای اینکه آن را گم نکنم.
      status: correct
    - value: من پولم را در بانک می‌گذارم تا گم نکنم.
      status: correct
    - value: من پولم را در بانک می‌گذارم برای اینکه گم نکنم.
      status: correct
    - value: برای اینکه آن را گم نکنم، پولم را در بانک می‌گذارم.
      status: correct
    - value: برای اینکه آن را گم نکنم، من پولم را در بانک می‌گذارم.
      status: correct
    - value: برای اینکه آن را گم نکنم پولم را در بانک می‌گذارم.
      status: correct
    - value: برای اینکه آن را گم نکنم من پولم را در بانک می‌گذارم.
      status: correct
    feedback: '*پولم را در بانک می‌گذارم تا آن را گم نکنم.* Отрицание ставится на глагольную часть составного глагола: *گم نکنم*. Вместо *تا* можно использовать *برای اینکه*.'
  prs.a2.unit36.lesson04.learning_and_saving.exercise01.recognize_for_exam:
    instruction: Что означает это предложение?
    correct_option: Я учусь к экзамену
    distractors:
    - Вчера я сдавал экзамен
    - Экзамен лёгкий
    - Я не учусь для курсов
    accepted_answers:
    - value: Я учусь к экзамену
      status: correct
    feedback: '*برای امتحان* — «к экзамену, для экзамена». *درس می‌خوانم* — «я учусь, занимаюсь».'
  prs.a2.unit36.lesson04.learning_and_saving.exercise02.match_learning_saving:
    instruction: Соедини каждое слово на дари с его значением.
    accepted_answers:
    - value:
        درس: урок, занятие
        امتحان: экзамен
        یاد گرفتن: учить, узнавать
        درس خواندن: изучать, учиться
        گران: дорогой
        ارزان: дешёвый
        خرج کردن: тратить (деньги)
