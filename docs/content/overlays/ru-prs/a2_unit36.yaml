course:
  title: Дари A2
  description: 'Дари Афганистана, средний уровень: как сказать, для чего ты что-то делаешь. Цель с برای и существительным или инфинитивом, برای اینکه и تا с сослагательным наклонением, а также отрицание («чтобы я не...») — на примерах поручений, учёбы и накопления денег.'
units:
