teaching:
  prs.a1.unit15.lesson01.teach.in_word:
    title: Это
    gloss: этот
    note: این означает «это».
    example_gloss: Это больше.
  prs.a1.unit15.lesson01.teach.aan_word:
    title: То
    gloss: то
    note: آن означает «то». В этом курсе используется полная форма آن, а не разговорная иранская اون.
    example_gloss: То меньше.
  prs.a1.unit15.lesson01.teach.bozorgtar_ast_word:
    title: Больше
    gloss: больше
    note: 'بزرگ‌تر است — полная форма без сокращения («оно больше»): *بزرگ‌تر* — сравнительная степень от *بزرگ* (большой), а *است* остаётся отдельным словом.'
    example_gloss: Это больше, чем то.
  prs.a1.unit15.lesson01.teach.koochaktar_ast_word:
    title: Меньше
    gloss: меньше
    note: کوچک‌تر است — полная форма («оно меньше»). کوچک — стандартное написание в дари (а не иранское разговорное کوچیک).
    example_gloss: То меньше, чем это.
  prs.a1.unit15.lesson01.teach.az_word:
    title: Чем
    gloss: чем
    note: 'از указывает, с чем сравнивают: X از Y بزرگ‌تر است значит «X больше, чем Y».'
    target_text: از (чем)
  prs.a1.unit15.lesson02.teach.gerantar_ast_word:
    title: Дороже
    gloss: дороже
    note: گران‌تر است — полная форма («оно дороже»). گران — стандартное написание в дари (а не иранское разговорное گرون).
    example_gloss: Это дороже, чем то.
  prs.a1.unit15.lesson02.teach.arzantar_ast_word:
    title: Дешевле
    gloss: дешевле
    note: ارزان‌تر است — полная форма («оно дешевле»). ارزان — стандартное написание в дари (а не иранское разговорное ارزون).
    example_gloss: То дешевле, чем это.
  prs.a1.unit15.lesson03.teach.names:
    title: Карим и Негар
    gloss: Карим, Негар
    note: Распространённые афганские имена, которые встречаются в этом курсе.
    example_gloss:
    - Я Карим.
    - Я Негар.
  prs.a1.unit15.lesson03.teach.ghad_bolandtar_phrase:
    title: Выше ростом
    gloss: выше ростом / он/она выше ростом
    note: '*قد بلندتر است* буквально значит «рост выше»: *قد* (рост), *بلندتر* (выше, сравнительная степень от *بلند* — высокий), *است* (есть, является).'
  prs.a1.unit15.lesson03.teach.javantar_ast_word:
    title: Младше
    gloss: моложе / он/она моложе
    note: جوان‌تر است — полная форма («моложе»). جوان — стандартное написание в дари (а не иранское разговорное جوون).
    example_gloss: Негар моложе Карима.
  prs.a1.unit15.lesson04.teach.behtar_ast_word:
    title: Лучше
    gloss: лучше
    note: 'بهتر است — полная форма: بهتر («лучше») — особая сравнительная степень от خوب (хороший).'
    example_gloss: Это лучше, чем то.
  prs.a1.unit15.lesson04.teach.badtar_ast_word:
    title: Хуже
    gloss: хуже
    note: 'بدتر است — полная форма: بدتر («хуже») — особая сравнительная степень от بد (плохой).'
    example_gloss: То хуже, чем это.
  prs.a1.unit15.lesson04.teach.choon_word:
    title: Потому что
    gloss: потому что
    note: چون вводит причину.
    target_text: چون (потому что)
  prs.a1.unit15.lesson04.teach.va_word:
    title: И
    gloss: и
    note: و значит «и» и соединяет две части предложения или два элемента.
    target_text: و (и)
  prs.a1.unit15.lesson05.teach.reading_text:
    title: Пример текста со сравнением
    gloss: Карим выше ростом, чем Негар. Негар моложе Карима.
    note: Короткое сравнение людей в третьем лице, в котором использована лексика этого урока.
  prs.a1.unit15.lesson06.teach.names:
    title: Карим и Негар
    gloss: Карим, Негар
    example_gloss:
    - Карим выше ростом.
    - Негар моложе.
  prs.a1.unit15.lesson06.teach.ama_word:
    title: Но
    gloss: но
    note: اما значит «но» и вводит противопоставление.
    target_text: اما (но)
  prs.a1.unit15.lesson06.teach.bali_word:
    title: Да
    gloss: да
    note: بلی — вежливое, формальное слово «да», что соответствует стилю этого курса.
    example_gloss: Да, это дороже.
