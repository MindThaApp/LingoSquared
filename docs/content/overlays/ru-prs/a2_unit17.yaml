teaching:
  prs.a2.unit17.lesson01.teach.week_word:
    title: Неделя
    gloss: неделя
    note: '*هفته* означает «неделя».'
    example_gloss: На этой неделе я очень занят.
  prs.a2.unit17.lesson01.teach.weekend_word:
    title: Выходные
    gloss: выходные
    note: '*آخر هفته* буквально означает «конец недели».'
    example_gloss: В выходные я отдыхаю.
  prs.a2.unit17.lesson01.teach.schedule_word:
    title: Расписание
    gloss: время встречи
    note: '*برنامه* используется в значениях «расписание», «план» или «программа».'
    example_gloss: Мой распорядок на неделю насыщенный.
  prs.a2.unit17.lesson01.teach.first_word:
    title: Сначала
    gloss: сначала
    note: '*اول* открывает последовательность действий.'
    example_gloss: Сначала я завтракаю.
  prs.a2.unit17.lesson01.teach.then_word:
    title: Потом
    gloss: потом
    note: '*بعد* продолжает последовательность после *اول*.'
    example_gloss: Потом я иду в офис.
  prs.a2.unit17.lesson01.teach.finally_word:
    title: В конце
    gloss: в конце концов
    note: '*در آخر* завершает последовательность — *اول ... بعد ... در آخر* — основная модель последовательности на уровне A2 в этом уроке.'
    example_gloss: В конце я немного занимаюсь.
  prs.a2.unit17.lesson01.teach.sequence_grammar:
    title: Полное предложение с последовательностью
    gloss: В будни сначала я иду в офис, потом занимаюсь спортом, а в конце немного занимаюсь учёбой.
    note: '*اول ... بعد ... و در آخر* выстраивает три действия в одном предложении — это главный грамматический шаг урока на уровне A2.'
  prs.a2.unit17.lesson01.teach.days_word:
    title: Будни
    gloss: будни
    note: '*روزهای هفته* — буквально «дни недели» — означает «будни» и противопоставляется *آخر هفته*.'
    example_gloss: В будни я занят работой.
  prs.a2.unit17.lesson02.teach.ask_weekly_schedule:
    title: Спросить о чьём-то недельном распорядке
    gloss: Какой у тебя распорядок на неделю?
    note: '*تو* — неформальное «ты», которое используют между друзьями.'
  prs.a2.unit17.lesson02.teach.weekday_full_sentence:
    title: Описать последовательность действий в будний день
    gloss: В будни сначала я иду в офис, потом занимаюсь спортом.
    note: Повторяется модель последовательности из первого урока с *اول* и *بعد*.
  prs.a2.unit17.lesson02.teach.weekend_activity:
    title: Рассказать о занятиях в выходные
    gloss: В выходные я поздно встаю и провожу время с семьёй.
    note: '*دیر بیدار می‌شوم* — «я поздно просыпаюсь» — прямо противопоставляется раннему подъёму в будни из текста третьего урока.'
  prs.a2.unit17.lesson03.teach.difference_word:
    title: Разница
    gloss: разница
    note: '*تفاوت* означает «разница».'
    example_gloss: Между буднями и выходными большая разница.
  prs.a2.unit17.lesson03.teach.rest_word:
    title: Отдыхать
    gloss: отдыхать
    note: '*استراحت کردن* означает «отдыхать».'
    example_gloss: В выходные я отдыхаю.
  prs.a2.unit17.lesson03.teach.comparison_text:
    title: Краткое сравнение недели همایون
    gloss: В будни همایون рано встаёт и идёт в офис. А в выходные он поздно встаёт и отдыхает.
    note: Короткий описательный текст, где сравниваются будни и выходные, в том стиле письменной речи, который изучается в этом уроке.
  prs.a2.unit17.lesson04.teach.turn01:
    title: زرمینه спрашивает о неделе همایون
    gloss: زرمینه спрашивает, какой у него распорядок на неделю.
    note: Тот же вопрос, что и во втором уроке, и неформальное обращение *تو*, уже знакомое по этой паре друзей.
  prs.a2.unit17.lesson04.teach.turn02:
    title: همایون рассказывает о своих буднях
    gloss: В будни сначала он идёт в офис, потом занимается спортом.
    note: То же предложение, что и во втором уроке.
  prs.a2.unit17.lesson04.teach.turn03:
    title: زرمینه спрашивает о его выходных
    gloss: زرمینه спрашивает, что он делает в выходные.
    note: '*چه کار می‌کنی؟* означает «что ты делаешь?»'
  prs.a2.unit17.lesson04.teach.turn04:
    title: همایون рассказывает о своих выходных и спрашивает в ответ
    gloss: В выходные он поздно встаёт и проводит время с семьёй. Он спрашивает её о том же.
    note: То же предложение о выходных, что и во втором уроке.
  prs.a2.unit17.lesson04.teach.turn05:
    title: زرمینه рассказывает о своих буднях
    gloss: В будни сначала она работает, потом приходит домой и готовит.
    note: '*آشپزی* означает «приготовление еды».'
  prs.a2.unit17.lesson04.teach.turn06:
    title: زرمینه рассказывает о своих выходных
    gloss: В выходные она ходит на рынок с подругами.
    note: '*دوستانم* — «мои друзья» — это *دوستان* («друзья») с присоединённым притяжательным суффиксом *-َم*.'
  prs.a2.unit17.lesson04.teach.turn07:
    title: همایون одобряет
    gloss: همایون говорит, что у неё хороший распорядок.
    note: '*برنامهٔ خوبی داری!* означает «у тебя хороший распорядок!»'
