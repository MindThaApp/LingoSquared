course:
  title: Дари A2
  description: 'Дари Афганистана, уровень ниже среднего: описание недельного распорядка — слова-связки для последовательности, сравнение будней и выходных, чтение текста о неделе и настоящий разговор двух друзей об их неделях.'
units:
