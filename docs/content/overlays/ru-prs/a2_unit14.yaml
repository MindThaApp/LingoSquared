course:
  title: Дари A2
  description: 'Дари Афганистана, уровень ниже среднего: простое собеседование при приёме на работу — лексика, рассказ об опыте и о том, когда можешь приступить, чтение объявления о вакансии и само собеседование.'
units:
  prs.a2.unit14.job_interview:
    title: Собеседование
lessons:
  prs.a2.unit14.lesson01.interview_vocabulary:
    title: Слова для собеседования
  prs.a2.unit14.lesson02.describing_experience_and_availability:
    title: Рассказ об опыте и о сроках начала работы
  prs.a2.unit14.lesson03.reading_a_job_posting:
    title: Чтение объявления о вакансии
  prs.a2.unit14.lesson04.interview_dialogue:
    title: Собеседование
teaching:
  prs.a2.unit14.lesson01.teach.experience_word:
    title: Опыт
    gloss: опыт
    note: '*تجربه* — общее слово для обозначения опыта работы.'
    example_gloss: У لیمه три года опыта.
  prs.a2.unit14.lesson01.teach.skill_word:
    title: Навык
    gloss: навык
    note: '*مهارت* — это навык или умение.'
    example_gloss: Умение работать на компьютере важно.
  prs.a2.unit14.lesson01.teach.salary_word:
    title: Зарплата
    gloss: зарплата
    note: '*حقوق* означает «зарплата» или «оплата труда».'
    example_gloss: Зарплата на этой должности — 30 000 афгани.
  prs.a2.unit14.lesson01.teach.position_word:
    title: Должность / работа
    gloss: должность / работа
    note: '*وظیفه* — общее слово для обозначения работы или должности; оно отличается от более официального *بست* (официальная вакансия).'
    example_gloss: Эта должность в офисе.
  prs.a2.unit14.lesson01.teach.resume_word:
    title: Резюме
    gloss: резюме
    note: '*رزومه* — заимствованное слово (от «resume»), означающее резюме.'
    example_gloss: Я отправил(а) своё резюме тому, кто проводит собеседование.
  prs.a2.unit14.lesson01.teach.interview_word:
    title: Собеседование
    gloss: собеседование
    note: '*مصاحبه* — собеседование при приёме на работу.'
    example_gloss: Собеседование у لیمه завтра.
  prs.a2.unit14.lesson01.teach.how_many_years_grammar:
    title: 'Сколько лет: вопрос с چند سال'
    gloss: Сколько лет опыта у вас?
    note: '*چند سال...؟* — модель вопроса о количестве, с помощью которой спрашивают о годах опыта.'
    target_text: چند سال تجربه دارین؟ (сколько лет опыта у вас?)
  prs.a2.unit14.lesson02.teach.three_years_experience:
    title: Расскажи, сколько лет у тебя опыта
    gloss: У меня три года опыта на этой должности.
    note: '*در این وظیفه* означает «на этой должности».'
  prs.a2.unit14.lesson02.teach.can_start_next_week:
    title: Скажи, когда можешь приступить
    gloss: Я могу начать со следующей недели.
    note: '*از هفتهٔ آینده* означает «со следующей недели»; *می‌توانم* означает «я могу».'
  prs.a2.unit14.lesson02.teach.ask_salary:
    title: Спроси о зарплате
    gloss: Какая зарплата на этой должности?
    note: '*چقدر؟* означает «сколько?».'
  prs.a2.unit14.lesson03.teach.vacancy_word:
    title: Вакансия / официальная должность
    gloss: вакансия / официальная должность
    note: '*بست* — афганский термин, который используют в объявлениях о работе для обозначения официальной вакансии; он более формальный, чем *وظیفه*.'
    example_gloss: Эта вакансия в офисе.
  prs.a2.unit14.lesson03.teach.requirements_word:
    title: Требования
    gloss: требования
    note: '*شرایط* — перечень требований или условий для должности.'
    example_gloss: Требование для этой вакансии — умение работать на компьютере.
  prs.a2.unit14.lesson03.teach.notice_text:
    title: Объявление о вакансии
    gloss: 'Для этой должности требуется опыт работы не менее двух лет. Требования: навыки работы на компьютере и английский язык. Зарплата: 30 000 афгани в месяц.'
    note: Короткое официальное объявление о работе в том стиле, которому учит этот урок.
  prs.a2.unit14.lesson04.teach.turn01:
    title: Интервьюер приветствует لیمه
    gloss: Интервьюер приветствует её и просит рассказать о своём опыте.
    note: '*خوش آمدین* — вежливое «добро пожаловать».'
  prs.a2.unit14.lesson04.teach.turn02:
    title: لیمه рассказывает о своём опыте
    gloss: Она говорит, что у неё три года опыта на этой должности.
    note: Та же фраза для рассказа о годах опыта, что и раньше.
  prs.a2.unit14.lesson04.teach.turn03:
    title: Интервьюер спрашивает о навыках
    gloss: Интервьюер спрашивает, какие у неё навыки.
    note: '*مهارت‌های شما چیست؟* — «Каковы ваши навыки?».'
  prs.a2.unit14.lesson04.teach.turn04:
    title: لیمه перечисляет свои навыки
    gloss: Она умеет работать на компьютере и знает английский.
    note: Два навыка соединены с помощью *و* («и»).
  prs.a2.unit14.lesson04.teach.turn05:
    title: Интервьюер спрашивает, когда можно приступить к работе
    gloss: Интервьюер спрашивает, с какого времени она может приступить к работе.
    note: '*از کی می‌توانین شروع کنین؟* — «с какого времени вы можете начать?».'
  prs.a2.unit14.lesson04.teach.turn06:
    title: لیمه отвечает и спрашивает о зарплате
    gloss: Она может начать со следующей недели и спрашивает, какая зарплата на этой должности.
    note: Соединяет фразу о дате начала работы *از هفتهٔ آینده می‌توانم شروع کنم* с вопросом о зарплате.
  prs.a2.unit14.lesson04.teach.turn07:
    title: Интервьюер называет зарплату
    gloss: 'Интервьюер говорит: 30 000 афгани в месяц.'
    note: Зарплата совпадает с объявлением о вакансии, которое тебе встречалось раньше.
