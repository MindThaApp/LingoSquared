    target_text: عضویت (членство) / یک هزار (одна тысяча)
  prs.a1.unit56.lesson06.teach.price_contrast_phrase:
    title: Дневной абонемент стоит 100 афгани, а месячный — 1000 афгани
    gloss: Дневной абонемент стоит 100 афгани, а месячный — 1000 афгани.
