teaching:
  prs.a1.unit56.lesson01.teach.review_this_is_in_good:
    title: 'Повторение: этот, есть, в, хороший'
    gloss: этот / есть (является) / в / хороший
    note: Это слова для повторения, чтобы говорить о спортзале.
    target_text: این (этот) / است (есть, является) / در (в) / خوب (хороший)
  prs.a1.unit56.lesson01.teach.review_gym:
    title: 'Повторение: спортзал'
    gloss: спортзал
    note: Слово *باشگاه* уже встречалось раньше (в теме спорта) со значением «спортзал» или «спортивный клуб».
    target_text: باشگاه (спортзал)
  prs.a1.unit56.lesson01.teach.membership_word:
    title: Членство
    gloss: членство
    note: Это обычное слово на дари для членства, например в словосочетании «членская карта» клуба или центра.
    example_gloss: Членство в этом спортзале хорошее.
  prs.a1.unit56.lesson01.teach.equipment_word:
    title: Оборудование
    gloss: оборудование / вещи
    note: Это стандартное слово на дари для оборудования, снаряжения или личных вещей.
    example_gloss: В этом спортзале хорошее оборудование.
  prs.a1.unit56.lesson01.teach.membership_good_phrase:
    title: Членство в этом спортзале хорошее
    gloss: Членство в этом спортзале хорошее.
    note: Здесь вместе стоят слова «членство» и «хороший».
  prs.a1.unit56.lesson01.teach.equipment_phrase:
    title: В этом спортзале хорошее оборудование
    gloss: В этом спортзале хорошее оборудование.
    note: '*دارد* — форма 3-го лица глагола «иметь», уже знакомая по прежним урокам.'
  prs.a1.unit56.lesson02.teach.review_want_get_membership_card:
    title: 'Повторение: хочу, получить (взять), карта, членство, один'
    gloss: хочу / получить (взять) / карта / членство / один (какой-то)
    note: Это повторяемые слова, которые нужны, чтобы попросить членскую карту. Конструкция «X می‌خواهم Y بگیرم» уже встречалась в курсе — при аренде велосипеда и записи к врачу.
    target_text: می‌خواهم (я хочу) / بگیرم (чтобы я получил) / کارت (карта) / عضویت (членство) / یک (один, какой-то)
  prs.a1.unit56.lesson02.teach.review_day_pass_words:
    title: 'Повторение: ежедневный, сколько, афгани, 100'
    gloss: ежедневный / сколько / афгани / 100
    note: Это повторяемые слова, которые нужны, чтобы спросить цену дневного абонемента.
    target_text: روزانه (ежедневный, разовый) / چند (сколько) / افغانی (афгани) / صد (100)
  prs.a1.unit56.lesson02.teach.want_membership_card_phrase:
    title: Я хочу получить членскую карту
    gloss: Я хочу получить членскую карту.
    note: Здесь снова используется уже знакомая по курсу конструкция «хочу получить X».
  prs.a1.unit56.lesson02.teach.ask_day_pass_price_phrase:
    title: Сколько стоит дневной абонемент?
    gloss: Сколько стоит дневной абонемент?
    note: Дневной абонемент по-дарийски — *کارت روزانه*, буквально «ежедневная карта». Это сочетание двух уже знакомых слов.
  prs.a1.unit56.lesson02.teach.day_pass_price_answer_phrase:
    title: Дневной абонемент стоит 100 афгани
    gloss: Дневной абонемент стоит 100 афгани.
  prs.a1.unit56.lesson03.teach.review_gym_hour_what:
    title: 'Повторение: спортзал, час (время), что'
    gloss: спортзал / час (время) / что
    note: Это повторяемые слова, которые нужны, чтобы спросить о времени занятия.
    target_text: باشگاه (спортзал) / ساعت (час) / چند (какой, сколько)
  prs.a1.unit56.lesson03.teach.class_word:
    title: Занятие
    gloss: занятие
    note: Это дарийское слово для занятия или курса. Здесь оно означает тренировку в спортзале, а не только учебный курс.
    example_gloss: Занятие в пять часов.
  prs.a1.unit56.lesson03.teach.review_five:
    title: 'Повторение: пять'
    gloss: пять
    note: Это число для повторения из Урока 4.
    target_text: پنج (пять)
  prs.a1.unit56.lesson03.teach.class_time_phrase:
    title: Занятие в пять часов
    gloss: Занятие в пять часов.
  prs.a1.unit56.lesson03.teach.locker_word:
    title: Шкафчик
    gloss: шкафчик
    note: Это дарийское слово означает шкафчик, шкаф или полку.
    example_gloss: Мне нужен шкафчик для вещей.
  prs.a1.unit56.lesson03.teach.review_for:
    title: 'Повторение: для, вещи'
    gloss: для / вещи, инвентарь
    note: Это повторяемые слова, которые нужны, чтобы попросить шкафчик.
    target_text: برای (для) / وسایل (оборудование, вещи)
  prs.a1.unit56.lesson03.teach.locker_request_phrase:
    title: Мне нужен шкафчик для вещей
    gloss: Мне нужен шкафчик для вещей.
  prs.a1.unit56.lesson04.teach.review_hello_want_membership_card:
    title: 'Повторение: здравствуйте, я хочу, членская карта, получить'
    gloss: здравствуйте / я хочу / членская карта / получить
    note: Это повторяемые слова, с которых начинается диалог на ресепшене спортзала.
    target_text: سلام (здравствуйте) / می‌خواهم (я хочу) / کارت عضویت (членская карта) / بگیرم (чтобы я получил)
  prs.a1.unit56.lesson04.teach.review_welcome_day_pass_price:
    title: 'Повторение: пожалуйста, ежедневный, 100, афгани, есть (является)'
    gloss: пожалуйста (вот, возьмите) / ежедневный / 100 / афгани / есть (является)
    note: Это повторяемые слова, которые нужны, чтобы назвать цену дневного абонемента.
    target_text: بفرمایین (пожалуйста, прошу вас) / روزانه (разовый) / صد (100) / افغانی (афгани) / است (есть, является)
  prs.a1.unit56.lesson04.teach.review_very_good_class_what_hour:
    title: 'Повторение: очень хорошо, занятие, час (время), что'
    gloss: очень хорошо / занятие / час (время) / что
    note: Это повторяемые слова, которые нужны, чтобы спросить о времени занятия.
    target_text: بسیار خوب (очень хорошо) / کورس (занятие) / ساعت (час) / چند (какой, сколько)
  prs.a1.unit56.lesson04.teach.review_class_five:
    title: 'Повторение: занятие, час (время), пять'
    gloss: занятие / час (время) / пять
    note: Это повторяемые слова, которые нужны, чтобы ответить на вопрос о времени занятия.
    target_text: کورس (занятие) / ساعت (час) / پنج (пять)
  prs.a1.unit56.lesson04.teach.review_locker_for_equipment:
    title: 'Повторение: шкафчик, для, вещи, я хочу'
    gloss: шкафчик / для / вещи / я хочу
    note: Это повторяемые слова, которые нужны, чтобы попросить шкафчик.
    target_text: الماری (шкафчик) / برای (для) / وسایل (вещи) / می‌خواهم (я хочу)
  prs.a1.unit56.lesson04.teach.review_thanks_good_day:
    title: 'Повторение: большое спасибо, хорошего дня'
    gloss: большое спасибо / хорошего дня
    note: Это повторяемые слова, которыми заканчивается диалог.
    target_text: تشکر زیاد (большое спасибо) / روز خوش (хорошего дня)
  prs.a1.unit56.lesson04.teach.dialogue_line1:
    title: 'Хумаюн: Здравствуйте. Я хочу получить членскую карту.'
    gloss: Здравствуйте. Я хочу получить членскую карту.
  prs.a1.unit56.lesson04.teach.dialogue_line2:
    title: 'Сотрудник спортзала: Здравствуйте, прошу. Дневной абонемент стоит 100 афгани.'
    gloss: Здравствуйте, прошу. Дневной абонемент стоит 100 афгани.
  prs.a1.unit56.lesson04.teach.dialogue_line3:
    title: 'Хумаюн: Очень хорошо. Во сколько занятие?'
    gloss: Очень хорошо. Во сколько занятие?
  prs.a1.unit56.lesson04.teach.dialogue_line4:
    title: 'Сотрудник спортзала: Занятие в пять часов.'
    gloss: Занятие в пять часов.
  prs.a1.unit56.lesson04.teach.dialogue_line5:
    title: 'Хумаюн: Мне нужен шкафчик для вещей.'
    gloss: Мне нужен шкафчик для вещей.
  prs.a1.unit56.lesson04.teach.dialogue_line6:
    title: 'Сотрудник спортзала: Вот, возьмите. Большое спасибо. Хорошего дня!'
    gloss: Вот, возьмите. Большое спасибо. Хорошего дня!
  prs.a1.unit56.lesson05.teach.review_this_is_in_to:
    title: 'Повторение: этот, есть (является), в, к (куда)'
    gloss: этот / есть (является) / в / к (куда)
