    title: 'Повторение: ваш абонемент'
    gloss: ваш абонемент
    note: Слово «ваш абонемент» образовано с тем же вежливым суффиксом *-تان*, что и «ваш билет в бассейн» в Уроке 50, «ваш билет в кино» в Уроке 52 и «ваш билет в музей» в Уроке 53; здесь он добавлен к новому существительному.
