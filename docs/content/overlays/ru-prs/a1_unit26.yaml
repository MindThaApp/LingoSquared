    note: Два занятия соединены с помощью و («и»).
  prs.a1.unit26.lesson04.teach.dialogue_line3:
    title: 'Хумаюн: Я каждую неделю гуляю пешком'
    gloss: 'Хумаюн: Я каждую неделю гуляю пешком.'
    note: 'Повторяется предложение из урока 3: *من هر هفته پیاده‌روی می‌کنم* («Я каждую неделю гуляю пешком»).'
  prs.a1.unit26.lesson04.teach.dialogue_line4:
    title: 'Зармина: Хорошо! Я тоже люблю смотреть фильмы'
