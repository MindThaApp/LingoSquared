course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: лексика по теме хобби и свободного времени (чтение, музыка, фильмы, прогулки, готовка), вопрос о том, что человек любит делать в свободное время, с دوست دارین, частотность с هر هفته/آخر هفته и диалог Зармины и Хумайуна о том, как они проводят свободное время.'
units:
