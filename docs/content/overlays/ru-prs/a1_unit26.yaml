    gloss: слушание музыки
    note: 'موسیقی گوش کردن буквально означает «музыку ухо делать»: موسیقی (музыка, это слово уже встречалось в курсе) + گوش (ухо) + کردن (делать).'
    example_gloss: Слушать музыку — моё хобби.
