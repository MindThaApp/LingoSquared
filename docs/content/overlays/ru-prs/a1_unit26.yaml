  prs.a1.unit26.lesson04.teach.review_pronouns_verb:
    title: Я / ты / ты делаешь?
    gloss: я / ты (неформально) / ты делаешь? (неформально)
    note: من («я») и تو («ты», неформально) — повторение. می‌کنی — неформальная форма «ты делаешь»; окончание -ی такое же, как в формах رفتی и کردی, которые вы уже видели.
