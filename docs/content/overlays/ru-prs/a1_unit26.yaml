  prs.a1.unit26.lesson06.teach.wrap_summary:
    title: В свободное время я гуляю пешком, но иногда ещё люблю читать
    gloss: В свободное время я гуляю пешком, но иногда ещё люблю читать.
    note: Два высказывания о хобби соединены с помощью اما.
