course:
  title: Дари A2
  description: 'Дари (Афганистан) для среднего уровня: как косвенно и вежливо спрашивать информацию, например «Вы не знаете, где вокзал?». Конструкция می‌دانین که ... с неизменённым вопросом внутри (где, когда, почему, какой, сколько), «я не знаю, что ...», вопрос «да или нет» с یا نه и вежливая просьба می‌توانین بگویین که ....'
units:
  prs.a2.unit38.asking_indirectly:
    title: Косвенный вопрос
lessons:
  prs.a2.unit38.lesson01.do_you_know_where:
    title: Вы не знаете, где вокзал?
  prs.a2.unit38.lesson02.i_dont_know:
    title: Я не знаю, когда отправляется автобус
  prs.a2.unit38.lesson03.yes_or_no:
    title: Открыто или нет?
  prs.a2.unit38.lesson04.polite_requests:
    title: Извините, не могли бы вы сказать ...
  prs.a2.unit38.lesson05.reading_and_listening:
    title: Читаем и слушаем о музее и банке
  prs.a2.unit38.lesson06.station_conversation:
    title: Разговор на вокзале
teaching:
  prs.a2.unit38.lesson01.teach.station:
    title: Вокзал
    gloss: станция, остановка
    note: '*ایستگاه* — станция или остановка. В этом уроке мы спрашиваем, где находятся места, и станция — первое из них: *ایستگاه بس* — автобусная станция.'
    example_gloss: Станция находится в Кабуле.
  prs.a2.unit38.lesson01.teach.museum:
    title: Музей
    gloss: музей
    note: '*موزیم* — музей. Национальный музей Афганистана находится в Кабуле.'
    example_gloss: Музей находится в Кабуле.
  prs.a2.unit38.lesson01.teach.office:
    title: Офис
    gloss: офис
    note: '*دفتر* — офис, например паспортный стол или офис автобусной компании.'
    example_gloss: Офис рядом.
  prs.a2.unit38.lesson01.teach.library:
    title: Библиотека
    gloss: библиотека
    note: '*کتابخانه* — библиотека. *نزدیک* означает «близко, рядом».'
    example_gloss: Библиотека рядом.
  prs.a2.unit38.lesson01.teach.where:
    title: Где это?
    gloss: где это?
    note: '*کجا* значит «где», а *کجاست* — «где он/она/оно»: *کجا* плюс краткая форма *است*. Место ставится на первое место: *ایستگاه کجاست؟* — «Где станция?»'
    example_gloss: Где музей?
  prs.a2.unit38.lesson01.teach.know:
    title: Знать
    gloss: я знаю
    note: '*دانستن* — знать факт: *می‌دانم* — «я знаю». Используется для фактов (где находится место, когда отправляется автобус), а не для знакомства с человеком.'
    example_gloss: Я знаю.
  prs.a2.unit38.lesson01.teach.know_paradigm:
    title: 'Знать: می‌دانم'
    gloss: я знаю, ты знаешь, он/она знает, мы знаем, вы знаете (вежливо или мн. число), они знают
    note: 'Настоящее время глагола *دانستن* образуется из *می‌* и окончания: *می‌دانم، می‌دانی، می‌داند، می‌دانیم، می‌دانین، می‌دانند*. Окончание 2-го лица мн. числа — *-ین*. С незнакомым человеком, старшим или с группой говорят *می‌دانین*, с близким другом — *می‌دانی*. Местоимение можно не употреблять.'
  prs.a2.unit38.lesson01.teach.direct_to_indirect:
    title: От прямого вопроса к косвенному
    gloss: Где станция? Вы не знаете, где станция?
    note: 'Косвенный вопрос звучит мягче и вежливее прямого. Начни с *می‌دانین که* («вы знаете, что»), а затем поставь прямой вопрос без изменений: *ایستگاه کجاست؟* превращается в *می‌دانین که ایستگاه کجاست؟*. Вопросительное слово *کجا* остаётся на своём месте, а порядок слов — как в обычном утверждении.'
  prs.a2.unit38.lesson01.teach.do_you_know_museum:
    title: Вы не знаете, где музей?
    gloss: Вы не знаете, где музей?
    note: 'Это образцовое предложение урока. *که* («что») необязательно: *می‌دانین موزیم کجاست؟* тоже правильно. Вопросительный знак ставится один раз, в конце, потому что всё предложение — один вопрос.'
  prs.a2.unit38.lesson01.teach.friend_or_polite:
    title: Друг или вежливое обращение
    gloss: 'Другу: ты знаешь, где библиотека? Вежливо: вы не знаете, где библиотека?'
    note: 'Меняется только окончание глагола *دانستن* в зависимости от собеседника: *می‌دانی* — для друга, *می‌دانین* — для того, к кому обращаешься вежливо. Всё после *که* одинаково.'
  prs.a2.unit38.lesson02.teach.know_not_know:
    title: Я знаю / я не знаю
    gloss: Я знаю, где музей. Я не знаю, где музей.
    note: 'Та же конструкция работает и для утверждения. *می‌دانم که* — «я знаю, что», а *نمی‌دانم که* — «я не знаю, что», с *ن* перед глаголом. Косвенный вопрос идёт без изменений: *نمی‌دانم که موزیم کجاست.* На этот раз в конце ставится точка, потому что это утверждение.'
  prs.a2.unit38.lesson02.teach.order_unchanged:
    title: Глагол остаётся как в прямом вопросе
    gloss: Когда открывается музей? Я не знаю, когда открывается музей.
    note: 'Внутри косвенного вопроса ничего не меняется. Вопросительное слово остаётся на месте, глагол сохраняет время, сослагательное наклонение не нужно. В дари порядок слов не меняется: прямой и косвенный вопросы пишутся одинаково.'
  prs.a2.unit38.lesson02.teach.when:
    title: Когда
    gloss: когда, в какое время
    note: '*کی* значит «когда». Время по часам можно спросить и с *ساعت چند*: *بس ساعت چند حرکت می‌کند؟*'
    example_gloss: Когда отправляется автобус?
  prs.a2.unit38.lesson02.teach.opens:
    title: Открываться
    gloss: открывается (становится открытым)
    note: '*باز* — «открытый», а *شدن* — «становиться», поэтому *باز می‌شود* — «открывается». Так говорят об офисах, музеях, банках и магазинах.'
    example_gloss: Офис открывается в девять.
  prs.a2.unit38.lesson02.teach.closes:
    title: Закрывать
    gloss: закрывается (становится закрытым)
    note: '*بسته* — «закрытый». *بسته می‌شود* — «закрывается». Это противоположность *باز می‌شود*.'
    example_gloss: Офис закрывается в четыре.
  prs.a2.unit38.lesson02.teach.leaves:
    title: Отправляться
    gloss: отправляется, отходит
    note: '*حرکت کردن* — «отправляться». Говорят об автобусах, поездах и самолётах: *بس حرکت می‌کند* — «автобус отправляется».'
    example_gloss: Автобус отправляется в восемь.
  prs.a2.unit38.lesson02.teach.ticket:
    title: Билет
    gloss: билет
    note: '*بلیت* — билет на автобус, самолёт или в музей.'
    example_gloss: Билет в офисе.
  prs.a2.unit38.lesson02.teach.why:
    title: Почему
    gloss: почему
    note: '*چرا* значит «почему». В косвенном вопросе оно остаётся на своём месте: *نمی‌دانم که چرا دفتر بسته است.*'
    example_gloss: Почему офис закрыт?
  prs.a2.unit38.lesson02.teach.which:
    title: Какой
    gloss: какой
    note: '*کدام* значит «какой» и стоит перед существительным: *کدام بس* — «какой автобус».'
    example_gloss: Какой автобус идёт в Мазар?
  prs.a2.unit38.lesson02.teach.question_words:
    title: Вопросительные слова после که
    gloss: Я не знаю, сколько стоит билет. Я не знаю, почему офис закрыт. Я не знаю, какой автобус идёт в Мазар.
    note: 'Любое вопросительное слово прямого вопроса может стоять после *که*: *کجا* (где), *کی* (когда), *ساعت چند* (во сколько), *چند* (сколько), *چرا* (почему), *کدام* (какой). Каждое остаётся на своём месте, а остальная часть предложения — обычное утверждение.'
  prs.a2.unit38.lesson03.teach.open:
    title: Открытый
    gloss: открытый
    note: '*باز* значит «открытый». *باز است* — «открыто».'
    example_gloss: Музей сегодня открыт.
  prs.a2.unit38.lesson03.teach.closed:
    title: Закрыт
    gloss: закрыт
    note: '*بسته* значит «закрытый». *بانک* — банк.'
    example_gloss: Банк сегодня закрыт.
  prs.a2.unit38.lesson03.teach.market:
    title: Рынок
    gloss: рынок, базар
    note: '*بازار* — рынок, базар.'
    example_gloss: Рынок рядом.
  prs.a2.unit38.lesson03.teach.yes_no:
    title: 'Вопросы «да или нет»: یا نه'
    gloss: Офис открыт? Вы не знаете, открыт ли офис или нет?
    note: 'В вопросе «да или нет» нет вопросительного слова, поэтому в косвенной форме в конце добавляется *یا نه* («или нет»): *می‌دانین که دفتر باز است یا نه؟* — «Вы не знаете, открыт ли офис или нет?» Здесь *که* и *یا نه* обрамляют придаточную часть. *یا نه* — обычный способ сказать «ли» в дари.'
  prs.a2.unit38.lesson03.teach.yes_no_negative:
    title: Я не знаю, ли
    gloss: Я не знаю, открыт ли офис или нет.
    note: 'Форма утверждения та же: *نمی‌دانم که دفتر باز است یا نه.* Всё между *که* и *یا نه* — обычное предложение *دفتر باز است*.'
  prs.a2.unit38.lesson03.teach.aya:
    title: 'آیا: ли'
    gloss: Музей открыт? Я не знаю, открыт ли музей или нет.
    note: '*آیا* — формальное слово, которое отмечает вопрос «да или нет»: *آیا موزیم باز است؟* В косвенном вопросе его можно добавить после *که*, как в *که آیا موزیم باز است یا نه*, но это не обязательно: достаточно *یا نه*.'
  prs.a2.unit38.lesson03.teach.answer_yes_no:
    title: Да, открыто. Нет, закрыто.
    gloss: Да, открыто. Нет, закрыто.
    note: '*بلی* — «да», *نخیر* — «нет». В коротком ответе повторяется прилагательное: *باز است* («открыто») или *بسته است* («закрыто»).'
  prs.a2.unit38.lesson03.teach.know_open_today:
    title: Вы не знаете, открыто ли сегодня?
    gloss: Вы не знаете, открыто ли сегодня?
    note: 'Если место уже упоминалось, его можно опустить: *امروز باز است* значит «сегодня открыто».'
  prs.a2.unit38.lesson04.teach.excuse:
    title: Извините
    gloss: извините, простите
    note: '*ببخشین* — «извините». Это говорят незнакомому человеку перед вопросом.'
    example_gloss: Извините, где офис?
  prs.a2.unit38.lesson04.teach.staff:
    title: Сотрудник
    gloss: сотрудник, служащий
    note: '*کارمند* — сотрудник. У стойки или в билетной кассе часто обращаются к *کارمند*.'
    example_gloss: Сотрудник в офисе.
  prs.a2.unit38.lesson04.teach.polite_request:
    title: Не могли бы вы сказать ...?
    gloss: Извините, не могли бы вы сказать, где станция?
    note: Чтобы вежливо спросить незнакомого человека, используй *می‌توانین بگویین که* («не могли бы вы сказать») и поставь после него прямой вопрос. Это просьба, она мягче, чем *می‌دانین که*. *بگویین* — вежливая форма повелительного наклонения глагола *گفتن*.
  prs.a2.unit38.lesson04.teach.polite_more:
    title: Просьба с другими вопросами
    gloss: Не могли бы вы сказать, сколько стоит билет? Не могли бы вы сказать, открыт ли офис или нет?
    note: 'Та же просьба работает со всеми косвенными вопросами этого урока: *چند* (сколько), *کی*, *کجا*, *چرا* и форма «да или нет» с *یا نه*.'
  prs.a2.unit38.lesson04.teach.answer_politely:
    title: Вежливый ответ
    gloss: Да, я знаю. Станция рядом. Извините, я не знаю.
    note: Чтобы ответить на *می‌دانین که ...؟*, скажи *بلی، می‌دانم* и дай информацию или *ببخشین، نمی‌دانم*, если не знаешь. Можно также сказать *من هم نمی‌دانم* («я тоже не знаю»).
  prs.a2.unit38.lesson04.teach.me_neither:
    title: Я тоже не знаю
    gloss: Я тоже не знаю.
    note: '*هم* значит «тоже». С отрицательным глаголом оно соответствует русскому «тоже не»: *من هم نمی‌دانم* — «я тоже не знаю».'
  prs.a2.unit38.lesson05.teach.first:
    title: Сначала
    gloss: сначала, вначале
    note: '*اول* значит «сначала». *اول ... بعد ...* значит «сначала ..., потом ...»'
    example_gloss: Сначала я иду в банк.
  prs.a2.unit38.lesson05.teach.then:
    title: Потом, после этого
    gloss: потом, после этого
    note: '*بعد* означает «потом» или «после этого».'
    example_gloss: Потом я иду в библиотеку.
  prs.a2.unit38.lesson05.teach.museum_turn01:
    title: Самир спрашивает Саміну, где находится музей
    gloss: Самина, ты знаешь, где музей?
    note: Самир обращается к подруге, поэтому говорит *می‌دانی*. Вложенный вопрос — *موزیم کجاست؟*.
  prs.a2.unit38.lesson05.teach.museum_turn02:
    title: Самина отвечает
    gloss: Да, музей рядом с вокзалом.
    note: 'Самина говорит *بلی* и сообщает информацию: *نزدیک ایستگاه است* («он рядом с вокзалом»).'
  prs.a2.unit38.lesson05.teach.museum_turn03:
    title: Самир спрашивает, во сколько музей открывается
    gloss: Ты знаешь, во сколько он открывается?
    note: О музее уже говорили, поэтому Самир его не повторяет. *ساعت چند باز می‌شود* — вложенный вопрос.
  prs.a2.unit38.lesson05.teach.museum_turn04:
    title: Самина не знает
    gloss: Нет, я не знаю, во сколько он открывается.
    note: Самина повторяет вложенный вопрос после *نمی‌دانم که*. *نه* — дружелюбное «нет».
  prs.a2.unit38.lesson05.teach.museum_turn05:
    title: Самир спрашивает, открыт ли музей завтра
    gloss: Ты не знаешь, открыт ли он завтра или нет?
    note: Вопрос с ответом «да» или «нет» с *یا نه*. *فردا* — «завтра».
  prs.a2.unit38.lesson05.teach.museum_turn06:
    title: Самина сначала позвонит
    gloss: Не знаю. Сначала позвоню.
    note: '*تیلفون می‌کنم* — «я звоню по телефону». *اول* — «сначала». Она позвонит, прежде чем ответить.'
  prs.a2.unit38.lesson05.teach.message:
    title: Сообщение с рынка
    gloss: Привет, Самина. Сегодня я на рынке. Ты знаешь, где банк? Я не знаю, рядом ли банк с рынком. Ты не знаешь, открыт ли банк сегодня? Потом я иду в библиотеку.
    note: 'Короткое сообщение с тремя косвенными вопросами: где банк, рядом ли он и открыт ли он. Обрати внимание: первый вопрос обращён к подруге (*می‌دانی*), а второй — утверждение (*نمی‌دانم که ... یا نه*).'
  prs.a2.unit38.lesson06.teach.gate:
    title: Ворота, дверь
    gloss: ворота, дверь
    note: '*دروازه* — ворота или большая дверь, например вокзала или учреждения.'
    example_gloss: Ворота открыты.
  prs.a2.unit38.lesson06.teach.thousand:
    title: Тысяча
    gloss: тысяча
    note: '*هزار* — «тысяча». *افغانی* — афганская валюта: *هزار افغانی* — «тысяча афгани».'
    example_gloss: Билет стоит тысячу афгани.
  prs.a2.unit38.lesson06.teach.station_turn01:
    title: Самир обращается к служащему
    gloss: Извините, вы не знаете, когда отправляется автобус в Мазар?
    note: Самир говорит с незнакомым человеком, поэтому употребляет *ببخشین* и *می‌دانین*. *بس به مزار* — «автобус в Мазар».
  prs.a2.unit38.lesson06.teach.station_turn02:
    title: Служащий отвечает
    gloss: Да, знаю. Автобус отправляется в восемь.
    note: Служащий говорит *بلی، می‌دانم* и называет время.
  prs.a2.unit38.lesson06.teach.station_turn03:
    title: Самир спрашивает о цене
    gloss: Вы не могли бы сказать, сколько стоит билет?
    note: 'Вежливая просьба: *می‌توانین بگویین که* и далее *بلیت چند است؟*.'
  prs.a2.unit38.lesson06.teach.station_turn04:
    title: Служащий называет цену
    gloss: Билет стоит тысячу афгани.
    note: Прямой ответ, без вложенного вопроса.
  prs.a2.unit38.lesson06.teach.station_turn05:
    title: Самир спрашивает про офис
    gloss: Спасибо. Вы знаете, где офис?
    note: '*تشکر* — «спасибо».'
  prs.a2.unit38.lesson06.teach.station_turn06:
    title: Служащий говорит, где офис
    gloss: Офис рядом с воротами.
    note: '*نزدیک دروازه است* — «он рядом с воротами».'
exercises:
  prs.a2.unit38.lesson01.exercise01.recognize_station:
    instruction: Что означает это предложение?
    correct_option: Вы не знаете, где вокзал?
    distractors:
    - Где станция?
    - Я знаю, где вокзал
