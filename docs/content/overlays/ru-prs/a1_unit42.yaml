    note: اما противопоставляет наличие приёма в понедельник его отсутствию во вторник.
  prs.a1.unit42.lesson06.teach.formal_question_phrase:
    title: В какой день вы свободны?
    gloss: В какой день вы свободны?
    note: Вежливый вариант вопроса о том, в какой день человек свободен, с شما.
