    title: 'Повторение: у меня нет, но, вы (вежливое)'
    gloss: у меня нет / но / вы (вежливое)
    note: ندارم, اما и شما — слова для повторения, с помощью которых противопоставляют два дня.
    target_text: ندارم (у меня нет) / اما (но) / شما (вы, вежливая форма)
  prs.a1.unit42.lesson06.teach.review_tuesday:
    title: 'Повторение: вторник'
    gloss: вторник
    note: سه‌شنبه — слово для повторения.
    target_text: سه‌شنبه (вторник)
