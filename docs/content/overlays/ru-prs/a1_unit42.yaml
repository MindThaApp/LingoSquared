teaching:
  prs.a1.unit42.lesson01.teach.review_appointment_doctor_have:
    title: 'Повторение: запись на приём, врач, у меня есть, есть'
    gloss: запись на приём / врач / у меня есть / есть
    note: قرار, داکتر, دارم и است — знакомые слова, которые нужны, чтобы говорить о записи на приём.
    target_text: قرار (договорённость, запись на приём) / داکتر (врач) / دارم (у меня есть) / است (есть, является)
  prs.a1.unit42.lesson01.teach.review_want_one:
    title: 'Повторение: я хочу, один'
    gloss: я хочу / один, какой-то
    note: می‌خواهم и یک вместе выражают, чего ты хочешь.
    target_text: می‌خواهم (я хочу) / یک (один, какой-то)
  prs.a1.unit42.lesson01.teach.tooth_word:
    title: Зуб
    gloss: зуб
    note: دندان — обычное слово дари для «зуб».
    example_gloss: У меня есть зуб.
  prs.a1.unit42.lesson01.teach.dentist_phrase:
    title: Стоматолог
    gloss: стоматолог
    note: داکتر دندان буквально означает «зубной врач» — это обычное афганское слово дари для стоматолога.
  prs.a1.unit42.lesson01.teach.want_appointment_phrase:
    title: Я хочу записаться на приём
    gloss: Я хочу записаться на приём.
    note: یک قرار می‌خواهم состоит из یک (один), قرار (запись на приём) и می‌خواهم (я хочу).
  prs.a1.unit42.lesson01.teach.review_with:
    title: 'Повторение: с'
    gloss: с
    note: با означает «с».
    target_text: با (с)
  prs.a1.unit42.lesson01.teach.want_appointment_dentist_phrase:
    title: Я хочу записаться на приём к стоматологу
    gloss: Я хочу записаться на приём к стоматологу.
    note: با داکتر دندان (к стоматологу) добавляется к یک قرار می‌خواهم.
  prs.a1.unit42.lesson02.teach.review_which_day:
    title: 'Повторение: какой, день'
    gloss: какой / день
    note: کدام и روز — знакомые слова, которые нужны, чтобы спросить о дне.
    target_text: کدام (какой) / روز (день)
  prs.a1.unit42.lesson02.teach.review_free_are:
    title: 'Повторение: свободный, вы есть (вежливо)'
    gloss: свободный / вы есть (вежливо)
    note: آزاد и استین вместе помогают спросить, свободен ли человек.
    target_text: آزاد (свободный) / استین (вы есть, вежливая форма)
  prs.a1.unit42.lesson02.teach.which_day_free_phrase:
    title: В какой день вы свободны?
    gloss: В какой день вы свободны?
    note: کدام روز آزاد استین؟ — вопрос о том, в какой день человек свободен.
  prs.a1.unit42.lesson02.teach.review_monday_am:
    title: 'Повторение: понедельник, я есть'
    gloss: понедельник / я есть
    note: دوشنبه и استم — знакомые слова, которые нужны для ответа.
    target_text: دوشنبه (понедельник) / استم (я есть)
  prs.a1.unit42.lesson02.teach.day_free_answer_phrase:
    title: В понедельник я свободен
    gloss: В понедельник я свободен.
    note: دوشنبه آزاد استم — ответ на вопрос с названием конкретного дня.
  prs.a1.unit42.lesson02.teach.review_hour_what:
    title: 'Повторение: час, сколько'
    gloss: час / сколько
    note: ساعت и چند (оба из уроков 9 и 11) вместе помогают спросить о времени.
    target_text: ساعت (час, часы) / چند (сколько, какой)
  prs.a1.unit42.lesson02.teach.what_time_free_phrase:
    title: В какое время вы свободны?
    gloss: В какое время вы свободны?
    note: ساعت چند آزاد استین؟ — вопрос о том, в какое время человек свободен.
  prs.a1.unit42.lesson03.teach.review_want_appointment:
    title: 'Повторение: я хочу, запись на приём'
    gloss: я хочу / запись на приём
    note: می‌خواهم и قرار — знакомые слова, которые нужны, чтобы попросить о записи на приём.
    target_text: می‌خواهم (я хочу) / قرار (запись на приём)
  prs.a1.unit42.lesson03.teach.get_word:
    title: Взять, получить
    gloss: взять, получить
    note: بگیرم — форма сослагательного наклонения («чтобы я взял, получил»); с می‌خواهم она значит «я хочу взять, получить».
    example_gloss: Я хочу записаться на приём.
  prs.a1.unit42.lesson03.teach.for_word:
    title: Для
    gloss: для
    note: برای означает «для».
    example_gloss: К стоматологу.
  prs.a1.unit42.lesson03.teach.review_ten_how:
    title: 'Повторение: десять, как'
    gloss: десять / как
    note: ده и چطور — слова для повторения, с помощью которых предлагают время.
    target_text: ده (десять) / چطور (как)
  prs.a1.unit42.lesson03.teach.confirm_time_phrase:
    title: Как насчёт понедельника в десять?
    gloss: Как насчёт понедельника в десять?
    note: دوشنبه ساعت ده چطور است؟ — так предлагают конкретный день и время.
  prs.a1.unit42.lesson03.teach.review_very_good:
    title: 'Повторение: очень, хорошо'
    gloss: очень / хорошо
    note: بسیار и خوب — слова для повторения, с помощью которых подтверждают время.
    target_text: بسیار (очень) / خوب (хороший)
  prs.a1.unit42.lesson03.teach.confirm_answer_phrase:
    title: Это очень хорошо
    gloss: Это очень хорошо.
    note: بسیار خوب است подтверждает, что предложенное время подходит.
  prs.a1.unit42.lesson04.teach.review_greeting_want:
