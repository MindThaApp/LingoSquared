    gloss: здравствуйте / я хочу
    note: سلام и می‌خواهم — слова для повторения, использованные в диалоге.
    target_text: سلام (здравствуйте) / می‌خواهم (я хочу)
  prs.a1.unit42.lesson04.teach.review_thanks_welcome:
