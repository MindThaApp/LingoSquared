    note: منشی — секретарь или администратор, человек, который отвечает на звонки в кабинете врача или стоматолога.
    example_gloss: Я секретарь.
  prs.a1.unit42.lesson04.teach.dialogue_line1:
    title: 'Хумаюн: Здравствуйте. Я хочу записаться на приём к стоматологу.'
    gloss: Здравствуйте. Я хочу записаться на приём к стоматологу.
  prs.a1.unit42.lesson04.teach.dialogue_line2:
    title: 'Секретарь: Здравствуйте. В какой день вы свободны?'
    gloss: Здравствуйте. В какой день вы свободны?
  prs.a1.unit42.lesson04.teach.dialogue_line3:
    title: 'Хумаюн: Я свободен в понедельник.'
    gloss: Я свободен в понедельник.
  prs.a1.unit42.lesson04.teach.dialogue_line4:
    title: 'Секретарь: Очень хорошо. Как насчёт понедельника в десять?'
    gloss: Очень хорошо. Как насчёт понедельника в десять?
  prs.a1.unit42.lesson04.teach.dialogue_line5:
    title: 'Хумаюн: Это очень хорошо. Большое спасибо.'
    gloss: Это очень хорошо. Большое спасибо.
  prs.a1.unit42.lesson04.teach.dialogue_line6:
    title: 'Секретарь: Пожалуйста.'
    gloss: Пожалуйста.
