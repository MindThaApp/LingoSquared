    gloss: Хумаюн / он, она / у него (неё) есть
    note: همایون, او и دارد — слова для повторения, использованные в тексте для чтения.
    target_text: همایون (Хумаюн) / او (он, она) / دارد (у него, у неё есть)
  prs.a1.unit42.lesson05.teach.reading_passage:
    title: Чтение о приёме
    gloss: У Хумаюна назначен приём. Его приём у стоматолога. Его приём в понедельник. Его приём в десять часов. Хумаюн доволен.
