teaching:
  prs.a1.unit11.lesson01.teach.saat_word:
    title: Час / часы
    gloss: час / часы
    note: '*ساعت* означает и «час», и «часы», а также обозначает точное время («ровно … часов») в выражениях времени.'
    example_gloss: Который час?
  prs.a1.unit11.lesson01.teach.daqiqa_word:
    title: Минута
    gloss: минута
    note: '*دقیقه* означает «минута».'
    example_gloss: Подождите пять минут.
  prs.a1.unit11.lesson01.teach.nim_word:
    title: Половина
    gloss: половина
    note: '*نیم* означает «половина» и используется для получаса (например, *ساعت سه و نیم* — половина четвёртого).'
    example_gloss: Половина восьмого.
  prs.a1.unit11.lesson01.teach.rub_word:
    title: Четверть
    gloss: четверть
    note: '*ربع* означает «четверть» и используется для четверти часа (например, *ساعت چهار و ربع* — четверть пятого).'
    example_gloss: Без четверти восемь.
  prs.a1.unit11.lesson01.teach.numbers_review:
    title: Числа 1–5 (повторение)
    gloss: один, два, три, четыре, пять
    note: '*یک، دو، سه، چهار، پنج* повторяют числа из раздела 4; они нужны, чтобы называть время.'
    example_gloss:
    - У меня одна книга.
    - У меня два брата.
    - У меня три сестры.
    - Осталось четыре дня.
    - Подождите пять минут.
  prs.a1.unit11.lesson02.teach.chand_word:
    title: Сколько / какой
    gloss: сколько / какой
    note: '*چند* вместе с *ساعت* служит для вопроса о времени: *ساعت چند است؟*'
    example_gloss: Который час?
  prs.a1.unit11.lesson02.teach.saat_chand_ast:
    title: Который час?
    gloss: Который час?
    note: '*ساعت چند است؟* — нейтральный вежливый способ спросить время на дари.'
  prs.a1.unit11.lesson02.teach.register_note:
    title: О стиле речи
    gloss: ساعت چند است؟ (полная нейтральная форма)
    note: '*ساعت چند است؟* — полная нейтральная форма: она правильна и на письме, и в речи. В быстрой разговорной речи *است* часто сокращается до конечного -ه (как в *چنده*), но пока ты учишься, пользуйся полной формой.'
    target_text: ساعت چند است؟ (полная нейтральная форма)
  prs.a1.unit11.lesson03.teach.saat_se_ast:
    title: Три часа.
    gloss: Три часа.
    note: '*ساعت سه است* называет время ровно в начале часа.'
  prs.a1.unit11.lesson03.teach.saat_se_o_nim:
    title: Половина четвёртого.
    gloss: Половина четвёртого.
    note: '*و* («и») соединяет час и половину: *ساعت سه و نیم است*.'
  prs.a1.unit11.lesson03.teach.saat_char_o_rub:
    title: Четверть пятого.
    gloss: Четверть пятого.
    note: '*ساعت چهار و ربع است* добавляет к часу четверть.'
  prs.a1.unit11.lesson04.teach.sobh_review:
    title: Утро (повторение)
    gloss: утро
    note: '*صبح* повторяет утреннее приветствие из раздела 1 (*صبح بخیر*).'
    example_gloss: Я рано просыпаюсь утром.
  prs.a1.unit11.lesson04.teach.zohr_word:
    title: Полдень
    gloss: полдень
    note: '*ظهر* означает «полдень» — это новое слово, его не было в приветствиях раздела 1.'
    example_gloss: В полдень я обедаю.
  prs.a1.unit11.lesson04.teach.asr_review:
    title: День / вечер (повторение)
    gloss: время после полудня
    note: '*عصر* повторяет приветствие для второй половины дня и вечера из раздела 1 (*عصر بخیر*).'
    example_gloss: Я работаю во второй половине дня.
  prs.a1.unit11.lesson04.teach.shab_review:
    title: Ночь (повторение)
    gloss: ночь
    note: '*شب* повторяет пожелание на ночь из раздела 1 (*شب بخیر*).'
    example_gloss: Ночью я рано ложусь спать.
  prs.a1.unit11.lesson04.teach.saat_noh_sobh:
    title: Девять утра.
    gloss: Девять утра.
    note: '*ساعت نه صبح است* соединяет время с частью суток.'
  prs.a1.unit11.lesson04.teach.haft_word:
    title: Семь (7)
    gloss: семь (7)
    note: '*هفت* означает «семь»; слово нужно, чтобы сказать «семь вечера».'
    example_gloss: Я приду в семь.
  prs.a1.unit11.lesson05.teach.qarar_word:
    title: Встреча
    gloss: встреча (назначенная)
    note: '*قرار* означает «назначенная встреча» — новое слово для личных договорённостей в этом разделе; оно отличается от *جلسه* («собрание»), которое встречалось ранее в диалоге о назначении собрания.'
    example_gloss: У меня назначена встреча.
  prs.a1.unit11.lesson05.teach.qarar_saat_chand:
    title: На какое время у вас назначена встреча?
    gloss: На какое время у вас назначена встреча?
    note: '*قرار شما ساعت چند است؟* вежливо (*شما*) спрашивает, на какое время у человека назначена встреча.'
  prs.a1.unit11.lesson05.teach.qarar_answer:
    title: Моя встреча в половине девятого.
    gloss: Моя встреча в половине девятого.
    note: '*قرار من ساعت هشت و نیم است* — так ты называешь время своей встречи.'
  prs.a1.unit11.lesson06.teach.names:
    title: Зармина и Хумаюн
    gloss: Зармина, Хумаюн
    note: '*زرمینه* и *همایون* — двое собеседников в диалоге этого урока.'
    example_gloss:
    - Зармина придёт в семь.
    - Хумаюн придёт в восемь.
  prs.a1.unit11.lesson06.teach.dialogue_line1:
    title: Извините, во сколько собрание?
    gloss: Извините, во сколько собрание?
    note: Зармина вежливо спрашивает, во сколько собрание.
  prs.a1.unit11.lesson06.teach.dialogue_line2:
    title: Собрание в девять утра.
    gloss: Собрание в девять утра.
    note: Хумаюн называет время собрания.
  prs.a1.unit11.lesson06.teach.dialogue_line3:
    title: В девять? Хорошо. Я приду в половине девятого.
    gloss: В девять? Хорошо. Я приду в половине девятого.
    note: Зармина подтверждает время и называет, когда придёт сама.
  prs.a1.unit11.lesson06.teach.dialogue_line4:
    title: Очень хорошо, я буду ждать.
    gloss: Очень хорошо, я буду ждать.
    note: В *منتظر استم* («я жду») используется уже знакомое окончание связки *استم*.
