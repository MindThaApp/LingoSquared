course:
  title: Дари A2
  description: 'Афганский дари, уровень выше начального: пошаговый рассказ о том, как прошло утро или поездка, в том числе о пропущенном шаге. Составные глаголы в простом прошедшем времени, отрицание на вспомогательном глаголе, место را и связки اول، بعد، بعد از آن، در آخر.'
units:
  prs.a2.unit22.busy_morning:
    title: Хлопотное утро
lessons:
  prs.a2.unit22.lesson01.morning_words_and_compound_verbs:
    title: Утренние слова и составные глаголы
  prs.a2.unit22.lesson02.more_compound_verbs:
    title: Ещё составные глаголы
  prs.a2.unit22.lesson03.negative_compound_verbs:
    title: Отрицание составных глаголов и место را
  prs.a2.unit22.lesson04.telling_in_order:
    title: Рассказываем по порядку
  prs.a2.unit22.lesson05.reading_and_listening:
    title: 'Читаем и слушаем: хлопотное утро'
  prs.a2.unit22.lesson06.morning_conversation:
    title: Разговор об утре
teaching:
  prs.a2.unit22.lesson01.teach.this_morning:
    title: Сегодня утром
    gloss: сегодня утром
    note: '*امروز* — «сегодня», *صبح* — «утро». Вместе *امروز صبح* — «сегодня утром», временные рамки этого урока. В предложении на дари слово со значением времени стоит в начале, а глагол — в конце.'
    example_gloss: Сегодня утром я ходил в офис.
  prs.a2.unit22.lesson01.teach.late_early:
    title: Поздно, рано
    gloss: поздно, рано
    note: '*دیر* значит «поздно», *زود* — «рано». Оба слова стоят перед глагольной частью предложения. В русском их место свободнее, а в дари они обычно стоят перед глаголом.'
    example_gloss:
    - Сегодня утром я проснулся поздно.
    - Сегодня он проснулся рано.
  prs.a2.unit22.lesson01.teach.office:
    title: Офис
    gloss: офис
    note: '*دفتر* — офис, место, где в Кабуле по утрам в будни работают многие.'
    example_gloss: Утром я пошёл в офис.
  prs.a2.unit22.lesson01.teach.school:
    title: Школа
    gloss: школа
    note: '*مکتب* — обычное афганское слово для школы. Идти туда нужно с *به*, как в *به مکتب رفتم*.'
    example_gloss: Утром он пошёл в школу.
  prs.a2.unit22.lesson01.teach.by_bus_car:
    title: На автобусе, на машине
    gloss: на автобусе, на машине
    note: '*با* значит «с» или «на (чём-то)». *با بس* — «на автобусе», *با موتر* — «на машине». *بس* — автобус, а *موتر* — афганское слово для машины.'
    example_gloss:
    - Я поехал в офис на автобусе.
    - Мы поехали в школу на машине.
  prs.a2.unit22.lesson01.teach.on_foot:
    title: Пешком
    gloss: пешком
    note: '*پیاده* значит «пешком». *پیاده رفتن* — идти пешком, добираться до места пешком; *پیاده* стоит прямо перед глаголом.'
    example_gloss: Я пошёл в школу пешком.
  prs.a2.unit22.lesson01.teach.bus_stop:
    title: Автобусная остановка, станция
    gloss: автобусная остановка, остановка
    note: '*ایستگاه* — остановка или станция. *ایستگاه بس* — автобусная остановка.'
    example_gloss: Я пошёл на автобусную остановку.
  prs.a2.unit22.lesson01.teach.gate:
    title: Ворота, дверь
    gloss: ворота, наружная дверь дома
    note: '*دروازه* — ворота или наружная дверь дома. Вы открываете их каждое утро, поэтому в следующих уроках вам встретится это слово с маленьким словом *را*.'
    example_gloss: Я открыл ворота.
  prs.a2.unit22.lesson01.teach.clothes:
    title: Моя одежда
    gloss: моя одежда
    note: '*لباس* — «одежда», *لباس‌ها* — «одежды, вещи» (окончание множественного числа *-ها* пишется с небольшим промежутком), а *-م* добавляет значение «мой»: *لباس‌هایم* — «моя одежда».'
    example_gloss: Я оделся.
  prs.a2.unit22.lesson01.teach.shower:
    title: Душ
    gloss: душ
    note: '*دوش* — душ. На дари душ не «моют», а «берут», с глаголом *گرفتن*, который встретится в следующем уроке.'
    example_gloss: Утром я принял душ.
  prs.a2.unit22.lesson01.teach.tea:
    title: Чай
    gloss: чай
    note: '*چای* — чай, привычный утренний напиток. На дари чай «едят», поэтому глагол здесь *خوردن*.'
    example_gloss: Утром я выпил чаю.
  prs.a2.unit22.lesson01.teach.breakfast:
    title: Завтрак
    gloss: завтрак
    note: '*صبحانه* — завтрак. В Кабуле для этого приёма пищи также говорят *ناشتا*; в этом курсе используется *صبحانه*.'
    example_gloss: На завтрак я съел хлеб и выпил чаю.
  prs.a2.unit22.lesson01.teach.wake_up:
    title: Просыпаться
    gloss: 'просыпаться (буквально: становиться бодрствующим)'
    note: '*بیدار* значит «бодрствующий», а *شدن* — «становиться». Вместе *بیدار شدن* — «просыпаться». Это составной глагол: не глагольное слово (здесь прилагательное) плюс вспомогательный глагол.'
    example_gloss: Сегодня утром я проснулся.
  prs.a2.unit22.lesson01.teach.get_ready:
    title: Собираться
    gloss: 'собираться, быть готовым (буквально: становиться готовым)'
    note: '*آماده* значит «готовый», а *شدن* — «становиться». *آماده شدن* — «собраться, подготовиться», ещё один составной глагол со *شدن*.'
    example_gloss: Сегодня утром я собрался.
  prs.a2.unit22.lesson01.teach.open:
    title: Открывать
    gloss: 'открывать (буквально: делать открытым)'
    note: '*باز* значит «открытый», а *کردن* — «делать». *باز کردن* — «открывать». Это составной глагол с *کردن*: вы делаете что-то открытым.'
    example_gloss: Я открыл ворота.
  prs.a2.unit22.lesson01.teach.went_office:
    title: Я пошёл в офис
    gloss: Я ходила в офис.
    note: '*رفتم* — простое прошедшее время от *رفتن* из урока 19: основа прошедшего времени *رفت* плюс *-م*. *به* значит «в, к», поэтому *به دفتر رفتم* — «я пошёл в офис».'
  prs.a2.unit22.lesson01.teach.opened_gate:
    title: я открыл ворота
    gloss: Я открыл ворота.
    note: '*را* — маленькое слово, которое отмечает конкретный объект, здесь ворота. Пока выучите предложение целиком. Где именно стоит *را*, объясняется в уроке 3.'
  prs.a2.unit22.lesson01.teach.compound_rule:
    title: 'Составные глаголы в прошедшем времени: окончание ставится на вспомогательный глагол'
    gloss: я проснулся, ты проснулся, он/она проснулся(ась), мы проснулись, вы проснулись (вежливо или мн. число), они проснулись
    note: 'Многие повседневные глаголы в дари — составные: существительное или прилагательное плюс вспомогательный глагол, например *شدن* или *کردن*. *بیدار شدن* (просыпаться), *آماده شدن* (готовиться) и *باز کردن* (открывать) — всё это составные глаголы. В простом прошедшем времени первая часть не меняется. Окончание прошедшего времени, которое ты уже знаешь по форме *رفتم*, получает только вспомогательный глагол: возьми инфинитив, отбрось *ن* (из *شدن* получается *شد*), затем добавь *-م، -ی، nothing، -یم، -ین، -ند*. Так, *بیدار شدم* значит «я проснулся», *بیدار شدی* — «ты проснулся» (другу), *بیدار شد* — «он или она проснулся(-лась)», *بیدار شدیم* — «мы проснулись», *بیدار شدین* — «вы проснулись» (вежливо или во множественном числе), *بیدار شدند* — «они проснулись». Местоимение необязательно, потому что окончание уже показывает, кто совершил действие.'
  prs.a2.unit22.lesson02.teach.take_shower:
    title: Принимать душ
    gloss: принимать душ
    note: '*دوش گرفتن* — «принимать душ». Вспомогательный глагол здесь *گرفتن*, «брать». Его основа прошедшего времени — *گرفت*, поэтому «я принял душ» — *دوش گرفتم*.'
    example_gloss: Сегодня утром я принял душ.
  prs.a2.unit22.lesson02.teach.take_walk:
    title: Гулять
    gloss: гулять, прогуливаться
    note: '*قدم* — шаг. *قدم زدن* — «гулять» для удовольствия, без цели. Вспомогательный глагол *زدن*, его основа прошедшего времени — *زد*: *قدم زدم* — «я погулял». Сравните с *پیاده رفتن* — «идти пешком до места».'
    example_gloss: Я погулял в парке.
  prs.a2.unit22.lesson02.teach.talk:
    title: Разговаривать, говорить
    gloss: разговаривать, говорить
    note: '*حرف* — слово или речь. *حرف زدن* — «разговаривать», снова со *زدن*: *حرف زدم* — «я поговорил».'
    example_gloss: Я поговорил с другом.
  prs.a2.unit22.lesson02.teach.my_friend:
    title: Мой друг
    gloss: мой друг
    note: '*دوست* — друг, а *-م* добавляет «мой»: *دوستم* — «мой друг». Когда звонишь, перед ним ставится *به*: *به دوستم*.'
    example_gloss: Сегодня утром я поговорил с другом.
  prs.a2.unit22.lesson02.teach.phone:
    title: Звонить
    gloss: звонить, позвонить по телефону
    note: '*تیلفون* — это телефон. *تیلفون کردن* — звонить по телефону, ещё один составной глагол с *کردن*. Тот, кому звонишь, ставится с *به*: *به دوستم تیلفون کردم*.'
    example_gloss: Я позвонил(а) другу.
  prs.a2.unit22.lesson02.teach.wait:
    title: Ждать
    gloss: 'ждать (буквально: тянуть ожидание)'
    note: '*انتظار* — это ожидание. *انتظار کشیدن* — ждать. Служебный глагол здесь *کشیدن*, «тянуть», его прошедшая основа — *کشید*: *انتظار کشیدم* — «я ждал(а)».'
    example_gloss: Я ждал(а) на остановке.
  prs.a2.unit22.lesson02.teach.get_on:
    title: Садиться (в транспорт)
    gloss: садиться (в автобус, в машину)
    note: '*سوار* означает «севший, находящийся в транспорте», а *شدن* — «становиться». *سوار شدن* — сесть в автобус или в машину. То, во что садишься, ставится с *به*: *به بس سوار شدم*.'
    example_gloss: Я сел(а) в автобус.
  prs.a2.unit22.lesson02.teach.get_off:
    title: Выходить (из транспорта)
    gloss: выходить (из транспорта)
    note: '*پیاده شدن* — выйти из автобуса или машины. Будь внимателен: *پیاده رفتم* — «я шёл пешком», а *پیاده شدم* — «я вышел». Транспорт, из которого выходишь, ставится с *از*: *از بس پیاده شدم*.'
    example_gloss: Я вышел (вышла) из автобуса.
  prs.a2.unit22.lesson02.teach.put_on:
    title: Надевать, носить
    gloss: надевать (одежду), носить
    note: '*پوشیدن* — надевать одежду. Это простой глагол, а не составной: его прошедшая основа — *پوشید*, поэтому *پوشیدم* — «я надел(а)».'
    example_gloss: Я оделся.
  prs.a2.unit22.lesson02.teach.close:
    title: Закрывать
    gloss: закрывать
    note: '*بستن* — закрывать. Это простой глагол с прошедшей основой *بست*, поэтому *بستم* — «я закрыл(а)». Он противоположен по смыслу *باز کردن*.'
    example_gloss: Я закрыл(а) ворота.
  prs.a2.unit22.lesson02.teach.arrive:
    title: Приходить, прибывать
    gloss: приходить, добираться
    note: '*رسیدن* — прибывать, приходить. Место, куда прибываешь, ставится с *به*, а прошедшая основа — *رسید*: *به دفتر رسیدم* — «я пришёл (пришла) в офис».'
    example_gloss: Я пришёл (пришла) в офис.
  prs.a2.unit22.lesson02.teach.light_verbs:
    title: Пять служебных глаголов и их прошедшие основы
    gloss: я проснулся (проснулась), я открыл(а), я принял(а) душ, я прогулялся (прогулялась), я ждал(а)
    note: 'Составной глагол получает значение от обеих частей, поэтому учи служебный глагол вместе с первой частью. Эти пять служебных глаголов образуют большинство составных глаголов, связанных с утром. *شدن* (прошедшая основа *شد*) — «становиться»: *بیدار شدم*, *سوار شدم*. *کردن* (*کرد*) — «делать»: *باز کردم*, *تیلفون کردم*. *گرفتن* (*گرفت*) — «брать»: *دوش گرفتم*. *زدن* (*زد*) — «бить, ударять», но в составных глаголах он просто выражает действие: *قدم زدم*, *حرف زدم*. *کشیدن* (*کشید*) — «тянуть»: *انتظار کشیدم*. Окончание присоединяется к основе служебного глагола так же, как в *رفتم*. Простые глаголы, такие как *پوشیدن* (*پوشیدم*), *بستن* (*بستم*) и *رسیدن* (*رسیدم*), принимают те же окончания.'
  prs.a2.unit22.lesson03.teach.neg_rule:
    title: 'Отрицание составного глагола: ن ставится перед служебным глаголом'
    gloss: я не проснулся (не проснулась), ты не проснулся (не проснулась), он/она не проснулся (не проснулась), мы не проснулись, вы не проснулись, они не проснулись
    note: 'В уроке 19 ты ставил(а) *ن* перед простым глаголом прошедшего времени: *رفتم* превращалось в *نرفتم*. Составной глагол состоит из двух частей, и *ن* ставится перед служебным глаголом, но никогда не перед первой частью. *بیدار شدم* («я проснулся») превращается в *بیدار نشدم* («я не проснулся»), и шесть форм такие: *بیدار نشدم، بیدار نشدی، بیدار نشد، بیدار نشدیم، بیدار نشدین، بیدار نشدند*. То же правило работает для каждого служебного глагола: *نکردم، نگرفتم، نزدم، نکشیدم*. Писать *نبیدار شدم* неправильно. Простые глаголы ведут себя как раньше: *نپوشیدم، نبستم، نرسیدم*. В отрицательном простом прошедшем по-прежнему нет *نمی*.'
  prs.a2.unit22.lesson03.teach.neg_phone_walk:
    title: То же ن с пятью служебными глаголами
    gloss: я не позвонил(а), я не прогулялся (не прогулялась), я не ждал(а), я не принял(а) душ, я не открыл(а)
    note: 'Возьми пять служебных глаголов из прошлого урока и поставь *ن* перед каждым: *کردم* даёт *نکردم* (*تیلفون نکردم*, *باز نکردم*), *زدم* даёт *نزدم* (*قدم نزدم*), *کشیدم* даёт *نکشیدم* (*انتظار نکشیدم*), *گرفتم* даёт *نگرفتم* (*دوش نگرفتم*). Первая часть остаётся на месте, а глагол после неё становится отрицательным.'
  prs.a2.unit22.lesson03.teach.no_breakfast:
    title: Я не завтракал(а)
    gloss: Я не завтракал(а).
    note: '*نخوردم* — это *ن* плюс *خوردم*. *خوردن* — простой глагол, поэтому *ن* стоит перед всем глаголом. В уроке 19 ты встречал(а) *خوردی* — «ты ел(а)», обращение к другу: *صبحانه خوردی؟* — «ты завтракал(а)?»'
  prs.a2.unit22.lesson03.teach.on_time:
    title: Вовремя
    gloss: вовремя
    note: '*وقت* — это время. *به وقت* — вовремя. Оно ставится перед глаголом, поэтому *به وقت بیدار نشدم* — «я не проснулся (не проснулась) вовремя».'
    example_gloss: Сегодня утром я не проснулся (не проснулась) вовремя.
  prs.a2.unit22.lesson03.teach.make_tea:
    title: Готовить
    gloss: 'готовить, заваривать (буквально: делать правильным)'
    note: '*درست* означает «правильный, верный», а *درست کردن* — «приготовить» что-либо, например чай или еду. Это составной глагол с *کردن*. Объект стоит перед ним: *چای درست کردم*.'
    example_gloss: Я заварил(а) чай.
  prs.a2.unit22.lesson03.teach.ra_rule:
    title: Где стоит را перед составным глаголом
    gloss: Я открыл(а) ворота. Я не открыл(а) ворота. Я не оделся (не оделась). Я заварил(а) чай.
    note: 'Когда прямое дополнение — определённый предмет, то есть известный или конкретный (*دروازه* — ворота, которые ты открываешь каждое утро, или *لباس‌هایم* — твоя собственная одежда), в дари он отмечается *را*. В составном глаголе *را* стоит сразу после дополнения и перед первой частью глагола: *دروازه را باز کردم*, но никогда не посередине *باز کردم*. Составной глагол остаётся цельным, а отрицание строится по тому же правилу: *دروازه را باز نکردم*. Если дополнение неопределённое, как в *چای درست کردم* («я заварил(а) чай», какой-то чай), *را* не употребляется.'
  prs.a2.unit22.lesson04.teach.first:
    title: Сначала
    gloss: сначала
    note: '*اول* открывает последовательность. Оно стоит в начале первой части высказывания.'
    example_gloss: Сначала я принял(а) душ.
  prs.a2.unit22.lesson04.teach.then:
    title: Потом
    gloss: потом, затем
    note: '*بعد* продолжает последовательность после *اول*. Оно стоит в начале предложения, которое вводит.'
    example_gloss: Потом я оделся (оделась).
  prs.a2.unit22.lesson04.teach.after_that:
    title: После этого
    gloss: после этого
    note: '*بعد از آن* означает «после этого». Это чуть более полная форма *بعد*, она удобна, когда ты уже использовал(а) *بعد* и есть третий шаг.'
    example_gloss: После этого я закрыл(а) ворота.
  prs.a2.unit22.lesson04.teach.finally:
    title: Наконец
    gloss: наконец, в конце концов
    note: '*در آخر* завершает последовательность после *اول*، *بعد* и *بعد از آن*. *آخر* означает «конец».'
    example_gloss: Наконец я пришёл (пришла) в офис.
  prs.a2.unit22.lesson04.teach.but:
    title: Но
    gloss: но
    note: '*ولی* противопоставляет шаг, который ты сделал(а), шагу, который не сделал(а), или наоборот.'
    example_gloss: Я не завтракал(а), но выпил(а) чаю.
  prs.a2.unit22.lesson04.teach.no:
    title: Нет
    gloss: нет
    note: '*نخیر* — вежливое повседневное «нет», которым отвечают на вопрос «да или нет». Между друзьями можно услышать и более короткое *نی*.'
    example_gloss: Нет, я не звонил(а).
  prs.a2.unit22.lesson04.teach.start_work:
    title: Начинать
    gloss: начинать
    note: '*شروع* — начало, а *شروع کردن* — «начинать». Это составной глагол с *کردن*, а *کار* — «работа»: *کار را شروع کردم* — «я начал(а) работу».'
    example_gloss: Я начал(а) работу.
  prs.a2.unit22.lesson04.teach.order_rule:
    title: Рассказ об утре по порядку
    gloss: Сначала я принял(а) душ, потом оделся (оделась), после этого открыл(а) ворота и наконец пошёл (пошла) в офис пешком.
    note: 'Чтобы рассказать, как прошло утро, дай каждому завершённому шагу свой глагол в прошедшем времени и обозначь порядок словами *اول* («сначала»), *بعد* («потом»), *بعد از آن* («после этого») и *در آخر* («наконец»). Шаги идут в том порядке, в каком происходили. Соединяй их запятой, точкой или *و*: *اول دوش گرفتم، بعد لباس‌هایم را پوشیدم.* Чтобы добавить шаг, которого не было, поставь отрицательный составной глагол: *بعد از آن تیلفون نکردم.* Связующее слово стоит в начале своей части, а глагол остаётся в конце.'
  prs.a2.unit22.lesson05.teach.way:
    title: Путь, дорога
    gloss: путь, дорога; по дороге (с در)
    note: '*راه* — это путь или дорога. *در راه* — «по дороге». Это говорит, на каком отрезке пути что-то произошло.'
    example_gloss: По дороге мы разговаривали.
  prs.a2.unit22.lesson05.teach.we_form:
    title: 'Делать вместе: окончание «мы» -یم'
    gloss: Мы с другом пошли в школу пешком. По дороге мы разговаривали. Наконец мы пришли в школу.
    note: 'Когда друг делает эти шаги вместе с тобой, замени окончание *-م* на *-یم*: *رفتیم* («мы пошли»), *حرف زدیم* («мы поговорили»), *رسیدیم* («мы пришли»). В составном глаголе окончание по-прежнему ставится только на служебный глагол: *حرف زدیم*, а не *حرف‌یم زد*. Отрицание строится так же: *حرف نزدیم* — «мы не разговаривали».'
  prs.a2.unit22.lesson05.teach.message:
    title: Сорайя пишет о своём утре
    gloss: Сегодня утром я проснулась рано. Сначала я приняла душ и оделась. Потом я позавтракала, но чай не заварила. После этого я открыла ворота. Мы с подругой пошли в школу пешком. По дороге мы разговаривали. Наконец мы пришли в школу.
    note: 'Короткий письменный рассказ по порядку. Каждый шаг — завершённое действие в прошедшем времени; составные глаголы *بیدار شدم*, *دوش گرفتم*, *حرف زدیم* и отрицательный *درست نکردم* держат служебный глагол в конце. Один шаг не произошёл: *چای درست نکردم*.'
  prs.a2.unit22.lesson05.teach.exchange_q:
    title: Навид спрашивает Сорайю о чае
    gloss: Сорайя, ты заваривала чай сегодня утром?
    note: 'Навид спрашивает прошедшим временем составного глагола, *درست کردی*, в форме «ты» (для друга): окончание *-ی* стоит на служебном глаголе.'
  prs.a2.unit22.lesson05.teach.exchange_a:
    title: Сорайя отвечает
    gloss: Нет, чай я не заваривала. Я позавтракала.
    note: Сорайя сначала говорит, чего не было, *چای درست نکردم*, а затем что было, *صبحانه خوردم*.
  prs.a2.unit22.lesson06.teach.turn01:
    title: Сорайя спрашивает Навида о его утре
    gloss: Навид, что ты делал сегодня утром?
    note: '*چه کار کردی؟* — «что ты делал(а)?» Вопрос о завершённом действии, поэтому используется прошедшее время *کردی*.'
  prs.a2.unit22.lesson06.teach.turn02:
    title: Навид называет первые шаги и шаг, который пропустил
    gloss: Сначала я поздно проснулся, потом принял душ и оделся. Я не завтракал.
    note: Навид использует *اول* и *بعد* для порядка и заканчивает отрицательным шагом, *صبحانه نخوردم*.
  prs.a2.unit22.lesson06.teach.turn03:
    title: Сорайя спрашивает, что было дальше
    gloss: Что ты делал после этого?
    note: '*بعد از آن* — «после этого», поэтому она спрашивает о следующем шаге.'
  prs.a2.unit22.lesson06.teach.turn04:
    title: Навид рассказывает, как добирался до работы
    gloss: Я открыл ворота и пошёл пешком на остановку. На остановке я подождал и сел в автобус.
    note: 'Четыре завершённых шага с четырьмя глаголами в прошедшем времени: *باز کردم، رفتم، انتظار کشیدم، سوار شدم*. Обрати внимание на *دروازه را باز کردم*: *را* стоит сразу после дополнения.'
  prs.a2.unit22.lesson06.teach.turn05:
    title: Сорайя спрашивает о звонке
    gloss: Ты мне звонил?
    note: Вопрос «да или нет» о завершённом действии. *به من* — «мне».
  prs.a2.unit22.lesson06.teach.turn06:
    title: Навид отвечает «нет» и заканчивает рассказ
    gloss: Нет, я не звонил. Но наконец я пришёл в офис.
    note: '*نخیر، تیلفون نکردم* — ответ отрицательным составным глаголом. Затем *ولی در آخر* завершает рассказ.'
exercises:
  prs.a2.unit22.lesson01.exercise01.recognize_woke_late:
    instruction: Что означает это предложение?
    correct_option: Сегодня утром я поздно проснулся (проснулась)
    distractors:
    - Сегодня утром я проснулся (проснулась) рано
    - Сегодня утром я поздно собрался (собралась)
    - Вчера утром я поздно проснулся (проснулась)
    accepted_answers:
    - value: Сегодня утром я поздно проснулся (проснулась)
      status: correct
    feedback: '*بیدار شدم* — «я проснулся (проснулась)», а *دیر* — «поздно»: *امروز صبح دیر بیدار شدم* — «сегодня утром я поздно проснулся (проснулась)».'
  prs.a2.unit22.lesson01.exercise02.recognize_opened_gate:
    instruction: Что означает это предложение?
    correct_option: я открыл ворота
    distractors:
    - Я закрыл(а) ворота
    - Я пошёл (пошла) к воротам
    - Я не открыл(а) ворота
    accepted_answers:
    - value: я открыл ворота
      status: correct
    feedback: '*باز کردم* — «я открыл(а)»: *باز* плюс прошедшее время *کردن* с окончанием *-م*.'
  prs.a2.unit22.lesson01.exercise03.recognize_by_bus:
    instruction: Что означает это предложение?
    correct_option: Я поехал (поехала) в офис на автобусе
    distractors:
    - Я пошёл (пошла) в офис пешком
    - Я поехал (поехала) в офис на машине
    - Я поехал (поехала) в школу на автобусе
    accepted_answers:
    - value: Я поехал (поехала) в офис на автобусе
      status: correct
    feedback: '*با بس* — «на автобусе». *پیاده* означало бы «пешком», а *با موتر* — «на машине».'
  prs.a2.unit22.lesson01.exercise04.match_morning_words:
    instruction: Соедини каждое слово на дари с его значением.
    accepted_answers:
    - value:
        بس: автобус
        موتر: машина
        پیاده: пешком
        ایستگاه: автобусная остановка
        دفتر: офис
        مکتب: школа
        دروازه: ворота
        لباس‌هایم: моя одежда
        دوش: душ
        چای: чай
      status: correct
    feedback: Это места, способы передвижения и предметы утра, которые используются в остальной части урока.
    pairs:
    - left: بس
      right: автобус
    - left: موتر
      right: машина
    - left: پیاده
      right: пешком
    - left: ایستگاه
      right: автобусная остановка
    - left: دفتر
      right: офис
    - left: مکتب
      right: школа
    - left: دروازه
      right: ворота
    - left: لباس‌هایم
      right: моя одежда
    - left: دوش
      right: душ
    - left: چای
      right: чай
  prs.a2.unit22.lesson01.exercise05.order_woke_late:
    instruction: 'Расставь слова так, чтобы получилось: Сегодня утром я поздно проснулся (проснулась).'
    accepted_answers:
    - value:
      - امروز
      - صبح
      - دیر
      - بیدار
      - شدم
      status: correct
    feedback: В *امروز صبح دیر بیدار شدم* время стоит в начале, а составной глагол — в конце.
  prs.a2.unit22.lesson01.exercise06.translate_got_ready:
    instruction: 'Переведи на дари, используя прошедшее время глагола آماده شدن: Сегодня утром я собрался (собралась).'
    accepted_answers:
    - value: امروز صبح آماده شدم
      status: correct
    - value: من امروز صبح آماده شدم
      status: correct
    - value: صبح آماده شدم
      status: correct
    - value: من صبح آماده شدم
      status: correct
    - value: امروز صبح من آماده شدم
      status: correct
    feedback: '*امروز صبح آماده شدم* — «сегодня утром я собрался (собралась)». *من* можно не говорить, потому что окончание *-م* уже означает «я».'
  prs.a2.unit22.lesson02.exercise01.recognize_waited:
    instruction: Что означает этот глагол?
    correct_option: я подождал
    distractors:
    - я прогулялся
    - я поговорил
    - я позвонил
    accepted_answers:
    - value: я подождал
      status: correct
    feedback: '*انتظار کشیدم* — «я ждал(а)»: *انتظار* плюс прошедшее время глагола *کشیدن* с окончанием *-م*.'
  prs.a2.unit22.lesson02.exercise02.recognize_got_on:
    instruction: Что означает это предложение?
    correct_option: Я сел (села) в автобус
    distractors:
    - Я вышел (вышла) из автобуса
    - Я ждал(а) автобус
    - Я пошёл (пошла) на автобусную остановку
    accepted_answers:
    - value: Я сел (села) в автобус
      status: correct
    feedback: '*سوار شدم* — «я сел (села)», «я сел (села) в транспорт». «Выйти» — *پیاده شدم*.'
  prs.a2.unit22.lesson02.exercise03.match_compound_verbs:
    instruction: Соотнеси каждый глагол на дари с его значением.
    accepted_answers:
