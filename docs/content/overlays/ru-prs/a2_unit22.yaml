        بیدار شدم: я проснулся
        دوش گرفتم: я принял душ
        قدم زدم: я прогулялся
        حرف زدم: я поговорил
        تیلفون کردم: я позвонил
        انتظار کشیدم: я подождал
        سوار شدم: я сел (в транспорт)
        پیاده شدم: я вышел (из транспорта)
        باز کردم: я открыл
        بستم: я закрыл
        رسیدم: я приехал(а)
      status: correct
    feedback: В каждом составном глаголе первая часть не меняется, а окончание прошедшего времени получает только вспомогательный глагол.
    pairs:
    - left: بیدار شدم
      right: я проснулся
    - left: دوش گرفتم
      right: я принял душ
    - left: قدم زدم
      right: я прогулялся
    - left: حرف زدم
      right: я поговорил
    - left: تیلفون کردم
      right: я позвонил
    - left: انتظار کشیدم
      right: я подождал
    - left: سوار شدم
      right: я сел (в транспорт)
    - left: پیاده شدم
      right: я вышел (из транспорта)
    - left: باز کردم
      right: я открыл
    - left: بستم
      right: я закрыл
    - left: رسیدم
      right: я приехал(а)
  prs.a2.unit22.lesson02.exercise04.order_waited_got_on:
    instruction: 'Расставь слова так, чтобы получилось: «Я подождал(а) на остановке и сел (села) в автобус».'
    accepted_answers:
    - value:
      - در
      - ایستگاه
      - انتظار
      - کشیدم
      - و
      - به
      - بس
      - سوار
      - شدم
      status: correct
    feedback: В *در ایستگاه انتظار کشیدم و به بس سوار شدم* два завершённых действия, у каждого свой глагол в прошедшем времени, а соединяет их *و*.
  prs.a2.unit22.lesson02.exercise05.complete_took_shower:
    instruction: 'Закончи предложение: «Сегодня утром я принял(а) душ».'
    accepted_answers:
    - value: گرفتم
      status: correct
    feedback: '*گرفتم* — прошедшее время глагола *گرفتن* с окончанием *-م*. Составной глагол — *دوش گرفتن*.'
  prs.a2.unit22.lesson02.exercise06.translate_talked_friend:
    instruction: 'Переведи на дари, используя прошедшее время глагола حرف زدن: «Я поговорил(а) с моим другом».'
    accepted_answers:
    - value: با دوستم حرف زدم
      status: correct
    - value: من با دوستم حرف زدم
      status: correct
    feedback: '*با دوستم حرف زدم* — «я поговорил(а) с моим другом». *من* можно не говорить, потому что окончание *-م* уже означает «я».'
  prs.a2.unit22.lesson03.exercise01.recognize_not_on_time:
    instruction: Что означает это предложение?
    correct_option: Я не проснулся (не проснулась) вовремя
    distractors:
    - Я проснулся (проснулась) вовремя
    - Я не собрался (не собралась) вовремя
    - Я не проснусь вовремя
    accepted_answers:
    - value: Я не проснулся (не проснулась) вовремя
      status: correct
    feedback: '*نشدم* — это *ن* плюс *شدم*: *بیدار نشدم* значит «я не проснулся (не проснулась)». Отрицание *ن* стоит на вспомогательном глаголе *شدن*.'
  prs.a2.unit22.lesson03.exercise02.recognize_not_opened:
    instruction: Что означает это предложение?
    correct_option: Я не открыл(а) ворота
    distractors:
    - я открыл ворота
    - Я не закрыл(а) ворота
    - Я не пошёл (не пошла) к воротам
    accepted_answers:
    - value: Я не открыл(а) ворота
      status: correct
    feedback: '*نکردم* — это *ن* плюс *کردم*. *دروازه را باز نکردم* значит «я не открыл(а) ворота».'
  prs.a2.unit22.lesson03.exercise03.match_positive_negative:
    instruction: Соотнеси каждый глагол на дари с его значением.
    accepted_answers:
    - value:
        بیدار شدم: я проснулся
        بیدار نشدم: я не проснулся
        تیلفون کردم: я позвонил
        تیلفون نکردم: я не позвонил
        دوش گرفتم: я принял душ
        دوش نگرفتم: я не принял душ
        قدم زدم: я прогулялся
        قدم نزدم: я не прогулялся
        انتظار کشیدم: я подождал
        انتظار نکشیدم: я не стал ждать
      status: correct
    feedback: Первая часть составного глагола никогда не меняется. Только вспомогательный глагол получает ن.
    pairs:
    - left: بیدار شدم
      right: я проснулся
    - left: بیدار نشدم
      right: я не проснулся
    - left: تیلفون کردم
      right: я позвонил
    - left: تیلفون نکردم
      right: я не позвонил
    - left: دوش گرفتم
      right: я принял душ
    - left: دوش نگرفتم
      right: я не принял душ
    - left: قدم زدم
      right: я прогулялся
    - left: قدم نزدم
      right: я не прогулялся
    - left: انتظار کشیدم
      right: я подождал
    - left: انتظار نکشیدم
      right: я не стал ждать
  prs.a2.unit22.lesson03.exercise04.order_not_opened:
    instruction: 'Расставь слова так, чтобы получилось: «Я не открыл(а) ворота».'
    accepted_answers:
    - value:
      - دروازه
      - را
      - باز
      - نکردم
      status: correct
    feedback: В *دروازه را باز نکردم* частица *را* стоит сразу после дополнения, а *ن* — на *کردم*.
  prs.a2.unit22.lesson03.exercise05.complete_ra:
    instruction: 'Закончи предложение: «Я открыл(а) ворота».'
    accepted_answers:
    - value: را
      status: correct
    feedback: '*را* отмечает определённое дополнение *دروازه* и стоит сразу после него: *دروازه را باز کردم*. Ответ — одно слово *را*.'
  prs.a2.unit22.lesson03.exercise06.complete_no_shower:
