course:
  title: Дари A1
  description: 'Начальный афганский дари: названия городских мест, вопрос «где находится…?», простые ответы о местоположении и понимание базовых указаний, как пройти к нужному месту.'
units:
  prs.a1.unit05.places:
    title: Важные места в городе
lessons:
  prs.a1.unit05.lesson01.everyday_places:
    title: Повседневные места в городе
  prs.a1.unit05.lesson02.civic_and_travel_places:
    title: Общественные места и места для поездок
  prs.a1.unit05.lesson03.asking_where:
    title: Спроси, где что находится
  prs.a1.unit05.lesson04.simple_location_answers:
    title: Близко, далеко, здесь и там
  prs.a1.unit05.lesson05.prepositions_of_place:
    title: Предлоги места
  prs.a1.unit05.lesson06.finding_pharmacy_dialogue:
    title: Найди аптеку в районе
teaching:
  prs.a1.unit05.lesson01.teach.bazaar:
    title: Рынок
    gloss: рынок / базар
    note: بازار — обычное слово для торгового района, часто это целая улица или квартал с магазинами.
    example_gloss: Базар близко.
  prs.a1.unit05.lesson01.teach.bank:
    title: Банк
    gloss: банк
    note: بانک — прямое заимствование, как и русское «банк», и употребляется так же.
    example_gloss: Где банк?
  prs.a1.unit05.lesson01.teach.mosque:
    title: Мечеть
    gloss: мечеть
    note: مسجد — стандартное слово для мечети.
    example_gloss: Мечеть большая.
  prs.a1.unit05.lesson01.teach.hospital:
    title: Больница
    gloss: больница
    note: شفاخانه — обычное слово для больницы в афганском дари. Иранское фарси بیمارستان носители дари могут понимать, но сами обычно не используют.
    example_gloss: Больница далеко.
  prs.a1.unit05.lesson01.teach.school:
    title: Школа
    gloss: школа
    note: مکتب — обычное слово для школы в афганском дари. Иранское фарси مدرسه в дари чаще всего означает именно религиозную школу.
    example_gloss: Школа рядом с домом.
  prs.a1.unit05.lesson01.teach.pharmacy:
    title: Аптека
    gloss: аптека
    note: دواخانه — обычное слово для аптеки в афганском дари (от دوا — «лекарство»). Иранское фарси — داروخانه.
    example_gloss: Где аптека?
  prs.a1.unit05.lesson01.teach.va_word:
    title: И
    gloss: и
    note: و — обычный соединительный союз, которым связывают перечень мест.
    target_text: و (и)
  prs.a1.unit05.lesson02.teach.post_office:
    title: Почта
    gloss: почта
    note: پوسته خانه состоит из پوسته (почта) и خانه (дом, здание).
    example_gloss: Почта закрыта.
  prs.a1.unit05.lesson02.teach.embassy:
    title: Посольство
    gloss: посольство
    note: سفارت — стандартное слово для посольства.
    example_gloss: Посольство находится в Кабуле.
  prs.a1.unit05.lesson02.teach.airport:
    title: Аэропорт
    gloss: аэропорт
    note: میدان هوایی — обычное слово для аэропорта в афганском дари (буквально «воздушное поле»). Иранское фарси — فرودگاه.
    example_gloss: Аэропорт далеко.
  prs.a1.unit05.lesson02.teach.office_review:
    title: Офис (повторение)
    gloss: офис
    note: Слово دفتر уже встречалось в одном из прошлых уроков; здесь оно приведено вместе с другими общественными местами.
    example_gloss: Мой офис близко.
  prs.a1.unit05.lesson03.teach.kojast_bazaar:
    title: Спроси, где рынок
    gloss: Где рынок?
    note: بازار کجاست؟ — основная модель вопроса о том, где находится любое место.
  prs.a1.unit05.lesson03.teach.kojast_hospital:
    title: Спроси, где больница
    gloss: Где больница?
    note: Та же модель с کجاست подходит для любого названия места.
  prs.a1.unit05.lesson03.teach.bebakhshid:
    title: Вежливо привлеки внимание
    gloss: Извините, где находится аптека?
    note: ببخشین вежливо начинает вопрос к незнакомому человеку — как русское «извините».
  prs.a1.unit05.lesson03.teach.kojast_grammar:
    title: Как образуется کجاست
    gloss: کجاست — это کجا («где») и است («есть, является»), слитые вместе.
    note: Если видеть это разложение, проще понять модель, а не заучивать کجاست как неделимый блок.
  prs.a1.unit05.lesson04.teach.near:
    title: Близко
    gloss: около, поблизости от
    note: نزدیک описывает то, что находится рядом.
    example_gloss: Банк близко.
  prs.a1.unit05.lesson04.teach.far:
    title: Далеко
    gloss: далеко
    note: دور описывает то, что находится на расстоянии.
    example_gloss: Больница далеко.
  prs.a1.unit05.lesson04.teach.here:
    title: Здесь
    gloss: здесь
    note: این‌جا указывает на место, где говорящий находится сейчас.
    example_gloss: Банк здесь.
  prs.a1.unit05.lesson04.teach.there:
    title: Там
    gloss: там
    note: آن‌جا указывает на место, удалённое от говорящего.
    example_gloss: Аптека там.
  prs.a1.unit05.lesson04.teach.bazaar_near:
    title: Скажи, что рынок близко
    gloss: Рынок близко.
    note: В بازار نزدیک است используется та же связка است, что и во всём курсе.
  prs.a1.unit05.lesson04.teach.airport_far:
    title: Скажи, что аэропорт далеко
    gloss: Аэропорт далеко.
    note: میدان هوایی دور است строится по той же модели, только вместо نزدیک стоит دور.
  prs.a1.unit05.lesson05.teach.next_to:
    title: Рядом с
    gloss: рядом с
    note: در کنار буквально означает «сбоку от».
  prs.a1.unit05.lesson05.teach.behind:
    title: Позади
    gloss: позади
    note: پشت показывает, что что-то находится позади другого места.
    example_gloss: Аптека находится за школой.
  prs.a1.unit05.lesson05.teach.opposite:
    title: Напротив
    gloss: напротив
    note: مقابل показывает, что что-то находится прямо напротив другого места.
    example_gloss: Банк находится напротив мечети.
  prs.a1.unit05.lesson05.teach.hospital_next_to_mosque:
    title: Как указать, где больница относительно мечети
    gloss: Больница рядом с мечетью.
    note: شفاخانه در کنار مسجد است сочетает название места, предлог در کنار и связку است.
  prs.a1.unit05.lesson06.teach.tashakor_ziad:
    title: Большое спасибо
    gloss: Большое спасибо.
    note: تشکر زیاد усиливает повседневное تشکر, которое ты уже выучил.
  prs.a1.unit05.lesson06.teach.turn01:
    title: Зармина спрашивает про аптеку
    gloss: Зармина вежливо спрашивает прохожего, где находится аптека.
    note: ببخشین уважительно открывает вопрос и подходит для обращения к незнакомому человеку.
  prs.a1.unit05.lesson06.teach.turn02:
    title: Прохожий объясняет дорогу
    gloss: Прохожий говорит, что аптека недалеко, нужно идти прямо, и что она рядом со школой.
    note: 'Здесь сочетаются несколько моделей из этого урока: دور نیست (отрицание с دور), مستقیم بروین и در کنار.'
  prs.a1.unit05.lesson06.teach.turn03:
    title: Зармина благодарит прохожего
    gloss: Зармина горячо благодарит его.
    note: تشکر زیاد вежливо завершает разговор.
  prs.a1.unit05.lesson06.teach.turn04:
    title: Скромный ответ прохожего
    gloss: Не за что / пустяки.
    note: 'قابلی نداره — распространённый скромный ответ на благодарность в повседневном афганском дари; по функции похоже на خواهش می‌کنم, но звучит более непринуждённо. نداره — разговорная форма от ندارد: в речи ты услышишь نداره, а в аккуратном письме используется ندارد.'
