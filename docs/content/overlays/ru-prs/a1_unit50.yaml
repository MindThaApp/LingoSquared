  prs.a1.unit50.lesson06.wrap_up:
    title: Итоги
teaching:
  prs.a1.unit50.lesson01.teach.review_this_is_in:
    title: 'Повторение: этот, есть, в'
    gloss: этот / есть / в
    note: Это слова для повторения (они встречаются на протяжении всего курса), с их помощью ты говоришь о бассейне.
    target_text: این (этот) / است (есть, является) / در (в)
  prs.a1.unit50.lesson01.teach.pool_word:
    title: Бассейн
    gloss: бассейн
    note: 'Так по-дарийски называется бассейн. Такое словосочетание можно встретить в вопросе об удобствах отеля, например: «В отеле есть бассейн?»'
    example_gloss: Это бассейн.
  prs.a1.unit50.lesson01.teach.staff_word:
    title: Сотрудник
    gloss: сотрудник
    note: Это общее слово для работника, здесь — для человека, который работает в бассейне.
    example_gloss: Сотрудник находится в бассейне.
  prs.a1.unit50.lesson01.teach.this_is_pool_phrase:
    title: Это бассейн
    gloss: Это бассейн.
    note: Здесь соединены «это», «есть» и «бассейн» так же, как в других местах этого курса.
  prs.a1.unit50.lesson01.teach.staff_at_pool_phrase:
    title: Сотрудник в бассейне
    gloss: Сотрудник находится в бассейне.
    note: Здесь соединены «сотрудник», «в» и «бассейн».
  prs.a1.unit50.lesson02.teach.review_want_get_ticket:
    title: 'Повторение: я хочу, чтобы я взял(а), билет, один/одна'
    gloss: я хочу / чтобы я взял(а) / билет / один
    note: «Чтобы я взял(а)» — ожидаемая форма сослагательного наклонения уже знакомого глагола. Она образуется так же, как все остальные формы этого наклонения в курсе («чтобы я умылся», «чтобы я взял»).
    target_text: می‌خواهم (я хочу) / بگیرم (чтобы я взял — сослагательное наклонение) / تکت (билет) / یک (один)
  prs.a1.unit50.lesson02.teach.want_ticket_phrase:
    title: Я хочу взять билет
    gloss: Я хочу взять билет.
    note: Это тот же образец «хочу + сослагательное наклонение», который уже был в темах о взятии книги в библиотеке, записи на приём, аренде велосипеда и пользовании прачечной.
  prs.a1.unit50.lesson02.teach.review_price_words:
    title: 'Повторение: сколько, афгани, двадцать, есть'
    gloss: сколько / афгани / двадцать / есть
    note: Это слова из прошлых уроков, нужные, чтобы спросить цену билета.
    target_text: چند (сколько) / افغانی (афгани) / بیست (двадцать) / است (есть, является)
  prs.a1.unit50.lesson02.teach.ask_ticket_price_phrase:
    title: Сколько стоит билет?
    gloss: Сколько стоит билет?
    note: Здесь соединены слова, изученные раньше в этом уроке.
  prs.a1.unit50.lesson02.teach.ticket_price_answer_phrase:
    title: Это 20 афгани
    gloss: Это 20 афгани.
    note: Так называют цену, используя уже знакомые числа и название валюты.
  prs.a1.unit50.lesson03.teach.locker_word:
    title: Шкафчик
    gloss: шкафчик
    note: Это обычное дарийское слово для шкафа или шкафчика, здесь — для шкафчика в бассейне.
    example_gloss: Шкафчик номер три.
  prs.a1.unit50.lesson03.teach.review_where_number_three:
    title: 'Повторение: где находится, номер, три'
    gloss: где находится / номер / три
    note: Это слова из прошлых уроков, нужные, чтобы спросить про номер шкафчика и назвать его.
    target_text: کجاست (где) / نمبر (номер) / سه (три)
  prs.a1.unit50.lesson03.teach.where_locker_phrase:
    title: Где шкафчик?
    gloss: Где шкафчик?
    note: Здесь соединены «шкафчик» и «где находится».
  prs.a1.unit50.lesson03.teach.your_locker_number_phrase:
    title: Ваш шкафчик номер три
    gloss: Ваш шкафчик номер три.
    note: «Ваш шкафчик» образуется тем же суффиксом, что «ваша стирка» в уроке 49 и «ваша аренда» в уроке 48.
  prs.a1.unit50.lesson03.teach.closed_word:
    title: Закрыт
    gloss: закрыт
    note: Это обычное дарийское слово «закрыт», здесь — для времени закрытия бассейна.
    example_gloss: Бассейн закрыт.
  prs.a1.unit50.lesson03.teach.open_word:
    title: Открытый
    gloss: открытый
    note: Это обычное дарийское слово «открыт», здесь — для времени, когда бассейн открыт.
    example_gloss: Бассейн открыт.
  prs.a1.unit50.lesson03.teach.review_when_hour_five:
    title: 'Повторение: когда, час, пять'
    gloss: когда / час (о времени) / пять
    note: Это слова из прошлых уроков, нужные, чтобы спросить о времени закрытия и назвать его.
    target_text: کی (когда) / ساعت (час, в … часов) / پنج (пять)
  prs.a1.unit50.lesson03.teach.ask_when_closed_phrase:
    title: Когда закрывается бассейн?
    gloss: Когда закрывается бассейн?
    note: Здесь соединены «бассейн», «когда» и «закрыт».
  prs.a1.unit50.lesson03.teach.closed_at_five_phrase:
    title: Он закрывается в 5 часов
    gloss: Он закрывается в 5 часов.
    note: Так называют время закрытия, используя уже знакомые слова «час» и «пять».
  prs.a1.unit50.lesson04.teach.review_hello_want_get:
    title: 'Повторение: здравствуйте, я хочу, чтобы я взял(а)'
    gloss: здравствуйте / я хочу / чтобы я взял(а)
    note: Это слова из прошлых уроков, которыми начинается диалог.
    target_text: سلام (здравствуйте) / می‌خواهم (я хочу) / بگیرم (чтобы я взял)
  prs.a1.unit50.lesson04.teach.review_welcome_ticket_price:
    title: 'Повторение: пожалуйста, билет, двадцать, афгани, есть'
    gloss: пожалуйста (при передаче) / билет / двадцать / афгани / есть
    note: Это слова из прошлых уроков, нужные, чтобы назвать цену билета.
    target_text: بفرمایین (пожалуйста, прошу) / تکت (билет) / بیست (двадцать) / افغانی (афгани) / است (есть, является)
  prs.a1.unit50.lesson04.teach.review_good_where_locker:
    title: 'Повторение: очень хорошо, шкафчик, где находится'
