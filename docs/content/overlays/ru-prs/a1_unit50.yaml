course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: сходить в общественный бассейн, купить входной билет, спросить, где шкафчик и какой у него номер, и понять, когда бассейн закрывается.'
units:
  prs.a1.unit50.swimming_pool:
    title: Бассейн
    description: Сходи в общественный бассейн, купи билет, спроси про шкафчик и пойми, когда бассейн закрывается.
