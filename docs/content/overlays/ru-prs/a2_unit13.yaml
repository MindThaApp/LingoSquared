course:
  title: Дари A2
  description: 'Дари Афганистана, уровень выше начального: как сообщить хозяину жилья о бытовой проблеме — лексика, описание проблемы, чтение объявления о ремонте и сам телефонный разговор.'
units:
  prs.a2.unit13.maintenance:
    title: Сообщаем о бытовой проблеме
lessons:
  prs.a2.unit13.lesson01.maintenance_vocabulary:
    title: Слова о бытовых проблемах
  prs.a2.unit13.lesson02.reporting_the_problem:
    title: Сообщаем о проблеме
  prs.a2.unit13.lesson03.reading_a_maintenance_notice:
    title: Читаем объявление о ремонте
  prs.a2.unit13.lesson04.maintenance_call_dialogue:
    title: Звоним хозяину жилья
teaching:
  prs.a2.unit13.lesson01.teach.malfunction_word:
    title: Неисправность / поломка
    gloss: неисправность / поломка
    note: '*خرابی* — общее слово для обозначения того, что что-то сломано или не работает.'
    example_gloss: Я сообщил о неисправности трубы.
  prs.a2.unit13.lesson01.teach.pipe_word:
    title: Труба
    gloss: труба
    note: '*لوله* — обычное слово для обозначения трубы.'
    example_gloss: Труба на кухне течёт.
  prs.a2.unit13.lesson01.teach.electricity_word:
    title: Электричество
    gloss: электричество / электропитание
    note: '*برق* означает электричество или электропитание.'
    example_gloss: В моей спальне не работает электричество.
  prs.a2.unit13.lesson01.teach.leak_word:
    title: Протечка
    gloss: протечка / капание
    note: '*چکه* описывает протечку воды или капание.'
    example_gloss: Протечка трубы с каждой ночью становится хуже.
  prs.a2.unit13.lesson01.teach.repair_word:
    title: Ремонт
    gloss: ремонт
    note: '*تعمیر* — общее слово для обозначения ремонта.'
    example_gloss: Ремонт трубы завтра.
  prs.a2.unit13.lesson01.teach.worker_word:
    title: Мастер
    gloss: мастер / рабочий
    note: '*کارگر* — вообще рабочий; здесь имеется в виду именно мастер по ремонту.'
    example_gloss: Хозяин дома присылает мастера.
  prs.a2.unit13.lesson01.teach.asap_grammar:
    title: 'Как можно скорее: هر چه زودتر'
    gloss: как можно скорее
    note: '*هر چه زودتر* — конструкция срочности, буквально «чем скорее, тем лучше».'
    target_text: هر چه زودتر (как можно скорее)
  prs.a2.unit13.lesson02.teach.pipe_leaking_asap:
    title: Сообщаем о текущей трубе и просим сделать срочно
    gloss: Труба на моей кухне течёт, её нужно починить как можно скорее.
    note: Сочетает *چکه می‌کند* (течёт), *هر چه زودتر* (как можно скорее) и *باید* (нужно).
  prs.a2.unit13.lesson02.teach.when_send_worker:
    title: Спрашиваем, когда может прийти мастер
    gloss: Когда вы сможете прислать мастера?
    note: '*کی می‌توانین...؟* означает «когда вы можете...?».'
  prs.a2.unit13.lesson02.teach.bedroom_electricity_not_working:
    title: Сообщаем о второй проблеме
    gloss: В моей спальне не работает электричество.
    note: '*کار نمی‌کند* означает «не работает» и говорится о приборе или коммуникациях.'
  prs.a2.unit13.lesson03.teach.cost_word:
    title: Стоимость / плата
    gloss: стоимость / расходы
    note: '*هزینه* — общее слово для обозначения стоимости или расходов.'
    example_gloss: Ремонт электрики платный.
  prs.a2.unit13.lesson03.teach.free_word:
    title: Бесплатно
    gloss: бесплатно
    note: '*رایگان* означает «бесплатно», без оплаты.'
    example_gloss: Ремонт трубы бесплатный.
  prs.a2.unit13.lesson03.teach.notice_text:
    title: Объявление о ремонте в доме
    gloss: Мастер по ремонту придёт в четверг в десять часов. Ремонт труб бесплатный, а ремонт электрики платный.
    note: Короткое общее объявление для жильцов дома, написанное в формальном письменном стиле. Это отдельное объявление, не связанное с телефонным звонком کریم позже в уроке и с другим визитом.
  prs.a2.unit13.lesson04.teach.turn01:
    title: Хозяин отвечает на звонок
    gloss: 'Хозяин отвечает: «Алло, слушаю вас».'
    note: '*الو* — так отвечают на телефонный звонок; *بفرمایین* здесь означает «слушаю вас», а не привычное «пожалуйста, входите».'
  prs.a2.unit13.lesson04.teach.turn02:
    title: کریم представляется и сообщает о протечке
    gloss: Он здоровается, говорит, что он کریم, и что труба на его кухне течёт.
    note: '*استم* — глагол-связка «я есть»: *من کریم استم* означает «я کریم».'
  prs.a2.unit13.lesson04.teach.turn03:
    title: Хозяин спрашивает, с каких пор
    gloss: Хозяин спрашивает, когда это началось.
    note: '*از کی شروع شده؟* означает «с каких пор это началось?».'
  prs.a2.unit13.lesson04.teach.turn04:
    title: کریم отвечает, подчёркивая срочность
    gloss: Со вчерашнего вечера. Это нужно починить как можно скорее.
    note: '*دیشب* означает «вчера вечером» или «прошлой ночью».'
  prs.a2.unit13.lesson04.teach.turn05:
    title: Хозяин соглашается на время
    gloss: Хорошо, завтра в девять я пришлю мастера.
    note: '*باشد* означает «хорошо», «ладно».'
  prs.a2.unit13.lesson04.teach.turn06:
    title: کریم благодарит и сообщает о второй проблеме
    gloss: Он благодарит хозяина и говорит, что в спальне тоже не работает электричество.
    note: '*هم* здесь означает «тоже» и добавляет вторую проблему.'
  prs.a2.unit13.lesson04.teach.turn07:
    title: Хозяин обещает передать мастеру
    gloss: Хозяин говорит, что скажет об этом мастеру тоже.
    note: '*آن را هم به کارگر می‌گویم* — «я и об этом скажу мастеру» — относится к проблеме с электричеством.'
