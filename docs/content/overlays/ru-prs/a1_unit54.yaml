  prs.a1.unit54.lesson06.wrap_up:
    title: Итоги
teaching:
  prs.a1.unit54.lesson01.teach.review_this_is_in_good:
    title: 'Повторение: этот, есть, в, хороший'
    gloss: этот / есть / в / хороший
    note: Это слова для повторения (они встречаются на протяжении всего курса), с их помощью можно говорить о концерте.
    target_text: این (этот) / است (есть, является) / در (в) / خوب (хороший)
  prs.a1.unit54.lesson01.teach.concert_word:
    title: Концерт
    gloss: концерт
    note: Это стандартное современное слово на дари для обозначения концерта. Оно заимствовано так же, как *موزیم* (музей).
    example_gloss: Этот концерт хороший.
  prs.a1.unit54.lesson01.teach.singer_word:
    title: Певец, певица
    gloss: певец, певица
    note: Это простое, обычное современное слово на дари для певца или певицы. Есть и более классический вариант, *آوازخوان*, но в повседневной речи он встречается реже.
    example_gloss: Певица на концерте.
  prs.a1.unit54.lesson01.teach.this_is_concert_phrase:
    title: Это концерт
    gloss: Это концерт.
    note: Здесь соединены слова «этот», «есть» и «концерт» так же, как в этом курсе уже соединялись такие слова.
  prs.a1.unit54.lesson01.teach.singer_at_concert_phrase:
    title: Певица на концерте
    gloss: Певица на концерте.
    note: Здесь соединены слова «певец/певица», «в» и «концерт».
  prs.a1.unit54.lesson02.teach.review_price_and_time_words:
    title: 'Повторение: сколько, афгани, есть, тридцать, час, восемь, вечер, бывает, в, билет'
    gloss: сколько / афгани / есть / тридцать / час / восемь / вечер / бывает / в / билет
    note: Это слова для повторения (из предыдущих уроков), с их помощью можно говорить о времени начала и цене концерта.
    target_text: چند (сколько) / افغانی (афгани) / است (есть, является) / سی (тридцать) / ساعت (час, время) / هشت (восемь) / شب (вечер) / می‌شود (бывает, происходит) / در (в) / تکت (билет)
  prs.a1.unit54.lesson02.teach.start_word:
    title: Начало
    gloss: начало
    note: Вместе с *می‌شود* («происходит») это значит «начинается». Такая модель с составным глаголом уже встречалась в этом курсе.
    example_gloss: Концерт начинается в восемь вечера.
  prs.a1.unit54.lesson02.teach.singer_name_word:
    title: Сима
    gloss: Сима
    note: Сима — распространённое афганское имя; здесь так зовут певицу концерта.
    example_gloss: Сима — певица.
  prs.a1.unit54.lesson02.teach.concert_poster_reading:
    title: Читаем афишу концерта
    gloss: Сима — певица. Концерт начинается в восемь вечера. Билет стоит 30 афгани.
  prs.a1.unit54.lesson02.teach.review_when_word:
    title: 'Повторение: когда'
    gloss: когда
    note: Это слово для повторения, им спрашивают, когда начинается концерт.
    target_text: کی (когда)
  prs.a1.unit54.lesson02.teach.ask_start_time_phrase:
    title: Когда начинается концерт?
    gloss: Когда начинается концерт?
    note: Здесь соединены слова, которые вы изучили раньше в этом уроке.
  prs.a1.unit54.lesson02.teach.answer_start_time_phrase:
    title: Концерт начинается в восемь вечера
    gloss: Концерт начинается в восемь вечера.
    note: Здесь указано время начала концерта с афиши.
  prs.a1.unit54.lesson03.teach.review_propose_words:
    title: 'Повторение: вы хотите (вежливо), пятница, пойдём'
    gloss: хотите ли вы / пятница / пойдём
    note: Это повторяемые слова для предложения плана — та же конструкция, которую в этом курсе мы уже разбирали, предлагая прогулку в парк.
    target_text: می‌خواهین (вы хотите, вежливо) / جمعه (пятница) / برویم (пойдём)
  prs.a1.unit54.lesson03.teach.review_concert_word:
    title: 'Повторение: концерт'
    gloss: концерт
    note: Это повторяемое слово, с которым предлагают пойти на концерт.
    target_text: کنسرت (концерт)
  prs.a1.unit54.lesson03.teach.propose_concert_phrase:
    title: Хотите пойти в пятницу на концерт?
    gloss: Хотите пойти в пятницу на концерт?
    note: Здесь снова используется уже знакомая из этого курса конструкция для предложения плана, теперь с концертом.
  prs.a1.unit54.lesson03.teach.review_accept_words:
    title: 'Повторение: да, отлично, договорились'
    gloss: да / отлично / договорились
    note: Это повторяемые слова для согласия с планом.
    target_text: بلی (да) / عالی (отлично) / قبول (согласен)
  prs.a1.unit54.lesson03.teach.accept_plan_phrase:
    title: Да, отлично! Договорились.
    gloss: Да, отлично! Договорились.
    note: Так принимают предложение пойти на концерт.
  prs.a1.unit54.lesson04.teach.review_hello_want_ticket:
    title: 'Повторение: здравствуйте, один/одна, билет, я хочу'
    gloss: здравствуйте / один / билет / я хочу
    note: Это повторяемые слова для начала диалога.
    target_text: سلام (здравствуйте) / یک (один) / تکت (билет) / می‌خواهم (я хочу)
