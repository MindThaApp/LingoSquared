course:
  title: Дари A1
  description: 'Начальный кабульский дари: договариваться о походе на концерт, читать афишу, покупать билет, спрашивать о времени начала и просто беседовать о концерте после него.'
units:
  prs.a1.unit54.concert:
    title: Концерт
    description: Договорись о походе на концерт, купи билет, спроси, когда он начинается, и просто поговори о нём после.
