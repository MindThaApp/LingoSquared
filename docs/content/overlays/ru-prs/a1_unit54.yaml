    gloss: пожалуйста (держите) / концерт / Сима / час / восемь / вечер / начинается
    note: Это повторяемые слова для сообщения о времени начала концерта.
    target_text: بفرمایین (пожалуйста, возьмите) / کنسرت (концерт) / سیما (Сима) / ساعت (час, время) / هشت (восемь) / شب (вечер) / شروع می‌شود (начинается)
  prs.a1.unit54.lesson04.teach.review_ask_price:
