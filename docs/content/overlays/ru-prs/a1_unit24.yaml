  prs.a1.unit24.lesson04.teach.dialogue_line1:
    title: 'Зармина: Хумаюн, как ты добираешься до города?'
    gloss: 'Зармина: Хумаюн, как ты добираешься до города?'
    note: شهر означает «город»; это слово новое в этой реплике.
  prs.a1.unit24.lesson04.teach.dialogue_line2:
    title: 'Хумаюн: Я хожу пешком, это близко'
    gloss: 'Хумаюн: Я хожу пешком, это близко. А ты как добираешься?'
    note: نزدیک означает «близко»; это слово новое в этой реплике.
  prs.a1.unit24.lesson04.teach.dialogue_line3:
    title: 'Зармина: Я езжу на такси, это прямо и быстро'
    gloss: 'Зармина: Я езжу на такси, это прямо и быстро.'
    note: تیز означает «быстрый»; это слово новое в этой реплике.
  prs.a1.unit24.lesson04.teach.dialogue_line4:
    title: 'Хумаюн: Автобус тоже хорош, он дешёвый'
    gloss: 'Хумаюн: Автобус тоже хорош, он дешёвый.'
    note: ارزان означает «дешёвый»; это слово новое в этой реплике.
  prs.a1.unit24.lesson04.teach.dialogue_line5:
    title: 'Зармина: Да, но такси быстрее'
    gloss: 'Зармина: Да, но такси быстрее.'
    note: اما означает «но»; تیزتر — сравнительная степень «быстрее».
  prs.a1.unit24.lesson05.teach.reading_passage:
    title: Читаем о дороге на работу
    gloss: Зармина каждый день ездит в город на такси. Такси быстрое, но не дешёвое. Хумаюн ходит пешком, потому что его дом близко. Он копит деньги на машину.
    note: Короткий текст для повторения лексики урока и союза «چون» («потому что»).
  prs.a1.unit24.lesson06.teach.review_dochakhe:
    title: Велосипед (повторение)
    gloss: велосипед
    note: دوچرخه означает «велосипед» (повторение из предыдущего урока).
    example_gloss: Я езжу на велосипеде.
  prs.a1.unit24.lesson06.teach.wrap_summary:
    title: Каждый день я хожу пешком или езжу на автобусе
    gloss: Каждый день я хожу пешком или езжу на автобусе.
    note: یا означает «или»; это слово новое в этом итоговом предложении.
