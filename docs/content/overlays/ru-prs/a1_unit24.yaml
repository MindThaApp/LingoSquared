course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: лексика о транспорте (автобус, такси, машина, велосипед, пешком), как сказать, на чём ты добираешься, покупка билета и диалог Зармины и Хумаюна о способах добираться на работу.'
units:
  prs.a1.unit24.transportation:
    title: Транспорт
    description: Расскажи, как ты передвигаешься по городу, купи билет и спроси, каким транспортом ехать.
