    target_text: کرایه (аренда) / روزانه (в день) / پنجاه (пятьдесят) / نود (девяносто) / افغانی (афгани) / چند (сколько)
  prs.a1.unit48.lesson06.teach.price_contrast_phrase:
    title: Прокат велосипеда стоит пятьдесят афгани в день, а за два дня — девяносто
    gloss: Прокат велосипеда стоит пятьдесят афгани в день, но за два дня — девяносто афгани.
