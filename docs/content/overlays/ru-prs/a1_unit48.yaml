course:
  title: Дари A1
  description: 'Начальный дари кабульского варианта: взять велосипед напрокат в магазине, узнать цену за день, понять, что в залог нужно удостоверение личности, и договориться о времени возврата.'
units:
  prs.a1.unit48.bike_rental:
    title: Прокат велосипеда
    description: Возьми велосипед напрокат в магазине, узнай цену за день, пойми, что в залог берут удостоверение личности, и договорись о времени возврата.
