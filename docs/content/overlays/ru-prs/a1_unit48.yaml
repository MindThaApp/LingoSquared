  prs.a1.unit48.lesson02.teach.daily_price_answer_phrase:
    title: Пятьдесят афгани в день
    gloss: Пятьдесят афгани в день.
    note: Так называют цену, используя уже изученные числа и название валюты.
  prs.a1.unit48.lesson03.teach.review_for_want_polite_rent:
    title: 'Повторение: для, вы хотите (вежливо), аренда'
    gloss: для / вы хотите (вежливо) / аренда
    note: Это уже знакомые слова, с их помощью можно спросить, что нужно для аренды.
    target_text: برای (для) / می‌خواهین (вы хотите; вежливо) / کرایه (аренда)
  prs.a1.unit48.lesson03.teach.id_card_word:
    title: Удостоверение личности
    gloss: удостоверение личности
    note: Это афганское национальное удостоверение личности; в этом курсе оно уже встречалось в другой ситуации — при регистрации. Здесь магазин берёт его в залог вместо денег.
    example_gloss: Мне нужно удостоверение личности.
  prs.a1.unit48.lesson03.teach.want_id_for_rental_phrase:
    title: Для аренды мне нужно ваше удостоверение личности
    gloss: Для аренды мне нужно ваше удостоверение личности.
    note: Здесь соединены слова «аренда» и «удостоверение личности».
  prs.a1.unit48.lesson03.teach.review_when_giveback_tomorrow:
    title: 'Повторение: когда, возвращать, завтра'
    gloss: когда / возвращать / завтра
    note: Это уже знакомые слова, с их помощью можно спросить о времени возврата.
    target_text: کی (когда) / پس دادن (возвращать) / پس می‌دهین (вы возвращаете; вежливо) / پس می‌دهم (я возвращаю) / فردا (завтра) / را (показатель прямого дополнения)
  prs.a1.unit48.lesson03.teach.ask_return_time_phrase:
    title: Когда вы вернёте велосипед?
    gloss: Когда вы вернёте велосипед?
    note: Здесь глагол «возвращать» используется с уже знакомым вежливым окончанием.
  prs.a1.unit48.lesson03.teach.return_tomorrow_phrase:
    title: Я верну его завтра
    gloss: Я верну его завтра.
    note: Здесь глагол «возвращать» используется с ожидаемым окончанием 1-го лица настоящего времени.
  prs.a1.unit48.lesson04.teach.review_hello_want_rent_take:
    title: 'Повторение: здравствуйте, я хочу, аренда, чтобы я взял'
