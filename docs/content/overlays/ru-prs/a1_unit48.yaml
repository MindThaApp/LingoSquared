    note: Это уже знакомые слова (из прошлых уроков и этого урока), с их помощью можно спросить о залоге.
    target_text: بسیار خوب (очень хорошо) / تذکره (удостоверение личности) / می‌خواهین (вы хотите; вежливо)
  prs.a1.unit48.lesson04.teach.review_yes_for_rent_want:
