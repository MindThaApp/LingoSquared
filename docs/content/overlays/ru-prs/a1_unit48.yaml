teaching:
  prs.a1.unit48.lesson01.teach.review_this_is_in:
    title: 'Повторение: это, есть, в'
    gloss: это / есть / в
    note: Это уже знакомые слова (они встречались в этом курсе), с их помощью можно говорить о пункте проката велосипедов.
    target_text: این (этот) / است (есть) / در (в)
  prs.a1.unit48.lesson01.teach.review_shop_shopkeeper_bike:
    title: 'Повторение: магазин, владелец магазина, велосипед'
    gloss: магазин / владелец магазина / велосипед
    note: Слова «магазин» и «владелец магазина» повторяются из урока 10, а слово «велосипед» — из урока 24.
    target_text: دوکان (магазин) / دوکاندار (владелец магазина) / دوچرخه (велосипед)
  prs.a1.unit48.lesson01.teach.rent_word:
    title: Аренда / плата за аренду
    gloss: аренда / плата за аренду
    note: Это обычное слово дари для платы за аренду; в этом курсе оно уже встречалось в значении платы за жильё.
    example_gloss: Это пункт проката велосипедов.
  prs.a1.unit48.lesson01.teach.this_is_bike_rental_shop_phrase:
    title: Это пункт проката велосипедов
    gloss: Это пункт проката велосипедов.
    note: Здесь соединены слова «это», «магазин», «аренда» и «велосипед» — два существительных стоят рядом без связующего слова, как уже было в этом курсе.
  prs.a1.unit48.lesson01.teach.shopkeeper_at_shop_phrase:
    title: Владелец магазина в магазине
    gloss: Владелец магазина в магазине.
    note: Здесь соединены слова «владелец магазина» и «магазин».
  prs.a1.unit48.lesson02.teach.review_want_take_rent_bike:
    title: 'Повторение: я хочу, чтобы я взял, аренда, велосипед'
    gloss: я хочу / чтобы я взял / аренда / велосипед
    note: Это уже знакомые слова, с их помощью можно попросить о прокате.
    target_text: می‌خواهم (я хочу) / بگیرم (чтобы я взял) / کرایه (аренда) / دوچرخه (велосипед) / یک (один)
  prs.a1.unit48.lesson02.teach.daily_word:
    title: В день
    gloss: в день, ежедневно
    note: Это обычное слово дари для «ежедневно»; здесь оно используется, чтобы назвать цену аренды за день.
    example_gloss: Пятьдесят афгани в день.
  prs.a1.unit48.lesson02.teach.want_to_rent_phrase:
    title: Я хочу взять велосипед напрокат
    gloss: Я хочу взять велосипед напрокат.
    note: Здесь тот же образец «хочу + сослагательное наклонение», что уже был в темах о взятии книг в библиотеке и записи на приём.
  prs.a1.unit48.lesson02.teach.ask_daily_price_phrase:
    title: Сколько стоит аренда велосипеда в день?
    gloss: Сколько стоит аренда велосипеда в день?
