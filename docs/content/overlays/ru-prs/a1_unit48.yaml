    title: 'Хумайун: Очень хорошо. Вам нужно удостоверение личности?'
    gloss: Очень хорошо. Вам нужно удостоверение личности?
  prs.a1.unit48.lesson04.teach.dialogue_line4:
    title: 'Продавец: Да, для проката мне нужно ваше удостоверение личности.'
    gloss: Да, для проката мне нужно ваше удостоверение личности.
