    target_text: بفرمایین (пожалуйста, вот, возьмите) / روزانه (в день) / پنجاه (пятьдесят) / افغانی (афгани) / است (есть, является)
  prs.a1.unit48.lesson04.teach.review_very_good_id_want_polite:
