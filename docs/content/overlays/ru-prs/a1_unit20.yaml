teaching:
  prs.a1.unit20.lesson01.teach.yesterday_word:
    title: Вчера
    gloss: вчера
    note: دیروز означает «вчера».
    example_gloss: Вчера я ходил.
  prs.a1.unit20.lesson01.teach.office_word:
    title: В офис
    gloss: в офис
    note: به دفتر означает «в офис» — это выражение уже знакомо по уроку о распорядке дня.
    example_gloss: Я ходил в офис.
  prs.a1.unit20.lesson01.teach.went_word:
    title: Я ходил(а)
    gloss: я пошёл / я пошла
    note: رفتم — форма 1-го лица единственного числа простого прошедшего времени от رفتن (идти, ехать).
    target_text: رفتم (я ходил(а), я пошёл/пошла — прошедшее время от رفتن)
  prs.a1.unit20.lesson02.teach.breakfast_word:
    title: Завтрак
    gloss: завтрак
    note: صبحانه означает «завтрак» — это слово уже знакомо по уроку о распорядке дня.
    example_gloss: Я позавтракал(а).
  prs.a1.unit20.lesson02.teach.ate_word:
    title: Я ел(а)
    gloss: я ел(а)
    note: خوردم — форма 1-го лица единственного числа простого прошедшего времени от خوردن (есть).
    target_text: خوردم (я ел(а) — прошедшее время от خوردن)
  prs.a1.unit20.lesson03.teach.work_word:
    title: Работа
    gloss: работа
    note: کار означает «работа» (существительное).
    example_gloss: Я работал(а).
  prs.a1.unit20.lesson03.teach.did_word:
    title: Я сделал(а)
    gloss: я делал(а)
    note: کردم — форма 1-го лица единственного числа простого прошедшего времени от کردن (делать). کار کردم буквально значит «я сделал(а) работу», то есть «я работал(а)».
    target_text: کردم (я делал(а) — прошедшее время от کردن)
  prs.a1.unit20.lesson04.teach.yesterday_text:
    title: Короткий рассказ о вчерашнем дне
    gloss: Вчера я ходил в офис. Я позавтракал. Я работал.
    note: Короткий рассказ от первого лица о том, что автор делал вчера, с новыми глаголами прошедшего времени из этого урока.
  prs.a1.unit20.lesson05.teach.seven_oclock:
    title: Семь часов
    gloss: семь часов
    note: ساعت هفت означает «семь часов» — это выражение уже знакомо по урокам о времени и распорядке дня.
    example_gloss: Я ушёл в семь часов.
  prs.a1.unit20.lesson05.teach.tired_word:
    title: Усталый
    gloss: усталый
    note: خسته означает «усталый».
    example_gloss: Я устал(а).
  prs.a1.unit20.lesson05.teach.became_word:
    title: Я стал(а)
    gloss: я стал(а)
    note: شدم — форма 1-го лица единственного числа простого прошедшего времени от شدن (становиться); тот же глагол, что в بیدار می‌شوم (я просыпаюсь) из урока о распорядке дня. خسته شدم буквально значит «я стал(а) усталым(ой)», то есть «я устал(а)».
    target_text: شدم (я стал(а) — прошедшее время от شدن)
  prs.a1.unit20.lesson05.teach.longer_yesterday_text:
    title: Более длинный рассказ о вчерашнем дне
    gloss: Вчера в семь часов я пошёл в офис. Я позавтракал. Я поработал. Я устал.
    note: Тот же рассказ, что и в четвёртом уроке, но дополненный точным временем и тем, как автор себя чувствовал после.
  prs.a1.unit20.lesson06.teach.names:
    title: Зармина и Хумайун
    gloss: Зармина, Хумайун
    note: Постоянные персонажи этого курса; впервые они появились в разделах о времени и распорядке дня.
    example_gloss:
    - Я Зармина.
    - Я Хумайун.
  prs.a1.unit20.lesson06.teach.where_word:
    title: Где
    gloss: где
    note: کجا означает «где» или «куда».
    target_text: کجا (где, куда)
  prs.a1.unit20.lesson06.teach.you_went_word:
    title: Ты ходил(а)
    gloss: ты ходил / ты ходила; ты пошёл / ты пошла
    note: رفتی — форма простого прошедшего времени 2-го лица единственного числа от глагола رفتن («идти, ехать»).
    target_text: رفتی (ты ходил(а), ты пошёл/пошла — 2-е лицо от رفتن)
  prs.a1.unit20.lesson06.teach.you_worked_word:
    title: Ты работал(а)
    gloss: ты сделал / ты сделала; ты работал / ты работала
    note: کردی — форма простого прошедшего времени 2-го лица единственного числа от глагола کردن («делать»).
    target_text: کردی (ты делал(а), работал(а) — 2-е лицо от کردن)
  prs.a1.unit20.lesson06.teach.she_went_word:
    title: Он/она ходил(а)
    gloss: она пошла / он пошёл
    note: 'رفت — форма простого прошедшего времени 3-го лица единственного числа от глагола رفتن: это чистая основа прошедшего времени без окончания.'
    target_text: رفت (он/она пошёл/пошла — 3-е лицо от رفتن, нужно для пересказа диалога о Зармине)
  prs.a1.unit20.lesson06.teach.she_worked_word:
    title: Он/она работал(а)
    gloss: она сделала / работала; он сделал / работал
    note: 'کرد — форма простого прошедшего времени 3-го лица единственного числа от глагола کردن: это чистая основа прошедшего времени.'
    target_text: کرد (он/она делал(а), работал(а) — 3-е лицо от کردن)
  prs.a1.unit20.lesson06.teach.she_became_word:
    title: Он/она стал(а)
    gloss: она стала / он стал
    note: 'شد — форма простого прошедшего времени 3-го лица единственного числа от глагола شدن («становиться»): это чистая основа прошедшего времени.'
    target_text: شد (он/она стал(а) — 3-е лицо от شدن)
  prs.a1.unit20.lesson06.teach.yes_word:
    title: Да
    gloss: да
    note: بلی — вежливое, официальное слово «да», что соответствует стилю этого курса.
    example_gloss: Да, я работал.
  prs.a1.unit20.lesson06.teach.dialogue_line1:
    title: Хумайун спрашивает
    gloss: Зармина, куда ты вчера ходила?
  prs.a1.unit20.lesson06.teach.dialogue_line2:
    title: Зармина отвечает
    gloss: Я ходила в офис.
  prs.a1.unit20.lesson06.teach.dialogue_line3:
    title: Хумайун спрашивает
    gloss: Ты работала?
  prs.a1.unit20.lesson06.teach.dialogue_line4:
    title: Зармина отвечает
    gloss: Да, я работала. Я устала.
