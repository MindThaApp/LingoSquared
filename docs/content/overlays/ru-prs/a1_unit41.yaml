course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: сообщи, что вещь потеряна, спроси, нашлась ли она, опиши вещь по цвету и размеру и прочитай короткий текст о найденной потерянной вещи.'
units:
  prs.a1.unit41.lost_items:
    title: Потерянные вещи
    description: Сообщи о потерянной личной вещи, спроси, нашлась ли она, опиши её и узнай, когда она найдётся.
lessons:
  prs.a1.unit41.lesson01.lost_item_vocabulary:
    title: Слова о потерянных вещах
  prs.a1.unit41.lesson02.asking_if_found:
    title: Как спросить, нашлась ли вещь
  prs.a1.unit41.lesson03.describing_the_item:
    title: Описание вещи
  prs.a1.unit41.lesson04.lost_bag_dialogue:
    title: Диалог о потерянной сумке
  prs.a1.unit41.lesson05.reading:
    title: Читаем о потерянной сумке
  prs.a1.unit41.lesson06.wrap_up:
    title: Итоги
teaching:
  prs.a1.unit41.lesson01.teach.review_this_is:
    title: 'Повторение: этот, есть (является)'
    gloss: этот / есть
    note: Слова این и است — ранее изученные слова, с помощью которых говорят, что это такое.
    target_text: این (этот, это) / است (есть, является)
  prs.a1.unit41.lesson01.teach.review_have:
    title: 'Повторение: у меня есть'
    gloss: у меня есть
    note: 'Слово دارم — повторение: им говорят, какая вещь у тебя есть или с тобой.'
    target_text: دارم (у меня есть)
  prs.a1.unit41.lesson01.teach.bag_word:
    title: Сумка
    gloss: сумка
    note: خریطه — обычное слово в дари для сумки.
    example_gloss: У меня есть сумка.
  prs.a1.unit41.lesson01.teach.wallet_word:
    title: Кошелёк
    gloss: кошелёк
    note: کیف پول значит «кошелёк»; буквально это слово составлено из کیف (сумочка, футляр) и پول (деньги).
    example_gloss: У меня есть кошелёк.
  prs.a1.unit41.lesson01.teach.key_word:
    title: Ключ
    gloss: ключ
    note: کلید значит «ключ».
    example_gloss: У меня есть ключ.
  prs.a1.unit41.lesson01.teach.glasses_word:
    title: Очки
    gloss: очки
    note: عینک значит «очки».
    example_gloss: У меня есть очки.
  prs.a1.unit41.lesson01.teach.lost_word:
    title: Потерян(а)
    gloss: потерян(а)
    note: گم شده состоит из گم (потерянный) и شده (ставший) — это обычный способ сказать, что вещь потеряна; та же модель, что и в زخمی است (ранен) из Урока 40.
    example_gloss: Моя сумка потерялась.
  prs.a1.unit41.lesson01.teach.wallet_lost_phrase:
    title: Мой кошелёк потерялся!
    gloss: Мой кошелёк потерялся!
    note: کیف پولم — это کیف پول с притяжательным суффиксом -م («мой»), как в خانه‌ام (мой дом) из предыдущих уроков.
  prs.a1.unit41.lesson02.teach.review_can_help:
    title: 'Повторение: можете ли вы, мне, помощь, сделайте (вежливая просьба)'
    gloss: можете ли вы / мне / помощь / сделайте
    note: می‌توانین, مه ره, کمک и کنین вместе образуют просьбу о помощи.
    target_text: می‌توانین (вы можете) / مه ره (меня) / کمک (помощь) / کنین (сделайте — вежливое повелительное наклонение)
  prs.a1.unit41.lesson02.teach.review_ra:
    title: 'Повторение: (показатель прямого объекта)'
    gloss: (показатель прямого объекта)
    note: را отмечает то, на что направлено действие; здесь — то, что увидели.
    target_text: را (показатель прямого дополнения)
  prs.a1.unit41.lesson02.teach.did_you_see_word:
    title: Вы видели?
    gloss: вы видели
    note: دیدین — вежливая форма прошедшего времени для «вы» от глагола دیدن (видеть), который встречался в Уроке 2 во фразе از دیدن شما خوشحال شدم.
    example_gloss: Вы видели мою сумку?
  prs.a1.unit41.lesson02.teach.did_you_see_my_bag_phrase:
    title: Вы видели мою сумку?
    gloss: Вы видели мою сумку?
    note: Сочетание خریطه‌ام (моя сумка) с را и دیدین — так спрашивают, не заметил ли кто-то сумку.
  prs.a1.unit41.lesson02.teach.is_found_word:
    title: Найден(а)
    gloss: найден(а) / нашёлся
    note: پیدا شده состоит из پیدا (найденный, обнаруженный) и شده (ставший) — обычный способ спросить, нашлась ли вещь.
    example_gloss: Мой ключ нашёлся.
  prs.a1.unit41.lesson02.teach.has_key_been_found_phrase:
    title: Мой ключ нашёлся?
    gloss: Мой ключ нашёлся?
    note: کلیدم — это کلید с притяжательным суффиксом -م («мой ключ»).
  prs.a1.unit41.lesson03.teach.review_color_black_white:
    title: 'Повторение: цвет, чёрный, белый, и'
    gloss: цвет / чёрный / белый / и
    note: رنگ, سیاه, سفید и و помогают описать цвет вещи.
    target_text: رنگ (цвет) / سیاه (чёрный) / سفید (белый) / و (и)
  prs.a1.unit41.lesson03.teach.review_size:
    title: 'Повторение: большой, маленький'
    gloss: большой / маленький
    note: بزرگ и کوچک описывают размер вещи.
    target_text: بزرگ (большой) / کوچک (маленький)
  prs.a1.unit41.lesson03.teach.here_word:
    title: Здесь
    gloss: здесь
    note: اینجا значит «здесь».
    example_gloss: Ключ здесь.
  prs.a1.unit41.lesson03.teach.bag_black_phrase:
    title: Моя сумка чёрная
    gloss: Моя сумка чёрная.
    note: خریطه‌ام (моя сумка) и سیاه (чёрный) — так описывают вещь, чтобы её можно было узнать.
  prs.a1.unit41.lesson03.teach.wallet_small_black_phrase:
    title: Мой кошелёк маленький и чёрный
    gloss: Мой кошелёк маленький и чёрный.
    note: 'و («и») соединяет два определения: کوچک (маленький) и سیاه (чёрный).'
  prs.a1.unit41.lesson04.teach.review_what_thanks:
    title: 'Повторение: что, большое спасибо'
    gloss: что / большое спасибо
    note: چه и تشکر زیاد — повторяемые слова, которые используются в диалоге.
    target_text: چه (что) / تشکر زیاد (большое спасибо)
  prs.a1.unit41.lesson04.teach.review_yes_welcome:
    title: 'Повторение: да, пожалуйста'
    gloss: да / пожалуйста
    note: بلی и خواهش می‌کنم — повторяемые слова, которые используются в диалоге.
    target_text: بلی (да) / خواهش می‌کنم (пожалуйста)
  prs.a1.unit41.lesson04.teach.dialogue_line1:
    title: 'Хумаюн: Зармина, моя сумка потерялась!'
    gloss: Зармина, моя сумка потерялась!
  prs.a1.unit41.lesson04.teach.dialogue_line2:
    title: 'Зармина: Какого она цвета?'
    gloss: Какого она цвета?
  prs.a1.unit41.lesson04.teach.dialogue_line3:
    title: 'Хумаюн: Она чёрная.'
    gloss: Она чёрная.
  prs.a1.unit41.lesson04.teach.dialogue_line4:
    title: 'Зармина: Да, я её видела! Она здесь.'
    gloss: Да, я её видела! Она здесь.
  prs.a1.unit41.lesson04.teach.dialogue_line5:
    title: 'Хумаюн: Большое спасибо!'
    gloss: Большое спасибо!
  prs.a1.unit41.lesson04.teach.dialogue_line6:
    title: 'Зармина: Пожалуйста.'
    gloss: Пожалуйста.
  prs.a1.unit41.lesson05.teach.review_one_have:
    title: 'Повторение: один, у него/неё есть'
    gloss: один / у него (неё) есть
    note: Слова یک и دارد повторяются в тексте для чтения.
    target_text: یک (один) / دارد (у него/неё есть)
  prs.a1.unit41.lesson05.teach.reading_passage:
    title: Читаем о потерянной сумке
    gloss: У Хумаюна есть сумка. Его сумка чёрная. Его сумка потерялась. Зармина видит сумку. Сумка здесь!
  prs.a1.unit41.lesson06.teach.review_wrap_up_words:
    title: 'Повторение: у меня нет, но, вы (вежливо)'
    gloss: у меня нет / но / вы (вежливо)
    note: 'Слова ندارم, اما и شما повторяются: с их помощью можно противопоставить наличие и отсутствие вещи и задать вежливый вопрос.'
    target_text: ندارم (у меня нет) / اما (но) / شما (вы, вежливо)
  prs.a1.unit41.lesson06.teach.contrast_phrase:
    title: Ключ у меня есть, а сумки нет
    gloss: Ключ у меня есть, но сумки нет.
    note: Союз اما противопоставляет наличие ключа отсутствию сумки.
  prs.a1.unit41.lesson06.teach.formal_question_phrase:
    title: Вы видели мою сумку?
    gloss: Вы видели мою сумку?
    note: 'Вежливый вариант вопроса с شما: так можно прямо и учтиво спросить, видел ли человек вещь.'
