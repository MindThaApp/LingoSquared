    gloss: вы занимаетесь спортом (вежливая форма)
    note: ورزش می‌کنین — вежливая форма «вы занимаетесь спортом».
    target_text: ورزش می‌کنین (вы занимаетесь спортом, вежливая форма)
  prs.a1.unit29.lesson02.teach.question_frequency:
