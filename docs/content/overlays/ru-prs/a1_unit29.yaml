    title: Игра / делать → играть
    gloss: игра / делать → я играю
    note: بازی (игра) сочетается с کردن (делать, повторение) и образует بازی می‌کنم (я играю) — по той же модели, что уже встречалась в پیاده‌روی می‌کنم и آشپزی می‌کنم.
    target_text: بازی (игра) + کردن (делать) = بازی می‌کنم (я играю)
