course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: рассказывай о четырёх временах года, описывай типичную погоду каждого, спрашивай и говори, какое время года тебе нравится, и читай короткий текст о любимых временах года двух людей.'
units:
  prs.a1.unit39.seasons:
    title: Времена года
    description: Рассказывай о четырёх временах года и описывай типичную погоду и занятия, связанные с каждым из них.
lessons:
  prs.a1.unit39.lesson01.primary_seasons:
    title: Четыре времени года
  prs.a1.unit39.lesson02.season_weather:
    title: Погода по временам года
  prs.a1.unit39.lesson03.asking_about_seasons:
    title: Вопросы о временах года
  prs.a1.unit39.lesson04.seasons_dialogue:
    title: Диалог о временах года
  prs.a1.unit39.lesson05.seasons_reading:
    title: Читаем о временах года
  prs.a1.unit39.lesson06.wrap_up:
    title: Итоги
teaching:
  prs.a1.unit39.lesson01.teach.review_basics:
    title: 'Повторение: четыре, есть, год'
    gloss: четыре / есть / год
    note: Слова چهار, است и سال — повторение; с них начинается лексика этого урока о временах года.
    target_text: چهار (четыре) / است (есть, является) / سال (год)
  prs.a1.unit39.lesson01.teach.review_weather_connectors:
    title: 'Повторение: погода, жаркий, холодный, очень, сегодня, и, но'
    gloss: погода / жаркий / холодный / очень / сегодня / и / но
    note: Слова هوا, گرم, سرد, خیلی, امروز, و и اما — повторение; они встречаются во всех предложениях этого урока о временах года.
    target_text: هوا (погода) / گرم (жаркий) / سرد (холодный) / خیلی (очень) / امروز (сегодня) / و (и) / اما (но)
  prs.a1.unit39.lesson01.teach.fasl_word:
    title: Время года
    gloss: время года
    note: فصل означает «время года».
    example_gloss: В году четыре времени года.
  prs.a1.unit39.lesson01.teach.bahar_word:
    title: Весна
    gloss: весна
    note: بهار — обычное слово дари со значением «весна».
    example_gloss: Весна тёплая.
  prs.a1.unit39.lesson01.teach.tabestan_word:
    title: Лето
    gloss: лето
    note: تابستان означает «лето».
    example_gloss: Лето очень жаркое.
  prs.a1.unit39.lesson01.teach.khonak_word:
    title: Прохладный
    gloss: прохладный
    note: خنک означает «прохладный» (о температуре).
    example_gloss: Сегодня погода прохладная.
  prs.a1.unit39.lesson01.teach.khazan_word:
    title: Осень
    gloss: осень
    note: خزان — обычное афганское слово дари для «осени». В Иране чаще говорят پاییز.
    example_gloss: Осень прохладная.
  prs.a1.unit39.lesson01.teach.zemestan_word:
    title: Зима
    gloss: зима
    note: زمستان означает «зима».
    example_gloss: Зима холодная.
  prs.a1.unit39.lesson01.teach.warm_seasons_phrase:
    title: Весна тёплая, а лето очень жаркое
    gloss: Весна тёплая, а лето очень жаркое.
    note: و соединяет два описания погоды в разные времена года в одно предложение.
  prs.a1.unit39.lesson01.teach.cool_cold_contrast_phrase:
    title: Осень прохладная, но зима холодная
    gloss: Осень прохладная, но зима холодная.
    note: اما противопоставляет погоду двух разных времён года в одном предложении.
  prs.a1.unit39.lesson02.teach.review_in_becomes:
    title: 'Повторение: в, становится'
    gloss: в / становится
    note: در и می‌شود — уже знакомые слова; с их помощью рассказывают, как меняется погода в разные времена года.
    target_text: در (в) / می‌شود (становится)
  prs.a1.unit39.lesson02.teach.review_rain_snow_sunny:
    title: 'Повторение: идёт (о дожде, снеге), дождь, снег, солнечный'
    gloss: идёт (о дожде, снеге) / дождь / снег / солнечный
    note: می‌بارد, باران, برف и آفتابی — уже знакомые слова; с их помощью описывают типичную погоду каждого времени года.
    target_text: می‌بارد (идёт) / باران (дождь) / برف (снег) / آفتابی (солнечный)
  prs.a1.unit39.lesson02.teach.rain_in_spring_phrase:
    title: Весной идёт дождь
    gloss: Весной идёт дождь.
    note: 'در بهار باران می‌بارد буквально: «весной дождь падает».'
  prs.a1.unit39.lesson02.teach.hot_in_summer_phrase:
    title: Летом погода становится очень жаркой
    gloss: Летом погода становится очень жаркой.
    note: می‌شود («становится») описывает изменение погоды в течение времени года.
  prs.a1.unit39.lesson02.teach.cool_in_autumn_phrase:
    title: Осенью погода становится прохладной
    gloss: Осенью погода становится прохладной.
    note: Та же конструкция с می‌شود, здесь — о более прохладной осенней погоде.
  prs.a1.unit39.lesson02.teach.snow_in_winter_phrase:
    title: Зимой идёт снег
    gloss: Зимой идёт снег.
    note: 'در زمستان برف می‌بارد буквально: «зимой снег падает».'
  prs.a1.unit39.lesson02.teach.sunny_summer_phrase:
    title: Лето солнечное
    gloss: Лето солнечное.
    note: Простое предложение с است, описывающее типичную погоду лета.
  prs.a1.unit39.lesson02.teach.cold_snow_winter_phrase:
    title: Зима холодная, и идёт снег
    gloss: Зима холодная, и идёт снег.
    note: و объединяет два факта о зимней погоде в одно предложение.
  prs.a1.unit39.lesson03.teach.review_which_object_marker:
    title: 'Повторение: какой, показатель прямого объекта, я'
    gloss: какой / показатель прямого объекта / я
    note: کدام, را и من («я») — уже знакомые формы; с их помощью спрашивают о любимом времени года и отвечают.
    target_text: کدام (какой) / را (показатель прямого объекта) / من (я)
  prs.a1.unit39.lesson03.teach.review_like_forms:
    title: 'Повторение: вам нравится (вежливо), мне нравится, мне не нравится'
    gloss: вам нравится (вежливо) / мне нравится / мне не нравится
    note: دوست دارین, دوست دارم и دوست ندارم — уже знакомые формы глагола دوست داشتن («любить, нравиться»).
    target_text: دوست دارین (вам нравится) / دوست دارم (мне нравится) / دوست ندارم (мне не нравится)
  prs.a1.unit39.lesson03.teach.review_mahboob:
    title: 'Повторение: любимый'
    gloss: любимый / популярный
    note: محبوب здесь снова употребляется в значении «любимый».
    target_text: محبوب (любимый)
  prs.a1.unit39.lesson03.teach.which_season_like_question_phrase:
    title: Какое время года вам нравится?
    gloss: Какое время года вам нравится?
    note: 'کدام فصل را دوست دارین؟ буквально: «какое время года [показатель объекта] вы любите?»'
  prs.a1.unit39.lesson03.teach.favorite_season_spring_phrase:
    title: Моё любимое время года — весна
    gloss: Моё любимое время года — весна.
    note: 'فصل محبوب من буквально: «время года любимое моё».'
  prs.a1.unit39.lesson03.teach.dont_like_winter_phrase:
    title: Я не люблю зиму
    gloss: Я не люблю зиму.
    note: دوست ندارم — отрицательная форма глагола دوست داشتن для «я».
  prs.a1.unit39.lesson04.teach.review_dialogue_words:
    title: 'Повторение: вы (вежливо), да'
    gloss: вы (вежливо) / да
    note: شما и بلی — уже знакомые слова из диалога о временах года.
    target_text: شما (вы) / بلی (да)
  prs.a1.unit39.lesson04.teach.dialogue_line1:
    title: 'Хумаюн: Зармина, какое время года вам нравится?'
    gloss: Зармина, какое время года вам нравится?
  prs.a1.unit39.lesson04.teach.dialogue_line2:
    title: 'Зармина: Мне нравится весна. Весной тепло и солнечно.'
    gloss: Мне нравится весна. Весной тепло и солнечно.
  prs.a1.unit39.lesson04.teach.dialogue_line3:
    title: 'Хумаюн: Моё любимое время года — зима.'
    gloss: Моё любимое время года — зима.
  prs.a1.unit39.lesson04.teach.dialogue_line4:
    title: 'Зармина: Зима? Зимой очень холодно!'
    gloss: Зима? Зимой очень холодно!
  prs.a1.unit39.lesson04.teach.dialogue_line5:
    title: 'Хумаюн: Да, но я люблю снег.'
    gloss: Да, но я люблю снег.
  prs.a1.unit39.lesson04.teach.dialogue_line6:
    title: 'Зармина: Я не люблю снег.'
    gloss: Я не люблю снег.
  prs.a1.unit39.lesson05.teach.review_reading_words:
    title: 'Повторение: он/она, ему/ей нравится'
    gloss: он/она / он/она любит
    note: او и دوست دارد — уже знакомые формы, которые встречаются в этом тексте.
    target_text: او (он/она) / دوست دارد (ему/ей нравится)
  prs.a1.unit39.lesson05.teach.reading_passage:
    title: Текст о любимых временах года
    gloss: Любимое время года Хумаюна — зима. Зимой холодно и идёт снег. Он любит снег. Любимое время года Зармины — весна. Весной тепло и солнечно. Она любит весну.
  prs.a1.unit39.lesson06.teach.review_like_dislike:
    title: 'Повторение: я люблю, я не люблю'
    gloss: я люблю / я не люблю
    note: دوست دارم и دوست ندارم — уже знакомые формы; здесь они противопоставляют любимое и нелюбимое время года.
    target_text: دوست دارم (мне нравится) / دوست ندارم (мне не нравится)
  prs.a1.unit39.lesson06.teach.contrast_phrase:
    title: Я люблю зиму, но не люблю лето
    gloss: Я люблю зиму, но не люблю лето.
    note: اما противопоставляет любимое время года нелюбимому в одном предложении.
  prs.a1.unit39.lesson06.teach.formal_question_phrase:
    title: Какое время года вам нравится?
    gloss: Какое время года вам нравится?
    note: Вежливый вариант вопроса из урока 3 с شما — для прямого учтивого обращения.
