course:
  title: Дари A1
  description: 'Начальный кабульский дари: называй основные черты характера, спрашивай, какой человек, давай простые объяснения со словом «потому что» и описывай характер человека в коротком тексте.'
units:
  prs.a1.unit37.personality:
    title: Характер
    description: Описывай основные черты характера человека и спрашивай, какой он.
lessons:
  prs.a1.unit37.lesson01.personality_words:
    title: Слова о характере
  prs.a1.unit37.lesson02.more_traits:
    title: Ещё черты характера
  prs.a1.unit37.lesson03.asking_about_personality:
    title: Вопросы о характере
  prs.a1.unit37.lesson04.personality_dialogue:
    title: Диалог о характере
  prs.a1.unit37.lesson05.personality_reading:
    title: Читаем о характере
  prs.a1.unit37.lesson06.wrap_up:
    title: Повторение
teaching:
  prs.a1.unit37.lesson01.teach.mehraban_word:
    title: Добрый
    gloss: добрый
    note: مهربان — стандартное слово дари для доброго, сердечного человека.
    example_gloss: Он/она добрый(ая).
  prs.a1.unit37.lesson01.teach.zahmatkash_word:
    title: Трудолюбивый
    gloss: трудолюбивый
    note: زحمتکش буквально означает «тот, кто берёт на себя труд и усилия», то есть трудолюбивый человек.
    example_gloss: Он/она трудолюбивый(ая).
  prs.a1.unit37.lesson01.teach.bahosh_word:
    title: Умный
    gloss: умный / смышлёный
    note: باهوش состоит из با («с») и هوش («ум») — умный, сообразительный человек.
    example_gloss: Он/она умный(ая).
  prs.a1.unit37.lesson01.teach.tambal_word:
    title: Ленивый
    gloss: ленивый
    note: تنبل означает «ленивый».
    example_gloss: Он/она ленивый(ая).
  prs.a1.unit37.lesson01.teach.review_basics:
    title: 'Повторение: он/она, есть, и, но'
    gloss: он/она / есть / и / но
    note: او, است, و и اما — знакомые слова, которые встречаются во всех предложениях о характере в этом уроке.
    target_text: او (он/она) / است (есть, является) / و (и) / اما (но)
  prs.a1.unit37.lesson01.teach.kind_and_hardworking_phrase:
    title: Он/она добрый(ая) и трудолюбивый(ая)
    gloss: Он/она добрый(ая) и трудолюбивый(ая).
    note: و соединяет две черты в одном предложении.
  prs.a1.unit37.lesson01.teach.smart_but_lazy_phrase:
    title: Он/она умный(ая), но ленивый(ая)
    gloss: Он/она умный(ая), но ленивый(ая).
    note: اما противопоставляет две черты в одном предложении.
  prs.a1.unit37.lesson02.teach.shokh_word:
    title: Смешной
    gloss: весёлый / шутливый
    note: شوخ описывает человека, который любит шутить или игривый.
    example_gloss: Он/она весёлый(ая).
  prs.a1.unit37.lesson02.teach.kamharf_word:
    title: Молчаливый
    gloss: молчаливый / сдержанный
    note: کم‌حرف буквально означает «мало слов» — молчаливый, сдержанный человек.
    example_gloss: Он/она молчаливый(ая).
  prs.a1.unit37.lesson02.teach.rastgoo_word:
    title: Честный
    gloss: честный
    note: 'راستگو состоит из راست (правдивый, прямой) и گو (говорящий): правдивый, честный человек.'
    example_gloss: Он/она честный(ая).
  prs.a1.unit37.lesson02.teach.review_and_but:
    title: 'Повторение: «и», «но»'
    gloss: и / но
    note: و («и») и اما («но») — слова, которые помогают соединять или противопоставлять черты характера.
    target_text: و (и) / اما (но)
  prs.a1.unit37.lesson02.teach.funny_and_honest_phrase:
    title: Он/она остроумный(ая) и честный(ая)
    gloss: Он/она остроумный(ая) и честный(ая).
    note: Две положительные черты соединены с помощью و.
  prs.a1.unit37.lesson02.teach.quiet_but_kind_phrase:
    title: Он/она немногословный(ая), но добрый(ая)
    gloss: Он/она немногословный(ая), но добрый(ая).
    note: اما противопоставляет сдержанную черту характера и тёплую.
  prs.a1.unit37.lesson03.teach.person_word:
    title: Человек
    gloss: человек
    note: آدم — обычное слово для человека; оно не указывает на мужской или женский род.
    example_gloss: Он/она хороший человек.
  prs.a1.unit37.lesson03.teach.review_how_because:
    title: 'Повторение: какой, потому что, помощь'
    gloss: какой, каков / потому что / помощь
    note: 'چطور, چون и کمک — слова для повторения: с их помощью можно спросить о характере и объяснить его.'
    target_text: چطور (как, какой) / چون (потому что) / کمک (помощь)
  prs.a1.unit37.lesson03.teach.what_kind_person_question:
    title: Что он/она за человек?
    gloss: Что он/она за человек?
    note: 'او چطور آدم است؟ буквально: «он/она — какой человек?». Так естественно спрашивают, каков человек.'
  prs.a1.unit37.lesson03.teach.kind_because_helps_phrase:
    title: Он/она добрый(ая), потому что помогает
    gloss: Он/она добрый(ая), потому что помогает.
    note: چون вводит причину; کمک می‌کند буквально означает «делает помощь».
  prs.a1.unit37.lesson03.teach.hardworking_because_works_phrase:
    title: Он/она трудолюбивый(ая), потому что много работает
    gloss: Он/она трудолюбивый(ая), потому что много работает.
    note: زیاد کار می‌کند буквально означает «делает много работы».
  prs.a1.unit37.lesson04.teach.review_dialogue_words:
    title: Да / немного / всегда
    gloss: да / немного / всегда
    note: بلی, کمی и همیشه — слова для повторения, которые встречаются в диалоге о характере.
    target_text: بلی (да) / کمی (немного) / همیشه (всегда)
  prs.a1.unit37.lesson04.teach.dialogue_line1:
    title: 'Хомайун: Зармина, что за человек Карим?'
    gloss: Зармина, что за человек Карим?
  prs.a1.unit37.lesson04.teach.dialogue_line2:
    title: 'Зармина: Карим добрый и трудолюбивый.'
    gloss: Карим добрый и трудолюбивый.
  prs.a1.unit37.lesson04.teach.dialogue_line3:
    title: 'Хомайун: Он умный?'
    gloss: Он умный?
  prs.a1.unit37.lesson04.teach.dialogue_line4:
    title: 'Зармина: Да, умный, но немного молчаливый.'
    gloss: Да, умный, но немного молчаливый.
  prs.a1.unit37.lesson04.teach.dialogue_line5:
    title: 'Хомайун: Он честный?'
    gloss: Он честный?
  prs.a1.unit37.lesson04.teach.dialogue_line6:
    title: 'Зармина: Да, он всегда честный.'
    gloss: Да, он всегда честный.
  prs.a1.unit37.lesson05.teach.review_reading_words:
    title: Иногда, все, показатель прямого объекта, им нравится
    gloss: иногда / все / показатель прямого дополнения / они любят
    note: گاهی («иногда») и همه («все») встречаются в тексте для чтения; را отмечает определённое прямое дополнение; دوست دارند — форма 3-го лица множественного числа от دوست دارم («я люблю»).
    target_text: گاهی (иногда) / همه (все) / را (показатель прямого дополнения) / دوست دارند (они любят)
  prs.a1.unit37.lesson05.teach.reading_passage:
    title: Текст о характере Хомайуна
    gloss: Хомайун добрый и трудолюбивый. Он умный, но иногда молчаливый. Он всегда честный. Все его любят.
  prs.a1.unit37.lesson06.teach.review_i_am_you_are:
    title: 'Повторение: я есть, вы есть (вежливая форма)'
    gloss: я (есть) / вы (есть), вежливая форма
    note: 'استم и استین — формы связки для повторения: «я есть» и «вы есть» (вежливая форма). Они используются во всех предложениях этого итогового урока.'
    target_text: استم (я есть, я являюсь) / استین (вы есть, вежливая форма)
  prs.a1.unit37.lesson06.teach.self_description_phrase:
    title: Я добрый, но иногда ленивый
    gloss: Я добрый(ая), но иногда ленивый(ая).
    note: من («я») и استم («я есть») позволяют рассказать о собственном характере напрямую по той же модели او/است, что и во всём разделе.
  prs.a1.unit37.lesson06.teach.formal_question_phrase:
    title: Что вы за человек?
    gloss: Что вы за человек?
    note: Добавляются شما («вы», вежливая форма) и استین («вы есть», вежливая форма) к уже знакомому вопросу из третьего урока; теперь он обращён прямо к тебе.
