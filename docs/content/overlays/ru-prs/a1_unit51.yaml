    note: 'Это слова для повторения: с ними можно назвать цену кебаба.'
    target_text: بفرمایین (пожалуйста, возьмите) / صد (сто) / و (и) / پنجاه (пятьдесят) / افغانی (афгани) / است (есть, является)
  prs.a1.unit51.lesson04.teach.review_good_bill_bring:
