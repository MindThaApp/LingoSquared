teaching:
  prs.a1.unit51.lesson01.teach.review_this_is_in_good:
    title: 'Повторение: этот, есть, в, хороший'
    gloss: этот / есть, является / в / хороший
    note: Это слова для повторения (они встречались на протяжении всего курса); с ними можно рассказать о ресторане.
    target_text: این (этот) / است (есть, является) / در (в) / خوب (хороший)
  prs.a1.unit51.lesson01.teach.restaurant_word:
    title: Ресторан
    gloss: ресторан
    note: Так по-дарийски называется ресторан (в афганском дари используется более длинная форма с буквой ت на конце).
    example_gloss: Ресторан хороший.
  prs.a1.unit51.lesson01.teach.waiter_word:
    title: Официант
    gloss: официант
    note: Так по-дарийски называется официант в ресторане.
    example_gloss: Официант хороший.
  prs.a1.unit51.lesson01.teach.this_is_restaurant_phrase:
    title: Это ресторан
    gloss: Это ресторан.
    note: Здесь соединяются слова «этот», «есть» и «ресторан» так же, как в этом курсе уже соединялись эти слова раньше.
  prs.a1.unit51.lesson01.teach.waiter_at_restaurant_phrase:
    title: Официант в ресторане
    gloss: Официант в ресторане.
    note: Здесь соединяются слова «официант», «в» и «ресторан».
  prs.a1.unit51.lesson02.teach.review_price_words:
    title: 'Повторение: сколько, афгани, есть, сто, пятьдесят, двадцать, и, в, вкусный, чай'
    gloss: сколько / афгани / есть, является / сто / пятьдесят / двадцать / и / в / вкусный / чай
    note: 'Это слова для повторения (из прошлых уроков): с ними можно читать меню и спрашивать о цене.'
    target_text: چند (сколько) / افغانی (афгани) / است (есть, является) / صد (сто) / پنجاه (пятьдесят) / بیست (двадцать) / و (и) / در (в) / خوش‌مزه (вкусный) / چای (чай)
  prs.a1.unit51.lesson02.teach.menu_word:
    title: Меню
    gloss: меню
    note: Так по-дарийски называется меню; слово заимствовано из английского, как и русское «меню» — из французского.
    example_gloss: Это меню.
  prs.a1.unit51.lesson02.teach.kabab_word:
    title: Кебаб
    gloss: кебаб
    note: Так по-дарийски называется кебаб — популярное афганское блюдо из жареного на огне мяса.
    example_gloss: Кебаб вкусный.
  prs.a1.unit51.lesson02.teach.menu_reading:
    title: Читаем меню
    gloss: В меню кебаб стоит 150 афгани, а чай — 20 афгани.
  prs.a1.unit51.lesson02.teach.review_its_price:
    title: 'Повторение: его цена'
    gloss: его цена
    note: Здесь используется тот же суффикс принадлежности, который уже встречался в этом курсе.
    target_text: قیمتش (его цена)
  prs.a1.unit51.lesson02.teach.ask_kabab_price_phrase:
    title: Сколько стоит кебаб?
    gloss: Сколько стоит кебаб?
    note: Здесь соединены слова, изученные ранее в этом уроке.
  prs.a1.unit51.lesson02.teach.kabab_price_answer_phrase:
    title: Его цена — 150 афгани
    gloss: Его цена — 150 афгани.
    note: Здесь названа цена кебаба из меню.
  prs.a1.unit51.lesson03.teach.review_ask_order_setup:
    title: 'Повторение: вы (вежливо), что это, я, я хочу, один/некий'
    gloss: вы (вежливо) / что это / я / я хочу / один
    note: 'Это слова для повторения: с ними можно спросить о заказе и назвать свой заказ.'
    target_text: شما (вы) / چیست (что) / من (я) / می‌خواهم (я хочу) / یک (один, какой-то)
  prs.a1.unit51.lesson03.teach.order_word:
    title: Заказ / просьба
    gloss: заказ / просьба
    note: Так по-дарийски называется заказ или просьба, например заказ еды в ресторане.
    example_gloss: Мой заказ — кебаб.
  prs.a1.unit51.lesson03.teach.ask_your_order_phrase:
    title: Что вы будете заказывать?
    gloss: Что вы будете заказывать?
    note: Здесь используется уже знакомая по этому курсу модель вопроса «что это?», но со словом «заказ».
  prs.a1.unit51.lesson03.teach.want_kabab_phrase:
    title: Я хочу кебаб
    gloss: Я хочу кебаб.
    note: Здесь та же модель с глаголом «хотеть», что уже встречалась в курсе, но с новым объектом — кебабом.
  prs.a1.unit51.lesson03.teach.review_bill_object_please:
    title: 'Повторение: счёт, показатель прямого объекта, пожалуйста'
    gloss: счёт / (показатель прямого объекта) / пожалуйста
    note: 'Это слова для повторения: с ними можно попросить счёт.'
    target_text: بل (счёт) / را (показатель прямого дополнения) / لطفاً (пожалуйста)
  prs.a1.unit51.lesson03.teach.bring_word:
    title: Принесите (вежливо)
    gloss: принесите
    note: Это та же вежливая форма повелительного наклонения, которая уже встречалась в курсе, но от нового глагола — «приносить».
    example_gloss: Принесите чай.
  prs.a1.unit51.lesson03.teach.bring_bill_please_phrase:
    title: Принесите счёт, пожалуйста
    gloss: Принесите счёт, пожалуйста.
    note: Здесь соединены слова «счёт», показатель прямого объекта, «принесите» и «пожалуйста».
