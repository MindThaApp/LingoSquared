    note: 'Это слова для повторения: с них начинается диалог.'
    target_text: سلام (здравствуйте) / یک (один, какой-то) / کباب (кебаб) / می‌خواهم (я хочу)
  prs.a1.unit51.lesson04.teach.review_welcome_price:
