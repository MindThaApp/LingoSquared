course:
  title: Дари A1
  description: 'Кабульский дари для начинающих: названия предметов одежды, цвета, размеры, примерка, чтение ярлыка и полный диалог в магазине при покупке рубашки.'
units:
  prs.a1.unit21.clothing:
    title: Покупка одежды
    description: Называть основные предметы одежды и совершать простую покупку одежды.
lessons:
  prs.a1.unit21.lesson01.clothing_vocabulary:
    title: Слова об одежде
  prs.a1.unit21.lesson02.colors:
    title: Цвета
  prs.a1.unit21.lesson03.sizes:
    title: Размеры
  prs.a1.unit21.lesson04.trying_on_and_reading_a_label:
    title: Примерка и чтение ярлыка
  prs.a1.unit21.lesson05.clothing_shop_dialogue:
    title: Диалог в магазине одежды
  prs.a1.unit21.lesson06.wrap_up_reading:
    title: Итоговое чтение
teaching:
  prs.a1.unit21.lesson01.teach.lebas:
    title: Одежда
    gloss: одежда
    note: لباس означает «одежда» (общее слово).
    example_gloss: Это новая одежда.
  prs.a1.unit21.lesson01.teach.perahan:
    title: Рубашка
    gloss: рубашка
    note: پیراهن означает «рубашка».
    example_gloss: Эта рубашка красивая.
  prs.a1.unit21.lesson01.teach.patlun:
    title: Брюки
    gloss: брюки
    note: پطلون означает «брюки» — это настоящее афганское дари слово (заимствование от «пантолоны»), в отличие от иранского شلوار.
    example_gloss: Эти брюки дорогие.
  prs.a1.unit21.lesson01.teach.kafsh:
    title: Обувь
    gloss: обувь
    note: کفش означает «обувь».
    example_gloss: Эта обувь дешёвая.
  prs.a1.unit21.lesson01.teach.review_ast:
    title: Есть / является
    gloss: есть, является
    note: است («есть, является») — уже знакомо по теме приветствий.
    example_gloss: Это рубашка.
  prs.a1.unit21.lesson01.teach.review_geran:
    title: Дорогой
    gloss: дорогой
    note: گران («дорогой») — уже знакомо по теме покупок.
    example_gloss: Эти брюки дорогие.
  prs.a1.unit21.lesson02.teach.rang:
    title: Цвет
    gloss: цвет
    note: رنگ означает «цвет».
    example_gloss: Какого цвета эта рубашка?
  prs.a1.unit21.lesson02.teach.siyah:
    title: Чёрный
    gloss: чёрный
    note: سیاه означает «чёрный».
    example_gloss: Эти брюки чёрные.
  prs.a1.unit21.lesson02.teach.safid:
    title: Белый
    gloss: белый
    note: سفید означает «белый».
    example_gloss: Эта рубашка белая.
  prs.a1.unit21.lesson02.teach.sorkh:
    title: Красный
    gloss: красный
    note: سرخ означает «красный» — форма дари и классического персидского, а не иранское разговорное قرمز.
    example_gloss: Эта обувь красная.
  prs.a1.unit21.lesson03.teach.andaza:
    title: Размер
    gloss: размер
    note: اندازه означает «размер» (существительное).
    example_gloss: Какой у вас размер?
  prs.a1.unit21.lesson03.teach.andazatan_chand:
    title: Какой у вас размер?
    gloss: Какой у вас размер?
    note: 'اندازه شما چند است؟ буквально: «ваш размер сколько?»'
  prs.a1.unit21.lesson03.teach.in_andaza_shoma:
    title: Это ваш размер?
    gloss: Это ваш размер?
    note: В фразе این اندازه شما است؟ используется این («этот, это») — оно вводится здесь.
  prs.a1.unit21.lesson03.teach.review_bozorg:
    title: Большой
    gloss: большой
    note: بزرگ («большой») — уже знакомо по теме сравнений.
    example_gloss: Эта рубашка большая.
  prs.a1.unit21.lesson03.teach.review_kochak:
    title: Маленький
    gloss: маленький
    note: کوچک («маленький») — уже знакомо по теме сравнений.
    example_gloss: Эта обувь маленькая.
  prs.a1.unit21.lesson04.teach.pero_kardan:
    title: Можно это примерить?
    gloss: Можно это примерить?
    note: 'پرو کردن означает «примерять» (французское заимствование, общее для дари и фарси). می‌توانم این را پرو کنم؟ буквально: «могу это примерку сделать?»'
  prs.a1.unit21.lesson04.teach.mitanin_pero_konin:
    title: Да, можете примерить
    gloss: Да, можете примерить.
    note: می‌توانین پرو کنین — вежливая форма 2-го лица того же глагола.
  prs.a1.unit21.lesson04.teach.label_text:
    title: Ярлык на одежде
    gloss: 'Рубашка: размер большой, цвет белый, 500 афгани'
    note: Простой ярлык с названием вещи, размером, цветом и ценой.
  prs.a1.unit21.lesson04.teach.review_ra:
    title: Показатель прямого дополнения
    gloss: (показатель прямого дополнения)
    note: را отмечает прямое дополнение — уже знакомо по фразам из предыдущих тем.
    example_gloss: Я хочу эту рубашку.
  prs.a1.unit21.lesson04.teach.review_afghani:
    title: Афгани
    gloss: афгани
    note: افغانی («афгани») — валюта, уже знакомая по теме покупок.
    example_gloss: Это стоит 500 афгани.
  prs.a1.unit21.lesson05.teach.che_rang_darad:
    title: Какого цвета эта рубашка?
    gloss: Какого цвета эта рубашка?
    note: В фразе این پیراهن چه رنگ دارد؟ используется دارد («имеет») — оно вводится здесь.
  prs.a1.unit21.lesson05.teach.turn01:
    title: Продавец здоровается
    gloss: Здравствуйте, прошу вас.
  prs.a1.unit21.lesson05.teach.turn02:
    title: Зармина спрашивает
    gloss: Здравствуйте. Какого цвета эта рубашка?
    note: زرمینه (Зармина) — постоянный персонаж курса, впервые появляется в темах о времени и распорядке дня.
  prs.a1.unit21.lesson05.teach.turn03:
    title: Продавец отвечает
    gloss: Есть чёрные и белые.
  prs.a1.unit21.lesson05.teach.turn04:
    title: Зармина выбирает
    gloss: Я хочу белую рубашку. Размер большой?
    note: اندازه‌اش («её размер») — к слову اندازه присоединяется притяжательное окончание.
  prs.a1.unit21.lesson05.teach.turn05:
    title: Продавец подтверждает
    gloss: Да, большой. Можете примерить.
  prs.a1.unit21.lesson05.teach.turn06:
    title: Зармина примеряет
    gloss: Спасибо. Это мой размер. Сколько она стоит?
  prs.a1.unit21.lesson05.teach.turn07:
    title: Продавец называет цену
    gloss: 500 афгани.
  prs.a1.unit21.lesson05.teach.turn08:
    title: Зармина соглашается
    gloss: Очень хорошо, я покупаю.
    note: می‌خرم — форма 1-го лица настоящего времени от глагола خریدن («покупать»).
  prs.a1.unit21.lesson05.teach.review_dokandar:
    title: Продавец
    gloss: владелец магазина, продавец
    note: دوکاندار («продавец») — уже знакомо по теме покупок.
    example_gloss: Продавец продаёт рубашки.
  prs.a1.unit21.lesson05.teach.review_besyar_khoob:
    title: Очень хорошо
    gloss: очень хорошо
    note: بسیار خوب («очень хорошо») — уже знакомо по теме покупок.
    example_gloss: Очень хорошо, спасибо.
  prs.a1.unit21.lesson05.teach.review_che:
    title: Что / какой
    gloss: что, какой
    note: چه («что, какой») — уже знакомо по вопросам из предыдущих тем.
    example_gloss: Какого это цвета?
  prs.a1.unit21.lesson06.teach.review_va:
    title: И
    gloss: и
    note: و («и») — уже знакомо по теме покупок.
    example_gloss: Я покупаю рубашку и брюки.
  prs.a1.unit21.lesson06.teach.review_yak:
    title: Один
    gloss: один
    note: یک (один) — уже знакомо из раздела о числах.
    example_gloss: Я покупаю одну рубашку.
  prs.a1.unit21.lesson06.teach.review_ba:
    title: К, в
    gloss: к, в
    note: به (к, в) — уже знакомо из разделов о направлениях и распорядке дня.
    example_gloss: Я иду в магазин.
  prs.a1.unit21.lesson06.teach.review_dokan:
    title: Магазин
    gloss: магазин
    note: دوکان (магазин) — уже знакомо из раздела о покупках.
    example_gloss: Этот магазин большой.
  prs.a1.unit21.lesson06.teach.review_raft:
    title: Пошёл, пошла
    gloss: пошёл, ходил
    note: رفت (пошёл, пошла; 3-е лицо) — уже знакомо из раздела о прошедших событиях.
    example_gloss: Зармина пошла в магазин.
  prs.a1.unit21.lesson06.teach.review_qeymatesh:
    title: Его цена
    gloss: его цена
    note: قیمتش (его цена) — уже знакомо из раздела о покупках.
    example_gloss: Он стоил 500 афгани.
  prs.a1.unit21.lesson06.teach.summary_text:
    title: Рассказ о покупке
    gloss: Зармина пошла в магазин. Она купила белую большую рубашку. Стоила она 500 афгани.
    note: خرید (купила) и بود (была, стоила) — обе формы простого прошедшего времени, уже знакомые из раздела о прошедших событиях.
