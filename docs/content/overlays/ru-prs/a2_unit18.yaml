course:
  title: Дари A2
  description: 'Дари Афганистана, уровень выше начального: жалоба в магазине — неисправный электрообогреватель, объяснение проблемы, чтение правил возврата в магазине и разговор у стойки возврата.'
units:
  prs.a2.unit18.shopping_complaint:
    title: Жалоба в магазине
lessons:
  prs.a2.unit18.lesson01.complaint_vocabulary:
    title: Слова для жалобы в магазине
  prs.a2.unit18.lesson02.explaining_the_problem:
    title: Объясняем проблему
  prs.a2.unit18.lesson03.reading_a_return_policy:
    title: Читаем правила возврата
  prs.a2.unit18.lesson04.return_counter_dialogue:
    title: У стойки возврата
teaching:
  prs.a2.unit18.lesson01.teach.broken_word:
    title: Сломанный
    gloss: сломанный
    note: '*خراب* говорят о любой неисправной или нерабочей вещи.'
    example_gloss: Этот обогреватель сломан.
  prs.a2.unit18.lesson01.teach.exchange_word:
    title: Обмен
    gloss: обменивать
    note: '*تعویض کردن* — *تعویض* значит «обмен», а *کردن* — «делать».'
    example_gloss: Я хочу обменять обогреватель.
  prs.a2.unit18.lesson01.teach.refund_word:
    title: Возврат денег
    gloss: возврат денег
    note: '*بازپرداخت* — официальное слово для возврата денег.'
    example_gloss: Я хочу вернуть деньги.
  prs.a2.unit18.lesson01.teach.receipt_word:
    title: Квитанция
    gloss: квитанция
    note: '*رسید* — то же слово, что в прежних уроках означало квитанцию об оплате аренды; здесь это чек о покупке.'
    example_gloss: Чек о покупке у меня с собой.
  prs.a2.unit18.lesson01.teach.warranty_word:
    title: Гарантия
    gloss: гарантия
    note: '*گارانتی* — заимствованное слово, как и в русском («гарантия»), и значение у него то же.'
    example_gloss: На этот обогреватель дана гарантия один год.
  prs.a2.unit18.lesson01.teach.defect_word:
    title: Дефект
    gloss: дефект
    note: '*عیب* означает неисправность или дефект вещи.'
    example_gloss: У этого обогревателя есть дефект.
  prs.a2.unit18.lesson01.teach.when_grammar:
    title: «Когда» — وقتی
    gloss: Когда я его включаю, он не нагревается.
    note: '*وقتی* вводит придаточное времени. Оно похоже на условное *اگر* («если») из урока 11, но говорит о факте, а не о предположении.'
  prs.a2.unit18.lesson01.teach.heater_word:
    title: Электрообогреватель
    gloss: электрообогреватель
    note: '*بخاری برقی* — *بخاری* значит «обогреватель», а *برقی* — «электрический».'
    example_gloss: Я купил электрообогреватель для своего нового дома.
  prs.a2.unit18.lesson01.teach.va_word:
    title: И
    gloss: и
    note: '*و* — обычное соединительное слово («и»), которым в этом уроке связываются части предложения.'
    target_text: و (и)
  prs.a2.unit18.lesson02.teach.state_item_broken:
    title: Сказать, что купленная вещь сломана
    gloss: Этот обогреватель, который я купил вчера, сломан.
    note: '*که دیروز خریدم* — «который я купил вчера» — придаточное, указывающее, о какой именно вещи речь.'
  prs.a2.unit18.lesson02.teach.request_exchange_or_refund:
    title: Попросить обмен или возврат денег
    gloss: Я хочу обменять его или вернуть деньги.
    note: '*یا* значит «или»: продавцу предлагается выбор.'
  prs.a2.unit18.lesson02.teach.prefer_question:
    title: Спросить, что предпочитает покупатель
    gloss: Что вы предпочитаете?
    note: '*ترجیح دادن* значит «предпочитать» — грамматическая тема уровня A2 для выбора из двух предложенных вариантов.'
  prs.a2.unit18.lesson03.teach.deadline_word:
    title: Срок
    gloss: срок
    note: '*مهلت* — срок, к которому нужно что-то сделать.'
    example_gloss: Срок обмена — семь дней.
  prs.a2.unit18.lesson03.teach.original_word:
    title: Оригинал
    gloss: оригинальный
    note: '*اصلی* значит «оригинальный», например оригинал чека, а не копия.'
    example_gloss: Принесите, пожалуйста, оригинал чека.
  prs.a2.unit18.lesson03.teach.policy_text:
    title: Объявление магазина о возврате
    gloss: Если купленный товар оказался бракованным, ты можешь обменять его или вернуть деньги в течение семи дней при наличии оригинала чека.
    note: Короткое официальное объявление в магазине, написанное в формальном письменном стиле, которому учит этот раздел.
  prs.a2.unit18.lesson04.teach.turn01:
    title: Продавец приветствует کریم
    gloss: Продавец спрашивает, чем может ему помочь.
    note: Вежливое приветствие, как у служащего в офисе в Разделе 9 (*بفرمایین، چه خدمتی...*), но здесь вместо *خدمتی* («услуга») стоит *کمکی* («помощь»).
  prs.a2.unit18.lesson04.teach.turn02:
    title: کریم рассказывает о проблеме
    gloss: کریم говорит, что обогреватель, который он купил вчера, сломан.
    note: Это точно такое же предложение, как в уроке 2.
  prs.a2.unit18.lesson04.teach.turn03:
    title: Продавец спрашивает, в чём проблема
    gloss: Продавец спрашивает, что за проблема.
    note: '*چه مشکلی دارد؟* буквально значит «какая проблема у него?»'
  prs.a2.unit18.lesson04.teach.turn04:
    title: کریم объясняет неисправность
    gloss: Когда он его включает, он не нагревается.
    note: '*روشنش می‌کنم* («я его включаю») — к слову *روشن* присоединён суффикс прямого дополнения *-ش*.'
  prs.a2.unit18.lesson04.teach.turn05:
    title: Продавец просит показать чек
    gloss: Продавец спрашивает, есть ли у него с собой чек.
    note: '*همراه‌تان* («при вас») — вежливый притяжательный суффикс *-تان*.'
  prs.a2.unit18.lesson04.teach.turn06:
    title: کریم подтверждает, что чек у него есть
    gloss: Да, вот его чек.
    note: '*اینه* — разговорное «вот он», его говорят, когда что-то протягивают. Оно уже встречалось в Разделе 11.'
  prs.a2.unit18.lesson04.teach.turn07:
    title: Продавец предлагает выбор
    gloss: Продавец может обменять товар или вернуть деньги. Что он предпочитает?
    note: Здесь снова вопрос *ترجیح می‌دهین؟* из урока 2.
  prs.a2.unit18.lesson04.teach.turn08:
    title: کریم выбирает обмен
    gloss: کریم говорит, что лучше обмен, и благодарит.
    note: '*بهتر است* значит «лучше».'
