course:
  title: Дари A2
  description: 'Дари (Афганистан) для продолжающих: как передать простое сообщение в настоящем времени с помощью می‌گوید که, می‌پرسد که и می‌خواهد که + conjunctive; телефонные сообщения и записки.'
units:
  prs.a2.unit39.passing_message:
    title: Передаём сообщение
lessons:
  prs.a2.unit39.lesson01.he_says_that:
    title: Он говорит, что ...
  prs.a2.unit39.lesson02.he_asks_that:
    title: Он спрашивает, ...
  prs.a2.unit39.lesson03.he_wants_that:
    title: Он хочет, чтобы ...
  prs.a2.unit39.lesson04.messages_and_notes:
    title: Сообщения и записки
  prs.a2.unit39.lesson05.reading_and_listening:
    title: Читаем и слушаем сообщения
  prs.a2.unit39.lesson06.office_conversation:
    title: Разговор в офисе
teaching:
  prs.a2.unit39.lesson01.teach.message:
    title: Сообщение
    gloss: сообщение
    note: '*پیام* — это сообщение, например телефонное или SMS. В этом модуле ты передаёшь сообщение: рассказываешь второму человеку, что первый сказал, спросил или попросил.'
    example_gloss: У меня для вас сообщение.
  prs.a2.unit39.lesson01.teach.says:
    title: Он или она говорит
    gloss: он говорит, она говорит
    note: '*می‌گوید* — «он или она говорит», настоящее время от *گفتن*. Ты уже знаешь *می‌گویم* («я говорю»). Окончание *-د* — окончание 3-го лица единственного числа, как в *می‌آید*.'
    example_gloss: Он или она говорит, что придёт завтра.
  prs.a2.unit39.lesson01.teach.pattern:
    title: 'Передаём чужие слова: می‌گوید که + утверждение'
    gloss: Начальник говорит, что собрание в десять. Он говорит, что придёт завтра.
    note: 'Чтобы передать то, что человек говорит сейчас, используй *می‌گوید که* и затем утверждение. *که* значит «что». Утверждение остаётся в настоящем времени: *جلسه ساعت ده است*. В этом модуле сообщения передаются только в настоящем времени. Прошедшее время будет позже.'
  prs.a2.unit39.lesson01.teach.person:
    title: «Я» превращается в «он» или «она», когда ты передаёшь слова
    gloss: 'Мина: Я приду завтра. Мина говорит, что придёт завтра.'
    note: 'Когда Мина говорит *من فردا می‌آیم* («я приду завтра»), а ты передаёшь это, лицо меняется: для тебя Мина — *او* («она»), поэтому окончание глагола меняется с *-م* на *-د*: *مینا می‌گوید که فردا می‌آید*. Слово *او* можно опустить, потому что окончание уже показывает, о ком речь.'
  prs.a2.unit39.lesson01.teach.they_say:
    title: Они говорят
    gloss: они говорят
    note: '*می‌گویند* — «они говорят». Добавь *-ند* к основе: *می‌گویند* — форма *آن‌ها* от *می‌گوید*.'
    example_gloss: Они говорят, что собрание в десять.
  prs.a2.unit39.lesson01.teach.hashmat:
    title: Хашмат говорит, что Мина придёт завтра
    gloss: Хашмат говорит, что Мина придёт завтра.
    note: Здесь тот, кто говорит (*حشمت*), и тот, кто приходит (*مینا*), — разные люди, и в предложении названы оба. Читая сообщение, всегда проверяй, кто говорит и кто приходит.
  prs.a2.unit39.lesson02.teach.asks:
    title: Он или она спрашивает
    gloss: он спрашивает, она спрашивает
    note: '*می‌پرسد* — «он или она спрашивает», настоящее время от *پرسیدن*. Окончание *-د* такое же, как у *می‌گوید*.'
    example_gloss: Он или она спрашивает, где директор.
  prs.a2.unit39.lesson02.teach.wh:
    title: 'Передача вопроса: می‌پرسد که + вопрос'
    gloss: Хашмат спрашивает, где ты. Мина спрашивает, который час.
    note: Чтобы передать вопрос, используй *می‌پرسد که*, а затем сам вопрос с вопросительным словом (*کجا*, *ساعت چند*, *چه*, *کی*, *چرا*). Порядок слов в вопросе не меняется. *استی* — «ты находишься» (другу), форма *تو* от *است*. Когда ты говоришь тому, у кого спросили, *تو* остаётся *تو*.
  prs.a2.unit39.lesson02.teach.yesno:
    title: Передача вопроса без вопросительного слова (да или нет)
    gloss: Он или она спрашивает, придёшь ли ты завтра.
    note: 'В этом уроке мы оставляем вопрос таким, как он звучит в речи, без дополнительного слова (можно добавить *آیا* или *یا نه*, как в уроке 38). Вопрос, на который отвечают «да» или «нет», передаётся с *می‌پرسد که*: *او می‌پرسد که تو فردا می‌آیی*. Ответ — *بلی* или *نخیر*. *می‌آیی* — «ты приходишь» (другу), форма *تو* от *می‌آید*.'
  prs.a2.unit39.lesson02.teach.id:
    title: Начальник спрашивает, есть ли у тебя удостоверение личности
    gloss: Директор спрашивает, есть ли у тебя удостоверение личности.
    note: Ещё один вопрос с ответом «да» или «нет». *تذکره* — афганское удостоверение личности, а *داری* — «у тебя есть».
  prs.a2.unit39.lesson02.teach.person:
    title: Меняется местоимение в зависимости от того, кого спрашивают
    gloss: Мина спрашивает, где ты. Мина спрашивает, где Хашмат.
    note: 'Мина спрашивает Хашмата: *تو کجا استی؟* («Где ты?»). Если ты говоришь это Хашмату, ты скажешь *مینا می‌پرسد که تو کجا استی*, и *تو* остаётся. Если ты говоришь это кому-то другому, Хашмат становится третьим лицом: *مینا می‌پرسد که حشمت کجا است*.'
  prs.a2.unit39.lesson03.teach.pattern:
    title: 'Передача желания: می‌خواهد که + сослагательное наклонение'
    gloss: Он или она хочет, чтобы ты пришёл. Он или она хочет, чтобы я пошёл.
    note: 'Чтобы передать, что кто-то хочет, чтобы другой человек что-то сделал, используй *می‌خواهد که* и затем сослагательное наклонение (конъюнктив): *او می‌خواهد که تو بیایی* («он или она хочет, чтобы ты пришёл»). Это та же форма, что после *باید* и в *بروم* («чтобы я пошёл»). Это не настоящее время с *می‌*: в *بیایی* нет *می‌*.'
  prs.a2.unit39.lesson03.teach.go:
    title: Сослагательное наклонение глагола رفتن
    gloss: чтобы я пошёл, чтобы ты пошёл, чтобы он или она пошёл(а), чтобы мы пошли, чтобы вы пошли (вежливая форма или множественное число), чтобы они пошли
    note: 'Сослагательное наклонение — это *ب* + основа настоящего времени + окончание: *ب + رو + م* даёт *بروم*. Окончания: *-م، -ی، -د، -یم، -ین، -ند*. Получается: *بروم، بروی، برود، برویم، بروین، بروند*. Форму *بروم* ты уже знаешь; эта карточка добавляет остальные формы.'
  prs.a2.unit39.lesson03.teach.come:
    title: Сослагательное наклонение глагола آمدن
    gloss: чтобы я пришёл, чтобы ты пришёл, чтобы он или она пришёл(а), чтобы мы пришли, чтобы вы пришли (вежливая форма или множественное число), чтобы они пришли
    note: '*آمدن* — неправильный глагол: основа сослагательного наклонения — *بیای-*. Окончания те же: *بیایم، بیایی، بیاید، بیاییم، بیایین، بیایند*. Формы *بیایم* и *بیایین* ты уже знаешь.'
  prs.a2.unit39.lesson03.teach.do:
    title: Сослагательное наклонение глаголов کردن и آوردن
    gloss: чтобы я сделал, чтобы ты сделал, чтобы он или она сделал(а), чтобы мы сделали, чтобы вы сделали, чтобы они сделали. Чтобы я принёс, чтобы ты принёс, чтобы он или она принёс(ла).
    note: 'У *کردن* нет *ب*: *کنم، کنی، کند، کنیم، کنین، کنند*. Поэтому из *تیلفون کردن* получается *تیلفون کنی* («чтобы ты позвонил»). *آوردن* ведёт себя как *آمدن*, с основой *بیاور-*: *بیاورم، بیاوری، بیاورد*.'
  prs.a2.unit39.lesson03.teach.tell:
    title: Сослагательное наклонение глагола گفتن
    gloss: чтобы я сказал, чтобы ты сказал, чтобы он или она сказал(а)
    note: 'У *گفتن* в сослагательном наклонении основа *گوی-*: *بگویم، بگویی، بگوید*. Схема та же: *ب* + основа + окончание, как в *بروم*.'
  prs.a2.unit39.lesson03.teach.phone:
    title: Директор хочет, чтобы ты позвонил
    gloss: Директор хочет, чтобы ты позвонил.
    note: Тот, кто хочет, — *مدیر*, тот, кто должен действовать, — *تو*, а глагол после *که* — *کنی*.
  prs.a2.unit39.lesson03.teach.computer:
    title: Он или она хочет, чтобы ты принёс компьютер
    gloss: Он или она хочет, чтобы ты принёс компьютер.
    note: '*را* ставится после того, что приносят, как в любом предложении с прямым дополнением.'
  prs.a2.unit39.lesson03.teach.same:
    title: То же сослагательное наклонение, когда тот, кто хочет, и сам идёт
    gloss: Я хочу пойти. Он или она хочет пойти.
    note: 'Если тот, кто хочет, и тот, кто действует, — один и тот же человек, сослагательное наклонение тоже используется: *من می‌خواهم که بروم*. Берётся подходящее окончание: *-م* для «я», *-د* для «он или она». В этом уроке в основном передаётся желание в адрес другого человека, как в *او می‌خواهد که تو بیایی*.'
  prs.a2.unit39.lesson04.teach.note:
    title: Записка
    gloss: записка
    note: '*یادداشت* — короткая письменная записка, например оставленная на столе или на двери. Это ещё и способ передать сообщение, когда человека нет на месте.'
    example_gloss: Записка лежит в офисе.
  prs.a2.unit39.lesson04.teach.writes:
    title: Он или она пишет
    gloss: он пишет, она пишет
    note: '*می‌نویسد* — «он или она пишет», настоящее время от *نوشتن*. *می‌نویسم* — «я пишу».'
    example_gloss: Хашмат пишет записку.
  prs.a2.unit39.lesson04.teach.sends:
    title: Он или она отправляет
    gloss: он отправляет, она отправляет
    note: '*می‌فرستد* — «он или она отправляет». Ты уже знаешь *می‌فرستم* («я отправляю»).'
    example_gloss: Директор отправляет сообщение.
  prs.a2.unit39.lesson04.teach.written:
    title: 'Письменное сообщение: می‌نویسد که'
    gloss: В записке он или она пишет, что собрание в девять.
    note: 'Письменное сообщение передаётся так же, как устное: *می‌نویسد که* и затем утверждение. *در یادداشت* означает «в записке». Порядок слов такой же, как с *می‌گوید که*.'
  prs.a2.unit39.lesson04.teach.tell_him:
    title: 'Кому говорят: به'
    gloss: Я говорю ему или ей, что собрание в девять. Директор говорит Мине, что собрание завтра.
    note: 'Чтобы сказать, кому говорят, поставь *به* и слушающего перед глаголом: *به او می‌گویم* («я говорю ему или ей»), *به مینا می‌گوید* («он говорит Мине»). Остальная схема не меняется: *که* и затем сообщение.'
  prs.a2.unit39.lesson04.teach.phone_says:
    title: Он или она звонит и говорит, что придёт завтра
    gloss: Он или она звонит и говорит, что придёт завтра.
    note: 'В телефонном сообщении часто два глагола подряд: *تیلفون می‌کند* («звонит») и *می‌گوید که ...* («говорит, что ...»), соединённые *و*.'
  prs.a2.unit39.lesson04.teach.i_write:
    title: Я пишу записку
    gloss: Я пишу записку.
    note: Записку пишут, когда нельзя передать сообщение лично.
  prs.a2.unit39.lesson05.teach.not_come:
    title: Он или она не приходит
    gloss: он не приходит, она не приходит
    note: '*نمی‌آید* — «он или она не приходит»: *ن* перед *می‌آید*. Ты уже знаешь *نمی‌روم* («я не иду»).'
    example_gloss: Он или она завтра не придёт.
  prs.a2.unit39.lesson05.teach.call_turn01:
    title: Реплика 1
    gloss: Хашмат, кто звонил?
    note: Мина приходит домой и спрашивает, кто звонил.
  prs.a2.unit39.lesson05.teach.call_turn02:
    title: Реплика 2
    gloss: Звонил директор. Он говорит, что собрание завтра в девять.
    note: Хашмат отвечает и передаёт первую часть сообщения с *می‌گوید که*.
  prs.a2.unit39.lesson05.teach.call_turn03:
    title: Реплика 3
    gloss: В девять? Что ещё он говорит?
    note: Мина просит рассказать ещё. *چه می‌گوید* — «что он говорит».
  prs.a2.unit39.lesson05.teach.call_turn04:
    title: Реплика 4
    gloss: Он спрашивает, придёшь ли ты завтра. И хочет, чтобы ты принесла компьютер.
    note: 'Ещё две части сообщения: вопрос с *می‌پرسد که* и желание с *می‌خواهد که* и сослагательным наклонением *بیاوری*.'
  prs.a2.unit39.lesson05.teach.call_turn05:
    title: Реплика 5
    gloss: Да, завтра я приду и принесу компьютер.
    note: Мина отвечает на вопрос и на просьбу от первого лица.
  prs.a2.unit39.lesson05.teach.call_turn06:
    title: Реплика 6
    gloss: Хорошо. Тогда я ему позвоню.
    note: Хашмат передаст ответ Мины по телефону. *به او تیلفون می‌کنم* — «я звоню ему».
  prs.a2.unit39.lesson05.teach.note_read:
    title: Записка от Хашмата
    gloss: Привет, Мина. Сегодня в четыре часа звонил твой друг. Он говорит, что завтра не придёт, потому что у него работа. Он спрашивает, есть ли у тебя время в пятницу. Он хочет, чтобы ты ему позвонила. Его номер в этой записке. Хашмат
    note: 'Письменное сообщение, передающее телефонный звонок, с тремя глаголами этого урока: *می‌گوید که*, *می‌پرسد که* и *می‌خواهد که*. Звонок друга — это другой звонок, не тот, что был от директора в разговоре.'
  prs.a2.unit39.lesson06.teach.office_turn01:
    title: Реплика 1
    gloss: Рахила, у меня для тебя сообщение.
    note: 'Бехзад начинает разговор: ему нужно кое-что передать.'
  prs.a2.unit39.lesson06.teach.office_turn02:
    title: Реплика 2
    gloss: От кого оно?
    note: Рахила спрашивает, от кого сообщение.
  prs.a2.unit39.lesson06.teach.office_turn03:
    title: Реплика 3
    gloss: Из кабинета врача. Звонил сотрудник. Он говорит, что твой приём в четверг в два часа.
    note: Бехзад передаёт первую часть с *می‌گوید که*.
  prs.a2.unit39.lesson06.teach.office_turn04:
    title: Реплика 4
    gloss: В четверг в два? Что ещё он говорит?
    note: Рахила просит рассказать остальное.
  prs.a2.unit39.lesson06.teach.office_turn05:
    title: Реплика 5
    gloss: Он спрашивает, есть ли у тебя удостоверение личности. И хочет, чтобы ты пришла в час.
    note: Вопрос с *می‌پرسد که* и желание с *می‌خواهد که* и сослагательным наклонением *بیایی*.
  prs.a2.unit39.lesson06.teach.office_turn06:
    title: Реплика 6
    gloss: Да, есть. Я напишу записку. Большое спасибо.
    note: Рахила отвечает на вопрос, говорит, что напишет записку, чтобы не забыть, и благодарит Бехзада.
  prs.a2.unit39.lesson06.teach.summary:
    title: Три глагола — три вида сообщений
    gloss: Он или она говорит, что приём в четверг. Он или она спрашивает, есть ли у тебя удостоверение личности. Он или она хочет, чтобы ты пришёл в час.
    note: В сообщении обычно есть утверждение, вопрос или желание. После *می‌گوید که* идёт утверждение, после *می‌پرسد که* — вопрос, а после *می‌خواهد که* — сослагательное наклонение. Окончание глагола показывает, кто говорит, а в самом сообщении сохраняется настоящее время.
exercises:
  prs.a2.unit39.lesson01.exercise01.recognize_manager_says:
    instruction: Что означает это предложение?
    correct_option: Начальник говорит, что собрание в девять
    distractors:
    - Директор спрашивает, в девять ли собрание
    - Директор сказал, что собрание было в девять
    - Собрание в кабинете директора
    accepted_answers:
    - value: Начальник говорит, что собрание в девять
      status: correct
    feedback: '*مدیر می‌گوید که جلسه ساعت نه است* — «директор говорит, что собрание в девять».'
  prs.a2.unit39.lesson01.exercise02.recognize_they_say:
    instruction: Что означает это предложение?
    correct_option: Они говорят, что собрание в десять
    distractors:
    - Они спрашивают, во сколько собрание
    - Они говорят, что собрание в девять
    - Они говорят, что собрание было в десять
    accepted_answers:
    - value: Они говорят, что собрание в десять
      status: correct
    feedback: '*می‌گویند* — «они говорят», а *ساعت ده* — «десять часов».'
  prs.a2.unit39.lesson01.exercise03.recognize_who_says:
