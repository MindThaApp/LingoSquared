course:
  title: Дари A1
  description: 'Начальный курс афганского дари: чтение персидско-арабской письменности, понимание повседневной афганской речи, развёрнутые приветствия и уважительное первое знакомство в кабульском офисе.'
units:
  prs.a1.unit01.greetings:
    title: Приветствия и первые встречи
lessons:
  prs.a1.unit01.lesson01.script_ramp:
    title: Читай буквы этого раздела
  prs.a1.unit01.lesson02.everyday_greetings:
    title: Обменивайся повседневными приветствиями
  prs.a1.unit01.lesson03.time_and_farewells:
    title: Здоровайся и прощайся в разное время суток
  prs.a1.unit01.lesson04.formal_informal_small_talk:
    title: Веди вежливую и неформальную беседу
  prs.a1.unit01.lesson05.afghan_hospitality:
    title: Спрашивай о семье и проявляй уважение к гостям
  prs.a1.unit01.lesson06.first_meeting_dialogue:
    title: Начни первый рабочий день в Кабуле
teaching:
  prs.a1.unit01.lesson01.teach.alef_be_te_dal:
    title: Буквы ا، ب، ت и د
    gloss: а/ā, б, т и д
    note: Дари пишется справа налево. Буква د не соединяется со следующей буквой слева.
  prs.a1.unit01.lesson01.teach.re_ze:
    title: Буквы ر и ز
    gloss: р и з
    note: Ни одна из этих букв не соединяется со следующей буквой.
  prs.a1.unit01.lesson01.teach.sin_shin_sad:
    title: Буквы س، ش и ص
    gloss: с, ш и с
    note: В обычном дари س и ص передают звук «с», а ش — звук «ш».
  prs.a1.unit01.lesson01.teach.jim_che_he_khe:
    title: Буквы ج، چ، ح и خ
    gloss: дж, ч, h и х
    note: چ — это «ч». خ — звук, который в латинице обычно передают как kh (русское «х»).
  prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf:
    title: Буквы ع، غ، ف и ق
    gloss: ʿ, гх, ф и q
    note: Точное произношение غ и ق у носителей дари различается; в написании их нужно различать.
  prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim:
    title: Буквы ک، گ، ل и م
    gloss: к, г, л и м
    note: ک — персидская буква «каф»; в дари для звука «к» используется именно эта форма. Буквы ل и م соединяются с соседними буквами с обеих сторон.
  prs.a1.unit01.lesson01.teach.nun_vav_he_ye:
    title: Буквы ن، و، ه и ی
    gloss: н, в/у/о, h и й/долгое и
    note: 'ی — персидская «йе»: она передаёт «й» и долгий гласный «и». و может быть согласным (в/w) или долгим гласным (о/у).'
  prs.a1.unit01.lesson01.teach.connected_salam:
    title: Прочитай слово целиком
    gloss: привет
    note: Буквы соединяются и образуют слово سلام. Краткие гласные обычно не пишутся.
    example_gloss: Привет! Я Карим.
  prs.a1.unit01.lesson02.teach.salam_alaikum:
    title: Уважительное повседневное приветствие
    gloss: Мир вам / здравствуйте
    note: سلام علیکم широко распространено в Афганистане и подходит и для знакомых, и для уважительного общения.
  prs.a1.unit01.lesson02.teach.wa_alaikum_salam:
    title: Ответ на приветствие
    gloss: И вам мир
    note: وعلیکم سلام — традиционный ответ на سلام علیکم. Формы со словом السلام тоже принимаются.
  prs.a1.unit01.lesson02.teach.salam:
    title: Краткое приветствие
    gloss: привет
    note: سلام — гибкое, более короткое приветствие.
    example_gloss: Привет, как дела?
  prs.a1.unit01.lesson02.teach.khosh_amadeed:
    title: Добро пожаловать
    gloss: добро пожаловать
    note: خوش آمدین — уважительное разговорное приветствие гостя; говорится и одному человеку, и нескольким.
  prs.a1.unit01.lesson02.teach.tashakor:
    title: Спасибо
    gloss: спасибо
    note: В этом курсе предпочтительна афганская форма дари تشکر. Варианты ممنون и ممنونم тоже понятны, но встречаются реже.
    example_gloss: Большое спасибо.
  prs.a1.unit01.lesson02.teach.khahesh:
    title: Вежливый ответ на благодарность
    gloss: не за что
    note: خواهش می‌کنم — вежливый ответ, общий для всех регионов персидского языка. Он не подаётся как особенность афганской разговорной речи.
  prs.a1.unit01.lesson02.teach.khoda_hafez:
    title: Прощание
    gloss: до свидания; прощай
    note: خدا حافظ — привычное афганское прощание на дари; часто пишется в два слова.
  prs.a1.unit01.lesson03.teach.sobh_bekheyr:
    title: Утреннее приветствие
    gloss: доброе утро
    note: صبح بخیر говорят утром.
  prs.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Приветствие днём
    gloss: добрый день
    note: روز بخیر — вежливое приветствие в дневное время.
  prs.a1.unit01.lesson03.teach.asr_bekheyr:
    title: Приветствие в конце дня
    gloss: добрый день / добрый вечер
    note: عصر بخیر подходит для второй половины дня.
  prs.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Выражение для ночи
    gloss: спокойной ночи
    note: شب بخیر обычно говорят при завершении вечера, а не при начале обычной дневной встречи.
  prs.a1.unit01.lesson03.teach.rooz_khosh:
    title: Вежливое прощание днём
    gloss: хорошего дня
    note: روز خوش — вежливое, несколько официальное прощание, общее для разных регионов, а не особая афганская разговорная формула.
  prs.a1.unit01.lesson03.teach.be_omide_didar:
    title: До следующей встречи
    gloss: надеюсь на новую встречу
    note: به امید دیدار — тёплое, но уважительное прощание.
  prs.a1.unit01.lesson04.teach.polite_question:
    title: Вежливо спроси, как дела
    gloss: Как вы поживаете?
    note: استین — распространённая вежливая разговорная форма афганского дари, которая используется со словом شما.
  prs.a1.unit01.lesson04.teach.informal_question:
    title: Спроси ровесника или близкого друга
    gloss: Как вы поживаете?
    note: تو и استی — неформальные формы единственного числа; не используй это сочетание автоматически со старшим по возрасту или с новым знакомым.
  prs.a1.unit01.lesson04.teach.good_answer:
    title: Скажи, что у тебя всё хорошо
    gloss: У меня всё хорошо, спасибо.
    note: استم значит «я есть». Это афганская разговорная форма дари, которая используется во всём курсе.
  prs.a1.unit01.lesson04.teach.jor_answer:
    title: Скажи, что ты здоров или у тебя всё в порядке
    gloss: У меня всё в порядке.
    note: جور передаёт значение «в добром здравии, в порядке» и часто встречается в афганских приветствиях.
  prs.a1.unit01.lesson04.teach.not_bad:
    title: Сдержанный ответ
    gloss: Неплохо.
    note: بد نیستم — нейтральный ответ.
  prs.a1.unit01.lesson04.teach.and_you:
    title: Верни вопрос собеседнику
    gloss: А вы?
    note: و شما؟ сохраняет уважительный тон и краткость беседы.
  prs.a1.unit01.lesson04.teach.everyone_well:
    title: Продли приветствие
    gloss: Все ли здоровы?
    note: Афганское приветствие может продолжаться расспросами о домашних ещё до начала дел.
  prs.a1.unit01.lesson05.teach.family_well:
    title: Спроси о чьей-то семье
    gloss: Как ваша семья?
    note: Расспросы о семье — обычная часть развёрнутого афганского приветствия. В курсе притяжательная форма пишется как فامیل‌تان.
  prs.a1.unit01.lesson05.teach.household_well:
    title: Спроси о домашних
    gloss: Все ли дома здоровы?
    note: اهل خانه — собирательное название членов семьи, живущих в доме.
  prs.a1.unit01.lesson05.teach.everyone_well:
    title: Ответь на расспросы о семье
    gloss: Слава Богу, все здоровы.
    note: شکر здесь — сокращённое выражение благодарности, а не слово «сахар» в прямом, пищевом значении.
  prs.a1.unit01.lesson05.teach.zenda_bashin:
    title: Ответь тёплой вежливой фразой
    gloss: Живите долго / спасибо.
    note: زنده باشین — распространённая афганская формула вежливости, которую часто говорят в ответ на благодарность или добрые слова. باشین — уважительная разговорная форма для «вы».
  prs.a1.unit01.lesson05.teach.own_home:
    title: Тепло встреть гостя
    gloss: Это ваш собственный дом.
    note: 'خانهٔ خودتان است успокаивает гостя: ему здесь рады.'
  prs.a1.unit01.lesson05.teach.seat_of_honor:
    title: Предложи почётное место
    gloss: Пожалуйста, проходите на почётное место.
    note: В гостевой комнате بالا بفرمایین приглашает гостя на более почётное место, дальше от входа. Это не обязательно значит «наверх».
  prs.a1.unit01.lesson05.teach.elders_first:
    title: Сначала приветствуй старших
    gloss: Мы сначала здороваемся со старшими.
    note: Если сначала поприветствовать старших, это выражает уважение. Физический контакт при встрече зависит от отношений, пола и поведения собеседника; не стоит считать, что рукопожатие уместно.
  prs.a1.unit01.lesson06.teach.daftar:
    title: Офис
    gloss: офис
    note: دفتر — это офис или место работы.
    example_gloss: Мой офис находится в Кабуле.
  prs.a1.unit01.lesson06.teach.kabul:
    title: Кабул
    gloss: Кабул
    note: کابل — столица Афганистана и место действия этого диалога.
    example_gloss: Я живу в Кабуле.
  prs.a1.unit01.lesson06.teach.line01:
    title: Хамед представляется как новый коллега
    gloss: Хамед говорит, что он новый коллега.
    note: Оба собеседника — взрослые коллеги-мужчины, они знакомятся в офисе в Кабуле.
  prs.a1.unit01.lesson06.teach.line02:
    title: Наджиб приветствует его и спрашивает, как его зовут
    gloss: Наджиб приветствует его и спрашивает, как его зовут.
    note: خوش آمدین — вежливое разговорное приветствие гостю; подходит и для одного человека, и для нескольких.
  prs.a1.unit01.lesson06.teach.line03:
    title: Хамед называет своё имя
    gloss: Хамед называет своё имя.
    note: نامم حامد است («меня зовут Хамед») — обычная разговорная форма; نامم — это نام + -م («мой»). В письменной речи также встречается نام من حامد است. Оба варианта правильны.
  prs.a1.unit01.lesson06.teach.line04:
    title: Наджиб представляется и говорит, что рад знакомству
    gloss: Наджиб представляется и говорит, что рад знакомству.
    note: از آشنایی با شما خوش شدم прямо говорит о знакомстве, поэтому подходит для первой встречи.
  prs.a1.unit01.lesson06.teach.line05:
    title: Хамед отвечает тем же и спрашивает, как дела у Наджиба
    gloss: Хамед отвечает тем же и спрашивает, как дела у Наджиба.
    note: Новые коллеги сохраняют вежливые формы شما и استین.
  prs.a1.unit01.lesson06.teach.line06:
    title: Наджиб отвечает
    gloss: Наджиб говорит, что у него всё хорошо, и благодарит.
    note: جور استم، تشکر — ответ на вопрос о самочувствии, как в предыдущих уроках этого раздела.
  prs.a1.unit01.lesson06.teach.line07:
    title: Наджиб спрашивает о семье Хамеда
    gloss: Наджиб спрашивает о семье Хамеда.
    note: Вопрос о домашних продолжает приветствие, прежде чем собеседники перейдут к работе.
  prs.a1.unit01.lesson06.teach.line08:
    title: Хамед говорит, что у всех всё хорошо
    gloss: Хамед говорит, что у всех всё хорошо.
    note: شکر، همه جور استند — ответ на вопрос о семье, как в предыдущих уроках этого раздела.
  prs.a1.unit01.lesson06.teach.line09:
    title: Наджиб предлагает познакомить его с остальными коллегами
    gloss: Наджиб предлагает познакомить его с остальными коллегами.
    note: بفرمایین здесь приглашает Хамеда пойти следом, а не сесть или взять что-либо.
  prs.a1.unit01.lesson06.teach.line10:
    title: Хамед соглашается и благодарит
    gloss: Хамед соглашается и благодарит.
    note: بسیار خوب вводится здесь как чёткий утвердительный ответ.
  prs.a1.unit01.lesson06.teach.line11:
    title: Наджиб тепло отвечает и показывает стол Хамеда
    gloss: Наджиб тепло отвечает и показывает стол Хамеда.
    note: Диалог заканчивается началом рабочего дня, а не прощанием, как после визита в гости.
  prs.a1.unit01.lesson06.teach.line12:
    title: Хамед благодарит его
    gloss: Хамед благодарит его.
    note: تشکر просто завершает разговор.
exercises:
  prs.a1.unit01.lesson01.exercise01.recognize_sin:
    instruction: С какой буквы начинается слово سلام?
    correct_option: س
    distractors:
    - ش
    - ص
    - چ
    accepted_answers:
    - value: س
      status: correct
    feedback: سلام начинается с س. Вопрос проверяет написание выученного слова, а не то, какими буквами можно передать звук «с».
  prs.a1.unit01.lesson01.exercise02.recognize_che:
    instruction: Какая буква передаёт звук «ч»?
    correct_option: چ
    distractors:
    - ج
    - خ
    - ش
    accepted_answers:
    - value: چ
      status: correct
    feedback: چ передаёт звук «ч».
    prompt_blocks:
    - ч
  prs.a1.unit01.lesson01.exercise03.match_ke_gaf:
    instruction: Соедини каждую букву с её звуком.
    accepted_answers:
    - value:
        ا: а
        ب: б
        ت: т
        د: д
        ر: р
        ز: з
        ش: ш
        ج: дж
        چ: ч
        ف: ф
        ک: к
        گ: г
      status: correct
    feedback: Повторение всех изученных букв, включая новую пару ک/گ.
    pairs:
    - left: ا
      right: а
    - left: ب
      right: б
    - left: ت
      right: т
    - left: د
      right: д
    - left: ر
      right: р
    - left: ز
      right: з
    - left: ش
      right: ш
    - left: ج
      right: дж
    - left: چ
      right: ч
    - left: ف
      right: ф
    - left: ک
      right: к
    - left: گ
      right: г
  prs.a1.unit01.lesson01.exercise04.match_final_group:
    instruction: Соедини каждую букву с её примерным звуком.
    accepted_answers:
    - value:
        خ: х
        ق: гх/к (q)
        ل: л
        م: м
        ن: н
        و: в/у
        ه: h (мягкий выдох)
        ی: й/долгое и
      status: correct
    feedback: Эти звуки будут встречаться на протяжении всего раздела.
    pairs:
    - left: خ
      right: х
    - left: ق
      right: гх/к (q)
    - left: ل
      right: л
    - left: م
      right: м
    - left: ن
      right: н
    - left: و
      right: в/у
    - left: ه
      right: h (мягкий выдох)
    - left: ی
      right: й/долгое и
  prs.a1.unit01.lesson01.exercise05.build_salam:
    instruction: Расставь буквы так, чтобы получилось слово سلام.
    accepted_answers:
    - value:
      - س
      - ل
      - ا
      - م
      status: correct
    feedback: س ل ا م — получается سلام.
  prs.a1.unit01.lesson01.exercise06.recognize_salam:
    instruction: Выбери слитно написанное слово со значением «привет».
    correct_option: سلام
    distractors:
    - شلام
    - سلیم
    - سال
    accepted_answers:
    - value: سلام
      status: correct
    feedback: سلام означает «привет».
    prompt_blocks:
    - привет
  prs.a1.unit01.lesson01.exercise07.rtl_direction:
    instruction: Пишется ли дари справа налево?
    options:
    - да
    - нет
    accepted_answers:
    - value: да
      status: correct
    feedback: Письмо на дари идёт справа налево.
  prs.a1.unit01.lesson01.exercise08.copy_salam:
    instruction: Перепиши слово سلام точно.
    accepted_answers:
    - value: سلام
      status: correct
    feedback: Правильное написание — سلام.
  prs.a1.unit01.lesson02.exercise01.recognize_greeting_reading:
    instruction: Что означает эта фраза?
    correct_option: здравствуйте (мир вам)
    distractors:
    - до свидания
    - добро пожаловать
    - спасибо
    accepted_answers:
    - value: здравствуйте (мир вам)
      status: correct
    feedback: سلام علیکم означает «здравствуйте» (буквально «мир вам»).
  prs.a1.unit01.lesson02.exercise02.translate_response:
    instruction: 'Переведи на дари: «И вам мир» (обычный ответ на سلام علیکم).'
    accepted_answers:
    - value: وعلیکم سلام
      status: correct
    - value: و علیکم سلام
      status: acceptable_with_note
      note: Допустимый вариант написания с пробелом.
    - value: وعلیکم السلام
      status: acceptable_with_note
      note: Распространённый вариант полного ответа.
    - value: و علیکم السلام
      status: acceptable_with_note
      note: Распространённый полный ответ с отдельно написанным союзом.
    feedback: وعلیکم سلام — обычный ответ; распространённые полные формы с السلام тоже правильны.
  prs.a1.unit01.lesson02.exercise03.reply_greeting:
    instruction: Ответь на приветствие سلام علیکم.
    accepted_answers:
