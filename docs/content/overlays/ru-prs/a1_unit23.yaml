course:
  title: Дари A1
  description: 'Дари Кабула для начинающих: слова о деньгах и оплате, вопрос о способе оплаты, обмен валюты в صرافی (обменном пункте) и диалог Зармины и Хумаюна об обмене долларов на афгани.'
units:
  prs.a1.unit23.money:
    title: Деньги
    description: 'Научись решать простые денежные вопросы: обменивать валюту, платить и спрашивать о способах оплаты.'
lessons:
  prs.a1.unit23.lesson01.money_vocabulary:
    title: Слова о деньгах
  prs.a1.unit23.lesson02.payment_method:
