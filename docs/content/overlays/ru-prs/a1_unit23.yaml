  prs.a1.unit23.lesson03.currency_exchange:
    title: Обмен валюты
  prs.a1.unit23.lesson04.exchange_dialogue:
    title: В обменном пункте
  prs.a1.unit23.lesson05.reading_receipt:
    title: Читаем чек
  prs.a1.unit23.lesson06.wrap_up:
    title: Итоги
teaching:
  prs.a1.unit23.lesson01.teach.pul:
    title: Деньги
    gloss: деньги
    note: پول означает «деньги».
    example_gloss: У меня есть деньги.
  prs.a1.unit23.lesson01.teach.naqd:
    title: Наличные
    gloss: наличные
    note: نقد означает «наличные».
    example_gloss: Я плачу наличными.
  prs.a1.unit23.lesson01.teach.kart:
    title: Карта
    gloss: карта
    note: کارت означает «карта» (платёжная карта).
    example_gloss: У меня есть карта.
  prs.a1.unit23.lesson01.teach.dollar:
    title: Доллар
    gloss: доллар
    note: دالر означает «доллар» (USD). В повседневном обмене валюты в Афганистане его широко используют и указывают курс рядом с афгани.
    example_gloss: У меня есть сто долларов.
  prs.a1.unit23.lesson01.teach.review_dorom:
    title: У меня есть
    gloss: у меня есть
    note: دارم означает «у меня есть» (это слово уже встречалось в Уроке 10 «Покупки»).
    example_gloss: У меня есть деньги.
  prs.a1.unit23.lesson01.teach.review_sad:
    title: Сто
    gloss: сто
    note: صد означает «сто». Слово уже встречалось в Уроке 4 «Числа» и в Уроке 10 «Покупки».
    example_gloss: У меня есть сто долларов.
  prs.a1.unit23.lesson02.teach.mipardazam:
    title: Я плачу
    gloss: я плачу
    note: می‌پردازم означает «я плачу».
    example_gloss: Я плачу наличными.
  prs.a1.unit23.lesson02.teach.ya:
    title: Или
    gloss: или
    note: یا означает «или».
    example_gloss: Я плачу наличными или картой.
  prs.a1.unit23.lesson02.teach.naqdi_ya_karti:
    title: Наличными или картой?
    gloss: Вы заплатите наличными или картой?
    note: Частый вопрос в магазине или у окошка обмена.
  prs.a1.unit23.lesson02.teach.review_mitanom:
    title: Я могу
    gloss: я могу
    note: می‌توانم означает «я могу» (слово уже встречалось раньше в курсе).
    example_gloss: Я могу заплатить наличными.
  prs.a1.unit23.lesson02.teach.bepardazam:
    title: Заплатить
    gloss: заплатить
    note: بپردازم — форма сослагательного наклонения глагола «платить», она употребляется после می‌توانم («я могу»). می‌توانم نقد بپردازم буквально значит «я могу заплатить наличными».
    example_gloss: Я могу заплатить наличными.
  prs.a1.unit23.lesson03.teach.sarafi:
    title: Меняла
    gloss: меняла, обменный пункт
    note: صرافی — настоящее, широко распространённое в Афганистане место обмена валюты; оно отличается от официального بانک (банка).
    example_gloss: Я иду в обменный пункт.
  prs.a1.unit23.lesson03.teach.tabdil_kardan:
    title: Обменивать
    gloss: обменивать
    note: تبدیل کردن означает «обменивать» (валюту).
    example_gloss: Я меняю доллары на афгани.
  prs.a1.unit23.lesson03.teach.narkh:
    title: Курс обмена
    gloss: курс обмена
    note: نرخ означает «курс», «курс обмена».
    example_gloss: Какой сегодня курс доллара?
  prs.a1.unit23.lesson03.teach.narkh_chand_ast:
    title: Какой сегодня курс?
    gloss: Какой сегодня курс доллара?
    note: Стандартный способ спросить курс обмена.
  prs.a1.unit23.lesson03.teach.review_afghani:
    title: Афгани
    gloss: афгани
    note: افغانی — валюта Афганистана (слово уже встречалось в Уроке 10 «Покупки», например «صد افغانی»).
    example_gloss: У меня есть сто афгани.
  prs.a1.unit23.lesson03.teach.review_ast_emroz_chand:
    title: 'Повторение: есть (является), сегодня, сколько'
    gloss: есть (является) / сегодня / сколько
    note: است, امروز и چند — уже знакомые слова, которые в этом уроке соединены в вопросе о курсе.
    example_gloss: Какой сегодня курс доллара?
  prs.a1.unit23.lesson03.teach.review_ba_ra_mikonam:
    title: 'Повторение: в/на, показатель прямого дополнения, я делаю, делать, я хочу'
    gloss: в/на / показатель прямого дополнения / я делаю / делать / я хочу
    note: به, را, می‌کنم, کنم и می‌خواهم — уже знакомые слова, которые в этом уроке соединены в предложениях об обмене.
    example_gloss: Я хочу обменять доллары на афгани.
  prs.a1.unit23.lesson04.teach.review_mikhaham:
    title: Я хочу
    gloss: я хочу
    note: می‌خواهم означает «я хочу» (слово уже встречалось в предыдущих уроках).
    example_gloss: Я хочу обменять доллары.
  prs.a1.unit23.lesson04.teach.chand_darin:
    title: Сколько у вас есть?
    gloss: Сколько у вас долларов?
    note: دارین — вежливая форма (форма множественного числа) глагола «иметь»; так обращаются к клиенту.
  prs.a1.unit23.lesson04.teach.bufarmayin:
    title: Вот, пожалуйста
    gloss: пожалуйста, возьмите
    note: بفرمایین — вежливая фраза, которую говорят, когда что-то передают.
    example_gloss: Пожалуйста, вот семь тысяч афгани.
  prs.a1.unit23.lesson04.teach.hazar:
    title: Тысяча
    gloss: тысяча
    note: هزار означает «тысяча».
    example_gloss: Семь тысяч афгани.
  prs.a1.unit23.lesson04.teach.review_zarmina:
    title: Зармина
    gloss: Зармина
    note: زرمینه — постоянная героиня курса.
    example_gloss: Зармина идёт в обменный пункт.
  prs.a1.unit23.lesson04.teach.review_besyar_khub:
    title: Очень хорошо
    gloss: очень хорошо
    note: بسیار خوب — уже знакомое выражение; здесь оно используется, чтобы принять предложение.
    example_gloss: Очень хорошо, спасибо.
  prs.a1.unit23.lesson04.teach.review_haftad_tashakor_kard:
    title: 'Повторение: семьдесят, спасибо, сделал(а)'
    gloss: семьдесят / спасибо / сделал(а)
    note: هفتاد и تشکر — слова для повторения; کرد — форма прошедшего времени 3-го лица от کردن («делать»), которая уже встречалась в уроке 20 о прошедшем времени. Здесь они объединены, чтобы подвести итог обмена.
    example_gloss: Зармина обменяла сто долларов на афгани.
  prs.a1.unit23.lesson04.teach.turn01:
    title: 'Зармина: Здравствуйте, я хочу обменять доллары на афгани.'
    gloss: Здравствуйте, я хочу обменять доллары на афгани.
  prs.a1.unit23.lesson04.teach.turn02:
    title: 'Меняла: Сколько у вас долларов?'
    gloss: Сколько у вас долларов?
  prs.a1.unit23.lesson04.teach.turn03:
    title: 'Зармина: У меня сто долларов. Какой сегодня курс?'
    gloss: У меня сто долларов. Какой сегодня курс?
  prs.a1.unit23.lesson04.teach.turn04:
    title: 'Меняла: Сегодня один доллар — семьдесят афгани.'
    gloss: Сегодня один доллар стоит семьдесят афгани.
  prs.a1.unit23.lesson04.teach.turn05:
    title: 'Зармина: Очень хорошо, обменяйте, пожалуйста.'
    gloss: Очень хорошо, обменяйте, пожалуйста.
    note: 'تبدیل کنین — вежливая форма повелительного наклонения: «(пожалуйста,) обменяйте».'
  prs.a1.unit23.lesson04.teach.turn06:
    title: 'Меняла: Пожалуйста, семь тысяч афгани.'
    gloss: Пожалуйста, семь тысяч афгани.
  prs.a1.unit23.lesson04.teach.turn07:
    title: 'Зармина: Спасибо.'
    gloss: Спасибо.
  prs.a1.unit23.lesson05.teach.rasid:
    title: Квитанция
    gloss: чек
    note: رسید означает «квитанция, расписка».
    example_gloss: Я беру квитанцию.
  prs.a1.unit23.lesson05.teach.migiram:
    title: Я беру / получаю
    gloss: беру / получаю
    note: می‌گیرم означает «я беру, получаю».
    example_gloss: Я беру деньги.
  prs.a1.unit23.lesson05.teach.reading_text:
    title: Текст для чтения
    gloss: Зармина пошла к меняле. У неё было сто долларов, и она хотела обменять доллары на афгани. Сегодняшний курс был семьдесят афгани. Зармина получила семь тысяч афгани и взяла квитанцию.
  prs.a1.unit23.lesson05.teach.review_raft:
    title: Пошёл / пошла
    gloss: пошёл, ходил
    note: 'رفت — прошедшее время: «пошёл, пошла» (он/она).'
    example_gloss: Зармина пошла к меняле.
  prs.a1.unit23.lesson05.teach.review_haft_gereft:
    title: 'Повторение: семь, взял/получил (он/она), я взял/получил'
    gloss: семь / взял, получил (он/она) / я взял, получил
    note: هفت — число из повторения; گرفت и گرفتم — прошедшее время глагола گرفتن (брать, получать) в 3-м и 1-м лице; здесь они относятся к сумме, которую получила Зармина.
    example_gloss: Зармина получила семь тысяч афгани.
  prs.a1.unit23.lesson06.teach.review_summary:
    title: Итог
    gloss: 'У меня есть деньги: наличные и карта. Я могу обменять доллары на афгани у менялы. Сегодняшний курс — семьдесят афгани за один доллар.'
  prs.a1.unit23.lesson06.teach.review_bara:
    title: Для
    gloss: для
    note: برای означает «за; для».
    example_gloss: Семьдесят афгани за один доллар.
  prs.a1.unit23.lesson06.teach.review_va:
    title: И
    gloss: и
    note: و означает «и» — это слово уже знакомо из прошлых уроков.
    example_gloss: 'У меня есть деньги: наличные и карта.'
