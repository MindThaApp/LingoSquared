    gloss: 'Thomas: In the park, close to my house.'
  fr.a1.unit55.lesson04.teach.courir_est_un:
    title: Courir is irregular
    gloss: '*Courir* (to run) is irregular: *je cours, tu cours, il court*. The final *s* and *t* are silent.'
    note: '*Courir* does not follow the regular *-er* pattern, so its forms are worth learning by heart: *je cours*, *tu cours*, *il court*.'
  fr.a1.unit55.lesson04.teach.mathieu_super_j:
    title: Mathieu reacts
    gloss: 'Mathieu: How nice, I often play football there.'
  fr.a1.unit55.lesson05.teach.camille_fait_du:
    title: Camille and Léa on sport
    gloss: Camille does yoga twice a week. She loves moving calmly. Léa doesn't do yoga, but she loves swimming. Léa swims often, almost every week. What sport do you do?
    note: Contrasts two different sports and two different frequency expressions, mirroring the animal-comparison reading in the previous unit.
