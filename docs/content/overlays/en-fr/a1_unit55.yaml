  fr.a1.unit55.lesson01.teach.je_joue_au:
    title: I play football
    gloss: I play football.
    note: '*Jouer au* + a ball game is the usual way to say you play football. For other sports use *faire du* or *faire de la*; see the grammar note.'
  fr.a1.unit55.lesson01.teach.faire_du_de:
    title: Faire du / de la + sport
    gloss: '*Faire du*, *de la* or *de l''* + a sport says which sport you do: *faire du yoga*, *faire de la natation*, *faire de la course à pied*. For football you say *jouer au football*.'
    note: One construction covers every le sport -- no need to learn a separate verb per le sport at this level.
  fr.a1.unit55.lesson02.teach.fois_par_semaine:
    title: Times a week
    gloss: times a week
    example_gloss: I do yoga twice a week.
  fr.a1.unit55.lesson02.teach.tu_connais_deja:
    title: Fois par semaine vs tous les jours/souvent
    gloss: You already know *tous les jours* (every day) and *souvent* (often). *Deux fois par semaine* (twice a week) is a new, more specific way to say how often.
    note: Extends the frequency vocabulary already established in the hobbies unit.
  fr.a1.unit55.lesson02.teach.je_fais_du:
    title: I do yoga twice a week
    gloss: I do yoga twice a week.
  fr.a1.unit55.lesson02.teach.mathieu_joue_souvent:
    title: Mathieu often plays football
    gloss: Mathieu often plays football.
    note: Reuses *souvent* (often), already established for routines in an earlier unit.
  fr.a1.unit55.lesson03.teach.tu_connais_deja:
    title: Faire du sport vs faire de la + sport
    gloss: 'You already know *faire du sport* from the hobbies lesson (*Je fais du sport le samedi*). *Faire de la* + sport names the specific sport: *Je fais de la natation*. Both are correct French.'
    note: '*Faire du sport* is reused from the hobbies unit, not new. This contrasts it with naming a specific sport: one general and one specific way to talk about exercise.'
  fr.a1.unit55.lesson03.teach.faire_du_sport:
    title: To exercise
    gloss: to exercise / do sport
    example_gloss: I exercise every day.
  fr.a1.unit55.lesson03.teach.adorer_nager:
    title: To love swimming
    gloss: to love swimming
    example_gloss: Léa loves swimming.
  fr.a1.unit55.lesson03.teach.lea_adore_nager:
    title: Léa loves swimming
    gloss: Léa loves swimming.
    note: '*Adorer* (to love) can be followed by an infinitive for an activity: *Léa adore nager.*'
  fr.a1.unit55.lesson04.teach.mathieu_tu_cours:
