answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A2
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names and "Docteur" used as a
    form of address.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate formal
    register rather than written punctuation or liaison marks.

course:
  title: "French A2"
  description: >-
    Attending a doctor's appointment: describing a symptom in more detail
    than A1 (duration with "Ça fait... que..." / "depuis que...", severity
    with "de plus en plus" / "surtout le matin"), and understanding a
    doctor's softened and direct advice register (conditional + subjunctive
    "il faudrait que", obligatory "il faut que" + subjunctive, "je vous
    conseille de" + infinitive). Continues Inès's storyline into her new
    professional pâtisserie apprenticeship in Lyon, where early mornings and
    long hours standing near hot ovens genuinely catch up with her.
    English-specific guidance highlights that this unit is Inès's first
    sustained formal "vous" content -- no "tu" appears anywhere, unlike her
    peer conversations with Mathieu in A1.

units:
  fr.a2.unit18.chez_le_medecin:
    title: "At the doctor's"

lessons:
  fr.a2.unit18.lesson01.symptomes_duree:
    title: "Describing a symptom: duration and severity"
  fr.a2.unit18.lesson02.conseils_medicaux:
    title: "The doctor's advice"
  fr.a2.unit18.lesson03.consultation:
    title: "A doctor's appointment"

teaching:
  fr.a2.unit18.lesson01.teach.ca_fait_que:
    title: "It's been... / for... (duration)"
    gloss: "it's been... / for... (ongoing duration)"
    note: "*Ça fait + [time] + que + [present tense]* expresses a duration that's still going on -- much more common in spoken French than a literal word-for-word \"it makes\" translation would suggest."
    example_gloss: "It's been three days since I've had a sore throat. (I've had a sore throat for three days.)"
  fr.a2.unit18.lesson01.teach.depuis_que:
    title: "Ever since"
    gloss: "ever since / since (+ clause)"
    note: "*Depuis que* is followed by a full clause (subject + verb), unlike plain *depuis*, which takes a noun or a time expression."
    example_gloss: "Ever since I started my apprenticeship, I get up very early."
  fr.a2.unit18.lesson01.teach.de_plus_en_plus:
    title: "More and more"
    gloss: "more and more"
    note: "A standard intensifier for describing a symptom that keeps getting worse -- pairs naturally with an adjective, as here with *forte*."
    example_gloss: "The pain is getting stronger and stronger."
  fr.a2.unit18.lesson01.teach.surtout_le_matin:
    title: "Especially in the morning"
    gloss: "especially in the morning"
    note: "*Avoir du mal à + infinitive* means \"to have trouble doing something\" -- useful for describing when a symptom is at its worst."
    example_gloss: "It's especially in the morning that I have trouble swallowing."
  fr.a2.unit18.lesson01.teach.epuise:
    title: "Exhausted"
    gloss: "exhausted"
    note: "Agrees like a regular adjective: *épuisé* for a masculine subject, *épuisée* for feminine, as Inès uses it here."
    example_gloss: "I'm exhausted from the hours standing in the heat of the ovens."
  fr.a2.unit18.lesson01.teach.empirer:
    title: "To get worse"
    gloss: "to get worse"
    note: "A regular *-er* verb -- *ça empire* (it's getting worse) is the exact phrase a doctor or patient would use to describe a worsening symptom."
    example_gloss: "If it gets worse, I have to make an appointment."
  fr.a2.unit18.lesson01.teach.prendre_rdv:
    title: "To make an appointment"
    gloss: "to make an appointment"
    note: "The standard phrase for booking any appointment in French, not just medical ones -- also used for the hairdresser, a bank advisor, etc."
    example_gloss: "I'd like to make an appointment with the doctor."
  fr.a2.unit18.lesson01.teach.voix_enrouee:
    title: "Hoarse voice"
    gloss: "hoarse voice"
    note: "*Enrouée* agrees with the feminine *voix* -- the masculine form *enroué* would describe a person, not the voice itself."
    example_gloss: "I've had a hoarse voice since Monday."

  fr.a2.unit18.lesson02.teach.ameliorer:
    title: "To get better"
    gloss: "to get better / improve"
    note: "A reflexive verb: *s'améliorer*. Here negated with *ne... pas* around the reflexive pronoun: *ne s'améliore pas*."
    example_gloss: "If the pain doesn't get better, come see me again."
  fr.a2.unit18.lesson02.teach.arret_de_travail:
    title: "A sick note"
    gloss: "sick note / medical leave"
    note: "The official French term for doctor-issued time off work -- a real, commonly used piece of bureaucratic vocabulary, not a literal translation of \"sick note.\""
    example_gloss: "The doctor gave me two days of medical leave."
  fr.a2.unit18.lesson02.teach.grammar_advice_register:
    title: "Doctor's-advice register"
    gloss: "il faudrait que + subjunctive; il faut que + subjunctive; je vous conseille de + infinitive"
    note: "French doctors naturally move between a SOFTENED suggestion (*il faudrait que* + subjunctive, \"you should\"), a plain recommendation (*je vous conseille de* + infinitive, \"I advise you to\"), and a firmer instruction (*il faut que* + subjunctive, \"you must\") -- all three are genuinely natural in the same consultation, not interchangeable synonyms of each other."
  fr.a2.unit18.lesson02.teach.phrase_reposiez:
    title: "You should rest your voice"
    gloss: "You should rest your voice."
    note: "*Reposiez* is the subjunctive *vous* form of the reflexive *se reposer* -- required after *il faudrait que*."
  fr.a2.unit18.lesson02.teach.phrase_conseille_boire:
    title: "I advise you to drink hot water"
    gloss: "I advise you to drink a lot of hot water."
    note: "*Conseiller de + infinitive* -- no subjunctive here, since *conseiller de* takes a plain infinitive rather than a *que* clause."
  fr.a2.unit18.lesson02.teach.phrase_preniez_sirop:
    title: "You must take this syrup"
    gloss: "You must take this syrup three times a day."
    note: "*Preniez* is the subjunctive *vous* form of *prendre*, required after the obligatory *il faut que*."
  fr.a2.unit18.lesson02.teach.phrase_reveniez_empire:
    title: "Come back if it worsens"
    gloss: "I want you to come back if the pain gets worse."
    note: "*Vouloir que* + subjunctive (*reveniez*, from *revenir*) is another common subjunctive trigger, distinct from *il faut que* but with the same grammatical requirement."
  fr.a2.unit18.lesson02.teach.phrase_accepter_conseil:
    title: "Agreeing to the advice"
    gloss: "Okay, I'll rest and drink a lot of hot water."
    note: "*D'accord* is the standard way to agree to a suggestion; *je vais + infinitive* is the near-future, used here for a genuine intention rather than a scheduled fact."

  fr.a2.unit18.lesson03.teach.confirmation_rdv:
    title: "An appointment confirmation"
    gloss: >-
      A confirmation message: Inès Fournier, Tuesday 2:30 PM, Dr. Lambert's
      office, 12 rue de la République, Lyon. Please arrive ten minutes
      before the appointment time and bring your Carte Vitale.
    note: "*La carte Vitale* is the real French national health-insurance card every patient presents at an appointment -- genuine, current French bureaucratic vocabulary, not invented for this course."
    glosses:
      Confirmation: "confirmation"
      rendez-vous: "appointment"
      mardi: "Tuesday"
      cabinet: "doctor's office"
      docteur: "doctor"
      rue: "street"
      dix: "ten"
      minutes: "minutes"
      avant: "before"
      carte: "card"
  fr.a2.unit18.lesson03.teach.line01:
    title: "The doctor greets Inès"
    gloss: "The doctor asks Inès what's wrong today."
    note: "*Qu'est-ce qui ne va pas ?* is the standard way a French doctor opens a consultation -- more natural here than a literal \"what's wrong.\""
  fr.a2.unit18.lesson03.teach.line02:
    title: "Inès names the duration and severity"
    gloss: "Inès says she's had a sore throat for three days, and the pain is getting worse and worse."
    note: "Combines lesson01's *depuis* and *de plus en plus* in one natural reply -- exactly the level of detail A1's bare \"j'ai mal à la gorge\" doesn't reach."
  fr.a2.unit18.lesson03.teach.line03:
    title: "The doctor asks about other symptoms"
    gloss: "The doctor asks if she has other symptoms, like a fever."
    note: "*Par exemple* (for example) softens the question into a suggestion rather than a demand."
  fr.a2.unit18.lesson03.teach.line04:
    title: "Inès explains the cause"
    gloss: >-
      Inès says she has a little fever in the evening and is exhausted,
      especially in the morning -- ever since starting her apprenticeship,
      she gets up at four and stands all day near the ovens.
    note: "The longest, most complex turn in the dialogue -- a genuine multi-clause A2 sentence linking cause (*depuis que...*) to effect, well past a single short A1 statement."
  fr.a2.unit18.lesson03.teach.line05:
    title: "The doctor examines and diagnoses"
    gloss: "The doctor says it's not strep throat, but her vocal cords are irritated by the heat of the ovens."
    note: "*Ce n'est pas une angine* rules out the more serious possibility before giving the real diagnosis -- a natural reassurance pattern in medical French."
  fr.a2.unit18.lesson03.teach.line06:
    title: "The doctor gives advice and a prescription"
    gloss: >-
      The doctor says she should rest her voice as much as possible, advises
      hot water with honey, and prescribes a syrup to take three times a
      day.
    note: "All three registers from lesson02's grammar note appear together here: softened (*il faudrait que*), plain advice (*je vous conseille de*), and obligatory (*il faut que*)."
  fr.a2.unit18.lesson03.teach.line07:
    title: "Inès asks about a follow-up"
    gloss: "Inès agrees, and asks what happens if it doesn't get better."
    note: "*Et si...* is a natural, common way to ask \"what if\" in spoken French."
  fr.a2.unit18.lesson03.teach.line08:
    title: "The doctor sets a follow-up plan"
    gloss: "The doctor says to come back in a week, or sooner if the pain gets worse."
    note: "*Avant ça* (before then) ties the return instruction to a real conditional timeframe, closing the consultation the way a real appointment naturally would."

exercises:
  fr.a2.unit18.lesson01.exercise01.select_de_plus_en_plus:
    instruction: "Which phrase means \"more and more\"?"
    correct_option: "de plus en plus"
    distractors: ["de moins en moins", "un petit peu"]
    accepted_answers: ["de plus en plus"]

  fr.a2.unit18.lesson01.exercise02.listen_ca_fait_trois_jours:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Ça fait trois jours que j'ai mal à la gorge."
    distractors: ["Ça fait une semaine que je suis fatiguée.", "J'ai mal à la tête depuis ce matin."]
    accepted_answers: ["Ça fait trois jours que j'ai mal à la gorge."]

  fr.a2.unit18.lesson01.exercise03.match_symptom_phrases:
    instruction: "Match each French phrase to its English meaning."
    correct_response:
      "Ça fait... que...": "It's been... / for... (duration)"
      "depuis que": "ever since"
      "de plus en plus": "more and more"
      "surtout le matin": "especially in the morning"
      "épuisé, épuisée": "exhausted"
      empirer: "to get worse"
      "prendre rendez-vous": "to make an appointment"
      "la voix enrouée": "hoarse voice"

  fr.a2.unit18.lesson01.exercise04.order_je_voudrais_prendre_rdv:
    instruction: "Build the sentence: I'd like to make an appointment with the doctor."
    correct_response: ["Je", "voudrais", "prendre", "rendez-vous", "avec", "le", "docteur"]

  fr.a2.unit18.lesson01.exercise05.fill_depuis:
    instruction: "Complete the sentence with the word for \"since.\""
    accepted_answers: ["depuis"]

  fr.a2.unit18.lesson01.exercise06.write_appointment_request:
    instruction: >-
      Write a short message requesting an appointment. Mention your symptom
      (a sore throat) and how long you've had it (three days).
    accepted_answers:
      - "Bonjour, je voudrais prendre rendez-vous. J'ai mal à la gorge depuis trois jours."
      - "Bonjour, je voudrais prendre rendez-vous, j'ai mal à la gorge depuis trois jours."
      - "Bonjour, je voudrais prendre rendez-vous et j'ai mal à la gorge depuis trois jours."
      - "Je voudrais prendre rendez-vous. J'ai mal à la gorge depuis trois jours."
      - "Je voudrais prendre rendez-vous, j'ai mal à la gorge depuis trois jours."
      - "Je voudrais prendre rendez-vous et j'ai mal à la gorge depuis trois jours."

  fr.a2.unit18.lesson02.exercise01.select_softened_advice:
    instruction: "Which sentence is a softened piece of advice meaning \"you should\"?"
    correct_option: "Il faudrait que vous vous reposiez la voix."
    distractors: ["Vous devez courir tous les jours.", "Mangez plus de sucre."]
    accepted_answers: ["Il faudrait que vous vous reposiez la voix."]

  fr.a2.unit18.lesson02.exercise02.listen_preniez_sirop:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Il faut que vous preniez ce sirop trois fois par jour."
    distractors: ["Il faudrait que vous vous reposiez la voix.", "Je vous conseille de boire beaucoup d'eau chaude."]
    accepted_answers: ["Il faut que vous preniez ce sirop trois fois par jour."]

  fr.a2.unit18.lesson02.exercise03.match_advice_phrases:
    instruction: "Match each French phrase to its English meaning."
    correct_response:
      "s'améliorer": "to get better"
      "un arrêt de travail": "a sick note"
      "Il faudrait que vous vous reposiez.": "You should rest."
      "Je vous conseille de boire beaucoup d'eau chaude.": "I advise you to drink a lot of hot water."
      "Il faut que vous preniez ce sirop.": "You must take this syrup."
      "Je veux que vous reveniez si ça empire.": "I want you to come back if it gets worse."
      "prendre rendez-vous": "to make an appointment"

  fr.a2.unit18.lesson02.exercise04.order_preniez_sirop:
    instruction: "Build the sentence: You must take this syrup three times a day."
    correct_response: ["Il", "faut", "que", "vous", "preniez", "ce", "sirop", "trois", "fois", "par", "jour"]

  fr.a2.unit18.lesson02.exercise05.fill_boire:
    instruction: "Complete the sentence with the word for \"to drink.\""
    accepted_answers: ["boire"]

  fr.a2.unit18.lesson02.exercise06.reply_accept_advice:
    instruction: "Take Inès's role. Agree to the doctor's advice: say you'll rest and drink a lot of hot water."
    accepted_answers:
      - "D'accord, je vais me reposer et boire beaucoup d'eau chaude."
      - "D'accord, je vais me reposer et boire beaucoup d'eau chaude"
      - "D'accord. Je vais me reposer et boire beaucoup d'eau chaude."

  fr.a2.unit18.lesson03.exercise01.read_confirmation_time:
    instruction: "Read the appointment confirmation. What day and time is Inès's appointment?"
    correct_option: "Tuesday at 2:30 PM"
    distractors: ["Tuesday at 4:30 PM", "Wednesday at 2:30 PM"]
    accepted_answers: ["Tuesday at 2:30 PM"]

  fr.a2.unit18.lesson03.exercise02.comprehend_duration:
    instruction: "Listen to the dialogue. How long has Inès had a sore throat?"
    correct_option: "Three days"
    distractors: ["One week", "Since this morning"]
    accepted_answers: ["Three days"]

  fr.a2.unit18.lesson03.exercise03.comprehend_diagnosis:
    instruction: "According to the doctor, what's causing Inès's sore throat?"
    correct_option: "Her vocal cords are irritated by the heat of the ovens"
    distractors: ["She has strep throat", "She caught a cold from a colleague"]
    accepted_answers: ["Her vocal cords are irritated by the heat of the ovens"]

  fr.a2.unit18.lesson03.exercise04.order_cordes_vocales_irritees:
    instruction: "Build the doctor's sentence about the cause."
    correct_response: ["Vos", "cordes", "vocales", "sont", "irritées", "par", "la", "chaleur", "des", "fours"]

  fr.a2.unit18.lesson03.exercise05.reply_ask_if_worsens:
    instruction: "Take Inès's role. Thank the doctor and ask what happens if it doesn't get better."
    accepted_answers:
      - "D'accord, Docteur. Et si ça ne s'améliore pas ?"
      - "D'accord, Docteur, et si ça ne s'améliore pas ?"
      - "D'accord Docteur. Et si ça ne s'améliore pas ?"

  fr.a2.unit18.lesson03.exercise06.speak_repeat_instruction:
    instruction: "Say the doctor's instruction about the syrup out loud."
    accepted_answers:
      - "Il faut que vous preniez ce sirop trois fois par jour."
      - "Il faut que vous le preniez trois fois par jour."
