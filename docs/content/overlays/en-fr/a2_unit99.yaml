answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A2 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or liaison marks.
course:
  title: French A2
  description: Intermediate French continuing the Camille and Mathieu storyline, now with a grammar-led block on everyday functions.
  learning_goal: Ask politely for information with savez-vous / pouvez-vous me dire plus où, quand, à quelle heure, combien, comment or si.
units:
  fr.a2.unit99.savez_vous_ou:
    title: Do you know where ...?
    description: 'Ask politely for information with an embedded question: savez-vous où, quand, si, and pouvez-vous me dire.'
lessons:
  fr.a2.unit99.lesson01.ou:
    title: Do you know where ...?
  fr.a2.unit99.lesson02.quand:
    title: Do you know what time ...?
  fr.a2.unit99.lesson03.si:
    title: I would like to know whether ...
  fr.a2.unit99.lesson04.pouvez_vous:
    title: Can you tell me ...?
