  fr.a2.unit99.lesson06.dialogue:
    title: Camille at the tourist office
teaching:
  fr.a2.unit99.lesson01.teach.mots:
    title: Asking where
    gloss: where / to know / the station / the pharmacy / the post office
    example_gloss:
    - Where is the station?
    - Do you know where the station is?
    - Do you know where the pharmacy is?
    - I do not know where the post office is.
  fr.a2.unit99.lesson01.teach.gn_indirect:
    title: Direct and indirect
    gloss: Where is the station? Do you know where the station is?
    note: An indirect question is a question inside another sentence. It is softer and more polite than a direct question. After *où*, the verb *être* usually stays before the place (*où est la gare*). With other verbs, put the subject first (*où je peux acheter*).
  fr.a2.unit99.lesson01.teach.gn_vous_tu:
    title: Vous or tu
    gloss: Do you know where the station is? Do you know where the station is?
    note: With a stranger, use *savez-vous* (formal, with a hyphen). With a friend, say *tu sais* and let your voice rise.
  fr.a2.unit99.lesson01.teach.gn_negation:
    title: I do not know where
    gloss: I do not know where the post office is.
    note: The same pattern works after *je ne sais pas*. There is no question mark because it is a statement.
  fr.a2.unit99.lesson01.teach.phrase:
    title: A polite question
    gloss: Do you know where the station is?
  fr.a2.unit99.lesson02.teach.mots:
    title: Asking when
    gloss: when / at what time / the shop / the museum / the train / to open / to close
    example_gloss:
    - Do you know what time the train leaves?
    - Do you know when the shop opens?
    - I do not know what time the museum closes.
  fr.a2.unit99.lesson02.teach.gn_quand:
    title: Quand plus a clause
    gloss: Do you know when the shop opens?
    note: 'After *quand*, put the subject before the verb, as in a statement: *quand le magasin ouvre*. Do not add *est-ce que*.'
  fr.a2.unit99.lesson02.teach.gn_heure:
    title: À quelle heure
    gloss: Do you know what time the train leaves?
    note: '*À quelle heure* asks for the time. It is a fixed expression, followed by subject and verb.'
  fr.a2.unit99.lesson02.teach.gn_direct:
    title: Direct to indirect
    gloss: What time does the train leave? Do you know what time the train leaves?
    note: 'In the indirect form the subject comes before the verb: *le train part*.'
  fr.a2.unit99.lesson02.teach.phrase:
    title: Asking the time
    gloss: Do you know what time the train leaves?
  fr.a2.unit99.lesson03.teach.mots:
    title: Asking yes or no
    gloss: whether, if / open / closed / I would like to know / there is / a bus / the restaurant
    example_gloss:
    - Do you know whether the museum is open?
    - I would like to know whether the restaurant is closed.
    - I do not know whether there is a bus.
  fr.a2.unit99.lesson03.teach.gn_si:
    title: Si for yes or no
    gloss: Do you know whether the museum is open?
    note: For a yes or no question, use *si* ('whether'). It has no accent and it is not the *si* of 'if I come'.
  fr.a2.unit99.lesson03.teach.gn_sil:
    title: S'il
    gloss: I do not know whether there is a bus. Do you know whether it is open?
    note: '*Si* plus *il* becomes *s''il*, also in this question.'
  fr.a2.unit99.lesson03.teach.gn_voudrais:
    title: Je voudrais savoir
    gloss: I would like to know whether the museum is open.
    note: '*Je voudrais savoir* is a polite opener you can use in a shop, at a counter or in an email.'
  fr.a2.unit99.lesson03.teach.phrase:
    title: A polite opener
    gloss: I would like to know whether the museum is open.
  fr.a2.unit99.lesson04.teach.mots:
    title: Asking for information
    gloss: can you tell me / how much / it costs / how / to go / the metro
    example_gloss:
    - Can you tell me where the metro is?
    - Can you tell me how much it costs?
    - Can you tell me how to get to the station?
  fr.a2.unit99.lesson04.teach.gn_dire:
    title: Pouvez-vous me dire
    gloss: Can you tell me where the metro is?
    note: '*Pouvez-vous me dire* is a polite opener. The embedded question follows it directly.'
  fr.a2.unit99.lesson04.teach.gn_combien:
    title: Combien
    gloss: Can you tell me how much it costs?
    note: '*Combien* asks about price or quantity. *Ça coûte* keeps statement order.'
  fr.a2.unit99.lesson04.teach.gn_comment:
    title: Comment plus infinitive
    gloss: Can you tell me how to get to the station?
    note: 'To ask how to do something, use *comment* plus an infinitive: *comment aller*.'
  fr.a2.unit99.lesson04.teach.phrase:
    title: A polite request
    gloss: Can you tell me where the metro is?
  fr.a2.unit99.lesson05.teach.mots:
    title: Words for the message
    gloss: hello / Sunday / also / thank you in advance / to buy
    example_gloss:
    - Hello, I would like to know whether the museum is open on Sunday.
    - Do you also know where I can buy the tickets?
    - Thank you in advance.
  fr.a2.unit99.lesson05.teach.gn_formel:
    title: A formal message
    gloss: Hello. I would like to know whether the museum is open. Thank you in advance.
    note: A polite message opens with *Bonjour*, asks with *je voudrais savoir* and ends with *Merci d'avance*.
  fr.a2.unit99.lesson05.teach.gn_peux:
    title: Embedded question with pouvoir
    gloss: Do you know where I can buy the tickets?
    note: 'The embedded clause can have its own verb: *où je peux acheter ...*. The subject comes before the verb.'
  fr.a2.unit99.lesson05.teach.reading:
    title: Camille writes to the tourist office
    gloss: Hello, I would like to know whether the museum is open on Sunday. Can you tell me what time it opens? Do you also know where I can buy the tickets? Thank you in advance. Camille
    note: Three embedded questions in one polite message.
    glosses:
      billets: tickets
      musée: museum
  fr.a2.unit99.lesson06.teach.a1:
    title: The employee greets her
    gloss: 'L''employé: Hello! Can I help you?'
  fr.a2.unit99.lesson06.teach.q1:
    title: Camille asks whether
    gloss: 'Camille: Yes, do you know whether the museum is open today?'
  fr.a2.unit99.lesson06.teach.a2:
    title: The employee gives the closing time
    gloss: 'L''employé: Yes, it closes at six o''clock.'
  fr.a2.unit99.lesson06.teach.q2:
    title: Camille asks the price
    gloss: 'Camille: Can you tell me how much a ticket costs?'
  fr.a2.unit99.lesson06.teach.a3:
    title: The employee answers
    gloss: 'L''employé: A ticket costs ten euros. The tickets are over there, on the right.'
  fr.a2.unit99.lesson06.teach.q3:
    title: Camille thanks him
    gloss: 'Camille: Thank you very much!'
