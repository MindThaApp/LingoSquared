teaching:
  fr.a2.unit94.lesson01.teach.deplacer_annuler:
    title: Changing an appointment
    gloss: to move (an appointment) / to cancel
    note: '*Déplacer un rendez-vous* means to move it to another time. *Annuler* means to cancel it completely.'
    example_gloss:
    - I want to move my appointment.
    - I have to cancel my appointment.
  fr.a2.unit94.lesson01.teach.malheureusement_pardon:
    title: Saying you are sorry
    gloss: unfortunately / sorry
    note: '*Malheureusement* is a polite way to give bad news. *Pardon* is the everyday apology.'
    example_gloss:
    - Unfortunately I cannot come.
    - Sorry, I am too late.
  fr.a2.unit94.lesson01.teach.le_salon_de:
    title: The hairdresser's
    gloss: the hairdresser's (salon)
    note: '*Le salon de coiffure* is the place; *le coiffeur* (or *la coiffeuse*) is the person. People often say *aller chez le coiffeur* for both.'
    example_gloss: The salon is open from nine to six.
  fr.a2.unit94.lesson01.teach.est_ce_que:
    title: Asking to move an appointment
    gloss: Can I move my appointment?
    note: 'A yes/no question can start with *Est-ce que*, then the subject and the verb: *Est-ce que je peux ... ?* The infinitive *déplacer* comes right after *peux*.'
  fr.a2.unit94.lesson01.teach.malheureusement_je_ne:
    title: Saying you cannot come
    gloss: Unfortunately I cannot come.
  fr.a2.unit94.lesson01.teach.je_ne_peux:
    title: Pouvoir + infinitive
    gloss: I cannot come on Thursday. Can I move the appointment?
    note: 'After *peux* the second verb is an infinitive. In a statement, *ne* ... *pas* wraps around *peux*: *Je ne peux pas venir jeudi*. A day like *jeudi* goes after the infinitive. In a question use *Est-ce que*: *Est-ce que je peux déplacer le rendez-vous ?*'
  fr.a2.unit94.lesson02.teach.un_autre_jour:
    title: Another day
    gloss: another day
    note: '*Autre* does not change before a masculine noun: *un autre jour*. Before a feminine noun it is *une autre semaine*.'
    example_gloss: Can it also be on another day?
  fr.a2.unit94.lesson02.teach.est_ce_que:
    title: Suggesting a day
    gloss: Can it also be Monday?
    note: 'French needs no article before the weekday here: *lundi*, not *le lundi* (which would mean ''every Monday'').'
  fr.a2.unit94.lesson02.teach.est_ce_que_2:
    title: Does it suit you?
    gloss: Does Friday suit you? (formal)
    note: '*Convenir* means ''to suit''. The person goes right before the verb: *Est-ce que vendredi vous convient ?* *Vous* is the polite form for someone you do not know well.'
  fr.a2.unit94.lesson02.teach.oui_ca_me:
    title: Saying yes
    gloss: Yes, that suits me well.
  fr.a2.unit94.lesson02.teach.malheureusement_non:
    title: Saying no politely
    gloss: Unfortunately not.
  fr.a2.unit94.lesson02.teach.est_ce_que_3:
    title: Does it suit you?
    gloss: Does Friday suit you? Yes, that suits me well. No, unfortunately not.
    note: '*Convenir* means ''to suit''. In a polite question the person goes before the verb: *Est-ce que vendredi vous convient ?* The answer *Oui, ça me convient très bien* confirms. A polite refusal is *Non, malheureusement pas*.'
  fr.a2.unit94.lesson03.teach.car_je_regrette:
    title: Because and I am sorry
    gloss: because / I am sorry
    note: '*Car* joins two full sentences and gives the reason, with a comma before it. *Parce que* is the everyday alternative. *Je regrette* is a more careful apology than *pardon*.'
    example_gloss:
    - I cannot come, because I am ill.
    - I am sorry.
  fr.a2.unit94.lesson03.teach.le_derangement:
    title: Inconvenience
    gloss: the inconvenience
    note: '*Excusez-moi pour le dérangement* is a polite phrase after you have caused someone extra trouble.'
    example_gloss: Sorry for the inconvenience.
  fr.a2.unit94.lesson03.teach.je_ne_peux:
    title: 'Reason: work'
    gloss: I cannot come, because I have to work.
  fr.a2.unit94.lesson03.teach.je_ne_peux_2:
    title: 'Reason: another appointment'
    gloss: I cannot come, because I have another appointment.
  fr.a2.unit94.lesson03.teach.je_ne_peux_3:
    title: 'Because: car'
    gloss: I cannot come, because I am ill.
    note: 'After *car* the word order is the ordinary one: subject, then verb. Put a comma before *car*: *Je ne peux pas venir, car je suis malade.* *Parce que* works the same way and is more common in speech.'
  fr.a2.unit94.lesson04.teach.fixer_a_l:
    title: Agreeing and in advance
    gloss: to arrange / in advance
    note: '*Fixer* is to settle a time or place. *À l''avance* means ''beforehand'', ''in advance''.'
    example_gloss:
    - Shall we arrange something?
    - Call a day in advance.
  fr.a2.unit94.lesson04.teach.lundi_a_dix:
    title: Accepting a time
    gloss: Monday at ten o'clock is fine.
  fr.a2.unit94.lesson04.teach.pouvez_vous_venir:
    title: Asking if a time works
    gloss: Can you come on Monday at ten o'clock? (formal)
    note: '*Pouvez-vous* is the polite form of *tu peux*. The infinitive *venir* comes right after it.'
  fr.a2.unit94.lesson04.teach.alors_je_vous:
    title: Closing the arrangement
    gloss: Then I will see you on Monday.
  fr.a2.unit94.lesson04.teach.alors_je_prends:
    title: Making a new appointment
    gloss: Then I will make a new appointment.
  fr.a2.unit94.lesson04.teach.lundi_a_dix_2:
    title: Day first, then à + time
    gloss: Monday at ten o'clock is fine. Can you come on Monday at ten o'clock?
    note: 'When you give a day and a time, the day comes first and then *à* + the time: *lundi à dix heures*. In a polite question use *Pouvez-vous ... ?* and put the infinitive right after it.'
  fr.a2.unit94.lesson05.teach.cher_mathieu_votre:
    title: A message from the salon
    gloss: Dear Mathieu, your appointment has been moved. Your new appointment is Monday at ten o'clock. Does this not suit you? Then please call us the day before. We will arrange a new appointment. See you Monday! Salon Dupont
    note: This is a typical short message from a business, so it uses *vous* and *votre*. *A été déplacé* means 'has been moved'.
    glosses:
      cher: dear
      mathieu: Mathieu
      votre: your (formal)
      rendez-vous: appointment
      déplacé: moved
      nouveau: new
      lundi: Monday
      dix: ten
      heures: o'clock
      convient: suits (convient)
      cela: this
      pas: not
      ne: part of ne ... pas
      appeler: call
      nous: we
      alors: then
      veille: in advance
      fixerons: make
      à: until, see you
      salon: hairdresser's
      dupont: Dupont
  fr.a2.unit94.lesson06.teach.salon_dupont_bonjour:
    title: The salon answers
    gloss: 'Hairdresser: Salon Dupont, hello.'
  fr.a2.unit94.lesson06.teach.bonjour_c_est:
    title: Mathieu explains and asks
    gloss: 'Mathieu: Good afternoon, you are speaking to Mathieu. I have an appointment on Thursday, but unfortunately I cannot come. Can I move the appointment?'
  fr.a2.unit94.lesson06.teach.bien_sur_est:
    title: The hairdresser suggests Friday
    gloss: 'Hairdresser: Of course. Does Friday suit you?'
  fr.a2.unit94.lesson06.teach.malheureusement_non_car:
    title: Mathieu suggests Monday
    gloss: 'Mathieu: Unfortunately not, because I have to work. Can it also be Monday?'
  fr.a2.unit94.lesson06.teach.lundi_a_dix:
    title: The hairdresser agrees
    gloss: 'Hairdresser: Monday at ten o''clock is fine.'
  fr.a2.unit94.lesson06.teach.ca_me_convient:
    title: Mathieu accepts and apologises
    gloss: 'Mathieu: That suits me well. Thank you very much and sorry for the inconvenience.'
  fr.a2.unit94.lesson06.teach.pas_de_probleme:
    title: The hairdresser closes
    gloss: 'Hairdresser: No problem. See you Monday!'
