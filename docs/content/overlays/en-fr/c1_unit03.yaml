    feedback: "Je vous prie de bien vouloir accepter mes excuses pour ce retard. Franchement, c'est un désastre, le gâteau est arrivé en retard !"
  fr.c1.unit03.tone_et_registre.lesson06.exercise04.write_reecriture:
    instruction: "Write the exact complete rewrite of the same message for two audiences: first the diplomatic formal apology (Je vous prie de bien vouloir accepter mes excuses pour ce retard), then the emphatic reaction (Franchement, c'est un désastre, le gâteau est arrivé en retard !)."
    accepted_answers:
      - {value: "Je vous prie de bien vouloir accepter mes excuses pour ce retard. Franchement, c'est un désastre, le gâteau est arrivé en retard !", status: correct}
