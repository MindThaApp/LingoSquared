review:
  status: reviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Overlay for French C1 unit 03 on tone and register. English-speaker
    interference risks: confusing the diplomatic formal register (vous) with
    the informal emphatic/ironic register (tu), and writing an open production
    prompt that a learner could answer with several different reformulations.
    The production exercises therefore name exact taught models and accept
    those strings. The diplomatic/formal sentences are addressed to the client
    Madame Durand with vous, while the ironic and emphatic sentences are Inès
    speaking to Mathieu with tu. No sibling-direction overlay was consulted.

course:
  title: French C1
  description: "Advanced French register: shifting between formal, diplomatic, ironic, and emphatic tone to suit audience and intent."

units:
  fr.c1.unit03.tone_et_registre:
    title: "Tone and register"
    description: "Exercise fine-grained control of tone and register: shift between formal, diplomatic, ironic, and emphatic styles for different audiences."

lessons:
  fr.c1.unit03.tone_et_registre.lesson01.registre_formel:
    title: "The formal register"
  fr.c1.unit03.tone_et_registre.lesson02.formulation_diplomatique:
    title: "Diplomatic phrasing"
  fr.c1.unit03.tone_et_registre.lesson03.ton_ironique:
    title: "The ironic tone"
  fr.c1.unit03.tone_et_registre.lesson04.ton_emphatique:
    title: "The emphatic tone"
  fr.c1.unit03.tone_et_registre.lesson05.changer_de_ton:
    title: "Shifting tone"
  fr.c1.unit03.tone_et_registre.lesson06.reecriture_complete:
    title: "The complete rewrite"

teaching:
  fr.c1.unit03.tone_et_registre.lesson01.teach.je_vous_prie_de:
    title: "I kindly ask you to"
    gloss: "I kindly ask you to"
    note: "*Je vous prie de* (I kindly ask you to) is a formal request formula, addressed with *vous* to a client."
  fr.c1.unit03.tone_et_registre.lesson01.teach.bien_vouloir_accepter:
    title: "to be so kind as to accept my apologies"
    gloss: "to be so kind as to accept my apologies"
    note: "*Bien vouloir accepter mes excuses* completes the formal request; *bien vouloir* (to be so kind as to) softens it."
  fr.c1.unit03.tone_et_registre.lesson01.teach.veuillez_m_excuser:
    title: "please excuse me"
    gloss: "please excuse me"
    note: "*Veuillez m'excuser* (please excuse me) is another formal apology, built on the imperative *veuillez*."
  fr.c1.unit03.tone_et_registre.lesson01.teach.sinceres_excuses:
    title: "I offer you my sincere apologies"
    gloss: "I offer you my sincere apologies"
    note: "*Je vous présente mes sincères excuses* (I offer you my sincere apologies) is a fuller formal formula."
  fr.c1.unit03.tone_et_registre.lesson01.teach.modele_formel:
    title: "A formal apology"
    gloss: "I kindly ask you to accept my apologies for this delay."
    note: "This is the formal model Inès addresses to the client Madame Durand with *vous*; *pour ce retard* names the reason."

  fr.c1.unit03.tone_et_registre.lesson02.teach.nous_regrettons:
    title: "we regret this inconvenience"
    gloss: "we regret this inconvenience"
    note: "*Nous regrettons ce désagrément* (we regret this inconvenience) softens bad news by naming regret rather than fault."
  fr.c1.unit03.tone_et_registre.lesson02.teach.je_me_permets:
    title: "I take the liberty of informing you"
    gloss: "I take the liberty of informing you"
    note: "*Je me permets de vous informer* (I take the liberty of informing you) is a diplomatic hedge before stating something."
  fr.c1.unit03.tone_et_registre.lesson02.teach.je_vous_propose:
    title: "I suggest that you"
    gloss: "I suggest that you"
    note: "*Je vous propose de* (I suggest that you) offers a solution rather than imposing one."
  fr.c1.unit03.tone_et_registre.lesson02.teach.il_semblerait:
    title: "it would seem that"
    gloss: "it would seem that"
    note: "*Il semblerait que* (it would seem that) hedges a claim diplomatically, leaving room for doubt."
  fr.c1.unit03.tone_et_registre.lesson02.teach.modele_diplomate:
    title: "A diplomatic offer"
    gloss: "I suggest delivering you a new cake as early as tomorrow."
    note: "This diplomatic sentence offers a remedy: *un nouveau gâteau* (a new cake) *dès demain* (as early as tomorrow)."

  fr.c1.unit03.tone_et_registre.lesson03.teach.quelle_merveilleuse_idee:
    title: "what a wonderful idea"
    gloss: "what a wonderful idea"
    note: "*Quelle merveilleuse idée* (what a wonderful idea) is ironic: said flatly, it means the opposite."
  fr.c1.unit03.tone_et_registre.lesson03.teach.encore_une_livraison:
    title: "yet another perfect delivery"
    gloss: "yet another perfect delivery"
    note: "*Encore une livraison parfaite* (yet another perfect delivery) is ironic when the delivery was actually bad."
  fr.c1.unit03.tone_et_registre.lesson03.teach.bravo_organisation:
    title: "well done for the organisation"
    gloss: "well done for the organisation"
    note: "*Bravo pour l'organisation* (well done for the organisation) is ironic praise for a failure."
  fr.c1.unit03.tone_et_registre.lesson03.teach.evidemment_ma_faute:
    title: "obviously, it's all my fault"
    gloss: "obviously, it's all my fault"
    note: "*Évidemment, tout est de ma faute* (obviously, it's all my fault) is ironic self-blame."
  fr.c1.unit03.tone_et_registre.lesson03.teach.modele_ironique:
    title: "An ironic remark"
    gloss: "Yet another perfect delivery, well done for the organisation!"
    note: "This ironic sentence praises a bad delivery; Inès says it to Mathieu, her friend, with *tu*."

  fr.c1.unit03.tone_et_registre.lesson04.teach.absolument_inadmissible:
    title: "it's absolutely unacceptable"
    gloss: "it's absolutely unacceptable"
    note: "*C'est absolument inadmissible* (it's absolutely unacceptable) uses *absolument* for emphasis."
  fr.c1.unit03.tone_et_registre.lesson04.teach.vraiment_furieuse:
    title: "I am really furious"
    gloss: "I am really furious"
    note: "*Je suis vraiment furieuse* (I am really furious) states anger emphatically with *vraiment*."
  fr.c1.unit03.tone_et_registre.lesson04.teach.franchement_incroyable:
    title: "frankly, it's unbelievable"
    gloss: "frankly, it's unbelievable"
    note: "*Franchement, c'est incroyable* (frankly, it's unbelievable) is emphatic; *franchement* adds force."
  fr.c1.unit03.tone_et_registre.lesson04.teach.quel_desastre:
    title: "what a disaster"
    gloss: "what a disaster"
    note: "*Quel désastre* (what a disaster) is an emphatic exclamation of dismay."
  fr.c1.unit03.tone_et_registre.lesson04.teach.modele_emphatique:
    title: "An emphatic reaction"
    gloss: "Frankly, it's unbelievable, I am really furious!"
    note: "This emphatic reaction to Mathieu piles up *franchement*, *incroyable* and *vraiment furieuse*."

  fr.c1.unit03.tone_et_registre.lesson05.teach.gateau_en_retard:
    title: "the cake arrived late"
    gloss: "the cake arrived late"
    note: "*Le gâteau est arrivé en retard* (the cake arrived late) is the blunt fact both versions restate."
  fr.c1.unit03.tone_et_registre.lesson05.teach.changer_de_ton:
    title: "to shift tone"
    gloss: "to shift tone"
    note: "*Changer de ton* (to shift tone) means re-saying the same content in a different register."
  fr.c1.unit03.tone_et_registre.lesson05.teach.selon_le_public:
    title: "depending on the audience"
    gloss: "depending on the audience"
    note: "*Selon le public* (depending on the audience) explains why the tone must change."
  fr.c1.unit03.tone_et_registre.lesson05.teach.modele_changer_ton:
    title: "Two tones, one message"
    gloss: "I kindly ask you to accept my apologies for this delay. Frankly, it's a disaster, the cake arrived late!"
    note: "The same core fact — a late cake — is said diplomatically to the client and emphatically to a friend."

  fr.c1.unit03.tone_et_registre.lesson06.teach.modele_complet:
    title: "The complete rewrite"
    gloss: "I kindly ask you to accept my apologies for this delay. Frankly, it's a disaster, the cake arrived late!"
    note: "This is the exact model for the final speaking and writing tasks: a diplomatic formal version, then an emphatic version, of the same message."
  fr.c1.unit03.tone_et_registre.lesson06.teach.le_registre:
    title: "the register"
    gloss: "the register"
    note: "*Le registre* (the register) names the level of formality chosen for an audience."
    example_gloss: "The register changes depending on the audience."

exercises:
  fr.c1.unit03.tone_et_registre.lesson01.exercise01.recognize_formel:
    instruction: "Which French phrase is a formal, polite request to a client?"
    correct_option: "je vous prie de"
    distractors: ["quel désastre", "bravo pour l'organisation", "c'est incroyable"]
    accepted_answers: [{value: "je vous prie de", status: correct}]
    feedback: "*Je vous prie de* is a formal polite request; the others are emphatic or ironic."
  fr.c1.unit03.tone_et_registre.lesson01.exercise02.listen_formel:
    instruction: "Listen and select what you hear."
    correct_option: "I kindly ask you to accept my apologies for this delay."
    distractors: ["I kindly ask you to accept my apologies for this cake.", "I ask you to delay my apologies for this cake.", "I kindly ask them to accept my apologies for this delay."]
    accepted_answers: [{value: "I kindly ask you to accept my apologies for this delay.", status: correct}]
    feedback: "Je vous prie de bien vouloir accepter mes excuses pour ce retard means I kindly ask you to accept my apologies for this delay."
  fr.c1.unit03.tone_et_registre.lesson01.exercise03.match_formel:
    instruction: "Match each French formal phrase to its English meaning."
    accepted_answers:
      - value: {"je vous prie de": "I kindly ask you to", "bien vouloir": "to be so kind as to", "accepter mes excuses": "to accept my apologies", "veuillez m'excuser": "please excuse me", "mes sincères excuses": "my sincere apologies", "pour ce retard": "for this delay"}
        status: correct
    feedback: "These phrases build the formal apology Inès addresses to the client."
  fr.c1.unit03.tone_et_registre.lesson01.exercise04.order_formel:
    instruction: "Put the French words in order to form the formal request."
    accepted_answers:
      - {value: "je vous prie de bien vouloir", status: correct}
    feedback: "The formal request is je vous prie de bien vouloir — I kindly ask you to be so kind as to."
  fr.c1.unit03.tone_et_registre.lesson01.exercise05.write_formel:
    instruction: "Write the exact formal apology to the client: Je vous prie de bien vouloir accepter mes excuses pour ce retard."
    accepted_answers:
      - {value: "Je vous prie de bien vouloir accepter mes excuses pour ce retard.", status: correct}
      - {value: "Je vous prie de bien vouloir accepter mes excuses pour ce retard", status: correct}
    feedback: "Je vous prie de bien vouloir accepter mes excuses pour ce retard."

  fr.c1.unit03.tone_et_registre.lesson02.exercise01.recognize_diplomate:
    instruction: "Which French phrase softens bad news with a diplomatic apology?"
    correct_option: "nous regrettons ce désagrément"
    distractors: ["je suis vraiment furieuse", "quelle merveilleuse idée", "quel désastre"]
    accepted_answers: [{value: "nous regrettons ce désagrément", status: correct}]
    feedback: "*Nous regrettons ce désagrément* softens bad news; the others are emphatic or ironic."
  fr.c1.unit03.tone_et_registre.lesson02.exercise02.listen_diplomate:
    instruction: "Listen and select what you hear."
    correct_option: "I suggest delivering you a new cake as early as tomorrow."
    distractors: ["I suggest you deliver the new cake late tomorrow.", "I suggest delivering you an old cake as early as tomorrow.", "I regret delivering you a new cake as early as tomorrow."]
    accepted_answers: [{value: "I suggest delivering you a new cake as early as tomorrow.", status: correct}]
    feedback: "Je vous propose de vous livrer un nouveau gâteau dès demain means I suggest delivering you a new cake as early as tomorrow."
  fr.c1.unit03.tone_et_registre.lesson02.exercise03.match_diplomate:
    instruction: "Match each French diplomatic phrase to its English meaning."
    accepted_answers:
      - value: {"nous regrettons ce désagrément": "we regret this inconvenience", "je me permets de vous informer": "I take the liberty of informing you", "je vous propose de": "I suggest that you", "il semblerait que": "it would seem that", "un nouveau gâteau": "a new cake", "dès demain": "as early as tomorrow"}
        status: correct
    feedback: "These phrases soften bad news and offer a remedy diplomatically."
  fr.c1.unit03.tone_et_registre.lesson02.exercise04.order_diplomate:
    instruction: "Put the French words in order to form the diplomatic apology."
    accepted_answers:
      - {value: "nous regrettons ce désagrément", status: correct}
    feedback: "The diplomatic apology is nous regrettons ce désagrément — we regret this inconvenience."
  fr.c1.unit03.tone_et_registre.lesson02.exercise05.translate_diplomate:
    instruction: "Translate into French: We regret this inconvenience."
    accepted_answers:
      - {value: "Nous regrettons ce désagrément.", status: correct}
      - {value: "Nous regrettons ce désagrément", status: correct}
    feedback: "Nous regrettons ce désagrément."

  fr.c1.unit03.tone_et_registre.lesson03.exercise01.recognize_ironique:
    instruction: "Which French phrase is ironic — it says the opposite of what it means?"
    correct_option: "quelle merveilleuse idée"
    distractors: ["je vous prie de", "nous regrettons ce désagrément", "je suis vraiment furieuse"]
    accepted_answers: [{value: "quelle merveilleuse idée", status: correct}]
    feedback: "*Quelle merveilleuse idée* is ironic praise; the others are formal, diplomatic, or emphatic."
  fr.c1.unit03.tone_et_registre.lesson03.exercise02.listen_ironique:
    instruction: "Listen and select what you hear."
    correct_option: "Yet another perfect delivery, well done for the organisation!"
    distractors: ["Yet another poor delivery, well done for the organisation!", "A perfect delivery, badly done for the organisation.", "Yet another perfect delivery, well done for the decoration."]
    accepted_answers: [{value: "Yet another perfect delivery, well done for the organisation!", status: correct}]
    feedback: "Encore une livraison parfaite, bravo pour l'organisation ! means yet another perfect delivery, well done for the organisation!"
  fr.c1.unit03.tone_et_registre.lesson03.exercise03.match_ironique:
    instruction: "Match each French ironic phrase to its English meaning."
    accepted_answers:
      - value: {"quelle merveilleuse idée": "what a wonderful idea", "encore une livraison parfaite": "yet another perfect delivery", "bravo pour l'organisation": "well done for the organisation", "évidemment": "obviously", "tout est de ma faute": "it's all my fault", "l'organisation": "the organisation"}
        status: correct
    feedback: "These phrases praise ironically what actually went wrong."
  fr.c1.unit03.tone_et_registre.lesson03.exercise04.order_ironique:
    instruction: "Put the French words in order to form the ironic remark."
    accepted_answers:
      - {value: "quelle merveilleuse idée", status: correct}
    feedback: "The ironic remark is quelle merveilleuse idée — what a wonderful idea."
  fr.c1.unit03.tone_et_registre.lesson03.exercise05.speak_ironique:
    instruction: "Say aloud the exact ironic sentence to Mathieu: Encore une livraison parfaite, bravo pour l'organisation !"
    accepted_answers:
      - {value: "Encore une livraison parfaite, bravo pour l'organisation !", status: correct}
      - {value: "Encore une livraison parfaite, bravo pour l'organisation", status: correct}
    feedback: "Encore une livraison parfaite, bravo pour l'organisation !"

  fr.c1.unit03.tone_et_registre.lesson04.exercise01.recognize_emphatique:
    instruction: "Which French phrase expresses strong emphasis and anger?"
    correct_option: "c'est absolument inadmissible"
    distractors: ["il semblerait que", "je vous propose de", "quelle merveilleuse idée"]
    accepted_answers: [{value: "c'est absolument inadmissible", status: correct}]
    feedback: "*C'est absolument inadmissible* is emphatic anger; the others are diplomatic or ironic."
  fr.c1.unit03.tone_et_registre.lesson04.exercise02.listen_emphatique:
    instruction: "Listen and select what you hear."
    correct_option: "Frankly, it's unbelievable, I am really furious!"
    distractors: ["Frankly, it's believable, I am really calm.", "Frankly, it's unbelievable, I am really pleased.", "Finally, it's unbelievable, I am really furious!"]
    accepted_answers: [{value: "Frankly, it's unbelievable, I am really furious!", status: correct}]
    feedback: "Franchement, c'est incroyable, je suis vraiment furieuse ! means frankly, it's unbelievable, I am really furious!"
  fr.c1.unit03.tone_et_registre.lesson04.exercise03.match_emphatique:
    instruction: "Match each French emphatic phrase to its English meaning."
    accepted_answers:
      - value: {"c'est absolument inadmissible": "it's absolutely unacceptable", "je suis vraiment furieuse": "I am really furious", "franchement": "frankly", "c'est incroyable": "it's unbelievable", "quel désastre": "what a disaster", "inadmissible": "unacceptable"}
        status: correct
    feedback: "These phrases pile on emphasis to express anger strongly."
  fr.c1.unit03.tone_et_registre.lesson04.exercise04.order_emphatique:
    instruction: "Put the French words in order to form the emphatic statement."
    accepted_answers:
      - {value: "je suis vraiment furieuse", status: correct}
    feedback: "The emphatic statement is je suis vraiment furieuse — I am really furious."
  fr.c1.unit03.tone_et_registre.lesson04.exercise05.write_emphatique:
    instruction: "Write the exact emphatic reaction to Mathieu: Franchement, c'est incroyable, je suis vraiment furieuse !"
    accepted_answers:
      - {value: "Franchement, c'est incroyable, je suis vraiment furieuse !", status: correct}
      - {value: "Franchement, c'est incroyable, je suis vraiment furieuse", status: correct}
    feedback: "Franchement, c'est incroyable, je suis vraiment furieuse !"

  fr.c1.unit03.tone_et_registre.lesson05.exercise01.read_changer_ton:
    instruction: "In the passage, which sentence is the diplomatic, formal apology addressed to the client?"
    correct_option: "I kindly ask you to accept my apologies for this delay."
    distractors: ["Frankly, it's a disaster, the cake arrived late.", "The cake arrived late.", "Well done for the organisation."]
    accepted_answers: [{value: "I kindly ask you to accept my apologies for this delay.", status: correct}]
    feedback: "Je vous prie de bien vouloir accepter mes excuses pour ce retard is the diplomatic formal apology; the second sentence is the emphatic reaction for a friend."
  fr.c1.unit03.tone_et_registre.lesson05.exercise02.match_changer_ton:
    instruction: "Match each French element to its role in shifting tone."
    accepted_answers:
      - value: {"je vous prie de bien vouloir accepter mes excuses": "diplomatic formal apology", "le gâteau est arrivé en retard": "the blunt fact", "c'est un désastre": "emphatic reaction", "changer de ton": "to shift tone", "selon le public": "depending on the audience", "le ton": "the tone"}
        status: correct
    feedback: "Shifting tone means re-saying the same fact in a register that fits each audience."
  fr.c1.unit03.tone_et_registre.lesson05.exercise03.speak_changer_ton:
    instruction: "Say aloud the exact emphatic reaction to Mathieu: Franchement, c'est un désastre, le gâteau est arrivé en retard !"
    accepted_answers:
      - {value: "Franchement, c'est un désastre, le gâteau est arrivé en retard !", status: correct}
      - {value: "Franchement, c'est un désastre, le gâteau est arrivé en retard", status: correct}
    feedback: "Franchement, c'est un désastre, le gâteau est arrivé en retard !"

  fr.c1.unit03.tone_et_registre.lesson06.exercise01.read_reecriture:
    instruction: "In the passage, which sentence is the emphatic reaction Inès says to Mathieu?"
    correct_option: "Frankly, it's a disaster, the cake arrived late."
    distractors: ["I kindly ask you to accept my apologies for this delay.", "I suggest delivering you a new cake as early as tomorrow.", "Yet another perfect delivery, well done for the organisation!"]
    accepted_answers: [{value: "Frankly, it's a disaster, the cake arrived late.", status: correct}]
    feedback: "Franchement, c'est un désastre, le gâteau est arrivé en retard is the emphatic reaction Inès shares with Mathieu, her friend."
  fr.c1.unit03.tone_et_registre.lesson06.exercise02.match_reecriture:
    instruction: "Match each element of the complete rewrite to its role."
    accepted_answers:
      - value: {"je vous prie de bien vouloir accepter mes excuses pour ce retard": "diplomatic formal apology", "franchement, c'est un désastre, le gâteau est arrivé en retard": "emphatic reaction", "le registre": "the register", "selon le public": "depending on the audience", "changer de ton": "to shift tone", "le ton": "the tone"}
        status: correct
    feedback: "The complete rewrite pairs a diplomatic formal version with an emphatic version of the same message."
