answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A2 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or liaison marks.
course:
  title: French A2
  description: Intermediate French continuing the Camille and Mathieu storyline, now with a grammar-led block on everyday functions.
  learning_goal: Give and respond to simple advice with devoir in the conditional, il vaut mieux and the imperative.
units:
  fr.a2.unit90.tu_devrais:
    title: You should sleep more
    description: Give and answer simple advice about health and daily life with tu devrais, il vaut mieux and the imperative.
lessons:
  fr.a2.unit90.lesson01.tu_devrais:
    title: You should sleep more
  fr.a2.unit90.lesson02.il_vaut_mieux:
    title: It is better to stay
  fr.a2.unit90.lesson03.imperatif:
    title: Drink some water!
  fr.a2.unit90.lesson04.bonne_idee:
    title: Good idea!
  fr.a2.unit90.lesson05.reponse_de_camille:
    title: Camille's reply
  fr.a2.unit90.lesson06.conseils_entre_amis:
    title: Camille advises Mathieu
teaching:
  fr.a2.unit90.lesson01.teach.verbes:
    title: Healthy habits
    gloss: to sleep / to drink / to eat / more / less / water
    example_gloss:
    - You should sleep more.
    - He should drink water.
    - You should eat less.
  fr.a2.unit90.lesson01.teach.gn_devrais:
    title: Devoir for advice
    gloss: I should, you should, he should, we should, you should, they should
    note: '*Devrais* is the polite form of *devoir*. It gives advice and is softer than *tu dois*, which is an order. Learn the forms as they are.'
  fr.a2.unit90.lesson01.teach.gn_conseil:
    title: Giving advice
    gloss: You should sleep more. You should drink water.
    note: '*Tu devrais* is for a friend and *vous devriez* for a stranger or a group. The next verb is an infinitive.'
  fr.a2.unit90.lesson01.teach.gn_neg:
    title: Advising against
    gloss: You should not drink too much coffee.
    note: '*Ne ... pas* wraps around *devrais*. *Trop de* plus a noun means ''too much''.'
  fr.a2.unit90.lesson01.teach.phrase:
    title: A piece of advice
    gloss: You should sleep more.
  fr.a2.unit90.lesson02.teach.mots:
    title: Useful words
    gloss: to stay / to go out / the doctor / the evening / the house, home
    example_gloss:
    - It is better to stay at home.
    - I do not go out in the evening.
    - It is better to ask the doctor.
  fr.a2.unit90.lesson02.teach.gn_vautmieux:
    title: Il vaut mieux
    gloss: It is better to stay at home. It is better to ask the doctor.
    note: '*Il vaut mieux* plus an infinitive gives general advice without naming who. *Il* never changes.'
  fr.a2.unit90.lesson02.teach.gn_nepas:
    title: Il vaut mieux ne pas
    gloss: It is better not to go out in the evening.
    note: 'To advise against something, put *ne pas* together before the infinitive: *il vaut mieux ne pas sortir*.'
  fr.a2.unit90.lesson02.teach.gn_compare:
    title: Three ways to advise
    gloss: You should stay. It is better to stay. You have to stay.
    note: '*Tu devrais* is personal advice, *il vaut mieux* is general advice, *il faut* is a rule.'
  fr.a2.unit90.lesson02.teach.phrase:
    title: General advice
    gloss: It is better to stay at home.
  fr.a2.unit90.lesson03.teach.mots:
    title: Short advice verbs
    gloss: to walk / to go / a little / tomorrow
    example_gloss:
    - Walk a little!
    - Go to the doctor!
    - Sleep more!
    - Drink some water!
    - Sleep more and walk a little!
  fr.a2.unit90.lesson03.teach.gn_tu:
    title: Imperative with tu
    gloss: Eat less. Walk a little. Sleep more. Drink some water. Go to the doctor.
    note: 'The tu imperative is the tu present form without the pronoun. For *-er* verbs the final *-s* drops: *tu manges* becomes *mange*. *Aller* gives *va*.'
  fr.a2.unit90.lesson03.teach.gn_vous:
    title: Imperative with vous
    gloss: Eat less. Walk a little. Sleep more. Drink some water.
    note: 'The vous imperative is the vous present form without the pronoun: *vous dormez* becomes *dormez*.'
  fr.a2.unit90.lesson03.teach.gn_negatif:
    title: Negative imperative
    gloss: Don't drink too much coffee. Don't eat too much.
    note: For a negative command, *ne ... pas* wraps around the imperative verb.
  fr.a2.unit90.lesson03.teach.phrase:
    title: A command
    gloss: Drink some water!
  fr.a2.unit90.lesson04.teach.mots:
    title: Talking about advice
    gloss: the advice / the idea / the opinion / the reason / difficult
    example_gloss:
    - Some advice, please.
    - Good idea!
    - In your opinion?
    - You are right.
  fr.a2.unit90.lesson04.teach.gn_demander:
    title: Asking for advice
    gloss: What should I do? In your opinion, what should I do?
    note: Ask for advice with *qu'est-ce que je devrais faire ?* or add *à ton avis*.
  fr.a2.unit90.lesson04.teach.gn_accepter:
    title: Agreeing
    gloss: Good idea! You are right.
    note: '*Bonne idée* and *tu as raison* show that you accept the advice. *Avoir raison* is a fixed expression with *avoir*.'
  fr.a2.unit90.lesson04.teach.gn_hesiter:
    title: Hesitating
    gloss: It is difficult, but I am going to do it.
    note: 'When advice is hard to follow, use *mais* to say you will still do it: *je vais le faire*.'
  fr.a2.unit90.lesson04.teach.phrase:
    title: Accepting advice
    gloss: You are right.
  fr.a2.unit90.lesson05.teach.mots:
    title: Words for the message
    gloss: very / badly / this week / early / work
    example_gloss:
    - This week, I am very tired.
    - I sleep badly.
    - I work early.
  fr.a2.unit90.lesson05.teach.gn_probleme:
    title: Describing the problem
    gloss: I sleep badly and I drink too much coffee.
    note: '*Mal* means ''badly''. A short problem statement helps someone give targeted advice.'
  fr.a2.unit90.lesson05.teach.gn_mix:
    title: Mixing advice forms
    gloss: You should sleep more. It is better not to work in the evening. Drink some water.
    note: A good reply mixes personal advice (*tu devrais*), general advice (*il vaut mieux*) and a direct tip (imperative).
  fr.a2.unit90.lesson05.teach.reading:
    title: Camille replies to Mathieu
    gloss: Hi Mathieu! This week you are very tired. You should sleep more and drink less coffee. It is better not to work in the evening. Drink some water and walk a little. And tomorrow, go to the doctor! Have a good week! Camille
    note: The reply uses all three advice forms from the unit.
    glosses:
      fatigué: tired
      médecin: doctor
  fr.a2.unit90.lesson06.teach.q1:
    title: Mathieu asks
    gloss: 'Mathieu: Camille, I am very tired. What should I do?'
  fr.a2.unit90.lesson06.teach.a1:
    title: Camille advises
    gloss: 'Camille: You should sleep more. It is better not to drink coffee in the evening.'
  fr.a2.unit90.lesson06.teach.q2:
    title: Mathieu agrees
    gloss: 'Mathieu: You are right. But it is difficult, I work a lot.'
  fr.a2.unit90.lesson06.teach.a2:
    title: Camille insists
    gloss: 'Camille: Then go to the doctor and ask for advice.'
  fr.a2.unit90.lesson06.teach.q3:
    title: Mathieu decides
    gloss: 'Mathieu: Good idea! I am going to do it tomorrow.'
  fr.a2.unit90.lesson06.teach.a3:
    title: Camille encourages
    gloss: 'Camille: Well done! Rest well.'
