  fr.a2.unit95.lesson05.message:
    title: Mathieu's message
  fr.a2.unit95.lesson06.dialogue:
    title: Camille and Mathieu talk on the phone
teaching:
  fr.a2.unit95.lesson01.teach.mots:
    title: Asking and giving a reason
    gloss: why / because / ill / late / the bus / the house
    example_gloss:
    - Why are you late?
    - Because the bus is late.
    - I am staying at home because I am ill.
    - Why are you staying at home?
  fr.a2.unit95.lesson01.teach.gn_pourquoi:
    title: Pourquoi and parce que
    gloss: Why are you late? Because I am ill.
    note: '*Pourquoi* asks for a reason. The answer starts with *parce que* and a full clause.'
  fr.a2.unit95.lesson01.teach.gn_parce_que:
    title: Reason after the main clause
    gloss: I am staying at home because I am ill.
    note: '*Parce que* joins the reason to the main clause. It is followed by a subject and a verb, never by a noun alone.'
  fr.a2.unit95.lesson01.teach.gn_ordre:
    title: Reason first
    gloss: Because I am ill, I am staying at home.
    note: The *parce que* clause can also come first. Then a comma separates it from the main clause.
  fr.a2.unit95.lesson01.teach.phrase:
    title: A reason
    gloss: Because I am ill.
  fr.a2.unit95.lesson02.teach.mots:
    title: Words for the result
    gloss: so, therefore / so, then / tired / early / late / it is raining
    example_gloss:
    - I am tired, so I sleep.
    - It is raining, so I stay at home.
    - The train is late, so I arrive late.
  fr.a2.unit95.lesson02.teach.gn_donc:
    title: Donc for the result
    gloss: The bus is late, so I arrive late.
    note: First the reason, then a comma, then *donc* and the result.
  fr.a2.unit95.lesson02.teach.gn_alors:
    title: Alors in speech
    gloss: It is raining, so I stay at home.
    note: In speech *alors* often does the same job as *donc*. Both come after the comma.
  fr.a2.unit95.lesson02.teach.gn_ordre:
    title: Two orders, one idea
    gloss: I am ill, so I stay at home. I stay at home because I am ill.
    note: With *donc* the reason comes first. With *parce que* the result can come first. The meaning is the same.
  fr.a2.unit95.lesson02.teach.phrase:
    title: A result
    gloss: I am tired, so I sleep.
  fr.a2.unit95.lesson03.teach.mots:
    title: Feelings and reasons
    gloss: happy (masc.) / sad / alone / because (formal) / on holiday
    example_gloss:
    - Camille is happy because she is on holiday.
    - Mathieu is sad because he is ill.
    - He is staying alone because he is tired.
  fr.a2.unit95.lesson03.teach.gn_elision:
    title: 'Elision: parce qu'''
    gloss: Mathieu stays because he is ill. Camille leaves because she is tired.
    note: Before *il*, *elle*, *on* and *ils*, *parce que* becomes *parce qu'*. Before *je* and *tu* it stays *parce que*.
  fr.a2.unit95.lesson03.teach.gn_car:
    title: Car
    gloss: He is staying at home, because he is ill.
    note: '*Car* also means ''because''. It sounds more written and always comes after a comma, never at the start of the sentence.'
  fr.a2.unit95.lesson03.teach.gn_accord:
    title: Agreement of the feeling
    gloss: Camille is happy. Mathieu is happy. She is happy.
    note: 'An adjective like *content* takes -e for a woman: *contente*. *Triste* already ends in -e and stays the same; *seul* becomes *seule*.'
  fr.a2.unit95.lesson03.teach.phrase:
    title: A feeling and its reason
    gloss: He is sad because he is alone.
  fr.a2.unit95.lesson04.teach.mots:
    title: Making an excuse
    gloss: sorry (masc.) / the meeting / absent / not / to come
    example_gloss:
    - I am sorry, I am late.
    - I am not coming to the meeting because I am ill.
    - He is absent because he is ill.
  fr.a2.unit95.lesson04.teach.gn_excuse:
    title: Apology plus reason
    gloss: I am sorry, I am late because the bus is late.
    note: A short apology often comes first, then the reason. A woman says *désolée*.
  fr.a2.unit95.lesson04.teach.gn_negation:
    title: Negative plus reason
    gloss: I am not coming to the meeting because I am ill.
    note: '*Ne ... pas* wraps around the verb. *Parce que* and the reason come after it.'
  fr.a2.unit95.lesson04.teach.gn_deux:
    title: Reason and result together
    gloss: I am ill, so I am not coming to the meeting.
    note: 'One message can give both: the reason, then *donc* and the result.'
  fr.a2.unit95.lesson04.teach.phrase:
    title: An apology
    gloss: I am sorry, I am late.
  fr.a2.unit95.lesson05.teach.mots:
    title: Words for the message
    gloss: the party / this evening / the rain / to be cold / under
    example_gloss:
    - I am not coming to the party this evening.
    - I waited for the bus in the rain.
    - I am cold, so I stay at home.
  fr.a2.unit95.lesson05.teach.gn_passe:
    title: A reason in the past
    gloss: Yesterday I waited for the bus in the rain, so I am cold.
    note: The reason can be in the passé composé while the result is in the present.
  fr.a2.unit95.lesson05.teach.gn_combine:
    title: Two links in one message
    gloss: I am ill because I waited in the rain. I am cold, so I stay at home.
    note: A short message can chain *parce que* and *donc* to explain a cancelled plan.
  fr.a2.unit95.lesson05.teach.reading:
    title: Mathieu writes to Camille
    gloss: Hi Camille! I am sorry, I am not coming to the party this evening. I am ill because I waited for the bus in the rain. I am cold, so I stay at home. I am sad, because I like the party. Mathieu
    note: A reason and a result appear together in one short excuse.
    glosses:
      fête: party
      pluie: rain
  fr.a2.unit95.lesson06.teach.q1:
    title: Camille asks why
    gloss: 'Camille: Mathieu, why are you not at the party?'
  fr.a2.unit95.lesson06.teach.a1:
    title: Mathieu explains
    gloss: 'Mathieu: I am ill, so I am staying at home.'
  fr.a2.unit95.lesson06.teach.q2:
    title: Camille asks again
    gloss: 'Camille: Oh no! Why are you ill?'
  fr.a2.unit95.lesson06.teach.a2:
    title: Mathieu gives the cause
    gloss: 'Mathieu: Because I waited for the bus in the rain.'
  fr.a2.unit95.lesson06.teach.q3:
    title: Camille offers help
    gloss: 'Camille: Poor Mathieu! I am coming tomorrow with a soup, because you are alone.'
  fr.a2.unit95.lesson06.teach.a3:
    title: Mathieu thanks her
    gloss: 'Mathieu: Thank you, Camille! I am happy because you are coming.'
