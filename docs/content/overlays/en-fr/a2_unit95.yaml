answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A2 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or liaison marks.
course:
  title: French A2
  description: Intermediate French continuing the Camille and Mathieu storyline, now with a grammar-led block on everyday functions.
  learning_goal: Give a reason and a consequence in one message with pourquoi, parce que, donc and alors.
units:
  fr.a2.unit95.parce_que_donc:
    title: Because, so
    description: Give a reason with parce que and a consequence with donc or alors, for example when you explain an excuse or a change of plan.
lessons:
  fr.a2.unit95.lesson01.pourquoi:
    title: Why? Because
  fr.a2.unit95.lesson02.donc_alors:
