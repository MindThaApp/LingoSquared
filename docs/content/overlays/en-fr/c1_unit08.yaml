    accepted_answers: [{value: "It is we who can act, and it is now that it must be done.", status: correct}]
    feedback: "C'est nous qui pouvons agir, et c'est maintenant qu'il faut le faire means it is we who can act, and it is now that it must be done."
  fr.c1.unit08.persuasion_retorique.lesson03.exercise03.match_emphase:
    instruction: "Match each French emphasis phrase to its English meaning."
    accepted_answers:
      - value: {"c'est nous qui": "it is we who", "pouvons agir": "we can act", "c'est maintenant qu'il faut": "it is now that it is necessary", "le faire": "to do it", "la mise en relief": "emphasis / highlighting", "agir": "to act"}
        status: correct
    feedback: "These phrases build the *mise en relief* that stresses the actor and the moment."
  fr.c1.unit08.persuasion_retorique.lesson03.exercise04.order_emphase:
    instruction: "Put the French words in order to form the emphasis."
    accepted_answers:
      - {value: "c'est nous qui pouvons agir", status: correct}
    feedback: "The emphasis is c'est nous qui pouvons agir — it is we who can act."
  fr.c1.unit08.persuasion_retorique.lesson03.exercise05.speak_emphase:
    instruction: "Say aloud the exact taught emphasis construction."
    accepted_answers:
      - {value: "C'est nous qui pouvons agir, et c'est maintenant qu'il faut le faire.", status: correct}
      - {value: "C'est nous qui pouvons agir, et c'est maintenant qu'il faut le faire", status: correct}
    feedback: "C'est nous qui pouvons agir, et c'est maintenant qu'il faut le faire."

  fr.c1.unit08.persuasion_retorique.lesson04.exercise01.recognize_appel:
    instruction: "Which French appeal speaks to the audience's emotions?"
    correct_option: "l'appel à l'émotion"
    distractors: ["l'appel à la logique", "l'appel aux valeurs", "l'appel au public"]
    accepted_answers: [{value: "l'appel à l'émotion", status: correct}]
    feedback: "*L'appel à l'émotion* is the appeal to emotion; *l'appel à la logique* appeals to reason."
  fr.c1.unit08.persuasion_retorique.lesson04.exercise02.listen_appel:
    instruction: "Listen and select what you hear."
    correct_option: "Our trade has meaning, and we can help others."
    distractors: ["Our trade has no meaning, and we can help others.", "Our trade has meaning, and we cannot help others.", "Our trade has meaning, and you can help others."]
    accepted_answers: [{value: "Our trade has meaning, and we can help others.", status: correct}]
    feedback: "Notre métier a du sens, et nous pouvons aider les autres means our trade has meaning, and we can help others."
  fr.c1.unit08.persuasion_retorique.lesson04.exercise03.match_appel:
    instruction: "Match each French appeal phrase to its English meaning."
    accepted_answers:
      - value: {"l'appel à la logique": "the appeal to logic", "l'appel à l'émotion": "the appeal to emotion", "l'appel aux valeurs": "the appeal to values", "notre métier a du sens": "our trade has meaning", "aider les autres": "to help others", "l'émotion": "emotion"}
        status: correct
    feedback: "These phrases build the appeal to values that justifies the project."
  fr.c1.unit08.persuasion_retorique.lesson04.exercise04.order_appel:
    instruction: "Put the French words in order to form the appeal."
    accepted_answers:
      - {value: "nous pouvons aider les autres", status: correct}
    feedback: "The appeal is nous pouvons aider les autres — we can help others."
  fr.c1.unit08.persuasion_retorique.lesson04.exercise05.translate_appel:
    instruction: "Translate into French: Our trade has meaning, and we can help others."
    accepted_answers:
      - {value: "Notre métier a du sens, et nous pouvons aider les autres.", status: correct}
      - {value: "Notre métier a du sens, et nous pouvons aider les autres", status: correct}
    feedback: "Notre métier a du sens, et nous pouvons aider les autres."

  fr.c1.unit08.persuasion_retorique.lesson05.exercise01.recognize_intensite:
    instruction: "Which French phrase intensifies a necessity — 'we absolutely must'?"
    correct_option: "il faut absolument"
    distractors: ["il ne suffit pas", "il ne faut pas", "il faudrait"]
    accepted_answers: [{value: "il faut absolument", status: correct}]
    feedback: "*Il faut absolument* intensifies the necessity with *absolument* (absolutely)."
  fr.c1.unit08.persuasion_retorique.lesson05.exercise02.listen_intensite:
    instruction: "Listen and select what you hear."
    correct_option: "It is not enough to talk about it. We absolutely must act now."
