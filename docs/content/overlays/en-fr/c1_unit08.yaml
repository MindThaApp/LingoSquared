    correct_option: "rester indifférent"
    distractors: ["rester différent", "rester intéressé", "devenir indifférent"]
    accepted_answers: [{value: "rester indifférent", status: correct}]
    feedback: "*Rester indifférent* means to remain indifferent."
  fr.c1.unit08.persuasion_retorique.lesson01.exercise02.listen_question:
    instruction: "Listen and select what you hear."
    correct_option: "Can you really remain indifferent to the waste?"
    distractors: ["Can you really remain indifferent to the pastry?", "Can you really remain different to the waste?", "Should you really remain indifferent to the waste?"]
    accepted_answers: [{value: "Can you really remain indifferent to the waste?", status: correct}]
    feedback: "Peux-tu vraiment rester indifférent au gaspillage means can you really remain indifferent to the waste."
  fr.c1.unit08.persuasion_retorique.lesson01.exercise03.match_question:
    instruction: "Match each French rhetorical-question phrase to its English meaning."
    accepted_answers:
      - value: {"peux-tu vraiment": "can you really", "rester indifférent": "to remain indifferent", "au gaspillage": "to the waste", "la question rhétorique": "the rhetorical question", "indifférent": "indifferent", "gaspillage": "waste"}
        status: correct
    feedback: "These phrases build the rhetorical question that opens the appeal."
  fr.c1.unit08.persuasion_retorique.lesson01.exercise04.order_question:
    instruction: "Put the French words in order to form the phrase."
    accepted_answers:
      - {value: "rester indifférent au gaspillage", status: correct}
    feedback: "The phrase is rester indifférent au gaspillage — to remain indifferent to the waste."
  fr.c1.unit08.persuasion_retorique.lesson01.exercise05.write_question:
    instruction: "Write in French the taught rhetorical question (tu, inversion): Can you really stay indifferent to waste?"
    accepted_answers:
      - {value: "Peux-tu vraiment rester indifférent au gaspillage ?", status: correct}
      - {value: "Peux-tu vraiment rester indifférent au gaspillage", status: correct}
    feedback: "Peux-tu vraiment rester indifférent au gaspillage ?"
  fr.c1.unit08.persuasion_retorique.lesson01.exercise06.dictation_question:
    instruction: "Type exactly what you hear."
    correct_response: "Peux-tu vraiment rester indifférent au gaspillage ?"
    orthography_strict: true
    feedback: "Peux-tu vraiment rester indifférent au gaspillage ?"

  fr.c1.unit08.persuasion_retorique.lesson02.exercise01.recognize_parallelisme:
    instruction: "Which French phrase means 'every day'?"
    correct_option: "chaque jour"
    distractors: ["chaque soir", "chaque mois", "chaque année"]
    accepted_answers: [{value: "chaque jour", status: correct}]
    feedback: "*Chaque jour* means every day; *chaque soir* means every evening."
  fr.c1.unit08.persuasion_retorique.lesson02.exercise02.listen_parallelisme:
    instruction: "Listen and select what you hear."
    correct_option: "Every day, we throw away pastries that are still good. Every evening, families are hungry."
    distractors: ["Every day, we buy pastries that are still good. Every evening, families are hungry.", "Every day, we throw away pastries that are too old. Every evening, families are hungry.", "Every evening, we throw away pastries that are still good. Every morning, families are hungry."]
    accepted_answers: [{value: "Every day, we throw away pastries that are still good. Every evening, families are hungry.", status: correct}]
