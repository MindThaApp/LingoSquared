  notes: >-
    Overlay for French C1 unit 08 on persuasion through rhetorical devices.
    English-speaker interference risks: reading a rhetorical question as a real
    information question, and writing an open production prompt that a learner
    could answer with several different rhetorical forms. The production
    exercises therefore name exact taught models and accept those strings.
    No sibling-direction overlay was consulted.

course:
  title: French C1
  description: "Advanced French persuasion: rhetorical questions, parallelism, emphasis, appeals, and modulating intensity to move an audience."

units:
  fr.c1.unit08.persuasion_retorique:
    title: "Persuading with rhetoric"
    description: "Persuade an audience with rhetorical questions, parallelism, emphasis, and appeals, modulating intensity to move the listener."

lessons:
  fr.c1.unit08.persuasion_retorique.lesson01.question_rhetorique:
    title: "The rhetorical question"
  fr.c1.unit08.persuasion_retorique.lesson02.parallelisme:
    title: "Parallelism"
  fr.c1.unit08.persuasion_retorique.lesson03.mise_en_relief:
    title: "Emphasis (mise en relief)"
  fr.c1.unit08.persuasion_retorique.lesson04.les_appels:
    title: "The appeals"
  fr.c1.unit08.persuasion_retorique.lesson05.moduler_intensite:
    title: "Modulating intensity"
  fr.c1.unit08.persuasion_retorique.lesson06.appel_complet:
    title: "The complete persuasive appeal"

teaching:
  fr.c1.unit08.persuasion_retorique.lesson01.teach.peux_tu_vraiment:
    title: "can you really"
    gloss: "can you really"
    note: "*Peux-tu vraiment* (can you really) opens a rhetorical question addressed to one person with informal *tu*."
  fr.c1.unit08.persuasion_retorique.lesson01.teach.rester_indifferent:
    title: "to remain indifferent"
    gloss: "to remain indifferent"
    note: "*Rester indifférent* (to remain indifferent) is the state the question challenges."
  fr.c1.unit08.persuasion_retorique.lesson01.teach.au_gaspillage:
    title: "to the waste"
    gloss: "to the waste"
    note: "*Au gaspillage* (to the waste) names what one would be indifferent to."
  fr.c1.unit08.persuasion_retorique.lesson01.teach.question_rhetorique:
    title: "the rhetorical question"
    gloss: "the rhetorical question"
    note: "*La question rhétorique* is a question asked for effect that expects no answer."
    example_gloss: "Inès's rhetorical question expects no answer."
  fr.c1.unit08.persuasion_retorique.lesson01.teach.modele_question:
    title: "A rhetorical question"
    gloss: "Can you really remain indifferent to the waste?"
    note: "This question expects no answer — it invites reflection, not a reply."

  fr.c1.unit08.persuasion_retorique.lesson02.teach.chaque_jour:
    title: "every day"
    gloss: "every day"
    note: "*Chaque jour* (every day) is the first half of a repeated parallel structure."
  fr.c1.unit08.persuasion_retorique.lesson02.teach.nous_jetons:
    title: "we throw away pastries"
    gloss: "we throw away pastries"
    note: "*Nous jetons des pâtisseries* (we throw away pastries) states the daily waste."
  fr.c1.unit08.persuasion_retorique.lesson02.teach.encore_bonnes:
    title: "still good"
    gloss: "still good"
    note: "*Encore bonnes* (still good) underlines the waste: the pastries are not spoiled."
  fr.c1.unit08.persuasion_retorique.lesson02.teach.chaque_soir:
    title: "every evening"
    gloss: "every evening"
    note: "*Chaque soir* (every evening) mirrors *chaque jour* to form the parallel."
  fr.c1.unit08.persuasion_retorique.lesson02.teach.familles_ont_faim:
    title: "families are hungry"
    gloss: "families are hungry"
    note: "*Des familles ont faim* (families are hungry) is the contrast: waste against hunger."
  fr.c1.unit08.persuasion_retorique.lesson02.teach.parallelisme:
    title: "parallelism"
    gloss: "parallelism"
    note: "*Le parallélisme* repeats a structure to give rhythm and force."
    example_gloss: "Parallelism gives rhythm to the speech."
  fr.c1.unit08.persuasion_retorique.lesson02.teach.modele_parallelisme:
    title: "A parallel structure"
    gloss: "Every day, we throw away pastries that are still good. Every evening, families are hungry."
    note: "The repeated *Chaque ...* opening is a parallelism that sets waste against hunger."

  fr.c1.unit08.persuasion_retorique.lesson03.teach.cest_nous_qui:
    title: "it is we who"
    gloss: "it is we who"
    note: "*C'est nous qui* (it is we who) is a *mise en relief* that emphasizes the group."
  fr.c1.unit08.persuasion_retorique.lesson03.teach.pouvons_agir:
    title: "we can act"
    gloss: "we can act"
    note: "*Pouvons agir* (we can act) is the ability being emphasized."
  fr.c1.unit08.persuasion_retorique.lesson03.teach.cest_maintenant:
    title: "it is now that it is necessary"
    gloss: "it is now that it is necessary"
    note: "*C'est maintenant qu'il faut* (it is now that it is necessary) is a second *mise en relief*, this time on the moment."
  fr.c1.unit08.persuasion_retorique.lesson03.teach.le_faire:
    title: "to do it"
    gloss: "to do it"
    note: "*Le faire* (to do it) completes the emphasis."
  fr.c1.unit08.persuasion_retorique.lesson03.teach.mise_en_relief:
    title: "emphasis / highlighting"
    gloss: "emphasis / highlighting"
    note: "*La mise en relief* front-loads a word or phrase with *c'est ... qui / que* to emphasize it."
    example_gloss: "Emphasis draws attention to an element."
  fr.c1.unit08.persuasion_retorique.lesson03.teach.modele_emphase:
    title: "An emphasis construction"
    gloss: "It is we who can act, and it is now that it must be done."
    note: "Two *mises en relief* (*c'est nous qui*, *c'est maintenant qu'il faut*) stress the actor and the moment."

  fr.c1.unit08.persuasion_retorique.lesson04.teach.appel_logique:
    title: "the appeal to logic"
    gloss: "the appeal to logic"
    note: "*L'appel à la logique* persuades through reason, facts and argument."
  fr.c1.unit08.persuasion_retorique.lesson04.teach.appel_emotion:
    title: "the appeal to emotion"
    gloss: "the appeal to emotion"
    note: "*L'appel à l'émotion* persuades through feeling."
  fr.c1.unit08.persuasion_retorique.lesson04.teach.appel_valeurs:
    title: "the appeal to values"
    gloss: "the appeal to values"
    note: "*L'appel aux valeurs* persuades through shared principles and ideals."
  fr.c1.unit08.persuasion_retorique.lesson04.teach.metier_a_du_sens:
    title: "our trade has meaning"
    gloss: "our trade has meaning"
    note: "*Notre métier a du sens* (our trade has meaning) is a values appeal."
  fr.c1.unit08.persuasion_retorique.lesson04.teach.aider_les_autres:
    title: "to help others"
    gloss: "to help others"
    note: "*Aider les autres* (to help others) is the purpose that gives the trade meaning."
  fr.c1.unit08.persuasion_retorique.lesson04.teach.modele_appel:
    title: "An appeal to values"
    gloss: "Our trade has meaning, and we can help others."
    note: "This sentence is an appeal to values: it justifies the project through what the trade stands for."

  fr.c1.unit08.persuasion_retorique.lesson05.teach.il_ne_suffit_pas:
    title: "it is not enough"
    gloss: "it is not enough"
    note: "*Il ne suffit pas* (it is not enough) raises the stakes by negating a weaker action."
  fr.c1.unit08.persuasion_retorique.lesson05.teach.den_parler:
    title: "to talk about it"
    gloss: "to talk about it"
    note: "*D'en parler* (to talk about it) is the insufficient action being dismissed."
  fr.c1.unit08.persuasion_retorique.lesson05.teach.il_faut_absolument:
    title: "we absolutely must"
    gloss: "we absolutely must / it is absolutely necessary"
    note: "*Il faut absolument* (we absolutely must) intensifies the necessity with *absolument*."
  fr.c1.unit08.persuasion_retorique.lesson05.teach.agir_maintenant:
    title: "to act now"
    gloss: "to act now"
    note: "*Agir maintenant* (to act now) insists on immediate action."
  fr.c1.unit08.persuasion_retorique.lesson05.teach.moduler_intensite:
    title: "to modulate the intensity"
    gloss: "to modulate the intensity"
    note: "*Moduler l'intensité* means adjusting how strong or urgent the message feels."
    example_gloss: "One must modulate the intensity according to the audience."
  fr.c1.unit08.persuasion_retorique.lesson05.teach.modele_intensite:
    title: "Modulated intensity"
    gloss: "It is not enough to talk about it. We absolutely must act now."
    note: "The speaker moves from a weak action (*en parler*) to a strong one (*il faut absolument agir*) to raise intensity."

  fr.c1.unit08.persuasion_retorique.lesson06.teach.alors_mathieu_rejoins:
    title: "So, Mathieu, join me"
    gloss: "So, Mathieu, join me"
    note: "*Alors, Mathieu, rejoins-moi* (so, Mathieu, join me) turns the appeal into a direct request to one person."
  fr.c1.unit08.persuasion_retorique.lesson06.teach.lancons_vente_solidaire:
    title: "let's launch this charity sale together"
    gloss: "let's launch this charity sale together"
    note: "*Lançons ensemble cette vente solidaire* (let's launch this charity sale together) is the concrete call to action."
  fr.c1.unit08.persuasion_retorique.lesson06.teach.appel_action:
    title: "the call to action"
    gloss: "the call to action"
    note: "*L'appel à l'action* is the closing instruction that asks the audience to do something."
    example_gloss: "Inès's speech ends with a call to action."
  fr.c1.unit08.persuasion_retorique.lesson06.teach.persuader:
    title: "to persuade"
    gloss: "to persuade"
    note: "*Persuader* (to persuade) is the whole aim of the appeal."
    example_gloss: "Inès wants to persuade Mathieu to join her."
  fr.c1.unit08.persuasion_retorique.lesson06.teach.modele_complet:
    title: "The complete persuasive appeal"
    gloss: "Mathieu, can you really remain indifferent to the waste? Every day, we throw away pastries that are still good. Every evening, families are hungry. It is we who can act, and it is now that it must be done. Our trade has meaning, and we can help others. So, join me and let's launch this charity sale together."
    note: "This is the exact model for the final speaking and writing tasks: a rhetorical question, a parallel structure, emphasis, an appeal to values, and a call to action."

exercises:
