      - value: {"chaque jour": "every day", "chaque soir": "every evening", "nous jetons des pâtisseries": "we throw away pastries", "encore bonnes": "still good", "des familles ont faim": "families are hungry", "le parallélisme": "parallelism"}
        status: correct
