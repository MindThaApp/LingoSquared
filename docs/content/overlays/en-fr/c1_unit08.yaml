    instruction: "Write in French the taught parallel structure: Every day, we throw away pastries that are still good. Every evening, families go hungry."
    accepted_answers:
      - {value: "Chaque jour, nous jetons des pâtisseries encore bonnes. Chaque soir, des familles ont faim.", status: correct}
      - {value: "Chaque jour, nous jetons des pâtisseries encore bonnes. Chaque soir, des familles ont faim", status: correct}
    feedback: "Chaque jour, nous jetons des pâtisseries encore bonnes. Chaque soir, des familles ont faim."

  fr.c1.unit08.persuasion_retorique.lesson03.exercise01.recognize_emphase:
    instruction: "Which French phrase means 'it is we who' — placing emphasis on the group?"
    correct_option: "c'est nous qui"
    distractors: ["c'est toi qui", "c'est lui qui", "ce sont eux qui"]
    accepted_answers: [{value: "c'est nous qui", status: correct}]
    feedback: "*C'est nous qui* means it is we who — a *mise en relief* that emphasizes the group."
  fr.c1.unit08.persuasion_retorique.lesson03.exercise02.listen_emphase:
    instruction: "Listen and select what you hear."
    correct_option: "It is we who can act, and it is now that it must be done."
