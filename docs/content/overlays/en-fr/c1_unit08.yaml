    feedback: "Il ne suffit pas d'en parler. Il faut absolument agir maintenant means it is not enough to talk about it, we absolutely must act now."
  fr.c1.unit08.persuasion_retorique.lesson05.exercise03.match_intensite:
    instruction: "Match each French intensity phrase to its English meaning."
    accepted_answers:
      - value: {"il ne suffit pas": "it is not enough", "d'en parler": "to talk about it", "il faut absolument": "we absolutely must", "agir maintenant": "to act now", "moduler l'intensité": "to modulate the intensity", "absolument": "absolutely"}
        status: correct
    feedback: "These phrases modulate the intensity of the appeal."
  fr.c1.unit08.persuasion_retorique.lesson05.exercise04.order_intensite:
    instruction: "Put the French words in order to intensify the necessity."
    accepted_answers:
      - {value: "il faut absolument agir maintenant", status: correct}
    feedback: "The intensified necessity is il faut absolument agir maintenant — we absolutely must act now."
  fr.c1.unit08.persuasion_retorique.lesson05.exercise05.write_intensite:
    instruction: "Write in French the taught modulation of intensity: Talking about it is not enough. We absolutely must act now."
    accepted_answers:
      - {value: "Il ne suffit pas d'en parler. Il faut absolument agir maintenant.", status: correct}
      - {value: "Il ne suffit pas d'en parler. Il faut absolument agir maintenant", status: correct}
    feedback: "Il ne suffit pas d'en parler. Il faut absolument agir maintenant."

  fr.c1.unit08.persuasion_retorique.lesson06.exercise01.read_strategie:
    instruction: "In the appeal, which sentence is the rhetorical question?"
    correct_option: "Can you really remain indifferent to the waste?"
    distractors: ["Every day, we throw away pastries that are still good. Every evening, families are hungry.", "It is we who can act, and it is now that it must be done.", "Our trade has meaning, and we can help others."]
    accepted_answers: [{value: "Can you really remain indifferent to the waste?", status: correct}]
    feedback: "The rhetorical question is Peux-tu vraiment rester indifférent au gaspillage ? — it invites reflection, not an answer."
  fr.c1.unit08.persuasion_retorique.lesson06.exercise02.listen_appel_complet:
    instruction: "Listen. What does Inès ask Mathieu to do?"
    correct_option: "join her in launching a charity sale"
    distractors: ["look for a new job", "close the pastry shop", "buy new equipment"]
    accepted_answers: [{value: "join her in launching a charity sale", status: correct}]
    feedback: "Inès's call to action is rejoins-moi et lançons ensemble cette vente solidaire — join me and let's launch this charity sale together."
  fr.c1.unit08.persuasion_retorique.lesson06.exercise03.match_dispositifs:
