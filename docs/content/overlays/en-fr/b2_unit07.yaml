course:
  title: French B2
  description: >-
    Upper-intermediate French: defend a position, speculate about causes and
    consequences, express nuance, recount a complex sequence of events with
    shifting time reference, and negotiate an outcome -- propose terms, push
    back on unacceptable ones, offer a conditional concession, and reach or
    decline an agreement while keeping the relationship intact.

units:
  fr.b2.unit07.negociation:
    title: "Negotiation"
    description: Negotiate an outcome -- propose terms, push back on unacceptable ones, offer a conditional concession, and reach an agreement while keeping the relationship intact.

lessons:
  fr.b2.unit07.lesson01.faire_une_proposition:
    title: "Making a proposal"
  fr.b2.unit07.lesson02.refuser_poliment:
    title: "Declining politely"
  fr.b2.unit07.lesson03.poser_une_condition:
    title: "Setting a condition"
  fr.b2.unit07.lesson04.arriver_a_un_accord:
    title: "Reaching an agreement"
  fr.b2.unit07.lesson05.quest_ce_qui_est_regle:
    title: "What's settled?"
  fr.b2.unit07.lesson06.negocier_en_conversation:
    title: "Negotiating in conversation"

teaching:
  fr.b2.unit07.lesson01.teach.je_voudrais_vous_proposer:
    title: "Monsieur Lefebvre, I would like to propose something to you."
    gloss: "Monsieur Lefebvre, I would like to propose something to you."
    note: "*Je voudrais vous proposer...* opens a negotiation politely, using *vous* -- the respectful register Inès uses with her employer throughout this unit."
  fr.b2.unit07.lesson01.teach.le_travail_du_chocolat:
    title: "chocolate work"
    gloss: "chocolate work"
    example_gloss: "Chocolate work demands precision."
  fr.b2.unit07.lesson01.teach.perfectionner:
    title: "to perfect"
    gloss: "to perfect / to improve"
    example_gloss: "I would like to perfect chocolate work."
  fr.b2.unit07.lesson01.teach.un_cours_du_soir:
    title: "an evening course"
    gloss: "an evening course"
    example_gloss: "I would like to take an evening course this year."
  fr.b2.unit07.lesson01.teach.jaimerais_suivre:
    title: "I would like to take this course, on Thursdays."
    gloss: "I would like to take this course, on Thursdays."
    note: "*J'aimerais...* is a softer, slightly less direct way to state a wish than *je voudrais* -- both are polite; *suivre un cours* is the standard French verb for 'to take a course'."
  fr.b2.unit07.lesson01.teach.huit_semaines:
    title: "eight weeks"
    gloss: "eight weeks"
    example_gloss: "The course lasts eight weeks."
  fr.b2.unit07.lesson01.teach.serait_il_possible:
    title: "Would it be possible to leave earlier on Thursdays?"
    gloss: "Would it be possible to leave earlier on Thursdays?"
    note: "*Serait-il possible de...?* is an even more indirect, very polite way to ask for something -- the conditional *serait* softens the request."
  fr.b2.unit07.lesson01.teach.claim_model:
    title: "I would like to take an evening course, on Thursdays, for eight weeks, to perfect chocolate work. Would it be possible to leave earlier that day?"
    gloss: "I would like to take an evening course, on Thursdays, for eight weeks, to perfect chocolate work. Would it be possible to leave earlier that day?"
  fr.b2.unit07.lesson01.teach.grammar_proposition:
    title: "Three polite ways to open a negotiation with vous: Je voudrais vous proposer..., Serait-il possible de...?, J'aimerais... All three put a term on the table without imposing it."
    gloss: "Three polite ways to open a negotiation with vous: Je voudrais vous proposer..., Serait-il possible de...?, J'aimerais... All three put a term on the table without imposing it."
    note: "Stating your terms clearly and politely is the opening move of any negotiation. All three forms here use *vous* -- see this unit's register note."

  fr.b2.unit07.lesson02.teach.je_crains_que:
    title: "I'm afraid that's not possible."
    gloss: "I'm afraid that's not possible."
    note: "*Je crains que* ('I'm afraid that') is followed by the subjunctive (*soit*). Here *ne ... pas* is an ordinary negation: literally 'I fear that it is not possible'. Don't confuse it with the expletive *ne* used ALONE after verbs of fearing, which is not a negation: *je crains qu'il ne pleuve* = 'I'm afraid it will rain'."
  fr.b2.unit07.lesson02.teach.charge:
    title: busy
    gloss: "busy / heavily booked"
    example_gloss: "Friday is a very busy day for us."
  fr.b2.unit07.lesson02.teach.le_soir_le_plus_charge:
    title: "Thursday evening is our busiest evening."
    gloss: "Thursday evening is our busiest evening."
    note: "This is the actual REASON Lefebvre gives for declining Inès's requested day -- Thursday evening is the shop's busiest closing shift."
  fr.b2.unit07.lesson02.teach.malheureusement:
    title: unfortunately
    gloss: unfortunately
    example_gloss: "Unfortunately, I have to decline your request."
  fr.b2.unit07.lesson02.teach.accepter:
    title: "to accept"
    gloss: "to accept"
    example_gloss: "I can't accept this proposal as it is."
  fr.b2.unit07.lesson02.teach.malheureusement_je_ne_peux_pas:
    title: "Unfortunately, I can't accept that."
    gloss: "Unfortunately, I can't accept that."
  fr.b2.unit07.lesson02.teach.complique:
    title: complicated
    gloss: complicated
    example_gloss: "It's a bit complicated right now."
  fr.b2.unit07.lesson02.teach.claim_model:
    title: "That's going to be complicated, because Thursday evening is our busiest evening."
    gloss: "That's going to be complicated, because Thursday evening is our busiest evening."
  fr.b2.unit07.lesson02.teach.grammar_refus:
    title: "Three degrees of polite refusal with vous, from softest to most direct."
    gloss: "Three degrees of polite refusal with vous: Je crains que ce ne soit pas possible (softest), Malheureusement, je ne peux pas accepter cela (direct but polite), Ça va être compliqué parce que... (states a reason, leaves the door open)."
    note: "A polite decline that gives a reason keeps a negotiation alive -- it invites the other side to propose a condition, which is exactly what lesson03 teaches next."

  fr.b2.unit07.lesson03.teach.rattraper:
    title: "to make up (time)"
    gloss: "to make up (time) / to catch up"
    example_gloss: "I have to make up my delay."
  fr.b2.unit07.lesson03.teach.le_samedi:
    title: Saturday
    gloss: Saturday
    example_gloss: "I work Saturday mornings."
  fr.b2.unit07.lesson03.teach.si_alors:
    title: "If you make up the hours on Saturday morning, then I could accept."
    gloss: "If you make up the hours on Saturday morning, then I could accept."
    note: "PATTERN 1: *si* + PRESENT tense (*rattrapez*). The textbook pairing for a real, likely condition is si + present with a present or future main clause (*alors je peux accepter*); here the polite conditional *je pourrais* softens the concession, which is common in speech with *pouvoir*. (A hypothetical uses si + IMPERFECT instead: *Et si vous rattrapiez les heures le dimanche ?*)"
  fr.b2.unit07.lesson03.teach.a_condition_que:
    title: "on condition that"
    gloss: "on condition that"
    note: "*à condition que* is always followed by the SUBJUNCTIVE, not the present indicative -- see the next card for the exact form."
    example_gloss: "I'll come, on condition that you invite me."
  fr.b2.unit07.lesson03.teach.claim_model:
    title: "I can accept, on condition that you make up the hours on Saturday morning."
    gloss: "I can accept, on condition that you make up the hours on Saturday morning."
    note: "PATTERN 2: *à condition que* + SUBJUNCTIVE -- *rattrapiez*, not *rattrapez*. This is the core grammatical contrast of the unit: compare this card to the si-clause card above, which uses the PRESENT (*rattrapez*), not the subjunctive."
  fr.b2.unit07.lesson03.teach.mais_seulement_si:
    title: "I can accept, but only if you make up the hours."
    gloss: "I can accept, but only if you make up the hours."
    note: "*mais seulement si* + PRESENT is a simpler, more casual-sounding way to attach the same condition as *à condition que* -- both are correct and common in vous-register negotiation."
  fr.b2.unit07.lesson03.teach.grammar_condition:
    title: "Two structures for a conditional concession: si + present, ...conditional, and à condition que + subjunctive."
    gloss: "Two structures for a conditional concession. 1) Si + present, ...conditional: If you make up the hours, then I could accept. 2) à condition que + subjunctive: I can accept, on condition that you make up the hours (rattrapiez, not rattrapez -- the subjunctive after à condition que). Both keep the relationship intact: you give ground, but not without a condition."
    note: "This is the grammatical heart of the unit -- a conditional concession is what actually resolves a negotiation without either side losing face."

  fr.b2.unit07.lesson04.teach.nous_sommes_daccord:
    title: "We agree."
    gloss: "We agree."
  fr.b2.unit07.lesson04.teach.marche_conclu:
    title: "It's a deal!"
    gloss: "It's a deal! / Deal!"
    note: "*Marché conclu !* is a fixed idiom sealing a negotiated agreement -- literally 'bargain concluded'."
  fr.b2.unit07.lesson04.teach.confirmer:
    title: "to confirm"
    gloss: "to confirm"
    example_gloss: "I would like to confirm the terms of our agreement."
  fr.b2.unit07.lesson04.teach.vous_partez_plus_tot:
    title: "You leave earlier on Thursdays."
    gloss: "You leave earlier on Thursdays."
  fr.b2.unit07.lesson04.teach.claim_model:
    title: "It's a deal. You leave earlier on Thursdays, and you make up the hours on Saturday morning, for the eight weeks of the course."
    gloss: "It's a deal. You leave earlier on Thursdays, and you make up the hours on Saturday morning, for the eight weeks of the course."
  fr.b2.unit07.lesson04.teach.grammar_accord:
    title: "Once the condition is accepted by both sides, you seal the deal: Nous sommes d'accord, Marché conclu. Then you confirm the exact terms, condition included, so nothing stays ambiguous."
    gloss: "Once the condition is accepted by both sides, you seal the deal: Nous sommes d'accord, Marché conclu. Then you confirm the exact terms, condition included, so nothing stays ambiguous."
    note: "Restating the FULL terms -- including the condition and its scope (here, only for the eight weeks of the course) -- is what prevents a later misunderstanding."

  fr.b2.unit07.lesson05.teach.texte:
    title: "Reading: a note from Monsieur Lefebvre"
    gloss: "Inès, here is what we've decided. You can take the evening course on Thursdays, for the eight weeks, on condition that you make up the hours on Saturday morning. The last Thursday of the course falls during the sales period; we haven't decided yet whether you'll be able to leave earlier that day. We'll talk about it again next week."
    glosses:
      voici: "here is"
      décidé: decided
      pouvez: "can (vous form of pouvoir)"
      dernier: last
      tombe: "falls (on) (of tomber, to fall)"
      soldes: "the sales / clearance sale period"
      encore: "yet / still"
      pourrez: "will be able to (vous future of pouvoir)"
      reparlerons: "will talk about it again (of reparler)"
      semaine: week
      prochaine: next

  fr.b2.unit07.lesson06.teach.le_dimanche:
    title: Sunday
    gloss: Sunday
    example_gloss: "On Sundays, I don't work."
  fr.b2.unit07.lesson06.teach.dialogue_ines_propose:
    title: "Inès: Monsieur Lefebvre, I would like to propose something to you."
    gloss: "Inès: Monsieur Lefebvre, I would like to propose something to you."
  fr.b2.unit07.lesson06.teach.dialogue_lefebvre_ecoute:
    title: "Lefebvre: I'm listening."
    gloss: "Lefebvre: I'm listening."
  fr.b2.unit07.lesson06.teach.dialogue_ines_terms:
    title: "Inès: I would like to take an evening course, on Thursdays, for eight weeks, to perfect chocolate work. Would it be possible to leave earlier that day?"
    gloss: "Inès: I would like to take an evening course, on Thursdays, for eight weeks, to perfect chocolate work. Would it be possible to leave earlier that day?"
  fr.b2.unit07.lesson06.teach.dialogue_lefebvre_decline_counter:
    title: "Lefebvre: I'm afraid that's not possible. Thursday evening is our busiest evening. What if you made up the hours on Sunday?"
    gloss: "Lefebvre: I'm afraid that's not possible. Thursday evening is our busiest evening. What if you made up the hours on Sunday?"
  fr.b2.unit07.lesson06.teach.dialogue_ines_decline_concede:
    title: "Inès: Sunday, unfortunately, wouldn't be possible for me. But I could make them up on Saturday morning."
    gloss: "Inès: Sunday, unfortunately, wouldn't be possible for me. But I could make them up on Saturday morning."
    note: "Inès declines Lefebvre's Sunday suggestion, then herself offers the conditional concession that resolves the negotiation -- both moves in her own two sentences."
  fr.b2.unit07.lesson06.teach.dialogue_lefebvre_accept:
    title: "Lefebvre: In that case, I can accept, on the exact condition that it's Saturday morning, for the eight weeks of the course."
    gloss: "Lefebvre: In that case, I can accept, on the exact condition that it's Saturday morning, for the eight weeks of the course."
  fr.b2.unit07.lesson06.teach.dialogue_ines_conclu:
    title: "Inès: It's a deal. Thank you very much, Monsieur Lefebvre."
    gloss: "Inès: It's a deal. Thank you very much, Monsieur Lefebvre."
  fr.b2.unit07.lesson06.teach.dialogue_lefebvre_plaisir:
    title: "Lefebvre: My pleasure, Inès."
    gloss: "Lefebvre: My pleasure, Inès."
  fr.b2.unit07.lesson06.teach.grammar_recap:
    title: "The whole negotiation in one move: propose, decline, rule out an option, offer a conditional concession, accept."
    gloss: "The whole negotiation in one move: Inès states a term (je voudrais vous proposer), Lefebvre declines and explains why (je crains que ce ne soit pas possible... notre soir le plus chargé), one option is ruled out (le dimanche, ce ne serait pas possible), then Inès offers a conditional concession (je pourrais les rattraper le samedi matin) which Lefebvre accepts on a precise condition (à condition que ce soit bien le samedi matin, pendant les huit semaines du cours)."
    note: "This dialogue delivers all four pieces of the negotiation outcome: propose terms, decline an unacceptable one, offer a conditional concession, reach agreement -- exactly what this lesson's speaking and writing tasks ask you to reproduce."

exercises:
  fr.b2.unit07.lesson01.exercise01.recognize_perfectionner:
    instruction: "What does this word mean?"
    correct_option: "to perfect"
    distractors: ["to propose", "to accept", "to confirm"]
    accepted_answers: [{value: "to perfect", status: correct}]
    feedback: "Perfectionner means to perfect / to improve."
  fr.b2.unit07.lesson01.exercise02.listen_proposition:
    instruction: "Listen and select what you hear."
    correct_option: "I would like to take an evening course, on Thursdays, for eight weeks, to perfect chocolate work."
    distractors: ["I would like to take an evening course, on Fridays, for eight weeks, to perfect chocolate work.", "I would like to take an evening course, on Thursdays, for four weeks, to perfect chocolate work.", "I would like to take an evening course, on Thursdays, for eight weeks, to perfect bread-making."]
    accepted_answers: [{value: "I would like to take an evening course, on Thursdays, for eight weeks, to perfect chocolate work.", status: correct}]
    feedback: "J'aimerais suivre un cours du soir, le jeudi, pendant huit semaines, pour perfectionner le travail du chocolat means I would like to take an evening course, on Thursdays, for eight weeks, to perfect chocolate work."
  fr.b2.unit07.lesson01.exercise03.match_proposing:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"Je voudrais vous proposer quelque chose.": "I would like to propose something to you.", "le travail du chocolat": "chocolate work", perfectionner: "to perfect / to improve", "un cours du soir": "an evening course", "le jeudi": Thursday, "huit semaines": "eight weeks", "Serait-il possible de...": "Would it be possible to...?", "J'aimerais...": "I would like to..."}
        status: correct
    feedback: "These are this lesson's proposal-making words -- three different polite ways to open with a term, plus the details of Inès's actual proposal."
  fr.b2.unit07.lesson01.exercise04.order_jaimerais_suivre:
    instruction: "Put the words in order: I would like to take an evening course."
    accepted_answers:
      - {value: "J'aimerais suivre un cours du soir", status: correct}
    feedback: "J'aimerais suivre un cours du soir means I would like to take an evening course."
  fr.b2.unit07.lesson01.exercise05.translate_serait_il_possible:
    instruction: "Translate into French, asking politely with Serait-il possible de: Would it be possible to leave earlier on Thursdays?"
    accepted_answers:
      - {value: "Serait-il possible de partir plus tôt le jeudi", status: correct}
      - {value: "Serait-il possible de partir plus tôt le jeudi ?", status: correct}
      - {value: "Serait-il possible de partir plus tôt les jeudis", status: correct}
    feedback: "Serait-il possible de partir plus tôt le jeudi ? means would it be possible to leave earlier on Thursdays?"
  fr.b2.unit07.lesson01.exercise06.speak_je_voudrais_proposer:
    instruction: "Say aloud in French, opening a proposal with je voudrais vous proposer (vous register): I would like to propose something to you."
    accepted_answers:
      - {value: "Je voudrais vous proposer quelque chose", status: correct}
    feedback: "Je voudrais vous proposer quelque chose means I would like to propose something to you."
  fr.b2.unit07.lesson01.exercise07.write_cours_du_soir:
    instruction: "Write in French: I would like to take an evening course for eight weeks."
    accepted_answers:
      - {value: "J'aimerais suivre un cours du soir pendant huit semaines", status: correct}
      - {value: "Je voudrais suivre un cours du soir pendant huit semaines", status: correct}
    feedback: "J'aimerais suivre un cours du soir pendant huit semaines means I would like to take an evening course for eight weeks."
  fr.b2.unit07.lesson01.exercise08.dictation_proposition:
    instruction: "Type what you hear."
    correct_response: "J'aimerais suivre un cours du soir, le jeudi, pendant huit semaines, pour perfectionner le travail du chocolat"
    orthography_strict: true
    feedback: "You heard J'aimerais suivre un cours du soir, le jeudi, pendant huit semaines, pour perfectionner le travail du chocolat -- I would like to take an evening course, on Thursdays, for eight weeks, to perfect chocolate work."

  fr.b2.unit07.lesson02.exercise01.recognize_malheureusement:
    instruction: "What does this word mean?"
    correct_option: unfortunately
    distractors: [fortunately, immediately, "on condition"]
    accepted_answers: [{value: unfortunately, status: correct}]
    feedback: "Malheureusement means unfortunately."
  fr.b2.unit07.lesson02.exercise02.listen_refus:
    instruction: "Listen and select what you hear."
    correct_option: "I'm afraid that's not possible. Thursday evening is our busiest evening."
    distractors: ["I'm afraid that's not possible. Friday evening is our busiest evening.", "That's fine. Thursday evening is our busiest evening.", "I'm afraid that's not possible. Thursday morning is our busiest time."]
    accepted_answers: [{value: "I'm afraid that's not possible. Thursday evening is our busiest evening.", status: correct}]
    feedback: "Je crains que ce ne soit pas possible. Le jeudi soir est notre soir le plus chargé means I'm afraid that's not possible. Thursday evening is our busiest evening."
  fr.b2.unit07.lesson02.exercise03.match_declining:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"Je crains que ce ne soit pas possible.": "I'm afraid that's not possible.", "Malheureusement, je ne peux pas accepter cela.": "Unfortunately, I can't accept that.", "Ça va être compliqué.": "That's going to be complicated.", chargé: "busy / heavily booked", malheureusement: unfortunately, accepter: "to accept", "notre soir le plus chargé": "our busiest evening"}
        status: correct
    feedback: "Different ways to decline politely, from the softest (je crains que) to the most direct (malheureusement, je ne peux pas)."
  fr.b2.unit07.lesson02.exercise04.order_soir_charge:
    instruction: "Put the words in order: Thursday evening is our busiest evening."
    accepted_answers:
      - {value: "Le jeudi soir est notre soir le plus chargé", status: correct}
    feedback: "Le jeudi soir est notre soir le plus chargé means Thursday evening is our busiest evening."
  fr.b2.unit07.lesson02.exercise05.translate_malheureusement:
    instruction: "Translate into French, declining with malheureusement (vous register): Unfortunately, I can't accept that."
    accepted_answers:
      - {value: "Malheureusement, je ne peux pas accepter cela", status: correct}
      - {value: "Malheureusement je ne peux pas accepter cela", status: correct}
      - {value: "Malheureusement, je ne peux pas accepter ça", status: correct}
    feedback: "Malheureusement, je ne peux pas accepter cela means unfortunately, I can't accept that."
  fr.b2.unit07.lesson02.exercise06.write_je_crains_que:
    instruction: "Write in French, declining softly with je crains que: I'm afraid that's not possible."
    accepted_answers:
      - {value: "Je crains que ce ne soit pas possible", status: correct}
      - {value: "Je crains que ça ne soit pas possible", status: correct}
    feedback: "Je crains que ce ne soit pas possible means I'm afraid that's not possible."
  fr.b2.unit07.lesson02.exercise07.write_parce_que:
    instruction: "Write in French, giving your reason with parce que: That's going to be complicated because Thursday evening is our busiest evening."
