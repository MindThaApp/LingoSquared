    accepted_answers: [{value: "Food waste is an important problem.", status: correct}]
    feedback: "Le gaspillage alimentaire est un problème important dans une boutique -- the author opens by stating this stance outright."
  fr.b2.unit06.lesson05.exercise02.read_concession:
    instruction: "What does the author CONCEDE to the practical objection?"
    correct_option: "That it costs money and there are hygiene rules to follow."
    distractors: ["That donating food is illegal.", "That customers don't want donated food.", "That the shop has no unsold items."]
    accepted_answers: [{value: "That it costs money and there are hygiene rules to follow.", status: correct}]
    feedback: "Certes, ça coûte de l'argent et il y a des règles d'hygiène -- the author grants the practical cost before holding their position."
  fr.b2.unit06.lesson05.exercise03.read_final_position:
