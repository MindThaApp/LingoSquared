    correct_option: "That throwing away food isn't a good solution."
    distractors: ["That the hygiene rules should be ignored.", "That the staff should work for free.", "That the shop should close early instead."]
    accepted_answers: [{value: "That throwing away food isn't a good solution.", status: correct}]
    feedback: "Il faut reconnaître que jeter la nourriture n'est pas une bonne solution -- the author's decisive conclusion, held despite the conceded cost."
