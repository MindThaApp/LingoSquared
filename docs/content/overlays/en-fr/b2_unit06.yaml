course:
  title: French B2
  description: >-
    Upper-intermediate French: defend a position, speculate about causes
    and consequences, express nuance, recount a complex sequence of events,
    and discuss an abstract topic -- ideas, values, social issues --
    expressing a qualified opinion and responding directly to another
    person's view.

units:
  fr.b2.unit06.abstraction:
    title: "Abstract ideas and values"
    description: Discuss an abstract topic -- ideas, values, and social issues -- expressing an opinion with qualification and responding directly to another person's view rather than only stating your own.

lessons:
  fr.b2.unit06.lesson01.donner_son_avis:
    title: "Giving your opinion"
  fr.b2.unit06.lesson02.une_opinion_nuancee:
    title: "A qualified opinion"
  fr.b2.unit06.lesson03.repondre_a_un_contre_argument:
    title: "Responding to a counterargument"
  fr.b2.unit06.lesson04.le_pour_et_le_contre:
    title: "Pros and cons"
  fr.b2.unit06.lesson05.lire_un_point_de_vue:
    title: "Reading a viewpoint"
  fr.b2.unit06.lesson06.en_discussion:
    title: "In discussion: a qualified opinion"

teaching:
  fr.b2.unit06.lesson01.teach.gaspillage_alimentaire:
    title: "food waste"
    gloss: "food waste"
    note: "*Le gaspillage alimentaire* is the everyday French term for food waste -- the topic of this whole unit, seen from inside a pâtisserie: unsold pastries at closing time."
    example_gloss: "Food waste is a real problem."
  fr.b2.unit06.lesson01.teach.probleme:
    title: "a problem"
    gloss: "a problem"
    example_gloss: "That's a problem for the shop."
  fr.b2.unit06.lesson01.teach.pour:
    title: for
    gloss: for
    example_gloss: "That's important for the shop."
  fr.b2.unit06.lesson01.teach.important:
    title: important
    gloss: important
    example_gloss: "That's very important."
  fr.b2.unit06.lesson01.teach.quest_ce_que_tu_en_penses:
    title: "What do you think about it?"
    gloss: "What do you think about it?"
    note: "*Qu'est-ce que tu en penses ?* is the natural way to ask someone's opinion informally -- literally 'what is it that you think of it'. *En* stands in for the topic already under discussion."
  fr.b2.unit06.lesson01.teach.je_trouve_que:
    title: "I find that..."
    gloss: "I find that... / I think that..."
    note: "*Je trouve que...* introduces an opinion, just like *je pense que* -- the two are near-synonyms in everyday speech. *Trouve* here means 'consider/find', not the literal 'find (an object)'."
    example_gloss: "I find that it's true."
  fr.b2.unit06.lesson01.teach.je_pense_que:
    title: "I think that..."
    gloss: "I think that..."
    note: "*Je pense que...* -- the most common, all-purpose opinion frame. Both this and *je trouve que* send the following clause after *que* as a normal statement (no subjunctive needed for a simple stated opinion)."
  fr.b2.unit06.lesson01.teach.claim_model:
    title: "Food waste is an important problem."
    gloss: "Food waste is an important problem."
  fr.b2.unit06.lesson01.teach.grammar_opinion:
    title: "Je trouve que and je pense que introduce an opinion, followed by a full clause -- the most common ways to give your opinion in French."
    gloss: "Je trouve que and je pense que introduce an opinion, followed by a full clause -- the most common ways to give your opinion in French."
    note: "This unit builds toward a QUALIFIED opinion, not just a flat one -- lesson02 adds a softener to whichever frame you choose here."

  fr.b2.unit06.lesson02.teach.gaspiller:
    title: "to waste"
    gloss: "to waste"
    example_gloss: "You shouldn't waste food."
  fr.b2.unit06.lesson02.teach.nourriture:
    title: "food"
    gloss: "food"
    example_gloss: "Food is precious."
  fr.b2.unit06.lesson02.teach.dans_une_certaine_mesure:
    title: "to a certain extent"
    gloss: "to a certain extent"
    note: "*Dans une certaine mesure* softens a claim -- it grants that something is partly true without agreeing fully. This is the core QUALIFYING move this lesson teaches: a nuanced opinion concedes a point, it doesn't abandon its own."
    example_gloss: "To a certain extent, you're right."
  fr.b2.unit06.lesson02.teach.il_faut_reconnaitre_que:
    title: "it must be acknowledged that"
    gloss: "it must be acknowledged that... / you have to admit that..."
    note: "*Il faut reconnaître que...* -- an impersonal frame that concedes a point is true, distinct from *je pense que* (a personal opinion). Pairing it with your own position afterward is what makes an opinion qualified rather than flat."
    example_gloss: "It must be acknowledged that it's true."
  fr.b2.unit06.lesson02.teach.dun_cote_de_lautre:
    title: "on one hand ... on the other"
    gloss: "on one hand ... on the other (hand)"
    note: "*D'un côté ... de l'autre* weighs two sides of an opinion in one breath -- reuses *côté* and *l'autre*, both already taught in unit01's *de l'autre côté*."
    example_gloss: "On one hand, it's expensive. On the other, it's useful."
  fr.b2.unit06.lesson02.teach.claim_model:
    title: "To a certain extent, it must be acknowledged that it's a problem."
    gloss: "To a certain extent, it must be acknowledged that it's a problem."
  fr.b2.unit06.lesson02.teach.grammar_nuance:
    title: "A qualified opinion grants a piece of truth on the other side before holding its own position -- dans une certaine mesure, il faut reconnaître que, and d'un côté ... de l'autre are the tools for that."
    gloss: "A qualified opinion grants a piece of truth on the other side before holding its own position -- dans une certaine mesure, il faut reconnaître que, and d'un côté ... de l'autre are the tools for that."
    note: "Compare unit03's *il me semble que* (a hedge on YOUR OWN certainty) with this lesson's connectors (a concession toward the OTHER side) -- related but functionally distinct moves."

  fr.b2.unit06.lesson03.teach.certes:
    title: "granted / certainly"
    gloss: "granted / certainly"
    note: "*Certes* concedes a point is true WITHOUT abandoning your own position -- it is usually followed by a *mais* (but) that pushes back. It is not a full agreement, despite sounding emphatic in English."
    example_gloss: "Granted, it's true."
  fr.b2.unit06.lesson03.teach.je_comprends_ton_point:
    title: "I understand your point, however..."
    gloss: "I understand your point, however..."
    note: "*Je comprends ton point, cependant...* acknowledges the other person was heard, THEN pushes back with *cependant* (however, already taught in unit01) -- the polite spine of disagreeing with someone you respect."
    example_gloss: "I understand your point."
  fr.b2.unit06.lesson03.teach.tu_nas_pas_tort:
    title: "you're not wrong, but..."
    gloss: "you're not wrong, but..."
    note: "*Tu n'as pas tort, mais...* -- literally 'you don't have wrong', i.e. 'you're not wrong'. A double-negative-feeling concession (you are NOT wrong) that is gentler than a flat 'you're right'."
    example_gloss: "You're not wrong."
  fr.b2.unit06.lesson03.teach.ca_coute_de_largent:
    title: "it costs money"
    gloss: "it costs money"
    note: "Mathieu's first real objection: donating unsold pastries isn't free -- there's a genuine cost, not just an excuse."
    example_gloss: "Food waste costs the shop money."
  fr.b2.unit06.lesson03.teach.hygiene:
    title: "the hygiene rules"
    gloss: "the hygiene rules"
    note: "Mathieu's second objection: food-safety rules genuinely constrain how a bakery can hand out unsold food -- a real practical concern, not a strawman."
    example_gloss: "There are hygiene rules to follow."
  fr.b2.unit06.lesson03.teach.employes:
    title: "the staff"
    gloss: "the staff / the employees"
    example_gloss: "The staff are short on time."
  fr.b2.unit06.lesson03.teach.claim_model:
    title: "Granted, it costs money and there are hygiene rules. I understand your point, however it's an important problem."
    gloss: "Granted, it costs money and there are hygiene rules. I understand your point, however it's an important problem."
  fr.b2.unit06.lesson03.teach.grammar_repondre:
    title: "Responding means conceding the other person's point FIRST, then returning to your own position."
    gloss: "Responding to a counterargument isn't just repeating your own opinion: certes, je comprends ton point, and tu n'as pas tort all concede the other person's point FIRST, before returning to your own position with mais / cependant."
    note: "Mathieu's objections (cost, hygiene, staff time) are genuine practical concerns, not excuses to dismiss -- a real qualified response engages with them directly rather than talking past them."

  fr.b2.unit06.lesson04.teach.d_une_part_d_autre_part:
    title: "on the one hand ... on the other hand"
    gloss: "on the one hand ... on the other hand"
    note: "*D'une part ... d'autre part* sets two points side by side -- often two arguments for the same side (as in this lesson's model sentence), and it can also frame an *avantage* against an *inconvénient*. Functionally close to lesson02's *d'un côté ... de l'autre*, which leans more toward contrasting two sides."
    example_gloss: "On the one hand, it's useful. On the other hand, it's expensive."
  fr.b2.unit06.lesson04.teach.donner:
    title: "to give"
    gloss: "to give / to give away"
    example_gloss: "The unsold items must be given away."
  fr.b2.unit06.lesson04.teach.invendus:
    title: "the unsold items"
    gloss: "the unsold items / the leftovers"
    note: "*Les invendus* -- literally 'the un-sold [things]' -- is the everyday French word for unsold stock, exactly what a pâtisserie has left at closing time."
    example_gloss: "Unsold items end up in the trash."
  fr.b2.unit06.lesson04.teach.jeter:
    title: "to throw away"
    gloss: "to throw away"
    example_gloss: "You shouldn't throw away the unsold items."
  fr.b2.unit06.lesson04.teach.avantage_inconvenient:
    title: "the advantage and the drawback"
    gloss: "the advantage and the drawback"
    note: "*L'avantage* and *l'inconvénient* were both already taught in unit01's remote-work debate -- reused here for the same weighing move, applied to food donation."
    example_gloss: "Every solution has an advantage and a drawback."
  fr.b2.unit06.lesson04.teach.claim_model:
    title: "On the one hand, the unsold items must be given away. On the other hand, throwing away food is a problem."
    gloss: "On the one hand, the unsold items must be given away. On the other hand, throwing away food is a problem."
  fr.b2.unit06.lesson04.teach.grammar_peser:
    title: "Weighing pros and cons means naming an advantage AND a drawback -- d'une part ... d'autre part sets two points side by side."
    gloss: "Weighing pros and cons means naming an advantage AND a drawback. D'une part ... d'autre part presents two points one after the other -- often two arguments for the same side, or an advantage and a drawback."

  fr.b2.unit06.lesson05.teach.texte:
    title: "Reading: is donating unsold pastries worth it?"
    gloss: "Food waste is an important problem in a shop. Granted, it costs money and there are hygiene rules. The staff are sometimes short on time. However, it must be acknowledged that throwing away food isn't a good solution. On the one hand, giving away the unsold items matters. On the other hand, it's also good for the shop's image. It isn't always easy, but it's important."
    glosses:
      gaspillage: "waste (le gaspillage alimentaire = food waste)"
      alimentaire: "food-related (in le gaspillage alimentaire)"
      problème: problem
      important: important
      boutique: shop
      Certes: "granted, certainly"
      coûte: "costs (from coûter)"
      "l'argent": money
      règles: rules
      "d'hygiène": hygiene
      employés: staff
      manquent: "lack (from manquer)"
      parfois: sometimes
      temps: time
      Cependant: however
      faut: "must, is necessary (il faut = it is necessary to)"
      reconnaître: acknowledge
      jeter: "throw away"
      nourriture: food
      bonne: good
      solution: solution
      part: "part (d'une part ... d'autre part = on the one hand ... on the other)"
      donner: give
      invendus: "unsold items"
      aussi: also
      "l'image": image
      toujours: always
      facile: easy
      mais: but

  fr.b2.unit06.lesson06.teach.societe:
    title: "society"
    gloss: society
    example_gloss: "That's important for society."
  fr.b2.unit06.lesson06.teach.dialogue_ines_open:
    title: "Inès: I think food waste is an important problem. The unsold items must be given away."
    gloss: "Inès: I think food waste is an important problem. The unsold items must be given away."
  fr.b2.unit06.lesson06.teach.dialogue_mathieu_concede:
    title: "Mathieu: Granted, but it costs money and there are hygiene rules."
    gloss: "Mathieu: Granted, but it costs money and there are hygiene rules."
  fr.b2.unit06.lesson06.teach.dialogue_ines_understand:
    title: "Inès: I understand your point, however it's also important for society."
    gloss: "Inès: I understand your point, however it's also important for society."
  fr.b2.unit06.lesson06.teach.dialogue_mathieu_practical:
    title: "Mathieu: You're not wrong, but the staff are short on time."
    gloss: "Mathieu: You're not wrong, but the staff are short on time."
  fr.b2.unit06.lesson06.teach.dialogue_ines_weigh:
    title: "Inès: I think that on the one hand, it's good for society, on the other hand, it's also good for the shop's image."
    gloss: "Inès: I think that on the one hand, it's good for society, on the other hand, it's also good for the shop's image."
  fr.b2.unit06.lesson06.teach.dialogue_mathieu_qualify:
    title: "Mathieu: All right, to a certain extent you're right. It's not always easy, but it's important."
    gloss: "Mathieu: All right, to a certain extent you're right. It's not always easy, but it's important."
  fr.b2.unit06.lesson06.teach.grammar_recap:
    title: "A full discussion mixes an opinion, a qualifier, and a direct response to the other person."
    gloss: "A complete abstract discussion mixes an opinion (je trouve que / je pense que), a qualifier (dans une certaine mesure / il faut reconnaître que), and a direct response to the other person (certes ... mais / je comprends ton point, cependant). That's exactly what you produce in the speaking and writing tasks that follow."
    note: "Mathieu's final line is a genuine QUALIFIED concession (*dans une certaine mesure tu as raison*), not a capitulation -- he still hasn't said the cost/hygiene/time concerns were wrong, only that Inès's larger point has real weight."

exercises:
  fr.b2.unit06.lesson01.exercise01.recognize_gaspillage:
    instruction: "What does this phrase mean?"
    correct_option: "food waste"
    distractors: ["a good idea", "an important meeting", "a nice place"]
    accepted_answers: [{value: "food waste", status: correct}]
    feedback: "Le gaspillage alimentaire means food waste."
  fr.b2.unit06.lesson01.exercise02.listen_claim:
    instruction: "Listen and select what you hear."
    correct_option: "Food waste is an important problem."
    distractors: ["Food waste is not a problem.", "Food waste is an interesting idea.", "Food waste is a minor problem."]
    accepted_answers: [{value: "Food waste is an important problem.", status: correct}]
    feedback: "Le gaspillage alimentaire est un problème important means food waste is an important problem."
  fr.b2.unit06.lesson01.exercise03.match_opinion_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"le gaspillage alimentaire": "food waste", "un problème": "a problem", pour: for, important: important, "Qu'est-ce que tu en penses ?": "What do you think about it?", "je trouve que": "I find that...", "je pense que": "I think that..."}
        status: correct
    feedback: "These are this lesson's opinion words and frames."
  fr.b2.unit06.lesson01.exercise04.order_gaspillage_probleme:
    instruction: "Put the words in order: Food waste is a problem."
    accepted_answers:
      - {value: "Le gaspillage alimentaire est un problème", status: correct}
    feedback: "Le gaspillage alimentaire est un problème means food waste is a problem."
  fr.b2.unit06.lesson01.exercise05.translate_trouve:
    instruction: "Translate into French, using je trouve que: I find that it's an important problem."
    accepted_answers:
      - {value: "Je trouve que c'est un problème important", status: correct}
    feedback: "Je trouve que c'est un problème important means I find that it's an important problem."
  fr.b2.unit06.lesson01.exercise06.speak_penses:
    instruction: "Say aloud in French, using je pense que: I think that it's important."
    accepted_answers:
      - {value: "Je pense que c'est important", status: correct}
    feedback: "Je pense que c'est important means I think that it's important."
  fr.b2.unit06.lesson01.exercise07.write_qu_est_ce:
    instruction: "Write in French: What do you think about it?"
    accepted_answers:
      - {value: "Qu'est-ce que tu en penses ?", status: correct}
      - {value: "Qu'est-ce que tu en penses?", status: correct}
      - {value: "Qu'en penses-tu ?", status: correct}
      - {value: "Tu en penses quoi ?", status: correct}
      - {value: "Qu'est-ce que vous en pensez ?", status: correct}
    feedback: "Qu'est-ce que tu en penses ? means what do you think about it?"
  fr.b2.unit06.lesson01.exercise08.dictation_claim:
    instruction: "Type what you hear."
    correct_response: "Le gaspillage alimentaire est un problème important"
    orthography_strict: true
    feedback: "You heard Le gaspillage alimentaire est un problème important — food waste is an important problem."

  fr.b2.unit06.lesson02.exercise01.recognize_gaspiller:
    instruction: "What does this word mean?"
    correct_option: "to waste"
    distractors: ["to give", "to throw away", "to acknowledge"]
    accepted_answers: [{value: "to waste", status: correct}]
    feedback: "Gaspiller means to waste."
  fr.b2.unit06.lesson02.exercise02.listen_certaine_mesure:
    instruction: "Listen and select what you hear."
    correct_option: "To a certain extent, it must be acknowledged that it's a problem."
    distractors: ["It's completely true that it's a problem.", "It's not true at all that it's a problem.", "In general, it's a problem."]
    accepted_answers: [{value: "To a certain extent, it must be acknowledged that it's a problem.", status: correct}]
    feedback: "Dans une certaine mesure, il faut reconnaître que c'est un problème means to a certain extent, it must be acknowledged that it's a problem."
  fr.b2.unit06.lesson02.exercise03.match_nuance_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"dans une certaine mesure": "to a certain extent", "il faut reconnaître que": "it must be acknowledged that", "d'un côté ... de l'autre": "on one hand ... on the other", gaspiller: "to waste", "la nourriture": "the food", "un problème important": "an important problem"}
        status: correct
    feedback: "These are qualifiers and food-waste vocabulary: each connector softens a claim rather than stating it flat."
  fr.b2.unit06.lesson02.exercise04.order_reconnaitre:
    instruction: "Put the words in order: It must be acknowledged that it's a problem."
    accepted_answers:
      - {value: "Il faut reconnaître que c'est un problème", status: correct}
    feedback: "Il faut reconnaître que c'est un problème means it must be acknowledged that it's a problem."
  fr.b2.unit06.lesson02.exercise05.translate_certaine_mesure:
    instruction: "Translate into French, using dans une certaine mesure: To a certain extent, you're right."
    accepted_answers:
      - {value: "Dans une certaine mesure, tu as raison", status: correct}
      - {value: "Dans une certaine mesure tu as raison", status: correct}
      - {value: "Tu as raison dans une certaine mesure", status: correct}
      - {value: "Dans une certaine mesure, vous avez raison", status: correct}
    feedback: "Dans une certaine mesure, tu as raison means to a certain extent, you're right."
  fr.b2.unit06.lesson02.exercise06.write_reconnaitre:
    instruction: "Write in French, using il faut reconnaître que: It must be acknowledged that it's a problem."
    accepted_answers:
      - {value: "Il faut reconnaître que c'est un problème", status: correct}
    feedback: "Il faut reconnaître que c'est un problème means it must be acknowledged that it's a problem."
  fr.b2.unit06.lesson02.exercise07.translate_dun_cote:
    instruction: "Translate into French, using d'un côté ... de l'autre: On one hand, it's a problem. On the other, it's important."
    accepted_answers:
      - {value: "D'un côté, c'est un problème. De l'autre, c'est important.", status: correct}
      - {value: "D'un côté c'est un problème. De l'autre c'est important.", status: correct}
      - {value: "D'un côté, c'est un problème, de l'autre, c'est important.", status: correct}
    feedback: "D'un côté, c'est un problème. De l'autre, c'est important. means on one hand, it's a problem; on the other, it's important."

  fr.b2.unit06.lesson03.exercise01.recognize_certes:
    instruction: "What does this word mean?"
    correct_option: "granted / certainly"
    distractors: ["however", "but", "because"]
    accepted_answers: [{value: "granted / certainly", status: correct}]
    feedback: "Certes means granted / certainly -- it concedes a point without abandoning your own."
  fr.b2.unit06.lesson03.exercise02.listen_certes_mais:
    instruction: "Listen and select what you hear."
