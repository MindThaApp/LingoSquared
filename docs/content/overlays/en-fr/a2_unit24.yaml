course:
  title: "French A2"
  description: "Making a complaint in a shop, explaining what is wrong, and asking for a refund or exchange."

units:
  fr.a2.unit24.reclamation:
    title: "Making a complaint"

lessons:
  fr.a2.unit24.lesson01.expliquer_probleme:
    title: "Explaining the problem"
  fr.a2.unit24.lesson02.demander_solution:
    title: "Asking for an exchange or refund"

teaching:
  fr.a2.unit24.lesson01.teach.reclamation:
    title: "A complaint"
    gloss: "a complaint"
    note: "*Une réclamation* is the standard customer-service word for a formal complaint."
    example_gloss: "I would like to make a complaint to customer service."
  fr.a2.unit24.lesson01.teach.ne_fonctionne_pas:
    title: "Does not work"
    gloss: "does not work"
    note: "*Fonctionner* is the neutral verb for a machine or device working."
    example_gloss: "This kitchen scale does not work."
  fr.a2.unit24.lesson01.teach.ticket_caisse:
    title: "The receipt"
    gloss: "the receipt"
    note: "*Le ticket de caisse* is a store receipt, not a travel ticket."
    example_gloss: "I kept the receipt for the exchange."
  fr.a2.unit24.lesson01.teach.ecran:
    title: "The screen"
    gloss: "the screen"
    note: "*L'écran reste noir* is a clear way to describe a screen that will not turn on."
    example_gloss: "When I turn it on, the screen stays black."
  fr.a2.unit24.lesson01.teach.produit_defectueux:
    title: "A faulty product"
    gloss: "a faulty product"
    note: "*Défectueux* is the formal retail word for faulty or defective."
    example_gloss: "The shop takes back faulty products."
  fr.a2.unit24.lesson01.teach.remboursement:
    title: "A refund"
    gloss: "a refund"
    note: "*Demander un remboursement* is the normal polite phrase for asking for your money back."
    example_gloss: "I would like to ask for a refund for this faulty product."
  fr.a2.unit24.lesson01.teach.return_policy:
    title: "Read the return policy"
    gloss: "Faulty products can be exchanged or refunded for fourteen days with the receipt."
    note: "French return policies often use passive forms: *peuvent être échangés ou remboursés*."

  fr.a2.unit24.lesson02.teach.je_voudrais:
    title: "I would like..."
    gloss: "I would like..."
    note: "*Je voudrais* is polite and firm, better than *je veux* in a shop complaint."
    example_gloss: "I would like an exchange, please."
  fr.a2.unit24.lesson02.teach.remboursement:
    title: "A refund"
    gloss: "a refund"
    note: "*Demander un remboursement* means to ask for a refund; it is not as aggressive as English demand."
    example_gloss: "Can I ask for a refund?"
  fr.a2.unit24.lesson02.teach.echange:
    title: "An exchange"
    gloss: "an exchange"
    note: "*Un échange* means replacing the item with another one."
    example_gloss: "The salesperson offers an exchange right away."
  fr.a2.unit24.lesson02.teach.dans_ce_cas:
    title: "In that case"
    gloss: "in that case"
    note: "*Dans ce cas* introduces the shop employee's solution after hearing the problem."
    example_gloss: "In that case, I can offer you an exchange."
  fr.a2.unit24.lesson02.teach.dialogue_line01:
    title: "State the problem"
    gloss: "Inès says she bought the kitchen scale yesterday, but it does not work."
    note: "The complaint gives both purchase timing and the problem."
  fr.a2.unit24.lesson02.teach.dialogue_line02:
    title: "Ask for the receipt"
    gloss: "The salesperson apologizes and asks whether she has the receipt."
    note: "The employee uses *vous* because this is a service interaction."
  fr.a2.unit24.lesson02.teach.dialogue_line03:
    title: "Explain the fault"
    gloss: "Inès says yes, here it is; when she turns it on, the screen stays black."
    note: "A specific fault makes the complaint clear."
  fr.a2.unit24.lesson02.teach.dialogue_line04:
    title: "Offer a solution"
    gloss: "The salesperson offers an exchange right away."
    note: "This directly covers the listening requirement: identify the offered resolution."
  fr.a2.unit24.lesson02.teach.dialogue_line05:
    title: "Request the exchange"
    gloss: "Inès says she would like an exchange, and asks whether she can request a refund if the new model does not work."
    note: "She stays polite but protects her option."
  fr.a2.unit24.lesson02.teach.dialogue_line06:
    title: "Confirm the policy"
    gloss: "The salesperson says yes: she has fourteen days to ask for an exchange or refund with the receipt."
    note: "This links the spoken exchange to the written return policy."

exercises:
  fr.a2.unit24.lesson01.exercise01.select_ne_fonctionne_pas:
    instruction: "What problem does this sentence describe?"
    correct_option: "The kitchen scale does not work"
    distractors: ["The kitchen scale is too expensive", "The receipt is missing"]
    accepted_answers: ["The kitchen scale does not work"]
  fr.a2.unit24.lesson01.exercise02.match_complaint_vocab:
    instruction: "Match each French complaint word or phrase to English."
    correct_response:
      "une réclamation": "a complaint"
      "ne fonctionne pas": "does not work"
      "le ticket de caisse": "the receipt"
      "l'écran": "the screen"
      "un produit défectueux": "a faulty product"
      "un remboursement": "a refund"
  fr.a2.unit24.lesson01.exercise03.order_balance:
    instruction: "Build the sentence: This kitchen scale does not work."
    correct_response: ["Cette", "balance", "de", "cuisine", "ne", "fonctionne", "pas"]
  fr.a2.unit24.lesson01.exercise04.fill_ticket:
    instruction: "Complete the sentence with the French phrase for receipt."
    accepted_answers: ["ticket de caisse"]
  fr.a2.unit24.lesson01.exercise05.read_return_policy:
    instruction: "According to the return policy, what is required for a refund or exchange?"
    correct_option: "The receipt, within fourteen days"
    distractors: ["A photo of the shop window", "A repair appointment after one month"]
    accepted_answers: ["The receipt, within fourteen days"]

  fr.a2.unit24.lesson02.exercise01.select_je_voudrais:
    instruction: "Which sentence politely asks for an exchange?"
    correct_option: "Je voudrais un échange, s'il vous plaît."
    distractors: ["Je demande fort un échange.", "Je suis un échange, s'il vous plaît."]
    accepted_answers: ["Je voudrais un échange, s'il vous plaît."]
  fr.a2.unit24.lesson02.exercise02.comprehend_offer:
    instruction: "Listen to the dialogue. What does the salesperson offer?"
    correct_option: "An exchange right away"
    distractors: ["A repair next month", "A discount on flour"]
    accepted_answers: ["An exchange right away"]
  fr.a2.unit24.lesson02.exercise03.match_solution_phrases:
    instruction: "Match each French solution phrase to English."
    correct_response:
      "Je voudrais...": "I would like..."
      "un remboursement": "a refund"
      "un échange": "an exchange"
      "dans ce cas": "in that case"
      "s'il vous plaît": "please"
      "demander": "to ask for"
  fr.a2.unit24.lesson02.exercise04.order_voudrais_echange:
    instruction: "Build the sentence: I would like an exchange, please."
    correct_response: ["Je", "voudrais", "un", "échange", "s'il", "vous", "plaît"]
  fr.a2.unit24.lesson02.exercise05.reply_make_complaint:
    instruction: "Take Inès's role. Say this sentence shape: *J'ai acheté cette balance hier, mais elle ne fonctionne pas. Je voudrais un échange.*"
    accepted_answers:
      - "J'ai acheté cette balance hier, mais elle ne fonctionne pas. Je voudrais un échange."
      - "Bonjour, j'ai acheté cette balance hier, mais elle ne fonctionne pas. Je voudrais un échange."
      - "J'ai acheté cette balance hier et elle ne fonctionne pas. Je voudrais un échange, s'il vous plaît."
  fr.a2.unit24.lesson02.exercise06.write_complaint_message:
    instruction: "Write this message shape: *Bonjour, j'ai acheté cette balance de cuisine hier, mais elle ne fonctionne pas. Je voudrais un remboursement, s'il vous plaît.*"
    accepted_answers:
      - "Bonjour, j'ai acheté cette balance de cuisine hier, mais elle ne fonctionne pas. Je voudrais un remboursement, s'il vous plaît."
      - "Bonjour, j'ai acheté cette balance de cuisine hier, mais elle ne fonctionne pas. Je voudrais un échange, s'il vous plaît."
      - "Bonjour, la balance de cuisine que j'ai achetée hier ne fonctionne pas. Je voudrais un remboursement, s'il vous plaît."
