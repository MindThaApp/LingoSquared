review:
  status: unreviewed
  required_next_reviewer: >-
    Native-French confirmation needed (DRAFT). Confirm the English glosses
    correctly convey the intended synthesis reading: both reviews AGREE the
    croissants are delicious, CONFLICT on the price (first review:
    reasonable, no figure given; second review: too expensive, backed by a
    concrete price -- three euros fifty), and the second review is the
    better-supported/more convincing one because it gives that concrete
    figure while the first only asserts. Confirm every matching_pairs
    right-hand gloss discriminates its left on real meaning, and that the
    culminating lesson06 writing/speaking answers accept the punctuation
    forms a correct learner would actually produce. See the realization
    file's review block for the full priority list.
  notes: >-
    Overlay for fr's B2 synthesis unit (the FINAL unit of the fr B2 tier),
    authored alongside the realization; part of a 4-way parallel dispatch,
    no sibling unit (05/06/07) or sibling-direction file consulted. English
    speakers' real interference risks for this outcome: (1) attributing
    verbs -- 'dire que' and 'affirmer que' both land on English "say/claim"
    but 'affirmer' carries a stronger, more assertive register than plain
    'dire', glossed to keep them apart; (2) 'tandis que' is the
    CONTRASTIVE 'whereas', not the purely temporal 'while' -- an English
    speaker may default to a temporal reading, flagged in lesson02; (3) the
    agreement/conflict frames are fixed collocations an English speaker
    will not build compositionally -- 'être d'accord sur', 'ne pas être
    d'accord sur' -- so the production prompts name the exact frame; (4)
    the judgement is an evaluation, not a summary: the culminating
    lesson06 writing prompt names all THREE required parts (agreement,
    conflict, reasoned judgement) and the exact frame for each so a
    correct answer is well-determined.

course:
  title: French B2
  description: >-
    Upper-intermediate French: defend a position, speculate about causes
    and consequences, express nuance, recount a complex sequence of events
    with shifting time reference, and synthesize and evaluate multiple
    sources -- attribute claims to their source, compare them, name where
    they agree and conflict, and give a reasoned judgement between them.

units:
  fr.b2.unit08.synthese:
    title: "Synthesis"
    description: Summarize and evaluate two sources -- attribute each claim, name where two customer reviews agree and where they conflict, weigh which is better supported, and write a synthesis that gives a reasoned judgement between them.

lessons:
  fr.b2.unit08.lesson01.qui_dit_quoi:
    title: "Who says what?"
  fr.b2.unit08.lesson02.comparer_les_avis:
    title: "Comparing the two reviews"
  fr.b2.unit08.lesson03.ou_sont_ils_daccord:
    title: "Where do they agree?"
  fr.b2.unit08.lesson04.ou_sont_ils_en_desaccord:
    title: "Where do they disagree?"
  fr.b2.unit08.lesson05.les_deux_avis_cote_a_cote:
    title: "The two reviews side by side"
  fr.b2.unit08.lesson06.la_synthese_complete:
    title: "The full synthesis"

teaching:
  fr.b2.unit08.lesson01.teach.deux_avis:
    title: "There are two reviews online about the shop."
    gloss: "There are two reviews online about the shop."
    note: "The situation the whole unit synthesizes: two anonymous customers have reviewed Inès's shop online, and you have to weigh what they say. *Il y a* = 'there is/are'; *en ligne* = 'online'; *un avis* = 'a review' (plural is the same: *avis*)."
  fr.b2.unit08.lesson01.teach.premier_deuxieme:
    title: "the first review / the second review"
    gloss: ["the first review", "the second review"]
    note: "*Premier* / *deuxième* = 'first' / 'second' -- your two sources for this whole unit, never named, always distinguished this way."
    example_gloss: ["The first review talks about the croissants.", "The second review talks about the price."]
  fr.b2.unit08.lesson01.teach.le_prix:
    title: "the price"
    gloss: "the price"
    note: "*Le prix* = 'the price' -- the point the two reviews will end up disagreeing about."
    example_gloss: "The price of a croissant is important."
  fr.b2.unit08.lesson01.teach.delicieux:
    title: delicious
    gloss: delicious
    note: "*Délicieux* -- the point the two reviews will end up AGREEING about."
    example_gloss: "The croissants are delicious."
  fr.b2.unit08.lesson01.teach.raisonnable:
    title: reasonable
    gloss: reasonable
    note: "*Raisonnable* = 'reasonable' -- the first review's claim about the price, with no figure to back it up."
    example_gloss: "The price is reasonable."
  fr.b2.unit08.lesson01.teach.cher:
    title: expensive
    gloss: expensive
    note: "*Cher* = 'expensive' (plural *chers*) -- the second review's claim about the price, opposite of *raisonnable*."
    example_gloss: "The prices are too expensive."
  fr.b2.unit08.lesson01.teach.dire:
    title: "to say"
    gloss: "to say (says)"
    note: "*Dire* ('to say', he/she form *dit*) attributes a claim to a source: *Le premier avis dit que...*. *Que* opens the reported clause."
    example_gloss: "The first review says that the croissants are delicious."
  fr.b2.unit08.lesson01.teach.affirmer:
    title: "to claim / assert"
    gloss: "to claim / assert (claims)"
    note: "*Affirmer* ('to claim', form *affirme*) is a touch more assertive than plain *dire* -- it reports a claim the source is standing firmly behind: *Le deuxième avis affirme que...*."
    example_gloss: "The second review claims that the prices are too expensive."
  fr.b2.unit08.lesson01.teach.claim_model:
    title: "The first review says that the croissants are delicious. The second review claims that the prices are too expensive."
    gloss: "The first review says that the croissants are delicious. The second review claims that the prices are too expensive."
  fr.b2.unit08.lesson01.teach.grammar_attribuer:
    title: "Selon, dire que and affirmer que let you attribute a claim to its source, without asserting it yourself. This is the first move of synthesis: reporting who says what."
    gloss: "Selon, dire que and affirmer que let you attribute a claim to its source, without asserting it yourself. This is the first move of synthesis: reporting who says what."
    note: "*Selon* was already introduced in unit01 ('according to me'); here it works the same way pointed at a written source: *selon le premier avis*."

  fr.b2.unit08.lesson02.teach.compare_a:
    title: "compared to"
    gloss: "compared to"
    note: "*Comparé à X* = 'compared to X' -- lines one source up against the other before you state a difference."
    example_gloss: "Compared to the first review, the second is different."
  fr.b2.unit08.lesson02.teach.contrairement_a:
    title: "contrary to / unlike"
    gloss: "contrary to / unlike"
    note: "*Contrairement à X* = 'contrary to / unlike X' -- sets one source against the other before the contrasting claim."
    example_gloss: "Contrary to the first review, the second gives an exact price."
  fr.b2.unit08.lesson02.teach.aimer:
    title: "to like"
    gloss: "to like (like)"
    note: "*Aimer* ('to like', plural form *aiment*): *les deux avis aiment les croissants* ('both reviews like the croissants')."
    example_gloss: "Both reviews like the croissants."
  fr.b2.unit08.lesson02.teach.meme_facon:
    title: "in the same way"
    gloss: "in the same way"
    note: "*De la même façon* = 'in the same way' -- signals that the second source is about to confirm the first, not contradict it."
    example_gloss: "In the same way, the two reviews like the croissants."
  fr.b2.unit08.lesson02.teach.tandis_que:
    title: whereas
    gloss: "whereas (contrastive)"
    note: "Here *tandis que* is the CONTRASTIVE 'whereas', not the purely temporal 'while' -- it sets one source's claim against the other's: *..., tandis que le deuxième est négatif*."
    example_gloss: "The first review is positive, whereas the second is negative."
  fr.b2.unit08.lesson02.teach.positif:
    title: positive
    gloss: positive
    note: "*Positif* = 'positive' -- a compact label for one source's overall stance on a point."
    example_gloss: "The first review is positive about the price."
  fr.b2.unit08.lesson02.teach.negatif:
    title: negative
    gloss: negative
    note: "*Négatif* = 'negative' -- the opposite stance. *Le premier avis est positif, le deuxième est négatif* sums up a contrast in two words."
    example_gloss: "The second review is negative about the price."
  fr.b2.unit08.lesson02.teach.claim_model:
    title: "The first review is positive about the price, whereas the second is negative."
    gloss: "The first review is positive about the price, whereas the second is negative."
  fr.b2.unit08.lesson02.teach.grammar_comparer:
    title: "Comparé à and contrairement à set two reviews side by side. Tandis que marks a simultaneous contrast between them -- comparing is the second move of synthesis."
    gloss: "Comparé à and contrairement à set two reviews side by side. Tandis que marks a simultaneous contrast between them -- comparing is the second move of synthesis."

  fr.b2.unit08.lesson03.teach.etre_daccord_sur:
    title: "to agree on"
    gloss: "to agree on"
    note: "*Être d'accord sur X* = 'to agree on X' -- the fixed frame for naming a point of agreement: *Les deux avis sont d'accord sur les croissants*."
    example_gloss: "The two reviews agree on the croissants."
  fr.b2.unit08.lesson03.teach.souligner:
    title: "to underline / emphasize"
    gloss: "to underline / emphasize (underline)"
    note: "*Souligner* ('to underline', plural *soulignent*) -- when a source doesn't just mention a point but stresses it: *les deux avis soulignent que...*."
    example_gloss: "The two reviews underline that the croissants are delicious."
  fr.b2.unit08.lesson03.teach.le_point:
    title: "the point"
    gloss: "the point (at issue)"
    note: "*Le point* = 'the point (at issue)' -- lets you say exactly WHERE two sources agree or clash. *Ils* = 'they' (masculine plural, referring back to *les deux avis*)."
    example_gloss: "On this point, they agree."
  fr.b2.unit08.lesson03.teach.sur_ce_point:
    title: "on this point"
    gloss: "on this point"
    note: "*Sur ce point* = 'on this point' -- names the exact issue you're pointing at."
  fr.b2.unit08.lesson03.teach.claim_model:
    title: "The two reviews agree on the croissants: they underline that they are delicious."
    gloss: "The two reviews agree on the croissants: they underline that they are delicious."
  fr.b2.unit08.lesson03.teach.grammar_accord:
    title: "être d'accord sur X and souligner que... name a point of agreement between two sources: the second move of synthesis."
    gloss: "être d'accord sur X and souligner que... name a point of agreement between two sources: the second move of synthesis."

  fr.b2.unit08.lesson04.teach.ne_pas_daccord_sur:
    title: "to not agree on"
    gloss: "to disagree on"
    note: "The negation of lesson03's *être d'accord sur*: *ils ne sont pas d'accord sur le prix* ('they don't agree on the price')."
    example_gloss: "They don't agree on the price."
  fr.b2.unit08.lesson04.teach.par_contre:
    title: "on the other hand / however"
    gloss: "on the other hand / however"
    note: "*Par contre* -- a strong contrast marker, slightly more informal than *en revanche* (already known from unit01), used the same way."
    example_gloss: "The first review says the price is reasonable. On the other hand, the second review says it's too expensive."
  fr.b2.unit08.lesson04.teach.en_revanche_review:
    title: "however / by contrast"
    gloss: "however / by contrast"
    note: "Reused from unit01 (there glossed 'by contrast'): the more formal-register twin of *par contre*, equally natural here."
    example_gloss: "The first review says the price is reasonable; by contrast, the second says it's too expensive."
  fr.b2.unit08.lesson04.teach.couter:
    title: "to cost"
    gloss: "to cost (costs)"
    note: "*Coûter* ('to cost', form *coûte*) -- how a review backs a price claim with a real figure: *un croissant coûte...*."
    example_gloss: "A croissant costs two euros."
  fr.b2.unit08.lesson04.teach.trois_euros_cinquante:
    title: "three euros fifty"
    gloss: "three euros fifty"
    note: "The exact price the second review names -- the concrete detail that makes it the better-supported source."
  fr.b2.unit08.lesson04.teach.exact:
    title: exact
    gloss: exact
    note: "*Exact* = 'exact' -- a review that gives *un prix exact* backs its claim with real evidence, unlike one that only asserts."
    example_gloss: "The second review gives an exact price."
  fr.b2.unit08.lesson04.teach.donner:
    title: "to give"
    gloss: "to give (gives)"
    note: "*Donner* ('to give', form *donne*): *le deuxième avis donne un prix exact* ('the second review gives an exact price')."
    example_gloss: "The second review gives an example."
  fr.b2.unit08.lesson04.teach.claim_model:
    title: "The first review says the price is reasonable. On the other hand, the second review claims a croissant costs three euros fifty."
    gloss: "The first review says the price is reasonable. On the other hand, the second review claims a croissant costs three euros fifty."
  fr.b2.unit08.lesson04.teach.grammar_desaccord:
    title: "En revanche and par contre mark a sharp contrast between two claims. Ne pas être d'accord sur names the disagreement directly -- the third move of synthesis."
    gloss: "En revanche and par contre mark a sharp contrast between two claims. Ne pas être d'accord sur names the disagreement directly -- the third move of synthesis."

  fr.b2.unit08.lesson05.teach.avis_un:
    title: "Review 1"
    gloss: "The croissants are delicious. The prices are reasonable. I'll come back soon!"
    glosses:
      croissants: "the croissants"
      délicieux: delicious
      prix: "the prices"
      raisonnables: reasonable
      reviendrai: "will come back"
      bientôt: soon
  fr.b2.unit08.lesson05.teach.avis_deux:
    title: "Review 2"
    gloss: "The croissants are delicious, that's true. But the prices are too expensive: a croissant costs three euros fifty. For that price, I expect more choice."
    glosses:
      croissants: "the croissants"
      croissant: "a croissant"
      délicieux: delicious
      vrai: "true"
      prix: "the prices"
      chers: expensive
      coûte: costs
      trois: three
      euros: euros
      cinquante: fifty
      pour: for
      "j'attends": "I expect"
      choix: choice
  fr.b2.unit08.lesson05.teach.precis:
    title: precise
    gloss: precise
    note: "*Précis* = 'precise / specific' -- what makes the second review's price claim stronger: it gives a real figure, not just an adjective."
    example_gloss: "The second review is more precise."
  fr.b2.unit08.lesson05.teach.donner_une_raison:
    title: "to give a reason"
    gloss: "to give a reason"
    note: "*Une raison* was already introduced in unit02 (*avoir raison*, 'to be right'); here it's the noun 'a reason' -- what the second review provides and the first does not."
    example_gloss: "The second review gives a reason: the exact price."
  fr.b2.unit08.lesson05.teach.grammar_lecture:
    title: "The two reviews agree on the croissants, but not on the price. The second review is more precise: it gives an exact price (three euros fifty); the first gives no figure at all."
    gloss: "The two reviews agree on the croissants, but not on the price. The second review is more precise: it gives an exact price (three euros fifty); the first gives no figure at all."

  fr.b2.unit08.lesson06.teach.oui:
    title: "yes"
    gloss: "yes"
    example_gloss: "Yes, the croissants are delicious."
  fr.b2.unit08.lesson06.teach.donc:
    title: "so / therefore"
    gloss: "so / therefore"
    note: "*Donc* = 'so / therefore' -- draws the conclusion of a synthesis: *Donc, le deuxième avis est le plus convaincant*."
    example_gloss: "So, the second review is the most convincing."
  fr.b2.unit08.lesson06.teach.convaincant:
    title: convincing
    gloss: convincing
    note: "*Convaincant* = 'convincing' -- the core judgement word: *le plus convaincant* ('the most convincing'). This is where you evaluate, not just summarize."
    example_gloss: "The second review is the most convincing."
  fr.b2.unit08.lesson06.teach.a_ton_avis:
    title: "in your opinion"
    gloss: "in your opinion"
    note: "*À ton avis* = 'in your opinion' -- reuses *avis* in its other everyday sense ('opinion'), addressed informally with *ton* (tu-register 'your')."
  fr.b2.unit08.lesson06.teach.dans_lensemble:
    title: "overall"
    gloss: "overall / on the whole"
    note: "*Dans l'ensemble* = 'overall / on the whole' -- a natural way to open a final verdict."
    example_gloss: "Overall, the second review is the most convincing."
  fr.b2.unit08.lesson06.teach.dialogue_mathieu_accord:
    title: "Mathieu: So, do the two reviews agree?"
    gloss: "Mathieu: So, do the two reviews agree?"
  fr.b2.unit08.lesson06.teach.dialogue_ines_croissants:
    title: "Inès: About the croissants, yes: both reviews say they're delicious."
    gloss: "Inès: About the croissants, yes: both reviews say they're delicious."
  fr.b2.unit08.lesson06.teach.dialogue_mathieu_prix:
    title: "Mathieu: And about the price?"
    gloss: "Mathieu: And about the price?"
  fr.b2.unit08.lesson06.teach.dialogue_ines_desaccord:
    title: "Inès: There, they disagree. The first says it's reasonable; the second claims it's too expensive."
    gloss: "Inès: There, they disagree. The first says it's reasonable; the second claims it's too expensive."
  fr.b2.unit08.lesson06.teach.dialogue_mathieu_raison:
    title: "Mathieu: Who's right, in your opinion?"
    gloss: "Mathieu: Who's right, in your opinion?"
  fr.b2.unit08.lesson06.teach.dialogue_ines_jugement:
    title: "Inès: The second review, I think. It's more precise: it gives an exact price, three euros fifty. The first gives no detail. So, the second review is the most convincing."
    gloss: "Inès: The second review, I think. It's more precise: it gives an exact price, three euros fifty. The first gives no detail. So, the second review is the most convincing."
  fr.b2.unit08.lesson06.teach.grammar_recap:
    title: "A full synthesis names three things: the agreement (the two reviews agree on...), the disagreement (they don't agree on...), and a reasoned judgement (the most convincing is..., because...)."
    gloss: "A full synthesis names three things: the agreement (the two reviews agree on...), the disagreement (they don't agree on...), and a reasoned judgement (the most convincing is..., because...)."
    note: "This dialogue is the whole unit in miniature: Inès moves through all three moves of synthesis in one natural conversation, exactly what the speaking and writing tasks ask you to reproduce."

exercises:
  fr.b2.unit08.lesson01.exercise01.recognize_avis:
    instruction: "What does this word mean?"
    correct_option: review
    distractors: [price, customer, shop]
    accepted_answers: [{value: review, status: correct}]
    feedback: "Avis means review -- what the whole unit is about."
  fr.b2.unit08.lesson01.exercise02.listen_premier_avis:
    instruction: "Listen and select what you hear."
    correct_option: "The first review says that the croissants are delicious."
    distractors: ["The first review says that the prices are delicious.", "The second review says that the croissants are delicious.", "The first review says that the croissants are expensive."]
    accepted_answers: [{value: "The first review says that the croissants are delicious.", status: correct}]
    feedback: "Le premier avis dit que les croissants sont délicieux means the first review says that the croissants are delicious."
  fr.b2.unit08.lesson01.exercise03.match_attribution_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {avis: review, "en ligne": online, prix: price, raisonnable: reasonable, cher: expensive, délicieux: delicious, "dit que": "says that", "affirme que": "claims that"}
        status: correct
    feedback: "These are this lesson's words for attributing a claim to a source."
  fr.b2.unit08.lesson01.exercise04.order_premier_avis:
    instruction: "Put the words in order: The first review says that the croissants are delicious."
    accepted_answers:
      - {value: "Le premier avis dit que les croissants sont délicieux", status: correct}
    feedback: "Le premier avis dit que les croissants sont délicieux means the first review says that the croissants are delicious."
  fr.b2.unit08.lesson01.exercise05.translate_affirme:
    instruction: "Translate into French, using affirmer: The second review claims that the prices are too expensive."
    accepted_answers:
      - {value: "Le deuxième avis affirme que les prix sont trop chers", status: correct}
    feedback: "Le deuxième avis affirme que les prix sont trop chers means the second review claims that the prices are too expensive."
  fr.b2.unit08.lesson01.exercise06.speak_premier_avis:
    instruction: "Say aloud in French: The first review says that the croissants are delicious."
    accepted_answers:
      - {value: "Le premier avis dit que les croissants sont délicieux", status: correct}
    feedback: "Le premier avis dit que les croissants sont délicieux means the first review says that the croissants are delicious."
  fr.b2.unit08.lesson01.exercise07.write_prix_raisonnables:
    instruction: "Write in French: The prices are reasonable."
    accepted_answers:
      - {value: "Les prix sont raisonnables", status: correct}
    feedback: "Les prix sont raisonnables means the prices are reasonable."
  fr.b2.unit08.lesson01.exercise08.dictation_premier_avis:
    instruction: "Type what you hear."
    correct_response: "Le premier avis dit que les croissants sont délicieux"
    orthography_strict: true
    feedback: "You heard Le premier avis dit que les croissants sont délicieux — the first review says that the croissants are delicious."

  fr.b2.unit08.lesson02.exercise01.recognize_tandis_que:
    instruction: "What does this phrase mean here?"
    correct_option: "whereas (contrast)"
    distractors: ["because", "so / therefore", "the same"]
    accepted_answers: [{value: "whereas (contrast)", status: correct}]
    feedback: "Here tandis que is the contrastive 'whereas' -- it sets one review's claim against the other's."
  fr.b2.unit08.lesson02.exercise02.listen_comparaison_prix:
    instruction: "Listen and select what you hear."
    correct_option: "The first review is positive about the price, whereas the second is negative."
    distractors: ["The first review is negative about the price, whereas the second is positive.", "Both reviews are positive about the price.", "The first review is positive about the croissants, whereas the second is negative."]
    accepted_answers: [{value: "The first review is positive about the price, whereas the second is negative.", status: correct}]
    feedback: "Le premier avis est positif sur le prix, tandis que le deuxième est négatif means the first review is positive about the price, whereas the second is negative."
  fr.b2.unit08.lesson02.exercise03.match_comparison_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"comparé à": "compared to", "contrairement à": "contrary to / unlike", "de la même façon": "in the same way", "tandis que": whereas, positif: positive, négatif: negative, aimer: "to like"}
        status: correct
    feedback: "These line two sources up: comparé à / contrairement à / de la même façon / tandis que for what compares or separates them."
  fr.b2.unit08.lesson02.exercise04.order_meme_facon:
    instruction: "Put the words in order: In the same way, the two reviews like the croissants."
    accepted_answers:
      - {value: "De la même façon les deux avis aiment les croissants", status: correct}
    feedback: "De la même façon, les deux avis aiment les croissants means in the same way, the two reviews like the croissants."
  fr.b2.unit08.lesson02.exercise05.translate_meme_facon:
    instruction: "Translate into French, using de la même façon: In the same way, the two reviews like the croissants."
    accepted_answers:
      - {value: "De la même façon, les deux avis aiment les croissants", status: correct}
      - {value: "De la même façon les deux avis aiment les croissants", status: correct}
    feedback: "De la même façon, les deux avis aiment les croissants means in the same way, the two reviews like the croissants."
  fr.b2.unit08.lesson02.exercise06.translate_tandis_que:
    instruction: "Translate into French, using tandis que: The first review is positive about the price, whereas the second is negative."
    accepted_answers:
      - {value: "Le premier avis est positif sur le prix, tandis que le deuxième est négatif", status: correct}
      - {value: "Le premier avis est positif sur le prix tandis que le deuxième est négatif", status: correct}
    feedback: "Le premier avis est positif sur le prix, tandis que le deuxième est négatif means the first review is positive about the price, whereas the second is negative."
  fr.b2.unit08.lesson02.exercise07.write_contrairement_a:
    instruction: "Write in French, using contrairement à: Contrary to the first review, the second is negative about the price."
    accepted_answers:
