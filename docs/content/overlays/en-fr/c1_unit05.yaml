  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Overlay for French C1 unit 05 on counterfactual reasoning. English-speaker
    interference risks: confusing the present conditional (present consequence
    of a mixed conditional) with the past conditional (past hypothetical
    result), and writing an open production prompt that could be answered with
    several different counterfactual forms. The production exercises therefore
    name exact taught models and accept those strings with punctuation variants
    only where needed. No sibling-direction overlay was consulted.

course:
  title: French C1
  description: "Advanced French reasoning: past counterfactuals, mixed conditionals, and expressions of regret."

units:
  fr.c1.unit05.contrefactuel:
    title: "Counterfactual reasoning"
    description: "Reason about unreal situations: past conditionals, mixed conditionals, and regret for a past decision."

lessons:
  fr.c1.unit05.contrefactuel.lesson01.conditionnel_passe:
    title: "The past conditional"
  fr.c1.unit05.contrefactuel.lesson02.troisieme_type:
    title: "The third-type conditional"
  fr.c1.unit05.contrefactuel.lesson03.conditionnel_mixte:
    title: "The mixed conditional"
  fr.c1.unit05.contrefactuel.lesson04.regret:
    title: "Expressing regret"
  fr.c1.unit05.contrefactuel.lesson05.chaine_contrefactuelle:
    title: "The counterfactual chain"
  fr.c1.unit05.contrefactuel.lesson06.analyse_complete:
    title: "The complete analysis"

teaching:
  fr.c1.unit05.contrefactuel.lesson01.teach.avec_le_recul:
    title: "with hindsight"
    gloss: "with hindsight / in hindsight"
    note: "*Avec le recul* (with hindsight) opens a reflection on a past choice and sets up a counterfactual."
  fr.c1.unit05.contrefactuel.lesson01.teach.je_serais_partie:
    title: "I would have left earlier"
    gloss: "I would have left earlier"
    note: "*Je serais partie* is the first-person past conditional (*conditionnel passé*) of *partir*; *partie* agrees with the feminine speaker, and *plus tôt* means earlier."
  fr.c1.unit05.contrefactuel.lesson01.teach.jaurais_pu_demander:
    title: "I could have asked for more"
    gloss: "I could have asked for more"
    note: "*J'aurais pu* (I could have) is *avoir* in the conditional plus the past participle *pu*, followed by *demander davantage*."
  fr.c1.unit05.contrefactuel.lesson01.teach.tu_aurais_du:
    title: "you should have thought about it"
    gloss: "you should have thought about it"
    note: "*Tu aurais dû* (you should have) keeps informal *tu*: *aurais* is the second-person conditional of *avoir*, and *y penser* means to think about it."
  fr.c1.unit05.contrefactuel.lesson01.teach.modele_conditionnel_passe:
    title: "A past-conditional reflection"
    gloss: "With hindsight, I would have left earlier and could have asked for more."
    note: "The past conditional describes what did not actually happen: *je serais partie* and *j'aurais pu* are both hypothetical."

  fr.c1.unit05.contrefactuel.lesson02.teach.si_javais_accepte:
    title: "if I had accepted the offer"
    gloss: "if I had accepted the offer"
    note: "*Si j'avais accepté* uses the *plus-que-parfait* (pluperfect) for a condition that did not come true."
  fr.c1.unit05.contrefactuel.lesson02.teach.je_naurais_jamais_rencontre:
    title: "I would never have met Mathieu"
    gloss: "I would never have met Mathieu"
    note: "*Je n'aurais jamais rencontré Mathieu* is the past conditional result; *jamais* (never) strengthens the counterfactual."
  fr.c1.unit05.contrefactuel.lesson02.teach.si_jetais_reste:
    title: "if I had stayed in Paris"
    gloss: "if I had stayed in Paris"
    note: "*Si j'étais restée* (if I had stayed) names the alternative past that never happened; *restée* agrees with the feminine speaker."
  fr.c1.unit05.contrefactuel.lesson02.teach.modele_troisieme_type:
    title: "A third-type conditional"
    gloss: "If I had accepted the offer in Paris, I would never have met Mathieu."
    note: "This third-type conditional pairs a past unreal condition (*Si j'avais accepté...*) with a past hypothetical result (*je n'aurais jamais rencontré...*)."

  fr.c1.unit05.contrefactuel.lesson03.teach.si_je_netais_pas_venue:
    title: "if I had not come to Lyon"
    gloss: "if I had not come to Lyon"
    note: "*Si je n'étais pas venue à Lyon* states the past unreal condition (in fact, she did come to Lyon); *venue* agrees with the feminine speaker."
  fr.c1.unit05.contrefactuel.lesson03.teach.je_ne_travaillerais_pas:
    title: "I would not be working in pastry now"
    gloss: "I would not be working in pastry now"
    note: "*Je ne travaillerais pas* uses the *conditionnel présent* to express a present consequence of a past condition."
  fr.c1.unit05.contrefactuel.lesson03.teach.tout_serait_different:
    title: "everything would be different"
    gloss: "everything would be different"
    note: "*Tout serait différent* (everything would be different) is another present-consequence form, this time with *serait*."
  fr.c1.unit05.contrefactuel.lesson03.teach.modele_mixte:
    title: "A mixed conditional"
    gloss: "If I had not come to Lyon, I would not be working in pastry now."
    note: "A mixed conditional links a past condition to a present consequence (*je ne travaillerais pas... maintenant*)."

  fr.c1.unit05.contrefactuel.lesson04.teach.je_naurais_pas_du:
    title: "I should not have waited"
    gloss: "I should not have waited"
    note: "*Je n'aurais pas dû* (I should not have) is a classic expression of regret for a past action."
  fr.c1.unit05.contrefactuel.lesson04.teach.le_dernier_moment:
    title: "the last moment"
    gloss: "the last moment"
    note: "*Le dernier moment* (the last moment) names the delay that is being regretted."
  fr.c1.unit05.contrefactuel.lesson04.teach.pour_me_decider:
    title: "to make up my mind"
    gloss: "to make up my mind"
    note: "*Pour me décider* (to make up my mind) states the purpose Inès delayed over."
  fr.c1.unit05.contrefactuel.lesson04.teach.si_seulement_javais:
    title: "if only I had thought more"
    gloss: "if only I had thought more"
    note: "*Si seulement j'avais réfléchi davantage* (if only I had thought more) is the *si seulement* regret pattern."
  fr.c1.unit05.contrefactuel.lesson04.teach.modele_regret:
    title: "An expression of regret"
    gloss: "I should not have waited until the last moment to make up my mind."
    note: "This sentence regrets the delay in deciding — the regret is about the timing, not about the decision itself."

  fr.c1.unit05.contrefactuel.lesson05.teach.le_fait:
    title: "I chose Lyon and I am happy"
    gloss: "I chose Lyon and I am happy"
    note: "*J'ai choisi Lyon et je suis contente* states the real timeline: the fact that actually happened."
  fr.c1.unit05.contrefactuel.lesson05.teach.condition_passee:
    title: "if I had chosen Paris"
    gloss: "if I had chosen Paris"
    note: "*Si j'avais choisi Paris* is the unreal past alternative to the real choice."
  fr.c1.unit05.contrefactuel.lesson05.teach.consequence_presente:
    title: "I would not be here in Lyon"
    gloss: "I would not be here in Lyon"
    note: "*Je ne serais pas ici à Lyon* is the present consequence of that unreal past."
  fr.c1.unit05.contrefactuel.lesson05.teach.chaine_modele:
    title: "A counterfactual chain"
    gloss: "If I had chosen Paris, I would not be here in Lyon with you."
    note: "The chain links an unreal past condition to a present consequence, distinguishing fact from hypothesis."

  fr.c1.unit05.contrefactuel.lesson06.teach.modele_complet:
    title: "The complete analysis"
    gloss: "If I had accepted the offer in Paris, I would never have met Mathieu. If I had not come to Lyon, I would not be working in pastry now. I should not have waited until the last moment to make up my mind."
    note: "This is the exact model for the final speaking and writing tasks: a past counterfactual, a mixed conditional, and an expression of regret, in that order."
  fr.c1.unit05.contrefactuel.lesson06.teach.analyse_contrefactuelle:
    title: "the counterfactual analysis"
    gloss: "the counterfactual analysis"
    note: "*L'analyse contrefactuelle* (counterfactual analysis) is the written product this outcome asks you to produce."
    example_gloss: "I wrote my counterfactual analysis."

exercises:
  fr.c1.unit05.contrefactuel.lesson01.exercise01.recognize_conditionnel:
    instruction: "Which French form expresses what you would have done in hindsight?"
    correct_option: "je serais partie plus tôt"
    distractors: ["je suis partie plus tôt", "je partais plus tôt", "je partirai plus tôt"]
    accepted_answers: [{value: "je serais partie plus tôt", status: correct}]
    feedback: "*Je serais partie plus tôt* means I would have left earlier — the past conditional."
  fr.c1.unit05.contrefactuel.lesson01.exercise02.listen_conditionnel:
    instruction: "Listen and select what you hear."
    correct_option: "With hindsight, I would have left earlier and could have asked for more."
    distractors: ["With hindsight, I will leave earlier and could ask for more.", "With hindsight, I left earlier and could have asked for more.", "With hindsight, I would have left earlier but could not ask for more."]
    accepted_answers: [{value: "With hindsight, I would have left earlier and could have asked for more.", status: correct}]
    feedback: "Avec le recul, je serais partie plus tôt et j'aurais pu demander davantage means with hindsight, I would have left earlier and could have asked for more."
  fr.c1.unit05.contrefactuel.lesson01.exercise03.match_conditionnel:
    instruction: "Match each French past-conditional element to its English meaning."
    accepted_answers:
      - value: {"avec le recul": "with hindsight", "je serais partie plus tôt": "I would have left earlier", "j'aurais pu demander davantage": "I could have asked for more", "tu aurais dû y penser": "you should have thought about it", "y penser": "to think about it", "davantage": "more"}
        status: correct
    feedback: "These phrases build the past conditional that describes an unreal alternative."
  fr.c1.unit05.contrefactuel.lesson01.exercise04.order_conditionnel:
    instruction: "Put the French words in order to form the past conditional."
    accepted_answers:
      - {value: "j'aurais pu demander davantage", status: correct}
    feedback: "The complete phrase is j'aurais pu demander davantage — I could have asked for more."
  fr.c1.unit05.contrefactuel.lesson01.exercise05.write_conditionnel:
    instruction: "Write the exact taught sentence with the past conditional forms je serais partie and j'aurais pu."
    accepted_answers:
      - {value: "Avec le recul, je serais partie plus tôt et j'aurais pu demander davantage.", status: correct}
      - {value: "Avec le recul, je serais partie plus tôt et j'aurais pu demander davantage", status: correct}
    feedback: "Avec le recul, je serais partie plus tôt et j'aurais pu demander davantage."

