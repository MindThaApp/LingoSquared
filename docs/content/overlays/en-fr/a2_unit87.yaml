answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A2 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or liaison marks.
course:
  title: French A2
  description: Intermediate French continuing the Camille and Mathieu storyline, now with a grammar-led block on everyday functions.
  learning_goal: Ask permission and state rules with pouvoir, il faut, devoir, il est interdit de and pas besoin de.
units:
  fr.a2.unit87.est_ce_que_je_peux:
    title: May I?
    description: Ask whether something is allowed and say what is forbidden, what you must do and what you do not need to do.
lessons:
  fr.a2.unit87.lesson01.je_peux:
    title: May I?
  fr.a2.unit87.lesson02.oui_bien_sur:
    title: Yes, of course
  fr.a2.unit87.lesson03.il_faut:
    title: You have to
  fr.a2.unit87.lesson04.pas_besoin:
    title: No need to pay
  fr.a2.unit87.lesson05.message_de_camille:
    title: Camille's message
  fr.a2.unit87.lesson06.camille_et_mathieu:
    title: At the library
teaching:
  fr.a2.unit87.lesson01.teach.mots:
    title: Useful words
    gloss: to come in / to open / to use / the window / the phone / here
    example_gloss:
    - May I come in?
    - We can open the window.
    - You can use the phone.
    - Can we eat here?
  fr.a2.unit87.lesson01.teach.gn_pouvoir:
    title: Pouvoir in the present
    gloss: I can, you can, he can, we can, you can, they can
    note: '*Pouvoir* is irregular. *Je peux* and *tu peux* are the same; *il peut*; *nous pouvons*, *vous pouvez*; *ils peuvent*. It is followed by an infinitive.'
  fr.a2.unit87.lesson01.teach.gn_permission:
    title: Asking permission
    gloss: May I open the window? May I come in?
    note: 'To ask permission, use *est-ce que je peux* plus an infinitive. In spoken French you can also just raise your voice: *je peux entrer ?*'
  fr.a2.unit87.lesson01.teach.gn_on:
    title: On peut for everyone
    gloss: Can we eat here? Yes, we can.
    note: '*On peut* asks about what is allowed in general or for a group. *On* takes the same verb form as *il*.'
  fr.a2.unit87.lesson01.teach.phrase:
    title: Asking to come in
    gloss: May I come in?
  fr.a2.unit87.lesson02.teach.reponses:
    title: Answering a request
    gloss: of course / sorry / forbidden / allowed / to smoke / to eat
    example_gloss:
    - Yes, of course.
    - No, sorry.
    - It is forbidden.
    - Here, you can eat.
  fr.a2.unit87.lesson02.teach.gn_reponse:
    title: Saying yes or no politely
    gloss: Yes, of course. No, sorry, it is not possible.
    note: '*Oui, bien sûr* gives permission warmly. A polite refusal starts with *désolé* (a woman can say *désolée*; the pronunciation is the same).'
  fr.a2.unit87.lesson02.teach.gn_interdit:
    title: Il est interdit de
    gloss: It is forbidden to smoke. It is forbidden to eat here.
    note: '*Il est interdit de* plus an infinitive says what is not allowed. Short form: *c''est interdit*.'
  fr.a2.unit87.lesson02.teach.gn_nepaspouvoir:
    title: On ne peut pas
    gloss: You cannot smoke. You cannot eat here.
    note: '*On ne peut pas* plus an infinitive is a softer way to say something is not allowed. *Ne ... pas* wraps around *peut*.'
  fr.a2.unit87.lesson02.teach.phrase:
    title: A refusal
    gloss: No, sorry, it is forbidden.
  fr.a2.unit87.lesson03.teach.mots:
    title: Rule words
    gloss: to give back / to show / the card / the book / quietly / outside
    example_gloss:
    - You have to give the book back.
    - I have to show my card.
    - You have to speak quietly.
    - We eat outside.
  fr.a2.unit87.lesson03.teach.gn_ilfaut:
    title: Il faut
    gloss: You have to give the books back. You have to speak quietly.
    note: '*Il faut* plus an infinitive states a rule that applies to everyone. *Il* never changes: there is no *je faut*.'
  fr.a2.unit87.lesson03.teach.gn_devoir:
    title: Devoir
    gloss: I must, you must, he must, we must, you must, they must
    note: '*Devoir* plus an infinitive says who has to do something: *je dois montrer ma carte*.'
  fr.a2.unit87.lesson03.teach.gn_ilnefautpas:
    title: Il ne faut pas
    gloss: You must not eat here. You must not speak loudly.
    note: '*Il ne faut pas* and *ne pas devoir* both mean ''you must not''. The rule is a prohibition.'
  fr.a2.unit87.lesson03.teach.phrase:
    title: A rule
    gloss: You have to give the book back.
  fr.a2.unit87.lesson04.teach.mots:
    title: Words for needs
    gloss: to need / to pay / to book / the seat, the place / free
    example_gloss:
    - I need my card.
    - You do not need to pay.
    - It is free.
    - You can book a seat.
  fr.a2.unit87.lesson04.teach.gn_besoin:
    title: Pas besoin de
    gloss: You do not need to pay. You do not need to book.
    note: '*Ne ... pas besoin de* plus an infinitive means something is not necessary. In casual speech you can drop *ne*: *pas besoin de payer*.'
  fr.a2.unit87.lesson04.teach.gn_contraste:
    title: Forbidden or not necessary?
    gloss: You must not pay here. You do not need to pay here.
    note: '*Il ne faut pas* forbids; *pas besoin de* only says it is unnecessary. Compare: you must not smoke, but you do not need to pay.'
  fr.a2.unit87.lesson04.teach.gn_gratuit:
    title: Free of charge
    gloss: It is free, so no need to pay.
    note: '*Gratuit* explains why there is no need to pay. *Donc* means ''so''.'
  fr.a2.unit87.lesson04.teach.phrase:
    title: No need
    gloss: No need to pay.
  fr.a2.unit87.lesson05.teach.mots:
    title: Words for the message
    gloss: the library / to borrow / three / your (informal, feminine) / to use
    example_gloss:
    - I am at the library.
    - You can borrow three books.
    - You have to show your card.
  fr.a2.unit87.lesson05.teach.gn_liste:
    title: Listing the rules
    gloss: You have to speak quietly. It is forbidden to eat. You cannot use the phone.
    note: A list of rules can mix *il faut*, *il est interdit de* and *on ne peut pas*. They all take an infinitive.
  fr.a2.unit87.lesson05.teach.gn_mais:
    title: Contrast with mais
    gloss: You do not need to pay, but you have to show your card.
    note: '*Mais* joins something that is not necessary with something that is compulsory.'
  fr.a2.unit87.lesson05.teach.reading:
    title: Camille explains the library rules
    gloss: Hi Mathieu! I am at the library. You have to speak quietly, it is forbidden to eat and you cannot use the phone. You do not need to pay, but you have to show your card. You can borrow three books. Camille
    note: The message lists rules with five different structures.
    glosses:
      bibliothèque: library
      emprunter: to borrow
  fr.a2.unit87.lesson06.teach.q1:
    title: Mathieu asks
    gloss: 'Mathieu: Camille, may I eat here?'
  fr.a2.unit87.lesson06.teach.a1:
    title: Camille refuses
    gloss: 'Camille: No, sorry, it is forbidden. You have to eat outside.'
  fr.a2.unit87.lesson06.teach.q2:
    title: Mathieu asks again
    gloss: 'Mathieu: Okay. And can we borrow books?'
  fr.a2.unit87.lesson06.teach.a2:
    title: Camille explains
    gloss: 'Camille: Yes, you can borrow three books. You have to show your card.'
  fr.a2.unit87.lesson06.teach.q3:
    title: Mathieu asks about paying
    gloss: 'Mathieu: Do I have to pay?'
  fr.a2.unit87.lesson06.teach.a3:
    title: Camille reassures
    gloss: 'Camille: No, you do not need to pay. It is free.'
