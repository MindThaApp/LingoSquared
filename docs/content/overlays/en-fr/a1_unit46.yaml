teaching:
  fr.a1.unit46.lesson01.teach.l_appartement_le:
    title: Apartment, living room, bedroom
    gloss: the apartment, the living room, the bedroom
    note: '*L''appartement* is masculine and drops the *e* of *le*; *le salon* is masculine and *la chambre* is feminine.'
    example_gloss:
    - I have an apartment.
    - I have a living room.
    - I have a bedroom.
  fr.a1.unit46.lesson01.teach.la_cuisine_la:
    title: Kitchen, bathroom
    gloss: the kitchen, the bathroom
    note: '*La cuisine* and *la salle de bains* are both feminine.'
    example_gloss:
    - I have a kitchen.
    - I have a bathroom.
  fr.a1.unit46.lesson01.teach.j_ai_un:
    title: Stating you have an apartment
    gloss: I have an apartment.
    note: '*Avoir* (to have) is the natural verb for saying what home you have, as English uses ''have''. This is a general example; Mathieu''s own apartment (in Lyon) comes later in this unit.'
  fr.a1.unit46.lesson01.teach.j_ai_un_2:
    title: Listing all the rooms
    gloss: I have a living room, a bedroom, a kitchen, and a bathroom.
    note: Lists all four rooms from this lesson's vocabulary in one sentence, joined with commas and a final *et*.
  fr.a1.unit46.lesson02.teach.tu_as_combien:
    title: Asking how many rooms
    gloss: How many rooms do you have?
    note: '*Combien de* (how many) is followed by a plural noun: *combien de pièces*.'
  fr.a1.unit46.lesson02.teach.j_ai_deux:
    title: Stating a room count
    gloss: I have two bedrooms.
    note: '*Chambres* is the plural of *chambre*, formed regularly with a silent *-s*.'
  fr.a1.unit46.lesson02.teach.l_appartement_a:
    title: Stating a total room count
    gloss: The apartment has three rooms.
    note: '*Pièces* is a general word for rooms, not limited to bedrooms.'
  fr.a1.unit46.lesson03.teach.le_balcon_le:
    title: Balcony, garden
    gloss: the balcony, the garden
    note: '*Le balcon* and *le jardin* are both masculine.'
    example_gloss:
    - There is a balcony.
    - There is no garden.
  fr.a1.unit46.lesson03.teach.il_y_a:
    title: Saying something exists
    gloss: There is a balcony.
    note: '*Il y a* is the standard existential construction, equivalent to English ''there is''.'
  fr.a1.unit46.lesson03.teach.il_n_y:
    title: Saying something doesn't exist
    gloss: There is no garden.
    note: '*Pas de* negates an indefinite noun: *pas de jardin*, not *pas un jardin*.'
  fr.a1.unit46.lesson04.teach.cosy:
    title: Cozy
    gloss: cozy
    note: A very common, distinctively French adjective for a warm, pleasant atmosphere -- not a literal translation of any single English word.
    example_gloss: The apartment is small but cozy.
  fr.a1.unit46.lesson04.teach.l_appartement_est:
    title: A common description pattern
    gloss: The apartment is small but cozy.
    note: '*Petit mais cosy* is a very natural way French speakers describe a compact home positively.'
  fr.a1.unit46.lesson04.teach.le_salon_est:
    title: Describing a room's size
    gloss: The living room is big.
    note: '*Grand* describes one specific room, not the whole home; it agrees with *le salon*, which is masculine.'
  fr.a1.unit46.lesson04.teach.la_cuisine_est:
    title: Describing another room's size
    gloss: The kitchen is small.
    note: 'Same pattern as *grand* on the previous card, with another room: *la cuisine* is feminine, so *petite*.'
  fr.a1.unit46.lesson05.teach.appartement_a_lyon:
    title: Read a housing advertisement
    gloss: 'Apartment in Lyon: one bedroom, a living room, a kitchen, and a bathroom. There is a balcony, but no garden. The apartment is small but cozy.'
    note: Track the room count, which features are present or absent, and the overall impression given.
    glosses:
      Appartement: apartment
      chambre: bedroom
      salon: living room
      cuisine: kitchen
      bains: bathroom
      balcon: balcony
      jardin: garden
      petit: small
      cosy: cozy
  fr.a1.unit46.lesson06.teach.camille_salut_mathieu:
    title: Camille asks about the apartment
    gloss: 'Camille: Hi Mathieu, how''s your new apartment in Lyon?'
    note: '*Nouvel* is the form of *nouveau* (new) used before a masculine noun that starts with a vowel: *un nouvel appartement*.'
  fr.a1.unit46.lesson06.teach.mathieu_il_est:
    title: Mathieu describes it
    gloss: 'Mathieu: It''s small but cozy. I have one bedroom, a living room, a kitchen, and a bathroom.'
    note: Matches the housing ad read in lesson05 exactly -- this is Mathieu's actual apartment.
  fr.a1.unit46.lesson06.teach.camille_tu_as:
    title: Camille asks about the balcony
    gloss: 'Camille: Do you have a balcony?'
    note: A direct yes/no question with *Tu as ... ?*
  fr.a1.unit46.lesson06.teach.mathieu_oui_j:
    title: Mathieu answers
    gloss: 'Mathieu: Yes, I have a balcony, but no garden.'
    note: Matches the balcony/no-garden fact from lesson05's ad.
  fr.a1.unit46.lesson06.teach.balcon_est_masculin:
    title: Gender of balcon
    gloss: '*Balcon* is masculine: a balcony, it is small.'
    note: '*Il* (he, it) replaces a masculine noun such as *balcon*, so the adjective is masculine too: *il est petit*.'
  fr.a1.unit46.lesson06.teach.camille_ca_a:
    title: Camille reacts warmly
    gloss: 'Camille: That sounds nice! I''ll come by sometime soon.'
    note: '*Je passerai te voir* (I''ll come by) uses the future *passerai* plus *te voir*, ''to see you''.'
  fr.a1.unit46.lesson06.teach.mathieu_super_tu:
    title: Mathieu welcomes her
    gloss: 'Mathieu: Great, you''re always welcome.'
    note: '*Toujours la bienvenue* (always welcome) is a warm way to invite someone back; *bienvenue* is feminine here because it describes Camille.'
