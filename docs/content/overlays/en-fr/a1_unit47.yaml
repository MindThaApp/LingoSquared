teaching:
  fr.a1.unit47.lesson01.teach.le_temps:
    title: Weather
    gloss: the weather
    note: '*Le temps* means both ''weather'' and ''time''; it is masculine.'
    example_gloss: What's the weather like?
  fr.a1.unit47.lesson01.teach.quel_temps_fait:
    title: Asking about the weather
    gloss: What's the weather like?
    note: '*Quel temps fait-il ?* is the standard question about the weather; *quel* agrees with the masculine noun *temps*.'
  fr.a1.unit47.lesson01.teach.le_temps_est:
    title: Sunny
    gloss: It is sunny.
    note: '*Le temps est* + adjective is a standard pattern; the adjective agrees with the masculine noun *temps*.'
  fr.a1.unit47.lesson01.teach.il_pleut:
    title: Raining
    gloss: It is raining.
    note: '*Pleuvoir* (to rain) is used impersonally: *il pleut*, with no separate adjective needed.'
  fr.a1.unit47.lesson01.teach.le_temps_est_2:
    title: Cloudy
    gloss: It is cloudy.
    note: Follows the same *le temps est* + adjective pattern as *ensoleillé*.
  fr.a1.unit47.lesson02.teach.il_fait_froid:
    title: Cold
    gloss: It is cold today.
    note: '*Aujourd''hui* (today) places the weather in time; *il fait froid* uses *faire*, not *être*.'
  fr.a1.unit47.lesson02.teach.il_fait_chaud:
    title: Warm
    gloss: It is warm today.
    note: '*Il fait chaud* covers both ''warm'' and ''hot'' in everyday weather talk.'
  fr.a1.unit47.lesson02.teach.il_ne_fait:
    title: Contrasting temperatures
    gloss: It is not cold, it is warm.
    note: '*Ne ... pas* wraps around the verb: *il ne fait pas froid*.'
  fr.a1.unit47.lesson03.teach.la_meteo:
    title: The weather forecast
    gloss: the weather forecast
    note: '*La météo* is feminine and short for *la météorologie*.'
    example_gloss: What's the weather forecast?
  fr.a1.unit47.lesson03.teach.demain_le_temps:
    title: Tomorrow's weather
    gloss: Tomorrow it is sunny.
    note: '*Demain* opens the sentence, followed by a comma; the rest keeps its normal order.'
  fr.a1.unit47.lesson03.teach.samedi_le_temps:
    title: A two-day forecast
    gloss: Saturday it is sunny and warm, but Sunday it rains all day.
    note: '*Toute la journée* (all day) reinforces how long the rain lasts.'
  fr.a1.unit47.lesson04.teach.la_promenade:
    title: The walk
    gloss: the walk
    note: '*Promenade* is feminine: *la promenade*.'
    example_gloss: Shall we go for a walk?
  fr.a1.unit47.lesson04.teach.on_fait_une:
    title: Suggesting a walk
    gloss: Shall we go for a walk?
    note: '*On fait une promenade ?* is a friendly way to suggest a plan; *faire une promenade* is the fixed way to say ''go for a walk''.'
  fr.a1.unit47.lesson04.teach.s_il_pleut:
    title: A conditional plan
    gloss: If it rains, we stay inside.
    note: '*S''il pleut* (if it rains): *si* + *il* becomes *s''il*; then *on reste à l''intérieur* says what you do.'
  fr.a1.unit47.lesson04.teach.bonne_idee_faisons:
    title: Agreeing and suggesting
    gloss: Good idea! Let's go for a walk.
    note: '*Faisons ...* (let''s ...) is another common way to propose an activity, alongside *On ... ?*'
  fr.a1.unit47.lesson05.teach.meteo_samedi_le:
    title: Read a two-day forecast
    gloss: 'Weather forecast: Saturday it is sunny and warm. Sunday it rains all day.'
    note: Track which day has which conditions.
    glosses:
      Météo: weather forecast
      samedi: Saturday
      ensoleillé: sunny
      chaud: warm
      Dimanche: Sunday
      pleut: rains
      toute: whole
      journée: day
  fr.a1.unit47.lesson06.teach.camille_quel_temps:
    title: Camille asks about the weekend
    gloss: 'Camille: What''s the weather like this weekend?'
    note: '*Ce week-end* (this weekend) places the question in the near future.'
  fr.a1.unit47.lesson06.teach.mathieu_samedi_le:
    title: Mathieu shares the forecast
    gloss: 'Mathieu: Saturday it is sunny and warm, but Sunday it rains all day.'
    note: Matches the forecast read in lesson05 exactly.
  fr.a1.unit47.lesson06.teach.camille_alors_on:
    title: Camille proposes a plan
    gloss: 'Camille: Shall we go for a walk on Saturday then?'
    note: '*Alors* (then) ties the suggestion directly to the good weather Mathieu just described.'
  fr.a1.unit47.lesson06.teach.mathieu_bonne_idee:
    title: Mathieu agrees and plans Sunday
    gloss: 'Mathieu: Good idea. And on Sunday let''s stay comfortably inside.'
    note: '*Tranquillement* here means ''nicely, without hurry'' and makes staying inside sound appealing.'
  fr.a1.unit47.lesson06.teach.camille_parfait_alors:
    title: Camille finalizes the plan
    gloss: 'Camille: Perfect, then we''ll watch a film.'
    note: '*Regarder* (to watch) pairs naturally with *un film* (a film).'
