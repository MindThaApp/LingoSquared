answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A1
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation or liaison marks.

course:
  title: "French A1"
  description: >-
    Asking for and giving basic street directions (à gauche/à droite, tout
    droit, au coin de la rue, traverser), continuing Inès and Mathieu's
    cooking-workshop narrative as Inès looks for a kitchen-supply shop.
    English-specific guidance highlights that French direction phrases are
    often imperative ("Tournez à gauche" -- literally "Turn left") rather
    than the more indirect English phrasing learners may expect.

units:
  fr.a1.unit09.directions:
    title: "How do I get there?"

lessons:
  fr.a1.unit09.lesson01.vocabulaire_directions:
    title: "Words for finding your way"
  fr.a1.unit09.lesson02.donner_des_indications:
    title: "Giving directions"
  fr.a1.unit09.lesson03.dialogue_chercher_la_boutique:
    title: "Looking for the shop"

teaching:
  fr.a1.unit09.lesson01.teach.a_gauche:
    title: "On the left"
    gloss: "on the left / to the left"
    note: "*À gauche* is used both for location (\"it's on the left\") and direction (\"turn left\")."
    example_gloss: "Turn left after the bakery."
  fr.a1.unit09.lesson01.teach.a_droite:
    title: "On the right"
    gloss: "on the right / to the right"
    note: "The direct opposite of *à gauche*, used the same way."
    example_gloss: "The pharmacy is to the right of the café."
  fr.a1.unit09.lesson01.teach.tout_droit:
    title: "Straight ahead"
    gloss: "straight ahead"
    note: "*Tout droit* means \"straight ahead\" -- don't confuse it with *à droite* (\"to the right\"), which looks similar but means something different."
    example_gloss: "Keep going straight ahead to the market."
  fr.a1.unit09.lesson01.teach.au_coin_de_la_rue:
    title: "At the corner of the street"
    gloss: "at the corner of the street"
    note: "*Au coin de* means \"at the corner of\"; *au coin de la rue* (at the corner of the street) is a very common landmark phrase."
    example_gloss: "The shop is at the corner of the street."
  fr.a1.unit09.lesson01.teach.traverser:
    title: "To cross"
    gloss: "to cross"
    note: "*Traverser* is a regular -ER verb: *je traverse*, *tu traverses*, and so on."
    example_gloss: "You have to cross the street to get to the shop."
  fr.a1.unit09.lesson01.teach.la_boutique:
    title: "The shop"
    gloss: "the shop"
    note: "*La boutique* usually means a small specialty shop, distinct from a large store."
    example_gloss: "The shop is at the corner of the street, on the right."
  fr.a1.unit09.lesson01.teach.le_carrefour:
    title: "The intersection"
    gloss: "the intersection / crossroads"
    note: "*Le carrefour* is where two streets cross -- a common landmark in spoken directions."
    example_gloss: "Turn left at the intersection."

  fr.a1.unit09.lesson02.teach.pour_aller_a:
    title: "Ask how to get somewhere"
    gloss: "Excuse me, how do I get to the shop, please?"
    note: "*Pour aller à... ?* (literally \"in order to go to...\") is the standard polite way to ask for directions to a place."
  fr.a1.unit09.lesson02.teach.tournez_a_gauche:
    title: "Turn left"
    gloss: "Turn left after the pharmacy."
    note: "*Tournez* is the *vous*-form imperative of *tourner* (to turn) -- the normal register for giving directions to someone you don't know well."
  fr.a1.unit09.lesson02.teach.continuez_tout_droit:
    title: "Keep going straight"
    gloss: "Keep going straight to the intersection."
    note: "*Continuez* (keep going) + *tout droit* (straight ahead) is the standard way to tell someone to keep walking without turning."
  fr.a1.unit09.lesson02.teach.cest_au_coin:
    title: "State the location"
    gloss: "It's at the corner of the street, on the right."
    note: "Combines *au coin de la rue* with *à droite* to give a precise location."
  fr.a1.unit09.lesson02.teach.cest_loin:
    title: "Say it's not far"
    gloss: "It's not far, it's five minutes on foot."
    note: "*À cinq minutes à pied* (five minutes on foot) is the same walking-time pattern you saw when Mathieu asked about the pharmacy."

  fr.a1.unit09.lesson03.teach.line01:
    title: "Ask about a shop"
    gloss: "Inès asks Mathieu if he knows a shop for buying kitchen utensils."
    note: "*Tu connais... ?* (do you know) is the standard informal way to ask if someone is familiar with a place."
  fr.a1.unit09.lesson03.teach.line02:
    title: "Give the first step"
    gloss: "Mathieu says yes, there's one not far from here -- you turn left at the intersection."
    note: "*Il y en a une* (there's one) uses *en* to avoid repeating *boutique* -- a common shortcut in spoken French."
  fr.a1.unit09.lesson03.teach.line03:
    title: "Confirm and ask for more"
    gloss: "Inès confirms left at the intersection, and asks what's next."
    note: "*Et ensuite ?* (and then?) is a simple, natural way to ask for the next direction step."
  fr.a1.unit09.lesson03.teach.line04:
    title: "Give the second step"
    gloss: "Mathieu says next, you keep going straight and cross the street."
    note: "Two direction verbs chained together with *et* -- a natural way to give a short route."
  fr.a1.unit09.lesson03.teach.line05:
    title: "Ask exactly where"
    gloss: "Inès asks exactly where the shop is."
    note: "*Exactement* (exactly) asks for a more precise answer than a general direction."
  fr.a1.unit09.lesson03.teach.line06:
    title: "Give the precise location"
    gloss: "Mathieu says it's at the corner of the street, right across from the bakery."
    note: "*En face de* (across from) gives a landmark-based location, a natural way to finish giving directions."

exercises:
  fr.a1.unit09.lesson01.exercise01.select_a_gauche:
    instruction: "What does this mean?"
    correct_option: "on the left"
    distractors: ["on the right", "straight ahead"]
    accepted_answers: ["on the left"]

  fr.a1.unit09.lesson01.exercise02.listen_a_droite:
    instruction: "Listen and select the phrase you hear."
    correct_option: "à droite"
    distractors: ["à gauche", "tout droit"]
    accepted_answers: ["à droite"]

  fr.a1.unit09.lesson01.exercise03.match_direction_words:
    instruction: "Match each French direction word to its English meaning."
    correct_response:
      "à gauche": "on the left"
      "à droite": "on the right"
      "tout droit": "straight ahead"
      "au coin de la rue": "at the corner of the street"
      traverser: "to cross"
      "la boutique": "the shop"

  fr.a1.unit09.lesson01.exercise04.order_boutique_coin_rue:
    instruction: "Build the sentence: The shop is at the corner of the street."
    correct_response: ["La", "boutique", "est", "au", "coin", "de", "la", "rue"]

  fr.a1.unit09.lesson01.exercise05.fill_traverser:
    instruction: "Complete the sentence with the word for \"cross.\""
    accepted_answers: ["traverser"]

  fr.a1.unit09.lesson01.exercise06.speak_directions_to_shop:
    instruction: "Explain how to get to the shop: left, then straight ahead."
    accepted_answers:
      - "À gauche, puis tout droit."
      - "À gauche puis tout droit."

  fr.a1.unit09.lesson02.exercise01.select_pour_aller_a:
    instruction: "Which question politely asks how to get somewhere?"
    correct_option: "Excusez-moi, pour aller à la boutique, s'il vous plaît ?"
    distractors: ["C'est au coin de la rue, à droite.", "Tournez à gauche après la pharmacie."]
    accepted_answers: ["Excusez-moi, pour aller à la boutique, s'il vous plaît ?", "Excusez-moi, pour aller à la boutique, s'il vous plaît"]

  fr.a1.unit09.lesson02.exercise02.listen_tournez_a_gauche:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Tournez à gauche."
    distractors: ["Continuez tout droit.", "C'est au coin de la rue."]
    accepted_answers: ["Tournez à gauche.", "Tournez à gauche"]

  fr.a1.unit09.lesson02.exercise03.match_direction_phrases:
    instruction: "Match each French direction phrase to its English meaning."
    correct_response:
      "Excusez-moi, pour aller à la boutique, s'il vous plaît ?": "Excuse me, how do I get to the shop, please?"
      "Tournez à gauche après la pharmacie.": "Turn left after the pharmacy."
      "Continuez tout droit jusqu'au carrefour.": "Keep going straight to the intersection."
      "C'est au coin de la rue, à droite.": "It's at the corner of the street, on the right."
      "Ce n'est pas loin, c'est à cinq minutes à pied.": "It's not far, it's five minutes on foot."

  fr.a1.unit09.lesson02.exercise04.order_continuez_tout_droit:
    instruction: "Build the sentence: Keep going straight to the intersection."
    correct_response: ["Continuez", "tout", "droit", "jusqu'au", "carrefour"]

  fr.a1.unit09.lesson02.exercise05.fill_cest_loin:
    instruction: "Complete the sentence with the word for \"far.\""
    accepted_answers: ["loin"]

  fr.a1.unit09.lesson02.exercise06.reply_give_directions:
    instruction: "Answer with directions: turn left, then keep going straight."
    accepted_answers:
      - "Tournez à gauche, puis continuez tout droit."
      - "Tournez à gauche et continuez tout droit."
      - "Tournez à gauche, ensuite continuez tout droit."

  fr.a1.unit09.lesson03.exercise01.comprehend_first_direction:
    instruction: "Listen to the dialogue. What's the first direction Mathieu gives?"
    correct_option: "Turn left at the intersection"
    distractors: ["Turn right at the pharmacy", "Turn right at the intersection"]
    accepted_answers: ["Turn left at the intersection"]

  fr.a1.unit09.lesson03.exercise02.comprehend_shop_location:
    instruction: "Where exactly is the shop, according to Mathieu?"
    correct_option: "At the corner of the street, across from the bakery"
    distractors: ["Next to the pharmacy", "In front of the market"]
    accepted_answers: ["At the corner of the street, across from the bakery"]

  fr.a1.unit09.lesson03.exercise03.select_what_ines_needs:
    instruction: "What does Inès need to buy?"
    correct_option: "Kitchen utensils"
    distractors: ["Fresh vegetables", "A cookbook"]
    accepted_answers: ["Kitchen utensils"]

  fr.a1.unit09.lesson03.exercise04.order_ensuite_tu_continues:
    instruction: "Build Mathieu's sentence about the second step."
    correct_response: ["tu", "continues", "tout", "droit", "et", "tu", "traverses", "la", "rue"]

  fr.a1.unit09.lesson03.exercise05.reply_shop_location:
    instruction: "Take Mathieu's role. State exactly where the shop is."
    accepted_answers:
      - "Elle est au coin de la rue, juste en face de la boulangerie."
      - "Elle est au coin de la rue juste en face de la boulangerie."
      - "Elle est au coin de la rue, en face de la boulangerie."
      - "C'est au coin de la rue, juste en face de la boulangerie."
      - "C'est au coin de la rue, en face de la boulangerie."

  fr.a1.unit09.lesson03.exercise06.speak_confirm_directions:
    instruction: "Say the full directions out loud: left at the intersection, straight ahead, cross the street."
    accepted_answers:
      - "À gauche au carrefour, tout droit, et je traverse la rue."
      - "À gauche au carrefour, tout droit, puis je traverse la rue."
      - "Tu tournes à gauche au carrefour, tu continues tout droit et tu traverses la rue."
      - "Je tourne à gauche au carrefour, je continue tout droit et je traverse la rue."
      - "Tournez à gauche au carrefour, continuez tout droit et traversez la rue."

  fr.a1.unit09.lesson02.exercise07.dictation_tournez_a_gauche:
    instruction: "Type what you hear."
    correct_option: "Tournez à gauche"
    accepted_answers: [{value: "Tournez à gauche", status: correct}]
    orthography_strict: true
