review:
  status: reviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Overlay for French C1 unit 06 on idiomatic and figurative language.
    English-speaker interference risks: calquing English idioms literally
    into French, and writing an open production prompt that a learner could
    answer with several different idioms. The production exercises therefore
    name exact taught models and accept those strings with punctuation
    variants only. No sibling-direction overlay was consulted.

    Second-pass review 2026-10-19: 5 fixes — teach.tomber_a_pic note: false
    literal gloss 'to fall at the peak' -> 'to drop straight down (à pic =
    vertically)'; teach.reecriture_idiomatique note: called j'ai beaucoup de
    travail / tu es très gentil 'calques' (they are ordinary correct French,
    and gentil = kind, not generous) -> 'plain, literal phrasings j'ai
    beaucoup de travail and tu es très généreux';
    lesson05.exercise04.sens_figure distractors: untaught 'au sens strict' /
    'au sens littéral' -> taught 'au début' / 'en ce moment';
    lesson06.exercise01.speak_situation and exercise02.write_idiomatique:
    instructions no longer print the idioms that are the answer (mirrored in
    realization prompts).

course:
  title: French C1
  description: "Advanced French idiom and figurative language: understand and use idiomatic, collocational, and figurative expressions naturally, and rewrite literal calques as idiomatic French."

units:
  fr.c1.unit06.idiomes:
    title: "Idiomatic and figurative language"
    description: "Understand and use French idioms and figurative expressions naturally, and rewrite literal or calqued sentences as idiomatic French."

lessons:
  fr.c1.unit06.idiomes.lesson01.mettre_la_main_a_la_pate:
    title: "Pitching in"
  fr.c1.unit06.idiomes.lesson02.ce_nest_pas_la_mer_a_boire:
    title: "It's not that hard"
  fr.c1.unit06.idiomes.lesson03.avoir_le_cafard:
    title: "Feeling down or feeling great"
  fr.c1.unit06.idiomes.lesson04.la_cerise_sur_le_gateau:
    title: "The icing on the cake"
  fr.c1.unit06.idiomes.lesson05.lire_au_sens_figure:
    title: "Reading figuratively"
  fr.c1.unit06.idiomes.lesson06.parler_et_ecrire_idiomatiquement:
    title: "Speaking and writing idiomatically"

teaching:
  fr.c1.unit06.idiomes.lesson01.teach.mettre_la_main_a_la_pate:
    title: "to pitch in / to lend a hand"
    gloss: "to pitch in / to lend a hand"
    note: "*Mettre la main à la pâte* (to put one's hand in the dough) means to pitch in and help — the dough (*la pâte*) is the literal image behind the figurative sense."
  fr.c1.unit06.idiomes.lesson01.teach.donner_un_coup_de_main:
    title: "to give a hand"
    gloss: "to give a hand / to help out"
    note: "*Donner un coup de main* (to give a hand) is a strongly collocational way to offer quick help."
  fr.c1.unit06.idiomes.lesson01.teach.avoir_du_pain_sur_la_planche:
    title: "to have a lot of work"
    gloss: "to have a lot of work to do"
    note: "*Avoir du pain sur la planche* (to have bread on the board) means to have a lot of work ahead."
  fr.c1.unit06.idiomes.lesson01.teach.au_sens_figure:
    title: "in the figurative sense"
    gloss: "in the figurative sense"
    note: "*Au sens figuré* (in the figurative sense) marks a word as used non-literally — the opposite of *au sens propre*."
  fr.c1.unit06.idiomes.lesson01.teach.modele_entraide:
    title: "A model of pitching in"
    gloss: "You pitched in all day long."
    note: "This model conjugates the idiom: *tu as mis la main à la pâte* (you pitched in) uses the passé composé of *mettre*."

  fr.c1.unit06.idiomes.lesson02.teach.cest_du_gateau:
    title: "it's a piece of cake"
    gloss: "it's a piece of cake / very easy"
    note: "*C'est du gâteau* (it's cake) means it is very easy — cake is the image for something effortless."
  fr.c1.unit06.idiomes.lesson02.teach.ce_nest_pas_la_mer_a_boire:
    title: "it's not that hard"
    gloss: "it's not that hard / no big deal"
    note: "*Ce n'est pas la mer à boire* (it's not the sea to drink) reassures someone that a task is manageable."
  fr.c1.unit06.idiomes.lesson02.teach.marcher_sur_des_oeufs:
    title: "to walk on eggshells"
    gloss: "to walk on eggshells"
    note: "*Marcher sur des œufs* (to walk on eggs) means to act very cautiously so as not to upset someone."
  fr.c1.unit06.idiomes.lesson02.teach.au_sens_propre:
    title: "in the literal sense"
    gloss: "in the literal sense"
    note: "*Au sens propre* (in the literal sense) is the literal counterpart of *au sens figuré*."
  fr.c1.unit06.idiomes.lesson02.teach.modele_rassurer:
    title: "A model of reassurance"
    gloss: "Don't worry, it's not that hard."
    note: "This model shows *ce n'est pas la mer à boire* reassuring an informal *tu* listener after *ne t'inquiète pas*."

  fr.c1.unit06.idiomes.lesson03.teach.avoir_le_cafard:
    title: "to feel down"
    gloss: "to feel down / to be blue"
    note: "*Avoir le cafard* (to have the cockroach) means to feel low or blue — a common *avoir* + noun mood idiom."
  fr.c1.unit06.idiomes.lesson03.teach.avoir_la_peche:
    title: "to feel great"
    gloss: "to feel great / full of energy"
    note: "*Avoir la pêche* (to have the peach) means to feel energetic and cheerful — the positive counterpart of *avoir le cafard*."
  fr.c1.unit06.idiomes.lesson03.teach.avoir_le_coeur_sur_la_main:
    title: "to be generous"
    gloss: "to be generous / kind-hearted"
    note: "*Avoir le cœur sur la main* (to have one's heart on one's hand) means to be generous and open-hearted."
  fr.c1.unit06.idiomes.lesson03.teach.etre_de_bonne_humeur:
    title: "to be in a good mood"
    gloss: "to be in a good mood"
    note: "*Être de bonne humeur* (to be in a good mood) is a marked collocation — a more literal alternative to the mood idioms."
  fr.c1.unit06.idiomes.lesson03.teach.modele_moral:
    title: "A model of mood"
    gloss: "She is feeling down right now."
    note: "This model uses *avoir le cafard* in a full sentence with the time phrase *en ce moment*."

  fr.c1.unit06.idiomes.lesson04.teach.la_cerise_sur_le_gateau:
    title: "the icing on the cake"
    gloss: "the icing on the cake"
    note: "*La cerise sur le gâteau* (the cherry on the cake) is the finishing touch that makes a good thing even better."
  fr.c1.unit06.idiomes.lesson04.teach.tomber_a_pic:
    title: "to come at just the right moment"
    gloss: "to come at just the right moment"
    note: "*Tomber à pic* (literally to drop straight down — *à pic* means vertically) means to happen at exactly the right moment."
  fr.c1.unit06.idiomes.lesson04.teach.couper_la_poire_en_deux:
    title: "to split the difference"
    gloss: "to split the difference"
    note: "*Couper la poire en deux* (to cut the pear in two) means to meet halfway or split the difference."
  fr.c1.unit06.idiomes.lesson04.teach.faire_un_compliment:
    title: "to pay a compliment"
    gloss: "to pay a compliment"
    note: "*Faire un compliment* (to pay a compliment) is a marked collocation — *faire* + *compliment*."
  fr.c1.unit06.idiomes.lesson04.teach.modele_succes:
    title: "A model of success"
    gloss: "Your compliment is the icing on the cake."
    note: "This model uses *la cerise sur le gâteau* with the informal possessive *ton compliment*."

  fr.c1.unit06.idiomes.lesson05.teach.expression_idiomatique:
    title: "an idiomatic expression"
    gloss: "an idiomatic expression"
    note: "*Une expression idiomatique* is a fixed phrase whose meaning cannot be worked out from its words alone."
    example_gloss: "« Mettre la main à la pâte » is an idiomatic expression."
  fr.c1.unit06.idiomes.lesson05.teach.sens_propre_et_figure:
    title: "literal and figurative"
    gloss: "in the literal and figurative senses"
    note: "This pair contrasts *au sens propre* (literal) with *au sens figuré* (figurative) — the two readings of any idiom."
  fr.c1.unit06.idiomes.lesson05.teach.passage_figure:
    title: "A figurative passage"
    gloss: "This week I pitched in. The recipe was not that hard, but I had a lot of work. At first I felt down, but now I feel great. Your compliment was the icing on the cake."
    note: "This passage strings several taught idioms together: idiom, metaphor, and marked collocation working in one informal text."

  fr.c1.unit06.idiomes.lesson06.teach.modele_situation:
    title: "Describing a situation with two idioms"
    gloss: "This week I pitched in, and the client's compliment was the icing on the cake."
    note: "This is the exact model for the speaking task: it describes the week using two taught idioms — *mettre la main à la pâte* and *la cerise sur le gâteau*."
  fr.c1.unit06.idiomes.lesson06.teach.reecriture_idiomatique:
    title: "Idiomatic rewrites"
    gloss: "I have a lot of work. You are very generous."
    note: "This is the exact model for the writing task: the plain, literal phrasings *j'ai beaucoup de travail* and *tu es très généreux* become the idioms *j'ai du pain sur la planche* and *tu as le cœur sur la main*."

exercises:
  fr.c1.unit06.idiomes.lesson01.exercise01.recognize_entraide:
    instruction: "Which French expression literally means 'to put one's hand in the dough'?"
    correct_option: "mettre la main à la pâte"
    distractors: ["donner un coup de main", "avoir du pain sur la planche", "au sens figuré"]
    accepted_answers: [{value: "mettre la main à la pâte", status: correct}]
    feedback: "*Mettre la main à la pâte* literally means to put one's hand in the dough, and figuratively to pitch in."
  fr.c1.unit06.idiomes.lesson01.exercise02.listen_entraide:
    instruction: "Listen and select what you hear."
    correct_option: "You pitched in all day long."
    distractors: ["You will pitch in tomorrow.", "You had a lot of work all day long.", "You pitched in for the whole team."]
    accepted_answers: [{value: "You pitched in all day long.", status: correct}]
    feedback: "Tu as mis la main à la pâte toute la journée means you pitched in all day long."
  fr.c1.unit06.idiomes.lesson01.exercise03.match_entraide:
    instruction: "Match each French helping-and-work expression to its English meaning."
    accepted_answers:
      - value: {"mettre la main à la pâte": "to pitch in and do the work", "donner un coup de main": "to give someone a quick helping hand", "avoir du pain sur la planche": "to have a lot of work to do", "au sens figuré": "in the figurative sense", "la pâte": "the dough", "la planche": "the board"}
        status: correct
    feedback: "These expressions describe helping out and a heavy workload, and their literal components."
  fr.c1.unit06.idiomes.lesson01.exercise04.order_entraide:
    instruction: "Put the French words in order to form 'to give a hand'."
    accepted_answers:
      - {value: "donner un coup de main", status: correct}
    feedback: "The phrase is donner un coup de main — to give a hand."
  fr.c1.unit06.idiomes.lesson01.exercise05.write_entraide:
    instruction: "Write in French the taught idiom sentence: You pitched in all day."
    accepted_answers:
      - {value: "Tu as mis la main à la pâte toute la journée.", status: correct}
      - {value: "Tu as mis la main à la pâte toute la journée", status: correct}
    feedback: "Tu as mis la main à la pâte toute la journée."

  fr.c1.unit06.idiomes.lesson02.exercise01.recognize_gateau:
    instruction: "Which French expression literally means 'it's cake'?"
    correct_option: "c'est du gâteau"
    distractors: ["ce n'est pas la mer à boire", "marcher sur des œufs", "au sens propre"]
    accepted_answers: [{value: "c'est du gâteau", status: correct}]
    feedback: "*C'est du gâteau* literally means it's cake, and figuratively it's very easy."
  fr.c1.unit06.idiomes.lesson02.exercise02.listen_rassurer:
    instruction: "Listen and select what you hear."
    correct_option: "Don't worry, it's not that hard."
    distractors: ["Don't worry, it's the sea to drink.", "You worry, it's not that hard.", "Don't worry, it's very easy."]
    accepted_answers: [{value: "Don't worry, it's not that hard.", status: correct}]
    feedback: "Ne t'inquiète pas, ce n'est pas la mer à boire means don't worry, it's not that hard."
  fr.c1.unit06.idiomes.lesson02.exercise03.match_difficulte:
    instruction: "Match each French difficulty expression to its English meaning."
    accepted_answers:
      - value: {"c'est du gâteau": "it's a piece of cake / very easy", "ce n'est pas la mer à boire": "it's not that hard / no big deal", "marcher sur des œufs": "to walk on eggshells", "au sens propre": "in the literal sense", "du gâteau": "some cake", "des œufs": "some eggs"}
        status: correct
    feedback: "These expressions describe ease, difficulty, and caution, plus their literal components."
  fr.c1.unit06.idiomes.lesson02.exercise04.order_difficulte:
    instruction: "Put the French words in order to form 'to walk on eggshells'."
    accepted_answers:
      - {value: "marcher sur des œufs", status: correct}
    feedback: "The phrase is marcher sur des œufs — to walk on eggshells."
  fr.c1.unit06.idiomes.lesson02.exercise05.write_rassurer:
    instruction: "Write in French the taught reassuring sentence with its idiom: Don't worry, it's not that hard."
    accepted_answers:
      - {value: "Ne t'inquiète pas, ce n'est pas la mer à boire.", status: correct}
      - {value: "Ne t'inquiète pas, ce n'est pas la mer à boire", status: correct}
    feedback: "Ne t'inquiète pas, ce n'est pas la mer à boire."

  fr.c1.unit06.idiomes.lesson03.exercise01.recognize_cafard:
    instruction: "Which French expression literally means 'to have the cockroach'?"
    correct_option: "avoir le cafard"
    distractors: ["avoir la pêche", "avoir le cœur sur la main", "être de bonne humeur"]
    accepted_answers: [{value: "avoir le cafard", status: correct}]
    feedback: "*Avoir le cafard* literally means to have the cockroach, and figuratively to feel down."
  fr.c1.unit06.idiomes.lesson03.exercise02.listen_cafard:
    instruction: "Listen and select what you hear."
    correct_option: "She is feeling down right now."
    distractors: ["She is feeling great right now.", "She is feeling down tomorrow.", "She has a lot of work right now."]
    accepted_answers: [{value: "She is feeling down right now.", status: correct}]
    feedback: "Elle a le cafard en ce moment means she is feeling down right now."
  fr.c1.unit06.idiomes.lesson03.exercise03.match_humeur:
    instruction: "Match each French mood expression to its English meaning."
    accepted_answers:
      - value: {"avoir le cafard": "to feel down / to be blue", "avoir la pêche": "to feel great / full of energy", "avoir le cœur sur la main": "to be generous / kind-hearted", "être de bonne humeur": "to be in a good mood", "le cafard": "the cockroach / the blues", "la pêche": "the peach"}
        status: correct
    feedback: "These *avoir* + noun expressions describe mood and character, plus their literal components."
  fr.c1.unit06.idiomes.lesson03.exercise04.order_humeur:
    instruction: "Put the French words in order to form 'to be generous'."
    accepted_answers:
      - {value: "avoir le cœur sur la main", status: correct}
    feedback: "The phrase is avoir le cœur sur la main — to be generous."
  fr.c1.unit06.idiomes.lesson03.exercise05.speak_cafard:
    instruction: "Say aloud in French the taught idiom sentence: She's feeling down at the moment."
    accepted_answers:
      - {value: "Elle a le cafard en ce moment.", status: correct}
      - {value: "Elle a le cafard en ce moment", status: correct}
    feedback: "Elle a le cafard en ce moment."

  fr.c1.unit06.idiomes.lesson04.exercise01.recognize_cerise:
    instruction: "Which French expression literally means 'the cherry on the cake'?"
    correct_option: "la cerise sur le gâteau"
    distractors: ["tomber à pic", "couper la poire en deux", "faire un compliment"]
    accepted_answers: [{value: "la cerise sur le gâteau", status: correct}]
    feedback: "*La cerise sur le gâteau* literally means the cherry on the cake, and figuratively the perfect finishing touch."
  fr.c1.unit06.idiomes.lesson04.exercise02.listen_cerise:
    instruction: "Listen and select what you hear."
    correct_option: "Your compliment is the icing on the cake."
    distractors: ["Your complaint is the icing on the cake.", "Your compliment is the cherry on the floor.", "Your compliment was the icing on the cake."]
    accepted_answers: [{value: "Your compliment is the icing on the cake.", status: correct}]
    feedback: "Ton compliment est la cerise sur le gâteau means your compliment is the icing on the cake."
  fr.c1.unit06.idiomes.lesson04.exercise03.match_succes:
    instruction: "Match each French success expression to its English meaning."
    accepted_answers:
      - value: {"la cerise sur le gâteau": "the icing on the cake", "tomber à pic": "to come at just the right moment", "couper la poire en deux": "to split the difference", "faire un compliment": "to pay a compliment", "la cerise": "the cherry", "la poire": "the pear"}
        status: correct
    feedback: "These expressions describe a successful finish, good timing, and compromise, plus their literal components."
  fr.c1.unit06.idiomes.lesson04.exercise04.order_succes:
    instruction: "Put the French words in order to form 'to split the difference'."
    accepted_answers:
      - {value: "couper la poire en deux", status: correct}
    feedback: "The phrase is couper la poire en deux — to split the difference."
  fr.c1.unit06.idiomes.lesson04.exercise05.speak_cerise:
    instruction: "Say aloud in French the taught idiom sentence: Your compliment is the icing on the cake."
    accepted_answers:
      - {value: "Ton compliment est la cerise sur le gâteau.", status: correct}
      - {value: "Ton compliment est la cerise sur le gâteau", status: correct}
    feedback: "Ton compliment est la cerise sur le gâteau."

  fr.c1.unit06.idiomes.lesson05.exercise01.read_cafard:
    instruction: "In the passage, what does « j'avais le cafard » mean?"
    correct_option: "I was feeling down"
    distractors: ["I was feeling full of energy", "I had a lot of work to do", "I was pitching in"]
    accepted_answers: [{value: "I was feeling down", status: correct}]
    feedback: "« Avoir le cafard » means to feel down or blue — the speaker starts the week in a low mood."
  fr.c1.unit06.idiomes.lesson05.exercise02.match_contribution:
    instruction: "Match each expression from the passage to what it contributes to the meaning or tone."
    accepted_answers:
      - value: {"mettre la main à la pâte": "effort and teamwork", "avoir du pain sur la planche": "a heavy workload", "avoir le cafard": "a low mood", "avoir la pêche": "energy and good spirits", "la cerise sur le gâteau": "a positive finishing touch", "ce n'est pas la mer à boire": "reassurance that it is not too hard"}
        status: correct
    feedback: "Each expression carries one contribution: effort, workload, mood, energy, a positive touch, or reassurance."
  fr.c1.unit06.idiomes.lesson05.exercise03.read_tone:
    instruction: "Which expression in the passage adds the positive, celebratory finishing touch at the end?"
    correct_option: "the icing on the cake"
    distractors: ["the cockroach", "the board", "the dough"]
    accepted_answers: [{value: "the icing on the cake", status: correct}]
    feedback: "« La cerise sur le gâteau » (the icing on the cake) closes the passage on an upbeat, celebratory note."
  fr.c1.unit06.idiomes.lesson05.exercise04.sens_figure:
    instruction: "Which phrase describes a word used in its figurative, non-literal meaning?"
    correct_option: "au sens figuré"
    distractors: ["au sens propre", "au début", "en ce moment"]
    accepted_answers: [{value: "au sens figuré", status: correct}]
    feedback: "*Au sens figuré* (in the figurative sense) is the non-literal reading of a word."

  fr.c1.unit06.idiomes.lesson06.exercise01.speak_situation:
    instruction: "Say aloud in French the taught description of the week, using two idioms: This week I pitched in, and the client's compliment was the icing on the cake."
    accepted_answers:
      - {value: "Cette semaine, j'ai mis la main à la pâte, et le compliment du client a été la cerise sur le gâteau.", status: correct}
      - {value: "Cette semaine, j'ai mis la main à la pâte, et le compliment du client a été la cerise sur le gâteau", status: correct}
    feedback: "Cette semaine, j'ai mis la main à la pâte, et le compliment du client a été la cerise sur le gâteau."
  fr.c1.unit06.idiomes.lesson06.exercise02.write_idiomatique:
    instruction: "Rewrite these two literal sentences as idiomatic French, using the idioms taught in this unit: 'I have a lot of work.' 'You are very generous.' Use informal tu in the second sentence."
    accepted_answers:
      - {value: "J'ai du pain sur la planche. Tu as le cœur sur la main.", status: correct}
      - {value: "J'ai du pain sur la planche. Tu as le cœur sur la main", status: correct}
    feedback: "J'ai du pain sur la planche. Tu as le cœur sur la main."
  fr.c1.unit06.idiomes.lesson06.exercise03.dictation_coeur:
    instruction: "Type exactly what you hear."
    correct_response: "Tu as le cœur sur la main."
    orthography_strict: true
    feedback: "Tu as le cœur sur la main."
  fr.c1.unit06.idiomes.lesson06.exercise04.match_revision:
    instruction: "Match each French idiom to its English meaning."
    accepted_answers:
      - value: {"mettre la main à la pâte": "to pitch in / to lend a hand", "ce n'est pas la mer à boire": "it's not that hard", "avoir le cafard": "to feel down", "avoir la pêche": "to feel great", "avoir le cœur sur la main": "to be generous", "la cerise sur le gâteau": "the icing on the cake"}
        status: correct
    feedback: "These are the six core idioms of the unit, consolidated."
  fr.c1.unit06.idiomes.lesson06.exercise05.listen_planche:
    instruction: "Listen and select what you hear."
    correct_option: "I have a lot of work to do."
    distractors: ["I have a lot of bread to buy.", "I have a lot of time to do.", "I will have a lot of work to do."]
    accepted_answers: [{value: "I have a lot of work to do.", status: correct}]
    feedback: "J'ai du pain sur la planche means I have a lot of work to do."
