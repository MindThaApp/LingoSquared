teaching:
  fr.b1.unit29.lesson01.teach.responsable_de:
    title: "Responsible for"
    gloss: "to be responsible for"
    note: "Use *responsable de* to name your area or task at work."
    example_gloss: "I am responsible for the orders."
  fr.b1.unit29.lesson01.teach.faire_un_point:
    title: "Give an update"
    gloss: "to give an update"
    note: "*Faire un point* is a common professional way to ask for or give a status update."
    example_gloss: "Can you give me an update on the orders?"
  fr.b1.unit29.lesson01.teach.commandes_matin:
    title: "Morning orders"
    gloss: "the morning orders"
    note: "*Du matin* (*de* + *le matin*) means 'of the morning': *les commandes du matin* are the morning orders."
    example_gloss: "The morning orders are important."
  fr.b1.unit29.lesson01.teach.liste_retard:
    title: "The list is not ready yet"
    gloss: "the list is not ready yet"
    note: "*Pas encore* means 'not yet'. *Prête* is feminine because it agrees with *la liste*."
    example_gloss: "Today, the list is not ready yet."
  fr.b1.unit29.lesson01.teach.professional_vous:
    title: "Polite/formal address"
    gloss: "polite/formal address"
    note: "Use *vous* in this workplace exchange because Inès is speaking professionally with a colleague."
  fr.b1.unit29.lesson02.teach.presque_terminee:
    title: "Almost finished"
    gloss: "almost finished"
    note: "*Terminée* agrees with *la liste*."
    example_gloss: "The list is almost finished."
  fr.b1.unit29.lesson02.teach.en_retard:
    title: "Delayed"
    gloss: "to be delayed / late"
    note: "*En retard* reports a delayed task or delivery."
    example_gloss: "The delivery is delayed."
  fr.b1.unit29.lesson02.teach.pourriez_vous:
    title: "Could you...?"
    gloss: "could you...?"
    note: "*Pourriez-vous* is the professional request form used here with *s'il vous plaît*."
    example_gloss: "Could you check the delivery with me, please?"
  fr.b1.unit29.lesson02.teach.dialogue_line01:
    title: "The colleague asks for an update"
