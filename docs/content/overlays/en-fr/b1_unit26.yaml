units:
  fr.b1.unit26.obligations:
    title: "Obligation with the subjunctive"

lessons:
  fr.b1.unit26.lesson01.il_faut_que:
    title: "Il faut que je prévienne"
  fr.b1.unit26.lesson02.interdiction_regret:
    title: "Il ne faut pas que j'oublie"

teaching:
  fr.b1.unit26.lesson01.teach.refresher_prevenir:
    title: "To notify someone"
    gloss: "to notify someone"
    note: "Refresher for B1 standalone use: *prévenir* means to let someone know in advance."
    example_gloss: "I notify the pastry shop."
  fr.b1.unit26.lesson01.teach.refresher_badge:
    title: "A badge"
    gloss: "a badge"
    note: "A work or training badge can be required for entry."
    example_gloss: "My badge is in my bag."
  fr.b1.unit26.lesson01.teach.il_faut_que_je:
    title: "I must..."
    gloss: "I must... (+ subjunctive)"
    note: "*Il faut que* is followed by a subject and a subjunctive verb: *que je prévienne*, not English-style \"must to notify.\""
    example_gloss: "I must notify the pastry shop."
  fr.b1.unit26.lesson01.teach.il_faut_que_tu:
    title: "You must..."
    gloss: "you must... (+ subjunctive)"
    note: "After *que tu*, many common subjunctive forms sound like the present but still belong to the *il faut que* pattern."
    example_gloss: "You must bring your uniform."
  fr.b1.unit26.lesson01.teach.subj_note:
    title: "Il faut que + subjunctive"
    gloss: "must + subject + subjunctive verb"
    note: "French expresses this kind of obligation as *il faut que* plus a full clause."

  fr.b1.unit26.lesson02.teach.ne_faut_pas_que:
    title: "Must not..."
    gloss: "must not... (+ subjunctive)"
    note: "Negating *il faut* gives a prohibition: *Il ne faut pas que j'oublie* means I must not forget."
    example_gloss: "I must not forget my badge."
  fr.b1.unit26.lesson02.teach.il_aurait_fallu:
    title: "Should have..."
    gloss: "should have... (+ subjunctive)"
    note: "*Il aurait fallu que...* expresses a past obligation that was not fulfilled."
    example_gloss: "I should have prepared my bag the day before."
  fr.b1.unit26.lesson02.teach.la_veille:
    title: "The day before"
    gloss: "the day before"
    note: "*La veille* refers to the previous day from the point of view of the story."
    example_gloss: "I prepare my bag the day before."
  fr.b1.unit26.lesson02.teach.dialogue_line01:
    title: "Mathieu asks about tomorrow"
    gloss: "Mathieu asks whether Inès is leaving early tomorrow."
  fr.b1.unit26.lesson02.teach.dialogue_line02:
    title: "Inès states an obligation"
    gloss: "Inès says she must notify the pastry shop before nine."
  fr.b1.unit26.lesson02.teach.dialogue_line03:
    title: "Mathieu asks about the uniform"
    gloss: "Mathieu asks whether she also has to bring her uniform."
  fr.b1.unit26.lesson02.teach.dialogue_line04:
    title: "Inès states a prohibition"
    gloss: "Inès says yes, and that she must not forget her badge."
  fr.b1.unit26.lesson02.teach.dialogue_line05:
    title: "Mathieu checks the past"
    gloss: "Mathieu asks whether she forgot it last week."
  fr.b1.unit26.lesson02.teach.dialogue_line06:
    title: "Inès expresses regret"
    gloss: "Inès says yes: she should have prepared her bag the day before."

exercises:
  fr.b1.unit26.lesson01.exercise01.select_obligation:
    instruction: "What obligation does the sentence express?"
    correct_option: "I must notify the pastry shop"
    distractors: ["I already notified the town hall", "I must not enter the shop"]
    accepted_answers: ["I must notify the pastry shop"]
  fr.b1.unit26.lesson01.exercise02.listen_previens:
    instruction: "Listen and select the exact sentence you hear."
    correct_option: "Il faut que je prévienne la pâtisserie."
    distractors: ["Il faut que tu apportes ton uniforme.", "Il ne faut pas que j'oublie mon badge."]
    accepted_answers: ["Il faut que je prévienne la pâtisserie."]
  fr.b1.unit26.lesson01.exercise03.match_subjunctive:
    instruction: "Match each French phrase to English."
    correct_response:
      "il faut que je prévienne": "I must notify"
      "il faut que tu apportes": "you must bring"
      "un badge": "a badge"
      "prévenir quelqu'un": "to notify someone"
      "un uniforme": "a uniform"
      "la pâtisserie": "the pastry shop"
  fr.b1.unit26.lesson01.exercise04.order_il_faut:
    instruction: "Build the sentence: You must bring your uniform."
    correct_response: ["Il", "faut", "que", "tu", "apportes", "ton", "uniforme"]
  fr.b1.unit26.lesson01.exercise05.write_obligation:
    instruction: "Write this obligation in French with 'il faut que' + subjunctive: I have to let the pastry shop know."
    accepted_answers:
      - status: correct
        value: "Il faut que je prévienne la pâtisserie."
      - status: correct
        value: "Il faut que je prévienne la pâtisserie"

  fr.b1.unit26.lesson02.exercise01.select_regret:
    instruction: "What does this sentence express?"
    correct_option: "A past regret"
    distractors: ["A present obligation", "A future plan"]
    accepted_answers: ["A past regret"]
  fr.b1.unit26.lesson02.exercise02.comprehend_dialogue:
    instruction: "Listen to the dialogue. What must Inès do before nine?"
    correct_option: "Notify the pastry shop"
    distractors: ["Buy a new badge", "Cancel the cooking workshop"]
    accepted_answers: ["Notify the pastry shop"]
  fr.b1.unit26.lesson02.exercise03.match_obligation_regret:
    instruction: "Match each French phrase to its function."
    correct_response:
      "il faut que je prévienne": "present obligation"
      "il ne faut pas que j'oublie": "prohibition / must not"
      "il aurait fallu que je prépare": "past regret"
      "la veille": "the day before"
      "avant neuf heures": "before nine o'clock"
      "mon sac": "my bag"
  fr.b1.unit26.lesson02.exercise04.order_ne_faut_pas:
    instruction: "Build the sentence: I must not forget my badge."
    correct_response: ["Il", "ne", "faut", "pas", "que", "j'oublie", "mon", "badge"]
  fr.b1.unit26.lesson02.exercise05.speak_obligation:
    instruction: "Take Inès's role. Answer Mathieu with *il faut que* + subjunctive: say that you have to let the pastry shop know before nine o'clock."
    accepted_answers:
      - "Il faut que je prévienne la pâtisserie avant neuf heures."
      - "Il faut que je prévienne la pâtisserie avant neuf heures"
      - "Il faut que je prévienne la pâtisserie avant 9 heures."
      - "Avant neuf heures, il faut que je prévienne la pâtisserie."
  fr.b1.unit26.lesson02.exercise06.write_culminating:
    instruction: "Write three French sentences with 'il faut que' + subjunctive: I have to let the pastry shop know before nine o'clock. I mustn't forget my badge. I should have packed my bag the day before (past regret with the same structure)."
    accepted_answers:
      - status: correct
        value: "Il faut que je prévienne la pâtisserie avant neuf heures. Il ne faut pas que j'oublie mon badge. Il aurait fallu que je prépare mon sac la veille."
  fr.b1.unit26.lesson01.exercise06.dictation_il_faut_previenne:
