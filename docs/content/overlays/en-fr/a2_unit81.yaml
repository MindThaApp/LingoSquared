course:
  title: French A2
  description: Intermediate French continuing the Camille and Mathieu storyline, now with a grammar-led block on talking about the past.
  learning_goal: Describe how a morning went, using the passé composé (avoir, être, reflexive verbs) and sequence words.
units:
  fr.a2.unit81.matinee_chargee:
    title: A busy morning
    description: Tell step by step how a morning went, using the passé composé with avoir, être and reflexive verbs.
