    title: Camille and Mathieu talk about the morning
teaching:
  fr.a2.unit81.lesson01.teach.quand:
    title: When
    gloss: this morning / yesterday morning
    note: Time words that place an action in the recent past.
    example_gloss:
    - This morning I had a shower.
    - Yesterday morning I had a coffee.
  fr.a2.unit81.lesson01.teach.choses:
    title: Morning things
    gloss: a shower / a coffee / some bread / breakfast
    note: '*Prendre* is used for a shower, a meal or the bus: *prendre une douche*, *prendre le petit-déjeuner*.'
    example_gloss:
    - I had a shower.
    - He drank a coffee.
    - We ate bread.
    - She had breakfast.
  fr.a2.unit81.lesson01.teach.gn_avoir:
    title: Passé composé with avoir
    gloss: I ate. You finished. He took. We drank. You did. They ate.
    note: 'The passé composé has two parts: the present of *avoir* and a past participle. *J''ai*, *tu as*, *il/elle a*, *nous avons*, *vous avez*, *ils/elles ont*. Most verbs use *avoir*.'
  fr.a2.unit81.lesson01.teach.gn_participes:
    title: Past participles
    gloss: eat → eaten. finish → finished. take → taken. drink → drunk. do → done.
    note: 'Verbs in *-er* form the participle with *-é*; verbs in *-ir* often with *-i*. Many common verbs are irregular and must be learned: *pris*, *bu*, *fait*.'
  fr.a2.unit81.lesson01.teach.phrase:
    title: A morning in two actions
    gloss: This morning I had breakfast and I drank a coffee.
  fr.a2.unit81.lesson02.teach.verbes:
    title: Verbs of movement
    gloss: to leave / to arrive / to go / to go out / to stay
    note: These verbs describe going somewhere or staying. In the passé composé they use *être*.
    example_gloss:
    - He leaves at eight.
    - She arrives late.
    - We are going to work.
    - I stay at home.
  fr.a2.unit81.lesson02.teach.lieux:
    title: Places and timing
    gloss: work / the house, home / early / late
    example_gloss:
    - I am at home.
    - I leave early for work.
    - He is late.
  fr.a2.unit81.lesson02.teach.gn_etre:
    title: Passé composé with être
    gloss: I left. You arrived. He stayed. She went out. She left. We went. They left.
    note: 'A small group of verbs of movement and change use *être*: *aller, arriver, partir, sortir, rester, venir*. The present of *être* plus the participle.'
  fr.a2.unit81.lesson02.teach.gn_accord:
    title: Agreement with être
    gloss: He arrived. She arrived. They arrived. They arrived (fem.). We stayed.
    note: 'With *être*, the participle agrees with the subject: add *-e* for feminine, *-s* for plural. The spoken form is often the same.'
  fr.a2.unit81.lesson02.teach.phrase:
    title: Leaving and arriving
    gloss: I left at eight and I arrived at work at nine.
  fr.a2.unit81.lesson03.teach.reflexifs:
    title: Reflexive verbs
    gloss: to wake up / to get up / to get dressed
    note: 'These verbs have a reflexive pronoun: *me, te, se, nous, vous, se*.'
    example_gloss:
    - I wake up at seven.
    - He gets up early.
    - She gets dressed quickly.
  fr.a2.unit81.lesson03.teach.gn_pronominal:
    title: Reflexive verbs in the passé composé
    gloss: I woke up. You got up. He got dressed. She got dressed. She got up. We woke up.
    note: 'Reflexive verbs always use *être*. The reflexive pronoun comes before *être*: *je me suis, tu t''es, il s''est, nous nous sommes*. The participle usually agrees with the subject.'
  fr.a2.unit81.lesson03.teach.gn_negation:
    title: Negation with a reflexive verb
    gloss: I did not get up early.
    note: '*Ne* goes before the reflexive pronoun and *pas* after *être*: *je ne me suis pas levé*.'
  fr.a2.unit81.lesson03.teach.gn_choix:
    title: Avoir, être or reflexive?
    gloss: I had a shower. I left. I got up.
    note: Most verbs use *avoir*. A short list of movement verbs and every reflexive verb use *être*. Check the verb first, then choose the auxiliary.
  fr.a2.unit81.lesson03.teach.phrase:
    title: Three reflexive actions
    gloss: I woke up at seven, I got up and I got dressed.
  fr.a2.unit81.lesson04.teach.ordre:
    title: Putting things in order
    gloss: first / next / then / finally
    example_gloss:
    - First I had a shower.
    - Next I drank a coffee.
    - Then I left.
    - Finally I arrived.
  fr.a2.unit81.lesson04.teach.bus:
    title: Getting to work
    gloss: the bus / on time
    example_gloss:
    - I took the bus.
    - She arrived on time.
  fr.a2.unit81.lesson04.teach.gn_ordre:
    title: Telling a morning in order
    gloss: First I got up. Next I had a shower. Finally I left.
    note: 'Sequence words usually come first, followed by a comma. The verb stays in the passé composé: each step is a finished action.'
  fr.a2.unit81.lesson04.teach.gn_negation_avoir:
    title: Negation with avoir
    gloss: I did not have a shower. I did not drink coffee.
    note: '*Ne* goes before *avoir* and *pas* after it. After a negation, *un/une/du* becomes *de*: *je n''ai pas bu de café*.'
  fr.a2.unit81.lesson04.teach.phrase:
    title: A morning in order
    gloss: First I had a shower. Next I took the bus. Finally I arrived late.
  fr.a2.unit81.lesson05.teach.mots:
    title: Words for the message
    gloss: what a morning / so / see you soon / nine
    example_gloss:
    - What a morning!
    - I am late, so I take the bus.
    - See you soon, Camille!
    - It is nine o'clock.
  fr.a2.unit81.lesson05.teach.gn_accord_nom:
    title: Agreement with a noun
    gloss: The bus arrived. The friends arrived. The letter arrived.
    note: 'The participle agrees with the subject noun: *le bus ... arrivé*, *la lettre ... arrivée*, *les amis ... arrivés*.'
  fr.a2.unit81.lesson05.teach.gn_alors:
    title: Giving the result with alors
    gloss: The bus arrived late, so I arrived at nine.
    note: '*Alors* introduces a result. The word order does not change after it.'
  fr.a2.unit81.lesson05.teach.reading:
    title: Mathieu writes to Camille
    gloss: Hi Camille, what a morning! First I woke up at seven. I got up, I had a shower and I drank a coffee. Next I left at eight. The bus arrived late, so I arrived at work at nine. I did not have breakfast! See you soon, Mathieu
    note: Notice how the sequence words and the passé composé tell the morning step by step.
    glosses:
      alors: so
      neuf: nine
      quelle: what a
  fr.a2.unit81.lesson06.teach.q1:
    title: Camille asks
    gloss: 'Camille: Hi Mathieu! Did you arrive late this morning?'
  fr.a2.unit81.lesson06.teach.a1:
    title: Mathieu explains
    gloss: 'Mathieu: Yes! First, I did not get up early.'
  fr.a2.unit81.lesson06.teach.q2:
    title: Camille asks what happened next
    gloss: 'Camille: And then?'
  fr.a2.unit81.lesson06.teach.a2:
    title: Mathieu continues
    gloss: 'Mathieu: I had a shower, then I left at eight.'
  fr.a2.unit81.lesson06.teach.q3:
    title: Camille asks about the bus
    gloss: 'Camille: Did you take the bus?'
  fr.a2.unit81.lesson06.teach.a3:
    title: Mathieu finishes
    gloss: 'Mathieu: Yes, but the bus arrived late. I did not drink coffee.'
