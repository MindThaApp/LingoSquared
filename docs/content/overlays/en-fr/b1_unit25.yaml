course:
  title: "French B1"
  description: "Stating what you can do, could do, or could have done with a full embedded clause."

units:
  fr.b1.unit25.capacites:
    title: "Abilities with embedded clauses"

lessons:
  fr.b1.unit25.lesson01.capacite_presente:
    title: "What I can confirm"
  fr.b1.unit25.lesson02.capacite_hypothetique:
    title: "What I could do"

teaching:
  fr.b1.unit25.lesson01.teach.refresher_rendez_vous:
    title: "An appointment"
    gloss: "an appointment"
    note: "Refresher for B1 standalone use: *rendez-vous* is used for official appointments as well as everyday meetups."
    example_gloss: "My appointment is Tuesday."
  fr.b1.unit25.lesson01.teach.refresher_dossier:
    title: "A file / application"
    gloss: "a file / application"
    note: "In administrative French, *dossier* means the file or application with all the documents."
    example_gloss: "The file is complete."
  fr.b1.unit25.lesson01.teach.justificatif:
    title: "A proof of address"
    gloss: "a proof of address"
    note: "Refresher: a *justificatif de domicile* is a document proving where you live."
    example_gloss: "My proof of address is ready."
  fr.b1.unit25.lesson01.teach.peux_confirmer_que:
    title: "I can confirm that..."
    gloss: "I can confirm that..."
    note: "English often says just \"I can confirm.\" French B1 here needs the full clause after *que*."
    example_gloss: "I can confirm that my appointment is Tuesday."
  fr.b1.unit25.lesson01.teach.peux_expliquer_que:
    title: "I can explain that..."
    gloss: "I can explain that..."
    note: "This is not bare *je peux expliquer*; the important B1 step is the full statement after *que*."
    example_gloss: "I can explain that the file is complete."
  fr.b1.unit25.lesson01.teach.note_embedded:
    title: "Ability plus a full clause"
    gloss: "can + verb + that + full sentence"
    note: "Use *que* before the embedded sentence: *Je peux confirmer que le dossier est complet.*"

  fr.b1.unit25.lesson02.teach.pourrais_dire_que:
    title: "I could say that..."
    gloss: "I could say that..."
    note: "*Pourrais* makes the ability hypothetical or tentative."
    example_gloss: "I could say that I can send the copy tomorrow."
  fr.b1.unit25.lesson02.teach.aurais_pu_confirmer:
    title: "I could have confirmed that..."
    gloss: "I could have confirmed that..."
    note: "*J'aurais pu* looks back at a possible past action; keep the full *que* clause after it."
    example_gloss: "I could have confirmed that the file was complete."
  fr.b1.unit25.lesson02.teach.envoyer_copie:
    title: "Send a copy"
    gloss: "to send a copy"
    note: "*Une copie* is a document copy, not a cafe copy or school copybook."
    example_gloss: "I can send a copy tomorrow morning."
  fr.b1.unit25.lesson02.teach.dialogue_line01:
    title: "Mathieu asks about calling"
    gloss: "Mathieu asks whether Inès can call the town hall today."
  fr.b1.unit25.lesson02.teach.dialogue_line02:
    title: "Inès states present ability"
    gloss: "Inès says she can explain that her proof of address is ready."
  fr.b1.unit25.lesson02.teach.dialogue_line03:
    title: "Mathieu adds a condition"
    gloss: "Mathieu asks what happens if the officer asks for a copy."
  fr.b1.unit25.lesson02.teach.dialogue_line04:
    title: "Inès gives a hypothetical option"
    gloss: "Inès says she could tell the officer that she can send it tomorrow morning."
  fr.b1.unit25.lesson02.teach.dialogue_line05:
    title: "Mathieu asks about yesterday"
    gloss: "Mathieu asks whether she could have done it yesterday."
  fr.b1.unit25.lesson02.teach.dialogue_line06:
    title: "Inès contrasts past impossibility"
    gloss: "Inès says no: she was working at the pastry shop, so she could not have confirmed that the file was complete."

exercises:
  fr.b1.unit25.lesson01.exercise01.select_embedded:
    instruction: "What does the sentence confirm?"
    correct_option: "The appointment is Tuesday"
    distractors: ["The file is missing", "The town hall is closed"]
    accepted_answers: ["The appointment is Tuesday"]
  fr.b1.unit25.lesson01.exercise02.listen_confirmer:
    instruction: "Listen and select the exact sentence you hear."
    correct_option: "Je peux vous confirmer que mon rendez-vous est mardi."
    distractors: ["Je peux vous expliquer que le dossier est complet.", "Je pourrais vous dire que la copie est prête."]
    accepted_answers: ["Je peux vous confirmer que mon rendez-vous est mardi."]
  fr.b1.unit25.lesson01.exercise03.match_ability_phrases:
    instruction: "Match each French phrase to English."
    correct_response:
      "un rendez-vous": "an appointment"
      "un dossier": "a file / application"
      "un justificatif de domicile": "a proof of address"
      "je peux confirmer que...": "I can confirm that..."
      "je peux expliquer que...": "I can explain that..."
      "mon rendez-vous est mardi": "my appointment is Tuesday"
  fr.b1.unit25.lesson01.exercise04.order_confirmer:
    instruction: "Build the sentence: I can confirm that the file is complete."
    correct_response: ["Je", "peux", "confirmer", "que", "le", "dossier", "est", "complet"]
  fr.b1.unit25.lesson01.exercise05.write_present_ability:
    instruction: "Write exactly the form with a clause after *que*: *Je peux expliquer que mon justificatif de domicile est prêt.*"
    accepted_answers:
      - status: correct
        value: "Je peux expliquer que mon justificatif de domicile est prêt."
      - status: correct
        value: "Je peux expliquer que mon justificatif de domicile est prêt"

  fr.b1.unit25.lesson02.exercise01.select_hypothetical:
    instruction: "Is this a present fact or a hypothetical option?"
    correct_option: "A hypothetical option"
    distractors: ["A completed past action", "A rule with no option"]
    accepted_answers: ["A hypothetical option"]
  fr.b1.unit25.lesson02.exercise02.comprehend_dialogue:
    instruction: "Listen to the dialogue. What can Inès explain today?"
    correct_option: "That her proof of address is ready"
    distractors: ["That she lost her ID", "That the pastry shop is closed"]
    accepted_answers: ["That her proof of address is ready"]
  fr.b1.unit25.lesson02.exercise03.match_present_hypothetical:
    instruction: "Match each French ability phrase to its time or framing."
    correct_response:
      "je peux confirmer que...": "present ability"
      "je pourrais dire que...": "hypothetical ability"
      "j'aurais pu confirmer que...": "past possible ability"
      "je n'aurais pas pu confirmer que...": "past impossible ability"
      "envoyer une copie": "to send a copy"
      "demain matin": "tomorrow morning"
  fr.b1.unit25.lesson02.exercise04.order_aurais_pu:
    instruction: "Build the sentence: I could have confirmed that the file was complete."
    correct_response: ["J'aurais", "pu", "confirmer", "que", "le", "dossier", "était", "complet"]
  fr.b1.unit25.lesson02.exercise05.speak_ability:
    instruction: "Take Inès's role. Answer the officer with this exact ability form: *Je peux vous confirmer que mon rendez-vous est mardi.*"
    accepted_answers:
      - "Je peux vous confirmer que mon rendez-vous est mardi."
      - "Je peux vous confirmer que mon rendez-vous est mardi"
  fr.b1.unit25.lesson02.exercise06.write_culminating:
    instruction: "Write these two exact sentences: *Je peux expliquer que mon justificatif de domicile est prêt. Hier, je n'aurais pas pu confirmer que le dossier était complet.*"
    accepted_answers:
      - status: correct
        value: "Je peux expliquer que mon justificatif de domicile est prêt. Hier, je n'aurais pas pu confirmer que le dossier était complet."
