    accepted_answers:
      - {value: "D'après l'association, la concertation n'a jamais eu lieu.", status: correct}
      - {value: "D'après l'association, la concertation n'a jamais eu lieu", status: correct}
    feedback: "D'après l'association, la concertation n'a jamais eu lieu."

  fr.c1.unit07.mediation_sources.lesson03.exercise01.recognize_reformulation:
    instruction: "Which French phrase means 'to rephrase in plain terms'?"
    correct_option: "reformuler en termes simples"
