  notes: >-
    Overlay for French C1 unit 07 on mediating between sources. English-speaker
    interference risks: dropping the attribution (writing "the street will be
    pedestrianized" without "selon la mairie"), and flattening the disagreement
    into a single merged claim. The production exercises therefore name the
    exact taught model and require preserving attribution, disagreement, and
    uncertainty. No sibling-direction overlay was consulted.

course:
  title: French C1
  description: "Advanced French mediation: distilling conflicting sources and relaying them accurately for a specific listener."

units:
  fr.c1.unit07.mediation_sources:
    title: "Mediating between sources"
    description: "Distill two conflicting sources and relay them accurately and appropriately for a specific listener or reader."

lessons:
  fr.c1.unit07.mediation_sources.lesson01.attribution:
    title: "Attributing information"
  fr.c1.unit07.mediation_sources.lesson02.desaccord:
    title: "The point of disagreement"
  fr.c1.unit07.mediation_sources.lesson03.reformulation:
    title: "Rephrasing in plain terms"
  fr.c1.unit07.mediation_sources.lesson04.attribution_fidele:
    title: "Preserving the disagreement"
  fr.c1.unit07.mediation_sources.lesson05.relais_oral:
    title: "Relaying orally"
  fr.c1.unit07.mediation_sources.lesson06.brief_ecrit:
    title: "Writing the briefing"

teaching:
  fr.c1.unit07.mediation_sources.lesson01.teach.une_source:
    title: "a source"
    gloss: "a source"
    note: "*Une source* (a source) is the document, account, or person a piece of information comes from. Mediation always names its sources."
  fr.c1.unit07.mediation_sources.lesson01.teach.selon_la_mairie:
    title: "according to the town hall"
    gloss: "according to the town hall"
    note: "*Selon* (according to) attributes a claim to its source without vouching for it yourself."
  fr.c1.unit07.mediation_sources.lesson01.teach.dapres_lassociation:
    title: "according to the association"
    gloss: "according to the association"
    note: "*D'après* is a second way to attribute a claim; it pairs naturally with a named body like *l'association* (the association)."
  fr.c1.unit07.mediation_sources.lesson01.teach.affirmer_le_contraire:
    title: "to assert the opposite"
    gloss: "to assert the opposite"
    note: "*Affirmer* (to assert) reports what a source claims; *le contraire* (the opposite) signals a disagreement."
  fr.c1.unit07.mediation_sources.lesson01.teach.modele_attribution:
    title: "Attributing a claim"
    gloss: "According to the town hall, the street will be pedestrianized in March."
    note: "This sentence attributes the pedestrianization to the town hall — the speaker reports the claim without endorsing it."

  fr.c1.unit07.mediation_sources.lesson02.teach.se_contredire:
    title: "to contradict each other"
    gloss: "to contradict each other"
    note: "*Se contredire* (to contradict each other) describes two sources that make incompatible claims."
  fr.c1.unit07.mediation_sources.lesson02.teach.un_desaccord:
    title: "a point of disagreement"
    gloss: "a point of disagreement"
    note: "*Un point de désaccord* is the specific matter the two sources dispute."
  fr.c1.unit07.mediation_sources.lesson02.teach.dementir:
    title: "to deny / to refute"
    gloss: "to deny / to refute"
    note: "*Démentir une information* (to deny a piece of information) is what a source does when it contradicts another's claim."
  fr.c1.unit07.mediation_sources.lesson02.teach.la_concertation:
    title: "the consultation"
    gloss: "the consultation"
    note: "*La concertation* is the formal consultation with stakeholders; it is the exact point the two sources dispute."
  fr.c1.unit07.mediation_sources.lesson02.teach.elle_affirme:
    title: "she asserts the opposite"
    gloss: "she asserts the opposite"
    note: "*Elle affirme le contraire* — the association (feminine noun) asserts the opposite; note the conjugated *affirme* (from *affirmer*)."
  fr.c1.unit07.mediation_sources.lesson02.teach.modele_desaccord:
    title: "The disagreement, stated"
    gloss: "According to the town hall, the consultation has already taken place. The association, for its part, asserts the opposite: it never took place."
    note: "The two sources contradict each other on one precise point: whether the consultation happened. A good mediation preserves that conflict."

  fr.c1.unit07.mediation_sources.lesson03.teach.reformuler:
    title: "to rephrase in plain terms"
    gloss: "to rephrase in plain terms"
    note: "*Reformuler en termes simples* (to rephrase in plain terms) is the core move of relaying specialist material to a non-specialist."
  fr.c1.unit07.mediation_sources.lesson03.teach.un_non_specialiste:
    title: "a non-specialist"
    gloss: "a non-specialist"
    note: "*Un non-spécialiste* is someone who lacks the specialist vocabulary; mediation aims at exactly this listener."
  fr.c1.unit07.mediation_sources.lesson03.teach.autrement_dit:
    title: "in other words"
    gloss: "in other words"
    note: "*Autrement dit* (in other words) introduces a plainer restatement of what was just said."
  fr.c1.unit07.mediation_sources.lesson03.teach.cest_a_dire:
    title: "that is to say"
    gloss: "that is to say"
    note: "*C'est-à-dire* (that is to say) introduces a definition or clarification."
  fr.c1.unit07.mediation_sources.lesson03.teach.reservee_aux_pietons:
    title: "reserved for pedestrians"
    gloss: "reserved for pedestrians"
    note: "*Réservée aux piétons* (reserved for pedestrians) is the plain-language gloss of the technical term *piétonnisation*."
  fr.c1.unit07.mediation_sources.lesson03.teach.modele_reformulation:
    title: "Resolving the technical term"
    gloss: "Pedestrianization, that is to say a street reserved for pedestrians."
    note: "This resolves the jargon: *piétonnisation* is restated as *une rue réservée aux piétons* for the non-specialist."

  fr.c1.unit07.mediation_sources.lesson04.teach.preserver:
    title: "to preserve the disagreement"
    gloss: "to preserve the disagreement"
    note: "*Préserver le désaccord* (to preserve the disagreement) is a mediation duty: relay the conflict, do not paper it over."
  fr.c1.unit07.mediation_sources.lesson04.teach.attribuer:
    title: "to attribute information to its source"
    gloss: "to attribute information to its source"
    note: "*Attribuer une information à sa source* means every relayed claim keeps its author, so the listener knows who said what."
  fr.c1.unit07.mediation_sources.lesson04.teach.les_travaux:
    title: "the roadworks"
    gloss: "the roadworks"
    note: "*Les travaux* (the works/roadworks) is the specialist noun for the construction work."
  fr.c1.unit07.mediation_sources.lesson04.teach.bloqueront_l_acces:
    title: "will block access to the shops"
    gloss: "will block access to the shops"
    note: "*Bloqueront l'accès aux boutiques* (will block access to the shops) is the association's warning about the works' impact."
  fr.c1.unit07.mediation_sources.lesson04.teach.pendant_plusieurs_mois:
    title: "for several months"
    gloss: "for several months"
    note: "*Pendant plusieurs mois* (for several months) states the claimed duration of the disruption."
  fr.c1.unit07.mediation_sources.lesson04.teach.la_clientele:
    title: "the clientele"
    gloss: "the customers / the clientele"
    note: "*La clientèle* (the clientele/customers) is the shop's customer base the association says would be driven away."
  fr.c1.unit07.mediation_sources.lesson04.teach.modele_fidelite:
    title: "Preserving disagreement and uncertainty"
    gloss: "The works would drive customers away, but the pedestrianization seems decided."
    note: "*Semble décidée* (seems decided) and *mais* (but) keep the tension: the plan looks settled, yet its consequences are contested."

  fr.c1.unit07.mediation_sources.lesson05.teach.je_te_resume:
    title: "I summarize for you"
    gloss: "I summarize the two sources for you"
    note: "*Je te résume* (I summarize for you) opens the relay and keeps the informal *tu* register with Mathieu."
  fr.c1.unit07.mediation_sources.lesson05.teach.les_deux_sources:
    title: "the two sources"
    gloss: "the two sources"
    note: "*Les deux sources* (the two sources) names the material being condensed."
  fr.c1.unit07.mediation_sources.lesson05.teach.commenceront_au_printemps:
    title: "will begin in the spring"
    gloss: "will begin in the spring"
    note: "*Commenceront au printemps* (will begin in the spring) is the town hall's stated timetable for the works."
  fr.c1.unit07.mediation_sources.lesson05.teach.modele_relais:
    title: "The complete oral relay"
    gloss: "I summarize the two sources for you. According to the town hall, the street will be pedestrianized in March and the consultation has already taken place. The association, for its part, asserts the opposite: the consultation never took place. In other words, the pedestrianization — that is, a street reserved for pedestrians — seems decided, but its timetable remains uncertain."
    note: "This is the exact model for the final speaking task: condense two sources, attribute each claim, preserve the disagreement, resolve the technical term, and express the remaining uncertainty."

  fr.c1.unit07.mediation_sources.lesson06.teach.modele_brief:
    title: "The complete briefing"
    gloss: "I summarize the two sources for you. According to the town hall, the street will be pedestrianized in March and the consultation has already taken place. The association, for its part, asserts the opposite: the consultation never took place. In other words, the pedestrianization — that is, a street reserved for pedestrians — seems decided, but its timetable remains uncertain."
    note: "This is the exact model for the final writing task — an audience-specific briefing that synthesizes two conflicting sources in accessible language."
  fr.c1.unit07.mediation_sources.lesson06.teach.l_incertitude:
    title: "the uncertainty"
    gloss: "the uncertainty"
    note: "*L'incertitude* (uncertainty) is what a faithful briefing leaves visible when the sources do not settle a question."
    example_gloss: "The timetable remains a source of uncertainty."

exercises:
  fr.c1.unit07.mediation_sources.lesson01.exercise01.recognize_attribution:
    instruction: "Which French phrase attributes a claim to the town hall?"
    correct_option: "selon la mairie"
    distractors: ["d'après la rue", "avant la mairie", "sans la mairie"]
    accepted_answers: [{value: "selon la mairie", status: correct}]
    feedback: "*Selon la mairie* means according to the town hall — it attributes the claim to that source."
  fr.c1.unit07.mediation_sources.lesson01.exercise02.listen_attribution:
    instruction: "Listen and select what you hear."
    correct_option: "According to the town hall, the street will be pedestrianized in March."
    distractors: ["According to the town hall, the street was pedestrianized in March.", "According to the association, the street will be pedestrianized in March.", "According to the town hall, the consultation never happened."]
    accepted_answers: [{value: "According to the town hall, the street will be pedestrianized in March.", status: correct}]
    feedback: "Selon la mairie, la rue sera piétonnisée au mois de mars means according to the town hall, the street will be pedestrianized in March."
  fr.c1.unit07.mediation_sources.lesson01.exercise03.match_attribution:
    instruction: "Match each French attribution phrase to its English meaning."
    accepted_answers:
      - value: {"une source": "a source", "selon la mairie": "according to the town hall", "d'après l'association": "according to the association", "affirmer": "to assert", "le contraire": "the opposite", "la mairie": "the town hall"}
        status: correct
    feedback: "These phrases attribute claims to their sources."
  fr.c1.unit07.mediation_sources.lesson01.exercise04.order_attribution:
    instruction: "Put the French words in order to form the attribution phrase."
    accepted_answers:
      - {value: "selon la mairie", status: correct}
    feedback: "The phrase is selon la mairie — according to the town hall."
  fr.c1.unit07.mediation_sources.lesson01.exercise05.write_attribution:
    instruction: "Write the exact sentence attributing the pedestrianization to the town hall."
    accepted_answers:
      - {value: "Selon la mairie, la rue sera piétonnisée au mois de mars.", status: correct}
      - {value: "Selon la mairie, la rue sera piétonnisée au mois de mars", status: correct}
    feedback: "Selon la mairie, la rue sera piétonnisée au mois de mars."

  fr.c1.unit07.mediation_sources.lesson02.exercise01.recognize_desaccord:
    instruction: "Which French phrase means 'to contradict each other'?"
    correct_option: "se contredire"
    distractors: ["se comprendre", "se rencontrer", "se ressembler"]
    accepted_answers: [{value: "se contredire", status: correct}]
    feedback: "*Se contredire* means to contradict each other."
  fr.c1.unit07.mediation_sources.lesson02.exercise02.listen_desaccord:
    instruction: "Listen and select what you hear."
    correct_option: "According to the association, the consultation never took place."
    distractors: ["According to the association, the consultation already took place.", "According to the town hall, the consultation never took place.", "According to the association, the works will begin in spring."]
    accepted_answers: [{value: "According to the association, the consultation never took place.", status: correct}]
    feedback: "D'après l'association, la concertation n'a jamais eu lieu means according to the association, the consultation never took place."
  fr.c1.unit07.mediation_sources.lesson02.exercise03.match_desaccord:
    instruction: "Match each French disagreement phrase to its English meaning."
    accepted_answers:
      - value: {"se contredire": "to contradict each other", "un point de désaccord": "a point of disagreement", "démentir": "to deny / to refute", "une information": "a piece of information", "la concertation": "the consultation", "elle affirme le contraire": "she asserts the opposite"}
        status: correct
