teaching:
  fr.a1.unit48.lesson01.teach.le_manteau_le:
    title: Coat, sweater
    gloss: the coat, the sweater
    note: '*Le manteau* and *le pull* are both masculine.'
    example_gloss:
    - I am looking for a coat.
    - I have a sweater.
  fr.a1.unit48.lesson01.teach.le_pantalon_les:
    title: Pants, shoes
    gloss: the pants/trousers, the shoes
    note: '*Pantalon* is singular in French even though English ''pants'' is plural: *un pantalon* for one pair. *Chaussures* is the plural of *chaussure*; shoes are usually mentioned in the plural, as in English.'
    example_gloss:
    - I am looking for pants.
    - I am looking for shoes.
  fr.a1.unit48.lesson01.teach.je_cherche_un:
    title: Saying what you're looking for
    gloss: I am looking for a coat.
    note: '*Chercher* (to look for) takes a direct object with no preposition, unlike English ''look for'': *je cherche un manteau*.'
  fr.a1.unit48.lesson02.teach.la_taille:
    title: Size
    gloss: the size
    note: '*Taille* is feminine: *la taille*.'
    example_gloss: What size do you wear?
  fr.a1.unit48.lesson02.teach.quelle_taille_faites:
    title: Asking about size
    gloss: What size do you wear?
    note: '*Quelle taille ?* uses *quelle* (which) because *taille* is feminine and has a small set of expected answers (S, M, L, or a number).'
  fr.a1.unit48.lesson02.teach.je_fais_du:
    title: Stating your size
    gloss: I am a size M.
    note: '*Faire du M* means to be a size M: French uses *faire* (to make) where English says ''be'' or ''wear''.'
  fr.a1.unit48.lesson03.teach.noir_bleu:
    title: Black, blue
    gloss: black, blue
    note: The two base color adjectives in this lesson.
    example_gloss:
    - I want the coat in black.
    - Do you also have this in blue?
  fr.a1.unit48.lesson03.teach.je_veux_le:
    title: Requesting a color
    gloss: I want the coat in black.
    note: '*En* + color is the standard way to specify a garment''s color when ordering or requesting it.'
  fr.a1.unit48.lesson03.teach.avez_vous_aussi:
    title: Asking about another color
    gloss: Do you also have this in blue?
    note: '*Aussi* (also) asks whether another color is available, using the formal *vous* register.'
  fr.a1.unit48.lesson04.teach.est_ce_que:
    title: Asking about fit
    gloss: Does this coat fit?
    note: '*Aller* (to go) is the natural verb for clothing fit: *il me va bien*, literally ''it goes well on me''.'
  fr.a1.unit48.lesson04.teach.il_me_va:
    title: Confirming a good fit
    gloss: It fits well.
    note: '*Bien* (well) describes how the item fits.'
  fr.a1.unit48.lesson04.teach.c_est_trop:
    title: Too small
    gloss: It is too small.
    note: '*Trop* (too) comes before the adjective to express excess.'
  fr.a1.unit48.lesson04.teach.c_est_trop_2:
    title: Too big
    gloss: It is too big.
    note: Same *trop* + adjective pattern as the previous card's *trop petit*.
  fr.a1.unit48.lesson05.teach.quatre_vingt_dix:
    title: Ninety
    gloss: ninety
    note: '*Quatre-vingt-dix* is the number 90 (literally ''four twenties ten''), used here in the coat''s price.'
    example_gloss: The coat costs ninety euros.
  fr.a1.unit48.lesson05.teach.le_manteau_coute:
    title: Stating a price
    gloss: The coat costs ninety euros.
    note: '*Coûte* is the *il* form of *coûter* (to cost).'
  fr.a1.unit48.lesson05.teach.parka_taille_m:
    title: Read a store receipt
    gloss: 'Winter coat: size M, color black. Price: ninety euros. This coat fits well and is warm.'
    note: Track the size, color, price, and the two qualities mentioned about the coat.
    glosses:
      Parka: winter coat
      taille: size
      couleur: color
      noire: black
      Prix: price
      quatre-vingt-dix: ninety
      euros: euros
      manteau: coat
      va: fits
      chaud: warm
  fr.a1.unit48.lesson06.teach.camille_ce_manteau:
    title: Camille notices the coat
    gloss: 'Camille: This coat is nice! What size are you?'
    note: '*Joli* (nice, pretty) is a general positive reaction; it is masculine here to agree with *manteau*.'
  fr.a1.unit48.lesson06.teach.mathieu_je_fais:
    title: Mathieu asks to try it on
    gloss: 'Mathieu: I am a size M. May I try it on?'
    note: '*Je peux ... ?* is the standard way to ask permission; *l''essayer* means ''try it on'', and *l''* stands for the coat.'
  fr.a1.unit48.lesson06.teach.camille_bien_sur:
    title: Camille asks about the fit
    gloss: 'Camille: Of course. Does it fit well?'
    note: '*Il* (he, it) refers back to *le manteau*, a masculine noun.'
  fr.a1.unit48.lesson06.teach.mathieu_oui_il:
    title: Mathieu confirms
    gloss: 'Mathieu: Yes, it fits well and it''s warm.'
    note: Matches the receipt read in lesson05 exactly -- this is the same coat.
  fr.a1.unit48.lesson06.teach.camille_super_tu:
    title: Camille asks about color
    gloss: 'Camille: Great! Do you want it in black or in blue?'
    note: '*Tu le veux en ... ou en ... ?* offers a choice; *le* stands for the coat.'
  fr.a1.unit48.lesson06.teach.mathieu_je_le:
    title: Mathieu decides
    gloss: 'Mathieu: I''ll take it in black.'
    note: '*Prendre* (to take) is the natural verb for finalizing a purchase choice, matching the receipt''s stated color.'
  fr.a1.unit48.lesson06.teach.on_ecrit_prends:
    title: Prends or prend
    gloss: '*Prends* is the I-form and you-form of *prendre* (to take); *prend* is the he/she-form.'
    note: 'The pattern of *prendre*: *je prends, tu prends, il/elle prend*.'
