answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A2 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or liaison marks.
course:
  title: French A2
  description: Intermediate French continuing the Camille and Mathieu storyline, now with a grammar-led block on everyday functions.
  learning_goal: Make polite requests and offers with je voudrais, pourriez-vous, pouvez-vous and je peux vous aider.
units:
  fr.a2.unit89.pourriez_vous:
    title: Could you help me?
    description: Make polite requests, offer help, and accept or decline an offer politely.
lessons:
  fr.a2.unit89.lesson01.je_voudrais:
    title: I would like a coffee
  fr.a2.unit89.lesson02.pourriez_vous:
    title: Could you repeat?
  fr.a2.unit89.lesson03.je_peux_vous_aider:
    title: Can I help you?
  fr.a2.unit89.lesson04.volontiers:
    title: Yes, gladly
  fr.a2.unit89.lesson05.au_cafe:
    title: Camille's tip
  fr.a2.unit89.lesson06.au_cafe_dialogue:
    title: Mathieu at the café
teaching:
  fr.a2.unit89.lesson01.teach.mots:
    title: At the café
    gloss: a coffee / a tea / a water / a table / please / thank you very much
    example_gloss:
    - I would like a coffee, please.
    - A water, please.
    - We would like a table.
    - Thank you very much!
  fr.a2.unit89.lesson01.teach.gn_voudrais:
    title: Je voudrais
    gloss: I would like, you would like, he would like, we would like, you would like, they would like
    note: '*Je voudrais* is the polite way to ask for something. It is softer than *je veux*, which sounds blunt. For a group use *nous voudrions*.'
  fr.a2.unit89.lesson01.teach.gn_infinitif:
    title: With a noun or a verb
    gloss: I would like a tea. I would like to book a table. I would like to pay.
    note: '*Je voudrais* can be followed by a noun (*un thé*) or an infinitive (*réserver*, *payer*).'
  fr.a2.unit89.lesson01.teach.gn_politesse:
    title: Polite frame
    gloss: Hello, I would like a coffee, please. Thank you very much!
    note: Greet first, ask with *je voudrais*, add *s'il vous plaît*, and thank at the end. Use *s'il vous plaît* with strangers and *s'il te plaît* with friends.
  fr.a2.unit89.lesson01.teach.phrase:
    title: Ordering
    gloss: I would like a tea, please.
  fr.a2.unit89.lesson02.teach.mots:
    title: Things to ask for
    gloss: to repeat / to bring / to help / to speak / more slowly / the bill
    example_gloss:
    - Can you repeat?
    - Could you bring the bill?
    - Could you speak more slowly?
  fr.a2.unit89.lesson02.teach.gn_pouvezvous:
    title: Pouvez-vous
    gloss: Can you repeat? Can you bring the bill?
    note: 'To ask a stranger or someone you call *vous*, invert the verb and the pronoun: *pouvez-vous*, with a hyphen, plus an infinitive.'
  fr.a2.unit89.lesson02.teach.gn_pourriez:
    title: Pourriez-vous
    gloss: Could you repeat, please? Could you speak more slowly?
    note: '*Pourriez-vous* is the most polite way to ask. Learn it as one block: *pourriez-vous* plus an infinitive.'
  fr.a2.unit89.lesson02.teach.gn_tutoie:
    title: With a friend
    gloss: Can you help me? Can you bring the bread?
    note: With a friend, the simple form *tu peux* is enough. *M'* is the short form of *me*.
  fr.a2.unit89.lesson02.teach.phrase:
    title: A polite request
    gloss: Could you repeat, please?
  fr.a2.unit89.lesson03.teach.mots:
    title: Offering help
    gloss: to carry / to open / the door / the bag / your (formal) / would you like
    example_gloss:
    - Can I carry your bag?
    - Can I open the door?
    - Would you like a coffee?
  fr.a2.unit89.lesson03.teach.gn_offre:
    title: Je peux vous aider ?
    gloss: Can I help you? Can I carry your bag?
    note: 'An offer of help is *je peux* plus an infinitive. *Vous* goes before the verb it belongs to: *je peux vous aider*.'
  fr.a2.unit89.lesson03.teach.gn_voulezvous:
    title: Offering something
    gloss: Would you like a coffee? Would you like a tea?
    note: '*Voulez-vous* is the polite offer. In speech, *vous voulez* with rising intonation is also common.'
  fr.a2.unit89.lesson03.teach.gn_tu:
    title: With a friend
    gloss: Can I help you? Do you want a tea?
    note: With a friend, use *t'* for 'you' before a vowel and *tu veux* for 'do you want'.
  fr.a2.unit89.lesson03.teach.phrase:
    title: An offer
    gloss: Can I help you?
  fr.a2.unit89.lesson04.teach.mots:
    title: Replying to an offer
    gloss: gladly / with pleasure / no thank you / it's fine / that's kind / one moment
    example_gloss:
    - Yes, gladly.
    - With pleasure, thank you.
    - No thank you, I'm fine.
    - One moment, please.
  fr.a2.unit89.lesson04.teach.gn_accepter:
    title: Accepting
    gloss: Yes, gladly. Yes, with pleasure, thank you.
    note: To accept an offer politely, say *oui, volontiers* or *avec plaisir*. Add *merci* to be warm.
  fr.a2.unit89.lesson04.teach.gn_refuser:
    title: Declining
    gloss: No thank you, I'm fine. That's kind, but no thank you.
    note: To decline gently, say *non merci, ça va*. *C'est gentil, mais...* softens the refusal.
  fr.a2.unit89.lesson04.teach.gn_demande:
    title: Replying to a request
    gloss: Of course, one moment. Sorry, it is not possible.
    note: After a request, *bien sûr* agrees; *désolé, ce n'est pas possible* refuses politely.
  fr.a2.unit89.lesson04.teach.phrase:
    title: Declining
    gloss: No thank you, I'm fine.
  fr.a2.unit89.lesson05.teach.mots:
    title: Words for the tip
    gloss: here is / how / to order / the waiter / to answer / to say / to ask / then
    example_gloss:
    - Here is how to order.
    - You say hello.
    - 'The waiter answers: of course.'
    - Then you ask for the bill.
  fr.a2.unit89.lesson05.teach.gn_ordre:
    title: Steps at the café
    gloss: First, you say hello. Then you order. You say thank you.
    note: Steps are linked with *d'abord* and *ensuite*, each with the *tu* form of the verb.
  fr.a2.unit89.lesson05.teach.gn_dis:
    title: Dire and répondre
    gloss: I say, you say, he says. I answer, you answer, he answers.
    note: '*Dire* and *répondre* are used to report what people say in a short scene.'
  fr.a2.unit89.lesson05.teach.reading:
    title: Camille coaches Mathieu
    gloss: 'Hi Mathieu! Here is how to order at the café. You say: Hello, I would like a tea, please. The waiter answers: Of course! Then you ask: Could you bring the bill, please? He says: With pleasure. Camille'
    note: The text shows a request, a reply and a second request in the right order.
    glosses:
      commander: to order
      serveur: waiter
  fr.a2.unit89.lesson06.teach.q1:
    title: The waiter greets
    gloss: 'Le serveur: Hello! Can I help you?'
  fr.a2.unit89.lesson06.teach.a1:
    title: Mathieu orders
    gloss: 'Mathieu: Hello, I would like a tea, please.'
  fr.a2.unit89.lesson06.teach.q2:
    title: The waiter offers
    gloss: 'Le serveur: Of course. Would you like a croissant too?'
  fr.a2.unit89.lesson06.teach.a2:
    title: Mathieu declines and asks
    gloss: 'Mathieu: No thank you, I''m fine. Could you bring the bill, please?'
  fr.a2.unit89.lesson06.teach.q3:
    title: The waiter agrees
    gloss: 'Le serveur: With pleasure. One moment.'
  fr.a2.unit89.lesson06.teach.a3:
    title: Mathieu thanks
    gloss: 'Mathieu: Thank you very much!'
