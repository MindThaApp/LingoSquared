  fr.a1.unit56.lesson04.teach.pour_les_transports:
    title: À vélo, en train
    gloss: French uses *à* for transport you ride or walk (*à vélo*, *à pied*) and *en* for transport you sit inside (*en train*, *en voiture*).
    note: Learners often copy English and say *par vélo* or *dans le train*. Treat *à vélo*, *à pied*, *en train* and *en voiture* as fixed phrases.
