  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Overlay for French C1 unit 04 on conceding and counter-arguing with
    subtlety. English-speaker interference risks: reading a concession as the
    speaker's final position (or a qualification as a full rebuttal), and
    writing an open production prompt that a learner could answer with several
    different concession markers. The production exercises therefore name
    exact taught models and accept those strings. No sibling-direction overlay
    was consulted.

course:
  title: French C1
  description: "Advanced French argumentation: conceding a valid point, qualifying it, countering it, and weighing competing considerations."

units:
  fr.c1.unit04.conc_et_contredire:
    title: "Conceding and counter-arguing"
    description: "Argue with subtlety: genuinely concede a valid opposing point, qualify its scope, present a proportionate counterargument, and weigh the competing considerations."

