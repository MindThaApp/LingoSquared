  fr.c1.unit04.conc_et_contredire.lesson03.contreargumenter:
    title: "Counter-arguing"
  fr.c1.unit04.conc_et_contredire.lesson04.peser:
    title: "Weighing the pros and cons"
  fr.c1.unit04.conc_et_contredire.lesson05.suivre_argument:
    title: "Following a nuanced argument"
  fr.c1.unit04.conc_et_contredire.lesson06.argumentation_complete:
    title: "The complete argument"

teaching:
  fr.c1.unit04.conc_et_contredire.lesson01.teach.certes:
    title: "admittedly"
    gloss: "admittedly / to be sure"
    note: "*Certes* (admittedly) concedes a valid point before you qualify it."
  fr.c1.unit04.conc_et_contredire.lesson01.teach.je_reconnais_que:
    title: "I acknowledge that"
    gloss: "I acknowledge that"
    note: "*Je reconnais que* (I acknowledge that) concedes a point explicitly."
  fr.c1.unit04.conc_et_contredire.lesson01.teach.tu_as_raison_sur_un_point:
    title: "you are right on one point"
    gloss: "you are right on one point"
    note: "*Tu as raison sur un point* concedes that the other person is right about one specific point, using informal *tu*."
  fr.c1.unit04.conc_et_contredire.lesson01.teach.je_te_l_accorde:
    title: "I grant you that"
    gloss: "I grant you that"
    note: "*Je te l'accorde* (I grant you that) concedes a point using informal *te*."
  fr.c1.unit04.conc_et_contredire.lesson01.teach.il_est_vrai_que:
    title: "it is true that"
    gloss: "it is true that"
    note: "*Il est vrai que* (it is true that) introduces a conceded truth."
  fr.c1.unit04.conc_et_contredire.lesson01.teach.modele_concession:
    title: "A concession"
    gloss: "Admittedly, you're right to say that delivering to one's home would attract more customers."
    note: "This sentence genuinely grants Mathieu's strongest point — more customers — before qualifying it."

  fr.c1.unit04.conc_et_contredire.lesson02.teach.pour_autant:
    title: "even so"
    gloss: "even so / for all that"
    note: "*Pour autant* (even so) qualifies what was just conceded without dismissing it."
  fr.c1.unit04.conc_et_contredire.lesson02.teach.dans_une_certaine_mesure:
    title: "to a certain extent"
    gloss: "to a certain extent"
    note: "*Dans une certaine mesure* (to a certain extent) limits the scope of a point."
  fr.c1.unit04.conc_et_contredire.lesson02.teach.cela_dit:
    title: "that said"
    gloss: "that said"
    note: "*Cela dit* (that said) introduces a qualification after a concession."
  fr.c1.unit04.conc_et_contredire.lesson02.teach.en_partie:
    title: "partly"
    gloss: "partly"
    note: "*En partie* (partly) narrows a claim to part of its scope."
  fr.c1.unit04.conc_et_contredire.lesson02.teach.modele_qualification:
    title: "A qualification"
    gloss: "Even so, the delivery would cost us a lot in time and materials."
    note: "This sentence narrows the conceded point by naming its cost, rather than denying the point outright."

  fr.c1.unit04.conc_et_contredire.lesson03.teach.en_revanche:
    title: "by contrast"
    gloss: "by contrast / on the other hand"
    note: "*En revanche* (by contrast) introduces a counterargument."
  fr.c1.unit04.conc_et_contredire.lesson03.teach.neanmoins:
    title: "nevertheless"
    gloss: "nevertheless"
    note: "*Néanmoins* (nevertheless) counters a preceding point."
  fr.c1.unit04.conc_et_contredire.lesson03.teach.cependant:
    title: "however"
    gloss: "however"
    note: "*Cependant* (however) introduces a contrasting point."
  fr.c1.unit04.conc_et_contredire.lesson03.teach.toutefois:
    title: "nonetheless"
    gloss: "nonetheless"
    note: "*Toutefois* (nonetheless) is a formal counter marker."
  fr.c1.unit04.conc_et_contredire.lesson03.teach.modele_contreargument:
    title: "A counterargument"
    gloss: "By contrast, by taking care of our regulars and the quality of our products, we will gain a loyal clientele."
    note: "This sentence presents Inès's counterargument — what she would rather do — as a proportionate reply to the conceded point."

  fr.c1.unit04.conc_et_contredire.lesson04.teach.tout_bien_pese:
    title: "all things considered"
    gloss: "all things considered"
    note: "*Tout bien pesé* (all things considered) signals a final weighing."
  fr.c1.unit04.conc_et_contredire.lesson04.teach.mettre_en_balance:
    title: "to weigh up"
    gloss: "to weigh up"
    note: "*Mettre en balance* (to weigh up) contrasts two competing considerations."
  fr.c1.unit04.conc_et_contredire.lesson04.teach.l_emporter_sur:
    title: "to prevail over"
    gloss: "to prevail over / to outweigh"
    note: "*L'emporter sur* (to prevail over) states which consideration wins the weighing."
  fr.c1.unit04.conc_et_contredire.lesson04.teach.en_fin_de_compte:
    title: "in the end"
    gloss: "in the end"
    note: "*En fin de compte* (in the end) closes the weighing."
  fr.c1.unit04.conc_et_contredire.lesson04.teach.modele_pesee:
    title: "A final weighing"
    gloss: "All things considered, I'd rather consolidate what already works than spread ourselves thin with the delivery."
    note: "This sentence weighs the two considerations and states Inès's final judgement."

  fr.c1.unit04.conc_et_contredire.lesson05.teach.la_concession:
    title: "the concession"
    gloss: "the concession"
    note: "*La concession* (the concession) is the point you grant to the opposing side."
    example_gloss: "Inès's concession concerns the delivery."
  fr.c1.unit04.conc_et_contredire.lesson05.teach.le_contre_argument:
    title: "the counterargument"
    gloss: "the counterargument"
    note: "*Le contre-argument* (the counterargument) is the proportionate reply to the conceded point."
    example_gloss: "Inès's counterargument is solid."
  fr.c1.unit04.conc_et_contredire.lesson05.teach.modele_argument_complet:
    title: "The complete nuanced argument"
    gloss: "Admittedly, you're right to say that delivering to one's home would attract more customers. Even so, the delivery would cost us a lot in time and materials. By contrast, by taking care of our regulars and the quality of our products, we will gain a loyal clientele. All things considered, I'd rather consolidate what already works than spread ourselves thin with the delivery."
    note: "This is the exact model: concede, qualify, counter, and weigh, in that order."

  fr.c1.unit04.conc_et_contredire.lesson06.teach.modele_complet:
    title: "The complete nuanced argument"
    gloss: "Admittedly, you're right to say that delivering to one's home would attract more customers. Even so, the delivery would cost us a lot in time and materials. By contrast, by taking care of our regulars and the quality of our products, we will gain a loyal clientele. All things considered, I'd rather consolidate what already works than spread ourselves thin with the delivery."
    note: "The exact model for the final speaking and writing tasks: concede, qualify, counter, and weigh."
  fr.c1.unit04.conc_et_contredire.lesson06.teach.argumenter_avec_nuance:
    title: "to argue with nuance"
    gloss: "to argue with nuance"
    note: "*Argumenter avec nuance* (to argue with nuance) names the whole skill this outcome asks for."
    example_gloss: "You have to know how to argue with nuance."

