answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A1
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation or liaison marks.

course:
  title: "French A1"
  description: >-
    Market vocabulary, asking prices and quantities with combien/kilo/litre,
    and the du/de la vs. plain de contrast after quantity expressions,
    continuing Inès and Mathieu's cooking-workshop narrative into a
    market-shopping scenario. English-specific guidance highlights that
    French drops the partitive article entirely after an explicit quantity
    (un kilo de tomates, not un kilo des tomates).

units:
  fr.a1.unit04.shopping:
    title: "Grocery shopping with Inès"

lessons:
  fr.a1.unit04.lesson01.au_marche:
    title: "At the market"
  fr.a1.unit04.lesson02.combien_ca_coute:
    title: "How much does it cost?"
  fr.a1.unit04.lesson03.dialogue_marche:
    title: "At the market with Inès and Mathieu"

teaching:
  fr.a1.unit04.lesson01.teach.marche:
    title: "The market"
    gloss: "the market"
    note: "*Marché* is masculine."
    example_gloss: "The market is open on Saturdays."
  fr.a1.unit04.lesson01.teach.boulangerie:
    title: "The bakery"
    gloss: "the bakery"
    note: "*Boulangerie* is feminine; the shop specifically for bread, distinct from a *pâtisserie* (pastry shop)."
    example_gloss: "There's a good bakery nearby."
  fr.a1.unit04.lesson01.teach.legumes:
    title: "Vegetables"
    gloss: "vegetables"
    note: "*Légumes* is masculine plural."
    example_gloss: "I'm buying fresh vegetables for the workshop."
  fr.a1.unit04.lesson01.teach.fruits:
    title: "Fruit"
    gloss: "fruit"
    note: "*Fruits* is masculine plural, used the same way English uses the uncountable \"fruit.\""
    example_gloss: "Fruit is expensive this month."
  fr.a1.unit04.lesson01.teach.prix:
    title: "The price"
    gloss: "the price"
    note: "*Prix* is masculine and invariant -- the same spelling for singular and plural."
    example_gloss: "What's the price of the bread?"
  fr.a1.unit04.lesson01.teach.cher:
    title: "Expensive"
    gloss: "expensive"
    note: "*Cher* is the masculine form; *chère* is feminine, *chers*/*chères* plural, agreeing with the noun it describes."
    example_gloss: "This cheese is too expensive."
  fr.a1.unit04.lesson01.teach.pas_cher:
    title: "Not expensive today"
    gloss: "The vegetables aren't expensive today."
    note: "*Pas cher(s)* (dropping *ne*) is the common spoken way to say something is inexpensive; the full written form is *ne sont pas chers*."

  fr.a1.unit04.lesson02.teach.un_kilo_de:
    title: "A kilo of"
    gloss: "a kilo of"
    note: "*De* follows the quantity directly, with no article -- see the *de after quantity* grammar note below."
    example_gloss: "I would like a kilo of tomatoes."
  fr.a1.unit04.lesson02.teach.un_litre_de:
    title: "A liter of"
    gloss: "a liter of"
    note: "*Litre* is masculine, used for liquids the way *kilo* is used for solids."
    example_gloss: "A liter of milk, please."
  fr.a1.unit04.lesson02.teach.euro:
    title: "One euro"
    gloss: "one euro"
    note: "*Euro* pluralizes regularly: *deux euros*, *cinq euros*."
    example_gloss: "That costs five euros."
  fr.a1.unit04.lesson02.teach.de_after_quantity:
    title: "De after a quantity"
    gloss: "of"
    note: >-
      After an explicit quantity word (*un kilo*, *un litre*, *beaucoup*,
      already seen in unit03's *beaucoup de cousins*), French uses plain
      *de* and drops *du*/*de la*/*des* entirely -- *un kilo de tomates*,
      never *un kilo des tomates*.
  fr.a1.unit04.lesson02.teach.combien_ca_coute:
    title: "Ask the price"
    gloss: "How much does it cost?"
    note: "*Combien* (how much) plus *ça coûte* (it costs) is the general all-purpose way to ask a price."
  fr.a1.unit04.lesson02.teach.cest_combien_pain:
    title: "Ask the price of a specific item"
    gloss: "How much is the bread?"
    note: "*C'est combien, [item] ?* names the specific item being priced, a common alternative to *Combien ça coûte ?*."
  fr.a1.unit04.lesson02.teach.ca_fait_combien:
    title: "Ask for the total"
    gloss: "How much does that come to in total?"
    note: "*Ça fait combien ?* asks for a running total, typically at the end of a purchase rather than about one item."

  fr.a1.unit04.lesson03.teach.line01:
    title: "Order tomatoes"
    gloss: "Inès greets the vendor and asks for a kilo of tomatoes."
    note: "Combines unit01's *Bonjour* with this unit's *je voudrais* + quantity pattern."
  fr.a1.unit04.lesson03.teach.line02:
    title: "Ask if anything else is needed"
    gloss: "The vendor confirms and asks if she needs anything else."
    note: "*Autre chose ?* (anything else?) is the standard shopkeeper follow-up question."
  fr.a1.unit04.lesson03.teach.line03:
    title: "Add cheese and ask its price"
    gloss: "Inès adds a little cheese and asks its price."
    note: "*Un peu de fromage* (a little cheese) uses the same bare-*de* pattern as *un kilo de*."
  fr.a1.unit04.lesson03.teach.line04:
    title: "State a per-kilo price"
    gloss: "The vendor says it's eight euros per kilo."
    note: "*X euros le kilo* is the natural French way to state a per-unit price, with *le* meaning \"per\" here rather than \"the.\""
  fr.a1.unit04.lesson03.teach.line05:
    title: "Explain why he needs bread here"
    gloss: "Mathieu says he wants bread too, but the bakery is closed today."
    note: "*Fermée* (closed) is the feminine form, agreeing with *la boulangerie*."
  fr.a1.unit04.lesson03.teach.line06:
    title: "Offer an alternative"
    gloss: "Inès reassures him that bread can be bought here too."
    note: "*On peut* (one can/we can) + infinitive is a common informal way to state a possibility."
  fr.a1.unit04.lesson03.teach.line07:
    title: "Confirm and give the total"
    gloss: "The vendor confirms he has fresh bread, asks for the total, and states thirteen euros fifty."
    note: "*Ça fait combien en tout ?* here is the vendor thinking aloud before stating the total, not actually asking Inès."
  fr.a1.unit04.lesson03.teach.line08:
    title: "Thank the vendor"
    gloss: "Inès thanks him warmly as she pays."
    note: "*Voilà* here accompanies handing over payment, a common gesture-word."

exercises:
  fr.a1.unit04.lesson01.exercise01.select_marche:
    instruction: "Which word means the market?"
    correct_option: "le marché"
    distractors: ["la boulangerie", "le prix"]
    accepted_answers: ["le marché"]

  fr.a1.unit04.lesson01.exercise02.listen_boulangerie:
    instruction: "Listen and select the word you hear."
    correct_option: "la boulangerie"
    distractors: ["le marché", "les légumes"]
    accepted_answers: ["la boulangerie"]

  fr.a1.unit04.lesson01.exercise03.match_market_words:
    instruction: "Match each French word to its English meaning."
    correct_response:
      "le marché": "the market"
      "la boulangerie": "the bakery"
      "les légumes": "vegetables"
      "les fruits": "fruit"
      "le prix": "the price"
      cher: "expensive"

  fr.a1.unit04.lesson01.exercise04.order_fruits_chers:
    instruction: "Build the sentence: The fruit is expensive."
    correct_response: ["Les", "fruits", "sont", "chers"]

  fr.a1.unit04.lesson01.exercise05.fill_boulangerie:
    instruction: "Complete the sentence with the word for bakery."
    accepted_answers: ["boulangerie"]

  fr.a1.unit04.lesson01.exercise06.speak_legumes_price:
    instruction: "Say whether the vegetables are expensive or not today."
    accepted_answers:
      - "Les légumes sont chers."
      - "Les légumes ne sont pas chers."
      - "Les légumes sont pas chers."

  fr.a1.unit04.lesson02.exercise01.select_combien_ca_coute:
    instruction: "Which phrase asks how much something costs?"
    correct_option: "Combien ça coûte ?"
    distractors: ["Comment allez-vous ?", "Où habitez-vous ?"]
    accepted_answers: ["Combien ça coûte ?", "Combien ça coûte"]

  fr.a1.unit04.lesson02.exercise02.listen_je_voudrais_kilo:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Je voudrais un kilo de tomates."
    distractors: ["Je voudrais un litre de lait.", "C'est combien, le pain ?"]
    accepted_answers: ["Je voudrais un kilo de tomates.", "Je voudrais un kilo de tomates"]

  fr.a1.unit04.lesson02.exercise03.match_price_phrases:
    instruction: "Match each French phrase to its English meaning."
    correct_response:
      "un kilo de": "a kilo of"
      "un litre de": "a liter of"
      "un euro": "one euro"
      "Combien ça coûte ?": "How much does it cost?"
      "C'est combien, le pain ?": "How much is the bread?"
      "Ça fait combien en tout ?": "How much does that come to in total?"

  fr.a1.unit04.lesson02.exercise04.order_litre_lait:
    instruction: "Build the sentence: A liter of milk, please."
    correct_response: ["Un", "litre", "de", "lait", "s'il", "vous", "plaît"]

  fr.a1.unit04.lesson02.exercise05.fill_price_euros:
    instruction: "Complete the sentence with the currency word."
    accepted_answers: ["euros"]

  fr.a1.unit04.lesson02.exercise06.reply_kilos_wanted:
    instruction: "Answer that you would like one kilo, please."
    accepted_answers:
      - "Je voudrais un kilo, s'il vous plaît."
      - "Je voudrais un kilo s'il vous plaît."
      - "Je voudrais un kilo, s'il vous plaît, et merci."

  fr.a1.unit04.lesson03.exercise01.comprehend_ines_purchase:
    instruction: "Listen to the dialogue. What does Inès buy?"
    correct_option: "Tomatoes and cheese"
    distractors: ["Bread and milk", "Fruit and vegetables"]
    accepted_answers: ["Tomatoes and cheese"]

  fr.a1.unit04.lesson03.exercise02.comprehend_boulangerie_closed:
    instruction: "Why does Mathieu buy bread from the market instead of the bakery?"
    correct_option: "The bakery is closed today"
    distractors: ["The bakery is too expensive", "The bakery has no bread left"]
    accepted_answers: ["The bakery is closed today"]

  fr.a1.unit04.lesson03.exercise03.select_total_price:
    instruction: "What is the total price the vendor states?"
    correct_option: "Thirteen euros fifty"
    distractors: ["Eight euros", "Five euros"]
    accepted_answers: ["Thirteen euros fifty", "13.50", "13,50"]

  fr.a1.unit04.lesson03.exercise04.order_je_voudrais_tomates:
    instruction: "Build Inès's opening request."
    correct_response: ["Je", "voudrais", "un", "kilo", "de", "tomates", "s'il", "vous", "plaît"]

  fr.a1.unit04.lesson03.exercise05.reply_as_vendeur:
    instruction: "Take the vendor's role. Answer the question about the cheese's price."
    accepted_answers:
      - "C'est huit euros le kilo."
      - "C'est huit euros le kilo"

  fr.a1.unit04.lesson03.exercise06.speak_as_mathieu:
    instruction: "Take Mathieu's role and explain why you're buying bread here."
    accepted_answers:
      - "La boulangerie est fermée aujourd'hui."
      - "La boulangerie est fermée."

  fr.a1.unit04.lesson02.exercise07.dictation_je_voudrais_un_kilo:
    instruction: "Type what you hear."
    correct_option: "Je voudrais un kilo de tomates, s'il vous plaît"
    accepted_answers: [{value: "Je voudrais un kilo de tomates, s'il vous plaît", status: correct}]
    orthography_strict: true
