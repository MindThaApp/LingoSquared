answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A1
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation or liaison marks.

course:
  title: "French A1"
  description: >-
    Common neighborhood places and asking for/giving simple directions
    (en face de, à côté de, près de, loin de), continuing Mathieu's search
    for a pharmacy near the workshop. English-specific guidance highlights
    that these location prepositions are always followed by de (contracting
    to du/des before a masculine/plural noun), not a direct noun.

units:
  fr.a1.unit07.places:
    title: "Where is...?"

lessons:
  fr.a1.unit07.lesson01.lieux_du_quartier:
    title: "Places in the neighborhood"
  fr.a1.unit07.lesson02.demander_son_chemin:
    title: "Asking for directions"
  fr.a1.unit07.lesson03.dialogue_chercher_pharmacie:
    title: "Looking for the pharmacy"

teaching:
  fr.a1.unit07.lesson01.teach.gare:
    title: "The train station"
    gloss: "the train station"
    note: "*Gare* is feminine."
    example_gloss: "The train station is big."
  fr.a1.unit07.lesson01.teach.pharmacie:
    title: "The pharmacy"
    gloss: "the pharmacy"
    note: "*Pharmacie* is feminine."
    example_gloss: "The pharmacy opens at nine."
  fr.a1.unit07.lesson01.teach.banque:
    title: "The bank"
    gloss: "the bank"
    note: "*Banque* is feminine."
    example_gloss: "The bank is closed on Sundays."
  fr.a1.unit07.lesson01.teach.ecole:
    title: "The school"
    gloss: "the school"
    note: "*École* is feminine; *l'* elides before its vowel sound."
    example_gloss: "The school is next to the park."
  fr.a1.unit07.lesson01.teach.cafe:
    title: "The café"
    gloss: "the café"
    note: "*Café* is masculine; it also means \"coffee\" in other contexts."
    example_gloss: "The café is open all day."
  fr.a1.unit07.lesson01.teach.poste:
    title: "The post office"
    gloss: "the post office"
    note: "*Poste* (feminine) means \"post office\" here; *le poste* (masculine, different meaning) can mean \"the position/job\" -- gender changes the meaning."
    example_gloss: "The post office closes at six."
  fr.a1.unit07.lesson01.teach.la_gare_est_grande:
    title: "Compare two places"
    gloss: "The train station is big and the pharmacy is small."
    note: "*Grande*/*petite* both agree with feminine nouns here (*la gare*, *la pharmacie*)."

  fr.a1.unit07.lesson02.teach.ou_est_la_gare:
    title: "Ask where a place is"
    gloss: "Where is the train station, please?"
    note: "*Où est... ?* is the standard, all-purpose way to ask a place's location."
  fr.a1.unit07.lesson02.teach.en_face_de:
    title: "Say something is across from"
    gloss: "The bank is across from the train station."
    note: "*En face de* (across from) is followed directly by *de* + the reference place."
  fr.a1.unit07.lesson02.teach.a_cote_de:
    title: "Say something is next to"
    gloss: "The pharmacy is next to the bank."
    note: "*À côté de* (next to) follows the same *de*-linking pattern as *en face de*."
  fr.a1.unit07.lesson02.teach.pres_de:
    title: "Say something is near"
    gloss: "The school is near here."
    note: "*Près de* (near) contracts to *près d'* before a vowel sound, as in *près d'ici* (near here)."
  fr.a1.unit07.lesson02.teach.loin_de:
    title: "Say something is far"
    gloss: "The post office is far from here."
    note: "*Loin de* (far from) is the direct opposite of *près de*."
  fr.a1.unit07.lesson02.teach.cest_loin:
    title: "Ask if something is far"
    gloss: "Is it far from here? — No, it's not far."
    note: "*C'est loin d'ici ?* is the natural follow-up question after being told a direction. To say no, put *ne... pas* around the verb: *ce n'est pas loin* (it's not far)."

  fr.a1.unit07.lesson03.teach.line01:
    title: "Ask a stranger for directions"
    gloss: "Mathieu politely asks a passerby where the pharmacy is."
    note: "*Excusez-moi* (excuse me) is the standard polite opener when approaching a stranger, paired with *vous*."
  fr.a1.unit07.lesson03.teach.line02:
    title: "Give the location"
    gloss: "She says it's across from the bank, next to the café."
    note: "Combines *en face de* and *à côté de* in one sentence to give a precise location. *De* + *le café* contracts to *du café*."
  fr.a1.unit07.lesson03.teach.line03:
    title: "Ask if it's far"
    gloss: "Mathieu asks if it's far from here."
    note: "The same *C'est loin d'ici ?* you learned for asking about distance."
  fr.a1.unit07.lesson03.teach.line04:
    title: "Reassure it's close"
    gloss: "She says no, it's very close -- five minutes on foot."
    note: "*À pied* (on foot) is the standard way to specify walking as the means of travel."
  fr.a1.unit07.lesson03.teach.line05:
    title: "Thank her"
    gloss: "Mathieu thanks her warmly."
    note: "*Merci beaucoup* intensifies the basic *merci* already known from earlier units."
  fr.a1.unit07.lesson03.teach.line06:
    title: "Respond to thanks"
    gloss: "She replies, you're welcome."
    note: "*Je vous en prie* is a more formal \"you're welcome,\" matching the *vous* register used with a stranger; *De rien* is a less formal, everyday alternative."

exercises:
  fr.a1.unit07.lesson01.exercise01.select_pharmacie:
    instruction: "What does this mean?"
    correct_option: "the pharmacy"
    distractors: ["the bank", "the train station"]
    accepted_answers: ["the pharmacy"]

  fr.a1.unit07.lesson01.exercise02.listen_gare:
    instruction: "Listen and select the word you hear."
    correct_option: "la gare"
    distractors: ["la pharmacie", "la poste"]
    accepted_answers: ["la gare"]

  fr.a1.unit07.lesson01.exercise03.match_places:
    instruction: "Match each French word to its English meaning."
    correct_response:
      "la gare": "the train station"
      "la pharmacie": "the pharmacy"
      "la banque": "the bank"
      "l'école": "the school"
      "le café": "the café"
      "la poste": "the post office"

  fr.a1.unit07.lesson01.exercise04.order_gare_grande:
    instruction: "Build the sentence: The train station is big and the pharmacy is small."
    correct_response: ["La", "gare", "est", "grande", "et", "la", "pharmacie", "est", "petite"]

  fr.a1.unit07.lesson01.exercise05.fill_pharmacie_ouvre:
    instruction: "Complete the sentence with the word for pharmacy."
    accepted_answers: ["pharmacie"]

  fr.a1.unit07.lesson01.exercise06.speak_nearby_place:
    instruction: "Name a place near you: the train station, the bank, the school, or the post office."
    accepted_answers:
      - "La gare est près de chez moi."
      - "La banque est près de chez moi."
      - "L'école est près de chez moi."
      - "La poste est près de chez moi."
      - "La gare."
      - "La banque."
      - "L'école."
      - "La poste."
      - "La gare est près d'ici."
      - "La banque est près d'ici."
      - "L'école est près d'ici."
      - "La poste est près d'ici."

  fr.a1.unit07.lesson02.exercise01.select_ou_est_la_gare:
    instruction: "What does this question mean?"
    correct_option: "Where is the train station, please?"
    distractors: ["Is it far from here?", "What time is it?"]
    accepted_answers: ["Where is the train station, please?"]

  fr.a1.unit07.lesson02.exercise02.listen_ou_est_la_gare:
    instruction: "Listen and select the question you hear."
    correct_option: "Où est la gare, s'il vous plaît ?"
    distractors: ["C'est loin d'ici ?", "Où est la pharmacie ?"]
    accepted_answers: ["Où est la gare, s'il vous plaît ?", "Où est la gare, s'il vous plaît"]

  fr.a1.unit07.lesson02.exercise03.match_location_phrases:
    instruction: "Match each French phrase to its English meaning."
    correct_response:
      "en face de": "across from"
      "à côté de": "next to"
      "près de": "near"
      "loin de": "far from"
      "C'est loin d'ici ?": "Is it far from here?"
      "Où est la gare, s'il vous plaît ?": "Where is the train station, please?"

  fr.a1.unit07.lesson02.exercise04.order_pharmacie_a_cote:
    instruction: "Build the sentence: The pharmacy is next to the bank."
    correct_response: ["La", "pharmacie", "est", "à", "côté", "de", "la", "banque"]

  fr.a1.unit07.lesson02.exercise05.fill_pres_dici:
    instruction: "Complete the sentence with the word for near."
    accepted_answers: ["près"]

  fr.a1.unit07.lesson02.exercise06.reply_cest_loin:
    instruction: "Answer that it's not far."
    accepted_answers:
      - "Non, ce n'est pas loin."
      - "Non, ce n'est pas loin"
      - "Non, ce n'est pas loin d'ici."
      - "Non, c'est près d'ici."
      - "Non, c'est tout près."
      - "Ce n'est pas loin."
      - "Ce n'est pas loin d'ici."

  fr.a1.unit07.lesson03.exercise01.comprehend_pharmacie_location:
    instruction: "Listen to the dialogue. Where is the pharmacy?"
    correct_option: "Across from the bank, next to the café"
    distractors: ["Across from the train station", "Next to the school"]
    accepted_answers: ["Across from the bank, next to the café"]

  fr.a1.unit07.lesson03.exercise02.comprehend_distance:
    instruction: "How far away is the pharmacy?"
    correct_option: "Five minutes on foot"
    distractors: ["Fifteen minutes on foot", "Ten minutes by bus"]
    accepted_answers: ["Five minutes on foot"]

  fr.a1.unit07.lesson03.exercise03.select_who_mathieu_asks:
    instruction: "What does Mathieu's question mean?"
    correct_option: "Excuse me, where is the pharmacy, please?"
    distractors: ["Is it far from here?", "Thank you very much!"]
    accepted_answers: ["Excuse me, where is the pharmacy, please?"]

  fr.a1.unit07.lesson03.exercise04.order_elle_est_en_face:
    instruction: "Build the passerby's answer: It (the pharmacy) is across from the bank."
    correct_response: ["Elle", "est", "en", "face", "de", "la", "banque"]

  fr.a1.unit07.lesson03.exercise05.reply_as_passante:
    instruction: "Take the passerby's role. Say no, it's very close -- five minutes on foot."
    accepted_answers:
      - "Non, c'est tout près. Cinq minutes à pied."
      - "Non, c'est tout près, cinq minutes à pied."
      - "Non, ce n'est pas loin. Cinq minutes à pied."
      - "Non, ce n'est pas loin, cinq minutes à pied."

  fr.a1.unit07.lesson03.exercise06.speak_ask_directions:
    instruction: "Politely ask where the train station is."
    accepted_answers:
      - "Excusez-moi, où est la gare, s'il vous plaît ?"
      - "Excusez-moi, où est la gare, s'il vous plaît"
      - "Où est la gare, s'il vous plaît ?"
      - "Où est la gare, s'il vous plaît"

  fr.a1.unit07.lesson02.exercise07.dictation_ou_est_la_gare:
    instruction: "Type what you hear."
    correct_option: "Où est la gare, s'il vous plaît"
    accepted_answers: [{value: "Où est la gare, s'il vous plaît", status: correct}]
    orthography_strict: true
