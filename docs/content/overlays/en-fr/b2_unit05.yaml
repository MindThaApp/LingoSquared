    accepted_answers: [{value: "The one that opens 'Coucou Mathieu !' and signs off 'Bises'.", status: correct}]
    feedback: "Coucou Mathieu and Bises are informal -- markers of a message to a friend."
  fr.b2.unit05.lesson05.exercise02.read_institution:
    instruction: "Which message is written to la mairie?"
    correct_option: "The one that opens 'Madame, Monsieur,' and signs off 'Veuillez agréer...'."
    distractors: ["The one that opens 'Coucou Mathieu !' and signs off 'Bises'.", "Neither -- both are informal.", "Both are formal."]
    accepted_answers: [{value: "The one that opens 'Madame, Monsieur,' and signs off 'Veuillez agréer...'.", status: correct}]
    feedback: "Madame, Monsieur, and Veuillez agréer... are formal -- markers of a message to an institution."
  fr.b2.unit05.lesson05.exercise03.read_same_request:
