review:
  status: unreviewed
  required_next_reviewer: >-
    Native-French confirmation needed (DRAFT). Confirm the English glosses
    correctly describe the register each French form belongs to (informal
    tu/te/ton vs formal vous/votre; Salut/Coucou/Bises vs Bonjour/
    Cordialement vs Madame, Monsieur/Veuillez agréer...; direct imperative +
    s'il te plaît vs Pourriez-vous.../Serait-il possible de... + s'il vous
    plaît), that every matching_pairs right-hand gloss discriminates its
    left on real meaning, and that the culminating writing answers
    (lesson06 exercise06 and exercise07) accept the punctuation forms a
    correct learner would actually produce -- every comma/question-mark
    combination is supplied as its own accepted variant. See the
    realization file's review block for the full priority list, including
    the flagged (not asserted) uncertainty over whether "Cordialement"
    reads as neutral or already fairly formal in everyday correspondence.
  notes: >-
    Overlay for fr's fifth B2 unit (register -- adapting formality to the
    audience), authored alongside the realization (no adaptable
    upper-intermediate public-domain French source exists; see the
    realization provenance note). English speakers' real interference risks
    for this outcome: (1) English has ONE 'you', so the informal tu/te/ton
    vs formal vous/votre split -- and the verb shift it forces in questions
    (as -> avez, peux -> pouvez), plus the inverted question form itself --
    has no English anchor and is drilled explicitly in lesson01; (2) English
    requests can stay direct and still sound polite ('Can you...?'), whereas
    formal French marks respect by going indirect (Pourriez-vous...?,
    Serait-il possible de...?) -- lesson03 contrasts the direct informal
    imperative + s'il te plaît against the indirect formal frames so a
    learner does not carry English directness into a formal French letter;
    (3) letter openings/closings differ sharply by register (Salut/Coucou +
    Bises vs Bonjour + Cordialement vs Madame, Monsieur + Veuillez agréer,
    Madame, Monsieur, l'expression de mes salutations distinguées.) and are
    taught as fixed formulas in lesson02; (4) 's'il vous plaît' vs 's'il te
    plaît' encode the same tu/vous split inside 'please'. This unit
    DELIBERATELY teaches both registers -- each individual exercise stays in
    one consistent register, and every production prompt names the register
    AND the frame wanted so a correct answer in the OTHER register is not
    marked wrong. The culminating lesson06 exercise07 asks for the SAME
    request in BOTH registers; its accepted answers cover every internal/
    trailing punctuation combination. No sibling-direction file (fr-en b2)
    was consulted.

course:
  title: French B2
  description: >-
    Upper-intermediate French: defend a position, speculate about causes
    and consequences, express nuance, recount a complex sequence of events
    with shifting time reference, and adapt register to audience and
    purpose -- convey the same message appropriately to a friend, a
    colleague, and an institution.

units:
  fr.b2.unit05.registre:
    title: "Register"
    description: Adapt your formality to who you are addressing -- deliver the same request appropriately to a close friend and to an institution, switching pronouns, greetings, closings and directness.

lessons:
  fr.b2.unit05.lesson01.tu_ou_vous:
    title: "Tu or vous?"
  fr.b2.unit05.lesson02.formules_de_politesse:
    title: "Openings and closings"
  fr.b2.unit05.lesson03.direct_ou_poli:
    title: "Direct or polite?"
  fr.b2.unit05.lesson04.le_rendez_vous:
    title: "Rescheduling the appointment"
  fr.b2.unit05.lesson05.deux_messages:
    title: "Two messages, two readers"
  fr.b2.unit05.lesson06.choisir_le_registre:
    title: "Choosing the right register"

teaching:
  fr.b2.unit05.lesson01.teach.ines_ecrit:
    title: "Inès is writing a message."
    gloss: "Inès is writing a message."
    note: "The situation this whole unit works with: Inès has to send the same request to two very different readers. *Un message* = 'a message'."
  fr.b2.unit05.lesson01.teach.tu:
    title: "tu (informal)"
    gloss: "you / your (informal)"
    note: "The informal 'you': *tu* as the subject ('you'), *te* as the object ('you'), *ton/ta/tes* as the possessive ('your', matching the noun's gender/number). Use it with friends, family and peers -- like Inès with Mathieu."
    example_gloss: "Do you have time?"
  fr.b2.unit05.lesson01.teach.vous:
    title: "vous (formal)"
    gloss: "you / your (formal)"
    note: "The formal 'you': *vous* covers both subject and object ('you'), *votre/vos* is the possessive ('your'). Use it with strangers, officials and institutions -- like Inès writing to la mairie."
    example_gloss: "Do you have time?"
  fr.b2.unit05.lesson01.teach.tu_as_le_temps:
    title: "Do you have time? (informal)"
    gloss: "Do you have time?"
    note: "Informal and direct: no inversion needed -- *Tu as le temps ?* is a normal spoken question, rising intonation alone marks it as a question."
  fr.b2.unit05.lesson01.teach.avez_vous_le_temps:
    title: "Do you have time? (formal)"
    gloss: "Do you have time?"
    note: "Formal. With *vous* the verb inverts: *Avez-vous...?*, not a plain statement with rising intonation. This inversion is the heart of switching into the formal written register."
  fr.b2.unit05.lesson01.teach.tu_peux_maider:
    title: "Can you help me? (informal)"
    gloss: "Can you help me?"
    note: "Informal. *Tu peux m'aider ?* -- direct, no inversion, perfectly polite between friends. *M'aider* = *me* + *aider*, elided before a vowel."
  fr.b2.unit05.lesson01.teach.pouvez_vous_maider:
    title: "Can you help me? (formal)"
    gloss: "Can you help me?"
    note: "Formal. *Pouvez-vous...?* -- again the verb inverts with *vous*. Same question as *Tu peux m'aider ?*, shifted up in formality."
  fr.b2.unit05.lesson01.teach.grammar_tu_vous:
    title: "Do you have time? / Do you have time? Can you help me? / Can you help me?"
    gloss: "Do you have time? (informal / formal). Can you help me? (informal / formal)."
    note: "The core move of this unit: *tu -> vous* changes the verb form and the word order. *tu as -> avez-vous*, *tu peux -> pouvez-vous*. Choose *tu* for a friend and *vous* for an institution."

  fr.b2.unit05.lesson02.teach.salut:
    title: "Hi / Hey"
    gloss: "Hi / Hey"
    note: "*Salut* and *Coucou* are informal greetings -- for a friend, a text, a chat. Exactly how Inès opens a message to Mathieu."
    example_gloss: "Hi Mathieu!"
  fr.b2.unit05.lesson02.teach.bises:
    title: "Bises (sign-off) / see you soon"
    gloss: "Love / take care (Bises) -- see you soon (À bientôt)"
    note: "*Bises* is the informal way to sign off a message to a friend (literally 'kisses', used the way English uses 'love' or 'take care'). *À bientôt* ('see you soon') is another informal closing. Never use either in a formal letter."
    example_gloss: ["Bises, Inès", "See you soon!"]
  fr.b2.unit05.lesson02.teach.madame_monsieur:
    title: "Dear Sir or Madam,"
    gloss: "Dear Sir or Madam,"
    note: "*Madame, Monsieur,* is the standard formal salutation when you don't know the reader's name -- the opener for a letter or e-mail to an institution like la mairie. *Madame* = 'Madam', *Monsieur* = 'Sir'."
  fr.b2.unit05.lesson02.teach.veuillez_agreer:
    title: "Yours faithfully"
    gloss: "Please accept, Sir or Madam, the expression of my highest regards. (standard formal closing)"
    note: "*Veuillez agréer, Madame, Monsieur, l'expression de mes salutations distinguées.* is the classic, most formal French closing -- long and fixed, roughly 'yours faithfully'. Reserved for very official letters, exactly matching the *Madame, Monsieur,* opener."
  fr.b2.unit05.lesson02.teach.cordialement:
    title: "Kind regards (neutral-professional)"
    gloss: "Kind regards / best regards"
    note: "*Cordialement* is a common, everyday closing for professional or semi-formal correspondence -- warmer and shorter than *Veuillez agréer...*, more polished than *Bises*. Treat it as sitting between the two registers here, though how neutral it truly reads can vary by context -- flagged for native review."
    example_gloss: "Kind regards, Inès"
  fr.b2.unit05.lesson02.teach.bonjour:
    title: "Hello (neutral)"
    gloss: "Hello"
    note: "*Bonjour* is the everyday, register-neutral greeting -- works opening a message to someone you know a little, pairing naturally with *Cordialement* as a neutral middle ground between *Salut* and *Madame, Monsieur,*."
    example_gloss: "Hello Madam,"
  fr.b2.unit05.lesson02.teach.grammar_formules:
    title: "Salut / Coucou ... Bises / À bientôt (informal); Bonjour ... Cordialement (neutral); Madame, Monsieur, ... Veuillez agréer... (very formal)."
    gloss: "Salut / Coucou ... Bises / À bientôt (informal); Bonjour ... Cordialement (neutral); Madame, Monsieur, ... Veuillez agréer, Madame, Monsieur, the expression of my highest regards. (very formal)."
    note: "Openings and closings come in matched registers. Mixing them -- 'Madame, Monsieur, ... Bises' -- reads as a mistake."

  fr.b2.unit05.lesson03.teach.aide_moi:
    title: "Help me. (informal)"
    gloss: "Help me."
    note: "Informal and direct: *Aide-moi.* -- the imperative *aide* plus the stressed pronoun *moi*, hyphenated. Between friends a direct imperative is the normal, friendly choice."
  fr.b2.unit05.lesson03.teach.sil_te_plait:
    title: "please (informal)"
    gloss: "please (informal)"
    note: "*S'il te plaît* is the informal 'please' -- it literally contains *te*. Use it with friends."
    example_gloss: "Help me, please."
  fr.b2.unit05.lesson03.teach.sil_vous_plait:
    title: "please (formal)"
    gloss: "please (formal)"
    note: "*S'il vous plaît* is the formal 'please' -- it contains *vous*. Same idea, one register up: *s'il te plaît* (tu) vs *s'il vous plaît* (vous)."
    example_gloss: "Could you help me, please?"
  fr.b2.unit05.lesson03.teach.pourriez_vous:
    title: "Could you help me?"
    gloss: "Could you help me?"
    note: "Formal and more indirect than *Pouvez-vous...?*. *Pourriez* is the conditional of *pouvoir* -- softening a request is a hallmark of the formal register."
  fr.b2.unit05.lesson03.teach.possible:
    title: "possible"
    gloss: "possible"
    note: "*Possible* = 'possible'. The formula *Serait-il possible de...?* ('would it be possible to...?') is a very common polite, indirect way to make a formal request -- it names no one, which makes it feel respectful."
    example_gloss: "Would it be possible to come?"
  fr.b2.unit05.lesson03.teach.serait_il_possible:
    title: "Would it be possible to help me?"
    gloss: "Would it be possible to help me?"
    note: "The most indirect, most formal request frame in this unit: *Serait-il possible de m'aider ?* -- *Serait* is the conditional of *être*, and the whole construction names no one directly."
  fr.b2.unit05.lesson03.teach.grammar_directheid:
    title: "Help me, please. Could you help me, please? Would it be possible to help me?"
    gloss: "Help me, please. Could you help me, please? Would it be possible to help me? The more indirect the request, the more formal it feels."
    note: "Directness is a register signal. Informal: a direct imperative + *s'il te plaît*. Formal: *Pourriez-vous...?* or the most indirect *Serait-il possible de...?*, plus *s'il vous plaît*."

  fr.b2.unit05.lesson04.teach.rendez_vous:
    title: "the appointment"
    gloss: "the appointment"
    note: "*Le rendez-vous* = 'the appointment' -- a meeting time you've arranged with someone or something, here about the pâtisserie's licence at la mairie."
    example_gloss: "The appointment is at ten o'clock."
  fr.b2.unit05.lesson04.teach.deplacer:
    title: "to reschedule"
    gloss: "to reschedule / move"
    note: "*Déplacer* = 'to move' an appointment to another time, i.e. 'to reschedule'. *Déplacer le rendez-vous* = 'to reschedule the appointment' -- the everyday verb for this."
    example_gloss: "I want to reschedule the appointment."
  fr.b2.unit05.lesson04.teach.notre:
    title: "our"
    gloss: "our"
    note: "*Notre* = 'our' -- the appointment belongs to both parties, so it's *notre rendez-vous* in both registers."
    example_gloss: "It's our appointment."
  fr.b2.unit05.lesson04.teach.libre_disponible:
    title: "free / available"
    gloss: "free (informal) / available (formal)"
    note: "*Libre* and *disponible* both mean 'free/available' for a given time -- *libre* is the everyday informal choice, *disponible* reads a shade more formal and professional. Same meaning, different register, useful in both of Inès's messages."
    example_gloss: ["I'm not free on Tuesday.", "I'm not available on Tuesday."]
  fr.b2.unit05.lesson04.teach.semaine_prochaine:
    title: "next week"
    gloss: "next week"
    note: "*La semaine prochaine* = 'next week' -- the alternative Inès proposes in both messages."
    example_gloss: "I propose next week."
  fr.b2.unit05.lesson04.teach.tu_peux_deplacer:
    title: "Can you reschedule our appointment? (informal)"
    gloss: "Can you reschedule our appointment?"
    note: "The request in its informal form, to Mathieu: *Tu peux déplacer notre rendez-vous ?* Direct, no softening frame."
  fr.b2.unit05.lesson04.teach.serait_il_possible_deplacer:
    title: "Would it be possible to reschedule our appointment? (formal)"
    gloss: "Would it be possible to reschedule our appointment?"
    note: "The SAME request in formal form, to la mairie: *Serait-il possible de déplacer notre rendez-vous ?* Indirect and polite."
  fr.b2.unit05.lesson04.teach.grammar_rendez_vous:
    title: "Can you reschedule our appointment? / Would it be possible to reschedule our appointment?"
    gloss: "Can you reschedule our appointment? (informal) / Would it be possible to reschedule our appointment? (formal)"
    note: "One request, two registers. Same content, different wrapping for a different reader -- the whole point of this unit. Note the vocabulary itself can shift register too: *libre* (tu) vs *disponible* (vous)."

  fr.b2.unit05.lesson05.teach.convenir:
    title: "to suit / be convenient"
    gloss: "to suit / be convenient"
    note: "*Convenir* = '(for a time) to suit / be convenient'. *La semaine prochaine vous conviendrait-elle ?* = 'would next week suit you?' -- a polite, formal way to propose a new time, the counterpart to the informal *ça te va ?*"
    example_gloss: "Would next week suit you?"
  fr.b2.unit05.lesson05.teach.texte_informel:
    title: "Informal message (to Mathieu)"
    gloss: "Hi Mathieu! Can you reschedule our appointment? I'm not free on Tuesday. Does next week work for you? Bises, Inès"
    glosses:
      Coucou: "Hi (informal greeting)"
      Mathieu: Mathieu
      Tu: "you (informal)"
      peux: "can (you)"
      déplacer: "to reschedule / move"
      notre: our
      "rendez-vous": appointment
      Je: I
      ne: "(negation, part 1)"
      suis: "am (form of être)"
      pas: "not (negation, part 2)"
      libre: "free / available"
      mardi: Tuesday
      La: The
      semaine: week
      prochaine: next
      ça: it / that
      va: "works / goes (informal, from aller)"
      Bises: "Love / take care (informal sign-off)"
      Inès: Inès
  fr.b2.unit05.lesson05.teach.texte_formel:
    title: "Formal message (to la mairie)"
    gloss: "Dear Sir or Madam, Would it be possible to reschedule our appointment? I'm not available on Tuesday. Would next week suit you? Please accept, Sir or Madam, the expression of my highest regards. Inès"
    glosses:
      Madame: Madam
      Monsieur: Sir
      "Serait-il": "would it be (conditional of être)"
      possible: possible
      de: to
      déplacer: "to reschedule / move"
      notre: our
      "rendez-vous": appointment
      Je: I
      ne: "(negation, part 1)"
      suis: "am (form of être)"
      pas: "not (negation, part 2)"
      disponible: available
      mardi: Tuesday
      La: The
      semaine: week
      prochaine: next
      vous: you
      "conviendrait-elle": "would it suit (conditional of convenir, inverted with elle)"
      Veuillez: "please (formal imperative)"
      agréer: accept
      "l'expression": "the expression"
      mes: my
      salutations: regards
      distinguées: "highest / distinguished"
      Inès: Inès

  fr.b2.unit05.lesson06.teach.pas_de_probleme:
    title: "No problem."
    gloss: "No problem."
    note: "*Pas de problème* = 'no problem' -- a relaxed, informal reply."
  fr.b2.unit05.lesson06.teach.dois:
    title: "must / have to"
    gloss: "must / have to (I)"
    note: "*Dois* = 'must / have to' (the *je* form of *devoir*). *Je dois écrire...* = 'I have to write...'"
    example_gloss: "I have to write a message."
  fr.b2.unit05.lesson06.teach.la_mairie:
    title: "the town hall"
    gloss: "the town hall (municipal office)"
    note: "*La mairie* = 'the town hall' -- the local government office, a classic institution you'd write to formally, here about the pâtisserie's licence."
    example_gloss: "I have to write to the town hall."
  fr.b2.unit05.lesson06.teach.poliment:
    title: "politely"
    gloss: "politely"
    note: "*Poliment* = 'politely' -- writing *poliment* to an institution means using the formal register throughout."
    example_gloss: "Write politely to the town hall."
  fr.b2.unit05.lesson06.teach.autrement:
    title: "differently"
    gloss: "differently"
    note: "*Autrement* = 'differently'. *À la mairie, on écrit autrement* = 'to the town hall, you write differently' -- exactly the skill of this unit."
    example_gloss: "To the town hall, you write differently."
  fr.b2.unit05.lesson06.teach.bien_sur:
    title: "of course"
    gloss: "of course"
    note: "*Bien sûr* = 'of course' -- a natural way to confirm something is obviously true."
    example_gloss: "Of course!"
  fr.b2.unit05.lesson06.teach.dialogue_ines_setup:
    title: "Inès: Hey Mathieu, can you help me? I have to reschedule our appointment, I'm not free on Tuesday."
    gloss: "Inès: Hey Mathieu, can you help me? I have to reschedule our appointment, I'm not free on Tuesday."
  fr.b2.unit05.lesson06.teach.dialogue_mathieu_ok:
    title: "Mathieu: No problem. When, then?"
    gloss: "Mathieu: No problem. When, then?"
  fr.b2.unit05.lesson06.teach.dialogue_ines_mairie:
    title: "Inès: Next week? And I still have to write politely to the town hall."
    gloss: "Inès: Next week? And I still have to write politely to the town hall."
  fr.b2.unit05.lesson06.teach.dialogue_mathieu_autrement:
    title: "Mathieu: Ah yes, to the town hall you write differently, of course."
    gloss: "Mathieu: Ah yes, to the town hall you write differently, of course."
  fr.b2.unit05.lesson06.teach.grammar_recap:
    title: "Can you reschedule our appointment? / Would it be possible to reschedule our appointment?"
    gloss: "Can you reschedule our appointment? (informal) / Would it be possible to reschedule our appointment? (formal) -- one request, and the right choice depends on who reads it."
    note: "This is what you produce in this lesson: one request, delivered in the register that fits each reader. Informal to Mathieu: *Tu peux déplacer notre rendez-vous ?* Formal to la mairie: *Serait-il possible de déplacer notre rendez-vous ?*"

exercises:
  fr.b2.unit05.lesson01.exercise01.recognize_vous:
    instruction: "Who do you address as 'vous'?"
    correct_option: "someone you treat formally (a stranger or an institution)"
    distractors: ["a close friend", "a child in your family", "your best friend"]
    accepted_answers: [{value: "someone you treat formally (a stranger or an institution)", status: correct}]
    feedback: "Vous is the formal 'you' -- for strangers, officials and institutions. For a friend you use tu."
  fr.b2.unit05.lesson01.exercise02.listen_avez_vous:
    instruction: "Listen and select what you hear."
    correct_option: "Do you have time? (formal)"
    distractors: ["Do you have time? (informal)", "Can you help? (formal)", "Do you have a moment? (informal)"]
    accepted_answers: [{value: "Do you have time? (formal)", status: correct}]
    feedback: "Avez-vous le temps ? is the formal 'do you have time?' -- vous forces the verb to invert."
  fr.b2.unit05.lesson01.exercise03.match_pronouns:
    instruction: "Match each French word with its meaning and register."
    accepted_answers:
      - value: {tu: "you (informal, subject)", te: "you (informal, object)", "ton / ta / tes": "your (informal)", vous: "you (formal)", "votre / vos": "your (formal)", peux: "can (informal tu form)", pouvez: "can (formal vous form)", "le temps": "the time"}
        status: correct
    feedback: "tu/te/ton-ta-tes are the informal set; vous/votre-vos are the formal set -- and the verb follows (peux vs pouvez)."
  fr.b2.unit05.lesson01.exercise04.order_tu_as_temps:
    instruction: "Put the words in order, informal: Do you have time?"
    accepted_answers:
      - {value: "Tu as le temps", status: correct}
    feedback: "Tu as le temps ? -- informal, no inversion needed."
  fr.b2.unit05.lesson01.exercise05.translate_avez_vous:
    instruction: "Translate into French, formal, addressing la mairie as vous: Do you have time?"
    accepted_answers:
      - {value: "Avez-vous le temps", status: correct}
    feedback: "Avez-vous le temps ? -- with vous the verb inverts: avez-vous, not vous avez."
  fr.b2.unit05.lesson01.exercise06.translate_tu_peux:
    instruction: "Translate into French, informal, addressing Mathieu as tu: Can you help me?"
    accepted_answers:
      - {value: "Tu peux m'aider", status: correct}
    feedback: "Tu peux m'aider ? -- direct and informal, no inversion."
  fr.b2.unit05.lesson01.exercise07.speak_pouvez_vous:
    instruction: "Say aloud in French, formal, addressing la mairie as vous: Can you help me?"
    accepted_answers:
      - {value: "Pouvez-vous m'aider", status: correct}
    feedback: "Pouvez-vous m'aider ? -- with vous the verb is pouvez and it inverts."
  fr.b2.unit05.lesson01.exercise08.dictation_avez_vous:
    instruction: "Type what you hear."
    correct_response: "Avez-vous le temps ?"
    orthography_strict: true
    feedback: "You heard Avez-vous le temps ? -- the formal 'do you have time?', with vous forcing verb inversion."

  fr.b2.unit05.lesson02.exercise01.recognize_madame_monsieur:
    instruction: "When would you write 'Madame, Monsieur,'?"
    correct_option: "to open a formal letter to someone whose name you don't know"
    distractors: ["to text a friend", "to sign off a message to Mathieu", "to greet a child"]
    accepted_answers: [{value: "to open a formal letter to someone whose name you don't know", status: correct}]
    feedback: "Madame, Monsieur, is the formal salutation when the reader is unknown -- for an institution like la mairie, not a friend."
  fr.b2.unit05.lesson02.exercise02.listen_cordialement:
    instruction: "Listen and select what you hear."
    correct_option: "Kind regards (neutral-professional closing)"
    distractors: ["Love / take care (informal sign-off)", "Dear Sir or Madam (formal opening)", "Please accept... (most formal closing)"]
    accepted_answers: [{value: "Kind regards (neutral-professional closing)", status: correct}]
    feedback: "Cordialement is the everyday professional closing -- 'kind regards'."
  fr.b2.unit05.lesson02.exercise03.match_openers_closers:
    instruction: "Match each opening or closing with its meaning and register."
    accepted_answers:
      - value: {"Salut / Coucou": "informal 'hi'", Bises: "informal closing (love / take care)", "À bientôt": "informal closing (see you soon)", "Madame, Monsieur,": "formal salutation (recipient unknown)", "Veuillez agréer, Madame, Monsieur, l'expression de mes salutations distinguées.": "most formal closing (yours faithfully register)", Cordialement: "neutral-professional closing (kind regards)", Bonjour: "neutral 'hello' opener"}
        status: correct
    feedback: "Informal Salut/Coucou and Bises/À bientôt, neutral Bonjour and Cordialement, formal Madame, Monsieur, and Veuillez agréer..."
  fr.b2.unit05.lesson02.exercise04.order_a_bientot:
    instruction: "Put the words in order, informal: See you soon, Mathieu."
    accepted_answers:
      - {value: "À bientôt Mathieu", status: correct}
    feedback: "À bientôt Mathieu -- an informal way to close off to a friend."
  fr.b2.unit05.lesson02.exercise05.translate_madame_monsieur:
    instruction: "Write the formal French salutation for a letter to la mairie, whose recipient you don't know by name: Dear Sir or Madam,"
    accepted_answers:
      - {value: "Madame, Monsieur,", status: correct}
      - {value: "Madame, Monsieur", status: correct}
    feedback: "Madame, Monsieur, -- the formal opening when you don't know the reader's name."
  fr.b2.unit05.lesson02.exercise06.write_bises:
