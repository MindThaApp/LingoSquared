answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A2
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names and titles (Monsieur
    Girard).
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation or liaison marks.

course:
  title: "French A2"
  description: >-
    Reporting a household maintenance problem and arranging a repair,
    continuing Inès and Mathieu's storyline as Inès settles into her new
    Lyon apartment for her pâtisserie apprenticeship -- her oven breaks
    the evening before she wants to practice recipes at home, and she
    calls her landlord to report it. Uses the formal vous register with
    the landlord throughout, plus the
    conditional politeness pattern (pourriez-vous / est-ce qu'il serait
    possible de) and two genuine subjunctive triggers (il faudrait que,
    il faut que) that are exactly where French naturally reaches for the
    subjunctive when politely requesting a repair.

units:
  fr.a2.unit19.probleme_logement:
    title: "A problem in the apartment"

lessons:
  fr.a2.unit19.lesson01.vocabulaire_probleme:
    title: "Vocabulary: a problem in the apartment"
  fr.a2.unit19.lesson02.demande_polie:
    title: "Politely asking for a repair"
  fr.a2.unit19.lesson03.dialogue_appeler_proprietaire:
    title: "Calling the landlord to report the problem"

teaching:
  fr.a2.unit19.lesson01.teach.en_panne:
    title: "Broken / out of order"
    gloss: "broken / out of order (of an appliance)"
    note: "*En panne* describes a machine or appliance that has stopped working -- the standard phrase for a broken oven, heater, or washing machine."
    example_gloss: "The oven has been broken since last night."
  fr.a2.unit19.lesson01.teach.le_four:
    title: "The oven"
    gloss: "the oven"
    note: "*Le four* is specifically the oven, distinct from *la cuisinière* (the whole stove/cooktop unit)."
    example_gloss: "I can't use the oven for my pastries anymore."
  fr.a2.unit19.lesson01.teach.le_chauffage:
    title: "The heating"
    gloss: "the heating"
    note: "*Le chauffage* covers both the heating system and the act of heating -- a common thing to report broken in a rental."
    example_gloss: "The heating doesn't work at all anymore, and it's starting to get cold."
  fr.a2.unit19.lesson01.teach.eau_chaude:
    title: "Hot water"
    gloss: "hot water"
    note: "*L'eau chaude* -- note the elision of *la* before a vowel. A very common thing to lose in an older building."
    example_gloss: "The hot water hasn't been working since this morning in the bathroom."
  fr.a2.unit19.lesson01.teach.fuite:
    title: "A leak / to leak"
    gloss: "a leak / to leak"
    note: "*Une fuite* is the noun; *fuir* is the verb, which is irregular (*il fuit*, *ils fuient*, but *nous fuyons*)."
    example_gloss:
      - "There's a leak under the kitchen sink."
      - "The faucet has been leaking for two days."
  fr.a2.unit19.lesson01.teach.reparer:
    title: "To repair / a repair"
    gloss: "to repair / a repair"
    note: "*Réparer* (verb) and *une réparation* (noun) -- both essential for describing what needs to happen next."
    example_gloss:
      - "The oven needs to be repaired as quickly as possible."
      - "How long will the repair take?"
  fr.a2.unit19.lesson01.teach.depuis_duree:
    title: "Since / for (duration)"
    gloss: "since / for (a duration)"
    note: "*Depuis* + a time expression states how long a problem has lasted -- essential for describing exactly what a landlord needs to know."
    example_gloss: "The oven hasn't worked for three days."
  fr.a2.unit19.lesson01.teach.proprietaire_locataire:
    title: "Landlord, tenant"
    gloss: "the landlord, the tenant"
    note: "*Le propriétaire* is who you report a problem to; *le/la locataire* is what you are as a renter."
    example_gloss:
      - "The landlord has to send someone to fix that."
      - "As a tenant, I have to report problems quickly."

  fr.a2.unit19.lesson02.teach.grammar_conditionnel_politesse:
    title: "The polite conditional"
    gloss: "Est-ce qu'il serait possible de + infinitive? -- the polite conditional"
    note: "Using the conditional (*serait* instead of *est*) softens a request into a polite question -- the standard way to ask a landlord for something in French, much softer than a direct statement."
  fr.a2.unit19.lesson02.teach.pourriez_vous:
    title: "Could you...?"
    gloss: "could you...?"
    note: "*Pourriez-vous* is the conditional of *pouvoir* (can), inverted for a question -- a natural, polite way to make a request of someone you address as *vous*."
    example_gloss: "Could you come by this week to fix the oven?"
  fr.a2.unit19.lesson02.teach.il_faudrait_que:
    title: "It would be necessary that..."
    gloss: "it would be necessary that... (+ subjunctive)"
    note: "*Il faudrait que* triggers the subjunctive (*vienne*, not *vient*) -- a softer, more polite version of *il faut que*, common when asking for something rather than stating a fact."
    example_gloss:
      - "Someone would need to come repair the oven."
      - "Someone can come repair it."
  fr.a2.unit19.lesson02.teach.il_faut_que:
    title: "It is necessary that..."
    gloss: "it is necessary that... (+ subjunctive)"
    note: "*Il faut que* also triggers the subjunctive (*soit*, the subjunctive of *être*) -- more direct than *il faudrait que*, natural when stating a real deadline."
    example_gloss: "It needs to be repaired before this weekend."
  fr.a2.unit19.lesson02.teach.des_que_possible:
    title: "As soon as possible"
    gloss: "as soon as possible"
    note: "A common closing phrase when requesting a repair or callback -- pairs naturally with *je voudrais que* + subjunctive."
    example_gloss: "I'd like you to call me as soon as possible."
  fr.a2.unit19.lesson02.teach.signaler:
    title: "To report a problem"
    gloss: "to report a problem"
    note: "*Signaler* is the standard verb for formally reporting an issue -- more precise here than *dire* (to say) or *parler de* (to talk about)."
    example_gloss: "I'm writing to report a problem in my apartment."
  fr.a2.unit19.lesson02.teach.phrase_eau_chaude_request:
    title: "Report the hot water problem and ask when"
    gloss: "Since last night, there's been no hot water, and I'd like to know when you'll be able to come by."
    note: "Combines *depuis* (duration) with a polite closing question -- a full, natural way to open a repair request."
  fr.a2.unit19.lesson02.teach.phrase_chauffage_froid:
    title: "Describe the heating problem's effect"
    gloss: "The heating doesn't work at all anymore, and it's starting to get really cold in the apartment."
    note: "Describing the CONSEQUENCE of a problem (it's getting cold), not just the problem itself, is exactly the kind of multi-clause detail that makes a report clearer."

  fr.a2.unit19.lesson03.teach.line01:
    title: "Introduce yourself and state the problem"
    gloss: "Inès says hello Mr. Girard, it's Inès, your new tenant on the third floor -- the kitchen oven has been broken since last night."
    note: "Opening with your name and role (*votre nouvelle locataire*) before the problem is the polite convention for a first call to a landlord."
  fr.a2.unit19.lesson03.teach.line02:
    title: "Ask for the exact timing"
    gloss: "M. Girard says he's sorry to hear that, and politely asks exactly since when it stopped heating."
    note: "*Est-ce que vous pourriez me dire...* is the same polite-conditional pattern from lesson02, used here by the landlord himself."
  fr.a2.unit19.lesson03.teach.line03:
    title: "Give the exact time and make the request"
    gloss: "Inès says since last night around 8pm, and she really needs it for her pastry work -- someone would need to come repair it before the weekend."
    note: "Combines lesson01's *depuis* + time with lesson02's *il faudrait que* + subjunctive in one reply -- the full pattern in action."
  fr.a2.unit19.lesson03.teach.line04:
    title: "Confirm a repair time"
    gloss: "M. Girard agrees, says he'll call a technician today, and that he should come by tomorrow morning between 9am and noon."
    note: "*Il devrait passer* (he should come by) is the conditional of *devoir*, softening a plan into a likely-but-not-guaranteed promise."
  fr.a2.unit19.lesson03.teach.line05:
    title: "Confirm you'll be available"
    gloss: "Inès says perfect, thank you very much -- she'll be home all morning, so that should work."
    note: "*Ça devrait aller* (that should work / be fine) is a common, slightly informal way to confirm a plan is workable."
  fr.a2.unit19.lesson03.teach.line06:
    title: "Close the call politely"
    gloss: "M. Girard says very well, see you tomorrow then, and not to hesitate to call him back if needed."
    note: "*N'hésitez pas à* + infinitive (don't hesitate to) is a standard polite closing offer, still in the *vous* register throughout."
  fr.a2.unit19.lesson03.teach.confirmation_note:
    title: "Read a repair confirmation note"
    gloss: "Appointment confirmation: a technician will come tomorrow morning, between 9am and noon, to repair the oven for the tenant on the third floor. -- M. Girard, landlord"
    note: "A short written confirmation note, the kind a landlord might leave or text after a phone call -- the same details (time window, problem) as the spoken dialogue, in writing."
    glosses:
      Confirmation: "confirmation"
      rendez-vous: "appointment"
      technicien: "technician"
      passera: "will come (from passer)"
      demain: "tomorrow"
      matin: "morning"
      entre: "between"
      réparer: "to repair"
      four: "oven"
      locataire: "tenant"
      troisième: "third"
      étage: "floor / storey"
      propriétaire: "landlord / owner"

exercises:
  fr.a2.unit19.lesson01.exercise01.select_en_panne:
    instruction: "Which phrase means \"broken / out of order\"?"
    correct_option: "en panne"
    distractors: ["le four", "hier soir"]
    accepted_answers: ["en panne"]

  fr.a2.unit19.lesson01.exercise02.listen_eau_chaude:
    instruction: "Listen and select the phrase you hear."
    correct_option: "l'eau chaude"
    distractors: ["le chauffage", "une fuite"]
    accepted_answers: ["l'eau chaude"]

  fr.a2.unit19.lesson01.exercise03.match_probleme_vocab:
    instruction: "Match each French word or phrase to its English meaning."
    correct_response:
      "en panne": "broken / out of order"
      "le four": "the oven"
      "le chauffage": "the heating"
      "l'eau chaude": "hot water"
      "une fuite": "a leak"
      réparer: "to repair"
      "le propriétaire": "the landlord"
      "le/la locataire": "the tenant"

  fr.a2.unit19.lesson01.exercise04.order_chauffage_ne_marche_plus:
    instruction: "Build the sentence: The heating doesn't work at all anymore."
    correct_response: ["Le", "chauffage", "ne", "marche", "plus", "du", "tout"]

  fr.a2.unit19.lesson01.exercise05.fill_depuis_trois_jours:
    instruction: "Complete the sentence with the word for \"for\" (a duration)."
    accepted_answers: ["depuis"]

  fr.a2.unit19.lesson01.exercise06.translate_fuite_evier:
    instruction: "Write in French: There's a leak under the kitchen sink."
    accepted_answers:
      - {value: "Il y a une fuite sous l'évier de la cuisine.", status: correct}
      - {value: "Il y a une fuite sous l'évier de la cuisine", status: correct}
      - {value: "Il y a une fuite sous l'évier.", status: acceptable_with_note, note: "Missing \"de la cuisine\" (of the kitchen), but understood from context."}
    feedback: "A complete answer is Il y a une fuite sous l'évier de la cuisine."

  fr.a2.unit19.lesson02.exercise01.select_pourriez_vous:
    instruction: "Which phrase is a polite way to ask \"Could you...?\""
    correct_option: "pourriez-vous"
    distractors: ["cette semaine", "réparer le four"]
    accepted_answers: ["pourriez-vous"]

  fr.a2.unit19.lesson02.exercise02.listen_il_faudrait_que:
    instruction: "Listen and select the phrase you hear."
    correct_option: "il faudrait que"
    distractors: ["il faut que", "dès que possible"]
    accepted_answers: ["il faudrait que"]

  fr.a2.unit19.lesson02.exercise03.match_demande_polie:
    instruction: "Match each French phrase to its English meaning."
    correct_response:
      "pourriez-vous": "could you...?"
      "il faudrait que": "it would be necessary that..."
      "il faut que": "it is necessary that..."
      "dès que possible": "as soon as possible"
      "signaler un problème": "to report a problem"
      "Est-ce qu'il serait possible de... ?": "Would it be possible to... ?"
      "en panne": "broken / out of order"
      réparer: "to repair"

  fr.a2.unit19.lesson02.exercise04.order_il_faut_que_ce_soit_repare:
    instruction: "Build the sentence: It needs to be repaired before this weekend."
    correct_response: ["Il", "faut", "que", "ce", "soit", "réparé", "avant", "ce", "week-end"]

  fr.a2.unit19.lesson02.exercise05.fill_il_faut_que_soit:
    instruction: "Complete the sentence with the subjunctive form of être meaning \"be.\""
    accepted_answers: ["soit"]

  fr.a2.unit19.lesson02.exercise06.reply_ask_when_technician_can_come:
    instruction: "Reply politely: ask if it would be possible to have someone come."
    accepted_answers:
      - "Est-ce qu'il serait possible de faire venir quelqu'un ?"
      - "Est-ce qu'il serait possible de faire venir quelqu'un pour le réparer ?"
      - "Est-ce qu'il serait possible d'envoyer quelqu'un ?"
      - "Est-ce qu'il serait possible d'envoyer quelqu'un pour le réparer ?"
      - "Est-ce qu'il serait possible que quelqu'un vienne ?"
      - "Est-ce qu'il serait possible que quelqu'un vienne le réparer ?"
      - "Serait-il possible de faire venir quelqu'un ?"

  fr.a2.unit19.lesson03.exercise01.comprehend_depuis_quand:
    instruction: "Listen to the dialogue. Since when has the oven been broken?"
    correct_option: "Since last night"
    distractors: ["Since this morning", "Since last week"]
    accepted_answers: ["Since last night"]

  fr.a2.unit19.lesson03.exercise02.comprehend_technicien_horaire:
    instruction: "When will the technician come?"
    correct_option: "Tomorrow morning, between 9am and noon"
    distractors: ["This afternoon", "Tomorrow evening"]
    accepted_answers: ["Tomorrow morning, between 9am and noon"]

  fr.a2.unit19.lesson03.exercise03.select_pourquoi_urgent:
    instruction: "Why does Inès need the oven fixed quickly?"
    correct_option: "She needs it for her pastry work"
    distractors: ["She's having guests this weekend", "The landlord asked her to"]
    accepted_answers: ["She needs it for her pastry work"]

  fr.a2.unit19.lesson03.exercise04.read_confirmation_note:
    instruction: "Read the confirmation note. When will the technician come?"
    correct_option: "Between 9am and noon"
    distractors: ["Between 2pm and 5pm", "Tomorrow evening"]
    accepted_answers: ["Between 9am and noon"]

  fr.a2.unit19.lesson03.exercise05.order_il_faudrait_que_quelquun_vienne:
    instruction: "Build the sentence: Someone would need to come repair it before the weekend."
    correct_response: ["Il", "faudrait", "que", "quelqu'un", "vienne", "le", "réparer", "avant", "le", "week-end"]

  fr.a2.unit19.lesson03.exercise06.reply_explain_since_when:
    instruction: "Take Inès's role. Say it's been broken since last night around 8pm, and that you really need it for your pastry work."
    accepted_answers:
      - "Depuis hier soir vers vingt heures. J'en ai vraiment besoin pour mon travail de pâtissière."
      - "Depuis hier soir vers vingt heures, et j'en ai vraiment besoin pour mon travail de pâtissière."
      - "Depuis hier soir vers vingt heures et j'en ai vraiment besoin pour mon travail de pâtissière."
      - "Depuis hier soir vers 20 heures, et j'en ai vraiment besoin pour mon travail de pâtissière."
      - "Depuis hier soir vers 20h, et j'en ai vraiment besoin pour mon travail de pâtissière."
      - "Il est en panne depuis hier soir vers vingt heures, et j'en ai vraiment besoin pour mon travail de pâtissière."
      - "Le four est en panne depuis hier soir vers vingt heures, et j'en ai vraiment besoin pour mon travail de pâtissière."

  fr.a2.unit19.lesson03.exercise07.speak_report_the_problem:
    instruction: "Explain out loud that your heating is broken, and ask when someone can come fix it."
    accepted_answers:
      - "Le chauffage est en panne. Quand est-ce que quelqu'un peut venir le réparer ?"
      - "Le chauffage est en panne, et je voudrais savoir quand quelqu'un peut venir le réparer."
      - "Mon chauffage est en panne. Quand est-ce que quelqu'un peut venir le réparer ?"
      - "Mon chauffage est en panne, et je voudrais savoir quand quelqu'un peut venir le réparer."
      - "Le chauffage est en panne. Quand est-ce que quelqu'un pourrait venir le réparer ?"
  fr.a2.unit19.lesson03.exercise08.dictation_plus_eau_chaude: {correct_response: "L'eau chaude ne fonctionne plus.", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
  fr.a2.unit19.lesson03.exercise09.dictation_reparer_four: {correct_response: "Il faudrait que quelqu'un vienne réparer le four.", orthography_strict: true, feedback: "Type the sentence exactly as you hear it."}
