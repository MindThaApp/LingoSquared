answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A1
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation or liaison marks.

course:
  title: "French A1"
  description: >-
    Common food and drink vocabulary and a café-ordering exchange,
    continuing Inès and Mathieu's cooking-workshop narrative into a meal
    together after class. English-specific guidance highlights the du/de
    la/de l' partitive articles used with uncountable food nouns.

units:
  fr.a1.unit05.food:
    title: "A meal after the workshop"

lessons:
  fr.a1.unit05.lesson01.a_table:
    title: "At the table"
  fr.a1.unit05.lesson02.au_cafe:
    title: "At the café"
  fr.a1.unit05.lesson03.dialogue_cafe:
    title: "At the café after the workshop"

teaching:
  fr.a1.unit05.lesson01.teach.poulet:
    title: "Chicken"
    gloss: "chicken"
    note: "*Poulet* is masculine."
    example_gloss: "I would like some chicken."
  fr.a1.unit05.lesson01.teach.poisson:
    title: "Fish"
    gloss: "fish"
    note: "*Poisson* is masculine."
    example_gloss: "The fish is fresh today."
  fr.a1.unit05.lesson01.teach.salade:
    title: "Salad"
    gloss: "salad"
    note: "*Salade* is feminine."
    example_gloss: "She's eating a salad."
  fr.a1.unit05.lesson01.teach.riz:
    title: "Rice"
    gloss: "rice"
    note: "*Riz* is masculine and invariant (same spelling singular and plural, like *prix* in unit04)."
    example_gloss: "Rice goes well with chicken."
  fr.a1.unit05.lesson01.teach.eau:
    title: "Water"
    gloss: "water"
    note: "*Eau* is feminine; *l'* elides before its vowel sound, same pattern as *l'addition* later in this unit."
    example_gloss: "I would like some water, please."
  fr.a1.unit05.lesson01.teach.vin:
    title: "Wine"
    gloss: "wine"
    note: "*Vin* is masculine."
    example_gloss: "The red wine is delicious."
  fr.a1.unit05.lesson01.teach.je_voudrais_poulet_salade:
    title: "Order chicken and salad"
    gloss: "I would like chicken and salad."
    note: "*Du poulet* (masculine) and *de la salade* (feminine) show the partitive article agreeing with the noun's gender, the same system as unit04's quantity phrases."

  fr.a1.unit05.lesson02.teach.dessert:
    title: "Dessert"
    gloss: "dessert"
    note: "*Dessert* is masculine."
    example_gloss: "Dessert is complimentary today."
  fr.a1.unit05.lesson02.teach.addition:
    title: "The bill"
    gloss: "the bill; the check"
    note: "*Addition* is feminine; *l'* elides before its vowel sound. This is the standard French restaurant term, not *facture* (a formal invoice)."
    example_gloss: "The bill, please."
  fr.a1.unit05.lesson02.teach.vous_avez_choisi:
    title: "Ask if ready to order"
    gloss: "Have you decided?"
    note: "The standard waiter question when approaching a table to take an order, using the passé composé of *choisir* (to choose)."
  fr.a1.unit05.lesson02.teach.je_voudrais_un_cafe:
    title: "Order a coffee"
    gloss: "I would like a coffee, please."
    note: "*Je voudrais* + item, the same ordering pattern from unit04's shopping phrases, now used for food and drink."
  fr.a1.unit05.lesson02.teach.qcq_comme_dessert:
    title: "Ask what's available"
    gloss: "What do you have for dessert?"
    note: "*Qu'est-ce que vous avez comme...?* is a natural, common way to ask what options exist within a category."
  fr.a1.unit05.lesson02.teach.cest_delicieux:
    title: "Say something is delicious"
    gloss: "It's delicious!"
    note: "A common, enthusiastic reaction to food; *délicieux* is invariant here since *c'est* takes no gendered noun."

  fr.a1.unit05.lesson03.teach.line01:
    title: "Greet and ask if ready to order"
    gloss: "The waiter greets them and asks if they're ready to order."
    note: "Opens with unit01's *Bonjour*, continuing the register established for service encounters."
  fr.a1.unit05.lesson03.teach.line02:
    title: "Order salad and water"
    gloss: "Inès orders a salad and water."
    note: "Combines *je voudrais* with *et* to link two ordered items in one turn."
  fr.a1.unit05.lesson03.teach.line03:
    title: "Order chicken with rice"
    gloss: "Mathieu orders chicken with rice."
    note: "*Avec* (with) links the main item to its side, a simple and common ordering construction."
  fr.a1.unit05.lesson03.teach.line04:
    title: "Confirm and ask about drinks"
    gloss: "The waiter confirms and asks about drinks."
    note: "*Et comme boisson pour vous ?* reuses the *comme* pattern from lesson02's dessert question, now for drinks."
  fr.a1.unit05.lesson03.teach.line05:
    title: "Order a glass of wine"
    gloss: "Mathieu orders a glass of red wine."
    note: "*Un verre de* (a glass of) is the standard way to order wine by the glass."
  fr.a1.unit05.lesson03.teach.line06:
    title: "React to the food"
    gloss: "Inès says the chicken is delicious."
    note: "Reuses lesson02's *C'est délicieux !*, now applied to a specific dish (*ce poulet*)."
  fr.a1.unit05.lesson03.teach.line07:
    title: "Explain their hunger and ask for the bill"
    gloss: "Mathieu says the workshop made them hungry and asks for the bill."
    note: "*Nous a donné faim* (literally \"gave us hunger\") is the natural French way to say something made you hungry."
  fr.a1.unit05.lesson03.teach.line08:
    title: "Confirm the bill is coming"
    gloss: "The waiter confirms he'll bring it right away."
    note: "*Tout de suite* (right away) is a common, reassuring service-encounter phrase."

exercises:
  fr.a1.unit05.lesson01.exercise01.select_poisson:
    instruction: "Which word means fish?"
    correct_option: "le poisson"
    distractors: ["le poulet", "le vin"]
    accepted_answers: ["le poisson"]

  fr.a1.unit05.lesson01.exercise02.listen_salade:
    instruction: "Listen and select the word you hear."
    correct_option: "la salade"
    distractors: ["le riz", "l'eau"]
    accepted_answers: ["la salade"]

  fr.a1.unit05.lesson01.exercise03.match_food_words:
    instruction: "Match each French word to its English meaning."
    correct_response:
      "le poulet": "chicken"
      "le poisson": "fish"
      "la salade": "salad"
      "le riz": "rice"
      "l'eau": "water"
      "le vin": "wine"

  fr.a1.unit05.lesson01.exercise04.order_poulet_salade:
    instruction: "Build the sentence: I would like chicken and salad."
    correct_response: ["Je", "voudrais", "du", "poulet", "et", "de", "la", "salade"]

  fr.a1.unit05.lesson01.exercise05.fill_poisson_frais:
    instruction: "Complete the sentence with the word for fish."
    accepted_answers: ["poisson"]

  fr.a1.unit05.lesson01.exercise06.speak_food_choice:
    instruction: "Say what you would like to eat: chicken, fish, or salad."
    accepted_answers:
      - "Je voudrais du poulet."
      - "Je voudrais du poisson."
      - "Je voudrais de la salade."

  fr.a1.unit05.lesson02.exercise01.select_addition:
    instruction: "Which phrase asks for the bill?"
    correct_option: "L'addition, s'il vous plaît."
    distractors: ["C'est délicieux !", "Vous avez choisi ?"]
    accepted_answers: ["L'addition, s'il vous plaît.", "L'addition, s'il vous plaît"]

  fr.a1.unit05.lesson02.exercise02.listen_vous_avez_choisi:
    instruction: "Listen and select the question you hear."
    correct_option: "Vous avez choisi ?"
    distractors: ["Qu'est-ce que vous avez comme dessert ?", "C'est délicieux ?"]
    accepted_answers: ["Vous avez choisi ?", "Vous avez choisi"]

  fr.a1.unit05.lesson02.exercise03.match_cafe_phrases:
    instruction: "Match each French word or phrase to its English meaning."
    correct_response:
      "le dessert": "dessert"
      "l'addition": "the bill"
      "Vous avez choisi ?": "Have you decided?"
      "Je voudrais un café, s'il vous plaît.": "I would like a coffee, please."
      "Qu'est-ce que vous avez comme dessert ?": "What do you have for dessert?"
      "C'est délicieux !": "It's delicious!"

  fr.a1.unit05.lesson02.exercise04.order_qcq_dessert:
    instruction: "Build the question: What do you have for dessert?"
    correct_response: ["Qu'est-ce", "que", "vous", "avez", "comme", "dessert"]

  fr.a1.unit05.lesson02.exercise05.fill_addition:
    instruction: "Complete the phrase with the word for the bill."
    accepted_answers: ["addition"]

  fr.a1.unit05.lesson02.exercise06.reply_vous_avez_choisi:
    instruction: "Answer that you would like a coffee, please."
    accepted_answers:
      - "Oui, je voudrais un café, s'il vous plaît."
      - "Oui, je voudrais un café s'il vous plaît."

  fr.a1.unit05.lesson03.exercise01.comprehend_ines_order:
    instruction: "Listen to the dialogue. What does Inès order?"
    correct_option: "Salad and water"
    distractors: ["Chicken and rice", "Fish and wine"]
    accepted_answers: ["Salad and water"]

  fr.a1.unit05.lesson03.exercise02.comprehend_mathieu_order:
    instruction: "What does Mathieu order?"
    correct_option: "Chicken with rice, and a glass of red wine"
    distractors: ["Fish with salad, and water", "Chicken with salad, and coffee"]
    accepted_answers: ["Chicken with rice, and a glass of red wine"]

  fr.a1.unit05.lesson03.exercise03.select_why_hungry:
    instruction: "Why does Mathieu say they're hungry?"
    correct_option: "The workshop made them hungry"
    distractors: ["They skipped breakfast", "The food smells good"]
    accepted_answers: ["The workshop made them hungry"]

  fr.a1.unit05.lesson03.exercise04.order_verre_vin_rouge:
    instruction: "Build Mathieu's drink order."
    correct_response: ["Un", "verre", "de", "vin", "rouge", "s'il", "vous", "plaît"]

  fr.a1.unit05.lesson03.exercise05.reply_as_serveur:
    instruction: "Take the waiter's role. Ask what they'd like to drink."
    accepted_answers:
      - "Et comme boisson pour vous ?"
      - "Et comme boisson pour vous"

  fr.a1.unit05.lesson03.exercise06.speak_as_ines:
    instruction: "Take Inès's role and say the chicken is delicious."
    accepted_answers:
      - "C'est délicieux, ce poulet !"
      - "C'est délicieux, ce poulet."

  fr.a1.unit05.lesson02.exercise07.dictation_vous_avez_choisi:
    instruction: "Type what you hear."
    correct_option: "Vous avez choisi"
    accepted_answers: [{value: "Vous avez choisi", status: correct}]
    orthography_strict: true
