  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or liaison marks.
course:
  title: French A2
  description: Intermediate French continuing the Camille and Mathieu storyline, now with a grammar-led block on talking about the past.
  learning_goal: Talk about life experiences with the passé composé, déjà, ne ... jamais and pas encore.
units:
  fr.a2.unit84.deja_jamais:
    title: Already or never?
    description: Ask and say what you have or have never done, and whether you have already done something yet.
lessons:
  fr.a2.unit84.lesson01.j_ai_deja:
    title: I have already visited Paris
  fr.a2.unit84.lesson02.je_n_ai_jamais:
    title: I have never taken a plane
  fr.a2.unit84.lesson03.deja_ou_pas_encore:
    title: Already, never or not yet?
  fr.a2.unit84.lesson04.poser_la_question:
    title: Asking the question
  fr.a2.unit84.lesson05.les_experiences_de_camille:
    title: Camille's experiences
  fr.a2.unit84.lesson06.mathieu_et_camille:
    title: Mathieu and Camille talk about trips
teaching:
  fr.a2.unit84.lesson01.teach.frequence:
    title: Already and how often
    gloss: already / once / several times
    note: '*Déjà* often means ''ever'' in a question and ''already'' in a statement.'
    example_gloss:
    - I have already eaten sushi.
    - I visited Paris once.
    - We have seen this film several times.
  fr.a2.unit84.lesson01.teach.verbes:
    title: Verbs for experiences
    gloss: to taste / to visit / to see / to eat
    note: '*Un plat* is a dish; *ce* means ''this''.'
    example_gloss:
    - I tasted this dish.
    - She visited Paris.
    - Did you see this film?
    - He ate sushi.
  fr.a2.unit84.lesson01.teach.gn_deja:
    title: Déjà with the passé composé
    gloss: I have already visited Paris. He has already tasted this dish.
    note: '*Déjà* goes between the auxiliary and the participle. The passé composé tells what you have done in your life, without saying when.'
  fr.a2.unit84.lesson01.teach.gn_participes:
    title: Useful participles
    gloss: visit → visited. taste → tasted. see → seen. eat → eaten. be → been.
    note: '*Voir* has an irregular participle: *vu*. *Être* has *été*: *j''ai été* means ''I have been''. *J''ai été à Paris* is very common.'
  fr.a2.unit84.lesson01.teach.phrase:
    title: Paris once
    gloss: I have already visited Paris once.
  fr.a2.unit84.lesson02.teach.jamais:
    title: Never
    gloss: never / a country / the sea / the plane
    example_gloss:
    - I have never eaten sushi.
    - She has never seen the sea.
    - I have never taken a plane.
    - Which country did you visit?
  fr.a2.unit84.lesson02.teach.gn_jamais:
    title: Ne ... jamais
    gloss: I have never eaten sushi. She has never seen the sea.
    note: '*Ne ... jamais* wraps around the auxiliary, like *ne ... pas*: *je n''ai jamais mangé*. After it, *des/du* becomes *de*.'
  fr.a2.unit84.lesson02.teach.gn_jamais_etre:
    title: Ne ... jamais with être
    gloss: I have never been to Italy.
    note: 'With a verb that takes *être*, *ne ... jamais* wraps around *suis*: *je ne suis jamais allé*.'
  fr.a2.unit84.lesson02.teach.phrase:
    title: Never on a plane
    gloss: I have never taken a plane.
  fr.a2.unit84.lesson03.teach.encore:
    title: Not yet
    gloss: not yet / finished
    note: '*Pas encore* means ''not yet'': the thing has not happened but may still happen.'
    example_gloss:
    - I have not eaten yet.
    - He has not finished yet.
  fr.a2.unit84.lesson03.teach.gn_reponses:
    title: Déjà or pas encore
    gloss: Have you already eaten? Yes, I have already eaten. No, I have not eaten yet.
    note: '*Déjà* in a statement, *pas encore* for ''not yet''. Both go with the passé composé.'
  fr.a2.unit84.lesson03.teach.gn_jamais_encore:
    title: Jamais or pas encore
    gloss: I have never visited Paris. I have not visited Paris yet.
    note: '*Jamais* means ''never in my life''. *Pas encore* means that it has not happened yet and may happen.'
  fr.a2.unit84.lesson03.teach.gn_courtes:
    title: Short answers
    gloss: Yes, once. No, never. Not yet.
    note: You can answer in one or two words. *Non, jamais* is the usual short way of saying you have never done it.
  fr.a2.unit84.lesson03.teach.phrase:
    title: Not finished yet
    gloss: I have not finished yet.
  fr.a2.unit84.lesson04.teach.plats:
    title: Food and trying
    gloss: cheese / a dish / to try
    example_gloss:
    - I have already tasted this cheese.
    - This dish is delicious.
    - Have you tried it already?
  fr.a2.unit84.lesson04.teach.gn_question:
    title: Three ways to ask
    gloss: Have you ever eaten sushi? Have you ever eaten sushi? Have you ever eaten sushi?
    note: Raise your voice (everyday speech), add *est-ce que*, or invert the subject and the auxiliary (*as-tu*). *Déjà* stays after the auxiliary or after the inverted subject.
  fr.a2.unit84.lesson04.teach.gn_vous:
    title: Questions with vous
    gloss: Have you (formal) already visited Paris? Have you already visited Paris?
    note: With *vous*, the question is polite; inversion (*avez-vous*) sounds more formal.
  fr.a2.unit84.lesson04.teach.gn_repondre:
    title: Answering
    gloss: Yes, I have already visited Paris. No, I have never visited Paris.
    note: The answer repeats the verb. *Non, jamais* is the short negative answer.
  fr.a2.unit84.lesson04.teach.phrase:
    title: Have you tasted it?
    gloss: Have you ever tasted this cheese?
  fr.a2.unit84.lesson05.teach.mots:
    title: Words for the message
    gloss: here are / this year / twice / and you?
    example_gloss:
    - Here are my experiences!
    - This year I travelled.
    - I went to the market twice.
    - I like chocolate. And you?
  fr.a2.unit84.lesson05.teach.gn_fois:
    title: Counting times
    gloss: once, twice, three times, several times
    note: 'Use a number before *fois* to say how many times: *une fois, deux fois, trois fois*.'
  fr.a2.unit84.lesson05.teach.gn_liste:
    title: Three experiences
    gloss: I have already visited Paris. I have never taken a plane. I have not seen the sea yet.
    note: '*Déjà*, *jamais* and *pas encore* all place the event inside the speaker''s experience.'
  fr.a2.unit84.lesson05.teach.reading:
    title: Camille tells Mathieu about her experiences
    gloss: Hi Mathieu, here are my experiences! I have already visited Paris twice. I have already eaten sushi, but I have never taken a plane. I have never been to Italy, and I have not yet seen the sea this year. And you? Camille
    note: '*Déjà*, *jamais* and *pas encore* each add something different to the verb.'
    glosses:
      voici: here is, here are
      cette: this
      année: year
  fr.a2.unit84.lesson06.teach.q1:
    title: Mathieu asks
    gloss: 'Mathieu: Camille, have you ever visited Paris?'
  fr.a2.unit84.lesson06.teach.a1:
    title: Camille answers
    gloss: 'Camille: Yes, twice. And you?'
  fr.a2.unit84.lesson06.teach.q2:
    title: Mathieu answers
    gloss: 'Mathieu: I have never visited Paris.'
  fr.a2.unit84.lesson06.teach.a2:
    title: Camille asks about planes
    gloss: 'Camille: Have you ever taken a plane?'
  fr.a2.unit84.lesson06.teach.q3:
    title: Mathieu answers
    gloss: 'Mathieu: Yes, once. And you?'
  fr.a2.unit84.lesson06.teach.a3:
    title: Camille answers
    gloss: 'Camille: No, never. I have not travelled far yet.'
