    instruction: "Correct the agreement error in this phrase."
    accepted_answers: ["Une demi-tasse de sucre."]
    feedback: "*Demi-* stays invariant as a prefix and never agrees in gender itself, but the article still must agree with the noun: *tasse* is feminine, so it takes *une* (*une demi-tasse*), not *un*."

