answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A1
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation or liaison marks.

course:
  title: "French A1"
  description: >-
    Numbers 0-100 (including the soixante-dix/quatre-vingts/quatre-vingt-dix
    forms), ages, phone numbers, and recipe quantities, continuing unit01's
    Inès and Mathieu at the cooking workshop. English-specific guidance
    highlights avoir-based age expressions, the vigesimal remnants in French
    numbers, and gender agreement in quantity phrases.

units:
  fr.a1.unit02.numbers:
    title: "Numbers in the kitchen"

lessons:
  fr.a1.unit02.lesson01.numbers_zero_to_ten:
    title: "Numbers zero to ten"
  fr.a1.unit02.lesson02.numbers_eleven_to_hundred:
    title: "Special forms: eleven to a hundred"
  fr.a1.unit02.lesson03.asking_age:
    title: "Asking someone's age"
  fr.a1.unit02.lesson04.phone_numbers:
    title: "Phone numbers"
  fr.a1.unit02.lesson05.recipe_quantities:
    title: "Recipe quantities"
  fr.a1.unit02.lesson06.recipe_count_dialogue:
    title: "Counting ingredients with Inès and Mathieu"

teaching:
  fr.a1.unit02.lesson01.teach.zero:
    title: "Zero"
    gloss: "zero"
    note: "*Zéro* is used both as the number itself and as a digit when reading a string of digits aloud."
  fr.a1.unit02.lesson01.teach.un:
    title: "One"
    gloss: "one"
    note: >-
      *Un* is masculine; the feminine form *une* appears before a feminine
      noun (*une tasse*, one cup). Alone, as when counting, it stays *un*.
  fr.a1.unit02.lesson01.teach.deux:
    title: "Two"
    gloss: "two"
    note: "*Deux* never changes form regardless of the noun's gender."
  fr.a1.unit02.lesson01.teach.trois:
    title: "Three"
    gloss: "three"
    note: "*Trois* is invariant."
  fr.a1.unit02.lesson01.teach.quatre:
    title: "Four"
    gloss: "four"
    note: "*Quatre* is invariant."
  fr.a1.unit02.lesson01.teach.cinq:
    title: "Five"
    gloss: "five"
    note: "*Cinq* is invariant. The final q is normally pronounced, unlike the silent final consonants of several other French numbers."
  fr.a1.unit02.lesson01.teach.six:
    title: "Six"
    gloss: "six"
    note: >-
      *Six* is pronounced with a final /s/ sound when said alone, but that
      final consonant is dropped before a noun starting with a consonant
      (*six livres* sounds like "si livres").
  fr.a1.unit02.lesson01.teach.sept:
    title: "Seven"
    gloss: "seven"
    note: "*Sept* is invariant; the p is silent, only the final t is pronounced."
  fr.a1.unit02.lesson01.teach.huit:
    title: "Eight"
    gloss: "eight"
    note: "*Huit* is invariant. The h is silent, as in nearly all French words."
  fr.a1.unit02.lesson01.teach.neuf:
    title: "Nine"
    gloss: "nine"
    note: "*Neuf* is invariant."
  fr.a1.unit02.lesson01.teach.dix:
    title: "Ten"
    gloss: "ten"
    note: >-
      *Dix* is pronounced with a final /s/ sound when said alone, following
      the same dropped-consonant-before-a-consonant pattern as *six*.

  fr.a1.unit02.lesson02.teach.onze:
    title: "Eleven"
    gloss: "eleven"
    note: "*Onze* through *seize* (11-16) are each their own word, not built from *dix* the way twenty-one onward reuses *vingt*."
  fr.a1.unit02.lesson02.teach.douze:
    title: "Twelve"
    gloss: "twelve"
    note: "*Douze* is its own word, unrelated in form to *deux*."
  fr.a1.unit02.lesson02.teach.treize:
    title: "Thirteen"
    gloss: "thirteen"
    note: "*Treize* is its own word, unrelated in form to *trois*."
  fr.a1.unit02.lesson02.teach.quatorze:
    title: "Fourteen"
    gloss: "fourteen"
    note: "*Quatorze* is its own word, unrelated in form to *quatre*."
  fr.a1.unit02.lesson02.teach.quinze:
    title: "Fifteen"
    gloss: "fifteen"
    note: "*Quinze* is its own word, unrelated in form to *cinq*."
  fr.a1.unit02.lesson02.teach.seize:
    title: "Sixteen"
    gloss: "sixteen"
    note: "*Seize* is the last of the fused teen-style words; from *dix-sept* (17) onward, *dix* compounds visibly with the unit again."
  fr.a1.unit02.lesson02.teach.vingt:
    title: "Twenty"
    gloss: "twenty"
    note: "*Vingt* is its own word. From twenty-one onward, tens and units combine (*vingt et un*, *vingt-deux*) in a pattern this course revisits below."
  fr.a1.unit02.lesson02.teach.trente:
    title: "Thirty"
    gloss: "thirty"
    note: "*Trente* combines with a following unit through a hyphen (*trente-quatre*), except one, which takes *et* instead (*trente et un*)."
  fr.a1.unit02.lesson02.teach.trente_quatre:
    title: "Thirty-four"
    gloss: "thirty-four"
    note: "*Trente-quatre* is written as one hyphenated compound, unlike Spanish or English's separate-word patterns."
  fr.a1.unit02.lesson02.teach.soixante:
    title: "Sixty"
    gloss: "sixty"
    note: "*Soixante* behaves like a normal ten (*soixante-quatre*, 64) up through sixty-nine -- the irregular part starts at seventy, taught next."
  fr.a1.unit02.lesson02.teach.soixante_dix:
    title: "Seventy"
    gloss: "seventy"
    note: >-
      This is the single biggest surprise in French numbers: there is no
      dedicated word for seventy. *Soixante-dix* literally means
      "sixty-ten" (60 + 10). Numbers keep counting this way up to
      *soixante-dix-neuf* (79, "sixty-nineteen") before *quatre-vingts*
      starts a new base at eighty.
  fr.a1.unit02.lesson02.teach.quatre_vingts:
    title: "Eighty"
    gloss: "eighty"
    note: >-
      *Quatre-vingts* literally means "four twenties" (4 x 20), a leftover
      of an old base-20 counting system. It takes a final s only when
      standing alone or ending the number (*quatre-vingts*, 80); the s
      drops when a unit follows (*quatre-vingt-un*, 81).
  fr.a1.unit02.lesson02.teach.quatre_vingt_dix:
    title: "Ninety"
    gloss: "ninety"
    note: >-
      *Quatre-vingt-dix* literally means "four twenties plus ten" (4x20 +
      10), continuing the same base-20 counting pattern as seventy through
      *quatre-vingt-dix-neuf* (99).
  fr.a1.unit02.lesson02.teach.cent:
    title: "One hundred"
    gloss: "one hundred"
    note: "*Cent* is the form used for exactly 100 on its own, with no article (not \"*un cent*\")."

  fr.a1.unit02.lesson03.teach.quel_age_as_tu:
    title: "Ask age informally"
    gloss: "How old are you?"
    note: >-
      French literally asks what age you have, using *avoir* (to have), not
      a form of *être* ("to be") the way English uses "to be."
  fr.a1.unit02.lesson03.teach.jai_vingt_huit_ans:
    title: "Give your age"
    gloss: "I'm twenty-eight."
    note: "*Ai* is the je form of *avoir*. *Ans* (years) is required in French even though English drops \"years\" in casual speech."
  fr.a1.unit02.lesson03.teach.quel_age_avez_vous:
    title: "Ask age formally"
    gloss: "How old are you?"
    note: "*Avez-vous* uses the *vous* form of *avoir*, matching the formal register established in unit01."
  fr.a1.unit02.lesson03.teach.jai_trente_et_un_ans:
    title: "Give a compound age"
    gloss: "I'm thirty-one."
    note: >-
      *Trente et un* uses *et* (and), not a hyphen, specifically for the
      -one forms of thirty, forty, fifty, and sixty (*trente et un*,
      *quarante et un*, *cinquante et un*, *soixante et un*). Seventy-one
      breaks this pattern: it is *soixante et onze* (sixty + eleven), not
      *soixante et un*, since the 70s keep counting through *dix* forms up
      to *soixante-dix-neuf* (79).
  fr.a1.unit02.lesson03.teach.et_toi_quel_age:
    title: "Return the age question"
    gloss: "And you, how old are you?"
    note: "*Et toi* opens the return question; *toi* (not *tu*) is the stressed pronoun used after *et* for emphasis."

  fr.a1.unit02.lesson04.teach.quel_est_ton_numero:
    title: "Ask for a phone number"
    gloss: "What's your phone number?"
    note: "*Quel* agrees with the masculine noun *numéro*; a feminine noun would need *quelle* instead."
  fr.a1.unit02.lesson04.teach.numero_ines:
    title: "A number read digit by digit"
    gloss: "Zero, six, one, five, zero, two, nine, seven"
    note: >-
      French phone numbers are conventionally read in pairs of two digits
      (*zéro-six*, *quinze*, *zéro-deux*...), but this A1 unit keeps to
      digit-by-digit reading, the same simplified convention as unit01's
      register choices -- accept single-digit answers as correct.
  fr.a1.unit02.lesson04.teach.cest_le:
    title: "Introduce the number"
    gloss: "It's..."
    note: "*Le* (masculine \"the\") is used because *numéro* is a masculine noun."
  fr.a1.unit02.lesson04.teach.tu_peux_repeter:
    title: "Ask for repetition"
    gloss: "Can you repeat that, please?"
    note: "*Peux* is the *tu* form of *pouvoir* (can/to be able to), useful whenever a spoken number goes by too fast to catch."
  fr.a1.unit02.lesson04.teach.bien_sur:
    title: "Confirm readily"
    gloss: "Of course; sure"
    note: "*Bien sûr* is a common, friendly way to agree to a request."

  fr.a1.unit02.lesson05.teach.jai_besoin_trois_oeufs:
    title: "State a needed quantity"
    gloss: "I need three eggs."
    note: "*J'ai besoin de* (literally \"I have need of\") is how French expresses needing something, using *avoir* rather than a single dedicated verb."
  fr.a1.unit02.lesson05.teach.combien_oeufs:
    title: "Ask how many are needed"
    gloss: "How many eggs do you need?"
    note: "*De combien d'œufs* places *de combien* (of how many) before the item, unlike English's \"how many eggs\" word order."
  fr.a1.unit02.lesson05.teach.deux_tasses_farine:
    title: "State a measured quantity"
    gloss: "Two cups of flour"
    note: "*De* links the measuring unit (*tasses*, cups) to what is being measured (*farine*, flour), the same pattern English uses with \"of.\""
  fr.a1.unit02.lesson05.teach.demi_tasse:
    title: "State a half quantity"
    gloss: "Half a cup of sugar"
    note: >-
      *Demi-* stays invariant as a prefix before the noun (*une
      demi-tasse*), unlike the adjective *demi* placed after a noun, which
      does agree (*une heure et demie*).
  fr.a1.unit02.lesson05.teach.jai_quatre_oeufs:
    title: "State what's on hand"
    gloss: "I have four eggs on the table."
    note: "*J'ai* (I have) reports what's already available, distinct from *j'ai besoin de* (I need), which reports what's still missing."

  fr.a1.unit02.lesson06.teach.line01:
    title: "Ask how many eggs"
    gloss: "Inès asks Mathieu how many eggs he needs for the recipe."
    note: "Continues unit01's *tu* register between the two peers."
  fr.a1.unit02.lesson06.teach.line02:
    title: "State the ingredients"
    gloss: "Mathieu says he needs three eggs and two cups of flour."
    note: "*J'ai besoin de* names what is still needed for the recipe."
  fr.a1.unit02.lesson06.teach.line03:
    title: "Offer what's on hand"
    gloss: "Inès says she has four eggs on the table and asks if he also needs sugar."
    note: "*J'ai* reports what Inès already has available, separate from what Mathieu said he needs."
  fr.a1.unit02.lesson06.teach.line04:
    title: "Confirm a small amount"
    gloss: "Mathieu says yes, a little -- about half a cup."
    note: "*Environ* here means \"about\" or \"roughly,\" softening the exact quantity."
  fr.a1.unit02.lesson06.teach.line05:
    title: "Ask for a phone number"
    gloss: "Inès says perfect, then asks for Mathieu's phone number so she can text him about the next class."
    note: "*Comme ça je t'écris* (\"so I can text/write to you\") explains why she's asking, a natural conversational habit before requesting contact information."
  fr.a1.unit02.lesson06.teach.line06:
    title: "Give the phone number"
    gloss: "Mathieu reads his number digit by digit."
    note: "*C'est le* introduces the number, matching the masculine noun *numéro*."
  fr.a1.unit02.lesson06.teach.line07:
    title: "Thank him and ask his age"
    gloss: "Inès thanks him, then asks one more question: how old he is."
    note: "*Une dernière question* (\"one last question\") signals a natural topic shift within the same conversation."
  fr.a1.unit02.lesson06.teach.line08:
    title: "State his age"
    gloss: "Mathieu says he's twenty-eight and asks Inès the same question."
    note: "*J'ai vingt-huit ans* uses the hyphenated compound form, matching lesson02's own pattern."
  fr.a1.unit02.lesson06.teach.line09:
    title: "State her age"
    gloss: "Inès says she's thirty-one."
    note: "*J'ai trente et un ans* uses *et* (and) rather than a hyphen, since thirty-one is one of the -one forms taught in lesson03."

