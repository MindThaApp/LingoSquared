answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A2 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or liaison marks.
course:
  title: French A2
  description: Intermediate French continuing the Camille and Mathieu storyline, now with a grammar-led block on everyday functions.
  learning_goal: Predict what will happen and make a simple promise, with aller plus infinitive and the futur simple.
units:
  fr.a2.unit86.demain_il_va_pleuvoir:
    title: Tomorrow it is going to rain
    description: Predict what will happen with the near future and the simple future, say what will probably happen, and make a promise.
lessons:
  fr.a2.unit86.lesson01.il_va_pleuvoir:
    title: It is going to rain
  fr.a2.unit86.lesson02.demain_je_serai_la:
    title: On Saturday it will be nice
  fr.a2.unit86.lesson03.peut_etre:
    title: Maybe, probably
  fr.a2.unit86.lesson04.je_te_promets:
    title: I promise you
  fr.a2.unit86.lesson05.message_de_camille:
    title: Camille's message
  fr.a2.unit86.lesson06.mathieu_et_camille:
    title: Mathieu and Camille plan Sunday
teaching:
  fr.a2.unit86.lesson01.teach.meteo:
    title: Weather talk
    gloss: tomorrow / soon / the weather forecast / to rain / the sky / to look at
    example_gloss:
    - Tomorrow, it is going to rain.
    - Look at the sky!
    - The forecast is good.
    - Soon we are going to stay at home.
  fr.a2.unit86.lesson01.teach.verbes:
    title: Verbs for plans
    gloss: to eat / to leave / to stay / to see / to arrive
    example_gloss:
    - I am going to eat.
    - You are going to leave.
    - They are going to arrive tomorrow.
    - We are going to see the sky.
  fr.a2.unit86.lesson01.teach.gn_aller:
    title: Near future with aller
    gloss: I am going to eat, you are going to leave, it is going to rain, we are going to stay, you are going to see, they are going to arrive
    note: The near future is *aller* in the present plus an infinitive. Use it for what is about to happen or what you can already see coming.
  fr.a2.unit86.lesson01.teach.gn_ciel:
    title: Predicting from what you see
    gloss: 'Look at the sky: it is going to rain!'
    note: '*Aller* plus infinitive is the natural way to predict something when there is a clue in front of you.'
  fr.a2.unit86.lesson01.teach.gn_neg:
    title: Negation
    gloss: It is not going to rain. No, we are not going to leave.
    note: '*Ne ... pas* wraps around *aller*, and the infinitive stays after *pas*: *il ne va pas pleuvoir*.'
  fr.a2.unit86.lesson01.teach.phrase:
    title: A prediction
    gloss: Tomorrow, it is going to rain.
  fr.a2.unit86.lesson02.teach.jours:
    title: Days and places
    gloss: Saturday / Sunday / the park / nice (weather) / the house, home
    example_gloss:
    - On Saturday, it will rain.
    - On Sunday, it will be nice.
    - We will be at the park.
    - I will be at home.
  fr.a2.unit86.lesson02.teach.gn_futur:
    title: Futur simple of regular verbs
    gloss: I will eat, you will leave, he will arrive, we will stay, you will look, they will talk
    note: 'The futur simple adds endings to the infinitive (*mangerai, mangeras, mangera, mangerons, mangerez, mangeront*). It is used for predictions and promises that are not about to happen right now.'
  fr.a2.unit86.lesson02.teach.gn_irreg:
    title: Four irregular stems
    gloss: I will be, you will be, I will have, I will do, I will go, we will go. They will be at the park. We will be there.
    note: '*Être*, *avoir*, *faire* and *aller* have their own stems (*ser-, aur-, fer-, ir-*) but take the same endings.'
  fr.a2.unit86.lesson02.teach.gn_meteo:
    title: Weather in the future
    gloss: It will be nice. It will rain. There will be sun.
    note: '*Il fera* comes from *faire* and *il pleuvra* from *pleuvoir*. Use the futur simple for a general forecast about a day or a week.'
  fr.a2.unit86.lesson02.teach.gn_choix:
    title: Near or simple future?
    gloss: It is going to rain! It will rain on Saturday.
    note: Both can predict. *Il va pleuvoir* feels close and visible; *il pleuvra samedi* sounds like a forecast for a named day.
  fr.a2.unit86.lesson02.teach.phrase:
    title: A forecast
    gloss: On Sunday, it will be nice.
  fr.a2.unit86.lesson03.teach.adverbes:
    title: How sure are you?
    gloss: maybe / probably / surely / I think that / I believe that
    example_gloss:
    - It will probably rain.
    - It will surely be nice.
    - It may be nice.
    - I think it will rain on Saturday.
  fr.a2.unit86.lesson03.teach.gn_adverbe:
    title: Where the adverb goes
    gloss: It will probably rain. It will surely be nice. It will not rain.
    note: With the futur simple, *probablement* and *sûrement* come right after the verb. *Ne ... pas* wraps around the verb.
  fr.a2.unit86.lesson03.teach.gn_peutetre:
    title: Peut-être
    gloss: It may be nice. Maybe it will be nice.
    note: '*Peut-être* can follow the verb, or it can start the sentence followed by *que*: *peut-être qu''il fera beau*.'
  fr.a2.unit86.lesson03.teach.gn_penser:
    title: I think that
    gloss: I think it will be nice. I believe we will go to the park.
    note: After *je pense que* or *je crois que* the next verb is in the futur simple when you talk about what will happen. *Que* becomes *qu'* before *il*.
  fr.a2.unit86.lesson03.teach.phrase:
    title: Likely rain
    gloss: It will probably rain on Saturday.
  fr.a2.unit86.lesson04.teach.promesses:
    title: Promise words
    gloss: to promise / to bring / to call / to come / the bread / don't worry
    example_gloss:
    - I promise you that I will come.
    - I will bring the bread.
    - I will call you tomorrow.
    - Don't worry, I promise!
  fr.a2.unit86.lesson04.teach.gn_promettre:
    title: Je te promets que
    gloss: I promise you that I will come. I promise you that I will be there.
    note: A promise is *je te promets que* plus the futur simple. *Te* means 'you' (informal, to someone you call *tu*).
  fr.a2.unit86.lesson04.teach.gn_venir:
    title: More futur simple stems
    gloss: I will come, I will bring, I will call you, you will come, he will come, we will come
    note: '*Venir* has the irregular stem *viendr-*. *Apporter* and *appeler* take the regular endings. *Te* goes right before the verb: *je t''appellerai*.'
  fr.a2.unit86.lesson04.teach.gn_pasretard:
    title: Promising not to
    gloss: I will not be late. I will not come without the bread.
    note: To promise not to do something, wrap *ne ... pas* around the futur simple verb.
  fr.a2.unit86.lesson04.teach.gn_promis:
    title: Short promises
    gloss: I promise! Don't worry.
    note: '*C''est promis* is a short, friendly way to seal a promise. *Ne t''inquiète pas* reassures a friend.'
  fr.a2.unit86.lesson04.teach.phrase:
    title: A promise
    gloss: I promise you that I will come.
  fr.a2.unit86.lesson05.teach.mots:
    title: Words for the message
    gloss: to announce, to forecast / the rain / the sun / the sandwich / the coffee / you (stressed)
    example_gloss:
    - The forecast announces rain.
    - I will bring the sandwiches.
    - And you, you will bring the coffee.
  fr.a2.unit86.lesson05.teach.gn_ordre:
    title: From forecast to plan
    gloss: The forecast announces rain on Saturday. On Sunday, it will be nice, so we will go to the park.
    note: 'A plan often follows a prediction: *alors* links the forecast to the decision.'
  fr.a2.unit86.lesson05.teach.gn_toi:
    title: Sharing tasks
    gloss: Me, I will bring the sandwiches. You, you will bring the coffee.
    note: '*Moi* and *toi* put the focus on each person when you share tasks.'
  fr.a2.unit86.lesson05.teach.reading:
    title: Camille writes to Mathieu
    gloss: Hi Mathieu! The forecast announces rain on Saturday, but it may be nice on Sunday. I think we will go to the park on Sunday. I will bring the sandwiches and you will bring the coffee. I promise I will not be late! Camille
    note: The text mixes a forecast, a plan and a promise, all in the futur simple.
    glosses:
      annonce: announces
      pluie: rain
  fr.a2.unit86.lesson06.teach.q1:
    title: Mathieu asks
    gloss: 'Mathieu: Camille, is it going to rain on Saturday?'
  fr.a2.unit86.lesson06.teach.a1:
    title: Camille answers
    gloss: 'Camille: Yes, the forecast announces rain. But on Sunday, it will be nice.'
  fr.a2.unit86.lesson06.teach.q2:
    title: Mathieu proposes
    gloss: 'Mathieu: So we will go to the park on Sunday?'
  fr.a2.unit86.lesson06.teach.a2:
    title: Camille agrees
    gloss: 'Camille: Yes! I will bring the sandwiches.'
  fr.a2.unit86.lesson06.teach.q3:
    title: Mathieu promises
    gloss: 'Mathieu: Me, I will bring the coffee. I promise you I will not be late!'
  fr.a2.unit86.lesson06.teach.a3:
    title: Camille closes
    gloss: 'Camille: Okay, it''s a promise!'
