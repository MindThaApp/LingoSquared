exercises:
  fr.a2.unit23.lesson01.exercise01.select_du_lundi:
    instruction: "What does *du lundi au vendredi* mean?"
    correct_option: "from Monday to Friday"
    distractors: ["on Monday and Friday only", "after Friday"]
    accepted_answers: ["from Monday to Friday"]
  fr.a2.unit23.lesson01.exercise02.match_week_vocab:
    instruction: "Match each French weekly-schedule word or phrase to English."
    correct_response:
      "une semaine chargée": "a busy week"
      "du lundi au vendredi": "from Monday to Friday"
      "le week-end": "the weekend"
      "l'apprentissage": "the apprenticeship"
      "réviser": "to review / study"
      "un planning": "a schedule"
  fr.a2.unit23.lesson01.exercise03.order_du_lundi:
    instruction: "Build the sentence: From Monday to Friday, I start early at the pastry shop."
    correct_response: ["Du", "lundi", "au", "vendredi", "je", "commence", "tôt", "à", "la", "pâtisserie"]
  fr.a2.unit23.lesson01.exercise04.fill_weekend:
    instruction: "Complete the sentence with the French word for weekend."
    accepted_answers: ["week-end", "weekend"]
  fr.a2.unit23.lesson01.exercise05.read_planner:
    instruction: "According to the planner, what does Inès do on Thursday?"
    correct_option: "She does the shopping after work"
    distractors: ["She has class in the evening", "She calls her family"]
    accepted_answers: ["She does the shopping after work"]

  fr.a2.unit23.lesson02.exercise01.select_dabord:
    instruction: "Which connector means first?"
    correct_option: "d'abord"
    distractors: ["depuis", "toujours"]
    accepted_answers: ["d'abord"]
  fr.a2.unit23.lesson02.exercise02.comprehend_sequence:
    instruction: "Listen to the dialogue. What does Inès do on Saturday morning?"
    correct_option: "She goes to the market"
    distractors: ["She goes swimming", "She buys a ticket to Paris"]
    accepted_answers: ["She goes to the market"]
  fr.a2.unit23.lesson02.exercise03.match_connectors:
    instruction: "Match each French connector or day phrase to English."
    correct_response:
      "d'abord": "first"
      "ensuite": "then / next"
      "puis": "then / next"
      "si j'ai le temps": "if I have time"
      "le samedi matin": "on Saturday morning"
      "le dimanche": "on Sundays"
  fr.a2.unit23.lesson02.exercise04.order_sequence:
    instruction: "Build the sentence: First I go home, then I review my recipes."
    correct_response: ["D'abord", "je", "rentre", "chez", "moi", "ensuite", "je", "révise", "mes", "recettes"]
  fr.a2.unit23.lesson02.exercise05.speak_week_schedule:
    instruction: "Say this sentence shape: *Du lundi au vendredi, je travaille. D'abord je rentre chez moi, ensuite je révise. Le week-end, je me repose.*"
    accepted_answers:
      - "Du lundi au vendredi, je travaille. D'abord je rentre chez moi, ensuite je révise. Le week-end, je me repose."
      - "Du lundi au vendredi, je commence tôt. Ensuite je fais les courses, puis le week-end je me repose."
      - "En semaine, je travaille le matin, ensuite je révise, et le week-end j'appelle ma famille."
  fr.a2.unit23.lesson02.exercise06.write_week_schedule:
    instruction: "Write this sentence shape: *Du lundi au vendredi, je travaille le matin, ensuite je révise mes recettes, puis le week-end je me repose.*"
    accepted_answers:
      - "Du lundi au vendredi, je travaille le matin, ensuite je révise mes recettes, puis le week-end je me repose."
      - "En semaine, je travaille, ensuite je fais les courses, puis le dimanche j'appelle ma famille."
      - "Le lundi je travaille, le mardi j'ai cours, ensuite le week-end je vais au marché."
