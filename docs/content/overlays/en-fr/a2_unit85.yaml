answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A2 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or liaison marks.
course:
  title: French A2
  description: Intermediate French continuing the Camille and Mathieu storyline, now with a grammar-led block on talking about the past.
  learning_goal: Explain what had already happened before another past moment, with the plus-que-parfait.
units:
  fr.a2.unit85.le_train_etait_parti:
    title: The train had already left
    description: Explain that something had already happened before a certain point in the past, using the plus-que-parfait.
lessons:
  fr.a2.unit85.lesson01.j_avais_achete:
    title: I had bought my ticket
  fr.a2.unit85.lesson02.le_train_etait_parti:
    title: The train had left
  fr.a2.unit85.lesson03.deux_moments:
    title: Before and after
  fr.a2.unit85.lesson04.parce_que:
    title: Because I had forgotten
  fr.a2.unit85.lesson05.quelle_journee:
    title: What a day!
  fr.a2.unit85.lesson06.mathieu_et_camille:
    title: Mathieu and Camille talk about the train
teaching:
  fr.a2.unit85.lesson01.teach.gare:
    title: At the station
    gloss: the station / the train / the ticket / noon
    example_gloss:
    - I am at the station.
    - The train leaves before noon.
    - I have my ticket.
  fr.a2.unit85.lesson01.teach.verbes:
    title: Four verbs
    gloss: to forget / to lose / to buy / to finish
    example_gloss:
    - I forget my ticket.
    - He loses his bag.
    - We buy the ticket.
    - She finishes her work.
  fr.a2.unit85.lesson01.teach.gn_pqp_avoir:
    title: Plus-que-parfait with avoir
    gloss: I had eaten, you had finished, he had bought, we had forgotten, you had lost, they had finished
    note: The plus-que-parfait is the imparfait of *avoir* plus a past participle. It says an action was already finished before another moment in the past.
  fr.a2.unit85.lesson01.teach.gn_avant:
    title: Before another past moment
    gloss: When I arrived, he had already bought the tickets.
    note: 'Two past moments: *quand je suis arrivé* (passé composé) and the earlier action *il avait acheté* (plus-que-parfait). *Déjà* goes between the auxiliary and the participle.'
  fr.a2.unit85.lesson01.teach.phrase:
    title: Ticket bought
    gloss: I had bought my ticket.
  fr.a2.unit85.lesson02.teach.tard:
    title: Too late
    gloss: too late / already noon
    example_gloss:
    - I arrived too late.
    - It is already noon.
  fr.a2.unit85.lesson02.teach.gn_pqp_etre:
    title: Plus-que-parfait with être
    gloss: I had left, you had arrived, he had gone out, she had left, we had gone home, they had left
    note: Verbs that take *être* in the passé composé take the imparfait of *être* here. The participle agrees with the subject.
  fr.a2.unit85.lesson02.teach.gn_deja:
    title: Déjà and agreement
    gloss: The train had already left. She had already arrived.
    note: '*Déjà* stands between *était* and the participle. The participle agrees: *elle était arrivée*.'
  fr.a2.unit85.lesson02.teach.gn_moments:
    title: Two moments
    gloss: When I arrived at the station, the train had already left.
    note: The later moment is in the passé composé (*je suis arrivé*), the earlier one in the plus-que-parfait (*le train était parti*).
  fr.a2.unit85.lesson02.teach.phrase:
    title: Too late
    gloss: The train had already left.
  fr.a2.unit85.lesson03.teach.gn_difference:
    title: Passé composé or plus-que-parfait
    gloss: The train left. The train had left.
    note: The passé composé reports the event. The plus-que-parfait says it was already over before another moment in the past.
  fr.a2.unit85.lesson03.teach.gn_ordre:
    title: The order of events
    gloss: When I arrived, Camille had already left. When I arrived, Camille left.
    note: With the plus-que-parfait, Camille left first. With the passé composé, she left after I arrived.
  fr.a2.unit85.lesson03.teach.gn_negation:
    title: Negation
    gloss: I had not eaten yet. He had never taken the train.
    note: '*Ne ... pas encore* and *ne ... jamais* wrap around the auxiliary: *je n''avais pas encore mangé*.'
  fr.a2.unit85.lesson03.teach.phrase:
    title: Arriving too late
    gloss: When I arrived, the train had already left.
  fr.a2.unit85.lesson04.teach.raisons:
    title: Reasons
    gloss: because / to miss / so
    example_gloss:
    - I am tired because I did not sleep.
    - He is late because he missed the train.
    - It is raining, so I take the bus.
    - He missed the train.
  fr.a2.unit85.lesson04.teach.gn_parce_que:
    title: Explaining with parce que
    gloss: I arrived late because I had forgotten my ticket.
    note: 'The plus-que-parfait explains the earlier reason for a past situation: *parce que j''avais oublié*.'
  fr.a2.unit85.lesson04.teach.gn_alors:
    title: Cause and result
    gloss: I had forgotten my bag, so I went home.
    note: The earlier cause is in the plus-que-parfait, the result in the passé composé. *Alors* joins them.
  fr.a2.unit85.lesson04.teach.phrase:
    title: Bag forgotten
    gloss: I had forgotten my bag, so I went home.
  fr.a2.unit85.lesson05.teach.mots:
    title: Words for the message
    gloss: day / to look for, to fetch / two o'clock
    example_gloss:
    - What a lovely day!
    - I am looking for my ticket.
    - The train leaves at two.
  fr.a2.unit85.lesson05.teach.gn_retour:
    title: Going back in time
    gloss: The train had left. I had forgotten my ticket.
    note: 'A story can give the result first and then explain with the plus-que-parfait: *le train était parti ... j''avais oublié mon billet*.'
  fr.a2.unit85.lesson05.teach.gn_chaine:
    title: The chain of events
    gloss: I arrived at noon. The train had left. I went home. I took the two o'clock train.
    note: The main events are in the passé composé; the plus-que-parfait explains what had already happened.
  fr.a2.unit85.lesson05.teach.reading:
    title: Camille tells Mathieu about her day
    gloss: Hi Mathieu, what a day! I arrived at the station at noon, but the train had already left. I was late because I had forgotten my ticket at home. So I went home to get my ticket. Then I took the two o'clock train. Camille
    note: The plus-que-parfait appears where the text explains something that had already happened.
    glosses:
      gare: station
      chercher: to fetch
      midi: noon
  fr.a2.unit85.lesson06.teach.q1:
    title: Mathieu asks
    gloss: 'Mathieu: Camille, did you arrive at noon?'
  fr.a2.unit85.lesson06.teach.a1:
    title: Camille answers
    gloss: 'Camille: Yes, but the train had already left!'
  fr.a2.unit85.lesson06.teach.q2:
    title: Mathieu asks why
    gloss: 'Mathieu: Why were you late?'
  fr.a2.unit85.lesson06.teach.a2:
    title: Camille explains
    gloss: 'Camille: Because I had forgotten my ticket.'
  fr.a2.unit85.lesson06.teach.q3:
    title: Mathieu asks what happened next
    gloss: 'Mathieu: And what did you do?'
  fr.a2.unit85.lesson06.teach.a3:
    title: Camille finishes
    gloss: 'Camille: I went home, then I took the two o''clock train.'
