teaching:
  fr.a1.unit43.lesson01.teach.le_billet:
    title: The ticket
    gloss: the ticket
    note: '*Billet* is masculine: *le billet*, *un billet*.'
    example_gloss: I would like a ticket to Lyon.
  fr.a1.unit43.lesson01.teach.je_voudrais_un:
    title: Requesting a ticket
    gloss: I would like a ticket to Lyon.
    note: '*Je voudrais* softens a request; it is more polite than *je veux*.'
  fr.a1.unit43.lesson01.teach.voulez_vous_un:
    title: The agent asks which kind
    gloss: Would you like a one-way ticket or a return?
    note: '*Voulez-vous* is the formal *vous* form of *vouloir*, used here for an unfamiliar station employee.'
  fr.a1.unit43.lesson01.teach.un_aller_retour:
    title: Answering politely
    gloss: A return, please.
    note: '*S''il vous plaît* is the formal please, matching the *vous* register of the exchange.'
  fr.a1.unit43.lesson01.teach.au_guichet_on:
    title: Register at the counter
    gloss: At the counter, you usually use the polite form *vous*.
    note: Strangers in a service role are addressed with *vous*; friends and family get *tu*.
  fr.a1.unit43.lesson02.teach.le_quai:
    title: The platform
    gloss: the platform
    note: '*Quai* is masculine: *le quai*.'
    example_gloss: From which platform does the train to Lyon leave?
  fr.a1.unit43.lesson02.teach.de_quel_quai:
    title: Asking which platform
    gloss: From which platform does the train to Lyon leave?
    note: '*De quel quai* asks specifically for the platform; *quel* agrees with the masculine noun *quai*.'
  fr.a1.unit43.lesson02.teach.le_train_part:
    title: Stating departure details
    gloss: The train leaves at a quarter to ten from platform five.
    note: '*Dix heures moins le quart* means a quarter to ten: French says *moins* (minus) for times before the hour.'
  fr.a1.unit43.lesson02.teach.a_quelle_heure:
    title: Asking arrival time
    gloss: What time does the train arrive?
    note: '*À quelle heure arrive ... ?* asks for the time; *arriver* is a regular *-er* verb: *le train arrive*.'
  fr.a1.unit43.lesson02.teach.le_train_arrive:
    title: Stating arrival time
    gloss: The train arrives at eleven o'clock.
    note: '*Arrive* is the *il/elle* form of *arriver*; *-er* verbs end in *-e* with *il* and *elle*.'
  fr.a1.unit43.lesson03.teach.a_l_heure:
    title: On time / the delay
    gloss: on time; the delay
    note: '*À l''heure* is a fixed expression for something happening on schedule. *Le retard* (the delay) is masculine.'
    example_gloss:
    - The train does not leave on time.
    - 'Attention: the train to Lyon is delayed.'
  fr.a1.unit43.lesson03.teach.attention_le_train:
    title: An announcement
    gloss: 'Attention: the train to Lyon is delayed.'
    note: '*Attention* opens a station announcement, similar to English ''Attention, passengers.'''
  fr.a1.unit43.lesson03.teach.le_train_ne:
    title: Negating on time
    gloss: The train does not leave on time.
    note: '*Ne ... pas* wraps around the verb: *ne part pas à l''heure*.'
  fr.a1.unit43.lesson03.teach.le_train_part:
    title: A platform change
    gloss: The train leaves from platform three instead of platform five.
    note: '*Au lieu du* means ''instead of the''; *de* + *le* joins into *du*.'
  fr.a1.unit43.lesson03.teach.le_train_a:
    title: Stating the delay length
    gloss: The train has a ten-minute delay.
    note: '*A ... de retard* (literally ''has ... of delay'') is the natural way to say something is late; it uses *avoir*.'
  fr.a1.unit43.lesson04.teach.l_entree_la:
    title: Entrance, exit, waiting room
    gloss: the entrance; the exit; the waiting room
    note: '*L''entrée* loses its *e* in *l''* before a vowel; *la sortie* and *la salle d''attente* are feminine.'
    example_gloss:
    - Where is the entrance?
    - Where is the exit?
    - Where is the waiting room?
  fr.a1.unit43.lesson04.teach.ou_est_le:
    title: Asking where a platform is
    gloss: Where is platform seven?
    note: '*Où est ... ?* asks where something is; *le quai sept* is masculine.'
  fr.a1.unit43.lesson04.teach.tout_droit_puis:
    title: Giving directions
    gloss: Straight ahead and then right.
    note: '*Tout droit* and *à droite* are the direction words; *à* goes before *droite*.'
  fr.a1.unit43.lesson04.teach.ou_est_la:
    title: Asking about the waiting room
    gloss: Where is the waiting room?
    note: The same question pattern applied to a new place.
  fr.a1.unit43.lesson05.teach.billet_paris_gare:
    title: Read a printed ticket
    gloss: 'Ticket: Paris Gare de Lyon to Lyon Part-Dieu. Departure: ten past ten, platform seven. Arrival: ten to eleven. Return. Price: twelve euros forty.'
    note: Track the departure time and platform, the arrival time, the ticket type, and the price.
    glosses:
      Billet: ticket
      Départ: departure
      dix: ten
      quai: platform
      sept: seven
      Arrivée: arrival
      onze: eleven
      Aller-retour: return ticket
      Prix: price
      douze: twelve
      euros: euros
      quarante: forty
  fr.a1.unit43.lesson06.teach.mathieu_on_doit:
    title: Mathieu states the plan
    gloss: 'Mathieu: We need to get to platform seven. The train leaves at ten past ten.'
    note: '*On doit* (from *devoir*) expresses a practical necessity here, not a strict obligation.'
  fr.a1.unit43.lesson06.teach.camille_regarde_voila:
    title: Camille reads the sign
    gloss: 'Camille: Look, there''s the sign: delay, ten minutes.'
    note: '*Voilà* points out what is there: *voilà le panneau*.'
  fr.a1.unit43.lesson06.teach.mathieu_pas_de:
    title: Mathieu stays calm
    gloss: 'Mathieu: No problem, we still have time for a coffee.'
    note: '*Pas de problème* is a common, casual reassurance.'
  fr.a1.unit43.lesson06.teach.camille_bonne_idee:
    title: The train arrives
    gloss: 'Camille: Good idea. Oh, there''s the train already. Platform seven, exactly!'
    note: '*Déjà* (already) signals the train arrived sooner than expected, given the delay just announced.'
  fr.a1.unit43.lesson06.teach.mathieu_allez_on:
    title: They board the train
    gloss: 'Mathieu: Come on, let''s get on. Lyon, here we come!'
    note: '*On* is an everyday *we* used with the *il* form of the verb: *on monte*. *On arrive !* is the natural way to say ''here we come''; a word-for-word translation would sound odd.'
