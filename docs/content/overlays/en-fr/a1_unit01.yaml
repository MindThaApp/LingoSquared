answer_policy:
  diacritics: >-
    Teach and display standard French accents and the cedilla. For free-typed
    A1 answers, accept otherwise-correct forms without diacritics, including
    ca for ça, tres for très, and enchante for enchanté. This leniency does
    not erase meaningful letters: masculine enchanté and feminine enchantée
    remain distinct through the final e even when accents are omitted.
  apostrophes: >-
    Accept straight and typographic apostrophes interchangeably. Require the
    apostrophe when an exercise specifically tests elision, such as j’habite;
    do not accept jhabite in that exercise.
  hyphens: >-
    Teach the standard hyphens in inverted questions such as allez-vous and
    vas-tu. In free transcription exercises, accept an otherwise-correct
    spaced version at A1, but retain the hyphenated form as the model answer.
  capitalization_and_punctuation: >-
    Accept ordinary capitalization differences and omission of French spacing
    before question or exclamation marks. Spoken answers are assessed for
    intelligibility and appropriate register, not written punctuation.

course:
  title: "French A1"
  description: >-
    Learn standard Metropolitan French greetings, introductions, reading-aloud
    patterns, and first-meeting small talk. Guidance addresses the contrasts
    English speakers need most: tu versus vous, grammatical gender, agreement,
    conjugated verb forms, elision, and liaison.

units:
  fr.a1.unit01.greetings:
    title: "Greetings and first meetings"

lessons:
  fr.a1.unit01.lesson01.tu_vous_greetings:
    title: "Greeting people with tu or vous"
  fr.a1.unit01.lesson02.names_introductions:
    title: "Saying and asking names"
  fr.a1.unit01.lesson03.reading_aloud:
    title: "Reading a first meeting aloud"
  fr.a1.unit01.lesson04.wellbeing:
    title: "A brief wellbeing exchange"
  fr.a1.unit01.lesson05.first_meeting_small_talk:
    title: "Getting acquainted in the neighbourhood"
  fr.a1.unit01.lesson06.workshop_dialogue:
    title: "First meeting at a workshop"

teaching:
  fr.a1.unit01.lesson01.teach.bonjour:
    title: "Neutral greeting"
    gloss: "hello; good morning"
    note: >-
      Bonjour is safe with strangers, colleagues, and friends during the day.
      Unlike English hello, it also carries the sense of good day.

  fr.a1.unit01.lesson01.teach.salut:
    title: "Informal greeting"
    gloss: "hi; bye"
    note: >-
      Salut is for an informal relationship. It can open or close an exchange,
      but it is not the safest first choice with an unfamiliar adult.

  fr.a1.unit01.lesson01.teach.au_revoir:
    title: "Neutral farewell"
    gloss: "goodbye"
    note: "Au revoir works in both polite and informal situations."

  fr.a1.unit01.lesson01.teach.tu:
    title: "Informal singular you"
    gloss: "you, informal singular"
    note: >-
      English uses you regardless of social distance. French tu addresses one
      friend, child, or person in an explicitly informal relationship, and it
      requires its own verb forms.

  fr.a1.unit01.lesson01.teach.vous:
    title: "Polite or plural you"
    gloss: "you, polite singular or plural"
    note: >-
      Vous is the safe choice for one unfamiliar adult and is also the form
      for any group. English you does not reveal either politeness or number,
      so English speakers must infer the intended relationship from context.

  fr.a1.unit01.lesson01.teach.comment_allez_vous:
    title: "Formal wellbeing question"
    gloss: "How are you?"
    note: >-
      Allez is the vous form of aller. The verb and pronoun are inverted and
      joined with a hyphen. This is a conventional polite question rather than
      a literal enquiry about where someone is going.

  fr.a1.unit01.lesson01.teach.comment_vas_tu:
    title: "Informal wellbeing question"
    gloss: "How are you?"
    note: >-
      Vas is the tu form of aller. English keeps are unchanged, while French
      changes allez-vous to vas-tu when the relationship becomes informal.

  fr.a1.unit01.lesson01.teach.register_choice:
    title: "Match greeting and relationship"
    gloss: "Bonjour with vous; salut with tu"
    note: >-
      These pairings are useful defaults, not absolute laws. Bonjour can also
      be used with friends, but salut plus vous usually sends conflicting
      social signals.

  fr.a1.unit01.lesson02.teach.je_mappelle:
    title: "Give your name"
    gloss: "My name is Camille."
    note: >-
      Je m’appelle literally means I call myself. French normally requires the
      subject je, unlike languages that routinely omit subject pronouns.
      The vowel in me disappears before appelle, producing m’appelle.

  fr.a1.unit01.lesson02.teach.comment_appelez_vous:
    title: "Ask a name politely"
    gloss: "What is your name?"
    note: >-
      Appelez is the vous form of appeler. The second vous follows the verb
      because the question uses inversion: vous appelez-vous.

  fr.a1.unit01.lesson02.teach.tu_tappelles:
    title: "Ask a name informally"
    gloss: "What is your name?"
    note: >-
      T’appelles is the tu form with the reflexive pronoun te shortened before
      a vowel. This everyday question keeps tu before the verb and places
      comment at the end.

  fr.a1.unit01.lesson02.teach.moi_cest:
    title: "Conversational self-introduction"
    gloss: "I'm Noé."
    note: >-
      Moi, c’est is an idiomatic spoken introduction. It is more conversational
      than translating English I am word for word.

  fr.a1.unit01.lesson02.teach.enchante:
    title: "Masculine agreement"
    gloss: "Nice to meet you."
    note: >-
      A male speaker normally writes enchanté. English adjectives do not
      reflect the speaker's grammatical gender, but this French adjective does.

  fr.a1.unit01.lesson02.teach.enchantee:
    title: "Feminine agreement"
    gloss: "Nice to meet you."
    note: >-
      A female speaker normally writes enchantée, adding a final e. Enchanté
      and enchantée are generally pronounced alike, so the distinction is
      clearer in writing than in speech.

  fr.a1.unit01.lesson02.teach.et_vous:
    title: "Return a polite question"
    gloss: "And you?"
    note: "Use vous to maintain the polite register or to address a group."

  fr.a1.unit01.lesson02.teach.et_toi:
    title: "Return an informal question"
    gloss: "And you?"
    note: >-
      Toi is the stressed form associated with tu. French uses toi after et,
      not tu.

  fr.a1.unit01.lesson03.teach.elision_jhabite:
    title: "Elision before a vowel"
    gloss: "I live"
    note: >-
      Je loses its vowel before habite, and the apostrophe records that
      elision: j’habite. The h in habiter does not block elision.

  fr.a1.unit01.lesson03.teach.liaison_vous_etes:
    title: "Liaison after vous"
    gloss: "you are"
    note: >-
      The final s of vous is normally silent, but before the vowel sound in
      êtes it links as a z sound: vous êtes sounds approximately like
      voo-ZEHT. The liaison belongs to the spoken phrase, not to its spelling.

  fr.a1.unit01.lesson03.teach.liaison_un_atelier:
    title: "Liaison after un"
    gloss: "a workshop"
    note: >-
      The final n of un links into atelier. English speakers should avoid
      inserting a hard pause between the two words.

  fr.a1.unit01.lesson03.teach.final_e_enchante:
    title: "Masculine spelling"
    gloss: "pleased to meet you, masculine"
    note: >-
      Enchanté ends in é for a male speaker. The -an- is a nasal vowel, so do
      not pronounce a separate n sound as you would in an English reading.

  fr.a1.unit01.lesson03.teach.final_e_enchantee:
    title: "Feminine spelling"
    gloss: "pleased to meet you, feminine"
    note: >-
      Enchantée adds e for feminine agreement, but that extra e normally does
      not add another spoken syllable.

  fr.a1.unit01.lesson03.teach.question_liaison:
    title: "Read an inverted question"
    gloss: "How are you?"
    note: >-
      Keep allez-vous connected as one question unit. The written z in allez
      is not pronounced as an extra z sound here; standard pronunciation is
      approximately ah-LAY voo.

  fr.a1.unit01.lesson04.teach.ca_va:
    title: "Everyday wellbeing question"
    gloss: "How's it going?; Are you okay?"
    note: >-
      Ça contains a cedilla, which makes c sound like s before a. The same
      expression can be a question or an answer depending on intonation.

  fr.a1.unit01.lesson04.teach.tres_bien:
    title: "Very positive reply"
    gloss: "Very well, thank you."
    note: "Très strengthens bien. Its final s is silent."

  fr.a1.unit01.lesson04.teach.ca_va_bien:
    title: "Positive reply"
    gloss: "I'm doing well."
    note: >-
      French does not need a word corresponding directly to English I in this
      fixed reply.

  fr.a1.unit01.lesson04.teach.pas_mal:
    title: "Moderately positive reply"
    gloss: "Not bad."
    note: "Pas mal is often mildly positive, as its English equivalent can be."

  fr.a1.unit01.lesson04.teach.fatigue:
    title: "Masculine adjective agreement"
    gloss: "I am a little tired."
    note: >-
      Suis is the je form of être. A male speaker writes fatigué. English tired
      does not change with the speaker's gender.

  fr.a1.unit01.lesson04.teach.fatiguee:
    title: "Feminine adjective agreement"
    gloss: "I am a little tired."
    note: >-
      A female speaker writes fatiguée with a final e. The masculine and
      feminine forms are normally pronounced the same.

  fr.a1.unit01.lesson04.teach.et_vous:
    title: "Return the question politely"
    gloss: "And you?"
    note: "Vous preserves the respectful register used with an unfamiliar adult."

  fr.a1.unit01.lesson04.teach.et_toi:
    title: "Return the question informally"
    gloss: "And you?"
    note: "Use toi after et when speaking to one friend or peer informally."

  fr.a1.unit01.lesson05.teach.here_for_workshop:
    title: "Confirm someone's purpose"
    gloss: "Are you here for the workshop?"
    note: >-
      Êtes is the vous form of être. French does not add an auxiliary
      equivalent to English do; rising intonation makes this a question.

  fr.a1.unit01.lesson05.teach.yes_thats_it:
    title: "Confirm an assumption"
    gloss: "Yes, that's right."
    note: "C’est ça is a natural confirmation rather than a literal it is that."

  fr.a1.unit01.lesson05.teach.live_neighborhood:
    title: "Ask where someone lives"
    gloss: "Do you live in the neighbourhood?"
    note: >-
      Habitez is the vous form of habiter. English adds do to form this
      question; French can use the statement order with questioning intonation.

  fr.a1.unit01.lesson05.teach.i_live:
    title: "State where you live"
    gloss: "I live in Montreuil."
    note: >-
      J’habite is the je form of habiter with elision. À marks a city location
      and must not be confused with a, the verb form meaning has.

  fr.a1.unit01.lesson05.teach.from_here:
    title: "Ask about local origin"
    gloss: "Are you from here?"
    note: >-
      D’ici combines de and ici through elision. Êtes remains the vous form of
      être.

  fr.a1.unit01.lesson05.teach.from_lille:
    title: "State your origin"
    gloss: "I am from Lille."
    note: >-
      Suis is the je form of être. French uses de before a city when stating
      origin.

  fr.a1.unit01.lesson05.teach.workshop_starts:
    title: "The activity begins"
    gloss: "The workshop is starting."
    note: >-
      Atelier is masculine, so its singular article is le. Before a vowel,
      le becomes l’. Commence is the third-person singular form.

  fr.a1.unit01.lesson05.teach.see_you_shortly:
    title: "Short-term farewell"
    gloss: "See you shortly; see you later today"
    note: >-
      À tout à l’heure implies another meeting later the same day, unlike a
      general farewell with no expected time.

  fr.a1.unit01.lesson06.teach.line01:
    title: "Open the encounter"
    gloss: "Inès greets Mathieu and checks that he's there for the cooking workshop."
    note: "The speakers begin with vous because they are unfamiliar adults."
  fr.a1.unit01.lesson06.teach.line02:
    title: "Open the encounter, reply"
    gloss: "Mathieu confirms and gives his name, then asks hers."
    note: "Je m’appelle is the standard way to give one's name."

  fr.a1.unit01.lesson06.teach.line03:
    title: "Exchange names"
    gloss: "Inès gives her name and says it's nice to meet him."
    note: "Enchantée agrees with Inès (feminine); the -e ending is written but normally not audible."
  fr.a1.unit01.lesson06.teach.line04:
    title: "Exchange names, reply"
    gloss: "Mathieu returns the sentiment and asks whether she lives nearby."
    note: "Enchanté agrees with Mathieu (masculine), the same word Inès just used without the silent -e."

  fr.a1.unit01.lesson06.teach.line05:
    title: "Exchange neighbourhood information"
    gloss: "Inès confirms and gives her street, then asks Mathieu the same question."
    note: "J’habite plus a street name uses no preposition before rue."
  fr.a1.unit01.lesson06.teach.line06:
    title: "Exchange neighbourhood information, reply"
    gloss: "Mathieu says he lives in Saint-Ouen and asks if she's originally from here."
    note: >-
      J’habite à uses à before a place name, unlike the street expression
      Inès just used.

  fr.a1.unit01.lesson06.teach.line07:
    title: "Exchange origins"
    gloss: "Inès says she isn't from here and that she's from Lille, then asks Mathieu."
    note: "Je suis de plus a city states where someone is from."
  fr.a1.unit01.lesson06.teach.line08:
    title: "Exchange origins, reply"
    gloss: "Mathieu says he's from Lyon."
    note: "Same je suis de pattern Inès just used."

  fr.a1.unit01.lesson06.teach.line09:
    title: "Pause the conversation"
    gloss: "Inès notices the workshop is starting and says she'll see him shortly."
    note: "À tout à l’heure fits because both people will remain at the same event."
  fr.a1.unit01.lesson06.teach.line10:
    title: "Pause the conversation, reply"
    gloss: "Mathieu echoes the same farewell."
    note: "Repeating à tout à l’heure back is the natural way to confirm it."

exercises:
  fr.a1.unit01.lesson01.exercise01.listen_bonjour:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Bonjour."
    distractors: ["Salut !", "Au revoir."]
    accepted_answers: ["Bonjour.", "Bonjour"]

  fr.a1.unit01.lesson01.exercise02.choose_informal:
    instruction: "Which pronoun matches this informal greeting?"
    correct_option: "tu"
    distractors: ["vous"]
    accepted_answers: ["tu"]
    feedback: "Salut and tu form a consistent informal combination."

  fr.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: "Complete the greeting for one unfamiliar adult."
    accepted_answers: ["vous"]
    feedback: "Vous is the safe respectful choice with an unfamiliar adult."

  fr.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: "Put the polite wellbeing question in order."
    correct_response: ["Comment", "allez-vous"]

  fr.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: "Type the informal question you hear."
    accepted_answers:
      - "Comment vas-tu ?"
      - "Comment vas-tu?"
      - "Comment vas tu ?"
      - "Comment vas tu?"

  fr.a1.unit01.lesson01.exercise06.match_register:
    instruction: "Match each greeting with its usual beginner-level register."
    correct_response:
      Bonjour: "vous"
      Salut: "tu"

  fr.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: "Complete the neutral farewell."
    accepted_answers: ["revoir"]

  fr.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: "Use a polite greeting, ask how the person is, and close the exchange."
    accepted_answers:
      - "Bonjour. Comment allez-vous ? Au revoir."
      - "Bonjour, comment allez-vous ? Au revoir."

  fr.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: "Build Camille's self-introduction."
    correct_response: ["Je", "m’appelle", "Camille"]

  fr.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: "Listen and select the polite name question."
    correct_option: "Comment vous appelez-vous ?"
    distractors:
      - "Tu t’appelles comment ?"
      - "Comment allez-vous ?"
    accepted_answers:
      - "Comment vous appelez-vous ?"
      - "Comment vous appelez vous ?"

  fr.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: "After the informal greeting, ask the other person's name."
    accepted_answers:
      - "Tu t’appelles comment ?"
      - "Tu t'appelles comment ?"
      - "Tu t’appelles comment?"
      - "Tu t'appelles comment?"

  fr.a1.unit01.lesson02.exercise04.complete_moi_cest:
    instruction: "Complete Noé's conversational introduction."
    accepted_answers:
      - "c’est"
      - "c'est"

  fr.a1.unit01.lesson02.exercise05_choose_enchantee:
    instruction: "Is Camille's written form correctly marked as feminine?"
    correct_option: "Yes — enchantée has the feminine final e."
    distractors:
      - "No — enchanté is the feminine form."
      - "No — the two written forms are identical."
    accepted_answers: ["Yes — enchantée has the feminine final e."]
    feedback: "Enchantée has the final e used for a female speaker."

  fr.a1.unit01.lesson02.exercise06_return_polite_question:
    instruction: "Return the question without changing from the polite register."
    accepted_answers:
      - "Et vous ?"
      - "Et vous?"

  fr.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: "Match the complementary introduction and agreement forms."
    correct_response:
      "Je m’appelle Camille.": "Moi, c’est Noé."
      "Enchanté.": "Enchantée."

  fr.a1.unit01.lesson02.exercise08.write_introduction:
    instruction: "Write Camille's introduction: greet with Bonjour, give the name with Je m’appelle, and add a meeting expression."
    accepted_answers:
      - "Bonjour. Je m’appelle Camille. Enchanté."
      - "Bonjour. Je m'appelle Camille. Enchanté."
      - "Bonjour. Je m’appelle Camille. Enchantée."
      - "Bonjour. Je m'appelle Camille. Enchantee."
      - "Bonjour. Je m'appelle Camille. Enchantée."
      - "Bonjour, je m’appelle Camille. Enchanté."
      - "Bonjour, je m’appelle Camille. Enchantée."
      - "Bonjour, je m'appelle Camille. Enchanté."
      - "Bonjour, je m'appelle Camille. Enchantée."

  fr.a1.unit01.lesson03.exercise01_recognize_elision:
    instruction: "What two words are combined in j’habite?"
    correct_option: "je + habite"
    distractors: ["tu + habite", "je + être"]
    accepted_answers: ["je + habite"]

  fr.a1.unit01.lesson03.exercise02_complete_elision:
    instruction: "Complete the elided form. Keep the apostrophe shown in the prompt."
    accepted_answers: ["habite"]

  fr.a1.unit01.lesson03.exercise03.listen_liaison:
    instruction: "Listen and select the phrase you hear."
    correct_option: "vous êtes"
    distractors: ["tu t’appelles", "vas-tu"]
    accepted_answers:
      - "vous êtes"
      - "vous etes"

  fr.a1.unit01.lesson03.exercise04_order_atelier:
    instruction: "Build the noun phrase meaning a workshop."
    correct_response: ["un", "atelier"]

  fr.a1.unit01.lesson03.exercise05_match_gender_spelling:
    instruction: "Match each form with its written ending."
    correct_response:
      "enchanté": "é"
      "enchantée": "ée"

  fr.a1.unit01.lesson03.exercise06_listen_polite_question:
    instruction: "Type the polite question you hear."
    accepted_answers:
      - "Comment allez-vous ?"
      - "Comment allez-vous?"
      - "Comment allez vous ?"
      - "Comment allez vous?"

  fr.a1.unit01.lesson03.exercise07_read_liaison:
    instruction: "Read both phrases aloud, linking vous êtes and un atelier naturally."
    accepted_answers:
      - "Vous êtes. Un atelier."
      - "Vous etes. Un atelier."

  fr.a1.unit01.lesson03.exercise08_speak_introduction:
    instruction: "Read Camille's introduction aloud."
    accepted_answers:
      - "Bonjour, je m’appelle Camille. Enchantée."
      - "Bonjour, je m'appelle Camille. Enchantée."
      - "Bonjour. Je m’appelle Camille. Enchantée."

  fr.a1.unit01.lesson04.exercise01.listen_exchange:
    instruction: "Listen and choose the reply given in the exchange."
    correct_option: "Très bien, merci."
    distractors:
      - "Pas mal."
      - "Je suis un peu fatiguée."
    accepted_answers:
      - "Très bien, merci."
      - "Tres bien, merci."

  fr.a1.unit01.lesson04.exercise02.order_question:
    instruction: "Build the everyday wellbeing question."
    correct_response: ["Ça", "va"]

  fr.a1.unit01.lesson04.exercise03_reply_positive:
    instruction: "Give a positive reply."
    accepted_answers:
      - "Ça va bien."
      - "Ça va bien"
      - "Ca va bien."
      - "Très bien, merci."
      - "Tres bien, merci."
      - "Ça va."

  fr.a1.unit01.lesson04.exercise04_choose_neutral_reply:
    instruction: "What does this reply mean?"
    correct_option: "Not bad."
    distractors: ["Very badly.", "Goodbye."]
    accepted_answers: ["Not bad."]

  fr.a1.unit01.lesson04.exercise05.listen_fatiguee:
    instruction: "Type the sentence spoken by the female speaker."
    accepted_answers:
      - "Je suis un peu fatiguée."
      - "Je suis un peu fatiguée"
      - "Je suis un peu fatiguee."
      - "Je suis un peu fatiguee"

  fr.a1.unit01.lesson04.exercise06_complete_fatigue:
    instruction: "Complete the sentence using the masculine written form."
    accepted_answers:
      - "fatigué"
      - "fatigue"
    feedback: "The feminine form would add another written e: fatiguée."

  fr.a1.unit01.lesson04.exercise07_return_question:
    instruction: "Give the positive reply and politely return the question."
    accepted_answers:
      - "Très bien, merci. Et vous ?"
      - "Très bien, merci. Et vous?"
      - "Très bien, merci, et vous ?"
      - "Tres bien, merci. Et vous?"
      - "Ça va bien. Et vous ?"
      - "Très bien. Et vous ?"

  fr.a1.unit01.lesson04.exercise08_speak_informal_exchange:
    instruction: "Answer informally and return the question."
    accepted_answers:
      - "Pas mal. Et toi ?"
