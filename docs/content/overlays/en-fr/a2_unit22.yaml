  fr.a2.unit22.lesson01.habitudes_en_ligne:
    title: "Describing online habits"
  fr.a2.unit22.lesson02.donner_avis_numerique:
    title: "Giving a simple opinion"

teaching:
  fr.a2.unit22.lesson01.teach.consulter_messages:
    title: "To check messages"
    gloss: "to check one's messages"
    note: "*Consulter* is natural for messages, email, schedules, and websites; it does not mean consulting a professional here."
    example_gloss: "I check my messages every morning."
  fr.a2.unit22.lesson01.teach.reseaux_sociaux:
    title: "Social media"
    gloss: "social media"
    note: "French says *les réseaux sociaux*, literally social networks."
    example_gloss: "I look at social media mainly on the metro."
  fr.a2.unit22.lesson01.teach.rester_contact:
    title: "To stay in touch"
    gloss: "to stay in touch"
    note: "*Rester en contact avec* is the idiomatic phrase; do not translate word-for-word as *rester dans contact*."
    example_gloss: "I use my phone to stay in touch with my family."
  fr.a2.unit22.lesson01.teach.temps_ecran:
    title: "Screen time"
    gloss: "screen time"
    note: "*Le temps d'écran* is the standard modern phrase."
    example_gloss: "I try to limit my screen time after nine p.m."
  fr.a2.unit22.lesson01.teach.appli:
    title: "An app"
    gloss: "an app"
    note: "*Une appli* is the everyday word; *une application* is possible but more formal."
    example_gloss: "Mathieu uses a recipe app almost every day."
  fr.a2.unit22.lesson01.teach.message_mathieu:
    title: "Read Mathieu's message"
    gloss: "Mathieu uses a recipe app almost every day. It is convenient, but sometimes he spends too much time online."
    note: "This combines a habit, a frequency, and a simple opinion."

  fr.a2.unit22.lesson02.teach.cest_pratique:
    title: "It's convenient"
    gloss: "It's convenient"
    note: "*Pratique* is a useful A2 opinion adjective for technology."
    example_gloss: "It's convenient: the internet is useful when I'm looking for an address."
  fr.a2.unit22.lesson02.teach.parfois:
    title: "Sometimes"
    gloss: "sometimes"
    note: "*Parfois* usually comes near the start or middle of the sentence, not after the whole sentence like English can."
    example_gloss: "Sometimes, I spend too much time online."
  fr.a2.unit22.lesson02.teach.mais:
    title: "But"
    gloss: "but"
    note: "*Mais* is the connector you need for a balanced opinion: useful, but with a limit."
    example_gloss: "The internet is useful, but you need to take breaks."
  fr.a2.unit22.lesson02.teach.presque_tous_les_jours:
    title: "Almost every day"
    gloss: "almost every day"
    note: "*Presque* means almost; do not confuse it with English pressure."
    example_gloss: "I use a recipe app almost every day."
  fr.a2.unit22.lesson02.teach.dialogue_line01:
    title: "Ask about phone use"
    gloss: "Mathieu asks whether Inès often uses her phone to stay in touch since her move."
    note: "*Ton déménagement* refers to Inès's established move to Lyon."
  fr.a2.unit22.lesson02.teach.dialogue_line02:
    title: "Describe a daily habit"
    gloss: "Inès says she checks messages every morning and replies to her family in the evening."
    note: "This gives both activity and frequency."
  fr.a2.unit22.lesson02.teach.dialogue_line03:
    title: "Ask about social media"
    gloss: "Mathieu asks about social media."
    note: "A short follow-up question is natural between friends."
  fr.a2.unit22.lesson02.teach.dialogue_line04:
    title: "Add a limit"
    gloss: "Inès says she mostly looks at social media on the metro, but tries to limit her screen time."
    note: "*Mais* introduces the contrast."
  fr.a2.unit22.lesson02.teach.dialogue_line05:
    title: "Give a balanced opinion"
    gloss: "Mathieu says he uses a recipe app almost every day; it is convenient, but sometimes he spends too much time online."
    note: "Habit plus opinion is the core outcome."
  fr.a2.unit22.lesson02.teach.dialogue_line06:
    title: "Agree and summarize"
    gloss: "Inès agrees: the internet is useful, but you need to take breaks."
    note: "A clear A2 opinion with a connector."

exercises:
  fr.a2.unit22.lesson01.exercise01.select_reseaux_sociaux:
    instruction: "What does *les réseaux sociaux* mean here?"
    correct_option: "social media"
    distractors: ["professional networks only", "phone chargers"]
    accepted_answers: ["social media"]
  fr.a2.unit22.lesson01.exercise02.match_online_vocab:
    instruction: "Match each French online-habit phrase to English."
    correct_response:
      "consulter ses messages": "to check one's messages"
      "les réseaux sociaux": "social media"
      "rester en contact": "to stay in touch"
      "le temps d'écran": "screen time"
      "une appli": "an app"
      "en ligne": "online"
  fr.a2.unit22.lesson01.exercise03.order_consulte_messages:
    instruction: "Build the sentence: I check my messages every morning."
    correct_response: ["Je", "consulte", "mes", "messages", "tous", "les", "matins"]
  fr.a2.unit22.lesson01.exercise04.fill_temps_ecran:
    instruction: "Complete the sentence with the French phrase for screen time."
    accepted_answers: ["temps d'écran"]
  fr.a2.unit22.lesson01.exercise05.read_message_mathieu:
    instruction: "According to Mathieu's message, what does he think about the recipe app?"
    correct_option: "It is convenient, but he sometimes spends too much time online"
    distractors: ["It never works on his phone", "It is only useful at work"]
    accepted_answers: ["It is convenient, but he sometimes spends too much time online"]

  fr.a2.unit22.lesson02.exercise01.select_pratique:
    instruction: "What does *C'est pratique* mean?"
    correct_option: "It's convenient"
    distractors: ["It's actually true", "It's private"]
    accepted_answers: ["It's convenient"]
  fr.a2.unit22.lesson02.exercise02.comprehend_habit:
    instruction: "Listen to the dialogue. What phone habit does Inès describe?"
    correct_option: "She checks messages every morning and replies to family in the evening"
    distractors: ["She deletes every app on Sundays", "She records videos at work every night"]
    accepted_answers: ["She checks messages every morning and replies to family in the evening"]
  fr.a2.unit22.lesson02.exercise03.match_opinion_phrases:
    instruction: "Match each French opinion phrase to English."
    correct_response:
      "C'est pratique": "It's convenient"
      "parfois": "sometimes"
      "mais": "but"
      "presque tous les jours": "almost every day"
      "faire des pauses": "to take breaks"
      "trop de temps en ligne": "too much time online"
  fr.a2.unit22.lesson02.exercise04.order_internet_utile:
    instruction: "Build the sentence: The internet is useful, but you need to take breaks."
    correct_response: ["Internet", "est", "utile", "mais", "il", "faut", "faire", "des", "pauses"]
  fr.a2.unit22.lesson02.exercise05.speak_online_habit:
    instruction: "Say this sentence shape: *J'utilise mon téléphone tous les jours, mais j'essaie de limiter mon temps d'écran.*"
    accepted_answers:
      - "J'utilise mon téléphone tous les jours, mais j'essaie de limiter mon temps d'écran."
      - "Je consulte mes messages tous les matins, mais je fais des pauses."
      - "J'utilise Internet tous les jours, mais parfois je passe trop de temps en ligne."
  fr.a2.unit22.lesson02.exercise06.write_online_habit:
    instruction: "Write this sentence shape: *J'utilise mon téléphone tous les jours pour consulter mes messages, mais j'essaie de limiter mon temps d'écran.*"
    accepted_answers:
      - "J'utilise mon téléphone tous les jours pour consulter mes messages, mais j'essaie de limiter mon temps d'écran."
      - "Je consulte mes messages tous les matins, mais je fais des pauses."
      - "J'utilise Internet tous les jours, mais parfois je passe trop de temps en ligne."
