review:
  status: reviewed
  required_next_reviewer: fresh_context
  notes: >-
    Overlay for fr/a2_unit21_voyage_perturbe.yaml. Distractors target
    English-speaker interference around false friends, word order after
    est-ce que, and overusing direct English-style requests.

answer_policy:
  accent_marks: >-
    Display accents. Accept accentless typed variants when every word and
    letter is otherwise correct.
  capitalization: >-
    Accept normal sentence-initial capitalization variants. Preserve proper
    names such as Inès, Mathieu, Paris, and Dijon.
  register: >-
    Use vous with station staff and tu with Mathieu.

course:
  title: "French A2"
  description: "Handling a delayed or cancelled journey, asking about alternatives, and telling a friend you will arrive late."

units:
  fr.a2.unit21.voyage_perturbe:
    title: "Travel disruption"

lessons:
  fr.a2.unit21.lesson01.comprendre_perturbation:
    title: "Understanding a disruption"
  fr.a2.unit21.lesson02.demander_solution:
    title: "Asking for a solution"

teaching:
  fr.a2.unit21.lesson01.teach.retard:
    title: "A delay"
    gloss: "a delay"
    note: "*Un retard* is used with *avoir*: *le train a du retard*, literally the train has delay."
    example_gloss: "The train to Paris is twenty minutes late."
  fr.a2.unit21.lesson01.teach.annule:
    title: "Cancelled"
    gloss: "cancelled"
    note: "*Annulé* agrees like an adjective when needed: *la réunion est annulée*, *le train est annulé*."
    example_gloss: "The train is cancelled because of a technical problem."
  fr.a2.unit21.lesson01.teach.voie:
    title: "Platform or track"
    gloss: "the platform / track"
    note: "In French station announcements, *voie* is the word to listen for before the platform number."
    example_gloss: "The train will leave from platform six."
  fr.a2.unit21.lesson01.teach.correspondance:
    title: "A connection"
    gloss: "a connection"
    note: "Do not use English *correspondence* here; in travel French, *une correspondance* is a connection."
    example_gloss: "I'm going to take a connection in Dijon for Paris."
  fr.a2.unit21.lesson01.teach.billet_valable:
    title: "A valid ticket"
    gloss: "a valid ticket"
    note: "*Valable* means valid or usable, not valuable."
    example_gloss: "My ticket remains valid today."
  fr.a2.unit21.lesson01.teach.notice:
    title: "Read the notice"
    gloss: "The 18:40 train to Paris is delayed by forty minutes; travellers can take the connection via Dijon with the same ticket."
    note: "*Avis aux voyageurs* is the fixed heading for station notices."

  fr.a2.unit21.lesson02.teach.autre_option:
    title: "Is there another option?"
    gloss: "Is there another option?"
    note: "*Est-ce qu'il y a...?* keeps the word order stable; do not translate English word order as *Est il y a*."
    example_gloss: "Is there another option?"
  fr.a2.unit21.lesson02.teach.prevenir:
    title: "To let someone know"
    gloss: "to let someone know"
    note: "*Prévenir* means to inform someone in advance or warn them; here it is simply letting Mathieu know."
    example_gloss:
      - "I'm going to let Mathieu know that I'll arrive later."
      - "Hi Mathieu, I'm going to arrive later."
  fr.a2.unit21.lesson02.teach.rater_correspondance:
    title: "To miss a connection"
    gloss: "to miss a connection"
    note: "French uses *rater* for missing a train or connection, not *manquer* in this everyday travel sentence."
    example_gloss: "I missed my connection because of the delay."
  fr.a2.unit21.lesson02.teach.arriver_plus_tard:
    title: "To arrive later"
    gloss: "to arrive later"
    note: "*Plus tard que prévu* means later than planned."
    example_gloss: "I'm going to arrive in Paris later than planned."
  fr.a2.unit21.lesson02.teach.dialogue_line01:
    title: "Ask about alternatives"
    gloss: "Inès politely says her train to Paris is announced with a forty-minute delay and asks whether there is another option."
    note: "She uses *excusez-moi* and *vous*-context politeness for station staff."
  fr.a2.unit21.lesson02.teach.dialogue_line02:
    title: "Give an alternative route"
    gloss: "The agent says she can take the train to Dijon, then a connection to Paris at 7:20 PM."
    note: "*Puis* sequences the two travel steps."
  fr.a2.unit21.lesson02.teach.dialogue_line03:
    title: "Check the ticket"
    gloss: "Inès asks whether her ticket is valid for that connection."
    note: "*Cette correspondance* refers back to the specific connection the agent just offered."
  fr.a2.unit21.lesson02.teach.dialogue_line04:
    title: "Confirm the ticket"
    gloss: "The agent says yes; because of the delay, her ticket remains valid today."
    note: "*À cause de* gives the reason for the exception."
  fr.a2.unit21.lesson02.teach.dialogue_line05:
    title: "Warn a friend"
    gloss: "Inès thanks the agent and says she will let her friend know she will arrive later."
    note: "This sets up the final writing task: a short message with the disruption and consequence."
  fr.a2.unit21.lesson02.teach.dialogue_line06:
    title: "Close politely"
    gloss: "The agent wishes her a good evening."
    note: "*Madame* fits the service-register interaction."

exercises:
  fr.a2.unit21.lesson01.exercise01.select_retard:
    instruction: "What does this sentence say about the train?"
    correct_option: "It is twenty minutes late"
    distractors: ["It leaves from platform twenty", "It has been cancelled"]
    accepted_answers: ["It is twenty minutes late"]
  fr.a2.unit21.lesson01.exercise02.match_disruption_vocab:
    instruction: "Match each French travel word or phrase to its English meaning."
    correct_response:
      "un retard": "a delay"
      "annulé": "cancelled"
      "la voie": "the platform / track"
      "une correspondance": "a connection"
      "un billet valable": "a valid ticket"
      "retardé de quarante minutes": "delayed by forty minutes"
  fr.a2.unit21.lesson01.exercise03.order_train_retard:
    instruction: "Build the sentence: The train to Paris is twenty minutes late."
    correct_response: ["Le", "train", "pour", "Paris", "a", "vingt", "minutes", "de", "retard"]
  fr.a2.unit21.lesson01.exercise04.fill_correspondance:
    instruction: "Complete the sentence with the French word for connection."
    accepted_answers: ["correspondance"]
  fr.a2.unit21.lesson01.exercise05.read_notice:
    instruction: "According to the notice, what can passengers do?"
    correct_option: "Take the connection via Dijon with the same ticket"
    distractors: ["Exchange the ticket tomorrow", "Wait on platform twelve"]
    accepted_answers: ["Take the connection via Dijon with the same ticket"]

  fr.a2.unit21.lesson02.exercise01.select_autre_option:
    instruction: "Which phrase politely asks whether there is another option?"
    correct_option: "Est-ce qu'il y a une autre option ?"
    distractors: ["Je suis une autre option.", "Il est une option autre ?"]
    accepted_answers: ["Est-ce qu'il y a une autre option ?"]
  fr.a2.unit21.lesson02.exercise02.comprehend_solution:
    instruction: "Listen. What changed?"
    correct_option: "The train is twenty minutes late"
    distractors: ["The train leaves from platform twenty", "The train is cancelled"]
    accepted_answers: ["The train is twenty minutes late"]
  fr.a2.unit21.lesson02.exercise03.match_solution_phrases:
    instruction: "Match each French phrase to its English meaning."
    correct_response:
      "Est-ce qu'il y a une autre option ?": "Is there another option?"
      "prévenir quelqu'un": "to let someone know"
      "rater une correspondance": "to miss a connection"
      "arriver plus tard": "to arrive later"
      "un billet valable": "a valid ticket"
      "à cause du retard": "because of the delay"
  fr.a2.unit21.lesson02.exercise04.order_autre_option:
    instruction: "Build the question: Is there another option?"
    correct_response: ["Est-ce", "qu'il", "y", "a", "une", "autre", "option"]
  fr.a2.unit21.lesson02.exercise05.reply_ask_alternative:
    instruction: "Take Inès's role. Say exactly: *Excusez-moi, est-ce qu'il y a une autre option ?*"
    accepted_answers:
      - "Excusez-moi, est-ce qu'il y a une autre option ?"
      - "Excusez-moi, y a-t-il une autre option ?"
      - "Bonjour, est-ce qu'il y a une autre option ?"
  fr.a2.unit21.lesson02.exercise06.write_late_message:
    instruction: "Write this message shape: *Salut Mathieu, mon train a quarante minutes de retard, je vais arriver plus tard.*"
    accepted_answers:
      - "Salut Mathieu, mon train a quarante minutes de retard, je vais arriver plus tard."
      - "Salut Mathieu, mon train a quarante minutes de retard. Je vais arriver plus tard."
      - "Mathieu, mon train a quarante minutes de retard, je vais arriver plus tard."
