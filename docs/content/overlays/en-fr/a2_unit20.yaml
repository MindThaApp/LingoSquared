answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A2
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names and "Monsieur."
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate formal
    register rather than written punctuation or liaison marks.
  formal_register: >-
    This unit's entire scenario is a job interview and uses vous
    throughout, a deliberate step up from unit01-14's tu with peers.
    Accept only vous-conjugated forms in any exercise scripted as
    something Inès says to the interviewer -- tu-conjugated substitutes
    are a register error at this stage, not a harmless variant.

course:
  title: "French A2"
  description: >-
    Attending a job interview: describing relevant experience and
    availability, and asking a clarifying question about the role, in
    an appropriately formal register. A look back at the story's
    turning point after Inès's cooking workshop with Mathieu -- this is
    the interview Inès had for her pâtisserie apprenticeship in Lyon
    with Monsieur Lefebvre, which is why she moved there. English-specific guidance highlights
    that French interview politeness leans on the conditional
    ("Est-ce que je pourrais...?", "J'aimerais savoir si...") and the
    subjunctive after expressions like *il faudrait que* and *avant
    que* -- both genuine steps beyond A1's indicative-only sentences.

units:
  fr.a2.unit20.entretien_embauche:
    title: "Job interview"

lessons:
  fr.a2.unit20.lesson01.parler_experience:
    title: "Talking about your experience"
  fr.a2.unit20.lesson02.repondre_avec_politesse:
    title: "Answering politely"
  fr.a2.unit20.lesson03.dialogue_entretien_lefebvre:
    title: "The interview at Pâtisserie Lefebvre"

teaching:
  fr.a2.unit20.lesson01.teach.job_posting:
    title: "Read the job posting"
    gloss: >-
      Pâtisserie Lefebvre, in Lyon, is looking for a motivated apprentice
      for the new intake. We require good availability, including
      Saturdays. Send your application before Friday for an interview
      next week.
    note: "This is the actual posting Inès applied to -- *cherche* (is looking for) and *demandons* (we require) are common formal job-ad verbs."
    glosses:
      cherche: "is looking for (from chercher)"
      rentrée: "new intake / start of term"
      demandons: "require (from demander)"
      bonne: "good"
      disponibilité: "availability"
      compris: "included (from comprendre)"
      samedi: "Saturday"
      Envoyez: "send (from envoyer)"
      candidature: "application"
      avant: "before"
      entretien: "interview"
      semaine: "week"
      prochaine: "next"

  fr.a2.unit20.lesson01.teach.postuler:
    title: "To apply for"
    gloss: "to apply for"
    note: "*Postuler à* + a position is the standard verb for applying for a job, distinct from *demander* (to ask for)."
    example_gloss: "I applied for this position because I'm passionate about pastry."

  fr.a2.unit20.lesson01.teach.entretien_embauche:
    title: "A job interview"
    gloss: "a job interview"
    note: "*L'embauche* means hiring (from *embaucher*, to hire); *un entretien d'embauche* is the fixed phrase for a job interview."
    example_gloss: "I have a job interview tomorrow for a pastry-chef position."

  fr.a2.unit20.lesson01.teach.se_presenter:
    title: "To introduce oneself"
    gloss: "to introduce oneself"
    note: "*Se présenter* is the natural opening move of any interview -- a reflexive verb, like *s'appeler*."
    example_gloss: "Let me introduce myself: my name is Inès and I'm passionate about pastry."

  fr.a2.unit20.lesson01.teach.experience:
    title: "Experience"
    gloss: "experience"
    note: "For work background in general, French says *de l'expérience* or *un peu d'expérience*, without *une*. With a describing word, *une expérience* is normal: *une expérience professionnelle* (as M. Lefebvre asks later)."
    example_gloss: "I have a little experience: I did a cooking workshop with a friend last year."

  fr.a2.unit20.lesson01.teach.stage:
    title: "To do an internship"
    gloss: "to do an internship"
    note: "*Un stage* is the standard French term for a short work placement or internship -- common for students and career-changers alike."
    example_gloss: "Before this interview, I did a two-week internship at a bakery."

  fr.a2.unit20.lesson01.teach.disponible:
    title: "To be available"
    gloss: "to be available"
    note: "*Disponible* is the key adjective for scheduling questions in any interview -- pairs naturally with *à partir de* (starting from)."
    example_gloss: "I'm available starting next month, Monday through Saturday."

  fr.a2.unit20.lesson01.teach.point_fort:
    title: "A strength"
    gloss: "a strength"
    note: "*Un point fort* (literally \"a strong point\") is the standard way to name a personal strength in an interview -- its opposite is *un point faible*."
    example_gloss: "My strength is that I'm very motivated and I learn quickly."

  fr.a2.unit20.lesson02.teach.vouvoiement:
    title: "Formal address in interviews"
    gloss: "In an interview, you always use vous, never tu."
    note: "*Vouvoiement* is the formal register itself. Unlike the *tu* Inès uses with Mathieu, every sentence toward the interviewer uses *vous* -- a real register shift to keep track of, not just a vocabulary note."

  fr.a2.unit20.lesson02.teach.est_ce_que_je_pourrais:
    title: "Could I...?"
    gloss: "Could I...?"
    note: "*Est-ce que je pourrais...?* uses the conditional of *pouvoir* to soften a request -- much more polite in an interview than a plain *Je peux...?*"
    example_gloss: "Could I ask you a question about the position?"

  fr.a2.unit20.lesson02.teach.jaimerais_savoir_si:
    title: "I'd like to know if..."
    gloss: "I'd like to know if..."
    note: "*J'aimerais* (the conditional of *aimer*) is a standard polite way to introduce a question, softer than the plain present *je veux savoir*."
    example_gloss: "I'd like to know if I would also work on weekends."

  fr.a2.unit20.lesson02.teach.il_faudrait_que:
    title: "It would be necessary that"
    gloss: "it would be necessary that"
    note: "*Il faudrait que* is always followed by the subjunctive (here, *sois*, from *être*) -- one of the most common subjunctive triggers in formal French."
    example_gloss: "It would be necessary for me to be available every morning."

  fr.a2.unit20.lesson02.teach.avant_que:
    title: "Before"
    gloss: "before"
    note: "*Avant que* also triggers the subjunctive (*commence*, from *commencer*) -- like *il faudrait que*, it's a fixed pattern to memorize rather than derive. When both parts of the sentence have the same subject, French uses *avant de* + infinitive instead (*avant de commencer*)."
    example_gloss:
      - "Before the apprenticeship starts, I'd like to know who my trainer would be."
      - "I'm available to start next month."

  fr.a2.unit20.lesson02.teach.se_former_aupres_de:
    title: "To train under, with"
    gloss: "to train under, with"
    note: "*Se former auprès de* (literally \"to train alongside\") is a natural way to describe wanting to learn directly from an experienced mentor."
    example_gloss: "I would like to train under a real pastry chef."

  fr.a2.unit20.lesson02.teach.je_me_suis_toujours_interessee:
    title: "A longstanding interest, explained"
    gloss: >-
      I've always been interested in pastry, and I recently did a
      workshop that really made me want to go further.
    note: "Combines the reflexive passé composé *je me suis toujours intéressée* with a relative clause (*qui m'a... donné envie*) -- exactly the kind of longer, connected sentence that marks A2 speech."

  fr.a2.unit20.lesson03.teach.line01:
    title: "Open the interview"
    gloss: "Monsieur Lefebvre thanks Inès for coming and asks her to talk about her experience in pastry."
    note: "*Merci d'être venue* (thank you for coming) is a standard formal opener, feminine agreement since it's addressed to Inès."

  fr.a2.unit20.lesson03.teach.line02:
    title: "Describe a longstanding interest"
    gloss: "Inès says she's always been interested in pastry, and a recent cooking workshop made her want to go further."
    note: "A callback to the cooking workshop Inès did with Mathieu -- real, relevant experience, even though it's not a professional credential on its own."

  fr.a2.unit20.lesson03.teach.line03:
    title: "Probe for more"
    gloss: "Monsieur Lefebvre says that's a good start, but asks if she has any more professional experience."
    note: "*Un bon début* (a good start) politely signals the workshop alone isn't quite enough -- sets up Inès's stronger answer next."

  fr.a2.unit20.lesson03.teach.line04:
    title: "Describe the internship"
    gloss: "Inès says yes, she also did a two-week internship at a bakery, where she learned to prepare pastries every morning."
    note: "*Où* (where) introduces a relative clause describing the internship -- a longer, more complex sentence than anything at A1."

  fr.a2.unit20.lesson03.teach.line05:
    title: "Ask about availability"
    gloss: "Monsieur Lefebvre asks, using the conditional, when she could start and whether she'd be free on Sundays."
    note: "*Pourriez-vous* and *seriez-vous* are both conditional forms -- softer than a direct present-tense question, appropriately formal."

  fr.a2.unit20.lesson03.teach.line06:
    title: "State availability with one condition"
    gloss: "Inès says she's available starting next month, but she'd need to be free on Sundays to see her family."
    note: "*Il faudrait que je sois libre* uses lesson02's subjunctive pattern in a real answer -- stating a genuine need without sounding demanding."

  fr.a2.unit20.lesson03.teach.line07:
    title: "Reassure and invite a question"
    gloss: "Monsieur Lefebvre says that's no problem, they're closed on Sundays anyway, and asks if she has a question for him."
    note: "*Ça ne pose aucun problème* (that's no problem at all) is a common reassuring phrase in formal French."

  fr.a2.unit20.lesson03.teach.line08:
    title: "Ask a clarifying question"
    gloss: "Inès asks if she could ask a question about the apprenticeship, and says she'd like to know who her trainer would be."
    note: "Combines lesson02's *est-ce que je pourrais* and *j'aimerais savoir* in one turn -- the unit's core \"ask a clarifying question about the role\" skill in action."

  fr.a2.unit20.lesson03.teach.line09:
    title: "Answer the question"
    gloss: "Monsieur Lefebvre says it would be him, most of the time, and she'd work with him every morning before opening."
    note: "*Ce serait moi* and *vous travailleriez* are both conditional, matching the polite, hypothetical framing of the whole exchange."

  fr.a2.unit20.lesson03.teach.line10:
    title: "Close the interview"
    gloss: "Inès says that's perfect, exactly what she was hoping for, and thanks him for the interview."
    note: "*C'est exactement ce que j'espérais* (that's exactly what I was hoping for) is a natural, warm way to close a successful interview."

exercises:
  fr.a2.unit20.lesson01.exercise01.read_job_posting:
    instruction: "According to the job posting, what does Pâtisserie Lefebvre ask candidates to have, besides motivation?"
    correct_option: "Good availability, including Saturdays"
    distractors: ["Five years of experience", "A university degree in business"]
    accepted_answers: ["Good availability, including Saturdays"]

  fr.a2.unit20.lesson01.exercise02.listen_disponible:
    instruction: "Listen and select the phrase you hear."
    correct_option: "disponible à partir du mois prochain"
    distractors: ["disponible à partir de la semaine prochaine", "disponible à partir d'aujourd'hui"]
    accepted_answers: ["disponible à partir du mois prochain"]

  fr.a2.unit20.lesson01.exercise03.match_interview_vocab:
    instruction: "Match each French interview word or phrase to its English meaning."
    correct_response:
      "postuler à": "to apply for"
      "un entretien d'embauche": "a job interview"
      "se présenter": "to introduce oneself"
      "l'expérience": "experience"
      "faire un stage": "to do an internship"
      "être disponible": "to be available"
      "un point fort": "a strength"
      "un(e) apprenti(e)": "an apprentice"

  fr.a2.unit20.lesson01.exercise04.order_je_suis_disponible:
    instruction: "Build the sentence: I am available starting next month."
    correct_response: ["Je", "suis", "disponible", "à", "partir", "du", "mois", "prochain"]

  fr.a2.unit20.lesson01.exercise05.fill_motivee:
    instruction: "Complete the sentence with the word for \"motivated\" (feminine)."
    accepted_answers: ["motivée"]

  fr.a2.unit20.lesson01.exercise06.translate_experience:
    instruction: "Translate: I have a little experience: I did a cooking workshop with a friend last year."
    accepted_answers:
      - "J'ai un peu d'expérience : j'ai suivi un atelier de cuisine avec un ami l'année dernière."
      - "J'ai un peu d'expérience. J'ai suivi un atelier de cuisine avec un ami l'année dernière."
      - "J'ai un peu d'expérience, j'ai suivi un atelier de cuisine avec un ami l'année dernière."
      - "J'ai un peu d'expérience : j'ai suivi un atelier de cuisine avec une amie l'année dernière."
      - "J'ai un peu d'expérience : j'ai fait un atelier de cuisine avec un ami l'année dernière."
      - "J'ai un peu d'expérience : j'ai fait un atelier de cuisine avec une amie l'année dernière."

  fr.a2.unit20.lesson02.exercise01.select_est_ce_que_je_pourrais:
    instruction: "Which phrase politely asks \"Could I...?\""
    correct_option: "Est-ce que je pourrais...?"
    distractors: ["poser une question", "sur le poste"]
    accepted_answers: ["Est-ce que je pourrais...?"]

  fr.a2.unit20.lesson02.exercise02.listen_il_faudrait_que:
    instruction: "Listen and select the phrase you hear."
    correct_option: "il faudrait que je sois disponible"
    distractors: ["il faudrait que je sois motivée", "il faudrait que je sois formée"]
    accepted_answers: ["il faudrait que je sois disponible"]

  fr.a2.unit20.lesson02.exercise03.match_formal_phrases:
    instruction: "Match each formal interview phrase to its English meaning."
    correct_response:
      "Est-ce que je pourrais...?": "Could I...?"
      "J'aimerais savoir si...": "I'd like to know if..."
      "il faudrait que": "it would be necessary that"
      "avant que": "before"
      "se former auprès de": "to train under, with"
      "un entretien d'embauche": "a job interview"
      "être disponible": "to be available"
      "un point fort": "a strength"

  fr.a2.unit20.lesson02.exercise04.order_il_faudrait_que_je_sois:
    instruction: "Build the sentence: It would be necessary for me to be available every morning."
    correct_response: ["Il", "faudrait", "que", "je", "sois", "disponible", "tous", "les", "matins"]

  fr.a2.unit20.lesson02.exercise05.fill_sois_subjunctive:
    instruction: "Complete the sentence with the subjunctive of être."
    accepted_answers: ["sois"]

  fr.a2.unit20.lesson02.exercise06.write_confirm_availability:
    instruction: "Write a short, formal message to Monsieur Lefebvre confirming that you are available to start next month."
    accepted_answers:
      - "Bonjour Monsieur Lefebvre, je suis disponible pour commencer le mois prochain. Merci."
      - "Bonjour Monsieur Lefebvre, je suis disponible pour commencer le mois prochain, merci."
      - "Bonjour Monsieur Lefebvre, je suis disponible pour commencer le mois prochain et je vous remercie."
      - "Bonjour Monsieur Lefebvre, je suis disponible à partir du mois prochain. Merci."
      - "Bonjour Monsieur, je suis disponible pour commencer le mois prochain. Merci."
      - "Je suis disponible pour commencer le mois prochain."
      - "Je suis disponible à partir du mois prochain."
      - "Bonjour Monsieur Lefebvre, je suis disponible pour commencer le mois prochain."
      - "Bonjour Monsieur Lefebvre, je suis disponible à partir du mois prochain."

  fr.a2.unit20.lesson03.exercise01.comprehend_first_experience:
    instruction: "Listen to the interview. What experience does Inès mention first?"
    correct_option: "A cooking workshop with a friend"
    distractors: ["A two-week bakery internship", "Two years of pastry school"]
    accepted_answers: ["A cooking workshop with a friend"]

  fr.a2.unit20.lesson03.exercise02.comprehend_sunday_availability:
    instruction: "According to Inès, what does she need in terms of availability?"
    correct_option: "To be free on Sundays to see her family"
    distractors: ["To work only mornings", "To have every weekend off"]
    accepted_answers: ["To be free on Sundays to see her family"]

  fr.a2.unit20.lesson03.exercise03.select_who_trains_her:
    instruction: "Who does Monsieur Lefebvre say will train Inès?"
    correct_option: "Monsieur Lefebvre himself, most of the time"
    distractors: ["Another baker on the team", "She will train herself"]
    accepted_answers: ["Monsieur Lefebvre himself, most of the time"]

  fr.a2.unit20.lesson03.exercise04.order_jai_fait_un_stage:
    instruction: "Build Inès's sentence about her internship."
    correct_response: ["j'ai", "fait", "un", "stage", "de", "deux", "semaines", "dans", "une", "boulangerie"]

  fr.a2.unit20.lesson03.exercise05.reply_describe_experience:
    instruction: "Take Inès's role. Say you've always been interested in pastry and recently did a cooking workshop with a friend that really made you want to go further."
    accepted_answers:
      - "Je me suis toujours intéressée à la pâtisserie, et j'ai récemment suivi un atelier de cuisine avec un ami qui m'a vraiment donné envie d'aller plus loin."
      - "Je me suis toujours intéressée à la pâtisserie. J'ai récemment suivi un atelier de cuisine avec un ami qui m'a vraiment donné envie d'aller plus loin."
      - "Je me suis toujours intéressée à la pâtisserie et j'ai récemment suivi un atelier de cuisine avec un ami qui m'a vraiment donné envie d'aller plus loin."
      - "Je me suis toujours intéressée à la pâtisserie, et j'ai récemment suivi un atelier de cuisine avec une amie qui m'a vraiment donné envie d'aller plus loin."
      - "Je me suis toujours intéressée à la pâtisserie. J'ai récemment suivi un atelier de cuisine avec une amie qui m'a vraiment donné envie d'aller plus loin."

  fr.a2.unit20.lesson03.exercise06.speak_explain_interest:
    instruction: "As Inès, say out loud that you're very motivated (or that the position really interests you), then use \"J'aimerais savoir\" to ask who your trainer would be or whether you'd also work weekends."
    accepted_answers:
      - "Je suis très motivée, et j'aimerais savoir qui serait mon formateur."
      - "Ce poste m'intéresse beaucoup, et j'aimerais savoir si je travaillerais aussi le week-end."
      - "Je suis très motivée, et j'aimerais savoir si je travaillerais aussi le week-end."
      - "Ce poste m'intéresse beaucoup, et j'aimerais savoir qui serait mon formateur."

  fr.a2.unit20.lesson01.exercise07.dictation_disponible_mois_prochain:
    instruction: "Type what you hear."
    correct_option: "Je suis disponible à partir du mois prochain, du lundi au samedi"
    accepted_answers: [{value: "Je suis disponible à partir du mois prochain, du lundi au samedi", status: correct}]
    orthography_strict: true
