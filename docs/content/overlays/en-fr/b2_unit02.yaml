course:
  title: French B2
  description: >-
    Upper-intermediate French: defend a position in a discussion, and
    speculate about causes and consequences with graded certainty -- say
    what may, might, must, or cannot be the case (present and past), and
    distinguish deduction from guesswork.

units:
  fr.b2.unit02.speculation:
    title: "Speculation"
    description: Speculate about causes and consequences with graded certainty -- say what may, might, must, or cannot be the case, in the present and the past, and distinguish deduction from guesswork.

lessons:
  fr.b2.unit02.lesson01.quel_degre_de_certitude:
    title: "How certain are you?"
  fr.b2.unit02.lesson02.deduction_il_doit_etre:
    title: "Deduction: he must be..."
  fr.b2.unit02.lesson03.possible_ou_impossible:
    title: "Possible or impossible?"
  fr.b2.unit02.lesson04.speculer_sur_le_passe:
    title: "Speculating about the past"
  fr.b2.unit02.lesson05.fait_ou_speculation:
    title: "Fact or speculation?"
  fr.b2.unit02.lesson06.speculer_dans_une_conversation:
    title: "Speculating in a conversation"

teaching:
  fr.b2.unit02.lesson01.teach.il:
    title: he
    gloss: he
    example_gloss: "He works at the bakery."
  fr.b2.unit02.lesson01.teach.nest_pas_encore_la:
    title: "He is not here yet."
    gloss: "He is not here yet."
    note: "*Encore* here means 'yet/still' inside a negation (*ne...pas encore* = 'not yet'). *Là* is 'there/here' -- used for presence, not location detail."
  fr.b2.unit02.lesson01.teach.peut_etre:
    title: "maybe / perhaps"
    gloss: "maybe / perhaps"
    note: "*Peut-être* is the weakest certainty marker in this unit's scale -- a bare guess with no particular reasoning behind it."
    example_gloss: "Maybe he is late."
  fr.b2.unit02.lesson01.teach.probablement:
    title: probably
    gloss: probably
    example_gloss: "Mathieu is probably late."
  fr.b2.unit02.lesson01.teach.sans_doute:
    title: "no doubt / probably"
    gloss: "no doubt / probably"
    note: "Despite its literal meaning ('without doubt'), everyday *sans doute* means 'probably' -- about as strong as *probablement*, not 'undoubtedly'. To say 'undoubtedly', French uses *sans aucun doute*."
    example_gloss: "No doubt, he'll arrive soon."
  fr.b2.unit02.lesson01.teach.certainement:
    title: certainly
    gloss: certainly
    example_gloss: "He is certainly going to arrive."
  fr.b2.unit02.lesson01.teach.deviner:
    title: "to guess"
    gloss: "to guess"
    note: "*Deviner* is pure guesswork with no evidence behind it -- contrast with *déduire* (to deduce), which this unit's *devoir*-constructions express instead."
    example_gloss: "I like guessing the answer."
  fr.b2.unit02.lesson01.teach.en_retard:
    title: late
    gloss: late
    example_gloss: "He is often late."
  fr.b2.unit02.lesson01.teach.claim_model:
    title: "Mathieu is not here yet. Maybe he is late."
    gloss: "Mathieu is not here yet. Maybe he is late."
  fr.b2.unit02.lesson01.teach.grammar_certitude:
    title: "Peut-être, probablement, sans doute, certainement: from least to most certain."
    gloss: "Peut-être, probablement, sans doute, certainement: from least to most certain."
    note: "This unit's certainty scale, weakest to strongest: *peut-être* (bare guess) < *probablement* / *sans doute* (about equally strong) < *certainement* (near total certainty). The grammar constructions in later lessons (devoir, pouvoir) layer onto this same scale."

  fr.b2.unit02.lesson02.teach.devoir:
    title: "he must be"
    gloss: "he must be (near-certain deduction)"
    note: "*Devoir + infinitive* expresses a near-certain deduction from evidence, not obligation. *Il doit être malade* = 'he must be sick' (I'm reasoning it out), not 'he has to be sick'."
    example_gloss: "He must be tired."
  fr.b2.unit02.lesson02.teach.fatigue:
    title: tired
    gloss: tired
    example_gloss: "He must be tired after the trip."
  fr.b2.unit02.lesson02.teach.malade:
    title: sick
    gloss: sick
    example_gloss: "He must be sick."
  fr.b2.unit02.lesson02.teach.logique:
    title: logical
    gloss: logical
    example_gloss: "That's logical."
  fr.b2.unit02.lesson02.teach.jamais:
    title: never
    gloss: never
    note: "*Ne...jamais* = 'never', the negative counterpart of *toujours* (always)."
    example_gloss: "He is never late."
  fr.b2.unit02.lesson02.teach.une_raison:
    title: "a reason"
    gloss: "a reason"
    example_gloss: "He has a good reason."
  fr.b2.unit02.lesson02.teach.claim_model:
    title: "He must be sick. That's logical, he is never late."
    gloss: "He must be sick. That's logical, he is never late."
  fr.b2.unit02.lesson02.teach.grammar_deduction:
    title: "Devoir + infinitive expresses a near-certain deduction: he must be sick (= I'm almost sure)."
    gloss: "Devoir + infinitive expresses a near-certain deduction: he must be sick (= I'm almost sure)."
    note: "Near-certain deduction reasons FROM evidence to a conclusion -- 'he's never late, so he must be sick' -- which is stronger than a bare guess (*peut-être*) but not stated as flat fact."

  fr.b2.unit02.lesson03.teach.pouvoir:
    title: "he may be"
    gloss: "he may / might be (simple possibility)"
    note: "*Pouvoir + infinitive* expresses a simple, open possibility -- weaker than *devoir*. *Il peut être en retard* = 'he might be late' (one possibility among others)."
    example_gloss: "He might be late."
  fr.b2.unit02.lesson03.teach.embouteillages:
    title: "traffic jam"
    gloss: "traffic jam"
    note: "*Dans les embouteillages* = 'in traffic' / 'stuck in traffic'."
    example_gloss: "He is stuck in traffic."
  fr.b2.unit02.lesson03.teach.ne_peut_pas:
    title: "he cannot be"
    gloss: "he cannot be (impossibility)"
    note: "*Ne pas pouvoir + infinitive* rules a possibility OUT entirely -- stronger than 'probably not'. Only use it when you have real evidence against it, as here: 'he's doing great, so he can't be sick'."
  fr.b2.unit02.lesson03.teach.va_tres_bien:
    title: "he is doing very well"
    gloss: "he is doing very well"
    note: "*Aller* (to go) is used idiomatically for health/state: *il va bien* = 'he is doing well', not a literal 'he goes well'."
    example_gloss: "He is doing very well today."
  fr.b2.unit02.lesson03.teach.claim_model:
    title: "He might be in traffic. He can't be sick, he's doing very well."
    gloss: "He might be in traffic. He can't be sick, he's doing very well."
  fr.b2.unit02.lesson03.teach.grammar_possibilite:
    title: "Pouvoir + infinitive expresses a simple possibility; ne pas pouvoir + infinitive rules a possibility out."
    gloss: "Pouvoir + infinitive expresses a simple possibility; ne pas pouvoir + infinitive rules a possibility out."
    note: "*Pouvoir* (affirmative) is genuinely weaker than *devoir* -- it just names one possibility among several, without committing to it being the most likely one."

  fr.b2.unit02.lesson04.teach.a_du:
    title: "he must have"
    gloss: "he must have (past deduction)"
    note: "*Dû* is the irregular past participle of *devoir* (don't confuse it with *du*, the partitive article -- the circumflex accent is the only difference in writing). *Il a dû oublier* = 'he must have forgotten'."
    example_gloss: "He must have forgotten."
  fr.b2.unit02.lesson04.teach.oublier:
    title: "to forget"
    gloss: "to forget"
    example_gloss: "He must have forgotten his phone."
  fr.b2.unit02.lesson04.teach.son_telephone:
    title: "his phone"
    gloss: "his phone"
  fr.b2.unit02.lesson04.teach.rater_le_bus:
    title: "to miss the bus"
    gloss: "to miss the bus"
    example_gloss: "He may have missed the bus."
  fr.b2.unit02.lesson04.teach.a_cause_de_la_circulation:
    title: "because of the traffic"
    gloss: "because of the traffic"
    note: "*À cause de* + noun gives the cause. *Prendre du retard* (*a pris du retard*) = to be delayed, to fall behind schedule: traffic delays the bus."
    example_gloss: "His bus may have been delayed because of the traffic."
  fr.b2.unit02.lesson04.teach.claim_model:
    title: "He must have forgotten his phone. He may have missed the bus."
    gloss: "He must have forgotten his phone. He may have missed the bus."
  fr.b2.unit02.lesson04.teach.grammar_passe:
    title: "Avoir dû + infinitive expresses a past deduction: he must have forgotten (= I'm almost sure he forgot)."
    gloss: "Avoir dû + infinitive expresses a past deduction: he must have forgotten (= I'm almost sure he forgot)."
    note: "*Il a peut-être raté le bus* (weaker: he MAY have missed the bus) uses *peut-être* directly with the passé composé, rather than a special construction -- simpler than the *devoir*-based pattern, but still past-tense speculation."

  fr.b2.unit02.lesson05.teach.texte:
    title: "Reading: why is Mathieu late?"
    gloss: "Mathieu is not here yet this morning. Maybe he is late, or he must have forgotten his phone. His colleague thinks he missed the bus. In fact, Mathieu calls: his bike got a flat tire on the way!"
    glosses:
      ce: "this"
      matin: morning
      sa: "his / her"
      collègue: colleague
      ou: or
      fait: "fact (en fait = in fact)"
      appelle: "calls (from appeler)"
      vélo: bike
      crevé: "got a flat tire (from crever)"
      chemin: "way / path (en chemin = on the way)"

  fr.b2.unit02.lesson06.teach.tu_as_raison:
    title: "You're right."
    gloss: "You're right."
    note: "*Avoir raison* = 'to be right' (literally 'to have reason') -- reusing the *raison* taught in lesson02, now in the fixed idiom *avoir raison*."
  fr.b2.unit02.lesson06.teach.ah:
    title: "Ah!"
    gloss: "Ah! / Oh!"
  fr.b2.unit02.lesson06.teach.ca_peut_etre_ca:
    title: "That could be it."
    gloss: "That could be it. (literally: that can be that)"
  fr.b2.unit02.lesson06.teach.dialogue_ines_claim:
    title: "Inès: Mathieu is not here yet. Maybe he is late."
    gloss: "Inès: Mathieu is not here yet. Maybe he is late."
  fr.b2.unit02.lesson06.teach.dialogue_collegue_deduction:
    title: "Colleague: He must be sick. He is never late."
    gloss: "Colleague: He must be sick. He is never late."
  fr.b2.unit02.lesson06.teach.dialogue_ines_alternative:
    title: "Inès: Or his bus may have been delayed because of the traffic."
    gloss: "Inès: Or his bus may have been delayed because of the traffic."
  fr.b2.unit02.lesson06.teach.dialogue_collegue_agree:
    title: "Colleague: You're right, that could be it. Ah, he's calling!"
    gloss: "Colleague: You're right, that could be it. Ah, he's calling!"
  fr.b2.unit02.lesson06.teach.dialogue_ines_resolution:
    title: "Inès: Ah, his bike got a flat tire on the way."
    gloss: "Inès: Ah, his bike got a flat tire on the way."
  fr.b2.unit02.lesson06.teach.grammar_certitude_graduee:
    title: "He must be sick (near-certain). He might be in traffic (simple possibility). He can't be sick (impossible). He must have forgotten his phone (past deduction)."
    gloss: "He must be sick (near-certain). He might be in traffic (simple possibility). He can't be sick (impossible). He must have forgotten his phone (past deduction)."
    note: "This lesson's dialogue puts the whole certainty scale to work in one natural exchange: a near-certain present deduction, a weaker alternative, and a graceful concession (*ça peut être ça*) when new evidence arrives."

exercises:
  fr.b2.unit02.lesson01.exercise01.recognize_peut_etre:
    instruction: "What does this word mean?"
    correct_option: "maybe / perhaps"
    distractors: [certainly, never, "in addition"]
    accepted_answers: [{value: "maybe / perhaps", status: correct}]
    feedback: "Peut-être means maybe / perhaps -- the weakest certainty marker in this unit."
  fr.b2.unit02.lesson01.exercise02.listen_claim:
    instruction: "Listen and select what you hear."
    correct_option: "Mathieu is not here yet. Maybe he is late."
    distractors: ["Mathieu is not here yet. He is definitely late.", "Mathieu is here. Maybe he is late.", "Mathieu is not here yet. He is probably sick."]
    accepted_answers: [{value: "Mathieu is not here yet. Maybe he is late.", status: correct}]
    feedback: "Mathieu n'est pas encore là. Il est peut-être en retard means Mathieu is not here yet. Maybe he is late."
  fr.b2.unit02.lesson01.exercise03.match_certainty_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {il: he, "Il n'est pas encore là.": "He is not here yet.", "peut-être": "maybe / perhaps", probablement: probably, "en retard": late, certainement: certainly, deviner: "to guess"}
        status: correct
    feedback: "These are this lesson's certainty-marking words."
  fr.b2.unit02.lesson01.exercise04.order_claim:
    instruction: "Put the words in order: He is maybe late."
    accepted_answers:
      - {value: "Il est peut-être en retard", status: correct}
    feedback: "Il est peut-être en retard means maybe he is late."
  fr.b2.unit02.lesson01.exercise05.translate_probablement:
    instruction: "Translate into French: Mathieu is probably late."
    accepted_answers:
      - {value: "Mathieu est probablement en retard", status: correct}
      - {value: "Mathieu est sans doute en retard", status: correct}
    feedback: "Mathieu est probablement en retard means Mathieu is probably late."
  fr.b2.unit02.lesson01.exercise06.speak_peut_etre:
    instruction: "Say aloud in French: Maybe he is late."
    accepted_answers:
      - {value: "Il est peut-être en retard", status: correct}
      - {value: "Peut-être qu'il est en retard", status: correct}
    feedback: "Il est peut-être en retard means maybe he is late."
  fr.b2.unit02.lesson01.exercise07.write_pas_encore_la:
    instruction: "Write in French: Mathieu is not here yet."
    accepted_answers:
      - {value: "Mathieu n'est pas encore là", status: correct}
    feedback: "Mathieu n'est pas encore là means Mathieu is not here yet."
  fr.b2.unit02.lesson01.exercise08.dictation_claim:
    instruction: "Type what you hear."
    correct_response: "Mathieu n'est pas encore là. Il est peut-être en retard"
    orthography_strict: true
    feedback: "You heard Mathieu n'est pas encore là. Il est peut-être en retard — Mathieu is not here yet. Maybe he is late."

  fr.b2.unit02.lesson02.exercise01.recognize_doit:
    instruction: "What does this word mean?"
    correct_option: sick
    distractors: [tired, logical, never]
    accepted_answers: [{value: sick, status: correct}]
    feedback: "Malade means sick."
  fr.b2.unit02.lesson02.exercise02.listen_doit_etre_malade:
    instruction: "Listen and select what you hear."
    correct_option: "He must be sick. That's logical, he is never late."
    distractors: ["He might be sick. That's logical, he is never late.", "He must be tired. That's logical, he is never late.", "He must be sick. That's strange, he is never late."]
    accepted_answers: [{value: "He must be sick. That's logical, he is never late.", status: correct}]
    feedback: "Il doit être malade. C'est logique, il n'est jamais en retard means he must be sick. That's logical, he is never late."
  fr.b2.unit02.lesson02.exercise03.match_deduction_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"il doit": "he must (be)", fatigué: tired, malade: sick, logique: logical, jamais: never, "une raison": "a reason"}
        status: correct
    feedback: "These are this lesson's present-deduction words."
  fr.b2.unit02.lesson02.exercise04.order_doit_etre_malade:
    instruction: "Put the words in order: He must be sick."
    accepted_answers:
      - {value: "Il doit être malade", status: correct}
    feedback: "Il doit être malade means he must be sick."
  fr.b2.unit02.lesson02.exercise05.translate_doit_etre:
    instruction: "Translate into French: Mathieu must be sick."
    accepted_answers:
      - {value: "Mathieu doit être malade", status: correct}
    feedback: "Mathieu doit être malade means Mathieu must be sick."
  fr.b2.unit02.lesson02.exercise06.write_logique:
    instruction: "Write in French: That's logical, he is never late."
    accepted_answers:
      - {value: "C'est logique, il n'est jamais en retard", status: correct}
      - {value: "C'est logique. Il n'est jamais en retard.", status: correct}
    feedback: "C'est logique, il n'est jamais en retard means that's logical, he is never late."
  fr.b2.unit02.lesson02.exercise07.write_bonne_raison:
    instruction: "Write in French: He must have a good reason."
    accepted_answers:
      - {value: "Il doit avoir une bonne raison", status: correct}
    feedback: "Il doit avoir une bonne raison means he must have a good reason."
  fr.b2.unit02.lesson02.exercise08.dictation_doit_etre_malade:
    instruction: "Type what you hear."
    correct_response: "Il doit être malade. C'est logique, il n'est jamais en retard"
    orthography_strict: true
    feedback: "You heard Il doit être malade. C'est logique, il n'est jamais en retard — he must be sick. That's logical, he is never late."

  fr.b2.unit02.lesson03.exercise01.recognize_embouteillages:
    instruction: "What does this word mean?"
    correct_option: "traffic jam"
    distractors: ["a reason", tiredness, "a phone call"]
    accepted_answers: [{value: "traffic jam", status: correct}]
    feedback: "Les embouteillages means traffic jam."
  fr.b2.unit02.lesson03.exercise02.listen_embouteillages:
    instruction: "Listen and select what you hear."
    correct_option: "He might be in traffic."
    distractors: ["He is definitely in traffic.", "He might be at home.", "He might be sick."]
    accepted_answers: [{value: "He might be in traffic.", status: correct}]
    feedback: "Il peut être dans les embouteillages means he might be in traffic."
  fr.b2.unit02.lesson03.exercise03.match_possibility_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"il peut": "he may / might be", "les embouteillages": "traffic jam", "il ne peut pas": "he cannot be", "il va très bien": "he is doing very well", "peut-être": "maybe / perhaps", malade: sick}
        status: correct
    feedback: "These are this lesson's possibility and impossibility words."
  fr.b2.unit02.lesson03.exercise04.order_embouteillages:
    instruction: "Put the words in order: He might be in traffic."
    accepted_answers:
      - {value: "Il peut être dans les embouteillages", status: correct}
    feedback: "Il peut être dans les embouteillages means he might be in traffic."
  fr.b2.unit02.lesson03.exercise05.translate_ne_peut_pas:
    instruction: "Translate into French: He cannot be sick."
    accepted_answers:
      - {value: "Il ne peut pas être malade", status: correct}
    feedback: "Il ne peut pas être malade means he cannot be sick."
  fr.b2.unit02.lesson03.exercise06.speak_embouteillages:
    instruction: "Say aloud in French, using pouvoir: He might be in traffic."
    accepted_answers:
      - {value: "Il peut être dans les embouteillages", status: correct}
    feedback: "Il peut être dans les embouteillages means he might be in traffic."
  fr.b2.unit02.lesson03.exercise07.write_va_tres_bien:
    instruction: "Write in French: He can't be sick, he's doing very well."
    accepted_answers:
      - {value: "Il ne peut pas être malade, il va très bien", status: correct}
      - {value: "Il ne peut pas être malade. Il va très bien.", status: correct}
    feedback: "Il ne peut pas être malade, il va très bien means he can't be sick, he's doing very well."

  fr.b2.unit02.lesson04.exercise01.recognize_telephone:
    instruction: "What does this word mean?"
    correct_option: phone
    distractors: [bus, traffic, reason]
    accepted_answers: [{value: phone, status: correct}]
    feedback: "Le téléphone means the phone."
  fr.b2.unit02.lesson04.exercise02.listen_a_du_oublier:
    instruction: "Listen and select what you hear."
    correct_option: "He must have forgotten his phone."
    distractors: ["He might have forgotten his phone.", "He must have forgotten his keys.", "He must have lost his phone."]
    accepted_answers: [{value: "He must have forgotten his phone.", status: correct}]
    feedback: "Il a dû oublier son téléphone means he must have forgotten his phone."
  fr.b2.unit02.lesson04.exercise03.match_past_speculation_words:
