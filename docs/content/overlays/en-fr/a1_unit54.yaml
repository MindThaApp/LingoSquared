teaching:
  fr.a1.unit54.lesson01.teach.l_animal_un:
    title: Animal, a pet
    gloss: the animal / a pet
    note: '*Un animal* is the general word; *un animal de compagnie* (literally ''an animal of company'') means specifically a pet.'
    example_gloss:
    - A dog is an animal.
    - A dog is also a pet.
  fr.a1.unit54.lesson01.teach.le_chien_le:
    title: Dog and cat
    gloss: the dog / the cat
    example_gloss:
    - Camille has a dog.
    - Thomas has a cat.
  fr.a1.unit54.lesson01.teach.le_poisson_l:
    title: Fish and bird
    gloss: the fish / the bird
    example_gloss:
    - Grandpa has a fish.
    - Nina has a bird.
  fr.a1.unit54.lesson01.teach.tu_as_un:
    title: Do you have a pet?
    gloss: Do you have a pet?
    note: The same *Tu as ... ?* question pattern you already know from earlier units.
  fr.a1.unit54.lesson01.teach.oui_j_ai:
    title: Yes, I have a dog
    gloss: Yes, I have a dog.
    note: A simple affirmative answer using this unit's new vocabulary.
  fr.a1.unit54.lesson01.teach.non_je_n:
    title: No, I don't have a pet
    gloss: No, I don't have a pet.
    note: '*Pas d''* replaces *un* after a negative: *Je n''ai pas d''animal de compagnie.* See the grammar note.'
  fr.a1.unit54.lesson01.teach.apres_ne_pas:
    title: 'Pas de: negating un/une/des'
    gloss: After *ne ... pas*, *un*, *une* and *des* become *de* or *d'*, as in *Je n'ai pas de temps* (which you already know) and here *Je n'ai pas d'animal de compagnie*.
    note: 'This reuses the pattern already taught for *Je n''ai pas de temps*: not new grammar, just a new noun to apply it to.'
  fr.a1.unit54.lesson02.teach.promener:
    title: To walk (an animal)
    gloss: to walk (an animal)
    note: '*Promener* (to take for a walk) is a regular *-er* verb; see the grammar note.'
    example_gloss: I walk the dog every day.
  fr.a1.unit54.lesson02.teach.promener_est_un:
    title: Promener is a regular -er verb
    gloss: '*Promener* is a regular *-er* verb, like *cuisiner*: *je promène, tu promènes, il promène le chien*. The accent on the *e* shows it is pronounced.'
    note: The verb always stays in one piece, as with the other *-er* verbs you already know.
  fr.a1.unit54.lesson02.teach.donner_a_manger:
    title: To feed
    gloss: to feed
    example_gloss: I feed the cat every day.
  fr.a1.unit54.lesson02.teach.jouer_avec:
    title: To play with
    gloss: to play with
    example_gloss: Thomas plays with his cat.
  fr.a1.unit54.lesson02.teach.je_promene_le:
    title: I walk the dog every day
    gloss: I walk the dog every day.
    note: Combines *promener* with *tous les jours* (every day), already known from an earlier unit.
  fr.a1.unit54.lesson02.teach.je_donne_a:
    title: I feed the cat every day
    gloss: I feed the cat every day.
    note: Combines *donner à manger* (literally 'to give to eat') with *tous les jours*.
  fr.a1.unit54.lesson03.teach.au_pluriel_on:
    title: 'Plural: chien -> chiens'
    gloss: 'The plural usually adds an *s* you cannot hear: *chien -> chiens*, *chat -> chats*. Nouns in *-al* change to *-aux*: *animal -> animaux*.'
    note: The regular French plural pattern, introduced here for the first time with animal nouns as the example set.
  fr.a1.unit54.lesson03.teach.chiens_chats:
    title: Dogs and cats
    gloss: dogs / cats
    example_gloss:
    - Mathieu loves dogs.
    - Léa loves cats.
  fr.a1.unit54.lesson03.teach.poissons_oiseaux:
    title: Fish and birds (plural)
    gloss: fish (plural) / birds
    example_gloss:
    - I love fish.
    - Grandpa loves birds.
  fr.a1.unit54.lesson03.teach.j_adore_les:
    title: I love animals
    gloss: I love animals.
    note: '*Adorer* (to love) is followed directly by the noun, and a general taste takes *les*: *J''adore les animaux.*'
  fr.a1.unit54.lesson03.teach.lea_adore_les:
    title: Léa loves cats, but has no pet
    gloss: Léa loves cats, but she doesn't have a pet.
    note: Sets up the contrast lesson05's reading is built around.
  fr.a1.unit54.lesson04.teach.mathieu_tu_as:
    title: Mathieu asks about a pet
    gloss: 'Mathieu: Do you have a pet, Camille?'
  fr.a1.unit54.lesson04.teach.camille_oui_j:
    title: Camille has a dog
    gloss: 'Camille: Yes, I have a dog.'
  fr.a1.unit54.lesson04.teach.mathieu_comment_est:
    title: Mathieu asks what it looks like
    gloss: 'Mathieu: What does he look like?'
    note: Reuses *Comment est-il ?* from the appearance unit, now asked about an animal.
  fr.a1.unit54.lesson04.teach.camille_il_a:
    title: Camille describes her dog
    gloss: 'Camille: He has brown hair and he''s small.'
    note: Reuses hair-color and size vocabulary from the appearance unit, now describing an animal's fur instead of a person's hair.
  fr.a1.unit54.lesson04.teach.il_et_le:
    title: Il/le for animals
    gloss: '*Il* (he) and *le* (him) can also be used for a male animal, not only for a person.'
    note: Every earlier use of *il* and *le* in this course referred to a person; this flags the extension to animals explicitly.
  fr.a1.unit54.lesson04.teach.mathieu_tu_le:
    title: Mathieu asks about walks
    gloss: 'Mathieu: Do you walk him every day?'
  fr.a1.unit54.lesson04.teach.camille_oui_je:
    title: Camille describes her routine
    gloss: 'Camille: Yes, I walk him every day and I feed him.'
  fr.a1.unit54.lesson05.teach.mathieu_et_lea:
    title: Mathieu, Léa, and Thomas on animals
    gloss: 'Mathieu and Léa both love animals, but neither of them has a pet. Mathieu loves dogs and Léa loves cats. Thomas does have a pet: a cat. He often plays with his cat and feeds the cat every day. Do you have a pet?'
    note: Contrasts loving an animal with actually owning one -- the outcome's own communicative point.
    glosses:
      adorent: love
      tous: both
      animaux: animals
      deux: both
      compagnie: pet
      chiens: dogs
      chats: cats
      chat: cat
      joue: plays
      donne: gives
      chaque: every
      manger: food
  fr.a1.unit54.lesson05.teach.thomas_joue_souvent:
    title: Thomas often plays with his cat
    gloss: Thomas often plays with his cat.
    note: '*Souvent* (often) sits right after the verb, as in the earlier routines.'
  fr.a1.unit54.lesson05.teach.j_adore_les:
    title: I love dogs. I don't have a pet.
    gloss: I love dogs. I don't have a pet.
    note: A model two-sentence answer, ready to reuse for the unit's writing prompt.
  fr.a1.unit54.lesson06.teach.camille_nina_tu:
    title: Camille asks Nina
    gloss: 'Camille: Nina, do you have a pet too?'
  fr.a1.unit54.lesson06.teach.nina_oui_j:
    title: Nina has a bird named Pico
    gloss: 'Nina: Yes, I have a bird. His name is Pico.'
    note: '*Il s''appelle* (his name is) reuses the introduction verb from the very first unit.'
  fr.a1.unit54.lesson06.teach.mathieu_comme_c:
    title: Mathieu reacts
    gloss: 'Mathieu: How nice! What do you do with him every day?'
  fr.a1.unit54.lesson06.teach.nina_je_lui:
    title: Nina feeds him every day
    gloss: 'Nina: I feed him every day.'
  fr.a1.unit54.lesson06.teach.mathieu_j_adore:
    title: Mathieu loves birds too
    gloss: 'Mathieu: I love birds too.'
  fr.a1.unit54.lesson06.teach.camille_c_est:
    title: Camille closes the conversation
    gloss: 'Camille: Nice that the three of us love animals!'
    note: Closes the loop across all three characters' animal facts from this unit.
