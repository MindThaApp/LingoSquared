answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A1
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation or liaison marks.

course:
  title: "French A1"
  description: >-
    Immediate and extended family vocabulary, the mon/ma/mes possessive-
    adjective system, and describing a household, continuing Inès and
    Mathieu's cooking-workshop narrative from units 01-02. English-specific
    guidance highlights that French possessives agree with the noun's
    gender, not the owner's.

units:
  fr.a1.unit03.family:
    title: "Inès and Mathieu's families"

lessons:
  fr.a1.unit03.lesson01.immediate_family:
    title: "Close family"
  fr.a1.unit03.lesson02.possessives_mon_ma_mes:
    title: "Possessives: mon, ma, mes"
  fr.a1.unit03.lesson03.extended_family:
    title: "Extended family"
  fr.a1.unit03.lesson04.describing_family_size:
    title: "How many are at home"
  fr.a1.unit03.lesson05.reading_a_family_profile:
    title: "Reading a family profile"
  fr.a1.unit03.lesson06.family_photos_dialogue:
    title: "Family photos with Inès and Mathieu"

teaching:
  fr.a1.unit03.lesson01.teach.mere:
    title: "Mother"
    gloss: "mother"
    note: "*Mère* is feminine. *Maman* is the more common everyday word among family, while *mère* is neutral and used in this course's vocabulary lists."
  fr.a1.unit03.lesson01.teach.pere:
    title: "Father"
    gloss: "father"
    note: "*Père* is masculine. *Papa* is the everyday equivalent, parallel to *mère*/*maman*."
  fr.a1.unit03.lesson01.teach.frere:
    title: "Brother"
    gloss: "brother"
    note: "*Frère* is masculine singular."
  fr.a1.unit03.lesson01.teach.soeur:
    title: "Sister"
    gloss: "sister"
    note: "*Sœur* is feminine singular. The œ ligature is a single letter in French spelling, not two separate letters."
  fr.a1.unit03.lesson01.teach.fils:
    title: "Son"
    gloss: "son"
    note: "*Fils* is masculine; note the silent final s is actually pronounced here (an exception), while the l is silent."
  fr.a1.unit03.lesson01.teach.fille:
    title: "Daughter"
    gloss: "daughter"
    note: "*Fille* is feminine singular; the same word also means \"girl\" in other contexts."
  fr.a1.unit03.lesson01.teach.parents:
    title: "Parents"
    gloss: "parents"
    note: "*Parents* is masculine plural, covering a mother-and-father pair together."
  fr.a1.unit03.lesson01.teach.freres_et_soeurs:
    title: "Siblings"
    gloss: "brothers and sisters; siblings"
    note: >-
      French has no single gender-neutral word for "siblings" the way
      Spanish's hermanos or a masculine-plural-covers-mixed-groups rule
      would -- *frères et sœurs* spells out both explicitly.

  fr.a1.unit03.lesson02.teach.ma_mere:
    title: "My mother"
    gloss: "my mother"
    note: "*Ma* is the feminine singular possessive \"my,\" used because *mère* is feminine."
  fr.a1.unit03.lesson02.teach.mon_pere:
    title: "My father"
    gloss: "my father"
    note: "*Mon* is the masculine singular possessive \"my,\" used because *père* is masculine."
  fr.a1.unit03.lesson02.teach.mes_freres_et_soeurs:
    title: "My siblings"
    gloss: "my siblings"
    note: >-
      *Mes* is the plural possessive "my," used for any plural noun
      regardless of gender -- the same agreement pattern as *ma*/*mon* but for
      number rather than gender.
  fr.a1.unit03.lesson02.teach.as_tu_des_freres_et_soeurs:
    title: "Ask about siblings"
    gloss: "Do you have siblings?"
    note: "*As-tu* is the inverted question form of *tu as* (you have), a common A1 question pattern."
  fr.a1.unit03.lesson02.teach.jai_deux_soeurs:
    title: "State the number of siblings"
    gloss: "I have two sisters."
    note: "*J'ai* (I have) combined with a number and the family noun is the standard way to describe siblings."
  fr.a1.unit03.lesson02.teach.ta_famille_est_grande:
    title: "Ask if a family is large"
    gloss: "Is your family big?"
    note: "*Ta* is the feminine singular informal possessive \"your,\" agreeing with the feminine noun *famille*."
  fr.a1.unit03.lesson02.teach.ma_famille_est_petite:
    title: "Describe a small family"
    gloss: "My family is small."
    note: >-
      *Petite* agrees with the feminine noun *famille*; the masculine form
      *petit* would appear with a masculine noun instead. Note this is a
      genuinely different agreement axis from *mon*/*ma*/*mes*, which agrees
      with the noun too but marks POSSESSION rather than describing a
      quality.

  fr.a1.unit03.lesson03.teach.grand_pere:
    title: "Grandfather"
    gloss: "grandfather"
    note: "*Grand-père* is a hyphenated compound, masculine."
  fr.a1.unit03.lesson03.teach.grand_mere:
    title: "Grandmother"
    gloss: "grandmother"
    note: "*Grand-mère* is a hyphenated compound, feminine. Note *grand-* stays invariant here rather than agreeing as *grande-mère*."
  fr.a1.unit03.lesson03.teach.grands_parents:
    title: "Grandparents"
    gloss: "grandparents"
    note: "*Grands-parents* pluralizes both parts of the compound (*grands*, not *grand-*), unlike *grand-mère*/*grand-père*, which don't pluralize the *grand-* part in the singular forms."
  fr.a1.unit03.lesson03.teach.oncle:
    title: "Uncle"
    gloss: "uncle"
    note: "*Oncle* is masculine."
  fr.a1.unit03.lesson03.teach.tante:
    title: "Aunt"
    gloss: "aunt"
    note: "*Tante* is feminine."
  fr.a1.unit03.lesson03.teach.cousin:
    title: "Cousin (male)"
    gloss: "cousin (male)"
    note: "*Cousin* is masculine singular; unlike English \"cousin,\" French marks the cousin's gender."
  fr.a1.unit03.lesson03.teach.cousine:
    title: "Cousin (female)"
    gloss: "cousin (female)"
    note: "*Cousine* is feminine singular, formed by adding -e to *cousin*."
  fr.a1.unit03.lesson03.teach.mes_grands_parents:
    title: "My grandparents"
    gloss: "my grandparents"
    note: "*Mes* is used because *grands-parents* is plural, regardless of the fact that the compound contains both a masculine and (implicitly) feminine member."

  fr.a1.unit03.lesson04.teach.combien_de_freres_et_soeurs:
    title: "Ask how many siblings"
    gloss: "How many siblings do you have?"
    note: "*Combien de* (how many, of) precedes the noun directly in French, without an equivalent of English \"do.\""
  fr.a1.unit03.lesson04.teach.on_est_cinq:
    title: "State household size"
    gloss: "There are six of us at home."
    note: >-
      *On est* (literally "one is," but functioning as an informal "we
      are") is the natural, very common way to state total household size
      in spoken French -- *nous sommes* is more formal/written.
  fr.a1.unit03.lesson04.teach.ma_famille_est_grande:
    title: "Describe a large family"
    gloss: "My family is big."
    note: "*Grande* agrees with the feminine noun *famille*; the masculine form *grand* would appear with a masculine noun instead."
  fr.a1.unit03.lesson04.teach.jai_beaucoup_de_cousins:
    title: "State you have many cousins"
    gloss: "I have many cousins."
    note: "*Beaucoup de* (a lot of) precedes the noun; *de* does not become *du*/*des* here because *beaucoup* already quantifies it."
  fr.a1.unit03.lesson04.teach.tu_habites_pres_de_tes_parents:
    title: "Ask about living near parents"
    gloss: "Do you live near your parents?"
    note: "*Tes* is the plural informal possessive \"your,\" required because *parents* is plural."
  fr.a1.unit03.lesson04.teach.jhabite_avec_mes_grands_parents:
    title: "State who you live with"
    gloss: "I live with my grandparents."
    note: "*Avec* (with) introduces the people someone lives with; *j'habite* is the *je* form of *habiter*, already seen in unit01's *j'habite à Montreuil*."

  fr.a1.unit03.lesson05.teach.profile_reading:
    title: "Inès's family profile"
    gloss: >-
      My name is Inès. I'm thirty-one and I live with my grandparents in
      Paris. My mother and father live in Lille. I have two sisters and a
      brother: there are six of us at home. My younger sister is named
      Camille and she's twenty.
    note: >-
      This profile reuses vocabulary and structures from lessons01-04 in a
      connected short text rather than isolated sentences, the same who-is-
      who reading skill this unit's reading assessment focuses on.
    glosses:
      trente: "thirty"
      ans: "years old"
      grands-parents: "grandparents"
      mère: "mother"
      père: "father"
      habitent: "live (from habiter)"
      deux: "two"
      sœurs: "sisters"
      frère: "brother"
      six: "six"
      maison: "home"
      petite: "younger / little"
      sœur: "sister"
      vingt: "twenty"
  fr.a1.unit03.lesson05.teach.petite_soeur:
    title: "Younger/little sister"
    gloss: "younger sister; little sister"
    note: "*Petite* (feminine of *petit*) precedes the noun here, as most short, common French adjectives do, unlike most adjectives which follow the noun."
  fr.a1.unit03.lesson05.teach.habite_third_person:
    title: "Lives (third person)"
    gloss: "lives"
    note: "*Habite* is the third-person singular form of *habiter*, used to talk ABOUT someone (*Inès habite...*) rather than as themselves (*j'habite*, seen in unit01/lesson04 of this unit)."
  fr.a1.unit03.lesson05.teach.ses_third_person_plural:
    title: "Her/his/their (plural noun)"
    gloss: "her/his/their"
    note: >-
      *Ses* is the plural of *sa*/*son*, used the same way *sa*/*son* covers
      "her/his" for a singular noun -- *ses grands-parents* means "her
      grandparents" when talking about Inès in the third person.
  fr.a1.unit03.lesson05.teach.a_third_person_avoir:
    title: "Has (third person)"
    gloss: "has"
    note: >-
      *A* is the third-person singular form of *avoir*, used to talk ABOUT
      someone (*elle a vingt ans*) rather than as themselves (*j'ai* / *as-tu*,
      seen throughout lessons02-04 of this unit).

  fr.a1.unit03.lesson06.teach.line01:
    title: "Show family photos"
    gloss: "Inès shows Mathieu a photo, introducing her parents and her younger sister."
    note: "*Voici* (here is/are) introduces something being pointed to, a natural phrase for showing a photo."
  fr.a1.unit03.lesson06.teach.line02:
    title: "React and ask about siblings"
    gloss: "Mathieu reacts warmly and asks if she has other siblings."
    note: "*C'est adorable* is a natural, warm reaction to seeing a photo of a young sibling."
  fr.a1.unit03.lesson06.teach.line03:
    title: "State household size and return the question"
    gloss: "Inès says she has two sisters and a brother -- six at home -- then asks about Mathieu's family."
    note: "*On est six à la maison* states total household size, continuing lesson04's pattern."
  fr.a1.unit03.lesson06.teach.line04:
    title: "Describe a smaller family"
    gloss: "Mathieu says his family is smaller -- just three: his parents and him -- but he has many cousins."
    note: "*Mais* (but) signals the contrast between a small immediate family and many extended relatives."
  fr.a1.unit03.lesson06.teach.line05:
    title: "Ask about proximity to parents"
    gloss: "Inès asks if Mathieu lives near his parents."
    note: "*Près de* (near) is a common way to describe physical proximity."
  fr.a1.unit03.lesson06.teach.line06:
    title: "Explain distance and staying in touch"
    gloss: "Mathieu says no, they live in Lyon, and they talk by phone every week."
    note: "Continues unit01's established fact that Mathieu is from Lyon -- his parents remain there while he lives in Saint-Ouen."
  fr.a1.unit03.lesson06.teach.line07:
    title: "Empathize and share your own situation"
    gloss: "Inès says she understands, and that she lives with her grandparents here in Paris."
    note: "*Je comprends* (I understand) is a natural, brief way to acknowledge what someone just shared before adding your own related detail."
  fr.a1.unit03.lesson06.teach.line08:
    title: "Close with a warm remark"
    gloss: "Mathieu says it's nice to have family close by."
    note: "*C'est bien d'avoir sa famille près de soi* closes the exchange on a warm, reflective note, echoing lesson04's *près de* pattern."

exercises:
  fr.a1.unit03.lesson01.exercise01.select_mere:
    instruction: "Which word means mother?"
    correct_option: "mère"
    distractors: ["père", "sœur"]
    accepted_answers: ["mère"]

  fr.a1.unit03.lesson01.exercise02.select_soeur:
    instruction: "Which word means sister?"
    correct_option: "sœur"
    distractors: ["frère", "fille"]
    accepted_answers: ["sœur"]

  fr.a1.unit03.lesson01.exercise03.match_family_words:
    instruction: "Match each French word to its English meaning."
    correct_response:
      mère: "mother"
      père: "father"
      frère: "brother"
      sœur: "sister"
      fils: "son"
      fille: "daughter"

  fr.a1.unit03.lesson01.exercise04.listen_mere:
    instruction: "Listen and select the word you hear."
    correct_option: "mère"
    distractors: ["père", "sœur"]
    accepted_answers: ["mère"]

  fr.a1.unit03.lesson01.exercise05.listen_pere:
    instruction: "Listen and select the word you hear."
    correct_option: "père"
    distractors: ["mère", "frère"]
    accepted_answers: ["père"]

  fr.a1.unit03.lesson01.exercise06.order_parents:
    instruction: "Which word means parents?"
    correct_response: ["parents"]

  fr.a1.unit03.lesson01.exercise07.check_freres_et_soeurs:
    instruction: "Complete the plural phrase for brother and sister together."
    accepted_answers: ["sœurs"]
    feedback: "*Frères et sœurs* spells out both genders explicitly; French has no single word covering mixed siblings the way some other languages do."

  fr.a1.unit03.lesson01.exercise08.speak_own_siblings:
    instruction: "Answer the question: say that you have a brother or a sister."
    accepted_answers:
      - "J'ai un frère."
      - "J'ai une sœur."

  fr.a1.unit03.lesson02.exercise01.select_ma_mere:
    instruction: "Which phrase means \"my mother\"?"
    correct_option: "Ma mère"
    distractors: ["Mon père", "Ta mère"]
    accepted_answers: ["Ma mère"]

  fr.a1.unit03.lesson02.exercise02.match_possessives:
    instruction: "Match each possessive phrase to its meaning."
    correct_response:
      "Ma mère": "my mother (feminine noun)"
      "Mon père": "my father (masculine noun)"
      "Mes frères et sœurs": "my siblings (plural noun)"

  fr.a1.unit03.lesson02.exercise03.listen_as_tu_freres:
    instruction: "Listen and select the question you hear."
    correct_option: "As-tu des frères et sœurs ?"
    distractors: ["Ta famille est grande ?", "Quel âge as-tu ?"]
    accepted_answers: ["As-tu des frères et sœurs ?", "As-tu des frères et sœurs"]

  fr.a1.unit03.lesson02.exercise04.order_jai_deux_soeurs:
    instruction: "Build the sentence: I have two sisters."
    correct_response: ["J'ai", "deux", "sœurs"]

  fr.a1.unit03.lesson02.exercise05.listen_type_jai_deux_soeurs:
    instruction: "Type the sentence you hear."
    accepted_answers:
      - "J'ai deux sœurs."
      - "J'ai deux sœurs"

  fr.a1.unit03.lesson02.exercise06.reply_as_tu_freres:
    instruction: "Answer that you have two sisters."
    accepted_answers:
      - "J'ai deux sœurs."
      - "J'ai deux sœurs"

  fr.a1.unit03.lesson02.exercise07.check_mon_vs_ma:
    instruction: "Correct the possessive agreement error."
    accepted_answers: ["Mon père."]
    feedback: "*Mon*, not *ma*, is used with the masculine noun *père*."

  fr.a1.unit03.lesson02.exercise08.speak_describe_family_size:
    instruction: "Say whether your family is big or small."
    accepted_answers:
      - "Ma famille est petite."
      - "Ma famille est grande."

  fr.a1.unit03.lesson03.exercise01.select_grand_mere:
    instruction: "Which word means grandmother?"
    correct_option: "grand-mère"
    distractors: ["grand-père", "tante"]
    accepted_answers: ["grand-mère"]

  fr.a1.unit03.lesson03.exercise02.select_cousin:
    instruction: "Which word means male cousin?"
    correct_option: "cousin"
    distractors: ["cousine", "oncle"]
    accepted_answers: ["cousin"]

  fr.a1.unit03.lesson03.exercise03.match_extended_family:
    instruction: "Match each French word to its English meaning."
    correct_response:
      "grand-père": "grandfather"
      "grand-mère": "grandmother"
      oncle: "uncle"
      tante: "aunt"
      cousin: "cousin (male)"
      cousine: "cousin (female)"

  fr.a1.unit03.lesson03.exercise04.listen_grands_parents:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Mes grands-parents"
    distractors: ["Mes parents", "Mes cousins"]
    accepted_answers: ["Mes grands-parents"]

  fr.a1.unit03.lesson03.exercise05.order_mes_grands_parents:
    instruction: "Build the phrase: my grandparents."
    correct_response: ["Mes", "grands-parents"]

  fr.a1.unit03.lesson03.exercise06.fill_plural_possessive:
    instruction: "Complete the sentence with the plural possessive for my."
    accepted_answers: ["Mes"]
    feedback: "*Mes* (not *mon*/*ma*) is used because *grands-parents* is plural."

  fr.a1.unit03.lesson03.exercise07.check_gender_agreement:
    instruction: "Correct the gender mismatch in this sentence."
    accepted_answers: ["Mon cousin s'appelle Marc."]
    feedback: "*Cousin* (masculine) matches a male name like Marc; *cousine* is feminine."

  fr.a1.unit03.lesson03.exercise08.speak_own_extended_family:
    instruction: "Answer the question: say that you have an uncle, an aunt, or a cousin."
    accepted_answers:
      - "J'ai un oncle."
      - "J'ai une tante."
      - "J'ai un cousin."
      - "J'ai une cousine."

  fr.a1.unit03.lesson04.exercise01.select_family_size_question:
    instruction: "Which question asks how many siblings someone has?"
    correct_option: "Combien de frères et sœurs as-tu ?"
    distractors: ["Ta famille est grande ?", "Tu habites près de tes parents ?"]
    accepted_answers: ["Combien de frères et sœurs as-tu ?", "Combien de frères et sœurs as-tu"]

  fr.a1.unit03.lesson04.exercise02.listen_family_size_answer:
    instruction: "Listen and select the sentence you hear."
    correct_option: "On est six à la maison."
    distractors: ["On est trois à la maison.", "J'ai cinq cousins."]
    accepted_answers: ["On est six à la maison."]

  fr.a1.unit03.lesson04.exercise03.order_on_est_cinq:
    instruction: "Build the sentence: there are six of us at home."
    correct_response: ["On", "est", "six", "à", "la", "maison"]

  fr.a1.unit03.lesson04.exercise04.fill_beaucoup_de_cousins:
    instruction: "Complete the sentence to say you have many cousins."
    accepted_answers: ["de"]

  fr.a1.unit03.lesson04.exercise05.reply_own_family_size:
    instruction: "Answer that there are six of you at home."
    accepted_answers:
      - "On est six à la maison."
      - "On est six à la maison"

  fr.a1.unit03.lesson04.exercise06.listen_type_habites_pres:
    instruction: "Type the question you hear."
    accepted_answers:
      - "Tu habites près de tes parents ?"
      - "Tu habites près de tes parents"

  fr.a1.unit03.lesson02.exercise09.dictation_jai_deux_soeurs:
    instruction: "Type what you hear."
    correct_option: "J'ai deux sœurs"
    accepted_answers: [{value: "J'ai deux sœurs", status: correct}]
    orthography_strict: true

  fr.a1.unit03.lesson04.exercise07.reply_jhabite_avec_grands_parents:
    instruction: "Answer that you live with your grandparents."
    accepted_answers:
      - "J'habite avec mes grands-parents."
      - "J'habite avec mes grands-parents"

  fr.a1.unit03.lesson04.exercise08.write_own_family_sentence:
    instruction: "Write two sentences: say that your family is big and that you have many cousins."
    accepted_answers:
      - "Ma famille est grande. J'ai beaucoup de cousins."
      - "J'ai beaucoup de cousins. Ma famille est grande."

  fr.a1.unit03.lesson05.exercise01.select_where_ines_lives:
    instruction: "According to the profile, who does Inès live with?"
    correct_option: "Her grandparents"
    distractors: ["Her parents", "Her sister"]
    accepted_answers: ["Her grandparents"]

  fr.a1.unit03.lesson05.exercise02.select_how_many_siblings:
    instruction: "How many siblings does Inès have?"
    correct_option: "Two sisters and a brother"
    distractors: ["One sister and a brother", "Three sisters"]
    accepted_answers: ["Two sisters and a brother"]

  fr.a1.unit03.lesson05.exercise03.match_who_is_who:
