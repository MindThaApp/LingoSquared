answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A1
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation or liaison marks.

course:
  title: "French A1"
  description: >-
    Days of the week and stating calendar dates (le + cardinal number +
    month, with le premier as the sole ordinal exception), continuing Inès
    and Mathieu's cooking-workshop narrative into planning its final
    session. English-specific guidance highlights that French dates use
    cardinal numbers throughout (le quinze mars, not "the fifteenth of
    March" word-for-word) except for the first of the month.

units:
  fr.a1.unit08.dates:
    title: "What's the date?"

lessons:
  fr.a1.unit08.lesson01.jours_de_la_semaine:
    title: "Days of the week"
  fr.a1.unit08.lesson02.donner_la_date:
    title: "Giving the date"
  fr.a1.unit08.lesson03.dialogue_derniere_seance:
    title: "The workshop's last session"

teaching:
  fr.a1.unit08.lesson01.teach.lundi:
    title: "Monday"
    gloss: "Monday"
    note: "Days of the week are masculine and NOT capitalized in French, unlike English."
    example_gloss: "The workshop never meets on Mondays."
  fr.a1.unit08.lesson01.teach.samedi:
    title: "Saturday"
    gloss: "Saturday"
    note: "*Le samedi* (with the article) means \"on Saturdays\" habitually; *samedi* alone means \"this coming Saturday.\""
    example_gloss: "The workshop meets on Saturdays."
  fr.a1.unit08.lesson01.teach.dimanche:
    title: "Sunday"
    gloss: "Sunday"
    note: "Same masculine, uncapitalized pattern as the other days."
    example_gloss: "The bakery is closed on Sundays."
  fr.a1.unit08.lesson01.teach.aujourdhui:
    title: "Today"
    gloss: "today"
    note: "*Aujourd'hui* is a single fixed word, though it looks like several parts combined historically."
    example_gloss: "Today is Saturday."
  fr.a1.unit08.lesson01.teach.demain:
    title: "Tomorrow"
    gloss: "tomorrow"
    note: "*Demain* is invariant, used the same way regardless of context."
    example_gloss: "The workshop continues tomorrow."
  fr.a1.unit08.lesson01.teach.hier:
    title: "Yesterday"
    gloss: "yesterday"
    note: "*Hier* is the direct opposite of *demain*."
    example_gloss: "The workshop started yesterday."
  fr.a1.unit08.lesson01.teach.quel_jour_sommes_nous:
    title: "Ask the day"
    gloss: "What day is it?"
    note: "*Quel jour sommes-nous ?* (literally \"what day are we\") is the standard way to ask which day of the week it is."

  fr.a1.unit08.lesson02.teach.mars:
    title: "March"
    gloss: "March"
    note: "Months, like days, are masculine and not capitalized in French."
    example_gloss: "The workshop ends in March."
  fr.a1.unit08.lesson02.teach.quelle_est_la_date:
    title: "Ask the date"
    gloss: "What's today's date?"
    note: "*Quelle est la date... ?* is the standard way to ask for a full calendar date, distinct from lesson01's day-only question."
  fr.a1.unit08.lesson02.teach.cest_le_quinze_mars:
    title: "State a date"
    gloss: "It's March fifteenth."
    note: "*Le* + cardinal number + month is the standard French date pattern -- *quinze* (fifteen), not an ordinal \"fifteenth.\""
  fr.a1.unit08.lesson02.teach.nous_sommes_le:
    title: "State today's date"
    gloss: "Today is March fifteenth."
    note: "*Nous sommes le...* is an equally common alternative to *C'est le...* for stating today's date."
  fr.a1.unit08.lesson02.teach.le_premier:
    title: "The first (of the month)"
    gloss: "the first"
    note: "*Le premier* is the ONE exception to the cardinal-number rule -- every other day of the month uses a plain cardinal number (*le deux*, *le trois*...), but the first uses the ordinal *premier*."
  fr.a1.unit08.lesson02.teach.le_vingt_deux:
    title: "State an ending date"
    gloss: "The workshop ends on March twenty-second."
    note: "*Se termine* (ends) reuses the reflexive verb pattern; *vingt-deux* is a plain cardinal number, following the general rule from cest_le_quinze_mars above."

  fr.a1.unit08.lesson03.teach.line01:
    title: "Ask when the last session is"
    gloss: "Inès asks when the workshop's last session is."
    note: "*C'est quand... ?* (when is it) is a natural, simple way to ask about timing."
  fr.a1.unit08.lesson03.teach.line02:
    title: "State the date and day"
    gloss: "Mathieu says March twenty-second, he thinks -- a Saturday."
    note: "*Un samedi* (a Saturday, without *le*) simply names which day of the week that date falls on."
  fr.a1.unit08.lesson03.teach.line03:
    title: "Ask today's date"
    gloss: "Inès asks what today's date is."
    note: "Reuses lesson02's *Quelle est la date aujourd'hui ?* directly."
  fr.a1.unit08.lesson03.teach.line04:
    title: "State today's date and the gap"
    gloss: "Mathieu says today is March fifteenth, so it's in a week."
    note: "*Dans une semaine* (in a week) expresses a time distance from today."
  fr.a1.unit08.lesson03.teach.line05:
    title: "React with a plan"
    gloss: "Inès says great, she has time to prepare a dessert for the occasion."
    note: "*J'ai le temps de* + infinitive (I have time to) is a common way to say there's enough time for something."
  fr.a1.unit08.lesson03.teach.line06:
    title: "Confirm the plan"
    gloss: "Mathieu says good idea, see you next Saturday, the twenty-second, then."
    note: "*Samedi prochain* (next Saturday) confirms both the day name and the date together, closing the exchange."

exercises:
  fr.a1.unit08.lesson01.exercise01.select_samedi:
    instruction: "Which word means Saturday?"
    correct_option: "samedi"
    distractors: ["dimanche", "lundi"]
    accepted_answers: ["samedi"]

  fr.a1.unit08.lesson01.exercise02.listen_dimanche:
    instruction: "Listen and select the word you hear."
    correct_option: "dimanche"
    distractors: ["samedi", "lundi"]
    accepted_answers: ["dimanche"]

  fr.a1.unit08.lesson01.exercise03.match_days:
    instruction: "Match each French word to its English meaning."
    correct_response:
      lundi: "Monday"
      samedi: "Saturday"
      dimanche: "Sunday"
      "aujourd'hui": "today"
      demain: "tomorrow"
      hier: "yesterday"

  fr.a1.unit08.lesson01.exercise04.order_atelier_samedi:
    instruction: "Build the sentence: The workshop meets on Saturdays."
    correct_response: ["L'atelier", "a", "lieu", "le", "samedi"]

  fr.a1.unit08.lesson01.exercise05.fill_dimanche_fermee:
    instruction: "Complete the sentence with the word for Sunday."
    accepted_answers: ["dimanche"]

  fr.a1.unit08.lesson01.exercise06.speak_today:
    instruction: "Say what day it is today."
    accepted_answers:
      - "Nous sommes samedi aujourd'hui."
      - "Aujourd'hui, nous sommes samedi."

  fr.a1.unit08.lesson02.exercise01.select_quelle_est_la_date:
    instruction: "Which question asks for today's date?"
    correct_option: "Quelle est la date aujourd'hui ?"
    distractors: ["Quel jour sommes-nous ?", "Quelle heure est-il ?"]
    accepted_answers: ["Quelle est la date aujourd'hui ?", "Quelle est la date aujourd'hui"]

  fr.a1.unit08.lesson02.exercise02.listen_quinze_mars:
    instruction: "Listen and select the sentence you hear."
    correct_option: "C'est le quinze mars."
    distractors: ["C'est le premier mars.", "C'est le vingt-deux mars."]
    accepted_answers: ["C'est le quinze mars.", "C'est le quinze mars"]

  fr.a1.unit08.lesson02.exercise03.match_date_phrases:
    instruction: "Match each French date phrase to its English meaning."
    correct_response:
      "Quelle est la date aujourd'hui ?": "What's today's date?"
      "C'est le quinze mars.": "It's March fifteenth."
      "Nous sommes le quinze mars.": "Today is March fifteenth."
      "le premier": "the first (of the month)"
      "L'atelier se termine le vingt-deux mars.": "The workshop ends on March twenty-second."
      mars: "March"

  fr.a1.unit08.lesson02.exercise04.order_nous_sommes_quinze_mars:
    instruction: "Build the sentence: Today is March fifteenth."
    correct_response: ["Nous", "sommes", "le", "quinze", "mars"]

  fr.a1.unit08.lesson02.exercise05.fill_vingt_deux:
    instruction: "Complete the sentence with the number twenty-two."
    accepted_answers: ["vingt-deux"]

  fr.a1.unit08.lesson02.exercise06.reply_todays_date:
    instruction: "Answer that today is March fifteenth."
    accepted_answers:
      - "Nous sommes le quinze mars."
      - "Nous sommes le quinze mars"

  fr.a1.unit08.lesson03.exercise01.comprehend_last_session_date:
    instruction: "Listen to the dialogue. When is the last session, and what day of the week?"
    correct_option: "March twenty-second, a Saturday"
    distractors: ["March fifteenth, a Saturday", "March twenty-second, a Sunday"]
    accepted_answers: ["March twenty-second, a Saturday"]

  fr.a1.unit08.lesson03.exercise02.comprehend_todays_date:
    instruction: "What date does Mathieu say it is today?"
    correct_option: "March fifteenth"
    distractors: ["March first", "March twenty-second"]
    accepted_answers: ["March fifteenth"]

  fr.a1.unit08.lesson03.exercise03.select_what_ines_will_do:
    instruction: "What does Inès say she'll do before the last session?"
    correct_option: "Prepare a dessert"
    distractors: ["Buy flowers", "Invite more people"]
    accepted_answers: ["Prepare a dessert"]

  fr.a1.unit08.lesson03.exercise04.order_elle_est_vingt_deux:
    instruction: "Build Mathieu's sentence about the last session's date."
    correct_response: ["Elle", "est", "le", "vingt-deux", "mars", "je", "crois"]

  fr.a1.unit08.lesson03.exercise05.reply_as_mathieu:
    instruction: "Take Mathieu's role. State today's date and that the last session is in a week."
    accepted_answers:
      - "Nous sommes le quinze mars. Donc c'est dans une semaine."
      - "Nous sommes le quinze mars, donc c'est dans une semaine."

  fr.a1.unit08.lesson03.exercise06.speak_confirm_last_session:
    instruction: "Confirm out loud that they'll see each other next Saturday, the twenty-second."
    accepted_answers:
      - "On se voit samedi prochain, le vingt-deux."
      - "On se voit samedi prochain, le vingt-deux !"
