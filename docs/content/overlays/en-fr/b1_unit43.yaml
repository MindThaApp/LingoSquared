exercises:
  fr.b1.unit43.lesson01.exercise01.select_qui:
    instruction: "In this sentence, what does \"qui\" replace?"
    correct_option: "The subject of the relative clause"
    distractors: ["The direct object of the relative clause", "A complement introduced by de"]
    accepted_answers: ["The subject of the relative clause"]
  fr.b1.unit43.lesson01.exercise02.listen_qui:
    instruction: "Listen and select the exact sentence you hear."
    correct_option: "Monsieur Lefebvre, qui m'a appris cette recette, est très patient."
    distractors: ["La recette que j'ai apprise est difficile.", "C'est un secret dont il ne parle jamais."]
    accepted_answers: ["Monsieur Lefebvre, qui m'a appris cette recette, est très patient."]
  fr.b1.unit43.lesson01.exercise03.match_qui_que_phrases:
    instruction: "Match each French phrase to English."
    correct_response:
      "qui m'a appris cette recette": "who taught me this recipe"
      "la recette que j'ai apprise": "the recipe that I learned"
      "est très patient": "is very patient"
      "est difficile": "is difficult"
      "cette recette": "this recipe"
      "j'ai apprise": "I learned"
  fr.b1.unit43.lesson01.exercise04.order_que:
    instruction: "Build the sentence: The recipe that I learned is difficult."
    correct_response: ["La", "recette", "que", "j'ai", "apprise", "est", "difficile"]
