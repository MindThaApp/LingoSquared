answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A2
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    (an opinion clearly stated with at least one reason) rather than
    written punctuation or exact wording.

course:
  title: "French A2"
  description: >-
    Giving opinions with reasons and responding to a contrasting opinion
    (à mon avis, je trouve que, par contre, même si, il vaudrait mieux
    que), the first French A2 unit, continuing Inès and Mathieu's
    friendship as Inès starts a pâtisserie apprenticeship in Lyon and the
    two debate, over the phone, whether she should specialize in pastry
    or bread. English-specific guidance highlights that *même si* (even
    though) takes the indicative, never the subjunctive, unlike *bien
    que* -- while *il vaudrait mieux que* (it would be better if) is a
    genuine subjunctive trigger, a real step up from every subjunctive-free
    construction in the A1 course.

units:
  fr.a2.unit16.opinions:
    title: "Pastry or bread?"

lessons:
  fr.a2.unit16.lesson01.vocabulaire_opinions:
    title: "Giving your opinion"
  fr.a2.unit16.lesson02.registre_du_desaccord:
    title: "Expressing disagreement"
  fr.a2.unit16.lesson03.dialogue_patisserie_ou_boulangerie:
    title: "Pastry or bread: the big debate"

teaching:
  fr.a2.unit16.lesson01.teach.a_mon_avis:
    title: "In my opinion"
    gloss: "in my opinion"
    note: "*À mon avis* is the most common way to open a personal opinion in French -- always followed by a comma before the opinion itself."
    example_gloss: "In my opinion, pastry is more interesting than bread-making."
  fr.a2.unit16.lesson01.teach.je_trouve_que:
    title: "I find that / I think that"
    gloss: "I find that / I think that"
    note: "*Je trouve que* is a softer, more personal way to state an opinion than *je pense que* -- both take the indicative, never the subjunctive."
    example_gloss: "I find that bread is more useful day-to-day."
  fr.a2.unit16.lesson01.teach.parce_que:
    title: "Because"
    gloss: "because"
    note: "*Parce que* introduces the reason after an opinion -- pair it directly with *je trouve que* or *à mon avis* to build a full opinion-plus-reason sentence."
    example_gloss: "I prefer pastry because it's more creative."
  fr.a2.unit16.lesson01.teach.cest_pour_ca_que:
    title: "That's why"
    gloss: "that's why"
    note: "*C'est pour ça que* flips the logic of *parce que* -- it introduces the CONCLUSION after the reason, rather than the reason after the opinion."
    example_gloss: "Bread sells every day, that's why bakers are always needed."
  fr.a2.unit16.lesson01.teach.par_contre:
    title: "However"
    gloss: "however / on the other hand"
    note: "*Par contre* introduces a contrasting point within the same opinion -- more common in spoken French than the more formal *cependant*."
    example_gloss: "Pastry demands more creativity. However, it's less financially stable."
  fr.a2.unit16.lesson01.teach.pas_d_accord_parce_que:
    title: "I disagree because"
    gloss: "I disagree because"
    note: "*Je ne suis pas d'accord* directly contradicts someone else's opinion before giving your own reason -- a natural way to push back in a friendly debate."
    example_gloss: "I disagree because pastry chefs are in high demand for weddings."
  fr.a2.unit16.lesson01.teach.meme_si:
    title: "Even though"
    gloss: "even though / even if"
    note: "*Même si* takes the INDICATIVE, never the subjunctive, even though English \"even though\" might suggest otherwise -- contrast this with *il vaudrait mieux que* in the next lesson, which genuinely does trigger the subjunctive."
    example_gloss: "Even though it's more difficult, I prefer pastry."

  fr.a2.unit16.lesson02.teach.grammar_meme_si_indicatif:
    title: "Même si + indicative"
    gloss: "même si + indicative (never the subjunctive)"
    note: "Many learners assume \"even though\" always needs the subjunctive because *bien que* does -- but *même si* is a straightforward *si*-clause and stays in the indicative: *même si c'est cher* (not *même si ce soit cher*)."
  fr.a2.unit16.lesson02.teach.il_vaudrait_mieux_que:
    title: "It would be better if"
    gloss: "it would be better if"
    note: "*Il vaudrait mieux que* is a genuine subjunctive trigger -- notice *tu choisisses* (subjunctive) instead of the indicative *tu choisis*, a visible difference for this verb."
    example_gloss: "It would be better if you chose pastry."
  fr.a2.unit16.lesson02.teach.je_pense_quil_vaut_mieux:
    title: "I think it's better to"
    gloss: "I think it's better to"
    note: "*Je pense que* stays in the indicative here (*il vaut mieux*, not *il vaille mieux*) -- stating your own certain opinion doesn't trigger the subjunctive, unlike a suggestion about someone else with *il vaudrait mieux que*."
    example_gloss: "I think it's better to start with bread."
  fr.a2.unit16.lesson02.teach.il_est_possible_que:
    title: "It's possible that"
    gloss: "it's possible that"
    note: "*Il est possible que* is another genuine subjunctive trigger -- *que tu sois* (subjunctive of *être*) instead of the indicative *tu es*."
    example_gloss: "It's possible that you'd be happier in bread-making."
  fr.a2.unit16.lesson02.teach.dun_cote_de_lautre:
    title: "On one hand... on the other hand"
    gloss: "on one hand... on the other hand"
    note: "A classic way to lay out both sides of an opinion before picking one -- *de l'autre côté* can also be shortened to just *d'un autre côté*."
    example_gloss: "On one hand, pastry is more creative; on the other hand, bread is more stable."
  fr.a2.unit16.lesson02.teach.ca_depend:
    title: "It depends on what you prefer"
    gloss: "it depends on what you prefer"
    note: "A natural hedge when you don't want to fully commit to one opinion -- *ça dépend de* + noun/clause is very common in everyday spoken French."
  fr.a2.unit16.lesson02.teach.chacun_son_avis:
    title: "To each their own"
    gloss: "to each their own, right?"
    note: "A friendly way to end a disagreement without either side backing down -- *chacun son avis* literally means \"each their own opinion.\""

  fr.a2.unit16.lesson03.teach.line01:
    title: "Ask about the choice"
    gloss: "Mathieu asks if Inès has chosen her specialty for next year."
    note: "A natural opener for a check-in phone call between friends."
  fr.a2.unit16.lesson03.teach.line02:
    title: "State an opinion with a caveat"
    gloss: "Inès says not yet -- in her opinion, pastry is more interesting, but riskier."
    note: "Combines lesson01's *à mon avis* with a contrasting *mais* clause in one breath."
  fr.a2.unit16.lesson03.teach.line03:
    title: "Disagree and give a reason"
    gloss: "Mathieu disagrees, saying he finds bread more useful since people buy it every day."
    note: "*Je ne suis pas d'accord* plus *je trouve que* plus a reason stacks three lesson01 constructions in one reply."
  fr.a2.unit16.lesson03.teach.line04:
    title: "Concede, then contrast"
    gloss: "Inès agrees that's true, but says pastry is more creative -- though there's less demand during the week."
    note: "*Par contre* pivots from conceding Mathieu's point to restating her own."
  fr.a2.unit16.lesson03.teach.line05:
    title: "Suggest with the subjunctive"
    gloss: "Mathieu suggests it would be better if she chose bread, for stability."
    note: "*Il vaudrait mieux que tu choisisses* -- the subjunctive trigger from lesson02, now used for real in a genuine suggestion."
  fr.a2.unit16.lesson03.teach.line06:
    title: "Hold her ground"
    gloss: "Inès says even though it's less stable, she prefers to follow her passion."
    note: "*Même si* + indicative (*c'est*), exactly as lesson02's grammar note explains -- not the subjunctive."
  fr.a2.unit16.lesson03.teach.line07:
    title: "Accept the disagreement"
    gloss: "Mathieu says he understands -- that's why it's her choice, not his."
    note: "*C'est pour ça que* closes the loop, turning the whole exchange's reasoning into a final conclusion."
  fr.a2.unit16.lesson03.teach.line08:
    title: "Close on good terms"
    gloss: "Inès agrees -- to each their own, right?"
    note: "A warm, unresolved ending -- a real opinion exchange between friends doesn't need a winner."

exercises:
  fr.a2.unit16.lesson01.exercise01.select_a_mon_avis:
    instruction: "Which phrase means \"in my opinion\"?"
    correct_option: "à mon avis"
    distractors: ["je trouve que", "par contre"]
    accepted_answers: ["à mon avis"]

  fr.a2.unit16.lesson01.exercise02.listen_je_trouve_que:
    instruction: "Listen and select the phrase you hear."
    correct_option: "je trouve que"
    distractors: ["à mon avis", "par contre"]
    accepted_answers: ["je trouve que"]

  fr.a2.unit16.lesson01.exercise03.match_opinion_connectors:
    instruction: "Match each French opinion connector to its English meaning."
    correct_response:
      "à mon avis": "in my opinion"
      "je trouve que": "I find that / I think that"
      "parce que": "because"
      "c'est pour ça que": "that's why"
      "par contre": "however / on the other hand"
      "je ne suis pas d'accord parce que": "I disagree because"
      "même si": "even though / even if"

  fr.a2.unit16.lesson01.exercise04.order_je_prefere_patisserie:
    instruction: "Build the sentence: I prefer pastry because it's more creative."
    correct_response: ["Je", "préfère", "la", "pâtisserie", "parce", "que", "c'est", "plus", "créatif"]

  fr.a2.unit16.lesson01.exercise05.fill_par_contre:
    instruction: "Complete the sentence with the word for \"however.\""
    accepted_answers: ["contre"]

  fr.a2.unit16.lesson01.exercise06.translate_meme_si_difficile:
    instruction: "Translate into French."
    accepted_answers:
      - "Même si c'est plus difficile, je préfère la pâtisserie."
      - "Même si c'est plus difficile, je préfère la pâtisserie"

  fr.a2.unit16.lesson02.exercise01.select_subjonctif_trigger:
    instruction: "Which construction is followed by the SUBJUNCTIVE?"
    correct_option: "il vaudrait mieux que"
    distractors: ["même si", "je pense qu'il vaut mieux"]
    accepted_answers: ["il vaudrait mieux que"]

  fr.a2.unit16.lesson02.exercise02.listen_il_vaudrait_mieux:
    instruction: "Listen and select the phrase you hear."
    correct_option: "il vaudrait mieux que tu choisisses la pâtisserie"
    distractors: ["je pense qu'il vaut mieux choisir la pâtisserie", "il est possible que tu choisisses la pâtisserie"]
    accepted_answers: ["il vaudrait mieux que tu choisisses la pâtisserie"]

  fr.a2.unit16.lesson02.exercise03.match_opinion_phrases:
    instruction: "Match each French phrase to its English meaning."
    correct_response:
      "il vaudrait mieux que": "it would be better if"
      "je pense qu'il vaut mieux": "I think it's better to"
      "il est possible que": "it's possible that"
      "d'un côté... de l'autre côté...": "on one hand... on the other hand..."
      "Ça dépend de ce que tu préfères.": "It depends on what you prefer."
      "Chacun son avis, non ?": "To each their own, right?"

  fr.a2.unit16.lesson02.exercise04.order_il_est_possible_que:
    instruction: "Build the sentence: It's possible that you'd be happier in bread-making."
    correct_response: ["Il", "est", "possible", "que", "tu", "sois", "plus", "heureuse", "en", "boulangerie"]

  fr.a2.unit16.lesson02.exercise05.fill_choisisses:
    instruction: "Complete the sentence with the subjunctive form of \"choisir.\""
    accepted_answers: ["choisisses"]

  fr.a2.unit16.lesson02.exercise06.translate_il_vaut_mieux_commencer:
    instruction: "Translate into French."
    accepted_answers:
      - "Je pense qu'il vaut mieux commencer par le pain."
      - "Je pense qu'il vaut mieux commencer par le pain"

  fr.a2.unit16.lesson03.exercise01.comprehend_mathieu_opinion_reason:
    instruction: "Listen to the dialogue. What is Mathieu's opinion, and why?"
    correct_option: "Le pain est mieux, parce que les gens en achètent tous les jours"
    distractors: ["La pâtisserie est mieux, parce que c'est plus stable", "Le pain est mieux, parce que c'est plus créatif"]
    accepted_answers: ["Le pain est mieux, parce que les gens en achètent tous les jours"]

  fr.a2.unit16.lesson03.exercise02.comprehend_ines_response_to_stability:
    instruction: "How does Inès respond when Mathieu suggests she choose bread for stability?"
    correct_option: "Même si c'est moins stable, elle préfère suivre sa passion"
    distractors: ["Elle est d'accord et choisit le pain", "Elle dit qu'elle n'a pas encore décidé"]
    accepted_answers: ["Même si c'est moins stable, elle préfère suivre sa passion"]

  fr.a2.unit16.lesson03.exercise03.match_opinions_to_reasons:
    instruction: "Match each statement from the dialogue to how it continues."
    correct_response:
      "La pâtisserie est plus intéressante": "mais c'est plus risqué"
      "Le pain est plus utile": "les gens en achètent tous les jours"
      "La pâtisserie, c'est plus créatif": "il y a moins de demande en semaine"
      "Il vaudrait mieux que tu choisisses le pain": "pour la stabilité"
      "Même si c'est moins stable": "je préfère suivre ma passion"
      "C'est pour ça que c'est ton choix": "pas le mien"

  fr.a2.unit16.lesson03.exercise04.order_il_vaudrait_mieux_pain:
    instruction: "Build Mathieu's suggestion: it would be better if you chose bread, for stability."
    correct_response: ["Il", "vaudrait", "mieux", "que", "tu", "choisisses", "le", "pain", "pour", "la", "stabilité"]

  fr.a2.unit16.lesson03.exercise05.reply_disagree_with_stability_suggestion:
    instruction: "Take Inès's role. Disagree with Mathieu's suggestion, using même si."
    accepted_answers:
      - "Même si c'est moins stable, je préfère suivre ma passion."
      - "Même si c'est moins stable, je préfère suivre ma passion"
      - "Je préfère suivre ma passion, même si c'est moins stable."
      - "Je préfère suivre ma passion, même si c'est moins stable"

  fr.a2.unit16.lesson03.exercise06.speak_state_your_own_opinion:
    instruction: "Say out loud: which do you think is better, pastry or bread-making, and why?"
    accepted_answers:
      - "À mon avis, la pâtisserie est plus intéressante parce que c'est plus créatif."
      - "À mon avis, la pâtisserie est plus intéressante parce que c'est plus créatif"
      - "Je trouve que le pain est plus utile parce que les gens en achètent tous les jours."
      - "Je trouve que le pain est plus utile parce que les gens en achètent tous les jours"
