answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A2
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names and in the formal
    address terms Madame/Mademoiselle.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate formal
    register rather than written punctuation or liaison marks.
  register_note: >-
    This unit is entirely vous-register. A learner who lapses into a tu
    conjugation on a production exercise should be marked incorrect, not
    merely "almost" -- the register shift is the point of the unit, not a
    stylistic nicety.

course:
  title: "French A2"
  description: >-
    Opening a basic bank account and understanding simple account features
    and requirements, continuing Ines's story as she moves to Lyon to
    start a paid patisserie apprenticeship and needs her first real
    checking account. A genuine register step up from A1: the whole unit
    is formal vous, with polite conditional requests (je voudrais /
    j'aimerais / pourriez-vous) and subjunctive after il faudrait que /
    avant que / pour que -- not just A1 sentences with harder words.

units:
  fr.a2.unit17.compte_bancaire:
    title: "Opening a bank account"

lessons:
  fr.a2.unit17.lesson01.vocabulaire_bancaire:
    title: "Bank vocabulary"
  fr.a2.unit17.lesson02.registre_formel:
    title: "The formal register at the bank"
  fr.a2.unit17.lesson03.dialogue_ouverture_compte:
    title: "Opening an account at the bank"

teaching:
  fr.a2.unit17.lesson01.teach.ouvrir_un_compte:
    title: "To open an account"
    gloss: "to open an account"
    note: "*Ouvrir un compte* is the standard phrase for opening any type of bank account -- *un compte courant* specifically means a checking/current account."
    example_gloss: "I would like to open a checking account, please."
  fr.a2.unit17.lesson01.teach.piece_identite:
    title: "A proof of identity"
    gloss: "a proof of identity / an ID document"
    note: "*Une pièce d'identité* covers a national ID card or a passport -- any official document proving who you are."
    example_gloss: "You must present a valid proof of identity to open the account."
  fr.a2.unit17.lesson01.teach.justificatif_domicile:
    title: "A proof of address"
    gloss: "a proof of address"
    note: "A *justificatif de domicile* is usually a recent utility bill or lease -- French banks and administrations ask for this constantly."
    example_gloss: "The proof of address shows where you currently live."
  fr.a2.unit17.lesson01.teach.contrat_justificatif_revenus:
    title: "Employment contract, proof of income"
    gloss: "an employment contract, a proof of income"
    note: "A bank may accept either document to confirm you have a steady income -- an apprenticeship contract like Inès's counts as a *contrat de travail*."
    example_gloss:
      - "I brought my employment contract."
      - "A proof of income can be a payslip."
  fr.a2.unit17.lesson01.teach.carte_bancaire:
    title: "A bank card"
    gloss: "a bank card"
    note: "*Une carte bancaire* (often shortened to *CB*) is the everyday term for a debit/bank card in France."
    example_gloss: "With the bank card, you can pay and withdraw money."
  fr.a2.unit17.lesson01.teach.virement:
    title: "A (bank) transfer"
    gloss: "a bank transfer"
    note: "*Un virement* is how a French employer pays a salary -- direct deposit, essentially, not a paper check."
    example_gloss: "My employer will make a transfer every month for my salary."
  fr.a2.unit17.lesson01.teach.decouvert_autorise:
    title: "An authorized overdraft"
    gloss: "an authorized overdraft"
    note: "*Un découvert autorisé* is a small, pre-agreed negative balance the bank allows without extra fees -- common on French starter accounts."
    example_gloss: "The authorized overdraft gives you a little room if the account is at zero."
  fr.a2.unit17.lesson01.teach.agence_conseiller:
    title: "Bank branch, bank advisor"
    gloss: "a bank branch, a bank advisor"
    note: "*Un conseiller bancaire* / *une conseillère bancaire* is the personal contact assigned to your account at your local *agence* -- not just a generic teller."
    example_gloss:
      - "This bank branch is in downtown Lyon."
      - "The bank advisor answers all my questions."

  fr.a2.unit17.lesson02.teach.je_voudrais:
    title: "I would like"
    gloss: "I would like"
    note: "*Je voudrais* (the conditional of *vouloir*) is the standard polite way to make a request -- much softer than the blunt *je veux* (I want)."
    example_gloss: "I would like some information about checking accounts."
  fr.a2.unit17.lesson02.teach.pourriez_vous:
    title: "Could you...?"
    gloss: "could you...?"
    note: "*Pourriez-vous* is the conditional of *pouvoir* -- the polite way to ask someone to do something, especially in a formal or service setting."
    example_gloss: "Could you explain the account fees to me?"
  fr.a2.unit17.lesson02.teach.il_faudrait_que:
    title: "It would be necessary that / you'd need to"
    gloss: "it would be necessary that / you'd need to"
    note: "*Il faudrait que* is always followed by the subjunctive (*ameniez*, not *amenez*) -- a softer, more polite version of the blunter *il faut que*."
    example_gloss: "You would need to bring a proof of address."
  fr.a2.unit17.lesson02.teach.avant_que:
    title: "Before"
    gloss: "before"
    note: "*Avant que* also triggers the subjunctive (*soit*, not *est*) -- one of a handful of French conjunctions that always do, along with *pour que* below."
    example_gloss: "You must sign before the account is active."
  fr.a2.unit17.lesson02.teach.pour_que:
    title: "So that"
    gloss: "so that"
    note: "*Pour que* expresses purpose and, like *avant que*, always takes the subjunctive."
    example_gloss: "How long does it take for the card to be ready?"
  fr.a2.unit17.lesson02.teach.frais_gratuit:
    title: "Fees, free"
    gloss: "fees, free (of charge)"
    note: "*Gratuit* agrees in gender: *gratuit* (masculine), *gratuite* (feminine) -- *une carte gratuite*, but *un compte gratuit*."
    example_gloss:
      - "There are account maintenance fees every month."
      - "The bank card is free the first year."
  fr.a2.unit17.lesson02.teach.grammar_note_registre_formel:
    title: "The formal register pattern"
    gloss: "polite conditional (je voudrais, pourriez-vous) + subjunctive after il faudrait que / avant que / pour que"
    note: "Two separate A2 patterns work together at a formal service counter: the conditional softens a request or question (*je voudrais*, *pourriez-vous*), while *il faudrait que* / *avant que* / *pour que* all force the subjunctive on the verb that follows them."

  fr.a2.unit17.lesson03.teach.line01:
    title: "Ask to open an account"
    gloss: "Inès says hello and that she'd like to open a checking account, please."
    note: "*J'aimerais* is interchangeable with *je voudrais* here -- both are the polite conditional for a request."
  fr.a2.unit17.lesson03.teach.line02:
    title: "Confirm it's a first account"
    gloss: "Camille greets her back and asks if this is her first account at this bank."
    note: "*Est-ce que* (here shortened to *est-ce*) turns a statement into a yes/no question -- the standard formal question form."
  fr.a2.unit17.lesson03.teach.line03:
    title: "Explain why she needs it"
    gloss: "Inès says yes, she just started a patisserie apprenticeship here in Lyon, and her employer needs to transfer her salary."
    note: "*Venir de + infinitive* means \"to have just done something\" -- *je viens de commencer* is \"I just started.\""
  fr.a2.unit17.lesson03.teach.line04:
    title: "List the required documents"
    gloss: "Camille congratulates her on the apprenticeship and lists what she needs to bring: a proof of identity, a proof of address, and her employment contract."
    note: "*Il faudrait que vous ameniez* -- the subjunctive after *il faudrait que*, softened further by being the conditional *il faudrait* rather than *il faut*."
  fr.a2.unit17.lesson03.teach.line05:
    title: "Confirm documents and ask about fees"
    gloss: "Inès says she has her ID card and her contract with her, and asks if the account maintenance fees are high."
    note: "*Si* here introduces an indirect yes/no question (\"whether\"), not a conditional \"if.\""
  fr.a2.unit17.lesson03.teach.line06:
    title: "Explain the fees and the overdraft"
    gloss: "Camille says no, the fees stay reasonable, the card is free the first year, and she'll also get a 200-euro authorized overdraft."
    note: "*Vous aurez* is the simple future of *avoir* -- \"you will have.\""
  fr.a2.unit17.lesson03.teach.line07:
    title: "Ask when the account will be active"
    gloss: "Inès says great, and asks how long it takes for the account to become active."
    note: "*Combien de temps faut-il pour que...* -- another *pour que* + subjunctive, this time inside a question."
  fr.a2.unit17.lesson03.teach.line08:
    title: "Give the timeline"
    gloss: "Camille says the account will be active before Inès receives her card, so in two or three days."
    note: "*Avant que vous ne receviez* -- the optional *ne* here (the \"expletive ne\") is a formal-register touch after *avant que*; it does not make the sentence negative."

exercises:
  fr.a2.unit17.lesson01.exercise01.select_ouvrir_un_compte:
    instruction: "Which phrase means \"to open an account\"?"
    correct_option: "ouvrir un compte"
    distractors: ["fermer un compte", "vérifier un compte"]
    accepted_answers: ["ouvrir un compte"]

  fr.a2.unit17.lesson01.exercise02.listen_piece_identite:
    instruction: "Listen and select the phrase you hear."
    correct_option: "une pièce d'identité valide"
    distractors: ["un justificatif de domicile", "un contrat de travail"]
    accepted_answers: ["une pièce d'identité valide"]

  fr.a2.unit17.lesson01.exercise03.match_vocabulaire_bancaire:
    instruction: "Match each French banking term to its English meaning."
    correct_response:
      "ouvrir un compte": "to open an account"
      "une pièce d'identité": "a proof of identity"
      "un justificatif de domicile": "a proof of address"
      "un contrat de travail": "an employment contract"
      "un justificatif de revenus": "a proof of income"
      "une carte bancaire": "a bank card"
      "un virement": "a bank transfer"
      "un découvert autorisé": "an authorized overdraft"
      "une agence bancaire": "a bank branch"
      "un conseiller bancaire": "a bank advisor"

  fr.a2.unit17.lesson01.exercise04.order_vous_devez_presenter:
    instruction: "Build the sentence: You must present a valid proof of identity."
    correct_response: ["Vous", "devez", "présenter", "une", "pièce", "d'identité", "valide"]

  fr.a2.unit17.lesson01.exercise05.fill_virement:
    instruction: "Complete the sentence with the word for \"bank transfer.\""
    accepted_answers: ["virement"]

  fr.a2.unit17.lesson01.exercise06.translate_ouvrir_compte:
    instruction: "Translate into French."
    accepted_answers:
      - "Je voudrais ouvrir un compte courant."
      - "J'aimerais ouvrir un compte courant."

  fr.a2.unit17.lesson02.exercise01.select_je_voudrais:
    instruction: "Which phrase means \"I would like\"?"
    correct_option: "je voudrais"
    distractors: ["je veux", "je voulais"]
    accepted_answers: ["je voudrais"]

  fr.a2.unit17.lesson02.exercise02.listen_pourriez_vous:
    instruction: "Listen and select the phrase you hear."
    correct_option: "Pourriez-vous m'expliquer les frais du compte ?"
    distractors: ["Il faudrait que vous ameniez un justificatif.", "Je voudrais des renseignements sur les comptes."]
    accepted_answers: ["Pourriez-vous m'expliquer les frais du compte ?"]

  fr.a2.unit17.lesson02.exercise03.match_registre_formel:
    instruction: "Match each formal phrase or pattern to its English meaning."
    correct_response:
      "je voudrais": "I would like"
      "pourriez-vous...?": "could you...?"
      "il faudrait que": "it would be necessary that"
      "avant que": "before"
      "pour que": "so that"
      "des frais": "fees"
      "gratuit / gratuite": "free (of charge)"

  fr.a2.unit17.lesson02.exercise04.order_il_faudrait_que:
    instruction: "Build the sentence: You would need to bring a proof of address."
    correct_response: ["Il", "faudrait", "que", "vous", "ameniez", "un", "justificatif", "de", "domicile"]

  fr.a2.unit17.lesson02.exercise05.fill_avant_que_soit:
    instruction: "Complete the sentence with the subjunctive of \"to be.\""
    accepted_answers: ["soit"]

  fr.a2.unit17.lesson02.exercise06.read_avis_compte_jeune:
    instruction: "Read the notice. When do the account fees start?"
    correct_option: "From the second year onward"
    distractors: ["Immediately, from the first month", "Never -- the account stays free forever"]
    accepted_answers: ["From the second year onward"]

  fr.a2.unit17.lesson02.exercise07.write_demande_informations:
    instruction: "Write a short, formal message: say you would like information about checking accounts, and ask the advisor to explain the account fees."
    accepted_answers:
      - {value: "Bonjour, je voudrais des renseignements sur les comptes courants. Pourriez-vous m'expliquer les frais du compte ?", status: correct}
      - {value: "Bonjour, je voudrais des renseignements sur les comptes courants, pourriez-vous m'expliquer les frais du compte ?", status: correct}
      - {value: "Bonjour, je voudrais des renseignements sur les comptes courants, et pourriez-vous m'expliquer les frais du compte ?", status: correct}
      - {value: "Bonjour, j'aimerais des renseignements sur les comptes courants. Pourriez-vous m'expliquer les frais du compte ?", status: correct}

  fr.a2.unit17.lesson03.exercise01.comprehend_documents_requested:
    instruction: "Listen to the dialogue. Which documents does the advisor ask Inès to bring?"
    correct_option: "A proof of identity, a proof of address, and her employment contract"
    distractors: ["A proof of identity and a recent bank statement", "Her passport and a recent payslip"]
    accepted_answers: ["A proof of identity, a proof of address, and her employment contract"]

  fr.a2.unit17.lesson03.exercise02.comprehend_why_account_needed:
    instruction: "Why does Inès need a bank account?"
    correct_option: "Her employer needs to transfer her apprenticeship salary into it"
    distractors: ["She wants to save money for a trip", "She needs to pay her rent by check"]
    accepted_answers: ["Her employer needs to transfer her apprenticeship salary into it"]

  fr.a2.unit17.lesson03.exercise03.select_vous_register:
    instruction: "Why does Camille use vous instead of tu with Inès?"
    correct_option: "It's the polite, formal register used with a stranger in a professional setting"
    distractors: ["It means she's speaking to more than one person", "It's only used with people older than the speaker"]
    accepted_answers: ["It's the polite, formal register used with a stranger in a professional setting"]

  fr.a2.unit17.lesson03.exercise04.order_il_faudrait_que_ameniez:
    instruction: "Build the sentence: You would need to bring a proof of identity."
    correct_response: ["Il", "faudrait", "que", "vous", "ameniez", "une", "pièce", "d'identité"]

  fr.a2.unit17.lesson03.exercise05.reply_jai_ma_carte:
    instruction: "Take Inès's role. Say you have your ID card and your contract with you."
    accepted_answers:
      - "J'ai ma carte d'identité et mon contrat avec moi."
      - "J'ai ma carte d'identité et mon contrat avec moi"

  fr.a2.unit17.lesson03.exercise06.speak_request_account:
    instruction: "Explain out loud that you'd like to open a checking account and that you just started your apprenticeship in Lyon."
    accepted_answers:
      - "Bonjour, j'aimerais ouvrir un compte courant. Je viens de commencer un apprentissage à Lyon."
      - "Bonjour, j'aimerais ouvrir un compte courant, je viens de commencer un apprentissage à Lyon."
      - "Bonjour, j'aimerais ouvrir un compte courant, et je viens de commencer un apprentissage à Lyon."
