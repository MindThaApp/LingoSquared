teaching:
  fr.a1.unit44.lesson01.teach.je_ne_me:
    title: Feeling unwell
    gloss: I don't feel well.
    note: '*Se sentir* is reflexive (*je me sens*); *ne ... pas bien* is the general, mild way to say something is off.'
  fr.a1.unit44.lesson01.teach.malade:
    title: Sick
    gloss: sick
    note: 'The base adjective, used with *être*: *je suis malade*.'
    example_gloss: I am sick.
  fr.a1.unit44.lesson01.teach.je_suis_malade:
    title: Being sick
    gloss: I am sick.
    note: '*Malade* describes a more general, stronger state than *pas bien*.'
  fr.a1.unit44.lesson01.teach.mal_a_la:
    title: Headache
    gloss: a headache
    note: '*Mal à la tête* goes with *avoir*: *j''ai mal à la tête*; *à la* because *tête* is feminine.'
    example_gloss: I have a headache.
  fr.a1.unit44.lesson01.teach.j_ai_mal:
    title: Having a headache
    gloss: I have a headache.
    note: 'Symptoms pair with *avoir* (to have): *j''ai mal*.'
  fr.a1.unit44.lesson01.teach.mal_au_ventre:
    title: Stomach ache
    gloss: a stomach ache
    note: '*Mal au ventre*: *au* is *à* + *le* joined, because *ventre* is masculine.'
    example_gloss: I have a stomach ache.
  fr.a1.unit44.lesson01.teach.j_ai_mal_2:
    title: Having a stomach ache
    gloss: I have a stomach ache.
    note: Same *avoir* pattern as *mal à la tête*, with *au* instead of *à la*.
  fr.a1.unit44.lesson02.teach.qu_est_ce:
    title: Asking generally
    gloss: What's wrong?
    note: A general, all-purpose way to ask if something is the matter.
  fr.a1.unit44.lesson02.teach.qu_est_ce_2:
    title: A common idiom
    gloss: What's the matter?
    note: '*Qu''est-ce qui ne va pas ?* is a fixed question, literally ''what is not going well''; don''t translate it word for word.'
  fr.a1.unit44.lesson02.teach.mal_a_la:
    title: Sore throat
    gloss: a sore throat
    note: '*Mal à la gorge* follows *mal à la tête*: *gorge* is feminine, so *à la*.'
    example_gloss: I have a sore throat.
  fr.a1.unit44.lesson02.teach.j_ai_mal:
    title: Having a sore throat
    gloss: I have a sore throat.
    note: Follows the same *avoir* pattern as the other symptoms.
  fr.a1.unit44.lesson02.teach.ca_va_non:
    title: Checking in on someone
    gloss: Are you OK? No, I don't feel well.
    note: '*Ça va ?* is a very common, casual check-in question among friends.'
  fr.a1.unit44.lesson03.teach.la_fievre:
    title: Fever
    gloss: a fever
    note: '*La fièvre* is feminine; after *avoir* it takes *de la*: *j''ai de la fièvre*.'
    example_gloss: I have a fever.
  fr.a1.unit44.lesson03.teach.j_ai_de:
    title: Having a fever
    gloss: I have a fever.
    note: Follows the *avoir* pattern, with the partitive *de la*.
  fr.a1.unit44.lesson03.teach.le_rhume:
    title: Having a cold
    gloss: having a cold / to have a cold
    note: '*Le rhume* is a masculine noun used with *avoir*, not an adjective used with *être*.'
    example_gloss: I have a cold.
  fr.a1.unit44.lesson03.teach.j_ai_un:
    title: Saying you have a cold
    gloss: I have a cold.
    note: French says *j'ai un rhume* ('I have a cold'); don't say *je suis rhume*.
  fr.a1.unit44.lesson03.teach.malade_se_dit:
    title: Être or avoir?
    gloss: '*Malade* is an adjective and uses *être*: I am sick. *Mal*, *fièvre* and *rhume* are nouns and use *avoir*: I have a cold.'
    note: 'The choice between *être* and *avoir* follows the word class: an adjective like *malade* goes with *être*, a noun like *fièvre* goes with *avoir*, however short the illness.'
  fr.a1.unit44.lesson04.teach.la_pharmacie:
    title: The pharmacy
    gloss: the pharmacy
    note: '*Pharmacie* is feminine: *la pharmacie*.'
    example_gloss: I'm going to the pharmacy.
  fr.a1.unit44.lesson04.teach.je_peux_vous:
    title: The pharmacist's greeting
    gloss: How can I help you?
    note: '*Je peux vous aider ?* is a standard formal service greeting; *vous* is the polite form.'
  fr.a1.unit44.lesson04.teach.avez_vous_quelque:
    title: Asking for something for a symptom
    gloss: Do you have something for a headache?
    note: '*Quelque chose contre* + symptom is the natural way to ask for a remedy.'
  fr.a1.unit44.lesson04.teach.un_comprime:
    title: A tablet
    gloss: a tablet / pill
    note: '*Comprimé* is masculine: *un comprimé*.'
    example_gloss: I take a tablet.
  fr.a1.unit44.lesson04.teach.prenez_un_comprime:
    title: Dosage instructions
    gloss: Take a tablet twice a day.
    note: '*Prenez* is the *vous* imperative of *prendre* (to take), used for instructions.'
  fr.a1.unit44.lesson04.teach.a_la_pharmacie:
    title: Register at the pharmacy
    gloss: At the pharmacy, you use the polite form *vous*.
    note: The pharmacist is an unfamiliar service-role adult, so you say *vous*, as at the ticket counter.
  fr.a1.unit44.lesson05.teach.conseil_prends_un:
    title: Read a pharmacy advice note
    gloss: 'Advice: take a tablet twice a day with water. Rest well and drink plenty of water. Do you still not feel well after three days? Then go to the doctor.'
    note: Track the dosage, the two non-medicine recommendations, and when to see a doctor.
    glosses:
      Conseil: advice
      prends: take
      fois: times
      jour: day
      comprimé: tablet
      Repose-toi: rest
      bois: drink
      sens: feel
      toujours: still
      bien: well
      médecin: doctor / GP
  fr.a1.unit44.lesson06.teach.camille_salut_mathieu:
    title: Camille checks in
    gloss: 'Camille: Hi Mathieu, how''s it going? Are you feeling better yet?'
    note: '*Déjà* (already) shows Camille is checking whether Mathieu has improved since they last spoke.'
  fr.a1.unit44.lesson06.teach.mathieu_pas_encore:
    title: Mathieu is still unwell
    gloss: 'Mathieu: Not so good yet. I still have a headache and I''m tired.'
    note: '*Toujours* (still) signals that the headache has not gone away; *fatigué* (tired) is a new, useful adjective.'
  fr.a1.unit44.lesson06.teach.camille_tu_as:
    title: Camille asks about the medicine
    gloss: 'Camille: Did you take a tablet?'
    note: '*Pris* is the past participle of *prendre*, used with *as* from *avoir*: *tu as pris*.'
  fr.a1.unit44.lesson06.teach.mathieu_oui_j:
    title: Mathieu confirms
    gloss: 'Mathieu: Yes, I took a tablet. I''m going to rest now.'
    note: '*Je vais me reposer* (going to rest) uses *aller* + infinitive for the near future.'
  fr.a1.unit44.lesson06.teach.camille_bonne_idee:
    title: Camille wishes him well
    gloss: 'Camille: Good idea. Rest well. Get well soon!'
    note: '*Bon rétablissement !* is the standard fixed expression for wishing someone a quick recovery.'
  fr.a1.unit44.lesson06.teach.mathieu_merci_a:
    title: Mathieu signs off
    gloss: 'Mathieu: Thanks, see you tomorrow!'
    note: '*À demain !* uses *à* + time for farewells: *à demain*, *à bientôt*.'
