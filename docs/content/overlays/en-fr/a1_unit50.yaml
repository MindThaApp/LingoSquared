teaching:
  fr.a1.unit50.lesson01.teach.appeler:
    title: To call
    gloss: to call
    note: The infinitive of the verb for making a phone call.
    example_gloss: I have to call you.
  fr.a1.unit50.lesson01.teach.je_t_appelle:
    title: Saying you'll call
    gloss: I'll call you.
    note: '*Appelle* is the *je* form of *appeler*; French uses the present tense here where English says ''will call''.'
  fr.a1.unit50.lesson01.teach.allo_c_est:
    title: Answering the phone
    gloss: Hello, this is Camille.
    note: '*C''est* + name is the standard French way to identify yourself on the phone, where English says ''this is''.'
  fr.a1.unit50.lesson01.teach.allo_c_est_2:
    title: Mathieu answers the same way
    gloss: Hello, this is Mathieu.
    note: Same *c'est* + name pattern as *Allô, c'est Camille*.
  fr.a1.unit50.lesson02.teach.qui_est_a:
    title: Asking who's calling
    gloss: Who am I speaking with?
    note: '*Qui est à l''appareil ?* is the standard way to ask an unfamiliar caller who they are.'
  fr.a1.unit50.lesson02.teach.vous_parlez_avec:
    title: Identifying yourself formally
    gloss: You're speaking with Camille.
    note: '*Vous parlez avec* + name is the formal counterpart to *c''est* + name.'
  fr.a1.unit50.lesson03.teach.tu_peux_repeter:
    title: Asking for repetition
    gloss: Can you repeat that?
    note: '*Tu peux ...* (Can you ...?) plus the infinitive *répéter* (to repeat).'
  fr.a1.unit50.lesson03.teach.ne_parle_pas:
    title: Asking someone to slow down
    gloss: Don't speak so fast, please.
    note: '*Ne parle pas si vite* negates the verb: *ne ... pas* wraps around *parle*, and *si* means ''so''.'
  fr.a1.unit50.lesson03.teach.je_ne_t:
    title: Saying you can't hear well
    gloss: I can't hear you well.
    note: '*Entendre* (to hear) with *ne ... pas bien* states a hearing problem, distinct from *comprendre* (to understand).'
  fr.a1.unit50.lesson04.teach.le_sms:
    title: Text message
    gloss: the text message
    note: '*SMS* is masculine: *un SMS*, borrowed directly from the English/international abbreviation.'
    example_gloss: The text message is from Camille.
  fr.a1.unit50.lesson04.teach.je_t_envoie:
    title: Saying you'll send a text
    gloss: I'll send you a text.
    note: '*Envoyer* (to send) takes the pronoun *te* (here *t''*) before the verb, then *un SMS*.'
  fr.a1.unit50.lesson04.teach.je_te_rappelle:
    title: Saying you'll call back
    gloss: I'll call you back later.
    note: '*Rappeler* (to call back) already carries the idea of ''back'' in *re-*; *plus tard* means ''later''.'
  fr.a1.unit50.lesson05.teach.mathieu_salut_camille:
    title: Read a text exchange
    gloss: 'Mathieu: Hi Camille, can you call me? I need to tell you something. Camille: Yes of course, I''ll call you back in five minutes.'
    note: Track what Mathieu asks for, why, and when Camille says she'll call back.
    glosses:
      Salut: hi
      peux: can
      m'appeler: call
      dois: need to / must
      truc: something
      dire: tell
      évidemment: of course
      rappelle: back
      cinq: five
      minutes: minutes
  fr.a1.unit50.lesson06.teach.mathieu_allo_c:
    title: Mathieu answers the call
    gloss: 'Mathieu: Hello, this is Mathieu.'
    note: 'The same *c''est* + name pattern from lesson 1, now used in the actual phone call: the person who picks up speaks first and gives their name.'
  fr.a1.unit50.lesson06.teach.camille_salut_mathieu:
    title: Camille identifies herself
    gloss: 'Camille: Hi Mathieu, this is Camille. Mathieu: Nice that you''re calling!'
    note: '*C''est sympa que* ... (nice that ...) expresses a positive reaction to an event; *appelles* is a special form you can simply memorize here.'
  fr.a1.unit50.lesson06.teach.camille_comment_s:
    title: Camille asks about the shift
    gloss: 'Camille: How was your first shift?'
    note: '*Comment s''est passé ... ?* uses the passé composé of *se passer* (to happen), formed with *être*, to ask how something went.'
  fr.a1.unit50.lesson06.teach.mathieu_ca_s:
    title: Mathieu reports good news
    gloss: 'Mathieu: It went really well, better than I thought.'
    note: '*Ça s''est très bien passé* and *je pensais* are fixed phrases here; *je pensais* is the imperfect of *penser* (to think).'
  fr.a1.unit50.lesson06.teach.au_passe_compose:
    title: Passé composé with avoir and être
    gloss: s'est passé → to happen, j'ai pensé → to think, je suis allé → to go
    note: 'The passé composé uses *avoir* or *être* + a participle: *j''ai pensé*, *je suis allé*. *Ça s''est passé* is a fixed phrase for ''it went''; for now, just memorize it in the contexts where it appears in this lesson.'
  fr.a1.unit50.lesson06.teach.camille_ca_fait:
    title: Camille is proud
    gloss: 'Camille: How nice to hear! I''m proud of you.'
    note: '*Fière de* (proud of) is a fixed combination; *de* is required, not *pour*; *fière* is feminine here.'
  fr.a1.unit50.lesson06.teach.mathieu_merci_beaucoup:
    title: Mathieu is touched
    gloss: 'Mathieu: Thank you, that means a lot to me.'
    note: '*Compter* means ''to matter'' here: *ça compte pour moi* (it matters to me); *pour moi* says who it matters to.'
  fr.a1.unit50.lesson06.teach.son_premier_service:
    title: His
    gloss: His first shift went really well.
    note: '*Son* here is the possessive ''his'', not a verb: *son premier service* (his first shift); *son* agrees with masculine *service*.'
