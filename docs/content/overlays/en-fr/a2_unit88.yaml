answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A2 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or liaison marks.
course:
  title: French A2
  description: Intermediate French continuing the Camille and Mathieu storyline, now with a grammar-led block on everyday functions.
  learning_goal: Talk about ability and availability with savoir, pouvoir and libre or occupé.
units:
  fr.a2.unit88.je_sais_nager:
    title: I can cook
    description: Say what you can and cannot do, what you know how to do, and when you are free or busy.
lessons:
  fr.a2.unit88.lesson01.je_sais:
    title: I know how to cook
  fr.a2.unit88.lesson02.savoir_ou_pouvoir:
    title: Savoir or pouvoir?
  fr.a2.unit88.lesson03.libre_ou_occupe:
    title: I am free on Saturday
  fr.a2.unit88.lesson04.ca_depend:
    title: It can happen
  fr.a2.unit88.lesson05.message_de_mathieu:
    title: Mathieu's message
  fr.a2.unit88.lesson06.camille_et_mathieu:
    title: Camille and Mathieu plan a dinner
teaching:
  fr.a2.unit88.lesson01.teach.verbes:
    title: Skills
    gloss: to swim / to cook / to drive / well / a little
    example_gloss:
    - I can swim.
    - He can cook a little.
    - We can drive.
    - She cooks well.
  fr.a2.unit88.lesson01.teach.gn_savoir:
    title: Savoir in the present
    gloss: I know how to, you know how to, he knows how to, we know how to, you know how to, they know how to
    note: '*Savoir* plus an infinitive says you have learned a skill. *Je sais* and *tu sais* sound the same.'
  fr.a2.unit88.lesson01.teach.gn_skill:
    title: A skill, not a permission
    gloss: I can swim. She can cook.
    note: English says 'can' for skills; French uses *savoir*, not *pouvoir*, when the ability was learned.
  fr.a2.unit88.lesson01.teach.gn_neg:
    title: Negation and degree
    gloss: I do not know how to drive. I can swim a little. You cook well.
    note: '*Ne ... pas* wraps around *sais*. *Un peu* and *bien* come after the infinitive or after the verb.'
  fr.a2.unit88.lesson01.teach.phrase:
    title: A skill
    gloss: I can cook.
  fr.a2.unit88.lesson02.teach.mots:
    title: Why you cannot
    gloss: today / tired (masc.) / too / to work
    example_gloss:
    - Today I am tired.
    - He is too tired.
    - I have to work.
  fr.a2.unit88.lesson02.teach.gn_contraste:
    title: Skill or circumstance
    gloss: I know how to swim. Today I cannot swim.
    note: '*Savoir* is a skill you have. *Pouvoir* is whether the situation lets you do it right now.'
  fr.a2.unit88.lesson02.teach.gn_raison:
    title: Giving a reason
    gloss: I cannot swim, I am too tired.
    note: After *je ne peux pas*, a short reason explains the circumstance. *Trop* means 'too (much)'.
  fr.a2.unit88.lesson02.teach.gn_deux:
    title: Both in one sentence
    gloss: He can cook, but he cannot cook today.
    note: The same activity can use *savoir* for the skill and *pouvoir* for the day.
  fr.a2.unit88.lesson02.teach.phrase:
    title: Not today
    gloss: I cannot swim today.
  fr.a2.unit88.lesson03.teach.mots:
    title: Availability
    gloss: free / busy (masc.) / to come / Monday / Tuesday / Saturday / Sunday
    example_gloss:
    - On Saturday, I am free.
    - On Monday, I am busy.
    - I am coming on Tuesday.
    - On Sunday, are you coming?
  fr.a2.unit88.lesson03.teach.gn_libre:
    title: Free or busy
    gloss: I am free on Saturday, but I am busy on Sunday. I am free, so I can come.
    note: '*Libre* and *occupé* describe your availability. A woman writes *occupée*; *libre* does not change.'
  fr.a2.unit88.lesson03.teach.gn_venir:
    title: Venir in the present
    gloss: I come, you come, he comes, we come, you come, they come
    note: '*Venir* is irregular. It is followed by a day: *je viens mardi*.'
  fr.a2.unit88.lesson03.teach.gn_pouvoir_venir:
    title: Can you come?
    gloss: I can come on Saturday. I cannot come on Monday, I am working.
    note: '*Je peux venir* plus a day says when you are available. A short reason after the comma explains a refusal.'
  fr.a2.unit88.lesson03.teach.phrase:
    title: Available
    gloss: I can come on Saturday.
  fr.a2.unit88.lesson04.teach.mots:
    title: Possibility
    gloss: yet, still / sometimes / the train / late
    example_gloss:
    - I do not know yet.
    - Sometimes the train is late.
    - Maybe Tuesday.
  fr.a2.unit88.lesson04.teach.gn_possible:
    title: Pouvoir for what might happen
    gloss: It might rain. The train might be late.
    note: '*Il peut* plus an infinitive says that something is possible. It is a general chance, not a promise.'
  fr.a2.unit88.lesson04.teach.gn_peutetre:
    title: Peut-être and pas encore
    gloss: I do not know yet. Maybe Tuesday.
    note: '*Ne ... pas encore* means ''not yet''. *Peut-être* gives a possible answer.'
  fr.a2.unit88.lesson04.teach.gn_parfois:
    title: Parfois
    gloss: Sometimes I can come late.
    note: '*Parfois* starts the sentence or follows the verb. It tells how often something is possible.'
  fr.a2.unit88.lesson04.teach.phrase:
    title: Not sure yet
    gloss: I do not know yet.
  fr.a2.unit88.lesson05.teach.mots:
    title: Words for the message
    gloss: to prepare / dinner / the guitar / to play (an instrument)
    example_gloss:
    - I can prepare dinner.
    - I can play the guitar.
  fr.a2.unit88.lesson05.teach.gn_jouer:
    title: Jouer de
    gloss: I can play the guitar. He plays the piano.
    note: 'For an instrument, French uses *jouer de* plus the article: *de la guitare*, *du piano* (*de + le = du*).'
  fr.a2.unit88.lesson05.teach.gn_combine:
    title: Skill and offer
    gloss: I can cook, so I can prepare dinner.
    note: 'A skill (*savoir*) can explain an offer (*pouvoir*): *alors* links them.'
  fr.a2.unit88.lesson05.teach.reading:
    title: Mathieu writes to Camille
    gloss: Hi Camille! On Saturday I am busy, but on Sunday I am free. I can cook a little, so I can prepare dinner. I cannot play the piano, but I can play the guitar. Mathieu
    note: Ability and availability appear together in one short message.
    glosses:
      dîner: dinner
      guitare: guitar
  fr.a2.unit88.lesson06.teach.q1:
    title: Camille asks
    gloss: 'Camille: Mathieu, can you cook?'
  fr.a2.unit88.lesson06.teach.a1:
    title: Mathieu answers
    gloss: 'Mathieu: A little. I can make pasta.'
  fr.a2.unit88.lesson06.teach.q2:
    title: Camille proposes
    gloss: 'Camille: Can you come on Saturday to cook?'
  fr.a2.unit88.lesson06.teach.a2:
    title: Mathieu declines
    gloss: 'Mathieu: On Saturday I cannot, I am busy. But I am free on Sunday.'
  fr.a2.unit88.lesson06.teach.q3:
    title: Camille accepts
    gloss: 'Camille: Perfect! And can you play the guitar?'
  fr.a2.unit88.lesson06.teach.a3:
    title: Mathieu closes
    gloss: 'Mathieu: Yes, a little. See you on Sunday, then!'
