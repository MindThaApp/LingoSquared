  fr.b1.unit27.lesson02.condition_irreelle:
    title: "If I had time"

teaching:
  fr.b1.unit27.lesson01.teach.refresher_temps:
    title: "To have time"
    gloss: "to have time"
    note: "Refresher for B1 standalone use: *avoir le temps* is the everyday phrase for having enough time."
    example_gloss: "I have time after the pastry shop."
  fr.b1.unit27.lesson01.teach.passer_mairie:
    title: "Stop by the town hall"
    gloss: "to stop by the town hall"
    note: "*Passer à* means to stop by a place, not to pass an exam."
    example_gloss: "I will stop by the town hall tomorrow."
  fr.b1.unit27.lesson01.teach.si_present_futur:
    title: "If I have time, I will..."
    gloss: "if + present, future"
    note: "For a real possible future condition, French uses present tense after *si*, not the future: *Si j'ai le temps, je passerai.*"
    example_gloss: "If I have time, I will stop by the town hall."
  fr.b1.unit27.lesson01.teach.service_finit_tot:
    title: "Finish early"
    gloss: "to finish early"
    note: "*Service* here means a work shift in the pastry shop context."
    example_gloss: "If my shift finishes early, I will go."
  fr.b1.unit27.lesson01.teach.real_condition_note:
    title: "Real condition"
    gloss: "possible condition + future result"
    note: "Use *si + present* for the condition, then a future result when the situation can really happen."

  fr.b1.unit27.lesson02.teach.si_imparfait_conditionnel:
    title: "If I had time, I would..."
    gloss: "if + imperfect, conditional"
    note: "For an unreal present condition, French uses the imperfect after *si* and the conditional for the result."
    example_gloss: "If I had time, I would stop by the town hall."
  fr.b1.unit27.lesson02.teach_si_pas_cours:
    title: "If I did not have class"
    gloss: "if I did not have class"
    note: "*Si je n'avais pas cours* is unreal here: Inès does have class."
    example_gloss: "If I did not have class, I would stay longer."
  fr.b1.unit27.lesson02.teach.regler_dossier:
    title: "Settle the file"
    gloss: "to settle the file / handle the application"
    note: "*Régler le dossier* means to sort out or settle the administrative matter."
    example_gloss: "I would finish everything to handle the application."
  fr.b1.unit27.lesson02.teach.contrast_note:
    title: "Possible vs unreal"
    gloss: "possible: present + future; unreal: imperfect + conditional"
    note: "English speakers often say \"if I will\" or overuse \"would\" in both clauses. French keeps the pairings strict."
  fr.b1.unit27.lesson02.teach.dialogue_line01:
    title: "Mathieu asks about tomorrow"
    gloss: "Mathieu asks whether Inès is going to stop by the town hall tomorrow."
  fr.b1.unit27.lesson02.teach.dialogue_line02:
    title: "Inès gives a real condition"
    gloss: "Inès says that if she has time, she will stop by after the pastry shop."
  fr.b1.unit27.lesson02.teach.dialogue_line03:
    title: "Mathieu asks an unreal condition"
    gloss: "Mathieu asks what would happen if she did not have class in the evening."
  fr.b1.unit27.lesson02.teach.dialogue_line04:
    title: "Inès gives an unreal result"
    gloss: "Inès says that if she did not have class, she would stay longer to settle the file."
  fr.b1.unit27.lesson02.teach.dialogue_line05:
    title: "Mathieu checks the meaning"
    gloss: "Mathieu confirms that tomorrow is possible, but not certain."
  fr.b1.unit27.lesson02.teach.dialogue_line06:
    title: "Inès contrasts both forms"
    gloss: "Inès says exactly: if her shift finishes early, she will go; if she had the whole day free, she would finish everything."

