  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names and titles (M. Bernard).
  spoken_answers: Judge spoken responses by intelligibility and appropriate formal register rather than written punctuation or liaison marks. A learner who addresses the mairie clerk with vous and conveys the right content should be judged correct even if phrasing differs slightly from the accepted answers.
