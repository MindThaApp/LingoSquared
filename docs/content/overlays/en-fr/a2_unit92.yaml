teaching:
  fr.a2.unit92.lesson01.teach.le_week_end:
    title: The weekend / last weekend
    gloss: the weekend / last weekend (the one that just ended)
    note: '*Le week-end* is masculine. *Le week-end dernier* means the weekend that has just passed, so it is the natural phrase for ''last weekend'' when you tell a story about it.'
    example_gloss:
    - The weekend starts on Saturday.
    - Last weekend I worked.
  fr.a2.unit92.lesson01.teach.samedi_dimanche:
    title: Saturday and Sunday
    gloss: Saturday / Sunday
    note: 'Day names are not capitalised in French unless they start a sentence: *samedi*, *dimanche*. With the article, *le samedi* means ''on Saturdays''.'
    example_gloss:
    - On Saturday I'm free.
    - On Sundays I sleep in.
  fr.a2.unit92.lesson01.teach.faire_les_courses:
    title: Doing errands
    gloss: to do the shopping / run errands
    note: '*Faire les courses* is the fixed phrase for doing the shopping and small errands. *Les courses* is plural.'
    example_gloss: Every Saturday I do the shopping.
  fr.a2.unit92.lesson01.teach.rendre_visite_a:
    title: Going to visit someone
    gloss: to go and visit (someone)
    note: '*Rendre visite à* + a person means to visit someone: *rendre visite à mon oncle*. You can also say *aller voir* (to go and see) someone.'
    example_gloss: I often go and visit my uncle.
  fr.a2.unit92.lesson01.teach.le_marche_le:
    title: Places to go at the weekend
    gloss: the market / the park / the cinema
    note: '*Le marché*, *le parc* and *le cinéma* are all masculine. With *à* they contract: *au marché*, *au cinéma* (à + le = au).'
    example_gloss:
    - I buy vegetables at the market.
    - I like walking in the park.
    - On Saturday I'm going to the cinema.
  fr.a2.unit92.lesson01.teach.travailler_cuisiner_manger:
    title: Four everyday verbs
    gloss: to work / to cook / to eat / to drink
    note: These are the infinitives. Later in this unit you will build their past forms.
    example_gloss:
    - I have to work today.
    - I can cook well.
    - I'd like to eat.
    - Would you like to drink coffee?
  fr.a2.unit92.lesson01.teach.qu_est_ce:
    title: Asking what someone did last weekend
    gloss: What did you do last weekend?
    note: This is the standard question. *Fait* is the participle of *faire*, and it comes right after *as*. In casual speech you can also say *Tu as fait quoi ?*
  fr.a2.unit92.lesson01.teach.samedi_j_ai:
    title: 'The passé composé: avoir/être + participle'
    gloss: On Saturday I did the shopping. On Sunday I went to my uncle's.
    note: 'The *passé composé* is the everyday way to talk about what you did. It has two parts: a present-tense form of *avoir* or *être*, followed directly by the *participe passé* (*fait*, *allé*). The helper verb carries the person (*j''ai*, *je suis*), the participle never changes with the person for most verbs. Most verbs use *avoir*; *aller* uses *être*. Lesson 3 explains when.'
  fr.a2.unit92.lesson02.teach.danser_jouer_nager:
    title: Four weekend activities
    gloss: to dance / to play / to swim / to sing
    note: '*Jouer* is used with *à* for games and sports (*jouer au football*) and with *de* for instruments (*jouer du piano*). *Danser*, *nager* and *chanter* are regular *-er* verbs.'
    example_gloss:
    - Shall we go for a walk?
    - Tomorrow I'm going to cycle.
    - The children want to play outside.
    - I want to exercise more often.
  fr.a2.unit92.lesson02.teach.travailler_travaille_cuisiner:
    title: 'Regular participles: -er → -é, -ir → -i, -re → -u'
    gloss: work → worked, cook → cooked, dance → danced, play → played, finish → finished, wait → waited
    note: 'Regular verbs build the participle from the infinitive: *-er* becomes *-é* (*travailler → travaillé*, *cuisiner → cuisiné*, *danser → dansé*, *jouer → joué*), *-ir* becomes *-i* (*finir → fini*) and *-re* becomes *-u* (*attendre → attendu*). Verbs in *-er* are by far the biggest group. The ending *-é* sounds like the infinitive ending *-er*, so the spelling is what you have to remember.'
  fr.a2.unit92.lesson02.teach.je_finis_j:
    title: Verbs in -ir and -re
    gloss: I finish. I have finished / I finished.
    note: 'Verbs in *-ir* take *-i* and verbs in *-re* take *-u*, never *-é*: *Je finis → J''ai fini*, *Je rends → J''ai rendu*, not *finé*.'
  fr.a2.unit92.lesson02.teach.j_ai_fait:
    title: Walking in the park
    gloss: I walked in the park.
    note: '*Faire une promenade* is the fixed phrase for taking a walk. *Faire* is irregular: its participle is *fait*.'
  fr.a2.unit92.lesson02.teach.j_ai_joue:
    title: Playing football
    gloss: I played football.
    note: 'For games and sports you use *jouer à*: *jouer au football* (à + le = au). The participle is *joué*.'
  fr.a2.unit92.lesson03.teach.avoir_etre:
    title: The two auxiliaries
    gloss: to have / to be
    note: 'In the passé composé, *avoir* and *être* are the helper verbs. Their present forms: *j''ai, je suis*; *il a, il est*; *tu as, tu es*.'
    example_gloss:
    - I'd like to have a bike too.
    - It can be fun.
  fr.a2.unit92.lesson03.teach.voir_vu_lire:
    title: 'Irregular participles: learn them as whole words'
    gloss: see → seen, read → read, drink → drunk, take → taken, do → done, have → had, write → written
    note: 'Many common verbs have an irregular participle that you learn as a whole word: *vu, lu, bu, pris, fait, eu, écrit*. Many of them end in *-u*, *-is* or *-it*. A good habit is to learn each participle together with its infinitive.'
  fr.a2.unit92.lesson03.teach.j_ai_vu:
    title: Watching a film
    gloss: I saw a film.
    note: French says *voir un film* for going to the cinema or for watching at home. *Voir* has the irregular participle *vu*.
  fr.a2.unit92.lesson03.teach.j_ai_dormi:
    title: Two participles in one sentence
    gloss: I slept for a long time and read a book.
    note: 'Each verb keeps its own helper verb: *J''ai dormi longtemps et j''ai lu un livre.* Repeat *j''ai* before the second participle.'
  fr.a2.unit92.lesson03.teach.j_ai_rendu:
    title: 'A participle to learn: rendre → rendu'
    gloss: I visited my uncle.
    note: '*Rendre visite à* uses *avoir*, and *rendre* has the regular *-re* participle *rendu*. *J''ai rendu visite à mon oncle* and *Je suis allé chez mon oncle* mean nearly the same.'
  fr.a2.unit92.lesson03.teach.j_ai_vu_2:
    title: Avoir or être?
    gloss: I saw a film. I went to my uncle's. I stayed at home. I arrived late. I left early.
    note: '*Avoir* is the default helper: *J''ai travaillé, j''ai vu un film*. Use *être* for a small group of verbs of movement and change, such as *aller, venir, arriver, partir, rester*, and for all reflexive verbs. With *être* the participle agrees with the subject: *Je suis allé* (a man), *Je suis allée* (a woman), *Elle est restée*. With *avoir* the participle does not agree with the subject: *J''ai vu*, whoever speaks. Careful: *être* itself takes *avoir*: *Le week-end a été tranquille*.'
  fr.a2.unit92.lesson03.teach.aller_alle_venir:
    title: Verbs of movement and change (with être)
    gloss: go → gone, come → come, stay → stayed, become → become, be → been
    note: 'These five verbs form the passé composé with *être*: *je suis allé, je suis venu, je suis resté, je suis parti, je suis arrivé*. A woman adds *-e*: *je suis allée, je suis restée*.'
  fr.a2.unit92.lesson04.teach.d_abord_ensuite:
    title: First and then
    gloss: first / after that
    note: '*D''abord* and *ensuite* put actions in order. They are the connectors you need to tell a weekend story in sequence.'
    example_gloss:
    - First I work, then I go and exercise.
    - First I eat, then I drink coffee.
  fr.a2.unit92.lesson04.teach.d_abord_je:
    title: 'Telling it in order: d''abord, ensuite'
    gloss: First I went to the market, then I cooked.
    note: 'After *d''abord* or *ensuite* the word order does not change: subject, helper verb, participle. *Ensuite, j''ai cuisiné.* The participle stays right after the helper verb.'
  fr.a2.unit92.lesson04.teach.je_n_ai:
    title: 'Saying what you did not do: ne ... pas'
    gloss: I didn't work. I didn't read the book. I didn't go to my uncle's.
    note: 'In the passé composé, *ne ... pas* wraps around the helper verb: *Je n''ai pas travaillé*, *Je ne suis pas allé chez mon oncle*. The participle comes after *pas*. *Ne* becomes *n''* before a vowel (*n''ai*). In casual speech *ne* is often dropped, but write it in full.'
  fr.a2.unit92.lesson04.teach.je_n_ai_2:
    title: 'Saying you had none: pas de'
    gloss: I didn't drink any coffee. I didn't have time.
    note: 'After a negation, *un, une, du, des* become *de* (*d''* before a vowel): *un film → pas de film*, *du café → pas de café*. The definite article stays: *Je n''ai pas lu le livre*, *Je n''ai pas eu le temps*. *Eu* is the participle of *avoir*.'
  fr.a2.unit92.lesson04.teach.tu_as_fait:
    title: Camille asks about exercise
    gloss: 'Camille: Did you exercise?'
    note: 'In spoken French a yes/no question keeps the normal word order and rises at the end: *Tu as fait du sport ?* The written alternative is *As-tu fait du sport ?*'
  fr.a2.unit92.lesson04.teach.non_je_n:
    title: Mathieu says no
    gloss: 'Mathieu: No, I didn''t exercise.'
  fr.a2.unit92.lesson05.teach.salut_camille_le:
    title: A message from Nina
    gloss: Hi Camille! It was a quiet weekend. On Saturday morning I went to the market and bought bread. In the afternoon I walked in the park. In the evening I cooked. I didn't exercise and I didn't see a film. On Sunday I stayed at home. I slept for a long time and read a book.
    note: 'Nina is telling Camille about her weekend in order: Saturday morning, afternoon and evening, then Sunday. Notice that she writes *je suis allée* and *je suis restée*: with *être* the participle agrees with the speaker. *L''après-midi* and *le soir* mean ''in the afternoon'' and ''in the evening''. *A été* (from *être*) takes *avoir*.'
    glosses:
      Salut: hi
      tranquille: quiet, calm
      week-end: weekend
      été: been (participle of être; être itself takes avoir)
      matin: morning (samedi matin = Saturday morning)
      marché: market
      pain: bread
      acheté: bought (participle of acheter)
      L'après-midi: in the afternoon
      parc: park
      promenade: walk (faire une promenade = to take a walk)
      soir: in the evening (le soir)
      cuisiné: cooked (participle of cuisiner)
      pas: not
      sport: sport (faire du sport = to exercise)
      de: of, any (pas de = no, not any)
      film: film
      vu: seen (participle of voir)
      Dimanche: Sunday
      restée: stayed (participle of rester)
      longtemps: long, for a long time
      dormi: slept (participle of dormir)
      livre: book
      lu: read (participle of lire)
  fr.a2.unit92.lesson06.teach.salut_mathieu_qu:
    title: Camille asks Mathieu about his weekend
    gloss: 'Camille: Hi Mathieu! What did you do last weekend?'
  fr.a2.unit92.lesson06.teach.samedi_je_suis:
    title: Mathieu describes Saturday
    gloss: 'Mathieu: On Saturday I went to my uncle''s in Lyon. I ate at my uncle''s.'
    note: '*Chez mon oncle* means both ''at my uncle''s place'' and ''to my uncle''s'': *chez* + a person is how French says ''at/to someone''s home''.'
  fr.a2.unit92.lesson06.teach.sympa_et_dimanche:
    title: Camille asks about Sunday
    gloss: 'Camille: Nice! And Sunday?'
  fr.a2.unit92.lesson06.teach.dimanche_je_suis:
    title: Mathieu describes Sunday and asks back
    gloss: 'Mathieu: On Sunday I stayed at home. I slept for a long time and I didn''t exercise. And you?'
  fr.a2.unit92.lesson06.teach.je_suis_allee:
    title: Camille describes her weekend
    gloss: 'Camille: I went to my parents''. I didn''t do any shopping, but I cooked.'
