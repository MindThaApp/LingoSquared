exercises:
  fr.b1.unit32.lesson01.exercise01.select_first_event:
    instruction: "Which event happens first?"
    correct_option: "The list will be ready"
    distractors: ["Inès will send it to the chef", "The chef will prepare the orders"]
    accepted_answers: ["The list will be ready"]
  fr.b1.unit32.lesson01.exercise02.listen_quand:
    instruction: "Listen and select the exact sentence you hear."
    correct_option: "Quand la liste sera prête, je l'enverrai au chef."
    distractors: ["Si la livraison arrive avant midi, nous finirons les commandes aujourd'hui.", "Dès que le chef répondra, je préparerai les commandes."]
    accepted_answers: ["Quand la liste sera prête, je l'enverrai au chef."]
  fr.b1.unit32.lesson01.exercise03.match_quand_sequence:
    instruction: "Match each French time-clause phrase to English."
    correct_response:
      "quand": "when"
      "la liste sera prête": "the list is ready"
      "je l'enverrai": "I will send it"
      "au chef": "to the chef"
      "après": "after"
      "l'événement suivant": "the following event"
  fr.b1.unit32.lesson01.exercise04.order_quand:
    instruction: "Build the future time-clause sentence: When the list is ready, I will send it to the chef."
    correct_response: ["Quand", "la", "liste", "sera", "prête", "je", "l'enverrai", "au", "chef"]
  fr.b1.unit32.lesson01.exercise05.write_quand:
    instruction: "Write exactly this future time-clause sentence with *quand* plus future, then future: *Quand la liste sera prête, je l'enverrai au chef.*"
    accepted_answers:
      - status: correct
        value: "Quand la liste sera prête, je l'enverrai au chef."
      - status: correct
        value: "Quand la liste sera prête, je l'enverrai au chef"
  fr.b1.unit32.lesson02.exercise01.select_following_event:
    instruction: "Which event happens after the chef replies?"
    correct_option: "Inès will prepare the orders"
    distractors: ["The list will be late", "Mathieu will notify the chef"]
    accepted_answers: ["Inès will prepare the orders"]
  fr.b1.unit32.lesson02.exercise02.comprehend_dialogue:
    instruction: "Listen to the dialogue. What will Inès do as soon as the chef replies?"
    correct_option: "She will prepare the orders"
    distractors: ["She will send the list to Mathieu", "She will cancel the delivery"]
    accepted_answers: ["She will prepare the orders"]
  fr.b1.unit32.lesson02.exercise03.match_des_que_sequence:
    instruction: "Match each French future sequence phrase to English."
    correct_response:
      "dès que": "as soon as"
      "le chef répondra": "the chef replies"
      "je préparerai": "I will prepare"
      "les commandes": "the orders"
      "tout sera confirmé": "everything is confirmed"
      "je te préviendrai": "I will let you know"
  fr.b1.unit32.lesson02.exercise04.order_des_que:
