answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A1
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation or liaison marks.

course:
  title: "French A1"
  description: >-
    Expressing and asking about basic likes, dislikes, and preferences,
    continuing Inès and Mathieu's cooking-workshop narrative as they choose
    between two recipes for Saturday. English-specific guidance highlights
    that *préférer X à Y* (to prefer X to Y) uses *à*, not *que*.

units:
  fr.a1.unit13.preferences:
    title: "What do you prefer?"

lessons:
  fr.a1.unit13.lesson01.vocabulaire_preferences:
    title: "Like, prefer, hate"
  fr.a1.unit13.lesson02.demander_les_preferences:
    title: "Asking about preferences"
  fr.a1.unit13.lesson03.dialogue_choisir_la_recette:
    title: "Choosing Saturday's recipe"

teaching:
  fr.a1.unit13.lesson01.teach.preferer:
    title: "To prefer"
    gloss: "to prefer"
    note: "*Préférer* is a stem-changing -ER verb: *je préfère*, but *nous préférons* (no accent change in the *nous/vous* forms)."
    example_gloss: "I prefer the chocolate tart."
  fr.a1.unit13.lesson01.teach.aimer_mieux:
    title: "To like better"
    gloss: "to like better"
    note: "*Aimer mieux* is a common alternative to *préférer*, used the same way."
    example_gloss: "I like savory dishes better than sweet dishes."
  fr.a1.unit13.lesson01.teach.detester:
    title: "To hate"
    gloss: "to hate"
    note: "*Détester* is a strong dislike, stronger than *ne pas aimer* (to not like)."
    example_gloss: "Mathieu hates spices that are too strong; he prefers mild dishes."
  fr.a1.unit13.lesson01.teach.plutot:
    title: "Rather"
    gloss: "rather"
    note: "*Plutôt* softens a preference -- \"rather\" this one, without ruling out the alternative entirely."
    example_gloss: "I'll have cheese instead."
  fr.a1.unit13.lesson01.teach.sucre:
    title: "Sweet"
    gloss: "sweet"
    note: "*Sucré* describes food, distinct from *doux* (soft/mild), a common mix-up for English speakers."
    example_gloss: "This dessert is very sweet."
  fr.a1.unit13.lesson01.teach.sale:
    title: "Savory / salty"
    gloss: "savory / salty"
    note: "*Salé* is the standard opposite of *sucré* in French food vocabulary, covering both \"savory\" and \"salty\" senses."
    example_gloss: "The cheese is salty."
  fr.a1.unit13.lesson01.teach.la_recette:
    title: "The recipe"
    gloss: "the recipe"
    note: "*La recette* is always feminine."
    example_gloss: "This recipe is easy."

  fr.a1.unit13.lesson02.teach.quest_ce_que_tu_preferes:
    title: "Ask a preference"
    gloss: "What do you prefer?"
    note: "*Qu'est-ce que...* is the standard way to form an open \"what\" question in spoken French."
  fr.a1.unit13.lesson02.teach.je_prefere_x_a_y:
    title: "State a preference between two things"
    gloss: "I prefer the tart to the quiche."
    note: "*Préférer X à Y* uses *à* to introduce the less-preferred option -- not *que*, a common mistake for English speakers used to \"prefer X over/to Y.\""
  fr.a1.unit13.lesson02.teach.tu_aimes_plutot:
    title: "Ask about a general tendency"
    gloss: "Do you tend to like sweet or savory?"
    note: "Combines *plutôt* (lesson01) with an *ou* (or) choice question."
  fr.a1.unit13.lesson02.teach.moi_aussi_moi_non:
    title: "Agree or disagree"
    gloss: "Me too. / Not me."
    note: "*Moi aussi* agrees with a positive statement; *moi non* disagrees, or states the opposite preference."
  fr.a1.unit13.lesson02.teach.ca_ne_me_derange_pas:
    title: "Say you don't mind"
    gloss: "I don't mind."
    note: "*Ça ne me dérange pas* is a useful, neutral way to accept either option when asked to choose."
  fr.a1.unit13.lesson02.teach.on_pourrait_faire:
    title: "Suggest an option"
    gloss: "We could make a quiche, couldn't we?"
    note: "*On pourrait* (we could) + infinitive gently suggests an option, inviting agreement with the tag *non ?*"

  fr.a1.unit13.lesson03.teach.line01:
    title: "Ask what to make"
    gloss: "Mathieu asks what they're making Saturday -- a tart or a quiche?"
    note: "*Qu'est-ce qu'on prépare... ?* (what are we making) reuses the impersonal *on* for \"we\" in casual speech."
  fr.a1.unit13.lesson03.teach.line02:
    title: "State a preference and ask back"
    gloss: "Inès says she prefers the tart, on the sweeter side, and asks Mathieu."
    note: "*Et toi ?* (and you?) is the simplest way to turn a statement into a question for the other person."
  fr.a1.unit13.lesson03.teach.line03:
    title: "State the opposite preference"
    gloss: "Mathieu says he likes savory better, and prefers the quiche to the tart."
    note: "Reuses lesson02's *préférer X à Y* pattern directly."
  fr.a1.unit13.lesson03.teach.line04:
    title: "Propose a compromise"
    gloss: "Inès suggests they could make both, couldn't they?"
    note: "*Les deux* (both) resolves the disagreement by proposing to make both recipes."
  fr.a1.unit13.lesson03.teach.line05:
    title: "Accept the compromise"
    gloss: "Mathieu says good idea, he doesn't mind at all."
    note: "*Ça ne me dérange pas du tout* intensifies lesson02's phrase with *du tout* (at all)."
  fr.a1.unit13.lesson03.teach.line06:
    title: "Confirm the decision"
    gloss: "Inès says perfect, a sweet tart and a savory quiche for Saturday."
    note: "Restates the final decision clearly, closing the exchange."

exercises:
  fr.a1.unit13.lesson01.exercise01.select_preferer:
    instruction: "Which word means \"to prefer\"?"
    correct_option: "préférer"
    distractors: ["détester", "la recette"]
    accepted_answers: ["préférer"]

  fr.a1.unit13.lesson01.exercise02.listen_je_prefere:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Je préfère la tarte au chocolat."
    distractors: ["Je déteste le chocolat.", "J'aime mieux la quiche."]
    accepted_answers: ["Je préfère la tarte au chocolat.", "Je préfère la tarte au chocolat"]

  fr.a1.unit13.lesson01.exercise03.match_preference_words:
    instruction: "Match each French word to its English meaning."
    correct_response:
      préférer: "to prefer"
      "aimer mieux": "to like better"
      détester: "to hate"
      plutôt: "rather"
      sucré: "sweet"
      salé: "savory / salty"
      "la recette": "the recipe"

  fr.a1.unit13.lesson01.exercise04.order_je_prefere_tarte:
    instruction: "Build the sentence: I prefer the chocolate tart."
    correct_response: ["Je", "préfère", "la", "tarte", "au", "chocolat"]

  fr.a1.unit13.lesson01.exercise05.fill_sucre:
    instruction: "Complete the sentence with the word for \"sweet.\""
    accepted_answers: ["sucré"]

  fr.a1.unit13.lesson01.exercise06.speak_your_preference:
    instruction: "Say whether you prefer sweet or savory."
    accepted_answers:
      - "Je préfère le sucré."
      - "Je préfère le salé."
      - "J'aime mieux le sucré."
      - "J'aime mieux le salé."

  fr.a1.unit13.lesson02.exercise01.select_quest_ce_que_tu_preferes:
    instruction: "Which question asks what someone prefers?"
    correct_option: "Qu'est-ce que tu préfères ?"
    distractors: ["Vous habitez dans le quartier ?", "C'est combien, le fromage ?"]
    accepted_answers: ["Qu'est-ce que tu préfères ?", "Qu'est-ce que tu préfères"]

  fr.a1.unit13.lesson02.exercise02.listen_quest_ce_que_tu_preferes:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Qu'est-ce que tu préfères ?"
    distractors: ["Tu aimes plutôt le sucré ou le salé ?", "On pourrait faire une quiche, non ?"]
    accepted_answers: ["Qu'est-ce que tu préfères ?", "Qu'est-ce que tu préfères"]

  fr.a1.unit13.lesson02.exercise03.match_preference_phrases:
    instruction: "Match each French phrase to its English meaning."
    correct_response:
      "Qu'est-ce que tu préfères ?": "What do you prefer?"
      "Je préfère la tarte à la quiche.": "I prefer the tart to the quiche."
      "Tu aimes plutôt le sucré ou le salé ?": "Do you tend to like sweet or savory?"
      "Moi aussi.": "Me too."
      "Ça ne me dérange pas.": "I don't mind."

  fr.a1.unit13.lesson02.exercise04.order_je_prefere_tarte_quiche:
    instruction: "Build the sentence: I prefer the tart to the quiche."
    correct_response: ["Je", "préfère", "la", "tarte", "à", "la", "quiche"]

  fr.a1.unit13.lesson02.exercise05.fill_pourrait:
    instruction: "Complete the sentence with the word for \"could.\""
    accepted_answers: ["pourrait"]

  fr.a1.unit13.lesson02.exercise06.reply_state_preference:
    instruction: "Answer: say you prefer the tart to the quiche."
    accepted_answers:
      - "Je préfère la tarte à la quiche."
      - "Je préfère la tarte à la quiche"

  fr.a1.unit13.lesson03.exercise01.comprehend_ines_preference:
    instruction: "Listen to the dialogue. What does Inès prefer?"
    correct_option: "The tart, on the sweeter side"
    distractors: ["The quiche, on the savory side", "Both equally"]
    accepted_answers: ["The tart, on the sweeter side"]

  fr.a1.unit13.lesson03.exercise02.comprehend_mathieu_preference:
    instruction: "What does Mathieu prefer?"
    correct_option: "The quiche, on the savory side"
    distractors: ["The tart, on the sweeter side", "Neither"]
    accepted_answers: ["The quiche, on the savory side"]

  fr.a1.unit13.lesson03.exercise03.select_what_they_decide:
    instruction: "What do Inès and Mathieu decide to make?"
    correct_option: "A sweet tart and a savory quiche"
    distractors: ["Just a tart", "Just a quiche"]
    accepted_answers: ["A sweet tart and a savory quiche"]

  fr.a1.unit13.lesson03.exercise04.order_moi_jaime_mieux:
    instruction: "Build Mathieu's sentence about his own preference."
    correct_response: ["Moi", "j'aime", "mieux", "le", "salé"]

  fr.a1.unit13.lesson03.exercise05.reply_propose_both:
    instruction: "Take Inès's role. Suggest they could make both."
    accepted_answers:
      - "On pourrait faire les deux, non ?"
      - "On pourrait faire les deux."

  fr.a1.unit13.lesson03.exercise06.speak_state_both_preferences:
    instruction: "Explain out loud what Inès and Mathieu each prefer."
    accepted_answers:
      - "Inès préfère la tarte, Mathieu préfère la quiche."
      - "Inès préfère la tarte et Mathieu préfère la quiche."
      - "Elle préfère la tarte, il préfère la quiche."
      - "Elle préfère la tarte et il préfère la quiche."

  fr.a1.unit13.lesson01.exercise07.dictation_je_prefere:
    instruction: "Type what you hear."
    correct_option: "Je préfère la tarte au chocolat"
    accepted_answers: [{value: "Je préfère la tarte au chocolat", status: correct}]
    orthography_strict: true
