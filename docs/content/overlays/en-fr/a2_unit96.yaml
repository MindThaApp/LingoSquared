teaching:
  fr.a2.unit96.lesson01.teach.mots:
    title: Before doing something
    gloss: before (doing) / to leave / to eat / to work / the window / the hands
    example_gloss:
    - Before eating, I wash my hands.
    - Before leaving, I close the window.
    - I have a coffee before working.
  fr.a2.unit96.lesson01.teach.gn_avant:
    title: Avant de plus infinitive
    gloss: Before eating, I wash my hands.
    note: '*Avant de* plus an infinitive says what happens first. Both actions have the same subject.'
  fr.a2.unit96.lesson01.teach.gn_place:
    title: Two places for the clause
    gloss: I have a coffee before working. Before working, I have a coffee.
    note: The *avant de* clause can come last or first. In both sentences the coffee comes before the work.
  fr.a2.unit96.lesson01.teach.gn_elision:
    title: Avant d' before a vowel
    gloss: Before arriving, I call Camille. Before going to work, I eat.
    note: 'Before a vowel sound, *de* becomes *d''*: *avant d''arriver*, *avant d''aller*.'
  fr.a2.unit96.lesson01.teach.phrase:
    title: Before leaving
    gloss: Before leaving, I close the window.
  fr.a2.unit96.lesson02.teach.mots:
    title: After doing something
    gloss: after / to finish / to go home / to rest / the plates
    example_gloss:
    - After eating, I wash the plates.
    - After finishing, I go home.
    - After getting home, I rest.
  fr.a2.unit96.lesson02.teach.gn_avoir:
    title: Après avoir plus participle
    gloss: After eating, I wash the plates. After finishing, I go home.
    note: '*Après avoir* plus a past participle says what already happened. The participle is the one you know from the passé composé.'
  fr.a2.unit96.lesson02.teach.gn_etre:
    title: Après être for movement verbs
    gloss: After getting home, I rest. After getting home, she rests.
    note: 'Verbs like *rentrer* use *être*. The participle agrees with the subject: *rentrée* for a woman.'
  fr.a2.unit96.lesson02.teach.gn_contraste:
    title: Avant de or après avoir
    gloss: Before leaving, I eat. After eating, I leave.
    note: The same two actions can be ordered either way. *Avant de* looks forward, *après avoir* looks back.
  fr.a2.unit96.lesson02.teach.phrase:
    title: After eating
    gloss: After eating, I wash the plates.
  fr.a2.unit96.lesson03.teach.mots:
    title: Steps in order
    gloss: first / next / then / finally / the station
    example_gloss:
    - First, I take the bus.
    - Next, I take the train.
    - Then I walk, and finally I arrive at the station.
  fr.a2.unit96.lesson03.teach.gn_serie:
    title: Step words
    gloss: First, I take the bus. Next, I take the train. Finally, I arrive.
    note: '*D''abord*, *ensuite* and *enfin* mark the first, the middle and the last step. Use one word per step.'
  fr.a2.unit96.lesson03.teach.gn_puis:
    title: Puis
    gloss: I take the bus, then the train.
    note: '*Puis* means ''then''. It can join two steps in one sentence, so you do not repeat the verb.'
  fr.a2.unit96.lesson03.teach.gn_enfin:
    title: Enfin
    gloss: Finally, I arrive at the station.
    note: '*Enfin* marks the last step. It comes at the start of the sentence, followed by a comma.'
  fr.a2.unit96.lesson03.teach.phrase:
    title: The first step
    gloss: First, I take the bus.
  fr.a2.unit96.lesson04.teach.mots:
    title: When something happens
    gloss: when / to buy / a ticket / to call / it rains
    example_gloss:
    - When I arrive at the station, I buy a ticket.
    - When it rains, I take the bus.
    - I call Camille when I arrive.
  fr.a2.unit96.lesson04.teach.gn_quand:
    title: Quand plus present
    gloss: When I arrive at the station, I buy a ticket.
    note: '*Quand* plus the present describes what you do each time, or what happens next in a routine. Both verbs are in the present.'
  fr.a2.unit96.lesson04.teach.gn_ordre:
    title: Two places for quand
    gloss: I call Camille when I arrive. When I arrive, I call Camille.
    note: The *quand* clause can come first or last. After a first clause, use a comma; at the end, no comma.
  fr.a2.unit96.lesson04.teach.gn_trois:
    title: Three time links
    gloss: Before leaving, I eat. When I arrive, I call. After eating, I leave.
    note: '*Avant de*, *quand* and *après avoir* each place an event in time.'
  fr.a2.unit96.lesson04.teach.phrase:
    title: When I arrive
    gloss: When I arrive, I call Camille.
  fr.a2.unit96.lesson05.teach.mots:
    title: Words for the message
    gloss: here is, here comes / at your place / the park / we go
    example_gloss:
    - Here is my Saturday.
    - Finally, I arrive at your place!
    - After eating, we go to the park.
  fr.a2.unit96.lesson05.teach.gn_chez:
    title: Chez
    gloss: I am at your place. He is at my place.
    note: '*Chez* plus a person means ''at that person''s home''. After *chez*, use *moi*, *toi*, not *je*, *tu*.'
  fr.a2.unit96.lesson05.teach.gn_nous:
    title: Nous in the present
    gloss: We go to the park. We eat at your place.
    note: '*Nous allons* is the *nous* form of *aller*. *Nous mangeons* works the same way for *manger*.'
  fr.a2.unit96.lesson05.teach.reading:
    title: Mathieu writes to Camille
    gloss: Hi Camille! Here is my Saturday. First, I take the bus. When I arrive at the station, I buy a ticket. Next, I take the train. Finally, I arrive at your place! After eating, we go to the park. Mathieu
    note: Time links order the whole trip in one short message.
    glosses:
      gare: station
      billet: ticket
      parc: park
  fr.a2.unit96.lesson06.teach.q1:
    title: Camille asks how
    gloss: 'Camille: Mathieu, how are you coming on Saturday?'
  fr.a2.unit96.lesson06.teach.a1:
    title: Mathieu gives the steps
    gloss: 'Mathieu: First, I take the bus. Next, I take the train.'
  fr.a2.unit96.lesson06.teach.q2:
    title: Camille asks about the call
    gloss: 'Camille: And when you arrive, will you call me?'
  fr.a2.unit96.lesson06.teach.a2:
    title: Mathieu promises
    gloss: 'Mathieu: Yes! Before leaving the station, I call you.'
  fr.a2.unit96.lesson06.teach.q3:
    title: Camille plans the park
    gloss: 'Camille: Perfect! After eating, we go to the park.'
  fr.a2.unit96.lesson06.teach.a3:
    title: Mathieu agrees
    gloss: 'Mathieu: Great! See you Saturday!'
