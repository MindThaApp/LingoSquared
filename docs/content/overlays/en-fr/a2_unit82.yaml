  fr.a2.unit82.lesson05.le_texte_de_camille:
    title: When Camille was little
  fr.a2.unit82.lesson06.mathieu_et_camille:
    title: Mathieu and Camille talk about childhood
teaching:
  fr.a2.unit82.lesson01.teach.temps:
    title: Words for the past
    gloss: before / in the past / often / every day
    note: These words often signal a habit or a situation in the past.
    example_gloss:
    - Before, I lived in the countryside.
    - In the past, we played outside.
    - I often watched TV.
    - Every day I played outside.
  fr.a2.unit82.lesson01.teach.verbes:
    title: Four everyday verbs
    gloss: to live / to play / to watch / to like
    note: '*La campagne* is the countryside; *dehors* means outside; *la télé* is short for *la télévision*.'
    example_gloss:
    - I used to live in the countryside.
    - We used to play outside.
    - My brother used to watch TV.
    - I used to like chocolate.
  fr.a2.unit82.lesson01.teach.gn_formation:
    title: 'The imparfait: endings'
    gloss: I used to live, you used to play, he used to watch, we used to like, you used to live, they used to play
    note: 'The imparfait describes habits and situations in the past. Endings: *-ais, -ais, -ait, -ions, -iez, -aient*. The endings are the same for every verb.'
  fr.a2.unit82.lesson01.teach.gn_radical:
    title: The stem of the imparfait
    gloss: we play → I used to play. we finish → I used to finish. we do → I used to do.
    note: Take the *nous* form of the present, drop its ending, and add the imparfait endings. This works for almost every verb.
  fr.a2.unit82.lesson01.teach.phrase:
    title: Before and outside
    gloss: Before, I lived in the countryside and I played outside.
  fr.a2.unit82.lesson02.teach.mots:
    title: Describing childhood
    gloss: little / happy / a garden / a cat
    note: '*Petit* and *content* take an extra *-e* for a girl: *petite*, *contente*.'
    example_gloss:
    - When I was little, I had a cat.
    - The garden was big.
    - I was happy.
  fr.a2.unit82.lesson02.teach.gn_etre:
    title: Être in the imparfait
    gloss: I was, you were, he was, we were, you were, they were
    note: '*Être* is the only irregular verb in the imparfait: the stem is *ét-*, but the endings are the usual ones.'
  fr.a2.unit82.lesson02.teach.gn_avoir:
    title: Avoir and faire in the imparfait
    gloss: I had, you had, he had, we had, you had, they had. we did.
    note: 'Regular stems: *av-* for *avoir*, *fais-* for *faire* (from *nous faisons*).'
  fr.a2.unit82.lesson02.teach.gn_decrire:
    title: Describing the past
    gloss: When I was little, I had a cat and a garden.
    note: 'The imparfait is the tense for descriptions: how things were, what someone had, what someone was like.'
  fr.a2.unit82.lesson02.teach.phrase:
    title: A childhood
    gloss: When I was little, I had a cat and we had a big garden.
  fr.a2.unit82.lesson03.teach.maintenant:
    title: Now
    gloss: now / today / still / in town
    example_gloss:
    - Now I live in the city.
    - Today I am working.
    - Now I play at home.
    - I still like chocolate.
  fr.a2.unit82.lesson03.teach.gn_contraste:
    title: Before and now
    gloss: Before, I lived in the countryside. Now I live in the city.
    note: Use the imparfait for how things used to be, and the présent for how they are now. *Avant* and *maintenant* mark the contrast.
  fr.a2.unit82.lesson03.teach.gn_plus:
    title: Ne ... plus
    gloss: I no longer eat sweets. We no longer eat sweets. I no longer play outside.
    note: '*Ne ... plus* means ''no longer''. Like *ne ... pas*, it wraps around the verb. After it, *des/du* becomes *de*.'
  fr.a2.unit82.lesson03.teach.gn_orthographe:
    title: Spelling with manger
    gloss: eat → I used to eat, we used to eat
    note: 'Verbs in *-ger* keep an *e* before *a*: *je mangeais* but *nous mangions*, so the *g* stays soft.'
  fr.a2.unit82.lesson03.teach.phrase:
    title: Eating then and now
    gloss: Before, I ate sweets. Now I no longer eat sweets.
  fr.a2.unit82.lesson04.teach.habitudes:
    title: Daily habits
    gloss: school / in the evening / on weekends / sometimes / on foot
    note: '*Le soir* and *le week-end* with *le* mean ''in the evening'' and ''on weekends'' as a habit.'
    example_gloss:
    - I used to walk to school.
    - In the evening we used to watch TV.
    - On weekends we used to go to my grandparents'.
    - Sometimes I took the bus.
  fr.a2.unit82.lesson04.teach.gn_irreguliers:
    title: Common verbs in the imparfait
    gloss: I used to go, I used to come, I used to take, I used to see, I used to do, they used to take
    note: 'These verbs are not irregular here: the stem is the *nous* form (*all-, ven-, pren-, voy-, fais-*) plus *-ais*.'
  fr.a2.unit82.lesson04.teach.gn_habitudes:
    title: Telling habits
    gloss: Every day I walked to school. On weekends we went to my grandparents'.
    note: The imparfait expresses repeated habits. Time expressions such as *tous les jours, souvent, parfois, le soir* point to a habit.
  fr.a2.unit82.lesson04.teach.phrase:
    title: Evenings and weekends
    gloss: In the evening we watched TV and on weekends we went to my grandparents'.
  fr.a2.unit82.lesson05.teach.mots:
    title: Family words
    gloss: my parents / my mother / my father / kind / a lot
    note: '*Gentille* is feminine; the masculine is *gentil*.'
    example_gloss:
    - I lived with my parents.
    - My mother was kind.
    - My father used to work a lot.
  fr.a2.unit82.lesson05.teach.gn_il_y_avait:
    title: Il y avait
    gloss: There was a garden. There was a cat.
    note: '*Il y avait* means ''there was'' or ''there were''. It never changes, even before a plural noun.'
  fr.a2.unit82.lesson05.teach.gn_gens:
    title: Describing people
    gloss: My mother was kind. My father used to work a lot.
    note: The imparfait describes how people were and what they used to do.
  fr.a2.unit82.lesson05.teach.reading:
    title: Camille writes about her childhood
    gloss: When I was little, I lived in the countryside with my parents. There was a big garden and a cat. My mother was kind and my father worked a lot. Every day I walked to school. Now I live in the city. Camille
    note: Notice that every past verb is in the imparfait except the contrast at the end, which is in the présent.
    glosses:
      gentille: kind (fem.)
      beaucoup: a lot
      campagne: countryside
  fr.a2.unit82.lesson06.teach.q1:
    title: Mathieu asks
    gloss: 'Mathieu: Camille, where did you live when you were little?'
  fr.a2.unit82.lesson06.teach.a1:
    title: Camille answers
    gloss: 'Camille: I lived in the countryside, in a big house with a garden.'
  fr.a2.unit82.lesson06.teach.q2:
    title: Mathieu asks about weekends
    gloss: 'Mathieu: What did you do on weekends?'
  fr.a2.unit82.lesson06.teach.a2:
    title: Camille describes weekends
    gloss: 'Camille: We went to my grandparents''. I played outside with my brother.'
  fr.a2.unit82.lesson06.teach.q3:
    title: Mathieu asks about now
    gloss: 'Mathieu: And now?'
  fr.a2.unit82.lesson06.teach.a3:
    title: Camille compares
    gloss: 'Camille: Now I live in the city, and I no longer play outside!'
