answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A2 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or liaison marks.
course:
  title: French A2
  description: Intermediate French continuing the Camille and Mathieu storyline, now with a grammar-led block on everyday functions.
  learning_goal: Pass on what someone says or asks with dire que and demander si / où / quand / pourquoi, in the present only.
units:
  fr.a2.unit100.il_dit_que:
    title: He says that ...
    description: Pass on what someone says or asks, in the present tense only, for a phone message or a note.
lessons:
  fr.a2.unit100.lesson01.dire_que:
    title: He says that he is late
  fr.a2.unit100.lesson02.demander_si:
    title: He asks whether you can come
  fr.a2.unit100.lesson03.demander_ou:
    title: She asks where you are
  fr.a2.unit100.lesson04.voisin:
    title: The neighbour's message
  fr.a2.unit100.lesson05.note:
    title: Camille's note
  fr.a2.unit100.lesson06.dialogue:
    title: Camille passes on the messages
teaching:
  fr.a2.unit100.lesson01.teach.mots:
    title: Passing on what is said
    gloss: to say, to tell / a message / that / that he / that she / they say
    example_gloss:
    - Mathieu says that he is late.
    - Camille says that she is arriving.
    - They say that the train is late.
  fr.a2.unit100.lesson01.teach.gn_dire:
    title: Dire in the present
    gloss: I say, you say, he says, we say, you say, they say
    note: '*Dire* is irregular. Note *vous dites* and *ils disent*.'
  fr.a2.unit100.lesson01.teach.gn_que:
    title: Dire que
    gloss: Mathieu says that he is late.
    note: '*Dire que* is followed by a full clause. *Que* becomes *qu''* before *il* or *elle*. In French you cannot leave out *que*.'
  fr.a2.unit100.lesson01.teach.gn_pronom:
    title: Je becomes il
    gloss: 'Mathieu says: ''I am late.'' Mathieu says that he is late.'
    note: 'When you pass on someone''s words, change the person: his *je* becomes *il* and the verb changes with it.'
  fr.a2.unit100.lesson01.teach.phrase:
    title: A message
    gloss: Mathieu says that he is late.
  fr.a2.unit100.lesson02.teach.mots:
    title: Passing on a question
    gloss: to ask / whether / whether he, it / to be able / to come
    example_gloss:
    - Mathieu asks whether you can come.
    - Camille asks whether the shop is open.
    - He asks whether he can come.
  fr.a2.unit100.lesson02.teach.gn_demander:
    title: Demander si
    gloss: Mathieu asks whether you can come.
    note: 'For a yes or no question, use *demander si*. The question mark and the inversion disappear: *tu peux venir*.'
  fr.a2.unit100.lesson02.teach.gn_sil:
    title: S'il, but si elle
    gloss: She asks whether it is open. He asks whether she is coming.
    note: '*Si il* becomes *s''il*. There is no elision before *elle*.'
  fr.a2.unit100.lesson02.teach.gn_pronom:
    title: Tu becomes je
    gloss: 'He asks: ''Are you coming?'' He asks whether I am coming.'
    note: 'The person changes as in English: a question put to you with *tu* ("Tu viens ?") becomes *je* when you report it: *Il demande si je viens*.'
  fr.a2.unit100.lesson02.teach.phrase:
    title: A question passed on
    gloss: He asks whether you can come.
  fr.a2.unit100.lesson03.teach.mots:
    title: Question words
    gloss: where / when / why / at what time / now
    example_gloss:
    - She asks where you are.
    - He asks what time you arrive.
    - Mathieu asks why you are late.
  fr.a2.unit100.lesson03.teach.gn_ou:
    title: Demander où
    gloss: She asks where you are.
    note: 'The question word stays and the order is subject then verb: *où tu es*. There is no question mark.'
  fr.a2.unit100.lesson03.teach.gn_heure:
    title: À quelle heure
    gloss: He asks what time you arrive.
    note: '*À quelle heure* works the same way inside the sentence.'
  fr.a2.unit100.lesson03.teach.gn_pourquoi:
    title: Ask and answer
    gloss: Mathieu asks why you are late. I say that the bus is late.
    note: A question is passed on with *demander*; an answer is passed on with *dire que*.
  fr.a2.unit100.lesson03.teach.phrase:
    title: A question word
    gloss: She asks where you are.
  fr.a2.unit100.lesson04.teach.mots:
    title: A real message
    gloss: the neighbour / the music / too loud / to turn down / your mother / his, her
    example_gloss:
    - The neighbour says that the music is too loud.
    - He asks whether you can turn down the music.
    - Your mother says that she is arriving on Saturday.
  fr.a2.unit100.lesson04.teach.gn_message:
    title: Two kinds of message
    gloss: The neighbour says that the music is too loud. He asks whether you can turn down the music.
    note: A statement is passed on with *dit que*, a question with *demande si*. Both verbs stay in the present.
  fr.a2.unit100.lesson04.teach.gn_pronoms:
    title: Tu becomes je
    gloss: 'Camille says: ''You are late.'' She says that I am late.'
    note: 'Change the person as in English: what is *tu* for her is *je* for you.'
  fr.a2.unit100.lesson04.teach.gn_possessif:
    title: Mon becomes son
    gloss: 'Mathieu says: ''My train is late.'' Mathieu says that his train is late.'
    note: 'A possessive changes too: *mon* becomes *son*. *Son* means ''his'' and ''her''.'
  fr.a2.unit100.lesson04.teach.phrase:
    title: A request passed on
    gloss: He asks whether you can turn down the music.
  fr.a2.unit100.lesson05.teach.mots:
    title: Words for the note
    gloss: to phone / noon / to live (in a place) / this evening / to call her
    example_gloss:
    - Your mother phoned.
    - She asks where you live now.
    - Can you call her this evening?
  fr.a2.unit100.lesson05.teach.gn_telephone:
    title: The call, then the content
    gloss: Your mother phoned. She says that she is arriving on Saturday.
    note: '*A téléphoné* tells that the call happened. What she says is passed on in the present.'
  fr.a2.unit100.lesson05.teach.gn_appeler:
    title: L'appeler
    gloss: Can you call her this evening?
    note: '*L''appeler* means ''to call her'' (or ''him''). *L''* stands for the person.'
  fr.a2.unit100.lesson05.teach.reading:
    title: Camille writes to Mathieu
    gloss: Hi Mathieu! Your mother phoned. She says that she is arriving on Saturday at noon. She asks whether you can come to the station. She also asks where you live now. Can you call her this evening? Camille
    note: 'A phone message passed on in writing: one statement and two questions.'
    glosses:
      gare: station
      midi: noon
  fr.a2.unit100.lesson06.teach.q1:
    title: Camille announces a message
    gloss: 'Camille: Mathieu, your neighbour phoned.'
  fr.a2.unit100.lesson06.teach.a1:
    title: Mathieu asks
    gloss: 'Mathieu: Oh yes? What does he say?'
  fr.a2.unit100.lesson06.teach.q2:
    title: Camille passes on the neighbour
    gloss: 'Camille: He says that the music is too loud. He asks whether you can turn it down.'
  fr.a2.unit100.lesson06.teach.a2:
    title: Mathieu reacts
    gloss: 'Mathieu: Sorry! I am turning the music down now.'
  fr.a2.unit100.lesson06.teach.q3:
    title: Camille passes on his mother
    gloss: 'Camille: And your mother says that she is arriving on Saturday. She asks where she can sleep.'
  fr.a2.unit100.lesson06.teach.a3:
    title: Mathieu decides
    gloss: 'Mathieu: She can sleep at my place. I will call her this evening.'
