teaching:
  fr.a1.unit45.lesson01.teach.tu_fais_quoi:
    title: Asking about someone's job
    gloss: What do you do for work?
    note: A standard, casual way to ask about someone's occupation.
  fr.a1.unit45.lesson01.teach.le_metier_cuisinier:
    title: Occupation / cook
    gloss: the occupation; cook
    note: '*Métier* (occupation) is masculine: *le métier*. *Cuisinier* changes for a woman: *un cuisinier*, *une cuisinière*.'
    example_gloss:
    - What is your job?
    - I work as a cook.
  fr.a1.unit45.lesson01.teach.je_travaille_comme:
    title: Saying you're a cook
    gloss: I work as a cook.
    note: '*Travailler comme* + occupation is the standard pattern for stating a job, with no article before the occupation noun.'
  fr.a1.unit45.lesson01.teach.infirmiere:
    title: Nurse
    gloss: nurse
    note: The modern, gender-neutral term for this profession, used for any gender.
    example_gloss: I work as a nurse.
  fr.a1.unit45.lesson01.teach.je_travaille_comme_2:
    title: Saying you're a nurse
    gloss: I work as a nurse.
    note: Follows the same *travailler comme* pattern as *cuisinier*; the feminine is *infirmière*.
  fr.a1.unit45.lesson02.teach.ou_travailles_tu:
    title: Asking about a workplace
    gloss: Where do you work?
    note: A direct follow-up question to *Tu fais quoi dans la vie ?*
  fr.a1.unit45.lesson02.teach.je_travaille_dans:
    title: Working in a restaurant
    gloss: I work in a restaurant.
    note: '*Un restaurant* takes the indefinite article here since it is one of many restaurants.'
  fr.a1.unit45.lesson02.teach.l_hopital:
    title: The hospital
    gloss: the hospital
    note: '*Hôpital* is masculine and starts with a vowel sound: *l''hôpital*.'
    example_gloss: I work in the hospital.
  fr.a1.unit45.lesson02.teach.je_travaille_a:
    title: Working in the hospital
    gloss: I work in the hospital.
    note: '*À l''hôpital* uses the definite article, because it is a specific, known place; *le* becomes *l''* before the vowel sound.'
  fr.a1.unit45.lesson02.teach.certaines_personnes_travaillent:
    title: Working in an office
    gloss: Some people work at an office.
    note: '*Dans un bureau* (in an office) takes an article, like *dans un restaurant*.'
  fr.a1.unit45.lesson03.teach.je_commence_a:
    title: Starting time
    gloss: I start at nine o'clock.
    note: '*Commence* is the *je* form of *commencer* (to start); *à neuf heures* gives the time.'
  fr.a1.unit45.lesson03.teach.je_travaille_du:
    title: Working days
    gloss: I work Monday to Friday.
    note: '*Du lundi au vendredi* means from Monday to Friday; *du* is *de* + *le* and *au* is *à* + *le*.'
  fr.a1.unit45.lesson03.teach.la_pause:
    title: The break
    gloss: the break
    note: '*Pause* is feminine: *la pause*.'
    example_gloss: I have a break at twelve o'clock.
  fr.a1.unit45.lesson03.teach.j_ai_une:
    title: Having a break
    gloss: I have a break at twelve o'clock.
    note: '*Avoir une pause* (to have a break) is the natural fixed pattern.'
  fr.a1.unit45.lesson03.teach.je_finis_a:
    title: Finishing time
    gloss: I finish at five o'clock.
    note: '*Finis* is the *je* form of *finir* (to finish).'
  fr.a1.unit45.lesson03.teach.je_commence_a_2:
    title: A full workday
    gloss: I start at nine o'clock and I finish at five o'clock.
    note: Combines *je commence* and *je finis* with *et* into one sentence describing a whole workday.
  fr.a1.unit45.lesson04.teach.avec_il_ou:
    title: Verb endings with il and elle
    gloss: 'With he or she, regular -er verbs keep the same form as with I: I work, he works, she works.'
    note: '*Travaille* is the same for *je*, *il* and *elle*: regular *-er* verbs add nothing in the third person.'
  fr.a1.unit45.lesson04.teach.camille_travaille_comme:
    title: Camille's job
    gloss: Camille works as a nurse.
    note: '*Travaille* goes with *je*, *il* and *elle*: the ending is silent, so the three forms sound the same.'
  fr.a1.unit45.lesson04.teach.mathieu_travaille_comme:
    title: Mathieu's job
    gloss: Mathieu works as a cook.
    note: Same ending as in *Camille travaille comme infirmière*.
  fr.a1.unit45.lesson04.teach.elle_travaille_a:
    title: Using pronouns
    gloss: She works in the hospital. He works in a restaurant.
    note: '*Elle* and *il* replace the names Camille and Mathieu but keep the same verb form.'
  fr.a1.unit45.lesson05.teach.camille_travaille_comme:
    title: Read two work profiles
    gloss: Camille works as a nurse in the hospital. She starts at seven o'clock and works Monday to Friday. Mathieu works as a cook in a restaurant. He starts at eleven o'clock and has a break at four o'clock.
    note: Track each person's job, workplace, and schedule separately.
    glosses:
      travaille: works
      infirmière: nurse
      "l'hôpital": hospital
      commence: starts
      sept: seven
      lundi: Monday
      vendredi: Friday
      cuisinier: cook / chef
      restaurant: restaurant
      onze: eleven
      pause: break
  fr.a1.unit45.lesson06.teach.camille_salut_mathieu:
    title: Camille asks about work
    gloss: 'Camille: Hi Mathieu! I''m curious, what do you actually do for work?'
    note: '*Au fait* (by the way) softens the question into friendly curiosity rather than an interrogation.'
  fr.a1.unit45.lesson06.teach.mathieu_je_travaille:
    title: Mathieu answers
    gloss: 'Mathieu: I work as a cook in a restaurant. And you?'
    note: '*Et toi ?* is the standard way to turn the question back to the other person.'
  fr.a1.unit45.lesson06.teach.camille_je_travaille:
    title: Camille answers
    gloss: 'Camille: I work as a nurse in the hospital.'
    note: Matches the job and workplace already established in lesson01/lesson02/lesson05.
  fr.a1.unit45.lesson06.teach.mathieu_tu_fais:
    title: Mathieu asks about hours
    gloss: 'Mathieu: What hours do you keep?'
    note: '*Tu fais quels horaires ?* is a natural way to ask about someone''s work schedule; *quels* agrees with the plural *horaires*.'
  fr.a1.unit45.lesson06.teach.camille_je_commence:
    title: Camille states her hours
    gloss: 'Camille: I start at seven o''clock and I work Monday to Friday.'
    note: Matches the schedule already established in lesson05's reading profile.
  fr.a1.unit45.lesson06.teach.mathieu_c_est:
    title: Mathieu reacts
    gloss: 'Mathieu: That''s early! I start later, at eleven o''clock.'
    note: Matches Mathieu's start time already established in lesson05.
  fr.a1.unit45.lesson06.teach.camille_chaque_metier:
    title: Camille closes the topic
    gloss: 'Camille: Every job has its own rhythm, I guess.'
    note: A natural, reflective closing remark -- recognize it for meaning, no need to reproduce it exactly.
