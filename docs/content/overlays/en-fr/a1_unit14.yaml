answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A1
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation or liaison marks.

course:
  title: "French A1"
  description: >-
    Making basic comparisons (plus/moins/aussi... que) and superlatives
    (le/la plus...), continuing Inès and Mathieu's cooking-workshop
    narrative as they compare two cheeses while shopping. English-specific
    guidance highlights that *meilleur* (better) and *le meilleur* (the
    best) are irregular, unlike the regular *plus... que* pattern used for
    most other adjectives.

units:
  fr.a1.unit14.comparisons:
    title: "More or less?"

lessons:
  fr.a1.unit14.lesson01.vocabulaire_comparaisons:
    title: "More, less, as"
  fr.a1.unit14.lesson02.superlatifs:
    title: "The most, the least"
  fr.a1.unit14.lesson03.dialogue_comparer_fromages:
    title: "Comparing two cheeses at the market"

teaching:
  fr.a1.unit14.lesson01.teach.plus_que:
    title: "More... than"
    gloss: "more... than"
    note: "*Plus + adjective + que* is the standard French comparative -- no separate \"-er\" ending like English \"cheaper.\""
    example_gloss: "This cheese is more expensive than the other one."
  fr.a1.unit14.lesson01.teach.moins_que:
    title: "Less... than"
    gloss: "less... than"
    note: "*Moins* is the direct opposite of *plus* in this same comparative pattern."
    example_gloss: "This recipe is less difficult than the other one."
  fr.a1.unit14.lesson01.teach.aussi_que:
    title: "As... as"
    gloss: "as... as"
    note: "*Aussi + adjective + que* expresses equality between two things."
    example_gloss: "The tart is as good as the quiche."
  fr.a1.unit14.lesson01.teach.meilleur_que:
    title: "Better than"
    gloss: "better than"
    note: "*Meilleur* is the irregular comparative of *bon* (good) -- French does NOT say *plus bon*."
    example_gloss: "This cake is better than the first one."
  fr.a1.unit14.lesson01.teach.cher_bon_marche:
    title: "Expensive, cheap"
    gloss: "expensive, cheap / good value"
    note: "*Bon marché* is invariable (never changes form) even though it looks like it should agree like other adjectives."
    example_gloss:
      - "The cheese is expensive."
      - "The vegetables are cheap."
  fr.a1.unit14.lesson01.teach.facile_difficile:
    title: "Easy, difficult"
    gloss: "easy, difficult"
    note: "A common adjective pair for describing recipes -- both have the same form in the masculine and feminine; add -s in the plural (*faciles*, *difficiles*)."
    example_gloss:
      - "This recipe is easy."
      - "The quiche is a bit difficult."

  fr.a1.unit14.lesson02.teach.le_plus_cher:
    title: "The most expensive"
    gloss: "the most expensive"
    note: "*Le/la plus + adjective* forms the superlative -- the definite article is required, unlike the comparative."
    example_gloss: "It's the most expensive cheese at the market."
  fr.a1.unit14.lesson02.teach.la_moins_chere:
    title: "The least expensive"
    gloss: "the least expensive"
    note: "*La moins chère* agrees with the feminine *recette* -- the masculine form is *le moins cher*."
    example_gloss: "It's the least expensive recipe."
  fr.a1.unit14.lesson02.teach.le_meilleur:
    title: "The best"
    gloss: "the best"
    note: "*Le meilleur* is the irregular superlative of *bon*, matching lesson01's irregular comparative *meilleur*."
    example_gloss: "It's the best cake at the workshop!"
  fr.a1.unit14.lesson02.teach.la_plus_facile:
    title: "The easiest"
    gloss: "the easiest"
    note: "A regular superlative, following the *le/la plus + adjective* pattern directly."
    example_gloss: "It's the easiest recipe to make."
  fr.a1.unit14.lesson02.teach.grammar_superlative_note:
    title: "Superlative pattern"
    gloss: "le/la plus + adjective; meilleur is irregular"
    note: "Most French superlatives are regular (*le/la plus + adjective*), but *bon* → *meilleur* → *le meilleur* is a memorized exception."
  fr.a1.unit14.lesson02.teach.comparer_les_prix:
    title: "Suggest comparing prices"
    gloss: "Let's compare prices before buying."
    note: "*Comparons* is the *nous*-form imperative of *comparer* -- \"let's compare,\" a natural shopping phrase."

  fr.a1.unit14.lesson03.teach.line01:
    title: "Notice two options"
    gloss: "Inès says look, there are two kinds of cheese -- which one should they get?"
    note: "*Lequel* (which one) asks the other person to choose between two already-mentioned options."
  fr.a1.unit14.lesson03.teach.line02:
    title: "Compare and note quality"
    gloss: "Mathieu says this one is more expensive than the other, but it looks better."
    note: "*Avoir l'air* + adjective (to look/seem) softens a claim about quality that hasn't been tasted yet."
  fr.a1.unit14.lesson03.teach.line03:
    title: "Disagree with a comparison"
    gloss: "Inès asks if he's sure, and says she finds the other one just as good, and cheaper."
    note: "Combines lesson01's *aussi... que* and *moins... que* in one reply to disagree politely."
  fr.a1.unit14.lesson03.teach.line04:
    title: "Concede the price point"
    gloss: "Mathieu agrees, that's true -- it's the cheapest of the two."
    note: "*Des deux* (of the two) narrows the superlative to just this pair, rather than the whole market."
  fr.a1.unit14.lesson03.teach.line05:
    title: "Make the final decision"
    gloss: "Inès says then let's take that one, it's the best option for the workshop."
    note: "*Celui-là* (that one) points back to the cheaper cheese just discussed."
  fr.a1.unit14.lesson03.teach.line06:
    title: "Note the benefit"
    gloss: "Mathieu agrees, and says they'll have more money left for dessert!"
    note: "*Il nous reste* (there remains to us) is a common way to say \"we have... left.\""

exercises:
  fr.a1.unit14.lesson01.exercise01.select_plus_que:
    instruction: "Which pattern means \"more... than\"?"
    correct_option: "plus... que"
    distractors: ["moins... que", "aussi... que"]
    accepted_answers: ["plus... que", "plus que"]

  fr.a1.unit14.lesson01.exercise02.listen_plus_cher_que:
    instruction: "Listen and select the phrase you hear."
    correct_option: "plus cher que"
    distractors: ["moins cher que", "aussi cher que"]
    accepted_answers: ["plus cher que"]

  fr.a1.unit14.lesson01.exercise03.match_comparison_words:
    instruction: "Match each French comparison word or phrase to its English meaning."
    correct_response:
      "plus... que": "more... than"
      "moins... que": "less... than"
      "aussi... que": "as... as"
      "meilleur que": "better than"
      "bon marché": "cheap / good value"
      facile: "easy"
      difficile: "difficult"

  fr.a1.unit14.lesson01.exercise04.order_cette_recette_moins_difficile:
    instruction: "Build the sentence: This recipe is less difficult than the other one."
    correct_response: ["Cette", "recette", "est", "moins", "difficile", "que", "l'autre"]

  fr.a1.unit14.lesson01.exercise05.fill_aussi_que:
    instruction: "Complete the sentence with the word for \"as.\""
    accepted_answers: ["aussi"]

  fr.a1.unit14.lesson01.exercise06.speak_compare_two_items:
    instruction: "Compare two cheeses out loud: more expensive, less expensive."
    accepted_answers:
      - "Ce fromage est plus cher que l'autre."
      - "Ce fromage est moins cher que l'autre."

  fr.a1.unit14.lesson02.exercise01.select_le_plus_cher:
    instruction: "Which phrase means \"the most expensive\"?"
    correct_option: "le plus cher"
    distractors: ["la moins chère", "le meilleur"]
    accepted_answers: ["le plus cher"]

  fr.a1.unit14.lesson02.exercise02.listen_le_moins_cher:
    instruction: "Listen and select the phrase you hear."
    correct_option: "le moins cher"
    distractors: ["le plus cher", "le meilleur"]
    accepted_answers: ["le moins cher"]

  fr.a1.unit14.lesson02.exercise03.match_superlative_phrases:
    instruction: "Match each French superlative phrase to its English meaning."
    correct_response:
      "le plus cher": "the most expensive"
      "la moins chère": "the least expensive"
      "le meilleur": "the best"
      "la plus facile": "the easiest"
      "Comparons les prix avant d'acheter.": "Let's compare prices before buying."

  fr.a1.unit14.lesson02.exercise04.order_cest_le_meilleur_gateau:
    instruction: "Build the sentence: It's the best cake at the workshop."
    correct_response: ["C'est", "le", "meilleur", "gâteau", "de", "l'atelier"]

  fr.a1.unit14.lesson02.exercise05.fill_la_plus_facile:
    instruction: "Complete the sentence with the word for \"easy.\""
    accepted_answers: ["facile"]

  fr.a1.unit14.lesson02.exercise06.reply_which_is_cheapest:
    instruction: "Answer: say it's the least expensive recipe."
    accepted_answers:
      - "C'est la recette la moins chère."
      - "C'est la recette la moins chère"

  fr.a1.unit14.lesson03.exercise01.comprehend_which_is_pricier:
    instruction: "Listen to the dialogue. Which cheese does Mathieu say is more expensive?"
    correct_option: "This one (celui-ci)"
    distractors: ["The other one", "Neither, they're the same price"]
    accepted_answers: ["This one (celui-ci)"]

  fr.a1.unit14.lesson03.exercise02.comprehend_final_choice:
    instruction: "Which cheese do they finally choose?"
    correct_option: "The cheapest of the two"
    distractors: ["The most expensive of the two", "Both cheeses"]
    accepted_answers: ["The cheapest of the two"]

  fr.a1.unit14.lesson03.exercise03.select_why_they_choose_it:
    instruction: "Why do they choose that cheese for the workshop?"
    correct_option: "It's the best option -- as good, and cheaper"
    distractors: ["It's the most expensive", "Mathieu prefers its taste"]
    accepted_answers: ["It's the best option -- as good, and cheaper"]

  fr.a1.unit14.lesson03.exercise04.order_celui_ci_est_plus_cher:
    instruction: "Build Mathieu's sentence comparing the two cheeses."
    correct_response: ["Celui-ci", "est", "plus", "cher", "que", "l'autre"]

  fr.a1.unit14.lesson03.exercise05.reply_explain_the_choice:
    instruction: "Take Inès's role. Say you find the other one just as good, and cheaper."
    accepted_answers:
      - "Moi, je trouve l'autre aussi bon, et moins cher."
      - "Moi je trouve l'autre aussi bon et moins cher."
      - "Je trouve l'autre aussi bon, et moins cher."
      - "Je trouve l'autre aussi bon et moins cher."

  fr.a1.unit14.lesson03.exercise06.speak_justify_the_choice:
    instruction: "Explain out loud why you're choosing this cheese: it's the cheapest, and just as good."
    accepted_answers:
      - "C'est le moins cher, et c'est aussi bon."
      - "C'est le moins cher et c'est aussi bon."

  fr.a1.unit14.lesson01.exercise07.dictation_plus_cher_que:
    instruction: "Type what you hear."
    correct_option: "Ce fromage est plus cher que l'autre"
    accepted_answers: [{value: "Ce fromage est plus cher que l'autre", status: correct}]
    orthography_strict: true
