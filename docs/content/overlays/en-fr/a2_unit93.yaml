teaching:
  fr.a2.unit93.lesson01.teach.les_vacances_les:
    title: Holidays
    gloss: the holiday / the summer holiday
    note: '*Vacances* is always plural in French: *les vacances*. *Les vacances d''été* are the long summer break.'
    example_gloss:
    - In August I have a holiday.
    - The summer holiday starts in July.
  fr.a2.unit93.lesson01.teach.la_semaine_prochaine:
    title: When something happens
    gloss: next week / next year / soon
    note: '*Semaine* and *année* are both feminine, and *prochaine* comes after the noun: *la semaine prochaine*, *l''année prochaine*.'
    example_gloss:
    - Next week I have an appointment.
    - Next year I want to go to Belgium.
    - Soon I have a holiday.
  fr.a2.unit93.lesson01.teach.voyager_reserver_rester:
    title: Three travel verbs
    gloss: to travel / to book / to stay
    note: These are infinitives. *Réserver* means 'to book' (a hotel, a table); *voyager* means 'to travel'.
    example_gloss:
    - I like travelling by train.
    - I want to book a room.
    - I'm staying for a week.
  fr.a2.unit93.lesson01.teach.l_hotel_le:
    title: Where to stay
    gloss: the hotel / the campsite
    note: '*L''hôtel* and *le camping* are both masculine (the *h* in *hôtel* is silent, so *le* becomes *l''*). You stay *dans un hôtel* but *au camping*.'
    example_gloss:
    - The hotel is close to the beach.
    - We sleep on the campsite.
  fr.a2.unit93.lesson01.teach.qu_est_ce:
    title: Asking about holiday plans
    gloss: What are you going to do in the summer holiday?
    note: 'Here *aller* is a helper: *tu vas* followed by the infinitive *faire*.'
  fr.a2.unit93.lesson01.teach.en_aout_je:
    title: 'Near plans: aller + infinitive'
    gloss: In August I am going to travel to Germany. I am going to book a hotel.
    note: 'To say what you are going to do soon, use a form of *aller* (*je vais*, *tu vas*, *nous allons*) followed by the infinitive: *Je vais réserver un hôtel*. A time expression can come first: *La semaine prochaine, je vais réserver un hôtel*. The subject and *aller* stay together.'
  fr.a2.unit93.lesson01.teach.je_vais_reserver:
    title: Booking a hotel
    gloss: I am going to book a hotel.
  fr.a2.unit93.lesson02.teach.suivre_un_cours:
    title: Three plans for later
    gloss: to take a course / to move house / to save money
    note: '*Suivre un cours* is the fixed phrase for taking a course. *Déménager* means moving to a new home.'
    example_gloss:
    - I want to take a course.
    - My uncle wants to move house.
    - I want to save for a new bike.
  fr.a2.unit93.lesson02.teach.plus_tard_dans:
    title: Further ahead
    gloss: later / in a month
    note: '*Dans un mois* means ''a month from now''. It works with other periods too: *dans une semaine*.'
    example_gloss:
    - Later I want to buy a house.
    - In a month my course starts.
  fr.a2.unit93.lesson02.teach.dans_un_mois:
    title: A course that starts
    gloss: In a month my course starts.
  fr.a2.unit93.lesson02.teach.je_compte_suivre:
    title: 'Intentions: compter + infinitive'
    gloss: I plan to take a course.
    note: 'To say what you intend to do, use *je compte* directly followed by an infinitive: *Je compte suivre un cours*. There is no little word in between. This is for things you want to do, not for fixed arrangements. Another way to say it is *avoir l''intention de*.'
  fr.a2.unit93.lesson02.teach.je_compte_demenager:
    title: Planning to move house
    gloss: I plan to move house.
  fr.a2.unit93.lesson02.teach.je_compte_economiser:
    title: Planning to save
    gloss: I plan to save money.
  fr.a2.unit93.lesson02.teach.demain_je_vais:
    title: Aller or compter?
    gloss: Tomorrow I am going to the market. Later I plan to move house.
    note: 'Use *aller* for the near, settled future: *Demain, je vais au marché*. Use *compter* for an intention that is further away or less certain: *Plus tard, je compte déménager*.'
  fr.a2.unit93.lesson03.teach.peut_etre_surement:
    title: Maybe and certainly
    gloss: maybe / certainly
    note: '*Peut-être* expresses doubt. *Sûrement* means ''surely'' or ''most likely''.'
    example_gloss:
    - Maybe it will rain tomorrow.
    - That is certainly fun.
  fr.a2.unit93.lesson03.teach.cette_annee_cet:
    title: This year, this summer
    gloss: this year / this summer
    note: '*Année* is feminine, so it is *cette année*. *Été* is masculine and starts with a vowel, so it is *cet été*.'
    example_gloss:
    - This year I am not going on holiday.
    - This summer I am staying at home.
  fr.a2.unit93.lesson03.teach.cet_ete_je:
    title: Staying at home
    gloss: This summer I am staying at home.
  fr.a2.unit93.lesson03.teach.demain_je_vais:
    title: Peut-être que and word order
    gloss: Tomorrow I am going to work. Maybe I will go to the cinema later.
    note: 'After *peut-être que* the word order stays normal: subject, then verb: *Peut-être que je vais aller au cinéma plus tard*. A time word at the start does not change the order either: *Demain, je vais travailler*.'
  fr.a2.unit93.lesson03.teach.je_ne_vais:
    title: Saying you are not going to
    gloss: I am not going on holiday. I do not plan to move house.
    note: 'In French, *ne* ... *pas* wraps around the conjugated verb: *Je ne vais pas partir en vacances*. The same goes for *compter*: *Je ne compte pas déménager*. The infinitive stays after *pas*.'
  fr.a2.unit93.lesson04.teach.avec_qui_combien:
    title: Two question phrases
    gloss: with whom / how long
    note: '*Avec qui* asks about the person you do something with. *Combien de temps* asks about a period of time.'
    example_gloss:
    - Who are you going to the beach with?
    - How long are you staying?
  fr.a2.unit93.lesson04.teach.ou_vas_tu:
    title: Where are you going?
    gloss: Where are you going (to)?
    note: '*Où* asks about a place. In a careful question the verb and *tu* are joined with a hyphen: *Où vas-tu ?*'
  fr.a2.unit93.lesson04.teach.avec_qui_pars:
    title: Who with?
    gloss: Who are you going on holiday with?
  fr.a2.unit93.lesson04.teach.combien_de_temps:
    title: How long?
    gloss: How long are you staying there?
  fr.a2.unit93.lesson04.teach.je_pars_avec:
    title: Answering
    gloss: I am going with my sister.
  fr.a2.unit93.lesson04.teach.une_semaine_deux:
    title: Weeks
    gloss: one week / two weeks
    note: The plural of *semaine* is *semaines*; the final *s* is silent.
    example_gloss:
    - I am staying for a week.
    - We are staying for two weeks.
  fr.a2.unit93.lesson04.teach.ou_vas_tu_2:
    title: Questions with aller
    gloss: Where are you going? Who are you going with? How long are you going to stay?
    note: 'Put the question word first, then the verb joined to *tu* with a hyphen: *Où vas-tu ?*, *Avec qui pars-tu ?* With a second verb: *Combien de temps vas-tu rester ?* The infinitive stays at the end.'
  fr.a2.unit93.lesson05.teach.salut_camille_bientot:
    title: A message from Nina
    gloss: Hi Camille! Soon I have a holiday. In August I am going to Belgium with my sister. We are going to stay in a hotel for a week. After that I am going to my parents' for two days. Next year I plan to take a course. Maybe I will move house then too. What are you going to do?
    note: 'Nina describes near plans with *aller* and *partir*, and a longer-term intention with *compter*. Notice that each infinitive follows its verb: *rester*, *suivre*, *déménager*.'
    glosses:
      bientôt: soon
      vacances: holiday
      août: August
      sœur: sister
      en: to
      belgique: Belgium
      hôtel: hotel
      rester: to stay
      ensuite: after that
      parents: parents
      jours: days
      prochaine: next
      compte: plan to (compter + infinitive)
      cours: course
      suivre: to follow
      peut-être: maybe
      déménager: to move house
      alors: then
      aussi: also
  fr.a2.unit93.lesson06.teach.salut_mathieu_tu:
    title: Camille asks Mathieu about his plans
    gloss: 'Camille: Hi Mathieu! Do you have plans for the summer holiday yet?'
  fr.a2.unit93.lesson06.teach.oui_en_aout:
    title: Mathieu answers
    gloss: 'Mathieu: Yes! In August I am going to Germany. I am going to book a hotel.'
  fr.a2.unit93.lesson06.teach.sympa_avec_qui:
    title: Camille asks who he is going with
    gloss: 'Camille: Nice! Who are you going with?'
  fr.a2.unit93.lesson06.teach.avec_mon_oncle:
    title: Mathieu says who and how long
    gloss: 'Mathieu: With my uncle. We are going to stay for a week.'
  fr.a2.unit93.lesson06.teach.et_plus_tard:
    title: Camille asks about later
    gloss: 'Camille: And later? What do you plan to do?'
  fr.a2.unit93.lesson06.teach.l_annee_prochaine:
    title: Mathieu names an intention and asks back
    gloss: 'Mathieu: Next year I plan to take a course. And you?'
  fr.a2.unit93.lesson06.teach.en_juillet_je:
    title: Camille answers
    gloss: 'Camille: In July I am going to work. Maybe I will go to my parents'' after that.'
