answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A2 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or liaison marks.
course:
  title: French A2
  description: Intermediate French continuing the Camille and Mathieu storyline, now with a grammar-led block on talking about the past.
  learning_goal: Say what was going on when something happened, contrasting the imparfait and the passé composé, with quand and pendant que.
units:
  fr.a2.unit83.pendant_que:
    title: While it was happening
    description: Say what was going on when something else happened, using the imparfait for the scene and the passé composé for the event.
lessons:
  fr.a2.unit83.lesson01.il_pleuvait:
