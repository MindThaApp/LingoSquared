  fr.a2.unit83.lesson02.soudain:
    title: Suddenly, the phone rang
  fr.a2.unit83.lesson03.je_dormais_quand:
    title: I was sleeping when ...
  fr.a2.unit83.lesson04.pendant_que:
    title: While
  fr.a2.unit83.lesson05.hier_soir:
    title: Last night
  fr.a2.unit83.lesson06.camille_et_mathieu:
    title: Camille and Mathieu talk about last night
teaching:
  fr.a2.unit83.lesson01.teach.meteo:
    title: Weather in the past
    gloss: it was raining / the weather was nice / it was cold
    note: 'Weather in the past is in the imparfait: *il pleuvait, il faisait beau*.'
    example_gloss:
    - Yesterday it was raining.
    - The weather was nice.
    - It was cold in the street.
  fr.a2.unit83.lesson01.teach.actions:
    title: Things in progress
    gloss: to sleep / to read / to cook / to wait
    note: The imparfait of these verbs says what was going on.
    example_gloss:
    - I was sleeping.
    - She was reading a book.
    - We were cooking.
    - I was waiting for the bus.
  fr.a2.unit83.lesson01.teach.gn_decor:
    title: 'The imparfait: what was going on'
    gloss: It was raining. I was sleeping. She was reading. We were waiting.
    note: 'The imparfait describes the scene: what was in progress at a moment in the past. It does not say when the action began or ended.'
  fr.a2.unit83.lesson01.teach.gn_meteo:
    title: Weather and setting
    gloss: It was raining. It was cold. It was windy.
    note: 'Weather descriptions in the past use the imparfait: *il pleuvait, il faisait froid, il y avait du vent*.'
  fr.a2.unit83.lesson01.teach.phrase:
    title: Raining and waiting
    gloss: It was raining and I was waiting for the bus.
  fr.a2.unit83.lesson02.teach.soudain:
    title: Suddenly
    gloss: suddenly / all of a sudden
    note: These words introduce an event that interrupts the scene.
    example_gloss:
    - Suddenly the phone rang.
    - All of a sudden I heard a noise.
  fr.a2.unit83.lesson02.teach.evenements:
    title: Events
    gloss: to ring / to hear / to fall / a noise
    note: '*Tomber* and *arriver* use *être* in the passé composé; *sonner* and *entendre* use *avoir*.'
    example_gloss:
    - The phone rang.
    - I heard a noise.
    - The bus arrived.
    - She fell.
  fr.a2.unit83.lesson02.teach.gn_evenement:
    title: 'The passé composé: what happened'
    gloss: Suddenly the phone rang. I heard a noise. The bus arrived.
    note: The passé composé reports a single event that happened and was completed. It often interrupts what was going on.
  fr.a2.unit83.lesson02.teach.gn_decor_evenement:
    title: Scene and event
    gloss: It was raining. Suddenly I heard a noise.
    note: 'Think of a stage: the imparfait is the background that was already there, the passé composé is what happens in front of it.'
  fr.a2.unit83.lesson02.teach.phrase:
    title: Sleeping, then a call
    gloss: I was sleeping. Suddenly the phone rang.
  fr.a2.unit83.lesson03.teach.quand:
    title: Useful words
    gloss: when / to answer / to go out
    note: '*Sortir* takes *être*: *je suis sorti*.'
    example_gloss:
    - I answer when the phone rings.
    - She goes out at eight.
  fr.a2.unit83.lesson03.teach.gn_quand:
    title: Imparfait and passé composé together
    gloss: I was sleeping when the phone rang. It was raining when I went out.
    note: With *quand*, the imparfait gives the action in progress and the passé composé gives the event that happened.
  fr.a2.unit83.lesson03.teach.gn_ordre:
    title: The order can change
    gloss: When the phone rang, I was sleeping.
    note: 'The tenses stay the same if the clauses swap places: the action in progress is still in the imparfait.'
  fr.a2.unit83.lesson03.teach.gn_deux:
    title: Two events in a row
    gloss: When the phone rang, I answered.
    note: When one event follows another, both are in the passé composé. The imparfait would mean the action was already in progress.
  fr.a2.unit83.lesson03.teach.phrase:
    title: Sleeping when the phone rang
    gloss: I was sleeping when the phone rang.
  fr.a2.unit83.lesson04.teach.maison:
    title: At home
    gloss: to cook / to tidy / to listen to / music
    note: '*Faire la cuisine* means to cook; *cuisiner* means the same.'
    example_gloss:
    - I am cooking.
    - My brother listens to music.
    - She tidies her room.
  fr.a2.unit83.lesson04.teach.gn_pendant:
    title: Pendant que + imparfait
    gloss: While I was cooking, my brother was listening to music.
    note: '*Pendant que* means ''while'' and introduces an action going on at the same time as another. Both actions are in the imparfait.'
  fr.a2.unit83.lesson04.teach.gn_pendant_evenement:
    title: Pendant que + event
    gloss: While I was reading, the phone rang.
    note: The action in progress after *pendant que* is in the imparfait; the interruption is in the passé composé.
  fr.a2.unit83.lesson04.teach.phrase:
    title: Cooking and the phone
    gloss: While I was cooking, the phone rang.
  fr.a2.unit83.lesson05.teach.mots:
    title: Words for the story
    gloss: last night / to get on / to go home / it was
    note: '*C''était* is the imparfait of *c''est*: it describes how things were.'
    example_gloss:
    - Last night I was tired.
    - I get on the bus.
    - She goes home.
    - It was a good evening.
  fr.a2.unit83.lesson05.teach.gn_cetait:
    title: C'était
    gloss: It was Noé. It was a good evening.
    note: '*C''était* means ''it was'' and gives identity or description in the past. It is always in the imparfait.'
  fr.a2.unit83.lesson05.teach.gn_scene:
    title: Telling a scene
    gloss: Last night I was waiting for the bus. Suddenly the bus arrived.
    note: Set the scene with the imparfait, then use the passé composé for what happened.
  fr.a2.unit83.lesson05.teach.reading:
    title: Mathieu tells his evening
    gloss: 'Hi Camille, last night I was waiting for the bus. It was raining and it was cold. While I was waiting, the phone rang: it was Noé. Suddenly the bus arrived. I got on and I went home. Mathieu'
    note: The scene is in the imparfait; the events are in the passé composé.
    glosses:
      monté: got on
      rentré: went home
      c'était: it was
  fr.a2.unit83.lesson06.teach.q1:
    title: Camille asks
    gloss: 'Camille: What were you doing last night?'
  fr.a2.unit83.lesson06.teach.a1:
    title: Mathieu answers
    gloss: 'Mathieu: I was waiting for the bus. It was raining a lot.'
  fr.a2.unit83.lesson06.teach.q2:
    title: Camille asks what happened
    gloss: 'Camille: And then?'
  fr.a2.unit83.lesson06.teach.a2:
    title: Mathieu tells what happened
    gloss: 'Mathieu: Suddenly the phone rang. It was Noé.'
  fr.a2.unit83.lesson06.teach.q3:
    title: Camille asks about the bus
    gloss: 'Camille: And the bus?'
  fr.a2.unit83.lesson06.teach.a3:
    title: Mathieu finishes
    gloss: 'Mathieu: While I was talking, the bus left!'
