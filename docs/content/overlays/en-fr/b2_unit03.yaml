    title: "It's the service that impressed me most."
    gloss: "It's the service that impressed me most."
  fr.b2.unit03.lesson04.teach.claim_model_2:
    title: "What I liked was the service."
    gloss: "What I liked was the service."
  fr.b2.unit03.lesson04.teach.grammar_focus:
    title: "C'est...qui / c'est...que puts the focus on a specific element of the sentence: it's the service that impressed me most."
    gloss: "C'est...qui / c'est...que puts the focus on a specific element of the sentence: it's the service that impressed me most."
    note: "English does this with stress alone ('it's the SERVICE that impressed me'); French needs the grammatical cleft construction to achieve the same emphasis in writing or careful speech."

  fr.b2.unit03.lesson05.teach.texte:
    title: "Reading: a café review"
    gloss: "Yesterday, I tried a new café near the bakery. The cake was a bit too sweet, but it seems to me that it's a minor detail. On the other hand, the service was really excellent, absolutely perfect. What I liked most was the warm atmosphere. I particularly recommend this café."
    glosses:
      Hier: yesterday
      "j'ai": "I have (j'ai testé = I tried)"
      testé: "tried (from tester)"
      nouveau: new
      café: café
      près: "near (près de = near)"
      détail: detail
      mineur: minor
      "l'ambiance": "the atmosphere"
      chaleureuse: "warm (feminine)"
      recommande: "recommend (from recommander)"

  fr.b2.unit03.lesson06.teach.et_alors:
    title: "And so?"
    gloss: "And so? / And then?"
