    gloss: "Inès: I tried a new café yesterday."
  fr.b2.unit03.lesson06.teach.dialogue_mathieu_alors:
    title: "Mathieu: And so?"
    gloss: "Mathieu: And so?"
  fr.b2.unit03.lesson06.teach.dialogue_ines_hedge:
    title: "Inès: It seems to me that the cake was a bit too sweet."
    gloss: "Inès: It seems to me that the cake was a bit too sweet."
  fr.b2.unit03.lesson06.teach.dialogue_mathieu_dommage:
    title: "Mathieu: Really? That's too bad."
    gloss: "Mathieu: Really? That's too bad."
  fr.b2.unit03.lesson06.teach.dialogue_ines_emphasis:
    title: "Inès: But the service was really excellent, absolutely perfect!"
    gloss: "Inès: But the service was really excellent, absolutely perfect!"
  fr.b2.unit03.lesson06.teach.dialogue_mathieu_conclusion:
    title: "Mathieu: Sounds like a good place."
    gloss: "Mathieu: Sounds like a good place."
  fr.b2.unit03.lesson06.teach.grammar_recap:
    title: "It seems to me that the cake was a bit too sweet (hedge). The service was really excellent, absolutely perfect (emphasis). Same speaker, two different tones."
    gloss: "It seems to me that the cake was a bit too sweet (hedge). The service was really excellent, absolutely perfect (emphasis). Same speaker, two different tones."
    note: "This is the spine skill in action: the same speaker delivers a hedged criticism and an emphatic compliment about two different aspects of the same experience, without contradiction."

