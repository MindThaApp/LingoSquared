course:
  title: French B2
  description: >-
    Upper-intermediate French: defend a position, speculate about causes
    and consequences, and express nuance -- soften or strengthen a
    statement (hedging, qualification, emphasis, and focus constructions)
    so the same content can be delivered tentatively, neutrally, or
    emphatically.

units:
  fr.b2.unit03.nuance:
    title: "Nuance"
    description: Soften or strengthen a statement -- hedge a criticism, qualify an observation cautiously, emphasize a strong opinion, and use focus constructions to highlight what matters most.

lessons:
  fr.b2.unit03.lesson01.adoucir_une_critique:
    title: "Softening a criticism"
  fr.b2.unit03.lesson02.formuler_avec_prudence:
    title: "Formulating cautiously"
  fr.b2.unit03.lesson03.insister_sur_quelque_chose:
    title: "Emphasizing something"
  fr.b2.unit03.lesson04.mettre_en_valeur:
    title: "Putting the focus on"
  fr.b2.unit03.lesson05.lire_une_critique:
    title: "Reading a review"
  fr.b2.unit03.lesson06.nuance_dans_une_conversation:
    title: "Nuance in a conversation"

teaching:
  fr.b2.unit03.lesson01.teach.un_peu:
    title: "a bit"
    gloss: "a bit / a little"
