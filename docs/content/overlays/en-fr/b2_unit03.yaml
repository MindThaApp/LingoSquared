  fr.b2.unit03.lesson02.teach.aujourdhui:
    title: today
    gloss: today
    example_gloss: "I work today."
  fr.b2.unit03.lesson02.teach.claim_model:
    title: "It looks like the service is slightly slow today."
    gloss: "It looks like the service is slightly slow today."
  fr.b2.unit03.lesson02.teach.grammar_prudence:
    title: "On dirait que and j'ai l'impression que introduce a cautious observation, not a stated fact."
    gloss: "On dirait que and j'ai l'impression que introduce a cautious observation, not a stated fact."

  fr.b2.unit03.lesson03.teach.vraiment_emphase:
    title: "really (emphasis)"
    gloss: "really (emphasis)"
    note: "This is the SAME word as lesson01's *pas vraiment*, now doing the opposite job: standing alone before an adjective, *vraiment* intensifies rather than hedges. *Vraiment excellent* = 'really excellent', not a softened claim."
    example_gloss: "It was really delicious."
  fr.b2.unit03.lesson03.teach.absolument:
    title: absolutely
    gloss: absolutely
    example_gloss: "It's absolutely fantastic."
  fr.b2.unit03.lesson03.teach.tout_a_fait:
    title: "completely / absolutely"
    gloss: "completely / absolutely"
  fr.b2.unit03.lesson03.teach.particulierement:
    title: particularly
    gloss: particularly
    example_gloss: "It's particularly well done."
  fr.b2.unit03.lesson03.teach.excellent:
    title: excellent
    gloss: excellent
    example_gloss: "The service was excellent."
  fr.b2.unit03.lesson03.teach.parfait:
    title: perfect
    gloss: perfect
    example_gloss: "It was perfect."
  fr.b2.unit03.lesson03.teach.claim_model:
    title: "The service was really excellent, absolutely perfect."
    gloss: "The service was really excellent, absolutely perfect."
  fr.b2.unit03.lesson03.teach.grammar_emphase:
    title: "Vraiment can soften (pas vraiment = not really) or strengthen (vraiment excellent = really excellent) depending on its position. Absolument and tout à fait strengthen even more."
    gloss: "Vraiment can soften (pas vraiment = not really) or strengthen (vraiment excellent = really excellent) depending on its position. Absolument and tout à fait strengthen even more."
    note: "Position matters: *vraiment* + adjective = intensifier; *pas* + *vraiment* = hedge on a negative. Absolument and tout à fait only ever intensify."

  fr.b2.unit03.lesson04.teach.ce_qui:
    title: "what... (subject)"
    gloss: "what... (subject relative)"
    note: "*Ce qui* introduces what you're about to say when it's the SUBJECT of the following clause -- 'what pleased me' = *ce qui m'a plu*."
  fr.b2.unit03.lesson04.teach.plaire:
    title: "to please / to like"
    gloss: "to please (X me plaît / m'a plu = I like / liked X)"
    note: "*Plaire* reverses the English construction like *manquer* (unit02): the thing liked is the subject. *Le dessert m'a plu* literally 'the dessert pleased me' = 'I liked the dessert'."
    example_gloss: "I liked the dessert."
  fr.b2.unit03.lesson04.teach.ce_qui_ma_plu:
    title: "What I liked was..."
    gloss: "What I liked was..."
    note: "*Ce qui m'a plu, c'est...* is the standard cleft frame for naming your favorite thing -- literally 'what pleased me, it's...'."
  fr.b2.unit03.lesson04.teach.ce_que:
    title: "what... (object)"
    gloss: "what... (object relative)"
    note: "*Ce que* is used instead of *ce qui* when 'what' is the OBJECT of the following clause, not the subject."
  fr.b2.unit03.lesson04.teach.impressionner:
    title: "to impress"
    gloss: "to impress"
    example_gloss: "The dessert impressed me."
  fr.b2.unit03.lesson04.teach.le_plus:
    title: "the most"
    gloss: "the most"
