  fr.b2.unit03.lesson01.teach.il_me_semble_que:
    title: "it seems to me that..."
    gloss: "it seems to me that..."
    note: "*Il me semble que* is a personal, opinion-based hedge -- softer than stating something as flat fact."
  fr.b2.unit03.lesson01.teach.pas_vraiment:
    title: "not really"
    gloss: "not really"
    note: "*Pas vraiment* softens a negative -- 'not really' rather than a blunt 'no'. Note that *vraiment* alone later does the OPPOSITE job (emphasis) -- see lesson03."
  fr.b2.unit03.lesson01.teach.assez:
    title: "quite / rather"
    gloss: "quite / rather (moderating)"
    note: "*Assez* moderates a statement -- similar force to *plutôt*, slightly more measured."
    example_gloss: "It's quite sweet."
  fr.b2.unit03.lesson01.teach.le_gateau:
    title: "the cake"
    gloss: "the cake"
    example_gloss: "The cake is delicious."
  fr.b2.unit03.lesson01.teach.etait:
    title: was
    gloss: "was (imparfait of être)"
    example_gloss: "The meal was good."
  fr.b2.unit03.lesson01.teach.trop:
    title: "too (much)"
    gloss: "too (excessively)"
    example_gloss: "It's too sweet."
  fr.b2.unit03.lesson01.teach.sucre:
    title: sweet
    gloss: sweet
    example_gloss: "This dessert is very sweet."
  fr.b2.unit03.lesson01.teach.claim_model:
    title: "The cake was a bit too sweet."
    gloss: "The cake was a bit too sweet."
  fr.b2.unit03.lesson01.teach.grammar_adoucir:
    title: "Un peu, plutôt, and assez soften a criticism. Il me semble que and pas vraiment do the same thing."
    gloss: "Un peu, plutôt, and assez soften a criticism. Il me semble que and pas vraiment do the same thing."
    note: "These hedges make a criticism gentler without changing what you actually mean -- the core B2 skill of this lesson."

  fr.b2.unit03.lesson02.teach.on_dirait_que:
    title: "it looks like..."
    gloss: "it looks like... / it seems that..."
    note: "*On dirait que* is more visual/inferential than *il me semble que* -- based on what you can observe, rather than a personal opinion."
  fr.b2.unit03.lesson02.teach.jai_limpression_que:
    title: "I have the impression that..."
    gloss: "I have the impression that..."
