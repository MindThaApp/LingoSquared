answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A1
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation or liaison marks.

course:
  title: "French A1"
  description: >-
    Giving a short account of a recent completed event using the passé
    composé, with both the avoir and être auxiliaries, continuing Inès and
    Mathieu's cooking-workshop narrative as Mathieu recounts a mishap from
    last Saturday's session. English-specific guidance highlights that
    French uses two different auxiliary verbs (avoir for most verbs, être
    for a small set including aller/arriver/rester) where English always
    uses "have," and that être-auxiliary participles agree in gender with
    the subject (arrivé/arrivée).

units:
  fr.a1.unit12.past_events:
    title: "What happened?"

lessons:
  fr.a1.unit12.lesson01.passe_compose_avoir:
    title: "The passé composé with avoir"
  fr.a1.unit12.lesson02.passe_compose_etre:
    title: "The passé composé with être"
  fr.a1.unit12.lesson03.dialogue_atelier_dernier:
    title: "Last Saturday's workshop"

teaching:
  fr.a1.unit12.lesson01.teach.jai_prepare:
    title: "I prepared"
    gloss: "I prepared / I made"
    note: "Regular -ER verbs form their passé composé participle in *-é*: *préparer* → *préparé*, used with *avoir*."
    example_gloss: "I made a cake for the workshop."
  fr.a1.unit12.lesson01.teach.jai_achete:
    title: "I bought"
    gloss: "I bought"
    note: "*Acheter* follows the same *avoir* + *-é* pattern as *préparer*."
    example_gloss: "I bought vegetables at the market."
  fr.a1.unit12.lesson01.teach.jai_oublie:
    title: "I forgot"
    gloss: "I forgot"
    note: "*Oublier* → *oublié*, the same regular pattern again."
    example_gloss: "I forgot the sugar at home!"
  fr.a1.unit12.lesson01.teach.tu_as_aime:
    title: "You liked"
    gloss: "you liked"
    note: "*Tu as* + participle is the *tu*-form of the same *avoir* construction."
    example_gloss: "Did you like the cake?"
  fr.a1.unit12.lesson01.teach.il_a_goute:
    title: "He tasted"
    gloss: "he tasted"
    note: "*Il a* + participle is the *il*-form -- the auxiliary *avoir* changes with the subject, the participle stays the same."
    example_gloss: "Mathieu tasted the sauce."
  fr.a1.unit12.lesson01.teach.grammar_avoir_participe:
    title: "Avoir + past participle"
    gloss: "avoir + past participle (-é)"
    note: "Most French verbs form their passé composé with *avoir* as the auxiliary, plus a past participle ending in *-é* for regular -ER verbs."
  fr.a1.unit12.lesson01.teach.la_semaine_derniere:
    title: "Last week"
    gloss: "last week"
    note: "*Dernière* (last) agrees with the feminine *semaine* -- the masculine form is *dernier*, as in *samedi dernier* (last Saturday)."
    example_gloss: "Last week, I made a cake."

  fr.a1.unit12.lesson02.teach.je_suis_arrive:
    title: "I arrived"
    gloss: "I arrived"
    note: "*Arriver* is one of a small set of verbs (mostly of motion) that use *être* instead of *avoir* as the auxiliary."
    example_gloss: "I arrived late to the workshop."
  fr.a1.unit12.lesson02.teach.je_suis_alle:
    title: "I went"
    gloss: "I went"
    note: "*Aller* also takes *être*. The participle agrees with the subject: *allé* (masculine) or *allée* (feminine, as Inès would say)."
    example_gloss: "I went to the market before the workshop."
  fr.a1.unit12.lesson02.teach.il_est_reste:
    title: "He stayed"
    gloss: "he stayed"
    note: "*Rester* (to stay) is another *être*-auxiliary verb, following the same agreement pattern."
    example_gloss: "Mathieu stayed to clean the kitchen."
  fr.a1.unit12.lesson02.teach.grammar_etre_accord:
    title: "Être + past participle agreement"
    gloss: "être + past participle (agrees with the subject)"
    note: "With *être*-auxiliary verbs, the past participle agrees in gender and number with the subject, unlike *avoir*-auxiliary verbs."
  fr.a1.unit12.lesson02.teach.en_retard:
    title: "Late"
    gloss: "late"
    note: "*En retard* describes arriving after the expected time -- a common companion to *arriver*."
    example_gloss: "The bus arrived late."
  fr.a1.unit12.lesson02.teach.finalement:
    title: "Finally / in the end"
    gloss: "finally / in the end"
    note: "*Finalement* wraps up a short story, signaling the final outcome after earlier complications."
    example_gloss: "In the end, the cake was delicious."

  fr.a1.unit12.lesson03.teach.line01:
    title: "Ask what happened"
    gloss: "Inès asks what happened at last Saturday's workshop -- she couldn't come."
    note: "*Qu'est-ce qui s'est passé ?* (what happened?) is the standard way to ask about a past event."
  fr.a1.unit12.lesson03.teach.line02:
    title: "Recount the mishap"
    gloss: "Mathieu says oh no, he arrived late and forgot the butter at home!"
    note: "Two passé composé forms in one sentence: *être* (*je suis arrivé*) and *avoir* (*j'ai oublié*)."
  fr.a1.unit12.lesson03.teach.line03:
    title: "Ask what he did"
    gloss: "Inès asks what he did next."
    note: "*Qu'est-ce que tu as fait ?* (what did you do?) uses the irregular passé composé of *faire*."
  fr.a1.unit12.lesson03.teach.line04:
    title: "Describe the fix"
    gloss: "Mathieu says he quickly went to the corner grocery store."
    note: "*L'épicerie du coin* (the corner grocery store) echoes unit09's *au coin de la rue*."
  fr.a1.unit12.lesson03.teach.line05:
    title: "Ask if it worked"
    gloss: "Inès asks if he found butter there."
    note: "*Tu as trouvé... ?* (did you find... ?) is another regular *avoir*-auxiliary question."
  fr.a1.unit12.lesson03.teach.line06:
    title: "Give the happy ending"
    gloss: "Mathieu says yes, and in the end, the cake was delicious!"
    note: "Closes the story on a positive note with *finalement*, resolving the earlier mishap."

exercises:
  fr.a1.unit12.lesson01.exercise01.select_jai_prepare:
    instruction: "Which phrase means \"I prepared / I made\"?"
    correct_option: "j'ai préparé"
    distractors: ["j'ai acheté", "j'ai oublié"]
    accepted_answers: ["j'ai préparé"]

  fr.a1.unit12.lesson01.exercise02.listen_jai_prepare:
    instruction: "Listen and select the phrase you hear."
    correct_option: "j'ai préparé"
    distractors: ["j'ai acheté", "j'ai oublié"]
    accepted_answers: ["j'ai préparé"]

  fr.a1.unit12.lesson01.exercise03.match_avoir_forms:
    instruction: "Match each French passé composé phrase to its English meaning."
    correct_response:
      "j'ai préparé": "I prepared / I made"
      "j'ai acheté": "I bought"
      "j'ai oublié": "I forgot"
      "tu as aimé": "you liked"
      "il a goûté": "he tasted"
      "la semaine dernière": "last week"

  fr.a1.unit12.lesson01.exercise04.order_jai_achete_legumes:
    instruction: "Build the sentence: I bought vegetables at the market."
    correct_response: ["J'ai", "acheté", "des", "légumes", "au", "marché"]

  fr.a1.unit12.lesson01.exercise05.fill_jai_oublie:
    instruction: "Complete the sentence with the participle for \"forgot.\""
    accepted_answers: ["oublié"]

  fr.a1.unit12.lesson01.exercise06.speak_what_you_prepared:
    instruction: "Say what you made for the workshop."
    accepted_answers:
      - "J'ai préparé un gâteau."
      - "J'ai préparé un gâteau pour l'atelier."

  fr.a1.unit12.lesson02.exercise01.select_je_suis_arrive:
    instruction: "Which phrase means \"I arrived\"?"
    correct_option: "je suis arrivé"
    distractors: ["je suis allé", "il est resté"]
    accepted_answers: ["je suis arrivé", "je suis arrivée"]

  fr.a1.unit12.lesson02.exercise02.listen_je_suis_arrive:
    instruction: "Listen and select the phrase you hear."
    correct_option: "je suis arrivé"
    distractors: ["je suis allé", "il est resté"]
    accepted_answers: ["je suis arrivé", "je suis arrivée"]

  fr.a1.unit12.lesson02.exercise03.match_etre_forms:
    instruction: "Match each French passé composé phrase to its English meaning."
    correct_response:
      "je suis arrivé(e)": "I arrived"
      "je suis allé(e)": "I went"
      "il est resté": "he stayed"
      "en retard": "late"
      finalement: "finally / in the end"

  fr.a1.unit12.lesson02.exercise04.order_je_suis_allee_marche:
    instruction: "Build Inès's sentence: I went to the market before the workshop."
    correct_response: ["Je", "suis", "allée", "au", "marché", "avant", "l'atelier"]

  fr.a1.unit12.lesson02.exercise05.fill_en_retard:
    instruction: "Complete the sentence with the word for \"late.\""
    accepted_answers: ["retard"]

  fr.a1.unit12.lesson02.exercise06.reply_what_happened:
    instruction: "Answer: say you arrived late and forgot the sugar."
    accepted_answers:
      - "Je suis arrivé en retard, et j'ai oublié le sucre."
      - "Je suis arrivée en retard, et j'ai oublié le sucre."

  fr.a1.unit12.lesson03.exercise01.comprehend_what_mathieu_forgot:
    instruction: "Listen to the dialogue. What did Mathieu forget?"
    correct_option: "The butter"
    distractors: ["The sugar", "The vegetables"]
    accepted_answers: ["The butter"]

  fr.a1.unit12.lesson03.exercise02.comprehend_where_mathieu_went:
    instruction: "Where did Mathieu go to fix the problem?"
    correct_option: "The corner grocery store"
    distractors: ["The bakery", "The pharmacy"]
    accepted_answers: ["The corner grocery store"]

  fr.a1.unit12.lesson03.exercise03.select_how_it_ended:
    instruction: "How did the story end?"
    correct_option: "The cake was delicious"
    distractors: ["The cake was ruined", "Mathieu made a different dessert"]
    accepted_answers: ["The cake was delicious"]

  fr.a1.unit12.lesson03.exercise04.order_je_suis_alle_rapidement:
    instruction: "Build Mathieu's sentence about going to the grocery store."
    correct_response: ["Je", "suis", "allé", "rapidement", "à", "l'épicerie", "du", "coin"]

  fr.a1.unit12.lesson03.exercise05.reply_what_you_did:
    instruction: "Take Mathieu's role. Say you quickly went to the corner grocery store."
    accepted_answers:
      - "Je suis allé rapidement à l'épicerie du coin."
      - "Je suis allée rapidement à l'épicerie du coin."

  fr.a1.unit12.lesson03.exercise06.speak_recount_the_mishap:
    instruction: "Recount out loud what happened: you arrived late and forgot the butter."
    accepted_answers:
      - "Je suis arrivé en retard, et j'ai oublié le beurre."
      - "Je suis arrivée en retard, et j'ai oublié le beurre."
