review:
  status: reviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Overlay for French C1 unit 02 on implicit meaning: inference, implication,
    irony, and understatement. English-speaker interference risks: reading an
    ironic or understated remark literally (missing the opposite meaning), and
    writing an open production prompt that a learner could answer with several
    different ironic or understated forms. The production exercises therefore
    name exact taught models and accept those strings. No sibling-direction
    overlay was consulted.

course:
  title: French C1
  description: "Advanced French inference: implication, irony, and understatement — reading what is meant beyond what is said."

units:
  fr.c1.unit02.implicite_ironie:
    title: "The implicit and irony"
    description: "Grasp and convey implicit meaning: infer, imply, be ironic, and understate, recognizing what is meant beyond the literal words."

lessons:
  fr.c1.unit02.implicite_ironie.lesson01.euphemisme:
    title: "Saying less to mean more"
  fr.c1.unit02.implicite_ironie.lesson02.ironie:
    title: "Irony: saying the opposite"
  fr.c1.unit02.implicite_ironie.lesson03.ton_intonation:
    title: "Tone and intonation"
  fr.c1.unit02.implicite_ironie.lesson04.lire_entre_les_lignes:
    title: "Reading between the lines"
  fr.c1.unit02.implicite_ironie.lesson05.implicite_oral:
    title: "Understanding the implicit in speech"
  fr.c1.unit02.implicite_ironie.lesson06.ecrire_dire_implicite:
    title: "Writing and saying the implicit"

teaching:
  fr.c1.unit02.implicite_ironie.lesson01.teach.cest_pas_mal:
    title: "it's not bad"
    gloss: "it's not bad (understatement for 'it's good')"
    note: "*C'est pas mal* (it's not bad) is an understatement: it actually means the thing is good."
  fr.c1.unit02.implicite_ironie.lesson01.teach.pas_mal_du_tout:
    title: "not bad at all"
    gloss: "not bad at all (understatement for 'very good')"
    note: "*Pas mal du tout* (not bad at all) understates even more: it really means very good."
  fr.c1.unit02.implicite_ironie.lesson01.teach.cest_pas_terrible:
    title: "it's not great"
    gloss: "it's not great (understatement for 'it's bad')"
    note: "*C'est pas terrible* is a false friend: it does NOT mean 'great'. It understates the opposite — the thing is mediocre or bad."
  fr.c1.unit02.implicite_ironie.lesson01.teach.leuphemisme:
    title: "the euphemism"
    gloss: "the euphemism / understatement"
    note: "*L'euphémisme* (euphemism) softens a judgement by saying less than is meant."
    example_gloss: "It's a euphemism, obviously."
  fr.c1.unit02.implicite_ironie.lesson01.teach.le_sous_entendu:
    title: "the implied meaning"
    gloss: "the implied meaning"
    note: "*Le sous-entendu* (the implied meaning) is what is understood without being said directly."
    example_gloss: "There is an implied meaning in his sentence."
  fr.c1.unit02.implicite_ironie.lesson01.teach.modele_euphemisme:
    title: "A model understatement"
    gloss: "It's not bad at all, your cake."
    note: "Inès understates: *C'est pas mal du tout* means the cake is actually really good, and *ton* keeps informal *tu*."

  fr.c1.unit02.implicite_ironie.lesson02.teach.tu_parles:
    title: "as if!"
    gloss: "as if! / I don't believe it"
    note: "*Tu parles !* (literally 'you're talking!') is an ironic exclamation meaning 'as if!'."
  fr.c1.unit02.implicite_ironie.lesson02.teach.tu_parles_dune_reussite:
    title: "some success!"
    gloss: "some success! (ironic: it is a failure)"
    note: "*Tu parles d'une réussite !* (some success!) is ironic: it really means a complete failure."
  fr.c1.unit02.implicite_ironie.lesson02.teach.au_second_degre:
    title: "ironically / not literally"
    gloss: "ironically / not literally"
    note: "*Au second degré* (at the second degree) means something is meant ironically, not literally."
  fr.c1.unit02.implicite_ironie.lesson02.teach.lironie:
    title: "irony"
    gloss: "irony"
    note: "*L'ironie* (irony) says the opposite of what the words literally mean."
    example_gloss: "Irony consists in saying the opposite of what you think."
  fr.c1.unit02.implicite_ironie.lesson02.teach.modele_ironie:
    title: "A model ironic exclamation"
    gloss: "Some success!"
    note: "This ironic exclamation reverses its literal words: *Tu parles d'une réussite !* really means it is a failure."

  fr.c1.unit02.implicite_ironie.lesson03.teach.cest_le_moment_ideal:
    title: "it's the ideal moment"
    gloss: "it's the ideal moment (ironic: the worst time)"
    note: "*C'est le moment idéal* (it's the ideal moment) said ironically means the worst possible time."
  fr.c1.unit02.implicite_ironie.lesson03.teach.tomber_en_panne:
    title: "to break down"
    gloss: "to break down"
    note: "*Tomber en panne* (to break down) is the phrase for a machine or oven failing."
  fr.c1.unit02.implicite_ironie.lesson03.teach.detacher_chaque_mot:
    title: "to draw out each word"
    gloss: "to draw out each word"
    note: "*Détacher chaque mot* (to draw out each word) is how a speaker signals irony with slow, deliberate delivery."
  fr.c1.unit02.implicite_ironie.lesson03.teach.le_ton:
    title: "the tone"
    gloss: "the tone"
    note: "*Le ton* (the tone) is the first cue that a remark is ironic."
    example_gloss: "The tone of his voice is ironic."
  fr.c1.unit02.implicite_ironie.lesson03.teach.lintonation:
    title: "the intonation"
    gloss: "the intonation"
    note: "*L'intonation* (the intonation) carries the ironic cue that reverses the literal words."
    example_gloss: "It is the intonation that reveals the irony."
  fr.c1.unit02.implicite_ironie.lesson03.teach.modele_ton:
    title: "A model ironic remark"
    gloss: "It's the ideal moment to break down."
    note: "This remark uses *C'est le moment idéal* ironically: the timing is actually terrible."

  fr.c1.unit02.implicite_ironie.lesson04.teach.au_premier_degre:
    title: "literally / at face value"
    gloss: "literally / at face value"
    note: "*Au premier degré* (at the first degree) means taken literally, without irony."
  fr.c1.unit02.implicite_ironie.lesson04.teach.sous_entendre:
    title: "to imply"
    gloss: "to imply"
    note: "*Sous-entendre* (to imply) means to suggest without stating directly."
    example_gloss: "He implies that she has already left."
  fr.c1.unit02.implicite_ironie.lesson04.teach.lire_entre_les_lignes:
    title: "to read between the lines"
    gloss: "to read between the lines"
    note: "*Lire entre les lignes* (to read between the lines) means to infer the actual meaning behind the literal words."
    example_gloss: "You have to read between the lines."
  fr.c1.unit02.implicite_ironie.lesson04.teach.la_litote:
    title: "litotes / understatement"
    gloss: "litotes / understatement"
    note: "*La litote* (litotes) is a figure of speech that says less to mean more."
    example_gloss: "It is a litotes, of course."
  fr.c1.unit02.implicite_ironie.lesson04.teach.le_four_est_tombe:
    title: "the oven broke down"
    gloss: "the oven broke down"
    note: "*Le four est tombé en panne* (the oven broke down) states a literal fact."
  fr.c1.unit02.implicite_ironie.lesson04.teach.la_commande_en_retard:
    title: "the order went out late"
    gloss: "the order went out late"
    note: "*La commande est partie en retard* (the order went out late) is another literal fact."
  fr.c1.unit02.implicite_ironie.lesson04.teach.a_fait_bruler:
    title: "he burned his cake"
    gloss: "he burned his cake"
    note: "*Mathieu a fait brûler son gâteau* (Mathieu burned his cake) states what actually happened."
  fr.c1.unit02.implicite_ironie.lesson04.teach.le_chef_a_trouve:
    title: "the chef found it magnificent"
    gloss: "the chef found it magnificent (ironic: he was furious)"
    note: "*Le chef a trouvé ça magnifique* is ironic: after a burnt cake, 'magnificent' means the opposite."
  fr.c1.unit02.implicite_ironie.lesson04.teach.modele_lecture:
    title: "A passage to read between the lines"
    gloss: "The oven broke down and the order went out late. Mathieu burned his cake. The chef found it magnificent. In short, it's not bad at all, as a week."
    note: "This passage mixes literal facts with ironic and understated judgements; the reader must distinguish them."

  fr.c1.unit02.implicite_ironie.lesson05.teach.encore:
    title: "the oven broke down again"
    gloss: "the oven broke down again"
    note: "*Encore* (again) signals that this is a repeated problem — a cue for the frustration behind the irony."
  fr.c1.unit02.implicite_ironie.lesson05.teach.on_avait_toute_la_journee:
    title: "we had the whole day"
    gloss: "we had the whole day (implied: no time left)"
    note: "*On avait toute la journée* (we had the whole day) is ironic implication: they actually have very little time."
  fr.c1.unit02.implicite_ironie.lesson05.teach.limplicite:
    title: "the implicit"
    gloss: "the implicit"
    note: "*L'implicite* (the implicit) is the unstated meaning carried by irony and understatement."
    example_gloss: "The implicit is what you understand without it being said."
  fr.c1.unit02.implicite_ironie.lesson05.teach.modele_echange:
    title: "A model ironic reply"
    gloss: "As if! We had the whole day."
    note: "Inès replies with *Tu parles !* (as if!) plus the ironic *on avait toute la journée* — the opposite of the real situation."

  fr.c1.unit02.implicite_ironie.lesson06.teach.leur_nouvelle_boutique:
    title: "their new shop"
    gloss: "their new shop"
    note: "*Leur nouvelle boutique* (their new shop) names the rival shop being judged."
  fr.c1.unit02.implicite_ironie.lesson06.teach.modele_jugement_ecrit:
    title: "A model understated judgement"
    gloss: "It's not great, their new shop."
    note: "This understated message conveys a sceptical judgement — the shop is actually bad — without saying so directly."
  fr.c1.unit02.implicite_ironie.lesson06.teach.le_jugement:
    title: "the judgement"
    gloss: "the judgement"
    note: "*Le jugement* (the judgement) is the unstated opinion carried by an ironic or understated remark."
    example_gloss: "The judgement stays implicit, but it is clear."
  fr.c1.unit02.implicite_ironie.lesson06.teach.modele_contexte_message:
    title: "Context and understated message"
    gloss: "A rival shop has opened across the street. It's not great, their new shop."
    note: "This is the exact model for the writing task: a short context sentence followed by the understated judgement *C'est pas terrible*, which implicitly means the shop is actually bad."
  fr.c1.unit02.implicite_ironie.lesson06.teach.modele_remarque_explication:
    title: "Remark and explanation"
    gloss: "It's the ideal moment to break down. In fact, it's the worst moment."
    note: "This is the exact model for the speaking task: the ironic remark using *C'est le moment idéal*, followed by an explanation of the unstated judgement, namely that this is actually the worst moment."

exercises:
