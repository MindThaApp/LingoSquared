        status: correct
    feedback: "Irony says the opposite of what the words literally mean."
  fr.c1.unit02.implicite_ironie.lesson02.exercise04.order_ironie:
    instruction: "Put the French words in order to form the ironic exclamation."
    accepted_answers:
      - {value: "Tu parles d'une réussite", status: correct}
