    feedback: "C'est le moment idéal pour tomber en panne literally means 'it's the ideal moment to break down', but ironically it means the timing is terrible."
  fr.c1.unit02.implicite_ironie.lesson03.exercise03.match_ton:
    instruction: "Match each French tone phrase to its English meaning."
    accepted_answers:
      - value: {"C'est le moment idéal": "it's the ideal moment (ironic: the worst time)", "tomber en panne": "to break down", "détacher chaque mot": "to draw out each word", "le ton": "the tone", "l'intonation": "the intonation", "l'ironie": "irony"}
        status: correct
    feedback: "Tone, intonation, and drawing out each word are the cues that reveal irony."
  fr.c1.unit02.implicite_ironie.lesson03.exercise04.order_ton:
    instruction: "Put the French words in order to form the phrase 'to break down'."
    accepted_answers:
      - {value: "tomber en panne", status: correct}
    feedback: "The phrase is tomber en panne — to break down."
  fr.c1.unit02.implicite_ironie.lesson03.exercise05.speak_ton:
