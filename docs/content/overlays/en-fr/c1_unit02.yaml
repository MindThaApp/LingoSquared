    feedback: "C'est pas mal du tout, ton gâteau."
  fr.c1.unit02.implicite_ironie.lesson01.exercise06.dictation_euphemisme:
    instruction: "Type exactly what you hear."
    correct_response: "C'est pas mal du tout, ton gâteau."
    orthography_strict: true
    feedback: "C'est pas mal du tout, ton gâteau."

