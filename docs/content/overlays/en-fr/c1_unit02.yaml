    accepted_answers: [{value: "c'est pas mal", status: correct}]
    feedback: "*C'est pas mal* literally means 'it's not bad' — an understatement that really means 'it's good'."
  fr.c1.unit02.implicite_ironie.lesson01.exercise02.listen_euphemisme:
    instruction: "Listen and select what you hear."
    correct_option: "It's not bad at all, your cake."
    distractors: ["It's terrible, your cake.", "It's not good at all, your cake.", "It's not bad at all, your tarts."]
    accepted_answers: [{value: "It's not bad at all, your cake.", status: correct}]
    feedback: "C'est pas mal du tout, ton gâteau means it's not bad at all, your cake — understatement for 'it's really good'."
  fr.c1.unit02.implicite_ironie.lesson01.exercise03.match_euphemisme:
    instruction: "Match each French understatement phrase to its English meaning."
    accepted_answers:
      - value: {"c'est pas mal": "it's not bad (understatement for good)", "pas mal du tout": "not bad at all (understatement for very good)", "c'est pas terrible": "it's not great (understatement for bad)", "l'euphémisme": "the euphemism / understatement", "le sous-entendu": "the implied meaning", "ton gâteau": "your cake"}
        status: correct
