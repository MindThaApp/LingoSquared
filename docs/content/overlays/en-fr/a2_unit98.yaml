answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A2 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or liaison marks.
course:
  title: French A2
  description: Intermediate French continuing the Camille and Mathieu storyline, now with a grammar-led block on everyday functions.
  learning_goal: Talk about real conditions with si plus the present, followed by the present, the future or an imperative.
units:
  fr.a2.unit98.si_il_pleut:
    title: If it rains
    description: Talk about real conditions with si plus the present, for example weather plans and shop policies.
lessons:
  fr.a2.unit98.lesson01.si_present:
    title: If I am hungry
  fr.a2.unit98.lesson02.meteo:
    title: If the weather is nice
  fr.a2.unit98.lesson03.futur:
    title: If you come, I will prepare
  fr.a2.unit98.lesson04.regles:
    title: If you have the receipt
  fr.a2.unit98.lesson05.pique_nique:
    title: Camille's picnic
  fr.a2.unit98.lesson06.dialogue:
    title: Camille and Mathieu plan the picnic
teaching:
  fr.a2.unit98.lesson01.teach.mots:
    title: If and the present
    gloss: if / if he, if it / to be hungry / to be thirsty / to drink / water
    example_gloss:
    - If I am hungry, I eat.
    - If you are thirsty, you drink water.
    - If it rains, I stay at home.
  fr.a2.unit98.lesson01.teach.gn_si:
    title: Si plus present
    gloss: If I am hungry, I eat.
    note: '*Si* plus the present introduces a real condition: it can really happen. The result is also in the present.'
  fr.a2.unit98.lesson01.teach.gn_elision:
    title: S'il, but si elle
    gloss: If it rains, I stay. If she comes, I stay.
    note: '*Si* and *il* join into *s''il*. There is no elision before *elle*: *si elle*.'
  fr.a2.unit98.lesson01.teach.gn_ordre:
    title: Two places for the condition
    gloss: I eat if I am hungry. If I am hungry, I eat.
    note: The *si* clause can come first or last. Use a comma only when it comes first.
  fr.a2.unit98.lesson01.teach.phrase:
    title: A condition
    gloss: If I am hungry, I eat.
  fr.a2.unit98.lesson02.teach.mots:
    title: Weather plans
    gloss: the weather is nice / it is cold / the weather; time / bad (masc.) / we (informal) / the park
    example_gloss:
    - If the weather is nice, we go to the park.
    - If it is cold, we stay at home.
    - If the weather is bad, we stay at my place.
  fr.a2.unit98.lesson02.teach.gn_meteo:
    title: Weather conditions
    gloss: If the weather is nice, we go to the park.
    note: 'Weather phrases with *il fait* take *s''il* after *si*: *s''il fait beau*, *s''il fait froid*.'
  fr.a2.unit98.lesson02.teach.gn_on:
    title: On for we
    gloss: If the weather is bad, we stay at my place.
    note: 'In everyday speech *on* means ''we''. Its verb is in the *il* form: *on reste*.'
  fr.a2.unit98.lesson02.teach.gn_negation:
    title: Negative condition
    gloss: If the weather is not nice, we stay at home.
    note: '*Ne ... pas* goes around the verb inside the *si* clause: *s''il ne fait pas beau*.'
  fr.a2.unit98.lesson02.teach.phrase:
    title: A weather plan
    gloss: If the weather is nice, we go to the park.
  fr.a2.unit98.lesson03.teach.mots:
    title: What will happen
    gloss: tomorrow / a cake / to prepare, to make / to bring / time
    example_gloss:
    - If you come on Saturday, I will make a cake.
    - If the weather is nice tomorrow, we will go to the park.
    - If I have time, I will bring some bread.
  fr.a2.unit98.lesson03.teach.gn_futur:
    title: Si plus present, then future
    gloss: If you come on Saturday, I will make a cake.
    note: The *si* clause stays in the present. The result can be in the futur simple.
  fr.a2.unit98.lesson03.teach.gn_demain:
    title: A plan for tomorrow
    gloss: If the weather is nice tomorrow, we will go to the park.
    note: 'Even when the plan is for tomorrow, the verb after *si* is present: *s''il fait beau*, never *s''il fera beau*.'
  fr.a2.unit98.lesson03.teach.gn_temps:
    title: Avoir le temps
    gloss: If I have time, I will bring some bread.
    note: '*Avoir le temps* means ''to have time''. It is a common condition.'
  fr.a2.unit98.lesson03.teach.phrase:
    title: A promise with a condition
    gloss: If you come, I will make a cake.
  fr.a2.unit98.lesson04.teach.mots:
    title: Rules and advice
    gloss: a shop / an item / to return / the receipt / to refund / a sweater
    example_gloss:
    - If you have the receipt, we refund you.
    - If you do not have the receipt, you cannot return the item.
    - If you are cold, put on a sweater.
  fr.a2.unit98.lesson04.teach.gn_magasin:
    title: A shop rule
    gloss: If you have the receipt, we refund you.
    note: Shops state their rules with *si* plus the present. The result is also present. *On* is the shop speaking.
  fr.a2.unit98.lesson04.teach.gn_pouvoir:
    title: Si plus pouvoir
    gloss: If you do not have the receipt, you cannot return the item.
    note: 'The result often uses *pouvoir*: it says what you can or cannot do.'
  fr.a2.unit98.lesson04.teach.gn_imperatif:
    title: Si plus command
    gloss: If you are cold, put on a sweater. If you are hungry, eat.
    note: 'The result can be a command. With *tu*, drop the *tu* and the final -s of -er verbs: *mange*. With *vous*, use *mangez*.'
  fr.a2.unit98.lesson04.teach.phrase:
    title: A shop rule
    gloss: If you have the receipt, we refund you.
  fr.a2.unit98.lesson05.teach.mots:
    title: Words for the message
    gloss: a picnic / to do, to make / call me / at my place
    example_gloss:
    - We are having a picnic.
    - Call me if you cannot come.
  fr.a2.unit98.lesson05.teach.gn_apporte:
    title: Si plus command
    gloss: If you come, bring some bread.
    note: 'A command in the result gives an instruction: *apporte* for *tu*.'
  fr.a2.unit98.lesson05.teach.gn_appelle:
    title: Command plus moi
    gloss: If you cannot come, call me.
    note: 'After a command, *moi* follows with a hyphen: *appelle-moi*. Learn it as a set phrase.'
  fr.a2.unit98.lesson05.teach.reading:
    title: Camille writes to Mathieu
    gloss: Hi Mathieu! On Saturday, if the weather is nice, we are having a picnic in the park. If you come, bring some bread. If it rains, we stay at my place and I make a cake. If you cannot come, call me. Camille
    note: Each condition is followed by its result.
    glosses:
      pique-nique: picnic
      gâteau: cake
  fr.a2.unit98.lesson06.teach.q1:
    title: Camille invites
    gloss: 'Camille: Mathieu, are you coming on Saturday?'
  fr.a2.unit98.lesson06.teach.a1:
    title: Mathieu asks
    gloss: 'Mathieu: Yes, if I am free. What are we doing?'
  fr.a2.unit98.lesson06.teach.q2:
    title: Camille gives the sunny plan
    gloss: 'Camille: If the weather is nice, we are having a picnic in the park.'
  fr.a2.unit98.lesson06.teach.a2:
    title: Mathieu asks about rain
    gloss: 'Mathieu: And if it rains?'
  fr.a2.unit98.lesson06.teach.q3:
    title: Camille gives the rainy plan
    gloss: 'Camille: If it rains, we stay at my place. If you come, I will make a cake.'
  fr.a2.unit98.lesson06.teach.a3:
    title: Mathieu offers bread
    gloss: 'Mathieu: Great! If I have time, I will bring some bread.'
