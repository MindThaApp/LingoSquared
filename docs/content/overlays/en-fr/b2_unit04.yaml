course:
  title: French B2
  description: >-
    Upper-intermediate French: defend a position, speculate about causes
    and consequences, express nuance, and recount a complex sequence of
    events with shifting time reference -- background versus foreground,
    events before other past events, and interrupted or ongoing actions,
    keeping the timeline unambiguous.

units:
  fr.b2.unit04.recit:
    title: "Telling a story"
    description: Recount a complex sequence of events with shifting time reference -- background versus foreground, events before other past events, and interrupted or ongoing actions, keeping the timeline unambiguous.

lessons:
  fr.b2.unit04.lesson01.larriere_plan:
    title: "The background: how it was"
  fr.b2.unit04.lesson02.levenement_et_lordre:
    title: "The event and the order"
  fr.b2.unit04.lesson03.quand_pendant_que_alors_que:
    title: "When, while, whereas"
  fr.b2.unit04.lesson04.le_passe_avant_le_passe:
    title: "The past before the past"
  fr.b2.unit04.lesson05.quest_ce_qui_sest_passe_en_premier:
    title: "What happened first?"
  fr.b2.unit04.lesson06.raconter_toute_lhistoire:
    title: "Telling the whole story"

teaching:
  fr.b2.unit04.lesson01.teach.il_etait_huit_heures:
    title: "It was eight o'clock."
    gloss: "It was eight o'clock."
    note: "*Il était + [time]* is the standard way to set the time at the start of a story, always in the imparfait -- describing the state of things, not a completed event."
  fr.b2.unit04.lesson01.teach.il_faisait_beau:
    title: "The weather was nice."
    gloss: "The weather was nice."
    note: "*Il faisait beau/mauvais/froid/chaud* -- weather description, always imparfait when setting a scene."
  fr.b2.unit04.lesson01.teach.il_y_avait:
    title: "there was / there were"
    gloss: "there was / there were"
    note: "*Il y avait* (imparfait of *il y a*) describes what was present in a scene -- background, not an event."
    example_gloss: "There were people around."
  fr.b2.unit04.lesson01.teach.la_boutique:
    title: "the shop"
    gloss: "the shop"
    example_gloss: "The shop is pretty."
  fr.b2.unit04.lesson01.teach.calme:
    title: calm
    gloss: calm
    example_gloss: "The morning was calm."
  fr.b2.unit04.lesson01.teach.occupe:
    title: busy
    gloss: busy
    example_gloss: "The afternoon was busy."
  fr.b2.unit04.lesson01.teach.claim_model:
    title: "It was eight o'clock. The weather was nice. The shop was calm."
    gloss: "It was eight o'clock. The weather was nice. The shop was calm."
  fr.b2.unit04.lesson01.teach.grammar_arriere_plan:
    title: "The imparfait (était, faisait, y avait) describes the scene: the time, the weather, the mood. This is the background of a story."
    gloss: "The imparfait (était, faisait, y avait) describes the scene: the time, the weather, the mood. This is the background of a story."
    note: "English 'was' does not distinguish description from a completed event: 'she was surprised' can be *elle était surprise* (a state, imparfait) or *elle a été surprise* (a reaction at one moment, passé composé). The choice depends on function, not on the English verb form. Scene-setting time and weather (*il était huit heures*, *il faisait beau*) are description, so they take the imparfait."

  fr.b2.unit04.lesson02.teach.soudain:
    title: suddenly
    gloss: suddenly
    example_gloss: "Suddenly, the phone rang."
  fr.b2.unit04.lesson02.teach.un_client:
    title: "a customer"
    gloss: "a customer"
    example_gloss: "A customer arrived."
  fr.b2.unit04.lesson02.teach.entrer:
    title: "to enter"
    gloss: "to enter / to come in"
    note: "*Entrer* is one of a closed set of French verbs (mostly motion/change verbs) that take *être*, not *avoir*, in the passé composé: *il est entré*, not *il a entré*. The past participle also agrees with the subject: *elle est entrée*."
    example_gloss: "A customer came in."
  fr.b2.unit04.lesson02.teach.casser:
    title: "to break"
    gloss: "to break"
    note: "*Casser* is a regular *avoir*-verb: *il a cassé*, unlike *entrer* in the previous card."
    example_gloss: "He broke a glass."
  fr.b2.unit04.lesson02.teach.une_tasse:
    title: "a cup"
    gloss: "a cup"
    example_gloss: "The cup is broken."
  fr.b2.unit04.lesson02.teach.puis_ensuite:
    title: "then, next"
    gloss: "then / next"
  fr.b2.unit04.lesson02.teach.claim_model:
    title: "Suddenly, a customer came in. He broke a cup."
    gloss: "Suddenly, a customer came in. He broke a cup."
  fr.b2.unit04.lesson02.teach.grammar_evenement:
    title: "The passé composé (est entré, a cassé) marks the events that move the story forward, unlike the imparfait, which describes the setting."
    gloss: "The passé composé (est entré, a cassé) marks the events that move the story forward, unlike the imparfait, which describes the setting."
    note: "This is the core contrast of the unit: lesson01's imparfait paints the scene; this lesson's passé composé is what actually HAPPENS in it."

  fr.b2.unit04.lesson03.teach.pendant_que:
    title: "while"
    gloss: "while (simultaneous action)"
    note: "*Pendant que* introduces an action in progress at the same time as another one. In a past story it takes the imparfait, and a passé composé in the other clause marks the event that happened during it."
    example_gloss: "While I work, I listen to music."
  fr.b2.unit04.lesson03.teach.je_preparais:
    title: "I was preparing"
    gloss: "I was preparing (imparfait)"
    example_gloss: "I was preparing breakfast."
  fr.b2.unit04.lesson03.teach.les_croissants:
    title: "the croissants"
    gloss: "the croissants"
    example_gloss: "The croissants are warm."
  fr.b2.unit04.lesson03.teach.sonner:
    title: "to ring"
    gloss: "to ring"
    example_gloss: "The phone rang."
  fr.b2.unit04.lesson03.teach.quand:
    title: when
    gloss: "when (marks the interruption point)"
    example_gloss: "When he arrived, I was working."
  fr.b2.unit04.lesson03.teach.alors_que:
    title: "while / whereas"
    gloss: "while / whereas (can also mark contrast, not just simultaneity)"
  fr.b2.unit04.lesson03.teach.claim_model:
    title: "While I was preparing the croissants, the phone rang."
    gloss: "While I was preparing the croissants, the phone rang."
  fr.b2.unit04.lesson03.teach.grammar_interruption:
    title: "Pendant que + imparfait describes an ongoing action; the passé composé marks the event that interrupts it."
    gloss: "Pendant que + imparfait describes an ongoing action; the passé composé marks the event that interrupts it."

  fr.b2.unit04.lesson04.teach.avais:
    title: "I had"
    gloss: "I had (auxiliary, plus-que-parfait)"
    example_gloss: "I had finished."
  fr.b2.unit04.lesson04.teach.deja:
    title: already
    gloss: already
    example_gloss: "I have already finished."
  fr.b2.unit04.lesson04.teach.preparer:
    title: "to prepare"
    gloss: "to prepare"
    example_gloss: "I had prepared the coffee."
  fr.b2.unit04.lesson04.teach.la_pate:
    title: "the dough"
    gloss: "the dough"
    example_gloss: "The dough is ready."
  fr.b2.unit04.lesson04.teach.claim_model:
    title: "I had already prepared the dough when the customer arrived."
    gloss: "I had already prepared the dough when the customer arrived."
  fr.b2.unit04.lesson04.teach.grammar_plus_que_parfait:
    title: "The plus-que-parfait (avais + past participle) marks an event before another past event: I had already prepared the dough WHEN the customer arrived."
    gloss: "The plus-que-parfait (avais + past participle) marks an event before another past event: I had already prepared the dough WHEN the customer arrived."
    note: "The plus-que-parfait always needs a reference point in the past to be 'before' -- here, the customer's arrival (passé composé). It is not just 'far in the past', it is specifically 'earlier than another past event'. Verbs that take *être* in the passé composé (like *entrer*) also take it here: *il était entré* (he had come in), not *il avait entré*."

  fr.b2.unit04.lesson05.teach.texte:
    title: "Reading: a hectic morning"
    gloss: "It was eight o'clock and the weather was nice. I had already prepared the dough when, suddenly, a customer came in. While I was preparing the croissants, he broke a cup. Luckily, it wasn't serious."
    glosses:
      et: and
      heureusement: luckily
      "n'était": "was not (n'était pas = was not)"
      grave: serious

  fr.b2.unit04.lesson06.teach.alors_ce_matin:
    title: "So, how was this morning?"
    gloss: "So, how was this morning?"
    note: "*Alors, ce matin ?* invites someone to recount their morning -- a natural conversational opener reusing *ce matin* from Unit 2."
  fr.b2.unit04.lesson06.teach.et_apres:
    title: "And then?"
    gloss: "And then? / And after?"
  fr.b2.unit04.lesson06.teach.oh_non:
    title: "Oh no!"
    gloss: "Oh no!"
  fr.b2.unit04.lesson06.teach.dialogue_mathieu_ask:
    title: "Mathieu: So, how was this morning?"
    gloss: "Mathieu: So, how was this morning?"
  fr.b2.unit04.lesson06.teach.dialogue_ines_background:
    title: "Inès: It was eight o'clock, the weather was nice, the shop was calm."
    gloss: "Inès: It was eight o'clock, the weather was nice, the shop was calm."
  fr.b2.unit04.lesson06.teach.dialogue_mathieu_et_alors:
    title: "Mathieu: And so?"
    gloss: "Mathieu: And so?"
  fr.b2.unit04.lesson06.teach.dialogue_ines_prepast:
    title: "Inès: I had already prepared the dough when, suddenly, a customer came in."
    gloss: "Inès: I had already prepared the dough when, suddenly, a customer came in."
  fr.b2.unit04.lesson06.teach.dialogue_mathieu_et_apres:
    title: "Mathieu: And then?"
    gloss: "Mathieu: And then?"
  fr.b2.unit04.lesson06.teach.dialogue_ines_interruption:
    title: "Inès: While I was preparing the croissants, he broke a cup."
    gloss: "Inès: While I was preparing the croissants, he broke a cup."
  fr.b2.unit04.lesson06.teach.dialogue_mathieu_oh_non:
    title: "Mathieu: Oh no!"
    gloss: "Mathieu: Oh no!"
  fr.b2.unit04.lesson06.teach.dialogue_ines_resolution:
    title: "Inès: Luckily, it wasn't serious."
    gloss: "Inès: Luckily, it wasn't serious."
  fr.b2.unit04.lesson06.teach.grammar_recap:
    title: "Three time layers: the background (il était, il faisait -- imparfait), the event (est entré, a cassé -- passé composé), and the pre-past (j'avais déjà préparé -- plus-que-parfait)."
    gloss: "Three time layers: the background (il était, il faisait -- imparfait), the event (est entré, a cassé -- passé composé), and the pre-past (j'avais déjà préparé -- plus-que-parfait)."
    note: "This dialogue is the whole unit in miniature: Inès moves through all three layers in one natural recount, exactly what the speaking and writing tasks ask you to reproduce."

exercises:
  fr.b2.unit04.lesson01.exercise01.recognize_calme:
    instruction: "What does this word mean?"
    correct_option: calm
    distractors: [busy, sweet, serious]
    accepted_answers: [{value: calm, status: correct}]
    feedback: "Calme means calm."
  fr.b2.unit04.lesson01.exercise02.listen_claim:
    instruction: "Listen and select what you hear."
    correct_option: "It was eight o'clock. The weather was nice. The shop was calm."
    distractors: ["It was eight o'clock. The weather was bad. The shop was calm.", "It was nine o'clock. The weather was nice. The shop was calm.", "It was eight o'clock. The weather was nice. The shop was busy."]
    accepted_answers: [{value: "It was eight o'clock. The weather was nice. The shop was calm.", status: correct}]
    feedback: "Il était huit heures. Il faisait beau. La boutique était calme means it was eight o'clock. The weather was nice. The shop was calm."
  fr.b2.unit04.lesson01.exercise03.match_background_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"Il était huit heures.": "It was eight o'clock.", "Il faisait beau.": "The weather was nice.", "il y avait": "there was / there were", "la boutique": "the shop", calme: calm, occupé: busy}
        status: correct
    feedback: "These are this lesson's background-description words."
  fr.b2.unit04.lesson01.exercise04.order_boutique_calme:
    instruction: "Put the words in order: The shop was calm."
    accepted_answers:
      - {value: "La boutique était calme", status: correct}
    feedback: "La boutique était calme means the shop was calm."
