teaching:
  fr.a1.unit49.lesson01.teach.content_triste_en:
    title: Happy, sad, and angry
    gloss: happy, sad, angry
    note: Three basic feeling words used with *être* (to be); *content* has the feminine *contente*, while *triste* and *en colère* do not change.
    example_gloss:
    - I am happy.
    - I am sad.
    - I am angry.
  fr.a1.unit49.lesson01.teach.je_suis_content:
    title: Saying you're happy
    gloss: I am happy.
    note: '*Être* (to be) + feeling adjective is the basic pattern, like English ''I am ...''.'
  fr.a1.unit49.lesson01.teach.je_ne_suis:
    title: Contrasting feelings
    gloss: I am not angry, I am sad.
    note: '*Ne ... pas* wraps around the verb; the second clause then states the actual feeling.'
  fr.a1.unit49.lesson02.teach.pourquoi_es_tu:
    title: Asking why
    gloss: Why are you happy?
    note: '*Pourquoi* (why) is the standard question word for a reason.'
  fr.a1.unit49.lesson02.teach.je_suis_content:
    title: Giving a reason
    gloss: I am happy because I have a new apartment.
    note: '*Parce que* (because) introduces the reason clause; before *il* it shortens to *parce qu''*.'
  fr.a1.unit49.lesson02.teach.je_suis_triste:
    title: A negative reason
    gloss: I am sad because it is raining.
    note: Reuses *il pleut* (it rains) from the weather unit as the reason clause.
  fr.a1.unit49.lesson03.teach.nerveux:
    title: Nervous
    gloss: nervous
    note: The standard word for nervousness.
    example_gloss: I am nervous about my first shift.
  fr.a1.unit49.lesson03.teach.je_suis_nerveux:
    title: Stating what you're nervous about
    gloss: I am nervous about my first shift.
    note: '*Avant* (literally ''before'') introduces what the nervousness is about, where English says ''about''.'
  fr.a1.unit49.lesson03.teach.ne_t_inquiete:
    title: Reassuring someone
    gloss: Don't worry.
    note: '*Ne t''inquiète pas* (literally ''don''t worry yourself'') is the standard fixed reassurance phrase; *s''inquiéter* is reflexive.'
  fr.a1.unit49.lesson04.teach.comment_se_sent:
    title: Asking how someone feels
    gloss: How does Mathieu feel?
    note: '*Se sentir* (to feel, reflexive) is the standard way to ask about or describe an emotional state; it also appears in the health unit.'
  fr.a1.unit49.lesson04.teach.il_se_sent:
    title: Describing how someone feels
    gloss: He feels nervous.
    note: '*Se* (himself) is the third-person reflexive pronoun, paired with *sent*.'
  fr.a1.unit49.lesson04.teach.pourquoi_se_sent:
    title: Asking why someone feels a certain way
    gloss: Why does he feel nervous?
    note: Combines *pourquoi* with *se sentir* from *Il se sent nerveux*; *sent-il* is written with a hyphen.
  fr.a1.unit49.lesson05.teach.salut_camille_je:
    title: Read a message about feelings
    gloss: Hi Camille, I'm a little nervous about my first shift alone. But I'm also happy, because I have a new job and a new apartment. I think it'll be fine.
    note: Track what the writer is nervous about, what makes him happy, and his overall outlook.
    glosses:
      peu: a little
      nerveux: nervous
      premier: first
      service: shift
      seul: alone
      content: happy
      car: because
      nouveau: new
      travail: job
      nouvel: new
      appartement: apartment
      pense: think
      aller: 'turns out (here: will be fine)'
  fr.a1.unit49.lesson06.teach.camille_salut_mathieu:
    title: Camille asks how Mathieu feels
    gloss: 'Camille: Hi Mathieu, how are you feeling about your first shift?'
    note: '*Avant ton premier service* (before your first shift) reuses the *avant* + noun pattern from lesson 3.'
  fr.a1.unit49.lesson06.teach.mathieu_je_suis:
    title: Mathieu admits he's nervous
    gloss: 'Mathieu: I''m a bit nervous, honestly.'
    note: '*Honnêtement* (honestly) softens the admission.'
  fr.a1.unit49.lesson06.teach.camille_ne_t:
    title: Camille reassures him
    gloss: 'Camille: Don''t worry, you can do it well!'
    note: '*Tu vas y arriver* (literally ''you will get there'') is an encouraging fixed expression; *aller* + infinitive makes the near future.'
  fr.a1.unit49.lesson06.teach.mathieu_merci_ca:
    title: Mathieu thanks her
    gloss: 'Mathieu: Thanks, that really helps.'
    note: '*Aide* is the *il/elle* form of *aider* (to help); *m''* stands for *me*.'
  fr.a1.unit49.lesson06.teach.camille_et_apres:
    title: Camille predicts the outcome
    gloss: 'Camille: And afterward you''ll definitely be very happy and proud.'
    note: '*Sûrement* (surely) expresses a confident prediction; *fier* (proud) is a new, useful adjective.'
  fr.a1.unit49.lesson06.teach.mathieu_oui_je:
    title: Mathieu agrees
    gloss: 'Mathieu: Yes, I think so too.'
    note: '*Je pense aussi* is the natural way to agree with someone''s opinion.'
  fr.a1.unit49.lesson06.teach.il_remplace_mathieu:
    title: Summarizing with il, elle, and l'
    gloss: Mathieu is nervous about his first shift. Camille helps him.
    note: '*Il* replaces a man''s name (*il est nerveux*), *elle* replaces a woman''s name, and *l''* (*elle l''aide*) means ''him'': three small but essential words for talking about someone else.'
