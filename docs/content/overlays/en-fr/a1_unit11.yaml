answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A1
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation or liaison marks.

course:
  title: "French A1"
  description: >-
    Proposing, accepting, declining, and scheduling a simple plan,
    continuing Inès and Mathieu's cooking-workshop narrative as they
    arrange to shop for ingredients together before Saturday's session.
    English-specific guidance highlights that *se retrouver* (to meet up,
    reflexive/reciprocal) has no single-word English equivalent, and that
    *vers* + time expresses an approximate, not exact, meeting time.

units:
  fr.a1.unit11.plans:
    title: "When are we meeting?"

lessons:
  fr.a1.unit11.lesson01.vocabulaire_projets:
    title: "Proposing a time"
  fr.a1.unit11.lesson02.accepter_refuser:
    title: "Accepting or declining"
  fr.a1.unit11.lesson03.dialogue_projet_courses:
    title: "Planning the shopping trip"

teaching:
  fr.a1.unit11.lesson01.teach.libre:
    title: "Free / available"
    gloss: "free / available"
    note: "*Libre* describes a person's availability, not an object's price (that's *gratuit*)."
    example_gloss: "Are you free on Saturday?"
  fr.a1.unit11.lesson01.teach.occupe:
    title: "Busy"
    gloss: "busy"
    note: "The direct opposite of *libre*. Agrees in gender: *occupé* / *occupée*."
    example_gloss: "I'm busy Friday evening."
  fr.a1.unit11.lesson01.teach.se_retrouver:
    title: "To meet up"
    gloss: "to meet up"
    note: "*Se retrouver* is reciprocal -- it always implies two or more people meeting each other, unlike *trouver* (to find)."
    example_gloss: "Where are we meeting up this evening?"
  fr.a1.unit11.lesson01.teach.vers:
    title: "Around (a time)"
    gloss: "around / toward (a time)"
    note: "*Vers* + a time expresses an approximate time, softer than stating an exact hour."
    example_gloss: "I'll come by around seven o'clock."
  fr.a1.unit11.lesson01.teach.ca_te_dit_de:
    title: "How about... ?"
    gloss: "How about doing the shopping together?"
    note: "*Ça te dit de... ?* + infinitive is a common, casual way to propose an activity -- more relaxed than *Voulez-vous... ?*"
  fr.a1.unit11.lesson01.teach.venir_chercher:
    title: "Come pick (someone) up"
    gloss: "Are you coming to pick me up around six p.m.?"
    note: "*Venir chercher quelqu'un* means to come and get someone, not just \"to search.\""
  fr.a1.unit11.lesson01.teach.daccord_a_tout_a_lheure:
    title: "Agreed, see you soon"
    gloss: "OK, see you soon!"
    note: "*D'accord* (agreed/OK) confirms a plan; *à tout à l'heure* is used for seeing someone again later the same day."

  fr.a1.unit11.lesson02.teach.je_ne_peux_pas:
    title: "Decline a plan"
    gloss: "I can't, I'm busy."
    note: "*Je ne peux pas* (I can't) + a reason is a simple, polite way to decline."
  fr.a1.unit11.lesson02.teach.avec_plaisir:
    title: "Accept happily"
    gloss: "Gladly!"
    note: "*Avec plaisir* (literally \"with pleasure\") is a warm, enthusiastic way to accept an invitation."
  fr.a1.unit11.lesson02.teach.a_quelle_heure_on_se_voit:
    title: "Ask the time"
    gloss: "What time are we meeting?"
    note: "*On se voit* (informal \"we see each other\") is a common, casual alternative to *se retrouver* for arranging to meet."
  fr.a1.unit11.lesson02.teach.devant_le_marche:
    title: "Propose a place"
    gloss: "In front of the market, does that work for you?"
    note: "*Ça te va ?* (does that work for you?) checks whether a proposed detail is acceptable to the other person."
  fr.a1.unit11.lesson02.teach.parfait_alors:
    title: "Confirm the plan"
    gloss: "Perfect, see you Friday then!"
    note: "*Alors* here means \"then\" in the sense of confirming an outcome, closing the planning exchange."

  fr.a1.unit11.lesson03.teach.line01:
    title: "Propose shopping together"
    gloss: "Inès asks Mathieu if he'd like to do the shopping together before the workshop."
    note: "Reuses lesson01's *Ça te dit de... ?* to open the exchange."
  fr.a1.unit11.lesson03.teach.line02:
    title: "Accept and ask where"
    gloss: "Mathieu says gladly, and asks where they're meeting up."
    note: "Reuses lesson02's *Avec plaisir* and lesson01's *se retrouver* together."
  fr.a1.unit11.lesson03.teach.line03:
    title: "Propose a place and day"
    gloss: "Inès proposes in front of the market, Friday evening."
    note: "A short proposal combining place (*devant le marché*) and day (*vendredi soir*)."
  fr.a1.unit11.lesson03.teach.line04:
    title: "Accept and ask the time"
    gloss: "Mathieu agrees, and asks what time."
    note: "*D'accord* confirms the place/day; the follow-up question narrows down the exact time."
  fr.a1.unit11.lesson03.teach.line05:
    title: "Propose a specific time"
    gloss: "Inès asks if Mathieu will come pick her up around six p.m."
    note: "Reuses lesson01's *venir chercher* + *vers* pattern with a specific hour."
  fr.a1.unit11.lesson03.teach.line06:
    title: "Confirm everything"
    gloss: "Mathieu says perfect, see you Friday then, six p.m. in front of the market."
    note: "Restates all three plan details (day, time, place) together to close the exchange clearly."

exercises:
  fr.a1.unit11.lesson01.exercise01.select_libre:
    instruction: "Which word means \"free / available\"?"
    correct_option: "libre"
    distractors: ["occupé", "vers"]
    accepted_answers: ["libre"]

  fr.a1.unit11.lesson01.exercise02.listen_tu_es_libre:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Tu es libre samedi ?"
    distractors: ["Tu es occupé samedi ?", "On se retrouve où ?"]
    accepted_answers: ["Tu es libre samedi ?", "Tu es libre samedi"]

  fr.a1.unit11.lesson01.exercise03.match_plan_words:
    instruction: "Match each French word or phrase to its English meaning."
    correct_response:
      libre: "free / available"
      occupé: "busy"
      "se retrouver": "to meet up"
      vers: "around (a time)"
      "Ça te dit de... ?": "How about... ?"
      "D'accord": "OK / agreed"

  fr.a1.unit11.lesson01.exercise04.order_on_se_retrouve_ou:
    instruction: "Build the sentence: Where are we meeting up this evening?"
    correct_response: ["On", "se", "retrouve", "où", "ce", "soir"]

  fr.a1.unit11.lesson01.exercise05.fill_occupe:
    instruction: "Complete the sentence with the word for \"busy.\""
    accepted_answers: ["occupé"]

  fr.a1.unit11.lesson01.exercise06.speak_propose_plan:
    instruction: "Ask out loud whether your friend is free on Saturday."
    accepted_answers:
      - "Tu es libre samedi ?"
      - "Tu es libre samedi ?"

  fr.a1.unit11.lesson02.exercise01.select_avec_plaisir:
    instruction: "Which phrase means accepting an invitation happily?"
    correct_option: "Avec plaisir !"
    distractors: ["Je ne peux pas.", "Je suis occupé."]
    accepted_answers: ["Avec plaisir !", "Avec plaisir"]

  fr.a1.unit11.lesson02.exercise02.listen_on_se_retrouve_ou:
    instruction: "Listen and select the sentence you hear."
    correct_option: "On se retrouve où ?"
    distractors: ["Tu es libre samedi ?", "À quelle heure on se voit ?"]
    accepted_answers: ["On se retrouve où ?", "On se retrouve où"]

  fr.a1.unit11.lesson02.exercise03.match_accept_decline_phrases:
    instruction: "Match each French phrase to its English meaning."
    correct_response:
      "Je ne peux pas, je suis occupé.": "I can't, I'm busy."
      "Avec plaisir !": "Gladly!"
      "À quelle heure on se voit ?": "What time are we meeting?"
      "Devant le marché, ça te va ?": "In front of the market, does that work for you?"
      "Parfait, alors à vendredi !": "Perfect, see you Friday then!"

  fr.a1.unit11.lesson02.exercise04.order_devant_le_marche:
    instruction: "Build the sentence: In front of the market, does that work for you?"
    correct_response: ["Devant", "le", "marché", "ça", "te", "va"]

  fr.a1.unit11.lesson02.exercise05.fill_a_quelle_heure:
    instruction: "Complete the sentence with the word for \"time / hour.\""
    accepted_answers: ["heure"]

  fr.a1.unit11.lesson02.exercise06.reply_accept_plan:
    instruction: "Accept the plan and propose meeting in front of the market."
    accepted_answers:
      - "Avec plaisir ! On se retrouve devant le marché."
      - "Avec plaisir, on se retrouve devant le marché."

  fr.a1.unit11.lesson03.exercise01.comprehend_meeting_place:
    instruction: "Listen to the dialogue. Where do Inès and Mathieu agree to meet?"
    correct_option: "In front of the market"
    distractors: ["At the workshop", "In front of the pharmacy"]
    accepted_answers: ["In front of the market"]

  fr.a1.unit11.lesson03.exercise02.comprehend_meeting_time:
    instruction: "What time do they agree to meet?"
    correct_option: "Six p.m. (eighteen hundred hours)"
    distractors: ["Seven p.m.", "Nine a.m."]
    accepted_answers: ["Six p.m. (eighteen hundred hours)"]

  fr.a1.unit11.lesson03.exercise03.select_what_ines_proposes:
    instruction: "What does Inès propose doing together?"
    correct_option: "Shopping for ingredients"
    distractors: ["Cooking dinner", "Visiting the pharmacy"]
    accepted_answers: ["Shopping for ingredients"]

  fr.a1.unit11.lesson03.exercise04.order_tu_viens_me_chercher:
    instruction: "Build Inès's question about being picked up."
    correct_response: ["Tu", "viens", "me", "chercher", "vers", "dix-huit", "heures"]

  fr.a1.unit11.lesson03.exercise05.reply_confirm_meeting:
    instruction: "Take Mathieu's role. Confirm Friday, six p.m., in front of the market."
    accepted_answers:
      - "Parfait, à vendredi alors, dix-huit heures devant le marché !"
      - "Parfait, à vendredi alors, dix-huit heures devant le marché."

  fr.a1.unit11.lesson03.exercise06.speak_confirm_plan:
    instruction: "Say the day, time, and place of the meeting out loud."
    accepted_answers:
      - "Vendredi, dix-huit heures, devant le marché."
      - "Vendredi à dix-huit heures devant le marché."

  fr.a1.unit11.lesson01.exercise07.dictation_tu_es_libre:
    instruction: "Type what you hear."
    correct_option: "Tu es libre samedi"
    accepted_answers: [{value: "Tu es libre samedi", status: correct}]
    orthography_strict: true
