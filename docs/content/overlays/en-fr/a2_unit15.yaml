answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A2
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names and titles (M. Bernard).
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate formal
    register rather than written punctuation or liaison marks. A learner
    who addresses the mairie clerk with vous and conveys the right content
    should be judged correct even if phrasing differs slightly from the
    accepted answers.

course:
  title: "French A2"
  description: >-
    Handling a real administrative errand: registering a change of address
    at the mairie (town hall). Opens a new arc in Inès's storyline -- she's
    just moved to Lyon to start a pâtisserie apprenticeship and has to
    register her new address. First unit to require the formal *vous*
    register (a genuine new grammatical/social skill vs. A1's tu-with-peers
    content), plus the conditional (*j'aimerais*, *Pourriez-vous*, *il
    faudrait que*) and subjunctive (*il faut que*, *avant que*) that this
    formal register naturally uses.

units:
  fr.a2.unit15.demarches_administratives:
    title: "At the town hall"

lessons:
  fr.a2.unit15.lesson01.vocabulaire_mairie:
    title: "Town hall vocabulary"
  fr.a2.unit15.lesson02.registre_formel:
    title: "The formal register: vous, the conditional, the subjunctive"
  fr.a2.unit15.lesson03.dialogue_rendez_vous_mairie:
    title: "The appointment at the town hall"

teaching:
  fr.a2.unit15.lesson01.teach.la_mairie:
    title: "The town hall"
    gloss: "the town hall"
    note: "*La mairie* is the local town-hall office where a French citizen handles everyday administrative errands like this one -- not an immigration office."
    example_gloss: "I have to go to the town hall for my change of address."
  fr.a2.unit15.lesson01.teach.changement_d_adresse:
    title: "Change of address"
    gloss: "the change of address"
    note: "*Signaler un changement d'adresse* is the standard phrase for reporting that you've moved -- *signaler* here means \"to report/notify,\" not \"to signal\" in the English sense."
    example_gloss: "I've come to report a change of address."
  fr.a2.unit15.lesson01.teach.piece_d_identite:
    title: "An ID document"
    gloss: "an ID document"
    note: "*Pièce d'identité* is the general term covering any accepted photo ID (national ID card, passport) -- not one specific document."
    example_gloss: "You must present a valid ID document."
  fr.a2.unit15.lesson01.teach.justificatif_de_domicile:
    title: "A proof of address"
    gloss: "a proof of address"
    note: "A *justificatif de domicile* is typically a recent utility bill or rent receipt -- required alongside an ID for almost any French administrative registration."
    example_gloss: "A recent proof of address is required."
  fr.a2.unit15.lesson01.teach.prendre_rendez_vous:
    title: "To make an appointment"
    gloss: "to make an appointment"
    note: "*Prendre rendez-vous* is the standard phrase for booking any official appointment, in person or by phone."
    example_gloss: "I'd like to make an appointment for next week."
  fr.a2.unit15.lesson01.teach.remplir_un_formulaire:
    title: "To fill out a form"
    gloss: "to fill out a form"
    note: "*Remplir* (to fill/fill out) is the verb used for paperwork specifically -- a common false-friend trap is reaching for *complet* (full), which doesn't work as a verb here."
    example_gloss: "You have to fill out a form before you leave."
  fr.a2.unit15.lesson01.teach.l_agent_d_accueil:
    title: "The front-desk officer"
    gloss: "the front-desk officer"
    note: "*L'agent d'accueil* is the general, polite term for whoever staffs the reception desk at a government office -- not a job title you'd use to their face."
    example_gloss: "The front-desk officer explains the process to follow."
  fr.a2.unit15.lesson01.teach.le_delai:
    title: "The deadline / time frame"
    gloss: "the deadline / time frame"
    note: "*Délai* can mean either a hard deadline or a general time frame depending on context -- here it's the window you have to complete the registration."
    example_gloss: "The deadline for this process is thirty days."

  fr.a2.unit15.lesson02.teach.grammar_vous_formal:
    title: "The formal vous register"
    gloss: "vous: the formal register for official procedures"
    note: "Unlike unit01-14's *tu* with Mathieu and other peers, an official at the mairie is always addressed with *vous* -- this is the real, new social/grammatical shift this unit teaches, not just harder vocabulary."
  fr.a2.unit15.lesson02.teach.il_faudrait_que:
    title: "You would need to..."
    gloss: "you would need to... (+ subjunctive)"
    note: "*Il faudrait que* + subjunctive is a softer, more polite way to state a requirement than *il faut que* -- very natural in formal spoken French when an official is telling you what to bring."
    example_gloss: "You would need to bring your ID document."
  fr.a2.unit15.lesson02.teach.pourriez_vous:
    title: "Could you...?"
    gloss: "could you...? (conditional politeness)"
    note: "*Pourriez-vous* is the conditional of *pouvoir* used to soften a request into a polite question -- the standard way to ask someone something formally in French."
    example_gloss: "Could you confirm your new address?"
  fr.a2.unit15.lesson02.teach.j_aimerais:
    title: "I would like to..."
    gloss: "I would like to... (+ infinitive)"
    note: "*J'aimerais* (conditional of *aimer*) is softer and more formal than *je veux* (I want) -- the natural way to open a polite request."
    example_gloss: "I would like to make an appointment for Monday."
  fr.a2.unit15.lesson02.teach.il_faut_que:
    title: "You must..."
    gloss: "you must... (+ subjunctive)"
    note: "*Il faut que* + subjunctive states a firmer requirement than *il faudrait que* -- both use the subjunctive because French naturally treats an obligation as something not yet certain to happen."
    example_gloss: "You must bring a proof of address."
  fr.a2.unit15.lesson02.teach.avant_que:
    title: "Before..."
    gloss: "before... (+ subjunctive)"
    note: "*Avant que* triggers the subjunctive because what follows hasn't happened yet -- when the subject is the same on both sides of the sentence, French normally prefers *avant de* + infinitive instead, so *avant que* + subjunctive is most natural (as here) when the two clauses have different subjects."
    example_gloss: "Send the file before the deadline expires."
  fr.a2.unit15.lesson02.teach.est_ce_qu_il_y_a:
    title: "Is there...?"
    gloss: "is there...? (a clarifying question)"
    note: "*Est-ce qu'il y a... ?* is the standard way to ask \"is there...?\" -- a natural clarifying question to ask an official, e.g. about a deadline or a missing document."
    example_gloss: "Is there a deadline for this process?"
  fr.a2.unit15.lesson02.teach.avis_changement_adresse:
    title: "Official notice"
    gloss: >-
      NOTICE: For any change of address, come to the front desk with an ID
      document and a proof of address less than three months old.
      Deadline: thirty days after you move in.
    note: "A typical short official notice, the kind posted at a mairie or included in a welcome packet -- formal written register, no *vous*/*tu* choice needed since it addresses no one directly."

  fr.a2.unit15.lesson03.teach.line01:
    title: "The clerk greets Inès"
    gloss: "M. Bernard greets her formally and asks if she has an appointment."
    note: "*Madame*/*monsieur* as a direct address, with *vous*, is the standard formal greeting between a French official and a member of the public."
  fr.a2.unit15.lesson03.teach.line02:
    title: "Inès states her reason for coming"
    gloss: "Inès greets him back and says she'd like to report her change of address."
    note: "*J'aimerais* (rather than *je veux*) keeps her request polite and appropriately formal for this setting."
  fr.a2.unit15.lesson03.teach.line03:
    title: "The clerk lists what's needed"
    gloss: "M. Bernard says she would need to bring an ID document and a proof of address."
    note: "Combines lesson02's *il faudrait que* + subjunctive with lesson01's two key documents in one natural official request."
  fr.a2.unit15.lesson03.teach.line04:
    title: "Inès has both documents ready"
    gloss: "Inès says she has her ID card, and offers her electricity bill as proof."
    note: "A *facture d'électricité* (electricity bill) is one of the most common real-world forms of *justificatif de domicile*."
  fr.a2.unit15.lesson03.teach.line05:
    title: "The clerk asks her to confirm the address"
    gloss: "M. Bernard says perfect, and politely asks her to confirm her new address."
    note: "*Pourriez-vous... s'il vous plaît ?* stacks two politeness markers -- normal in this register, not redundant the way it might feel in English."
  fr.a2.unit15.lesson03.teach.line06:
    title: "Inès gives her new address"
    gloss: "Inès confirms: 12 rue des Fleurs, in the third arrondissement."
    note: "An *arrondissement* is a numbered city district -- French cities like Lyon and Paris are divided into them, and giving one is completely normal when stating a French address."
  fr.a2.unit15.lesson03.teach.line07:
    title: "The clerk explains the form and the deadline"
    gloss: "M. Bernard thanks her, says she must fill out this form before leaving, and that she has thirty days after moving in to complete the process."
    note: "Combines lesson02's *il faut que* + subjunctive with the *délai* (deadline) vocabulary from lesson01 -- ties the whole unit's vocabulary and grammar together in one closing line."

exercises:
  fr.a2.unit15.lesson01.exercise01.select_la_mairie:
    instruction: "Which word means \"the town hall\"?"
    correct_option: "la mairie"
    distractors: ["le formulaire", "le délai"]
    accepted_answers: ["la mairie"]

  fr.a2.unit15.lesson01.exercise02.listen_signaler_changement:
    instruction: "Listen and select the phrase you hear."
    correct_option: "changement d'adresse"
    distractors: ["justificatif de domicile", "pièce d'identité"]
    accepted_answers: ["changement d'adresse"]

  fr.a2.unit15.lesson01.exercise03.match_mairie_vocabulary:
    instruction: "Match each French word or phrase to its English meaning."
    correct_response:
      "la mairie": "the town hall"
      "le changement d'adresse": "the change of address"
      "une pièce d'identité": "an ID document"
      "un justificatif de domicile": "a proof of address"
      "prendre rendez-vous": "to make an appointment"
      "remplir un formulaire": "to fill out a form"
      "l'agent d'accueil": "the front-desk officer"
      "le délai": "the deadline / time frame"

  fr.a2.unit15.lesson01.exercise04.order_vous_devez_presenter:
    instruction: "Build the sentence: You must present a valid ID document."
    correct_response: ["Vous", "devez", "présenter", "une", "pièce", "d'identité", "valide"]

  fr.a2.unit15.lesson01.exercise05.fill_justificatif:
    instruction: "Complete the sentence with the word for \"proof.\""
    accepted_answers: ["justificatif"]

  fr.a2.unit15.lesson01.exercise06.translate_prendre_rendez_vous:
    instruction: "Translate into French."
    accepted_answers:
      - "J'aimerais prendre rendez-vous pour la semaine prochaine."
      - "J'aimerais prendre rendez-vous pour la semaine prochaine"

  fr.a2.unit15.lesson02.exercise01.select_pourriez_vous:
    instruction: "Which phrase politely asks someone to confirm something?"
    correct_option: "Pourriez-vous confirmer... ?"
    distractors: ["Il faut que...", "J'aimerais..."]
    accepted_answers: ["Pourriez-vous confirmer... ?"]

  fr.a2.unit15.lesson02.exercise02.listen_il_faudrait_que:
    instruction: "Listen and select the phrase you hear."
    correct_option: "il faudrait que vous ameniez"
    distractors: ["il faut que vous remplissiez", "pourriez-vous confirmer"]
    accepted_answers: ["il faudrait que vous ameniez"]

  fr.a2.unit15.lesson02.exercise03.read_avis_changement_adresse:
    instruction: "Read the notice. What must you bring, and what is the deadline?"
    correct_option: "An ID document and a proof of address, within 30 days of moving in"
    distractors: ["Only an ID document, no deadline", "A passport and a birth certificate, within 7 days"]
    accepted_answers: ["An ID document and a proof of address, within 30 days of moving in"]

  fr.a2.unit15.lesson02.exercise04.match_formal_phrases:
    instruction: "Match each formal French phrase to its English meaning."
    correct_response:
      "Il faudrait que vous ameniez...": "You would need to bring..."
      "Pourriez-vous confirmer... ?": "Could you confirm...?"
      "J'aimerais prendre rendez-vous.": "I would like to make an appointment."
      "Il faut que vous apportiez...": "You must bring..."
      "avant que le délai n'expire": "before the deadline expires"
      "vous (registre formel)": "formal \"you\" (register)"

  fr.a2.unit15.lesson02.exercise05.order_il_faut_que_apportiez:
    instruction: "Build the sentence: You must bring a proof of address."
    correct_response: ["Il", "faut", "que", "vous", "apportiez", "un", "justificatif", "de", "domicile"]

  fr.a2.unit15.lesson02.exercise06.write_confirm_appointment:
    instruction: "Write a short, formal message asking to confirm your appointment to register your change of address."
    accepted_answers:
      - status: correct
        text: "Bonjour, j'aimerais confirmer mon rendez-vous pour mon changement d'adresse."
      - status: correct
        text: "J'aimerais confirmer mon rendez-vous pour mon changement d'adresse."
      - status: correct
        text: "Bonjour, j'aimerais confirmer mon rendez-vous pour mon changement d'adresse, merci."

  fr.a2.unit15.lesson03.exercise01.comprehend_which_documents:
    instruction: "Listen to the dialogue. What two documents does M. Bernard ask Inès to bring?"
    correct_option: "An ID document and a proof of address"
    distractors: ["A passport and a birth certificate", "Only an ID document"]
    accepted_answers: ["An ID document and a proof of address"]

  fr.a2.unit15.lesson03.exercise02.comprehend_deadline:
    instruction: "What is the deadline Inès has to complete this process?"
    correct_option: "Thirty days after moving in"
    distractors: ["Seven days after moving in", "There is no deadline"]
    accepted_answers: ["Thirty days after moving in"]

  fr.a2.unit15.lesson03.exercise03.select_why_ines_is_there:
    instruction: "Why has Inès come to the mairie?"
    correct_option: "To register her change of address"
    distractors: ["To renew her passport", "To register to vote"]
    accepted_answers: ["To register her change of address"]

  fr.a2.unit15.lesson03.exercise04.order_pourriez_vous_confirmer:
    instruction: "Build M. Bernard's polite request."
    correct_response: ["Pourriez-vous", "confirmer", "votre", "nouvelle", "adresse", "s'il", "vous", "plaît"]

  fr.a2.unit15.lesson03.exercise05.reply_state_your_reason:
    instruction: "Take Inès's role. Say yes, you'd like to report your change of address."
    accepted_answers:
      - "Oui, j'aimerais signaler mon changement d'adresse."
      - "Oui, j'aimerais signaler mon changement d'adresse"
      - "J'aimerais signaler mon changement d'adresse."

  fr.a2.unit15.lesson03.exercise06.speak_confirm_and_ask_deadline:
    instruction: "Say out loud that you'd like to confirm your new address, and ask if there's a deadline for this process."
    accepted_answers:
      - "J'aimerais confirmer ma nouvelle adresse. Est-ce qu'il y a un délai pour cette démarche ?"
      - "J'aimerais confirmer ma nouvelle adresse, et est-ce qu'il y a un délai pour cette démarche ?"
      - "J'aimerais confirmer ma nouvelle adresse, est-ce qu'il y a un délai pour cette démarche ?"
