answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A1
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation or liaison marks.

course:
  title: "French A1"
  description: >-
    Parts of the day and telling clock time (heure(s), et quart, et demie,
    moins le quart), continuing Inès and Mathieu's cooking-workshop
    narrative into scheduling their next session. English-specific guidance
    highlights that French uses a 24-hour convention in formal/scheduling
    contexts (dix-huit heures trente) alongside the informal 12-hour forms
    taught earlier in the unit.

units:
  fr.a1.unit06.time:
    title: "What time is it?"

lessons:
  fr.a1.unit06.lesson01.moments_de_la_journee:
    title: "Parts of the day"
  fr.a1.unit06.lesson02.dire_lheure:
    title: "Telling the time"
  fr.a1.unit06.lesson03.dialogue_prochain_atelier:
    title: "The next workshop"

teaching:
  fr.a1.unit06.lesson01.teach.heure:
    title: "The hour; the time"
    gloss: "the hour; the time"
    note: "*Heure* is feminine; also the unit used for telling clock time (*dix heures* = ten o'clock)."
    example_gloss: "What time is it?"
  fr.a1.unit06.lesson01.teach.matin:
    title: "The morning"
    gloss: "the morning"
    note: "*Matin* is masculine."
    example_gloss: "The workshop starts in the morning."
  fr.a1.unit06.lesson01.teach.apres_midi:
    title: "The afternoon"
    gloss: "the afternoon"
    note: "*Après-midi* is invariant in gender usage (commonly treated as masculine, though feminine use also occurs); *l'* elides before its vowel sound."
    example_gloss: "I work in the afternoon."
  fr.a1.unit06.lesson01.teach.soir:
    title: "The evening"
    gloss: "the evening"
    note: "*Soir* is masculine."
    example_gloss: "The cooking workshop is in the evening."
  fr.a1.unit06.lesson01.teach.midi:
    title: "Noon"
    gloss: "noon"
    note: "*Midi* takes no article when used as a time reference (*à midi*, not *au midi*)."
    example_gloss: "We eat at noon."
  fr.a1.unit06.lesson01.teach.minuit:
    title: "Midnight"
    gloss: "midnight"
    note: "*Minuit* follows the same no-article pattern as *midi*."
    example_gloss: "The workshop never runs past midnight."
  fr.a1.unit06.lesson01.teach.latelier_commence_le_soir:
    title: "State when the workshop is"
    gloss: "The workshop starts in the evening, not the morning."
    note: "Contrasts *le soir* and *le matin* directly, reusing both nouns from this lesson's vocabulary."

  fr.a1.unit06.lesson02.teach.quelle_heure_est_il:
    title: "Ask the time"
    gloss: "What time is it?"
    note: "*Quelle heure est-il ?* is the standard, all-purpose way to ask the time; *-il* inverts with the verb as a question marker."
  fr.a1.unit06.lesson02.teach.il_est_dix_heures:
    title: "State the hour"
    gloss: "It's ten o'clock."
    note: "*Il est* + number + *heures* is the base pattern for stating any hour; *heures* stays plural except for *une heure* (one o'clock)."
  fr.a1.unit06.lesson02.teach.et_quart:
    title: "State a quarter past"
    gloss: "It's a quarter past ten."
    note: "*Et quart* (and a quarter) adds fifteen minutes to the stated hour."
  fr.a1.unit06.lesson02.teach.et_demie:
    title: "State the half hour"
    gloss: "It's half past ten."
    note: "*Et demie* (and a half) adds thirty minutes; *demie* takes the feminine -e agreeing with *heure*."
  fr.a1.unit06.lesson02.teach.moins_le_quart:
    title: "State a quarter to"
    gloss: "It's a quarter to eleven."
    note: "*Moins le quart* (minus the quarter) counts back from the NEXT hour, not the current one -- a common English-speaker mix-up to watch for."
  fr.a1.unit06.lesson02.teach.a_quelle_heure:
    title: "Ask what time something starts"
    gloss: "What time does the workshop start?"
    note: "*À quelle heure ?* (at what time) is used when asking about a scheduled event, distinct from the general *Quelle heure est-il ?*."

  fr.a1.unit06.lesson03.teach.line01:
    title: "Ask about next week's start time"
    gloss: "Inès asks what time next week's workshop is."
    note: "*La semaine prochaine* (next week) combines with this lesson's *à quelle heure* question pattern."
  fr.a1.unit06.lesson03.teach.line02:
    title: "State the start time"
    gloss: "Mathieu says it starts at eighteen thirty (6:30pm), he thinks."
    note: "*Dix-huit heures trente* uses the 24-hour convention common in French scheduling contexts, distinct from lesson02's informal *et demie* forms."
  fr.a1.unit06.lesson03.teach.line03:
    title: "Confirm it's the evening"
    gloss: "Inès checks: the evening, not the morning?"
    note: "A short confirming question reusing *le soir*/*le matin* from lesson01."
  fr.a1.unit06.lesson03.teach.line04:
    title: "Confirm and explain why"
    gloss: "Mathieu confirms it's the evening, more convenient after work."
    note: "*Après le travail* (after work) gives a simple, practical reason."
  fr.a1.unit06.lesson03.teach.line05:
    title: "Ask about the end time"
    gloss: "Inès asks what time it ends."
    note: "*Finit* (ends) contrasts directly with line02's *commence* (starts)."
  fr.a1.unit06.lesson03.teach.line06:
    title: "State the end time"
    gloss: "Mathieu says around twenty fifteen (8:15pm), as usual."
    note: "*Vers* (around/about) signals an approximate time, softer than a precise *à*."
  fr.a1.unit06.lesson03.teach.line07:
    title: "Confirm the plan"
    gloss: "Inès confirms, see you next week at eighteen thirty!"
    note: "Closes the exchange by repeating the confirmed time back, a natural way to confirm a plan in French."

exercises:
  fr.a1.unit06.lesson01.exercise01.select_soir:
    instruction: "Which word means the evening?"
    correct_option: "le soir"
    distractors: ["le matin", "midi"]
    accepted_answers: ["le soir"]

  fr.a1.unit06.lesson01.exercise02.listen_matin:
    instruction: "Listen and select the word you hear."
    correct_option: "le matin"
    distractors: ["le soir", "minuit"]
    accepted_answers: ["le matin"]

  fr.a1.unit06.lesson01.exercise03.match_day_parts:
    instruction: "Match each French word to its English meaning."
    correct_response:
      "l'heure": "the hour; the time"
      "le matin": "the morning"
      "l'après-midi": "the afternoon"
      "le soir": "the evening"
      midi: "noon"
      minuit: "midnight"

  fr.a1.unit06.lesson01.exercise04.order_atelier_soir:
    instruction: "Build the sentence: The workshop starts in the evening, not the morning."
    correct_response: ["L'atelier", "commence", "le", "soir", "pas", "le", "matin"]

  fr.a1.unit06.lesson01.exercise05.fill_midi:
    instruction: "Complete the sentence with the word for noon."
    accepted_answers: ["midi"]

  fr.a1.unit06.lesson01.exercise06.speak_own_schedule:
    instruction: "Say when you prefer to work: morning, afternoon, or evening."
    accepted_answers:
      - "Je préfère travailler le matin."
      - "Je préfère travailler l'après-midi."
      - "Je préfère travailler le soir."

  fr.a1.unit06.lesson02.exercise01.select_quelle_heure:
    instruction: "Which question asks what time it is?"
    correct_option: "Quelle heure est-il ?"
    distractors: ["L'atelier commence à quelle heure ?", "C'est combien ?"]
    accepted_answers: ["Quelle heure est-il ?", "Quelle heure est-il"]

  fr.a1.unit06.lesson02.exercise02.listen_dix_heures:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Il est dix heures."
    distractors: ["Il est dix heures et quart.", "Il est onze heures."]
    accepted_answers: ["Il est dix heures.", "Il est dix heures"]

  fr.a1.unit06.lesson02.exercise03.match_clock_phrases:
    instruction: "Match each French time expression to its English meaning."
    correct_response:
      "Il est dix heures.": "It's ten o'clock."
      "Il est dix heures et quart.": "It's a quarter past ten."
      "Il est dix heures et demie.": "It's half past ten."
      "Il est onze heures moins le quart.": "It's a quarter to eleven."
      "Quelle heure est-il ?": "What time is it?"
      "L'atelier commence à quelle heure ?": "What time does the workshop start?"

  fr.a1.unit06.lesson02.exercise04.order_dix_heures_et_quart:
    instruction: "Build the sentence: It's a quarter past ten."
    correct_response: ["Il", "est", "dix", "heures", "et", "quart"]

  fr.a1.unit06.lesson02.exercise05.fill_moins_le_quart:
    instruction: "Complete the sentence to say a quarter to eleven."
    accepted_answers: ["moins"]

  fr.a1.unit06.lesson02.exercise06.reply_atelier_heure:
    instruction: "Answer that the workshop starts at half past ten."
    accepted_answers:
      - "L'atelier commence à dix heures et demie."
      - "L'atelier commence à dix heures et demie"

  fr.a1.unit06.lesson03.exercise01.comprehend_start_time:
    instruction: "Listen to the dialogue. What time does the workshop start?"
    correct_option: "Eighteen thirty (6:30pm)"
    distractors: ["Eight thirty (8:30am)", "Twenty thirty (8:30pm)"]
    accepted_answers: ["Eighteen thirty (6:30pm)", "18:30", "Eighteen thirty"]

  fr.a1.unit06.lesson03.exercise02.comprehend_evening_not_morning:
    instruction: "Is the workshop in the morning or the evening?"
    correct_option: "The evening"
    distractors: ["The morning", "The afternoon"]
    accepted_answers: ["The evening"]

  fr.a1.unit06.lesson03.exercise03.select_end_time:
    instruction: "What time does the workshop usually end?"
    correct_option: "Around twenty fifteen (8:15pm)"
    distractors: ["Around eighteen thirty (6:30pm)", "Around twenty-two hours (10pm)"]
    accepted_answers: ["Around twenty fifteen (8:15pm)", "20:15", "Twenty fifteen"]

  fr.a1.unit06.lesson03.exercise04.order_il_commence_dix_huit:
    instruction: "Build Mathieu's sentence about the start time."
    correct_response: ["Il", "commence", "à", "dix-huit", "heures", "trente"]

  fr.a1.unit06.lesson03.exercise05.reply_pourquoi_soir:
    instruction: "Explain why the evening is more convenient."
    accepted_answers:
      - "C'est plus pratique après le travail."
      - "C'est plus pratique après le travail"

  fr.a1.unit06.lesson03.exercise06.speak_confirm_time:
    instruction: "Confirm the next workshop's time out loud."
    accepted_answers:
      - "À la semaine prochaine, à dix-huit heures trente !"
      - "À la semaine prochaine, à dix-huit heures trente."
