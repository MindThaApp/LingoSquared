units:
  fr.b1.unit33.discours_indirect:
    title: "Reported speech"

lessons:
  fr.b1.unit33.lesson01.discours_present:
    title: "The chef says that..."
  fr.b1.unit33.lesson02.discours_passe_concordance:
    title: "He said that it was necessary..."

teaching:
  fr.b1.unit33.lesson01.teach.dire_que:
    title: "Says that"
    gloss: "says that"
    note: "*Dire que* introduces a reported statement. Since the reporting verb is present, the reported verb keeps its original tense (here, the present)."
    example_gloss: "The chef says that the delivery arrives at noon."
  fr.b1.unit33.lesson01.teach.demander_si:
    title: "Asks whether"
    gloss: "asks whether"
    note: "*Demander si* introduces a reported yes/no question."
    example_gloss: "The chef asks whether the room is ready."
  fr.b1.unit33.lesson01.teach.livraison:
    title: "The delivery"
    gloss: "the delivery"
    example_gloss: "The delivery arrives at noon."
  fr.b1.unit33.lesson01.teach.salle:
    title: "The room"
    gloss: "the room"
    example_gloss: "The room is ready."
  fr.b1.unit33.lesson01.teach.pattern:
    title: "Dire que plus present indicative"
    gloss: "say that plus present indicative"
    note: "With a present reporting verb, the reported clause keeps its own tense: no backshift is needed."

  fr.b1.unit33.lesson02.teach.a_dit_que:
    title: "Said that"
    gloss: "said that"
    note: "*A dit que* is a past reporting verb, so the reported present verb backshifts to imparfait."
    example_gloss: "The chef said that the orders had to be finished before noon."
  fr.b1.unit33.lesson02.teach.il_fallait:
    title: "It was necessary to"
    gloss: "it was necessary to"
    note: "*Il fallait* is the imparfait backshift of *il faut* under a past reporting verb."
    example_gloss: "It was necessary to finish before noon."
  fr.b1.unit33.lesson02.teach.a_demande_si:
    title: "Asked whether"
    gloss: "asked whether"
    note: "*A demandé si* is the past form of the reported question, also triggering backshift."
    example_gloss: "The chef asked whether the room was ready."
  fr.b1.unit33.lesson02.teach.etait_prete:
    title: "Was ready"
    gloss: "was ready"
    note: "*Était prête* is the imparfait backshift of *est prête* under a past reporting verb."
    example_gloss: "The room was ready."
  fr.b1.unit33.lesson02.teach.concordance:
    title: "Concordance des temps: present becomes imparfait"
    gloss: "sequence of tenses: present becomes imparfait"
    note: "When the reporting verb is in the past (*a dit*, *a demandé*), a reported present-tense verb backshifts to imparfait. When the reporting verb is present (*dit*, *demande*), no backshift happens."
  fr.b1.unit33.lesson02.teach.dialogue_line01:
    title: "Mathieu asks what the chef said"
    gloss: "Mathieu asks what the chef said this morning."
  fr.b1.unit33.lesson02.teach.dialogue_line02:
    title: "Inès reports the past instruction"
    gloss: "Inès says the chef said the orders had to be finished before noon."
  fr.b1.unit33.lesson02.teach.dialogue_line03:
    title: "Mathieu asks if there was more"
    gloss: "Mathieu asks whether the chef asked anything else."
  fr.b1.unit33.lesson02.teach.dialogue_line04:
    title: "Inès reports the past question"
    gloss: "Inès says the chef asked whether the room was ready."
  fr.b1.unit33.lesson02.teach.dialogue_line05:
    title: "Mathieu asks about now"
    gloss: "Mathieu asks what the chef is saying now."
  fr.b1.unit33.lesson02.teach.dialogue_line06:
    title: "Inès reports the present statement"
    gloss: "Inès says the chef now says the delivery arrives at noon."

exercises:
  fr.b1.unit33.lesson01.exercise01.select_reported_content:
    instruction: "What does the chef say?"
    correct_option: "The delivery arrives at noon"
    distractors: ["The room is ready", "The orders are late"]
    accepted_answers: ["The delivery arrives at noon"]
  fr.b1.unit33.lesson01.exercise02.listen_report_present:
    instruction: "Listen and select the exact sentence you hear."
    correct_option: "Le chef dit que la livraison arrive à midi."
    distractors: ["Le chef demande si la salle est prête.", "Mathieu pense que la commande est en retard."]
    accepted_answers: ["Le chef dit que la livraison arrive à midi."]
  fr.b1.unit33.lesson01.exercise03.match_report_present:
    instruction: "Match each French reported-speech phrase to English."
    correct_response:
      "dit que": "says that"
      "la livraison": "the delivery"
      "arrive à midi": "arrives at noon"
      "demande si": "asks whether"
      "la salle": "the room"
      "est prête": "is ready"
  fr.b1.unit33.lesson01.exercise04.order_report_present:
    instruction: "Build the present-tense reported statement: The chef says that the delivery arrives at noon."
    correct_response: ["Le", "chef", "dit", "que", "la", "livraison", "arrive", "à", "midi"]
  fr.b1.unit33.lesson01.exercise05.write_report_present:
    instruction: "Write this reported statement in French with dire que + present (no tense change): The chef says that the delivery arrives at noon."
    accepted_answers:
      - status: correct
        value: "Le chef dit que la livraison arrive à midi."
      - status: correct
        value: "Le chef dit que la livraison arrive à midi"
  fr.b1.unit33.lesson02.exercise01.select_reported_past:
    instruction: "What did the chef say this morning?"
    correct_option: "The orders had to be finished before noon"
    distractors: ["The room needed cleaning", "The delivery was cancelled"]
    accepted_answers: ["The orders had to be finished before noon"]
  fr.b1.unit33.lesson02.exercise02.comprehend_dialogue:
    instruction: "Listen to the dialogue. What did the chef ask about this morning?"
    correct_option: "Whether the room was ready"
    distractors: ["Whether the delivery had arrived", "Whether Mathieu had finished"]
    accepted_answers: ["Whether the room was ready"]
  fr.b1.unit33.lesson02.exercise03.match_report_past:
    instruction: "Match each French past-reported-speech phrase to English."
    correct_response:
      "a dit que": "said that"
      "il fallait": "it was necessary to"
      "a demandé si": "asked whether"
      "la salle était prête": "the room was ready"
      "maintenant": "now"
      "ce matin": "this morning"
  fr.b1.unit33.lesson02.exercise04.order_report_past:
    instruction: "Build the past-tense reported statement: The chef said that the orders had to be finished before noon."
    correct_response: ["Le", "chef", "a", "dit", "qu'il", "fallait", "finir", "les", "commandes", "avant", "midi"]
  fr.b1.unit33.lesson02.exercise05.speak_report_past:
    instruction: "Take Inès's role. Answer with past reported speech and concordance des temps (*il faut* becomes *il fallait*): say that he said the orders had to be finished before noon."
    accepted_answers:
      - "Il a dit qu'il fallait finir les commandes avant midi."
      - "Il a dit qu'il fallait finir les commandes avant midi"
      - "Le chef a dit qu'il fallait finir les commandes avant midi."
  fr.b1.unit33.lesson02.exercise06.write_culminating:
    instruction: "Write two French sentences: a present reported statement (The chef says that the delivery arrives at noon) and a past reported question with demander si, backshifting the tense (The chef asked whether the room was ready)."
    accepted_answers:
      - status: correct
        value: "Le chef dit que la livraison arrive à midi. Le chef a demandé si la salle était prête."
      - status: correct
        value: "Le chef dit que la livraison arrive à midi. Le chef a demandé si la salle était prête"
  fr.b1.unit33.lesson01.exercise06.dictation_report_present:
