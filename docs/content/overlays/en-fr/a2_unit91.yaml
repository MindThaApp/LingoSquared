answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A2 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or liaison marks.
course:
  title: French A2
  description: Intermediate French continuing the Camille and Mathieu storyline, now with a grammar-led block on everyday functions.
  learning_goal: Talk about starting, stopping, trying and forgetting with commencer à, arrêter de, essayer de and oublier de.
units:
  fr.a2.unit91.je_commence_a_courir:
    title: I started running
    description: Say what you started, stopped, tried or forgot to do, for example a sport or a habit.
lessons:
  fr.a2.unit91.lesson01.commencer_a:
    title: I am starting to run
  fr.a2.unit91.lesson02.arreter_de:
    title: I stopped eating sugar
  fr.a2.unit91.lesson03.essayer_de:
    title: I try to run
  fr.a2.unit91.lesson04.oublier_de:
    title: I forgot to close the door
  fr.a2.unit91.lesson05.message_de_mathieu:
    title: Mathieu's message
  fr.a2.unit91.lesson06.camille_et_mathieu:
    title: Camille and Mathieu talk about sport
teaching:
  fr.a2.unit91.lesson01.teach.mots:
    title: Sport words
    gloss: to start / to run / to swim / to continue / the morning / last month
    example_gloss:
    - I am starting to run.
    - He keeps swimming.
    - I started running last month.
    - We run in the morning.
  fr.a2.unit91.lesson01.teach.gn_courir:
    title: Courir in the present
    gloss: I run, you run, he runs, we run, you run, they run
    note: '*Courir* is irregular. *Je cours* and *tu cours* are the same; *il court*; *nous courons*; *vous courez*; *ils courent*.'
  fr.a2.unit91.lesson01.teach.gn_commencer:
    title: Commencer à
    gloss: I am starting to run. I started to swim. We are starting to run. We started to swim.
    note: '*Commencer à* plus an infinitive says what you start doing. The preposition *à* is required. In *nous commençons* the *c* takes a cedilla.'
  fr.a2.unit91.lesson01.teach.gn_continuer:
    title: Continuer à
    gloss: I keep running. We keep swimming. He kept swimming.
    note: '*Continuer à* plus an infinitive says you do not stop. It uses the same preposition as *commencer*.'
  fr.a2.unit91.lesson01.teach.phrase:
    title: Starting
    gloss: I started running.
  fr.a2.unit91.lesson02.teach.mots:
    title: Words for stopping
    gloss: to stop / sugar / TV / to watch / to eat
    example_gloss:
    - I stopped eating sugar.
    - He is stopping watching TV.
    - I no longer eat sugar.
  fr.a2.unit91.lesson02.teach.gn_arreter:
    title: Arrêter de
    gloss: I am stopping eating sugar. He stopped watching TV.
    note: '*Arrêter de* plus an infinitive says what you stop doing. Here the preposition is *de*, not *à*.'
  fr.a2.unit91.lesson02.teach.gn_plus:
    title: Ne ... plus
    gloss: I no longer eat sugar. He no longer watches TV.
    note: '*Ne ... plus* means ''no longer'' and wraps around the verb. After it, *du sucre* becomes *de sucre*.'
  fr.a2.unit91.lesson02.teach.gn_contraste:
    title: À or de?
    gloss: I am starting to run. I am stopping eating sugar.
    note: 'Learn the pair: *commencer à* and *continuer à*, but *arrêter de*.'
  fr.a2.unit91.lesson02.teach.phrase:
    title: Stopping
    gloss: I stopped eating sugar.
  fr.a2.unit91.lesson03.teach.mots:
    title: Words for trying
    gloss: to try / every morning / three times a week / early
    example_gloss:
    - I try to run every morning.
    - We try to run three times a week.
    - I try to sleep early.
  fr.a2.unit91.lesson03.teach.gn_essayer:
    title: Essayer de
    gloss: I try to run. She tried to sleep.
    note: '*Essayer de* plus an infinitive says you make an effort to do something. The preposition is *de*.'
  fr.a2.unit91.lesson03.teach.gn_forme:
    title: Essayer in the present
    gloss: I try, you try, he tries, we try, you try, they try
    note: 'In *je, tu, il* and *ils* the *y* of *essayer* becomes *i*: *j''essaie*. The *y* stays in *nous essayons* and *vous essayez*.'
  fr.a2.unit91.lesson03.teach.gn_frequence:
    title: How often
    gloss: Every morning. Three times a week.
    note: Time expressions like *tous les matins* and *trois fois par semaine* show how often you try.
  fr.a2.unit91.lesson03.teach.phrase:
    title: Trying
    gloss: I try to run every morning.
  fr.a2.unit91.lesson04.teach.mots:
    title: Words for forgetting
    gloss: to forget / to close / the door / the shoes / to bring
    example_gloss:
    - I forgot to close the door.
    - I did not forget to bring my shoes.
    - Don't forget to bring your shoes!
  fr.a2.unit91.lesson04.teach.gn_oublier:
    title: Oublier de
    gloss: I forgot to close the door. He forgets to bring his shoes.
    note: '*Oublier de* plus an infinitive says you forgot to do something. The preposition is *de*; before a vowel it becomes *d''*.'
  fr.a2.unit91.lesson04.teach.gn_neg:
    title: Not forgetting
    gloss: I did not forget to bring my shoes.
    note: In the passé composé, *ne ... pas* wraps around *ai*, and *de* comes after the participle.
  fr.a2.unit91.lesson04.teach.gn_imperatif:
    title: A reminder
    gloss: Don't forget to close the door! Don't forget to bring your shoes!
    note: '*N''oublie pas de* is a friendly reminder to a friend; *n''oubliez pas de* is the vous version.'
  fr.a2.unit91.lesson04.teach.phrase:
    title: Forgetting
    gloss: I forgot to close the door.
  fr.a2.unit91.lesson05.teach.mots:
    title: Words for the message
    gloss: yesterday / also / my (plural) / but / so
    example_gloss:
    - Yesterday I forgot my shoes.
    - I also stopped coffee.
    - But I keep trying!
  fr.a2.unit91.lesson05.teach.gn_bilan:
    title: A report of changes
    gloss: I started running. I stopped drinking coffee. I try to run three times a week.
    note: A short report of changes mixes the passé composé (what you started or stopped) with the present (what you try now).
  fr.a2.unit91.lesson05.teach.gn_mais:
    title: Setbacks
    gloss: I forgot my shoes, so I stayed at home. But I keep trying!
    note: '*Alors* gives the result of a setback and *mais* shows you keep going.'
  fr.a2.unit91.lesson05.teach.reading:
    title: Mathieu writes to Camille
    gloss: Hi Camille! Last month I started running in the morning. I also stopped drinking coffee in the evening. I try to run three times a week. Yesterday I forgot to bring my shoes, so I stayed at home. But I keep trying! Mathieu
    note: The message uses all four verbs of the unit.
    glosses:
      chaussures: shoes
      hier: yesterday
  fr.a2.unit91.lesson06.teach.q1:
    title: Camille asks
    gloss: 'Camille: Mathieu, do you run now?'
  fr.a2.unit91.lesson06.teach.a1:
    title: Mathieu answers
    gloss: 'Mathieu: Yes, I started running last month.'
  fr.a2.unit91.lesson06.teach.q2:
    title: Camille asks about coffee
    gloss: 'Camille: And coffee? Did you stop?'
  fr.a2.unit91.lesson06.teach.a2:
    title: Mathieu confirms
    gloss: 'Mathieu: Yes, I stopped drinking coffee in the evening.'
  fr.a2.unit91.lesson06.teach.q3:
    title: Camille asks how often
    gloss: 'Camille: Well done! Do you try to run every day?'
  fr.a2.unit91.lesson06.teach.a3:
    title: Mathieu explains
    gloss: 'Mathieu: Three times a week. Yesterday I forgot my shoes.'
