teaching:
  fr.b1.unit34.lesson01.teach.pour_infinitif:
    title: "In order to buy"
    gloss: "in order to buy"
    note: "*Pour + infinitif* states the purpose when the subject is the same in both clauses."
    example_gloss: "I am saving money in order to buy a professional oven."
  fr.b1.unit34.lesson01.teach.economies:
    title: "Savings"
    gloss: "savings"
    example_gloss: "I save money every month."
  fr.b1.unit34.lesson01.teach.four:
    title: "A professional oven"
    gloss: "a professional oven"
    example_gloss: "The professional oven is expensive."
  fr.b1.unit34.lesson01.teach.pattern:
    title: "Pour plus infinitif, same subject"
    gloss: "in order to, same subject"
    note: "Use *pour + infinitive* only when the person doing the action and the person with the goal are the same."
  fr.b1.unit34.lesson01.teach.etudier:
    title: "In order to study"
    gloss: "in order to study"
    example_gloss: "She works evenings in order to study pastry."

  fr.b1.unit34.lesson02.teach.pour_que:
    title: "So that"
    gloss: "so that"
    note: "*Pour que* introduces a purpose clause when the subject changes, and is followed by the subjunctive."
    example_gloss: "I am training you so that you can prepare the orders alone."
  fr.b1.unit34.lesson02.teach.puisses:
    title: "You can"
    gloss: "you can"
    note: "*Puisses* is the subjunctive of *pouvoir*, required after *pour que*."
    example_gloss: "You need to be able to prepare the orders alone."
  fr.b1.unit34.lesson02.teach.sois_independant:
    title: "You are more independent"
    gloss: "you are more independent"
    note: "*Sois* is the subjunctive of *être*."
    example_gloss: "I am training you so that you are more independent."
  fr.b1.unit34.lesson02.teach.pattern:
    title: "Pour que plus subjunctive, different subject"
    gloss: "so that, different subject"
    note: "Use *pour que + subjunctive* when the person acting and the person with the goal are different."
  fr.b1.unit34.lesson02.teach.dialogue_line01:
    title: "Mathieu asks why Inès is saving"
    gloss: "Mathieu asks why Inès is saving money."
  fr.b1.unit34.lesson02.teach.dialogue_line02:
    title: "Inès states her purpose"
    gloss: "Inès says she is saving money in order to buy a professional oven."
  fr.b1.unit34.lesson02.teach.dialogue_line03:
    title: "Mathieu asks about the recipes"
    gloss: "Mathieu asks why Inès shows him the recipes every day."
  fr.b1.unit34.lesson02.teach.dialogue_line04:
    title: "Inès explains her purpose for training him"
    gloss: "Inès says she is training him so that he can prepare the orders alone."
  fr.b1.unit34.lesson02.teach.dialogue_line05:
    title: "Mathieu asks about the future"
    gloss: "Mathieu asks whether she will soon no longer need him in the morning."
  fr.b1.unit34.lesson02.teach.dialogue_line06:
    title: "Inès confirms the goal"
    gloss: "Inès confirms she is training him so that he becomes more independent."

exercises:
