    instruction: "What is Inès's purpose for saving money?"
    correct_option: "To buy a professional oven"
    distractors: ["To pay Mathieu", "To rent a new room"]
    accepted_answers: ["To buy a professional oven"]
  fr.b1.unit34.lesson01.exercise02.listen_pour_infinitif:
    instruction: "Listen and select the exact sentence you hear."
    correct_option: "Je fais des économies pour acheter un four professionnel."
    distractors: ["Je te forme pour que tu puisses préparer les commandes seul.", "Elle travaille le soir pour étudier la pâtisserie."]
    accepted_answers: ["Je fais des économies pour acheter un four professionnel."]
  fr.b1.unit34.lesson01.exercise03.match_pour_infinitif:
    instruction: "Match each French purpose phrase to English."
    correct_response:
      "pour acheter": "in order to buy"
      "des économies": "savings"
      "un four professionnel": "a professional oven"
      "pour étudier": "in order to study"
      "le soir": "in the evening"
      "la pâtisserie": "pastry"
  fr.b1.unit34.lesson01.exercise04.order_pour_infinitif:
    instruction: "Build the purpose sentence: I am saving money in order to buy a professional oven."
    correct_response: ["Je", "fais", "des", "économies", "pour", "acheter", "un", "four", "professionnel"]
  fr.b1.unit34.lesson01.exercise05.write_pour_infinitif:
    instruction: "Write exactly this purpose sentence with *pour + infinitif*, same subject: *Je fais des économies pour acheter un four professionnel.*"
