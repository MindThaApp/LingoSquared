    to match the realization's canon fix: Inès's own savings goal
    (a pastry course) for lesson 1, and the chef training Inès (not
    Inès training Mathieu) for lesson 2.

    Second-pass review 2026-10-19: 4 fixes — lesson02.exercise05.speak_pour_que: instruction printed the full French answer -> instruction names the content and form; added "Le chef me forme pour que je puisse préparer les commandes seule."; lesson01.exercise02.listen_pour_infinitif: distractor "Il me forme pour que je puisse..." used pour que/puisse (taught lesson02) -> taught lesson01 sentence "Je fais des économies chaque mois."; lesson01.teach.pattern + lesson02.teach.pattern: same/different-subject rule was framed as "person acting vs person with the goal" (wrong for "Il me forme pour que je puisse", where the actor is also the one with the goal) -> framed as same/different grammatical subject of the main verb and the purpose verb.

answer_policy:
  accent_marks: "Accept accentless typed variants when otherwise exact."
  capitalization: "Accept normal sentence capitalization variants."
  register: "Use tu between Inès and Mathieu."

course:
  title: "French B1"
  description: "Explaining the purpose or goal behind an action."

units:
  fr.b1.unit34.objectifs:
    title: "Purpose and goals"

lessons:
  fr.b1.unit34.lesson01.pour_infinitif:
    title: "In order to take an advanced course"
  fr.b1.unit34.lesson02.pour_que_subjonctif:
    title: "So that I can work alone"

teaching:
  fr.b1.unit34.lesson01.teach.pour_infinitif:
    title: "In order to take"
    gloss: "in order to take"
    note: "*Pour + infinitif* states the purpose when the subject is the same in both clauses."
    example_gloss: "I am saving money in order to take an advanced pastry course."
  fr.b1.unit34.lesson01.teach.economies:
    title: "Savings"
    gloss: "savings"
    example_gloss: "I save money every month."
  fr.b1.unit34.lesson01.teach.formation:
    title: "An advanced pastry course"
    gloss: "an advanced pastry course"
    example_gloss: "The advanced pastry course lasts six months."
  fr.b1.unit34.lesson01.teach.pattern:
    title: "Pour plus infinitif, same subject"
    gloss: "in order to, same subject"
    note: "Use *pour + infinitive* only when the main verb and the purpose verb have the same subject (*Je* fais des économies pour suivre...: I save, and I take the course)."
  fr.b1.unit34.lesson01.teach.etudier:
    title: "In order to study"
    gloss: "in order to study"
    example_gloss: "She works evenings in order to study pastry."

  fr.b1.unit34.lesson02.teach.pour_que:
    title: "So that"
    gloss: "so that"
    note: "*Pour que* introduces a purpose clause when the subject changes, and is followed by the subjunctive."
    example_gloss: "He is training me so that I can prepare the orders alone."
  fr.b1.unit34.lesson02.teach.puisse:
    title: "I can"
    gloss: "I can"
    note: "*Puisse* is the subjunctive of *pouvoir*, required after *pour que*."
    example_gloss: "I need to be able to prepare the orders alone."
  fr.b1.unit34.lesson02.teach.sois_independante:
    title: "I am more independent"
    gloss: "I am more independent"
    note: "*Sois* is the subjunctive of *être*."
    example_gloss: "He is training me so that I am more independent."
  fr.b1.unit34.lesson02.teach.pattern:
    title: "Pour que plus subjunctive, different subject"
    gloss: "so that, different subject"
    note: "Use *pour que + subjunctive* when the main verb and the purpose verb have different subjects (*Il* me forme pour que *je* puisse...)."
  fr.b1.unit34.lesson02.teach.dialogue_line01:
    title: "Mathieu asks why Inès is saving"
    gloss: "Mathieu asks why Inès is saving money."
  fr.b1.unit34.lesson02.teach.dialogue_line02:
    title: "Inès states her purpose"
    gloss: "Inès says she is saving money in order to take an advanced pastry course."
  fr.b1.unit34.lesson02.teach.dialogue_line03:
    title: "Mathieu asks about the recipes"
    gloss: "Mathieu asks why the chef shows Inès the recipes every day."
  fr.b1.unit34.lesson02.teach.dialogue_line04:
    title: "Inès explains why the chef trains her"
    gloss: "Inès says he is training her so that she can prepare the orders alone."
  fr.b1.unit34.lesson02.teach.dialogue_line05:
    title: "Mathieu asks about the future"
    gloss: "Mathieu asks whether she will soon no longer need the chef in the morning."
  fr.b1.unit34.lesson02.teach.dialogue_line06:
    title: "Inès confirms the goal"
    gloss: "Inès confirms he is training her so that she becomes more independent."

exercises:
  fr.b1.unit34.lesson01.exercise01.select_purpose:
    instruction: "What is Inès's purpose for saving money?"
    correct_option: "To take an advanced pastry course"
    distractors: ["To pay Mathieu", "To rent a new room"]
    accepted_answers: ["To take an advanced pastry course"]
  fr.b1.unit34.lesson01.exercise02.listen_pour_infinitif:
    instruction: "Listen and select the exact sentence you hear."
    correct_option: "Je fais des économies pour suivre une formation de pâtisserie avancée."
    distractors: ["Je fais des économies chaque mois.", "Elle travaille le soir pour étudier la pâtisserie."]
    accepted_answers: ["Je fais des économies pour suivre une formation de pâtisserie avancée."]
  fr.b1.unit34.lesson01.exercise03.match_pour_infinitif:
    instruction: "Match each French purpose phrase to English."
    correct_response:
      "pour suivre": "in order to take"
      "des économies": "savings"
      "une formation de pâtisserie avancée": "an advanced pastry course"
      "pour étudier": "in order to study"
      "le soir": "in the evening"
      "la pâtisserie": "pastry"
  fr.b1.unit34.lesson01.exercise04.order_pour_infinitif:
    instruction: "Build the purpose sentence: I am saving money in order to take an advanced pastry course."
    correct_response: ["Je", "fais", "des", "économies", "pour", "suivre", "une", "formation", "de", "pâtisserie", "avancée"]
  fr.b1.unit34.lesson01.exercise05.write_pour_infinitif:
    instruction: "Write this purpose sentence in French with pour + infinitive (same subject): I'm saving money to take an advanced pastry course."
    accepted_answers:
      - status: correct
        value: "Je fais des économies pour suivre une formation de pâtisserie avancée."
      - status: correct
        value: "Je fais des économies pour suivre une formation de pâtisserie avancée"
  fr.b1.unit34.lesson02.exercise01.select_purpose_pour_que:
    instruction: "Why is the chef training Inès?"
    correct_option: "So that she can prepare the orders alone"
    distractors: ["So that she can buy a new oven", "So that she can save money"]
    accepted_answers: ["So that she can prepare the orders alone"]
  fr.b1.unit34.lesson02.exercise02.comprehend_dialogue:
    instruction: "Listen to the dialogue. Why is the chef training Inès on the recipes?"
    correct_option: "So that she can prepare the orders alone"
    distractors: ["So that she can buy the oven", "So that she can talk to Mathieu"]
    accepted_answers: ["So that she can prepare the orders alone"]
  fr.b1.unit34.lesson02.exercise03.match_pour_que:
    instruction: "Match each French purpose phrase to English."
    correct_response:
      "pour que": "so that"
      "je puisse": "I can"
      "préparer les commandes seule": "prepare the orders alone"
      "je sois plus indépendante": "I am more independent"
      "il me forme": "he trains me"
      "bientôt": "soon"
  fr.b1.unit34.lesson02.exercise04.order_pour_que:
    instruction: "Build the purpose sentence: He is training me so that I can prepare the orders alone."
    correct_response: ["Il", "me", "forme", "pour", "que", "je", "puisse", "préparer", "les", "commandes", "seule"]
  fr.b1.unit34.lesson02.exercise05.speak_pour_que:
    instruction: "Take Inès's role. Answer with a purpose clause (*pour que* + subjunctive, different subject): say that he is training you so that you can prepare the orders alone."
    accepted_answers:
      - "Il me forme pour que je puisse préparer les commandes seule."
      - "Il me forme pour que je puisse préparer les commandes seule"
      - "Le chef me forme pour que je puisse préparer les commandes seule."
  fr.b1.unit34.lesson02.exercise06.write_culminating:
    instruction: "Write two French purpose sentences as Inès: one with pour + infinitive (I'm saving money to take an advanced pastry course) and one with pour que + subjunctive (He is training me so that I can prepare the orders on my own)."
    accepted_answers:
      - status: correct
        value: "Je fais des économies pour suivre une formation de pâtisserie avancée. Il me forme pour que je puisse préparer les commandes seule."
      - status: correct
        value: "Je fais des économies pour suivre une formation de pâtisserie avancée. Il me forme pour que je puisse préparer les commandes seule"
  fr.b1.unit34.lesson01.exercise06.dictation_pour_infinitif:
    correct_response: "Je fais des économies pour suivre une formation de pâtisserie avancée."
    orthography_strict: true
    feedback: "Check every accent and punctuation mark."
