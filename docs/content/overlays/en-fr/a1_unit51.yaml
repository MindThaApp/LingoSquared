teaching:
  fr.a1.unit51.lesson01.teach.combien_ca_coute:
    title: Asking the total price
    gloss: How much does it cost in total?
    note: '*En tout* (in total) makes clear you want the full combined price, not the price of one item.'
  fr.a1.unit51.lesson01.teach.ca_coute_vingt:
    title: Stating a total price
    gloss: It costs twenty-five euros in total.
    note: '*Ça coûte* uses *ça* (it) with *coûte*, the form of *coûter* (to cost) used for a single thing.'
  fr.a1.unit51.lesson02.teach.payer_par_carte:
    title: Paying by card or in cash
    gloss: to pay by card, to pay cash
    note: '*Payer par carte* is the usual way to say you pay by card, and *payer en espèces* means paying cash. Use *par* with *carte* and *en* with *espèces*.'
    example_gloss:
    - Can I pay by card here?
    - I'm paying in cash.
  fr.a1.unit51.lesson02.teach.je_peux_payer:
    title: Asking if card payment is possible
    gloss: Can I pay by card here?
    note: '*Ici* (here) places the question at the counter where you are standing.'
  fr.a1.unit51.lesson02.teach.vous_voulez_payer:
    title: Asking about payment preference
    gloss: Would you like to pay cash or by card?
    note: '*Vous voulez ... ?* is the formal way to ask, used by a cashier you do not know; friends would say *tu veux ... ?*.'
  fr.a1.unit51.lesson03.teach.l_addition:
    title: The bill
    gloss: the bill
    note: '*Addition* is feminine: *l''addition*. *La* shortens to *l''* before a vowel.'
    example_gloss: Shall we split the bill?
  fr.a1.unit51.lesson03.teach.on_partage_l:
    title: Suggesting to split the bill
    gloss: Shall we split the bill?
    note: '*On ... ?* proposes doing something together, as in *On partage ?*. *Partager* (to share) works with *l''addition*.'
  fr.a1.unit51.lesson03.teach.je_peux_payer:
    title: Asking to pay separately
    gloss: May I pay separately?
    note: '*Séparément* (separately) goes right after *payer*; it is the polite way to ask for your own part of the bill.'
  fr.a1.unit51.lesson04.teach.la_monnaie:
    title: The change
    gloss: the change
    note: '*Monnaie* is feminine: *la monnaie*. It means the coins and notes you get back.'
    example_gloss: Here's your change.
  fr.a1.unit51.lesson04.teach.voici_votre_monnaie:
    title: Handing over change
    gloss: Here's your change.
    note: '*Votre* is the formal ''your'', matching the *vous* register at a counter.'
  fr.a1.unit51.lesson04.teach.je_n_ai:
    title: Declining change
    gloss: I don't need change.
    note: '*Avoir besoin de* (to need) is followed by a noun: *Je n''ai pas besoin de monnaie.* After *ne ... pas*, *de* replaces *de la*.'
  fr.a1.unit51.lesson05.teach.trente_cinq:
    title: Thirty-five
    gloss: thirty-five
    note: '*Trente-cinq* is written with a hyphen and puts the tens first: thirty + five.'
    example_gloss: It costs thirty-five euros.
  fr.a1.unit51.lesson05.teach.addition_deux_plats:
    title: Read a restaurant bill
    gloss: 'Bill: two main courses and two coffees. Total: thirty-five euros. Paid by card.'
    note: Track what was ordered, the total, and how it was paid.
    glosses:
      Addition: bill
      deux: two
      plats: main courses
      cafés: coffees
      Total: total
      trente-cinq: thirty-five
      euros: euros
      Payé: paid
      carte: card
  fr.a1.unit51.lesson06.teach.camille_on_demande:
    title: Camille asks for the bill
    gloss: 'Camille: Shall we ask for the bill?'
    note: '*Demander* (to ask for) takes *l''addition* as its direct object, with no extra word.'
  fr.a1.unit51.lesson06.teach.mathieu_oui_bonne:
    title: Mathieu asks the total
    gloss: 'Mathieu: Yes, good idea. How much does it cost in total?'
    note: Reuses the *Combien ça coûte en tout ?* question from lesson 1.
  fr.a1.unit51.lesson06.teach.camille_ca_fait:
    title: Camille states the total
    gloss: 'Camille: It''s thirty-five euros. Shall we split it?'
    note: '*Ça fait* + an amount states the total, and *partager* refers back to the bill.'
  fr.a1.unit51.lesson06.teach.mathieu_non_laisse:
    title: Mathieu insists on paying
    gloss: 'Mathieu: No, let me pay today. You''ve helped me so much.'
    note: '*Laisse-moi* + infinitive offers to do something, and *aidé* is the past participle of *aider* (to help).'
  fr.a1.unit51.lesson06.teach.camille_c_est:
    title: Camille is touched
    gloss: 'Camille: That''s sweet of you! Thank you.'
    note: '*C''est gentil de ta part* (that is kind of you) is a warm, common compliment for a generous gesture.'
  fr.a1.unit51.lesson06.teach.mathieu_je_peux:
    title: Mathieu asks about paying by card
    gloss: 'Mathieu: Can I pay by card here?'
    note: Reuses *Je peux payer par carte ici ?* from lesson 2, now in the actual restaurant.
  fr.a1.unit51.lesson06.teach.mathieu_paie_l:
    title: 'Paie: the he/she form'
    gloss: Mathieu pays the bill.
    note: '*Paie* is the *il/elle* form of *payer* (to pay): *je paie, tu paies, il paie*.'
