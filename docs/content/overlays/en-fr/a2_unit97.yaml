teaching:
  fr.a2.unit97.lesson01.teach.mots:
    title: Saying what for
    gloss: in order to, for / to save (money) / to buy / to earn / a bike / money
    example_gloss:
    - I am saving to buy a bike.
    - I work to earn money.
    - What for?
  fr.a2.unit97.lesson01.teach.gn_pour:
    title: Pour plus infinitive
    gloss: I am saving to buy a bike.
    note: '*Pour* plus an infinitive says the aim of an action. The same person does both: I save, I buy. The infinitive never changes.'
  fr.a2.unit97.lesson01.teach.gn_quoi:
    title: Answering pourquoi
    gloss: Why are you saving? To buy a bike.
    note: A short answer can start with *pour* and name the aim. You do not repeat the subject.
  fr.a2.unit97.lesson01.teach.gn_question:
    title: Pour quoi faire ?
    gloss: What are you saving for? To buy a bike.
    note: '*Pour quoi faire ?* asks about the aim. It is the question behind a *pour* answer.'
  fr.a2.unit97.lesson01.teach.phrase:
    title: An aim
    gloss: I am saving to buy a bike.
  fr.a2.unit97.lesson02.teach.mots:
    title: Errands
    gloss: the bank / the post office / the bakery / the supermarket / to withdraw / to send / a parcel / some bread
    example_gloss:
    - I go to the bank to withdraw money.
    - I go to the post office to send a parcel.
    - I go to the bakery to buy some bread.
  fr.a2.unit97.lesson02.teach.gn_aller:
    title: Place and aim
    gloss: I go to the bank to withdraw money.
    note: '*Aller à* plus a place, then *pour* and an infinitive: where you go and what for.'
  fr.a2.unit97.lesson02.teach.gn_lieux:
    title: À la or au
    gloss: I go to the post office. I go to the supermarket.
    note: '*À la* goes before a feminine place, *au* (*à + le*) before a masculine one.'
  fr.a2.unit97.lesson02.teach.gn_quoi_faire:
    title: Asking about an errand
    gloss: What are you going to the post office for? To send a parcel.
    note: The place comes first, then *pour quoi faire ?*.
  fr.a2.unit97.lesson02.teach.phrase:
    title: An errand
    gloss: I go to the post office to send a parcel.
  fr.a2.unit97.lesson03.teach.mots:
    title: Learning and its aim
    gloss: to learn / French / to speak / to travel / a film / to watch
    example_gloss:
    - I am learning French to travel.
    - I watch films to learn.
    - We are learning French to speak with Camille.
  fr.a2.unit97.lesson03.teach.gn_but:
    title: The aim of learning
    gloss: I am learning French to travel.
    note: '*Pour* plus an infinitive gives the aim of learning, for example to travel, to work or to speak.'
  fr.a2.unit97.lesson03.teach.gn_pourquoi:
    title: Pour or parce que
    gloss: Why are you learning French? To travel. Because I like France.
    note: '*Pour* names an aim and takes an infinitive. *Parce que* gives a cause and takes a full clause.'
  fr.a2.unit97.lesson03.teach.gn_apprendre:
    title: Apprendre in the present
    gloss: He is learning French. We are learning French.
    note: '*Apprendre* follows *prendre*: *j''apprends*, *il apprend*, *nous apprenons*.'
  fr.a2.unit97.lesson03.teach.phrase:
    title: Learning for a reason
    gloss: I am learning French to travel.
  fr.a2.unit97.lesson04.teach.mots:
    title: For someone, so as not to
    gloss: a present / for you / for me / early / late
    example_gloss:
    - I have a present for you.
    - I leave early so as not to be late.
    - A coffee for me, please.
  fr.a2.unit97.lesson04.teach.gn_nom:
    title: Pour plus a person
    gloss: I have a present for you. A coffee for me.
    note: '*Pour* can also come before a noun or a person. After *pour*, use *moi*, *toi*, *lui*, *elle*, not *je*, *tu*, *il*.'
  fr.a2.unit97.lesson04.teach.gn_negatif:
    title: Pour ne pas
    gloss: I leave early so as not to be late.
    note: 'To say what you want to avoid, put *ne pas* before the infinitive: *pour ne pas être en retard*.'
  fr.a2.unit97.lesson04.teach.gn_resume:
    title: Pour twice
    gloss: What for? To buy a present for you.
    note: A sentence can use *pour* for the aim and *pour* for the person.
  fr.a2.unit97.lesson04.teach.phrase:
    title: So as not to be late
    gloss: I leave early so as not to be late.
  fr.a2.unit97.lesson05.teach.mots:
    title: Words for the message
    gloss: here is, here are / also / this morning
    example_gloss:
    - Here is my list for this morning.
    - I also have a present for you!
  fr.a2.unit97.lesson05.teach.gn_enchainer:
    title: Chaining errands
    gloss: I go to the bank to withdraw money, then to the post office to send a parcel.
    note: '*Puis* links two errands. You do not repeat *je vais*.'
  fr.a2.unit97.lesson05.teach.gn_aussi:
    title: Aussi
    gloss: I also have a present for you!
    note: '*Aussi* means ''also''. It goes after the verb *avoir*.'
  fr.a2.unit97.lesson05.teach.reading:
    title: Camille writes to Mathieu
    gloss: Hi Mathieu! Here is my list for this morning. I go to the bank to withdraw money, then to the post office to send a parcel. I go to the bakery to buy some bread. I also have a present for you! Camille
    note: Each errand is followed by its purpose with pour.
    glosses:
      colis: parcel
      cadeau: present
  fr.a2.unit97.lesson06.teach.q1:
    title: Camille asks why
    gloss: 'Camille: Mathieu, why do you work a lot?'
  fr.a2.unit97.lesson06.teach.a1:
    title: Mathieu gives his aim
    gloss: 'Mathieu: To earn money. I am saving to buy a bike.'
  fr.a2.unit97.lesson06.teach.q2:
    title: Camille shares her errand
    gloss: 'Camille: Great! Me, I am going to the bank to withdraw money.'
  fr.a2.unit97.lesson06.teach.a2:
    title: Mathieu asks what for
    gloss: 'Mathieu: What for?'
  fr.a2.unit97.lesson06.teach.q3:
    title: Camille reveals
    gloss: 'Camille: To buy a present for you!'
  fr.a2.unit97.lesson06.teach.a3:
    title: Mathieu thanks her
    gloss: 'Mathieu: For me? Thank you, Camille!'
