    title: Mathieu recognizes Nina
teaching:
  fr.a1.unit53.lesson01.teach.grand_petit:
    title: Tall and short
    gloss: tall / short
    note: '*Grand* describes a tall person and *petit* a short one. They agree with the person: *grand/grande*, *petit/petite*.'
    example_gloss:
    - Léa is tall.
    - Thomas is short.
  fr.a1.unit53.lesson01.teach.vieux_jeune:
    title: Old and young
    gloss: old / young
    note: '*Vieux* and *jeune* here give a general impression of age, not an exact number of years.'
    example_gloss:
    - Grandpa is old.
    - Mathieu is young.
  fr.a1.unit53.lesson01.teach.pour_un_age:
    title: 'Age: a number or an impression'
    gloss: For an exact age French uses *avoir* (*Il a vingt ans*), but *être vieux* gives a general impression (*Mon grand-père est vieux*).
    note: You already know *Quel âge as-tu ?* for an exact age. Here *vieux* describes how old someone LOOKS, with no number attached.
  fr.a1.unit53.lesson01.teach.lea_est_grande:
    title: Léa is tall and Thomas is short
    gloss: Léa is tall and Thomas is short.
    note: A simple combined sentence using *et* (and), setting up the direct comparison in lesson 5.
  fr.a1.unit53.lesson02.teach.les_cheveux:
    title: Hair
    gloss: the hair
    note: '*Les cheveux* is always plural and masculine, even though English says ''hair'' in the singular.'
    example_gloss: Mathieu has short black hair.
  fr.a1.unit53.lesson02.teach.blonds_bruns_gris:
    title: Blond, brown, and grey
    gloss: blond / brown / grey
    note: 'Three hair colours. With *cheveux* the colour takes a plural *s*: *blonds*, *bruns*. *Gris* already ends in *s*, and *noirs* (black) is reused from the clothing unit.'
    example_gloss:
    - Camille has blond hair.
    - Thomas has brown hair.
    - Grandpa has grey hair.
  fr.a1.unit53.lesson02.teach.longs_courts:
    title: Long and short (hair)
    gloss: long / short (hair)
    note: '*Longs* (long) reuses the height idea from lesson 1, now describing hair length. *Courts* (short) is new here, and both take a plural *s* with *cheveux*.'
    example_gloss:
    - Léa has long hair.
    - Thomas has short hair.
  fr.a1.unit53.lesson02.teach.cheveux_est_toujours:
    title: Cheveux takes a plural adjective
    gloss: '*Cheveux* is always plural, so the adjective takes an *s*: *longs*, *courts*, *blonds*, *bruns*, *noirs*. *Gris* already ends in *s*.'
    note: 'Colours and lengths agree with *cheveux* in the plural: *les cheveux longs*. Compare *yeux* in lesson 3, where *marron* does not change.'
  fr.a1.unit53.lesson02.teach.ses_est_le:
    title: 'Ses: his or her'
    gloss: '*Ses* means ''his'' or ''her'' before a plural noun: *ses cheveux*, *ses yeux*. It agrees with the thing owned, not with the owner.'
    note: 'French has no separate word for ''her'' and ''his'' here: *ses yeux* can mean ''her eyes'' or ''his eyes'', and context tells you which.'
  fr.a1.unit53.lesson02.teach.mathieu_a_les:
    title: Mathieu has short black hair
    gloss: Mathieu has short black hair.
    note: Reuses *noirs* (black) from the clothing unit.
  fr.a1.unit53.lesson02.teach.camille_a_les:
    title: Camille has long blond hair
    gloss: Camille has long blond hair.
    note: Combines this lesson's length and color vocabulary in one natural sentence.
  fr.a1.unit53.lesson03.teach.les_yeux:
    title: Eyes
    gloss: the eyes
    note: '*Les yeux* is the plural of *l''œil* (the eye); *yeux* ends in *x*, not *s*.'
    example_gloss: Mathieu has brown eyes.
  fr.a1.unit53.lesson03.teach.bleus_marron_verts:
    title: Blue, brown, and green
    gloss: blue / brown / green
    note: '*Bleus* (blue) was covered earlier for clothing; *marron* (brown) never changes; *verts* (green) is new.'
    example_gloss:
    - Camille has blue eyes.
    - Thomas has brown eyes.
    - Léa has green eyes.
  fr.a1.unit53.lesson03.teach.avec_yeux_pluriel:
    title: Yeux takes -s, marron stays
    gloss: 'With *yeux* (plural), the adjective takes an *s*: *yeux bleus*, *yeux verts*. *Marron* never changes: *yeux marron*.'
    note: 'Compare lesson 2''s *cheveux*: a plural noun brings a plural adjective, except for colours like *marron* that are borrowed from a noun.'
  fr.a1.unit53.lesson03.teach.comment_est_camille:
    title: What does Camille look like?
    gloss: What does Camille look like?
    note: '*Comment est ... ?* is this unit''s core question; reuse it to ask about anyone''s appearance.'
  fr.a1.unit53.lesson03.teach.camille_a_les:
    title: Camille has long blond hair and blue eyes
    gloss: Camille has long blond hair and blue eyes.
    note: A model answer combining hair and eyes in one sentence with *et*.
  fr.a1.unit53.lesson04.teach.camille_une_nouvelle:
    title: Camille introduces Nina
    gloss: 'Camille: A new girl is coming to the language café. Her name is Nina.'
    note: '*Une nouvelle fille vient* introduces someone new to the scene; *vient* comes from *venir* (to come).'
  fr.a1.unit53.lesson04.teach.mathieu_d_accord:
    title: Mathieu asks what she looks like
    gloss: 'Mathieu: Okay! What does she look like?'
    note: 'Reuses the core question with *elle* (she) instead of a name: *Comment est-elle ?* The hyphen joins the verb and the pronoun.'
  fr.a1.unit53.lesson04.teach.camille_elle_est:
    title: Camille describes Nina's height and hair
    gloss: 'Camille: She is short and she has short blond hair.'
    note: Combines lesson 1's *petite* with lesson 2's hair vocabulary; *petite* takes an *e* for a girl.
  fr.a1.unit53.lesson04.teach.mathieu_et_ses:
    title: Mathieu asks about her eyes
    gloss: 'Mathieu: And her eyes?'
    note: '*Ses yeux* here means ''her eyes'': *ses* agrees with *yeux*, not with the girl.'
  fr.a1.unit53.lesson04.teach.camille_elle_a:
    title: Camille describes Nina's eyes
    gloss: 'Camille: She has green eyes.'
    note: Reuses *yeux verts* from lesson 3.
  fr.a1.unit53.lesson04.teach.mathieu_merci_alors:
    title: Mathieu will recognize her
    gloss: 'Mathieu: Thanks! Then I''ll recognize her.'
    note: '*Je vais la reconnaître* uses *aller* + infinitive for the near future, and *la* means ''her''.'
  fr.a1.unit53.lesson05.teach.thomas_et_lea:
    title: Comparing Thomas and Léa
    gloss: Thomas and Léa are brother and sister, but they look different. Thomas is short and has short brown hair and brown eyes. Léa is taller than Thomas and has long brown hair and green eyes. What do you look like?
    note: A short comparison reusing every color/length word taught so far, ending with the unit's core question directed at the reader.
    glosses:
      frère: brother
      sœur: sister
      ressemblent: look
      différents: different
      petit: short
      courts: short
      bruns: brown
      cheveux: hair
      marron: brown
      yeux: eyes
      grande: taller
      longs: long
      verts: green
      se: (part of 'se ressemblent' = look alike)
  fr.a1.unit53.lesson05.teach.tu_connais_deja:
    title: Plus ... que with people
    gloss: 'You already know the pattern *plus* + adjective + *que*. Here you use it for people: Léa is taller than Thomas.'
    note: The same *plus ... que* pattern as in the shopping unit, now applied to people instead of objects. *Grande* agrees with *Léa*, who is female.
  fr.a1.unit53.lesson05.teach.lea_a_les:
    title: Léa has longer hair than Thomas
    gloss: Léa has longer hair than Thomas.
    note: '*Plus longs que* agrees with *cheveux* (plural): *les cheveux plus longs que Thomas*.'
  fr.a1.unit53.lesson05.teach.j_ai_les:
    title: I have short brown hair
    gloss: I have short brown hair.
    note: A model first-person sentence using *J'ai ...*, ready to reuse when describing your own appearance.
  fr.a1.unit53.lesson06.teach.mathieu_regarde_c:
    title: Mathieu spots Nina
    gloss: 'Mathieu: Look, is that Nina? She has short blond hair and green eyes.'
    note: '*Regarde* (look) is the *tu* command form of *regarder*, already used the same way in an earlier dialogue.'
  fr.a1.unit53.lesson06.teach.camille_oui_c:
    title: Camille confirms
    gloss: 'Camille: Yes, that''s Nina!'
    note: A short, natural confirmation.
  fr.a1.unit53.lesson06.teach.nina_salut_tu:
    title: Nina greets Mathieu
    gloss: 'Nina: Hi, are you Mathieu?'
    note: 'A simple informal greeting question: *Tu es ... ?*'
  fr.a1.unit53.lesson06.teach.mathieu_oui_ravi:
    title: Mathieu greets Nina back
    gloss: 'Mathieu: Yes! Nice to meet you, Nina.'
    note: '*Ravi de te rencontrer* is the standard phrase for a genuine first meeting (*ravi* for a man, *ravie* for a woman), not *content de te revoir*, which is for someone you already know.'
  fr.a1.unit53.lesson06.teach.nina_ravie_de:
    title: Nina returns the greeting
    gloss: 'Nina: Nice to meet you too!'
    note: Closes the dialogue -- Mathieu successfully recognized Nina from Camille's earlier description.
