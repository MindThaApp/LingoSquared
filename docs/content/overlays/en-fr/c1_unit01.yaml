  fr.c1.unit01.structure_discours.lesson01.teach.mon_projet:
    title: "my project for the pastry shop"
    gloss: "my project for the pastry shop"
    note: "*Mon projet pour la pâtisserie* names what Inès is going to present."
  fr.c1.unit01.structure_discours.lesson01.teach.annoncer_le_plan:
    title: "to announce the plan"
    gloss: "to announce the plan"
    note: "*Annoncer le plan* (to announce the plan) is the meta-move of signposting a contribution."
  fr.c1.unit01.structure_discours.lesson01.teach.modele_annonce:
    title: "The opening sentence"
    gloss: "First of all, I'm going to present my project for the pastry shop to you."
