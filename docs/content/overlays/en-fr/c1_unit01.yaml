    note: "*Notre travail* (our work) draws the team into the synthesis."
  fr.c1.unit01.structure_discours.lesson05.teach.modele_conclusion:
    title: "A conclusion / synthesis"
    gloss: "In the end, this project would help the pastry shop to grow and would enhance our work."
    note: "This sentence closes by drawing the strands together: the project helps the shop and values the team's work."

  fr.c1.unit01.structure_discours.lesson06.teach.modele_complet:
    title: "The complete structured contribution"
    gloss: "First of all, I'm going to present my project for the pastry shop to you. On the one hand, a new range of seasonal pastries would attract more customers. On the other hand, it would showcase the team's know-how. By the way, last year the strawberry tart was very successful. To come back to my idea, I propose to start with a small range of three desserts. In the end, this project would help the pastry shop to grow and would enhance our work."
    note: "This is the exact model for the final speaking and writing tasks: announce the direction, develop two points, digress, return, and conclude."
  fr.c1.unit01.structure_discours.lesson06.teach.structure_discours:
    title: "the structure of discourse"
    gloss: "the structure of discourse"
    note: "*La structure du discours* names the whole organized shape of a contribution."
    example_gloss: "The structure of Inès's discourse is very clear."

