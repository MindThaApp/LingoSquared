  notes: >-
    Overlay for French C1 unit 01 on structuring an extended contribution.
    English-speaker interference risks: reading a digression as a main point
    (or vice versa), and writing an open production prompt that a learner
    could answer with several different signpost sequences. The production
    exercises therefore name exact taught models and accept those strings.
    No sibling-direction overlay was consulted.

course:
  title: French C1
  description: "Advanced French discourse: signposting, developing points, digressing, and returning to structure an extended contribution."

units:
  fr.c1.unit01.structure_discours:
    title: "Structuring a discourse"
    description: "Structure an extended contribution: announce the direction, develop two linked points, digress, return, and close with a synthesis."

