    note: "*Mon idée* names the main line the speaker returns to."
  fr.c1.unit01.structure_discours.lesson04.teach.je_propose:
    title: "I propose to start"
    gloss: "I propose to start"
    note: "*Je propose de commencer* (I propose to start) restates the proposal after the return."
  fr.c1.unit01.structure_discours.lesson04.teach.petite_gamme:
    title: "with a small range of three desserts"
    gloss: "with a small range of three desserts"
    note: "*Par une petite gamme de trois desserts* specifies how the proposal would begin."
  fr.c1.unit01.structure_discours.lesson04.teach.modele_retour:
    title: "The return to the main line"
    gloss: "To come back to my idea, I propose to start with a small range of three desserts."
    note: "This sentence explicitly returns to the main line after the digression."

  fr.c1.unit01.structure_discours.lesson05.teach.en_definitive:
    title: "in the end"
    gloss: "in the end / all things considered"
    note: "*En définitive* (in the end) opens the conclusion."
  fr.c1.unit01.structure_discours.lesson05.teach.pour_conclure:
    title: "to conclude"
    gloss: "to conclude"
