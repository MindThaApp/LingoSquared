  fr.c1.unit01.structure_discours.lesson02.teach.modele_deux_points:
    title: "Two linked points"
    gloss: "On the one hand... on the other hand..."
    note: "This model develops two linked points framed by *d'une part ... d'autre part*."

  fr.c1.unit01.structure_discours.lesson03.teach.soit_dit_en_passant:
    title: "by the way"
    gloss: "by the way / incidentally"
