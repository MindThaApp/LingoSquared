course:
  title: French B2
  description: >-
    Upper-intermediate French: defend a position in a discussion -- state
    a claim, support it with reasons and evidence (premièrement, par
    exemple, une étude montre que), acknowledge the strongest opposing
    point (d'un côté ... de l'autre côté, bien que, évidemment), and
    rebut it without conceding (pourtant, en revanche, cependant, cela
    n'empêche pas que, bref), around the everyday debate of remote work.

units:
  fr.b2.unit01.argumentation:
    title: "Argumentation"
    description: Defend a position on an everyday issue -- state a claim, support it with reasons and evidence, acknowledge the strongest objection, and rebut it without giving up your claim.

lessons:
  fr.b2.unit01.lesson01.prendre_position:
    title: "Taking a position"
  fr.b2.unit01.lesson02.donner_des_raisons:
    title: "Giving reasons"
  fr.b2.unit01.lesson03.lautre_point_de_vue:
    title: "Acknowledging the other side"
  fr.b2.unit01.lesson04.refuter:
    title: "Rebutting"
  fr.b2.unit01.lesson05.lire_un_texte_argumentatif:
    title: "Reading an argument"
  fr.b2.unit01.lesson06.defendre_une_opinion:
    title: "Defending a position"

teaching:
  fr.b2.unit01.lesson01.teach.teletravail:
    title: "remote work"
    gloss: "remote work / working from home"
    note: "*Le télétravail* is the everyday word for remote work, always used with the article *le*. It is the topic this whole unit argues about."
    example_gloss: "Remote work is becoming common."
  fr.b2.unit01.lesson01.teach.travail_au_bureau:
    title: "working at the office"
    gloss: "office work / working at the office"
    note: "The opposite pole of the debate. *Au bureau* is a contraction of *à + le bureau*, 'at the office'."
  fr.b2.unit01.lesson01.teach.opinion:
    title: "an opinion"
    gloss: "an opinion"
    note: "*Une opinion* is a cognate of English 'opinion' -- the thing an argument is built around."
    example_gloss: "I have an opinion on this subject."
  fr.b2.unit01.lesson01.teach.je_pense_que:
    title: "I think that..."
    gloss: "I think that..."
    note: "*Je pense que...* introduces your own opinion, followed by the indicative (not the subjunctive, since you are affirming, not doubting): *je pense que le télétravail est meilleur*."
  fr.b2.unit01.lesson01.teach.selon_moi:
    title: "In my opinion..."
    gloss: "In my opinion... / According to me..."
    note: "*Selon moi* uses the stressed pronoun *moi*, not *je* -- a softer, very common way to open an opinion at the start of a sentence."
  fr.b2.unit01.lesson01.teach.meilleur:
    title: better
    gloss: better
    note: "*Meilleur* is the irregular comparative of *bon* (good) -- it agrees in gender/number (*meilleure*, *meilleurs*, *meilleures*), though this unit only uses the masculine singular form."
    example_gloss: "This plan is better."
  fr.b2.unit01.lesson01.teach.claim_model:
    title: "I think that remote work is better than working at the office."
    gloss: "I think that remote work is better than working at the office."
    note: "The model claim for this unit. *Meilleur que* = 'better than' -- the same *que* that introduces *je pense que* also means 'than' in a comparison."
  fr.b2.unit01.lesson01.teach.je_suis_daccord:
    title: "I agree."
    gloss: "I agree."
    note: "*Être d'accord* = 'to agree'. *D'accord* alone (without *je suis*) is also the everyday way to say 'okay' / 'agreed'."
  fr.b2.unit01.lesson01.teach.grammar_position:
    title: "I think that remote work is better than working at the office. I agree."
    gloss: "I think that remote work is better than working at the office. I agree."
    note: "A claim is the position you will defend. *Je pense que...* and *selon moi...* both signal that what follows is your opinion, not a stated fact -- the starting point of every argument in this unit."

  fr.b2.unit01.lesson02.teach.parce_que:
    title: because
    gloss: "because (subordinating)"
    note: "*Parce que* answers 'why' and can stand on its own as an answer: *— Pourquoi tu restes ? — Parce que c'est calme.* Compare *car* (next card), which cannot."
    example_gloss: "I work from home because it is quiet."
  fr.b2.unit01.lesson02.teach.car:
    title: "because / for"
    gloss: "because / for (coordinating)"
    note: "*Car* also means 'because', but it joins two complete clauses and is more formal/written -- it can never open a sentence the way *parce que* can. English 'because' hides this split that French makes."
    example_gloss: "I stay home, because that is nice."
  fr.b2.unit01.lesson02.teach.premierement_deuxiemement:
    title: "firstly, secondly"
    gloss: "firstly..., secondly..."
    note: "*Premièrement... deuxièmement...* number your reasons so an argument is easy to follow -- the classic way to signpost support."
  fr.b2.unit01.lesson02.teach.de_plus:
    title: "in addition"
    gloss: "in addition / moreover"
    note: "*De plus* adds a further reason and typically opens the clause it introduces."
    example_gloss: "In addition, one saves money."
  fr.b2.unit01.lesson02.teach.par_exemple:
    title: "for example"
    gloss: "for example"
    note: "*Par exemple* introduces a concrete example that backs up a reason."
    example_gloss: "Remote work has advantages, for example less stress."
  fr.b2.unit01.lesson02.teach.une_etude_montre_que:
    title: "a study shows that..."
    gloss: "a study shows that..."
    note: "*Une étude montre que...* is how you cite evidence in an argument. Like *je pense que*, the *que* is followed by the indicative here since the study's finding is presented as fact."
  fr.b2.unit01.lesson02.teach.temps_de_trajet:
    title: "commute time"
    gloss: "commute / travel time"
    example_gloss: "The commute time is long in the morning."
  fr.b2.unit01.lesson02.teach.economiser:
    title: "to save"
    gloss: "to save (time, money)"
    note: "*Économiser* = to save. This unit uses the *tu*-forms: *tu économises* (you save)."
    example_gloss: "One can save a lot of time."
  fr.b2.unit01.lesson02.teach.tu_es:
    title: "you are"
    gloss: "you are (informal, generic 'you')"
    note: "*Tu* here doubles as the generic 'you' -- 'you save time' means 'one saves time'. It is the natural way spoken French states a general point in an argument, matching Inès and Mathieu's everyday *tu* register."
  fr.b2.unit01.lesson02.teach.productif:
    title: productive
    gloss: productive
    note: "*Productif* is the masculine form; the feminine is *productive* (*je suis productive* when a woman talks about herself)."
    example_gloss: "At home, I am more productive."
  fr.b2.unit01.lesson02.teach.grammar_raisons:
    title: "Firstly, you save a lot of commute time. In addition, you are more productive at home."
    gloss: "Firstly, you save a lot of commute time. In addition, you are more productive at home."
    note: "Support = the reasons and evidence behind your claim. Number them (*premièrement*, *de plus*), give examples (*par exemple*), and cite evidence (*une étude montre que*) so the argument is easy to follow."

  fr.b2.unit01.lesson03.teach.dun_cote:
    title: "on the one hand..."
    gloss: "on the one hand..."
    note: "*D'un côté...* opens a balanced view; it is almost always paired with *de l'autre côté...* to introduce the opposing point you are about to acknowledge."
  fr.b2.unit01.lesson03.teach.de_lautre_cote:
    title: "on the other hand..."
    gloss: "on the other hand..."
    note: "*De l'autre côté...* introduces the strongest point against your claim. Acknowledging it (before you rebut it) is what makes a B2 argument convincing rather than one-sided."
  fr.b2.unit01.lesson03.teach.bien_que:
    title: although
    gloss: "although (+ subjunctive)"
    note: "*Bien que* concedes a point and is ALWAYS followed by the subjunctive: *bien que ce soit pratique* ('although it is convenient' -- *soit* is the subjunctive of *être*). This is a genuine grammar trap for English speakers, who have no equivalent mood shift."
    example_gloss: "Although it is convenient, I stay flexible."
  fr.b2.unit01.lesson03.teach.evidemment:
    title: "of course"
    gloss: "of course / obviously"
    note: "*Évidemment* concedes that the opposing point is fair ('of course you miss...') -- a natural way to acknowledge before you push back."
    example_gloss: "Of course you are right."
  fr.b2.unit01.lesson03.teach.cest_vrai:
    title: "That's true."
    gloss: "That's true. / That's correct."
    note: "*C'est vrai* grants that the other side has a real point -- you acknowledge it honestly, then rebut it in the next breath."
  fr.b2.unit01.lesson03.teach.certains_pensent_que:
    title: "some people think that..."
    gloss: "some people think that..."
    note: "*Certains pensent que...* introduces a common objection without owning it yourself -- 'some people think that...' -- so you can then answer it."
  fr.b2.unit01.lesson03.teach.tes_collegues:
    title: "your colleagues"
    gloss: "your colleagues"
    note: "*Tes* is the plural possessive 'your', used for both masculine and feminine plural nouns."
  fr.b2.unit01.lesson03.teach.manquer:
    title: "to miss"
    gloss: "to miss (someone/something)"
    note: "*Manquer* reverses the English construction: the person or thing missed is the GRAMMATICAL SUBJECT. *Mes amis me manquent* literally means 'my friends are missing to me' = 'I miss my friends'. This is the single trickiest point in the unit for English speakers -- watch for it in the next card."
    example_gloss: "I miss my friends."
  fr.b2.unit01.lesson03.teach.tes_collegues_te_manquent:
    title: "You miss your colleagues."
    gloss: "You miss your colleagues. (literally: your colleagues are missing to you)"
    note: "Applying the *manquer* reversal: *tes collègues* (subject, 'your colleagues') + *te* (object, 'to you') + *manquent* (verb). English speakers reliably want to say '*tu manques tes collègues*', which is wrong -- the person doing the missing is the OBJECT, not the subject."
  fr.b2.unit01.lesson03.teach.parfois:
    title: sometimes
    gloss: sometimes
    example_gloss: "Sometimes I work late."
  fr.b2.unit01.lesson03.teach.agreable:
    title: "nice / pleasant"
    gloss: "nice / pleasant"
    example_gloss: "Silence is nice."
  fr.b2.unit01.lesson03.teach.grammar_concession:
    title: "On the one hand, remote work is nice. On the other hand, you sometimes miss your colleagues."
    gloss: "On the one hand, remote work is nice. On the other hand, you sometimes miss your colleagues."
    note: "Acknowledging the other side = naming the strongest point against you fairly, before you answer it. *D'un côté... de l'autre côté...*, *bien que*, *évidemment*, and *c'est vrai* all do this without giving up your own position."

  fr.b2.unit01.lesson04.teach.pourtant:
    title: "yet / still"
    gloss: "yet / still / however"
    note: "*Pourtant* answers a concession: you grant the objection, then *pourtant...* ('yet, ...') reasserts your claim. It is the core rebuttal word of this unit."
    example_gloss: "It is noisy; yet, I work well."
  fr.b2.unit01.lesson04.teach.en_revanche:
    title: "by contrast"
    gloss: "by contrast / on the other hand"
    note: "*En revanche* sets one thing directly against another and is more formal than *mais*: 'at the office it's noisy; at home, by contrast, it's quiet'."
    example_gloss: "At the office it is noisy; at home, by contrast, it is quiet."
  fr.b2.unit01.lesson04.teach.mais:
    title: but
    gloss: but
    note: "*Mais* is the everyday contrast word. It pivots from the acknowledged point back to your claim."
    example_gloss: "It is convenient, but not perfect."
  fr.b2.unit01.lesson04.teach.cependant:
    title: however
    gloss: however
    note: "*Cependant* is a more formal 'however', often opening its own sentence. Same job as *mais*, higher register."
    example_gloss: "Remote work is nice. However, it can be isolating."
  fr.b2.unit01.lesson04.teach.cela_nempeche_pas_que:
    title: "that does not change the fact that..."
    gloss: "that does not change the fact that..."
    note: "*Cela n'empêche pas que...* is a set B2 rebuttal frame: you accept the objection, but say it does not undo your claim. In careful written French the verb after it is usually in the subjunctive (*cela n'empêche pas que tu puisses...*); in everyday speech the indicative (*tu peux*) is also heard when you stress that something really is the case."
  fr.b2.unit01.lesson04.teach.bref:
    title: "in short"
    gloss: "in short"
    note: "*Bref* signposts your conclusion -- it wraps the argument up: 'in short, ...'."
    example_gloss: "In short, remote work is better."
  fr.b2.unit01.lesson04.teach.avantages:
    title: advantages
    gloss: "advantages (plural of avantage)"
    example_gloss: "Remote work has a lot of advantages."
  fr.b2.unit01.lesson04.teach.inconvenients:
    title: disadvantages
    gloss: "disadvantages (plural of inconvénient)"
    example_gloss: "It also has disadvantages."
  fr.b2.unit01.lesson04.teach.peser:
    title: "to weigh"
    gloss: "to weigh (carry weight)"
    note: "*Peser* here means 'to carry weight' in an argument. *Les avantages pèsent plus lourd* = 'the advantages weigh heavier / count for more'. Singular: *pèse*."
    example_gloss: "The advantages weigh heavier."
  fr.b2.unit01.lesson04.teach.plus_lourd:
    title: heavier
    gloss: "heavier (more heavy)"
  fr.b2.unit01.lesson04.teach.liberte:
    title: freedom
    gloss: freedom
    example_gloss: "Remote work gives freedom."
  fr.b2.unit01.lesson04.teach.avoir_des_avantages:
    title: "to have advantages"
    gloss: "to have advantages"
    note: "*Avoir des avantages* concedes the other side has advantages -- before you rebut. *A* = 'has' (from *avoir*)."
  fr.b2.unit01.lesson04.teach.grammar_refutation:
    title: "That's true, but that does not change the fact that the advantages weigh heavier. In short, remote work is better."
    gloss: "That's true, but that does not change the fact that the advantages weigh heavier. In short, remote work is better."
    note: "Rebutting = answering the acknowledged objection without giving up your claim. *Pourtant*, *mais*, *cependant*, *en revanche*, and *cela n'empêche pas que...* all pivot back to your position; *bref* signposts the conclusion."

  fr.b2.unit01.lesson05.teach.texte:
    title: "Reading: remote work is a good development"
    gloss: "More and more people work from home. I am convinced that this is a good development. Firstly, you save a lot of commute time, and a study shows that remote workers are often more productive. Of course, some say that at home, you miss your colleagues. That's true, but that does not change the fact that you can still call and video-conference. In short, the advantages weigh heavier than the disadvantages."
    glosses:
      en: "in (here part of de plus en plus = more and more)"
      gens: "people"
      travaillent: "work (from travailler, to work)"
      convaincu: "convinced (feminine: convaincue)"
      bonne: "good (feminine of bon)"
      évolution: "development"
      et: "and"
      télétravailleurs: "people who work remotely"
      sont: "are (from être)"
      souvent: "often"
      productifs: "productive (masculine plural)"
      disent: "say (from dire)"
      "qu'à": "that at (elided que + à)"
      puisses: "can (subjunctive of pouvoir, tu-form, after cela n'empêche pas que)"
      encore: "still"
      appeler: "to call"
      faire: "to do / to make"
      des: "some (indefinite plural article)"
      visioconférences: "video calls"

  fr.b2.unit01.lesson06.teach.pourquoi_tu_penses_ca:
    title: "Why do you think that?"
    gloss: "Why do you think that?"
    note: "*Pourquoi tu penses ça ?* asks a debating partner to support their claim -- the cue to give your reasons and evidence."
  fr.b2.unit01.lesson06.teach.ca_se_tient:
    title: "That makes sense."
    gloss: "That makes sense. / You have a point."
    note: "*Ça se tient* (literally 'that holds together') concedes that the other person's argument is reasonable -- a natural, informal way to acknowledge a good point in conversation."
  fr.b2.unit01.lesson06.teach.dialogue_ines_claim:
    title: "Inès: I think remote work is better than working at the office."
    gloss: "Inès: I think remote work is better than working at the office."
  fr.b2.unit01.lesson06.teach.dialogue_mathieu_why:
    title: "Mathieu: Why do you think that?"
    gloss: "Mathieu: Why do you think that?"
  fr.b2.unit01.lesson06.teach.dialogue_ines_support:
    title: "Inès: Firstly, you save a lot of commute time, and a study shows that remote workers are more productive."
    gloss: "Inès: Firstly, you save a lot of commute time, and a study shows that remote workers are more productive."
  fr.b2.unit01.lesson06.teach.dialogue_mathieu_objection:
    title: "Mathieu: On the other hand, you miss your colleagues."
    gloss: "Mathieu: On the other hand, you miss your colleagues."
  fr.b2.unit01.lesson06.teach.dialogue_ines_rebuttal:
    title: "Inès: That's true, but that does not change the fact that you can video-conference. In short, the advantages weigh heavier."
    gloss: "Inès: That's true, but that does not change the fact that you can video-conference. In short, the advantages weigh heavier."
  fr.b2.unit01.lesson06.teach.dialogue_mathieu_concede:
    title: "Mathieu: That makes sense."
    gloss: "Mathieu: That makes sense."
  fr.b2.unit01.lesson06.teach.grammar_argument_complet:
    title: "I think remote work is better than working at the office. Firstly, you save a lot of commute time. Of course, you sometimes miss your colleagues. Yet, the advantages weigh heavier."
    gloss: "I think remote work is better than working at the office. Firstly, you save a lot of commute time. Of course, you sometimes miss your colleagues. Yet, the advantages weigh heavier."
    note: "A complete argument has four moves: claim (*je pense que...*), support (*premièrement...*), acknowledged objection (*évidemment...*), and rebuttal (*pourtant...*). This is exactly what you produce in the speaking and writing tasks of this lesson."

exercises:
  fr.b2.unit01.lesson01.exercise01.recognize_opinion:
    instruction: "What does this word mean?"
    correct_option: "an opinion"
    distractors: [a question, an answer, an agreement]
    accepted_answers: [{value: "an opinion", status: correct}]
    feedback: "Une opinion is an opinion -- the claim you defend."
  fr.b2.unit01.lesson01.exercise02.listen_claim:
    instruction: "Listen and select what you hear."
    correct_option: "I think that remote work is better than working at the office."
    distractors: ["I think that working at the office is better than remote work.", "I think that remote work is nicer than commuting.", "I know that remote work is better than working at the office."]
    accepted_answers: [{value: "I think that remote work is better than working at the office.", status: correct}]
    feedback: "Je pense que le télétravail est meilleur que le travail au bureau means I think that remote work is better than working at the office."
  fr.b2.unit01.lesson01.exercise03.match_claim_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"le télétravail": "remote work / working from home", "le travail au bureau": "working at the office", "une opinion": "an opinion", "Je pense que...": "I think that...", "Selon moi...": "In my opinion...", meilleur: better, "Je suis d'accord.": "I agree."}
        status: correct
    feedback: "These are this lesson's claim-stating words."
  fr.b2.unit01.lesson01.exercise04.order_claim:
    instruction: "Put the words in order: I think that remote work is better."
    accepted_answers:
      - {value: "Je pense que le télétravail est meilleur", status: correct}
    feedback: "Je pense que le télétravail est meilleur means I think that remote work is better."
  fr.b2.unit01.lesson01.exercise05.translate_selon_moi:
    instruction: "Translate into French: In my opinion, remote work is better."
    accepted_answers:
