teaching:
  fr.a1.unit52.lesson01.teach.lire_faire_du:
    title: Reading, exercising, cooking
    gloss: to read, to exercise / play sports, to cook
    note: 'Three common hobby verbs: *lire* (to read), *faire du sport* (to exercise or play sports) and *cuisiner* (to cook).'
    example_gloss:
    - I like reading a book.
    - I exercise on Saturdays.
    - I like cooking for friends.
  fr.a1.unit52.lesson01.teach.le_temps_libre:
    title: Free time
    gloss: free time
    note: '*Temps libre* is masculine: *le temps libre*. It is the key phrase for talking about hobbies.'
    example_gloss: In my free time, I like to read.
  fr.a1.unit52.lesson01.teach.pendant_mon_temps:
    title: Saying what you do in your free time
    gloss: In my free time, I like to read.
    note: '*Lis* is the *je* form of *lire* (to read); the final *s* is silent.'
  fr.a1.unit52.lesson02.teach.ecouter_de_la:
    title: Music, drawing, gaming
    gloss: to listen to music, to draw, to game
    note: 'Three more hobbies: *écouter de la musique*, *dessiner* and *jouer aux jeux vidéo*. With games, *jouer à* + *les* becomes *jouer aux*.'
    example_gloss:
    - I like listening to music.
    - I often draw.
    - I like gaming with friends.
  fr.a1.unit52.lesson02.teach.j_aime_ecouter:
    title: Saying you like listening to music
    gloss: I like listening to music.
    note: '*Écouter* takes its object directly, with no extra word: *écouter de la musique*.'
  fr.a1.unit52.lesson02.teach.j_aime_jouer:
    title: Saying you like gaming with friends
    gloss: I like gaming with friends.
    note: '*Avec des amis* (with friends) reuses *amis* from lesson 1; *des* is the plural ''some''.'
  fr.a1.unit52.lesson03.teach.toujours_souvent_parfois:
    title: Always, often, sometimes, never
    gloss: always, often, sometimes, never
    note: The four core frequency adverbs. *Souvent* may be familiar already; *toujours*, *parfois* and *jamais* are new. *Jamais* needs *ne* before the verb.
    example_gloss:
    - I always exercise on Saturdays.
    - I often read a book.
    - I sometimes draw.
    - I never game.
  fr.a1.unit52.lesson03.teach.chaque_semaine_chaque:
    title: Every week, every weekend
    gloss: every week, every weekend
    note: '*Chaque semaine* and *chaque week-end* both mean ''every''. *Chaque* never changes, whatever the noun''s gender.'
    example_gloss:
    - I cook for friends every week.
    - I exercise every weekend.
  fr.a1.unit52.lesson03.teach.chaque_ne_change:
    title: Chaque never changes
    gloss: '*Chaque* stays the same before masculine and feminine nouns: *chaque semaine*, *chaque week-end*.'
    note: '*Semaine* is feminine and *week-end* is masculine, yet *chaque* is identical for both. Compare *tous les* / *toutes les*, which does change.'
  fr.a1.unit52.lesson03.teach.qu_est_ce:
    title: Asking about free time
    gloss: What do you do in your free time?
    note: This is the core question of this unit -- reuse it to ask anyone about their hobbies.
  fr.a1.unit52.lesson04.teach.camille_on_se:
    title: Camille brings up hobbies
    gloss: 'Camille: We often walk together. But what else do you do in your free time, Mathieu?'
    note: '*On se promène souvent* uses *on* for ''we'', and *souvent* sits right after the verb.'
  fr.a1.unit52.lesson04.teach.mathieu_j_aime:
    title: Mathieu's hobbies
    gloss: 'Mathieu: I like cooking, at home too. And I exercise often.'
    note: '*Même à la maison* (even at home) makes clear Mathieu cooks for fun, not just at his job.'
  fr.a1.unit52.lesson04.teach.camille_tu_cuisines:
    title: Camille is surprised
    gloss: 'Camille: You cook at home too? You already cook all day at your job!'
    note: '*Toute la journée* (all day long) stresses how much Mathieu already cooks at work.'
  fr.a1.unit52.lesson04.teach.mathieu_oui_mais:
    title: Mathieu explains
    gloss: 'Mathieu: Yes, but I find cooking relaxing. And you, what do you like doing?'
    note: '*Cuisiner, je trouve ça relaxant* puts *cuisiner* first for emphasis: literally ''cooking, I find that relaxing''.'
  fr.a1.unit52.lesson04.teach.camille_j_aime:
    title: Camille's hobbies
    gloss: 'Camille: I like reading and I often listen to music.'
    note: Combines two hobbies from lessons 1 and 2 in one sentence with *et* (and).
  fr.a1.unit52.lesson04.teach.mathieu_tu_joues:
    title: Mathieu asks about gaming
    gloss: 'Mathieu: Do you also game?'
    note: 'A short yes/no question: *Tu joues aussi aux jeux vidéo ?* Rising intonation makes it a question.'
  fr.a1.unit52.lesson04.teach.camille_non_je:
    title: Camille answers
    gloss: 'Camille: No, I never game. But I sometimes draw!'
    note: '*Jamais* (never) and *parfois* (sometimes) from lesson 3, contrasted in one answer.'
  fr.a1.unit52.lesson05.teach.mathieu_et_moi:
    title: Comparing hobbies
    gloss: Mathieu and I often walk together. But we also have other hobbies. Mathieu likes cooking, at home too, and he exercises often. I like reading and I often listen to music. I sometimes draw, but I never game. What do you like doing in your free time?
    note: Camille's message recaps facts from lesson04 and ends by asking the reader the unit's core question.
    glosses:
      promène: walk
      souvent: often
      ensemble: together
      d'autres: other
      cuisiner: cooks
      aime: likes to
      maison: at home
      sport: exercises
      lire: read
      "j'écoute": listen
      musique: music
      dessine: draw
      parfois: sometimes
      jeux: play video games
      jamais: never
      libre: free
      temps: time
  fr.a1.unit52.lesson06.teach.mathieu_qu_est:
    title: Mathieu asks about the weekend
    gloss: 'Mathieu: What are you doing this weekend?'
    note: '*Ce week-end* (this weekend) uses *ce* because *week-end* is masculine.'
  fr.a1.unit52.lesson06.teach.camille_je_ne:
    title: Camille is undecided
    gloss: 'Camille: I don''t know yet. I like reading, but I also want to go outside.'
    note: '*Sortir* (to go out) is a common way to say you want to leave the house.'
  fr.a1.unit52.lesson06.teach.mathieu_on_se:
    title: Mathieu suggests a plan
    gloss: 'Mathieu: Shall we walk together? I''ll cook for us afterward.'
    note: '*Après* (afterwards) sequences two plans, like *d''abord* and *ensuite*.'
  fr.a1.unit52.lesson06.teach.camille_bonne_idee:
    title: Camille agrees
    gloss: 'Camille: Good idea! I like both walking and cooking.'
    note: '*Autant ... que* (as much ... as) shows Camille likes two things equally, not one over the other.'
  fr.a1.unit52.lesson06.teach.mathieu_parfait_alors:
    title: Mathieu confirms
    gloss: 'Mathieu: Perfect. Then I''ll see you Saturday!'
    note: A friendly closing line confirming the plan for *samedi* (Saturday).
