answer_policy:
  accent_marks: >-
    Display and teach all French accents and the cedilla. In typed A1
    answers, accept a variant without accents when every other letter and
    word is correct.
  capitalization: >-
    Accept sentence-initial capitalization variants where meaning is
    unchanged. Preserve capitals in personal names.
  spoken_answers: >-
    Judge spoken responses by intelligibility and appropriate register
    rather than written punctuation or liaison marks.

course:
  title: "French A1"
  description: >-
    Describing a simple daily routine with reflexive verbs (se réveiller,
    se lever, se coucher) and sequencing words (d'abord, ensuite),
    continuing Inès and Mathieu's cooking-workshop narrative as Inès asks
    about Mathieu's Saturday. English-specific guidance highlights that
    French reflexive verbs need a reflexive pronoun (je ME réveille) with
    no direct one-word English equivalent.

units:
  fr.a1.unit10.routines:
    title: "Saturday routine"

lessons:
  fr.a1.unit10.lesson01.vocabulaire_routine:
    title: "Morning activities"
  fr.a1.unit10.lesson02.la_journee_complete:
    title: "The full day"
  fr.a1.unit10.lesson03.dialogue_routine_samedi:
    title: "Mathieu's Saturday routine"

teaching:
  fr.a1.unit10.lesson01.teach.se_reveiller:
    title: "To wake up"
    gloss: "to wake up"
    note: "Reflexive verb: *je me réveille*, *tu te réveilles*. The pronoun *me/te/se* always matches the subject."
    example_gloss: "I wake up at seven o'clock."
  fr.a1.unit10.lesson01.teach.se_lever:
    title: "To get up"
    gloss: "to get up"
    note: "Distinct from *se réveiller* (waking up mentally) -- *se lever* is the physical act of getting out of bed."
    example_gloss: "I get up right after that."
  fr.a1.unit10.lesson01.teach.prendre_une_douche:
    title: "To take a shower"
    gloss: "to take a shower"
    note: "*Prendre une douche* (literally \"to take a shower\") uses *prendre*, the same verb as for meals and transportation."
    example_gloss: "I take a shower in the morning."
  fr.a1.unit10.lesson01.teach.shabiller:
    title: "To get dressed"
    gloss: "to get dressed"
    note: "Another reflexive verb: *je m'habille*, with *m'* eliding before the vowel."
    example_gloss: "I get dressed before breakfast."
  fr.a1.unit10.lesson01.teach.le_petit_dejeuner:
    title: "Breakfast"
    gloss: "breakfast"
    note: "*Prendre le petit-déjeuner* (to have breakfast) reuses the same *prendre* pattern as *prendre une douche*."
    example_gloss: "I have breakfast at eight o'clock."
  fr.a1.unit10.lesson01.teach.quitter_la_maison:
    title: "To leave the house"
    gloss: "to leave the house"
    note: "*Quitter* here means \"to leave (a place)\" -- not to be confused with *partir*, which doesn't take a direct object."
    example_gloss: "I leave the house at nine o'clock."
  fr.a1.unit10.lesson01.teach.dabord_ensuite:
    title: "First... then..."
    gloss: "First I get up, then I get dressed."
    note: "*D'abord* (first) and *ensuite* (then) are the basic sequencing words for describing a routine step by step."

  fr.a1.unit10.lesson02.teach.rentrer:
    title: "To go back home"
    gloss: "to go back home"
    note: "*Rentrer* implies returning to one's own home, distinct from the more general *retourner* (to go back somewhere)."
    example_gloss: "I go back home after work."
  fr.a1.unit10.lesson02.teach.diner:
    title: "To have dinner"
    gloss: "to have dinner"
    note: "*Dîner* can be a verb (to have dinner) or a noun (*le dîner*, dinner) -- context tells them apart."
    example_gloss: "We have dinner together on Saturday evenings."
  fr.a1.unit10.lesson02.teach.se_coucher:
    title: "To go to bed"
    gloss: "to go to bed"
    note: "The natural end of the daily-routine sequence, paired with *se lever* at the start."
    example_gloss: "I go to bed around eleven o'clock."
  fr.a1.unit10.lesson02.teach.le_weekend:
    title: "The weekend"
    gloss: "the weekend"
    note: "*Le week-end* is a common English borrowing in French, spelled with a hyphen."
    example_gloss: "The workshop takes place on the weekend."
  fr.a1.unit10.lesson02.teach.dhabitude:
    title: "Usually"
    gloss: "usually"
    note: "*D'habitude* introduces a habitual routine, distinct from *aujourd'hui* (today) for a one-time event."
    example_gloss: "I usually get up at seven o'clock."
  fr.a1.unit10.lesson02.teach.ma_routine_du_samedi:
    title: "Describe a Saturday"
    gloss: "On Saturdays, I get up late, then I go to the market before the workshop."
    note: "Combines *d'abord/ensuite*-style sequencing (here with *puis*, \"then\") with the workshop's own established Saturday schedule."
  fr.a1.unit10.lesson02.teach.quest_ce_que_tu_fais:
    title: "What do you do?"
    gloss: "What do you do on Saturdays?"
    note: "*Qu'est-ce que tu fais... ?* is the standard informal way to ask what someone does -- introduced here so the next exercise can ask it directly."

  fr.a1.unit10.lesson03.teach.line01:
    title: "Ask about Saturday"
    gloss: "Inès asks Mathieu what he does on Saturdays before the workshop."
    note: "*Tu fais quoi... ?* is the natural informal way to ask \"what do you do... ?\", more casual than *Qu'est-ce que tu fais ?*"
  fr.a1.unit10.lesson03.teach.line02:
    title: "Describe waking up"
    gloss: "Mathieu says first, he wakes up late, around nine o'clock."
    note: "*Vers neuf heures* (around nine o'clock) reuses the *vers* + time pattern for an approximate time."
  fr.a1.unit10.lesson03.teach.line03:
    title: "Ask what's next"
    gloss: "Inès asks what happens next."
    note: "A short, natural follow-up question to keep a routine description going."
  fr.a1.unit10.lesson03.teach.line04:
    title: "Describe breakfast and the market"
    gloss: "Mathieu says next, he has breakfast and goes to the market."
    note: "Two connected actions joined with *et*, continuing the sequence started with *d'abord*."
  fr.a1.unit10.lesson03.teach.line05:
    title: "Ask about coming home"
    gloss: "Inès asks what time Mathieu gets back."
    note: "*Tu rentres à quelle heure ?* reuses this unit's *rentrer* in a direct question."
  fr.a1.unit10.lesson03.teach.line06:
    title: "Describe the afternoon"
    gloss: "Mathieu says he gets back around noon, and in the afternoon, he rests before the evening workshop."
    note: "*Se reposer* (to rest) is a new reflexive verb, introduced here in context -- comprehensible from the gloss alone."

exercises:
  fr.a1.unit10.lesson01.exercise01.select_se_lever:
    instruction: "Which phrase means \"to get up\"?"
    correct_option: "se lever"
    distractors: ["se réveiller", "se coucher"]
    accepted_answers: ["se lever"]

  fr.a1.unit10.lesson01.exercise02.listen_je_me_leve:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Je me lève."
    distractors: ["Je me réveille.", "Je me couche."]
    accepted_answers: ["Je me lève.", "Je me lève"]

  fr.a1.unit10.lesson01.exercise03.match_routine_words:
    instruction: "Match each French phrase to its English meaning."
    correct_response:
      "se réveiller": "to wake up"
      "se lever": "to get up"
      "prendre une douche": "to take a shower"
      "s'habiller": "to get dressed"
      "le petit-déjeuner": "breakfast"
      "quitter la maison": "to leave the house"

  fr.a1.unit10.lesson01.exercise04.order_je_me_reveille_sept:
    instruction: "Build the sentence: I wake up at seven o'clock."
    correct_response: ["Je", "me", "réveille", "à", "sept", "heures"]

  fr.a1.unit10.lesson01.exercise05.fill_douche:
    instruction: "Complete the sentence with the word for \"shower.\""
    accepted_answers: ["douche"]

  fr.a1.unit10.lesson01.exercise06.speak_morning_routine:
    instruction: "Describe your morning routine in three steps."
    accepted_answers:
      - "Je me réveille, je me lève, je m'habille."
      - "Je me réveille, puis je me lève, puis je m'habille."

  fr.a1.unit10.lesson02.exercise01.select_se_coucher:
    instruction: "Which phrase means \"to go to bed\"?"
    correct_option: "se coucher"
    distractors: ["se lever", "se réveiller"]
    accepted_answers: ["se coucher"]

  fr.a1.unit10.lesson02.exercise02.listen_je_dine:
    instruction: "Listen and select the sentence you hear."
    correct_option: "Je dîne."
    distractors: ["Je me couche.", "Je rentre."]
    accepted_answers: ["Je dîne.", "Je dîne"]

  fr.a1.unit10.lesson02.exercise03.match_evening_words:
    instruction: "Match each French phrase to its English meaning."
    correct_response:
      "rentrer à la maison": "to go back home"
      "dîner": "to have dinner"
      "se coucher": "to go to bed"
      "le week-end": "the weekend"
      "d'habitude": "usually"

  fr.a1.unit10.lesson02.exercise04.order_je_me_couche_vingt_trois:
    instruction: "Build the sentence: I go to bed around eleven o'clock."
    correct_response: ["Je", "me", "couche", "vers", "vingt-trois", "heures"]

  fr.a1.unit10.lesson02.exercise05.fill_dhabitude:
    instruction: "Complete the sentence with the word for \"usually.\""
    accepted_answers: ["habitude"]

  fr.a1.unit10.lesson02.exercise06.reply_saturday_routine:
    instruction: "Answer: describe your Saturday routine before the workshop."
    accepted_answers:
      - "Le samedi, je me lève tard, puis je vais au marché avant l'atelier."
      - "Le samedi je me lève tard, puis je vais au marché avant l'atelier."

  fr.a1.unit10.lesson03.exercise01.comprehend_wakeup_time:
    instruction: "Listen to the dialogue. What time does Mathieu wake up?"
    correct_option: "Around nine o'clock"
    distractors: ["Around seven o'clock", "Around eight o'clock"]
    accepted_answers: ["Around nine o'clock"]

  fr.a1.unit10.lesson03.exercise02.comprehend_return_time:
    instruction: "What time does Mathieu get back home?"
    correct_option: "Around noon"
    distractors: ["Around one o'clock", "Around ten o'clock"]
    accepted_answers: ["Around noon"]

  fr.a1.unit10.lesson03.exercise03.select_what_mathieu_does_after_breakfast:
    instruction: "What does Mathieu do after breakfast?"
    correct_option: "He goes to the market"
    distractors: ["He rests", "He calls Inès"]
    accepted_answers: ["He goes to the market"]

  fr.a1.unit10.lesson03.exercise04.order_ensuite_je_prends:
    instruction: "Build Mathieu's sentence about breakfast and the market."
    correct_response: ["je", "prends", "le", "petit-déjeuner", "et", "je", "vais", "au", "marché"]

  fr.a1.unit10.lesson03.exercise05.reply_afternoon_plan:
    instruction: "Take Mathieu's role. Say when you get back and what you do in the afternoon."
    accepted_answers:
      - "Je rentre vers midi, et l'après-midi, je me repose avant l'atelier du soir."
      - "Je rentre vers midi et l'après-midi je me repose avant l'atelier du soir."

  fr.a1.unit10.lesson03.exercise06.speak_describe_saturday:
    instruction: "Describe Mathieu's Saturday routine out loud."
    accepted_answers:
      - "Il se réveille, il va au marché, il se repose."
      - "Il se réveille, puis il va au marché, puis il se repose."
