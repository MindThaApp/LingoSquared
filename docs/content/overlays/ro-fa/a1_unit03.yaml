      status: correct
    feedback: صفر، یک، دو، سه، چهار، پنج numără de la 0 la 5, în ordine.
  fa.a1.unit03.lesson01.exercise04.match_low:
    instruction: Potrivește fiecare număr scris cu cuvinte cu cifra lui.
    accepted_answers:
    - value:
        صفر: '0'
        یک: '1'
        دو: '2'
        سه: '3'
        چهار: '4'
        پنج: '5'
        شش: '6'
      status: correct
    feedback: De la صفر până la شش sunt numerele de la 0 la 6.
    pairs:
