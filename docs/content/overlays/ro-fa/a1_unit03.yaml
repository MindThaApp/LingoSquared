      right: '0'
    - left: یک
      right: '1'
    - left: دو
      right: '2'
    - left: سه
      right: '3'
    - left: چهار
      right: '4'
    - left: پنج
      right: '5'
    - left: شش
      right: '6'
  fa.a1.unit03.lesson01.exercise05.match_high:
    instruction: Potrivește fiecare cuvânt cu sensul său.
    accepted_answers:
    - value:
        هفت: '7'
        هشت: '8'
        نه: '9'
        ده: '10'
        عدد: număr
        صفر: '0'
      status: correct
    feedback: هفت، هشت، نه، ده sunt numerele de la 7 la 10; عدد este cuvântul pentru „număr”; صفر este zero.
    pairs:
    - left: هفت
      right: '7'
    - left: هشت
      right: '8'
    - left: نه
      right: '9'
    - left: ده
      right: '10'
    - left: عدد
      right: număr
    - left: صفر
      right: '0'
  fa.a1.unit03.lesson01.exercise06.order_ascending:
    instruction: Aranjează-le de la cel mai mic la cel mai mare.
    accepted_answers:
    - value:
      - یک
      - دو
      - سه
      status: correct
    feedback: یک، دو، سه este ordinea crescătoare corectă.
  fa.a1.unit03.lesson01.exercise07.fill_seven:
    instruction: Completează cu cuvântul persan pentru 7.
    accepted_answers:
