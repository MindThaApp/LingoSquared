course:
  title: Persană A1
  description: Persană iraniană pentru începători, axată pe citirea scrierii, înțelegerea vorbirii de zi cu zi și conversații practice politicoase.
units:
  fa.a1.unit03.numbers:
    title: Numerele
lessons:
  fa.a1.unit03.lesson01.zero_to_ten:
    title: De la zero la zece
  fa.a1.unit03.lesson02.eleven_to_ninety_nine:
    title: De la unsprezece la nouăzeci și nouă
  fa.a1.unit03.lesson03.phone_numbers:
    title: Numerele de telefon
  fa.a1.unit03.lesson04.ages_and_quantities:
    title: Vârste și cantități
  fa.a1.unit03.lesson05.prices:
    title: Prețuri în tomani
  fa.a1.unit03.lesson06.dialogue_phone_numbers:
    title: Ne schimbăm numerele de telefon
teaching:
  fa.a1.unit03.lesson01.teach.adad:
    title: Număr
    gloss: număr
    note: عدد este cuvântul general pentru „număr”.
    example_gloss: Acesta este un număr.
  fa.a1.unit03.lesson01.teach.zero:
    title: Zero
    gloss: 0 — zero
    note: صفر se folosește pentru zero, inclusiv ca cifră într-un număr mai lung, de exemplu un număr de telefon.
    example_gloss: Zero este un număr.
  fa.a1.unit03.lesson01.teach.one:
    title: Unu
    gloss: 1 — unu
    note: یک înseamnă „unu”.
    example_gloss: Am o carte.
  fa.a1.unit03.lesson01.teach.two:
    title: Doi
    gloss: 2 — doi
    note: دو înseamnă „doi”.
    example_gloss: Am două mere.
  fa.a1.unit03.lesson01.teach.three:
    title: Trei
    gloss: 3 — trei
    note: سه înseamnă „trei”.
    example_gloss: El are trei frați.
  fa.a1.unit03.lesson01.teach.four:
    title: Patru
    gloss: 4 — patru
    note: چهار înseamnă „patru”.
    example_gloss: Este ora patru.
  fa.a1.unit03.lesson01.teach.five:
    title: Cinci
    gloss: 5 — cinci
    note: پنج înseamnă „cinci”.
    example_gloss: Așteptați cinci minute.
  fa.a1.unit03.lesson01.teach.six:
    title: Șase
    gloss: 6 — șase
    note: شش înseamnă „șase”.
    example_gloss: Sunt șase scaune.
  fa.a1.unit03.lesson01.teach.seven:
    title: Șapte
    gloss: 7 — șapte
    note: هفت înseamnă „șapte”.
    example_gloss: O săptămână are șapte zile.
  fa.a1.unit03.lesson01.teach.eight:
    title: Opt
    gloss: 8 — opt
    note: هشت înseamnă „opt”.
    example_gloss: Ne vedem la opt.
  fa.a1.unit03.lesson01.teach.nine:
    title: Nouă
    gloss: 9 — nouă
    note: نه înseamnă „nouă”. Este și cuvântul obișnuit pentru „nu”; contextul (de exemplu, când îl auzi într-o numărătoare sau într-un număr) arată care sens este cel potrivit.
    example_gloss: Aici sunt nouă elevi.
  fa.a1.unit03.lesson01.teach.ten:
    title: Zece
    gloss: 10 — zece
    note: ده înseamnă „zece”.
    example_gloss: Am zece degete.
  fa.a1.unit03.lesson02.teach.eleven:
    title: Unsprezece
    gloss: 11 — unsprezece
    note: یازده înseamnă „unsprezece”.
    example_gloss: La unsprezece am curs.
  fa.a1.unit03.lesson02.teach.twelve:
    title: Doisprezece
    gloss: 12 — doisprezece
    note: دوازده înseamnă „doisprezece”.
    example_gloss: Un an are douăsprezece luni.
  fa.a1.unit03.lesson02.teach.thirteen:
    title: Treisprezece
    gloss: 13 — treisprezece
    note: سیزده înseamnă „treisprezece”.
    example_gloss: Are treisprezece ani.
  fa.a1.unit03.lesson02.teach.fourteen:
    title: Paisprezece
    gloss: 14 — paisprezece
    note: چهارده înseamnă „paisprezece”.
    example_gloss: Vin peste paisprezece zile.
  fa.a1.unit03.lesson02.teach.fifteen:
    title: Cincisprezece
    gloss: 15 — cincisprezece
    note: پانزده înseamnă „cincisprezece”.
    example_gloss: Are cincisprezece cărți.
  fa.a1.unit03.lesson02.teach.sixteen:
    title: Șaisprezece
    gloss: 16 — șaisprezece
    note: شانزده înseamnă „șaisprezece”; nu poate fi dedus din شش („șase”) + ده („zece”), așa că merită învățat ca un cuvânt aparte.
    example_gloss: Are șaisprezece ani.
  fa.a1.unit03.lesson02.teach.seventeen:
    title: Șaptesprezece
    gloss: 17 — șaptesprezece
    note: هفده înseamnă „șaptesprezece”.
    example_gloss: Au venit șaptesprezece persoane.
  fa.a1.unit03.lesson02.teach.eighteen:
    title: Optsprezece
    gloss: 18 — optsprezece
    note: هجده înseamnă „optsprezece”.
    example_gloss: Are optsprezece ani.
  fa.a1.unit03.lesson02.teach.nineteen:
    title: Nouăsprezece
    gloss: 19 — nouăsprezece
    note: نوزده înseamnă „nouăsprezece”.
    example_gloss: Au mai rămas nouăsprezece zile.
  fa.a1.unit03.lesson02.teach.twenty:
    title: Douăzeci
    gloss: 20 — douăzeci
    note: بیست înseamnă „douăzeci”.
    example_gloss: Am douăzeci de cărți.
  fa.a1.unit03.lesson02.teach.thirty:
    title: Treizeci
    gloss: 30 — treizeci
    note: سی înseamnă „treizeci”.
    example_gloss: Luna aceasta are treizeci de zile.
  fa.a1.unit03.lesson02.teach.forty_to_ninety:
    title: De la patruzeci la nouăzeci
    gloss: 40, 50, 60, 70, 80, 90
    note: چهل، پنجاه، شصت، هفتاد، هشتاد، نود sunt celelalte zeci.
    example_gloss:
    - Are patruzeci de ani.
    - Sunt cincizeci de scaune.
    - Șaizeci de minute înseamnă o oră.
    - Cartea aceasta are șaptezeci de pagini.
    - El/ea are optzeci de cărți.
    - El/ea are nouăzeci de ani.
  fa.a1.unit03.lesson02.teach.combining:
    title: Combinarea zecilor cu unitățile
    gloss: douăzeci și cinci
    note: 'بیست و پنج este literal „douăzeci și cinci”: cuvântul pentru zeci, و, cuvântul pentru unități.'
  fa.a1.unit03.lesson03.teach.shomare:
    title: Număr (de identificare)
    gloss: număr
    note: شماره se folosește pentru un număr de identificare, precum numărul de telefon sau de casă, spre deosebire de sensul general de „număr” al lui عدد.
    example_gloss: Acesta este numărul meu de telefon.
  fa.a1.unit03.lesson03.teach.telefon:
    title: Telefon
    gloss: telefon
    note: تلفن acoperă telefoanele în general, inclusiv telefoanele mobile.
    example_gloss: Nu am telefon.
  fa.a1.unit03.lesson03.teach.digit_by_digit:
    title: Cere un număr de telefon
    gloss: Care este numărul tău de telefon?
    note: شماره تلفنتون چنده؟ este modul obișnuit și politicos de a cere un număr de telefon. Citirea numărului cifră cu cifră este mereu înțeleasă și este cea mai sigură metodă pentru începători; gruparea cifrelor este și ea normală în vorbirea reală, dar această lecție exersează mai întâi forma simplă, cifră cu cifră.
  fa.a1.unit03.lesson03.teach.chande:
    title: Cât / care este?
    gloss: care este? / cât costă?
    note: چنده؟ este forma contrasă a lui چند است și cere un număr, o cantitate sau un preț, în funcție de context.
  fa.a1.unit03.lesson03.teach.read_number:
    title: Citește un număr cifră cu cifră
    gloss: zero, nouă, unu, doi, trei, patru, cinci, șase, șapte, opt, opt
    note: Această lecție exersează citirea numerelor cifră cu cifră. Un număr real de mobil din Iran are 11 cifre și începe cu 0, de exemplu 0912 345 6788.
  fa.a1.unit03.lesson04.teach.sal:
    title: An
    gloss: an
    note: سال se folosește atât pentru anii calendaristici, cât și pentru a spune vârsta cuiva.
    example_gloss: Am douăzeci de ani.
  fa.a1.unit03.lesson04.teach.man_recap:
    title: Eu (recapitulare)
    gloss: eu
    note: O scurtă reamintire a lui من, necesar aici pentru a-ți spune vârsta într-o propoziție completă.
  fa.a1.unit03.lesson04.teach.chand_saale:
    title: Întreabă pe cineva câți ani are (informal)
    gloss: Câți ani ai?
    note: چند سالته؟ este forma informală de singular; چند سالتونه؟ este echivalentul politicos.
  fa.a1.unit03.lesson04.teach.salame:
    title: Spui câți ani ai
    gloss: Am 25 de ani.
    note: سالمه atașează direct la سال terminația posesivă ـم („meu”), apoi adaugă copula colocvială ـه („este”) — literal „anul-meu-este”.
  fa.a1.unit03.lesson04.teach.ta:
    title: Clasificator de numărare
    gloss: (cuvânt de numărare, fără echivalent direct în română)
    note: 'تا este clasificatorul general folosit la numărarea majorității obiectelor: număr + تا + substantiv.'
  fa.a1.unit03.lesson04.teach.sib:
    title: Măr
    gloss: măr
    note: سیب înseamnă măr.
    example_gloss: Îmi plac merele.
  fa.a1.unit03.lesson04.teach.ketab:
    title: Carte
    gloss: carte
    note: کتاب înseamnă carte.
    example_gloss: Aceasta este o carte bună.
  fa.a1.unit03.lesson04.teach.do_ta_sib:
    title: Cere o cantitate
    gloss: Aș vrea două mere.
    note: دو تا سیب می‌خوام pune cantitatea numărată înaintea substantivului, ca de obicei cu تا.
  fa.a1.unit03.lesson05.teach.gheymat:
    title: Preț
    gloss: preț
    note: قیمت este cuvântul general pentru preț.
    example_gloss: Care este prețul acestuia?
  fa.a1.unit03.lesson05.teach.toman:
    title: Toman
    gloss: toman (moneda iraniană, uz cotidian)
    note: Moneda oficială a Iranului este rialul, dar prețurile rostite zilnic sunt aproape întotdeauna date în tomani (1 toman = 10 riali).
    example_gloss: Acesta costă zece mii de tomani.
  fa.a1.unit03.lesson05.teach.hezar:
    title: Mie
    gloss: mie
    note: هزار înseamnă mie; prețurile se spun de obicei în mii de tomani.
    example_gloss: Am o mie de tomani.
  fa.a1.unit03.lesson05.teach.ask_price:
    title: Întreabă un preț
    gloss: Cât costă asta?
    note: این چنده؟ este modul obișnuit de a întreba prețul unui lucru aflat în fața ta.
  fa.a1.unit03.lesson05.teach.price_answer:
    title: Spune un preț
    gloss: Costă 30.000 de tomani.
    note: تومنه este forma contrasă a lui تومن است; tiparul complet este număr + هزار + تومنه.
  fa.a1.unit03.lesson06.teach.practice_together:
    title: Sara propune să exerseze împreună
    gloss: Sara spune că vrea să exerseze împreună farsi și o întreabă pe Mina numărul de telefon.
    note: باهم înseamnă „împreună”; می‌خوام ... تمرین کنیم înseamnă „vreau să exersăm”; تمرین کنیم singur, ca întrebare, poate însemna și „să exersăm?”
  fa.a1.unit03.lesson06.teach.mina_gives_number:
    title: Mina își spune numărul
    gloss: Mina acceptă și își citește numărul de 11 cifre, cifră cu cifră.
    note: شماره‌ام este forma contrasă a lui شماره من; هشته este forma contrasă a lui هشت است și încheie șirul.
  fa.a1.unit03.lesson06.teach.sara_confirms:
    title: Sara verifică dacă a notat corect
    gloss: Sara îi cere Minei să aștepte până scrie numărul, apoi îl citește înapoi pentru confirmare.
    note: درسته؟ („e corect?”) este o modalitate frecventă de a verifica un număr sau un fapt pe care tocmai l-ai auzit.
  fa.a1.unit03.lesson06.teach.mina_confirms_asks:
    title: Mina confirmă și întreabă la rândul ei
    gloss: Mina confirmă că e corect și îi cere numărul Sarei.
    note: آره este un „da” informal, mai familiar decât بله.
  fa.a1.unit03.lesson06.teach.sara_gives_number:
    title: Sara își spune numărul
    gloss: Sara își citește propriul număr de 11 cifre, cifră cu cifră.
    note: یکه este forma contrasă a lui یک است și încheie șirul, la fel cum هشته a încheiat numărul Minei.
  fa.a1.unit03.lesson06.teach.mina_will_call:
    title: Mina acceptă să sune
    gloss: Mina spune că o sună pe Sara mâine.
    note: زنگ می‌زنم بهت înseamnă „te sun” — literal „lovesc soneria către tine”.
