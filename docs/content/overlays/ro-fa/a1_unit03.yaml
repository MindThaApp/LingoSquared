      status: correct
    feedback: ۷ este هفت.
  fa.a1.unit03.lesson01.exercise08.translate_nine:
    instruction: 'Tradu în farsi: nouă.'
    accepted_answers:
    - value: نه
      status: correct
    feedback: نه înseamnă nouă.
  fa.a1.unit03.lesson02.exercise01.recognize_bist:
    instruction: Alege sensul lui بیست.
    correct_option: douăzeci
    distractors:
    - doisprezece
    - zece
    - două
