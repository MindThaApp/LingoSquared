course:
  title: Persană A1
  description: 'Persană iraniană pentru începători: descrierea simptomelor de bază, cererea de ajutor, înțelegerea unor sfaturi simple despre sănătate, citirea unei scurte note despre simptome și un dialog în care un prieten dă sfaturi.'
