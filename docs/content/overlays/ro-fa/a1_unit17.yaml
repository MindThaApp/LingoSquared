    title: El/ea are
    gloss: el/ea are
    note: داره este forma colocvială de persoana a treia a lui دارد („are”) – urmează modelul lui دارم de la persoana întâi.
    target_text: داره (el/ea are, persoana a treia, colocvial)
  fa.a1.unit17.lesson06.teach.dialogue_line1:
    title: Nima spune
    gloss: Nu mă simt bine. Am dureri de cap și febră.
  fa.a1.unit17.lesson06.teach.dialogue_line2:
