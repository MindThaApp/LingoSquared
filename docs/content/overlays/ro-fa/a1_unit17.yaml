  fa.a1.unit17.lesson02.teach.khastam_word:
    title: Sunt obosit
    gloss: sunt obosit(ă)
    note: '*خسته‌ام* înseamnă „sunt obosit(ă)”: terminația *-ام* este forma scurtă a lui *هستم* (sunt), atașată la *خسته* (obosit).'
    example_gloss: Azi sunt obosit(ă).
  fa.a1.unit17.lesson03.teach.komak_word:
    title: Ajutor
    gloss: ajutor
    note: کمک înseamnă ajutor.
    example_gloss: Mă poți ajuta?
