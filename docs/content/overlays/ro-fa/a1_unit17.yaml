    title: Exemplu de notă despre simptome
    gloss: Am dureri de cap și febră. Sunt obosit(ă).
    note: O scurtă notă la persoana întâi, care combină vocabularul de simptome din această unitate.
  fa.a1.unit17.lesson06.teach.names:
    title: Nima și Sara
    gloss: Nima, Sara
    note: Nume iraniene frecvente, folosite în tot cursul.
    example_gloss:
    - Nima are dureri de cap.
    - Sara îl ajută pe Nima.
  fa.a1.unit17.lesson06.teach.ham_word:
    title: De asemenea / și
    gloss: și / de asemenea
    note: هم înseamnă „și, de asemenea” și se pune după cuvântul pe care îl determină (آب هم بخور = bea și apă).
    target_text: هم (și, de asemenea)
  fa.a1.unit17.lesson06.teach.bashe_word:
    title: Bine
    gloss: bine
    note: باشه este forma colocvială contrasă a lui باشد („bine / de acord”).
    example_gloss: Bine, mă odihnesc.
