    title: Tu poți
    gloss: poți
    note: می‌تونی este forma colocvială contrasă a lui می‌توانی („poți”), persoana a doua informală.
    target_text: می‌تونی (poți, informal)
  fa.a1.unit17.lesson03.teach.komakam_koni_phrase:
    title: Mă poți ajuta?
    gloss: Mă poți ajuta?
    note: '*می‌تونی کمکم کنی؟* îmbină *می‌تونی* („poți”) cu *کمکم کنی* (literal „faci ajutorul meu”, adică „mă ajuți”).'
