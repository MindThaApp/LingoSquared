    gloss: odihnește-te
    note: استراحت کن este imperativul informal – odihnește-te!
  fa.a1.unit17.lesson04.teach.ab_bokhor_phrase:
    title: Bea apă (imperativ)
    gloss: bea apă
    note: آب بخور este imperativul informal – bea apă!
