  fa.a1.unit17.lesson01.teach.daram_word:
    title: Eu am
    gloss: am
    note: دارم înseamnă „am” și se folosește cu un substantiv care denumește un simptom (سردرد دارم = Am dureri de cap).
    target_text: دارم (am / am în posesie)
  fa.a1.unit17.lesson01.teach.tab_word:
    title: Febră
    gloss: febră
    note: تب înseamnă febră.
    example_gloss: Am febră.
