teaching:
  fa.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: Îmi place
    gloss: îmi place
    note: دوست دارم înseamnă literal „am prietenie (cu el)” -- modul standard de a spune „îmi place”.
  fa.a1.unit14.lesson01.teach.ghahve_word:
    title: Cafea
    gloss: cafea
    note: قهوه înseamnă cafea.
    example_gloss: Îmi place cafeaua.
  fa.a1.unit14.lesson01.teach.chay_word:
    title: Ceai
    gloss: ceai
    note: چای înseamnă ceai.
    example_gloss: Nu-mi place ceaiul.
  fa.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: Nu-mi place
    gloss: nu-mi place
    note: دوست ندارم este negativul lui دوست دارم.
  fa.a1.unit14.lesson01.teach.man_word:
    title: eu
    gloss: eu
    note: من înseamnă „eu” -- adesea opțional, fiindcă terminația verbului arată deja subiectul, dar poate fi adăugat pentru accent.
    example_gloss: Îmi place muzica.
  fa.a1.unit14.lesson02.teach.kodum_word:
    title: Care
    gloss: care
    note: کدوم înseamnă „care” (dintre ele).
    example_gloss: Pe care îl preferi?
  fa.a1.unit14.lesson02.teach.moosighi_word:
    title: Muzică
    gloss: muzică
    note: موسیقی înseamnă muzică.
    example_gloss: Îmi place muzica.
  fa.a1.unit14.lesson02.teach.mikhay_word:
    title: Tu vrei
    gloss: vrei
    note: می‌خوای este forma colocvială, informală, de persoana a II-a a lui می‌خواهی (vrei).
    target_text: می‌خوای (vrei, informal)
  fa.a1.unit14.lesson02.teach.kodum_ro_question:
    title: Pe care îl preferi?
    gloss: Pe care îl preferi?
    note: کدوم رو دوست داری؟ -- رو marchează complementul direct (colocvial pentru را), iar داری este persoana a II-a a verbului داشتن (a avea).
  fa.a1.unit14.lesson03.teach.bishtar_word:
    title: Mai mult
    gloss: mai mult
    note: بیشتر înseamnă „mai mult”.
    example_gloss: Îmi place mai mult cafeaua.
  fa.a1.unit14.lesson03.teach.ya_word:
    title: Sau
    gloss: sau
    note: یا înseamnă „sau” și se folosește pentru a oferi o alegere între două lucruri.
    target_text: یا (sau)
  fa.a1.unit14.lesson03.teach.ghahve_ya_chay_question:
    title: Cafea sau ceai?
    gloss: Cafea sau ceai?
    note: قهوه یا چای؟ oferă o alegere între cele două băuturi învățate în lecția 1.
  fa.a1.unit14.lesson04.teach.choon_word:
    title: Pentru că
    gloss: pentru că
    note: چون introduce un motiv.
    target_text: چون (pentru că)
  fa.a1.unit14.lesson04.teach.khoshmaze_word:
    title: E delicios
    gloss: e delicios
    note: خوشمزه‌ست este forma colocvială contrasă a lui خوشمزه است (este delicios).
    example_gloss: Cafeaua este delicioasă.
  fa.a1.unit14.lesson04.teach.jaleb_word:
    title: E interesant
    gloss: e interesant
    note: جالبه este forma colocvială contrasă a lui جالب است (este interesant).
    example_gloss: Muzica aceasta este interesantă.
  fa.a1.unit14.lesson04.teach.va_word:
    title: Și
    gloss: și
    note: '*و* înseamnă „și” și poate lega două afirmații scurte, de exemplu când spui că îți place ceva și îl descrii. Este mai lax decât *چون* (pentru că), care dă motivul direct.'
    target_text: و (și)
  fa.a1.unit14.lesson05.teach.sara_name:
    title: Sara
    gloss: Sara
    note: Un nume feminin frecvent în Iran.
    example_gloss: Sarei îi place ceaiul.
  fa.a1.unit14.lesson05.teach.dareh_grammar:
    title: Îi place
    gloss: îi place
    note: داره este forma colocvială de persoana a III-a a lui دارد (are) -- دوست داره înseamnă „îi place”, după modelul lui دوست دارم la persoana I.
    target_text: دوست داره (îi place, persoana a III-a colocvială)
  fa.a1.unit14.lesson05.teach.nadareh_grammar:
    title: Nu îi place
    gloss: nu-i place
    note: نداره este negativul colocvial de persoana a III-a -- دوست نداره înseamnă „nu-i place”.
    target_text: دوست نداره (nu-i place, persoana a III-a colocvială)
  fa.a1.unit14.lesson05.teach.garme_word:
    title: E cald
    gloss: e cald
    note: گرمه este forma colocvială contrasă a lui گرم است (este cald).
    example_gloss: Ceaiul este cald.
  fa.a1.unit14.lesson05.teach.reading_text:
    title: Text-model despre preferințe
    gloss: Sarei îi place ceaiul pentru că este cald. Sarei nu-i place muzica.
    note: O scurtă relatare la persoana a treia, care combină vocabularul de preferințe al acestei unități.
  fa.a1.unit14.lesson06.teach.names:
    title: Nima și Sara
    gloss: Nima, Sara
    note: Nume iraniene frecvente, folosite în tot acest curs.
    example_gloss:
    - Lui Nima îi place ceaiul.
    - Sarei îi place cafeaua.
  fa.a1.unit14.lesson06.teach.to_chi_phrase:
    title: Dar tu?
    gloss: Dar tu?
    note: تو چی؟ este un mod scurt și frecvent de a întoarce întrebarea către interlocutor.
  fa.a1.unit14.lesson06.teach.aalie_word:
    title: Este grozav
    gloss: este grozav
    note: عالیه este forma colocvială contrasă a lui عالی است (este grozav).
    example_gloss: Asta este grozav.
  fa.a1.unit14.lesson06.teach.dialogue_line1:
    title: Nima întreabă
    gloss: Ceai sau cafea, pe care o preferi?
  fa.a1.unit14.lesson06.teach.dialogue_line2:
    title: Sara răspunde
    gloss: Eu prefer cafeaua pentru că este delicioasă. Dar tu?
  fa.a1.unit14.lesson06.teach.dialogue_line3:
    title: Nima răspunde
    gloss: Îmi place ceaiul pentru că este cald.
  fa.a1.unit14.lesson06.teach.dialogue_line4:
    title: Sara reacționează
    gloss: Grozav!
