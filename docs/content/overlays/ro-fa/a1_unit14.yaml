course:
  title: Persană A1
  description: 'Persană iraniană pentru începători: exprimarea preferințelor și a antipatiilor, întrebări despre preferințe, alegerea între opțiuni, motive simple și o scurtă lectură/un dialog despre preferințele a două persoane.'
units:
