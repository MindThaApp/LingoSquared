  fa.a1.unit22.lesson05.ending_a_call:
    title: Încheierea unui apel
  fa.a1.unit22.lesson06.phone_dialogue:
    title: O convorbire telefonică completă
teaching:
  fa.a1.unit22.lesson01.teach.phone_word:
    title: Telefon
    gloss: telefon
    note: تلفن este cuvântul general pentru telefon.
    example_gloss: Unde mi-e telefonul?
  fa.a1.unit22.lesson01.teach.message_word:
    title: Mesaj
    gloss: mesaj
    note: پیام este un mesaj scris (text).
    example_gloss: Am un mesaj.
  fa.a1.unit22.lesson01.teach.call_word:
    title: A suna
    gloss: a suna
    note: زنگ زدن (literal „a suna”) este verbul obișnuit pentru a telefona cuiva.
    example_gloss: Sună-mă.
  fa.a1.unit22.lesson01.teach.voice_word:
    title: Voce
    gloss: voce
    note: صدا înseamnă voce și se folosește pentru a descrie cum se aude cineva la telefon.
    example_gloss: Vocea ta sună bine.
  fa.a1.unit22.lesson01.teach.va_word:
    title: Și
    gloss: și
    note: و este cuvântul obișnuit de legătură („și”), recapitulare din unitățile anterioare.
    target_text: و (și)
  fa.a1.unit22.lesson02.teach.hello_phone:
    title: Alo (la telefon)
    gloss: alo, te ascult
    note: الو este formula de salut specifică telefonului (nu se folosește față în față); بفرمایید înseamnă aici „spune, te ascult”.
  fa.a1.unit22.lesson02.teach.its_me:
    title: Eu sunt, Narges
    gloss: salut, eu sunt Narges
    note: '*منم* este *من* („eu”) plus terminația verbală -م („sunt”), deci înseamnă „eu sunt” -- o modalitate foarte frecventă de a te identifica la telefon. (Aceeași grafie poate însemna și „și eu”, care se scrie *من هم*; aici contextul clarifică sensul.)'
  fa.a1.unit22.lesson03.teach.can_you_repeat:
    title: Poți repeta asta?
    gloss: puteți repeta, vă rog?
    note: می‌شه (colocvial pentru می‌شود, „se poate”) + تکرار کنید („repetați”) este formula politicoasă standard pentru această rugăminte.
  fa.a1.unit22.lesson03.teach.speak_slower:
    title: Vă rog, vorbiți mai rar
    gloss: vă rog, vorbiți mai rar
    note: آهسته‌تر este comparativul lui آهسته („rar, încet”) -- „mai rar, mai încet”.
  fa.a1.unit22.lesson04.teach.message_for_you:
    title: Am un mesaj pentru tine
    gloss: am un mesaj pentru tine
    note: برات este forma contrasă a lui برای („pentru”) + ت („tu”, informal).
  fa.a1.unit22.lesson04.teach.tomorrow_four:
    title: Vino mâine la cafenea, la ora patru
    gloss: vino mâine la cafenea, la ora patru
    note: بیا este imperativul informal, format din radicalul simplu al verbului آمدن („a veni”), același tipar întâlnit la alte imperative din A1.
  fa.a1.unit22.lesson05.teach.goodbye_call:
    title: La revedere, vorbim mai târziu
    gloss: la revedere, vorbim mai târziu
    note: 'بعداً înseamnă „mai târziu”; صحبت می‌کنیم este prezentul cu sens de viitor: „vorbim / vom vorbi”.'
  fa.a1.unit22.lesson05.teach.better_now:
    title: Se aude mai bine acum?
    gloss: se aude mai bine acum?
    note: الان înseamnă „acum”; بهتر شد este literal „a devenit mai bine”, formularea naturală la trecut pe care persana o folosește pentru această verificare, spre deosebire de româna, care folosește aici prezentul.
  fa.a1.unit22.lesson06.teach.how_are_you:
    title: Salut, Narges, ce mai faci?
    gloss: salut, Narges, ce mai faci?
    note: '*چطوری* este forma informală pentru „ce mai faci?”, potrivită aici pentru că Ali și Narges sunt prieteni.'
  fa.a1.unit22.lesson06.teach.cutting_out:
    title: Vocea ta se aude întrerupt
    gloss: vocea ta se aude întrerupt
    note: قطع و وصل می‌شه înseamnă literal „se întrerupe și se reconectează” -- expresia persană firească pentru o legătură telefonică proastă.
  fa.a1.unit22.lesson06.teach.turn01:
    title: Ali răspunde
    gloss: 'Ali: Alo, te ascult.'
  fa.a1.unit22.lesson06.teach.turn02:
    title: Narges se prezintă
    gloss: 'Narges: Salut, Ali, eu sunt Narges.'
  fa.a1.unit22.lesson06.teach.turn03:
    title: Ali o salută la rândul lui
    gloss: 'Ali: Salut, Narges, ce mai faci?'
  fa.a1.unit22.lesson06.teach.turn04:
    title: Narges îl roagă să vorbească mai rar
    gloss: 'Narges: Bine, mulțumesc. Ai putea să vorbești, te rog, mai rar? Vocea ta se aude întrerupt.'
  fa.a1.unit22.lesson06.teach.turn05:
    title: Ali verifică
    gloss: 'Ali: Bine, se aude mai bine acum?'
  fa.a1.unit22.lesson06.teach.turn06:
    title: Narges transmite mesajul
    gloss: 'Narges: Da, mai bine. Am un mesaj pentru tine: vino mâine la cafenea, la ora patru.'
  fa.a1.unit22.lesson06.teach.they_go:
    title: Ei merg (informal)
    gloss: ei merg (formă vorbită)
    note: '*می‌رن* este forma colocvială, vorbită, a lui *می‌روند* (ei merg), în același registru colocvial ca restul cursului.'
    target_text: می‌رن (ei merg, informal/colocvial)
  fa.a1.unit22.lesson06.teach.turn07:
    title: Ali confirmă
    gloss: 'Ali: Bine, sigur vin.'
  fa.a1.unit22.lesson06.teach.turn08:
    title: Narges încheie convorbirea
    gloss: 'Narges: La revedere, vorbim mai târziu.'
  fa.a1.unit22.lesson06.teach.turn09:
    title: Ali își ia la revedere
    gloss: 'Ali: La revedere.'
