course:
  title: Persană A1
  description: 'Persană iraniană pentru începători: vocabular despre telefon, cum răspunzi la un apel, cum ceri cuiva să repete sau să vorbească rar, cum citești un mesaj scurt și cum închei politicos o convorbire.'
units:
