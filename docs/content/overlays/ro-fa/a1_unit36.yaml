teaching:
  fa.a1.unit36.lesson01.teach.mehrabun:
    title: Amabil
    gloss: amabil / prietenos
    note: '*مهربون* descrie o persoană amabilă sau cu suflet cald.'
    example_gloss: Sara este foarte amabilă.
  fa.a1.unit36.lesson01.teach.bamaze:
    title: Amuzant
    gloss: amuzant
    note: '*بامزه* descrie o persoană nostimă sau amuzantă.'
    example_gloss: Nima este nostim.
  fa.a1.unit36.lesson01.teach.khejalati:
    title: Timid
    gloss: timid
    note: '*خجالتی* descrie o persoană timidă.'
    example_gloss: El/Ea este puțin timid/timidă.
  fa.a1.unit36.lesson01.teach.jeddi:
    title: Serios
    gloss: serios
    note: '*جدی* descrie o persoană serioasă.'
    example_gloss: Profesorul nostru este serios.
  fa.a1.unit36.lesson01.teach.review_copula_fusion:
    title: Cum se leagă „este” fuzionat de cuvintele despre personalitate
    gloss: el/ea este amabil / nostim / timid (copulă fuzionată)
    note: '*مهربونه* îl fuzionează direct pe *است* cu *مهربون*, deoarece *مهربون* se termină în consoană. *بامزه‌ست* folosește un ZWNJ scris înainte de *ست*, deoarece *بامزه* se termină deja în vocala *ه*. *خجالتیه* adaugă *ه* direct după un cuvânt terminat în *ی*, ca în *قهوه‌ایه* din unitatea despre aspect.'
    target_text: مهربونه = مهربون + است („este” fuzionat, cuvânt terminat în consoană) / بامزه‌ست = بامزه + است (cuvânt terminat în vocală, cu ZWNJ) / خجالتیه = خجالتی + ه (cuvânt terminat în ی)
  fa.a1.unit36.lesson02.teach.zerang:
    title: Isteț
    gloss: isteț / deștept
    note: '*زرنگ* descrie o persoană isteață sau deșteaptă, mai ales ingenioasă în plan practic.'
    example_gloss: Maryam este foarte isteață.
  fa.a1.unit36.lesson02.teach.tanbal:
    title: Leneș
    gloss: leneș
    note: '*تنبل* descrie o persoană leneșă.'
    example_gloss: Azi sunt puțin leneș.
  fa.a1.unit36.lesson02.teach.zahmatkesh:
    title: Muncitor
    gloss: muncitor
    note: '*زحمت‌کش* descrie o persoană care muncește mult și se străduiește cu adevărat.'
    example_gloss: Tatăl meu este foarte muncitor.
  fa.a1.unit36.lesson02.teach.sabur:
    title: Răbdător
    gloss: răbdător
    note: '*صبور* descrie o persoană răbdătoare.'
    example_gloss: Profesorul nostru este foarte răbdător.
  fa.a1.unit36.lesson02.teach.review_negation:
    title: Negarea unei trăsături de personalitate
    gloss: el/ea nu este leneș/leneșă
    note: '*نیست* neagă copula fuzionată: *تنبل نیست* înseamnă „el/ea nu este leneș/leneșă”, același *نیست* pe care l-ai învățat deja pentru negarea stărilor.'
    target_text: تنبل نیست (el/ea nu este leneș/leneșă) -- نیست neagă copula fuzionată
  fa.a1.unit36.lesson03.teach.shakhsiat_word:
    title: Personalitatea
    gloss: personalitate
    note: '*شخصیت* înseamnă „personalitate” sau „caracter”.'
    example_gloss: Personalitatea lui/ei este foarte bună.
  fa.a1.unit36.lesson03.teach.ask_shakhsiat:
    title: Cum este personalitatea lui/ei?
    gloss: Cum este personalitatea lui/ei?
    note: '*چطوره؟* („cum este...?”) l-ai învățat deja în unitatea despre saluturi; *ش* este sufixul posesiv „lui/ei”, atașat la *شخصیت* („personalitate”).'
  fa.a1.unit36.lesson03.teach.answer_mehrabun_zerang:
    title: El/Ea este foarte amabil/amabilă și isteț/istea
    gloss: El/Ea este foarte amabil/amabilă și isteț/istea
    note: '*و* înseamnă „și” și leagă două cuvinte despre personalitate.'
  fa.a1.unit36.lesson03.teach.che_joriye:
    title: Cum este el/ea ca om?
    gloss: Cum este el/ea ca om?
    note: '*چه جوریه؟* este o formulă informală des folosită pentru a întreba „cum este el/ea ca om”, o alternativă la *شخصیتش چطوره؟*.'
  fa.a1.unit36.lesson03.teach.review_shakhsiat_words:
    title: Personalitate / cum este...? / cum e...?
    gloss: personalitate / cum este...? / cum este ca om...?
    note: Aceste trei expresii te ajută să întrebi despre personalitatea cuiva și să o numești.
    target_text: شخصیت (personalitate) / چطوره؟ (cum este...?) / چه جوریه؟ (cum este...? / cum e ca om?)
  fa.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Nima / Sara / Maryam / deloc / doar / mișto
    gloss: Nima / Sara / Maryam / deloc / doar / mișto
    note: '*مریم* este prietena *سارا*, introdusă deja în unitatea despre aspect. *اصلاً* înseamnă „deloc”. *فقط* înseamnă „doar”. *باحال* înseamnă „mișto / simpatic”.'
  fa.a1.unit36.lesson04.teach.get_to_know:
    title: Aș vrea s-o cunosc mai bine
    gloss: Aș vrea s-o cunosc mai bine
    note: '*بیشتر* înseamnă „mai mult”. *باهاش* înseamnă „cu el/ea”. *آشنا بشم* înseamnă „să fac cunoștință / să cunosc”.'
  fa.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Nima: Sara, cum este Maryam?'
    gloss: Sara, cum este Maryam?
  fa.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Sara: Este foarte amabilă și isteață.'
    gloss: Este foarte amabilă și isteață.
  fa.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Nima: Nu e leneșă?'
    gloss: Nu e leneșă?
  fa.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Sara: Nu, deloc, este și foarte muncitoare. Doar că e puțin timidă.'
    gloss: Nu, deloc, este și foarte muncitoare. Doar că e puțin timidă.
  fa.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Nima: Mișto, aș vrea s-o cunosc mai bine.'
    gloss: Mișto, aș vrea s-o cunosc mai bine.
  fa.a1.unit36.lesson05.teach.reading_text:
    title: 'Lectură: Personalitatea lui Maryam'
    gloss: Maryam este prietena Sarei. Este foarte amabilă și isteață. Este muncitoare și la serviciu și nu este niciodată leneșă. Doar că e puțin timidă, de aceea nu vorbește prea mult în grupurile mari.
    note: Textul descrie personalitatea lui Maryam la persoana a treia, cu aceleași trăsături din dialog.
  fa.a1.unit36.lesson05.teach.reading_note:
    title: Niciodată (cu verb negativ)
    gloss: niciodată
    note: '*هیچ‌وقت* se folosește cu un verb la forma negativă (*نیست*, *نمی‌زنه*) și înseamnă „niciodată”, un tipar cu negație dublă, ca și în română („nu... niciodată”).'
  fa.a1.unit36.lesson06.teach.self_description:
    title: Cred că sunt foarte muncitor, dar sunt și puțin leneș
    gloss: Cred că sunt foarte muncitor, dar sunt și puțin leneș
    note: '*فکر می‌کنم* înseamnă „cred”. *زحمت‌کشم* fuzionează *زحمت‌کش* + *هستم* („sunt”). *هستم* este forma completă, nefuzionată, a lui „sunt”, folosită aici după *هم* („și / de asemenea”) pentru accent.'
  fa.a1.unit36.lesson06.teach.friend_request:
    title: Cum e personalitatea ta?
    gloss: Cum e personalitatea ta?
    note: '*شخصیتت* atașează sufixul posesiv informal *ت* („tău/ta”) la *شخصیت*, varianta pentru *تو* a lui *شخصیتش*.'
  fa.a1.unit36.lesson06.teach.review_trait_words:
    title: Amabil / nostim / timid / serios / isteț / leneș / muncitor / răbdător
    gloss: amabil / nostim / timid / serios / isteț / leneș / muncitor / răbdător
    note: Acestea sunt cele opt cuvinte de bază despre personalitate din această unitate.
