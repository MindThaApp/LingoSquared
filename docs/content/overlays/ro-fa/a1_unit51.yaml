  description: 'Persana iraniană pentru începători: cumpărarea unui bilet de cinema de la casierie, întrebarea despre proiecție și confirmarea prețului, întrebarea dacă filmul începe la o anumită oră, o scurtă părere despre film după aceea, plus citirea și scrierea unui panou scurt de cinema cu proiecția și prețul biletului.'
