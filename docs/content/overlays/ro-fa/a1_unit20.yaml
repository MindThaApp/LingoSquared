  fa.a1.unit20.lesson06.teach.turn04:
    title: Nima spune mărimea și cere să o probeze
    gloss: Mărimea medie. Pot s-o probez?
  fa.a1.unit20.lesson06.teach.turn05:
    title: Vânzătorul este de acord
    gloss: Da, poftiți.
  fa.a1.unit20.lesson06.teach.turn06:
    title: Nimei îi place și întreabă prețul
