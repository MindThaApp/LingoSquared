    gloss: pantofi
    note: کفش înseamnă pantofi.
    example_gloss: Aveți pantofi?
  fa.a1.unit20.lesson01.teach.jacket_word:
    title: Sacou
    gloss: jachetă
    note: کت înseamnă sacou (de costum sau blazer); un palton gros de iarnă se numește de obicei altfel.
    example_gloss: Vreau un sacou.
  fa.a1.unit20.lesson01.teach.nice_word:
    title: Frumos / drăguț
    gloss: frumos
    note: قشنگ este un cuvânt obișnuit, de zi cu zi, pentru „frumos/drăguț”, adesea folosit cu forma contrasă -e (قشنگه).
    example_gloss: Acest sacou este frumos.
  fa.a1.unit20.lesson01.teach.want_word:
    title: Vreau (recapitulare)
    gloss: vreau
    note: '*می‌خوام* este forma vorbită obișnuită a lui *می‌خواهم*. Ai întâlnit-o într-o unitate anterioară; aici este folosită des pentru a cere haine.'
    target_text: می‌خوام (vreau)
  fa.a1.unit20.lesson01.teach.va_word:
    title: Și (recapitulare)
    gloss: și
    note: '*و* este cuvântul obișnuit de legătură pentru „și”, recapitulat dintr-o unitate anterioară.'
    target_text: و (și)
  fa.a1.unit20.lesson02.teach.color_word:
    title: Culoare
    gloss: culoare
    note: رنگ este cuvântul general pentru culoare.
    example_gloss: Ce culoare doriți?
