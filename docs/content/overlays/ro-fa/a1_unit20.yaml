    title: Da, poftiți
    gloss: Da, poftiți.
    note: '*بله، بفرمایید* este un mod politicos prin care vânzătorul își dă acordul, reluând *بفرمایید* dintr-o unitate anterioară.'
  fa.a1.unit20.lesson04.teach.contraction_note:
    title: Forma contrasă colocvială می‌تونم (recapitulare)
    gloss: pot (formă vorbită)
    note: 'În vorbirea de zi cu zi, scrierea -ان- devine adesea -ون-: *می‌توانم* devine *می‌تونم* (pot). Ai întâlnit aceeași schimbare în *تومن*, forma vorbită a lui *تومان*.'
