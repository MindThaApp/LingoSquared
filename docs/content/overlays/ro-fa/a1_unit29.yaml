course:
  title: Persană A1
  description: 'Persana iraniană pentru începători: denumirea dispozitivelor de zi cu zi (telefon, calculator, internet, aplicație), acțiuni cu telefonul (trimiți un mesaj, suni, faci o poză, descarci o aplicație), întrebări și răspunsuri despre cât de des folosești telefonul (*هر روز چند بار از گوشیت استفاده می‌کنی؟*), un text de citit despre obiceiurile lui *نیما* și ale *سارا* cu dispozitivele și un dialog final între *نیما* și *سارا* despre cum folosește fiecare tehnologia.'
