  fa.a1.unit29.lesson01.teach.goshi_word:
    title: Telefon / telefon mobil
    gloss: telefon / telefon mobil
    note: '*گوشی* (literal „receptor”) este cuvântul colocvial obișnuit în Iran pentru „telefon mobil”, mai frecvent în vorbirea de zi cu zi decât *موبایل*.'
    example_gloss: Am un telefon.
  fa.a1.unit29.lesson01.teach.computer_word:
    title: Calculatorul
    gloss: calculator
    note: '*کامپیوتر* este cuvântul standard, de zi cu zi, pentru „calculator”.'
    example_gloss: Calculatorul acesta e bun.
  fa.a1.unit29.lesson01.teach.internet_word:
    title: Internetul
    gloss: internet
    note: '*اینترنت* este împrumutul obișnuit pentru „internet”.'
    example_gloss: Internetul e bun.
  fa.a1.unit29.lesson01.teach.app_word:
    title: Aplicația
    gloss: aplicație
    note: '*اپلیکیشن* înseamnă „aplicație” și este folosit frecvent.'
    example_gloss: Aplicația aceasta e bună.
  fa.a1.unit29.lesson01.teach.review_man_in_daram:
    title: Eu / acesta / eu am
    gloss: eu / acesta / am
    note: '*من*, *این* și *دارم* sunt cuvinte cunoscute, care revin aici pentru a vorbi despre dispozitivele pe care le ai.'
    target_text: من (eu) / این (acesta) / دارم (am)
  fa.a1.unit29.lesson01.teach.review_estefade_mikonam:
    title: A folosi + eu fac = eu folosesc
    gloss: a folosi + eu fac = eu folosesc
    note: '*استفاده* se combină cu *می‌کنم* („eu fac”) și înseamnă „eu folosesc”. *از* marchează ceea ce folosești.'
    target_text: استفاده (folosire) + می‌کنم (fac) = استفاده می‌کنم (folosesc)
  fa.a1.unit29.lesson01.teach.combined_sentence:
    title: Folosesc internetul
    gloss: Folosesc internetul
    note: '*من از اینترنت استفاده می‌کنم* combină *من* + *از* + *اینترنت* + *استفاده می‌کنم*.'
  fa.a1.unit29.lesson02.teach.review_peyam:
