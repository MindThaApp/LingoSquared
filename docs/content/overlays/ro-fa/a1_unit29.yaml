    title: Trimit un mesaj
    gloss: Trimit un mesaj
    note: '*پیام می‌فرستم* combină *پیام* cu verbul nou *می‌فرستم* („trimit”).'
  fa.a1.unit29.lesson02.teach.review_zang_mizanam:
