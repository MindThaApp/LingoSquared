    title: 'Lectură: tehnologia folosită de Nima și Sara'
    gloss: Sara folosește mult telefonul. Face poze și trimite mesaje. Acasă, Sara folosește și calculatorul. Nima folosește internetul în fiecare zi.
    note: Textul reia dialogul la persoana a treia. Aproape nu conține cuvinte noi, așa că este un exercițiu de recunoaștere a cuvintelor într-un text continuu.
