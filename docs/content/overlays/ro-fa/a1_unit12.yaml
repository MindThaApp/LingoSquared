    title: La ce oră?
    gloss: La ce oră?
    note: چه ساعتی؟ înseamnă literal „ce oră”, o formulare naturală pentru a întreba o oră anume.
  fa.a1.unit12.lesson06.teach.dialogue_line1:
    title: Sara, vrei să mergem joi la cinema?
    gloss: Sara, vrei să mergem joi la cinema?
    note: Arash începe prin a propune planul.
  fa.a1.unit12.lesson06.teach.dialogue_line2:
    title: La ce oră?
    gloss: La ce oră?
    note: Sara întreabă ora exactă înainte de a hotărî.
  fa.a1.unit12.lesson06.teach.dialogue_line3:
    title: La opt seara.
    gloss: La opt seara.
    note: Arash spune ora.
  fa.a1.unit12.lesson06.teach.dialogue_line4:
    title: Bine, grozav! Suntem înțeleși.
    gloss: Bine, grozav! Suntem înțeleși.
    note: Sara acceptă cu entuziasm.
  fa.a1.unit12.lesson06.teach.dialogue_line5:
    title: Perfect, ne vedem joi.
    gloss: Perfect, ne vedem joi.
    note: Arash confirmă și încheie discuția. خوبه folosește contragerea obișnuită -e (خوب است -> خوبه).
