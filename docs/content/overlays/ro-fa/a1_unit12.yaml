    example_gloss: Ce zici de joi?
  fa.a1.unit12.lesson02.teach.mikhay_word:
    title: Vrei
    gloss: vrei
    note: می‌خوای (vrei, informal) începe o întrebare prin care propui ceva.
    example_gloss: Vrei să mergem la cinema?
  fa.a1.unit12.lesson02.teach.panjshanbe_review:
    title: Joi (recapitulare)
    gloss: joi
    note: '*پنجشنبه* reia numele zilei din Unitatea 10.'
    example_gloss: Ești liber joi?
