    title: Vrei să mergem joi la cinema?
    gloss: Vrei să mergem joi la cinema?
    note: می‌خوای پنجشنبه بریم سینما؟ combină cuvintele acestei lecții într-o propunere completă.
  fa.a1.unit12.lesson03.teach.bashe_word:
    title: Bine
    gloss: bine
    note: باشه înseamnă „bine”, un cuvânt informal des folosit pentru a fi de acord.
