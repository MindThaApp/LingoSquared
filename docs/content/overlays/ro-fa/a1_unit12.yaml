    title: Grozav
    gloss: grozav
    note: عالیه (grozav) folosește tiparul deja cunoscut al contragerii în -e (عالی است -> عالیه).
    example_gloss: Grozav, atunci ne vedem.
  fa.a1.unit12.lesson03.teach.ghabule_word:
    title: Batem palma
    gloss: batem palma / stabilit
