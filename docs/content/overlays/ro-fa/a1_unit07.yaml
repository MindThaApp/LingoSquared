teaching:
  fa.a1.unit07.lesson01.teach.sunny:
    title: Însorit
    gloss: cu soare, însorit
    note: آفتابی descrie vremea însorită.
    example_gloss: Azi este soare.
  fa.a1.unit07.lesson01.teach.rainy:
    title: Ploios
    gloss: ploios
    note: بارونی este forma colocvială, de zi cu zi, a lui بارانی (ploios), în scriere și pronunție.
    example_gloss: Mâine va fi vreme ploioasă.
  fa.a1.unit07.lesson01.teach.cloudy:
    title: Înnorat
    gloss: noros
    note: ابری descrie vremea noroasă.
    example_gloss: Vremea este noroasă.
  fa.a1.unit07.lesson01.teach.snowy:
    title: Cu zăpadă
    gloss: cu zăpadă
    note: برفی descrie vremea cu zăpadă.
    example_gloss: Iarna ninge.
  fa.a1.unit07.lesson01.teach.or_word:
    title: Sau
    gloss: sau
    note: یا leagă două stări alternative ale vremii.
    target_text: یا (sau)
  fa.a1.unit07.lesson02.teach.hot:
    title: Cald
    gloss: cald
    note: گرم descrie vremea sau temperatura caldă, în general.
    example_gloss: Astăzi vremea este caldă.
  fa.a1.unit07.lesson02.teach.cold:
    title: Frig
    gloss: frig, rece
    note: سرد descrie vremea sau temperatura rece, în general.
    example_gloss: Iarna vremea este rece.
  fa.a1.unit07.lesson02.teach.cool:
    title: Răcoros
    gloss: răcoros
    note: خنک descrie vremea blândă și răcoroasă, între گرم și سرد.
    example_gloss: Seara este răcoare.
  fa.a1.unit07.lesson03.teach.weather_word:
    title: Vremea
    gloss: vremea
    note: هوا este cuvântul general pentru vreme (înseamnă și aer).
    example_gloss: Cum e vremea azi?
  fa.a1.unit07.lesson03.teach.weather_question:
    title: Întreabă cum este vremea
    gloss: Cum e vremea?
    note: هوا چطوره؟ reia چطوره, același cuvânt colocvial pentru „cum este”, văzut deja în حالتون چطوره؟ în Unitatea 1.
  fa.a1.unit07.lesson03.teach.today_word:
    title: Astăzi
    gloss: astăzi
    note: امروز denumește ziua de azi.
    example_gloss: Azi vremea este frumoasă.
  fa.a1.unit07.lesson03.teach.tomorrow_word:
    title: Mâine
    gloss: mâine
    note: فردا denumește ziua următoare.
    example_gloss: Ne vedem mâine.
  fa.a1.unit07.lesson04.teach.today_sunny:
    title: Spune că azi este soare
    gloss: Azi e vreme însorită.
    note: امروز هوا آفتابیه folosește contragerea colocvială în -e (آفتابیه = آفتابی است), deja întâlnită în acest curs.
  fa.a1.unit07.lesson04.teach.today_cold:
    title: Spune că azi este frig
    gloss: Astăzi este frig.
    note: امروز سرده urmează același tipar de contragere.
  fa.a1.unit07.lesson04.teach.contraction_note:
    title: Contragerea colocvială în -e
    gloss: آفتابیه este forma vorbită, de zi cu zi, a lui آفتابی است.
    note: 'Același tipar (adjectiv + ه) se aplică oricărui cuvânt despre vreme: سرده، گرمه، بارونیه، ابریه، برفیه.'
  fa.a1.unit07.lesson04.teach.today_rainy:
    title: Spune că azi plouă
    gloss: Azi e ploios.
    note: امروز بارونیه aplică aceeași contragere în -e lui بارونی.
  fa.a1.unit07.lesson05.teach.because_word:
    title: Pentru că / deoarece
    gloss: pentru că / deoarece
    note: چون introduce motivul unei sugestii.
    example_gloss: Port palton pentru că este frig.
  fa.a1.unit07.lesson05.teach.better_to:
    title: Propune să luați umbrela
    gloss: Mai bine luăm o umbrelă.
    note: بهتره چتر ببریم folosește colocvialul بهتره („este mai bine”) pentru a face o sugestie blândă.
  fa.a1.unit07.lesson05.teach.full_suggestion:
    title: Combină un motiv și o sugestie
    gloss: Fiindcă plouă, mai bine luăm o umbrelă.
    note: چون بارونیه، بهتره چتر ببریم leagă un motiv legat de vreme de o sugestie.
  fa.a1.unit07.lesson05.teach.coat_suggestion:
    title: Propune să purtați palton
    gloss: Fiindcă este frig, mai bine purtăm palton.
    note: چون سرده، بهتره کت بپوشیم urmează același tipar motiv + sugestie, aplicat vremii reci.
  fa.a1.unit07.lesson06.teach.coat_review:
    title: Propune să purtați palton
    gloss: mai bine purtăm palton
    note: کت بپوشیم urmează același tipar بهتره + verb ca în چتر ببریم, aplicat vremii reci.
    example_gloss: Este frig, hai să purtăm palton.
  fa.a1.unit07.lesson06.teach.turn01:
    title: Sara întreabă despre vremea de azi
    gloss: Sara întreabă cum e vremea azi.
    note: هوا چطوره؟ reia întrebarea din lecția 3.
  fa.a1.unit07.lesson06.teach.turn02:
    title: Reza spune că plouă
    gloss: Reza spune că el crede că plouă.
    note: فکر کنم („cred”) atenuează afirmația, fiindcă el presupune, nu este sigur.
  fa.a1.unit07.lesson06.teach.turn03:
    title: Sara propune să luați umbrela
    gloss: Sara spune că atunci mai bine iau o umbrelă.
    note: پس („atunci”, „deci”) leagă situația meteo de sugestie.
  fa.a1.unit07.lesson06.teach.turn04:
    title: Reza este de acord și întreabă despre mâine
    gloss: Reza este de acord și întreabă ce va fi mâine.
    note: فردا چی؟ este un mod natural și scurt de a întreba despre ziua următoare.
  fa.a1.unit07.lesson06.teach.turn05:
    title: Sara descrie vremea de mâine
    gloss: Sara spune că mâine va fi soare și cald.
    note: آفتابیه و گرمه leagă două contrageri despre vreme prin و.
  fa.a1.unit07.lesson06.teach.turn06:
    title: Reza propune să mergeți în parc
    gloss: Reza spune că e grozav, așa că să mergem în parc.
    note: عالیه („grozav”) exprimă o reacție pozitivă înainte de a propune planul.
  fa.a1.unit07.lesson06.teach.turn07:
    title: Sara este de acord și își ia rămas-bun
    gloss: Sara este de acord și spune că ne vedem mâine.
    note: باشه („bine”, „de acord”) este un mod colocvial frecvent de a accepta un plan.
