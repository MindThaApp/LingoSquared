course:
  title: Persană A1
  description: 'Persană iraniană pentru începători: cuvinte despre universitate și studii (universitate, student, lecție/disciplină, limbă), cum spui ce disciplină studiezi sau înveți (matematică, o specializare/un domeniu de studiu, engleza ca disciplină), cum întrebi și răspunzi unde studiezi (*کجا درس می‌خونی؟*) și cât de des mergi, un text de citit despre studiile lui *نیما* și ale *سارا*, și un dialog final între *نیما* și *سارا* despre disciplinele lor și ce simt față de ele (greu, dar interesant).'
