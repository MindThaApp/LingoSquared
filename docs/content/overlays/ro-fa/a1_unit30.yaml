teaching:
  fa.a1.unit30.lesson01.teach.daneshgah_word:
    title: Universitatea
    gloss: universitate
    note: '*دانشگاه* este cuvântul standard, de zi cu zi, pentru „universitate”.'
    example_gloss: Această universitate este bună.
  fa.a1.unit30.lesson01.teach.daneshjoo_word:
    title: Studentul
    gloss: student
    note: '*دانشجو* înseamnă „student la universitate”. *من دانشجو هستم* („Sunt student”) folosește forma uzuală *هستم*.'
    example_gloss: Sunt student.
  fa.a1.unit30.lesson01.teach.dars_word:
    title: Lecție / disciplină
    gloss: lecție / disciplină
    note: '*درس* înseamnă atât „o lecție”, cât și, mai larg, „o disciplină de studiu”.'
    example_gloss: Această disciplină este interesantă.
  fa.a1.unit30.lesson01.teach.zaban_word:
    title: Limba
    gloss: limbă
    note: '*زبان* este cuvântul standard pentru „limbă”.'
    example_gloss: Persana este o limbă.
  fa.a1.unit30.lesson01.teach.review_man_in:
    title: Eu / acesta
    gloss: eu / acesta
    note: '*من* și *این* revin aici pentru a vorbi despre studiile tale.'
    target_text: من (eu) / این (acesta)
  fa.a1.unit30.lesson01.teach.review_dar:
    title: În / la
    gloss: în / la
    note: '*در* înseamnă „în” sau „la” și este folosit aici pentru „la universitate”.'
    target_text: در (în / la)
  fa.a1.unit30.lesson01.teach.mikhonam_pattern:
    title: A studia/a citi + eu = eu studiez/citesc
    gloss: a citi/a studia + eu = citesc/studiez
    note: '*خوندن* („a citi” sau „a studia”, ca în *کتاب خوندن*) primește aceeași terminație de prezent *-م* ca *می‌کنم*, rezultând *می‌خونم*, „studiez” sau „citesc”.'
    target_text: خوندن (a citi / a studia) + م = می‌خونم (citesc / studiez)
  fa.a1.unit30.lesson01.teach.combined_sentence:
    title: Studiez la universitate
    gloss: Studiez la universitate
    note: '*من در دانشگاه درس می‌خونم* combină *من* + *در* + *دانشگاه* + *درس* + *می‌خونم*.'
  fa.a1.unit30.lesson02.teach.riazi_word:
    title: Matematica
    gloss: matematică
    note: '*ریاضی* este cuvântul standard pentru „matematică”.'
    example_gloss: Matematica este interesantă.
  fa.a1.unit30.lesson02.teach.reshte_word:
    title: Specializare / domeniu de studiu
    gloss: specializare / domeniu de studiu
    note: '*رشته* înseamnă „specializare” universitară sau „domeniu de studiu”. În *رشته‌ی من* („specializarea mea”), *ی* suplimentar leagă substantivul de *من*.'
    example_gloss: Specializarea mea este limba.
  fa.a1.unit30.lesson02.teach.review_engelisi:
    title: Engleză
    gloss: engleză
    note: '*انگلیسی* („engleză”) revine aici pentru a numi o disciplină pe care ai putea să o studiezi.'
    target_text: انگلیسی (engleză)
  fa.a1.unit30.lesson02.teach.yad_migiram_pattern:
    title: A învăța + eu = învăț
    gloss: a învăța + eu = învăț
    note: '*یاد گرفتن* înseamnă „a învăța”. Forma de prezent *یاد می‌گیرم* folosește același verb *گرفتن* ca în *عکس می‌گیرم* („fac o fotografie”), dar cu alt sens.'
    target_text: یاد گرفتن (a învăța) + م = یاد می‌گیرم (învăț)
  fa.a1.unit30.lesson02.teach.mikhoni_pattern:
    title: Tu studiezi/citești (informal)
    gloss: tu înveți / citești (informal)
    note: '*می‌خونی* este forma informală de persoana a II-a a lui *می‌خونم* și se folosește pentru a întreba direct pe cineva.'
    target_text: می‌خونی (citești / studiezi, informal)
  fa.a1.unit30.lesson02.teach.review_chi:
    title: Ce
    gloss: ce
    note: '*چی* („ce”) apare din nou aici.'
    target_text: چی (ce)
  fa.a1.unit30.lesson02.teach.question_what_study:
    title: Ce studiezi?
    gloss: Ce studiezi?
    note: '*چی درس می‌خونی؟* reunește toate elementele din această lecție.'
  fa.a1.unit30.lesson02.teach.answer_major:
    title: Specializarea mea este matematica. Învăț și limba engleză.
    gloss: Specializarea mea este matematica. Învăț și limba engleză.
    note: '*رشته‌ی من ریاضیه. زبان انگلیسی رو هم یاد می‌گیرم* spune care este specializarea ta și o materie în plus, folosind marcatorul de complement direct *رو* și *هم* („și”).'
  fa.a1.unit30.lesson03.teach.review_koja:
    title: Unde
    gloss: unde
    note: '*کجا* („unde”) poate fi folosit singur drept cuvânt interogativ, nu doar în întrebări precum *کجاست؟*.'
    target_text: کجا (unde)
  fa.a1.unit30.lesson03.teach.question_where_study:
    title: Unde studiezi?
    gloss: Unde studiezi?
    note: '*کجا درس می‌خونی؟* întreabă unde studiază cineva.'
  fa.a1.unit30.lesson03.teach.review_be:
    title: Spre / la
    gloss: la / spre
    note: '*به* („la, spre”) apare din nou aici, în „la universitate”.'
    target_text: به (la / spre)
  fa.a1.unit30.lesson03.teach.review_miram:
    title: Merg
    gloss: merg
    note: '*می‌رم* („merg”) apare din nou aici, pentru mersul la universitate.'
    target_text: می‌رم (merg)
  fa.a1.unit30.lesson03.teach.review_har_ruz:
    title: În fiecare zi
    gloss: în fiecare zi
    note: '*هر روز* („în fiecare zi”) apare din nou aici.'
    target_text: هر روز (în fiecare zi)
  fa.a1.unit30.lesson03.teach.answer_frequency:
    title: Merg la universitate în fiecare zi
    gloss: Merg la universitate în fiecare zi
    note: '*هر روز به دانشگاه می‌رم* combină toate elementele din această lecție.'
  fa.a1.unit30.lesson04.teach.sakhte_word:
    title: Este greu
    gloss: este greu
    note: '*سخته* (*سخت* + copula colocvială *-ه*) descrie ceva dificil.'
    example_gloss: Matematica este grea.
  fa.a1.unit30.lesson04.teach.review_jalebe:
    title: E interesant
    gloss: este interesant
    note: '*جالبه* („este interesant”) apare din nou aici.'
    target_text: جالبه (e interesant)
  fa.a1.unit30.lesson04.teach.review_vali:
    title: Dar
    gloss: dar
    note: '*ولی* („dar”) apare din nou aici.'
    target_text: ولی (dar)
  fa.a1.unit30.lesson04.teach.review_are:
    title: Da
    gloss: da
    note: '*آره* („da”) apare din nou aici.'
    target_text: آره (da)
  fa.a1.unit30.lesson04.teach.dialogue_line1:
    title: 'Nima: Sara, ce studiezi?'
    gloss: Sara, ce studiezi?
  fa.a1.unit30.lesson04.teach.dialogue_line2:
    title: 'Sara: Eu studiez limba engleză. Tu unde studiezi?'
    gloss: Eu studiez limba engleză. Tu unde studiezi?
  fa.a1.unit30.lesson04.teach.dialogue_line3:
    title: 'Nima: Eu studiez matematica la universitate.'
    gloss: Eu studiez matematica la universitate.
  fa.a1.unit30.lesson04.teach.dialogue_line4:
    title: 'Sara: Matematica e grea, nu?'
    gloss: Matematica e grea, nu?
  fa.a1.unit30.lesson04.teach.dialogue_line5:
    title: 'Nima: Da, e grea, dar e interesantă.'
    gloss: Da, e grea, dar e interesantă.
  fa.a1.unit30.lesson04.teach.dialogue_line6:
    title: 'Sara: Ce bine!'
    gloss: Ce bine!
  fa.a1.unit30.lesson05.teach.review_mikhone:
    title: El/ea studiază / citește
    gloss: el/ea studiază / citește
    note: '*می‌خونه* este forma colocvială de persoana a III-a a lui *می‌خونم*, necesară pentru a vorbi despre نیما și سارا în această lectură.'
    target_text: می‌خونه (el/ea citește / studiază)
  fa.a1.unit30.lesson05.teach.review_mire:
    title: El/ea merge
    gloss: el/ea merge
    note: '*می‌ره* este forma colocvială de persoana a III-a a lui *می‌رم* („merg”).'
    target_text: می‌ره (el/ea merge)
  fa.a1.unit30.lesson05.teach.review_oo:
    title: El / ea
    gloss: el / ea
    note: '*او* este pronumele de persoana a III-a.'
    target_text: او (el/ea)
  fa.a1.unit30.lesson05.teach.review_nima:
    title: Nima
    gloss: Nima
    note: '*نیما* este unul dintre cei doi prieteni pe care îi întâlnești mereu în aceste dialoguri.'
  fa.a1.unit30.lesson05.teach.reading_text:
    title: 'Lectură: studiile lui Nima și ale Sarei'
    gloss: Nima studiază matematica la universitate. Matematica e grea, dar interesantă. Sara studiază limba engleză. Ea merge la universitate în fiecare zi.
    note: Această lectură reia dialogul la persoana a III-a. Aproape nu există vocabular nou, deci este un exercițiu de recunoaștere a cuvintelor într-un text continuu.
  fa.a1.unit30.lesson06.teach.review_dooset_daram_vaght:
    title: Îmi place / timp / nu am
    gloss: îmi place / timp / nu am
    note: '*دوست دارم*, *وقت* și *ندارم* se combină aici într-o propoziție naturală despre o preferință și o limitare legate de studiu.'
    target_text: دوست دارم (îmi place) / وقت (timp) / ندارم (nu am)
  fa.a1.unit30.lesson06.teach.review_gahi:
    title: Uneori
    gloss: uneori
    note: '*گاهی* („uneori”) apare din nou aici.'
    target_text: گاهی (uneori)
  fa.a1.unit30.lesson06.teach.wrap_summary:
    title: Îmi place să studiez, dar uneori e greu
    gloss: Îmi place să studiez, dar uneori e greu
    note: '*درس رو دوست دارم ولی گاهی سخته* combină o preferință cu o limitare folosind *ولی*.'
