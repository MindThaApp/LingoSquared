    note: '*صبح*, *ظهر*, *عصر* și *شب* sunt cele patru părți ale zilei, recapitulate din Unitatea 9.'
    example_gloss:
    - Mă trezesc dimineața.
    - Prânzesc la amiază.
    - Lucrez după-amiaza.
    - Noaptea dorm.
  fa.a1.unit11.lesson03.teach.night_routine:
