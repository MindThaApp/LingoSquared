teaching:
  fa.a1.unit11.lesson01.teach.bidar_misham:
    title: Mă trezesc
    gloss: Mă trezesc
    note: بیدار می‌شم este forma colocvială, din Teheran, a lui بیدار می‌شوم.
    example_gloss: Mă trezesc în fiecare zi la șapte.
  fa.a1.unit11.lesson01.teach.sobhune_mikhoram:
    title: Mănânc micul dejun
    gloss: mănânc micul dejun
    note: صبحونه می‌خورم folosește forma colocvială صبحونه (micul dejun), nu forma mai formală صبحانه.
    example_gloss: Mănânc micul dejun și plec la serviciu.
  fa.a1.unit11.lesson01.teach.miram_sarkar:
    title: Merg la serviciu
    gloss: merg la serviciu
    note: میرم سر کار este forma colocvială pentru می‌روم سر کار.
    example_gloss: Apoi merg la serviciu.
  fa.a1.unit11.lesson01.teach.mikhabam:
    title: Mă culc
    gloss: mă culc
    note: می‌خوابم înseamnă „dorm” sau „mă culc”.
    example_gloss: Seara mă culc devreme.
  fa.a1.unit11.lesson01.teach.va_word:
    title: Și
    gloss: și
    note: '*و* este cuvântul obișnuit de legătură folosit pentru a uni activitățile rutinei, introdus deja în Unitatea 9.'
    example_gloss: Mă trezesc și iau micul dejun.
  fa.a1.unit11.lesson02.teach.che_saat_bidar:
    title: La ce oră te trezești?
    gloss: La ce oră te trezești?
    note: '*ساعت چند بیدار می‌شی؟* reia *ساعت چند* (la ce oră) din lecțiile despre oră din Unitatea 9.'
  fa.a1.unit11.lesson02.teach.saat_haft_bidar:
    title: Mă trezesc la șapte.
    gloss: Mă trezesc la șapte.
    note: ساعت هفت بیدار می‌شم indică o oră precisă de trezire.
  fa.a1.unit11.lesson02.teach.har_ruz:
    title: În fiecare zi
    gloss: în fiecare zi
    note: هر روز înseamnă „în fiecare zi” și prezintă o rutină ca pe un obicei.
    example_gloss: Mă trezesc în fiecare zi la șapte.
  fa.a1.unit11.lesson03.teach.bad:
    title: După aceea
