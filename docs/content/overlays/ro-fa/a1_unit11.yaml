    title: El/ea se trezește, el/ea se culcă
    gloss: el/ea se trezește, el/ea se culcă
    note: بیدار می‌شه și می‌خوابه sunt formele de persoana a treia (او), necesare pentru a spune ce face Sara sau Nima, spre deosebire de formele de persoana întâi (بیدار می‌شم، می‌خوابم) folosite în rest în această unitate.
