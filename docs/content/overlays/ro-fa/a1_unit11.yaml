    note: '*شب‌ها ساعت یازده می‌خوابم* se bazează pe *شب* (noapte) din vocabularul părților zilei din Unitatea 9; *شب‌ها* înseamnă „noaptea” ca obicei.'
  fa.a1.unit11.lesson04.teach.routine_text:
    title: Text despre rutină
    gloss: În fiecare zi mă trezesc la șapte. După aceea iau micul dejun și plec la serviciu.
    note: Aceasta este o descriere reală și coerentă a unei rutine de dimineață, care folosește هر روز și بعدش pentru a ordona activitățile.
  fa.a1.unit11.lesson05.teach.tow_chi:
    title: Dar tu?
    gloss: Dar tu?
    note: تو چی؟ se folosește pentru a întoarce întrebarea către celălalt.
  fa.a1.unit11.lesson05.teach.yekam_dirtar:
    title: Puțin mai târziu
    gloss: puțin mai târziu
    note: یه‌کم دیرتر înseamnă „puțin mai târziu” și se folosește pentru a compara două rutine.
  fa.a1.unit11.lesson06.teach.turn01:
    title: La ce oră te trezești în fiecare zi?
    gloss: La ce oră te trezești în fiecare zi?
    note: Sara începe prin a-l întreba pe Nima la ce oră se trezește.
  fa.a1.unit11.lesson06.teach.turn02:
    title: Mă trezesc la șapte. Dar tu?
    gloss: Mă trezesc la șapte. Dar tu?
    note: Nima răspunde și îi întoarce întrebarea lui Sara.
  fa.a1.unit11.lesson06.teach.turn03:
    title: Eu, puțin mai târziu, la opt.
    gloss: Eu, puțin mai târziu, la opt.
    note: Sara își compară ora de trezire cu cea a lui Nima.
  fa.a1.unit11.lesson06.teach.turn04:
    title: Ce faci după ce te trezești?
    gloss: Ce faci după ce te trezești?
    note: Nima întreabă care este pasul următor din rutina lui Sara.
  fa.a1.unit11.lesson06.teach.turn05:
    title: Mănânc micul dejun și plec la serviciu. Seara, de obicei, mă culc la unsprezece.
    gloss: Mănânc micul dejun și plec la serviciu. Seara, de obicei, mă culc la unsprezece.
    note: Sara descrie restul rutinei ei într-un singur răspuns, în acord cu orele de trezire și de culcare folosite mai devreme în unitate.
