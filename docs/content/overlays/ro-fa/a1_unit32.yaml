    gloss: casă / cameră / treabă / eu, al meu / și
    note: '*خونه*, *اتاق*, *کار*, *من* și *و* apar din nou aici, din unitățile anterioare.'
    target_text: خونه (casă) / اتاق (cameră) / کار (muncă, treabă) / من (eu, al meu) / و (și)
