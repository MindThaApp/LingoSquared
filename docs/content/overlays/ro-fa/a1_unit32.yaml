    title: Marca de complement direct / fac / trebuie să
    gloss: marca complementului direct / fac / trebuie
    note: '*رو* marchează complementul direct; *می‌کنم* înseamnă „fac”; *باید* înseamnă „trebuie” sau „e nevoie să”.'
    target_text: رو (marcă a complementului direct) / می‌کنم (fac) / باید (trebuie, e nevoie să)
