course:
  title: Persană A1
  description: 'Farsi iranian pentru începători: denumirea animalelor obișnuite de companie (câine, pisică, pasăre, pește), întrebarea „Ai un animal de companie?”, spunerea numelui unui animal și hrănirea lui, descrierea culorii și mărimii, un scurt text despre pisica پشمک a lui سارا și un dialog de încheiere între سارا și نیما, care admiră pisica پشمک.'
