teaching:
  fa.a1.unit26.lesson01.teach.man_review:
    title: eu
    gloss: eu
    note: '*من*, deja cunoscut, apare din nou aici pentru a vorbi despre propriul animal de companie.'
  fa.a1.unit26.lesson01.teach.oo_review:
    title: El / ea
    gloss: el / ea
    note: '*او* apare din nou aici.'
  fa.a1.unit26.lesson01.teach.daram_family_review:
    title: Am / el-ea are / nu am
    gloss: am / el-ea are / nu am
    note: '*دارم*/*داره* funcționează la fel și pentru un animal de companie. *ندارم* (nu am) și *نداره* (el/ea nu are) sunt formele negative corespunzătoare -- folosite deja împreună în dialogul despre familie din Unitatea 4.'
  fa.a1.unit26.lesson01.teach.heyvan_word:
    title: Animal
    gloss: animal
    note: '*حیوان* înseamnă animal.'
    example_gloss: Pisica este un animal.
  fa.a1.unit26.lesson01.teach.heyvane_khoonegi_phrase:
    title: Animal de companie
    gloss: animal de companie
    note: '*حیوان خونگی* înseamnă literal „animal de casă” -- modul obișnuit de a spune „animal de companie”.'
  fa.a1.unit26.lesson01.teach.sag_word:
    title: Câine
    gloss: câine
    note: '*سگ* înseamnă câine.'
    example_gloss: Am un câine.
  fa.a1.unit26.lesson01.teach.gorbe_word:
    title: Pisică
    gloss: pisică
    note: '*گربه* înseamnă pisică.'
    example_gloss: El are o pisică.
  fa.a1.unit26.lesson02.teach.parande_word:
    title: Pasăre
    gloss: pasăre
    note: '*پرنده* înseamnă pasăre.'
    example_gloss: Ea are o pasăre.
  fa.a1.unit26.lesson02.teach.mahi_word:
    title: Peștele
    gloss: pește
    note: '*ماهی* înseamnă pește.'
    example_gloss: Am un pește.
  fa.a1.unit26.lesson02.teach.dari_review:
    title: Tu ai
    gloss: ai
    note: '*داری* apare din nou aici, în aceeași formă informală de persoana a II-a.'
  fa.a1.unit26.lesson02.teach.have_a_pet_question:
    title: Ai un animal de companie?
    gloss: ai un animal de companie?
    note: '*حیوان خونگی داری؟* combină *حیوان خونگی* din lecția 1 cu *داری* -- modul firesc de a întreba pe cineva dacă are un animal de companie.'
  fa.a1.unit26.lesson02.teach.are_review:
    title: Da
    gloss: da
    note: '*آره* este cuvântul colocvial de zi cu zi pentru „da”.'
  fa.a1.unit26.lesson03.teach.esm_review:
    title: Nume
    gloss: nume
    note: '*اسم* se folosește la fel și pentru numele unui animal de companie.'
  fa.a1.unit26.lesson03.teach.esmesh_chiye_phrase:
    title: Cum îl cheamă?
    gloss: cum îl cheamă?
    note: '*اسمش چیه؟* combină sufixul posesiv *-ش* (văzut deja în *قدش*/*موهاش* în Unitatea 25) cu *چیه؟* din Unitatea 2 -- „cum îl/o cheamă?”'
  fa.a1.unit26.lesson03.teach.ghaza_word:
    title: Mâncare
    gloss: mâncare
    note: '*غذا* este același cuvânt folosit pentru mâncarea animalelor.'
    example_gloss: Îmi place mâncarea.
  fa.a1.unit26.lesson03.teach.midam_word:
    title: Dau / hrănesc
    gloss: dau / hrănesc
    note: '*می‌دم* (literal „dau”), întâlnit deja în *گوش می‌دم* din Unitatea 24, este verbul firesc pentru hrănirea unui animal când apare împreună cu *غذا*.'
  fa.a1.unit26.lesson03.teach.sagam_word:
    title: Câinele meu
    gloss: câinele meu
    note: '*سگم* combină *سگ* cu sufixul posesiv *-م* -- „câinele meu”, același tipar contopit ca *اسمم* din Unitatea 2.'
  fa.a1.unit26.lesson03.teach.feed_my_dog_phrase:
    title: Îmi hrănesc câinele.
    gloss: Îmi hrănesc câinele.
    note: '*سگم رو غذا می‌دم* folosește *رو* (marcatorul complementului direct, văzut deja în *قهوه رو بیشتر دوست دارم* din Unitatea 14) pentru a marca *سگم* drept cel care este hrănit.'
  fa.a1.unit26.lesson04.teach.che_rangiye_review:
    title: De ce culoare este?
    gloss: de ce culoare este?
    note: '*چه رنگیه؟* funcționează la fel pentru a descrie culoarea unui animal de companie.'
  fa.a1.unit26.lesson04.teach.sefid_word:
    title: Alb
    gloss: alb
    note: '*سفید* apare din nou aici pentru culoarea unui animal. *گربه‌ی* este forma cu ezafe a lui *گربه*, folosită înaintea posesorului, ca în *گربه‌ی من* (pisica mea) -- același tipar ca *خونه‌ی من* din Unitatea 19, folosit la substantivele terminate în vocală în loc de un sufix contopit.'
    example_gloss: Pisica mea este albă.
  fa.a1.unit26.lesson04.teach.koochik_word:
    title: Mic
    gloss: mic
    note: '*کوچیک* apare din nou aici pentru mărimea unui animal.'
    example_gloss: Peștele meu este mic.
  fa.a1.unit26.lesson04.teach.bozorg_word:
    title: Mare
    gloss: mare
    note: '*بزرگ* apare din nou aici pentru mărimea unui animal.'
    example_gloss: Câinele meu este mare.
  fa.a1.unit26.lesson05.teach.sara_review:
    title: Sara
    gloss: Sara
    note: '*سارا*, personaj prezentat încă din Unitatea 2, apare din nou aici.'
    example_gloss: Sara are o pisică.
  fa.a1.unit26.lesson05.teach.yek_review:
    title: Unu / un
    gloss: unu / un
    note: '*یک* este folosit aici ca articol nehotărât „un/o”.'
  fa.a1.unit26.lesson05.teach.va_review:
    title: Și
    gloss: și
    note: '*و* înseamnă „și” -- folosit deja astfel în Unitatea 14, Unitatea 24 și Unitatea 25.'
  fa.a1.unit26.lesson05.teach.pashmak_name:
    title: Pashmak
    gloss: Pashmak
    note: '*پشمک* (literal „vată de zahăr”) este un nume real și frecvent pentru animale în Iran -- numele pisicii Sarei.'
    example_gloss: Pisica Sarei se numește Pashmak.
  fa.a1.unit26.lesson05.teach.har_rooz_review:
    title: În fiecare zi
    gloss: în fiecare zi
    note: '*هر روز* funcționează la fel și aici, pentru hrănirea unui animal.'
  fa.a1.unit26.lesson05.teach.mide_word:
    title: El/ea dă / hrănește
    gloss: el/ea dă / hrănește
    note: '*می‌ده* este forma colocvială de persoana a III-a a aceluiași verb ca *می‌دم* din lecția 3 (eu dau / hrănesc).'
  fa.a1.unit26.lesson05.teach.reading_text:
    title: 'Lectură: Pisica Sarei'
    gloss: Sara are o pisică. O cheamă Pashmak. Pashmak este albă și mică. Sara îi dă de mâncare lui Pashmak în fiecare zi.
    note: Această lectură reia toate construcțiile din lecțiile 1-4 -- aproape fără vocabular nou, doar le recunoști într-un text continuu.
  fa.a1.unit26.lesson06.teach.in_word:
    title: Acesta / aceasta
    gloss: acesta
    note: '*این* înseamnă „acesta, aceasta”.'
  fa.a1.unit26.lesson06.teach.kiye_review:
    title: Al cui este?
    gloss: al cui este?
    note: '*کیه* se folosește aici pentru a întreba al cui este un animal de companie.'
  fa.a1.unit26.lesson06.teach.mane_word:
    title: Este al meu
    gloss: este al meu
    note: '*منه* este forma colocvială contrasă a lui *من است* -- „este al meu”. *گربه‌ی منه* înseamnă „este pisica mea”.'
  fa.a1.unit26.lesson06.teach.sagame_word:
    title: Este câinele meu
    gloss: este câinele meu
    note: '*سگمه* îmbină *سگم* (câinele meu) din lecția 3 cu aceeași terminație *-ه* („este”) ca în *منه* -- „este câinele meu”.'
  fa.a1.unit26.lesson06.teach.khoshgel_word:
    title: Drăguț
    gloss: drăguț
    note: '*خوشگل* înseamnă drăguț sau frumos. *خیلی* înseamnă „foarte”.'
    example_gloss: Pisica Sarei este foarte drăguță.
  fa.a1.unit26.lesson06.teach.mamnoon_review:
    title: Mulțumiri
    gloss: mulțumesc
    note: '*ممنون* apare din nou aici, ca replică firească de încheiere.'
  fa.a1.unit26.lesson06.teach.dialogue_line1:
    title: 'Nima: A cui este pisica asta?'
    gloss: A cui este pisica asta?
  fa.a1.unit26.lesson06.teach.dialogue_line2:
    title: 'Sara: Este pisica mea. O cheamă Pashmak.'
    gloss: Este pisica mea. O cheamă Pashmak.
  fa.a1.unit26.lesson06.teach.dialogue_line3:
    title: 'Nima: Ce culoare are?'
    gloss: Ce culoare are?
  fa.a1.unit26.lesson06.teach.dialogue_line4:
    title: 'Sara: Albă și mică.'
    gloss: Albă și mică.
  fa.a1.unit26.lesson06.teach.dialogue_line5:
    title: 'Nima: Foarte drăguță!'
    gloss: Foarte drăguță!
  fa.a1.unit26.lesson06.teach.dialogue_line6:
    title: 'Sara: Mulțumesc!'
    gloss: Mulțumesc!
