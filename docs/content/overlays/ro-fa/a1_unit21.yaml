teaching:
  fa.a1.unit21.lesson01.teach.money_word:
    title: Bani
    gloss: bani
    note: پول este cuvântul general pentru bani.
    example_gloss: Unde sunt banii mei?
  fa.a1.unit21.lesson01.teach.bank_word:
    title: Banca
    gloss: bancă
    note: بانک este cuvântul general pentru bancă.
    example_gloss: Banca este aproape.
  fa.a1.unit21.lesson01.teach.dollar_word:
    title: Dolar
    gloss: dolar
    note: دلار este cuvântul pentru dolarul (american), cea mai frecventă valută străină din conversațiile obișnuite despre schimbul valutar.
    example_gloss: Am dolari.
  fa.a1.unit21.lesson01.teach.exchange_word:
    title: Schimb
    gloss: schimb
    note: 'تبدیل înseamnă a schimba/a converti și se folosește cu کردن (a face): تبدیل کردن.'
    example_gloss: Vreau să schimb (bani).
  fa.a1.unit21.lesson01.teach.va_word:
    title: Și
    gloss: și
    note: و este cuvântul obișnuit de legătură, recapitulare din unitățile anterioare.
    target_text: و (și)
  fa.a1.unit21.lesson02.teach.want_exchange:
    title: Spune că vrei să schimbi valută
    gloss: Vreau să schimb dolari în tomani.
    note: می‌خوام دلار به تومن تبدیل کنم folosește به (în) pentru a marca moneda în care se schimbă.
  fa.a1.unit21.lesson02.teach.how_much_dollar:
    title: Întreabă câți dolari
    gloss: Câți dolari aveți?
    note: '*چقدر دلار دارید؟* folosește *چقدر* (cât/câți), un cuvânt pe care l-ai întâlnit deja în întrebări despre cantitate.'
  fa.a1.unit21.lesson03.teach.atm_word:
    title: Bancomat
    gloss: bancomat
    note: خودپرداز înseamnă literal „cel care plătește singur”, cuvântul standard pentru bancomat.
    example_gloss: Bancomatul este acolo.
  fa.a1.unit21.lesson03.teach.withdraw_phrase:
    title: Spune că vrei să retragi bani
    gloss: Vreau să retrag bani de la bancomat.
    note: می‌خوام از خودپرداز پول بردارم folosește از (de la) și بردارم (retrag/scot).
  fa.a1.unit21.lesson04.teach.change_question:
    title: Cere mărunt
    gloss: Aveți mărunt?
    note: پول خرد دارید؟ folosește خرد (mărunt) după پول (bani).
  fa.a1.unit21.lesson04.teach.here_you_are:
    title: Poftiți (recapitulare)
    gloss: poftiți
    note: '*بفرمایید* a fost introdus într-o unitate anterioară; aici se folosește când întinzi ceva cuiva.'
  fa.a1.unit21.lesson05.teach.rate_word:
    title: Cursul
    gloss: curs
    note: نرخ este cuvântul pentru cursul (de schimb).
    example_gloss: Care este cursul de azi?
  fa.a1.unit21.lesson05.teach.per_dollar_rate:
    title: Spune cursul pe dolar
    gloss: Fiecare dolar costă 30 de tomani.
    note: هر دلار سی تومنه folosește هر (fiecare) și contragerea colocvială -e (*تومنه* = *تومن است*) pe care ai întâlnit-o deja.
  fa.a1.unit21.lesson06.teach.hundred_word:
    title: O sută
    gloss: o sută
    note: صد este numărul 100.
    example_gloss: Am o sută de dolari.
  fa.a1.unit21.lesson06.teach.please_do:
    title: Vă rog, faceți-o
    gloss: vă rog, schimbați
    note: لطفاً تبدیل کنید este forma politicoasă de imperativ a lui تبدیل کردن.
  fa.a1.unit21.lesson06.teach.turn01:
    title: Sara cere să schimbe bani
    gloss: Sara îl salută pe funcționar și spune că vrea să schimbe dolari în tomani.
    note: 'Reia fraza din lecția 2: می‌خوام دلار به تومن تبدیل کنم.'
  fa.a1.unit21.lesson06.teach.turn02:
    title: Funcționarul întreabă câți dolari are
    gloss: Funcționarul o salută pe Sara și o întreabă câți dolari are.
    note: 'Reia întrebarea din lecția 2: چقدر دلار دارید؟'
  fa.a1.unit21.lesson06.teach.turn03:
    title: Sara spune suma și întreabă care este cursul
    gloss: Sara spune că are o sută de dolari și întreabă care este cursul de azi.
    note: صد (o sută) este nou; نرخ امروز چنده؟ reia întrebarea despre curs din lecția 5.
  fa.a1.unit21.lesson06.teach.turn04:
    title: Funcționarul spune cursul
    gloss: Funcționarul spune că un dolar costă 30 de tomani.
    note: 'Reia fraza din lecția 5: هر دلار سی تومنه.'
  fa.a1.unit21.lesson06.teach.turn05:
    title: Sara acceptă și îi cere funcționarului să continue
    gloss: Sara acceptă și îl roagă pe funcționar să facă schimbul.
    note: لطفاً تبدیل کنید, învățat mai devreme în această lecție.
  fa.a1.unit21.lesson06.teach.turn06:
    title: Funcționarul spune suma totală
    gloss: Poftiți, trei mii de tomani.
    note: '*سه هزار تومن* = 100 de dolari x 30 de tomani pe dolar. *هزار* (mie) este recapitulat din unitatea despre numere.'
  fa.a1.unit21.lesson06.teach.turn07:
    title: Sara îi mulțumește funcționarului și cere și bani mărunți
    gloss: Mulțumesc. Aveți și bani mărunți?
    note: 'Reia întrebarea din lecția 4: پول خرد دارید؟, cu هم (și, de asemenea).'
  fa.a1.unit21.lesson06.teach.turn08:
    title: Funcționarul confirmă și îi dă banii
    gloss: Da, poftiți.
    note: بله (da) este un cuvânt recapitulat; بفرمایید încheie schimbul.
