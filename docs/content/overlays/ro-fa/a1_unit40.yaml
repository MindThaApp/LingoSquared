    gloss: eu
    note: '*من* („eu”) a fost introdus mai devreme.'
  fa.a1.unit40.lesson01.teach.kif:
    title: Geantă
    gloss: geantă
    note: '*کیف* înseamnă „geantă” (o poșetă, un rucsac sau altceva asemănător).'
    example_gloss: Această geantă este a mea.
  fa.a1.unit40.lesson01.teach.kelid:
    title: Cheie
    gloss: cheie
    note: '*کلید* înseamnă „cheie”.'
    example_gloss: Această cheie este a mea.
