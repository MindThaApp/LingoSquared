    title: Am pierdut
    gloss: am pierdut
    note: '*گم کردم* („am pierdut”) îîmbină *گم* („pierdut”) cu *کردم*, trecutul lui *کردن* („a face”). Primește același sufix -م ca *رفتم*, *خوردم* și *دیدم*.'
  fa.a1.unit40.lesson02.teach.gozarnameh:
    title: Pașaport
    gloss: pașaport
    note: '*گذرنامه* înseamnă „pașaport”.'
    example_gloss: Acest pașaport este al meu.
