course:
  title: Persană A1
  description: 'Persana iraniană pentru începători: trecutul simplu, descrierea celor întâmplate ieri, întrebări despre un eveniment recent, citit și scris despre un eveniment recent și un dialog care compară weekendul a două persoane.'
units:
