teaching:
  fa.a1.unit13.lesson01.teach.diruz_word:
    title: Ieri
    gloss: ieri
    note: دیروز înseamnă „ieri”.
    example_gloss: Ieri am fost la cinema.
  fa.a1.unit13.lesson01.teach.raftam_word:
    title: M-am dus
    gloss: m-am dus
    note: رفتم este trecutul simplu al verbului رفتن (a merge), persoana întâi.
    example_gloss: Am fost la restaurant.
  fa.a1.unit13.lesson01.teach.khordam_word:
    title: Am mâncat
    gloss: am mâncat
    note: خوردم este trecutul simplu al verbului خوردن (a mânca), persoana întâi.
    example_gloss: Am luat prânzul.
  fa.a1.unit13.lesson01.teach.didam_word:
    title: Am văzut
    gloss: am văzut
    note: دیدم este trecutul simplu al verbului دیدن (a vedea), persoana întâi.
    example_gloss: Am văzut un film bun.
  fa.a1.unit13.lesson02.teach.sinama_word:
    title: Cinema / filme
    gloss: cinema
    note: سینما înseamnă „cinema” sau „filmele” (ieșitul la film).
    example_gloss: Ieri am fost la cinema.
  fa.a1.unit13.lesson02.teach.be_word:
    title: Spre / la
    gloss: la
    note: به înseamnă „la, spre” și se folosește înaintea unei destinații.
    target_text: به (la, spre)
  fa.a1.unit13.lesson02.teach.diruz_sinama_raftam:
    title: Ieri am fost la cinema.
    gloss: Ieri am fost la cinema.
    note: دیروز به سینما رفتم reunește cuvintele din această lecție într-o propoziție completă.
  fa.a1.unit13.lesson03.teach.chikar_word:
    title: Ce (activitate)
    gloss: ce (activitate)
    note: چیکار („ce lucru / ce activitate”) se folosește pentru a întreba ce a făcut cineva.
    example_gloss: Ce ai făcut ieri?
  fa.a1.unit13.lesson03.teach.kardi_word:
    title: Ai făcut
    gloss: ai făcut
    note: کردی este trecutul simplu al verbului کردن (a face), persoana a doua, informal.
    example_gloss: Ce ai făcut?
  fa.a1.unit13.lesson03.teach.question_phrase:
    title: Ce ai făcut ieri?
    gloss: Ce ați făcut ieri?
    note: دیروز چیکار کردی؟ este o modalitate colocvială frecventă de a întreba ce a făcut cineva ieri.
  fa.a1.unit13.lesson04.teach.film_word:
    title: Film
    gloss: film
    note: فیلم înseamnă „film”.
    example_gloss: Am văzut un film bun.
  fa.a1.unit13.lesson04.teach.khoob_word:
    title: Bun
    gloss: bun
    note: خوب înseamnă „bun”.
    example_gloss: Filmul a fost bun.
  fa.a1.unit13.lesson04.teach.recent_event_text:
    title: Exemplu de text despre un eveniment recent
    gloss: Ieri am fost la cinema. Am văzut un film bun. Apoi am luat prânzul.
    note: O scurtă relatare la persoana întâi, care reunește vocabularul la trecut al acestei unități.
  fa.a1.unit13.lesson04.teach.va_word:
    title: Și
    gloss: și
    note: و înseamnă „și” și leagă două propoziții sau două elemente.
    target_text: و (și)
  fa.a1.unit13.lesson05.teach.ketab_word:
    title: Carte
    gloss: carte
    note: کتاب înseamnă „carte”.
    example_gloss: Am citit o carte.
  fa.a1.unit13.lesson05.teach.khoondam_word:
    title: Citesc
    gloss: citesc
    note: خوندم este trecutul simplu colocvial al verbului خواندن (a citi), persoana întâi.
    example_gloss: Ieri am citit o carte.
  fa.a1.unit13.lesson06.teach.man_word:
    title: eu
    gloss: eu
    note: من este pronumele personal de persoana întâi, folosit aici pentru accentuare (من خونه موندم – cât despre mine, eu am rămas acasă).
    example_gloss: Am rămas acasă.
  fa.a1.unit13.lesson06.teach.names:
    title: Nima și Sara
    gloss: Nima, Sara
    note: نیما și سارا sunt cei doi vorbitori din dialogul acestei lecții.
    example_gloss:
    - Nima a rămas acasă și a citit o carte.
    - Sara a fost ieri la cinema.
  fa.a1.unit13.lesson06.teach.khooneh_moondam_word:
    title: Am rămas acasă
    gloss: am rămas acasă
    note: خونه موندم înseamnă „am rămas acasă”, cu forma colocvială خونه („casă, acasă”).
  fa.a1.unit13.lesson06.teach.to_chi_word:
    title: Dar tu?
    gloss: Dar tu?
    note: تو چی؟ înseamnă literal „tu, ce?” și este o modalitate naturală de a întoarce întrebarea.
  fa.a1.unit13.lesson06.teach.alie_word:
    title: Grozav
    gloss: grozav
    note: عالیه urmează tiparul deja cunoscut al contragerii cu -e (عالی است -> عالیه).
    example_gloss: Grozav, cum a fost?
  fa.a1.unit13.lesson06.teach.dialogue_line1:
    title: Ce ai făcut ieri?
    gloss: Ce ați făcut ieri?
    note: Nima începe întrebând-o pe Sara ce a făcut ieri.
  fa.a1.unit13.lesson06.teach.dialogue_line2:
    title: Am fost la cinema și am văzut un film bun. Dar tu?
    gloss: Am fost la cinema și am văzut un film bun. Dar tu?
    note: Sara răspunde și întoarce întrebarea.
  fa.a1.unit13.lesson06.teach.dialogue_line3:
    title: Am rămas acasă și am citit o carte.
    gloss: Am rămas acasă și am citit o carte.
    note: Nima își descrie propria zi.
  fa.a1.unit13.lesson06.teach.dialogue_line4:
    title: Grozav!
    gloss: Grozav!
    note: Sara reacționează pozitiv, încheind schimbul de replici.
  fa.a1.unit13.lesson06.teach.third_person_past:
    title: El/ea a mers, a văzut, a făcut, a rămas, a citit (persoana a III-a)
    gloss: el/ea a mers, a văzut, a făcut, a rămas, a citit (persoana a treia)
    note: رفت، دید، کرد، موند، خوند sunt formele de trecut simplu la persoana a treia, necesare pentru a compara ce a făcut fiecare, Sara și Nima.
    target_text: رفت، دید، کرد، موند، خوند (el/ea a mers, a văzut, a făcut, a rămas, a citit -- persoana a treia)
