teaching:
  fa.a1.unit15.lesson01.teach.in_word:
    title: Acesta
    gloss: acesta
    note: این înseamnă „acesta/aceasta”.
    example_gloss: Acesta este mai mare decât acela.
  fa.a1.unit15.lesson01.teach.oon_word:
    title: Acela
    gloss: acela / aceea
    note: اون înseamnă „acela/aceea” (forma colocvială a lui آن).
    example_gloss: Acela este mai mic decât acesta.
  fa.a1.unit15.lesson01.teach.bozorgtare_word:
    title: Este mai mare
    gloss: este mai mare
    note: بزرگ‌تره este forma colocvială contrasă a lui بزرگ‌تر است („este mai mare”) -- بزرگ‌تر este comparativul lui بزرگ („mare”).
    example_gloss: Acesta este mai mare decât acela.
  fa.a1.unit15.lesson01.teach.koochiktare_word:
    title: Este mai mic
    gloss: este mai mic
    note: کوچیک‌تره este forma colocvială contrasă a lui کوچیک‌تر است („este mai mic”).
    example_gloss: Acela este mai mic decât acesta.
  fa.a1.unit15.lesson01.teach.az_word:
    title: Decât / de
    gloss: decât
    note: از marchează termenul de comparație -- X از Y بزرگ‌تره înseamnă „X este mai mare decât Y”.
    target_text: از (decât)
  fa.a1.unit15.lesson02.teach.geroontare_word:
    title: Este mai scump
    gloss: este mai scump
    note: گرون‌تره este forma colocvială contrasă a lui گرون‌تر است -- گرون‌تر este comparativul lui گرون („scump”).
    example_gloss: Acesta este mai scump decât acela.
  fa.a1.unit15.lesson02.teach.arzoontare_word:
    title: Este mai ieftin
    gloss: este mai ieftin
    note: ارزون‌تره este forma colocvială contrasă a lui ارزون‌تر است -- ارزون‌تر este comparativul lui ارزون („ieftin”).
    example_gloss: Acela este mai ieftin decât acesta.
  fa.a1.unit15.lesson03.teach.names:
    title: Nima și Sara
    gloss: Nima, Sara
    note: Nume iraniene frecvente, folosite în tot cursul.
    example_gloss:
    - Nima este mai înalt decât Sara.
    - Sara este mai tânără decât Nima.
  fa.a1.unit15.lesson03.teach.ghad_bolandtare_phrase:
    title: Mai înalt
    gloss: mai înalt / mai înaltă
    note: '*قد بلندتره* înseamnă literal „înălțimea e mai mare”: *قد* (înălțime) + *بلندتر* (mai înalt, comparativul lui *بلند*, înalt/lung) + *است* („este”), contras în *-ه*.'
  fa.a1.unit15.lesson03.teach.javoontare_word:
    title: Mai tânăr
    gloss: mai tânăr / mai tânără
    note: جوون‌تره este forma colocvială contrasă a lui جوون‌تر است -- جوون‌تر este comparativul lui جوون („tânăr”).
    example_gloss: Sara este mai tânără decât Nima.
  fa.a1.unit15.lesson04.teach.behtare_word:
    title: Este mai bun
    gloss: este mai bun
    note: '*بهتره* este forma colocvială contrasă a lui *بهتر است*. *بهتر* („mai bun”) este comparativul neregulat al lui *خوب* („bun”).'
    example_gloss: Acesta este mai bun decât acela.
  fa.a1.unit15.lesson04.teach.badtare_word:
    title: Este mai rău
    gloss: este mai rău
    note: '*بدتره* este forma colocvială contrasă a lui *بدتر است*. *بدتر* („mai rău”) este comparativul regulat al lui *بد* („rău”): același cuvânt plus terminația obișnuită *تر*, spre deosebire de *بهتر*, care este neregulat.'
    example_gloss: Acela este mai rău decât acesta.
  fa.a1.unit15.lesson04.teach.choon_word:
    title: Pentru că
    gloss: pentru că
    note: چون introduce un motiv („pentru că”).
    target_text: چون (pentru că)
  fa.a1.unit15.lesson04.teach.va_word:
    title: Și
    gloss: și
    note: و înseamnă „și” și leagă două propoziții sau două elemente.
    target_text: و (și)
  fa.a1.unit15.lesson05.teach.reading_text:
    title: Text-model de comparație
    gloss: Nima este mai înalt decât Sara. Sara este mai tânără decât Nima.
    note: O scurtă comparație la persoana a treia, care combină vocabularul acestei unități.
  fa.a1.unit15.lesson06.teach.names:
    title: Nima și Sara
    gloss: Nima, Sara
    example_gloss:
    - Nima a spus că acesta este mai scump.
    - Sara a spus că acela este mai ieftin.
  fa.a1.unit15.lesson06.teach.vali_word:
    title: Dar
    gloss: dar
    note: ولی înseamnă „dar” și introduce un contrast.
    target_text: ولی (dar)
  fa.a1.unit15.lesson06.teach.aare_word:
    title: Da
    gloss: da
    note: آره este forma colocvială a lui بله („da”).
    example_gloss: Da, așa este.
  fa.a1.unit15.lesson06.teach.dialogue_line1:
    title: Nima spune
    gloss: Acesta este mai scump decât acela, dar este mai bun.
  fa.a1.unit15.lesson06.teach.dialogue_line2:
    title: Sara răspunde
    gloss: Da, dar acela este mai ieftin.
