course:
  title: Persană A1
  description: 'Farsi iranian pentru începători: comparații de bază (mai mare/mai mic, mai scump/mai ieftin, mai înalt/mai tânăr), motivarea unei comparații și o scurtă lectură/un dialog în care se compară două lucruri.'
units:
