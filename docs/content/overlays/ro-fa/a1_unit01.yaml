teaching:
  fa.a1.unit01.lesson01.teach.rtl:
    title: Persana se scrie de la dreapta la stânga
    gloss: Persana se scrie de la dreapta la stânga.
    note: Citește persana de la marginea din dreapta spre stânga.
  fa.a1.unit01.lesson01.teach.seen:
    title: Litera س
    gloss: s
    note: س reprezintă de obicei sunetul s.
  fa.a1.unit01.lesson01.teach.lam:
    title: Litera ل
    gloss: l
    note: ل reprezintă sunetul l și se leagă de literele din jur.
  fa.a1.unit01.lesson01.teach.alef:
    title: Litera ا
    gloss: ā / a
    note: ا marchează adesea un ā lung și nu se leagă de litera următoare.
  fa.a1.unit01.lesson01.teach.mim:
    title: Litera م
    gloss: m
    note: م reprezintă sunetul m și își schimbă forma când se leagă de alte litere.
  fa.a1.unit01.lesson01.teach.salam_shape:
    title: Construiește سلام
    gloss: salut
    note: سلام se citește salâm. Vocalele scurte se omit de obicei în scrierea persană.
    example_gloss: Salut! Eu sunt Nima.
  fa.a1.unit01.lesson02.teach.salam:
    title: Salut
    gloss: salut
    note: سلام se potrivește atât în situații formale, cât și informale.
    example_gloss: Salut, ești bine?
  fa.a1.unit01.lesson02.teach.sobh_bekheyr:
    title: Bună dimineața
    gloss: bună dimineața
    note: صبح بخیر este un salut de dimineață neutru-politicos.
  fa.a1.unit01.lesson02.teach.asr_bekheyr:
    title: Bună ziua sau bună seara
    gloss: bună ziua / bună seara
    note: عصر بخیر se folosește de la sfârșitul după-amiezii până seara.
  fa.a1.unit01.lesson02.teach.khodahafez:
    title: La revedere
    gloss: la revedere
    note: خداحافظ se citește khodâhâfez și este formula obișnuită de rămas-bun.
    example_gloss: La revedere, pe curând!
  fa.a1.unit01.lesson02.teach.mamnoon:
    title: Mulțumesc
    gloss: mulțumesc
    note: ممنون este frecvent și natural; متشکرم este ceva mai formal.
    example_gloss: Vă mulțumesc foarte mult.
  fa.a1.unit01.lesson02.teach.khahesh_mikonam:
    title: Cu plăcere
    gloss: cu plăcere
    note: خواهش می‌کنم este răspunsul obișnuit la mulțumiri.
  fa.a1.unit01.lesson02.teach.hale_shoma:
    title: Ce mai faceți? Formă vorbită politicoasă
    gloss: Ce mai faceți?
    note: حالتون چطوره؟ este persana vorbită în Iran, neutru-politicoasă. حال شما چطور است؟ este varianta mai formală sau scrisă.
  fa.a1.unit01.lesson02.teach.khoobam:
    title: Sunt bine
    gloss: sunt bine
    note: خوبم îmbină خوب cu terminația persoanei întâi ـم.
  fa.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Bună ziua
    gloss: bună ziua
    note: روز بخیر este politicos, dar mai puțin frecvent decât سلام în vorbirea de zi cu zi.
  fa.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Noapte bună
    gloss: noapte bună
    note: شب بخیر este de obicei o urare de rămas-bun sau de culcare, nu un salut de început.
  fa.a1.unit01.lesson03.teach.khosh_amadeed:
    title: Bun venit
    gloss: bun venit
    note: خوش آمدید este forma politicoasă folosită pentru unul sau mai mulți oaspeți.
  fa.a1.unit01.lesson03.teach.be_omide_didar:
    title: Sper să ne revedem
    gloss: sper să ne revedem / până ne vedem din nou
    note: به امید دیدار este un rămas-bun elegant, neutru-politicos.
  fa.a1.unit01.lesson03.teach.fealan:
    title: Pa, deocamdată
    gloss: pa, deocamdată
    note: فعلاً este conversațional și mai puțin formal decât خداحافظ.
  fa.a1.unit01.lesson03.teach.rooze_khoobi:
    title: Zi bună
    gloss: să aveți o zi bună
    note: باشید marchează forma politicoasă în acest rămas-bun fix.
  fa.a1.unit01.lesson04.teach.formal_question:
    title: Formă vorbită neutru-politicoasă
    gloss: Ce mai faceți?
    note: Folosește حالتون چطوره؟ cu un adult necunoscut sau într-o conversație politicoasă obișnuită. Forma explicit formală sau scrisă este حال شما چطور است؟
  fa.a1.unit01.lesson04.teach.informal_question:
    title: Informal
    gloss: Ce mai faceți?
    note: چطوری؟ este conversațional și potrivit cu prietenii, familia și cunoscuții de aceeași vârstă, când relația o permite.
  fa.a1.unit01.lesson04.teach.to:
    title: Forma informală
    gloss: tu
    note: تو este la singular și informal; nu-l folosi implicit cu un adult necunoscut.
  fa.a1.unit01.lesson04.teach.very_well:
    title: Foarte bine
    gloss: sunt foarte bine
    note: خیلی întărește خوبم.
  fa.a1.unit01.lesson04.teach.not_bad:
    title: Nu-i rău
    gloss: Nu mă simt rău, mulțumesc
    note: بد نیستم este un răspuns moderat firesc, nu o plângere.
  fa.a1.unit01.lesson04.teach.and_you_formal:
    title: Și dumneavoastră? Politicos
    gloss: Dar dumneavoastră?
    note: Folosește شما چطور؟ pentru a întoarce politicos întrebarea.
  fa.a1.unit01.lesson04.teach.and_you_informal:
    title: Și tu? Informal
    gloss: Dar dumneavoastră?
    note: تو چطور؟ se potrivește unei relații informale.
  fa.a1.unit01.lesson05.teach.chai:
    title: Ceai
    gloss: ceai
    note: '*چای* este băutura. O vei auzi în oferta *چای بفرمایید* (servește un ceai).'
    example_gloss: Poftiți, doriți un ceai?
  fa.a1.unit01.lesson05.teach.befarmaeed:
    title: Poftiți
    gloss: poftiți / vă rog / luați
    note: '*بفرمایید* se schimbă după situație: poate însemna poftiți (când oferi ceai), intrați vă rog (la o ușă) sau după dumneavoastră.'
  fa.a1.unit01.lesson05.teach.lotf_dareed:
    title: Sunteți amabil
    gloss: sunteți foarte amabil
    note: لطف دارید răspunde politicos la un compliment.
  fa.a1.unit01.lesson05.teach.zahmat_nakeshid:
    title: Vă rog, nu vă deranjați
    gloss: vă rog, nu vă deranjați
    note: زحمت نکشید poate fi un refuz sincer sau un prim răspuns politicos la o ofertă concretă.
  fa.a1.unit01.lesson05.teach.mamnoon_lotf:
    title: Vă mulțumesc pentru amabilitate
    gloss: vă mulțumesc pentru amabilitate
    note: Este mai călduros și mai explicit decât ممنون singur.
  fa.a1.unit01.lesson05.teach.cultural_pattern:
    title: Taarof
    gloss: convenții iraniene de politețe, dependente de context
    note: Taarof desemnează convenții dependente de context pentru a oferi, a refuza, a mulțumi și a arăta respect. Practica diferă după relație, generație, regiune și situație; niciun număr fix de refuzuri sau repetări nu arată dacă o ofertă este sinceră.
  fa.a1.unit01.lesson06.teach.line01:
    title: Bun venit
    gloss: Ali o întâmpină pe Narges.
    note: Schimbul de replici începe cu salutul, înainte de prezentări.
  fa.a1.unit01.lesson06.teach.line02:
    title: Bun venit, răspuns
    gloss: Narges îi răspunde la salut și îi mulțumește.
    note: ممنون (mulțumesc) este un răspuns firesc la urarea de bun venit.
  fa.a1.unit01.lesson06.teach.line03:
    title: Schimb de nume
    gloss: Ali spune cine este.
    note: '*من علی هستم* înseamnă „Eu sunt Ali”. *هستم* (sunt) stă la sfârșitul propoziției.'
  fa.a1.unit01.lesson06.teach.line04:
    title: Schimb de nume, răspuns
    gloss: Narges spune cine este.
    note: Același tipar *من ... هستم* pe care tocmai l-a folosit Ali.
  fa.a1.unit01.lesson06.teach.line05:
    title: Încântat de cunoștință
    gloss: Ali spune că este încântat să o cunoască.
    note: '*خوشوقتم* înseamnă „sunt încântat”. Împreună cu *از آشنایی با شما* formează formula politicoasă obișnuită la o primă întâlnire.'
  fa.a1.unit01.lesson06.teach.line06:
    title: Încântată de cunoștință, răspuns
    gloss: Narges îi întoarce urarea.
    note: همین‌طور înseamnă aici „la fel” sau „și eu”.
  fa.a1.unit01.lesson06.teach.line07:
    title: Întreabă cum se simte cineva
    gloss: Ali o întreabă politicos ce mai face.
    note: Ali folosește forma vorbită neutru-politicoasă cu ـتون, fiindcă este o primă întâlnire politicoasă.
  fa.a1.unit01.lesson06.teach.line08:
    title: Întreabă cum se simte cineva, răspuns
    gloss: Narges răspunde și întoarce întrebarea.
    note: شما چطور؟ reia întrebarea pentru a o întoarce, o scurtătură frecventă.
  fa.a1.unit01.lesson06.teach.line09:
    title: Invitație
    gloss: Ali spune că și el este bine și o invită pe Narges înăuntru.
    note: '*بفرمایید داخل* înseamnă „vă rog, intrați”. *داخل* (înăuntru) arată ce se oferă.'
  fa.a1.unit01.lesson06.teach.line10:
    title: Refuz politicos
    gloss: Narges îi mulțumește, dar explică![](x) că trebuie să plece.
    note: Un refuz politicos începe tot cu mulțumiri, înainte de refuz. *ولی باید برم* înseamnă „dar trebuie să plec”.
  fa.a1.unit01.lesson06.teach.line11:
    title: Încheierea conversației
    gloss: Ali îi recunoaște răspunsul și speră să se revadă.
    note: Invitația refuzată duce firesc la rămas-bun.
  fa.a1.unit01.lesson06.teach.line12:
    title: Încheierea conversației, răspuns
    gloss: Narges își ia rămas-bun.
    note: '*خداحافظ* este formula obișnuită de rămas-bun.'
