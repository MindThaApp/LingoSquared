teaching:
  fa.a1.unit24.lesson01.teach.vaght_azad_phrase:
    title: Timpul liber
    gloss: timpul liber
    note: '*وقت آزاد* înseamnă timp liber -- literal „timp liber/deschis”.'
  fa.a1.unit24.lesson01.teach.sargarmi_word:
    title: Hobby
    gloss: hobby
    note: '*سرگرمی* înseamnă hobby sau pasiune pentru timpul liber.'
    example_gloss: Cititul este un hobby.
  fa.a1.unit24.lesson01.teach.ketab_khoondan_phrase:
    title: Citit de cărți
    gloss: citit de cărți
    note: '*کتاب خوندن* înseamnă literal „citit de carte” -- *کتاب* (carte) a fost învățat mai devreme, *خوندن* (a citi) este nou aici.'
  fa.a1.unit24.lesson01.teach.doost_daram_review:
    title: Îmi ... place
    gloss: îmi place
    note: '*دوست دارم* funcționează la fel cu o activitate ca și cu un obiect: *کتاب خوندن دوست دارم* înseamnă „Îmi place să citesc cărți.”'
  fa.a1.unit24.lesson02.teach.musiqi_review:
    title: Muzică
    gloss: muzică
    note: '*موسیقی* apare din nou aici.'
    example_gloss: Ascult muzică.
  fa.a1.unit24.lesson02.teach.goosh_midam_phrase:
    title: Ascult
    gloss: ascult
    note: '*گوش می‌دم* înseamnă literal „dau ureche” -- modul firesc de a spune „ascult” în farsi.'
  fa.a1.unit24.lesson02.teach.film_review:
    title: Film
    gloss: film
    note: '*فیلم* apare din nou aici.'
    example_gloss: Mă uit la filme.
  fa.a1.unit24.lesson02.teach.mibinam_word:
    title: Mă uit / Văd
    gloss: mă uit / văd
    note: '*می‌بینم* este forma de prezent a verbului al cărui trecut (*دیدم*, „am văzut”) a fost prezentat mai devreme.'
  fa.a1.unit24.lesson03.teach.varzesh_word:
    title: Sport / mișcare
    gloss: sport / mișcare
    note: '*ورزش* înseamnă în general atât „sport”, cât și „mișcare fizică”.'
    example_gloss: Fac sport.
  fa.a1.unit24.lesson03.teach.mikonam_review:
    title: Fac
    gloss: fac
    note: '*می‌کنم* este verbul general „a face” (eu fac), folosit în verbe compuse precum *ورزش می‌کنم* („fac sport”).'
  fa.a1.unit24.lesson03.teach.footbal_word:
    title: Fotbal
    gloss: fotbal
    note: '*فوتبال* înseamnă fotbal.'
    example_gloss: Îmi place fotbalul.
  fa.a1.unit24.lesson03.teach.bazi_phrase:
    title: Joc fotbal
    gloss: joc fotbal
    note: '*بازی* înseamnă joc / a juca. *فوتبال بازی می‌کنم* înseamnă literal „fac joc de fotbal”.'
  fa.a1.unit24.lesson04.teach.hafte_word:
    title: Săptămâna
    gloss: săptămână
    note: '*هفته* înseamnă săptămână.'
    example_gloss: Fac sport în fiecare săptămână.
  fa.a1.unit24.lesson04.teach.har_hafte_phrase:
    title: În fiecare săptămână
    gloss: în fiecare săptămână
    note: '*هر* se combină la fel cu *هفته* și formează *هر هفته* („în fiecare săptămână”).'
  fa.a1.unit24.lesson04.teach.gahi_word:
    title: Uneori
    gloss: uneori
    note: '*گاهی* înseamnă uneori.'
    example_gloss: Uneori citesc cărți.
  fa.a1.unit24.lesson04.teach.free_time_question:
    title: Ce faci în timpul liber?
    gloss: Ce faci în timpul liber?
    note: '*چیکار می‌کنی* a fost prezentat mai devreme; aici este refolosit pentru a întreba special despre timpul liber.'
  fa.a1.unit24.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, personaj introdus în Unitatea 11, apare din nou aici.'
    example_gloss: Nima iubește cititul.
  fa.a1.unit24.lesson05.teach.chand_ta_phrase:
    title: Câteva / câte
    gloss: câteva / câte
    note: '*چند* („câte / mai multe”) se combină cu numărătorul *تا* și înseamnă „câteva” sau „câte” înaintea unui substantiv numărabil.'
  fa.a1.unit24.lesson05.teach.mikhone_word:
    title: El/ea citește
    gloss: el/ea citește
    note: '*می‌خونه* este forma colocvială de persoana a 3-a a verbului *خوندن* („a citi”).'
  fa.a1.unit24.lesson05.teach.ham_word:
    title: De asemenea / și
    gloss: de asemenea / și
    note: '*هم* înseamnă „de asemenea / și”, folosit deja astfel în Unitatea 11.'
    example_gloss: Nima joacă și el fotbal.
  fa.a1.unit24.lesson05.teach.mikone_word:
    title: El/ea face
    gloss: el/ea face
    note: '*می‌کنه* este forma colocvială de persoana a 3-a a lui *می‌کنم* („eu fac”).'
  fa.a1.unit24.lesson05.teach.reading_text:
    title: 'Lectură: timpul liber al lui Nima'
    gloss: Nima iubește cititul. În fiecare săptămână citește câteva cărți. Uneori joacă și fotbal.
    note: '*چند تا* înaintea lui *کتاب* înseamnă „câteva cărți”; *می‌خونه* și *می‌کنه* sunt formele colocviale de persoana a 3-a, folosite când vorbești despre altcineva.'
  fa.a1.unit24.lesson06.teach.sara_review:
    title: Sara
    gloss: Sara
    note: '*سارا*, personaj introdus în Unitatea 14, apare din nou aici.'
    example_gloss: Sarei îi place să se uite la filme.
  fa.a1.unit24.lesson06.teach.didan_word:
    title: A se uita / a vedea
    gloss: a se uita / a vedea
    note: '*دیدن* este infinitivul verbului al cărui prezent (*می‌بینم*) a fost predat în lecția 2 și al cărui trecut (*دیدم*) a fost predat în Unitatea 13.'
    example_gloss: Îmi place să mă uit la filme.
  fa.a1.unit24.lesson06.teach.sinama_miram_phrase:
    title: Merg la cinema
    gloss: merg la cinema
    note: '*سینما* („cinema”) a fost prezentat mai devreme; *می‌رم* („merg”) a apărut în *می‌رم سر کار* („merg la serviciu”).'
  fa.a1.unit24.lesson06.teach.chi_word:
    title: Ce
    gloss: ce
    note: '*چی* înseamnă „ce”, folosit deja astfel în *تو چی؟* („Dar tu?”) din Unitatea 14.'
    example_gloss: Dar tu?
  fa.a1.unit24.lesson06.teach.va_word:
    title: Și
    gloss: și
    note: '*و* înseamnă „și”, folosit deja astfel în Unitatea 14.'
    example_gloss: Îmi place cititul și îmi place fotbalul.
  fa.a1.unit24.lesson06.teach.che_khoob_phrase:
    title: Ce bine!
    gloss: ce bine!
    note: '*چه خوب!* a fost prezentat mai devreme; este o reacție pozitivă frecventă, ca „grozav!”.'
  fa.a1.unit24.lesson06.teach.dialogue_line1:
    title: 'Nima: Sara, ce faci în timpul liber?'
    gloss: Sara, ce faci în timpul liber?
  fa.a1.unit24.lesson06.teach.dialogue_line2:
    title: 'Sara: Îmi place să mă uit la filme...'
    gloss: Îmi place să mă uit la filme. În fiecare săptămână merg la cinema. Dar tu?
  fa.a1.unit24.lesson06.teach.dialogue_line3:
    title: 'Nima: Îmi place să citesc...'
    gloss: Îmi place să citesc. Uneori joc și fotbal.
  fa.a1.unit24.lesson06.teach.dialogue_line4:
    title: 'Sara: Ce bine!'
    gloss: Ce bine!
