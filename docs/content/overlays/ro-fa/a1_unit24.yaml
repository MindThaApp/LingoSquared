course:
  title: Persană A1
  description: 'Farsi iranian pentru începători: ce înseamnă hobby și timp liber, patru activități de zi cu zi (cititul, ascultatul muzicii, vizionarea filmelor, sportul/fotbalul), cât de des le faci, cum întrebi pe cineva ce face în timpul liber, un scurt text despre hobby-urile lui نیما și un dialog final între نیما și سارا.'
