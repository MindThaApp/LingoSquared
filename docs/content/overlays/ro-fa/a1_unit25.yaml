course:
  title: Persană A1
  description: 'Persana iraniană pentru începători: descrierea înălțimii unei persoane (înalt/scund), a părului (lungime și culoare: negru, blond), a culorii ochilor (căprui, verzi, albaștri) și a faptului că poartă ochelari, întrebarea „Cum arată?”, un scurt text despre înfățișarea lui نیما și un dialog final între نیما și سارا despre recunoașterea prietenei Sarei, مریم.'
