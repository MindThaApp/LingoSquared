teaching:
  fa.a1.unit25.lesson01.teach.oo_review:
    title: El / ea
    gloss: el / ea
    note: '*او* apare din nou aici ca subiect în descrierile fizice.'
  fa.a1.unit25.lesson01.teach.ghad_review:
    title: Înălțimea
    gloss: înălțime
    note: '*قد* apare din nou aici singur. *قدش* adaugă sufixul posesiv *-ش* (înălțimea lui/ei), același tipar ca *امتحانش* din Unitatea 20.'
    example_gloss: Nima este înalt.
  fa.a1.unit25.lesson01.teach.boland_word:
    title: Înalt
    gloss: înalt
    note: '*بلند* înseamnă înalt (sau lung). *قدش بلنده* înseamnă literal „înălțimea lui/ei este înaltă” -- modul colocvial firesc de a spune că cineva este înalt.'
    example_gloss: Înălțimea lui este mare.
  fa.a1.unit25.lesson01.teach.kotah_word:
    title: Scund
    gloss: scund
    note: '*کوتاه* înseamnă scund.'
    example_gloss: Înălțimea lui este mică.
  fa.a1.unit25.lesson02.teach.mo_word:
    title: Părul
    gloss: păr
    note: '*مو* înseamnă păr. *موی* este forma cu ezafe (de legătură), folosită înaintea unui adjectiv, ca în *موی بلند* (păr lung).'
    example_gloss: Are părul lung.
  fa.a1.unit25.lesson02.teach.moohash_word:
    title: Părul lui / ei
    gloss: părul lui / ei
    note: '*موهاش* combină pluralul *موها* (firele de păr) cu sufixul posesiv *-ش* -- „părul lui/ei”.'
  fa.a1.unit25.lesson02.teach.meshki_word:
    title: Negru
    gloss: negru
    note: '*مشکی* este cuvântul colocvial obișnuit pentru părul/ochii negri -- mai firesc aici decât *سیاه* din Unitatea 20, care se potrivește mai bine la haine decât la păr.'
    example_gloss: Părul ei este negru.
  fa.a1.unit25.lesson02.teach.bolond_word:
    title: Blond
    gloss: blond
    note: '*بلوند* (un împrumut) înseamnă blond.'
    example_gloss: Părul ei este blond.
  fa.a1.unit25.lesson03.teach.cheshm_word:
    title: Ochi
    gloss: ochi
    note: '*چشم* înseamnă ochi. *چشمای* este forma colocvială de plural + ezafe (ochii...), ca în *چشمای آبی* (ochi albaștri).'
    example_gloss: Are ochi căprui.
  fa.a1.unit25.lesson03.teach.cheshmash_word:
    title: Ochii lui / ei
    gloss: ochii lui / ei
    note: '*چشماش* combină pluralul colocvial *چشما* cu sufixul posesiv *-ش* -- „ochii lui/ei”. Observă că *چشماش آبیه* folosește terminația de singular *-ه* deși *چشما* e la plural -- este normal în persană, unde lucrurile la plural care nu sunt persoane primesc de obicei verbul la singular.'
  fa.a1.unit25.lesson03.teach.ghahveei_word:
    title: Căprui
    gloss: căprui
    note: '*قهوه‌ای* (literal „de culoarea cafelei”) înseamnă căprui.'
    example_gloss: Ochii ei sunt căprui.
  fa.a1.unit25.lesson03.teach.sabz_word:
    title: Verde
    gloss: verde
    note: '*سبز* înseamnă verde.'
    example_gloss: Ochii ei sunt verzi.
  fa.a1.unit25.lesson03.teach.abi_review:
    title: Albastră
    gloss: albastru
    note: '*آبی* apare din nou aici pentru culoarea ochilor.'
    example_gloss: Ochii ei sunt albaștri.
  fa.a1.unit25.lesson04.teach.man_review:
    title: eu
    gloss: eu
    note: '*من*, deja bine cunoscut, apare din nou aici pentru autodescriere.'
    example_gloss: Am părul castaniu.
  fa.a1.unit25.lesson04.teach.daram_review:
    title: Am / el-ea are
    gloss: am / el-ea are
    note: '*دارم*/*داره* se folosesc la fel și pentru o trăsătură fizică: *موی مشکی دارم* înseamnă „Am părul negru”.'
  fa.a1.unit25.lesson04.teach.eynak_word:
    title: Ochelari
    gloss: ochelari
    note: '*عینک* înseamnă ochelari (de vedere).'
    example_gloss: El poartă ochelari.
  fa.a1.unit25.lesson04.teach.mizane_word:
    title: El/ea poartă
    gloss: el/ea poartă
    note: '*می‌زنه* (literal „lovește”) este verbul firesc pentru purtatul ochelarilor: *عینک می‌زنه* înseamnă „poartă ochelari”. Este alt verb decât *می‌کنم* (a face) din Unitatea 8 și Unitatea 24.'
  fa.a1.unit25.lesson04.teach.che_shekliye_phrase:
    title: Cum arată el/ea?
    gloss: cum arată el/ea?
    note: '*چه شکلیه؟* înseamnă literal „ce formă are?” și este modul colocvial obișnuit de a întreba cum arată cineva.'
  fa.a1.unit25.lesson04.teach.va_review:
    title: Și
    gloss: și
    note: '*و* înseamnă „și” și a fost folosit astfel încă din Unitatea 14 și Unitatea 24.'
    example_gloss: Este înalt și are părul negru.
  fa.a1.unit25.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, personaj introdus încă din Unitatea 11, apare din nou aici.'
    example_gloss: Nima este prietenul Sarei.
  fa.a1.unit25.lesson05.teach.reading_text:
    title: 'Lectură: Aspectul lui Nima'
    gloss: Nima este înalt. Are părul negru și ochii căprui. Poartă ochelari.
    note: Această lectură reia toate construcțiile din lecțiile 1-4, aproape fără vocabular nou; important este să le recunoști într-un text continuu.
  fa.a1.unit25.lesson06.teach.maryam_name:
    title: Maryam
    gloss: Maryam
    note: '*مریم* este un personaj nou, o prietenă a lui سارا pe care نیما încă n-a cunoscut-o.'
    example_gloss: Maryam este prietena Sarei.
  fa.a1.unit25.lesson06.teach.alan_review:
    title: Acum
    gloss: acum
    note: '*الان* apare din nou aici.'
    example_gloss: Maryam vine acum.
  fa.a1.unit25.lesson06.teach.miad_word:
    title: Vine
    gloss: vine
    note: '*میاد* este forma colocvială de prezent a verbului *آمدن* (a veni).'
    example_gloss: Maryam vine acum.
  fa.a1.unit25.lesson06.teach.rangiye_phrase:
    title: De ce culoare este?
    gloss: de ce culoare este?
    note: '*چه رنگیه؟* combină *چه* (ce, din lecția 4) cu *رنگی* (colorat, din *رنگ* + *-ی*) + *-ه* (este): „de ce culoare este?”'
  fa.a1.unit25.lesson06.teach.bashe_mamnoon_review:
    title: Bine, mulțumesc
    gloss: bine, mulțumesc
    note: '*باشه* și *ممنون*, învățate deja, se combină aici într-o replică firească de încheiere.'
  fa.a1.unit25.lesson06.teach.dialogue_line1:
    title: 'Sara: Maryam vine acum.'
    gloss: Maryam vine acum.
  fa.a1.unit25.lesson06.teach.dialogue_line2:
    title: 'Nima: Cum arată Maryam?'
    gloss: Cum arată Maryam?
  fa.a1.unit25.lesson06.teach.dialogue_line3:
    title: 'Sara: E înaltă și are părul negru.'
    gloss: Este înaltă și are părul negru.
  fa.a1.unit25.lesson06.teach.dialogue_line4:
    title: 'Nima: De ce culoare are ochii?'
    gloss: De ce culoare are ochii?
  fa.a1.unit25.lesson06.teach.dialogue_line5:
    title: 'Sara: Are ochii căprui.'
    gloss: Are ochii căprui.
  fa.a1.unit25.lesson06.teach.dialogue_line6:
    title: 'Nima: Bine, mulțumesc.'
    gloss: Bine, mulțumesc.
