    title: Apoi o prăjesc în ulei
    gloss: Apoi o prăjesc în ulei
    note: '*تو* înseamnă „în”. *سرخش می‌کنم* atașează clitica de complement *-ش* („o/îl”) la *سرخ می‌کنم* și înseamnă „o prăjesc”.'
