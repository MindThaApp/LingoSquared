    title: Ghormeh sabzi
    gloss: ghormeh sabzi (tocană persană cu ierburi)
    note: '*قرمه‌سبزی* este o tocană iraniană cunoscută, cu ierburi aromatice și fasole, un fel de mâncare obișnuit gătit acasă.'
    example_gloss: Gătesc ghormeh sabzi.
  fa.a1.unit35.lesson04.teach.dialogue_line1:
    title: 'Nima: Bună, ce gătești?'
    gloss: Bună, ce gătești?
  fa.a1.unit35.lesson04.teach.dialogue_line2:
    title: 'Sara: Gătesc ghormeh sabzi.'
    gloss: Gătesc ghormeh sabzi.
  fa.a1.unit35.lesson04.teach.dialogue_line3:
    title: 'Nima: Vrei ajutor?'
    gloss: Vrei ajutor?
  fa.a1.unit35.lesson04.teach.dialogue_line4:
    title: 'Sara: Da, te rog, taie ceapa.'
    gloss: Da, te rog, taie ceapa.
  fa.a1.unit35.lesson04.teach.dialogue_line5:
    title: 'Nima: Bine.'
    gloss: Bine.
  fa.a1.unit35.lesson04.teach.dialogue_line6:
    title: 'Sara: Mulțumesc, mâncarea va ieși foarte gustoasă.'
    gloss: Mulțumesc, mâncarea va ieși foarte gustoasă.
  fa.a1.unit35.lesson05.teach.reading_text:
    title: 'Lectură: Sara gătește ghormeh sabzi'
    gloss: Sara este în bucătărie. Ea gătește ghormeh sabzi. Întâi Nima taie ceapa, apoi Sara o prăjește în ulei. Pune și sare. Mâncarea fierbe încet și iese foarte gustoasă.
    note: Textul reia acțiunile din dialog folosind verbe la persoana a treia; ca în dialog, Nima este cel care taie ceapa.
  fa.a1.unit35.lesson05.teach.reading_note:
    title: El/ea gătește / face / toarnă / devine
    gloss: el/ea gătește / face / toarnă / devine
    note: '*می‌پزه*, *می‌کنه*, *می‌ریزه* și *می‌شه* sunt formele colocviale de persoana a treia ale verbelor folosite mai devreme la persoana întâi.'
  fa.a1.unit35.lesson06.teach.like_but_time:
    title: Îmi place să gătesc, dar nu am timp
    gloss: Îmi place să gătesc, dar nu am timp
    note: '*دوست دارم* înseamnă „îmi place”. *ولی* înseamnă „dar”. *وقت ندارم* înseamnă „nu am timp”.'
