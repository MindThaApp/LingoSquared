    gloss: Nima / Sara / bună / bine / mulțumesc
    note: '*نیما* și *سارا* sunt numele care revin. *سلام* înseamnă „bună”. *باشه* înseamnă „bine, de acord”. *مرسی* înseamnă „mulțumesc”.'
