  fa.a1.unit35.lesson01.teach.namak:
    title: Sarea
    gloss: sare
    note: '*نمک* înseamnă „sare”.'
    example_gloss: Dă-mi sarea.
  fa.a1.unit35.lesson01.teach.roghan:
    title: Uleiul
    gloss: ulei
    note: '*روغن* înseamnă „ulei de gătit”.'
    example_gloss: Uleiul este în tigaie.
  fa.a1.unit35.lesson01.teach.review_want_kitchen:
    title: Vreau / bucătărie / un, o
    gloss: vreau / bucătărie / un, o
    note: '*می‌خوام* este forma colocvială pentru „vreau”. *آشپزخانه* înseamnă „bucătărie”. *یه* este forma colocvială a lui *یک* („un, o”).'
    target_text: می‌خوام (vreau) / آشپزخانه (bucătărie) / یه (un/o)
  fa.a1.unit35.lesson01.teach.want_cook:
    title: Vreau să gătesc
    gloss: Vreau să gătesc
    note: '*کنم* este conjunctivul „eu fac”, folosit după *می‌خوام* împreună cu *آشپزی* cu sensul „a găti”.'
  fa.a1.unit35.lesson02.teach.chop_onion:
    title: Tai ceapa
    gloss: Tai ceapa
    note: '*رو* marchează aici complementul direct (formă colocvială pentru *را*). *خرد می‌کنم* înseamnă „tai mărunt”.'
  fa.a1.unit35.lesson02.teach.pour_oil:
    title: Torn uleiul
    gloss: Torn uleiul
    note: '*می‌ریزم* înseamnă „torn”.'
  fa.a1.unit35.lesson02.teach.fry_onion:
    title: Prăjesc ceapa
    gloss: Prăjesc ceapa
    note: '*سرخ می‌کنم* înseamnă „prăjesc”.'
  fa.a1.unit35.lesson02.teach.review_chop_fry:
    title: A toca / a prăji / a turna
    gloss: a tăia mărunt / a prăji / a turna
    note: '*خرد کردن* este infinitivul „a tăia mărunt”; *سرخ کردن* este „a prăji”; *ریختن* este „a turna”.'
    target_text: خرد کردن (a toca) / سرخ کردن (a prăji) / ریختن (a turna)
  fa.a1.unit35.lesson02.teach.add_salt:
    title: Pun sare
    gloss: Pun sare
    note: '*نمک می‌ریزم* înseamnă literal „torn sare” și este modul natural de a spune „pun sare”.'
  fa.a1.unit35.lesson03.teach.review_first_then:
    title: Mai întâi / apoi
    gloss: întâi / apoi
