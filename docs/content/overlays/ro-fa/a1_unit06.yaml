      status: correct
    - value: یک آب می‌خواستم، لطفاً
      status: correct
    - value: یه آب می‌خواستم لطفاً
      status: correct
    - value: یه آب می‌خواستم، لطفاً
      status: correct
    - value: یک آب لطفاً
      status: correct
    feedback: یک آب می‌خواستم لطفاً comandă politicos apă.
  fa.a1.unit06.lesson02.exercise08.speak_order:
    instruction: Comanzi la un chelner pe care nu l-ai mai întâlnit. Cere politicos o cafea.
    accepted_answers:
