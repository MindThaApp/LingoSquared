    - value: یک قهوه می‌خواستم
      status: correct
    - value: یک قهوه می‌خواستم، لطفاً
      status: correct
    - value: یه قهوه می‌خواستم
      status: correct
    - value: یه قهوه می‌خواستم لطفاً
      status: correct
    - value: یه قهوه می‌خواستم، لطفاً
      status: correct
    - value: یک قهوه لطفاً
      status: correct
    feedback: می‌خواستم este registrul potrivit pentru un chelner pe care nu îl cunoști.
  fa.a1.unit06.lesson03.exercise01.recognize_menu_question:
    instruction: Ce se întreabă în această întrebare?
    correct_option: Aveți meniul?
    distractors:
    - Ce recomandați?
    - Ce doriți? (întrebarea chelnerului)
    - Puteți aduce nota de plată, vă rog?
    accepted_answers:
