course:
  title: Persană A1
  description: 'Persană iraniană pentru începători: vocabular despre mâncare și băuturi, comandatul politicos la restaurant, întrebări despre meniu și recomandări, cantități și eticheta de la restaurant, inclusiv cererea notei de plată.'
units:
  fa.a1.unit06.food:
    title: Mâncarea și comandatul unei mese
lessons:
  fa.a1.unit06.lesson01.food_and_drink_vocabulary:
    title: Mâncare și băutură
  fa.a1.unit06.lesson02.polite_ordering_register:
    title: Comandă politicos
  fa.a1.unit06.lesson03.menu_and_recommendation:
    title: Întreabă despre meniu și cere o recomandare
  fa.a1.unit06.lesson04.quantities:
    title: Comandă cantități precise
  fa.a1.unit06.lesson05.restaurant_etiquette:
    title: Eticheta la restaurant și nota de plată
  fa.a1.unit06.lesson06.restaurant_dialogue:
    title: O conversație completă la restaurant
teaching:
  fa.a1.unit06.lesson01.teach.naan:
    title: Pâine
    gloss: pâine
    note: نان este baza oricărei mese iraniene, de obicei pâine plată servită cu aproape orice.
    example_gloss: Îmi place pâinea.
  fa.a1.unit06.lesson01.teach.berenj:
    title: Orezul
    gloss: orez
    note: برنج este o parte centrală a majorității felurilor principale iraniene.
    example_gloss: Orezul cu pui este delicios.
  fa.a1.unit06.lesson01.teach.morgh:
    title: Puiul
    gloss: pui
    note: مرغ înseamnă atât pasărea, cât și carnea ei.
    example_gloss: Mănânc pui.
  fa.a1.unit06.lesson01.teach.ab:
    title: Apa
    gloss: apă
    note: آب este cuvântul obișnuit pentru apă.
    example_gloss: Vreau apă.
  fa.a1.unit06.lesson01.teach.chai:
    title: Ceai
    gloss: ceai
    note: چای este băutura oferită aproape peste tot în Iran, deja întâlnită în lecția despre taarof din Unitatea 1.
    example_gloss: Un ceai, vă rog.
  fa.a1.unit06.lesson01.teach.ghahve:
    title: Cafea
    gloss: cafea
    note: قهوه este tot mai răspândită în orașele iraniene, alături de ceai.
    example_gloss: Cafeaua este fierbinte.
  fa.a1.unit06.lesson01.teach.mive:
    title: Fructele
    gloss: fructe
    note: میوه este un cuvânt general care acoperă orice fruct.
    example_gloss: Îmi plac fructele.
  fa.a1.unit06.lesson01.teach.va_ya:
    title: Și / sau
    gloss: و (și), یا (sau)
    note: Ambele sunt conectori frecvenți, folosiți pentru a lega mâncăruri și băuturi într-o comandă.
    target_text: و (și)، یا (sau)
  fa.a1.unit06.lesson02.teach.mikhastam_chai:
    title: Comandă politicos un ceai
    gloss: Aș dori un ceai.
    note: می‌خواستم este literal o formă de trecut a verbului „a vrea”, dar funcționează ca o cerere politicoasă, atenuată – registrul firesc față de un chelner sau un vânzător pe care nu-l cunoști.
  fa.a1.unit06.lesson02.teach.lotfan:
    title: Vă rog
    gloss: vă rog
    note: لطفاً poate fi adăugat pentru a atenua aproape orice cerere.
    example_gloss: Vă rog, ajutați-mă.
  fa.a1.unit06.lesson02.teach.mikham_informal:
    title: Comandă informal un ceai
    gloss: Vreau un ceai.
    note: یه چای می‌خوام folosește colocvialul informal یه (un/o) și می‌خوام (vreau) – folosește-l cu un prieten apropiat sau cu familia, nu cu un chelner pe care tocmai l-ai cunoscut.
  fa.a1.unit06.lesson02.teach.register_note:
    title: Alegerea verbului potrivit pentru comandă
    gloss: Folosește می‌خواستم cu un necunoscut sau cu un chelner; folosește می‌خوام doar cu un prieten apropiat.
    note: Aceasta este versiunea, pentru comandat, a diferenței de registru stabilite deja pentru salutări în Unitatea 1.
  fa.a1.unit06.lesson02.teach.mikhastam_naan:
    title: Comandă politicos pâine
    gloss: Aș dori niște pâine.
    note: Același tipar cu می‌خواستم se aplică oricărui substantiv de mâncare sau băutură.
  fa.a1.unit06.lesson03.teach.menu_word:
    title: Meniu
    gloss: meniu
    note: منو este un împrumut din franceză/engleză, folosit la fel ca „meniu” în română.
    example_gloss: Meniul, vă rog.
  fa.a1.unit06.lesson03.teach.menu_question:
    title: Cere meniul
    gloss: Aveți meniul?
    note: منو دارید؟ înseamnă literal „aveți meniul?”, modul obișnuit de a-l cere.
  fa.a1.unit06.lesson03.teach.recommend_question:
    title: Cere o recomandare
    gloss: Ce recomandați?
    note: چی توصیه می‌کنید؟ este o întrebare firească și frecventă adresată unui chelner.
  fa.a1.unit06.lesson03.teach.waiter_question:
    title: Ce te întreabă chelnerul
    gloss: Ce doriți?
    note: چی میل دارید؟ este modul politicos și standard prin care un chelner începe schimbul de replici al comenzii.
  fa.a1.unit06.lesson03.teach.jooje_kabab:
    title: Kebab de pui
    gloss: kebab de pui
    note: جوجه‌کباب (pui marinat la grătar) este unul dintre cele mai frecvente feluri din meniurile iraniene.
    example_gloss: Comand kebab de pui.
  fa.a1.unit06.lesson03.teach.khoobe:
    title: Chelnerul recomandă felul de mâncare
    gloss: Kebabul de pui este foarte bun azi.
    note: خوبه este forma contrasă din limba vorbită a lui خوب است, firească în recomandarea relaxată a unui chelner.
  fa.a1.unit06.lesson03.teach.bale_befarmaeed:
    title: Da, poftiți
    gloss: Da, poftiți.
    note: بله înseamnă „da”; بفرمایید (întâlnit deja în lecția despre taarof din Unitatea 1) se folosește și aici când întinzi cuiva ceva, de exemplu un meniu.
  fa.a1.unit06.lesson04.teach.yek_livan:
    title: Un pahar de ceai
    gloss: un pahar de ceai
    note: لیوان (pahar) este cuvântul de numărare pentru băuturile servite în pahar.
  fa.a1.unit06.lesson04.teach.do_ta_naan:
    title: Două bucăți de pâine
    gloss: două bucăți de pâine
    note: تا este un cuvânt de numărare plasat după un număr când numeri majoritatea obiectelor obișnuite; aici, două bucăți de pâine.
  fa.a1.unit06.lesson04.teach.yek_boshghab:
    title: O farfurie de orez
    gloss: o farfurie de orez
    note: بشقاب (farfurie) este cuvântul de numărare pentru mâncarea servită în farfurie.
  fa.a1.unit06.lesson04.teach.combined_order:
    title: Combină o comandă completă
    gloss: O farfurie de orez și două bucăți de pâine, vă rog.
    note: Mai multe expresii de cantitate pot fi unite cu و (și) într-o singură comandă.
  fa.a1.unit06.lesson04.teach.se_ta:
    title: Cuvântul de numărare تا
    gloss: 'تا se pune după un număr pentru lucrurile numărabile: دو تا (două), سه تا (trei).'
    note: Este același tipar general de numărare predat cu numerele în Unitatea 3, aplicat aici la comandatul mâncării.
  fa.a1.unit06.lesson05.teach.hesab_word:
    title: Nota de plată
    gloss: nota de plată
    note: صورت‌حساب este cuvântul standard pentru nota de plată de la restaurant.
    example_gloss: Nota de plată, vă rog.
  fa.a1.unit06.lesson05.teach.bill_request:
    title: Cere nota de plată
    gloss: Ați putea să aduceți nota de plată, vă rog?
    note: صورت‌حساب رو لطف می‌کنید؟ este un mod politicos și firesc de a cere nota la restaurant.
  fa.a1.unit06.lesson05.teach.khoshmaze:
    title: Spune că mâncarea a fost delicioasă
    gloss: A fost foarte delicios.
    note: خیلی خوشمزه بود este un compliment firesc adresat chelnerului sau gazdei după masă.
  fa.a1.unit06.lesson05.teach.nooshe_jan:
    title: Poftă bună
    gloss: Poftă bună
    note: نوش جان se spune cuiva care mănâncă sau este pe cale să mănânce, aproximativ echivalent cu „poftă bună”; nu îl spune cel care mănâncă despre propria mâncare.
  fa.a1.unit06.lesson05.teach.chashm:
    title: Confirmarea politicoasă a chelnerului
    gloss: Imediat.
    note: چشم، الان میارم este o modalitate respectuoasă prin care personalul confirmă o cerere și spune că aduce imediat ce s-a cerut.
  fa.a1.unit06.lesson06.teach.restaurant_word:
    title: Restaurant
    gloss: restaurant
    note: رستوران este cuvântul obișnuit pentru „restaurant”, locul în care se desfășoară dialogul din această unitate.
    example_gloss: Restaurantul acesta este bun.
  fa.a1.unit06.lesson06.teach.turn01:
    title: Chelnerul îl salută pe client
    gloss: Chelnerul îl primește pe client și îl întreabă ce dorește.
    note: چی میل دارید؟ este aceeași întrebare politicoasă de început din lecția 3.
  fa.a1.unit06.lesson06.teach.turn02:
    title: Clientul cere meniul
    gloss: Clientul îl salută pe chelner și cere meniul.
    note: منو دارید؟ deschide schimbul de replici pentru comandă.
  fa.a1.unit06.lesson06.teach.turn03:
    title: Chelnerul oferă meniul
    gloss: Chelnerul confirmă și înmânează meniul.
    note: بفرمایید este aceeași formulă politicoasă de ofertă din Unitatea 1, folosită aici când întinzi cuiva ceva.
  fa.a1.unit06.lesson06.teach.turn04:
    title: Clientul cere o recomandare
    gloss: Clientul îl întreabă pe chelner ce recomandă.
    note: چی توصیه می‌کنید؟ din lecția 3.
  fa.a1.unit06.lesson06.teach.turn05:
    title: Chelnerul recomandă un preparat
    gloss: Chelnerul spune că kebabul de pui este foarte bun azi.
    note: جوجه‌کباب امروز خیلی خوبه folosește forma colocvială خوبه, firească în recomandările vorbite.
  fa.a1.unit06.lesson06.teach.turn06:
    title: Clientul face comanda completă
    gloss: Clientul acceptă și comandă kebab de pui cu orez, plus un ceai.
    note: Aici se folosește می‌خواستم, potrivit pentru un chelner pe care clientul nu îl cunoaște personal.
  fa.a1.unit06.lesson06.teach.turn07:
    title: Chelnerul confirmă comanda
    gloss: Chelnerul spune că aduce imediat.
    note: چشم، الان میارم din lecția 5.
  fa.a1.unit06.lesson06.teach.turn08:
    title: Clientul laudă mâncarea și cere nota de plată
    gloss: Clientul spune că a fost foarte gustos și cere nota de plată.
    note: Ambele expresii reiau direct vocabularul din lecția 5.
  fa.a1.unit06.lesson06.teach.turn09:
    title: Chelnerul aduce nota de plată
    gloss: Chelnerul acceptă și spune că aduce imediat.
    note: البته („desigur”) este un răspuns afirmativ politicos și firesc aici.
exercises:
  fa.a1.unit06.lesson01.exercise01.recognize_naan:
    instruction: Ce înseamnă acest cuvânt?
    correct_option: pâine
    distractors:
    - orez
    - pui
    - fructe
    accepted_answers:
    - value: pâine
      status: correct
    feedback: نان înseamnă pâine.
  fa.a1.unit06.lesson01.exercise02.recognize_drinks:
    instruction: Care dintre acestea este o băutură, nu o mâncare?
    correct_option: چای
    distractors:
    - نان
    - برنج
    - مرغ
    accepted_answers:
    - value: چای
      status: correct
    feedback: چای („ceai”) este o băutură; celelalte sunt mâncăruri.
  fa.a1.unit06.lesson01.exercise03.recognize_naan_reading:
    instruction: Ce înseamnă acest cuvânt?
    correct_option: pâine
    distractors:
    - cafea
    - ceaiul
    - apă
    accepted_answers:
    - value: pâine
      status: correct
    feedback: نان înseamnă pâine.
