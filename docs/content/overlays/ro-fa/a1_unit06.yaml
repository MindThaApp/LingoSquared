        مرغ: pui
        آب: apă
        چای: ceai
        قهوه: cafea
        میوه: fructe
      status: correct
    feedback: Aceste șapte cuvinte acoperă vocabularul de bază al mâncărurilor și băuturilor din această unitate.
    pairs:
    - left: نان
      right: pâine
    - left: برنج
      right: orezul
    - left: مرغ
      right: pui
    - left: آب
      right: apă
    - left: چای
      right: ceai
    - left: قهوه
      right: cafea
    - left: میوه
      right: fructe
  fa.a1.unit06.lesson01.exercise05.order_food_word:
    instruction: Aranjează cuvintele pentru a spune pâine și orez și pui.
    accepted_answers:
    - value:
      - نان
      - و
      - برنج
      - و
      - مرغ
      status: correct
    feedback: نان و برنج و مرغ enumeră trei mâncăruri legate prin و.
  fa.a1.unit06.lesson01.exercise06.translate_fruit:
    instruction: 'Tradu în persană: fructe.'
    accepted_answers:
    - value: میوه
      status: correct
    feedback: میوه înseamnă fruct, fructe.
  fa.a1.unit06.lesson01.exercise07.write_own_drink:
    instruction: 'Scrie în persană cuvântul pentru o băutură care îți place: ceai sau cafea.'
    accepted_answers:
    - value: چای
      status: correct
    - value: قهوه
      status: correct
    feedback: Se acceptă atât چای, cât și قهوه.
  fa.a1.unit06.lesson02.exercise01.recognize_polite_order:
    instruction: Ce înseamnă această expresie?
    correct_option: Aș dori un ceai. (politicos)
    distractors:
    - Vreau un ceai. (informal)
    - Aveți ceai?
    - Ceaiul este bun.
    accepted_answers:
    - value: Aș dori un ceai. (politicos)
      status: correct
    feedback: می‌خواستم este forma politicoasă de comandă pentru cineva pe care nu îl cunoști bine.
  fa.a1.unit06.lesson02.exercise02.recognize_informal_order:
    instruction: یه چای می‌خوام se potrivește când vorbești cu...
    correct_option: un prieten apropiat, când faci ceai acasă
    distractors:
    - un chelner pe care tocmai l-ai cunoscut
    - un vânzător pe care nu îl cunoști
    - o persoană în vârstă la o cină formală
    accepted_answers:
    - value: un prieten apropiat, când faci ceai acasă
      status: correct
    feedback: می‌خوام este informal și colocvial, rezervat contextelor apropiate și familiare.
  fa.a1.unit06.lesson02.exercise03.recognize_polite_order_reading:
    instruction: Ce înseamnă această expresie?
    correct_option: Aș dori un ceai, vă rog. (politicos)
    distractors:
    - Vreau un ceai. (informal)
    - Aveți meniul?
    - Ce recomandați?
    accepted_answers:
    - value: Aș dori un ceai, vă rog. (politicos)
      status: correct
    feedback: یک چای می‌خواستم، لطفاً înseamnă „Aș dori un ceai, vă rog” (politicos).
  fa.a1.unit06.lesson02.exercise04.match_register:
    instruction: Asociază fiecare verb de comandă cu situația în care se folosește.
    accepted_answers:
    - value:
        می‌خواستم: aș dori (politicos)
        می‌خوام: vreau (informal)
      status: correct
    feedback: Cele două forme diferă doar prin registru, nu prin ceea ce se comandă.
    pairs:
    - left: می‌خواستم
      right: aș dori (politicos)
    - left: می‌خوام
      right: vreau (informal)
  fa.a1.unit06.lesson02.exercise05.order_polite_naan:
    instruction: Aranjează cuvintele pentru a comanda politicos pâine.
    accepted_answers:
    - value:
      - یک
      - نان
      - می‌خواستم
      status: correct
    feedback: یک نان می‌خواستم comandă politicos pâine.
  fa.a1.unit06.lesson02.exercise06.translate_informal_order:
    instruction: 'Tradu în persană: Vreau un ceai. (informal)'
    accepted_answers:
    - value: یه چای می‌خوام
      status: correct
    - value: من یه چای می‌خوام
      status: correct
    - value: یک چای می‌خوام
      status: correct
    - value: یه چای می‌خوام.
      status: correct
    feedback: یه چای می‌خوام înseamnă „Vreau un ceai” (informal).
  fa.a1.unit06.lesson02.exercise07.translate_polite_water:
    instruction: 'Tradu în persană: Aș dori un pahar cu apă, vă rog.'
    accepted_answers:
