    feedback: منو دارید؟ înseamnă literal „aveți meniul?”.
  fa.a1.unit06.lesson03.exercise02.recognize_recommend_question:
    instruction: Ce se întreabă în această întrebare?
    correct_option: Ce recomandați?
    distractors:
    - Aveți meniul?
    - Ce doriți? (întrebarea chelnerului)
    - A fost foarte gustos.
    accepted_answers:
    - value: Ce recomandați?
      status: correct
    feedback: چی توصیه می‌کنید؟ întreabă ce sugerează chelnerul.
  fa.a1.unit06.lesson03.exercise03.recognize_menu_question_reading:
    instruction: Ce se întreabă în această întrebare?
    correct_option: Aveți meniul?
    distractors:
    - Ce recomandați?
    - Puteți aduce nota de plată?
    - Ce îți dorești?
    accepted_answers:
    - value: Aveți meniul?
      status: correct
    feedback: منو دارید؟ înseamnă „aveți meniul?”.
  fa.a1.unit06.lesson03.exercise04.match_restaurant_questions:
    instruction: Asociază fiecare întrebare sau expresie de la restaurant cu sensul ei.
    accepted_answers:
    - value:
        منو دارید؟: Aveți meniul?
        چی توصیه می‌کنید؟: Ce recomandați?
        چی میل دارید؟: Ce doriți? (întreabă chelnerul)
        جوجه‌کباب امروز خیلی خوبه: Kebabul de pui este foarte bun azi
        بله، بفرمایید: Da, poftiți
