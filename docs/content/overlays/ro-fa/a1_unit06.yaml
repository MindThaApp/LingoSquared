      right: Aveți meniul?
    - left: چی توصیه می‌کنید؟
      right: Ce recomandați?
    - left: چی میل دارید؟
      right: Ce doriți? (întreabă chelnerul)
    - left: جوجه‌کباب امروز خیلی خوبه
      right: Kebabul de pui este foarte bun azi
    - left: بله، بفرمایید
      right: Da, poftiți
