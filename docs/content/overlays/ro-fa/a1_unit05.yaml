    title: Mergeți drept; hotelul este lângă restaurant
    gloss: 'Trecător: Mergeți drept înainte. Apoi, în dreapta, este un restaurant. Hotelul este lângă acel restaurant.'
    note: کنار înseamnă „lângă”; همون رستورانه trimite la restaurantul tocmai menționat.
  fa.a1.unit05.lesson04.teach.dialogue_line3:
    title: Mulțumesc
    gloss: 'Sara: Mulțumesc.'
    note: Sara îi mulțumește trecătorului.
