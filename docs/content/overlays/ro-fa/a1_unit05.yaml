    note: همون este forma vorbită obișnuită a lui همان și trimite la restaurantul tocmai menționat.
    example_gloss: Chiar restaurantul acela este bun.
  fa.a1.unit05.lesson04.teach.dialogue_line1:
    title: Scuzați-mă, unde este hotelul Azadi?
    gloss: 'Sara: Scuzați-mă, unde este hotelul Azadi?'
    note: Sara este personajul cunoscut din Unitatea 2.
