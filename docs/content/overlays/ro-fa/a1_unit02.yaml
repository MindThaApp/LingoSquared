course:
  title: Persană A1
  description: Persană iraniană pentru începători, axată pe citirea scrierii, înțelegerea vorbirii de zi cu zi și conversații practice politicoase.
units:
  fa.a1.unit02.introductions:
    title: Nume, origine și prezentări
lessons:
  fa.a1.unit02.lesson01.script_ramp:
    title: Citește literele folosite în prezentări
  fa.a1.unit02.lesson02.names:
    title: Întreabă și spune un nume
  fa.a1.unit02.lesson03.pronouns_and_boodan:
    title: Pronumele la singular și verbul „a fi”
  fa.a1.unit02.lesson04.countries_nationalities:
    title: Țări și naționalități
  fa.a1.unit02.lesson05.origin:
    title: Întreabă de unde este cineva
  fa.a1.unit02.lesson06.language_class_dialogue:
    title: Întâlnire la cursul de farsi
teaching:
  fa.a1.unit02.lesson01.teach.noon_te:
    title: Literele ن și ت
    gloss: n și t
    note: ن notează sunetul n. ت notează sunetul t; ambele se leagă de literele din ambele părți.
  fa.a1.unit02.lesson01.teach.sheen_che:
    title: Literele ش și چ
    gloss: ș (sh) și ci/ce (ch)
    note: ش notează sunetul sh (ș), iar چ notează sunetul ch (ca „c” în „ceai”).
  fa.a1.unit02.lesson01.teach.ye_he:
    title: Literele ی și ه
    gloss: y/i lung și h
    note: ی sună ca y sau ca un ī lung. ه este h și își schimbă forma când se leagă.
  fa.a1.unit02.lesson01.teach.ke_gaf:
    title: Literele ک și گ
    gloss: k și g
    note: ک notează sunetul k; când scrii, folosește ک persan, nu litera arabă asemănătoare. گ adaugă o liniuță în plus la ک și notează sunetul g.
  fa.a1.unit02.lesson01.teach.jim_dal:
    title: Literele ج și د
    gloss: j (ge) și d
    note: ج notează sunetul j (ca „g” în „gem”). د notează sunetul d și nu se leagă de litera următoare, spre stânga.
  fa.a1.unit02.lesson01.teach.re_fe:
    title: Literele ر și ف
    gloss: r și f
    note: ر notează sunetul r și nu se leagă de litera următoare; ف notează sunetul f.
  fa.a1.unit02.lesson01.teach.vav_be:
    title: Literele و și ب
    gloss: v/o/u și b
    note: و poate nota v sau o vocală și nu se leagă de litera următoare. ب notează sunetul b.
  fa.a1.unit02.lesson01.teach.khe_ze:
    title: Literele خ și ز
    gloss: kh și z
    note: خ este sunetul scris de obicei kh (ca un h aspru); ز notează sunetul z.
  fa.a1.unit02.lesson02.teach.esm:
    title: Nume
    gloss: nume
    note: În persana iraniană obișnuită, اسم se citește esm.
    example_gloss: Mă numesc Sara.
  fa.a1.unit02.lesson02.teach.man:
    title: eu
    gloss: eu
    note: من este pronumele de persoana I singular.
  fa.a1.unit02.lesson02.teach.sara:
    title: Sara
    gloss: Sara
    note: سارا este un prenume iranian frecvent.
    example_gloss: Sara este prietena mea.
  fa.a1.unit02.lesson02.teach.formal_name:
    title: Prezentare formală sau scrisă
    gloss: Mă numesc Sara.
    note: '*اسم من سارا است* este corect, dar formal; îl vei întâlni mai ales în scris.'
  fa.a1.unit02.lesson02.teach.spoken_name:
    title: Prezentare vorbită firească
    gloss: Mă numesc Sara.
    note: اسمم contractă اسم من, iar ساراست unește سارا și است.
  fa.a1.unit02.lesson02.teach.polite_question:
    title: Întreabă politicos cum cheamă pe cineva
    gloss: Cum te numești? / Cum vă numiți?
    note: اسم شما چیه؟ este farsi iranian vorbit obișnuit, neutru-politicos.
  fa.a1.unit02.lesson02.teach.informal_question:
    title: Întreabă informal numele cuiva
    gloss: Cum te numești?
    note: اسمت چیه؟ este la singular și informal; folosește-l doar când relația o permite.
  fa.a1.unit02.lesson03.teach.man:
    title: eu
    gloss: eu
    note: من nu are gen gramatical.
  fa.a1.unit02.lesson03.teach.to:
    title: Tu, singular informal
    gloss: tu
    note: تو este informal, la singular; pentru adresarea politicoasă se folosește de obicei شما.
  fa.a1.unit02.lesson03.teach.oo:
    title: El sau ea
    gloss: el / ea
    note: او nu marchează genul și poate însemna fie „el”, fie „ea”.
  fa.a1.unit02.lesson03.teach.man_hastam:
    title: Eu sunt
    gloss: eu sunt
    note: هستم este forma completă de persoana I singular a verbului بودن.
  fa.a1.unit02.lesson03.teach.to_hasti:
    title: Tu ești
    gloss: sunteți
    note: هستی se acordă cu pronumele informal singular تو.
  fa.a1.unit02.lesson03.teach.oo_hast:
    title: El sau ea este
    gloss: el/ea este; el/ea se află
    note: هست este forma plină de persoana a treia singular și exprimă adesea existența sau accentuarea.
  fa.a1.unit02.lesson03.teach.oo_ast:
    title: Predicat de identitate formal
    gloss: El sau ea este iranian(ă).
    note: Într-o propoziție formală scrisă despre identitate, است este copula obișnuită de persoana a treia.
  fa.a1.unit02.lesson03.teach.spoken_copula:
    title: Predicat de identitate vorbit
    gloss: El sau ea este iranian(ă).
    note: ایرانیه este forma contrasă firească, din vorbire, a lui ایرانی است.
  fa.a1.unit02.lesson04.teach.iran:
    title: Iran
    gloss: Iran
    note: ایران este numele unei țări.
    example_gloss: Sunt din Iran.
  fa.a1.unit02.lesson04.teach.iranian:
    title: Iranian
    gloss: iranian
    note: ایرانی poate indica naționalitatea sau originea.
    example_gloss: Sunt iranian.
  fa.a1.unit02.lesson04.teach.england:
    title: Anglia
    gloss: Anglia
    note: '*انگلیس* înseamnă de obicei Anglia; în vorbirea de zi cu zi, iranienii îl folosesc adesea pentru întregul Regat Unit.'
    example_gloss: Sunt din Anglia.
  fa.a1.unit02.lesson04.teach.english:
    title: Englez
    gloss: englez
    note: انگلیسی poate indica naționalitatea, limba sau ceva legat de Anglia; sensul se stabilește din context.
    example_gloss: Sunt englez.
  fa.a1.unit02.lesson04.teach.france:
    title: Franța
    gloss: Franța
    note: فرانسه este numele țării Franța.
    example_gloss: Sunt din Franța.
  fa.a1.unit02.lesson04.teach.french:
    title: Francez
    gloss: francez
    note: فرانسوی poate indica naționalitatea sau ceva legat de Franța.
    example_gloss: Sunt francez.
  fa.a1.unit02.lesson04.teach.country:
    title: Țară
    gloss: țară
    note: کشور este cuvântul general pentru țară.
    example_gloss: Iranul este o țară.
  fa.a1.unit02.lesson04.teach.nationality:
    title: Naționalitate
    gloss: naționalitate
    note: ملیت este substantivul formal pentru naționalitate.
    example_gloss: Care este naționalitatea dumneavoastră?
  fa.a1.unit02.lesson05.teach.ahl:
    title: Din sau originar din
    gloss: din / originar din
    note: اهل leagă o persoană de locul de origine; nu înseamnă pur și simplu că locuiește acum într-un loc.
    example_gloss: El/ea este din Anglia.
  fa.a1.unit02.lesson05.teach.koja:
    title: Unde
    gloss: unde
    note: کجا se folosește pentru a întreba despre un loc.
    example_gloss: De unde sunteți?
  fa.a1.unit02.lesson05.teach.formal_question:
    title: Întrebare standard, formală
    gloss: De unde sunteți?
    note: اهل کجا هستید؟ este persana standard, politicoasă, potrivită pentru vorbirea formală sau pentru citirea îngrijită.
  fa.a1.unit02.lesson05.teach.polite_spoken_question:
    title: Întrebare vorbită, neutru-politicoasă
    gloss: De unde sunteți?
    note: اهل کجا هستین؟ este forma obișnuită, politicoasă, din vorbirea persanei iraniene.
  fa.a1.unit02.lesson05.teach.informal_question:
    title: Întrebare informală
    gloss: De unde sunteți?
    note: اهل کجایی؟ este forma informală, la singular.
  fa.a1.unit02.lesson05.teach.origin_answer:
    title: Spune locul de origine
    gloss: Sunt din Iran.
    note: من اهل ایران هستم indică originea, nu locul în care locuiești acum.
  fa.a1.unit02.lesson05.teach.nationality_answer:
    title: Răspuns scurt despre naționalitate
    gloss: Sunt iranian.
    note: '*ایرانی‌ام* adaugă terminația *ـام* (sunt) la *ایرانی*, scrisă cu un mic semispațiu înaintea terminației.'
  fa.a1.unit02.lesson06.teach.arrival:
    title: Verifică locul
    gloss: Sara întreabă dacă aceasta este clasa de persană.
    note: ببخشید atrage politicos atenția înainte de o întrebare practică.
  fa.a1.unit02.lesson06.teach.yes:
    title: Da
    gloss: da
    note: بله este cuvântul neutru-politicos pentru „da”.
    example_gloss: Da, desigur.
  fa.a1.unit02.lesson06.teach.meet_mina:
    title: Mina se prezintă
    gloss: Mina confirmă locul, se prezintă și întreabă cum o cheamă pe Sara.
    note: Întrebarea politicoasă, din vorbire, se potrivește pentru doi adulți care se întâlnesc la un curs.
  fa.a1.unit02.lesson06.teach.sara_name:
    title: Sara își spune numele
    gloss: Mă numesc Sara.
    note: Sara folosește structura compactă din vorbire, învățată mai devreme.
  fa.a1.unit02.lesson06.teach.ask_origin:
    title: Mina întreabă despre origine
    gloss: De unde sunteți?
    note: هستین păstrează schimbul politicos, dar conversațional.
  fa.a1.unit02.lesson06.teach.exchange_origins_sara:
    title: Schimb de informații despre origine
    gloss: Sara spune că este din Anglia și întreabă dacă Mina este din Iran.
    note: Cele două vorbitoare păstrează formele politicoase pentru că tocmai s-au cunoscut.
  fa.a1.unit02.lesson06.teach.exchange_origins_mina:
    title: Schimb de origini, răspuns
    gloss: Mina confirmă că este iraniană.
    note: '*ایرانی‌ام* este forma scurtă a lui *ایرانی هستم* (sunt iranian).'
  fa.a1.unit02.lesson06.teach.pleased:
    title: Răspunde la prezentare
    gloss: Sara spune că îi pare bine să o cunoască pe Mina.
    note: از آشنایی با شما خوشوقتم încheie firesc schimbul lor.
  fa.a1.unit02.lesson06.teach.pleased_and_enter:
    title: Răspunde la urare și intră în clasă
    gloss: Mina spune că și ei îi pare bine și o invită pe Sara înăuntru.
    note: من هم همین‌طور răspunde la urarea politicoasă a Sarei, înainte ca بفرمایید داخل să ducă scena de la curs mai departe.
exercises:
  fa.a1.unit02.lesson01.exercise01.recognize_noon:
    instruction: Care literă reprezintă sunetul n?
    correct_option: ن
    distractors:
    - ت
    - ر
    - و
    accepted_answers:
    - value: ن
      status: correct
    feedback: ن reprezintă sunetul n.
  fa.a1.unit02.lesson01.exercise02.recognize_che:
    instruction: Care literă reprezintă sunetul ci (ch)?
    correct_option: چ
    distractors:
    - ش
    - ج
    - خ
    accepted_answers:
    - value: چ
      status: correct
    feedback: چ reprezintă sunetul ci (ch).
  fa.a1.unit02.lesson01.exercise03.match_ye_he:
    instruction: Potrivește fiecare literă cu sunetul ei aproximativ.
    accepted_answers:
    - value:
        ی: y
        ه: h
        ک: k
        گ: g
        و: v / o
        ب: b
        خ: kh
        ز: z
      status: correct
    feedback: ی poate reprezenta y sau i lung; ه este h; ک este k, iar گ este g; و poate reprezenta v sau o vocală, iar ب este b; خ se transcrie de obicei kh, iar ز este z.
    pairs:
    - left: ی
      right: y
    - left: ه
      right: h
    - left: ک
      right: k
    - left: گ
      right: g
    - left: و
      right: v / o
    - left: ب
      right: b
    - left: خ
      right: kh
    - left: ز
      right: z
  fa.a1.unit02.lesson01.exercise04.choose_persian_ke:
    instruction: Alege litera persană k.
    correct_option: ک
    distractors:
    - گ
    - ج
    - ف
    accepted_answers:
    - value: ک
      status: correct
    feedback: Litera persană ک reprezintă sunetul k.
  fa.a1.unit02.lesson01.exercise06.recognize_fe:
    instruction: Care literă reprezintă sunetul f?
    correct_option: ف
    distractors:
    - و
    - ب
    - ت
    accepted_answers:
    - value: ف
      status: correct
    feedback: ف reprezintă sunetul f.
  fa.a1.unit02.lesson02.exercise01.recognize_esme_shoma_reading:
    instruction: Ce informație cere această întrebare?
    correct_option: numele interlocutorului
    distractors:
