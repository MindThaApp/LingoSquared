      status: correct
    feedback: Terminația atașată ـت marchează „tău/ta” la singular informal.
  fa.a1.unit02.lesson02.exercise08.speak_name:
    instruction: Spune că te cheamă Sara.
    accepted_answers:
    - value: اسمم ساراست
      status: correct
    - value: من سارا هستم
      status: correct
    - value: سارا هستم
      status: correct
    - value: اسم من ساراست
      status: correct
    - value: من سارام
      status: correct
    - value: سارام
      status: correct
    - value: سارا
      status: correct
    - value: اسمم سارا است
      status: acceptable_with_note
      note: Ortografie ușor de înțeles, cu copula scrisă separat.
    - value: اسم من سارا است
      status: acceptable_with_note
      note: Corect, dar mai formal decât întrebarea.
    feedback: Oricare dintre aceste forme spune firesc numele Sarei.
  fa.a1.unit02.lesson03.exercise01.pronoun_i:
    instruction: Alege pronumele persan care înseamnă „eu”.
    correct_option: من
    distractors:
    - تو
    - او
    - شما
    accepted_answers:
    - value: من
      status: correct
    feedback: من înseamnă „eu”.
  fa.a1.unit02.lesson03.exercise02.pronoun_you:
    instruction: Alege „tu” la singular informal.
    correct_option: تو
    distractors:
    - من
    - او
    - شما
    accepted_answers:
    - value: تو
      status: correct
    feedback: تو este „tu” la singular informal.
  fa.a1.unit02.lesson03.exercise03.pronoun_gender:
    instruction: Poate او să se refere fie la un bărbat, fie la o femeie?
    options:
    - Da
    - Nu
    accepted_answers:
    - value: Da
      status: correct
    feedback: Pronumele persane de persoana a treia singular nu marchează genul gramatical.
  fa.a1.unit02.lesson03.exercise04.order_i_am:
    instruction: Ordonează cuvintele pentru „eu sunt”.
    accepted_answers:
    - value:
      - من
      - هستم
      status: correct
    feedback: من هستم înseamnă „eu sunt”.
  fa.a1.unit02.lesson03.exercise05.order_you_are:
    instruction: Ordonează cuvintele pentru „tu ești” (singular informal).
    accepted_answers:
    - value:
      - تو
      - هستی
      status: correct
    feedback: تو هستی folosește forma de singular informal.
  fa.a1.unit02.lesson03.exercise06.order_forms:
    instruction: Ordonează cuvintele pentru „eu sunt, tu ești, el/ea este”.
    accepted_answers:
    - value:
      - من
      - هستم
      - تو
      - هستی
      - او
      - هست
      status: correct
    feedback: Aceasta dă cele trei forme complete de singular, în ordinea persoanelor.
    prompt_blocks:
    - eu sunt, tu ești, el/ea este
  fa.a1.unit02.lesson03.exercise07.formal_third_person:
    instruction: Ce registru descrie cel mai bine propoziția او ایرانی است?
    correct_option: persană formală sau scrisă
    distractors:
    - persană vorbită informală
    - doar plural
    - agramaticală
    accepted_answers:
    - value: persană formală sau scrisă
      status: correct
    feedback: است este aici copula obișnuită de persoana a treia, din limba formală scrisă.
  fa.a1.unit02.lesson03.exercise08.spoken_third_person:
    instruction: Alege sensul propoziției او ایرانیه.
    correct_option: El sau ea este iranian(ă).
    distractors:
    - Eu sunt iranian(ă).
    - Tu ești iranian(ă).
    - El sau ea este în Iran.
    accepted_answers:
    - value: El sau ea este iranian(ă).
      status: correct
    feedback: او nu marchează genul, iar ایرانیه este predicatul în forma vorbită.
  fa.a1.unit02.lesson04.exercise01.iran_pair:
    instruction: Potrivește fiecare cuvânt persan cu sensul lui în română.
    accepted_answers:
    - value:
        ایران: Iran
        ایرانی: iranian
        انگلیس: Anglia
        انگلیسی: englez
        فرانسه: Franța
        فرانسوی: francez
        کشور: țară
        ملیت: naționalitate
      status: correct
    feedback: ایران/انگلیس/فرانسه sunt țările; ایرانی/انگلیسی/فرانسوی sunt naționalitățile corespunzătoare; کشور înseamnă „țară”, iar ملیت înseamnă „naționalitate”.
    pairs:
    - left: ایران
      right: Iran
    - left: ایرانی
      right: iranian
