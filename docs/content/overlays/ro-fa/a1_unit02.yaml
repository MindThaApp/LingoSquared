    feedback: اسمم ساراست înseamnă „mă numesc Sara”.
  fa.a1.unit02.lesson02.exercise05.choose_spoken:
    instruction: Ce registru descrie cel mai bine expresia اسمم ساراست?
    correct_option: persană vorbită neutru-politicoasă
