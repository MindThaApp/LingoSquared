    - ora
    - profesia vorbitorului
    accepted_answers:
    - value: numele interlocutorului
      status: correct
    feedback: اسم شما چیه؟ întreabă cum se numește interlocutorul.
  fa.a1.unit02.lesson02.exercise02.name_meaning:
    instruction: Alege sensul cuvântului اسم.
    correct_option: nume
    distractors:
    - țară
    - clasă
    - limbă
    accepted_answers:
    - value: nume
      status: correct
    feedback: اسم înseamnă „nume”.
  fa.a1.unit02.lesson02.exercise03.formal_name:
    instruction: Ordonează prezentarea formală, scrisă.
    accepted_answers:
    - value:
      - اسم
      - من
      - سارا
      - است
      status: correct
    feedback: اسم من سارا است este structura formală, scrisă, în mod deliberat.
  fa.a1.unit02.lesson02.exercise04.translate_spoken_name:
