    accepted_answers:
    - value: اسمم ساراست
      status: correct
    - value: من سارا هستم
      status: correct
    - value: سارا هستم
      status: correct
    - value: اسم من ساراست
      status: correct
    - value: من سارام
      status: correct
    - value: سارام
      status: correct
    - value: سارا
      status: correct
    - value: اسمم سارا است
      status: acceptable_with_note
      note: Ortografie inteligibilă, cu copula separată.
    - value: اسم من سارا است
      status: acceptable_with_note
