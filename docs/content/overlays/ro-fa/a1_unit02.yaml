    feedback: Un răspuns firesc, din vorbire, este اسمم ساراست.
  fa.a1.unit02.lesson02.exercise07.choose_informal:
    instruction: Ce registru descrie cel mai bine expresia اسمت چیه؟
    correct_option: singular informal
    distractors:
