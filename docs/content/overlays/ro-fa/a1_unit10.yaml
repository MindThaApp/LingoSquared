course:
  title: Persană A1
  description: 'Persană iraniană pentru începători: zilele săptămânii, numele lunilor calendarului solar iranian, a întreba și a spune data de azi, a întreba despre o dată viitoare și a stabili data unei întâlniri în conversație.'
