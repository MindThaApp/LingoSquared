    title: Stabilirea datei unei întâlniri
teaching:
  fa.a1.unit10.lesson01.teach.shanbe_yekshanbe:
    title: Sâmbătă, duminică
    gloss: Sâmbătă, duminică
    note: شنبه și یکشنبه sunt primele două zile ale săptămânii iraniene, care începe sâmbăta.
    example_gloss:
    - Astăzi este sâmbătă.
    - Mâine este duminică.
  fa.a1.unit10.lesson01.teach.doshanbe_seshanbe:
    title: Luni, marți
    gloss: luni, marți
    note: دوشنبه și سه‌شنبه urmează după شنبه și یکشنبه.
    example_gloss:
    - Luni am curs.
    - Marți am o programare.
  fa.a1.unit10.lesson01.teach.chaharshanbe_panjshanbe:
    title: Miercuri, joi
    gloss: miercuri, joi
    note: چهارشنبه și پنجشنبه sunt zilele de mijloc și de final ale săptămânii.
    example_gloss:
    - Miercuri lucrez.
    - Ne vedem joi.
  fa.a1.unit10.lesson01.teach.jome:
    title: Vineri
    gloss: vineri
    note: جمعه este ultima zi a săptămânii și ziua tradițională de odihnă săptămânală în Iran.
    example_gloss: Vineri este zi liberă.
  fa.a1.unit10.lesson01.teach.weekend_note:
    title: Ziua liberă săptămânală
    gloss: Vineri este ziua liberă săptămânală.
    note: جمعه (vineri) este ziua tradițională de odihnă săptămânală în Iran, deși unele locuri de muncă moderne închid acum și joi după-amiază.
  fa.a1.unit10.lesson02.teach.farvardin:
    title: Farvardin (prima lună)
    gloss: Farvardin, prima lună a anului solar iranian
    note: فروردین deschide anul solar iranian, aproximativ la sfârșitul lui martie (în jurul echinocțiului de primăvară/Nowruz).
    example_gloss: Farvardin este prima lună a anului.
  fa.a1.unit10.lesson02.teach.ordibehesht:
    title: Ordibehesht (a doua lună)
    gloss: Ordibehesht, a doua lună
    note: اردیبهشت urmează după فروردین, aproximativ aprilie–mai.
    example_gloss: În Ordibehesht vremea este frumoasă.
  fa.a1.unit10.lesson02.teach.khordad:
    title: Khordad (a treia lună)
    gloss: Khordad, a treia lună
    note: خرداد urmează după اردیبهشت, aproximativ mai–iunie.
    example_gloss: M-am născut în Khordad.
  fa.a1.unit10.lesson02.teach.calendar_note:
    title: Calendarul solar iranian
    gloss: Iranul folosește calendarul solar hegirian (persan).
    note: '*ایران از تقویم هجری شمسی استفاده می‌کنه* spune că Iranul folosește acest calendar pentru datele de zi cu zi – același sistem de calendar ca în Afganistan, dar cu nume de luni de origine persană, nu cu cele de origine arabă din Afganistan.'
  fa.a1.unit10.lesson03.teach.what_day_today:
    title: Ce zi este azi?
    gloss: Ce zi este azi?
    note: امروز چندشنبه‌ست؟ înseamnă literal „azi, a câta zi a săptămânii este?” – forma colocvială cu -e a lui چندشنبه است.
  fa.a1.unit10.lesson03.teach.today_word:
    title: Astăzi
    gloss: astăzi
    note: امروز înseamnă „azi”.
    example_gloss: Ce dată este azi?
  fa.a1.unit10.lesson04.teach.give_full_date:
    title: Azi este joi, 10 Ordibehesht.
    gloss: Azi este joi, 10 Ordibehesht.
    note: امروز پنجشنبه، دهم اردیبهشته îmbină într-o singură propoziție numele zilei, data ordinală și numele lunii, cu forma colocvială în -e (اردیبهشته = اردیبهشت است).
  fa.a1.unit10.lesson04.teach.tarikh_word:
    title: Data
    gloss: dată
    note: '*تاریخ* înseamnă „dată” – cuvântul general pentru o dată din calendar, ca în *تاریخ جلسه* (data ședinței).'
    example_gloss: Ce dată este azi?
  fa.a1.unit10.lesson05.teach.which_day_meeting:
    title: În ce zi este ședința?
    gloss: În ce zi este ședința?
    note: جلسه کدوم روزه؟ întreabă în ce zi a săptămânii va avea loc un eveniment.
  fa.a1.unit10.lesson05.teach.which_date:
    title: Ce dată este marți în Ordibehesht?
    gloss: Ce dată este marți în Ordibehesht?
    note: سه‌شنبه چندم اردیبهشته؟ cere data numerică exactă a unei zile numite.
  fa.a1.unit10.lesson06.teach.hashtom:
    title: al optulea
    gloss: al optulea
    note: '*هشتم* înseamnă „al optulea” (al lunii, adică ziua 8).'
    example_gloss: Azi este 8.
  fa.a1.unit10.lesson06.teach.turn01:
    title: Reza, în ce zi este ședința?
    gloss: Reza, în ce zi este ședința?
    note: Maryam începe întrebându-l direct pe Reza, folosind numele lui.
  fa.a1.unit10.lesson06.teach.turn02:
    title: Cred că marți.
    gloss: Cred că marți.
    note: فکر کنم („cred”) nuanțează răspunsul lui Reza, care nu este pe deplin sigur.
  fa.a1.unit10.lesson06.teach.turn03:
    title: Ce dată este marți în Ordibehesht?
    gloss: Ce dată este marți în Ordibehesht?
    note: Maryam continuă cerând data numerică exactă.
  fa.a1.unit10.lesson06.teach.turn04:
    title: Marți este 8 Ordibehesht.
    gloss: Marți este 8 Ordibehesht.
    note: Reza spune data exactă.
  fa.a1.unit10.lesson06.teach.turn05:
    title: Bine, e în regulă. Dar vineri, ai timp?
    gloss: Bine, e în regulă. Dar vineri, ai timp?
    note: Maryam confirmă data, apoi întreabă despre altă zi.
  fa.a1.unit10.lesson06.teach.turn06:
    title: Nu, vineri sunt ocupat.
    gloss: Nu, vineri sunt ocupat.
    note: سرم شلوغه (literal „capul meu e aglomerat”) este modul colocvial firesc prin care iranienii spun că sunt ocupați.
  fa.a1.unit10.lesson06.teach.turn07:
    title: Nicio problemă, ne vedem marți.
    gloss: Nicio problemă, ne vedem marți.
    note: مشکلی نیست („nicio problemă”) acceptă politicos refuzul lui Reza, iar می‌بینمت înseamnă „ne vedem” – confirmând marți drept ziua ședinței, în acord cu replicile de mai înainte.
  fa.a1.unit10.lesson06.teach.va_and:
    title: Și
    gloss: și
    note: '*و* înseamnă „și”. Poate lega două zile, ca în *دوشنبه و سه‌شنبه*, sau două întrebări înrudite, ca în *جلسه کدوم روزه و چندم اردیبهشته؟*'
    example_gloss: Am curs luni și marți.
