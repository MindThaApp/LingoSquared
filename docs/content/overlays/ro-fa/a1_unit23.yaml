teaching:
  fa.a1.unit23.lesson01.teach.khoshhal_word:
    title: Fericit
    gloss: fericit
    note: خوشحال înseamnă fericit.
    example_gloss: Sunt fericit.
  fa.a1.unit23.lesson01.teach.narahat_word:
    title: Trist
    gloss: trist
    note: ناراحت înseamnă trist.
    example_gloss: Sunt trist.
  fa.a1.unit23.lesson01.teach.hastam_contraction:
    title: Eu sunt (formă contrasă)
    gloss: sunt (formă contrasă cu un adjectiv)
    note: '*خوشحالم* este *خوشحال* + *هستم*, contras în terminația *-م*. După un *-ه* mut, aceeași terminație se scrie *-ام*, ca în *خسته‌ام*.'
    target_text: خوشحالم = خوشحال + هستم (sunt fericit/fericită, formă contrasă)
  fa.a1.unit23.lesson01.teach.khaste_word:
    title: Obosit
    gloss: obosit
    note: خسته înseamnă obosit.
    example_gloss: Sunt obosit.
  fa.a1.unit23.lesson02.teach.khoob_nistam_phrase:
    title: Nu sunt bine
    gloss: Nu sunt bine
    note: خوب نیستم neagă expresia deja învățată خوبم (sunt bine) cu ajutorul lui نیستم, negativul lui هستم.
  fa.a1.unit23.lesson02.teach.goshne_word:
    title: Flămând
    gloss: flămând
    note: '*گشنه* înseamnă flămând. Este forma vorbită obișnuită a lui *گرسنه*, pe care ai văzut-o în Unitatea 4.'
    example_gloss: Sunt flămând.
  fa.a1.unit23.lesson02.teach.yekam_word:
    title: Puțin
    gloss: puțin
    note: یکم atenuează o stare, la fel ca „puțin” sau „un pic” în română.
    example_gloss: Sunt puțin obosit.
  fa.a1.unit23.lesson03.teach.asabani_word:
    title: Supărat
    gloss: supărat
    note: عصبانی înseamnă supărat, nervos.
    example_gloss: De ce ești supărat?
  fa.a1.unit23.lesson03.teach.negaran_word:
    title: Îngrijorat
    gloss: îngrijorat
    note: نگران înseamnă îngrijorat.
    example_gloss: Sunt îngrijorat.
  fa.a1.unit23.lesson03.teach.chera_word:
    title: De ce
    gloss: de ce
    note: '*چرا* înseamnă „de ce”; *هستی* este forma informală pentru „tu ești” și se contractă în *-ی*: *نگران هستی* devine *نگرانی*.'
    target_text: چرا (de ce)
  fa.a1.unit23.lesson04.teach.kar_kardam_phrase:
    title: Am lucrat
    gloss: am lucrat
    note: کار کردم înseamnă literal „muncă am făcut”.
  fa.a1.unit23.lesson04.teach.tatile_word:
    title: Este zi liberă
    gloss: este zi liberă
    note: تعطیله înseamnă că este zi liberă/sărbătoare.
    example_gloss: Astăzi este zi liberă.
  fa.a1.unit23.lesson04.teach.emrooz_word:
    title: Astăzi
    gloss: astăzi
    note: امروز înseamnă astăzi.
    example_gloss: Astăzi sunt obosit.
  fa.a1.unit23.lesson04.teach.ziad_word:
    title: Mult
    gloss: mult
    note: زیاد înseamnă mult/prea mult.
    example_gloss: Am lucrat mult.
  fa.a1.unit23.lesson05.teach.sara_name_review:
    title: Sara
    gloss: Sara
    note: سارا, personaj prezentat încă din Unitatea 14, apare din nou aici.
    example_gloss: Sara este obosită.
  fa.a1.unit23.lesson05.teach.reading_text:
    title: 'Text: Ziua Sarei'
    gloss: Sara este azi puțin obosită, pentru că a lucrat mult. Sara nu este tristă, doar obosită.
    note: '*خسته‌ست* și *کرده* sunt formele colocviale de persoana a III-a corespunzătoare lui *خسته‌ام* și *کردم*; *نیست* neagă *هست*; *فقط* înseamnă „doar”.'
  fa.a1.unit23.lesson06.teach.che_khoob_phrase:
    title: Ce bine!
    gloss: ce bine!
    note: چه خوب! este o reacție pozitivă frecventă, ca „ce bine!” sau „grozav!”.
  fa.a1.unit23.lesson06.teach.dialogue_line1:
    title: 'Nima: Sara, ce faci?'
    gloss: Sara, ce faci?
  fa.a1.unit23.lesson06.teach.dialogue_line2:
    title: 'Sara: Sunt puțin obosită...'
    gloss: Astăzi sunt puțin obosită, pentru că am lucrat mult. Tu ce faci?
  fa.a1.unit23.lesson06.teach.dialogue_line3:
    title: 'Nima: Sunt fericit...'
    gloss: Sunt fericit, pentru că astăzi este zi liberă.
  fa.a1.unit23.lesson06.teach.dialogue_line4:
    title: 'Sara: Ce bine!'
    gloss: Ce bine!
