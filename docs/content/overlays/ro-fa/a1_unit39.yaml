    title: 'Recapitulare: ajutor'
    gloss: ajutor
    note: '*کمک* („ajutor”) a fost introdus mai devreme.'
  fa.a1.unit39.lesson01.teach.lazame:
    title: Necesar
    gloss: este nevoie de
    note: '*لازمه* este un singur cuvânt care înseamnă „este nevoie de”, format la fel ca *قشنگه* („este frumos”) și *گرمه* („este cald”).'
    example_gloss: Este nevoie de ajutor!
  fa.a1.unit39.lesson01.teach.polis:
    title: Poliția
    gloss: poliția
    note: '*پلیس* înseamnă „poliție”, un împrumut folosit în vorbirea de zi cu zi.'
    example_gloss: Este nevoie de poliție!
  fa.a1.unit39.lesson01.teach.ambulance:
    title: Ambulanța
    gloss: ambulanța
    note: '*آمبولانس* înseamnă „ambulanță”.'
    example_gloss: Este nevoie de o ambulanță!
  fa.a1.unit39.lesson02.teach.atashneshani:
    title: Pompierii
    gloss: pompieri
    note: '*آتش‌نشانی* înseamnă „pompieri” sau „serviciul de pompieri”.'
    example_gloss: Este nevoie de pompieri!
  fa.a1.unit39.lesson02.teach.atash:
    title: Focul
    gloss: foc
    note: '*آتش* înseamnă „foc”, rădăcina cuvântului *آتش‌نشانی* („pompieri”).'
    example_gloss: Foc! Este nevoie de pompieri!
  fa.a1.unit39.lesson02.teach.khatar:
    title: Pericolul
    gloss: pericol
    note: '*خطر* înseamnă „pericol”.'
    example_gloss: Pericol! Este nevoie de poliție!
  fa.a1.unit39.lesson03.teach.review_ken_konid:
    title: 'Recapitulare: imperativul formal și informal'
    gloss: faceți! (formal) / fă! (informal)
    note: '*کنید* este terminația imperativului formal sau de plural. Forma informală *کن*, pe care ai folosit-o cu prietenii în *استراحت کن* („odihnește-te!”), este pentru o singură persoană pe care o cunoști bine.'
  fa.a1.unit39.lesson03.teach.komak_konid:
    title: Ajutor!
    gloss: Ajutor!
    note: '*کمک کنید!* este modul politicos de a cere ajutor, potrivit pentru străini și pentru echipele de urgență.'
  fa.a1.unit39.lesson03.teach.tasadof:
    title: Accidentul
    gloss: accident
    note: '*تصادف* înseamnă „accident”.'
