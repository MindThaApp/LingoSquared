    gloss: vine
    note: '*میاد* („el/ea vine”) urmează același model de terminații personale ca *میام* („vin”), pe care l-ai învățat mai devreme.'
  fa.a1.unit39.lesson04.teach.zud_biayid:
    title: Veniți repede!
    gloss: Veniți repede!
    note: '*زود* înseamnă „repede”; *بیایید* este imperativul politicos „veniți!”'
