    title: Urgența
    gloss: urgență
    note: '*اورژانس* înseamnă „urgență”, același cuvânt folosit pentru unitatea de urgență a unui spital.'
    example_gloss: Este o urgență! Ajutor!
  fa.a1.unit39.lesson04.teach.review_alo_bashe_mamnoon:
    title: 'Recapitulare: alo / bine / mulțumesc'
    gloss: alo (la telefon) / bine / mulțumesc
    note: '*الو*, *باشه* și *ممنون* au fost introduse mai devreme.'
