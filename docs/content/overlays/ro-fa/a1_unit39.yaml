    title: Despre acest anunț
    gloss: Accident / pericol / foc
    note: În anunț, după fiecare fel de urgență urmează un semn de întrebare, ca și cum ai întreba „În caz de accident?”. Serviciul pe care trebuie să-l suni vine imediat după.
  fa.a1.unit39.lesson05.teach.reading_text:
    title: 'Lectură: anunț de urgență'
    gloss: Accident? Este nevoie de o ambulanță! Pericol? Este nevoie de poliție! Foc? Este nevoie de pompieri! Sunați repede!
    note: Un scurt anunț care arată ce serviciu trebuie chemat pentru fiecare tip de urgență.
