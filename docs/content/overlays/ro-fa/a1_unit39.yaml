course:
  title: Persană A1
  description: 'Persana iraniană pentru începători: denumirea celor trei servicii de urgență (poliție, ambulanță, pompieri), exprimarea a ceea ce este necesar, cererea de ajutor cu imperative politicoase, un dialog cu un apel de urgență și citirea unui scurt anunț de urgență.'
