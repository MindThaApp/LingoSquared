    title: Familia apropiată
  fa.a1.unit04.lesson02.describing_own_family:
    title: Descrie-ți propria familie
  fa.a1.unit04.lesson03.extended_family:
    title: Familia extinsă
  fa.a1.unit04.lesson04.asking_about_family:
    title: Întreabă despre familia cuiva
  fa.a1.unit04.lesson05.marriage_and_inlaws:
    title: Căsătoria și nepoții
  fa.a1.unit04.lesson06.family_photo_dialogue:
    title: O fotografie de familie
teaching:
  fa.a1.unit04.lesson01.teach.madar:
    title: Mama
    gloss: mamă
    note: مادر este cuvântul neutru, folosit în scris și în registru formal, pentru „mamă”.
    example_gloss: Mama mea este bună la suflet.
  fa.a1.unit04.lesson01.teach.maman:
    title: Mama (colocvial)
    gloss: mama
    note: مامان este cuvântul vorbit de zi cu zi, pe care îl folosesc majoritatea familiilor.
    example_gloss: Mamă, mi-e foame.
  fa.a1.unit04.lesson01.teach.pedar:
    title: Tatăl
    gloss: tată
    note: پدر este cuvântul neutru, folosit în scris și în registru formal, pentru „tată”.
    example_gloss: Tatăl meu este medic.
  fa.a1.unit04.lesson01.teach.baba:
    title: Tata (colocvial)
    gloss: tata
    note: بابا este cuvântul vorbit de zi cu zi, pe care îl folosesc majoritatea familiilor.
    example_gloss: Tată, unde ești?
  fa.a1.unit04.lesson01.teach.baradar:
    title: Fratele
    gloss: frate
    note: برادر înseamnă „frate”; forma vorbită, afectuoasă, داداش apare mai târziu în această unitate.
    example_gloss: Am un frate.
  fa.a1.unit04.lesson01.teach.khahar:
    title: Sora
    gloss: soră
    note: خواهر este cuvântul standard pentru „soră”.
    example_gloss: Sora mea este studentă.
  fa.a1.unit04.lesson01.teach.register_note:
    title: Cuvinte formale și cuvinte de zi cu zi
    gloss: Mama și tata sunt ca mama și tatăl, dar mai familiari.
    note: 'Persana are două registre reale pentru părinți, nu o simplă împărțire formal/informal: مامان/بابا sunt cuvintele cu care majoritatea oamenilor își strigă proprii părinți, chiar și într-un cadru politicos.'
  fa.a1.unit04.lesson02.teach.daram:
    title: Am
    gloss: am
    note: '*دارم* este forma persoanei I singular a verbului *داشتن* („a avea”), verbul de bază pentru a descrie familia.'
  fa.a1.unit04.lesson02.teach.yek:
    title: Unu
    gloss: unu
    note: یک se folosește înaintea unui substantiv numărat, de exemplu یک برادر (un frate).
    example_gloss: Am o soră.
  fa.a1.unit04.lesson02.teach.one_brother:
    title: Am un frate.
    gloss: Am un frate.
    note: 'Ordinea cuvintelor: subiect, cantitate + substantiv, verb, adică ordinea persană obișnuită SOV.'
  fa.a1.unit04.lesson02.teach.no_sister:
    title: Nu am soră.
    gloss: Nu am soră.
    note: ندارم este negativul lui دارم; nu este nevoie de un cuvânt separat pentru „o”.
  fa.a1.unit04.lesson02.teach.family_big:
    title: Familia mea este mare.
    gloss: Familia mea este mare.
    note: بزرگه este forma vorbită, contrasă, a lui «بزرگ است» („este mare”).
  fa.a1.unit04.lesson02.teach.family_small:
    title: Familia noastră este mică.
    gloss: Familia noastră este mică.
    note: کوچیکه este forma vorbită, contrasă, a lui «کوچک است» („este mic”), cu pronunția colocvială کوچیک în loc de کوچک în scris.
  fa.a1.unit04.lesson03.teach.pedarbozorg:
    title: Bunicul
    gloss: bunic
    note: پدربزرگ, la propriu „tată mare”, se folosește pentru ambele părți ale familiei.
    example_gloss: Bunicul meu este bătrân.
  fa.a1.unit04.lesson03.teach.madarbozorg:
    title: Bunica
    gloss: bunică
    note: مادربزرگ, la propriu „mamă mare”, se folosește pentru ambele părți ale familiei.
    example_gloss: Bunica mea este bună la suflet.
  fa.a1.unit04.lesson03.teach.amoo:
    title: Unchi din partea tatălui
    gloss: unchi (fratele tatălui)
    note: عمو înseamnă exact „fratele tatălui”, nu este un cuvânt general pentru „unchi”.
    example_gloss: Unchiul meu locuiește la Teheran.
  fa.a1.unit04.lesson03.teach.amme:
    title: Mătușă din partea tatălui
    gloss: mătușă (sora tatălui)
    note: عمه înseamnă exact „sora tatălui”.
    example_gloss: Mătușa mea este profesoară.
  fa.a1.unit04.lesson03.teach.dayi:
    title: Unchi din partea mamei
    gloss: unchi (fratele mamei)
    note: 'دایی înseamnă exact „fratele mamei”: persana arată pentru fiecare unchi și mătușă din ce parte a familiei face parte.'
    example_gloss: Unchiul meu (din partea mamei) este inginer.
  fa.a1.unit04.lesson03.teach.khale:
    title: Mătușă din partea mamei
    gloss: mătușă (sora mamei)
    note: خاله înseamnă exact „sora mamei”.
    example_gloss: Mătușa mea (din partea mamei) locuiește la Isfahan.
  fa.a1.unit04.lesson03.teach.register_note:
    title: Partea tatălui și partea mamei
    gloss: Unchiul și mătușa din partea tatălui sunt de partea tatălui; unchiul și mătușa din partea mamei sunt de partea mamei.
    note: Această împărțire în patru (عمو/عمه față de دایی/خاله) distinge partea familiei prin cuvinte diferite, spre deosebire de română, unde „unchi” și „mătușă” se folosesc pentru ambele părți.
  fa.a1.unit04.lesson04.teach.chand_ta:
    title: Câți / Câte
    gloss: câți / câte
    note: چند تا se folosește în limbajul obișnuit înainte de a număra persoane sau lucruri.
    example_gloss: Câte surori aveți?
  fa.a1.unit04.lesson04.teach.polite_question:
    title: Câți frați și surori aveți? (politicos)
    gloss: Câți frați și surori ai?
    note: دارید este forma politicoasă/de plural a verbului „a avea”, potrivită cu شما.
  fa.a1.unit04.lesson04.teach.spoken_question:
    title: Câți frați și surori ai? (informal)
    gloss: Câți frați și surori ai?
    note: داری este forma informală de singular, folosită cu un egal sau cu cineva mai tânăr.
  fa.a1.unit04.lesson04.teach.family_size_question:
    title: Câți membri are familia dumneavoastră?
    gloss: Câți membri are familia dumneavoastră?
    note: نفر este numărătorul pentru persoane; نفرن este forma vorbită, contrasă, a lui «نفر هستند» („sunt ... persoane”).
  fa.a1.unit04.lesson04.teach.answer_example:
    title: 'Suntem patru: eu, mama, tata și fratele meu.'
    gloss: 'Suntem patru: eu, mama, tata și fratele meu.'
    note: نفریم = «نفر هستیم» („suntem ... persoane”) contras, registru vorbit.
  fa.a1.unit04.lesson05.teach.showhar:
    title: Soț
    gloss: soț
    note: شوهر este cuvântul standard pentru „soț”.
    example_gloss: Soțul meu este inginer.
  fa.a1.unit04.lesson05.teach.zan:
    title: Soție
    gloss: soție
    note: زن înseamnă și „femeie” în general; contextul lămurește sensul.
    example_gloss: Soția mea este profesoară.
  fa.a1.unit04.lesson05.teach.motahel:
    title: Căsătorit
    gloss: căsătorit
    note: متأهل este un adjectiv neutru, des folosit pentru starea civilă.
    example_gloss: El/Ea este căsătorit(ă).
  fa.a1.unit04.lesson05.teach.mojarad:
    title: Necăsătorit
    gloss: necăsătorit
    note: مجرد este cuvântul standard pentru „necăsătorit”.
    example_gloss: Sunt necăsătorit(ă).
  fa.a1.unit04.lesson05.teach.i_am_single:
    title: Sunt necăsătorit(ă).
    gloss: Sunt necăsătorit(ă).
    note: مجردم = مجرد + م („sunt”), același tipar cu sufixul persoanei I ca în خوبم („sunt bine”).
  fa.a1.unit04.lesson05.teach.i_am_married:
    title: Sunt căsătorit(ă).
    gloss: Sunt căsătorit(ă).
    note: متأهلم = متأهل + م („sunt”), același tipar ca مجردم.
  fa.a1.unit04.lesson05.teach.nave:
    title: Nepot
    gloss: nepot (copilul copilului)
    note: نوه acoperă atât nepotul, cât și nepoata (copiii copilului tău); persana nu cere aici precizarea genului.
    example_gloss: El/Ea are un nepot.
  fa.a1.unit04.lesson05.teach.example:
    title: Fratele meu este căsătorit; are un fiu.
    gloss: Fratele meu este căsătorit; are un fiu.
    note: متأهله = «متأهل است» („este căsătorit”) contras, registru vorbit; داره = «دارد» („are”) în registru vorbit.
  fa.a1.unit04.lesson06.teach.in_photo:
    title: Aceasta este fotografia familiei tale?
    gloss: Aceasta este fotografia familiei tale?
    note: خانواده‌ته = «خانواده‌ی تو است» („este familia ta”) contras, un tipar vorbit foarte des întâlnit.
  fa.a1.unit04.lesson06.teach.yes_mom_dad:
    title: Da. Asta e mama, iar asta e tata.
    gloss: Da. Asta e mama, iar asta e tata.
    note: '*آره* este „da” în limbajul vorbit (față de *بله*, formal). *مامانمه* este *مامانم* („mama mea”) plus terminația vorbită pentru „este”.'
  fa.a1.unit04.lesson06.teach.who_is_he:
    title: Cine este domnul acesta?
    gloss: Cine este domnul acesta?
    note: کیه = «کی است» (cine este), formă contrasă, registru vorbit.
  fa.a1.unit04.lesson06.teach.brother_answer:
    title: Este fratele meu. Am un frate, nu am soră.
    gloss: Este fratele meu. Am un frate, nu am soră.
    note: داداش este cuvântul afectuos, de zi cu zi, pentru „frate”, folosit aici în locul lui برادر, mai neutru, din lecția 1.
  fa.a1.unit04.lesson06.teach.opposite_family:
    title: Familia mea e pe dos; am două surori, nu am frate.
    gloss: Familia mea e pe dos; am două surori, nu am frate.
    note: برعکسه = «برعکس است» (este pe dos), formă contrasă.
  fa.a1.unit04.lesson06.teach.closing:
    title: Deci și familia ta e gălăgioasă!
    gloss: Deci și familia ta e gălăgioasă!
    note: شلوغه = «شلوغ است» (este aglomerată/plină de viață), formă contrasă; e un mod călduros și frecvent de a descrie o familie cu mulți copii.
  fa.a1.unit04.lesson06.teach.formal_register_note:
    title: 'Registrul formal: are / nu are / este'
    gloss: 'Vorbit: are, nu are. Scris formal: are, nu are; el este fratele meu.'
    note: دارد/ندارد/است sunt echivalentele scrise, formale, ale formelor vorbite داره/نداره folosite în acest dialog. Observă că în scrisul formal afectuosul داداش se înlocuiește cu neutrul برادر.
