  fa.a1.unit28.lesson05.reading_about_the_commute:
    title: Text despre drumurile lui Nima și ale Sarei
  fa.a1.unit28.lesson06.comparing_commutes_dialogue:
    title: 'Dialog: Care e mai bun?'
teaching:
  fa.a1.unit28.lesson01.teach.man_review:
    title: eu
    gloss: eu
    note: '*من*, deja cunoscut, apare din nou aici, când vorbești despre cum te deplasezi.'
  fa.a1.unit28.lesson01.teach.ba_word:
    title: Cu / prin
    gloss: cu
    note: '*با* este prepoziția folosită cu un mijloc de transport: *با* + numele mijlocului de transport + *می‌رم* înseamnă „merg cu [mijlocul de transport]”.'
    target_text: با (cu)
  fa.a1.unit28.lesson01.teach.otobus_review:
    title: Autobuzul
    gloss: autobuz
    note: '*اتوبوس* este cuvântul obișnuit pentru „autobuz”.'
    example_gloss: Merg cu autobuzul.
  fa.a1.unit28.lesson01.teach.ba_otobus_phrase:
    title: Merg cu autobuzul
    gloss: Merg cu autobuzul
    note: '*با اتوبوس می‌رم* combină *با* + *اتوبوس* + *می‌رم* („merg”).'
  fa.a1.unit28.lesson01.teach.metro_word:
    title: Metrou
    gloss: metrou
    note: '*مترو* este un împrumut direct, de zi cu zi -- metroul din Teheran se numește chiar *مترو*.'
    example_gloss: Merg cu metroul.
  fa.a1.unit28.lesson01.teach.ba_metro_phrase:
    title: Merg cu metroul
    gloss: Merg cu metroul
    note: '*با مترو می‌رم* urmează exact același tipar *با* + mijloc de transport + *می‌رم* ca la autobuz.'
  fa.a1.unit28.lesson02.teach.mashin_word:
    title: Mașina
    gloss: mașină
    note: '*ماشین* este cuvântul obișnuit pentru „mașină”.'
    example_gloss: Merg cu mașina.
  fa.a1.unit28.lesson02.teach.ba_mashin_phrase:
    title: Merg cu mașina
    gloss: Merg cu mașina
    note: '*با ماشین می‌رم* urmează același tipar *با* + mijloc de transport + *می‌رم*.'
  fa.a1.unit28.lesson02.teach.docharkhe_word:
    title: Bicicleta
    gloss: bicicletă
    note: '*دوچرخه* înseamnă „bicicletă” -- literal „două roți”.'
    example_gloss: Merg cu bicicleta.
  fa.a1.unit28.lesson02.teach.ba_docharkhe_phrase:
    title: Merg cu bicicleta
    gloss: Merg cu bicicleta
    note: '*با دوچرخه می‌رم* păstrează încă o dată același tipar.'
  fa.a1.unit28.lesson02.teach.har_rooz_review:
    title: În fiecare zi
    gloss: în fiecare zi
    note: '*هر روز* apare din nou aici, pentru a descrie un drum obișnuit.'
  fa.a1.unit28.lesson02.teach.sarkar_review:
    title: A lucra
    gloss: a lucra
    note: '*سر کار* înseamnă „la serviciu” -- nu e nevoie de prepoziție, doar *می‌رم* + *سر کار*.'
  fa.a1.unit28.lesson02.teach.har_rooz_sarkar_phrase:
    title: În fiecare zi merg la serviciu cu mașina
    gloss: În fiecare zi merg la serviciu cu mașina
    note: '*هر روز با ماشین می‌رم سر کار* reunește tot ce am învățat în această lecție: frecvența, mijlocul de transport și destinația.'
  fa.a1.unit28.lesson03.teach.piyade_word:
    title: Pe jos
    gloss: pe jos
    note: '*پیاده* înseamnă „pe jos”. Spre deosebire de vehiculele de până acum, NU primește *با*: spui *پیاده می‌رم*, nu *با پیاده می‌رم*.'
    example_gloss: Merg pe jos.
  fa.a1.unit28.lesson03.teach.piyade_phrase:
    title: Merg pe jos (fără با)
    gloss: merg pe jos
    note: '*پیاده می‌رم* -- *پیاده* funcționează aici ca un adverb, la fel ca „pe jos” în română, care nu cere nicio prepoziție de felul lui با.'
    target_text: پیاده می‌رم (fără با)
  fa.a1.unit28.lesson03.teach.taxi_word:
    title: Taxi
    gloss: taxi
    note: '*تاکسی* este un împrumut direct, folosit în fiecare zi, pentru „taxi”, și PRIMEȘTE *با* ca celelalte vehicule.'
    example_gloss: Merg cu taxiul.
  fa.a1.unit28.lesson03.teach.ba_taxi_phrase:
    title: Merg cu taxiul
    gloss: merg cu taxiul
    note: '*با تاکسی می‌رم* urmează tiparul obișnuit *با* + vehicul.'
  fa.a1.unit28.lesson03.teach.kodoom_word:
    title: Care
    gloss: care
    note: '*کدوم* înseamnă „care” (dintre ele) -- aici se folosește pentru a întreba care mijloc de transport e mai bun.'
    target_text: کدوم (care)
  fa.a1.unit28.lesson03.teach.behtare_review:
    title: Mai bine
    gloss: mai bine
    note: '*بهتره* înseamnă „e mai bun”.'
  fa.a1.unit28.lesson03.teach.ya_review:
    title: Sau
    gloss: sau
    note: '*یا* leagă aici cele două variante de transport.'
    target_text: یا (sau)
  fa.a1.unit28.lesson03.teach.kodoom_behtare_phrase:
    title: Autobuz sau metrou, care e mai bun?
    gloss: Autobuz sau metrou, care e mai bun?
    note: '*اتوبوس یا مترو، کدوم بهتره؟* combină *یا*, pentru a enumera variantele, cu *کدوم بهتره؟*, pentru a cere o recomandare.'
  fa.a1.unit28.lesson04.teach.belit_review:
    title: Biletul
    gloss: bilet
    note: '*بلیط* apare din nou aici, pentru un bilet obișnuit de autobuz local.'
    example_gloss: Unde este biletul de autobuz?
  fa.a1.unit28.lesson04.teach.gheymat_review:
    title: Preț
    gloss: preț
    note: '*قیمت* înseamnă „preț”.'
  fa.a1.unit28.lesson04.teach.cheghadr_review:
    title: Cât
    gloss: cât / câți
    note: '*چقدر* se folosește aici pentru a întreba prețul unui bilet.'
  fa.a1.unit28.lesson04.teach.belit_cheghadr_phrase:
    title: Cât costă un bilet de autobuz?
    gloss: Cât costă un bilet de autobuz?
    note: '*بلیط اتوبوس چقدره؟* combină *بلیط اتوبوس* cu *چقدره* („cât costă”).'
  fa.a1.unit28.lesson04.teach.daghighe_review:
    title: Minut
    gloss: minut
    note: '*دقیقه* apare din nou aici, în legătură cu programul autobuzului.'
  fa.a1.unit28.lesson04.teach.panzdah_review:
    title: Cincisprezece
    gloss: cincisprezece
    note: '*پانزده* se folosește aici pentru frecvența autobuzului.'
  fa.a1.unit28.lesson04.teach.miad_word:
    title: Vine
    gloss: vine
    note: '*میاد* este forma colocvială, de zi cu zi, pentru „vine” (de la *می‌آید*), folosită aici pentru a spune cât de des vine autobuzul.'
    target_text: میاد (vine)
  fa.a1.unit28.lesson04.teach.sign_text:
    title: 'Lectură: un panou de la stația de autobuz'
    gloss: Cât costă un bilet de autobuz? Autobuzul vine la fiecare cincisprezece minute.
    note: O propoziție scurtă, în stilul unui panou sau al unui orar, care combină întrebarea despre preț din această lecție cu o precizare despre frecvență.
  fa.a1.unit28.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, introdus ca personaj încă din Unitatea 11, apare din nou aici.'
    example_gloss: Nima merge la serviciu în fiecare zi.
  fa.a1.unit28.lesson05.teach.mire_review:
    title: El/ea merge
    gloss: el/ea merge
    note: '*می‌ره* este forma colocvială de persoana a treia a verbului „a merge”.'
  fa.a1.unit28.lesson05.teach.gahi_review:
    title: Uneori
    gloss: uneori
    note: '*گاهی* apare din nou aici.'
  fa.a1.unit28.lesson05.teach.ham_review:
    title: De asemenea / și
    gloss: și / de asemenea
    note: '*هم* înseamnă „și” sau „de asemenea” -- aici se folosește pentru faptul că Nima merge uneori și pe jos.'
    target_text: هم (și / de asemenea)
  fa.a1.unit28.lesson05.teach.sara_review:
    title: Sara
    gloss: Sara
    note: '*سارا*, introdusă ca personaj încă din Unitatea 2, apare din nou aici.'
    example_gloss: Sara merge la școală în fiecare zi.
  fa.a1.unit28.lesson05.teach.madrese_review:
    title: Școala
    gloss: școală
    note: '*مدرسه* este aici destinația zilnică a Sarei.'
    example_gloss: Sara merge la școală.
  fa.a1.unit28.lesson05.teach.reading_text:
    title: 'Lectură: drumul lui Nima și al Sarei'
    gloss: Nima merge la serviciu cu autobuzul în fiecare zi. Uneori merge și pe jos. Sara merge la școală cu bicicleta în fiecare zi.
    note: Această lectură reia toate construcțiile din lecțiile 1-4, plus *می‌ره* și *مدرسه* din lecția 5 -- aproape fără vocabular nou, doar recunoaștere în text continuu.
  fa.a1.unit28.lesson06.teach.tochi_review:
    title: Dar tu?
    gloss: dar tu?
    note: '*تو چی؟* apare din nou aici pentru a întoarce întrebarea.'
  fa.a1.unit28.lesson06.teach.choon_word:
    title: Pentru că
    gloss: pentru că
    note: '*چون* înseamnă „pentru că” -- un conector cu adevărat nou, folosit aici pentru a motiva o recomandare.'
    target_text: چون (pentru că)
  fa.a1.unit28.lesson06.teach.varzeshe_word:
    title: E sport
    gloss: e sport
    note: '*ورزشه* combină *ورزش* (învățat mai devreme) cu copula *-ه* („este”).'
  fa.a1.unit28.lesson06.teach.vali_review:
    title: Dar
    gloss: dar
    note: '*ولی* apare din nou aici.'
    target_text: ولی (dar)
  fa.a1.unit28.lesson06.teach.chekhoob_review:
    title: Ce bine!
    gloss: ce bine!
    note: '*چه خوب!* este și aici o reacție firească de încheiere.'
  fa.a1.unit28.lesson06.teach.are_review:
    title: Da
    gloss: da
    note: '*آره* este cuvântul colocvial, de zi cu zi, pentru „da” și apare din nou aici.'
  fa.a1.unit28.lesson06.teach.dialogue_line1:
    title: 'Nima: Merg la serviciu cu autobuzul în fiecare zi. Dar tu?'
    gloss: Merg la serviciu cu autobuzul în fiecare zi. Dar tu?
  fa.a1.unit28.lesson06.teach.dialogue_line2:
    title: 'Sara: Eu merg la școală cu bicicleta.'
    gloss: Eu merg la școală cu bicicleta.
  fa.a1.unit28.lesson06.teach.dialogue_line3:
    title: 'Nima: Autobuz sau bicicletă, care e mai bună?'
    gloss: Autobuz sau bicicletă, care e mai bună?
  fa.a1.unit28.lesson06.teach.dialogue_line4:
    title: 'Sara: Bicicleta e mai bună, pentru că e sport.'
    gloss: Bicicleta e mai bună, pentru că e sport.
  fa.a1.unit28.lesson06.teach.dialogue_line5:
    title: 'Nima: Da, dar uneori merg și pe jos.'
    gloss: Da, dar uneori merg și pe jos.
  fa.a1.unit28.lesson06.teach.dialogue_line6:
    title: 'Sara: Ce bine!'
    gloss: Ce bine!
