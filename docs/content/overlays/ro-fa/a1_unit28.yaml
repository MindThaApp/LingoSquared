course:
  title: Persană A1
  description: 'Persană iraniană pentru începători: denumirea mijloacelor de transport (autobuz, metrou, mașină, bicicletă, pe jos, taxi), cum spui cu ce mergi în mod obișnuit (în fiecare zi cu autobuzul la serviciu), cum întrebi care mijloc de transport e mai bun (اتوبوس یا مترو، کدوم بهتره؟), cum afli prețul unui bilet local și cum citești o propoziție scurtă dintr-un orar de transport, un text despre drumurile obișnuite ale lui نیما și سارا și un dialog final între نیما și سارا în care compară cum se deplasează fiecare.'
units:
