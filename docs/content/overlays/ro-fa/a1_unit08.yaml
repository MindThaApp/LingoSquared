teaching:
  fa.a1.unit08.lesson01.teach.shop_word:
    title: Magazin
    gloss: magazin
    note: مغازه este cuvântul general pentru un magazin mic.
    example_gloss: Acest magazin este mare.
  fa.a1.unit08.lesson01.teach.price_word:
    title: Preț
    gloss: preț
    note: قیمت este cuvântul general pentru preț.
    example_gloss: Cât costă asta?
  fa.a1.unit08.lesson01.teach.discount_word:
    title: Reducere
    gloss: reducere
    note: تخفیف înseamnă reducere, un cuvânt frecvent în cumpărăturile și negocierile de zi cu zi din Iran.
    example_gloss: Aveți o reducere?
  fa.a1.unit08.lesson01.teach.apple_word:
    title: Măr
    gloss: măr
    note: سیب este un exemplu frecvent pentru exersarea prețurilor și a cantităților.
    example_gloss: Vreau un măr.
  fa.a1.unit08.lesson01.teach.va_word:
    title: Și
    gloss: și
    note: و este cuvântul de legătură folosit frecvent în această unitate.
    target_text: و (și)
  fa.a1.unit08.lesson02.teach.how_much_this:
    title: Întreabă cât costă ceva
    gloss: Cât costă asta?
    note: این چنده؟ este modul colocvial obișnuit de a întreba prețul, o contragere a lui این چند است.
  fa.a1.unit08.lesson02.teach.per_kilo_price:
    title: Spune un preț pe kilogram
    gloss: Costă 30 de tomani kilogramul.
    note: کیلویی سی تومنه indică prețul pe kilogram folosind contragerea colocvială -e (تومنه = تومن است).
  fa.a1.unit08.lesson02.teach.contraction_note:
    title: Contragerea colocvială -e (recapitulare)
    gloss: تومنه este contragerea vorbită, de zi cu zi, a lui تومن است.
    note: Este același tipar de contragere pe care l-ai întâlnit deja la cuvintele despre vreme, precum آفتابیه.
  fa.a1.unit08.lesson03.teach.one_kilo:
    title: Cere un kilogram de mere
    gloss: Vreau un kilogram de mere.
    note: یک کیلو سیب می‌خوام folosește کیلو (kilogram) ca unitate de măsură.
  fa.a1.unit08.lesson03.teach.half_kilo:
    title: Cere o jumătate de kilogram
    gloss: Vreau o jumătate de kilogram.
    note: نصف کیلو می‌خوام folosește نصف (jumătate) în loc de un kilogram întreg.
  fa.a1.unit08.lesson04.teach.discount_question:
    title: Cere o reducere
    gloss: Faceți o reducere?
    note: تخفیف می‌دید؟ este o întrebare firească și frecventă în bazarurile și magazinele din Iran; negocierea face parte normală și așteptată din cultura cumpărăturilor, nu este nepoliticoasă sau neobișnuită.
  fa.a1.unit08.lesson04.teach.discount_offer:
    title: Vânzătorul oferă un preț mai mic
    gloss: Vă calculez 28 de tomani.
    note: برات بیست و هشت تومن حساب می‌کنم oferă o mică reducere față de prețul inițial de 30 de tomani.
  fa.a1.unit08.lesson05.teach.pay_cash:
    title: Spune că plătești cash
    gloss: Plătesc cash.
    note: نقدی حساب می‌کنم indică modalitatea de plată folosind نقدی (cash).
  fa.a1.unit08.lesson05.teach.card_question:
    title: Întreabă despre plata cu cardul
    gloss: Acceptați carduri?
    note: کارت می‌گیرید؟ întreabă dacă se acceptă plata cu cardul.
  fa.a1.unit08.lesson06.teach.please_review:
    title: Poftiți / vă rog (recapitulare)
    gloss: poftiți / vă rog
    note: بفرمایید a fost introdus în unitatea despre saluturi; aici vânzătorul îl folosește pentru a invita clientul înăuntru.
  fa.a1.unit08.lesson06.teach.thanks_review:
    title: Mulțumesc (recapitulare)
    gloss: mulțumesc
    note: ممنون a fost introdus în unitatea despre saluturi.
  fa.a1.unit08.lesson06.teach.no_worries_review:
    title: Nicio problemă (recapitulare)
    gloss: nicio problemă / cu plăcere
    note: قابلی نداره este un mod modest și frecvent de a răspunde la mulțumiri, întâlnit deja într-o unitate anterioară.
  fa.a1.unit08.lesson06.teach.turn01:
    title: Vânzătorul salută clientul
    gloss: Vânzătorul salută clientul și îl invită înăuntru.
    note: بفرمایید îl invită pe client să se uite în jur sau să întrebe ceva.
  fa.a1.unit08.lesson06.teach.turn02:
    title: Clientul întreabă prețul
    gloss: Clientul salută vânzătorul și întreabă cât costă merele.
    note: این چنده؟ din lecția 2, aplicat la سیب‌ها (merele).
  fa.a1.unit08.lesson06.teach.turn03:
    title: Vânzătorul spune prețul
    gloss: Vânzătorul spune că e 30 de tomani kilogramul.
    note: کیلویی سی تومنه din lecția 2.
  fa.a1.unit08.lesson06.teach.turn04:
    title: Clientul comandă și cere o reducere
    gloss: Clientul spune că vrea un kilogram și cere o reducere.
    note: Aici se combină tiparul cantității din lecția 3 cu întrebarea despre reducere din lecția 4.
  fa.a1.unit08.lesson06.teach.turn05:
    title: Vânzătorul acceptă un preț mai mic
    gloss: Vânzătorul este de acord și oferă 28 de tomani.
    note: باشه (bine) arată acordul înainte de a spune prețul redus.
  fa.a1.unit08.lesson06.teach.turn06:
    title: Clientul mulțumește și plătește
    gloss: Clientul mulțumește vânzătorului și spune că plătește cash.
    note: Aici se combină vocabularul de plată din lecția 5 cu o simplă mulțumire.
  fa.a1.unit08.lesson06.teach.turn07:
    title: Vânzătorul încheie schimbul
    gloss: Vânzătorul răspunde la mulțumiri și îl invită să poftească.
    note: قابلی نداره، بفرمایید încheie politicos tranzacția.
