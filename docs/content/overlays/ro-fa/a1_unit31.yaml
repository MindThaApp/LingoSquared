    title: Sărbătoare
    gloss: sărbătoare
    note: '*جشن* este cuvântul general pentru „sărbătoare”, diferit de *مهمونی* („petrecere”), care e mai specific.'
    example_gloss: Este sărbătorirea zilei mele.
  fa.a1.unit31.lesson06.teach.review_ha_plural:
    title: Sărbători / zile de naștere
    gloss: sărbători / zile de naștere
    note: '*جشن‌ها* și *تولدها* adaugă sufixul de plural *-ها* direct la *جشن*/*تولد*.'
    target_text: جشن‌ها (sărbători) / تولدها (zile de naștere)
  fa.a1.unit31.lesson06.teach.review_man_ro_doost:
    title: Eu / marcă de complement direct / îmi place
    gloss: eu / marcă a complementului direct / îmi place
    note: '*من*, *رو* și *دوست* se combină aici într-o propoziție despre preferințe legate de sărbători.'
    target_text: من (eu) / رو (marcă a complementului direct) / دوست دارم (îmi place)
  fa.a1.unit31.lesson06.teach.wrap_summary:
    title: Îmi plac sărbătorile și zilele de naștere
    gloss: Îmi plac sărbătorile și zilele de naștere
    note: '*من جشن‌ها و تولدها رو دوست دارم* folosește tiparul cunoscut cu *دوست دارم* și *رو*.'
