teaching:
  fa.a1.unit31.lesson01.teach.tavallod_word:
    title: Ziua de naștere
    gloss: ziua de naștere
    note: '*تولد* este cuvântul obișnuit pentru „zi de naștere”.'
    example_gloss: Azi este ziua mea.
  fa.a1.unit31.lesson01.teach.mehmooni_word:
    title: Petrecere
    gloss: petrecere
    note: '*مهمونی* este cuvântul vorbit, de zi cu zi, pentru „petrecere” sau „reuniune”; forma scrisă este *مهمانی*.'
    example_gloss: Petrecerea este azi.
  fa.a1.unit31.lesson01.teach.keik_word:
    title: Tort
    gloss: tort
    note: '*کیک* este cuvântul obișnuit pentru „tort” sau „prăjitură”.'
    example_gloss: Tortul acesta este delicios.
  fa.a1.unit31.lesson01.teach.hedye_word:
    title: Cadou
    gloss: cadou
    note: '*هدیه* înseamnă „cadou” sau „dar”.'
    example_gloss: Îmi place cadoul.
  fa.a1.unit31.lesson01.teach.review_words:
    title: Azi / an / am / și
    gloss: azi / an / am / și
    note: '*امروز*, *سال*, *دارم* și *و* sunt cuvinte cunoscute, care revin aici pentru a vorbi despre sărbători.'
    target_text: امروز (azi) / سال (an) / دارم (am) / و (și)
  fa.a1.unit31.lesson01.teach.tavallodam_pattern:
    title: Zi de naștere + a mea + este = este ziua mea
    gloss: zi de naștere + a mea + este = este ziua mea
    note: '*تولد* + terminația posesivă *-م* („meu/mea”) + colocvialul *-ه* („este”) dă *تولدمه*, „este ziua mea”.'
    target_text: تولد (zi de naștere) + م + ه = تولدمه (e ziua mea)
  fa.a1.unit31.lesson01.teach.combined_sentence:
    title: Azi este ziua mea și dau o petrecere
    gloss: Azi este ziua mea și dau o petrecere
    note: '*امروز تولدمه و مهمونی دارم* îmbină *امروز* + *تولدمه* + *و* + *مهمونی* + *دارم*.'
  fa.a1.unit31.lesson02.teach.key_word:
    title: Când
    gloss: când
    note: '*کِی* înseamnă „când” – observă semnul kasre, care îl deosebește de *کی* („cine”).'
    example_gloss: Când e petrecerea?
  fa.a1.unit31.lesson02.teach.question_when_birthday:
    title: Când e ziua ta?
    gloss: Când e ziua ta?
    note: '*تولدت کِیه؟* îmbină *تولد* + posesivul informal *-ت* („tău/ta”, ca în *چند سالته؟*) + *کِیه* (*کِی* + colocvialul *-ه*, „este”).'
  fa.a1.unit31.lesson02.teach.review_dahom_ordibehesht:
    title: 10 / Ordibehesht
    gloss: a 10-a / Ordibehesht (a doua lună iraniană)
    note: '*دهم* și *اردیبهشت* revin aici pentru a da o dată reală.'
    target_text: دهم (al zecelea) / اردیبهشت (Ordibehesht, a doua lună iraniană)
  fa.a1.unit31.lesson02.teach.answer_birthday_date:
    title: Ziua mea este pe 10 Ordibehesht
    gloss: Ziua mea este pe 10 Ordibehesht
    note: '*تولدم دهم اردیبهشته* adaugă colocvialul *-ه* („este”) la numele lunii, ca în alte date pe care le-ai văzut.'
  fa.a1.unit31.lesson03.teach.review_davat_hatman_miam:
    title: Invitație / sigur / vin
    gloss: invitație / sigur / vin
    note: '*دعوت*, *حتماً* și *میام* revin aici pentru a vorbi despre petreceri.'
    target_text: دعوت (invitație) / حتماً (sigur) / میام (vin)
  fa.a1.unit31.lesson03.teach.miai_pattern:
    title: Vin -> vii (informal)
    gloss: vin -> vii (informal)
    note: '*میای* este forma informală pentru „tu” a lui *میام* („vin”), la fel cum *می‌خونی* corespunde lui *می‌خونم*.'
    target_text: میام (vin) -> میای (vii, informal)
  fa.a1.unit31.lesson03.teach.review_be:
    title: Spre / la
    gloss: la / către
    note: '*به* („la, către”) revine aici în „la petrecere”.'
    target_text: به (la)
  fa.a1.unit31.lesson03.teach.question_invite:
    title: Vii la petrecerea mea de ziua mea?
    gloss: Vii la petrecerea mea de ziua mea?
    note: '*میای به مهمونی تولدم؟* reunește toate elementele din această lecție.'
  fa.a1.unit31.lesson03.teach.review_are:
    title: Da
    gloss: da
    note: '*آره* („da”) revine aici.'
    target_text: آره (da)
  fa.a1.unit31.lesson03.teach.answer_accept_invite:
    title: Da, vin sigur!
    gloss: Da, vin sigur!
    note: '*آره، حتماً میام!* acceptă invitația.'
