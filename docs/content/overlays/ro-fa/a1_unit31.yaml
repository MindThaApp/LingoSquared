course:
  title: Persană A1
  description: 'Farsi iranian pentru începători: cuvinte despre sărbători și zi de naștere (zi de naștere, petrecere, tort, cadou), cum întrebi și spui când e ziua ta (*تولدت کِیه؟*) cu lunile și numeralele ordinale deja învățate, cum inviți pe cineva la o petrecere și cum accepți o invitație (*میای به مهمونی؟* / *آره، حتماً میام*), un dialog de ziua lui Nima/Sara care introduce *تولدت مبارک* („La mulți ani!”), un text despre ziua lui Nima și o recapitulare în care numești sărbătorile preferate și scrii propria invitație sau urare.'
