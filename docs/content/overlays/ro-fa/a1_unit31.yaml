    note: '*مبارک* se folosește în expresii precum *تولدت مبارک* („La mulți ani!”).'
    example_gloss: La mulți ani!
  fa.a1.unit31.lesson04.teach.review_dialogue_words:
    title: Mâine / mulțumesc / ce frumos
    gloss: mâine / mulțumesc / ce bine
    note: '*فردا*, *ممنون* și *چه خوب* revin aici.'
    target_text: فردا (mâine) / ممنون (mulțumesc) / چه خوب (ce bine)
  fa.a1.unit31.lesson04.teach.dialogue_line1:
    title: 'Nima: Sara, mâine e ziua mea!'
    gloss: Sara, mâine e ziua mea!
  fa.a1.unit31.lesson04.teach.dialogue_line2:
    title: 'Sara: La mulți ani, Nima!'
    gloss: La mulți ani, Nima!
  fa.a1.unit31.lesson04.teach.dialogue_line3:
    title: 'Nima: Mulțumesc! Vii la petrecere?'
    gloss: Mulțumesc! Vii la petrecere?
  fa.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'Sara: Da, vin sigur. Îți iau un cadou.'
    gloss: Da, vin sigur. Îți iau un cadou.
  fa.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'Nima: Ce bine! Mulțumesc, Sara.'
    gloss: Ce bine! Mulțumesc, Sara.
  fa.a1.unit31.lesson05.teach.review_migire:
    title: Primesc -> el/ea primește
    gloss: iau -> el/ea ia
    note: '*می‌گیره* este forma colocvială de persoana a III-a a lui *می‌گیرم*, la fel cum *می‌خونه* vine de la *می‌خونم*.'
    target_text: می‌گیرم (primesc / cumpăr) -> می‌گیره (el/ea primește / cumpără)
  fa.a1.unit31.lesson05.teach.review_barash:
    title: Pentru tine -> pentru el/ea
    gloss: pentru tine -> pentru el/ea
    note: '*براش* („pentru el/ea”) este varianta de persoana a III-a a lui *برات* („pentru tine”).'
    target_text: برات (pentru tine) -> براش (pentru el/ea)
  fa.a1.unit31.lesson05.teach.review_reading_words:
    title: El/ea / este al lui Nima / el/ea vine
    gloss: el/ea / este al lui Nima / el/ea vine
    note: '*او* și *میاد* sunt necesare pentru a vorbi despre *نیما* la persoana a III-a; *نیماست* îmbină *نیما* + *است* („este”).'
    target_text: او (el/ea) / نیماست (e al lui Nima) / میاد (el/ea vine)
  fa.a1.unit31.lesson05.teach.reading_text:
    title: 'Text: Ziua lui Nima'
    gloss: Mâine este ziua lui Nima. Sara îi cumpără un cadou și vine la petrecere.
    note: Acest text relatează dialogul la persoana a III-a.
