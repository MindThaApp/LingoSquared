    gloss: sunt medic
    note: دکترم este forma colocvială contrasă de la دکتر هستم (sunt medic).
    example_gloss: Sunt medic.
  fa.a1.unit18.lesson01.teach.man_word:
    title: eu
    gloss: eu
    note: '*من* înseamnă „eu” (recapitulare). Îl poți pune înainte de *مهندسم*, *معلمم* sau *دکترم* pentru o propoziție mai completă: *من مهندسم*.'
    example_gloss: Sunt bine.
