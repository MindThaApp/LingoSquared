teaching:
  fa.a1.unit09.lesson01.teach.hour_word:
    title: Oră / ceas
    gloss: oră / ceas
    note: ساعت înseamnă atât „oră”, cât și „ceas” și este cuvântul de bază pentru a spune ora.
    example_gloss: Cât este ceasul?
  fa.a1.unit09.lesson01.teach.minute_word:
    title: Minut
    gloss: minut
    note: دقیقه este cuvântul pentru „minut”.
    example_gloss: Așteaptă cinci minute.
  fa.a1.unit09.lesson01.teach.half_word:
    title: Jumătate
    gloss: jumătate
    note: نیم înseamnă „jumătate” și se folosește pentru jumătatea de oră.
    example_gloss: Este șapte și jumătate.
  fa.a1.unit09.lesson01.teach.quarter_word:
    title: Sfert
    gloss: sfert
    note: ربع înseamnă „sfert” și se folosește pentru sfertul de oră.
    example_gloss: Este opt fără un sfert.
  fa.a1.unit09.lesson01.teach.va_word:
    title: Și
    gloss: și
    note: و este cuvântul de legătură obișnuit, folosit în toată această unitate.
    target_text: و (și)
  fa.a1.unit09.lesson02.teach.what_time_question:
    title: Întreabă cât este ceasul
    gloss: Cât este ceasul?
    note: ساعت چنده؟ este modul colocvial, de zi cu zi, de a întreba ora.
  fa.a1.unit09.lesson02.teach.contraction_note:
    title: Contragerea colocvială -e (recapitulare)
    gloss: چنده este forma contrasă din vorbirea de zi cu zi pentru چند است.
    note: Este același tipar de contragere pe care l-ai văzut deja la cuvintele despre vreme și cumpărături, precum آفتابیه și تومنه.
  fa.a1.unit09.lesson03.teach.three_oclock_half:
    title: Spune că este trei și jumătate
    gloss: Este ora trei și jumătate.
    note: ساعت سه و نیمه îmbină ora, و (și) și forma contrasă نیمه (jumătate).
  fa.a1.unit09.lesson03.teach.contraction_note2:
    title: Contragerea colocvială în -e, aplicată lui نیم
    gloss: نیمه este forma contrasă din vorbirea de zi cu zi pentru نیم است.
    note: Același tipar ca la چنده, aplicat lui نیم în loc de چند.
  fa.a1.unit09.lesson04.teach.sobh:
    title: Dimineața
    gloss: dimineață
    note: صبح denumește partea dimineții din zi.
    example_gloss: Mă trezesc devreme dimineața.
  fa.a1.unit09.lesson04.teach.zohr:
    title: Amiaza
    gloss: amiază
    note: ظهر denumește prânzul, mijlocul zilei.
    example_gloss: Prânzesc la amiază.
  fa.a1.unit09.lesson04.teach.asr:
    title: După-amiază
    gloss: după-amiază
    note: عصر denumește partea de după-amiază târzie / început de seară.
    example_gloss: Lucrez după-amiaza.
  fa.a1.unit09.lesson04.teach.shab:
    title: Noaptea
    gloss: noapte
    note: شب denumește noaptea.
    example_gloss: Mă culc devreme noaptea.
  fa.a1.unit09.lesson05.teach.appointment_word:
    title: Întâlnire
    gloss: întâlnire stabilită
    note: قرار este cuvântul general pentru o programare sau o întâlnire stabilită dinainte.
    example_gloss: Am o întâlnire stabilită.
  fa.a1.unit09.lesson05.teach.appointment_question:
    title: Întreabă la ce oră este întâlnirea
    gloss: La ce oră este întâlnirea?
    note: قرار ساعت چنده؟ aplică întrebarea despre oră din lecția 2 la o întâlnire anume.
  fa.a1.unit09.lesson05.teach.four_oclock:
    title: Spune o oră împreună cu momentul zilei
    gloss: ora patru după-amiaza
    note: ساعت چهار عصر îmbină ora cu عصر pentru a deosebi dimineața de după-amiază.
  fa.a1.unit09.lesson06.teach.tomorrow_review:
    title: Mâine (recapitulare)
    gloss: mâine
    note: فردا a fost introdus într-o unitate anterioară; aici este folosit pentru a introduce întâlnirea.
    example_gloss: Mâine am o întâlnire stabilită.
  fa.a1.unit09.lesson06.teach.late_word:
    title: Spune că întârzii puțin
    gloss: Voi întârzia puțin.
    note: '*یکم دیر می‌شه* folosește cuvântul colocvial *یکم* (puțin) și *دیر* (târziu).'
  fa.a1.unit09.lesson06.teach.turn01:
    title: Negar întreabă la ce oră este întâlnirea de mâine
    gloss: Negar întreabă la ce oră este întâlnirea de mâine.
    note: قرار فردا ساعت چنده؟ îmbină întrebarea despre întâlnire din lecția 5 cu فردا (mâine).
  fa.a1.unit09.lesson06.teach.turn02:
    title: Arash răspunde, nesigur
    gloss: Arash spune că i se pare că este ora patru.
    note: فکر کنم (cred că) îndulcește răspunsul, pentru că Arash nu este complet sigur.
  fa.a1.unit09.lesson06.teach.turn03:
    title: 'Negar cere o precizare: dimineața sau după-amiaza'
    gloss: Negar întreabă dacă ora patru este după-amiaza sau dimineața.
    note: Aceasta clarifică o posibilă neclaritate, deoarece ساعت چهار singur nu arată despre care ora patru este vorba.
  fa.a1.unit09.lesson06.teach.turn04:
    title: Arash precizează
    gloss: 'Arash spune: după-amiaza.'
    note: Un răspuns dintr-un singur cuvânt este firesc după ce întrebarea a stabilit contextul.
  fa.a1.unit09.lesson06.teach.turn05:
    title: Negar este de acord și își schimbă ora de sosire
    gloss: Negar este de acord și spune că va veni la patru și un sfert.
    note: ساعت چهار و ربع îmbină ora cu ربع (sfert).
  fa.a1.unit09.lesson06.teach.turn06:
    title: Arash întreabă de ce acel sfert de oră în plus
    gloss: Arash întreabă de ce spune „și un sfert”.
    note: '*چرا ربع؟* este o formă scurtă de a întreba „De ce sfertul?”'
  fa.a1.unit09.lesson06.teach.turn07:
    title: Negar explică faptul că va întârzia puțin
    gloss: Negar explică faptul că va întârzia puțin de la serviciu.
    note: '*چون* (pentru că) introduce motivul, folosind *یکم دیر می‌شه* (voi întârzia puțin), pe care tocmai l-ai învățat în această lecție.'
  fa.a1.unit09.lesson06.teach.turn08:
    title: Arash o liniștește
    gloss: 'Arash spune: bine, nicio problemă.'
    note: مشکلی نیست (nicio problemă) o liniștește pe Negar că întârzierea mică nu contează.
