  fa.a1.unit19.lesson04.location_in_home:
    title: Poziția în casă
  fa.a1.unit19.lesson05.reading_a_housing_description:
    title: Citirea unei descrieri de locuință
  fa.a1.unit19.lesson06.housing_dialogue:
    title: Un dialog despre o casă
teaching:
  fa.a1.unit19.lesson01.teach.khoone_word:
    title: Casă
    gloss: casă
    note: خونه înseamnă casă/locuință (forma colocvială a lui خانه).
    example_gloss: Casa mea este mare.
  fa.a1.unit19.lesson01.teach.otagh_khab_word:
    title: Dormitor
    gloss: dormitor
    note: اتاق خواب înseamnă literal „cameră de dormit” – dormitor.
    example_gloss: Are două dormitoare.
  fa.a1.unit19.lesson01.teach.ashpazkhone_word:
    title: Bucătărie
    gloss: bucătărie
    note: آشپزخانه înseamnă bucătărie.
    example_gloss: Bucătăria este mare.
  fa.a1.unit19.lesson01.teach.hamoom_word:
    title: Baie
    gloss: baie
    note: حموم înseamnă baie (forma colocvială a lui حمام).
    example_gloss: Baia este curată.
  fa.a1.unit19.lesson02.teach.chand_ta_word:
    title: Câți / câte
    gloss: câte
    note: چند تا înseamnă „câte”, și se folosește cu substantive numărabile.
    target_text: چند تا (câte)
  fa.a1.unit19.lesson02.teach.do_ta_word:
    title: Doi
    gloss: doi
    note: دو تا înseamnă „două” (din ceva numărabil).
    example_gloss: Are două băi.
  fa.a1.unit19.lesson02.teach.dare_word:
    title: Are
    gloss: are
    note: داره este forma colocvială contrasă a lui دارد (are), folosită pentru a descrie ce conține o locuință.
    target_text: داره (are, colocvial)
  fa.a1.unit19.lesson03.teach.takht_word:
    title: Pat
    gloss: pat
    note: تخت înseamnă pat.
    example_gloss: Patul este în dormitor.
  fa.a1.unit19.lesson03.teach.miz_word:
    title: Masă
    gloss: masă
    note: میز înseamnă masă.
    example_gloss: Masa este lângă fereastră.
  fa.a1.unit19.lesson03.teach.sandali_word:
    title: Scaun
    gloss: scaun
    note: صندلی înseamnă scaun.
    example_gloss: Lângă masă este un scaun.
  fa.a1.unit19.lesson03.teach.ye_word:
    title: Un/o; unu
    gloss: un / o
    note: یه este forma colocvială contrasă a lui یک (un/o).
    target_text: یه (un/o, colocvial)
  fa.a1.unit19.lesson03.teach.va_word:
    title: Și
    gloss: și
    note: و înseamnă „și” și leagă două propoziții sau două elemente.
    target_text: و (și)
  fa.a1.unit19.lesson04.teach.too_word:
    title: În / înăuntru
    gloss: în / înăuntru
    note: تو înseamnă „în/înăuntru” și indică locul într-o cameră.
    target_text: تو (în/înăuntru)
  fa.a1.unit19.lesson04.teach.kenar_word:
    title: Lângă
    gloss: lângă
    note: کنار înseamnă „lângă”.
    target_text: کنار (lângă)
  fa.a1.unit19.lesson04.teach.balaye_word:
    title: Deasupra / pe
    gloss: deasupra / pe
    note: بالای înseamnă „deasupra/pe”.
    target_text: بالای (deasupra/pe)
  fa.a1.unit19.lesson04.teach.takhte_word:
    title: Este patul
    gloss: este patul
    note: '*تخته* este *تخت* (pat) plus -e colocvial pentru „este” (din *است*). În *میز کنار تخته*, -e de la sfârșitul expresiei face din ea o propoziție: masa [este] lângă pat.'
    target_text: تخته (este patul, colocvial)
  fa.a1.unit19.lesson04.teach.ashpazkhones_word:
    title: Este bucătăria
    gloss: este bucătăria
    note: '*آشپزخانه‌س* este *آشپزخانه* (bucătărie) plus „este” colocvial după vocală (din *است*). În *صندلی تو آشپزخانه‌س* încheie propoziția: scaunul [este] în bucătărie.'
    target_text: آشپزخانه‌س (este bucătăria, colocvial)
  fa.a1.unit19.lesson05.teach.ham_word:
    title: De asemenea / și
    gloss: și / de asemenea
    note: هم înseamnă „și” sau „de asemenea” și se pune după cuvântul pe care îl determină.
    target_text: هم (și/de asemenea)
  fa.a1.unit19.lesson05.teach.man_word:
    title: eu
    gloss: eu
    note: من înseamnă „eu”.
    example_gloss: Casa mea are două dormitoare.
  fa.a1.unit19.lesson05.teach.khoonye_word:
    title: Casa lui / casa mea
    gloss: casa lui / casa mea
    note: خونه‌ی este forma cu ezafe a lui خونه, folosită înaintea posesorului (خونه‌ی من = casa mea).
    target_text: خونه‌ی (casa lui / casa mea, formă cu ezafe)
  fa.a1.unit19.lesson05.teach.reading_text:
    title: Exemplu de descriere a unei locuințe
    gloss: Casa mea are două dormitoare. Mai are o bucătărie și o baie.
    note: O scurtă descriere la persoana I, care reunește vocabularul locuinței din această unitate.
  fa.a1.unit19.lesson06.teach.names:
    title: Nima și Sara
    gloss: Nima, Sara
    note: Nume iraniene frecvente, folosite în tot cursul.
    example_gloss:
    - Casa lui Nima este mare.
    - Casa Sarei este mică.
  fa.a1.unit19.lesson06.teach.khoonet_chetore_phrase:
    title: Cum e casa ta?
    gloss: Cum e casa ta?
    note: خونه‌ت چطوره؟ îîmbină خونه‌ت (casa ta) cu چطوره؟ (cum este?).
  fa.a1.unit19.lesson06.teach.khoobe_word:
    title: Este bună
    gloss: este bun/bună
    note: خوبه este forma colocvială contrasă a lui خوب است (este bun/bună).
    example_gloss: Casa aceasta este bună.
  fa.a1.unit19.lesson06.teach.aare_word:
    title: Da
    gloss: da
    note: آره este forma colocvială a lui بله (da).
    example_gloss: Da, e bună.
  fa.a1.unit19.lesson06.teach.dialogue_line1:
    title: Nima întreabă
    gloss: Cum e casa ta?
  fa.a1.unit19.lesson06.teach.dialogue_line2:
    title: Sara răspunde
    gloss: E bună. Are două dormitoare și o bucătărie.
  fa.a1.unit19.lesson06.teach.dialogue_line3:
    title: Nima întreabă
    gloss: Are și baie?
  fa.a1.unit19.lesson06.teach.dialogue_line4:
    title: Sara răspunde
    gloss: Da, are și o baie.
