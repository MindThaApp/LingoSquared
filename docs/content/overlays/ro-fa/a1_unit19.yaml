course:
  title: Persană A1
  description: 'Farsi iraniană pentru începători: vocabularul de bază al camerelor, descrierea unei locuințe cu numere, obiecte casnice, poziția în casă, citirea unei scurte descrieri de locuință și un dialog despre casa cuiva.'
units:
  fa.a1.unit19.housing:
    title: Locuința
    description: 'Descrie o locuință simplă: camere, obiecte casnice și locul lor.'
lessons:
  fa.a1.unit19.lesson01.basic_room_vocab:
    title: Vocabularul de bază al camerelor
  fa.a1.unit19.lesson02.describing_with_numbers:
