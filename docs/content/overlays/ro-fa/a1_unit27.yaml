course:
  title: Persană A1
  description: 'Farsi iranian pentru începători: denumirea sporturilor (fotbal, baschet, volei, înot), întrebarea „Ce sport îți place?”, locul unde faci sport (sală, piscină, parc), cât de des (în fiecare zi, în fiecare săptămână, uneori, de N ori), un text scurt de citit despre rutina sportivă a lui نیما și un dialog final între نیما și سارا, în care compară ce sporturi practică, cât de des și unde.'
