teaching:
  fa.a1.unit27.lesson01.teach.man_review:
    title: eu
    gloss: eu
    note: '*من*, deja cunoscut, apare din nou aici pentru a vorbi despre sportul pe care îl practici.'
  fa.a1.unit27.lesson01.teach.varzesh_review:
    title: Sport / exerciții fizice
    gloss: sport / exerciții fizice
    note: '*ورزش* este cuvântul general pentru „sport” sau „exerciții fizice” și stă la baza întregii unități.'
    example_gloss: Sportul face bine.
  fa.a1.unit27.lesson01.teach.mikonam_review:
    title: Fac
    gloss: fac
    note: '*می‌کنم* este verbul „a face”, folosit în toată unitatea pentru a practica un sport.'
  fa.a1.unit27.lesson01.teach.footbal_review:
    title: Fotbal
    gloss: fotbal
    note: '*فوتبال* apare din nou aici ca primul sport denumit în unitate.'
    example_gloss: Fotbalul este un sport.
  fa.a1.unit27.lesson01.teach.bazi_mikonam_review:
    title: Joc fotbal
    gloss: Joc fotbal
    note: '*فوتبال بازی می‌کنم* înseamnă „joc fotbal”; *بازی* înseamnă „joc / a juca”.'
  fa.a1.unit27.lesson01.teach.basketball_word:
    title: Baschet
    gloss: baschet
    note: '*بسکتبال* este un împrumut direct, folosit în mod curent, pentru baschet.'
    example_gloss: Îmi place baschetul.
  fa.a1.unit27.lesson01.teach.basketball_bazi_mikonam_phrase:
    title: Joc baschet
    gloss: joc baschet
    note: '*بسکتبال بازی می‌کنم* urmează exact același tipar ca *فوتبال بازی می‌کنم*; se schimbă doar sportul.'
  fa.a1.unit27.lesson02.teach.volleyball_word:
    title: Volei
    gloss: volei
    note: '*والیبال* este un împrumut direct, folosit în mod curent, pentru volei.'
    example_gloss: Lui/Ei îi place voleiul.
  fa.a1.unit27.lesson02.teach.volleyball_bazi_mikonam_phrase:
    title: Joc volei
    gloss: joc volei
    note: '*والیبال بازی می‌کنم* urmează același tipar *بازی می‌کنم* ca fotbalul și baschetul.'
  fa.a1.unit27.lesson02.teach.shena_word:
    title: Înot
    gloss: înot
    note: '*شنا* înseamnă „înot”; spre deosebire de fotbal, baschet și volei, se îmbină direct cu *می‌کنم*, nu cu *بازی می‌کنم*, deoarece nu este un joc cu mingea.'
    example_gloss: Îmi place înotul.
  fa.a1.unit27.lesson02.teach.shena_mikonam_phrase:
    title: Înot
    gloss: înot
    note: '*شنا می‌کنم* înseamnă „înot”, literal „fac înot”.'
  fa.a1.unit27.lesson02.teach.che_review:
    title: Ce
    gloss: ce
    note: '*چه* este folosit aici într-un tipar nou de întrebare.'
  fa.a1.unit27.lesson02.teach.doost_dari_review:
    title: Îți place
    gloss: îți place
    note: '*دوست داری* apare din nou aici pentru a întreba despre sporturi.'
  fa.a1.unit27.lesson02.teach.che_varzeshi_phrase:
    title: Ce sport îți place?
    gloss: ce sport îți place?
    note: '*چه ورزشی دوست داری؟* îmbină *چه* + *ورزش* + terminația *-ی* (care dă sensul „ce fel de sport / care sport”) cu *دوست داری*; este modul firesc de a întreba pe cineva ce sport îi place.'
  fa.a1.unit27.lesson03.teach.koja_review:
    title: Unde
    gloss: unde
    note: '*کجا* funcționează la fel aici, pentru a întreba despre locul unde se face sport.'
  fa.a1.unit27.lesson03.teach.koja_varzesh_mikoni_phrase:
    title: Unde faci sport?
    gloss: unde faci sport?
    note: '*کجا ورزش می‌کنی؟* îmbină *کجا* cu *ورزش* și cu forma de persoana a II-a a lui *می‌کنم*.'
  fa.a1.unit27.lesson03.teach.mieram_review:
    title: Merg
    gloss: merg
    note: '*می‌رم* apare din nou aici pentru a spune că mergi la un loc de sport.'
  fa.a1.unit27.lesson03.teach.bashgah_word:
    title: Sală de sport
    gloss: sală de sport
    note: '*باشگاه* înseamnă „sală de sport” sau „club”. La fel ca în tiparul *می‌رم سینما* din Unitatea 24, nu e nevoie de prepoziție: doar *می‌رم* + locul.'
    example_gloss: Merg la sala de sport.
  fa.a1.unit27.lesson03.teach.estakhr_word:
    title: Piscină
    gloss: piscină
    note: '*استخر* înseamnă „piscină”.'
    example_gloss: Merg la piscină și înot.
  fa.a1.unit27.lesson03.teach.park_word:
    title: Parc
    gloss: parc
    note: '*پارک* este un împrumut direct pentru „parc”.'
    example_gloss: Merg în parc și joc fotbal.
  fa.a1.unit27.lesson04.teach.har_rooz_review:
    title: În fiecare zi
    gloss: în fiecare zi
    note: '*هر روز* apare din nou aici pentru a spune cât de des faci sport.'
  fa.a1.unit27.lesson04.teach.har_hafte_review:
    title: În fiecare săptămână
    gloss: în fiecare săptămână
    note: '*هر هفته* apare din nou aici.'
  fa.a1.unit27.lesson04.teach.gahi_review:
    title: Uneori
    gloss: uneori
    note: '*گاهی* apare din nou aici.'
  fa.a1.unit27.lesson04.teach.baar_word:
    title: Dată / ori
    gloss: dată / ori
    note: '*بار* este un cuvânt de numărare pentru „dată / ori”, folosit împreună cu un număr pentru a spune cât de des faci ceva.'
    example_gloss: Fac sport o dată.
  fa.a1.unit27.lesson04.teach.do_se_review:
    title: Doi / trei
    gloss: doi / trei
    note: '*دو* și *سه* sunt folosite aici pentru a număra de câte ori.'
  fa.a1.unit27.lesson04.teach.do_baar_phrase:
    title: De două ori
    gloss: de două ori
    note: '*دو بار* îmbină *دو* (doi) cu *بار*: „de două ori”.'
  fa.a1.unit27.lesson04.teach.se_baar_phrase:
    title: De trei ori
    gloss: de trei ori
    note: '*سه بار* îmbină *سه* (trei) cu *بار*: „de trei ori”.'
  fa.a1.unit27.lesson04.teach.har_hafte_do_baar_phrase:
    title: Fac sport de două ori pe săptămână
    gloss: fac sport de două ori pe săptămână
    note: '*هر هفته دو بار ورزش می‌کنم* reunește tot ce am învățat în această lecție: „în fiecare săptămână”, „de două ori” și „fac sport”.'
  fa.a1.unit27.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, personaj prezentat încă din Unitatea 11, apare din nou aici.'
    example_gloss: Nima iubește sportul.
  fa.a1.unit27.lesson05.teach.dare_review:
    title: El/ea are / îi place
    gloss: el/ea are / îi place
    note: '*داره* este forma pentru persoana a treia singular; în *ورزش دوست داره* înseamnă „îi place sportul”.'
  fa.a1.unit27.lesson05.teach.mikone_review:
    title: El/ea face
    gloss: el/ea face
    note: '*می‌کنه*, întâlnit deja în textul de citit din Unitatea 24, este forma colocvială de persoana a treia a lui *می‌کنم*.'
  fa.a1.unit27.lesson05.teach.mire_word:
    title: El/ea merge
    gloss: el/ea merge
    note: '*می‌ره* este forma colocvială de persoana a treia a aceluiași verb ca *می‌رم* (merg) din lecția 3.'
  fa.a1.unit27.lesson05.teach.ham_review:
    title: De asemenea / și
    gloss: de asemenea / și
    note: '*هم* înseamnă „și, de asemenea”.'
  fa.a1.unit27.lesson05.teach.va_review:
    title: Și
    gloss: și
    note: '*و* înseamnă „și” și a fost folosit astfel în Unitățile 5, 14, 24, 25 și 26.'
  fa.a1.unit27.lesson05.teach.reading_text:
    title: 'Text de citit: Sporturile lui Nima'
    gloss: Nima iubește sportul. Joacă fotbal de trei ori pe săptămână. Uneori merge și la piscină și înoată.
    note: Acest text reia toate construcțiile din lecțiile 1-4, plus *می‌ره* din lecția 5. Aproape nu are vocabular nou; important este să recunoști cuvintele într-un text continuu.
  fa.a1.unit27.lesson06.teach.dam_review:
    title: Am / îmi place
    gloss: am / îmi place
    note: '*دارم* apare din nou aici.'
  fa.a1.unit27.lesson06.teach.are_review:
    title: Da (colocvial)
    gloss: da
    note: '*آره* este cuvântul colocvial de zi cu zi pentru „da”.'
  fa.a1.unit27.lesson06.teach.tochi_review:
    title: Dar tu?
    gloss: dar tu?
    note: '*تو چی؟* apare din nou aici pentru a întoarce întrebarea. *تو* singur este „tu” informal.'
  fa.a1.unit27.lesson06.teach.chekhoob_review:
    title: Ce bine!
    gloss: ce bine!
    note: '*چه خوب!* este o reacție firească și aici.'
  fa.a1.unit27.lesson06.teach.miri_word:
    title: Tu mergi
    gloss: tu mergi
    note: '*می‌ری* este forma informală de persoana a doua a aceluiași verb ca *می‌رم* (merg) din lecția 3 și *می‌ره* (el/ea merge) din lecția 5.'
  fa.a1.unit27.lesson06.teach.aaleeye_word:
    title: Grozav / excelent
    gloss: grozav / excelent
    note: '*عالیه* este o modalitate colocvială frecventă de a spune „grozav” sau „excelent”.'
    example_gloss: Sala aceasta de sport este grozavă.
  fa.a1.unit27.lesson06.teach.dialogue_line1:
    title: 'Nima: Ce sport îți place?'
    gloss: Ce sport îți place?
  fa.a1.unit27.lesson06.teach.dialogue_line2:
    title: 'Sara: Îmi place înotul. Merg la piscină de trei ori pe săptămână. Dar ție?'
    gloss: Îmi place înotul. Merg la piscină de trei ori pe săptămână. Dar ție?
  fa.a1.unit27.lesson06.teach.dialogue_line3:
    title: 'Nima: Îmi place fotbalul. Merg în parc și joc în fiecare zi.'
    gloss: Îmi place fotbalul. Merg în parc și joc în fiecare zi.
  fa.a1.unit27.lesson06.teach.dialogue_line4:
    title: 'Sara: Ce bine! Mergi și la sală?'
    gloss: Ce bine! Mergi și la sală?
  fa.a1.unit27.lesson06.teach.dialogue_line5:
    title: 'Nima: Da, uneori merg și la sală.'
    gloss: Da, uneori merg și la sală.
  fa.a1.unit27.lesson06.teach.dialogue_line6:
    title: 'Sara: Grozav!'
    gloss: Grozav!
