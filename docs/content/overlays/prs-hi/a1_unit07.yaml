teaching:
  hi.a1.unit07.lesson01.teach.dukaan_bazaar:
    title: دکان، بازار
    gloss: دکان، بازار
    note: دو جای معمول برای خرید که در تمام این واحد به کار می‌روند.
    example_gloss:
    - این یک دکان است.
    - این یک بازار است.
  hi.a1.unit07.lesson01.teach.dukaandaar:
    title: دکان‌دار
    gloss: دکان‌دار
    note: یک شخصیت تازه در این واحد -- کسی که دکان را می‌گرداند و چون بیگانه است، با aap خطاب می‌شود.
    example_gloss: این دکان‌دار است.
  hi.a1.unit07.lesson01.teach.kameez_bag_topi:
    title: پیراهن، بیگ، کلاه
    gloss: پیراهن، بیگ، کلاه
    note: سه چیز معمول خرید که در تمام این واحد برای تمرین الگوی *mujhe ... chahiye* از واحد غذا به کار می‌روند.
    example_gloss:
    - یک پیراهن می‌خواهم.
    - یک بیگ می‌خواهم.
    - یک کلاه می‌خواهم.
  hi.a1.unit07.lesson01.teach.mujhe_yah_chahiye:
    title: این را می‌خواهم
    gloss: این را می‌خواهم.
    note: یک عبارت عمومی برای خواستن یک چیز؛ *mujhe ... chahiye* از واحد غذا با *yah* (این) دوباره به کار رفته است.
  hi.a1.unit07.lesson01.teach.ji:
    title: جی (لقب احترام)
    gloss: یک ذرهٔ احترام، مثل اضافه کردن «صاحب» یا «خانم»
    note: بعد از نام یا لقب می‌آید تا مؤدبانه‌تر شود؛ هنگام خطاب به یک بیگانه مثل دکان‌دار معمول است.
    example_gloss: سلام، دکان‌دار صاحب.
  hi.a1.unit07.lesson01.teach.sirf:
    title: فقط
    gloss: فقط، صرف
    note: برای گفتن اینکه فقط یک چیز می‌خواهین، نه چندتا.
    example_gloss: فقط یک پیراهن می‌خواهم.
  hi.a1.unit07.lesson01.teach.aapko_aur_kuch_chahiye:
    title: چیز دیگر هم می‌خواهین؟ (رسمی)
    gloss: چیز دیگر هم می‌خواهین؟
    note: سوال رسمی و طبیعی که دکان‌دار بعد از گرفتن بخشی از سفارش می‌پرسد؛ *aapko* و *chahiye* دوباره به کار رفته‌اند.
  hi.a1.unit07.lesson01.teach.ji_nahin_sirf_yah:
    title: نه، فقط این
    gloss: نه، فقط همین.
    note: یک راه طبیعی و مؤدبانه برای نه گفتن به چیزهای بیشتر، که *ji* و *sirf* همین درس را دوباره به کار می‌برد.
  hi.a1.unit07.lesson01.teach.tumhein_kya_chahiye_bataao:
    title: بگو چی می‌خواهی
    gloss: بگو چی می‌خواهی.
    note: جملهٔ غیررسمی تمرین که این کورس برای خواستن جواب شفاهی استفاده می‌کند؛ مثل نسخهٔ واحد غذا.
  hi.a1.unit07.lesson02.teach.keemat:
    title: قیمت
    gloss: قیمت
    note: از بخش اعداد و قیمت‌های واحد ۲ آمده و اینجا برای خریداری همین واحد دوباره آموزش داده می‌شود.
    example_gloss: قیمتش چند است؟
  hi.a1.unit07.lesson02.teach.rupaye:
    title: روپیه
    gloss: روپیه
    note: کلمهٔ پول که از واحد ۲ آمده و حالا با دو قیمت مختلف تمرین می‌شود.
    example_gloss:
    - قیمتش دو صد روپیه است.
    - قیمتش پنج صد روپیه است.
  hi.a1.unit07.lesson02.teach.iski_keemat_kya_hai:
    title: قیمتش چند است؟
    gloss: قیمتش چند است؟
    note: راه معمول پرسیدن قیمت که مستقیم از واحد ۲ آمده است.
  hi.a1.unit07.lesson02.teach.iski_keemat_bees_rupaye_hai:
    title: قیمتش دو صد روپیه است
    gloss: قیمتش دو صد روپیه است.
    note: یک جواب نمونه برای سوال قیمت در بالا.
  hi.a1.unit07.lesson02.teach.kitne_ka_ki_note:
    title: Kitne ka / kitne ki
    gloss: '''Yah kitne ka hai?'' برای چیزهای مذکر است و ''Yah kitne ki hai?'' برای چیزهای مؤنث -- *kitne* هرگز تغییر نمی‌کند -- فقط *ka/ki* تغییر می‌کند، درست مثل تبدیل -a/-i در *mera/meri* و *tumhara/tumhari* که قبلاً یاد گرفته‌اید.'
    note: راه دوم و بسیار رایج پرسیدن قیمت، که بر همان الگوی مطابقت جنسیت در ضمایر ملکی ساخته شده -- فقط ka/ki تغییر می‌کند، نه kitne.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ka_hai:
    title: این چند است؟ (مذکر)
    gloss: این چند است؟
    note: برای چیز مذکر استفاده می‌شود، مثل بیگ.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ki_hai:
    title: این چند است؟ (مؤنث)
    gloss: این چند است؟
    note: برای چیز مؤنث استفاده می‌شود، مثل کلاه.
  hi.a1.unit07.lesson02.teach.sasta_mehenga:
    title: ارزان، گران
    gloss: ارزان، گران
    note: یک جفت صفت رایج برای واکنش به قیمت؛ اینجا شکل‌های مذکر نشان داده شده است.
    example_gloss:
    - این بیگ ارزان است.
    - این بیگ گران است.
  hi.a1.unit07.lesson02.teach.sasti_mehengi_note:
    title: Sasti و mehengi
    gloss: '''Sasta'' و ''mehenga'' هم مثل ''mera/meri'' برای مذکر و مؤنث تغییر می‌کنند -- با کلمه‌های مؤنث می‌گوییم ''sasti'' و ''mehengi''، مثل ''yah topi sasti hai'' (این کلاه ارزان است) یا ''yah kameez mehengi hai'' (این پیراهن گران است).'
    note: مثال دومی واقعی از همان الگوی مطابقت جنسیت که این کورس بارها صریحاً نشان می‌دهد.
  hi.a1.unit07.lesson03.teach.khareedna:
    title: خریدن
    gloss: خریدن
    note: ساختار 'V + na chahta/chahti hun' (می‌خواهم ...) را که در واحد ۱ برای یاد گرفتن یوگا آموختید، اینجا برای خریدن به کار می‌برد.
    example_gloss:
    - می‌خواهم این پیراهن را بخرم.
    - می‌خواهم این کلاه را بخرم.
  hi.a1.unit07.lesson03.teach.chalo_kuch_khareedte_hain:
    title: بیایین چیزی بخریم!
    gloss: بیایین چیزی بخریم!
    note: یک راه دوستانه و ثابت برای پیشنهاد خریداری با هم، که گفتگوی پایانی این واحد را شروع می‌کند؛ مثل الگوی 'chalo, kuch khate hain!' در واحد غذا.
  hi.a1.unit07.lesson03.teach.dialogue.line01:
    title: ارجن پیشنهاد خریداری می‌کند
    gloss: ارجن می‌گوید بیایین چیزی بخریم.
    note: جملهٔ آغازین همین واحد را دوباره به کار می‌برد.
  hi.a1.unit07.lesson03.teach.dialogue.line02:
    title: پریا قبول می‌کند
    gloss: 'پریا قبول می‌کند و فکر می‌کند: پیراهن یا کلاه؟'
    note: '*ya* (یا) را برای انتخاب بین دو چیز معرفی می‌کند.'
  hi.a1.unit07.lesson03.teach.dialogue.line03:
    title: دوکاندار سلام می‌دهد
    gloss: دوکاندار سلام می‌دهد و می‌پرسد چی می‌خواهند.
    note: سلام رسمی با «آپ»، که *aapko kya chahiye* درس ۱ را دوباره به کار می‌برد.
  hi.a1.unit07.lesson03.teach.dialogue.line04:
    title: پریا دربارهٔ پیراهن می‌پرسد
    gloss: پریا مؤدبانه به دوکاندار سلام می‌دهد و یک پیراهن می‌خواهد، بعد قیمتش را می‌پرسد.
    note: '*ji*، *mujhe ... chahiye* و *iski keemat kya hai* را با هم یکجا می‌کند.'
  hi.a1.unit07.lesson03.teach.dialogue.line05:
    title: دوکاندار قیمت را می‌گوید
    gloss: دوکاندار می‌گوید قیمتش سه صد روپیه است.
    note: الگوی *iski keemat ... rupaye hai* را با یک عدد نو دوباره به کار می‌برد.
  hi.a1.unit07.lesson03.teach.dialogue.line06:
    title: پریا واکنش نشان می‌دهد و تصمیم می‌گیرد
    gloss: پریا می‌گوید سه صد روپیه؟ ارزان است! این پیراهن را می‌خواهم.
    note: '*sasti* را از نکتهٔ دستوری درس ۲ دوباره به کار می‌برد.'
  hi.a1.unit07.lesson03.teach.dialogue.line07:
    title: ارجن دربارهٔ کلاه می‌پرسد
    gloss: ارجن می‌گوید یک کلاه می‌خواهد و می‌پرسد چند است.
    note: شکل مؤنث *kitne ki hai* درس ۲ را دوباره به کار می‌برد.
  hi.a1.unit07.lesson03.teach.dialogue.line08:
    title: دوکاندار جواب می‌دهد
    gloss: دوکاندار می‌گوید کلاه پنج صد روپیه است.
    note: '*paanch sau* (پنج صد) درس ۲ را دوباره به کار می‌برد.'
  hi.a1.unit07.lesson03.teach.dialogue.line09:
    title: ارجن واکنش نشان می‌دهد و با آن هم می‌خرد
    gloss: ارجن می‌گوید پنج صد روپیه؟ گران است! خوب است، این کلاه را می‌خواهم.
    note: '*mehengi* را از نکتهٔ دستوری درس ۲ دوباره به کار می‌برد، بعد با آن هم می‌خرد.'
  hi.a1.unit07.lesson03.teach.dialogue.line10:
    title: دوکاندار می‌پرسد همین بود یا نه
    gloss: دوکاندار می‌گوید خوب است، چیز دیگر هم می‌خواهین؟
    note: '*aapko aur kuch chahiye* درس ۱ را دوباره به کار می‌برد.'
  hi.a1.unit07.lesson03.teach.dialogue.line11:
    title: پریا سفارش را تمام می‌کند
    gloss: پریا می‌گوید نه، فقط همین، تشکر!
    note: '*ji nahin, sirf yah* درس ۱ را همراه با *shukriya* دوباره به کار می‌برد.'
  hi.a1.unit07.lesson03.teach.dialogue.line12:
    title: دوکاندار خداحافظی می‌کند
    gloss: دوکاندار تشکر می‌کند و می‌گوید باز می‌بینیم.
    note: عبارت پایانی معمول همین کورس را دوباره به کار می‌برد.
