teaching:
  hi.a1.unit10.lesson01.teach.review_time:
    title: 'مرور: ساعت، صبح، چاشت، عصر، شب، در'
    gloss: ساعت، صبح، نیمروز، عصر، شب، در (زمان عمومی)
    note: مرور کوتاه کلمه‌های زمان از درس چهارم؛ در این درس زیاد استفاده می‌شوند.
    example_gloss:
    - حالا ساعت ۸ صبح است.
    - شب صنف نیست.
  hi.a1.unit10.lesson01.teach.uthna:
    title: من پا می‌شوم
    gloss: من پا می‌شوم (گوینده مرد / زن)
    note: نخستین فعل زمان حال عادتی این درس؛ الگوی -ta/-tee که در درس پنجم دیدید (rahta hai/rahtee hai) با hoon به اول شخص گسترش می‌یابد.
    example_gloss:
    - من ساعت ۷ صبح پا می‌شوم.
    - من ساعت ۶ صبح پا می‌شوم.
  hi.a1.unit10.lesson01.teach.roz:
    title: هر روز
    gloss: هر روز
    note: قید تازه‌ای برای گفتن از کارهای روزمره.
    example_gloss: من هر روز صبح پا می‌شوم.
  hi.a1.unit10.lesson01.teach.nashta_karna:
    title: من چاشت می‌خورم
    gloss: من چاشت می‌خورم (گوینده مرد / زن)
    note: «ناشتا» (چاشت) با «karta/kartee hoon» (می‌کنم) می‌آید.
    example_gloss:
    - صبح چاشت می‌خورم.
    - صبح چاشت می‌خورم.
  hi.a1.unit10.lesson01.teach.kaam_par_jaana:
    title: سر کار می‌روم
    gloss: من به کار می‌روم (گوینده مرد / زن)
    note: «کام پر جانا» (رفتن به کار) کلمهٔ «par» را لازم دارد و عبارت ثابت است؛ اما «school jaana» که بعداً در این درس می‌آید، کلمهٔ اضافی نمی‌خواهد.
    example_gloss:
    - بعد از آن سر کار می‌روم.
    - بعد از آن سر کار می‌روم.
  hi.a1.unit10.lesson01.teach.habitual_paradigm_note:
    title: الگوی زمان حال عادتی
    gloss: 'برای گفتن عادت روزانه، فعل -ta/-tee/-te می‌گیرد و بر اساس فاعل hoon/ho/hai/hain اضافه می‌شود: من پا می‌شوم (مرد/زن) «hoon»، تو پا می‌شوی «ho»، او پا می‌شود «hai»، آن‌ها پا می‌شوند «hain».'
    note: کل الگو از اول گفته می‌شود (در گفت‌وگوی درس اول اشاره‌وار دیده شد و برای سوم شخص در درس پنجم آمد) تا در تمرین‌های این درس مجبور به حدس زدن شکل نخوانده نباشین.
  hi.a1.unit10.lesson01.teach.full_routine_phrase:
    title: صبح من، قدم به قدم
    gloss: من هر صبح ساعت ۷ پا می‌شوم، بعد چاشت می‌خورم، بعد به کار می‌روم.
    note: سه فعل روزمرهٔ این درس در یک جملهٔ طبیعی و پشت‌هم آمده‌اند.
  hi.a1.unit10.lesson02.teach.sona:
    title: من می‌خوابم
    gloss: من می‌خوابم (گوینده مرد / زن)
    note: همان الگوی -ta/-tee + hoon برای یک فعل تازه.
    example_gloss:
    - من ساعت ۱۱ شب می‌خوابم.
    - من ساعت ۱۰ شب می‌خوابم.
  hi.a1.unit10.lesson02.teach.school_jaana:
    title: من به مکتب می‌روم
    gloss: من به مکتب می‌روم (گوینده مرد / زن)
    note: برخلاف «kaam par jaana»، در «school jaana» پیش از «jaana» کلمهٔ اضافی نمی‌آید.
    example_gloss:
    - من هر صبح ساعت ۸ به مکتب می‌روم.
    - من هر صبح ساعت ۸ به مکتب می‌روم.
  hi.a1.unit10.lesson02.teach.tum_form_note:
    title: 'شکل tum: -te/-tee + ho'
    gloss: 'با «tum» (تو، غیررسمی) فعل -te/-tee و «ho» می‌گیرد: تو پا می‌شوی (از مرد می‌پرسی) / تو پا می‌شوی (از زن می‌پرسی)، تو می‌خوابی (از مرد می‌پرسی) / تو می‌خوابی (از زن می‌پرسی).'
    note: بخش دوم شخص از همان الگویی که در درس اول معرفی شد.
  hi.a1.unit10.lesson02.teach.addressee_gender_note:
    title: فعل شکل tum با جنسیت چه کسی می‌خواند؟
    gloss: 'فعل شکل tum با جنسیت کسی که از او می‌پرسید هماهنگ می‌شود، نه گوینده؛ از پریا: «تو کی پا می‌شوی؟» (شکل مؤنث)؛ از ارجن: «تو کی پا می‌شوی؟» (شکل مذکر).'
    note: نکته‌ای که آسان از نظر می‌افتد؛ در همهٔ جمله‌های tum در گفت‌وگوی درس سوم بررسی شده است.
  hi.a1.unit10.lesson02.teach.kab_uthte_ho_phrase:
    title: کی پا می‌شوی؟
    gloss: کی پا می‌شوی؟ (از یک مرد)
    note: پرسشی آماده برای استفاده، با شکل tum که در این درس آمد.
  hi.a1.unit10.lesson02.teach.pahle_phir_routine:
    title: اول پا می‌شوم، بعد چاشت می‌خورم
    gloss: اول پا می‌شوم، بعد چاشت می‌خورم.
    note: «pahle»/«phir» (اول/بعد) از ترتیب راهنمایی درس نهم، این‌جا برای ترتیب کارهای روزمره به کار می‌رود.
  hi.a1.unit10.lesson02.teach.kaam_idiom_note:
    title: «kaam par» و «school»
    gloss: «Kaam par jaana» (رفتن به کار) «par» می‌خواهد، اما «school jaana» (رفتن به مکتب) کلمهٔ اضافی نمی‌خواهد؛ هر دو درست و رایج‌اند.
    note: تفاوت اصطلاحی واقعی است، نه یک قاعدهٔ کلی با یک استثنا.
  hi.a1.unit10.lesson03.teach.vaapas:
    title: پس
    gloss: پس
    note: با «aana» (آمدن) برای «برگشتن» به کار می‌رود.
    example_gloss: من برمی‌گردم.
  hi.a1.unit10.lesson03.teach.aana:
    title: من می‌آیم
    gloss: من می‌آیم (گوینده مرد / زن)
    note: فعل تازه‌ای با همان الگوی حال عادتی که قبلاً آموختید.
    example_gloss:
    - من عصر برمی‌گردم.
    - من عصر برمی‌گردم.
  hi.a1.unit10.lesson03.teach.khana_verb:
    title: من غذا می‌خورم
    gloss: من غذا می‌خورم (گوینده مرد / زن)
    note: «khana» اسم (غذا، از درس ششم) و «khana» فعل (خوردن)؛ این تکرار در هندی طبیعی است، اشتباه تایپی نیست.
    example_gloss:
    - من شب غذا می‌خورم.
    - من شب غذا می‌خورم.
  hi.a1.unit10.lesson03.teach.raat_ka_khana:
    title: غذای شب
    gloss: 'غذای شب (لفظاً: «غذای شب»)'
    note: «raat» (شب)، «ka» (نشانهٔ تعلق) و «khana» (غذا) که همه قبلاً آموخته شده‌اند، دوباره می‌آیند.
    example_gloss: غذای شب بسیار مزه‌دار است.
  hi.a1.unit10.lesson03.teach.dialogue.line01:
    title: ارجن می‌پرسد پریا کی پا می‌شود
    gloss: ارجن از پریا می‌پرسد که هر روز ساعت چند پا می‌شود.
    note: شکل مؤنث tum که درست برای خطاب به پریا به کار رفته است.
  hi.a1.unit10.lesson03.teach.dialogue.line02:
    title: پریا جواب می‌دهد
    gloss: 'پریا می‌گوید: من هر صبح ساعت ۶ پا می‌شوم. بعد چاشت می‌خورم.'
  hi.a1.unit10.lesson03.teach.dialogue.line03:
    title: ارجن از روز خودش می‌گوید
    gloss: 'ارجن می‌گوید: خوب است! من ساعت ۷ پا می‌شوم. من هم چاشت می‌خورم، بعد به کار می‌روم.'
  hi.a1.unit10.lesson03.teach.dialogue.line04:
    title: پریا می‌پرسد ارجن کی برمی‌گردد
    gloss: پریا از ارجن می‌پرسد که کی برمی‌گردد.
    note: شکل مذکر tum که درست برای خطاب به ارجن به کار رفته است. «vaapas aana» در متن معرفی می‌شود.
  hi.a1.unit10.lesson03.teach.dialogue.line05:
    title: ارجن عصر خود را شرح می‌دهد
    gloss: 'ارجن می‌گوید: من عصر ساعت ۶ برمی‌گردم. بعد غذای شب می‌خورم، بعد می‌خوابم.'
  hi.a1.unit10.lesson03.teach.dialogue.line06:
    title: پریا عصر خود را شرح می‌دهد
    gloss: 'پریا می‌گوید: من هم عصر برمی‌گردم، بعد غذا می‌خورم.'
  hi.a1.unit10.lesson03.teach.dialogue.line07:
    title: ارجن می‌پرسد پریا کی می‌خوابد
    gloss: ارجن می‌پرسد پریا ساعت چند می‌خوابد.
    note: باز هم شکل مؤنث tum که درست برای خطاب به پریا به کار رفته است.
  hi.a1.unit10.lesson03.teach.dialogue.line08:
    title: پریا جواب می‌دهد و خداحافظی می‌کند
    gloss: 'پریا می‌گوید: من شب ساعت ۱۱ می‌خوابم. خوب است، فردا می‌بینیم!'
  hi.a1.unit10.lesson03.teach.dialogue.line09:
    title: ارجن خداحافظی می‌کند
    gloss: 'ارجن می‌گوید: خوب است، باز می‌بینیم!'
