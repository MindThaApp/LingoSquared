teaching:
  hi.a1.unit09.lesson01.teach.review_places:
    title: 'مرور: جای‌ها'
    gloss: بانک، مکتب، شفاخانه، پارک، ستیشن، ڈاکخانه
    note: مرور سریع کلمه‌های جای‌ها از درس پیشین -- این درس زیاد از آن‌ها استفاده می‌کند.
    example_gloss:
    - بانک اینجاست.
    - ڈاکخانه نزدیک بانک است.
  hi.a1.unit09.lesson01.teach.review_function_words:
    title: 'مرور: است، کجا، اینجا، آنجا، از، «از/مال»، خوب'
    gloss: است، کجا، اینجا، آنجا، از، مال/«-ِ»، خوب
    note: مرور سریع کلمه‌های کوچک دستوری از درس‌های پیشین که تمرین‌های این درس دوباره از آن‌ها استفاده می‌کنند.
    example_gloss:
    - بانک کجاست؟
    - پارک آنجاست.
  hi.a1.unit09.lesson01.teach.seedhe_baaen_daaen:
    title: مستقیم، چپ، راست
    gloss: مستقیم، چپ، راست
    note: سه کلمهٔ اصلی جهت در این درس.
    example_gloss:
    - مستقیم برو.
    - به چپ بپیچ.
  hi.a1.unit09.lesson01.teach.jao_muro:
    title: برو!، بپیچ!
    gloss: برو!، بپیچ! (امر غیررسمی)
    note: امرهای شکل tum -- لحن طبیعی وقتی دو دوست به هم راه را نشان می‌دهند.
    example_gloss:
    - مستقیم برو.
    - به راست بپیچ.
  hi.a1.unit09.lesson01.teach.yahan_se_seedhe_jao:
    title: از اینجا مستقیم برو
    gloss: از اینجا مستقیم برو.
    note: کلمه‌های تازهٔ این درس را با yahaan se (از اینجا) یکجا می‌کند.
  hi.a1.unit09.lesson01.teach.baaen_muro_phrase:
    title: به چپ بپیچ
    gloss: به چپ بپیچ.
    note: یک امر مستقل که همین‌طور آمادهٔ استفاده است.
  hi.a1.unit09.lesson01.teach.daaen_muro_phrase:
    title: به راست بپیچ
    gloss: به راست بپیچ.
    note: امر قرینه برای baaen muro.
  hi.a1.unit09.lesson01.teach.imperative_note:
    title: پایان امر «-ओ»
    gloss: Jaao و muro امرهای شکل tum اند، مثل bataao و gino -- همه به «-o» ختم می‌شوند.
    note: الگوی مشترک امر غیررسمی را نشان می‌دهد که در دو کلمهٔ درس‌های پیشین هم بود (bataao در درس ۷ و gino در درس ۲).
  hi.a1.unit09.lesson02.teach.bank_kaise_jaun:
    title: چطور به بانک برسم؟
    gloss: به بانک چطور برسم؟
    note: سوال اصلی برای پرسیدن راه، با شکل اول شخص «بروم؟».
  hi.a1.unit09.lesson02.teach.tak:
    title: تا / تا به
    gloss: تا / تا به
    note: در درس ۲ برای شمردن دیده بودید («zero se das tak»)؛ اینجا در معنای واقعی مکانی‌اش به کار می‌رود.
    example_gloss: تا بانک مستقیم برو.
  hi.a1.unit09.lesson02.teach.bank_tak_seedhe_jao:
    title: تا بانک مستقیم برو
    gloss: تا بانک مستقیم برو.
    note: یک جملهٔ نمونه که tak را در معنای مکانی به کار می‌برد.
  hi.a1.unit09.lesson02.teach.pahle_phir:
    title: اول، بعد
    gloss: اول، بعد
    note: یک جفت کلمه برای ردیف کردن دو مرحلهٔ راه.
    example_gloss:
    - اول مستقیم برو.
    - بعد به چپ بپیچ.
  hi.a1.unit09.lesson02.teach.pahle_seedhe_phir_baaen:
    title: اول مستقیم، بعد چپ
    gloss: اول مستقیم برو، بعد به چپ بپیچ.
    note: pahle و phir را در یک راهنمایی دو مرحله‌ای یکجا می‌کند.
  hi.a1.unit09.lesson02.teach.pahle_phir_note:
    title: Pahle و phir
    gloss: Pahle و phir دو مرحله را وصل می‌کنند -- کار اول با pahle و کار دوم با phir می‌آید، مثل pahle seedhe jaao, phir baaen muro.
    note: یک نکتهٔ دستوری واقعی و مفید دربارهٔ ردیف کردن راهنمایی‌های چندمرحله‌ای.
  hi.a1.unit09.lesson03.teach.nukkad:
    title: سر کنج
    gloss: سر کنج
    note: کلمهٔ تازهٔ مکان برای گفتگوی پایانی این درس که با par (در/بر) می‌آید.
    example_gloss:
    - بانک سر چهارراه است.
    - پارک پشت مکتب است.
  hi.a1.unit09.lesson03.teach.bas:
    title: فقط / صرف
    gloss: فقط / صرف
    note: برای «بس» (وسیلهٔ نقلیه) هم یک واژهٔ قرضی رایج است، اما این معنا در این کورس آموزش داده نمی‌شود، پس اینجا ابهام واقعی وجود ندارد.
    example_gloss: فقط کمی دیگر برو.
  hi.a1.unit09.lesson03.teach.samajh_gaya:
    title: فهمیدم / دانستم
    gloss: فهمیدم / دانستم
    note: 'یک عبارت دوکلمه‌یی رایج: «samajh» (ریشهٔ «samajhna»، یعنی فهمیدن) به‌علاوهٔ «gaya» (رفت) که نشان می‌دهد کار تمام شده است. این شکل مذکر است؛ پریا می‌گوید «samajh gayi».'
    example_gloss: فهمیدم.
  hi.a1.unit09.lesson03.teach.accha_bahut_shukriya:
    title: خوب است! خیلی تشکر!
    gloss: خوب است! خیلی تشکر!
    note: «accha»، «bahut» و «shukriya» از درس‌های پیشین دوباره آمده‌اند.
  hi.a1.unit09.lesson03.teach.koi_baat_nahin_phir_milenge:
    title: مشکلی نیست! باز همدیگر را می‌بینیم.
    gloss: مشکلی نیست! باز همدیگر را می‌بینیم.
    note: جملهٔ پایانی معمول همین کورس که بدون تغییر از واحد ۸ تکرار شده است.
  hi.a1.unit09.lesson03.teach.dialogue.line01:
    title: ارجن از پُستخانه می‌پرسد
    gloss: ارجن از پریا می‌پرسد که چطور به پُستخانه برود.
    note: الگوی سوال آغازین همین درس از درس ۲ دوباره آمده است.
  hi.a1.unit09.lesson03.teach.dialogue.line02:
    title: پریا راهنمایی را شروع می‌کند
    gloss: 'پریا می‌گوید: از اینجا اول مستقیم برو.'
    note: «yahaan se» و «pahle» از بخش‌های پیشین همین واحد تکرار شده‌اند.
  hi.a1.unit09.lesson03.teach.dialogue.line03:
    title: ارجن می‌پرسد بعد چه؟
    gloss: ارجن می‌گوید خوب است و می‌پرسد بعد چه؟
  hi.a1.unit09.lesson03.teach.dialogue.line04:
    title: پریا ادامه می‌دهد
    gloss: 'پریا می‌گوید: بعد سر چهارراه بانک به چپ بپیچ.'
    note: «nukkad» (چهارراه، سر کوچه) در جمله معرفی می‌شود.
  hi.a1.unit09.lesson03.teach.dialogue.line05:
    title: ارجن تأیید می‌کند و دوباره می‌پرسد
    gloss: ارجن «چپ» را تکرار می‌کند، می‌گوید خوب است و می‌پرسد بعد چه؟
  hi.a1.unit09.lesson03.teach.dialogue.line06:
    title: پریا مسیر اول را تمام می‌کند
    gloss: 'پریا می‌گوید: فقط کمی دیگر برو -- پُستخانه آنجاست، نزدیک بانک.'
    note: «bas» (فقط/صرف) معرفی می‌شود و با واقعیتی که در واحد ۸ آمده، یعنی نزدیک بودن پُستخانه به بانک، هماهنگ است.
  hi.a1.unit09.lesson03.teach.dialogue.line07:
    title: ارجن می‌فهمد و دربارهٔ پارک می‌پرسد
    gloss: ارجن می‌گوید فهمیدم و می‌پرسد چطور به پارک برود.
    note: عبارت «samajh gaya» معرفی می‌شود.
  hi.a1.unit09.lesson03.teach.dialogue.line08:
    title: پریا مسیر دوم را می‌دهد
    gloss: 'پریا می‌گوید: پارک؟ اول مستقیم برو، بعد به راست بپیچ -- پارک پشت مکتب است.'
    note: با واقعیتی که در واحد ۸ آمده، یعنی اینکه پارک پشت مکتب است، هماهنگ است.
  hi.a1.unit09.lesson03.teach.dialogue.line09:
    title: ارجن از پریا تشکر می‌کند
    gloss: ارجن می‌گوید فهمیدم و از پریا خیلی تشکر می‌کند.
  hi.a1.unit09.lesson03.teach.dialogue.line10:
    title: پریا خداحافظی می‌کند
    gloss: پریا می‌گوید مشکلی نیست، باز همدیگر را می‌بینیم.
    note: همان جملهٔ پایانی گفت‌وگوی واحد ۸ است که بدون تغییر تکرار شده.
