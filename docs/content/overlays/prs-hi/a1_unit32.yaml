  hi.a1.unit32.lesson05.teach.arjun_aur_neha:
    title: ارجن، نیها و وکرم درباره حیوانات
    gloss: 'ارجن و نیها هر دو حیوانات را خیلی دوست دارند، اما هیچ‌کدام‌شان حیوان خانگی ندارند. ارجن سگ‌ها را دوست دارد و نیها گربه‌ها را. وکرم حیوان خانگی دارد: یک گربه. او اکثراً با گربه‌اش بازی می‌کند و هر روز به گربه غذا می‌دهد. تو حیوان خانگی داری؟'
    note: دوست داشتن یک حیوان را با واقعاً داشتنِ آن مقایسه می‌کند؛ نکته اصلی این درس همین است.
    glosses:
      पसंद: خیلی دوست دارند
      दोनों: هر دو
      जानवर: حیوانات
      किसी: هیچ‌کدام‌شان
      पालतू: حیوان خانگی
      कुत्ते: سگ‌ها
      बिल्लियाँ: پشک‌ها
      बिल्ली: پشک
      खेलता: بازی می‌کند
      देता: می‌دهد
      रोज़: هر
      खाना: غذا
