teaching:
  hi.a1.unit19.lesson01.teach.aaj_review:
    title: 'مرور: امروز'
    gloss: امروز
    note: اولین بار در درس ۳ آمده بود -- کلمهٔ زمانی که در همین درس همراه با *kal* (فردا) در درس سوم تکرار می‌شود.
    example_gloss: امروز سوم است.
  hi.a1.unit19.lesson01.teach.mausam:
    title: هوا
    gloss: هوا
    note: اسم تازه و کلمهٔ موضوعی همین درس. مذکر است -- به نکته‌های گرامری مربوط به جنسیت در همین درس نگاه کنید.
    example_gloss: امروز هوا چطور است؟
  hi.a1.unit19.lesson01.teach.kaisa_review:
    title: 'مرور: چطور / چگونه'
    gloss: چطور / چگونه
    note: اولین بار در درس ۱۲ آمده بود -- اینجا برای پرسیدن دربارهٔ هوا دوباره به کار می‌رود.
    example_gloss: خانهٔ شما چطور است؟
  hi.a1.unit19.lesson01.teach.hai_hain_review:
    title: 'مرور: است، استند'
    gloss: است (مفرد)، استند (جمع)
    note: جفت مفرد و جمع فعل ربطی که تمام الگوی وجودیِ هوا در این درس به آن تکیه دارد.
    example_gloss:
    - امروز هوا خوب است.
    - در خانه سه اتاق است.
  hi.a1.unit19.lesson01.teach.dhoop:
    title: آفتاب / روشنی آفتاب
    gloss: آفتاب / روشنی آفتاب
    note: 'اسم تازه. به شکل جملهٔ وجودی ساده می‌آید: *aaj dhoop hai* = «امروز آفتابی است» (لفظاً «امروز آفتاب هست»).'
    example_gloss: امروز هوا آفتابی است.
  hi.a1.unit19.lesson01.teach.baarish:
    title: باران
    gloss: باران
    note: 'اسم تازه. به شکل جملهٔ وجودی ساده می‌آید: *aaj baarish hai* = «امروز باران می‌بارد».'
    example_gloss: امروز باران می‌بارد.
  hi.a1.unit19.lesson01.teach.hawa:
    title: باد
    gloss: باد
    note: 'اسم تازه. به شکل جملهٔ وجودی ساده می‌آید: *aaj hawa hai* = «امروز باد است».'
    example_gloss: امروز باد است.
  hi.a1.unit19.lesson01.teach.grammar_mausam_existential:
    title: الگوی وجودی برای هوا
    gloss: برای گفتن از هوا، «aaj/kal + [کلمهٔ هوا] + hai» می‌گوییم -- مثلاً 'aaj dhoop hai'، 'aaj baarish hai'، 'aaj hawa hai'. این همان الگوی hai/hain است که در واحد ۱۸ برای خانه یاد گرفتید، اما اینجا بدون عدد و مستقیماً به عنوان مبتدا.
    note: اولین نکتهٔ گرامری این واحد که واژه‌های تازه را به الگوی جملهٔ آشنا وصل می‌کند.
  hi.a1.unit19.lesson02.teach.mausam_review:
    title: 'مرور: هوا'
    gloss: هوا
    note: از درس اول همین واحد دوباره آمده است.
    example_gloss: امروز هوا چطور است؟
  hi.a1.unit19.lesson02.teach.garam:
    title: گرم
    gloss: گرم
    note: صفت تازه. با جنسیت تغییر نمی‌کند -- به نکتهٔ گرامری همین درس نگاه کنید.
    example_gloss: امروز هوا گرم است.
  hi.a1.unit19.lesson02.teach.thanda_thandi:
    title: سرد (مذکر / مؤنث)
    gloss: سرد (مذکر)، سرد (مؤنث)
    note: صفت تازه. برخلاف *garm* با جنسیت تغییر می‌کند -- با *mausam* مذکر، *thanda* می‌آید و با اسم‌های مؤنث (مثل *rasoi* در واحد ۱۸) *thandi* -- به نکتهٔ گرامری همین درس نگاه کنید.
    example_gloss:
    - امروز هوا سرد است.
    - امروز آشپزخانه سرد است.
  hi.a1.unit19.lesson02.teach.grammar_garam_thanda:
    title: صفت‌های ثابت و صفت‌هایی که با جنسیت تغییر می‌کنند
    gloss: '''Garm'' صفتی است که به صامت ختم می‌شود و با جنسیت تغییر نمی‌کند -- در ''mausam garm hai'' همیشه ''garm'' می‌آید. اما ''thanda''/''thandi'' صفتی است که به ''-a'' ختم می‌شود و با جنسیت تغییر می‌کند، درست مثل ''bada''/''badi'' (واحد ۱۴) -- با ''mausam'' مذکر، ''thanda'' می‌آید و با اسم مؤنث، ''thandi''.'
    note: تفاوت اصلی گرامری این واحد که یک جفت صفت تازه را به قاعدهٔ واحد ۱۴ وصل می‌کند.
  hi.a1.unit19.lesson02.teach.baadal:
    title: ابر / ابرها
    gloss: ابر / ابرها
    note: 'اسم تازه که در این واحد فقط به شکل جمع وجودی می‌آید: *aaj baadal hain* = «امروز ابر است» / «امروز هوا ابری است».'
    example_gloss: امروز ابر است.
  hi.a1.unit19.lesson02.teach.accha_review:
    title: 'مرور: خوب'
    gloss: خوب
    note: اولین بار در واحد ۹ آمده بود -- اینجا برای توصیف هوا دوباره به کار می‌رود.
    example_gloss: امروز هوا خوب است.
  hi.a1.unit19.lesson02.teach.bura:
    title: بد
    gloss: بد
    note: صفت تازه، در برابر *accha* (خوب) که قبلاً یاد گرفتید. در این واحد فقط به شکل مذکر می‌آید، مطابق *mausam*.
    example_gloss: امروز هوا بد است.
  hi.a1.unit19.lesson02.teach.bahut_review:
    title: 'مرور: بسیار'
    gloss: بسیار
    note: اولین بار در واحد ۶ آمده بود -- اینجا برای تأکید در توصیف هوا دوباره به کار می‌رود.
    example_gloss: امروز هوا بسیار سرد است.
  hi.a1.unit19.lesson03.teach.kal_review:
    title: 'مرور: فردا (دیروز هم)'
    gloss: فردا (بسته به موقعیت «دیروز» هم معنا می‌دهد)
    note: اولین بار در واحد ۴ آمده بود و در واحد ۱۲ برای «دیروز» به کار رفت -- در هندیِ واقعی واقعاً دو معنا دارد و فقط از روی موقعیت فهمیده می‌شود. جمله‌های این واحد همه دربارهٔ آینده و برنامه‌ریزی اند، پس 'kal' اینجا «فردا» است.
    example_gloss: فردا باران می‌بارد.
  hi.a1.unit19.lesson03.teach.ghar_review:
    title: 'مرور: خانه'
    gloss: خانه
    note: در واحد ۸ یاد داده شد -- اینجا برای پلانِ نتیجه (ماندن در خانه) دوباره آمده است.
    example_gloss: این یک خانه است.
  hi.a1.unit19.lesson03.teach.mein_review:
    title: 'مرور: در'
    gloss: در / توی
    note: در واحد ۱ یاد داده شد -- اینجا در «ghar mein» (در خانه) دوباره آمده است.
    example_gloss: در خانه سه اتاق است.
  hi.a1.unit19.lesson03.teach.hum_review:
    title: 'مرور: ما'
    gloss: ما
    note: در واحد ۱۱ یاد داده شد -- اینجا به حیث فاعلِ پلان‌سازی این درس دوباره آمده است.
    example_gloss: ما فلم تماشا می‌کنیم.
  hi.a1.unit19.lesson03.teach.rehte_hain_review:
    title: 'مرور: ماندن / زندگی کردن (آن‌ها/ما)'
    gloss: ماندن / زندگی کردن (آن‌ها/ما)
    note: در واحد ۵ یاد داده شد (با یک پدرکلان مفرد، به‌خاطر مطابقت احترام با جمع مذکر) -- این واحد اولین بار آن را با فاعل واقعاً جمع، یعنی 'hum' (ما)، به کار می‌برد؛ همان شکل فعل، به شکل ساده‌تر.
    example_gloss: پدرکلانم در دهلی زندگی می‌کند.
  hi.a1.unit19.lesson03.teach.chalo_review:
    title: 'مرور: بیایین / بیا'
    gloss: بیایین / بیا
    note: در واحد ۱ یاد داده شد و در واحدهای ۶، ۷ و ۱۱ با فعل عادتیِ جمع به معنای «بیایین ___» به کار رفت -- اینجا هم به همان شکل دوباره آمده است.
    example_gloss: بیایین چیزی بخوریم!
  hi.a1.unit19.lesson03.teach.jaana_review:
    title: 'مرور: رفتن'
    gloss: رفتن
    note: در واحد ۱۵ به شکل مصدرِ ساده یاد داده شد -- این درس آن را به شکل عادتیِ جمع 'jaate hain' (ما می‌رویم) گسترش می‌دهد؛ همان ساختی که واحد ۱۱ برای 'dekhte hain'/'peete hain' به کار برد.
    example_gloss: من باید به ایستگاه بروم.
  hi.a1.unit19.lesson03.teach.aur_review:
    title: 'مرور: و'
    gloss: و
    note: در واحد ۱ یاد داده شد -- اینجا برای وصل کردن هوا و سردیِ فردا دوباره آمده است.
    example_gloss: فردا باران می‌بارد و هوا سرد است.
  hi.a1.unit19.lesson03.teach.bahar:
    title: بیرون
    gloss: بیرون
    note: واژهٔ تازه، از واژه‌های پلانِ نتیجهٔ همین درس.
    example_gloss: بیایین بیرون برویم!
  hi.a1.unit19.lesson03.teach.jaate_hain_phrase:
    title: بیایین بیرون برویم!
    gloss: بیایین بیرون برویم!
    note: '''Chalo'' + شکل عادتیِ جمع ''jaate hain'' (از ''jaana''، رفتن) -- همان ساخت «بیایین ___» که در واحدهای ۱، ۶، ۷ و ۱۱ آمده بود.'
  hi.a1.unit19.lesson03.teach.dialogue.line01:
    title: ارجن از پریا دربارهٔ هوای امروز می‌پرسد
    gloss: پریا، امروز هوا چطور است؟
  hi.a1.unit19.lesson03.teach.dialogue.line02:
    title: پریا هوای امروز را توضیح می‌دهد
    gloss: امروز آفتاب است و هوا گرم است.
  hi.a1.unit19.lesson03.teach.dialogue.line03:
    title: ارجن پیشنهاد می‌کند بیرون بروند
    gloss: عالی! بیایین بیرون برویم.
  hi.a1.unit19.lesson03.teach.dialogue.line04:
    title: پریا از هوای فردا می‌پرسد
    gloss: خوب است! و هوای فردا چطور است؟
  hi.a1.unit19.lesson03.teach.dialogue.line05:
    title: ارجن هوای فردا را توضیح می‌دهد
    gloss: فردا باران می‌بارد و هوا سرد است.
  hi.a1.unit19.lesson03.teach.dialogue.line06:
    title: پریا پیشنهاد می‌کند در خانه بمانند
    gloss: پس فردا در خانه می‌مانیم؟
  hi.a1.unit19.lesson03.teach.dialogue.line07:
    title: ارجن موافقت می‌کند
    gloss: بلی، فردا در خانه می‌مانیم.
  hi.a1.unit19.lesson03.teach.dialogue.line08:
    title: پریا موافقت می‌کند
    gloss: خوب است!
  hi.a1.unit19.lesson03.teach.grammar_summary:
    title: سه قاعدهٔ اصلی
    gloss: 'سه قاعدهٔ اصلی این واحد: (۱) ''aaj/kal + [«weather word»] + hai/hain'' هوا را توضیح می‌دهد؛ (۲) ''garm'' با جنسیت تغییر نمی‌کند، اما ''thanda''/''thandi'' تغییر می‌کند، درست مثل ''bada''/''badi''؛ (۳) ''chalo'' + فعل عادتیِ جمع (مثل ''jaate hain'') پیشنهاد می‌سازد -- ''chalo, bahar jaate hain!''.'
    note: خلاصهٔ پایانی که دستور تمام این واحد را کنار هم می‌آورد، مثل یادداشت‌های دستوری واحدهای ۱۵ تا ۱۸.
  hi.a1.unit19.lesson03.teach.weather_reading:
    title: خواندن دربارهٔ امروز و فردا
    gloss: امروز هوا گرم و آفتابی است. بیایین بیرون برویم! فردا باران می‌بارد و هوا سرد است. فردا در خانه می‌مانیم.
    note: یک متن کوتاه و ساده (بدون چارچوب داستانیِ تازه) که همان واقعیت‌های گفت‌وگو را بدون هیچ ادعای تازه دوباره می‌آورد -- مستقیماً برای هدف «خواندن یک پیش‌بینی کوتاه هوا» است.
    glosses:
      आज: امروز
      मौसम: هوا
      गर्म: گرم
      धूप: آفتاب
      चलो: بیایین
      बाहर: بیرون
      जाते: رفتن (از जाना)
      कल: فردا
      बारिश: باران
      ठंडा: سرد
      रहते: ماندن / زندگی کردن (از रहना)
