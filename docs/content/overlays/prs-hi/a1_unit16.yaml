    note: در واحد ۸ آموخته شد -- اینجا دوباره می‌آید و در یادداشت دستور همین درس معنای سومی هم پیدا می‌کند.
    example_gloss: بانک نزدیک مکتب است.
  hi.a1.unit16.lesson02.teach.doctor:
