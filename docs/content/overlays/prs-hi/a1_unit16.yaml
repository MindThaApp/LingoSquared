  hi.a1.unit16.lesson02.teach.mujhe_doctor_ke_paas_jana_hai_phrase:
    title: باید نزد داکتر بروم.
    gloss: باید پیش داکتر بروم.
    note: '*ke paas* را با ساختار الزام *mujhe...jana hai* از واحد ۱۵ ترکیب می‌کند.'
  hi.a1.unit16.lesson02.teach.grammar_ke_paas_third_sense:
    title: 'Ke paas: معنای سوم'
    gloss: 'دو معنای اول ''Ke paas'' قبلاً آموخته شده بود -- نزدیکی (واحد ۸: ''bank school ke paas hai'') و مالکیت (واحد ۲: ''mere paas ek kitab hai''). حالا کاربرد سوم: رفتن نزد یک شخص، یعنی رفتن به دیدن او -- ''doctor ke paas jana hai'' یعنی «باید نزد داکتر بروم». همین ساختار ''mujhe...jana hai'' هم از واحد ۱۵ دوباره آمده است.'
    note: هر دو معنای قبلی را با شمارهٔ واحد نام می‌برد، بعد معنای سوم را معرفی می‌کند و دوباره یادآوری می‌کند که ساختار الزام تکرار شده است.
