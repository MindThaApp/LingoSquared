    note: دو توصیهٔ این درس را در یک دستور طبیعی یکجا می‌کند و کارت خواندنِ درس سوم را پیش‌نمایش می‌دهد.
  hi.a1.unit16.lesson03.teach.dialogue.line01:
    title: پریا می‌پرسد ارجن خوب است یا نه
    gloss: ارجن، تو خوبی؟
  hi.a1.unit16.lesson03.teach.dialogue.line02:
