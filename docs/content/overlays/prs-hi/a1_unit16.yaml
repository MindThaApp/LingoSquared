  hi.a1.unit16.lesson02.teach.karo_grammar:
    title: 'Karo: استفادهٔ دوبارهٔ قاعدهٔ امر با -o'
    gloss: '''Karo'' از همان قاعدهٔ امرِ «تو» ساخته می‌شود که قبلاً آموخته شد (''jao''، ''muro''، ''batao''، ''gino'' -- همه به ''-o'' ختم می‌شوند). اینجا از ''karna'' (همان ''maaf karna'' واحد ۱۱) ساخته می‌شود: ریشهٔ ''kar'' به‌اضافهٔ ''-o'' می‌شود ''karo'' یعنی «بکن!». ''Aaraam karo'' یعنی «استراحت کن!»'
    note: گسترش مستقیم و روشنِ قاعدهٔ امر که قبلاً آموخته شده، روی فعلی که متعلم آن را به شکل مصدر می‌شناسد.
  hi.a1.unit16.lesson02.teach.aaraam_karo_phrase:
    title: استراحت کن!
    gloss: استراحت کن!
    note: امر نو روی اولین توصیهٔ این واحد.
  hi.a1.unit16.lesson02.teach.aaraam_karo_aur_doctor_ke_paas_jaao_phrase:
    title: استراحت کن و نزد داکتر برو.
