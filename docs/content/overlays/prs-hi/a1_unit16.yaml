    gloss: استراحت کن!
  hi.a1.unit16.lesson03.teach.dialogue.line08:
    title: ارجن موافقه می‌کند
    gloss: باشه.
  hi.a1.unit16.lesson03.teach.grammar_summary:
    title: سه قاعدهٔ اصلی
    gloss: 'سه قاعدهٔ اصلی این یونیت: (1) ''mujhe/tumhein + نشانهٔ مریضی + hai'' مشکل صحی را بیان می‌کند (مثلاً ''mujhe bukhar hai'')؛ (2) ''tumhein/mujhe + چیز + chahiye'' ضرورت را بیان می‌کند (مثلاً ''tumhein aaraam chahiye'')؛ (3) ''X ke paas jana hai'' می‌گوید باید نزد چه کسی رفت (مثلاً ''doctor ke paas jana hai'').'
    note: یک خلاصهٔ پایانی که گرامر تمام یونیت را کنار هم می‌آورد.
  hi.a1.unit16.lesson03.teach.advice_reading:
    title: خواندن چند نصیحت
    gloss: استراحت کن. نزد داکتر برو.
    note: یک دستور کوتاه و مستقیم، مثل نصیحت‌های واقعی در گفتار، که همان چیزهایی را که در گفتگو آمده تکرار می‌کند، بدون هیچ اطلاعات تازه.
    glosses:
      आराम: استراحت کن
      करो: کن (امر، از करना)
      डॉक्टर: داکتر
      जाओ: برو (امر، از जाना)
