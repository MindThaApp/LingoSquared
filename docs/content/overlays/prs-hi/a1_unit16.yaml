  hi.a1.unit16.lesson01.teach.grammar_symptom_hai:
    title: Mujhe + نشانه + hai
    gloss: '''Mujhe + «noun» + hai'' در واحد ۱۱ آموخته شده بود (''mujhe kaam hai'' = کار دارم). حالا برای نشانه‌های مریضی هم استفاده می‌شود: ''mujhe sir dard hai'' یعنی «سردرد دارم» -- ''sir dard'' (sir = سر، dard = درد) با هم «سردرد» را می‌سازند. این دستور تازه نیست، همان الگوی قبلی است.'
    note: دومین کاربرد الگویی را که قبلاً آموخته شده (برای من + اسم + است) نشان می‌دهد و پیش از کاربرد برای نشانه‌های مریضی، واحد قبلی را نام می‌برد.
    target_text: '''मुझे + संज्ञा + है'' पहले यूनिट 11 में सीखा था (''मुझे काम है'' = I have work)। अब यह लक्षण बताने के लिए भी इस्तेमाल होता है: ''मुझे सिर दर्द है'' का मतलब है ''I have a headache'' -- ''सिर दर्द'' (सिर = head, दर्द = pain) एक साथ मिलकर ''headache'' बनाते हैं। यह कोई नया व्याकरण नहीं है, वही पुराना पैटर्न है।'
