teaching:
  hi.a1.unit05.lesson01.teach.parivar:
    title: خانواده
    gloss: خانواده
    note: کلمه عمومی برای خانواده که در سراسر این واحد به کار می‌رود.
    example_gloss: خانواده‌ام در هند است.
  hi.a1.unit05.lesson01.teach.pita_maa:
    title: پدر، مادر
    gloss: پدر، مادر
    note: هر دو هنگام معرفی، به جای *hai* شکل جمع احترام *hain* را می‌گیرند، و *pita* با *mere* می‌آید نه *mera* -- به یادداشت احترام در ادامه همین درس نگاه کنید.
    example_gloss:
    - این پدرم است.
    - این مادرم است.
  hi.a1.unit05.lesson01.teach.bhai_behan:
    title: برادر، خواهر
    gloss: برادر، خواهر
    note: 'جوره اصلی این واحد برای مقایسه مطابقت mera/meri: *mera bhai*، *meri behan*.'
    example_gloss:
    - من یک برادر دارم.
    - من یک خواهر دارم.
  hi.a1.unit05.lesson01.teach.ek_as_article:
    title: Ek به معنی «یک» نکره
    gloss: '*Ek* در شمارش «یک» است و برای «یک» نکره هم به کار می‌رود: *mera ek bhai hai*.'
    note: همان کلمه‌ای که پیش‌تر به حیث عدد ۱ آموخته شد -- هندی حرف نکره جداگانه ندارد.
  hi.a1.unit05.lesson01.teach.mata_pita:
    title: پدر و مادر
    gloss: پدر و مادر
    note: ترکیبی از *mata* (مادر، رسمی) و *pita* (پدر) -- کلمه معیار برای «پدر و مادر».
    example_gloss: پدر و مادرم در دهلی زندگی می‌کنند.
  hi.a1.unit05.lesson01.teach.mera_meri_note:
    title: Mera و meri
    gloss: '*Mera* با کلمات مذکر و *meri* با کلمات مؤنث می‌آید: *mera bhai*، *meri behan*.'
    note: نکته اصلی دستوری این واحد -- ضمیر ملکی با شخص یا چیزِ مملوک مطابقت می‌کند، نه با گوینده.
  hi.a1.unit05.lesson01.teach.mere_honorific_note:
    title: Mere برای بزرگان محترم
    gloss: 'از روی احترام به بزرگان، *mera* به *mere* و *hai* به *hain* تبدیل می‌شود، حتی برای یک نفر: *yeh mere pita hain* (این پدرم است).'
    note: یک رسم واقعی و درست است، نه اشتباه -- بزرگان محترم مفرد خانواده (پدر، پدرکلان) این شکل شبیه جمع را می‌گیرند. مادر و مادرکلان *meri* را نگه می‌دارند، اما فعل به همین دلیل باز هم جمع (*hain*) می‌شود.
  hi.a1.unit05.lesson01.teach.yah_mera_bhai_hai:
    title: این برادر من است
    gloss: این برادرم است.
    note: شکل ساده مذکر -- برای برادر به احترام خاصی ضرورت نیست.
  hi.a1.unit05.lesson01.teach.yah_meri_behan_hai:
    title: این خواهرم است
    gloss: این خواهرم است.
    note: شکل ساده مؤنث که با *behan* مطابقت می‌کند.
  hi.a1.unit05.lesson01.teach.yah_kaun_hai:
    title: این کی استه؟
    gloss: این کیست؟
    note: یک سوال ساده و کاربردی برای معرفی اعضای خانواده.
  hi.a1.unit05.lesson02.teach.dada_dadi:
    title: کاکا کلان، ننه کلان (از طرف پدر)
    gloss: بابه کلان (پدرکلان)، ننه کلان (مادرکلان) از طرف پدر
    note: مخصوصاً پدر و مادرِ پدرت — یادداشت بعدی همین درس را ببین که این‌ها را با پدر و مادرِ مادرت مقایسه می‌کند.
    example_gloss:
    - پدرکلانم در دهلی زندگی می‌کند.
    - مادرکلانم در دهلی زندگی می‌کند.
  hi.a1.unit05.lesson02.teach.nana_nani:
    title: پدرکلان و مادرکلان از طرف مادر
    gloss: پدرکلان و مادرکلان از طرف مادر
    note: پدر و مادرِ مادرت — هندی برای این‌ها یک جفت کلمهٔ کاملاً جداگانه دارد، غیر از کلمه‌های پدر و مادرِ پدرت.
    example_gloss:
    - پدرکلانم (از طرف مادر) در ممبی زندگی می‌کند.
    - مادرکلانم (از طرف مادر) در ممبی زندگی می‌کند.
  hi.a1.unit05.lesson02.teach.dilli_mumbai:
    title: دهلی، ممبی
    gloss: دهلی، ممبی
    note: دو شهر بزرگ هند که در مثال‌های این درس برای جای زندگی اعضای خانواده آمده‌اند.
    example_gloss:
    - خانوادهٔ من در دهلی زندگی می‌کند.
    - برادرم در ممبی زندگی می‌کند.
  hi.a1.unit05.lesson02.teach.dada_nana_note:
    title: دو جفت پدرکلان و مادرکلان
    gloss: 'پدر و مادرِ پدر: *dada-dadi*. پدر و مادرِ مادر: *nana-nani*.'
    note: در دری برای هر دو طرف خانواده معمولاً همان «پدرکلان و مادرکلان» گفته می‌شود، ولی در هندی بسته به طرف خانواده، کلمه‌های کاملاً جدا وجود دارد.
  hi.a1.unit05.lesson02.teach.rehna_verb:
    title: زندگی می‌کند (rehna)
    gloss: زندگی می‌کند (مذکر / مؤنث / جمع یا احترام)
    note: فعل «زندگی کردن / ساکن بودن» — *rehta hai* برای مرد، *rehti hai* برای زن، *rehte hain* برای بیشتر از یک نفر یا برای بزرگ‌سالِ محترم.
    example_gloss:
    - برادرم در دهلی زندگی می‌کند.
    - خواهرم در ممبی زندگی می‌کند.
    - پدرکلان و مادرکلانم در دهلی زندگی می‌کنند.
  hi.a1.unit05.lesson02.teach.tumhara_tumhari:
    title: از تو (غیررسمی)
    gloss: از تو (غیررسمی، مذکر / مؤنث)
    note: ضمیر ملکیِ غیررسمیِ *tum*، که درست مثل *mera/meri* با اسمِ مالکیت‌شده هماهنگ می‌شود.
    example_gloss:
    - برادرت کجا زندگی می‌کند؟
    - خواهرت کجا زندگی می‌کند؟
  hi.a1.unit05.lesson02.teach.mera_tumhara_note:
    title: Mera و tumhara با هم
    gloss: '*Mera* و *tumhara* هر دو با کلمه‌های مذکر می‌آیند؛ *meri* و *tumhari* هر دو با کلمه‌های مؤنث: *mera bhai*/*tumhara bhai*، *meri behan*/*tumhari behan*.'
    note: همان الگوی هماهنگی از درس اول، که حالا برای *tumhara* هم نشان داده می‌شود.
  hi.a1.unit05.lesson03.teach.bada_badi:
    title: بزرگ‌تر / کلان
    gloss: بزرگ‌تر، کلان (مذکر / مؤنث)
    note: در دری برای برادر یا خواهر بزرگ‌تر کلمهٔ «کاکا/برادر کلان» با صفت می‌گوییم؛ در هندی هم برای خواهر یا برادر بزرگ‌تر از همین صفت استفاده می‌شود که با اسم هماهنگ می‌شود.
    example_gloss:
    - برادر کلانم در دهلی زندگی می‌کند.
    - خواهر کلانم در ممبی زندگی می‌کند.
  hi.a1.unit05.lesson03.teach.chota_choti:
    title: کوچک‌تر / خورد
    gloss: کوچک‌تر، خورد (مذکر / مؤنث)
    note: مقابلِ *bada/badi*، برای برادر یا خواهر کوچک‌تر.
    example_gloss:
    - برادر خوردم حالا شاگرد است.
    - خواهر خوردم حالا شاگرد است.
  hi.a1.unit05.lesson03.teach.bada_chota_note:
    title: هماهنگی bada/chota
    gloss: '*Bada* و *chota* با کلمه‌های مذکر می‌آیند، *badi* و *choti* با کلمه‌های مؤنث: *bada bhai*، *badi behan*.'
    note: همان هماهنگی مذکر/مؤنثِ صفت که با *mera/meri* دیدیم، حالا برای کلمه‌های سن و بزرگی.
  hi.a1.unit05.lesson03.teach.aur_lekin_bhi:
    title: و، اما، هم
    gloss: و، اما، هم
    note: سه کلمهٔ ربط ساده که در گفتگوی پایانی این درس دوباره می‌آیند.
    example_gloss:
    - برادر و خواهرم در دهلی زندگی می‌کنند.
    - برادرم در دهلی زندگی می‌کند، اما خواهرم در ممبی زندگی می‌کند.
    - من هم یک خواهر دارم.
  hi.a1.unit05.lesson03.teach.accha_phir_milenge:
    title: خوب، باز می‌بینیم
    gloss: خوب! باز می‌بینیم.
    note: یک خداحافظی دوستانه که از کلمه‌های خداحافظی درس دوم دوباره آمده است.
  hi.a1.unit05.lesson03.teach.theek_hai_phir_milte_hain:
    title: باشه، زود می‌بینیم
    gloss: باشه، زود می‌بینیم!
    note: جوابِ غیررسمی به خداحافظی بالا، مطابق با گفتگوهای پایانیِ درس‌های پیشین.
  hi.a1.unit05.lesson03.teach.dialogue.line01:
    title: ارجن از خانوادهٔ پریا می‌پرسد
    gloss: ارجن می‌پرسد خانوادهٔ پریا کجا زندگی می‌کند.
    note: الگوی *parivar kahan rehta hai* همین درس دوباره می‌آید.
  hi.a1.unit05.lesson03.teach.dialogue.line02:
    title: پریا دربارهٔ پدر و مادر و برادرش می‌گوید
    gloss: پریا می‌گوید پدر و مادرش در دهلی زندگی می‌کنند و یک برادر کلان هم دارد.
    note: '*mata-pita*، *rehte hain* و *bada bhai bhi hai* را یکجا دارد.'
  hi.a1.unit05.lesson03.teach.dialogue.line03:
    title: ارجن دربارهٔ پدرکلان و مادرکلانش می‌پرسد
    gloss: 'ارجن می‌گوید «خوب!» و می‌پرسد: پدرکلان و مادرکلانت چی؟'
    note: '*Tumhare* شکل محترمانهٔ *tumhara* برای بزرگ‌ترهاست، درست مثل *mere* برای *mera* (یادداشت احترام در درس اول).'
  hi.a1.unit05.lesson03.teach.dialogue.line04:
    title: پریا دربارهٔ هر دو جفت پدرکلان و مادرکلانش می‌گوید
    gloss: پریا می‌گوید پدرکلان و مادرکلانِ طرف پدرش در دهلی زندگی می‌کنند، اما پدرکلان و مادرکلانِ طرف مادرش در ممبی.
    note: '*lekin* را برای مقایسهٔ شهرِ دو جفت پدرکلان و مادرکلان به کار می‌برد و فرق dada-dadi و nana-nani از درس دوم را تقویت می‌کند.'
  hi.a1.unit05.lesson03.teach.dialogue.line05:
    title: ارجن از خواهر خودش می‌گوید
    gloss: ارجن می‌گوید او هم یک خواهر خورد دارد.
    note: '*bhi* و *choti behan* دوباره می‌آیند.'
  hi.a1.unit05.lesson03.teach.dialogue.line06:
    title: پریا گفتگو را تمام می‌کند
    gloss: پریا می‌گوید خوب، باز می‌بینیم.
    note: عبارت پایانیِ همین درس دوباره می‌آید.
  hi.a1.unit05.lesson03.teach.dialogue.line07:
    title: ارجن جواب می‌دهد
    gloss: ارجن موافقت می‌کند و می‌گوید زود می‌بینیم.
    note: عبارت جوابِ همین درس دوباره می‌آید.
