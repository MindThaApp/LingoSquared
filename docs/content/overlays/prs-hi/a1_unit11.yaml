teaching:
  hi.a1.unit11.lesson01.teach.review_chai_kaafi:
    title: 'مرور: چای، قهوه'
    gloss: چای، قهوه
    note: مرور سریع کلمه‌های نوشیدنی از درس ۶ -- در این درس دوباره از آن‌ها برای پیشنهاد برنامه استفاده می‌کنیم.
    example_gloss:
    - من چای می‌خواهم.
    - من قهوه می‌خواهم.
  hi.a1.unit11.lesson01.teach.filma:
    title: فلم
    gloss: فلم
    note: یک اسم تازه برای موضوع برنامه‌ریزی این درس.
    example_gloss: این فلم خوب است.
  hi.a1.unit11.lesson01.teach.dekhna:
    title: (ما) تماشا می‌کنیم / تماشا کنیم
    gloss: (ما) تماشا می‌کنیم / تماشا کنیم
    note: شکل جمع عادتی فعل 'dekhna' (تماشا کردن) که اینجا برای پیشنهاد یک کار دسته‌جمعی به کار رفته است.
    example_gloss: ما فلم تماشا می‌کنیم.
  hi.a1.unit11.lesson01.teach.chalo_film_phrase:
    title: بیایین فلم تماشا کنیم!
    gloss: بیایین فلم تماشا کنیم!
    note: '''Chalo'' + فعل جمع عادتی، راه همیشگی پیشنهاد یک کار دسته‌جمعی است -- این الگو قبلاً در درس‌های ۱، ۶ و ۷ هم به‌طور ضمنی آمده بود (''chalo shuru karte hain''، ''chalo, kuch khaate hain''، ''chalo, kuch khareedte hain''); این درس آن را رسمی و گسترده‌تر می‌کند.'
  hi.a1.unit11.lesson01.teach.saath:
    title: با هم
    gloss: با هم
    note: برای پیشنهاد انجام یک کار با هم به کار می‌رود.
    example_gloss: بیایین با هم فلم تماشا کنیم!
  hi.a1.unit11.lesson01.teach.peena:
    title: (ما) می‌نوشیم / بنوشیم
    gloss: (ما) می‌نوشیم / بنوشیم
    note: شکل جمع عادتی فعل 'peena' (نوشیدن)، با همان الگوی 'dekhte hain'.
    example_gloss: ما چای می‌نوشیم.
  hi.a1.unit11.lesson01.teach.chalo_chai_phrase:
    title: بیایین با هم چای بنوشیم!
    gloss: بیایین با هم چای بنوشیم!
    note: '''saath'' و ''peete hain'' این درس را در یک پیشنهاد دوم یکجا می‌کند، با همان الگوی ''chalo'' که در پیشنهاد فلم بود.'
  hi.a1.unit11.lesson01.teach.chalo_grammar_note:
    title: Chalo + verb-te + hain = بیایین ___
    gloss: 'برای پیشنهاد انجام کاری با هم، ''chalo'' + verb-te + hain می‌گویی: بیایین فلم تماشا کنیم! بیایین با هم چای بنوشیم!'
    note: تمام الگو را به‌طور صریح بیان می‌کند؛ الگویی که قبلاً سه بار در درس‌های پیشین به‌طور ضمنی آمده بود.
  hi.a1.unit11.lesson01.teach.achha_vichar:
    title: فکر خوبی است!
    gloss: فکر خوب است!
    note: یک راه آمادهٔ پذیرفتن پیشنهاد با شوق.
  hi.a1.unit11.lesson02.teach.vyast:
    title: مصروف
    gloss: مصروف
    note: یک صفت تازه که با فعل ربطی که قبلاً یاد گرفته‌اید (hoon/ho/hai) می‌آید تا بگوید کسی وقت ندارد.
    example_gloss: من امروز مصروف هستم.
  hi.a1.unit11.lesson02.teach.maaf_karna:
    title: معذرت می‌خواهم / معذرت
    gloss: معذرت می‌خواهم / معذرت
    note: یک عبارت مؤدبانهٔ ثابت که برای نرم‌تر کردن رد کردن به کار می‌رود.
    example_gloss: معذرت می‌خواهم، من مصروف هستم.
  hi.a1.unit11.lesson02.teach.maaf_vyast_phrase:
    title: معذرت می‌خواهم، من مصروف هستم.
    gloss: معذرت می‌خواهم، من مصروف هستم.
    note: جملهٔ ساده برای رد کردن پیشنهاد که دو عبارت تازهٔ این درس را یکجا می‌کند.
  hi.a1.unit11.lesson02.teach.mujhe_kaam_hai:
    title: من کار دارم.
    gloss: من کار دارم.
    note: الگوی 'mujhe...hai' (من ... دارم) را که قبلاً در 'mujhe...chahiye' (می‌خواهم/لازم دارم) آمده بود دوباره به کار می‌برد، اینجا برای آوردن دلیل رد کردن.
  hi.a1.unit11.lesson02.teach.decline_grammar_note:
    title: چگونه مؤدبانه رد کنیم
    gloss: برای رد کردن مؤدبانهٔ یک برنامه، 'maaf karna' (معذرت می‌خواهم) بگو و بعد وضعیتت (مثلاً «من مصروف هستم») یا دلیلت (مثلاً «من کار دارم») را بگو.
    note: عمداً از دستوری که قبلاً یاد گرفته‌اید (فعل ربطی و الگوی داشتن با حالت مفعولی) استفاده می‌کند و ساخت تازه‌ای برای «توانستن» نمی‌آورد.
  hi.a1.unit11.lesson02.teach.hum_pronoun:
    title: ما
    gloss: ما
    note: 'اولین ضمیر رسمی اول شخص جمع در این کورس. شکل فعل عادتی آن (-te + hain) همان است که برای ve (آن‌ها) یاد گرفته‌اید -- صرف تازه‌ای نیست، فقط ضمیر تازه است. (Tum هم -te می‌گیرد، ولی با ''ho'': tum milte ho.)'
    example_gloss: ما هر روز همدیگر را می‌بینیم.
  hi.a1.unit11.lesson02.teach.kab_milte_phrase:
    title: کی همدیگر را می‌بینیم؟
    gloss: کی همدیگر را می‌بینیم؟
    note: '''Hum'' را با ''kab'' (درس ۱۰) و ''milte hain'' (که از خداحافظی‌های درس ۱ آمده و فاعل آن معمولاً حذف می‌شد) یکجا می‌کند.'
  hi.a1.unit11.lesson02.teach.din_review:
    title: 'مرور: شنبه، یکشنبه'
    gloss: شنبه، یکشنبه
    note: مرور سریع دو نام روز هفته از درس ۳ که برای تعیین وقت یک برنامه ضرور است.
    example_gloss:
    - امروز شنبه است.
    - فردا یکشنبه است.
  hi.a1.unit11.lesson02.teach.samay_review:
    title: 'مرور: ساعت چهار، ساعت چند'
    gloss: ساعت چهار، ساعت چند
    note: مرور سریع کلمه‌های وقت از درس ۴ که برای تعیین وقت یک برنامه ضرور است.
    example_gloss:
    - حالا ساعت چهار است.
    - حالا ساعت چند است؟
  hi.a1.unit11.lesson02.teach.kya_ravivar_thik_phrase:
    title: یکشنبه خوب است؟
    gloss: یکشنبه خوب است؟
    note: '''kya'' را دوباره منحیث کلمهٔ سوال بلی/نخیر به کار می‌بریم، که از درس ۱ یاد گرفته‌ایم (''kya yeh tumhari pahli baar hai?''، ''«kya tum yoga karti ho»?'')؛ این یک کلمهٔ سوال تازه برای «کدام روز» نیست.'
  hi.a1.unit11.lesson03.teach.sandesh:
    title: پیام
    gloss: پیام
    note: یک اسم تازه که در بخش دعوت‌نامهٔ نوشتنی این درس به کار می‌رود.
    example_gloss: این پیام ارجن است.
  hi.a1.unit11.lesson03.teach.dialogue.line01:
    title: ارجن روز شنبه فلم دیدن را پیشنهاد می‌کند
    gloss: پریا، بیا شنبه فلم ببینیم؟
  hi.a1.unit11.lesson03.teach.dialogue.line02:
    title: پریا با دلیل رد می‌کند
    gloss: ببخش، من شنبه مصروف استم. کار دارم.
  hi.a1.unit11.lesson03.teach.dialogue.line03:
    title: ارجن می‌پرسد کی می‌توانند همدیگر را ببینند
    gloss: خوب است. ما کی همدیگر را می‌بینیم؟
  hi.a1.unit11.lesson03.teach.dialogue.line04:
    title: پریا به جای آن یکشنبه را پیشنهاد می‌کند
    gloss: یکشنبه خوب است؟ بیا باهم چای بنوشیم!
  hi.a1.unit11.lesson03.teach.dialogue.line05:
    title: ارجن قبول می‌کند و وقت را می‌پرسد
    gloss: فکر خوب است! یکشنبه ساعت چند؟
  hi.a1.unit11.lesson03.teach.dialogue.line06:
    title: پریا یک وقت پیشنهاد می‌کند
    gloss: ساعت چهار خوب است؟
  hi.a1.unit11.lesson03.teach.dialogue.line07:
    title: ارجن تایید می‌کند
    gloss: بلی، ساعت چهار خوب است. پس می‌بینیمت!
  hi.a1.unit11.lesson03.teach.dialogue.line08:
    title: پریا صحبت را ختم می‌کند
    gloss: خوب است، یکشنبه همدیگر را می‌بینیم!
  hi.a1.unit11.lesson03.teach.invitation_message:
    title: پیام پریا
    gloss: سلام ارجن، بیا یکشنبه ساعت چهار همدیگر را ببینیم و چای بنوشیم. خوب است؟ - پریا
    note: یک دعوت‌نامهٔ کوتاه نوشتنی که برنامه‌ای را که در گفتگو تایید شد دوباره می‌گوید.
    glosses:
      चलो: بیا (برویم/بکنیم)
      रविवार: یکشنبه
      मिलते: همدیگر را دیدن (از مِلنا)
      चाय: چای
      पीते: نوشیدن (از پینا)
      ठीक: خوب / درست
