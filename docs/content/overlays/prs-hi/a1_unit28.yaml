teaching:
  hi.a1.unit28.lesson01.teach.fon_karna:
    title: زنگ زدن
    gloss: زنگ زدن
    note: مصدر فعلی که برای تماس تلفونی به کار می‌رود.
    example_gloss: باید به تو زنگ بزنم.
  hi.a1.unit28.lesson01.teach.main_tumhen_fon:
    title: گفتن اینکه زنگ می‌زنید
    gloss: به تو زنگ می‌زنم.
    note: '*करूँगा* آیندهٔ *करना* است و در هندی برای وعده مثل «من... می‌کنم/خواهم کرد» به کار می‌رود. کسی که به او زنگ می‌زنید *तुम्हें* (یعنی «به تو») می‌گیرد.'
  hi.a1.unit28.lesson01.teach.hailo_main_priya:
    title: جواب دادن به تلفون
    gloss: هلو، من پریا استم.
    note: در تیلفون می‌گویید *मैं ... बोल रही हूँ* (یعنی «من صحبت می‌کنم»)؛ *रही* مؤنث است چون پریا یک زن است.
  hi.a1.unit28.lesson01.teach.hailo_main_arjun:
    title: ارجن هم همین‌طور جواب می‌دهد
    gloss: هلو، من ارجن استم.
    note: 'همین الگو با *रहा* مذکر: *मैं अर्जुन बोल रहा हूँ*، چون ارجن مرد است.'
  hi.a1.unit28.lesson02.teach.main_kisse_bat:
    title: پرسیدن اینکه کی زنگ زده
    gloss: با کی صحبت می‌کنم؟
    note: '*किससे* (یعنی «با کی») از *कौन* (یعنی «کی») و *से* ساخته شده، و *से* کسی را نشان می‌دهد که با او صحبت می‌کنین.'
  hi.a1.unit28.lesson02.teach.ap_priya_se:
    title: معرفی رسمی خود
    gloss: شما با پریا صحبت می‌کنین.
    note: '*आप* «شما»ی محترمانه برای شخص ناآشنا است. در *प्रिया से बात कर रहे हैं* *से* بعد از نام می‌آید و *हैं* با *आप* می‌آید.'
  hi.a1.unit28.lesson03.teach.kya_tum_yah:
    title: خواستن تکرار
    gloss: این را تکرار کرده می‌توانی؟
    note: '*सकते हो* یعنی «می‌توانی» و بعد از فعل اصلی می‌آید: *कह सकते हो*. *क्या* در اول جمله آن را سوال می‌سازد.'
  hi.a1.unit28.lesson03.teach.itna_tez_mat:
    title: خواستن اینکه آهسته‌تر صحبت کند
    gloss: لطفاً این‌قدر تیز صحبت نکن.
    note: '*मत बोलो* با *तुम* یعنی «صحبت نکن» به شکل دوستانه، و *इतना तेज़* یعنی «این‌قدر تیز».'
  hi.a1.unit28.lesson03.teach.mujhe_tumharee_avaz:
    title: گفتن اینکه خوب نمی‌شنوید
    gloss: صدایت را خوب نمی‌شنوم.
    note: 'هندی می‌گوید «آوازت نمی‌آید»: *मुझे तुम्हारी आवाज़ नहीं आ रही है*. گوینده *मुझे* می‌گیرد و آواز فاعل است.'
  hi.a1.unit28.lesson04.teach.maisej:
    title: پیام کوتاه
    gloss: پیام کوتاه
    note: '*मैसेज* یک کلمهٔ قرضی رایج و مذکر است: *एक मैसेज*، *यह मैसेज ... का है*.'
    example_gloss: پیام کوتاه از طرف پریا است.
  hi.a1.unit28.lesson04.teach.main_tumhen_ek:
    title: گفتن اینکه پیام می‌فرستی
    gloss: برایت پیام می‌فرستم.
    note: 'ترتیب این است: شخص، بعد چیز، بعد فعل: *तुम्हें एक मैसेज भेजूँगा*. *भेजना* یعنی «فرستادن».'
  hi.a1.unit28.lesson04.teach.main_tumhen_bad:
    title: گفتن اینکه دوباره زنگ می‌زنی
    gloss: بعداً برایت زنگ می‌زنم.
    note: '*वापस फ़ोन करना* یعنی «دوباره زنگ زدن»، و *वापस* پیش از *फ़ोन करना* می‌آید؛ *बाद में* یعنی «بعداً».'
  hi.a1.unit28.lesson05.teach.arjun_hay_priya:
    title: خواندن گفتگوی پیام‌ها
    gloss: 'ارجن: سلام پریا، می‌توانی به من زنگ بزنی؟ باید چیزی به تو بگویم. پریا: بلی، حتماً، تا پنج دقیقه دوباره به تو زنگ می‌زنم.'
    note: توجه کن که ارجن چه می‌خواهد، چرا، و پریا کی می‌گوید دوباره زنگ می‌زند.
    glosses:
      हाय: سلام
      सकती: می‌توانی
      फ़ोन: زنگ زدن
      ज़रूरी: 'مهم (مثل: چیز مهمی برای گفتن)'
      कुछ: یک چیز
      बतानी: گفتن
      ज़रूर: حتماً
      करूँगी: زنگ می‌زند
      पाँच: پنج
      मिनट: دقیقه
      वापस: دوباره
  hi.a1.unit28.lesson06.teach.arjun_hailo_main:
    title: ارجن تیلفون را جواب می‌دهد
    gloss: 'ارجن: هلو، من ارجن استم.'
    note: کسی که جواب می‌دهد اول نامش را با *मैं ... बोल रहा हूँ* می‌گوید، اینجا با *रहा* مذکر.
  hi.a1.unit28.lesson06.teach.priya_hay_arjun:
    title: پریا خودش را معرفی می‌کند
    gloss: 'پریا: سلام ارجن، من پریا استم. ارجن: چه خوب که زنگ زدی!'
    note: '*अच्छा हुआ तुमने फ़ोन किया* یعنی «خوب شد که زنگ زدی»؛ *तुमने ... किया* زمان گذشته با *ने* است.'
  hi.a1.unit28.lesson06.teach.priya_tumharee_pahlee:
    title: پریا از شفت می‌پرسد
    gloss: 'پریا: اولین شفتت چطور گذشت؟'
    note: '*कैसी रही* یعنی «چطور گذشت»؛ *कैसी* مؤنث است چون *शिफ़्ट* مؤنث است.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_achchhee:
    title: ارجن خبر خوب می‌دهد
    gloss: 'ارجن: خیلی خوب گذشت، بهتر از آنچه فکر می‌کردم.'
    note: '*अच्छी रही* (یعنی «خوب گذشت») با *शिफ़्ट* مؤنث مطابقت دارد، و *जितना मैंने सोचा था उससे भी बेहतर* یعنی «حتی بهتر از آنچه فکر می‌کردم».'
  hi.a1.unit28.lesson06.teach.vah_narvas_tha:
    title: 'था و थी: بود'
    gloss: او عصبی بود، او خوش بود.
    note: '*था* برای فاعل مذکر و *थी* برای فاعل مؤنث «بود» است؛ پایانه با کسی یا چیزی که توصیف می‌شود مطابقت دارد.'
  hi.a1.unit28.lesson06.teach.priya_yah_sunkar:
    title: پریا افتخار می‌کند
    gloss: 'پریا: شنیدنش چه خوب بود! به تو افتخار می‌کنم.'
    note: در *तुम पर गर्व है* (یعنی «افتخار بر تو است») *पर* به کار می‌رود، و کسی که افتخار می‌کند *मुझे* می‌گیرد.
  hi.a1.unit28.lesson06.teach.arjun_bahut_shukriya:
    title: ارجن متأثر می‌شود
    gloss: 'ارجن: بسیار تشکر، این برایم خیلی معنی دارد.'
    note: '*मेरे लिए* یعنی «برای من» و *इसका बहुत मतलब है* یعنی «این خیلی معنی دارد».'
  hi.a1.unit28.lesson06.teach.uskee_pahlee_shift:
    title: او (ملکیت)
    gloss: اولین شیفتش خیلی خوب گذشت.
    note: '*उसकी* یعنی «او را/مال او» (برای مرد و زن یکی است) و با *शिफ़्ट* مؤنث مطابقت دارد.'
