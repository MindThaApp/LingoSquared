teaching:
  hi.a1.unit15.lesson01.teach.station_mujhe_hai_review:
    title: 'مرور: ایستگاه، برای من، است'
    gloss: ایستگاه، برای من / به من، است
    note: مرور کوتاه اسم مکان و فعل ربطی که برای ساختن ساختار ضرورت در این درس لازم است.
    example_gloss:
    - ایستگاه اینجاست.
    - من کار دارم.
  hi.a1.unit15.lesson01.teach.jaana:
    title: رفتن
    gloss: رفتن (مصدر)
    note: مصدر فعلی که قبلاً به شکل امر *jao* برای «تم» (واحد 9) یاد گرفته بودید -- این درس خود مصدر را معرفی می‌کند.
    example_gloss: من باید بروم.
  hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai:
    title: Mujhe + فعل + hai = باید
    gloss: 'Mujhe قبلاً با chahiye (واحد 6، با اسم) و با hai (واحد 11، مثل mujhe kaam hai، من کار دارم) یاد گرفته شده بود. حالا با فعل هم می‌آید: mujhe jana hai یعنی «من باید بروم». توجه کنید -- با jana، hai همان می‌ماند و هرگز hain نمی‌شود: با گوینده مطابقت نمی‌کند.'
    note: سومین کاربرد الگویی که ضمیر و فعل ربطی دارد؛ پیش از معرفی فعل جدید، دو کاربرد قبلی با شمارهٔ واحد یادآوری می‌شود.
  hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase:
    title: من باید به ایستگاه بروم.
    gloss: من باید به ایستگاه بروم.
    note: نخستین مثال کامل ساختار ضرورت در این واحد.
  hi.a1.unit15.lesson01.teach.tiket:
    title: تکت
    gloss: تکت
    note: اسم تازه‌ای که در سراسر این واحد سفر لازم است.
    example_gloss: تکت من کجاست؟
  hi.a1.unit15.lesson01.teach.chahiye_review:
    title: 'مرور: خواستن / ضرورت داشتن'
    gloss: خواستن / ضرورت داشتن
    note: نخستین بار در واحد 6 با نوشیدنی‌ها یاد گرفته شد، اینجا با تکت دوباره می‌آید.
    example_gloss: من چای می‌خواهم.
  hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase:
    title: من تکت می‌خواهم.
    gloss: من تکت می‌خواهم.
    note: الگوی آشنای *mujhe...chahiye* با اسم تازهٔ همین واحد.
  hi.a1.unit15.lesson01.teach.train:
    title: ریل
    gloss: قطار
    note: اسم تازه.
    example_gloss: ریل بزرگ است.
  hi.a1.unit15.lesson01.teach.delhi_ka_review:
    title: 'مرور: دهلی، از / مال'
    gloss: دهلی، از / مال (نشانهٔ تعلق)
    note: دهلی در واحد 5 یاد گرفته شد؛ نشانهٔ تعلق *ka* در سراسر دوره به کار رفته است (مثلاً واحدهای 5 تا 14) -- اینجا برای نام بردن مقصد تکت دوباره می‌آید.
    example_gloss:
    - برادرم در دهلی زندگی می‌کند.
    - این بکس ارجن است.
  hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase:
    title: من تکت دهلی می‌خواهم.
    gloss: من تکت دهلی می‌خواهم.
    note: اسم این درس را با الگوی نشانهٔ تعلق ترکیب می‌کند تا مقصد مشخصی را نام ببرد.
  hi.a1.unit15.lesson01.teach.kahan_tumhein_review:
    title: 'مرور: کجا، برای تو'
    gloss: کجا، برای تو / به تو
    note: هر دو قبلاً یاد گرفته شده‌اند (واحد 8 و واحد 6) -- اینجا برای پرسیدن اینکه کسی باید کجا برود دوباره می‌آیند.
    example_gloss:
    - بانک کجاست؟
    - چه می‌خواهی؟
  hi.a1.unit15.lesson02.teach.number_review:
    title: 'مرور: نمبر'
    gloss: عدد
    note: نخستین بار در واحد 2 برای نمبر تیلفون یاد گرفته شد -- اینجا برای نمبر پلتفورم دوباره می‌آید.
    example_gloss: نمبر تیلفون تو چند است؟
  hi.a1.unit15.lesson02.teach.platform:
    title: پلاتفورم
    gloss: پلاتفورم
    note: اسم تازه، کلمهٔ معمول هندی برای پلتفورم ایستگاه ریل (واژهٔ قرضی رایج از انگلیسی، با همان الگوی *phone* در واحد 2). در دری هم این کلمه به همین شکل به کار می‌رود.
    example_gloss: پلتفورم بزرگ است.
  hi.a1.unit15.lesson02.teach.platform_number_kya_hai_phrase:
    title: نمبر پلتفورم چند است؟
    gloss: نمبر پلتفورم چند است؟
    note: الگوی آشنای پرسش *kya hai* (مثل نمبر تیلفون، قیمت، سن) را برای موضوع تازه به کار می‌برد.
  hi.a1.unit15.lesson02.teach.platform_number_teen_hai_phrase:
    title: نمبر پلتفورم 3 است.
    gloss: نمبر پلتفورم 3 است.
    note: جواب طبیعی و کامل برای پرسش بالا.
  hi.a1.unit15.lesson02.teach.jaana_habitual_grammar:
    title: Jaati hai (مطابقت مؤنث)
    gloss: Jaati hai قاعدهٔ -ta/-ti/-te + hai/hain واحد 10 را با فعل تازهٔ jana به کار می‌برد. «ریل» از نظر دستوری مؤنث است، پس jaati hai می‌آید، نه jaata hai.
    note: گسترش مستقیم و صریح الگوی مطابقت زمان حال عادتی که قبلاً یاد گرفته شد، با یک فعل تازه و یک اسم تازهٔ مؤنث.
  hi.a1.unit15.lesson02.teach.se_review:
    title: 'مرور: از'
    gloss: از
    note: نخستین بار در واحد 9 برای راهنمایی مسیر یاد گرفته شد -- اینجا برای پلتفورمی که ریل از آن حرکت می‌کند دوباره می‌آید.
    example_gloss: از اینجا مستقیم بروید.
  hi.a1.unit15.lesson02.teach.train_platform_se_jaati_hai_phrase:
    title: ریل از پلتفورم نمبر 3 حرکت می‌کند.
    gloss: ریل از پلتفورم نمبر 3 حرکت می‌کند.
    note: شکل فعل زمان حال عادتی این درس را با حرف اضافهٔ «از» که قبلاً یاد گرفته شد ترکیب می‌کند.
  hi.a1.unit15.lesson02.teach.kitne_baje_review:
    title: 'مرور: چه وقت'
    gloss: ساعت چند
    note: اول در واحد 4 برای گفتن وقت آموخته شد -- اینجا برای پرسیدن وقت حرکت دوباره آمده است.
    example_gloss: ساعت چند است؟
  hi.a1.unit15.lesson02.teach.train_kitne_baje_jaati_hai_phrase:
    title: ریل ساعت چند حرکت می‌کند؟
    gloss: ریل ساعت چند حرکت می‌کند؟
    note: سؤال «ساعت چند» اینجا برای وقت حرکتِ مقرر به کار رفته، نه برای وقت فعلی.
  hi.a1.unit15.lesson02.teach.train_chhah_baje_jaati_hai_phrase:
    title: قطار ساعت 6 حرکت می‌کند.
    gloss: قطار ساعت 6 حرکت می‌کند.
    note: جواب کامل و طبیعی، با شکل جمع *baje* از واحد 4 (شش از استثنای *baja* نیست؛ آن فقط برای ساعت یک است).
  hi.a1.unit15.lesson02.teach.tiket_kitne_ka_hai_phrase:
    title: تکت چند است؟
    gloss: تکت چند است؟
    note: سؤال قیمتِ *kitne ka/ki* از واحد 7 دوباره آمده است. *Tikat* معمولاً مذکر حساب می‌شود (*ka*)؛ بعضی‌ها آن را مؤنث هم می‌گویند (*kitne ki*) که آن هم درست است.
  hi.a1.unit15.lesson02.teach.rupaye_review:
    title: 'مرور: روپیه، پنجاه'
    gloss: روپیه، پنجاه
    note: هر دو اول در واحد 2 برای قیمت و مقدار آموخته شدند -- اینجا برای قیمت تکت دوباره آمده‌اند.
    example_gloss: من پنجاه روپیه دارم.
  hi.a1.unit15.lesson02.teach.tiket_pachaas_rupaye_ka_hai_phrase:
    title: تکت پنجاه روپیه است.
    gloss: تکت پنجاه روپیه است.
    note: جواب کامل و طبیعی برای سؤال قیمتِ بالا.
  hi.a1.unit15.lesson03.teach.hum_hamein:
    title: ما، برای ما
    gloss: ما، برای ما
    note: '''Hum'' (ما) پیشتر در واحد 11 به حیث اولین ضمیر اول شخص جمع کورس معرفی شد؛ ''hamein'' شکل «برای/را»ی آن است که برای گفتگوی سفر دسته‌جمعی لازم است.'
    example_gloss:
    - ما خوب استیم.
    - ما باید به ایستگاه برویم.
  hi.a1.unit15.lesson03.teach.hamein_grammar:
    title: 'Hamein: ضمیر چهارم با شکل «برای/را»'
    gloss: '''Hamein'' شکل «برای/را»ی ''hum'' (واحد 11) است، درست مثل ''mujhe'' (main) و ''tumhein'' (tum). اینجا هم با ''jana''، ''hai'' ثابت می‌ماند و هرگز ''hain'' نمی‌شود -- با ''hum''/''hamein'' مطابقت نمی‌کند.'
    note: اول هر سه ضمیر قبلی با شمارهٔ واحد یادآوری می‌شوند، بعد ضمیر چهارم می‌آید؛ و نکتهٔ ثابت ماندن 'hai' با فعل، از یادداشت دستوری درس اول، دوباره گفته می‌شود.
  hi.a1.unit15.lesson03.teach.hamein_station_jana_hai_phrase:
    title: ما باید به ایستگاه برویم.
    gloss: ما باید به ایستگاه برویم.
    note: ساختار ضرورت با ضمیر جدیدِ جمع.
  hi.a1.unit15.lesson03.teach.ki_review:
    title: 'مرور: نشانهٔ ملکیت (مؤنث)'
    gloss: نشانهٔ ملکیت برای مؤنث (مثل «مالِ»)
    note: اول در واحد 7 همراه با *ka*/*kitne* آموخته شد -- اینجا دوباره آمده چون «قطار» در هندی مؤنث است و شکل ملکیتش 'ki' است، نه 'ka'.
    example_gloss: این قطارِ دهلی است.
  hi.a1.unit15.lesson03.teach.dialogue.line01:
    title: ارجن می‌گوید که باید بروند
    gloss: پریا، ما باید به ایستگاه برویم.
  hi.a1.unit15.lesson03.teach.dialogue.line02:
    title: پریا تکت دهلی لازم دارد
    gloss: خوب است. من تکت دهلی لازم دارم.
  hi.a1.unit15.lesson03.teach.dialogue.line03:
    title: ارجن قیمت را می‌پرسد
    gloss: من هم. تکت چند است؟
  hi.a1.unit15.lesson03.teach.dialogue.line04:
    title: پریا قیمت را می‌گوید
    gloss: تکت پنجاه روپیه است.
  hi.a1.unit15.lesson03.teach.dialogue.line05:
    title: ارجن وقت حرکت را می‌پرسد
    gloss: خوب. قطار ساعت چند حرکت می‌کند؟
  hi.a1.unit15.lesson03.teach.dialogue.line06:
    title: پریا وقت و پلیتفارم را می‌گوید
    gloss: قطار ساعت 6 از پلیتفارم نمبر 3 حرکت می‌کند.
  hi.a1.unit15.lesson03.teach.dialogue.line07:
    title: ارجن می‌فهمد و می‌گوید برویم
    gloss: فهمیدم. برویم!
  hi.a1.unit15.lesson03.teach.dialogue.line08:
    title: پریا موافقت می‌کند
    gloss: برویم!
  hi.a1.unit15.lesson03.teach.grammar_summary:
    title: سه قاعدهٔ اصلی
    gloss: 'سه قاعدهٔ اصلی این واحد: (1) ''mujhe/tumhein/hamein + فعل + hai'' یعنی «باید ___»؛ (2) ''X kitne ka/ki hai?'' برای پرسیدن قیمت است؛ (3) ''X [وقت] baje [جا] se jaati hai'' وقت و جای سفر را می‌گوید.'
    note: خلاصهٔ پایانی که دستور تمام این واحد را یکجا می‌کند، مثل یادداشت دستوریِ جمع‌بندیِ واحد 14.
  hi.a1.unit15.lesson03.teach.tiket_reading:
    title: خواندن تکت
    gloss: 'تکت: دهلی. پلیتفارم نمبر 3. ساعت 6.'
    note: متن کوتاه و ناقصِ یک تکت (بدون جملهٔ کامل، مثل تکت واقعی) که همان حقایق گفتگو را تکرار می‌کند، بدون چیز تازه.
    glosses:
      टिकट: تکت
      प्लेटफ़ॉर्म: پلاتفورم
      नंबर: نمبر
      बजे: ساعت
