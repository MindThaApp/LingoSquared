teaching:
  hi.a1.unit04.lesson01.teach.baje:
    title: ساعت
    gloss: ساعت (برای دو و بیشتر)
    note: با هر ساعت به جز یک استفاده می‌شود -- شکل خاص *one o'clock* را بعداً در همین درس می‌بینی.
    example_gloss: حالا ساعت پنج است.
  hi.a1.unit04.lesson01.teach.abhi:
    title: حالا
    gloss: حالا
    note: کلمهٔ ساده برای وقت که هنگام گفتن ساعتِ فعلی همیشه استفاده می‌کنی.
    example_gloss: حالا ساعت ده است.
  hi.a1.unit04.lesson01.teach.ek_do_teen:
    title: یک، دو، سه
    gloss: یک، دو، سه
    note: از واحد ۲ تکرار شده و اینجا برای گفتن ساعت لازم است -- دقت کن که *ek* با شکل خاص *baja* می‌آید، ولی *do* و *teen* با *baje* معمولی.
    example_gloss:
    - حالا ساعت یک است.
    - حالا ساعت دو است.
    - حالا ساعت سه است.
  hi.a1.unit04.lesson01.teach.chaar_paanch_chhah:
    title: چهار، پنج، شش
    gloss: چهار، پنج، شش
    note: از واحد ۲ تکرار شده -- هر سه با *baje* معمولی می‌آیند.
    example_gloss:
    - حالا ساعت چهار است.
    - حالا ساعت پنج است.
    - حالا ساعت شش است.
  hi.a1.unit04.lesson01.teach.saat_aath_nau:
    title: هفت، هشت، نه
    gloss: هفت، هشت، نه
    note: از واحد ۲ تکرار شده.
    example_gloss:
    - حالا ساعت هفت است.
    - حالا ساعت هشت است.
    - حالا ساعت نه است.
  hi.a1.unit04.lesson01.teach.das_gyaarah_baarah:
    title: ده، یازده، دوازده
    gloss: ده، یازده، دوازده
    note: از واحد ۲ تکرار شده -- آخرین عددهای ساعت که به آن ضرورت داری.
    example_gloss:
    - حالا ساعت ده است.
    - حالا ساعت یازده است.
    - حالا ساعت دوازده است.
  hi.a1.unit04.lesson01.teach.baja_grammar_note:
    title: Baja و baje
    gloss: '*Baja* با *one* می‌آید و *baje* با همهٔ عددهای دیگر: *ek baja hai*، *do baje hain*.'
    note: این یک استثنای واقعی در هماهنگی است، نه ساده‌سازی -- *ek baja hai* تنها ساعتی است که شکل مفرد دارد.
  hi.a1.unit04.lesson01.teach.kitne_baje_hain:
    title: پرسیدن ساعت
    gloss: ساعت چند است؟
    note: در ترجمهٔ لفظی «چند بجه است» -- راه معمول پرسیدن وقت.
  hi.a1.unit04.lesson01.teach.abhi_paanch_baje_hain:
    title: گفتن وقت
    gloss: حالا ساعت پنج است.
    note: جواب کامل و طبیعی برای *Kitne baje hain?*
  hi.a1.unit04.lesson02.teach.yoga_class_reprise:
    title: صنف یوگا
    gloss: صنف یوگا
    note: از واحد ۱ تکرار شده -- مثال اصلی این درس برای برنامه‌ریزی.
    example_gloss: صنف یوگا امروز است.
  hi.a1.unit04.lesson02.teach.subah:
    title: صبح
    gloss: صبح
    note: یکی از چهار کلمهٔ وقت‌های روز که این درس می‌آموزاند.
    example_gloss: صنف یوگا صبح است.
  hi.a1.unit04.lesson02.teach.dopahar:
    title: چاشت / ظهر
    gloss: چاشت، ظهر
    note: هم نیمروز (ظهر) و هم اوایل بعد از ظهر را می‌رساند.
    example_gloss: چاشت صنف نیست.
  hi.a1.unit04.lesson02.teach.shaam:
    title: شام
    gloss: شام (شب‌هنگام)
    note: وقتی از روز که بعد از *dopahar* و پیش از *raat* می‌آید.
    example_gloss: صنف بعدی ساعت پنج شام است.
  hi.a1.unit04.lesson02.teach.raat:
    title: شب
    gloss: شب
    note: آخرین کلمه از چهار کلمهٔ وقت‌های روز.
    example_gloss: شب صنف نیست.
  hi.a1.unit04.lesson02.teach.ko_reprise:
    title: Ko با وقت عمومی
    gloss: '*Ko* وقتی با کلمهٔ وقت روز می‌آید که ساعت مشخص گفته نشود: *dopahar ko*، *raat ko*.'
    note: همان *ko* که روز هفته را نشان می‌دهد (واحد ۳)، حالا یک بخش عمومی از روز را نشان می‌دهد -- ساختار طبیعی و درست، ولی تنها ساختار این واحد نیست (برای ساعت مشخص، یادداشت بعدی را ببین).
  hi.a1.unit04.lesson02.teach.time_of_day_baje_note:
    title: کلمهٔ وقت روز درست پیش از baje
    gloss: 'برای ساعت مشخص، کلمهٔ وقت روز درست پیش از *baje* می‌آید و چیزی در میان نمی‌آید: *subah saat baje*، *shaam paanch baje*.'
    note: اینجا *ko* نمی‌آید -- آن برای بخش عمومی روز بدون ساعت مشخص است، چنانکه یادداشت پیشین گفت.
  hi.a1.unit04.lesson02.teach.class_kitne_baje_hai:
    title: پرسیدن وقت صنف
    gloss: صنف ساعت چند است؟
    note: همان ساختار *kitne baje* از درس ۱، اما حالا دربارهٔ یک رویداد می‌پرسد، نه وقت فعلی.
  hi.a1.unit04.lesson02.teach.class_subah_saat_baje_hai:
    title: گفتن وقت یک رویداد
    gloss: صنف ساعت هفت صبح است.
    note: '*subah* را مستقیم با *saat baje* ترکیب می‌کند، مطابق یادداشت دستوری بالا.'
  hi.a1.unit04.lesson03.teach.kal:
    title: فردا / دیروز
    gloss: فردا، دیروز
    note: هندی برای هر دو یک کلمه دارد -- متن (و زمان فعل) معلوم می‌کند کدام مقصود است. در این درس همیشه یعنی «فردا».
    example_gloss: صنف فردا ساعت پنج شام است.
  hi.a1.unit04.lesson03.teach.agli_reprise:
    title: بعدی
    gloss: بعدی
    note: از واحد ۳ تکرار شده -- شکل مؤنث است و با اسم مؤنث *class* هماهنگ می‌شود.
    example_gloss: صنف بعدی فردا است.
  hi.a1.unit04.lesson03.teach.theek_hai_shukriya_reprise:
    title: خوب است، تشکر
    gloss: خوب است، تشکر!
    note: هر دو کلمه از واژه‌های خداحافظی خود واحد ۱ دوباره آمده‌اند.
  hi.a1.unit04.lesson03.teach.milte_hain_reprise:
    title: همدیگر را می‌بینیم
    gloss: همدیگر را می‌بینیم
    note: از خداحافظی پایانی واحد ۳ تکرار شده و حالا با *kal* برای «فردا می‌بینیم» آمده است.
  hi.a1.unit04.lesson03.teach.agli_class_kitne_baje_hai:
    title: پرسیدن از وقت صنف بعدی
    gloss: صنف بعدی ساعت چند است؟
    note: '*agli* (مؤنث، مطابق با صنف) با الگوی *kitne baje* همین واحد یکجا شده است.'
  hi.a1.unit04.lesson03.teach.agli_class_shaam_paanch_baje_hai:
    title: گفتن وقت صنف بعدی
    gloss: صنف بعدی ساعت پنج شام است.
    note: جواب طبیعی و کامل برای سوال بالا.
  hi.a1.unit04.lesson03.teach.kal_milte_hain:
    title: ختم صحبت با قرار دیدار فردا
    gloss: خوب است، فردا می‌بینیم!
    note: راه طبیعی برای ختم صحبت وقتی که وقت مشخص شده باشد.
  hi.a1.unit04.lesson03.teach.dialogue.line01:
    title: ارجن درباره صنف بعدی می‌پرسد
    gloss: ارجن می‌پرسد که صنف بعدی ساعت چند است.
    note: عین سوال همین درس دوباره آمده است.
  hi.a1.unit04.lesson03.teach.dialogue.line02:
    title: پریا وقت را می‌گوید
    gloss: پریا می‌گوید که صنف بعدی ساعت پنج شام است.
    note: عین جمله جواب همین درس دوباره آمده است.
  hi.a1.unit04.lesson03.teach.dialogue.line03:
    title: ارجن از او تشکر می‌کند
    gloss: ارجن می‌گوید خوب است، تشکر.
    note: از واژه‌های واحد ۱ دوباره آمده است.
  hi.a1.unit04.lesson03.teach.dialogue.line04:
    title: پریا صحبت را ختم می‌کند
    gloss: پریا موافقت می‌کند و می‌گوید فردا می‌بینیم.
    note: عین جمله پایانی همین درس دوباره آمده است.
