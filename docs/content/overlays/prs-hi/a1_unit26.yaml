teaching:
  hi.a1.unit26.lesson01.teach.jaiket_svetar:
    title: کوت، سویتر
    gloss: کوت، سویتر
    note: '*जैकेट* مؤنث و *स्वेटर* مذکر است، که در کلمه‌های همراهشان دیده می‌شود: *मेरी जैकेट*، *मेरा स्वेटर*.'
    example_gloss:
    - دنبال یک کوت می‌گردم.
    - من یک سویتر دارم.
  hi.a1.unit26.lesson01.teach.paint_joote:
    title: پتلون، بوت
    gloss: پتلون، بوت‌ها
    note: '*पैंट* یک کلمه برای یک جوره پتلون است (*मेरी पैंट*)، و *जूते* جمع *जूता* است: اسم مذکری که به *-आ* ختم می‌شود، در جمع به *-ए* تبدیل می‌شود.'
    example_gloss:
    - من دنبال یک پتلون می‌گردم.
    - دنبال بوت می‌گردم.
  hi.a1.unit26.lesson01.teach.main_ek_jaiket:
    title: گفتن اینکه دنبال چه می‌گردید
    gloss: دنبال یک کوت می‌گردم.
    note: 'فعل در آخر می‌آید: *मैं एक जैकेट ढूँढ़ रहा हूँ*. *रहा हूँ* معنی «دارم می‌گردم» (در حال انجام) می‌دهد، و *रहा* شکل مذکر است (خانم *रही* می‌گوید).'
  hi.a1.unit26.lesson02.teach.saiz:
    title: اندازه
    gloss: اندازه
    note: '*साइज़* اسم مذکر است، پس کلمه‌های همراهش هم مذکر استند: *मेरा साइज़*.'
    example_gloss: شما کدام اندازه استید؟
  hi.a1.unit26.lesson02.teach.apka_saiz_kya:
    title: پرسیدن در مورد اندازه
    gloss: چه سایز می‌پوشید؟
    note: '*कौन सा* («کدام») دربارهٔ انتخاب یکی از چند چیز می‌پرسد و *सा* با اسم هماهنگ می‌شود: *कौन सा साइज़*، ولی *कौन सी जैकेट*. *आप* «شما»ی محترمانه برای فروشنده است.'
  hi.a1.unit26.lesson02.teach.mera_saiz_em:
    title: گفتن اندازهٔ خود
    gloss: من اندازهٔ M استم.
    note: 'در اینجا هندی برای «داشتن» فعل نمی‌آورد: *मेरा साइज़ एम है* لفظ به لفظ «سایز من M است» می‌شود، و *मेरा* با *साइज़* مذکر هماهنگ است.'
  hi.a1.unit26.lesson03.teach.kala_neela:
    title: سیاه، آبی
    gloss: سیاه، آبی
    note: دو صفت رنگ اساسی این درس.
    example_gloss:
    - کوت را به رنگ سیاه می‌خواهم.
    - این را به رنگ آبی هم دارید؟
  hi.a1.unit26.lesson03.teach.mujhe_vah_jaiket:
    title: درخواست یک رنگ
    gloss: کوت را به رنگ سیاه می‌خواهم.
    note: '*मुझे ... चाहिए* شیوهٔ گفتن «می‌خواهم» در هندی است: خواست «به من» (*मुझे*) می‌رسد و چیزِ خواسته‌شده درست پیش از *चाहिए* می‌آید.'
  hi.a1.unit26.lesson03.teach.kya_apke_pas:
    title: پرسیدن از رنگ دیگر
    gloss: این را به رنگ آبی هم دارید؟
    note: '*आपके पास ... है?* («نزد شما ... است؟») شیوهٔ مؤدبانهٔ پرسیدن «آیا ... دارید؟» است، و *भी* («هم») بعد از کلمه‌ای می‌آید که به آن اضافه می‌کند.'
  hi.a1.unit26.lesson04.teach.kya_yah_jaiket:
    title: پرسیدن از اندازه بودن لباس
    gloss: این کوت به تو اندازه است؟
    note: 'هندی دربارهٔ لباس می‌گوید «درست می‌آید»: *ठीक आती है*. فعل با آن چیز هماهنگ می‌شود، پس *जैकेट* مؤنث *आती* می‌گیرد و *स्वेटर* مذکر *आता* می‌گیرد.'
  hi.a1.unit26.lesson04.teach.yah_ekdam_theek:
    title: تأیید اندازه بودن
    gloss: به من اندازه است.
    note: '*एकदम* («کاملاً») معنی «کاملاً اندازه است» می‌دهد؛ *आती है* با *जैकेट* مؤنث هماهنگ است.'
  hi.a1.unit26.lesson04.teach.yah_bahut_chhotee:
    title: خیلی کوچک است
    gloss: این خیلی کوچک است.
    note: '*बहुत* پیش از صفت می‌آید و اینجا معنی «زیادی» می‌دهد: *बहुत छोटी*. صفت با *जैकेट* مؤنث هماهنگ است.'
  hi.a1.unit26.lesson04.teach.yah_bahut_baree:
    title: خیلی بزرگ است
    gloss: این خیلی بزرگ است.
    note: 'همین الگو با *बड़ी*: *बड़ा* برای اسم مؤنث به *बड़ी* تبدیل می‌شود، پس *बहुत बड़ी*.'
  hi.a1.unit26.lesson05.teach.nabbe:
    title: نهصد
    gloss: نهصد
    note: '*नौ सौ* عدد ۹۰۰ است که در قیمت کوتی به کار رفته.'
    example_gloss: قیمت کوتی نهصد روپیه است.
  hi.a1.unit26.lesson05.teach.jaiket_kee_keemat:
    title: گفتن قیمت
    gloss: قیمت کوتی نهصد روپیه است.
    note: 'هندی می‌گوید «قیمتِ کوتی ... است»: *जैकेट की कीमत नौ सौ रुपये है*. *की* با *कीमत* مؤنث هماهنگ است، نه با *जैकेट*.'
  hi.a1.unit26.lesson05.teach.sardee_kee_jaiket:
    title: خواندن رسید دوکان
    gloss: 'کوتی زمستانی: سایز M، رنگ سیاه. قیمت: نهصد روپیه. این کوتی کاملاً اندازه است و گرم است.'
    note: اندازه، رنگ، قیمت و دو ویژگی ذکرشدهٔ کوت را دنبال کنید.
    glosses:
      सर्दी: (کوتی) زمستانی
      साइज़: اندازه
      रंग: رنگ
      काला: سیاه
      कीमत: قیمت
      नौ: نُه
      सौ: صد
      रुपये: روپیه
      जैकेट: کوت
      आती: اندازه است
      गर्म: گرم
  hi.a1.unit26.lesson06.teach.priya_yah_jaiket:
    title: پریا کوتی را می‌بیند
    gloss: 'پریا: این کوتی خیلی قشنگ است! سایزت چند است؟'
    note: '*अच्छी* با *जैकेट* مؤنث هماهنگ است. *तुम्हारा* «تو/ت»ی غیررسمی است که بین دوستان به کار می‌رود.'
  hi.a1.unit26.lesson06.teach.arjun_mera_saiz:
    title: ارجن می‌خواهد آن را امتحان کند
    gloss: 'ارجن: سایز من M است. می‌شود آن را بپوشم و ببینم؟'
    note: '*पहनकर देखना* («پوشیدن و دیدن») شیوهٔ گفتن «امتحان کردن» در هندی است. *सकता हूँ* معنی «می‌توانم» یا «اجازه هست» می‌دهد، و خانم *सकती हूँ* می‌گوید.'
  hi.a1.unit26.lesson06.teach.priya_zaroor_kya:
    title: پریا دربارهٔ اندازه می‌پرسد
    gloss: 'پریا: حتماً. اندازه است؟'
    note: '*यह* معنی «این/آن» می‌دهد و *आती* با *जैकेट* مؤنث هماهنگ است.'
  hi.a1.unit26.lesson06.teach.arjun_han_yah:
    title: ارجن تأیید می‌کند
    gloss: 'ارجن: بلی، کاملاً اندازه است و گرم هم هست.'
    note: کاملاً با رسیدی که خواندید مطابقت دارد؛ این همان کوت است.
  hi.a1.unit26.lesson06.teach.priya_barhiya_tum:
    title: پریا دربارهٔ رنگ می‌پرسد
    gloss: 'پریا: عالی! آن را به رنگ سیاه می‌گیری یا آبی؟'
    note: '*या* («یا») انتخاب می‌دهد. *रंग* دوم را می‌شود نگفت: *काले रंग में ... या नीले में*. *तुम* غیررسمی است.'
  hi.a1.unit26.lesson06.teach.arjun_main_ise:
    title: ارجن تصمیم می‌گیرد
    gloss: 'ارجن: من آن را به رنگ سیاه می‌گیرم.'
    note: '*लूँगा* آیندهٔ *लेना* («گرفتن») است، فعل معمول برای تصمیم گرفتن در دکان. خانم *लूँगी* می‌گوید.'
  hi.a1.unit26.lesson06.teach.main_leta_hoon:
    title: लेता हूँ و लेता है
    gloss: من می‌گیرم، او می‌گیرد.
    note: '*-ता* پسوند عادت است و با فاعل هماهنگ می‌شود، در حالی که *हूँ* با *मैं* و *है* با *वह* می‌آید.'
