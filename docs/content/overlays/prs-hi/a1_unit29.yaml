teaching:
  hi.a1.unit29.lesson01.teach.kul_kitna_hua:
    title: پرسیدن قیمت مجموع
    gloss: در مجموع چند تمام می‌شود؟
    note: '*कुल* یعنی «مجموع»، و *कितना हुआ?* («چقدر شد؟») روش روزمره برای پرسیدن مجموع است.'
  hi.a1.unit29.lesson01.teach.kul_pachchees_rupye:
    title: گفتن قیمت مجموع
    gloss: جمعاً دو صد و پنجاه روپیه می‌شود.
    note: '*हुए* با *रुपये* که جمع است مطابقت دارد: *कुल दो सौ पचास रुपये हुए* تحت‌اللفظی «در مجموع، دو صد و پنجاه روپیه شد» است.'
  hi.a1.unit29.lesson02.teach.kard_se_pement:
    title: پرداخت با کارت یا نقد
    gloss: با کارت پرداختن، نقد پرداختن
    note: هندی *कार्ड से पेमेंट करना* («با کارت پرداخت کردن») و *नकद पेमेंट करना* می‌گوید؛ *से* وسیلهٔ پرداخت را نشان می‌دهد.
    example_gloss:
    - اینجا می‌توانم با کارت پرداخت کنم؟
    - من نقد پرداخت می‌کنم.
  hi.a1.unit29.lesson02.teach.kya_main_yahan:
    title: پرسیدن امکان پرداخت با کارت
    gloss: اینجا می‌توانم با کارت پرداخت کنم؟
    note: '*यहाँ* («اینجا») جا را مشخص می‌کند، و *सकता हूँ* («می‌توانم») بعد از عبارت اصلی می‌آید؛ یک خانم *सकती हूँ* می‌گوید.'
  hi.a1.unit29.lesson02.teach.ap_nakad_pement:
    title: پرسیدن ترجیح پرداخت
    gloss: می‌خواهین نقد پرداخت کنید یا با کارت؟
    note: '*आप ... करेंगे* سوال مؤدبانهٔ زمان آینده است که صندوقدار می‌پرسد، و *आप* فعل جمع *करेंगे* می‌گیرد.'
  hi.a1.unit29.lesson03.teach.bil:
    title: حساب
    gloss: حساب
    note: '*बिल* اسم مذکر است: *एक बिल*، *बिल का*.'
    example_gloss: حساب را تقسیم کنیم؟
  hi.a1.unit29.lesson03.teach.bil_bant_len:
    title: پیشنهاد تقسیم حساب
    gloss: حساب را تقسیم کنیم؟
    note: '*बाँट लें?* («تقسیم کنیم؟») بدون گفتن *हम* یک پیشنهاد مشترک می‌دهد؛ *लें* شکل «بیایین» از *लेना* است.'
  hi.a1.unit29.lesson03.teach.kya_main_alag:
    title: خواستن پرداخت جداگانه
    gloss: می‌توانم جداگانه پرداخت کنم؟
    note: '*अलग से* یعنی «جداگانه» و پیش از *पेमेंट कर सकता हूँ* می‌آید.'
  hi.a1.unit29.lesson04.teach.bakee_paise:
    title: پول خورد
    gloss: پول خورد
    note: '*बाकी पैसे* («پول باقی‌مانده») جمع است و پولی را می‌گوید که پس می‌گیرین.'
    example_gloss: این هم پول خوردتان.
  hi.a1.unit29.lesson04.teach.ye_rahe_apke:
    title: دادن پول خورد
    gloss: این هم پول خوردتان.
    note: '*आपके* «شما/تان» مؤدبانه است (*आप* + *के*) و با *पैसे* که جمع است مطابقت دارد.'
  hi.a1.unit29.lesson04.teach.mujhe_bakee_paise:
    title: نپذیرفتن پول خورد
    gloss: پول خورد لازم ندارم.
    note: '*मुझे ... नहीं चाहिए* («برای من ... لازم نیست») روش گفتن «نمی‌خواهم» در هندی است؛ *नहीं* پیش از *चाहिए* می‌آید.'
  hi.a1.unit29.lesson05.teach.paintees:
    title: سه صد و پنجاه
    gloss: سه صد و پنجاه
    note: '*तीन सौ पचास* یعنی ۳۵۰: اول صدها را بگویین، بعد دهها را.'
    example_gloss: قیمتش سه صد و پنجاه روپیه است.
  hi.a1.unit29.lesson05.teach.bil_do_thalee:
    title: خواندن صورت‌حساب رستورانت
    gloss: 'بل: دو تهالی و دو چای. مجموع: سه صد و پنجاه روپیه. پرداخت: با کارت.'
    note: دقت کنید چی سفارش داده شده، مجموع چند است و چطور پرداخت شده.
    glosses:
      बिल: حساب
      दो: دو
      थाली: تهالی‌ها
      चाय: چای‌ها
      कुल: مجموع
      तीन: سه
      सौ: صد
      पचास: پنجاه
      रुपये: روپیه‌ها
      पेमेंट: پرداخت
      कार्ड: کارت
  hi.a1.unit29.lesson06.teach.priya_bil_mang:
    title: پریا بل را می‌خواهد
    gloss: 'پریا: بل را بخواهیم؟'
    note: '*माँग लें?* («بخواهیم؟») دوباره شکل «بیایین» از *लेना* را دارد، و *माँगना* یعنی «خواستن».'
  hi.a1.unit29.lesson06.teach.arjun_han_achchha:
    title: ارجن مجموع را می‌پرسد
    gloss: 'ارجن: بلی، فکر خوب است. جمعاً چقدر شد؟'
    note: '*कुल कितना हुआ?* همان سوال مجموع از قبل است، حالا سر میز پرسیده می‌شود.'
  hi.a1.unit29.lesson06.teach.priya_paintees_rupye:
    title: پریا مجموع را می‌گوید
    gloss: 'پریا: سه صد و پنجاه روپیه شد. تقسیم کنیم؟'
    note: '*तीन सौ पचास रुपये हुए* مجموع را می‌گوید، و *बाँट लें?* می‌پرسد «تقسیم کنیم؟»'
  hi.a1.unit29.lesson06.teach.arjun_naheen_aj:
    title: ارجن اصرار می‌کند که خودش پرداخت کند
    gloss: 'ارجن: نه، امروز بگذار من پرداخت کنم. تو به من خیلی کمک کرده‌ای.'
    note: '*मुझे पेमेंट करने दो* یعنی «بگذار پرداخت کنم»، و *तुमने मेरी बहुत मदद की है* *ने* دارد چون فعل در زمان گذشته است.'
  hi.a1.unit29.lesson06.teach.priya_tum_kitne:
    title: پریا متأثر می‌شود
    gloss: 'پریا: چه مهربان استی! بسیار تشکر.'
    note: '*तुम कितने अच्छे हो!* («چه خوب استی!») تعریف گرم است، و *शुक्रिया* یعنی «تشکر».'
  hi.a1.unit29.lesson06.teach.arjun_kya_main:
    title: ارجن دربارهٔ پرداخت با کارت می‌پرسد
    gloss: 'ارجن: می‌توانم اینجا با کارت پرداخت کنم؟'
    note: سوال *क्या मैं यहाँ कार्ड से पेमेंट कर सकता हूँ?* دوباره می‌آید، حالا در یک رستورانت واقعی.
  hi.a1.unit29.lesson06.teach.arjun_bil_deta:
    title: 'देता है: او پرداخت می‌کند'
    gloss: ارجن بل را پرداخت می‌کند.
    note: '*देता है* شکل *वह* از *देना* («دادن») است؛ هندی به جای «بل را پرداخت می‌کند» می‌گوید «بل را می‌دهد».'
