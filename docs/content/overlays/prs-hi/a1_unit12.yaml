teaching:
  hi.a1.unit12.lesson01.teach.vyast_review:
    title: 'مرور: مصروف'
    gloss: مصروف
    note: مرور کوتاه صفت درس یازدهم؛ این درس آن را برای تمرین زمان گذشتهٔ فعل «بودن» دوباره به کار می‌برد.
    example_gloss: ارجن مصروف است.
  hi.a1.unit12.lesson01.teach.tha_thi:
    title: بود (مذکر / مؤنث)
    gloss: بود
    note: زمان گذشتهٔ فعل «بودن» (است/هستم/استند) و مقابل مستقیم hai/hoon/hain. «Tha» با فاعل مذکر می‌آید و «thi» با فاعل مؤنث.
    example_gloss:
    - ارجن دیروز مصروف بود.
    - پریا دیروز مصروف بود.
  hi.a1.unit12.lesson01.teach.tha_thi_grammar:
    title: Tha و thi
    gloss: '«Tha» با فاعل مذکر می‌آید و «thi» با فاعل مؤنث. این دو جای «hai» می‌نشینند، اما برخلاف «hai» با جنسیت تغییر می‌کنند: ارجن مصروف است، ارجن مصروف بود، پریا مصروف بود.'
    note: قاعدهٔ هماهنگی با جنسیت را صریح بیان می‌کند و الگوی آشنای فعل «بودن» را به زمان گذشته گسترش می‌دهد.
  hi.a1.unit12.lesson01.teach.kal_review:
    title: 'مرور: دیروز'
    gloss: دیروز
    note: در درس چهارم آموخته شد که «kal» هم «فردا» و هم «دیروز» معنا می‌دهد و فقط زمان فعل فرق را نشان می‌دهد. این اولین درسی است که معنای «دیروز» آن واقعاً به کار می‌رود.
    example_gloss: دیروز شنبه بود.
  hi.a1.unit12.lesson01.teach.kaisa:
    title: چطور (مذکر)
    gloss: چطور
    note: 'الگویی را کامل می‌کند که دو شکل آن را قبلاً می‌دانین: «kaise» و «kaisi» (از «حال شما چطور است» در درس اول). این فقط شکل مذکر مفرد است که با کلماتی مثل «din» (روز) می‌آید.'
    example_gloss: روز چطور بود؟
  hi.a1.unit12.lesson01.teach.kal_kaisa_tha_phrase:
    title: دیروز چطور بود؟
    gloss: دیروز چطور بود؟
    note: پرسش اصلی و تکراری این درس که همهٔ کلمه‌های آموخته‌شده تا اینجا را در خود دارد.
  hi.a1.unit12.lesson01.teach.din_achha_tha_phrase:
    title: روز خوب بود.
    gloss: روز خوب بود.
    note: جواب آمادهٔ «دیروز چطور بود؟» با شکل مذکر (din مذکر است).
  hi.a1.unit12.lesson01.teach.filma_achi_thi:
    title: فلم خوب بود.
    gloss: فلم خوب بود.
    note: همین الگو با فاعل مؤنث (film مؤنث است)؛ یادآوری واژه‌های درس یازدهم.
  hi.a1.unit12.lesson01.teach.kaisa_kaisi_grammar:
    title: Kaisa، kaisi، kaise
    gloss: '«Kaisa» با فاعل مذکر مفرد می‌آید (روز چطور بود؟)، «kaisi» با مؤنث (چای چطور بود؟) و «kaise» با aap/tum برای پرسیدن از یک مرد به کار می‌رود (حال شما چطور است؟؛ از یک زن: «aap kaisi hain?»). هر سه شکل‌های یک کلمه‌اند.'
    note: 'برای بار اول الگوی کامل را کنار هم می‌آورد: kaise/kaisi را از درس اول می‌دانین و kaisa اضافهٔ همین درس است.'
  hi.a1.unit12.lesson02.teach.names_mai_review:
    title: 'مرور: من، ارجن، پریا'
    gloss: من، ارجن، پریا
    note: مرور کوتاه پیش از مثال‌های زمان گذشته با «من» در این درس.
    example_gloss:
    - من ارجن هستم.
    - من پریا هستم.
  hi.a1.unit12.lesson02.teach.jaana_gaya_gai:
    title: رفت (مذکر / مؤنث)
    gloss: رفت
    note: زمان گذشتهٔ «jaana» (رفتن)؛ همان ریشه‌ای که در درس نهم به شکل امری «jao» (برو!) آموختید. مثل «tha»/«thi» با جنسیت فاعل هماهنگ می‌شود.
    example_gloss:
    - ارجن به بازار رفت.
    - پریا به خانه رفت.
  hi.a1.unit12.lesson02.teach.jaana_grammar:
    title: Gaya/gai = گذشتهٔ jaana
    gloss: «Gaya»/«gai» زمان گذشتهٔ «jaana» (رفتن؛ jao در درس نهم) است و مثل «tha»/«thi» با جنسیت فاعل تغییر می‌کند.
    note: زمان گذشتهٔ تازه را صریح به ریشهٔ امری آشنا وصل می‌کند.
  hi.a1.unit12.lesson02.teach.bazaar_ghar_review:
    title: 'مرور: بازار، خانه'
    gloss: بازار، خانه
    note: مرور کوتاه دو واژهٔ مکان از درس‌های هفتم و هشتم که برای گفتن جای رفتن لازم است.
    example_gloss:
    - این بازار است.
    - این خانه است.
  hi.a1.unit12.lesson02.teach.milna_mila_mili:
    title: دید و ملاقات کرد (مذکر / مؤنث)
    gloss: ملاقات کرد
    note: زمان گذشتهٔ «milna» (ملاقات کردن)؛ همان ریشه‌ای که در «milte hain» (پایان درس‌های ۱، ۴، ۱۰ و ۱۱) آمده بود. با جنسیت فاعل هماهنگ می‌شود.
    example_gloss:
    - ارجن با پریا ملاقات کرد.
    - پریا با ارجن ملاقات کرد.
  hi.a1.unit12.lesson02.teach.milna_se_grammar:
    title: Se = «با» در اینجا، نه «از»
    gloss: در اینجا «se» معنای «از» نمی‌دهد. «X se milna» یعنی «با X ملاقات کردن»، در حالی که در «main Bharat se hoon» همین «se» به معنای «از» بود.
    note: کاربرد دوگانهٔ واقعی یک واژهٔ آموخته‌شده که صریح توضیح داده می‌شود.
  hi.a1.unit12.lesson02.teach.wahan_review:
    title: 'مرور: آنجا'
    gloss: آنجا
    note: مرور کوتاه از درس‌های هشتم و نهم که اینجا برای گفتن جای ملاقات به کار می‌رود.
    example_gloss: مکتب آنجاست.
  hi.a1.unit12.lesson02.teach.kal_bazaar_gaya_phrase:
    title: من دیروز به بازار رفتم.
    gloss: من دیروز به بازار رفتم.
    note: زمان گذشتهٔ تازهٔ این درس را با «kal» از درس اول ترکیب می‌کند.
  hi.a1.unit12.lesson02.teach.wahan_priya_se_mila_phrase:
    title: من آنجا پریا را دیدم.
    gloss: من آنجا پریا را دیدم.
    note: «mila» این درس را با «se» («با») و «wahan» (آنجا) ترکیب می‌کند.
  hi.a1.unit12.lesson02.teach.saath_review:
    title: 'مرور: با هم'
    gloss: با هم
    note: مرور کوتاه از درس یازدهم.
    example_gloss: ما با هم چای می‌نوشیم.
  hi.a1.unit12.lesson03.teach.chai_dukaan_khana_review:
    title: 'مرور: چای، دکان، غذا'
    gloss: چای، دکان، غذا
    note: مرور کوتاه سه اسم از درس‌های ششم و هفتم که برای مکالمه و یادداشت خواندنی این درس لازم‌اند.
    example_gloss:
    - چای خوب است.
    - دکان خوب است.
    - غذا خوب است.
  hi.a1.unit12.lesson03.teach.ka_kaisi_review:
    title: 'مرور: «از/مال» (ka)، چطور (مؤنث)'
    gloss: مال / از (ka)، چطور (مؤنث، kaisi)
    note: «Ka» (از «kitne ka» و «raat ka khana» درس دهم) و «kaisi» (که قبلاً آموخته‌اید) اینجا دوباره به کار می‌روند؛ قاعدهٔ تازه نیستند.
    example_gloss:
    - دیروز روز خوبی بود.
    - دکان چای چطور بود؟
  hi.a1.unit12.lesson03.teach.dialogue.line01:
    title: ارجن می‌پرسد دیروز چطور بود
    gloss: پریا، دیروز چطور بود؟
  hi.a1.unit12.lesson03.teach.dialogue.line02:
    title: پریا می‌گوید خوب بود
    gloss: خیلی خوب بود! ما همدیگر را دیدیم.
  hi.a1.unit12.lesson03.teach.dialogue.line03:
    title: ارجن از بازار می‌گوید
    gloss: بلی! اول هم به بازار رفتم.
  hi.a1.unit12.lesson03.teach.dialogue.line04:
    title: پریا دربارهٔ بازار می‌پرسد
    gloss: خوب! در بازار چی بود؟
  hi.a1.unit12.lesson03.teach.dialogue.line05:
    title: ارجن جواب می‌دهد
    gloss: غذا خوب بود.
  hi.a1.unit12.lesson03.teach.dialogue.line06:
    title: پریا دربارهٔ دکان چای می‌پرسد
    gloss: خوب! و دکان چای چطور بود؟
  hi.a1.unit12.lesson03.teach.dialogue.line07:
    title: ارجن جواب می‌دهد
    gloss: دکان چای خیلی خوب بود.
  hi.a1.unit12.lesson03.teach.dialogue.line08:
    title: پریا صحبت را تمام می‌کند
    gloss: خوب! پس فردا دوباره همدیگر را ببینیم؟
  hi.a1.unit12.lesson03.teach.mile_grammar:
    title: Tum/hum/ve شکل جمع‌مانند گذشته را می‌گیرند
    gloss: '«Tum»، «hum» و «ve» در زمان گذشته همان شکلی را می‌گیرند که در زمان حال با «-te» می‌گیرند: «the» (به‌جای «tha»)، «gaye» (به‌جای «gaya»)، «mile» (به‌جای «mila»)؛ مثل «hum milte hain» که «hum mile» می‌شود.'
    note: الگوی کامل را برای فهم بهتر بیان می‌کند، هرچند در تمرین‌های این درس فقط «mile» تمرین می‌شود؛ «the»/«gaye» فقط برای شناختن‌اند و تنها در همین توضیح می‌آیند.
  hi.a1.unit12.lesson03.teach.priya_note:
    title: یادداشت پریا
    gloss: آرجون، دیروز روز خیلی خوبی بود. غذا خوب بود و دکان چای هم خوب بود. - پریا
    note: یک یادداشت کوتاه که حقیقت‌هایی را که گفتگو همین حالا بیان کرد دوباره می‌گوید، بدون لغت تازه.
    glosses:
      कल: دیروز
      दिन: روز
      अच्छा: خوب (مذکر)
      था: بود (مذکر)
      खाना: غذا
      दुकान: دوکان
      अच्छी: خوب (مؤنث)
      थी: بود (مؤنث)
