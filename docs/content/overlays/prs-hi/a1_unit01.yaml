teaching:
  hi.a1.unit01.lesson01.teach.aap:
    title: «شما» به شکل رسمی و محترمانه
    gloss: شما (رسمی، محترمانه)
    note: در دری هم برای «شما» و «تو» فرق وجود دارد و در هندی هم همین‌طور. *aap* با کسی استفاده می‌شود که از شما بزرگ‌تر است، آشنا نیست یا رابطهٔ کاری محترمانه دارید. از نگاه دستوری *aap* جمع حساب می‌شود، حتی برای یک نفر؛ پس فعل آن مثل فعل «آن‌ها» ختم‌های -en/hain می‌گیرد.
  hi.a1.unit01.lesson01.teach.tum:
    title: «تو» به شکل غیررسمی
    gloss: شما (غیررسمی، دوستانه)
    note: '*Tum* با دوست، هم‌سن، شخص خُردتر یا اعضای فامیل استفاده می‌شود؛ رابطهٔ غیررسمی ولی باز هم محترمانه (فرق دارد با *tu* که صمیمی‌تر است و در این کورس یاد داده نمی‌شود). *Tum* ختم‌های فعل خاص خودش را دارد که هم از *aap* فرق می‌کند و هم از *tu*.'
  hi.a1.unit01.lesson01.teach.aap_kaise_hain:
    title: پرسش رسمی احوال، از یک مرد
    gloss: حال شما چطور است؟ (رسمی، از یک مرد)
    note: '*Kaise* با جنسیت کسی که از او پرسیده می‌شود هماهنگ می‌شود، نه با جنسیت گوینده؛ این شکل برای خطاب به یک مرد استفاده می‌شود. در دری «چطور استین» هیچ‌وقت به این شکل تغییر نمی‌کند.'
  hi.a1.unit01.lesson01.teach.aap_kaisi_hain:
    title: پرسش رسمی احوال، از یک زن
    gloss: حال شما چطور است؟ (رسمی، از یک خانم)
    note: همین سوال با همان سطح احترام *aap*؛ فقط *kaise* به *kaisi* تبدیل می‌شود تا با مخاطب خانم هماهنگ شود. خود فعل *hain* هیچ‌وقت تغییر نمی‌کند؛ فقط صفت تغییر می‌کند.
  hi.a1.unit01.lesson01.teach.tum_kaise_ho:
    title: پرسیدن احوال به شکل غیررسمی
    gloss: چطور استی؟ (غیررسمی)
    note: با *tum* فعل *ho* است، نه *hain*؛ *Aap kaise/kaisi hain?*ی رسمی را با *Tum kaise ho?*ی غیررسمی مقایسه کنید. این بهترین جفت برای شنیدن فرق آپ و تم در خود فعل است.
  hi.a1.unit01.lesson01.teach.main_theek_hoon:
    title: یک پاسخ معمول
    gloss: خوب هستم، تشکر.
    note: '*Theek* («خوب/درست») با جنسیت و سطح احترام تغییر نمی‌کند؛ برخلاف *kaise/kaisi*، همیشه یک شکل دارد، چه کسی صحبت کند و چه کسی مخاطب باشد.'
  hi.a1.unit01.lesson01.teach.aur_aap:
    title: برگرداندن پرسش رسمی
    gloss: شما چطور؟ (رسمی)
    note: راه کوتاه برای برگرداندن سوال به طرف مقابل در سطح محترمانهٔ آپ.
  hi.a1.unit01.lesson01.teach.aur_tum:
    title: برگرداندن پرسش غیررسمی
    gloss: تو چطور؟ (غیررسمی)
    note: از تم استفاده کنید تا سوال را به دوست یا هم‌سن خود برگردانید.
  hi.a1.unit01.lesson02.teach.namaste:
    title: سلام همه‌منظوره
    gloss: سلام؛ (برای خداحافظی هم استفاده می‌شود)
    note: '*Namaste* در هر وقت روز، در جاهای رسمی و غیررسمی، و هم برای شروع و هم برای ختم صحبت کار می‌رود؛ یعنی واقعاً همه‌منظوره است. در دری برای سلام و خداحافظی کلمه‌های جداگانه داریم.'
    example_gloss: سلام! حال شما چطور است؟
  hi.a1.unit01.lesson02.teach.namaskar:
    title: سلام محترمانه
    gloss: سلام (رسمی‌تر و محترمانه‌تر از نمسته)
    note: '*Namaskar* تقریباً همان معنای *namaste* را دارد، ولی لحن رسمی‌تر و محترمانه‌تر دارد؛ برای شخص بزرگ‌تر، جمع بزرگ یا محیط کاری مناسب است.'
    example_gloss: سلام! و شما؟
  hi.a1.unit01.lesson02.teach.phir_milenge:
    title: باز می‌بینیم (آینده)
    gloss: باز همدیگر را می‌بینیم؛ بعداً می‌بینیم
    note: 'معنای تحت‌اللفظی: «باز می‌بینیم» — راه معمول و عادی خداحافظی وقتی انتظار دارید آن شخص را دوباره ببینین.'
  hi.a1.unit01.lesson02.teach.alvida:
    title: خداحافظی رسمی
    gloss: خداحافظ؛ وداع
    note: '*Alvida* کلمهٔ درست هندی برای خداحافظی است، ولی در استفادهٔ روزمره نسبت به *namaste* یا *phir milenge* لحن نهایی‌تر، رسمی‌تر و کمی دراماتیک‌تر دارد؛ به «وداع» نزدیک‌تر است تا «خداحافظ» ساده.'
    example_gloss: خداحافظ! باز می‌بینیم.
  hi.a1.unit01.lesson02.teach.phir_milte_hain:
    title: باز می‌بینیم (غیررسمی/عادتی)
    gloss: باز می‌بینیم؛ همدیگر را می‌بینیم
    note: 'معنای تحت‌اللفظی: «باز می‌بینیم»، با شکل فعل استمراری/عادتی به‌جای آینده — کمی غیررسمی‌تر و روزمره‌تر از *phir milenge*.'
  hi.a1.unit01.lesson02.teach.shubh_ratri:
    title: شب بخیر
    gloss: شب بخیر
    note: وقتی کسی برای شب می‌رود یا می‌خوابد گفته می‌شود؛ مثل «شب بخیر» در دری، این یک خداحافظی است و هیچ‌وقت سلام آغازین نیست، برخلاف *namaste*.
  hi.a1.unit01.lesson02.teach.shubh_din:
    title: دعای محترمانهٔ ختم دیدار
    gloss: روز خوبی داشته باشین.
    note: 'معنای تحت‌اللفظی: «روز شما خوب بماند» — آرزوی مؤدبانهٔ پایان صحبت، هم در رابطهٔ رسمی و هم غیررسمی مناسب است.'
  hi.a1.unit01.lesson03.teach.aapka_naam_kya_hai:
    title: پرسیدن نام، به شکل رسمی
    gloss: نام شما چیست؟ (رسمی)
    note: '*Aapka* («شما/تان») با اسم مذکر *naam* («نام») هماهنگ می‌شود؛ ضمیرهای ملکی هندی با چیزِ دارایی‌شده هماهنگ می‌شوند، نه با مالک. در دری چنین تغییری وجود ندارد.'
  hi.a1.unit01.lesson03.teach.tumhara_naam_kya_hai:
    title: پرسیدن نام، غیررسمی
    gloss: نام تو چیست؟ (غیررسمی)
    note: همان الگو با *tumhara* («تو/ت»، غیررسمی) به‌جای *aapka*. *Aapka naam kya hai?*ی رسمی را با *Tumhara naam kya hai?*ی غیررسمی مقایسه کنید.
  hi.a1.unit01.lesson03.teach.mera_naam_priya_hai:
    title: گفتن نام خود
    gloss: نام من پریا است.
    note: '*Mera* («من/م») هم چون *naam* مذکر است با آن هماهنگ می‌شود؛ توجه کنید که ختم مذکر آن مثل *aapka*/*tumhara* بالا است، زیرا هر سه یک اسم را توضیح می‌دهند.'
  hi.a1.unit01.lesson03.teach.aapse_milkar_khushi_hui:
    title: ابراز خوشحالی از آشنایی، رسمی
    gloss: از آشنایی با شما خوشحال شدم. (رسمی)
    note: 'معنای تحت‌اللفظی: «با دیدن شما، خوشی شد» — عبارت ثابت و پرکاربرد برای اولین دیدار محترمانه.'
  hi.a1.unit01.lesson03.teach.mujhe_bhi:
    title: برگرداندن همان احساس
    gloss: من هم.
    note: جواب کوتاه و طبیعی به Aapse milkar khushi hui یا Tumse milkar accha laga.
  hi.a1.unit01.lesson03.teach.aap_kahan_se_hain:
    title: پرسیدن اصلیت، رسمی
    gloss: شما از کجا استید؟ (رسمی)
    note: Kahan یعنی «کجا»؛ se یعنی «از».
  hi.a1.unit01.lesson03.teach.main_bharat_se_hoon:
    title: گفتن اصلیت خود
    gloss: من از هند هستم.
    note: Bharat نام هندی کشور هند است و در صحبت روزمره زیاد استفاده می‌شود.
  hi.a1.unit01.lesson03.teach.tum_kahan_se_ho:
    title: پرسیدن اصلیت، به شکل غیررسمی
    gloss: تو از کجا استی؟ (غیررسمی)
    note: همان سوال با *tum* و *ho* به‌جای *aap* و *hain* — همان الگوی ختم فعل رسمی/غیررسمی که در سراسر این بخش دیدید.
  hi.a1.unit01.lesson03.teach.dialogue.line01:
    title: شروع دیدار
    gloss: پریا به ارجن سلام می‌کند و می‌پرسد که این اولین بارش در اینجا است.
    note: هر دو گوینده از اول سطح غیررسمی *tum* را به‌کار می‌برند — برای دو هم‌سن که در یک صنف محلی با هم آشنا می‌شوند طبیعی است. *Tumhari* («تو/ت») با اسم مؤنث *baar* («بار/دفعه») هماهنگ است، نه با جنسیت یکی از گوینده‌ها.
  hi.a1.unit01.lesson03.teach.dialogue.line02:
    title: شروع دیدار، جواب
    gloss: ارجن می‌گوید بلی، اولین بارش است و می‌خواهد یوگا یاد بگیرد.
    note: '*Chahta hoon* («می‌خواهم») اینجا شکل مذکر دارد چون ارجن، گوینده، مرد است؛ این فعل با جنسیت گوینده هماهنگ می‌شود، برخلاف *kaisi*/*kaise* که با جنسیت مخاطب هماهنگ بود.'
  hi.a1.unit01.lesson03.teach.dialogue.line03:
    title: معرفی نام
    gloss: پریا می‌گوید «من هم!»، نامش را می‌گوید و نام ارجن را می‌پرسد.
    note: '*Main bhi!* («من هم!») جواب جملهٔ ارجن *main ... chahta hoon* است: وقتی فاعل جملهٔ طرف مقابل *main* باشد، «من هم» *main bhi* می‌شود. *Mujhe bhi* جواب جمله‌ای از نوع *mujhe* است، مثل *Tumse milkar accha laga*. *Mera naam...hai* راه طبیعی و ساده برای گفتن نام است.'
  hi.a1.unit01.lesson03.teach.dialogue.line04:
    title: معرفی نام، جواب
    gloss: ارجن نامش را می‌گوید و به شکل غیررسمی می‌گوید از آشنایی با او خوشحال شده است.
    note: '*Tumse milkar accha laga* همتای غیررسمی *Aapse milkar khushi hui*ی رسمی این درس است؛ هر دو تقریباً «از آشنایی خوشحال شدم» معنا می‌دهند و با سطح احترام هماهنگ‌اند.'
  hi.a1.unit01.lesson03.teach.dialogue.line05:
    title: پرسیدن دربارهٔ اصلیت
    gloss: پریا همین احساس را پس می‌دهد و می‌پرسد ارجن از کجا است.
    note: Tum kahan se ho با همان سطح غیررسمی که یاد گرفتیم دربارهٔ اصلیت می‌پرسد.
  hi.a1.unit01.lesson03.teach.dialogue.line06:
    title: پرسیدن دربارهٔ اصلیت، جواب
    gloss: ارجن از هند است ولی فعلاً در لندن زندگی می‌کند، بعد همان سوال را پس می‌پرسد.
    note: '*Rahta hoon* («زندگی می‌کنم») مذکر است و با ارجن به‌حیث گوینده هماهنگ می‌شود — همان الگوی *chahta hoon* در خط دوم. *Lekin* («ولی») تضاد میان اصلیت و محل فعلی زندگی را وصل می‌کند.'
  hi.a1.unit01.lesson03.teach.dialogue.line07:
    title: صحبت دربارهٔ اصلیت و یک علاقه
    gloss: پریا می‌گوید از امریکا است و او هم می‌خواهد یوگا یاد بگیرد.
    note: '*Chahti hoon* شکل مؤنث همان فعلی است که ارجن در خط دوم گفت (*chahta hoon*) — توجه کنید که هر دو با جنسیت گوینده خودشان هماهنگ‌اند و یک جفت مقایسه‌ای مستقیم می‌سازند.'
  hi.a1.unit01.lesson03.teach.dialogue.line08:
    title: پرسیدن دربارهٔ فعالیت مشترک
    gloss: ارجن با خوشی واکنش نشان می‌دهد و می‌پرسد پریا یوگا می‌کند یا نه.
    note: '*Karti ho* («می‌کنی») مؤنث است و با پریا به‌حیث کسی که از او پرسیده می‌شود هماهنگ است — مثل *kaisi* پیش‌تر، این شکل فعل جنسیت مخاطب را دنبال می‌کند، نه گوینده را.'
  hi.a1.unit01.lesson03.teach.dialogue.line09:
    title: پرسیدن دربارهٔ فعالیت مشترک، جواب
    gloss: پریا می‌گوید نه، اولین بارش است و هنوز یاد می‌گیرد.
    note: '*Seekh rahi hoon* («یاد می‌گیرم») شکل مؤنث استمراری است و با پریا به‌حیث گوینده هماهنگ می‌شود — همتای حال استمراری *chahti hoon*.'
  hi.a1.unit01.lesson03.teach.dialogue.line10:
    title: ختم صحبت
    gloss: ارجن موافقت می‌کند که شروع کنند، بعد می‌گوید باز می‌بینیم.
    note: '*Chalo shuru karte hain* («بیایین شروع کنیم») راه ثابت و طبیعی برای پیشنهاد شروع کاری با هم است. *Phir milte hain* گفتگو را با خداحافظی غیررسمی که در درس دوم یاد گرفتیم ختم می‌کند.'
exercises:
  hi.a1.unit01.lesson01.exercise01.select_aap:
    instruction: کدام کلمه شکل رسمی و محترمانهٔ «شما» است؟
    correct_option: आप
    distractors:
    - तुम
    - और
    accepted_answers:
    - आप
    feedback: آپ با کسی استفاده می‌شود که بزرگ‌تر است، آشنا نیست یا رابطهٔ محترمانه دارید.
  hi.a1.unit01.lesson01.exercise02.select_tum:
    instruction: کدام کلمه یک دوست یا همسال را غیررسمی خطاب می‌کند؟
    correct_option: तुम
    distractors:
    - आप
    - और
    accepted_answers:
    - तुम
    feedback: تم با دوستان، هم‌سن‌ها و رابطه‌های غیررسمی ولی محترمانه استفاده می‌شود.
  hi.a1.unit01.lesson01.exercise03.select_aap_kaisi_hain_meaning:
    instruction: این سوال چه می‌پرسد و خطاب به کیست؟
    correct_option: حال شما چطور است؟ (رسمی، از یک خانم)
    distractors:
    - حال شما چطور است؟ (رسمی، از یک مرد)
    - و شما؟
    accepted_answers:
    - حال شما چطور است؟ (رسمی، از یک خانم)
    feedback: Kaisi با مخاطب خانم هماهنگ است؛ kaise برای مرد استفاده می‌شود.
  hi.a1.unit01.lesson01.exercise04.order_aap_kaise_hain:
    instruction: پرسش رسمی احوال (به مرد) را به ترتیب درست بگذارین.
    correct_response:
    - आप
    - कैसे
    - हैं
  hi.a1.unit01.lesson01.exercise05.order_tum_kaise_ho:
    instruction: پرسش غیررسمی احوال را به ترتیب درست بگذارین.
    correct_response:
    - तुम
    - कैसे
    - हो
  hi.a1.unit01.lesson01.exercise06.return_formal:
