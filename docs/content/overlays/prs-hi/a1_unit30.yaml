teaching:
  hi.a1.unit30.lesson01.teach.parhna_kasrat_karna:
    title: خواندن، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'در هندی سرگرمی‌ها با فعلی که به *-ना* ختم می‌شود گفته می‌شوند: *पढ़ना*، *कसरत करना* و *खाना बनाना* («خواندن»، «ورزش کردن»، «آشپزی کردن»).'
    example_gloss:
    - کتاب خواندن را دوست دارم.
    - روزهای شنبه ورزش می‌کنم.
    - آشپزی برای دوستان را دوست دارم.
  hi.a1.unit30.lesson01.teach.khalee_samay:
    title: وقت آزاد
    gloss: وقت آزاد
    note: '*खाली समय* («وقت خالی») عبارت اصلی برای صحبت دربارهٔ سرگرمی‌هاست، و *में* معنای «در» را می‌دهد: *खाली समय में*.'
    example_gloss: در وقت آزادم کتاب خواندن را دوست دارم.
  hi.a1.unit30.lesson01.teach.mujhe_khalee_samay:
    title: گفتن اینکه در وقت آزاد چه می‌کنین
    gloss: در وقت آزادم کتاب خواندن را دوست دارم.
    note: '*मुझे ... पढ़ना पसंद है* («برای من خواندن پسندیده است») روش هندی برای گفتن «من خواندن را دوست دارم» است؛ *मुझे* نشان می‌دهد چه کسی دوست دارد.'
  hi.a1.unit30.lesson02.teach.sangeet_sunna_chitr:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه سرگرمی دیگر: *संगीत सुनना*، *चित्र बनाना* و *गेम खेलना*؛ *गेम* واژهٔ قرضی از زبان دیگر است.'
    example_gloss:
    - دوست دارم موسیقی گوش کنم.
    - من اکثراً نقاشی می‌کنم.
    - دوست دارم با دوستانم ویدیوگیم بازی کنم.
  hi.a1.unit30.lesson02.teach.mujhe_sangeet_sunna:
    title: گفتن اینکه موسیقی گوش کردن را دوست دارید
    gloss: دوست دارم موسیقی گوش کنم.
    note: '*संगीत सुनना* («موسیقی شنیدن») به واژهٔ اضافه نیاز ندارد: مفعول مستقیم پیش از فعل می‌آید.'
  hi.a1.unit30.lesson02.teach.mujhe_doston_ke:
    title: گفتن اینکه با دوستان ویدیوگیم بازی کردن را دوست دارید
    gloss: دوست دارم با دوستانم ویدیوگیم بازی کنم.
    note: '*दोस्तों के साथ* («با دوستان») *दोस्त* را به شکل جمع غیرمستقیم (*दोस्तों*) می‌آورد، چون پیش از *के साथ* آمده است.'
  hi.a1.unit30.lesson03.teach.hamesha_aksar_kabheekbhee:
    title: همیشه، اکثراً، گاهی، هرگز
    gloss: همیشه، اکثراً، گاهی، هرگز
    note: واژه‌های تکرار مثل *हमेशा*، *अक्सर*، *कभी-कभी* و *कभी नहीं* معمولاً پیش از فعل می‌آیند، و *कभी नहीं* یعنی «هرگز».
    example_gloss:
    - من همیشه روزهای شنبه ورزش می‌کنم.
    - من اکثراً کتاب می‌خوانم.
    - من گاهی نقاشی می‌کنم.
    - من هرگز ویدیوگیم بازی نمی‌کنم.
  hi.a1.unit30.lesson03.teach.har_hafte_har:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*हर* («هر») هیچ‌وقت تغییر نمی‌کند، و واژهٔ زمان بعد از آن ساده می‌ماند: *हर हफ़्ते*، *हर वीकेंड*.'
    example_gloss:
    - من هر هفته برای دوستانم آشپزی می‌کنم.
    - من هر آخر هفته ورزش می‌کنم.
  hi.a1.unit30.lesson03.teach.har_hafte_har_2:
    title: हर تغییر نمی‌کند
    gloss: هر هفته، هر آخر هفته.
    note: '*हर* با هر اسمی که بعدش بیاید همان می‌ماند، پس شکلی برای انتخاب وجود ندارد: *हर हफ़्ते*، *हर वीकेंड*.'
  hi.a1.unit30.lesson03.teach.tum_khalee_samay:
    title: پرسیدن دربارهٔ وقت آزاد
    gloss: در وقت آزادت چه می‌کنی؟
    note: این سؤال اصلی این واحد است؛ با آن می‌توانین از هر کسی دربارهٔ سرگرمی‌هایش بپرسین.
  hi.a1.unit30.lesson04.teach.priya_ham_aksar:
    title: پریا از سرگرمی‌ها صحبت می‌کند
    gloss: 'پریا: ما اکثراً با هم قدم می‌زنیم. ولی ارجون، تو در وقت فراغت دیگر چه می‌کنی؟'
    note: '*टहलते हैं* جمع است چون فاعل *हम* («ما») است، و *अक्सर* پیش از فعل می‌آید.'
  hi.a1.unit30.lesson04.teach.arjun_mujhe_khana:
    title: سرگرمی‌های ارجون
    gloss: 'ارجون: من آشپزی را دوست دارم، در خانه هم. و اکثراً ورزش می‌کنم.'
    note: '*घर पर भी* («در خانه هم») نشان می‌دهد که ارجون برای تفریح آشپزی می‌کند، نه فقط در کار.'
  hi.a1.unit30.lesson04.teach.priya_tum_ghar:
    title: پریا تعجب می‌کند
    gloss: 'پریا: در خانه هم آشپزی می‌کنی؟ تو که تمام روز در کارت آشپزی می‌کنی!'
    note: '*पूरा दिन* («تمام روز») تأکید می‌کند که او در کار هم خیلی آشپزی می‌کند، و *तो* تأکید اضافه می‌کند.'
  hi.a1.unit30.lesson04.teach.arjun_han_lekin:
    title: ارجون توضیح می‌دهد
    gloss: 'ارجون: بلی، ولی آشپزی کردن به من آرامش می‌دهد. و تو، چه کاری را دوست داری؟'
    note: '*खाना बनाने से सुकून मिलता है* یعنی «آشپزی کردن به من آرامش می‌دهد» (لفظاً: «از آشپزی آرامش به دست می‌آید»)؛ *बनाना* پیش از *से* به *बनाने* تبدیل می‌شود.'
  hi.a1.unit30.lesson04.teach.priya_mujhe_parhna:
    title: سرگرمی‌های پریا
    gloss: 'پریا: من خواندن را دوست دارم و اکثراً موسیقی گوش می‌کنم.'
    note: '*और* («و») دو سرگرمی را وصل می‌کند، و *सुनती हूँ* مؤنث است چون پریا صحبت می‌کند.'
  hi.a1.unit30.lesson04.teach.arjun_kya_tum:
    title: ارجون دربارهٔ گیم پرسان می‌کند
    gloss: 'ارجون: آیا تو گیم هم بازی می‌کنی؟'
    note: 'یک سوال کوتاه بلی/نخیر: با *क्या* شروع می‌شود، و *खेलती हो* مؤنث است چون ارجون از پریا می‌پرسد.'
  hi.a1.unit30.lesson04.teach.priya_naheen_main:
    title: پریا جواب می‌دهد
    gloss: 'پریا: نخیر، من هرگز گیم بازی نمی‌کنم. ولی گاهی نقاشی می‌کشم!'
    note: '*कभी ... नहीं* («هرگز») و *कभी-कभी* («گاهی») در یک جواب در مقابل هم آمده‌اند.'
  hi.a1.unit30.lesson05.teach.arjun_aur_main:
    title: مقایسهٔ سرگرمی‌ها
    gloss: ارجون و من اکثراً با هم قدم می‌زنیم. ولی سرگرمی‌های دیگر هم داریم. ارجون آشپزی را دوست دارد، در خانه هم، و اکثراً ورزش می‌کند. من خواندن را دوست دارم و اکثراً موسیقی گوش می‌کنم. گاهی نقاشی می‌کشم، ولی هرگز گیم بازی نمی‌کنم. تو در وقت فراغت چه کاری را دوست داری؟
    note: پیام پریا واقعیت‌های درس‌های پیشین را خلاصه می‌کند و با سوال اصلی این بخش از خواننده تمام می‌شود.
    glosses:
      टहलते: قدم می‌زنیم
      अक्सर: اکثراً
      साथ: با هم
      और: دیگر
      बनाना: ساختن (آشپزی)
      पसंद: دوست دارد
      घर: در خانه
      कसरत: ورزش می‌کند
      पढ़ना: خواندن
      सुनती: گوش می‌کنم
      संगीत: موسیقی
      चित्र: تصویر (نقاشی)
      कभी-कभी: گاهی
      गेम: ویدیوگیم بازی می‌کنی
      कभी: هرگز (با नहीं)
      खाली: آزاد
      समय: وقت
  hi.a1.unit30.lesson06.teach.arjun_tum_is:
    title: ارجون دربارهٔ آخر هفته می‌پرسد
    gloss: 'ارجون: این آخر هفته چه می‌کنی؟'
    note: '*इस वीकेंड* («این آخر هفته») *इस* را پیش از اسم می‌آورد، و *कर रही हो* شکل استمراری «می‌کنی» است، مؤنث چون پریا مخاطب است.'
  hi.a1.unit30.lesson06.teach.priya_abhee_pata:
    title: پریا هنوز تصمیم نگرفته
    gloss: 'پریا: هنوز نمی‌دانم. خواندن را دوست دارم، ولی می‌خواهم بیرون هم بروم.'
    note: '*बाहर जाना चाहती हूँ* یعنی «می‌خواهم بیرون بروم»؛ *चाहती* مؤنث است و بعد از *जाना* می‌آید.'
  hi.a1.unit30.lesson06.teach.arjun_chalo_sath:
    title: ارجون یک برنامه پیشنهاد می‌کند
    gloss: 'ارجون: بیا با هم قدم بزنیم؟ بعدش من برای ما آشپزی می‌کنم.'
    note: '*उसके बाद* («بعد از آن») دو برنامه را به ترتیب می‌آورد، و *चलो ... टहलें* اولی را پیشنهاد می‌کند.'
  hi.a1.unit30.lesson06.teach.priya_achchha_aidiya:
    title: پریا موافقت می‌کند
    gloss: 'پریا: فکر خوبی است! من هم قدم زدن را دوست دارم هم آشپزی را.'
    note: '*दोनों पसंद हैं* نشان می‌دهد که پریا هر دو را به یک اندازه دوست دارد، و فعل جمع *हैं* است.'
  hi.a1.unit30.lesson06.teach.arjun_barhiya_to:
    title: ارجون تأیید می‌کند
    gloss: 'ارجون: عالی. پس روز شنبه می‌بینیم!'
    note: '*शनिवार को मिलते हैं* («روز شنبه همدیگر را می‌بینیم») برای یک برنامهٔ قطعی زمان حال را به کار می‌برد، و *को* روز را نشان می‌دهد.'
