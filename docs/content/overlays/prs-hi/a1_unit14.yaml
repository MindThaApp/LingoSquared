answer_policy:
  se_comparative: This unit's central grammar point is से + adjective = "than" (X, Y से ADJ है = "X is more ADJ than Y"). A typed answer that drops से entirely from a comparative sentence, or substitutes a different postposition, should be marked incorrect -- this is the exact point being tested.
  subject_agreement: The comparative adjective (बड़ा/बड़ी, छोटा/छोटी, सस्ता/सस्ती, महंगा/महंगी, नया/नई) always agrees with the SENTENCE'S SUBJECT, never the से-marked compared item -- e.g. "प्रिया अर्जुन से छोटी है" uses छोटी because प्रिया (feminine) is the subject, regardless of अर्जुन's gender. A typed answer using the wrong gender for the actual subject should be marked incorrect as a real structural error, not tolerated as a minor typo.
  zyada_intensifier: ज़्यादा placed directly before the adjective in a comparative sentence ("X, Y से ज़्यादा ADJ है") just makes "more" explicit (same meaning, not "even more") and is never grammatically REQUIRED -- से + adjective alone is already a complete, correct comparative. Accept both the plain and the ज़्यादा form as equally correct for any open-ended "compare these two things" prompt (e.g. writing_prompt/speak_response), unless the exercise specifically targets the ज़्यादा form.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's one new nasalized word pair, लंबा/लंबी, uses anusvara, verified against a direct codepoint check -- consistent with the already-established हैं/मुझे/तुम्हें/पसंद/संगीत convention. नया/नई carry no nasalization at all. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to state their own comparison, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
