teaching:
  hi.a1.unit14.lesson01.teach.arjun_priya_review:
    title: 'مرور: ارجن، پریا، است'
    gloss: ارجن، پریا، است
    note: مرور کوتاهِ نام‌های دو شخصیت و فعل ربطی 'hai' که برای ساختن جمله‌های مقایسه‌ای این یونیت لازم است.
    example_gloss:
    - ارجن خوب است.
    - پریا خوب است.
  hi.a1.unit14.lesson01.teach.bada_badi_review:
    title: 'مرور: کلان / بزرگ‌تر'
    gloss: کلان / بزرگ‌تر (مذکر / مؤنث)
    note: اول در یونیت ۵ برای سن برادر و خواهر یاد گرفته شد -- این یونیت آن را برای مقایسهٔ مستقیم هر دو شخص یا هر دو چیز گسترش می‌دهد.
    example_gloss:
    - برادر کلانم در دهلی زندگی می‌کند.
    - خواهر کلانم در دهلی زندگی می‌کند.
  hi.a1.unit14.lesson01.teach.chota_choti_review:
    title: 'مرور: خُرد / کوچک‌تر'
    gloss: خُرد / کوچک‌تر (مذکر / مؤنث)
    note: اول در یونیت ۵ برای سن برادر و خواهر یاد گرفته شد -- در اینجا به همان شکلِ bada/badi به کار می‌رود.
    example_gloss:
    - برادر خُردم حالا شاگرد است.
    - خواهر خُردم حالا شاگرد است.
  hi.a1.unit14.lesson01.teach.se_comparative_grammar:
    title: Se = از (در مقایسه)
    gloss: '''Se'' قبلاً به معنی «از» (یونیت ۹، ''yahan se seedhe jao'') و به معنی «با» (یونیت ۱۲، ''Priya se mila'') یاد گرفته شد. حالا برای مقایسه هم می‌آید: ''X, Y se ADJ hai'' یعنی «X از Y ADJ‌تر است» -- مثل ''Priya Arjun se badi hai''.'
    note: معنای سومِ کلمه‌ای که قبلاً یاد گرفته شده معرفی می‌شود، و پیش از معنای تازه، هر دو معنای قبلی با شمارهٔ یونیت یادآوری می‌شوند.
    target_text: '''से'' पहले ''यहाँ से सीधे जाओ'' (यूनिट 9, matlab ''from'') और ''प्रिया से मिला'' (यूनिट 12, matlab ''«with»'') में सीखा था; अब यह तुलना के लिए भी आता है: ''X, Y से ADJ है'' का मतलब है ''«X is more ADJ than Y»'' -- जैसे ''प्रिया अर्जुन से बड़ी है''।'
  hi.a1.unit14.lesson01.teach.arjun_bada_phrase:
    title: پریا از ارجن کلان‌تر است.
    gloss: پریا از ارجن کلان‌تر است.
    note: نخستین مثال کامل الگوی مقایسه با se در این یونیت.
  hi.a1.unit14.lesson01.teach.lamba_lambi:
    title: قدبلند / دراز
    gloss: قدبلند / دراز (مذکر / مؤنث)
    note: یک جفت صفت تازه که از الگوی مطابقت -a/-i برای مذکر و مؤنث پیروی می‌کند (bada/badi, chota/choti).
    example_gloss:
    - برادرم قدبلند است.
    - خواهرم قدبلند است.
  hi.a1.unit14.lesson01.teach.agreement_grammar:
    title: صفت با فاعل مطابقت می‌کند
    gloss: در جملهٔ مقایسه‌ای، صفت (مثل bada/badi، chota/choti) همیشه با جنسیت فاعل مطابقت می‌کند، نه با کلمهٔ بعد از 'se' -- مثلاً در 'Arjun Priya se chota hai'، 'chota' با Arjun (فاعل مذکر) مطابقت می‌کند، نه با Priya.
    note: توسعهٔ مستقیم و صریح الگوی مطابقت صفت‌های -a/-i که قبلاً یاد گرفته شد، این بار مخصوص جمله‌های مقایسه‌ای.
    target_text: तुलना के वाक्य में विशेषण (जैसे बड़ा/बड़ी, छोटा/छोटी) हमेशा विषय (subject) के लिंग से मेल खाता है, 'से' के बाद वाले शब्द के नहीं -- जैसे 'अर्जुन प्रिया से छोटा है' में 'छोटा' अर्जुन (पुल्लिंग विषय) से मेल खाता है, प्रिया से नहीं।
  hi.a1.unit14.lesson01.teach.priya_chota_phrase:
    title: ارجن از پریا خُردتر است.
    gloss: ارجن از پریا خُردتر است.
    note: بیان مکمل همان واقعیت از طرف دیگر -- مطابقت صفت با فاعل مذکر را نشان می‌دهد.
  hi.a1.unit14.lesson01.teach.kaun_ya_review:
    title: 'مرور: کی، یا'
    gloss: کی، یا
    note: هر دو قبلاً یاد گرفته شده‌اند (یونیت ۵ و یونیت ۶/۱۳) -- در اینجا برای پرسیدن یک سوال مقایسه‌ای دوباره به کار می‌روند.
    example_gloss: کی کلان‌تر است، ارجن یا پریا؟
  hi.a1.unit14.lesson02.teach.topi_bag_review:
    title: 'مرور: کلاه، کیف'
    gloss: کلاه، کیف
    note: هر دو اسم اول در یونیت خریداری (یونیت ۷) یاد گرفته شدند -- در اینجا به حیث دو چیزی که مقایسه می‌شوند به کار می‌روند.
    example_gloss:
    - این کلاه قشنگ است.
    - این کیف قشنگ است.
  hi.a1.unit14.lesson02.teach.sasta_mehnga_review:
    title: 'مرور: ارزان، گران'
    gloss: ارزان، گران
    note: اول در یونیت ۷ یاد گرفته شد -- در اینجا برای مقایسهٔ چیزها دوباره به کار می‌رود.
    example_gloss:
    - کیف ارزان است.
    - کیف گران است.
  hi.a1.unit14.lesson02.teach.sasti_mehngi_note:
    title: 'شکل‌های مؤنث: sasti، mehngi'
    gloss: '''Sasta'' و ''mehnga'' با کلمه‌های مؤنث به ''sasti'' و ''mehngi'' تبدیل می‌شوند -- مثل ''topi sasti hai'' (کلاه ارزان است).'
    note: یادآوری کوتاه قاعدهٔ مطابقت جنسیت یونیت ۷، چون 'topi' (کلاه) مؤنث است.
  hi.a1.unit14.lesson02.teach.se_object_phrase:
    title: کلاه از کیف ارزان‌تر است.
    gloss: کلاه از کیف ارزان‌تر است.
    note: الگوی مقایسه با se این بار برای دو چیز به کار رفته، نه دو شخص.
  hi.a1.unit14.lesson02.teach.zyada_review:
    title: 'مرور: بیشتر'
    gloss: بیشتر
    note: اول در یونیت ۱۳ فقط با 'pasand hai' (برای بیان ترجیح) یاد گرفته شد -- این درس کاربرد آن را گسترش می‌دهد.
    example_gloss: من چای را بیشتر دوست دارم.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_grammar:
    title: Zyada در هر مقایسه
    gloss: '''Zyada'' قبلاً فقط با ''pasand hai'' یاد گرفته شده بود (یونیت ۱۳). حالا در مقایسه می‌تواند پیش از هر صفتی هم بیاید -- ''bag topi se zyada mehnga hai'' یعنی «کیف از کلاه گران‌تر است»، دقیقاً مثل ''bag topi se mehnga hai''. ''Zyada'' لازم نیست؛ فقط «بیشتر» را آشکارا می‌گوید.'
    note: تعمیم یک قاعدهٔ جایگاه کلمه که قبلاً آموخته شده؛ نکتهٔ دستوری تازه نیست.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_phrase:
    title: کیف از کلاه گران‌تر است.
    gloss: کیف از کلاه گران‌تر است.
    note: همان الگوی مقایسه با se، این بار با zyada (بیشتر) که اختیاری است.
  hi.a1.unit14.lesson02.teach.naya_nai:
    title: نو
    gloss: نو (مذکر / مؤنث)
    note: یک جوڑ صفت تازه که از همان الگوی -a/-i مثل بقیهٔ صفت‌های این بخش پیروی می‌کند.
    example_gloss:
    - کیف نو است.
    - کلاه نو است.
  hi.a1.unit14.lesson02.teach.topi_nai_phrase:
    title: کلاه از کیف نوتر است.
    gloss: کلاه از کیف نوتر است.
    note: دومین صفت مقایسه‌یی (نو بودن) بین همان دو چیز، مطابق مقایسهٔ قیمت که قبلاً آمد.
  hi.a1.unit14.lesson03.teach.review_words:
    title: 'مرور: کلان، خورد، قدبلند، نو'
    gloss: کلان/بزرگ‌تر، خورد/کوچک‌تر، قدبلند/دراز، نو
    note: مرور سریع صفت‌های مهم این بخش که برای گفتگو و یادداشت لازم است.
    example_gloss:
    - پریا کلان‌تر است.
    - ارجن خوردتر است.
    - ارجن قدبلند است.
    - کیف نو است.
  hi.a1.unit14.lesson03.teach.main_hun_review:
    title: 'مرور: من، هستم'
    gloss: من، هستم
    note: در بخش اول آموخته شد ('main theek hun') -- لازم است تا ارجن در گفتگو دربارهٔ خودش صحبت کند.
    example_gloss: من خوب هستم.
  hi.a1.unit14.lesson03.teach.aur_bhi_review:
    title: 'مرور: و، هم'
    gloss: و، هم
    note: هر دو کلمه در متن‌های گفتگوی قبلی آمده بودند، ولی اینجا بار اول به‌عنوان لغت قابل امتحان معرفی می‌شوند.
    example_gloss:
    - من چای و قهوه را دوست دارم.
    - من آن را هم دوست دارم.
  hi.a1.unit14.lesson03.teach.ka_review:
    title: 'مرور: نشانهٔ مالکیت'
    gloss: نشانهٔ مالکیت (مثل «ـِ» در کیفِ ارجن)
    note: نشانهٔ مالکیت که در سراسر کورس (مثلاً بخش‌های ۵ تا ۱۱) به کار رفته -- اینجا برای گفتن اینکه کیف کی مقایسه می‌شود دوباره استفاده می‌شود.
    example_gloss: کیف ارجن نو است.
  hi.a1.unit14.lesson03.teach.dialogue.line01:
    title: ارجن کیف نوی خود را نشان می‌دهد
    gloss: پریا، این کیف نوی من است.
  hi.a1.unit14.lesson03.teach.dialogue.line02:
    title: پریا می‌گوید کلاه ارزان‌تر است
    gloss: کیف خوبی است! ولی کلاه از کیف ارزان‌تر است.
  hi.a1.unit14.lesson03.teach.dialogue.line03:
    title: ارجن موافقت می‌کند که کیفش گران است
    gloss: بلی. کیف من گران است -- از کلاه گران‌تر است.
  hi.a1.unit14.lesson03.teach.dialogue.line04:
    title: پریا می‌پرسد کی کلان‌تر است
    gloss: خوب، خوب! ارجن، کی کلان‌تر است، تو یا من؟
  hi.a1.unit14.lesson03.teach.dialogue.line05:
    title: ارجن جواب می‌دهد
    gloss: تو کلان‌تری، ولی من قدبلندم!
  hi.a1.unit14.lesson03.teach.dialogue.line06:
    title: پریا می‌گوید کلاه نوتر هم است
    gloss: خوب، خوب! ولی کلاه از کیف نوتر هم است.
  hi.a1.unit14.lesson03.teach.dialogue.line07:
    title: ارجن موافقت می‌کند و گفتگو را ختم می‌کند
    gloss: بلی، درست است. فردا دوباره همدیگر را ببینیم؟
  hi.a1.unit14.lesson03.teach.dialogue.line08:
    title: پریا گفتگو را ختم می‌کند
    gloss: خوب! فردا می‌بینیم.
  hi.a1.unit14.lesson03.teach.grammar_summary:
    title: سه قاعدهٔ اصلی
    gloss: 'سه قاعدهٔ اصلی این بخش: (۱) ''X, Y se ADJ hai'' یعنی «X از Y ...تر است»؛ (۲) ADJ همیشه با جنسیت فاعل (X) مطابقت می‌کند، نه با Y؛ (۳) ''zyada'' را هم می‌توان پیش از ADJ آورد، مثل ''X, Y se zyada ADJ hai'' -- معنا همان می‌ماند («از Y ...تر»).'
    note: خلاصهٔ پایانی که دستور تمام این بخش را کنار هم می‌آورد، مثل نکتهٔ دستوری بخش ۱۳.
    target_text: 'इस यूनिट के तीन मुख्य नियम: (1) ''X, Y से ADJ है'' का मतलब है ''«X is more ADJ than Y»''; (2) ADJ हमेशा विषय (X) के लिंग से मेल खाता है, Y से नहीं; (3) ADJ से पहले ''ज़्यादा'' भी जोड़ सकते हैं, जैसे ''X, Y से ज़्यादा ADJ है'' -- मतलब वही रहता है (''more ADJ than'')।'
  hi.a1.unit14.lesson03.teach.priya_note:
    title: یادداشت پریا
    gloss: من از ارجن کلان‌ترم، ولی ارجن قدبلند است. و کلاه من خوب است -- کلاه از کیف ارزان‌تر است و کلاه از کیف نوتر هم است. - پریا
    note: یادداشت کوتاه نوشته‌شده که دقیقاً همان واقعیت‌های گفتگو را تکرار می‌کند، بدون ادعای تازه.
    glosses:
      बड़ी: کلان‌تر (مؤنث)
      लंबा: قدبلند
      टोपी: کلاه
      अच्छी: خوب (مؤنث)
      बैग: بیگ
      सस्ती: ارزان‌تر / ارزان (مؤنث)
      नई: نوتر / نو (مؤنث)
