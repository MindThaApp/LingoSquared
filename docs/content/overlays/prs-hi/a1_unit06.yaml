    title: من ... می‌خواهم
  hi.a1.unit06.lesson02.khana_aur_matra:
    title: خوراک و مقدار
  hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana:
    title: غذای پریا و ارجن
teaching:
  hi.a1.unit06.lesson01.teach.khana:
    title: غذا
    gloss: خوراک، غذا
    note: کلمه‌ی عمومی برای خوراک که در تمام این بخش به کار می‌رود.
    example_gloss: غذای من حالا آماده است.
  hi.a1.unit06.lesson01.teach.chai_coffee:
    title: چای، قهوه
    gloss: چای، قهوه
    note: دو نوشیدنی معمول که در تمام این بخش برای تمرین الگوی *mujhe ... chahiye* به کار می‌روند.
    example_gloss:
    - من چای می‌خواهم.
    - من قهوه می‌خواهم.
  hi.a1.unit06.lesson01.teach.pani_juice:
    title: آب، شیره
    gloss: آب، شیره
    note: دو نوشیدنی معمول دیگر؛ هماهنگی جنسیت لازم نیست چون *chahiye* تغییر نمی‌کند.
    example_gloss:
    - آب می‌خواستم.
    - من شیره می‌خواهم.
  hi.a1.unit06.lesson01.teach.chahiye_note:
    title: Mujhe ... chahiye
    gloss: '*Mujhe ... chahiye* یعنی «من ... می‌خواهم». با جنسیت گوینده تغییر نمی‌کند (برخلاف *chahta/chahti*) و بعدش هیچ‌وقت *hai* نمی‌آید.'
    note: نکته‌ی اصلی دستوری این بخش -- یک اشتباه بسیار معمول زبان‌آموزان این است که بعد از *chahiye* کلمه‌ی *hai* را اضافه می‌کنند، چون تقریباً همه‌ی جمله‌های دیگری که تا حالا یاد گرفته‌اند با آن تمام می‌شوند. *Chahiye* خودش یک گزاره‌ی کامل است.
  hi.a1.unit06.lesson01.teach.aapko_kya_chahiye:
    title: چه می‌خواهین؟ (رسمی)
    gloss: چه می‌خواهین؟
    note: پرسش رسمی با *aap*، که پیشخدمت یا میزبان برای خطاب محترمانه به کسی به کار می‌برد.
  hi.a1.unit06.lesson01.teach.tumhein_kya_chahiye:
    title: چه می‌خواهی؟ (غیررسمی)
    gloss: چه می‌خواهین؟
    note: ضمیر حالت «به» در سطح غیررسمی *tum*، موازی با *mujhe* و با *tumhara/tumhari* در بخش پنجم.
  hi.a1.unit06.lesson01.teach.chai_chahiye_shukriya:
    title: چای می‌خواهم، تشکر
    gloss: من چای می‌خواهم، تشکر.
    note: یک جواب مؤدبانه و طبیعی هنگام سفارش دادن، که *shukriya* را از بخش‌های قبلی دوباره به کار می‌برد.
  hi.a1.unit06.lesson01.teach.bahut:
    title: بسیار
    gloss: خیلی، بسیار
    note: یک کلمه‌ی معمول برای تأکید که در تمام این بخش برای توصیف غذا و نوشیدنی به کار می‌رود.
    example_gloss: این چای خیلی خوب است.
  hi.a1.unit06.lesson01.teach.swadisht:
    title: خوش‌مزه
    gloss: خوش‌مزه، لذیذ
    note: کلمه‌ی مفید برای واکنش به غذا -- نکته‌ی دستوری درس سوم همین بخش را ببین که چرا این کلمه با جنسیت تغییر نمی‌کند.
    example_gloss: این غذا خیلی خوش‌مزه است.
  hi.a1.unit06.lesson02.teach.roti_chawal:
    title: نان، برنج
    gloss: روتی (نان)، برنج
    note: دو خوراک اصلی در یک وعده‌ی غذایی روزمره‌ی هندی.
    example_gloss:
    - من نان می‌خواهم.
    - من برنج می‌خواهم.
  hi.a1.unit06.lesson02.teach.sabzi_daal:
    title: سبزی (خوراک)، دال
    gloss: سبزی (خوراک)، دال
    note: دو خوراک اصلی دیگر که معمولاً همراه روتی و برنج خورده می‌شوند.
    example_gloss:
    - من سبزی می‌خواهم.
    - من دال می‌خواهم.
  hi.a1.unit06.lesson02.teach.kap_gilas_plate:
    title: پیالی، گیلاس، بشقاب
    gloss: پیالی، گیلاس، بشقاب
    note: ظرف‌های معمول که هنگام سفارش دادن با *ek* («یک») برای مشخص کردن مقدار به کار می‌روند.
    example_gloss:
    - من یک پیالی چای می‌خواهم.
    - من یک گیلاس آب می‌خواهم.
    - من یک بشقاب برنج می‌خواهم.
  hi.a1.unit06.lesson02.teach.kripya:
    title: لطفاً
    gloss: لطفاً
    note: یک کلمه‌ی ساده‌ی مؤدبانه برای درخواست. اکثراً در اول می‌آید (*kripya mujhe ...*)، ولی در آخر جمله هم شنیده می‌شود.
    example_gloss: من یک پیالی چای می‌خواهم، لطفاً.
  hi.a1.unit06.lesson02.teach.kuch_aur_chahiye:
    title: چیز دیگری هم؟
    gloss: چیز دیگر می‌خواهین؟ / چیزی بیشتر می‌خواهین؟
    note: پرسش طبیعی که پیشخدمت بعد از گرفتن بخشی از سفارش می‌پرسد.
  hi.a1.unit06.lesson02.teach.nahin_bas_shukriya:
    title: نه، بس است، تشکر
    gloss: نه، همین بس است، تشکر.
    note: یک راه طبیعی و مؤدبانه برای ختم سفارش، که *nahin* و *shukriya* را از بخش‌های قبلی دوباره به کار می‌برد.
  hi.a1.unit06.lesson02.teach.sabzi_swadisht_phrase:
    title: این سبزی خیلی خوش‌مزه است
    gloss: این سبزی خیلی خوش‌مزه است.
    note: '*bahut* و *swadisht* همین بخش را با یک اسم تازه‌ی خوراک دوباره به کار می‌برد، تا برای نکته‌ی دستوری درس سوم آماده شوی که *swadisht* با جنسیت تغییر نمی‌کند.'
  hi.a1.unit06.lesson03.teach.chalo_khate_hain:
    title: بیا چیزی بخوریم!
    gloss: بیا چیزی بخوریم!
    note: یک شکل دوستانه و ثابت برای پیشنهاد خوردن با هم، که گفتگوی پایانی این بخش با آن شروع می‌شود.
  hi.a1.unit06.lesson03.teach.ya:
    title: یا
    gloss: یا
    note: یک کلمه‌ی ربط ساده که برای پیشنهاد انتخاب میان دو چیز به کار می‌رود.
    example_gloss: چای می‌خواهی یا قهوه؟
  hi.a1.unit06.lesson03.teach.haan:
    title: بلی
    gloss: بلی
    note: یک جواب مثبت ساده که در گفتگوی پایانی این بخش بارها می‌آید.
    example_gloss: بلی، من چای می‌خواهم.
  hi.a1.unit06.lesson03.teach.swadisht_invariant_note:
    title: Swadisht هیچ‌وقت تغییر نمی‌کند
    gloss: '*Swadisht* با کلمه‌های مذکر و مؤنث یکسان می‌ماند -- مثل *achha/achhi* تغییر نمی‌کند.'
    note: 'یک استثنای مهم و واقعی: برخلاف صفت‌های هماهنگ‌شونده‌ای که قبلاً یاد گرفتی (achha/achhi، bada/badi، mera/meri)، صفت‌هایی که به همخوان ختم می‌شوند، مثل *swadisht*، هیچ‌وقت با جنسیت تغییر نمی‌کنند.'
  hi.a1.unit06.lesson03.teach.accha_phir_milenge:
    title: خوب، باز می‌بینیم
    gloss: خوب! باز همدیگر را می‌بینیم.
    note: یک خداحافظی دوستانه که از کلمه‌های خداحافظی بخش‌های قبلی دوباره به کار رفته است.
  hi.a1.unit06.lesson03.teach.theek_hai_phir_milte_hain:
    title: بسیار خوب، به زودی می‌بینیم
    gloss: بسیار خوب، به زودی همدیگر را می‌بینیم!
    note: جواب غیررسمی به خداحافظی بالا، مطابق با گفتگوهای پایانی بخش‌های قبلی.
  hi.a1.unit06.lesson03.teach.dialogue.line01:
    title: ارجن پیشنهاد خوردن می‌کند
    gloss: ارجن می‌گوید بیا چیزی بخوریم.
    note: عبارت آغازین همین بخش را دوباره به کار می‌برد.
  hi.a1.unit06.lesson03.teach.dialogue.line02:
    title: پریا می‌پرسد او چه می‌خواهد
    gloss: پریا موافقت می‌کند و می‌پرسد ارجن چه می‌خواهد.
    note: پرسش غیررسمی *tumhein kya chahiye* را از درس اول دوباره به کار می‌برد.
  hi.a1.unit06.lesson03.teach.dialogue.line03:
    title: ارجن غذا سفارش می‌دهد
    gloss: ارجن می‌گوید یک بشقاب روتی و سبزی می‌خواهد.
    note: اسم‌های خوراک این بخش، الگوی ظرف *ek plate* و *chahiye* را با هم می‌آورد.
  hi.a1.unit06.lesson03.teach.dialogue.line04:
    title: پریا انتخاب نوشیدنی را پیشنهاد می‌کند
    gloss: پریا می‌گوید خوب است و می‌پرسد ارجن چای می‌خواهد یا قهوه.
    note: '*ya* همین بخش را برای پیشنهاد انتخاب میان دو نوشیدنی به کار می‌برد.'
  hi.a1.unit06.lesson03.teach.dialogue.line05:
    title: ارجن قهوه را انتخاب می‌کند
    gloss: ارجن می‌گوید قهوه می‌خواهد، لطفاً.
    note: '*kripya* را از درس ۲ دوباره به کار می‌بریم.'
  hi.a1.unit06.lesson03.teach.dialogue.line06:
    title: نظر پریا درباره غذا
    gloss: پریا می‌گوید خوب است و این غذا بسیار خوش‌مزه است.
    note: '*bahut swadisht* را از درس ۱ دوباره به کار می‌بریم.'
  hi.a1.unit06.lesson03.teach.dialogue.line07:
    title: ارجن موافقت می‌کند
    gloss: ارجن می‌گوید بلی، بسیار تشکر.
    note: '*haan* و *shukriya* را دوباره به کار می‌بریم.'
  hi.a1.unit06.lesson03.teach.dialogue.line08:
    title: پریا گفت‌وگو را ختم می‌کند
    gloss: پریا می‌گوید خوب، باز همدیگر را می‌بینیم.
    note: عبارت ختم گفت‌وگوی همین درس را دوباره به کار می‌بریم.
  hi.a1.unit06.lesson03.teach.dialogue.line09:
    title: ارجن جواب می‌دهد
    gloss: ارجن موافقت می‌کند و می‌گوید بزودی همدیگر را می‌بینیم.
    note: عبارت جواب همین درس را دوباره به کار می‌بریم.
