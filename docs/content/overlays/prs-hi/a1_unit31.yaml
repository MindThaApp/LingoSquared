teaching:
  hi.a1.unit31.lesson01.teach.lanba_chhota:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*लंबा* و *छोटा* قد را توصیف می‌کنند و معمولاً با *कद* («قد») می‌آیند: *नेहा का कद लंबा है*. برای اسم مذکر به *-ा* و برای اسم مؤنث به *-ी* ختم می‌شوند.'
    example_gloss:
    - نیها قد بلند است.
    - ویکرم قد کوتاه است.
  hi.a1.unit31.lesson01.teach.boorha_javan:
    title: پیر و جوان
    gloss: پیر / جوان
    note: '*बूढ़ा* و *जवान* می‌رسانند که یک شخص چند ساله به نظر می‌رسد، بدون گفتن عدد.'
    example_gloss:
    - بابه کلان پیر است.
    - ارجن جوان است.
  hi.a1.unit31.lesson01.teach.tumharee_umr_kitnee:
    title: उम्र و बूढ़ा
    gloss: عمر تان چند است؟ پدرکلان پیر است.
    note: برای پرسیدن سن دقیق، هندی از *उम्र* («سن، عمر») کار می‌گیرد، در حالی که *बूढ़ा* یک شخص پیر را بدون عدد توصیف می‌کند.
  hi.a1.unit31.lesson01.teach.neha_ka_kad:
    title: نیها قد بلند است و ویکرم قد کوتاه
    gloss: نیها قد بلند است و ویکرم قد کوتاه.
    note: '*और* («و») دو توصیف را وصل می‌کند، و هر *का कद* با *कद* مذکر هماهنگ است.'
  hi.a1.unit31.lesson02.teach.bal:
    title: مو
    gloss: مو
    note: '*बाल* («مو») در هندی مذکر و جمع است، پس واژه‌هایی که آن را توصیف می‌کنند به *-े* ختم می‌شوند: *लंबे बाल*.'
    example_gloss: ارجن موهای کوتاه و سیاه دارد.
  hi.a1.unit31.lesson02.teach.sunahre_bhoore_safed:
    title: طلایی، قهوه‌یی و سفید
    gloss: طلایی / قهوه‌یی / سفید
    note: 'سه رنگ مو: *सुनहरे*، *भूरे* و *सफ़ेद*؛ پیش از *बाल* به *-े* ختم می‌شوند.'
    example_gloss:
    - پریا موهای طلایی دارد.
    - ویکرم موهای قهوه‌یی دارد.
    - پدرکلان موهای سفید دارد.
  hi.a1.unit31.lesson02.teach.lanbe_chhote:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*लंबे* («بلند») و *छोटे* («کوتاه») موها را توصیف می‌کنند، و چون *बाल* جمع است به *-े* ختم می‌شوند.'
    example_gloss:
    - نیها موهای بلند دارد.
    - ویکرم موهای کوتاه دارد.
  hi.a1.unit31.lesson02.teach.lanbe_bal_chhote:
    title: صفت‌ها پیش از बाल
    gloss: موهای بلند، موهای کوتاه، موهای طلایی، موهای قهوه‌یی، موهای سفید، موهای سیاه.
    note: '*बाल* مذکر جمع است، پس صفتی که پیش از آن می‌آید به *-े* ختم می‌شود: *लंबे बाल*، *भूरे बाल*.'
  hi.a1.unit31.lesson02.teach.uske_bal_lanbe:
    title: 'उसके: او (مذکر یا مؤنث)'
    gloss: موهای او بلند است.
    note: '*उसके* هم «مال او (مرد)» و هم «مال او (زن)» معنا می‌دهد، پس فقط از سیاق می‌فهمید کدام مقصود است؛ اینجا با *बाल* جمع هماهنگ شده است.'
  hi.a1.unit31.lesson02.teach.arjun_ke_bal:
    title: ارجن موهای کوتاه و سیاه دارد
    gloss: ارجن موهای کوتاه و سیاه دارد.
    note: '*काले* دوباره استفاده شده، این بار برای مو، و چون *बाल* جمع است به *-े* ختم می‌شود.'
  hi.a1.unit31.lesson02.teach.priya_ke_bal:
    title: پریا موهای بلند و طلایی دارد
    gloss: پریا موهای بلند و طلایی دارد.
    note: لغات درازی و رنگ این درس در یک جملهٔ طبیعی یکجا شده اند.
  hi.a1.unit31.lesson03.teach.ankhen:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*आँखें* («چشم‌ها») اسم مؤنث جمع است؛ مفرد آن *आँख* است.'
    example_gloss: ارجن چشم‌های قهوه‌یی دارد.
  hi.a1.unit31.lesson03.teach.neela_bhoora_hara:
    title: آبی، قهوه‌یی و سبز
    gloss: آبی / قهوه‌یی / سبز
    note: 'سه رنگ چشم: *नीला*، *भूरा* و *हरा*؛ پیش از *आँखें* مؤنث به *नीली*، *भूरी* و *हरी* تبدیل می‌شوند.'
    example_gloss:
    - پریا چشم‌های آبی دارد.
    - ویکرم چشم‌های قهوه‌یی دارد.
    - نیها چشم‌های سبز دارد.
  hi.a1.unit31.lesson03.teach.neelee_ankhen_bhooree:
    title: صفت‌ها پیش از आँखें
    gloss: چشم‌های آبی، چشم‌های قهوه‌یی، چشم‌های سبز.
    note: '*आँखें* مؤنث است، پس صفتی که پیش از آن می‌آید به *-ी* ختم می‌شود: *नीली आँखें*.'
  hi.a1.unit31.lesson03.teach.priya_kaisee_dikhtee:
    title: پریا چه شکلی است؟
    gloss: پریا چه شکلی است؟
    note: '*कैसी दिखती है?* («چه شکلی به نظر می‌رسد؟») سوال اصلی است: *कैसी* و *दिखती* برای زن مؤنث اند، و *कैसा* و *दिखता* برای مرد مذکر.'
  hi.a1.unit31.lesson03.teach.priya_ke_bal:
    title: پریا موهای بلند و طلایی و چشم‌های آبی دارد
    gloss: پریا موهای بلند و طلایی و چشم‌های آبی دارد.
    note: 'یک جواب نمونه: مو و چشم با *और* وصل شده اند. صاحب برای *बाल* جمع *के* و برای *आँखें* مؤنث *की* می‌گیرد.'
  hi.a1.unit31.lesson04.teach.priya_bhasha_kaife:
    title: پریا نینا را معرفی می‌کند
    gloss: 'پریا: یک دختر نو به کافه‌ی زبان می‌آید. نامش نینا است.'
    note: '*आ रही है* («می‌آید») کسی تازه را معرفی می‌کند، و *उसका नाम ... है* نام را می‌گوید.'
  hi.a1.unit31.lesson04.teach.arjun_oke_vah:
    title: ارجن می‌پرسد که او چه شکلی است
    gloss: 'ارجن: باشه! از نظر ظاهر چه شکلی است؟'
    note: '*वह देखने में कैसी है?* یعنی «از نظر ظاهر چه جور است»؛ *वह* هم «او (مرد)» و هم «او (زن)» معنا می‌دهد.'
  hi.a1.unit31.lesson04.teach.priya_uska_kad:
    title: پریا قد و موهای نینا را توصیف می‌کند
    gloss: 'پریا: قدش کوتاه است و موهای کوتاه و طلایی دارد.'
    note: 'این جمله قد و مو را وصل می‌کند: *उसका कद छोटा है और उसके बाल छोटे और सुनहरे हैं*.'
  hi.a1.unit31.lesson04.teach.arjun_aur_uskee:
    title: ارجن درباره‌ی چشم‌هایش می‌پرسد
    gloss: 'ارجن: و چشم‌هایش؟'
    note: '*उसकी आँखें* یعنی «چشم‌های او»؛ *उसकी* مؤنث است تا با *आँखें* هماهنگ باشد.'
  hi.a1.unit31.lesson04.teach.priya_uskee_ankhen:
    title: پریا چشم‌های نینا را توصیف می‌کند
    gloss: 'پریا: چشم‌هایش سبز است.'
    note: '*हरी* به *-ी* ختم می‌شود چون *आँखें* مؤنث است.'
  hi.a1.unit31.lesson04.teach.arjun_shukriya_tab:
    title: ارجن او را خواهد شناخت
    gloss: 'ارجن: تشکر! پس او را می‌شناسم.'
    note: '*पहचान लूँगा* («خواهم شناخت») آینده‌ی *पहचानना* است، و *उसे* یعنی «او را».'
  hi.a1.unit31.lesson05.teach.vikram_aur_neha:
    title: مقایسه‌ی ویکرم و نیها
    gloss: ویکرم و نیها برادر و خواهر استند، ولی ظاهر شان فرق دارد. ویکرم قد کوتاه دارد و موهای کوتاه و قهوه‌یی و چشم‌های قهوه‌یی. نیها از ویکرم قد بلندتر است و موهای بلند و قهوه‌یی و چشم‌های سبز دارد. شما چه شکلی استید؟
    note: یک مقایسهٔ کوتاه که همهٔ لغات رنگ و درازی تا اینجا را دوباره به کار می‌برد و با سوال اصلی این بخش از خواننده تمام می‌شود.
    glosses:
      भाई: برادر
      बहन: خواهر
      दिखते: ظاهر شدن، به نظر آمدن
      अलग: فرق دار
      छोटा: کوتاه
      छोटे: کوتاه
      भूरे: قهوه‌یی
      बाल: مو
      भूरी: قهوه‌یی
      आँखें: چشم‌ها
      लंबी: قدبلندتر
      लंबे: دراز
      हरी: سبز
      कैसे: چطور (مثل «چه شکلی استید»)
  hi.a1.unit31.lesson05.teach.vikram_neha_se:
    title: مقایسه با से
    gloss: ویکرم از نیها قد کوتاه‌تر است.
    note: '*से* در اینجا یعنی «از» (در مقایسه) و بعد از کسی می‌آید که با او مقایسه می‌کنین: *नेहा से छोटा*، و صفت درست پیش از فعل می‌آید.'
  hi.a1.unit31.lesson05.teach.neha_ke_bal:
    title: موهای نیها از موهای وکرم درازتر است
    gloss: موهای نیها از موهای وکرم درازتر است.
    note: '*लंबे* با جمع *बाल* مطابقت دارد و *विक्रम से* مقایسه را نشان می‌دهد.'
  hi.a1.unit31.lesson05.teach.mere_bal_chhote:
    title: موهایم کوتاه و قهوه‌یی است
    gloss: موهایم کوتاه و قهوه‌یی است.
    note: '*मेरे बाल छोटे और भूरे हैं* («موهای من کوتاه و قهوه‌ای است») جملهٔ نمونه برای معرفی خود است؛ *मेरे* با جمع *बाल* مطابقت دارد.'
  hi.a1.unit31.lesson06.teach.arjun_dekho_kya:
    title: ارجن نینا را می‌بیند
    gloss: 'ارجن: ببین، این نینا است؟ موهایش کوتاه و طلایی است و چشمانش سبز است.'
    note: '*देखो* («ببین») شکل امر غیررسمی برای یک دوست است.'
  hi.a1.unit31.lesson06.teach.priya_han_vahee:
    title: پریا تأیید می‌کند
    gloss: 'پریا: بلی، همین نینا است!'
    note: یک تأیید کوتاه و طبیعی.
  hi.a1.unit31.lesson06.teach.neena_hay_kya:
    title: نینا به ارجن سلام می‌دهد
    gloss: 'نینا: سلام، تو ارجن استی؟'
    note: '*क्या तुम अर्जुन हो?* یک سوال ساده و غیررسمی برای کسی هم‌سن و سال خودت است.'
  hi.a1.unit31.lesson06.teach.arjun_han_tumse:
    title: ارجن هم به نینا سلام می‌دهد
    gloss: 'ارجن: بلی! از دیدنت خوش شدم، نینا.'
    note: '*तुमसे मिलकर अच्छा लगा* عبارت معمول برای اولین دیدار با کسی است؛ احساس «به» تو می‌آید، برای همین به کلمهٔ «من» ضرورت نیست.'
  hi.a1.unit31.lesson06.teach.neena_mujhe_bhee:
    title: نینا جواب می‌دهد
    gloss: 'نینا: من هم از آشنایی با تو خوش شدم!'
    note: گفتگو را تمام می‌کند -- ارجن نینا را از روی توصیف قبلی پریا شناخت.
