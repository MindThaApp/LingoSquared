  hi.a1.unit08.lesson02.teach.ke_paas_note:
    title: Ke paas
    gloss: «Ke paas» یعنی نزدیکِ یک جا، مثلاً «school bank ke paas hai» (مکتب نزدیک بانک است). این همان «paas» است که پیش‌تر در «mere paas» (من دارم) آمده بود، اما آنجا یعنی «در تصرف من» و این‌جا یعنی «نزدیک» -- یک کلمه، دو کاربرد متفاوت.
    note: یک حرف اضافهٔ تازه که بر پایهٔ کلمه‌ای ساخته شده که قبلاً دیده‌اید، و معنای پیشین آن صریحاً نشان داده شده تا این دو کاربرد با هم قاطی نشوند.
    target_text: '''के पास'' का मतलब है किसी जगह के नज़दीक -- जैसे ''बैंक स्कूल के पास है''। यह वही ''पास'' है जो पहले ''मेरे पास'' (मेरे पास एक किताब है) में आया था, पर वहाँ इसका मतलब था ''मेरे स्वामित्व में'' (I have), और यहाँ इसका मतलब है ''नज़दीक'' (near) -- एक ही शब्द, दो अलग इस्तेमाल।'
