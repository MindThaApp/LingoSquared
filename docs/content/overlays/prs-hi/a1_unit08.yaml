    note: '*achchha* (خوب / فهمیدم) از بخش‌های پیشین دوباره می‌آید.'
  hi.a1.unit08.lesson03.teach.dialogue.line04:
    title: پریا جواب می‌دهد
    gloss: پریا می‌گوید شفاخانه روبه‌روی ایستگاه است.
    note: '*ke samne* از درس ۲ دوباره به کار می‌رود.'
  hi.a1.unit08.lesson03.teach.dialogue.line05:
    title: ارجن می‌پرسد دور است یا نه
    gloss: 'ارجن می‌پرسد: ایستگاه دور است؟'
    note: '*door* از درس ۲ دوباره به کار می‌رود.'
  hi.a1.unit08.lesson03.teach.dialogue.line06:
    title: پریا تأیید می‌کند و مقایسه می‌کند
    gloss: پریا می‌گوید بلی، کمی دور است -- بانک نزدیک است.
    note: '*thoda* (کمی) معرفی می‌شود، و با دور بودن ایستگاه و نزدیک بودن بانک سازگار می‌ماند.'
  hi.a1.unit08.lesson03.teach.dialogue.line07:
    title: ارجن دربارهٔ پارک می‌پرسد
    gloss: ارجن می‌گوید خوب است، و می‌پرسد پارک کجاست.
  hi.a1.unit08.lesson03.teach.dialogue.line08:
    title: پریا جواب می‌دهد
    gloss: پریا می‌گوید پارک پشت مکتب است.
    note: '*ke peeche* از درس ۲ دوباره به کار می‌رود.'
  hi.a1.unit08.lesson03.teach.dialogue.line09:
    title: ارجن نتیجه می‌گیرد
    gloss: 'ارجن می‌گوید: پس مکتب روبه‌روی پارک است!'
    note: '*to* (پس / آن‌وقت) معرفی می‌شود، و این واقعیت را به نکتهٔ دستوری *samne*/*peeche* در درس ۲ وصل می‌کند.'
  hi.a1.unit08.lesson03.teach.dialogue.line10:
    title: پریا تأیید می‌کند
    gloss: پریا می‌گوید بلی، درست است!
    note: '*sahi* (درست) معرفی می‌شود.'
  hi.a1.unit08.lesson03.teach.dialogue.line11:
    title: ارجن از پریا تشکر می‌کند
    gloss: ارجن می‌گوید پریا، بسیار تشکر!
    note: '*bahut* (بسیار) و *shukriya* از بخش‌های پیشین دوباره می‌آیند.'
  hi.a1.unit08.lesson03.teach.dialogue.line12:
    title: پریا گفت‌وگو را تمام می‌کند
    gloss: پریا می‌گوید مشکلی نیست! دوباره می‌بینیم.
    note: عبارت‌های پایانی معمول این کورس از بخش‌های پیشین دوباره به کار می‌روند.
