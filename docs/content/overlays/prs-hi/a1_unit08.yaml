  hi.a1.unit08.lesson02.teach.samne_peeche_note:
    title: Samne و peeche
    gloss: '«Samne» و «peeche» هم مثل «paas» با «ke» می‌آیند -- و ضد همدیگر اند: «paark school ke peeche hai» و «school paark ke samne hai» هر دو دقیقاً یک رابطهٔ واقعی را بیان می‌کنند، فقط از دو طرف متفاوت.'
    note: یک واقعیت به دو شکل بیان شده -- نکتهٔ دستوری واقعی و مفید دربارهٔ رابطهٔ این دو کلمه.
