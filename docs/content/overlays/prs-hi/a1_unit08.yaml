  hi.a1.unit08.lesson02.teach.samne_peeche:
    title: روبه‌روی، پشت
    gloss: روبه‌روی، پشت
    note: جفت دوم کلمه‌های جای، که آن‌ها هم با *ke* می‌آیند.
