answer_policy:
  number_agreement: This unit's central grammar point is that 'है'/'हैं' after *पसंद* agrees with the NUMBER of the liked thing (not the speaker's or the liked thing's gender) -- e.g. *चाय पसंद है* (tea, singular) vs. *किताबें पसंद हैं* (books, plural). A typed answer using the wrong number's copula for a thing whose number is already fixed by the sentence (e.g. *किताबें* is always plural) should be marked incorrect -- this is the exact point being tested. For open-ended "what do you like" prompts (writing_prompt/speak_response) where the learner picks their own liked thing, accept either singular or plural framing as long as है/हैं internally agrees with whichever noun the learner chose.
  chahiye_vs_pasand: This unit deliberately distinguishes *चाहिए* (unit 6, "want/need", takes no है after it, invariant) from *पसंद है/हैं* (this unit, "like", always requires a है/हैं copula that agrees in number with the liked thing) -- a typed answer that drops the है/हैं after पसंद, or that adds है after चाहिए, should be marked incorrect as a real structural error, not tolerated as a minor typo.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's new nasalized words (पसंद, संगीत, and किताबें's plural ending) all use anusvara, verified against a direct codepoint check -- consistent with the already-established हैं/मुझे/तुम्हें convention. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to state their own likes/dislikes/preferences, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
