teaching:
  hi.a1.unit13.lesson01.teach.chai_coffee_review:
    title: 'مرور: چای، قهوه'
    gloss: چای، قهوه
    note: مرور سریع لغات یونیت ۶ که برای صحبت دربارهٔ دوست داشتن و دوست نداشتن در این یونیت لازم است.
    example_gloss:
    - من چای می‌خواهم.
    - من قهوه می‌خواهم.
  hi.a1.unit13.lesson01.teach.mujhe_review:
    title: 'مرور: به من'
    gloss: به من
    note: ضمیر حالت «به» که پیشتر آموخته شد و در واحدهای ۶/۷/۱۱ به کار رفته است -- این واحد یک محمول تازه برایش می‌آورد.
    example_gloss: من چای می‌خواهم.
  hi.a1.unit13.lesson01.teach.pasand:
    title: دوست داشتن / دلخواه
    gloss: دوست داشتن / دلخواه
    note: اسمی به معنی «دوست داشتن» (نه «محبوب») -- وقتی با فاعل حالت «به» (mujhe/tumhein) و فعل کمکی hai/hain بیاید، جملهٔ «... را دوست دارم» را می‌سازد.
    example_gloss: چای را دوست دارم.
  hi.a1.unit13.lesson01.teach.pasand_hai_grammar:
    title: Pasand hai = دوست دارم
    gloss: '''Pasand hai'' یعنی «X برایم دلپسند است»، یعنی «X را دوست دارم». مثل ''mujhe...chahiye'' (واحد ۶) با mujhe/tumhein شروع می‌شود، ولی بعد از ''chahiye'' «hai» نمی‌آید، در حالی که بعد از ''pasand'' همیشه ''hai'' یا ''hain'' می‌آید.'
    note: فرق ساختاری chahiye (خواستن/ضرورت) و pasand hai (دوست داشتن) را صریح بیان می‌کند تا این دو ساختار با هم اشتباه نشوند.
  hi.a1.unit13.lesson01.teach.sangeet:
    title: موسیقی
    gloss: موسیقی
    note: اسم تازه‌ای برای تمرین ساختار pasand hai با فاعل مفرد و ناشمارا.
    example_gloss: من موسیقی را دوست دارم.
  hi.a1.unit13.lesson01.teach.haan_nahi_review:
    title: 'مرور: بلی، نه'
    gloss: بلی، نه
    note: مرور سریع دو کلمهٔ ابتدایی که برای جواب دادن و منفی کردن پرسش‌های علاقه در این واحد لازم‌اند.
    example_gloss:
    - بلی، موسیقی را دوست دارم.
    - نه، قهوه را دوست ندارم.
  hi.a1.unit13.lesson01.teach.pasand_nahi_hai_phrase:
    title: قهوه را دوست ندارم.
    gloss: من قهوه را دوست ندارم.
    note: منفی‌سازی دقیقاً مثل جمله‌های hai که پیشتر آموخته‌اید است (مثلاً «yoga class nahin hai» در واحد ۳) -- nahin درست پیش از hai می‌آید.
  hi.a1.unit13.lesson01.teach.kitab_kitaben:
    title: کتاب / کتاب‌ها
    gloss: کتاب / کتاب‌ها
    note: یک جفت اسم تازه، مفرد و جمع، برای نشان دادن اینکه 'hai'/'hain' بعد از pasand با تعداد چیزِ دلخواه مطابقت دارد.
    example_gloss:
    - کتاب را دوست دارم.
    - کتاب‌ها را دوست دارم.
  hi.a1.unit13.lesson01.teach.number_agreement_grammar:
    title: Hai یا hain بعد از pasand
    gloss: '''Hai'' یا ''hain'' بعد از ''pasand'' با تعداد چیزِ دلخواه مطابقت می‌کند -- دقیقاً مثل ''mere paas...hai/hain'' (واحد ۲): چای/موسیقی pasand hai (مفرد)، کتاب‌ها pasand hain (جمع).'
    note: قاعدهٔ مطابقت تعداد hai/hain از واحد ۲ را به یک موقعیت تازه گسترش می‌دهد، نه اینکه مفهوم دستوری تازه‌ای معرفی کند.
  hi.a1.unit13.lesson02.teach.tumhein_review:
    title: 'مرور: به تو (غیررسمی)'
    gloss: به تو (غیررسمی)
    note: نخستین بار در واحد ۶ با chahiye آمد ('tumhein...chahiye?') -- این واحد همین ضمیر را این بار با pasand hai به کار می‌برد.
    example_gloss: موسیقی را دوست داری؟
  hi.a1.unit13.lesson02.teach.kya_tumhein_pasand_hai_grammar:
    title: Kya tumhein...pasand hai?
    gloss: '''Kya'' در آغاز پرسش نشانهٔ پرسش بلی/نه است (واحد ۱)؛ ''tumhein'' همان قالب فاعل حالت «به» را که در ''tumhein...chahiye?'' (واحد ۶) بود تکرار می‌کند -- اینجا ''pasand hai'' به‌جای ''chahiye'' می‌آید.'
    note: تأیید می‌کند که این بار قالب پرسشی آشنا دوباره به کار رفته است و نکتهٔ دستوری تازه‌ای نیست.
  hi.a1.unit13.lesson02.teach.khel:
    title: ورزش / بازی
    gloss: ورزش / بازی
    note: اسم تازه. در مثال‌ها با 'yah' (این) می‌آید تا مطابقت تعداد روشن بماند، چون 'khel' خودش در مفرد و جمع شکل عوض نمی‌کند.
    example_gloss: این ورزش را دوست دارم.
  hi.a1.unit13.lesson02.teach.yah_review:
    title: 'مرور: این'
    gloss: این
    note: نخستین بار در واحد ۷ ('mujhe yah chahiye') آمد -- اینجا دوباره به کار رفته تا اشاره به 'khel' به‌صورت مفرد روشن باشد.
    example_gloss: این کتاب خوب است.
  hi.a1.unit13.lesson02.teach.ya_review:
    title: 'مرور: یا'
    gloss: یا
    note: نخستین بار در واحد ۶/۷ برای سفارش غذا و کالا آمد -- اینجا دوباره به کار رفته تا دربارهٔ علاقه‌ها پرسش انتخابی بپرسیم.
    example_gloss: چای یا قهوه؟
  hi.a1.unit13.lesson02.teach.chai_ya_coffee_phrase:
    title: چای را دوست داری یا قهوه؟
    gloss: چای را دوست داری یا قهوه؟
    note: قالب پرسشی tumhein این درس را با 'ya' (یا) که پیشتر آموخته‌اید ترکیب می‌کند تا از زبان‌آموز بخواهد یکی را انتخاب کند.
  hi.a1.unit13.lesson02.teach.zyada:
    title: بیشتر
    gloss: بیشتر
    note: کلمهٔ تازه‌ای که درست پیش از 'pasand hai' می‌آید تا ترجیح بین دو چیزِ نام‌برده‌شده را بیان کند.
    example_gloss: چای را بیشتر دوست دارم.
  hi.a1.unit13.lesson02.teach.zyada_pasand_grammar:
    title: Zyada pasand hai = ترجیح دادن
    gloss: '''X zyada pasand hai'' یعنی یکی از دو چیز را ترجیح دادن -- ''mujhe chai zyada pasand hai'' یعنی «چای را بیشتر دوست دارم» / «چای را ترجیح می‌دهم».'
    note: این یک گسترش واژگانی است، نه دستور تازه -- 'zyada' فقط 'pasand hai' را که پیشتر آموخته‌اید توصیف می‌کند.
    target_text: '''X ज़्यादा पसंद है'' का मतलब है दो चीज़ों में से एक को तरजीह देना (prefer) -- ''मुझे चाय ज़्यादा पसंद है'' का मतलब है ''मैं दूसरी चीज़ों से ज़्यादा चाय पसंद करता हूँ'' (I like tea more / I prefer tea)।'
  hi.a1.unit13.lesson03.teach.review_words:
    title: 'مرور: موسیقی، ورزش، کتاب‌ها'
    gloss: موسیقی، ورزش/بازی، کتاب‌ها
    note: مرور سریع اسم‌های کلیدی این واحد که برای گفتگو و یادداشت خواندنی لازم‌اند.
    example_gloss:
    - من موسیقی را دوست دارم.
    - این ورزش را دوست ندارم.
    - کتاب‌ها را دوست دارم.
  hi.a1.unit13.lesson03.teach.dialogue.line01:
    title: ارجن دربارهٔ موسیقی می‌پرسد
    gloss: پریا، موسیقی را دوست داری؟
  hi.a1.unit13.lesson03.teach.dialogue.line02:
    title: پریا می‌گوید موسیقی را خیلی دوست دارد
    gloss: بلی، موسیقی را خیلی دوست دارم. تو چطور؟
  hi.a1.unit13.lesson03.teach.dialogue.line03:
    title: ارجن موافقت می‌کند و ورزش را هم اضافه می‌کند
    gloss: من هم! و ورزش را هم دوست دارم.
  hi.a1.unit13.lesson03.teach.dialogue.line04:
    title: پریا کتاب را بر این بازی ترجیح می‌دهد
    gloss: خوب! این بازی را دوست ندارم. کتاب‌ها را دوست دارم.
  hi.a1.unit13.lesson03.teach.dialogue.line05:
    title: ارجن می‌پرسد چای یا قهوه
    gloss: خوب است. چای را دوست داری یا قهوه؟
  hi.a1.unit13.lesson03.teach.dialogue.line06:
    title: پریا چای را ترجیح می‌دهد
    gloss: چای را بیشتر دوست دارم.
  hi.a1.unit13.lesson03.teach.dialogue.line07:
    title: ارجن موافقت می‌کند
    gloss: بسیار خوب! من هم چای را دوست دارم.
  hi.a1.unit13.lesson03.teach.dialogue.line08:
    title: پریا گفتگو را تمام می‌کند
    gloss: خوب است! فردا دوباره همدیگر را ببینیم؟
  hi.a1.unit13.lesson03.teach.chahiye_pasand_zyada_grammar:
    title: سه الگوی مرتبط
    gloss: 'سه الگوی این واحد: بعد از ''chahiye'' (خواستن/ضرورت، واحد ۶) «hai» نمی‌آید؛ ''pasand hai/hain'' (این واحد) با تعداد چیز تغییر می‌کند؛ ''zyada pasand hai'' یعنی یکی از دو چیز را ترجیح دادن.'
    note: خلاصهٔ پایانی که دستور کل واحد را به هم پیوند می‌دهد، مثل نکتهٔ دستوری واحد ۱۲ که الگوها را کنار هم می‌آورد.
    target_text: 'इस यूनिट के तीन तरीके: ''चाहिए'' (चाहना/ज़रूरत, यूनिट 6) के बाद ''है'' नहीं आता; ''पसंद है/हैं'' (यह यूनिट) चीज़ की संख्या से बदलता है; ''ज़्यादा पसंद है'' का मतलब है दो में से एक को तरजीह देना (prefer)।'
  hi.a1.unit13.lesson03.teach.priya_note:
    title: یادداشت پریا
    gloss: ارجن، موسیقی را خیلی دوست دارم. کتاب‌ها را هم دوست دارم. این بازی را دوست ندارم. چای را بیشتر دوست دارم. - پریا
    note: یادداشت کوتاه نوشته‌شده که دقیقاً همان چیزهایی را که در گفتگو آمد دوباره می‌گوید، بدون هیچ ادعای تازه.
    glosses:
      संगीत: موسیقی
      बहुत: خیلی
      पसंद: دلخواه / دلپسند
      किताबें: کتاب‌ها
      खेल: بازی
      नहीं: نه
      चाय: چای
      ज़्यादा: بیشتر / ترجیحاً
