    title: ارجون از او تشکر می‌کند
    gloss: تشکر!
  hi.a1.unit18.lesson03.teach.grammar_summary:
    title: سه قاعدهٔ اصلی
    gloss: 'سه قاعدهٔ اصلی این واحد: (۱) ''[جا] + mein + [عدد] + [اسم] + hai/hain'' می‌گوید در خانه چه چیزهایی هست و چند تا؛ (۲) اسم‌های مذکری که به ''-a'' ختم می‌شوند، در جمع ''-e'' می‌شوند (kamra ← kamre)؛ (۳) اسم‌های مؤنثی که به ''-i'' ختم می‌شوند، در جمع ''-iyan'' می‌شوند (kursi ← kursiyan، khidki ← khidkiyan).'
    note: یک خلاصهٔ پایانی که گرامر کل واحد را کنار هم می‌آورد، مثل یادداشت‌های گرامری واحدهای ۱۵ تا ۱۷.
  hi.a1.unit18.lesson03.teach.home_reading:
    title: خواندن دربارهٔ دو خانه
    gloss: خانهٔ پریا کوچک است. در خانه دو اتاق هست، یک آشپزخانه و یک تشناب. خانهٔ ارجون بزرگ است. در خانه سه اتاق خواب و یک آشپزخانهٔ بزرگ هست.
    note: یک معرفی کوتاه و مستقیم که دقیقاً همان حقایق گفتگو را بیان می‌کند، بدون ادعای تازه؛ برای هدف «خواندن یک توضیح کوتاه دربارهٔ خانه» مناسب است.
    glosses:
      घर: خانه
      छोटा: کوچک
      कमरे: اتاق‌ها
      रसोई: آشپزخانه
      बाथरूम: تشناب
      बड़ा: بزرگ
      बेडरूम: اتاق‌های خواب
      बड़ी: بزرگ (مؤنث)
