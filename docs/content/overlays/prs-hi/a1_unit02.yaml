teaching:
  hi.a1.unit02.lesson01.teach.shoonya:
    title: صفر
    gloss: صفر
    note: نقطهٔ آغاز همهٔ عددهای این بخش.
    example_gloss: امروز حرارت صفر است.
  hi.a1.unit02.lesson01.teach.ek:
    title: یک
    gloss: یک
    note: عددهای ۱۱ تا ۹۹ در هندی هرکدام کلمهٔ جداگانه‌اند و مثل «ده + یک» ساخته نمی‌شوند. این را در درس ۲ می‌بینین، جایی که बीस (۲۰) و तीस (۳۰) هیچ بخش مشترکی با एक (۱) یا दो (۲) ندارند.
    example_gloss: من یک کتاب دارم.
  hi.a1.unit02.lesson01.teach.do:
    title: دو
    gloss: دو
    note: عدد ساده و پرکاربرد است؛ همچنین امر غیررسمی «بده» هم هست، اما معنا همیشه از متن معلوم می‌شود.
    example_gloss: من دو برادر دارم.
  hi.a1.unit02.lesson01.teach.teen:
    title: سه
    gloss: سه
    note: '*चाहिए* («لازم است») ساختار بی‌شخص رایج است: *mujhe teen seb chahiye* لفظاً یعنی «برای من سه سیب لازم است»، و راه بسیار طبیعی گفتن «من ... لازم دارم» است.'
    example_gloss: من سه سیب لازم دارم.
  hi.a1.unit02.lesson01.teach.chaar:
    title: چهار
    gloss: چهار
    note: اینجا بی‌قاعدگی نیست؛ chaar مثل بقیهٔ عددهای کوچک رفتار می‌کند.
    example_gloss: من چهار دوست دارم.
  hi.a1.unit02.lesson01.teach.paanch:
    title: پنج
    gloss: پنج
    note: با چاندرابندو (पाँच) نوشته می‌شود، نه انوسوار؛ نشانهٔ مصوت aa (ा) بالای حرف نمی‌رود و به همین سبب چاندرابندو لازم است نه نقطهٔ ساده، همان الگویی که در بخش ۱ در हाँ/कहाँ دیدید.
    example_gloss: من پنج روپیه دارم.
  hi.a1.unit02.lesson01.teach.chhah:
    title: شش
    gloss: شش
    note: در متن‌های قدیمی گاهی छः هم نوشته می‌شود؛ छह املای معیار امروزی است.
    example_gloss: من شش کتاب دارم.
  hi.a1.unit02.lesson01.teach.saat:
    title: هفت
    gloss: هفت
    note: عدد مفید برای گفتن دربارهٔ روزهای هفته.
    example_gloss: در یک هفته هفت روز است.
  hi.a1.unit02.lesson01.teach.aath:
    title: هشت
    gloss: هشت
    note: بی‌قاعدگی ندارد؛ aath مثل بقیهٔ عددهای کوچک رفتار می‌کند.
    example_gloss: در این اتاق هشت چوکی هست.
  hi.a1.unit02.lesson01.teach.nau:
    title: نه
    gloss: نه
    note: اینجا نشانهٔ خیشومی لازم نیست، برخلاف بعضی عددهای دور و بر آن.
    example_gloss: صنف یوگا ساعت نه صبح شروع می‌شود.
  hi.a1.unit02.lesson01.teach.das:
    title: ده
    gloss: ده
    note: آخرین عدد این مجموعهٔ اول؛ درس ۲ با عددهای یازده تا نوزده و دهگان‌ها ادامه پیدا می‌کند که از اینجا به بعد قاعده ندارند.
    example_gloss: من در دست‌هایم ده انگشت دارم.
  hi.a1.unit02.lesson02.teach.gyaarah:
    title: یازده
    gloss: یازده
    note: از اینجا به بعد هر عدد هندی کلمهٔ بی‌قاعدهٔ خودش را دارد؛ gyaarah در خود das (۱۰) یا ek (۱) را ندارد. راه کوتاهی نیست و هر کدام را باید جداگانه یاد گرفت.
    example_gloss: در این صنف یازده شاگرد هست.
  hi.a1.unit02.lesson02.teach.baarah:
    title: دوازده
    gloss: دوازده
    note: یکی دیگر که باید فقط حفظ شود؛ هیچ الگویی آن را به do (۲) وصل نمی‌کند.
    example_gloss: در یک سال دوازده ماه است.
  hi.a1.unit02.lesson02.teach.pandrah:
    title: پانزده
    gloss: پانزده
    note: برای گفتن مدت‌های کوتاه، مثل یک وقفهٔ پانزده دقیقه‌ای، رایج است.
    example_gloss: من پانزده دقیقه وقت لازم دارم.
  hi.a1.unit02.lesson02.teach.bees:
    title: بیست
    gloss: بیست
    note: کلمهٔ کاملاً تازه است و از ترکیب das (۱۰) و do (۲) ساخته نشده؛ این الگو در همهٔ دهگان‌های بعدی ادامه دارد.
    example_gloss: خواهر من بیست ساله است.
  hi.a1.unit02.lesson02.teach.tees:
    title: سی
    gloss: سی
    note: باز هم کلمهٔ مستقل است؛ کمی شبیه teen (۳) است ولی از teen و das ساخته نمی‌شود، پس آن را جداگانه یاد بگیرین.
    example_gloss: قیمت تکت سی روپیه است.
  hi.a1.unit02.lesson02.teach.pachaas:
    title: پنجاه
    gloss: پنجاه
    note: عدد گرد بسیار پرکاربرد، به‌خصوص در قیمت‌ها.
    example_gloss: من پنجاه روپیه دارم.
  hi.a1.unit02.lesson02.teach.sau:
    title: صد
    gloss: صد
    note: عدد گرد ساده که در قیمت‌های روزمره بسیار می‌آید.
    example_gloss: قیمت این کتاب صد روپیه است.
  hi.a1.unit02.lesson02.teach.keemat:
    title: قیمت
    gloss: قیمت
    note: '*Keemat* اسم مؤنث است؛ ضمیر ملکی آن همیشه شکل مؤنث می‌گیرد (*iski keemat*، «قیمتش»)، چه چیزی که قیمت‌گذاری می‌شود هر چه باشد.'
    example_gloss: قیمت این تکت چند است؟
  hi.a1.unit02.lesson02.teach.rupaye:
    title: روپیه
    gloss: روپیه
    note: '*Rupaya* شکل مفرد است (برای دقیقاً یک روپیه)؛ *rupaye* برای مقدار بیشتر به کار می‌رود.'
    example_gloss: این پنجاه روپیه است.
  hi.a1.unit02.lesson02.teach.iski_keemat_kya_hai:
    title: پرسیدن قیمت
    gloss: قیمتش چند است؟
    note: '*Iski* («مال این») با اسم مؤنث *keemat* («قیمت») هماهنگ می‌شود، نه با چیزی که قیمتش پرسیده می‌شود؛ همان الگوی هماهنگی ملکی که بخش ۱ با *mera naam* معرفی کرد.'
  hi.a1.unit02.lesson02.teach.iski_keemat_pachaas_rupaye_hai:
    title: گفتن قیمت
    gloss: قیمتش پنجاه روپیه است.
    note: جواب طبیعی و کامل به Iski keemat kya hai?
  hi.a1.unit02.lesson03.teach.aapka_phone_number_kya_hai:
    title: پرسیدن نمبر تیلفون به شکل محترمانه
    gloss: نمبر تیلفون شما چند است؟ (محترمانه)
    note: '*Number* (नंबर) واژهٔ قرضی انگلیسی است که در هندی روزمره همیشه به کار می‌رود. *Aapka* با اسم مذکر *number* هماهنگ می‌شود.'
  hi.a1.unit02.lesson03.teach.tumhara_phone_number_kya_hai:
    title: پرسیدن نمبر تلیفون، غیررسمی
    gloss: نمبر تیلفون تو چند است؟ (غیررسمی)
    note: Tumhara وقتی با دوست یا هم‌سن حرف می‌زنید جای aapka می‌آید، مثل بخش ۱.
  hi.a1.unit02.lesson03.teach.mera_number:
    title: گفتن نمبر، جملهٔ آغازین
    gloss: نمبر من ... است.
    note: راه طبیعی برای شروع پیش از خواندن رقم‌ها یکی‌یکی.
  hi.a1.unit02.lesson03.teach.sample_number:
    title: یک نمبر تلیفون نمونه
    gloss: شش، دو، هشت، سه، پنج.
    note: نمبرهای تیلفون در هندی رقم‌به‌رقم خوانده می‌شوند، مثل دری؛ همهٔ رقم‌های اینجا در درس ۱ آموخته شده بود.
  hi.a1.unit02.lesson03.teach.aapki_umra_kya_hai:
    title: پرسیدن سن کسی، رسمی
    gloss: سن شما چند است؟ (محترمانه)
    note: '*Umra* («سن») اسم مؤنث است، پس *aapki* شکل مؤنث می‌گیرد؛ همان الگوی هماهنگی *iski keemat*، این بار برای سن یک شخص نه قیمت.'
  hi.a1.unit02.lesson03.teach.tumhari_umra_kya_hai:
    title: پرسیدن سن کسی، غیررسمی
    gloss: سن تو چند است؟ (غیررسمی)
    note: Tumhari وقتی با دوست یا هم‌سن حرف می‌زنید جای aapki می‌آید.
  hi.a1.unit02.lesson03.teach.meri_umra_tees_saal_hai:
    title: گفتن سن خود
    gloss: سن من سی سال است.
    note: '*Meri* با *umra* (مؤنث) هماهنگ می‌شود، نه با جنسیت خود گوینده؛ برخلاف شکل‌های فعل *chahta/chahti* در بخش ۱، این ضمیر ملکی با تغییر گوینده تغییر نمی‌کند.'
  hi.a1.unit02.lesson03.teach.dialogue.line01:
    title: ارجن نمبر پریا را می‌پرسد
    gloss: ارجن به شکل غیررسمی از پریا نمبر تیلفونش را می‌پرسد.
    note: همین سوال غیررسمی نمبر تیلفون این درس دوباره آمده است.
  hi.a1.unit02.lesson03.teach.dialogue.line02:
    title: پریا نمبرش را می‌دهد و در عوض می‌پرسد
    gloss: پریا نمبر تیلفونش را رقم‌به‌رقم می‌خواند و بعد نمبر ارجن را می‌پرسد.
    note: همهٔ رقم‌های اینجا در درس ۱ این بخش آموخته شده بود.
  hi.a1.unit02.lesson03.teach.dialogue.line03:
    title: ارجن نمبرش را می‌دهد
    gloss: ارجن نمبر تیلفون خودش را رقم‌به‌رقم می‌خواند.
    note: باز هم همهٔ رقم‌ها از واژگان درس ۱ استند.
  hi.a1.unit02.lesson03.teach.dialogue.line04:
    title: پریا سن ارجن را می‌پرسد
    gloss: پریا تشکر می‌کند و به شکل غیررسمی سنش را می‌پرسد.
    note: Shukriya («تشکر») با تغییر سطح رسمیت عوض نمی‌شود، مثل کارت shukriya در بخش ۱.
  hi.a1.unit02.lesson03.teach.dialogue.line05:
    title: ارجن سنش را می‌گوید و در عوض می‌پرسد
    gloss: ارجن می‌گوید بیست ساله است، بعد سن پریا را می‌پرسد.
    note: Tumhari? به‌تنهایی راه کوتاه و طبیعی برای برگرداندن سوال است.
  hi.a1.unit02.lesson03.teach.dialogue.line06:
    title: پریا سنش را می‌گوید
    gloss: پریا می‌گوید سی ساله است.
    note: Meri umra tees saal hai همان الگوی جمله‌ای است که پیشتر در همین درس آمد.
  hi.a1.unit02.lesson03.teach.dialogue.line07:
    title: ارجن گفت‌وگو را تمام می‌کند
    gloss: ارجن با خوشحالی واکنش نشان می‌دهد و می‌گوید دوباره او را می‌بیند.
    note: Accha و phir milenge هر دو از واژگان خداحافظی بخش ۱ استند.
  hi.a1.unit02.lesson03.teach.dialogue.line08:
    title: پریا گفت‌وگو را تمام می‌کند
    gloss: پریا موافقت می‌کند و به شکل دوستانه می‌گوید «باز می‌بینیم».‌
    note: Theek hai و phir milte hain هر دو از واژگان خداحافظی بخش ۱ استند.
