    - من معلم هستم (زن).
  hi.a1.unit17.lesson01.teach.grammar_occupation_gender:
    title: Mein + شغل + hoon
    gloss: '«Mein + شغل + hoon» برای گفتن شغل است، همان قالب قدیمی «mein...hoon» از واحد ۱. بعضی شغل‌ها با جنسیت خود گوینده تغییر می‌کنند: «shikshak» (مرد)، «shikshika» (زن)، درست مثل پایان -ता/-ती فعل که در واحد ۱۰ تغییر می‌کرد. «Doctor» و «engineer» تغییر نمی‌کنند؛ برای هر دو جنس یک کلمه است.'
    note: تقسیم دوگانه (اسم‌هایی که با جنسیت تغییر می‌کنند در برابر واژه‌های قرضی بدون تغییر) پیش از هر تمرین به‌صراحت بیان می‌شود.
