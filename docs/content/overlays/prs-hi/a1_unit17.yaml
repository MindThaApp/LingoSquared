    gloss: معلم (مرد)، معلم (زن)
    note: یک جفت اسم تازهٔ شغل. برخلاف بیشتر اسم‌هایی که تا حالا آموخته‌اید، این اسم با جنسیت خود گوینده تغییر می‌کند؛ یادداشت دستوری همین درس را ببینین.
    example_gloss:
