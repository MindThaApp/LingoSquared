    example_gloss: او داکتر است.
  hi.a1.unit17.lesson01.teach.mein_doctor_hoon_phrase:
    title: من داکتر هستم.
    gloss: من داکتر هستم.
    note: الگوی معرفی، با یک کلمهٔ مرور‌شده.
