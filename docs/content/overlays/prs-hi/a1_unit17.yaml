    note: یک اسم شغل جدید که مثل *डॉक्टर* برای مرد و زن تغییر نمی‌کند.
    example_gloss: او انجنیر است.
  hi.a1.unit17.lesson01.teach.mein_engineer_hoon_phrase:
    title: من انجنیر هستم.
    gloss: من انجنیر هستم.
    note: الگوی معرفی، با دومین شغل تازهٔ این درس.
  hi.a1.unit17.lesson02.teach.kahan_review:
