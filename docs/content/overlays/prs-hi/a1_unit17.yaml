  hi.a1.unit17.lesson02.teach.mein_daftar_mein_kaam_karta_hoon_phrase:
    title: من در دفتر کار می‌کنم.
    gloss: من در دفتر کار می‌کنم.
    note: الگوی محل کار، با کلمهٔ دفتر و شکل مذکر.
  hi.a1.unit17.lesson02.teach.grammar_workplace:
    title: محل + mein + kaam karta/karti hoon
    gloss: '«[محل] + mein + kaam karta/karti hoon» سه بخشِ آشنا را کنار هم می‌آورد: «mein» (واحد ۱، «London mein rehta hoon»)، «kaam» (واحد ۱۰/۱۱) و شکل -ता/-ती/-ते از «karna» («nashta karta hoon» در واحد ۱۰ و «kya tum yog karti ho?» در واحد ۱). این دستور تازه نیست؛ برای بار اول همین سه بخش در یک جمله جمع شده‌اند.'
    note: هر بخش آموخته‌شده با شمارهٔ واحدش نام برده می‌شود و بعد با هم ترکیب می‌شوند، مثل همهٔ یادداشت‌های دستوری پیشین.
  hi.a1.unit17.lesson03.teach.roz_review:
    title: 'مرور: هر روز'
    gloss: هر روز
    note: در واحد ۱۰ آموخته شد؛ اینجا برای بیان برنامهٔ روزانهٔ کار دوباره می‌آید.
    example_gloss: من هر روز کار می‌کنم.
  hi.a1.unit17.lesson03.teach.jaana_forms_review:
    title: 'مرور: می‌روی (تو، زن / تو، مرد) / می‌روم (من، مرد)'
    gloss: می‌روی (تو، زن، غیررسمی)، می‌روی (تو، مرد، غیررسمی)، می‌روم (من، مرد)
    note: شکل‌های -ता/-ती/-ते از *jana* (رفتن) که در واحد ۱۰ معرفی شد؛ اینجا برای رفت‌وآمد روزانه به محل کار دوباره می‌آید.
    example_gloss:
    - من هر روز به مکتب می‌روم (گوینده زن).
    - تو هر روز به دفتر می‌روی؟ (به یک مرد)
  hi.a1.unit17.lesson03.teach.bhi_haan_review:
    title: 'مرور: هم، بلی'
    gloss: هم، بلی
    note: هر دو قبلاً آموخته شده‌اند (واحد ۱ و واحد ۱/۶/۱۳)؛ در گفتگوی این درس دوباره می‌آیند.
    example_gloss: بلی، من هم خوشم آمد.
  hi.a1.unit17.lesson03.teach.dialogue.line01:
    title: ارجن از پریا دربارهٔ کارش می‌پرسد
    gloss: پریا، تو چه کار می‌کنی؟
  hi.a1.unit17.lesson03.teach.dialogue.line02:
    title: پریا می‌گوید در یک مکتب معلم است
    gloss: من معلم هستم. من در مکتب کار می‌کنم.
  hi.a1.unit17.lesson03.teach.dialogue.line03:
    title: ارجن می‌پرسد که هر روز به مکتب می‌رود یا نه
    gloss: خوب است! تو هر روز به مکتب می‌روی؟
  hi.a1.unit17.lesson03.teach.dialogue.line04:
    title: پریا تأیید می‌کند و همین سؤال را از ارجن می‌پرسد
    gloss: بلی، من هر روز به مکتب می‌روم. تو چه کار می‌کنی؟
  hi.a1.unit17.lesson03.teach.dialogue.line05:
    title: ارجن می‌گوید در یک دفتر انجنیر است
    gloss: من انجنیر هستم. من در دفتر کار می‌کنم.
  hi.a1.unit17.lesson03.teach.dialogue.line06:
    title: پریا می‌پرسد که او هم هر روز به دفتر می‌رود یا نه
    gloss: بسیار خوب! تو هم هر روز به دفتر می‌روی؟
  hi.a1.unit17.lesson03.teach.dialogue.line07:
    title: ارجن تأیید می‌کند
    gloss: بلی، من هر روز به دفتر می‌روم.
  hi.a1.unit17.lesson03.teach.dialogue.line08:
    title: پریا از او تشکر می‌کند
    gloss: خوب است، تشکر.
  hi.a1.unit17.lesson03.teach.grammar_summary:
    title: سه قاعدهٔ اصلی
    gloss: 'سه قاعدهٔ اصلی این واحد: (۱) «mein + شغل + hoon» برای گفتن شغل است (مثلاً «mein shikshika hoon») و بعضی شغل‌ها با جنسیت خود گوینده تغییر می‌کنند؛ (۲) «[محل] + mein + kaam karta/karti hoon» برای گفتن محل کار است (مثلاً «mein daftar mein kaam karta hoon»)؛ (۳) «roz [محل] jata/jati hoon» برای گفتن عادت روزانه است، با همان قاعدهٔ -ता/-ती از واحد ۱۰.'
    note: خلاصهٔ پایانی که دستور کل واحد را به هم وصل می‌کند، مثل یادداشت دستوری واحدهای ۱۵ و ۱۶.
  hi.a1.unit17.lesson03.teach.work_profile_reading:
    title: خواندن یک معرفی کوتاه
    gloss: پریا معلم است. او در مکتب کار می‌کند. ارجن انجنیر است. او در دفتر کار می‌کند.
    note: یک معرفی کوتاه و مستقیم که دقیقاً همان واقعیت‌های گفتگو را می‌آورد، بدون ادعای تازه؛ برای مهارت «خواندن یک معرفی کوتاه از کار» مناسب است.
    glosses:
      शिक्षिका: معلم (زن)
      स्कूल: مکتب
      काम: کار کردن
      करती: می‌کند / کار می‌کند (مؤنث، از करना)
      इंजीनियर: انجنیر
      दफ़्तर: دفتر
      करता: می‌کند / کار می‌کند (مذکر، از करना)
