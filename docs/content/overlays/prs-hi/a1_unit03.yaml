teaching:
  hi.a1.unit03.lesson01.teach.aaj:
    title: امروز
    gloss: امروز
    note: کلمه‌ای که تقریباً در هر جملهٔ این درس دوباره از آن استفاده می‌کنین.
    example_gloss: امروز هوا خوب است.
  hi.a1.unit03.lesson01.teach.somvar:
    title: دوشنبه
    gloss: دوشنبه
    note: از نام सोम (ماه) گرفته شده است؛ یعنی «روز ماه».
    example_gloss: صنف یوگا روز دوشنبه است.
  hi.a1.unit03.lesson01.teach.mangalvar:
    title: سه‌شنبه
    gloss: سه‌شنبه
    note: از نام मंगल (مریخ) گرفته شده است؛ بیشتر نام‌های روزهای هفته در هندی همین الگو را دارند.
    example_gloss: امروز سه‌شنبه است.
  hi.a1.unit03.lesson01.teach.budhvar:
    title: چهارشنبه
    gloss: چهارشنبه
    note: از نام बुध (عطارد) گرفته شده است.
    example_gloss: امروز چهارشنبه است.
  hi.a1.unit03.lesson01.teach.guruvar:
    title: پنجشنبه
    gloss: پنجشنبه
    note: از نام गुरु (مشتری) گرفته شده است.
    example_gloss: امروز پنجشنبه است.
  hi.a1.unit03.lesson01.teach.shukravar:
    title: جمعه
    gloss: جمعه
    note: از نام शुक्र (زهره) گرفته شده است.
    example_gloss: روز جمعه صنف یوگا نیست.
  hi.a1.unit03.lesson01.teach.shanivar:
    title: شنبه
    gloss: شنبه
    note: از نام शनि (زحل) گرفته شده است.
    example_gloss: امروز شنبه است.
  hi.a1.unit03.lesson01.teach.ravivar:
    title: یکشنبه
    gloss: یکشنبه
    note: از रवि گرفته شده که در سنسکریت یکی از نام‌های آفتاب است؛ یعنی «روز آفتاب».
    example_gloss: امروز یکشنبه است.
  hi.a1.unit03.lesson01.teach.kaun_sa_din_hai:
    title: پرسیدن اینکه امروز چه روز است
    gloss: امروز چه روز است؟
    note: '*Kaun sa* («کدام») با اسم مذکر *din* («روز») هماهنگ است؛ شکل مؤنثش، *kaun si*، را بعداً با اسم‌های مؤنث می‌بینین.'
  hi.a1.unit03.lesson01.teach.yoga_class_monday:
    title: گفتن اینکه یک برنامه در کدام روز است
    gloss: صنف یوگا روز دوشنبه است.
    note: '*Ko* بعد از نام روز یعنی «در / به روز» — *somvar ko* یعنی «روز دوشنبه»؛ برای همهٔ روزهای هفته همین الگو است.'
  hi.a1.unit03.lesson01.teach.no_class_friday:
    title: گفتن اینکه یک برنامه در یک روز نیست
    gloss: روز جمعه صنف یوگا نیست.
    note: Nahin جمله را منفی می‌کند؛ ko هنوز هم روز را نشان می‌دهد و اینجا برای تأکید اول جمله آمده است.
  hi.a1.unit03.lesson02.teach.jan_feb_mar:
    title: جنوری، فبروری، مارچ
    gloss: جنوری، فبروری، مارچ
    note: نام ماه‌ها در هندی بیشتر قرضی‌اند و وقتی الگو را بدانین فوراً شناخته می‌شوند — قواعد تازه‌ای نیست، فقط واژه‌ها استند.
    example_gloss:
    - تولد من در جنوری است.
    - رخصتی بعدی در فبروری است.
    - تولد من در مارچ است.
  hi.a1.unit03.lesson02.teach.apr_may_jun:
    title: اپریل، می، جون
    gloss: اپریل، می، جون
    note: همان الگوی قابل‌شناسایی سه ماه اول.
    example_gloss:
    - رخصتی بعدی در اپریل است.
    - تولد من در می است.
    - رخصتی بعدی در جون است.
  hi.a1.unit03.lesson02.teach.jul_aug_sep:
    title: جولای، اگست، سپتمبر
    gloss: جولای، اگست، سپتمبر
    note: Sitambar اینجا با انوسوار (सितंबर) نوشته شده؛ نوشتن با «م» نیمه (सितम्बर) هم رایج و به همان اندازه درست است.
    example_gloss:
    - تولد من در جولای است.
    - رخصتی بعدی در اگست است.
    - تولد من در سپتمبر است.
  hi.a1.unit03.lesson02.teach.oct_nov_dec:
    title: اکتوبر، نومبر، دسمبر
    gloss: اکتوبر، نومبر، دسمبر
    note: Navambar و disambar هم مثل sitambar با انوسوار نوشته شده‌اند؛ نوشتن नवम्बर و दिसम्बर (با «م» نیمه) هم رایج و به همان اندازه درست است.
    example_gloss:
    - رخصتی بعدی در اکتوبر است.
    - تولد من در ماه نومبر است.
    - رخصتی بعدی در دسمبر است.
  hi.a1.unit03.lesson02.teach.tareekh:
    title: تاریخ
    gloss: تاریخ
    note: '*Tareekh* اسم مؤنث است — کلمهٔ پرسشی‌اش شکل مؤنث می‌گیرد (*kitni tareekh*، نه *kitna tareekh*)، همان الگوی هماهنگی که واحد ۲ با *keemat* و *umra* یاد داد.'
    example_gloss: امروز سوم است.
  hi.a1.unit03.lesson02.teach.mein_postposition:
    title: در (با نام ماه)
    gloss: در — با نام ماه استفاده می‌شود
    note: '*Mein* برای ماه همان کاری را می‌کند که *ko* برای روز می‌کند: *janvari mein* یعنی «در جنوری»، هرگز *janvari ko* نمی‌شود.'
  hi.a1.unit03.lesson02.teach.aaj_kitni_tareekh_hai:
    title: پرسیدن تاریخ
    gloss: تاریخ امروز چند است؟
    note: 'ترجمهٔ لفظی: «تاریخ امروز چندم است» — kitni با tareekh که مؤنث است هماهنگ می‌شود.'
  hi.a1.unit03.lesson02.teach.aaj_teen_tareekh_hai:
    title: گفتن تاریخ فقط با عدد
    gloss: امروز سوم است.
    note: هندی تاریخ را با عدد ساده می‌گوید (*teen*، «سه»)، نه با عدد ترتیبی مثل «سوم» — کلمهٔ جداگانه‌ای برای تاریخ لازم نیست، فقط همان عددهایی که بلدید.
  hi.a1.unit03.lesson02.teach.aaj_teen_january_hai:
    title: گفتن تاریخ همراه با ماه
    gloss: امروز سوم جنوری است.
    note: همان الگوی عدد ساده، حالا با نام ماه بعد از آن.
  hi.a1.unit03.lesson03.teach.kab:
    title: کی
    gloss: کی
    note: یک کلمهٔ پرسشی ساده و بسیار پرکاربرد.
    example_gloss: صنف بعدی کی است؟
  hi.a1.unit03.lesson03.teach.agli:
    title: بعدی
    gloss: بعدی
    note: '*Agli* شکل مؤنث است — در هندی روزمره *class* (क्लास) مؤنث حساب می‌شود، پس *agli* می‌گیرد، نه *agla* مذکر.'
    example_gloss: صنف بعدی روز سه‌شنبه است.
  hi.a1.unit03.lesson03.teach.das_reprise:
    title: ده
    gloss: ده
    note: از واحد ۲ دوباره آمده — اینجا برای یک تاریخ واقعی لازم است.
    example_gloss: صنف بعدی دهم است.
  hi.a1.unit03.lesson03.teach.janmadin:
    title: تولد
    gloss: تولد
    note: اسم مذکر است — mera janmadin، هرگز meri janmadin نمی‌شود.
    example_gloss: تولد من در دسمبر است.
  hi.a1.unit03.lesson03.teach.tumhara_janmadin_kab_hai:
    title: پرسیدن روز تولد کسی، غیررسمی
    gloss: روز تولدت کی است؟ (غیررسمی)
    note: Tumhara با janmadin که مذکر است هماهنگ می‌شود.
  hi.a1.unit03.lesson03.teach.mera_janmadin_january_mein_hai:
    title: گفتن روز تولد خودتان
    gloss: روز تولد من در جنوری است.
    note: جواب کامل و طبیعی برای Tumhara janmadin kab hai?
  hi.a1.unit03.lesson03.teach.agli_class_kab_hai:
    title: پرسیدن اینکه صنف بعدی کی است
    gloss: صنف بعدی کی است؟
    note: agli (مؤنث، هماهنگ با «class») را با kab ترکیب می‌کند.
  hi.a1.unit03.lesson03.teach.agli_class_mangalvar_das_march:
    title: گفتن روز و تاریخ کامل
    gloss: صنف بعدی سه‌شنبه، دهم مارچ است.
    note: 'روز هفته و تاریخ با هم گفته می‌شوند: اول روز، بعد عدد تاریخ و ماه.'
  hi.a1.unit03.lesson03.teach.dialogue.line01:
    title: ارجن دربارهٔ صنف بعدی می‌پرسد
    gloss: ارجن می‌پرسد صنف بعدی یوگا کی است.
    note: همان سوال این درس است، فقط برای وضاحت yog به آن اضافه شده.
  hi.a1.unit03.lesson03.teach.dialogue.line02:
    title: پریا روز و تاریخ را می‌گوید
    gloss: پریا می‌گوید صنف بعدی سه‌شنبه، دهم مارچ است.
    note: همان جملهٔ روز و تاریخ این درس است.
  hi.a1.unit03.lesson03.teach.dialogue.line03:
    title: ارجن از او تشکر می‌کند
    gloss: ارجن می‌گوید خوب است، تشکر.
    note: Theek hai و shukriya هر دو از واژه‌های واحد ۱ دوباره آمده‌اند.
  hi.a1.unit03.lesson03.teach.dialogue.line04:
    title: پریا جواب می‌دهد
    gloss: پریا می‌گوید مشکلی نیست.
    note: Koi baat nahin راه بسیار رایج و طبیعی برای گفتن «خواهش می‌کنم» یا «مشکلی نیست» است.
  hi.a1.unit03.lesson03.teach.dialogue.line05:
    title: ارجن روز تولد پریا را می‌پرسد
    gloss: ارجن می‌پرسد روز تولد پریا کی است.
    note: همان سوال غیررسمی این درس دربارهٔ روز تولد است.
  hi.a1.unit03.lesson03.teach.dialogue.line06:
    title: پریا جواب می‌دهد
    gloss: پریا می‌گوید روز تولدش در جنوری است.
    note: همان جملهٔ جواب این درس است.
  hi.a1.unit03.lesson03.teach.dialogue.line07:
    title: ارجن واکنش نشان می‌دهد و از روز تولد خودش می‌گوید
    gloss: ارجن با خوشحالی واکنش نشان می‌دهد، بعد می‌گوید روز تولدش در دسمبر است.
    note: Accha از واژه‌های واحد ۱ است؛ دسمبر پیشتر در درس ۲ همین واحد یاد داده شد.
  hi.a1.unit03.lesson03.teach.dialogue.line08:
    title: پریا گفت‌وگو را تمام می‌کند
    gloss: پریا موافقت می‌کند و یک خداحافظی دوستانه می‌گوید.
    note: Theek hai و phir milte hain هر دو از واژه‌های خداحافظی واحد ۱ دوباره آمده‌اند.
