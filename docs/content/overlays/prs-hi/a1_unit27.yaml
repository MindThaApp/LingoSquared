teaching:
  hi.a1.unit27.lesson01.teach.khush_udas_naraz:
    title: خوش، غمگین و خشمگین
    gloss: خوش، غمگین، خشمگین
    note: '*खुश*، *उदास* و *नाराज़* واژه‌های ساده‌ی احساس‌اند که با *हूँ* یا *है* («هستم»، «است») می‌آیند؛ برای مذکر و مؤنث تغییر نمی‌کنند.'
    example_gloss:
    - من خوش هستم.
    - من غمگین استم.
    - من خشمگین هستم.
  hi.a1.unit27.lesson01.teach.main_khush_hoon:
    title: گفتن اینکه خوش استی
    gloss: من خوش هستم.
    note: '*मैं खुश हूँ* از این الگو پیروی می‌کند: *मैं* + احساس + *हूँ*، مثل «من ... هستم».'
  hi.a1.unit27.lesson01.teach.main_naraz_naheen:
    title: مقایسه‌ی احساسات
    gloss: من خشمگین نیستم، غمگین هستم.
    note: '*नहीं* درست پیش از *हूँ* می‌آید: *नाराज़ नहीं हूँ*. بخش دوم بعد از آن احساس واقعی را می‌گوید.'
  hi.a1.unit27.lesson02.teach.tum_khush_kyon:
    title: پرسیدن سبب
    gloss: چرا خوش استی؟
    note: '*क्यों* («چرا») پیش از واژه‌ی اصلی می‌آید: *तुम खुश क्यों हो?*. *तुम* «تو»ی غیررسمی است.'
  hi.a1.unit27.lesson02.teach.main_khush_hoon:
    title: گفتن سبب
    gloss: من خوش هستم چون یک آپارتمان نو دارم.
    note: '*क्योंकि* دلیل را معرفی می‌کند. *मेरे पास ... है* یعنی «من ... دارم» و فعل *है* در آخر می‌آید.'
  hi.a1.unit27.lesson02.teach.main_udas_hoon:
    title: یک سبب منفی
    gloss: من غمگین هستم چون باران می‌بارد.
    note: '*बारिश हो रही है* یعنی «باران می‌بارد» (در اصل «باران در حال شدن است»).'
  hi.a1.unit27.lesson03.teach.narvas:
    title: عصبی
    gloss: عصبی
    note: کلمه‌ی معمول برای دلواپسی و اضطراب.
    example_gloss: من از اولین نوبت کاری‌ام دلواپس هستم.
  hi.a1.unit27.lesson03.teach.main_apnee_pahlee:
    title: گفتن اینکه از چه دلواپس استی
    gloss: من از اولین نوبت کاری‌ام دلواپس هستم.
    note: '*को लेकर* یعنی «درباره‌ی / بابت» و بعد از اسم می‌آید: *शिफ़्ट को लेकर*. *अपनी* («مالِ خودم») با *शिफ़्ट* که مؤنث است هماهنگ می‌شود.'
  hi.a1.unit27.lesson03.teach.chinta_mat_karo:
    title: دلداری دادن به کسی
    gloss: غم نخور.
    note: '*चिंता मत करो* یعنی «غم نخور/ غصه نخور» به شکل دوستانه: *मत* + *करो* فرمانِ *तुम* همراه با نفی است.'
  hi.a1.unit27.lesson04.teach.arjun_kaisa_mahsoos:
    title: پرسیدن اینکه کسی چه احساس دارد
    gloss: ارجن چه احساسی دارد؟
    note: '*कैसा महसूस कर रहा है* یعنی «چه احساسی دارد». *कैसा* با شخص هماهنگ می‌شود، پس برای یک خانم *कैसी* می‌آید.'
  hi.a1.unit27.lesson04.teach.vah_narvas_mahsoos:
    title: گفتن اینکه کسی چه احساس دارد
    gloss: او دلواپس است.
    note: 'در هندی اینجا واژه‌ی جداگانه‌ای برای «خودش» نیامده: *वह नर्वस महसूस कर रहा है* فقط *वह* و *रहा है* را دارد.'
  hi.a1.unit27.lesson04.teach.vah_narvas_kyon:
    title: پرسیدن اینکه چرا کسی چنین احساسی دارد
    gloss: چرا او دلواپس است؟
    note: '*क्यों* درست پیش از گروه فعلی می‌آید: *वह नर्वस क्यों महसूस कर रहा है?*'
  hi.a1.unit27.lesson05.teach.hay_priya_main:
    title: خواندن پیام درباره‌ی احساسات
    gloss: سلام پریا، من بابت اولین شفتم که تنها هستم کمی دلواپسم. اما خوشحال هم هستم، چون کار تازه و آپارتمان تازه دارم. فکر می‌کنم همه‌چیز خوب می‌شود.
    note: بفهم که نویسنده از چه دلواپس است، چه چیز او را خوش می‌کند و دید کلی‌اش چیست.
    glosses:
      थोड़ा: کمی
      नर्वस: عصبی
      पहली: اولین
      शिफ़्ट: نوبت کاری
      अकेले: تنها
      खुश: خوشحال
      क्योंकि: چون
      नई: نو
      नौकरी: کار
      नया: نو
      फ़्लैट: آپارتمان
      लगता: فکر کردن
      होगा: 'درست شدن (اینجا: خوب می‌شود)'
  hi.a1.unit27.lesson06.teach.priya_hay_arjun:
    title: پریا از احساس ارجن می‌پرسد
    gloss: 'پریا: سلام ارجن، بابت اولین شفتت چه احساسی داری؟'
    note: '*को लेकर* دوباره آمده: *अपनी पहली शिफ़्ट को लेकर* («درباره‌ی اولین شفتت»). *तुम* غیررسمی است.'
  hi.a1.unit27.lesson06.teach.arjun_sach_kahoon:
    title: ارجن اعتراف می‌کند که دلواپس است
    gloss: 'ارجن: راستش را بگویم، کمی دلواپسم.'
    note: '*सच कहूँ तो* («اگر راست بگویم») اعتراف را نرم‌تر می‌کند.'
  hi.a1.unit27.lesson06.teach.priya_chinta_mat:
    title: پریا به او دلداری می‌دهد
    gloss: 'پریا: غصه نخور، تو این کار را خوب کرده می‌توانی!'
    note: '*तुम यह अच्छे से कर सकते हो* یعنی «تو این را خوب کرده می‌توانی» و *अच्छे से* یعنی «خوب».'
  hi.a1.unit27.lesson06.teach.arjun_shukriya_isse:
    title: ارجن از او تشکر می‌کند
    gloss: 'ارجن: تشکر، واقعاً کمک می‌کند.'
    note: '*इससे मदद मिलती है* در اصل یعنی «از این کمک به دست می‌آید»: کمک‌کننده با *से* نشان داده می‌شود.'
  hi.a1.unit27.lesson06.teach.priya_aur_bad:
    title: پریا نتیجه را پیش‌بینی می‌کند
    gloss: 'پریا: و بعداً حتماً خیلی خوشحال می‌شوی و به خودت افتخار می‌کنی.'
    note: '*ज़रूर* («حتماً») پیش‌بینی را مطمئن می‌کند و *तुम्हें गर्व होगा* یعنی «احساس افتخار خواهی کرد».'
  hi.a1.unit27.lesson06.teach.arjun_han_mujhe:
    title: ارجن موافقت می‌کند
    gloss: 'ارجن: بلی، من هم همین‌طور فکر می‌کنم.'
    note: '*मुझे भी ऐसा ही लगता है* («به من هم همین‌طور به نظر می‌رسد») راه طبیعی موافقت است و *मुझे* نشان می‌دهد چه کسی این احساس را دارد.'
  hi.a1.unit27.lesson06.teach.arjun_narvas_hai:
    title: 'ضمیرها: उसकी'
    gloss: ارجن دلواپس است. پریا به او کمک می‌کند.
    note: '*उसकी* یعنی «مالِ او» و با *मदद* که مؤنث است هماهنگ می‌شود؛ پس *उसकी मदद करना* یعنی «به او کمک کردن»؛ *है* و *करती है* فعل‌های سوم شخص‌اند.'
