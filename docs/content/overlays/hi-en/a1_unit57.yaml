    example_gloss: यह सिनेमाघर बहुत मशहूर है।
  en.a1.unit57.lesson01.teach.ticket:
    title: ticket
    gloss: टिकट
    note: '*ticket* का मतलब है टिकट।'
    example_gloss: मुझे एक टिकट ख़रीदना है।
  en.a1.unit57.lesson01.teach.showtime:
    title: showtime
    gloss: शो का समय (फ़िल्म शुरू होने का समय)
    note: '*showtime* का मतलब है शो का समय, यानी वह वक़्त जब फ़िल्म शुरू होती है।'
    example_gloss: फ़िल्म के शो का समय क्या है?
  en.a1.unit57.lesson01.teach.seat:
    title: seat
    gloss: सीट / कुर्सी
    note: '*seat* का मतलब है सीट या बैठने की जगह।'
    example_gloss: क्या यह सीट ख़ाली है?
  en.a1.unit57.lesson01.teach.screen:
    title: screen
    gloss: पर्दा / स्क्रीन
    note: '*screen* का मतलब है स्क्रीन, यानी वह पर्दा जिस पर फ़िल्म दिखती है।'
    example_gloss: स्क्रीन बहुत बड़ी है।
  en.a1.unit57.lesson01.teach.popcorn:
    title: popcorn
    gloss: पॉपकॉर्न
    note: '*popcorn* का मतलब है पॉपकॉर्न।'
    example_gloss: हम सिनेमाघर में हमेशा पॉपकॉर्न ख़रीदते हैं।
  en.a1.unit57.lesson02.teach.what_time_does_the_film_start:
    title: What time does the film start?
    gloss: फ़िल्म कितने बजे शुरू होती है?
    note: '*does the film start* में सवाल बनाने के लिए *does* लगता है, क्योंकि मुख्य क्रिया *start* है।'
  en.a1.unit57.lesson02.teach.two_tickets_for_the_seven_oclock_show:
    title: Two tickets for the seven o'clock show, please.
    gloss: सात बजे के शो के दो टिकट दीजिए।
    note: '*for the seven o''clock show* बताता है कि टिकट किस ख़ास शो के लिए हैं।'
  en.a1.unit57.lesson02.teach.can_i_have_some_popcorn:
    title: Can I have some popcorn, please?
    gloss: क्या मुझे थोड़ा पॉपकॉर्न मिल सकता है?
    note: '*Can I have...?* कुछ माँगने का सीधा और आम तरीक़ा है।'
  en.a1.unit57.lesson02.teach.how_much_is_that_in_total:
    title: How much is that in total?
    gloss: कुल कितना हुआ?
    note: '*in total* का मतलब है कुल मिलाकर; इसे आख़िरी रक़म पूछने के लिए बोलते हैं।'
  en.a1.unit57.lesson02.teach.thats_twenty_dollars:
    title: That's twenty dollars, please.
    gloss: यह बीस डॉलर हुए।
    note: '*That''s* के साथ रक़म बोलना कीमत बताने का एक तय तरीक़ा है।'
  en.a1.unit57.lesson02.teach.i_really_liked_it:
    title: I really liked it!
    gloss: मुझे यह सचमुच पसंद आई!
    note: 'अंग्रेज़ी में यहाँ क्रिया *like* और कर्म *it* आते हैं: *I liked it* का सीधा अर्थ "मैंने इसे पसंद किया" है, जबकि हिंदी में हम आम तौर पर "मुझे पसंद आई" कहते हैं। इस वाक्य को शब्द-दर-शब्द नहीं, पूरा याद कीजिए।'
  en.a1.unit57.lesson03.teach.dialogue_line1:
    title: डैनियल शो का समय पूछता है
    gloss: 'डैनियल कहता है: नमस्ते! फ़िल्म कितने बजे शुरू होती है?'
    note: '*does the film start* में सवाल बनाने के लिए *does* लगता है।'
  en.a1.unit57.lesson03.teach.dialogue_line2:
    title: शो का समय
    gloss: 'टिकट देने वाला कर्मचारी कहता है: अगला शो सात बजे है।'
    note: '*at seven o''clock* में समय के लिए *at* लगता है; हिंदी के "सात बजे" में ऐसा कोई अलग शब्द नहीं आता।'
  en.a1.unit57.lesson03.teach.dialogue_line3:
    title: डैनियल टिकट माँगता है
    gloss: 'डैनियल कहता है: बढ़िया। क्या हमें दो टिकट मिल सकते हैं?'
    note: 'यह एक अलग बात है: टिकटों की गिनती (दो)।'
  en.a1.unit57.lesson03.teach.dialogue_line4:
    title: टिकटों की कीमत
    gloss: 'टिकट देने वाला कर्मचारी कहता है: ज़रूर। यह सोलह डॉलर हुए।'
    note: 'यह एक अलग बात है: दोनों टिकटों की कुल कीमत।'
  en.a1.unit57.lesson03.teach.dialogue_line5:
    title: लैला पॉपकॉर्न माँगती है
    gloss: 'लैला कहती है: क्या हमें थोड़ा पॉपकॉर्न मिल सकता है?'
    note: यह एक अनुरोध है, कीमत की कोई नई बात नहीं।
  en.a1.unit57.lesson03.teach.dialogue_line6:
    title: पॉपकॉर्न की कीमत
    gloss: 'टिकट देने वाला कर्मचारी कहता है: ज़रूर। पॉपकॉर्न चार डॉलर का है।'
    note: 'यह दूसरी अलग बात है: पॉपकॉर्न की कीमत, टिकटों से अलग।'
  en.a1.unit57.lesson03.teach.dialogue_line7:
    title: डैनियल कुल रक़म पूछता है
    gloss: 'डैनियल कहता है: कुल कितना हुआ?'
    note: '*in total* सारी कीमतों का जोड़ पूछता है।'
  en.a1.unit57.lesson03.teach.dialogue_line8:
    title: कुल रक़म
    gloss: 'टिकट देने वाला कर्मचारी कहता है: यह बीस डॉलर हुए।'
    note: 'यह तीसरी अलग बात है: कुल रक़म, जो टिकटों और पॉपकॉर्न की अलग-अलग कीमतों से अलग है।'
  en.a1.unit57.lesson03.teach.dialogue_line9:
    title: लैला से इंतज़ार नहीं हो रहा
    gloss: 'लैला कहती है: शुक्रिया! मुझसे इसे देखने का इंतज़ार नहीं हो रहा।'
    note: '*I can''t wait to...* उत्साह जताने की एक तय अभिव्यक्ति है।'
  en.a1.unit57.lesson04.teach.cinema_schedule:
    title: सिनेमा का कार्यक्रम
    gloss: 'सिनेमा का कार्यक्रम: Star Journey - 7:00, $8. The Great Race - 5:00, $10. Funny Family - 9:00, $6.'
    note: कार्यक्रम में तीन फ़िल्में हैं, हर एक का शो का समय और टिकट की कीमत दी गई है।
  en.a1.unit57.lesson04.teach.reading_passage:
    title: 'पाठ: सिनेमाघर में एक शाम'
    gloss: एक शाम डैनियल और लैला ने सिनेमाघर में साथ फ़िल्म देखने का फ़ैसला किया। उन्होंने पूछा कि फ़िल्म कितने बजे शुरू होती है, और टिकट देने वाले कर्मचारी ने बताया कि अगला शो, Star Journey, सात बजे है। उन्होंने सोलह डॉलर में दो टिकट और चार डॉलर में पॉपकॉर्न का एक पैकेट ख़रीदा। कुल बीस डॉलर हुए। उन्होंने साथ मिलकर फ़िल्म देखी, जो अंतरिक्ष यात्रियों के बारे में थी। वह बहुत मज़ेदार थी। फ़िल्म ख़त्म होने पर लैला ने कहा कि उसे वह सचमुच पसंद आई, और डैनियल ने कहा कि वह अगली फ़िल्म भी देखना चाहता है।
    note: '*watched* क्रिया *watch* (देखना) का भूतकाल है।'
