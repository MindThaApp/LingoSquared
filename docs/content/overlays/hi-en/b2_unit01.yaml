    gloss: प्रमाण, सबूत
    note: '*evidence* वे तथ्य, आँकड़े या उदाहरण हैं जिनसे आप अपने दावे का समर्थन करते हैं।'
    example_gloss: यह उदाहरण मिया को उसके दावे के लिए प्रमाण देता है।
  en.b2.unit01.lesson01.teach.counterargument:
    title: counterargument
    gloss: प्रति-तर्क, विरोधी तर्क
    note: '*counterargument* वह बिंदु है जो आपके दावे के विरुद्ध जाता है। अंग्रेज़ी में इसे एक ही शब्द के रूप में लिखा जाता है।'
    example_gloss: डैनियल एक प्रति-तर्क सामने रखता है।
  en.b2.unit01.lesson01.teach.rebut:
    title: rebut
    gloss: खंडन करना
    note: '*rebut* का अर्थ है अपना दावा छोड़े बिना किसी विरोधी तर्क का उत्तर देना।'
    example_gloss: मिया प्रमाण के साथ उस चिंता का खंडन करती है।
  en.b2.unit01.lesson01.teach.concede:
    title: concede
    gloss: मान लेना, स्वीकार करना
    note: '*concede* का अर्थ है यह मान लेना कि दूसरे पक्ष की कोई बात ठीक है। इसका मतलब अपना पूरा दावा छोड़ देना नहीं है।'
    example_gloss: आप अपने मुख्य दावे को छोड़े बिना किसी चिंता को स्वीकार कर सकते हैं।
  en.b2.unit01.lesson01.teach.outweigh:
    title: outweigh
    gloss: से अधिक भारी पड़ना, पर भारी होना
    note: '*outweigh* तब इस्तेमाल करें जब कोई लाभ, जोखिम या कारण किसी और चीज़ से ज़्यादा महत्वपूर्ण हो।'
    example_gloss: मज़बूत प्रमाण किसी चिंता पर भारी पड़ सकता है।
  en.b2.unit01.lesson02.teach.position_with_evidence:
    title: जोखिम मानना और अपने दावे पर कायम रहना
    gloss: मैं मानता/मानती हूँ कि योजना में जोखिम हैं, लेकिन प्रमाण अब भी आगे बढ़ने के पक्ष में है।
    note: '*I agree..., but...* पहले दूसरे पक्ष की बात मानता है। फिर *but the evidence still supports...* दिखाता है कि आपका दावा अपनी जगह कायम है।'
  en.b2.unit01.lesson02.teach.strongest_reason:
    title: अपना सबसे मज़बूत कारण बताना
    gloss: सबसे मज़बूत कारण यह है कि सर्वे के नतीजे एक जैसे रहे।
    note: '*The strongest reason is that...* आपके मुख्य समर्थन को प्रस्तुत करता है। *that* के बाद अंग्रेज़ी का क्रम याद रखें: पहले कर्ता, फिर क्रिया।'
  en.b2.unit01.lesson02.teach.fair_concern:
    title: उचित चिंता को स्वीकार करना
    gloss: यह एक उचित चिंता है; फिर भी आँकड़े दूसरी दिशा की ओर इशारा करते हैं।
    note: '*That is a fair concern; however,...* पेशेवर लगता है: आप चिंता को मानते हैं, लेकिन आँकड़ों से उसका खंडन करते हैं।'
  en.b2.unit01.lesson02.teach.grammar_argument_shape:
    title: किसी दावे का बचाव करना
    gloss: अपना दावा बताइए, प्रमाण दीजिए, सबसे मज़बूत विरोधी बात को स्वीकार कीजिए और फिर उसका खंडन कीजिए। That is a fair concern और However जैसे वाक्यांश आपको दावा छोड़े बिना समझदार और संतुलित दिखाते हैं।
    note: 'वाक्य में शब्दों का क्रम सीधा रखें: *the data points in the other direction*; क्रिया को बीच में या अंत में खिसकाकर *the data in the other direction points* न लिखें।'
  en.b2.unit01.lesson03.teach.retention:
    title: retention
    gloss: कर्मचारियों को बनाए रखना
    note: '*retention* का अर्थ यहाँ है कि कर्मचारी छोड़कर जाने के बजाय टीम में बने रहते हैं।'
    example_gloss: बेहतर कर्मचारी-प्रतिधारण का मतलब है कि कम कर्मचारी टीम छोड़ते हैं।
  en.b2.unit01.lesson03.teach.collaboration:
    title: collaboration
    gloss: सहयोग, मिलकर काम करना
    note: '*collaboration* का अर्थ है किसी काम या प्रोजेक्ट पर मिलकर काम करना। यह शब्द सकारात्मक है, जैसे हिंदी का "सहयोग"।'
    example_gloss: अच्छा सहयोग टीम को काम पूरा करने में मदद करता है।
  en.b2.unit01.lesson03.teach.reading_passage:
    title: 'पठन-पाठ: हाइब्रिड शेड्यूल का बचाव'
    gloss: 'मिया का तर्क है कि कंपनी को अगली तिमाही में भी हाइब्रिड शेड्यूल रखना चाहिए। उसका मुख्य दावा है कि हाइब्रिड काम प्रदर्शन घटाए बिना कर्मचारियों को टिकाए रखने में सुधार करता है। सबसे मज़बूत प्रमाण स्टाफ़ सर्वे है: हाइब्रिड टीमों के कर्मचारियों ने कम बार कहा कि वे दूसरी नौकरी ढूँढ रहे हैं। सबसे मज़बूत प्रति-तर्क यह है कि अगर लोग रोज़ दफ़्तर में न हों तो सहयोग कमज़ोर पड़ सकता है। मिया उस चिंता को मानती है, लेकिन प्रोजेक्ट के आँकड़ों से उसका खंडन करती है: हाइब्रिड टीमों ने काम समय पर पूरा किया और उनके रिव्यू स्कोर थोड़े ज़्यादा थे। इसी कारण वह निष्कर्ष निकालती है कि लाभ जोखिमों पर भारी पड़ते हैं।'
    note: 'यह पाठ एक पूरा तर्क खड़ा करता है: दावा, प्रमाण, प्रति-तर्क, खंडन और निष्कर्ष।'
  en.b2.unit01.lesson04.teach.q_keep_hybrid:
    title: मिया अपना दावा बताती है
    gloss: 'मिया कहती है: मुझे लगता है कि हमें अगली तिमाही के लिए हाइब्रिड शेड्यूल रखना चाहिए।'
    note: मिया एक स्पष्ट दावे से शुरुआत करती है जिसका बचाव किया जा सकता है।
  en.b2.unit01.lesson04.teach.a_strongest_reason:
    title: डैनियल कारण पूछता है
    gloss: 'डैनियल कहता है: आपका सबसे मज़बूत कारण क्या है?'
    note: डैनियल आम राय नहीं पूछ रहा, बल्कि सबसे मुख्य समर्थन पूछ रहा है।
  en.b2.unit01.lesson04.teach.q_retention_survey:
    title: मिया प्रमाण देती है
    gloss: 'मिया कहती है: सबसे मज़बूत कारण कर्मचारियों को टिकाए रखना है। स्टाफ़ सर्वे में हाइब्रिड काम करने वाले लोगों ने कम बार कहा कि वे दूसरी नौकरी ढूँढ रहे हैं।'
    note: मिया सिर्फ़ अपने एहसास पर नहीं, सर्वे के नतीजों पर भरोसा करती है।
  en.b2.unit01.lesson04.teach.a_collaboration_weaker:
    title: डैनियल प्रति-तर्क बताता है
    gloss: 'डैनियल कहता है: कुछ मैनेजर कहते हैं कि जब लोग रोज़ दफ़्तर में नहीं होते तो सहयोग कमज़ोर होता है।'
    note: यह वही प्रति-तर्क है जिसका उत्तर मिया को आगे देना है।
  en.b2.unit01.lesson04.teach.q_data_rebuttal:
    title: मिया आँकड़ों से खंडन करती है
    gloss: 'मिया कहती है: यह एक उचित चिंता है। फिर भी प्रोजेक्ट के आँकड़े इसका समर्थन नहीं करते। हाइब्रिड टीमों ने अपना काम समय पर पूरा किया और उनके रिव्यू स्कोर थोड़े ज़्यादा थे।'
    note: '*does not support it* में *does* इसलिए है कि अंग्रेज़ी में निषेध के लिए do-support की ज़रूरत होती है।'
  en.b2.unit01.lesson04.teach.a_benefits_outweigh:
    title: डैनियल स्थिति का सार बताता है
    gloss: 'डैनियल कहता है: तो आपका पक्ष यह है कि लाभ जोखिमों पर भारी पड़ते हैं?'
    note: '*outweigh* लाभों और जोखिमों के बीच तुलना दिखाता है।'
  en.b2.unit01.lesson04.teach.q_improve_routines:
    title: मिया समाधान के साथ बात खत्म करती है
    gloss: 'मिया कहती है: बिल्कुल। हमें मीटिंग की प्रक्रियाएँ सुधारनी चाहिए, शेड्यूल को बंद नहीं करना चाहिए।'
    note: मिया योजना का बचाव करती है, लेकिन साथ में एक व्यावहारिक सुधार भी सुझाती है।
