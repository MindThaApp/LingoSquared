teaching:
  en.a1.unit54.lesson01.teach.laundromat:
    title: laundromat
    gloss: लॉन्ड्रोमैट (पैसे देकर कपड़े धोने की दुकान)
    note: '*laundromat* का मतलब है वह जगह जहाँ वॉशिंग मशीनें होती हैं और आप पैसे देकर अपने कपड़े धो सकते हैं।'
    example_gloss: मैं आज लॉन्ड्रोमैट जा रहा हूँ।
  en.a1.unit54.lesson01.teach.washing_machine:
    title: washing machine
    gloss: वॉशिंग मशीन
    note: '*washing machine* का मतलब है वॉशिंग मशीन।'
    example_gloss: वॉशिंग मशीन ख़राब है।
  en.a1.unit54.lesson01.teach.dryer:
    title: dryer
    gloss: ड्रायर (कपड़े सुखाने की मशीन)
    note: '*dryer* का मतलब है कपड़े सुखाने की मशीन।'
    example_gloss: अपने कपड़े ड्रायर में डाल दीजिए।
  en.a1.unit54.lesson01.teach.quarters:
    title: quarters
    gloss: क्वार्टर (25 सेंट के अमेरिकी सिक्के)
    note: '*quarters* पच्चीस सेंट के अमेरिकी सिक्के हैं, जो लॉन्ड्रोमैट की मशीनों के लिए अक्सर चाहिए होते हैं। हिंदी में इनका कोई सटीक बराबर शब्द नहीं है, इसलिए *quarters* को अक्सर अंग्रेज़ी में ही कहा जाता है।'
    example_gloss: मशीनें क्वार्टर लेती हैं।
  en.a1.unit54.lesson01.teach.detergent:
    title: detergent
    gloss: कपड़े धोने का पाउडर / डिटर्जेंट
    note: '*detergent* का मतलब है कपड़े धोने का पाउडर या डिटर्जेंट।'
    example_gloss: कपड़े साफ़ करने के लिए आपको डिटर्जेंट चाहिए।
  en.a1.unit54.lesson01.teach.load:
    title: load
    gloss: एक बार में धुलने वाले कपड़े
    note: '*load* का मतलब यहाँ एक बार में धोए जाने वाले कपड़ों की मात्रा है।'
    example_gloss: मेरे पास धोने के लिए कपड़ों का बड़ा ढेर है।
  en.a1.unit54.lesson02.teach.id_like_to_wash_a_few_things:
    title: I'd like to wash a few things, please.
    gloss: मुझे कुछ चीज़ें धोनी हैं, कृपया।
    note: '*I''d like to* (*I would like to* का छोटा रूप) कुछ माँगने का विनम्र तरीक़ा है।'
  en.a1.unit54.lesson02.teach.do_you_have_change:
    title: Do you have change for the machines?
    gloss: क्या आपके पास मशीनों के लिए खुले पैसे हैं?
    note: यहाँ *change* का मतलब है खुले पैसे (छुट्टे सिक्के), "बदलाव" नहीं।
  en.a1.unit54.lesson02.teach.how_long_does_the_cycle_take:
    title: How long does the wash cycle take?
    gloss: एक धुलाई चक्र में कितनी देर लगती है?
    note: यहाँ *take* का मतलब है "(इतना समय) लगना", जो *the machines take quarters* वाले *take* से बिल्कुल अलग है; वहाँ *take* का मतलब "स्वीकार करना" है।
  en.a1.unit54.lesson02.teach.its_three_dollars_for_one_load:
    title: It's three dollars for one load.
    gloss: एक बार के कपड़ों के तीन डॉलर लगते हैं।
    note: '*for one load* का मतलब है "एक बार की धुलाई के लिए"।'
  en.a1.unit54.lesson02.teach.what_time_do_you_close:
    title: What time do you close?
    gloss: आप कितने बजे बंद करते हैं?
    note: '*do you close* में सवाल बनाने के लिए सहायक क्रिया *do* आई है।'
  en.a1.unit54.lesson02.teach.please_pick_up_by_nine:
    title: Please pick up your laundry by nine o'clock.
    gloss: कृपया अपने कपड़े नौ बजे तक ले जाइए।
    note: '*pick up* का मतलब है उठाकर ले जाना; *by nine o''clock* का मतलब है "नौ बजे तक" (उससे देर नहीं)।'
  en.a1.unit54.lesson03.teach.dialogue_line1:
    title: कर्मचारी उनका स्वागत करता है
    gloss: 'कर्मचारी कहता है: नमस्ते! क्या आपको वॉशिंग मशीन चाहिए?'
    note: '*Do you need...?* में सवाल बनाने के लिए सहायक क्रिया *do* आई है।'
  en.a1.unit54.lesson03.teach.dialogue_line2:
    title: लैला की वजह
    gloss: 'लैला कहती है: जी, हाँ। घर पर मेरी वॉशिंग मशीन ख़राब है।'
    note: '*at home* का मतलब है घर पर।'
  en.a1.unit54.lesson03.teach.dialogue_line3:
    title: डैनियल की माँग
    gloss: 'डैनियल कहता है: मेरे पास भी थोड़े-से कपड़े हैं। क्या मैं भी एक मशीन इस्तेमाल कर सकता हूँ?'
    note: यहाँ *too* का मतलब है "भी", जो वाक्य के अंत में आता है; *as well* का मतलब भी वही है और वह दूसरे वाक्य में है।
  en.a1.unit54.lesson03.teach.dialogue_line4:
    title: कर्मचारी सिक्कों के बारे में बताता है
    gloss: 'कर्मचारी कहता है: ज़रूर! मशीनें क्वार्टर लेती हैं।'
    note: यहाँ *take* का मतलब है "स्वीकार करना" (भुगतान के रूप में); आगे *The wash cycle takes thirty minutes* वाले *take* से फ़र्क़ समझिए, जहाँ *take* का मतलब "समय लगना" है।
  en.a1.unit54.lesson03.teach.dialogue_line5:
    title: लैला के पास क्वार्टर हैं
    gloss: 'लैला कहती है: जी, मेरे पास क्वार्टर हैं।'
    note: यह एक छोटी हामी है, कोई नई जानकारी नहीं।
  en.a1.unit54.lesson03.teach.dialogue_line6:
    title: धुलाई चक्र का समय
    gloss: 'कर्मचारी कहता है: धुलाई चक्र में तीस मिनट लगते हैं।'
    note: यहाँ *take* का मतलब है "समय लगना", जो ऊपर *take quarters* वाले *take* से अलग है।
  en.a1.unit54.lesson03.teach.dialogue_line7:
    title: डैनियल क़ीमत पूछता है
    gloss: 'डैनियल कहता है: और इसके कितने पैसे लगते हैं?'
    note: '*How much does it cost?* में भी सवाल बनाने के लिए *does* आया है।'
  en.a1.unit54.lesson03.teach.dialogue_line8:
    title: क़ीमत
    gloss: 'कर्मचारी कहता है: एक बार के कपड़ों के तीन डॉलर लगते हैं।'
    note: यह अलग जानकारी है, क्वार्टरों की संख्या और धुलाई के समय से अलग।
  en.a1.unit54.lesson03.teach.dialogue_line9:
    title: बंद होने का समय
    gloss: 'कर्मचारी कहता है: लॉन्ड्रोमैट नौ बजे बंद हो जाता है, इसलिए कृपया उससे पहले अपने कपड़े ले जाइए।'
    note: यहाँ *so* का मतलब है "इसलिए"; यह बंद होने के समय को समय पर आने के निर्देश से जोड़ता है।
  en.a1.unit54.lesson04.teach.reading_passage:
    title: लॉन्ड्रोमैट की यात्रा पर पाठ
    gloss: 'लॉन्ड्रोमैट की एक यात्रा: एक दोपहर लैला के घर की वॉशिंग मशीन ख़राब हो गई। उसने सड़क पर आगे बने लॉन्ड्रोमैट जाने का फ़ैसला किया। डैनियल भी साथ आया क्योंकि उसके पास भी थोड़े-से कपड़े धोने के लिए थे। लॉन्ड्रोमैट में कर्मचारी ने समझाया कि मशीनें क्वार्टर लेती हैं और धुलाई चक्र में तीस मिनट लगते हैं। एक बार की धुलाई के तीन डॉलर लगे। जब तक उनके कपड़े धुलते रहे, डैनियल और लैला ने बातें कीं और बगल के कैफ़े में कॉफ़ी पी। लॉन्ड्रोमैट नौ बजे बंद होता है, इसलिए उन्होंने ध्यान रखा कि अपने कपड़े उससे पहले ले लें। लैला डैनियल की शुक्रगुज़ार थी कि उसने उसका साथ दिया, और उसने कहा कि घर की मशीन शायद सप्ताहांत तक ठीक हो जाएगी।'
    note: '*would be fixed* का मतलब है "ठीक हो जाएगी"; लैला को उम्मीद है कि मशीन ठीक हो जाएगी, पर यह अभी पक्का नहीं है।'
