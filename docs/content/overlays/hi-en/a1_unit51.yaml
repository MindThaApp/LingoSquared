    note: '*Hi, can I help you?* का मतलब है "नमस्ते, क्या मैं आपकी मदद कर सकता हूँ?"'
  en.a1.unit51.lesson03.teach.dialogue_line2:
    title: लैला की तकलीफ़ें
    gloss: 'लैला कहती है: जी, मुझे तेज़ खाँसी है और नाक बह रही है।'
    note: यह वही वाक्य है जो पहले सीखा था।
  en.a1.unit51.lesson03.teach.dialogue_line3:
    title: केमिस्ट सिरप बताता है
    gloss: 'केमिस्ट कहता है: मेरे पास खाँसी का एक सिरप है जो आराम देगा। इसे सोने से पहले लीजिए।'
    note: '*before bed* का मतलब है सोने से पहले; यह बात सिरप के लिए है, गोलियों के लिए नहीं।'
  en.a1.unit51.lesson03.teach.dialogue_line4:
    title: डैनियल का सवाल
    gloss: 'डैनियल पूछता है: क्या आपके पास गले के दर्द की भी कोई दवा है?'
    note: वाक्य के अंत में *too* का मतलब है भी।
  en.a1.unit51.lesson03.teach.dialogue_line5:
    title: केमिस्ट गोलियाँ बताता है
    gloss: 'केमिस्ट कहता है: जी, ये गोलियाँ गले के दर्द के लिए अच्छी हैं। हर चार घंटे में एक लीजिए।'
    note: 'यह गोलियों की मात्रा के बारे में है: हर चार घंटे में। यानी सिरप किसी और समय लेना है, सोने से पहले।'
  en.a1.unit51.lesson03.teach.dialogue_line6:
    title: लैला का फ़ैसला
    gloss: 'लैला कहती है: बढ़िया, मैं दोनों ले लूँगी। यह कितने का है?'
