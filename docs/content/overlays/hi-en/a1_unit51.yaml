  en.a1.unit51.lesson04.teach.reading_passage:
    title: दवा की दुकान की यात्रा पर पाठ
    gloss: 'दवा की दुकान की एक यात्रा: मिया के साथ पहाड़ों की सैर के कुछ दिन बाद लैला को सर्दी लग गई। उसे तेज़ खाँसी थी और नाक बह रही थी, और गले में भी दर्द था। डैनियल उसके साथ उसके अपार्टमेंट के पास की दवा की दुकान तक गया। केमिस्ट ने लैला की तकलीफ़ें सुनीं और खाँसी का सिरप और गोलियाँ सुझाईं। केमिस्ट ने कहा कि सिरप सोने से पहले लेना है और गोली हर चार घंटे में एक। लैला ने दोनों के लिए नौ डॉलर दिए। घर लौटते समय डैनियल ने उसके लिए टिश्यू का एक डिब्बा भी ख़रीदा। लैला ने उस रात दवा ली, और सप्ताहांत तक उसकी खाँसी काफ़ी ठीक हो गई।'
    note: '*by the weekend* का मतलब है सप्ताहांत तक।'
