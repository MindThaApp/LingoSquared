  en.a1.unit01.lesson01.teach.hi:
    title: Hi
    gloss: हाय (बेतकल्लुफ़)
    note: '*Hi* , *Hello* से ज़्यादा बेतकल्लुफ़ है; दोस्तों के बीच हिंदी के "हाय" की तरह बोला जाता है।'
    example_gloss: हाय, Leila!
  en.a1.unit01.lesson01.teach.good_morning:
    title: Good morning
    gloss: सुप्रभात
    note: '*Good morning* सुबह के समय बोला जाता है, जैसे हिंदी में "सुप्रभात" या "गुड मॉर्निंग"।'
  en.a1.unit01.lesson01.teach.good_afternoon:
    title: Good afternoon
    gloss: नमस्कार (दोपहर के बाद)
    note: '*Good afternoon* दोपहर के बाद बोला जाता है -- अंग्रेज़ी में पूरे दिन चलने वाला "नमस्ते" जैसा कोई एक शब्द नहीं है।'
  en.a1.unit01.lesson01.teach.good_evening:
    title: Good evening
    gloss: शुभ संध्या
    note: '*Good evening* शाम के समय बोला जाता है, जैसे हिंदी में "शुभ संध्या"।'
  en.a1.unit01.lesson01.teach.goodbye:
    title: Goodbye
    gloss: अलविदा
    note: '*Goodbye* विदा लेने का सामान्य और आम तरीक़ा है।'
    example_gloss: अलविदा, कल मिलते हैं!
  en.a1.unit01.lesson01.teach.bye:
    title: Bye
    gloss: बाय
    note: '*Bye* , *Goodbye* से ज़्यादा बेतकल्लुफ़ है, जैसे हिंदी में दोस्तों के बीच "बाय"।'
    example_gloss: बाय, जल्दी मिलते हैं!
  en.a1.unit01.lesson03.teach.how_are_you:
    title: How are you?
    gloss: आप कैसे हैं? / तुम कैसे हो?
    note: '*How are you?* अंग्रेज़ी में औपचारिक और अनौपचारिक दोनों जगह चलता है -- हिंदी के "आप" और "तुम" जैसा कोई अलग रूप यहाँ नहीं होता।'
  en.a1.unit01.lesson03.teach.im_fine:
    title: I'm fine, thanks.
    gloss: मैं ठीक हूँ, शुक्रिया।
    note: एक सीधा-सादा, सामान्य जवाब।
  en.a1.unit01.lesson03.teach.im_good:
    title: I'm good, thanks.
    gloss: मैं ठीक हूँ, शुक्रिया।
    note: इसका मतलब *I'm fine, thanks* जैसा ही है -- रोज़मर्रा में दोनों बराबर चलते हैं।
  en.a1.unit01.lesson03.teach.not_bad:
    title: Not bad, thanks.
    gloss: बुरा नहीं, शुक्रिया।
    note: एक बेतकल्लुफ़, थोड़ा संकोच भरा जवाब -- न बहुत अच्छा, न बुरा।
  en.a1.unit01.lesson03.teach.and_you:
    title: And you?
    gloss: और आप? / और तुम?
    note: सामने वाले से वही सवाल पूछना -- हर तरह की बातचीत में चलता है, औपचारिक या अनौपचारिक का फ़र्क़ नहीं पड़ता।
  en.a1.unit01.lesson03.teach.are_you_okay:
    title: Are you okay?
    gloss: क्या सब ठीक है?
    note: '*Are you okay?* आमतौर पर तब पूछा जाता है जब लगे कि किसी को कोई परेशानी है; यह *How are you?* जैसा आम अभिवादन नहीं है।'
  en.a1.unit01.lesson05.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: आपसे मिलकर ख़ुशी हुई। / तुमसे मिलकर ख़ुशी हुई।
    note: किसी से पहली बार मिलने पर बोला जाता है।
  en.a1.unit01.lesson05.teach.nice_to_meet_you_too:
