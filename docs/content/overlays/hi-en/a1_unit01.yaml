    gloss: मुझे भी ख़ुशी हुई।
    note: '*Nice to meet you* का सही जवाब।'
  en.a1.unit01.lesson05.teach.see_you_later:
    title: See you later.
    gloss: बाद में मिलते हैं।
    note: जब उसी दिन उस व्यक्ति से दोबारा मिलना हो तब बोला जाता है, जैसे हिंदी में "बाद में मिलते हैं"।
  en.a1.unit01.lesson05.teach.have_a_good_day:
    title: Have a good day.
    gloss: आपका दिन शुभ हो।
    note: विदा लेते समय बोली जाने वाली दोस्ताना बात, जिसमें सामने वाले के बाक़ी दिन के लिए शुभकामना होती है।
