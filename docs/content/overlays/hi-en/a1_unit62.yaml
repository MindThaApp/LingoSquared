teaching:
  en.a1.unit62.lesson01.teach.phone:
    title: phone
    gloss: फ़ोन
    note: '*phone* का मतलब फ़ोन है। रोज़मर्रा की बातचीत में *phone* ज़्यादातर मोबाइल फ़ोन के लिए बोला जाता है।'
    example_gloss: मेरा फ़ोन यहाँ है।
  en.a1.unit62.lesson01.teach.call:
    title: call
    gloss: फ़ोन करना / फ़ोन कॉल
    note: '*call* का मतलब कॉल भी हो सकता है और फ़ोन करना भी: *a call* (संज्ञा), *to call* (क्रिया)।'
    example_gloss: मैं तुम्हें फ़ोन कर सकता हूँ।
  en.a1.unit62.lesson01.teach.message:
    title: message
    gloss: संदेश
    note: '*message* का मतलब संदेश है।'
    example_gloss: कृपया संदेश छोड़िए।
  en.a1.unit62.lesson01.teach.voicemail:
    title: voicemail
    gloss: वॉइसमेल
    note: '*voicemail* का मतलब फ़ोन पर बोलकर छोड़ा गया रिकॉर्ड किया हुआ संदेश है।'
    example_gloss: वॉइसमेल छोटा है।
  en.a1.unit62.lesson01.teach.repeat:
    title: repeat
    gloss: दोहराना
    note: '*repeat* का मतलब कोई बात दोबारा कहना है।'
    example_gloss: कृपया उसे दोहराइए।
  en.a1.unit62.lesson01.teach.slowly:
    title: slowly
    gloss: धीरे
    note: '*slowly* का मतलब धीरे है। यह *-ly* वाला क्रियाविशेषण है; हिंदी में "धीरे" का रूप नहीं बदलता, पर अंग्रेज़ी में *slow* (विशेषण) और *slowly* (क्रियाविशेषण) अलग हैं।'
    example_gloss: कृपया धीरे बोलिए।
  en.a1.unit62.lesson02.teach.this_is_leila:
    title: Hello, this is Leila.
    gloss: नमस्ते, मैं लैला बोल रही हूँ।
    note: फ़ोन पर अंग्रेज़ी में *this is...* कहकर बताते हैं कि कौन बोल रहा है। फ़ोन पर *My name is...* अटपटा लगता है।
  en.a1.unit62.lesson02.teach.speak_to_mia:
    title: Can I speak to Mia?
    gloss: क्या मैं मिया से बात कर सकता हूँ?
    note: '*speak to* का मतलब "से बात करना" है। हिंदी के "से" की जगह यहाँ *to* आता है।'
  en.a1.unit62.lesson02.teach.repeat_that:
    title: Please repeat that.
    gloss: कृपया उसे दोहराइए।
    note: '*Please repeat that* विनम्रता से बात दोहराने को कहता है।'
  en.a1.unit62.lesson02.teach.speak_slowly:
    title: Please speak slowly.
    gloss: कृपया धीरे बोलिए।
    note: '*slowly* यहाँ क्रिया *speak* के बाद आता है।'
  en.a1.unit62.lesson02.teach.leave_message:
    title: Leave a message.
    gloss: संदेश छोड़िए।
    note: '*leave a message* "संदेश छोड़ना" के लिए पक्का वाक्यांश है।'
  en.a1.unit62.lesson02.teach.call_back_later:
    title: I'll call back later.
    gloss: मैं बाद में वापस फ़ोन करूँगा।
    note: '*call back* का मतलब वापस फ़ोन करना है। छोटा शब्द *back* क्रिया के बाद आता है।'
  en.a1.unit62.lesson03.teach.dialogue_line1:
    title: मिया फ़ोन उठाती है
    gloss: 'मिया कहती है: नमस्ते, मैं मिया बोल रही हूँ।'
    note: फ़ोन पर *this is Mia* स्वाभाविक लगता है।
  en.a1.unit62.lesson03.teach.dialogue_line2:
    title: लैला बताती है कि कौन बोल रहा है
    gloss: 'लैला कहती है: नमस्ते मिया, मैं लैला बोल रही हूँ।'
    note: फ़ोन पर अपना परिचय देने के लिए *this is* का इस्तेमाल कीजिए।
  en.a1.unit62.lesson03.teach.dialogue_line3:
    title: लैला को ठीक से सुनाई नहीं देता
    gloss: 'लैला कहती है: मुझे तुम्हारी आवाज़ ठीक से सुनाई नहीं दे रही।'
    note: '*can''t hear you well* का मतलब "तुम्हारी आवाज़ ठीक से सुनाई नहीं दे रही" है।'
  en.a1.unit62.lesson03.teach.dialogue_line4:
    title: लैला धीरे बोलने को कहती है
    gloss: 'लैला कहती है: कृपया धीरे बोलो।'
    note: '*Please speak slowly* एक विनम्र अनुरोध है।'
  en.a1.unit62.lesson03.teach.dialogue_line5:
    title: मिया समय बताती है
    gloss: 'मिया कहती है: ज़रूर। बैठक चार बजे है।'
    note: '*at four* में समय के लिए *at* आता है।'
  en.a1.unit62.lesson03.teach.dialogue_line6:
    title: लैला दोहराने को कहती है
    gloss: 'लैला कहती है: कृपया उसे दोहराओ।'
    note: '*repeat that* अभी कही गई बात की ओर इशारा करता है।'
  en.a1.unit62.lesson03.teach.dialogue_line7:
    title: मिया चार बजे दोहराती है
    gloss: 'मिया कहती है: चार बजे।'
    note: '*Four o''clock* पूरे घंटे का समय है।'
  en.a1.unit62.lesson03.teach.dialogue_line8:
    title: लैला बाद में फ़ोन करती है
    gloss: 'लैला कहती है: शुक्रिया। मैं बाद में वापस फ़ोन करूँगी।'
    note: '*I''ll*, *I will* का छोटा रूप है।'
  en.a1.unit62.lesson04.teach.phone_note:
    title: फ़ोन संदेश
    gloss: 'फ़ोन संदेश: मिया ने 3:00 बजे फ़ोन किया था। बैठक कमरा 5 में है। कृपया वापस फ़ोन कीजिए।'
    note: संदेश बताता है कि किसने फ़ोन किया, कब किया, कमरा कौन-सा है और क्या करना है।
  en.a1.unit62.lesson04.teach.reading_passage:
    title: 'पाठ: एक छोटी फ़ोन कॉल'
    gloss: 'एक छोटी फ़ोन कॉल: मिया ने दोपहर में लैला को फ़ोन किया। आवाज़ साफ़ नहीं थी, इसलिए लैला ने मिया से धीरे बोलने को कहा। मिया ने बताया कि बैठक चार बजे कमरा 5 में है। लैला ने मिया से समय दोहराने को कहा। बाद में लैला ने एक फ़ोन संदेश लिखा। संदेश में लिखा था कि मिया ने 3:00 बजे फ़ोन किया था और वापस फ़ोन करने को कहा है।'
    note: '*called*, *call* का भूतकाल रूप है।'
