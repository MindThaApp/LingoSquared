    note: किसी संभावित शर्त के नतीजे के बारे में सवाल।
  en.b1.unit07.lesson04.teach.a_send_message:
    title: डैनियल नतीजा बताता है
    gloss: 'डैनियल कहता है: अगर यह देर से शुरू हुई, तो मैं सबको मैसेज भेज दूँगा।'
