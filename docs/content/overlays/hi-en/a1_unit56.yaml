  en.a1.unit56.lesson03.teach.dialogue_line13:
    title: कुल बिल
    gloss: 'वेटर कहता है: यह उन्नीस डॉलर हुआ, कृपया।'
    note: 'यह तीसरी अलग जानकारी है: कुल बिल, जो चिकन और सलाद की अलग-अलग क़ीमतों से अलग है।'
