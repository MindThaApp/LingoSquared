  en.a1.unit56.lesson03.teach.dialogue_line2:
    title: वेटर मेज़ दिखाता है
    gloss: 'वेटर कहता है: जी हाँ, कृपया यहाँ बैठिए।'
    note: '*please sit here* एक छोटा, विनम्र निमंत्रण है।'
  en.a1.unit56.lesson03.teach.dialogue_line3:
    title: मिया मेन्यू माँगती है
    gloss: 'मिया कहती है: क्या मैं मेन्यू देख सकती हूँ, कृपया?'
    note: '*Could I see...?* में फिर से विनम्र *could* आया है, जैसे *could we have the bill* में।'
  en.a1.unit56.lesson03.teach.dialogue_line4:
    title: वेटर मेन्यू देता है
    gloss: 'वेटर कहता है: बिल्कुल, ये लीजिए।'
    note: '*Of course, here you are* कुछ हाथ में देते समय कहा जाने वाला पक्का वाक्य है।'
  en.a1.unit56.lesson03.teach.dialogue_line5:
