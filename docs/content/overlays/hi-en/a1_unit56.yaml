    title: मेन्यू
    gloss: 'रेस्तराँ का मेन्यू: चिकन - $12। सलाद - $7। पिज़्ज़ा - $10। जूस - $3।'
    note: मेन्यू में चार चीज़ें अपनी क़ीमतों के साथ दी गई हैं।
  en.a1.unit56.lesson04.teach.reading_passage:
    title: रेस्तराँ में एक भोजन पर पाठ
    gloss: 'रेस्तराँ की एक यात्रा: एक शाम लैला और मिया ने शहर के बीच बने एक नए रेस्तराँ को आज़माने का फ़ैसला किया। एक वेटर उन्हें खिड़की के पास की मेज़ तक ले गया। वह उनके लिए चिकन, सलाद, पिज़्ज़ा और जूस वाला मेन्यू लाया। लैला ने चिकन का ऑर्डर दिया, और मिया ने सलाद का। चिकन बारह डॉलर का था, और सलाद सात डॉलर का। खाते समय उन्होंने मिया की फ़ोटोग्राफ़ी की कक्षा के बारे में बात की। जब वे खा चुकीं, तो वेटर बिल लाया। दोनों का बिल उन्नीस डॉलर था। लैला ने कहा कि रेस्तराँ बहुत बढ़िया था, और मिया ने कहा कि वह अगली बार डैनियल को यहाँ लाना चाहती है।'
    note: '*ordered*, *order* (ऑर्डर देना) का भूतकाल है।'
