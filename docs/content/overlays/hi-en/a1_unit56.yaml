  en.a1.unit56.lesson03.teach.dialogue_line11:
    title: सलाद की क़ीमत
    gloss: 'वेटर कहता है: सलाद सात डॉलर का है।'
    note: 'यह दूसरी अलग जानकारी है: सलाद की क़ीमत।'
  en.a1.unit56.lesson03.teach.dialogue_line12:
