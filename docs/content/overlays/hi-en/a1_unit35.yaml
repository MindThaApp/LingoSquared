    gloss: कंप्यूटर
    note: '*computer* का मतलब है कंप्यूटर।'
    example_gloss: हमारे घर में एक कंप्यूटर है।
  en.a1.unit35.lesson01.teach.app:
    title: app
    gloss: ऐप
    note: '*app* का मतलब है ऐप।'
    example_gloss: मेरे फ़ोन में एक नया ऐप है।
  en.a1.unit35.lesson01.teach.camera:
    title: camera
    gloss: कैमरा
    note: '*camera* का मतलब है कैमरा।'
    example_gloss: यह कैमरा शानदार तस्वीरें खींचता है।
  en.a1.unit35.lesson02.teach.make_a_call:
    title: make a call
    gloss: फ़ोन करना
    note: '*make a call* क्रिया + संज्ञा की एक पक्की जोड़ी है, जिसे पूरा याद रखना पड़ता है। हिंदी में भी ''फ़ोन करना'' जैसी जोड़ी चलती है, पर अंग्रेज़ी में *make* के साथ *a call* ही आता है; इसे शब्द-दर-शब्द नहीं बदल सकते।'
    example_gloss: मैं हर रविवार अपने भाई को फ़ोन करता हूँ।
  en.a1.unit35.lesson02.teach.send_a_text:
    title: send a text
    gloss: मैसेज भेजना
    note: '*send a text* भी *make a call* की तरह क्रिया + संज्ञा की पक्की जोड़ी है। हिंदी में इसके लिए ''मैसेज भेजना'' या ''मैसेज करना'' कहते हैं। अंग्रेज़ी में आम तौर पर *send a text* कहा जाता है।'
    example_gloss: वह हर सुबह अपनी दोस्त को मैसेज भेजती है।
  en.a1.unit35.lesson02.teach.download_an_app:
    title: download an app
    gloss: ऐप डाउनलोड करना
    note: '*download an app*: *download* अंग्रेज़ी में भी क्रिया है और हिंदी में भी (''डाउनलोड करना'') उसी तरह चलता है, इसलिए यह तीनों पक्की जोड़ियों में सबसे आसान है।'
    example_gloss: वह हर हफ़्ते एक नया ऐप डाउनलोड करता है।
  en.a1.unit35.lesson02.teach.wifi:
    title: wifi
    gloss: वाई-फ़ाई
    note: '*wifi* का मतलब है वाई-फ़ाई।'
    example_gloss: मेरे घर का वाई-फ़ाई तेज़ है।
  en.a1.unit35.lesson02.teach.battery:
    title: battery
    gloss: बैटरी
    note: '*battery* का मतलब है बैटरी।'
    example_gloss: मेरे फ़ोन की बैटरी लगभग खत्म है।
  en.a1.unit35.lesson02.teach.how_use_phone_question:
    title: How do you use your phone?
    gloss: तुम अपना फ़ोन कैसे इस्तेमाल करते हो?
    note: '*Do you use ...?* में वही do-support है जो दूसरे अंग्रेज़ी प्रश्नों में होता है।'
  en.a1.unit35.lesson03.teach.dialogue_line1:
    title: मिया की शिकायत
    gloss: 'मिया कहती है: मेरा फ़ोन बहुत पुराना है। यह सच में धीमा चलता है।'
    note: '*so* + विशेषण (*so old*) अर्थ को बढ़ाता है, जैसे हिंदी में ''इतना'' या ''बहुत''।'
  en.a1.unit35.lesson03.teach.dialogue_line2:
    title: लैला की सलाह
    gloss: 'लैला कहती है: तुम्हें नया ले लेना चाहिए। तुम इसे ज़्यादातर किसलिए इस्तेमाल करती हो?'
    note: '*What do you use it for most?* का अंत पूर्वसर्ग *for* पर होता है। अंग्रेज़ी में प्रश्न *what* से शुरू होता है और *for* वाक्य के अंत में रह जाता है।'
  en.a1.unit35.lesson03.teach.dialogue_line3:
    title: "मिया का जवाब"
    gloss: 'मिया कहती है: मैं ज़्यादातर अपनी बहन को मैसेज करती हूँ और तस्वीरें खींचती हूँ।'
    note: '*text* को क्रिया की तरह भी इस्तेमाल कर सकते हैं (*I text my sister*)। यह *send a text* से ज़्यादा आम है; दोनों सही अंग्रेज़ी हैं।'
  en.a1.unit35.lesson03.teach.dialogue_line4:
    title: लैला का इस्तेमाल
    gloss: 'लैला कहती है: मैं हर वीकेंड अपने फ़ोन से अपने माता-पिता को फ़ोन करती हूँ। मैं बहुत सारे ऐप भी इस्तेमाल करती हूँ।'
    note: क्रिया की तरह *call* (*I call my parents*) आम, अनौपचारिक तरीक़ा है। *Make a call* वह पक्की जोड़ी है जो पाठ 2 में आई थी।
  en.a1.unit35.lesson03.teach.dialogue_line5:
    title: मिया का सवाल
    gloss: 'मिया पूछती है: तुम कौन-से ऐप इस्तेमाल करती हो?'
    note: '*Which apps do you use?*: *which* किसी समूह (ऐप) में से चुनाव के बारे में पूछता है, जैसे हिंदी में ''कौन-से''।'
  en.a1.unit35.lesson03.teach.dialogue_line6:
    title: Leila's apps
    gloss: 'लैला कहती है: मैं एक कुकिंग ऐप और एक नक़्शे वाला ऐप इस्तेमाल करती हूँ। क्या तुम उन्हें डाउनलोड करना चाहोगी?'
    note: '*Do you want to ...?* में do-support लगता है, भले ही *want* खुद एक साधारण क्रिया है।'
  en.a1.unit35.lesson03.teach.dialogue_line7:
    title: "मिया का जवाब"
    gloss: 'मिया कहती है: हाँ, ज़रूर, मुझे नाम भेज दो!'
    note: '*please* यहाँ क्रिया से पहले आता है (*please send ...*) और अनुरोध को ज़्यादा विनम्र बनाता है।'
  en.a1.unit35.lesson04.teach.reading_passage:
    title: डैनियल, लैला और मिया के बारे में पाठ
    gloss: डैनियल, लैला और मिया तीनों अपना फ़ोन अलग-अलग तरह से इस्तेमाल करते हैं। डैनियल को मैसेज करना पसंद नहीं; वह इसकी जगह लोगों को फ़ोन करना पसंद करता है। लैला अपना फ़ोन नक़्शों के लिए इस्तेमाल करती है। जब वह नई रेसिपी आज़माती है तो एक कुकिंग ऐप भी इस्तेमाल करती है। मिया बहुत तस्वीरें खींचती है और उन्हें अपने परिवार को भेजती है। वे सब काम के लिए लैपटॉप इस्तेमाल करते हैं, और वीकेंड पर दोस्तों से वीडियो चैट करते हैं।
    note: '*He prefers to call people instead*: वाक्य के अंत में *instead* का मतलब है ''उसकी जगह'' (यानी मैसेज करने की जगह)।'
