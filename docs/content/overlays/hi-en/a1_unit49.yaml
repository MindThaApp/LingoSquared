    note: '*take out* के दो हिस्से अलग किए जा सकते हैं: *take out the trash* और *take the trash out* दोनों सही हैं। हिंदी में "बाहर रखना" हमेशा वाक्य के अंत में आता है।'
  en.a1.unit49.lesson02.teach.collection_day_is_on_tuesday:
