    gloss: यह रीसाइकिल वाले डिब्बे में जाएगा।
    note: '*This goes in the recycling bin.* का मतलब है "यह रीसाइकिल वाले डिब्बे में जाएगा।"'
  en.a1.unit49.lesson02.teach.the_green_bin_is_for_glass:
    title: The green bin is for glass.
    gloss: हरा डिब्बा काँच के लिए है।
    note: '*is for ...* का मतलब है "... के लिए है", यानी किसी चीज़ का मक़सद बताना।'
  en.a1.unit49.lesson02.teach.can_you_take_out_the_trash:
