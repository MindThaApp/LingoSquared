  en.a1.unit49.lesson02.teach.what_about_paper_and_food_waste:
    title: What about paper and food waste?
    gloss: और काग़ज़ और खाने के कचरे का क्या?
    note: '*What about ...?* का मतलब है "... का क्या?", इससे किसी और चीज़ के बारे में पूछा जाता है।'
  en.a1.unit49.lesson03.teach.dialogue_line1:
    title: मिया की चेतावनी
    gloss: 'मिया कहती है: रुको, वह काँच का जार कूड़े में नहीं जाता!'
    note: '*doesn''t go in the trash* का मतलब है "कूड़े में नहीं जाता"।'
  en.a1.unit49.lesson03.teach.dialogue_line2:
    title: डैनियल की माफ़ी
    gloss: 'डैनियल कहता है: अरे नहीं, माफ़ करना! यह किस डिब्बे में जाएगा?'
    note: '*Which bin does it go in?* वही सवाल है जो अभी सीखा था।'
  en.a1.unit49.lesson03.teach.dialogue_line3:
    title: मिया समझाती है
    gloss: 'मिया कहती है: यह हरे डिब्बे में जाएगा। हम यहाँ काँच रीसाइकिल करते हैं।'
    note: '*We recycle glass here.* का मतलब है "हम यहाँ काँच रीसाइकिल करते हैं।"'
  en.a1.unit49.lesson03.teach.dialogue_line4:
    title: डैनियल का सवाल
    gloss: 'डैनियल पूछता है: और काग़ज़ और खाने के कचरे का क्या?'
    note: यह पहले सीखे गए सवाल *What about ...?* को दोहराना है।
  en.a1.unit49.lesson03.teach.dialogue_line5:
    title: मिया की व्याख्या
    gloss: 'मिया कहती है: काग़ज़ नीले डिब्बे में जाता है, और खाने का कचरा भूरे डिब्बे में जाता है।'
    note: '*goes in ..., and ... goes in ...* दो अलग तरह के कचरे के लिए यही ढाँचा दोहराता है।'
  en.a1.unit49.lesson03.teach.dialogue_line6:
    title: डैनियल का कचरा उठने के दिन के बारे में सवाल
    gloss: 'डैनियल कहता है: समझ गया। कचरा उठने का दिन कब है?'
    note: '*Got it.* "समझ गया" कहने का अनौपचारिक तरीका है।'
  en.a1.unit49.lesson03.teach.dialogue_line7:
    title: "मिया का जवाब"
    gloss: 'मिया कहती है: रीसाइकिल वाले डिब्बे मंगलवार को बाहर रखे जाते हैं, और कूड़ा शुक्रवार को।'
    note: 'ध्यान दीजिए: मिया यहाँ दो अलग तरह के कचरे के लिए दो अलग दिन बताती है -- रीसाइकिल के लिए मंगलवार, आम कूड़े के लिए शुक्रवार।'
  en.a1.unit49.lesson03.teach.dialogue_line8:
    title: डैनियल का वादा
    gloss: 'डैनियल कहता है: धन्यवाद! अगली बार मैं सब कुछ सही से छाँटूँगा।'
    note: '*I''ll sort everything correctly next time.* का मतलब है "अगली बार मैं सब कुछ सही से छाँटूँगा।"'
  en.a1.unit49.lesson04.teach.reading_passage:
    title: कचरा छाँटना कैसे होता है, इस बारे में पाठ
    gloss: 'अपना कचरा कैसे छाँटें: कई अपार्टमेंट इमारतों में अलग-अलग तरह के कचरे के लिए अलग-अलग डिब्बे होते हैं। काँच आम तौर पर हरे डिब्बे में जाता है, और काग़ज़ नीले डिब्बे में। खाने का कचरा भूरे डिब्बे में जाता है, और बाकी सब कुछ आम कूड़े के काले डिब्बे में। अपना कचरा उठने का दिन जानना मददगार होता है, क्योंकि डिब्बे हफ़्ते में सिर्फ़ एक बार उठाए जाते हैं। डैनियल उस पाक-कला की किताब से व्यंजनों का अभ्यास कर रहा है जो उसने पुस्तकालय से ली थी, और वह अक्सर मिया के अपार्टमेंट में उसके साथ खाना बनाता है। कल रात उसने किताब का एक व्यंजन बनाया, और उसके बाद वह लगभग एक काँच का जार आम कूड़े में डालने ही वाला था। मिया ने उसे रोका और दिखाया कि उसकी इमारत में कचरा कैसे छाँटा जाता है। उसने समझाया कि रीसाइकिल वाले डिब्बे मंगलवार को बाहर रखे जाते हैं, और आम कूड़ा शुक्रवार को। डैनियल ने आभार जताया और कहा कि अब से वह सब कुछ सही से छाँटेगा।'
    note: '*almost put a glass jar in the regular trash* का मतलब है "लगभग काँच का जार आम कूड़े में डाल ही दिया था"।'
