teaching:
  en.a1.unit33.lesson01.teach.bus:
    title: bus
    gloss: बस
    note: '*bus* का मतलब है बस। इसके साथ की क्रिया *take* है: *take the bus*। ध्यान दीजिए: हिंदी में हर साधन के लिए आम तौर पर एक ही ढंग चलता है (बस से जाना, कार से जाना), लेकिन अंग्रेज़ी में हर साधन की अपनी क्रिया होती है (*take*, *drive*, *ride*)। इन्हें अलग-अलग याद रखिए।'
    example_gloss: मैं बस लेता हूँ।
  en.a1.unit33.lesson01.teach.train:
    title: train
    gloss: ट्रेन
    note: '*train* का मतलब है ट्रेन। *bus* की तरह यहाँ भी *take* लगता है: *take the train*।'
    example_gloss: वह ट्रेन लेती है।
  en.a1.unit33.lesson01.teach.car:
    title: car
    gloss: कार
    note: '*car* का मतलब है कार। कार के साथ *take* नहीं, *drive* लगता है: *drive my car*। यह बस या ट्रेन वाली क्रिया से अलग है।'
    example_gloss: मैं अपनी कार से काम पर जाता हूँ।
  en.a1.unit33.lesson01.teach.bike:
    title: bike
    gloss: साइकिल
    note: '*bike* का मतलब है साइकिल। यहाँ फिर एक अलग क्रिया लगती है: *ride a bike* (न *take*, न *drive*)।'
    example_gloss: मैं रोज़ साइकिल से काम पर जाता हूँ।
  en.a1.unit33.lesson01.teach.walk:
    title: walk
    gloss: पैदल चलना
    note: '*walk* का मतलब है पैदल चलना। यहाँ *take*, *drive* या *ride* जैसी अलग क्रिया नहीं चाहिए, क्योंकि *walk* खुद क्रिया है: *walk to work*, *take a walk to work* नहीं।'
    example_gloss: मैं पैदल काम पर जाता हूँ।
  en.a1.unit33.lesson02.teach.how_get_to:
    title: How do you get to work?
    gloss: आप काम पर कैसे पहुँचते हैं?
    note: यह प्रश्न सहायक क्रिया *do* से शुरू होता है, क्योंकि मुख्य क्रिया *get* है। पूरा ढाँचा है *How do you get ...?*
  en.a1.unit33.lesson02.teach.usually:
    title: usually
    gloss: आम तौर पर
    note: '*usually* का मतलब है आम तौर पर। अंग्रेज़ी में यह क्रियाविशेषण अक्सर कर्ता और मुख्य क्रिया के बीच आता है: *I usually take the bus*।'
    example_gloss: मैं आम तौर पर बस लेता हूँ।
  en.a1.unit33.lesson02.teach.minutes:
    title: minutes
    gloss: मिनट
    note: '*minutes* का मतलब है मिनट। *It takes twenty minutes* में *it* एक खाली कर्ता है, जिसका अपना कोई अर्थ नहीं; वह बस कर्ता की जगह भरता है। हिंदी में ऐसे वाक्य के लिए अलग शब्द नहीं लगता (''बीस मिनट लगते हैं''), पर अंग्रेज़ी में कर्ता ज़रूरी है, इसलिए *it* लगाना पड़ता है।'
    example_gloss: बीस मिनट लगते हैं।
  en.a1.unit33.lesson02.teach.late:
    title: late
    gloss: देर से
    note: '*late* का मतलब है देर से (उम्मीद से बाद में पहुँचना): *The bus is often late.*'
    example_gloss: बस अक्सर देर से आती है।
  en.a1.unit33.lesson02.teach.faster:
    title: faster
    gloss: ज़्यादा तेज़
    note: '*faster* का मतलब है ज़्यादा तेज़: यह *fast* का तुलनात्मक रूप है, जिसमें *-er* जुड़ा है। तुलना के लिए *than* लगता है: *faster than the bus*।'
    example_gloss: ट्रेन बस से ज़्यादा तेज़ है।
  en.a1.unit33.lesson03.teach.dialogue_line1:
    title: लैला का सवाल
    gloss: 'लैला पूछती है: डैनियल, तुम काम पर कैसे जाते हो?'
    note: बातचीत की शुरुआत *How do you get to work?* से होती है।
  en.a1.unit33.lesson03.teach.dialogue_line2:
    title: "डैनियल का जवाब"
    gloss: 'डैनियल कहता है: मैं आम तौर पर बस लेता हूँ। इसमें लगभग बीस मिनट लगते हैं।'
    note: 'एक साथ दो बातें: बस के लिए क्रिया *take*, और *It takes about twenty minutes* में खाली कर्ता *it*।'
  en.a1.unit33.lesson03.teach.dialogue_line3:
    title: लैला का सवाल
    gloss: 'लैला पूछती है: क्या तुम्हें यह पसंद है?'
    note: यह हाँ/नहीं वाला प्रश्न है, जो *Do* से शुरू होता है।
  en.a1.unit33.lesson03.teach.dialogue_line4:
    title: "डैनियल का जवाब"
    gloss: 'डैनियल कहता है: ठीक है, पर बस अक्सर देर से आती है। और तुम?'
    note: '*How about you?* का मतलब है ''और तुम?'': वही सवाल सामने वाले से पूछने का छोटा तरीक़ा।'
  en.a1.unit33.lesson03.teach.dialogue_line5:
    title: "लैला का जवाब"
    gloss: 'लैला कहती है: मैं कार चलाकर जाती हूँ। वह ज़्यादा तेज़ है, पर पार्किंग मुश्किल है।'
    note: कार के लिए क्रिया *drive* लगती है, *take* नहीं।
  en.a1.unit33.lesson04.teach.reading_passage:
    title: लैला और डैनियल के बारे में पाठ
    gloss: लैला रोज़ कार से काम पर जाती है। सफ़र में लगभग पंद्रह मिनट लगते हैं, लेकिन उसके दफ़्तर के पास पार्किंग मुश्किल है। डैनियल के पास कार नहीं है, इसलिए वह बस लेता है। उसकी बस का सफ़र बीस मिनट का है और बस कभी-कभी देर से आती है, पर उसे पार्किंग की चिंता नहीं करनी पड़ती।
    note: 'ध्यान दीजिए: बस और ट्रेन के लिए *take* लगता है, कार के लिए *drive*।'
