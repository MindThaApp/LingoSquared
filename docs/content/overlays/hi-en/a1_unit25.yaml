    title: लैला का सवाल
    gloss: 'लैला पूछती है: डैनियल, तुम अपने खाली समय में क्या करते हो?'
    note: लैला डैनियल से सीधा सवाल पूछकर बातचीत शुरू करती है।
  en.a1.unit30.lesson03.teach.dialogue_line2:
    title: "डैनियल का जवाब"
    gloss: 'डैनियल कहता है: मैं अक्सर दौड़ने जाता हूँ। और कभी-कभी खाना भी बनाता हूँ। तुम्हारा क्या?'
    note: डैनियल दो शौक़ बताता है, साथ में वे कितनी बार करता है, और *What about you?* कहकर सवाल लौटा देता है।
  en.a1.unit30.lesson03.teach.dialogue_line3:
    title: लैला पेंटिंग के बारे में
    gloss: 'लैला कहती है: मुझे पेंटिंग करना बहुत पसंद है। मैं लगभग हर सप्ताहांत पेंटिंग करती हूँ।'
    note: '*almost every weekend* का मतलब है लगभग हर सप्ताहांत।'
  en.a1.unit30.lesson03.teach.dialogue_line4:
    title: डैनियल का अगला सवाल
    gloss: 'डैनियल कहता है: यह तो बहुत अच्छा है! क्या तुम कभी वीडियो गेम खेलती हो?'
    note: किसी से पूछने के लिए कि क्या वह कभी कोई काम करता है, *Do you ever...?* का इस्तेमाल करें।
  en.a1.unit30.lesson03.teach.dialogue_line5:
    title: लैला का आख़िरी जवाब
    gloss: 'लैला कहती है: बहुत कम। मुझे किताब पढ़ना ज़्यादा पसंद है।'
    note: '*I prefer...* का मतलब है: मुझे ... ज़्यादा पसंद है।'
  en.a1.unit30.lesson04.teach.reading_passage:
    title: शौक़ों के बारे में पाठ
    gloss: डैनियल और लैला के शौक़ अलग-अलग हैं। डैनियल हर शनिवार सुबह दौड़ने जाता है और कभी-कभी अपने दोस्तों के लिए खाना बनाता है। लैला कभी दौड़ने नहीं जाती, लेकिन सप्ताहांत में अक्सर पेंटिंग करती है। दोनों को वीडियो गेम पसंद हैं, पर वे साथ में बहुत कम खेलते हैं।
    note: यह पाठ डैनियल और लैला के शौक़ों और उनकी बारंबारता की सीधी तुलना करता है।
