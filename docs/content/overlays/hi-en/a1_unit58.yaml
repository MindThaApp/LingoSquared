  en.a1.unit58.lesson01.teach.ticket:
    title: ticket
    gloss: टिकट
    note: '*ticket* का मतलब है प्रवेश का टिकट; यह शब्द हिंदी में भी इसी रूप में चलता है।'
    example_gloss: मुझे एक टिकट चाहिए, कृपया।
  en.a1.unit58.lesson01.teach.exhibition:
    title: exhibition
    gloss: प्रदर्शनी
    note: '*exhibition* का मतलब है कला या चीज़ों का वह संग्रह जिसे देखने के लिए सजाया गया हो।'
    example_gloss: एक नई प्रदर्शनी लगी है।
  en.a1.unit58.lesson01.teach.painting:
    title: painting
    gloss: चित्र / पेंटिंग
    note: '*painting* का मतलब है रंगों से बनी कलाकृति।'
    example_gloss: मुझे यह चित्र बहुत पसंद है।
  en.a1.unit58.lesson01.teach.sculpture:
    title: sculpture
    gloss: मूर्ति
    note: '*sculpture* का मतलब है पत्थर, लकड़ी या धातु से बनी कलाकृति, जिसे हिंदी में आम तौर पर मूर्ति कहते हैं।'
    example_gloss: यह मूर्ति भी बहुत पुरानी है।
  en.a1.unit58.lesson01.teach.guide:
    title: guide
    gloss: गाइड / मार्गदर्शक
    note: '*guide* का मतलब है वह व्यक्ति जो आगंतुकों को घुमाता है और चीज़ें समझाता है।'
    example_gloss: क्या आज कोई गाइड है?
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_open:
    title: What time does the museum open?
    gloss: संग्रहालय कितने बजे खुलता है?
    note: यह सवाल *what time* से शुरू होता है, फिर सहायक क्रिया *does* आती है, क्योंकि मुख्य क्रिया *open* है।
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_close:
    title: What time does the museum close?
    gloss: संग्रहालय कितने बजे बंद होता है?
    note: सवाल की बनावट *What time does the museum open?* जैसी ही है, बस *open* की जगह *close* है।
  en.a1.unit58.lesson02.teach.two_tickets_please:
    title: Two tickets, please.
    gloss: दो टिकट दीजिए, कृपया।
    note: आख़िर में *please* लगाने से माँग विनम्र हो जाती है, जैसे खाना मँगवाते समय।
  en.a1.unit58.lesson02.teach.is_there_a_guide_for_the_exhibition:
    title: Is there a guide for the exhibition?
    gloss: क्या प्रदर्शनी के लिए कोई गाइड है?
    note: '*Is there...?* यह पूछने के लिए है कि कोई चीज़ मौजूद है या नहीं; यहाँ गाइड।'
  en.a1.unit58.lesson02.teach.the_museum_is_open_every_day:
    title: The museum is open every day.
    gloss: संग्रहालय रोज़ खुला रहता है।
    note: '*every day* का मतलब है रोज़, और यह वाक्य के अंत में आता है।'
  en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings:
    title: I really enjoyed the paintings!
    gloss: मुझे चित्र सचमुच बहुत अच्छे लगे!
    note: '*enjoyed* क्रिया *enjoy* (आनंद लेना) का भूतकाल है, जिसे किसी अच्छी बात को याद करते हुए बोला जाता है।'
  en.a1.unit58.lesson03.teach.dialogue_line1:
    title: डैनियल का सवाल
    gloss: 'डैनियल कहता है: नमस्ते! संग्रहालय कितने बजे बंद होता है?'
    note: '*Hi!* अनौपचारिक अभिवादन है।'
  en.a1.unit58.lesson03.teach.dialogue_line2:
    title: कर्मचारी का जवाब
    gloss: 'कर्मचारी कहता है: हम पाँच बजे बंद होते हैं।'
    note: '*at* के साथ समय बताने से पता चलता है कि कोई बात कब होती है, जैसे *at five o''clock* में।'
  en.a1.unit58.lesson03.teach.dialogue_line3:
    title: मिया की माँग
    gloss: 'मिया कहती है: बढ़िया। क्या हमें दो टिकट मिल सकते हैं?'
    note: '*Can we have...?* कुछ विनम्रता से माँगने या पूछने का तरीक़ा है।'
  en.a1.unit58.lesson03.teach.dialogue_line4:
    title: कीमत
    gloss: 'कर्मचारी कहता है: ज़रूर। यह बारह डॉलर हुए।'
    note: '*That''s* के साथ रक़म बोलकर कीमत बताई जाती है।'
  en.a1.unit58.lesson03.teach.dialogue_line5:
    title: गाइड के बारे में डैनियल का सवाल
    gloss: 'डैनियल पूछता है: क्या प्रदर्शनी के लिए कोई गाइड है?'
    note: यह वही *Is there...?* वाली बनावट है जो पाठ 2 में सीखी थी।
  en.a1.unit58.lesson03.teach.dialogue_line6:
    title: गाइड के बारे में कर्मचारी का जवाब
    gloss: 'कर्मचारी कहता है: हाँ, प्रवेश द्वार के पास एक गाइड है।'
    note: '*there''s*, *there is* का छोटा रूप है।'
  en.a1.unit58.lesson03.teach.dialogue_line7:
    title: मिया नाम पूछती है
    gloss: 'मिया पूछती है: प्रदर्शनी का नाम क्या है?'
    note: '*What is ... called?* किसी चीज़ का नाम पूछने का आम तरीक़ा है।'
  en.a1.unit58.lesson03.teach.dialogue_line8:
    title: प्रदर्शनी का नाम
    gloss: 'कर्मचारी कहता है: इसका नाम Colors of the City है।'
    note: '*It''s called...* सवाल *What is ... called?* का जवाब है।'
  en.a1.unit58.lesson03.teach.dialogue_line9:
    title: डैनियल की आख़िरी बात
    gloss: 'डैनियल कहता है: शुक्रिया! मुझसे चित्र देखने का इंतज़ार नहीं हो रहा।'
    note: '*can''t wait to...* का मतलब है किसी काम को करने के लिए बहुत उत्साहित होना।'
  en.a1.unit58.lesson04.teach.museum_notice:
    title: संग्रहालय की सूचना
    gloss: 'सिटी संग्रहालय: रोज़ खुला, सुबह 9:00 से शाम 5:00 तक। वयस्क टिकट: $6. मौजूदा प्रदर्शनी: Colors of the City, कमरा 2।'
    note: सूचना में खुलने का समय, कीमत और प्रदर्शनी का नाम दिया गया है।
  en.a1.unit58.lesson04.teach.reading_passage:
    title: डैनियल और मिया के बारे में पाठ
    gloss: 'संग्रहालय की सैर: एक शनिवार की दोपहर डैनियल और मिया ने साथ मिलकर सिटी संग्रहालय देखने का फ़ैसला किया। प्रवेश द्वार पर कर्मचारी ने उन्हें बताया कि संग्रहालय पाँच बजे बंद होता है। उन्होंने बारह डॉलर में दो टिकट ख़रीदे। डैनियल ने गाइड के बारे में पूछा, और कर्मचारी ने कहा कि प्रवेश द्वार के पास एक गाइड है। उन्होंने Colors of the City प्रदर्शनी देखी और कमरा 2 में बहुत से सुंदर चित्र देखे। डैनियल को पुराने शहर के चौक का एक चित्र पसंद आया, और मिया को सूर्यास्त के समय नदी का एक चित्र पसंद आया। जब वे निकले, तो मिया ने कहा कि वह अगली बार मूर्तियों की प्रदर्शनी देखना चाहती है।'
    note: '*decided to visit* में *decided* के बाद *to* और क्रिया का मूल रूप आता है, जो बताता है कि किसी ने क्या करने का फ़ैसला किया।'
