teaching:
  en.a1.unit66.lesson01.teach.symptom:
    title: symptom
    gloss: लक्षण / तकलीफ़
    note: '*symptom* का मतलब लक्षण या ऐसी तकलीफ़ है जो आप महसूस करते हैं। वर्तनी याद रखिए: *symptom* के बीच में *y* आता है।'
    example_gloss: यह एक लक्षण है।
  en.a1.unit66.lesson01.teach.cough:
    title: cough
    gloss: खाँसी
    note: '*cough* का मतलब खाँसी है। उच्चारण *kof* है; यहाँ *gh* का उच्चारण *f* जैसा होता है।'
    example_gloss: मुझे खाँसी है।
  en.a1.unit66.lesson01.teach.fever:
    title: fever
    gloss: बुख़ार
    note: '*fever* का मतलब बुख़ार है।'
    example_gloss: क्या तुम्हें बुख़ार है?
  en.a1.unit66.lesson01.teach.throat:
    title: throat
    gloss: गला
    note: '*throat* का मतलब गला है, यानी अंदर का गला (कंठ); बाहरी गर्दन के लिए *neck* कहते हैं।'
    example_gloss: मेरा गला दुख रहा है।
  en.a1.unit66.lesson01.teach.headache:
    title: headache
    gloss: सिरदर्द
    note: '*headache* का मतलब सिरदर्द है (अंग्रेज़ी में एकवचन में)।'
    example_gloss: मुझे सिरदर्द है।
  en.a1.unit66.lesson01.teach.medicine:
    title: medicine
    gloss: दवा
    note: '*medicine* का मतलब दवा है। यह अगणनीय है: *some medicine*।'
    example_gloss: यह दवा लीजिए।
  en.a1.unit66.lesson02.teach.have_cough:
    title: I have a cough.
    gloss: मुझे खाँसी है।
    note: अंग्रेज़ी में *have a cough* में *a* लगता है; हिंदी में "मुझे खाँसी है" कहते हैं, बिना किसी article के।
  en.a1.unit66.lesson02.teach.throat_hurts:
    title: My throat hurts.
    gloss: मेरा गला दुख रहा है।
    note: '*hurts* का मतलब "दुख रहा है" है। अंग्रेज़ी में शरीर का अंग कर्ता होता है (*my throat hurts*), जैसे हिंदी में "मेरा गला दुख रहा है"।'
  en.a1.unit66.lesson02.teach.have_headache:
    title: I have a headache.
    gloss: मुझे सिरदर्द है।
    note: अंग्रेज़ी में *have a headache* में *a* लगता है; हिंदी में "सिरदर्द" बिना article के आता है।
  en.a1.unit66.lesson02.teach.have_medicine:
    title: Do you have medicine?
    gloss: क्या आपके पास दवा है?
    note: '*Do you have...?* पूछता है कि कोई चीज़ मौजूद है या नहीं।'
  en.a1.unit66.lesson02.teach.with_water:
    title: Take this with water.
    gloss: इसे पानी के साथ लीजिए।
    note: '*with water* वाक्य के अंत में आता है।'
  en.a1.unit66.lesson02.teach.ask_doctor:
    title: Please ask a doctor.
    gloss: कृपया डॉक्टर से पूछिए।
    note: '*Please* वाक्य को विनम्र बनाता है।'
  en.a1.unit66.lesson03.teach.dialogue_line1:
    title: लैला एक तकलीफ़ बताती है
    gloss: 'लैला कहती है: नमस्ते। मुझे खाँसी है।'
    note: '*I have a cough* एक तकलीफ़ बताता है।'
  en.a1.unit66.lesson03.teach.dialogue_line2:
    title: फ़ार्मासिस्ट बुख़ार के बारे में पूछता है
    gloss: 'फ़ार्मासिस्ट कहता है: क्या आपको बुख़ार है?'
    note: '*Do you have a fever?* हाँ/ना वाला सवाल है।'
  en.a1.unit66.lesson03.teach.dialogue_line3:
    title: लैला को बुख़ार नहीं है
    gloss: 'लैला कहती है: नहीं, मुझे बुख़ार नहीं है। मेरा गला दुख रहा है।'
    note: '*No, I do not have...* किसी तकलीफ़ से इनकार करता है। अंग्रेज़ी में इनकार *do not* से बनता है, हिंदी के "नहीं है" की तरह अलग शब्द से नहीं।'
  en.a1.unit66.lesson03.teach.dialogue_line4:
    title: फ़ार्मासिस्ट सिरदर्द के बारे में पूछता है
    gloss: 'फ़ार्मासिस्ट कहता है: क्या आपको सिरदर्द है?'
    note: '*headache* का मतलब सिरदर्द है।'
  en.a1.unit66.lesson03.teach.dialogue_line5:
    title: लैला को सिरदर्द है
    gloss: 'लैला कहती है: हाँ, मुझे सिरदर्द है।'
    note: '*Yes* का मतलब "हाँ" है।'
  en.a1.unit66.lesson03.teach.dialogue_line6:
    title: फ़ार्मासिस्ट की सलाह
    gloss: 'फ़ार्मासिस्ट कहता है: यह दवा पानी के साथ लीजिए। अगर आपको बदतर लगे, तो कृपया डॉक्टर से पूछिए।'
    note: '*if you feel worse* का मतलब "अगर आपको और बुरा लगे" है।'
  en.a1.unit66.lesson03.teach.dialogue_line7:
    title: लैला शुक्रिया कहती है
    gloss: 'लैला कहती है: शुक्रिया।'
    note: '*Thank you* धन्यवाद कहने का छोटा वाक्य है।'
  en.a1.unit66.lesson04.teach.pharmacy_note:
    title: फ़ार्मेसी की पर्ची
    gloss: 'फ़ार्मेसी की पर्ची: खाँसी और गले में दर्द। बुख़ार नहीं। दवा पानी के साथ लें। बिगड़े तो डॉक्टर से पूछें।'
    note: पर्ची में तकलीफ़ें और सरल सलाह दी गई है।
  en.a1.unit66.lesson04.teach.reading_passage:
    title: 'पाठ: फ़ार्मेसी की एक यात्रा'
    gloss: 'फ़ार्मेसी की एक यात्रा: लैला फ़ार्मेसी गई क्योंकि उसे खाँसी थी और उसका गला दुख रहा था। फ़ार्मासिस्ट ने पूछा कि क्या उसे बुख़ार है। लैला ने कहा कि उसे बुख़ार नहीं है, पर सिरदर्द है। फ़ार्मासिस्ट ने उसे दवा दी और कहा कि इसे पानी के साथ ले। पर्ची में लिखा था कि अगर उसे और बुरा लगे तो डॉक्टर से पूछे।'
    note: '*felt worse*, *feel worse* का भूतकाल रूप है।'
