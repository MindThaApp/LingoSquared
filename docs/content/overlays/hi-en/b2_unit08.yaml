teaching:
  en.b2.unit08.lesson01.teach.source:
    title: source
    gloss: स्रोत
    note: '*source* वह स्रोत है जो जानकारी देता है। हर जगह *according to* ही मत इस्तेमाल कीजिए; कभी बात स्रोतों के बीच सहमति या टकराव की होती है।'
    example_gloss: स्रोत जानकारी देता है।
  en.b2.unit08.lesson01.teach.synthesize:
    title: synthesize
    gloss: जोड़कर एक निष्कर्ष बनाना, संश्लेषण करना
    note: '*synthesize* का मतलब कई स्रोतों की जानकारी को जोड़कर एक सुसंगत जवाब बनाना है।'
    example_gloss: संश्लेषण करना यानी स्रोतों की जानकारी को जोड़ना।
  en.b2.unit08.lesson01.teach.evaluate:
    title: evaluate
    gloss: आकलन करना
    note: '*evaluate* का मतलब यह परखना है कि कोई चीज़ कितनी मज़बूत है।'
    example_gloss: आकलन करना यानी यह परखना कि कोई चीज़ कितनी मज़बूत है।
  en.b2.unit08.lesson01.teach.agreement:
    title: agreement
    gloss: सहमति
    note: '*agreement* का मतलब है कि स्रोत किसी बिंदु पर एक ही बात कहते हैं।'
    example_gloss: सहमति का मतलब है कि स्रोत एक ही बात कहते हैं।
  en.b2.unit08.lesson01.teach.conflict:
    title: conflict
    gloss: टकराव, विरोधाभास
    note: '*conflict* का मतलब है कि स्रोत किसी बिंदु पर एक-दूसरे को काटते हैं या अलग बात कहते हैं।'
    example_gloss: टकराव का मतलब है कि स्रोत असहमत हैं।
  en.b2.unit08.lesson01.teach.judgement:
    title: judgment
    gloss: निर्णय, सोच-समझकर बनाई गई राय
    note: '*judgment* इस बारे में तर्क के साथ दिया गया निर्णय है कि कौन-सा स्रोत ज़्यादा मज़बूत है। अमेरिकी अंग्रेज़ी में *judgment* लिखा जाता है; ब्रिटिश अंग्रेज़ी में *judgement* भी दिखता है।'
    example_gloss: निर्णय बताता है कि कौन-सा स्रोत ज़्यादा मज़बूत है।
  en.b2.unit08.lesson02.teach_agree_conflict:
    title: सहमति और टकराव साथ-साथ
    gloss: दोनों स्रोत मानते हैं कि माँग बढ़ी, पर वे कारण के बारे में असहमत हैं।
    note: '*Both sources agree... but they disagree...* दो अलग वाक्यों में हर बार *according to* दोहराने से बेहतर है।'
  en.b2.unit08.lesson02.teach_by_contrast:
    title: by contrast
    gloss: इसके उलट, इसके विपरीत
    note: '*By contrast* तब इस्तेमाल कीजिए जब आप सचमुच दो स्रोतों या बिंदुओं की तुलना करके फ़र्क़ दिखा रहे हों। इसे हर जगह "जबकि" या "दूसरी ओर" की जगह भरने वाले शब्द की तरह मत लगाइए।'
  en.b2.unit08.lesson02.teach_better_supported:
    title: better supported
    gloss: बेहतर प्रमाण के साथ समर्थित
    note: '*better supported on the cause* का मतलब है कि कारण के लिए प्रमाण ज़्यादा मज़बूत है।'
  en.b2.unit08.lesson02.teach_grammar_synthesis:
    title: संश्लेषण बनाना
    gloss: संश्लेषण में बताना चाहिए कि स्रोत कहाँ सहमत हैं, कहाँ टकराते हैं और कौन-सा वृत्तांत बेहतर प्रमाण पर टिका है।
    note: स्रोतों के आपसी रिश्ते को सटीक बनाने के लिए *agree*, *conflict* और *better supported* इस्तेमाल कीजिए।
  en.b2.unit08.lesson03.teach_survey:
    title: survey
    gloss: सर्वे, सर्वेक्षण
    note: '*survey* कई लोगों के जवाब या टिप्पणियाँ इकट्ठा करता है।'
    example_gloss: सर्वे में बहुत-सी टिप्पणियाँ इकट्ठा हो सकती हैं।
  en.b2.unit08.lesson03.teach_account:
    title: account
    gloss: वृत्तांत, विवरण
    note: '*account* इसका वृत्तांत या विवरण है कि क्या हुआ।'
    example_gloss: वृत्तांत बताता है कि क्या हुआ।
  en.b2.unit08.lesson03.teach.source_a:
    title: Source A
    gloss: 'स्रोत A: यात्री सर्वे कहता है कि नया अस्पताल खुलने के बाद बसों की देरी ज़्यादा आम हो गई। कई यात्री कहते हैं कि अब यह रूट भीड़ भरा है, ख़ासकर सुबह। सर्वे का तर्क है कि मुख्य कारण बढ़ी हुई माँग है।'
    note: स्रोत A में यात्रियों की बहुत-सी टिप्पणियाँ हैं, पर कारण का सबसे मज़बूत प्रमाण वही अपने-आप नहीं है।
  en.b2.unit08.lesson03.teach.source_b:
    title: Source B
    gloss: 'स्रोत B: ऑपरेटर की रिपोर्ट मानती है कि अस्पताल खुलने के बाद माँग बढ़ी, पर वह देरी का मुख्य कारण ड्राइवरों की कमी बताती है। रिपोर्ट में उसी अवधि के स्टाफ़ के रिकॉर्ड भी हैं।'
    note: '*staffing records* कारण के लिए सिर्फ़ यात्रियों के अनुभव से ज़्यादा मज़बूत प्रमाण देते हैं।'
  en.b2.unit08.lesson04.teach.q_survey:
    title: Tessa स्रोत A बताती है
    gloss: 'Tessa कहती है: मैंने बस सेवा की देरी के बारे में दो वृत्तांत पढ़े। यात्री सर्वे कहता है कि नया अस्पताल खुलने के बाद माँग बढ़ी।'
    note: इससे एक स्रोत और माँग बढ़ने वाली बात सामने आती है।
  en.b2.unit08.lesson04.teach.a_operator:
    title: Rowan स्रोत B बताता है
    gloss: 'Rowan कहता है: ऑपरेटर की रिपोर्ट मानती है कि माँग बढ़ी, पर कहती है कि मुख्य समस्या ड्राइवरों की कमी थी।'
    note: स्रोत B एक बात की पुष्टि करता है, पर कारण पर अलग राय रखता है।
  en.b2.unit08.lesson04.teach.q_agree_conflict:
    title: Tessa संश्लेषण करती है
    gloss: 'Tessa कहती है: तो स्रोत ज़्यादा माँग पर सहमत हैं, पर कारण को लेकर टकराते हैं।'
    note: '*agree on* और *conflict about* स्रोतों के आपसी रिश्ते का सार बताते हैं।'
  en.b2.unit08.lesson04.teach.a_better_supported:
    title: Rowan प्रमाण के बारे में पूछता है
    gloss: 'Rowan पूछता है: कौन-सा वृत्तांत बेहतर प्रमाण पर टिका है?'
    note: वह सिर्फ़ सारांश नहीं, एक निर्णय माँगता है।
  en.b2.unit08.lesson04.teach.q_evidence_compare:
    title: Tessa प्रमाणों की तुलना करती है
    gloss: 'Tessa कहती है: सर्वे में यात्रियों की बहुत-सी टिप्पणियाँ हैं, पर ऑपरेटर की रिपोर्ट में स्टाफ़ के रिकॉर्ड हैं।'
    note: 'यह प्रमाण का सवाल है: टिप्पणियाँ बनाम रिकॉर्ड।'
  en.b2.unit08.lesson04.teach.a_judgement_question:
    title: Rowan निर्णय माँगता है
    gloss: 'Rowan पूछता है: तो फिर तुम्हारा निर्णय क्या है?'
    note: '*judgment* तर्क के साथ निकाला गया निष्कर्ष माँगता है।'
  en.b2.unit08.lesson04.teach.q_final_judgement:
    title: Tessa अपना निर्णय देती है
    gloss: 'Tessa कहती है: कारण के बारे में ऑपरेटर की रिपोर्ट बेहतर प्रमाण पर टिकी है, हालाँकि सर्वे यात्रियों का अनुभव दिखाने के लिए उपयोगी है।'
    note: '*although* दोनों स्रोतों को ध्यान में रखता है और फिर भी निर्णय देता है।'
