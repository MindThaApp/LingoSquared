teaching:
  en.a1.unit63.lesson01.teach.help:
    title: help
    gloss: मदद करना / मदद
    note: '*help* क्रिया ("मदद करना") भी हो सकता है और संज्ञा ("मदद") भी। हिंदी में "मेरी मदद करो" कहते हैं, पर अंग्रेज़ी में *help me* के साथ कोई अलग शब्द नहीं लगता: *help me* में *to* या "की" जैसा कुछ नहीं आता।'
    example_gloss: क्या तुम मेरी मदद कर सकते हो?
  en.a1.unit63.lesson01.teach.carry:
    title: carry
    gloss: उठाकर ले जाना
    note: '*carry* का मतलब कुछ पकड़कर एक जगह से दूसरी जगह ले जाना है।'
    example_gloss: मैं इसे उठा सकता हूँ।
  en.a1.unit63.lesson01.teach.heavy:
    title: heavy
    gloss: भारी
    note: '*heavy* का मतलब भारी (वज़न में) है।'
    example_gloss: यह भारी है।
  en.a1.unit63.lesson01.teach.bag:
    title: bag
    gloss: बैग
    note: '*bag* का मतलब बैग या थैला है।'
    example_gloss: यह बैग भारी है।
  en.a1.unit63.lesson01.teach.door:
    title: door
    gloss: दरवाज़ा
    note: '*door* का मतलब दरवाज़ा है।'
    example_gloss: दरवाज़ा खोलो।
  en.a1.unit63.lesson01.teach.shelf:
    title: shelf
    gloss: अलमारी का खाना, शेल्फ़
    note: '*shelf* का मतलब शेल्फ़ या अलमारी का खाना है, जैसे दीवार पर या अलमारी में। बहुवचन *shelves* है।'
    example_gloss: इसे शेल्फ़ पर रख दो।
  en.a1.unit63.lesson02.teach.can_you_help:
    title: Can you help me?
    gloss: क्या तुम मेरी मदद कर सकते हो?
    note: '*Can you...?* मदद माँगने का सीधा, आम तरीका है।'
  en.a1.unit63.lesson02.teach.bag_heavy:
    title: This bag is heavy.
    gloss: यह बैग भारी है।
    note: जो बैग आपके पास है, उसके लिए *this bag* इस्तेमाल कीजिए।
  en.a1.unit63.lesson02.teach.open_door:
    title: Could you open the door?
    gloss: क्या तुम दरवाज़ा खोल सकोगे?
    note: '*Could you...?* *Can you...?* से ज़्यादा विनम्र लगता है। यह हिंदी के "क्या आप ... सकेंगे?" जैसा है।'
  en.a1.unit63.lesson02.teach.i_can_help:
    title: I can help.
    gloss: मैं मदद कर सकता हूँ।
    note: यह वाक्य मदद की पेशकश करता है।
  en.a1.unit63.lesson02.teach.thank_you_help:
    title: Thank you for your help.
    gloss: तुम्हारी मदद के लिए शुक्रिया।
    note: '*Thank you for...* में धन्यवाद का कारण बताने के लिए *for* आता है, जैसे हिंदी में "... के लिए शुक्रिया"।'
  en.a1.unit63.lesson02.teach.put_on_shelf:
    title: Put it on the shelf.
    gloss: इसे शेल्फ़ पर रख दो।
    note: '*put it on...* का मतलब किसी चीज़ को किसी चीज़ पर रखना है। अंग्रेज़ी में रखने, टिकाने या लगाने, सबके लिए *put* चलता है।'
  en.a1.unit63.lesson03.teach.dialogue_line1:
    title: लैला मदद माँगती है
    gloss: 'लैला कहती है: नमस्ते डेनियल। क्या तुम मेरी मदद कर सकते हो?'
    note: '*Can you help me?* मदद माँगने का बुनियादी वाक्य है।'
  en.a1.unit63.lesson03.teach.dialogue_line2:
    title: डेनियल पूछता है कि क्या चाहिए
    gloss: 'डेनियल कहता है: ज़रूर। तुम्हें क्या चाहिए?'
    note: '*Of course* का मतलब "ज़रूर" है।'
  en.a1.unit63.lesson03.teach.dialogue_line3:
    title: बैग भारी है
    gloss: 'लैला कहती है: यह बैग भारी है।'
    note: '*heavy* बताता है कि मदद की ज़रूरत क्यों है।'
  en.a1.unit63.lesson03.teach.dialogue_line4:
    title: डेनियल बैग उठा सकता है
    gloss: 'डेनियल कहता है: मैं इसे उठा सकता हूँ।'
    note: '*carry it* में *it* बैग की ओर इशारा करता है। अंग्रेज़ी में निर्जीव चीज़ों के लिए *it* ही आता है; हिंदी की तरह पुल्लिंग या स्त्रीलिंग रूप नहीं बदलते।'
  en.a1.unit63.lesson03.teach.dialogue_line5:
    title: लैला दरवाज़ा खोलने को कहती है
    gloss: 'लैला कहती है: क्या तुम दरवाज़ा भी खोल सकोगे?'
    note: '*Could you...?* अनुरोध को विनम्र बनाता है।'
  en.a1.unit63.lesson03.teach.dialogue_line6:
    title: डेनियल शेल्फ़ के बारे में पूछता है
    gloss: 'डेनियल कहता है: हाँ। क्या मैं बैग शेल्फ़ पर रख दूँ?'
    note: '*Can I ...?* से डेनियल बैग शेल्फ़ पर रखने की पेशकश करता है।'
  en.a1.unit63.lesson03.teach.dialogue_line7:
    title: लैला डेनियल का शुक्रिया अदा करती है
    gloss: 'लैला कहती है: हाँ, कृपया। तुम्हारी मदद के लिए शुक्रिया।'
    note: '*Thank you for your help* शुक्रिया कहने का पक्का वाक्य है।'
  en.a1.unit63.lesson03.teach.dialogue_line8:
    title: डेनियल जवाब देता है
    gloss: 'डेनियल कहता है: कोई बात नहीं।'
    note: '*No problem* एक छोटा, दोस्ताना जवाब है।'
  en.a1.unit63.lesson04.teach.help_note:
    title: मदद का नोट
    gloss: 'मदद का नोट: नीला बैग भारी है। कृपया उसे दरवाज़े के पास वाले शेल्फ़ पर रख दीजिए।'
    note: नोट बताता है कि कौन-सा बैग है और उसे कहाँ रखना है।
  en.a1.unit63.lesson04.teach.reading_passage:
    title: 'पाठ: एक मददगार पड़ोसी'
    gloss: 'एक मददगार पड़ोसी: लैला के पास एक भारी नीला बैग था। उसने डेनियल को दरवाज़े के पास देखा और मदद माँगी। डेनियल बैग अंदर उठा ले गया। लैला ने उससे दरवाज़ा भी खोलने को कहा। फिर डेनियल ने बैग दरवाज़े के पास वाले शेल्फ़ पर रख दिया। लैला ने डेनियल की मदद के लिए उसका शुक्रिया अदा किया। डेनियल ने कहा, कोई बात नहीं। बाद में लैला ने एक छोटा नोट लिखा: नीला बैग शेल्फ़ पर है।'
    note: '*carried*, *carry* का भूतकाल रूप है।'
