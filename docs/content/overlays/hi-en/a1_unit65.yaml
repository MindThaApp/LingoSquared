    note: '*return this shirt* का मतलब है इस शर्ट को वापस करना।'
  en.a1.unit65.lesson03.teach.dialogue_line2:
    title: कर्मचारी रसीद माँगता है
    gloss: 'कर्मचारी कहता है: क्या आपके पास रसीद है?'
    note: '*Do you have...?* पूछता है कि किसी के पास कोई चीज़ है या नहीं।'
  en.a1.unit65.lesson03.teach.dialogue_line3:
    title: डैनियल के पास रसीद है
    gloss: 'डैनियल कहता है: जी हाँ, यह रही। साइज़ बहुत छोटा है।'
    note: '*Here it is* का मतलब है "यह रही"।'
  en.a1.unit65.lesson03.teach.dialogue_line4:
    title: कर्मचारी बदलने का सुझाव देता है
    gloss: 'कर्मचारी कहता है: हम इसे बड़े साइज़ से बदल सकते हैं।'
    note: '*for a larger size* बताता है कि चीज़ किसके बदले बदली जा रही है।'
  en.a1.unit65.lesson03.teach.dialogue_line5:
    title: "डैनियल हाँ कहता है"
    gloss: 'डैनियल कहता है: जी हाँ, कृपया।'
    note: '*Yes, please* पुष्टि करने का विनम्र तरीक़ा है।'
  en.a1.unit65.lesson03.teach.dialogue_line6:
    title: बड़ा साइज़ मौजूद है
    gloss: 'कर्मचारी कहता है: हमारे पास नीले रंग में बड़ा साइज़ है।'
    note: '*We have...* बताता है कि क्या उपलब्ध है।'
  en.a1.unit65.lesson03.teach.dialogue_line7:
    title: डैनियल को पैसे वापस नहीं चाहिए
    gloss: 'डैनियल कहता है: बढ़िया। मुझे पैसे वापस नहीं चाहिए।'
    note: '*I do not need* का मतलब है "मुझे ज़रूरत नहीं है"।'
  en.a1.unit65.lesson04.teach.return_note:
    title: वापसी पर्ची
    gloss: 'वापसी पर्ची: नीली शर्ट। साइज़ छोटा। बड़े साइज़ से बदलें। रसीद ज़रूरी।'
    note: पर्ची में सामान, साइज़, किया जाने वाला काम और रसीद का ज़िक्र है।
  en.a1.unit65.lesson04.teach.reading_passage:
    title: 'पाठ: दुकान में बदलाव'
    gloss: 'दुकान में बदलाव: डैनियल ने एक नीली शर्ट ख़रीदी, पर साइज़ बहुत छोटा था। वह रसीद लेकर दुकान में वापस गया। कर्मचारी ने रसीद माँगी और बड़ा साइज़ देने की पेशकश की। डैनियल ने शर्ट बदल ली। उसे पैसे वापस नहीं चाहिए थे, क्योंकि बड़ी नीली शर्ट ठीक थी।'
    note: '*exchanged* क्रिया *exchange* का भूतकाल है।'
