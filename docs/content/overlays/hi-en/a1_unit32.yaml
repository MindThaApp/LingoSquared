    note: '*bird* का मतलब है चिड़िया।'
    example_gloss: हमारे पास एक चिड़िया है।
  en.a1.unit32.lesson01.teach.pet:
    title: pet
    gloss: पालतू जानवर
    note: '*pet* का मतलब है पालतू जानवर; *pets* इसका बहुवचन है। प्रश्न *Do you have any pets?* में *any* पर ध्यान दें। अंग्रेज़ी में प्रश्नों और नकारात्मक वाक्यों में बहुवचन और अगणनीय संज्ञाओं के साथ *any* लगता है, और इसे छोड़ा नहीं जा सकता।'
    example_gloss: क्या आपके कोई पालतू जानवर हैं?
  en.a1.unit32.lesson02.teach.name_is:
    title: Her name is Luna.
    gloss: उसका नाम लूना है।
    note: अंग्रेज़ी में पालतू जानवर का लिंग पता हो तो *her*/*his* (और *she*/*he*) कहा जाता है। *Her name is Luna* एक मादा जानवर के बारे में है।
  en.a1.unit32.lesson02.teach.play:
    title: play
    gloss: खेलना
    note: '*play* का मतलब है खेलना।'
    example_gloss: मेरे कुत्ते को खेलना पसंद है।
  en.a1.unit32.lesson02.teach.walk:
