  en.a1.unit32.lesson03.teach.dialogue_line1:
    title: डैनियल का सवाल
    gloss: 'डैनियल पूछता है: मिया, क्या तुम्हारे कोई पालतू जानवर हैं?'
    note: प्रश्न में *any* का इस्तेमाल ज़रूरी है; इसे छोड़ा नहीं जा सकता।
  en.a1.unit32.lesson03.teach.dialogue_line2:
    title: "मिया का जवाब"
    gloss: 'मिया कहती है: हाँ, मेरे पास एक बिल्ली है। उसका नाम लूना है।'
    note: बिल्ली के लिए *she* और *her* इसलिए आए हैं क्योंकि उसका लिंग (मादा) पता है।
  en.a1.unit32.lesson03.teach.dialogue_line3:
    title: डैनियल का अगला सवाल
    gloss: 'डैनियल कहता है: वाह, बहुत अच्छा! क्या उसे खेलना पसंद है?'
    note: यहाँ *Does*, *she* के साथ आने वाली सहायक क्रिया है (do-support), जैसे दूसरे सवालों में।
  en.a1.unit32.lesson03.teach.dialogue_line4:
    title: "मिया का जवाब"
    gloss: 'मिया कहती है: हाँ, उसे गेंद से खेलना बहुत पसंद है। और तुम्हारा?'
    note: '*What about you?* वही सवाल दूसरे से पूछने का छोटा और स्वाभाविक तरीका है।'
  en.a1.unit32.lesson03.teach.dialogue_line5:
    title: "डैनियल का जवाब"
    gloss: 'डैनियल कहता है: मेरे पास एक छोटी मछली है, पर मुझे कुत्ता चाहिए।'
    note: 'यहाँ *but* दो उलटे विचारों को जोड़ता है: उसके पास पहले से एक पालतू जानवर है, पर वह दूसरा जानवर चाहता है।'
  en.a1.unit32.lesson04.teach.reading_passage:
    title: लैला और डैनियल के बारे में पाठ
    gloss: लैला के पास मैक्स नाम का एक कुत्ता है। वह बड़ा और बहुत मिलनसार है। वह हर सुबह उसे टहलाने ले जाती है। डैनियल के पास कुत्ता नहीं है, पर उसके पास एक छोटी मछली है। मछली को टहलाने की ज़रूरत नहीं होती, फिर भी डैनियल को उसे तैरते हुए देखना अच्छा लगता है।
    note: मैक्स के लिए *He* का इस्तेमाल हुआ है क्योंकि वह नर कुत्ता है। यहाँ भी जानवर के असली लिंग के हिसाब से *she* या *he* चुना जाता है।
