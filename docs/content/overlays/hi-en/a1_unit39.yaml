    note: '*a five-minute walk* अंग्रेज़ी का एक तयशुदा ढाँचा है (संख्या + संज्ञा, बीच में हाइफ़न, और *walk* से पहले की संज्ञा एकवचन में)। हिंदी में हम सीधे "पैदल पाँच मिनट" कहते हैं।'
    example_gloss: पार्क मेरे घर से पैदल पाँच मिनट की दूरी पर है।
  en.a1.unit39.lesson02.teach.say_hello_to:
