    example_gloss: मैं सुबह हमेशा अपने पड़ोसी को नमस्ते कहता हूँ।
  en.a1.unit39.lesson02.teach.whats_your_neighborhood_like_question:
    title: What's your neighborhood like?
    gloss: आपका मोहल्ला कैसा है?
    note: '*What''s ... like?* किसी चीज़ का वर्णन पूछता है, पसंद नहीं।'
  en.a1.unit39.lesson03.teach.dialogue_line1:
    title: लैला का सवाल
    gloss: 'लैला कहती है: मैं शायद जल्द ही घर बदल लूँगी। आपका मोहल्ला कैसा है, मिया?'
    note: '*might* + क्रिया संभावना बताता है -- हो भी सकता है, नहीं भी।'
  en.a1.unit39.lesson03.teach.dialogue_line2:
    title: "मिया का जवाब"
    gloss: 'मिया कहती है: मुझे यह सच में पसंद है। यह शांत है, और पास में एक पार्क है।'
    note: '*there''s a park nearby* का मतलब है पास में एक पार्क है।'
  en.a1.unit39.lesson03.teach.dialogue_line3:
    title: लैला का सवाल
    gloss: 'लैला कहती है: यह अच्छा लगता है। क्या यह किसी किराने की दुकान के पास है?'
    note: '*That sounds nice* अच्छी खबर पर एक स्वाभाविक प्रतिक्रिया है।'
  en.a1.unit39.lesson03.teach.dialogue_line4:
    title: "मिया का जवाब"
    gloss: 'मिया कहती है: हाँ, मेरी इमारत से बस पैदल पाँच मिनट की दूरी पर एक है।'
    note: '*just* का मतलब यहाँ सिर्फ़ या महज़ है -- यह ज़ोर देता है कि दूरी कितनी कम है।'
  en.a1.unit39.lesson03.teach.dialogue_line5:
    title: लैला का सवाल
    gloss: 'लैला पूछती है: और आपके पड़ोसी? क्या वे मिलनसार हैं?'
    note: '*What about ...?* नया विषय शुरू करने का एक स्वाभाविक तरीका है।'
  en.a1.unit39.lesson03.teach.dialogue_line6:
    title: "मिया का जवाब"
    gloss: 'मिया कहती है: बहुत मिलनसार! जब मैं बाहर होती हूँ, तो मेरे पड़ोसी श्री लोपेज़ मेरे पौधों में पानी डालते हैं।'
    note: '*waters my plants* का मतलब है मेरे पौधों में पानी डालता है -- अंग्रेज़ी में यहाँ *water* एक क्रिया है।'
  en.a1.unit39.lesson03.teach.dialogue_line7:
    title: लैला की प्रतिक्रिया
    gloss: 'लैला कहती है: यह बहुत अच्छी बात है। मुझे लगता है मैं आपके पास रहना चाहूँगी!'
    note: '*I''d like to* + क्रिया का मतलब है: मैं ... करना चाहूँगा/चाहूँगी।'
  en.a1.unit39.lesson04.teach.reading_passage:
    title: तीन मोहल्लों के बारे में पाठ
    gloss: डैनियल, लैला और मिया तीनों अलग-अलग मोहल्लों में रहते हैं। डैनियल का मोहल्ला व्यस्त है, जहाँ उसके अपार्टमेंट की इमारत के पास रेस्तराँ और दुकानें हैं। वह अपने कई पड़ोसियों को जानता है और गलियारे में अक्सर उन्हें नमस्ते कहता है। लैला एक शांत मोहल्ले में रहती है, उस स्विमिंग पूल के पास जहाँ वह तैरती है। सड़क के उस पार रहने वाले उसके पड़ोसी का एक बड़ा कुत्ता है जो बहुत भौंकता है। मिया का मोहल्ला भी शांत है, जहाँ उसकी इमारत से पैदल पाँच मिनट की दूरी पर एक किराने की दुकान है। उसके पड़ोसी श्री लोपेज़ बहुत मिलनसार हैं और जब वह बाहर होती है तो उसके पौधों में पानी डालते हैं। मिया से बात करने के बाद लैला ने तय किया कि वह उसके पास कोई अपार्टमेंट ढूँढ़ना चाहती है।
    note: '*decided she wants to look for* का मतलब है: तय किया कि वह ढूँढ़ना चाहती है।'
