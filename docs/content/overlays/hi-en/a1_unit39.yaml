  en.a1.unit39.lesson02.teach.get_along_with_your_neighbors:
    title: get along with your neighbors
    gloss: अपने पड़ोसियों से अच्छे संबंध रखना
    note: '*get along with your neighbors* का मतलब है अपने आस-पास रहने वाले लोगों से अच्छे, दोस्ताना संबंध रखना।'
    example_gloss: मेरे अपने पड़ोसियों से अच्छे संबंध हैं।
  en.a1.unit39.lesson02.teach.close_to:
