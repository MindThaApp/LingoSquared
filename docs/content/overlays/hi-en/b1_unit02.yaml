    gloss: मैं इसे रिन्यू कर सकता हूँ। मैं इसे रिन्यू कर पाया। मैं तुम्हारी मदद कर सकता हूँ।
    note: '*am able to* (अभी), *was able to* (बीता समय), *would be able to* (काल्पनिक बात या मदद की पेशकश) एक ही ढाँचे के अलग-अलग रूप हैं।'
  en.b1.unit02.lesson03.teach.friend:
