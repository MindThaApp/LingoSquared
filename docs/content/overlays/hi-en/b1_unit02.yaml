    example_gloss: नया सिस्टम बहुत तेज़ है।
  en.b1.unit02.lesson03.teach.reading_passage:
    title: 'पाठ: नया सिस्टम'
    gloss: पिछले साल लोग अपने ड्राइविंग लाइसेंस ऑनलाइन रिन्यू नहीं कर पाते थे। सबको खुद दफ़्तर जाना पड़ता था। इस साल सिस्टम बदल गया। अब लोग सब कुछ घर बैठे रिन्यू कर पाते हैं। मेरी दोस्त Mia अपना लाइसेंस दस मिनट में रिन्यू कर पाई।
    note: एक छोटा पाठ, जिसमें बताया गया है कि नए सिस्टम ने रिन्यू करना कैसे आसान बना दिया।
