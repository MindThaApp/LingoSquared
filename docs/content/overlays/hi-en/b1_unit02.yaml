    title: लैला ड्राइविंग लाइसेंस के बारे में पूछती है
    gloss: 'Leila कहती है: क्या तुम अपना ड्राइविंग लाइसेंस ऑनलाइन रिन्यू कर पाए?'
    note: '*were you able to* बीते समय की संभावना के बारे में पूछता है।'
  en.b1.unit02.lesson04.teach.a_wasnt_able_office:
    title: 'डैनियल का जवाब: ऑनलाइन नहीं हो पाया'
    gloss: 'Daniel कहता है: नहीं, मैं नहीं कर पाया। मुझे खुद दफ़्तर जाना पड़ा।'
    note: '*wasn''t able to*, *was not able to* का बोलचाल वाला छोटा रूप है।'
  en.b1.unit02.lesson04.teach.q_really_managed:
    title: लैला अपने अनुभव के बारे में बताती है
    gloss: 'Leila कहती है: सच में? मैं तो इसे दस मिनट में ऑनलाइन कर पाई।'
    note: '*managed to* ज़ोर देता है कि Leila को यह जल्दी और आसानी से हो गया।'
  en.b1.unit02.lesson04.teach.a_next_time_save:
    title: डैनियल अगली बार के बारे में सोचता है
    gloss: 'Daniel कहता है: अगली बार अगर मैं भी इसे ऑनलाइन करूँ तो समय बचा सकूँगा।'
    note: '*would be able to* यहाँ आगे की एक काल्पनिक संभावना बताता है।'
  en.b1.unit02.lesson04.teach.q_would_help:
    title: लैला मदद की पेशकश करती है
    gloss: 'Leila कहती है: अगर तुम चाहो तो अगली बार मैं तुम्हारी मदद कर सकती हूँ।'
    note: '*would be able to* यहाँ विनम्र पेशकश के लिए इस्तेमाल हुआ है।'
  en.b1.unit02.lesson04.teach.a_thanks:
    title: डैनियल धन्यवाद देता है
    gloss: 'Daniel कहता है: शुक्रिया, यह अच्छा रहेगा।'
