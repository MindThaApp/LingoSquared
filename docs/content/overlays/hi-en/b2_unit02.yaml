teaching:
  en.b2.unit02.lesson01.teach.may:
    title: may
    gloss: हो सकता है, संभव है
    note: '*may* संभावना बताता है। यहाँ इसका अर्थ अनुमति नहीं है, जैसा *May I...?* में होता है।'
    example_gloss: यह सच हो सकता है।
  en.b2.unit02.lesson01.teach.might:
    title: might
    gloss: शायद, हो भी सकता है
    note: '*might* सावधानी से कही गई संभावना बताता है, अक्सर *may* से थोड़ा कम पक्की।'
    example_gloss: यह शायद सच हो।
  en.b2.unit02.lesson01.teach.must:
    title: must
    gloss: ज़रूर, अवश्य ही
    note: '*must* यहाँ प्रमाण के आधार पर निकाला गया पक्का निष्कर्ष बताता है, कोई बाध्यता नहीं।'
    example_gloss: यह ज़रूर सच होगा।
  en.b2.unit02.lesson01.teach.cannot:
    title: cannot
    gloss: नहीं हो सकता, असंभव है
    note: '*cannot* तब इस्तेमाल करें जब प्रमाण किसी बात को खारिज कर दे। भूतकाल में यह *cannot have been* बनता है।'
    example_gloss: यह सच नहीं हो सकता।
  en.b2.unit02.lesson01.teach.deduction:
    title: deduction
    gloss: प्रमाण पर आधारित निष्कर्ष
    note: '*deduction* संकेतों से तर्क करके निष्कर्ष निकालना है, यूँ ही अंदाज़ा लगाना नहीं।'
    example_gloss: मिया का निष्कर्ष प्रमाण पर आधारित है।
  en.b2.unit02.lesson01.teach.guesswork:
    title: guesswork
    gloss: अंदाज़ा, अटकलबाज़ी
    note: '*guesswork* बहुत कम या बिना प्रमाण का अंदाज़ा है।'
    example_gloss: प्रमाण के बिना यह स्पष्टीकरण सिर्फ़ अटकलबाज़ी होता।
  en.b2.unit02.lesson01.teach.may_might_contrast:
    title: may en might
    gloss: May और might अक्सर एक-दूसरे से मिलते-जुलते हैं। दोनों किसी संभावित कारण को दिखाते हैं; might अक्सर थोड़ा ज़्यादा सतर्क लगता है।
    note: हिंदी के "शायद" का हर बार शब्दशः अनुवाद *maybe* से न करें। सावधानी से बनाए गए वाक्य में *may* और *might* अक्सर ज़्यादा सुघड़ लगते हैं।
  en.b2.unit02.lesson02.teach.must_have_gone_down:
    title: भूतकाल का पक्का निष्कर्ष
    gloss: सर्वर रात भर में बंद हो गया होगा, क्योंकि कोई रिपोर्ट नहीं बनी।
    note: 'हिंदी का "... गया होगा" अंग्रेज़ी में *must have* + past participle (क्रिया का तीसरा रूप) बनता है: *must have gone down*।'
  en.b2.unit02.lesson02.teach.may_have_failed:
    title: भूतकाल का संभावित कारण
    gloss: रिपोर्टें रात में शायद विफल हो गईं।
    note: '*may have failed* एक संभावित कारण है, पक्का निष्कर्ष नहीं।'
  en.b2.unit02.lesson02.teach.might_have_permission:
    title: सतर्क संभावना
    gloss: यह इसके बजाय अनुमतियों (permissions) की समस्या भी हो सकती थी।
    note: '*might have been* कारण को खुला रखता है और *must have been* से ज़्यादा सतर्क लगता है।'
  en.b2.unit02.lesson02.teach.cannot_have_only_report:
    title: किसी बात को खारिज करना
    gloss: यह सिर्फ़ रिपोर्ट की समस्या नहीं हो सकती थी।
    note: हिंदी का "यह नहीं हुआ होगा / यह नहीं हो सकता था" यहाँ अंग्रेज़ी में *cannot have been* बनता है, या बोलचाल में *can't have been*।
  en.b2.unit02.lesson02.teach.grammar_modal_deduction:
    title: अनुमान के लिए modal क्रियाएँ
    gloss: वर्तमान के पक्के निष्कर्ष के लिए must be और भूतकाल के पक्के निष्कर्ष के लिए must have been इस्तेमाल कीजिए। वर्तमान की संभावना के लिए may/might और भूतकाल की संभावना के लिए may have/might have इस्तेमाल कीजिए। जब प्रमाण किसी स्पष्टीकरण को खारिज कर दे, तब cannot/cannot have been इस्तेमाल कीजिए।
    note: 'ध्यान दें: यहाँ *must* का अर्थ "करना ही पड़ेगा" वाली बाध्यता नहीं है, बल्कि "ऐसा ही होगा" वाला निष्कर्ष है।'
  en.b2.unit02.lesson03.teach.outage:
    title: outage
    gloss: सिस्टम का ठप पड़ जाना, सेवा-बाधा
    note: '*outage* वह स्थिति है जब कोई सिस्टम या सेवा काम नहीं करती।'
    example_gloss: सिस्टम के बंद होने की वजह से रिपोर्टें नहीं चल पाईं।
  en.b2.unit02.lesson03.teach.consequence:
    title: consequence
    gloss: परिणाम, नतीजा
    note: '*consequence* किसी कारण या समस्या का नतीजा होता है।'
    example_gloss: एक नतीजा यह है कि डैशबोर्ड पुराना डेटा दिखा सकता है।
  en.b2.unit02.lesson03.teach.reading_passage:
    title: 'पठन-पाठ: शायद क्या हुआ होगा?'
    gloss: रात की रिपोर्टें नहीं चलीं, और मॉनिटरिंग पेज खाली है। मिया कहती है कि सर्वर रात के दौरान बंद हो गया होगा। डैनियल सुझाता है कि यह अनुमतियों की समस्या भी हो सकती थी, लेकिन वह खाली मॉनिटरिंग पेज को नहीं समझा सकती। हो सकता है कि फ़ाइनेंस टीम के पास सुबह के आँकड़े न पहुँचे हों, और जब तक रिपोर्टें दोबारा नहीं बन जातीं, क्लाइंट डैशबोर्ड पुराना डेटा दिखा सकता है। मिया पूरी तरह निश्चित नहीं है, लेकिन उसका स्पष्टीकरण उपलब्ध प्रमाण से निकाला गया निष्कर्ष है, केवल अटकलबाज़ी नहीं।
    note: यह पाठ तथ्यों, संभावित कारणों, पक्के निष्कर्षों, खारिज किए गए स्पष्टीकरणों और संभावित नतीजों को अलग-अलग रखता है।
  en.b2.unit02.lesson04.teach.q_no_reports:
    title: डैनियल तथ्य बताता है
    gloss: 'डैनियल कहता है: रात की कोई भी रिपोर्ट नहीं बनी।'
    note: यह ज्ञात तथ्य है, अभी अनुमान नहीं।
  en.b2.unit02.lesson04.teach.a_server_down:
    title: मिया पक्का निष्कर्ष निकालती है
    gloss: 'मिया कहती है: सर्वर रात में बंद हो गया होगा।'
    note: '*must have gone down* भूतकाल का पक्का निष्कर्ष है।'
  en.b2.unit02.lesson04.teach.q_permission_issue:
    title: डैनियल एक संभावित कारण बताता है
    gloss: 'डैनियल कहता है: यह इसके बजाय अनुमतियों की समस्या भी हो सकती थी।'
    note: '*might have been* विकल्प को खुला रखता है, पर उसे पक्का नहीं बनाता।'
  en.b2.unit02.lesson04.teach.a_cannot_only_report:
    title: मिया एक सीमित स्पष्टीकरण को खारिज करती है
    gloss: 'मिया कहती है: हो सकता है, पर मॉनिटरिंग पेज भी खाली है, इसलिए यह सिर्फ़ रिपोर्ट की समस्या नहीं हो सकती थी।'
    note: '*cannot have been only...* स्पष्टीकरण को खारिज करता है, क्योंकि प्रमाण उससे व्यापक है।'
  en.b2.unit02.lesson04.teach.q_consequences:
    title: डैनियल नतीजों के बारे में पूछता है
    gloss: 'डैनियल पूछता है: हमें किन नतीजों की उम्मीद करनी चाहिए?'
    note: कारण के बाद संभावित नतीजों का सवाल आता है।
  en.b2.unit02.lesson04.teach.a_possible_consequences:
    title: मिया संभावित नतीजे बताती है
    gloss: 'मिया कहती है: हो सकता है फ़ाइनेंस टीम के पास सुबह के आँकड़े न पहुँचे हों, और क्लाइंट डैशबोर्ड पुराना डेटा दिखा सकता है।'
    note: '*may be missing* और *might show* संभावित नतीजे बताते हैं, पक्के तथ्य नहीं।'
  en.b2.unit02.lesson04.teach.q_deduction_guess:
    title: डैनियल निश्चितता जाँचता है
    gloss: 'डैनियल कहता है: तो यह एक निष्कर्ष है, सिर्फ़ अंदाज़ा नहीं?'
    note: डैनियल पूछता है कि क्या मिया का तर्क प्रमाण पर टिका है।
  en.b2.unit02.lesson04.teach.a_evidence_limited:
    title: मिया अपने निष्कर्ष को संतुलित करती है
    gloss: 'मिया कहती है: हाँ। प्रमाण सीमित है, लेकिन वह सिस्टम के बंद होने की ओर इशारा करता है।'
    note: पक्का निष्कर्ष भी प्रमाण की सीमा को स्वीकार कर सकता है।
