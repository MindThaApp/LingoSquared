  en.a2.unit38.lesson01.teach.fixed:
    title: fixed
    gloss: ठीक किया हुआ
    note: '*fixed* क्रिया *to fix* (ठीक करना) का रूप है और बताता है कि चीज़ अब खराब नहीं है।'
    example_gloss: सिंक अब ठीक हो गया है और पानी निकलना बंद हो गया है।
  en.a2.unit38.lesson01.teach.afternoon:
    title: afternoon
    gloss: दोपहर बाद
    note: '*afternoon* दिन का वह हिस्सा है जो दोपहर के बाद आता है; सुबह को *morning* कहते हैं।'
    example_gloss: प्लंबर दोपहर बाद आया, सुबह नहीं।
  en.a2.unit38.lesson01.teach.grammar_cant_wont:
    title: can't और won't, जब कुछ नहीं चलता
    gloss: मैं दोपहर 2 से 4 बजे के बीच घर पर नहीं रह सकता। मैं दोपहर बाद घर पर नहीं रहूँगा।
    note: '*can''t* बताता है कि कुछ मुमकिन नहीं है। *won''t* बताता है कि आगे ऐसा नहीं होगा।'
  en.a2.unit38.lesson02.teach.need_to_reschedule:
