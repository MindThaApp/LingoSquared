    gloss: क्या यह संभव होगा कि वे इसकी जगह सुबह आ जाएँ?
    note: '*Would it be possible to ...?* कुछ माँगने का सबसे नरम तरीका है। *instead* का मतलब है "इसकी जगह"।'
  en.a2.unit38.lesson02.teach.leave_key_with_neighbor:
