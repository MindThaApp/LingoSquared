    gloss: 'Daniel कहता है: मैं दोपहर 2 से 4 बजे के बीच घर पर नहीं रह सकता, क्योंकि उस वक़्त मैं काम पर होता हूँ। क्या यह संभव होगा कि वे इसकी जगह सुबह आ जाएँ?'
