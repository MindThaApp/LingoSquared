    example_gloss: मुझे मरम्मत के नए समय के बारे में एक संदेश मिला।
  en.a2.unit38.lesson03.teach.rescheduling_text:
    title: नई तारीख़ का संदेश
    gloss: मरम्मत 6180 का समय बदल दिया गया है। प्लंबर कल सुबह 9 से 11 बजे के बीच आएगा। आपका पड़ोसी दरवाज़ा खोलेगा। कृपया इस नए समय की पुष्टि आज ही संदेश से करें।
    note: 'बिल्डिंग मैनेजर का संदेश छोटा और सीधा होता है: क्या बदला, कब, और आपको अब क्या करना है।'
