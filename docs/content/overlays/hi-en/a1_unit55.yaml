    example_gloss: पूल में जाने के लिए आपको टिकट चाहिए।
  en.a1.unit55.lesson01.teach.locker:
    title: locker
    gloss: लॉकर
    note: '*locker* का मतलब है लॉकर, यानी सामान रखने की ताले वाली छोटी अलमारी।'
    example_gloss: अपना बैग लॉकर में रख दीजिए।
  en.a1.unit55.lesson01.teach.swim_cap:
    title: swim cap
    gloss: स्विम कैप (तैराकी की टोपी)
    note: '*swim cap* का मतलब है तैराकी की टोपी।'
    example_gloss: कृपया पूल में स्विम कैप पहनिए।
  en.a1.unit55.lesson01.teach.rules:
    title: rules
    gloss: नियम
    note: '*rules* का मतलब है नियम।'
    example_gloss: तैरने से पहले पूल के नियम पढ़ लीजिए।
  en.a1.unit55.lesson01.teach.lifeguard:
    title: lifeguard
    gloss: लाइफ़गार्ड / जीवन-रक्षक
    note: '*lifeguard* का मतलब है लाइफ़गार्ड, यानी वह व्यक्ति जो तैराकों पर नज़र रखता है।'
    example_gloss: लाइफ़गार्ड हर दिन पूल की निगरानी करता है।
  en.a1.unit55.lesson02.teach.id_like_to_buy_a_ticket:
    title: I'd like to buy a ticket, please.
    gloss: मुझे एक टिकट ख़रीदना है, कृपया।
    note: '*I''d like to* (*I would like to* का छोटा रूप) कुछ माँगने का विनम्र तरीक़ा है।'
  en.a1.unit55.lesson02.teach.where_are_the_lockers:
    title: Where are the lockers?
    gloss: लॉकर कहाँ हैं?
    note: '*Where are...?* में क्रिया विषय से पहले आती है, जो अंग्रेज़ी के सवालों की ख़ास बनावट है; हिंदी में "कहाँ हैं" आम तौर पर वाक्य के बीच में आता है।'
  en.a1.unit55.lesson02.teach.what_time_do_you_open:
    title: What time do you open?
    gloss: आप कितने बजे खुलते हैं?
    note: '*do you open* में सवाल बनाने के लिए सहायक क्रिया *do* आई है।'
  en.a1.unit55.lesson02.teach.its_five_dollars_for_one_ticket:
    title: It's five dollars for one ticket.
    gloss: एक टिकट के पाँच डॉलर हैं।
    note: '*for one ticket* का मतलब है "एक टिकट के लिए"।'
  en.a1.unit55.lesson02.teach.do_i_need_a_swim_cap:
    title: Do I need a swim cap?
    gloss: क्या मुझे स्विम कैप चाहिए?
    note: '*Do I need...?* में सवाल बनाने के लिए सहायक क्रिया *do* आई है।'
  en.a1.unit55.lesson02.teach.we_close_at_eight:
    title: We close at eight o'clock.
    gloss: हम आठ बजे बंद हो जाते हैं।
    note: '*at eight o''clock* में अंग्रेज़ी घड़ी के तय समय के लिए *at* इस्तेमाल करती है, जैसे हिंदी में "आठ बजे" कहते हैं।'
  en.a1.unit55.lesson03.teach.dialogue_line1:
    title: लाइफ़गार्ड उनका स्वागत करता है
    gloss: 'लाइफ़गार्ड कहता है: नमस्ते! क्या आप आज तैरने आए हैं?'
    note: '*Are you here to swim today?* में *to swim* उद्देश्य बताता है, जैसे हिंदी में "तैरने के लिए"।'
  en.a1.unit55.lesson03.teach.dialogue_line2:
    title: डैनियल के टिकट
    gloss: 'डैनियल कहता है: जी, दो टिकट, कृपया।'
    note: यह दो टिकटों की एक छोटी, सीधी माँग है।
  en.a1.unit55.lesson03.teach.dialogue_line3:
    title: क़ीमत
    gloss: 'लाइफ़गार्ड कहता है: ज़रूर! एक टिकट के पाँच डॉलर हैं।'
    note: 'यह एक अलग जानकारी है: एक टिकट की क़ीमत।'
  en.a1.unit55.lesson03.teach.dialogue_line4:
    title: मिया स्विम कैप के बारे में पूछती है
    gloss: 'मिया कहती है: क्या हमें स्विम कैप चाहिए?'
    note: '*Do we need...?* में भी सवाल बनाने के लिए सहायक क्रिया *do* आई है।'
  en.a1.unit55.lesson03.teach.dialogue_line5:
    title: स्विम कैप का नियम
    gloss: 'लाइफ़गार्ड कहता है: जी, पूल में स्विम कैप पहनना ज़रूरी है।'
    note: '*swim caps are required* कर्मवाच्य (passive) है; नियम बताने का यह औपचारिक तरीक़ा है, जो पूल के बोर्डों पर और कर्मचारियों से अक्सर सुनने को मिलता है। हिंदी में भी इसे "स्विम कैप ज़रूरी है" या "स्विम कैप पहननी होगी" कहा जा सकता है।'
  en.a1.unit55.lesson03.teach.dialogue_line6:
    title: डैनियल लॉकरों के बारे में पूछता है
    gloss: 'डैनियल कहता है: लॉकर कहाँ हैं?'
    note: यह एक छोटा सवाल है, क़ीमत या समय के बारे में कोई नई जानकारी नहीं।
  en.a1.unit55.lesson03.teach.dialogue_line7:
    title: लॉकरों की जगह
    gloss: 'लाइफ़गार्ड कहता है: लॉकर प्रवेश-द्वार के पास हैं।'
    note: 'यह एक अलग जानकारी है: लॉकरों की जगह, जो इससे अलग है कि लॉकरों को क्या चाहिए।'
  en.a1.unit55.lesson03.teach.dialogue_line8:
    title: लॉकरों को क्या चाहिए
    gloss: 'लाइफ़गार्ड कहता है: उनके लिए एक डॉलर का सिक्का चाहिए।'
    note: '*a dollar coin* अंग्रेज़ी के दो शब्दों (*dollar* + *coin*) से बना है, जो अलग-अलग लिखे जाते हैं। हिंदी में इसे "एक डॉलर का सिक्का" कहा जाता है।'
  en.a1.unit55.lesson03.teach.dialogue_line9:
    title: मिया बंद होने का समय पूछती है
    gloss: 'मिया कहती है: आप कितने बजे बंद होते हैं?'
    note: '*What time do you close?* में सवाल बनाने के लिए सहायक क्रिया *do* आई है।'
  en.a1.unit55.lesson03.teach.dialogue_line10:
    title: बंद होने का समय
    gloss: 'लाइफ़गार्ड कहता है: हम आठ बजे बंद हो जाते हैं।'
    note: 'यह चौथी, अलग जानकारी है: बंद होने का समय।'
  en.a1.unit55.lesson04.teach.reading_passage:
    title: स्विम पूल में एक दिन पर पाठ
    gloss: 'स्विम पूल की एक यात्रा: जुलाई की एक तपती दोपहर डैनियल और मिया ने मोहल्ले के स्विमिंग पूल में ठंडक पाने का फ़ैसला किया। प्रवेश-द्वार के पास एक बोर्ड पर पूल के नियम लिखे थे: दौड़ना मना है, और पूल में स्विम कैप पहनना ज़रूरी है। उन्होंने लाइफ़गार्ड से दो टिकट माँगे। एक टिकट के पाँच डॉलर थे। लाइफ़गार्ड ने समझाया कि लॉकर प्रवेश-द्वार के पास हैं और उनके लिए एक डॉलर का सिक्का चाहिए। डैनियल और मिया ने अपने बैग एक लॉकर में रखे और लगभग दो घंटे तैरे। जाने से पहले उन्होंने बोर्ड फिर देखा: पूल आठ बजे बंद होता है। मिया ने कहा कि वह अगले सप्ताहांत फिर आना चाहती है और डाइविंग बोर्ड आज़माना चाहती है।'
    note: '*required* कर्मवाच्य (passive) रूप है; *swim caps are required* का मतलब है "स्विम कैप पहनना ज़रूरी है"।'
