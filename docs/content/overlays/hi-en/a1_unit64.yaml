  en.a1.unit64.lesson03.teach.dialogue_line1:
    title: "मिया तारीफ़ करती है"
    gloss: 'मिया कहती है: नमस्ते लैला। आज तुम शानदार लग रही हो।'
    note: '*You look great* सीधी तारीफ़ है।'
  en.a1.unit64.lesson03.teach.dialogue_line2:
    title: लैला मिया को धन्यवाद देती है
    gloss: 'लैला कहती है: शुक्रिया, मिया।'
    note: '*Thank you* का मतलब है शुक्रिया।'
  en.a1.unit64.lesson03.teach.dialogue_line3:
    title: मिया हरी जैकेट की बात करती है
    gloss: 'मिया कहती है: मुझे तुम्हारी हरी जैकेट पसंद है।'
    note: '*I like your green jacket* कपड़ों की तारीफ़ करता है।'
  en.a1.unit64.lesson03.teach.dialogue_line4:
    title: लैला दोस्ताना जवाब देती है
    gloss: 'लैला कहती है: यह बहुत दयालु बात है।'
    note: '*That is very kind* किसी की कही हुई अच्छी बात का जवाब है।'
  en.a1.unit64.lesson03.teach.dialogue_line5:
    title: मिया मुस्कान की बात करती है
    gloss: 'मिया कहती है: तुम्हारी मुस्कान भी कितनी प्यारी है! देखो, यह मेरी तस्वीर है।'
    note: '*too* का मतलब यहाँ है भी।'
  en.a1.unit64.lesson03.teach.dialogue_line6:
    title: लैला तस्वीर की तारीफ़ करती है
    gloss: 'लैला कहती है: बहुत-बहुत शुक्रिया। तुम्हारी तस्वीर अच्छी है।'
    note: '*Your photo is nice* बदले में तारीफ़ करता है।'
  en.a1.unit64.lesson03.teach.dialogue_line7:
    title: मिया तस्वीर के बारे में बताती है
    gloss: 'मिया कहती है: शुक्रिया। यह डैनियल के लिए है।'
    note: '*Thanks*, *thank you* से छोटा रूप है।'
  en.a1.unit64.lesson04.teach.message:
    title: प्यारा संदेश
    gloss: 'प्यारा संदेश: आपकी हरी जैकेट बहुत प्यारी है। आपकी तस्वीर अच्छी है। दयालु होने के लिए शुक्रिया।'
    note: संदेश में दो तारीफ़ें हैं और किसी को धन्यवाद भी दिया गया है।
  en.a1.unit64.lesson04.teach.reading_passage:
    title: 'पाठ: एक दोस्त की तारीफ़'
    gloss: 'एक दोस्त की तारीफ़: मिया ने लैला को हरी जैकेट में देखा। मिया ने कहा कि लैला शानदार लग रही है। उसने यह भी कहा कि लैला की मुस्कान बहुत प्यारी है। लैला ने मिया को धन्यवाद दिया। फिर लैला ने मिया की तस्वीर देखी और कहा कि वह अच्छी है। मिया ख़ुश थी क्योंकि तस्वीर डैनियल के लिए थी। बाद में लैला ने एक छोटा संदेश लिखा: आपकी हरी जैकेट बहुत प्यारी है।'
    note: '*looked great* क्रिया *look great* का भूतकाल है।'
