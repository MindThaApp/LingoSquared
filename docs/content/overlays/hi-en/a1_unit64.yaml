  en.a1.unit64.lesson02.teach.like_your_jacket:
    title: I like your jacket.
    gloss: मुझे आपकी जैकेट पसंद है।
    note: '*I like your...* किसी की किसी चीज़ की तारीफ़ करने का आम तरीक़ा है।'
  en.a1.unit64.lesson02.teach.lovely_smile:
    title: What a lovely smile.
    gloss: कितनी प्यारी मुस्कान है।
    note: '*What a...* का इस्तेमाल तारीफ़ को उद्गार की तरह कहने के लिए होता है।'
  en.a1.unit64.lesson02.teach.very_kind:
