    gloss: यह बहुत दयालु बात है।
    note: '*very* से *kind* का भाव और गहरा हो जाता है।'
  en.a1.unit64.lesson02.teach.thank_you_much:
    title: Thank you very much.
    gloss: बहुत-बहुत शुक्रिया।
