teaching:
  en.b2.unit05.lesson01.teach.register:
    title: Register
    gloss: भाषा की शैली, औपचारिकता का स्तर
    note: '*register* यह है कि आपकी भाषा कितनी औपचारिक या अनौपचारिक लगती है। हिंदी में आप, तुम और तू से लहजा बदल जाता है, पर अंग्रेज़ी में हर किसी के लिए सिर्फ़ *you* है; लहजा मुख्य रूप से वाक्य बनाने के ढंग से तय होता है।'
    example_gloss: श्रोता या पाठक बदलने पर भाषा की शैली बदल जाती है।
  en.b2.unit05.lesson01.teach.casual:
    title: casual
    gloss: अनौपचारिक, बेतकल्लुफ़
    note: '*casual* दोस्त या जान-पहचान वाले के लिए ठीक रहता है। यह ज़्यादा सीधा होता है, पर अपने-आप बदतमीज़ी नहीं है।'
    example_gloss: दोस्त के लिए अनौपचारिक संदेश ठीक रहता है।
  en.b2.unit05.lesson01.teach.professional:
    title: professional
    gloss: पेशेवर, काम के लिहाज़ से शिष्ट
    note: '*professional* सहकर्मी के लिए ठीक है: विनम्र और साफ़, पर ज़रूरत से ज़्यादा औपचारिक नहीं।'
    example_gloss: सहकर्मी के लिए पेशेवर संदेश ठीक रहता है।
  en.b2.unit05.lesson01.teach.formal:
    title: formal
    gloss: औपचारिक
    note: '*formal* किसी संस्था के लिए ठीक रहता है। अंग्रेज़ी में इसके लिए अक्सर लंबे और घुमा-फिराकर किए गए अनुरोध इस्तेमाल होते हैं।'
    example_gloss: किसी संस्था के लिए औपचारिक संदेश ठीक रहता है।
  en.b2.unit05.lesson01.teach.audience:
    title: audience
    gloss: श्रोता या पाठक, जिसके लिए आप लिखते या बोलते हैं
    note: '*audience* वह व्यक्ति या समूह है जिसके लिए आप लिखते या बोलते हैं।'
    example_gloss: आपके पाठक या श्रोता आपके शब्दों के चुनाव को प्रभावित करते हैं।
  en.b2.unit05.lesson01.teach.institution:
    title: institution
    gloss: संस्था, संगठन
    note: '*institution* क्लिनिक, बैंक या विश्वविद्यालय जैसा कोई संगठन है।'
    example_gloss: क्लिनिक एक संस्था है।
  en.b2.unit05.lesson02.teach.formal_request:
    title: औपचारिक अनुरोध
    gloss: यदि आप कृपया पुष्टि कर सकें कि मेरी अपॉइंटमेंट शुक्रवार को हो सकती है या नहीं, तो मैं आभारी रहूँगा।
    note: '*I would be grateful if you could...* औपचारिक है। यहाँ *you* के लिए किसी अलग शब्द की ज़रूरत नहीं पड़ती; शिष्टता पूरी बनावट से आती है।'
  en.b2.unit05.lesson02.teach.casual_request:
    title: अनौपचारिक अनुरोध
    gloss: क्या तुम इसे शुक्रवार को कर सकते हो?
    note: '*Can you...?* दोस्त के लिए ठीक है, पर किसी संस्था के लिए जल्दी ही बहुत सीधा लगता है।'
  en.b2.unit05.lesson02.teach.professional_request:
    title: पेशेवर अनुरोध
    gloss: अगर शुक्रवार आपके लिए अब भी ठीक है, तो क्या हम अपॉइंटमेंट शुक्रवार को कर सकते हैं?
    note: '*Could we...?* सहकर्मी के लिए सहयोगी और विनम्र लगता है।'
  en.b2.unit05.lesson02.teach.to_whom:
    title: Dear scheduling team,
    gloss: प्रिय शेड्यूलिंग टीम,
    note: '*Dear...* औपचारिक पत्र की सामान्य शुरुआत है। हिंदी के "महोदय" या "आदरणीय" जैसे भारी संबोधनों की तुलना में यह हल्का और सहज लगता है।'
  en.b2.unit05.lesson02.teach.grammar_register_shift:
    title: register बदलना
    gloss: register बदलते समय बात वही रखें। अनौपचारिक अंग्रेज़ी में सीधे सवाल चल सकते हैं। पेशेवर अंग्रेज़ी में अक्सर could आता है। औपचारिक अंग्रेज़ी में अक्सर I would be grateful if you could आता है।
    note: 'सिर्फ़ आप और तुम के फ़र्क़ के बारे में मत सोचिए: अंग्रेज़ी में पूरा वाक्य बदल जाता है।'
  en.b2.unit05.lesson03.teach.stiff:
    title: stiff
    gloss: अकड़ा हुआ, ज़रूरत से ज़्यादा औपचारिक
    note: '*stiff* का मतलब है कि संदेश स्थिति के हिसाब से बेवजह औपचारिक लगता है।'
    example_gloss: अकड़ा हुआ संदेश स्थिति के हिसाब से बहुत औपचारिक लगता है।
  en.b2.unit05.lesson03.teach.appropriate:
    title: appropriate
    gloss: उचित, उपयुक्त
    note: '*appropriate* का मतलब है कि शब्दों का चुनाव श्रोता या पाठक और स्थिति से मेल खाता है।'
    example_gloss: उचित संदेश श्रोता या पाठक के अनुकूल होता है।
  en.b2.unit05.lesson03.teach.reading_passage:
    title: 'पाठ: एक ही संदेश, तीन तरह के पाठक'
    gloss: 'Nina को एक अपॉइंटमेंट शुक्रवार को करनी है। दोस्त को वह लिखती है: Can you move it to Friday? संदेश सीधा और अनौपचारिक है। सहकर्मी को वह लिखती है: Could we move the appointment to Friday if that still works for you? संदेश पेशेवर और विनम्र है। क्लिनिक को वह लिखती है: I would be grateful if you could confirm whether my appointment can be moved to Friday. तीनों पाठों में बात एक ही है, पर पाठक के हिसाब से register बदल जाता है।'
    note: अंग्रेज़ी में register शब्दों को बनाने के ढंग से बदलता है, किसी अलग शब्द से नहीं।
  en.b2.unit05.lesson04.teach.q_need_ask:
    title: Nina शब्दों के बारे में पूछती है
    gloss: 'Nina कहती है: मुझे अपनी अपॉइंटमेंट बदलने के बारे में पूछना है। क्या मैं बस यह लिख दूँ: "Can you move it?"'
    note: '*just write* दिखाता है कि उसे शक है कि सीधा रूप ठीक रहेगा या नहीं।'
  en.b2.unit05.lesson04.teach.a_too_casual:
    title: Oscar register की ओर इशारा करता है
    gloss: 'Oscar कहता है: दोस्त को, हाँ। क्लिनिक को वह बहुत अनौपचारिक लगेगा।'
    note: यहाँ भी अंग्रेज़ी में बस *you* ही चलता है, पर वाक्य ख़ुद क्लिनिक के लिए बहुत सीधा है।
  en.b2.unit05.lesson04.teach.q_colleague:
    title: Nina सहकर्मी वाले रूप के बारे में पूछती है
    gloss: 'Nina पूछती है: तुम सहकर्मी को क्या लिखोगे?'
    note: सहकर्मी के लिए पेशेवर register चाहिए, सबसे ज़्यादा औपचारिक नहीं।
  en.b2.unit05.lesson04.teach.a_colleague_request:
    title: Oscar सहकर्मी वाला रूप बताता है
    gloss: 'Oscar कहता है: मैं लिखूँगा: "Could we move the appointment to Friday if that still works for you?"'
    note: '*Could we* और *if that still works for you* अनुरोध को नरम बनाते हैं।'
  en.b2.unit05.lesson04.teach.q_clinic:
    title: Nina क्लिनिक के बारे में पूछती है
    gloss: 'Nina पूछती है: और क्लिनिक को?'
    note: किसी संस्था के लिए अनुरोध ज़्यादा औपचारिक बनावट माँगता है।
  en.b2.unit05.lesson04.teach.a_clinic_request:
    title: Oscar औपचारिक रूप बताता है
    gloss: 'Oscar कहता है: मैं लिखूँगा: "I would be grateful if you could confirm whether my appointment can be moved to Friday."'
    note: यह रूप रूखेपन से कुछ करने को नहीं कहता, बल्कि पुष्टि माँगता है।
  en.b2.unit05.lesson04.teach.q_same_message:
    title: Nina सार बताती है
    gloss: 'Nina कहती है: संदेश वही, register अलग।'
    note: 'बात वही रहती है: अपॉइंटमेंट को शुक्रवार पर ले जाना।'
  en.b2.unit05.lesson04.teach.a_content_stays:
    title: Oscar सहमति देता है
    gloss: 'Oscar कहता है: बिल्कुल। बात वही रहती है, पर औपचारिकता का स्तर बदल जाता है।'
    note: B2 स्तर पर register पर नियंत्रण का यही सार है।
