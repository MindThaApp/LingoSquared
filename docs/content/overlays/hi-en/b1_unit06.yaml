    note: '*when* कहानी की अगली घटना को शुरू करता है।'
  en.b1.unit06.lesson02.teach.grammar_while_when_sequencing:
    title: '''while'' und ''when'' in einer Geschichte'
    gloss: जब मैं गाड़ी चला रहा था, तब मेरा टायर पंक्चर हो गया। जब मैंने गाड़ी किनारे लगाई, तो एक अजनबी ने मेरी मदद की।
    note: '*while* पृष्ठभूमि बताता है (कोई चलती हुई क्रिया); *when* उसके बीच होने वाली अगली, छोटी घटना बताता है।'
