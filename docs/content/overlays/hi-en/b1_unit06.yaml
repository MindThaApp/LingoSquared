  en.b1.unit06.lesson03.teach.reading_passage:
    title: 'Lesetext: die Geschichte vom Platten'
    gloss: कल सुबह जब Leila काम पर जा रही थी, तभी अचानक उसका टायर पंक्चर हो गया। उसने एक शांत सड़क पर गाड़ी किनारे लगाई। एक अजनबी ने अपनी गाड़ी रोकी और मदद की पेशकश की। जब तक मैकेनिक पहुँचा, Leila Daniel को फ़ोन करके बता चुकी थी कि उसे देर हो जाएगी। मैकेनिक ने कहा कि वह टायर दस मिनट में ठीक कर सकता है। उसने अपनी बात रखी, और Leila काम पर सिर्फ़ बीस मिनट देर से पहुँची।
    note: बीते समय की एक कहानी, जिसमें पृष्ठभूमि की क्रिया (*while*), घटनाओं का क्रम (*when*) और पहले ही हो चुकी बात (*had already*) शामिल हैं।
  en.b1.unit06.lesson04.teach.q_youre_late_what_happened:
