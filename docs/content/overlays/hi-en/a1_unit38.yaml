    note: किसी घरेलू काम में मदद माँगने का एक विनम्र तरीक़ा।
  en.a1.unit38.lesson03.teach.dialogue_line1:
    title: मिया की समस्या
    gloss: 'मिया कहती है: मेरा अपार्टमेंट बहुत बिखरा पड़ा है। इस वीकेंड मेरे यहाँ लोग आने वाले हैं।'
    note: '*a mess* का मतलब है गंदगी या बिखराव।'
  en.a1.unit38.lesson03.teach.dialogue_line2:
    title: डैनियल की पेशकश
    gloss: 'डैनियल पूछता है: क्या तुम्हें इसे साफ़ करने में मदद चाहिए?'
    note: '*Do you want some help ...ing?* मदद की पेशकश करने का एक स्वाभाविक तरीक़ा है।'
  en.a1.unit38.lesson03.teach.dialogue_line3:
    title: "मिया का जवाब"
    gloss: 'मिया कहती है: हाँ, ज़रूर! मुझे लिविंग रूम में वैक्यूम करना है और बर्तन धोने हैं।'
    note: '*I need to* + क्रिया का मतलब है ''मुझे ... करना है''।'
  en.a1.unit38.lesson03.teach.dialogue_line4:
    title: डैनियल की पेशकश
    gloss: 'डैनियल कहता है: मैं तुम्हारी जगह वैक्यूम कर सकता हूँ। तुम बर्तन धो लो।'
    note: '*for you* का मतलब यहाँ ''तुम्हारे लिए'' है, यानी ''तुम्हारी जगह''।'
  en.a1.unit38.lesson03.teach.dialogue_line5:
    title: मिया की बात
    gloss: 'मिया कहती है: शुक्रिया! मुझे अभी कपड़े भी धोने हैं।'
    note: '*still need to* का मतलब है ''अभी भी करना बाक़ी है''।'
  en.a1.unit38.lesson03.teach.dialogue_line6:
    title: डैनियल की पेशकश
    gloss: 'डैनियल कहता है: मेरे पास आज उसके लिए समय नहीं है, पर मैं जाने से पहले कचरा बाहर रख सकता हूँ।'
    note: '*before I leave* का मतलब है ''मेरे जाने से पहले''।'
  en.a1.unit38.lesson03.teach.dialogue_line7:
    title: मिया का धन्यवाद
    gloss: 'मिया कहती है: इससे बहुत मदद मिलेगी। बहुत-बहुत शुक्रिया!'
    note: '*That would help a lot* का मतलब है ''इससे बहुत मदद मिलेगी''। यहाँ *Would* बात को ज़्यादा विनम्र बनाता है।'
  en.a1.unit38.lesson04.teach.reading_passage:
    title: घर के कामों के बारे में पाठ
    gloss: डैनियल, लैला और मिया की घर के कामों की अपनी-अपनी आदतें हैं। डैनियल हर रात खाने के बाद बर्तन धोता है और शनिवार को अपने अपार्टमेंट में वैक्यूम करता है। लैला को कपड़े धोने से कोई परेशानी नहीं, पर उसे बाथरूम साफ़ करने से नफ़रत है। मिया की बिल्ली लूना हर जगह बाल छोड़ती है, इसलिए मिया लगभग रोज़ अपने अपार्टमेंट में वैक्यूम करती है। पिछले वीकेंड मिया के यहाँ मेहमान आने वाले थे, इसलिए डैनियल ने उसकी मदद करने की पेशकश की। उसने लिविंग रूम में वैक्यूम किया और उसके लिए कचरा बाहर रखा। मिया उसकी मदद के लिए बहुत आभारी थी।
    note: '*doesn''t mind* का मतलब है ''उसे इससे कोई परेशानी नहीं''।'
