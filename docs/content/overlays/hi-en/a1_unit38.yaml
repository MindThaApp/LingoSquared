  en.a1.unit38.lesson02.teach.wash_the_dishes:
    title: wash the dishes
    gloss: बर्तन धोना
    note: '*wash the dishes* का मतलब है बर्तन धोना। *Do the dishes* भी उतना ही आम है और उसका मतलब भी वही है। इन दोनों में से कोई भी कह सकते हैं।'
    example_gloss: मैं हर रात बर्तन धोता हूँ।
  en.a1.unit38.lesson02.teach.do_the_laundry:
    title: do the laundry
    gloss: कपड़े धोना
    note: '*do the laundry* का मतलब है कपड़े धोना।'
    example_gloss: वह रविवार को कपड़े धोती है।
  en.a1.unit38.lesson02.teach.take_out_the_trash:
