    gloss: कचरा बाहर रखना
    note: '*take out the trash* में *take out* लगता है, *do* नहीं। *do the laundry* या *do the dishes* की तरह यहाँ *do* इस्तेमाल नहीं कर सकते।'
    example_gloss: क्या तुम कचरा बाहर रख दोगे?
  en.a1.unit38.lesson02.teach.clean_the_bathroom:
