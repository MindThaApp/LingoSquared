    gloss: मैं डॉक्टर को दिखाने के लिए अपॉइंटमेंट लेना चाहता हूँ।
    note: '*I''d like to...* से आप विनम्रता से अपॉइंटमेंट माँगते हैं।'
  en.a2.unit28.lesson02.teach.symptom_duration:
    title: कहना कि आपको कितने समय से शिकायतें हैं
    gloss: मुझे तीन दिन से सिरदर्द और गले में दर्द है, और बढ़ता जा रहा है।
