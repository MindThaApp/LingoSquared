    gloss: दस मिनट पहले पहुँचना
    note: '*arrive ten minutes early* का मतलब है अपॉइंटमेंट से दस मिनट पहले पहुँच जाना।'
    example_gloss: कृपया अपने अपॉइंटमेंट से दस मिनट पहले पहुँचिए।
  en.a2.unit28.lesson03.teach.confirmation_text:
    title: पुष्टि का पाठ
    gloss: आपका अपॉइंटमेंट आज दोपहर 3 बजे के लिए पक्का हो गया है। कृपया अपना बीमा कार्ड लाइए और दस मिनट पहले पहुँचिए। कन्फ़र्मेशन नंबर 7724 है।
    note: यह औपचारिक पुष्टि है, जिसमें समय, आपको क्या करना है और एक नंबर दिया गया है।
  en.a2.unit28.lesson04.teach.i_see:
