    title: दवाओं के बारे में पूछना
    gloss: 'डैनियल पूछता है: क्या मुझे कोई दवा लेनी चाहिए?'
    note: निदान सुनने के बाद डैनियल इलाज के बारे में पूछता है।
  en.a2.unit28.lesson04.teach.a_medicine_instructions:
    title: दवा के निर्देश
    gloss: 'डॉक्टर कहता है: हाँ, यह दवा पाँच दिन तक दिन में दो बार लीजिए, और खूब पानी पीजिए।'
    note: 'यह साफ़ हिदायत है: दिन में दो बार, पाँच दिन तक।'
  en.a2.unit28.lesson04.teach.q_follow_up:
    title: अगली मुलाक़ात के बारे में पूछना
    gloss: 'डैनियल पूछता है: अगर आराम न मिले तो क्या मैं दोबारा आऊँ?'
    note: डैनियल वही शर्त (*if it doesn't get better*) इस्तेमाल करता है जो लैला ने यूनिट 22 में की थी।
  en.a2.unit28.lesson04.teach.a_followup_appointment:
    title: डॉक्टर का अगली मुलाक़ात पर जवाब
    gloss: 'डॉक्टर कहता है: हाँ, अगर एक हफ़्ते के अंदर आराम न मिले, तो दोबारा दिखाने आइए।'
    note: 'डॉक्टर साफ़ बताता है कि डैनियल को कब आना है: अगर एक हफ़्ते में आराम न मिले।'
