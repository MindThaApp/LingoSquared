    note: '*I see* से आप बताते हैं कि आप बात समझ गए।'
  en.a2.unit28.lesson04.teach.q_whats_wrong:
    title: पूछना कि क्या हुआ है
    gloss: 'डॉक्टर पूछता है: क्या तकलीफ़ है?'
    note: यह वही सवाल है जो लैला ने यूनिट 22 में पूछा था, अब डॉक्टर पूछ रहा है।
  en.a2.unit28.lesson04.teach.a_symptoms_duration:
    title: शिकायतों के बारे में डैनियल का जवाब
    gloss: 'डैनियल कहता है: मुझे तीन दिन से सिरदर्द और गले में दर्द है, और बढ़ता जा रहा है।'
    note: यह वही वाक्य है जो पाठ 2 में था।
  en.a2.unit28.lesson04.teach.a_bad_cold:
    title: डॉक्टर का निदान
    gloss: 'डॉक्टर कहता है: अच्छा, समझ गया। आपको बहुत ज़ोर का ज़ुकाम है।'
    note: यह एक सीधी-सादी, रोज़ की बीमारी है, कुछ गंभीर नहीं।
