    example_gloss: वह इस साल कंप्यूटर कोर्स कर रहा है।
  en.a1.unit36.lesson01.teach.student:
    title: student
    gloss: छात्र / विद्यार्थी
    note: '*student* का मतलब है छात्र या विद्यार्थी: वह व्यक्ति जो स्कूल में या किसी क्लास में सीखता है।'
    example_gloss: वह कम्युनिटी कॉलेज में विद्यार्थी है।
  en.a1.unit36.lesson01.teach.homework:
    title: homework
    gloss: होमवर्क
    note: '*homework* का मतलब है होमवर्क।'
    example_gloss: मैं रात के खाने के बाद अपना होमवर्क करता हूँ।
  en.a1.unit36.lesson01.teach.subject:
    title: subject
    gloss: विषय
    note: '*subject* का मतलब है विषय (वह चीज़ जिसकी आप पढ़ाई करते हैं)।'
    example_gloss: गणित मेरा पसंदीदा विषय है।
  en.a1.unit36.lesson01.teach.test:
    title: test
    gloss: टेस्ट
    note: '*test* का मतलब है टेस्ट या परीक्षा।'
    example_gloss: शुक्रवार को हमारा टेस्ट है।
  en.a1.unit36.lesson02.teach.take_a_class:
    title: take a class
    gloss: क्लास लेना
    note: '*take a class* क्लास में पढ़ने के लिए अंग्रेज़ी की पक्की जोड़ी है। हिंदी में भी ''क्लास लेना'' कहते हैं, इसलिए यह जोड़ी जानी-पहचानी लगेगी। *follow a class* या *do a class* जैसा शब्द-दर-शब्द रूप मत बनाइए; हमेशा *take* ही लगता है।'
    example_gloss: मैं हर मंगलवार शाम को एक क्लास लेता हूँ।
  en.a1.unit36.lesson02.teach.do_homework:
    title: do homework
    gloss: होमवर्क करना
    note: '*do homework*: यहाँ क्रिया *do* है, *make* नहीं। हिंदी में भी ''होमवर्क करना'' कहते हैं, इसलिए यह जोड़ी हिंदी जैसी ही है।'
    example_gloss: वह रात के खाने के बाद अपना होमवर्क करता है।
  en.a1.unit36.lesson02.teach.study_for_a_test:
    title: study for a test
    gloss: टेस्ट की तैयारी करना
    note: '*study for a test* का मतलब है टेस्ट की तैयारी करना। *For* यहाँ उद्देश्य बताता है (आप किसलिए पढ़ रहे हैं)।'
    example_gloss: मैं हर शुक्रवार को टेस्ट की तैयारी करता हूँ।
  en.a1.unit36.lesson02.teach.community_college:
    title: community college
    gloss: वयस्कों के लिए स्थानीय कॉलेज
    note: '*community college* अमेरिका की एक तरह की पढ़ाई की जगह है, जहाँ ज़्यादातर वयस्क काम के साथ-साथ कोर्स करते हैं। हिंदी में इसका कोई एक तय शब्द नहीं है, इसलिए अंग्रेज़ी नाम ही आम तौर पर इस्तेमाल होता है।'
    example_gloss: वह एक कम्युनिटी कॉलेज में पढ़ती है।
  en.a1.unit36.lesson02.teach.in_the_evening:
    title: in the evening
    gloss: शाम को
    note: '*in the evening* का मतलब है शाम को।'
    example_gloss: मेरी क्लास शाम को होती है।
  en.a1.unit36.lesson02.teach.what_are_you_studying_question:
    title: What are you studying?
    gloss: तुम क्या पढ़ रहे हो?
    note: 'यह प्रश्न present continuous (*are you studying*) में है: उस चीज़ के लिए जिसमें आप इन दिनों लगे हुए हैं, साधारण वर्तमान काल में नहीं।'
  en.a1.unit36.lesson03.teach.dialogue_line1:
    title: डैनियल का सवाल
    gloss: 'डैनियल पूछता है: क्या तुम आज काम के बाद कुछ कर रही हो?'
    note: '*anything* का मतलब यहाँ ''कुछ'' या ''कोई भी चीज़'' है, और यह एक प्रश्न में आया है।'
  en.a1.unit36.lesson03.teach.dialogue_line2:
    title: "मिया का जवाब"
    gloss: 'मिया कहती है: हाँ, आज रात मेरी फ़ोटोग्राफ़ी की क्लास है।'
    note: '*tonight* का मतलब है आज रात।'
  en.a1.unit36.lesson03.teach.dialogue_line3:
    title: डैनियल की प्रतिक्रिया
    gloss: 'डैनियल कहता है: अरे, बढ़िया! तुम यह क्लास कहाँ लेती हो?'
    note: '*Where do you take it?*: यहाँ भी क्लास या कोर्स करने के लिए *take* लगता है, जैसे *take a class* में।'
  en.a1.unit36.lesson03.teach.dialogue_line4:
    title: "मिया का जवाब"
    gloss: 'मिया कहती है: शहर के बीच वाले कम्युनिटी कॉलेज में। यह हफ़्ते में दो बार होती है।'
    note: '*twice a week*: यहाँ भी *a* का मतलब ''प्रति'' है।'
  en.a1.unit36.lesson03.teach.dialogue_line5:
    title: डैनियल का सवाल
    gloss: 'डैनियल कहता है: अब तक कैसा चल रहा है?'
    note: '*so far* का मतलब है अब तक।'
  en.a1.unit36.lesson03.teach.dialogue_line6:
    title: "मिया का जवाब"
    gloss: 'मिया कहती है: मुझे यह सच में पसंद है। मैं अपना कैमरा बेहतर तरीक़े से इस्तेमाल करना सीख रही हूँ।'
    note: '*I''m learning how to ...*: present continuous, उस हुनर के लिए जो आप इस समय सीख रहे हैं।'
  en.a1.unit36.lesson03.teach.dialogue_line7:
    title: डैनियल की आख़िरी बात
    gloss: 'डैनियल कहता है: यह तो बहुत अच्छा है! शायद तुम मुझे भी कभी सिखा सको।'
    note: '*sometime* का मतलब है ''कभी'': भविष्य के किसी अनिश्चित समय के लिए।'
  en.a1.unit36.lesson04.teach.reading_passage:
    title: डैनियल, लैला और मिया के बारे में पाठ
    gloss: डैनियल, लैला और मिया तीनों काम के अलावा कुछ नया सीख रहे हैं। डैनियल अपनी नौकरी के लिए नए हुनर सीखने के लिए सोमवार की रातों को कंप्यूटर कोर्स करता है। लैला स्पैनिश सीख रही है, क्योंकि वह किसी दिन मेक्सिको घूमने जाना चाहती है। मिया की कम्युनिटी कॉलेज में हफ़्ते में दो बार फ़ोटोग्राफ़ी की क्लास होती है, और वह अब पहले से कहीं बेहतर तस्वीरें खींच रही है। वे कभी-कभी लंच के समय अपनी क्लासों के बारे में साथ बातें करते हैं।
    note: '*takes a computer course*: यहाँ *take* लगता है, *follow* नहीं; वही बात जो *take a class* में थी।'
