teaching:
  en.a1.unit34.lesson01.teach.soccer:
    title: soccer
    gloss: फ़ुटबॉल
    note: '*soccer* का मतलब है फ़ुटबॉल। इसके साथ की क्रिया *play* है: *play soccer*। हिंदी में भी ''फ़ुटबॉल खेलना'' कहते हैं, इसलिए यह आसान लगेगा। पर अंग्रेज़ी में खेल के नाम के साथ अलग-अलग क्रियाएँ आती हैं (*play*, *go*, *do*), और इन्हें याद रखना पड़ता है।'
    example_gloss: हम शनिवार को फ़ुटबॉल खेलते हैं।
  en.a1.unit34.lesson01.teach.tennis:
    title: tennis
    gloss: टेनिस
    note: '*tennis* का मतलब है टेनिस। *soccer* की तरह यहाँ भी *play* लगता है: *play tennis*। हिंदी में भी ''टेनिस खेलना'' कहते हैं।'
    example_gloss: वह हर वीकेंड टेनिस खेलती है।
  en.a1.unit34.lesson01.teach.basketball:
    title: basketball
    gloss: बास्केटबॉल
    note: '*basketball* का मतलब है बास्केटबॉल। यहाँ भी *play* लगता है: *play basketball*, जैसे *soccer* और *tennis* के साथ। गेंद वाले खेलों में अंग्रेज़ी आम तौर पर *play* + खेल का नाम इस्तेमाल करती है।'
    example_gloss: वे पार्क में बास्केटबॉल खेलते हैं।
  en.a1.unit34.lesson01.teach.swimming:
    title: swimming
    gloss: तैराकी
    note: '*swimming* का मतलब है तैराकी या तैरना। यहाँ क्रिया बदल जाती है: *go swimming* (*play swimming* नहीं)। तैरने और दौड़ने जैसी गतिविधियों के लिए अंग्रेज़ी *go* + *-ing* रूप इस्तेमाल करती है। हिंदी में इसके लिए बस ''तैरने जाना'' या ''तैरना'' कह देते हैं, पर अंग्रेज़ी में *go* ज़रूरी है।'
    example_gloss: मैं हफ़्ते में दो बार तैरने जाता हूँ।
  en.a1.unit34.lesson01.teach.yoga:
    title: yoga
    gloss: योग
    note: '*yoga* का मतलब है योग। यहाँ क्रिया *do* है: *do yoga*। अकेले की जाने वाली गतिविधियों, जैसे योग, के लिए अंग्रेज़ी *do* इस्तेमाल करती है, *play* या *go* नहीं। हिंदी में ''योग करना'' कहते हैं, इसलिए यह क्रिया हिंदी जैसी ही है। बस याद रखिए कि अंग्रेज़ी में तीन क्रियाएँ (*play*, *go*, *do*) हैं, जिन्हें खेल के प्रकार के हिसाब से चुनना है।'
    example_gloss: वह सुबह योग करता है।
  en.a1.unit34.lesson01.teach.exercise:
    title: exercise
    gloss: व्यायाम करना
    note: '*exercise* का मतलब है व्यायाम करना: शारीरिक गतिविधि के लिए एक सामान्य शब्द। *soccer*, *swimming* और *yoga* से अलग, *exercise* को खुद क्रिया की तरह भी इस्तेमाल कर सकते हैं, बिना *play*, *go* या *do* के: *Do you exercise every day?*'
    example_gloss: क्या तुम रोज़ व्यायाम करते हो?
  en.a1.unit34.lesson02.teach.twice_a_week:
    title: twice a week
    gloss: हफ़्ते में दो बार
    note: '*twice a week* का मतलब है हफ़्ते में दो बार। यहाँ *a* का मतलब ''एक'' नहीं, ''प्रति'' है: संख्या + *a* + समय की इकाई बताती है कि उस अवधि में कोई काम कितनी बार होता है। हिंदी में इसके लिए ''हफ़्ते में'' या ''प्रति सप्ताह'' कहते हैं।'
    example_gloss: वह हफ़्ते में दो बार टेनिस खेलता है।
  en.a1.unit34.lesson02.teach.three_times_a_week:
    title: three times a week
    gloss: हफ़्ते में तीन बार
    note: '*three times a week* का मतलब है हफ़्ते में तीन बार। *twice a week* की तरह यहाँ भी *a* का मतलब ''प्रति'' है, ''एक'' नहीं: *times* (बार) और *a week* (प्रति हफ़्ता) मिलकर बताते हैं कि हफ़्ते में कितनी बार।'
    example_gloss: वह हफ़्ते में तीन बार तैरती है।
  en.a1.unit34.lesson02.teach.on_weekends:
    title: on weekends
    gloss: वीकेंड पर
    note: '*on weekends* का मतलब है वीकेंड पर। अंग्रेज़ी में दिनों और वीकेंड के साथ *on* लगता है; इसे हिंदी के ''पर'' या ''में'' से शब्द-दर-शब्द मत मिलाइए, पूरा रूप *on weekends* याद कीजिए।'
    example_gloss: हम वीकेंड पर बास्केटबॉल खेलते हैं।
  en.a1.unit34.lesson02.teach.gym:
    title: gym
    gloss: जिम
    note: '*gym* का मतलब है जिम: कसरत के लिए मशीनों और क्लासों वाली जगह।'
    example_gloss: वह जिम में योग करता है।
  en.a1.unit34.lesson02.teach.pool:
    title: pool
    gloss: स्विमिंग पूल
    note: '*pool* का मतलब है स्विमिंग पूल: तैरने के लिए पानी से भरी जगह।'
    example_gloss: मैं स्विमिंग पूल में तैरता हूँ।
  en.a1.unit34.lesson02.teach.how_often_question:
    title: How often do you exercise?
    gloss: तुम कितनी बार व्यायाम करते हो?
    note: 'यह प्रश्न *how often* (कितनी बार) से शुरू होता है। उसके बाद सहायक क्रिया *do* आती है, क्योंकि मुख्य क्रिया *exercise* है: यहाँ वही do-support है जो दूसरे अंग्रेज़ी प्रश्नों में होता है।'
  en.a1.unit34.lesson03.teach.dialogue_line1:
    title: डैनियल का सवाल
    gloss: 'डैनियल पूछता है: क्या तुम शनिवार को हमारे साथ फ़ुटबॉल खेलना चाहोगी?'
    note: बातचीत की शुरुआत फ़ुटबॉल खेलने के न्योते से होती है। *soccer* के साथ *play* लगता है।
  en.a1.unit34.lesson03.teach.dialogue_line2:
    title: "लैला का जवाब"
    gloss: 'लैला कहती है: मुझे फ़ुटबॉल ज़्यादा पसंद नहीं है। मैं तैरना ज़्यादा पसंद करती हूँ।'
    note: '*don''t really like* का मतलब है ''ज़्यादा पसंद नहीं करना'': मना करने का एक नरम तरीक़ा।'
  en.a1.unit34.lesson03.teach.dialogue_line3:
    title: "दानिएल का जवाब"
    gloss: 'डैनियल कहता है: कोई बात नहीं! तुम कितनी बार तैरने जाती हो?'
    note: '*go swimming*: तैरने के लिए *go* लगता है, *play* या *do* नहीं।'
  en.a1.unit34.lesson03.teach.dialogue_line4:
    title: "लैला का जवाब"
    gloss: 'लैला कहती है: हफ़्ते में दो बार, आम तौर पर मेरे घर के पास वाले स्विमिंग पूल में।'
    note: '*Twice a week*: यहाँ भी *a* का मतलब ''प्रति'' है।'
  en.a1.unit34.lesson03.teach.dialogue_line5:
    title: "दानिएल का जवाब"
    gloss: 'डैनियल कहता है: बढ़िया! मैं भी कभी-कभी योग करता हूँ, पर दौड़ना अब भी मेरा सबसे पसंदीदा है।'
    note: '*do yoga*: योग के लिए *do* लगता है, जो *play* और *go* से अलग है।'
  en.a1.unit34.lesson04.teach.reading_passage:
    title: डैनियल, लैला और मिया के बारे में पाठ
    gloss: डैनियल, लैला और मिया तीनों अलग-अलग तरीक़ों से सक्रिय रहते हैं। डैनियल रोज़ सुबह काम से पहले दौड़ने जाता है। लैला को तैरना ज़्यादा पसंद है; वह हफ़्ते में दो बार स्विमिंग पूल जाती है। मिया टीम में नई है, पर वह अपनी पड़ोसन के साथ पहले से हर रविवार टेनिस खेलती है। शनिवार को वे कभी-कभी पार्क में साथ फ़ुटबॉल खेलते हैं, पर फ़ुटबॉल किसी का भी पसंदीदा खेल नहीं है।
    note: 'इस पाठ में तीनों क्रियाएँ हैं: *goes running* (*go*), *plays tennis* और *play soccer* (*play*)। हर खेल की अपनी क्रिया होती है।'
