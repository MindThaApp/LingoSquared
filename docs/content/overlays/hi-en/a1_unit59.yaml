  en.a1.unit59.lesson03.teach.dialogue_line3:
    title: लैला अपने कार्ड के बारे में पूछती है
    gloss: 'लैला कहती है: क्या मैं इस कार्ड का इस्तेमाल कर सकती हूँ?'
    note: '*this card* उस कार्ड की ओर इशारा करता है जो उसके पास है।'
  en.a1.unit59.lesson03.teach.dialogue_line4:
    title: कार्ड चलता है
    gloss: 'कर्मचारी कहता है: हाँ, आप उस कार्ड का इस्तेमाल कर सकती हैं।'
    note: '*Yes* का मतलब है हाँ; *that card* लैला के कार्ड की ओर इशारा करता है।'
  en.a1.unit59.lesson03.teach.dialogue_line5:
