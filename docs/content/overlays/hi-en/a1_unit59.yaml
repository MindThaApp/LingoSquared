    gloss: 'बैंक की सूचना: खुलने का समय 9:00 से 4:00 तक। एटीएम बाहर है। आज नक़द निकासी की सीमा: $100। कार्ड स्वीकार किए जाते हैं।'
    note: सूचना में खुलने का समय, एटीएम की जगह और निकासी की सीमा दी गई है।
  en.a1.unit59.lesson04.teach.reading_passage:
    title: 'पाठ: बैंक का एक छोटा-सा चक्कर'
    gloss: 'बैंक का एक छोटा-सा चक्कर: एक सुबह मिया और लैला साथ में बैंक गईं। मिया अपना बैलेंस देखना चाहती थी, और लैला को नक़द पैसे चाहिए थे। कर्मचारी ने कहा कि एटीएम बाहर है। लैला ने अपना कार्ड इस्तेमाल किया और बीस डॉलर निकाले। मिया ने अपना पिन डाला और अपना बैलेंस देखा। निकलने से पहले उन्होंने सूचना पढ़ी। बैंक 9:00 से 4:00 तक खुला था, और नक़द निकासी की सीमा $100 थी। मिया ने कहा कि यह चक्कर आसान रहा।'
    note: '*took out* क्रिया *take out* का भूतकाल है, जिसका मतलब यहाँ पैसे निकालना है।'
