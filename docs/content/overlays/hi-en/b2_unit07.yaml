teaching:
  en.b2.unit07.lesson01.teach.term:
    title: term
    gloss: शर्त, समझौते का एक हिस्सा
    note: '*term* किसी समझौते का एक हिस्सा या शर्त है। यहाँ इसका मतलब स्कूल का सत्र नहीं है।'
    example_gloss: शर्त किसी समझौते का एक हिस्सा होती है।
  en.b2.unit07.lesson01.teach.proposal:
    title: proposal
    gloss: प्रस्ताव
    note: '*proposal* संभावित शर्तों का सुझाव है।'
    example_gloss: प्रस्ताव संभावित शर्तें सुझाता है।
  en.b2.unit07.lesson01.teach.refusal:
    title: refusal
    gloss: इनकार, नामंज़ूरी
    note: '*refusal* कहता है कि कोई शर्त मंज़ूर नहीं है। अंग्रेज़ी में साफ़ इनकार के साथ अक्सर कारण भी बताना बेहतर लगता है।'
    example_gloss: इनकार कहता है कि कोई शर्त मंज़ूर नहीं है।
  en.b2.unit07.lesson01.teach.concession:
    title: concession
    gloss: रियायत
    note: '*concession* का मतलब है कि आप समझौता संभव करने के लिए अपनी स्थिति का एक हिस्सा छोड़ देते हैं।'
    example_gloss: रियायत में अपनी स्थिति का एक हिस्सा छोड़ा जाता है।
  en.b2.unit07.lesson01.teach.scope:
    title: scope
    gloss: काम का दायरा
    note: '*scope* यह है कि कितना काम शामिल है। बातचीत में आप डेडलाइन और scope को एक-दूसरे के सामने तौल सकते हैं।'
    example_gloss: scope वह काम है जो शामिल है, यानी काम का दायरा।
  en.b2.unit07.lesson01.teach.condition:
    title: condition
    gloss: शर्त (पूरी होनी चाहिए)
    note: '*condition* वह चीज़ है जो समझौते के लागू होने से पहले पूरी होनी चाहिए।'
    example_gloss: समझौते के लागू होने से पहले शर्त पूरी होनी चाहिए।
  en.b2.unit07.lesson02.teach.condition_deadline:
    title: शर्त के साथ रियायत
    gloss: अगर scope घटा दिया जाए, तो मैं पहले वाली डेडलाइन मान सकता हूँ।
    note: '*I can agree... on condition that...* साफ़ है, फिर भी पेशेवर है। यह धुंधला होकर बात को नरम नहीं करता।'
  en.b2.unit07.lesson02.teach.cannot_agree:
    title: साफ़ मना करना
    gloss: पूरे scope के साथ मैं मंगलवार की डेडलाइन नहीं मान सकता।
    note: '*I cannot agree to...* सीधे "नहीं, यह नामुमकिन है" जैसे रूखे इनकार से ज़्यादा पेशेवर लगता है।'
  en.b2.unit07.lesson02.teach.accept_if:
    title: if के साथ मानना
    gloss: अगर पूरा परिशिष्ट अगले हफ़्ते आ जाए, तो मैं यह मान सकता हूँ।
    note: '*I can accept that if...* शर्त को साफ़ बता देता है।'
  en.b2.unit07.lesson02.teach.grammar_concession:
    title: मना करना, फिर भी बातचीत जारी रखना
    gloss: साफ़ तौर पर सीमा बताने के लिए I cannot agree इस्तेमाल कीजिए। शर्त के साथ रियायत देने के लिए I can agree on condition that इस्तेमाल कीजिए।
    note: अंग्रेज़ी में बहुत सीधी बात रूखी लग सकती है। सीमा, कारण और शर्त तीनों बताइए।
  en.b2.unit07.lesson03.teach.executive_summary:
    title: executive summary
    gloss: कार्यकारी सारांश
    note: '*executive summary* किसी रिपोर्ट के मुख्य बिंदुओं का छोटा सारांश है।'
    example_gloss: कार्यकारी सारांश रिपोर्ट के मुख्य बिंदु बताता है।
  en.b2.unit07.lesson03.teach.charts:
    title: charts
    gloss: चार्ट, आरेख
    note: '*charts* जानकारी को देखकर समझने लायक़ तरीक़े से दिखाते हैं।'
    example_gloss: चार्ट जानकारी को दृश्य रूप में दिखाते हैं।
  en.b2.unit07.lesson03.teach.reading_passage:
    title: 'पाठ: बदली हुई शर्तें'
    gloss: 'प्रिया ने पहले पूरी रिपोर्ट के लिए गुरुवार का प्रस्ताव रखा। Marcus ने ऐतराज़ किया क्योंकि क्लाइंट को कुछ पहले चाहिए था। प्रिया ने पूरे scope के साथ मंगलवार को मना कर दिया, क्योंकि इससे गुणवत्ता ख़तरे में पड़ती। फिर उसने शर्त के साथ रियायत दी: अगर scope घटाकर कार्यकारी सारांश और चार्ट तक कर दिया जाए, तो मंगलवार संभव था। Marcus ने वह शर्त मान ली, पर एक शर्त जोड़ी: पूरा परिशिष्ट अगले हफ़्ते आए। तय नतीजा यह रहा: सारांश और चार्ट मंगलवार को, और परिशिष्ट अगले हफ़्ते।'
    note: 'बातचीत दृढ़ है, फिर भी पेशेवर: इनकार, कारण, शर्त और समझौता।'
  en.b2.unit07.lesson04.teach.q_thursday:
    title: प्रिया प्रस्ताव रखती है
    gloss: 'प्रिया कहती है: अगर scope योजना के मुताबिक़ रहे, तो हम रिपोर्ट गुरुवार तक दे सकते हैं।'
    note: वह डेडलाइन को तुरंत scope से जोड़ देती है।
  en.b2.unit07.lesson04.teach.a_tuesday:
    title: Marcus ऐतराज़ करता है
    gloss: 'Marcus कहता है: गुरुवार क्लाइंट के लिए बहुत देर है। क्या तुम इसे मंगलवार तक दे सकती हो?'
    note: वह scope बदले बिना पहले की डेडलाइन माँगता है।
  en.b2.unit07.lesson04.teach.q_cannot_tuesday:
    title: प्रिया कारण के साथ मना करती है
    gloss: 'प्रिया कहती है: पूरे scope के साथ मैं मंगलवार की डेडलाइन नहीं मान सकती। इससे गुणवत्ता ख़तरे में पड़ेगी।'
    note: कारण इनकार को पेशेवर और कम रूखा बना देता है।
  en.b2.unit07.lesson04.teach.a_what_possible:
    title: Marcus शर्तों के बारे में पूछता है
    gloss: 'Marcus कहता है: मंगलवार को क्या संभव बनाएगा?'
    note: यह सवाल शर्त के साथ रियायत का दरवाज़ा खोलता है।
  en.b2.unit07.lesson04.teach.q_condition:
    title: प्रिया एक शर्त रखती है
    gloss: 'प्रिया कहती है: अगर scope घटाकर कार्यकारी सारांश और चार्ट तक कर दिया जाए, तो मैं पहले वाली डेडलाइन मान सकती हूँ।'
    note: '*on condition that* साफ़ और पेशेवर है।'
  en.b2.unit07.lesson04.teach.a_accept_appendix:
    title: Marcus एक और शर्त के साथ मानता है
    gloss: 'Marcus कहता है: अगर पूरा परिशिष्ट अगले हफ़्ते आ जाए, तो मैं यह मान सकता हूँ।'
    note: वह मान लेता है, पर यह भी तय कर देता है कि बाक़ी कब मिलेगा।
  en.b2.unit07.lesson04.teach.q_agreed:
    title: प्रिया समझौता पक्का करती है
    gloss: 'प्रिया कहती है: तय रहा। सारांश और चार्ट मंगलवार को, और परिशिष्ट अगले हफ़्ते।'
    note: '*Agreed* बातचीत को छोटे और साफ़ ढंग से समाप्त करता है।'
