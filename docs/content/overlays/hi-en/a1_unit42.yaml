    note: यहाँ *a little* का मतलब है थोड़ा-सा (मात्रा), छोटा (आकार) नहीं -- इसका अनुवाद "छोटा शर्मीला" जैसा शाब्दिक न करें।
    example_gloss: वह शुरू में थोड़ा शर्मीला है, पर जल्दी खुल जाता है।
  en.a1.unit42.lesson02.teach.very_hardworking:
