    note: '*shy* का मतलब है शर्मीला, यानी नए लोगों के सामने घबराया हुआ या संकोची।'
    example_gloss: वह शुरू में थोड़ा शर्मीला है।
  en.a1.unit42.lesson01.teach.calm:
    title: calm
    gloss: शांत
    note: '*calm* का मतलब है शांत -- जो आसानी से परेशान या घबराता नहीं।'
    example_gloss: मेरी माँ बहुत शांत हैं।
  en.a1.unit42.lesson01.teach.talkative:
    title: talkative
    gloss: बातूनी
    note: '*talkative* का मतलब है बातूनी -- जो बहुत बोलता हो।'
    example_gloss: मेरी बहन बहुत बातूनी है।
  en.a1.unit42.lesson02.teach.a_little_shy:
    title: a little shy
