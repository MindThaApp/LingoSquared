    gloss: बहुत मेहनती
    note: '*very hardworking* का मतलब है बहुत मेहनती।'
    example_gloss: मेरा सहकर्मी बहुत मेहनती है।
  en.a1.unit42.lesson02.teach.have_a_great_sense_of_humor:
