    gloss: जल्दी खुल जाना
    note: '*warm up quickly* का मतलब है नए लोगों के साथ जल्दी सहज हो जाना।'
    example_gloss: वह शर्मीला है, पर जान-पहचान होते ही जल्दी खुल जाता है।
  en.a1.unit42.lesson02.teach.whats_he_like_question:
    title: What's he like?
    gloss: वह कैसा है?
    note: '*What''s he like?* किसी के स्वभाव के बारे में पूछता है, उसकी शक्ल-सूरत के बारे में नहीं।'
  en.a1.unit42.lesson03.teach.dialogue_line1:
    title: मिया का सवाल
    gloss: 'मिया पूछती है: मैं अगले हफ़्ते डैनियल के साथ एक नया प्रोजेक्ट शुरू कर रही हूँ। वह कैसा है?'
    note: '*What''s he like?* किसी के स्वभाव के बारे में पूछता है।'
  en.a1.unit42.lesson03.teach.dialogue_line2:
    title: "लैला का जवाब"
    gloss: 'लैला कहती है: वह बहुत मिलनसार है, और सच में मज़ाकिया भी है।'
    note: '*and he''s really funny too* का मतलब है: और वह सच में मज़ाकिया भी है।'
  en.a1.unit42.lesson03.teach.dialogue_line3:
    title: मिया का सवाल
    gloss: 'मिया कहती है: यह सुनकर अच्छा लगा! क्या उसके साथ काम करना आसान है?'
    note: '*Is he easy to work with?* पूछता है कि क्या किसी के साथ काम करना सुखद है।'
  en.a1.unit42.lesson03.teach.dialogue_line4:
    title: "लैला का जवाब"
    gloss: 'लैला कहती है: हाँ, वह बहुत मेहनती भी है। वह अपने काम हमेशा समय पर पूरे करता है।'
    note: '*finishes his tasks on time* का मतलब है: अपने काम समय पर पूरे करता है।'
  en.a1.unit42.lesson03.teach.dialogue_line5:
    title: मिया का सवाल
    gloss: 'मिया पूछती है: क्या वह कभी मीटिंग में शर्माता है?'
    note: '*ever* का मतलब यहाँ है: कभी।'
  en.a1.unit42.lesson03.teach.dialogue_line6:
    title: "लैला का जवाब"
    gloss: 'लैला कहती है: थोड़ा, पर जान-पहचान होते ही वह ज़्यादा सहज हो जाता है।'
    note: '*once he knows you* का मतलब है: जैसे ही वह आपको जान लेता है।'
  en.a1.unit42.lesson03.teach.dialogue_line7:
    title: मिया का धन्यवाद
    gloss: 'मिया कहती है: शुक्रिया, लैला। अब मैं प्रोजेक्ट को लेकर काफ़ी निश्चिंत महसूस कर रही हूँ।'
    note: '*I feel more relaxed* का मतलब है: मैं ज़्यादा निश्चिंत और सहज महसूस करती हूँ।'
  en.a1.unit42.lesson04.teach.reading_passage:
    title: तीन व्यक्तित्वों के बारे में पाठ
    gloss: डैनियल, लैला और मिया पक्के दोस्त हैं, पर उनके व्यक्तित्व बहुत अलग-अलग हैं। डैनियल मिलनसार और मज़ाकिया है -- वह अपने दोस्तों को हमेशा हँसाता है। नए लोगों से मिलते समय वह थोड़ा शर्मीला होता है, पर जल्दी खुल जाता है। लैला शांत और रचनात्मक है। उसे चित्रकारी पसंद है क्योंकि इससे उसे आराम मिलता है, और वह किसी बात पर शायद ही कभी नाराज़ होती है। मिया खुले स्वभाव की और सुव्यवस्थित है। उसे समूह के लिए योजनाएँ बनाना पसंद है, और जब वह अपने दोस्तों को कुछ नया सिखाती है तो बहुत धैर्य रखती है -- उसने डैनियल को खाना पकाना सिखाया। भले ही वे सब अलग-अलग हैं, उनकी आपस में अच्छी निभती है और वे साथ समय बिताना पसंद करते हैं।
    note: '*even though* का मतलब है: भले ही, हालाँकि।'
