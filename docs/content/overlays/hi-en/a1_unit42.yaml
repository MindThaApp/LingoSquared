    note: '*get along with everyone* का मतलब है सबके साथ अच्छी तरह निभाना।'
    example_gloss: मिया की दफ़्तर में सबके साथ अच्छी निभती है।
  en.a1.unit42.lesson02.teach.warm_up_quickly:
