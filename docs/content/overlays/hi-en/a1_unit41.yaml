  en.a1.unit41.lesson03.teach.dialogue_line1:
    title: मिया का न्योता
    gloss: 'मिया पूछती है: मैं आज रात पास्ता बना रही हूँ। क्या आप खाना बनाने में मेरी मदद करेंगे?'
    note: '*Do you want to help me* + क्रिया*?* किसी को मदद के लिए बुलाने का एक स्वाभाविक तरीका है।'
  en.a1.unit41.lesson03.teach.dialogue_line2:
    title: डैनियल का जवाब
    gloss: 'डैनियल कहता है: ज़रूर! हालाँकि मैं बहुत अच्छा रसोइया नहीं हूँ।'
    note: वाक्य के अंत में *though* हल्का विरोध दिखाता है, जैसे हिंदी का "हालाँकि" या "पर"।
  en.a1.unit41.lesson03.teach.dialogue_line3:
    title: मिया का हौसला बढ़ाना
    gloss: 'मिया कहती है: कोई बात नहीं, मैं दिखा दूँगी। क्या आप ये प्याज़ बारीक काट सकते हैं?'
    note: '*I''ll show you* का मतलब है: मैं आपको दिखा दूँगी।'
  en.a1.unit41.lesson03.teach.dialogue_line4:
    title: डैनियल का सवाल
    gloss: 'डैनियल कहता है: कोई बात नहीं। मुझे इन्हें कितना छोटा काटना चाहिए?'
    note: '*should* सलाह माँगने के लिए इस्तेमाल होता है।'
  en.a1.unit41.lesson03.teach.dialogue_line5:
    title: मिया का समझाना
    gloss: 'मिया कहती है: छोटे टुकड़े, ऐसे। अब चलिए पास्ता उबालते हैं।'
    note: '*like this* का मतलब है: ऐसे, इस तरह।'
  en.a1.unit41.lesson03.teach.dialogue_line6:
    title: डैनियल का जवाब
    gloss: 'डैनियल कहता है: क्या मैं सॉस चख सकता हूँ? यह बहुत स्वादिष्ट है!'
    note: '*Can I* + क्रिया*?* इजाज़त माँगता है।'
  en.a1.unit41.lesson03.teach.dialogue_line7:
    title: मिया का समापन
    gloss: 'मिया कहती है: बढ़िया! रात का खाना लगभग तैयार है।'
    note: '*almost ready* का मतलब है लगभग तैयार।'
  en.a1.unit41.lesson04.teach.reading_passage:
    title: साथ मिलकर खाना पकाने के बारे में पाठ
    gloss: डैनियल, लैला और मिया तीनों को खाना पकाने का अलग-अलग अनुभव है। जब से लैला मिया के पास एक नए अपार्टमेंट में रहने आई है, तीनों दोस्त अक्सर साथ खाना पकाते हैं। लैला अच्छी रसोइया है। वह अक्सर अपनी माँ की पुरानी रेसिपी से पास्ता बनाती है। मिया को भी खाना पकाना पसंद है, और उसने डैनियल को सिखाया कि उँगलियाँ काटे बिना प्याज़ कैसे बारीक काटते हैं। डैनियल अभी बहुत अच्छा रसोइया नहीं है, पर वह तेज़ी से सीख रहा है। कल रात मिया ने डैनियल से पास्ता बनाने में मदद माँगी। उसने प्याज़ बारीक काटे, जबकि मिया ने पास्ता उबाला और सॉस बनाई। डैनियल ने सॉस चखी और कहा कि वह स्वादिष्ट है। लैला ठीक तब आई जब खाना तैयार हुआ, और तीनों ने मिया की रसोई में साथ खाना खाया।
    note: '*arrived just as dinner was ready* का मतलब है: ठीक तब पहुँची जब खाना तैयार हुआ।'
