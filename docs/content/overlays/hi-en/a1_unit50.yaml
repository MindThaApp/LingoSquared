    title: गेस्टहाउस में एक सप्ताहांत के बारे में पाठ
    gloss: 'गेस्टहाउस में एक सप्ताहांत: मिया और लैला सप्ताहांत के लिए पहाड़ों की एक छोटी यात्रा पर गईं। मिया को फ़ोटो खींचना पसंद है, और लैला को चित्र बनाना, इसलिए आराम करने के लिए यह एकदम सही जगह थी। जब वे गेस्टहाउस पहुँचीं, तो उन्होंने रिसेप्शनिस्ट को बताया कि 14 नवंबर से 16 नवंबर तक दो रातों की उनकी बुकिंग है। रिसेप्शनिस्ट ने पूछा कि बुकिंग किस नाम से है, और लैला ने कहा कि उसके नाम से है। उनके कमरे में दो बिस्तर और वाई-फ़ाई था, और हर सुबह सात से दस बजे तक नाश्ता शामिल था। चेक-आउट ग्यारह बजे था। मिया ने पहाड़ों की बहुत-सी फ़ोटो खींचीं, और लैला ने अपनी खिड़की से दिखते नज़ारे का एक छोटा चित्र बनाया। डैनियल उस सप्ताहांत घर पर रहा और उसने पुस्तकालय से ली हुई पाक-कला की किताब के एक व्यंजन से अपने लिए खाना पकाया। जब मिया और लैला लौटीं, तो उन्होंने उसे अपनी फ़ोटो और चित्र दिखाए, और उसे वे बहुत पसंद आए।'
    note: '*Their room had two beds and wifi* का मतलब है "उनके कमरे में दो बिस्तर और वाई-फ़ाई था"।'
