teaching:
  en.b2.unit04.lesson01.teach.background:
    title: background
    gloss: पृष्ठभूमि
    note: '*background* वह है जो पहले से चल रहा था या जो संदर्भ देता है। अंग्रेज़ी कहानियों में पृष्ठभूमि अक्सर past continuous में रखी जाती है।'
    example_gloss: पृष्ठभूमि की जानकारी बताती है कि पहले से क्या हो रहा था।
  en.b2.unit04.lesson01.teach.foreground:
    title: foreground
    gloss: मुख्य घटना
    note: '*foreground* वह घटना है जिसकी ओर कहानी बढ़ती है। अंग्रेज़ी में इसके लिए अक्सर simple past इस्तेमाल करें, अपने आप present perfect नहीं।'
    example_gloss: मुख्य घटना कहानी की सबसे अहम घटना होती है।
  en.b2.unit04.lesson01.teach.prior:
    title: prior
    gloss: पहले का, पूर्ववर्ती
    note: '*prior* का अर्थ है अतीत के किसी दूसरे क्षण से पहले का। इसके लिए अक्सर past perfect आता है: *had moved*।'
    example_gloss: पूर्ववर्ती घटना अतीत की किसी दूसरी घटना से पहले हुई थी।
  en.b2.unit04.lesson01.teach.interrupt:
    title: interrupt
    gloss: बीच में टोकना, बाधित करना
    note: '*interrupt* तब इस्तेमाल करें जब कोई छोटी घटना किसी चलती हुई क्रिया के बीच आ जाए।'
    example_gloss: कोई अचानक आई समस्या किसी क्रिया को बाधित कर सकती है।
  en.b2.unit04.lesson01.teach.ongoing:
    title: ongoing
    gloss: चल रहा, जारी
    note: '*ongoing* हिंदी के "कर रहा था" जैसे रूप से मेल खाता है। अंग्रेज़ी में यह अक्सर *was/were + -ing* बनता है।'
    example_gloss: जारी क्रिया कुछ समय तक चलती रहती है।
  en.b2.unit04.lesson01.teach.chronology:
    title: chronology
    gloss: कालक्रम, घटनाओं का वास्तविक क्रम
    note: '*chronology* घटनाओं का असली क्रम है, भले ही कहानी उन्हें किसी और क्रम में सुनाए।'
    example_gloss: कालक्रम घटनाओं का वास्तविक क्रम होता है।
  en.b2.unit04.lesson02.teach.by_the_time:
    title: कुछ पहले ही हो चुका था
    gloss: जब तक मैं पहुँचा, समन्वयक उपकरण पहले ही अंदर रखवा चुका था।
    note: '*had already moved* दिखाता है कि यह *I arrived* से पहले हुआ था। हिंदी में भी ऐसा "रखवा चुका था" से कहा जाता है, इसलिए अंग्रेज़ी में *has moved* नहीं, *had moved* कहें।'
  en.b2.unit04.lesson02.teach.while_checking:
    title: चलती क्रिया और उसमें बाधा
    gloss: जब मैं साउंड सिस्टम जाँच रहा था, तभी बिजली चली गई।
    note: '*was checking* हिंदी के "जाँच रहा था" जैसा चलती क्रिया का रूप है। बाधा खुद simple past में आती है: *went out*।'
  en.b2.unit04.lesson02.teach.when_arrived_setting:
    title: चलती पृष्ठभूमि-क्रिया के दौरान पहुँचना
    gloss: जब मैं पहुँचा, स्वयंसेवक कुर्सियाँ लगा रहे थे।
    note: जो चल रहा था, उसके लिए *were setting up* इस्तेमाल करें, जब मुख्य घटना हुई।
  en.b2.unit04.lesson02.teach.grammar_shifted_time:
    title: कहानी की समय-परतें
    gloss: पृष्ठभूमि की क्रिया के लिए past continuous, मुख्य घटनाओं के लिए simple past, और अतीत के किसी दूसरे क्षण से पहले हो चुकी घटनाओं के लिए past perfect इस्तेमाल कीजिए।
    note: 'कहानी सुनाते समय अंग्रेज़ी में आम तौर पर simple past चलता है: *the power went out*, *has gone out* नहीं।'
  en.b2.unit04.lesson03.teach.venue:
    title: venue
    gloss: आयोजन-स्थल
    note: '*venue* वह जगह है जहाँ कोई आयोजन होता है।'
    example_gloss: आयोजन-स्थल वह जगह है जहाँ कार्यक्रम होता है।
  en.b2.unit04.lesson03.teach.delayed:
    title: delayed
    gloss: देर से शुरू हुआ, विलंबित
    note: '*delayed* का अर्थ है कि कुछ योजना से देर से शुरू हुआ या हुआ।'
    example_gloss: कार्यक्रम बीस मिनट देर से शुरू हुआ।
  en.b2.unit04.lesson03.teach.reading_passage:
    title: 'पठन-पाठ: आयोजन-स्थल की समस्या'
    gloss: साइमन ने कहानी सख़्ती से कालक्रम में नहीं सुनाई। उसके आयोजन-स्थल पर पहुँचने से पहले, समन्वयक उपकरण अंदर रखवा चुका था, क्योंकि बारिश की आशंका थी। जब साइमन पहुँचा, स्वयंसेवक कुर्सियाँ लगा रहे थे। जब वह साउंड सिस्टम जाँच रहा था, तभी बिजली चली गई। उसने इमारत के प्रबंधक को फ़ोन किया, जिसने बताया कि उस सुबह पहले पास में मरम्मत करने वाला एक दल काम कर रहा था। टीम ने शुरुआत बीस मिनट टाल दी, लेकिन जब तक मेहमान अंदर आए, बत्तियाँ वापस आ चुकी थीं।
    note: 'अंग्रेज़ी की समय-परतों पर ध्यान दें: पहले की घटना के लिए *had moved*, पृष्ठभूमि के लिए *were setting up* और मुख्य घटना के लिए *went out*।'
  en.b2.unit04.lesson04.teach.q_walk_me_through:
    title: हार्पर कहानी पूछता है
    gloss: 'हार्पर पूछता है: क्या आप मुझे कदम-दर-कदम बता सकते हैं कि आयोजन-स्थल पर क्या हुआ?'
    note: '*walk me through* का अर्थ है किसी को किसी घटना से कदम-दर-कदम गुज़ारते हुए समझाना।'
  en.b2.unit04.lesson04.teach.a_arrived_volunteers:
    title: साइमन समय-परतों को जोड़ता है
    gloss: 'साइमन कहता है: ज़रूर। जब मैं पहुँचा, स्वयंसेवक कुर्सियाँ लगा रहे थे, लेकिन समन्वयक उपकरण पहले ही अंदर रखवा चुका था क्योंकि बारिश की आशंका थी।'
    note: अच्छी कहानी चलती पृष्ठभूमि-क्रिया को पहले हो चुकी घटना के साथ जोड़ती है।
  en.b2.unit04.lesson04.teach.q_equipment_safe:
    title: हार्पर क्रम की पुष्टि करता है
    gloss: 'हार्पर पूछता है: तो उपकरण आपके वहाँ पहुँचने से पहले ही सुरक्षित थे?'
    note: 'सवाल क्रम के बारे में है: उपकरण साइमन के पहुँचने से पहले ही सुरक्षित थे।'
  en.b2.unit04.lesson04.teach.a_power_went_out:
    title: साइमन बाधा बताता है
    gloss: 'साइमन कहता है: बिल्कुल। फिर, जब मैं साउंड सिस्टम जाँच रहा था, बिजली चली गई।'
    note: '*while I was checking* चलती क्रिया है; *the power went out* बाधा है।'
  en.b2.unit04.lesson04.teach.q_after_that:
    title: हार्पर अगला कदम पूछता है
    gloss: 'हार्पर पूछता है: उसके बाद आपने क्या किया?'
    note: '*What did you do...?* पूरे हो चुके कदम के बारे में सवाल के लिए *did* के साथ simple past इस्तेमाल करता है।'
  en.b2.unit04.lesson04.teach.a_repair_crew:
    title: साइमन पहले की पृष्ठभूमि बताता है
    gloss: 'साइमन कहता है: मैंने इमारत के प्रबंधक को फ़ोन किया, और उसने बताया कि उस सुबह पहले पास में मरम्मत करने वाला एक दल काम कर रहा था।'
    note: '*had been working* दिखाता है कि यह काम उस सुबह पहले से चल रहा था।'
  en.b2.unit04.lesson04.teach.q_event:
    title: हार्पर आयोजन के बारे में पूछता है
    gloss: 'हार्पर पूछता है: और कार्यक्रम?'
    note: यह छोटा सवाल कार्यक्रम पर पड़े असर के बारे में है।
  en.b2.unit04.lesson04.teach.a_delayed_start:
    title: साइमन बात समाप्त करता है
    gloss: 'साइमन कहता है: हमने शुरुआत बीस मिनट टाल दी, लेकिन जब तक मेहमान अंदर आए, बत्तियाँ वापस आ चुकी थीं।'
    note: '*had come back on* मेहमानों के अंदर आने से पहले हो चुका था।'
