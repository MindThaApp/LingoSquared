  en.a1.unit22.lesson01.teach.stomachache:
    title: stomachache
    gloss: पेट दर्द
    note: '*stomachache* का मतलब पेट दर्द है। यहाँ भी एकवचन के साथ article आता है (*a stomachache*)।'
    example_gloss: मुझे पेट दर्द है।
  en.a1.unit22.lesson01.teach.fever:
    title: fever
    gloss: बुख़ार
    note: '*fever* का मतलब बुख़ार है। *have a fever* कहते हैं, *have fever* नहीं।'
    example_gloss: मुझे लगता है कि मुझे बुख़ार है।
  en.a1.unit22.lesson01.teach.cough:
    title: cough
    gloss: खाँसी
    note: '*cough* का मतलब खाँसी है। यह शब्द संज्ञा भी है और क्रिया भी: *a cough* (खाँसी), *to cough* (खाँसना)।'
    example_gloss: डेनियल को तेज़ खाँसी है।
  en.a1.unit22.lesson01.teach.sore_throat:
    title: sore throat
