teaching:
  en.a1.unit22.lesson01.teach.headache:
    title: headache
    gloss: सिरदर्द
    note: '*headache* का मतलब सिरदर्द है। हिंदी में हम "मुझे सिरदर्द है" कहते हैं, बिना किसी article के; अंग्रेज़ी में *a headache* कहना पड़ता है, यानी एकवचन के साथ *a*।'
