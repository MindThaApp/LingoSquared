  en.a1.unit22.lesson02.teach.i_feel_hot:
    title: I feel hot.
    gloss: मुझे गर्मी लग रही है।
    note: '*I feel...* से आप बताते हैं कि आप शारीरिक रूप से कैसा महसूस कर रहे हैं। हिंदी में "मुझे गर्मी लग रही है" कहते हैं (कर्ता "मुझे" है); अंग्रेज़ी में कर्ता *I* होता है: *I feel hot*।'
