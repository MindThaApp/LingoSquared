    example_gloss: वसंत में फूल खिलते हैं।
  en.a1.unit44.lesson02.teach.whats_your_favorite_season:
    title: What's your favorite season?
    gloss: आपका पसंदीदा मौसम कौन-सा है?
    note: '*What''s your favorite season?* किसी का पसंदीदा मौसम पूछता है।'
  en.a1.unit44.lesson02.teach.my_favorite_season_is:
    title: My favorite season is fall.
    gloss: मेरा पसंदीदा मौसम पतझड़ है।
    note: '*My favorite season is ...* अपनी पसंद बताने का आम तरीका है।'
  en.a1.unit44.lesson03.teach.dialogue_line1:
    title: मिया का सवाल
    gloss: 'मिया पूछती है: लैला, आपका पसंदीदा मौसम कौन-सा है?'
    note: '*What''s your favorite ...?* किसी की पसंद पूछता है।'
  en.a1.unit44.lesson03.teach.dialogue_line2:
    title: "लैला का जवाब"
    gloss: 'लैला कहती है: पतझड़। पत्तों का रंग बदलता है, और बाहर चित्रकारी करने के लिए मौसम बहुत बढ़िया होता है।'
    note: '*great weather for painting outside* का मतलब है: बाहर चित्रकारी करने के लिए बढ़िया मौसम।'
  en.a1.unit44.lesson03.teach.dialogue_line3:
    title: मिया की प्रतिक्रिया
    gloss: 'मिया कहती है: यह अच्छा लगता है। मेरा पसंदीदा मौसम वसंत है।'
    note: '*My favorite season is spring* का मतलब है: मेरा पसंदीदा मौसम वसंत है।'
  en.a1.unit44.lesson03.teach.dialogue_line4:
    title: लैला का सवाल
    gloss: 'लैला पूछती है: वसंत ही क्यों?'
    note: '*Why spring?* कारण पूछने का एक छोटा तरीका है।'
  en.a1.unit44.lesson03.teach.dialogue_line5:
    title: "मिया का जवाब"
    gloss: 'मिया कहती है: फूल खिलते हैं, और मुझे अपनी फ़ोटोग्राफ़ी की कक्षा के लिए उनकी तस्वीरें खींचना बहुत पसंद है।'
    note: '*I love taking photos* का मतलब है: मुझे तस्वीरें खींचना बहुत पसंद है।'
  en.a1.unit44.lesson03.teach.dialogue_line6:
    title: लैला का सवाल
    gloss: 'लैला कहती है: यह तो समझ में आता है! आप जहाँ रहती हैं, वहाँ वसंत गर्म होता है या ठंडा?'
    note: '*That makes sense!* अच्छी वजह सुनने पर एक स्वाभाविक प्रतिक्रिया है।'
  en.a1.unit44.lesson03.teach.dialogue_line7:
    title: "मिया का जवाब"
    gloss: 'मिया कहती है: आम तौर पर गर्म, थोड़ी बारिश के साथ। बाहर घूमने के लिए एकदम बढ़िया।'
    note: '*with a little rain* का मतलब है: थोड़ी बारिश के साथ।'
  en.a1.unit44.lesson04.teach.reading_passage:
    title: तीन पसंदीदा मौसमों के बारे में पाठ
    gloss: डैनियल, लैला और मिया तीनों का पसंदीदा मौसम अलग-अलग है। डैनियल का पसंदीदा मौसम गर्मी है। जब मौसम गर्म और धूप वाला होता है तो उसे फ़ुटबॉल खेलना और दौड़ने जाना पसंद है। लैला का पसंदीदा मौसम पतझड़ है, क्योंकि उसे रंग बदलते पत्तों की चित्रकारी करना पसंद है। मिया का पसंदीदा मौसम वसंत है। वह अपनी फ़ोटोग्राफ़ी की कक्षा के लिए फूलों की तस्वीरें खींचती है। भले ही तीनों को अलग-अलग मौसम पसंद हैं, वे हमेशा साथ बाहर का आनंद लेने का समय निकाल लेते हैं।
    note: '*even though* का मतलब है: भले ही, हालाँकि।'
