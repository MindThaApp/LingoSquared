  en.a1.unit44.lesson01.teach.summer:
    title: summer
    gloss: गर्मी
    note: '*summer* का मतलब है गर्मी का मौसम।'
    example_gloss: मैं गर्मियों में समुद्र तट पर जाता हूँ।
  en.a1.unit44.lesson01.teach.fall:
    title: fall
    gloss: पतझड़
    note: '*fall* का मतलब है पतझड़ -- यह अमेरिकी अंग्रेज़ी का शब्द है (ब्रिटिश अंग्रेज़ी में *autumn* कहते हैं)।'
    example_gloss: पतझड़ में पत्तों का रंग बदल जाता है।
  en.a1.unit44.lesson01.teach.winter:
    title: winter
    gloss: सर्दी
    note: '*winter* का मतलब है सर्दी का मौसम।'
    example_gloss: सर्दियों में बर्फ़ गिरती है।
  en.a1.unit44.lesson01.teach.season:
    title: season
    gloss: मौसम (ऋतु)
    note: '*season* का मतलब है ऋतु, यानी साल का वह हिस्सा जिसका अपना खास मौसम होता है।'
    example_gloss: आपका पसंदीदा मौसम कौन-सा है?
  en.a1.unit44.lesson02.teach.in_the_summer:
    title: in the summer
    gloss: गर्मियों में
    note: '*in the summer* का मतलब है गर्मियों में। अंग्रेज़ी में मौसम के नाम से पहले *the* अक्सर हटाया भी जा सकता है: *in summer* और *in the summer* दोनों सही हैं (इसी तरह *in spring*, *in fall* और *in winter*)।'
    example_gloss: हम गर्मियों में समुद्र तट पर जाते हैं।
  en.a1.unit44.lesson02.teach.leaves_change_color:
    title: the leaves change color
    gloss: पत्तों का रंग बदलना
    note: '*the leaves change color* का मतलब है पत्तों का रंग बदलना।'
    example_gloss: पतझड़ में पत्तों का रंग बदल जाता है।
  en.a1.unit44.lesson02.teach.it_snows_a_lot:
