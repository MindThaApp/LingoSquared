teaching:
  en.b1.unit13.lesson01.teach.who:
    title: who
    gloss: जो (व्यक्ति के लिए)
    note: Relative clause में *who* किसी व्यक्ति के बारे में बताता है।
    example_gloss: डैनियल, जो मार्च में टीम में आया था, अभी से दो प्रोजेक्ट संभालता है।
  en.b1.unit13.lesson01.teach.which:
    title: which
    gloss: जो (चीज़ के लिए)
    note: Relative clause में *which* किसी चीज़ के बारे में बताता है।
    example_gloss: लैला ने जो डिज़ाइन कोर्स चुना है, वह जून में शुरू होता है।
  en.b1.unit13.lesson01.teach.that_relative:
    title: that
    gloss: जो (पहचान बताने वाला)
    note: Defining relative clause में *that* किसी व्यक्ति या चीज़ के लिए आता है।
    example_gloss: जिस क्लाइंट ने आज सुबह फ़ोन किया था, वह मीटिंग करना चाहता है।
  en.b1.unit13.lesson01.teach.whose:
    title: whose
    gloss: जिसका / जिसकी
    note: Relative clause में *whose* अधिकार या संबंध दिखाता है।
    example_gloss: जिस क्लाइंट का प्रोजेक्ट वे अभी पूरा कर रहे हैं, उसने डिज़ाइन पहले ही मंज़ूर कर दिया है।
  en.b1.unit13.lesson01.teach.where:
    title: where
    gloss: जहाँ
    note: Relative clause में *where* किसी जगह के बारे में बताता है।
    example_gloss: जिस ऑफ़िस में डैनियल काम करता है, वह शहर के बीच में है।
  en.b1.unit13.lesson01.teach.coworker:
    title: coworker
    gloss: सहकर्मी
    note: '*coworker* वह व्यक्ति है जिसके साथ आप काम करते हैं।'
    example_gloss: मिया की एक सहकर्मी है जो शाम को स्पैनिश सीखती है।
  en.b1.unit13.lesson02.teach.colleague_organized:
    title: सीमित करने वाले संबंधवाचक वाक्य में who
    gloss: मिया के पास बैठने वाली सहकर्मी बहुत व्यवस्थित है।
    note: यहाँ *who* वह जानकारी जोड़ता है जिससे पता चलता है कि बात किसकी हो रही है।
  en.b1.unit13.lesson02.teach.daniel_leads_projects:
    title: न सीमित करने वाले संबंधवाचक वाक्य में who
    gloss: डैनियल, जो मार्च में टीम में आया था, अभी से दो प्रोजेक्ट संभालता है।
    note: कॉमा बताते हैं कि relative clause सिर्फ़ अतिरिक्त जानकारी दे रहा है, पहचान के लिए ज़रूरी नहीं है।
  en.b1.unit13.lesson02.teach.grammar_defining:
    title: सीमित करने वाले और न करने वाले संबंधवाचक वाक्य
    gloss: 'जब आप साफ़ बताना चाहें कि आप किस व्यक्ति या चीज़ की बात कर रहे हैं, तो बिना कॉमा वाला defining relative clause इस्तेमाल करें: The colleague who sits next to Mia is organized. जिसके बारे में पहले से पता है, उसके बारे में अतिरिक्त जानकारी देनी हो, तो कॉमा वाला non-defining relative clause इस्तेमाल करें: Daniel, who joined in March, already leads two projects. ध्यान रहे: अंग्रेज़ी में कॉमा ही बताते हैं कि जानकारी अतिरिक्त है; defining clause में कॉमा नहीं लगता।'
    note: 'रूप: defining = कॉमा नहीं, बताता है कि कौन या क्या; non-defining = कॉमा, अतिरिक्त जानकारी जोड़ता है।'
  en.b1.unit13.lesson03.teach.deadline:
    title: deadline
    gloss: डेडलाइन, समय-सीमा
    note: '*deadline* वह तारीख़ या समय है जिसके पहले कोई काम पूरा होना चाहिए।'
    example_gloss: मिया के पास बैठने वाली सहकर्मी अपनी डेडलाइन हमेशा पूरी करती है।
  en.b1.unit13.lesson03.teach.approve:
    title: approve
    gloss: मंज़ूर करना
    note: '*approve* का मतलब है किसी चीज़ को आधिकारिक रूप से स्वीकार करना।'
    example_gloss: क्लाइंट ने पहला डिज़ाइन पहले ही मंज़ूर कर दिया है।
  en.b1.unit13.lesson03.teach.reading_passage:
    title: 'पाठ: नया ऑफ़िस'
    gloss: मिया कई ऐसे लोगों के साथ काम करती है जो उसका काम आसान बनाते हैं। डैनियल, जो मार्च में टीम में आया था, अभी से दो प्रोजेक्ट संभालता है। मिया के पास बैठने वाली सहकर्मी बहुत व्यवस्थित है और अपनी डेडलाइन हमेशा पूरी करती है। उनका ऑफ़िस, जो पाँचवीं मंज़िल पर है, में एक छोटी रसोई है जहाँ सब साथ मिलकर लंच करते हैं। जिस क्लाइंट का प्रोजेक्ट वे अभी पूरा कर रहे हैं, उसने पहला डिज़ाइन पहले ही मंज़ूर कर दिया है।
    note: Defining और non-defining relative clauses वाला एक छोटा पाठ।
  en.b1.unit13.lesson04.teach.q_met_the_woman:
    title: मिया नई सहकर्मी का परिचय कराती है
    gloss: 'मिया कहती है: लैला, क्या तुम उस महिला से मिली हो जो अभी-अभी हमारी टीम में आई है?'
    note: यहाँ *who* का संबंध *the woman* से है।
  en.b1.unit13.lesson04.teach.a_whose_desk:
    title: लैला नई सहकर्मी की सीट के बारे में पूछती है
    gloss: 'लैला कहती है: अभी नहीं। क्या वही है जिसका डेस्क खिड़की के पास है?'
    note: '*whose* संबंध दिखाता है: *whose desk*।'
  en.b1.unit13.lesson04.teach.q_the_designer_who:
    title: मिया नई सहकर्मी का वर्णन करती है
    gloss: 'मिया कहती है: हाँ, वही। वह डिज़ाइनर है जिसने लोगो प्रोजेक्ट पूरा किया था।'
    note: '*who* का संबंध *the designer* से है।'
  en.b1.unit13.lesson04.teach.a_which_won_award:
    title: लैला को प्रोजेक्ट याद आता है
    gloss: 'लैला कहती है: अरे हाँ, याद आया। क्या यह वही प्रोजेक्ट है जिसने पिछले महीने अवॉर्ड जीता था?'
    note: '*which* का संबंध *the project* से है।'
  en.b1.unit13.lesson04.teach.q_office_smaller:
    title: मिया अपने पुराने ऑफ़िस के बारे में बताती है
    gloss: 'मिया कहती है: बिल्कुल। जिस ऑफ़िस में वह पहले काम करती थी, वह हमारे ऑफ़िस से बहुत छोटा था।'
    note: '*where* जगह के बारे में बताता है: *the office*।'
  en.b1.unit13.lesson04.teach.a_kitchen_where:
    title: लैला समझती है कि उसे रसोई क्यों पसंद है
    gloss: 'लैला कहती है: तभी तो उसे वह रसोई इतनी पसंद है जहाँ सब साथ मिलकर लंच करते हैं।'
    note: '*where* का संबंध *the kitchen* से है।'
