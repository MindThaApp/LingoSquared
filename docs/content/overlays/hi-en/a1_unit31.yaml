teaching:
  en.a1.unit31.lesson01.teach.tall:
    title: tall
    gloss: लंबा
    note: '*tall* का मतलब लंबा है (किसी व्यक्ति के क़द के लिए)।'
    example_gloss: मेरा भाई लंबा है।
  en.a1.unit31.lesson01.teach.short:
    title: short
    gloss: नाटा
    note: '*short* का मतलब यहाँ नाटा या कम क़द का है (किसी व्यक्ति के लिए); *short* का मतलब "छोटा" भी होता है, जैसे बालों के लिए।'
    example_gloss: मेरी बहन नाटी है।
  en.a1.unit31.lesson01.teach.hair:
    title: hair
    gloss: बाल
    note: '*hair* का मतलब बाल है। अंग्रेज़ी में यह अगणनीय है: *her hair is long* कहते हैं, *her hairs are long* नहीं।'
    example_gloss: उसके लंबे बाल हैं।
  en.a1.unit31.lesson01.teach.blond:
    title: blond
    gloss: सुनहरे बालों वाला
    note: '*blond* का मतलब सुनहरे (हल्के पीले) बालों वाला है।'
    example_gloss: उसके बाल सुनहरे हैं।
  en.a1.unit31.lesson01.teach.curly:
    title: curly
    gloss: घुँघराला
    note: '*curly* का मतलब घुँघराला है।'
    example_gloss: लैला के बाल घुँघराले हैं।
  en.a1.unit31.lesson02.teach.eyes:
    title: eyes
    gloss: आँखें
    note: '*eyes* का मतलब आँखें (बहुवचन) है।'
    example_gloss: मेरी आँखें भूरी हैं।
  en.a1.unit31.lesson02.teach.blue:
    title: blue
    gloss: नीला
    note: '*blue* का मतलब नीला है।'
    example_gloss: उसकी आँखें नीली हैं।
  en.a1.unit31.lesson02.teach.brown:
    title: brown
    gloss: भूरा
    note: '*brown* का मतलब भूरा है।'
    example_gloss: मेरी आँखें भूरी हैं।
  en.a1.unit31.lesson02.teach.green:
    title: green
    gloss: हरा
    note: '*green* का मतलब हरा है।'
    example_gloss: उसकी आँखें हरी हैं।
  en.a1.unit31.lesson02.teach.glasses:
    title: glasses
    gloss: चश्मा
    note: '*glasses* का मतलब चश्मा है। यह शब्द हमेशा बहुवचन में रहता है; *wears glasses* का मतलब "चश्मा पहनता है" है।'
    example_gloss: मेरे पिताजी चश्मा पहनते हैं।
  en.a1.unit31.lesson02.teach.what_look_like:
    title: What does she look like?
    gloss: वह कैसी दिखती है?
    note: 'सवाल बनाने का क्रम ध्यान से देखिए: हिंदी में सवाल के लिए अक्सर सिर्फ़ "क्या" या स्वर बदलना काफ़ी होता है और कोई सहायक क्रिया नहीं लगती। अंग्रेज़ी में सामान्य क्रिया (*look*) के साथ हमेशा *does* या *do* चाहिए: *What does she look like?*, कभी *What looks she like?* नहीं। सहायक क्रिया *does* छोड़ देना हिंदी भाषियों की आम ग़लती है।'
  en.a1.unit31.lesson03.teach.dialogue_line1:
    title: लैला की शुरुआत
    gloss: 'लैला कहती है: आज हमारे यहाँ एक नई सहकर्मी आ रही हैं। उनका नाम मिया है।'
    note: '*starting today* का मतलब "आज से" है।'
  en.a1.unit31.lesson03.teach.dialogue_line2:
    title: डेनियल का सवाल
    gloss: 'डेनियल पूछता है: वह कैसी दिखती हैं?'
    note: 'फिर से *does* वाला सवाल: *does* मत छोड़िए, और हिंदी की तरह सिर्फ़ स्वर बदलकर सवाल मत बनाइए।'
  en.a1.unit31.lesson03.teach.dialogue_line3:
    title: लैला का वर्णन
    gloss: 'लैला कहती है: वह लंबी हैं और उनके घुँघराले, सुनहरे बाल हैं।'
    note: '*She''s*, *she is* का छोटा रूप है।'
  en.a1.unit31.lesson03.teach.dialogue_line4:
    title: डेनियल का अगला सवाल
    gloss: 'डेनियल पूछता है: क्या वह चश्मा पहनती हैं?'
    note: 'यहाँ भी *does* चाहिए: *Does she wear glasses?*, *Wears she glasses?* नहीं।'
  en.a1.unit31.lesson03.teach.dialogue_line5:
    title: लैला का जवाब
    gloss: 'लैला कहती है: हाँ, पहनती हैं। उनकी आँखें भी हरी हैं।'
    note: '*Yes, she does* एक छोटा सकारात्मक जवाब है, जिसमें सहायक क्रिया *does* दोहराई जाती है।'
  en.a1.unit31.lesson03.teach.dialogue_line6:
    title: डेनियल की आख़िरी टिप्पणी
    gloss: 'डेनियल कहता है: ठीक है, मुझे लगता है मैं उन्हें अब दरवाज़े पर देख रहा हूँ।'
    note: '*at the door* का मतलब "दरवाज़े पर" है।'
  en.a1.unit31.lesson04.teach.reading_passage:
    title: डेनियल और लैला के बारे में पाठ
    gloss: डेनियल और लैला अच्छे दोस्त हैं, पर वे एक जैसे नहीं दिखते। डेनियल लंबा है और उसके छोटे, काले बाल हैं। वह चश्मा पहनता है। लैला नाटी है और उसके लंबे, घुँघराले, भूरे बाल हैं। उसकी आँखें नीली हैं, और डेनियल की आँखें भूरी हैं। दोनों को ख़ूब हँसना पसंद है।
    note: '*don''t look the same* का मतलब "एक जैसे नहीं दिखते" है। यहाँ भी *do* वाला रूप चाहिए (*don''t* = *do not*), नकारात्मक वाक्य में भी।'
