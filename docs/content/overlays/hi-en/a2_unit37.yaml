teaching:
  en.a2.unit37.lesson01.teach.video_call:
    title: video call
    gloss: वीडियो कॉल
    note: '*video call* ऐसी बातचीत है जिसमें आप एक-दूसरे को देख भी सकते हैं।'
    example_gloss: मेरी हर सोमवार अपनी टीम के साथ एक वीडियो कॉल होती है।
  en.a2.unit37.lesson01.teach.camera:
    title: camera
    gloss: कैमरा
    note: '*camera* वह उपकरण है जो आपकी तस्वीर भेजता है।'
    example_gloss: मीटिंग शुरू होने से पहले अपना कैमरा चालू कर लो।
  en.a2.unit37.lesson01.teach.microphone:
    title: microphone
    gloss: माइक्रोफ़ोन
    note: '*microphone* वह उपकरण है जो आपकी आवाज़ भेजता है।'
    example_gloss: मेरा माइक्रोफ़ोन बंद था, इसलिए बाकी लोगों ने मुझे नहीं सुना।
  en.a2.unit37.lesson01.teach.connection:
    title: connection
    gloss: कनेक्शन
    note: '*connection* आपके कंप्यूटर और इंटरनेट के बीच का जुड़ाव है।'
    example_gloss: कनेक्शन खराब था, इसलिए वीडियो रुक गया।
  en.a2.unit37.lesson01.teach.mute:
    title: mute
    gloss: म्यूट करना
    note: '*mute* का मतलब है अपनी आवाज़ बंद कर देना, ताकि बाकी लोग आपको न सुनें।'
    example_gloss: जब मैं नहीं बोल रहा होता, तब अपना माइक्रोफ़ोन म्यूट कर देता हूँ।
  en.a2.unit37.lesson01.teach.face_to_face:
    title: face to face
    gloss: आमने-सामने
    note: '*face to face* का मतलब है एक ही कमरे में होना, स्क्रीन के ज़रिए बात न करना।'
    example_gloss: कुछ मीटिंग ऑनलाइन से ज़्यादा आमने-सामने अच्छी होती हैं।
  en.a2.unit37.lesson01.teach.grammar_comparison:
    title: Vergleichen mit faster than und less ... than
    gloss: वीडियो कॉल मिलने जाने से तेज़ है। वीडियो कॉल आमने-सामने की मुलाकात से कम निजी लगती है।
    note: छोटे adjective में *-er* जोड़ते हैं और बाद में *than* रखते हैं (*faster than*)। लंबे adjective के साथ *less ... than* या *more ... than* इस्तेमाल होता है।
  en.a2.unit37.lesson02.teach.video_call_every_monday:
    title: Sagen, wie oft Sie Videoanrufe haben
    gloss: मेरी हर सोमवार अपनी टीम के साथ एक वीडियो कॉल होती है।
    note: '*every Monday* का मतलब है हर सोमवार, और यह पक्की आदत बताता है।'
  en.a2.unit37.lesson02.teach.turn_on_your_camera:
    title: Jemanden bitten, die Kamera einzuschalten
    gloss: क्या तुम अपना कैमरा चालू कर सकते हो?
    note: '*turn on* का मतलब है चालू करना; इसका उलटा *turn off* (बंद करना) है।'
  en.a2.unit37.lesson02.teach.you_were_on_mute:
    title: Sagen, dass jemand stumm geschaltet war
    gloss: सॉरी, तुम म्यूट पर थे।
    note: '*you were on mute* वह पक्का वाक्य है जो तब बोलते हैं जब किसी का माइक म्यूट होने से वह सुनाई नहीं दे रहा था।'
  en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face:
    title: Die eigene Meinung mit einer Vorliebe sagen
    gloss: मुझे लगता है कि वीडियो कॉल काम की चीज़ हैं, पर मैं लोगों से आमने-सामने मिलना ज़्यादा पसंद करता हूँ।
    note: '*I think ... but I prefer ...* से आप पहले अपनी राय बताते हैं और फिर यह कि आपको क्या ज़्यादा पसंद है।'
  en.a2.unit37.lesson02.teach.grammar_prefer:
    title: prefer X to Y
    gloss: मुझे फ़ोन कॉल से ज़्यादा वीडियो कॉल पसंद हैं। मुझे वीडियो कॉल से ज़्यादा आमने-सामने की मुलाकातें पसंद हैं।
    note: 'ध्यान दीजिए: *prefer* के बाद *to* आता है, *than* नहीं: *I prefer video calls to phone calls*।'
  en.a2.unit37.lesson03.teach.headphones:
    title: headphones
    gloss: हेडफ़ोन
    note: '*headphones* अंग्रेज़ी में हमेशा बहुवचन में रहता है, भले ही आप एक ही जोड़ी इस्तेमाल करें।'
    example_gloss: मैं हेडफ़ोन लगाता हूँ ताकि मेरे घरवाले मीटिंग न सुनें।
  en.a2.unit37.lesson03.teach.leilas_message:
    title: Leilas Nachricht
    gloss: मेरी ऑनलाइन क्लासें अब सब वीडियो कॉल पर होती हैं। मैं अपना कैमरा चालू रखती हूँ, पर टीचर के सवाल पूछने तक माइक्रोफ़ोन म्यूट रखती हूँ। मैं हेडफ़ोन लगाती हूँ क्योंकि उनके साथ मेरा कनेक्शन बेहतर चलता है। मुझे लगता है कि वीडियो कॉल से बहुत समय बचता है, फिर भी मैं अपने सहपाठियों से आमने-सामने मिलना ज़्यादा पसंद करती हूँ।
    note: Leila का एक आम-सा संदेश, अपनी ऑनलाइन क्लासों के बारे में।
  en.a2.unit37.lesson03.teach.mute_until_question:
    title: Sagen, wann Sie Ihr Mikrofon stumm schalten
    gloss: टीचर के सवाल पूछने तक मेरा माइक्रोफ़ोन म्यूट रहता है।
    note: '*until* का मतलब है "तक": कोई बात तब तक चलती है जब तक कोई ख़ास पल न आ जाए।'
  en.a2.unit37.lesson04.teach.q_lot_of_video_calls:
    title: Leila fragt nach Daniels Arbeit
    gloss: 'Leila पूछती है: क्या तुम्हारे काम पर बहुत वीडियो कॉल होती हैं?'
    note: '*a lot of* का मतलब है बहुत सारा, और यह गिनी जा सकने वाली और न गिनी जा सकने वाली, दोनों तरह की चीज़ों के साथ चलता है।'
  en.a2.unit37.lesson04.teach.a_call_every_monday:
    title: Daniel erzählt von seinem festen Termin
    gloss: 'Daniel कहता है: हाँ, मेरी हर सोमवार अपनी टीम के साथ एक वीडियो कॉल होती है।'
    note: वही वाक्य जो पाठ 2 में था।
  en.a2.unit37.lesson04.teach.q_turn_on_camera:
    title: Leila fragt nach der Kamera
    gloss: 'Leila पूछती है: क्या तुम अपना कैमरा चालू करते हो?'
    note: और जानने के लिए एक छोटा-सा अगला सवाल।
  en.a2.unit37.lesson04.teach.a_always_but_mute:
    title: Daniels Gewohnheit im Videoanruf
    gloss: 'Daniel कहता है: हमेशा, पर जब मैं नहीं बोल रहा होता, तब अपना माइक्रोफ़ोन म्यूट कर देता हूँ।'
    note: '*when I am not speaking* का यहाँ मतलब है: उन पलों में जब मैं नहीं बोल रहा।'
  en.a2.unit37.lesson04.teach.q_classes_are_video_calls:
    title: Leila erzählt von ihren Kursen
    gloss: 'Leila कहती है: मेरी ऑनलाइन क्लासें अब सब वीडियो कॉल पर होती हैं।'
    note: यह इकाई 33 की उसकी सोमवार और बुधवार की क्लासों से जुड़ता है।
  en.a2.unit37.lesson04.teach.a_what_do_you_think:
    title: Daniel fragt nach ihrer Meinung
    gloss: 'Daniel पूछता है: तुम्हें इनके बारे में क्या लगता है?'
    note: '*What do you think about them?* अभी-अभी बताई गई चीज़ के बारे में राय पूछता है।'
  en.a2.unit37.lesson04.teach.q_useful_but_prefer:
    title: Leila sagt ihre Meinung
    gloss: 'Leila कहती है: मुझे लगता है कि वीडियो कॉल काम की चीज़ हैं, पर मैं लोगों से आमने-सामने मिलना ज़्यादा पसंद करती हूँ।'
    note: वही राय जो पाठ 2 में थी।
  en.a2.unit37.lesson04.teach.a_agree_faster_less_personal:
    title: Daniel stimmt ihr zu
    gloss: 'Daniel कहता है: मैं तुमसे सहमत हूँ। वीडियो कॉल मिलने जाने से तेज़ है, पर कम निजी लगती है।'
    note: '*I agree* से आप सहमति जताते हैं। उसके बाद आमतौर पर अपना कारण बताते हैं।'
  en.a2.unit37.lesson04.teach.q_exactly:
    title: Leila bestätigt
    gloss: 'Leila कहती है: बिलकुल।'
    note: '*Exactly* यह कहने का छोटा तरीका है कि आप पूरी तरह सहमत हैं।'
