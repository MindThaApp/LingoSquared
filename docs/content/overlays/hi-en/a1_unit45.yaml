  en.a1.unit45.lesson02.teach.whats_your_emergency:
    title: What's your emergency?
    gloss: आपका आपातकाल क्या है?
    note: अमेरिका में 911 पर फ़ोन करने पर आपातकालीन सेवा का कर्मचारी सबसे पहले यही सवाल पूछता है।
  en.a1.unit45.lesson03.teach.dialogue_line1:
    title: लैला को धुएँ की गंध आती है
    gloss: 'लैला पूछती है: डैनियल, क्या कुछ जल रहा है? मुझे धुएँ की गंध आ रही है!'
    note: '*smell* के बाद सीधे संज्ञा आती है, बीच में कोई शब्द नहीं: *I smell smoke* का मतलब है "मुझे धुएँ की गंध आ रही है"। ध्यान रहे, *I smell of smoke* का मतलब अलग है (मेरे अंदर से धुएँ की गंध आ रही है)।'
  en.a1.unit45.lesson03.teach.dialogue_line2:
    title: डैनियल की सफ़ाई
    gloss: 'डैनियल कहता है: अरे नहीं, पैन में आग लग गई! मैं रात का खाना बना रहा था।'
    note: '*caught fire* का मतलब है अचानक आग पकड़ लेना। यह एक पक्का मुहावरा है।'
  en.a1.unit45.lesson03.teach.dialogue_line3:
    title: लैला के निर्देश
    gloss: 'लैला कहती है: शांत रहो। चूल्हा बंद करो! मैं मदद के लिए फ़ोन करती हूँ।'
    note: '*call for help* का मतलब है मदद के लिए फ़ोन करना। यहाँ *for* को न छोड़िए।'
  en.a1.unit45.lesson03.teach.dialogue_line4:
    title: डैनियल की चेतावनी
    gloss: 'डैनियल कहता है: जल्दी करो, आग बढ़ती जा रही है!'
    note: '*getting bigger* का मतलब है बड़ा होता जाना। बदलाव बताने के लिए *get* के बाद विशेषण लगाया जाता है।'
  en.a1.unit45.lesson03.teach.dialogue_line5:
    title: लैला आपातकालीन नंबर पर फ़ोन करती है
    gloss: 'लैला कहती है: नमस्ते, यह आपातकाल है। मेरे दोस्त की रसोई में आग लगी है। कृपया दमकल विभाग को भेजिए।'
    note: 'अमेरिका में आपातकालीन सेवा से बात इसी तरह होती है: वहाँ 911 पर फ़ोन किया जाता है।'
  en.a1.unit45.lesson03.teach.dialogue_line6:
    title: डैनियल की राहत
    gloss: 'डैनियल कहता है: भगवान का शुक्र है। मुझे लगता है कि अब आग बुझ गई है, लेकिन एहतियात के तौर पर बाहर इंतज़ार करते हैं।'
    note: '*just in case* का मतलब है एहतियात के तौर पर।'
  en.a1.unit45.lesson03.teach.dialogue_line7:
    title: लैला की सलाह
    gloss: 'लैला कहती है: अच्छा विचार है। उनके आने तक बाहर इंतज़ार करना ज़्यादा सुरक्षित है।'
    note: '*safer* का मतलब है "ज़्यादा सुरक्षित"। यह *safe* का तुलनात्मक रूप है, जो *-er* जोड़कर बनता है। हिंदी में इसके लिए "ज़्यादा" जैसा शब्द अलग से लगाते हैं।'
  en.a1.unit45.lesson04.teach.reading_passage:
    title: आपातकालीन सावधानियों का पाठ
    gloss: 'आग लगने पर: पहला, शांत रहिए। दूसरा, तुरंत इमारत से बाहर निकलिए। लिफ़्ट का इस्तेमाल न करें; सीढ़ियों का इस्तेमाल करें। तीसरा, बाहर पहुँचने पर 911 पर फ़ोन करें और अपना पता बताइए। अंत में, दमकल विभाग के आने तक बाहर इंतज़ार कीजिए। डैनियल की रसोई में आग लगने के बाद वह और लैला सूचना के अनुसार ही बाहर इंतज़ार करते रहे। दमकल विभाग जल्दी पहुँच गया और उसने यह पक्का किया कि सब कुछ सुरक्षित है। बाद में मिया उन दोनों का हाल देखने आई और यह जानकर उसे राहत मिली कि किसी को चोट नहीं आई।'
    note: '*elevator* लिफ़्ट के लिए अमेरिकी शब्द है। ब्रिटिश अंग्रेज़ी में *lift* कहते हैं।'
