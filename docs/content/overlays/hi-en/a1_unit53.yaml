teaching:
  en.a1.unit53.lesson01.teach.rent:
    title: rent
    gloss: किराये पर लेना / देना
    note: '*rent* का मतलब है किराये पर लेना या देना। ध्यान दें: अंग्रेज़ी में *rent* दोनों दिशाओं के लिए आता है (किसी से किराये पर लेना और किसी को किराये पर देना); हिंदी में ये दो अलग अभिव्यक्तियाँ हैं, इसलिए मतलब संदर्भ से समझिए।'
    example_gloss: मुझे एक साइकिल किराये पर लेनी है।
  en.a1.unit53.lesson01.teach.deposit:
    title: deposit
    gloss: ज़मानत की रक़म
    note: '*deposit* का मतलब है ज़मानत की रक़म, यानी वह पैसा जो आप पहले जमा करते हैं और साइकिल सही-सलामत लौटाने पर वापस मिल जाता है।'
    example_gloss: ज़मानत की रक़म बीस डॉलर है।
  en.a1.unit53.lesson01.teach.return:
    title: return
    gloss: लौटाना
    note: '*return* का मतलब यहाँ किसी चीज़ को लौटाना है (ख़ुद वापस आना नहीं)।'
    example_gloss: कृपया साइकिल आज लौटा दीजिए।
  en.a1.unit53.lesson01.teach.hour:
    title: hour
    gloss: घंटा
    note: '*hour* का मतलब है घंटा।'
    example_gloss: इसका किराया दस डॉलर प्रति घंटा है।
  en.a1.unit53.lesson01.teach.size:
    title: size
    gloss: साइज़ / नाप
    note: '*size* का मतलब है साइज़ या नाप।'
    example_gloss: आपको कौन-सा साइज़ चाहिए?
  en.a1.unit53.lesson01.teach.helmet:
    title: helmet
    gloss: हेलमेट
    note: '*helmet* का मतलब है हेलमेट।'
    example_gloss: क्या आपके पास हेलमेट है?
  en.a1.unit53.lesson02.teach.id_like_to_rent_a_bike:
    title: I'd like to rent a bike, please.
    gloss: मुझे एक साइकिल किराये पर लेनी है, कृपया।
    note: '*I''d like to* (*I would like to* का छोटा रूप) कुछ माँगने का विनम्र तरीक़ा है, सीधे *I want* कहने से ज़्यादा नरम।'
  en.a1.unit53.lesson02.teach.how_much_does_it_cost_per_hour:
    title: How much does it cost per hour?
    gloss: इसका प्रति घंटे का किराया कितना है?
    note: '*does it cost* में सहायक क्रिया *does* आती है, क्योंकि मुख्य क्रिया *cost* है; अंग्रेज़ी के बाक़ी सवालों में भी *do* की यही बनावट होती है।'
  en.a1.unit53.lesson02.teach.i_need_a_small_bike:
    title: I need a small bike.
    gloss: मुझे एक छोटी साइकिल चाहिए।
    note: '*need a small bike* में क्रिया *need* के बाद सीधे संज्ञा आती है, जैसे हिंदी में "छोटी साइकिल चाहिए" या "... की ज़रूरत है"।'
  en.a1.unit53.lesson02.teach.can_i_have_a_helmet:
    title: Can I have a helmet, please?
    gloss: क्या मुझे एक हेलमेट मिल सकता है, कृपया?
    note: '*Can I have ...?* दुकान में कुछ माँगने का एक पक्का विनम्र तरीक़ा है; शब्दशः यह "क्या मेरे पास हो सकता है" जैसा लगता है, पर अंग्रेज़ी में यह हिंदी के "क्या मिल सकता है?" जितना ही विनम्र है।'
  en.a1.unit53.lesson02.teach.when_do_i_need_to_return_it:
    title: When do I need to return it?
    gloss: मुझे इसे कब लौटाना होगा?
    note: '*do I need to* में भी सवाल बनाने के लिए सहायक क्रिया *do* आती है।'
  en.a1.unit53.lesson02.teach.its_ten_dollars_an_hour:
    title: It's ten dollars an hour.
    gloss: यह दस डॉलर प्रति घंटा है।
    note: यहाँ *an hour* का मतलब है "प्रति घंटा"; यहाँ *an* का अर्थ "प्रति" है, जैसे समय की दूसरी इकाइयों में *a* का होता है।
  en.a1.unit53.lesson03.teach.dialogue_line1:
    title: दुकानदार उनका स्वागत करता है
    gloss: 'दुकानदार कहता है: नमस्ते! आज मैं आपकी क्या मदद करूँ?'
    note: '*How can I help you today?* दुकानों और सेवाओं में बातचीत शुरू करने का एक पक्का विनम्र वाक्य है।'
  en.a1.unit53.lesson03.teach.dialogue_line2:
    title: मिया की माँग
    gloss: 'मिया कहती है: हमें दो साइकिलें किराये पर लेनी हैं। हम नदी के किनारे साइकिल चलाना चाहते हैं।'
    note: '*We''d like to rent* में फिर से *rent* आया है, यहाँ दुकान से किराये पर लेने के अर्थ में, किराये पर देने के नहीं।'
  en.a1.unit53.lesson03.teach.dialogue_line3:
    title: दुकानदार साइज़ पूछता है
    gloss: 'दुकानदार कहता है: ज़रूर। आपको कौन-सा साइज़ चाहिए?'
    note: '*What size do you need?* में भी सवाल बनाने के लिए सहायक क्रिया *do* आई है।'
  en.a1.unit53.lesson03.teach.dialogue_line4:
    title: लैला का साइज़
    gloss: 'लैला कहती है: मुझे एक छोटी वाली चाहिए।'
    note: यहाँ *one* शब्द *bike* की जगह आया है, ताकि उसे दोहराना न पड़े; हिंदी में "छोटी वाली" कहते हैं, पर अंग्रेज़ी में *one* एक अलग शब्द है।
  en.a1.unit53.lesson03.teach.dialogue_line5:
    title: मिया का साइज़
    gloss: 'मिया कहती है: और मुझे एक मध्यम साइज़ की चाहिए।'
    note: यहाँ भी *bike* की जगह *one* आया है, ठीक लैला के पिछले वाक्य की तरह।
  en.a1.unit53.lesson03.teach.dialogue_line6:
    title: किराया और ज़मानत की रक़म
    gloss: 'दुकानदार कहता है: बढ़िया, ये रहीं आपकी साइकिलें। किराया दस डॉलर प्रति घंटा है, और ज़मानत की रक़म बीस डॉलर है।'
    note: इस वाक्य में दो अलग बातें हैं (घंटे का किराया और ज़मानत की रक़म); इन्हें आपस में मत मिलाइए।
  en.a1.unit53.lesson03.teach.dialogue_line7:
    title: मिया लौटाने के बारे में पूछती है
    gloss: 'मिया कहती है: हमें इन्हें कब लौटाना होगा?'
    note: यहाँ *them* पीछे बताई गई साइकिलों (बहुवचन) के लिए है।
  en.a1.unit53.lesson03.teach.dialogue_line8:
    title: लौटाने का समय
    gloss: 'दुकानदार कहता है: कृपया इन्हें पाँच बजे तक लौटा दीजिए।'
    note: '*by five o''clock* का मतलब है "पाँच बजे तक", यानी उसके बाद नहीं।'
  en.a1.unit53.lesson03.teach.dialogue_line9:
    title: लैला दुकानदार को धन्यवाद देती है
    gloss: 'लैला कहती है: बढ़िया, धन्यवाद!'
    note: '*Great, thank you!* बातचीत को विनम्रता से ख़त्म करने का एक छोटा, पक्का तरीक़ा है।'
  en.a1.unit53.lesson04.teach.reading_passage:
    title: नदी किनारे साइकिल की सवारी पर पाठ
    gloss: एक गर्म दोपहर मिया ने लैला को अपने अपार्टमेंट के पास की नदी के किनारे साइकिल चलाने के लिए बुलाया। दोनों में से किसी के पास साइकिल नहीं थी, इसलिए वे साथ में किराये की दुकान पर गईं। दुकानदार ने पूछा कि उन्हें कौन-सा साइज़ चाहिए, और लैला ने छोटी साइकिल ली जबकि मिया ने मध्यम साइज़ की। किराया दस डॉलर प्रति घंटा था, और दोनों साइकिलों की ज़मानत की रक़म बीस डॉलर थी। उन्हें साइकिलें पाँच बजे तक लौटानी थीं। नदी के किनारे की सवारी बहुत सुंदर थी, और उन्होंने लोगों को अपने कुत्तों को टहलाते और धूप वाले मौसम का मज़ा लेते देखा। उन्होंने साइकिलें ठीक समय पर लौटा दीं और अपनी ज़मानत की रक़म वापस पा ली। बाद में उन्होंने डैनियल को सवारी के बारे में बताया, और उसने कहा कि अगली बार वह भी साथ चलना चाहता है।
    note: '*owned*, *own* (मालिक होना) का भूतकाल है; *Neither of them owned a bike* का मतलब है "दोनों में से किसी के पास साइकिल नहीं थी"।'
