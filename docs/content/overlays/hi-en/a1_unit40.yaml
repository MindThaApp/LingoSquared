  en.a1.unit40.lesson03.teach.dialogue_line1:
    title: डैनियल का अनुरोध
    gloss: 'डैनियल कहता है: नमस्ते, मैं यह पार्सल भेजना चाहूँगा, कृपया।'
    note: '*I''d like to* + क्रिया कुछ माँगने का विनम्र तरीका है। काउंटर पर *I want* कुछ रूखा लगता है, इसलिए *I''d like to* ज़्यादा अच्छा है।'
  en.a1.unit40.lesson03.teach.dialogue_line2:
    title: क्लर्क पूछता है
    gloss: 'क्लर्क कहता है: ज़रूर! यह कहाँ जा रहा है?'
    note: '*Where is it going?* गंतव्य के बारे में पूछता है।'
  en.a1.unit40.lesson03.teach.dialogue_line3:
    title: "दानिएल का जवाब"
    gloss: 'डैनियल कहता है: शिकागो। यह मेरी बहन के लिए जन्मदिन का तोहफ़ा है।'
    note: '*It''s a birthday gift for my sister* का मतलब है: यह मेरी बहन के लिए जन्मदिन का तोहफ़ा है।'
  en.a1.unit40.lesson03.teach.dialogue_line4:
    title: क्लर्क पूछता है
    gloss: 'क्लर्क कहता है: आप आम डाक चाहते हैं या स्पीड पोस्ट? स्पीड पोस्ट में लगभग दो दिन लगते हैं।'
    note: '*regular or express mail* का मतलब है आम डाक या स्पीड पोस्ट।'
  en.a1.unit40.lesson03.teach.dialogue_line5:
    title: डैनियल का चुनाव
    gloss: 'डैनियल कहता है: मैं स्पीड पोस्ट लूँगा, कृपया। इसका कितना होगा?'
    note: '*I''ll take ...* सेवा देने वाले के सामने अपना चुनाव बताने का एक स्वाभाविक तरीका है।'
  en.a1.unit40.lesson03.teach.dialogue_line6:
    title: क्लर्क जवाब देता है
    gloss: 'क्लर्क कहता है: यह बारह डॉलर होगा। यह आपकी रसीद है।'
    note: '*Here''s your receipt* का मतलब है: यह आपकी रसीद है।'
  en.a1.unit40.lesson03.teach.dialogue_line7:
    title: डैनियल का धन्यवाद
    gloss: 'डैनियल कहता है: धन्यवाद! आपका दिन शुभ हो।'
    note: '*Have a good day* विदा लेते समय कहा जाने वाला एक विनम्र वाक्य है।'
  en.a1.unit40.lesson04.teach.reading_passage:
    title: डाकघर की तीन यात्राओं के बारे में पाठ
    gloss: डैनियल, लैला और मिया तीनों डाकघर के काम अच्छी तरह जानते हैं। पिछले हफ़्ते डैनियल ने शिकागो में अपनी बहन को जन्मदिन का पार्सल भेजा। उसने स्पीड पोस्ट के पैसे दिए क्योंकि वह चाहता था कि वह जल्दी पहुँचे, और उसे सिर्फ़ दो दिन लगे। लैला मिया के पास रहने जाने की तैयारी कर रही है, इसलिए वह अपने माता-पिता को कुछ पुरानी किताबें भेजने डाकघर गई। क्लर्क ने पार्सल का वज़न किया और उस पर लगाने के लिए उसे एक डाक टिकट दिया। लैला ने पूछा कि पार्सल को कितना समय लगेगा, और क्लर्क ने कहा लगभग एक हफ़्ता, क्योंकि उसने आम डाक चुनी थी। मिया बहुत बार पार्सल नहीं भेजती, लेकिन अपनी दादी को लिखी चिट्ठियों के लिए वह हमेशा डाक टिकट खरीदती है। वह कहती है कि डाक टिकट लगी चिट्ठी टेक्स्ट मैसेज से ज़्यादा अपनी लगती है।
    note: '*getting ready to move* का मतलब है: घर बदलने की तैयारी करना।'
