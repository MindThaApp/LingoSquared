teaching:
  en.b1.unit01.lesson01.teach.must:
    title: must
    gloss: करना ही है (अपनी ओर से पक्की ज़िम्मेदारी)
    note: '*must* अपनी तरफ़ से पक्की ज़िम्मेदारी बताता है -- ऐसा काम जिसे आप खुद बहुत ज़रूरी मानते हैं।'
    example_gloss: मुझे यह काम आज ही पूरा करना है।
  en.b1.unit01.lesson01.teach.have_to:
    title: have to
    gloss: करना पड़ेगा (बाहर से लगी मजबूरी)
    note: '*have to* ऐसी मजबूरी बताता है जो बाहर से आती है, जैसे कोई नियम या आख़िरी तारीख़।'
    example_gloss: मुझे शुक्रवार तक किराया देना है।
  en.b1.unit01.lesson01.teach.should:
    title: should
    gloss: चाहिए / करना चाहिए
    note: '*should* सलाह देता है, पक्की मजबूरी नहीं।'
    example_gloss: तुम्हें जल्दी ही दाँत के डॉक्टर को फ़ोन करना चाहिए।
  en.b1.unit01.lesson01.teach.task:
    title: task
    gloss: काम
    note: '*task* का मतलब है वह काम जिसे पूरा करना है।'
    example_gloss: मेरे पास अभी एक काम और बचा है।
  en.b1.unit01.lesson01.teach.rent:
    title: rent
    gloss: किराया
    note: '*rent* का मतलब है वह पैसा जो रहने की जगह के लिए दिया जाता है।'
    example_gloss: किराया शुक्रवार को देना है।
  en.b1.unit01.lesson01.teach.appointment:
    title: appointment
    gloss: अपॉइंटमेंट
    note: '*appointment* का मतलब है किसी से पहले से तय की हुई मुलाक़ात, जैसे डॉक्टर के साथ।'
    example_gloss: इस हफ़्ते मेरी दाँत के डॉक्टर के साथ अपॉइंटमेंट है।
  en.b1.unit01.lesson02.teach.must_finish_task:
    title: कड़ी ज़िम्मेदारी बताना
    gloss: मुझे यह काम आज ही पूरा करना है।
    note: '*I must* अपनी तरफ़ से पक्की ज़िम्मेदारी बताता है।'
  en.b1.unit01.lesson02.teach.have_to_pay_rent:
    title: बाहरी ज़िम्मेदारी बताना
    gloss: मुझे शुक्रवार तक किराया देना है।
    note: '*I have to* बाहर से आई मजबूरी बताता है, जैसे भुगतान की आख़िरी तारीख़।'
  en.b1.unit01.lesson02.teach.she_has_to_make:
    title: '''she'' के साथ रूप'
    gloss: उसे अपॉइंटमेंट लेना है।
    note: '*he/she/it* के साथ *have to* बदलकर *has to* हो जाता है।'
  en.b1.unit01.lesson02.teach.you_should_call:
    title: सिफ़ारिश देना
    gloss: तुम्हें फ़ोन करके अपॉइंटमेंट पक्का कर लेना चाहिए।
    note: '*should* सलाह देता है; यह *must* या *have to* की तरह पक्की मजबूरी नहीं है।'
  en.b1.unit01.lesson02.teach.grammar_agreement:
    title: '''have to'' के रूप'
    gloss: मुझे जाना है। उसे जाना है। हमें जाना है। उन्हें जाना है।
    note: सिर्फ़ *he/she/it* के साथ *have* बदलकर *has* होता है; बाकी सबके साथ *have to* ही रहता है।
  en.b1.unit01.lesson03.teach.should_have_called:
    title: अतीत पर अफ़सोस जताना
    gloss: मुझे पहले फ़ोन कर लेना चाहिए था।
    note: '*should have* + verb की तीसरी form उस काम का पछतावा बताता है जो किया नहीं गया।'
    example_gloss: मुझे पहले फ़ोन कर लेना चाहिए था।
  en.b1.unit01.lesson03.teach.must_not:
    title: must not
    gloss: मनाही है / नहीं करना चाहिए
    note: '*must not* का मतलब है मनाही -- कोई बात बिल्कुल नहीं करनी है। ध्यान रहे: *must not* का मतलब "ज़रूरी नहीं" नहीं है; "ज़रूरी नहीं" के लिए *don''t have to* आता है।'
    example_gloss: तुम्हें यह दोबारा नहीं भूलना चाहिए।
  en.b1.unit01.lesson03.teach.dont_have_to:
    title: don't have to
    gloss: ज़रूरी नहीं / ज़रूरत नहीं
    note: '*don''t have to* का मतलब है कि कोई काम करना ज़रूरी नहीं है; यह *must not* (मनाही) से अलग है।'
    example_gloss: अगर तुम व्यस्त हो तो आना ज़रूरी नहीं है।
  en.b1.unit01.lesson03.teach.grammar_past_regret:
    title: अफ़सोस, मनाही और ज़रूरी न होना
    gloss: मुझे फ़ोन कर लेना चाहिए था। मैं भूल गया। तुम्हें यह दोबारा नहीं भूलना चाहिए। तुम्हें आने की ज़रूरत नहीं है।
    note: '*should have* + verb की तीसरी form बीते समय का पछतावा बताता है। *must not* मनाही है; *don''t have to* का मतलब है कि ज़रूरी नहीं, पर चाहो तो कर सकते हो।'
  en.b1.unit01.lesson03.teach.reading_passage:
    title: 'पाठ: जिम'
    gloss: कल Daniel जिम की सदस्यता रिन्यू कराना भूल गया। उसे अपने फ़ोन पर रिमाइंडर लगा लेना चाहिए था। अब उसे देर से भुगतान का जुर्माना देना पड़ेगा। अगले महीने उसे यह दोबारा नहीं भूलना चाहिए।
    note: Daniel की गलती और उसके नतीजे के बारे में एक छोटा पाठ।
  en.b1.unit01.lesson04.teach.q_renew_gym:
    title: लैला सदस्यता के बारे में पूछती है
    gloss: 'Leila कहती है: Daniel, क्या तुमने अपनी जिम की सदस्यता रिन्यू करा ली?'
    note: यह सीधा सवाल है, जिससे पता चलता है कि कोई काम हो चुका है या नहीं।
  en.b1.unit01.lesson04.teach.a_forgot_should_have:
    title: 'डैनियल का जवाब: भूल गया'
    gloss: 'Daniel कहता है: अरे नहीं, मैं भूल गया! मुझे यह पिछले हफ़्ते कर लेना चाहिए था।'
    note: '*I should have done that* उस काम का पछतावा बताता है जो किया नहीं गया।'
  en.b1.unit01.lesson04.teach.q_call_today:
    title: लैला डैनियल को चेताती है
    gloss: 'Leila कहती है: तुम्हें आज ही उन्हें फ़ोन करना होगा, वरना तुम्हें जुर्माना देना पड़ेगा।'
    note: यहाँ *must* एक ज़रूरी चेतावनी के लिए आया है।
  en.b1.unit01.lesson04.teach.a_also_pay_rent:
    title: डैनियल और ज़िम्मेदारियाँ बताता है
    gloss: 'Daniel कहता है: तुम ठीक कह रही हो। मुझे शुक्रवार तक किराया भी देना है, और दाँत के डॉक्टर को भी फ़ोन करना चाहिए।'
    note: Daniel एक ही जवाब में *have to* (मजबूरी) और *should* (सलाह) को साथ इस्तेमाल करता है।
  en.b1.unit01.lesson04.teach.q_dont_have_to:
    title: लैला डैनियल को तसल्ली देती है
    gloss: 'Leila कहती है: तुम्हें सब कुछ आज ही करने की ज़रूरत नहीं है। लेकिन जिम को दोबारा मत भूलना।'
    note: Leila *don't have to* (ज़रूरी नहीं) और *must not* (मनाही) में फ़र्क दिखाती है।
  en.b1.unit01.lesson04.teach.a_more_organized:
    title: डैनियल एक संकल्प लेता है
    gloss: 'Daniel कहता है: मुझे पता है। इस महीने मुझे ज़्यादा व्यवस्थित रहना है।'
    note: '*I must be* यहाँ अपना पक्का इरादा बताता है।'
