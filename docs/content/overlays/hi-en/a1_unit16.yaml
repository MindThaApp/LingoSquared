    title: I usually go to bed at eleven.
    gloss: मैं आम तौर पर ग्यारह बजे सोने जाता हूँ।
    note: '*usually* का मतलब आम तौर पर है; यह ऐसी आदत बताता है जो हमेशा बिल्कुल एक जैसी नहीं होती। क्रम का ध्यान रखिए: अंग्रेज़ी में *usually* मुख्य क्रिया से पहले आता है (*I usually go*)। हिंदी की तरह यह वाक्य में इधर-उधर नहीं हो सकता, और क्रिया के बाद रखा *I go usually to bed* ग़लत है।'
  en.a1.unit16.lesson03.teach.then:
