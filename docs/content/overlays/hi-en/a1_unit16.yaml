  en.a1.unit16.lesson01.teach.go_to_bed:
    title: Go to bed
    gloss: सोने जाना
    note: '*go to bed* का मतलब सोने के लिए बिस्तर पर जाना है। यहाँ भी *bed* से पहले article नहीं आता।'
