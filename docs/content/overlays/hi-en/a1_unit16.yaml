    gloss: काम पर जाना
    note: '*go to work* का मतलब काम पर जाना है। इस पक्के वाक्यांश में *work* से पहले article नहीं आता।'
  en.a1.unit16.lesson01.teach.have_dinner:
    title: Have dinner
    gloss: रात का खाना खाना
