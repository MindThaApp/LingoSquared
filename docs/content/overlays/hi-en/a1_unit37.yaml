    note: '*invite someone to* का मतलब है किसी को किसी आयोजन में बुलाना।'
    example_gloss: मैं अपने सहकर्मियों को अपने जन्मदिन की पार्टी में बुलाता हूँ।
  en.a1.unit37.lesson02.teach.congratulate_someone_on:
    title: congratulate someone on
    gloss: किसी को ... पर बधाई देना
    note: '*congratulate someone* के बाद हमेशा पूर्वसर्ग *on* लगता है, *with* या *for* नहीं। हिंदी में ''नौकरी की बधाई'' या ''नौकरी पर बधाई'' कहते हैं, इसलिए इसे शब्द-दर-शब्द मत बदलिए; पूरा रूप *congratulate someone on* याद कीजिए।'
    example_gloss: हम उसे उसकी तरक़्क़ी पर बधाई देते हैं।
