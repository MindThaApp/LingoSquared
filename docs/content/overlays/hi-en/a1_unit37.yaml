  en.a1.unit37.lesson03.teach.dialogue_line1:
    title: लैला का सवाल
    gloss: 'लैला पूछती है: क्या तुम्हें पता है कि डैनियल का जन्मदिन 12 अक्टूबर को है?'
    note: '*Did you know ...?* नई जानकारी के साथ बातचीत शुरू करने का एक स्वाभाविक तरीक़ा है।'
  en.a1.unit37.lesson03.teach.dialogue_line2:
    title: मिया की प्रतिक्रिया
    gloss: 'मिया कहती है: नहीं, मुझे नहीं पता था! वह तो अगले शुक्रवार है।'
    note: '*No, I didn''t!* *Did you know ...?* वाले प्रश्न का छोटा नकारात्मक जवाब है: ''नहीं, मुझे नहीं पता था।'''
  en.a1.unit37.lesson03.teach.dialogue_line3:
    title: लैला का सुझाव
    gloss: 'लैला कहती है: चलो ऑफ़िस में उसके लिए सरप्राइज़ पार्टी रखते हैं।'
    note: '*Let''s* + क्रिया से आप सुझाव देते हैं, जैसे हिंदी में ''चलो ...'' या ''आओ ...'' से।'
  en.a1.unit37.lesson03.teach.dialogue_line4:
    title: मिया की प्रतिक्रिया
    gloss: 'मिया कहती है: बढ़िया विचार है! मैं बाक़ी टीम को बुला सकती हूँ।'
    note: '*the rest of the team* का मतलब है टीम के बाक़ी लोग।'
  en.a1.unit37.lesson03.teach.dialogue_line5:
    title: Leila's plan
    gloss: 'लैला कहती है: बिल्कुल। मैं उसके लिए एक तोहफ़ा ख़रीदूँगी, शायद नए दौड़ने के जूते, क्योंकि उसे दौड़ना बहुत पसंद है।'
    note: '*since* का मतलब यहाँ ''क्योंकि'' (कारण) है, ''तब से'' (समय) नहीं।'
  en.a1.unit37.lesson03.teach.dialogue_line6:
    title: मिया का सुझाव
    gloss: 'मिया कहती है: यह अच्छा विचार है। क्या हमें केक भी लेना चाहिए?'
    note: '*Should we ...?* से आप मिलकर कोई फ़ैसला करने के लिए पूछते हैं।'
  en.a1.unit37.lesson03.teach.dialogue_line7:
    title: "लैला का जवाब"
    gloss: 'लैला कहती है: हाँ, बिल्कुल! हम सब मिलकर उसे जन्मदिन की शुभकामनाएँ देंगे।'
    note: '*We''ll all wish him a happy birthday* का मतलब है: हम सब उसे जन्मदिन की शुभकामनाएँ देंगे।'
  en.a1.unit37.lesson04.teach.reading_passage:
    title: सरप्राइज़ पार्टी के बारे में पाठ
    gloss: डैनियल को नहीं पता था कि लैला और मिया उसके लिए सरप्राइज़ पार्टी की योजना बना रही हैं। 12 अक्टूबर को, उसके जन्मदिन पर, वह काम पर पहुँचा तो उसे ब्रेक रूम में गुब्बारे और एक केक मिला। सबने उसे जन्मदिन की शुभकामनाएँ दीं। लैला ने उसे दौड़ने के नए जूतों की जोड़ी दी। मिया ने उसे तीनों सहकर्मियों की साथ वाली एक फ़्रेम की हुई तस्वीर दी, जो उसने खुद खींची थी। डैनियल बहुत ख़ुश हुआ और उसने इस शानदार सरप्राइज़ के लिए सबको धन्यवाद दिया।
    note: '*he arrived at work and found*: *arrive* और *find* का भूतकाल (वह काम पर पहुँचा और उसे मिला ...)।'
