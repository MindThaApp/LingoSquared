    note: '*I would prefer a replacement, if that''s possible* विनम्रता से अपनी पसंद बताता है।'
  en.b1.unit15.lesson04.teach.a_resolve_send_friday:
    title: Der Mitarbeiter bestätigt die Lösung
    gloss: 'एजेंट कहता है: ज़रूर। हम इसे सुलझा देंगे और शुक्रवार तक नई कुर्सी भेज देंगे।'
    note: '*we''ll resolve this and send... by Friday* तारीख़ के साथ किया गया पक्का वादा है।'
