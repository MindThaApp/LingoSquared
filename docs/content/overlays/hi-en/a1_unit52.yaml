  en.a1.unit52.lesson03.teach.dialogue_line1:
    title: हेयरड्रेसर नमस्ते कहता है
    gloss: 'हेयरड्रेसर कहता है: नमस्ते, आज मैं आपकी क्या मदद करूँ?'
    note: '*How can I help you today?* का मतलब है "आज मैं आपकी क्या मदद करूँ?"'
  en.a1.unit52.lesson03.teach.dialogue_line2:
    title: डैनियल की माँग
    gloss: 'डैनियल कहता है: मुझे बाल कटवाने हैं, कृपया। मेरी बहन अगले हफ़्ते आ रही है।'
    note: '*I''d like a haircut* में संज्ञा *haircut* आती है, यानी "मुझे बाल कटवाने हैं"; हिंदी में यहाँ क्रिया "कटवाना" इस्तेमाल होती है।'
  en.a1.unit52.lesson03.teach.dialogue_line3:
    title: "नाई पूछता है"
    gloss: 'हेयरड्रेसर पूछता है: ज़रूर, कौन-सा स्टाइल चाहिए?'
    note: '*what style do you want* का मतलब है "कौन-सा स्टाइल चाहिए"।'
  en.a1.unit52.lesson03.teach.dialogue_line4:
    title: डैनियल की पसंद
    gloss: 'डैनियल कहता है: वही स्टाइल, बस थोड़ा और छोटा।'
    note: '*just a little shorter* का मतलब है "बस थोड़ा और छोटा"।'
  en.a1.unit52.lesson03.teach.dialogue_line5:
    title: मिया का सवाल
    gloss: 'मिया पूछती है: क्या आप पहले इसके बाल धो सकते हैं?'
    note: '*Can you wash his hair first?* का मतलब है "क्या आप पहले इसके बाल धो सकते हैं?"'
  en.a1.unit52.lesson03.teach.dialogue_line6:
    title: हेयरड्रेसर हाँ कहता है
    gloss: 'हेयरड्रेसर कहता है: बिल्कुल, और वह हेयरकट की क़ीमत में ही शामिल है।'
    note: '*included with* का मतलब है "... में शामिल"।'
  en.a1.unit52.lesson03.teach.dialogue_line7:
    title: क़ीमत के बारे में डैनियल का सवाल
    gloss: 'डैनियल पूछता है: बढ़िया। इसके कितने पैसे हुए?'
    note: यहाँ *Great.* का मतलब है "बढ़िया" या "शानदार"; यह छोटे जवाब के तौर पर कहा जाता है।
  en.a1.unit52.lesson03.teach.dialogue_line8:
    title: क़ीमत
    gloss: 'हेयरड्रेसर कहता है: बीस डॉलर।'
    note: यह वही वाक्य है जो पहले सीखा था।
  en.a1.unit52.lesson04.teach.reading_passage:
    title: नाई की दुकान की यात्रा पर पाठ
    gloss: 'नाई की दुकान की एक यात्रा: डैनियल की बहन अगले हफ़्ते शिकागो से मिलने आ रही थी, इसलिए उसने बाल कटवाने का फ़ैसला किया। मिया ने अपने अपार्टमेंट के पास एक छोटे सैलून में अपने पसंदीदा हेयरड्रेसर का नाम सुझाया और उसके साथ गई। हेयरड्रेसर ने पूछा कि उसे कौन-सा स्टाइल चाहिए, और उसने कहा वही स्टाइल, बस थोड़ा और छोटा। उसने पहले उसके बाल धोए, और धुलाई हेयरकट की क़ीमत में शामिल थी। हेयरकट के बीस डॉलर लगे। काम पूरा होने पर मिया ने कहा कि उसके बाल बहुत अच्छे लग रहे हैं। घर लौटते समय वे लैला से कॉफ़ी पर मिले। वह अपनी सर्दी के बाद काफ़ी ठीक महसूस कर रही थी, और उसे भी डैनियल का नया हेयरकट बहुत पसंद आया।'
    note: '*looked great* का मतलब है "बहुत अच्छे लग रहे थे"।'
