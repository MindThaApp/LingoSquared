  en.a1.unit43.lesson01.teach.white:
    title: white
    gloss: सफ़ेद
    note: '*white* का मतलब है सफ़ेद।'
    example_gloss: उसकी शर्ट सफ़ेद है।
  en.a1.unit43.lesson02.teach.dark_blue:
    title: dark blue
    gloss: गहरा नीला
    note: '*dark blue* अंग्रेज़ी में दो अलग शब्दों में लिखा जाता है, पहले रंग की गहराई बताने वाला शब्द, फिर रंग -- हिंदी के "गहरा नीला" जैसा ही।'
    example_gloss: उसने गहरे नीले रंग की कमीज़ पहनी है।
  en.a1.unit43.lesson02.teach.light_green:
    title: light green
    gloss: हल्का हरा
    note: '*light green* भी *dark blue* की तरह दो अलग शब्दों में लिखा जाता है -- हिंदी के "हल्का हरा" जैसा ही।'
    example_gloss: उसने अपने शयनकक्ष को हल्के हरे रंग से रंगा।
  en.a1.unit43.lesson02.teach.goes_well_with:
    title: goes well with
    gloss: के साथ अच्छा लगता है
    note: '*goes well with* का मतलब है कि दो रंग या कपड़े एक-दूसरे के साथ अच्छे लगते हैं।'
    example_gloss: यह नीली कमीज़ काली पैंट के साथ अच्छी लगती है।
  en.a1.unit43.lesson02.teach.too_bright:
    title: too bright
    gloss: बहुत चटकीला
    note: '*too bright* का मतलब है बहुत चटकीला या बहुत भड़कीला।'
    example_gloss: पीला एक मज़ेदार रंग है, पर काम के लिए बहुत चटकीला है।
  en.a1.unit43.lesson02.teach.whats_your_favorite_color:
    title: What's your favorite color?
    gloss: आपका पसंदीदा रंग कौन-सा है?
    note: '*What''s your favorite ...?* किसी की पसंद पूछता है।'
  en.a1.unit43.lesson02.teach.my_favorite_color_is:
    title: My favorite color is blue.
    gloss: मेरा पसंदीदा रंग नीला है।
    note: '*My favorite ... is ...* अपनी पसंद बताने का आम तरीका है।'
  en.a1.unit43.lesson03.teach.dialogue_line1:
    title: डैनियल का सवाल
    gloss: 'डैनियल पूछता है: मुझे अगले हफ़्ते हमारी प्रेज़ेंटेशन के लिए एक नई कमीज़ चाहिए। क्या आप रंग चुनने में मेरी मदद करेंगी?'
    note: '*Can you help me* + क्रिया*?* मदद माँगता है।'
  en.a1.unit43.lesson03.teach.dialogue_line2:
    title: मिया का सवाल
    gloss: 'मिया कहती है: ज़रूर! आपको कौन-से रंग पसंद हैं?'
    note: '*What colors do you like?* रंगों की पसंद पूछता है।'
  en.a1.unit43.lesson03.teach.dialogue_line3:
    title: "डैनियल का जवाब"
    gloss: 'डैनियल कहता है: मुझे नीला और हरा पसंद हैं, पर मुझे पक्का नहीं पता कि कौन-सा पेशेवर लगेगा।'
    note: '*I''m not sure what looks professional* का मतलब है: मुझे पक्का नहीं पता कि कौन-सा पेशेवर लगता है।'
  en.a1.unit43.lesson03.teach.dialogue_line4:
    title: मिया की सलाह
    gloss: 'मिया कहती है: गहरा नीला बढ़िया चुनाव है। यह पेशेवर लगता है, और काली पैंट के साथ अच्छा लगता है।'
    note: '*It looks professional* का मतलब है: यह पेशेवर लगता है।'
  en.a1.unit43.lesson03.teach.dialogue_line5:
    title: डैनियल का सवाल
    gloss: 'डैनियल पूछता है: और यह पीली वाली?'
    note: '*What about ...?* एक दूसरा विकल्प सुझाता है।'
  en.a1.unit43.lesson03.teach.dialogue_line6:
    title: मिया की सलाह
    gloss: 'मिया कहती है: पीला एक मज़ेदार रंग है, पर प्रेज़ेंटेशन के लिए बहुत चटकीला है। मैं गहरे नीले रंग की कमीज़ चुनूँगी।'
    note: '*I''d choose* का मतलब है: मैं चुनूँगी/चुनूँगा।'
  en.a1.unit43.lesson03.teach.dialogue_line7:
    title: डैनियल का फ़ैसला
    gloss: 'डैनियल कहता है: शुक्रिया, मिया। तो गहरा नीला ही सही!'
    note: '*Dark blue it is!* फ़ैसला पक्का करने का एक अनौपचारिक तरीका है।'
  en.a1.unit43.lesson04.teach.reading_passage:
    title: तीन पसंदीदा रंगों के बारे में पाठ
    gloss: डैनियल, लैला और मिया तीनों का पसंदीदा रंग अलग-अलग है। डैनियल का पसंदीदा रंग नीला है। वह कहता है कि यह एक शांत रंग है, और वह काम पर जो कुछ भी पहनता है, लगभग सबके साथ अच्छा लगता है। लैला का पसंदीदा रंग हरा है, उन पौधों और बगीचों का रंग जिनकी चित्रकारी उसे बहुत पसंद है। उसे हल्का हरा खास तौर पर सुंदर लगता है। मिया का पसंदीदा रंग पीला है, क्योंकि यह उसे सूरज की याद दिलाता है और हमेशा उसे खुश कर देता है। भले ही तीनों को अलग-अलग रंग पसंद हैं, वे इस बात पर सहमत हैं कि रंग हर दिन को ज़्यादा मज़ेदार बना देते हैं।
    note: '*reminds her of the sun* का मतलब है: उसे सूरज की याद दिलाता है।'
