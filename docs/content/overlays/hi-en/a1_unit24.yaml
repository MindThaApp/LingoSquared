  en.a1.unit24.lesson01.teach.kitchen:
    title: kitchen
    gloss: रसोई
    note: '*kitchen* का मतलब रसोई है। उच्चारण *KITCH-en* है; *t* अलग से नहीं बोला जाता।'
    example_gloss: रसोई बैठक के बगल में है।
  en.a1.unit24.lesson01.teach.bathroom:
    title: bathroom
    gloss: स्नानघर
    note: '*bathroom* का मतलब स्नानघर है। अमेरिका में यह शौचालय के लिए भी आम शब्द है।'
    example_gloss: स्नानघर में शावर है।
  en.a1.unit24.lesson01.teach.living_room:
    title: living room
    gloss: बैठक
    note: '*living room* का मतलब बैठक (बैठक का कमरा) है। यह दो अलग शब्द हैं।'
    example_gloss: हम बैठक में टीवी देखते हैं।
  en.a1.unit24.lesson01.teach.garden:
    title: garden
    gloss: बग़ीचा
    note: '*garden* का मतलब बग़ीचा है। अमेरिका में घर के पीछे के बग़ीचे के लिए अक्सर *yard* भी कहते हैं।'
    example_gloss: बग़ीचा नहीं है, पर बालकनी है।
  en.a1.unit24.lesson01.teach.the_kitchen_is_a_room:
    title: This is the kitchen.
    gloss: यह रसोई है।
    note: '*This is ...* से आप किसी चीज़ की ओर इशारा करते हैं। *the* किसी ख़ास चीज़ के लिए आता है: इस घर की रसोई।'
