    title: How many rooms are there?
    gloss: कितने कमरे हैं?
    note: '*How many...are there?* से आप गिनती पूछते हैं। *many* गिनी जा सकने वाली चीज़ों के बहुवचन के साथ आता है; *are* इसलिए है कि *rooms* बहुवचन है।'
  en.a1.unit24.lesson02.teach.there_is_a_kitchen:
    title: There's a small kitchen.
    gloss: एक छोटी रसोई है।
    note: '*There''s...* (*there is*) से आप बताते हैं कि कहीं कुछ मौजूद है। यह हिंदी के "... है" जैसा है, पर अंग्रेज़ी में *there is* ज़रूरी है; एक से ज़्यादा चीज़ों के लिए *there are* कहते हैं।'
