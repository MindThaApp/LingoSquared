    note: '*bedroom* का मतलब शयनकक्ष (सोने का कमरा) है। यह *bed* (बिस्तर) और *room* (कमरा) से बना है, पर अंग्रेज़ी में इसे अलग-अलग उच्चारित और बल देकर बोला जाता है।'
