  en.a2.unit35.lesson01.teach.pharmacist:
    title: pharmacist
    gloss: फ़ार्मासिस्ट (दवा देने वाला)
    note: '*pharmacist* वह व्यक्ति है जो आपको दवाइयाँ देता है।'
    example_gloss: फ़ार्मासिस्ट ने मुझे समझाया कि दवा कैसे लेनी है।
  en.a2.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: गोली
    note: '*tablet* दवा का एक ठोस टुकड़ा है जिसे निगला जाता है।'
    example_gloss: मैं सुबह एक गोली लेता हूँ और शाम को एक और।
  en.a2.unit35.lesson01.teach.dose:
    title: dose
    gloss: खुराक
    note: '*dose* दवा की वह मात्रा है जो एक बार में ली जाती है।'
    example_gloss: खुराक है एक गोली, दिन में दो बार।
  en.a2.unit35.lesson01.teach.refill:
    title: refill
    gloss: दवा दोबारा लेना (रीफ़िल)
    note: '*refill* उसी दवा का नया पैकेट है, जिसके लिए दोबारा डॉक्टर के पास नहीं जाना पड़ता।'
    example_gloss: मुझे दवा दोबारा चाहिए, क्योंकि मेरी गोलियाँ लगभग ख़त्म हो गई हैं।
  en.a2.unit35.lesson01.teach.side_effects:
    title: side effects
    gloss: साइड इफ़ेक्ट (दवा के दुष्प्रभाव)
    note: '*side effects* वे अतिरिक्त असर हैं जो कोई दवा शरीर पर डाल सकती है।'
    example_gloss: फ़ार्मासिस्ट ने मुझे इस दवा के साइड इफ़ेक्ट बताए।
  en.a2.unit35.lesson01.teach.grammar_frequency:
    title: कहना कि दवा कितनी बार लेनी है
    gloss: दिन में एक बार, दिन में दो बार, दिन में तीन बार, हर आठ घंटे में
    note: '*once a day* = दिन में एक बार, *twice a day* = दिन में दो बार, *three times a day* = दिन में तीन बार, *every eight hours* = हर आठ घंटे में।'
  en.a2.unit35.lesson02.teach.pick_up_prescription:
    title: कहना कि आप काउंटर पर क्यों खड़े हैं
    gloss: मुझे दवा का पर्चा लेना है।
    note: '*I''d like to...* बताने का विनम्र और आम तरीका है कि आप क्या चाहते हैं।'
  en.a2.unit35.lesson02.teach.take_one_tablet:
    title: सुनने को मिलने वाली खुराक
    gloss: खाने के साथ दिन में दो बार एक गोली लीजिए।
    note: '*with food* का मतलब है खाने के साथ, यानी खाली पेट नहीं।'
  en.a2.unit35.lesson02.teach.ask_how_many_days:
    title: पूछना कि इसे कितने समय तक लेना है
    gloss: मुझे इसे कितने दिन लेना चाहिए?
    note: '*How many...?* गिनी जा सकने वाली चीज़ों, जैसे दिनों, के लिए इस्तेमाल होता है।'
  en.a2.unit35.lesson02.teach.ask_side_effects:
    title: साइड इफ़ेक्ट के बारे में पूछना
    gloss: क्या कोई साइड इफ़ेक्ट हैं?
    note: '*Are there any...?* पूछने का आम तरीका है कि कुछ है या नहीं।'
  en.a2.unit35.lesson02.teach.grammar_should:
    title: निर्देशों के लिए should और shouldn't
    gloss: आपको इसे खाने के साथ लेना चाहिए। आपको इसे बीच में नहीं छोड़ना चाहिए।
    note: '*should* सलाह या हिदायत देता है; *shouldn''t* उसका नकारात्मक रूप है।'
  en.a2.unit35.lesson03.teach.before_bed:
    title: before bed
    gloss: सोने से पहले
    note: '*before bed* का मतलब है सोने जाने से पहले।'
    example_gloss: कुछ दवाइयाँ सोने से पहले लेने पर ज़्यादा असर करती हैं।
  en.a2.unit35.lesson03.teach.label_text:
    title: दवा का लेबल
    gloss: 'सर्दी-ज़ुकाम की दवा। पाँच दिन तक, खाने के साथ दिन में दो बार एक गोली लें। गोलियाँ बीच में बंद न करें। संभावित साइड इफ़ेक्ट: आपको थकान महसूस हो सकती है। रीफ़िल: एक।'
    note: 'दवा का लेबल छोटा और सीधा होता है: छोटे वाक्य और विनम्रता के शब्द नहीं।'
  en.a2.unit35.lesson03.teach.do_not_stop_early:
    title: लेबल पर चेतावनी
    gloss: गोलियाँ बीच में बंद न करें।
    note: '*Do not...* मनाही का आदेश है, जैसा लेबल और बोर्ड पर दिखता है।'
  en.a2.unit35.lesson04.teach.q_pick_up:
    title: डैनियल काउंटर पर आता है
    gloss: 'डैनियल कहता है: नमस्ते, मुझे दवा का पर्चा लेना है।'
    note: '*Hi* *Hello* से ज़्यादा अनौपचारिक है, पर काउंटर पर बिल्कुल आम है।'
  en.a2.unit35.lesson04.teach.a_what_is_your_name:
    title: फ़ार्मासिस्ट नाम पूछता है
    gloss: 'फ़ार्मासिस्ट कहता है: ज़रूर। आपका नाम क्या है?'
    note: 'यहाँ *Of course* का मतलब है: ज़रूर, कोई बात नहीं।'
  en.a2.unit35.lesson04.teach.q_doctor_gave_me_medicine:
    title: डैनियल दवा की वजह बताता है
    gloss: 'डैनियल कहता है: डैनियल। डॉक्टर ने मुझे बहुत बुरे ज़ुकाम की दवा दी है।'
    note: 'यह इकाई 28 के डॉक्टर के पास जाने वाली बात से जुड़ा है: वही ज़ुकाम।'
  en.a2.unit35.lesson04.teach.a_here_it_is:
    title: फ़ार्मासिस्ट खुराक बताता है
    gloss: 'फ़ार्मासिस्ट कहता है: यह लीजिए। खाने के साथ दिन में दो बार एक गोली लीजिए।'
    note: '*Here it is* तब कहते हैं जब आप किसी को कुछ थमाते हैं।'
  en.a2.unit35.lesson04.teach.q_how_many_days:
    title: डैनियल पूछता है कि कितनी देर
    gloss: 'डैनियल पूछता है: मुझे इसे कितने दिन लेना चाहिए?'
    note: वही सवाल जो पाठ 2 में था।
  en.a2.unit35.lesson04.teach.a_five_days_no_stopping:
    title: फ़ार्मासिस्ट का जवाब
    gloss: 'फ़ार्मासिस्ट कहता है: पाँच दिन तक। गोलियाँ बीच में बंद मत कीजिए।'
    note: वही हिदायत जो पाठ 3 के लेबल पर थी।
  en.a2.unit35.lesson04.teach.q_any_side_effects:
    title: डैनियल साइड इफ़ेक्ट के बारे में पूछता है
    gloss: 'डैनियल पूछता है: क्या कोई साइड इफ़ेक्ट हैं?'
    note: वही सवाल जो पाठ 2 में था।
  en.a2.unit35.lesson04.teach.a_you_may_feel_tired:
    title: फ़ार्मासिस्ट साइड इफ़ेक्ट बताता है
    gloss: 'फ़ार्मासिस्ट कहता है: आपको थकान महसूस हो सकती है, बस इतना ही।'
    note: 'यहाँ *but that''s all* का मतलब है: पर बस इतना ही।'
  en.a2.unit35.lesson04.teach.q_thank_you:
    title: डैनियल फ़ार्मासिस्ट को धन्यवाद देता है
    gloss: 'डैनियल कहता है: बहुत-बहुत शुक्रिया।'
    note: '*very much* शुक्रिया को और ज़ोरदार बना देता है।'
