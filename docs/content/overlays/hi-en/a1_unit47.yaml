  en.a1.unit47.lesson01.teach.appointment:
    title: appointment
    gloss: अपॉइंटमेंट / मिलने का समय
    note: '*appointment* का मतलब है अपॉइंटमेंट, यानी पहले से तय किया हुआ मिलने का समय।'
