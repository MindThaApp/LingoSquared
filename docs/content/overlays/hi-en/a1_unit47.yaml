  en.a1.unit47.lesson01.teach.book:
    title: book
    gloss: बुक करना
    note: '*book* का मतलब यहाँ बुक करना या समय तय कराना है, संज्ञा "किताब" नहीं।'
    example_gloss: मैं एक अपॉइंटमेंट बुक करना चाहता हूँ।
  en.a1.unit47.lesson01.teach.confirm:
    title: confirm
    gloss: पक्का करना
    note: '*confirm* का मतलब है पक्का करना या पुष्टि करना।'
    example_gloss: क्या आप समय पक्का कर सकते हैं?
  en.a1.unit47.lesson01.teach.reschedule:
    title: reschedule
    gloss: समय बदलना
    note: '*reschedule* का मतलब है किसी तय अपॉइंटमेंट का समय किसी और समय पर बदलना।'
    example_gloss: क्या हम इसे शुक्रवार के लिए बदल सकते हैं?
  en.a1.unit47.lesson02.teach.id_like_to_make_an_appointment:
    title: I'd like to make an appointment.
    gloss: मैं एक अपॉइंटमेंट लेना चाहूँगा।
    note: '*I''d* *I would* का संक्षिप्त रूप है। यह "मैं ... चाहूँगा" जैसी विनम्र बात कहता है, जैसे हिंदी में "मैं अपॉइंटमेंट लेना चाहूँगा"।'
  en.a1.unit47.lesson02.teach.are_you_available_on_friday:
    title: Are you available on Friday?
    gloss: क्या आप शुक्रवार को उपलब्ध हैं?
    note: 'हफ़्ते के किसी दिन के साथ अंग्रेज़ी में हमेशा *on* लगता है: *on Friday*। हिंदी में इसके लिए "को" लगाते हैं।'
  en.a1.unit47.lesson02.teach.what_time_works_for_you:
    title: What time works for you?
    gloss: आपको कौन-सा समय ठीक रहेगा?
    note: यहाँ *works for you* का मतलब है "आपके लिए ठीक रहता है"। यह पक्का मुहावरा है, इसमें "काम करना" शब्दशः नहीं है।
  en.a1.unit47.lesson02.teach.that_time_works_for_me:
    title: That time works for me.
    gloss: वह समय मेरे लिए ठीक है।
    note: '*That time works for me.* का मतलब है "वह समय मेरे लिए ठीक है।"'
  en.a1.unit47.lesson02.teach.can_we_reschedule_for_monday:
    title: Can we reschedule for Monday?
    gloss: क्या हम इसे सोमवार के लिए बदल सकते हैं?
    note: '*reschedule for ...* में नई तारीख़ या दिन बताने के लिए *for* सबसे सामान्य है; *to* भी प्रयोग होता है।'
  en.a1.unit47.lesson02.teach.your_appointment_is_confirmed:
    title: Your appointment is confirmed.
    gloss: आपका अपॉइंटमेंट पक्का हो गया है।
    note: '*Your appointment is confirmed.* का मतलब है "आपका अपॉइंटमेंट पक्का हो गया है।"'
  en.a1.unit47.lesson03.teach.dialogue_line1:
    title: मिया का सवाल
    gloss: 'मिया पूछती है: लैला, मैक्स ठीक तो है? वह आजकल थोड़ा थका हुआ लगता है।'
    note: '*He seems a little tired lately.* का मतलब है "वह आजकल थोड़ा थका हुआ लगता है।"'
  en.a1.unit47.lesson03.teach.dialogue_line2:
    title: लैला का जवाब
    gloss: 'लैला कहती है: वह ठीक है, चिंता मत करो। बस उसकी सालाना जाँच का समय हो गया है। मुझे पशु-चिकित्सक को फ़ोन करना चाहिए।'
    note: '*due for* का मतलब है "किसी चीज़ का समय आ गया है", जैसे नियमित जाँच का।'
  en.a1.unit47.lesson03.teach.dialogue_line3:
    title: लैला पशु-चिकित्सक को फ़ोन करती है
    gloss: 'लैला कहती है: नमस्ते, मैं अपने कुत्ते की जाँच के लिए अपॉइंटमेंट लेना चाहूँगी।'
    note: '*I''d like to* कहना *I want to* से ज़्यादा विनम्र है। हिंदी में भी "मैं चाहूँगी" कहना "मैं चाहती हूँ" से नरम लगता है।'
  en.a1.unit47.lesson03.teach.dialogue_line4:
    title: मिया का सवाल
    gloss: 'मिया पूछती है: उन्होंने क्या कहा?'
    note: '*did they say* में भूतकाल बनाने के लिए सहायक क्रिया *did* आती है।'
  en.a1.unit47.lesson03.teach.dialogue_line5:
    title: "लैला का जवाब"
    gloss: 'लैला कहती है: वे गुरुवार को दोपहर तीन बजे उपलब्ध हैं।'
    note: 'किसी ख़ास समय के लिए *at* लगता है: *at 3pm*।'
  en.a1.unit47.lesson03.teach.dialogue_line6:
    title: मिया का पुष्टि वाला सवाल
    gloss: 'मिया पूछती है: क्या वह समय तुम्हारे लिए ठीक है?'
    note: '*Does that time work for you?* *that time works for you* का सवाल वाला रूप है, जिसमें पहले की तरह सहायक क्रिया *does* आती है।'
  en.a1.unit47.lesson03.teach.dialogue_line7:
    title: लैला की पुष्टि
    gloss: 'लैला कहती है: हाँ, यह मेरे लिए ठीक है। गुरुवार को तीन बजे -- धन्यवाद! मैक्स का अपॉइंटमेंट पक्का हो गया है।'
    note: '*Max''s appointment* में संबंध बताने के लिए *''s* लगता है, जैसे हिंदी में "मैक्स का अपॉइंटमेंट" में "का"।'
  en.a1.unit47.lesson04.teach.reading_passage:
    title: अपॉइंटमेंट लेने के बारे में पाठ
    gloss: 'अपॉइंटमेंट कैसे लें: अगर आपको डॉक्टर, दंत-चिकित्सक या किसी और सेवा के पास जाना हो, तो आम तौर पर पहले अपॉइंटमेंट लेना पड़ता है। फ़ोन कीजिए और कहिए कि आप अपॉइंटमेंट लेना चाहेंगे। रिसेप्शनिस्ट आपको बताएगा कि कौन-से दिन और समय उपलब्ध हैं। अपने लिए ठीक रहने वाला समय चुनिए, और वे आपका अपॉइंटमेंट पक्का कर देंगे। अगर कुछ बदल जाए, तो दोबारा फ़ोन कीजिए और समय बदलने के लिए कहिए। पिछले हफ़्ते लैला ने अपने कुत्ते मैक्स की सालाना जाँच के लिए पशु-चिकित्सक को फ़ोन करके अपॉइंटमेंट लिया। वे गुरुवार को दोपहर तीन बजे उपलब्ध थे, और लैला ने समय पक्का कर दिया। डैनियल का भी अपॉइंटमेंट है -- वह सोमवार सुबह जाँच के लिए दंत-चिकित्सक के पास जा रहा है। उसने कहा कि वह घबराया हुआ नहीं है, बस इस हफ़्ते थोड़ा व्यस्त है।'
    note: '*a little busy this week* का मतलब है "इस हफ़्ते थोड़ा व्यस्त"।'
