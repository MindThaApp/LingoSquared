  en.b1.unit12.lesson03.teach.reading_passage:
    title: 'पाठ: कहाँ काम करना है'
    gloss: मिया और लैला इस बात पर एकमत नहीं हैं कि काम कहाँ किया जाए। मिया घर से काम करती है, क्योंकि वहाँ आराम है। हालाँकि उसे अपने साथियों से मिलना याद आता है, फिर भी घर पर वह ज़्यादा काम निपटा लेती है। लैला को दफ़्तर पसंद है। शोर के बावजूद उसे ब्रेक में साथियों से बात करना अच्छा लगता है। भले ही मिया ध्यान लगाने के बारे में सही बात कहती है, फिर भी लैला को लगता है कि दफ़्तर में टीमवर्क बेहतर बनता है। फिर भी दोनों मानती हैं कि लचीलापन ज़रूरी है।
    note: विरोध वाली बातों पर एक छोटा पाठ।
  en.b1.unit12.lesson04.teach.q_although_nice_home:
    title: मिया विरोधाभास रखती है
    gloss: 'मिया कहती है: लैला, हालाँकि दफ़्तर अच्छा है, फिर भी घर पर मैं ज़्यादा काम निपटा लेती हूँ।'
    note: वाक्य की शुरुआत में *although* + पूरा उपवाक्य।
  en.b1.unit12.lesson04.teach.a_despite_noise_breaks:
    title: लैला अपना नज़रिया बताती है
    gloss: 'लैला कहती है: मैं समझती हूँ, लेकिन शोर के बावजूद मुझे ब्रेक में लोगों से बात करना सचमुच अच्छा लगता है।'
    note: '*despite* + संज्ञा (*the noise*)।'
  en.b1.unit12.lesson04.teach.q_valid_point_however:
    title: मिया बात मानती है, पर अपनी राय पर कायम रहती है
    gloss: 'मिया कहती है: यह सही बात है। फिर भी मुझे लगता है कि मैं अकेले बेहतर ध्यान लगा पाती हूँ।'
    note: यहाँ *however* पूर्ण विराम के बाद नया वाक्य शुरू करता है।
