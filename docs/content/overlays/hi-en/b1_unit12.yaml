  en.b1.unit12.lesson02.teach.grammar_concession:
    title: although, despite और however
    gloss: 'Although और even though के बाद पूरा उपवाक्य आता है: Although the office is quiet, Mia prefers home. Despite के बाद संज्ञा या -ing रूप आता है, उपवाक्य नहीं: Despite the distractions, Daniel finishes his report. However पूर्ण विराम या सेमिकोलन के बाद नया वाक्य शुरू करता है: The office is quiet. However, Mia prefers home.'
    note: 'बनावट: *although/even though* + उपवाक्य; *despite* + संज्ञा/-ing रूप; *however* पूर्ण विराम के बाद वाक्य की शुरुआत में।'
  en.b1.unit12.lesson03.teach.flexibility:
