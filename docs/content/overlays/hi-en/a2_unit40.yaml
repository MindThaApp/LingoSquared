    gloss: आपके संदेश के लिए धन्यवाद। हमें खेद है कि आपका लैंप टूटा हुआ पहुँचा। कृपया लैंप को वापस डिब्बे में रखें और डाकघर ले जाएँ। तीन कामकाजी दिनों के अंदर नया लैंप भेज दिया जाएगा। ऑर्डर नंबर 8154।
    note: 'कस्टमर सर्विस के जवाब में हमेशा ये बातें होती हैं: समस्या, आपको क्या करना है और दुकान क्या करेगी।'
