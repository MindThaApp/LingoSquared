teaching:
  en.a1.unit46.lesson01.teach.lost:
    title: lost
    gloss: खो गया / गुम
    note: '*lost* का मतलब है खो दिया या गुम हो गया। हिंदी में हम "मेरा बटुआ खो गया" कहते हैं, पर अंग्रेज़ी में कर्ता खुद क्रिया करता है: *I lost my wallet.* यानी "मैंने अपना बटुआ खो दिया"।'
    example_gloss: मेरा बटुआ खो गया।
  en.a1.unit46.lesson01.teach.found:
    title: found
    gloss: मिल गया
    note: '*found* *find* का भूतकाल है: *I found your keys* का मतलब है "मुझे तुम्हारी चाबियाँ मिल गईं"।'
    example_gloss: मुझे तुम्हारी चाबियाँ मिल गईं!
  en.a1.unit46.lesson01.teach.keys:
    title: keys
    gloss: चाबियाँ
    note: '*keys* का मतलब है चाबियाँ।'
    example_gloss: ये मेरी चाबियाँ हैं।
  en.a1.unit46.lesson01.teach.wallet:
    title: wallet
    gloss: बटुआ
    note: '*wallet* का मतलब है बटुआ।'
    example_gloss: क्या यह तुम्हारा बटुआ है?
  en.a1.unit46.lesson01.teach.backpack:
    title: backpack
    gloss: बैकपैक
    note: '*backpack* का मतलब है बैकपैक, यानी पीठ पर टाँगने वाला बैग।'
    example_gloss: मेरा बैकपैक काला है।
  en.a1.unit46.lesson02.teach.i_lost_my_wallet:
    title: I lost my wallet.
    gloss: मेरा बटुआ खो गया।
    note: शब्दशः यह "मैंने अपना बटुआ खो दिया" है, पर हिंदी में हम आम तौर पर कहते हैं "मेरा बटुआ खो गया"। अंग्रेज़ी में हमेशा *I lost* ही कहा जाता है।
  en.a1.unit46.lesson02.teach.have_you_seen_my_keys:
    title: Have you seen my keys?
    gloss: क्या तुमने मेरी चाबियाँ देखी हैं?
    note: '*Have you seen ...?* का मतलब है "क्या तुमने ... देखा है?" यहाँ *have* सहायक क्रिया है, जो वाक्य की शुरुआत में आती है।'
  en.a1.unit46.lesson02.teach.has_anyone_found_a_backpack:
    title: Has anyone found a backpack?
    gloss: क्या किसी को बैकपैक मिला है?
    note: '*Has anyone found ...?* का मतलब है "क्या किसी को ... मिला है?"'
  en.a1.unit46.lesson02.teach.its_black_with_a_red_strap:
    title: It's black with a red strap.
    gloss: वह काला है और उसका पट्टा लाल है।
    note: '*It''s black with a red strap.* का मतलब है "वह काला है और उसका पट्टा लाल है।"'
  en.a1.unit46.lesson02.teach.wheres_the_lost_and_found:
    title: Where's the lost and found?
    gloss: खोया-पाया कहाँ है?
    note: '*the lost and found* खोई हुई चीज़ें रखने वाले काउंटर का पक्का अंग्रेज़ी नाम है, यानी "खोया-पाया"।'
  en.a1.unit46.lesson02.teach.yes_we_found_it:
    title: Yes, we found it!
    gloss: हाँ, हमें मिल गया!
    note: '*Yes, we found it!* का मतलब है "हाँ, हमें मिल गया!"'
  en.a1.unit46.lesson03.teach.dialogue_line1:
    title: डैनियल का सवाल
    gloss: 'डैनियल पूछता है: मिया, तुम्हारा बैकपैक कहाँ है? वह तो तुम्हारे पास फ़व्वारे के पास था।'
    note: '*had* *have* का भूतकाल है, यानी "था / पास था"।'
  en.a1.unit46.lesson03.teach.dialogue_line2:
    title: मिया की घबराहट
    gloss: 'मिया कहती है: अरे नहीं, तुम सही हो! वह मेरे पास नहीं है। मेरा कैमरा उसी में है!'
    note: '*My camera is inside!* का मतलब है "मेरा कैमरा उसी के अंदर है!"'
  en.a1.unit46.lesson03.teach.dialogue_line3:
    title: डैनियल का सुझाव
    gloss: 'डैनियल कहता है: चिंता मत करो, चलो पार्क के दफ़्तर में फ़ोन करके पूछते हैं।'
    note: '*Don''t worry* का मतलब है "चिंता मत करो"।'
  en.a1.unit46.lesson03.teach.dialogue_line4:
    title: डैनियल का फ़ोन
    gloss: 'डैनियल कहता है: नमस्ते, हमारा एक काला बैकपैक फ़व्वारे के पास खो गया है। क्या किसी को मिला है?'
    note: '*we lost a black backpack* का मतलब है "हमारा एक काला बैकपैक खो गया"। अंग्रेज़ी में यहाँ सीधे भूतकाल *lost* आता है।'
  en.a1.unit46.lesson03.teach.dialogue_line5:
    title: मिया का सवाल
    gloss: 'मिया कहती है: उन्होंने क्या कहा?'
    note: '*did they say* में भूतकाल बनाने के लिए सहायक क्रिया *did* आती है।'
  en.a1.unit46.lesson03.teach.dialogue_line6:
    title: डैनियल की अच्छी ख़बर
    gloss: 'डैनियल कहता है: वह मिल गया! वह काला है और उसका पट्टा पीला है, है ना? वे उसे रिसेप्शन डेस्क पर रखे हुए हैं।'
    note: वाक्य के अंत में *right?* एक छोटा पुष्टि वाला सवाल है, जैसे हिंदी में "है ना?" या "सही है ना?"।
  en.a1.unit46.lesson03.teach.dialogue_line7:
    title: मिया की राहत
    gloss: 'मिया कहती है: हाँ, वही है! चलो अभी जाकर ले आते हैं। भगवान का शुक्र है।'
    note: '*Let''s go get it* का मतलब है "चलो जाकर ले आते हैं"। यहाँ दो क्रियाएँ बिना *to* के साथ-साथ आती हैं।'
  en.a1.unit46.lesson04.teach.reading_passage:
    title: खोया-पाया काउंटर के बारे में पाठ
    gloss: 'खोया-पाया: अगर पार्क में आपकी कोई चीज़ खो जाए, तो पहले सोचिए कि वह आख़िरी बार आपके पास कहाँ थी। फिर मुख्य गेट के पास पार्क के दफ़्तर में जाइए और चीज़ का वर्णन कीजिए -- उसका रंग और कोई ख़ास पहचान बताइए। अपना नाम और फ़ोन नंबर दीजिए, ताकि बाद में मिलने पर कर्मचारी आपको फ़ोन कर सकें। फ़व्वारे के पास मिया का बैकपैक खोने के बाद उसने और डैनियल ने तुरंत पार्क के दफ़्तर में फ़ोन किया। कर्मचारियों को वह पहले ही मिल चुका था और वे उसे रिसेप्शन डेस्क पर रखे हुए थे। अपना कैमरा सही-सलामत वापस पाकर मिया को बहुत राहत मिली। बाद में उसने लैला को पूरी कहानी सुनाई, और लैला ने कहा कि अगली बार वह मिया की मदद करेगी कि वह अपनी चीज़ों का बेहतर ध्यान रखे।'
    note: '*keep better track of your things* का मतलब है अपनी चीज़ों का बेहतर ध्यान रखना।'
