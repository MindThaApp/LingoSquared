  en.a1.unit48.lesson03.teach.dialogue_line1:
    title: लैला का प्रस्ताव
    gloss: 'लैला कहती है: मुझे यह किताब पुस्तकालय में वापस करनी है। क्या तुम मेरे साथ चलोगे?'
    note: '*Do you want to come with me?* का मतलब है "क्या तुम मेरे साथ चलना चाहोगे?"'
  en.a1.unit48.lesson03.teach.dialogue_line2:
    title: डैनियल का जवाब
    gloss: 'डैनियल कहता है: ज़रूर! मुझे नहीं लगता कि मैंने पहले कभी पुस्तकालय से कोई किताब ली है।'
    note: '*I don''t think I''ve ever ...* का मतलब है "मुझे नहीं लगता कि मैंने कभी ..."। इसमें *have ever* वाला पूर्ण वर्तमान काल है।'
  en.a1.unit48.lesson03.teach.dialogue_line3:
    title: लैला काउंटर पर
    gloss: 'लैला कहती है: नमस्ते, मैं यह किताब वापस करना चाहूँगी, और मैं एक नई किताब भी लेना चाहूँगी।'
    note: '*and I''d like to ... too* का मतलब है "और मैं ... भी करना चाहूँगी"।'
  en.a1.unit48.lesson03.teach.dialogue_line4:
    title: पुस्तकालयाध्यक्ष पूछती है
    gloss: 'पुस्तकालयाध्यक्ष कहती है: बहुत अच्छा, धन्यवाद। क्या आपके पास अपना पुस्तकालय कार्ड है?'
    note: '*Do you have your library card?* का मतलब है "क्या आपके पास अपना पुस्तकालय कार्ड है?"'
  en.a1.unit48.lesson03.teach.dialogue_line5:
    title: "लैला का जवाब"
    gloss: 'लैला कहती है: हाँ, यह रहा।'
    note: '*here it is* का मतलब है "यह रहा"।'
  en.a1.unit48.lesson03.teach.dialogue_line6:
    title: पुस्तकालयाध्यक्ष समझाती है
    gloss: 'पुस्तकालयाध्यक्ष कहती है: बिल्कुल ठीक। यह नई किताब तीन हफ़्ते में वापस करनी है।'
    note: '*due back in three weeks* का मतलब है "तीन हफ़्ते में वापस करनी है"।'
  en.a1.unit48.lesson03.teach.dialogue_line7:
    title: डैनियल भी किताब लेना चाहता है
    gloss: 'डैनियल कहता है: क्या मुझे भी पुस्तकालय कार्ड मिल सकता है? मैं एक पाक-कला की किताब लेना चाहूँगा।'
    note: '*Can I get ... too?* का मतलब है "क्या मुझे भी ... मिल सकता है?"'
  en.a1.unit48.lesson03.teach.dialogue_line8:
    title: पुस्तकालयाध्यक्ष डैनियल की मदद करती है
    gloss: 'पुस्तकालयाध्यक्ष कहती है: ज़रूर! बस यह फ़ॉर्म भर दीजिए।'
    note: '*fill out this form* का मतलब है "यह फ़ॉर्म भरिए"। *fill out* में दो शब्द हैं, जैसे हिंदी में "भर देना" में दो शब्द होते हैं।'
  en.a1.unit48.lesson04.teach.reading_passage:
    title: पुस्तकालय कैसे काम करता है, इस बारे में पाठ
    gloss: 'पुस्तकालय की सैर: ज़्यादातर पुस्तकालय आपको कुछ हफ़्तों के लिए किताबें, और कभी-कभी दूसरी चीज़ें भी, उधार लेने देते हैं। कुछ भी लेने के लिए आम तौर पर पुस्तकालय कार्ड चाहिए होता है। जब आप कोई किताब लेते हैं, तो पुस्तकालयाध्यक्ष आपको वापसी की तारीख़ बताता है -- यानी वह दिन जब आपको उसे लौटाना है। अगर तब तक आपकी किताब पूरी न हुई हो, तो आप अक्सर पुस्तकालयाध्यक्ष से और समय माँग सकते हैं। जब से लैला अपने नए अपार्टमेंट में रहने आई है, उसके पास पहले जितनी किताबें नहीं हैं, इसलिए अब वह उन्हें ख़रीदने की जगह पुस्तकालय से लेने लगी है। पिछले हफ़्ते उसने एक किताब वापस की और एक नई ली, और उसका दोस्त डैनियल भी साथ गया। उसने पहले कभी पुस्तकालय की किताब नहीं ली थी, इसलिए उसने अपना कार्ड बनवाया और एक पाक-कला की किताब ली, ताकि वह उन व्यंजनों का अभ्यास कर सके जो मिया उसे सिखा रही है। पुस्तकालयाध्यक्ष ने दोनों को याद दिलाया कि अपनी किताबें वापसी की तारीख़ से पहले लौटा दें। मिया पुस्तकालय कम जाती है, पर उसने एक बार अपनी कक्षा के लिए फ़ोटोग्राफ़ी की एक किताब ली थी।'
    note: '*checked out a cookbook* का मतलब है "पाक-कला की किताब ली"। पुस्तकालय से किताब लेने के लिए *check out* पक्की अंग्रेज़ी अभिव्यक्ति है।'
