    gloss: 'क्लर्क कहता है: पाँच कामकाजी दिनों के अंदर।'
    note: '*within* का मतलब है तय समय-सीमा के अंदर, यानी ज़्यादा से ज़्यादा पाँच कामकाजी दिन लगेंगे।'
