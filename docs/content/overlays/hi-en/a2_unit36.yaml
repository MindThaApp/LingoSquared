    example_gloss: दफ़्तर हर पत्र का जवाब पाँच कामकाजी दिनों के अंदर देता है।
  en.a2.unit36.lesson03.teach.notice_text:
    title: सुधार का पत्र
    gloss: सुधार का अनुरोध मिल गया है। आपका पंजीकरण प्रमाणपत्र पाँच कामकाजी दिनों के अंदर ठीक कर दिया जाएगा। कृपया अपना पासपोर्ट और यह पत्र दफ़्तर लेकर आएँ। संदर्भ संख्या 3092।
    note: 'सरकारी पत्र छोटा और सीधा होता है: क्या हुआ, क्या होगा और आपको क्या करना है।'
  en.a2.unit36.lesson03.teach.bring_passport_and_notice:
