    note: '*provided* एक शर्त जोड़ता है। यह हिंदी के "बशर्ते" जैसा है और अंग्रेज़ी में भी अक्सर औपचारिक और पेशेवर लगता है।'
    example_gloss: हम इस नीति का समर्थन कर सकते हैं, बशर्ते हम सहमत हों।
