    title: सतर्कता के साथ ज़ोर
    gloss: नीति उचित लगती है, लेकिन इससे टीम के लिए अतिरिक्त काम ज़रूर पैदा होता है।
    note: '*seems* सकारात्मक कथन को नरम बनाता है; *does create* ज़ोर देता है कि अतिरिक्त काम सचमुच पैदा होता है। हिंदी में यह काम "ज़रूर" या "तो" जैसे शब्द करते हैं: काम तो बढ़ता है।'
  en.b2.unit03.lesson02.teach.what_worries_me:
    title: एक चिंता पर ध्यान केंद्रित करना
    gloss: मुझे जिस बात की चिंता है, वह टीम के लिए अतिरिक्त काम है।
    note: '*What worries me is...* किसी बिंदु को आगे रखकर उस पर ध्यान केंद्रित करता है। उसके बाद अंग्रेज़ी का क्रम रखें: *is the extra work*।'
  en.b2.unit03.lesson02.teach.broadly_provided:
