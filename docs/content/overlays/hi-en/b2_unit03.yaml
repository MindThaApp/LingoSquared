    note: '*broadly useful, provided...* एक साफ़ शर्त के साथ समर्थन देता है।'
  en.b2.unit03.lesson02.teach.grammar_stance:
    title: नरमी और ज़ोर
    gloss: किसी कथन को नरम या सीमित करने के लिए seems, broadly या to some extent इस्तेमाल कीजिए। यह ज़ोर देने के लिए कि कोई बात सच है, मुख्य क्रिया से पहले do या does लगाइए। किसी एक बिंदु पर ध्यान खींचने के लिए What matters is... या What worries me is... इस्तेमाल कीजिए।
    note: '*does create* में *does* कोई नया अर्थ नहीं जोड़ता; वह *create* पर ज़ोर देता है, ठीक वैसे जैसे हिंदी में "बनाता तो है" कहने से ज़ोर आता है।'
  en.b2.unit03.lesson03.teach.overall:
    title: overall
    gloss: कुल मिलाकर, समग्र रूप से
    note: '*overall* पूरी तस्वीर को देखता है, भले ही कुछ ब्योरे या अपवाद हों।'
    example_gloss: कुल मिलाकर लीला नीति का समर्थन करती है।
  en.b2.unit03.lesson03.teach.condition:
    title: condition
    gloss: शर्त
    note: '*condition* वह चीज़ है जो पूरी होनी चाहिए, तभी कोई बात लागू होती है।'
    example_gloss: उसकी शर्त है कि समय-सारणी में बदलाव किया जाए।
  en.b2.unit03.lesson03.teach.reading_passage:
    title: 'पठन-पाठ: शर्तों के साथ समर्थन'
    gloss: 'लीला की प्रतिक्रिया सकारात्मक है, लेकिन सावधानी से संतुलित की गई है। वह कहती है कि रिव्यू नीति कुल मिलाकर उचित लगती है, जिससे उसकी बात नरम पड़ती है और निरपेक्ष नहीं लगती। वह यह भी कहती है कि यह मोटे तौर पर उपयोगी है, बशर्ते समय-सारणी में बदलाव किया जाए। वह शर्त उसके समर्थन को सीमित करती है: वह नीति को ठीक वैसा नहीं मान रही जैसी वह लिखी गई है। डैनियल एक केंद्रित वाक्य-रचना से अलग बिंदु पर ज़ोर देता है: उसे जिस बात की चिंता है, वह टीम के लिए अतिरिक्त काम है। दोनों वक्ता सिद्धांत रूप में नीति का समर्थन करते हैं, लेकिन उनकी भाषा प्रतिबद्धता के अलग-अलग स्तर दिखाती है।'
    note: यह पाठ दिखाता है कि एक ही मूल बात को कैसे नरम, ज़्यादा ज़ोरदार या ज़्यादा शर्तिया बनाया जाता है।
  en.b2.unit03.lesson04.teach.q_policy_seems:
    title: लीला सतर्क ढंग से कहती है
    gloss: 'लीला कहती है: नई रिव्यू नीति कुल मिलाकर उचित लगती है।'
    note: '*seems reasonable overall* आलोचना से ज़्यादा सकारात्मक है, पर निरपेक्ष नहीं।'
  en.b2.unit03.lesson04.teach.a_not_fully_ready:
    title: डैनियल सतर्कता को पकड़ता है
    gloss: 'डैनियल कहता है: यह थोड़ा सतर्क लगता है। क्या आप कह रही हैं कि यह अभी पूरी तरह तैयार नहीं है?'
    note: डैनियल देखता है कि लीला सीधे *it is ready* नहीं कह रही।
  en.b2.unit03.lesson04.teach.q_workable_deadlines:
    title: लीला और स्पष्टता जोड़ती है
    gloss: 'लीला कहती है: बिल्कुल। यह कामचलाऊ हो सकती है, लेकिन इसे ज़्यादा स्पष्ट समय-सीमाओं की ज़रूरत है।'
    note: '*may be workable* संदेह की गुंजाइश रखता है; *but* सीमा बताता है।'
  en.b2.unit03.lesson04.teach.a_what_worries:
    title: डैनियल ध्यान एक बात पर लाता है
    gloss: 'डैनियल कहता है: मैं सहमत हूँ। मुझे जिस बात की चिंता है, वह टीम के लिए अतिरिक्त काम है।'
    note: '*What worries me is...* ध्यान एक चिंता पर केंद्रित करता है।'
  en.b2.unit03.lesson04.teach.q_does_create_checks:
    title: लीला does से ज़ोर देती है
    gloss: 'लीला कहती है: यह सही है। नीति बेहतर गुणवत्ता-जाँच ज़रूर देती है, लेकिन यह मंज़ूरी का एक और चरण भी जोड़ती है।'
    note: '*does create* बाद की सीमा के बावजूद ज़ोर देता है कि यह लाभ सचमुच मौजूद है।'
  en.b2.unit03.lesson04.teach.a_support_conditions:
    title: डैनियल शर्त का सार बताता है
    gloss: 'डैनियल कहता है: तो हमें इसका समर्थन शर्तों के साथ करना चाहिए?'
    note: वह लीला के नपे-तुले समर्थन का सार बताता है।
  en.b2.unit03.lesson04.teach.q_broadly_useful:
    title: लीला शर्तिया समर्थन देती है
    gloss: 'लीला कहती है: हाँ। मैं कहूँगी कि यह मोटे तौर पर उपयोगी है, बशर्ते समय-सारणी में बदलाव किया जाए।'
    note: '*provided* का अर्थ यहाँ "बशर्ते" है: समर्थन तभी लागू है जब शर्त पूरी हो।'
  en.b2.unit03.lesson04.teach.same_content_triad:
    title: वही बात, तीन तीव्रताएँ
    gloss: नीति अतिरिक्त काम पैदा करती है। नीति अतिरिक्त काम पैदा करती प्रतीत होती है। नीति अतिरिक्त काम ज़रूर पैदा करती है।
    note: ये तीन वाक्य तटस्थ रूप, *seems to* से नरम रूप और *does* से ज़ोरदार रूप का अभ्यास कराते हैं।
