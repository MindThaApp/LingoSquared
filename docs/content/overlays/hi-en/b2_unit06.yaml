    note: '*In principle* का यहाँ मतलब "सिद्धांत रूप में" है। इसे *eventually* से मत मिलाइए; *eventually* का मतलब "आख़िरकार" है।'
  en.b2.unit06.lesson02.teach.not_arguing_everywhere:
    title: अपनी बात को सीमित करना
