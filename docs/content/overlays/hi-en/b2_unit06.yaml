    example_gloss: व्यावसायिक गतिविधि का संबंध कारोबार से है।
  en.b2.unit06.lesson03.teach.reading_passage:
    title: 'पाठ: शांत सार्वजनिक जगहें'
    gloss: 'अमारा का तर्क है कि शांत सार्वजनिक जगहों की रक्षा होनी चाहिए, भले ही इससे कुछ व्यावसायिक गतिविधि सीमित हो। उसका नज़रिया पूरी तरह कठोर नहीं है: वह हर जगह चुप्पी की वकालत नहीं करती, और मानती है कि कंपनियों को कुछ लचीलापन चाहिए। लियो का विरोधी नज़रिया यह है कि नियम कंपनियों के लिए टिके रहना मुश्किल बना सकते हैं। अमारा इसी बात का सीधा जवाब देती है: सुविधा मायने रखती है, पर जब कोई जगह सबकी हो, तब निष्पक्षता का वज़न ज़्यादा होना चाहिए। उसका रुख़ संतुलित है, क्योंकि वह सीमित और पारदर्शी नियमों का समर्थन करती है, असीमित पाबंदियों का नहीं।'
    note: 'यह अमूर्त अंग्रेज़ी है: मूल्यों के नाम लीजिए और अपने दावे को सटीक ढंग से सीमित कीजिए।'
  en.b2.unit06.lesson04.teach.q_protect_spaces:
    title: अमारा अपना रुख़ बताती है
    gloss: 'अमारा कहती है: मेरा मानना है कि शहर को शांत सार्वजनिक जगहों की रक्षा करनी चाहिए, भले ही इससे कुछ व्यावसायिक गतिविधि सीमित हो।'
    note: '*even if* दिखाता है कि वह एक नुक़सान को मानती है।'
  en.b2.unit06.lesson04.teach.a_business_flexibility:
    title: लियो दूसरा मूल्य बताता है
    gloss: 'लियो कहता है: मैं भी शांति की क़द्र करता हूँ, पर कंपनियों को टिके रहने के लिए लचीलापन चाहिए।'
    note: लियो, अमारा के सार्वजनिक जगह वाले ज़ोर के सामने लचीलापन रखता है।
  en.b2.unit06.lesson04.teach.q_not_silence:
    title: अमारा अपनी बात संतुलित करती है
    gloss: 'अमारा कहती है: यह ठीक बात है, और मैं हर जगह चुप्पी की वकालत नहीं कर रही। मेरी बात यह है कि साझा जगहें सिर्फ़ मुनाफ़े से नहीं ढलनी चाहिए।'
    note: '*not arguing for silence everywhere* उसके रुख़ को बहुत कठोर लगने से बचाता है।'
  en.b2.unit06.lesson04.teach.a_prioritizing:
    title: लियो मूल्य का नाम लेता है
    gloss: 'लियो कहता है: तो जिस मूल्य को तुम प्राथमिकता दे रही हो वह निष्पक्षता है, सिर्फ़ आराम नहीं?'
    note: '*prioritizing* का यहाँ मतलब है: तौलते समय किसी चीज़ को ज़्यादा महत्वपूर्ण बनाना।'
  en.b2.unit06.lesson04.teach.q_fairness_weight:
    title: अमारा मूल्यों को तौलती है
    gloss: 'अमारा कहती है: बिल्कुल। सिद्धांत रूप में सुविधा मायने रखती है, पर जब कोई जगह सबकी हो, तब निष्पक्षता का वज़न ज़्यादा होना चाहिए।'
    note: '*carry more weight* "ज़्यादा वज़न रखना" के लिए स्वाभाविक अंग्रेज़ी है।'
  en.b2.unit06.lesson04.teach.a_accept_rules:
    title: लियो शर्त के साथ मानता है
    gloss: 'लियो कहता है: अगर नियम सीमित और पारदर्शी हों, तो मैं यह मान सकता हूँ।'
    note: उसकी स्वीकृति नियमों के सीमित और साफ़ होने पर टिकी है।
