    accepted_answers:
    - value: One ticket to Boston, please. Round trip, please. What time does it arrive in Boston?
      status: correct
    - value: One ticket to Boston, please. I'd like a round trip, please. What time does it arrive in Boston?
      status: correct
    - value: One ticket to Boston, please. Round trip, please. What time does it arrive?
      status: correct
    - value: One ticket to Boston, please. Round trip, please. What time does the train arrive in Boston?
      status: correct
    feedback: 'पूरा जवाब बातचीत के तीनों हिस्सों को पूरा करता है: टिकट माँगना, प्रकार चुनना और पहुँचने का समय पूछना।'
