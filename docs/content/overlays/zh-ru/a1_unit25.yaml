teaching:
  ru.a1.unit25.lesson01.teach.chitat_zanimatsya_sportom:
    title: 阅读、锻炼、做饭
    gloss: 阅读、锻炼／做运动、做饭
    note: 三个常用的爱好动词：*читать*（读、看书）、*заниматься спортом*（做运动）和 *готовить*（做饭）。
    example_gloss:
    - 我喜欢读书。
    - 我每逢星期六都锻炼。
    - 我喜欢为朋友们做饭。
  ru.a1.unit25.lesson01.teach.svobodnoe_vremya:
    title: 空闲时间
    gloss: 空闲时间
    note: '*Свободное время* 是谈论爱好的关键短语。形容词 *свободное* 以 *-ое* 结尾，与 *время* 保持一致。'
    example_gloss: 我空闲时喜欢阅读。
  ru.a1.unit25.lesson01.teach.v_svobodnoe_vremya:
    title: 表达你空闲时做什么
    gloss: 我空闲时喜欢阅读。
    note: '*Люблю* 是 *любить*（喜欢、爱）的 *я* 形式。后面的第二个动词用不定式：*люблю читать*。'
  ru.a1.unit25.lesson02.teach.slushat_muzyku_risovat:
    title: 音乐、画画、电子游戏
    gloss: 听音乐、画画、玩电子游戏
    note: 另外三个爱好：*слушать музыку*（听音乐）、*рисовать*（画画）和 *играть в игры*（玩电子游戏）。
    example_gloss:
    - 我喜欢听音乐。
    - 我经常画画。
    - 我喜欢和朋友们一起玩电子游戏。
  ru.a1.unit25.lesson02.teach.ya_lyublyu_slushat:
    title: 表达你喜欢听音乐
    gloss: 我喜欢听音乐。
    note: '*Слушать* 后面直接接宾语：*музыку* 是 *музыка* 的四格（宾格），词尾为 *-у*。'
  ru.a1.unit25.lesson02.teach.ya_lyublyu_igrat:
    title: 表达喜欢和朋友一起玩电子游戏
    gloss: 我喜欢和朋友们一起玩电子游戏。
    note: '*С друзьями*（和朋友们）：前置词 *с* 后面接五格（工具格），所以是 *друзьями*。'
  ru.a1.unit25.lesson03.teach.vsegda_chasto_inogda:
    title: 总是、经常、有时、从不
    gloss: 总是、经常、有时、从不
    note: 四个基本的频率副词：*всегда*、*часто*、*иногда*、*никогда*。它们的形式永远不变。
    example_gloss:
    - 我每周六都锻炼。
    - 我经常读书。
    - 我有时画画。
    - 我从不玩电子游戏。
  ru.a1.unit25.lesson03.teach.kazhduyu_nedelyu_kazhdye:
    title: 每周、每个周末
    gloss: 每周、每个周末
    note: '*Каждую неделю* 和 *каждые выходные* 都表示“每”，但词尾随名词变化：见下一张卡片。'
    example_gloss:
    - 我每周都为朋友做饭。
    - 我每个周末都锻炼。
  ru.a1.unit25.lesson03.teach.nedelya_zhenskogo_roda:
    title: “每”：阴性与复数
    gloss: '*Неделя* 是阴性，所以说 *каждую неделю*。*Выходные* 是复数，所以说 *каждые выходные*。'
    note: '*Каждый* 像其他形容词一样与名词保持一致：*каждый день*（阳性）、*каждую неделю*（阴性四格）、*каждые выходные*（复数）。'
  ru.a1.unit25.lesson03.teach.chto_ty_delaesh:
    title: 询问空闲时间
    gloss: 你空闲时做什么？
    note: 这是本单元的核心问题，可以用它询问任何人的爱好。
  ru.a1.unit25.lesson04.teach.nastya_my_chasto:
    title: 娜斯佳提起爱好
    gloss: 娜斯佳：我们经常一起散步。那你空闲时间还做什么，迪马？
    note: '*Мы часто гуляем вместе*：*мы*（我们）搭配动词词尾 *-ем*，*гулять* 指悠闲地散步。'
  ru.a1.unit25.lesson04.teach.dima_ya_lyublyu:
    title: 迪马的爱好
    gloss: 迪马：我喜欢做饭，在家也做。另外我经常锻炼身体。
    note: '*И дома тоже*（在家也）：*и ... тоже* 表明迪马做饭是出于兴趣，不只是因为工作。'
  ru.a1.unit25.lesson04.teach.nastya_ty_i:
    title: 娜斯佳很惊讶
    gloss: 娜斯佳：你在家也做饭？你在工作中不是已经做了一整天饭吗！
    note: '*Весь день*（整天）强调迪马在工作中已经做了很多饭。*Весь* 与阳性名词 *день* 保持一致。'
  ru.a1.unit25.lesson04.teach.dima_da_no:
    title: 迪马解释
    gloss: 迪马：对，但做饭能让我放松。那你呢，你喜欢做什么？
    note: '*Готовить меня расслабляет* 把活动放在句首：字面意思是“做饭使我放松”，*меня* 是四格（宾格）。'
  ru.a1.unit25.lesson04.teach.nastya_ya_lyublyu:
    title: 娜斯佳的爱好
    gloss: 娜斯佳：我喜欢看书，也经常听音乐。
    note: 前面学过的两个爱好动词用 *и*（和）连接：*люблю читать и часто слушаю музыку*。
  ru.a1.unit25.lesson04.teach.dima_ty_tozhe:
    title: 迪马问起玩游戏
    gloss: 迪马：你也玩游戏吗？
    note: 简短的是非问句：俄语保持语序不变，只是语调上扬：*Ты тоже играешь в игры?*
  ru.a1.unit25.lesson04.teach.nastya_net_ya:
    title: 娜斯佳的回答
    gloss: 娜斯佳：不，我从来不玩游戏。不过我有时画画！
    note: '*Никогда не*（从不）要在动词前再加一个 *не*。*Иногда*（有时）形成对比。'
  ru.a1.unit25.lesson05.teach.my_s_dimoy:
    title: 比较爱好
    gloss: 我和迪马经常一起散步。但我们还有其他爱好。迪马喜欢做饭，在家也做，还经常锻炼身体。我喜欢看书，也经常听音乐。我有时画画，但从不玩游戏。你空闲时间喜欢做什么？
    note: 娜斯佳的消息回顾了前面学过的内容，并以本单元的核心问题向读者提问作结。
    glosses:
      гуляем: 散步
      часто: 经常
      вместе: 一起
      другие: 其他的
      готовить: 做饭
      любит: 喜欢
      дома: 在家
      занимается: 锻炼
      читать: 阅读
      слушаю: 听
      музыку: 音乐
      рисую: 画画
      иногда: 有时
      играю: 玩电子游戏
      никогда: 从不
      свободное: 空闲的
      время: 时间
  ru.a1.unit25.lesson06.teach.dima_chto_ty:
    title: 迪马问周末的安排
    gloss: 迪马：这个周末你做什么？
    note: '*В эти выходные*（这个周末）：*выходные* 是复数，所以 *эти* 也是复数，表示时间的 *в* 后面接四格（宾格）。'
  ru.a1.unit25.lesson06.teach.nastya_poka_ne:
    title: 娜斯佳还没决定
    gloss: 娜斯佳：我还不知道。我喜欢看书，但也想出去走走。
    note: '*Хочу ещё выйти на улицу* 意思是“我还想出去走走”。*Хочу* 是 *хотеть* 的 *я* 形式。'
  ru.a1.unit25.lesson06.teach.dima_davay_pogulyaem:
    title: 迪马提出计划
    gloss: 迪马：我们一起去散步吧？之后我给我们做饭。
    note: '*Давай погуляем* 是提议一起做某事的常用说法，*потом*（之后）用来安排下一步。'
  ru.a1.unit25.lesson06.teach.nastya_khoroshaya_ideya:
    title: 娜斯佳同意
    gloss: 娜斯佳：好主意！我既喜欢散步，也喜欢做饭。
    note: '*Мне нравится* 字面意思是“对我来说是讨人喜欢的”：人用三格（与格）*мне*，后面跟喜欢的事物。'
  ru.a1.unit25.lesson06.teach.dima_otlichno_togda:
    title: 迪马确认
    gloss: 迪马：太好了。那我们星期六见！
    note: '*Увидимся в субботу*（星期六见）：*в* 加星期几要用四格（宾格），所以 *суббота* 变成 *субботу*。'
