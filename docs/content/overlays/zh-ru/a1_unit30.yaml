    gloss: '*Пользоваться* 后面接工具格（*пользоваться телефоном*），而 *искать* 后面接对格（*искать прогноз*）。'
    note: 两个动词都是规则变位：*я пользуюсь, ты пользуешься*；*я ищу, ты ищешь*。
