  ru.a1.unit30.lesson04.teach.igor_ya_vizhu:
    title: 伊戈尔看到消息
    gloss: 伊戈尔：我看到消息了。星期六见！
  ru.a1.unit30.lesson04.teach.ty_uzhe_znaesh:
    title: до 加属格
    gloss: 你已经知道 *До свидания!*（再见！）还可以说出某一天：*До субботы!*、*До завтра!* *до* 后面的名词用属格。
    note: 把问候单元中的告别用语扩展到具体的某一天。
  ru.a1.unit30.lesson05.teach.nastya_kazhdyy_den:
    title: 谁用什么？
    gloss: 娜斯佳每天给季马打电话。她用手机，不用应用程序。季马家里没有电脑，但他用手机上网。伊戈尔每天早上查天气预报，然后去跑步。列娜经常给娜斯佳发消息。你也每天用手机吗？
    note: 对比四个人物使用设备的习惯，与运动单元的对比阅读形式相呼应。
