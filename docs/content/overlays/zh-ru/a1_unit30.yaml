    title: 伊戈尔的计划
    gloss: 伊戈尔：那我去跑步。之后我还要踢足球。
    note: '*Потом*（之后）把第二个计划放在第一个之后，*побегаю* 是完成体：“我跑一会儿”。'
  ru.a1.unit30.lesson06.teach.lena_ya_luchshe:
    title: 莉娜的计划
    gloss: 莉娜：我更想游泳，不过我也会去公园。
    note: '*Я лучше поплаваю* 的意思是“我更想去游泳”。动词前的 *лучше* 表示更愿意这样做。'
  ru.a1.unit30.lesson06.teach.nastya_zdorovo_do:
    title: 娜斯佳结束对话
    gloss: 娜斯佳：太好了！星期六公园见！
    note: 一句话同时收束了本单元的消息对话和运动单元的计划。
