    note: '*Хорошая идея* 是阴性形容词搭配阴性名词。*Поищу* 是完成体将来时，意思是“我将查一查”。'
  ru.a1.unit30.lesson04.teach.dima_v_subbotu:
    title: 季马查看天气
    gloss: 季马：星期六是晴天！
