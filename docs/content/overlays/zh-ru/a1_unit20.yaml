teaching:
  ru.a1.unit20.lesson01.teach.segodnya_holodno:
    title: Сегодня холодно.
    gloss: 今天很冷。
    note: 俄语常用无人称的天气词：холодно，字面意思是“冷地”。
    example_gloss: 今天很冷，季马。
  ru.a1.unit20.lesson01.teach.teplo:
    title: тепло
    gloss: 暖和的
    note: тепло 和 холодно 一样，可用来说天气或温度。
    example_gloss: 家里很暖和。
  ru.a1.unit20.lesson01.teach.pogoda:
    title: погода
    gloss: 天气
    note: погода 的意思是“天气”。
    example_gloss: 天气：今天很冷。
  ru.a1.unit20.lesson02.teach.idet_dozhd:
    title: Идёт дождь.
    gloss: 在下雨。
    note: 俄语也可以说 дождь идёт，字面意思是“雨在走”。和汉语“下雨”一样，句子里没有“它”这样的主语词。
    example_gloss: 今天下雨。
  ru.a1.unit20.lesson02.teach.solntse:
    title: солнце
    gloss: 太阳
    note: Сегодня солнце 是说“今天天晴”的简单说法。俄语这里只点出天气，不用动词。
    example_gloss: 今天天晴。
  ru.a1.unit20.lesson02.teach.veter:
    title: ветер
    gloss: 风
    note: На улице ветер 是说“外面有风”的自然说法。
    example_gloss: 外面有风。
  ru.a1.unit20.lesson03.teach.nastya_kakaya_pogoda:
    title: 娜斯佳问天气
    gloss: 娜斯佳：今天天气怎么样？
    note: Какая сегодня погода? 是标准的提问方式。
  ru.a1.unit20.lesson03.teach.dima_holodno_dozhd:
    title: 季马描述天气
    gloss: 季马：今天很冷，而且在下雨。
    note: 季马用 и 把两种天气情况连在一起。
  ru.a1.unit20.lesson03.teach.nastya_ostanemsya_doma:
    title: 娜斯佳提议一个计划
    gloss: 娜斯佳：那我们待在家里吧。
    note: Давай останемся дома 是比较随意的提议。
  ru.a1.unit20.lesson03.teach.dima_doma_teplo:
    title: 季马同意
    gloss: 季马：好，家里很暖和。
    note: Дома тепло 说明了这个计划的理由。
