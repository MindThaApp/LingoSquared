  ru.a1.unit17.lesson01.teach.ya_vrach_rabotayu_v_bolnitse:
    title: Я врач. Я работаю в больнице.
    gloss: 我是医生。我在医院工作。
    note: врач 是“医生”（职业）；работаю в + 前置格表示“我在……工作”。
  ru.a1.unit17.lesson01.teach.uchitel:
    title: учитель
    gloss: 老师
    note: учитель 是“老师”。работает 是 работать 的“他／她工作”形式。
    example_gloss: 她是老师。她在学校工作。
  ru.a1.unit17.lesson01.teach.inzhener:
    title: инженер
    gloss: 工程师
    note: инженер 是“工程师”。офис 是“办公室”；в офисе 是前置格形式，意为“在办公室里”。
    example_gloss: 他是工程师。他在办公室工作。
  ru.a1.unit17.lesson02.teach.kem_ty_rabotayesh:
    title: Кем ты работаешь?
    gloss: 你做什么工作？
    note: Кем ты работаешь? 是询问别人职业的标准说法；кем 是“谁”的工具格，与 работать 搭配使用。
  ru.a1.unit17.lesson02.teach.prodavets:
    title: продавец
    gloss: 售货员／店员
    note: продавец 是“售货员”（在商店工作）。магазин 是“商店”；в магазине 是前置格形式。
    example_gloss: 他是售货员。他在商店工作。
  ru.a1.unit17.lesson02.teach.povar:
    title: повар
    gloss: 厨师
    note: повар 是“厨师”。ресторан 是“餐厅”；в ресторане 是前置格形式。
    example_gloss: 她是厨师。她在餐厅工作。
