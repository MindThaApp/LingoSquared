teaching:
  ru.a1.unit02.lesson01.teach.kak_vas_zovut:
    title: Как вас зовут?, Как тебя зовут?
    gloss: 您叫什么名字？（正式）；你叫什么名字？（非正式）
    note: Как вас зовут? 使用正式的 вас，用于陌生人或礼貌的场合。Как тебя зовут? 使用非正式的 тебя，用于朋友、孩子和同辈。
    example_gloss:
    - 您好！您叫什么名字？
    - 你好！你叫什么名字？
  ru.a1.unit02.lesson01.teach.menya_zovut:
    title: Меня зовут Виктор.
    gloss: 我叫维克多。
    note: Меня зовут（字面意思是“人们叫我”）是俄语中介绍自己名字的标准说法，不分正式或非正式。
  ru.a1.unit02.lesson01.teach.menya_zovut_anna:
    title: Меня зовут Анна.
    gloss: 我叫安娜。
    note: 同样的句型 Меня зовут ...，只是换了名字——这个短语不会因说话人的性别而改变。
  ru.a1.unit02.lesson01.teach.register_note:
    title: 选择合适的问句
    gloss: Как вас зовут? 用于礼貌场合或对陌生人。Как тебя зовут? 用于朋友、孩子和同辈。
    note: 这里的正式／非正式区别与第二课详细讲的 вы／ты 区别一致——вас 和 тебя 分别是 вы 和 ты 的宾格形式。
  ru.a1.unit02.lesson02.teach.vy_ty:
    title: вы, ты
    gloss: 你／您（正式）；你（非正式）
    note: 汉语的“你”和“您”也有类似区分，但俄语更系统：вы 用于陌生人、长辈和职场场合；ты 用于朋友、家人和孩子。此外 вы 还可以表示“你们”。
    example_gloss:
    - 您从哪里来？（正式）
    - 你从哪里来？（非正式）
  ru.a1.unit02.lesson02.teach.vy_ty_rule:
    title: 各自的使用场合
    gloss: Вы 是正式的：用于陌生人、工作场合、长辈。Ты 是非正式的：用于朋友、家人、孩子。
    note: 对期待你用 вы 的人使用 ты，可能显得过于随便，甚至无礼——拿不准时，先用 вы。
  ru.a1.unit02.lesson02.teach.mozhno_na_ty:
    title: Можно на ты?
    gloss: 我们可以改用非正式的 ты 吗？
    note: 当关系足够友好时，礼貌地提议从正式的 вы 改为非正式的 ты。
  ru.a1.unit02.lesson02.teach.davayte_pereydyom:
    title: Давайте перейдём на ты.
    gloss: 我们改用非正式的 ты 吧。
    note: 提议同样的称呼转换，但比 Можно на ты? 更直接、更有邀请意味。
  ru.a1.unit02.lesson02.teach.otkuda_vy:
    title: Откуда вы?
    gloss: 您从哪里来？（正式）
    note: 使用正式的 вы，适合初次见面或职场场合。
  ru.a1.unit02.lesson02.teach.otkuda_ty:
    title: Откуда ты?
    gloss: 你从哪里来？（非正式）
    note: 非正式的对应说法，用于已经很熟的人。
  ru.a1.unit02.lesson02.teach.ya_iz_kanady:
    title: Я из Канады.
    gloss: 我来自加拿大。
    note: Из（“从”）后面接属格，所以 Канада 在这里变成 Канады——虽然完整的格语法以后才学，但这种表示来源的属格用法值得先留意。
  ru.a1.unit02.lesson02.teach.ya_iz_moskvy:
    title: Я из Москвы.
    gloss: 我来自莫斯科。
    note: 与 Я из Канады 相同的表示来源的属格用法：Москва 在 из 之后变成 Москвы。
  ru.a1.unit02.lesson03.teach.davayte_poznakomimsya:
    title: Давайте познакомимся.
    gloss: 我们来认识一下吧。
    note: 初次见面的人之间，礼貌而常用的自我介绍开场白。
  ru.a1.unit02.lesson03.teach.ochen_priyatno:
    title: Очень приятно
    gloss: 很高兴认识你
    note: 对方刚说出名字之后，标准而礼貌的回应。
    example_gloss: 我叫约翰。——很高兴认识你。
  ru.a1.unit02.lesson03.teach.irina_greeting:
    title: 伊琳娜·彼得罗夫娜开始自我介绍
    gloss: 伊琳娜·彼得罗夫娜说：您好！我们来认识一下吧。我叫伊琳娜·彼得罗夫娜。
    note: 伊琳娜·彼得罗夫娜在正式的办公室里第一次见到约翰，所以她用了礼貌的 Здравствуйте，并始终使用 вы。
  ru.a1.unit02.lesson03.teach.john_reply:
    title: 约翰说出自己的名字
    gloss: 约翰说：很高兴认识您。我叫约翰。
    note: 约翰用 Очень приятно 配合伊琳娜·彼得罗夫娜正式、礼貌的语气。
  ru.a1.unit02.lesson03.teach.irina_question:
    title: 伊琳娜·彼得罗夫娜问约翰来自哪里
    gloss: 伊琳娜·彼得罗夫娜问：约翰，您从哪里来？
    note: 她用了正式的 Откуда вы，与办公室的场合相符。
  ru.a1.unit02.lesson03.teach.john_answer:
    title: 约翰回答并反问
    gloss: 约翰说：我来自加拿大。您呢，您从哪里来？
    note: 约翰说明自己的来源，并用 А вы откуда? 礼貌地把问题回问过去。
  ru.a1.unit02.lesson03.teach.irina_answer:
    title: 伊琳娜·彼得罗夫娜回答
    gloss: 伊琳娜·彼得罗夫娜说：我来自莫斯科。
    note: 她用第二课学过的表示来源的属格句型结束了这段对话。
