teaching:
  ru.a1.unit16.lesson01.teach.u_menya_bolit_golova:
    title: У меня болит голова.
    gloss: 我头疼。
    note: у меня 的字面意思是“在我这儿”，表示“我有”；болит 表示“疼”，与单数主语（如 голова“头”）搭配。
  ru.a1.unit16.lesson01.teach.zhivot:
    title: живот
    gloss: 肚子
    note: живот 意思是“肚子”。任何身体部位都可以用同样的 у меня болит... 句型。
    example_gloss: 我肚子痛。
  ru.a1.unit16.lesson01.teach.gorlo:
    title: горло
    gloss: 喉咙
    note: горло 意思是“喉咙”。
    example_gloss: 我喉咙痛。
  ru.a1.unit16.lesson02.teach.u_menya_temperatura:
    title: У меня температура.
    gloss: 我发烧了。
    note: температура 字面意思是“温度”，但在俄语中是表示“发烧”的标准说法。
  ru.a1.unit16.lesson02.teach.prostuda:
    title: простуда
    gloss: 感冒
    note: простуда 意思是“感冒”（一种病）。说 у меня простуда 表示“我感冒了”。
    example_gloss: 我感冒了。
  ru.a1.unit16.lesson02.teach.mne_ploho:
    title: Мне плохо.
    gloss: 我不舒服。
    note: Мне плохо 是泛指身体不舒服的说法，不需要指明具体症状。
  ru.a1.unit16.lesson03.teach.dima_zdravstvuyte_bolit:
    title: 季马向医生问好
    gloss: 季马：您好！我头疼，喉咙也疼。
    note: 医生是陌生人，所以季马用正式的 Здравствуйте! 开场。
  ru.a1.unit16.lesson03.teach.doktor_chto_u_vas_bolit:
    title: 医生询问哪里疼
    gloss: 医生：您哪里疼？头和喉咙吗？
    note: 医生用的是敬称 вас（“您”，敬称／复数），而不是非正式的 тебя。
  ru.a1.unit16.lesson03.teach.dima_da_i_eshchyo_temperatura:
    title: 季马补充了另一个症状
    gloss: 季马：是的，还发烧。
    note: ещё 意思是“还、另外”——и ещё... 用来在刚说的内容之外再补充一项。
  ru.a1.unit16.lesson03.teach.doktor_vam_nuzhno_otdyhat:
    title: 医生给出建议
    gloss: 医生：您需要休息，并且多喝水。
    note: Вам нужно + 动词不定式表示“您需要……”；вам 是敬称的与格“您”。
