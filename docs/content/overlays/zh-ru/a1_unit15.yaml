teaching:
  ru.a1.unit15.lesson01.teach.kofe_luchshe_chem_chay:
    title: Кофе лучше, чем чай.
    gloss: 咖啡比茶好。
    note: лучше（“更好”）加 чем（“比”）构成最基本的比较句。俄语不用“是”，两个事物之间直接用比较级连接。
  ru.a1.unit15.lesson01.teach.huzhe:
    title: хуже
    gloss: 更差
    note: хуже（“更差”）是 лучше 的反义比较级，同样与 чем 搭配使用。
    example_gloss: 茶比咖啡差。
  ru.a1.unit15.lesson01.teach.kakoy:
    title: какой / какое
    gloss: 哪个／什么样的
    note: какой（阳性）和 какое（中性）用来询问“哪一个”，要与名词的性保持一致。
    example_gloss: 哪种咖啡更好？
  ru.a1.unit15.lesson02.teach.eto_kafe_bolshe:
    title: Это кафе больше, чем то.
    gloss: 这家咖啡馆比那家大。
    note: больше（“更大／更多”）加 чем 构成表示大小的比较句；это／то（“这个／那个”）用来指两家咖啡馆。
  ru.a1.unit15.lesson02.teach.menshe:
    title: меньше
    gloss: 更小／更少
    note: меньше（“更小／更少”）是 больше 的反义比较级。
    example_gloss: 那家咖啡馆比这家小。
  ru.a1.unit15.lesson02.teach.dom:
    title: дом
    gloss: 房子
    note: дом（“房子”）加 этот／тот（“这个／那个”），可以比较两座房子的大小。
    example_gloss: 这座房子比那座大。
  ru.a1.unit15.lesson03.teach.nastya_kakoye_kafe_luchshe:
    title: 娜佳问哪家咖啡馆更好
    gloss: 娜斯佳：哪家咖啡馆更好？
    note: Настя 以 Какое кафе лучше? 开场提问。
  ru.a1.unit15.lesson03.teach.dima_eto_kafe_luchshe:
    title: 季马回答
    gloss: 季马：这家咖啡馆比那家好。
    note: Дима 回答 Это кафе лучше, чем то.
  ru.a1.unit15.lesson03.teach.nastya_a_bolshe:
    title: 娜斯佳问大小，季马确认
    gloss: 娜斯佳：那这家咖啡馆更大吗？季马：是的，这家咖啡馆比那家大。
    note: Настя 问 А это кафе больше?，Дима 确认 Да, это кафе больше, чем то.
