teaching:
  ru.a1.unit06.lesson01.teach.u_menya_est:
    title: У меня есть ...
    gloss: 我有……
    note: 字面意思是“在我这儿（有）……”，是俄语表达“我有”的标准说法。第3单元的 У меня два брата 用的是同一个 У меня 句型；说明数量时通常省略 есть。
  ru.a1.unit06.lesson01.teach.eto:
    title: Это ...
    gloss: 这是……
    note: Это 用来介绍或指认某人或某物，不受其语法性别影响。
  ru.a1.unit06.lesson01.teach.mat_otets:
    title: мать, отец
    gloss: 母亲，父亲
    note: мать 属于俄语中少数以软音符号（-ь）结尾的阴性名词。
    example_gloss:
    - 这是我的母亲。
    - 这是我的父亲。
  ru.a1.unit06.lesson01.teach.brat_sestra:
    title: брат, сестра
    gloss: 哥哥/弟弟，姐姐/妹妹
    note: брат 就是第3单元数数时用过的词（“У меня два брата”）；сестра 是它的阴性对应词。俄语区分兄弟和姐妹，但不像汉语那样区分长幼。
    example_gloss:
    - 这是我的兄弟。
    - 我有一个姐妹。
  ru.a1.unit06.lesson01.teach.moy_moya:
    title: мой, моя
    gloss: 我的（阳性），我的（阴性）
    note: мой 用于 отец、брат 这类阳性名词；моя 用于 мать、сестра 这类阴性名词。
  ru.a1.unit06.lesson02.teach.babushka_dedushka:
    title: бабушка, дедушка
    gloss: 奶奶/外婆，爷爷/外公
    note: 两个词都以 -а 结尾，但 дедушка 指男性，在搭配时按阳性处理：мой дедушка，而 моя бабушка。俄语不区分父系和母系。
    example_gloss:
    - 这是我的祖母。
    - 这是我的祖父。
  ru.a1.unit06.lesson02.teach.muzh_zhena:
    title: муж, жена
    gloss: 丈夫，妻子
    note: муж 是阳性，жена 是阴性，符合名词词尾与性别的一般规律。
    example_gloss:
    - 这是我丈夫。
    - 这是我妻子。
  ru.a1.unit06.lesson02.teach.syn_doch:
    title: сын, дочь
    gloss: 儿子，女儿
    note: дочь 和 мать 一样，是以软音符号（-ь）结尾的阴性名词。
    example_gloss: 我有一个儿子和一个女儿。
  ru.a1.unit06.lesson02.teach.deti:
    title: дети
    gloss: 孩子们
    note: дети 是 ребёнок（“孩子”）的不规则复数——单数和复数是完全不同的词。
    example_gloss: 您有孩子吗？
  ru.a1.unit06.lesson02.teach.u_vas_est:
    title: У вас есть ...?
    gloss: 您有……吗？（正式）
    note: 用的是敬称 вас，与第2单元的 вы 用法一致。
  ru.a1.unit06.lesson03.teach.kto_eto:
    title: Кто это?
    gloss: 这是谁？
    note: 询问某人是谁的标准说法，例如看照片时。
  ru.a1.unit06.lesson03.teach.eyo_zovut:
    title: Её зовут Анна.
    gloss: 她叫安娜。
    note: 字面意思是“人们叫她安娜”——Её（“她”）是动词 зовут 的宾语，而不是主语。
  ru.a1.unit06.lesson03.teach.maksim_kto_eto:
    title: 马克西姆问起照片
    gloss: 马克西姆：照片上这是谁？
    note: 马克西姆指着照片，开口问 Кто это на фото?
  ru.a1.unit06.lesson03.teach.olga_moya_semya:
    title: 奥莉加介绍她的家人
    gloss: 奥莉加：这是我的家人。
    note: Это моя семья 中的 семья（“家庭”）是阴性名词，所以用 моя。
  ru.a1.unit06.lesson03.teach.olga_vot_otets:
    title: 奥莉加介绍三位家人
    gloss: 奥莉加：这是我的父亲、我的母亲和我的哥哥。
    note: Вот（“这是”）引出后面的列举；每个物主词（мой/моя）都要与后面的名词保持一致。
  ru.a1.unit06.lesson03.teach.maksim_a_kto_devochka:
    title: 马克西姆问起那个女孩
    gloss: 马克西姆：那这个女孩是谁？
    note: А 自然地引出马克西姆关于照片中第四个人的追问。
  ru.a1.unit06.lesson03.teach.olga_eto_moya_doch:
    title: 奥莉加说出女儿的名字
    gloss: 奥莉加：这是我的女儿。她叫安娜。
    note: 奥莉加先用 моя дочь 回答，然后用 Её зовут Анна 说出名字。
