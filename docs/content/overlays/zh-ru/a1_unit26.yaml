teaching:
  ru.a1.unit26.lesson01.teach.vysokiy_nevysokiy:
    title: 高和矮
    gloss: 高的／矮的
    note: '*Высокий* 形容个子高的人，*невысокий* 形容个子矮的人（字面意思是“不高”）。词尾随性别变化：*высокая*、*невысокая*。'
    example_gloss:
    - Lena 个子很高。
    - 伊戈尔个子不高。
  ru.a1.unit26.lesson01.teach.staryy_molodoy:
    title: 年老和年轻
    gloss: 年老的／年轻的
    note: 这里的 *старый* 和 *молодой* 表示对年龄的大致印象，而不是确切的岁数。
    example_gloss:
    - 爷爷年纪大了。
    - 季马很年轻。
  ru.a1.unit26.lesson01.teach.prilagatelnoe_menyaetsya_po:
    title: 形容词随性别变化
    gloss: 形容词要和所描述的人保持一致：*он высокий, она высокая*；*он старый, она старая*。
    note: 阳性形容词以 *-ый*、*-ий* 或 *-ой* 结尾（*высокий*、*молодой*）；阴性形容词以 *-ая* 结尾（*высокая*、*молодая*）。
  ru.a1.unit26.lesson01.teach.lena_vysokaya_a:
    title: 列娜个子高，而伊戈尔个子不高
    gloss: 列娜个子高，而伊戈尔个子不高。
    note: 用 *а*（而）把两个陈述并列在一起：*Лена высокая, а Игорь невысокий*。
  ru.a1.unit26.lesson02.teach.volosy:
    title: 头发
    gloss: 头发
    note: '*Волосы*（头发）在俄语中是复数：*У Насти светлые волосы*，没有单数形式的用法。'
    example_gloss: 季马有一头黑色短发。
  ru.a1.unit26.lesson02.teach.svetlye_kashtanovye_sedye:
    title: 金色、棕色和灰白色
    gloss: 金色的／棕色的／灰白的
    note: 三个表示发色的复数形容词，与 *волосы* 一致：*светлые*、*каштановые*、*седые*。
    example_gloss:
    - 娜斯佳是金发。
    - 伊戈尔是棕色头发。
    - 爷爷头发灰白。
  ru.a1.unit26.lesson02.teach.dlinnye_korotkie:
    title: 长和短（头发）
    gloss: 长的／短的（头发）
    note: '*Длинные*（长的）和 *короткие*（短的）也要与复数 *волосы* 保持一致。'
    example_gloss:
    - Lena 留着长发。
    - 伊戈尔是短发。
  ru.a1.unit26.lesson02.teach.volosy_stoyat_vo:
    title: 形容词与 волосы 一致
    gloss: '*Волосы* 是复数，所以形容词也用复数：*длинные волосы*、*короткие волосы*、*светлые волосы*、*чёрные волосы*。'
    note: 复数形容词以 *-ые* 或 *-ие* 结尾。下一课你会看到 *глаза* 也用同样的词尾。
  ru.a1.unit26.lesson02.teach.posle_u_imya:
    title: у 加属格
    gloss: 在 *у* 之后，拥有者要用属格：*у Насти*（娜斯佳有）、*у Димы*（季马有）、*у неё*（她有）。
    note: 俄语就是这样表达“有”的：*у* + 属格 + 所拥有的东西。这里不用“有”这个动词。
  ru.a1.unit26.lesson02.teach.u_dimy_korotkie:
    title: 季马有一头黑色短发
    gloss: 季马有一头黑色短发。
    note: '*Чёрные*（黑色的）与复数 *волосы* 一致。本课程中字母 *ё* 一律写出。'
  ru.a1.unit26.lesson02.teach.u_nasti_dlinnye:
    title: 娜斯佳有一头金色长发
    gloss: 娜斯佳有一头金色长发。
    note: 这个自然的句子结合了本课表示头发长度和颜色的词汇。
  ru.a1.unit26.lesson03.teach.glaza:
    title: 眼睛
    gloss: 眼睛
    note: '*Глаза*（眼睛）是 *глаз* 的复数；复数词尾是 *-а*。'
    example_gloss: 季马有棕色的眼睛。
  ru.a1.unit26.lesson03.teach.golubye_karie_zelyonye:
    title: 蓝色、棕色和绿色
    gloss: 蓝色的／棕色的／绿色的
    note: '*Голубые* 是浅蓝色，*карие* 是棕色（只用于眼睛），*зелёные* 是绿色。三个词都是复数。'
    example_gloss:
    - 娜斯佳有蓝眼睛。
    - 伊戈尔有棕色的眼睛。
    - Lena 有一双绿眼睛。
  ru.a1.unit26.lesson03.teach.glaza_stoyat_vo:
    title: 形容词与 глаза 一致
    gloss: '*Глаза* 是复数，所以形容词也用复数：*голубые глаза*、*карие глаза*、*зелёные глаза*。'
    note: 棕色的眼睛用 *карие*，不用 *коричневые*；棕色的头发用 *каштановые*：俄语中眼睛和头发用不同的词。
  ru.a1.unit26.lesson03.teach.kak_vyglyadit_nastya:
    title: 娜斯佳长什么样？
    gloss: 娜斯佳长什么样？
    note: '*Как выглядит ...?* 是本单元的核心问句。动词 *выглядит* 与单数主语搭配。'
  ru.a1.unit26.lesson03.teach.u_nasti_dlinnye:
    title: 娜斯佳有金色长发和蓝眼睛
    gloss: 娜斯佳有金色长发和蓝眼睛。
    note: 参考答案用 *и* 连接头发和眼睛：*У Насти длинные светлые волосы и голубые глаза*。
  ru.a1.unit26.lesson04.teach.nastya_v_yazykovoe:
    title: 娜斯佳介绍尼娜
    gloss: 娜斯佳：语言咖啡馆会来一个新女孩，她叫尼娜。
    note: '*Придёт*（会来）是完成体将来时。*Её зовут Нина* 字面意思是“大家叫她尼娜”。'
  ru.a1.unit26.lesson04.teach.dima_khorosho_kak:
    title: 季马问她长什么样
    gloss: 季马：好啊！她长什么样？
    note: 还是这个核心问句，这次用 *она*（她）代替了名字。
  ru.a1.unit26.lesson04.teach.nastya_ona_nevysokaya:
    title: 娜斯佳描述尼娜的身高和头发
    gloss: 娜斯佳：她个子不高，有一头浅色短发。
    note: 把第 1 课的 *невысокая* 和第 2 课的头发词汇结合起来。*И у неё* 引出第二个特点。
  ru.a1.unit26.lesson04.teach.dima_a_kakie:
    title: 季马问她的眼睛
    gloss: 季马：那她的眼睛呢？
    note: '*Какие у неё глаза?* 中的 *у неё* 表示“她有”。*неё* 是 *она* 在前置词 *у* 后面的形式。'
  ru.a1.unit26.lesson04.teach.nastya_u_neyo:
    title: 娜斯佳描述尼娜的眼睛
    gloss: 娜斯佳：她有一双绿眼睛。
    note: 沿用第3课的 *зелёные глаза*，并用 *у неё* 表示“她有”。
  ru.a1.unit26.lesson04.teach.dima_spasibo_togda:
    title: 季马会认出她
    gloss: 季马：谢谢！那我就能认出她了。
    note: '*Я её узнаю*（我会认出她）：因为尼娜是宾语，所以用 *она* 的宾格 *её*。'
  ru.a1.unit26.lesson05.teach.igor_i_lena:
    title: 比较伊戈尔和列娜
    gloss: 伊戈尔和列娜是兄妹，但他们长得不一样。伊戈尔个子不高，留着棕色短发，眼睛是褐色的。列娜比伊戈尔高，留着棕色长发，眼睛是绿色的。你长什么样？
    note: 这段简短的比较复习了目前学过的所有颜色和长度词，最后用本单元的核心问题询问你的外貌。
    glosses:
      брат: 兄弟
      сестра: 姐妹
      выглядят: 看起来
      по-разному: 不同的
      невысокий: 矮的
      короткие: 矮的
      каштановые: 棕色的
      волосы: 头发
      карие: 棕色的
      глаза: 眼睛
      выше: 更高的
      длинные: 长的
      зелёные: 绿色的
      выглядишь: 你看起来／显得（如 как ты выглядишь? 你长什么样？）
  ru.a1.unit26.lesson05.teach.posle_vyshe_stoit:
    title: 用 выше 做比较
    gloss: 在 *выше*（更高）之后，被比较的人用生格：*Лена выше Игоря*。
    note: 比较级 *выше* 不随性别变化。被比较的人用生格，或者放在 *чем* 之后。
  ru.a1.unit26.lesson05.teach.u_leny_volosy:
    title: 列娜的头发比伊戈尔的长
    gloss: 列娜的头发比伊戈尔的长。
    note: '*У Лены волосы длиннее, чем у Игоря*：*длиннее* 不变化，*чем*（比）引出后半部分。'
  ru.a1.unit26.lesson05.teach.u_menya_korotkie:
    title: 我留着棕色短发
    gloss: 我留着棕色短发。
    note: 描述自己外貌的范句：*У меня*（我有）+ 形容词 + 名词。
  ru.a1.unit26.lesson06.teach.dima_smotri_eto:
    title: 季马发现了尼娜
    gloss: 季马：看，那是尼娜吗？她有浅色短发和绿眼睛。
    note: '*Смотри*（看）是非正式的命令式，在前面的对话中用法相同。'
  ru.a1.unit26.lesson06.teach.nastya_da_eto:
    title: 娜斯佳确认
    gloss: 娜斯佳：对，是尼娜！
    note: 这是一个简短自然的肯定回答。
  ru.a1.unit26.lesson06.teach.nina_privet_ty:
    title: 尼娜向季马打招呼
    gloss: 尼娜：你好，你是季马吗？
    note: 一个简单的非正式问句：俄语不需要“是”这个动词，直接说 *Ты Дима?* 即可。
  ru.a1.unit26.lesson06.teach.dima_da_priyatno:
    title: 季马回应尼娜的问候
    gloss: 季马：是的！很高兴认识你，尼娜。
    note: '*Приятно познакомиться* 是初次见面的标准用语。*Познакомиться* 的意思是认识新朋友。'
  ru.a1.unit26.lesson06.teach.nina_mne_tozhe:
    title: Nina 回应问候
    gloss: Nina：我也很高兴认识你！
    note: 对话结束——季马根据娜斯佳之前的描述成功认出了尼娜。
