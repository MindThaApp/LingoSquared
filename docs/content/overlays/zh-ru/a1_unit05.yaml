teaching:
  ru.a1.unit05.lesson01.teach.kotoryy_chas:
    title: Который час?
    gloss: 现在几点？
    note: 询问时间的标准说法，字面意思是“哪一个小时”。
  ru.a1.unit05.lesson01.teach.seychas_chas:
    title: Сейчас час.
    gloss: 现在一点。
    note: 单独的“Час”就表示“一点钟”——这里俄语不说“один час”，和 2 以上的数词用法不同。
    example_gloss: 现在几点？——现在一点。
  ru.a1.unit05.lesson01.teach.dva_tri_chasa:
    title: два часа, три часа
    gloss: 两点，三点
    note: 在 два 和 три 之后，час 要用单数属格形式 часа，与第3单元的数词加名词规则一致。
    example_gloss:
    - 现在两点。
    - 现在三点。
  ru.a1.unit05.lesson01.teach.pyat_desyat_chasov:
    title: пять часов, десять часов
    gloss: 五点，十点
    note: 从 пять 起，час 变为复数属格形式 часов，同样与第3单元中 5 及以上的规则一致。
    example_gloss:
    - 现在五点。
    - 现在十点。
  ru.a1.unit05.lesson02.teach.v_kotorom_chasu:
    title: В котором часу?
    gloss: 几点？
    note: 用来询问某事在几点发生；而 Который час? 只是询问现在几点。
  ru.a1.unit05.lesson02.teach.utrom_dnem:
    title: утром, днём
    gloss: 早上，白天
    note: 这是 утро 和 день 的副词形式（工具格），使用时不加前置词。
    example_gloss:
    - 我早上喝咖啡。
    - 白天我工作。
  ru.a1.unit05.lesson02.teach.vecherom_nochyu:
    title: вечером, ночью
    gloss: 晚上，夜里
    note: 与 утром/днём 同样是工具格副词的构成方式。
    example_gloss:
    - 晚上我在家。
    - 夜里我睡觉。
  ru.a1.unit05.lesson02.teach.v_dva_chasa_dnya:
    title: В два часа дня.
    gloss: 下午两点。
    note: 在钟点后加 дня（день 的属格），说明是下午两点，而不是凌晨两点。
    example_gloss: 会议几点开始？——下午两点。
  ru.a1.unit05.lesson02.teach.v_sem_chasov_vechera:
    title: В семь часов вечера.
    gloss: 晚上七点。
    note: вечера（вечер 的属格）说明这个七点是晚上。
    example_gloss: 商店晚上七点关门。
  ru.a1.unit05.lesson03.teach.skazhite_pozhaluysta:
    title: Скажите, пожалуйста, который час?
    gloss: 请问，现在几点了？
    note: Скажите, пожалуйста 使问句更委婉，适合向陌生人询问。
  ru.a1.unit05.lesson03.teach.kogda_otkhodit:
    title: Когда отходит поезд?
    gloss: 火车什么时候开？
    note: Отходит（“出发”）是表示火车或公共汽车离站的标准动词。
  ru.a1.unit05.lesson03.teach.passazhir_vopros:
    title: 乘客询问时间
    gloss: 乘客：请问，现在几点了？
    note: 乘客用 Скажите, пожалуйста 礼貌地开口，适合向车站工作人员搭话。
  ru.a1.unit05.lesson03.teach.kassir_sem:
    title: 售票员回答
    gloss: 售票员：现在早上七点。
    note: Сейчас семь часов утра 说明当前时间，并用 утра（“早上”）表示清楚。
  ru.a1.unit05.lesson03.teach.passazhir_kogda:
    title: 乘客询问火车
    gloss: 乘客：那火车什么时候开？
    note: А 自然地引出乘客接着问的问题。
  ru.a1.unit05.lesson03.teach.kassir_vosem:
    title: 售票员告知发车时间
    gloss: 售票员：早上八点。
    note: В восемь часов утра 用前置词 в 加钟点和时段词来回答。
