    gloss: 现在是春天。郁金香很漂亮。尼娜问：你觉得哪个季节最美？季马说：我喜欢夏天。夏天我们去游泳。娜斯佳说：我喜欢冬天。冬天我们去滑冰。
    note: 用直接引语的方式复述语言咖啡馆里的对话。
