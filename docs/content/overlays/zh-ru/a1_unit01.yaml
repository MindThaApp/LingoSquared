teaching:
  ru.a1.unit01.lesson01.teach.direction:
    title: 阅读方向
    gloss: 俄语字母和汉语横排一样，从左向右阅读。
    note: 俄语（西里尔字母）的阅读方向与现代汉语横排相同，都是从左到右，所以这里不需要养成新的阅读习惯，只需学习新的字母形状和发音。
  ru.a1.unit01.lesson01.teach.letter_z:
    title: З з
    gloss: 字母 Z
    note: 发音类似英语 zoo 中的“z”，即浊辅音 z。小写 з 看起来像数字 3。
  ru.a1.unit01.lesson01.teach.letter_d:
    title: Д д
    gloss: 字母 D
    note: 发音类似英语 door 中的“d”。小写 д 像大写的缩小版，底部有短短的“小脚”，和拉丁字母 d 完全不像，所以要把它当作全新的字形来记。
  ru.a1.unit01.lesson01.teach.letter_r:
    title: Р р
    gloss: 字母 R
    note: 发音是大舌音（打舌的“r”），不同于汉语普通话的“r”。字形像拉丁字母“P”，是典型的“假朋友”字形，不要读成“p”。
  ru.a1.unit01.lesson01.teach.letter_a:
    title: А а
    gloss: 字母 A
    note: 发音类似汉语拼音的“a”（如“啊”）。字形与拉丁字母 A/a 相同，发音也很接近。
  ru.a1.unit01.lesson01.teach.letter_v:
    title: В в
    gloss: 字母 V
    note: 发音类似英语 van 中的“v”，即浊的唇齿音。字形像拉丁字母“B”，也是要留意的“假朋友”字形。
  ru.a1.unit01.lesson01.teach.letter_s:
    title: С с
    gloss: 字母 S
    note: 发音类似汉语拼音的“s”。字形和发音都像拉丁字母 C/c，但在俄语中它从不读作“k”。
  ru.a1.unit01.lesson01.teach.letter_t:
    title: Т т
    gloss: 字母 T
    note: 发音类似“t”，但不送气（比汉语拼音的 t 轻）。小写 т 手写时有时像小写的“m”，这里先学印刷体的形状。
  ru.a1.unit01.lesson01.teach.letter_u:
    title: У у
    gloss: 字母 U
    note: 发音类似汉语拼音的“u”（如“乌”）。字形像拉丁字母“y”，但读音和这个字形看上去的样子并不对应。
  ru.a1.unit01.lesson01.teach.letter_ye:
    title: Е е
    gloss: 字母 Ye
    note: 在词首或音节开头发类似“ye”（如“耶”）的音。字形与拉丁字母 E/e 相同，但读音很不一样。
  ru.a1.unit01.lesson01.teach.hard_sign_note:
    title: ъ 与 ь：硬音符号和软音符号
    gloss: 硬音符号 ъ 和软音符号 ь 本身不发音，它们会改变相邻字母的发音。
    note: 这两个符号本身都不代表任何音：ь 使前面的辅音变软，ъ 表示前后两个音要明确分开。等真正的单词用到它们时，我们还会再讲。
  ru.a1.unit01.lesson01.teach.letter_short_i:
    title: Й й
    gloss: 字母 短 И
    note: 发音类似英语 boy 中的“y”，是一个快速滑过的音，不是完整的元音。它出现在本课最终要学的单词 Здравствуйте 中。
  ru.a1.unit01.lesson01.teach.zdravstvuyte_shape:
    title: Здравствуйте
    gloss: 您好（正式）
    note: 完整的正式问候语，由刚学的字母组成。它看起来很长，辅音很多，但其中每个字母本课都已经学过了。
    example_gloss: 您好！我叫维克多。
  ru.a1.unit01.lesson02.teach.zdravstvuyte_privet:
    title: Здравствуйте, Привет
    gloss: 您好（正式）；你好（非正式）
    note: Здравствуйте 是稳妥的通用正式问候语，适用于一天中任何时间和任何陌生人。Привет 比较随意，用于朋友和同辈之间。
    example_gloss:
    - 您好！您好吗？（正式）
    - 你好！最近怎么样？（非正式）
  ru.a1.unit01.lesson02.teach.dobroe_utro:
    title: Доброе утро!
    gloss: 早上好
    note: 用于早晨，大约到上午晚些时候为止。
  ru.a1.unit01.lesson02.teach.dobryy_den:
    title: Добрый день!
    gloss: 日安／你好
    note: 标准的白天问候语，从上午晚些时候到下午都可以使用。
  ru.a1.unit01.lesson02.teach.dobryy_vecher:
    title: Добрый вечер!
    gloss: 晚上好
    note: 晚上到达某处时使用，它是见面时的问候，不是告别语。
  ru.a1.unit01.lesson02.teach.register_note:
    title: 如何选择问候语
    gloss: Здравствуйте 适用于一天中任何时间和礼貌的场合。Привет 是非正式的，用于朋友之间。
    note: 如果拿不准时间或对方身份，用 Здравствуйте 总是稳妥的；Привет 只用于你已经很熟悉的人。
  ru.a1.unit01.lesson03.teach.kak_dela:
    title: Как дела?
    gloss: 你好吗？（非正式）
    note: 日常非正式地询问对方近况的说法，用于朋友和同辈之间。
  ru.a1.unit01.lesson03.teach.kak_pozhivaete:
    title: Как поживаете?
    gloss: 您好吗？
    note: 询问对方近况的正式说法，与“вы”（您）的语体相配。
  ru.a1.unit01.lesson03.teach.horosho_spasibo:
    title: Хорошо, спасибо
    gloss: 很好，谢谢
    note: 简单而积极的回答，正式和非正式场合都可以用。
    example_gloss: 你好吗？——很好，谢谢。
  ru.a1.unit01.lesson03.teach.tak_sebe:
    title: Так себе
    gloss: 一般般
    note: 中性偏略消极的回答，用于情况不好不坏的时候。
    example_gloss: 你好吗？——一般般。
  ru.a1.unit01.lesson03.teach.a_u_tebya:
    title: А у тебя?
    gloss: 你呢？
    note: 把问题反问给对方的非正式说法，与“ты”（你）的语体相配。
  ru.a1.unit01.lesson03.teach.do_svidaniya:
    title: До свидания!
    gloss: 再见（中性／正式）
    note: 标准的通用告别语，字面意思接近“直到我们再见面”。
  ru.a1.unit01.lesson03.teach.poka:
    title: Пока!
    gloss: 拜拜（非正式）
    note: 随意的告别语，在朋友和熟人之间非常常见。
  ru.a1.unit01.lesson03.teach.do_zavtra:
    title: До завтра!
    gloss: 明天见
    note: 友好的告别语，用于预计第二天还会见到对方的时候。
  ru.a1.unit01.lesson03.teach.anna:
    title: 安娜向马克西姆问好
    gloss: 安娜说：你好！你好吗？
    note: 安娜和马克西姆是同事，白天互相问候，从 дела 可以看出两人的熟悉程度（非正式语体）。
  ru.a1.unit01.lesson03.teach.maksim_reply:
    title: 马克西姆回答并反问
    gloss: 马克西姆说：很好，谢谢。你呢？
    note: 马克西姆回答后以非正式的方式反问，与安娜的语体一致。
  ru.a1.unit01.lesson03.teach.anna_close:
    title: 安娜结束对话
    gloss: 安娜说：我也很好。那么，明天见！
    note: 安娜结束了寒暄，友好地道别。
  ru.a1.unit01.lesson03.teach.maksim_close:
    title: 马克西姆道别
    gloss: 马克西姆说：明天见！
    note: 马克西姆重复安娜的道别语，结束了对话。
