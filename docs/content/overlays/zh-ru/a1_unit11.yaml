  ru.a1.unit11.lesson03.teach.mariya_vstayu_zavtrakayu:
    title: 玛丽亚描述她的早晨
    gloss: 玛丽亚：我七点起床，然后八点吃早饭。
    note: Мария 按先后顺序说了两件事，用 потом（“然后”）连接。
  ru.a1.unit11.lesson03.teach.oleg_kogda_rabotayete:
    title: 奥列格问工作时间
    gloss: 奥列格：那您什么时候工作？
    note: А 自然地引出 Олег 接下来的问题。
  ru.a1.unit11.lesson03.teach.mariya_rabotayu_uzhinayu:
    title: 玛丽亚描述一天中其余的时间
    gloss: 玛丽亚：我从九点工作到五点。晚上我吃晚饭，十一点睡觉。
