  ru.a1.unit11.lesson01.teach.vstayu:
    title: встаю
    gloss: 我起床
    note: встаю 是动词 вставать（“起床”）的第一人称单数形式；встаёте 是对 вы 使用的形式，用来问别人。
    example_gloss: 我七点起床。
  ru.a1.unit11.lesson01.teach.zavtrakayu:
    title: завтракаю
    gloss: 我吃早饭
    note: завтракаю 是动词 завтракать（“吃早饭”）的第一人称单数形式。
    example_gloss: 我八点吃早餐。
  ru.a1.unit11.lesson01.teach.kogda:
    title: Когда вы встаёте?
    gloss: 您什么时候起床？
    note: Когда 意思是“什么时候”；вы 是礼貌的单数“您”或复数的“你们”。
  ru.a1.unit11.lesson02.teach.rabotayu:
    title: работаю
    gloss: 我工作
    note: работаю 是动词 работать（“工作”）的第一人称单数形式；с ... до ... 表示时间段“从……到……”。
    example_gloss: 我从九点工作到五点。
  ru.a1.unit11.lesson02.teach.uzhinayu:
    title: ужинаю
    gloss: 我吃晚饭
    note: ужинаю 是动词 ужинать（“吃晚饭”）的第一人称单数形式；вечером 意思是“在晚上”。
    example_gloss: 晚上我吃晚饭。
  ru.a1.unit11.lesson02.teach.lozhus_spat:
    title: ложусь спать
    gloss: 我睡觉
    note: ложусь спать 含有反身动词（字面意思是“躺下睡觉”），意思是“去睡觉”。
    example_gloss: 我十一点睡觉。
