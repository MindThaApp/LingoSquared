teaching:
  ru.a1.unit12.lesson01.teach.davay:
    title: Давай пойдём...
    gloss: 咱们去……吧
    note: Давай 是非正式的提议标记（“咱们……吧”）；пойдём 是“去”的“我们”将来时形式，两者连用来提议做某事。
  ru.a1.unit12.lesson01.teach.kino:
    title: кино
    gloss: 电影院／电影
    note: кино 是不变格的中性名词，意为“电影院／电影”。
    example_gloss: 咱们去看电影吧。
  ru.a1.unit12.lesson01.teach.zavtra_subbotu:
    title: завтра, в субботу
    gloss: 明天，在周六
    note: завтра 意为“明天”；в субботу 表示星期几时用 в 加第四格。
    example_gloss: 咱们明天去看电影吧。
  ru.a1.unit12.lesson02.teach.soglasen:
    title: Хорошо, я согласен.
    gloss: 好的，我同意。
    note: согласен（“同意”）由男性说话人使用；女性要说 согласна。
  ru.a1.unit12.lesson02.teach.ne_mogu:
    title: К сожалению, я не могу.
    gloss: 很遗憾，我不能去。
    note: К сожалению（“很遗憾”）能让拒绝的语气更委婉；не могу 意为“我不能”。
  ru.a1.unit12.lesson02.teach.vo_skolko:
    title: Во сколько мы встретимся?
    gloss: 我们几点见面？
    note: Во сколько 用来问钟点；встретимся 是“见面”的“我们”将来时形式。
    example_gloss: 咱们就定七点吧。
  ru.a1.unit12.lesson03.teach.nastya_davay_poydyom:
    title: 娜斯佳提出计划
    gloss: 娜斯佳：咱们周六去看电影吧。
    note: Настя 以 Давай пойдём в кино в субботу 开场。
  ru.a1.unit12.lesson03.teach.dima_horosho_soglasen:
    title: 季马同意并询问时间
    gloss: 季马：好的，我同意。我们几点见面？
    note: Дима 先答应，然后问 Во сколько мы встретимся?
  ru.a1.unit12.lesson03.teach.nastya_davay_v_sem:
    title: 娜斯佳提出时间和地点
    gloss: 娜斯佳：就定七点，在电影院门口吧。
    note: у кинотеатра 意为“在电影院旁／门口”，用 у 加第二格。
  ru.a1.unit12.lesson03.teach.dima_otlichno:
    title: 季马确认
    gloss: 季马：太好了，周六见。
    note: Отлично, до субботы 用来结束对话；до субботы 字面意思是“到周六为止”。
