teaching:
  ru.a1.unit07.lesson01.teach.menyu:
    title: меню
    gloss: 菜单
    note: меню 是借自法语的不变格中性名词，形式永远不变。
    example_gloss: 这是菜单。
  ru.a1.unit07.lesson01.teach.ofitsiant:
    title: официант, официантка
    gloss: 男服务员，女服务员
    note: официант 是阳性，официантка 是阴性，符合常规的性别词尾规律。
    example_gloss: 女服务员在餐厅工作。
  ru.a1.unit07.lesson01.teach.stol_svoboden:
    title: Этот столик свободен?
    gloss: 这张桌子有人吗？
    note: столик 是 стол（“桌子”）的指小形式，常用来指餐厅的小桌；свободен（“空着的”）与阳性名词一致。
  ru.a1.unit07.lesson01.teach.da_saditites:
    title: Да, садитесь, пожалуйста.
    gloss: 有空，请坐。
    note: садитесь 是 садиться（“坐下”）的礼貌式／复数命令式，与 вы 搭配使用。
  ru.a1.unit07.lesson01.teach.chto_budete_zakazyvat:
    title: Что будете заказывать?
    gloss: 您要点什么？
    note: будете заказывать 是将来时短语（“将要点”），服务员用它来询问顾客想要什么。
  ru.a1.unit07.lesson02.teach.ya_khochu:
    title: Я хочу ...
    gloss: 我要……
    note: хочу 是 хотеть（“想要”）的第一人称单数形式，用于点餐点饮料。
  ru.a1.unit07.lesson02.teach.chay_kofe:
    title: чай, кофе
    gloss: 茶，咖啡
    note: чай 和 кофе 都是常点的饮料；кофе 不变格，尽管以 -е 结尾，语法上却是阳性。
    example_gloss:
    - 我要茶。
    - 我要咖啡。
  ru.a1.unit07.lesson02.teach.khleb_borshch:
    title: хлеб, борщ
    gloss: 面包，罗宋汤（红菜汤）
    note: борщ 是经典的俄式红菜汤；这两个名词都是阳性。
    example_gloss:
    - 你们有面包吗？
    - 我要罗宋汤。
  ru.a1.unit07.lesson02.teach.salat:
    title: салат
    gloss: 沙拉
    note: и（“和”）在这里用来连接两样点的东西，如 борщ и салат。
    example_gloss: 我要罗宋汤和沙拉。
  ru.a1.unit07.lesson03.teach.morozhenoe:
    title: мороженое
    gloss: 冰淇淋
    note: мороженое 是中性名词，形式像形容词（“冷冻的东西”），这是俄语食物名词中常见的模式。
    example_gloss: 甜点请上冰淇淋。
  ru.a1.unit07.lesson03.teach.prinesite:
    title: Принесите, пожалуйста, ...
    gloss: 请拿……来
    note: Принесите 是 принести（“拿来”）的礼貌式／复数命令式，与 вы 搭配使用。
  ru.a1.unit07.lesson03.teach.spasibo:
    title: Спасибо.
    gloss: 谢谢。
    note: Спасибо 是任何礼貌场合表示感谢的标准说法。
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_budete:
    title: 女服务员询问点什么
    gloss: 女服务员：您要点什么？
    note: 女服务员一开口就问 Что будете заказывать?
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_borshch:
    title: 游客点餐
    gloss: 游客：我要罗宋汤和沙拉。
    note: Турист（“游客”）用 Я хочу борщ и салат 来回答。
  ru.a1.unit07.lesson03.teach.ofitsiantka_chto_pit:
    title: 女服务员询问饮料
    gloss: 女服务员：您喝什么？
    note: пить（“喝”）与 будете 搭配，与前面的 заказывать 问句相呼应。
  ru.a1.unit07.lesson03.teach.turist_ya_khochu_chay:
    title: 游客点饮料
    gloss: 游客：我要茶。
    note: 游客简单地用 Я хочу чай 回答。
  ru.a1.unit07.lesson03.teach.ofitsiantka_a_na_sladkoe:
    title: 女服务员询问甜点
    gloss: 女服务员：那甜点呢？
    note: А на сладкое? 是省略的追问，意思是“那甜的（一道）呢？”
  ru.a1.unit07.lesson03.teach.turist_na_sladkoe:
    title: 游客点甜点
    gloss: 游客：甜点请上冰淇淋。
    note: 游客用 На сладкое принесите мороженое, пожалуйста 来回答。
  ru.a1.unit07.lesson03.teach.ofitsiantka_khorosho:
    title: 女服务员确认点单
    gloss: 女服务员：好的，谢谢。
    note: Хорошо（“好的”）用来确认点单，Спасибо 则礼貌地结束这次交流。
