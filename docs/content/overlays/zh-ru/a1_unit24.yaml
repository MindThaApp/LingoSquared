teaching:
  ru.a1.unit24.lesson01.teach.mozhno_kartoy:
    title: Можно картой?
    gloss: 可以刷卡吗？
    note: картой 是 карта 的工具格形式，用于表示刷卡付款。
    example_gloss: 今天我可以用卡付款吗？
  ru.a1.unit24.lesson01.teach.nalichnymi:
    title: наличными
    gloss: 用现金
    note: наличными 表示用现金付款。
    example_gloss: 可以用现金。
  ru.a1.unit24.lesson01.teach.rubli:
    title: рубли
    gloss: 卢布
    note: рубли 是货币名称；在许多数字之后会用 рублей。
    example_gloss: 我需要卢布。
  ru.a1.unit24.lesson02.teach.chek_nuzhen:
    title: Чек нужен?
    gloss: 您需要收据吗？
    note: нужен 与阳性名词 чек 保持一致。
    example_gloss: 您今天需要收据吗？
  ru.a1.unit24.lesson02.teach.s_vas_trista:
    title: С вас триста рублей.
    gloss: 一共三百卢布。
    note: С вас... 是收银员告知应付金额时常用的说法。
    example_gloss: 今天一共三百卢布。
  ru.a1.unit24.lesson02.teach_tolko_nalichnymi:
    title: Только наличными.
    gloss: 只收现金。
    note: Только 的意思是“只”。
    example_gloss: 今天只收现金。
  ru.a1.unit24.lesson03.teach.dima_mozhno_kartoy:
    title: 季马询问能否刷卡
    gloss: 季马：可以刷卡吗？
    note: 这句话用来询问是否接受某种付款方式。
  ru.a1.unit24.lesson03.teach.kassir_da_s_vas:
    title: 收银员说出金额
    gloss: 收银员：可以。一共三百卢布。
    note: 收银员确认可以刷卡，并说出金额。
  ru.a1.unit24.lesson03.teach.dima_vot_karta:
    title: 季马递上银行卡
    gloss: 季马：这是我的卡。
    note: Вот карта 是递东西时的简单用语。
  ru.a1.unit24.lesson03.teach.kassir_chek:
    title: 收银员询问是否需要收据
    gloss: 收银员：谢谢。您需要收据吗？
    note: Чек нужен? 用来询问是否需要收据。
  ru.a1.unit24.lesson03.teach.dima_da_pozhaluysta:
    title: 季马要收据
    gloss: 季马：好的，请开。
    note: Да, пожалуйста 表示接受对方提出的收据。
