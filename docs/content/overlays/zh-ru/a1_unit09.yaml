teaching:
  ru.a1.unit09.lesson01.teach.gde:
    title: где
    gloss: 哪里
    note: где 用来询问位置，常与 находится 搭配。
    example_gloss: 商店在哪里？
  ru.a1.unit09.lesson01.teach.nakhoditsya:
    title: находится
    gloss: 位于
    note: находится 是 находиться（“位于”）的第三人称单数形式，与 магазин 这样的单数主语连用。
    example_gloss: 商店位于哪里？
  ru.a1.unit09.lesson01.teach.ulitsa:
    title: улица
    gloss: 街道
    note: улица 是阴性名词；на Тверской улице（“在特维尔大街上”）中，улице 是 на 之后的前置格。
    example_gloss: 商店在特维尔大街上。
  ru.a1.unit09.lesson01.teach.gde_nakhoditsya_magazin:
    title: Где находится магазин?
    gloss: 商店在哪里？
    note: 询问任何地方位置的标准问句。
  ru.a1.unit09.lesson02.teach.bank_apteka:
    title: банк, аптека
    gloss: 银行，药店
    note: банк 是阳性，аптека 是阴性——都是城里常见的地方。
    example_gloss:
    - 银行在哪里？
    - 药店在哪里？
  ru.a1.unit09.lesson02.teach.vokzal_gostinitsa:
    title: вокзал, гостиница
    gloss: 火车站，旅馆
    note: вокзал 是阳性，гостиница 是阴性。
    example_gloss:
    - 火车站在哪里？
    - 旅馆在哪里？
  ru.a1.unit09.lesson02.teach.restoran_biblioteka:
    title: ресторан, библиотека
    gloss: 餐厅，图书馆
    note: ресторан 是阳性，библиотека 是阴性；Чайковского、Пушкина 这类街名放在 улица 之后，用生格。
    example_gloss:
    - 餐厅在哪里？
    - 图书馆在哪里？
  ru.a1.unit09.lesson03.teach.chto_est_na_vashey_ulitse:
    title: Что есть на вашей улице?
    gloss: 您的街上有什么？
    note: вашей 是敬称的“您的”，与阴性名词 улице 一致，用前置格。
  ru.a1.unit09.lesson03.teach.anna_chto_est:
    title: 安娜询问街上有什么
    gloss: 安娜：您的街上有什么？
    note: 安娜用 Что есть на вашей улице? 开启对话。
  ru.a1.unit09.lesson03.teach.viktor_na_moey_ulitse:
    title: 维克多列举三个地方
    gloss: 维克多：我的街上有商店、图书馆和银行。
    note: На моей улице есть 用 есть（“有”）列举事物，并用 и 连接。
  ru.a1.unit09.lesson03.teach.anna_a_gde_bank:
    title: 安娜问银行在哪里
    gloss: 安娜：那银行在哪里？
    note: А 自然地引出安娜对维克多提到的其中一个地方的追问。
  ru.a1.unit09.lesson03.teach.viktor_bank_na_pushkina:
    title: 维克多说出银行所在的街道
    gloss: 维克多：银行在普希金街。
    note: 维克多回答 Банк на улице Пушкина，улице 之后的 Пушкина 用生格。
  ru.a1.unit09.lesson03.teach.anna_spasibo_bolshoe:
    title: 安娜向维克多道谢
    gloss: 安娜：非常感谢。
    note: Спасибо большое 在 спасибо 后加上 большое（“大的”），是常用的“非常感谢”的说法。
  ru.a1.unit09.lesson03.teach.viktor_pozhaluysta:
    title: 维克多回应
    gloss: 维克多：不客气。
    note: Пожалуйста 用来回应 спасибо，意思是“不客气”。
