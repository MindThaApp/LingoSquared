teaching:
  ru.a1.unit10.lesson01.teach.kak_doyti:
    title: Как дойти до...?
    gloss: 去……怎么走?
    note: Как дойти до...? 是向陌生人询问去某地怎么走的标准礼貌说法,后面接第二格(属格)形式的目的地。
  ru.a1.unit10.lesson01.teach.muzeya:
    title: музей
    gloss: 博物馆
    note: музей 是阳性名词;музея 是它的第二格(属格)形式,用在 до(“到、直到”)之后。
    example_gloss: 去博物馆怎么走?
  ru.a1.unit10.lesson01.teach.pryamo:
    title: прямо
    gloss: 一直往前
    note: прямо 表示直走;Идите 是“走”的礼貌命令式。
    example_gloss: 一直往前走。
  ru.a1.unit10.lesson01.teach.napravo:
    title: направо
    gloss: 向右
    note: направо 表示移动的方向(向右拐);потом 的意思是“然后”。
    example_gloss: 直走,然后向右。
  ru.a1.unit10.lesson02.teach.nalevo:
    title: налево
    gloss: 向左
    note: налево 表示移动的方向,与 направо 相对。
    example_gloss: 向左转。
  ru.a1.unit10.lesson02.teach.povernite:
    title: поверните
    gloss: 转弯(礼貌的命令式)
    note: поверните 是 повернуть(“转弯”)的礼貌命令式;за углом 的意思是“在拐角处”。
    example_gloss: 在拐角处向左转。
  ru.a1.unit10.lesson02.teach.kvartal_daleko:
    title: квартал, далеко
    gloss: 街区,远
    note: квартал 是城市中的一个街区(два 之后用 квартала);далеко 的意思是“远”,отсюда 的意思是“从这里”。
    example_gloss:
    - 走两个街区。
    - 那里离这儿远吗?
  ru.a1.unit10.lesson03.teach.tourist_prostite:
    title: 游客问路
    gloss: 游客:请问,去博物馆怎么走?
    note: 游客先说 Простите(“打扰一下”),再问 Как дойти до музея?
  ru.a1.unit10.lesson03.teach.prokhozhiy_eto_prosto:
    title: 路人指路
    gloss: 路人:很简单。直走两个街区,然后向右转。
    note: Прохожий 先回答 Это очень просто,然后用 Идите 和 поверните 给出两步指路。
  ru.a1.unit10.lesson03.teach.tourist_daleko:
    title: 游客问远不远
    gloss: 游客:那里离这儿远吗?
    note: Это далеко отсюда? 是接着确认步行的距离。
  ru.a1.unit10.lesson03.teach.prokhozhiy_pyat_minut:
    title: 路人估算时间
    gloss: 路人:不远,步行五分钟。
    note: Прохожий 回答 Нет, пять минут пешком(“步行”)。
  ru.a1.unit10.lesson03.teach.tourist_spasibo:
    title: 游客向路人道谢
    gloss: 游客:非常感谢。
    note: Спасибо большое 礼貌地结束这段对话。
  ru.a1.unit10.lesson03.teach.prokhozhiy_pozhaluysta:
    title: 路人回应
    gloss: 路人:不客气。
    note: Пожалуйста 用来回应 спасибо,意思是“不客气”。
