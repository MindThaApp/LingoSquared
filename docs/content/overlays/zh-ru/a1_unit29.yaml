  ru.a1.unit29.lesson04.teach.peshkom_idut_a:
    title: идти 和 ехать
    gloss: 俄语表示“去”有两个动词：*идти* 指步行，*ехать* 指乘坐交通工具：*Я иду пешком, я еду на велосипеде.*
    note: 要按出行方式选动词：步行不能用 *ехать*，坐火车不能用 *идти*。
  ru.a1.unit29.lesson04.teach.dima_togda_ya:
    title: 季马回答
    gloss: 季马：那我就和娜斯佳一起坐火车去。
  ru.a1.unit29.lesson05.teach.nastya_kazhdyy_den:
    title: 谁怎么出行？
    gloss: 娜斯佳每天坐火车去上班。季马一般骑自行车，但下雨的时候他也坐火车。伊戈尔更喜欢开车。列娜住得近，步行去上班。你怎么去上班？
    note: 一篇对比四种上班方式的短文，还有一个条件（下雨）：*обычно ... но когда идёт дождь ...*。
