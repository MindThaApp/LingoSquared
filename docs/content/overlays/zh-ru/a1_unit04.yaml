teaching:
  ru.a1.unit04.lesson01.teach.kakoy_den:
    title: Какой сегодня день?
    gloss: 今天星期几？
    note: Какой 与阳性名词 день（“天，日子”）保持一致。
  ru.a1.unit04.lesson01.teach.ponedelnik_vtornik:
    title: понедельник, вторник
    gloss: 星期一，星期二
    note: 俄语中星期名称不大写（汉语本来也没有大小写之分），只在句首才大写首字母。
    example_gloss:
    - 今天是星期一。
    - 今天是星期二。
  ru.a1.unit04.lesson01.teach.sreda_chetverg:
    title: среда, четверг
    gloss: 星期三，星期四
    note: 和所有俄语星期名称一样，среда 和 четверг 都用小写书写，只有在句首才大写。
    example_gloss:
    - 今天是星期三。
    - 今天是星期四。
  ru.a1.unit04.lesson01.teach.pyatnitsa_subbota:
    title: пятница, суббота
    gloss: 星期五，星期六
    note: суббота 里有两个 б，是常见的拼写陷阱。
    example_gloss:
    - 今天是星期五。
    - 今天是星期六。
  ru.a1.unit04.lesson01.teach.voskresenye:
    title: воскресенье
    gloss: 星期日
    note: 俄语星期名称列表中的最后一天。
    example_gloss: 今天是星期日。
  ru.a1.unit04.lesson01.teach.segodnya:
    title: Сегодня ...
    gloss: 今天是……
    note: Сегодня 加星期名称时不需要系动词，和汉语“今天星期三”一样，不用“是”。
  ru.a1.unit04.lesson02.teach.kakoe_chislo:
    title: Какое сегодня число?
    gloss: 今天是几月几号?
    note: Какое 与中性名词 число（“日期，号数”）一致，不同于上面的 какой день。
  ru.a1.unit04.lesson02.teach.pervoe_tretye:
    title: первое, третье
    gloss: 1日，3日
    note: 表示日期的序数词用中性词尾（-ое/-ье），与省略的名词 число 一致。
    example_gloss:
    - 今天是1月1日。
    - 今天是1月3日。
  ru.a1.unit04.lesson02.teach.pyatoe_desyatoe:
    title: пятое, десятое
    gloss: 5日，10日
    note: 与 первое、третье 相同的中性序数词形式。
    example_gloss:
    - 今天是10月5日。
    - 今天是4月10日。
  ru.a1.unit04.lesson02.teach.yanvar_aprel:
    title: января, апреля
    gloss: 1月的、4月的
    note: 说日期时，月份名称要变为第二格（属格），所以 январь 变成 января，апрель 变成 апреля。
    example_gloss:
    - 今天是1月3日。
    - 今天是4月10日。
  ru.a1.unit04.lesson02.teach.oktyabrya:
    title: октября
    gloss: 十月
    note: октябрь 的属格形式，用法与 января/апреля 相同，放在日期之后。
    example_gloss: 今天是10月5日。
  ru.a1.unit04.lesson03.teach.kakoe_segodnya_chislo:
    title: Какое сегодня число?
    gloss: 今天是几月几号?
    note: 询问日历日期的标准说法。
  ru.a1.unit04.lesson03.teach.vo_vtornik:
    title: во вторник
    gloss: 在星期二
    note: 介词 в 在 вторник 前变成 во，以便发音更顺口；вторник 本身在这里形式不变（阴性的星期名称则会变化：в среду、в пятницу、в субботу）。
  ru.a1.unit04.lesson03.teach.vstrecha:
    title: встреча
    gloss: 会面;见面
    note: 常用名词，指已安排好的会面或约见。
    example_gloss: 会议在星期二。
  ru.a1.unit04.lesson03.teach.anna_kakoy_den:
    title: 安娜问今天星期几
    gloss: 安娜：今天星期几？
    note: 安娜用第一课学过的 день 问句开启对话。
  ru.a1.unit04.lesson03.teach.viktor_sreda:
    title: 维克托回答星期和日期
    gloss: 维克托：今天是星期三，1月3日。
    note: 维克托同时说出了星期和序数词日期，月份用属格形式 января。
  ru.a1.unit04.lesson03.teach.anna_khorosho:
    title: 安娜提议星期二
    gloss: 安娜：好的。会议在星期二吗？
    note: 安娜先用 Хорошо 回应维克托的回答，再提出后续问题。
  ru.a1.unit04.lesson03.teach.viktor_da:
    title: 维克托确认日期
    gloss: 维克托：对，在星期二，1月9日。
    note: Да 表示确认，然后维克托重复了星期和日期。要说某事发生在哪一天，序数词本身要用属格：девятого января（“在1月9日”），对比 Сегодня девятое января（“今天是1月9日”）。
