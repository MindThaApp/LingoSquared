teaching:
  ru.a1.unit03.lesson01.teach.u_menya:
    title: У меня ...
    gloss: 我有……
    note: 字面意思是“在我这里（有）……”，这是俄语表达“我有”的标准说法；俄语这里不用像汉语“有”那样的动词。
  ru.a1.unit03.lesson01.teach.odin_dva:
    title: один, два
    gloss: 一，二
    note: 在 два（“二”）之后，名词要用单数二格形式——брат（“哥哥／弟弟”）变成 брата。汉语的名词不变形，而俄语名词要随数字变化。
    example_gloss:
    - 我有一个兄弟。
    - 我有两个兄弟。
  ru.a1.unit03.lesson01.teach.tri_chetyre:
    title: три, четыре
    gloss: 三，四
    note: Три 和 четыре 后面的名词形式与 два 相同，都用单数二格——在 два／три／четыре 之后，книга（“书”）变成 книги。
    example_gloss:
    - 我有三本书。
    - 我有四本书。
  ru.a1.unit03.lesson01.teach.pyat:
    title: пять
    gloss: 五
    note: 从 пять（“五”）起，名词改用复数二格——рубль（“卢布”）变成 рублей，而不是 рубли。
    example_gloss: 我有五卢布。
  ru.a1.unit03.lesson01.teach.brat_bratya:
    title: брат, брата
    gloss: 兄弟；兄弟（用于2–4之后）
    note: брата 是专用于 два、три、четыре 之后的单数二格形式，不是普通的复数。
    example_gloss: 我有两个兄弟。
  ru.a1.unit03.lesson01.teach.kniga_knigi:
    title: книга, книги
    gloss: 书；书（用于2–4之后）
    note: книги 与 брата 的规律相同，都是用于 два、три、четыре 之后的单数二格。
    example_gloss: 我有三本书。
  ru.a1.unit03.lesson01.teach.rubl_rubley:
    title: рубль, рублей
    gloss: 卢布；卢布（用于5及以上）
    note: рублей 是从 пять（“五”）起使用的复数二格形式。
    example_gloss: 我有五卢布。
  ru.a1.unit03.lesson02.teach.shest_sem:
    title: шесть, семь
    gloss: 六，七
    note: 和 пять 一样，шесть 和 семь 后面的名词都用复数二格。
    example_gloss:
    - 现在是六点。
    - 我有七卢布。
  ru.a1.unit03.lesson02.teach.vosem_devyat:
    title: восемь, девять
    gloss: 八，九
    note: 两者都延续复数二格的规律：книга 变成 книг，рубль 变成 рублей。
    example_gloss:
    - 我有八本书。
    - 我有九卢布。
  ru.a1.unit03.lesson02.teach.desyat:
    title: десять
    gloss: 十
    note: 也用于表示年龄，如 Мне десять лет（“我十岁”）。
    example_gloss: 我十岁。
  ru.a1.unit03.lesson02.teach.kniga_genitive_plural:
    title: книг
    gloss: 书（复数二格，用于5及以上）
    note: книга 的复数二格形式，从 пять 起使用；注意它完全去掉了末尾的元音，与 два／три／четыре 之后的 книги 不同。
    example_gloss: 我有九本书。
  ru.a1.unit03.lesson02.teach.mne_let:
    title: Мне десять лет.
    gloss: 我十岁。
    note: 俄语表达年龄时，用与格 мне（“对我”）加数字和 лет（“年”的复数二格），不用“是”之类的动词。
  ru.a1.unit03.lesson02.teach.skolko_vam_let:
    title: Сколько вам лет?
    gloss: 您多大年纪？
    note: 使用正式的与格 вам，与第2单元的 вы 语体一致。
  ru.a1.unit03.lesson03.teach.skolko_stoit:
    title: Сколько это стоит?
    gloss: 这个多少钱？
    note: 询问单件商品价格的标准说法，用 стоит（“值”，单数）。
  ru.a1.unit03.lesson03.teach.skolko_stoyat:
    title: Сколько стоят яблоки?
    gloss: 苹果多少钱？
    note: 这里用 стоят（“值”的复数形式），因为 яблоки（“苹果”）是复数——不同于 Сколько это стоит? 中的单数 стоит。
  ru.a1.unit03.lesson03.teach.rubley:
    title: рубль, рубля, рублей
    gloss: 卢布（1）；卢布（2–4）；卢布（5及以上）
    note: “卢布”一词随前面的数字变化：一用 рубль，два／три／четыре 之后用 рубля，пять 起用 рублей。
    example_gloss:
    - 这个一卢布。
    - 这个两卢布。
    - 这个五卢布。
  ru.a1.unit03.lesson03.teach.pokupatel_greeting:
    title: 顾客向卖家问好
    gloss: 顾客：您好！苹果多少钱？
    note: 集市摊位前的顾客先礼貌地说 Здравствуйте，再询问价格。
  ru.a1.unit03.lesson03.teach.prodavets_apples:
    title: 卖家回答
    gloss: 卖家：三卢布。
    note: Три рубля 使用“卢布”的2–4单数二格形式，与 три 相配。
  ru.a1.unit03.lesson03.teach.pokupatel_bread:
    title: 顾客询问面包
    gloss: 顾客：那面包多少钱？
    note: 顾客用 А（“那么”）自然地接着询问第二样东西的价格。
  ru.a1.unit03.lesson03.teach.prodavets_bread:
    title: 售货员再次回答
    gloss: 售货员：六卢布。
    note: Шесть рублей 用的是复数二格形式，因为数词шесть是5及以上的数。
  ru.a1.unit03.lesson03.teach.pokupatel_close:
    title: 顾客礼貌地结束对话
    gloss: 顾客：好的，谢谢！
    note: Хорошо, спасибо! 用友好的语气结束了市场上的对话，用到了问候单元学过的词汇。
