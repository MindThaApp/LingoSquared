teaching:
  ru.a1.unit14.lesson01.teach.mne_nravitsya_kofe:
    title: Мне нравится кофе.
    gloss: 我喜欢咖啡。
    note: мне нравится（字面：对我来说是令人愉快的）用与格代词 мне 加 нравится 来表达喜欢。
  ru.a1.unit14.lesson01.teach.ne_nravitsya:
    title: не нравится
    gloss: 不喜欢
    note: не（“不”）放在 нравится 前面，构成否定。
    example_gloss: 我不喜欢茶。
  ru.a1.unit14.lesson01.teach.chay:
    title: чай
    gloss: 茶
    note: чай 是“茶”。
    example_gloss: 我喜欢茶。
  ru.a1.unit14.lesson02.teach.ya_hochu_chay:
    title: Я хочу чай.
    gloss: 我想要茶。
    note: хочу（“我想要”）是 хотеть 的第一人称现在时，后面直接接宾语，表示想要某物。
  ru.a1.unit14.lesson02.teach.ne_hochu:
    title: не хочу
    gloss: 不想要
    note: не хочу 是 хочу 的否定形式，意思是“我不想要”。
    example_gloss: 我不想要咖啡。
  ru.a1.unit14.lesson02.teach.sok:
    title: сок
    gloss: 果汁
    note: сок 的意思是“果汁”。
    example_gloss: 我想要果汁。
  ru.a1.unit14.lesson03.teach.nastya_tebe_nravitsya:
    title: 娜斯佳问季马喜不喜欢咖啡
    gloss: 娜斯佳：你喜欢咖啡吗？
    note: Настя 以 Тебе нравится кофе? 开始提问。
  ru.a1.unit14.lesson03.teach.dima_da_mne_nravitsya:
    title: 季马回答并反问
    gloss: 季马：喜欢，我喜欢咖啡。你呢？
    note: Дима 回答 Да, мне нравится кофе. А тебе?
  ru.a1.unit14.lesson03.teach.nastya_ne_nravitsya_hochu_chay:
    title: 娜斯佳回答并说出她想要什么
    gloss: 娜斯佳：我不喜欢咖啡。我想要茶。
    note: Настя 回答 Мне не нравится кофе. Я хочу чай.
  ru.a1.unit14.lesson03.teach.dima_horosho_hochu_sok:
    title: 季马说出他想要什么
    gloss: 季马：好吧，我想要果汁。
    note: Дима 以 Хорошо, я хочу сок. 结束对话。
