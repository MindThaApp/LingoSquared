teaching:
  ru.a1.unit08.lesson01.teach.magazin:
    title: магазин
    gloss: 商店
    note: магазин 是阳性名词，指商店。
    example_gloss: 我们去商店。
  ru.a1.unit08.lesson01.teach.skolko:
    title: сколько
    gloss: 多少
    note: сколько 用来询问数量或价格，常与 стоит 搭配。
    example_gloss: 面包多少钱？
  ru.a1.unit08.lesson01.teach.stoit:
    title: стоит
    gloss: 价格是
    note: стоит 是 стоить（“值多少钱”）的第三人称单数，与 хлеб 这样的单数主语连用。
    example_gloss: 面包一百卢布。
  ru.a1.unit08.lesson01.teach.rubl:
    title: рубль
    gloss: 卢布
    note: рубль 是俄罗斯的货币；сто（“一百”）后面要用复数二格 рублей。
    example_gloss: 面包一百卢布。
  ru.a1.unit08.lesson01.teach.khleb_moloko:
    title: хлеб, молоко
    gloss: 面包，牛奶
    note: хлеб 是阳性，молоко 是中性——都是日常常见的食品。
    example_gloss:
    - 面包多少钱？
    - 牛奶多少钱？
  ru.a1.unit08.lesson02.teach.dayte_pozhaluysta:
    title: Дайте, пожалуйста, ...
    gloss: 请给我……
    note: Дайте 是 дать（“给”）的礼貌／复数命令式，与“вы”连用。
  ru.a1.unit08.lesson02.teach.kilogramm:
    title: килограмм
    gloss: 公斤
    note: килограмм 是按重量购买蔬果或面包时的标准单位。
    example_gloss: 请给我一公斤。
  ru.a1.unit08.lesson02.teach.polkilo:
    title: полкило
    gloss: 半公斤
    note: полкило 由 пол-（“一半”）和 кило（килограмм 的口语简称）构成。
    example_gloss: 请给我半公斤。
  ru.a1.unit08.lesson02.teach.shtuka:
    title: штука
    gloss: 件；个
    note: штука 用来计数单个物品；пять штук 在数词 пять 之后用复数二格。
    example_gloss:
    - 请给我一个。
    - 请给我五个。
  ru.a1.unit08.lesson03.teach.pomidory_ogurtsy:
    title: помидоры, огурцы
    gloss: 西红柿，黄瓜
    note: 两者都是复数形式的蔬菜名词；помидоры 和 огурцы 的单数都是阳性。
    example_gloss:
    - 您这儿有西红柿吗？
    - 您这儿有黄瓜吗？
  ru.a1.unit08.lesson03.teach.kartofel_kapusta:
    title: картофель, капуста
    gloss: 土豆，卷心菜
    note: картофель 是阳性集合名词（像不可数名词一样使用），капуста 是阴性。
    example_gloss:
    - 您这儿有土豆吗？
    - 您这儿有卷心菜吗？
  ru.a1.unit08.lesson03.teach.yabloki_apelsiny:
    title: яблоки, апельсины
    gloss: 苹果，橙子
    note: кило 之后用复数二格 яблок（“一公斤苹果”），与 кило апельсинов 的结构相同。
    example_gloss:
    - 一公斤苹果多少钱？
    - 一公斤橙子多少钱？
  ru.a1.unit08.lesson03.teach.u_vas_est:
    title: У вас есть ...?
    gloss: 您这儿有……吗？（礼貌）
    note: 使用礼貌的 вас，是问店主有没有某样东西的标准说法。
  ru.a1.unit08.lesson03.teach.da_u_menya_est:
    title: Да, у меня есть ...
    gloss: 是的，我有……
    note: У меня есть（字面为“在我这儿有”）是表示“我有”的标准说法，是店主的回答。
  ru.a1.unit08.lesson03.teach.pokupatel_pomidory:
    title: 顾客询问西红柿
    gloss: 顾客：您这儿有西红柿吗？
    note: 顾客以礼貌的 У вас есть ...? 句式开头。
  ru.a1.unit08.lesson03.teach.prodavets_da_est:
    title: 售货员回答有
    gloss: 售货员：有的。
    note: Да, есть 是日常简短的回答，字面意思是“是的，有”，不必重复商品名称。
  ru.a1.unit08.lesson03.teach.pokupatel_kilo_yablok:
    title: 顾客询问价格
    gloss: 顾客：一公斤苹果多少钱？
    note: кило яблок：кило 后面的 яблок 要用复数第二格（属格）。
  ru.a1.unit08.lesson03.teach.prodavets_dvesti:
    title: 卖家报价
    gloss: 卖家：两百卢布。
    note: Двести 的意思是“两百”；和 сто 一样，后面要接复数第二格（属格）рублей。
  ru.a1.unit08.lesson03.teach.pokupatel_dayte_kilogramm:
    title: 顾客买一公斤
    gloss: 顾客：请给我一公斤苹果。
    note: Дайте ..., пожалуйста 已在第2课学过，这里搭配 килограмм яблок（“一公斤苹果”）。
  ru.a1.unit08.lesson03.teach.prodavets_khorosho:
    title: 卖家把东西递给顾客
    gloss: 卖家：好的，给您。
    note: Пожалуйста 在这里是卖家递上商品时说的“给您”，不是“请”。
