    gloss: 看了电影
    note: смотрел（阳性）／смотрела（阴性）是“看”的过去式；фильм 的意思是“电影”。
    example_gloss: 我看了一部电影。
  ru.a1.unit13.lesson03.teach.nastya_chto_ty_delal:
    title: Настя 问 Дима 做了什么
    gloss: Настя：你昨天做了什么？
