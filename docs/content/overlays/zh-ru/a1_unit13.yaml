  ru.a1.unit13.lesson01.teach.vchera_byl:
    title: Вчера я был дома.
    gloss: 昨天我在家。
    note: вчера 的意思是“昨天”；был 是“是／在”的阳性过去式，由男性说话者使用。
  ru.a1.unit13.lesson01.teach.byla:
    title: была
    gloss: 在（女性说）
    note: была 是“是／在”的阴性过去式；动词要与主语的性别一致。
    example_gloss: 昨天她在家。
  ru.a1.unit13.lesson01.teach.vecherom:
    title: вечером
    gloss: 晚上
    note: вечером 的意思是“在晚上”，用来进一步说明过去的事情发生在什么时候。
    example_gloss: 昨天晚上我在家。
  ru.a1.unit13.lesson02.teach.hodil_v_kino:
    title: Вчера я ходил в кино.
    gloss: 昨天我去看电影了。
    note: ходил（阳性）是“去（步行）”的过去式，表示已经完成的一次往返。
  ru.a1.unit13.lesson02.teach.hodila:
    title: ходила
    gloss: 去了（女性说）
    note: ходила 是“去（步行）”的阴性过去式。
    example_gloss: 昨天她去看电影了。
  ru.a1.unit13.lesson02.teach.smotrel_film:
