teaching:
  ru.a1.unit18.lesson01.teach.eto_moya_kvartira:
    title: Это моя квартира.
    gloss: 这是我的公寓。
    note: Это 表示“这是”；моя（“我的”，阴性）要与阴性名词 квартира（“公寓”）保持一致。
  ru.a1.unit18.lesson01.teach.kuhnya:
    title: кухня
    gloss: 厨房
    note: кухня 的意思是“厨房”。стол 的意思是“桌子”。
    example_gloss: 厨房里有一张桌子。
  ru.a1.unit18.lesson01.teach.spalnya:
    title: спальня
    gloss: 卧室
    note: спальня 的意思是“卧室”。кровать 的意思是“床”。
    example_gloss: 卧室里有一张床。
  ru.a1.unit18.lesson02.teach.divan_v_gostinoy:
    title: Диван в гостиной.
    gloss: 沙发在客厅里。
    note: диван 的意思是“沙发”；гостиная 的意思是“客厅”（гостиной 是它在 в“在……里”之后的前置格形式）。
  ru.a1.unit18.lesson02.teach.stol_na_kuhne:
    title: на
    gloss: 在……上／在
    note: 与 кухня 搭配时要用 на 而不是 в（字面是“在厨房上”，实际意思是“在厨房里”），这与大多数房间不同。
    example_gloss: 桌子在厨房里。
  ru.a1.unit18.lesson02.teach.vannaya:
    title: ванная
    gloss: 浴室
    note: ванная 的意思是“卫生间”。
    example_gloss: 卫生间在卧室旁边。
  ru.a1.unit18.lesson03.teach.dima_gde_ty_zhivyosh:
    title: 季马问娜斯佳住在哪里
    gloss: 季马：娜斯佳，你住在哪里？
    note: 季马一开口就说 Настя, где ты живёшь?
  ru.a1.unit18.lesson03.teach.nastya_zhivu_v_kvartire:
    title: 娜斯佳说自己住在哪里
    gloss: 娜斯佳：我住在公寓里。
    note: 娜斯佳回答 Я живу в квартире；живу 是 жить（“住”）的“我”的形式，в квартире 是 квартира 的前置格形式。
  ru.a1.unit18.lesson03.teach.dima_skolko_komnat:
    title: 季马问有几个房间
    gloss: 季马：公寓里有几个房间？
    note: Сколько（“多少”）后面要用复数属格：сколько комнат。
  ru.a1.unit18.lesson03.teach.nastya_dve_komnaty:
    title: 娜斯佳列举房间
    gloss: 娜斯佳：两个房间：一间卧室和一间客厅。还有厨房和卫生间。
    note: '娜斯佳接着说 Две комнаты: спальня и гостиная. Кухня и ванная тоже есть.'
