teaching:
  ru.a1.unit27.lesson01.teach.zhivotnoe_domashnee_zhivotnoe:
    title: 动物与宠物
    gloss: 动物／宠物
    note: '*Животное* 是“动物”的总称。*Домашнее животное*（字面意思是“家养的动物”）专指宠物。'
    example_gloss:
    - 狗是一种动物。
    - 狗也是一种宠物。
  ru.a1.unit27.lesson01.teach.sobaka_koshka:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - 娜斯佳有一只狗。
    - 伊戈尔有一只猫。
  ru.a1.unit27.lesson01.teach.ryba_ptitsa:
    title: 鱼和鸟
    gloss: 鱼／鸟
    example_gloss:
    - 爷爷养了一条鱼。
    - Nina 养了一只鸟。
  ru.a1.unit27.lesson01.teach.u_tebya_est:
    title: 你养宠物吗？
    gloss: 你养宠物吗？
    note: '*У тебя есть ...?* 是“你有……吗？”的问法：*у тебя*（在你这里）+ *есть* + 所问之物。'
  ru.a1.unit27.lesson01.teach.da_u_menya:
    title: 是的，我有一只狗
    gloss: 是的，我有一只狗。
    note: 使用本单元的新词汇作简单的肯定回答。
  ru.a1.unit27.lesson01.teach.net_u_menya:
    title: 不，我没有宠物
    gloss: 不，我没有宠物。
    note: '*Нет* + 第二格（生格）表示没有某物：*у меня нет домашнего животного*。见语法说明。'
  ru.a1.unit27.lesson01.teach.posle_net_slovo:
    title: Нет + 第二格（生格）
    gloss: 在 *нет* 之后，没有的东西要用第二格（生格）：*у меня нет времени*，*у меня нет домашнего животного*。
    note: 对比肯定句：*у меня есть собака*（第一格），但 *у меня нет собаки*（第二格）。
  ru.a1.unit27.lesson02.teach.gulyat_s_sobakoy:
    title: 遛（动物）
    gloss: 遛（动物）
    note: '*Гулять с собакой* 用 *с* 加第五格（工具格）*собакой*。见语法说明。'
    example_gloss: 我每天遛狗。
  ru.a1.unit27.lesson02.teach.posle_s_slovo:
    title: С + 第五格（工具格）
    gloss: 在 *с*（和、同）之后，名词要用第五格（工具格）：*гулять с собакой*，*играть с кошкой*。
    note: 阴性名词的第五格以 *-ой* 或 *-ей* 结尾：*собакой*，*кошкой*。
  ru.a1.unit27.lesson02.teach.kormit:
    title: 喂食
    gloss: 喂食
    example_gloss: 我每天给猫喂食。
  ru.a1.unit27.lesson02.teach.igrat_s:
    title: 和……玩
    gloss: 和……玩
    example_gloss: 伊戈尔和他的猫玩。
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den:
    title: 我每天遛狗
    gloss: 我每天遛狗。
    note: '*Каждый день*（每天）是不带前置词的时间表达：*Я каждый день гуляю с собакой*。'
  ru.a1.unit27.lesson02.teach.ya_kazhdyy_den_2:
    title: 我每天喂猫
    gloss: 我每天给猫喂食。
    note: '*Кормить* 的宾语（动物）用第四格（宾格）：*кошка* 变成 *кошку*。'
  ru.a1.unit27.lesson03.teach.posle_lyubit_zhivotnoe:
    title: любить 之后的动物名词
    gloss: 在 *любить* 之后，动物名词用第四格（宾格），有生命名词复数的第四格与第二格相同：*собак*，*кошек*，*птиц*，*рыб*。
    note: 这是俄语规则复数的形式，在此首次以动物名词为例引入。
  ru.a1.unit27.lesson03.teach.sobak_koshek:
    title: 狗和猫
    gloss: 狗／猫
    example_gloss:
    - 季马喜欢狗。
    - Lena 喜欢猫。
  ru.a1.unit27.lesson03.teach.ryb_ptits:
    title: 鱼和鸟（复数）
    gloss: 鱼（复数）／鸟
    example_gloss:
    - 我喜欢鱼。
    - 爷爷喜欢鸟。
  ru.a1.unit27.lesson03.teach.ya_lyublyu_zhivotnykh:
    title: 我喜欢动物
    gloss: 我喜欢动物。
    note: '*Люблю* + 第四格：*Я люблю животных*。有生命名词复数的第四格与第二格形式相同。'
  ru.a1.unit27.lesson03.teach.lena_lyubit_koshek:
    title: Lena 喜欢猫，但没有宠物
    gloss: Lena 喜欢猫，但她没有宠物。
    note: 这里引出了第 05 课阅读部分所围绕的对比。
  ru.a1.unit27.lesson04.teach.dima_u_tebya:
    title: 季马问有没有宠物
    gloss: 季马：娜斯佳，你有宠物吗？
  ru.a1.unit27.lesson04.teach.nastya_da_u:
    title: 娜斯佳有一只狗
    gloss: 娜斯佳：有，我有一只狗。
  ru.a1.unit27.lesson04.teach.dima_kak_on:
    title: 季马问它长什么样
    gloss: 季马：它长什么样？
    note: '*Как он выглядит?* 这个问句也可以用于动物。公的宠物用 *он*（他/它）。'
  ru.a1.unit27.lesson04.teach.nastya_u_nego:
    title: 娜斯佳描述她的狗
    gloss: 娜斯佳：它的毛是棕色的，个头很小。
    note: 这里再次使用外貌单元学过的毛发颜色和体型词汇，不过描述的是动物的皮毛，而不是人的头发。
  ru.a1.unit27.lesson04.teach.o_zhivotnom_mozhno:
    title: 动物用 он 和 она
    gloss: 宠物可以像人一样用 *он* 或 *она* 来指代：*У меня собака, он маленький*。
    note: 从语法上说 *собака* 是阴性，但知道宠物是公的时，俄罗斯人常说 *он*。
  ru.a1.unit27.lesson04.teach.dima_ty_gulyaesh:
    title: 季马问遛狗的事
    gloss: 季马：你每天都遛它吗？
  ru.a1.unit27.lesson04.teach.nastya_da_ya:
    title: 娜斯佳讲述她的日常
    gloss: 娜斯佳：是的，我每天都遛它，也喂它。
  ru.a1.unit27.lesson05.teach.dima_i_lena:
    title: 季马、列娜和伊戈尔谈动物
    gloss: 季马和列娜都喜欢动物，但两人都没有宠物。季马喜欢狗，列娜喜欢猫。伊戈尔倒是有一只宠物：一只猫。他常常和他的猫玩，每天给猫喂食。你有宠物吗？
    note: 这里对比了喜欢动物与真正饲养宠物，是本部分要表达的重点。
    glosses:
      любят: 喜爱
      оба: 两者都
      животных: 动物
      обоих: 两者都
      домашнего: 宠物
      собак: 狗
      кошек: 猫
      кошка: 猫
      играет: 玩
      даёт: 给
      каждый: 每一
      корм: 食物
  ru.a1.unit27.lesson05.teach.igor_chasto_igraet:
    title: 伊戈尔常常和他的猫玩
    gloss: 伊戈尔常常和他的猫玩。
    note: '*Со своей кошкой*：在几个辅音连在一起之前，*с* 变成 *со*；*своей* 的意思是“自己的”，指回句子的主语。'
  ru.a1.unit27.lesson05.teach.ya_lyublyu_sobak:
    title: 我喜欢狗。我没有宠物。
    gloss: 我喜欢狗。我没有宠物。
    note: 这是一个由两句话组成的示范答案，可以直接套用在本单元的写作题中。
  ru.a1.unit27.lesson06.teach.nastya_nina_u:
    title: 娜斯佳问尼娜
    gloss: 娜斯佳：尼娜，你也有宠物吗？
  ru.a1.unit27.lesson06.teach.nina_da_u:
    title: Nina 有一只名叫 Pico 的鸟
    gloss: Nina：是的，我有一只鸟。它叫 Pico。
    note: '*Его зовут Пико* 字面意思是“人们叫它皮科”。俄语就是这样说名字的。'
  ru.a1.unit27.lesson06.teach.dima_kak_zdorovo:
    title: 季马的反应
    gloss: 季马：太棒了！你每天和它做什么？
  ru.a1.unit27.lesson06.teach.nina_ya_kazhdyy:
    title: Nina 每天给它喂食
    gloss: Nina：我每天都给它喂食。
  ru.a1.unit27.lesson06.teach.dima_ya_tozhe:
    title: 季马也喜欢鸟
    gloss: 季马：我也喜欢鸟。
  ru.a1.unit27.lesson06.teach.nastya_kak_khorosho:
    title: 娜斯佳结束谈话
    gloss: 娜斯佳：真好，我们三个人都喜欢动物！
    note: 这句话将本单元三个人物与动物有关的信息串联起来，为对话收尾。
