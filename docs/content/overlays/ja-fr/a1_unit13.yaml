  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: フランス語 A1
  description: 好き嫌いや好みを簡単に言ったりたずねたりする練習です。InèsとMathieuの料理ワークショップの物語が続き、2人は土曜日に作るレシピを2つの中から選びます。*préférer X à Y*(YよりXを好む)では *à* を使い、*que* は使わないことにも注意します。
units:
  fr.a1.unit13.preferences:
    title: どちらが好き?
lessons:
  fr.a1.unit13.lesson01.vocabulaire_preferences:
    title: 好き、好む、嫌い
  fr.a1.unit13.lesson02.demander_les_preferences:
    title: 好みをたずねる
  fr.a1.unit13.lesson03.dialogue_choisir_la_recette:
    title: 土曜日のレシピを選ぶ
teaching:
  fr.a1.unit13.lesson01.teach.preferer:
    title: (より)好む
    gloss: (より)好む
    note: '*Préférer* は語幹の母音が変わる -ER 動詞です。*je préfère* となりますが、*nous préférons* では アクサンは変わりません(*nous/vous* の形)。'
    example_gloss: 私はチョコレートタルトのほうが好きです。
  fr.a1.unit13.lesson01.teach.aimer_mieux:
    title: ~のほうが好きだ
    gloss: ~のほうが好きだ
    note: '*Aimer mieux* は *préférer* のよく使われる言いかえですが、比べるときは *que* を使います(*aimer mieux X que Y*)。*préférer* では *à* を使います(*préférer X à Y*)。'
    example_gloss: 私は甘い料理より塩味の料理のほうが好きです。
  fr.a1.unit13.lesson01.teach.detester:
    title: ひどく嫌う
    gloss: ひどく嫌う
    note: '*Détester* は強い嫌悪を表し、*ne pas aimer*(好きではない)より強い言い方です。'
    example_gloss: Mathieuは辛すぎるスパイスが大嫌いで、マイルドな料理のほうが好きです。
  fr.a1.unit13.lesson01.teach.plutot:
    title: むしろ
    gloss: むしろ
    note: '*Plutôt* は好みをやわらげて言う語で、「どちらかというとこちら」という意味です。もう一方を完全に否定するわけではありません。'
    example_gloss: 私はむしろチーズにします。
  fr.a1.unit13.lesson01.teach.sucre:
    title: 甘い
    gloss: 甘い
    note: '*Sucré* は食べ物の甘さを表します。*doux*(やわらかい、穏やかな)とは意味が異なるので、区別しましょう。'
    example_gloss: このデザートはとても甘いです。
  fr.a1.unit13.lesson01.teach.sale:
    title: 塩味の・しょっぱい
    gloss: 塩味の
    note: '*Salé* は、フランス語の食べ物の語彙で *sucré* の標準的な反対語です。「塩辛い」と「甘くない(おかず系の)」の両方の意味があります。'
    example_gloss: このチーズは塩気が強いです。
  fr.a1.unit13.lesson01.teach.la_recette:
    title: レシピ
    gloss: レシピ
    note: '*La recette* は常に女性名詞です。'
    example_gloss: このレシピは簡単です。
  fr.a1.unit13.lesson02.teach.quest_ce_que_tu_preferes:
    title: 好みをたずねる
    gloss: どちらが好き?
    note: '*Qu''est-ce que...* は、話し言葉で「何」をたずねる疑問文をつくる標準的な形です。'
  fr.a1.unit13.lesson02.teach.je_prefere_x_a_y:
    title: 二つのものの好みを言う
    gloss: キッシュよりタルトのほうが好きです。
    note: '*Préférer X à Y* では、好みでないほうの前に *à* を置きます。*que* は使いません。'
  fr.a1.unit13.lesson02.teach.tu_aimes_plutot:
    title: 全般的な傾向をたずねる
    gloss: どちらかというと甘いものと塩味のもの、どっちが好き?
    note: '*plutôt*(第1課)と、「または」を表す *ou* を使った選択の疑問文を組み合わせた表現です。'
  fr.a1.unit13.lesson02.teach.moi_aussi_moi_non:
    title: 同意する・同意しない
    gloss: 私もです。/ 私は違います。
    note: '*Moi aussi* は肯定の内容に同意するときに使い、*moi non* は反対したり、逆の好みを述べたりするときに使います。'
  fr.a1.unit13.lesson02.teach.ca_ne_me_derange_pas:
    title: 気にしないと伝える
    gloss: 私は気にしません。
    note: '*Ça ne me dérange pas* は、どちらかを選ぶよう言われたときに、どちらでもよいと伝えられる便利で中立的な表現です。'
  fr.a1.unit13.lesson02.teach.on_pourrait_faire:
    title: 提案する
    gloss: キッシュを作ってもいいですよね?
    note: '*On pourrait*(〜してもいい)+ 不定詞で、やんわりと提案します。最後に *non ?* を付けて同意を求めています。'
  fr.a1.unit13.lesson03.teach.line01:
    title: 何を作るかたずねる
    gloss: マチューは、土曜日に何を作るのか、タルトかキッシュかをたずねています。
    note: '*Qu''est-ce qu''on prépare... ?*(何を作る?)では、くだけた会話でよくあるように、「私たち」の意味で *on* を使います。'
  fr.a1.unit13.lesson03.teach.line02:
    title: 好みを言って聞き返す
    gloss: イネスは、タルトのほうが好きで、どちらかというと甘いほうがいいと言い、マチューにもたずねます。
    note: '*Et toi ?*(あなたは?)は、相手に同じことをたずねる最も簡単な言い方です。'
  fr.a1.unit13.lesson03.teach.line03:
    title: 反対の好みを言う
    gloss: マチューは、しょっぱいもののほうが好きで、タルトよりキッシュのほうが好きだと言います。
    note: 第2課の *préférer X à Y* の型をそのまま使っています。
  fr.a1.unit13.lesson03.teach.line04:
    title: 折衷案を出す
    gloss: イネスは、両方作ってもいいのでは、と提案します。
    note: '*Les deux*(両方)で、二つのレシピを両方作ることを提案し、意見の違いを解決します。'
  fr.a1.unit13.lesson03.teach.line05:
    title: 折衷案を受け入れる
    gloss: マチューは、いい考えだ、まったくかまわない、と言います。
    note: '*Ça ne me dérange pas du tout* は、第2課の表現に *du tout*(まったく)を加えて強めた言い方です。'
  fr.a1.unit13.lesson03.teach.line06:
    title: 決定を確認する
    gloss: イネスは、完璧、土曜日は甘いタルトとしょっぱいキッシュにしよう、と言います。
    note: 最終的な決定をはっきり言い直して、やりとりを締めくくっています。
