teaching:
  fr.a1.unit48.lesson01.teach.le_manteau_le:
    title: コート、セーター
    gloss: コート、セーター
    note: '*Le manteau* も *le pull* も男性名詞です。'
    example_gloss:
    - コートを探しています。
    - セーターを持っています。
  fr.a1.unit48.lesson01.teach.le_pantalon_les:
    title: ズボン、靴
    gloss: ズボン、靴
    note: '*Pantalon* はフランス語では単数形で、ズボン1本は *un pantalon* と言います。*Chaussures* は *chaussure* の複数形で、靴は通常、複数形で言います。'
    example_gloss:
    - 私はズボンを探しています。
    - 靴を探しています。
  fr.a1.unit48.lesson01.teach.je_cherche_un:
    title: 探しているものを言う
    gloss: コートを探しています。
    note: '*Chercher*(探す)は前置詞を使わずに直接目的語を取ります:*je cherche un manteau*。'
  fr.a1.unit48.lesson02.teach.la_taille:
    title: サイズ
    gloss: サイズ
    note: '*Taille* は女性名詞で、*la taille* と言います。'
    example_gloss: サイズはいくつですか?
  fr.a1.unit48.lesson02.teach.quelle_taille_faites:
    title: サイズをたずねる
    gloss: サイズはいくつですか?
    note: '*Quelle taille ?* では、*taille* が女性名詞なので *quelle*(どの)を使います。答えの選択肢(S、M、Lや数字)が限られているときの言い方です。'
  fr.a1.unit48.lesson02.teach.je_fais_du:
    title: 自分のサイズを言う
    gloss: 私はMサイズです。
    note: '*Faire du M* は「Mサイズである」という意味です。フランス語では「作る」を表す *faire* を使います。'
  fr.a1.unit48.lesson03.teach.noir_bleu:
    title: 黒、青
    gloss: 黒、青
    note: このレッスンで学ぶ、基本の色を表す形容詞2つです。
    example_gloss:
    - 黒のコートがほしいです。
    - これの青もありますか?
  fr.a1.unit48.lesson03.teach.je_veux_le:
    title: 色を頼む
    gloss: 黒のコートがほしいです。
    note: '*En* + 色は、注文や依頼のときに服の色を指定する標準的な言い方です。'
  fr.a1.unit48.lesson03.teach.avez_vous_aussi:
    title: 別の色についてたずねる
    gloss: これの青もありますか?
    note: '*Aussi*(~も)を使って、別の色があるかをたずねています。丁寧な *vous* を使った言い方です。'
  fr.a1.unit48.lesson04.teach.est_ce_que:
    title: サイズが合うかたずねる
    gloss: このコートはサイズが合いますか?
    note: 服が体に合うかどうかは、*aller*(行く)を使って言うのが自然です。*il me va bien* は、直訳すると「それは私にうまく行く」です。
  fr.a1.unit48.lesson04.teach.il_me_va:
    title: ぴったりだと伝える
    gloss: ぴったり合います。
    note: '*Bien*(よく)は、服がどのように合っているかを表します。'
  fr.a1.unit48.lesson04.teach.c_est_trop:
    title: 小さすぎる
    gloss: 小さすぎます。
    note: '*Trop*(~すぎる)は、行き過ぎを表すときに形容詞の前に置きます。'
  fr.a1.unit48.lesson04.teach.c_est_trop_2:
    title: 大きすぎる
    gloss: 大きすぎます。
    note: 前のカードの *trop petit* と同じ、*trop* + 形容詞の形です。
  fr.a1.unit48.lesson05.teach.quatre_vingt_dix:
    title: '90'
    gloss: '90'
    note: '*Quatre-vingt-dix* は数字の90で(直訳は「4×20+10」)、ここではコートの値段に使われています。'
    example_gloss: そのコートは90ユーロです。
  fr.a1.unit48.lesson05.teach.le_manteau_coute:
    title: 値段を言う
    gloss: そのコートは90ユーロです。
    note: '*Coûte* は *coûter*(値段が~である)の *il* に対応する形です。'
  fr.a1.unit48.lesson05.teach.parka_taille_m:
    title: お店のレシートを読む
    gloss: 冬のコート:サイズM、色は黒。価格:90ユーロ。このコートはサイズがぴったりで、暖かいです。
    note: サイズ、色、価格、そしてコートについて述べられている2つの特徴に注目しましょう。
    glosses:
      Parka: 冬のコート
      taille: サイズ
      couleur: 色
      noire: 黒い
      Prix: 価格
      quatre-vingt-dix: '90'
      euros: ユーロ
      manteau: コート
      va: 合う
      chaud: 暖かい
  fr.a1.unit48.lesson06.teach.camille_ce_manteau:
    title: カミーユがコートに目を留める
    gloss: カミーユ:このコート、すてき!サイズはいくつ?
    note: '*Joli*(すてき、きれい)は、気に入ったときの一般的な言い方です。ここでは *manteau* に合わせて男性形になっています。'
  fr.a1.unit48.lesson06.teach.mathieu_je_fais:
    title: マチューが試着をお願いする
    gloss: マチュー:Mサイズだよ。試着してもいい?
    note: '*Je peux ... ?* は許可を求める標準的な言い方です。*l''essayer* は「それを試着する」で、*l''* はコートを指します。'
  fr.a1.unit48.lesson06.teach.camille_bien_sur:
    title: カミーユが着心地をたずねる
    gloss: カミーユ:もちろん。サイズは合ってる?
    note: '*Il*(それ)は、男性名詞の *le manteau* を指しています。'
  fr.a1.unit48.lesson06.teach.mathieu_oui_il:
    title: マチューが答える
    gloss: マチュー:うん、ぴったりだし、暖かいよ。
    note: レッスン5で読んだレシートの内容とまったく同じで、同じコートです。
  fr.a1.unit48.lesson06.teach.camille_super_tu:
    title: カミーユが色をたずねる
    gloss: カミーユ:いいね!黒と青、どっちにする?
    note: '*Tu le veux en ... ou en ... ?* は選択肢を示す言い方で、*le* はコートを指します。'
  fr.a1.unit48.lesson06.teach.mathieu_je_le:
    title: マチューが決める
    gloss: マチュー:黒にするよ。
    note: '*Prendre*(取る)は、買う物を決めるときに使う自然な動詞で、レシートに書かれた色とも一致しています。'
  fr.a1.unit48.lesson06.teach.on_ecrit_prends:
    title: prends と prend
    gloss: '*Prends* は *prendre*(取る)の「私」と「あなた(tu)」の形で、*prend* は「彼・彼女」の形です。'
    note: '*prendre* の活用:*je prends, tu prends, il/elle prend*。'
