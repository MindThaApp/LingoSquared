course:
  title: フランス語 A1
  description: 最近終わった出来事を、avoir と être の両方の助動詞を使った複合過去で簡単に語ります。イネスとマチューの料理ワークショップの物語の続きとして、マチューが先週の土曜日のセッションでのハプニングを話します。フランス語の助動詞には avoir(ほとんどの動詞)と être(aller/arriver/rester などの少数の動詞)の2種類があり、日本語にはない使い分けが必要です。また、être を助動詞とする動詞の過去分詞は主語の性に一致します(arrivé/arrivée)。
units:
  fr.a1.unit12.past_events:
    title: 何があったの？
lessons:
  fr.a1.unit12.lesson01.passe_compose_avoir:
    title: avoir を使う複合過去
  fr.a1.unit12.lesson02.passe_compose_etre:
    title: être を使う複合過去
  fr.a1.unit12.lesson03.dialogue_atelier_dernier:
    title: 先週の土曜日のワークショップ
teaching:
  fr.a1.unit12.lesson01.teach.jai_prepare:
    title: 私は準備した
    gloss: 私は準備した/作った
    note: 規則的な -ER 動詞は、複合過去の過去分詞が *-é* になります：*préparer* → *préparé*。助動詞は *avoir* です。
    example_gloss: ワークショップのためにケーキを作りました。
  fr.a1.unit12.lesson01.teach.jai_achete:
    title: 私は買った
    gloss: 私は買った
    note: '*Acheter* も *préparer* と同じ、*avoir* + *-é* のパターンです。'
    example_gloss: 市場で野菜を買いました。
  fr.a1.unit12.lesson01.teach.jai_oublie:
    title: 私は忘れた
    gloss: 私は忘れた
    note: '*Oublier* → *oublié*。ここでも同じ規則的なパターンです。'
    example_gloss: バターを家に忘れてきた！
  fr.a1.unit12.lesson01.teach.tu_as_aime:
    title: あなたは気に入った
    gloss: あなたは気に入った
    note: '*Tu as* + 過去分詞は、同じ *avoir* の構文の *tu* の形です。'
    example_gloss: ケーキは気に入った？
  fr.a1.unit12.lesson01.teach.il_a_goute:
    title: 彼は味見した
    gloss: 彼は味見した
    note: '*Il a* + 過去分詞は *il* の形です。助動詞 *avoir* は主語によって変わりますが、過去分詞は変わりません。'
    example_gloss: マチューはソースを味見しました。
  fr.a1.unit12.lesson01.teach.grammar_avoir_participe:
    title: Avoir + 過去分詞
    gloss: avoir + 過去分詞(-é)
    note: フランス語のほとんどの動詞は、助動詞に *avoir* を使って複合過去を作ります。規則的な -ER 動詞の過去分詞は *-é* で終わります。
  fr.a1.unit12.lesson01.teach.la_semaine_derniere:
    title: 先週
    gloss: 先週
    note: '*Dernière*(この前の)は女性名詞の *semaine* に合わせた形です。男性形は *dernier* で、*samedi dernier*(先週の土曜日)のように使います。'
    example_gloss: 先週、私はケーキを作りました。
  fr.a1.unit12.lesson02.teach.je_suis_arrive:
    title: 私は到着した
    gloss: 私は到着した
    note: '*Arriver* は、助動詞に *avoir* ではなく *être* を使う少数の動詞(おもに移動を表す動詞)の一つです。'
    example_gloss: ワークショップに遅れて到着しました。
  fr.a1.unit12.lesson02.teach.je_suis_alle:
    title: 私は行った
    gloss: 私は行った
    note: '*Aller* も助動詞に *être* を使います。過去分詞は主語に一致します。男性なら *allé*、女性なら(Inèsが言う場合のように)*allée* です。'
    example_gloss: 私はワークショップの前に市場へ行きました。
  fr.a1.unit12.lesson02.teach.il_est_reste:
    title: 彼は残った
    gloss: 彼はとどまった
    note: '*Rester*(とどまる)も助動詞に *être* を使う動詞で、一致のしかたも同じです。'
    example_gloss: Mathieuは台所を片づけるために残りました。
  fr.a1.unit12.lesson02.teach.grammar_etre_accord:
    title: Être + 過去分詞の一致
    gloss: être + 過去分詞(主語に一致する)
    note: 助動詞に *être* を使う動詞では、過去分詞が主語の性と数に一致します。助動詞に *avoir* を使う動詞とは違います。
  fr.a1.unit12.lesson02.teach.en_retard:
    title: 遅れて
    gloss: 遅れて
    note: '*En retard* は、予定の時刻より後に着くことを表します。*arriver* とよく一緒に使われます。'
    example_gloss: バスは遅れて着きました。
  fr.a1.unit12.lesson02.teach.finalement:
    title: 結局 / 最終的に
    gloss: ついに/結局
    note: '*Finalement* は短い話の締めくくりに使い、いろいろあった後の最終的な結果を示します。'
    example_gloss: 結局、ケーキはとてもおいしかったです。
  fr.a1.unit12.lesson02.teach.quest_ce_qui_sest_passe:
    title: 何があったの？
    gloss: 何があったの？
    note: '*Qu''est-ce qui s''est passé ?* は、何があったのかをたずねる標準的な言い方です。'
    example_gloss: ワークショップで何があったの？
  fr.a1.unit12.lesson03.teach.line01:
    title: 何があったかをたずねる
    gloss: Inèsは先週の土曜日のワークショップで何があったかをたずねます。彼女は行けませんでした。
    note: '*Qu''est-ce qui s''est passé ?*(何があったの？)は、過去の出来事についてたずねる標準的な言い方です。'
  fr.a1.unit12.lesson03.teach.line02:
    title: 失敗を話す
    gloss: Mathieuは、遅れて着いたうえに家にバターを忘れてきてしまった、と言います。
    note: 1つの文に複合過去が2つあります。*être*(*je suis arrivé*)と *avoir*(*j'ai oublié*)です。
  fr.a1.unit12.lesson03.teach.line03:
    title: 何をしたかをたずねる
    gloss: Inèsは、それから彼が何をしたかをたずねます。
    note: '*Qu''est-ce que tu as fait ?*(何をしたの？)では、*faire* の不規則な複合過去形が使われています。'
  fr.a1.unit12.lesson03.teach.line04:
    title: 解決方法を説明する
    gloss: Mathieuは、急いで角の食料品店に行った、と言います。
    note: '*L''épicerie du coin*(角の食料品店)の *coin* は、*au coin de la rue*(通りの角で)の coin と同じ語です。'
  fr.a1.unit12.lesson03.teach.line05:
    title: うまくいったかをたずねる
    gloss: Inèsは、そこでバターが見つかったかをたずねます。
    note: '*Tu as trouvé... ?*(…は見つかった？)も、助動詞に *avoir* を使う規則的な疑問文です。'
  fr.a1.unit12.lesson03.teach.line06:
    title: ハッピーエンドを伝える
    gloss: Mathieuは、うん、結局ケーキはとてもおいしかった、と言います。
    note: '*finalement* を使って、前の失敗を解決し、話を良い結末で締めくくります。'
