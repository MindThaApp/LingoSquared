answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: フランス語 A1
  description: イネスとマチューの料理教室の物語の続きとして、二人が買い物をしながら二つのチーズを比べる場面で、基本的な比較(plus/moins/aussi... que)と最上級(le/la plus...)を学びます。*meilleur*(よりよい)と *le meilleur*(一番よい)は不規則な形で、他の大半の形容詞に使う規則的な *plus... que* の型とは異なる点に注意しましょう。
units:
  fr.a1.unit14.comparisons:
    title: 多い?少ない?
lessons:
  fr.a1.unit14.lesson01.vocabulaire_comparaisons:
    title: より・ほど〜ない・同じくらい
  fr.a1.unit14.lesson02.superlatifs:
    title: 最も〜、最も〜ない
  fr.a1.unit14.lesson03.dialogue_comparer_fromages:
    title: 市場で二つのチーズを比べる
teaching:
  fr.a1.unit14.lesson01.teach.plus_que:
    title: 〜より…
    gloss: 〜より…
    note: 形容詞を *plus ... que* ではさむ形が、フランス語の標準的な比較級です。形容詞の形は変わりません。
    example_gloss: このチーズはもう一方より高いです。
  fr.a1.unit14.lesson01.teach.moins_que:
    title: 〜ほど…ない
    gloss: 〜ほど…ない
    note: '*Moins* は、この同じ比較の型で *plus* のちょうど反対の意味になります。'
    example_gloss: このレシピはもう一方ほど難しくありません。
  fr.a1.unit14.lesson01.teach.aussi_que:
    title: …と同じくらい…
    gloss: 〜と同じくらい…
    note: '*Aussi + adjective + que* は、2つのものが同じ程度であること(同等)を表します。'
    example_gloss: このタルトはキッシュと同じくらいおいしいです。
  fr.a1.unit14.lesson01.teach.meilleur_que:
    title: …よりよい
    gloss: 〜よりよい
    note: '*Meilleur* は *bon*(よい)の不規則な比較級です。フランス語では *plus bon* とは言いません。'
    example_gloss: このケーキは最初のものよりおいしいです。
  fr.a1.unit14.lesson01.teach.cher_bon_marche:
    title: 高い、安い
    gloss: 高い、安い・お買い得な
    note: '*Bon marché* は不変で、形が変わりません。ほかの形容詞のように性数一致しそうに見えますが、変化しません。'
    example_gloss:
    - そのチーズは高いです。
    - その野菜は安いです。
  fr.a1.unit14.lesson01.teach.facile_difficile:
    title: 簡単な、難しい
    gloss: 簡単な、難しい
    note: レシピを説明するときによく使う形容詞のペアです。どちらも男性形と女性形が同じ形で、複数形では -s をつけます(*faciles*、*difficiles*)。
    example_gloss:
    - このレシピは簡単です。
    - そのキッシュは少し難しいです。
  fr.a1.unit14.lesson02.teach.le_plus_cher:
    title: いちばん高い
    gloss: 一番高い
    note: '*Le/la plus + 形容詞* で最上級を作ります。比較級と違って、定冠詞が必要です。'
    example_gloss: これは市場でいちばん高いチーズです。
  fr.a1.unit14.lesson02.teach.la_moins_chere:
    title: いちばん安い
    gloss: 一番安い
    note: '*La moins chère* は女性名詞の *recette* に合わせた形です。男性形は *le moins cher* です。'
    example_gloss: これはいちばん安いレシピです。
  fr.a1.unit14.lesson02.teach.le_meilleur:
    title: いちばんよい
    gloss: 一番よい
    note: '*Le meilleur* は *bon* の不規則な最上級で、比較級の *meilleur* に定冠詞がついた形です。'
    example_gloss: これは教室でいちばんおいしいケーキです!
  fr.a1.unit14.lesson02.teach.la_plus_facile:
    title: いちばん簡単な
    gloss: 一番簡単な
    note: 規則的な最上級で、*le/la plus + 形容詞* の型にそのまま当てはまります。
    example_gloss: これはいちばん作りやすいレシピです。
  fr.a1.unit14.lesson02.teach.grammar_superlative_note:
    title: 最上級の型
    gloss: le/la plus + 形容詞。meilleur は不規則
    note: フランス語の最上級はたいてい規則的(*le/la plus + 形容詞*)ですが、*bon* → *meilleur* → *le meilleur* は覚えるべき例外です。
  fr.a1.unit14.lesson02.teach.comparer_les_prix:
    title: 値段を比べようと提案する
    gloss: 買う前に値段を比べましょう。
    note: '*Comparons* は *comparer* の *nous* に対する命令形で、「比べましょう」という意味です。買い物でよく使う表現です。'
  fr.a1.unit14.lesson03.teach.line01:
    title: 2つの選択肢に気づく
    gloss: イネスが「見て、チーズが2種類あるよ。どっちにする?」と言っています。
    note: '*Lequel*(どちら)は、すでに挙がっている2つの選択肢から相手に選んでもらうときに使います。'
  fr.a1.unit14.lesson03.teach.line02:
    title: 比べて品質に触れる
    gloss: マチューが「こっちはもう一方より高いけど、おいしそうだよ」と言っています。
    note: '*Avoir l''air* + 形容詞(…に見える)は、まだ味見していない品質について断定を和らげます。'
  fr.a1.unit14.lesson03.teach.line03:
    title: 比較に異を唱える
    gloss: イネスが「そうかな?私は、もう一方も同じくらいおいしいし、もっと安いと思う」と言っています。
    note: 1つの返事の中で *aussi* と *moins* を使い、やんわり反論しています。比べる相手のチーズ(マチューが選んだほう)は文脈で明らかなので、*que* は省かれています。
  fr.a1.unit14.lesson03.teach.line04:
    title: 値段の点を認める
    gloss: マチューが「そうだね、2つのうちでは安いほうだ」と同意しています。
    note: '*Des deux*(2つのうち)は、最上級の範囲を市場全体ではなくこの2つに限定します。'
  fr.a1.unit14.lesson03.teach.line05:
    title: 最終決定をする
    gloss: イネスが「じゃあそっちにしよう。教室にはそれがいちばんいい選択だよ」と言っています。
    note: '*Celui-là*(あちらのもの)は、今話していた安いほうのチーズを指します。'
  fr.a1.unit14.lesson03.teach.line06:
    title: よい点に触れる
    gloss: マチューが「了解。それにデザート用のお金がもっと残るね!」と言っています。
    note: '*Il nous reste*(私たちに残っている)は、「…が残っている」と言うときによく使う言い方です。'
