  fr.a1.unit02.lesson06.recipe_count_dialogue:
    title: Inès と Mathieu と材料を数える
teaching:
  fr.a1.unit02.lesson01.teach.zero:
    title: ゼロ
    gloss: ゼロ
    note: '*Zéro* は数そのものとしても、数字の並びを一桁ずつ読み上げるときの数字としても使われます。'
  fr.a1.unit02.lesson01.teach.un:
    title: '1'
    gloss: '1'
    note: '*Un* は男性形で、女性名詞の前では女性形の *une* になります(*une tasse*、カップ1杯)。数えるときのように単独で言う場合は *un* のままです。'
  fr.a1.unit02.lesson01.teach.deux:
    title: '2'
    gloss: '2'
    note: '*Deux* は、名詞の性にかかわらず形が変わりません。'
  fr.a1.unit02.lesson01.teach.trois:
    title: '3'
    gloss: '3'
    note: '*Trois* は形が変わりません。'
  fr.a1.unit02.lesson01.teach.quatre:
    title: '4'
    gloss: '4'
    note: '*Quatre* は形が変わりません。'
  fr.a1.unit02.lesson01.teach.cinq:
    title: '5'
    gloss: '5'
    note: '*Cinq* は形が変わりません。語末の q は通常発音されます。語末の子音を発音しない数が他にいくつかあるので、注意しましょう。'
  fr.a1.unit02.lesson01.teach.six:
    title: Six
    gloss: '6'
    note: '*Six* は単独で言うときは語末の /s/ を発音しますが、子音で始まる名詞の前では語末の子音を発音しません(*six livres* は「si livres」のように聞こえます)。'
  fr.a1.unit02.lesson01.teach.sept:
    title: '7'
    gloss: '7'
    note: '*Sept* は形が変わりません。p は発音せず、語末の t だけを発音します。'
  fr.a1.unit02.lesson01.teach.huit:
    title: '8'
    gloss: '8'
    note: '*Huit* は形が変わりません。h はほとんどのフランス語の単語と同じく発音しません。'
  fr.a1.unit02.lesson01.teach.neuf:
    title: '9'
    gloss: '9'
    note: '*Neuf* は形が変わりません。'
  fr.a1.unit02.lesson01.teach.dix:
    title: '10'
    gloss: '10'
    note: '*Dix* は単独で言うときは語末の /s/ を発音します。子音の前では語末の子音を発音しないという点は *six* と同じです。'
  fr.a1.unit02.lesson02.teach.onze:
    title: '11'
    gloss: '11'
    note: '*Onze* から *seize* まで(11〜16)は、それぞれ独立した単語です。21以降が *vingt* を使って作られるのとは違い、*dix* から作られてはいません。'
  fr.a1.unit02.lesson02.teach.douze:
    title: '12'
    gloss: '12'
    note: '*Douze* は1語です。語頭は *deux* に似ていますが、*dix* の形は見えません。'
  fr.a1.unit02.lesson02.teach.treize:
    title: '13'
    gloss: '13'
    note: '*Treize* は1語です。語頭は *trois* に似ていますが、*dix* の形は見えません。'
  fr.a1.unit02.lesson02.teach.quatorze:
    title: '14'
    gloss: '14'
    note: '*Quatorze* は1語です。語頭は *quatre* に似ていますが、*dix* の形は見えません。'
  fr.a1.unit02.lesson02.teach.quinze:
    title: '15'
    gloss: '15'
    note: '*Quinze* は1語です。*cinq* と遠い関係がありますが、*dix* の形は見えません。'
  fr.a1.unit02.lesson02.teach.seize:
    title: '16'
    gloss: '16'
    note: '*Seize* は、1語にまとまった形の最後です。*dix-sept*(17)からは、再び *dix* に一の位をつなげた形になります。'
  fr.a1.unit02.lesson02.teach.vingt:
    title: '20'
    gloss: '20'
    note: '*Vingt* は独立した単語です。21以降は十の位と一の位を組み合わせます(*vingt et un*、*vingt-deux*)。この仕組みはこのあとでもう一度学びます。'
  fr.a1.unit02.lesson02.teach.trente:
    title: '30'
    gloss: '30'
    note: '*Trente* は後ろに続く一の位とハイフンでつなぎます(*trente-quatre*)。ただし1のときだけは、*et* を使います(*trente et un*)。'
  fr.a1.unit02.lesson02.teach.trente_quatre:
    title: '34'
    gloss: '34'
    note: '*Trente-quatre* は、ハイフンでつないで書きます。'
  fr.a1.unit02.lesson02.teach.soixante:
    title: '60'
    gloss: '60'
    note: '*Soixante* は、69までは普通の十の位と同じように使います(*soixante-quatre*、64)。不規則になるのは70からで、次に学びます。'
  fr.a1.unit02.lesson02.teach.soixante_dix:
    title: '70'
    gloss: '70'
    note: フランス語の数でいちばん驚くところです。70を表す専用の単語はありません。*Soixante-dix* は文字どおり「60+10」の意味です。*soixante-dix-neuf*(79、「60+19」)までこの方法で数え、80で *quatre-vingts* という新しい基準が始まります。
  fr.a1.unit02.lesson02.teach.quatre_vingts:
    title: '80'
    gloss: '80'
    note: '*Quatre-vingts* は文字どおり「4×20」の意味で、昔の20進法のなごりです。語末の s が付くのは、単独で使うときや数の最後に来るときだけです(*quatre-vingts*、80)。一の位が続くと s は付きません(*quatre-vingt-un*、81)。'
  fr.a1.unit02.lesson02.teach.quatre_vingt_dix:
    title: '90'
    gloss: '90'
    note: '*Quatre-vingt-dix* は文字どおり「4×20+10」の意味です。70台と同じ20進法の数え方が、*quatre-vingt-dix-neuf*(99)まで続きます。'
  fr.a1.unit02.lesson02.teach.cent:
    title: '100'
    gloss: '100'
    note: '*Cent* はちょうど100を単独で言うときの形で、冠詞は付きません(「*un cent*」とは言いません)。'
  fr.a1.unit02.lesson03.teach.quel_age_as_tu:
    title: くだけた言い方で年齢をたずねる
    gloss: 何歳？
    note: フランス語では、年齢を「どんな年齢を持っているか」という形でたずね、「持つ」を意味する *avoir* を使います。「ある・いる」を表す *être* は使いません。
  fr.a1.unit02.lesson03.teach.jai_vingt_huit_ans:
    title: 自分の年齢を言う
    gloss: 28歳です。
    note: '*Ai* は *avoir* の je に対応する形です。年を表す *ans* は、省略せずに必ず付けます。'
  fr.a1.unit02.lesson03.teach.quel_age_avez_vous:
    title: 丁寧な言い方で年齢をたずねる
    gloss: 何歳？
    note: '*Avez-vous* は *avoir* の *vous* に対応する形で、ユニット1 で学んだ丁寧な言い方に合わせたものです。'
  fr.a1.unit02.lesson03.teach.jai_trente_et_un_ans:
    title: 複合した数で年齢を言う
    gloss: 31歳です。
    note: '*Trente et un* は、ハイフンではなく *et*(と)を使います。30、40、50、60の「1」の形だけがこうなります(*trente et un*、*quarante et un*、*cinquante et un*、*soixante et un*)。71はこの規則に当てはまらず、*soixante et un* ではなく *soixante et onze*(60+11)です。70台は *dix* の形を使って *soixante-dix-neuf*(79)まで数え続けるからです。'
  fr.a1.unit02.lesson03.teach.et_toi_quel_age:
    title: 同じ質問を相手に返す
    gloss: あなたは何歳？
    note: '*Et toi* で、相手への聞き返しが始まります。*et* の後ろでは、強調形の人称代名詞 *toi*(*tu* ではなく)を使います。'
  fr.a1.unit02.lesson04.teach.quel_est_ton_numero:
    title: 電話番号をたずねる
    gloss: 電話番号は何番？
    note: '*Quel* は男性名詞 *numéro* に合わせた形です。女性名詞なら *quelle* になります。'
  fr.a1.unit02.lesson04.teach.numero_ines:
    title: 一桁ずつ読む番号
    gloss: ゼロ、6、1、5、ゼロ、2、9、7、4、3
    note: 実際のフランスの電話番号は10桁で、ふつう2桁ずつ読みます(*zéro six*、*quinze*、*zéro deux*…)。この単元の番号も実際と同じ10桁の形式(06 15 02 97 43)ですが、まず一桁の数字を練習するため、一桁ずつ読みます。
  fr.a1.unit02.lesson04.teach.cest_le:
    title: 番号を切り出す
    gloss: …です。
    note: '*numéro* は男性名詞なので、男性形の定冠詞 *le* を使います。'
  fr.a1.unit02.lesson04.teach.tu_peux_repeter:
    title: もう一度言ってもらう
    gloss: もう一度言ってくれる？
    note: '*Peux* は *pouvoir*(できる)の *tu* に対応する形です。話される数が速すぎて聞き取れないときに役立ちます。'
  fr.a1.unit02.lesson04.teach.bien_sur:
    title: 快く了承する
    gloss: もちろん、いいですよ
    note: '*Bien sûr* は、頼まれごとに同意するときの、親しみのあるよく使う言い方です。'
  fr.a1.unit02.lesson05.teach.jai_besoin_trois_oeufs:
    title: 必要な数量を伝える
    gloss: 卵が3個必要です。
    note: '*J''ai besoin de*(直訳は「私は~の必要を持っている」)は、フランス語で「必要だ」と言う表現で、専用の動詞ではなく *avoir* を使います。日本語の「必要だ」とは仕組みが異なります。'
  fr.a1.unit02.lesson05.teach.combien_oeufs:
    title: 必要な数をたずねる
    gloss: 卵はいくつ必要ですか。
    note: '*De combien d''œufs* は、*de combien*(いくつの)を品物の前に置きます。日本語では「卵は何個」と数が後ろに来るので、語順が異なります。'
  fr.a1.unit02.lesson05.teach.deux_tasses_farine:
    title: 計量した分量を伝える
    gloss: 小麦粉2カップ
    note: '*De* は、計量の単位(*tasses*、カップ)と量る対象(*farine*、小麦粉)を結びます。日本語の「の」に近い働きです。'
  fr.a1.unit02.lesson05.teach.demi_tasse:
    title: 半分の分量を伝える
    gloss: 砂糖半カップ
    note: 接頭辞の *demi-* は名詞の前では形が変わりません(*une demi-tasse*)。一方、名詞の後ろに置く形容詞の *demi* は一致します(*une heure et demie*)。
  fr.a1.unit02.lesson05.teach.jai_quatre_oeufs:
    title: 手元にあるものを伝える
    gloss: テーブルの上に卵が4個あります。
    note: '*J''ai*(持っています)は、すでに手元にあるものを伝えます。まだ足りないものを伝える *j''ai besoin de*(必要です)とは区別します。'
  fr.a1.unit02.lesson06.teach.line01:
    title: 卵の数をたずねる
    gloss: イネスはマチューに、レシピに卵がいくつ必要かたずねます。
    note: イネスとマチューは、ユニット1の *vous* ではなく *tu* を使っています。ワークショップの仲間として、すぐに打ち解けた話し方になったからです。
  fr.a1.unit02.lesson06.teach.line02:
    title: 材料を伝える
    gloss: マチューは、卵が3個と小麦粉が2カップ必要だと言います。
    note: '*J''ai besoin de* は、レシピにまだ必要なものを表します。'
  fr.a1.unit02.lesson06.teach.line03:
    title: 手元にあるものを伝える
    gloss: イネスは、テーブルの上に卵が4個あると言い、砂糖も必要かたずねます。
    note: '*J''ai* は、イネスがすでに持っているものを表し、マチューが必要だと言ったものとは別です。'
  fr.a1.unit02.lesson06.teach.line04:
    title: 少量だと答える
    gloss: マチューは、はい、少しだけ、半カップくらいと答えます。
    note: ここでの *Environ* は「約」「だいたい」の意味で、正確な量をやわらげています。
  fr.a1.unit02.lesson06.teach.line05:
    title: 電話番号をたずねる
    gloss: イネスは「完璧」と言ってから、次の授業のことで連絡できるように、マチューの電話番号をたずねます。
    note: '*Comme ça je t''écris*(「そうすればあなたに連絡できる」)は、理由を添える表現です。連絡先をたずねる前にこう言うのは、会話でよくある自然な習慣です。'
  fr.a1.unit02.lesson06.teach.line06:
    title: 電話番号を伝える
    gloss: マチューは番号を1桁ずつ読み上げます。
    note: '*C''est le* は番号を切り出す言い方で、男性名詞の *numéro* に合わせた形です。'
  fr.a1.unit02.lesson06.teach.line07:
    title: お礼を言って年齢をたずねる
    gloss: イネスはお礼を言ってから、最後にもう一つ、年齢をたずねます。
    note: '*Une dernière question*(「最後にもう一つ質問」)は、同じ会話の中で自然に話題を変える合図です。'
  fr.a1.unit02.lesson06.teach.line08:
    title: 自分の年齢を伝える
    gloss: マチューは28歳だと答え、イネスにも同じことをたずねます。
    note: '*J''ai vingt-huit ans* では、ハイフンでつないだ形を使います。'
  fr.a1.unit02.lesson06.teach.line09:
    title: 自分の年齢を伝える
    gloss: イネスは31歳だと答えます。
    note: '*J''ai trente et un ans* では、31が「~1」の形の数なので、ハイフンではなく *et*(と)を使います。'
