  fr.a1.unit08.lesson01.jours_de_la_semaine:
    title: 曜日
  fr.a1.unit08.lesson02.donner_la_date:
    title: 日付を言う
  fr.a1.unit08.lesson03.dialogue_derniere_seance:
    title: ワークショップの最終回
teaching:
  fr.a1.unit08.lesson01.teach.lundi:
    title: 月曜日
    gloss: 月曜日
    note: フランス語の曜日は男性名詞で、文中でも大文字では書きません。
    example_gloss: ワークショップは月曜日には絶対に開かれません。
  fr.a1.unit08.lesson01.teach.samedi:
    title: 土曜日
    gloss: 土曜日
    note: 冠詞の付いた *le samedi* は「毎週土曜日に」という習慣を表します。*samedi* だけだと特定の土曜日を指し、動詞の時制によって、直近の次の土曜日か、直前の土曜日になります。
    example_gloss: ワークショップは毎週土曜日に開かれます。
  fr.a1.unit08.lesson01.teach.dimanche:
    title: 日曜日
    gloss: 日曜日
    note: ほかの曜日と同じく、男性名詞で大文字では書きません。
    example_gloss: パン屋は毎週日曜日は閉まっています。
  fr.a1.unit08.lesson01.teach.aujourdhui:
    title: 今日
    gloss: 今日
    note: '*Aujourd''hui* は、昔いくつかの部分が合わさってできた語ですが、今は一つの固定した単語です。'
    example_gloss: 今日は土曜日です。
  fr.a1.unit08.lesson01.teach.demain:
    title: 明日
    gloss: 明日
    note: '*Demain* は変化しない語で、どんな文脈でも同じ形で使います。'
    example_gloss: 薬局は明日開きます。
  fr.a1.unit08.lesson01.teach.hier:
    title: 昨日
    gloss: 昨日
    note: '*Hier* は *demain* のちょうど反対の意味です。'
    example_gloss: 昨日、魚を食べました。
  fr.a1.unit08.lesson01.teach.quel_jour_sommes_nous:
    title: 曜日をたずねる
    gloss: 今日は何曜日ですか。
    note: '*Quel jour sommes-nous ?*(直訳は「私たちは何日にいますか」)は、曜日をたずねるときの標準的な言い方です。'
  fr.a1.unit08.lesson02.teach.mars:
    title: 3月
    gloss: 3月
    note: フランス語の月名も曜日と同じく男性名詞で、大文字では書きません。
    example_gloss: ワークショップは3月に終わります。
  fr.a1.unit08.lesson02.teach.quelle_est_la_date:
    title: 日付をたずねる
    gloss: 今日は何日ですか？
    note: '*Quelle est la date... ?* は年月日の日付をたずねる標準的な言い方です。曜日だけをたずねる *Quel jour sommes-nous ?* とは異なります。'
  fr.a1.unit08.lesson02.teach.cest_le_quinze_mars:
    title: 日付を言う
    gloss: 3月15日です。
    note: '*Le* + 基数 + 月名がフランス語の日付の基本の形です。*quinze*(15)のように、序数ではなく基数を使います。'
  fr.a1.unit08.lesson02.teach.nous_sommes_le:
    title: 今日の日付を言う
    gloss: 今日は3月15日です。
    note: '*Nous sommes le...* は、今日の日付を言うときに *C''est le...* と同じようによく使われる言い方です。'
  fr.a1.unit08.lesson02.teach.le_premier:
    title: 1日(月の初日)
    gloss: 1日
    note: '*Le premier* は、基数を使うという規則の唯一の例外です。ほかの日は *le deux*、*le trois* のように基数を使いますが、1日だけは序数の *premier* を使います。'
  fr.a1.unit08.lesson02.teach.le_vingt_deux:
    title: 終了日を言う
    gloss: ワークショップは3月22日に終わります。
    note: '*Se termine*(終わる)は代名動詞です。*vingt-deux* は *le quinze mars* と同じく、ふつうの基数です。'
  fr.a1.unit08.lesson03.teach.line01:
    title: 最終回がいつかたずねる
    gloss: イネスは、ワークショップの最終回がいつかたずねます。
    note: '*C''est quand... ?*(いつですか)は、時期をたずねる自然で簡単な言い方です。'
  fr.a1.unit08.lesson03.teach.line02:
    title: 日付と曜日を言う
    gloss: マチューは、確か3月22日で、土曜日だと言います。
    note: '*Un samedi*(*le* の付かない「ある土曜日」)は、その日付が何曜日に当たるかを示しています。'
  fr.a1.unit08.lesson03.teach.line03:
    title: 今日の日付をたずねる
    gloss: イネスは、今日が何日かたずねます。
    note: 日付をたずねる表現として学んだ *Quelle est la date aujourd'hui ?* と同じです。
  fr.a1.unit08.lesson03.teach.line04:
    title: 今日の日付と、そこまでの期間を言う
    gloss: マチューは、今日は3月15日なので、1週間後だと言います。
    note: '*Dans une semaine*(1週間後)は、今日からの時間の隔たりを表します。'
  fr.a1.unit08.lesson03.teach.line05:
    title: 予定を立てて答える
    gloss: イネスは、ちょうどいい、その機会にデザートを作る時間があると言います。
    note: '*J''ai le temps de* + 不定詞(〜する時間がある)は、何かをするのに十分な時間があると言うときによく使います。'
  fr.a1.unit08.lesson03.teach.line06:
    title: 予定を確認する
    gloss: マチューは、いい考えだね、それじゃあ次の土曜日、22日に会おうと言います。
    note: '*Samedi prochain*(次の土曜日)は、曜日と日付を同時に確認して、やり取りを締めくくります。'
