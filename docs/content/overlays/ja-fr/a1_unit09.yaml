answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: フランス語 A1
  description: 基本的な道のたずね方と教え方(à gauche / à droite、tout droit、au coin de la rue、traverser)を学びます。イネスが調理器具の店を探す場面で、イネスとマチューの料理ワークショップの物語が続きます。フランス語の道案内では、vous に対する命令形("Tournez à gauche")も、現在形("Tu tournes à gauche")も使えます。
units:
  fr.a1.unit09.directions:
    title: どうやって行きますか
lessons:
  fr.a1.unit09.lesson01.vocabulaire_directions:
    title: 道を探すための言葉
  fr.a1.unit09.lesson02.donner_des_indications:
    title: 道案内をする
  fr.a1.unit09.lesson03.dialogue_chercher_la_boutique:
    title: お店を探す
teaching:
  fr.a1.unit09.lesson01.teach.a_gauche:
    title: 左に
    gloss: 左に、左へ
    note: '*À gauche* は、位置(「左にあります」)にも方向(「左に曲がる」)にも使います。'
    example_gloss: パン屋の先で左に曲がってください。
  fr.a1.unit09.lesson01.teach.a_droite:
    title: 右に
    gloss: 右に、右へ
    note: '*à gauche* のちょうど反対の意味で、使い方も同じです。'
    example_gloss: 薬局はカフェの右側にあります。
  fr.a1.unit09.lesson01.teach.tout_droit:
    title: まっすぐ
    gloss: まっすぐ
    note: '*Tout droit* は「まっすぐ」という意味です。形が似ている *à droite*(右に)とは意味が違うので、混同しないようにしましょう。'
    example_gloss: 市場までまっすぐ進んでください。
  fr.a1.unit09.lesson01.teach.au_coin_de_la_rue:
    title: 通りの角に
    gloss: 通りの角に
    note: '*Au coin de* は「~の角に」という意味です。*au coin de la rue*(通りの角に)は、目印としてとてもよく使われる表現です。'
    example_gloss: 店は通りの角にあります。
  fr.a1.unit09.lesson01.teach.traverser:
    title: 渡る
    gloss: 渡る、横切る
    note: '*Traverser* は規則動詞(-er動詞)です：*je traverse*、*tu traverses* など。'
    example_gloss: 店に着くには、通りを渡らなければなりません。
  fr.a1.unit09.lesson01.teach.la_boutique:
    title: 店
    gloss: 店
    note: '*La boutique* は、大型店ではなく、たいてい小さな専門店を指します。'
    example_gloss: 店は通りの角の、右側にあります。
  fr.a1.unit09.lesson01.teach.le_carrefour:
    title: 交差点
    gloss: 交差点、十字路
    note: '*Le carrefour* は2本の道が交わる場所で、口頭の道案内でよく使われる目印です。'
    example_gloss: 交差点で左に曲がってください。
  fr.a1.unit09.lesson02.teach.pour_aller_a:
    title: 行き方をたずねる
    gloss: すみません、お店へはどう行けばいいですか。
    note: '*Pour aller à... ?*(直訳は「~に行くために」)は、場所への行き方をていねいにたずねる標準的な言い方です。'
  fr.a1.unit09.lesson02.teach.tournez_a_gauche:
    title: 左に曲がる
    gloss: 薬局の先で左に曲がってください。
    note: '*Tournez* は *tourner*(曲がる)の *vous* に対する命令形です。よく知らない相手に道を教えるときの普通の言い方です。'
  fr.a1.unit09.lesson02.teach.continuez_tout_droit:
    title: まっすぐ進む
    gloss: 交差点までまっすぐ進んでください。
    note: '*Continuez*(進み続ける)+ *tout droit*(まっすぐ)で、曲がらずに歩き続けるよう伝える標準的な言い方になります。'
  fr.a1.unit09.lesson02.teach.cest_au_coin:
    title: 場所を伝える
    gloss: 通りの角の、右側にあります。
    note: '*au coin de la rue* と *à droite* を組み合わせて、正確な場所を伝えています。'
  fr.a1.unit09.lesson02.teach.cest_loin:
    title: 遠くないと言う
    gloss: 遠くありません。歩いて5分です。
    note: '*À cinq minutes à pied*(歩いて5分)は、マチューが薬局について聞いたときに出てきたのと同じ、徒歩の所要時間の言い方です。'
  fr.a1.unit09.lesson03.teach.line01:
    title: お店についてたずねる
    gloss: イネスは、調理器具を買えるお店を知っているかマチューにたずねます。
    note: '*Tu connais... ?*(知っている？)は、ある場所を知っているかをくだけてたずねる標準的な言い方です。'
  fr.a1.unit09.lesson03.teach.line02:
    title: 最初の道順を教える
    gloss: マチューは「うん、ここから遠くないところに1軒あるよ。交差点で左に曲がって」と答えます。
    note: '*Il y en a une*(1軒ある)では、*boutique* を繰り返さないように *en* を使っています。話し言葉でよく使われる言い方です。'
  fr.a1.unit09.lesson03.teach.line03:
    title: 確認して続きをたずねる
    gloss: イネスは交差点で左だと確認し、その次はどうするのかたずねます。
    note: '*Et ensuite ?*(それから？)は、次の道順をたずねるときの、簡単で自然な言い方です。'
  fr.a1.unit09.lesson03.teach.line04:
    title: 2番目の道順を伝える
    gloss: マチューは、次はまっすぐ進んで通りを渡るように言います。
    note: 2つの方向の動詞を *et* でつなげた形です。短く道順を伝えるときの自然な言い方です。
  fr.a1.unit09.lesson03.teach.line05:
    title: 正確な場所をたずねる
    gloss: イネスは、お店が正確にどこにあるのかをたずねます。
    note: '*Exactement*(正確に)を使うと、大まかな方向よりも詳しい答えを求めることができます。'
  fr.a1.unit09.lesson03.teach.line06:
    title: 正確な場所を伝える
    gloss: マチューは、お店は通りの角で、パン屋のちょうど向かいにあると言います。
    note: '*En face de*(~の向かいに)は目印を使った場所の言い方で、道案内の最後にぴったりの自然な表現です。'
