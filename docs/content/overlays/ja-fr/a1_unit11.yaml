teaching:
  fr.a1.unit11.lesson01.teach.libre:
    title: 空いている
    gloss: 空いている
    note: ここでの *libre* は人の都合が空いていることを表します。お金がかからないという意味では、フランス語は *gratuit* を使います。
    example_gloss: 土曜日は空いている？
  fr.a1.unit11.lesson01.teach.occupe:
    title: 忙しい
    gloss: 忙しい
    note: '*libre* の反対の意味です。性によって形が変わります：*occupé* / *occupée*。'
    example_gloss: 金曜の夜は忙しいです。
  fr.a1.unit11.lesson01.teach.se_retrouver:
    title: 待ち合わせる
    gloss: 待ち合わせる
    note: この意味の *se retrouver* は相互的で、2人以上が互いに会うことを表します。「見つける」という意味の *trouver* とは異なります。
    example_gloss: 今晩はどこで待ち合わせる？
  fr.a1.unit11.lesson01.teach.vers:
    title: ~ごろ(時刻)
    gloss: ~ごろ
    note: '*Vers* + 時刻は、ちょうどの時刻を言うよりやわらかい、おおよその時刻を表します。'
    example_gloss: 7時ごろに寄るね。
  fr.a1.unit11.lesson01.teach.ca_te_dit_de:
    title: ~はどう？
    gloss: 一緒に買い物に行かない？
    note: '*Ça te dit de... ?* + 不定詞は、何かに誘うときによく使うくだけた言い方で、*Voulez-vous... ?* よりも気軽です。'
  fr.a1.unit11.lesson01.teach.venir_chercher:
    title: 迎えに来る
    gloss: 18時ごろに迎えに来てくれる？
    note: '*Venir chercher quelqu''un* は「人を迎えに来る」という意味で、単に「探す」ということではありません。'
  fr.a1.unit11.lesson01.teach.daccord_a_tout_a_lheure:
    title: 了解、またあとで
    gloss: わかった、またあとでね！
    note: '*D''accord*(わかった)は約束を確認する言葉です。*à tout à l''heure* は、同じ日のうちにまた会うときに使います。'
  fr.a1.unit11.lesson02.teach.je_ne_peux_pas:
    title: 誘いを断る
    gloss: 無理なんだ、忙しくて。
    note: '*Je ne peux pas*(できません)に理由を添えると、簡単で丁寧な断り方になります。'
  fr.a1.unit11.lesson02.teach.avec_plaisir:
    title: 喜んで受ける
    gloss: 喜んで！
    note: '*Avec plaisir*(直訳は「喜びをもって」)は、誘いを温かく、うれしそうに受ける言い方です。'
  fr.a1.unit11.lesson02.teach.a_quelle_heure_on_se_voit:
    title: 時間をたずねる
    gloss: 何時に会う？
    note: '*On se voit*(くだけた言い方で「会う」)は、待ち合わせを決めるときに *se retrouver* の代わりによく使う気軽な表現です。'
  fr.a1.unit11.lesson02.teach.devant_le_marche:
    title: 場所を提案する
    gloss: 市場の前でどう？
    note: '*Ça te va ?*(それで大丈夫？)は、提案した内容が相手に合うかどうかを確かめる表現です。'
  fr.a1.unit11.lesson02.teach.parfait_alors:
    title: 約束を確認する
    gloss: 完璧、じゃあ金曜日にね！
    note: ここでの *Alors* は「それでは」の意味で、結論を確認して打ち合わせを締めくくります。
  fr.a1.unit11.lesson03.teach.line01:
    title: 一緒に買い物を提案する
    gloss: イネスはマチューに、ワークショップの前に一緒に買い物をしないかと誘います。
    note: '*Ça te dit de... ?* は、気軽な提案でやり取りを始める表現です。'
  fr.a1.unit11.lesson03.teach.line02:
    title: 喜んで受け、場所をたずねる
    gloss: マチューは喜んで承諾し、どこで会うかをたずねます。
    note: '*Avec plaisir*(喜んで)と *se retrouver*(待ち合わせる)を組み合わせた表現です。'
  fr.a1.unit11.lesson03.teach.line03:
    title: 場所と曜日を提案する
    gloss: イネスは、金曜の夜に市場の前はどうかと提案します。
    note: 場所(*devant le marché*)と曜日(*vendredi soir*)を組み合わせた短い提案です。
  fr.a1.unit11.lesson03.teach.line04:
    title: 承諾して時間をたずねる
    gloss: マチューは同意し、何時ごろかをたずねます。
    note: '*D''accord* で場所と曜日に同意し、続く質問で正確な時間を絞り込みます。'
  fr.a1.unit11.lesson03.teach.line05:
    title: 具体的な時間を提案する
    gloss: イネスは、午後6時ごろにマチューが迎えに来てくれるかをたずねます。
    note: '*venir chercher* と、具体的な時刻を伴う *vers* を使っています。'
  fr.a1.unit11.lesson03.teach.line06:
    title: すべてを確認する
    gloss: マチューは、完璧、じゃあ金曜日の午後6時に市場の前でね、と言います。
    note: 曜日・時間・場所の3つをまとめて繰り返し、やり取りをはっきり締めくくります。
