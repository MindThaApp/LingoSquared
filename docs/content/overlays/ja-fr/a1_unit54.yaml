teaching:
  fr.a1.unit54.lesson01.teach.l_animal_un:
    title: 動物、ペット
    gloss: 動物／ペット
    note: '*Un animal* は「動物」全般を表す語で、*un animal de compagnie*(直訳は「仲間の動物」)は特に「ペット」を指します。'
    example_gloss:
    - 犬は動物です。
    - 犬はペットでもあります。
  fr.a1.unit54.lesson01.teach.le_chien_le:
    title: 犬と猫
    gloss: 犬／猫
    example_gloss:
    - カミーユは犬を飼っています。
    - トマは猫を飼っています。
  fr.a1.unit54.lesson01.teach.le_poisson_l:
    title: 魚と鳥
    gloss: 魚／鳥
    example_gloss:
    - おじいさんは魚を飼っています。
    - Ninaは鳥を飼っています。
  fr.a1.unit54.lesson01.teach.tu_as_un:
    title: ペットを飼っていますか？
    gloss: ペットを飼っていますか？
    note: これまでの課で学んだ *Tu as ... ?* の疑問文と同じ型です。
  fr.a1.unit54.lesson01.teach.oui_j_ai:
    title: はい、犬を飼っています
    gloss: はい、犬を飼っています。
    note: このユニットの新しい語彙を使った、簡単な肯定の答えです。
  fr.a1.unit54.lesson01.teach.non_je_n:
    title: いいえ、ペットは飼っていません
    gloss: いいえ、ペットは飼っていません。
    note: 否定文では *un* の代わりに *Pas d'* を使います：*Je n'ai pas d'animal de compagnie.* 文法ノートも見てください。
  fr.a1.unit54.lesson01.teach.apres_ne_pas:
    title: Pas de:un/une/des の否定
    gloss: '*ne ... pas* の後ろでは、*un*、*une*、*des* は *de* または *d''* になります。すでに学んだ *Je n''ai pas de temps* や、ここで出てきた *Je n''ai pas d''animal de compagnie* がその例です。'
    note: すでに学んだ *Je n'ai pas de temps* と同じ型です。新しい文法ではなく、別の名詞に当てはめるだけです。
  fr.a1.unit54.lesson02.teach.promener:
    title: （動物を）散歩させる
    gloss: （動物を）散歩させる
    note: '*Promener*(散歩させる)は規則的な *-er* 動詞です。文法ノートも見てください。'
    example_gloss: 私は毎日犬を散歩させます。
  fr.a1.unit54.lesson02.teach.promener_est_un:
    title: Promener は規則的な -er 動詞
    gloss: '*Promener* は *cuisiner* と同じ規則的な *-er* 動詞です：*je promène, tu promènes, il promène le chien*。*e* のアクセントは、その音を発音することを示します。'
    note: すでに学んだ他の *-er* 動詞と同じく、動詞は常にひとまとまりで、分かれることはありません。
  fr.a1.unit54.lesson02.teach.donner_a_manger:
    title: 餌を与える
    gloss: 餌をあげる
    example_gloss: 私は毎日猫に餌をあげます。
  fr.a1.unit54.lesson02.teach.jouer_avec:
    title: ～と遊ぶ
    gloss: ～と遊ぶ
    example_gloss: トマは猫と遊んでいます。
  fr.a1.unit54.lesson02.teach.je_promene_le:
    title: 私は毎日犬を散歩させます
    gloss: 私は毎日犬を散歩させます。
    note: '*promener* と、以前の課で学んだ *tous les jours*(毎日)を組み合わせた文です。'
  fr.a1.unit54.lesson02.teach.je_donne_a:
    title: 私は毎日猫に餌を与えます
    gloss: 私は毎日猫に餌をあげます。
    note: '*donner à manger*(直訳は「食べるために与える」)と *tous les jours* を組み合わせた文です。'
  fr.a1.unit54.lesson03.teach.au_pluriel_on:
    title: 複数形：chien -> chiens
    gloss: 複数形は、たいてい発音されない *s* を付けて作ります：*chien -> chiens*、*chat -> chats*。*-al* で終わる名詞は *-aux* に変わります：*animal -> animaux*。
    note: 規則的なフランス語の複数形の作り方を、動物の名詞を例にして初めて紹介します。名詞に s を付けても、発音は変わりません。
  fr.a1.unit54.lesson03.teach.chiens_chats:
    title: 犬と猫
    gloss: 犬／猫
    example_gloss:
    - マチューは犬が大好きです。
    - レアは猫が大好きです。
  fr.a1.unit54.lesson03.teach.poissons_oiseaux:
    title: 魚と鳥（複数形）
    gloss: 魚／鳥
    example_gloss:
    - 私は魚が大好きです。
    - おじいさんは鳥が大好きです。
  fr.a1.unit54.lesson03.teach.j_adore_les:
    title: 私は動物が大好きです
    gloss: 私は動物が大好きです。
    note: '*Adorer*(大好きである)の後ろには名詞がそのまま続き、一般的な好みを言うときは *les* を使います：*J''adore les animaux.*'
  fr.a1.unit54.lesson03.teach.lea_adore_les:
    title: レアは猫が大好きだけれど、ペットはいない
    gloss: レアは猫が大好きですが、ペットは飼っていません。
    note: 第5課の読解の中心となる対比を示しています。
  fr.a1.unit54.lesson04.teach.mathieu_tu_as:
    title: マチューがペットについて尋ねる
    gloss: マチュー：カミーユ、ペットを飼っている？
  fr.a1.unit54.lesson04.teach.camille_oui_j:
    title: カミーユは犬を飼っている
    gloss: カミーユ：うん、犬を飼っているよ。
  fr.a1.unit54.lesson04.teach.mathieu_comment_est:
    title: マチューがどんな様子か尋ねる
    gloss: マチュー：どんな犬なの？
    note: 外見の課で学んだ *Comment est-il ?* を、今度は動物について尋ねるのに使っています。
  fr.a1.unit54.lesson04.teach.camille_il_a:
    title: カミーユが自分の犬を説明する
    gloss: カミーユ：毛は茶色で、小さいよ。
    note: 外見についてのユニットで学んだ髪の色や大きさの語彙を、人の髪ではなく動物の毛の説明に使っています。
  fr.a1.unit54.lesson04.teach.il_et_le:
    title: 動物に使う Il/le
    gloss: '*Il*(彼)と *le*(彼を)は、人だけでなく、オスの動物にも使えます。'
    note: これまでのこのコースでは、*il* と *le* はいつも人を指していました。ここでは動物にも使えることをはっきり示しています。
  fr.a1.unit54.lesson04.teach.mathieu_tu_le:
    title: マチューが散歩について尋ねる
    gloss: マチュー：毎日散歩に連れて行っているの？
  fr.a1.unit54.lesson04.teach.camille_oui_je:
    title: カミーユが毎日の世話について話す
    gloss: カミーユ：うん、毎日散歩に連れて行って、えさもあげているよ。
  fr.a1.unit54.lesson05.teach.mathieu_et_lea:
    title: 動物について話すマチュー、レア、トマ
    gloss: マチューとレアは二人とも動物が大好きですが、二人ともペットは飼っていません。マチューは犬が大好きで、レアは猫が大好きです。一方トマはペットを飼っています。猫です。トマはよく猫と遊び、毎日えさをあげています。あなたはペットを飼っていますか？
    note: 動物が好きなことと、実際に飼っていることの違いを対比しています。これがこの学習目標で伝えたいポイントです。
    glosses:
      adorent: 愛する
      tous: 両方とも
      animaux: 動物
      deux: 両方とも
      compagnie: ペット
      chiens: 犬たち
      chats: 猫たち
      chat: 猫
      joue: 遊ぶ
      donne: 与える
      chaque: 毎～
      manger: 餌
  fr.a1.unit54.lesson05.teach.thomas_joue_souvent:
    title: トマはよく猫と遊ぶ
    gloss: トマはよく猫と遊んでいます。
    note: '*Souvent*(よく)は、これまでの日課の文と同じく、動詞のすぐ後ろに置きます。'
  fr.a1.unit54.lesson05.teach.j_adore_les:
    title: 私は犬が大好きです。ペットは飼っていません。
    gloss: 私は犬が大好きです。ペットは飼っていません。
    note: このユニットの作文問題でそのまま応用できる、二文からなる解答例です。
  fr.a1.unit54.lesson06.teach.camille_nina_tu:
    title: カミーユがニナに尋ねる
    gloss: カミーユ：ニナも、ペットを飼っているの？
  fr.a1.unit54.lesson06.teach.nina_oui_j:
    title: NinaはPicoという鳥を飼っています
    gloss: Nina：はい、鳥を飼っています。名前はPicoです。
    note: '*Il s''appelle*(名前は〜です)は、最初の課で学んだ自己紹介の動詞をもう一度使っています。'
  fr.a1.unit54.lesson06.teach.mathieu_comme_c:
    title: マチューの反応
    gloss: マチュー：いいね！毎日その子と何をしているの？
  fr.a1.unit54.lesson06.teach.nina_je_lui:
    title: Ninaは毎日その鳥に餌を与えます
    gloss: Nina：毎日その鳥に餌を与えています。
  fr.a1.unit54.lesson06.teach.mathieu_j_adore:
    title: マチューも鳥が大好き
    gloss: マチュー：ぼくも鳥が大好きだよ。
  fr.a1.unit54.lesson06.teach.camille_c_est:
    title: カミーユが会話を締めくくる
    gloss: カミーユ：すてきだね、私たち三人とも動物が大好きなんて！
    note: このユニットで登場した三人と動物についての話をまとめて、会話を締めくくっています。
