teaching:
  fr.a1.unit45.lesson01.teach.tu_fais_quoi:
    title: 相手の仕事をたずねる
    gloss: 仕事は何をしていますか？
    note: 職業をたずねるときの、標準的でくだけた言い方です。
  fr.a1.unit45.lesson01.teach.le_metier_cuisinier:
    title: 職業/料理人
    gloss: 職業;料理人
    note: '*Métier*(職業)は男性名詞で、*le métier* となります。*Cuisinier* は女性の場合は形が変わります:*un cuisinier*、*une cuisinière*。'
    example_gloss:
    - あなたの仕事は何ですか?
    - 私は料理人として働いています。
  fr.a1.unit45.lesson01.teach.je_travaille_comme:
    title: 料理人だと言う
    gloss: 私は料理人として働いています。
    note: '*Travailler comme* + 職業は、仕事を述べるときの標準的な型です。職業名の前に冠詞は付けません。'
  fr.a1.unit45.lesson01.teach.infirmiere:
    title: 看護師
    gloss: 看護師
    note: '*Infirmière* は女性形(*une infirmière*)で、男性形は *infirmier*(*un infirmier*)です。このカードでは女性形を学びますが、例文では男性形が使われています。'
    example_gloss: 私は看護師として働いています。
  fr.a1.unit45.lesson01.teach.je_travaille_comme_2:
    title: 看護師だと言う
    gloss: 私は看護師として働いています。
    note: '*cuisinier* と同じ *travailler comme* の型です。女性形は *infirmière* です。'
  fr.a1.unit45.lesson02.teach.ou_travailles_tu:
    title: 職場をたずねる
    gloss: どこで働いていますか?
    note: '*Tu fais quoi dans la vie ?* に続けて、そのままたずねられる質問です。'
  fr.a1.unit45.lesson02.teach.je_travaille_dans:
    title: レストランで働いていると言う
    gloss: 私はレストランで働いています。
    note: たくさんあるレストランのうちの一つなので、ここでは *un restaurant* と不定冠詞を使います。
  fr.a1.unit45.lesson02.teach.l_hopital:
    title: 病院
    gloss: その病院
    note: '*Hôpital* は男性名詞で、母音で始まる発音なので *l''hôpital* となります。'
    example_gloss: 私は病院で働いています。
  fr.a1.unit45.lesson02.teach.je_travaille_a:
    title: 病院で働く
    gloss: 私は病院で働いています。
    note: '*À l''hôpital* では定冠詞を使います。特定の、よく知られた場所だからです。*le* は母音の前で *l''* になります。'
  fr.a1.unit45.lesson02.teach.certaines_personnes_travaillent:
    title: オフィスで働く
    gloss: オフィスで働く人もいます。
    note: '*Dans un bureau*(オフィスで)には、*dans un restaurant* と同じように冠詞が付きます。'
  fr.a1.unit45.lesson03.teach.je_commence_a:
    title: 始業時間
    gloss: 私は9時に始めます。
    note: '*Commence* は *commencer*(始める)の *je* の形です。*à neuf heures* で時刻を表します。'
  fr.a1.unit45.lesson03.teach.je_travaille_du:
    title: 勤務日
    gloss: 私は月曜日から金曜日まで働いています。
    note: '*Du lundi au vendredi* は「月曜日から金曜日まで」という意味です。*du* は *de* + *le*、*au* は *à* + *le* が合わさった形です。'
  fr.a1.unit45.lesson03.teach.la_pause:
    title: 休憩
    gloss: 休憩
    note: '*Pause* は女性名詞です。*la pause* と言います。'
    example_gloss: 12時に休憩があります。
  fr.a1.unit45.lesson03.teach.j_ai_une:
    title: 休憩を取る
    gloss: 12時に休憩があります。
    note: '*Avoir une pause*(休憩がある・休憩を取る)は、決まった自然な言い方です。'
  fr.a1.unit45.lesson03.teach.je_finis_a:
    title: 終業時間
    gloss: 私は5時に終わります。
    note: '*Finis* は *finir*(終える)の *je* の形です。'
  fr.a1.unit45.lesson03.teach.je_commence_a_2:
    title: 一日の仕事
    gloss: 私は9時に始めて、5時に終わります。
    note: '*je commence* と *je finis* を *et* でつなぎ、一日の仕事を一文で表しています。'
  fr.a1.unit45.lesson04.teach.avec_il_ou:
    title: il と elle のときの動詞の語尾
    gloss: 「彼」や「彼女」が主語のとき、-er 動詞は「私」のときと同じ形のままです。私は働く、彼は働く、彼女は働く。
    note: '*Travaille* は *je*、*il*、*elle* のどれでも同じ形です。規則的な *-er* 動詞は、三人称でも何も付け加えません。'
  fr.a1.unit45.lesson04.teach.camille_travaille_comme:
    title: カミーユの仕事
    gloss: カミーユは看護師として働いています。
    note: '*Travaille* は *je*、*il*、*elle* に使えます。語尾は発音されないので、三つの形は同じ音になります。'
  fr.a1.unit45.lesson04.teach.mathieu_travaille_comme:
    title: マチューの仕事
    gloss: マチューは料理人として働いています。
    note: '*Camille travaille comme infirmière* と同じ語尾です。'
  fr.a1.unit45.lesson04.teach.elle_travaille_a:
    title: 代名詞を使う
    gloss: 彼女は病院で働いています。彼はレストランで働いています。
    note: '*Elle* と *il* はカミーユとマチューの名前の代わりをしますが、動詞の形は変わりません。'
  fr.a1.unit45.lesson05.teach.camille_travaille_comme:
    title: 二人の仕事のプロフィールを読む
    gloss: カミーユは病院で看護師として働いています。7時に始めて、月曜日から金曜日まで働きます。マチューはレストランで料理人として働いています。11時に始めて、4時に休憩を取ります。
    note: それぞれの人の仕事、職場、勤務時間を分けて確認しましょう。
    glosses:
      travaille: 働いています
      infirmière: 看護師
      l'hôpital: 病院
      commence: 始まり
      sept: '7'
      lundi: 月曜日
      vendredi: 金曜日
      cuisinier: 料理人
      restaurant: レストラン
      onze: '11'
      pause: 休憩
  fr.a1.unit45.lesson06.teach.camille_salut_mathieu:
    title: カミーユが仕事について尋ねる
    gloss: カミーユ:こんにちは、マチュー!気になるんだけど、ところでどんなお仕事をしているの?
    note: '*Au fait*(ところで)を付けると、質問が詰問のようにならず、親しみのある興味を表せます。'
  fr.a1.unit45.lesson06.teach.mathieu_je_travaille:
    title: マチューが答える
    gloss: マチュー:レストランで料理人として働いているよ。君は?
    note: '*Et toi ?* は、同じ質問を相手に返すときの定番の言い方です。'
  fr.a1.unit45.lesson06.teach.camille_je_travaille:
    title: カミーユが答える
    gloss: カミーユ:私は病院で看護師として働いているの。
    note: これまでの課で出てきた、カミーユの職業と職場と同じです。
  fr.a1.unit45.lesson06.teach.mathieu_tu_fais:
    title: マチューが勤務時間を尋ねる
    gloss: マチュー:勤務時間はどうなっているの?
    note: '*Tu fais quels horaires ?* は、相手の勤務時間を尋ねる自然な言い方です。*quels* は複数形の *horaires* に合わせた形です。'
  fr.a1.unit45.lesson06.teach.camille_je_commence:
    title: カミーユが勤務時間を話す
    gloss: カミーユ:7時に始めて、月曜日から金曜日まで働いているわ。
    note: これまでの読み物のプロフィールで出てきた勤務時間と同じです。
  fr.a1.unit45.lesson06.teach.mathieu_c_est:
    title: マチューが反応する
    gloss: マチュー:早いね!僕はもっと遅くて、11時に始めるよ。
    note: これまでの課で出てきた、マチューの始業時間と同じです。
  fr.a1.unit45.lesson06.teach.camille_chaque_metier:
    title: カミーユが話をまとめる
    gloss: カミーユ:仕事にはそれぞれ独自のリズムがあるのよね、きっと。
    note: 自然で考えさせる締めくくりの一言です。意味が分かれば十分で、そのまま言えるようにする必要はありません。
