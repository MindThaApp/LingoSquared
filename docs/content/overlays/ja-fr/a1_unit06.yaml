  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: フランス語 A1
  description: 一日の時間帯と時刻の言い方(heure(s)、et quart、et demie、moins le quart)。イネスとマチューの料理ワークショップの話が続き、次回の予定を決めます。フランス語では、公式な場面や予定を伝える場面で24時間表記(dix-huit heures trente)を使うことが多く、この単元で学んだくだけた言い方とあわせて学びます。
units:
  fr.a1.unit06.time:
    title: 何時ですか?
lessons:
  fr.a1.unit06.lesson01.moments_de_la_journee:
    title: 一日の時間帯
  fr.a1.unit06.lesson02.dire_lheure:
    title: 時刻の伝え方
  fr.a1.unit06.lesson03.dialogue_prochain_atelier:
    title: 次のワークショップ
teaching:
  fr.a1.unit06.lesson01.teach.heure:
    title: 時間;時刻
    gloss: 時間;時刻
    note: '*Heure* は女性名詞です。時刻を言うときの単位としても使います(*dix heures* = 10時)。'
    example_gloss: 何時ですか?
  fr.a1.unit06.lesson01.teach.matin:
    title: 朝
    gloss: 朝
    note: '*Matin* は男性名詞です。'
    example_gloss: 市場は朝に開いています。
  fr.a1.unit06.lesson01.teach.apres_midi:
    title: 午後
    gloss: 午後
    note: '*Après-midi* は男性名詞にも女性名詞にもなります(男性の方が一般的)。母音の前なので *l''* と省略されます。'
    example_gloss: 私は午後に働きます。
  fr.a1.unit06.lesson01.teach.soir:
    title: 夕方;晩
    gloss: 夕方;晩
    note: '*Soir* は男性名詞です。'
    example_gloss: 料理ワークショップは夕方にあります。
  fr.a1.unit06.lesson01.teach.midi:
    title: 正午
    gloss: 正午
    note: 時刻を表す *midi* には冠詞を付けません(*à midi*。*au midi* とは言いません)。
    example_gloss: 私たちは正午に食事をします。
  fr.a1.unit06.lesson01.teach.minuit:
    title: 真夜中
    gloss: 真夜中
    note: '*Minuit* も *midi* と同じく冠詞を付けません。'
    example_gloss: ワークショップが真夜中を過ぎることはありません。
  fr.a1.unit06.lesson01.teach.latelier_commence_le_soir:
    title: ワークショップの時間帯を言う
    gloss: ワークショップは朝ではなく夕方に始まります。
    note: '*le soir* と *le matin* を対比させ、この課の語彙の2つの名詞を使っています。'
  fr.a1.unit06.lesson02.teach.quelle_heure_est_il:
    title: 時刻をたずねる
    gloss: 何時ですか?
    note: '*Quelle heure est-il ?* は、時刻をたずねるときの標準的でどんな場面でも使える言い方です。*-il* は動詞の後ろに置かれ、疑問を表します。'
  fr.a1.unit06.lesson02.teach.il_est_dix_heures:
    title: 時刻を言う
    gloss: 10時です。
    note: '*Il est* + 数字 + *heures* が、何時かを言うときの基本の形です。*heures* は複数形ですが、*une heure*(1時)のときだけ単数です。'
  fr.a1.unit06.lesson02.teach.et_quart:
    title: 「〜時15分」を言う
    gloss: 10時15分です。
    note: '*Et quart*(15分)は、その時刻に15分を足す言い方です。'
  fr.a1.unit06.lesson02.teach.et_demie:
    title: 「〜時半」を言う
    gloss: 10時半です。
    note: '*Et demie*(半)は30分を足す言い方です。*demie* は *heure* に合わせて女性形の -e が付きます。'
  fr.a1.unit06.lesson02.teach.moins_le_quart:
    title: 「〜時15分前」を言う
    gloss: 11時15分前です。
    note: '*Moins le quart*(15分を引く)は、今の時刻ではなく次の時刻から数えて戻る言い方です。「10時45分」の感覚で dix heures を使わないよう注意しましょう。'
  fr.a1.unit06.lesson02.teach.a_quelle_heure:
    title: 何時に始まるかをたずねる
    gloss: ワークショップは何時に始まりますか?
    note: '*À quelle heure ?*(何時に)は、予定されている出来事についてたずねるときに使い、一般的な *Quelle heure est-il ?* とは区別されます。'
  fr.a1.unit06.lesson03.teach.line01:
    title: 来週の開始時刻をたずねる
    gloss: イネスが来週のワークショップは何時か聞いています。
    note: '*La semaine prochaine*(来週)を、この課で学んだ *à quelle heure* の質問と組み合わせています。'
  fr.a1.unit06.lesson03.teach.line02:
    title: 開始時刻を言う
    gloss: マチューは、18時30分に始まると思う、と言っています。
    note: '*Dix-huit heures trente* は、フランスで予定を伝えるときによく使う24時間表記で、くだけた *et demie* の言い方とは異なります。'
  fr.a1.unit06.lesson03.teach.line03:
    title: 夕方であることを確認する
    gloss: イネスが、朝ではなく夕方なのかと確認しています。
    note: '*le soir* と *le matin* を対比させた、短い確認の質問です。'
  fr.a1.unit06.lesson03.teach.line04:
    title: 確認して理由を言う
    gloss: マチューは夕方だと確認し、仕事のあとの方が都合がいいと言っています。
    note: '*Après le travail*(仕事のあと)は、わかりやすい実用的な理由を表しています。'
  fr.a1.unit06.lesson03.teach.line05:
    title: 終了時刻をたずねる
    gloss: イネスが何時に終わるかたずねています。
    note: '*Finit*(終わる)は、直前の会話の *commence*(始まる)と対になっています。'
  fr.a1.unit06.lesson03.teach.line06:
    title: 終了時刻を言う
    gloss: マチューは、いつもどおり20時15分ごろだと言っています。
    note: '*Vers*(ごろ)は大体の時刻を表し、正確な時刻を示す *à* よりやわらかい言い方です。'
  fr.a1.unit06.lesson03.teach.line07:
    title: 予定を確認する
    gloss: イネスが、では来週の18時30分に会いましょう、と確認しています。
    note: 確認した時刻をもう一度繰り返して会話を締めくくります。フランス語で予定を確認する自然な言い方です。
