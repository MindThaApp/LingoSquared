teaching:
  fr.a1.unit49.lesson01.teach.content_triste_en:
    title: うれしい、悲しい、怒っている
    gloss: うれしい、悲しい、怒っている
    note: '*être*(~である)と使う、基本的な気持ちを表す3つの言葉です。*content* には女性形の *contente* がありますが、*triste* と *en colère* は形が変わりません。'
    example_gloss:
    - 私はうれしいです。
    - 私は悲しいです。
    - 私は怒っています。
  fr.a1.unit49.lesson01.teach.je_suis_content:
    title: うれしいと言う
    gloss: 私はうれしいです。
    note: '*Être*(~である)+気持ちを表す形容詞が基本の型です。日本語の「私は~です」に近い言い方です。'
  fr.a1.unit49.lesson01.teach.je_ne_suis:
    title: 気持ちを対比させる
    gloss: 私は怒っていません、悲しいんです。
    note: '*Ne ... pas* は動詞をはさみます。そのあとの文で本当の気持ちを言います。'
  fr.a1.unit49.lesson02.teach.pourquoi_es_tu:
    title: 理由をたずねる
    gloss: どうしてうれしいの?
    note: '*Pourquoi*(なぜ)は理由をたずねるときの基本的な疑問詞です。'
  fr.a1.unit49.lesson02.teach.je_suis_content:
    title: 理由を言う
    gloss: 新しいアパートに住めるので、私はうれしいです。
    note: '*Parce que*(なぜなら)は理由を表す節を導きます。*il* の前では *parce qu''* と短くなります。'
  fr.a1.unit49.lesson02.teach.je_suis_triste:
    title: よくない理由
    gloss: 雨が降っているので、私は悲しいです。
    note: 天気の単元で学んだ *il pleut*(雨が降る)を、理由の節として再び使います。
  fr.a1.unit49.lesson03.teach.nerveux:
    title: 緊張している
    gloss: 緊張している
    note: 緊張を表す基本的な言葉です。
    example_gloss: 私は初めてのシフトを前に緊張しています。
  fr.a1.unit49.lesson03.teach.je_suis_nerveux:
    title: 何に緊張しているかを言う
    gloss: 私は初めてのシフトを前に緊張しています。
    note: '*Avant*(直訳は「~の前」)を使って、緊張の対象となる出来事を示します。「~を前に」と言うときの感覚に近い表現です。'
  fr.a1.unit49.lesson03.teach.ne_t_inquiete:
    title: 相手を安心させる
    gloss: 心配しないで。
    note: '*Ne t''inquiète pas*(直訳は「自分を心配させないで」)は、安心させるときの決まった言い方です。*s''inquiéter* は代名動詞です。'
  fr.a1.unit49.lesson04.teach.comment_se_sent:
    title: 相手の気持ちをたずねる
    gloss: マチューはどんな気持ちですか。
    note: '*Se sentir*(感じる、代名動詞)は、気持ちの状態をたずねたり述べたりするときの基本の言い方です。健康の単元にも出てきます。'
  fr.a1.unit49.lesson04.teach.il_se_sent:
    title: 人の気持ちを説明する
    gloss: 彼は緊張しています。
    note: '*Se*(自分を)は3人称の再帰代名詞で、*sent* と組になります。'
  fr.a1.unit49.lesson04.teach.pourquoi_se_sent:
    title: 人がなぜそう感じるのかをたずねる
    gloss: なぜ彼は緊張しているのですか。
    note: '*pourquoi* と *Il se sent nerveux* の *se sentir* を組み合わせた形です。*sent-il* にはハイフンを付けます。'
  fr.a1.unit49.lesson05.teach.salut_camille_je:
    title: 気持ちについてのメッセージを読む
    gloss: やあカミーユ、初めてのひとりでのシフトを前に、ちょっと緊張しています。でも、新しい仕事と新しいアパートがあるので、うれしくもあります。きっとうまくいくと思います。
    note: 書き手が何に緊張しているか、何がうれしいのか、全体としてどう見通しているかをつかみましょう。
    glosses:
      peu: 少し
      nerveux: 緊張している
      premier: 最初の
      service: シフト
      seul: ひとりで
      content: うれしい
      car: なぜなら
      nouveau: 新しい
      travail: 仕事
      nouvel: 新しい
      appartement: アパート
      pense: 思う
      aller: うまくいく
  fr.a1.unit49.lesson06.teach.camille_salut_mathieu:
    title: カミーユがマチューの気持ちをたずねる
    gloss: カミーユ:やあ、マチュー。初めてのシフトを前に、気分はどう?
    note: '*Avant ton premier service*(初めてのシフトの前)は、第3課の *avant* +名詞の型をもう一度使っています。'
  fr.a1.unit49.lesson06.teach.mathieu_je_suis:
    title: マチューが緊張していると打ち明ける
    gloss: マチュー:正直、ちょっと緊張してるよ。
    note: '*Honnêtement*(正直に)は、打ち明けるときの言い方をやわらげます。'
  fr.a1.unit49.lesson06.teach.camille_ne_t:
    title: カミーユが彼を安心させる
    gloss: カミーユ:心配しないで、きっとうまくできるよ!
    note: '*Tu vas y arriver*(直訳は「あなたはそこに着くだろう」)は、励ますときの決まった表現です。*aller* +不定詞で近い未来を表します。'
  fr.a1.unit49.lesson06.teach.mathieu_merci_ca:
    title: マチューがお礼を言う
    gloss: マチュー:ありがとう、本当に助かるよ。
    note: '*Aide* は *aider*(助ける)の *il/elle* の形で、*m''* は *me* の代わりです。'
  fr.a1.unit49.lesson06.teach.camille_et_apres:
    title: カミーユが結果を予想する
    gloss: カミーユ:それに、あとできっととてもうれしくて誇らしい気持ちになるよ。
    note: '*Sûrement*(きっと)は自信のある予想を表します。*fier*(誇らしい)は新しくて役に立つ形容詞です。'
  fr.a1.unit49.lesson06.teach.mathieu_oui_je:
    title: マチューが同意する
    gloss: マチュー:うん、僕もそう思う。
    note: '*Je pense aussi* は、相手の意見に賛成するときの自然な言い方です。'
  fr.a1.unit49.lesson06.teach.il_remplace_mathieu:
    title: il、elle、l' で要約する
    gloss: マチューは初めてのシフトに緊張しています。カミーユは彼を助けます。
    note: '*Il* は男性の名前の代わり(*il est nerveux*)、*elle* は女性の名前の代わりになり、*l''*(*elle l''aide*)は「彼を」の意味です。ほかの人について話すときに欠かせない、小さな3つの言葉です。'
