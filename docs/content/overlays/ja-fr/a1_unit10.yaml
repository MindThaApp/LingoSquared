  fr.a1.unit10.lesson03.dialogue_routine_samedi:
    title: マチューの土曜日の過ごし方
teaching:
  fr.a1.unit10.lesson01.teach.se_reveiller:
    title: 目を覚ます
    gloss: 目を覚ます
    note: 代名動詞です：*je me réveille*、*tu te réveilles*。*me/te/se* は必ず主語に合わせて変わります。
    example_gloss: 7時に目を覚まします。
  fr.a1.unit10.lesson01.teach.se_lever:
    title: 起きる
    gloss: 起きる
    note: '*se réveiller*(目が覚める)とは違い、*se lever* は体を起こして寝床から出ることです。'
    example_gloss: そのあとすぐに起きます。
  fr.a1.unit10.lesson01.teach.prendre_une_douche:
    title: シャワーを浴びる
    gloss: シャワーを浴びる
    note: '*Prendre une douche*(直訳は「シャワーを取る」)は、食事や乗り物にも使う動詞 *prendre* を使います。'
    example_gloss: 朝、シャワーを浴びます。
  fr.a1.unit10.lesson01.teach.shabiller:
    title: 服を着る
    gloss: 服を着る
    note: これも代名動詞です：*je m'habille*。母音の前なので me が *m'* になります。
    example_gloss: 朝食の前に服を着ます。
  fr.a1.unit10.lesson01.teach.le_petit_dejeuner:
    title: 朝食
    gloss: 朝食
    note: '*Prendre le petit-déjeuner*(朝食をとる)も、*prendre une douche* と同じ *prendre* の使い方です。'
    example_gloss: 8時に朝食をとります。
  fr.a1.unit10.lesson01.teach.quitter_la_maison:
    title: 家を出る
    gloss: 家を出る
    note: ここでの *quitter* は「(場所を)離れる」という意味です。直接目的語をとらない *partir* と混同しないようにしましょう。
    example_gloss: 9時に家を出ます。
  fr.a1.unit10.lesson01.teach.dabord_ensuite:
    title: まず…それから…
    gloss: まず起きて、それから服を着ます。
    note: '*D''abord*(まず)と *ensuite*(それから)は、1日の流れを順番に説明するときの基本の言葉です。'
  fr.a1.unit10.lesson02.teach.rentrer:
    title: 家に帰る
    gloss: 家に帰る
    note: '*Rentrer* は自分の家に戻ることを表します。ある場所に戻る一般的な意味の *retourner* とは区別されます。'
    example_gloss: 仕事のあと、家に帰ります。
  fr.a1.unit10.lesson02.teach.diner:
    title: 夕食をとる
    gloss: 夕食をとる
    note: '*Dîner* は動詞(夕食をとる)にも名詞(*le dîner*、夕食)にもなります。どちらかは文脈で判断します。'
    example_gloss: 土曜の夜は、みんなで一緒に夕食をとります。
  fr.a1.unit10.lesson02.teach.se_coucher:
    title: 寝る
    gloss: 寝る
    note: 1日の流れの自然な締めくくりで、最初の *se lever* と対になります。
    example_gloss: 23時ごろに寝ます。
  fr.a1.unit10.lesson02.teach.le_weekend:
    title: 週末
    gloss: 週末
    note: '*Le week-end* は、英語から取り入れられてよく使われる言葉で、ハイフンを入れて書きます。'
    example_gloss: 教室は週末に開かれます。
  fr.a1.unit10.lesson02.teach.dhabitude:
    title: いつもは
    gloss: いつもは
    note: '*D''habitude* は習慣的な行動を表します。一度きりの出来事を表す *aujourd''hui*(今日)とは区別します。'
    example_gloss: いつもは7時に起きます。
  fr.a1.unit10.lesson02.teach.ma_routine_du_samedi:
    title: 土曜日のことを話す
    gloss: 土曜日は遅く起きて、それから教室の前に市場へ行きます。
    note: '*d''abord/ensuite* のような順序の表現を、ここでは *puis*(「それから」)と組み合わせて、土曜日の過ごし方を説明します。'
  fr.a1.unit10.lesson02.teach.quest_ce_que_tu_fais:
    title: 何をしていますか？
    gloss: 土曜日は何をしているの？
    note: '*Qu''est-ce que tu fais... ?* は、相手が何をしているかをたずねるときの、ふつうのくだけた言い方です。'
  fr.a1.unit10.lesson03.teach.line01:
    title: 土曜日についてたずねる
    gloss: イネスはマチューに、ワークショップの前の土曜日に何をしているかをたずねます。
    note: '*Tu fais quoi... ?* は「何をしているの？」という意味の自然なくだけた言い方で、*Qu''est-ce que tu fais ?* よりもカジュアルです。'
  fr.a1.unit10.lesson03.teach.line02:
    title: 起きる様子を話す
    gloss: マチューは、まず遅めの9時ごろに起きると言います。
    note: '*Vers neuf heures*(9時ごろ)は、おおよその時刻を表す *vers* + 時刻の形をもう一度使っています。'
  fr.a1.unit10.lesson03.teach.line03:
    title: その次をたずねる
    gloss: イネスは、そのあと何をするのかをたずねます。
    note: 一日の流れの話を続けるための、短くて自然な聞き返しです。
  fr.a1.unit10.lesson03.teach.line04:
    title: 朝食と市場のことを話す
    gloss: マチューは、そのあと朝食をとって市場に行くと言います。
    note: '*d''abord* で始まった流れを受けて、2つの動作を *et* でつないでいます。'
  fr.a1.unit10.lesson03.teach.line05:
    title: 帰宅の時刻をたずねる
    gloss: イネスは、マチューが何時に帰るのかをたずねます。
    note: '*Tu rentres à quelle heure ?* は、この単元で学んだ *rentrer* を直接の質問で使っています。'
  fr.a1.unit10.lesson03.teach.line06:
    title: 午後の過ごし方を話す
    gloss: マチューは、正午ごろに帰宅し、午後は夜のワークショップの前に休むと言います。
    note: '*Se reposer*(休む)も再帰動詞で、*je me repose* の形になります。'
