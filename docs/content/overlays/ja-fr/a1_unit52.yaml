  fr.a1.unit52.lesson06.planifier_un_week_end:
    title: 一緒に週末の予定を立てる
teaching:
  fr.a1.unit52.lesson01.teach.lire_faire_du:
    title: 読書、運動、料理
    gloss: 読む、運動する／スポーツをする、料理する
    note: よく使う趣味の動詞が三つあります。*lire*(読む)、*faire du sport*(運動する、スポーツをする)、*cuisiner*(料理する)です。
    example_gloss:
    - 私は本を読むのが好きです。
    - 私は土曜日に運動します。
    - 私は友達のために料理するのが好きです。
  fr.a1.unit52.lesson01.teach.le_temps_libre:
    title: 自由時間
    gloss: 自由時間
    note: '*Temps libre* は男性名詞で、*le temps libre* と言います。趣味を話すときの大切な表現です。'
    example_gloss: 私は自由時間に読書をするのが好きです。
  fr.a1.unit52.lesson01.teach.pendant_mon_temps:
    title: 自由時間にすることを伝える
    gloss: 私は自由時間に読書をするのが好きです。
    note: '*Lis* は *lire*(読む)の *je* の形です。最後の *s* は発音しません。'
  fr.a1.unit52.lesson02.teach.ecouter_de_la:
    title: 音楽、絵、ゲーム
    gloss: 音楽を聴く、絵を描く、ゲームをする
    note: 趣味をさらに三つ:*écouter de la musique*、*dessiner*、*jouer aux jeux vidéo* です。ゲームの場合は、*jouer à* + *les* が *jouer aux* になります。
    example_gloss:
    - 私は音楽を聴くのが好きです。
    - 私はよく絵を描きます。
    - 私は友達とゲームをするのが好きです。
  fr.a1.unit52.lesson02.teach.j_aime_ecouter:
    title: 音楽を聴くのが好きだと伝える
    gloss: 私は音楽を聴くのが好きです。
    note: '*Écouter* は間に別の語を挟まず、目的語をそのまま続けます:*écouter de la musique*。'
  fr.a1.unit52.lesson02.teach.j_aime_jouer:
    title: 友達とゲームをするのが好きだと伝える
    gloss: 私は友達とゲームをするのが好きです。
    note: '*Avec des amis*(友だちと)の *amis* は第1課で出てきました。*des* は複数の「いくつかの」にあたる語です。'
  fr.a1.unit52.lesson03.teach.toujours_souvent_parfois:
    title: いつも、よく、ときどき、決して～ない
    gloss: いつも、よく、ときどき、決して～ない
    note: 基本の頻度の副詞が四つあります。*Souvent* はすでに知っているかもしれませんが、*toujours*、*parfois*、*jamais* は新しい語です。*Jamais* は動詞の前に *ne* が必要です。
    example_gloss:
    - 私は毎週土曜日に運動します。
    - 私はよく本を読みます。
    - 私はときどき絵を描きます。
    - 私はゲームをまったくしません。
  fr.a1.unit52.lesson03.teach.chaque_semaine_chaque:
    title: 毎週、毎週末
    gloss: 毎週、毎週末
    note: '*Chaque semaine* と *chaque week-end* はどちらも「毎~」の意味です。*Chaque* は名詞の性が変わっても形が変わりません。'
    example_gloss:
    - 私は毎週、友達のために料理をします。
    - 私は毎週末、運動します。
  fr.a1.unit52.lesson03.teach.chaque_ne_change:
    title: Chaque は形が変わらない
    gloss: '*Chaque* は男性名詞の前でも女性名詞の前でも同じ形です:*chaque semaine*、*chaque week-end*。'
    note: '*Semaine* は女性名詞、*week-end* は男性名詞ですが、*chaque* はどちらも同じ形です。形が変わる *tous les* / *toutes les* と比べてみましょう。'
  fr.a1.unit52.lesson03.teach.qu_est_ce:
    title: 余暇の過ごし方を尋ねる
    gloss: 自由時間には何をしますか？
    note: これはこのユニットの中心となる質問です。相手の趣味を尋ねるときに使ってみましょう。
  fr.a1.unit52.lesson04.teach.camille_on_se:
    title: カミーユが趣味の話を切り出す
    gloss: カミーユ:私たちはよく一緒に散歩するよね。でも、マチューは自由な時間にほかに何をしているの?
    note: '*On se promène souvent* では、「私たち」の意味で *on* を使い、*souvent* は動詞のすぐ後ろに置きます。'
  fr.a1.unit52.lesson04.teach.mathieu_j_aime:
    title: マチューの趣味
    gloss: マチュー:料理が好きなんだ、家でもね。それに、よく運動もするよ。
    note: '*Même à la maison*(家でも)を加えると、マチューが仕事だけでなく楽しみとして料理していることがはっきりします。'
  fr.a1.unit52.lesson04.teach.camille_tu_cuisines:
    title: カミーユが驚く
    gloss: カミーユ:家でも料理するの?仕事で一日中もう料理しているのに!
    note: '*Toute la journée*(一日中)は、マチューが職場ですでにたくさん料理していることを強調しています。'
  fr.a1.unit52.lesson04.teach.mathieu_oui_mais:
    title: マチューが説明する
    gloss: マチュー:うん、でも料理はリラックスできると思うんだ。君は何をするのが好き?
    note: '*Cuisiner, je trouve ça relaxant* は強調のために *cuisiner* を先頭に出しています。直訳すると「料理は、それをリラックスできると思う」です。'
  fr.a1.unit52.lesson04.teach.camille_j_aime:
    title: カミーユの趣味
    gloss: カミーユ:読書が好きで、よく音楽も聴くよ。
    note: 第1課と第2課の二つの趣味を、*et*(そして)で一つの文にまとめています。
  fr.a1.unit52.lesson04.teach.mathieu_tu_joues:
    title: マチューがゲームについて尋ねる
    gloss: マチュー:ゲームもするの?
    note: 短い「はい・いいえ」の質問です:*Tu joues aussi aux jeux vidéo ?* 語尾を上げて発音すると疑問文になります。
  fr.a1.unit52.lesson04.teach.camille_non_je:
    title: カミーユが答える
    gloss: カミーユ:ううん、ゲームは全然しないよ。でも、ときどき絵を描くの!
    note: 第3課の *jamais*(決して~ない)と *parfois*(ときどき)を、一つの答えの中で対比させています。
  fr.a1.unit52.lesson05.teach.mathieu_et_moi:
    title: 趣味を比べる
    gloss: マチューと私は、よく一緒に散歩します。でも、ほかにも趣味があります。マチューは料理が好きで、家でも料理をし、よく運動もします。私は読書が好きで、よく音楽も聴きます。ときどき絵を描きますが、ゲームは全然しません。あなたは自由な時間に何をするのが好きですか。
    note: カミーユのメッセージは、これまでの課の内容をまとめ、この単元の中心となる質問を読み手に投げかけて終わります。
    glosses:
      promène: 散歩する
      souvent: よく
      ensemble: 一緒に
      d'autres: ほかの
      cuisiner: 料理する
      aime: ～するのが好き
      maison: 家で
      sport: 運動する
      lire: 読む
      j'écoute: 聴く
      musique: 音楽
      dessine: 絵を描く
      parfois: 時々
      jeux: ビデオゲームをする
      jamais: 決して〜ない
      libre: 自由な
      temps: 時間
  fr.a1.unit52.lesson06.teach.mathieu_qu_est:
    title: マチューが週末の予定を尋ねる
    gloss: マチュー:この週末は何をするの?
    note: '*Ce week-end*(この週末)では、*week-end* が男性名詞なので *ce* を使います。'
  fr.a1.unit52.lesson06.teach.camille_je_ne:
    title: カミーユはまだ決めていない
    gloss: カミーユ:まだわからないな。読書は好きだけど、出かけたい気持ちもあるんだ。
    note: '*Sortir*(出かける)は、家から出たいときによく使う言い方です。'
  fr.a1.unit52.lesson06.teach.mathieu_on_se:
    title: マチューが予定を提案する
    gloss: マチュー:一緒に散歩しない?そのあと、僕が二人のために料理するよ。
    note: '*Après*(そのあと)は、*d''abord*(まず)や *ensuite*(それから)のように、二つの予定を順に並べます。'
  fr.a1.unit52.lesson06.teach.camille_bonne_idee:
    title: カミーユが賛成する
    gloss: カミーユ:いいね!散歩も料理も同じくらい好きだよ。
    note: '*Autant ... que*(~と同じくらい…)は、カミーユが二つのことを同じくらい好きで、どちらかを優先していないことを表します。'
  fr.a1.unit52.lesson06.teach.mathieu_parfait_alors:
    title: マチューが確認する
    gloss: マチュー:完璧。じゃあ、土曜日に会おう!
    note: '*samedi*(土曜日)の予定を確認する、親しみのある締めくくりのせりふです。'
