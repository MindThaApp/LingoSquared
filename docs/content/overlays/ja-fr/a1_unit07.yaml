course:
  title: フランス語 A1
  description: 町の身近な場所と、簡単な道案内のたずね方・答え方(en face de、à côté de、près de、loin de)を学びます。マチューが作業場の近くの薬局を探す話の続きです。これらの位置を表す表現はすべて de で終わり、男性名詞や複数名詞の前では du/des に変わります(du café、des arbres)。
