teaching:
  fr.a1.unit07.lesson01.teach.gare:
    title: 駅
    gloss: 駅
    note: '*Gare* は女性名詞です。'
    example_gloss: 駅は大きいです。
  fr.a1.unit07.lesson01.teach.pharmacie:
    title: 薬局
    gloss: 薬局
    note: '*Pharmacie* は女性名詞です。'
    example_gloss: 薬局は9時に開きます。
  fr.a1.unit07.lesson01.teach.banque:
    title: 銀行
    gloss: 銀行
    note: '*Banque* は女性名詞です。'
    example_gloss: 銀行は日曜日は休みです。
  fr.a1.unit07.lesson01.teach.ecole:
    title: 学校
    gloss: 学校
    note: '*École* は女性名詞です。母音の前なので *l''* になります(エリジオン)。'
    example_gloss: 学校は公園の隣にあります。
  fr.a1.unit07.lesson01.teach.cafe:
    title: カフェ
    gloss: カフェ
    note: '*Café* は男性名詞です。文脈によっては「コーヒー」の意味にもなります。'
    example_gloss: そのカフェは一日中開いています。
  fr.a1.unit07.lesson01.teach.poste:
    title: 郵便局
    gloss: その郵便局
    note: ここでは *poste*(女性名詞)は「郵便局」の意味です。*le poste*(男性名詞)は「職、ポスト」などの別の意味になり、性が変わると意味も変わります。
    example_gloss: 郵便局は6時に閉まります。
  fr.a1.unit07.lesson01.teach.la_gare_est_grande:
    title: 2つの場所を比べる
    gloss: 駅は大きく、薬局は小さいです。
    note: '*Grande* と *petite* は、ここではどちらも女性名詞(*la gare*、*la pharmacie*)に合わせた形です。'
  fr.a1.unit07.lesson02.teach.ou_est_la_gare:
    title: 場所をたずねる
    gloss: すみません、駅はどこですか。
    note: '*Où est... ?* は、場所をたずねるときの基本的で万能な言い方です。'
  fr.a1.unit07.lesson02.teach.en_face_de:
    title: 「〜の向かい側」と言う
    gloss: 銀行は駅の向かい側にあります。
    note: '*En face de*(〜の向かい側)は *de* で終わり、そのあとに基準になる場所が続きます：*en face de la banque*。男性名詞の前では de と le が合わさります：*en face du café*。'
  fr.a1.unit07.lesson02.teach.a_cote_de:
    title: 「〜の隣」と言う
    gloss: 薬局は銀行の隣にあります。
    note: '*À côté de*(〜の隣)も、*en face de* と同じく *de* でつなぎます。'
  fr.a1.unit07.lesson02.teach.pres_de:
    title: 「〜の近く」と言う
    gloss: 学校はこの近くです。
    note: '*Près de*(〜の近く)は、母音の前では *près d''* になります。例：*près d''ici*(この近く)。'
  fr.a1.unit07.lesson02.teach.loin_de:
    title: 「遠い」と言う
    gloss: 郵便局はここから遠いです。
    note: '*Loin de*(〜から遠い)は *près de* の反対の意味です。'
  fr.a1.unit07.lesson02.teach.cest_loin:
    title: 遠いかどうかをたずねる
    gloss: ここから遠いですか。— いいえ、遠くありません。
    note: '*C''est loin d''ici ?* は、行き方を聞いたあとに続けてたずねる自然な質問です。「いいえ」と答えるときは、動詞を *ne... pas* ではさみます：*ce n''est pas loin*(遠くありません)。'
  fr.a1.unit07.lesson03.teach.line01:
    title: 知らない人に道をたずねる
    gloss: マチューは通りがかりの人に、薬局がどこか丁寧にたずねます。
    note: '*Excusez-moi*(すみません)は、知らない人に声をかけるときの標準的で丁寧な言い方で、*vous* と合わせて使います。'
  fr.a1.unit07.lesson03.teach.line02:
    title: 場所を教える
    gloss: その人は、銀行の向かい側で、カフェの隣だと言います。
    note: '*en face de* と *à côté de* を1つの文で使い、正確な場所を伝えています。*De* + *le café* は合わさって *du café* になります。'
  fr.a1.unit07.lesson03.teach.line03:
    title: 遠いかどうかをたずねる
    gloss: マチューは、ここから遠いかたずねます。
    note: 距離をたずねるときに学んだ、あの *C'est loin d'ici ?* です。
  fr.a1.unit07.lesson03.teach.line04:
    title: 近いと安心させる
    gloss: その人は、いいえ、すぐ近くで、歩いて5分だと言います。
    note: '*À pied*(徒歩で)は、移動手段が歩きであることを表す標準的な言い方です。'
  fr.a1.unit07.lesson03.teach.line05:
    title: お礼を言う
    gloss: マチューは心を込めてお礼を言います。
    note: '*Merci beaucoup* は、これまでの課で学んだ基本の *merci* を強めた言い方です。'
  fr.a1.unit07.lesson03.teach.line06:
    title: お礼に答える
    gloss: 彼女は「どういたしまして」と答えます。
    note: '*Je vous en prie* は丁寧な「どういたしまして」で、初対面の人に使う *vous* の丁寧さに合います。*De rien* はもう少しくだけた、日常的な言い方です。'
