teaching:
  fr.a1.unit44.lesson01.teach.je_ne_me:
    title: 体調が悪い
    gloss: 気分がよくありません。
    note: '*Se sentir* は再帰動詞です(*je me sens*)。*ne ... pas bien* は、どこか調子が悪いことを言う一般的で穏やかな表現です。'
  fr.a1.unit44.lesson01.teach.malade:
    title: 病気
    gloss: 病気
    note: 基本の形容詞で、*être* と一緒に使います:*je suis malade*。
    example_gloss: 私は病気です。
  fr.a1.unit44.lesson01.teach.je_suis_malade:
    title: 病気であること
    gloss: 私は病気です。
    note: '*Malade* は *pas bien* よりも、全般的で強い状態を表します。'
  fr.a1.unit44.lesson01.teach.mal_a_la:
    title: 頭痛
    gloss: 頭痛
    note: '*Mal à la tête* は *avoir* と一緒に使います:*j''ai mal à la tête*。*tête* は女性名詞なので *à la* になります。'
    example_gloss: 頭が痛いです。
  fr.a1.unit44.lesson01.teach.j_ai_mal:
    title: 頭が痛い
    gloss: 頭が痛いです。
    note: 症状は *avoir*(持つ)と組み合わせます:*j'ai mal*。
  fr.a1.unit44.lesson01.teach.mal_au_ventre:
    title: 腹痛
    gloss: 腹痛
    note: '*Mal au ventre*:*ventre* は男性名詞なので、*à* と *le* がひとつになって *au* になります。'
    example_gloss: おなかが痛いです。
  fr.a1.unit44.lesson01.teach.j_ai_mal_2:
    title: おなかが痛い
    gloss: おなかが痛いです。
    note: '*mal à la tête* と同じ *avoir* の型ですが、*à la* の代わりに *au* を使います。'
  fr.a1.unit44.lesson02.teach.qu_est_ce:
    title: 一般的なたずね方
    gloss: どうしましたか。
    note: 何か問題があるのかをたずねる、どんな場面でも使える一般的な言い方です。
  fr.a1.unit44.lesson02.teach.qu_est_ce_2:
    title: よく使う慣用表現
    gloss: どうしたのですか。
    note: '*Qu''est-ce qui ne va pas ?* は決まった言い回しで、直訳すると「何がうまくいっていないのか」です。単語ごとに訳さないようにしましょう。'
  fr.a1.unit44.lesson02.teach.mal_a_la:
    title: 喉の痛み
    gloss: 喉の痛み
    note: '*Mal à la gorge* は *mal à la tête* と同じ型です。*gorge* は女性名詞なので *à la* になります。'
    example_gloss: 喉が痛いです。
  fr.a1.unit44.lesson02.teach.j_ai_mal:
    title: 喉が痛い
    gloss: 喉が痛いです。
    note: ほかの症状と同じ *avoir* の型です。
  fr.a1.unit44.lesson02.teach.ca_va_non:
    title: 相手の様子をたずねる
    gloss: 大丈夫ですか。いいえ、気分がよくありません。
    note: '*Ça va ?* は、友だち同士でよく使う気軽なあいさつ代わりの質問です。'
  fr.a1.unit44.lesson03.teach.la_fievre:
    title: 熱
    gloss: 熱
    note: '*La fièvre* は女性名詞です。*avoir* の後ろでは *de la* になります:*j''ai de la fièvre*。'
    example_gloss: 熱があります。
  fr.a1.unit44.lesson03.teach.j_ai_de:
    title: 熱がある
    gloss: 熱があります。
    note: '*avoir* の型で、部分冠詞の *de la* を使います。'
  fr.a1.unit44.lesson03.teach.le_rhume:
    title: 風邪をひいている
    gloss: 風邪をひいている
    note: '*Le rhume* は男性名詞で、*avoir* と一緒に使います。*être* と使う形容詞ではありません。'
    example_gloss: 風邪をひいています。
  fr.a1.unit44.lesson03.teach.j_ai_un:
    title: 風邪をひいていると伝える
    gloss: 風邪をひいています。
    note: フランス語では *j'ai un rhume*(直訳は「風邪を持っている」)と言います。*je suis rhume* とは言いません。
  fr.a1.unit44.lesson03.teach.malade_se_dit:
    title: Être か avoir か
    gloss: '*Malade* は形容詞なので *être* を使います:私は病気です。*Mal*、*fièvre*、*rhume* は名詞なので *avoir* を使います:風邪をひいています。'
    note: '*être* と *avoir* の使い分けは品詞で決まります。*malade* のような形容詞は *être*、*fièvre* のような名詞は *avoir* と使います。症状が軽くても同じです。'
  fr.a1.unit44.lesson04.teach.la_pharmacie:
    title: 薬局
    gloss: 薬局
    note: '*Pharmacie* は女性名詞です:*la pharmacie*。'
    example_gloss: 薬局に行きます。
  fr.a1.unit44.lesson04.teach.je_peux_vous:
    title: 薬剤師のあいさつ
    gloss: どうされましたか。
    note: '*Je peux vous aider ?* は、接客で使う標準的で丁寧なあいさつです。*vous* は丁寧な形です。'
  fr.a1.unit44.lesson04.teach.avez_vous_quelque:
    title: 症状に合うものをたずねる
    gloss: 頭痛に効くものはありますか?
    note: '*Quelque chose contre* の後ろに症状を続けると、対処する薬などを求める自然な言い方になります。'
  fr.a1.unit44.lesson04.teach.un_comprime:
    title: 錠剤
    gloss: 錠剤
    note: '*Comprimé* は男性名詞です:*un comprimé*。'
    example_gloss: 私は錠剤を1錠飲みます。
  fr.a1.unit44.lesson04.teach.prenez_un_comprime:
    title: 服用の指示
    gloss: 錠剤を1日2回、1錠飲んでください。
    note: '*Prenez* は *prendre*(取る、飲む)の *vous* に対する命令形で、指示に使われます。'
  fr.a1.unit44.lesson04.teach.a_la_pharmacie:
    title: 薬局での話し方
    gloss: 薬局では、丁寧な言い方の *vous* を使います。
    note: 薬剤師は面識のない、サービスを提供する立場の大人なので、切符売り場と同じように *vous* を使います。
  fr.a1.unit44.lesson05.teach.conseil_prends_un:
    title: 薬局のアドバイスを読む
    gloss: アドバイス:錠剤を1日2回、水と一緒に飲んでください。しっかり休んで、水をたくさん飲みましょう。3日たってもまだ具合が悪いですか?それなら医者に行ってください。
    note: 服用量、薬以外の2つのすすめ、そして医者に行くべきタイミングに注目しましょう。
    glosses:
      Conseil: アドバイス
      prends: 飲む
      fois: 回
      jour: 日
      comprimé: 錠剤
      Repose-toi: 休む
      bois: 飲む
      sens: 感じる
      toujours: まだ
      bien: 上手に
      médecin: 医者
  fr.a1.unit44.lesson06.teach.camille_salut_mathieu:
    title: カミーユが様子を聞く
    gloss: カミーユ:こんにちは、マチュー、調子はどう?もう少しよくなった?
    note: '*Déjà*(もう)は、前に話したときから、マチューがよくなったかどうかをカミーユが確かめていることを表します。'
  fr.a1.unit44.lesson06.teach.mathieu_pas_encore:
    title: マチューはまだ具合が悪い
    gloss: マチュー:まだあまりよくないよ。まだ頭が痛くて、疲れているんだ。
    note: '*Toujours*(まだ)は、頭痛がまだ治っていないことを表します。*fatigué*(疲れた)は新しい便利な形容詞です。'
  fr.a1.unit44.lesson06.teach.camille_tu_as:
    title: カミーユが薬のことを聞く
    gloss: カミーユ:錠剤は飲んだ?
    note: '*Pris* は *prendre* の過去分詞で、*avoir* の *as* と一緒に使います:*tu as pris*。'
  fr.a1.unit44.lesson06.teach.mathieu_oui_j:
    title: マチューが答える
    gloss: マチュー:うん、錠剤を飲んだよ。今から休むね。
    note: '*Je vais me reposer*(休むつもりです)は、*aller* + 不定詞で近い未来を表します。'
  fr.a1.unit44.lesson06.teach.camille_bonne_idee:
    title: カミーユが気づかう
    gloss: カミーユ:それがいいね。しっかり休んでね。お大事に!
    note: '*Bon rétablissement !* は、早い回復を願うときの決まった表現です。'
  fr.a1.unit44.lesson06.teach.mathieu_merci_a:
    title: マチューが別れを告げる
    gloss: マチュー:ありがとう、また明日!
    note: '*À demain !* は、別れのあいさつで *à* + 時を表す語を使います:*à demain*、*à bientôt*。'
