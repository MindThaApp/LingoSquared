answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: フランス語 A1
  description: 家族・親戚の語彙、所有形容詞 mon/ma/mes のしくみ、家族の紹介を学びます。ユニット01~02から続く、イネスとマチューの料理教室の物語の続きです。フランス語の所有形容詞は、持ち主ではなく、後ろの名詞の性と数に合わせて形が変わる点に注意しましょう。
units:
  fr.a1.unit03.family:
    title: イネスとマチューの家族
lessons:
  fr.a1.unit03.lesson01.immediate_family:
    title: 身近な家族
  fr.a1.unit03.lesson02.possessives_mon_ma_mes:
    title: 所有形容詞：mon, ma, mes
  fr.a1.unit03.lesson03.extended_family:
    title: 親戚
  fr.a1.unit03.lesson04.describing_family_size:
    title: 家に何人いる？
  fr.a1.unit03.lesson05.reading_a_family_profile:
    title: 家族のプロフィールを読む
  fr.a1.unit03.lesson06.family_photos_dialogue:
    title: イネスとマチューの家族写真
teaching:
  fr.a1.unit03.lesson01.teach.mere:
    title: 母
    gloss: 母
    note: '*Mère* は女性名詞です。家族の間では *maman* のほうがよく使われますが、*mère* は中立的な言い方で、このコースの語彙リストではこちらを使います。'
  fr.a1.unit03.lesson01.teach.pere:
    title: 父
    gloss: 父
    note: '*Père* は男性名詞です。日常では *papa* がよく使われ、*mère* と *maman* の関係と同じです。'
  fr.a1.unit03.lesson01.teach.frere:
    title: 兄・弟
    gloss: 兄弟
    note: '*Frère* は男性名詞の単数形です。'
  fr.a1.unit03.lesson01.teach.soeur:
    title: 姉・妹
    gloss: 姉妹
    note: '*Sœur* は女性名詞の単数形です。œ は2文字ではなく、フランス語のつづりでは1つの文字として扱われます。'
  fr.a1.unit03.lesson01.teach.fils:
    title: 息子
    gloss: 息子
    note: '*Fils* は男性名詞です。語末の s は通常は発音しませんが、この語では例外的に発音し、l は発音しません。'
  fr.a1.unit03.lesson01.teach.fille:
    title: 娘
    gloss: 娘
    note: '*Fille* は女性名詞の単数形です。同じ語で「女の子」の意味にもなります。'
  fr.a1.unit03.lesson01.teach.parents:
    title: Parents
    gloss: 両親
    note: '*Parents* は男性名詞の複数形で、父親と母親をまとめて指します。'
  fr.a1.unit03.lesson01.teach.freres_et_soeurs:
    title: 兄弟姉妹
    gloss: 兄弟姉妹
    note: フランス語には「兄弟姉妹」にあたる性別を問わない1語がなく、*frères et sœurs* と男女を両方はっきり言います。
  fr.a1.unit03.lesson02.teach.ma_mere:
    title: 私の母
    gloss: 私の母
    note: '*Ma* は女性単数名詞につく所有形容詞「私の」です。*mère* が女性名詞なので ma を使います。'
  fr.a1.unit03.lesson02.teach.mon_pere:
    title: 私の父
    gloss: 私の父
    note: '*Mon* は男性単数名詞につく所有形容詞「私の」です。*père* が男性名詞なので mon を使います。'
  fr.a1.unit03.lesson02.teach.mes_freres_et_soeurs:
    title: 私の兄弟姉妹
    gloss: 私の兄弟姉妹
    note: '*Mes* は複数名詞につく所有形容詞「私の」で、性別に関係なく使います。*mon*/*ma* が性で使い分けるのに対し、mes は数で決まります。'
  fr.a1.unit03.lesson02.teach.as_tu_des_freres_et_soeurs:
    title: 兄弟姉妹についてたずねる
    gloss: 兄弟姉妹はいますか？
    note: '*As-tu* は *tu as*(あなたは持っている)の倒置形で、A1でよく使う疑問文の形です。'
  fr.a1.unit03.lesson02.teach.jai_deux_soeurs:
    title: 兄弟姉妹の人数を言う
    gloss: 私には姉妹が2人います。
    note: '*J''ai*(私は持っている)に数と家族を表す名詞を続けるのが、兄弟姉妹について話すときの基本の言い方です。'
  fr.a1.unit03.lesson02.teach.ta_famille_est_grande:
    title: 家族が大きいかたずねる
    gloss: あなたの家族は大家族ですか？
    note: '*Ta* は女性単数名詞につく、くだけた言い方の所有形容詞「あなたの」です。女性名詞 *famille* に合わせています。'
  fr.a1.unit03.lesson02.teach.ma_famille_est_petite:
    title: 小さな家族について話す
    gloss: 私の家族は少人数です。
    note: '*Petite* は女性名詞 *famille* に合わせた形で、男性名詞なら *petit* になります。これは *mon*/*ma*/*mes* とは別の一致です。mon/ma/mes も名詞に合わせますが、所有を表し、petite は性質を表します。'
  fr.a1.unit03.lesson03.teach.grand_pere:
    title: 祖父
    gloss: 祖父
    note: '*Grand-père* はハイフンでつなぐ複合語で、男性名詞です。'
  fr.a1.unit03.lesson03.teach.grand_mere:
    title: 祖母
    gloss: 祖母
    note: '*Grand-mère* はハイフンでつなぐ複合語で、女性名詞です。*grande-mère* とはならず、*grand-* は変化しません。'
  fr.a1.unit03.lesson03.teach.grands_parents:
    title: 祖父母
    gloss: 祖父母
    note: '*Grands-parents* は複合語の両方の部分が複数形になります。*grands* となり、*grand-* にはなりません。単数形の *grand-mère* や *grand-père* では、*grand-* の部分は変化しません。'
  fr.a1.unit03.lesson03.teach.oncle:
    title: おじ
    gloss: おじ
    note: '*Oncle* は男性名詞です。'
  fr.a1.unit03.lesson03.teach.tante:
    title: おば
    gloss: おば
    note: '*Tante* は女性名詞です。'
  fr.a1.unit03.lesson03.teach.cousin:
    title: いとこ(男性)
    gloss: いとこ(男性)
    note: '*Cousin* は男性名詞の単数形です。日本語の「いとこ」は男女同形ですが、フランス語ではいとこの性別を語形で区別します。'
  fr.a1.unit03.lesson03.teach.cousine:
    title: いとこ(女性)
    gloss: いとこ(女性)
    note: '*Cousine* は女性名詞の単数形で、*cousin* に -e を付けて作ります。'
  fr.a1.unit03.lesson03.teach.mes_grands_parents:
    title: 私の祖父母
    gloss: 私の祖父母
    note: '*grands-parents* は複数形なので *mes* を使います。祖父と祖母の両方を含んでいても同じです。'
  fr.a1.unit03.lesson04.teach.combien_de_freres_et_soeurs:
    title: 兄弟姉妹の人数をたずねる
    gloss: 兄弟姉妹は何人いますか？
    note: '*Combien de*(いくつの)は名詞の直前に置きます。助動詞を使わず、combien de の後に名詞と動詞を倒置した形が続きます。'
  fr.a1.unit03.lesson04.teach.on_est_cinq:
    title: 家の人数を言う
    gloss: 家には6人います。
    note: '*On est*(直訳は「人は~である」)は、くだけた会話で「私たちは~」の意味で使われ、家族の人数を言うときの自然で一般的な言い方です。*nous sommes* はより改まった、書き言葉的な表現です。'
  fr.a1.unit03.lesson04.teach.ma_famille_est_grande:
    title: 大家族について話す
    gloss: 私の家族は大家族です。
    note: '*Grande* は女性名詞 *famille* に合わせた形で、男性名詞なら *grand* になります。'
  fr.a1.unit03.lesson04.teach.jai_beaucoup_de_cousins:
    title: いとこがたくさんいると言う
    gloss: 私にはいとこがたくさんいます。
    note: '*Beaucoup de*(たくさんの)は名詞の前に置きます。*beaucoup* がすでに量を表しているので、*de* は *du* や *des* にはなりません。'
  fr.a1.unit03.lesson04.teach.tu_habites_pres_de_tes_parents:
    title: 両親の近くに住んでいるかたずねる
    gloss: ご両親の近くに住んでいますか？
    note: '*Tes* は複数名詞につく、くだけた言い方の所有形容詞「あなたの」です。*parents* が複数なので tes になります。'
  fr.a1.unit03.lesson04.teach.jhabite_avec_mes_grands_parents:
    title: 一緒に住んでいる人を言う
    gloss: 祖父母と住んでいます。
    note: '*Avec*(〜と一緒に)は、一緒に住んでいる人を表します。*j''habite* は *habiter* の *je* の形で、ユニット1の *j''habite à Montreuil* でもう出てきました。'
  fr.a1.unit03.lesson05.teach.profile_reading:
    title: イネスの家族紹介
    gloss: 私の名前はイネスです。31歳で、パリで祖父母と住んでいます。母と父はリールに住んでいます。姉妹が2人と兄弟が1人いて、家には6人います。妹はカミーユといい、20歳です。
    note: この紹介文では、レッスン1〜4の語彙や表現が、単独の文ではなくひとつながりの短い文章の中で使われています。このユニットの読解テストで見る「だれが何をしているか」を読み取る力と同じです。
    glosses:
      trente: '30'
      ans: 歳
      grands-parents: 祖父母
      mère: 母
      père: 父
      habitent: 住んでいます
      deux: '2'
      sœurs: 姉妹
      frère: 兄弟
      six: '6'
      maison: 家
      petite: 年下の/小さい
      sœur: 姉妹
      vingt: '20'
  fr.a1.unit03.lesson05.teach.petite_soeur:
    title: 妹
    gloss: 妹
    note: '*Petite*(*petit* の女性形)はここでは名詞の前に置かれます。短くてよく使う形容詞の多くは名詞の前に置かれますが、それ以外の形容詞の多くは名詞の後ろに置かれます。'
  fr.a1.unit03.lesson05.teach.habite_third_person:
    title: 住んでいる(三人称)
    gloss: 住んでいる
    note: '*Habite* は *habiter* の三人称単数の形で、本人が自分のことを話す場合(*j''habite*、ユニット1やこのユニットのレッスン4に登場)ではなく、ほかの人のことを話す場合(*Inès habite...*)に使います。'
  fr.a1.unit03.lesson05.teach.ses_third_person_plural:
    title: 彼女の/彼の/彼らの(複数の名詞につく)
    gloss: 彼女の/彼の/彼らの
    note: '*Ses* は *sa*/*son* の複数形です。*sa*/*son* が単数の名詞につく「彼女の/彼の」を表すように、ses は複数の名詞につきます。たとえば三人称でイネスについて話すとき、*ses grands-parents* は「彼女の祖父母」という意味になります。'
  fr.a1.unit03.lesson05.teach.a_third_person_avoir:
    title: 持っている(三人称)
    gloss: 持っている
    note: '*A* は *avoir* の三人称単数の形で、本人が自分のことを話す場合(*j''ai* / *as-tu*、このユニットのレッスン2〜4で登場)ではなく、ほかの人のことを話す場合(*elle a vingt ans*)に使います。'
  fr.a1.unit03.lesson06.teach.line01:
    title: 家族の写真を見せる
    gloss: イネスがマチューに写真を見せて、両親と妹を紹介します。
    note: '*Voici*(ここに〜がいます/あります)は、指し示しているものを紹介するときの表現で、写真を見せるときにぴったりです。'
  fr.a1.unit03.lesson06.teach.line02:
    title: 感想を言って、きょうだいについて尋ねる
    gloss: マチューは温かく反応して、ほかにきょうだいがいるかどうか尋ねます。
    note: '*C''est adorable* は、幼いきょうだいの写真を見たときの、自然で温かい感想です。'
  fr.a1.unit03.lesson06.teach.line03:
    title: 家の人数を言って、同じ質問を返す
    gloss: イネスは、姉妹が2人と兄弟が1人いて、家には6人いると答え、そのあとマチューの家族について尋ねます。
    note: '*On est six à la maison* は、家にいる全員の人数を言う表現で、レッスン4の型の続きです。'
  fr.a1.unit03.lesson06.teach.line04:
    title: 小さめの家族を説明する
    gloss: マチューは、自分の家族はもっと小さく、両親と自分の3人だけだけれど、いとこはたくさんいると言います。
    note: '*Mais*(でも)は、小さな核家族と、たくさんいる親戚との対比を表します。'
  fr.a1.unit03.lesson06.teach.line05:
    title: 両親の近くに住んでいるか尋ねる
    gloss: イネスは、マチューが両親の近くに住んでいるかどうか尋ねます。
    note: '*Près de*(〜の近く)は、場所が近いことを表すよく使う言い方です。'
  fr.a1.unit03.lesson06.teach.line06:
    title: 距離と連絡の取り方を説明する
    gloss: マチューは、いいえ、両親はリヨンに住んでいて、毎週電話で話していると答えます。
    note: ユニット1で出てきた、マチューがリヨン出身だという設定の続きです。両親はそこに残っていて、本人はサン=トゥアンに住んでいます。
  fr.a1.unit03.lesson06.teach.line07:
    title: 共感して、自分の状況を話す
    gloss: イネスは、わかると言って、自分はここパリで祖父母と住んでいると話します。
    note: '*Je comprends*(わかります)は、相手の話を受け止めてから、自分の関連する話を続けるときの、短くて自然な言い方です。'
  fr.a1.unit03.lesson06.teach.line08:
    title: 温かい一言で締めくくる
    gloss: マチューは、家族が近くにいるのはいいことだと言います。
    note: '*C''est bien d''avoir sa famille près de soi* は、しみじみとした温かい一言で会話を締めくくります。レッスン4の *près de* の型にもつながっています。'
exercises:
