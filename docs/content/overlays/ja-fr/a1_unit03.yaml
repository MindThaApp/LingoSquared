    feedback: '*Frères et sœurs* は、男女の両方をはっきり並べて言う表現です。フランス語には、男女のきょうだいをまとめて指す一語はありません。'
  fr.a1.unit03.lesson01.exercise08.speak_own_siblings:
    instruction: 質問に答えてください。兄弟か姉妹がいると言いましょう。
    accepted_answers:
