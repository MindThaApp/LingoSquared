teaching:
  fr.a1.unit47.lesson01.teach.le_temps:
    title: 天気
    gloss: 天気
    note: '*Le temps* は「天気」と「時間」の両方の意味があり、男性名詞です。'
    example_gloss: どんな天気？
  fr.a1.unit47.lesson01.teach.quel_temps_fait:
    title: 天気をたずねる
    gloss: どんな天気？
    note: '*Quel temps fait-il ?* は天気をたずねる基本の表現です。*quel* は男性名詞 *temps* に合わせた形です。'
  fr.a1.unit47.lesson01.teach.le_temps_est:
    title: 晴れ
    gloss: 晴れています。
    note: '*Le temps est* + 形容詞は基本の型です。形容詞は男性名詞 *temps* に合わせた形になります。'
  fr.a1.unit47.lesson01.teach.il_pleut:
    title: 雨
    gloss: 雨が降っています。
    note: '*Pleuvoir*(雨が降る)は非人称で使います。*il pleut* のように、形容詞は必要ありません。'
  fr.a1.unit47.lesson01.teach.le_temps_est_2:
    title: 曇り
    gloss: 曇っています。
    note: '*ensoleillé* と同じ、*le temps est* + 形容詞の型です。'
  fr.a1.unit47.lesson02.teach.il_fait_froid:
    title: 寒い
    gloss: 今日は寒いです。
    note: '*Aujourd''hui*(今日)で天気がいつのことかを示します。*il fait froid* は *être* ではなく *faire* を使います。'
  fr.a1.unit47.lesson02.teach.il_fait_chaud:
    title: 暖かい
    gloss: 今日は暖かいです。
    note: '*Il fait chaud* は、日常の天気の話では「暖かい」も「暑い」も表します。'
  fr.a1.unit47.lesson02.teach.il_ne_fait:
    title: 気温を対比する
    gloss: 寒くはありません。暖かいです。
    note: '*Ne ... pas* は動詞をはさみます：*il ne fait pas froid*。'
  fr.a1.unit47.lesson03.teach.la_meteo:
    title: 天気予報
    gloss: 天気予報
    note: '*La météo* は女性名詞で、*la météorologie* を短くした言い方です。'
    example_gloss: 天気予報はどうですか？
  fr.a1.unit47.lesson03.teach.demain_le_temps:
    title: 明日の天気
    gloss: 明日は晴れです。
    note: '*Demain* を文頭に置き、コンマを続けます。あとはふつうの語順です。'
  fr.a1.unit47.lesson03.teach.samedi_le_temps:
    title: 二日間の天気予報
    gloss: 土曜日は晴れて暖かいですが、日曜日は一日中雨です。
    note: '*Toute la journée*(一日中)は、雨が長く続くことを強調します。'
  fr.a1.unit47.lesson04.teach.la_promenade:
    title: 散歩
    gloss: その散歩
    note: '*Promenade* は女性名詞です：*la promenade*。'
    example_gloss: 散歩に行きませんか？
  fr.a1.unit47.lesson04.teach.on_fait_une:
    title: 散歩に誘う
    gloss: 散歩に行きませんか？
    note: '*On fait une promenade ?* は親しみやすい誘い方です。*faire une promenade* は「散歩に行く」という決まった言い方です。'
  fr.a1.unit47.lesson04.teach.s_il_pleut:
    title: 条件のある予定
    gloss: 雨が降ったら、家の中にいます。
    note: '*S''il pleut*(雨が降るなら):*si* + *il* は *s''il* になります。そのあと *on reste à l''intérieur* でどうするかを言います。'
  fr.a1.unit47.lesson04.teach.bonne_idee_faisons:
    title: 賛成して提案する
    gloss: いい考えですね！散歩に行きましょう。
    note: '*Faisons ...*(~しましょう)は、*On ... ?* のほかに、活動を提案するよく使う言い方です。'
  fr.a1.unit47.lesson05.teach.meteo_samedi_le:
    title: 二日間の天気予報を読む
    gloss: 天気予報：土曜日は晴れて暖かいです。日曜日は一日中雨です。
    note: どの日がどんな天気か、整理しながら読みましょう。
    glosses:
      Météo: 天気予報
      samedi: 土曜日
      ensoleillé: 晴れ
      chaud: 暖かい
      Dimanche: 日曜日
      pleut: 雨が降る
      toute: 全部の
      journée: 日
  fr.a1.unit47.lesson06.teach.camille_quel_temps:
    title: カミーユが週末の天気をたずねる
    gloss: カミーユ：今週末はどんな天気？
    note: '*Ce week-end*(今週末)は、近い未来についての質問であることを示します。'
  fr.a1.unit47.lesson06.teach.mathieu_samedi_le:
    title: マチューが天気予報を伝える
    gloss: マチュー：土曜日は晴れて暖かいけど、日曜日は一日中雨だよ。
    note: 先に読んだ天気予報と同じ内容です。
  fr.a1.unit47.lesson06.teach.camille_alors_on:
    title: カミーユが提案する
    gloss: カミーユ：じゃあ、土曜日に散歩に行かない？
    note: '*Alors*(それなら)は、マチューが言った晴れの予報に提案を結びつけています。'
  fr.a1.unit47.lesson06.teach.mathieu_bonne_idee:
    title: マチューが賛成して日曜日の予定を立てる
    gloss: マチュー：いい考えだね。それで日曜日は、家の中でのんびり過ごそう。
    note: '*Tranquillement* は、ここでは「急がずゆったりと」という意味で、家で過ごすことを楽しそうに聞かせます。'
  fr.a1.unit47.lesson06.teach.camille_parfait_alors:
    title: カミーユが予定をまとめる
    gloss: カミーユ：完璧。じゃあ映画を見よう。
    note: '*Regarder*(見る)は *un film*(映画)とよく結びつきます。'
