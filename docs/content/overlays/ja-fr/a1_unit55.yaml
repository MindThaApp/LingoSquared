    title: Courir は不規則動詞
    gloss: '*Courir*(走る)は不規則動詞です：*je cours, tu cours, il court*。語末の *s* と *t* は発音しません。'
    note: '*Courir* は規則的な *-er* 動詞の型に従わないので、活用形を丸ごと覚えておくとよいでしょう：*je cours*、*tu cours*、*il court*。'
