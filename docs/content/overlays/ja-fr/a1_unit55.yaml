  fr.a1.unit55.lesson03.teach.tu_connais_deja:
    title: Faire du sport と faire de la + スポーツ名
    gloss: 趣味のレッスンで *faire du sport*(*Je fais du sport le samedi*)をすでに学びました。*Faire de la* + スポーツ名は、具体的なスポーツを言うときに使います：*Je fais de la natation*。どちらも正しいフランス語です。
    note: '*Faire du sport* は趣味のユニットで学んだ表現で、新しい表現ではありません。ここでは、具体的なスポーツ名を言う言い方と対比します。運動について話すとき、一般的な言い方と具体的な言い方があります。'
