    title: カミーユとレアのスポーツの話
    gloss: カミーユは週に2回ヨガをしています。ゆっくり体を動かすのが大好きです。レアはヨガはしませんが、泳ぐのが大好きです。レアはよく、ほぼ毎週泳ぎます。あなたはどんなスポーツをしていますか？
    note: 2つの異なるスポーツと2つの異なる頻度の表現を対比していて、前のユニットの動物を比べる読解文と対応しています。
