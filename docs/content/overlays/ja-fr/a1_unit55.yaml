    title: 私はサッカーをします
    gloss: 私はサッカーをします。
    note: サッカーをすると言うときは、*jouer au* + 球技の形を使うのが普通です。ほかのスポーツには *faire du* や *faire de la* を使います。文法メモを見てください。
  fr.a1.unit55.lesson01.teach.faire_du_de:
    title: Faire du / de la + sport
    gloss: '*Faire du*、*de la*、*de l''* + スポーツ名で、どのスポーツをしているかを表します：*faire du yoga*、*faire de la natation*、*faire de la course à pied*。サッカーの場合は *jouer au football* と言います。'
    note: この段階では、スポーツごとに別の動詞を覚える必要はありません。一つの構文で、どのスポーツも言い表せます。
  fr.a1.unit55.lesson02.teach.fois_par_semaine:
    title: 週に～回
    gloss: 週に～回
    example_gloss: 私は週に2回ヨガをします。
  fr.a1.unit55.lesson02.teach.tu_connais_deja:
    title: Fois par semaine と tous les jours / souvent
    gloss: '*tous les jours*(毎日)と *souvent*(よく)はもう知っていますね。*Deux fois par semaine*(週に2回)は、頻度をより具体的に言うための新しい言い方です。'
    note: 趣味の単元ですでに学んだ頻度の表現をさらに広げます。
  fr.a1.unit55.lesson02.teach.je_fais_du:
    title: 私は週に2回ヨガをします
    gloss: 私は週に2回ヨガをします。
