answer_policy:
  diacritics: 'Teach and display standard French accents and the cedilla. For free-typed A1 answers, accept otherwise-correct forms without diacritics, including ca for ça, tres for très, and enchante for enchanté. This leniency does not erase meaningful letters: masculine enchanté and feminine enchantée remain distinct through the final e even when accents are omitted.'
  apostrophes: Accept straight and typographic apostrophes interchangeably. Require the apostrophe when an exercise specifically tests elision, such as j’habite; do not accept jhabite in that exercise.
  hyphens: Teach the standard hyphens in inverted questions such as allez-vous and vas-tu. In free transcription exercises, accept an otherwise-correct spaced version at A1, but retain the hyphenated form as the model answer.
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of French spacing before question or exclamation marks. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
course:
  title: フランス語 A1
  description: 標準的なフランス本土のフランス語で、あいさつ、自己紹介、音読のパターン、初対面の雑談を学びます。tuとvousの使い分け、文法上の性、一致、動詞の活用形、エリジオン、リエゾンなど、日本語話者がつまずきやすい点を丁寧に解説します。
units:
  fr.a1.unit01.greetings:
    title: あいさつと初対面
lessons:
  fr.a1.unit01.lesson01.tu_vous_greetings:
    title: tuとvousであいさつする
  fr.a1.unit01.lesson02.names_introductions:
    title: 名前を言う・たずねる
  fr.a1.unit01.lesson03.reading_aloud:
    title: 初対面の会話を音読する
  fr.a1.unit01.lesson04.wellbeing:
    title: 体調をたずねる短いやりとり
  fr.a1.unit01.lesson05.first_meeting_small_talk:
    title: 近所で知り合う
  fr.a1.unit01.lesson06.workshop_dialogue:
    title: ワークショップでの初対面
teaching:
  fr.a1.unit01.lesson01.teach.bonjour:
    title: 基本のあいさつ
    gloss: こんにちは、おはようございます
    note: Bonjourは、初対面の人、同僚、友人など、昼の間なら誰に対しても使える無難なあいさつです。日本語の「こんにちは」「おはようございます」のように、時間帯に応じた「よい一日を」の意味合いもあります。
  fr.a1.unit01.lesson01.teach.salut:
    title: くだけたあいさつ
    gloss: やあ、じゃあね
    note: Salutは親しい間柄で使います。会話の始めにも終わりにも使えますが、初対面の大人に最初に使うのは避けたほうが無難です。
  fr.a1.unit01.lesson01.teach.au_revoir:
    title: 基本の別れのあいさつ
    gloss: さようなら
    note: Au revoirは、丁寧な場面でも親しい間柄でも使えます。
  fr.a1.unit01.lesson01.teach.tu:
    title: 親しい相手への「あなた」(単数)
    gloss: 君、あなた(親しい間柄・単数)
    note: 日本語では相手との関係に応じて「あなた」「君」「お前」などを使い分け、場合によっては省略もします。フランス語のtuは、友人や子ども、はっきり親しい間柄の一人に対して使い、それ専用の動詞の形を伴います。
  fr.a1.unit01.lesson01.teach.vous:
    title: 丁寧な「あなた」または複数の「あなたたち」
    gloss: あなた(丁寧・単数)、あなたたち(複数)
    note: Vousは、知らない大人一人に対して使う無難な形で、複数の相手に対する形でもあります。日本語の敬語のように、相手との距離感によってtuとvousを選びます。
  fr.a1.unit01.lesson01.teach.comment_allez_vous:
    title: 丁寧な体調のたずね方
    gloss: お元気ですか。
    note: Allezはallerのvousに対する形です。動詞と代名詞を倒置し、ハイフンでつなぎます。これは「どこへ行くか」をたずねているのではなく、決まった丁寧なあいさつの質問です。
  fr.a1.unit01.lesson01.teach.comment_vas_tu:
    title: くだけた体調のたずね方
    gloss: お元気ですか。
    note: Vasはallerのtuに対する形です。親しい間柄になると、allez-vousはvas-tuに変わります。日本語で敬語から普通の言い方に変わるのと似ています。
  fr.a1.unit01.lesson01.teach.register_choice:
    title: あいさつと関係を合わせる
    gloss: Bonjourはvousと、salutはtuと一緒に使う
    note: この組み合わせは目安であり、絶対的な決まりではありません。Bonjourは友人にも使えますが、salutにvousを合わせると、たいてい相反する印象を与えます。
  fr.a1.unit01.lesson02.teach.je_mappelle:
    title: 名前を言う
    gloss: 私の名前はカミーユです。
    note: Je m’appelleは直訳すると「私は自分を〜と呼ぶ」です。日本語は主語をよく省略しますが、フランス語では通常、主語のjeが必要です。meの母音はappelleの前で消え、m’appelleになります。
  fr.a1.unit01.lesson02.teach.comment_appelez_vous:
    title: 丁寧に名前をたずねる
    gloss: お名前は何ですか。
    note: Appelezはappelerのvousに対する形です。この疑問文は倒置を使うので、2つ目のvousが動詞の後ろに来て、vous appelez-vousとなります。
  fr.a1.unit01.lesson02.teach.tu_tappelles:
    title: くだけた名前のたずね方
    gloss: お名前は何ですか。
    note: T’appellesはtuに対する形で、再帰代名詞のteが母音の前で短くなっています。日常的なこの質問では、tuを動詞の前に置き、commentを最後に置きます。
  fr.a1.unit01.lesson02.teach.moi_cest:
    title: 会話での自己紹介
    gloss: ノエです。
    note: Moi, c’estは、話し言葉で自然な自己紹介の言い方です。「私は〜です」を一語ずつ置き換えるより、会話らしい表現になります。
  fr.a1.unit01.lesson02.teach.enchante:
    title: 男性形の一致
    gloss: はじめまして。
    note: 男性が話す場合、通常はenchantéと書きます。日本語の形容詞は話し手の性別で形が変わりませんが、このフランス語の形容詞は変わります。
  fr.a1.unit01.lesson02.teach.enchantee:
    title: 女性形の一致
    gloss: はじめまして。
    note: 女性が話す場合、通常は語末に e を加えてenchantéeと書きます。enchantéとenchantéeは普通同じ発音なので、違いは話し言葉より書き言葉ではっきりします。
  fr.a1.unit01.lesson02.teach.et_vous:
    title: 丁寧に聞き返す
    gloss: あなたは？
    note: 丁寧な話し方を保つときや、複数の相手に話すときはvousを使います。
  fr.a1.unit01.lesson02.teach.et_toi:
    title: くだけた聞き返し
    gloss: あなたは？
    note: Toiはtuに対応する強勢形です。etの後ろではtuではなくtoiを使います。
  fr.a1.unit01.lesson03.teach.elision_jhabite:
    title: 母音の前のエリジオン
    gloss: 私は住んでいます
    note: Jeはhabiteの前で母音を失い、アポストロフィがその省略を示してj’habiteとなります。habiterの h は発音されない h なので、エリジオンを妨げません。
  fr.a1.unit01.lesson03.teach.liaison_vous_etes:
    title: vousの後のリエゾン
    gloss: あなたは〜です、あなたたちは〜です
    note: vousの語末の s は普通は発音しませんが、êtesの母音の前では「ズ」の音でつながります。vous êtesはおよそ「ヴゼット」のように聞こえます。リエゾンは話し言葉で起こるもので、綴りには表れません。
  fr.a1.unit01.lesson03.teach.liaison_un_atelier:
    title: unの後のリエゾン
    gloss: ワークショップ、工房
    note: unの語末の n はatelierにつながります。2語の間でしっかり区切って間を置かないようにしましょう。
  fr.a1.unit01.lesson03.teach.final_e_enchante:
    title: 男性形の綴り
    gloss: はじめまして(男性の言い方)
    note: 男性が話す場合、enchantéは é で終わります。-an-は鼻母音なので、独立した n の音は発音しません。「ん」とはっきり言わないよう注意しましょう。
  fr.a1.unit01.lesson03.teach.final_e_enchantee:
    title: 女性形の綴り
    gloss: はじめまして(女性の言い方)
    note: Enchantéeは女性形にするために e を加えますが、この e によって音節が増えることは普通ありません。
  fr.a1.unit01.lesson03.teach.question_liaison:
    title: 倒置の疑問文を読む
    gloss: お元気ですか。
    note: allez-vousは一つのまとまりとして続けて読みます。allezの z は、ここでは余分な「ズ」の音としては発音されず、標準的な発音はおよそ「アレ ヴ」です。
  fr.a1.unit01.lesson04.teach.ca_va:
    title: 日常の体調のたずね方
    gloss: 調子はどう？、大丈夫？
    note: Çaにはセディーユがあり、c を a の前で s の音にします。同じ表現でも、イントネーションによって質問にも答えにもなります。
  fr.a1.unit01.lesson04.teach.tres_bien:
    title: とても良い返事
    gloss: とても元気です、ありがとう。
    note: Trèsはbienを強めます。語末の s は発音しません。
  fr.a1.unit01.lesson04.teach.ca_va_bien:
    title: 良い返事
    gloss: 元気です。
    note: この決まった返事では、日本語と同じく、「私」にあたる語は必要ありません。
  fr.a1.unit01.lesson04.teach.pas_mal:
    title: まあまあ良い返事
    gloss: 悪くないです。
    note: Pas malは、日本語の「悪くない」と同じように、たいてい軽い肯定を表します。
  fr.a1.unit01.lesson04.teach.fatigue:
    title: 男性形の形容詞の一致
    gloss: 少し疲れています。
    note: Suisはêtreのjeに対する形です。男性が話す場合はfatiguéと書きます。日本語の「疲れた」は話し手の性別で変わりませんが、フランス語では変わります。
  fr.a1.unit01.lesson04.teach.fatiguee:
    title: 女性形の形容詞の一致
    gloss: 少し疲れています。
    note: 女性が話す場合は、語末に e を付けてfatiguéeと書きます。男性形と女性形は普通同じ発音です。
  fr.a1.unit01.lesson04.teach.et_vous:
    title: 丁寧に聞き返す
    gloss: あなたは？
    note: Vousを使うと、知らない大人に対する敬意のある話し方を保てます。
  fr.a1.unit01.lesson04.teach.et_toi:
    title: くだけた聞き返し
    gloss: あなたは？
    note: 親しい友人や同年代の一人に話すときは、etの後ろでtoiを使います。
  fr.a1.unit01.lesson05.teach.here_for_workshop:
    title: 相手の目的を確かめる
    gloss: ワークショップにいらしたのですか。
    note: Êtesはêtreのvousに対する形です。この文は語順を変えず、語尾を上げるイントネーションで疑問文になります。
  fr.a1.unit01.lesson05.teach.yes_thats_it:
    title: 思っていたことを肯定する
    gloss: はい、そうです。
    note: C’est çaは、自然な肯定の返事です。直訳の「それはそれです」のような意味ではありません。
  fr.a1.unit01.lesson05.teach.live_neighborhood:
    title: どこに住んでいるかをたずねる
    gloss: この近所にお住まいですか。
    note: Habitezはhabiterのvousに対する形です。この疑問文は、平叙文と同じ語順のまま、語尾を上げるイントネーションで作れます。
  fr.a1.unit01.lesson05.teach.i_live:
    title: 住んでいる場所を言う
    gloss: モントルイユに住んでいます。
    note: J’habiteはhabiterのjeに対する形で、エリジオンが起きています。Àは都市の場所を表し、「持っている」を意味する動詞の形aと混同しないようにしましょう。
  fr.a1.unit01.lesson05.teach.from_here:
    title: 地元の人かどうかをたずねる
    gloss: この辺りの出身ですか。
    note: D’iciはdeとiciがエリジオンで結びついた形です。Êtesは引き続きêtreのvousに対する形です。
  fr.a1.unit01.lesson05.teach.from_lille:
    title: 出身地を言う
    gloss: リールの出身です。
    note: Suisはêtreのjeに対する形です。出身を言うときは、都市名の前にdeを使います。日本語の「〜の出身」の「の」にあたる働きです。
  fr.a1.unit01.lesson05.teach.workshop_starts:
    title: 活動が始まる
    gloss: ワークショップが始まります。
    note: atelier は男性名詞なので、単数の冠詞は le です。母音の前では le は l’ になります。commence は三人称単数の形です。
  fr.a1.unit01.lesson05.teach.see_you_shortly:
    title: 近いうちに会う人への別れのあいさつ
    gloss: のちほど；また後で
    note: À tout à l’heure は、同じ日のうちにまた会うことを前提にした表現です。いつ会うか決まっていない一般的な別れのあいさつとは違います。
  fr.a1.unit01.lesson06.teach.line01:
    title: 会話のきっかけ
    gloss: イネスがマティユにあいさつし、料理ワークショップに来た人かどうか確かめます。
    note: 二人は初対面の大人どうしなので、最初から vous を使っています。
  fr.a1.unit01.lesson06.teach.line02:
    title: 会話のきっかけ・返事
    gloss: マティユは「はい」と答えて名前を言い、相手の名前をたずねます。
    note: Je m’appelle は、自分の名前を言うときの基本的な言い方です。
  fr.a1.unit01.lesson06.teach.line03:
    title: 名前を教え合う
    gloss: イネスは名前を言い、会えてうれしいと伝えます。
    note: Enchantée は話し手のイネス（女性）に合わせた形です。語尾の -e は書きますが、ふつう発音には現れません。
  fr.a1.unit01.lesson06.teach.line04:
    title: 名前を教え合う・返事
    gloss: マティユも同じ気持ちを返し、近くに住んでいるかをたずねます。
    note: Enchanté は話し手のマティユ（男性）に合わせた形で、イネスが使った語から、発音されない -e を除いたものです。
  fr.a1.unit01.lesson06.teach.line05:
    title: 住んでいる地域について話す
    gloss: イネスは「はい」と答えて通りの名前を言い、同じ質問をマティユに返します。
    note: J’habite の後に通りの名前を続けるときは、rue の前に前置詞を付けません。
  fr.a1.unit01.lesson06.teach.line06:
    title: 住んでいる地域について話す・返事
    gloss: マティユはサン＝トゥアンに住んでいると言い、イネスにここの出身かどうかをたずねます。
    note: J’habite à のように、地名の前では à を使います。イネスが言った通りの名前の場合とは違います。
  fr.a1.unit01.lesson06.teach.line07:
    title: 出身地について話す
    gloss: イネスはここの出身ではなくリールの出身だと言い、マティユにたずね返します。
    note: Je suis de の後に都市名を続けると、その人の出身地を表します。
  fr.a1.unit01.lesson06.teach.line08:
    title: 出身地について話す・返事
    gloss: マティユはリヨンの出身だと言います。
    note: イネスが使ったのと同じ je suis de の型です。
  fr.a1.unit01.lesson06.teach.line09:
    title: 会話を切り上げる
    gloss: イネスはワークショップが始まることに気づき、また後で会いましょうと言います。
    note: 二人とも同じイベントの中にいて、このあとも会うので、À tout à l’heure がぴったりです。
  fr.a1.unit01.lesson06.teach.line10:
    title: 会話を切り上げる・返事
    gloss: マティユも同じ別れのあいさつを返します。
    note: à tout à l’heure をそのまま返すのが、自然な応じ方です。
exercises:
  fr.a1.unit01.lesson01.exercise01.listen_bonjour:
    instruction: 音声を聞いて、聞こえたフレーズを選んでください。
    correct_option: Bonjour.
    distractors:
    - Salut !
    - Au revoir.
    accepted_answers:
    - Bonjour.
    - Bonjour
  fr.a1.unit01.lesson01.exercise02.choose_informal:
    instruction: このくだけたあいさつに合う代名詞はどれですか。
    correct_option: tu
    distractors:
    - vous
    accepted_answers:
    - tu
    feedback: Salut と tu は、どちらもくだけた場面で使う組み合わせです。
  fr.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: 初対面の大人一人に対するあいさつになるように、空所を埋めてください。
    accepted_answers:
    - vous
    feedback: 初対面の大人には、敬意を表す vous を使えば間違いありません。
  fr.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: ていねいな体調のたずね方を、正しい順に並べてください。
    correct_response:
    - Comment
    - allez-vous
  fr.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: 聞こえたくだけた質問を入力してください。
    accepted_answers:
    - Comment vas-tu ?
    - Comment vas-tu?
    - Comment vas tu ?
    - Comment vas tu?
  fr.a1.unit01.lesson01.exercise06.match_register:
    instruction: それぞれのあいさつを、初級でよく使う丁寧さのレベルに合わせて結んでください。
    correct_response:
      Bonjour: vous
      Salut: 君、あなた(親しい間柄で)
    pairs:
    - left: Bonjour
      right: vous
    - left: Salut
      right: 君、あなた(親しい間柄で)
  fr.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: ふつうの別れのあいさつになるように、空所を埋めてください。
    accepted_answers:
    - revoir
  fr.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: ていねいにあいさつし、相手の調子をたずね、会話を終えてください。
    accepted_answers:
    - Bonjour. Comment allez-vous ? Au revoir.
    - Bonjour, comment allez-vous ? Au revoir.
  fr.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: カミーユの自己紹介を組み立ててください。
    correct_response:
    - Je
    - m’appelle
    - Camille
  fr.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: 音声を聞いて、ていねいに名前をたずねる文を選んでください。
    correct_option: Comment vous appelez-vous ?
    distractors:
    - Tu t’appelles comment ?
    - Comment allez-vous ?
    accepted_answers:
    - Comment vous appelez-vous ?
    - Comment vous appelez vous ?
  fr.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: くだけたあいさつに続けて、相手の名前をたずねてください。
    accepted_answers:
    - Tu t’appelles comment ?
    - Tu t'appelles comment ?
    - Tu t’appelles comment?
    - Tu t'appelles comment?
  fr.a1.unit01.lesson02.exercise04.complete_moi_cest:
    instruction: ノエの会話らしい自己紹介になるように、空所を埋めてください。
    accepted_answers:
    - c’est
    - c'est
  fr.a1.unit01.lesson02.exercise05_choose_enchantee:
    instruction: カミーユの書き方は、女性形として正しいですか。
    correct_option: はい。enchantée には女性を表す語尾の e が付いています。
    distractors:
    - いいえ。enchanté が女性形です。
    - いいえ。二つの書き方は同じです。
    accepted_answers:
    - はい。enchantée には女性を表す語尾の e が付いています。
    feedback: Enchantée の語尾の e は、話し手が女性のときに付きます。
  fr.a1.unit01.lesson02.exercise06_return_polite_question:
    instruction: ていねいな言い方のまま、同じ質問を相手に返してください。
    accepted_answers:
    - Et vous ?
