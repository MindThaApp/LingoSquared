answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: フランス語 A1
  description: 市場の語彙、combien・kilo・litre を使った値段や量のたずね方、量を表す表現のあとの du/de la と de の違いを学びます。イネスとマチューの料理教室の物語が、市場での買い物の場面へと続きます。フランス語では、はっきりした量のあとに部分冠詞を使いません(un kilo de tomates であり、un kilo des tomates とは言いません)。
units:
  fr.a1.unit04.shopping:
    title: イネスと食料品の買い物
lessons:
  fr.a1.unit04.lesson01.au_marche:
    title: 市場で
  fr.a1.unit04.lesson02.combien_ca_coute:
    title: いくらですか？
  fr.a1.unit04.lesson03.dialogue_marche:
    title: イネスとマチューと市場で
teaching:
  fr.a1.unit04.lesson01.teach.marche:
    title: 市場
    gloss: その市場
    note: '*Marché* は男性名詞です。'
    example_gloss: 市場は土曜日に開いています。
  fr.a1.unit04.lesson01.teach.boulangerie:
    title: パン屋
    gloss: そのパン屋
    note: '*Boulangerie* は女性名詞です。パン専門の店で、*pâtisserie*(ケーキ屋)とは別です。'
    example_gloss: この近くにおいしいパン屋があります。
  fr.a1.unit04.lesson01.teach.legumes:
    title: 野菜
    gloss: 野菜
    note: '*Légumes* は男性複数名詞です。'
    example_gloss: 教室のために新鮮な野菜を買います。
  fr.a1.unit04.lesson01.teach.fruits:
    title: 果物
    gloss: 果物
    note: '*Fruits* は男性複数名詞です。日本語の「果物」は数えない言い方ですが、フランス語では複数形の *les fruits* をよく使います。'
    example_gloss: 今月は果物が高いです。
  fr.a1.unit04.lesson01.teach.prix:
    title: 値段
    gloss: 値段
    note: '*Prix* は男性名詞で、単数と複数で綴りが変わりません。'
    example_gloss: パンの値段はいくらですか？
  fr.a1.unit04.lesson01.teach.cher:
    title: 高い
    gloss: (値段が)高い
    note: '*Cher* は男性形です。女性形は *chère*、複数形は *chers*/*chères* で、説明する名詞に合わせて変わります。'
    example_gloss: このチーズは高すぎます。
  fr.a1.unit04.lesson01.teach.pas_cher:
    title: 今日は安い
    gloss: 今日は野菜が安いです。
    note: '*Pas cher(s)* のように *ne* を省くのは、「安い」を表す話し言葉でよく使う形です。書き言葉では *ne sont pas chers* と言います。'
  fr.a1.unit04.lesson02.teach.un_kilo_de:
    title: 1キロの~
    gloss: 1キロの~
    note: '*De* は量の表現のすぐあとに置かれ、冠詞はつきません。下の「量のあとの *de*」の文法メモを参照してください。'
    example_gloss: トマトを1キロください。
  fr.a1.unit04.lesson02.teach.un_litre_de:
    title: 1リットルの~
    gloss: 1リットルの~
    note: '*Litre* は男性名詞で、固形物に *kilo* を使うように、液体に使います。'
    example_gloss: 牛乳を1リットルください。
  fr.a1.unit04.lesson02.teach.euro:
    title: 1ユーロ
    gloss: 1ユーロ
    note: '*Euro* は規則的に複数形になります(*deux euros*、*cinq euros*)。'
    example_gloss: それは5ユーロです。
  fr.a1.unit04.lesson02.teach.de_after_quantity:
    title: 量のあとの de
    gloss: ~の
    note: はっきりした量を表す語(*un kilo*、*un litre*、*beaucoup*。例：*beaucoup de cousins*)のあとでは、フランス語は *du*/*de la*/*des* を使わず、*de* だけを使います。*un kilo de tomates* であり、*un kilo des tomates* とは言いません。
  fr.a1.unit04.lesson02.teach.combien_ca_coute:
    title: 値段をたずねる
    gloss: いくらですか？
    note: '*Combien*(いくら)と *ça coûte*(それは値段が~する)を組み合わせた、値段をたずねる一般的な言い方です。'
  fr.a1.unit04.lesson02.teach.cest_combien_pain:
    title: 特定の品物の値段をたずねる
    gloss: パンはいくらですか？
    note: '*C''est combien, [item] ?* は、値段をたずねる特定の品物を示す言い方で、*Combien ça coûte ?* の代わりによく使われます。'
  fr.a1.unit04.lesson02.teach.ca_fait_combien:
    title: 合計をたずねる
    gloss: 全部でいくらになりますか？
    note: '*Ça fait combien ?* は、1つの品物ではなく、たいてい買い物の最後に合計金額をたずねるときに使います。'
  fr.a1.unit04.lesson03.teach.line01:
    title: トマトを注文する
    gloss: イネスは店の人にあいさつして、トマトを1キロ頼みます。
    note: '*Bonjour* と、*je voudrais* + 量の型を組み合わせています。'
  fr.a1.unit04.lesson03.teach.line02:
    title: ほかに必要かたずねる
    gloss: 店の人は了承して、ほかに必要なものはないかたずねます。
    note: '*Autre chose ?*(ほかには？)は、店の人がよく使う決まったたずね方です。'
  fr.a1.unit04.lesson03.teach.line03:
    title: チーズを追加して値段をたずねる
    gloss: イネスはチーズを少し追加して、その値段をたずねます。
    note: '*Un peu de fromage*(少しのチーズ)も、*un kilo de* と同じく、冠詞のない *de* の型です。'
  fr.a1.unit04.lesson03.teach.line04:
    title: 1キロあたりの値段を言う
    gloss: 店の人は1キロ8ユーロだと言います。
    note: '*X euros le kilo* は、単位あたりの値段を言う自然なフランス語です。ここでの *le* は「その」ではなく「~あたり」の意味です。'
  fr.a1.unit04.lesson03.teach.line05:
    title: ここでパンが必要な理由を説明する
    gloss: マチューは自分もパンがほしいけれど、パン屋が今日は閉まっていると言います。
    note: '*Fermée*(閉まっている)は女性形で、*la boulangerie* に合わせています。'
  fr.a1.unit04.lesson03.teach.line06:
    title: 別の案を出す
    gloss: イネスは、ここでもパンは買えると言って安心させます。
    note: '*On peut*(できる)+ 不定詞は、可能なことを言うときによく使うくだけた言い方です。'
  fr.a1.unit04.lesson03.teach.line07:
    title: 確認して合計を伝える
    gloss: 店の人は新鮮なパンがあると答え、合計を考えて、13ユーロ50セントだと言います。
    note: ここでの *Ça fait combien en tout ?* は、店の人が合計を言う前に独り言のように考えているもので、イネスにたずねているわけではありません。
  fr.a1.unit04.lesson03.teach.line08:
    title: 店の人にお礼を言う
    gloss: イネスは支払いをしながら、心を込めてお礼を言います。
    note: ここでの *Voilà* は、お金を渡すときに添える、よく使われる言葉です。
