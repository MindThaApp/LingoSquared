answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: フランス語 A1
  description: 食べ物や飲み物の基本語彙と、カフェでの注文のやりとりを学びます。イネスとマチューの料理教室の物語は、教室のあと二人で食事をする場面に続きます。数えられない食べ物の名詞に使う部分冠詞 du、de la、de l' にも注目します。
units:
  fr.a1.unit05.food:
    title: ワークショップのあとの食事
lessons:
  fr.a1.unit05.lesson01.a_table:
    title: テーブルで
  fr.a1.unit05.lesson02.au_cafe:
    title: カフェで
  fr.a1.unit05.lesson03.dialogue_cafe:
    title: ワークショップのあとのカフェで
teaching:
  fr.a1.unit05.lesson01.teach.poulet:
    title: 鶏肉
    gloss: 鶏肉
    note: '*Poulet* は男性名詞です。'
    example_gloss: 鶏肉をお願いします。
  fr.a1.unit05.lesson01.teach.poisson:
    title: 魚
    gloss: 魚
    note: '*Poisson* は男性名詞です。'
    example_gloss: 今日の魚は新鮮です。
  fr.a1.unit05.lesson01.teach.salade:
    title: サラダ
    gloss: サラダ
    note: '*Salade* は女性名詞です。'
    example_gloss: 彼女はサラダを食べています。
  fr.a1.unit05.lesson01.teach.riz:
    title: 米、ご飯
    gloss: 米、ご飯
    note: '*Riz* は男性名詞で、単数と複数で綴りが変わりません(*prix* と同じです)。'
    example_gloss: ご飯は鶏肉によく合います。
  fr.a1.unit05.lesson01.teach.eau:
    title: 水
    gloss: 水
    note: '*Eau* は女性名詞です。母音で始まるので *l''* になります。この単元の後半に出てくる *l''addition* と同じ形です。'
    example_gloss: お水をお願いします。
  fr.a1.unit05.lesson01.teach.vin:
    title: ワイン
    gloss: ワイン
    note: '*Vin* は男性名詞です。'
    example_gloss: 赤ワインはとてもおいしいです。
  fr.a1.unit05.lesson01.teach.je_voudrais_poulet_salade:
    title: 鶏肉とサラダを注文する
    gloss: 鶏肉とサラダをお願いします。
    note: '*Du poulet*(男性)と *de la salade*(女性)は部分冠詞(「いくらかの」)で、名詞の性に合わせて形が変わります。量を表す語のあと(*un kilo de*)では、性に関係なく *de* だけを使います。'
  fr.a1.unit05.lesson02.teach.dessert:
    title: Dessert
    gloss: デザート
    note: '*Dessert* は男性名詞です。'
    example_gloss: 今日のデザートはサービスです。
  fr.a1.unit05.lesson02.teach.addition:
    title: お会計
    gloss: お会計
    note: '*Addition* は女性名詞で、母音で始まるので *l''* になります。レストランで使う標準的な言い方で、正式な請求書を指す *facture* とは違います。'
    example_gloss: お会計をお願いします。
  fr.a1.unit05.lesson02.teach.vous_avez_choisi:
    title: 注文が決まったかたずねる
    gloss: ご注文はお決まりですか？
    note: ウェイターが注文を取りにテーブルへ来たときの定番の質問です。*choisir*(選ぶ)の複合過去を使っています。
  fr.a1.unit05.lesson02.teach.je_voudrais_un_cafe:
    title: コーヒーを注文する
    gloss: コーヒーをお願いします。
    note: '*Je voudrais* + 品物。買い物のときと同じ型で、ここでは食べ物や飲み物に使います。'
  fr.a1.unit05.lesson02.teach.qcq_comme_dessert:
    title: 何があるかたずねる
    gloss: デザートには何がありますか？
    note: '*Qu''est-ce que vous avez comme...?* は、あるカテゴリーにどんな選択肢があるかをたずねる、自然でよく使われる言い方です。'
  fr.a1.unit05.lesson02.teach.cest_delicieux:
    title: おいしいと言う
    gloss: とてもおいしい！
    note: 食べ物への感動を表すよく使う言葉です。*c'est* のあとには性のある名詞が来ないので、*délicieux* は形が変わりません。
  fr.a1.unit05.lesson03.teach.line01:
    title: あいさつして注文が決まったかたずねる
    gloss: ウェイターはあいさつをして、注文が決まったかたずねます。
    note: 接客の場面で使う丁寧なあいさつ *Bonjour* で始まります。
  fr.a1.unit05.lesson03.teach.line02:
    title: サラダと水を注文する
    gloss: イネスはサラダと水を注文します。
    note: '*je voudrais* と *et* を組み合わせて、1回の発言で2つの品物を注文しています。'
  fr.a1.unit05.lesson03.teach.line03:
    title: 鶏肉とご飯を注文する
    gloss: マチューは鶏肉とご飯を注文します。
    note: '*Avec*(~と一緒に)で主な料理と付け合わせをつなぎます。簡単でよく使う注文の形です。'
  fr.a1.unit05.lesson03.teach.line04:
    title: 了解して飲み物をたずねる
    gloss: ウェイターは注文を確認して、飲み物をたずねます。
    note: '*Et comme boisson pour vous ?* は、*Qu''est-ce que vous avez comme dessert ?* の *comme* と同じ型で、ここでは飲み物に使っています。'
  fr.a1.unit05.lesson03.teach.line05:
    title: グラスワインを注文する
    gloss: マチューは赤ワインをグラスで注文します。
    note: '*Un verre de*(グラス1杯の)は、ワインをグラスで頼むときの標準的な言い方です。'
  fr.a1.unit05.lesson03.teach.line06:
    title: 料理の感想を言う
    gloss: イネスはサラダがおいしいと言います。
    note: '*C''est délicieux !* を、ここでは特定の料理(*cette salade*)に使っています。*salade* は女性名詞ですが、*c''est* のあとなので *délicieux* は男性形のままです。性を一致させた *Elle est délicieuse, cette salade !* という言い方もあります。'
  fr.a1.unit05.lesson03.teach.line07:
    title: 空腹の理由を話してお会計を頼む
    gloss: マチューはワークショップでお腹がすいたと言い、お会計を頼みます。
    note: '*Nous a donné faim*(直訳：「私たちに空腹を与えた」)は、何かのせいでお腹がすいたと言うときの自然なフランス語の言い方です。'
  fr.a1.unit05.lesson03.teach.line08:
    title: お会計をすぐ持ってくると答える
    gloss: ウェイターはすぐに持ってきますと答えます。
    note: '*Tout de suite*(すぐに)は、接客の場面でよく使う、相手を安心させる表現です。'
