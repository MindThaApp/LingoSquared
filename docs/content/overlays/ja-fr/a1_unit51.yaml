teaching:
  fr.a1.unit51.lesson01.teach.combien_ca_coute:
    title: 合計金額をたずねる
    gloss: 全部でいくらですか。
    note: '*En tout*(全部で)を添えると、1品ではなく全体の合計金額をたずねていることがはっきりします。'
  fr.a1.unit51.lesson01.teach.ca_coute_vingt:
    title: 合計金額を伝える
    gloss: 全部で25ユーロです。
    note: '*Ça coûte* は、*ça*(それ)と、*coûter*(値段がする)の1つのものに使う形 *coûte* を合わせた言い方です。'
  fr.a1.unit51.lesson02.teach.payer_par_carte:
    title: カードで支払う、現金で支払う
    gloss: カードで支払う、現金で支払う
    note: '*Payer par carte* はカードで支払うときの普通の言い方で、*payer en espèces* は現金で支払うことです。*carte* には *par*、*espèces* には *en* を使います。'
    example_gloss:
    - ここでカードで支払えますか。
    - 現金で支払います。
  fr.a1.unit51.lesson02.teach.je_peux_payer:
    title: カードが使えるかたずねる
    gloss: ここでカードで支払えますか。
    note: '*Ici*(ここで)を入れると、今立っているカウンターでの質問だとわかります。'
  fr.a1.unit51.lesson02.teach.vous_voulez_payer:
    title: 支払い方法をたずねる
    gloss: 現金とカード、どちらで支払いますか。
    note: '*Vous voulez ... ?* は、知らない店員さんなどに使う丁寧なたずね方です。友だち同士なら *tu veux ... ?* と言います。'
  fr.a1.unit51.lesson03.teach.l_addition:
    title: お会計
    gloss: そのお会計
    note: '*Addition* は女性名詞で、*l''addition* となります。*La* は母音の前で *l''* になります。'
    example_gloss: 割り勘にしましょうか。
  fr.a1.unit51.lesson03.teach.on_partage_l:
    title: 割り勘を提案する
    gloss: 割り勘にしましょうか。
    note: '*On ... ?* は、*On partage ?* のように、いっしょに何かをしようと提案する言い方です。*Partager*(分ける)は *l''addition* と組み合わせて使えます。'
  fr.a1.unit51.lesson03.teach.je_peux_payer:
    title: 別々に支払いたいとたずねる
    gloss: 別々に支払ってもいいですか。
    note: '*Séparément*(別々に)は *payer* のすぐあとに置きます。自分の分だけを支払いたいときの丁寧な頼み方です。'
  fr.a1.unit51.lesson04.teach.la_monnaie:
    title: お釣り
    gloss: お釣り
    note: '*Monnaie* は女性名詞で、*la monnaie* となります。支払いのあとに戻ってくる硬貨や紙幣のことです。'
    example_gloss: お釣りです。
  fr.a1.unit51.lesson04.teach.voici_votre_monnaie:
    title: お釣りを渡す
    gloss: お釣りです。
    note: '*Votre* は丁寧な「あなたの」で、カウンターでの *vous* の言い方に合わせた形です。'
  fr.a1.unit51.lesson04.teach.je_n_ai:
    title: お釣りを断る
    gloss: お釣りはいりません。
    note: '*Avoir besoin de*(必要とする)のあとには名詞が来ます：*Je n''ai pas besoin de monnaie.* *ne ... pas* のあとでは、*de la* が *de* に変わります。'
  fr.a1.unit51.lesson05.teach.trente_cinq:
    title: '35'
    gloss: '35'
    note: '*Trente-cinq* はハイフンでつなぎ、十の位が先に来ます：30 + 5。'
    example_gloss: 35ユーロです。
  fr.a1.unit51.lesson05.teach.addition_deux_plats:
    title: レストランの伝票を読む
    gloss: お会計：メインディッシュ2つとコーヒー2杯。合計：35ユーロ。カードで支払い済み。
    note: 何を注文したか、合計はいくらか、どう支払ったかに注目しましょう。
    glosses:
      Addition: お会計
      deux: '2'
      plats: メインディッシュ
      cafés: コーヒー
      Total: 合計
      trente-cinq: '35'
      euros: ユーロ
      Payé: 支払い済みの
      carte: カード
  fr.a1.unit51.lesson06.teach.camille_on_demande:
    title: Camille が会計をお願いする
    gloss: Camille：お会計をお願いしましょうか。
    note: '*Demander*(頼む、求める)は、余計な語を挟まずに *l''addition* を直接の目的語にとります。'
  fr.a1.unit51.lesson06.teach.mathieu_oui_bonne:
    title: Mathieu が合計をたずねる
    gloss: Mathieu：うん、いいね。全部でいくらかな。
    note: レッスン1の質問 *Combien ça coûte en tout ?* をもう一度使っています。
  fr.a1.unit51.lesson06.teach.camille_ca_fait:
    title: Camille が合計を伝える
    gloss: Camille:35ユーロだよ。割り勘にする？
    note: '*Ça fait* + 金額で合計を伝えます。*partager* は先ほどの会計を指しています。'
  fr.a1.unit51.lesson06.teach.mathieu_non_laisse:
    title: Mathieu が自分が払うと言い張る
    gloss: Mathieu：いや、今日は僕に払わせて。たくさん助けてくれたからね。
    note: '*Laisse-moi* + 動詞の原形は「私にさせて」と申し出る言い方です。*aidé* は *aider*(助ける)の過去分詞です。'
  fr.a1.unit51.lesson06.teach.camille_c_est:
    title: Camille が感激する
    gloss: Camille：優しいね！ありがとう。
    note: '*C''est gentil de ta part*(ご親切にありがとう)は、気前のよい行いに対してよく使われる、温かいほめ言葉です。'
  fr.a1.unit51.lesson06.teach.mathieu_je_peux:
    title: Mathieu がカードで支払えるかたずねる
    gloss: Mathieu：ここでカードで支払えますか。
    note: レッスン2の *Je peux payer par carte ici ?* を、今度は実際のレストランの場面で使っています。
  fr.a1.unit51.lesson06.teach.mathieu_paie_l:
    title: Paie:il/elle に対する形
    gloss: Mathieu は会計を払います。
    note: '*Paie* は *payer*(払う)の *il/elle* に対する形です：*je paie, tu paies, il paie*。'
