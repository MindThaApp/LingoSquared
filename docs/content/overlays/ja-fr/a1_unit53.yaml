teaching:
  fr.a1.unit53.lesson01.teach.grand_petit:
    title: 背が高い、背が低い
    gloss: 背が高い／背が低い
    note: '*Grand* は背が高い人、*petit* は背が低い人を表します。人に合わせて形が変わります：*grand/grande*、*petit/petite*。'
    example_gloss:
    - レアは背が高いです。
    - トマは背が低いです。
  fr.a1.unit53.lesson01.teach.vieux_jeune:
    title: 年を取った、若い
    gloss: 年を取った／若い
    note: ここでの *vieux* と *jeune* は、正確な年数ではなく、年齢の全体的な印象を表します。
    example_gloss:
    - おじいさんは年を取っています。
    - マチューは若いです。
  fr.a1.unit53.lesson01.teach.pour_un_age:
    title: 年齢：数字か印象か
    gloss: 正確な年齢には *avoir* を使います(*Il a vingt ans*)が、*être vieux* は全体的な印象を表します(*Mon grand-père est vieux*)。
    note: 正確な年齢をたずねる *Quel âge as-tu ?* はもう知っていますね。ここでの *vieux* は、数字を示さず、その人がどのくらい年上に見えるかを表します。
  fr.a1.unit53.lesson01.teach.lea_est_grande:
    title: レアは背が高く、トマは背が低い
    gloss: レアは背が高く、トマは背が低いです。
    note: '*et*(そして)でつないだ簡単な文です。レッスン5の直接の比較につながります。'
  fr.a1.unit53.lesson02.teach.les_cheveux:
    title: 髪
    gloss: 髪
    note: '*Les cheveux* は必ず複数形で男性名詞です。日本語の「髪」は数を区別しませんが、フランス語では複数形で表します。'
    example_gloss: マチューは短い黒髪です。
  fr.a1.unit53.lesson02.teach.blonds_bruns_gris:
    title: 金色、茶色、灰色
    gloss: 金色の／茶色の／灰色の
    note: 髪の色を表す3つの単語です。*cheveux* と一緒に使うと、色の語は複数の *s* がつきます：*blonds*、*bruns*。*Gris* はもともと *s* で終わっています。*noirs*(黒)は服のユニットで出てきた単語です。
    example_gloss:
    - カミーユは金髪です。
    - トマは茶色の髪です。
    - おじいさんは白髪です。
  fr.a1.unit53.lesson02.teach.longs_courts:
    title: 長い髪と短い髪
    gloss: 長い／短い（髪）
    note: '*Longs*(長い)はレッスン1の背の高さの考え方を、髪の長さに使ったものです。*Courts*(短い)はここで初めて出てきます。どちらも *cheveux* と一緒に使うと複数の *s* がつきます。'
    example_gloss:
    - レアは長い髪です。
    - トマは短い髪です。
  fr.a1.unit53.lesson02.teach.cheveux_est_toujours:
    title: Cheveux には複数形の形容詞を使う
    gloss: '*Cheveux* は常に複数形なので、形容詞にも *s* がつきます：*longs*、*courts*、*blonds*、*bruns*、*noirs*。*Gris* はもともと *s* で終わっています。'
    note: 色や長さの語は、複数の *cheveux* に合わせます：*les cheveux longs*。レッスン3の *yeux* と比べてみましょう。そこでは *marron* は形が変わりません。
  fr.a1.unit53.lesson02.teach.ses_est_le:
    title: Ses：彼の、または彼女の
    gloss: '*Ses* は複数名詞の前で「彼の」または「彼女の」を表します：*ses cheveux*、*ses yeux*。持ち主ではなく、持たれているものに合わせます。'
    note: フランス語ではここで「彼の」と「彼女の」を区別しません。*ses yeux* は「彼の目」にも「彼女の目」にもなり、どちらかは文脈でわかります。
  fr.a1.unit53.lesson02.teach.mathieu_a_les:
    title: マチューは短い黒髪です
    gloss: マチューは短い黒髪です。
    note: 服のユニットで出てきた *noirs*(黒)をもう一度使っています。
  fr.a1.unit53.lesson02.teach.camille_a_les:
    title: カミーユは長い金髪です
    gloss: カミーユは長い金髪です。
    note: このレッスンで学ぶ長さと色の語彙を、自然な1つの文に組み合わせています。
  fr.a1.unit53.lesson03.teach.les_yeux:
    title: 目
    gloss: 目
    note: '*Les yeux* は *l''œil*(目)の複数形です。*yeux* は *s* ではなく *x* で終わります。'
    example_gloss: マチューは茶色の目をしています。
  fr.a1.unit53.lesson03.teach.bleus_marron_verts:
    title: 青、茶色、緑
    gloss: 青い／茶色い／緑色の
    note: '*Bleus*(青い)は服のユニットで学びました。*marron*(茶色)は形が変わりません。*verts*(緑の)は新しい単語です。'
    example_gloss:
    - カミーユは青い目をしています。
    - トマは茶色の目をしています。
    - レアは緑の目をしています。
  fr.a1.unit53.lesson03.teach.avec_yeux_pluriel:
    title: Yeux には -s がつき、marron は変わらない
    gloss: '*yeux*(複数形)と一緒に使うと、形容詞に *s* がつきます：*yeux bleus*、*yeux verts*。*Marron* は決して変わりません：*yeux marron*。'
    note: レッスン2の *cheveux* と比べてみましょう。複数名詞には複数形の形容詞が付きますが、名詞から来た *marron* のような色は例外です。
  fr.a1.unit53.lesson03.teach.comment_est_camille:
    title: カミーユはどんな外見ですか？
    gloss: カミーユはどんな外見ですか？
    note: '*Comment est ... ?* はこのユニットの基本の質問です。誰の外見でもたずねるときに使えます。'
  fr.a1.unit53.lesson03.teach.camille_a_les:
    title: カミーユは長い金髪で青い目をしています
    gloss: カミーユは長い金髪で青い目をしています。
    note: 髪と目を *et* でつないで1文にした答えの見本です。
  fr.a1.unit53.lesson04.teach.camille_une_nouvelle:
    title: カミーユがニナを紹介する
    gloss: カミーユ：新しい女の子が言語カフェに来ます。名前はニナです。
    note: '*Une nouvelle fille vient* は、新しい人の登場を伝える言い方です。*vient* は *venir*(来る)の形です。'
  fr.a1.unit53.lesson04.teach.mathieu_d_accord:
    title: マチューが外見をたずねる
    gloss: マチュー：わかった！どんな人？
    note: 名前の代わりに *elle*(彼女)を使って、同じ基本の質問をしています：*Comment est-elle ?* ハイフンは動詞と代名詞をつなぎます。
  fr.a1.unit53.lesson04.teach.camille_elle_est:
    title: カミーユがニナの背と髪を説明する
    gloss: カミーユ：彼女は背が低くて、短い金髪だよ。
    note: レッスン1の *petite* とレッスン2の髪の単語を組み合わせています。女の子には *petite* のように *e* がつきます。
  fr.a1.unit53.lesson04.teach.mathieu_et_ses:
    title: マチューが目についてたずねる
    gloss: マチュー：それで、目は？
    note: ここでの *Ses yeux* は「彼女の目」です。*ses* は女の子ではなく *yeux* に合わせます。
  fr.a1.unit53.lesson04.teach.camille_elle_a:
    title: カミーユがニナの目を説明する
    gloss: カミーユ：緑の目をしているよ。
    note: レッスン3の *yeux verts* をもう一度使っています。
  fr.a1.unit53.lesson04.teach.mathieu_merci_alors:
    title: マチューは彼女に気づく
    gloss: マチュー：ありがとう！それなら、彼女だとわかるよ。
    note: '*Je vais la reconnaître* は、*aller* + 不定詞で近い未来を表します。*la* は「彼女を」という意味です。'
  fr.a1.unit53.lesson05.teach.thomas_et_lea:
    title: トマとレアを比べる
    gloss: トマとレアは兄と妹ですが、似ていません。トマは背が低くて、短い茶色の髪と茶色の目をしています。レアはトマより背が高く、長い茶色の髪と緑の目をしています。あなたはどんな外見ですか？
    note: これまでに学んだ色や長さを表す語を使って人の見た目を比べ、最後に自分の見た目について答えます。
    glosses:
      frère: 兄弟
      sœur: 姉妹
      ressemblent: ～に見える
      différents: 異なる
      petit: 背が低い
      courts: 背が低い
      bruns: 茶色の
      cheveux: 髪
      marron: 茶色の
      yeux: 目
      grande: より背が高い
      longs: 長い
      verts: 緑色の
      se: (se ressemblent「似ている」の一部)
  fr.a1.unit53.lesson05.teach.tu_connais_deja:
    title: 人に使う plus ... que
    gloss: '*plus* + 形容詞 + *que* の型はもう知っていますね。ここでは人に使います：レアはトマより背が高いです。'
    note: 買い物のユニットと同じ *plus ... que* の型を、今度は物ではなく人に使っています。*Grande* は女性の *Léa* に合わせて女性形になっています。
  fr.a1.unit53.lesson05.teach.lea_a_les:
    title: レアはトマより髪が長いです
    gloss: レアはトマより髪が長いです。
    note: '*Plus longs que* は複数形の *cheveux* に合わせた形です：*les cheveux plus longs que Thomas*。'
  fr.a1.unit53.lesson05.teach.j_ai_les:
    title: 私は短い茶色の髪をしています
    gloss: 私は短い茶色の髪をしています。
    note: '*J''ai ...* を使った一人称の見本の文です。自分の外見を説明するときにそのまま使えます。'
  fr.a1.unit53.lesson06.teach.mathieu_regarde_c:
    title: マチューがニナを見つける
    gloss: マチュー：見て、あれはニナ？髪は短くて金髪で、目は緑色だよ。
    note: '*Regarde*(見て)は *regarder* の *tu* に対する命令形で、前の会話でも同じように使われています。'
  fr.a1.unit53.lesson06.teach.camille_oui_c:
    title: カミーユが確認する
    gloss: カミーユ：うん、ニナだよ！
    note: 短く自然に、そうだと伝える表現です。
  fr.a1.unit53.lesson06.teach.nina_salut_tu:
    title: ニナがマチューにあいさつする
    gloss: ニナ：こんにちは、マチュー？
    note: くだけたあいさつの簡単な質問文です：*Tu es ... ?*
  fr.a1.unit53.lesson06.teach.mathieu_oui_ravi:
    title: マチューもあいさつを返す
    gloss: マチュー：うん！会えてうれしいよ、ニナ。
    note: '*Ravi de te rencontrer* は初めて会うときの決まった表現です(男性は *ravi*、女性は *ravie*)。すでに知っている人に使う *content de te revoir* とは使い分けます。'
  fr.a1.unit53.lesson06.teach.nina_ravie_de:
    title: Ninaもあいさつを返します
    gloss: Nina：こちらこそ、はじめまして！
    note: 会話の締めくくりです。マチューは、カミーユが先ほど説明した特徴からニナだと分かりました。
