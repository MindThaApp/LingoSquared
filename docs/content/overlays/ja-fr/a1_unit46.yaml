teaching:
  fr.a1.unit46.lesson01.teach.l_appartement_le:
    title: アパート、リビング、寝室
    gloss: アパート、リビング、寝室
    note: '*L''appartement* は男性名詞で、*le* の *e* が省略された形です。*le salon* は男性名詞、*la chambre* は女性名詞です。'
    example_gloss:
    - 私はアパートを持っています。
    - 私の家にはリビングがあります。
    - 私の家には寝室があります。
  fr.a1.unit46.lesson01.teach.la_cuisine_la:
    title: キッチン、バスルーム
    gloss: キッチン、バスルーム
    note: '*La cuisine* も *la salle de bains* も女性名詞です。'
    example_gloss:
    - 私の家にはキッチンがあります。
    - 私の家にはバスルームがあります。
  fr.a1.unit46.lesson01.teach.j_ai_un:
    title: アパートを持っていると言う
    gloss: 私はアパートを持っています。
    note: 住まいについて何を持っているかを言うとき、フランス語では *avoir*(持つ)を使うのが自然です。日本語では「ある」と言うことも多いですが、フランス語では「持つ」の動詞を使います。これは一般的な例で、Mathieuの(リヨンの)アパートはこのユニットの後半に出てきます。
  fr.a1.unit46.lesson01.teach.j_ai_un_2:
    title: すべての部屋を挙げる
    gloss: リビングと寝室とキッチンとバスルームがあります。
    note: このレッスンの語彙の4つの部屋を、コンマでつなぎ、最後に *et* を置いて1文で挙げています。
  fr.a1.unit46.lesson02.teach.tu_as_combien:
    title: 部屋の数をたずねる
    gloss: 部屋はいくつありますか。
    note: '*Combien de*(いくつの)の後ろには複数形の名詞が来ます：*combien de pièces*。'
  fr.a1.unit46.lesson02.teach.j_ai_deux:
    title: 部屋の数を言う
    gloss: 寝室が2つあります。
    note: '*Chambres* は *chambre* の複数形で、規則どおり発音しない *-s* をつけて作ります。'
  fr.a1.unit46.lesson02.teach.l_appartement_a:
    title: 部屋の合計数を言う
    gloss: そのアパートは3部屋です。
    note: '*Pièces* は寝室に限らず、部屋全般を指す言葉です。'
  fr.a1.unit46.lesson03.teach.le_balcon_le:
    title: バルコニー、庭
    gloss: バルコニー、庭
    note: '*Le balcon* も *le jardin* も男性名詞です。'
    example_gloss:
    - バルコニーがあります。
    - 庭はありません。
  fr.a1.unit46.lesson03.teach.il_y_a:
    title: あるものを言う
    gloss: バルコニーがあります。
    note: '*Il y a* は「~がある・いる」にあたる、存在を表す基本の言い方です。'
  fr.a1.unit46.lesson03.teach.il_n_y:
    title: ないものを言う
    gloss: 庭はありません。
    note: '*Pas de* は不特定の名詞を否定します：*pas de jardin* であり、*pas un jardin* ではありません。'
  fr.a1.unit46.lesson04.teach.cosy:
    title: 居心地のよい
    gloss: 居心地がいい
    note: 温かく心地よい雰囲気を表す、フランス語でとてもよく使われる形容詞です。
    example_gloss: そのアパートは小さいけれど居心地がいいです。
  fr.a1.unit46.lesson04.teach.l_appartement_est:
    title: よくある描写のパターン
    gloss: そのアパートは小さいけれど居心地がいいです。
    note: '*Petit mais cosy* は、コンパクトな住まいを好意的に表すときにフランス語話者がよく使う自然な言い方です。'
  fr.a1.unit46.lesson04.teach.le_salon_est:
    title: 部屋の広さを描写する
    gloss: リビングは広いです。
    note: '*Grand* は家全体ではなく特定の1つの部屋を描写します。男性名詞の *le salon* に合わせた形です。'
  fr.a1.unit46.lesson04.teach.la_cuisine_est:
    title: 別の部屋の広さを描写する
    gloss: キッチンは狭いです。
    note: 前のカードの *grand* と同じパターンで、別の部屋を描写しています。*la cuisine* は女性名詞なので *petite* になります。
  fr.a1.unit46.lesson05.teach.appartement_a_lyon:
    title: 物件広告を読む
    gloss: リヨンのアパート：寝室1、リビング、キッチン、バスルーム。バルコニーはありますが、庭はありません。小さいけれど居心地のよいアパートです。
    note: 部屋の数、あるものとないもの、そして全体の印象に注目しましょう。
    glosses:
      Appartement: アパート
      chambre: 寝室
      salon: リビング
      cuisine: キッチン
      bains: 浴室
      balcon: バルコニー
      jardin: 庭
      petit: 小さい
      cosy: 居心地がいい
  fr.a1.unit46.lesson06.teach.camille_salut_mathieu:
    title: Camilleがアパートについてたずねる
    gloss: Camille：こんにちは、Mathieu。リヨンの新しいアパートはどう？
    note: '*Nouvel* は、母音で始まる男性名詞の前で使う *nouveau*(新しい)の形です：*un nouvel appartement*。'
  fr.a1.unit46.lesson06.teach.mathieu_il_est:
    title: Mathieuが説明する
    gloss: Mathieu：小さいけれど居心地がいいよ。寝室が1つと、リビング、キッチン、バスルームがあるんだ。
    note: 先ほど読んだ物件広告とまったく同じ内容で、これがMathieuの実際のアパートです。
  fr.a1.unit46.lesson06.teach.camille_tu_as:
    title: Camilleがバルコニーについてたずねる
    gloss: Camille：バルコニーはある？
    note: '*Tu as ... ?* を使った、はい・いいえで答える直接的な質問です。'
  fr.a1.unit46.lesson06.teach.mathieu_oui_j:
    title: Mathieuが答える
    gloss: Mathieu：うん、バルコニーはあるけど、庭はないよ。
    note: 先ほどの広告にあった、バルコニーはあるが庭はないという内容と一致しています。
  fr.a1.unit46.lesson06.teach.balcon_est_masculin:
    title: balconの性
    gloss: '*Balcon* は男性名詞です：バルコニー、それは小さいです。'
    note: '*Il*(彼、それ)は *balcon* のような男性名詞を受けるので、形容詞も男性形になります：*il est petit*。'
  fr.a1.unit46.lesson06.teach.camille_ca_a:
    title: Camilleが好意的に反応する
    gloss: Camille：いい感じね！近いうちに遊びに行くわ。
    note: '*Je passerai te voir*(遊びに行く)は、未来形の *passerai* に「あなたに会う」の *te voir* が続いた形です。'
  fr.a1.unit46.lesson06.teach.mathieu_super_tu:
    title: Mathieuが歓迎する
    gloss: Mathieu：いいね、いつでも歓迎だよ。
    note: '*Toujours la bienvenue*(いつでも歓迎)は、また来てほしいという温かい気持ちを伝える言い方です。ここでは Camille のことなので、*bienvenue* は女性形です。'
