teaching:
  fr.a1.unit43.lesson01.teach.le_billet:
    title: 入場券
    gloss: その入場券
    note: '*Billet* は男性名詞です:*le billet*、*un billet*。'
    example_gloss: リヨン行きの切符を1枚お願いします。
  fr.a1.unit43.lesson01.teach.je_voudrais_un:
    title: 切符を頼む
    gloss: リヨン行きの切符を1枚お願いします。
    note: '*Je voudrais* は依頼をやわらげる言い方で、*je veux* より丁寧です。'
  fr.a1.unit43.lesson01.teach.voulez_vous_un:
    title: 窓口の人が種類をたずねる
    gloss: 片道ですか、往復ですか?
    note: '*Voulez-vous* は *vouloir* の丁寧な *vous* の形で、ここでは初対面の駅員さんに対して使っています。'
  fr.a1.unit43.lesson01.teach.un_aller_retour:
    title: 丁寧に答える
    gloss: 往復をお願いします。
    note: '*S''il vous plaît* は丁寧な「お願いします」で、このやりとりの *vous* の丁寧さに合っています。'
  fr.a1.unit43.lesson01.teach.au_guichet_on:
    title: 窓口での話し方
    gloss: 窓口では、ふつう丁寧な *vous* を使います。
    note: サービスを提供する初対面の人には *vous* を使い、友人や家族には *tu* を使います。
  fr.a1.unit43.lesson02.teach.le_quai:
    title: プラットホーム
    gloss: プラットホーム
    note: '*Quai* は男性名詞です:*le quai*。'
    example_gloss: リヨン行きの電車は何番線から出ますか。
  fr.a1.unit43.lesson02.teach.de_quel_quai:
    title: 何番線かをたずねる
    gloss: リヨン行きの電車は何番線から出ますか。
    note: '*De quel quai* はホームを specific にたずねる表現で、*quel* は男性名詞 *quai* に合わせた形です。'
  fr.a1.unit43.lesson02.teach.le_train_part:
    title: 出発の情報を伝える
    gloss: 電車は5番線から9時45分に出発します。
    note: '*Dix heures moins le quart* は「10時15分前」、つまり9時45分のことです。フランス語では、ちょうどの時刻より前を言うとき *moins*(マイナス)を使います。'
  fr.a1.unit43.lesson02.teach.a_quelle_heure:
    title: 到着時刻をたずねる
    gloss: 電車は何時に到着しますか?
    note: '*À quelle heure arrive ... ?* は時刻をたずねる表現です。*arriver* は規則的な *-er* 動詞で、*le train arrive* となります。'
  fr.a1.unit43.lesson02.teach.le_train_arrive:
    title: 到着時刻を伝える
    gloss: 電車は11時に到着します。
    note: '*Arrive* は *arriver* の *il/elle* の形です。*-er* 動詞は *il* と *elle* のとき語尾が *-e* になります。'
  fr.a1.unit43.lesson03.teach.a_l_heure:
    title: 時間どおり/遅れ
    gloss: 時間どおりに;遅れ
    note: '*À l''heure* は予定どおりに物事が起こることを表す決まった表現です。*Le retard*(遅れ)は男性名詞です。'
    example_gloss:
    - 電車は時間どおりに出発しません。
    - お知らせします。リヨン行きの電車は遅れています。
  fr.a1.unit43.lesson03.teach.attention_le_train:
    title: アナウンス
    gloss: お知らせします。リヨン行きの電車は遅れています。
    note: '*Attention* は駅のアナウンスの冒頭に使われ、日本語の「お客様にお知らせいたします」に近い働きをします。'
  fr.a1.unit43.lesson03.teach.le_train_ne:
    title: 「時間どおり」を否定する
    gloss: 電車は時間どおりに出発しません。
    note: '*Ne ... pas* は動詞をはさみます:*ne part pas à l''heure*。'
  fr.a1.unit43.lesson03.teach.le_train_part:
    title: ホームの変更
    gloss: 電車は5番線ではなく3番線から出発します。
    note: '*Au lieu du* は「~の代わりに、~ではなく」という意味で、*de* + *le* は *du* になります。'
  fr.a1.unit43.lesson03.teach.le_train_a:
    title: 遅れの長さを伝える
    gloss: 電車は10分遅れています。
    note: '*A ... de retard*(直訳は「遅れを~持っている」)は遅れていることを言う自然な表現で、*avoir* を使います。'
  fr.a1.unit43.lesson04.teach.l_entree_la:
    title: 入口、出口、待合室
    gloss: 入口;出口;待合室
    note: '*L''entrée* は母音の前で *e* が落ちて *l''* になります。*la sortie* と *la salle d''attente* は女性名詞です。'
    example_gloss:
    - 入口はどこですか?
    - 出口はどこですか?
    - 待合室はどこですか?
  fr.a1.unit43.lesson04.teach.ou_est_le:
    title: ホームの場所をたずねる
    gloss: 7番線はどこですか。
    note: '*Où est ... ?* は物の場所をたずねる表現です。*le quai sept* は男性名詞です。'
  fr.a1.unit43.lesson04.teach.tout_droit_puis:
    title: 道を教える
    gloss: まっすぐ行って、それから右です。
    note: '*Tout droit* と *à droite* は方向を表す言葉です。*droite* の前には *à* が付きます。'
  fr.a1.unit43.lesson04.teach.ou_est_la:
    title: 待合室についてたずねる
    gloss: 待合室はどこですか?
    note: 同じ質問の型を、別の場所に使います。
  fr.a1.unit43.lesson05.teach.billet_paris_gare:
    title: 印刷された切符を読む
    gloss: 切符:パリ・リヨン駅からリヨン・パールデュー駅まで。出発:10時10分、7番線。到着:10時50分。往復。料金:12ユーロ40。
    note: 出発時刻とホーム、到着時刻、切符の種類、料金を確認しましょう。
    glosses:
      Billet: 入場券
      Départ: 出発
      dix: '10'
      quai: プラットホーム
      sept: '7'
      Arrivée: 到着
      onze: '11'
      Aller-retour: 往復切符
      Prix: 料金
      douze: '12'
      euros: ユーロ
      quarante: '40'
  fr.a1.unit43.lesson06.teach.mathieu_on_doit:
    title: マチューが予定を言う
    gloss: マチュー:7番線に行かなきゃ。電車は10時10分に出るよ。
    note: '*On doit*(*devoir* から)は、ここでは厳しい義務ではなく、実際上の必要を表しています。'
  fr.a1.unit43.lesson06.teach.camille_regarde_voila:
    title: カミーユが表示を読む
    gloss: カミーユ:見て、表示板があるよ。遅れ、10分だって。
    note: '*Voilà* はそこにあるものを指し示します:*voilà le panneau*。'
  fr.a1.unit43.lesson06.teach.mathieu_pas_de:
    title: マチューは落ち着いている
    gloss: マチュー:問題ないよ、コーヒーを飲む時間はまだあるし。
    note: '*Pas de problème* は、相手を安心させるよく使われるくだけた言い方です。'
  fr.a1.unit43.lesson06.teach.camille_bonne_idee:
    title: 電車が到着する
    gloss: カミーユ:いいね。あ、もう電車が来たよ。7番線、ぴったり!
    note: '*Déjà*(もう)は、今発表された遅れのわりに、電車が思ったより早く着いたことを示しています。'
  fr.a1.unit43.lesson06.teach.mathieu_allez_on:
    title: 電車に乗る
    gloss: マチュー:さあ、乗ろう。リヨン、今行くよ!
    note: '*On* は日常会話で *私たち* の意味でよく使われ、動詞は *il* と同じ形になります:*on monte*。*On arrive !* は「さあ、着くぞ」という自然な言い方で、直訳すると不自然に聞こえます。'
