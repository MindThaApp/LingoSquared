teaching:
  fr.a1.unit50.lesson01.teach.appeler:
    title: 電話する
    gloss: 電話する
    note: 電話をかけるという意味の動詞の不定詞です。
    example_gloss: あなたに電話しなければなりません。
  fr.a1.unit50.lesson01.teach.je_t_appelle:
    title: 電話すると伝える
    gloss: あなたに電話しますね。
    note: '*Appelle* は *appeler* の *je* の形です。日本語では「電話します」と未来のことも言えますが、フランス語でも、近い未来のことは現在形で表します。'
  fr.a1.unit50.lesson01.teach.allo_c_est:
    title: 電話に出る
    gloss: もしもし、カミーユです。
    note: 電話で名乗るときは、*C'est* + 名前が標準的な言い方です。日本語の「〜です」にあたります。
  fr.a1.unit50.lesson01.teach.allo_c_est_2:
    title: マチューも同じように電話に出る
    gloss: もしもし、マチューです。
    note: '*Allô, c''est Camille* と同じ、*c''est* + 名前の形です。'
  fr.a1.unit50.lesson02.teach.qui_est_a:
    title: 誰からの電話か尋ねる
    gloss: どちら様ですか?
    note: '*Qui est à l''appareil ?* は、知らない相手に名前を尋ねるときの標準的な言い方です。'
  fr.a1.unit50.lesson02.teach.vous_parlez_avec:
    title: 丁寧に名乗る
    gloss: カミーユです。
    note: '*Vous parlez avec* + 名前は、*c''est* + 名前の丁寧な言い方です。'
  fr.a1.unit50.lesson03.teach.tu_peux_repeter:
    title: 聞き返す
    gloss: もう一度言ってもらえますか?
    note: '*Tu peux ...*(〜してくれる?)のあとに、不定詞 *répéter*(繰り返す)が続きます。'
  fr.a1.unit50.lesson03.teach.ne_parle_pas:
    title: ゆっくり話してもらうよう頼む
    gloss: そんなに早口で話さないでください。
    note: '*Ne parle pas si vite* は動詞の否定文です。*ne ... pas* が *parle* をはさみ、*si* は「そんなに」という意味です。'
  fr.a1.unit50.lesson03.teach.je_ne_t:
    title: よく聞こえないと伝える
    gloss: よく聞こえません。
    note: '*Entendre*(聞こえる)に *ne ... pas bien* を付けると、聞こえにくいことを表します。*comprendre*(理解する)とは別の意味です。'
  fr.a1.unit50.lesson04.teach.le_sms:
    title: ショートメッセージ
    gloss: ショートメッセージ
    note: '*SMS* は男性名詞で、*un SMS* と言います。'
    example_gloss: そのショートメッセージはカミーユからです。
  fr.a1.unit50.lesson04.teach.je_t_envoie:
    title: ショートメッセージを送ると伝える
    gloss: ショートメッセージを送りますね。
    note: '*Envoyer*(送る)では、動詞の前に代名詞 *te*(ここでは *t''*)を置き、そのあとに *un SMS* が続きます。'
  fr.a1.unit50.lesson04.teach.je_te_rappelle:
    title: かけ直すと伝える
    gloss: 後でかけ直しますね。
    note: '*Rappeler*(かけ直す)は、*re-* に「再び」の意味が含まれています。*plus tard* は「後で」という意味です。'
  fr.a1.unit50.lesson05.teach.mathieu_salut_camille:
    title: メッセージのやり取りを読む
    gloss: マチュー:やあカミーユ、電話してくれる?話したいことがあるんだ。カミーユ:ええ、もちろん。5分後にかけ直すね。
    note: マチューが何を頼んでいるか、その理由、そしてカミーユがいつかけ直すと言っているかを読み取りましょう。
    glosses:
      Salut: やあ
      peux: できる
      m'appeler: 電話する
      dois: 〜しなければならない
      truc: 何か、こと
      dire: 言う、伝える
      évidemment: もちろん
      rappelle: かけ直す
      cinq: '5'
      minutes: 分
  fr.a1.unit50.lesson06.teach.mathieu_allo_c:
    title: マチューが電話に出る
    gloss: マチュー:もしもし、マチューです。
    note: 第1課と同じ *c'est* + 名前の形を、実際の電話で使っています。電話に出た人が先に話し、名前を言います。
  fr.a1.unit50.lesson06.teach.camille_salut_mathieu:
    title: カミーユが名乗る
    gloss: カミーユ:やあマチュー、カミーユだよ。マチュー:電話をくれてうれしいな!
    note: '*C''est sympa que* ...(〜してくれてうれしい)は、出来事への好意的な反応を表します。*appelles* は特別な形なので、ここではそのまま覚えましょう。'
  fr.a1.unit50.lesson06.teach.camille_comment_s:
    title: カミーユがシフトについて尋ねる
    gloss: カミーユ:最初のシフトはどうだった?
    note: '*Comment s''est passé ... ?* は、*se passer*(起こる、進む)の複合過去で、*être* を使います。物事がどうだったかを尋ねる表現です。'
  fr.a1.unit50.lesson06.teach.mathieu_ca_s:
    title: マチューがいい知らせを伝える
    gloss: マチュー:とてもうまくいったよ、思っていたより。
    note: '*Ça s''est très bien passé* と *je pensais* は、ここでは決まった言い方として覚えましょう。*je pensais* は *penser*(思う)の半過去です。'
  fr.a1.unit50.lesson06.teach.au_passe_compose:
    title: avoir と être を使う複合過去
    gloss: s'est passé → 起こる、進む、j'ai pensé → 思う、je suis allé → 行く
    note: 複合過去は *avoir* または *être* + 過去分詞で作ります。例:*j'ai pensé*、*je suis allé*。*Ça s'est passé* は「うまくいった/進んだ」という決まった言い方です。今はこの課に出てくる場面で覚えましょう。
  fr.a1.unit50.lesson06.teach.camille_ca_fait:
    title: カミーユが誇らしく思う
    gloss: カミーユ:それを聞けてうれしい!あなたを誇りに思うよ。
    note: '*Fière de*(〜を誇りに思う)は決まった組み合わせです。*pour* ではなく *de* を使います。ここでは *fière* は女性形です。'
  fr.a1.unit50.lesson06.teach.mathieu_merci_beaucoup:
    title: マチューが感動する
    gloss: マチュー:本当にありがとう、それは僕にとってすごく大事なことだよ。
    note: ここでの *compter* は「大切である」という意味です。*ça compte pour moi*(私にとって大切だ)の *pour moi* は、誰にとって大切かを表します。
  fr.a1.unit50.lesson06.teach.son_premier_service:
    title: 彼の
    gloss: 彼の最初のシフトはとてもうまくいきました。
    note: ここでの *Son* は動詞ではなく、「彼の」を表す所有形容詞です:*son premier service*(彼の最初のシフト)。*son* は男性名詞の *service* に合わせた形です。
