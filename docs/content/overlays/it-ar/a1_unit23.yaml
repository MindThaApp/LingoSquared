teaching:
  ar.a1.unit23.lesson01.teach.phone:
    title: Telefono
    gloss: telefono
    note: هاتف (hātif) significa «telefono».
    example_gloss: Questo è un telefono.
  ar.a1.unit23.lesson01.teach.hear:
    title: Ti sento
    gloss: ti sento
    note: أسمعك (asmaʿuka a un uomo, asmaʿuki a una donna) significa «ti sento»; لا أسمعك (lā asmaʿuk) significa «non ti sento».
    example_gloss: Non ti sento.
  ar.a1.unit23.lesson01.teach.repeat:
    title: Ripetere
    gloss: ripeti
    note: 'أعد (aʿid) si dice a un uomo; a una donna: أعيدي (aʿīdī). أعد من فضلك è un modo cortese per chiedere a qualcuno di ripetere.'
    example_gloss: Non ti sento. Ripeti, per favore.
  ar.a1.unit23.lesson01.teach.slowly:
    title: Parlare lentamente
    gloss: parla lentamente
    note: 'تكلم ببطء (takallam bi-buṭʾ) si dice a un uomo; a una donna: تكلمي ببطء (takallamī bi-buṭʾ).'
    example_gloss: Parla lentamente, per favore.
  ar.a1.unit23.lesson02.teach.message:
    title: Messaggio
    gloss: messaggio
    note: رسالة (risāla) significa «messaggio»; può significare anche «lettera».
    example_gloss: Questo è un messaggio.
  ar.a1.unit23.lesson02.teach.appointment:
    title: Appuntamento
    gloss: l'appuntamento
    note: موعد (mawʿid) significa appuntamento; الموعد (al-mawʿid) è l'appuntamento.
    example_gloss: L'appuntamento è alle cinque.
  ar.a1.unit23.lesson02.teach.line01:
    title: Risposta al telefono
    gloss: Yusuf saluta Layla al telefono e dice il suo nome.
    note: Al telefono, أنا يوسف (anā Yūsuf) serve a dire chi sta chiamando.
    example_gloss: 'Yusuf ha detto: Ciao, sono Yusuf.'
  ar.a1.unit23.lesson02.teach.line02:
    title: Non si sente
    gloss: Layla dice che non riesce a sentire Yusuf.
    note: Questa frase introduce la richiesta di chiarimento.
    example_gloss: 'Layla ha detto: Ciao Yusuf, non ti sento.'
  ar.a1.unit23.lesson02.teach.line03:
    title: Chiedere di parlare piano
    gloss: Layla chiede a Yusuf di parlare piano.
    note: من فضلك rende la richiesta cortese; Layla dice تكلم perché si rivolge a un uomo.
    example_gloss: 'Layla ha detto: Parla piano, per favore.'
  ar.a1.unit23.lesson02.teach.line04:
    title: Dettaglio chiave
    gloss: Yusuf dice che l'appuntamento è alle cinque.
    note: في الساعة الخامسة (fī s-sāʿa l-khāmisa) significa alle cinque.
    example_gloss: 'Yusuf ha detto: L''appuntamento è alle cinque.'
  ar.a1.unit23.lesson02.teach.line05:
    title: Chiedere di ripetere
    gloss: Layla chiede a Yusuf di ripetere.
    note: أعد من فضلك è la richiesta di ripetere.
    example_gloss: 'Layla ha detto: Ripeti, per favore.'
  ar.a1.unit23.lesson02.teach.line06:
    title: Ripetere il dettaglio
    gloss: Yusuf ripete l'orario dell'appuntamento.
    note: La frase ripetuta conferma l'orario.
    example_gloss: 'Yusuf ha detto: L''appuntamento è alle cinque.'
