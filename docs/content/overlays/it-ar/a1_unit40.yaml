    title: Un testo sull'incendio
    gloss: 'C''è un incendio nel caffè delle lingue della biblioteca. Il dipendente dice: andate all''uscita di emergenza! Nour ha bisogno di aiuto. Layla è con Nour. Yusuf chiama i vigili del fuoco. Sono tutti fuori. Meno male!'
