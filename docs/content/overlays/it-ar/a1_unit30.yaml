    gloss: Hai internet a casa?
  ar.a1.unit30.lesson01.teach.astkhdm_hatfy_kl:
    title: Uso il cellulare tutti i giorni
    gloss: Uso il cellulare ogni giorno.
    note: أستخدم (astakhdim) significa «uso». La ي alla fine di هاتفي significa «mio».
  ar.a1.unit30.lesson02.teach.alttbyq:
    title: L'app
    gloss: l'app
    example_gloss: Ho un'app per le previsioni del tempo.
  ar.a1.unit30.lesson02.teach.alrsala:
    title: Il messaggio
    gloss: il messaggio
    example_gloss: Mando un messaggio con l'app.
  ar.a1.unit30.lesson02.teach.rsala_tany_nsa:
    title: 'Messaggio: inviare e leggere'
    gloss: رسالة (risāla) indica un messaggio che si invia (أرسل رسالة, ursil risāla) o si legge (أقرأ رسالة, aqraʾ risāla).
    note: Collega la nuova parola al testo sulle previsioni del tempo e ai messaggi che le persone inviano e leggono.
  ar.a1.unit30.lesson02.teach.lyla_trsl_rsala:
    title: Layla manda un messaggio tramite l'app
    gloss: Layla manda un messaggio tramite l'app.
    note: 'ترسل (tursil) significa «lei invia»: la lettera iniziale ت (ta-) indica «lei». عبر (ʿabra) significa «tramite» o «attraverso».'
  ar.a1.unit30.lesson02.teach.ywsf_yqra_alrsala:
    title: Yusuf legge il messaggio
    gloss: Yusuf legge il messaggio.
  ar.a1.unit30.lesson03.teach.albhth_an:
    title: Cercare
    gloss: cercare (informazioni)
    example_gloss: Cerco le previsioni del tempo.
  ar.a1.unit30.lesson03.teach.alfal_abhth_yaty:
    title: Un verbo con عن
    gloss: 'Il verbo أبحث (abḥath) è seguito da عن (ʿan): أبحث عن توقعات الطقس (abḥath ʿan tawaqquʿāt aṭ-ṭaqs). Invece أستخدم (astakhdim) prende il complemento direttamente: أستخدم هاتفي.'
    note: عن (ʿan) significa «su» o «per». Ogni verbo arabo ha la sua preposizione, quindi impara i verbi insieme a essa.
  ar.a1.unit30.lesson03.teach.krym_ybhth_an:
    title: Karim cerca le previsioni del tempo
    gloss: Karim cerca le previsioni del tempo.
  ar.a1.unit30.lesson03.teach.thm_ydhhb_llrkd:
    title: Poi va a correre
    gloss: Poi va a correre.
    note: 'ثم (thumma) significa «poi» ed è una parola separata, a differenza di و. يذهب للركض (yadhhab li-r-rakḍ) significa «va a correre»: ل + الركض diventa للركض.'
  ar.a1.unit30.lesson04.teach.lyla_hl_nmars:
    title: Layla propone
    gloss: 'Layla: Facciamo sport sabato alle dieci?'
  ar.a1.unit30.lesson04.teach.ywsf_fkra_jyda:
    title: Yusuf accetta
    gloss: 'Yusuf: Bella idea! Cercherò le previsioni del tempo.'
    note: 'فكرة جيدة (fikra jayyida): l''aggettivo جيدة termina in ة come il nome, perché entrambi sono femminili. سأبحث (sa-abḥath) è il futuro: س + أبحث.'
  ar.a1.unit30.lesson04.teach.ywsf_aljw_mshms:
    title: Yusuf controlla il tempo
    gloss: 'Yusuf: Sabato c''è il sole!'
    note: الجو مشمس (al-jaww mushmis) significa «il tempo è soleggiato», senza una parola per «è». مشمس è maschile perché concorda con الجو.
  ar.a1.unit30.lesson04.teach.krym_ara_alrsala:
    title: Karim vede il messaggio
    gloss: 'Karim: Vedo il messaggio. A sabato!'
  ar.a1.unit30.lesson04.teach.ila_allqaa_abara:
    title: إلى اللقاء + un giorno
    gloss: 'Conosci già إلى اللقاء (ilā al-liqāʾ, arrivederci). Puoi aggiungere un giorno: إلى اللقاء يوم السبت (ilā al-liqāʾ yawm as-sabt), إلى اللقاء غدا (ilā al-liqāʾ ghadan).'
    note: Estende lo schema di saluto dell'unità sui saluti a un giorno preciso.
  ar.a1.unit30.lesson05.teach.lyla_ttsl_bywsf:
    title: Chi usa cosa?
    gloss: Layla chiama Yusuf ogni giorno. Usa il telefono, non un'app. Yusuf non ha un computer a casa, ma usa internet sul telefono. Karim cerca le previsioni del tempo ogni mattina. Poi va a correre. Sara manda spesso messaggi a Layla. E tu, usi il telefono ogni giorno?
    note: Confronta le abitudini dei quattro personaggi con i dispositivi, come la lettura di confronto dell'unità sullo sport.
    glosses:
      تتصل: chiama
      كل: ogni / tutti
      يوم: giorno
      تستخدم: usa
      هاتفها: cellulare
      تطبيقا: app
      حاسوب: computer
      البيت: a casa
      الإنترنت: internet
      يبحث: cerca
      صباح: mattina
      توقعات: previsioni (del tempo)
      يذهب: va
      للركض: per correre
      ترسل: manda
      كثيرا: spesso
      رسالة: messaggio
      تستعمل: uso
  ar.a1.unit30.lesson05.teach.krym_ybhth_kl:
    title: Karim cerca le previsioni ogni mattina
    gloss: Karim cerca le previsioni del tempo ogni mattina.
  ar.a1.unit30.lesson05.teach.sara_trsl_rsala:
    title: Sara scrive spesso a Layla
    gloss: Sara manda spesso un messaggio a Layla.
  ar.a1.unit30.lesson06.teach.lyla_ara_alrsala:
    title: Layla conferma il programma
    gloss: 'Layla: Vedo il messaggio. Facciamo sport sabato alle dieci al parco?'
  ar.a1.unit30.lesson06.teach.ywsf_nam_waljw:
    title: Yusuf conferma il tempo
    gloss: 'Yusuf: Sì, e sabato c''è il sole!'
  ar.a1.unit30.lesson06.teach.krym_sarkd_idhn:
    title: Il programma di Karim
    gloss: 'Karim: Allora correrò. Dopo giocherò anche a calcio.'
    note: 'سأركض (sa-arkuḍ) significa «correrò»: س indica il futuro. بعد ذلك (baʿda dhālik) significa «dopo di ciò», «poi».'
  ar.a1.unit30.lesson06.teach.sara_afdl_alsbaha:
    title: Il programma di Sara
    gloss: 'Sara: Preferisco nuotare, ma verrò anch''io al parco.'
    note: أفضل (ufaḍḍil) significa «preferisco». لكنني (lākinnanī) significa «ma io», e سآتي (sa-ātī) significa «verrò».
  ar.a1.unit30.lesson06.teach.lyla_jmyl_ila:
    title: Layla chiude la conversazione
    gloss: 'Layla: Bene! A sabato al parco!'
    note: Chiude in una sola battuta la conversazione di questa unità e il programma dell'unità sullo sport.
