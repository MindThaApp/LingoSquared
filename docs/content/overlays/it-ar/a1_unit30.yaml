course:
  title: Arabo A1
  description: 'Arabo per principianti per parlare di tecnologia: nominare telefoni, computer e internet, inviare e leggere messaggi tramite un''app, cercare informazioni online e usare tutto questo per organizzare un vero programma con gli amici.'
