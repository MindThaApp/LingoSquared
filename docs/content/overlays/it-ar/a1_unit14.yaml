teaching:
  ar.a1.unit14.lesson01.teach.like:
    title: mi piace
    gloss: mi piace
    note: أحب (uḥibbu) significa mi piace / amo. L'arabo usa ال (il, la) per le cose in generale, quindi «mi piace il caffè» si dice أحب القهوة, letteralmente «amo il caffè».
    example_gloss: Mi piace il caffè.
  ar.a1.unit14.lesson01.teach.tea:
    title: Tè
    gloss: tè
    note: شاي (shāy) significa tè; الشاي (ash-shāy) aggiunge ال, come fa l'arabo quando parla del tè in generale.
    example_gloss: Non mi piace il tè.
  ar.a1.unit14.lesson01.teach.dislike:
    title: Non mi piace
    gloss: non mi piace
    note: In arabo la negazione si forma semplicemente con لا davanti a أحب, senza alcun verbo ausiliare.
    example_gloss: Non mi piace il tè.
  ar.a1.unit14.lesson01.teach.water:
    title: L'acqua
    gloss: acqua
    note: الماء (al-māʾ) è ماء (acqua, dall'unità sul cibo) con ال, usato per l'acqua in generale.
    example_gloss: Mi piace l'acqua.
  ar.a1.unit14.lesson01.teach.and_not:
    title: E non
    gloss: e non
    note: 'ولا (wa-lā) è و (e) unito a لا (non): aggiunge qualcosa che non piace dopo qualcosa che piace.'
    example_gloss: Mi piace il caffè e non mi piace il tè.
  ar.a1.unit14.lesson02.teach.prefer:
    title: preferisco
    gloss: preferisco
    note: 'أفضل (ufaḍḍilu) significa preferisco: scegli un''opzione rispetto a un''altra.'
    example_gloss: Preferisco il caffè.
  ar.a1.unit14.lesson02.teach.what_prefer:
    title: Cosa preferisci?
    gloss: Cosa preferisci?
    note: تفضل qui è tufaḍḍil, «preferisci», detto a un uomo; a una donna si dice تفضلين (tufaḍḍilīn). È una parola diversa da تفضل (tafaḍḍal, «prego») dell'unità sul cibo, anche se si scrive allo stesso modo.
    example_gloss: 'Nour ha detto: Che cosa preferisci, Yusuf?'
  ar.a1.unit14.lesson02.teach.line01:
    title: Nour chiede
    gloss: Nour chiede a Yusuf che cosa preferisce.
    note: 'نور (Nour) è la sorella di Yusuf. Dice تفضل perché si rivolge a un uomo; a una donna direbbe: ماذا تفضلين؟'
    example_gloss: 'Nour ha detto: Che cosa preferisci, Yusuf?'
  ar.a1.unit14.lesson02.teach.line02:
    title: Yusuf preferisce il caffè
    gloss: Yusuf dice che preferisce il caffè.
    note: أفضل sceglie un'opzione rispetto alle altre; أحب dice semplicemente che qualcosa ti piace.
    example_gloss: 'Yusuf ha detto: Preferisco il caffè.'
  ar.a1.unit14.lesson02.teach.line03:
    title: A Yusuf non piace il tè
    gloss: Yusuf dice che non gli piace il tè.
    note: لا أحب esprime semplicemente che qualcosa non ti piace.
    example_gloss: 'Yusuf ha detto: Non mi piace il tè.'
  ar.a1.unit14.lesson02.teach.line04:
    title: A Nour piace l'acqua
    gloss: Nour dice che le piace l'acqua.
    note: أنا (io) si può aggiungere per dare enfasi.
    example_gloss: 'Nour ha detto: Mi piace l''acqua.'
