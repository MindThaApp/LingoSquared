course:
  title: Arabo A1
  description: 'Arabo per principianti per descrivere l''aspetto di una persona: altezza ed età, colore dei capelli e degli occhi, la domanda كيف تبدو؟ (kayfa tabdū?) e il confronto tra due persone con أطول من (aṭwal min).'
units:
  ar.a1.unit26.appearance:
    title: Descrivere l'aspetto
lessons:
  ar.a1.unit26.lesson01.twyl_wqsyr_wkbyr_fy:
    title: Alto, basso, anziano e giovane
  ar.a1.unit26.lesson02.wsf_alshar:
    title: Descrivere i capelli
  ar.a1.unit26.lesson03.alaynan_wkyf_ybdw_alshkhs:
    title: Gli occhi e «Com'è?»
  ar.a1.unit26.lesson04.lyla_tsf_nwr:
    title: Layla descrive Nour
  ar.a1.unit26.lesson05.mqarna_byn_krym_wsara:
    title: Confronto tra Karim e Sara
  ar.a1.unit26.lesson06.ywsf_ytarf_ala_nwr:
    title: Yusuf riconosce Nour
teaching:
  ar.a1.unit26.lesson01.teach.twyl_qsyr:
    title: Alto e basso
    gloss: alto / basso
    note: 'طويل (ṭawīl) significa alto e قصير (qaṣīr) basso. Per una donna prendono la ة: طويلة (ṭawīla), قصيرة (qaṣīra).'
    example_gloss:
    - Sara è alta.
    - Karim è basso.
  ar.a1.unit26.lesson01.teach.kbyr_fy_alsn:
    title: Anziano e giovane
    gloss: anziano / giovane
    note: كبير في السن (kabīr fī as-sinn) e صغير في السن (ṣaghīr fī as-sinn) descrivono un'impressione generale dell'età, non un numero esatto di anni.
    example_gloss:
    - Il nonno è anziano.
    - Yusuf è giovane.
  ar.a1.unit26.lesson01.teach.km_amrk_sual:
    title: 'L''età: un numero o un''impressione'
    gloss: كم عمرك؟ (kam ʿumruka?) chiede un numero di anni, mentre كبير في السن (kabīr fī as-sinn) dà un'impressione generale senza numero, come in الجد كبير في السن (al-jadd kabīr fī as-sinn).
    note: Usa كم عمرك؟ per chiedere esattamente quanti anni ha qualcuno. Qui كبير في السن descrive soltanto quanto una persona sembra anziana.
  ar.a1.unit26.lesson01.teach.sara_twyla_wkrym:
    title: Sara è alta e Karim è basso
    gloss: Sara è alta e Karim è basso.
    note: 'و (wa-) unisce le due frasi e si scrive attaccata alla parola seguente: وكريم (wa-karīm). Gli aggettivi concordano: سارة طويلة è femminile e كريم قصير è maschile.'
  ar.a1.unit26.lesson02.teach.alshar:
    title: I capelli
    gloss: i capelli
    note: 'الشعر (ash-shaʿr) significa «i capelli». ش è una lettera solare, quindi la ل di ال non si pronuncia: ash-shaʿr.'
    example_gloss: Yusuf ha i capelli corti e neri.
  ar.a1.unit26.lesson02.teach.ashqr_bny_rmady:
    title: Biondo, castano e grigio
    gloss: biondo / castano / grigio
    note: 'أشقر (ashqar), بني (bunnī) e رمادي (ramādī) descrivono i capelli e vanno dopo il nome: شعر أشقر (shaʿr ashqar).'
    example_gloss:
    - Layla ha i capelli biondi.
    - Karim ha i capelli castani.
    - Il nonno ha i capelli grigi.
  ar.a1.unit26.lesson02.teach.shar_twyl_shar:
    title: Lunghi e corti (capelli)
    gloss: lungo / corto (capelli)
    note: 'طويل (ṭawīl) e قصير (qaṣīr) descrivono anche i capelli: شعر طويل (shaʿr ṭawīl), شعر قصير (shaʿr qaṣīr). Seguono شعر, che è maschile.'
    example_gloss:
    - Sara ha i capelli lunghi.
    - Karim ha i capelli corti.
  ar.a1.unit26.lesson02.teach.alsfa_taty_bad:
    title: L'aggettivo segue il nome
    gloss: 'In arabo l''aggettivo viene dopo il nome e concorda con esso: شعر قصير (shaʿr qaṣīr), شعر طويل (shaʿr ṭawīl), شعر أشقر (shaʿr ashqar), شعر بني (shaʿr bunnī), شعر رمادي (shaʿr ramādī), شعر أسود (shaʿr aswad).'
    note: شعر (shaʿr) è maschile, quindi anche i suoi aggettivi sono maschili. Con un nome indeterminato nessuna delle due parole prende ال.
  ar.a1.unit26.lesson02.teach.ndyf_aldmyr_ha:
    title: I capelli e i suoi capelli
    gloss: شعر (shaʿr) significa «capelli». Aggiungi il pronome ها (hā, suo/di lei) e ottieni شعرها (shaʿruhā, i suoi capelli).
    note: 'La terminazione ها indica il possessore: شعرها (i suoi capelli), اسمها (il suo nome), عيناها (i suoi occhi). Si scrive unita alla parola.'
  ar.a1.unit26.lesson02.teach.lywsf_shar_qsyr:
    title: Yusuf ha i capelli corti e neri
    gloss: Yusuf ha i capelli corti e neri.
    note: 'ليوسف شعر قصير أسود (li-yūsuf shaʿr qaṣīr aswad): ل (li-) davanti a un nome significa «ha» e si scrive unita al nome.'
  ar.a1.unit26.lesson02.teach.llyla_shar_twyl:
    title: Layla ha i capelli lunghi e biondi
    gloss: Layla ha i capelli lunghi e biondi.
    note: Unisce in un'unica frase naturale il lessico di lunghezza e colore di questa lezione.
  ar.a1.unit26.lesson03.teach.alaynan:
    title: Gli occhi
    gloss: gli occhi
    note: 'العينان (al-ʿaynān) significa «gli occhi». È un nome duale: l''arabo ha una terminazione speciale ان per indicare esattamente due.'
    example_gloss: Yusuf ha gli occhi castani.
  ar.a1.unit26.lesson03.teach.azrq_bny_akhdr:
    title: Azzurro, marrone e verde
    gloss: azzurro / marrone / verde
    note: 'أزرق (azraq) azzurro/blu, بني (bunnī) marrone e أخضر (akhḍar) verde sono le forme maschili. Con عينان si usano le forme duali: زرقاوان (zarqāwān), بنيتان (bunnīyatān), خضراوان (khaḍrāwān).'
    example_gloss:
    - Layla ha gli occhi azzurri.
    - Karim ha gli occhi castani.
    - Sara ha gli occhi verdi.
  ar.a1.unit26.lesson03.teach.aynan_mthna_ldhlk:
    title: Occhi al duale, aggettivo al duale
    gloss: 'عينان (ʿaynān) è duale, quindi anche il suo aggettivo è duale: عينان زرقاوان (ʿaynān zarqāwān), عينان بنيتان (ʿaynān bunnīyatān), عينان خضراوان (ʿaynān khaḍrāwān).'
    note: Al duale la terminazione ان si aggiunge sia al nome sia all'aggettivo. L'aggettivo è anche femminile, perché عين è un nome femminile.
  ar.a1.unit26.lesson03.teach.kyf_tbdw_lyla:
    title: Com'è Layla fisicamente?
    gloss: Com'è Layla fisicamente?
    note: كيف تبدو ليلى؟ (kayfa tabdū laylā?) chiede che aspetto abbia Layla. تبدو (tabdū) è femminile perché Layla è una donna; per un uomo si dice يبدو (yabdū).
  ar.a1.unit26.lesson03.teach.llyla_shar_twyl:
    title: Layla ha i capelli lunghi e biondi e gli occhi azzurri
    gloss: Layla ha i capelli lunghi e biondi e gli occhi azzurri.
    note: 'لليلى شعر طويل أشقر وعينان زرقاوان (li-laylā shaʿr ṭawīl ashqar wa-ʿaynān zarqāwān): ل + un nome significa «ha», e و unisce capelli e occhi.'
  ar.a1.unit26.lesson04.teach.lyla_staty_ftaa:
    title: Layla presenta Nour
    gloss: 'Layla: Verrà una ragazza nuova al caffè delle lingue. Si chiama Nour.'
    note: 'ستأتي (sa-taʾtī) significa «verrà»: س (sa-) indica il futuro e ت (ta-) indica «lei». اسمها (ismuhā) significa «il suo nome».'
  ar.a1.unit26.lesson04.teach.ywsf_hsna_kyf:
    title: Yusuf chiede com'è
    gloss: 'Yusuf: Va bene! Com''è fisicamente?'
    note: 'كيف تبدو؟ (kayfa tabdū?) questa volta non ha il nome: il verbo تبدو contiene già «lei sembra».'
  ar.a1.unit26.lesson04.teach.lyla_hy_qsyra:
    title: Layla descrive altezza e capelli di Nour
    gloss: 'Layla: È bassa e ha i capelli corti e biondi.'
    note: قصيرة (qaṣīra) è femminile perché Nour è una donna, ma شعر قصير أشقر resta maschile perché شعر è un nome maschile.
  ar.a1.unit26.lesson04.teach.ywsf_waynaha:
    title: Yusuf chiede dei suoi occhi
    gloss: 'Yusuf: E i suoi occhi?'
    note: 'وعيناها (wa-ʿaynāhā) significa «e i suoi occhi»: و (wa-) si unisce al nome, e ها (hā) alla fine significa «suoi/di lei».'
  ar.a1.unit26.lesson04.teach.lyla_lha_aynan:
    title: Layla descrive gli occhi di Nour
    gloss: 'Layla: Ha gli occhi verdi.'
    note: 'لها (lahā) significa «ha (lei)»: ل (la-) + ها (hā). عينان خضراوان (ʿaynān khaḍrāwān) è un nome duale con un aggettivo duale.'
  ar.a1.unit26.lesson04.teach.ywsf_shkra_idhn:
    title: Yusuf la riconoscerà
    gloss: 'Yusuf: Grazie! Allora la riconoscerò.'
    note: 'سأتعرف عليها (sa-ataʿarraf ʿalayhā) significa «la riconoscerò»: س (sa-) indica il futuro e ها in عليها significa «lei».'
  ar.a1.unit26.lesson05.teach.sara_akht_krym:
    title: Confronto tra Karim e Sara
    gloss: Karim e Sara sono fratello e sorella, ma hanno un aspetto diverso. Karim è basso e ha i capelli corti e castani e gli occhi castani. Sara è più alta di Karim e ha i capelli lunghi e castani e gli occhi verdi. E tu, com'è il tuo aspetto?
    note: Un breve confronto che riprende tutte le parole di colore e lunghezza viste finora e termina con la domanda chiave dell'unità rivolta a chi legge.
    glosses:
      أخ: fratello
      أخت: sorella
      تبدو: essere (di aspetto)
      مختلفان: diverso
      القامة: basso (di statura)
      قصير: basso
      بني: castano
      شعر: i capelli
      بنيتان: castano
      وعينان: gli occhi
      أطول: più alto
      طويل: lungo
      خضراوان: verde
      المظهر: aspetto (come appare una persona)
  ar.a1.unit26.lesson05.teach.llmqarna_nstkhdm_afal:
    title: Il confronto con أفعل
    gloss: 'Per fare un confronto, usa la forma أفعل (afʿal) + من (min): سارة أطول من كريم (sāra aṭwal min karīm), Sara è più alta di Karim.'
    note: طويل (ṭawīl) diventa أطول (aṭwal) al comparativo, e من (min) significa «di/che». La forma non cambia per una donna.
  ar.a1.unit26.lesson05.teach.lsara_shar_atwl:
    title: Sara ha i capelli più lunghi di Karim
    gloss: Sara ha i capelli più lunghi di Karim.
    note: 'لسارة شعر أطول من شعر كريم (li-sāra shaʿr aṭwal min shaʿr karīm): أطول resta maschile perché شعر è un nome maschile.'
  ar.a1.unit26.lesson05.teach.ldy_shar_qsyr:
    title: Ho i capelli corti e castani
    gloss: Ho i capelli corti e castani.
    note: 'لدي (ladayya) significa «ho»; in arabo non c''è un verbo «avere». Gli aggettivi seguono il nome: شعر قصير بني (shaʿr qaṣīr bunnī).'
  ar.a1.unit26.lesson06.teach.ywsf_anzry_hl:
    title: Yusuf nota Nour
    gloss: 'Yusuf: Guarda, è Nour quella? Ha i capelli corti e biondi e gli occhi verdi.'
    note: انظري (unẓurī) è l'imperativo rivolto a una donna, perché Yusuf parla con Layla; a un uomo si dice انظر (unẓur). هذه (hādhihi) significa «questa», per un nome femminile.
  ar.a1.unit26.lesson06.teach.lyla_nam_hdhh:
    title: Layla conferma
    gloss: 'Layla: Sì, è Nour!'
    note: Una conferma breve e naturale.
  ar.a1.unit26.lesson06.teach.nwr_mrhba_hl:
    title: Nour saluta Yusuf
    gloss: 'Nour: Ciao, sei Yusuf?'
    note: 'هل أنت يوسف؟ (hal anta yūsuf?) è una domanda sì/no: هل (hal) + una frase senza il verbo «essere».'
  ar.a1.unit26.lesson06.teach.ywsf_nam_tshrft:
    title: Yusuf ricambia il saluto
    gloss: 'Yusuf: Sì! Piacere di conoscerti, Nour.'
    note: تشرفت بمعرفتك (tasharraftu bi-maʿrifatika) è la formula di cortesia per un primo incontro. ب (bi-) si unisce a معرفتك, e la ك finale significa «tua».
  ar.a1.unit26.lesson06.teach.nwr_wana_ayda:
    title: Nour ricambia il saluto
    gloss: 'Nour: Piacere anche a me!'
    note: 'Conclude il dialogo: Yusuf ha riconosciuto Nour grazie alla descrizione di Layla.'
