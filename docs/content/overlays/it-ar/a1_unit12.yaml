  ar.a1.unit12.lesson01.teach.go:
    title: Andiamo
    gloss: andiamo / stiamo andando
    note: نذهب (nadh-hab) significa «andiamo»; la ن iniziale indica «noi». Con غدا il presente esprime un programma.
    example_gloss: Andiamo al caffè.
  ar.a1.unit12.lesson01.teach.plan_time:
    title: Domani alle cinque
    gloss: domani alle cinque
    note: في الساعة («alle») viene prima dell'ora, come nell'unità sull'ora.
    example_gloss: Andiamo domani alle cinque.
  ar.a1.unit12.lesson02.teach.propose:
    title: Proporre un programma
    gloss: Andiamo al caffè domani?
    note: 'هل (hal) trasforma un''affermazione in una domanda a risposta sì/no; con نذهب funziona come proposta: andiamo?'
    example_gloss: 'Layla ha detto: Andiamo al caffè domani?'
  ar.a1.unit12.lesson02.teach.accept:
    title: Accettare indicando l'ora
    gloss: Sì, alle cinque
    note: Puoi rispondere semplicemente con نعم più l'ora; non serve il verbo.
    example_gloss: 'Yusuf ha detto: Sì, alle cinque.'
  ar.a1.unit12.lesson02.teach.decline:
    title: Rifiutare in modo semplice
    gloss: No, ho lezione
    note: لا è un semplice rifiuto, seguito dal motivo con عندي («ho»).
    example_gloss: No, domani ho lezione.
  ar.a1.unit12.lesson02.teach.line01:
    title: Layla propone
    gloss: Layla propone di andare al caffè domani.
    note: Questa battuta apre lo scambio per fare programmi.
    example_gloss: 'Layla ha detto: Andiamo al caffè domani?'
  ar.a1.unit12.lesson02.teach.line02:
    title: Yusuf accetta
    gloss: Yusuf accetta e dice l'ora.
    note: Ora il programma ha un'attività, un giorno e un'ora.
    example_gloss: 'Yusuf ha detto: Sì, alle cinque.'
  ar.a1.unit12.lesson02.teach.line03:
    title: Layla conferma
    gloss: Layla dice «bene» e arrivederci.
    note: جيد (jayyid) significa «bene»; qui conferma il programma. إلى اللقاء è il saluto di congedo dell'unità sui saluti.
    example_gloss: 'Layla ha detto: Bene. Arrivederci.'
