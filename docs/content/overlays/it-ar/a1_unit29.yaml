  ar.a1.unit29.lesson04.teach.rkwb_aldraja_ytghyr:
    title: Il verbo cambia con la persona
    gloss: 'Il verbo cambia con la persona: أركب الدراجة إلى عملي (arkab ad-darrāja ilā ʿamalī), «vado al lavoro in bici»; يوسف يركب الدراجة إلى عمله (yūsuf yarkab ad-darrāja ilā ʿamalihi), «Yusuf va al lavoro in bici».'
    note: La lettera iniziale أ (a-) indica «io» e ي (ya-) indica «lui». La desinenza ي in عملي significa «mio», e la desinenza ه in عمله significa «suo».
  ar.a1.unit29.lesson04.teach.ywsf_idhn_adhhb:
    title: Yusuf risponde
    gloss: 'Yusuf: Allora prendo il treno, insieme a Layla.'
  ar.a1.unit29.lesson05.teach.lyla_tsafr_kl:
    title: Chi viaggia come?
    gloss: Layla va al lavoro in treno ogni giorno. Yusuf di solito va in bici, ma quando piove prende anche lui il treno. Karim preferisce guidare la macchina. Sara abita vicino e va al lavoro a piedi. Tu come vai al lavoro?
    note: I verbi riferiti alle donne (تسافر, تسكن, تمشي) iniziano con ت (ta-), quelli riferiti agli uomini (يركب, يذهب, يقود, يفضل) iniziano con ي (ya-).
    glosses:
      تسافر: viaggia
      كل: ogni / tutti
      يوم: giorno
      بالقطار: in treno
      عملها: lavorare
      يركب: va in bicicletta
      غالبا: di solito
      أمطرت: piove
      يذهب: prende
      يقود: va (in macchina)
      يفضل: preferisce
      السيارة: la macchina
      تسكن: abita
      قريبا: vicino
      وتمشي: cammina
      تذهب: viaggi
  ar.a1.unit29.lesson05.teach.sara_tskn_qryba:
    title: Sara abita vicino e va al lavoro a piedi
    gloss: Sara abita vicino e va al lavoro a piedi.
  ar.a1.unit29.lesson06.teach.lyla_hl_nrkb:
