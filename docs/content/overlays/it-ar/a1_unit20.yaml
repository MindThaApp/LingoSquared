teaching:
  ar.a1.unit20.lesson01.teach.weather:
    title: Il tempo
    gloss: il tempo (meteorologico)
    note: الجو (al-jaww) è la parola di uso quotidiano per «il tempo» atmosferico; anche الطقس (aṭ-ṭaqs), nel titolo dell'unità, significa «tempo».
    example_gloss: Che tempo fa oggi?
  ar.a1.unit20.lesson01.teach.sunny:
    title: Soleggiato
    gloss: soleggiato
    note: مشمس (mushmis) significa «soleggiato»; è maschile perché concorda con الجو.
    example_gloss: Oggi c'è il sole.
  ar.a1.unit20.lesson01.teach.cold:
    title: Freddo
    gloss: freddo
    note: بارد (bārid) significa «freddo».
    example_gloss: Oggi fa freddo.
  ar.a1.unit20.lesson01.teach.sunny_today:
    title: Oggi c'è il sole
    gloss: Oggi c'è il sole
    note: In arabo non serve una parola separata per «è».
    example_gloss: 'Yusuf ha detto: «Oggi c''è il sole».'
  ar.a1.unit20.lesson02.teach.hot:
    title: Caldo
    gloss: caldo
    note: حار (ḥārr) significa «caldo».
    example_gloss: Fa caldo.
  ar.a1.unit20.lesson02.teach.weather_question:
    title: Che tempo fa?
    gloss: Che tempo fa oggi?
    note: كيف (kayfa) significa «come», come in كيف حالك؟
    example_gloss: 'Layla ha detto: «Che tempo fa oggi?»'
  ar.a1.unit20.lesson02.teach.drink_water_plan:
    title: Beviamo dell'acqua
    gloss: beviamo dell'acqua
    note: هيا (hayyā) + un verbo alla forma «noi» significa «dai, …iamo»; نشرب (nashrab) significa «beviamo».
    example_gloss: Fa caldo. Beviamo dell'acqua.
  ar.a1.unit20.lesson02.teach.line01:
    title: Chiedere del tempo
    gloss: Layla chiede che tempo fa oggi.
    note: اليوم significa «oggi».
    example_gloss: 'Layla ha detto: «Che tempo fa oggi?»'
  ar.a1.unit20.lesson02.teach.line02:
    title: Sole e caldo
    gloss: Yusuf dice che c'è il sole e fa caldo.
    note: 'و (wa, «e») unisce le due parole sul tempo e si scrive attaccata alla parola seguente: وحار.'
    example_gloss: 'Yusuf ha detto: «C''è il sole e fa caldo».'
  ar.a1.unit20.lesson02.teach.line03:
    title: Proporre il bar
    gloss: Layla propone di andare al bar.
    note: هل نذهب significa «andiamo?».
    example_gloss: 'Layla ha detto: «Andiamo al bar?»'
  ar.a1.unit20.lesson02.teach.line04:
    title: Il programma dell'acqua
    gloss: Yusuf dice di sì e propone di bere dell'acqua.
    note: هيا نشرب significa «beviamo».
    example_gloss: 'Yusuf ha detto: «Sì, beviamo dell''acqua».'
