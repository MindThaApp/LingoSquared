teaching:
  ar.a1.unit02.lesson01.teach.ma_ismuka:
    title: Come ti chiami?
    gloss: Come si chiama?
    note: ما اسمك؟ (mā ismuk) è il modo standard per chiedere il nome; senza vocali segnate, la forma scritta va bene per qualsiasi interlocutore.
  ar.a1.unit02.lesson01.teach.ismee:
    title: Il mio nome è
    gloss: il mio nome [è]
    note: اسمي (ismī) unisce اسم («nome») alla desinenza possessiva ـي («mio»).
    example_gloss: Mi chiamo Karim.
  ar.a1.unit02.lesson01.teach.ana:
    title: io
    gloss: io
    note: أنا (anā) è il pronome personale soggetto «io»; anche i verbi arabi indicano da soli la persona, ma أنا si usa per enfasi e in semplici frasi nominali come questa.
    example_gloss: Sono Sara.
  ar.a1.unit02.lesson01.teach.tasharrafna:
    title: Piacere di conoscerti
    gloss: piacere
    note: 'تشرفنا (tasharrafnā), letteralmente «siamo onorati», è la risposta reciproca abituale quando si conosce qualcuno: può dirla per primo l''uno o l''altro.'
  ar.a1.unit02.lesson02.teach.min_ayna:
    title: Di dove sei?
    gloss: Di dov'è Lei?
    note: من أين أنت؟ (min ayna anta se ti rivolgi a un uomo, min ayna anti se ti rivolgi a una donna) serve a chiedere la provenienza di qualcuno; scritta senza vocali è identica per entrambi.
  ar.a1.unit02.lesson02.teach.ana_min:
    title: Io sono di
    gloss: Io sono di
    note: أنا من (anā min) è seguito direttamente dal nome di un paese o di una città.
  ar.a1.unit02.lesson02.teach.lubnan:
    title: Libano
    gloss: Libano
    note: لبنان (lubnān) non ha l'articolo determinativo, a differenza della maggior parte degli altri paesi di questa lezione.
    example_gloss: Sono del Libano.
  ar.a1.unit02.lesson02.teach.misr:
    title: Egitto
    gloss: Egitto
    note: مصر (miṣr) non ha l'articolo determinativo.
    example_gloss: Sono dell'Egitto.
  ar.a1.unit02.lesson02.teach.urdun:
    title: Giordania
    gloss: Giordania
    note: الأردن (al-ʾurdun) porta sempre l'articolo determinativo الـ come parte del nome, come المغرب e العراق in questa lezione.
    example_gloss: Sono della Giordania.
  ar.a1.unit02.lesson02.teach.maghrib:
    title: Marocco
    gloss: Marocco
    note: المغرب (al-maghrib) significa letteralmente «l'occidente», dalla stessa radice del momento della preghiera del tramonto.
    example_gloss: Sono del Marocco.
  ar.a1.unit02.lesson02.teach.soorya:
    title: Siria
    gloss: Siria
    note: سوريا (sūryā) non ha l'articolo determinativo.
    example_gloss: Sono della Siria.
  ar.a1.unit02.lesson02.teach.iraq:
    title: Iraq
    gloss: Iraq
    note: العراق (al-ʿirāq) porta l'articolo determinativo.
    example_gloss: Sono dell'Iraq.
  ar.a1.unit02.lesson03.teach.hal_anta_min:
    title: Sei di...?
    gloss: Sei egiziano/a?
    note: هل (hal) è una particella che introduce le domande con risposta sì/no e si pone all'inizio della frase; da sola non ha un significato proprio.
  ar.a1.unit02.lesson03.teach.naam:
    title: Sì
    gloss: sì
    note: نعم (naʿam) è la risposta affermativa standard.
    example_gloss: Sì, sono dell'Egitto.
  ar.a1.unit02.lesson03.teach.laa:
    title: 'No'
    gloss: 'no'
    note: لا (lā) è la risposta negativa standard.
    example_gloss: No, sono del Libano.
  ar.a1.unit02.lesson03.teach.saidtu_biliqaaik:
    title: Sono stato felice di conoscerti
    gloss: Sono stato felice di conoscerti
    note: سعدت بلقائك (saʿidtu bi-liqāʾik) è una formula di chiusura più calorosa di تشرفنا, spesso usata poco prima di salutarsi.
  ar.a1.unit02.lesson03.teach.marhaban_bik:
    title: Benvenuto a te
    gloss: benvenuto / sei il benvenuto qui
    note: 'مرحبا بك (marḥaban bik) aggiunge بك, «a te»: la preposizione بـ con il suffisso pronominale ـك (tu) attaccato, lo stesso بك di أهلا بك.'
  ar.a1.unit02.lesson04.teach.line01:
    title: Saluto iniziale
    gloss: Yusuf saluta Layla.
    note: Lo scambio si apre con un semplice مرحبا, prima di dirsi i nomi.
  ar.a1.unit02.lesson04.teach.line02:
    title: Saluto iniziale, risposta
    gloss: Layla lo saluta a sua volta.
    note: La stessa parola مرحبا vale per entrambi gli interlocutori.
  ar.a1.unit02.lesson04.teach.line03:
    title: Chiedere il nome
    gloss: Yusuf le chiede come si chiama.
    note: ما اسمك؟ dà inizio alla presentazione.
  ar.a1.unit02.lesson04.teach.line04:
    title: Chiedere il nome, risposta
    gloss: Layla risponde e gli rivolge la stessa domanda.
    note: 'وأنت؟ riprende la domanda senza ripetere tutta la frase: una scorciatoia molto comune.'
  ar.a1.unit02.lesson04.teach.line05:
    title: Risposta e piacere reciproco
    gloss: Yusuf dice il suo nome e che è lieto di conoscerla.
    note: تشرفنا chiude lo scambio dei nomi.
  ar.a1.unit02.lesson04.teach.line06:
    title: Piacere reciproco, risposta
    gloss: Layla ripete la stessa formula.
    note: تشرفنا è naturale che lo dicano entrambe le persone, non solo una.
  ar.a1.unit02.lesson04.teach.line07:
    title: Chiedere la provenienza
    gloss: Yusuf le chiede di dove è.
    note: من أين أنت؟ sposta la conversazione sulla provenienza.
  ar.a1.unit02.lesson04.teach.line08:
    title: Chiedere la provenienza, risposta
    gloss: Layla risponde e gli rivolge la stessa domanda.
    note: Usa di nuovo وأنت؟, la stessa scorciatoia della battuta precedente.
  ar.a1.unit02.lesson04.teach.line09:
    title: Dire la provenienza
    gloss: Yusuf dice che è del Libano.
    note: أنا من لبنان segue lo stesso schema studiato nella lezione 2.
  ar.a1.unit02.lesson04.teach.line10:
    title: Chiudere la conversazione
    gloss: Layla dice che è stata felice di conoscerlo.
    note: سعدت بلقائك indica che la conversazione sta naturalmente per concludersi.
  ar.a1.unit02.lesson04.teach.line11:
    title: Congedo
    gloss: Yusuf le dice che è sempre la benvenuta e la saluta.
    note: دائما («sempre») trasforma مرحبا بك in un invito aperto prima del saluto مع السلامة.
  ar.a1.unit02.lesson04.teach.line12:
    title: Congedo, risposta
    gloss: Layla saluta.
    note: مع السلامة chiude lo scambio; è stato presentato in a1_unit01.
