    gloss: Layla e Yusuf cucinano insieme nella cucina di Yusuf ad Alessandria. Layla taglia la cipolla. Yusuf frigge il pomodoro nella padella. Yusuf prepara il pasto. Layla assaggia il pasto. Il pasto è buonissimo!
