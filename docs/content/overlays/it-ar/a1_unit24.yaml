  ar.a1.unit24.lesson01.teach.pay:
    title: Pago
    gloss: pago
    note: أدفع (adfaʿ) significa «pago».
    example_gloss: Pago dieci dirham.
  ar.a1.unit24.lesson01.teach.card:
    title: Carta
    gloss: carta
    note: 'بطاقة (biṭāqa) significa carta; بالبطاقة (bil-biṭāqa) significa con la carta. In سأدفع (sa-adfaʿ), il prefisso سـ mette أدفع al futuro: pagherò.'
    example_gloss: Pagherò con la carta.
  ar.a1.unit24.lesson01.teach.cash:
    title: Contanti
    gloss: in contanti
    note: نقدا (naqdan) significa in contanti.
    example_gloss: Pago in contanti.
  ar.a1.unit24.lesson02.teach.amount:
    title: Importo
    gloss: l'importo
    note: مبلغ (mablagh) è una somma di denaro; كم المبلغ؟ (kam al-mablagh) chiede quanto c'è da pagare.
    example_gloss: Quanto è l'importo?
  ar.a1.unit24.lesson02.teach.can_pay:
    title: Posso pagare?
    gloss: Posso pagare con la carta?
    note: هل أستطيع (hal astaṭīʿ) significa «posso»; الدفع (ad-dafʿ) significa «il pagamento», «pagare».
    example_gloss: Posso pagare in contanti?
  ar.a1.unit24.lesson02.teach.line01:
    title: Chiedere l'importo
    gloss: Layla chiede l'importo.
    note: كم serve a chiedere «quanto».
    example_gloss: 'Layla ha detto: Quanto è l''importo?'
  ar.a1.unit24.lesson02.teach.line02:
    title: Dire l'importo
    gloss: Il venditore dice che l'importo è di dieci dirham.
    note: دراهم (darāhim) è la parola per la valuta che hai visto nell'unità sugli acquisti.
    example_gloss: 'Il venditore disse: L''importo è di dieci dirham.'
  ar.a1.unit24.lesson02.teach.line03:
    title: Chiedere di pagare con la carta
    gloss: Layla chiede se può pagare con la carta.
    note: Questa domanda riguarda un metodo di pagamento accettato.
    example_gloss: 'Layla disse: Posso pagare con la carta?'
  ar.a1.unit24.lesson02.teach.line04:
    title: Proporre i metodi di pagamento
    gloss: Il venditore dice che si può pagare con la carta o in contanti.
    note: أو (aw) significa «o».
    example_gloss: 'Il venditore disse: Sì, o in contanti.'
  ar.a1.unit24.lesson02.teach.line05:
    title: Scegliere il metodo di pagamento
    gloss: Layla dice che pagherà con la carta.
    note: Questa frase completa la scelta del pagamento.
    example_gloss: 'Layla disse: Pagherò con la carta.'
