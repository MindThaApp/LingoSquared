teaching:
  ar.a1.unit21.lesson01.teach.clothes:
    title: I vestiti
    gloss: vestiti
    note: ملابس (malābis) è un sostantivo plurale che significa «vestiti».
    example_gloss: Voglio dei vestiti.
  ar.a1.unit21.lesson01.teach.shirt:
    title: Camicia
    gloss: camicia
    note: 'قميص (qamīṣ) significa «camicia»; dopo أريد prende la desinenza dell''oggetto -an: قميصا (qamīṣan).'
    example_gloss: Voglio una camicia.
  ar.a1.unit21.lesson01.teach.blue:
    title: Blu
    gloss: blu
    note: 'أزرق (azraq) è la forma maschile, concordata con قميص; con un sostantivo femminile diventa زرقاء (zarqāʾ). Dopo أريد, أزرق non prende alif aggiuntivo: قميصا أزرق.'
    example_gloss: Voglio una camicia blu.
  ar.a1.unit21.lesson01.teach.blue_shirt:
    title: Una camicia blu
    gloss: una camicia blu
    note: 'In arabo il colore viene dopo l''oggetto: قميصا أزرق (qamīṣan azraq).'
    example_gloss: Voglio una camicia blu.
  ar.a1.unit21.lesson02.teach.size:
    title: Taglia
    gloss: la taglia
    note: مقاس (maqās) significa «taglia, misura»; ما المقاس؟ (mā l-maqās) chiede la taglia.
    example_gloss: Che taglia?
  ar.a1.unit21.lesson02.teach.medium:
    title: Taglia media
    gloss: taglia media
    note: 'متوسط (mutawassiṭ) significa «medio»; con بـ (bi-, «di», «in») si collega a un oggetto: قميصا بمقاس متوسط (qamīṣan bi-maqāsin mutawassiṭ), una camicia di taglia media.'
    example_gloss: Voglio una camicia di taglia media.
  ar.a1.unit21.lesson02.teach.price:
    title: Dieci dirham
    gloss: dieci dirham
    note: 'بعشرة (bi-ʿashara) significa «per dieci»: il prefisso بـ indica il prezzo, come nell''unità sugli acquisti.'
    example_gloss: La camicia costa dieci dirham.
  ar.a1.unit21.lesson02.teach.line01:
    title: Richiedere un articolo
    gloss: Layla chiede una camicia blu.
    note: من فضلك rende la richiesta cortese.
    example_gloss: 'Layla disse: Vorrei una camicia blu, per favore.'
  ar.a1.unit21.lesson02.teach.line02:
    title: Chiedere la taglia
    gloss: Il venditore chiede che taglia.
    note: 'Il venditore chiede la taglia: ما المقاس؟'
    example_gloss: 'Il venditore disse: Che taglia?'
  ar.a1.unit21.lesson02.teach.line03:
    title: Dire la taglia
    gloss: Layla dice taglia media.
    note: Questa è la risposta diretta alla domanda sulla taglia.
    example_gloss: 'Layla disse: Taglia media.'
  ar.a1.unit21.lesson02.teach.line04:
    title: Consegnare l'articolo e dire il prezzo
    gloss: Il venditore porge la camicia e dice il prezzo.
    note: تفضلي (tafaḍḍalī) si dice a una donna quando le si porge qualcosa; a un uomo si dice تفضل (tafaḍḍal).
    example_gloss: 'Il venditore disse: Prego, tenga. La camicia costa dieci dirham.'
