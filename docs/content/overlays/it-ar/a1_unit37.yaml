    gloss: Nour è nuova al caffè delle lingue. Chiede a Yusuf come sono gli altri. Yusuf glielo racconta. Layla è gentile e paziente; lavora come infermiera. Karim è divertente e frequenta un corso di spagnolo. Sara è curiosa; le piace imparare cose nuove. Yusuf, invece, è calmo.
