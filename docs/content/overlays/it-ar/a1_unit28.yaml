course:
  title: Arabo A1
  description: 'Arabo per principianti per parlare di sport e di attività fisica: i nomi degli sport più comuni, come dire quanto spesso li pratichi, i verbi أمارس (umāris) e ألعب (alʿab) e come proporre di fare sport insieme.'
