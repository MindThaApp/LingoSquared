    gloss: 'Karim: E a me piace correre.'
  ar.a1.unit28.lesson06.teach.lyla_idhn_nmars:
    title: Layla chiude la conversazione
    gloss: 'Layla: Allora questa settimana facciamo sport tutti e quattro insieme!'
    note: Chiude il cerchio tra le preferenze sportive dei quattro personaggi di questa unità.
