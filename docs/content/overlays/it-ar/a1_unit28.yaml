  ar.a1.unit28.lesson06.teach.nqtrh_shyia_maa:
    title: Proporre qualcosa insieme
    gloss: 'Per proporre qualcosa insieme, usa هل (hal) + un verbo alla forma «noi»: هل نتمشى؟ (hal natamashshā?) e هل نمارس الرياضة؟ (hal numāris ar-riyāḍa?).'
    note: Riprende esattamente la costruzione usata per proporre dei programmi nell'unità sui programmi.
  ar.a1.unit28.lesson06.teach.sara_nam_jmyl:
    title: Sara accetta
    gloss: 'Sara: Sì, bello! Amo il nuoto.'
  ar.a1.unit28.lesson06.teach.ywsf_afdl_lab:
