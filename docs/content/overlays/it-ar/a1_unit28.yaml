    title: Gioco a calcio
    gloss: Gioco a calcio.
    note: 'ألعب (alʿab) è il verbo per i giochi con la palla: ألعب كرة القدم (alʿab kurat al-qadam). Letteralmente, كرة القدم è «la palla del piede».'
  ar.a1.unit28.lesson01.teach.nqwl_amars_qbl:
    title: 'I verbi per lo sport: أمارس e ألعب'
    gloss: 'Per la maggior parte degli sport si usa أمارس (umāris, «pratico»): أمارس اليوغا (umāris al-yūghā), أمارس الركض (umāris ar-rakḍ), أمارس السباحة (umāris as-sibāḥa). Per i giochi con la palla si usa ألعب (alʿab, «gioco»): ألعب كرة القدم.'
    note: 'أمارس (umāris) vale per la maggior parte degli sport, ma i giochi con la palla vogliono ألعب (alʿab): impara quindi il verbo insieme allo sport.'
  ar.a1.unit28.lesson02.teach.mrat_fy_alasbwa:
    title: Volte a settimana
    gloss: volte a settimana
    example_gloss: Faccio yoga due volte a settimana.
  ar.a1.unit28.lesson02.teach.mrtyn_fy_alasbwa:
    title: Volte a settimana
    gloss: كثيرا (kathīran) e كل يوم (kull yawm) sono espressioni generiche; مرتين في الأسبوع (marratayn fī al-usbūʿ) dice esattamente quanto spesso. مرتين è il duale di مرة (marra, «volta»).
    note: Amplia il lessico della frequenza già introdotto nell'unità sugli hobby.
  ar.a1.unit28.lesson02.teach.amars_alywgha_mrtyn:
