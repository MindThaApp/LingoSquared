    gloss: 'Karim: Al parco, vicino a casa mia.'
  ar.a1.unit28.lesson04.teach.ytghyr_alfal_ma:
    title: Il verbo cambia con la persona
    gloss: 'Il verbo cambia a seconda della persona: أنا أركض (anā arkuḍ), كريم يركض (karīm yarkuḍ), أنت تركض (anta tarkuḍ).'
    note: 'La prima lettera del verbo indica chi compie l''azione: أ (a-) è «io», ي (ya-) è «lui» e ت (ta-) è «tu» o «lei».'
  ar.a1.unit28.lesson04.teach.ywsf_ma_ajml:
    title: Yusuf reagisce
    gloss: 'Yusuf: Che bello, io ci gioco spesso a calcio.'
  ar.a1.unit28.lesson05.teach.lyla_tmars_alywgha:
    title: Layla e Sara parlano di sport
    gloss: Layla fa yoga due volte a settimana. Le piace muoversi con calma. Sara non fa yoga, ma ama il nuoto. Sara nuota spesso, quasi ogni settimana. Che sport pratichi tu?
    note: ليلى تمارس اليوغا (laylā tumāris al-yūghā) e سارة تسبح (sāra tasbaḥ) usano verbi che iniziano con ت (ta-) perché entrambe sono donne. لا davanti a un verbo lo rende negativo.
    glosses:
      تمارس: fa
      مرتين: due volte
      الأسبوع: settimana
      اليوغا: yoga
      تحب: adora
      بهدوء: con calma
      تتحرك: muoversi
      السباحة: nuotare
      تسبح: nuota
      كثيرا: spesso
      تقريبا: quasi
      ما: quale
      الرياضة: sport
