    gloss: Yusuf gioca spesso a calcio.
    note: 'يلعب (yalʿab) significa «lui gioca»: la lettera iniziale ي (ya-) indica «lui». كثيرا (kathīran) significa «spesso».'
  ar.a1.unit28.lesson03.teach.amars_alryada_tany:
    title: Due modi di parlare di sport
    gloss: أمارس الرياضة (umāris ar-riyāḍa) parla di sport in generale, mentre أمارس اليوغا (umāris al-yūghā) nomina lo sport specifico. Entrambe sono corrette.
    note: رياضة (riyāḍa) è un nome femminile, e اليوغا (al-yūghā) è il nome di uno sport con ال attaccato.
  ar.a1.unit28.lesson03.teach.mmarsa_alryada:
