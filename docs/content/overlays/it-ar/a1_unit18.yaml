teaching:
  ar.a1.unit18.lesson01.teach.work:
    title: Il lavoro
    gloss: lavoro
    note: 'عمل (ʿamal) significa «lavoro». ما عملك؟ chiede qual è il lavoro di qualcuno; la desinenza ـك significa «tuo»: ʿamaluka a un uomo, ʿamaluki a una donna, scritto allo stesso modo.'
    example_gloss: Che lavoro fai?
  ar.a1.unit18.lesson01.teach.engineer:
    title: Ingegnere
    gloss: ingegnere
    note: مهندس (muhandis) è la forma maschile, usata per Yusuf; una donna dice أنا مهندسة (anā muhandisa).
    example_gloss: Sono ingegnere.
  ar.a1.unit18.lesson01.teach.office:
    title: Ufficio
    gloss: ufficio
    note: مكتب (maktab) significa «ufficio»; في مكتب significa «in un ufficio».
    example_gloss: Lavoro in un ufficio.
  ar.a1.unit18.lesson01.teach.workplace_sentence:
    title: Lavoro in un ufficio
    gloss: lavoro in un ufficio
    note: أعمل (aʿmal) significa «lavoro»; ha la stessa radice di عمل («lavoro») e la أ iniziale indica «io».
    example_gloss: 'Yusuf ha detto: «Lavoro in un ufficio».'
  ar.a1.unit18.lesson02.teach.write:
    title: Scrivo
    gloss: scrivo
    note: أكتب (aktub) significa «scrivo».
    example_gloss: Scrivo al lavoro.
  ar.a1.unit18.lesson02.teach.read:
    title: Leggo
    gloss: leggo
    note: أقرأ (aqraʾ) significa «leggo».
    example_gloss: Leggo al lavoro.
  ar.a1.unit18.lesson02.teach.at_work:
    title: Al lavoro
    gloss: al lavoro
    note: العمل (al-ʿamal) significa «il lavoro»; في العمل significa «al lavoro».
    example_gloss: Scrivo e leggo al lavoro.
  ar.a1.unit18.lesson02.teach.line01:
    title: Chiedere del lavoro
    gloss: Layla chiede a Yusuf che lavoro fa.
    note: يا يوسف si rivolge a Yusuf chiamandolo per nome.
    example_gloss: 'Layla ha detto: «Che lavoro fai, Yusuf?»'
  ar.a1.unit18.lesson02.teach.line02:
    title: Dire la professione
    gloss: Yusuf dice di essere ingegnere.
    note: Non serve una parola separata per «sono».
    example_gloss: 'Yusuf ha detto: «Sono ingegnere».'
  ar.a1.unit18.lesson02.teach.line03:
    title: Dire dove si lavora
    gloss: Yusuf dice che lavora in un ufficio.
    note: أعمل في indica il luogo di lavoro.
    example_gloss: 'Yusuf ha detto: «Lavoro in un ufficio».'
  ar.a1.unit18.lesson02.teach.line04:
    title: Chiedere dell'attività
    gloss: Layla chiede a Yusuf che cosa fa ogni giorno.
    note: 'Riprende la domanda sulla routine; تفعل si dice a un uomo. A una donna si dice: ماذا تفعلين كل يوم؟'
    example_gloss: 'Layla ha detto: Che cosa fai ogni giorno?'
  ar.a1.unit18.lesson02.teach.line05:
    title: Dire che cosa fai
    gloss: Yusuf dice che al lavoro scrive e legge.
    note: 'و (wa, «e») unisce le due attività e si scrive attaccata alla parola successiva: وأقرأ.'
    example_gloss: 'Yusuf ha detto: Al lavoro scrivo e leggo.'
