    title: Ogni giorno
    gloss: ogni giorno
    note: كل يوم (kull yawm) di solito viene dopo il verbo (أدرس كل يوم) ma può anche aprire la frase (كل يوم أدرس).
    example_gloss: Studio ogni giorno.
  ar.a1.unit11.lesson01.teach.wake:
    title: Mi sveglio
    gloss: mi sveglio
    note: أستيقظ (astayqiẓ) significa mi sveglio; la أ iniziale indica «io» nei verbi al presente. السابعة (as-sābiʿa) è sette nelle ore.
    example_gloss: Mi sveglio alle sette.
  ar.a1.unit11.lesson01.teach.study:
    title: Studio
    gloss: studio
    note: أدرس (adrus) significa studio; ha la stessa radice di درس (lezione). التاسعة (at-tāsiʿa) è nove nelle ore.
    example_gloss: Studio alle nove.
  ar.a1.unit11.lesson01.teach.sleep:
    title: Dormo
    gloss: dormo / vado a letto
    note: أنام (anām) significa dormo; con un orario significa vado a letto. العاشرة (al-ʿāshira) è dieci nelle ore.
    example_gloss: Dormo alle dieci.
  ar.a1.unit11.lesson02.teach.what_do:
    title: Che cosa fai ogni giorno?
    gloss: Che cosa fai ogni giorno?
    note: ماذا (mādhā) significa che cosa, e تفعل (tafʿal) significa fai, detto a un uomo; a una donna si dice تفعلين (tafʿalīn).
    example_gloss: 'Layla ha detto: Che cosa fai ogni giorno?'
  ar.a1.unit11.lesson02.teach.routine_sequence:
    title: Tre frasi sulla routine
    gloss: Mi sveglio alle sette. Studio alle nove. Vado a dormire alle dieci.
    note: Ogni frase è un verbo + في الساعة + l'ora; insieme descrivono un'intera giornata.
    example_gloss: Ogni giorno mi sveglio alle sette. Studio alle nove. Vado a dormire alle dieci.
  ar.a1.unit11.lesson02.teach.line01:
    title: Chiedere della routine
    gloss: Layla chiede a Yusuf che cosa fa ogni giorno.
    note: 'Layla dice تفعل perché si rivolge a un uomo; a una donna direbbe: ماذا تفعلين كل يوم؟'
    example_gloss: 'Layla ha detto: Che cosa fai ogni giorno?'
  ar.a1.unit11.lesson02.teach.line02:
    title: L'ora della sveglia
    gloss: Yusuf dice che si sveglia alle sette.
    note: Prima dell'ora si usa في الساعة.
    example_gloss: 'Yusuf ha detto: Mi sveglio alle sette.'
  ar.a1.unit11.lesson02.teach.line03:
    title: L'ora di studio
    gloss: Yusuf dice che studia alle nove.
    note: Lo stesso schema per l'ora funziona con أدرس.
    example_gloss: 'Yusuf ha detto: Studio alle nove.'
  ar.a1.unit11.lesson02.teach.line04:
    title: L'ora di dormire
    gloss: Yusuf dice che va a dormire alle dieci.
    note: L'ultima attività della sua giornata usa lo stesso schema per l'ora con أنام.
    example_gloss: 'Yusuf ha detto: Dormo alle dieci.'
