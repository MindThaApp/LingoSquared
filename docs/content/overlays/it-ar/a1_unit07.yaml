  ar.a1.unit07.lesson01.teach.bread:
    title: Pane
    gloss: pane
    note: خبز (khubz) significa «pane». Come complemento oggetto di un verbo come أريد o تريدين si scrive خبزا (khubzan).
    example_gloss: Voglio del pane.
  ar.a1.unit07.lesson01.teach.i_want:
    title: voglio
    gloss: voglio
    note: أريد (urīdu) è una formula di richiesta diretta ma corretta.
    example_gloss: Voglio dell'acqua.
  ar.a1.unit07.lesson01.teach.please:
    title: Per favore
    gloss: per favore
    note: من فضلك (min faḍlika; a una donna min faḍliki) rende più cortese una richiesta; può anche stare all'inizio.
    example_gloss: Vorrei dell'acqua, per favore.
  ar.a1.unit07.lesson02.teach.do_you_want:
    title: Vuole del pane?
    gloss: Vuole del pane?
    note: تريدين (turīdīna) significa «vuoi» detto a una donna, qui Layla; a un uomo si dice تريد (turīdu).
    example_gloss: 'Il cameriere ha detto: «Vuole del pane?»'
  ar.a1.unit07.lesson02.teach.one_bread:
    title: Un pezzo di pane
    gloss: un pezzo di pane
    note: قطعة خبز واحدة (qiṭʿat khubz wāḥida) dà al pane un'unità contabile; واحدة è femminile perché concorda con قطعة.
    example_gloss: Voglio un pezzo di pane.
  ar.a1.unit07.lesson02.teach.here_you_are:
    title: Ecco a Lei
    gloss: ecco a Lei
    note: تفضلي (tafaḍḍalī) si dice a una donna quando si porge qualcosa; a un uomo si dice تفضل (tafaḍḍal).
    example_gloss: 'Il cameriere ha detto: «Ecco a Lei.»'
  ar.a1.unit07.lesson02.teach.line01:
    title: Fare un ordine
    gloss: Layla ordina acqua e caffè in modo educato.
    note: La richiesta usa أريد più le cose ordinate.
    example_gloss: 'Layla ha detto: «Buongiorno. Vorrei acqua e caffè, per favore.»'
  ar.a1.unit07.lesson02.teach.line02:
    title: Fare un'altra domanda
    gloss: Il cameriere le chiede se vuole del pane.
    note: هل introduce una domanda a cui si risponde sì o no.
    example_gloss: 'Il cameriere ha detto: «Vuole del pane?»'
  ar.a1.unit07.lesson02.teach.line03:
    title: Rispondere alla domanda
    gloss: Layla dice di sì e chiede un pezzo di pane.
    note: نعم esprime la risposta affermativa.
    example_gloss: 'Layla ha detto: «Sì, voglio un pezzo di pane.»'
  ar.a1.unit07.lesson02.teach.line04:
    title: Servire l'ordine
    gloss: 'Il cameriere dice: «Ecco a Lei.»'
    note: تفضلي conclude lo scambio.
    example_gloss: 'Il cameriere ha detto: «Ecco a Lei.»'
