    title: Chi studia cosa?
    gloss: Karim non lavora soltanto, studia anche. Segue un corso di spagnolo al centro di educazione per adulti. Ogni settimana impara parole nuove. Sara segue un programma al college. Lì studia sanità. A entrambi piace studiare. Tu che cosa studi, o che cosa vorresti imparare?
    note: Confronta gli studi di Karim e di Sara, sul modello della lettura di confronto dell'unità sulla tecnologia.
