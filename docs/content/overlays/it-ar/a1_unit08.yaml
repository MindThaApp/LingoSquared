    note: سعر (siʿr) significa «prezzo».
    example_gloss: Quanto costano le mele?
  ar.a1.unit08.lesson01.teach.apple:
    title: Le mele
    gloss: mele
    note: تفاح (tuffāḥ) è un nome collettivo per «mele»; una mela è تفاحة (tuffāḥa).
    example_gloss: Le mele costano dieci dirham.
  ar.a1.unit08.lesson01.teach.dirhams:
    title: Dirham
    gloss: dirham
    note: دراهم (darāhim) è il plurale di درهم (dirham), la moneta del Marocco e degli Emirati; dopo i numeri da 3 a 10 si usa il plurale.
    example_gloss: Ho dieci dirham.
  ar.a1.unit08.lesson01.teach.how_much_price:
    title: Quanto costano le mele?
    gloss: Quanto costano le mele?
    note: كم سعر التفاح؟ (kam siʿr at-tuffāḥ) significa letteralmente «quanto è il prezzo delle mele?». Anche ما سعر التفاح؟ (qual è il prezzo) e بكم التفاح؟ (a quanto sono le mele) sono forme standard.
    example_gloss: 'Layla ha detto: Quanto costano le mele?'
  ar.a1.unit08.lesson01.teach.ten_dirhams:
    title: A dieci dirham
    gloss: a dieci dirham
    note: 'Il prefisso بـ (bi-) indica il prezzo: بعشرة (bi-ʿashara), «a dieci».'
    example_gloss: Le mele costano dieci dirham.
  ar.a1.unit08.lesson02.teach.two_apples:
    title: Due mele
    gloss: due mele
    note: تفاحتين (tuffāḥatayn) è il duale di تفاحة (una mela), nella forma del complemento oggetto usata dopo أريد.
    example_gloss: Due mele.
  ar.a1.unit08.lesson02.teach.want_two:
    title: Vorrei due mele
    gloss: Vorrei due mele
    note: Metti أريد prima dell'oggetto.
    example_gloss: Vorrei due mele.
  ar.a1.unit08.lesson02.teach.line01:
    title: Chiedere il prezzo
    gloss: Layla chiede il prezzo delle mele.
    note: È lo stesso schema della domanda sul prezzo.
    example_gloss: 'Layla ha detto: Quanto costano le mele?'
  ar.a1.unit08.lesson02.teach.line02:
    title: Dire il prezzo
    gloss: Il venditore dice che le mele costano dieci dirham.
    note: بعشرة unisce a عشرة il prefisso che indica il prezzo.
    example_gloss: 'Il venditore ha detto: Le mele costano dieci dirham.'
  ar.a1.unit08.lesson02.teach.line03:
    title: Chiedere una quantità
    gloss: Layla chiede due mele con gentilezza.
    note: من فضلك rende la richiesta cortese.
    example_gloss: 'Layla ha detto: Vorrei due mele, per favore.'
  ar.a1.unit08.lesson02.teach.line04:
    title: Porgere la merce
    gloss: Il venditore dice «ecco a te».
    note: 'تفضلي è stato introdotto nell''unità sul cibo; si dice a una donna (a un uomo: تفضل).'
    example_gloss: 'Il venditore ha detto: Ecco a te.'
