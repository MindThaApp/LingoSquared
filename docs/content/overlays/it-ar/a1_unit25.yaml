teaching:
  ar.a1.unit25.lesson01.teach.alqraaa_mmarsa_alryada:
    title: Leggere, fare sport, cucinare
    gloss: leggere, fare sport, cucinare
    note: القراءة (al-qirāʾa) è «la lettura», ممارسة الرياضة (mumārasat ar-riyāḍa) è «praticare sport» e الطبخ (aṭ-ṭabkh) è «il cucinare». Sono tutti nomi, quindi hanno l'articolo ال attaccato.
    example_gloss:
    - Mi piace leggere un libro.
    - Faccio sport il sabato.
    - Mi piace cucinare per gli amici.
  ar.a1.unit25.lesson01.teach.wqt_alfragh:
    title: Tempo libero
    gloss: tempo libero
    note: وقت الفراغ (waqt al-farāgh) significa alla lettera «il tempo dello spazio libero». La prima parola non ha ال; solo la seconda lo prende.
    example_gloss: Nel mio tempo libero mi piace leggere.
  ar.a1.unit25.lesson01.teach.fy_wqt_fraghy:
    title: Dire che cosa fai nel tempo libero
    gloss: Nel mio tempo libero mi piace leggere.
    note: أحب (uḥibb) significa «mi piace» o «amo» e vale sia per un uomo sia per una donna. La ي alla fine di فراغي (farāghī) significa «mio».
  ar.a1.unit25.lesson02.teach.alastmaa_ila_almwsyqa:
    title: Musica, disegno, videogiochi
    gloss: ascoltare musica, disegnare, giocare ai videogiochi
    note: الاستماع إلى الموسيقى (al-istimāʿ ilā al-mūsīqā) è «ascoltare musica», الرسم (ar-rasm) è «il disegno» e لعب ألعاب الفيديو (laʿb alʿāb al-fīdiyū) è «giocare ai videogiochi».
    example_gloss:
    - Mi piace ascoltare musica.
    - Disegno spesso.
    - Mi piace giocare ai videogiochi con gli amici.
  ar.a1.unit25.lesson02.teach.ahb_alastmaa_ila:
    title: Dire che ti piace ascoltare musica
    gloss: Mi piace ascoltare musica.
    note: 'الاستماع (al-istimāʿ) vuole إلى (ilā, «a») prima di ciò che si ascolta: الاستماع إلى الموسيقى.'
  ar.a1.unit25.lesson02.teach.ahb_lab_alaab:
    title: Dire che ti piace giocare ai videogiochi con gli amici
    gloss: Mi piace giocare ai videogiochi con gli amici.
    note: 'مع (maʿa) significa «con»: مع الأصدقاء (maʿa al-aṣdiqāʾ). L''articolo ال resta attaccato a الأصدقاء.'
  ar.a1.unit25.lesson03.teach.daima_kthyra_ahyana:
    title: Sempre, spesso, a volte, mai
    gloss: sempre, spesso, a volte, mai
    note: دائما (dāʾiman), كثيرا (kathīran), أحيانا (aḥyānan) e أبدا (abadan) sono avverbi, quindi non cambiano mai per genere. La ا (alif) finale si scrive senza segni.
    example_gloss:
    - Faccio sempre sport il sabato.
    - Leggo spesso un libro.
    - A volte disegno.
    - Non gioco mai ai videogiochi.
  ar.a1.unit25.lesson03.teach.kl_asbwa_kl:
    title: Ogni settimana, ogni fine settimana
    gloss: ogni settimana, ogni fine settimana
    note: كل أسبوع (kull usbūʿ) e كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ) usano entrambi كل (kull, «ogni»); vedi la scheda successiva.
    example_gloss:
    - Cucino per gli amici ogni settimana.
    - Faccio sport ogni fine settimana.
  ar.a1.unit25.lesson03.teach.bad_kl_yaty:
    title: 'Ogni: كل'
    gloss: 'Dopo كل (kull, «ogni») il nome è singolare e senza ال: كل أسبوع (kull usbūʿ), كل عطلة نهاية أسبوع (kull ʿuṭlat nihāyat usbūʿ).'
    note: 'كل (kull) non cambia mai: si usa la stessa parola davanti a un nome maschile come أسبوع e a uno femminile come عطلة.'
  ar.a1.unit25.lesson03.teach.madha_tfal_fy:
    title: Chiedere del tempo libero
    gloss: Che cosa fai nel tempo libero?
    note: 'Questa è la domanda chiave dell''unità: usala per chiedere a chiunque dei suoi hobby.'
  ar.a1.unit25.lesson04.teach.lyla_ntmsha_maa:
    title: Layla introduce il tema degli hobby
    gloss: 'Layla: Facciamo spesso passeggiate insieme. Ma che altro fai nel tempo libero, Yusuf?'
    note: La lettera iniziale ن (na-) di نتمشى (natamashshā) significa «noi», quindi in arabo non serve una parola separata per «noi». معا (maʿan) significa «insieme».
  ar.a1.unit25.lesson04.teach.ywsf_ahb_altbkh:
    title: Gli hobby di Yusuf
    gloss: 'Yusuf: Mi piace cucinare, anche a casa. E faccio spesso sport.'
    note: في البيت أيضا (fī al-bayt ayḍan) aggiunge «anche a casa». وأمارس (wa-umāris) unisce و («e») al verbo e si scrive come una sola parola.
  ar.a1.unit25.lesson04.teach.lyla_hl_ttbkh:
    title: Layla è sorpresa
    gloss: 'Layla: Cucini anche a casa? Ma se cucini già tutto il giorno al lavoro!'
    note: تطبخ (taṭbukh) è il verbo alla seconda persona («tu») per un uomo; a una donna si dice تطبخين (taṭbukhīn). طوال اليوم (ṭawāl al-yawm) significa «tutto il giorno».
  ar.a1.unit25.lesson04.teach.ywsf_nam_lknny:
    title: Yusuf spiega
    gloss: 'Yusuf: Sì, ma trovo rilassante cucinare. E tu, che cosa ti piace fare?'
    note: 'أجد (ajid) significa «trovo» e مريحا (murīḥan) «rilassante». وأنت (wa-anta) unisce و a أنت: «e tu».'
  ar.a1.unit25.lesson04.teach.lyla_ahb_alqraaa:
    title: Gli hobby di Layla
    gloss: 'Layla: Mi piace leggere e ascolto spesso musica.'
    note: 'و unisce i due hobby: أحب القراءة (uḥibb al-qirāʾa) e وأستمع (wa-astamiʿ, «e ascolto»). Si scrive attaccata alla parola successiva.'
  ar.a1.unit25.lesson04.teach.ywsf_hl_tlabyn:
    title: Yusuf chiede dei videogiochi
    gloss: 'Yusuf: Giochi anche ai videogiochi?'
    note: تلعبين (talʿabīn) è il verbo alla seconda persona («tu») per una donna, perché Yusuf sta parlando con Layla; per un uomo è تلعب (talʿab). هل (hal) introduce una domanda da sì o no.
  ar.a1.unit25.lesson04.teach.lyla_la_la:
    title: La risposta di Layla
    gloss: 'Layla: No, non gioco mai ai videogiochi. Però a volte disegno!'
    note: 'أبدا (abadan) significa «mai» e أحيانا (aḥyānan) «a volte». Il verbo si nega con لا (lā): لا ألعب (lā alʿab) significa «non gioco».'
  ar.a1.unit25.lesson05.teach.ana_wywsf_ntmsha:
    title: Confronto tra hobby
    gloss: Io e Yusuf facciamo spesso passeggiate insieme. Ma abbiamo anche altri hobby. A Yusuf piace cucinare, anche a casa, e fa spesso sport. A me piace leggere e ascolto spesso musica. A volte disegno, ma non gioco mai ai videogiochi. E a te, che cosa piace fare nel tempo libero?
    note: Il messaggio di Layla riprende quanto detto nella lezione 4 e finisce ponendo a chi legge la domanda centrale dell'unità.
    glosses:
      نتمشى: passeggiamo
      كثيرا: spesso
      معا: insieme
      أخرى: altri
      يطبخ: cucina
      يحب: piace
      البيت: la casa (a casa)
      ويمارس: fa sport
      أقرأ: leggere
      وأستمع: ascolto
      الموسيقى: musica
      أرسم: disegno
      أحيانا: a volte
      ألعب: giocare (ai videogiochi)
      أبدا: mai
      فراغك: il tuo (tempo) libero
      وقت: tempo
  ar.a1.unit25.lesson06.teach.ywsf_madha_stfalyn:
    title: Yusuf chiede del weekend
    gloss: 'Yusuf: Che fai questo weekend?'
    note: 'ستفعلين (sa-tafʿalīn) è al futuro: la lettera iniziale س (sa-) lo indica, e la terminazione ين è per una donna. عطلة نهاية الأسبوع (ʿuṭlat nihāyat al-usbūʿ) è il weekend.'
  ar.a1.unit25.lesson06.teach.lyla_la_aarf:
    title: Layla è indecisa
    gloss: 'Layla: Non lo so ancora. Mi piace leggere, ma voglio anche uscire.'
    note: لا أعرف بعد (lā aʿrif baʿd) significa non lo so ancora. أن أخرج (an akhruj) significa uscire.
  ar.a1.unit25.lesson06.teach.ywsf_hl_ntmsha:
    title: Yusuf propone un programma
    gloss: 'Yusuf: Facciamo una passeggiata insieme? Dopo cucino io per noi.'
    note: 'هل نتمشى (hal natamashshā) è il modo abituale per proporre qualcosa insieme: هل + un verbo alla forma «noi». لنا (lanā) è ل (per) + نا (noi), scritto come una sola parola.'
  ar.a1.unit25.lesson06.teach.lyla_fkra_jyda:
    title: Layla accetta
    gloss: 'Layla: Bella idea! Mi piacciono sia camminare sia cucinare.'
    note: 'كليهما (kilayhimā) significa entrambi e va alla fine, riferito alle due cose: المشي والطبخ (al-mashy wa-aṭ-ṭabkh).'
  ar.a1.unit25.lesson06.teach.ywsf_mmtaz_idhn:
    title: Yusuf conferma
    gloss: 'Yusuf: Perfetto. Allora ci vediamo sabato!'
    note: يوم السبت (yawm as-sabt) significa sabato. La ل di ال non si pronuncia davanti a س, una lettera solare, per questo scriviamo as-sabt.
