course:
  title: Arabo A1
  description: 'Arabo per principianti per parlare delle attività del tempo libero: vocabolario degli hobby, espressioni di frequenza, come chiedere e rispondere a cosa si fa nel tempo libero e come confrontare gli hobby di due persone.'
