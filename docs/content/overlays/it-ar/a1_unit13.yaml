teaching:
  ar.a1.unit13.lesson01.teach.yesterday:
    title: Ieri
    gloss: ieri
    note: أمس (ams) significa «ieri». Si usa con un verbo al passato come ذهبت e può stare alla fine o all'inizio della frase.
    example_gloss: Ieri sono andato al mercato.
  ar.a1.unit13.lesson01.teach.went:
    title: sono andato
    gloss: sono andato
    note: 'ذهبت (dhahabtu) significa «sono andato/a»: la desinenza del passato -tu indica «io». Senza vocali brevi le stesse lettere possono leggersi anche dhahabta / dhahabti («sei andato» / «sei andata») o dhahabat («è andata»); lo capisci dal contesto.'
    example_gloss: Sono andato al mercato.
  ar.a1.unit13.lesson01.teach.bought:
    title: ho comprato
    gloss: ho comprato
    note: اشتريت (ishtaraytu) significa «ho comprato»; come ذهبت, termina in -tu per «io».
    example_gloss: Ho comprato delle mele.
  ar.a1.unit13.lesson01.teach.apples_object:
    title: Mele
    gloss: mele
    note: تفاحا (tuffāḥan) è تفاح («mele», dall'unità sugli acquisti) come complemento oggetto del verbo; la ا in più scrive la desinenza -an.
    example_gloss: Ho comprato delle mele.
  ar.a1.unit13.lesson02.teach.what_did:
    title: Che cosa hai fatto ieri?
    gloss: Che cosa ha fatto ieri?
    note: 'ماذا (mādhā) significa «che cosa»; فعلت qui significa «hai fatto»: faʿalta a un uomo, faʿalti a una donna (si scrive allo stesso modo). Yusuf si rivolge a Layla, quindi dice faʿalti.'
    example_gloss: 'Yusuf disse: Che cosa hai fatto ieri?'
  ar.a1.unit13.lesson02.teach.drank:
    title: ho bevuto
    gloss: ho bevuto
    note: شربت (sharibtu) significa «ho bevuto»; ha la stessa desinenza -tu («io») di ذهبت e اشتريت.
    example_gloss: Ho bevuto un caffè.
  ar.a1.unit13.lesson02.teach.event_sequence:
    title: Sequenza di un fatto recente
    gloss: Sono andato al mercato. Ho comprato delle mele. Ho bevuto un caffè.
    note: Alcune brevi frasi al passato di seguito raccontano ciò che hai fatto. Ogni verbo termina in -tu per «io».
    example_gloss: Ieri sono andato al mercato. Ho comprato delle mele. Ho bevuto un caffè.
  ar.a1.unit13.lesson02.teach.line01:
    title: Chiedere di ieri
    gloss: Yusuf chiede a Layla che cosa ha fatto ieri.
    note: Yusuf si rivolge a Layla, una donna, quindi qui فعلت si legge faʿalti; a un uomo si dice faʿalta.
    example_gloss: 'Yusuf disse: Che cosa hai fatto ieri?'
  ar.a1.unit13.lesson02.teach.line02:
    title: Andata al mercato
    gloss: Layla dice di essere andata al mercato.
    note: ذهبت indica un movimento concluso.
    example_gloss: 'Layla disse: Sono andata al mercato.'
  ar.a1.unit13.lesson02.teach.line03:
    title: Comprate delle mele
    gloss: Layla dice di aver comprato delle mele.
    note: Questo aggiunge una seconda azione conclusa.
    example_gloss: 'Layla disse: Ho comprato delle mele.'
  ar.a1.unit13.lesson02.teach.line04:
    title: Bevuto un caffè
    gloss: Layla dice di aver bevuto un caffè.
    note: Questo completa il breve racconto.
    example_gloss: 'Layla disse: Ho bevuto un caffè.'
