teaching:
  ar.a1.unit15.lesson01.teach.than:
    title: Di / che (nel confronto)
    gloss: di / che (nel confronto)
    note: من (min) è la stessa parola che significa «da» (أنا من لبنان); dopo un comparativo significa «di» o «che» nel confronto.
    example_gloss: Il mercato è più grande del caffè.
  ar.a1.unit15.lesson01.teach.bigger:
    title: Più grande
    gloss: più grande
    note: أكبر (akbar) deriva da كبير (kabīr, grande). I comparativi come أكبر, أصغر, أقرب e أرخص iniziano tutti con أ e hanno la stessa forma per i nomi maschili e femminili.
    example_gloss: Il mercato è più grande del caffè.
  ar.a1.unit15.lesson01.teach.smaller:
    title: Più piccolo
    gloss: più piccolo
    note: أصغر (aṣghar), «più piccolo», ha lo stesso schema con أ di أكبر.
    example_gloss: Il caffè è più piccolo del mercato.
  ar.a1.unit15.lesson01.teach.nearer:
    title: Più vicino
    gloss: più vicino
    note: 'أقرب (aqrab) confronta le distanze: più vicino.'
    example_gloss: Il caffè è più vicino del mercato.
  ar.a1.unit15.lesson01.teach.bigger_sentence:
    title: Il mercato è più grande
    gloss: Il mercato è più grande del caffè
    note: In questo confronto l'arabo non ha bisogno di una parola per «è».
    example_gloss: 'Yusuf ha detto: Il mercato è più grande del caffè.'
  ar.a1.unit15.lesson02.teach.nearer:
    title: Più vicino
    gloss: più vicino
    note: 'أقرب (aqrab) confronta le distanze: più vicino.'
    example_gloss: Il caffè è più vicino del mercato.
  ar.a1.unit15.lesson02.teach.cheaper:
    title: Più economico
    gloss: più economico
    note: 'أرخص (arkhaṣ) confronta i prezzi: più economico.'
    example_gloss: L'acqua costa meno del caffè.
  ar.a1.unit15.lesson02.teach.nearer_sentence:
    title: Il caffè è più vicino
    gloss: Il caffè è più vicino del mercato
    note: Mantieni من davanti al secondo termine.
    example_gloss: 'Yusuf ha detto: Il caffè è più vicino del mercato.'
  ar.a1.unit15.lesson02.teach.line01:
    title: Chiedere una preferenza
    gloss: Layla chiede a Yusuf che cosa preferisce.
    note: 'Layla dice تفضل (tufaḍḍil) perché si rivolge a un uomo; a una donna direbbe: ماذا تفضلين؟'
    example_gloss: 'Layla ha detto: Che cosa preferisci?'
  ar.a1.unit15.lesson02.teach.line02:
    title: Preferire il caffè
    gloss: Yusuf dice che preferisce il caffè.
    note: أفضل può essere seguito da un luogo come opzione preferita.
    example_gloss: 'Yusuf ha detto: Preferisco il caffè.'
  ar.a1.unit15.lesson02.teach.line03:
    title: Confrontare la distanza
    gloss: Yusuf dice che il caffè è più vicino del mercato.
    note: أقرب من dà la motivazione.
    example_gloss: 'Yusuf ha detto: Il caffè è più vicino del mercato.'
  ar.a1.unit15.lesson02.teach.line04:
    title: Confrontare la dimensione
    gloss: Nour aggiunge che il mercato è più grande del caffè.
    note: 'والسوق (was-sūq) è و («e») unita a السوق: «e il mercato».'
    example_gloss: 'Nour ha detto: E il mercato è più grande del caffè.'
