teaching:
  ar.a1.unit22.lesson01.teach.feeling:
    title: Sentimento
    gloss: sensazione
    note: شعور (shuʿūr) significa «sensazione» o «sentimento».
    example_gloss: Questa è una sensazione.
  ar.a1.unit22.lesson01.teach.happy:
    title: Contento
    gloss: felice
    note: سعيد (saʿīd) si riferisce a un uomo; una donna dice أنا سعيدة (anā saʿīda).
    example_gloss: Sono contento.
  ar.a1.unit22.lesson01.teach.sad:
    title: Triste
    gloss: triste
    note: حزين (ḥazīn) si riferisce a un uomo; una donna dice أنا حزينة (anā ḥazīna).
    example_gloss: Sono triste.
  ar.a1.unit22.lesson01.teach.because:
    title: Perché
    gloss: perché
    note: لأن (li-anna) introduce una causa.
    example_gloss: Sono felice perché c'è il sole.
  ar.a1.unit22.lesson02.teach.how_feel:
    title: Come ti senti?
    gloss: Come ti senti?
    note: 'كيف تشعر؟ (kayfa tashʿur) si chiede a un uomo come si sente; a una donna si dice: كيف تشعرين؟ (kayfa tashʿurīn).'
    example_gloss: Come ti senti, Yusuf?
  ar.a1.unit22.lesson02.teach.tired:
    title: Stanco
    gloss: stanco
    note: متعب (mutʿab) si riferisce a un uomo; متعبة (mutʿaba) si riferisce a una donna, perciò Layla dice أنا متعبة.
    example_gloss: Sono stanco.
  ar.a1.unit22.lesson02.teach.okay:
    title: Bene
    gloss: bene
    note: بخير (bi-khayr) significa «bene», alla lettera «in buona (salute)».
    example_gloss: Stai bene?
  ar.a1.unit22.lesson02.teach.line01:
    title: Chiedere come ci si sente
    gloss: Layla chiede a Yusuf come si sente.
    note: يا (yā) si mette davanti al nome della persona a cui ci si rivolge.
    example_gloss: 'Layla disse: Come ti senti, Yusuf?'
  ar.a1.unit22.lesson02.teach.line02:
    title: Stato d'animo e causa
    gloss: Yusuf dice che è felice perché c'è il sole.
    note: Questa frase esprime sia lo stato d'animo sia la causa.
    example_gloss: 'Yusuf disse: Sono felice perché c''è il sole.'
  ar.a1.unit22.lesson02.teach.line03:
    title: Un altro stato d'animo
    gloss: Layla dice che è stanca perché ha da lavorare.
    note: متعبة concorda con Layla, che è una donna.
    example_gloss: 'Layla disse: Sono stanca perché ho da lavorare.'
  ar.a1.unit22.lesson02.teach.line04:
    title: Controllare se va bene
    gloss: Yusuf chiede a Layla se sta bene.
    note: 'هل (hal) introduce una domanda a cui si risponde sì o no. Yusuf si rivolge a Layla, perciò أنت si legge anti (a un uomo: anta).'
    example_gloss: 'Yusuf disse: Stai bene?'
  ar.a1.unit22.lesson02.teach.line05:
    title: Rispondere di sì
    gloss: Layla dice di sì e lo ringrazia.
    note: نعم è la risposta «sì».
    example_gloss: 'Layla disse: Sì, grazie.'
