teaching:
  ar.a1.unit03.lesson01.teach.waahid:
    title: Uno
    gloss: uno
    note: واحد (wāḥid) si usa anche da solo, senza nome, per rispondere a «quanti?».
    example_gloss: Ho un libro.
  ar.a1.unit03.lesson01.teach.ithnaan:
    title: Due
    gloss: due
    note: اثنان (ithnān) è la forma indipendente di citazione del numero due.
    example_gloss: Ho due fratelli.
  ar.a1.unit03.lesson01.teach.thalaatha:
    title: Tre
    gloss: tre
    note: ثلاثة (thalātha) è la forma indipendente di citazione del numero tre.
    example_gloss: Uno, due, tre.
  ar.a1.unit03.lesson01.teach.arbaa:
    title: Quattro
    gloss: quattro
    note: أربعة (arbaʿa) è la forma indipendente di citazione del numero quattro.
    example_gloss: Ho quattro libri.
  ar.a1.unit03.lesson01.teach.khamsa:
    title: Cinque
    gloss: cinque
    note: خمسة (khamsa) è la forma indipendente di citazione del numero cinque.
    example_gloss: Ho cinque libri.
  ar.a1.unit03.lesson02.teach.sitta:
    title: Sei
    gloss: sei
    note: ستة (sitta) è la forma indipendente di citazione del numero sei.
    example_gloss: Ho sei libri.
  ar.a1.unit03.lesson02.teach.sabaa:
    title: Sette
    gloss: sette
    note: سبعة (sabʿa) è la forma indipendente di citazione del numero sette.
    example_gloss: Ho sette libri.
  ar.a1.unit03.lesson02.teach.thamaaniya:
    title: Otto
    gloss: otto
    note: ثمانية (thamāniya) è la forma indipendente di citazione del numero otto.
    example_gloss: Ho otto libri.
  ar.a1.unit03.lesson02.teach.tisaa:
    title: Nove
    gloss: nove
    note: تسعة (tisʿa) è la forma indipendente di citazione del numero nove.
    example_gloss: Ho nove dirham.
  ar.a1.unit03.lesson02.teach.ashara:
    title: Dieci
    gloss: dieci
    note: عشرة (ʿashara) è la forma indipendente di citazione del numero dieci.
    example_gloss: Ho dieci dinari.
  ar.a1.unit03.lesson03.teach.kam:
    title: Quanto costa questo?
    gloss: Quanto costa questo?
    note: كم هذا؟ (kam hādhā) è un modo semplice per chiedere un prezzo; anche بكم هذا؟ (bi-kam hādhā, «per quanto questo?») è molto comune.
  ar.a1.unit03.lesson03.teach.raqam:
    title: Numero
    gloss: numero
    note: رقم (raqam) è la parola generica per «numero», ad esempio un numero di telefono.
    example_gloss: Il mio numero è uno.
  ar.a1.unit03.lesson03.teach.dialogue_line01:
    title: Chiedere il prezzo
    gloss: Yusuf chiede quanto costa qualcosa.
    note: كم هذا؟ apre lo scambio.
  ar.a1.unit03.lesson03.teach.dialogue_line02:
    title: Dire il prezzo
    gloss: Layla dice che costa cinque.
    note: بخمسة unisce la preposizione بـ («a», «per») direttamente al numero.
  ar.a1.unit03.lesson03.teach.dialogue_line03:
    title: Chiedere di un altro articolo
    gloss: Yusuf indica un'altra cosa.
    note: وهذا؟ abbrevia la domanda riprendendo il contesto precedente.
  ar.a1.unit03.lesson03.teach.dialogue_line04:
    title: Dire il secondo prezzo
    gloss: Layla dice che costa dieci.
    note: بعشرة segue lo stesso schema di بخمسة.
  ar.a1.unit03.lesson03.teach.dialogue_line05:
    title: Ringraziare
    gloss: Yusuf la ringrazia.
    note: شكرا, già vista nell'unità sui saluti, chiude lo scambio.
