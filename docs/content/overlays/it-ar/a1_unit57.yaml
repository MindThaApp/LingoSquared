    feedback: 'Yusuf dice: ممتعة جدا! الأفعوانية كانت مثيرة (mumtiʿa jiddan! al-afʿawāniyya kānat muthīra). Il verbo كانت e l''aggettivo مثيرة sono femminili per concordare con الأفعوانية.'
