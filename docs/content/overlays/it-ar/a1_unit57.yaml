    feedback: 'Nour dice: نريد تذكرتين لمدينة الملاهي من فضلك (nurīdu tadhkaratayn li-madīnat al-malāhī min faḍlik). ل (li, «per») si scrive attaccata alla parola seguente: لمدينة. من فضلك (min faḍlik) significa «per favore».'
