  ar.a1.unit57.lesson05.exercise01.listen_nryd_tdhkrtyn_lmdyna:
    instruction: Ascolta il dialogo e scegli che cosa dice Nour.
    correct_option: Vorremmo comprare due biglietti per il parco divertimenti.
    distractors:
    - Vorremmo salire sulle montagne russe.
    - Vorremmo un solo biglietto.
    - Dov'è l'ingresso?
    accepted_answers:
    - value: Vorremmo comprare due biglietti per il parco divertimenti.
      status: correct
    feedback: 'Nour dice: نريد تذكرتين لمدينة الملاهي من فضلك (nurīdu tadhkaratayn li-madīnat al-malāhī min faḍlik). تذكرتين (tadhkaratayn) è il duale, «due biglietti»: l''arabo non ha bisogno di una parola separata per «due».'
  ar.a1.unit57.lesson05.exercise02.comprehend_almblgh_arbawn_drhma:
    instruction: Ascolta il dialogo e scegli quanto costano due biglietti.
    correct_option: Quaranta dirham.
    distractors:
    - Venti dirham.
    - Sessanta dirham.
    - Non lo dice.
    accepted_answers:
    - value: Quaranta dirham.
      status: correct
    feedback: 'L''addetto dice: بالطبع. المبلغ أربعون درهما (bi-ṭ-ṭabʿ. al-mablagh arbaʿūn dirhaman). أربعون (arbaʿūn) significa «quaranta» e il sostantivo che segue è al singolare: درهما.'
    prompt_blocks:
    - Quanto costano due biglietti?
  ar.a1.unit57.lesson05.exercise03.comprehend_hl_tabwr_alafawanya:
    instruction: Ascolta il dialogo e scegli che cosa chiede Yusuf.
    correct_option: La coda per le montagne russe è lunga?
    distractors:
    - A che ora chiude il parco?
    - Dov'è la biglietteria?
    - Non chiede niente.
    accepted_answers:
    - value: La coda per le montagne russe è lunga?
      status: correct
    feedback: 'Yusuf dice: هل طابور الأفعوانية طويل؟ (hal ṭābūr al-afʿawāniyya ṭawīl). هل (hal) trasforma una frase in una domanda a cui si risponde sì o no, e in arabo non serve una parola per «è».'
    prompt_blocks:
    - Che cosa chiede Yusuf?
  ar.a1.unit57.lesson05.exercise04.comprehend_nam_qlyla_alajla:
    instruction: Ascolta il dialogo e scegli la risposta sulla coda e sulla ruota panoramica.
    correct_option: Sì, un po'. La ruota panoramica non ha coda.
    distractors:
    - No, la coda è corta.
    - Le montagne russe sono chiuse.
    - Non lo dice.
    accepted_answers:
    - value: Sì, un po'. La ruota panoramica non ha coda.
      status: correct
    feedback: 'L''addetto dice: نعم، قليلا. العجلة الدوارة ليس فيها طابور (naʿam, qalīlan. al-ʿajala ad-dawwāra laysa fīhā ṭābūr). ليس فيها (laysa fīhā) significa «non c''è in essa», quindi la ruota panoramica non ha fila.'
    prompt_blocks:
    - La coda è lunga? E la ruota panoramica ha la coda?
  ar.a1.unit57.lesson05.exercise05.order_nryd_tdhkrtyn_lmdyna:
