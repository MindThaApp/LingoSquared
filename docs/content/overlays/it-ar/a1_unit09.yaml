teaching:
  ar.a1.unit09.lesson01.teach.place:
    title: Luogo
    gloss: luogo
    note: مكان (makān) è la parola generica per «luogo». هذا («questo») l'hai imparato con i numeri.
    example_gloss: Questo è un luogo.
  ar.a1.unit09.lesson01.teach.library:
    title: Biblioteca
    gloss: biblioteca
    note: مكتبة (maktaba) può significare «biblioteca» o «libreria»; qui è una biblioteca. المكتبة (al-maktaba) è «la biblioteca».
    example_gloss: La biblioteca è qui.
  ar.a1.unit09.lesson01.teach.market:
    title: Mercato
    gloss: mercato
    note: سوق (sūq) significa «mercato»; السوق (as-sūq) è «il mercato».
    example_gloss: Il mercato è qui.
  ar.a1.unit09.lesson01.teach.cafe:
    title: Caffè
    gloss: caffè (locale)
    note: مقهى (maqhā) significa «caffè» come locale; è legato a قهوة («caffè», la bevanda). المقهى (al-maqhā) è «il caffè».
    example_gloss: Il caffè è qui.
  ar.a1.unit09.lesson01.teach.here:
    title: Qui
    gloss: qui
    note: 'هنا (hunā) di solito viene dopo il luogo: المقهى هنا, «il caffè è qui». In questa frase l''arabo non ha bisogno di un verbo «essere».'
    example_gloss: Il caffè è qui.
  ar.a1.unit09.lesson02.teach.where_library:
    title: Dov'è la biblioteca?
    gloss: Dov'è la biblioteca?
    note: أين (ayna) significa «dove»; l'hai già incontrato in من أين أنت؟ («di dove sei?»).
    example_gloss: 'Yusuf ha detto: «Dov''è la biblioteca?»'
  ar.a1.unit09.lesson02.teach.near:
    title: Vicino
    gloss: vicino a
    note: 'قرب (qurba) significa «vicino» e precede il luogo a cui si riferisce: قرب المكتبة, «vicino alla biblioteca». بالقرب من (bi-l-qurbi min) ha lo stesso significato.'
    example_gloss: Il caffè è vicino alla biblioteca.
  ar.a1.unit09.lesson02.teach.library_near_market:
    title: La biblioteca è vicino al mercato
    gloss: La biblioteca è vicino al mercato
    note: In arabo qui non serve una parola separata per «è».
    example_gloss: 'Layla ha detto: «La biblioteca è vicino al mercato.»'
  ar.a1.unit09.lesson02.teach.line01:
    title: Chiedere dov'è
    gloss: Yusuf chiede dov'è la biblioteca.
    note: أين introduce la domanda sul luogo.
    example_gloss: 'Yusuf ha detto: «Dov''è la biblioteca?»'
  ar.a1.unit09.lesson02.teach.line02:
    title: Indicare dov'è la biblioteca
    gloss: Layla dice che la biblioteca è qui vicino al mercato.
    note: 'هنا e قرب possono comparire insieme: «qui, vicino al mercato».'
    example_gloss: 'Layla ha detto: «La biblioteca è qui vicino al mercato.»'
  ar.a1.unit09.lesson02.teach.line03:
    title: Chiedere del caffè
    gloss: Yusuf chiede dov'è il caffè.
    note: 'و (wa, «e») si scrive attaccata alla parola seguente: وأين (wa-ayna), «e dove».'
    example_gloss: 'Yusuf ha detto: «E dov''è il caffè?»'
  ar.a1.unit09.lesson02.teach.line04:
    title: Indicare dov'è il caffè
    gloss: Layla dice che il caffè è vicino alla biblioteca.
    note: 'Luogo + قرب + secondo luogo: المقهى قرب المكتبة, «il caffè è vicino alla biblioteca».'
    example_gloss: 'Layla ha detto: «Il caffè è vicino alla biblioteca.»'
