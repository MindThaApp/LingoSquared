teaching:
  ar.a1.unit10.lesson01.teach.right:
    title: Destra
    gloss: destra (direzione)
    note: يمين (yamīn) indica il lato destro; اليمين (al-yamīn) è «la destra».
    example_gloss: A destra.
  ar.a1.unit10.lesson01.teach.left:
    title: Sinistra
    gloss: sinistra (direzione)
    note: يسار (yasār) indica il lato sinistro; اليسار (al-yasār) è «la sinistra».
    example_gloss: A sinistra.
  ar.a1.unit10.lesson01.teach.forward:
    title: Dritto
    gloss: dritto
    note: إلى الأمام (ilā l-amām) significa letteralmente «verso il davanti»; è il modo abituale per dire dritto o avanti.
    example_gloss: La biblioteca è dritto davanti a te.
  ar.a1.unit10.lesson01.teach.to_right:
    title: A destra
    gloss: a destra
    note: إلى (ilā) indica il movimento verso una direzione o un luogo.
    example_gloss: Il mercato è a destra.
  ar.a1.unit10.lesson02.teach.walk:
    title: Cammina
    gloss: cammina
    note: امش (imshi) è l'imperativo «cammina!» rivolto a un uomo; a una donna si dice امشي (imshī). È il verbo abituale per dare indicazioni a piedi.
    example_gloss: Cammina dritto.
  ar.a1.unit10.lesson02.teach.then:
    title: Poi
    gloss: poi
    note: ثم (thumma) collega in ordine due tappe del percorso.
    example_gloss: Cammina dritto, poi a destra.
  ar.a1.unit10.lesson02.teach.route:
    title: Due tappe del percorso
    gloss: Cammina dritto, poi a destra
    note: Prima tappa + ثم + seconda tappa. Dopo ثم il verbo non si ripete.
    example_gloss: 'Layla ha detto: Cammina dritto, poi a destra.'
  ar.a1.unit10.lesson02.teach.line01:
    title: Chiedere della biblioteca
    gloss: Yusuf chiede dove si trova la biblioteca.
    note: أين المكتبة؟ è già stata usata per i luoghi.
    example_gloss: 'Yusuf ha detto: Dov''è la biblioteca?'
  ar.a1.unit10.lesson02.teach.line02:
    title: Dare indicazioni
    gloss: Layla dà due semplici tappe del percorso.
    note: Layla dice امش perché parla a un uomo; a una donna direbbe امشي.
    example_gloss: 'Layla ha detto: Cammina dritto, poi a destra.'
  ar.a1.unit10.lesson02.teach.line03:
    title: Ringraziare qualcuno
    gloss: Yusuf dice grazie.
    note: شكرا chiude con cortesia lo scambio in cui si chiede aiuto.
    example_gloss: 'Yusuf ha detto: Grazie.'
  ar.a1.unit10.lesson02.teach.line04:
    title: Confermare il luogo
    gloss: Layla dice che la biblioteca è vicino al mercato.
    note: 'Qui si riutilizza قرب dell''unità sui luoghi: la biblioteca è vicino al mercato.'
    example_gloss: 'Layla ha detto: La biblioteca è vicino al mercato.'
