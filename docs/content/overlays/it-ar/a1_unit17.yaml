teaching:
  ar.a1.unit17.lesson01.teach.pain:
    title: Dolore
    gloss: dolore
    note: ألم (alam) significa dolore; عندي ألم (ʿindī alam) significa «ho (un) dolore».
    example_gloss: Ho dolore.
  ar.a1.unit17.lesson01.teach.head:
    title: Testa
    gloss: la testa
    note: الرأس (ar-raʾs) è la testa. In arabo si dice عندي ألم في الرأس, cioè «un dolore nella testa», mentre in italiano si dice di solito «ho mal di testa».
    example_gloss: Ho dolore alla testa.
  ar.a1.unit17.lesson01.teach.stomach:
    title: Stomaco
    gloss: la pancia
    note: البطن (al-baṭn) è la pancia, la zona dello stomaco.
    example_gloss: Ho dolore alla pancia.
  ar.a1.unit17.lesson01.teach.problem_sentence:
    title: Dolore alla testa
    gloss: Ho un dolore alla testa
    note: عندي ألم, letteralmente «presso di me (c'è) dolore», è il modo in cui l'arabo dice «ho dolore»; في + la parte del corpo indica dove.
    example_gloss: 'Layla ha detto: Ho un dolore alla testa.'
  ar.a1.unit17.lesson02.teach.problem_question:
    title: Qual è il problema?
    gloss: Qual è il problema?
    note: ما (mā) chiede «che cosa»; المشكلة (al-mushkila) significa il problema.
    example_gloss: Qual è il problema, Layla?
  ar.a1.unit17.lesson02.teach.drink:
    title: Bevi dell'acqua
    gloss: bere acqua
    note: اشربي (ishrabī) significa «bevi!» detto a una donna, qui Layla; a un uomo si dice اشرب (ishrab).
    example_gloss: 'Yusuf ha detto: «Bevi acqua».'
  ar.a1.unit17.lesson02.teach.rest:
    title: Riposo
    gloss: riposarsi
    note: استريحي (istarīḥī) significa «riposati!» detto a una donna; a un uomo si dice استرح (istariḥ).
    example_gloss: Riposati oggi.
  ar.a1.unit17.lesson02.teach.need_help:
    title: Ho bisogno di aiuto
    gloss: ho bisogno di aiuto
    note: 'أحتاج (aḥtāj) significa «ho bisogno» e مساعدة (musāʿada) significa «aiuto». Incontrerai anche أحتاج إلى مساعدة, con إلى: entrambe le forme sono corrette.'
    example_gloss: Ho un dolore. Ho bisogno di aiuto.
  ar.a1.unit17.lesson02.teach.line01:
    title: Chiedere qual è il problema
    gloss: Yusuf chiede a Layla qual è il problema.
    note: يا ليلى si rivolge a Layla chiamandola per nome.
    example_gloss: 'Yusuf ha detto: «Qual è il problema, Layla?»'
  ar.a1.unit17.lesson02.teach.line02:
    title: Indicare il sintomo
    gloss: Layla dice di avere mal di testa.
    note: Il sintomo viene espresso in modo diretto.
    example_gloss: 'Layla ha detto: «Ho mal di testa».'
  ar.a1.unit17.lesson02.teach.line03:
    title: Un semplice consiglio
    gloss: Yusuf dice a Layla di bere acqua e di riposarsi.
    note: 'Entrambi gli imperativi sono al femminile perché Yusuf parla a Layla; و (wa, «e») si scrive attaccata alla parola seguente: واستريحي.'
    example_gloss: 'Yusuf ha detto: «Bevi acqua e riposati».'
  ar.a1.unit17.lesson02.teach.line04:
    title: Ringraziare
    gloss: Layla dice grazie.
    note: شكرا chiude il breve scambio.
    example_gloss: 'Layla ha detto: «Grazie».'
