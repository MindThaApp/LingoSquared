course:
  title: Arabo A1
  description: 'Arabo di base per parlare di animali domestici e animali comuni: come chiamarli, le cure essenziali (passeggiata, cibo, gioco), come dire quali animali ami anche se non ne hai, e i plurali più comuni.'
