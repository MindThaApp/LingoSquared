teaching:
  ar.a1.unit27.lesson01.teach.alhywan_hywan_alyf:
    title: Animale, animale domestico
    gloss: l'animale / un animale domestico
    note: حيوان (ḥayawān) significa animale e حيوان أليف (ḥayawān alīf) significa animale domestico. أليف (alīf) è un aggettivo che significa «docile, addomesticato» e segue il nome.
    example_gloss:
    - Il cane è un animale.
    - Il cane è anche un animale domestico.
  ar.a1.unit27.lesson01.teach.alklb_alqta:
    title: Cane e gatto
    gloss: il cane / il gatto
    example_gloss:
    - Layla ha un cane.
    - Karim ha un gatto.
  ar.a1.unit27.lesson01.teach.alsmka_altair:
    title: Pesce e uccello
    gloss: il pesce / l'uccello
    example_gloss:
    - Il nonno ha un pesce.
    - Nour ha un uccellino.
  ar.a1.unit27.lesson01.teach.hl_ldyk_hywan:
    title: Hai un animale domestico?
    gloss: Hai un animale domestico?
    note: 'هل لديك (hal ladayka) chiede «hai?». Rivolto a una donna si scrive allo stesso modo, ma l''ultima vocale è i: ladayki. هل (hal) introduce una domanda sì/no.'
  ar.a1.unit27.lesson01.teach.nam_ldy_klb:
    title: Sì, ho un cane
    gloss: Sì, ho un cane.
    note: Una semplice risposta affermativa con il lessico nuovo di questa unità.
  ar.a1.unit27.lesson01.teach.la_lys_ldy:
    title: No, non ho un animale domestico
    gloss: No, non ho un animale domestico.
    note: 'ليس لدي (laysa ladayya) significa «non ho»: ليس (laysa) nega e لدي (ladayya) significa «ho».'
  ar.a1.unit27.lesson01.teach.nnfy_almlkya_babara:
    title: 'Non avere: ليس لدي'
    gloss: 'Per dire che non hai qualcosa, usa ليس لدي (laysa ladayya): ليس لدي وقت (non ho tempo), ليس لدي حيوان أليف (non ho un animale domestico).'
    note: ليس لدي si usa con qualsiasi nome e non cambia secondo il genere. Per «lui» e «lei» si dice ليس لديه (laysa ladayhi) e ليس لديها (laysa ladayhā).
  ar.a1.unit27.lesson02.teach.akhdh_alhywan_fy:
    title: Portare a spasso (un animale)
    gloss: portare a spasso (un animale)
    note: أخذ الحيوان في نزهة (akhdh al-ḥayawān fī nuzha) significa letteralmente «portare l'animale a fare una passeggiata». Il verbo è أخذ, «prendere».
    example_gloss: Porto a spasso il cane ogni giorno.
  ar.a1.unit27.lesson02.teach.ytghyr_alfal_ma:
    title: Il verbo cambia con la persona
    gloss: 'Il verbo cambia secondo la persona: آخذ الكلب في نزهة (ākhudh al-kalb fī nuzha), porto a spasso il cane; كريم يأخذ كلبه في نزهة (karīm yākhudh kalbahu fī nuzha), Karim porta a spasso il suo cane.'
    note: La lettera iniziale أ (a-) indica «io» e ي (ya-) indica «lui». نزهة (nuzha) è una passeggiata o una breve gita.
  ar.a1.unit27.lesson02.teach.itaam_alhywan:
    title: Dare da mangiare
    gloss: dare da mangiare
    example_gloss: Do da mangiare al gatto ogni giorno.
  ar.a1.unit27.lesson02.teach.allab_ma_alhywan:
    title: Giocare con
    gloss: giocare con
    example_gloss: Karim gioca con il suo gatto.
  ar.a1.unit27.lesson02.teach.akhdh_alklb_fy:
    title: Porto a spasso il cane ogni giorno
    gloss: Porto a spasso il cane ogni giorno.
    note: 'كل يوم (kull yawm) significa «ogni giorno»: كل + nome singolare senza ال.'
  ar.a1.unit27.lesson02.teach.atam_alqta_kl:
    title: Do da mangiare al gatto ogni giorno
    gloss: Do da mangiare al gatto ogni giorno.
    note: أطعم (uṭʿim) significa «do da mangiare». القطة (al-qiṭṭa) è femminile, e l'articolo ال è attaccato al nome.
  ar.a1.unit27.lesson03.teach.jma_klb_hw:
    title: 'Plurali: كلب → كلاب'
    gloss: 'Molti plurali sono irregolari, quindi impara ogni plurale insieme al nome: كلب (kalb) diventa كلاب (kilāb), قطة (qiṭṭa) diventa قطط (qiṭaṭ) e طائر (ṭāʾir) diventa طيور (ṭuyūr).'
    note: In arabo i plurali sono per lo più «rotti» (irregolari), quindi ogni plurale si impara insieme al suo nome; il plurale di animali richiede un aggettivo al femminile singolare.
  ar.a1.unit27.lesson03.teach.klab_qtt:
    title: Cani e gatti
    gloss: cani / gatti
    example_gloss:
    - Yusuf ama i cani.
    - Sara ama i gatti.
  ar.a1.unit27.lesson03.teach.asmak_tywr:
    title: Pesci e uccelli (plurale)
    gloss: pesci / uccelli
    example_gloss:
    - Adoro i pesci.
    - Il nonno adora gli uccelli.
  ar.a1.unit27.lesson03.teach.ahb_alhywanat:
    title: Adoro gli animali
    gloss: Adoro gli animali.
    note: أحب الحيوانات (uḥibb al-ḥayawānāt) significa «amo gli animali». Il plurale termina in ات e prende l'articolo ال attaccato.
  ar.a1.unit27.lesson03.teach.sara_thb_alqtt:
    title: Sara ama i gatti, ma non ha un animale domestico
    gloss: Sara ama i gatti, ma non ha un animale domestico.
    note: Prepara il contrasto su cui è costruita la lettura della lezione 5.
  ar.a1.unit27.lesson04.teach.ywsf_hl_ldyk:
    title: Yusuf chiede di un animale domestico
    gloss: 'Yusuf: Hai un animale domestico, Layla?'
  ar.a1.unit27.lesson04.teach.lyla_nam_ldy:
    title: Layla ha un cane
    gloss: 'Layla: Sì, ho un cane.'
  ar.a1.unit27.lesson04.teach.ywsf_kyf_ybdw:
    title: Yusuf chiede com'è
    gloss: 'Yusuf: Com''è?'
    note: كيف يبدو؟ (kayfa yabdū?) chiede com'è lui. يبدو (yabdū) è maschile perché كلب, cane, è un nome maschile.
  ar.a1.unit27.lesson04.teach.lyla_lh_shar:
    title: Layla descrive il suo cane
    gloss: 'Layla: Ha il pelo marrone ed è piccolo.'
    note: Riprende il lessico dei colori dei capelli e delle dimensioni dell'unità sull'aspetto fisico, ora per descrivere il pelo di un animale invece dei capelli di una persona.
  ar.a1.unit27.lesson04.teach.nqwl_hw_llklb:
    title: I pronomi per gli animali
    gloss: 'Ogni nome di animale è maschile o femminile: il cane è هو (huwa, lui) e la gatta è هي (hiya, lei). La terminazione ه in أطعمه (uṭʿimuhu) significa lo.'
    note: Un nome di animale maschile come كلب vuole pronomi e aggettivi al maschile; uno femminile come قطة li vuole al femminile.
  ar.a1.unit27.lesson04.teach.ywsf_hl_takhdhynh:
    title: Yusuf chiede delle passeggiate
    gloss: 'Yusuf: Lo porti a passeggio ogni giorno?'
  ar.a1.unit27.lesson04.teach.lyla_nam_akhdhh:
    title: Layla racconta la sua routine
    gloss: 'Layla: Sì, lo porto a passeggio ogni giorno e gli do da mangiare.'
  ar.a1.unit27.lesson05.teach.ywsf_wsara_yhban:
    title: Yusuf, Sara e Karim e gli animali
    gloss: 'Yusuf e Sara amano entrambi gli animali, ma nessuno dei due ha un animale domestico. Yusuf ama i cani e Sara ama i gatti. Karim invece ha un animale domestico: un gatto. Gioca spesso con il suo gatto e gli dà da mangiare ogni giorno. Tu hai un animale domestico?'
    note: 'Contrappone l''amare gli animali all''averne davvero uno: è lo scopo comunicativo dell''obiettivo.'
    glosses:
      يحبان: adorare / piacere molto
      كلاهما: entrambi
      الحيوانات: animali
      منهما: dei due (nessuno dei due)
      أليف: animale domestico (lett. addomesticato)
      الكلاب: cani
      القطط: gatti
      قطة: gatto
      يلعب: gioca
      ويعطي: dà
      كل: ogni / tutti
      طعاما: cibo
  ar.a1.unit27.lesson05.teach.krym_ylab_ma:
    title: Karim gioca spesso con il suo gatto
    gloss: Karim gioca spesso con il suo gatto.
    note: 'قطته (qiṭṭatuhu) significa il suo gatto: la terminazione ه (hu) significa suo, e la ة di قطة diventa ت davanti ad essa.'
  ar.a1.unit27.lesson05.teach.ahb_alklab_lys:
    title: Adoro i cani. Non ho un animale domestico.
    gloss: Adoro i cani. Non ho un animale domestico.
    note: Una risposta modello di due frasi, da riutilizzare per l'esercizio di scrittura dell'unità.
  ar.a1.unit27.lesson06.teach.lyla_ya_nwr:
    title: Layla chiede a Nour
    gloss: 'Layla: Nour, hai anche tu un animale domestico?'
  ar.a1.unit27.lesson06.teach.nwr_nam_ldy:
    title: Nour ha un uccellino di nome Pico
    gloss: 'Nour: Sì, ho un uccellino. Si chiama Pico.'
    note: اسمه (ismuhu) significa il suo nome; la ه finale significa suo. بيكو (bīkū) è il nome dell'uccellino.
  ar.a1.unit27.lesson06.teach.ywsf_ma_ajml:
    title: Yusuf reagisce
    gloss: 'Yusuf: Che bello! Che cosa fai con lui ogni giorno?'
  ar.a1.unit27.lesson06.teach.nwr_atamh_kl:
    title: Nour dà da mangiare all'uccellino ogni giorno
    gloss: 'Nour: Gli do da mangiare ogni giorno.'
  ar.a1.unit27.lesson06.teach.ywsf_wana_ayda:
    title: Anche Yusuf ama gli uccelli
    gloss: 'Yusuf: Anch''io amo gli uccelli.'
  ar.a1.unit27.lesson06.teach.lyla_ma_ajml:
    title: Layla chiude la conversazione
    gloss: 'Layla: Che bello che a tutti e tre noi piacciano gli animali!'
    note: Chiude il cerchio sulle informazioni sugli animali dei tre personaggi di questa unità.
