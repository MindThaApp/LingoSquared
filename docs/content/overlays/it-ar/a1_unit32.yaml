    title: Chi fa che cosa per la festa?
    gloss: Sabato è il compleanno di Sara. Festeggiamo con una festa. Yusuf invita Karim e Layla alla festa. Karim ama festeggiare con gli amici. Anche Layla verrà alla festa. Sono tutti felici per Sara.
    note: Riepilogo del programma della festa.
