      نحتفل: festeggiamo
      بحفلة: festa
      يدعو: invita
      إلى: a (come in «invita ... alla festa»)
      الاحتفال: festeggia
      يحب: piace
      الأصدقاء: gli amici
      ستأتي: viene
      الجميع: tutti
      سعداء: contento
