    title: Tutti sono felici per Sara
    gloss: Sono tutti felici per Sara.
  ar.a1.unit32.lesson06.teach.ywsf_ayd_mylad:
    title: Yusuf fa gli auguri a Sara
    gloss: 'Yusuf: Buon compleanno, Sara!'
  ar.a1.unit32.lesson06.teach.lyla_mbrwk_hdhh:
    title: Layla fa un regalo
    gloss: 'Layla: Congratulazioni! Questo è un regalo per te.'
  ar.a1.unit32.lesson06.teach.sara_shkra_lkma:
    title: Sara ringrazia
    gloss: 'Sara: Grazie a tutti e due! È davvero un pensiero gentile.'
  ar.a1.unit32.lesson06.teach.krym_hl_nbda:
