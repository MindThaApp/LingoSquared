teaching:
  ar.a1.unit01.lesson01.teach.rtl:
    title: L'arabo si scrive da destra a sinistra
    gloss: L'arabo si scrive da destra a sinistra.
    note: Leggi l'arabo partendo dal margine destro verso sinistra.
  ar.a1.unit01.lesson01.teach.mim:
    title: La lettera م
    gloss: m
    note: م rappresenta il suono m e cambia forma a seconda della posizione nella parola.
  ar.a1.unit01.lesson01.teach.ra:
    title: La lettera ر
    gloss: r
    note: ر rappresenta una r vibrante e non si collega alla lettera che la segue.
  ar.a1.unit01.lesson01.teach.ha:
    title: La lettera ح
    gloss: ḥ
    note: ح è un suono h soffiato, prodotto in profondità nella gola; in italiano non esiste un suono equivalente (la h italiana è muta).
  ar.a1.unit01.lesson01.teach.ba:
    title: La lettera ب
    gloss: b
    note: ب rappresenta il suono b e si collega alle lettere vicine.
  ar.a1.unit01.lesson01.teach.alef:
    title: La lettera ا
    gloss: ā / a
    note: ا indica la vocale lunga ā e non si collega alla lettera successiva.
  ar.a1.unit01.lesson01.teach.marhaba_shape:
    title: Costruisci مرحبا
    gloss: ciao
    note: مرحبا si legge marḥaban. In arabo le vocali brevi di norma non si scrivono.
    example_gloss: Ciao! Sono Sara.
  ar.a1.unit01.lesson02.teach.marhaba:
    title: Ciao
    gloss: ciao
    note: مرحبا è un saluto cordiale e adatto a quasi ogni situazione.
    example_gloss: Ciao, come stai?
  ar.a1.unit01.lesson02.teach.sabah_alkhayr:
    title: Buongiorno
    gloss: buongiorno
    note: صباح الخير si legge ṣabāḥ al-khayr, letteralmente «mattino di bene».
  ar.a1.unit01.lesson02.teach.masaa_alkhayr:
    title: Buon pomeriggio o buonasera
    gloss: buon pomeriggio / buonasera
    note: مساء الخير si legge masāʾ al-khayr e si usa dal tardo pomeriggio fino alla sera.
  ar.a1.unit01.lesson02.teach.maa_alsalama:
    title: Arrivederci
    gloss: arrivederci; addio
    note: 'مع السلامة si legge maʿa as-salāma, letteralmente «con sicurezza»: è il saluto di congedo più comune.'
    example_gloss: Grazie, arrivederci!
  ar.a1.unit01.lesson02.teach.shukran:
    title: Grazie
    gloss: grazie
    note: شكرا si legge shukran e va bene in ogni registro.
    example_gloss: Grazie mille.
  ar.a1.unit01.lesson02.teach.afwan:
    title: Prego
    gloss: prego / di nulla
    note: عفوا (ʿafwan) è la risposta abituale a شكرا; in un altro contesto può significare anche «scusi».
  ar.a1.unit01.lesson03.teach.tusbih_ala_khayr:
    title: Buonanotte
    gloss: buonanotte
    note: تصبح على خير (tuṣbiḥ ʿalā khayr) si dice quando ci si congeda per la notte o si va a dormire, non come saluto iniziale. تصبح è la forma rivolta a un uomo; a una donna si dice تصبحين على خير (tuṣbiḥīna ʿalā khayr).
  ar.a1.unit01.lesson03.teach.ahlan_wa_sahlan:
    title: Benvenuto
    gloss: benvenuto
    note: أهلا وسهلا (ahlan wa sahlan) si usa per dare il benvenuto a un ospite o per salutare calorosamente chi arriva.
    example_gloss: Benvenuto! Benvenuto da noi.
  ar.a1.unit01.lesson03.teach.ila_alliqaa:
    title: Arrivederci
    gloss: arrivederci / a presto
    note: إلى اللقاء (ilā al-liqāʾ) è un saluto di congedo curato e neutro.
  ar.a1.unit01.lesson03.teach.sabah_alnoor:
    title: Buongiorno, risposta
    gloss: buongiorno [risposta]
    note: صباح النور (ṣabāḥ an-nūr, «mattino di luce») è la risposta abituale a صباح الخير.
  ar.a1.unit01.lesson03.teach.masaa_alnoor:
    title: Buonasera, risposta
    gloss: buonasera [risposta]
    note: مساء النور (masāʾ an-nūr) è la risposta abituale a مساء الخير.
  ar.a1.unit01.lesson03.teach.yawman_saeedan:
    title: Buona giornata
    gloss: buona giornata
    note: يوما سعيدا (yawman saʿīdan) è un cordiale augurio di congedo.
  ar.a1.unit01.lesson04.teach.kayfa_haluk:
    title: Come stai?
    gloss: Come sta?
    note: كيف حالك؟ (kayfa ḥāluk) è il modo standard per chiedere come sta qualcuno; senza vocali brevi, la forma scritta va bene per qualsiasi interlocutore.
  ar.a1.unit01.lesson04.teach.gender_note:
    title: Tu al maschile e al femminile
    gloss: tu (m.) / tu (f.)
    note: Nell'arabo parlato si distingue أنتَ (anta, a un uomo) da أنتِ (anti, a una donna), e allo stesso modo حالَك da حالِك. Senza i segni diacritici mostrati qui, le forme scritte usate in questo corso sono identiche per entrambi.
  ar.a1.unit01.lesson04.teach.bikhayr:
    title: Bene
    gloss: bene
    note: بخير (bikhayr) è la risposta positiva abituale a كيف حالك؟
    example_gloss: Oggi sto bene.
  ar.a1.unit01.lesson04.teach.alhamdulillah:
    title: Grazie a Dio
    gloss: grazie a Dio / sia lode a Dio
    note: 'الحمد لله (al-ḥamdu lillāh) segue molto spesso بخير in una risposta, a prescindere dalla pratica religiosa di chi parla: funziona come una normale formula di chiusura, simile all''italiano «grazie a Dio» o «per fortuna» nel parlare quotidiano.'
    example_gloss: Bene, grazie a Dio.
  ar.a1.unit01.lesson04.teach.wa_anta:
    title: E tu?
    gloss: E Lei?
    note: وأنت؟ (wa anta a un uomo, wa anti a una donna) restituisce la domanda; la grafia senza vocali brevi è la stessa per entrambi.
  ar.a1.unit01.lesson04.teach.mumtaz:
    title: Ottimo
    gloss: ottimo / benissimo
    note: ممتاز (mumtāz) è una risposta più entusiasta rispetto a بخير.
    example_gloss: Oggi sto benissimo!
  ar.a1.unit01.lesson04.teach.la_bas:
    title: Non male
    gloss: non male
    note: لا بأس (lā baʾs) è una risposta naturale e moderata, non una lamentela.
