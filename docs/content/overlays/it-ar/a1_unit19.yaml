teaching:
  ar.a1.unit19.lesson01.teach.house:
    title: Casa
    gloss: casa
    note: بيت (bayt) è una casa; la desinenza ـي significa «mio/mia», quindi بيتي (baytī) è «casa mia».
    example_gloss: La mia casa è vicino alla biblioteca.
  ar.a1.unit19.lesson01.teach.room:
    title: Stanza
    gloss: stanza
    note: غرفة (ghurfa) è femminile (termina in ة), perciò è seguita dal femminile واحدة.
    example_gloss: In casa mia c'è una sola stanza.
  ar.a1.unit19.lesson01.teach.kitchen:
    title: Cucina
    gloss: cucina
    note: 'مطبخ (maṭbakh) è una cucina. L''arabo non ha una parola per «c''è»: basta iniziare con في بيتي («in casa mia»).'
    example_gloss: In casa mia c'è una cucina.
  ar.a1.unit19.lesson01.teach.one_room:
    title: Una stanza
    gloss: una stanza
    note: 'Il numero «uno» segue il nome e concorda con esso: غرفة واحدة (ghurfa wāḥida); con un nome maschile si usa واحد.'
    example_gloss: In casa mia c'è una sola stanza.
  ar.a1.unit19.lesson02.teach.table:
    title: Tavolo
    gloss: tavolo
    note: طاولة (ṭāwila) è un tavolo; come غرفة termina in ة ed è femminile.
    example_gloss: Ho un tavolo nella stanza.
  ar.a1.unit19.lesson02.teach.in_room:
    title: Nella stanza
    gloss: nella stanza
    note: الغرفة (al-ghurfa) significa «la stanza».
    example_gloss: Il tavolo è nella stanza.
  ar.a1.unit19.lesson02.teach.near_library:
    title: Vicino alla biblioteca
    gloss: vicino alla biblioteca
    note: قرب (qurb) significa «vicino a»; المكتبة è la biblioteca, dall'unità sui luoghi.
    example_gloss: La mia casa è vicino alla biblioteca.
  ar.a1.unit19.lesson02.teach.line01:
    title: Chiedere dove
    gloss: Layla chiede dove sia la casa di Yusuf.
    note: أين significa «dove»; بيتك (baytuka) significa «la tua casa», detto a un uomo; a una donna si dice baytuki, ma si scrive allo stesso modo.
    example_gloss: 'Layla ha detto: Dov''è casa tua, Yusuf?'
  ar.a1.unit19.lesson02.teach.line02:
    title: Dov'è la casa
    gloss: Yusuf dice che casa sua è vicino alla biblioteca.
    note: بيتي significa «casa mia».
    example_gloss: 'Yusuf ha detto: Casa mia è vicino alla biblioteca.'
  ar.a1.unit19.lesson02.teach.line03:
    title: Le stanze
    gloss: Yusuf dice che in casa sua c'è una stanza e una cucina.
    note: 'و (wa, «e») unisce i due elementi della casa e si scrive attaccata alla parola successiva: ومطبخ.'
    example_gloss: 'Yusuf ha detto: In casa mia c''è una stanza e una cucina.'
  ar.a1.unit19.lesson02.teach.line04:
    title: Chiedere di un oggetto
    gloss: Layla chiede se Yusuf ha un tavolo.
    note: هل introduce una domanda a cui si risponde sì o no; عندك (ʿindaka) significa «hai», detto a un uomo; a una donna si dice ʿindaki, ma si scrive allo stesso modo.
    example_gloss: 'Layla ha detto: Hai un tavolo?'
  ar.a1.unit19.lesson02.teach.line05:
    title: Dov'è l'oggetto
    gloss: Yusuf dice che ha un tavolo nella stanza.
    note: عندي esprime il possesso.
    example_gloss: 'Yusuf ha detto: Sì, ho un tavolo nella stanza.'
