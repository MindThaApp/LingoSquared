  ar.a1.unit04.lesson01.teach.al_yawm:
    title: Oggi
    gloss: oggi
    note: اليوم significa sia «oggi» sia «il giorno», a seconda del contesto.
    example_gloss: Qual è la data di oggi?
  ar.a1.unit04.lesson01.teach.ma_tareekh:
    title: Qual è la data di oggi?
    gloss: Che data è oggi?
    note: L'arabo mette la parola interrogativa ما davanti al sintagma nominale تاريخ اليوم.
    example_gloss: 'Layla ha detto: Qual è la data di oggi?'
  ar.a1.unit04.lesson01.teach.fee_shahr:
    title: Di maggio
    gloss: di maggio
    note: 'Nelle date si usa من prima del mese: الخامس من مايو.'
    example_gloss: Oggi è il cinque maggio.
  ar.a1.unit04.lesson01.teach.may:
    title: Maggio
    gloss: maggio
    note: مايو (māyū) è il nome di maggio usato in Egitto e in gran parte del mondo arabo; in Libano, Siria, Giordania e Iraq lo stesso mese si chiama أيار (ayyār).
    example_gloss: Oggi è il cinque maggio.
  ar.a1.unit04.lesson01.teach.june:
    title: Giugno
    gloss: giugno
    note: يونيو (yūnyū) è il nome di giugno usato in Egitto e in gran parte del mondo arabo; in Libano, Siria, Giordania e Iraq lo stesso mese si chiama حزيران (ḥazīrān).
    example_gloss: Oggi è il sei giugno.
  ar.a1.unit04.lesson02.teach.al_khamis:
    title: Il quinto
    gloss: il quinto
    note: الخامس è la forma ordinale usata per il giorno 5 in questa semplice data.
    example_gloss: Oggi è il cinque maggio.
  ar.a1.unit04.lesson02.teach.al_sadis:
    title: Il sesto
    gloss: il sesto
    note: السادس è la forma ordinale usata per il giorno 6.
    example_gloss: Oggi è il sei giugno.
  ar.a1.unit04.lesson02.teach.fifth_may:
    title: 5 maggio
    gloss: il cinque maggio
    note: 'Come in italiano («5 di maggio»), si usa من tra il giorno e il mese: in arabo il giorno è un numero ordinale, quindi si dice «il quinto di maggio».'
    example_gloss: Il cinque maggio.
  ar.a1.unit04.lesson02.teach.sixth_june:
    title: 6 giugno
    gloss: il sei giugno
    note: Questo dà una data chiara, con giorno e mese.
    example_gloss: Il sei giugno.
  ar.a1.unit04.lesson02.teach.line01:
    title: Chiedere la data
    gloss: Layla chiede la data di oggi.
    note: ما تاريخ اليوم؟ chiede una data del calendario, non l'ora.
    example_gloss: 'Layla ha detto: Qual è la data di oggi?'
  ar.a1.unit04.lesson02.teach.line02:
    title: Dire la data
    gloss: Yusuf dice che è il 5 maggio.
    note: La risposta inizia con اليوم.
    example_gloss: 'Yusuf ha detto: Oggi è il cinque maggio.'
  ar.a1.unit04.lesson02.teach.line03:
    title: Parlare di una lezione
    gloss: Layla dice che oggi ha una lezione.
    note: عندي significa «io ho» ed è già comparso prima con i numeri.
    example_gloss: 'Layla ha detto: Grazie. Oggi ho una lezione.'
  ar.a1.unit04.lesson02.teach.line04:
    title: Indicare la data della lezione
    gloss: Yusuf dice la data della lezione.
    note: في indica quando si svolge la lezione.
    example_gloss: 'Yusuf ha detto: La lezione è il cinque maggio.'
