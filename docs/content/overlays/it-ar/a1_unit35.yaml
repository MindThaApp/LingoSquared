    gloss: 'Impiegato: Sì, ecco un francobollo. Il pacco arriva domani.'
  ar.a1.unit35.lesson04.teach.lyla_raia_shkra:
    title: Layla ringrazia l'impiegato
    gloss: 'Layla: Perfetto! Grazie, arrivederci!'
  ar.a1.unit35.lesson05.teach.and_lyla_trd:
    title: Layla spedisce un pacco
    gloss: Layla ha un pacco per i suoi nonni a Beirut. Compra un francobollo all'ufficio postale. Scrive l'indirizzo sul pacco. Il pacco arriva da loro domani. La lettera impiega tre giorni.
    note: 'Un breve testo sul pacco. Il verbo concorda con il soggetto: الطرد يصل (aṭ-ṭard yaṣil) per un nome maschile, ma ليلى تشتري (Layla tashtarī) per una donna.'
    glosses:
      طرد: pacco
      لجدها: per suo nonno
      وجدتها: e sua nonna
      تشتري: compra
      طابعا: francobollo
      البريد: ufficio postale (la posta)
      تكتب: scrive
      العنوان: indirizzo
      يصل: arriva (verbo maschile)
      غدا: domani
      إليهما: a loro (due); il verbo più questa parola significa «arriva a loro»
      الرسالة: lettera
      تستغرق: ci mette (una quantità di tempo)
      ثلاثة: tre
      أيام: giorni
  ar.a1.unit35.lesson05.teach.lyla_trsl_trda:
    title: Layla spedisce un pacco ai nonni
    gloss: Layla spedisce un pacco a suo nonno e a sua nonna.
  ar.a1.unit35.lesson05.teach.altrd_ysl_ghda:
    title: Il pacco arriva domani e la lettera ci mette tre giorni
    gloss: Il pacco arriva domani e la lettera ci mette tre giorni.
  ar.a1.unit35.lesson06.teach.lyla_altrd_ysl:
    title: Layla dà la notizia
    gloss: 'Layla: Il pacco arriva domani dal nonno e dalla nonna!'
  ar.a1.unit35.lesson06.teach.ywsf_raia_mta:
