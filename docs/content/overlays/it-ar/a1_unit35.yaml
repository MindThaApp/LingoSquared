  ar.a1.unit35.lesson03.teach.altrd_mdhkr_fnqwl:
    title: Il verbo concorda con il nome
    gloss: Il pacco è maschile, quindi si dice يصل (yaṣil). La lettera è femminile, quindi si dice تصل (taṣil).
    note: Un verbo al presente inizia con ي per un soggetto maschile e con ت per uno femminile, come in الطرد يصل (aṭ-ṭard yaṣil) e الرسالة تصل (ar-risāla taṣil).
