teaching:
  ar.a1.unit06.lesson01.teach.family:
    title: La famiglia
    gloss: famiglia
    note: عائلة (ʿāʾila) è la parola generica per «famiglia». Nell'esempio, هذه è la forma femminile di هذا («questo»), usata perché عائلة è femminile.
    example_gloss: Questa è una famiglia.
  ar.a1.unit06.lesson01.teach.father:
    title: Padre
    gloss: padre
    note: أب (ab) significa «padre».
    example_gloss: Ho un padre.
  ar.a1.unit06.lesson01.teach.mother:
    title: Madre
    gloss: madre
    note: أم (umm) significa «madre».
    example_gloss: Ho una madre.
  ar.a1.unit06.lesson01.teach.brother:
    title: Fratello
    gloss: fratello
    note: أخ (akh) significa «fratello».
    example_gloss: Ho un fratello.
  ar.a1.unit06.lesson01.teach.sister:
    title: Sorella
    gloss: sorella
    note: أخت (ukht) significa «sorella».
    example_gloss: Ho un fratello e una sorella.
  ar.a1.unit06.lesson01.teach.i_have:
    title: Ho
    gloss: ho
    note: عندي (ʿindī, letteralmente «presso di me») è il modo semplice, a livello A1, per dire che hai qualcosa; لدي (ladayya) è un equivalente più formale.
    example_gloss: Ho una sorella.
  ar.a1.unit06.lesson02.teach.in_family:
    title: Nella tua famiglia
    gloss: nella tua famiglia
    note: 'Qui من è man, «chi», non min, «da», come in من أين أنت؟: si scrivono allo stesso modo. عائلتك significa «la tua famiglia»: ʿāʾilatuka se ti rivolgi a un uomo, ʿāʾilatuki a una donna.'
    example_gloss: Chi c'è nella tua famiglia?
  ar.a1.unit06.lesson02.teach.sister_name:
    title: Si chiama Nour
    gloss: si chiama Nour
    note: اسمها significa «il suo nome» (di lei).
    example_gloss: 'Yusuf ha detto: Si chiama Nour.'
  ar.a1.unit06.lesson02.teach.line01:
    title: Chiedere della famiglia
    gloss: Layla chiede chi c'è nella famiglia di Yusuf.
    note: Qui من (man) significa «chi». يا يوسف si rivolge a Yusuf chiamandolo per nome.
    example_gloss: 'Layla ha detto: Chi c''è nella tua famiglia, Yusuf?'
  ar.a1.unit06.lesson02.teach.line02:
    title: Descrivere la famiglia
    gloss: Yusuf dice che ha un padre, una madre e una sorella.
    note: و unisce i membri della famiglia.
    example_gloss: 'Yusuf ha detto: Ho un padre, una madre e una sorella.'
  ar.a1.unit06.lesson02.teach.line03:
    title: Chiedere il nome della sorella
    gloss: Layla chiede il nome di sua sorella.
    note: 'أختك significa «tua sorella»: ukhtuka se ti rivolgi a un uomo, ukhtuki a una donna. Qui Layla si rivolge a Yusuf, quindi ukhtuka.'
    example_gloss: 'Layla ha detto: Come si chiama tua sorella?'
  ar.a1.unit06.lesson02.teach.line04:
    title: Dire il suo nome
    gloss: Yusuf dice che si chiama Nour.
    note: 'La terminazione ـها significa «di lei»: اسمها (ismuhā), «il suo nome».'
    example_gloss: 'Yusuf ha detto: Si chiama Nour.'
