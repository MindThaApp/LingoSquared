teaching:
  ar.a1.unit16.lesson01.teach.ticket:
    title: Biglietto
    gloss: biglietto
    note: 'تذكرة (tadhkira) è un nome femminile: le parole che terminano in ة sono di solito femminili.'
    example_gloss: Voglio un biglietto.
  ar.a1.unit16.lesson01.teach.train:
    title: Treno
    gloss: il treno
    note: 'القطار (al-qiṭār): ال corrisponde all''articolo determinativo (il, lo, la).'
    example_gloss: Il treno è alle cinque.
  ar.a1.unit16.lesson01.teach.to_cairo:
    title: Per il Cairo
    gloss: per il Cairo
    note: القاهرة (al-qāhira) è il Cairo; إلى (ilā) indica la destinazione.
    example_gloss: Voglio un biglietto per il Cairo.
  ar.a1.unit16.lesson01.teach.ticket_request:
    title: Voglio un biglietto
    gloss: Voglio un biglietto per il Cairo
    note: أريد si usa per una semplice richiesta di viaggio.
    example_gloss: Vorrei un biglietto per il Cairo, per favore.
  ar.a1.unit16.lesson02.teach.platform:
    title: Binario
    gloss: il binario
    note: الرصيف (ar-raṣīf) è il binario della stazione; la stessa parola significa anche marciapiede.
    example_gloss: Il binario è qui.
  ar.a1.unit16.lesson02.teach.second_platform:
    title: Binario due
    gloss: binario due
    note: الثاني (ath-thānī) significa secondo; è la forma maschile, in accordo con الرصيف, e come un aggettivo segue il nome e prende anch'esso ال.
    example_gloss: Dal binario due.
  ar.a1.unit16.lesson02.teach.which_platform:
    title: Da quale binario?
    gloss: da quale binario?
    note: أي (ayy) serve a chiedere quale.
    example_gloss: 'Layla ha detto: Da quale binario?'
  ar.a1.unit16.lesson02.teach.line01:
    title: Layla chiede un biglietto
    gloss: Layla chiede un biglietto per il Cairo.
    note: من فضلك rende la richiesta cortese.
    example_gloss: 'Layla ha detto: Vorrei un biglietto per il Cairo, per favore.'
  ar.a1.unit16.lesson02.teach.line02:
    title: Orario di partenza
    gloss: L'impiegato dice l'orario del treno.
    note: في الساعة introduce l'orario di partenza.
    example_gloss: 'L''impiegato ha detto: Il treno è alle cinque.'
  ar.a1.unit16.lesson02.teach.line03:
    title: Chiedi il binario
    gloss: Layla chiede da quale binario.
    note: Dopo أي, رصيف compare senza ال.
    example_gloss: 'Layla ha detto: Da quale binario?'
  ar.a1.unit16.lesson02.teach.line04:
    title: Risposta sul binario
    gloss: L'impiegato dice binario due.
    note: من الرصيف الثاني risponde alla domanda sul binario.
    example_gloss: 'L''impiegato ha detto: Dal binario due.'
