    - Non lo dice.
    accepted_answers:
    - value: Gli attori.
      status: correct
    feedback: 'Yusuf dice: جيد جدا! الممثلون كانوا رائعين (jayyid jiddan! al-mumaththilūn kānū rāʾiʿīn). كانوا (kānū) è il plurale maschile: «erano».'
    prompt_blocks:
    - Secondo Yusuf, che cosa era fantastico?
