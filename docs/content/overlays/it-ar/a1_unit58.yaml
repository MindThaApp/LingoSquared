    feedback: 'L''addetto dice: نعم، المقعد خمسة والمقعد ستة (naʿam, al-maqʿad khamsa wa-l-maqʿad sitta). و (wa) significa «e» e si scrive attaccata: والمقعد.'
    prompt_blocks:
    - Che posti hanno?
