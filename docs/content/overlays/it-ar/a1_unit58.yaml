  ar.a1.unit58.lesson05.exercise01.listen_nryd_tdhkrtyn_llard:
    instruction: Ascolta il dialogo e scegli che cosa dice Yusuf.
    correct_option: Vorremmo due biglietti per lo spettacolo.
    distractors:
    - Vorremmo vedere gli attori.
    - Vorremmo un solo biglietto.
    - Dov'è il palcoscenico?
    accepted_answers:
    - value: Vorremmo due biglietti per lo spettacolo.
      status: correct
    feedback: 'Yusuf dice: نريد تذكرتين للعرض من فضلك (nurīdu tadhkaratayn lil-ʿarḍ min faḍlik). ل («per») e ال («il») si fondono in لل in للعرض.'
  ar.a1.unit58.lesson05.exercise02.comprehend_almblgh_stwn_drhma:
    instruction: Ascolta il dialogo e scegli quanto costano due biglietti.
    correct_option: Sessanta dirham.
    distractors:
