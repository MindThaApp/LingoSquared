    feedback: 'Nour chiede: كيف كان العرض؟ (kayfa kāna al-ʿarḍ). كان (kāna) significa «era»; è maschile perché العرض è maschile.'
  ar.a1.unit58.lesson06.exercise02.comprehend_jyd_jda_almmthlwn:
