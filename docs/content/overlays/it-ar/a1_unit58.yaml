    - Novanta dirham.
    - Non lo dice.
    accepted_answers:
    - value: Sessanta dirham.
      status: correct
    feedback: 'L''addetto dice: بالطبع. المبلغ ستون درهما (bi-ṭ-ṭabʿ. al-mablagh sittūn dirhaman), sessanta dirham.'
    prompt_blocks:
    - Quanto costano due biglietti?
  ar.a1.unit58.lesson05.exercise03.comprehend_hl_ldyna_mqaad:
    instruction: Ascolta il dialogo e scegli che cosa chiede Layla.
    correct_option: Abbiamo dei buoni posti?
    distractors:
    - A che ora comincia?
    - Dov'è l'ingresso?
    - Non chiede nulla.
    accepted_answers:
    - value: Abbiamo dei buoni posti?
      status: correct
    feedback: 'Layla chiede: هل لدينا مقاعد جيدة؟ (hal ladaynā maqāʿid jayyida). لدينا (ladaynā) significa «abbiamo». L''aggettivo جيدة termina in ة perché il plurale di cose vuole l''aggettivo al femminile singolare.'
    prompt_blocks:
    - Che cosa chiede Layla?
  ar.a1.unit58.lesson05.exercise04.comprehend_nam_almqad_khmsa:
