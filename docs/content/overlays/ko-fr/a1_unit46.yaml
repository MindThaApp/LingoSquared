teaching:
  fr.a1.unit46.lesson01.teach.l_appartement_le:
    title: 아파트, 거실, 침실
    gloss: 아파트, 거실, 침실
    note: '*L''appartement*은 남성이고 *le*의 *e*가 빠져요. *le salon*은 남성, *la chambre*는 여성이에요.'
    example_gloss:
    - 저는 아파트가 있어요.
    - 저는 거실이 있어요.
    - 저는 침실이 있어요.
  fr.a1.unit46.lesson01.teach.la_cuisine_la:
    title: 부엌, 욕실
    gloss: 부엌, 욕실
    note: '*La cuisine*과 *la salle de bains*은 둘 다 여성이에요.'
    example_gloss:
    - 저는 부엌이 있어요.
    - 저는 욕실이 있어요.
  fr.a1.unit46.lesson01.teach.j_ai_un:
    title: 아파트가 있다고 말하기
    gloss: 저는 아파트가 있어요.
    note: '*Avoir*(가지다)는 어떤 집이 있는지 말할 때 쓰는 자연스러운 동사예요. 이것은 일반적인 예문이고, 리옹에 있는 마티외의 아파트는 이 단원 뒷부분에 나와요.'
  fr.a1.unit46.lesson01.teach.j_ai_un_2:
    title: 모든 방 말하기
    gloss: 저는 거실, 침실, 부엌, 욕실이 있어요.
    note: 이 수업의 어휘 네 가지 방을 한 문장에 담았어요. 쉼표로 이어 가다가 마지막에 *et*로 연결해요.
  fr.a1.unit46.lesson02.teach.tu_as_combien:
    title: 방이 몇 개인지 묻기
    gloss: 방이 몇 개예요?
    note: '*Combien de*(몇 개의) 뒤에는 복수 명사가 와요: *combien de pièces*.'
  fr.a1.unit46.lesson02.teach.j_ai_deux:
    title: 방 개수 말하기
    gloss: 저는 침실이 두 개 있어요.
    note: '*Chambres*는 *chambre*의 복수형으로, 소리 나지 않는 *-s*를 붙여 규칙적으로 만들어요.'
  fr.a1.unit46.lesson02.teach.l_appartement_a:
    title: 전체 방 개수 말하기
    gloss: 이 아파트는 방이 세 개예요.
    note: '*Pièces*는 침실만이 아니라 방 전체를 가리키는 일반적인 단어예요.'
  fr.a1.unit46.lesson03.teach.le_balcon_le:
    title: 발코니, 정원
    gloss: 발코니, 정원
    note: '*Le balcon*과 *le jardin*은 둘 다 남성이에요.'
    example_gloss:
    - 발코니가 있어요.
    - 정원이 없어요.
  fr.a1.unit46.lesson03.teach.il_y_a:
    title: 무언가 있다고 말하기
    gloss: 발코니가 있어요.
    note: '*Il y a*는 무언가가 있다고 말할 때 쓰는 기본 표현이에요.'
  fr.a1.unit46.lesson03.teach.il_n_y:
    title: 무언가 없다고 말하기
    gloss: 정원이 없어요.
    note: '*Pas de*는 부정관사가 붙는 명사를 부정할 때 써요: *pas un jardin*이 아니라 *pas de jardin*.'
  fr.a1.unit46.lesson04.teach.cosy:
    title: 아늑한
    gloss: 아늑한
    note: 따뜻하고 기분 좋은 분위기를 나타내는, 프랑스어에서 아주 흔하고 독특한 형용사예요.
    example_gloss: 아파트는 작지만 아늑해요.
  fr.a1.unit46.lesson04.teach.l_appartement_est:
    title: 자주 쓰는 묘사 패턴
    gloss: 아파트는 작지만 아늑해요.
    note: '*Petit mais cosy*는 프랑스어 화자들이 아담한 집을 긍정적으로 묘사할 때 아주 자연스럽게 쓰는 표현이에요.'
  fr.a1.unit46.lesson04.teach.le_salon_est:
    title: 방 크기 묘사하기
    gloss: 거실이 커요.
    note: '*Grand*은 집 전체가 아니라 특정한 방 하나를 묘사해요. 남성인 *le salon*에 맞춰 쓴 형태예요.'
  fr.a1.unit46.lesson04.teach.la_cuisine_est:
    title: 다른 방의 크기 묘사하기
    gloss: 부엌이 작아요.
    note: 앞 카드의 *grand*와 같은 패턴이고 방만 달라요. *la cuisine*은 여성이라서 *petite*가 돼요.
  fr.a1.unit46.lesson05.teach.appartement_a_lyon:
    title: 주택 광고 읽기
    gloss: '리옹의 아파트: 침실 하나, 거실, 부엌, 욕실. 발코니는 있지만 정원은 없음. 아파트는 작지만 아늑해요.'
    note: 방 개수, 있는 시설과 없는 시설, 전체적인 인상을 따라가며 읽어 보세요.
    glosses:
      Appartement: 아파트
      chambre: 침실
      salon: 거실
      cuisine: 부엌
      bains: 욕실
      balcon: 발코니
      jardin: 정원
      petit: 작은
      cosy: 아늑한
  fr.a1.unit46.lesson06.teach.camille_salut_mathieu:
    title: 카미유가 아파트에 대해 묻다
    gloss: '카미유: 안녕 마티외, 리옹의 새 아파트는 어때?'
    note: '*Nouvel*은 *nouveau*(새로운)가 모음으로 시작하는 남성 명사 앞에서 쓰는 형태예요: *un nouvel appartement*.'
  fr.a1.unit46.lesson06.teach.mathieu_il_est:
    title: 마티외가 설명하다
    gloss: '마티외: 작지만 아늑해. 침실 하나, 거실, 부엌, 욕실이 있어.'
    note: 앞에서 읽은 주택 광고와 똑같아요. 마티외의 실제 아파트예요.
  fr.a1.unit46.lesson06.teach.camille_tu_as:
    title: 카미유가 발코니에 대해 묻다
    gloss: '카미유: 발코니 있어?'
    note: '*Tu as ... ?*로 하는 직접적인 예/아니요 질문이에요.'
  fr.a1.unit46.lesson06.teach.mathieu_oui_j:
    title: 마티외가 대답하다
    gloss: '마티외: 응, 발코니는 있는데 정원은 없어.'
    note: 앞의 광고에 나온 발코니는 있고 정원은 없다는 내용과 같아요.
  fr.a1.unit46.lesson06.teach.balcon_est_masculin:
    title: balcon의 성
    gloss: '*Balcon*은 남성이에요: 발코니 하나, 그것은 작아요.'
    note: '*Il*(그, 그것)은 *balcon* 같은 남성 명사를 대신하므로 형용사도 남성형이에요: *il est petit*.'
  fr.a1.unit46.lesson06.teach.camille_ca_a:
    title: 카미유가 따뜻하게 반응하다
    gloss: '카미유: 좋겠다! 조만간 놀러 갈게.'
    note: '*Je passerai te voir*(들러서 볼게)는 미래형 *passerai*에 *te voir*(너를 보다)가 이어진 표현이에요.'
  fr.a1.unit46.lesson06.teach.mathieu_super_tu:
    title: 마티외가 환영하다
    gloss: '마티외: 좋아, 언제든 환영이야.'
    note: '*Toujours la bienvenue*(언제나 환영)는 누군가를 다시 초대하는 따뜻한 표현이에요. 여기서는 카미유를 가리키므로 *bienvenue*가 여성형이에요.'
