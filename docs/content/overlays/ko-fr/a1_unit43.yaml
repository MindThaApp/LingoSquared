teaching:
  fr.a1.unit43.lesson01.teach.le_billet:
    title: 입장권
    gloss: 입장권
    note: '*Billet*는 남성 명사예요: *le billet*, *un billet*.'
    example_gloss: 리옹행 표 한 장 주세요.
  fr.a1.unit43.lesson01.teach.je_voudrais_un:
    title: 표 요청하기
    gloss: 리옹행 표 한 장 주세요.
    note: '*Je voudrais*는 요청을 부드럽게 해 줘요. *je veux*보다 더 공손해요.'
  fr.a1.unit43.lesson01.teach.voulez_vous_un:
    title: 직원이 종류를 물어봐요
    gloss: 편도로 하시겠어요, 왕복으로 하시겠어요?
    note: '*Voulez-vous*는 *vouloir*의 격식체 *vous* 형태예요. 여기서는 처음 보는 역 직원에게 쓰고 있어요.'
  fr.a1.unit43.lesson01.teach.un_aller_retour:
    title: 공손하게 대답하기
    gloss: 왕복으로 주세요.
    note: '*S''il vous plaît*는 격식을 갖춘 ''부탁합니다''예요. 대화의 *vous* 말투와 맞아요.'
  fr.a1.unit43.lesson01.teach.au_guichet_on:
    title: 매표소에서의 말투
    gloss: 매표소에서는 보통 높임 표현인 *vous*를 써요.
    note: 서비스 업무를 하는 낯선 사람에게는 *vous*를 쓰고, 친구나 가족에게는 *tu*를 써요.
  fr.a1.unit43.lesson02.teach.le_quai:
    title: 승강장
    gloss: 승강장
    note: '*Quai*는 남성 명사예요: *le quai*.'
    example_gloss: 리옹행 기차는 몇 번 승강장에서 출발해요?
  fr.a1.unit43.lesson02.teach.de_quel_quai:
    title: 어느 승강장인지 묻기
    gloss: 리옹행 기차는 몇 번 승강장에서 출발해요?
    note: '*De quel quai*는 승강장을 콕 집어 묻는 표현이에요. *quel*은 남성 명사 *quai*에 맞춘 형태예요.'
  fr.a1.unit43.lesson02.teach.le_train_part:
    title: 출발 정보 말하기
    gloss: 기차는 5번 승강장에서 9시 45분에 출발해요.
    note: '*Dix heures moins le quart*는 10시 15분 전, 즉 9시 45분이라는 뜻이에요. 프랑스어는 정각 전의 시각을 말할 때 *moins*(빼기)를 써요.'
  fr.a1.unit43.lesson02.teach.a_quelle_heure:
    title: 도착 시간 묻기
    gloss: 기차는 몇 시에 도착해요?
    note: '*À quelle heure arrive ... ?*는 시각을 묻는 표현이에요. *arriver*는 규칙적인 *-er* 동사예요: *le train arrive*.'
  fr.a1.unit43.lesson02.teach.le_train_arrive:
    title: 도착 시간 말하기
    gloss: 기차는 11시에 도착해요.
    note: '*Arrive*는 *arriver*의 *il/elle* 형태예요. *-er* 동사는 *il*, *elle*과 쓸 때 *-e*로 끝나요.'
  fr.a1.unit43.lesson03.teach.a_l_heure:
    title: 정시 / 지연
    gloss: 정시에; 지연
    note: '*À l''heure*는 예정대로 이루어지는 일에 쓰는 고정 표현이에요. *Le retard*(지연)는 남성 명사예요.'
    example_gloss:
    - 기차가 정시에 출발하지 않아요.
    - 안내 말씀드립니다. 리옹행 기차가 지연되고 있습니다.
  fr.a1.unit43.lesson03.teach.attention_le_train:
    title: 안내 방송
    gloss: 안내 말씀드립니다. 리옹행 기차가 지연되고 있습니다.
    note: '*Attention*은 역 안내 방송을 시작할 때 쓰는 말로, 한국어의 ''알려 드립니다'' 같은 느낌이에요.'
  fr.a1.unit43.lesson03.teach.le_train_ne:
    title: 정시가 아니라고 부정하기
    gloss: 기차가 정시에 출발하지 않아요.
    note: '*Ne ... pas*는 동사를 감싸요: *ne part pas à l''heure*.'
  fr.a1.unit43.lesson03.teach.le_train_part:
    title: 승강장 변경
    gloss: 기차는 5번 승강장 대신 3번 승강장에서 출발해요.
    note: '*Au lieu du*는 ''~ 대신에''라는 뜻이에요. *de* + *le*는 합쳐서 *du*가 돼요.'
  fr.a1.unit43.lesson03.teach.le_train_a:
    title: 지연 시간 말하기
    gloss: 기차가 10분 지연되고 있어요.
    note: '*A ... de retard*(직역하면 ''지연을 ~만큼 가지고 있다'')는 늦었다고 말하는 자연스러운 방법이며, *avoir*를 써요.'
  fr.a1.unit43.lesson04.teach.l_entree_la:
    title: 입구, 출구, 대합실
    gloss: 입구; 출구; 대합실
    note: '*L''entrée*는 모음 앞에서 *e*가 빠져 *l''*가 돼요. *la sortie*와 *la salle d''attente*는 여성 명사예요.'
    example_gloss:
    - 입구가 어디예요?
    - 출구가 어디예요?
    - 대합실이 어디예요?
  fr.a1.unit43.lesson04.teach.ou_est_le:
    title: 승강장 위치 묻기
    gloss: 7번 승강장이 어디예요?
    note: '*Où est ... ?*는 무언가의 위치를 묻는 표현이에요. *le quai sept*는 남성 명사예요.'
  fr.a1.unit43.lesson04.teach.tout_droit_puis:
    title: 길 안내하기
    gloss: 쭉 가다가 오른쪽으로 가세요.
    note: '*Tout droit*와 *à droite*는 방향을 나타내는 말이에요. *droite* 앞에는 *à*가 와요.'
  fr.a1.unit43.lesson04.teach.ou_est_la:
    title: 대합실 위치 묻기
    gloss: 대합실이 어디예요?
    note: 같은 질문 형태를 새로운 장소에 적용한 거예요.
  fr.a1.unit43.lesson05.teach.billet_paris_gare:
    title: 인쇄된 표 읽기
    gloss: '표: 파리 리옹역에서 리옹 파르디외까지. 출발: 10시 10분, 7번 승강장. 도착: 10시 50분. 왕복. 가격: 12유로 40.'
    note: 출발 시각과 승강장, 도착 시각, 표의 종류, 가격을 차례로 찾아보세요.
    glosses:
      Billet: 입장권
      Départ: 출발
      dix: 열
      quai: 승강장
      sept: 일곱, 7
      Arrivée: 도착
      onze: '11'
      Aller-retour: 왕복 표
      Prix: 가격
      douze: '12'
      euros: 유로
      quarante: 마흔, 40
  fr.a1.unit43.lesson06.teach.mathieu_on_doit:
    title: 마티외가 계획을 말해요
    gloss: '마티외: 7번 승강장으로 가야 해. 기차는 10시 10분에 출발해.'
    note: '*On doit*(*devoir*에서 온 표현)는 여기서 엄격한 의무가 아니라 현실적으로 필요한 일을 나타내요.'
  fr.a1.unit43.lesson06.teach.camille_regarde_voila:
    title: 카미유가 안내판을 읽어요
    gloss: '카미유: 봐, 저기 안내판 있다. 지연, 10분.'
    note: '*Voilà*는 거기 있는 것을 가리킬 때 써요: *voilà le panneau*.'
  fr.a1.unit43.lesson06.teach.mathieu_pas_de:
    title: 마티외가 침착하게 말해요
    gloss: '마티외: 문제없어, 커피 마실 시간은 아직 있어.'
    note: '*Pas de problème*는 안심시킬 때 흔히 쓰는 편한 표현이에요.'
  fr.a1.unit43.lesson06.teach.camille_bonne_idee:
    title: 기차가 도착해요
    gloss: '카미유: 좋은 생각이야. 어, 벌써 기차가 왔네. 7번 승강장, 딱 맞아!'
    note: '*Déjà*(벌써)는 방금 지연 안내가 나온 것을 생각하면 기차가 예상보다 일찍 왔다는 뜻을 나타내요.'
  fr.a1.unit43.lesson06.teach.mathieu_allez_on:
    title: 기차에 올라타요
    gloss: '마티외: 자, 타자. 리옹, 우리가 간다!'
    note: '*On*은 일상에서 쓰는 *우리*라는 뜻의 주어로, 동사는 *il* 형태와 같게 씁니다: *on monte*. *On arrive !*는 ''곧 도착이다!'' 하고 들뜬 마음을 나타내는 자연스러운 표현이며, 단어를 하나하나 옮기면 어색해요.'
