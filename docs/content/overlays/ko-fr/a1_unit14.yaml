    correct_response:
      le plus cher: 가장 비싼
      la moins chère: 가장 덜 비싼
      le meilleur: 가장 좋은
      la plus facile: 가장 쉬운
      Comparons les prix avant d'acheter.: 사기 전에 가격을 비교해 봐요.
    pairs:
    - left: le plus cher
      right: 가장 비싼
    - left: la moins chère
      right: 가장 덜 비싼
    - left: le meilleur
      right: 가장 좋은
    - left: la plus facile
      right: 가장 쉬운
    - left: Comparons les prix avant d'acheter.
      right: 사기 전에 가격을 비교해 봐요.
  fr.a1.unit14.lesson02.exercise04.order_cest_le_meilleur_gateau:
    instruction: '문장을 만드세요: 워크숍에서 가장 맛있는 케이크예요.'
    correct_response:
    - C'est
    - le
    - meilleur
    - gâteau
    - de
    - l'atelier
  fr.a1.unit14.lesson02.exercise05.fill_la_plus_facile:
    instruction: '"쉬운"에 해당하는 단어로 문장을 완성하세요.'
    accepted_answers:
    - facile
    prompt_blocks:
      '0': C'est la recette la plus ___ à faire. (쉬운)
  fr.a1.unit14.lesson02.exercise06.reply_which_is_cheapest:
    instruction: '대답하세요: 가장 덜 비싼 요리법이라고 말해 보세요.'
    accepted_answers:
    - C'est la recette la moins chère.
    - C'est la recette la moins chère
  fr.a1.unit14.lesson03.exercise01.comprehend_which_is_pricier:
    instruction: 대화를 들어 보세요. Mathieu는 어느 치즈가 더 비싸다고 말하나요?
    correct_option: 이것 (celui-ci)
    distractors:
    - 다른 것
    - 둘 다 아니에요, 가격이 같아요
    accepted_answers:
    - 이것 (celui-ci)
  fr.a1.unit14.lesson03.exercise02.comprehend_final_choice:
    instruction: 결국 어느 치즈를 고르나요?
    correct_option: 둘 중 더 싼 것
    distractors:
    - 둘 중 더 비싼 것
    - 두 치즈 모두
    accepted_answers:
    - 둘 중 더 싼 것
  fr.a1.unit14.lesson03.exercise03.select_why_they_choose_it:
    instruction: 워크숍에 왜 그 치즈를 고르나요?
    correct_option: 가장 좋은 선택이에요. 맛도 비슷하고 더 싸요
    distractors:
    - 가장 비싸기 때문이에요
    - Mathieu가 그 맛을 더 좋아해서예요
    accepted_answers:
    - 가장 좋은 선택이에요. 맛도 비슷하고 더 싸요
  fr.a1.unit14.lesson03.exercise04.order_celui_ci_est_plus_cher:
    instruction: 두 치즈를 비교하는 Mathieu의 문장을 만드세요.
    correct_response:
    - Celui-ci
    - est
    - plus
    - cher
    - que
    - l'autre
  fr.a1.unit14.lesson03.exercise05.reply_explain_the_choice:
    instruction: Inès의 역할을 해 보세요. 다른 것도 똑같이 맛있고 더 싸다고 말하세요.
    accepted_answers:
    - Moi, je trouve l'autre aussi bon, et moins cher.
    - Moi je trouve l'autre aussi bon et moins cher.
    - Je trouve l'autre aussi bon, et moins cher.
    - Je trouve l'autre aussi bon et moins cher.
  fr.a1.unit14.lesson03.exercise06.speak_justify_the_choice:
    instruction: 이 치즈를 고르는 이유를 소리 내어 설명해 보세요. 가장 싸고 맛도 똑같이 좋다고요.
    accepted_answers:
    - C'est le moins cher, et c'est aussi bon.
    - C'est le moins cher et c'est aussi bon.
    - C'est le moins cher, et aussi bon.
  fr.a1.unit14.lesson01.exercise07.dictation_plus_cher_que:
    instruction: 들리는 대로 입력하세요.
    correct_option: Ce fromage est plus cher que l'autre
    accepted_answers:
    - value: Ce fromage est plus cher que l'autre
      status: correct
    orthography_strict: true
