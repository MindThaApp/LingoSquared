answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: 프랑스어 A1
  description: 기본적인 비교 표현(plus/moins/aussi... que)과 최상급 표현(le/la plus...)을 배우며, 이네스와 마티유의 요리 워크숍 이야기를 이어 가요. 두 사람은 장을 보면서 두 가지 치즈를 비교해요. *meilleur*(더 좋은)와 *le meilleur*(가장 좋은)는 대부분의 다른 형용사에 쓰이는 규칙적인 *plus... que* 구문과 달리 불규칙형이라는 점에 주의하세요.
units:
  fr.a1.unit14.comparisons:
    title: 더 많이, 더 적게?
lessons:
  fr.a1.unit14.lesson01.vocabulaire_comparaisons:
    title: 더, 덜, 똑같이
  fr.a1.unit14.lesson02.superlatifs:
    title: 가장 많이, 가장 적게
  fr.a1.unit14.lesson03.dialogue_comparer_fromages:
    title: 시장에서 두 가지 치즈 비교하기
teaching:
  fr.a1.unit14.lesson01.teach.plus_que:
    title: ~보다 더
    gloss: ~보다 더
    note: '*Plus + adjectif + que*는 프랑스어의 기본 비교 표현이에요. 형용사의 형태는 바꾸지 않고, 앞뒤에 단어를 놓아서 비교해요.'
    example_gloss: 이 치즈는 다른 치즈보다 더 비싸요.
  fr.a1.unit14.lesson01.teach.moins_que:
    title: ~보다 덜
    gloss: ~보다 덜
    note: '*Moins*는 같은 비교 구문에서 *plus*의 정반대 표현이에요.'
    example_gloss: 이 레시피는 다른 레시피보다 덜 어려워요.
  fr.a1.unit14.lesson01.teach.aussi_que:
    title: ~만큼 …한
    gloss: ~만큼
    note: '*Aussi + adjective + que*는 두 대상이 서로 같은 정도임을 나타내요.'
    example_gloss: 타르트는 키슈만큼 맛있어요.
  fr.a1.unit14.lesson01.teach.meilleur_que:
    title: ~보다 더 좋은
    gloss: ~보다 더 좋은
    note: '*Meilleur*는 *bon*(좋은)의 불규칙 비교급이에요. 프랑스어에서는 *plus bon*이라고 하지 않아요.'
    example_gloss: 이 케이크가 첫 번째 것보다 더 맛있어요.
  fr.a1.unit14.lesson01.teach.cher_bon_marche:
    title: 비싼, 저렴한
    gloss: 비싼, 저렴한
    note: '*Bon marché*는 형태가 변하지 않아요. 다른 형용사처럼 일치시켜야 할 것 같지만 그렇지 않아요.'
    example_gloss:
    - 치즈가 비싸요.
    - 채소가 싸요.
  fr.a1.unit14.lesson01.teach.facile_difficile:
    title: 쉬운, 어려운
    gloss: 쉬운, 어려운
    note: 요리법을 설명할 때 자주 쓰는 형용사 쌍이에요. 둘 다 남성형과 여성형이 같고, 복수형은 -s를 붙여요 (*faciles*, *difficiles*).
    example_gloss:
    - 이 요리법은 쉬워요.
    - 키슈는 조금 어려워요.
  fr.a1.unit14.lesson02.teach.le_plus_cher:
    title: 가장 비싼
    gloss: 가장 비싼
    note: '*Le/la plus + 형용사*는 최상급을 만들어요. 비교급과 달리 정관사가 꼭 필요해요.'
    example_gloss: 시장에서 가장 비싼 치즈예요.
  fr.a1.unit14.lesson02.teach.la_moins_chere:
    title: 가장 싸지 않은, 가장 덜 비싼
    gloss: 가장 덜 비싼
    note: '*La moins chère*는 여성 명사 *recette*에 맞춘 형태예요. 남성형은 *le moins cher*예요.'
    example_gloss: 가장 덜 비싼 요리법이에요.
  fr.a1.unit14.lesson02.teach.le_meilleur:
    title: 가장 좋은
    gloss: 가장 좋은
    note: '*Le meilleur*는 *bon*의 불규칙 최상급이에요. 앞서 배운 불규칙 비교급 *meilleur*와 같은 형태예요.'
    example_gloss: 워크숍에서 가장 맛있는 케이크예요!
  fr.a1.unit14.lesson02.teach.la_plus_facile:
    title: 가장 쉬운
    gloss: 가장 쉬운
    note: '*le/la plus + 형용사* 패턴을 그대로 따르는 규칙 최상급이에요.'
    example_gloss: 만들기 가장 쉬운 요리법이에요.
  fr.a1.unit14.lesson02.teach.grammar_superlative_note:
    title: 최상급 패턴
    gloss: le/la plus + 형용사, meilleur는 불규칙
    note: 프랑스어 최상급은 대부분 규칙적이라 *le/la plus + 형용사* 형태를 써요. 하지만 *bon* → *meilleur* → *le meilleur*는 따로 외워야 하는 예외예요.
  fr.a1.unit14.lesson02.teach.comparer_les_prix:
    title: 가격 비교를 제안하기
    gloss: 사기 전에 가격을 비교해 봐요.
    note: '*Comparons*는 *comparer*의 *nous* 명령형으로 "비교해 봐요"라는 뜻이에요. 쇼핑할 때 자연스럽게 쓰는 표현이에요.'
  fr.a1.unit14.lesson03.teach.line01:
    title: 선택지가 두 개임을 알아차리기
    gloss: Inès가 치즈가 두 종류 있다며, 어느 것을 살지 물어봐요.
    note: '*Lequel*(어느 것)은 이미 언급된 두 선택지 중에서 고르라고 상대에게 물을 때 써요.'
  fr.a1.unit14.lesson03.teach.line02:
    title: 비교하고 품질 말하기
    gloss: Mathieu가 이게 다른 것보다 더 비싸지만 더 맛있어 보인다고 말해요.
    note: '*Avoir l''air* + 형용사(~해 보이다)는 아직 먹어 보지 않은 품질을 조심스럽게 말할 때 써요.'
  fr.a1.unit14.lesson03.teach.line03:
    title: 비교에 반대하기
    gloss: Inès가 정말 그런지 되묻고, 자기는 다른 것도 똑같이 맛있고 더 싸다고 말해요.
    note: 앞서 배운 *aussi*와 *moins*를 한 번에 써서 정중하게 반대하는 말이에요. 비교 대상(Mathieu의 치즈)이 문맥상 분명해서 *que*는 생략했어요.
  fr.a1.unit14.lesson03.teach.line04:
    title: 가격을 인정하기
    gloss: Mathieu가 맞다고, 둘 중 가장 싼 거라고 동의해요.
    note: '*Des deux*(둘 중)는 최상급의 범위를 시장 전체가 아니라 이 두 개로 좁혀 줘요.'
  fr.a1.unit14.lesson03.teach.line05:
    title: 최종 결정하기
    gloss: Inès가 그럼 저걸로 하자고, 워크숍에 가장 좋은 선택이라고 말해요.
    note: '*Celui-là*(저것)는 방금 이야기한 더 싼 치즈를 다시 가리켜요.'
  fr.a1.unit14.lesson03.teach.line06:
    title: 좋은 점 말하기
    gloss: Mathieu가 동의하며, 디저트에 쓸 돈이 더 남겠다고 말해요!
    note: '*Il nous reste*(우리에게 남아 있다)는 "우리에게 ~이 남아 있다"라고 말할 때 흔히 쓰는 표현이에요.'
exercises:
  fr.a1.unit14.lesson01.exercise01.select_plus_que:
    instruction: '"~보다 더 …한"을 뜻하는 패턴은 무엇일까요?'
    correct_option: plus... que
    distractors:
    - moins... que
    - aussi... que
    accepted_answers:
    - plus... que
    - plus que
  fr.a1.unit14.lesson01.exercise02.listen_plus_cher_que:
    instruction: 잘 듣고 들리는 표현을 고르세요.
    correct_option: plus cher que
    distractors:
    - moins cher que
    - aussi cher que
    accepted_answers:
    - plus cher que
  fr.a1.unit14.lesson01.exercise03.match_comparison_words:
    instruction: 각 프랑스어 비교 표현을 알맞은 한국어 뜻과 연결하세요.
    correct_response:
      plus... que: ~보다 더
      moins... que: ~보다 덜
      aussi... que: ~만큼
      meilleur que: ~보다 더 좋은
      bon marché: 저렴한 / 가성비 좋은
      facile: 쉬운
      difficile: 어려운
    pairs:
    - left: plus... que
      right: ~보다 더
    - left: moins... que
      right: ~보다 덜
    - left: aussi... que
      right: ~만큼
    - left: meilleur que
      right: ~보다 더 좋은
    - left: bon marché
      right: 저렴한 / 가성비 좋은
    - left: facile
      right: 쉬운
    - left: difficile
      right: 어려운
  fr.a1.unit14.lesson01.exercise04.order_cette_recette_moins_difficile:
    instruction: '문장을 만드세요: 이 요리법은 다른 것보다 덜 어려워요.'
    correct_response:
    - Cette
    - recette
    - est
    - moins
    - difficile
    - que
    - l'autre
  fr.a1.unit14.lesson01.exercise05.fill_aussi_que:
    instruction: '"~만큼"에 해당하는 단어로 문장을 완성하세요.'
    accepted_answers:
    - aussi
    prompt_blocks:
      '0': La tarte est ___ bonne que la quiche. (~만큼)
  fr.a1.unit14.lesson01.exercise06.speak_compare_two_items:
    instruction: 이 치즈가 다른 것보다 더 비싸다(또는 덜 비싸다)고 소리 내어 말해 보세요.
    accepted_answers:
    - Ce fromage est plus cher que l'autre.
    - Ce fromage est moins cher que l'autre.
  fr.a1.unit14.lesson02.exercise01.select_le_plus_cher:
