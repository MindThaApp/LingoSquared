    title: 누가 어떻게 이동할까요?
    gloss: Camille은 매일 기차를 타고 출근해요. Mathieu는 주로 자전거로 가지만, 비가 오면 기차도 타요. Thomas는 차를 운전해서 가는 것을 더 좋아해요. Léa는 아주 가까이 살아서 직장까지 걸어가요. 당신은 어떻게 출근해요?
    note: 출근하는 네 가지 방법과 한 가지 조건(비)을 서로 대비해서 보여 줘요.
    glosses:
      voyage: 타고 가요
      tous: 매
      jours: 날
      train: 기차
      travail: 일, 직장
      vélo: 자전거를 타요
      surtout: 보통
      pleut: 비가 와요
      prend: 타요
      aller: 운전해요
