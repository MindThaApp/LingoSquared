answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: 프랑스어 A1
  description: 기본적인 길 묻기와 길 안내(à gauche/à droite, tout droit, au coin de la rue, traverser)를 배우며, 이네스가 주방용품 가게를 찾는 요리 워크숍 이야기를 이어 가요. 프랑스어에서는 길을 안내할 때 vous 명령형("Tournez à gauche")이나 현재형("Tu tournes à gauche")을 쓸 수 있다는 점도 짚어 줘요.
units:
  fr.a1.unit09.directions:
    title: 어떻게 가요?
lessons:
  fr.a1.unit09.lesson01.vocabulaire_directions:
    title: 길 찾기 표현
  fr.a1.unit09.lesson02.donner_des_indications:
    title: 길 안내하기
  fr.a1.unit09.lesson03.dialogue_chercher_la_boutique:
    title: 가게 찾기
teaching:
  fr.a1.unit09.lesson01.teach.a_gauche:
    title: 왼쪽에
    gloss: 왼쪽에, 왼쪽으로
    note: '*À gauche*는 위치("왼쪽에 있어요")와 방향("왼쪽으로 도세요")에 모두 쓰여요.'
    example_gloss: 빵집 다음에서 왼쪽으로 도세요.
  fr.a1.unit09.lesson01.teach.a_droite:
    title: 오른쪽에
    gloss: 오른쪽에, 오른쪽으로
    note: '*à gauche*의 정반대 표현으로, 똑같이 쓰여요.'
    example_gloss: 약국은 카페 오른쪽에 있어요.
  fr.a1.unit09.lesson01.teach.tout_droit:
    title: 직진
    gloss: 곧장, 똑바로
    note: '*Tout droit*는 "곧장"이라는 뜻이에요. 모양이 비슷하지만 "오른쪽으로"를 뜻하는 *à droite*와 헷갈리지 마세요.'
    example_gloss: 시장까지 계속 직진하세요.
  fr.a1.unit09.lesson01.teach.au_coin_de_la_rue:
    title: 길모퉁이에
    gloss: 길모퉁이에
    note: '*Au coin de*는 "~의 모퉁이에"라는 뜻이고, *au coin de la rue*(길모퉁이에)는 아주 흔히 쓰는 위치 표현이에요.'
    example_gloss: 가게는 길모퉁이에 있어요.
  fr.a1.unit09.lesson01.teach.traverser:
    title: 건너다
    gloss: 건너다
    note: '*Traverser*는 규칙 변화하는 -ER 동사예요: *je traverse*, *tu traverses* 등.'
    example_gloss: 가게에 가려면 길을 건너야 해요.
  fr.a1.unit09.lesson01.teach.la_boutique:
    title: 가게
    gloss: 가게
    note: '*La boutique*는 보통 대형 매장과 달리 특정 물건을 파는 작은 가게를 뜻해요.'
    example_gloss: 가게는 길모퉁이 오른쪽에 있어요.
  fr.a1.unit09.lesson01.teach.le_carrefour:
    title: 교차로
    gloss: 교차로, 사거리
    note: '*Le carrefour*는 두 길이 만나는 곳으로, 말로 길을 안내할 때 자주 쓰는 지표예요.'
    example_gloss: 교차로에서 왼쪽으로 도세요.
  fr.a1.unit09.lesson02.teach.pour_aller_a:
    title: 가는 방법 묻기
    gloss: 실례합니다, 가게에 어떻게 가면 되나요?
    note: '*Pour aller à... ?*(직역하면 "~에 가기 위해")는 어떤 장소로 가는 길을 정중하게 물을 때 쓰는 기본 표현이에요.'
  fr.a1.unit09.lesson02.teach.tournez_a_gauche:
    title: 왼쪽으로 돌기
    gloss: 약국 다음에서 왼쪽으로 도세요.
    note: '*Tournez*는 *tourner*(돌다)의 *vous* 명령형으로, 잘 모르는 사람에게 길을 안내할 때 쓰는 일반적인 말투예요.'
  fr.a1.unit09.lesson02.teach.continuez_tout_droit:
    title: 계속 직진하기
    gloss: 교차로까지 계속 직진하세요.
    note: '*Continuez*(계속 가세요) + *tout droit*(곧장)는 방향을 틀지 않고 계속 걸으라고 할 때 쓰는 기본 표현이에요.'
  fr.a1.unit09.lesson02.teach.cest_au_coin:
    title: 위치 말하기
    gloss: 길모퉁이 오른쪽에 있어요.
    note: '*au coin de la rue*와 *à droite*를 합쳐 정확한 위치를 알려 줘요.'
  fr.a1.unit09.lesson02.teach.cest_loin:
    title: 멀지 않다고 말하기
    gloss: 멀지 않아요, 걸어서 5분이에요.
    note: '*À cinq minutes à pied*(걸어서 5분)는 마티외가 약국에 대해 물었을 때 본 도보 시간 표현과 같은 방식이에요.'
  fr.a1.unit09.lesson03.teach.line01:
    title: 가게 물어보기
    gloss: 이네스가 마티외에게 주방용품을 살 만한 가게를 아는지 물어요.
    note: '*Tu connais... ?*(~ 알아?)는 어떤 장소를 아는지 편하게 물을 때 쓰는 기본 표현이에요.'
  fr.a1.unit09.lesson03.teach.line02:
    title: 첫 단계 알려 주기
    gloss: 마티외는 여기서 멀지 않은 곳에 하나 있고, 교차로에서 왼쪽으로 돌면 된다고 말해요.
    note: '*Il y en a une*(하나 있어요)에서 *en*은 *boutique*를 다시 말하지 않으려고 쓰였어요. 구어체 프랑스어에서 흔한 줄임 방식이에요.'
  fr.a1.unit09.lesson03.teach.line03:
    title: 확인하고 더 묻기
    gloss: 이네스는 교차로에서 왼쪽이라는 것을 확인하고, 그다음에는 어떻게 하는지 물어요.
    note: '*Et ensuite ?*(그다음에는요?)는 길 안내의 다음 단계를 묻는 간단하고 자연스러운 표현이에요.'
  fr.a1.unit09.lesson03.teach.line04:
    title: 두 번째 단계 알려 주기
    gloss: 마티외가 그다음에는 계속 직진해서 길을 건너라고 말해요.
    note: 방향을 나타내는 동사 두 개를 *et*로 이어서 짧은 길 안내를 하는 자연스러운 방법이에요.
  fr.a1.unit09.lesson03.teach.line05:
    title: 정확히 어디인지 묻기
    gloss: 이네스가 가게가 정확히 어디에 있는지 물어요.
    note: '*Exactement*(정확히)는 대략적인 방향보다 더 구체적인 대답을 요청할 때 써요.'
  fr.a1.unit09.lesson03.teach.line06:
    title: 정확한 위치 알려 주기
    gloss: 마티외가 가게는 길모퉁이에 있고, 빵집 바로 맞은편이라고 말해요.
    note: '*En face de*(~의 맞은편)는 눈에 띄는 건물을 기준으로 위치를 알려 주는 표현으로, 길 안내를 마무리할 때 자연스럽게 쓰여요.'
