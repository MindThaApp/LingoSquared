teaching:
  fr.a1.unit52.lesson01.teach.lire_faire_du:
    title: 독서, 운동, 요리
    gloss: 읽다, 운동하다, 요리하다
    note: '자주 쓰는 취미 동사 세 개예요: *lire*(읽다), *faire du sport*(운동하다), *cuisiner*(요리하다).'
    example_gloss:
    - 저는 책 읽는 것을 좋아해요.
    - 저는 토요일마다 운동해요.
    - 저는 친구들을 위해 요리하는 것을 좋아해요.
  fr.a1.unit52.lesson01.teach.le_temps_libre:
    title: 여가 시간
    gloss: 시간
    note: '*Temps libre*는 남성 명사라서 *le temps libre*라고 해요. 취미를 말할 때 꼭 필요한 표현이에요.'
    example_gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
  fr.a1.unit52.lesson01.teach.pendant_mon_temps:
    title: 여가 시간에 하는 일 말하기
    gloss: 저는 여가 시간에 독서하는 것을 좋아해요.
    note: '*Lis*는 *lire*(읽다)의 *je* 형태예요. 끝의 *s*는 발음하지 않아요.'
  fr.a1.unit52.lesson02.teach.ecouter_de_la:
    title: 음악, 그림 그리기, 비디오 게임
    gloss: 음악을 듣다, 그림을 그리다, 비디오 게임을 하다
    note: '취미 세 개가 더 있어요: *écouter de la musique*, *dessiner*, *jouer aux jeux vidéo*. 게임을 말할 때는 *jouer à* + *les*가 *jouer aux*로 바뀌어요.'
    example_gloss:
    - 저는 음악 듣는 것을 좋아해요.
    - 저는 그림을 자주 그려요.
    - 저는 친구들과 비디오 게임 하는 것을 좋아해요.
  fr.a1.unit52.lesson02.teach.j_aime_ecouter:
    title: 음악 듣기를 좋아한다고 말하기
    gloss: 저는 음악 듣는 것을 좋아해요.
    note: '*Écouter*는 뒤에 다른 단어 없이 바로 목적어가 와요: *écouter de la musique*.'
  fr.a1.unit52.lesson02.teach.j_aime_jouer:
    title: 친구들과 게임하는 것을 좋아한다고 말하기
    gloss: 저는 친구들과 비디오 게임 하는 것을 좋아해요.
    note: '*Avec des amis*(친구들과)의 *amis*는 1과에서 나왔어요. *des*는 ''몇몇''을 뜻하는 복수 부정관사예요.'
  fr.a1.unit52.lesson03.teach.toujours_souvent_parfois:
    title: 항상, 자주, 가끔, 전혀 ~않다
    gloss: 항상, 자주, 가끔, 절대 ~않다
    note: 기본 빈도 부사 네 개예요. *Souvent*은 이미 알고 있을 수도 있고, *toujours*, *parfois*, *jamais*는 새로운 단어예요. *Jamais*는 동사 앞에 *ne*가 필요해요.
    example_gloss:
    - 저는 토요일마다 항상 운동해요.
    - 저는 책을 자주 읽어요.
    - 저는 가끔 그림을 그려요.
    - 저는 게임을 전혀 안 해요.
  fr.a1.unit52.lesson03.teach.chaque_semaine_chaque:
    title: 매주, 주말마다
    gloss: 매주, 주말마다
    note: '*Chaque semaine*과 *chaque week-end*는 둘 다 ''매~''라는 뜻이에요. *Chaque*는 명사의 성에 관계없이 모양이 변하지 않아요.'
    example_gloss:
    - 저는 매주 친구들을 위해 요리해요.
    - 저는 주말마다 운동해요.
  fr.a1.unit52.lesson03.teach.chaque_ne_change:
    title: Chaque는 절대 변하지 않아요
    gloss: '*Chaque*는 남성 명사 앞에서도 여성 명사 앞에서도 똑같아요: *chaque semaine*, *chaque week-end*.'
    note: '*Semaine*는 여성 명사이고 *week-end*는 남성 명사지만, *chaque*는 둘 다 똑같아요. 반면 *tous les* / *toutes les*는 형태가 바뀌어요.'
  fr.a1.unit52.lesson03.teach.qu_est_ce:
    title: 여가 시간에 대해 묻기
    gloss: 여가 시간에 무엇을 하나요?
    note: 이 단원의 핵심 질문이에요. 누구에게든 취미를 물을 때 이 문장을 쓰세요.
  fr.a1.unit52.lesson04.teach.camille_on_se:
    title: 카미유가 취미 이야기를 꺼내요
    gloss: '카미유: 우리는 자주 같이 산책하잖아요. 그런데 마티외, 여가 시간에 또 뭘 해요?'
    note: '*On se promène souvent*에서 *on*은 ''우리''라는 뜻이고, *souvent*은 동사 바로 뒤에 와요.'
  fr.a1.unit52.lesson04.teach.mathieu_j_aime:
    title: 마티외의 취미
    gloss: '마티외: 요리하는 걸 좋아해요, 집에서도요. 그리고 운동도 자주 해요.'
    note: '*Même à la maison*(집에서도)이라는 말로, 마티외가 일 때문만이 아니라 즐거워서 요리한다는 것을 알 수 있어요.'
  fr.a1.unit52.lesson04.teach.camille_tu_cuisines:
    title: 카미유가 놀라요
    gloss: '카미유: 집에서도 요리해요? 직장에서 이미 하루 종일 요리하잖아요!'
    note: '*Toute la journée*(하루 종일)는 마티외가 직장에서 이미 요리를 얼마나 많이 하는지 강조해요.'
  fr.a1.unit52.lesson04.teach.mathieu_oui_mais:
    title: 마티외가 설명해요
    gloss: '마티외: 네, 하지만 저는 요리가 편안하게 느껴져요. 그런데 당신은 뭘 하는 걸 좋아해요?'
    note: '*Cuisiner, je trouve ça relaxant*은 강조하려고 *cuisiner*를 맨 앞에 둔 문장이에요. 직역하면 ''요리하는 것, 나는 그게 편안하다고 생각해요''예요.'
  fr.a1.unit52.lesson04.teach.camille_j_aime:
    title: 카미유의 취미
    gloss: '카미유: 저는 책 읽는 걸 좋아하고 음악도 자주 들어요.'
    note: 1과와 2과에서 배운 취미 두 가지를 *et*(그리고)로 한 문장에 이어요.
  fr.a1.unit52.lesson04.teach.mathieu_tu_joues:
    title: 마티외가 게임에 대해 물어요
    gloss: '마티외: 당신도 비디오 게임을 해요?'
    note: '예/아니요로 답하는 짧은 질문이에요: *Tu joues aussi aux jeux vidéo ?* 끝을 올려 말하면 의문문이 돼요.'
  fr.a1.unit52.lesson04.teach.camille_non_je:
    title: 카미유가 대답해요
    gloss: '카미유: 아니요, 저는 비디오 게임은 전혀 안 해요. 대신 가끔 그림을 그려요!'
    note: 3과에서 배운 *jamais*(절대 ~않다)와 *parfois*(가끔)를 한 대답 안에서 대조해요.
  fr.a1.unit52.lesson05.teach.mathieu_et_moi:
    title: 취미 비교하기
    gloss: 마티외와 저는 자주 함께 산책해요. 하지만 다른 취미도 있어요. 마티외는 집에서도 요리하는 것을 좋아하고, 운동도 자주 해요. 저는 책 읽는 것을 좋아하고 음악도 자주 들어요. 가끔 그림을 그리지만 비디오 게임은 절대 하지 않아요. 여러분은 여가 시간에 무엇을 하는 것을 좋아하나요?
    note: 카미유의 메시지는 앞에서 배운 내용을 정리하고, 이 단원의 핵심 질문을 읽는 사람에게 던지며 끝나요.
    glosses:
      promène: 산책하다
      souvent: 자주
      ensemble: 함께
      d'autres: 다른
      cuisiner: 요리하다
      aime: 즐겨
      maison: 집에서
      sport: 운동하다
      lire: 읽다
      j'écoute: 듣다
      musique: 음악
      dessine: 그리다
      parfois: 가끔
      jeux: 게임하다
      jamais: 전혀 하지 않다
      libre: 자유로운
      temps: 시간
  fr.a1.unit52.lesson06.teach.mathieu_qu_est:
    title: 마티외가 주말 계획을 물어요
    gloss: '마티외: 이번 주말에 뭐 해요?'
    note: '*Ce week-end*(이번 주말)에서 *week-end*가 남성 명사라서 *ce*를 써요.'
  fr.a1.unit52.lesson06.teach.camille_je_ne:
    title: 카미유는 아직 정하지 못했어요
    gloss: '카미유: 아직 모르겠어요. 책 읽는 것도 좋지만 밖에 나가고도 싶어요.'
    note: '*Sortir*(나가다)는 집 밖으로 나가고 싶다고 말할 때 흔히 쓰는 표현이에요.'
  fr.a1.unit52.lesson06.teach.mathieu_on_se:
    title: 마티외가 계획을 제안해요
    gloss: '마티외: 같이 산책할까요? 그 후에 제가 우리를 위해 요리할게요.'
    note: '*Après*(그 후에)는 *d''abord*, *ensuite*처럼 두 계획의 순서를 나타내요.'
  fr.a1.unit52.lesson06.teach.camille_bonne_idee:
    title: 카미유가 동의해요
    gloss: '카미유: 좋은 생각이에요! 저는 산책하는 것도 요리하는 것도 똑같이 좋아해요.'
    note: '*Autant ... que*(~만큼 ...)는 카미유가 두 가지를 똑같이 좋아하고, 어느 한쪽을 더 좋아하지 않는다는 것을 보여 줘요.'
  fr.a1.unit52.lesson06.teach.mathieu_parfait_alors:
    title: 마티외가 약속을 확정해요
    gloss: '마티외: 좋아요. 그럼 토요일에 봐요!'
    note: '*samedi*(토요일)의 약속을 확인하는 다정한 마무리 인사예요.'
