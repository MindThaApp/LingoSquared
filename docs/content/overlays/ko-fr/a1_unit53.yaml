teaching:
  fr.a1.unit53.lesson01.teach.grand_petit:
    title: 키가 큰, 키가 작은
    gloss: 키가 큰 / 키가 작은
    note: '*Grand*는 키가 큰 사람을, *petit*는 키가 작은 사람을 나타내요. 사람에 맞춰 형태가 바뀌어요: *grand/grande*, *petit/petite*.'
    example_gloss:
    - Léa는 키가 커요.
    - Thomas는 키가 작아요.
  fr.a1.unit53.lesson01.teach.vieux_jeune:
    title: 나이 든, 젊은
    gloss: 나이 든 / 젊은
    note: 여기서 *vieux*와 *jeune*는 정확한 나이가 아니라 전반적인 나이의 인상을 나타내요.
    example_gloss:
    - 할아버지는 연세가 많으세요.
    - Mathieu는 젊어요.
  fr.a1.unit53.lesson01.teach.pour_un_age:
    title: '나이: 숫자 또는 인상'
    gloss: 정확한 나이는 *avoir*로 말하지만(*Il a vingt ans*), *être vieux*는 전반적인 인상을 나타내요(*Mon grand-père est vieux*).
    note: 정확한 나이를 묻는 *Quel âge as-tu ?*는 이미 배웠어요. 여기서 *vieux*는 숫자 없이 어떻게 '보이는지'를 나타내요.
  fr.a1.unit53.lesson01.teach.lea_est_grande:
    title: Léa는 키가 크고 Thomas는 키가 작아요
    gloss: Léa는 키가 크고 Thomas는 키가 작아요.
    note: '*et*(''그리고'')로 이은 간단한 문장으로, 5과의 직접 비교를 준비해요.'
  fr.a1.unit53.lesson02.teach.les_cheveux:
    title: 머리카락
    gloss: 머리카락
    note: '*Les cheveux*는 항상 복수형이고 남성이에요. 우리말 ''머리카락''에는 복수 표시가 없지만, 프랑스어에서는 항상 복수로 써요.'
    example_gloss: Mathieu는 짧은 검은 머리예요.
  fr.a1.unit53.lesson02.teach.blonds_bruns_gris:
    title: 금발, 갈색, 회색
    gloss: 금발 / 갈색 / 회색
    note: '머리 색깔 세 가지예요. *cheveux*와 함께 쓰면 색깔 단어에 복수 *s*가 붙어요: *blonds*, *bruns*. *Gris*는 이미 *s*로 끝나고, *noirs*(검은색)는 의류 단원에서 다시 가져왔어요.'
    example_gloss:
    - Camille는 금발 머리예요.
    - Thomas는 갈색 머리예요.
    - 할아버지는 백발이에요.
  fr.a1.unit53.lesson02.teach.longs_courts:
    title: 긴 머리, 짧은 머리
    gloss: 긴 / 짧은 (머리)
    note: '*Longs*(긴)는 1과에서 배운 키의 개념을 머리카락 길이에 쓴 거예요. *Courts*(짧은)는 여기서 처음 나오며, 둘 다 *cheveux*와 함께 쓰면 복수 *s*가 붙어요.'
    example_gloss:
    - Léa는 긴 머리예요.
    - Thomas는 짧은 머리예요.
  fr.a1.unit53.lesson02.teach.cheveux_est_toujours:
    title: Cheveux에는 복수형 형용사를 써요
    gloss: '*Cheveux*는 항상 복수형이라서 형용사에 *s*가 붙어요: *longs*, *courts*, *blonds*, *bruns*, *noirs*. *Gris*는 이미 *s*로 끝나요.'
    note: '색깔과 길이를 나타내는 말은 복수형 *cheveux*에 맞춰요: *les cheveux longs*. 3과의 *yeux*와 비교해 보세요. 거기서 *marron*은 변하지 않아요.'
  fr.a1.unit53.lesson02.teach.ses_est_le:
    title: 'Ses: 그의 또는 그녀의'
    gloss: '*Ses*는 복수 명사 앞에서 ''그의'' 또는 ''그녀의''라는 뜻이에요: *ses cheveux*, *ses yeux*. 소유하는 사람이 아니라 소유되는 것에 맞춰 형태가 정해져요.'
    note: 여기서 프랑스어는 '그의'와 '그녀의'를 구별하지 않아요. *ses yeux*는 '그녀의 눈'도 되고 '그의 눈'도 되며, 어느 쪽인지는 문맥으로 알 수 있어요.
  fr.a1.unit53.lesson02.teach.mathieu_a_les:
    title: Mathieu는 짧은 검은 머리예요
    gloss: Mathieu는 짧은 검은 머리예요.
    note: 의류 단원의 *noirs*(검은색)를 다시 써요.
  fr.a1.unit53.lesson02.teach.camille_a_les:
    title: Camille는 긴 금발 머리예요
    gloss: Camille는 긴 금발 머리예요.
    note: 이번 과의 길이와 색 어휘를 자연스러운 한 문장에 모았어요.
  fr.a1.unit53.lesson03.teach.les_yeux:
    title: 눈
    gloss: 눈
    note: '*Les yeux*는 *l''œil*(눈)의 복수형이에요. *yeux*는 *s*가 아니라 *x*로 끝나요.'
    example_gloss: Mathieu는 눈이 갈색이에요.
  fr.a1.unit53.lesson03.teach.bleus_marron_verts:
    title: 파란색, 갈색, 초록색
    gloss: 파란색 / 갈색 / 초록색
    note: '*Bleus*(파란)는 앞서 의류에서 배웠고, *marron*(갈색)은 형태가 변하지 않으며, *verts*(초록색)는 새로 나온 단어예요.'
    example_gloss:
    - Camille는 눈이 파래요.
    - Thomas는 눈이 갈색이에요.
    - Léa는 눈이 초록색이에요.
  fr.a1.unit53.lesson03.teach.avec_yeux_pluriel:
    title: Yeux에는 -s가 붙고, marron은 그대로예요
    gloss: '*yeux*(복수)와 함께 쓰면 형용사에 *s*가 붙어요: *yeux bleus*, *yeux verts*. *Marron*은 변하지 않아요: *yeux marron*.'
    note: 2과의 *cheveux*와 비교해 보세요. 복수 명사에는 복수형 형용사를 쓰지만, 명사에서 온 *marron* 같은 색깔 단어는 예외예요.
  fr.a1.unit53.lesson03.teach.comment_est_camille:
    title: Camille는 어떻게 생겼어요?
    gloss: Camille는 어떻게 생겼어요?
    note: '*Comment est ... ?*는 이 단원의 핵심 질문이에요. 누구의 외모든 물어볼 때 쓸 수 있어요.'
  fr.a1.unit53.lesson03.teach.camille_a_les:
    title: Camille는 긴 금발 머리에 눈이 파래요
    gloss: Camille는 긴 금발 머리에 눈이 파래요.
    note: 머리카락과 눈을 *et*('그리고')로 한 문장에 묶은 모범 답안이에요.
  fr.a1.unit53.lesson04.teach.camille_une_nouvelle:
    title: Camille가 Nina를 소개해요
    gloss: 'Camille: 새로운 여자아이가 언어 카페에 와요. 이름은 Nina예요.'
    note: '*Une nouvelle fille vient*는 장면에 새로운 사람을 소개하는 표현이에요. *vient*는 *venir*(오다)에서 왔어요.'
  fr.a1.unit53.lesson04.teach.mathieu_d_accord:
    title: Mathieu가 어떻게 생겼는지 물어봐요
    gloss: 'Mathieu: 알겠어요! 어떻게 생겼어요?'
    note: '핵심 질문에 이름 대신 *elle*(그녀)을 넣어 다시 썼어요: *Comment est-elle ?* 하이픈이 동사와 대명사를 이어 줘요.'
  fr.a1.unit53.lesson04.teach.camille_elle_est:
    title: Camille가 Nina의 키와 머리카락을 묘사해요
    gloss: 'Camille: 키가 작고 짧은 금발 머리예요.'
    note: 1과의 *petite*와 2과의 머리카락 어휘를 합쳤어요. 여자에게는 *petite*처럼 *e*가 붙어요.
  fr.a1.unit53.lesson04.teach.mathieu_et_ses:
    title: Mathieu가 눈에 대해 물어봐요
    gloss: 'Mathieu: 눈은요?'
    note: 여기서 *Ses yeux*는 '그녀의 눈'이라는 뜻이에요. *ses*는 그 여자아이가 아니라 *yeux*에 맞춘 형태예요.
  fr.a1.unit53.lesson04.teach.camille_elle_a:
    title: Camille가 Nina의 눈을 묘사해요
    gloss: 'Camille: 눈이 초록색이에요.'
    note: 3과의 *yeux verts*를 다시 써요.
  fr.a1.unit53.lesson04.teach.mathieu_merci_alors:
    title: Mathieu가 그녀를 알아볼 거예요
    gloss: 'Mathieu: 고마워요! 그럼 알아볼 수 있겠어요.'
    note: '*Je vais la reconnaître*는 *aller* + 동사원형으로 가까운 미래를 나타내고, *la*는 ''그녀를''이라는 뜻이에요.'
  fr.a1.unit53.lesson05.teach.thomas_et_lea:
    title: Thomas와 Léa 비교하기
    gloss: Thomas와 Léa는 남매이지만 서로 달라요. Thomas는 키가 작고 짧은 갈색 머리에 눈이 갈색이에요. Léa는 Thomas보다 키가 크고 긴 갈색 머리에 눈이 초록색이에요. 당신은 어떻게 생겼어요?
    note: 지금까지 배운 색과 길이 어휘를 모두 다시 쓴 짧은 비교 글이에요. 마지막에는 이번 단원의 핵심 질문을 읽는 사람에게 던져요.
    glosses:
      frère: 남자 형제
      sœur: 여자 형제
      ressemblent: ~해 보이다
      différents: 다른
      petit: 짧은
      courts: 짧은
      bruns: 갈색
      cheveux: 머리카락
      marron: 갈색
      yeux: 눈
      grande: 키가 더 큰
      longs: 긴
      verts: 초록색
      se: ('se ressemblent'의 일부 = 서로 닮다)
  fr.a1.unit53.lesson05.teach.tu_connais_deja:
    title: 사람에게 쓰는 Plus ... que
    gloss: '*plus* + 형용사 + *que* 구조는 이미 알고 있어요. 여기서는 사람에게 써요: Léa는 Thomas보다 키가 커요.'
    note: 쇼핑 단원에서 본 *plus ... que* 구문과 같은데, 이번에는 사물이 아니라 사람에 쓰였어요. *Grande*는 여자인 *Léa*에 맞춰 형태가 바뀐 거예요.
  fr.a1.unit53.lesson05.teach.lea_a_les:
    title: 레아는 토마보다 머리가 길어요
    gloss: 레아는 토마보다 머리가 길어요.
    note: '*Plus longs que*는 복수형인 *cheveux*에 맞춰 쓰였어요: *les cheveux plus longs que Thomas*.'
  fr.a1.unit53.lesson05.teach.j_ai_les:
    title: 저는 짧은 갈색 머리예요
    gloss: 저는 짧은 갈색 머리예요.
    note: '*J''ai ...*를 사용한 1인칭 예문이에요. 자신의 외모를 설명할 때 그대로 활용할 수 있어요.'
  fr.a1.unit53.lesson06.teach.mathieu_regarde_c:
    title: 마티외가 니나를 발견해요
    gloss: '마티외: 저기 봐, 니나 맞아? 짧은 금발 머리에 초록색 눈이야.'
    note: '*Regarde*(봐)는 *regarder*의 *tu*에 대한 명령형이에요. 앞의 대화에서도 같은 방식으로 쓰였어요.'
  fr.a1.unit53.lesson06.teach.camille_oui_c:
    title: 카미유가 확인해 줘요
    gloss: '카미유: 응, 니나 맞아!'
    note: 짧고 자연스러운 확인 표현이에요.
  fr.a1.unit53.lesson06.teach.nina_salut_tu:
    title: 니나가 마티외에게 인사해요
    gloss: '니나: 안녕, 네가 마티외야?'
    note: '친구 사이에 쓰는 간단한 인사 질문이에요: *Tu es ... ?*'
  fr.a1.unit53.lesson06.teach.mathieu_oui_ravi:
    title: 마티외가 니나에게 인사로 답해요
    gloss: '마티외: 응! 만나서 반가워, 니나.'
    note: '*Ravi de te rencontrer*는 처음 만났을 때 쓰는 표준 표현이에요(남자는 *ravi*, 여자는 *ravie*). 이미 아는 사람에게 쓰는 *content de te revoir*와는 달라요.'
  fr.a1.unit53.lesson06.teach.nina_ravie_de:
    title: Nina도 인사를 받아 줘요
    gloss: 'Nina: 나도 만나서 반가워!'
    note: 대화의 마무리예요. 마티외는 카미유가 앞서 설명해 준 대로 니나를 알아봤어요.
exercises:
  fr.a1.unit53.lesson01.exercise01.choose_lea_est_grande:
    instruction: '''Léa est grande.''의 뜻을 고르세요.'
    correct_option: 레아는 키가 커요.
    distractors:
    - 레아는 키가 작아요.
    - 레아는 나이가 많아요.
    - 레아는 어려요.
    accepted_answers:
    - value: 레아는 키가 커요.
      status: correct
    feedback: Léa est grande.
  fr.a1.unit53.lesson01.exercise02.listen_thomas_est_petit:
    instruction: 듣고 화자가 말하는 내용을 고르세요.
    correct_option: 토마는 키가 작아요.
    distractors:
    - 토마는 키가 커요.
    - 토마는 나이가 많아요.
    - 토마는 어려요.
    accepted_answers:
    - value: 토마는 키가 작아요.
      status: correct
    feedback: Thomas est petit.
  fr.a1.unit53.lesson01.exercise03.match_grand_petit_vieux:
    instruction: 각 프랑스어 단어나 표현을 알맞은 뜻과 연결하세요.
