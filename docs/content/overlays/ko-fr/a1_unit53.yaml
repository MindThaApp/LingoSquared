        right: 키가 큰
      - left: petit
        right: 키가 작은
      - left: vieux
        right: 나이가 많은
      - left: jeune
        right: 젊은
      - left: Léa est grande.
        right: Léa는 키가 커요.
      - left: Thomas est petit.
        right: Thomas는 키가 작아요.
      - left: Mon grand-père est vieux.
        right: 할아버지는 나이가 많으세요.
      status: correct
    feedback: Grand/petit/vieux/jeune는 키와 나이에 대한 일반적인 인상을 나타내요.
    pairs:
    - left: grand
      right: 키가 큰
    - left: petit
      right: 키가 작은
    - left: vieux
      right: 나이가 많은
    - left: jeune
      right: 젊은
    - left: Léa est grande.
      right: Léa는 키가 커요.
    - left: Thomas est petit.
      right: Thomas는 키가 작아요.
    - left: Mon grand-père est vieux.
      right: 할아버지는 나이가 많으세요.
  fr.a1.unit53.lesson01.exercise04.order_lea_est_grande:
    instruction: '''레아는 키가 크고 토마는 키가 작아요.''라는 뜻이 되도록 단어를 순서대로 놓으세요.'
    correct_option: Léa est grande et Thomas est petit
    accepted_answers:
    - value: Léa est grande et Thomas est petit
      status: correct
    feedback: Léa est grande et Thomas est petit.
  fr.a1.unit53.lesson01.exercise05.listen_mon_grand_pere:
    instruction: 들리는 순서대로 단어를 배열하세요.
    correct_option: Mon grand-père est vieux
    accepted_answers:
    - value: Mon grand-père est vieux
      status: correct
    feedback: 완성된 문장은 Mon grand-père est vieux.예요.
  fr.a1.unit53.lesson01.exercise06.translate_jeune:
    instruction: '프랑스어로 번역하세요: 어린.'
    accepted_answers:
    - value: jeune
      status: correct
    feedback: Jeune는 '어린, 젊은'이라는 뜻이에요.
    prompt_blocks:
    - 젊은
