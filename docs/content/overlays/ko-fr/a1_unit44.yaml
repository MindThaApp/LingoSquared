teaching:
  fr.a1.unit44.lesson01.teach.je_ne_me:
    title: 몸이 안 좋을 때
    gloss: 몸이 안 좋아요.
    note: '*Se sentir*는 재귀동사예요(*je me sens*). *ne ... pas bien*은 어딘가 좋지 않다고 말하는 일반적이고 가벼운 표현이에요.'
  fr.a1.unit44.lesson01.teach.malade:
    title: 아픈
    gloss: 아픈
    note: '기본 형용사로, *être*와 함께 써요: *je suis malade*.'
    example_gloss: 저는 아파요.
  fr.a1.unit44.lesson01.teach.je_suis_malade:
    title: 아프다고 말하기
    gloss: 저는 아파요.
    note: '*Malade*는 *pas bien*보다 더 일반적이고 강한 상태를 나타내요.'
  fr.a1.unit44.lesson01.teach.mal_a_la:
    title: 두통
    gloss: 두통
    note: '*Mal à la tête*는 *avoir*와 함께 써요: *j''ai mal à la tête*. *tête*가 여성명사라서 *à la*를 써요.'
    example_gloss: 머리가 아파요.
  fr.a1.unit44.lesson01.teach.j_ai_mal:
    title: 머리가 아플 때
    gloss: 머리가 아파요.
    note: '증상은 *avoir*(가지다)와 함께 써요: *j''ai mal*.'
  fr.a1.unit44.lesson01.teach.mal_au_ventre:
    title: 복통
    gloss: 복통
    note: '*Mal au ventre*에서 *au*는 *à*와 *le*가 합쳐진 형태예요. *ventre*가 남성명사이기 때문이에요.'
    example_gloss: 배가 아파요.
  fr.a1.unit44.lesson01.teach.j_ai_mal_2:
    title: 배가 아플 때
    gloss: 배가 아파요.
    note: '*mal à la tête*와 같은 *avoir* 패턴이지만, *à la* 대신 *au*를 써요.'
  fr.a1.unit44.lesson02.teach.qu_est_ce:
    title: 일반적으로 묻기
    gloss: 무슨 일이에요?
    note: 무슨 문제가 있는지 두루 물을 때 쓰는 표현이에요.
  fr.a1.unit44.lesson02.teach.qu_est_ce_2:
    title: 자주 쓰는 관용 표현
    gloss: 무슨 문제예요?
    note: '*Qu''est-ce qui ne va pas ?*는 고정된 질문으로, 직역하면 ''무엇이 잘 되지 않아요''예요. 단어 그대로 옮기지 마세요.'
  fr.a1.unit44.lesson02.teach.mal_a_la:
    title: 인후통
    gloss: 인후통
    note: '*Mal à la gorge*는 *mal à la tête*와 같아요. *gorge*가 여성명사라서 *à la*를 써요.'
    example_gloss: 목이 아파요.
  fr.a1.unit44.lesson02.teach.j_ai_mal:
    title: 목이 아플 때
    gloss: 목이 아파요.
    note: 다른 증상과 같은 *avoir* 패턴을 따라요.
  fr.a1.unit44.lesson02.teach.ca_va_non:
    title: 상대의 안부 묻기
    gloss: 괜찮아요? 아니요, 몸이 안 좋아요.
    note: '*Ça va ?*는 친구 사이에서 안부를 묻는 아주 흔한 구어체 질문이에요.'
  fr.a1.unit44.lesson03.teach.la_fievre:
    title: 열
    gloss: 열
    note: '*La fièvre*는 여성명사이고, *avoir* 뒤에서 *de la*를 써요: *j''ai de la fièvre*.'
    example_gloss: 열이 있어요.
  fr.a1.unit44.lesson03.teach.j_ai_de:
    title: 열이 있을 때
    gloss: 열이 있어요.
    note: '*avoir* 패턴을 따르며, 부분관사 *de la*가 쓰여요.'
  fr.a1.unit44.lesson03.teach.le_rhume:
    title: 감기에 걸리기
    gloss: 감기
    note: '*Le rhume*는 *avoir*와 함께 쓰는 남성명사예요. *être*와 쓰는 형용사가 아니에요.'
    example_gloss: 감기에 걸렸어요.
  fr.a1.unit44.lesson03.teach.j_ai_un:
    title: 감기에 걸렸다고 말하기
    gloss: 감기에 걸렸어요.
    note: 프랑스어에서는 *j'ai un rhume*(감기를 가지고 있다)라고 말해요. *je suis rhume*라고는 하지 않아요.
  fr.a1.unit44.lesson03.teach.malade_se_dit:
    title: être일까요, avoir일까요?
    gloss: '*Malade*는 형용사라서 *être*와 써요: 저는 아파요. *Mal*, *fièvre*, *rhume*는 명사라서 *avoir*와 써요: 감기에 걸렸어요.'
    note: '*être*와 *avoir* 중 무엇을 쓸지는 품사에 따라 정해져요. *malade* 같은 형용사는 *être*와, *fièvre* 같은 명사는 *avoir*와 함께 써요. 아픈 기간이 짧아도 마찬가지예요.'
  fr.a1.unit44.lesson04.teach.la_pharmacie:
    title: 약국
    gloss: 약국
    note: '*Pharmacie*는 여성명사예요: *la pharmacie*.'
    example_gloss: 약국에 가요.
  fr.a1.unit44.lesson04.teach.je_peux_vous:
    title: 약사의 인사말
    gloss: 무엇을 도와드릴까요?
    note: '*Je peux vous aider ?*는 격식을 갖춘 표준적인 응대 인사예요. *vous*는 존댓말 형태예요.'
  fr.a1.unit44.lesson04.teach.avez_vous_quelque:
    title: 증상에 맞는 약 부탁하기
    gloss: 두통에 듣는 약 있어요?
    note: '*Quelque chose contre* 뒤에 증상을 붙이면 약을 부탁하는 자연스러운 표현이 돼요.'
  fr.a1.unit44.lesson04.teach.un_comprime:
    title: 알약 한 알
    gloss: 알약
    note: '*Comprimé*는 남성 명사예요: *un comprimé*.'
    example_gloss: 저는 알약을 한 알 먹어요.
  fr.a1.unit44.lesson04.teach.prenez_un_comprime:
    title: 복용 안내
    gloss: 알약을 하루에 두 번, 한 알씩 드세요.
    note: '*Prenez*는 *prendre*(먹다, 가지다)의 *vous* 명령형이에요. 안내나 지시를 할 때 써요.'
  fr.a1.unit44.lesson04.teach.a_la_pharmacie:
    title: 약국에서의 말투
    gloss: 약국에서는 존댓말 *vous*를 써요.
    note: 약사는 잘 모르는 서비스 직군의 성인이라서, 매표소에서처럼 *vous*를 써요.
  fr.a1.unit44.lesson05.teach.conseil_prends_un:
    title: 약국 조언 메모 읽기
    gloss: '조언: 알약을 하루에 두 번, 물과 함께 한 알씩 먹어. 푹 쉬고 물을 많이 마셔. 3일이 지나도 여전히 몸이 안 좋아? 그러면 병원에 가 봐.'
    note: 복용 방법, 약 외의 두 가지 권고, 그리고 언제 의사를 찾아가야 하는지에 주목하세요.
    glosses:
      Conseil: 조언
      prends: 먹다
      fois: 번
      jour: 날
      comprimé: 알약
      Repose-toi: 쉬다
      bois: 마시다
      sens: 느끼다
      toujours: 여전히
      bien: 잘
      médecin: 의사
  fr.a1.unit44.lesson06.teach.camille_salut_mathieu:
    title: 카미유가 안부를 물어요
    gloss: '카미유: 안녕 마티외, 잘 지내? 벌써 좀 나아졌어?'
    note: '*Déjà*(벌써)는 카미유가 지난번 이야기한 뒤로 마티외가 나아졌는지 묻고 있음을 보여 줘요.'
  fr.a1.unit44.lesson06.teach.mathieu_pas_encore:
    title: 마티외는 아직 몸이 안 좋아요
    gloss: '마티외: 아직 별로 안 좋아. 여전히 머리가 아프고 피곤해.'
    note: '*Toujours*(여전히)는 두통이 가시지 않았음을 나타내요. *fatigué*(피곤한)는 새로 배우는 유용한 형용사예요.'
  fr.a1.unit44.lesson06.teach.camille_tu_as:
    title: 카미유가 약에 대해 물어요
    gloss: '카미유: 알약 먹었어?'
    note: '*Pris*는 *prendre*의 과거분사예요. *avoir*의 *as*와 함께 써요: *tu as pris*.'
  fr.a1.unit44.lesson06.teach.mathieu_oui_j:
    title: 마티외가 대답해요
    gloss: '마티외: 응, 알약 한 알 먹었어. 이제 좀 쉴 거야.'
    note: '*Je vais me reposer*(쉴 거예요)는 *aller* + 동사원형으로 가까운 미래를 나타내요.'
  fr.a1.unit44.lesson06.teach.camille_bonne_idee:
    title: 카미유가 쾌유를 빌어요
    gloss: '카미유: 좋은 생각이야. 푹 쉬어. 빨리 나아!'
    note: '*Bon rétablissement !*는 빠른 회복을 빌 때 쓰는 대표적인 고정 표현이에요.'
  fr.a1.unit44.lesson06.teach.mathieu_merci_a:
    title: 마티외가 인사하며 마쳐요
    gloss: '마티외: 고마워, 내일 봐!'
    note: '*À demain !*은 *à* + 시간 표현으로 헤어질 때 하는 인사예요: *à demain*, *à bientôt*.'
