teaching:
  fr.a1.unit45.lesson01.teach.tu_fais_quoi:
    title: 직업 물어보기
    gloss: 직업이 뭐예요?
    note: 상대의 직업을 물을 때 쓰는 일반적이고 편한 표현이에요.
  fr.a1.unit45.lesson01.teach.le_metier_cuisinier:
    title: 직업 / 요리사
    gloss: 직업; 요리사
    note: '*Métier*(직업)는 남성 명사라서 *le métier*라고 해요. *Cuisinier*는 여성일 때 형태가 바뀌어서 *un cuisinier*, *une cuisinière*라고 해요.'
    example_gloss:
    - 직업이 뭐예요?
    - 저는 요리사로 일해요.
  fr.a1.unit45.lesson01.teach.je_travaille_comme:
    title: 요리사라고 말하기
    gloss: 저는 요리사로 일해요.
    note: '*Travailler comme* + 직업은 직업을 말할 때 쓰는 기본 형태이고, 직업을 나타내는 명사 앞에 관사를 쓰지 않아요.'
  fr.a1.unit45.lesson01.teach.infirmiere:
    title: 간호사
    gloss: 간호사
    note: '*Infirmière*는 여성형(*une infirmière*)이고, 남성형은 *infirmier*(*un infirmier*)예요. 이 카드는 여성형을 가르치고, 예문은 남성형을 써요.'
    example_gloss: 저는 간호사로 일해요.
  fr.a1.unit45.lesson01.teach.je_travaille_comme_2:
    title: 간호사라고 말하기
    gloss: 저는 간호사로 일해요.
    note: '*cuisinier*와 같은 *travailler comme* 형태를 따르고, 여성형은 *infirmière*예요.'
  fr.a1.unit45.lesson02.teach.ou_travailles_tu:
    title: 일하는 곳 물어보기
    gloss: 어디에서 일하세요?
    note: '*Tu fais quoi dans la vie ?* 다음에 바로 이어서 할 수 있는 질문이에요.'
  fr.a1.unit45.lesson02.teach.je_travaille_dans:
    title: 식당에서 일하기
    gloss: 저는 식당에서 일해요.
    note: '*Un restaurant*은 여러 식당 중 하나라서 여기서는 부정관사를 써요.'
  fr.a1.unit45.lesson02.teach.l_hopital:
    title: 병원
    gloss: 그 병원
    note: '*Hôpital*은 남성 명사이고 모음 소리로 시작해서 *l''hôpital*이 돼요.'
    example_gloss: 저는 병원에서 일해요.
  fr.a1.unit45.lesson02.teach.je_travaille_a:
    title: 병원에서 일하기
    gloss: 저는 병원에서 일해요.
    note: '*À l''hôpital*에는 정관사가 쓰여요. 특정한, 이미 알고 있는 장소이기 때문이에요. 모음 소리 앞에서는 *le*가 *l''*로 바뀌어요.'
  fr.a1.unit45.lesson02.teach.certaines_personnes_travaillent:
    title: 사무실에서 일하기
    gloss: 어떤 사람들은 사무실에서 일해요.
    note: '*Dans un bureau*(사무실에서)에는 *dans un restaurant*처럼 관사가 붙어요.'
  fr.a1.unit45.lesson03.teach.je_commence_a:
    title: 시작 시간
    gloss: 저는 9시에 시작해요.
    note: '*Commence*는 *commencer*(시작하다)의 *je* 형태예요. *à neuf heures*는 시각을 나타내요.'
  fr.a1.unit45.lesson03.teach.je_travaille_du:
    title: 근무 요일
    gloss: 저는 월요일부터 금요일까지 일해요.
    note: '*Du lundi au vendredi*는 ''월요일부터 금요일까지''라는 뜻이에요. *du*는 *de* + *le*, *au*는 *à* + *le*가 합쳐진 형태예요.'
  fr.a1.unit45.lesson03.teach.la_pause:
    title: 휴식 시간
    gloss: 쉬는 시간
    note: '*Pause*는 여성 명사예요: *la pause*.'
    example_gloss: 저는 열두 시에 쉬는 시간이 있어요.
  fr.a1.unit45.lesson03.teach.j_ai_une:
    title: 휴식 시간이 있다
    gloss: 저는 열두 시에 쉬는 시간이 있어요.
    note: '*Avoir une pause*(휴식 시간이 있다)는 자연스럽게 굳어진 표현이에요.'
  fr.a1.unit45.lesson03.teach.je_finis_a:
    title: 끝나는 시간
    gloss: 저는 5시에 끝나요.
    note: '*Finis*는 *finir*(끝내다)의 *je* 형태예요.'
  fr.a1.unit45.lesson03.teach.je_commence_a_2:
    title: 하루 근무
    gloss: 저는 9시에 시작해서 5시에 끝나요.
    note: '*je commence*와 *je finis*를 *et*로 이어서 하루 근무를 한 문장으로 말해요.'
  fr.a1.unit45.lesson04.teach.avec_il_ou:
    title: il, elle과 함께 쓰는 동사 어미
    gloss: 'il이나 elle과 함께 쓰는 규칙적인 -er 동사는 je일 때와 형태가 같아요: 저는 일해요, 그는 일해요, 그녀는 일해요.'
    note: '*Travaille*는 *je*, *il*, *elle*에서 모두 같아요. 규칙적인 *-er* 동사는 3인칭에서 어미가 따로 붙지 않아요.'
  fr.a1.unit45.lesson04.teach.camille_travaille_comme:
    title: 카미유의 직업
    gloss: Camille는 간호사로 일해요.
    note: '*Travaille*는 *je*, *il*, *elle*에 모두 쓰여요. 어미가 발음되지 않아서 세 형태의 소리가 같아요.'
  fr.a1.unit45.lesson04.teach.mathieu_travaille_comme:
    title: 마티유의 직업
    gloss: Mathieu는 요리사로 일해요.
    note: '*Camille travaille comme infirmière*와 어미가 같아요.'
  fr.a1.unit45.lesson04.teach.elle_travaille_a:
    title: 대명사 사용하기
    gloss: 그녀는 병원에서 일해요. 그는 식당에서 일해요.
    note: '*Elle*과 *il*은 카미유와 마티유라는 이름을 대신하지만, 동사 형태는 그대로예요.'
  fr.a1.unit45.lesson05.teach.camille_travaille_comme:
    title: 두 사람의 직업 소개 읽기
    gloss: 카미유는 병원에서 간호사로 일해요. 7시에 시작해서 월요일부터 금요일까지 일해요. 마티유는 식당에서 요리사로 일해요. 11시에 시작하고 4시에 휴식 시간이 있어요.
    note: 각 사람의 직업, 일하는 곳, 근무 시간을 따로 구분해서 읽어 보세요.
    glosses:
      travaille: 일해요
      infirmière: 간호사
      l'hôpital: 병원
      commence: 시작
      sept: 일곱
      lundi: 월요일
      vendredi: 금요일
      cuisinier: 요리사
      restaurant: 식당
      onze: '11'
      pause: 휴식 시간
  fr.a1.unit45.lesson06.teach.camille_salut_mathieu:
    title: 카미유가 일에 대해 물어요
    gloss: '카미유: 안녕, 마티유! 궁금한 게 있는데, 그런데 넌 무슨 일을 해?'
    note: '*Au fait*(그런데)는 질문을 캐묻는 느낌 없이 친근한 호기심으로 부드럽게 만들어 줘요.'
  fr.a1.unit45.lesson06.teach.mathieu_je_travaille:
    title: 마티유가 대답해요
    gloss: '마티유: 난 식당에서 요리사로 일해. 너는?'
    note: '*Et toi ?*는 같은 질문을 상대방에게 되묻는 표준적인 표현이에요.'
  fr.a1.unit45.lesson06.teach.camille_je_travaille:
    title: 카미유가 대답해요
    gloss: '카미유: 난 병원에서 간호사로 일해.'
    note: 앞선 수업에서 나온 직업과 일하는 곳과 같아요.
  fr.a1.unit45.lesson06.teach.mathieu_tu_fais:
    title: 마티유가 근무 시간을 물어요
    gloss: '마티유: 근무 시간이 어떻게 돼?'
    note: '*Tu fais quels horaires ?*는 상대방의 근무 시간을 묻는 자연스러운 표현이에요. *quels*는 복수형 *horaires*에 맞춘 형태예요.'
  fr.a1.unit45.lesson06.teach.camille_je_commence:
    title: 카미유가 근무 시간을 말해요
    gloss: '카미유: 난 7시에 시작해서 월요일부터 금요일까지 일해.'
    note: 앞선 수업의 읽기 소개글에 나온 근무 시간과 같아요.
  fr.a1.unit45.lesson06.teach.mathieu_c_est:
    title: 마티유가 반응해요
    gloss: '마티유: 일찍 시작하네! 난 더 늦게, 11시에 시작해.'
    note: 앞선 수업에서 나온 마티유의 시작 시간과 같아요.
  fr.a1.unit45.lesson06.teach.camille_chaque_metier:
    title: 카미유가 이야기를 마무리해요
    gloss: '카미유: 직업마다 자기만의 리듬이 있는 것 같아.'
    note: 생각을 담아 자연스럽게 마무리하는 말이에요. 뜻만 알아들으면 되고, 그대로 외울 필요는 없어요.
