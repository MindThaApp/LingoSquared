  fr.a1.unit47.lesson06.teach.camille_quel_temps:
    title: Camille이 주말 날씨를 물어요
    gloss: 'Camille: 이번 주말 날씨가 어때요?'
    note: '*Ce week-end*(이번 주말)는 질문이 가까운 미래에 관한 것임을 나타내요.'
  fr.a1.unit47.lesson06.teach.mathieu_samedi_le:
    title: Mathieu가 일기예보를 알려 줘요
    gloss: 'Mathieu: 토요일은 맑고 따뜻하지만, 일요일은 하루 종일 비가 와요.'
    note: 앞에서 읽은 일기예보와 똑같아요.
  fr.a1.unit47.lesson06.teach.camille_alors_on:
    title: Camille이 계획을 제안해요
    gloss: 'Camille: 그럼 토요일에 산책할까요?'
    note: '*Alors*(그럼)는 Mathieu가 방금 말한 좋은 날씨와 제안을 바로 이어 줘요.'
  fr.a1.unit47.lesson06.teach.mathieu_bonne_idee:
    title: Mathieu가 동의하고 일요일 계획을 세워요
    gloss: 'Mathieu: 좋은 생각이에요. 그리고 일요일에는 편안하게 안에 있어요.'
    note: '*Tranquillement*은 여기서 ''느긋하게, 서두르지 않고''라는 뜻이고, 안에 머무는 것을 매력적으로 들리게 해요.'
  fr.a1.unit47.lesson06.teach.camille_parfait_alors:
    title: Camille이 계획을 확정해요
    gloss: 'Camille: 좋아요, 그럼 영화를 봐요.'
    note: '*Regarder*(보다)는 *un film*(영화)과 자연스럽게 어울려요.'
