    gloss: 산책할까요?
    note: '*On fait une promenade ?*는 계획을 제안하는 친근한 표현이에요. *faire une promenade*는 ''산책하다''를 뜻하는 고정된 표현이에요.'
  fr.a1.unit47.lesson04.teach.s_il_pleut:
    title: 조건이 있는 계획
    gloss: 비가 오면 안에 있어요.
    note: '*S''il pleut*(비가 오면): *si* + *il*은 *s''il*이 돼요. 이어서 *on reste à l''intérieur*가 할 일을 말해요.'
  fr.a1.unit47.lesson04.teach.bonne_idee_faisons:
    title: 동의하고 제안하기
    gloss: 좋은 생각이에요! 산책해요.
    note: '*Faisons ...*(~해요)는 활동을 제안하는 또 다른 흔한 표현으로, *On ... ?*와 함께 쓰여요.'
  fr.a1.unit47.lesson05.teach.meteo_samedi_le:
    title: 이틀간의 일기예보 읽기
    gloss: '일기예보: 토요일은 맑고 따뜻해요. 일요일은 하루 종일 비가 와요.'
    note: 어느 날에 어떤 날씨인지 잘 따라가 보세요.
    glosses:
      Météo: 일기예보
      samedi: 토요일
      ensoleillé: 맑은
      chaud: 따뜻한
