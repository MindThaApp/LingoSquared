teaching:
  fr.a1.unit47.lesson01.teach.le_temps:
    title: 날씨
    gloss: 날씨
    note: '*Le temps*는 ''날씨''와 ''시간''을 모두 뜻하며, 남성 명사예요.'
    example_gloss: 날씨가 어때요?
  fr.a1.unit47.lesson01.teach.quel_temps_fait:
    title: 날씨 묻기
    gloss: 날씨가 어때요?
    note: '*Quel temps fait-il ?*는 날씨를 묻는 기본 표현이에요. *quel*은 남성 명사 *temps*에 맞춰 쓰여요.'
  fr.a1.unit47.lesson01.teach.le_temps_est:
    title: 맑음
    gloss: 날씨가 맑아요.
    note: '*Le temps est* + 형용사는 기본 패턴이에요. 형용사는 남성 명사 *temps*에 맞춰요.'
  fr.a1.unit47.lesson01.teach.il_pleut:
    title: 비
    gloss: 비가 와요.
    note: '*Pleuvoir*(비가 오다)는 비인칭으로 쓰여요. *il pleut*처럼 별도의 형용사가 필요 없어요.'
  fr.a1.unit47.lesson01.teach.le_temps_est_2:
    title: 흐림
    gloss: 날씨가 흐려요.
    note: '*ensoleillé*와 같은 *le temps est* + 형용사 패턴이에요.'
  fr.a1.unit47.lesson02.teach.il_fait_froid:
    title: 추위
    gloss: 오늘은 추워요.
    note: '*Aujourd''hui*(오늘)는 날씨가 언제인지 나타내요. *il fait froid*는 *être*가 아니라 *faire*를 써요.'
  fr.a1.unit47.lesson02.teach.il_fait_chaud:
    title: 따뜻함
    gloss: 오늘은 따뜻해요.
    note: '*Il fait chaud*는 일상 날씨 표현에서 ''따뜻하다''와 ''덥다''를 모두 뜻해요.'
  fr.a1.unit47.lesson02.teach.il_ne_fait:
    title: 기온 대조하기
    gloss: 춥지 않고 따뜻해요.
    note: '*Ne ... pas*는 동사를 감싸요: *il ne fait pas froid*.'
  fr.a1.unit47.lesson03.teach.la_meteo:
    title: 일기예보
    gloss: 일기예보
    note: '*La météo*는 여성 명사이고 *la météorologie*의 줄임말이에요.'
    example_gloss: 일기예보가 어때요?
  fr.a1.unit47.lesson03.teach.demain_le_temps:
    title: 내일의 날씨
    gloss: 내일은 날씨가 맑아요.
    note: '*Demain*이 문장 앞에 오고 쉼표가 뒤따라요. 나머지는 평소 어순 그대로예요.'
  fr.a1.unit47.lesson03.teach.samedi_le_temps:
    title: 이틀간의 일기예보
    gloss: 토요일은 맑고 따뜻하지만, 일요일은 하루 종일 비가 와요.
    note: '*Toute la journée*(하루 종일)는 비가 오는 시간이 길다는 것을 강조해요.'
  fr.a1.unit47.lesson04.teach.la_promenade:
    title: 산책
