    gloss: '취미 수업에서 *faire du sport*(*Je fais du sport le samedi*)는 이미 배웠어요. *Faire de la* + 운동 이름은 구체적인 운동을 말해요: *Je fais de la natation*. 두 가지 모두 올바른 프랑스어예요.'
