answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: 프랑스어 A1
  description: 직계 가족과 친척 어휘, mon/ma/mes로 이루어진 소유 형용사 체계, 가족 소개하기를 배우며, 01~02 단원에 이어 Inès와 Mathieu의 요리 워크숍 이야기를 계속해요. 프랑스어 소유 형용사는 소유하는 사람이 아니라 뒤따르는 명사의 성에 일치한다는 점을 짚어 줘요.
units:
  fr.a1.unit03.family:
    title: Inès와 Mathieu의 가족
lessons:
  fr.a1.unit03.lesson01.immediate_family:
    title: 가까운 가족
  fr.a1.unit03.lesson02.possessives_mon_ma_mes:
    title: '소유 형용사: mon, ma, mes'
  fr.a1.unit03.lesson03.extended_family:
    title: 친척
  fr.a1.unit03.lesson04.describing_family_size:
    title: 집에 몇 명이 있어요
  fr.a1.unit03.lesson05.reading_a_family_profile:
    title: 가족 소개 글 읽기
  fr.a1.unit03.lesson06.family_photos_dialogue:
    title: Inès, Mathieu와 함께 보는 가족 사진
teaching:
  fr.a1.unit03.lesson01.teach.mere:
    title: 어머니
    gloss: 어머니
    note: '*Mère*는 여성 명사예요. 가족끼리는 *maman*을 더 흔히 쓰고, *mère*는 중립적인 말로 이 코스의 어휘 목록에서 사용해요.'
  fr.a1.unit03.lesson01.teach.pere:
    title: 아버지
    gloss: 아버지
    note: '*Père*는 남성 명사예요. *Papa*는 일상에서 쓰는 말로, *mère*/*maman*과 같은 관계예요.'
  fr.a1.unit03.lesson01.teach.frere:
    title: 남자 형제
    gloss: 남자 형제
    note: '*Frère*는 남성 단수예요.'
  fr.a1.unit03.lesson01.teach.soeur:
    title: 여자 형제
    gloss: 여자 형제
    note: '*Sœur*는 여성 단수예요. œ는 프랑스어 철자에서 두 글자가 아니라 한 글자로 쳐요.'
  fr.a1.unit03.lesson01.teach.fils:
    title: 아들
    gloss: 아들
    note: '*Fils*는 남성 명사예요. 끝의 s는 보통 발음하지 않지만 이 단어에서는 예외적으로 발음하고, l은 발음하지 않아요.'
  fr.a1.unit03.lesson01.teach.fille:
    title: 딸
    gloss: 딸
    note: '*Fille*는 여성 단수예요. 다른 맥락에서는 ''소녀''라는 뜻으로도 쓰여요.'
  fr.a1.unit03.lesson01.teach.parents:
    title: Parents
    gloss: 부모님
    note: '*Parents*는 남성 복수로, 어머니와 아버지를 함께 가리켜요.'
  fr.a1.unit03.lesson01.teach.freres_et_soeurs:
    title: 형제자매
    gloss: 형제와 자매; 형제자매
    note: 프랑스어에는 '형제자매'에 해당하는 성 중립적인 단일 단어가 없어서, *frères et sœurs*처럼 둘을 모두 말해요.
  fr.a1.unit03.lesson02.teach.ma_mere:
    title: 나의 어머니
    gloss: 나의 어머니
    note: '*Ma*는 여성 단수 소유 형용사 ''나의''예요. *mère*가 여성 명사라서 써요.'
  fr.a1.unit03.lesson02.teach.mon_pere:
    title: 나의 아버지
    gloss: 나의 아버지
    note: '*Mon*은 남성 단수 소유 형용사 ''나의''예요. *père*가 남성 명사라서 써요.'
  fr.a1.unit03.lesson02.teach.mes_freres_et_soeurs:
    title: 나의 형제자매
    gloss: 나의 형제자매
    note: '*Mes*는 성에 관계없이 모든 복수 명사에 쓰는 ''나의''예요. *ma*/*mon*처럼 명사에 맞추지만, 성이 아니라 수에 따라 달라져요.'
  fr.a1.unit03.lesson02.teach.as_tu_des_freres_et_soeurs:
    title: 형제자매 묻기
    gloss: 형제자매가 있어요?
    note: '*As-tu*는 *tu as*(너는 가지고 있다)의 도치 의문형으로, A1에서 자주 쓰는 질문 형태예요.'
  fr.a1.unit03.lesson02.teach.jai_deux_soeurs:
    title: 형제자매 수 말하기
    gloss: 저는 자매가 두 명 있어요.
    note: '*J''ai*(나는 가지고 있다)에 수와 가족 명사를 붙이면 형제자매를 말하는 기본적인 방법이 돼요.'
  fr.a1.unit03.lesson02.teach.ta_famille_est_grande:
    title: 대가족인지 묻기
    gloss: 너희 가족은 대가족이에요?
    note: '*Ta*는 친근한 말투의 여성 단수 ''너의''로, 여성 명사 *famille*에 맞춘 형태예요.'
  fr.a1.unit03.lesson02.teach.ma_famille_est_petite:
    title: 단출한 가족 설명하기
    gloss: 우리 가족은 식구가 적어요.
    note: '*Petite*는 여성 명사 *famille*에 일치해요. 남성 명사에는 남성형 *petit*를 써요. 이것은 *mon*/*ma*/*mes*와는 다른 종류의 일치예요. 둘 다 명사에 맞추지만, 소유 형용사는 소유를 나타내고 petite는 특징을 묘사해요.'
  fr.a1.unit03.lesson03.teach.grand_pere:
    title: 할아버지
    gloss: 할아버지
    note: '*Grand-père*는 하이픈이 있는 합성어로, 남성이에요.'
  fr.a1.unit03.lesson03.teach.grand_mere:
    title: 할머니
    gloss: 할머니
    note: '*Grand-mère*는 하이픈이 있는 합성어로, 여성이에요. *grande-mère*처럼 *grand-*가 일치하지 않고 그대로 쓰는 점에 주의하세요.'
  fr.a1.unit03.lesson03.teach.grands_parents:
    title: 조부모님
    gloss: 조부모
    note: '*Grands-parents*는 합성어의 두 부분이 모두 복수형이 돼요. 즉 *grands*이지 *grand-*가 아니에요. 단수형인 *grand-mère*, *grand-père*에서는 *grand-* 부분이 복수형이 아니에요.'
  fr.a1.unit03.lesson03.teach.oncle:
    title: 삼촌
    gloss: 삼촌
    note: '*Oncle*는 남성 명사예요.'
  fr.a1.unit03.lesson03.teach.tante:
    title: 이모, 고모
    gloss: 이모, 고모
    note: '*Tante*는 여성 명사예요.'
  fr.a1.unit03.lesson03.teach.cousin:
    title: 사촌 (남자)
    gloss: 사촌 (남자)
    note: '*Cousin*은 남성 단수예요. 프랑스어에서는 사촌의 성별을 단어 형태로 구분해요.'
  fr.a1.unit03.lesson03.teach.cousine:
    title: 사촌 (여자)
    gloss: 사촌 (여자)
    note: '*Cousine*은 여성 단수로, *cousin*에 -e를 붙여 만들어요.'
  fr.a1.unit03.lesson03.teach.mes_grands_parents:
    title: 나의 조부모님
    gloss: 저의 조부모님
    note: '*grands-parents*가 복수라서 *mes*를 써요. 이 말에 남성과 여성이 함께 들어 있어도 마찬가지예요.'
  fr.a1.unit03.lesson04.teach.combien_de_freres_et_soeurs:
    title: 형제자매가 몇 명인지 묻기
    gloss: 형제자매가 몇 명이에요?
    note: '*Combien de*(몇 ~)는 프랑스어에서 명사 바로 앞에 와요.'
  fr.a1.unit03.lesson04.teach.on_est_cinq:
    title: 식구 수 말하기
    gloss: 집에 우리는 여섯 명이에요.
    note: '*On est*(문자 그대로는 ''사람은 ~이다'')는 구어에서 ''우리는 ~이다''라는 뜻으로 쓰이며, 집 식구 수를 말할 때 아주 자연스럽고 흔한 표현이에요. *nous sommes*는 더 격식 있는 문어체예요.'
  fr.a1.unit03.lesson04.teach.ma_famille_est_grande:
    title: 대가족 설명하기
    gloss: 우리 가족은 대가족이에요.
    note: '*Grande*는 여성 명사 *famille*에 일치해요. 남성 명사에는 남성형 *grand*를 써요.'
  fr.a1.unit03.lesson04.teach.jai_beaucoup_de_cousins:
    title: 사촌이 많다고 말하기
    gloss: 사촌이 많아요.
    note: '*Beaucoup de*(많은)는 명사 앞에 와요. *beaucoup*가 이미 양을 나타내므로 여기서 *de*는 *du*/*des*로 바뀌지 않아요.'
  fr.a1.unit03.lesson04.teach.tu_habites_pres_de_tes_parents:
    title: 부모님 근처에 사는지 묻기
    gloss: 부모님 근처에 살아요?
    note: '*Tes*는 친근한 말투의 복수 ''너의''로, *parents*가 복수라서 써요.'
  fr.a1.unit03.lesson04.teach.jhabite_avec_mes_grands_parents:
    title: 누구와 함께 사는지 말하기
    gloss: 저는 조부모님과 함께 살아요.
    note: '*Avec*는 ''~와 함께''라는 뜻으로, 함께 사는 사람을 말할 때 써요. *j''habite*는 *habiter*의 *je* 형태로, 1단원의 *j''habite à Montreuil*에서 이미 나왔어요.'
  fr.a1.unit03.lesson05.teach.profile_reading:
    title: 이네스의 가족 소개
    gloss: 제 이름은 이네스예요. 저는 서른한 살이고 파리에서 조부모님과 함께 살아요. 어머니와 아버지는 릴에 사세요. 저는 여동생 둘과 남동생 하나가 있어요. 집에는 모두 여섯 명이 있어요. 제 막내 여동생의 이름은 카미유이고, 스무 살이에요.
    note: 이 소개글은 1~4과의 어휘와 표현을 낱낱의 문장이 아니라 이어지는 짧은 글로 다시 보여 줘요. 이 단원의 읽기 평가가 다루는, 누가 누구인지 파악하는 읽기 능력과 같아요.
    glosses:
      trente: 삼십
      ans: ~살
      grands-parents: 조부모
      mère: 어머니
      père: 아버지
      habitent: 살다 (habiter의 활용형)
      deux: 둘
      sœurs: 자매들
      frère: 남자 형제
      six: 여섯
      maison: 집
      petite: 어린 / 작은
      sœur: 여자 형제
      vingt: 20, 스물
  fr.a1.unit03.lesson05.teach.petite_soeur:
    title: 여동생
    gloss: 여동생
    note: '*Petite*(*petit*의 여성형)는 여기서 명사 앞에 와요. 짧고 자주 쓰는 프랑스어 형용사 대부분이 이렇게 명사 앞에 오지만, 대부분의 다른 형용사는 명사 뒤에 와요.'
  fr.a1.unit03.lesson05.teach.habite_third_person:
    title: 살아요 (3인칭)
    gloss: 살아요
    note: '*Habite*는 *habiter*의 3인칭 단수 형태예요. 자기 자신(*j''habite*, 1단원과 이 단원 4과에서 나왔어요)이 아니라 다른 사람(*Inès habite...*)에 대해 말할 때 써요.'
  fr.a1.unit03.lesson05.teach.ses_third_person_plural:
    title: 그의/그녀의/그들의 (복수 명사 앞)
    gloss: 그의/그녀의/그들의
    note: '*Ses*는 *sa*/*son*의 복수형이에요. 단수 명사 앞에서 *sa*/*son*이 ''그의/그녀의''를 모두 뜻하듯이, 복수 명사 앞에서는 ses를 써요. *ses grands-parents*는 이네스에 대해 말할 때 ''그녀의 조부모님''이라는 뜻이에요.'
  fr.a1.unit03.lesson05.teach.a_third_person_avoir:
    title: 가지고 있어요 (3인칭)
    gloss: 가지고 있어요
    note: '*A*는 *avoir*의 3인칭 단수 형태예요. 자기 자신(*j''ai* / *as-tu*, 이 단원 2~4과 내내 나왔어요)이 아니라 다른 사람(*elle a vingt ans*)에 대해 말할 때 써요.'
  fr.a1.unit03.lesson06.teach.line01:
    title: 가족사진 보여 주기
    gloss: 이네스가 마티외에게 사진을 보여 주며 부모님과 여동생을 소개해요.
    note: '*Voici*는 ''여기 ~이 있어요''라는 뜻으로, 무언가를 가리키며 소개할 때 써요. 사진을 보여 줄 때 자연스러운 표현이에요.'
  fr.a1.unit03.lesson06.teach.line02:
    title: 반응하며 형제자매 묻기
    gloss: 마티외가 따뜻하게 반응하며 다른 형제자매가 있는지 물어요.
    note: '*C''est adorable*은 어린 형제자매의 사진을 봤을 때 할 수 있는 자연스럽고 따뜻한 반응이에요.'
  fr.a1.unit03.lesson06.teach.line03:
    title: 집 식구 수를 말하고 되묻기
    gloss: 이네스가 여동생 둘과 남동생 하나가 있어서 집에 여섯 명이 있다고 말한 다음, 마티외의 가족에 대해 물어요.
    note: '*On est six à la maison*은 집 전체 식구 수를 말하는 표현으로, 4과에서 배운 형식을 이어 가요.'
  fr.a1.unit03.lesson06.teach.line04:
    title: 더 작은 가족 설명하기
    gloss: 마티외가 자기 가족은 더 작아서 부모님과 자신, 세 명뿐이지만 사촌은 많다고 말해요.
    note: '*Mais*는 ''그러나, 하지만''이라는 뜻으로, 작은 핵가족과 많은 친척의 대조를 나타내요.'
  fr.a1.unit03.lesson06.teach.line05:
    title: 부모님과 가까이 사는지 묻기
    gloss: 이네스가 마티외에게 부모님 가까이에 사는지 물어요.
    note: '*Près de*는 ''~ 가까이에''라는 뜻으로, 물리적으로 가까운 거리를 말할 때 자주 써요.'
  fr.a1.unit03.lesson06.teach.line06:
    title: 거리와 연락 방식 설명하기
    gloss: 마티외가 아니라고 하며, 부모님은 리옹에 사시고 매주 전화로 이야기한다고 말해요.
    note: 마티외가 리옹 출신이라는 1단원의 설정을 이어 가요. 부모님은 그곳에 계시고 마티외는 생우앵에 살아요.
  fr.a1.unit03.lesson06.teach.line07:
    title: 공감하고 내 상황 말하기
    gloss: 이네스가 이해한다고 말하고, 자신은 여기 파리에서 조부모님과 함께 산다고 말해요.
    note: '*Je comprends*는 ''이해해요''라는 뜻이에요. 상대의 이야기를 받아 주고 나서 내 이야기를 덧붙일 때 쓰는 자연스럽고 짧은 표현이에요.'
  fr.a1.unit03.lesson06.teach.line08:
    title: 따뜻한 말로 마무리하기
    gloss: 마티외가 가족이 가까이 있는 것은 좋은 일이라고 말해요.
    note: '*C''est bien d''avoir sa famille près de soi*는 따뜻하고 생각에 잠기게 하는 말로 대화를 마무리해요. 4과의 *près de* 표현이 다시 나와요.'
exercises:
  fr.a1.unit03.lesson01.exercise01.select_mere:
    instruction: '''어머니''를 뜻하는 단어는 무엇일까요?'
    correct_option: mère
    distractors:
    - père
    - sœur
    accepted_answers:
    - mère
  fr.a1.unit03.lesson01.exercise02.select_soeur:
    instruction: '''자매, 누이''를 뜻하는 단어는 무엇일까요?'
    correct_option: sœur
    distractors:
    - frère
    - fille
    accepted_answers:
    - sœur
  fr.a1.unit03.lesson01.exercise03.match_family_words:
    instruction: 각 프랑스어 단어를 알맞은 한국어 뜻과 연결하세요.
    correct_response:
      mère: 어머니
      père: 아버지
      frère: 남자 형제
      sœur: 여자 형제
      fils: 아들
      fille: 딸
    pairs:
    - left: mère
      right: 어머니
    - left: père
      right: 아버지
    - left: frère
      right: 남자 형제
    - left: sœur
      right: 여자 형제
    - left: fils
      right: 아들
    - left: fille
