teaching:
  fr.a1.unit51.lesson01.teach.combien_ca_coute:
    title: 총액 묻기
    gloss: 전부 합해서 얼마예요?
    note: '*En tout*(전부 합해서)는 물건 하나의 값이 아니라 모두 합친 가격을 원한다는 뜻을 분명히 해 줘요.'
  fr.a1.unit51.lesson01.teach.ca_coute_vingt:
    title: 총액 말하기
    gloss: 전부 합해서 25유로예요.
    note: '*Ça coûte*는 *ça*(그것)에 *coûte*를 쓴 표현이에요. coûte는 *coûter*(값이 나가다)가 하나의 대상에 쓰일 때의 형태예요.'
  fr.a1.unit51.lesson02.teach.payer_par_carte:
    title: 카드나 현금으로 결제하기
    gloss: 카드로 결제하다, 현금으로 결제하다
    note: '*Payer par carte*는 카드로 결제한다고 말할 때 쓰는 일반적인 표현이고, *payer en espèces*는 현금으로 낸다는 뜻이에요. *carte* 앞에는 *par*를, *espèces* 앞에는 *en*을 써요.'
    example_gloss:
    - 여기서 카드로 결제해도 돼요?
    - 현금으로 낼게요.
  fr.a1.unit51.lesson02.teach.je_peux_payer:
    title: 카드 결제가 되는지 묻기
    gloss: 여기서 카드로 결제해도 돼요?
    note: '*Ici*(여기)는 지금 서 있는 계산대에서 묻는 질문이라는 점을 나타내요.'
  fr.a1.unit51.lesson02.teach.vous_voulez_payer:
    title: 결제 방법 묻기
    gloss: 현금으로 내시겠어요, 카드로 내시겠어요?
    note: '*Vous voulez ... ?*는 격식을 갖춘 질문으로, 모르는 계산원이 쓰는 표현이에요. 친구끼리는 *tu veux ... ?*라고 해요.'
  fr.a1.unit51.lesson03.teach.l_addition:
    title: 계산서
    gloss: 계산서
    note: '*Addition*은 여성 명사라서 *l''addition*이라고 해요. *La*는 모음 앞에서 *l''*로 줄어요.'
    example_gloss: 계산서를 나눠 낼까요?
  fr.a1.unit51.lesson03.teach.on_partage_l:
    title: 계산서 나누자고 제안하기
    gloss: 계산서를 나눠 낼까요?
    note: '*On ... ?*는 *On partage ?*처럼 함께 하자고 제안할 때 써요. *Partager*(나누다)는 *l''addition*과 함께 쓸 수 있어요.'
  fr.a1.unit51.lesson03.teach.je_peux_payer:
    title: 따로 계산해 달라고 요청하기
    gloss: 따로 계산해도 될까요?
    note: '*Séparément*(따로)는 *payer* 바로 뒤에 와요. 자기 몫만 내고 싶을 때 쓰는 공손한 표현이에요.'
  fr.a1.unit51.lesson04.teach.la_monnaie:
    title: 잔돈
    gloss: 잔돈
    note: '*Monnaie*는 여성 명사라서 *la monnaie*라고 해요. 거슬러 받는 동전과 지폐를 뜻해요.'
    example_gloss: 여기 잔돈이에요.
  fr.a1.unit51.lesson04.teach.voici_votre_monnaie:
    title: 잔돈 건네기
    gloss: 여기 잔돈이에요.
    note: '*Votre*는 격식 있는 ''당신의''로, 계산대에서 쓰는 *vous* 말투와 어울려요.'
  fr.a1.unit51.lesson04.teach.je_n_ai:
    title: 잔돈 사양하기
    gloss: 잔돈은 필요 없어요.
    note: '*Avoir besoin de*(필요하다) 뒤에는 명사가 와요: *Je n''ai pas besoin de monnaie.* *ne ... pas* 뒤에서는 *de la* 대신 *de*를 써요.'
  fr.a1.unit51.lesson05.teach.trente_cinq:
    title: 서른다섯
    gloss: 서른다섯
    note: '*Trente-cinq*는 하이픈으로 이어 쓰고, 십의 자리를 먼저 말해요: 서른 + 다섯.'
    example_gloss: 35유로예요.
  fr.a1.unit51.lesson05.teach.addition_deux_plats:
    title: 식당 계산서 읽기
    gloss: '계산서: 메인 요리 두 개와 커피 두 잔. 합계: 35유로. 카드로 결제.'
    note: 무엇을 주문했는지, 합계가 얼마인지, 어떻게 결제했는지 확인해 보세요.
    glosses:
      Addition: 계산서
      deux: 둘
      plats: 메인 요리
      cafés: 커피
      Total: 합계
      trente-cinq: 서른다섯
      euros: 유로
      Payé: 지불된
      carte: 카드
  fr.a1.unit51.lesson06.teach.camille_on_demande:
    title: 카미유가 계산서를 부탁해요
    gloss: '카미유: 계산서 달라고 할까요?'
    note: '*Demander*(요청하다)는 *l''addition*을 직접 목적어로 바로 받아요. 다른 말이 끼어들지 않아요.'
  fr.a1.unit51.lesson06.teach.mathieu_oui_bonne:
    title: 마티외가 총액을 물어봐요
    gloss: '마티외: 네, 좋은 생각이에요. 전부 합해서 얼마예요?'
    note: 1과에서 배운 *Combien ça coûte en tout ?* 질문을 다시 써요.
  fr.a1.unit51.lesson06.teach.camille_ca_fait:
    title: 카미유가 총액을 말해요
    gloss: '카미유: 35유로예요. 나눠 낼까요?'
    note: '*Ça fait* + 금액은 총액을 말하는 표현이고, *partager*는 앞에 나온 계산서를 가리켜요.'
  fr.a1.unit51.lesson06.teach.mathieu_non_laisse:
    title: 마티외가 자기가 내겠다고 고집해요
    gloss: '마티외: 아니에요, 오늘은 제가 낼게요. 저를 정말 많이 도와줬잖아요.'
    note: '*Laisse-moi* + 동사원형은 무언가를 하겠다고 나설 때 쓰고, *aidé*는 *aider*(돕다)의 과거분사예요.'
  fr.a1.unit51.lesson06.teach.camille_c_est:
    title: 카미유가 감동해요
    gloss: '카미유: 친절하기도 해라! 고마워요.'
    note: '*C''est gentil de ta part*(네가 참 친절하구나)는 너그러운 행동에 대한 따뜻하고 흔한 칭찬이에요.'
  fr.a1.unit51.lesson06.teach.mathieu_je_peux:
    title: 마티외가 카드 결제가 되는지 물어봐요
    gloss: '마티외: 여기서 카드로 결제해도 돼요?'
    note: 2과의 *Je peux payer par carte ici ?*를 이번에는 실제 식당에서 다시 써요.
  fr.a1.unit51.lesson06.teach.mathieu_paie_l:
    title: 'Paie: il/elle 형태'
    gloss: 마티외가 계산서를 계산해요.
    note: '*Paie*는 *payer*(지불하다)의 *il/elle* 형태예요: *je paie, tu paies, il paie*.'
