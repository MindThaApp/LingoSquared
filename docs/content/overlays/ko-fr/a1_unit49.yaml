teaching:
  fr.a1.unit49.lesson01.teach.content_triste_en:
    title: 기쁜, 슬픈, 화난
    gloss: 기쁜, 슬픈, 화난
    note: '*être*(~이다)와 함께 쓰는 기본 감정 표현 세 가지예요. *content*의 여성형은 *contente*이고, *triste*와 *en colère*는 형태가 변하지 않아요.'
    example_gloss:
    - 저는 기뻐요.
    - 저는 슬퍼요.
    - 저는 화가 나요.
  fr.a1.unit49.lesson01.teach.je_suis_content:
    title: 기쁘다고 말하기
    gloss: 저는 기뻐요.
    note: 기본 형태는 *être*(~이다) + 감정을 나타내는 형용사예요.
  fr.a1.unit49.lesson01.teach.je_ne_suis:
    title: 대조되는 감정 말하기
    gloss: 저는 화난 게 아니라 슬퍼요.
    note: '*Ne ... pas*는 동사를 감싸고, 두 번째 절에서 실제 감정을 말해요.'
  fr.a1.unit49.lesson02.teach.pourquoi_es_tu:
    title: 이유 묻기
    gloss: 왜 기뻐요?
    note: '*Pourquoi*(왜)는 이유를 묻는 기본 의문사예요.'
  fr.a1.unit49.lesson02.teach.je_suis_content:
    title: 이유 말하기
    gloss: 저는 새 아파트가 생겨서 기뻐요.
    note: '*Parce que*(~ 때문에)는 이유를 나타내는 절을 이끌어요. *il* 앞에서는 *parce qu''*로 줄어들어요.'
  fr.a1.unit49.lesson02.teach.je_suis_triste:
    title: 부정적인 이유
    gloss: 저는 비가 와서 슬퍼요.
    note: 날씨 단원에서 배운 *il pleut*(비가 와요)를 이유를 나타내는 절로 다시 써요.
  fr.a1.unit49.lesson03.teach.nerveux:
    title: 긴장한
    gloss: 긴장한
    note: 긴장한 상태를 나타내는 기본 단어예요.
    example_gloss: 저는 첫 근무를 앞두고 긴장돼요.
  fr.a1.unit49.lesson03.teach.je_suis_nerveux:
    title: 무엇 때문에 긴장하는지 말하기
    gloss: 저는 첫 근무를 앞두고 긴장돼요.
    note: '*Avant*(직역하면 ''~ 전에'')가 긴장의 대상이 되는 일을 나타내요.'
  fr.a1.unit49.lesson03.teach.ne_t_inquiete:
    title: 안심시키기
    gloss: 걱정하지 마세요.
    note: '*Ne t''inquiète pas*(직역하면 ''너 자신을 걱정시키지 마'')는 안심시킬 때 쓰는 대표적인 고정 표현이에요. *s''inquiéter*는 재귀동사예요.'
  fr.a1.unit49.lesson04.teach.comment_se_sent:
    title: 다른 사람의 기분 묻기
    gloss: Mathieu는 기분이 어때요?
    note: '*Se sentir*(느끼다, 재귀동사)는 감정 상태를 묻거나 말할 때 쓰는 기본 표현이에요. 건강 단원에도 나와요.'
  fr.a1.unit49.lesson04.teach.il_se_sent:
    title: 다른 사람의 기분 설명하기
    gloss: 그는 긴장돼요.
    note: '*Se*(자기 자신)는 3인칭 재귀대명사로, *sent*와 함께 쓰여요.'
  fr.a1.unit49.lesson04.teach.pourquoi_se_sent:
    title: 왜 그런 기분인지 묻기
    gloss: 그는 왜 긴장해요?
    note: '*Il se sent nerveux*에 나온 *se sentir*에 *pourquoi*를 합친 표현이에요. *sent-il*은 하이픈을 넣어 써요.'
  fr.a1.unit49.lesson05.teach.salut_camille_je:
    title: 감정에 관한 메시지 읽기
    gloss: 안녕 Camille, 혼자 하는 첫 근무를 앞두고 조금 긴장돼. 그래도 새 직장과 새 아파트가 생겨서 기쁘기도 해. 잘 될 것 같아.
    note: 글쓴이가 무엇 때문에 긴장하는지, 무엇 때문에 기쁜지, 전반적으로 어떻게 전망하는지 살펴보세요.
    glosses:
      peu: 조금
      nerveux: 긴장한
      premier: 첫 번째의
      service: 근무
      seul: 혼자
      content: 기쁜
      car: 왜냐하면
      nouveau: 새로운
      travail: 직장
      nouvel: 새로운
      appartement: 아파트
      pense: 생각하다
      aller: 잘 되다 (여기서는 괜찮을 것이다)
  fr.a1.unit49.lesson06.teach.camille_salut_mathieu:
    title: Camille이 Mathieu의 기분을 물어요
    gloss: 'Camille: 안녕 Mathieu, 첫 근무를 앞두고 기분이 어때?'
    note: '*Avant ton premier service*(너의 첫 근무 전에)는 3과에서 배운 *avant* + 명사 형태를 다시 써요.'
  fr.a1.unit49.lesson06.teach.mathieu_je_suis:
    title: Mathieu가 긴장된다고 털어놓아요
    gloss: 'Mathieu: 솔직히 조금 긴장돼.'
    note: '*Honnêtement*(솔직히)은 털어놓는 말을 부드럽게 해 줘요.'
  fr.a1.unit49.lesson06.teach.camille_ne_t:
    title: Camille이 그를 안심시켜요
    gloss: 'Camille: 걱정하지 마, 잘 해낼 거야!'
    note: '*Tu vas y arriver*(직역하면 ''너는 거기에 도달할 거야'')는 격려할 때 쓰는 고정 표현이에요. *aller* + 동사원형은 가까운 미래를 나타내요.'
  fr.a1.unit49.lesson06.teach.mathieu_merci_ca:
    title: Mathieu가 고마워해요
    gloss: 'Mathieu: 고마워, 정말 도움이 돼.'
    note: '*Aide*는 *aider*(돕다)의 *il/elle* 형태예요. *m''*는 *me*를 줄인 거예요.'
  fr.a1.unit49.lesson06.teach.camille_et_apres:
    title: Camille이 결과를 예상해요
    gloss: 'Camille: 그리고 나중에는 분명 아주 기쁘고 뿌듯할 거야.'
    note: '*Sûrement*(분명히)은 확신에 찬 예측을 나타내요. *fier*(뿌듯한)는 새로 배우는 유용한 형용사예요.'
  fr.a1.unit49.lesson06.teach.mathieu_oui_je:
    title: Mathieu가 동의해요
    gloss: 'Mathieu: 응, 나도 그렇게 생각해.'
    note: '*Je pense aussi*는 다른 사람의 의견에 동의할 때 쓰는 자연스러운 표현이에요.'
  fr.a1.unit49.lesson06.teach.il_remplace_mathieu:
    title: il, elle, l'로 요약하기
    gloss: Mathieu는 첫 근무를 앞두고 긴장해요. Camille은 그를 도와줘요.
    note: '*Il*은 남자 이름을, *elle*은 여자 이름을 대신해요(*il est nerveux*). *l''*(*elle l''aide*)는 ''그를''이라는 뜻이에요. 다른 사람에 대해 말할 때 꼭 필요한 작은 단어 세 개예요.'
