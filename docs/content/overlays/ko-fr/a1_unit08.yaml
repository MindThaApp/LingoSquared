answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: 프랑스어 A1
  description: 요일과 날짜 말하기(le + 기수 + 월, 예외는 서수 le premier뿐)를 배우고, 이네스와 마티유의 요리 워크숍 이야기가 마지막 모임을 계획하는 장면으로 이어져요. 프랑스어 날짜는 1일을 제외하고 모두 기수를 써요(le quinze mars).
units:
  fr.a1.unit08.dates:
    title: 오늘 며칠이에요?
lessons:
  fr.a1.unit08.lesson01.jours_de_la_semaine:
    title: 요일
  fr.a1.unit08.lesson02.donner_la_date:
    title: 날짜 말하기
  fr.a1.unit08.lesson03.dialogue_derniere_seance:
    title: 워크숍의 마지막 모임
teaching:
  fr.a1.unit08.lesson01.teach.lundi:
    title: 월요일
    gloss: 월요일
    note: 프랑스어에서 요일은 남성 명사이고, 대문자로 쓰지 않아요.
    example_gloss: 워크숍은 월요일에는 절대 모이지 않아요.
  fr.a1.unit08.lesson01.teach.samedi:
    title: 토요일
    gloss: 토요일
    note: 관사가 붙은 *Le samedi*는 '토요일마다'라는 습관적인 뜻이고, *samedi*만 쓰면 특정한 한 토요일을 가리켜요. 시제에 따라 곧 다가오는 토요일이나 막 지난 토요일이에요.
    example_gloss: 워크숍은 토요일마다 열려요.
  fr.a1.unit08.lesson01.teach.dimanche:
    title: 일요일
    gloss: 일요일
    note: 다른 요일과 마찬가지로 남성 명사이고, 대문자로 쓰지 않아요.
    example_gloss: 빵집은 일요일마다 문을 닫아요.
  fr.a1.unit08.lesson01.teach.aujourdhui:
    title: 오늘
    gloss: 오늘
    note: '*Aujourd''hui*는 역사적으로 여러 부분이 합쳐진 말이지만, 하나의 고정된 단어예요.'
    example_gloss: 오늘은 토요일이에요.
  fr.a1.unit08.lesson01.teach.demain:
    title: 내일
    gloss: 내일
    note: '*Demain*은 형태가 변하지 않고, 어떤 상황에서든 똑같이 써요.'
    example_gloss: 약국은 내일 문을 열어요.
  fr.a1.unit08.lesson01.teach.hier:
    title: 어제
    gloss: 어제
    note: '*Hier*는 *demain*의 정반대 말이에요.'
    example_gloss: 저는 어제 생선을 먹었어요.
  fr.a1.unit08.lesson01.teach.quel_jour_sommes_nous:
    title: 요일 묻기
    gloss: 무슨 요일이에요?
    note: '*Quel jour sommes-nous ?*(직역하면 ''우리는 무슨 날이에요'')는 무슨 요일인지 물을 때 쓰는 표준적인 표현이에요.'
  fr.a1.unit08.lesson02.teach.mars:
    title: 3월
    gloss: 3월
    note: 월 이름도 요일처럼 남성 명사이고, 대문자로 쓰지 않아요.
    example_gloss: 워크숍은 3월에 끝나요.
  fr.a1.unit08.lesson02.teach.quelle_est_la_date:
    title: 날짜 묻기
    gloss: 오늘은 며칠이에요?
    note: '*Quelle est la date... ?*는 연월일 전체 날짜를 물을 때 쓰는 표준적인 표현이에요. 요일만 묻는 *Quel jour sommes-nous ?*와는 달라요.'
  fr.a1.unit08.lesson02.teach.cest_le_quinze_mars:
    title: 날짜 말하기
    gloss: 3월 15일이에요.
    note: '*Le* + 기수 + 월 이름이 프랑스어 날짜의 기본 형식이에요. 서수가 아니라 기수 *quinze*(15)를 써요.'
  fr.a1.unit08.lesson02.teach.nous_sommes_le:
    title: 오늘 날짜 말하기
    gloss: 오늘은 3월 15일이에요.
    note: '*Nous sommes le...*는 오늘 날짜를 말할 때 *C''est le...*와 똑같이 자주 쓰는 표현이에요.'
  fr.a1.unit08.lesson02.teach.le_premier:
    title: 그달의 1일
    gloss: 1일
    note: '*Le premier*는 기수를 쓰는 규칙의 유일한 예외예요. 다른 날짜는 모두 기수(*le deux*, *le trois*...)를 쓰지만, 1일만 서수 *premier*를 써요.'
  fr.a1.unit08.lesson02.teach.le_vingt_deux:
    title: 끝나는 날짜 말하기
    gloss: 워크숍은 3월 22일에 끝나요.
    note: '*Se termine*(끝나다)는 대명동사이고, *vingt-deux*는 *le quinze mars*와 같은 규칙을 따르는 기수예요.'
  fr.a1.unit08.lesson03.teach.line01:
    title: 마지막 모임이 언제인지 묻기
    gloss: 이네스가 워크숍의 마지막 모임이 언제인지 물어요.
    note: '*C''est quand... ?*(언제예요?)는 시기를 묻는 자연스럽고 간단한 표현이에요.'
  fr.a1.unit08.lesson03.teach.line02:
    title: 날짜와 요일 말하기
    gloss: 마티유는 3월 22일인 것 같고, 토요일이라고 말해요.
    note: '*le* 없이 쓴 *Un samedi*(어느 토요일)는 그 날짜가 무슨 요일인지 알려 줄 뿐이에요.'
  fr.a1.unit08.lesson03.teach.line03:
    title: 오늘 날짜 묻기
    gloss: 이네스가 오늘 날짜가 어떻게 되는지 물어요.
    note: 날짜를 물을 때 배운 *Quelle est la date aujourd'hui ?* 그대로예요.
  fr.a1.unit08.lesson03.teach.line04:
    title: 오늘 날짜와 남은 기간 말하기
    gloss: 마티유는 오늘이 3월 15일이니까 일주일 뒤라고 말해요.
    note: '*Dans une semaine*(일주일 뒤)은 오늘부터 얼마나 시간이 남았는지를 나타내요.'
  fr.a1.unit08.lesson03.teach.line05:
    title: 계획으로 반응하기
    gloss: 이네스는 잘됐다며, 그날을 위해 디저트를 준비할 시간이 있다고 말해요.
    note: '*J''ai le temps de* + 동사원형(~할 시간이 있다)은 어떤 일을 할 시간이 충분하다고 말할 때 자주 쓰는 표현이에요.'
  fr.a1.unit08.lesson03.teach.line06:
    title: 계획 확정하기
    gloss: 마티유는 좋은 생각이라며, 그럼 다음 주 토요일인 22일에 보자고 말해요.
    note: '*Samedi prochain*(다음 주 토요일)은 요일과 날짜를 함께 확인하며 대화를 마무리해요.'
