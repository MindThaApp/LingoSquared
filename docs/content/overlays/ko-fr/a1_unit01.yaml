answer_policy:
  diacritics: 'Teach and display standard French accents and the cedilla. For free-typed A1 answers, accept otherwise-correct forms without diacritics, including ca for ça, tres for très, and enchante for enchanté. This leniency does not erase meaningful letters: masculine enchanté and feminine enchantée remain distinct through the final e even when accents are omitted.'
  apostrophes: Accept straight and typographic apostrophes interchangeably. Require the apostrophe when an exercise specifically tests elision, such as j’habite; do not accept jhabite in that exercise.
  hyphens: Teach the standard hyphens in inverted questions such as allez-vous and vas-tu. In free transcription exercises, accept an otherwise-correct spaced version at A1, but retain the hyphenated form as the model answer.
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of French spacing before question or exclamation marks. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
course:
  title: 프랑스어 A1
  description: 표준 프랑스 본토 프랑스어의 인사, 소개, 소리 내어 읽기 패턴, 첫 만남에서 나누는 가벼운 대화를 배워요. tu와 vous의 차이, 문법적 성, 일치, 동사 활용형, 모음 생략, 연음처럼 한국어 화자가 특히 헷갈리기 쉬운 부분을 중점적으로 안내해요.
units:
  fr.a1.unit01.greetings:
    title: 인사와 첫 만남
lessons:
  fr.a1.unit01.lesson01.tu_vous_greetings:
    title: tu와 vous로 인사하기
  fr.a1.unit01.lesson02.names_introductions:
    title: 이름 말하고 묻기
  fr.a1.unit01.lesson03.reading_aloud:
    title: 첫 만남 대화를 소리 내어 읽기
  fr.a1.unit01.lesson04.wellbeing:
    title: 짧은 안부 주고받기
  fr.a1.unit01.lesson05.first_meeting_small_talk:
    title: 동네에서 서로 알아가기
  fr.a1.unit01.lesson06.workshop_dialogue:
    title: 워크숍에서의 첫 만남
teaching:
  fr.a1.unit01.lesson01.teach.bonjour:
    title: 일반적인 인사
    gloss: 안녕하세요; 좋은 아침이에요
    note: Bonjour는 낯선 사람, 직장 동료, 친구에게 낮 동안 모두 안전하게 쓸 수 있는 인사예요. 한국어의 "안녕하세요"처럼 두루 쓰이고, "좋은 하루"라는 뜻도 담겨 있어요.
  fr.a1.unit01.lesson01.teach.salut:
    title: 친근한 인사
    gloss: 안녕; 잘 가
    note: Salut는 친근한 사이에서 쓰는 말이에요. 대화를 시작할 때도 끝낼 때도 쓸 수 있지만, 잘 모르는 어른에게 처음 건네는 인사로는 적절하지 않아요.
  fr.a1.unit01.lesson01.teach.au_revoir:
    title: 일반적인 작별 인사
    gloss: 안녕히 가세요
    note: Au revoir는 공손한 상황에서도 친근한 상황에서도 쓸 수 있어요.
  fr.a1.unit01.lesson01.teach.tu:
    title: 친근한 단수 "너"
    gloss: 너 (친근한 단수)
    note: tu는 친구, 아이, 또는 분명히 친근한 관계인 한 사람에게 쓰는 말이에요. 한국어의 반말 상대에게 쓰는 "너"와 비슷하고, tu에는 그에 맞는 고유한 동사 형태가 필요해요.
  fr.a1.unit01.lesson01.teach.vous:
    title: 공손한 "당신" 또는 복수 "너희"
    gloss: 당신, 여러분 (공손한 단수 또는 복수)
    note: vous는 잘 모르는 어른 한 사람에게 쓰는 안전한 형태이고, 여러 사람을 부를 때도 쓰는 형태예요. 한국어에는 존댓말이 있지만, 프랑스어는 높임을 동사 어미가 아니라 인칭 대명사 vous로 나타내요.
  fr.a1.unit01.lesson01.teach.comment_allez_vous:
    title: 격식 있는 안부 질문
    gloss: 어떻게 지내세요?
    note: Allez는 aller의 vous 형태예요. 동사와 대명사의 순서를 바꾸고 하이픈으로 이어요. 어디로 가는지 실제로 묻는 말이 아니라 공손하게 안부를 묻는 관용적인 질문이에요.
  fr.a1.unit01.lesson01.teach.comment_vas_tu:
    title: 친근한 안부 질문
    gloss: 어떻게 지내세요?
    note: Vas는 aller의 tu 형태예요. 관계가 친근해지면 한국어에서 존댓말이 반말로 바뀌듯, 프랑스어에서도 allez-vous가 vas-tu로 바뀌어요.
  fr.a1.unit01.lesson01.teach.register_choice:
    title: 인사와 관계 맞추기
    gloss: vous에는 Bonjour, tu에는 salut
    note: 이 짝은 기본적으로 쓰기 좋은 조합일 뿐 절대적인 규칙은 아니에요. Bonjour는 친구에게도 쓸 수 있지만, salut와 vous를 함께 쓰면 대개 어색한 신호를 줘요.
  fr.a1.unit01.lesson02.teach.je_mappelle:
    title: 이름 말하기
    gloss: 제 이름은 Camille이에요.
    note: Je m’appelle은 직역하면 "나는 나 자신을 ~라고 부른다"는 뜻이에요. 한국어는 주어를 자주 생략하지만, 프랑스어는 보통 주어 je가 꼭 필요해요. me의 모음은 appelle 앞에서 사라져 m’appelle이 돼요.
  fr.a1.unit01.lesson02.teach.comment_appelez_vous:
    title: 공손하게 이름 묻기
    gloss: 성함이 어떻게 되세요?
    note: 'Appelez는 appeler의 vous 형태예요. 이 질문은 도치를 쓰기 때문에 두 번째 vous가 동사 뒤에 와요: vous appelez-vous.'
  fr.a1.unit01.lesson02.teach.tu_tappelles:
    title: 친근하게 이름 묻기
    gloss: 성함이 어떻게 되세요?
    note: T’appelles는 재귀 대명사 te가 모음 앞에서 줄어든 tu 형태예요. 일상에서 쓰는 이 질문은 tu를 동사 앞에 두고 comment를 맨 끝에 놓아요.
  fr.a1.unit01.lesson02.teach.moi_cest:
    title: 대화체 자기소개
    gloss: 난 Noé야.
    note: Moi, c’est는 말할 때 쓰는 관용적인 자기소개예요. "저는 ~입니다"를 단어 그대로 옮기는 것보다 더 대화체다운 표현이에요.
  fr.a1.unit01.lesson02.teach.enchante:
    title: 남성형 일치
    gloss: 만나서 반갑습니다.
    note: 남성 화자는 보통 enchanté라고 써요. 한국어 형용사는 화자의 성별에 따라 달라지지 않지만, 이 프랑스어 형용사는 달라져요.
  fr.a1.unit01.lesson02.teach.enchantee:
    title: 여성형 일치
    gloss: 만나서 반갑습니다.
    note: 여성 화자는 보통 끝에 e를 더해 enchantée라고 써요. Enchanté와 enchantée는 대체로 똑같이 발음하므로 말보다 글에서 차이가 더 분명해요.
  fr.a1.unit01.lesson02.teach.et_vous:
    title: 공손하게 되묻기
    gloss: 당신은요?
    note: 공손한 말투를 유지하거나 여러 사람에게 물을 때 vous를 써요.
  fr.a1.unit01.lesson02.teach.et_toi:
    title: 친근하게 되묻기
    gloss: 당신은요?
    note: Toi는 tu와 짝을 이루는 강세형이에요. 프랑스어는 et 뒤에 tu가 아니라 toi를 써요.
  fr.a1.unit01.lesson03.teach.elision_jhabite:
    title: 모음 앞의 생략
    gloss: 나는 살아요
    note: 'Je는 habite 앞에서 모음이 사라지고, 아포스트로피가 그 생략을 나타내요: j’habite. habiter의 h는 생략을 막지 않아요.'
  fr.a1.unit01.lesson03.teach.liaison_vous_etes:
    title: vous 뒤의 연음
    gloss: 당신은 ~이에요
    note: vous의 마지막 s는 보통 소리 나지 않지만, 모음 소리로 시작하는 êtes 앞에서는 z 소리로 이어져요. vous êtes는 대략 "부젯"처럼 들려요. 연음은 철자가 아니라 말하는 소리에 속해요.
  fr.a1.unit01.lesson03.teach.liaison_un_atelier:
    title: un 뒤의 연음
    gloss: 워크숍 하나
    note: un의 마지막 n이 atelier로 이어져요. 두 단어 사이를 끊어 읽지 않도록 주의하세요.
  fr.a1.unit01.lesson03.teach.final_e_enchante:
    title: 남성형 철자
    gloss: 반갑습니다 (남성형)
    note: Enchanté는 남성 화자일 때 é로 끝나요. -an-은 비모음이므로 따로 n 소리를 내지 마세요. 한국어의 "ㄴ" 받침처럼 읽지 않도록 주의하세요.
  fr.a1.unit01.lesson03.teach.final_e_enchantee:
    title: 여성형 철자
    gloss: 반갑습니다 (여성형)
    note: Enchantée는 여성형 일치를 위해 e를 더하지만, 이 e 때문에 발음되는 음절이 늘어나지는 않아요.
  fr.a1.unit01.lesson03.teach.question_liaison:
    title: 도치 의문문 읽기
    gloss: 어떻게 지내세요?
    note: allez-vous를 하나의 질문 덩어리로 이어서 읽으세요. allez의 z는 여기서 따로 z 소리가 나지 않아요. 표준 발음은 대략 "알레 부"예요.
  fr.a1.unit01.lesson04.teach.ca_va:
    title: 일상적인 안부 질문
    gloss: 잘 지내?; 괜찮아?
    note: Ça에는 세디유가 있어서 a 앞에서 c가 s 소리가 나요. 같은 표현이 억양에 따라 질문도 되고 대답도 돼요.
  fr.a1.unit01.lesson04.teach.tres_bien:
    title: 아주 긍정적인 대답
    gloss: 아주 잘 지내요, 고마워요.
    note: Très는 bien을 강조해요. 마지막 s는 소리 나지 않아요.
  fr.a1.unit01.lesson04.teach.ca_va_bien:
    title: 긍정적인 대답
    gloss: 잘 지내요.
    note: 이 고정된 대답에는 "나는"에 직접 해당하는 단어가 필요하지 않아요. 한국어에서 주어를 생략하는 것과 비슷해요.
  fr.a1.unit01.lesson04.teach.pas_mal:
    title: 어느 정도 긍정적인 대답
    gloss: 나쁘지 않아요.
    note: Pas mal은 한국어의 "나쁘지 않아요"처럼 대개 약간 긍정적인 뜻으로 쓰여요.
  fr.a1.unit01.lesson04.teach.fatigue:
    title: 남성형 형용사 일치
    gloss: 저는 조금 피곤해요.
    note: Suis는 être의 je 형태예요. 남성 화자는 fatigué라고 써요. 한국어 "피곤해요"는 화자의 성별에 따라 달라지지 않지만, 프랑스어는 달라져요.
  fr.a1.unit01.lesson04.teach.fatiguee:
    title: 여성형 형용사 일치
    gloss: 저는 조금 피곤해요.
    note: 여성 화자는 끝에 e를 붙여 fatiguée라고 써요. 남성형과 여성형은 보통 똑같이 발음해요.
  fr.a1.unit01.lesson04.teach.et_vous:
    title: 공손하게 질문 되돌리기
    gloss: 당신은요?
    note: Vous는 잘 모르는 어른에게 쓰는 존중하는 말투를 그대로 유지해 줘요.
  fr.a1.unit01.lesson04.teach.et_toi:
    title: 친근하게 질문 되돌리기
    gloss: 당신은요?
    note: 친구나 또래 한 사람에게 편하게 말할 때는 et 뒤에 toi를 써요.
  fr.a1.unit01.lesson05.teach.here_for_workshop:
    title: 상대방의 목적 확인하기
    gloss: 워크숍 때문에 오셨어요?
    note: Êtes는 être의 vous 형태예요. 프랑스어는 이 질문을 만들 때 별도의 조동사를 넣지 않고, 끝을 올리는 억양으로 질문을 나타내요.
  fr.a1.unit01.lesson05.teach.yes_thats_it:
    title: 짐작 확인해 주기
    gloss: 네, 맞아요.
    note: C’est ça는 "그것이 그것이다"라는 직역이 아니라 자연스러운 확인의 표현이에요.
  fr.a1.unit01.lesson05.teach.live_neighborhood:
    title: 사는 곳 묻기
    gloss: 이 동네에 사세요?
    note: Habitez는 habiter의 vous 형태예요. 프랑스어는 평서문과 같은 어순에 질문하는 억양을 얹어서 이렇게 물을 수 있어요.
  fr.a1.unit01.lesson05.teach.i_live:
    title: 사는 곳 말하기
    gloss: 저는 Montreuil에 살아요.
    note: J’habite는 habiter의 je 형태이고 모음이 생략되었어요. À는 도시의 위치를 나타내며, "가지고 있다"는 뜻의 동사 형태 a와 헷갈리면 안 돼요.
  fr.a1.unit01.lesson05.teach.from_here:
    title: 현지 출신인지 묻기
    gloss: 여기 분이세요?
    note: D’ici는 de와 ici가 모음 생략으로 합쳐진 말이에요. Êtes는 여전히 être의 vous 형태예요.
  fr.a1.unit01.lesson05.teach.from_lille:
    title: 출신 말하기
    gloss: 저는 Lille 출신이에요.
    note: Suis는 être의 je 형태예요. 프랑스어는 출신을 말할 때 도시 앞에 de를 써요.
  fr.a1.unit01.lesson05.teach.workshop_starts:
    title: 활동이 시작돼요
    gloss: 워크숍이 시작돼요.
    note: Atelier는 남성 명사라서 단수 관사는 le예요. 모음 앞에서는 le가 l’로 바뀌어요. Commence는 3인칭 단수형이에요.
  fr.a1.unit01.lesson05.teach.see_you_shortly:
    title: 짧은 작별 인사
    gloss: 조금 뒤에 봐요; 이따 봐요
    note: À tout à l’heure는 같은 날 나중에 다시 만난다는 뜻을 담고 있어요. 다시 만날 시점을 정하지 않은 일반적인 작별 인사와 달라요.
  fr.a1.unit01.lesson06.teach.line01:
    title: 만남 시작하기
    gloss: Inès가 Mathieu에게 인사하며 요리 워크숍에 왔는지 확인해요.
    note: 서로 모르는 어른이라서 vous로 말을 시작해요.
  fr.a1.unit01.lesson06.teach.line02:
    title: 만남 시작하기, 답하기
    gloss: Mathieu가 맞다고 답하고 이름을 말한 다음, 상대의 이름을 물어요.
    note: Je m’appelle은 이름을 말하는 기본 표현이에요.
  fr.a1.unit01.lesson06.teach.line03:
    title: 이름 주고받기
    gloss: Inès가 이름을 말하고 만나서 반갑다고 인사해요.
    note: Enchantée는 여성인 Inès에 맞춰 여성형이에요. 끝의 -e는 쓰지만 보통 소리 나지 않아요.
  fr.a1.unit01.lesson06.teach.line04:
    title: 이름 주고받기, 답하기
    gloss: Mathieu도 반갑다고 답하고 근처에 사는지 물어요.
    note: Enchanté는 남성인 Mathieu에 맞춘 형태로, Inès가 방금 쓴 단어에서 소리 나지 않는 -e를 뺀 형태예요.
  fr.a1.unit01.lesson06.teach.line05:
    title: 동네 정보 주고받기
    gloss: Inès가 그렇다고 답하고 사는 거리 이름을 말한 다음, Mathieu에게 같은 질문을 해요.
    note: J’habite 뒤에 거리 이름이 올 때는 rue 앞에 전치사를 쓰지 않아요.
  fr.a1.unit01.lesson06.teach.line06:
    title: 동네 정보 주고받기, 답하기
    gloss: Mathieu가 Saint-Ouen에 산다고 말하고, 이곳 출신인지 물어요.
    note: J’habite à에서는 지명 앞에 à를 써요. Inès가 방금 쓴 거리 표현과 달라요.
  fr.a1.unit01.lesson06.teach.line07:
    title: 출신 주고받기
    gloss: Inès가 이곳 출신이 아니라 Lille 출신이라고 말하고, Mathieu에게 되물어요.
    note: Je suis de 뒤에 도시 이름을 붙여 어디 출신인지 말해요.
  fr.a1.unit01.lesson06.teach.line08:
    title: 출신 주고받기, 답하기
    gloss: Mathieu가 Lyon 출신이라고 말해요.
    note: Inès가 방금 쓴 je suis de 패턴과 같아요.
  fr.a1.unit01.lesson06.teach.line09:
    title: 대화 잠시 멈추기
    gloss: Inès가 워크숍이 시작되는 것을 알고 곧 보자고 말해요.
