  fr.a1.unit10.lesson02.exercise04.order_je_me_couche_vingt_trois:
    instruction: '문장을 만드세요: 저는 11시쯤 자요.'
    correct_response:
    - Je
    - me
    - couche
    - vers
    - vingt-trois
    - heures
  fr.a1.unit10.lesson02.exercise05.fill_dhabitude:
    instruction: '"보통"을 뜻하는 단어를 완성하세요: D''___'
    accepted_answers:
    - habitude
    prompt_blocks:
      '0': ___, 저는 일곱 시에 일어나요. (보통)
  fr.a1.unit10.lesson02.exercise06.reply_saturday_routine:
    instruction: '방금 배운 토요일 일과로 답하세요: 늦게 일어나서 워크숍 전에 시장에 가요.'
    accepted_answers:
    - Le samedi, je me lève tard, puis je vais au marché avant l'atelier.
    - Le samedi je me lève tard, puis je vais au marché avant l'atelier.
    - Le samedi, je me lève tard, ensuite je vais au marché avant l'atelier.
    - Le samedi, je me lève tard, et ensuite je vais au marché avant l'atelier.
    - Je me lève tard, puis je vais au marché avant l'atelier.
    - Je me lève tard, ensuite je vais au marché avant l'atelier.
  fr.a1.unit10.lesson03.exercise01.comprehend_wakeup_time:
    instruction: 대화를 들으세요. Mathieu는 몇 시에 잠에서 깨나요?
    correct_option: 9시쯤
    distractors:
