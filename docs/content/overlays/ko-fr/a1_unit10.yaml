    accepted_answers:
    - Je me réveille, je vais au marché, je me repose.
    - Je me réveille, puis je vais au marché, puis je me repose.
    - D'abord je me réveille, ensuite je vais au marché, ensuite je me repose.
    - Je me réveille, ensuite je vais au marché, ensuite je me repose.
    - Je me réveille, je vais au marché et je me repose.
  fr.a1.unit10.lesson01.exercise07.dictation_je_me_leve:
