    correct_option: Je dîne.
    distractors:
    - Je me couche.
    - Je rentre.
    accepted_answers:
    - Je dîne.
    - Je dîne
  fr.a1.unit10.lesson02.exercise03.match_evening_words:
    instruction: 각 프랑스어 표현을 알맞은 한국어 뜻과 연결하세요.
    correct_response:
      rentrer à la maison: 집에 돌아가다
      dîner: 저녁을 먹다
