answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: 프랑스어 A1
  description: 재귀 동사(se réveiller, se lever, se coucher)와 순서를 나타내는 말(d'abord, ensuite)로 간단한 하루 일과를 말해요. 요리 워크숍을 배경으로 한 이네스와 마티외의 이야기가 이어지며, 이네스가 마티외의 토요일에 대해 물어요. 프랑스어 재귀 동사에는 재귀 대명사가 꼭 필요하다는 점(je ME réveille)에 주의하세요. 한국어에는 이에 딱 맞는 대응 표현이 없어요.
units:
  fr.a1.unit10.routines:
    title: 토요일 일과
lessons:
  fr.a1.unit10.lesson01.vocabulaire_routine:
    title: 아침 활동
  fr.a1.unit10.lesson02.la_journee_complete:
    title: 하루 전체
  fr.a1.unit10.lesson03.dialogue_routine_samedi:
    title: 마티외의 토요일 일과
teaching:
  fr.a1.unit10.lesson01.teach.se_reveiller:
    title: 잠에서 깨다
    gloss: 잠에서 깨다
    note: '재귀 동사예요: *je me réveille*, *tu te réveilles*. 대명사 *me/te/se*는 항상 주어에 맞춰 바뀌어요.'
    example_gloss: 저는 일곱 시에 잠에서 깨요.
  fr.a1.unit10.lesson01.teach.se_lever:
    title: 일어나다
    gloss: 일어나다
    note: '*se réveiller*(잠에서 깨다)와 달라요. *se lever*는 실제로 침대에서 일어나는 동작이에요.'
    example_gloss: 저는 그 직후에 바로 일어나요.
  fr.a1.unit10.lesson01.teach.prendre_une_douche:
    title: 샤워하다
    gloss: 샤워하다
    note: '*Prendre une douche*는 글자 그대로 샤워를 가지다라는 뜻으로, 식사나 교통수단에도 쓰는 동사 *prendre*를 써요.'
    example_gloss: 저는 아침에 샤워해요.
  fr.a1.unit10.lesson01.teach.shabiller:
    title: 옷을 입다
    gloss: 옷을 입다
    note: '또 다른 재귀 동사예요: *je m''habille*. 모음 앞에서 me가 *m''*로 줄어들어요.'
    example_gloss: 저는 아침 식사 전에 옷을 입어요.
  fr.a1.unit10.lesson01.teach.le_petit_dejeuner:
    title: 아침 식사
    gloss: 아침 식사
    note: '*Prendre le petit-déjeuner*(아침을 먹다)는 *prendre une douche*와 같은 *prendre* 형태를 다시 써요.'
    example_gloss: 저는 여덟 시에 아침을 먹어요.
  fr.a1.unit10.lesson01.teach.quitter_la_maison:
    title: 집을 나서다
    gloss: 집을 나서다
    note: 여기서 *quitter*는 장소를 떠나다라는 뜻이에요. 목적어를 바로 취하지 않는 *partir*와 헷갈리지 마세요.
    example_gloss: 저는 아홉 시에 집을 나서요.
  fr.a1.unit10.lesson01.teach.dabord_ensuite:
    title: 먼저... 그다음에...
    gloss: 먼저 일어나고, 그다음에 옷을 입어요.
    note: '*D''abord*(먼저)와 *ensuite*(그다음에)는 일과를 단계별로 설명할 때 쓰는 기본적인 순서 표현이에요.'
  fr.a1.unit10.lesson02.teach.rentrer:
    title: 집에 돌아가다
    gloss: 집에 돌아가다
    note: '*Rentrer*는 자기 집으로 돌아간다는 뜻이에요. 어딘가로 다시 간다는 더 일반적인 *retourner*와 구별돼요.'
    example_gloss: 저는 퇴근 후에 집에 돌아가요.
  fr.a1.unit10.lesson02.teach.diner:
    title: 저녁을 먹다
    gloss: 저녁을 먹다
    note: '*Dîner*는 동사(저녁을 먹다)로도, 명사(*le dîner*, 저녁 식사)로도 쓰여요. 문맥으로 구별해요.'
    example_gloss: 우리는 토요일 저녁마다 함께 저녁을 먹어요.
  fr.a1.unit10.lesson02.teach.se_coucher:
    title: 잠자리에 들다
    gloss: 잠자리에 들다
    note: 하루 일과 순서의 자연스러운 마무리로, 처음의 *se lever*와 짝을 이뤄요.
    example_gloss: 저는 밤 열한 시쯤 잠자리에 들어요.
  fr.a1.unit10.lesson02.teach.le_weekend:
    title: 주말
    gloss: 주말
    note: '*Le week-end*는 외래어에서 온 말로, 프랑스어에서는 하이픈을 넣어 써요.'
    example_gloss: 워크숍은 주말에 열려요.
  fr.a1.unit10.lesson02.teach.dhabitude:
    title: 보통
    gloss: 보통
    note: '*D''habitude*는 습관적인 일과를 말할 때 쓰며, 한 번뿐인 일에 쓰는 *aujourd''hui*(오늘)와 달라요.'
    example_gloss: 저는 보통 일곱 시에 일어나요.
  fr.a1.unit10.lesson02.teach.ma_routine_du_samedi:
    title: 토요일 묘사하기
    gloss: 토요일에는 늦게 일어나고, 그다음에 워크숍 전에 시장에 가요.
    note: '*d''abord/ensuite*처럼 순서를 나타내는 말을 *puis*(그러고 나서)와 함께 써서 토요일을 묘사해요.'
  fr.a1.unit10.lesson02.teach.quest_ce_que_tu_fais:
    title: 뭐 해요?
    gloss: 토요일에 뭐 해요?
    note: '*Qu''est-ce que tu fais... ?*는 상대가 무엇을 하는지 물을 때 쓰는 일반적인 친근한 표현이에요.'
  fr.a1.unit10.lesson03.teach.line01:
    title: 토요일에 대해 묻기
    gloss: Inès가 Mathieu에게 워크숍 전에 토요일마다 무엇을 하는지 물어요.
    note: '*Tu fais quoi... ?*는 "무엇을 하나요?"라고 물을 때 쓰는 자연스럽고 친근한 표현으로, *Qu''est-ce que tu fais ?*보다 더 편한 말투예요.'
  fr.a1.unit10.lesson03.teach.line02:
    title: 일어나는 모습 말하기
    gloss: Mathieu는 먼저 9시쯤 늦게 잠에서 깬다고 말해요.
    note: '*Vers neuf heures*(9시쯤)에는 대략적인 시각을 나타내는 *vers* + 시각 패턴이 다시 쓰였어요.'
  fr.a1.unit10.lesson03.teach.line03:
    title: 그다음에 뭘 하는지 묻기
    gloss: Inès가 그다음에 무엇을 하는지 물어요.
    note: 일과 설명이 계속 이어지도록 하는 짧고 자연스러운 되묻기 질문이에요.
  fr.a1.unit10.lesson03.teach.line04:
    title: 아침 식사와 시장 말하기
    gloss: Mathieu는 그다음에 아침을 먹고 시장에 간다고 말해요.
    note: '*et*로 이어진 두 가지 동작이에요. *d''abord*로 시작한 순서가 계속 이어져요.'
  fr.a1.unit10.lesson03.teach.line05:
    title: 집에 돌아오는 시각 묻기
    gloss: Inès가 Mathieu에게 몇 시에 돌아오는지 물어요.
    note: '*Tu rentres à quelle heure ?*는 이 단원의 *rentrer*를 직접 묻는 질문에 다시 쓴 문장이에요.'
  fr.a1.unit10.lesson03.teach.line06:
    title: 오후 일과 말하기
    gloss: Mathieu는 정오쯤 돌아오고, 오후에는 저녁 워크숍 전에 쉰다고 말해요.
    note: '*Se reposer*(쉬다)도 재귀동사예요: *je me repose*.'
