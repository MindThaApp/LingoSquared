  fr.a1.unit10.lesson01.exercise04.order_je_me_reveille_sept:
    instruction: '문장을 만드세요: 저는 7시에 잠에서 깨요.'
    correct_response:
    - Je
    - me
    - réveille
    - à
    - sept
    - heures
  fr.a1.unit10.lesson01.exercise05.fill_douche:
    instruction: '"샤워"를 뜻하는 단어로 문장을 완성하세요.'
    accepted_answers:
    - douche
    prompt_blocks:
      '0': 저는 아침에 ___를 해요. (샤워)
  fr.a1.unit10.lesson01.exercise06.speak_morning_routine:
    instruction: '1인칭("je ...")으로 자신의 아침을 순서대로 말해 보세요: 잠에서 깨기, 일어나기, 옷 입기.'
    accepted_answers:
    - Je me réveille, je me lève, je m'habille.
    - Je me réveille, puis je me lève, puis je m'habille.
    - Je me réveille, je me lève et je m'habille.
    - Je me réveille, ensuite je me lève, ensuite je m'habille.
    - D'abord je me réveille, ensuite je me lève, ensuite je m'habille.
    - D'abord, je me réveille, ensuite, je me lève, ensuite, je m'habille.
    - D'abord je me réveille, puis je me lève, puis je m'habille.
  fr.a1.unit10.lesson02.exercise01.select_se_coucher:
