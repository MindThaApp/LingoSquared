  fr.a1.unit07.lesson01.lieux_du_quartier:
    title: 동네의 장소
  fr.a1.unit07.lesson02.demander_son_chemin:
    title: 길 묻기
  fr.a1.unit07.lesson03.dialogue_chercher_pharmacie:
    title: 약국 찾기
teaching:
  fr.a1.unit07.lesson01.teach.gare:
    title: 기차역
    gloss: 기차역
    note: '*Gare*는 여성 명사예요.'
    example_gloss: 기차역이 커요.
  fr.a1.unit07.lesson01.teach.pharmacie:
    title: 약국
    gloss: 약국
    note: '*Pharmacie*는 여성 명사예요.'
    example_gloss: 약국은 9시에 열어요.
  fr.a1.unit07.lesson01.teach.banque:
    title: 은행
    gloss: 은행
    note: '*Banque*는 여성 명사예요.'
    example_gloss: 은행은 일요일에 문을 닫아요.
  fr.a1.unit07.lesson01.teach.ecole:
    title: 학교
    gloss: 학교
    note: '*École*는 여성 명사예요. 모음 소리 앞이라서 *l''*로 줄어요.'
    example_gloss: 학교는 공원 옆에 있어요.
  fr.a1.unit07.lesson01.teach.cafe:
    title: 카페
    gloss: 카페
    note: '*Café*는 남성 명사예요. 다른 상황에서는 "커피"라는 뜻도 있어요.'
    example_gloss: 카페는 하루 종일 열려 있어요.
  fr.a1.unit07.lesson01.teach.poste:
    title: 우체국
    gloss: 우체국
    note: 여기서 *Poste*(여성 명사)는 "우체국"을 뜻해요. *le poste*(남성 명사)는 "직위, 일자리"처럼 뜻이 달라요. 성에 따라 뜻이 바뀌는 거예요.
    example_gloss: 우체국은 6시에 문을 닫아요.
  fr.a1.unit07.lesson01.teach.la_gare_est_grande:
    title: 두 장소 비교하기
    gloss: 기차역은 크고 약국은 작아요.
    note: '*Grande*와 *petite*는 여기서 둘 다 여성 명사(*la gare*, *la pharmacie*)에 맞춘 형태예요.'
  fr.a1.unit07.lesson02.teach.ou_est_la_gare:
    title: 장소가 어디인지 묻기
    gloss: 실례지만, 기차역이 어디예요?
    note: '*Où est... ?*는 장소의 위치를 물을 때 두루 쓰는 기본 표현이에요.'
  fr.a1.unit07.lesson02.teach.en_face_de:
    title: 맞은편에 있다고 말하기
    gloss: 은행은 기차역 맞은편에 있어요.
    note: '*En face de*(~ 맞은편에)는 *de*로 끝나고, 뒤에 기준이 되는 장소가 와요: *en face de la banque*. 남성 명사 앞에서는 de가 합쳐져요: *en face du café*.'
  fr.a1.unit07.lesson02.teach.a_cote_de:
    title: 옆에 있다고 말하기
    gloss: 약국은 은행 옆에 있어요.
    note: '*À côté de*(~ 옆에)도 *en face de*처럼 *de*로 기준 장소와 이어요.'
  fr.a1.unit07.lesson02.teach.pres_de:
    title: 가깝다고 말하기
    gloss: 학교는 여기서 가까워요.
    note: '*Près de*(~ 가까이에)는 모음 소리 앞에서 *près d''*로 줄어요. *près d''ici*(여기서 가까이)처럼요.'
  fr.a1.unit07.lesson02.teach.loin_de:
    title: 멀다고 말하기
    gloss: 우체국은 여기서 멀어요.
    note: '*Loin de*(~에서 멀리)는 *près de*와 정반대의 뜻이에요.'
  fr.a1.unit07.lesson02.teach.cest_loin:
    title: 멀어요? 하고 묻기
    gloss: 여기서 멀어요? — 아니요, 멀지 않아요.
    note: '*C''est loin d''ici ?*는 길 안내를 들은 뒤에 자연스럽게 이어 묻는 질문이에요. 아니라고 답할 때는 동사를 *ne... pas*로 감싸요: *ce n''est pas loin*(멀지 않아요).'
  fr.a1.unit07.lesson03.teach.line01:
    title: 모르는 사람에게 길 묻기
    gloss: 마티외가 지나가는 사람에게 정중하게 약국이 어디인지 물어요.
    note: '*Excusez-moi*(실례합니다)는 모르는 사람에게 다가갈 때 쓰는 기본적인 공손한 인사말이에요. *vous*와 함께 써요.'
  fr.a1.unit07.lesson03.teach.line02:
    title: 위치 알려 주기
    gloss: 그녀는 은행 맞은편, 카페 옆에 있다고 말해요.
    note: '*en face de*와 *à côté de*를 한 문장에 함께 써서 위치를 정확하게 알려 줘요. *De* + *le café*는 *du café*로 합쳐져요.'
  fr.a1.unit07.lesson03.teach.line03:
    title: 먼지 묻기
    gloss: 마티외가 여기서 먼지 물어요.
    note: 거리를 물을 때 배운 *C'est loin d'ici ?*와 같은 표현이에요.
  fr.a1.unit07.lesson03.teach.line04:
    title: 가깝다고 안심시키기
    gloss: 그녀는 아니요, 아주 가깝다고, 걸어서 5분이라고 말해요.
    note: '*À pied*(걸어서)는 이동 수단이 도보임을 말할 때 쓰는 기본 표현이에요.'
  fr.a1.unit07.lesson03.teach.line05:
    title: 감사 인사하기
    gloss: 마티유가 그녀에게 진심으로 고마워해요.
    note: '*Merci beaucoup*는 앞서 배운 기본 표현 *merci*를 강조한 말이에요.'
  fr.a1.unit07.lesson03.teach.line06:
    title: 감사 인사에 답하기
    gloss: 그녀가 천만에요라고 답해요.
    note: '*Je vous en prie*는 더 격식 있는 ''천만에요''로, 낯선 사람에게 쓰는 *vous* 말투에 맞아요. *De rien*은 덜 격식적인 일상 표현이에요.'
