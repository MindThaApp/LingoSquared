answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: 프랑스어 A1
  description: 간단한 약속을 제안하고, 수락하고, 거절하고, 일정을 잡는 표현을 배워요. Inès와 Mathieu의 요리 워크숍 이야기가 이어지며, 두 사람은 토요일 수업 전에 함께 재료를 사러 가기로 해요. *se retrouver*는 재귀/상호 표현으로 '서로 약속해서 만나다'를 뜻하고, *vers* + 시각은 정확한 시각이 아닌 대략적인 만남 시각을 나타내요.
units:
  fr.a1.unit11.plans:
    title: 언제 만날까요?
lessons:
  fr.a1.unit11.lesson01.vocabulaire_projets:
    title: 시간 제안하기
  fr.a1.unit11.lesson02.accepter_refuser:
    title: 수락과 거절
  fr.a1.unit11.lesson03.dialogue_projet_courses:
    title: 장보기 계획 세우기
teaching:
  fr.a1.unit11.lesson01.teach.libre:
    title: 한가한 / 시간이 되는
    gloss: 한가한 / 시간이 되는
    note: 여기서 *libre*는 사람의 시간이 비어 있음을 나타내요. 돈이 들지 않는다는 뜻일 때는 *gratuit*를 써요.
    example_gloss: 토요일에 시간 돼요?
  fr.a1.unit11.lesson01.teach.occupe:
    title: 바쁜
    gloss: 바쁜
    note: '*libre*의 정반대 말이에요. 성에 따라 *occupé* / *occupée*로 형태가 달라져요.'
    example_gloss: 금요일 저녁에는 바빠요.
  fr.a1.unit11.lesson01.teach.se_retrouver:
    title: 만나다
    gloss: 만나다
    note: 이 뜻의 *se retrouver*는 상호적이에요. 둘 이상이 서로 만나는 것이고, *trouver*(찾다)와는 달라요.
    example_gloss: 오늘 저녁에 어디서 만날까요?
  fr.a1.unit11.lesson01.teach.vers:
    title: ~쯤 (시각)
    gloss: ~쯤 (시각)
    note: '*Vers* + 시각은 대략적인 시각을 나타내며, 정확한 시각을 말하는 것보다 부드러워요.'
    example_gloss: 7시쯤 들를게요.
  fr.a1.unit11.lesson01.teach.ca_te_dit_de:
    title: ~할래요?
    gloss: 같이 장보러 갈래요?
    note: '*Ça te dit de... ?* + 동사원형은 활동을 제안할 때 흔히 쓰는 친근한 표현으로, *Voulez-vous... ?*보다 편해요.'
  fr.a1.unit11.lesson01.teach.venir_chercher:
    title: 데리러 오다
    gloss: 오후 6시쯤 저 데리러 올래요?
    note: '*Venir chercher quelqu''un*은 ''누군가를 데리러 오다''라는 뜻이고, 단순히 ''찾다''가 아니에요.'
  fr.a1.unit11.lesson01.teach.daccord_a_tout_a_lheure:
    title: 좋아요, 이따 봐요
    gloss: 알겠어요, 이따 봐요!
    note: '*D''accord*(좋아요/알겠어요)는 계획을 확정하는 말이고, *à tout à l''heure*는 같은 날 나중에 다시 볼 때 써요.'
  fr.a1.unit11.lesson02.teach.je_ne_peux_pas:
    title: 약속 거절하기
    gloss: 못 가요, 바빠요.
    note: '*Je ne peux pas*(할 수 없어요) + 이유는 간단하고 공손하게 거절하는 방법이에요.'
  fr.a1.unit11.lesson02.teach.avec_plaisir:
    title: 기쁘게 수락하기
    gloss: 기꺼이요!
    note: '*Avec plaisir*(직역하면 "기쁨과 함께")는 초대를 따뜻하고 반갑게 수락하는 표현이에요.'
  fr.a1.unit11.lesson02.teach.a_quelle_heure_on_se_voit:
    title: 시간 묻기
    gloss: 몇 시에 만날까요?
    note: '*On se voit*(직역하면 ''서로 본다'')은 약속을 잡을 때 *se retrouver* 대신 쓰는, 편하고 흔한 표현이에요.'
  fr.a1.unit11.lesson02.teach.devant_le_marche:
    title: 장소 제안하기
    gloss: 시장 앞에서요, 괜찮아요?
    note: '*Ça te va ?*(너한테 괜찮아?)는 제안한 내용이 상대방에게 괜찮은지 확인하는 표현이에요.'
  fr.a1.unit11.lesson02.teach.parfait_alors:
    title: 약속 확정하기
    gloss: 좋아요, 그럼 금요일에 봐요!
    note: 여기서 *Alors*는 결정된 내용을 확인하며 '그럼'이라는 뜻으로 쓰여, 약속 잡기를 마무리해요.
  fr.a1.unit11.lesson03.teach.line01:
    title: 함께 장보기 제안하기
    gloss: Inès가 Mathieu에게 워크숍 전에 같이 장을 보러 가자고 해요.
    note: '*Ça te dit de... ?*는 가볍게 제안하며 대화를 여는 표현이에요.'
  fr.a1.unit11.lesson03.teach.line02:
    title: 수락하고 장소 묻기
    gloss: Mathieu가 기꺼이 좋다고 하며 어디서 만날지 물어요.
    note: '*Avec plaisir*(기꺼이)와 *se retrouver*(만나다)를 함께 쓴 표현이에요.'
  fr.a1.unit11.lesson03.teach.line03:
    title: 장소와 요일 제안하기
    gloss: Inès가 금요일 저녁에 시장 앞에서 만나자고 제안해요.
    note: 장소(*devant le marché*)와 요일(*vendredi soir*)을 함께 말하는 짧은 제안이에요.
  fr.a1.unit11.lesson03.teach.line04:
    title: 수락하고 시간 묻기
    gloss: Mathieu가 동의하며 몇 시인지 물어요.
    note: '*D''accord*로 장소와 요일에 동의하고, 이어지는 질문으로 정확한 시간을 좁혀 가요.'
  fr.a1.unit11.lesson03.teach.line05:
    title: 구체적인 시간 제안하기
    gloss: Inès가 Mathieu에게 오후 6시쯤 데리러 올 수 있는지 물어요.
    note: '*venir chercher*와 *vers*를 구체적인 시각과 함께 쓴 표현이에요.'
  fr.a1.unit11.lesson03.teach.line06:
    title: 모든 내용 확정하기
    gloss: Mathieu가 좋다고 하며, 그럼 금요일 오후 6시에 시장 앞에서 보자고 말해요.
    note: 요일, 시간, 장소 세 가지를 한꺼번에 다시 말해 대화를 분명하게 마무리해요.
