teaching:
  fr.a1.unit48.lesson01.teach.le_manteau_le:
    title: 코트, 스웨터
    gloss: 코트, 스웨터
    note: '*Le manteau*와 *le pull*은 둘 다 남성 명사예요.'
    example_gloss:
    - 저는 코트를 찾고 있어요.
    - 저는 스웨터가 있어요.
  fr.a1.unit48.lesson01.teach.le_pantalon_les:
    title: 바지, 신발
    gloss: 바지, 신발
    note: '*Pantalon*은 한국어 ''바지''처럼 하나의 물건으로 보아 프랑스어에서는 단수예요. 바지 한 벌은 *un pantalon*이라고 해요. *Chaussures*는 *chaussure*의 복수형이고, 신발은 보통 한 켤레를 말할 때도 복수로 말하는 경우가 많아요.'
    example_gloss:
    - 저는 바지를 찾고 있어요.
    - 저는 신발을 찾고 있어요.
  fr.a1.unit48.lesson01.teach.je_cherche_un:
    title: 찾는 물건 말하기
    gloss: 저는 코트를 찾고 있어요.
    note: '*Chercher*(찾다)는 전치사 없이 목적어를 바로 취해요: *je cherche un manteau*.'
  fr.a1.unit48.lesson02.teach.la_taille:
    title: 사이즈
    gloss: 사이즈
    note: '*Taille*는 여성 명사예요: *la taille*.'
    example_gloss: 사이즈가 어떻게 되세요?
  fr.a1.unit48.lesson02.teach.quelle_taille_faites:
    title: 사이즈 묻기
    gloss: 사이즈가 어떻게 되세요?
    note: '*Quelle taille ?*에서는 *taille*가 여성 명사이고 S, M, L이나 숫자처럼 답이 몇 가지로 정해져 있기 때문에 ''어느''를 뜻하는 *quelle*을 써요.'
  fr.a1.unit48.lesson02.teach.je_fais_du:
    title: 내 사이즈 말하기
    gloss: 저는 M 사이즈예요.
    note: '*Faire du M*은 M 사이즈라는 뜻이에요. 한국어에서는 ''~이다''나 ''입다''를 쓰는 자리에 프랑스어는 *faire*(만들다, 하다)를 써요.'
  fr.a1.unit48.lesson03.teach.noir_bleu:
    title: 검은색, 파란색
    gloss: 검은색, 파란색
    note: 이번 수업에 나오는 기본 색깔 형용사 두 개예요.
    example_gloss:
    - 검은색 코트로 할게요.
    - 이것도 파란색이 있나요?
  fr.a1.unit48.lesson03.teach.je_veux_le:
    title: 색상 요청하기
    gloss: 검은색 코트로 할게요.
    note: 옷을 주문하거나 요청할 때 색을 말하려면 *en* + 색 표현을 쓰는 것이 기본이에요.
  fr.a1.unit48.lesson03.teach.avez_vous_aussi:
    title: 다른 색상 묻기
    gloss: 이것도 파란색이 있나요?
    note: '*Aussi*(또한)를 써서 다른 색도 있는지 묻는 표현이며, 격식을 갖춘 *vous*를 사용했어요.'
  fr.a1.unit48.lesson04.teach.est_ce_que:
    title: 잘 맞는지 묻기
    gloss: 이 코트 잘 맞아?
    note: '옷이 몸에 맞는지 말할 때는 *aller*(가다)를 쓰는 것이 자연스러워요: *il me va bien*, 직역하면 ''나에게 잘 간다''예요.'
  fr.a1.unit48.lesson04.teach.il_me_va:
    title: 잘 맞는다고 확인하기
    gloss: 잘 맞아요.
    note: '*Bien*(잘)은 옷이 어떻게 맞는지를 나타내요.'
  fr.a1.unit48.lesson04.teach.c_est_trop:
    title: 너무 작아요
    gloss: 너무 작아요.
    note: '*Trop*(너무)은 지나침을 나타내며 형용사 앞에 와요.'
  fr.a1.unit48.lesson04.teach.c_est_trop_2:
    title: 너무 커요
    gloss: 너무 커요.
    note: 앞 카드의 *trop petit*와 같은 *trop* + 형용사 구조예요.
  fr.a1.unit48.lesson05.teach.quatre_vingt_dix:
    title: '90'
    gloss: 90, 구십
    note: '*Quatre-vingt-dix*는 숫자 90이에요(직역하면 ''20이 네 번 더하기 10''). 여기서는 코트 가격에 쓰였어요.'
    example_gloss: 코트는 90유로예요.
  fr.a1.unit48.lesson05.teach.le_manteau_coute:
    title: 가격 말하기
    gloss: 코트는 90유로예요.
    note: '*Coûte*는 *coûter*(값이 나가다)의 *il* 형태예요.'
  fr.a1.unit48.lesson05.teach.parka_taille_m:
    title: 매장 영수증 읽기
    gloss: '겨울 코트: 사이즈 M, 색상 검은색. 가격: 90유로. 이 코트는 잘 맞고 따뜻해요.'
    note: 사이즈, 색상, 가격, 그리고 코트에 대해 언급된 두 가지 장점을 찾아보세요.
    glosses:
      Parka: 겨울 코트
      taille: 사이즈
      couleur: 색
      noire: 검은색
      Prix: 가격
      quatre-vingt-dix: '90'
      euros: 유로
      manteau: 코트
      va: 맞아요
      chaud: 따뜻해요
  fr.a1.unit48.lesson06.teach.camille_ce_manteau:
    title: 카미유가 코트를 발견해요
    gloss: '카미유: 이 코트 예쁘다! 너 사이즈가 뭐야?'
    note: '*Joli*(예쁜)는 일반적인 긍정 반응이에요. 여기서는 *manteau*에 맞춰 남성형이에요.'
  fr.a1.unit48.lesson06.teach.mathieu_je_fais:
    title: 마티외가 입어 봐도 되는지 물어요
    gloss: '마티외: 나는 M 사이즈야. 입어 봐도 돼?'
    note: '*Je peux ... ?*는 허락을 구하는 기본 표현이에요. *l''essayer*는 ''입어 보다''라는 뜻이고, *l''*는 코트를 가리켜요.'
  fr.a1.unit48.lesson06.teach.camille_bien_sur:
    title: 카미유가 잘 맞는지 물어요
    gloss: '카미유: 물론이지. 잘 맞아?'
    note: '*Il*(그것)은 남성 명사인 *le manteau*를 다시 가리켜요.'
  fr.a1.unit48.lesson06.teach.mathieu_oui_il:
    title: 마티외가 확인해요
    gloss: '마티외: 응, 잘 맞고 따뜻해.'
    note: 앞서 읽은 영수증의 내용과 똑같아요. 같은 코트예요.
  fr.a1.unit48.lesson06.teach.camille_super_tu:
    title: 카미유가 색상을 물어요
    gloss: '카미유: 좋다! 검은색으로 할래, 파란색으로 할래?'
    note: '*Tu le veux en ... ou en ... ?*는 선택지를 주는 표현이에요. *le*는 코트를 가리켜요.'
  fr.a1.unit48.lesson06.teach.mathieu_je_le:
    title: 마티외가 결정해요
    gloss: '마티외: 검은색으로 살게.'
    note: '*Prendre*(가지다, 사다)는 구매를 확정할 때 쓰는 자연스러운 동사예요. 영수증에 적힌 색상과도 일치해요.'
  fr.a1.unit48.lesson06.teach.on_ecrit_prends:
    title: Prends 또는 prend
    gloss: '*Prends*는 *prendre*(가지다)의 ''나''형과 ''너''형이고, *prend*는 ''그/그녀''형이에요.'
    note: '*prendre*의 변화: *je prends, tu prends, il/elle prend*.'
