course:
  title: 프랑스어 A1
  description: 하루의 시간대와 시각 말하기(heure(s), et quart, et demie, moins le quart)를 배우며, 이네스와 마티외의 요리 워크숍 이야기를 이어서 다음 모임 일정을 잡아요. 공식적인 일정 상황에서는 24시간제(dix-huit heures trente)를 쓰는데, 이 단원 앞부분에서 배운 일상적인 12시간제 표현과 함께 익혀요.
units:
  fr.a1.unit06.time:
    title: 몇 시예요?
