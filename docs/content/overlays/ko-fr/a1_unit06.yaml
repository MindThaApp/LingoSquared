  fr.a1.unit06.lesson01.moments_de_la_journee:
    title: 하루의 시간대
  fr.a1.unit06.lesson02.dire_lheure:
    title: 시간 말하기
  fr.a1.unit06.lesson03.dialogue_prochain_atelier:
    title: 다음 워크숍
teaching:
  fr.a1.unit06.lesson01.teach.heure:
    title: 시간; 시각
    gloss: 시간; 시각
    note: '*Heure*는 여성 명사예요. 시각을 말할 때 쓰는 단위이기도 해요(*dix heures* = 10시).'
    example_gloss: 몇 시예요?
  fr.a1.unit06.lesson01.teach.matin:
    title: 아침
    gloss: 아침
    note: '*Matin*은 남성 명사예요.'
    example_gloss: 시장은 아침에 열려요.
  fr.a1.unit06.lesson01.teach.apres_midi:
    title: 오후
    gloss: 오후
    note: '*Après-midi*는 남성 명사로도 여성 명사로도 쓰여요(남성이 더 흔해요). 모음 소리 앞이라 *l''*로 줄어들어요.'
    example_gloss: 저는 오후에 일해요.
  fr.a1.unit06.lesson01.teach.soir:
    title: 저녁
    gloss: 저녁
    note: '*Soir*는 남성 명사예요.'
    example_gloss: 요리 워크숍은 저녁에 있어요.
  fr.a1.unit06.lesson01.teach.midi:
    title: 정오
    gloss: 정오
    note: '*Midi*는 시각을 나타낼 때 관사 없이 써요(*à midi*이고 *au midi*가 아니에요).'
    example_gloss: 우리는 정오에 식사해요.
  fr.a1.unit06.lesson01.teach.minuit:
    title: 자정
    gloss: 자정
    note: '*Minuit*도 *midi*처럼 관사 없이 써요.'
    example_gloss: 워크숍은 자정을 넘기는 일이 없어요.
  fr.a1.unit06.lesson01.teach.latelier_commence_le_soir:
    title: 워크숍이 언제인지 말하기
    gloss: 워크숍은 아침이 아니라 저녁에 시작해요.
    note: '*le soir*와 *le matin*을 직접 대비시키며, 이번 수업의 어휘 두 개를 다시 써요.'
  fr.a1.unit06.lesson02.teach.quelle_heure_est_il:
    title: 시각 묻기
    gloss: 몇 시예요?
    note: '*Quelle heure est-il ?*는 시각을 묻는 가장 표준적이고 두루 쓰이는 표현이에요. *-il*은 동사와 도치되어 의문문임을 나타내요.'
  fr.a1.unit06.lesson02.teach.il_est_dix_heures:
    title: 정각 말하기
    gloss: 10시예요.
    note: '*Il est* + 숫자 + *heures*는 정각을 말하는 기본 형태예요. *heures*는 *une heure*(1시)를 제외하고 복수형을 써요.'
  fr.a1.unit06.lesson02.teach.et_quart:
    title: 15분 지난 시각 말하기
    gloss: 10시 15분이에요.
    note: '*Et quart*(15분)는 말한 시각에 15분을 더해요.'
  fr.a1.unit06.lesson02.teach.et_demie:
    title: 30분 말하기
    gloss: 10시 30분이에요.
    note: '*Et demie*(30분)는 30분을 더해요. *demie*는 *heure*에 맞춰 여성형 -e가 붙어요.'
  fr.a1.unit06.lesson02.teach.moins_le_quart:
    title: 15분 전 말하기
    gloss: 11시 15분 전이에요.
    note: '*Moins le quart*(15분을 뺀)는 지금 시각이 아니라 다음 시각을 기준으로 15분 전을 말해요. 그래서 10시가 아니라 11시를 말해야 해요.'
  fr.a1.unit06.lesson02.teach.a_quelle_heure:
    title: 무언가가 몇 시에 시작하는지 묻기
    gloss: 워크숍은 몇 시에 시작해요?
    note: '*À quelle heure ?*(몇 시에)는 예정된 일을 물을 때 써요. 일반적으로 시각을 묻는 *Quelle heure est-il ?*와 달라요.'
  fr.a1.unit06.lesson03.teach.line01:
    title: 다음 주 시작 시간 묻기
    gloss: 이네스가 다음 주 워크숍이 몇 시인지 물어요.
    note: '*La semaine prochaine*(다음 주)이 이번 수업의 *à quelle heure* 질문 형태와 함께 쓰여요.'
  fr.a1.unit06.lesson03.teach.line02:
    title: 시작 시간 말하기
    gloss: 마티외가 18시 30분에 시작하는 것 같다고 말해요.
    note: '*Dix-huit heures trente*는 프랑스에서 일정을 말할 때 흔히 쓰는 24시간제 표현이에요. 일상적인 *et demie* 표현과는 달라요.'
  fr.a1.unit06.lesson03.teach.line03:
    title: 저녁인지 확인하기
    gloss: 이네스가 아침이 아니라 저녁이 맞는지 확인해요.
    note: '*le soir*와 *le matin*을 대비시켜 확인하는 짧은 질문이에요.'
  fr.a1.unit06.lesson03.teach.line04:
    title: 확인하고 이유 말하기
    gloss: 마티외가 저녁이 맞고, 퇴근 후라 더 편하다고 말해요.
    note: '*Après le travail*(퇴근 후)은 간단하고 현실적인 이유를 나타내요.'
  fr.a1.unit06.lesson03.teach.line05:
    title: 끝나는 시간 묻기
    gloss: 이네스가 몇 시에 끝나는지 물어요.
    note: '*Finit*(끝나다)은 앞에 나온 *commence*(시작하다)와 짝을 이루는 말이에요.'
  fr.a1.unit06.lesson03.teach.line06:
    title: 끝나는 시간 말하기
    gloss: 마티외가 늘 그렇듯 20시 15분쯤 끝난다고 말해요.
    note: '*Vers*(쯤, 경)는 대략적인 시각을 나타내요. 정확한 시각을 말하는 *à*보다 부드러운 표현이에요.'
  fr.a1.unit06.lesson03.teach.line07:
    title: 계획 확정하기
    gloss: 이네스가 다음 주 18시 30분에 만나자고 확정해요.
    note: 확정된 시각을 다시 말하며 대화를 마무리해요. 프랑스어에서 약속을 확인하는 자연스러운 방법이에요.
