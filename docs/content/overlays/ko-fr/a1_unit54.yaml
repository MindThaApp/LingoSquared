  description: 반려동물과 흔한 동물에 대해 이야기하는 초급 프랑스어예요. 동물 이름 말하기, 기본적인 돌보기(산책시키기, 먹이 주기, 놀기), 반려동물이 없어도 좋아하는 동물 말하기, 그리고 규칙적인 프랑스어 복수형을 배워요.
