teaching:
  fr.a1.unit54.lesson01.teach.l_animal_un:
    title: 동물, 반려동물
    gloss: 동물 / 반려동물
    note: '*Un animal*은 일반적인 말이고, *un animal de compagnie*(직역하면 ''동반의 동물'')는 특히 반려동물을 뜻해요.'
    example_gloss:
