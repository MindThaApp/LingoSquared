    gloss: 'Camille: 털이 갈색이고 작아요.'
    note: 외모 단원에서 배운 머리 색과 크기 표현을 이번에는 사람의 머리카락이 아니라 동물의 털을 설명하는 데 써요.
  fr.a1.unit54.lesson04.teach.il_et_le:
    title: 동물에 쓰는 Il/le
    gloss: '*Il*(그)과 *le*(그를)는 사람뿐 아니라 수컷 동물에도 쓸 수 있어요.'
    note: 지금까지 *il*과 *le*는 사람을 가리켰지만, 동물에도 쓸 수 있다는 점을 짚어 주는 설명이에요.
  fr.a1.unit54.lesson04.teach.mathieu_tu_le:
    title: Mathieu가 산책에 대해 물어요
