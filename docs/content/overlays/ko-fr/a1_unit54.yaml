    - 개는 반려동물이기도 해요.
  fr.a1.unit54.lesson01.teach.le_chien_le:
    title: 개와 고양이
    gloss: 개 / 고양이
    example_gloss:
    - Camille은 개를 키워요.
    - Thomas는 고양이를 키워요.
  fr.a1.unit54.lesson01.teach.le_poisson_l:
    title: 물고기와 새
    gloss: 물고기 / 새
    example_gloss:
    - 할아버지에게는 물고기가 있어요.
    - Nina에게는 새가 있어요.
  fr.a1.unit54.lesson01.teach.tu_as_un:
    title: 반려동물이 있어요?
    gloss: 반려동물이 있어요?
    note: 앞 단원에서 이미 배운 *Tu as ... ?* 질문 형태와 같아요.
  fr.a1.unit54.lesson01.teach.oui_j_ai:
    title: 네, 개가 있어요
    gloss: 네, 저는 개가 있어요.
    note: 이 단원의 새 어휘를 사용한 간단한 긍정 대답이에요.
  fr.a1.unit54.lesson01.teach.non_je_n:
    title: 아니요, 반려동물이 없어요
    gloss: 아니요, 저는 반려동물이 없어요.
    note: '부정문에서는 *un* 대신 *pas d''*를 써요: *Je n''ai pas d''animal de compagnie.* 문법 설명을 참고하세요.'
  fr.a1.unit54.lesson01.teach.apres_ne_pas:
    title: 'Pas de: un/une/des의 부정'
    gloss: '*ne ... pas* 뒤에서 *un*, *une*, *des*는 *de* 또는 *d''*로 바뀌어요. 이미 아는 *Je n''ai pas de temps*가 그 예이고, 여기서는 *Je n''ai pas d''animal de compagnie*가 그래요.'
    note: '*Je n''ai pas de temps*에서 배운 규칙을 그대로 써요. 새로운 문법이 아니라 새 명사에 적용해 보는 것뿐이에요.'
  fr.a1.unit54.lesson02.teach.promener:
    title: (동물을) 산책시키다
    gloss: (동물을) 산책시키다
    note: '*Promener*(산책시키다)는 규칙적인 *-er* 동사예요. 문법 설명을 참고하세요.'
    example_gloss: 저는 매일 개를 산책시켜요.
  fr.a1.unit54.lesson02.teach.promener_est_un:
    title: Promener는 규칙적인 -er 동사예요
    gloss: '*Promener*는 *cuisiner*처럼 규칙적인 *-er* 동사예요: *je promène, tu promènes, il promène le chien*. *e* 위의 악센트는 그 e를 소리 내어 읽는다는 표시예요.'
    note: 이미 배운 다른 *-er* 동사처럼 동사 하나만으로 쓰여요.
  fr.a1.unit54.lesson02.teach.donner_a_manger:
    title: 먹이를 주다
    gloss: 먹이를 주다
    example_gloss: 저는 매일 고양이에게 먹이를 줘요.
  fr.a1.unit54.lesson02.teach.jouer_avec:
    title: ~와 놀다
    gloss: ~와 놀다
    example_gloss: Thomas는 자기 고양이와 놀아요.
  fr.a1.unit54.lesson02.teach.je_promene_le:
    title: 저는 매일 개를 산책시켜요
    gloss: 저는 매일 개를 산책시켜요.
    note: '*promener*에 앞에서 배운 *tous les jours*(매일)를 합친 표현이에요.'
  fr.a1.unit54.lesson02.teach.je_donne_a:
    title: 저는 매일 고양이에게 먹이를 줘요
    gloss: 저는 매일 고양이에게 먹이를 줘요.
    note: '*donner à manger*(직역하면 ''먹도록 주다'')에 *tous les jours*를 합친 표현이에요.'
  fr.a1.unit54.lesson03.teach.au_pluriel_on:
    title: '복수형: chien -> chiens'
    gloss: '복수형은 보통 들리지 않는 *s*를 붙여요: *chien -> chiens*, *chat -> chats*. *-al*로 끝나는 명사는 *-aux*로 바뀌어요: *animal -> animaux*.'
    note: 동물 명사를 예로 들어 처음 배우는 프랑스어의 규칙적인 복수형 만들기예요.
  fr.a1.unit54.lesson03.teach.chiens_chats:
    title: 개와 고양이
    gloss: 개들 / 고양이들
    example_gloss:
    - Mathieu는 개를 아주 좋아해요.
    - Léa는 고양이를 아주 좋아해요.
  fr.a1.unit54.lesson03.teach.poissons_oiseaux:
    title: 물고기와 새 (복수)
    gloss: 물고기들 / 새들
    example_gloss:
    - 저는 물고기를 아주 좋아해요.
    - 할아버지는 새를 아주 좋아하세요.
  fr.a1.unit54.lesson03.teach.j_adore_les:
    title: 저는 동물을 아주 좋아해요
    gloss: 저는 동물을 아주 좋아해요.
    note: '*Adorer*(아주 좋아하다) 뒤에는 명사가 바로 오고, 일반적인 취향을 말할 때는 *les*를 써요: *J''adore les animaux.*'
  fr.a1.unit54.lesson03.teach.lea_adore_les:
    title: Léa는 고양이를 아주 좋아하지만 반려동물은 없어요
    gloss: Léa는 고양이를 아주 좋아하지만 반려동물은 없어요.
    note: 이 단원의 읽기 글에 나오는 대비를 미리 보여 주는 문장이에요.
  fr.a1.unit54.lesson04.teach.mathieu_tu_as:
    title: Mathieu가 반려동물에 대해 물어요
