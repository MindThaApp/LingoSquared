  fr.a1.unit54.lesson05.teach.mathieu_et_lea:
    title: 동물에 대해 이야기하는 Mathieu, Léa, Thomas
    gloss: Mathieu와 Léa는 둘 다 동물을 아주 좋아하지만, 둘 중 누구도 반려동물이 없어요. Mathieu는 개를 아주 좋아하고 Léa는 고양이를 아주 좋아해요. 반면 Thomas는 반려동물이 있어요. 바로 고양이예요. Thomas는 자주 고양이와 놀고 매일 먹이를 줘요. 여러분은 반려동물이 있나요?
    note: 동물을 좋아하는 것과 실제로 키우는 것의 차이를 보여 줘요. 이 단원이 전하려는 핵심이에요.
    glosses:
      adorent: 사랑해요
      tous: 둘 다
      animaux: 동물들
      deux: 둘 다
      compagnie: 반려동물
      chiens: 개들
      chats: 고양이들
      chat: 고양이
      joue: 놀아요
      donne: 줘요
      chaque: 매
      manger: 먹이
  fr.a1.unit54.lesson05.teach.thomas_joue_souvent:
    title: Thomas는 자주 자기 고양이와 놀아요
    gloss: Thomas는 자주 자기 고양이와 놀아요.
    note: 앞의 일과 표현처럼 *souvent*(자주)은 동사 바로 뒤에 와요.
  fr.a1.unit54.lesson05.teach.j_adore_les:
    title: 저는 개를 좋아해요. 반려동물은 없어요.
    gloss: 저는 개를 좋아해요. 반려동물은 없어요.
    note: 이 단원의 쓰기 과제에 그대로 쓸 수 있는 두 문장짜리 모범 답안이에요.
  fr.a1.unit54.lesson06.teach.camille_nina_tu:
    title: Camille이 Nina에게 물어요
    gloss: 'Camille: Nina, 너도 반려동물 있어?'
