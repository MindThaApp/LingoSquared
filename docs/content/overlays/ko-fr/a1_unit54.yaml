    title: 니나에게는 피코라는 새가 있어요
    gloss: '니나: 응, 새를 키워. 이름은 피코야.'
    note: '*Il s''appelle*(이름이 ~예요)는 첫 단원에서 배운 소개 표현의 동사를 다시 쓴 거예요.'
  fr.a1.unit54.lesson06.teach.mathieu_comme_c:
    title: Mathieu가 반응해요
    gloss: 'Mathieu: 정말 좋겠다! 매일 그 새와 뭐 해?'
  fr.a1.unit54.lesson06.teach.nina_je_lui:
    title: 니나가 매일 먹이를 줘요
    gloss: '니나: 매일 먹이를 줘.'
  fr.a1.unit54.lesson06.teach.mathieu_j_adore:
    title: Mathieu도 새를 아주 좋아해요
    gloss: 'Mathieu: 나도 새를 아주 좋아해.'
  fr.a1.unit54.lesson06.teach.camille_c_est:
    title: Camille이 대화를 마무리해요
    gloss: 'Camille: 좋네요, 우리 셋 모두 동물을 좋아해요!'
    note: 이 단원에 나온 세 사람의 동물 이야기를 하나로 마무리해요.
