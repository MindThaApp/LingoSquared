  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: 프랑스어 A1
  description: 좋고 싫음과 선호를 표현하고 묻는 기본 표현을 배우며, Inès와 Mathieu의 요리 워크숍 이야기가 이어져 두 사람이 토요일에 만들 레시피를 둘 중에서 골라요. 또한 *préférer X à Y*(Y보다 X를 더 좋아하다)에서는 *que*가 아니라 *à*를 쓴다는 점도 짚어 줘요.
units:
  fr.a1.unit13.preferences:
    title: 무엇을 더 좋아해요?
lessons:
  fr.a1.unit13.lesson01.vocabulaire_preferences:
    title: 좋아하다, 선호하다, 싫어하다
  fr.a1.unit13.lesson02.demander_les_preferences:
    title: 선호 묻기
  fr.a1.unit13.lesson03.dialogue_choisir_la_recette:
    title: 토요일 레시피 고르기
teaching:
  fr.a1.unit13.lesson01.teach.preferer:
    title: 선호하다
    gloss: 선호하다
    note: '*Préférer*는 어간의 철자가 바뀌는 -er 동사예요: *je préfère*, 하지만 *nous préférons*(*nous/vous* 형태에서는 악센트가 바뀌지 않아요).'
    example_gloss: 저는 초콜릿 타르트를 더 좋아해요.
  fr.a1.unit13.lesson01.teach.aimer_mieux:
    title: 더 좋아하다
    gloss: 더 좋아하다
    note: '*Aimer mieux*는 *préférer*를 대신해 자주 쓰는 표현이지만, *que*로 비교하는 반면(*aimer mieux X que Y*) *préférer*는 *à*를 써요(*préférer X à Y*).'
    example_gloss: 저는 단 요리보다 짭짤한 요리를 더 좋아해요.
  fr.a1.unit13.lesson01.teach.detester:
    title: 몹시 싫어하다
    gloss: 몹시 싫어하다
    note: '*Détester*는 강한 거부감을 나타내며, *ne pas aimer*(좋아하지 않다)보다 더 강해요.'
    example_gloss: Mathieu는 너무 강한 향신료를 아주 싫어해서, 순한 요리를 더 좋아해요.
  fr.a1.unit13.lesson01.teach.plutot:
    title: 차라리, 오히려
    gloss: 차라리, 오히려
    note: '*Plutôt*는 선호를 부드럽게 표현해요 -- 다른 쪽을 완전히 배제하지 않고 "이쪽이 더 낫다"고 말하는 느낌이에요.'
    example_gloss: 저는 대신 치즈를 먹을게요.
  fr.a1.unit13.lesson01.teach.sucre:
    title: 달콤한
    gloss: 달콤한
    note: '*Sucré*는 음식의 단맛을 나타내요. ''부드러운, 순한''을 뜻하는 *doux*와 헷갈리지 않도록 주의하세요.'
    example_gloss: 이 디저트는 아주 달아요.
  fr.a1.unit13.lesson01.teach.sale:
    title: 짭짤한 / 짠
    gloss: 짭짤한
    note: '*Salé*는 프랑스어 음식 어휘에서 *sucré*의 기본적인 반대말이에요. 한국어의 ''짭짤한''과 ''짠'' 두 가지 뜻을 모두 나타내요.'
    example_gloss: 치즈가 짜요.
  fr.a1.unit13.lesson01.teach.la_recette:
    title: 레시피
    gloss: 레시피
    note: '*La recette*는 항상 여성 명사예요.'
    example_gloss: 이 레시피는 쉬워요.
  fr.a1.unit13.lesson02.teach.quest_ce_que_tu_preferes:
    title: 선호 묻기
    gloss: 무엇을 더 좋아해요?
    note: '*Qu''est-ce que...*는 구어체 프랑스어에서 ''무엇''을 묻는 열린 질문을 만드는 일반적인 방법이에요.'
  fr.a1.unit13.lesson02.teach.je_prefere_x_a_y:
    title: 두 가지 중 선호하는 것 말하기
    gloss: 저는 키슈보다 타르트를 더 좋아해요.
    note: '*Préférer X à Y*에서는 덜 좋아하는 쪽 앞에 *à*를 써요. *que*를 쓰지 않도록 주의하세요. 한국어의 ''Y보다 X를 더 좋아해요''에서 ''보다''에 해당하는 자리에 à가 와요.'
  fr.a1.unit13.lesson02.teach.tu_aimes_plutot:
    title: 일반적인 취향 묻기
    gloss: 단 음식과 짭짤한 음식 중 어느 쪽을 더 좋아하는 편이에요?
    note: '*plutôt*(lesson01)와 *ou*(또는)를 쓴 선택 의문문이 합쳐진 표현이에요.'
  fr.a1.unit13.lesson02.teach.moi_aussi_moi_non:
    title: 동의하거나 반대하기
    gloss: 저도요. / 저는 아니에요.
    note: '*Moi aussi*는 긍정문에 동의할 때 쓰고, *moi non*은 반대하거나 반대되는 취향을 말할 때 써요.'
  fr.a1.unit13.lesson02.teach.ca_ne_me_derange_pas:
    title: 상관없다고 말하기
    gloss: 저는 상관없어요.
    note: '*Ça ne me dérange pas*는 선택을 요청받았을 때 어느 쪽이든 받아들인다는 뜻을 전하는 유용하고 중립적인 표현이에요.'
  fr.a1.unit13.lesson02.teach.on_pourrait_faire:
    title: 제안하기
    gloss: 키슈를 만들면 어때요?
    note: '*On pourrait*(우리 ~할 수 있을 텐데) + 동사원형은 부드럽게 제안할 때 쓰고, 끝에 *non ?*을 붙여 동의를 구해요.'
  fr.a1.unit13.lesson03.teach.line01:
    title: 무엇을 만들지 묻기
    gloss: 마티유가 토요일에 뭘 만들지 물어봐요. 타르트일까요, 키슈일까요?
    note: '*Qu''est-ce qu''on prépare... ?*(우리 뭐 만들어요?)에서는 일상 대화에서 흔히 그렇듯 ''우리''를 *on*으로 나타내요.'
  fr.a1.unit13.lesson03.teach.line02:
    title: 선호를 말하고 되묻기
    gloss: 이네스는 조금 더 단 타르트가 좋다고 말하고, 마티유에게 되물어요.
    note: '*Et toi ?*(너는?)는 상대방에게 같은 질문을 되돌리는 가장 간단한 방법이에요.'
  fr.a1.unit13.lesson03.teach.line03:
    title: 반대되는 선호 말하기
    gloss: 마티유는 짭짤한 쪽이 더 좋고, 타르트보다 키슈가 더 좋다고 말해요.
    note: lesson02의 *préférer X à Y* 구문을 그대로 다시 쓴 거예요.
  fr.a1.unit13.lesson03.teach.line04:
    title: 절충안 제안하기
    gloss: 이네스는 둘 다 만들면 어떻겠냐고 제안해요.
    note: '*Les deux*(둘 다)는 두 가지 레시피를 모두 만들자고 제안해서 의견 차이를 해결해요.'
  fr.a1.unit13.lesson03.teach.line05:
    title: 절충안 받아들이기
    gloss: 마티유는 좋은 생각이고, 전혀 상관없다고 말해요.
    note: '*Ça ne me dérange pas du tout*는 lesson02의 표현에 *du tout*(전혀)을 더해 뜻을 강조해요.'
  fr.a1.unit13.lesson03.teach.line06:
    title: 결정 확인하기
    gloss: 이네스는 토요일에 단 타르트 하나와 짭짤한 키슈 하나로 하면 완벽하다고 말해요.
    note: 최종 결정을 분명하게 다시 말하며 대화를 마무리해요.
