teaching:
  fr.a1.unit05.lesson01.teach.poulet:
    title: 닭고기
    gloss: 닭고기
    note: '*Poulet*는 남성 명사예요.'
    example_gloss: 닭고기를 주세요.
  fr.a1.unit05.lesson01.teach.poisson:
    title: 생선
    gloss: 생선
    note: '*Poisson*은 남성 명사예요.'
    example_gloss: 생선이 오늘 신선해요.
  fr.a1.unit05.lesson01.teach.salade:
    title: 샐러드
    gloss: 샐러드
    note: '*Salade*는 여성 명사예요.'
    example_gloss: 그녀는 샐러드를 먹고 있어요.
  fr.a1.unit05.lesson01.teach.riz:
    title: 쌀밥
    gloss: 쌀밥
    note: '*Riz*는 남성 명사이고, 단수와 복수의 철자가 같아요(*prix*처럼).'
    example_gloss: 밥은 닭고기와 잘 어울려요.
  fr.a1.unit05.lesson01.teach.eau:
    title: 물
    gloss: 물
    note: '*Eau*는 여성 명사예요. 모음 소리 앞이라 *l''*로 줄어드는데, 이 단원 뒤에 나오는 *l''addition*도 같은 방식이에요.'
    example_gloss: 물 좀 주세요.
  fr.a1.unit05.lesson01.teach.vin:
    title: 와인
    gloss: 와인
    note: '*Vin*은 남성 명사예요.'
    example_gloss: 레드 와인이 맛있어요.
  fr.a1.unit05.lesson01.teach.je_voudrais_poulet_salade:
    title: 닭고기와 샐러드 주문하기
    gloss: 닭고기와 샐러드를 주세요.
    note: '*Du poulet*(남성)와 *de la salade*(여성)는 ''약간의''를 뜻하는 부분 관사로, 명사의 성에 맞춰 써요. 양 뒤(*un kilo de*)에서는 성과 상관없이 *de*만 쓰는 것과 달라요.'
  fr.a1.unit05.lesson02.teach.dessert:
    title: Dessert
    gloss: 디저트
    note: '*Dessert*는 남성 명사예요.'
    example_gloss: 디저트는 오늘 서비스예요.
  fr.a1.unit05.lesson02.teach.addition:
    title: 계산서
    gloss: 계산서
    note: '*Addition*은 여성 명사이고, 모음 소리 앞이라 *l''*로 줄어요. 프랑스 식당에서 쓰는 표준 표현이며, 공식 청구서를 뜻하는 *facture*는 쓰지 않아요.'
    example_gloss: 계산서 부탁드려요.
  fr.a1.unit05.lesson02.teach.vous_avez_choisi:
    title: 주문할 준비가 됐는지 묻기
    gloss: 주문 정하셨어요?
    note: 종업원이 주문을 받으러 테이블에 와서 하는 기본 질문이에요. *choisir*(고르다)의 복합과거를 써요.
  fr.a1.unit05.lesson02.teach.je_voudrais_un_cafe:
    title: 커피 주문하기
    gloss: 커피 한 잔 주세요.
    note: '*Je voudrais* + 품목. 쇼핑할 때 쓰던 패턴을 이제 음식과 음료에 써요.'
  fr.a1.unit05.lesson02.teach.qcq_comme_dessert:
    title: 무엇이 있는지 묻기
    gloss: 디저트로 뭐가 있어요?
    note: '*Qu''est-ce que vous avez comme...?*는 어떤 종류 안에서 어떤 선택지가 있는지 물을 때 쓰는 자연스럽고 흔한 표현이에요.'
  fr.a1.unit05.lesson02.teach.cest_delicieux:
    title: 맛있다고 말하기
    gloss: 정말 맛있어요!
    note: 음식에 대한 흔한 감탄 표현이에요. *c'est* 뒤에는 성이 있는 명사가 오지 않기 때문에 *délicieux*는 형태가 바뀌지 않아요.
  fr.a1.unit05.lesson03.teach.line01:
    title: 인사하고 주문할 준비가 됐는지 묻기
    gloss: 종업원이 인사하고 주문하시겠느냐고 물어요.
    note: 서비스 상황에서 쓰는 공손한 인사 *Bonjour*로 시작해요.
  fr.a1.unit05.lesson03.teach.line02:
    title: 샐러드와 물 주문하기
    gloss: Inès가 샐러드와 물을 주문해요.
    note: '*je voudrais*에 *et*를 더해 한 번에 두 가지를 주문해요.'
  fr.a1.unit05.lesson03.teach.line03:
    title: 닭고기와 밥 주문하기
    gloss: Mathieu가 닭고기와 밥을 주문해요.
    note: '*Avec*(~와 함께)는 메인 요리와 곁들임을 잇는 간단하고 흔한 주문 구문이에요.'
  fr.a1.unit05.lesson03.teach.line04:
    title: 확인하고 음료 묻기
    gloss: 종업원이 주문을 확인하고 음료를 물어요.
    note: '*Et comme boisson pour vous ?*는 *Qu''est-ce que vous avez comme dessert ?*에서 본 *comme* 패턴을 음료에 다시 쓴 표현이에요.'
  fr.a1.unit05.lesson03.teach.line05:
    title: 와인 한 잔 주문하기
    gloss: Mathieu가 레드 와인 한 잔을 주문해요.
    note: '*Un verre de*(한 잔)는 와인을 잔으로 주문할 때 쓰는 기본 표현이에요.'
  fr.a1.unit05.lesson03.teach.line06:
    title: 음식에 반응하기
    gloss: Inès가 샐러드가 맛있다고 말해요.
    note: '*C''est délicieux !*를 특정 요리(*cette salade*)에 쓴 표현이에요. *salade*가 여성 명사여도 *c''est* 뒤에서는 *délicieux*가 남성형 그대로예요. 성을 일치시킨 *Elle est délicieuse, cette salade !*도 가능해요.'
  fr.a1.unit05.lesson03.teach.line07:
    title: 배고픈 이유를 말하고 계산서 요청하기
    gloss: Mathieu가 워크숍 때문에 배가 고프다고 말하고 계산서를 요청해요.
    note: '*Nous a donné faim*(직역하면 ''우리에게 배고픔을 주었다'')은 무언가 때문에 배가 고파졌다고 할 때 쓰는 자연스러운 프랑스어 표현이에요.'
  fr.a1.unit05.lesson03.teach.line08:
    title: 계산서를 가져다준다고 확인하기
    gloss: 종업원이 바로 가져다주겠다고 답해요.
    note: '*Tout de suite*(바로)는 서비스 상황에서 안심시키려고 자주 쓰는 표현이에요.'
