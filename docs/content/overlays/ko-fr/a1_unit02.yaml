  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: 프랑스어 A1
  description: 0부터 100까지의 숫자(soixante-dix, quatre-vingts, quatre-vingt-dix 형태 포함), 나이, 전화번호, 요리 재료의 양을 배워요. 1과에 이어 요리 워크숍에 있는 Inès와 Mathieu가 등장해요. avoir를 쓰는 나이 표현, 20을 단위로 세는 옛 방식이 남아 있는 프랑스어 숫자, 양을 나타내는 표현에서의 성 일치를 특히 짚어 줘요.
units:
  fr.a1.unit02.numbers:
    title: 주방 속 숫자
lessons:
  fr.a1.unit02.lesson01.numbers_zero_to_ten:
    title: 0부터 10까지의 숫자
  fr.a1.unit02.lesson02.numbers_eleven_to_hundred:
    title: '특별한 형태: 11부터 100까지'
  fr.a1.unit02.lesson03.asking_age:
    title: 나이 묻기
  fr.a1.unit02.lesson04.phone_numbers:
    title: 전화번호
  fr.a1.unit02.lesson05.recipe_quantities:
    title: 요리 재료의 양
  fr.a1.unit02.lesson06.recipe_count_dialogue:
    title: Inès, Mathieu와 함께 재료 세기
teaching:
  fr.a1.unit02.lesson01.teach.zero:
    title: 영
    gloss: 영
    note: '*Zéro*는 숫자 그 자체로도 쓰고, 숫자를 하나씩 소리 내어 읽을 때의 0으로도 써요.'
  fr.a1.unit02.lesson01.teach.un:
    title: 일, 하나
    gloss: 일
    note: '*un*은 남성형이에요. 여성 명사 앞에서는 여성형 *une*를 써요(*une tasse*, 컵 하나). 숫자를 셀 때처럼 혼자 쓸 때는 *un*을 그대로 써요.'
  fr.a1.unit02.lesson01.teach.deux:
    title: 이, 둘
    gloss: 이
    note: '*Deux*는 명사의 성에 상관없이 형태가 바뀌지 않아요.'
  fr.a1.unit02.lesson01.teach.trois:
    title: 삼, 셋
    gloss: 삼
    note: '*Trois*는 형태가 바뀌지 않아요.'
  fr.a1.unit02.lesson01.teach.quatre:
    title: 사, 넷
    gloss: 사
    note: '*Quatre*는 형태가 바뀌지 않아요.'
  fr.a1.unit02.lesson01.teach.cinq:
    title: 오, 다섯
    gloss: 오
    note: '*Cinq*는 형태가 바뀌지 않아요. 끝의 q는 보통 소리 내어 읽어요. 끝 자음을 읽지 않는 다른 여러 숫자와는 달라요.'
  fr.a1.unit02.lesson01.teach.six:
    title: Six
    gloss: 육
    note: '*Six*는 혼자 말할 때 끝에 /s/ 소리가 나요. 하지만 자음으로 시작하는 명사 앞에서는 끝 자음을 읽지 않아요(*six livres*는 "si livres"처럼 들려요).'
  fr.a1.unit02.lesson01.teach.sept:
    title: 칠, 일곱
    gloss: 칠
    note: '*Sept*는 형태가 바뀌지 않아요. p는 읽지 않고 끝의 t만 소리 나요.'
  fr.a1.unit02.lesson01.teach.huit:
    title: 팔, 여덟
    gloss: 팔
    note: '*Huit*는 형태가 바뀌지 않아요. 프랑스어 단어 대부분이 그렇듯 h는 읽지 않아요.'
  fr.a1.unit02.lesson01.teach.neuf:
    title: 구, 아홉
    gloss: 구
    note: '*Neuf*는 형태가 바뀌지 않아요.'
  fr.a1.unit02.lesson01.teach.dix:
    title: 십, 열
    gloss: 십
    note: '*Dix*는 혼자 말할 때 끝에 /s/ 소리가 나요. 자음 앞에서 끝 자음을 읽지 않는 점은 *six*와 같아요.'
  fr.a1.unit02.lesson02.teach.onze:
    title: 십일, 열하나
    gloss: 십일
    note: '*Onze*부터 *seize*까지(11~16)는 각각 독립된 단어예요. 21부터 *vingt*를 이어 만드는 것처럼 *dix*로 만든 말이 아니에요.'
  fr.a1.unit02.lesson02.teach.douze:
    title: 십이, 열둘
    gloss: 십이
    note: '*Douze*는 한 단어예요. 앞부분이 *deux*와 비슷하지만 *dix*는 눈에 보이지 않아요.'
  fr.a1.unit02.lesson02.teach.treize:
    title: 십삼, 열셋
    gloss: 십삼
    note: '*Treize*는 한 단어예요. 앞부분이 *trois*와 비슷하지만 *dix*는 눈에 보이지 않아요.'
  fr.a1.unit02.lesson02.teach.quatorze:
    title: 십사, 열넷
    gloss: 십사
    note: '*Quatorze*는 한 단어예요. 앞부분이 *quatre*와 비슷하지만 *dix*는 눈에 보이지 않아요.'
  fr.a1.unit02.lesson02.teach.quinze:
    title: 십오, 열다섯
    gloss: 십오
    note: '*Quinze*는 한 단어예요. *cinq*와 먼 관련이 있지만 *dix*는 눈에 보이지 않아요.'
  fr.a1.unit02.lesson02.teach.seize:
    title: 십육, 열여섯
    gloss: 십육
    note: '*Seize*는 한 단어로 붙은 마지막 숫자예요. *dix-sept*(17)부터는 *dix*에 일의 자리 숫자를 다시 눈에 보이게 붙여서 만들어요.'
  fr.a1.unit02.lesson02.teach.vingt:
    title: 이십, 스물
    gloss: 이십
    note: '*Vingt*는 독립된 단어예요. 21부터는 십의 자리와 일의 자리를 합쳐 말해요(*vingt et un*, *vingt-deux*). 이 방식은 아래에서 다시 다뤄요.'
  fr.a1.unit02.lesson02.teach.trente:
    title: 삼십, 서른
    gloss: 삼십
    note: '*Trente*는 뒤에 오는 숫자와 하이픈으로 이어요(*trente-quatre*). 다만 1은 *et*로 이어요(*trente et un*).'
  fr.a1.unit02.lesson02.teach.trente_quatre:
    title: 삼십사, 서른넷
    gloss: 삼십사
    note: '*Trente-quatre*는 하이픈으로 이어서 써요.'
  fr.a1.unit02.lesson02.teach.soixante:
    title: 육십, 예순
    gloss: 육십
    note: '*Soixante*는 69까지 평범한 십의 자리처럼 써요(*soixante-quatre*, 64). 불규칙한 부분은 70부터이고, 다음에 배워요.'
  fr.a1.unit02.lesson02.teach.soixante_dix:
    title: 칠십, 일흔
    gloss: 칠십
    note: 프랑스어 숫자에서 가장 놀라운 점이에요. 70을 나타내는 단어가 따로 없어요. *Soixante-dix*는 말 그대로 "60-10"(60 + 10)이라는 뜻이에요. *soixante-dix-neuf*(79, "60-19")까지 이렇게 세다가 80에서 *quatre-vingts*로 새로운 기준이 시작돼요.
  fr.a1.unit02.lesson02.teach.quatre_vingts:
    title: 팔십, 여든
    gloss: 팔십
    note: '*Quatre-vingts*는 말 그대로 "20이 네 개"(4 x 20)라는 뜻이고, 20을 기준으로 세던 옛 방식이 남은 거예요. 혼자 쓰거나 숫자의 끝에 올 때만 s가 붙어요(*quatre-vingts*, 80). 뒤에 숫자가 이어지면 s가 사라져요(*quatre-vingt-un*, 81).'
  fr.a1.unit02.lesson02.teach.quatre_vingt_dix:
    title: 구십, 아흔
    gloss: 구십
    note: '*Quatre-vingt-dix*는 말 그대로 "20이 네 개 더하기 10"(4x20 + 10)이라는 뜻이에요. 70대와 같은 20 기준 방식이 *quatre-vingt-dix-neuf*(99)까지 이어져요.'
  fr.a1.unit02.lesson02.teach.cent:
    title: 백
    gloss: 백
    note: 정확히 100을 말할 때는 관사 없이 *cent*만 써요("*un cent*"라고 하지 않아요).
  fr.a1.unit02.lesson03.teach.quel_age_as_tu:
    title: 친근하게 나이 묻기
    gloss: 몇 살이야?
    note: 프랑스어는 "어떤 나이를 가지고 있나요?"라고 물어요. *être*(~이다)가 아니라 *avoir*(가지다)를 써요.
  fr.a1.unit02.lesson03.teach.jai_vingt_huit_ans:
    title: 나이 말하기
    gloss: 스물여덟 살이에요.
    note: '*Ai*는 *avoir*의 je 형태예요. 프랑스어에서는 *ans*(해, 살)를 빼지 않고 꼭 써야 해요.'
  fr.a1.unit02.lesson03.teach.quel_age_avez_vous:
    title: 격식 있게 나이 묻기
    gloss: 몇 살이야?
    note: '*Avez-vous*는 *avoir*의 *vous* 형태예요. 1과에서 배운 격식 있는 말투와 같아요.'
  fr.a1.unit02.lesson03.teach.jai_trente_et_un_ans:
    title: 복합 숫자로 나이 말하기
    gloss: 서른한 살이에요.
    note: '*Trente et un*처럼 하이픈 대신 *et*(그리고)를 쓰는 경우는 30, 40, 50, 60의 ''1'' 형태뿐이에요 (*trente et un*, *quarante et un*, *cinquante et un*, *soixante et un*). 71은 이 규칙과 달리 *soixante et un*이 아니라 *soixante et onze*(60 + 11)예요. 70대는 *dix* 형태를 이어서 *soixante-dix-neuf*(79)까지 세기 때문이에요.'
  fr.a1.unit02.lesson03.teach.et_toi_quel_age:
    title: 나이 질문 되묻기
    gloss: 너는 몇 살이야?
    note: '*Et toi*로 되묻기 시작해요. *et* 뒤에서 강조할 때는 *tu*가 아니라 강세형 대명사 *toi*를 써요.'
  fr.a1.unit02.lesson04.teach.quel_est_ton_numero:
    title: 전화번호 묻기
    gloss: 전화번호가 뭐야?
    note: '*Quel*은 남성 명사 *numéro*에 맞춘 형태예요. 여성 명사라면 *quelle*을 써야 해요.'
  fr.a1.unit02.lesson04.teach.numero_ines:
    title: 숫자를 하나씩 읽기
    gloss: 영, 육, 일, 오, 영, 이, 구, 칠, 사, 삼
    note: 실제 프랑스 전화번호는 10자리이고, 보통 두 자리씩 끊어 읽어요(*zéro six*, *quinze*, *zéro deux*...). 이 단원의 번호는 실제와 같은 10자리 형식(06 15 02 97 43)이지만, 한 자리 숫자를 먼저 연습할 수 있도록 하나씩 읽어요.
  fr.a1.unit02.lesson04.teach.cest_le:
    title: 번호 알려 주기
    gloss: …이에요.
    note: '*numéro*가 남성 명사라서 남성 정관사 *le*를 써요.'
  fr.a1.unit02.lesson04.teach.tu_peux_repeter:
    title: 반복 부탁하기
    gloss: 다시 말해 줄래?
    note: '*Peux*는 *pouvoir*(~할 수 있다)의 *tu* 형태예요. 말하는 숫자가 너무 빨라 놓쳤을 때 유용해요.'
  fr.a1.unit02.lesson04.teach.bien_sur:
    title: 흔쾌히 승낙하기
    gloss: 물론이죠; 그럼요
    note: '*Bien sûr*는 부탁에 흔쾌히 응할 때 쓰는 친근하고 흔한 표현이에요.'
  fr.a1.unit02.lesson05.teach.jai_besoin_trois_oeufs:
    title: 필요한 수량 말하기
    gloss: 달걀이 세 개 필요해요.
    note: '*J''ai besoin de*는 직역하면 "나는 ~의 필요를 가지고 있다"라는 뜻으로, 프랑스어는 ''필요하다''를 따로 된 동사 하나로 말하지 않고 *avoir*를 써서 표현해요.'
  fr.a1.unit02.lesson05.teach.combien_oeufs:
    title: 몇 개 필요한지 묻기
    gloss: 달걀이 몇 개 필요해요?
    note: '*De combien d''œufs*에서는 "몇 개의"에 해당하는 *de combien*이 물건 앞에 와요. 한국어에서 "달걀이 몇 개"처럼 수량 표현이 명사 뒤에 오는 것과 순서가 달라요.'
  fr.a1.unit02.lesson05.teach.deux_tasses_farine:
    title: 계량한 수량 말하기
    gloss: 밀가루 두 컵
    note: '*De*는 계량 단위(*tasses*, 컵)와 재는 대상(*farine*, 밀가루)을 이어 줘요. 한국어에서는 "밀가루 두 컵"처럼 따로 연결하는 말 없이 나란히 놓는 점이 달라요.'
  fr.a1.unit02.lesson05.teach.demi_tasse:
    title: 절반 분량 말하기
    gloss: 설탕 반 컵
    note: 접두사로 쓰인 *demi-*는 명사 앞에서 형태가 변하지 않아요(*une demi-tasse*). 반면 명사 뒤에 놓는 형용사 *demi*는 일치시켜요(*une heure et demie*).
  fr.a1.unit02.lesson05.teach.jai_quatre_oeufs:
    title: 가지고 있는 것 말하기
    gloss: 탁자 위에 달걀이 네 개 있어요.
    note: '*J''ai*(나는 가지고 있다)는 이미 갖고 있는 것을 말하고, *j''ai besoin de*(나는 필요하다)는 아직 부족한 것을 말해요.'
  fr.a1.unit02.lesson06.teach.line01:
    title: 달걀 개수 묻기
    gloss: 이네스가 마티외에게 레시피에 달걀이 몇 개 필요한지 물어봐요.
    note: 이네스와 마티외는 1단원의 *vous* 대신 *tu*를 써요. 워크숍 동료라서 금방 편한 말투로 넘어갔어요.
  fr.a1.unit02.lesson06.teach.line02:
    title: 재료 말하기
    gloss: 마티외가 달걀 세 개와 밀가루 두 컵이 필요하다고 말해요.
    note: '*J''ai besoin de*는 레시피에 아직 필요한 것을 말할 때 써요.'
  fr.a1.unit02.lesson06.teach.line03:
    title: 가지고 있는 것 알려 주기
    gloss: 이네스가 탁자 위에 달걀이 네 개 있다고 말하고, 설탕도 필요한지 물어봐요.
    note: '*J''ai*는 이네스가 이미 가지고 있는 것을 말해요. 마티외가 필요하다고 한 것과는 별개예요.'
  fr.a1.unit02.lesson06.teach.line04:
    title: 적은 양 확인하기
    gloss: 마티외가 네, 조금요, 대략 반 컵이라고 말해요.
    note: 여기서 *Environ*은 "약", "대략"이라는 뜻으로, 정확한 수량을 부드럽게 말해 줘요.
  fr.a1.unit02.lesson06.teach.line05:
    title: 전화번호 묻기
    gloss: 이네스가 좋다고 말한 뒤, 다음 수업 때문에 문자를 보내려고 마티외의 전화번호를 물어봐요.
    note: '*Comme ça je t''écris*("그러면 내가 너에게 연락할 수 있어")는 연락처를 물어보기 전에 이유를 먼저 설명하는 자연스러운 말버릇이에요.'
  fr.a1.unit02.lesson06.teach.line06:
    title: 전화번호 알려 주기
    gloss: 마티외가 자기 번호를 한 자리씩 읽어 줘요.
    note: '*C''est le*는 번호를 말할 때 쓰는 표현이고, 남성 명사 *numéro*에 맞춘 거예요.'
  fr.a1.unit02.lesson06.teach.line07:
    title: 고마움 표현하고 나이 묻기
    gloss: 이네스가 고맙다고 말한 뒤, 마지막으로 하나 더 물어봐요. 몇 살이냐고요.
    note: '*Une dernière question*("마지막 질문 하나")은 같은 대화 안에서 화제를 자연스럽게 바꾸는 신호예요.'
  fr.a1.unit02.lesson06.teach.line08:
    title: 나이 말하기
    gloss: 마티외가 스물여덟 살이라고 말하고, 이네스에게 같은 질문을 해요.
    note: '*J''ai vingt-huit ans*은 하이픈으로 이은 복합 형태를 써요. 이 단원에서 배운 방식 그대로예요.'
  fr.a1.unit02.lesson06.teach.line09:
    title: 자기 나이 말하기
    gloss: 이네스가 서른한 살이라고 말해요.
    note: '*J''ai trente et un ans*에서는 하이픈 대신 *et*(그리고)를 써요. 31은 ''~하나''로 끝나는 형태 중 하나이기 때문이에요.'
exercises:
  fr.a1.unit02.lesson01.exercise01.select_deux:
    instruction: deux는 어떤 숫자일까요?
    correct_option: '2'
    distractors:
    - '3'
    - '12'
    accepted_answers:
    - '2'
  fr.a1.unit02.lesson01.exercise02.select_sept:
    instruction: sept는 어떤 숫자일까요?
    correct_option: '7'
    distractors:
    - '6'
    - '17'
    accepted_answers:
