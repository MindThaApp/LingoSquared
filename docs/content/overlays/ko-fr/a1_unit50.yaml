teaching:
  fr.a1.unit50.lesson01.teach.appeler:
    title: 전화하다
    gloss: 전화하다
    note: 전화를 걸다라는 뜻의 동사의 원형이에요.
    example_gloss: 너한테 전화해야 해.
  fr.a1.unit50.lesson01.teach.je_t_appelle:
    title: 전화하겠다고 말하기
    gloss: 내가 너한테 전화할게.
    note: '*Appelle*는 *appeler*의 *je* 형태예요. 프랑스어는 이렇게 곧 할 일을 말할 때 현재 시제를 써요.'
  fr.a1.unit50.lesson01.teach.allo_c_est:
    title: 전화 받기
    gloss: 여보세요, 카미유예요.
    note: '*C''est* + 이름은 프랑스어에서 전화로 자신을 밝힐 때 쓰는 일반적인 표현이에요.'
  fr.a1.unit50.lesson01.teach.allo_c_est_2:
    title: 마티외도 똑같이 전화를 받아요
    gloss: 여보세요, 마티외예요.
    note: '*Allô, c''est Camille*와 같은 *c''est* + 이름 형태예요.'
  fr.a1.unit50.lesson02.teach.qui_est_a:
    title: 누구인지 묻기
    gloss: 누구세요?
    note: '*Qui est à l''appareil ?*는 모르는 사람이 전화했을 때 누구인지 묻는 일반적인 표현이에요.'
  fr.a1.unit50.lesson02.teach.vous_parlez_avec:
    title: 격식 있게 자신을 밝히기
    gloss: 카미유와 통화하고 계세요.
    note: '*Vous parlez avec* + 이름은 *c''est* + 이름의 격식 있는 표현이에요.'
  fr.a1.unit50.lesson03.teach.tu_peux_repeter:
    title: 다시 말해 달라고 부탁하기
    gloss: 다시 말해 줄 수 있어?
    note: '*Tu peux ...*(~해 줄 수 있어?) 뒤에 동사 원형 *répéter*(반복하다)가 와요.'
  fr.a1.unit50.lesson03.teach.ne_parle_pas:
    title: 천천히 말해 달라고 부탁하기
    gloss: 너무 빨리 말하지 말아 줘.
    note: '*Ne parle pas si vite*는 부정문이에요. *ne ... pas*가 *parle*를 감싸고, *si*는 ''그렇게''라는 뜻이에요.'
  fr.a1.unit50.lesson03.teach.je_ne_t:
    title: 잘 안 들린다고 말하기
    gloss: 잘 안 들려.
    note: '*Entendre*(듣다, 들리다)와 *ne ... pas bien*은 소리가 잘 안 들린다는 뜻이고, *comprendre*(이해하다)와는 달라요.'
  fr.a1.unit50.lesson04.teach.le_sms:
    title: 문자 메시지
    gloss: 문자 메시지
    note: '*SMS*는 남성 명사라서 *un SMS*라고 해요. 국제적으로 쓰이는 약어를 그대로 가져온 말이에요.'
    example_gloss: 문자 메시지는 카미유가 보낸 거예요.
  fr.a1.unit50.lesson04.teach.je_t_envoie:
    title: 문자를 보내겠다고 말하기
    gloss: 내가 너한테 문자 보낼게.
    note: '*Envoyer*(보내다)는 동사 앞에 대명사 *te*(여기서는 *t''*)가 오고, 그 뒤에 *un SMS*가 와요.'
  fr.a1.unit50.lesson04.teach.je_te_rappelle:
    title: 다시 전화하겠다고 말하기
    gloss: 나중에 다시 전화할게.
    note: '*Rappeler*(다시 전화하다)는 *re-*에 ''다시''라는 뜻이 이미 들어 있어요. *plus tard*는 ''나중에''라는 뜻이에요.'
  fr.a1.unit50.lesson05.teach.mathieu_salut_camille:
    title: 문자 대화 읽기
    gloss: '마티외: 안녕 카미유, 나한테 전화해 줄 수 있어? 할 말이 있어. 카미유: 응, 물론이지. 5분 뒤에 다시 전화할게.'
    note: 마티외가 무엇을, 왜 부탁하는지, 그리고 카미유가 언제 다시 전화하겠다고 하는지 살펴보세요.
    glosses:
      Salut: 안녕
      peux: ~할 수 있다
      m'appeler: 전화하다
      dois: ~해야 하다
      truc: 무언가
      dire: 말하다
      évidemment: 물론
      rappelle: 다시
      cinq: 다섯
      minutes: 분
  fr.a1.unit50.lesson06.teach.mathieu_allo_c:
    title: 마티외가 전화를 받아요
    gloss: '마티외: 여보세요, 마티외예요.'
    note: 1과의 *c'est* + 이름 형태를 이번에는 실제 통화에서 써요. 전화를 받은 사람이 먼저 말하고 자기 이름을 밝혀요.
  fr.a1.unit50.lesson06.teach.camille_salut_mathieu:
    title: 카미유가 자신을 밝혀요
    gloss: '카미유: 안녕 마티외, 카미유야. 마티외: 전화해 줘서 반가워!'
    note: '*C''est sympa que* ...(~해서 반갑다)는 어떤 일에 대한 긍정적인 반응을 나타내요. *appelles*는 여기서는 특별한 형태로 그냥 외워 두면 돼요.'
  fr.a1.unit50.lesson06.teach.camille_comment_s:
    title: 카미유가 근무에 대해 물어요
    gloss: '카미유: 첫 근무는 어땠어?'
    note: '*Comment s''est passé ... ?*는 *se passer*(일어나다, 진행되다)의 복합과거로, *être*를 써서 만들어요. 어떤 일이 어떻게 됐는지 물을 때 써요.'
  fr.a1.unit50.lesson06.teach.mathieu_ca_s:
    title: 마티외가 좋은 소식을 전해요
    gloss: '마티외: 아주 잘 끝났어, 생각보다 더 잘됐어.'
    note: '*Ça s''est très bien passé*와 *je pensais*는 여기서는 정해진 표현이에요. *je pensais*는 *penser*(생각하다)의 반과거예요.'
  fr.a1.unit50.lesson06.teach.au_passe_compose:
    title: avoir와 être를 쓰는 복합과거
    gloss: s'est passé → 일어나다, j'ai pensé → 생각하다, je suis allé → 가다
    note: '복합과거는 *avoir* 또는 *être* + 과거분사로 만들어요. 예: *j''ai pensé*, *je suis allé*. *Ça s''est passé*는 ''그렇게 됐다''라는 뜻의 정해진 표현이니, 지금은 이 수업에 나오는 상황에서만 외워 두세요.'
  fr.a1.unit50.lesson06.teach.camille_ca_fait:
    title: 카미유가 자랑스러워해요
    gloss: '카미유: 듣기만 해도 기분 좋네! 네가 자랑스러워.'
    note: '*Fière de*(~이 자랑스러운)는 정해진 조합이에요. *pour*가 아니라 *de*를 꼭 써야 하고, 여기서 *fière*는 여성형이에요.'
  fr.a1.unit50.lesson06.teach.mathieu_merci_beaucoup:
    title: 마티외가 감동해요
    gloss: '마티외: 정말 고마워, 나한테 큰 의미야.'
    note: 여기서 *compter*는 '중요하다'라는 뜻이에요. *ça compte pour moi*는 '나에게 중요하다'이고, *pour moi*는 누구에게 중요한지를 나타내요.
  fr.a1.unit50.lesson06.teach.son_premier_service:
    title: 그의
    gloss: 그의 첫 근무는 아주 잘 끝났어요.
    note: 여기서 *Son*은 동사가 아니라 '그의'를 뜻하는 소유 형용사예요. *son premier service*(그의 첫 근무)처럼 쓰고, *son*은 남성 명사 *service*에 맞춘 형태예요.
