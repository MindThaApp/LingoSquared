course:
  title: 프랑스어 A1
  description: passé composé로 최근에 끝난 일을 짧게 이야기하는 단원이에요. avoir와 être 두 가지 조동사를 모두 쓰며, Inès와 Mathieu의 요리 워크숍 이야기가 이어져 Mathieu가 지난 토요일 수업에서 있었던 작은 사고를 들려줘요. 프랑스어에서는 대부분의 동사가 avoir를 조동사로 쓰고, aller/arriver/rester 같은 일부 동사만 être를 써요. être를 쓰는 과거분사는 주어의 성에 맞춰 arrivé/arrivée처럼 달라져요.
units:
  fr.a1.unit12.past_events:
    title: 무슨 일이 있었나요?
lessons:
  fr.a1.unit12.lesson01.passe_compose_avoir:
    title: avoir를 쓰는 passé composé
  fr.a1.unit12.lesson02.passe_compose_etre:
    title: être를 쓰는 passé composé
  fr.a1.unit12.lesson03.dialogue_atelier_dernier:
    title: 지난 토요일의 워크숍
teaching:
  fr.a1.unit12.lesson01.teach.jai_prepare:
    title: 나는 준비했다
    gloss: 나는 준비했다 / 만들었다
    note: '규칙 -ER 동사는 과거분사를 *-é*로 만들어요: *préparer* → *préparé*. 조동사는 *avoir*를 써요.'
    example_gloss: 나는 워크숍을 위해 케이크를 만들었어요.
  fr.a1.unit12.lesson01.teach.jai_achete:
    title: 나는 샀다
    gloss: 나는 샀다
    note: '*Acheter*도 *préparer*와 같은 *avoir* + *-é* 형태를 따라요.'
    example_gloss: 나는 시장에서 채소를 샀어요.
  fr.a1.unit12.lesson01.teach.jai_oublie:
    title: 나는 잊었다
    gloss: 나는 잊었다
    note: '*Oublier* → *oublié*, 이번에도 같은 규칙 형태예요.'
    example_gloss: 버터를 집에 두고 왔어요!
  fr.a1.unit12.lesson01.teach.tu_as_aime:
    title: 너는 좋아했다
    gloss: 너는 좋아했다
    note: '*Tu as* + 과거분사는 같은 *avoir* 구문의 *tu* 형태예요.'
    example_gloss: 케이크 맛있게 먹었어요?
  fr.a1.unit12.lesson01.teach.il_a_goute:
    title: 그는 맛보았다
    gloss: 그는 맛보았다
    note: '*Il a* + 과거분사는 *il* 형태예요. 조동사 *avoir*는 주어에 따라 바뀌지만 과거분사는 그대로예요.'
    example_gloss: Mathieu가 소스를 맛보았어요.
  fr.a1.unit12.lesson01.teach.grammar_avoir_participe:
    title: Avoir + 과거분사
    gloss: avoir + 과거분사 (-é)
    note: 대부분의 프랑스어 동사는 *avoir*를 조동사로 하여 passé composé를 만들어요. 규칙 -ER 동사의 과거분사는 *-é*로 끝나요.
  fr.a1.unit12.lesson01.teach.la_semaine_derniere:
    title: 지난주
    gloss: 지난주
    note: '*Dernière*(지난)는 여성명사 *semaine*에 맞춘 여성형이에요. 남성형은 *dernier*로, *samedi dernier*(지난 토요일)처럼 써요.'
    example_gloss: 지난주에 나는 케이크를 만들었어요.
  fr.a1.unit12.lesson02.teach.je_suis_arrive:
    title: 나는 도착했다
    gloss: 나는 도착했다
    note: '*Arriver*는 *avoir* 대신 *être*를 조동사로 쓰는 일부 동사(주로 이동 동사) 중 하나예요.'
    example_gloss: 나는 워크숍에 늦게 도착했어요.
  fr.a1.unit12.lesson02.teach.je_suis_alle:
    title: 나는 갔다
    gloss: 나는 갔다
    note: '*Aller*도 *être*를 조동사로 써요. 과거분사는 주어에 일치해요: *allé*(남성) 또는 *allée*(여성, Inès가 말할 때처럼).'
    example_gloss: 저는 워크숍 전에 시장에 갔어요.
  fr.a1.unit12.lesson02.teach.il_est_reste:
    title: 그는 머물렀어요
    gloss: 그는 머물렀다
    note: '*Rester*(머무르다)는 *être*를 조동사로 쓰는 또 다른 동사로, 같은 일치 규칙을 따라요.'
    example_gloss: Mathieu는 부엌을 치우려고 남았어요.
  fr.a1.unit12.lesson02.teach.grammar_etre_accord:
    title: Être + 과거분사 일치
    gloss: être + 과거분사 (주어에 일치)
    note: '*être*를 조동사로 쓰는 동사에서는 과거분사가 주어의 성과 수에 일치해요. *avoir*를 조동사로 쓰는 동사와는 달라요.'
  fr.a1.unit12.lesson02.teach.en_retard:
    title: 늦게
    gloss: 늦게
    note: '*En retard*는 예상한 시간보다 늦게 도착한다는 뜻이며, *arriver*와 자주 함께 쓰여요.'
    example_gloss: 버스가 늦게 도착했어요.
  fr.a1.unit12.lesson02.teach.finalement:
    title: 마침내 / 결국
    gloss: 결국
    note: 짧은 이야기를 마무리하며 앞선 문제 뒤의 최종 결과를 알릴 때 *finalement*를 써요.
    example_gloss: 결국 케이크는 아주 맛있었어요.
  fr.a1.unit12.lesson02.teach.quest_ce_qui_sest_passe:
    title: 무슨 일이 있었나요?
    gloss: 무슨 일이 있었나요?
    note: 무슨 일이 있었는지 물을 때 쓰는 표준 표현이 *Qu'est-ce qui s'est passé ?*예요.
    example_gloss: 워크숍에서 무슨 일이 있었어요?
  fr.a1.unit12.lesson03.teach.line01:
    title: 무슨 일이 있었는지 묻기
    gloss: Inès는 지난 토요일 워크숍에서 무슨 일이 있었는지 물어요. 그녀는 오지 못했거든요.
    note: '*Qu''est-ce qui s''est passé ?*(무슨 일이 있었어요?)는 과거에 있었던 일을 물을 때 쓰는 표준 표현이에요.'
  fr.a1.unit12.lesson03.teach.line02:
    title: 낭패를 이야기하기
    gloss: Mathieu는 이런, 늦게 도착한 데다 버터를 집에 두고 왔다고 말해요!
    note: '한 문장에 복합과거가 두 가지 형태로 나와요: *être*(*je suis arrivé*)와 *avoir*(*j''ai oublié*).'
  fr.a1.unit12.lesson03.teach.line03:
    title: 그가 한 일 묻기
    gloss: Inès는 그가 그다음에 무엇을 했는지 물어요.
    note: '*Qu''est-ce que tu as fait ?*(뭘 했어요?)는 *faire*의 불규칙 복합과거를 써요.'
  fr.a1.unit12.lesson03.teach.line04:
    title: 해결 방법 설명하기
    gloss: Mathieu는 모퉁이 식료품점에 재빨리 갔다고 말해요.
    note: '*L''épicerie du coin*(모퉁이 식료품점)에서 *coin*은 *au coin de la rue*에서처럼 ''모퉁이''를 뜻해요.'
  fr.a1.unit12.lesson03.teach.line05:
    title: 잘 해결됐는지 묻기
    gloss: Inès는 거기서 버터를 찾았는지 물어요.
    note: '*Tu as trouvé... ?*(…을 찾았어요?)는 *avoir*를 조동사로 쓰는 또 다른 규칙 동사 의문문이에요.'
  fr.a1.unit12.lesson03.teach.line06:
    title: 행복한 결말 말하기
    gloss: Mathieu는 그렇다고, 결국 케이크가 아주 맛있었다고 말해요!
    note: '*finalement*로 이야기를 긍정적으로 마무리하며, 앞서 있었던 낭패를 해결해요.'
