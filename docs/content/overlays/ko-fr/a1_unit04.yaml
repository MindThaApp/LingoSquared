answer_policy:
  accent_marks: Display and teach all French accents and the cedilla. In typed A1 answers, accept a variant without accents when every other letter and word is correct.
  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: 프랑스어 A1
  description: 시장 어휘를 배우고, combien, kilo, litre로 가격과 양을 묻는 법을 익혀요. 양을 나타내는 표현 뒤에서 du/de la와 단순한 de가 어떻게 다른지도 배워요. 요리 워크숍을 하던 이네스와 마티외의 이야기가 시장에서 장을 보는 장면으로 이어져요. 프랑스어에서는 분명한 양 표현 뒤에 부분 관사를 쓰지 않아요(un kilo de tomates이고, un kilo des tomates가 아니에요).
units:
  fr.a1.unit04.shopping:
    title: 이네스와 함께 장보기
lessons:
  fr.a1.unit04.lesson01.au_marche:
    title: 시장에서
  fr.a1.unit04.lesson02.combien_ca_coute:
    title: 얼마예요?
  fr.a1.unit04.lesson03.dialogue_marche:
    title: 이네스, 마티외와 함께 시장에서
teaching:
  fr.a1.unit04.lesson01.teach.marche:
    title: 시장
    gloss: 그 시장
    note: '*Marché*는 남성 명사예요.'
    example_gloss: 시장은 토요일마다 열려요.
  fr.a1.unit04.lesson01.teach.boulangerie:
    title: 빵집
    gloss: 그 빵집
    note: '*Boulangerie*는 여성 명사예요. 빵만 파는 가게이고, *pâtisserie*(과자·케이크 가게)와는 달라요.'
    example_gloss: 이 근처에 좋은 빵집이 있어요.
  fr.a1.unit04.lesson01.teach.legumes:
    title: 채소
    gloss: 채소
    note: '*Légumes*는 남성 복수 명사예요.'
    example_gloss: 워크숍에 쓸 신선한 채소를 사요.
  fr.a1.unit04.lesson01.teach.fruits:
    title: 과일
    gloss: 과일
    note: '*Fruits*는 남성 복수 명사예요. 프랑스어에서는 과일을 통틀어 말할 때 복수형 *les fruits*를 자주 써요.'
    example_gloss: 이번 달에는 과일이 비싸요.
  fr.a1.unit04.lesson01.teach.prix:
    title: 가격
    gloss: 가격
    note: '*Prix*는 남성 명사이고 형태가 변하지 않아요. 단수와 복수의 철자가 같아요.'
    example_gloss: 빵 가격이 얼마예요?
  fr.a1.unit04.lesson01.teach.cher:
    title: 비싼
    gloss: 비싼
    note: '*Cher*는 남성형이에요. 여성형은 *chère*, 복수형은 *chers*/*chères*로, 꾸미는 명사에 맞춰 바뀌어요.'
    example_gloss: 이 치즈는 너무 비싸요.
  fr.a1.unit04.lesson01.teach.pas_cher:
    title: 오늘은 비싸지 않아요
    gloss: 오늘은 채소가 비싸지 않아요.
    note: '*Pas cher(s)*처럼 *ne*를 빼는 것은 값이 싸다고 할 때 말로 흔히 쓰는 방식이에요. 글에서 쓰는 완전한 형태는 *ne sont pas chers*예요.'
  fr.a1.unit04.lesson02.teach.un_kilo_de:
    title: 1킬로그램의
    gloss: 1킬로그램의
    note: '*De*는 양 표현 바로 뒤에 오고 관사는 쓰지 않아요. 아래의 *양 표현 뒤의 de* 문법 설명을 보세요.'
    example_gloss: 토마토 1킬로그램 주세요.
  fr.a1.unit04.lesson02.teach.un_litre_de:
    title: 1리터의
    gloss: 1리터의
    note: '*Litre*는 남성 명사예요. 고체에 *kilo*를 쓰듯이 액체에 써요.'
    example_gloss: 우유 1리터 주세요.
  fr.a1.unit04.lesson02.teach.euro:
    title: 1유로
    gloss: 1유로
    note: '*Euro*는 규칙적으로 복수형이 돼요: *deux euros*, *cinq euros*.'
    example_gloss: 5유로예요.
  fr.a1.unit04.lesson02.teach.de_after_quantity:
    title: 양 표현 뒤의 de
    gloss: ~의
    note: '분명한 양을 나타내는 말(*un kilo*, *un litre*, *beaucoup* 등. 예: *beaucoup de cousins*) 뒤에서는 *du*/*de la*/*des*를 쓰지 않고 단순한 *de*만 써요. *un kilo de tomates*라고 하고, *un kilo des tomates*라고는 하지 않아요.'
  fr.a1.unit04.lesson02.teach.combien_ca_coute:
    title: 가격 묻기
    gloss: 얼마예요?
    note: '*Combien*(얼마)에 *ça coûte*(그것이 값이 나가다)를 붙인 말로, 가격을 물을 때 두루 쓰는 표현이에요.'
  fr.a1.unit04.lesson02.teach.cest_combien_pain:
    title: 특정 물건의 가격 묻기
    gloss: 빵은 얼마예요?
    note: '*C''est combien, [item] ?*는 가격을 묻는 물건을 구체적으로 말하는 표현으로, *Combien ça coûte ?* 대신 자주 써요.'
  fr.a1.unit04.lesson02.teach.ca_fait_combien:
    title: 합계 묻기
    gloss: 전부 합해서 얼마예요?
    note: '*Ça fait combien ?*은 물건 하나가 아니라, 보통 계산을 마칠 때 지금까지의 합계를 묻는 말이에요.'
  fr.a1.unit04.lesson03.teach.line01:
    title: 토마토 주문하기
    gloss: 이네스가 상인에게 인사하고 토마토 1킬로그램을 달라고 해요.
    note: '*Bonjour*와 *je voudrais* + 양 표현을 함께 쓴 문장이에요.'
  fr.a1.unit04.lesson03.teach.line02:
    title: 더 필요한지 묻기
    gloss: 상인이 알겠다고 하고, 더 필요한 게 있는지 물어요.
    note: '*Autre chose ?*(다른 건요?)는 가게 주인이 흔히 덧붙이는 질문이에요.'
  fr.a1.unit04.lesson03.teach.line03:
    title: 치즈를 추가하고 가격 묻기
    gloss: 이네스가 치즈를 조금 더 사겠다고 하며 가격을 물어요.
    note: '*Un peu de fromage*(치즈 조금)는 *un kilo de*와 같이 관사 없는 *de*를 써요.'
  fr.a1.unit04.lesson03.teach.line04:
    title: 킬로그램당 가격 말하기
    gloss: 상인이 1킬로그램에 8유로라고 말해요.
    note: '*X euros le kilo*는 단위당 가격을 말하는 자연스러운 프랑스어 표현이에요. 여기서 *le*는 ''~당''이라는 뜻으로 쓰였어요.'
  fr.a1.unit04.lesson03.teach.line05:
    title: 여기서 빵이 필요한 이유 설명하기
    gloss: 마티외는 자기도 빵을 사고 싶지만 빵집이 오늘 문을 닫았다고 말해요.
    note: '*Fermée*(닫힌)는 *la boulangerie*에 맞춘 여성형이에요.'
  fr.a1.unit04.lesson03.teach.line06:
    title: 다른 방법 제안하기
    gloss: 이네스는 여기서도 빵을 살 수 있다며 그를 안심시켜요.
    note: '*On peut*(~할 수 있어요) + 동사원형은 가능한 일을 말할 때 흔히 쓰는 구어체 표현이에요.'
  fr.a1.unit04.lesson03.teach.line07:
    title: 확인하고 합계 말하기
    gloss: 상인이 신선한 빵이 있다고 하고, 합계를 계산하며 13유로 50센트라고 말해요.
    note: 여기서 *Ça fait combien en tout ?*는 이네스에게 묻는 게 아니라, 상인이 합계를 말하기 전에 혼잣말로 계산하는 거예요.
  fr.a1.unit04.lesson03.teach.line08:
    title: 상인에게 감사 인사하기
    gloss: 이네스가 돈을 내면서 따뜻하게 감사를 전해요.
    note: 여기서 *Voilà*는 돈을 건넬 때 함께 하는 말이에요.
