teaching:
  hi.a1.unit15.lesson01.teach.station_mujhe_hai_review:
    title: 'Ripasso: stazione, a me, è'
    gloss: stazione, a me / per me, è
    note: Un rapido ripasso del nome di luogo e della copula necessari per costruire l'espressione dell'obbligo di questa lezione.
    example_gloss:
    - La stazione è qui.
    - Ho da fare.
  hi.a1.unit15.lesson01.teach.jaana:
    title: Andare
    gloss: andare (infinito)
    note: 'È l''infinito del verbo che conosci già come imperativo di tum, *jao* (unità 9): in questa lezione si presenta l''infinito di base.'
    example_gloss: Devo andare.
  hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai:
    title: Mujhe + verbo + hai = dovere
    gloss: '''Mujhe'' l''hai già imparato con ''chahiye'' (unità 6, con un nome) e con ''hai'' (unità 11, come in ''mujhe kaam hai'', ho da fare). Ora compare anche con un verbo: ''mujhe jana hai'' significa ''devo andare''. Attenzione: con ''jana'', ''hai'' resta invariato e non diventa mai ''hain'': non concorda con chi parla.'
    note: Presenta il terzo uso di uno schema già noto (pronome + copula), richiamando i due usi precedenti con il numero dell'unità prima di introdurre il nuovo verbo.
  hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase:
    title: Devo andare in stazione.
    gloss: Devo andare in stazione.
    note: Il primo esempio completo dell'unità della costruzione dell'obbligo.
  hi.a1.unit15.lesson01.teach.tiket:
    title: Biglietto
    gloss: biglietto
    note: Un nuovo nome, utile in tutta questa unità sui viaggi.
    example_gloss: Dov'è il mio biglietto?
  hi.a1.unit15.lesson01.teach.chahiye_review:
    title: 'Ripasso: volere / avere bisogno'
    gloss: volere / avere bisogno di
    note: Introdotto nell'unità 6 con le bevande, qui riutilizzato con il biglietto.
    example_gloss: Vorrei del tè.
  hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase:
    title: Mi serve un biglietto.
    gloss: Mi serve un biglietto.
    note: Lo schema già noto *mujhe...chahiye* applicato al nuovo nome di questa unità.
  hi.a1.unit15.lesson01.teach.train:
    title: Treno
    gloss: treno
    note: Un nuovo nome.
    example_gloss: Il treno è grande.
  hi.a1.unit15.lesson01.teach.delhi_ka_review:
    title: 'Ripasso: Delhi, di'
    gloss: Delhi, di (particella del possesso)
    note: Delhi è stata introdotta nell'unità 5; la particella del possesso *ka* è già usata in tutto il corso (ad es. unità 5-14) e qui serve a indicare la destinazione di un biglietto.
    example_gloss:
    - Mio fratello abita a Delhi.
    - Questa è la borsa di Arjun.
  hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase:
    title: Mi serve un biglietto per Delhi.
    gloss: Mi serve un biglietto per Delhi.
    note: Unisce il nome di questa lezione allo schema della particella del possesso per indicare una destinazione precisa.
  hi.a1.unit15.lesson01.teach.kahan_tumhein_review:
    title: 'Ripasso: dove, a te'
    gloss: dove, a te / per te
    note: Entrambi già studiati (unità 8 e unità 6), qui riutilizzati per chiedere dove qualcuno deve andare.
    example_gloss:
    - Dov'è la banca?
    - Che cosa desideri?
  hi.a1.unit15.lesson02.teach.number_review:
    title: 'Ripasso: numero'
    gloss: numero
    note: Introdotto nell'unità 2 per i numeri di telefono, qui riutilizzato per il numero del binario.
    example_gloss: Qual è il tuo numero di telefono?
  hi.a1.unit15.lesson02.teach.platform:
    title: Binario
    gloss: binario
    note: 'Un nuovo nome: la parola hindi usata normalmente per il binario, un prestito dall''inglese, come *phone* nell''unità 2.'
    example_gloss: Il binario è grande.
  hi.a1.unit15.lesson02.teach.platform_number_kya_hai_phrase:
    title: Qual è il numero del binario?
    gloss: Qual è il numero del binario?
    note: Riutilizza lo schema di domanda *kya hai* già noto (ad es. numero di telefono, prezzo, età) per un nuovo argomento.
  hi.a1.unit15.lesson02.teach.platform_number_teen_hai_phrase:
    title: Il binario è il numero 3.
    gloss: Il numero del binario è 3.
    note: La risposta naturale, a frase completa, alla domanda precedente.
  hi.a1.unit15.lesson02.teach.jaana_habitual_grammar:
    title: Jaati hai (concordanza al femminile)
    gloss: '''Jaati hai'' usa la regola -ta/-ti/-te + hai/hain dell''unità 10, con il nuovo verbo ''jana''. ''Ṭren'' (treno) in hindi è femminile, quindi si dice ''jaati hai'', non ''jaata hai''.'
    note: Un'estensione diretta ed esplicita dello schema di concordanza del presente abituale già noto, applicata a un nuovo verbo e a un nuovo nome (femminile in hindi).
  hi.a1.unit15.lesson02.teach.se_review:
    title: 'Ripasso: da'
    gloss: da
    note: Introdotto nell'unità 9 per le indicazioni stradali, qui riutilizzato per il binario da cui parte il treno.
    example_gloss: Da qui vai dritto.
  hi.a1.unit15.lesson02.teach.train_platform_se_jaati_hai_phrase:
    title: Il treno parte dal binario numero 3.
    gloss: Il treno parte dal binario numero 3.
    note: Unisce la forma del presente abituale di questa lezione alla postposizione 'da' già studiata.
  hi.a1.unit15.lesson02.teach.kitne_baje_review:
    title: 'Ripasso: a che ora'
    gloss: a che ora
    note: Introdotto nell'unità 4 per dire l'ora, qui riutilizzato per chiedere l'orario di partenza.
    example_gloss: Che ore sono?
  hi.a1.unit15.lesson02.teach.train_kitne_baje_jaati_hai_phrase:
    title: A che ora parte il treno?
    gloss: A che ora parte il treno?
    note: La domanda «a che ora» applicata a una partenza prevista, invece che all'ora attuale.
  hi.a1.unit15.lesson02.teach.train_chhah_baje_jaati_hai_phrase:
    title: Il treno parte alle 6.
    gloss: Il treno parte alle 6.
    note: La risposta naturale a frase completa, con la forma plurale *baje* dell'unità 4 (il sei non è l'eccezione *baja*, che vale solo per l'una).
  hi.a1.unit15.lesson02.teach.tiket_kitne_ka_hai_phrase:
    title: Quanto costa il biglietto?
    gloss: Quanto costa il biglietto?
    note: Riutilizza la domanda sul prezzo *kitne ka/ki* dell'unità 7. *Tikat* di solito è trattato come maschile (*ka*); molti parlanti lo usano anche al femminile (*kitne ki*), ed è ugualmente corretto.
  hi.a1.unit15.lesson02.teach.rupaye_review:
    title: 'Ripasso: rupie, cinquanta'
    gloss: rupie, cinquanta
    note: Entrambi introdotti nell'unità 2 per prezzi e quantità, qui riutilizzati per il prezzo di un biglietto.
    example_gloss: Ho cinquanta rupie.
  hi.a1.unit15.lesson02.teach.tiket_pachaas_rupaye_ka_hai_phrase:
    title: Il biglietto costa 50 rupie.
    gloss: Il biglietto costa 50 rupie.
    note: La risposta naturale a frase completa alla domanda sul prezzo precedente.
  hi.a1.unit15.lesson03.teach.hum_hamein:
    title: Noi, a noi
    gloss: noi, a noi / per noi
    note: '''Hum'' (noi) è stato introdotto nell''unità 11 come primo pronome di prima persona plurale del corso; ''hamein'' è la sua forma di dativo, necessaria qui per il dialogo sul viaggio in comune.'
    example_gloss:
    - Noi stiamo bene.
    - Dobbiamo andare in stazione.
  hi.a1.unit15.lesson03.teach.hamein_grammar:
    title: 'Hamein: il quarto pronome al dativo'
    gloss: '''Hamein'' è la forma di dativo di ''hum'' (unità 11), come ''mujhe'' (main) e ''tumhein'' (tum). Anche qui, con ''jana'', ''hai'' resta invariato e non diventa mai ''hain'': non concorda con ''hum''/''hamein''.'
    note: Richiama per numero di unità i tre pronomi al dativo già noti prima di aggiungere il quarto, e ribadisce che 'hai' non concorda con il pronome, come nella nota grammaticale della prima lezione.
  hi.a1.unit15.lesson03.teach.hamein_station_jana_hai_phrase:
    title: Dobbiamo andare in stazione.
    gloss: Dobbiamo andare in stazione.
    note: La costruzione dell'obbligo con il nuovo pronome al dativo plurale.
  hi.a1.unit15.lesson03.teach.ki_review:
    title: 'Ripasso: di (femminile)'
    gloss: di (particella del possesso, femminile)
    note: Introdotta nell'unità 7 insieme a *ka*/*kitne*, qui riutilizzata perché «treno» in hindi è femminile, quindi la sua forma del possesso è 'ki', non 'ka'.
    example_gloss: Questo è il treno per Delhi.
  hi.a1.unit15.lesson03.teach.dialogue.line01:
    title: Arjun dice che devono andare
    gloss: Priya, dobbiamo andare in stazione.
  hi.a1.unit15.lesson03.teach.dialogue.line02:
    title: Priya ha bisogno di un biglietto per Delhi
    gloss: Va bene. Mi serve un biglietto per Delhi.
  hi.a1.unit15.lesson03.teach.dialogue.line03:
    title: Arjun chiede il prezzo
    gloss: Anche a me. Quanto costa il biglietto?
  hi.a1.unit15.lesson03.teach.dialogue.line04:
    title: Priya dice il prezzo
    gloss: Il biglietto costa 50 rupie.
  hi.a1.unit15.lesson03.teach.dialogue.line05:
    title: Arjun chiede l'orario di partenza
    gloss: Bene. A che ora parte il treno?
  hi.a1.unit15.lesson03.teach.dialogue.line06:
    title: Priya dice l'orario e il binario
    gloss: Il treno parte alle 6, dal binario numero 3.
  hi.a1.unit15.lesson03.teach.dialogue.line07:
    title: Arjun capisce e dice di andare
    gloss: Capito. Andiamo!
  hi.a1.unit15.lesson03.teach.dialogue.line08:
    title: Priya è d'accordo
    gloss: Andiamo!
  hi.a1.unit15.lesson03.teach.grammar_summary:
    title: Le tre regole principali
    gloss: 'Le tre regole principali di questa unità: (1) ''mujhe/tumhein/hamein + verbo + hai'' significa ''dovere + verbo''; (2) ''X kitne ka/ki hai?'' chiede il prezzo; (3) ''X [ora] baje [luogo] se jaati hai'' indica l''orario e il luogo di partenza di un viaggio.'
    note: Un riepilogo finale che riunisce la grammatica dell'intera unità, come la nota grammaticale di riepilogo dell'unità 14.
  hi.a1.unit15.lesson03.teach.tiket_reading:
    title: Leggere un biglietto
    gloss: 'Biglietto: Delhi. Binario numero 3. Ore 6.'
    note: Un breve testo frammentario da biglietto (senza frasi complete, come un vero biglietto) che riprende esattamente i fatti già emersi nel dialogo, senza aggiungere nulla di nuovo.
    glosses:
      टिकट: biglietto
      प्लेटफ़ॉर्म: binario
      नंबर: numero
      बजे: in punto
