answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (हूँ, हाँ, कहाँ vs. मैं, हैं, में, मिलेंगे). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (हूं for हूँ, हां for हाँ) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
  description: Impara a salutare, a chiedere come sta qualcuno, a presentarti e a scambiare informazioni personali di base in hindi. Ti guideremo nella distinzione di formalità tra aap e tum, una vera scelta grammaticale (un po' come tu e Lei in italiano), e nella concordanza di genere di aggettivi e forme verbali.
units:
  hi.a1.unit01.greetings:
    title: Namaste e i primi incontri
lessons:
  hi.a1.unit01.lesson01.aap_and_tum:
    title: 'Aap e tum: chiedere come sta qualcuno'
  hi.a1.unit01.lesson02.greetings_and_farewells:
    title: Saluti e congedi
  hi.a1.unit01.lesson03.names_origin_and_dialogue:
    title: Nomi, provenienza e un primo incontro a lezione di yoga
teaching:
  hi.a1.unit01.lesson01.teach.aap:
    title: Il «Lei» di rispetto
    gloss: Lei (formale, rispettoso)
    note: 'Come in italiano si sceglie tra tu e Lei, in hindi la scelta dipende dal rapporto sociale: *aap* si usa con una persona più anziana, sconosciuta o con cui si ha un rapporto professionale e rispettoso. Grammaticalmente è plurale anche se ci si rivolge a una sola persona: i verbi concordano con *aap* e prendono le stesse desinenze tipo -en/hain usate per «loro».'
  hi.a1.unit01.lesson01.teach.tum:
    title: Il «tu» informale
    gloss: tu (informale, familiare)
    note: '*Tum* si usa con un amico, un coetaneo, una persona più giovane o un familiare: è un rapporto davvero informale, ma comunque rispettoso (non è il *tu* ancora più intimo, che questo corso non insegna). *Tum* ha desinenze verbali proprie, diverse sia da quelle di *aap* sia da quelle di *tu*.'
  hi.a1.unit01.lesson01.teach.aap_kaise_hain:
    title: Domanda di cortesia sul benessere, a un uomo
    gloss: Come sta? (formale, a un uomo)
    note: '*Kaise* concorda con il GENERE DELLA PERSONA A CUI SI PARLA, non con quello di chi parla: questa forma si usa rivolgendosi a un uomo. In italiano «come stai?» non cambia mai in base al genere.'
  hi.a1.unit01.lesson01.teach.aap_kaisi_hain:
    title: Domanda di cortesia sul benessere, a una donna
    gloss: Come sta? (formale, a una donna)
    note: 'Stessa domanda, stesso registro con *aap*: cambia solo *kaisi* al posto di *kaise*, che concorda con una donna a cui ci si rivolge. Il verbo *hain* non cambia mai; cambia solo la forma dell''aggettivo.'
  hi.a1.unit01.lesson01.teach.tum_kaise_ho:
    title: Domanda informale sul benessere
    gloss: Come va? (informale)
    note: 'Con *tum* il verbo è *ho*, non *hain*: confronta il formale *Aap kaise/kaisi hain?* con l''informale *Tum kaise ho?*. È la coppia minima più chiara per sentire la differenza tra aap e tum nel verbo stesso.'
  hi.a1.unit01.lesson01.teach.main_theek_hoon:
    title: Una risposta standard
    gloss: Sto bene, grazie.
    note: '*Theek* («bene/a posto») non cambia né col genere né col registro: a differenza di *kaise/kaisi*, resta uguale chiunque parli e chiunque ascolti.'
  hi.a1.unit01.lesson01.teach.aur_aap:
    title: Restituire la domanda di cortesia
    gloss: E Lei? (formale)
    note: Un modo breve per ricambiare la domanda nel registro rispettoso di aap.
  hi.a1.unit01.lesson01.teach.aur_tum:
    title: Restituire la domanda informale
    gloss: E tu? (informale)
    note: Usa tum per ricambiare la domanda a un amico o a un coetaneo.
  hi.a1.unit01.lesson02.teach.namaste:
    title: Saluto per tutte le occasioni
    gloss: ciao; salve (si usa anche per congedarsi)
    note: '*Namaste* va bene a qualsiasi ora del giorno, in situazioni formali e informali, sia per aprire sia per chiudere un incontro: è davvero un saluto universale, mentre l''italiano usa parole diverse come «buongiorno» e «arrivederci».'
    example_gloss: Ciao! Come stai?
  hi.a1.unit01.lesson02.teach.namaskar:
    title: Saluto rispettoso
    gloss: salve (più formale e rispettoso di namaste)
    note: '*Namaskar* significa in sostanza lo stesso di *namaste*, ma ha un tono più formale e rispettoso: è adatto con una persona anziana, davanti a un pubblico numeroso o in un contesto professionale.'
    example_gloss: Salve! E Lei?
  hi.a1.unit01.lesson02.teach.phir_milenge:
    title: A presto (futuro)
    gloss: a presto; ci vediamo
    note: 'Letteralmente «ci incontreremo di nuovo»: un modo standard e neutro per salutare quando pensi di rivedere la persona.'
  hi.a1.unit01.lesson02.teach.alvida:
    title: Congedo formale
    gloss: addio; arrivederci
    note: '*Alvida* è una parola hindi corretta e reale per dire addio, ma nell''uso quotidiano ha un tono più definitivo, formale e persino un po'' drammatico rispetto a *namaste* o *phir milenge*: è più vicina ad «addio» che a un semplice «ciao».'
    example_gloss: Addio! A presto.
  hi.a1.unit01.lesson02.teach.phir_milte_hain:
    title: Ci vediamo (informale/abituale)
    gloss: ci vediamo; a presto
    note: 'Letteralmente «ci incontriamo di nuovo», con la forma verbale abituale al posto del futuro: un equivalente quotidiano un po'' più informale di *phir milenge*.'
  hi.a1.unit01.lesson02.teach.shubh_ratri:
    title: Buonanotte
    gloss: buonanotte
    note: 'Si dice quando qualcuno se ne va per la notte o va a dormire: come «buonanotte» in italiano, è un saluto di congedo e mai di apertura, a differenza di *namaste*.'
  hi.a1.unit01.lesson02.teach.shubh_din:
    title: Augurio di congedo cortese
    gloss: Buona giornata.
    note: 'Letteralmente «che la tua giornata resti buona»: un augurio di congedo cortese, adatto quando ci si separa da qualcuno con rispetto, sia in un rapporto formale sia informale.'
  hi.a1.unit01.lesson03.teach.aapka_naam_kya_hai:
    title: Chiedere il nome, in modo formale
    gloss: Come si chiama? (formale)
    note: '*Aapka* («tuo/Suo») concorda con il nome maschile *naam* («nome»): come in italiano, i possessivi hindi cambiano forma in base alla cosa posseduta, non al possessore.'
  hi.a1.unit01.lesson03.teach.tumhara_naam_kya_hai:
    title: Chiedere il nome, in modo informale
    gloss: Come ti chiami? (informale)
    note: Stesso schema con *tumhara* («tuo», informale) al posto di *aapka*. Confronta il formale *Aapka naam kya hai?* con l'informale *Tumhara naam kya hai?*.
  hi.a1.unit01.lesson03.teach.mera_naam_priya_hai:
    title: Dire il proprio nome
    gloss: Mi chiamo Priya.
    note: 'Anche *mera* («mio») concorda con *naam*, che è maschile: nota che ha la stessa desinenza maschile di *aapka* e *tumhara* qui sopra, perché tutti e tre si riferiscono allo stesso nome.'
  hi.a1.unit01.lesson03.teach.aapse_milkar_khushi_hui:
    title: Piacere di conoscere qualcuno, in modo formale
    gloss: Piacere di conoscerLa. (formale)
    note: 'Letteralmente «avendoLa incontrata, la gioia è avvenuta»: un''espressione fissa e molto diffusa per un primo incontro rispettoso.'
  hi.a1.unit01.lesson03.teach.mujhe_bhi:
    title: Ricambiare il sentimento
    gloss: Anch'io.
    note: Una risposta breve e naturale a Aapse milkar khushi hui o a Tumse milkar accha laga.
  hi.a1.unit01.lesson03.teach.aap_kahan_se_hain:
    title: Chiedere la provenienza, in modo formale
    gloss: Di dove è? (formale)
    note: Kahan significa «dove»; se significa «da».
  hi.a1.unit01.lesson03.teach.main_bharat_se_hoon:
    title: Dire la propria provenienza
    gloss: Sono dell'India.
    note: Bharat è il nome hindi dell'India e si usa continuamente nel parlato quotidiano.
  hi.a1.unit01.lesson03.teach.tum_kahan_se_ho:
    title: Chiedere la provenienza, in modo informale
    gloss: Di dove sei? (informale)
    note: 'Stessa domanda con *tum* e *ho* al posto di *aap* e *hain*: è lo stesso schema di desinenze formali/informali visto in tutta l''unità.'
  hi.a1.unit01.lesson03.teach.dialogue.line01:
    title: L'inizio dell'incontro
    gloss: Priya saluta Arjun e gli chiede se è la prima volta che viene qui.
    note: Entrambi usano fin dall'inizio il registro informale con *tum*, naturale per due coetanei che si incontrano a un corso di quartiere. *Tumhari* («tua») concorda con il nome femminile *baar* («volta», nel senso di «occasione»), non con il genere di chi parla.
  hi.a1.unit01.lesson03.teach.dialogue.line02:
    title: L'inizio dell'incontro, risposta
    gloss: Arjun dice di sì, che è la prima volta e che vuole imparare lo yoga.
    note: '*Chahta hoon* («voglio») è al maschile perché Arjun, che parla, è un uomo: questo verbo concorda con il genere di CHI PARLA, a differenza di *kaisi*/*kaise* visti prima, che concordavano con la persona a cui ci si RIVOLGE.'
  hi.a1.unit01.lesson03.teach.dialogue.line03:
    title: Scambiarsi i nomi
    gloss: Priya dice «anch'io!», dice il suo nome e chiede quello di Arjun.
    note: '*Main bhi!* («anch''io!») risponde a *main ... chahta hoon* di Arjun: quando la frase dell''altro ha *main* come soggetto, «anch''io» è *main bhi*. *Mujhe bhi* è la risposta a una frase del tipo *mujhe*, come *Tumse milkar accha laga*. *Mera naam...hai* è il modo semplice e naturale di dire il proprio nome.'
  hi.a1.unit01.lesson03.teach.dialogue.line04:
    title: Scambiarsi i nomi, risposta
    gloss: Arjun dice il suo nome e che è lieto di conoscerla, in modo informale.
    note: '*Tumse milkar accha laga* è la versione informale del formale *Aapse milkar khushi hui* visto in questa lezione: entrambe significano più o meno «piacere di conoscerti», adattate al registro.'
  hi.a1.unit01.lesson03.teach.dialogue.line05:
    title: Chiedere la provenienza
    gloss: Priya ricambia il sentimento e chiede di dove sia Arjun.
    note: Tum kahan se ho chiede la provenienza usando il registro informale già visto.
  hi.a1.unit01.lesson03.teach.dialogue.line06:
    title: Chiedere la provenienza, risposta
    gloss: Arjun è indiano ma per ora vive a Londra, poi rivolge la stessa domanda a Priya.
    note: '*Rahta hoon* («vivo, abito») è al maschile e concorda con Arjun che parla: è lo stesso schema di concordanza con il soggetto di *chahta hoon* nella battuta 2. *Lekin* («ma») collega il contrasto tra provenienza e residenza attuale.'
  hi.a1.unit01.lesson03.teach.dialogue.line07:
    title: Parlare della provenienza e di un interesse
    gloss: Priya dice di essere americana e di voler imparare anche lei lo yoga.
    note: '*Chahti hoon* è la forma femminile dello stesso verbo usato da Arjun nella battuta 2 (*chahta hoon*): entrambi concordano con il genere di chi parla, ed è una coppia minima perfetta da confrontare.'
  hi.a1.unit01.lesson03.teach.dialogue.line08:
    title: Chiedere dell'attività in comune
    gloss: Arjun reagisce con entusiasmo e chiede a Priya se pratica yoga.
    note: '*Karti ho* («fai») è femminile e concorda con Priya, la persona a cui si chiede: come *kaisi* visto prima, questa forma verbale segue il genere di chi ASCOLTA, non di chi parla.'
  hi.a1.unit01.lesson03.teach.dialogue.line09:
    title: 'Chiedere dell''attività in comune: la risposta'
    gloss: Priya dice di no, che è la prima volta e che sta ancora imparando.
    note: '*Seekh rahi hoon* («sto imparando») usa la forma continua al femminile e concorda con Priya che parla: è il corrispondente del presente continuo di *chahti hoon*.'
  hi.a1.unit01.lesson03.teach.dialogue.line10:
    title: Chiudere la conversazione
    gloss: Arjun è d'accordo a cominciare, poi dice a presto.
    note: '*Chalo shuru karte hain* («cominciamo») è un modo fisso e naturale di proporre di iniziare qualcosa insieme. *Phir milte hain* chiude lo scambio con il saluto informale visto nella lezione 2.'
