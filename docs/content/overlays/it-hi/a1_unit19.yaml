    title: Il tempo
lessons:
  hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa:
    title: Tempo, sole, pioggia e vento
  hi.a1.unit19.lesson02.garam_thanda_baadal:
    title: Caldo, freddo e nuvole
  hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam:
    title: 'Priya e Arjun: che tempo farà domani?'
teaching:
  hi.a1.unit19.lesson01.teach.aaj_review:
    title: 'Ripasso: oggi'
    gloss: oggi
    note: 'Già visto nell''unità 3: è la parola di tempo ricorrente di questa unità, insieme a *kal* (domani) nella lezione 3.'
    example_gloss: Oggi è il tre.
  hi.a1.unit19.lesson01.teach.mausam:
    title: Il tempo
    gloss: tempo (meteorologico)
    note: 'Un nome nuovo, la parola chiave di questa unità. È maschile: vedi le note di grammatica sulla concordanza di genere in questa unità.'
    example_gloss: Che tempo fa oggi?
  hi.a1.unit19.lesson01.teach.kaisa_review:
    title: 'Ripasso: come / che tipo di'
    gloss: come / che tipo di
    note: 'Già visto nell''unità 12: qui si riusa per chiedere del tempo.'
    example_gloss: Com'è la tua casa?
  hi.a1.unit19.lesson01.teach.hai_hain_review:
    title: 'Ripasso: è, sono'
    gloss: è (singolare), sono (plurale)
    note: La coppia singolare/plurale della copula su cui si basa tutto lo schema «c'è / ci sono» del tempo in questa unità.
    example_gloss:
    - Oggi il tempo è bello.
    - In casa ci sono tre stanze.
  hi.a1.unit19.lesson01.teach.dhoop:
    title: Sole / luce del sole
    gloss: sole / luce del sole
    note: 'Un nome nuovo. Si usa come semplice esistenziale: *aaj dhoop hai* = «oggi c''è il sole» (letteralmente «oggi c''è luce del sole»).'
    example_gloss: Oggi c'è il sole.
  hi.a1.unit19.lesson01.teach.baarish:
    title: Pioggia
    gloss: pioggia
    note: 'Un nome nuovo. Si usa come semplice esistenziale: *aaj baarish hai* = «oggi piove».'
    example_gloss: Oggi piove.
  hi.a1.unit19.lesson01.teach.hawa:
    title: Vento
    gloss: vento
    note: 'Un nome nuovo. Si usa come semplice esistenziale: *aaj hawa hai* = «oggi c''è vento».'
    example_gloss: Oggi c'è vento.
  hi.a1.unit19.lesson01.teach.grammar_mausam_existential:
    title: Lo schema esistenziale per il tempo
    gloss: Per parlare del tempo si dice 'aaj/kal + [parola del tempo] + hai', ad esempio 'aaj dhoop hai', 'aaj baarish hai', 'aaj hawa hai'. È lo stesso schema hai/hain già visto per la casa (unità 18), ma qui senza numero, direttamente come soggetto.
    note: 'La prima nota di grammatica di questa unità: collega il lessico nuovo a uno schema di frase già noto.'
  hi.a1.unit19.lesson02.teach.mausam_review:
    title: 'Ripasso: tempo (meteo)'
    gloss: tempo (meteorologico)
    note: Ripreso dalla lezione 1 di questa unità.
    example_gloss: Che tempo fa oggi?
  hi.a1.unit19.lesson02.teach.garam:
    title: Caldo
    gloss: caldo
    note: 'Un aggettivo nuovo. Non cambia in base al genere: vedi la nota di grammatica di questa lezione.'
    example_gloss: Oggi il tempo è caldo.
  hi.a1.unit19.lesson02.teach.thanda_thandi:
    title: Freddo (masch. / femm.)
    gloss: freddo (maschile), fredda (femminile)
    note: 'Un aggettivo nuovo. A differenza di *garm*, CAMBIA in base al genere: *mausam* (maschile) vuole *thanda*, i nomi femminili (come *rasoi*, unità 18) vogliono *thandi*. Vedi la nota di grammatica di questa lezione.'
    example_gloss:
    - Oggi fa freddo.
    - Oggi la cucina è fredda.
  hi.a1.unit19.lesson02.teach.grammar_garam_thanda:
    title: Aggettivi invariabili e aggettivi che concordano nel genere
    gloss: '''Garm'' è un aggettivo che finisce per consonante e non cambia in base al genere: ''mausam garm hai'' ha sempre ''garm''. Invece ''thanda''/''thandi'' è un aggettivo in ''-a'' che CAMBIA in base al genere, proprio come ''bada''/''badi'' (unità 14): ''mausam'', maschile, vuole ''thanda'', un nome femminile vuole ''thandi''.'
    note: 'Il contrasto grammaticale centrale di questa unità: una nuova coppia di aggettivi si collega alla regola già vista nell''unità 14.'
  hi.a1.unit19.lesson02.teach.baadal:
    title: Nuvola / nuvole
    gloss: nuvola / nuvole
    note: 'Un nome nuovo, usato in questa unità solo nella forma plurale esistenziale: *aaj baadal hain* = «oggi ci sono nuvole» / «oggi è nuvoloso».'
    example_gloss: Oggi ci sono nuvole.
  hi.a1.unit19.lesson02.teach.accha_review:
    title: 'Ripasso: buono / bello'
    gloss: buono / bello
    note: 'Già visto nell''unità 9: qui si riusa per descrivere il tempo.'
    example_gloss: Oggi il tempo è bello.
  hi.a1.unit19.lesson02.teach.bura:
    title: Cattivo
    gloss: cattivo
    note: Un aggettivo nuovo, in opposizione ad *accha* (buono), già noto. In questa unità si usa solo al maschile, in accordo con *mausam*.
    example_gloss: Oggi il tempo è brutto.
  hi.a1.unit19.lesson02.teach.bahut_review:
    title: 'Ripasso: molto'
    gloss: molto
    note: 'Già visto nell''unità 6: qui si riusa per rafforzare una descrizione del tempo.'
    example_gloss: Oggi il tempo è molto freddo.
  hi.a1.unit19.lesson03.teach.kal_review:
    title: 'Ripasso: domani (anche: ieri)'
    gloss: domani (a seconda del contesto significa anche «ieri»)
    note: 'Visto nell''unità 4 e ripreso per «ieri» nell''unità 12: in hindi è davvero ambiguo e solo il contesto chiarisce. Le frasi di questa unità parlano tutte di futuro e di progetti, quindi qui ''kal'' significa «domani».'
    example_gloss: Domani piove.
  hi.a1.unit19.lesson03.teach.ghar_review:
    title: 'Ripasso: casa'
    gloss: casa
    note: 'Già visto nell''unità 8: qui si riusa per il programma che ne deriva (restare a casa).'
    example_gloss: Questa è una casa.
  hi.a1.unit19.lesson03.teach.mein_review:
    title: 'Ripasso: in / a'
    gloss: in / a
    note: 'Già visto nell''unità 1: qui si riusa in «ghar mein» (a casa).'
    example_gloss: In casa ci sono tre stanze.
  hi.a1.unit19.lesson03.teach.hum_review:
    title: 'Ripasso: noi'
    gloss: noi
    note: 'Già visto nell''unità 11: qui si riusa come soggetto dei progetti di questa lezione.'
    example_gloss: Noi guardiamo un film.
  hi.a1.unit19.lesson03.teach.rehte_hain_review:
    title: 'Ripasso: [loro/noi] restano / abitano'
    gloss: '[loro/noi] restano / abitano'
    note: 'Visto nell''unità 5 (con un nonno al singolare, tramite la concordanza di rispetto al maschile plurale): questa è la prima unità che lo usa con un soggetto davvero plurale, ''hum'' (noi), con la stessa forma verbale, più semplicemente.'
    example_gloss: Mio nonno abita a Delhi.
  hi.a1.unit19.lesson03.teach.chalo_review:
    title: 'Ripasso: andiamo / dai'
    gloss: andiamo / dai
    note: 'Visto nell''unità 1 e ripreso nelle unità 6/7/11 con un verbo abituale al plurale per dire «Facciamo ___»: qui si usa allo stesso modo.'
    example_gloss: Dai, mangiamo qualcosa!
  hi.a1.unit19.lesson03.teach.jaana_review:
    title: 'Ripasso: andare'
    gloss: andare
    note: 'Visto nell''unità 15 come semplice infinito: questa lezione lo estende alla forma abituale plurale ''jaate hain'' (andiamo), con la stessa derivazione già usata nell''unità 11 per ''dekhte hain''/''peete hain''.'
    example_gloss: Devo andare alla stazione.
  hi.a1.unit19.lesson03.teach.aur_review:
    title: 'Ripasso: e'
    gloss: e
    note: 'Già visto nell''unità 1: qui si riusa per unire il tempo di domani e la temperatura.'
    example_gloss: Domani pioverà e farà freddo.
  hi.a1.unit19.lesson03.teach.bahar:
    title: Fuori
    gloss: fuori
    note: Una parola nuova, propria del vocabolario di questa lezione sui programmi che dipendono dal tempo.
    example_gloss: Andiamo fuori!
  hi.a1.unit19.lesson03.teach.jaate_hain_phrase:
    title: Andiamo fuori!
    gloss: Andiamo fuori!
    note: '''Chalo'' + il plurale abituale ''jaate hain'' (da ''jaana'', andare): è lo stesso schema «Andiamo a ___» già visto nelle unità 1/6/7/11.'
  hi.a1.unit19.lesson03.teach.dialogue.line01:
    title: Arjun chiede a Priya che tempo fa oggi
    gloss: Priya, che tempo fa oggi?
  hi.a1.unit19.lesson03.teach.dialogue.line02:
    title: Priya descrive il tempo di oggi
    gloss: Oggi c'è il sole e fa caldo.
  hi.a1.unit19.lesson03.teach.dialogue.line03:
    title: Arjun propone di andare fuori
    gloss: Bene! Andiamo fuori.
  hi.a1.unit19.lesson03.teach.dialogue.line04:
    title: Priya chiede del tempo di domani
    gloss: Va bene! E domani che tempo fa?
  hi.a1.unit19.lesson03.teach.dialogue.line05:
    title: Arjun descrive il tempo di domani
    gloss: Domani pioverà e farà freddo.
  hi.a1.unit19.lesson03.teach.dialogue.line06:
    title: Priya propone di restare a casa
    gloss: Allora domani restiamo a casa?
  hi.a1.unit19.lesson03.teach.dialogue.line07:
    title: Arjun è d'accordo
    gloss: Sì, domani restiamo a casa.
  hi.a1.unit19.lesson03.teach.dialogue.line08:
    title: Priya è d'accordo
    gloss: Va bene!
  hi.a1.unit19.lesson03.teach.grammar_summary:
    title: Tre regole principali
    gloss: 'Le tre regole principali di questa unità: (1) ''aaj/kal + [parola del tempo] + hai/hain'' serve a descrivere il tempo; (2) ''garm'' non cambia con il genere, mentre ''thanda''/''thandi'' sì, proprio come ''bada''/''badi''; (3) ''chalo'' + un verbo al plurale abituale (come ''jaate hain'') esprime un invito: ''chalo, bahar jaate hain!''.'
    note: Un riepilogo finale che riunisce la grammatica di tutta l'unità, come le note grammaticali conclusive delle unità 15-18.
  hi.a1.unit19.lesson03.teach.weather_reading:
    title: Lettura su oggi e domani
    gloss: Oggi fa caldo e c'è il sole. Andiamo fuori! Domani pioverà e farà freddo. Domani restiamo a casa.
    note: 'Un breve testo diretto, senza nuova cornice narrativa, che riprende esattamente i fatti già presentati nel dialogo, senza aggiungere nulla: serve proprio all''obiettivo di leggere una breve previsione del tempo.'
    glosses:
      आज: oggi
      मौसम: tempo (meteorologico)
      गर्म: caldo
      धूप: sole
      चलो: andiamo
      बाहर: fuori
      जाते: andare (da जाना)
      कल: domani
      बारिश: pioggia
      ठंडा: freddo
      रहते: restare / abitare (da रहना)
