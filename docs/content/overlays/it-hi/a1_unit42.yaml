  hi.a1.unit42.lesson05.teach.neena_laingvej_kaife:
    title: Nina sente parlare di tutti
    gloss: Nina è nuova al caffè linguistico. Chiede ad Arjun com'è il resto del gruppo. Arjun glielo racconta. Priya è gentile e paziente; fa l'infermiera. Vikram è divertente e sta seguendo un corso di spagnolo. Neha è curiosa; le piace imparare cose nuove. Arjun, invece, è calmo di suo.
    note: Riepiloga i tratti di personalità del gruppo, come le letture di confronto delle unità sulla casa, il quartiere, la posta e la cucina.
    glosses:
      नई: nuovo
      कैफ़े: caffè delle lingue
      पूछती: chiede
      बाकी: gli altri
      बताता: racconta
      दयालु: simpatica
      धैर्यवान: paziente
      काम: lavora
      नर्स: infermiera
      मज़ेदार: divertente
      ले: segue / frequenta
      कोर्स: corso
      स्पैनिश: spagnolo
      जिज्ञासु: curioso
      सीखना: imparare
      पसंद: piace (provare piacere per qualcosa)
      नया: nuovo
      कुछ: qualcosa
      ख़ुद: stesso
      शांत: tranquillo
