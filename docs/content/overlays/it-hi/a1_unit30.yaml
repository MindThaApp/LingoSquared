teaching:
  hi.a1.unit30.lesson01.teach.parhna_kasrat_karna:
    title: Leggere, fare sport, cucinare
    gloss: leggere, fare sport, cucinare
    note: 'In hindi gli hobby si esprimono con un verbo che termina in *-ना*: *पढ़ना*, *कसरत करना* e *खाना बनाना* (''leggere'', ''fare esercizio'', ''cucinare'').'
    example_gloss:
    - Mi piace leggere un libro.
    - Faccio sport il sabato.
    - Mi piace cucinare per gli amici.
  hi.a1.unit30.lesson01.teach.khalee_samay:
    title: Tempo libero
    gloss: tempo libero
    note: '*खाली समय* (''tempo vuoto'') è l''espressione chiave per parlare degli hobby, e *में* corrisponde a ''in/nel'': *खाली समय में*.'
    example_gloss: Nel mio tempo libero mi piace leggere.
  hi.a1.unit30.lesson01.teach.mujhe_khalee_samay:
    title: Dire che cosa fai nel tempo libero
    gloss: Nel mio tempo libero mi piace leggere.
    note: '*मुझे ... पढ़ना पसंद है* (''a me, leggere è gradito'') è il modo in hindi di dire ''mi piace leggere''; *मुझे* indica chi apprezza l''attività.'
  hi.a1.unit30.lesson02.teach.sangeet_sunna_chitr:
    title: Musica, disegno, videogiochi
    gloss: ascoltare musica, disegnare, giocare ai videogiochi
    note: 'Altri tre hobby: *संगीत सुनना*, *चित्र बनाना* e *गेम खेलना*; *गेम* è un prestito dall''inglese.'
    example_gloss:
    - Mi piace ascoltare musica.
    - Disegno spesso.
    - Mi piace giocare ai videogiochi con gli amici.
  hi.a1.unit30.lesson02.teach.mujhe_sangeet_sunna:
    title: Dire che ti piace ascoltare musica
    gloss: Mi piace ascoltare musica.
    note: '*संगीत सुनना* (''ascoltare musica'') non richiede parole aggiuntive: l''oggetto sta direttamente davanti al verbo.'
  hi.a1.unit30.lesson02.teach.mujhe_doston_ke:
    title: Dire che ti piace giocare ai videogiochi con gli amici
    gloss: Mi piace giocare ai videogiochi con gli amici.
    note: In *दोस्तों के साथ* ('con gli amici') *दोस्त* è al plurale obliquo (*दोस्तों*) perché precede *के साथ*.
  hi.a1.unit30.lesson03.teach.hamesha_aksar_kabheekbhee:
    title: Sempre, spesso, a volte, mai
    gloss: sempre, spesso, a volte, mai
    note: Le parole di frequenza come *हमेशा*, *अक्सर*, *कभी-कभी* e *कभी नहीं* stanno di solito prima del verbo; *कभी नहीं* significa 'mai'.
    example_gloss:
    - Faccio sempre sport il sabato.
    - Leggo spesso un libro.
    - A volte disegno.
    - Non gioco mai ai videogiochi.
  hi.a1.unit30.lesson03.teach.har_hafte_har:
    title: Ogni settimana, ogni fine settimana
    gloss: ogni settimana, ogni fine settimana
    note: '*हर* (''ogni'') non cambia mai, e la parola di tempo che lo segue resta nella forma semplice: *हर हफ़्ते*, *हर वीकेंड*.'
    example_gloss:
    - Cucino per gli amici ogni settimana.
    - Faccio sport ogni fine settimana.
  hi.a1.unit30.lesson03.teach.har_hafte_har_2:
    title: हर non cambia
    gloss: Ogni settimana, ogni weekend.
    note: '*हर* resta invariato qualunque sia il nome che segue, quindi non c''è nessuna forma da scegliere: *हर हफ़्ते*, *हर वीकेंड*.'
  hi.a1.unit30.lesson03.teach.tum_khalee_samay:
    title: Chiedere del tempo libero
    gloss: Che cosa fai nel tempo libero?
    note: 'Questa è la domanda chiave dell''unità: usala per chiedere a chiunque dei suoi hobby.'
  hi.a1.unit30.lesson04.teach.priya_ham_aksar:
    title: Priya introduce il discorso sugli hobby
    gloss: 'Priya: Facciamo spesso una passeggiata insieme. Ma tu, Arjun, che cos''altro fai nel tempo libero?'
    note: '*टहलते हैं* è al plurale perché il soggetto è *हम* (''noi''), e *अक्सर* sta prima del verbo.'
  hi.a1.unit30.lesson04.teach.arjun_mujhe_khana:
    title: Gli hobby di Arjun
    gloss: 'Arjun: Mi piace cucinare, anche a casa. E faccio spesso esercizio fisico.'
    note: '*घर पर भी* (''anche a casa'') mostra che Arjun cucina per piacere, non solo al lavoro.'
  hi.a1.unit30.lesson04.teach.priya_tum_ghar:
    title: Priya è sorpresa
    gloss: 'Priya: Cucini anche a casa? Ma se cucini già tutto il giorno al lavoro!'
    note: '*पूरा दिन* (''tutto il giorno'') sottolinea quanto cucini già al lavoro, e *तो* aggiunge enfasi.'
  hi.a1.unit30.lesson04.teach.arjun_han_lekin:
    title: Arjun spiega
    gloss: 'Arjun: Sì, ma cucinare mi rilassa. E a te, che cosa piace fare?'
    note: '*खाना बनाने से सुकून मिलता है* significa ''cucinare mi rilassa'' (letteralmente ''dal cucinare si riceve calma''); *बनाना* diventa *बनाने* davanti a *से*.'
  hi.a1.unit30.lesson04.teach.priya_mujhe_parhna:
    title: Gli hobby di Priya
    gloss: 'Priya: Mi piace leggere e ascolto spesso musica.'
    note: '*और* (''e'') unisce due hobby, e *सुनती हूँ* è al femminile perché a parlare è Priya.'
  hi.a1.unit30.lesson04.teach.arjun_kya_tum:
    title: Arjun chiede dei videogiochi
    gloss: 'Arjun: Giochi anche ai videogiochi?'
    note: 'Una breve domanda sì/no: si apre con *क्या*, e *खेलती हो* è al femminile perché Arjun si rivolge a Priya.'
  hi.a1.unit30.lesson04.teach.priya_naheen_main:
    title: Priya risponde
    gloss: 'Priya: No, non gioco mai ai videogiochi. Ma qualche volta disegno!'
    note: '*कभी ... नहीं* (''mai'') e *कभी-कभी* (''qualche volta'') sono messi a confronto in un''unica risposta.'
  hi.a1.unit30.lesson05.teach.arjun_aur_main:
    title: Confronto tra hobby
    gloss: Arjun e io facciamo spesso una passeggiata insieme. Ma abbiamo anche altri hobby. Ad Arjun piace cucinare, anche a casa, e fa spesso esercizio fisico. A me piace leggere e ascolto spesso musica. Qualche volta disegno, ma non gioco mai ai videogiochi. E a te, che cosa piace fare nel tempo libero?
    note: Il messaggio di Priya riassume quanto detto prima e si chiude con la domanda centrale dell'unità rivolta a chi legge.
    glosses:
      टहलते: passeggiamo
      अक्सर: spesso
      साथ: insieme
      और: altri
      बनाना: il fare (cucinare)
      पसंद: piace
      घर: a casa
      कसरत: fa sport
      पढ़ना: leggere
      सुनती: ascolto
      संगीत: musica
      चित्र: immagine (disegno)
      कभी-कभी: a volte
      गेम: gioco ai videogiochi
      कभी: mai (con नहीं)
      खाली: libero
      समय: tempo
  hi.a1.unit30.lesson06.teach.arjun_tum_is:
    title: Arjun chiede del weekend
    gloss: 'Arjun: Che cosa fai questo weekend?'
    note: In *इस वीकेंड* ('questo weekend') *इस* precede il nome, e *कर रही हो* indica l'azione in corso, 'stai facendo', al femminile perché ci si rivolge a Priya.
  hi.a1.unit30.lesson06.teach.priya_abhee_pata:
    title: Priya è indecisa
    gloss: 'Priya: Ancora non lo so. Mi piace leggere, ma vorrei anche uscire.'
    note: '*बाहर जाना चाहती हूँ* significa ''voglio uscire''; *चाहती* è al femminile e viene dopo *जाना*.'
  hi.a1.unit30.lesson06.teach.arjun_chalo_sath:
    title: Arjun propone un programma
    gloss: 'Arjun: Facciamo una passeggiata insieme? Dopo cucino io per noi.'
    note: '*उसके बाद* (''dopo di ciò'') mette in ordine i due programmi, e *चलो ... टहलें* propone il primo.'
  hi.a1.unit30.lesson06.teach.priya_achchha_aidiya:
    title: Priya è d'accordo
    gloss: 'Priya: Bella idea! Mi piacciono sia le passeggiate sia cucinare.'
    note: '*दोनों पसंद हैं* mostra che a Priya piacciono entrambe allo stesso modo, e il verbo è al plurale *हैं*.'
  hi.a1.unit30.lesson06.teach.arjun_barhiya_to:
    title: Arjun conferma
    gloss: 'Arjun: Perfetto. Allora ci vediamo sabato!'
    note: '*शनिवार को मिलते हैं* (''ci vediamo sabato'') usa il presente per un programma già fissato, e *को* indica il giorno.'
