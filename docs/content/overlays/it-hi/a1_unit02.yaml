    title: I numeri
lessons:
  hi.a1.unit02.lesson01.numbers_zero_to_ten:
    title: I numeri da zero a dieci
  hi.a1.unit02.lesson02.numbers_and_prices:
    title: I numeri da undici a cento e i prezzi
  hi.a1.unit02.lesson03.phone_and_age:
    title: Numero di telefono ed età
teaching:
  hi.a1.unit02.lesson01.teach.shoonya:
    title: Zero
    gloss: zero
    note: Il punto di partenza di tutti i numeri di questa unità.
    example_gloss: Oggi la temperatura è zero.
  hi.a1.unit02.lesson01.teach.ek:
    title: Uno
    gloss: uno
    note: In hindi i numeri da 11 a 99 sono ciascuno una parola a sé, non costruita con lo schema «dieci + uno». Lo vedrai nella lezione 2, dove बीस (20) e तीस (30) non hanno nessuna parte in comune con एक (1) o दो (2).
    example_gloss: Ho un libro.
  hi.a1.unit02.lesson01.teach.do:
    title: Due
    gloss: due
    note: Un numero semplice e frequentissimo; è anche l'imperativo informale di «dare», ma il contesto chiarisce sempre il significato.
    example_gloss: Ho due fratelli.
  hi.a1.unit02.lesson01.teach.teen:
    title: Tre
    gloss: tre
    note: '*Chahiye* («è necessario») è una costruzione impersonale molto comune: *mujhe teen seb chahiye* significa letteralmente «a me tre mele [è] necessario», un modo molto naturale per dire «mi servono».'
    example_gloss: Mi servono tre mele.
  hi.a1.unit02.lesson01.teach.chaar:
    title: Quattro
    gloss: quattro
    note: 'Nessuna irregolarità: chaar si comporta come tutti gli altri numeri piccoli.'
    example_gloss: Ho quattro amici.
  hi.a1.unit02.lesson01.teach.paanch:
    title: Cinque
    gloss: cinque
    note: 'Si scrive con il chandrabindu (पाँच), non con l''anusvara: il segno vocalico ा non sale sopra la lettera, ed è per questo che serve il chandrabindu invece del semplice punto, come già visto in हाँ/कहाँ nell''unità 1.'
    example_gloss: Ho cinque rupie.
  hi.a1.unit02.lesson01.teach.chhah:
    title: Sei
    gloss: sei
    note: Nei testi più antichi si trova a volte anche la grafia छः; छह è la grafia standard moderna.
    example_gloss: Ho sei libri.
  hi.a1.unit02.lesson01.teach.saat:
    title: Sette
    gloss: sette
    note: Un numero utile per parlare dei giorni della settimana.
    example_gloss: In una settimana ci sono sette giorni.
  hi.a1.unit02.lesson01.teach.aath:
    title: Otto
    gloss: otto
    note: 'Nessuna irregolarità: aath si comporta come tutti gli altri numeri piccoli.'
    example_gloss: In questa stanza ci sono otto sedie.
  hi.a1.unit02.lesson01.teach.nau:
    title: Nove
    gloss: nove
    note: Qui non serve alcun segno di nasalizzazione, a differenza di alcuni dei numeri vicini.
    example_gloss: La lezione di yoga inizia alle nove del mattino.
  hi.a1.unit02.lesson01.teach.das:
    title: Dieci
    gloss: dieci
    note: 'L''ultimo numero di questo primo gruppo: la lezione 2 prosegue con le decine e i numeri seguenti, che da qui in poi non sono più prevedibili.'
    example_gloss: Ho dieci dita nelle mani.
  hi.a1.unit02.lesson02.teach.gyaarah:
    title: Undici
    gloss: undici
    note: 'Da qui in poi i numeri hindi sono ciascuno una parola irregolare a sé: gyaarah non contiene in modo visibile né das (10) né ek (1). Non ci sono scorciatoie: vanno imparati uno per uno.'
    example_gloss: In questa classe ci sono undici studenti.
  hi.a1.unit02.lesson02.teach.baarah:
    title: Dodici
    gloss: dodici
    note: 'Un altro da memorizzare e basta: nessuno schema prevedibile lo lega a do (2).'
    example_gloss: In un anno ci sono dodici mesi.
  hi.a1.unit02.lesson02.teach.pandrah:
    title: Quindici
    gloss: quindici
    note: Molto usato per i tempi brevi, come una pausa di quindici minuti.
    example_gloss: Mi servono quindici minuti.
  hi.a1.unit02.lesson02.teach.bees:
    title: Venti
    gloss: venti
    note: 'Una parola davvero nuova, non una combinazione di das (10) e do (2): è lo schema che continua per tutte le decine da qui in poi.'
    example_gloss: Mia sorella ha vent'anni.
  hi.a1.unit02.lesson02.teach.tees:
    title: Trenta
    gloss: trenta
    note: 'Di nuovo una parola a sé: somiglia un po'' a teen (3), ma non si può costruire con teen più das, quindi va imparata separatamente.'
    example_gloss: Il biglietto costa trenta rupie.
  hi.a1.unit02.lesson02.teach.pachaas:
    title: Cinquanta
    gloss: cinquanta
    note: Un numero tondo molto usato, soprattutto per i prezzi.
    example_gloss: Ho cinquanta rupie.
  hi.a1.unit02.lesson02.teach.sau:
    title: Cento
    gloss: cento
    note: Un numero tondo netto, usatissimo nei prezzi di tutti i giorni.
    example_gloss: Questo libro costa cento rupie.
  hi.a1.unit02.lesson02.teach.keemat:
    title: Prezzo
    gloss: prezzo; costo
    note: '*Keemat* è un sostantivo femminile: il suo possessivo prende sempre la forma femminile (*iski keemat*, «il suo prezzo»), qualunque sia l''oggetto di cui si parla.'
    example_gloss: Qual è il prezzo di questo biglietto?
  hi.a1.unit02.lesson02.teach.rupaye:
    title: Rupie
    gloss: rupie
    note: '*Rupaya* è la forma singolare (per una sola rupia); *rupaye* si usa per qualsiasi importo maggiore.'
    example_gloss: Costa cinquanta rupie.
  hi.a1.unit02.lesson02.teach.iski_keemat_kya_hai:
    title: Chiedere un prezzo
    gloss: Qual è il suo prezzo?
    note: '*Iski* («suo») concorda con il sostantivo femminile *keemat* («prezzo»), non con l''oggetto di cui si chiede il prezzo: è lo stesso schema di concordanza del possessivo introdotto nell''unità 1 con *mera naam*.'
  hi.a1.unit02.lesson02.teach.iski_keemat_pachaas_rupaye_hai:
    title: Dire un prezzo
    gloss: Il suo prezzo è cinquanta rupie.
    note: La risposta naturale, in frase completa, a Iski keemat kya hai?
  hi.a1.unit02.lesson03.teach.aapka_phone_number_kya_hai:
    title: Chiedere un numero di telefono, in modo formale
    gloss: Qual è il Suo numero di telefono? (formale)
    note: '*Number* (नंबर) è un prestito dall''inglese, usatissimo nell''hindi di ogni giorno. *Aapka* concorda con il sostantivo maschile *number*.'
  hi.a1.unit02.lesson03.teach.tumhara_phone_number_kya_hai:
    title: Chiedere il numero di telefono in modo informale
    gloss: Qual è il tuo numero di telefono? (informale)
    note: Tumhara sostituisce aapka quando si parla con un amico o un coetaneo, come nell'unità 1.
  hi.a1.unit02.lesson03.teach.mera_number:
    title: 'Dare un numero: l''introduzione'
    gloss: Il mio numero è...
    note: Un modo naturale per introdurre il numero prima di dire le cifre una alla volta.
  hi.a1.unit02.lesson03.teach.sample_number:
    title: Un numero di telefono di esempio
    gloss: Sei, due, otto, tre, cinque.
    note: In hindi i numeri di telefono si leggono cifra per cifra, come spesso si fa anche in italiano; tutte le cifre qui presenti sono già state insegnate nella lezione 1.
  hi.a1.unit02.lesson03.teach.aapki_umra_kya_hai:
    title: Chiedere l'età in modo formale
    gloss: Quanti anni ha? (formale)
    note: '*Umra* («età») è un sostantivo femminile, quindi *aapki* prende qui la forma femminile: è lo stesso schema di concordanza di *iski keemat*, ora applicato all''età di una persona invece che a un prezzo.'
  hi.a1.unit02.lesson03.teach.tumhari_umra_kya_hai:
    title: Chiedere l'età in modo informale
    gloss: Quanti anni hai? (informale)
    note: Tumhari sostituisce aapki quando si parla con un amico o un coetaneo.
  hi.a1.unit02.lesson03.teach.meri_umra_tees_saal_hai:
    title: Dire la propria età
    gloss: Ho trent'anni.
    note: '*Meri* concorda con *umra* (femminile), mai con il genere di chi parla: a differenza delle forme verbali *chahta/chahti* dell''unità 1, questo possessivo non cambia, chiunque parli.'
  hi.a1.unit02.lesson03.teach.dialogue.line01:
    title: Arjun chiede il numero a Priya
    gloss: Arjun chiede a Priya il numero di telefono, in modo informale.
    note: Riprende esattamente la domanda informale sul numero di telefono di questa lezione.
  hi.a1.unit02.lesson03.teach.dialogue.line02:
    title: Priya dice il suo numero e lo chiede a sua volta
    gloss: Priya dice il proprio numero di telefono, cifra per cifra, poi chiede quello di Arjun.
    note: Tutte le cifre qui presenti sono già state insegnate nella lezione 1 di questa unità.
  hi.a1.unit02.lesson03.teach.dialogue.line03:
    title: Arjun dice il suo numero
    gloss: Arjun dice il proprio numero di telefono.
    note: Ancora una volta, tutte le cifre riprendono il vocabolario della lezione 1.
  hi.a1.unit02.lesson03.teach.dialogue.line04:
    title: Priya chiede l'età di Arjun
    gloss: Priya lo ringrazia e gli chiede l'età, in modo informale.
    note: Shukriya («grazie») non cambia con il registro, come nella scheda shukriya dell'unità 1.
  hi.a1.unit02.lesson03.teach.dialogue.line05:
    title: Arjun dice la sua età e la chiede a sua volta
    gloss: Arjun dice di avere vent'anni, poi chiede a Priya la sua età.
    note: Tumhari? da solo è un modo breve e naturale per rimandare la domanda.
  hi.a1.unit02.lesson03.teach.dialogue.line06:
    title: Priya dice la sua età
    gloss: Priya dice di avere trent'anni.
    note: Meri umra tees saal hai riprende esattamente lo schema di frase insegnato prima in questa lezione.
  hi.a1.unit02.lesson03.teach.dialogue.line07:
    title: Arjun conclude la conversazione
    gloss: Arjun reagisce con entusiasmo e dice che si rivedranno.
    note: Accha e phir milenge riprendono entrambi il vocabolario di congedo dell'unità 1.
  hi.a1.unit02.lesson03.teach.dialogue.line08:
    title: Priya conclude la conversazione
    gloss: Priya è d'accordo e dice un «a presto» informale.
    note: Theek hai e phir milte hain riprendono entrambi il vocabolario di congedo dell'unità 1.
