teaching:
  hi.a1.unit13.lesson01.teach.chai_coffee_review:
    title: 'Ripasso: tè, caffè'
    gloss: tè, caffè
    note: Un rapido ripasso del lessico dell'unità 6, necessario per parlare di ciò che piace e non piace in questa unità.
    example_gloss:
    - Voglio il tè.
    - Voglio il caffè.
  hi.a1.unit13.lesson01.teach.mujhe_review:
    title: 'Ripasso: a me'
    gloss: a me
    note: 'Il pronome al dativo già visto e usato in tutte le unità 6/7/11: qui gli si abbina un nuovo predicato.'
    example_gloss: Voglio il tè.
  hi.a1.unit13.lesson01.teach.pasand:
    title: Gradimento / gradito
    gloss: gradimento / gradito
    note: 'Un sostantivo che significa «gradimento» (non «preferito»): insieme a un soggetto al dativo (mujhe/tumhein) e alla copula hai/hain, forma l''espressione per «mi piace...».'
    example_gloss: Mi piace il tè.
  hi.a1.unit13.lesson01.teach.pasand_hai_grammar:
    title: Pasand hai = mi piace
    gloss: '''Pasand hai'' significa ''X è gradito a me'', cioè ''mi piace X''. Inizia con mujhe/tumhein proprio come ''mujhe...chahiye'' (unità 6), ma mentre dopo ''chahiye'' non va ''hai'', dopo ''pasand'' ci vuole sempre ''hai'' o ''hain''.'
    note: Chiarisce in modo esplicito la differenza di struttura tra chahiye (volere/aver bisogno) e pasand hai (piacere), così le due costruzioni non si confondono.
  hi.a1.unit13.lesson01.teach.sangeet:
    title: La musica
    gloss: musica
    note: Un nuovo sostantivo, per esercitare la costruzione pasand hai con un soggetto singolare e non numerabile.
    example_gloss: Mi piace la musica.
  hi.a1.unit13.lesson01.teach.haan_nahi_review:
    title: 'Ripasso: sì, non'
    gloss: sì, non
    note: Un rapido ripasso di due parole viste all'inizio, necessarie per rispondere alle domande sulle preferenze e per negare.
    example_gloss:
    - Sì, mi piace la musica.
    - No, non mi piace il caffè.
  hi.a1.unit13.lesson01.teach.pasand_nahi_hai_phrase:
    title: Non mi piace il caffè.
    gloss: Non mi piace il caffè.
    note: 'La negazione funziona esattamente come nelle altre frasi con hai già viste (per esempio ''yoga class nahin hai'' dell''unità 3): nahin va subito prima di hai.'
  hi.a1.unit13.lesson01.teach.kitab_kitaben:
    title: Libro / libri
    gloss: libro / libri
    note: Una nuova coppia di sostantivi, singolare e plurale, per mostrare che 'hai'/'hain' dopo pasand concorda con il numero della cosa che piace.
    example_gloss:
    - Mi piace il libro.
    - Mi piacciono i libri.
  hi.a1.unit13.lesson01.teach.number_agreement_grammar:
    title: Hai o hain dopo pasand
    gloss: '''Hai'' o ''hain'' dopo ''pasand'' concorda con il NUMERO della cosa che piace, esattamente come in ''mere paas...hai/hain'' (unità 2): chai/sangeet pasand hai (singolare), kitaabein pasand hain (plurale).'
    note: Estende direttamente a un nuovo contesto la regola di concordanza hai/hain già vista nell'unità 2, senza introdurre un nuovo concetto grammaticale.
  hi.a1.unit13.lesson02.teach.tumhein_review:
    title: 'Ripasso: a te (informale)'
    gloss: a te (informale)
    note: 'Visto per la prima volta nell''unità 6 con chahiye (''tumhein...chahiye?''): qui lo stesso pronome al dativo si usa con pasand hai.'
    example_gloss: Ti piace la musica?
  hi.a1.unit13.lesson02.teach.kya_tumhein_pasand_hai_grammar:
    title: Kya tumhein...pasand hai?
    gloss: '''Kya'' all''inizio di una frase è il segnale della domanda sì/no (unità 1); ''tumhein'' ripropone lo stesso schema con soggetto al dativo già usato in ''tumhein...chahiye?'' (unità 6): qui ''pasand hai'' prende il posto di ''chahiye''.'
    note: Conferma che si tratta del riuso di uno schema di domanda già noto, non di un nuovo punto grammaticale.
  hi.a1.unit13.lesson02.teach.khel:
    title: Sport / gioco
    gloss: sport / gioco
    note: Un nuovo sostantivo. Negli esempi è abbinato a 'yah' (questo) per rendere chiaro il singolare, perché 'khel' da solo non cambia forma tra singolare e plurale.
    example_gloss: Mi piace questo sport.
  hi.a1.unit13.lesson02.teach.yah_review:
    title: 'Ripasso: questo'
    gloss: questo
    note: 'Visto per la prima volta nell''unità 7 (''mujhe yah chahiye''): qui si riutilizza per rendere chiaro il singolare di ''khel''.'
    example_gloss: Questo libro è bello.
  hi.a1.unit13.lesson02.teach.ya_review:
    title: 'Ripasso: o'
    gloss: o
    note: 'Visto per la prima volta nelle unità 6/7 per ordinare cibo e acquistare oggetti: qui si riutilizza per fare una domanda a scelta sui gusti.'
    example_gloss: Tè o caffè?
  hi.a1.unit13.lesson02.teach.chai_ya_coffee_phrase:
    title: Ti piace il tè o il caffè?
    gloss: Ti piace il tè o il caffè?
    note: Unisce lo schema di domanda con tumhein di questa lezione a ya (o), già visto, per chiederti di scegliere.
  hi.a1.unit13.lesson02.teach.zyada:
    title: Più
    gloss: più
    note: Una nuova parola, messa subito prima di 'pasand hai' per esprimere una preferenza tra due cose già nominate.
    example_gloss: Mi piace di più il tè.
  hi.a1.unit13.lesson02.teach.zyada_pasand_grammar:
    title: Zyada pasand hai = preferire
    gloss: '''X zyada pasand hai'' significa preferire una di due cose: ''mujhe chai zyada pasand hai'' significa ''mi piace di più il tè'' / ''preferisco il tè''.'
    note: 'Un''estensione lessicale, non una nuova regola: ''zyada'' si limita a modificare ''pasand hai'', già noto.'
  hi.a1.unit13.lesson03.teach.review_words:
    title: 'Ripasso: musica, sport, libri'
    gloss: musica, sport/gioco, libri
    note: Un rapido ripasso dei sostantivi chiave di questa unità, necessari per il dialogo e per il biglietto da leggere.
    example_gloss:
    - Mi piace la musica.
    - Questo sport non mi piace.
    - Mi piacciono i libri.
  hi.a1.unit13.lesson03.teach.dialogue.line01:
    title: Arjun chiede della musica
    gloss: Priya, ti piace la musica?
  hi.a1.unit13.lesson03.teach.dialogue.line02:
    title: Priya dice che le piace molto
    gloss: Sì, la musica mi piace molto. E a te?
  hi.a1.unit13.lesson03.teach.dialogue.line03:
    title: Arjun è d'accordo e aggiunge lo sport
    gloss: Anche a me! E mi piace anche lo sport.
  hi.a1.unit13.lesson03.teach.dialogue.line04:
    title: Priya preferisce i libri a questo gioco
    gloss: Bene! Questo gioco non mi piace. Mi piacciono i libri.
  hi.a1.unit13.lesson03.teach.dialogue.line05:
    title: Arjun chiede tè o caffè
    gloss: Va bene. Ti piace il tè o il caffè?
  hi.a1.unit13.lesson03.teach.dialogue.line06:
    title: Priya preferisce il tè
    gloss: Mi piace di più il tè.
  hi.a1.unit13.lesson03.teach.dialogue.line07:
    title: Arjun è d'accordo
    gloss: Benissimo! Anche a me piace il tè.
  hi.a1.unit13.lesson03.teach.dialogue.line08:
    title: Priya chiude il dialogo
    gloss: Va bene! Ci vediamo di nuovo domani?
  hi.a1.unit13.lesson03.teach.chahiye_pasand_zyada_grammar:
    title: Tre schemi collegati
    gloss: 'I tre schemi di questa unità: dopo ''chahiye'' (volere/aver bisogno, unità 6) non va ''hai''; ''pasand hai/hain'' (questa unità) cambia in base al numero della cosa; ''zyada pasand hai'' significa preferire una di due cose.'
    note: Un riepilogo finale che lega insieme tutta la grammatica dell'unità, come la nota di grammatica dell'unità 12 che riunisce il paradigma.
  hi.a1.unit13.lesson03.teach.priya_note:
    title: Il biglietto di Priya
    gloss: Arjun, la musica mi piace molto. Mi piacciono anche i libri. Questo gioco non mi piace. Mi piace di più il tè. - Priya
    note: Un breve biglietto scritto che riprende esattamente i fatti già emersi nel dialogo, senza aggiungere nulla di nuovo.
    glosses:
      संगीत: musica
      बहुत: molto
      पसंद: gradito / che piace
      किताबें: libri
      खेल: gioco
      नहीं: non
      चाय: tè
      ज़्यादा: di più / preferibilmente
