teaching:
  hi.a1.unit27.lesson01.teach.khush_udas_naraz:
    title: Felice, triste e arrabbiato
    gloss: contento, triste, arrabbiato
    note: '*खुश*, *उदास* e *नाराज़* sono parole di base per i sentimenti che si usano con *हूँ* o *है* («sono», «è»); non cambiano al maschile o al femminile.'
    example_gloss:
    - Sono contento.
    - Sono triste.
    - Sono arrabbiato.
  hi.a1.unit27.lesson01.teach.main_khush_hoon:
    title: Dire che si è contenti
    gloss: Sono contento.
    note: '*मैं खुश हूँ* segue lo schema *मैं* + sentimento + *हूँ*, come «io sono ...».'
  hi.a1.unit27.lesson01.teach.main_naraz_naheen:
    title: Contrapporre le emozioni
    gloss: Non sono arrabbiato, sono triste.
    note: '*नहीं* va subito prima di *हूँ*: *नाराज़ नहीं हूँ*. La seconda parte indica poi il vero sentimento.'
  hi.a1.unit27.lesson02.teach.tum_khush_kyon:
    title: Chiedere perché
    gloss: Perché sei contento?
    note: '*क्यों* («perché») va prima della parola principale: *तुम खुश क्यों हो?*. *तुम* è il «tu» informale.'
  hi.a1.unit27.lesson02.teach.main_khush_hoon:
    title: Dare un motivo
    gloss: Sono contento perché ho un nuovo appartamento.
    note: '*क्योंकि* introduce la ragione. *मेरे पास ... है* significa «io ho», e il verbo *है* va alla fine.'
  hi.a1.unit27.lesson02.teach.main_udas_hoon:
    title: Un motivo negativo
    gloss: Sono triste perché piove.
    note: '*बारिश हो रही है* significa «piove» (letteralmente «la pioggia sta avvenendo»).'
  hi.a1.unit27.lesson03.teach.narvas:
    title: Nervoso
    gloss: nervoso
    note: La parola standard per indicare il nervosismo.
    example_gloss: Sono agitato per il mio primo turno.
  hi.a1.unit27.lesson03.teach.main_apnee_pahlee:
    title: Dire per che cosa si è agitati
    gloss: Sono agitato per il mio primo turno.
    note: '*को लेकर* significa «per, riguardo a» e va dopo il nome: *शिफ़्ट को लेकर*. *अपनी* («mia, propria») concorda con *शिफ़्ट*, che è femminile.'
  hi.a1.unit27.lesson03.teach.chinta_mat_karo:
    title: Rassicurare qualcuno
    gloss: Non ti preoccupare.
    note: '*चिंता मत करो* è il «non preoccuparti» amichevole: *मत* + *करो* è l''imperativo di *तुम* con la negazione.'
  hi.a1.unit27.lesson04.teach.arjun_kaisa_mahsoos:
    title: Chiedere come si sente qualcuno
    gloss: Come si sente Arjun?
    note: '*कैसा महसूस कर रहा है* chiede «come si sente». *कैसा* concorda con la persona, quindi per una donna si dice *कैसी*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_mahsoos:
    title: Descrivere come si sente qualcuno
    gloss: Si sente agitato.
    note: 'In hindi qui non c''è una parola separata per «si» riflessivo: *वह नर्वस महसूस कर रहा है* usa semplicemente *वह* e *रहा है*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_kyon:
    title: Chiedere perché qualcuno si sente in un certo modo
    gloss: Perché si sente agitato?
    note: '*क्यों* va subito prima del gruppo verbale: *वह नर्वस क्यों महसूस कर रहा है?*'
  hi.a1.unit27.lesson05.teach.hay_priya_main:
    title: Leggi un messaggio sulle emozioni
    gloss: Ciao Priya, sono un po' nervoso per il mio primo turno da solo. Ma sono anche felice, perché ho un nuovo lavoro e un nuovo appartamento. Credo che andrà tutto bene.
    note: Cerca di capire per che cosa è agitato chi scrive, che cosa lo rende contento e come vede la situazione nel complesso.
    glosses:
      थोड़ा: un po'
      नर्वस: nervoso
      पहली: primo
      शिफ़्ट: turno
      अकेले: da solo
      खुश: contento
      क्योंकि: perché
      नई: nuovo
      नौकरी: lavoro
      नया: nuovo
      फ़्लैट: appartamento
      लगता: pensare
      होगा: 'andare (qui: andrà bene)'
  hi.a1.unit27.lesson06.teach.priya_hay_arjun:
    title: Priya chiede ad Arjun come si sente
    gloss: 'Priya: Ciao Arjun, come ti senti per il tuo primo turno?'
    note: 'Di nuovo *को लेकर*: *अपनी पहली शिफ़्ट को लेकर* («per il tuo primo turno»). *तुम* è informale.'
  hi.a1.unit27.lesson06.teach.arjun_sach_kahoon:
    title: Arjun ammette di essere nervoso
    gloss: 'Arjun: A dire il vero, sono un po'' nervoso.'
    note: '*सच कहूँ तो* («se dico la verità») attenua un''ammissione.'
  hi.a1.unit27.lesson06.teach.priya_chinta_mat:
    title: Priya lo rassicura
    gloss: 'Priya: Non preoccuparti, puoi farcela bene!'
    note: '*तुम यह अच्छे से कर सकते हो* significa «puoi farlo bene», e *अच्छे से* è «bene».'
  hi.a1.unit27.lesson06.teach.arjun_shukriya_isse:
    title: Arjun la ringrazia
    gloss: 'Arjun: Grazie, mi aiuta davvero.'
    note: '*इससे मदद मिलती है* è letteralmente «da questo si riceve aiuto»: ciò che aiuta è marcato con *से*.'
  hi.a1.unit27.lesson06.teach.priya_aur_bad:
    title: Priya prevede come andrà
    gloss: 'Priya: E dopo sarai sicuramente molto felice e orgoglioso.'
    note: '*ज़रूर* («sicuramente») rende la previsione sicura, e *तुम्हें गर्व होगा* significa «proverai orgoglio».'
  hi.a1.unit27.lesson06.teach.arjun_han_mujhe:
    title: Arjun è d'accordo
    gloss: 'Arjun: Sì, lo penso anch''io.'
    note: '*मुझे भी ऐसा ही लगता है* («anche a me sembra così») è il modo naturale per dirsi d''accordo, e *मुझे* indica chi lo sente.'
  hi.a1.unit27.lesson06.teach.arjun_narvas_hai:
    title: 'Pronomi: उसकी'
    gloss: Arjun è nervoso. Priya lo aiuta.
    note: '*उसकी* significa «suo» (di lui o di lei) e concorda con *मदद*, che è femminile, quindi *उसकी मदद करना* è «aiutarlo»; *है* e *करती है* sono i verbi della terza persona.'
