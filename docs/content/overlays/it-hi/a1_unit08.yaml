teaching:
  hi.a1.unit08.lesson01.teach.ghar_school:
    title: Casa, scuola
    gloss: casa, scuola
    note: Due luoghi comuni, usati in tutta l'unità.
    example_gloss:
    - Questa è una casa.
    - Questa è una scuola.
  hi.a1.unit08.lesson01.teach.aspatal_bank:
    title: Ospedale, banca
    gloss: ospedale, banca
    note: Altri due luoghi comuni che potresti dover trovare in un quartiere.
    example_gloss:
    - Questo è un ospedale.
    - Questa è una banca.
  hi.a1.unit08.lesson01.teach.park_station:
    title: Parco, stazione
    gloss: parco, stazione
    note: Gli ultimi due luoghi comuni di questa unità.
    example_gloss:
    - Questo è un parco.
    - Questa è una stazione.
  hi.a1.unit08.lesson01.teach.yahan_wahan:
    title: Qui, lì
    gloss: qui, lì
    note: Una coppia di base per indicare dove si trova qualcosa.
    example_gloss:
    - La scuola è qui.
    - La banca è là.
  hi.a1.unit08.lesson01.teach.school_kahan_hai:
    title: Dov'è la scuola?
    gloss: Dov'è la scuola?
    note: Riprende *kahaan* (dove), già introdotto nell'unità 1, ora per chiedere di un luogo e non della provenienza di una persona.
  hi.a1.unit08.lesson01.teach.school_yahan_hai:
    title: La scuola è qui
    gloss: La scuola è qui.
    note: Una risposta di esempio con *yahaan*.
  hi.a1.unit08.lesson01.teach.bank_kahan_hai:
    title: Dov'è la banca?
    gloss: Dov'è la banca?
    note: Lo stesso schema di domanda, con un luogo diverso.
  hi.a1.unit08.lesson01.teach.bank_wahan_hai:
    title: La banca è lì
    gloss: La banca è lì.
    note: Una risposta di esempio con *wahaan*.
  hi.a1.unit08.lesson02.teach.paas:
    title: Vicino
    gloss: vicino a
    note: 'Presentata qui formalmente per la prima volta: era comparsa solo nelle frasi di esempio dell''unità 2 (*mere paas*, «ho», alla lettera «vicino a me») senza mai essere insegnata come parola a sé.'
    example_gloss: La banca è vicina.
  hi.a1.unit08.lesson02.teach.door:
    title: Lontano
    gloss: lontano
    note: Il contrario di *paas*.
    example_gloss: La stazione è lontana.
  hi.a1.unit08.lesson02.teach.ke_paas_note:
    title: Ke paas
    gloss: '''Ke paas'' significa vicino a un luogo, come in ''school bank ke paas hai'' (la scuola è vicino alla banca). È lo stesso ''paas'' comparso prima in ''mere paas'' (ho), ma lì significava ''in mio possesso'', mentre qui significa ''vicino'': una parola, due usi diversi.'
    note: Una nuova posposizione costruita su una parola già vista, con il senso precedente segnalato esplicitamente perché i due usi non si confondano.
    target_text: '''के पास'' का मतलब है किसी जगह के नज़दीक -- जैसे ''बैंक स्कूल के पास है''। यह वही ''पास'' है जो पहले ''मेरे पास'' (मेरे पास एक किताब है) में आया था, पर वहाँ इसका मतलब था ''मेरे स्वामित्व में'' (avere, possedere), और यहाँ इसका मतलब है ''नज़दीक'' (vicino) -- एक ही शब्द, दो अलग इस्तेमाल।'
  hi.a1.unit08.lesson02.teach.school_bank_ke_paas_hai:
    title: La scuola è vicino alla banca
    gloss: La scuola è vicino alla banca.
    note: Una frase di esempio con *ke paas*.
  hi.a1.unit08.lesson02.teach.samne_peeche:
    title: Davanti, dietro
    gloss: davanti a, dietro a
    note: Un'altra coppia di parole di luogo, usate anch'esse con *ke*.
    example_gloss:
    - L'ospedale è davanti alla stazione.
    - Il parco è dietro la scuola.
  hi.a1.unit08.lesson02.teach.samne_peeche_note:
    title: Samne e peeche
    gloss: '''Samne'' e ''peeche'' si usano con ''ke'', proprio come ''paas'', e sono l''uno l''opposto dell''altro: ''paark school ke peeche hai'' e ''school paark ke samne hai'' descrivono esattamente la stessa situazione reale, solo da due punti di vista diversi.'
    note: 'Lo stesso fatto detto in due modi: un punto di grammatica utile su come sono legate le due parole.'
  hi.a1.unit08.lesson02.teach.school_park_ke_samne_hai:
    title: La scuola è davanti al parco
    gloss: La scuola è davanti al parco.
    note: L'altro lato dello stesso fatto di *paark school ke peeche hai* visto sopra.
  hi.a1.unit08.lesson03.teach.dakghar:
    title: Ufficio postale
    gloss: ufficio postale
    note: Un nuovo luogo comune per il dialogo finale di questa unità.
    example_gloss: L'ufficio postale è vicino alla banca.
  hi.a1.unit08.lesson03.teach.dakghar_kahan_hai:
    title: Dov'è l'ufficio postale?
    gloss: Dov'è l'ufficio postale?
    note: Apre il dialogo finale di questa unità.
  hi.a1.unit08.lesson03.teach.dialogue.line01:
    title: Arjun chiede dell'ufficio postale
    gloss: Arjun chiede a Priya dov'è l'ufficio postale.
    note: Riprende la frase iniziale di questa lezione.
  hi.a1.unit08.lesson03.teach.dialogue.line02:
    title: Priya risponde
    gloss: Priya dice che è vicino alla banca.
    note: Riprende *ke paas* della lezione 2.
  hi.a1.unit08.lesson03.teach.dialogue.line03:
    title: Arjun chiede dell'ospedale
    gloss: Arjun dice «va bene» e chiede dov'è l'ospedale.
    note: Riprende *achchha* (va bene / capisco) dalle unità precedenti.
  hi.a1.unit08.lesson03.teach.dialogue.line04:
    title: Priya risponde
    gloss: Priya dice che l'ospedale è davanti alla stazione.
    note: Riprende *ke samne* della lezione 2.
  hi.a1.unit08.lesson03.teach.dialogue.line05:
    title: Arjun chiede se è lontano
    gloss: 'Arjun chiede: la stazione è lontana?'
    note: Riprende *door* della lezione 2.
  hi.a1.unit08.lesson03.teach.dialogue.line06:
    title: Priya conferma e fa un confronto
    gloss: 'Priya dice sì, un po'' lontano: la banca è vicina.'
    note: 'Introduce *thoda* (un po''), restando coerente: la stazione è lontana mentre la banca resta vicina.'
  hi.a1.unit08.lesson03.teach.dialogue.line07:
    title: Arjun chiede del parco
    gloss: Arjun dice «va bene» e chiede dov'è il parco.
  hi.a1.unit08.lesson03.teach.dialogue.line08:
    title: Priya risponde
    gloss: Priya dice che il parco è dietro la scuola.
    note: Riprende *ke peeche* della lezione 2.
  hi.a1.unit08.lesson03.teach.dialogue.line09:
    title: Arjun ci arriva da solo
    gloss: 'Arjun dice: quindi la scuola è davanti al parco!'
    note: Introduce *to* (quindi / allora) e collega il fatto alla nota di grammatica su *samne*/*peeche* della lezione 2.
  hi.a1.unit08.lesson03.teach.dialogue.line10:
    title: Priya conferma
    gloss: Priya dice sì, è giusto!
    note: Introduce *sahi* (giusto / corretto).
  hi.a1.unit08.lesson03.teach.dialogue.line11:
    title: Arjun ringrazia Priya
    gloss: 'Arjun dice: grazie mille, Priya!'
    note: Riprende *bahut* (molto) e *shukriya* (grazie) delle unità precedenti.
  hi.a1.unit08.lesson03.teach.dialogue.line12:
    title: Priya conclude
    gloss: 'Priya dice: di nulla! Ci vediamo.'
    note: Riprende le formule di chiusura abituali di questo corso, già viste nelle unità precedenti.
