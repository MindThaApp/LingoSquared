teaching:
  hi.a1.unit07.lesson01.teach.dukaan_bazaar:
    title: Negozio, mercato
    gloss: negozio, mercato
    note: Due luoghi comuni in cui fare acquisti, usati in tutta l'unità.
    example_gloss:
    - Questo è un negozio.
    - Questo è un mercato.
  hi.a1.unit07.lesson01.teach.dukaandaar:
    title: Negoziante
    gloss: negoziante
    note: 'Un nuovo personaggio di questa unità: la persona che gestisce il negozio, a cui ci si rivolge con aap perché è un estraneo.'
    example_gloss: Questo è il negoziante.
  hi.a1.unit07.lesson01.teach.kameez_bag_topi:
    title: Camicia, borsa, cappello
    gloss: camicia, borsa, cappello
    note: Tre oggetti comuni negli acquisti, usati in tutta l'unità per esercitare lo schema *mujhe ... chahiye* dell'unità sul cibo.
    example_gloss:
    - Vorrei una camicia.
    - Vorrei una borsa.
    - Vorrei un cappello.
  hi.a1.unit07.lesson01.teach.mujhe_yah_chahiye:
    title: Vorrei questo
    gloss: Vorrei questo.
    note: 'Una frase di uso generale per dire che si desidera un oggetto: riprende *mujhe ... chahiye* dell''unità sul cibo con *yah* («questo»).'
  hi.a1.unit07.lesson01.teach.ji:
    title: Ji (titolo di rispetto)
    gloss: particella di cortesia e rispetto, come aggiungere «signore» o «signora»
    note: Si aggiunge dopo un nome o un titolo per essere più cortesi; è comune quando ci si rivolge a un estraneo, come un negoziante.
    example_gloss: Buongiorno, signor negoziante.
  hi.a1.unit07.lesson01.teach.sirf:
    title: Solo
    gloss: solo, soltanto
    note: Si usa per dire che vuoi una sola cosa, non più cose.
    example_gloss: Vorrei solo una camicia.
  hi.a1.unit07.lesson01.teach.aapko_aur_kuch_chahiye:
    title: Desidera altro? (formale)
    gloss: Desidera altro?
    note: La tipica domanda formale che fa un negoziante dopo aver preso parte di un ordine; riprende *aapko* e *chahiye*.
  hi.a1.unit07.lesson01.teach.ji_nahin_sirf_yah:
    title: No, solo questo
    gloss: No, solo questo.
    note: Un modo naturale e cortese per rifiutare altri articoli; riprende *ji* e *sirf* di questa lezione.
  hi.a1.unit07.lesson01.teach.tumhein_kya_chahiye_bataao:
    title: Dimmi che cosa vuoi
    gloss: Dimmi che cosa vuoi.
    note: La frase informale che questo corso usa per invitarti a rispondere a voce, come nell'unità sul cibo.
  hi.a1.unit07.lesson02.teach.keemat:
    title: Prezzo
    gloss: prezzo
    note: Già vista nell'unità 2 con numeri e prezzi, qui è ripresa nel contesto degli acquisti.
    example_gloss: Quanto costa?
  hi.a1.unit07.lesson02.teach.rupaye:
    title: Rupie
    gloss: rupie
    note: La parola per la valuta, già vista nell'unità 2, ora esercitata con due prezzi diversi.
    example_gloss:
    - Costa duecento rupie.
    - Costa cinquecento rupie.
  hi.a1.unit07.lesson02.teach.iski_keemat_kya_hai:
    title: Quanto costa?
    gloss: Quanto costa?
    note: Il modo standard per chiedere un prezzo, ripreso dall'unità 2.
  hi.a1.unit07.lesson02.teach.iski_keemat_bees_rupaye_hai:
    title: Costa duecento rupie
    gloss: Costa duecento rupie.
    note: Una possibile risposta alla domanda sul prezzo vista sopra.
  hi.a1.unit07.lesson02.teach.kitne_ka_ki_note:
    title: Kitne ka / kitne ki
    gloss: '''Yah kitne ka hai?'' si usa per le cose maschili e ''Yah kitne ki hai?'' per quelle femminili -- *kitne* non cambia mai -- cambia solo *ka/ki*, la stessa alternanza -a/-i che già conosci da *mera/meri* e *tumhara/tumhari*.'
    note: 'Un secondo modo, molto comune, di chiedere il prezzo, basato sulla stessa concordanza di genere dei possessivi: cambia solo la particella ka/ki, non kitne.'
  hi.a1.unit07.lesson02.teach.yeh_kitne_ka_hai:
    title: Quanto costa? (maschile)
    gloss: Quanto costa questo?
    note: Si usa per un oggetto maschile, come una borsa.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ki_hai:
    title: Quanto costa? (femminile)
    gloss: Quanto costa questo?
    note: Si usa per un oggetto femminile, come un cappello.
  hi.a1.unit07.lesson02.teach.sasta_mehenga:
    title: Economico, caro
    gloss: economico, caro
    note: Una coppia di aggettivi molto comune per commentare un prezzo; qui sono indicate le forme maschili.
    example_gloss:
    - Questa borsa è economica.
    - Questa borsa è cara.
  hi.a1.unit07.lesson02.teach.sasti_mehengi_note:
    title: Sasti e mehengi
    gloss: Anche 'sasta' e 'mehenga' cambiano tra maschile e femminile, come 'mera/meri' -- con le parole femminili si dice 'sasti' e 'mehengi', come in 'yah topi sasti hai' (questo cappello è economico) o 'yah kameez mehengi hai' (questa camicia è cara).
    note: Un altro caso concreto della stessa concordanza di genere che questo corso segnala di continuo.
  hi.a1.unit07.lesson03.teach.khareedna:
    title: Comprare
    gloss: comprare
    note: Riprende la costruzione 'verbo + na chahta/chahti hun' (voglio...) vista nell'unità 1 per imparare lo yoga, ora applicata agli acquisti.
    example_gloss:
    - Voglio comprare questa camicia.
    - Voglio comprare questo cappello.
  hi.a1.unit07.lesson03.teach.chalo_kuch_khareedte_hain:
    title: Compriamo qualcosa!
    gloss: Compriamo qualcosa!
    note: Un modo amichevole e fisso per proporre di fare acquisti insieme; apre il dialogo finale di questa unità, come 'chalo, kuch khate hain!' nell'unità sul cibo.
  hi.a1.unit07.lesson03.teach.dialogue.line01:
    title: Arjun propone di fare acquisti
    gloss: 'Arjun dice: compriamo qualcosa!'
    note: Riprende la frase iniziale di questa unità.
  hi.a1.unit07.lesson03.teach.dialogue.line02:
    title: Priya è d'accordo
    gloss: 'Priya accetta e si chiede: una camicia o un cappello?'
    note: Introduce *ya* (o) per proporre una scelta tra due articoli.
  hi.a1.unit07.lesson03.teach.dialogue.line03:
    title: Il negoziante li saluta
    gloss: Il negoziante saluta e chiede che cosa desiderano.
    note: Il saluto formale con aap, che riprende *aapko kya chahiye* della lezione 1.
  hi.a1.unit07.lesson03.teach.dialogue.line04:
    title: Priya chiede di una camicia
    gloss: Priya saluta cortesemente il negoziante e chiede una camicia, poi ne chiede il prezzo.
    note: Combina *ji*, *mujhe ... chahiye* e *iski keemat kya hai*.
  hi.a1.unit07.lesson03.teach.dialogue.line05:
    title: Il negoziante dice il prezzo
    gloss: Il negoziante dice che costa trecento rupie.
    note: Riprende lo schema *iski keemat ... rupaye hai* con un numero nuovo.
  hi.a1.unit07.lesson03.teach.dialogue.line06:
    title: Priya reagisce e decide
    gloss: 'Priya dice: trecento rupie? È economica! Voglio questa camicia.'
    note: Riprende *sasti* dalla nota di grammatica della lezione 2.
  hi.a1.unit07.lesson03.teach.dialogue.line07:
    title: Arjun chiede di un cappello
    gloss: Arjun dice che vorrebbe un cappello e chiede quanto costa.
    note: Riprende la forma femminile *kitne ki hai* della lezione 2.
  hi.a1.unit07.lesson03.teach.dialogue.line08:
    title: Il negoziante risponde
    gloss: Il negoziante dice che il cappello costa cinquecento rupie.
    note: Riprende *paanch sau* (cinquecento) dalla lezione 2.
  hi.a1.unit07.lesson03.teach.dialogue.line09:
    title: Arjun reagisce e decide comunque di comprare
    gloss: 'Arjun dice: cinquecento rupie? È caro! Va bene, prendo questo cappello.'
    note: Riprende *mehengi* dalla nota di grammatica della lezione 2, poi decide di comprarlo comunque.
  hi.a1.unit07.lesson03.teach.dialogue.line10:
    title: Il negoziante chiede se basta così
    gloss: 'Il negoziante dice: bene, desidera altro?'
    note: Riprende *aapko aur kuch chahiye* dalla lezione 1.
  hi.a1.unit07.lesson03.teach.dialogue.line11:
    title: Priya conclude l'ordine
    gloss: 'Priya dice: no, solo questo, grazie!'
    note: Riprende *ji nahin, sirf yah* dalla lezione 1, più *shukriya*.
  hi.a1.unit07.lesson03.teach.dialogue.line12:
    title: Il negoziante saluta
    gloss: 'Il negoziante dice: grazie, a presto!'
    note: Riprende la formula di chiusura abituale di questo corso.
