  hi.a1.unit44.lesson03.teach.kisee_mausam_ke:
    title: Dare un'opinione su una stagione
    gloss: '*मुझे* + stagione + qualità + *लगता है* serve a dire che cosa pensi di una stagione: *मुझे गर्मी अच्छी लगती है* (mi piace l''estate).'
    note: '*लगता* concorda con la stagione che ti piace, non con te: *पतझड़* è maschile (*लगता*), *गर्मी* e *सर्दी* sono femminili (*लगती*), e *अच्छा* cambia allo stesso modo (*अच्छी*).'
