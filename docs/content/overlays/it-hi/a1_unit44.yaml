    gloss: 'Vikram: Ciao a tutti! Quale stagione trovi bella, Priya?'
  hi.a1.unit44.lesson06.teach.priya_mujhe_sardee:
    title: Priya risponde
    gloss: 'Priya: Mi piace l''inverno. In inverno pattiniamo.'
  hi.a1.unit44.lesson06.teach.vikram_mujhe_patjhar:
    title: Vikram risponde
    gloss: 'Vikram: Trovo bello l''autunno. L''autunno è tranquillo.'
