  hi.a1.unit44.lesson05.teach.abhee_vasant_hai:
    title: Una conversazione sulle stagioni
    gloss: 'Adesso è primavera. I fiori sono bellissimi. Nina chiede: Quale stagione trovi bella? Arjun dice: Mi piace l''estate. In estate nuotiamo. Priya dice: Mi piace l''inverno. In inverno pattiniamo.'
    note: Riassume la conversazione al caffè linguistico riportando le parole dirette dei personaggi.
    glosses:
      वसंत: primavera
      फूल: fiori
      सुंदर: belli
      पूछती: chiede
      मौसम: stagione
      लगता: sembra / appare (a me)
      कहता: dice
      गर्मी: estate
      अच्छी: bella, piacevole (femm.)
      तैरते: nuotiamo
      सर्दी: inverno
      स्केटिंग: pattiniamo
