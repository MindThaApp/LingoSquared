teaching:
  hi.a1.unit03.lesson01.teach.aaj:
    title: Oggi
    gloss: oggi
    note: La parola che riutilizzerai in quasi ogni frase di questa lezione.
    example_gloss: Oggi il tempo è bello.
  hi.a1.unit03.lesson01.teach.somvar:
    title: lunedì
    gloss: lunedì
    note: 'Deriva da सोम (la Luna): anche in italiano «lunedì» è il giorno della Luna.'
    example_gloss: La lezione di yoga è lunedì.
  hi.a1.unit03.lesson01.teach.mangalvar:
    title: Martedì
    gloss: martedì
    note: Deriva da मंगल (Marte), lo stesso schema che seguono quasi tutti i nomi dei giorni in hindi.
    example_gloss: Oggi è martedì.
  hi.a1.unit03.lesson01.teach.budhvar:
    title: Mercoledì
    gloss: mercoledì
    note: Deriva da बुध (Mercurio).
    example_gloss: Oggi è mercoledì.
  hi.a1.unit03.lesson01.teach.guruvar:
    title: Giovedì
    gloss: giovedì
    note: Deriva da गुरु (Giove).
    example_gloss: Oggi è giovedì.
  hi.a1.unit03.lesson01.teach.shukravar:
    title: Venerdì
    gloss: venerdì
    note: Deriva da शुक्र (Venere).
    example_gloss: Venerdì non c'è lezione di yoga.
  hi.a1.unit03.lesson01.teach.shanivar:
    title: sabato
    gloss: sabato
    note: Deriva da शनि (Saturno).
    example_gloss: Oggi è sabato.
  hi.a1.unit03.lesson01.teach.ravivar:
    title: domenica
    gloss: domenica
    note: Deriva da रवि, un nome sanscrito del Sole.
    example_gloss: Oggi è domenica.
  hi.a1.unit03.lesson01.teach.kaun_sa_din_hai:
    title: Chiedere che giorno è
    gloss: Che giorno è oggi?
    note: '*Kaun sa* («quale») concorda con il sostantivo maschile *din* («giorno»): con i sostantivi femminili vedrai più avanti la forma femminile, *kaun si*.'
  hi.a1.unit03.lesson01.teach.yoga_class_monday:
    title: Dire che un evento si svolge in un certo giorno
    gloss: La lezione di yoga è lunedì.
    note: '*Ko* dopo il nome di un giorno corrisponde a «di/il» in frasi come «lunedì»: *somvar ko* è «lunedì», e lo schema è lo stesso per tutti i giorni della settimana.'
  hi.a1.unit03.lesson01.teach.no_class_friday:
    title: Dire che un evento non si svolge in un certo giorno
    gloss: Venerdì non c'è lezione di yoga.
    note: Nahin nega la frase; ko continua a indicare il giorno, qui messo all'inizio per dargli enfasi.
  hi.a1.unit03.lesson02.teach.jan_feb_mar:
    title: Gennaio, febbraio, marzo
    gloss: gennaio, febbraio, marzo
    note: 'I nomi dei mesi in hindi sono per lo più presi in prestito e si riconoscono subito, una volta capito lo schema: nessuna grammatica nuova, solo vocabolario.'
    example_gloss:
    - Il mio compleanno è a gennaio.
    - La prossima festa è a febbraio.
    - Il mio compleanno è a marzo.
  hi.a1.unit03.lesson02.teach.apr_may_jun:
    title: Aprile, maggio, giugno
    gloss: aprile, maggio, giugno
    note: Lo stesso schema riconoscibile dei primi tre mesi.
    example_gloss:
    - La prossima festa è ad aprile.
    - Il mio compleanno è a maggio.
    - La prossima festa è a giugno.
  hi.a1.unit03.lesson02.teach.jul_aug_sep:
    title: Luglio, agosto, settembre
    gloss: luglio, agosto, settembre
    note: Qui sitambar è scritto con l'anusvara (सितंबर); anche la grafia con la mezza m (सितम्बर) è diffusa e altrettanto corretta.
    example_gloss:
    - Il mio compleanno è a luglio.
    - La prossima festa è ad agosto.
    - Il mio compleanno è a settembre.
  hi.a1.unit03.lesson02.teach.oct_nov_dec:
    title: Ottobre, novembre, dicembre
    gloss: ottobre, novembre, dicembre
    note: Navambar e disambar usano la stessa grafia con l'anusvara di sitambar; anche नवम्बर e दिसम्बर (con la mezza m) sono diffusi e altrettanto corretti.
    example_gloss:
    - La prossima festa è a ottobre.
    - Il mio compleanno è a novembre.
    - La prossima festa è a dicembre.
  hi.a1.unit03.lesson02.teach.tareekh:
    title: Data
    gloss: data
    note: '*Tareekh* è un sostantivo femminile: la sua parola interrogativa prende la forma femminile (*kitni tareekh*, mai *kitna tareekh*), lo stesso schema di concordanza visto nell''unità 2 con *keemat* e *umra*.'
    example_gloss: Oggi è il tre.
  hi.a1.unit03.lesson02.teach.mein_postposition:
    title: In (con un mese)
    gloss: a / in -- si usa con il nome di un mese
    note: '*Mein* indica un mese come *ko* indica un giorno: *janvari mein* significa «a gennaio», mai *janvari ko*.'
  hi.a1.unit03.lesson02.teach.aaj_kitni_tareekh_hai:
    title: Chiedere la data
    gloss: Che data è oggi?
    note: 'Letteralmente «quanti è oggi della data»: kitni concorda con il femminile tareekh.'
  hi.a1.unit03.lesson02.teach.aaj_teen_tareekh_hai:
    title: Dire la data con il solo numero
    gloss: Oggi è il tre.
    note: 'Come in italiano («è il tre»), l''hindi indica la data con un semplice numero cardinale (*teen*, «tre»): non c''è una «parola della data» da imparare, bastano i numeri che già conosci.'
  hi.a1.unit03.lesson02.teach.aaj_teen_january_hai:
    title: Dire la data con il mese
    gloss: Oggi è il tre gennaio.
    note: Lo stesso schema con il numero cardinale, ora con il nome del mese aggiunto dopo.
  hi.a1.unit03.lesson03.teach.kab:
    title: Quando
    gloss: quando
    note: Una parola interrogativa semplice e molto frequente.
    example_gloss: Quando è la prossima lezione?
  hi.a1.unit03.lesson03.teach.agli:
    title: Prossimo
    gloss: prossimo
    note: '*Agli* è la forma femminile: nell''hindi di tutti i giorni *class* (क्लास) è trattata come sostantivo femminile, quindi prende *agli* e non il maschile *agla*.'
    example_gloss: La prossima lezione è martedì.
  hi.a1.unit03.lesson03.teach.das_reprise:
    title: Dieci
    gloss: dieci
    note: 'Già vista nell''unità 2: serve qui per una vera data.'
    example_gloss: La prossima lezione è il dieci.
  hi.a1.unit03.lesson03.teach.janmadin:
    title: Compleanno
    gloss: compleanno
    note: 'Un sostantivo maschile: mera janmadin, mai meri janmadin.'
    example_gloss: Il mio compleanno è a dicembre.
  hi.a1.unit03.lesson03.teach.tumhara_janmadin_kab_hai:
    title: Chiedere a qualcuno quando è il compleanno, in modo informale
    gloss: Quando è il tuo compleanno? (informale)
    note: Tumhara concorda con il maschile janmadin.
  hi.a1.unit03.lesson03.teach.mera_janmadin_january_mein_hai:
    title: Dire quando è il tuo compleanno
    gloss: Il mio compleanno è a gennaio.
    note: La risposta completa più naturale a Tumhara janmadin kab hai?
  hi.a1.unit03.lesson03.teach.agli_class_kab_hai:
    title: Chiedere quando è la prossima lezione
    gloss: Quando è la prossima lezione?
    note: Unisce agli (femminile, concorda con class) a kab.
  hi.a1.unit03.lesson03.teach.agli_class_mangalvar_das_march:
    title: Dire giorno e data completi
    gloss: La prossima lezione è martedì 10 marzo.
    note: 'Giorno della settimana e data insieme, con lo stesso ordine dell''italiano: prima il giorno, poi il numero e il mese.'
  hi.a1.unit03.lesson03.teach.dialogue.line01:
    title: Arjun chiede della prossima lezione
    gloss: Arjun chiede quando è la prossima lezione di yoga.
    note: Riprende esattamente la domanda di questa lezione, con yog aggiunto per chiarezza.
  hi.a1.unit03.lesson03.teach.dialogue.line02:
    title: Priya dice giorno e data
    gloss: Priya dice che la prossima lezione è martedì 10 marzo.
    note: Riprende esattamente la frase con giorno e data di questa lezione.
  hi.a1.unit03.lesson03.teach.dialogue.line03:
    title: Arjun la ringrazia
    gloss: 'Arjun dice: va bene, grazie.'
    note: Theek hai e shukriya riprendono entrambi il vocabolario dell'unità 1.
  hi.a1.unit03.lesson03.teach.dialogue.line04:
    title: Priya risponde
    gloss: Priya dice che non c'è problema.
    note: Koi baat nahin è un modo molto comune e naturale per dire «prego» o «nessun problema».
  hi.a1.unit03.lesson03.teach.dialogue.line05:
    title: Arjun chiede a Priya quando è il suo compleanno
    gloss: Arjun chiede a Priya quando è il suo compleanno.
    note: Riprende esattamente la domanda informale sul compleanno di questa lezione.
  hi.a1.unit03.lesson03.teach.dialogue.line06:
    title: Priya risponde
    gloss: Priya dice che il suo compleanno è a gennaio.
    note: Riprende esattamente la frase di risposta di questa lezione.
  hi.a1.unit03.lesson03.teach.dialogue.line07:
    title: Arjun reagisce e dice il suo
    gloss: Arjun reagisce con interesse, poi dice che il suo compleanno è a dicembre.
    note: Accha riprende il vocabolario dell'unità 1; dicembre era già stato presentato nella lezione 2 di questa unità.
  hi.a1.unit03.lesson03.teach.dialogue.line08:
    title: Priya chiude la conversazione
    gloss: Priya è d'accordo e saluta con un «a presto» informale.
    note: Theek hai e phir milte hain riprendono entrambi il vocabolario di saluto dell'unità 1.
