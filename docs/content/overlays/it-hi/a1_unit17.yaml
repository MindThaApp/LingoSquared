teaching:
  hi.a1.unit17.lesson01.teach.tum_tumhara_kya_review:
    title: 'Ripasso: tu, tuo, che cosa'
    gloss: tu (informale), tuo (informale), che cosa
    note: Un breve ripasso delle parole che servono per chiedere a un amico che lavoro fa.
    example_gloss: Come ti chiami?
  hi.a1.unit17.lesson01.teach.arjun_priya_review:
    title: 'Ripasso: Arjun, Priya'
    gloss: Arjun, Priya
    note: Un promemoria dei nomi dei due personaggi, prima che questa lezione li usi per ancorare le domande al genere.
    example_gloss:
    - Mi chiamo Arjun.
    - Mi chiamo Priya.
  hi.a1.unit17.lesson01.teach.copula_review:
    title: 'Ripasso: io, sono, è, sei'
    gloss: io, sono, è, sei (tu, informale)
    note: Il piccolo insieme completo delle forme del verbo «essere» necessario per le frasi di identità di questa unità.
    example_gloss:
    - Stai bene?
    - Sto bene.
  hi.a1.unit17.lesson01.teach.kaam_review:
    title: 'Ripasso: lavoro'
    gloss: lavoro
    note: Introdotta nelle unità 10/11 e qui ripresa come parola-tema di tutta l'unità.
    example_gloss: Ho da lavorare.
  hi.a1.unit17.lesson01.teach.karte_karti_karta_verb:
    title: Fai (tu, uomo / tu, donna / io, uomo)
    gloss: fai (tu, uomo, informale), fai (tu, donna, informale), faccio (io, uomo)
    note: Estende al verbo *karna* (fare) la regola di concordanza -ta/-ti/-te già vista nell'unità 10 (e nell'unità 1 in *kya tum yog karti ho?*).
    example_gloss:
    - Che cosa fai?
    - Faccio colazione.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karte_ho_phrase:
    title: Che lavoro fai? (a un uomo)
    gloss: Che lavoro fai?
    note: La domanda con cui si apre questa lezione, rivolta a un amico.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karti_ho_phrase:
    title: Che lavoro fai? (a una donna)
    gloss: Che lavoro fai?
    note: 'La stessa domanda, rivolta a un''amica: cambia solo la desinenza del verbo.'
  hi.a1.unit17.lesson01.teach.shikshak_shikshika:
    title: Insegnante (uomo / donna)
    gloss: insegnante (uomo), insegnante (donna)
    note: 'Una nuova coppia di nomi di professione. A differenza della maggior parte dei nomi visti finora, questo cambia in base al genere di CHI PARLA: vedi la nota di grammatica di questa lezione.'
    example_gloss:
    - Sono un insegnante.
    - Sono un'insegnante.
  hi.a1.unit17.lesson01.teach.grammar_occupation_gender:
    title: Mein + professione + hoon
    gloss: '''Mein + professione + hoon'' indica un lavoro: è la solita struttura ''mein...hoon'' dell''unità 1. Alcune professioni cambiano in base al genere di chi parla: ''shikshak'' (uomo), ''shikshika'' (donna), proprio come la desinenza verbale -ta/-ti nell''unità 10. ''Doctor'' e ''engineer'' non cambiano: la parola è la stessa per entrambi i generi.'
    note: Spiega apertamente la distinzione tra nomi che concordano con il genere e prestiti invariabili, prima che gli esercizi ne facciano uso.
  hi.a1.unit17.lesson01.teach.doctor_review:
    title: 'Ripasso: medico'
    gloss: medico
    note: Introdotta nell'unità 16 e qui ripresa come professione invariabile rispetto al genere.
    example_gloss: Lui/lei è medico.
  hi.a1.unit17.lesson01.teach.mein_doctor_hoon_phrase:
    title: Sono medico.
    gloss: Sono medico.
    note: La struttura di identità applicata a una parola già vista.
  hi.a1.unit17.lesson01.teach.engineer:
    title: Ingegnere
    gloss: ingegnere
    note: Un nuovo nome di professione, invariabile rispetto al genere come *doctor*.
    example_gloss: Lui/lei è ingegnere.
  hi.a1.unit17.lesson01.teach.mein_engineer_hoon_phrase:
    title: Sono ingegnere.
    gloss: Sono ingegnere.
    note: Lo schema per dire chi si è, applicato alla seconda nuova professione di questa lezione.
  hi.a1.unit17.lesson02.teach.kahan_review:
    title: 'Ripasso: dove'
    gloss: dove
    note: 'Già visto nell''unità 1: qui si riutilizza per chiedere di un luogo di lavoro.'
    example_gloss: Dov'è l'ospedale?
  hi.a1.unit17.lesson02.teach.mein_review:
    title: 'Ripasso: in / a'
    gloss: in / a
    note: 'Già visto nell''unità 1: qui si riutilizza per indicare un luogo di lavoro.'
    example_gloss: Vivo a Londra.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karte_ho_phrase:
    title: Dove lavori? (a un uomo)
    gloss: Dove lavori?
    note: La domanda con cui si apre questa lezione, rivolta a un amico.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karti_ho_phrase:
    title: Dove lavori? (a una donna)
    gloss: Dove lavori?
    note: La stessa domanda, rivolta a un'amica.
  hi.a1.unit17.lesson02.teach.school_review:
    title: 'Ripasso: scuola'
    gloss: scuola
    note: 'Già vista nell''unità 8: è il primo luogo di lavoro di questa lezione.'
    example_gloss: Lavoro a scuola (parla una donna).
  hi.a1.unit17.lesson02.teach.mein_school_mein_kaam_karti_hoon_phrase:
    title: Lavoro a scuola.
    gloss: Lavoro a scuola.
    note: Lo schema del luogo di lavoro applicato alla scuola, al femminile.
  hi.a1.unit17.lesson02.teach.hospital_review:
    title: 'Ripasso: ospedale'
    gloss: ospedale
    note: 'Già visto nell''unità 8: è il secondo luogo di lavoro di questa lezione, abbinato alla professione di medico.'
    example_gloss: Il medico lavora in ospedale.
  hi.a1.unit17.lesson02.teach.daftar:
    title: Ufficio
    gloss: ufficio
    note: 'Un sostantivo nuovo: il terzo luogo di lavoro di questa lezione, abbinato alla professione di ingegnere.'
    example_gloss: Lavoro in ufficio (parla un uomo).
  hi.a1.unit17.lesson02.teach.mein_daftar_mein_kaam_karta_hoon_phrase:
    title: Lavoro in ufficio.
    gloss: Lavoro in ufficio.
    note: Lo schema del luogo di lavoro applicato all'ufficio, al maschile.
  hi.a1.unit17.lesson02.teach.grammar_workplace:
    title: Luogo + mein + kaam karta/karti hoon
    gloss: '''[Luogo] + mein + kaam karta/karti hoon'' unisce tre elementi già noti: ''mein'' (unità 1, ''London mein rehta hoon''), ''kaam'' (unità 10/11) e la forma -ta/-ti/-te di ''karna'' (il ''nashta karta hoon'' dell''unità 10 e il ''kya tum yog karti ho?'' dell''unità 1). Non è una grammatica nuova: sono i tre elementi uniti per la prima volta in un''unica frase.'
    note: Richiama ogni elemento già studiato indicando l'unità, prima di unirli, come in tutte le note di grammatica precedenti.
  hi.a1.unit17.lesson03.teach.roz_review:
    title: 'Ripasso: ogni giorno'
    gloss: ogni giorno
    note: 'Già visto nell''unità 10: qui si riutilizza per descrivere la routine lavorativa quotidiana.'
    example_gloss: Lavoro ogni giorno.
  hi.a1.unit17.lesson03.teach.jaana_forms_review:
    title: 'Ripasso: andare (tu, donna / tu, uomo / io, uomo)'
    gloss: vai (tu, donna, informale), vai (tu, uomo, informale), vado (io, uomo)
    note: Le forme in -ta/-ti/-te di *jana* (andare), già presentate nell'unità 10, qui riutilizzate per il tragitto quotidiano verso il lavoro.
    example_gloss:
    - Vado a scuola ogni giorno (parla una donna).
    - Vai in ufficio ogni giorno? (a un uomo)
  hi.a1.unit17.lesson03.teach.bhi_haan_review:
    title: 'Ripasso: anche, sì'
    gloss: anche, sì
    note: 'Entrambe già viste (unità 1 e unità 1/6/13): qui si riutilizzano nel dialogo della lezione.'
    example_gloss: Sì, è piaciuto anche a me.
  hi.a1.unit17.lesson03.teach.dialogue.line01:
    title: Arjun chiede a Priya del suo lavoro
    gloss: Priya, che lavoro fai?
  hi.a1.unit17.lesson03.teach.dialogue.line02:
    title: Priya dice di essere insegnante in una scuola
    gloss: Sono insegnante. Lavoro in una scuola.
  hi.a1.unit17.lesson03.teach.dialogue.line03:
    title: Arjun chiede se va a scuola ogni giorno
    gloss: Bene! Vai a scuola ogni giorno?
  hi.a1.unit17.lesson03.teach.dialogue.line04:
    title: Priya conferma e rivolge ad Arjun la stessa domanda
    gloss: Sì, vado a scuola ogni giorno. Che lavoro fai?
  hi.a1.unit17.lesson03.teach.dialogue.line05:
    title: Arjun dice di essere ingegnere in un ufficio
    gloss: Sono ingegnere. Lavoro in un ufficio.
  hi.a1.unit17.lesson03.teach.dialogue.line06:
    title: Priya chiede se anche lui va in ufficio ogni giorno
    gloss: Benissimo! Anche tu vai in ufficio ogni giorno?
  hi.a1.unit17.lesson03.teach.dialogue.line07:
    title: Arjun conferma
    gloss: Sì, vado in ufficio ogni giorno.
  hi.a1.unit17.lesson03.teach.dialogue.line08:
    title: Priya lo ringrazia
    gloss: Va bene, grazie.
  hi.a1.unit17.lesson03.teach.grammar_summary:
    title: Le tre regole principali
    gloss: 'Le tre regole principali di questa unità: (1) ''mein + professione + hoon'' indica un mestiere (es. ''mein shikshika hoon''), e alcune professioni cambiano in base al genere di chi parla; (2) ''[luogo] + mein + kaam karta/karti hoon'' indica il luogo di lavoro (es. ''mein daftar mein kaam karta hoon''); (3) ''roz [luogo] jata/jati hoon'' indica un''abitudine quotidiana, con la stessa regola -ta/-ti dell''unità 10.'
    note: Un riepilogo finale che riunisce la grammatica dell'intera unità, come la nota che chiude i paradigmi delle unità 15 e 16.
  hi.a1.unit17.lesson03.teach.work_profile_reading:
    title: Lettura di un breve profilo
    gloss: Priya è insegnante. Lavora in una scuola. Arjun è ingegnere. Lavora in un ufficio.
    note: 'Un profilo breve e diretto che riprende esattamente i fatti già emersi nel dialogo, senza aggiungere nulla: serve proprio all''obiettivo di leggere un breve profilo lavorativo.'
    glosses:
      शिक्षिका: insegnante (donna)
      स्कूल: scuola
      काम: lavorare
      करती: fa / lavora (femminile, da करना)
      इंजीनियर: ingegnere
      दफ़्तर: ufficio
      करता: fa / lavora (maschile, da करना)
