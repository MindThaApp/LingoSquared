teaching:
  hi.a1.unit09.lesson01.teach.review_places:
    title: 'Ripasso: i luoghi'
    gloss: banca, scuola, ospedale, parco, stazione, ufficio postale
    note: 'Un rapido ripasso delle parole di luogo dell''unità precedente: in questa unità le useremo spesso.'
    example_gloss:
    - La banca è qui.
    - L'ufficio postale è vicino alla banca.
  hi.a1.unit09.lesson01.teach.review_function_words:
    title: 'Ripasso: è, dove, qui, là, da, di, va bene'
    gloss: è, dove, qui, là, da, di, va bene
    note: Un rapido ripasso di piccole parole funzionali delle unità precedenti, che gli esercizi di questa unità riprendono.
    example_gloss:
    - Dov'è la banca?
    - Il parco è là.
  hi.a1.unit09.lesson01.teach.seedhe_baaen_daaen:
    title: Dritto, a sinistra, a destra
    gloss: dritto, a sinistra, a destra
    note: Le tre parole di direzione fondamentali di questa unità.
    example_gloss:
    - Vai dritto.
    - Gira a sinistra.
  hi.a1.unit09.lesson01.teach.jao_muro:
    title: Vai!, gira!
    gloss: vai!, gira! (imperativo informale)
    note: 'Imperativi alla forma tum: il registro naturale tra due amici che si danno indicazioni.'
    example_gloss:
    - Vai dritto.
    - Gira a destra.
  hi.a1.unit09.lesson01.teach.yahan_se_seedhe_jao:
    title: Vai dritto da qui
    gloss: Vai dritto da qui.
    note: Unisce le parole nuove di questa lezione a 'yahaan se' (da qui).
  hi.a1.unit09.lesson01.teach.baaen_muro_phrase:
    title: Girare a sinistra
    gloss: Gira a sinistra.
    note: Un comando a sé stante, pronto da usare così.
  hi.a1.unit09.lesson01.teach.daaen_muro_phrase:
    title: Girare a destra
    gloss: Gira a destra.
    note: Il comando speculare di 'baaen muro'.
  hi.a1.unit09.lesson01.teach.imperative_note:
    title: La desinenza -o dell'imperativo
    gloss: '''Jaao'' e ''muro'' sono imperativi alla forma tum, come ''bataao'' e ''gino'': finiscono tutti in ''-o''.'
    note: Mostra lo schema comune dell'imperativo informale, già visto in due parole delle unità precedenti (bataao nell'unità 7, gino nell'unità 2).
  hi.a1.unit09.lesson02.teach.bank_kaise_jaun:
    title: Come si arriva alla banca?
    gloss: Come arrivo in banca?
    note: La domanda base per chiedere la strada, nella forma della prima persona «devo andare?».
  hi.a1.unit09.lesson02.teach.tak:
    title: Fino a
    gloss: fino a
    note: Già visto nell'unità 2 per contare ('zero se das tak'); qui è ripreso nel suo senso spaziale, altrettanto reale.
    example_gloss: Vai dritto fino alla banca.
  hi.a1.unit09.lesson02.teach.bank_tak_seedhe_jao:
    title: Vai dritto fino alla banca
    gloss: Vai dritto fino alla banca.
    note: Una frase d'esempio con 'tak' in senso spaziale.
  hi.a1.unit09.lesson02.teach.pahle_phir:
    title: Prima, poi
    gloss: prima, poi
    note: Una coppia di parole che serve a mettere in sequenza due indicazioni stradali.
    example_gloss:
    - Prima vai dritto.
    - Poi gira a sinistra.
  hi.a1.unit09.lesson02.teach.pahle_seedhe_phir_baaen:
    title: Prima dritto, poi a sinistra
    gloss: Prima vai dritto, poi gira a sinistra.
    note: Unisce «pahle» e «phir» in un'unica indicazione in due passaggi.
  hi.a1.unit09.lesson02.teach.pahle_phir_note:
    title: Pahle e phir
    gloss: '«Pahle» e «phir» collegano due passaggi: la prima azione si usa con «pahle», la seconda con «phir», come in «pahle seedhe jaao, phir baaen muro».'
    note: Un punto di grammatica davvero utile per dare indicazioni in più passaggi.
  hi.a1.unit09.lesson03.teach.nukkad:
    title: Angolo della strada
    gloss: angolo della strada
    note: Una nuova parola di luogo per il dialogo finale della lezione, usata con «par» (a/su).
    example_gloss:
    - La banca è all'angolo.
    - Il parco è dietro la scuola.
  hi.a1.unit09.lesson03.teach.bas:
    title: Solo / basta
    gloss: solo / basta
    note: È anche un prestito comune per indicare l'autobus (il veicolo), ma questo significato non viene insegnato in questo corso, quindi qui non c'è ambiguità.
    example_gloss: Vai solo ancora un po'.
  hi.a1.unit09.lesson03.teach.samajh_gaya:
    title: Capito
    gloss: capito
    note: 'Un''espressione comune di due parole: «samajh» (la radice di «samajhna», capire) più «gaya» (andato), che indica l''azione compiuta. Questa è la forma maschile: Priya direbbe «samajh gayi».'
    example_gloss: Ho capito. / Capito.
  hi.a1.unit09.lesson03.teach.accha_bahut_shukriya:
    title: Ah, va bene! Grazie mille!
    gloss: Ah, va bene! Grazie mille!
    note: Riprende «accha», «bahut» e «shukriya» delle unità precedenti.
  hi.a1.unit09.lesson03.teach.koi_baat_nahin_phir_milenge:
    title: Nessun problema! Ci vediamo.
    gloss: Nessun problema! Ci vediamo.
    note: La formula di chiusura abituale di questo corso, ripresa identica dall'Unità 8.
  hi.a1.unit09.lesson03.teach.dialogue.line01:
    title: Arjun chiede dell'ufficio postale
    gloss: Arjun chiede a Priya come arrivare all'ufficio postale.
    note: Riprende la struttura della domanda iniziale della lezione 2.
  hi.a1.unit09.lesson03.teach.dialogue.line02:
    title: Priya comincia le indicazioni
    gloss: 'Priya dice: da qui prima vai dritto.'
    note: Riprende «yahaan se» e «pahle» già visti in questa unità.
  hi.a1.unit09.lesson03.teach.dialogue.line03:
    title: Arjun chiede cosa fare dopo
    gloss: Arjun dice va bene e chiede cosa deve fare dopo.
  hi.a1.unit09.lesson03.teach.dialogue.line04:
    title: Priya continua
    gloss: 'Priya dice: poi all''angolo della banca gira a sinistra.'
    note: Introduce «nukkad» (angolo della strada) in contesto.
  hi.a1.unit09.lesson03.teach.dialogue.line05:
    title: Arjun conferma e chiede ancora
    gloss: Arjun ripete «a sinistra», conferma che va bene e chiede cosa viene dopo.
  hi.a1.unit09.lesson03.teach.dialogue.line06:
    title: Priya conclude il primo percorso
    gloss: 'Priya dice: vai ancora solo un po'' — l''ufficio postale è lì, vicino alla banca.'
    note: 'Introduce «bas» (solo/basta) ed è coerente con quanto stabilito nell''Unità 8: l''ufficio postale è vicino alla banca.'
  hi.a1.unit09.lesson03.teach.dialogue.line07:
    title: Arjun ha capito e chiede del parco
    gloss: Arjun dice che ha capito e chiede come arrivare al parco.
    note: Introduce l'espressione «samajh gaya».
  hi.a1.unit09.lesson03.teach.dialogue.line08:
    title: Priya dà il secondo percorso
    gloss: 'Priya dice: il parco? Prima vai dritto, poi gira a destra — il parco è dietro la scuola.'
    note: 'È coerente con quanto stabilito nell''Unità 8: il parco è dietro la scuola.'
  hi.a1.unit09.lesson03.teach.dialogue.line09:
    title: Arjun ringrazia Priya
    gloss: Arjun dice che ha capito e ringrazia molto Priya.
  hi.a1.unit09.lesson03.teach.dialogue.line10:
    title: Priya chiude il dialogo
    gloss: Priya dice di non preoccuparsi e che ci si rivede.
    note: La stessa battuta di chiusura del dialogo dell'Unità 8, ripresa identica.
