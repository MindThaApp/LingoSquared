  hi.a1.unit18.lesson02.teach.grammar_feminine_plural:
    title: 'Femminile: plurale da -i a -iyan'
    gloss: 'I nomi femminili che terminano in ''-i'' al plurale cambiano in ''-iyan'': ''kursi'' (uno) diventa ''kursiyan'' (più di uno), così come prima in questa unità ''kamra'' era diventato ''kamre'' con la regola del maschile. Qui però la regola è diversa, perché la parola è femminile e termina in ''-i''.'
