  hi.a1.unit18.lesson03.teach.grammar_summary:
    title: Tre regole principali
    gloss: 'Le tre regole principali di questa unità: (1) ''[luogo] + mein + [numero] + [nome] + hai/hain'' indica cosa c''è in una casa e quanti sono; (2) i nomi maschili che terminano in ''-a'' al plurale diventano ''-e'' (kamra -> kamre); (3) i nomi femminili che terminano in ''-i'' al plurale diventano ''-iyan'' (kursi -> kursiyan, khidki -> khidkiyan).'
    note: Un riepilogo finale che riunisce la grammatica dell'intera unità, come le note di grammatica riassuntive delle unità 15-17.
  hi.a1.unit18.lesson03.teach.home_reading:
    title: Lettura su due case
    gloss: La casa di Priya è piccola. In casa ci sono due stanze, una cucina e un bagno. La casa di Arjun è grande. In casa ci sono tre camere da letto e una cucina grande.
    note: 'Un breve profilo diretto, senza nuova cornice narrativa, che riprende esattamente i fatti già emersi nel dialogo, senza aggiungere altro: serve a leggere una breve descrizione di un''abitazione.'
    glosses:
      घर: casa
      छोटा: piccolo
      कमरे: stanze
      रसोई: cucina
      बाथरूम: bagno
      बड़ा: grande
      बेडरूम: camere da letto
      बड़ी: grande (femminile)
