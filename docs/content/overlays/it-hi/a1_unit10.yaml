teaching:
  hi.a1.unit10.lesson01.teach.review_time:
    title: 'Ripasso: in punto, mattina, pomeriggio, sera, notte, a'
    gloss: in punto, mattina, pomeriggio, sera, notte, a (momento generico)
    note: 'Un breve ripasso delle parole del tempo dell''unità 4: in questa unità le userai moltissimo.'
    example_gloss:
    - Ora sono le 8 del mattino.
    - Di notte non c'è lezione.
  hi.a1.unit10.lesson01.teach.uthna:
    title: Mi alzo
    gloss: mi alzo (parlante uomo / donna)
    note: 'Il primo verbo al presente abituale di questa unità: estende lo schema -ta/-tee visto nell''unità 5 (rahta hai/rahtee hai) alla prima persona, con hoon.'
    example_gloss:
    - Mi alzo alle 7 del mattino.
    - Mi alzo alle 6 del mattino.
  hi.a1.unit10.lesson01.teach.roz:
    title: Ogni giorno
    gloss: ogni giorno
    note: Un nuovo avverbio per descrivere la routine.
    example_gloss: Mi alzo ogni mattina.
  hi.a1.unit10.lesson01.teach.nashta_karna:
    title: Faccio colazione
    gloss: faccio colazione (parlante uomo / donna)
    note: '''Nashta'' (colazione) si combina con ''karta/kartee hoon'' (faccio).'
    example_gloss:
    - La mattina faccio colazione.
    - La mattina faccio colazione.
  hi.a1.unit10.lesson01.teach.kaam_par_jaana:
    title: Vado al lavoro
    gloss: vado al lavoro (parlante uomo / donna)
    note: '''Kaam par jaana'' (andare al lavoro) richiede la parola ''par'' («su/a»): è un''espressione fissa, a differenza di ''school jaana'' più avanti in questa unità, che non richiede nessuna parola in più.'
    example_gloss:
    - Poi vado al lavoro.
    - Poi vado al lavoro.
  hi.a1.unit10.lesson01.teach.habitual_paradigm_note:
    title: Lo schema del presente abituale
    gloss: 'Per descrivere un''abitudine quotidiana, il verbo prende -ta/-tee/-te, e si aggiunge hoon/ho/hai/hain a seconda del soggetto: io mi alzo (uomo/donna) ''hoon'', tu ti alzi ''ho'', lui/lei si alza ''hai'', loro si alzano ''hain''.'
    note: Presenta subito lo schema completo (già intravisto nel dialogo dell'unità 1 e formalizzato per la terza persona nell'unità 5), così gli esercizi di questa lezione non ti chiedono di indovinare una forma mai spiegata.
  hi.a1.unit10.lesson01.teach.full_routine_phrase:
    title: La mia mattina, passo per passo
    gloss: Ogni mattina mi alzo alle 7, poi faccio colazione, poi vado al lavoro.
    note: Riunisce i tre verbi della routine di questa lezione in un'unica frase naturale e ordinata.
  hi.a1.unit10.lesson02.teach.sona:
    title: Dormo
    gloss: dormo (parlante uomo / donna)
    note: Lo stesso schema -ta/-tee + hoon applicato a un nuovo verbo.
    example_gloss:
    - Dormo alle 11 di sera.
    - Dormo alle 10 di sera.
  hi.a1.unit10.lesson02.teach.school_jaana:
    title: Vado a scuola
    gloss: vado a scuola (parlante uomo / donna)
    note: A differenza di 'kaam par jaana', 'school jaana' non richiede nessuna parola prima di 'jaana'.
    example_gloss:
    - Ogni mattina vado a scuola alle 8.
    - Ogni mattina vado a scuola alle 8.
  hi.a1.unit10.lesson02.teach.tum_form_note:
    title: 'La forma tum: -te/-tee + ho'
    gloss: 'Con ''tum'' (tu, informale) il verbo prende -te/-tee e ''ho'': ti alzi (a un uomo) / ti alzi (a una donna), dormi (a un uomo) / dormi (a una donna).'
    note: La seconda persona dello stesso paradigma presentato nella lezione 1.
  hi.a1.unit10.lesson02.teach.addressee_gender_note:
    title: Con il genere di chi concorda la forma tum?
    gloss: 'Il verbo alla forma tum concorda con il genere della persona a cui si parla, non di chi parla: a Priya si chiede «Quando ti alzi?» (forma femminile); ad Arjun si chiede «Quando ti alzi?» (forma maschile).'
    note: Un punto davvero facile da dimenticare, verificato in ogni frase con la forma tum del dialogo della lezione 3.
  hi.a1.unit10.lesson02.teach.kab_uthte_ho_phrase:
    title: Quando ti alzi?
    gloss: Quando ti alzi? (a un uomo)
    note: Una domanda pronta all'uso con la nuova forma tum di questa lezione.
  hi.a1.unit10.lesson02.teach.pahle_phir_routine:
    title: Prima mi alzo, poi faccio colazione
    gloss: Prima mi alzo, poi faccio colazione.
    note: Riprende 'pahle'/'phir' («prima»/«poi») dalle indicazioni stradali dell'unità 9 per ordinare i momenti della routine.
  hi.a1.unit10.lesson02.teach.kaam_idiom_note:
    title: Kaam par e school
    gloss: '''Kaam par jaana'' (andare al lavoro) richiede ''par'', mentre ''school jaana'' (andare a scuola) non richiede nessuna parola in più: entrambe le forme sono corrette e comuni.'
    note: Una vera differenza idiomatica, non una regola generale con un'eccezione.
  hi.a1.unit10.lesson03.teach.vaapas:
    title: Indietro
    gloss: indietro, di ritorno
    note: Si usa con 'aana' (venire) per dire «tornare».
    example_gloss: Torno indietro.
  hi.a1.unit10.lesson03.teach.aana:
    title: Vengo
    gloss: vengo (parlante uomo / donna)
    note: Un nuovo verbo, che segue lo stesso schema del presente abituale già visto.
    example_gloss:
    - Torno la sera.
    - Torno la sera.
  hi.a1.unit10.lesson03.teach.khana_verb:
    title: Mangio (il cibo)
    gloss: mangio (parlante uomo / donna)
    note: '''Khana'' sostantivo (cibo, dall''unità 6) più ''khana'' verbo (mangiare): un raddoppiamento naturale in hindi, non un errore di battitura.'
    example_gloss:
    - Mangio di sera, a cena.
    - Mangio di sera, a cena.
  hi.a1.unit10.lesson03.teach.raat_ka_khana:
    title: Cena
    gloss: 'cena (letteralmente: «il cibo della notte»)'
    note: Riprende 'raat' (notte), 'ka' (di, possessivo) e 'khana' (cibo), tutti già visti.
    example_gloss: La cena è molto buona.
  hi.a1.unit10.lesson03.teach.dialogue.line01:
    title: Arjun chiede a Priya quando si alza
    gloss: Arjun chiede a Priya a che ora si alza ogni giorno.
    note: Usa la forma tum femminile, rivolgendosi correttamente a Priya.
  hi.a1.unit10.lesson03.teach.dialogue.line02:
    title: Risponde Priya
    gloss: 'Priya dice: mi alzo ogni mattina alle 6. Poi faccio colazione.'
  hi.a1.unit10.lesson03.teach.dialogue.line03:
    title: Arjun racconta la sua routine
    gloss: 'Arjun dice: bene! Io mi alzo alle 7. Anch''io faccio colazione, poi vado al lavoro.'
  hi.a1.unit10.lesson03.teach.dialogue.line04:
    title: Priya chiede ad Arjun quando torna
    gloss: Priya chiede ad Arjun quando torna.
    note: Usa la forma tum maschile, rivolgendosi correttamente ad Arjun. Introduce 'vaapas aana' in contesto.
  hi.a1.unit10.lesson03.teach.dialogue.line05:
    title: Arjun descrive la sua sera
    gloss: 'Arjun dice: torno alle 6 di sera. Poi ceno, poi dormo.'
  hi.a1.unit10.lesson03.teach.dialogue.line06:
    title: Priya descrive la sua sera
    gloss: 'Priya dice: anch''io torno la sera, poi mangio.'
  hi.a1.unit10.lesson03.teach.dialogue.line07:
    title: Arjun chiede a Priya quando dorme
    gloss: Arjun chiede a Priya a che ora va a dormire.
    note: Ancora la forma tum femminile, rivolgendosi correttamente a Priya.
  hi.a1.unit10.lesson03.teach.dialogue.line08:
    title: Priya risponde e chiude
    gloss: 'Priya dice: Dormo alle 11 di notte. Va bene, a domani!'
  hi.a1.unit10.lesson03.teach.dialogue.line09:
    title: Arjun chiude
    gloss: 'Arjun dice: Va bene, a presto!'
