teaching:
  hi.a1.unit05.lesson01.teach.parivar:
    title: La famiglia
    gloss: famiglia
    note: La parola generica per «famiglia», usata in tutta l'unità.
    example_gloss: La mia famiglia è in India.
  hi.a1.unit05.lesson01.teach.pita_maa:
    title: Padre, madre
    gloss: padre, madre
    note: Quando li presenti, entrambi prendono la forma plurale di rispetto *hain* invece di *hai*, e *pita* prende *mere* invece di *mera* -- vedi la nota sugli onorifici più avanti in questa lezione.
    example_gloss:
    - Questo è mio padre.
    - Questa è mia madre.
  hi.a1.unit05.lesson01.teach.bhai_behan:
    title: Fratello, sorella
    gloss: fratello, sorella
    note: 'La coppia centrale di questa unità per il contrasto di concordanza mera/meri: *mera bhai*, *meri behan*.'
    example_gloss:
    - Ho un fratello.
    - Ho una sorella.
  hi.a1.unit05.lesson01.teach.ek_as_article:
    title: Ek come «un/una»
    gloss: '*Ek* significa «uno» quando si conta e funziona anche come «un/una»: *mera ek bhai hai*.'
    note: È la stessa parola già vista come numero 1 -- l'hindi non ha un articolo indeterminativo a parte.
  hi.a1.unit05.lesson01.teach.mata_pita:
    title: Genitori
    gloss: genitori
    note: Composto di *mata* (madre, formale) e *pita* (padre) -- la parola standard per «genitori».
    example_gloss: I miei genitori vivono a Delhi.
  hi.a1.unit05.lesson01.teach.mera_meri_note:
    title: Mera e meri
    gloss: '*Mera* va con le parole maschili, *meri* con quelle femminili: *mera bhai*, *meri behan*.'
    note: È il punto grammaticale centrale di questa unità -- il possessivo concorda con la persona o la cosa posseduta, non con chi parla.
  hi.a1.unit05.lesson01.teach.mere_honorific_note:
    title: Mere per gli anziani da rispettare
    gloss: 'Per rispetto verso le persone più anziane, *mera* diventa *mere* e *hai* diventa *hain*, anche se si parla di una persona sola: *yeh mere pita hain* (Questo è mio padre).'
    note: 'È una convenzione reale e autentica, non un errore: gli anziani rispettati della famiglia al singolare (padre, nonno) prendono questa forma dall''aspetto plurale. Madri e nonne mantengono *meri*, ma il verbo va comunque al plurale (*hain*) per lo stesso motivo.'
  hi.a1.unit05.lesson01.teach.yah_mera_bhai_hai:
    title: Questo è mio fratello
    gloss: Questo è mio fratello.
    note: 'La forma maschile semplice: per un fratello non serve alcuna forma di rispetto.'
  hi.a1.unit05.lesson01.teach.yah_meri_behan_hai:
    title: Questa è mia sorella
    gloss: Questa è mia sorella.
    note: La forma femminile semplice, che concorda con *behan*.
  hi.a1.unit05.lesson01.teach.yah_kaun_hai:
    title: Chi è questo?
    gloss: Chi è?
    note: Una domanda semplice e utile per presentare i familiari.
  hi.a1.unit05.lesson02.teach.dada_dadi:
    title: Nonno paterno, nonna paterna
    gloss: nonno paterno, nonna paterna
    note: 'Indicano specificamente i genitori di tuo padre: vedi la nota più avanti in questa lezione, che li confronta con i genitori di tua madre.'
    example_gloss:
    - Mio nonno vive a Delhi.
    - Mia nonna vive a Delhi.
  hi.a1.unit05.lesson02.teach.nana_nani:
    title: Nonno materno, nonna materna
    gloss: nonno materno, nonna materna
    note: 'I genitori di tua madre: l''hindi usa una coppia di parole completamente diversa da quella per i genitori di tuo padre.'
    example_gloss:
    - Mio nonno (da parte di madre) vive a Mumbai.
    - Mia nonna (da parte di madre) vive a Mumbai.
  hi.a1.unit05.lesson02.teach.dilli_mumbai:
    title: Delhi, Mumbai
    gloss: Delhi, Mumbai
    note: Due grandi città indiane, usate negli esempi di questa lezione per dire dove vivono i familiari.
    example_gloss:
    - La mia famiglia vive a Delhi.
    - Mio fratello vive a Mumbai.
  hi.a1.unit05.lesson02.teach.dada_nana_note:
    title: Due coppie di nonni
    gloss: 'Genitori del padre: *dada-dadi*. Genitori della madre: *nana-nani*.'
    note: A differenza dell'italiano, che ha le sole parole «nonno/nonna» (e li distingue con «paterno» o «materno»), l'hindi ha parole completamente separate a seconda del lato della famiglia.
  hi.a1.unit05.lesson02.teach.rehna_verb:
    title: Vive (rehna)
    gloss: vive (maschile / femminile / plurale di rispetto)
    note: 'Il verbo «vivere/abitare»: *rehta hai* per un uomo, *rehti hai* per una donna, *rehte hain* per più persone o per un anziano rispettato.'
    example_gloss:
    - Mio fratello vive a Delhi.
    - Mia sorella vive a Mumbai.
    - I miei nonni vivono a Delhi.
  hi.a1.unit05.lesson02.teach.tumhara_tumhari:
    title: Tuo / tua (informale)
    gloss: tuo / tua (informale, maschile / femminile)
    note: Il possessivo informale del registro *tum*, che concorda con il nome posseduto esattamente come *mera/meri*.
    example_gloss:
    - Dove abita tuo fratello?
    - Dove vive tua sorella?
  hi.a1.unit05.lesson02.teach.mera_tumhara_note:
    title: Mera e tumhara insieme
    gloss: '*Mera* e *tumhara* vanno entrambi con parole maschili; *meri* e *tumhari* vanno entrambi con parole femminili: *mera bhai*/*tumhara bhai*, *meri behan*/*tumhari behan*.'
    note: Lo stesso schema di concordanza della lezione 1, che qui vale anche per *tumhara*.
  hi.a1.unit05.lesson03.teach.bada_badi:
    title: Maggiore / grande
    gloss: maggiore, grande (maschile / femminile)
    note: L'hindi indica un fratello o una sorella maggiore con questo aggettivo che concorda, e non con una parola a sé come l'italiano «fratello maggiore» (aggettivo separato dal nome)... in hindi si dice letteralmente «grande fratello».
    example_gloss:
    - Mio fratello maggiore vive a Delhi.
    - Mia sorella maggiore vive a Mumbai.
  hi.a1.unit05.lesson03.teach.chota_choti:
    title: Minore / piccolo
    gloss: minore, piccolo (maschile / femminile)
    note: Il contrario di *bada/badi*, per un fratello o una sorella minore.
    example_gloss:
    - Mio fratello minore adesso è studente.
    - Mia sorella minore adesso è studentessa.
  hi.a1.unit05.lesson03.teach.bada_chota_note:
    title: Concordanza di bada/chota
    gloss: '*Bada* e *chota* vanno con parole maschili, *badi* e *choti* con parole femminili: *bada bhai*, *badi behan*.'
    note: La stessa concordanza maschile/femminile già vista con *mera/meri*, ora applicata ai termini che indicano l'età.
  hi.a1.unit05.lesson03.teach.aur_lekin_bhi:
    title: E, ma, anche
    gloss: e, ma, anche
    note: Tre semplici parole di collegamento, riprese nel dialogo finale di questa lezione.
    example_gloss:
    - Mio fratello e mia sorella vivono a Delhi.
    - Mio fratello vive a Delhi, ma mia sorella vive a Mumbai.
    - Anch'io ho una sorella.
  hi.a1.unit05.lesson03.teach.accha_phir_milenge:
    title: Bene, a presto
    gloss: Bene! A presto.
    note: Un saluto di chiusura cordiale, ripreso dal vocabolario di congedo dell'unità 2.
  hi.a1.unit05.lesson03.teach.theek_hai_phir_milte_hain:
    title: Va bene, a presto
    gloss: Va bene, a presto!
    note: La risposta informale al saluto precedente, come negli scambi di chiusura delle unità precedenti.
  hi.a1.unit05.lesson03.teach.dialogue.line01:
    title: Arjun chiede della famiglia di Priya
    gloss: Arjun chiede dove vive la famiglia di Priya.
    note: Riprende lo schema *parivar kahan rehta hai* di questa unità.
  hi.a1.unit05.lesson03.teach.dialogue.line02:
    title: Priya parla dei suoi genitori e di suo fratello
    gloss: Priya dice che i suoi genitori vivono a Delhi e che ha anche un fratello maggiore.
    note: Unisce *mata-pita*, *rehte hain* e *bada bhai bhi hai*.
  hi.a1.unit05.lesson03.teach.dialogue.line03:
    title: Arjun chiede dei suoi nonni
    gloss: 'Arjun dice «Ah, capisco» e chiede: e i tuoi nonni?'
    note: '*Tumhare* è la forma di rispetto di *tumhara*, usata per gli anziani, esattamente come *mere* per *mera* (nota sulla forma di rispetto della lezione 1).'
  hi.a1.unit05.lesson03.teach.dialogue.line04:
    title: Priya parla di entrambe le coppie di nonni
    gloss: Priya dice che i nonni paterni vivono a Delhi, ma i nonni materni vivono a Mumbai.
    note: Usa *lekin* per contrapporre le città delle due coppie di nonni, rafforzando la distinzione dada-dadi/nana-nani della lezione 2.
  hi.a1.unit05.lesson03.teach.dialogue.line05:
    title: Arjun parla di sua sorella
    gloss: Arjun dice che anche lui ha una sorella minore.
    note: Riprende *bhi* e *choti behan*.
  hi.a1.unit05.lesson03.teach.dialogue.line06:
    title: Priya chiude la conversazione
    gloss: Priya dice «Bene, a presto».
    note: Riprende la frase di chiusura di questa lezione.
  hi.a1.unit05.lesson03.teach.dialogue.line07:
    title: Arjun risponde
    gloss: Arjun è d'accordo e dice «a presto».
    note: Riprende la frase di risposta di questa lezione.
