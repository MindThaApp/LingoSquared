teaching:
  hi.a1.unit11.lesson01.teach.review_chai_kaafi:
    title: 'Ripasso: tè, caffè'
    gloss: tè, caffè
    note: 'Un rapido ripasso delle parole delle bevande dell''unità 6: in questa unità le riutilizziamo per proporre dei programmi.'
    example_gloss:
    - Voglio il tè.
    - Voglio il caffè.
  hi.a1.unit11.lesson01.teach.filma:
    title: Film
    gloss: film
    note: 'Un nuovo sostantivo per il tema di questa unità: fare programmi.'
    example_gloss: Questo film è bello.
  hi.a1.unit11.lesson01.teach.dekhna:
    title: Guardiamo / (noi) guardiamo
    gloss: (noi) guardiamo / guardiamo!
    note: La forma abituale plurale di 'dekhna' (guardare), usata qui per proporre di fare qualcosa insieme.
    example_gloss: Guardiamo un film.
  hi.a1.unit11.lesson01.teach.chalo_film_phrase:
    title: Guardiamo un film!
    gloss: Guardiamo un film!
    note: '''Chalo'' + un verbo abituale al plurale è il modo più comune per proporre di fare qualcosa insieme: lo hai già incontrato di passaggio nelle unità 1, 6 e 7 (''chalo shuru karte hain'', ''chalo, kuch khaate hain'', ''chalo, kuch khareedte hain''); in questa unità lo vediamo in modo più sistematico e lo ampliamo.'
  hi.a1.unit11.lesson01.teach.saath:
    title: Insieme
    gloss: insieme
    note: Si usa per proporre di fare un'attività insieme.
    example_gloss: Guardiamo un film insieme!
  hi.a1.unit11.lesson01.teach.peena:
    title: Beviamo / (noi) beviamo
    gloss: (noi) beviamo / beviamo!
    note: La forma del presente abituale al plurale di 'peena' (bere), con lo stesso schema di 'dekhte hain'.
    example_gloss: Beviamo il tè.
  hi.a1.unit11.lesson01.teach.chalo_chai_phrase:
    title: Beviamo un tè insieme!
    gloss: Beviamo un tè insieme!
    note: Unisce 'saath' e 'peete hain' di questa lezione in una seconda proposta, con lo stesso schema con 'chalo' della proposta del film.
  hi.a1.unit11.lesson01.teach.chalo_grammar_note:
    title: Chalo + verbo-te + hain = Facciamo ___
    gloss: 'Per proporre di fare qualcosa insieme si dice ''chalo'' + verbo-te + hain: Guardiamo un film! Beviamo un tè insieme!'
    note: Presenta in modo esplicito tutto lo schema, che nelle unità precedenti è già comparso tre volte senza essere spiegato.
  hi.a1.unit11.lesson01.teach.achha_vichar:
    title: Buona idea!
    gloss: Buona idea!
    note: Un modo pronto all'uso per accettare una proposta con entusiasmo.
  hi.a1.unit11.lesson02.teach.vyast:
    title: Occupato
    gloss: occupato / impegnato
    note: Un nuovo aggettivo, che si usa con la copula già nota (hoon/ho/hai) per dire che non si è disponibili.
    example_gloss: Oggi sono occupato/a.
  hi.a1.unit11.lesson02.teach.maaf_karna:
    title: Mi dispiace / scusa
    gloss: mi dispiace / scusa
    note: Un'espressione di cortesia fissa, usata per attenuare un rifiuto.
    example_gloss: Mi dispiace, sono occupato/a.
  hi.a1.unit11.lesson02.teach.maaf_vyast_phrase:
    title: Mi dispiace, sono occupato/a.
    gloss: Mi dispiace, sono occupato/a.
    note: La frase base per rifiutare, che unisce le due nuove espressioni di questa lezione.
  hi.a1.unit11.lesson02.teach.mujhe_kaam_hai:
    title: Ho da lavorare.
    gloss: Ho da lavorare.
    note: Riprende lo schema 'mujhe...hai' (io ho...), simile a 'mujhe...chahiye' (voglio/mi serve) visto prima, qui per dare il motivo di un rifiuto.
  hi.a1.unit11.lesson02.teach.decline_grammar_note:
    title: Come rifiutare con gentilezza
    gloss: Per rifiutare con gentilezza un programma, di' 'maaf karna' (mi dispiace) seguito dalla tua situazione (ad es. 'sono occupato/a') o da un motivo (ad es. 'ho da lavorare').
    note: Riutilizza di proposito la grammatica già studiata (la copula e lo schema del possesso con il dativo) senza introdurre una nuova costruzione per 'potere'.
  hi.a1.unit11.lesson02.teach.hum_pronoun:
    title: Noi
    gloss: noi
    note: 'Il primo pronome di prima persona plurale del corso. Il verbo al presente abituale (-te + hain) è lo stesso già visto per ve (loro): nessuna nuova coniugazione, solo un nuovo pronome. (Anche tum vuole -te, ma con ''ho'': tum milte ho.)'
    example_gloss: Ci vediamo ogni giorno.
  hi.a1.unit11.lesson02.teach.kab_milte_phrase:
    title: Quando ci vediamo?
    gloss: Quando ci vediamo?
    note: Unisce 'hum' a 'kab' (unità 10) e a 'milte hain' (usato fin dai saluti dell'unità 1, dove il soggetto di solito era omesso).
  hi.a1.unit11.lesson02.teach.din_review:
    title: 'Ripasso: sabato, domenica'
    gloss: Sabato, domenica
    note: Un rapido ripasso di due giorni della settimana dell'unità 3, utili per fissare un appuntamento.
    example_gloss:
    - Oggi è sabato.
    - Domani è domenica.
  hi.a1.unit11.lesson02.teach.samay_review:
    title: 'Ripasso: le 4, che ora'
    gloss: le 4, che ora
    note: Un rapido ripasso delle parole dell'ora dell'unità 4, utili per fissare un appuntamento.
    example_gloss:
    - Ora sono le 4.
    - Che ore sono adesso?
  hi.a1.unit11.lesson02.teach.kya_ravivar_thik_phrase:
    title: Domenica va bene?
    gloss: Domenica va bene?
    note: Riutilizza 'kya' come marcatore delle domande sì/no, già noto fin dall'unità 1 ('kya yeh tumhari pahli baar hai?', 'kya tum yoga karti ho?'), invece di un nuovo interrogativo per 'quale giorno'.
  hi.a1.unit11.lesson03.teach.sandesh:
    title: Messaggio
    gloss: messaggio
    note: Un nuovo sostantivo, usato per la parte della lezione dedicata all'invito scritto.
    example_gloss: Questo è il messaggio di Arjun.
  hi.a1.unit11.lesson03.teach.dialogue.line01:
    title: Arjun propone un film per sabato
    gloss: Priya, sabato guardiamo un film?
  hi.a1.unit11.lesson03.teach.dialogue.line02:
    title: Priya rifiuta e spiega il motivo
    gloss: Mi dispiace, sabato sono occupata. Ho da lavorare.
  hi.a1.unit11.lesson03.teach.dialogue.line03:
    title: Arjun chiede quando possono vedersi
    gloss: Va bene. Quando ci vediamo?
  hi.a1.unit11.lesson03.teach.dialogue.line04:
    title: Priya propone invece la domenica
    gloss: Domenica va bene? Beviamo un tè insieme!
  hi.a1.unit11.lesson03.teach.dialogue.line05:
    title: Arjun accetta e chiede l'ora
    gloss: Buona idea! A che ora domenica?
  hi.a1.unit11.lesson03.teach.dialogue.line06:
    title: Priya propone un orario
    gloss: Alle 4 va bene?
  hi.a1.unit11.lesson03.teach.dialogue.line07:
    title: Arjun conferma
    gloss: Sì, alle 4 va bene. A dopo!
  hi.a1.unit11.lesson03.teach.dialogue.line08:
    title: Priya chiude la conversazione
    gloss: Va bene, ci vediamo domenica!
  hi.a1.unit11.lesson03.teach.invitation_message:
    title: Il messaggio di Priya
    gloss: Ciao Arjun, vediamoci domenica alle 4 e beviamo un tè. Va bene? - Priya
    note: Un breve invito scritto, che riprende il programma appena confermato nel dialogo.
    glosses:
      चलो: facciamo / andiamo
      रविवार: domenica
      मिलते: ci vediamo (da मिलना)
      चाय: tè
      पीते: beviamo (da पीना)
      ठीक: va bene
