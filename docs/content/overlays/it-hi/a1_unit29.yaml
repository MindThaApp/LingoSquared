teaching:
  hi.a1.unit29.lesson01.teach.kul_kitna_hua:
    title: Chiedere il prezzo totale
    gloss: Quanto costa in totale?
    note: '*कुल* significa «totale», e *कितना हुआ?* («quanto viene?») è il modo abituale per chiedere il totale.'
  hi.a1.unit29.lesson01.teach.kul_pachchees_rupye:
    title: Dire il prezzo totale
    gloss: Costa duecentocinquanta rupie in totale.
    note: '*हुए* concorda con il plurale *रुपये*: *कुल दो सौ पचास रुपये हुए* significa letteralmente «in tutto sono venute duecentocinquanta rupie».'
  hi.a1.unit29.lesson02.teach.kard_se_pement:
    title: Pagare con la carta o in contanti
    gloss: pagare con la carta, pagare in contanti
    note: In hindi si dice *कार्ड से पेमेंट करना* («fare il pagamento con la carta») e *नकद पेमेंट करना*; *से* indica il mezzo di pagamento.
    example_gloss:
    - Posso pagare con la carta qui?
    - Pago in contanti.
  hi.a1.unit29.lesson02.teach.kya_main_yahan:
    title: Chiedere se si può pagare con la carta
    gloss: Posso pagare con la carta qui?
    note: '*यहाँ* («qui») indica il luogo, e *सकता हूँ* («posso») viene dopo il resto della frase; una donna dice *सकती हूँ*.'
  hi.a1.unit29.lesson02.teach.ap_nakad_pement:
    title: Chiedere come si preferisce pagare
    gloss: Preferisce pagare in contanti o con la carta?
    note: '*आप ... करेंगे* è la domanda al futuro di cortesia che usa chi sta alla cassa, e *आप* vuole il verbo al plurale *करेंगे*.'
  hi.a1.unit29.lesson03.teach.bil:
    title: Il conto
    gloss: il conto
    note: '*बिल* è un sostantivo maschile: *एक बिल*, *बिल का*.'
    example_gloss: Dividiamo il conto?
  hi.a1.unit29.lesson03.teach.bil_bant_len:
    title: Proporre di dividere il conto
    gloss: Dividiamo il conto?
    note: '*बाँट लें?* («dividiamo?») propone un''azione comune senza dire *हम*; *लें* è la forma di invito («facciamo») di *लेना*.'
  hi.a1.unit29.lesson03.teach.kya_main_alag:
    title: Chiedere di pagare separatamente
    gloss: Posso pagare separatamente?
    note: '*अलग से* significa «separatamente» e va prima di *पेमेंट कर सकता हूँ*.'
  hi.a1.unit29.lesson04.teach.bakee_paise:
    title: Il resto
    gloss: il resto
    note: '*बाकी पैसे* («i soldi rimanenti») è plurale e indica il resto che ti viene restituito.'
    example_gloss: Ecco il suo resto.
  hi.a1.unit29.lesson04.teach.ye_rahe_apke:
    title: Dare il resto
    gloss: Ecco il suo resto.
    note: '*आपके* è il «suo/vostro» di cortesia (*आप* + *के*) e concorda con il plurale *पैसे*.'
  hi.a1.unit29.lesson04.teach.mujhe_bakee_paise:
    title: Rifiutare il resto
    gloss: Non mi serve il resto.
    note: '*मुझे ... नहीं चाहिए* («a me ... non serve») è il modo in hindi di dire «non mi serve»; *नहीं* viene prima di *चाहिए*.'
  hi.a1.unit29.lesson05.teach.paintees:
    title: Trecentocinquanta
    gloss: trecentocinquanta
    note: '*तीन सौ पचास* è 350: si dicono prima le centinaia, poi le decine.'
    example_gloss: Costa trecentocinquanta rupie.
  hi.a1.unit29.lesson05.teach.bil_do_thalee:
    title: Leggere un conto del ristorante
    gloss: 'Conto: due thali e due tè. Totale: trecentocinquanta rupie. Pagamento: con carta.'
    note: Individua che cosa è stato ordinato, il totale e come è stato pagato.
    glosses:
      बिल: conto
      दो: due
      थाली: thali
      चाय: tè
      कुल: totale
      तीन: tre
      सौ: cento
      पचास: cinquanta
      रुपये: rupie
      पेमेंट: pagamento
      कार्ड: carta
  hi.a1.unit29.lesson06.teach.priya_bil_mang:
    title: Priya chiede il conto
    gloss: 'Priya: Chiediamo il conto?'
    note: '*माँग लें?* («lo chiediamo?») usa di nuovo la forma di invito di *लेना*, e *माँगना* significa «chiedere».'
  hi.a1.unit29.lesson06.teach.arjun_han_achchha:
    title: Arjun chiede il totale
    gloss: 'Arjun: Sì, buona idea. Quanto viene in totale?'
    note: '*कुल कितना हुआ?* è la domanda sul totale vista prima, ora posta al tavolo.'
  hi.a1.unit29.lesson06.teach.priya_paintees_rupye:
    title: Priya dice il totale
    gloss: 'Priya: Sono trecentocinquanta rupie. Dividiamo?'
    note: '*तीन सौ पचास रुपये हुए* dice il totale, e *बाँट लें?* chiede «dividiamo?».'
  hi.a1.unit29.lesson06.teach.arjun_naheen_aj:
    title: Arjun insiste per pagare
    gloss: 'Arjun: No, oggi lascia pagare me. Mi hai aiutato tanto.'
    note: '*मुझे पेमेंट करने दो* significa «lasciami pagare», e *तुमने मेरी बहुत मदद की है* usa *ने* perché il verbo è al passato.'
  hi.a1.unit29.lesson06.teach.priya_tum_kitne:
    title: Priya è commossa
    gloss: 'Priya: Che gentile! Grazie mille.'
    note: '*तुम कितने अच्छे हो!* («come sei gentile!») è un complimento affettuoso, e *शुक्रिया* significa «grazie».'
  hi.a1.unit29.lesson06.teach.arjun_kya_main:
    title: Arjun chiede di pagare con la carta
    gloss: 'Arjun: Posso pagare con la carta qui?'
    note: La domanda *क्या मैं यहाँ कार्ड से पेमेंट कर सकता हूँ?* viene usata di nuovo, ora in un vero ristorante.
  hi.a1.unit29.lesson06.teach.arjun_bil_deta:
    title: 'देता है: paga'
    gloss: Arjun paga il conto.
    note: '*देता है* è la forma di *वह* di *देना* («dare»); in hindi per «pagare il conto» si dice «dare il conto».'
