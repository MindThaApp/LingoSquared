answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (हूँ, हाँ, कहाँ vs. मैं, हैं, में, मिलेंगे). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (हूं for हूँ, हां for हाँ) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
  description: 'Hindi per principianti per descrivere l''aspetto fisico di una persona: altezza e impressione dell''età, colore di capelli e occhi, la domanda chiave *कैसा दिखता है?* e il confronto tra l''aspetto di due persone.'
units:
  hi.a1.unit31.appearance:
    title: Descrivere l'aspetto
lessons:
  hi.a1.unit31.lesson01.lanba_chhota_boorha_aur:
    title: Alto, basso, anziano e giovane
  hi.a1.unit31.lesson02.balon_ke_bare_men:
    title: Descrivere i capelli
  hi.a1.unit31.lesson03.ankhen_aur_vah_kaisa:
    title: Gli occhi e «Com'è?»
  hi.a1.unit31.lesson04.priya_neena_ka_huliya:
    title: Priya descrive Nina
  hi.a1.unit31.lesson05.vikram_aur_neha_kee:
    title: Confronto tra Vikram e Neha
  hi.a1.unit31.lesson06.arjun_neena_ko_pahchanta:
    title: Arjun riconosce Nina
teaching:
  hi.a1.unit31.lesson01.teach.lanba_chhota:
    title: Alto e basso
    gloss: alto / basso
    note: '*लंबा* e *छोटा* descrivono l''altezza e di solito si usano con *कद* («statura»): *नेहा का कद लंबा है*. Finiscono in *-ा* con un nome maschile e in *-ी* con uno femminile.'
    example_gloss:
    - Neha è alta.
    - Vikram è basso.
  hi.a1.unit31.lesson01.teach.boorha_javan:
    title: Anziano e giovane
    gloss: anziano / giovane
    note: '*बूढ़ा* e *जवान* descrivono quanti anni sembra avere una persona, senza indicare numeri.'
    example_gloss:
    - Il nonno è anziano.
    - Arjun è giovane.
  hi.a1.unit31.lesson01.teach.tumharee_umr_kitnee:
    title: उम्र e बूढ़ा
    gloss: Quanti anni hai? Il nonno è anziano.
    note: Per chiedere l'età esatta l'hindi usa *उम्र* («età»), mentre *बूढ़ा* descrive una persona anziana senza indicare numeri.
  hi.a1.unit31.lesson01.teach.neha_ka_kad:
    title: Neha è alta e Vikram è basso
    gloss: Neha è alta e Vikram è basso.
    note: '*और* («e») collega le due descrizioni, e ogni *का कद* concorda con il maschile *कद*.'
  hi.a1.unit31.lesson02.teach.bal:
    title: I capelli
    gloss: i capelli
    note: '*बाल* («capelli») in hindi è maschile plurale, quindi le parole che lo descrivono finiscono in *-े*: *लंबे बाल*.'
    example_gloss: Arjun ha i capelli corti e neri.
  hi.a1.unit31.lesson02.teach.sunahre_bhoore_safed:
    title: Biondo, castano e bianco
    gloss: biondi / castani / bianchi
    note: 'Tre colori di capelli: *सुनहरे*, *भूरे* e *सफ़ेद*; davanti a *बाल* finiscono in *-े*.'
    example_gloss:
    - Priya ha i capelli biondi.
    - Vikram ha i capelli castani.
    - Il nonno ha i capelli bianchi.
  hi.a1.unit31.lesson02.teach.lanbe_chhote:
    title: Lunghi e corti (capelli)
    gloss: lungo / corto (capelli)
    note: '*लंबे* («lunghi») e *छोटे* («corti») descrivono i capelli e finiscono in *-े* perché *बाल* è plurale.'
    example_gloss:
    - Neha ha i capelli lunghi.
    - Vikram ha i capelli corti.
  hi.a1.unit31.lesson02.teach.lanbe_bal_chhote:
    title: Aggettivi prima di बाल
    gloss: Capelli lunghi, capelli corti, capelli biondi, capelli castani, capelli bianchi, capelli neri.
    note: '*बाल* è maschile plurale, quindi l''aggettivo che lo precede finisce in *-े*: *लंबे बाल*, *भूरे बाल*.'
  hi.a1.unit31.lesson02.teach.uske_bal_lanbe:
    title: 'उसके: suo (di lui o di lei)'
    gloss: I suoi capelli sono lunghi.
    note: '*उसके* significa sia «di lui» sia «di lei», quindi solo il contesto chiarisce a chi ci si riferisce; qui concorda con il plurale *बाल*.'
  hi.a1.unit31.lesson02.teach.arjun_ke_bal:
    title: Arjun ha i capelli corti e neri
    gloss: Arjun ha i capelli corti e neri.
    note: '*काले* ricompare, ora per i capelli, e finisce in *-े* perché *बाल* è plurale.'
  hi.a1.unit31.lesson02.teach.priya_ke_bal:
    title: Priya ha i capelli lunghi e biondi
    gloss: Priya ha i capelli lunghi e biondi.
    note: Unisce in un'unica frase naturale il lessico di lunghezza e colore di questa lezione.
  hi.a1.unit31.lesson03.teach.ankhen:
    title: Gli occhi
    gloss: gli occhi
    note: '*आँखें* («occhi») è un nome femminile plurale; il singolare è *आँख*.'
    example_gloss: Arjun ha gli occhi castani.
  hi.a1.unit31.lesson03.teach.neela_bhoora_hara:
    title: Azzurro, marrone e verde
    gloss: azzurro / marrone / verde
    note: 'Tre colori degli occhi: *नीला*, *भूरा* e *हरा*; davanti al femminile *आँखें* diventano *नीली*, *भूरी* e *हरी*.'
    example_gloss:
    - Priya ha gli occhi azzurri.
    - Vikram ha gli occhi castani.
    - Neha ha gli occhi verdi.
  hi.a1.unit31.lesson03.teach.neelee_ankhen_bhooree:
    title: Aggettivi prima di आँखें
    gloss: Occhi azzurri, occhi castani, occhi verdi.
    note: '*आँखें* è femminile, quindi l''aggettivo che lo precede finisce in *-ी*: *नीली आँखें*.'
  hi.a1.unit31.lesson03.teach.priya_kaisee_dikhtee:
    title: Com'è Priya fisicamente?
    gloss: Com'è Priya fisicamente?
    note: '*कैसी दिखती है?* («che aspetto ha?») è la domanda chiave: *कैसी* e *दिखती* sono al femminile per una donna, *कैसा* e *दिखता* al maschile per un uomo.'
  hi.a1.unit31.lesson03.teach.priya_ke_bal:
    title: Priya ha i capelli lunghi e biondi e gli occhi azzurri
    gloss: Priya ha i capelli lunghi e biondi e gli occhi azzurri.
    note: 'Una risposta modello: capelli e occhi uniti con *और*. Il possessore prende *के* con il plurale *बाल* e *की* con il femminile *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_bhasha_kaife:
    title: Priya presenta Nina
    gloss: 'Priya: Al caffè linguistico sta arrivando una ragazza nuova. Si chiama Nina.'
    note: '*आ रही है* («sta arrivando») introduce una persona nuova, e *उसका नाम ... है* dice il nome.'
  hi.a1.unit31.lesson04.teach.arjun_oke_vah:
    title: Arjun chiede com'è fisicamente
    gloss: 'Arjun: Ok! Com''è fisicamente?'
    note: '*वह देखने में कैसी है?* chiede «che aspetto ha?»; *वह* significa sia «lui» sia «lei».'
  hi.a1.unit31.lesson04.teach.priya_uska_kad:
    title: Priya descrive l'altezza e i capelli di Nina
    gloss: 'Priya: È bassa e ha i capelli corti e biondi.'
    note: 'Qui si uniscono altezza e capelli: *उसका कद छोटा है और उसके बाल छोटे और सुनहरे हैं*.'
  hi.a1.unit31.lesson04.teach.arjun_aur_uskee:
    title: Arjun chiede degli occhi
    gloss: 'Arjun: E i suoi occhi?'
    note: '*उसकी आँखें* significa «i suoi occhi»; *उसकी* è al femminile per concordare con *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_uskee_ankhen:
    title: Priya descrive gli occhi di Nina
    gloss: 'Priya: Ha gli occhi verdi.'
    note: '*हरी* finisce in *-ी* perché *आँखें* è femminile.'
  hi.a1.unit31.lesson04.teach.arjun_shukriya_tab:
    title: Arjun la riconoscerà
    gloss: 'Arjun: Grazie! Allora la riconoscerò.'
    note: '*पहचान लूँगा* («riconoscerò») è il futuro di *पहचानना*, e *उसे* significa «lei» come complemento.'
  hi.a1.unit31.lesson05.teach.vikram_aur_neha:
    title: Confronto tra Vikram e Neha
    gloss: Vikram e Neha sono fratello e sorella, ma hanno un aspetto diverso. Vikram è basso e ha i capelli corti e castani e gli occhi castani. Neha è più alta di Vikram e ha i capelli lunghi e castani e gli occhi verdi. E tu, che aspetto hai?
    note: Un breve confronto che riprende tutte le parole di colore e lunghezza viste finora e termina con la domanda chiave dell'unità rivolta a chi legge.
    glosses:
      भाई: fratello
      बहन: sorella
      दिखते: essere (di aspetto)
      अलग: diverso
      छोटा: basso
      छोटे: basso
      भूरे: castano
      बाल: i capelli
      भूरी: castano
      आँखें: gli occhi
      लंबी: più alto
      लंबे: lungo
      हरी: verde
      कैसे: come (come in «che aspetto hai?»)
  hi.a1.unit31.lesson05.teach.vikram_neha_se:
    title: Il confronto con से
    gloss: Vikram è più basso di Neha.
    note: 'Qui *से* significa «di» (secondo termine di paragone) e va dopo la persona con cui si confronta: *नेहा से छोटा*; l''aggettivo sta subito prima del verbo.'
  hi.a1.unit31.lesson05.teach.neha_ke_bal:
    title: Neha ha i capelli più lunghi di Vikram
    gloss: Neha ha i capelli più lunghi di Vikram.
    note: '*लंबे* concorda con il plurale *बाल*, e *विक्रम से* esprime il confronto.'
  hi.a1.unit31.lesson05.teach.mere_bal_chhote:
    title: Ho i capelli corti e castani
    gloss: Ho i capelli corti e castani.
    note: '*मेरे बाल छोटे और भूरे हैं* («ho i capelli corti e castani») è una frase modello per descrivere se stessi; *मेरे* concorda con il plurale *बाल*.'
  hi.a1.unit31.lesson06.teach.arjun_dekho_kya:
    title: Arjun nota Nina
    gloss: 'Arjun: Guarda, è Nina quella? Ha i capelli corti e biondi e gli occhi verdi.'
    note: '*देखो* («guarda») è l''imperativo informale rivolto a un amico.'
  hi.a1.unit31.lesson06.teach.priya_han_vahee:
    title: Priya conferma
    gloss: 'Priya: Sì, è proprio Nina!'
    note: Una conferma breve e naturale.
  hi.a1.unit31.lesson06.teach.neena_hay_kya:
    title: Nina saluta Arjun
    gloss: 'Nina: Ciao, sei Arjun?'
    note: '*क्या तुम अर्जुन हो?* è una semplice domanda informale rivolta a una persona della tua età.'
  hi.a1.unit31.lesson06.teach.arjun_han_tumse:
    title: Arjun risponde al saluto di Nina
    gloss: 'Arjun: Sì! Piacere di conoscerti, Nina.'
    note: '*तुमसे मिलकर अच्छा लगा* è la formula standard per quando si conosce qualcuno per la prima volta; la sensazione «capita» a te, quindi non serve la parola per «io».'
  hi.a1.unit31.lesson06.teach.neena_mujhe_bhee:
    title: Nina ricambia il saluto
    gloss: 'Nina: Piacere di conoscerti anch''io!'
    note: 'Chiude il dialogo: Arjun ha riconosciuto Nina grazie alla descrizione di Priya.'
