teaching:
  hi.a1.unit28.lesson01.teach.fon_karna:
    title: Chiamare
    gloss: chiamare
    note: L'infinito del verbo per fare una telefonata.
    example_gloss: Devo chiamarti.
  hi.a1.unit28.lesson01.teach.main_tumhen_fon:
    title: Dire che chiamerai
    gloss: Ti chiamo io.
    note: '*करूँगा* è il futuro di *करना* e in hindi si usa dove in italiano diciamo «ti chiamerò» o «ti chiamo». La persona chiamata prende *तुम्हें* («a te»).'
  hi.a1.unit28.lesson01.teach.hailo_main_priya:
    title: Rispondere al telefono
    gloss: Pronto, sono Priya.
    note: Al telefono si dice *मैं ... बोल रही हूँ* («sto parlando»); *रही* è femminile perché Priya è una donna.
  hi.a1.unit28.lesson01.teach.hailo_main_arjun:
    title: Arjun risponde allo stesso modo
    gloss: Pronto, sono Arjun.
    note: 'Stessa struttura con il maschile *रहा*: *मैं अर्जुन बोल रहा हूँ*, perché Arjun è un uomo.'
  hi.a1.unit28.lesson02.teach.main_kisse_bat:
    title: Chiedere chi sta chiamando
    gloss: Con chi parlo?
    note: '*किससे* («con chi») è *कौन* («chi») più *से*, e *से* indica la persona con cui si parla.'
  hi.a1.unit28.lesson02.teach.ap_priya_se:
    title: Presentarsi in modo formale
    gloss: Sta parlando con Priya.
    note: '*आप* è il «Lei» di cortesia, per uno sconosciuto. In *प्रिया से बात कर रहे हैं* *से* viene dopo il nome, e *हैं* va con *आप*.'
  hi.a1.unit28.lesson03.teach.kya_tum_yah:
    title: Chiedere di ripetere
    gloss: Puoi ripetere?
    note: '*सकते हो* significa «puoi» e segue il verbo principale: *कह सकते हो*. *क्या* all''inizio forma la domanda.'
  hi.a1.unit28.lesson03.teach.itna_tez_mat:
    title: Chiedere a qualcuno di rallentare
    gloss: Non parlare così in fretta, per favore.
    note: '*मत बोलो* è il «non parlare» amichevole con *तुम*, e *इतना तेज़* significa «così veloce».'
  hi.a1.unit28.lesson03.teach.mujhe_tumharee_avaz:
    title: Dire che non senti bene
    gloss: Non ti sento bene.
    note: 'L''hindi dice «la tua voce non viene»: *मुझे तुम्हारी आवाज़ नहीं आ रही है*. Chi parla prende *मुझे*, e la voce è il soggetto.'
  hi.a1.unit28.lesson04.teach.maisej:
    title: Messaggio
    gloss: il messaggio
    note: '*मैसेज* è un prestito molto comune ed è maschile: *एक मैसेज*, *यह मैसेज ... का है*.'
    example_gloss: Il messaggio è di Priya.
  hi.a1.unit28.lesson04.teach.main_tumhen_ek:
    title: Dire che manderai un messaggio
    gloss: Ti mando un messaggio.
    note: 'L''ordine è persona, poi cosa, poi verbo: *तुम्हें एक मैसेज भेजूँगा*. *भेजना* significa «mandare».'
  hi.a1.unit28.lesson04.teach.main_tumhen_bad:
    title: Dire che richiamerai
    gloss: Ti chiamo più tardi.
    note: '*वापस फ़ोन करना* significa «richiamare», con *वापस* prima di *फ़ोन करना*; *बाद में* significa «più tardi».'
  hi.a1.unit28.lesson05.teach.arjun_hay_priya:
    title: Leggi uno scambio di messaggi
    gloss: 'Arjun: Ciao Priya, puoi chiamarmi? Devo dirti una cosa importante. Priya: Sì, certo, ti richiamo tra cinque minuti.'
    note: Cerca cosa chiede Arjun, perché lo chiede e quando Priya dice che richiamerà.
    glosses:
      हाय: ciao
      सकती: puoi
      फ़ोन: chiamare
      ज़रूरी: 'importante (come in: una cosa importante da dire)'
      कुछ: qualcosa
      बतानी: raccontare
      ज़रूर: certo
      करूँगी: chiamerò
      पाँच: cinque
      मिनट: minuti
      वापस: restituire
  hi.a1.unit28.lesson06.teach.arjun_hailo_main:
    title: Arjun risponde alla chiamata
    gloss: 'Arjun: Pronto, sono Arjun.'
    note: Chi risponde dice prima il proprio nome con *मैं ... बोल रहा हूँ*, qui con il maschile *रहा*.
  hi.a1.unit28.lesson06.teach.priya_hay_arjun:
    title: Priya si presenta
    gloss: 'Priya: Ciao Arjun, sono Priya. Arjun: Che bello che mi hai chiamato!'
    note: '*अच्छा हुआ तुमने फ़ोन किया* significa «meno male che hai chiamato»; *तुमने ... किया* è il passato con *ने*.'
  hi.a1.unit28.lesson06.teach.priya_tumharee_pahlee:
    title: Priya chiede del turno
    gloss: 'Priya: Com''è andato il tuo primo turno?'
    note: '*कैसी रही* chiede «com''è andata»; *कैसी* è femminile perché *शिफ़्ट* è femminile.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_achchhee:
    title: Arjun racconta la bella notizia
    gloss: 'Arjun: È andato benissimo, meglio di quanto pensassi.'
    note: '*अच्छी रही* («è andata bene») concorda con il femminile *शिफ़्ट*, e *जितना मैंने सोचा था उससे भी बेहतर* significa «ancora meglio di quanto pensassi».'
  hi.a1.unit28.lesson06.teach.vah_narvas_tha:
    title: 'था e थी: era'
    gloss: Lui era nervoso, lei era felice.
    note: '*था* è «era» per un soggetto maschile e *थी* per un soggetto femminile; la desinenza concorda con chi o che cosa è descritto.'
  hi.a1.unit28.lesson06.teach.priya_yah_sunkar:
    title: Priya è orgogliosa
    gloss: 'Priya: Che bello sentirlo! Sono fiera di te.'
    note: '*तुम पर गर्व है* («l''orgoglio è su di te») usa *पर*, e chi è orgoglioso prende *मुझे*.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_shukriya:
    title: Arjun è commosso
    gloss: 'Arjun: Grazie mille, per me significa molto.'
    note: '*मेरे लिए* significa «per me», e *इसका बहुत मतलब है* è «significa molto».'
  hi.a1.unit28.lesson06.teach.uskee_pahlee_shift:
    title: Il suo
    gloss: Il suo primo turno è andato molto bene.
    note: '*उसकी* significa «suo» (di lui o di lei, la stessa parola per entrambi) e concorda con il femminile *शिफ़्ट*.'
