teaching:
  hi.a1.unit32.lesson01.teach.janvar_paltoo_janvar:
    title: Animale, animale domestico
    gloss: l'animale / un animale domestico
    note: '*जानवर* è la parola generica per «animale», e *पालतू जानवर* («animale addomesticato») significa animale domestico.'
    example_gloss:
    - Il cane è un animale.
    - Il cane è anche un animale domestico.
  hi.a1.unit32.lesson01.teach.kutta_billee:
    title: Cane e gatto
    gloss: il cane / il gatto
    example_gloss:
    - Priya ha un cane.
    - Vikram ha un gatto.
  hi.a1.unit32.lesson01.teach.machhlee_chiriya:
    title: Pesce e uccello
    gloss: il pesce / l'uccello
    example_gloss:
    - Il nonno ha un pesce.
    - Nina ha un uccellino.
  hi.a1.unit32.lesson01.teach.kya_tumhare_pas:
    title: Hai un animale domestico?
    gloss: Hai un animale domestico?
    note: '*तुम्हारे पास ... है?* («presso di te ... c''è?») significa «hai ...?», e *कोई* («qualche») lascia la domanda aperta.'
  hi.a1.unit32.lesson01.teach.han_mere_pas:
    title: Sì, ho un cane
    gloss: Sì, ho un cane.
    note: Una semplice risposta affermativa con il lessico nuovo di questa unità.
  hi.a1.unit32.lesson01.teach.naheen_mere_pas:
    title: No, non ho un animale domestico
    gloss: No, non ho un animale domestico.
    note: '*कोई ... नहीं है* («non c''è nessun ...») dice che non ne hai.'
  hi.a1.unit32.lesson01.teach.mere_pas_koee:
    title: कोई ... नहीं
    gloss: Non ho un animale domestico.
    note: '*कोई* («qualche») più *नहीं है* nega il possesso di qualcosa: *मेरे पास कोई पालतू जानवर नहीं है*.'
  hi.a1.unit32.lesson02.teach.ghumane_le_jana:
    title: Portare a spasso (un animale)
    gloss: portare a spasso (un animale)
    note: '*घुमाने ले जाना* («portare a fare un giro») è il modo hindi per dire «portare a spasso un animale»; *घुमाने* è seguito da *ले जाना*.'
    example_gloss: Porto a spasso il cane ogni giorno.
  hi.a1.unit32.lesson02.teach.vah_kutte_ko:
    title: घुमाने ले जाना
    gloss: Porta il cane a spasso.
    note: L'animale prende *को* (*कुत्ते को*) e *घुमाने ले जाती है* viene per ultimo; *ले जाना* («portare con sé») resta unito, in due parole.
  hi.a1.unit32.lesson02.teach.khana_dena:
    title: Dare da mangiare
    gloss: dare da mangiare
    example_gloss: Do da mangiare al gatto ogni giorno.
  hi.a1.unit32.lesson02.teach.ke_sath_khelna:
    title: Giocare con
    gloss: giocare con
    example_gloss: Vikram gioca con il suo gatto.
  hi.a1.unit32.lesson02.teach.main_roz_kutte:
    title: Porto a spasso il cane ogni giorno
    gloss: Porto a spasso il cane ogni giorno.
    note: '*रोज़* («ogni giorno») viene prima dell''oggetto: *रोज़ कुत्ते को घुमाने ले जाता हूँ*.'
  hi.a1.unit32.lesson02.teach.main_roz_billee:
    title: Do da mangiare al gatto ogni giorno
    gloss: Do da mangiare al gatto ogni giorno.
    note: '*खाना देना* («dare da mangiare») indica con *को* chi riceve il cibo: *बिल्ली को खाना देता हूँ*.'
  hi.a1.unit32.lesson03.teach.ek_kutta_do:
    title: Forme del plurale
    gloss: Un cane, due cani; un gatto, due gatti. Un nome maschile che termina in *-आ* al plurale cambia in *-ए* (*कुत्ता* → *कुत्ते*), mentre un nome femminile che termina in *-ई* aggiunge *-याँ* (*बिल्ली* → *बिल्लियाँ*).
    note: Lo schema regolare del plurale in hindi, presentato qui per la prima volta con i nomi di animali come esempi.
  hi.a1.unit32.lesson03.teach.kutte_billiyan:
    title: Cani e gatti
    gloss: cani / gatti
    example_gloss:
    - Arjun ama i cani.
    - Neha ama i gatti.
  hi.a1.unit32.lesson03.teach.machhliyan_chiriyan:
    title: Pesci e uccelli (plurale)
    gloss: pesci / uccelli
    example_gloss:
    - Adoro i pesci.
    - Il nonno adora gli uccelli.
  hi.a1.unit32.lesson03.teach.mujhe_janvar_bahut:
    title: Adoro gli animali
    gloss: Adoro gli animali.
    note: '*मुझे जानवर बहुत पसंद हैं* (letteralmente «a me gli animali sono molto graditi») significa «amo gli animali»; *हैं* è plurale perché *जानवर* è plurale.'
  hi.a1.unit32.lesson03.teach.neha_ko_billiyan:
    title: Neha ama i gatti, ma non ha animali domestici
    gloss: Neha ama i gatti, ma non ha un animale domestico.
    note: Prepara il contrasto su cui è costruita la lettura della lezione 5.
  hi.a1.unit32.lesson04.teach.arjun_kya_tumhare:
    title: Arjun chiede degli animali domestici
    gloss: 'Arjun: Hai un animale domestico, Priya?'
  hi.a1.unit32.lesson04.teach.priya_han_mere:
    title: Priya ha un cane
    gloss: 'Priya: Sì, ho un cane.'
  hi.a1.unit32.lesson04.teach.arjun_vah_kaisa:
    title: Arjun chiede com'è il cane
    gloss: 'Arjun: Com''è?'
    note: '*वह कैसा दिखता है?* vale anche per gli animali, e *कैसा* è maschile perché il cane è maschio.'
  hi.a1.unit32.lesson04.teach.priya_uske_bal:
    title: Priya descrive il suo cane
    gloss: 'Priya: Ha il pelo marrone ed è piccolo.'
    note: Riprende il lessico dei colori dei capelli e delle dimensioni dell'unità sull'aspetto fisico, ora per descrivere il pelo di un animale invece dei capelli di una persona.
  hi.a1.unit32.lesson04.teach.vah_mera_kutta:
    title: वह per gli animali
    gloss: Quello è il mio cane. Mi piace molto.
    note: '*वह* e *उसे* si usano sia per gli animali sia per le persone; in hindi qui non esiste una parola separata per «esso».'
  hi.a1.unit32.lesson04.teach.arjun_kya_tum:
    title: Arjun chiede delle passeggiate
    gloss: 'Arjun: Lo porti a spasso ogni giorno?'
  hi.a1.unit32.lesson04.teach.priya_han_main:
    title: Priya descrive la sua routine
    gloss: 'Priya: Sì, lo porto a spasso ogni giorno e gli do da mangiare.'
  hi.a1.unit32.lesson05.teach.arjun_aur_neha:
    title: Arjun, Neha e Vikram parlano di animali
    gloss: 'Arjun e Neha amano entrambi gli animali, ma nessuno dei due ha un animale domestico. Arjun ama i cani e Neha ama i gatti. Vikram invece ha un animale domestico: un gatto. Gioca spesso con il suo gatto e gli dà da mangiare ogni giorno. Tu hai un animale domestico?'
    note: 'Contrappone l''amare gli animali all''averne davvero uno: è lo scopo comunicativo dell''obiettivo.'
    glosses:
      पसंद: adorare / piacere molto
      दोनों: entrambi
      जानवर: animali
      किसी: qualcuno di loro
      पालतू: animale domestico
      कुत्ते: cani
      बिल्लियाँ: gatti
      बिल्ली: gatto
      खेलता: gioca
      देता: dà
      रोज़: ogni / tutti
      खाना: cibo
  hi.a1.unit32.lesson05.teach.vikram_aksar_apnee:
    title: Vikram gioca spesso con il suo gatto
    gloss: Vikram gioca spesso con il suo gatto.
    note: '*अक्सर* («spesso») viene prima del verbo, e *अपनी* concorda con il femminile *बिल्ली*.'
  hi.a1.unit32.lesson05.teach.mujhe_kutte_bahut:
    title: Adoro i cani. Non ho un animale domestico.
    gloss: Adoro i cani. Non ho un animale domestico.
    note: Una risposta modello di due frasi, da riutilizzare per l'esercizio di scrittura dell'unità.
  hi.a1.unit32.lesson06.teach.priya_neena_kya:
    title: Priya chiede a Nina
    gloss: 'Priya: Nina, anche tu hai un animale domestico?'
  hi.a1.unit32.lesson06.teach.neena_han_mere:
    title: Nina ha un uccellino di nome Pico
    gloss: 'Nina: Sì, ho un uccellino. Si chiama Pico.'
    note: '*उसका नाम पिको है* («il suo nome è Pico») usa *का* perché *नाम* è maschile.'
  hi.a1.unit32.lesson06.teach.arjun_vah_kitna:
    title: Arjun reagisce
    gloss: 'Arjun: Che bello! Che cosa fai ogni giorno con lui?'
  hi.a1.unit32.lesson06.teach.neena_main_use:
    title: Nina gli dà da mangiare ogni giorno
    gloss: 'Nina: Gli do da mangiare ogni giorno.'
  hi.a1.unit32.lesson06.teach.arjun_mujhe_bhee:
    title: Anche ad Arjun piacciono gli uccelli
    gloss: 'Arjun: Anche a me piacciono molto gli uccelli.'
  hi.a1.unit32.lesson06.teach.priya_kitna_achchha:
    title: Priya conclude la conversazione
    gloss: 'Priya: Che bello che a tutti e tre noi piacciano tanto gli animali!'
    note: Chiude il cerchio sulle informazioni sugli animali dei tre personaggi di questa unità.
