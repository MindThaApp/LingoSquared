teaching:
  hi.a1.unit16.lesson01.teach.tum_ho_review:
    title: 'Ripasso: tu, bene, sei'
    gloss: tu (informale), bene, sei
    note: Un breve ripasso delle parole che servono per chiedere a un amico come si sente.
    example_gloss: Come stai?
  hi.a1.unit16.lesson01.teach.mujhe_hai_review:
    title: 'Ripasso: a me, è'
    gloss: a me / per me, è
    note: La copula che serve per costruire la struttura dei sintomi di questa lezione.
    example_gloss: Ho da fare.
  hi.a1.unit16.lesson01.teach.tum_theek_ho_phrase:
    title: Tutto bene?
    gloss: Tutto bene?
    note: La domanda iniziale dell'unità, usata per vedere come sta un amico.
  hi.a1.unit16.lesson01.teach.main_hoon_nahin_review:
    title: 'Ripasso: io, sono, no / non'
    gloss: io, sono, no / non
    note: Serve per rispondere in negativo a «Tutto bene?».
    example_gloss: Sto bene.
  hi.a1.unit16.lesson01.teach.sir:
    title: Testa
    gloss: testa
    note: Un nuovo nome, necessario per il primo sintomo di questa unità.
    example_gloss: Ho la testa grande.
  hi.a1.unit16.lesson01.teach.dard:
    title: Dolore
    gloss: dolore
    note: 'Un nuovo sostantivo. Unito a una parte del corpo, indica un dolore specifico: vedi la nota di grammatica di questa unità.'
    example_gloss: Ho dolore.
  hi.a1.unit16.lesson01.teach.mujhe_sir_dard_hai_phrase:
    title: Ho mal di testa.
    gloss: Ho mal di testa.
    note: La prima frase completa dell'unità per descrivere un sintomo.
  hi.a1.unit16.lesson01.teach.grammar_symptom_hai:
    title: Mujhe + sintomo + hai
    gloss: 'Lo schema mujhe + sostantivo + hai l''hai già imparato nell''unità 11 (mujhe kaam hai = ho da fare). Ora si usa anche per i sintomi: मुझे सिर दर्द है significa «ho mal di testa». सिर दर्द (सिर = testa, दर्द = dolore) insieme formano «mal di testa». Non è una grammatica nuova: è lo stesso schema di prima.'
    note: Presenta un secondo uso di uno schema già studiato (dativo + sostantivo + hai), richiamando l'unità precedente prima di applicarlo ai sintomi.
  hi.a1.unit16.lesson01.teach.bukhar:
    title: Febbre
    gloss: febbre
    note: Un nuovo sostantivo, il secondo sintomo di questa unità.
    example_gloss: Hai la febbre?
  hi.a1.unit16.lesson01.teach.mujhe_bukhar_hai_phrase:
    title: Ho la febbre.
    gloss: Ho la febbre.
    note: Lo stesso schema dativo + sostantivo + hai, applicato al secondo sintomo della lezione.
  hi.a1.unit16.lesson02.teach.tumhein_jaana_review:
    title: 'Ripasso: a te, andare'
    gloss: a te / per te, andare
    note: 'Entrambe già viste (unità 6 e unità 15): le riusiamo qui per parlare dell''andare dal medico.'
    example_gloss:
    - Che cosa desideri?
    - Devo andare alla stazione.
  hi.a1.unit16.lesson02.teach.ke_paas_review:
    title: 'Ripasso: vicino / presso'
    gloss: vicino a / presso (un luogo)
    note: 'Visto per la prima volta nell''unità 8: lo riprendiamo qui e, nella nota di grammatica di questa lezione, ne incontri un terzo significato.'
    example_gloss: La banca è vicino alla scuola.
  hi.a1.unit16.lesson02.teach.doctor:
    title: Medico
    gloss: medico
    note: Un nuovo sostantivo, l'argomento principale di questa lezione.
    example_gloss: Il medico è bravo.
  hi.a1.unit16.lesson02.teach.mujhe_doctor_ke_paas_jana_hai_phrase:
    title: Devo andare dal medico.
    gloss: Devo andare dal medico.
    note: Unisce *ke paas* alla costruzione dell'obbligo *mujhe...jana hai* dell'unità 15.
  hi.a1.unit16.lesson02.teach.grammar_ke_paas_third_sense:
    title: 'Ke paas: un terzo significato'
    gloss: 'I primi due significati di के पास li hai già visti: vicinanza (unità 8: बैंक स्कूल के पास है) e possesso (unità 2: मेरे पास एक किताब है). Ora un terzo uso: andare da una PERSONA, cioè andare a trovarla o a consultarla. डॉक्टर के पास जाना है significa «devo andare dal medico». Anche lo schema मुझे... जाना है è ripreso dall''unità 15.'
    note: Richiama i due significati precedenti con il numero dell'unità prima di introdurre il terzo, e ricorda il riutilizzo della costruzione dell'obbligo.
  hi.a1.unit16.lesson02.teach.aaraam:
    title: Riposo
    gloss: riposarsi
    note: Un nuovo sostantivo, il primo consiglio di questa unità.
    example_gloss: Ho bisogno di riposo.
  hi.a1.unit16.lesson02.teach.chahiye_review:
    title: 'Ripasso: volere / aver bisogno'
    gloss: volere / aver bisogno di
    note: 'Visto per la prima volta nell''unità 6: lo riprendiamo qui per dire di che cosa qualcuno ha bisogno.'
    example_gloss: Vorrei un tè.
  hi.a1.unit16.lesson02.teach.tumhein_aaraam_chahiye_phrase:
    title: Hai bisogno di riposo.
    gloss: Hai bisogno di riposo.
    note: Il modello *tumhein...chahiye*, già visto, applicato al nuovo sostantivo di questa lezione.
  hi.a1.unit16.lesson02.teach.dawa:
    title: Medicina
    gloss: medicina
    note: Un nuovo sostantivo, il secondo consiglio di questa unità.
    example_gloss: Ho bisogno di una medicina.
  hi.a1.unit16.lesson02.teach.tumhein_dawa_chahiye_phrase:
    title: Hai bisogno di una medicina.
    gloss: Hai bisogno di una medicina.
    note: Lo stesso schema con *chahiye* applicato alla medicina.
  hi.a1.unit16.lesson02.teach.jaao_aur_review:
    title: 'Ripasso: vai!, e'
    gloss: vai!, e
    note: 'Entrambe già viste (unità 9 e unità 1/2): le riusiamo qui per collegare due consigli.'
    example_gloss:
    - Vada dritto.
    - Vorrei tè e caffè.
  hi.a1.unit16.lesson02.teach.karo_grammar:
    title: 'Karo: la regola dell''imperativo in -o'
    gloss: 'करो segue la stessa regola dell''imperativo con tum già vista (जाओ, मुड़ो, बताओ, गिनो: tutti terminano in «-o»). Qui nasce da करना (quello di माफ़ करना, unità 11): dalla radice कर + «-o» si ottiene करो, cioè «fai!». आराम करो significa «riposati!».'
    note: Estensione esplicita della regola dell'imperativo già nota, applicata a un verbo che il lettore conosce già all'infinito.
  hi.a1.unit16.lesson02.teach.aaraam_karo_phrase:
    title: Riposati!
    gloss: Riposati!
    note: Il nuovo imperativo applicato al primo consiglio dell'unità.
  hi.a1.unit16.lesson02.teach.aaraam_karo_aur_doctor_ke_paas_jaao_phrase:
    title: Riposati e vai dal medico.
    gloss: Riposati e vai dal medico.
    note: Unisce i due consigli della lezione in un'unica istruzione naturale, anticipando la scheda di lettura della lezione 3.
  hi.a1.unit16.lesson03.teach.dialogue.line01:
    title: Priya chiede ad Arjun se sta bene
    gloss: Arjun, stai bene?
  hi.a1.unit16.lesson03.teach.dialogue.line02:
    title: Arjun dice di avere mal di testa e febbre
    gloss: No, ho mal di testa e la febbre.
  hi.a1.unit16.lesson03.teach.dialogue.line03:
    title: Priya dice che ha bisogno di riposo
    gloss: Non va bene. Hai bisogno di riposo.
  hi.a1.unit16.lesson03.teach.dialogue.line04:
    title: Arjun vuole anche una medicina
    gloss: Sì, ma ho bisogno anche di una medicina.
  hi.a1.unit16.lesson03.teach.dialogue.line05:
    title: Priya dice che deve andare dal medico
    gloss: Va bene. Devi andare dal medico.
  hi.a1.unit16.lesson03.teach.dialogue.line06:
    title: Arjun ringrazia Priya
    gloss: Va bene, grazie.
  hi.a1.unit16.lesson03.teach.dialogue.line07:
    title: Priya gli dice di riposarsi
    gloss: Riposati!
  hi.a1.unit16.lesson03.teach.dialogue.line08:
    title: Arjun è d'accordo
    gloss: Va bene.
  hi.a1.unit16.lesson03.teach.grammar_summary:
    title: Tre regole principali
    gloss: 'Le tre regole principali di questa unità: (1) मुझे/तुम्हें + sintomo + है indica un disturbo (es. मुझे बुखार है); (2) तुम्हें/मुझे + cosa + चाहिए indica un bisogno (es. तुम्हें आराम चाहिए); (3) X के पास जाना है dice da chi è necessario andare (es. डॉक्टर के पास जाना है).'
    note: Riepilogo finale che riunisce la grammatica dell'intera unità, come la nota di grammatica conclusiva dell'unità 15.
  hi.a1.unit16.lesson03.teach.advice_reading:
    title: Leggere un consiglio
    gloss: Riposati. Vai dal medico.
    note: Una breve istruzione diretta, come nei consigli parlati reali, che riprende esattamente i fatti già emersi nel dialogo, senza nuove informazioni.
    glosses:
      आराम: riposa
      करो: fai (imperativo, da करना)
      डॉक्टर: medico
      जाओ: vai (imperativo, da जाना)
