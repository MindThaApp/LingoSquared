answer_policy:
  mujhe_noun_hai_symptom: This unit's central grammar point extends the dative + noun + है construction (मुझे/तुम्हें + noun + है) to symptom statements, e.g. "मुझे सिर दर्द है" (I have a headache). A typed answer that drops है entirely, or that appends हैं instead of है (है is invariant here -- it agrees with the following noun, not the दात subject), should be marked incorrect -- this is the exact point being tested.
  ke_paas_sense: '"डॉक्टर के पास जाना है" uses के पास in its third disclosed sense (at a person''s place), distinct from unit08''s "near" and "possession" senses. A typed answer omitting के पास entirely (e.g. just "मुझे डॉक्टर जाना है") should be marked incorrect, since के पास is the load-bearing piece that makes the sentence mean "to the doctor(''s)" rather than something ungrammatical.'
  karo_imperative: '"करो" is a regular तुम-imperative (कर + ओ), the same formation rule already taught for जाओ/मुड़ो/बताओ/गिनो in unit 9. A typed answer using a different, unlearned imperative form should be marked incorrect as a real error, not tolerated as a minor typo.'
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. None of this unit's new words (सिर, दर्द, बुखार, डॉक्टर, आराम, दवा, करो) carry any nasalization mark at all, verified via direct codepoint check -- no tolerance rule is needed for a nasalization mark that was never present.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation. For any exercise asking the learner to state their own symptom or need, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
