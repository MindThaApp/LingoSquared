    gloss: Hai internet a casa?
  hi.a1.unit35.lesson01.teach.main_har_din:
    title: Uso il cellulare tutti i giorni
    gloss: Uso il cellulare ogni giorno.
    note: '*हर दिन* («ogni giorno») è un''espressione di tempo che va prima del verbo.'
  hi.a1.unit35.lesson02.teach.aip:
    title: L'app
    gloss: l'app
    example_gloss: Ho un'app per le previsioni del tempo.
  hi.a1.unit35.lesson02.teach.maisej:
    title: Il messaggio
    gloss: il messaggio
    example_gloss: Mando un messaggio con l'app.
  hi.a1.unit35.lesson02.teach.maisej_bhejte_bhee:
    title: Il verbo segue la persona
    gloss: 'Un *मैसेज* si può mandare o leggere, e la desinenza del verbo segue la persona: *मैं भेजता हूँ*, *तुम पढ़ते हो*, *वह पढ़ता है*.'
    note: Collega la parola nuova al sostantivo composto già visto nell'unità sul tempo atmosferico.
  hi.a1.unit35.lesson02.teach.priya_aip_se:
    title: Priya manda un messaggio con l'app
    gloss: Priya manda un messaggio con l'app.
    note: '*ऐप से* significa «con l''app»: *से* indica lo strumento che si usa.'
  hi.a1.unit35.lesson02.teach.arjun_maisej_parhta:
    title: Arjun legge il messaggio
    gloss: Arjun legge il messaggio.
  hi.a1.unit35.lesson03.teach.chek_karna:
    title: Cercare
    gloss: cercare (informazioni)
    example_gloss: Cerco le previsioni del tempo.
  hi.a1.unit35.lesson03.teach.chek_karna_men:
    title: Cambia solo करना
    gloss: 'In *चेक करना* la parola *चेक* resta uguale e cambia solo *करना* secondo la persona: *मैं चेक करता हूँ*, *तुम चेक करते हो*. *इस्तेमाल करना* funziona allo stesso modo.'
    note: 'Molti verbi hindi sono formati da un nome o un prestito più *करना*: impara la prima parola una volta sola e cambia solo *करना*.'
  hi.a1.unit35.lesson03.teach.vikram_mausam_ka:
    title: Vikram controlla le previsioni del tempo
    gloss: Vikram controlla le previsioni del tempo.
  hi.a1.unit35.lesson03.teach.phir_vah_daurne:
    title: Poi va a correre
    gloss: Poi va a correre.
    note: '*दौड़ने जाना* («andare a correre») mette il verbo nella forma in *-ने* prima di *जाना*.'
  hi.a1.unit35.lesson04.teach.priya_chalo_shanivar:
    title: Priya fa una proposta
    gloss: 'Priya: Facciamo un po'' di sport sabato alle dieci?'
  hi.a1.unit35.lesson04.teach.arjun_achchha_aidiya:
    title: Arjun accetta
    gloss: 'Arjun: Bella idea! Controllo le previsioni del tempo.'
    note: '*अच्छा आइडिया!* è un modo rapido e amichevole per dire «bella idea».'
  hi.a1.unit35.lesson04.teach.arjun_shanivar_ko:
    title: Arjun controlla il tempo
    gloss: 'Arjun: Sabato c''è il sole!'
    note: 'In hindi non c''è un soggetto come «it»: si dice *शनिवार को धूप है* (letteralmente «sabato sole è»).'
  hi.a1.unit35.lesson04.teach.vikram_mujhe_maisej:
    title: Vikram vede il messaggio
    gloss: 'Vikram: Vedo il messaggio. Ci vediamo sabato!'
  hi.a1.unit35.lesson04.teach.phir_milenge_yah:
    title: फिर मिलेंगे e giorno + को
    gloss: 'Conosci già *फिर मिलेंगे!* («ci rivediamo»). Per indicare un giorno, metti *को* dopo il giorno: *शनिवार को मिलते हैं!*, *सोमवार को मिलते हैं!*'
    note: Estende lo schema di saluto dell'unità sui saluti a un giorno preciso.
  hi.a1.unit35.lesson05.teach.priya_har_din:
    title: Chi usa cosa?
    gloss: Priya chiama Arjun ogni giorno. Usa il telefono, non un'app. Arjun non ha un computer a casa, ma usa internet sul telefono. Vikram ogni mattina controlla le previsioni del tempo. Poi va a correre. Neha scrive spesso un messaggio a Priya. Anche tu usi il telefono ogni giorno?
    note: Confronta le abitudini dei quattro personaggi con i dispositivi, come la lettura di confronto dell'unità sullo sport.
    glosses:
      कॉल: chiama
      हर: ogni / tutti
      दिन: giorno
      इस्तेमाल: usa
      फ़ोन: cellulare
      ऐप: app
      कंप्यूटर: computer
      घर: a casa
      इंटरनेट: internet
      चेक: cerca
      सुबह: mattina
      अनुमान: previsioni del tempo
      जाता: va
      दौड़ने: correre
      भेजती: manda
      अक्सर: spesso
      मैसेज: messaggio
      करते: uso
  hi.a1.unit35.lesson05.teach.vikram_har_subah:
    title: Vikram controlla le previsioni ogni mattina
    gloss: Vikram controlla le previsioni del tempo ogni mattina.
  hi.a1.unit35.lesson05.teach.neha_aksar_priya:
    title: Neha scrive spesso a Priya
    gloss: Neha manda spesso un messaggio a Priya.
  hi.a1.unit35.lesson06.teach.priya_mujhe_maisej:
    title: Priya conferma il programma
    gloss: 'Priya: Vedo il messaggio. Facciamo un po'' di sport al parco sabato alle dieci?'
  hi.a1.unit35.lesson06.teach.arjun_han_aur:
    title: Arjun conferma il tempo
    gloss: 'Arjun: Sì, e sabato c''è il sole!'
  hi.a1.unit35.lesson06.teach.vikram_tab_main:
    title: Il programma di Vikram
    gloss: 'Vikram: Allora andrò a correre. Dopo giocherò anche a calcio.'
    note: '*उसके बाद* («dopo di che») introduce il secondo passo, e *भी* significa «anche».'
  hi.a1.unit35.lesson06.teach.neha_mujhe_tairna:
    title: Il programma di Neha
    gloss: 'Neha: Preferisco nuotare, ma verrò anche al parco.'
    note: Per dire cosa si preferisce si usa la struttura *मुझे ... पसंद है*, e *ज़्यादा* aggiunge «di più».
  hi.a1.unit35.lesson06.teach.priya_barhiya_shanivar:
    title: Priya chiude la conversazione
    gloss: 'Priya: Perfetto! Ci vediamo sabato al parco!'
    note: Chiude in una sola battuta la conversazione di questa unità e il programma dell'unità sullo sport.
