    title: Dire quale colore vuoi
    gloss: '*मुझे* + colore + *चाहिए* dice quale colore vuoi: *मुझे गुलाबी चाहिए* (vorrei il rosa).'
    note: '*चाहिए* non cambia mai. I colori che terminano in *-आ*, come *पीला*, cambiano con il nome (*पीले फूल*), mentre *लाल*, *गुलाबी* e *सफ़ेद* restano invariati.'
