    title: Nina e Priya comprano dei fiori
    gloss: Nina e Priya vanno al mercato dei fiori il sabato. Quale colore vuole Priya? Priya vorrebbe il rosso. Quale colore vuole Nina? Nina vorrebbe il giallo. Comprano cinque fiori. Costano cento rupie. I fiori sono bellissimi!
    note: Riassume la gita del sabato al mercato dei fiori.
