teaching:
  hi.a1.unit26.lesson01.teach.jaiket_svetar:
    title: Cappotto, maglione
    gloss: il cappotto, il maglione
    note: '*जैकेट* è femminile e *स्वेटर* è maschile, come si vede dalle parole che li accompagnano: *मेरी जैकेट*, *मेरा स्वेटर*.'
    example_gloss:
    - Cerco un cappotto.
    - Ho un maglione.
  hi.a1.unit26.lesson01.teach.paint_joote:
    title: Pantaloni, scarpe
    gloss: i pantaloni, le scarpe
    note: '*पैंट* è una sola parola per un paio di pantaloni (*मेरी पैंट*), e *जूते* è il plurale di *जूता*: un nome maschile in *-आ* passa a *-ए* al plurale.'
    example_gloss:
    - Cerco dei pantaloni.
    - Cerco delle scarpe.
  hi.a1.unit26.lesson01.teach.main_ek_jaiket:
    title: Dire che cosa cerchi
    gloss: Cerco un cappotto.
    note: 'Il verbo sta in fondo: *मैं एक जैकेट ढूँढ़ रहा हूँ*. *रहा हूँ* dà il senso di «sto cercando» (azione in corso), e *रहा* è la forma maschile (una donna dice *रही*).'
  hi.a1.unit26.lesson02.teach.saiz:
    title: Taglia
    gloss: la taglia
    note: '*साइज़* è un nome maschile, quindi anche le parole che lo accompagnano sono al maschile: *मेरा साइज़*.'
    example_gloss: Che taglia porti?
  hi.a1.unit26.lesson02.teach.apka_saiz_kya:
    title: Chiedere la taglia
    gloss: Che taglia porti?
    note: '*कौन सा* («quale») chiede di scegliere tra più possibilità, e *सा* concorda con il nome: *कौन सा साइज़*, ma *कौन सी जैकेट*. *आप* è il «Lei» di cortesia rivolto a un commesso.'
  hi.a1.unit26.lesson02.teach.mera_saiz_em:
    title: Dire la propria taglia
    gloss: Porto la taglia M.
    note: 'Qui l''hindi non usa un verbo per «avere»: *मेरा साइज़ एम है* significa alla lettera «la mia taglia è M», e *मेरा* concorda con il maschile *साइज़*.'
  hi.a1.unit26.lesson03.teach.kala_neela:
    title: Nero, blu
    gloss: nero, blu
    note: I due aggettivi di colore di base di questa lezione.
    example_gloss:
    - Voglio il cappotto nero.
    - Ha anche questo in blu?
  hi.a1.unit26.lesson03.teach.mujhe_vah_jaiket:
    title: Chiedere un colore
    gloss: Voglio il cappotto nero.
    note: '*मुझे ... चाहिए* è il modo hindi di dire «voglio»: il desiderio capita «a me» (*मुझे*), e ciò che si vuole sta subito prima di *चाहिए*.'
  hi.a1.unit26.lesson03.teach.kya_apke_pas:
    title: Chiedere un altro colore
    gloss: Ha anche questo in blu?
    note: '*आपके पास ... है?* («presso di Lei ... c''è?») è il modo cortese per chiedere «Avete ...?», e *भी* («anche») segue la parola a cui si aggiunge.'
  hi.a1.unit26.lesson04.teach.kya_yah_jaiket:
    title: Chiedere se calza bene
    gloss: Questo cappotto ti sta bene?
    note: 'L''hindi dice che i vestiti «vengono bene»: *ठीक आती है*. Il verbo concorda con la cosa, quindi *जैकेट* (femminile) vuole *आती*, mentre *स्वेटर* (maschile) vorrebbe *आता*.'
  hi.a1.unit26.lesson04.teach.yah_ekdam_theek:
    title: Confermare che calza bene
    gloss: Mi sta bene.
    note: '*एकदम* («del tutto») rende «mi sta perfettamente»; *आती है* concorda con il femminile *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_chhotee:
    title: Troppo piccolo
    gloss: È troppo piccolo.
    note: '*बहुत* sta prima dell''aggettivo e qui dà il senso di «troppo»: *बहुत छोटी*. L''aggettivo concorda con il femminile *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_baree:
    title: Troppo grande
    gloss: È troppo grande.
    note: 'Stesso schema con *बड़ी*: *बड़ा* diventa *बड़ी* con un nome femminile, quindi *बहुत बड़ी*.'
  hi.a1.unit26.lesson05.teach.nabbe:
    title: Novecento
    gloss: novecento
    note: '*नौ सौ* è il numero 900, usato per il prezzo del giaccone.'
    example_gloss: Il giaccone costa novecento rupie.
  hi.a1.unit26.lesson05.teach.jaiket_kee_keemat:
    title: Dire un prezzo
    gloss: Il giaccone costa novecento rupie.
    note: 'L''hindi dice «il prezzo del giaccone è ...»: *जैकेट की कीमत नौ सौ रुपये है*. *की* concorda con il femminile *कीमत*, non con *जैकेट*.'
  hi.a1.unit26.lesson05.teach.sardee_kee_jaiket:
    title: Leggere uno scontrino del negozio
    gloss: 'Giaccone invernale: taglia M, colore nero. Prezzo: novecento rupie. Questo giaccone veste bene ed è caldo.'
    note: Individua la taglia, il colore, il prezzo e le due qualità citate per il cappotto.
    glosses:
      सर्दी: invernale (giaccone)
      साइज़: taglia
      रंग: colore
      काला: nero
      कीमत: prezzo
      नौ: nove
      सौ: cento
      रुपये: rupie
      जैकेट: cappotto
      आती: sta bene
      गर्म: caldo
  hi.a1.unit26.lesson06.teach.priya_yah_jaiket:
    title: Priya nota il giaccone
    gloss: 'Priya: Questo giaccone è bellissimo! Che taglia porti?'
    note: '*अच्छी* concorda con il femminile *जैकेट*. *तुम्हारा* è il «tuo» informale, usato tra amici.'
  hi.a1.unit26.lesson06.teach.arjun_mera_saiz:
    title: Arjun chiede di provarlo
    gloss: 'Arjun: Porto la taglia M. Posso provarlo?'
    note: '*पहनकर देखना* («indossare e vedere») è il modo hindi di dire «provare» un capo. *सकता हूँ* significa «posso», e una donna dice *सकती हूँ*.'
  hi.a1.unit26.lesson06.teach.priya_zaroor_kya:
    title: Priya chiede come gli sta
    gloss: 'Priya: Certo. Ti sta bene?'
    note: '*यह* significa «esso» o «questo», e *आती* concorda con il femminile *जैकेट*.'
  hi.a1.unit26.lesson06.teach.arjun_han_yah:
    title: Arjun conferma
    gloss: 'Arjun: Sì, mi sta benissimo ed è anche caldo.'
    note: 'Corrisponde esattamente allo scontrino letto prima: è lo stesso cappotto.'
  hi.a1.unit26.lesson06.teach.priya_barhiya_tum:
    title: Priya chiede del colore
    gloss: 'Priya: Benissimo! Lo prendi nero o blu?'
    note: '*या* («o») propone una scelta. Il secondo *रंग* può essere omesso: *काले रंग में ... या नीले में*. *तुम* è informale.'
  hi.a1.unit26.lesson06.teach.arjun_main_ise:
    title: Arjun decide
    gloss: 'Arjun: Lo prendo nero.'
    note: '*लूँगा* è il futuro di *लेना* («prendere»), il verbo usuale per decidere un acquisto in negozio. Una donna dice *लूँगी*.'
  hi.a1.unit26.lesson06.teach.main_leta_hoon:
    title: लेता हूँ e लेता है
    gloss: Io prendo, lui prende.
    note: '*-ता* è la desinenza dell''abitudine e concorda con il soggetto, mentre *हूँ* va con *मैं* e *है* va con *वह*.'
