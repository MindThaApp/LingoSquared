units:
  hi.a1.unit06.food:
    title: Cibo e bevande
lessons:
  hi.a1.unit06.lesson01.mujhe_chahiye:
    title: Vorrei...
  hi.a1.unit06.lesson02.khana_aur_matra:
    title: Cibo e quantità
  hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana:
    title: Il pasto di Priya e Arjun
teaching:
  hi.a1.unit06.lesson01.teach.khana:
    title: Il cibo
    gloss: cibo, pasto
    note: La parola generica per «cibo», usata in tutta questa unità.
    example_gloss: Il mio pasto è pronto ora.
  hi.a1.unit06.lesson01.teach.chai_coffee:
    title: Tè, caffè
    gloss: tè, caffè
    note: Due bevande comuni, usate in tutta l'unità per esercitare la struttura *mujhe ... chahiye*.
    example_gloss:
    - Vorrei un tè.
    - Vorrei un caffè.
  hi.a1.unit06.lesson01.teach.pani_juice:
    title: Acqua, succo
    gloss: acqua, succo
    note: Altre due bevande comuni; non serve alcuna concordanza di genere perché *chahiye* è invariabile.
    example_gloss:
    - Vorrei dell'acqua.
    - Vorrei un succo.
  hi.a1.unit06.lesson01.teach.chahiye_note:
    title: Mujhe ... chahiye
    gloss: '*Mujhe ... chahiye* significa «vorrei ...». Non cambia in base al genere di chi parla (a differenza di *chahta/chahti*) e dopo non vuole mai *hai*.'
    note: 'Il punto grammaticale centrale di questa unità: un errore molto frequente tra chi impara è aggiungere *hai* dopo *chahiye*, perché quasi tutte le altre frasi viste finora finiscono così. *Chahiye* è già un predicato completo da solo.'
  hi.a1.unit06.lesson01.teach.aapko_kya_chahiye:
    title: Che cosa desidera? (formale)
    gloss: Che cosa desidera?
    note: La domanda formale con *aap*, usata da un cameriere o da chi ospita per rivolgersi a qualcuno con cortesia.
  hi.a1.unit06.lesson01.teach.tumhein_kya_chahiye:
    title: Che cosa vuoi? (informale)
    gloss: Che cosa desidera?
    note: Il pronome al dativo del registro informale con *tum*, parallelo a *mujhe* e a *tumhara/tumhari* dell'unità 5.
  hi.a1.unit06.lesson01.teach.chai_chahiye_shukriya:
    title: Vorrei un tè, grazie
    gloss: Vorrei un tè, grazie.
    note: Una risposta naturale e cortese quando si ordina, che riprende *shukriya* delle unità precedenti.
  hi.a1.unit06.lesson01.teach.bahut:
    title: Molto
    gloss: molto
    note: Un intensificatore comune, usato in tutta l'unità per descrivere cibi e bevande.
    example_gloss: Questo tè è molto buono.
  hi.a1.unit06.lesson01.teach.swadisht:
    title: Delizioso
    gloss: delizioso, saporito
    note: Una parola utile per commentare il cibo; nella nota di grammatica della lezione 3 di questa unità trovi perché non cambia mai col genere.
    example_gloss: Questo cibo è molto delizioso.
  hi.a1.unit06.lesson02.teach.roti_chawal:
    title: Pane, riso
    gloss: focaccia piatta (roti), riso
    note: Due alimenti base di un pasto indiano quotidiano.
    example_gloss:
    - Vorrei del pane.
    - Vorrei del riso.
  hi.a1.unit06.lesson02.teach.sabzi_daal:
    title: Piatto di verdure, lenticchie
    gloss: piatto di verdure, lenticchie (dal)
    note: Altri due piatti base, di solito mangiati insieme a roti e riso.
    example_gloss:
    - Vorrei il piatto di verdure.
    - Vorrei delle lenticchie.
  hi.a1.unit06.lesson02.teach.kap_gilas_plate:
    title: Tazza, bicchiere, piatto
    gloss: tazza, bicchiere, piatto
    note: Contenitori comuni, usati con *ek* («uno/un») per indicare una quantità quando si ordina.
    example_gloss:
    - Vorrei una tazza di tè.
    - Vorrei un bicchiere d'acqua.
    - Vorrei un piatto di riso.
  hi.a1.unit06.lesson02.teach.kripya:
    title: Per favore
    gloss: per favore
    note: Una semplice parola di cortesia per una richiesta. Di solito sta all'inizio (*kripya mujhe ...*), ma la si sente anche aggiunta alla fine.
    example_gloss: Vorrei una tazza di tè, per favore.
  hi.a1.unit06.lesson02.teach.kuch_aur_chahiye:
    title: Altro?
    gloss: Altro? / Desidera qualcos'altro?
    note: La domanda naturale che un cameriere fa dopo aver preso parte di un'ordinazione.
  hi.a1.unit06.lesson02.teach.nahin_bas_shukriya:
    title: No, basta così, grazie
    gloss: No, è tutto, grazie.
    note: Un modo naturale e cortese per concludere un'ordinazione, che riprende *nahin* e *shukriya* delle unità precedenti.
  hi.a1.unit06.lesson02.teach.sabzi_swadisht_phrase:
    title: Questo piatto di verdure è molto delizioso
    gloss: Questo piatto di verdure è molto delizioso.
    note: Riprende *bahut* e *swadisht* di questa unità con un nuovo nome di cibo, in preparazione alla nota di grammatica della lezione 3 sul fatto che *swadisht* non cambia mai col genere.
  hi.a1.unit06.lesson03.teach.chalo_khate_hain:
    title: Mangiamo qualcosa!
    gloss: Mangiamo qualcosa!
    note: Un modo amichevole e fisso per proporre di mangiare insieme, che apre il dialogo finale di questa unità.
  hi.a1.unit06.lesson03.teach.ya:
    title: O
    gloss: o
    note: Una semplice parola di collegamento, usata per offrire una scelta tra due cose.
    example_gloss: Vuoi tè o caffè?
  hi.a1.unit06.lesson03.teach.haan:
    title: Sì
    gloss: sì
    note: Un semplice «sì», riutilizzato in tutto il dialogo finale di questa unità.
    example_gloss: Sì, vorrei un tè.
  hi.a1.unit06.lesson03.teach.swadisht_invariant_note:
    title: Swadisht non cambia mai
    gloss: '*Swadisht* resta uguale sia con le parole maschili sia con quelle femminili: non cambia come *achha/achhi*.'
    note: 'Una vera eccezione importante: a differenza degli aggettivi che concordano già visti (achha/achhi, bada/badi, mera/meri), gli aggettivi che finiscono in consonante come *swadisht* non cambiano mai col genere.'
  hi.a1.unit06.lesson03.teach.accha_phir_milenge:
    title: Bene, a presto
    gloss: Bene! A presto.
    note: Un saluto amichevole, ripreso dal vocabolario di congedo delle unità precedenti.
  hi.a1.unit06.lesson03.teach.theek_hai_phir_milte_hain:
    title: Va bene, a presto
    gloss: Va bene, a presto!
    note: La risposta informale al saluto precedente, come negli scambi di congedo delle unità precedenti.
  hi.a1.unit06.lesson03.teach.dialogue.line01:
    title: Arjun propone di mangiare
    gloss: Arjun dice di mangiare qualcosa.
    note: Riprende la frase di apertura di questa unità.
  hi.a1.unit06.lesson03.teach.dialogue.line02:
    title: Priya chiede che cosa vuole
    gloss: Priya è d'accordo e chiede che cosa vorrebbe Arjun.
    note: Riprende la domanda informale *tumhein kya chahiye* della lezione 1.
  hi.a1.unit06.lesson03.teach.dialogue.line03:
    title: Arjun ordina da mangiare
    gloss: Arjun dice che vorrebbe un piatto di roti e verdure.
    note: Combina i nomi di cibo di questa unità, la struttura del contenitore *ek plate* e *chahiye*.
  hi.a1.unit06.lesson03.teach.dialogue.line04:
    title: Priya propone una scelta di bevande
    gloss: Priya dice «bene» e chiede ad Arjun se vuole tè o caffè.
    note: Usa il *ya* di questa unità per offrire una scelta tra due bevande.
  hi.a1.unit06.lesson03.teach.dialogue.line05:
    title: Arjun sceglie il caffè
    gloss: Arjun dice che vorrebbe un caffè, per favore.
    note: Riprende *kripya* dalla lezione 2.
  hi.a1.unit06.lesson03.teach.dialogue.line06:
    title: Priya commenta il cibo
    gloss: Priya dice va bene e che questo cibo è molto buono.
    note: Riprende *bahut swadisht* dalla lezione 1.
  hi.a1.unit06.lesson03.teach.dialogue.line07:
    title: Arjun è d'accordo
    gloss: Arjun dice sì, grazie mille.
    note: Riprende *haan* e *shukriya*.
  hi.a1.unit06.lesson03.teach.dialogue.line08:
    title: Priya chiude la conversazione
    gloss: Priya dice bene, ci vediamo presto.
    note: Riprende la formula di chiusura di questa stessa lezione.
  hi.a1.unit06.lesson03.teach.dialogue.line09:
    title: Arjun risponde
    gloss: Arjun è d'accordo e dice a presto.
    note: Riprende la formula di risposta di questa stessa lezione.
