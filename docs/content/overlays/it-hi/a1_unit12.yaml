teaching:
  hi.a1.unit12.lesson01.teach.vyast_review:
    title: 'Ripasso: occupato'
    gloss: occupato / impegnato
    note: 'Un rapido ripasso dell''aggettivo dell''unità 11: in questa unità lo riutilizzi per esercitarti con il nuovo passato del verbo «essere».'
    example_gloss: Arjun è occupato.
  hi.a1.unit12.lesson01.teach.tha_thi:
    title: Era (maschile / femminile)
    gloss: era
    note: Il passato del verbo «essere», corrispondente passato di hai/hoon/hain. «Tha» concorda con un soggetto maschile, «thi» con un soggetto femminile.
    example_gloss:
    - Ieri Arjun era occupato.
    - Ieri Priya era occupata.
  hi.a1.unit12.lesson01.teach.tha_thi_grammar:
    title: Tha e thi
    gloss: '«Tha» va con un soggetto maschile, «thi» con un soggetto femminile: occupano il posto di «hai», ma a differenza di «hai» cambiano secondo il genere: Arjun è occupato, Arjun era occupato, Priya era occupata.'
    note: Presenta in modo esplicito la concordanza di genere, estendendo al passato il paradigma già noto del verbo «essere».
  hi.a1.unit12.lesson01.teach.kal_review:
    title: 'Ripasso: ieri'
    gloss: ieri
    note: Introdotta nell'unità 4, dove «kal» significava sia «domani» sia «ieri», distinguibili solo dal tempo del verbo. Questa è la prima unità del corso che usa davvero il senso passato («ieri»).
    example_gloss: Ieri era sabato.
  hi.a1.unit12.lesson01.teach.kaisa:
    title: Come (maschile)
    gloss: come
    note: 'Completa un paradigma di cui conosci già due forme su tre: «kaise» e «kaisi» (dall''unità 1, «come stai») già le conosci; qui trovi la forma mancante, il maschile singolare, usata con soggetti come «din» (giorno).'
    example_gloss: Com'era la giornata?
  hi.a1.unit12.lesson01.teach.kal_kaisa_tha_phrase:
    title: Com'è andata ieri?
    gloss: Com'è andata ieri?
    note: La domanda centrale di questa unità, che combina tutte le parole imparate finora in questa lezione.
  hi.a1.unit12.lesson01.teach.din_achha_tha_phrase:
    title: La giornata è stata bella.
    gloss: La giornata è stata bella.
    note: Una risposta pronta a «Com'è andata ieri?», con la forma maschile (din è maschile).
  hi.a1.unit12.lesson01.teach.filma_achi_thi:
    title: Il film era bello.
    gloss: Il film era bello.
    note: Lo stesso schema con un soggetto femminile (film in hindi è femminile), che richiama il lessico dell'unità 11.
  hi.a1.unit12.lesson01.teach.kaisa_kaisi_grammar:
    title: Kaisa, kaisi, kaise
    gloss: '«Kaisa» va con un soggetto maschile singolare (Com''era la giornata?), «kaisi» con un femminile (Com''era il tè?), e «kaise» si usa con aap/tum quando ti rivolgi a un uomo (Come stai?; a una donna si dice «aap kaisi hain?»): sono tre forme della stessa parola.'
    note: 'Riunisce per la prima volta l''intero paradigma: kaise/kaisi le conosci già dall''unità 1, kaisa è la novità di questa lezione.'
  hi.a1.unit12.lesson02.teach.names_mai_review:
    title: 'Ripasso: io, Arjun, Priya'
    gloss: io, Arjun, Priya
    note: Un rapido ripasso prima degli esempi al passato in prima persona di questa lezione.
    example_gloss:
    - Io sono Arjun.
    - Io sono Priya.
  hi.a1.unit12.lesson02.teach.jaana_gaya_gai:
    title: Andato / andata (maschile / femminile)
    gloss: andato
    note: Il passato di «jaana» (andare), la stessa radice dell'imperativo «jao» (vai!) dell'unità 9. Concorda con il genere del soggetto, proprio come «tha»/«thi».
    example_gloss:
    - Arjun è andato al mercato.
    - Priya è andata a casa.
  hi.a1.unit12.lesson02.teach.jaana_grammar:
    title: Gaya/gai = passato di jaana
    gloss: «Gaya»/«gai» è il passato di «jaana» (andare, jao nell'unità 9) e cambia con il genere del soggetto, proprio come «tha»/«thi».
    note: Collega esplicitamente il nuovo passato alla radice dell'imperativo che già conosci.
  hi.a1.unit12.lesson02.teach.bazaar_ghar_review:
    title: 'Ripasso: mercato, casa'
    gloss: mercato, casa
    note: Un rapido ripasso di due parole di luogo delle unità 7/8, necessarie per dire dove è andato qualcuno.
    example_gloss:
    - Questo è il mercato.
    - Questa è casa.
  hi.a1.unit12.lesson02.teach.milna_mila_mili:
    title: Incontrato / incontrata (maschile / femminile)
    gloss: incontrato
    note: Il passato di «milna» (incontrare), la stessa radice dell'abituale «milte hain» (le formule di chiusura delle unità 1/4/10/11). Concorda con il genere del soggetto.
    example_gloss:
    - Arjun ha incontrato Priya.
    - Priya ha incontrato Arjun.
  hi.a1.unit12.lesson02.teach.milna_se_grammar:
    title: Se = «con» qui, non «da»
    gloss: 'Qui «se» non significa «da»: «X se milna» vuol dire «incontrare X», con «se» nel senso di «con», mentre in «main Bharat se hoon» la stessa parola «se» significava «da».'
    note: Un vero doppio uso di una parola che già conosci, spiegato in modo esplicito.
  hi.a1.unit12.lesson02.teach.wahan_review:
    title: 'Ripasso: là'
    gloss: là
    note: Un breve ripasso delle unità 8/9, usato qui per dire dove è avvenuto un incontro.
    example_gloss: La scuola è là.
  hi.a1.unit12.lesson02.teach.kal_bazaar_gaya_phrase:
    title: Ieri sono andato al mercato.
    gloss: Ieri sono andato al mercato.
    note: Unisce il nuovo passato di questa lezione con «kal» della lezione 1.
  hi.a1.unit12.lesson02.teach.wahan_priya_se_mila_phrase:
    title: Lì ho incontrato Priya.
    gloss: Lì ho incontrato Priya.
    note: Unisce il «mila» di questa lezione con «se» («con») e «wahan» (là).
  hi.a1.unit12.lesson02.teach.saath_review:
    title: 'Ripasso: insieme'
    gloss: insieme
    note: Un breve ripasso dell'unità 11.
    example_gloss: Beviamo il tè insieme.
  hi.a1.unit12.lesson03.teach.chai_dukaan_khana_review:
    title: 'Ripasso: tè, negozio, cibo'
    gloss: tè, negozio, cibo
    note: Un breve ripasso di tre sostantivi delle unità 6/7, necessari per il dialogo e per la lettura di questa lezione.
    example_gloss:
    - Il tè è buono.
    - Il negozio è buono.
    - Il cibo è buono.
  hi.a1.unit12.lesson03.teach.ka_kaisi_review:
    title: 'Ripasso: «di» (ka), come (femminile)'
    gloss: di (ka), come (femminile, kaisi)
    note: '«Ka» (già visto in «kitne ka» e, nell''unità 10, in «raat ka khana») e «kaisi» (già visto) vengono riutilizzati qui: non sono grammatica nuova.'
    example_gloss:
    - La giornata di ieri è stata bella.
    - Com'era il negozio di tè?
  hi.a1.unit12.lesson03.teach.dialogue.line01:
    title: Arjun chiede com'è andata ieri
    gloss: Priya, com'è andata ieri?
  hi.a1.unit12.lesson03.teach.dialogue.line02:
    title: Priya dice che è andata bene
    gloss: Benissimo! Ci siamo incontrati.
  hi.a1.unit12.lesson03.teach.dialogue.line03:
    title: Arjun parla del mercato
    gloss: Sì! Prima sono andato anche al mercato.
  hi.a1.unit12.lesson03.teach.dialogue.line04:
    title: Priya chiede del mercato
    gloss: Bene! Cosa c'era al mercato?
  hi.a1.unit12.lesson03.teach.dialogue.line05:
    title: Arjun risponde
    gloss: Il cibo era buono.
  hi.a1.unit12.lesson03.teach.dialogue.line06:
    title: Priya chiede del negozio di tè
    gloss: Bene! E com'era il negozio di tè?
  hi.a1.unit12.lesson03.teach.dialogue.line07:
    title: Arjun risponde
    gloss: Il negozio di tè era molto bello.
  hi.a1.unit12.lesson03.teach.dialogue.line08:
    title: Priya conclude
    gloss: Bene! Allora ci vediamo di nuovo domani?
  hi.a1.unit12.lesson03.teach.mile_grammar:
    title: Tum/hum/ve usano la forma del passato al plurale
    gloss: 'Con «tum», «hum» e «ve» il passato usa la stessa forma che il presente ha con «-te»: «the» (invece di «tha»), «gaye» (invece di «gaya»), «mile» (invece di «mila»), come «hum milte hain» diventa «hum mile».'
    note: 'Presenta il paradigma completo per una vera comprensione, ma negli esercizi di questa unità si allena attivamente solo «mile»: «the» e «gaye» sono solo da riconoscere e compaiono unicamente in questa spiegazione.'
  hi.a1.unit12.lesson03.teach.priya_note:
    title: Il biglietto di Priya
    gloss: Arjun, ieri è stata una giornata bellissima. Il cibo era buono e anche il negozio di tè era bello. - Priya
    note: Un breve biglietto che riprende i fatti appena emersi nel dialogo, senza vocaboli nuovi.
    glosses:
      कल: ieri
      दिन: giorno
      अच्छा: buono (maschile)
      था: era (maschile)
      खाना: cibo
      दुकान: negozio
      अच्छी: buona (femminile)
      थी: era (femminile)
