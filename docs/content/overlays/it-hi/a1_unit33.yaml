  hi.a1.unit33.lesson06.teach.priya_chalo_sath:
    title: Priya propone
    gloss: 'Priya: Ci alleniamo insieme?'
  hi.a1.unit33.lesson06.teach.chalo_sath_men:
    title: चलो + खेलें
    gloss: 'Dai, giochiamo insieme. *चलो* più la forma in *-एँ* (*खेलें*) propone di fare qualcosa insieme: è il modo in cui l''hindi dice «che ne dici di…?».'
