    title: Che sport pratichi?
    gloss: Che sport pratichi?
  hi.a1.unit33.lesson01.teach.main_futbol_khelta:
    title: Gioco a calcio
    gloss: Gioco a calcio.
    note: 'In hindi si usa il verbo adatto allo sport: *खेलना* («giocare») per il calcio, quindi *मैं फ़ुटबॉल खेलता हूँ*.'
  hi.a1.unit33.lesson01.teach.futbol_khelna_yog:
    title: खेलना o करना
    gloss: 'Giocare a calcio, fare yoga. L''hindi sceglie il verbo in base allo sport: *खेलना* per i giochi come il calcio e *करना* per attività come lo yoga; lo sport precede il verbo.'
    note: 'Una sola costruzione vale per tutti gli sport: a questo livello non serve imparare un verbo diverso per ogni sport.'
  hi.a1.unit33.lesson02.teach.hafte_men_do:
    title: Volte a settimana
    gloss: volte a settimana
    example_gloss: Faccio yoga due volte a settimana.
  hi.a1.unit33.lesson02.teach.main_hafte_men:
    title: हफ़्ते में दो बार
    gloss: Corro due volte a settimana. *हफ़्ते में दो बार* («in una settimana, due volte») indica la frequenza in modo più preciso di *रोज़* o *अक्सर* e si colloca prima del verbo.
    note: Amplia il lessico della frequenza già introdotto nell'unità sugli hobby.
  hi.a1.unit33.lesson02.teach.main_hafte_men_2:
    title: Faccio yoga due volte a settimana
    gloss: Faccio yoga due volte a settimana.
  hi.a1.unit33.lesson02.teach.arjun_aksar_futbol:
    title: Arjun gioca spesso a calcio
    gloss: Arjun gioca spesso a calcio.
