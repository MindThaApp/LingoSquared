    gloss: 'Arjun: Che bello, io ci gioco spesso a calcio.'
  hi.a1.unit33.lesson05.teach.priya_hafte_men:
    title: Priya e Neha parlano di sport
    gloss: Priya fa yoga due volte a settimana. Le piace allenarsi con calma. Neha non fa yoga, ma ama molto nuotare. Neha nuota spesso, quasi ogni settimana. Tu che sport pratichi?
    note: 'Questo testo mette a confronto due sport e due modi di dire quanto spesso: *हफ़्ते में दो बार* e *अक्सर, लगभग हर हफ़्ते*; i verbi *करती है* e *तैरती है* sono al femminile.'
    glosses:
      करती: fa
      दो: due
      बार: volte
      हफ़्ते: settimana
      योग: yoga
      पसंद: adora
      आराम: con calma
      कसरत: attività fisica
      तैरना: nuotare
      तैरती: nuota
      अक्सर: spesso
      लगभग: quasi
      कौन: quale
      खेल: sport
