teaching:
  hi.a1.unit04.lesson01.teach.baje:
    title: L'ora
    gloss: ore (due o più)
    note: Si usa con tutte le ore tranne l'una -- più avanti in questa lezione trovi la forma speciale per *l'una*.
    example_gloss: Ora sono le cinque.
  hi.a1.unit04.lesson01.teach.abhi:
    title: Adesso
    gloss: adesso, ora
    note: Una semplice parola di tempo che userai di continuo per dire che ora è.
    example_gloss: Ora sono le dieci.
  hi.a1.unit04.lesson01.teach.ek_do_teen:
    title: Uno, due, tre
    gloss: uno, due, tre
    note: Già visti nell'unità 2 e qui necessari per dire l'ora -- nota che *ek* vuole la forma speciale *baja*, mentre *do* e *teen* vogliono la forma regolare *baje*.
    example_gloss:
    - Ora è l'una.
    - Ora sono le due.
    - Ora sono le tre.
  hi.a1.unit04.lesson01.teach.chaar_paanch_chhah:
    title: Quattro, cinque, sei
    gloss: quattro, cinque, sei
    note: Già visti nell'unità 2 -- tutti e tre vogliono la forma regolare *baje*.
    example_gloss:
    - Ora sono le quattro.
    - Ora sono le cinque.
    - Ora sono le sei.
  hi.a1.unit04.lesson01.teach.saat_aath_nau:
    title: Sette, otto, nove
    gloss: sette, otto, nove
    note: Già visti nell'unità 2.
    example_gloss:
    - Ora sono le sette.
    - Ora sono le otto.
    - Ora sono le nove.
  hi.a1.unit04.lesson01.teach.das_gyaarah_baarah:
    title: Dieci, undici, dodici
    gloss: dieci, undici, dodici
    note: Già visti nell'unità 2 -- gli ultimi numeri delle ore che ti servono.
    example_gloss:
    - Ora sono le dieci.
    - Ora sono le undici.
    - Ora sono le dodici.
  hi.a1.unit04.lesson01.teach.baja_grammar_note:
    title: Baja e baje
    gloss: '*Baja* si usa con *uno*, *baje* con tutti gli altri numeri: *ek baja hai*, *do baje hain*.'
    note: È un'eccezione di concordanza reale e importante, non una semplificazione -- *ek baja hai* è l'unica ora che usa la forma singolare.
  hi.a1.unit04.lesson01.teach.kitne_baje_hain:
    title: Chiedere l'ora
    gloss: Che ore sono?
    note: Letteralmente «quante ore sono» -- il modo standard per chiedere l'ora.
  hi.a1.unit04.lesson01.teach.abhi_paanch_baje_hain:
    title: Dire l'ora
    gloss: Ora sono le cinque.
    note: La risposta naturale, in frase completa, a *Kitne baje hain?*
  hi.a1.unit04.lesson02.teach.yoga_class_reprise:
    title: Lezione di yoga
    gloss: lezione di yoga
    note: Già vista nell'unità 1 -- è l'esempio ricorrente di questa lezione per parlare di orari.
    example_gloss: La lezione di yoga è oggi.
  hi.a1.unit04.lesson02.teach.subah:
    title: Mattina
    gloss: mattina
    note: Una delle quattro parti del giorno che si imparano in questa lezione.
    example_gloss: La lezione di yoga è di mattina.
  hi.a1.unit04.lesson02.teach.dopahar:
    title: Pomeriggio / mezzogiorno
    gloss: pomeriggio, mezzogiorno
    note: Indica sia il mezzogiorno sia il primo pomeriggio.
    example_gloss: Nel pomeriggio non c'è lezione.
  hi.a1.unit04.lesson02.teach.shaam:
    title: Sera
    gloss: sera
    note: Il tratto della giornata dopo *dopahar* e prima di *raat*.
    example_gloss: La prossima lezione è alle cinque di sera.
  hi.a1.unit04.lesson02.teach.raat:
    title: Notte
    gloss: notte
    note: L'ultima delle quattro parti del giorno.
    example_gloss: Di notte non c'è lezione.
  hi.a1.unit04.lesson02.teach.ko_reprise:
    title: Ko con un momento generico
    gloss: '*Ko* si usa con una parola che indica una parte del giorno quando non si dice un''ora precisa: *dopahar ko*, *raat ko*.'
    note: È lo stesso *ko* che indica un giorno della settimana (unità 3), qui usato per un periodo generico -- una costruzione reale e naturale, ma non l'unica di questa unità (la forma con un'ora precisa è nella nota seguente).
  hi.a1.unit04.lesson02.teach.time_of_day_baje_note:
    title: Una parte del giorno direttamente prima di baje
    gloss: 'Per un''ora precisa, la parola della parte del giorno va direttamente prima di *baje*, senza nulla in mezzo: *subah saat baje*, *shaam paanch baje*.'
    note: Qui non c'è *ko* -- si usa solo per un periodo generico senza ora precisa, come spiega la nota precedente.
  hi.a1.unit04.lesson02.teach.class_kitne_baje_hai:
    title: Chiedere quando è la lezione
    gloss: A che ora è la lezione?
    note: Lo stesso schema *kitne baje* della lezione 1, ora usato per chiedere di un evento invece che dell'ora attuale.
  hi.a1.unit04.lesson02.teach.class_subah_saat_baje_hai:
    title: Dire l'orario di un evento
    gloss: La lezione è alle sette di mattina.
    note: Unisce *subah* direttamente a *saat baje*, come spiega la nota di grammatica precedente.
  hi.a1.unit04.lesson03.teach.kal:
    title: Domani / ieri
    gloss: domani, ieri
    note: 'L''hindi usa una sola parola per entrambi i significati: lo capisci dal contesto (e dal tempo del verbo). In questa lezione significa sempre «domani».'
    example_gloss: La lezione è domani alle cinque di sera.
  hi.a1.unit04.lesson03.teach.agli_reprise:
    title: Prossimo
    gloss: prossimo
    note: Già vista nell'unità 3 -- forma femminile, concorda con il femminile *class*.
    example_gloss: La prossima lezione è domani.
  hi.a1.unit04.lesson03.teach.theek_hai_shukriya_reprise:
    title: Va bene, grazie
    gloss: Va bene, grazie!
    note: Entrambe le parole sono già presenti nel vocabolario di congedo dell'unità 1.
  hi.a1.unit04.lesson03.teach.milte_hain_reprise:
    title: Ci vediamo
    gloss: ci vediamo
    note: Già vista nel saluto finale dell'unità 3, qui abbinata a *kal* per dire «a domani».
  hi.a1.unit04.lesson03.teach.agli_class_kitne_baje_hai:
    title: Chiedere a che ora è la prossima lezione
    gloss: A che ora è la prossima lezione?
    note: Unisce *agli* (femminile, concorda con «classe») allo schema *kitne baje* di questa unità.
  hi.a1.unit04.lesson03.teach.agli_class_shaam_paanch_baje_hai:
    title: Dire l'orario della prossima lezione
    gloss: La prossima lezione è alle cinque di sera.
    note: È la risposta completa più naturale alla domanda precedente.
  hi.a1.unit04.lesson03.teach.kal_milte_hain:
    title: Concludere fissando un appuntamento a domani
    gloss: Va bene, a domani!
    note: È il modo naturale di chiudere una conversazione dopo aver stabilito un orario.
  hi.a1.unit04.lesson03.teach.dialogue.line01:
    title: Arjun chiede della prossima lezione
    gloss: Arjun chiede a che ora è la prossima lezione.
    note: Riprende esattamente la domanda di questa lezione.
  hi.a1.unit04.lesson03.teach.dialogue.line02:
    title: Priya dice l'orario
    gloss: Priya dice che la prossima lezione è alle cinque di sera.
    note: Riprende esattamente la frase di risposta di questa lezione.
  hi.a1.unit04.lesson03.teach.dialogue.line03:
    title: Arjun la ringrazia
    gloss: Arjun dice va bene, grazie.
    note: Già vista nel vocabolario dell'unità 1.
  hi.a1.unit04.lesson03.teach.dialogue.line04:
    title: Priya chiude la conversazione
    gloss: Priya è d'accordo e dice a domani.
    note: Riprende esattamente la battuta finale di questa lezione.
