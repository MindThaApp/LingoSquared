teaching:
  hi.a1.unit14.lesson01.teach.arjun_priya_review:
    title: 'Ripasso: Arjun, Priya, è'
    gloss: Arjun, Priya, è
    note: Un rapido ripasso dei nomi dei due personaggi e del verbo copulativo 'hai' (è), necessario per costruire le frasi comparative di questa unità.
    example_gloss:
    - Arjun sta bene.
    - Priya sta bene.
  hi.a1.unit14.lesson01.teach.bada_badi_review:
    title: 'Ripasso: grande / maggiore'
    gloss: grande / maggiore (maschile / femminile)
    note: 'Già visto nell''unità 5 per l''età dei fratelli: in questa unità lo estendiamo al confronto diretto tra due persone o cose qualsiasi.'
    example_gloss:
    - Mio fratello maggiore vive a Delhi.
    - Mia sorella maggiore vive a Delhi.
  hi.a1.unit14.lesson01.teach.chota_choti_review:
    title: 'Ripasso: piccolo / minore'
    gloss: piccolo / minore (maschile / femminile)
    note: 'Già visto nell''unità 5 per l''età dei fratelli: qui si usa allo stesso modo di bada/badi.'
    example_gloss:
    - Mio fratello minore ora è studente.
    - Mia sorella minore ora è studentessa.
  hi.a1.unit14.lesson01.teach.se_comparative_grammar:
    title: Se = di (nel confronto)
    gloss: '''Se'' l''hai già incontrato con il significato di «da» (unità 9, ''yahan se seedhe jao'') e di «con» (unità 12, ''Priya se mila''). Ora serve anche per il confronto: ''X, Y se ADJ hai'' significa «X è più ADJ di Y», come in ''Priya Arjun se badi hai''.'
    note: Presenta il terzo significato di una parola già nota, ricordando i due precedenti con il numero dell'unità prima di introdurre quello nuovo.
    target_text: '''से'' पहले ''यहाँ से सीधे जाओ'' (यूनिट 9, matlab ''da'') और ''प्रिया से मिला'' (यूनिट 12, matlab ''con'') में सीखा था; अब यह तुलना के लिए भी आता है: ''X, Y से ADJ है'' का मतलब है ''X è più ADJ di Y'' -- जैसे ''प्रिया अर्जुन से बड़ी है''।'
  hi.a1.unit14.lesson01.teach.arjun_bada_phrase:
    title: Priya è più grande di Arjun.
    gloss: Priya è più grande di Arjun.
    note: Il primo esempio completo della struttura comparativa con se.
  hi.a1.unit14.lesson01.teach.lamba_lambi:
    title: Alto / lungo
    gloss: alto / lungo (maschile / femminile)
    note: Una nuova coppia di aggettivi, che segue la concordanza -a/-i già nota tra maschile e femminile (bada/badi, chota/choti).
    example_gloss:
    - Mio fratello è alto.
    - Mia sorella è alta.
  hi.a1.unit14.lesson01.teach.agreement_grammar:
    title: L'aggettivo concorda con il soggetto
    gloss: In una frase comparativa l'aggettivo (come bada/badi, chota/choti) concorda sempre nel genere con il SOGGETTO, non con la parola dopo 'se'. Per esempio in 'Arjun Priya se chota hai', 'chota' concorda con Arjun (soggetto maschile), non con Priya.
    note: Estensione esplicita della concordanza -a/-i già nota, applicata alle frasi comparative.
    target_text: तुलना के वाक्य में विशेषण (जैसे बड़ा/बड़ी, छोटा/छोटी) हमेशा विषय (soggetto) के लिंग से मेल खाता है, 'से' के बाद वाले शब्द के नहीं -- जैसे 'अर्जुन प्रिया से छोटा है' में 'छोटा' अर्जुन (पुल्लिंग विषय) से मेल खाता है, प्रिया से नहीं।
  hi.a1.unit14.lesson01.teach.priya_chota_phrase:
    title: Arjun è più piccolo di Priya.
    gloss: Arjun è più piccolo di Priya.
    note: 'Lo stesso fatto detto dal punto di vista opposto: mostra la concordanza con un soggetto maschile.'
  hi.a1.unit14.lesson01.teach.kaun_ya_review:
    title: 'Ripasso: chi, o'
    gloss: chi, o
    note: 'Entrambe già viste (unità 5 e unità 6/13): qui servono per fare una domanda di confronto.'
    example_gloss: Chi è più grande, Arjun o Priya?
  hi.a1.unit14.lesson02.teach.topi_bag_review:
    title: 'Ripasso: cappello, borsa'
    gloss: cappello, borsa
    note: 'Entrambi i nomi sono stati introdotti nell''unità 7, dedicata agli acquisti: qui sono le due cose da confrontare.'
    example_gloss:
    - Questo cappello è bello.
    - Questa borsa è bella.
  hi.a1.unit14.lesson02.teach.sasta_mehnga_review:
    title: 'Ripasso: economico, caro'
    gloss: economico, caro
    note: 'Già visti nell''unità 7: qui servono per confrontare degli oggetti.'
    example_gloss:
    - La borsa è economica.
    - La borsa è cara.
  hi.a1.unit14.lesson02.teach.sasti_mehngi_note:
    title: 'Forme femminili: sasti, mehngi'
    gloss: '''Sasta'' e ''mehnga'' diventano ''sasti'' e ''mehngi'' con le parole femminili, come in ''topi sasti hai'' (il cappello è economico).'
    note: Un breve richiamo alla regola di concordanza di genere dell'unità 7, necessaria perché 'topi' (cappello) è femminile.
  hi.a1.unit14.lesson02.teach.se_object_phrase:
    title: Il cappello costa meno della borsa.
    gloss: Il cappello costa meno della borsa.
    note: La struttura comparativa con se applicata a due oggetti invece che a due persone.
  hi.a1.unit14.lesson02.teach.zyada_review:
    title: 'Ripasso: più'
    gloss: più
    note: 'Nell''unità 13 era stato introdotto solo con ''pasand hai'' (per esprimere una preferenza): questa lezione ne generalizza l''uso.'
    example_gloss: Mi piace di più il tè.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_grammar:
    title: Zyada in ogni confronto
    gloss: 'Finora ''zyada'' l''hai visto solo con ''pasand hai'' (unità 13). Ora può stare anche davanti a QUALSIASI aggettivo in un confronto: ''bag topi se zyada mehnga hai'' significa «la borsa è più cara del cappello», esattamente come ''bag topi se mehnga hai''. ''Zyada'' è facoltativo: serve solo a dire «più» in modo esplicito.'
    note: Generalizzazione dichiarata della posizione di una parola già nota, non un nuovo punto di grammatica.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_phrase:
    title: La borsa è più cara del cappello.
    gloss: La borsa è più cara del cappello.
    note: La stessa struttura comparativa con se, con zyada (più) facoltativo espresso.
  hi.a1.unit14.lesson02.teach.naya_nai:
    title: Nuovo
    gloss: nuovo (maschile / femminile)
    note: Una nuova coppia di aggettivi, che segue la stessa concordanza -a/-i di tutti gli altri aggettivi di questa unità.
    example_gloss:
    - La borsa è nuova.
    - Il cappello è nuovo.
  hi.a1.unit14.lesson02.teach.topi_nai_phrase:
    title: Il cappello è più nuovo della borsa.
    gloss: Il cappello è più nuovo della borsa.
    note: Un secondo confronto (la novità) tra gli stessi due oggetti, in linea con il confronto sul prezzo già visto.
  hi.a1.unit14.lesson03.teach.review_words:
    title: 'Ripasso: grande, piccolo, alto, nuovo'
    gloss: grande/maggiore, piccolo/minore, alto/lungo, nuovo
    note: Un rapido ripasso degli aggettivi chiave di questa unità, necessari per il dialogo e per il testo da leggere.
    example_gloss:
    - Priya è più grande.
    - Arjun è più piccolo.
    - Arjun è alto.
    - La borsa è nuova.
  hi.a1.unit14.lesson03.teach.main_hun_review:
    title: 'Ripasso: io, sono'
    gloss: io, sono
    note: 'Già visto nell''unità 1 (''main theek hun''): serve ad Arjun per parlare di sé nel dialogo.'
    example_gloss: Sto bene.
  hi.a1.unit14.lesson03.teach.aur_bhi_review:
    title: 'Ripasso: e, anche'
    gloss: e, anche
    note: Entrambe le parole sono comparse nei dialoghi precedenti, ma qui sono introdotte per la prima volta come vocaboli da studiare.
    example_gloss:
    - Mi piacciono il tè e il caffè.
    - Piace anche a me.
  hi.a1.unit14.lesson03.teach.ka_review:
    title: 'Ripasso: di (possesso)'
    gloss: di (indica il possesso)
    note: 'Il segnalatore di possesso già usato in tutto il corso (per esempio nelle unità 5-11): qui serve per dire di chi è la borsa che si confronta.'
    example_gloss: La borsa di Arjun è nuova.
  hi.a1.unit14.lesson03.teach.dialogue.line01:
    title: Arjun mostra la sua borsa nuova
    gloss: Priya, questa è la mia borsa nuova.
  hi.a1.unit14.lesson03.teach.dialogue.line02:
    title: Priya dice che il cappello costa meno
    gloss: Bella borsa! Ma il cappello costa meno di una borsa.
  hi.a1.unit14.lesson03.teach.dialogue.line03:
    title: Arjun ammette che la sua borsa è cara
    gloss: 'Sì. La mia borsa è cara: costa più di un cappello.'
  hi.a1.unit14.lesson03.teach.dialogue.line04:
    title: Priya chiede chi è più grande
    gloss: Va bene, va bene! Arjun, chi è più grande, tu o io?
  hi.a1.unit14.lesson03.teach.dialogue.line05:
    title: Arjun risponde
    gloss: Tu sei più grande, ma io sono alto!
  hi.a1.unit14.lesson03.teach.dialogue.line06:
    title: Priya dice che il cappello è anche più nuovo
    gloss: Va bene, va bene! Ma il cappello è anche più nuovo della borsa.
  hi.a1.unit14.lesson03.teach.dialogue.line07:
    title: Arjun è d'accordo e chiude
    gloss: Sì, è vero. Ci vediamo di nuovo domani?
  hi.a1.unit14.lesson03.teach.dialogue.line08:
    title: Priya chiude
    gloss: Va bene! Ci vediamo domani.
  hi.a1.unit14.lesson03.teach.grammar_summary:
    title: Le tre regole principali
    gloss: 'Le tre regole principali di questa unità: (1) ''X, Y se ADJ hai'' significa «X è più ADJ di Y»; (2) l''ADJ concorda sempre nel genere con il soggetto (X), non con Y; (3) si può mettere ''zyada'' anche davanti all''ADJ, come in ''X, Y se zyada ADJ hai'': il significato resta lo stesso («più ADJ di»).'
    note: Un riepilogo finale che riunisce tutta la grammatica dell'unità, come la nota grammaticale di riepilogo dell'unità 13.
    target_text: 'इस यूनिट के तीन मुख्य नियम: (1) ''X, Y से ADJ है'' का मतलब है ''X è più ADJ di Y''; (2) ADJ हमेशा विषय (X) के लिंग से मेल खाता है, Y से नहीं; (3) ADJ से पहले ''ज़्यादा'' भी जोड़ सकते हैं, जैसे ''X, Y से ज़्यादा ADJ है'' -- मतलब वही रहता है (''più ADJ di'')।'
  hi.a1.unit14.lesson03.teach.priya_note:
    title: Il biglietto di Priya
    gloss: 'Io sono più grande di Arjun, ma Arjun è alto. E il mio cappello è bello: costa meno della borsa ed è anche più nuovo della borsa. - Priya'
    note: Un breve biglietto che riprende esattamente i fatti già emersi nel dialogo, senza aggiungere nulla di nuovo.
    glosses:
      बड़ी: più grande (femminile)
      लंबा: alto
      टोपी: cappello
      अच्छी: bello / buono (femminile)
      बैग: borsa
      सस्ती: più economico / economico (femminile)
      नई: più nuovo / nuovo (femminile)
