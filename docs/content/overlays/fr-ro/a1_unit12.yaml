teaching:
  ro.a1.unit12.lesson01.teach.reminder_parc_cinema:
    title: 'Rappel : parc, cinema'
    gloss: parc (le parc) · cinema (le cinéma)
    note: Les deux mots ont déjà été vus à l’unité 11 ; ici, ils se combinent avec le nouveau passé de cette unité.
  ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata:
    title: 'Rappel : astăzi, mâine, duminică, sâmbătă'
    gloss: astăzi (aujourd’hui) · mâine (demain) · duminică (dimanche) · sâmbătă (samedi)
    note: Tous ces mots ont déjà été vus aux unités 3 et 11 ; ici, ils préparent le contraste avec *ieri* (hier), nouveau dans cette leçon.
  ro.a1.unit12.lesson01.teach.am_fost_vocab:
    title: J’ai été / je suis allé(e)
    gloss: Am fost (j’ai été / je suis allé(e))
    note: 'Le perfect compus (temps du passé) de *a fi* (être) : *am* est le même auxiliaire invariable pour « je » et « nous », et *fost* est la forme fixe du passé. Avec un lieu, *am fost la...* est la façon courante et naturelle de dire « je suis allé(e) à... », bien plus fréquente à l’oral qu’un verbe de déplacement précis.'
    example_gloss:
    - Je suis allé(e) au parc.
  ro.a1.unit12.lesson01.teach.am_fost_parc_phrase:
    title: Je suis allé(e) au parc
    gloss: Am fost la parc. (Je suis allé(e) au parc.)
    note: 'Le schéma complet : am fost + la + lieu.'
  ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase:
    title: Je suis allé(e) au cinéma
    gloss: Am fost la cinema. (Je suis allé(e) au cinéma.)
    note: Le même schéma que *Am fost la parc*, avec un autre lieu.
  ro.a1.unit12.lesson01.teach.ieri_vocab:
    title: Hier
    gloss: Ieri (hier)
    note: Déjà vu à l’unité 3 à côté de *astăzi* (aujourd’hui) et *mâine* (demain) ; il sert maintenant avec le passé, en début de phrase, pour dire quand quelque chose s’est passé.
    example_gloss:
    - Hier, je suis allé(e) au parc.
  ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase:
    title: Hier, je suis allé(e) au parc
    gloss: Ieri am fost la parc. (Hier, je suis allé(e) au parc.)
    note: En ajoutant *ieri* devant *Am fost la parc*, on précise exactement quand.
  ro.a1.unit12.lesson02.teach.reminder_mananc_beau:
    title: 'Rappel : mănânc, beau'
    gloss: mănânc (je mange) · beau (je bois)
    note: Les deux verbes ont déjà été vus dans la routine quotidienne de l’unité 10 ; cette leçon en présente les formes du passé.
  ro.a1.unit12.lesson02.teach.reminder_paine_cafea_ceai_si:
    title: 'Rappel : pâine, cafea, ceai, și'
    gloss: pâine (le pain) · cafea (le café) · ceai (le thé) · și (et)
    note: Tous ces mots ont déjà été vus aux unités 6 et 10 ; ils sont réutilisés ici dans les phrases au passé de cette leçon.
  ro.a1.unit12.lesson02.teach.am_mancat_vocab:
    title: J’ai mangé
    gloss: Am mâncat (j’ai mangé)
    note: 'Le perfect compus de *a mânca* (manger), déjà vu sous la forme *mănânc* (je mange, unité 10) : même verbe, au passé. Am + mâncat, le même schéma que *am fost*.'
    example_gloss:
    - J’ai mangé du pain.
  ro.a1.unit12.lesson02.teach.am_mancat_paine_phrase:
    title: J’ai mangé du pain
    gloss: Am mâncat pâine. (J’ai mangé du pain.)
    note: 'Le schéma complet : am mâncat + l’aliment.'
  ro.a1.unit12.lesson02.teach.am_baut_vocab:
    title: J’ai bu
    gloss: Am băut (j’ai bu)
    note: 'Le perfect compus de *a bea* (boire), déjà vu sous la forme *beau* (je bois, unité 10) : même verbe, au passé.'
    example_gloss:
    - J’ai bu du thé.
  ro.a1.unit12.lesson02.teach.am_baut_ceai_phrase:
    title: J’ai bu du thé
    gloss: Am băut ceai. (J’ai bu du thé.)
    note: 'Le schéma complet : am băut + la boisson.'
  ro.a1.unit12.lesson02.teach.am_mancat_am_baut_phrase:
    title: J’ai mangé du pain et j’ai bu du thé
    gloss: Am mâncat pâine și am băut ceai. (J’ai mangé du pain et j’ai bu du thé.)
    note: Deux actions au passé reliées par *și*, le même mot de liaison que l’unité 10 employait déjà pour les habitudes au présent.
  ro.a1.unit12.lesson03.teach.reminder_am_fost_ieri_parc_cinema:
    title: 'Rappel : am fost, ieri, parc, cinema'
    gloss: am fost (j’ai été / je suis allé(e)) · ieri (hier) · parc (le parc) · cinema (le cinéma)
    note: Tous ces mots viennent de la première leçon de cette unité ; ils préparent ici le récit du dimanche.
  ro.a1.unit12.lesson03.teach.reminder_am_mancat_am_baut:
    title: 'Rappel : am mâncat, am băut, pâine, cafea, ceai'
    gloss: am mâncat (j’ai mangé) · am băut (j’ai bu) · pâine (le pain) · cafea (le café) · ceai (le thé)
    note: Tous ces mots viennent de la deuxième leçon de cette unité ; ici, Ana et Mihai disent chacun ce qu’ils ont pris.
  ro.a1.unit12.lesson03.teach.reminder_cum_duminica_bine:
    title: 'Rappel : cum, duminică, bine, mulțumesc, la revedere, Ana, Mihai'
    gloss: cum (comment, unités 1 et 9) · duminică (dimanche, unité 3) · bine (bien, unité 1) · mulțumesc (merci) · la revedere (au revoir) · Ana, Mihai (prénoms)
    note: 'Tous ces mots ont déjà été vus dans les unités précédentes. *Cum* est apparu d’abord pour demander le nom de quelqu’un (unité 1) et pour demander son chemin (unité 9) ; ici, il ouvre un autre type de question : comment quelque chose s’est passé.'
  ro.a1.unit12.lesson03.teach.a_fost_vocab:
    title: C’était
    gloss: A fost (c’était)
    note: 'Une autre personne du même verbe que *am fost* : *a* est l’auxiliaire de « il/elle », pas celui de « je/nous ». Pour l’instant, apprends *Cum a fost...?* et *A fost bine!* comme des expressions toutes faites, pas comme un schéma à construire librement.'
    example_gloss:
    - C’était bien !
  ro.a1.unit12.lesson03.teach.a_fost_bine_phrase:
    title: C’était bien !
    gloss: A fost bine! (C’était bien !)
    note: Une façon courte et naturelle de dire que tout s’est bien passé ; c’est la réponse à *Cum a fost...?*
  ro.a1.unit12.lesson03.teach.cum_a_fost_duminica_phrase:
    title: Comment était dimanche ?
    gloss: Cum a fost duminică? (Comment était dimanche ?)
    note: 'Une façon naturelle d’ouvrir la conversation sur un jour récent, même avec quelqu’un qui y était aussi : on l’invite à dire ce qu’il a ressenti ou ce qui l’a marqué.'
  ro.a1.unit12.lesson03.teach.line01:
    title: Saluer et demander comment était dimanche
    gloss: Mihai salue Ana et lui demande comment était dimanche.
    note: Associe *Cum a fost duminică?* de cette unité et *Bună*, déjà connu.
  ro.a1.unit12.lesson03.teach.line02:
    title: Répondre et dire où
    gloss: Ana dit que c’était bien et qu’elle est allée au parc.
    note: Associe *A fost bine!* et *Am fost la parc* de la première leçon.
  ro.a1.unit12.lesson03.teach.line03:
    title: Dire ce qu’il a mangé et bu
    gloss: Mihai dit qu’il a mangé du pain et bu du thé.
    note: Reprend *Am mâncat pâine și am băut ceai* de la deuxième leçon, conformément aux goûts de Mihai établis à l’unité 6 (pâine et ceai).
  ro.a1.unit12.lesson03.teach.line04:
    title: Dire ce qu’elle a bu
    gloss: Ana dit qu’elle a bu du café.
    note: Correspond aux goûts d’Ana établis à l’unité 6 (cafea).
  ro.a1.unit12.lesson03.teach.line05:
    title: Remercier et dire au revoir
    gloss: Mihai remercie Ana et lui dit au revoir.
    note: La même formule de clôture que celle qui termine les dialogues de toutes les unités précédentes.
  ro.a1.unit12.lesson03.teach.line06:
    title: Terminer la conversation
    gloss: Ana dit au revoir à son tour, en employant le prénom de Mihai.
    note: La même formule de clôture amicale que celle qui termine les dialogues de toutes les unités précédentes.
