teaching:
  ro.a1.unit29.lesson01.teach.cat_costa_in:
    title: Demander le prix total
    gloss: Combien cela coûte-t-il au total ?
    note: '*În total* (au total) précise que tu veux le prix global, et non le prix d’un seul article ; *Cât costă?* demande « combien ça coûte ? ».'
  ro.a1.unit29.lesson01.teach.costa_douazeci_si:
    title: Indiquer un prix total
    gloss: Ça coûte cent lei au total.
    note: '*Costă* est la forme il/elle/ça de *a costa* (coûter). Après un nombre supérieur à 19, le roumain ajoute *de* devant le nom : *o sută de lei*.'
  ro.a1.unit29.lesson02.teach.a_plati_cu:
    title: Payer par carte ou en espèces
    gloss: payer par carte, payer en espèces
    note: '*A plăti cu cardul* signifie payer par carte et *a plăti în numerar* signifie payer en espèces ; *cu* signifie « avec » et *în* signifie « en ».'
    example_gloss:
    - Puis-je payer par carte ici ?
    - Je paie en espèces.
  ro.a1.unit29.lesson02.teach.pot_plati_cu:
    title: Demander s’il est possible de payer par carte
    gloss: Puis-je payer par carte ici ?
    note: '*Pot plăti* (je peux payer) est *a putea* + un verbe ; *aici* (ici) situe la question à l’endroit où l’on se trouve.'
  ro.a1.unit29.lesson02.teach.doriti_sa_platiti:
    title: Demander le moyen de paiement souhaité
    gloss: Souhaitez-vous payer en espèces ou par carte ?
    note: '*Doriți să plătiți ...?* est la forme de politesse en *dumneavoastră*, utilisée par un caissier qu’on ne connaît pas ; avec un ami, on dirait *Vrei să plătești ...?*'
  ro.a1.unit29.lesson03.teach.nota:
    title: L’addition
    gloss: l’addition
    note: 'Un nom féminin : *o notă*, *nota* (l’article se place à la fin du mot).'
    example_gloss: On partage l’addition ?
  ro.a1.unit29.lesson03.teach.hai_sa_impartim:
    title: Proposer de partager l’addition
    gloss: On partage l’addition ?
    note: '*Hai să* + verbe propose de faire quelque chose ensemble.'
  ro.a1.unit29.lesson03.teach.pot_plati_separat:
    title: Demander à payer séparément
    gloss: Puis-je payer séparément ?
    note: '*Separat* (séparément) se place après *a plăti* ; *Pot plăti separat?* est la demande habituelle quand chacun paie sa part.'
  ro.a1.unit29.lesson04.teach.restul:
    title: La monnaie
    gloss: la monnaie
    note: '*Restul* signifie littéralement « le reste » : c’est ainsi que le roumain désigne la monnaie rendue ; l’article se place à la fin du mot.'
    example_gloss: Voici votre monnaie.
  ro.a1.unit29.lesson04.teach.poftiti_restul:
    title: Rendre la monnaie
    gloss: Voici votre monnaie.
    note: '*Poftiți* est la forme de politesse en *dumneavoastră* qui signifie « tenez », en accord avec le registre formel au comptoir.'
  ro.a1.unit29.lesson04.teach.nu_am_nevoie:
    title: Refuser la monnaie
    gloss: Je n’ai pas besoin de monnaie.
    note: '*A avea nevoie de* (avoir besoin de) se construit avec *de* : *Nu am nevoie de rest*.'
  ro.a1.unit29.lesson05.teach.treizeci_si_cinci:
    title: Trente-cinq
    gloss: trente-cinq
    note: 'Le roumain forme les nombres de 21 à 99 avec *și* : *treizeci și cinci* (littéralement « trente et cinq »), et ajoute *de* devant le nom : *o sută treizeci și cinci de lei*.'
    example_gloss: Ça coûte cent trente-cinq lei.
  ro.a1.unit29.lesson05.teach.nota_doua_feluri:
    title: Lire une addition de restaurant
    gloss: 'Addition : deux plats principaux et deux cafés. Total : cent trente-cinq lei. Payé par carte.'
    note: Repère ce qui a été commandé, le total et le moyen de paiement.
    glosses:
      Nota: addition
      două: deux
      feluri: plats principaux
      cafele: cafés
      Total: total
      '135': cent trente-cinq
      lei: lei
      Plătit: payé
      cardul: carte
  ro.a1.unit29.lesson06.teach.ana_hai_sa:
    title: Ana demande l’addition
    gloss: 'Ana : On demande l’addition ?'
    note: '*A cere* (demander) a pour complément d’objet direct *nota* ; *Hai să cerem nota?* propose de la demander ensemble.'
  ro.a1.unit29.lesson06.teach.mihai_da_buna:
    title: Mihai demande le total
    gloss: 'Mihai : Oui, bonne idée. Combien ça coûte au total ?'
    note: Reprend la question *Cât costă în total?* de la leçon 1.
  ro.a1.unit29.lesson06.teach.ana_sunt_treizeci:
    title: Ana annonce le total
    gloss: 'Ana : Ça fait cent trente-cinq lei. On partage ?'
    note: '*Împărțim* est la forme *noi* (nous) de *a împărți* (partager) ; *nota* est sous-entendu d’après le contexte.'
  ro.a1.unit29.lesson06.teach.mihai_nu_lasa:
    title: Mihai insiste pour payer
    gloss: 'Mihai : Non, laisse-moi payer aujourd’hui. Tu m’as tellement aidé.'
    note: '*Lasă-mă să* ... (laisse-moi...) est la façon habituelle de proposer de faire quelque chose ; *m-ai ajutat* (« tu m’as aidé ») est une forme du passé.'
  ro.a1.unit29.lesson06.teach.ana_ce_dragut:
    title: Ana est touchée
    gloss: 'Ana : C’est adorable de ta part ! Merci beaucoup.'
    note: '*Ce drăguț din partea ta!* (comme c’est gentil de ta part) est un compliment chaleureux et courant pour un geste généreux.'
  ro.a1.unit29.lesson06.teach.mihai_pot_plati:
    title: Mihai demande s’il peut payer par carte
    gloss: 'Mihai : Je peux payer par carte ici ?'
    note: Reprend la question *Pot plăti cu cardul aici?* de la leçon 2, cette fois dans le vrai restaurant.
  ro.a1.unit29.lesson06.teach.mihai_plateste_nota:
    title: 'Plătește : la forme il/elle'
    gloss: Mihai paie l’addition.
    note: '*Plătește* est la forme il/elle de *a plăti* (payer).'
