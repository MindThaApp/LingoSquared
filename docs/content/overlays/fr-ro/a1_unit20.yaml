teaching:
  ro.a1.unit20.lesson01.teach.reminder_vreau_un_ce:
    title: 'Rappel : Vreau, Un, Ce'
    gloss: Vreau (je veux) · Un (un, masc./neutre) · Ce (quel, que)
    note: '*Vreau* (je veux), *un* (un) et *ce* (quel, que, comme dans *Ce mai faceți?*) sont des mots que tu connais déjà -- réutilisés ici pour demander un vêtement.'
  ro.a1.unit20.lesson01.teach.tricou_vocab:
    title: T-shirt
    gloss: Tricou (t-shirt)
    note: Nom neutre -- il prend le même *un* (et non *o*) que les autres noms neutres/masculins déjà vus, comme *un leu*.
    example_gloss:
    - Je veux un t-shirt.
  ro.a1.unit20.lesson01.teach.culoare_vocab:
    title: Couleur
    gloss: Culoare (couleur)
    note: Nom féminin, utile pour demander en quelle couleur existe un article.
    example_gloss:
    - Quelle couleur ?
  ro.a1.unit20.lesson01.teach.rosu_vocab:
    title: Rouge
    gloss: Roșu (rouge)
    note: 'Se place après le nom qu’il qualifie, ce qui est l’ordre normal de l’adjectif en roumain : *tricou roșu*, littéralement « t-shirt rouge ».'
    example_gloss:
    - Je veux un t-shirt rouge.
  ro.a1.unit20.lesson01.teach.albastru_vocab:
    title: Bleu
    gloss: Albastru (bleu)
    note: 'Même schéma que *roșu* -- placé après le nom : *tricou albastru*.'
    example_gloss:
    - Je veux un t-shirt bleu.
  ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase:
    title: Je veux un t-shirt rouge.
    gloss: Vreau un tricou roșu.
    note: 'La demande de base : *vreau* (je veux) + *un tricou* (un t-shirt) + *roșu* (rouge), avec la couleur après le nom.'
  ro.a1.unit20.lesson02.teach.reminder_cat_costa_va_rog:
    title: 'Rappel : Cât, Costă, Vă, Rog'
    gloss: Cât costă? (Combien ça coûte ?) · Vă rog (s’il vous plaît, forme de politesse)
    note: '*Cât costă?* vient de la leçon du marché ; *vă rog* est le « s’il vous plaît » de politesse -- réutilisés ici pour demander le prix d’un vêtement et adoucir la demande.'
  ro.a1.unit20.lesson02.teach.reminder_mic_mica_mare:
    title: 'Rappel : Mic, Mică, Mare'
    gloss: Mic/Mică (petit/petite, masc.-neutre/fém.) · Mare (grand/grande, même forme au masc. et au fém. singulier)
    note: Les mots de taille que tu connais déjà grâce à la comparaison des aliments et des boissons -- réutilisés ici pour les tailles de vêtements.
  ro.a1.unit20.lesson02.teach.pantaloni_vocab:
    title: Pantalon
    gloss: Pantaloni (pantalon)
    note: S’emploie normalement au pluriel en roumain, alors que le français dit généralement « un pantalon » au singulier -- *pantaloni* désigne un seul pantalon.
    example_gloss:
    - Je veux un pantalon.
  ro.a1.unit20.lesson02.teach.marime_vocab:
    title: Taille
    gloss: Mărime (taille)
    note: Nom féminin -- il va avec le féminin *mică* (petit) rappelé plus haut et avec *mare* (grand), invariable.
    example_gloss:
    - Quelle taille ?
  ro.a1.unit20.lesson02.teach.ce_marime_phrase:
    title: Quelle taille ?
    gloss: Ce mărime? (Quelle taille ?)
    note: La question habituelle au comptoir d’un magasin -- courte et sans verbe, de la même forme elliptique que *Ce culoare?* (Quelle couleur ?).
  ro.a1.unit20.lesson02.teach.marime_mica_va_rog_phrase:
    title: Petite taille, s’il vous plaît.
    gloss: Mărime mică, vă rog.
    note: '*Mică* est la forme féminine de *mic*, accordée avec *mărime*, qui est féminin -- combiné avec *vă rog*, rappelé plus haut, pour indiquer poliment ta taille.'
  ro.a1.unit20.lesson02.teach.cat_costa_pantalonii_phrase:
    title: Combien coûte le pantalon ?
    gloss: Cât costă pantalonii? (Combien coûte le pantalon ?)
    note: '*Pantalonii* est la forme définie de *pantaloni* (« le pantalon ») -- les noms masculins au pluriel ajoutent *-i* pour exprimer « le/les » (*pantaloni* → *pantalonii*). Combiné avec *cât costă*, rappelé plus haut.'
  ro.a1.unit20.lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si:
    title: 'Rappel : Bună, Mulțumesc, Bine, La revedere, Și'
    gloss: Bună (salut) · Mulțumesc (merci) · Bine (bien) · La revedere (au revoir) · Și (et)
    note: Des salutations courantes et *și* (et), réutilisés ici pour ouvrir et clore le dialogue au magasin.
  ro.a1.unit20.lesson03.teach.reminder_zece_douazeci_de_lei:
    title: 'Rappel : Zece, Douăzeci, De, Lei'
    gloss: Zece (dix) · Douăzeci (vingt) · De (de, employé devant lei à partir de 20) · Lei (monnaie, pluriel de leu)
    note: Les nombres et la monnaie *leu/lei* que tu connais déjà -- réutilisés ici pour les prix du t-shirt et du pantalon.
  ro.a1.unit20.lesson03.teach.line01:
    title: Saluer Mihai et demander un t-shirt rouge
    gloss: Ana salue Mihai et dit qu’elle veut un t-shirt rouge.
    note: 'La phrase de demande de la première leçon : *Vreau un tricou roșu.*'
  ro.a1.unit20.lesson03.teach.line02:
    title: Demander la taille
    gloss: Mihai demande quelle taille elle veut.
    note: 'La question habituelle en magasin : *Ce mărime?* (Quelle taille ?).'
  ro.a1.unit20.lesson03.teach.line03:
    title: Indiquer la taille, poliment, et demander le prix
    gloss: Ana demande une petite taille, puis demande combien ça coûte.
    note: '*Mărime mică, vă rog* (petite taille, s’il vous plaît), puis *Cât costă?* (Combien ça coûte ?).'
  ro.a1.unit20.lesson03.teach.line04:
    title: Donner le prix
    gloss: Mihai dit que ça coûte cinquante lei.
    note: Reprend *cincizeci de lei*, rappelé plus haut.
  ro.a1.unit20.lesson03.teach.line05:
    title: Accepter, et demander aussi le prix du pantalon
    gloss: Ana accepte, puis dit qu’elle veut aussi un pantalon et demande son prix.
    note: '*Și* signifie ici « aussi » : *Vreau și pantaloni* -- « Je veux aussi un pantalon ».'
  ro.a1.unit20.lesson03.teach.line06:
    title: Donne le prix du pantalon
    gloss: Mihai dit que le pantalon coûte cent vingt lei.
    note: 'À partir de vingt, le roumain place *de* entre le nombre et le nom : *o sută douăzeci de lei*.'
  ro.a1.unit20.lesson03.teach.line07:
    title: Remercie Mihai et dis au revoir
    gloss: Ana le remercie et lui dit au revoir.
    note: Un remerciement poli et un au revoir.
  ro.a1.unit20.lesson03.teach.line08:
    title: Dis au revoir
    gloss: Mihai dit au revoir.
    note: Un simple au revoir, avec le prénom d’Ana.
