answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching unit01''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Spoken answers are assessed for intelligibility, not written punctuation.
  register: tu and dumneavoastră (and their matching verb forms, ai/aveți) are never interchangeable answers for each other's exercises, the same discipline unit01 established.
course:
  title: Roumain A1
  description: Les nombres de zéro à cent, avec les formations des nombres de 11 à 19 (-sprezece) et des dizaines (-zeci), l’opposition de genre doi/două, et l’emploi des nombres pour demander et donner un âge ou un numéro de téléphone, dans la suite d’Ana et de Mihai de l’unité 1.
units:
  ro.a1.unit02.numbers:
    title: Les nombres
lessons:
  ro.a1.unit02.lesson01.zero_to_ten:
    title: Les nombres de zéro à dix
  ro.a1.unit02.lesson02.eleven_to_hundred:
    title: Les nombres de onze à cent
  ro.a1.unit02.lesson03.age_and_phone:
    title: L’âge et le numéro de téléphone
teaching:
  ro.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: zéro
    note: '*Zero* est invariable ; on l’utilise aussi pour lire un chiffre à voix haute dans un nombre plus long ou dans un numéro de téléphone.'
    example_gloss: Zéro, un, deux.
  ro.a1.unit02.lesson01.teach.unu:
    title: Un
    gloss: un
    note: '*Unu* est la forme utilisée quand on compte seul. Devant un nom masculin ou neutre, il devient *un* (*un câine*, un chien) ; devant un nom féminin, il devient *o* (*o sută*, cent).'
    example_gloss: Un, deux, trois.
  ro.a1.unit02.lesson01.teach.doi:
    title: Deux (masculin)
    gloss: deux
    note: '*Doi* s’emploie avec les noms masculins (*doi bărbați*, deux hommes). Les noms féminins, ainsi que les noms neutres, qui se comportent comme des féminins au pluriel, prennent une autre forme ; voir la carte suivante.'
    example_gloss: Deux, trois, quatre.
  ro.a1.unit02.lesson01.teach.doi_doua_gender:
    title: Deux change selon le genre
    gloss: doi (masculin) / două (féminin et neutre)
    note: Contrairement au français « deux », qui est invariable, le roumain *doi* a une forme féminine distincte, *două*, obligatoire avec les noms féminins (*două femei*, deux femmes) et aussi avec les noms neutres, qui sont féminins au pluriel (*două numere*, deux numéros). À part un (*un*/*o*) et deux, les nombres de *trei* à *zece* restent identiques pour tous les genres.
  ro.a1.unit02.lesson01.teach.trei:
    title: Trois
    gloss: trois
    note: '*Trei* est invariable, quel que soit le genre.'
    example_gloss: Trois, quatre, cinq.
  ro.a1.unit02.lesson01.teach.patru:
    title: Quatre
    gloss: quatre
    note: '*Patru* est invariable. Attention à sa forme contractée irrégulière dans les nombres de 11 à 19 : *paisprezece* (14), et non *patrusprezece*.'
    example_gloss: Quatre, cinq, six.
  ro.a1.unit02.lesson01.teach.cinci:
    title: Cinq
    gloss: cinq
    note: '*Cinci* est invariable.'
    example_gloss: Cinq, six, sept.
  ro.a1.unit02.lesson01.teach.sase:
    title: Six
    gloss: six
    note: '*Șase* est invariable.'
    example_gloss: Six, sept, huit.
  ro.a1.unit02.lesson01.teach.sapte:
    title: Sept
    gloss: sept
    note: '*Șapte* est invariable.'
    example_gloss: Sept, huit, neuf.
  ro.a1.unit02.lesson01.teach.opt:
    title: Huit
    gloss: huit
    note: '*Opt* est invariable.'
    example_gloss: Huit, neuf, dix.
  ro.a1.unit02.lesson01.teach.noua:
    title: Neuf
    gloss: neuf
    note: '*Nouă* est invariable. Sans son signe diacritique, il serait identique à *noua* (« la nouvelle », féminin) ; tape donc bien le *ă* : les réponses saisies sont vérifiées avec leurs signes diacritiques.'
    example_gloss: Neuf, dix... terminé !
  ro.a1.unit02.lesson01.teach.zece:
    title: Dix
    gloss: dix
    note: '*Zece* est invariable et sert de base à tous les nombres de onze à dix-neuf (*zece* + *-sprezece*).'
    example_gloss: Dix ! Bravo !
  ro.a1.unit02.lesson02.teach.unsprezece:
    title: Onze
    gloss: onze
    note: '*Unsprezece* est construit sur *unu* + *spre* + *zece* (« un sur dix »), modèle que suivent tous les nombres de 11 à 19.'
    example_gloss: Dix, onze, douze.
  ro.a1.unit02.lesson02.teach.teens_pattern:
    title: De douze à dix-neuf
    gloss: doisprezece (12), treisprezece (13), paisprezece (14), cincisprezece (15), șaisprezece (16), șaptesprezece (17), optsprezece (18), nouăsprezece (19)
    note: 'Chaque nombre s’obtient en ajoutant *-sprezece* à la forme ordinaire du chiffre : *doi* → *doisprezece*, *trei* → *treisprezece*, et ainsi de suite jusqu’à *nouă* → *nouăsprezece*. Deux nombres sont irréguliers : quatorze, où *patru* se réduit à *pai-* (*paisprezece*, et non *patrusprezece*), et seize, où *șase* devient *șai-* (*șaisprezece*, et non *șasesprezece*).'
  ro.a1.unit02.lesson02.teach.douazeci:
    title: Vingt
    gloss: vingt
    note: '*Douăzeci* (« deux dizaines ») est un mot à part entière, la base de tous les nombres de 21 à 29.'
    example_gloss: Dix-neuf, vingt...
  ro.a1.unit02.lesson02.teach.douazeci_si_unu:
    title: Vingt et un
    gloss: vingt et un
    note: 'À partir de vingt et un, le roumain relie la dizaine et l’unité avec *și* (« et ») : *douăzeci și unu*, *douăzeci și doi*, etc. ; à la différence des nombres de 11 à 19, qui forment un seul mot.'
    example_gloss: Vingt, vingt et un, vingt-deux.
  ro.a1.unit02.lesson02.teach.tens_pattern:
    title: De trente à quatre-vingt-dix
    gloss: treizeci (30), patruzeci (40), cincizeci (50), șaizeci (60), șaptezeci (70), optzeci (80), nouăzeci (90)
    note: 'Chaque dizaine à partir de trente est le chiffre plus *-zeci* (« dizaines ») : *trei* → *treizeci*, *patru* → *patruzeci*, etc. Le seul changement d’orthographe concerne soixante : *șase* devient *șai-*, d’où *șaizeci* (le même *șai-* que dans *șaisprezece*). Contrairement au français, il n’y a pas de système en vingt pour 70, 80 et 90 : on dit simplement sept dizaines, huit dizaines, neuf dizaines.'
  ro.a1.unit02.lesson02.teach.o_suta:
    title: Cent
    gloss: cent
    note: '*O sută* emploie *o* (la forme féminine de « un/une »), et non *un*, parce que *sută* est un nom féminin.'
    example_gloss: Quatre-vingt-dix, cent !
  ro.a1.unit02.lesson03.teach.cati_ani_ai:
    title: Demander l’âge dans un registre familier
    gloss: Quel âge as-tu ?
    note: Littéralement « combien d’années as-tu », avec *avea* (avoir), comme le français utilise *avoir* pour l’âge au lieu d’« être ». *Câți* (combien, masculin) s’accorde avec *ani* (ans, masculin).
  ro.a1.unit02.lesson03.teach.am_nouasprezece_ani:
    title: Donner son âge (moins de vingt ans)
    gloss: J’ai dix-neuf ans.
    note: '*Am* est la forme de *eu* du verbe *avea*. Pour les nombres inférieurs à vingt, on n’a pas besoin de *de* devant *ani*.'
  ro.a1.unit02.lesson03.teach.cati_ani_aveti:
    title: Demander l’âge dans un registre formel
    gloss: Quel âge as-tu ?
    note: '*Aveți* est la forme de politesse (*dumneavoastră*) de *avea*, en accord avec le registre poli vu dans l’unité 1.'
  ro.a1.unit02.lesson03.teach.am_treizeci_de_ani:
    title: Donner son âge (vingt ans et plus)
    gloss: J’ai trente ans.
    note: '*De* apparaît ici parce que *treizeci* est égal ou supérieur à vingt ; voir la carte suivante pour la règle complète.'
  ro.a1.unit02.lesson03.teach.de_insertion_rule:
    title: Quand ajouter de devant un nom
    gloss: '2-19 : pas de de (doi ani) / 20 et plus : on ajoute de (treizeci de ani)'
    note: 'Une règle propre au roumain, sans équivalent en français : les nombres de 2 à 19 se placent directement devant le nom (*doi ani*, deux ans ; *nouăsprezece ani*, dix-neuf ans), mais à partir de 20, *de* s’intercale entre le nombre et le nom (*treizeci de ani*, trente ans ; *o sută de ani*, cent ans). Un cas particulier : *un an* (un an), au singulier, sans *de* dans tous les cas.'
  ro.a1.unit02.lesson03.teach.care_e_numarul_tau:
    title: Demander un numéro de téléphone (tutoiement)
    gloss: Quel est ton numéro de téléphone ?
    note: '*Care* (quel) est la façon naturelle de demander un numéro précis qui existe, et non *ce*. *Număr* est un nom neutre ; au singulier, il s’accorde comme un masculin : *ton* se dit donc *tău*, et non *ta*.'
  ro.a1.unit02.lesson03.teach.care_este_numarul_dvs:
    title: Demander un numéro de téléphone (vouvoiement)
    gloss: Quel est ton numéro de téléphone ?
    note: '*Este* est la forme complète de *e*, plus courante à l’oral soigné ou formel. *Dumneavoastră* garde l’échange poli, c’est le mot vu dans l’unité 1.'
  ro.a1.unit02.lesson03.teach.raspuns_telefon:
    title: Donner un numéro de téléphone chiffre par chiffre
    gloss: 'C’est le : zéro, sept, deux, un, quatre, cinq, six, sept, huit, neuf.'
    note: Dans cette unité, on s’en tient à la lecture simple chiffre par chiffre, comme dans l’unité 1 pour le choix du registre ; en réalité, on peut aussi regrouper les chiffres par deux, mais les chiffres isolés sont toujours compris.
