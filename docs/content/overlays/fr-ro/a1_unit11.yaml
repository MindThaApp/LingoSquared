answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's new words are all register-neutral -- mergem (first-person plural) and nu pot (first-person singular) don't change with tu/dumneavoastră, and atunci/sigur are invariant connective/response words with no person marking. No new second-person forms are introduced. Ana and Mihai's closing dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08/unit09/unit10.
course:
  title: Roumain A1
  description: 'Proposer, accepter, refuser et fixer un projet simple en roumain : mergem (on y va), nu pot (je ne peux pas), atunci (alors / dans ce cas) et sigur (bien sûr). Tu retrouves Ana et Mihai, qui s’organisent pour se retrouver au parc.'
units:
  ro.a1.unit11.plans:
    title: Projets
lessons:
  ro.a1.unit11.lesson01.mergem_la_cinema:
    title: On va au cinéma ?
  ro.a1.unit11.lesson02.nu_pot_atunci:
    title: Je ne peux pas. Alors ?
  ro.a1.unit11.lesson03.planul_de_duminica:
    title: Le projet du dimanche
teaching:
  ro.a1.unit11.lesson01.teach.reminder_da_bine:
    title: 'Rappel : da, bine, nu, mulțumesc'
    gloss: da (oui) · bine (bien / d’accord) · nu (non) · mulțumesc (merci)
    note: 'Tous ces mots sont déjà connus depuis l’unité 6 : ici, ils se combinent pour accepter un projet, et ils servent à l’exercice d’association de vocabulaire de cette leçon.'
  ro.a1.unit11.lesson01.teach.mergem_vocab:
    title: On y va
    gloss: Mergem (on y va)
    note: 'C’est la première personne du pluriel de *a merge*, que tu as déjà vu sous les formes *merg* (je vais, unité 10) et *mergeți* (l’impératif de politesse, unité 9) : c’est le même verbe, à une autre personne. Employé seul, avec une intonation montante, il permet de proposer naturellement de faire quelque chose ensemble.'
    example_gloss:
    - On va au cinéma ?
  ro.a1.unit11.lesson01.teach.cinema_vocab:
    title: Le cinéma
    gloss: Cinema (le cinéma)
    note: 'Ce mot ressemble beaucoup au français « cinéma » : il est facile à reconnaître.'
    example_gloss:
    - On va au cinéma ?
  ro.a1.unit11.lesson01.teach.mergem_cinema_phrase:
    title: On va au cinéma ?
    gloss: Mergem la cinema? (On va au cinéma ?)
    note: 'C’est une invitation complète : pas besoin d’ajouter « tu veux », le point d’interrogation suffit à transformer « on va » en proposition.'
  ro.a1.unit11.lesson01.teach.parc_vocab:
    title: Le parc
    gloss: Parc (le parc)
    note: Un autre mot très proche du français, comme *cinema*.
    example_gloss:
    - On va au parc ?
  ro.a1.unit11.lesson01.teach.mergem_parc_phrase:
    title: On va au parc ?
    gloss: Mergem la parc? (On va au parc ?)
    note: C’est la même formule d’invitation que *Mergem la cinema?*, avec un autre lieu.
  ro.a1.unit11.lesson01.teach.da_bine_phrase:
    title: Oui, d’accord !
    gloss: Da, bine! (Oui, d’accord !)
    note: 'Une façon courte et naturelle d’accepter un projet : des mots déjà connus, dans une nouvelle combinaison.'
  ro.a1.unit11.lesson02.teach.reminder_nu_pot:
    title: 'Rappel : nu, pot'
    gloss: nu (non / ne… pas) · pot (je peux)
    note: '*Nu* est connu depuis l’unité 6 ; pot l’est depuis l’unité 9, dans *cum pot să ajung* (comment puis-je arriver). Placé devant un verbe, nu exprime la négation : *nu pot* signifie « je ne peux pas ». C’est la façon de refuser un projet dans cette unité.'
  ro.a1.unit11.lesson02.teach.reminder_sambata_duminica:
    title: 'Rappel : sâmbătă, duminică'
    gloss: sâmbătă (samedi) · duminică (dimanche)
    note: Les deux mots sont déjà connus grâce aux jours de la semaine de l’unité 3.
  ro.a1.unit11.lesson02.teach.mergem_parc_sambata_phrase:
    title: On va au parc samedi ?
    gloss: Mergem la parc sâmbătă? (On va au parc samedi ?)
    note: 'C’est l’invitation de la première leçon, avec un jour en plus : *Mergem la parc?* associé à un nom de jour.'
  ro.a1.unit11.lesson02.teach.nu_pot_sambata_phrase:
    title: Je ne peux pas samedi
    gloss: Nu pot sâmbătă. (Je ne peux pas samedi.)
    note: 'Un refus simple : *nu pot* suivi du jour que l’on refuse.'
  ro.a1.unit11.lesson02.teach.atunci_vocab:
    title: Alors / dans ce cas
    gloss: Atunci (alors / dans ce cas)
    note: 'Il ne faut pas le confondre avec *apoi* (« puis », unité 9, qui enchaîne deux actions) : *atunci* propose une alternative ou tire une conséquence. C’est le mot naturel pour dire « dans ce cas, et si… ? » quand on change de projet.'
    example_gloss:
    - Alors, dimanche ?
  ro.a1.unit11.lesson02.teach.atunci_duminica_phrase:
    title: Alors, dimanche ?
    gloss: Atunci, duminică? (Alors, dimanche ?)
    note: 'Une courte contre-proposition après un refus : il suffit de nommer un nouveau jour, sans répéter toute l’invitation.'
  ro.a1.unit11.lesson02.teach.da_bine_duminica_phrase:
    title: Oui, d’accord ! Dimanche.
    gloss: Da, bine! Duminică. (Oui, d’accord ! Dimanche.)
    note: On accepte le nouveau jour avec la même formule courte que *Da, bine!* de la première leçon.
  ro.a1.unit11.lesson03.teach.reminder_la_ce_ora_la_ora_patru:
    title: 'Rappel : la ce oră, la ora, patru'
    gloss: la ce oră (à quelle heure) · la ora (à… heures) · patru (quatre)
    note: La ce oră et la ora sont déjà connus depuis l’unité 4 (demander et dire l’heure) ; patru l’est depuis les nombres de l’unité 2. Ici, ils se combinent pour fixer l’heure du rendez-vous.
  ro.a1.unit11.lesson03.teach.reminder_buna_multumesc_la_revedere_da_ana_mihai:
    title: 'Rappel : bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (salut) · mulțumesc (merci) · la revedere (au revoir) · da (oui) · Ana, Mihai (prénoms)
    note: 'Tous ces mots sont déjà connus des unités précédentes : ici, Ana et Mihai se mettent d’accord sur une heure pour leur projet.'
  ro.a1.unit11.lesson03.teach.sigur_vocab:
    title: Bien sûr
    gloss: Sigur (bien sûr)
    note: Une façon courante de confirmer un projet, seul dans la réplique, comme « Bien sûr ! » ou « Évidemment ! » en français.
    example_gloss:
    - Bien sûr ! À quatre heures.
  ro.a1.unit11.lesson03.teach.sigur_phrase:
    title: Bien sûr ! À quatre heures.
    gloss: Sigur! La ora patru. (Bien sûr ! À quatre heures.)
    note: Une seule courte réponse confirme à la fois le projet et l’heure exacte.
  ro.a1.unit11.lesson03.teach.line01:
    title: Saluer et proposer le parc
    gloss: Ana salue Mihai et lui demande s’ils vont au parc dimanche.
    note: Cette réplique associe l’invitation *Mergem la parc?* de cette unité et *duminică*.
  ro.a1.unit11.lesson03.teach.line02:
    title: Accepter et demander l’heure
    gloss: Mihai accepte et demande à quelle heure.
    note: On réutilise la question *La ce oră?* de l’unité 4.
  ro.a1.unit11.lesson03.teach.line03:
    title: Proposer une heure
    gloss: Ana propose quatre heures.
    note: Une courte question qui reprend la structure *la ora* de l’unité 4 avec le mot *patru* de cette unité.
  ro.a1.unit11.lesson03.teach.line04:
    title: Confirmer et remercier
    gloss: Mihai confirme par « Bien sûr ! » et remercie Ana.
    note: Cette réplique associe *sigur*, nouveau dans cette unité, et *mulțumesc*, déjà connu.
  ro.a1.unit11.lesson03.teach.line05:
    title: Dire au revoir
    gloss: Ana dit au revoir.
    note: C’est la même formule de clôture que dans les dialogues de toutes les unités précédentes.
  ro.a1.unit11.lesson03.teach.line06:
    title: Terminer la rencontre
    gloss: Mihai dit au revoir à son tour, en employant le prénom d’Ana.
    note: C’est la même formule de clôture amicale que dans les dialogues de toutes les unités précédentes.
