answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (doare, cap, stomac, simt, bolnav, nevoie, doctor, odihnă, multă) is used only in fixed first-person (Mihai's own "Nu mă simt bine"/"Sunt bolnav") or already-established formal ("Aveți nevoie de...?") forms. No informal-tu form is introduced this unit; Ana and Mihai keep their existing formal register with each other.
course:
  title: Roumain A1
  description: 'Dire un problème de santé simple en roumain : Doare (fait mal), Bolnav (malade) et Doctor (médecin), pendant que Mihai ne se sent pas bien et qu’Ana prend de ses nouvelles et lui donne des conseils.'
units:
  ro.a1.unit16.health:
    title: La santé
lessons:
  ro.a1.unit16.lesson01.ma_doare_capul:
    title: J’ai mal à la tête
  ro.a1.unit16.lesson02.nu_ma_simt_bine:
    title: Je ne me sens pas bien
  ro.a1.unit16.lesson03.mihai_este_bolnav:
    title: Mihai est malade
teaching:
  ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau:
    title: 'Rappel : mă, vă, ce, sau'
    gloss: mă (me) · vă (vous, formel) · ce (quoi, que) · sau (ou)
    note: 'Mă vient des unités 1 et 10 (mă numesc, mă trezesc) ; vă vient des unités 1, 6, 7 et 13 (vă rog) ; ce vient des unités 1, 3, 4 et 15 ; sau vient de l’unité 13. Cette unité réutilise ces quatre mots dans un nouvel emploi : dire ce qui fait mal.'
  ro.a1.unit16.lesson01.teach.doare_vocab:
    title: Fait mal
    gloss: Doare (fait mal)
    note: 'Verbe impersonnel : le roumain dit littéralement « cela me fait mal » (*mă doare*). *Mă doare* seul signifie « j’ai mal » ; ajoute la partie du corps pour dire ce qui fait mal : *Mă doare capul*.'
    example_gloss:
    - Ça fait mal.
  ro.a1.unit16.lesson01.teach.cap_vocab:
    title: Tête
    gloss: Cap (tête)
    note: 'Nom neutre terminé par une consonne : il prend *-ul* pour dire « la tête », la même terminaison que *tren*→*trenul* et *peron*→*peronul*.'
    example_gloss:
    - J’ai mal à la tête.
  ro.a1.unit16.lesson01.teach.ce_va_doare_phrase:
    title: Où avez-vous mal ?
    gloss: Ce vă doare? (Qu’est-ce qui vous fait mal ?)
    note: '*Ce* (quoi) + *vă* (vous, complément formel) + *doare* : tous ces mots ont déjà été vus ou viennent d’être introduits, et ils forment ici une nouvelle question.'
  ro.a1.unit16.lesson01.teach.stomac_vocab:
    title: Estomac
    gloss: Estomac
    note: 'Neutre et terminé par une consonne : « l’estomac » se dit *stomacul*, avec la même terminaison *-ul* que *cap* -> *capul*.'
    example_gloss:
    - J’ai mal au ventre.
  ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase:
    title: Avez-vous mal à la tête ou à l’estomac ?
    gloss: Vă doare capul sau stomacul ? (Avez-vous mal à la tête ou à l’estomac ?)
    note: '*Vă* (vous, forme de politesse) à la place de *mă* transforme la phrase en question adressée à l’autre personne ; *sau* (ou, vu à l’unité 13) relie les deux parties du corps que tu viens d’apprendre.'
  ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de:
    title: 'Rappel : nu, bine, am, un, de'
    gloss: nu (ne… pas / non) · bine (bien) · am (j’ai) · un (un, masculin/neutre) · de (de)
    note: Nu et bine viennent des unités 1, 6 et 11 ; am vient des unités 2, 5 et 15 ; un et de viennent des unités 6, 7 et 15. Cette unité réutilise ces cinq mots pour dire qu’on ne se sent pas bien et qu’on a besoin d’un médecin.
  ro.a1.unit16.lesson02.teach.ma_simt_vocab:
    title: je me sens
    gloss: Mă simt (je me sens)
    note: Verbe réfléchi, littéralement « je me sens », avec le même schéma *mă* + verbe que *mă trezesc* et *mă culc* de l’unité 10.
    example_gloss:
    - Je me sens bien.
  ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase:
    title: Je ne me sens pas bien
    gloss: Nu mă simt bine. (Je ne me sens pas bien.)
    note: '*Nu* nie *mă simt bine* : c’est la façon naturelle de dire que quelque chose ne va pas, sans encore nommer de symptôme précis.'
  ro.a1.unit16.lesson02.teach.bolnav_vocab:
    title: Malade
    gloss: Bolnav (malade, masculin)
    note: Forme masculine de l’adjectif, comme la dit Mihai (*Sunt bolnav*). Une femme dit *Sunt bolnavă* (forme féminine).
    example_gloss:
    - Je suis malade.
  ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase:
    title: J’ai besoin d’un médecin
    gloss: Am nevoie de un doctor. (J’ai besoin d’un médecin.)
    note: '*Am nevoie de* (j’ai besoin de, littéralement « j’ai besoin de ») + *un doctor* : une expression figée, utile pour demander de l’aide en toute situation, pas seulement chez le médecin.'
  ro.a1.unit16.lesson02.teach.doctor_vocab:
    title: Doctor
    gloss: Médecin
    note: 'Masculin : « un médecin » se dit *un doctor*.'
    example_gloss:
    - J’ai besoin d’un médecin.
  ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da:
    title: 'Rappel : Ce mai faceți?, Aveți, Da'
    gloss: Ce mai faceți? (comment allez-vous ?) · Aveți (vous avez) · Da (oui)
    note: Ce mai faceți vient de l’unité 1 ; Aveți de l’unité 5 ; Da des unités 6 et 11. Tous sont réutilisés dans le dialogue de cette unité.
  ro.a1.unit16.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Rappel : bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (bonjour) · mulțumesc (merci) · la revedere (au revoir) · Ana, Mihai (prénoms)
    note: 'Tout cela a déjà été vu dans les unités précédentes : c’est la même façon aimable de commencer et de terminer que dans tous les dialogues du cours.'
  ro.a1.unit16.lesson03.teach.reminder_spitalul_vizavi_magazin:
    title: 'Rappel : Spitalul este vizavi de magazin'
    gloss: Spitalul este vizavi de magazin. (L’hôpital est en face du magasin.)
    note: 'Phrase reprise telle quelle de l’unité 8 : l’hôpital n’a pas changé de place, et la note de lecture de cette unité y renvoie.'
  ro.a1.unit16.lesson03.teach.odihna_vocab:
    title: Repos
    gloss: Odihnă (repos)
    note: 'Nom féminin : c’est ce que recommande un médecin (ou un ami) quand on ne se sent pas bien.'
    example_gloss:
    - Tu as besoin de repos.
  ro.a1.unit16.lesson03.teach.multa_apa_vocab:
    title: Beaucoup d’eau
    gloss: Multă apă (beaucoup d’eau)
    note: '*Multă* (beaucoup de, féminin) s’accorde avec le nom féminin *apă* (eau, vu à l’unité 6) : une expression figée, du genre de celles qu’un médecin peut recommander.'
    example_gloss:
    - Du repos et beaucoup d’eau.
  ro.a1.unit16.lesson03.teach.line01:
    title: Saluer et demander comment il va
    gloss: Ana salue Mihai et lui demande comment il va.
    note: Reprend la salutation *Ce mai faceți?* de l’unité 1.
  ro.a1.unit16.lesson03.teach.line02:
    title: Dire qu’on ne se sent pas bien
    gloss: Mihai dit qu’il ne se sent pas bien et qu’il a mal à la tête.
    note: Combine les phrases de cette unité vues aux leçons 1 et 2.
  ro.a1.unit16.lesson03.teach.line03:
    title: Demander s’il a besoin d’un médecin
    gloss: Ana lui demande s’il a besoin d’un médecin.
    note: Reprend la phrase de la leçon 2 de cette unité sous forme de question, avec *aveți* de l’unité 5.
  ro.a1.unit16.lesson03.teach.line04:
    title: Confirmer qu’on est malade et qu’on a besoin d’un médecin
    gloss: 'Mihai répond oui : il est malade et a besoin d’un médecin.'
    note: Combine *sunt bolnav* et *am nevoie de un doctor* de cette unité.
  ro.a1.unit16.lesson03.teach.line05:
    title: Donner un conseil et dire au revoir
    gloss: Ana lui conseille du repos et beaucoup d’eau, puis lui dit au revoir.
    note: 'Utilise l’expression *Odihnă și multă apă* de cette leçon : un conseil de santé en plus du simple au revoir habituel du cours.'
  ro.a1.unit16.lesson03.teach.line06:
    title: La remercier et dire au revoir
    gloss: Mihai remercie Ana et lui dit au revoir.
    note: La même formule de clôture que dans les dialogues de toutes les unités précédentes.
