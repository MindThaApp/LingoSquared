teaching:
  ro.a1.unit13.lesson01.teach.reminder_cafea_ceai_paine:
    title: 'Rappel : cafea, ceai, pâine'
    gloss: cafea (café) · ceai (thé) · pâine (pain)
    note: 'Tous ces mots sont déjà vus à l’unité 6 : ici, ils se combinent avec la nouvelle grammaire de l’unité, pour dire ce qu’on aime ou non.'
  ro.a1.unit13.lesson01.teach.imi_place_vocab:
    title: J’aime
    gloss: Îmi place (j’aime)
    note: 'Littéralement « à moi il plaît » : *îmi* (à moi) plus *place* (plaît), invariable. Pour parler de ce qu’on aime en général, le roumain emploie la forme définie du nom (*cafeaua*, et non *cafea* vu à l’unité 6), comme le français qui dit « j’aime le café ».'
    example_gloss:
    - J’aime le café.
  ro.a1.unit13.lesson01.teach.imi_place_cafeaua_phrase:
    title: J’aime le café
    gloss: Îmi place cafeaua. (J’aime le café.)
    note: 'Le schéma complet : Îmi place + le nom à la forme définie.'
  ro.a1.unit13.lesson01.teach.imi_place_ceaiul_phrase:
    title: J’aime le thé
    gloss: Îmi place ceaiul. (J’aime le thé.)
    note: 'Le même schéma que *Îmi place cafeaua*, avec une autre boisson : *ceaiul* est la forme définie de *ceai*, déjà vu à l’unité 6.'
  ro.a1.unit13.lesson01.teach.numi_place_vocab:
    title: Je n’aime pas
    gloss: Nu-mi place (je n’aime pas)
    note: 'Le négatif de *Îmi place* : en roumain parlé, *nu îmi* se contracte en *nu-mi* ; cette forme courte avec trait d’union est donc la façon naturelle de le dire, pas un simple raccourci.'
    example_gloss:
    - Je n’aime pas le pain.
  ro.a1.unit13.lesson01.teach.numi_place_painea_phrase:
    title: Je n’aime pas le pain
    gloss: Nu-mi place pâinea. (Je n’aime pas le pain.)
    note: '*Pâinea* est la forme définie de *pâine*, déjà vu à l’unité 6, sur le même modèle que *cafeaua* et *ceaiul*.'
  ro.a1.unit13.lesson02.teach.reminder_imi_place_numi_place:
    title: 'Rappel : Îmi place, Nu-mi place'
    gloss: Îmi place (j’aime) · Nu-mi place (je n’aime pas)
    note: 'Deux expressions de la première leçon de cette unité : ici, elles reçoivent une forme interrogative.'
  ro.a1.unit13.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Rappel : cafeaua, ceaiul, pâinea'
    gloss: cafeaua (le café) · ceaiul (le thé) · pâinea (le pain)
    note: 'Tous ces mots viennent de la première leçon de cette unité : on les réutilise ici dans les formes de question et de préférence.'
  ro.a1.unit13.lesson02.teach.va_place_vocab:
    title: Vous aimez... ?
    gloss: Vă place...? (Vous aimez... ?)
    note: 'La forme de politesse de la question avec *Îmi place* : *vă* (à vous, politesse) remplace *îmi* (à moi), dans le même registre *dumneavoastră* que *aveți* et *faceți*. Ajoute un nom à la forme définie, ou emploie-la seule quand le sujet est déjà clair.'
    example_gloss:
    - Vous aimez le café ?
  ro.a1.unit13.lesson02.teach.va_place_cafeaua_phrase:
    title: Vous aimez le café ?
    gloss: Vă place cafeaua? (Vous aimez le café ?)
    note: 'Le schéma complet : Vă place + le nom à la forme définie, avec une intonation montante de question.'
  ro.a1.unit13.lesson02.teach.prefer_vocab:
    title: je préfère
    gloss: Prefer (je préfère)
    note: 'Un mot transparent, proche du français : pas de construction « à moi », *prefer* fonctionne comme un verbe ordinaire, comme « préférer » : *Prefer* + ce qu’on préfère, à la forme définie comme avec *Îmi place*.'
    example_gloss:
    - Je préfère le café.
  ro.a1.unit13.lesson02.teach.prefer_cafeaua_phrase:
    title: Je préfère le café
    gloss: Prefer cafeaua. (Je préfère le café.)
    note: 'Plus fort que *Îmi place cafeaua* : utile pour choisir entre deux choses.'
  ro.a1.unit13.lesson02.teach.sau_vocab:
    title: ou
    gloss: Sau (ou)
    note: Relie deux options quand on propose ou demande un choix ; à ne pas confondre avec *și* (et) des unités 10 et 12, qui relie deux choses vraies ensemble.
    example_gloss:
    - Café ou thé ?
  ro.a1.unit13.lesson02.teach.cafea_sau_ceai_phrase:
    title: Café ou thé ?
    gloss: Cafea sau ceai? (Café ou thé ?)
    note: 'Une façon courte et naturelle de proposer un choix : on emploie ici les formes simples (*cafea*, *ceai*), et non les formes définies *cafeaua*/*ceaiul*, car c’est une offre ouverte et non une affirmation générale sur le café ou le thé.'
  ro.a1.unit13.lesson03.teach.reminder_va_place_prefer_sau:
    title: 'Rappel : Vă place, Prefer, Sau'
    gloss: Vă place? (Vous aimez ?) · Prefer (je préfère) · Sau (ou)
    note: 'Tous viennent de la deuxième leçon de cette unité : ici, Ana et Mihai les emploient ensemble.'
  ro.a1.unit13.lesson03.teach.reminder_imi_place_numi_place_cafeaua_ceaiul_painea:
    title: 'Rappel : Îmi place, Nu-mi place, cafeaua, ceaiul, pâinea'
    gloss: Îmi place (j’aime) · Nu-mi place (je n’aime pas) · cafeaua (le café) · ceaiul (le thé) · pâinea (le pain)
    note: 'Tous viennent de la première leçon de cette unité : ici, Ana et Mihai disent chacun ce qu’ils aiment et n’aiment pas.'
  ro.a1.unit13.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Rappel : bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (salut) · mulțumesc (merci) · la revedere (au revoir) · Ana, Mihai (prénoms)
    note: 'Tous déjà vus dans les unités précédentes : c’est le même schéma amical d’ouverture et de clôture que dans tous les dialogues du cours.'
  ro.a1.unit13.lesson03.teach.line01:
    title: 'Saluer et demander : café ou thé ?'
    gloss: Mihai salue Ana et lui demande si elle aime le café ou le thé.
    note: Combine *Vă place...?* de cette unité avec *sau* pour proposer les deux options dans une seule question.
  ro.a1.unit13.lesson03.teach.line02:
    title: Dire une préférence et un goût négatif
    gloss: Ana dit qu’elle préfère le café et qu’elle n’aime pas le thé.
    note: 'Combine *Prefer* avec *Nu-mi place* : sa préférence pour le café correspond à sa commande habituelle des unités 6 et 12.'
  ro.a1.unit13.lesson03.teach.line03:
    title: Dire la préférence opposée
    gloss: Mihai dit qu’il aime le thé et qu’il n’aime pas le café.
    note: Correspond à l’ordre habituel de Mihai dans les unités 6 et 12 (ceai, jamais cafea).
  ro.a1.unit13.lesson03.teach.line04:
    title: Demander aussi pour le pain
    gloss: Ana demande à Mihai s’il aime aussi le pain.
    note: Elle commence par la courte relance *Și pâinea?* (Et le pain ?), puis pose la question complète avec *Vă place...?* sur un nouveau sujet, *pâinea*.
  ro.a1.unit13.lesson03.teach.line05:
    title: Confirmer, remercier et dire au revoir
    gloss: Mihai répond oui, il aime le pain, remercie Ana et dit au revoir.
    note: 'Correspond à l’ordre habituel de Mihai dans l’unité 6 (pâine) : la même formule de clôture qui termine le dialogue de chaque unité précédente.'
  ro.a1.unit13.lesson03.teach.line06:
    title: Terminer la conversation
    gloss: Ana dit au revoir à son tour, en utilisant le prénom de Mihai.
    note: La même formule de clôture amicale qui termine le dialogue de chaque unité précédente.
