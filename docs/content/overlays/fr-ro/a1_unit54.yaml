  ro.a1.unit54.lesson04.exercise02.comprehend_filmul_nou:
    instruction: Écoute le dialogue et choisis le film que Nina veut voir.
    correct_option: Le nouveau film.
    distractors:
    - La séance pour enfants.
    - N’importe quel film lui convient.
    - Elle ne le dit pas.
    accepted_answers:
    - value: Le nouveau film.
      status: correct
    feedback: 'Nina dit : *Aș vrea să văd filmul nou, vă rog.* Avec un adjectif, l’article se place sur le premier mot : *film* plus *nou* donne *filmul nou*.'
    prompt_blocks:
    - Quel film Nina veut-elle voir ?
  ro.a1.unit54.lesson04.exercise03.comprehend_pentru_ce_ora:
    instruction: Écoute le dialogue et choisis ce qu’Irina demande ensuite à Nina.
    correct_option: L’heure à laquelle elle souhaite assister à la séance.
    distractors:
    - Si elle veut du pop-corn.
    - Si elle veut un reçu.
    - Elle ne demande rien.
    accepted_answers:
    - value: L’heure à laquelle elle souhaite assister à la séance.
      status: correct
    feedback: 'Irina dit : *pentru ce oră?* Littéralement : « pour quelle heure ».'
    prompt_blocks:
    - Sur quoi Irina interroge-t-elle ensuite Nina ?
  ro.a1.unit54.lesson04.exercise04.comprehend_la_ora_opt:
