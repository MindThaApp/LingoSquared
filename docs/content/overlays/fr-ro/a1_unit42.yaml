    title: Nina découvre la personnalité de chacun
    gloss: Nina est nouvelle au café linguistique. Elle demande à Mihai comment sont les autres. Mihai lui raconte. Ana est gentille et patiente ; elle travaille comme infirmière. Andrei est drôle et suit un cours d’espagnol. Elena est curieuse ; elle aime apprendre des choses nouvelles. Mihai lui-même est calme.
