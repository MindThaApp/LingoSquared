answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's "Vă rog" (formal, sourced) and "Te rog" (informal, freshly authored) are register-sensitive parallels, matching unit02's ai/aveți and unit05's ai frați/aveți frați pattern -- accept either register for a general "please" unless an exercise explicitly names one. Ana and Mihai's closing café dialogue keeps their existing polite register with each other (both use "vă rog," not "te rog").
course:
  title: Roumain A1
  description: 'Commander à manger et à boire en roumain : café, thé, pain et plus encore, avec la formule centrale « Aș dori ... » (je voudrais ...) et le couple de politesse vă rog/te rog. Tu retrouves Ana et Mihai qui se retrouvent dans un café.'
units:
  ro.a1.unit06.food:
    title: Nourriture et boissons
lessons:
  ro.a1.unit06.lesson01.bauturi:
    title: Les boissons
  ro.a1.unit06.lesson02.va_rog_si_mancare:
    title: S’il vous plaît, et la nourriture
  ro.a1.unit06.lesson03.la_cafenea:
    title: Au café
teaching:
  ro.a1.unit06.lesson01.teach.reminder_un_o_si:
    title: 'Rappel : un, o, și'
    gloss: un/o (un, une) · și (et)
    note: Ces trois mots sont déjà apparus dans des unités précédentes (*și* dans l’unité 1, *o* dans l’unité 2, *un* dans l’unité 4) ; ici, ils reviennent pour parler de nourriture et de boissons.
  ro.a1.unit06.lesson01.teach.as_dori:
    title: Je voudrais ...
    gloss: Aș dori ... (Je voudrais ...)
    note: 'La façon polie et courante de commander quelque chose en roumain : une forme figée du conditionnel, qui ne change pas selon ce qui suit.'
  ro.a1.unit06.lesson01.teach.apa:
    title: L’eau
    gloss: apă (eau)
    note: 'Un nom féminin : il s’emploie sans article quand la quantité n’est pas précisée, comme en français on dirait « de l’eau » sans préciser.'
    example_gloss: Je voudrais de l’eau.
  ro.a1.unit06.lesson01.teach.cafea:
    title: Le café
    gloss: cafea (café)
    note: 'Féminin : il se combine avec *o* (« une ») comme tout autre nom féminin.'
    example_gloss: Je voudrais un café.
  ro.a1.unit06.lesson01.teach.ceai:
    title: Le thé
    gloss: ceai (thé)
    note: 'Il se combine avec *un* (« un »), et non avec *o* : ceai est un nom masculin/neutre.'
    example_gloss: Je voudrais un thé.
  ro.a1.unit06.lesson01.teach.suc:
    title: Le jus
    gloss: suc (jus)
    note: Il prend aussi *un*, selon le même schéma que ceai.
    example_gloss: Je voudrais un jus.
  ro.a1.unit06.lesson01.teach.lapte:
    title: Le lait
    gloss: lapte (lait)
    note: Comme apă, il se dit généralement sans article quand la quantité n’est pas précisée.
    example_gloss: Je voudrais du lait.
  ro.a1.unit06.lesson01.teach.mi_e_sete:
    title: j’ai soif
    gloss: Mi-e sete (j’ai soif)
    note: 'Une expression figée : littéralement, elle est plus proche de « la soif est à moi » que de « j’ai soif » mot à mot.'
  ro.a1.unit06.lesson01.teach.as_dori_o_cafea:
    title: Je voudrais un café
    gloss: Je voudrais un café.
    note: Elle réunit la formule de commande et un nom de boisson féminin dans une phrase complète.
  ro.a1.unit06.lesson02.teach.reminder_multumesc_bine_da_nu:
    title: 'Rappel : mulțumesc, bine, da, nu'
    gloss: mulțumesc (merci) · bine (bien) · da (oui) · nu (non)
    note: '*Mulțumesc* et *bine* sont apparus dans les salutations de l’unité 1, *da* et *nu* dans les unités 3 et 5 ; ici, ils reviennent autour de la nourriture et de la politesse.'
  ro.a1.unit06.lesson02.teach.mi_e_foame:
    title: j’ai faim
    gloss: Mi-e foame (j’ai faim)
    note: La même expression figée que *Mi-e sete*, avec foame (faim) au lieu de sete (soif).
  ro.a1.unit06.lesson02.teach.paine:
    title: Le pain
    gloss: pâine (pain)
    note: Il se dit généralement sans article, comme « du pain » en français quand on ne précise pas la quantité.
    example_gloss: J’ai faim. Je voudrais du pain.
  ro.a1.unit06.lesson02.teach.mancare:
    title: Nourriture
    gloss: mâncare (nourriture)
    note: Le mot général pour « nourriture », et non un plat précis.
    example_gloss: Je voudrais à manger.
  ro.a1.unit06.lesson02.teach.carne:
    title: La viande
    gloss: carne (viande)
    note: Le mot général pour « viande » ; les types précis (carne de vită, carne de porc) ajoutent une précision après lui.
    example_gloss: Je voudrais de la viande.
  ro.a1.unit06.lesson02.teach.pui:
    title: Le poulet
    gloss: pui (poulet)
    note: Le mot précis pour le poulet (comme aliment), distinct du mot général carne.
    example_gloss: Je voudrais du poulet.
  ro.a1.unit06.lesson02.teach.fructe:
    title: Les fruits
    gloss: fructe (fruits)
    note: La forme plurielle courante, employée comme catégorie générale, comme « des fruits » en français.
    example_gloss: Je voudrais des fruits.
  ro.a1.unit06.lesson02.teach.va_rog:
    title: S’il vous plaît
    gloss: s’il vous plaît (forme de politesse)
    note: La façon polie de dire « s’il vous plaît » ; elle va avec le registre de politesse dumneavoastră déjà vu aux unités 1 et 2.
    example_gloss: Un café, s’il vous plaît.
  ro.a1.unit06.lesson02.teach.te_rog:
    title: S’il te plaît
    gloss: s’il te plaît (forme familière)
    note: La forme de tous les jours, utilisée avec les amis et les personnes que tu tutoies (*tu*) ; elle va avec le registre en tu de l’unité 1.
    example_gloss: Un thé, s’il te plaît.
  ro.a1.unit06.lesson03.teach.reminder_buna_ziua_bine_la_revedere:
    title: 'Rappel : bună, ziua, bine, la revedere, Ana, Mihai'
    gloss: bonjour · bien · au revoir · Ana, Mihai (prénoms)
    note: Tout cela a déjà été vu dans les dialogues des unités 1 et 5 ; ici, Ana et Mihai se retrouvent, cette fois dans un café.
  ro.a1.unit06.lesson03.teach.line01:
    title: Saluer et dire qu’on a faim
    gloss: Ana salue Mihai et dit qu’elle a faim.
    note: Elle utilise *Mi-e foame*, expression de cette unité, dès la salutation.
  ro.a1.unit06.lesson03.teach.line02:
    title: Commander à manger
    gloss: Mihai dit qu’il voudrait du pain et du poulet.
    note: Reprend le vocabulaire pâine/pui de cette unité avec l’expression Aș dori.
  ro.a1.unit06.lesson03.teach.line03:
    title: Commander une boisson poliment
    gloss: Ana dit qu’elle voudrait un café, s’il vous plaît.
    note: Associe Aș dori, cafea et vă rog, trois éléments que cette unité a déjà présentés séparément.
  ro.a1.unit06.lesson03.teach.line04:
    title: Commander aussi une boisson
    gloss: Mihai dit qu’il voudrait un thé, s’il vous plaît.
    note: Même structure que la phrase d’Ana, avec ceai à la place de cafea.
  ro.a1.unit06.lesson03.teach.line05:
    title: Remercier et conclure
    gloss: Ana remercie Mihai et lui dit au revoir.
    note: '*Mulțumesc* est ici un simple remerciement de fin, le même mot que dans *Bine, mulțumesc.* de l’unité 1.'
  ro.a1.unit06.lesson03.teach.line06:
    title: Terminer la rencontre
    gloss: Mihai dit au revoir à son tour, en employant le prénom d’Ana.
    note: La même formule amicale de fin que dans les dialogues des unités 1 et 5.
