answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02/03''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Roumain A1
  description: 'Apprends à demander et à dire l’heure en roumain : heures pile, demi, quart et moins le quart, moments de la journée, et comment demander quand quelque chose commence. Tu retrouves Ana et Mihai, qui fixent l’heure du début de leur cours de roumain.'
units:
  ro.a1.unit04.time:
    title: Dire l’heure
lessons:
  ro.a1.unit04.lesson01.ora_fixa_si_jumatate:
    title: Les heures pile et la demie
  ro.a1.unit04.lesson02.sferturi_si_intrebari:
    title: Le quart, et comment demander l’heure
  ro.a1.unit04.lesson03.cand_incepe_cursul:
    title: Quand commence le cours ?
teaching:
  ro.a1.unit04.lesson01.teach.este:
    title: 'Rappel : este'
    gloss: est / c’est
    note: '*Este* est déjà apparu dans les unités 2 et 3. Le mot reste exactement le même, que tu indiques un nombre, un jour, une date ou, maintenant, une heure.'
  ro.a1.unit04.lesson01.teach.ora:
    title: L’heure
    gloss: l’heure
    note: 'Nom féminin : *ora* se place juste avant un nombre pour dire l’heure, par exemple *ora unu* (une heure).'
    example_gloss: Il est une heure.
  ro.a1.unit04.lesson01.teach.ora_unu:
    title: Une heure
    gloss: une heure
    note: 'Littéralement « l’heure un » : d’abord ora, puis le nombre.'
  ro.a1.unit04.lesson01.teach.ora_doua:
    title: Deux heures
    gloss: deux heures
    note: Ici le nombre prend sa forme féminine, *două*, pour s’accorder avec le féminin *ora* ; la fiche suivante donne le schéma complet.
  ro.a1.unit04.lesson01.teach.ora_gender_note:
    title: 'Une vraie irrégularité : unu reste unu'
    gloss: ora unu (et non « ora una ») / ora două (et non « ora doi »)
    note: 'Les nombres qui ont une forme féminine la prennent en général avec un nom féminin (*doi* → *două* avec un nom féminin comme *ora*), mais *unu* est l’exception pour dire l’heure : on dit toujours *ora unu*, jamais *ora una*, bien que *ora* soit féminin.'
  ro.a1.unit04.lesson01.teach.ora_trei:
    title: Trois heures
    gloss: trois heures
    note: 'Trei ne change pas de forme selon le genre, contrairement à unu/una ou doi/două : une difficulté de moins.'
  ro.a1.unit04.lesson01.teach.jumatate:
    title: La moitié
    gloss: moitié
    note: 'S’emploie avec și (et) pour dire « et demie » : X și jumătate.'
    example_gloss: Une heure et demie.
  ro.a1.unit04.lesson01.teach.ora_unu_jumatate:
    title: Une heure et demie
    gloss: Il est une heure et demie.
    note: 'Littéralement « Il est une heure et demie » : c’est simple et direct, comme en français.'
  ro.a1.unit04.lesson01.teach.cat_e_ora:
    title: Demander l’heure
    gloss: Quelle heure est-il ?
    note: 'La façon courante de demander l’heure : cât (combien, de la même famille que câți de l’unité 2) + este + ora (l’heure).'
  ro.a1.unit04.lesson02.teach.sfert:
    title: Un quart
    gloss: un quart
    note: Un quart d’heure, soit 15 minutes. Il se combine avec și (et) ou fără (sans) pour dire « et quart » ou « moins le quart ».
    example_gloss: Il est une heure et quart.
  ro.a1.unit04.lesson02.teach.sfert_rule:
    title: și et fără avec un quart ou une demie
    gloss: și un sfert = +15 minutes · fără un sfert = −15 minutes
    note: '*Și* (et) ajoute des minutes à l’heure qui vient de passer ; *fără* (sans) compte les minutes à rebours depuis l’heure à venir : c’est la même logique que « et quart » et « moins le quart » en français.'
  ro.a1.unit04.lesson02.teach.ora_doua_sfert:
    title: Deux heures et quart
    gloss: Il est deux heures et quart.
    note: Ora două (2:00) plus și un sfert (+15 minutes) = 2:15.
  ro.a1.unit04.lesson02.teach.fara:
    title: Sans / moins
    gloss: sans / moins
    note: Compte les minutes à rebours depuis l’heure SUIVANTE, comme « moins » dans « trois heures moins le quart ».
    example_gloss: Il est trois heures moins le quart.
  ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert:
    title: Trois heures moins le quart
    gloss: Il est trois heures moins le quart.
    note: Ora trei (3:00) moins fără un sfert (−15 minutes) = 2:45. Le roumain nomme l’heure vers laquelle on compte, et non celle qui vient de passer.
  ro.a1.unit04.lesson02.teach.la_ce_ora:
    title: Demander à quelle heure
    gloss: À quelle heure ?
    note: 'La (à) + ce (quel) + oră (une heure, forme indéfinie ici et non ora) : la façon courante de demander quand quelque chose a lieu.'
  ro.a1.unit04.lesson02.teach.la_ora_noua:
    title: Dire quand quelque chose a lieu
    gloss: À neuf heures.
    note: 'La (à) + ora (l’heure, forme définie ici) + le nombre : c’est le schéma de réponse à La ce oră?.'
  ro.a1.unit04.lesson02.teach.tarziu:
    title: Tard
    gloss: tard
    note: Un mot courant et utile pour réagir en regardant l’heure.
    example_gloss: Il est tard !
  ro.a1.unit04.lesson03.teach.cand:
    title: 'Rappel : când'
    gloss: quand ?
    note: Când est déjà apparu dans l’unité 3 pour demander quand a lieu un événement ; ici il revient pour demander quand quelque chose commence.
  ro.a1.unit04.lesson03.teach.zi_parts:
    title: Les moments de la journée
    gloss: le matin / l’après-midi / le soir / la nuit
    note: 'Chacun de ces mots est la forme définie du nom, employée comme adverbe : le roumain dit « le matin » simplement, sans préposition supplémentaire.'
    example_gloss:
    - Le cours a lieu le matin.
    - Le cours a lieu l’après-midi.
    - Mihai travaille le soir.
    - Ana dort la nuit.
  ro.a1.unit04.lesson03.teach.cursul:
    title: Le cours
    gloss: le cours
    note: Forme définie de curs (un cours) ; ici, le cours de roumain d’Ana et Mihai.
    example_gloss: Le cours commence à neuf heures.
  ro.a1.unit04.lesson03.teach.incepe:
    title: Commence
    gloss: commence
    note: 'Forme du présent pour il, elle ou ce : tout sujet singulier qui n’est ni je ni tu, comme cursul (le cours).'
    example_gloss: Le cours commence le matin.
  ro.a1.unit04.lesson03.teach.cand_incepe_cursul:
    title: Demander quand le cours commence
    gloss: Quand commence le cours ?
    note: Réunit când avec les nouveaux mots de cette leçon, începe et cursul.
  ro.a1.unit04.lesson03.teach.raspuns_curs:
    title: Dire quand le cours commence
    gloss: Le cours commence à neuf heures du matin.
    note: Un complément de temps (dimineața) ajouté à la fin, après une virgule, comme l’unité 3 ajoutait une date après un jour de la semaine.
  ro.a1.unit04.lesson03.teach.line01:
    title: Demander quand le cours commence
    gloss: Ana demande à Mihai quand le cours commence.
    note: 'Une question simple, de registre neutre : este et începe ne changent pas entre tu et dumneavoastră.'
  ro.a1.unit04.lesson03.teach.line02:
    title: Dire l’heure
    gloss: Mihai dit que le cours commence à neuf heures du matin.
    note: 'Mihai reprend exactement le schéma de cette leçon : heure et moment de la journée.'
  ro.a1.unit04.lesson03.teach.line03:
    title: Remercier et conclure
    gloss: Ana le remercie et lui dit au revoir.
    note: La revedere, vu dans l’unité 1, clôt l’échange comme toujours.
  ro.a1.unit04.lesson03.teach.line04:
    title: Clore la rencontre
    gloss: Mihai lui dit au revoir à son tour, en utilisant le prénom d’Ana.
    note: Reprendre la revedere avec le prénom de l’autre personne est une façon naturelle et amicale de conclure.
