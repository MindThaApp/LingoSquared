    gloss: 'Mihai : Oui, et il y a du soleil samedi !'
  ro.a1.unit35.lesson06.teach.andrei_atunci_alerg:
    title: Le programme d’Andrei
    gloss: 'Andrei : Alors, je cours. Après, je joue aussi au foot.'
    note: '*După aceea* signifie « après cela » ; *joc* est la forme de *eu* du verbe *a juca* (jouer).'
  ro.a1.unit35.lesson06.teach.elena_eu_prefer:
    title: Le programme d’Elena
    gloss: 'Elena : Moi, je préfère nager, mais je viens aussi au parc.'
    note: '*Prefer să înot* signifie « je préfère nager » : *a prefera* + *să* + verbe.'
  ro.a1.unit35.lesson06.teach.ana_super_ne:
    title: Ana conclut la conversation
    gloss: 'Ana : Super ! On se voit samedi au parc !'
    note: Conclut en une phrase l’échange de messages de cette unité et le programme de l’unité sur le sport.
