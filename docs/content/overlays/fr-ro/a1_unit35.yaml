    title: Mihai lit le message
    gloss: Mihai lit le message.
  ro.a1.unit35.lesson03.teach.a_cauta:
    title: Chercher
    gloss: chercher
    example_gloss: Je consulte les prévisions météo.
  ro.a1.unit35.lesson03.teach.verbul_a_cauta:
    title: Les terminaisons du verbe changent selon la personne
    gloss: '*A căuta* (chercher) change selon la personne : *eu caut*, *tu cauți*. *A folosi* fonctionne de la même façon : *eu folosesc*, *tu folosești*.'
    note: La terminaison indique qui fait l’action, donc le roumain omet souvent *eu* et *tu*.
  ro.a1.unit35.lesson03.teach.andrei_cauta_prognoza:
    title: Andrei cherche la météo
    gloss: Andrei cherche la météo.
