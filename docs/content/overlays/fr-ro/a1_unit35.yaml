  ro.a1.unit35.lesson02.teach.mesaj_este_neutru:
    title: 'Les noms neutres : *mesaj*'
    gloss: '*Mesaj* est un nom neutre : *un mesaj* (un), *două mesaje* (deux). L’article défini se place à la fin du mot : *mesajul*.'
    note: Associe le nouveau mot au nom composé déjà appris dans l’unité sur la météo.
