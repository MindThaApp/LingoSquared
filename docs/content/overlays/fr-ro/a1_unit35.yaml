    gloss: 'Mihai : Bonne idée ! Je cherche la météo.'
    note: '*Bună idee!* signifie « bonne idée » ; *bună* est au féminin pour s’accorder avec *idee*.'
  ro.a1.unit35.lesson04.teach.mihai_sambata_este:
    title: Mihai vérifie la météo
    gloss: 'Mihai : Samedi, il y a du soleil !'
    note: '*Este soare* dit littéralement « c’est soleil » : le roumain emploie le nom *soare* pour dire qu’il fait beau.'
  ro.a1.unit35.lesson04.teach.andrei_vad_mesajul:
    title: Andrei voit le message
    gloss: 'Andrei : Je vois le message. À samedi !'
  ro.a1.unit35.lesson04.teach.stii_deja_la:
    title: À bientôt + un jour
    gloss: 'Tu connais déjà *La revedere!* Tu peux aussi nommer un jour : *Ne vedem sâmbătă!*, *Ne vedem mâine!*'
    note: Étend la formule d’au revoir de l’unité sur les salutations à un jour précis.
  ro.a1.unit35.lesson05.teach.ana_il_suna:
    title: Qui utilise quoi ?
    gloss: Ana appelle Mihai tous les jours. Elle utilise son téléphone, pas une appli. Mihai n’a pas d’ordinateur à la maison, mais il utilise internet sur son téléphone. Andrei cherche la météo chaque matin. Ensuite, il va courir. Elena envoie souvent un message à Ana. Et toi, tu utilises aussi ton téléphone tous les jours ?
    note: Compare les habitudes des quatre personnages en matière d’appareils, sur le modèle du texte comparatif de l’unité sur le sport.
