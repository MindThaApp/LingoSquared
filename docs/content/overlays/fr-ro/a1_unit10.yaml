teaching:
  ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine:
    title: 'Rappel : dimineața, seara, noaptea, cafea, pâine'
    gloss: dimineața (le matin) · seara (le soir) · noaptea (la nuit) · cafea (le café) · pâine (le pain)
    note: 'Tous ces mots sont déjà connus : dimineața/seara/noaptea depuis l’unité 4, cafea/pâine depuis l’unité 6. Ici, ils se combinent dans les phrases de la routine quotidienne de cette unité.'
  ro.a1.unit10.lesson01.teach.ma_trezesc_vocab:
    title: Je me réveille
    gloss: Mă trezesc (je me réveille)
    note: '*Mă* est le pronom réfléchi déjà vu dans *mă numesc*/*mă cheamă*. Le roumain emploie un verbe pronominal pour « se réveiller », comme en français : littéralement « je me réveille ».'
    example_gloss:
    - Je me réveille le matin.
  ro.a1.unit10.lesson01.teach.ma_trezesc_phrase:
    title: Je me réveille le matin
    gloss: Mă trezesc dimineața. (Je me réveille le matin.)
    note: 'Une phrase courte et complète : la phrase de routine la plus simple possible.'
  ro.a1.unit10.lesson01.teach.mananc_vocab:
    title: Je mange
    gloss: Mănânc (je mange)
    note: 'Pas besoin du pronom « je » : la terminaison du verbe indique déjà qui parle, comme avec *vreau*/*cumpăr*/*aș dori*.'
    example_gloss:
    - Je mange du pain le matin.
  ro.a1.unit10.lesson01.teach.beau_vocab:
    title: je bois
    gloss: Beau (je bois)
    note: Ce verbe va naturellement avec des boissons déjà connues comme *cafea* et *ceai*.
    example_gloss:
    - Je bois du café le matin.
  ro.a1.unit10.lesson01.teach.mananc_beau_phrase:
    title: Je mange du pain et je bois du café le matin
    gloss: Mănânc pâine și beau cafea dimineața. (Je mange du pain et je bois du café le matin.)
    note: Deux actions sont reliées par *și* (et), déjà vu dans *ora unu și jumătate* de l’unité 4.
  ro.a1.unit10.lesson02.teach.lucrez_vocab:
    title: Je travaille
    gloss: Lucrez (je travaille)
    note: C’est la forme de la première personne de *lucrează*, déjà vue dans l’unité 4 pour le travail de Mihai le soir.
    example_gloss:
    - Je travaille le soir.
  ro.a1.unit10.lesson02.teach.lucrez_phrase:
    title: Je travaille le soir
    gloss: Lucrez seara. (Je travaille le soir.)
    note: Une phrase courte et complète pour dire quand tu travailles.
  ro.a1.unit10.lesson02.teach.merg_vocab:
    title: je vais
    gloss: Merg (je vais)
    note: 'C’est la forme de la première personne de *mergeți*, l’impératif vu plus tôt : même verbe, autre personne.'
    example_gloss:
    - Je rentre à la maison.
  ro.a1.unit10.lesson02.teach.acasa_vocab:
    title: Le logement
    gloss: Acasă (à la maison)
    note: 'Employé sans préposition : *merg acasă*, et non *merg la acasă*. Il n’y a pas de mot pour « à » devant acasă.'
    example_gloss:
    - Je rentre à la maison la nuit.
  ro.a1.unit10.lesson02.teach.merg_acasa_phrase:
    title: Je rentre à la maison la nuit
    gloss: Merg acasă noaptea. (Je rentre à la maison la nuit.)
    note: 'Une phrase courte et complète : la fin naturelle d’une journée de travail.'
  ro.a1.unit10.lesson02.teach.lucrez_merg_phrase:
    title: Je travaille le soir et je rentre à la maison la nuit
    gloss: Lucrez seara și merg acasă noaptea. (Je travaille le soir et je rentre à la maison la nuit.)
    note: Cette phrase réunit les deux énoncés de cette leçon en une seule phrase avec *și*.
  ro.a1.unit10.lesson03.teach.reminder_cursul_incepe_ora_apoi:
    title: 'Rappel : cursul, începe, la ora nouă, apoi'
    gloss: cursul (le cours) · începe (commence) · la ora nouă (à neuf heures) · apoi (puis)
    note: Cursul/începe/la ora nouă sont déjà connus depuis l’unité 4 (le cours de Mihai commence à neuf heures du matin) ; apoi l’est depuis l’unité 9. Ici, ils se combinent dans le récit de la routine de Mihai.
  ro.a1.unit10.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Rappel : bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (salut) · mulțumesc (merci) · la revedere (au revoir) · da (oui) · Ana, Mihai (prénoms)
    note: Tous ces mots sont déjà connus des unités précédentes. Ici, Ana interroge Mihai sur sa journée.
  ro.a1.unit10.lesson03.teach.ma_culc_vocab:
    title: je me couche
    gloss: Mă culc (je me couche)
    note: 'Autre verbe pronominal, sur le même modèle que *mă trezesc* : littéralement « je me couche ».'
    example_gloss:
    - Je me couche la nuit.
  ro.a1.unit10.lesson03.teach.ma_culc_phrase:
    title: Je me couche la nuit
    gloss: Mă culc noaptea. (Je me couche la nuit.)
    note: La fin naturelle de la journée, qui clôt la routine commencée avec *mă trezesc dimineața*.
  ro.a1.unit10.lesson03.teach.line01:
    title: Saluer et demander quand commence le cours
    gloss: Ana salue Mihai et lui demande quand commence son cours.
    note: Reprise de la question de l’unité 4 sur le cours de Mihai.
  ro.a1.unit10.lesson03.teach.line02:
    title: Répondre en donnant l’heure du cours
    gloss: Mihai dit que son cours commence à neuf heures, le matin.
    note: C’est exactement la réponse que Mihai a donnée dans l’unité 4, reprise ici dans sa routine quotidienne plus complète.
  ro.a1.unit10.lesson03.teach.line03:
    title: Demander ce qu’il en est du soir
    gloss: 'Ana pose une courte question de relance : « Et le soir ? »'
    note: Une façon naturelle et minimale d’en savoir plus sur la routine, sans nouveau mot interrogatif.
  ro.a1.unit10.lesson03.teach.line04:
    title: Décrire le reste de la journée
    gloss: Mihai dit qu’il travaille le soir, puis qu’il se couche la nuit.
    note: 'Cette phrase combine *lucrez* et *mă culc* de cette unité, reliés par *apoi*, et correspond au fait établi dans l’unité 4 : Mihai travaille le soir.'
  ro.a1.unit10.lesson03.teach.line05:
    title: Remercier et conclure
    gloss: Ana dit « Bien ! », remercie Mihai et lui dit au revoir.
    note: Ce sont les mêmes remerciements de clôture que dans les dialogues des unités 1, 8 et 9.
  ro.a1.unit10.lesson03.teach.line06:
    title: Terminer la rencontre
    gloss: Mihai dit au revoir à son tour, en utilisant le prénom d’Ana.
    note: C’est la même formule de clôture amicale qui termine les dialogues de toutes les unités précédentes.
