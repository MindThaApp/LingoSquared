answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit introduces the course's first imperative form, "Mergeți" (go) -- the dumneavoastră/formal-plural imperative, matching the course's established dumneavoastră-as-safe-default policy. No tu-register imperative is taught or accepted here. Ana and Mihai's direction-giving dialogue keeps their existing polite register with each other, matching unit06/unit07/unit08.
course:
  title: Roumain A1
  description: 'Demander son chemin et suivre de courtes indications en roumain : Cum pot să ajung...? (Comment puis-je aller à… ?), Mergeți înainte (allez tout droit), la dreapta / la stânga (à droite / à gauche) et aici / acolo (ici / là), avec Ana et Mihai : Ana demande à Mihai comment aller à la gare.'
units:
  ro.a1.unit09.directions:
    title: Indications
lessons:
  ro.a1.unit09.lesson01.cum_ajung:
    title: Comment puis-je aller à… ?
  ro.a1.unit09.lesson02.dreapta_stanga:
    title: À droite, à gauche
  ro.a1.unit09.lesson03.pe_strada:
    title: Dans la rue
teaching:
  ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri:
    title: 'Rappel : unde, este, gară, magazin, bancă, aproape'
    gloss: unde (où) · este (est) · gară (gare) · magazin (magasin) · bancă (banque) · aproape (proche / près)
    note: 'Tout cela a déjà été vu : unde depuis l’unité 7, este depuis l’unité 3/4, gară/magazin/bancă/aproape depuis l’unité 8. Ici, ces mots se combinent dans les questions et les exemples pour demander son chemin.'
  ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung:
    title: Comment puis-je aller à… ?
    gloss: Cum pot să ajung...? (Comment puis-je aller à… ?)
    note: 'La façon courante de demander comment se rendre quelque part : *pot* (je peux) est déjà apparu dans *Unde pot să cumpăr...?* de l’unité 7 ; *ajung* (j’arrive) est nouveau.'
  ro.a1.unit09.lesson01.teach.mergeti_vocab:
    title: Allez
    gloss: Mergeți (allez – ordre de politesse)
    note: '*Mergeți* est la forme de l’impératif du registre dumneavoastră – la façon polie de dire à quelqu’un d’aller quelque part, comme Ana et Mihai se parlent déjà.'
    example_gloss:
    - Allez tout droit.
  ro.a1.unit09.lesson01.teach.inainte_vocab:
    title: Tout droit
    gloss: înainte (tout droit)
    note: S’associe à *Mergeți* pour donner l’indication la plus simple possible.
    example_gloss:
    - Allez tout droit.
  ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase:
    title: Aller tout droit
    gloss: Mergeți înainte. (Allez tout droit.)
    note: Une indication courte et complète – la réponse la plus simple à *Cum pot să ajung...?*
  ro.a1.unit09.lesson01.teach.cum_ajung_gara:
    title: Comment puis-je aller à la gare ?
    gloss: Cum pot să ajung la gară? (Comment puis-je aller à la gare ?)
    note: 'Réunit *Cum pot să ajung...?* et *gară* dans une question complète – *la* (à) relie la question à la destination. Après *la*, le nom garde sa forme simple : *la gară*, et non *la gara*.'
  ro.a1.unit09.lesson01.teach.cum_ajung_banca:
    title: Comment puis-je aller à la banque ?
    gloss: Cum pot să ajung la bancă? (Comment puis-je aller à la banque ?)
    note: Même structure, cette fois avec la banque – une question bien naturelle, puisque l’unité 8 a établi que la banque est loin.
  ro.a1.unit09.lesson02.teach.dreapta_stanga_vocab:
    title: À droite, à gauche
    gloss: la dreapta (à droite) · la stânga (à gauche)
    note: 'Les deux virages de base – apprends chacun comme une paire fixe avec *la* (à) : *la dreapta*, *la stânga*.'
    example_gloss:
    - Allez à droite.
    - Allez à gauche.
  ro.a1.unit09.lesson02.teach.mergeti_dreapta_phrase:
    title: Allez à droite
    gloss: Mergeți la dreapta. (Allez à droite.)
    note: Le même ordre *Mergeți* que dans *Mergeți înainte.*, mais avec un virage au lieu de tout droit.
  ro.a1.unit09.lesson02.teach.mergeti_stanga_phrase:
    title: Allez à gauche
    gloss: Mergeți la stânga. (Allez à gauche.)
    note: Le virage opposé – même structure simple.
  ro.a1.unit09.lesson02.teach.aici_acolo_vocab:
    title: Ici, là-bas
    gloss: aici (ici) · acolo (là-bas)
    note: Une façon simple d’indiquer où se trouve quelque chose quand on est arrivé ou qu’on le voit, à distinguer de aproape/departe de l’unité 8 (qui décrivent la distance, pas la position).
    example_gloss:
    - Le magasin est ici.
    - La gare est là-bas.
  ro.a1.unit09.lesson02.teach.magazinul_aici_phrase:
    title: Le magasin est ici
    gloss: Magazinul este aici. (Le magasin est ici.)
    note: Une phrase courte et complète – *aici* désigne quelque chose tout près de l’endroit où l’on se trouve.
  ro.a1.unit09.lesson02.teach.gara_acolo_phrase:
    title: La gare est là-bas
    gloss: Gara este acolo. (La gare est là-bas.)
    note: '*Acolo* désigne quelque chose de visible mais pas tout près de soi – la façon naturelle de terminer une série d’indications.'
  ro.a1.unit09.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Rappel : bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (salut) · mulțumesc (merci) · la revedere (au revoir) · da (oui) · Ana, Mihai (prénoms)
    note: Tout cela a déjà été vu dans les unités précédentes – ici, Ana demande son chemin à Mihai.
  ro.a1.unit09.lesson03.teach.apoi:
    title: Ensuite
    gloss: apoi (ensuite / puis)
    note: Relie deux étapes d’un itinéraire en une seule indication – la façon naturelle d’en donner plusieurs à la fois.
    example_gloss:
    - Allez tout droit, puis à droite.
  ro.a1.unit09.lesson03.teach.line01:
    title: Saluer et demander comment aller à la gare
    gloss: Ana salue Mihai et demande comment aller à la gare.
    note: Combine le *Cum pot să ajung* de cette unité et le salut de l’unité 1.
  ro.a1.unit09.lesson03.teach.line02:
    title: Donner deux indications
    gloss: Mihai dit d’aller tout droit, puis à droite.
    note: Reprend *Mergeți înainte* et *la dreapta* de cette unité, reliés par *apoi*.
  ro.a1.unit09.lesson03.teach.line03:
    title: Demander si c’est près
    gloss: Ana demande si la gare est près.
    note: Une courte question de suite, qui reprend *este*/*aproape* de l’unité 8.
  ro.a1.unit09.lesson03.teach.line04:
    title: Confirmer et indiquer l’endroit
    gloss: Mihai confirme que c’est près et montre que la gare est là-bas.
    note: Combine *aproape* et *acolo* – distance et position – en une seule réplique.
  ro.a1.unit09.lesson03.teach.line05:
    title: Remercier et conclure
    gloss: Ana remercie Mihai et lui dit au revoir.
    note: Les mêmes remerciements de fin que dans les dialogues des unités 1 et 8.
  ro.a1.unit09.lesson03.teach.line06:
    title: Conclure la rencontre
    gloss: Mihai dit au revoir à son tour, en employant le prénom d’Ana.
    note: La même formule amicale de clôture qui terminait les dialogues des unités 1, 5, 6, 7 et 8.
