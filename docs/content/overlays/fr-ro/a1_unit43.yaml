    title: Nina et Ana achètent des tulipes
    gloss: Nina et Ana vont samedi au marché aux fleurs. Quelle couleur Ana veut-elle ? Ana voudrait du rouge. Quelle couleur Nina veut-elle ? Nina voudrait du jaune. Elles achètent cinq tulipes. Ça coûte vingt-cinq lei. Les tulipes sont très belles !
    note: Ce texte récapitule la sortie du samedi au marché aux fleurs en reprenant la structure des textes comparatifs des unités sur la maison, le quartier, la poste, la cuisine et la personnalité.
