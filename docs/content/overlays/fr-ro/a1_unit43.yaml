  ro.a1.unit43.lesson03.teach.as_vrea_culoare:
    title: La construction *Aș vrea*
    gloss: '*Aș vrea* + couleur indique la couleur que tu voudrais : je voudrais du rose.'
    note: '*Aș vrea* (je voudrais) est la façon polie de dire ce que l’on veut, plus douce que *Vreau*. Le mot de couleur qui suit n’est marqué d’aucune façon : *roz* et *mov* ne changent jamais de terminaison, contrairement à *roșu*, qui devient *roșie* avec un nom féminin (*o lalea roșie*).'
