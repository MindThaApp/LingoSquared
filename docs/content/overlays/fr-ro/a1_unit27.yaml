teaching:
  ro.a1.unit27.lesson01.teach.fericit_trist_suparat:
    title: Content, triste et en colère
    gloss: content, triste, en colère
    note: 'Trois mots de base pour les sentiments, utilisés avec *a fi* (être). Chacun a une forme féminine en *-ă* : *fericită*, *tristă*, *supărată*.'
    example_gloss:
    - Je suis heureux.
    - Je suis triste.
    - Je suis en colère.
  ro.a1.unit27.lesson01.teach.sunt_fericit:
    title: Dire que tu es content
    gloss: Je suis heureux.
    note: '*Sunt* (de *a fi*, être) + un adjectif de sentiment est la structure de base, comme en français « je suis ... ». Une femme dit *Sunt fericită*.'
  ro.a1.unit27.lesson01.teach.nu_sunt_suparat:
    title: Opposer des sentiments
    gloss: Je ne suis pas en colère, je suis triste.
    note: '*Nu* devant le verbe le met à la forme négative : *Nu sunt supărat*. La seconde proposition donne alors le vrai sentiment.'
  ro.a1.unit27.lesson02.teach.de_ce_esti:
    title: Demander pourquoi
    gloss: Pourquoi es-tu content ?
    note: '*De ce* (pourquoi) est la question habituelle pour demander une raison.'
  ro.a1.unit27.lesson02.teach.sunt_fericit_pentru:
    title: Donner une raison
    gloss: Je suis content parce que j’ai un nouvel appartement.
    note: '*Pentru că* (parce que) introduit la proposition de cause ; l’ordre des mots reste normal : *am un apartament nou*.'
  ro.a1.unit27.lesson02.teach.sunt_trist_pentru:
    title: Une raison négative
    gloss: Je suis triste parce qu’il pleut.
    note: '*Plouă* (il pleut) n’a pas de sujet exprimé en roumain ; il peut donc former seul la proposition de cause.'
  ro.a1.unit27.lesson03.teach.emotionat:
    title: Nerveux
    gloss: nerveux
    note: Le mot habituel pour dire qu’on est nerveux.
    example_gloss: Je suis nerveux à l’idée de mon premier service.
  ro.a1.unit27.lesson03.teach.sunt_emotionat_pentru:
    title: Dire pourquoi tu es nerveux
    gloss: Je suis nerveux à l’idée de mon premier service.
    note: '*Pentru* (littéralement « pour ») introduit ce qui rend nerveux, là où le français dit plutôt « à propos de » ou « avant ».'
  ro.a1.unit27.lesson03.teach.nu_ti_face:
    title: Rassurer quelqu’un
    gloss: Ne t’inquiète pas.
    note: '*Nu-ți face griji* (littéralement « ne te fais pas de soucis ») est la formule figée habituelle pour rassurer. À un inconnu : *Nu vă faceți griji*.'
  ro.a1.unit27.lesson04.teach.cum_se_simte:
    title: Demander comment quelqu’un se sent
    gloss: Comment se sent Mihai ?
    note: '*A se simți* (se sentir) est pronominal : *mă simt* (je), *te simți* (tu), *se simte* (il/elle). C’est la manière habituelle de demander ou de décrire ce qu’on ressent.'
  ro.a1.unit27.lesson04.teach.el_se_simte:
    title: Décrire comment quelqu’un se sent
    gloss: Il se sent nerveux.
    note: '*Se* est le pronom réfléchi de la 3e personne ; il se place devant le verbe : *se simte*.'
  ro.a1.unit27.lesson04.teach.de_ce_se:
    title: Demander pourquoi quelqu’un se sent ainsi
    gloss: Pourquoi se sent-il nerveux ?
    note: Combine *de ce* avec la structure *se simte* de *El se simte emoționat*.
  ro.a1.unit27.lesson05.teach.salut_ana_sunt:
    title: Lire un message sur les sentiments
    gloss: Salut Ana, je suis un peu nerveux pour mon premier service en solo. Mais je suis aussi heureux, parce que j’ai un nouveau travail et un nouvel appartement. Je crois que tout va s’arranger.
    note: Repère ce qui rend l’auteur nerveux, ce qui le rend heureux et sa perspective générale.
    glosses:
      puțin: un peu
      emoționat: nerveux
      prima: premier
      tură: service
      singur: seul
      fericit: content
      fiindcă: parce que
      nou: nouveau
      serviciu: travail
      apartament: appartement
      cred: penser
      rezolvă: 's’arranger (ici : ça va aller)'
  ro.a1.unit27.lesson06.teach.ana_salut_mihai:
    title: Ana demande à Mihai comment il se sent
    gloss: 'Ana : Salut Mihai, comment te sens-tu avant ton premier service ?'
    note: '*Cum te simți* utilise le pronom réfléchi *te* (« te ») ; dans *prima ta tură*, le possessif *ta* s’accorde avec le féminin *tură*.'
  ro.a1.unit27.lesson06.teach.mihai_sunt_putin:
    title: Mihai avoue qu’il est nerveux
    gloss: 'Mihai : Je suis un peu nerveux, honnêtement.'
    note: '*Sincer să fiu* (pour être honnête) adoucit l’aveu.'
  ro.a1.unit27.lesson06.teach.ana_nu_ti:
    title: Ana le rassure
    gloss: 'Ana : Ne t’inquiète pas, tu vas bien t’en sortir !'
    note: '*O să te descurci bine* (littéralement « tu t’en sortiras bien ») est une expression figée d’encouragement ; *o să* + verbe forme le futur.'
  ro.a1.unit27.lesson06.teach.mihai_multumesc_chiar:
    title: Mihai la remercie
    gloss: 'Mihai : Merci, ça aide vraiment.'
    note: '*Ajută* est la forme il/elle de *a ajuta* (aider) ; ici, elle signifie « ça aide ».'
  ro.a1.unit27.lesson06.teach.ana_si_dupa:
    title: Ana prédit la suite
    gloss: 'Ana : Et après, tu seras sûrement très heureux et fier.'
    note: '*Sigur* (sûrement) exprime une prédiction pleine de confiance ; *mândru* (fier) est un nouvel adjectif utile (*mândră* pour une femme).'
  ro.a1.unit27.lesson06.teach.mihai_da_si:
    title: Mihai est d’accord
    gloss: 'Mihai : Oui, je le pense aussi.'
    note: '*Și eu cred asta* (littéralement « moi aussi je crois ça ») est la façon naturelle d’approuver l’opinion de quelqu’un.'
  ro.a1.unit27.lesson06.teach.mihai_este_emotionat:
    title: Récapitulatif avec este, lui et îl
    gloss: Mihai est nerveux pour son premier service. Ana l’aide.
    note: '*Este* est la forme il/elle de *a fi* (être) ; *lui* après le nom signifie « son » (à lui) ; *îl* signifie « le » (pronom complément) et se place devant le verbe : *îl ajută*. Trois petits mots essentiels pour parler de quelqu’un d’autre.'
