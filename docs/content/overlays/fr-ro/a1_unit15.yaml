answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (tren, pleacă, bilet, peron, București, Drum bun) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing formal register with each other; no new tu/dumneavoastră form is introduced this unit.
course:
  title: Roumain A1
  description: 'Se débrouiller lors d’un voyage simple en train en roumain : Tren (train), Bilet (billet), Peron (quai) et Pleacă (part), tandis que Mihai prend un train pour București et qu’Ana l’accompagne à la gară.'
units:
  ro.a1.unit15.travel:
    title: Voyage
lessons:
  ro.a1.unit15.lesson01.trenul_pleaca:
    title: Le train part
  ro.a1.unit15.lesson02.un_bilet_va_rog:
    title: Un billet, s’il vous plaît
  ro.a1.unit15.lesson03.la_gara:
    title: À la gare
teaching:
  ro.a1.unit15.lesson01.teach.reminder_gara_ora:
    title: 'Rappel : gară, este, la, ce, oră, ora, nouă'
    gloss: gară (gare) · este (est) · la (à) · ce (quel, quoi) · oră (heure) · ora (l’heure) · nouă (neuf)
    note: 'Gară vient des unités 8 et 9 ; este, la, ce, oră, ora et nouă viennent de l’unité 4 (l’heure). Cette unité réemploie les tournures « la ce oră » et « la ora nouă » de l’unité 4 dans un nouveau but : s’informer sur un train plutôt que sur un cours.'
  ro.a1.unit15.lesson01.teach.tren_vocab:
    title: Train
    gloss: Tren (train)
    note: 'Neutre, terminé par une consonne (au singulier, les noms neutres se comportent comme des masculins : *un tren*). Il prend *-ul* pour « le train », comme *magazin*→*magazinul* ; les noms en *-ă* comme *gară* prennent *-a* (*gara*).'
    example_gloss:
    - Le train est en gare.
  ro.a1.unit15.lesson01.teach.pleaca_vocab:
    title: Part / quitte la gare
    gloss: Pleacă (part, il/elle)
    note: 'Le verbe pour un train, un bus ou un avion qui part. *Trenul pleacă* : pas besoin de *este*, car *pleacă* est déjà un verbe à part entière.'
    example_gloss:
    - Le train part.
  ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase:
    title: Le train part à neuf heures
    gloss: Trenul pleacă la ora nouă. (Le train part à neuf heures.)
    note: 'Associe *trenul* + *pleacă* avec *la ora nouă* de l’unité 4 : aucun nouveau vocabulaire de l’heure n’est nécessaire.'
  ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase:
    title: À quelle heure part le train ?
    gloss: La ce oră pleacă trenul? (À quelle heure part le train ?)
    note: La question *La ce oră...?* de l’unité 4, qui porte maintenant sur *trenul* au lieu d’un cours.
  ro.a1.unit15.lesson01.teach.peron_vocab:
    title: Quai
    gloss: Peron (quai)
    note: 'Un quai de gare. Neutre, terminé par une consonne : « le quai » se dit *peronul*, avec la même terminaison *-ul* que *tren*→*trenul*.'
    example_gloss:
    - Le train est au quai trois.
  ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase:
    title: De quel quai part le train ?
    gloss: De la ce peron pleacă trenul? (De quel quai part le train ?)
    note: '*De la* (de) + *ce peron* (quel quai) : tous ces mots ont déjà été vus, ici simplement combinés en une nouvelle question.'
  ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa:
    title: 'Rappel : aș dori, vă rog, cât costă, costă, lei'
    gloss: aș dori (je voudrais) · vă rog (s’il vous plaît) · cât costă (combien ça coûte) · costă (ça coûte) · lei (lei, monnaie)
    note: 'Tout vient de l’unité 6 (nourriture) et de l’unité 7 (achats) : cette unité réutilise les mêmes formules de demande polie et de prix, mais pour acheter un billet de train au lieu de nourriture.'
  ro.a1.unit15.lesson02.teach.bilet_vocab:
    title: Billet
    gloss: Bilet (billet)
    note: 'Un billet de train. Nom neutre (au singulier, il se construit avec *un*, comme un nom masculin) : « un billet » se dit donc *un bilet*.'
    example_gloss:
    - J’ai un billet.
  ro.a1.unit15.lesson02.teach.bucuresti_vocab:
    title: Bucarest
    gloss: București (Bucarest)
    note: La capitale de la Roumanie, la destination la plus naturelle pour les exemples de ce cours.
    example_gloss:
    - Le train part pour Bucarest.
  ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase:
    title: Je voudrais un billet pour Bucarest, s’il vous plaît
    gloss: Aș dori un bilet la București, vă rog. (Je voudrais un billet pour Bucarest, s’il vous plaît.)
    note: La formule de politesse *Aș dori... vă rog* des unités 6 et 7, utilisée maintenant pour demander un billet au lieu de nourriture.
  ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase:
    title: Combien coûte un billet pour Bucarest ?
    gloss: Cât costă un bilet la București? (Combien coûte un billet pour Bucarest ?)
    note: La question de prix *Cât costă...?* de l’unité 7, posée maintenant pour un billet au lieu d’un kilo de pommes de terre.
  ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase:
    title: Ça coûte quarante lei
    gloss: Costă patruzeci de lei. (Ça coûte quarante lei.)
    note: 'À partir de 20, on met *de* avant *lei* : patruzeci de lei. Entre 2 et 19 (par exemple zece), on n’en met pas : c’est la règle déjà vue à l’unité 7.'
  ro.a1.unit15.lesson03.teach.reminder_travel_words:
    title: 'Rappel : tren, pleacă, peron, bilet, București, trei, am'
    gloss: tren (train) · pleacă (part) · peron (quai) · bilet (billet) · București (Bucarest) · trei (trois, unité 2) · am (j’ai, unité 2)
    note: Tren, pleacă, peron, bilet et București viennent des leçons 1 et 2 de cette unité ; trei et am sont repris de l’unité 2 (les nombres), car Ana et Mihai emploient maintenant ensemble « peronul trei » et « am un bilet » à la gare.
  ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Rappel : bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (salut) · mulțumesc (merci) · la revedere (au revoir) · Ana, Mihai (prénoms)
    note: 'Tout est déjà connu des unités précédentes : c’est la même façon amicale d’ouvrir et de clore chaque dialogue du cours.'
  ro.a1.unit15.lesson03.teach.drum_bun_vocab:
    title: Bon voyage
    gloss: Drum bun (Bon voyage)
    note: Formule d’adieu figée adressée à quelqu’un qui part en voyage. Littéralement « bonne route », elle s’emploie comme le français « bon voyage » ou « bonne route ».
    example_gloss:
    - Bon voyage, Mihai !
  ro.a1.unit15.lesson03.teach.line01:
    title: Saluer et poser une question sur le train
    gloss: Ana salue Mihai et lui demande à quelle heure part le train.
    note: Reprend la question de la leçon 1 de cette unité, adressée maintenant directement à Mihai.
  ro.a1.unit15.lesson03.teach.line02:
    title: Donner l’heure de départ
    gloss: Mihai dit que le train part à neuf heures.
    note: Reprend exactement la phrase de la leçon 1 de cette unité.
  ro.a1.unit15.lesson03.teach.line03:
    title: Poser une question sur le quai
    gloss: Ana demande de quel quai.
    note: 'Une courte question de suite : *de la ce peron* a déjà été posée en entier dans la leçon 1 ; ici Ana la pose brièvement et attend que Mihai complète.'
  ro.a1.unit15.lesson03.teach.line04:
    title: Indiquer le quai et le billet
    gloss: Mihai dit quai trois, et qu’il a un billet pour Bucarest.
    note: 'Réunit en une seule réponse le vocabulaire de cette unité : peron, bilet et București.'
  ro.a1.unit15.lesson03.teach.line05:
    title: Souhaiter bon voyage et dire au revoir
    gloss: Ana souhaite bon voyage à Mihai et lui dit au revoir.
    note: Emploie le *Drum bun* de cette leçon, un souhait propre au voyage, à la place du simple *la revedere* habituel dans le cours.
  ro.a1.unit15.lesson03.teach.line06:
    title: La remercier et dire au revoir
    gloss: Mihai remercie Ana et lui dit au revoir.
    note: La même façon de conclure que dans les dialogues de toutes les unités précédentes.
