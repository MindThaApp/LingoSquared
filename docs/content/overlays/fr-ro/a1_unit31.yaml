answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Roumain A1
  description: 'Roumain pour débutants : décrire l’apparence physique de base d’une personne — taille et impression d’âge, couleur des cheveux et des yeux, la question essentielle Cum arată ...?, et la comparaison de l’apparence de deux personnes.'
units:
  ro.a1.unit31.aspect:
    title: Décrire l’apparence physique
lessons:
  ro.a1.unit31.lesson01.inalt_scund_batran_si:
    title: Grand, petit, âgé et jeune
  ro.a1.unit31.lesson02.descrierea_parului:
    title: Décrire les cheveux
  ro.a1.unit31.lesson03.ochii_si_cum_arata:
    title: Les yeux et demander à quoi ressemble quelqu’un
  ro.a1.unit31.lesson04.ana_o_descrie_pe:
    title: Ana décrit Nina
  ro.a1.unit31.lesson05.ii_comparam_pe_andrei:
    title: Comparer Andrei et Elena
  ro.a1.unit31.lesson06.mihai_o_recunoaste_pe:
    title: Mihai reconnaît Nina
teaching:
  ro.a1.unit31.lesson01.teach.inalt_scund:
    title: Grand et petit
    gloss: grand / petit
    note: '*Înalt* décrit une personne grande et *scund* une personne petite. Les deux ont une forme féminine : *înaltă*, *scundă*.'
    example_gloss:
    - Elena est grande.
    - Andrei est petit.
  ro.a1.unit31.lesson01.teach.batran_tanar:
    title: Âgé et jeune
    gloss: âgé / jeune
    note: '*Bătrân* et *tânăr* expriment ici une impression générale d’âge, pas un nombre d’années précis. Formes féminines : *bătrână*, *tânără*.'
    example_gloss:
    - Grand-père est âgé.
    - Mihai est jeune.
  ro.a1.unit31.lesson01.teach.pentru_varsta_exacta:
    title: 'Bătrân : une impression ou un chiffre'
    gloss: Pour connaître l’âge exact, tu demandes Câți ani ai?, alors que bătrân donne une impression générale, comme dans Bunicul este bătrân.
    note: Tu peux demander l’âge exact avec *Câți ani ai?* Ici, *bătrân* décrit l’âge que quelqu’un PARAÎT avoir, sans aucun chiffre.
  ro.a1.unit31.lesson01.teach.elena_este_inalta:
    title: Elena est grande et Andrei est petit
    gloss: Elena est grande et Andrei est petit.
    note: 'Une phrase simple reliée par *și* (et), qui prépare la comparaison directe de la leçon 5 ; l’adjectif s’accorde avec le sujet : *înaltă* pour Elena, *scund* pour Andrei.'
  ro.a1.unit31.lesson02.teach.parul:
    title: Les cheveux
    gloss: les cheveux
    note: '*Păr* est un nom masculin ; l’article se place à la fin du mot : *părul* (les cheveux).'
    example_gloss: Mihai a les cheveux courts et noirs.
  ro.a1.unit31.lesson02.teach.blond_maro_carunt:
    title: Blond, châtain et gris
    gloss: blond / châtain / gris
    note: 'Trois couleurs de cheveux. Elles se placent après le nom *păr* (masculin) : on dit *părul blond*, *păr maro*, *păr cărunt*.'
    example_gloss:
    - Ana a les cheveux blonds.
    - Andrei a les cheveux bruns.
    - Grand-père a les cheveux gris.
  ro.a1.unit31.lesson02.teach.lung_scurt:
    title: Cheveux longs et courts
    gloss: long / court (cheveux)
    note: '*Lung* (long) et *scurt* (court) décrivent la longueur des cheveux ; comme les couleurs, ils se placent après le nom.'
    example_gloss:
    - Elena a les cheveux longs.
    - Andrei a les cheveux courts.
  ro.a1.unit31.lesson02.teach.adjectivul_vine_dupa:
    title: Les adjectifs se placent après le nom
    gloss: 'L’adjectif se place après le nom : păr scurt, păr lung, păr blond, păr maro, păr cărunt, păr negru.'
    note: 'En roumain, l’adjectif se place généralement APRÈS le nom (*păr scurt*), comme pour les couleurs en français : « cheveux courts », « cheveux noirs ».'
  ro.a1.unit31.lesson02.teach.posesivul_vine_dupa:
    title: « Son » et « sa » se placent après le nom
    gloss: 'Le possessif se place après le nom : părul ei (ses cheveux à elle), ochii lui (ses yeux à lui).'
    note: '*Ei* signifie « à elle » et *lui* « à lui » ; les deux se placent après le nom : *părul ei*. Le contexte indique de qui on parle.'
  ro.a1.unit31.lesson02.teach.mihai_are_parul:
    title: Mihai a les cheveux courts et noirs
    gloss: Mihai a les cheveux courts et noirs.
    note: '*Negru* (noir) est un adjectif de couleur ; il se place après le nom : *păr negru*.'
  ro.a1.unit31.lesson02.teach.ana_are_parul:
    title: Ana a les cheveux longs et blonds
    gloss: Ana a les cheveux longs et blonds.
    note: Combine le vocabulaire de la longueur et de la couleur de cette leçon dans une phrase naturelle.
  ro.a1.unit31.lesson03.teach.ochii:
    title: Les yeux
    gloss: les yeux
    note: '*Ochi* (œil/yeux) a la même forme au singulier et au pluriel ; c’est l’article qui indique le nombre : *ochiul* (l’œil), *ochii* (les yeux).'
    example_gloss: Mihai a les yeux marron.
  ro.a1.unit31.lesson03.teach.albastru_maro_verde:
    title: Bleu, marron et vert
    gloss: bleu / marron / vert
    note: '*Albastru* (bleu), *maro* (marron) et *verde* (vert) sont des adjectifs de couleur. *Maro* ne change jamais ; *albastru* devient *albaștri* et *verde* devient *verzi* au pluriel.'
    example_gloss:
    - Ana a les yeux bleus.
    - Andrei a les yeux marron.
    - Elena a les yeux verts.
  ro.a1.unit31.lesson03.teach.la_plural_adjectivul:
    title: Adjectifs au pluriel
    gloss: 'Au pluriel, l’adjectif change : ochi albaștri, ochi maro, ochi verzi.'
    note: Avec *ochi* au pluriel, l’adjectif prend la forme du pluriel (*albaștri*, *verzi*) ; *maro* reste identique. Compare avec le singulier *păr albastru*.
  ro.a1.unit31.lesson03.teach.cum_arata_ana:
    title: À quoi ressemble Ana ?
    gloss: À quoi ressemble Ana ?
    note: '*Cum arată ...?* est la question clé de cette unité ; réutilise-la pour demander l’apparence de n’importe qui.'
  ro.a1.unit31.lesson03.teach.ana_are_parul:
    title: Ana a les cheveux longs et blonds et les yeux bleus
    gloss: Ana a les cheveux longs et blonds et les yeux bleus.
    note: Une réponse modèle qui associe cheveux et yeux dans une seule phrase avec *și*.
  ro.a1.unit31.lesson04.teach.ana_vine_o:
    title: Ana présente Nina
    gloss: 'Ana : Une nouvelle fille vient au café des langues étrangères. Elle s’appelle Nina.'
    note: '*Vine o fată nouă* (« une nouvelle fille vient ») présente quelqu’un de nouveau ; *O cheamă Nina* donne son prénom.'
  ro.a1.unit31.lesson04.teach.mihai_bine_cum:
    title: Mihai demande comment elle est
    gloss: 'Mihai : Bien ! Comment est-elle ?'
    note: 'Reprend la question clé de l’unité sans nom : *Cum arată?* (on comprend de qui il s’agit grâce au contexte).'
  ro.a1.unit31.lesson04.teach.ana_este_scunda:
    title: Ana décrit la taille et les cheveux de Nina
    gloss: 'Ana : Elle est petite et elle a les cheveux courts et blonds.'
    note: Associe *scundă* de la leçon 1 au vocabulaire des cheveux de la leçon 2.
  ro.a1.unit31.lesson04.teach.mihai_si_ochii:
    title: Mihai demande comment sont ses yeux
    gloss: 'Mihai : Et les yeux ?'
    note: '*Și ochii?* (« Et les yeux ? ») est une brève question de relance ; on comprend de qui il s’agit grâce au contexte.'
  ro.a1.unit31.lesson04.teach.ana_are_ochi:
    title: Ana décrit les yeux de Nina
    gloss: 'Ana : Elle a les yeux verts.'
    note: Reprend *ochi verzi* de la leçon 3.
  ro.a1.unit31.lesson04.teach.mihai_multumesc_atunci:
    title: Mihai la reconnaîtra
    gloss: 'Mihai : Merci ! Alors je la reconnaîtrai à coup sûr.'
    note: '*O recunosc* signifie « je la reconnais » : *o* est le pronom complément « la » et se place avant le verbe, comme en français.'
  ro.a1.unit31.lesson05.teach.andrei_si_elena:
    title: Comparer Andrei et Elena
    gloss: Andrei et Elena sont frère et sœur, mais ils ne se ressemblent pas. Andrei est petit et a les cheveux courts et châtains et les yeux marron. Elena est plus grande qu’Andrei et a les cheveux longs et châtains et les yeux verts. Et toi, comment es-tu physiquement ?
    note: Une courte comparaison qui réutilise tous les mots de couleur et de longueur appris jusqu’ici et se termine par la question essentielle de l’unité, adressée au lecteur.
    glosses:
      frate: frère
      soră: sœur
      arată: apparence
      diferit: différent
      scund: petit
      scurt: petit
      maro: châtain
      părul: cheveux
      ochi: yeux
      înaltă: plus grand
      lung: long
      verzi: vert
      arăți: avoir l’air, être physiquement (comme dans « comment tu es »)
  ro.a1.unit31.lesson05.teach.comparativul_se_formeaza:
    title: Comparer avec mai ... decât
    gloss: 'Le comparatif se forme avec mai + adjectif + decât : Elena este mai înaltă decât Andrei.'
    note: 'Le roumain place *mai* (« plus ») avant l’adjectif et *decât* (« que ») avant la seconde personne, comme en français : *mai înaltă decât Andrei*.'
  ro.a1.unit31.lesson05.teach.elena_are_parul:
    title: Elena a les cheveux plus longs qu’Andrei
    gloss: Elena a les cheveux plus longs qu’Andrei.
    note: '*Mai lung* fonctionne de la même façon devant *decât* : *părul mai lung decât Andrei* ; l’adjectif suit toujours *părul*.'
  ro.a1.unit31.lesson05.teach.am_parul_scurt:
    title: J’ai les cheveux courts et châtains
    gloss: J’ai les cheveux courts et châtains.
    note: Une phrase modèle à la première personne avec *Am ...*, à réutiliser pour décrire ton apparence.
  ro.a1.unit31.lesson06.teach.mihai_uite_ea:
    title: Mihai repère Nina
    gloss: 'Mihai : Regarde, c’est Nina ? Elle a les cheveux courts et blonds et les yeux verts.'
    note: '*Uite* (regarde) attire l’attention sur quelque chose ; *ea e Nina?* demande « c’est Nina ? ».'
  ro.a1.unit31.lesson06.teach.ana_da_ea:
    title: Ana confirme
    gloss: 'Ana : Oui, c’est Nina !'
    note: Une confirmation courte et naturelle.
  ro.a1.unit31.lesson06.teach.nina_salut_tu:
    title: Nina salue Mihai
    gloss: 'Nina : Salut, tu es Mihai ?'
    note: 'Une simple question de salutation informelle : *tu ești ...?*'
  ro.a1.unit31.lesson06.teach.mihai_da_ma:
    title: Mihai salue Nina à son tour
    gloss: 'Mihai : Oui ! Enchanté de te rencontrer, Nina.'
    note: '*Mă bucur să te cunosc* (« je suis content de te rencontrer ») est l’expression habituelle lors d’une première rencontre.'
  ro.a1.unit31.lesson06.teach.nina_si_eu:
    title: Nina lui répond
    gloss: 'Nina : Enchantée de faire ta connaissance, moi aussi !'
    note: 'Conclut le dialogue : Mihai a bien reconnu Nina grâce à la description d’Ana.'
