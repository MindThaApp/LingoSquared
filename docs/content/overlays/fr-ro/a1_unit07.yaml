  notes: 'Derived from en-ro by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every French string was translated and adapted. Needs native French review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: '"Vreau" (I want, plain) and "Aș dori" (I would like, polite, established in unit06) are a genuine directness contrast, not interchangeable synonyms -- accept either for a general "I want/I would like" unless an exercise explicitly names one. "Vă rog" (formal) and "te rog" (informal, both established in unit06) remain a register-sensitive pair here too. Ana and Mihai''s market dialogue keeps their existing polite register with each other (vă rog, not te rog).'
course:
  title: Roumain A1
  description: 'Demander les prix et les quantités en roumain : le leu/lei, scump/ieftin, et les achats au marché, comme roșii (tomates) et cartofi (pommes de terre) au kilo. Ana et Mihai continuent leurs courses au marché.'
units:
  ro.a1.unit07.shopping:
    title: Les achats
lessons:
  ro.a1.unit07.lesson01.cat_costa:
    title: Combien ça coûte ?
  ro.a1.unit07.lesson02.rosii_si_cartofi:
    title: Tomates et pommes de terre
  ro.a1.unit07.lesson03.la_piata:
    title: Au marché
teaching:
  ro.a1.unit07.lesson01.teach.reminder_un_numere:
    title: 'Rappel : un, doi, cinci, zece, douăzeci'
    gloss: un (un) · deux · cinq · dix · vingt
    note: Tout cela est déjà apparu dans des unités précédentes (*un* à l’unité 4, les nombres à l’unité 2) ; ici, on les retrouve pour parler de prix.
  ro.a1.unit07.lesson01.teach.cat_costa:
    title: Combien ça coûte ?
    gloss: Cât costă ? (Combien ça coûte ?)
    note: 'La façon courante de demander un prix en roumain : on ajoute le nom de l’article après, ou on l’emploie seul quand on voit bien de quoi il s’agit.'
  ro.a1.unit07.lesson01.teach.leu:
    title: Leu (monnaie)
    gloss: 'leu (l’unité monétaire roumaine ; pluriel : lei)'
    note: 'La monnaie de la Roumanie. Leu est le singulier (un leu) ; le pluriel lei est irrégulier : ce n’est pas leu + une terminaison ordinaire.'
    example_gloss: Ça coûte un leu.
  ro.a1.unit07.lesson01.teach.costa_cinci_lei:
    title: Ça coûte huit lei
    gloss: Costă opt lei. (Ça coûte huit lei.)
    note: De 2 à 19, lei s’emploie directement, sans mot supplémentaire devant.
  ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei:
    title: Ça coûte trente lei
    gloss: Costă treizeci de lei. (Ça coûte trente lei.)
    note: À partir de 20, le roumain insère *de* devant le nom compté, comme la règle vue à l’unité 2 pour *ani* (ans), appliquée maintenant à *lei*.
  ro.a1.unit07.lesson01.teach.leu_lei_de_rule:
    title: 'Règle : leu → lei, et quand ajouter de'
    gloss: 'leu → lei · nombres de 2 à 19 : pas de *de* · nombres à partir de 20 : ajouter *de*'
    note: 'Exactement le même schéma que la règle de *ani* de l’unité 2 (câți ani ai / am treizeci de ani) : une fois qu’on la connaît pour un nom, elle fonctionne de la même façon pour lei.'
  ro.a1.unit07.lesson01.teach.scump:
    title: Cher
    gloss: scump (cher)
    note: Une réaction courante devant un prix qu’on trouve trop élevé.
    example_gloss: Huit lei ? Cher !
  ro.a1.unit07.lesson01.teach.ieftin:
    title: Bon marché
    gloss: ieftin (bon marché)
    note: 'Le contraire de scump : un bon prix.'
    example_gloss: Un leu ? Bon marché !
  ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog:
    title: 'Rappel : un, o, și, aș dori, vă rog, te rog'
    gloss: un/o (un, une) · și (et) · aș dori (je voudrais) · vă rog (s’il vous plaît, forme de politesse) · te rog (s’il te plaît, forme familière)
    note: '*Aș dori*, *vă rog* et *te rog* sont apparus pour la première fois dans la scène du café de l’unité 6 ; ici, on les retrouve au marché.'
  ro.a1.unit07.lesson02.teach.piata:
    title: Marché
    gloss: piață (marché)
    note: 'Un nom féminin : le marché en plein air ou couvert où l’on achète des produits frais.'
    example_gloss: Combien ça coûte au marché ?
  ro.a1.unit07.lesson02.teach.rosii:
    title: Tomates
    gloss: roșii (tomates)
    note: Pluriel de roșie (une tomate) ; on l’emploie au pluriel quand on parle d’en acheter en général.
    example_gloss: Je voudrais des tomates.
  ro.a1.unit07.lesson02.teach.cartofi:
    title: Pommes de terre
    gloss: cartofi (pommes de terre)
    note: Pluriel de cartof (une pomme de terre), sur le même modèle que roșii.
    example_gloss: Je voudrais des pommes de terre.
  ro.a1.unit07.lesson02.teach.kilogram:
    title: Kilogram
    gloss: kilogramme
    note: 'L’unité habituelle pour acheter les fruits et légumes au poids. *De* relie la mesure à ce qu’on achète : kilogram *de* roșii, « un kilo de tomates ».'
    example_gloss: Un kilo de tomates.
  ro.a1.unit07.lesson02.teach.vreau:
    title: je veux
    gloss: je veux
    note: 'Plus simple et plus direct que *aș dori* (« je voudrais ») : les deux conviennent au marché, vreau est simplement moins poli.'
    example_gloss: Je veux des pommes de terre.
  ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar:
    title: Où puis-je acheter… ?
    gloss: Où puis-je acheter des tomates ?
    note: 'Une question utile quand tu ne sais pas où faire tes courses : remplace roșii par n’importe quel autre produit que tu cherches.'
  ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii:
    title: Combien coûte un kilo de tomates ?
    gloss: Combien coûte un kilo de tomates ?
    note: Réunit Cât costă et la construction kilogram de ... dans une question complète.
  ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi:
    title: Je veux un kilo de pommes de terre
    gloss: Je veux un kilo de pommes de terre.
    note: Le même modèle kilogram de ..., cette fois dans une affirmation avec vreau plutôt que dans une question.
  ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere:
    title: 'Rappel : bună, ziua, mulțumesc, bine, la revedere, Ana, Mihai'
    gloss: bonjour · merci · bien · au revoir · Ana, Mihai (prénoms)
    note: 'Tout cela a déjà été vu dans les dialogues des unités 1 et 6 : ici, Ana et Mihai se retrouvent, cette fois au marché.'
  ro.a1.unit07.lesson03.teach.line01:
    title: Saluer et demander un prix
    gloss: Ana salue Mihai et demande le prix d’un kilo de tomates.
    note: Associe le Cât costă de cette unité et la salutation de l’unité 1.
  ro.a1.unit07.lesson03.teach.line02:
    title: Donner le prix
    gloss: 'Mihai dit que cela coûte huit lei et réagit : c’est bon marché.'
    note: Reprend costă, opt lei et ieftin de cette unité.
  ro.a1.unit07.lesson03.teach.line03:
    title: Commander poliment et ajouter un produit
    gloss: Ana accepte, demande poliment un kilo de tomates et ajoute qu’elle veut aussi des pommes de terre.
    note: 'Associe aș dori, vă rog et vreau : les deux niveaux de politesse du vocabulaire de cette unité dans une seule réplique.'
  ro.a1.unit07.lesson03.teach.line04:
    title: Donner le deuxième prix
    gloss: Mihai dit qu’un kilo de pommes de terre coûte cinq lei.
    note: Reprend les nombres déjà vus dans les unités précédentes, rappelés dans la première leçon de cette unité.
  ro.a1.unit07.lesson03.teach.line05:
    title: Remercier et conclure
    gloss: Ana remercie Mihai et lui dit au revoir.
    note: '*Mulțumesc* est ici un simple remerciement de clôture, le même mot que dans *Bine, mulțumesc.* de l’unité 1.'
  ro.a1.unit07.lesson03.teach.line06:
    title: Conclure l’échange
    gloss: Mihai dit au revoir à son tour, en employant le prénom d’Ana.
    note: La même formule d’adieu amicale qui concluait les dialogues des unités 1, 5 et 6.
