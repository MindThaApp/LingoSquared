teaching:
  ro.a1.unit17.lesson01.teach.reminder_este_la_mihai:
    title: 'Rappel : este, la, Mihai'
    gloss: este (est) · la (à) · Mihai (prénom)
    note: Este vient des unités 3, 4 et 8 ; la vient de l’unité 4, avec *la ora nouă* (à neuf heures) ; Mihai est le prénom du personnage, présent depuis l’unité 1. Cette unité réutilise ces trois éléments pour parler de son métier.
  ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza:
    title: 'Rappel : lucrez, lucrează'
    gloss: lucrez (je travaille) · lucrează (il/elle travaille)
    note: Deux formes vues dans la routine quotidienne de l’unité 10 (*Lucrez seara.*). Cette unité les réutilise pour parler de la profession plutôt que du moment de la journée.
  ro.a1.unit17.lesson01.teach.inginer_vocab:
    title: Ingénieur
    gloss: ingénieur
    note: 'Masculin : seul Mihai l’emploie dans cette unité (*Sunt inginer*), donc pas encore besoin de forme féminine.'
    example_gloss:
    - Mihai est ingénieur.
  ro.a1.unit17.lesson01.teach.birou_vocab:
    title: Bureau
    gloss: bureau
    note: Le lieu où travaille Mihai, avec la préposition *la* (à) déjà vue à l’unité 4.
    example_gloss:
    - Il travaille au bureau.
  ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase:
    title: Mihai est ingénieur. Il travaille au bureau.
    gloss: Mihai este inginer. Lucrează la birou.
    note: Tous les mots ici ont déjà été vus ou viennent d’être introduits ; ils forment deux nouvelles phrases sur le métier de Mihai.
  ro.a1.unit17.lesson02.teach.reminder_sunt_unde_ana:
    title: 'Rappel : sunt, unde, Ana'
    gloss: sunt (je suis) · unde (où) · Ana (prénom)
    note: Sunt vient de l’unité 16 (*Sunt bolnav*) ; unde des unités 7 et 8 (*Unde pot să cumpăr...?*, *Unde este...?*) ; Ana est le prénom du personnage, présent depuis l’unité 1. Cette unité réutilise ces trois éléments pour parler du métier d’Ana.
  ro.a1.unit17.lesson02.teach.profesoara_vocab:
    title: Professeure
    gloss: professeure
    note: 'Féminin : seule Ana l’emploie dans cette unité (*Sunt profesoară*), donc pas encore besoin de forme masculine.'
    example_gloss:
    - Je suis professeure.
  ro.a1.unit17.lesson02.teach.scoala_vocab:
    title: École
    gloss: école
    note: Le lieu où travaille Ana, avec *la*, comme dans *la birou*.
    example_gloss:
    - Je travaille à l’école.
  ro.a1.unit17.lesson02.teach.sunt_profesoara_lucrez_la_scoala_phrase:
    title: Je suis professeure. Je travaille à l’école.
    gloss: Sunt profesoară. Lucrez la școală.
    note: Ana parle de son métier en combinant les deux mots nouveaux de cette leçon avec *sunt*, déjà vu à l’unité 16.
  ro.a1.unit17.lesson02.teach.unde_lucrati_phrase:
    title: Où travaillez-vous ?
    gloss: Où travaillez-vous ?
    note: '*Lucrați* est la forme de politesse « vous travaillez », avec la même terminaison -ați/-eți que dans *aveți* et *faceți* ; elle sert à demander à n’importe qui quel est son travail.'
  ro.a1.unit17.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Rappel : Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (bonjour) · Ce mai faceți? (comment allez-vous ?) · Bine, mulțumesc (bien, merci)
    note: Tout vient de la salutation de l’unité 1, réutilisée ici pour ouvrir le dialogue de cette unité.
  ro.a1.unit17.lesson03.teach.reminder_si_dumneavoastra_la_revedere:
    title: 'Rappel : Și dumneavoastră?, La revedere'
    gloss: Și dumneavoastră? (et vous ?) · La revedere (au revoir)
    note: Deux expressions de l’unité 1, réutilisées ici comme question de relance naturelle et comme formule de clôture.
  ro.a1.unit17.lesson03.teach.line01:
    title: Saluer et demander comment il va
    gloss: Ana salue Mihai et lui demande comment il va.
    note: Réutilise la salutation *Ce mai faceți?* de l’unité 1.
  ro.a1.unit17.lesson03.teach.line02:
    title: Répondre et demander où elle travaille
    gloss: Mihai répond, puis demande à Ana où elle travaille.
    note: Associe *Bine, mulțumesc* de l’unité 1 et *Unde lucrați?* de cette unité.
  ro.a1.unit17.lesson03.teach.line03:
    title: Dire son métier et son lieu de travail, puis poser la question en retour
    gloss: Ana dit qu’elle travaille dans une école comme professeure, puis pose la même question à Mihai.
    note: Associe la phrase de la leçon 2 de cette unité et *Și dumneavoastră?* de l’unité 1.
  ro.a1.unit17.lesson03.teach.line04:
    title: Dire son métier et son lieu de travail
    gloss: Mihai dit qu’il travaille dans un bureau comme ingénieur.
    note: Reprend presque telle quelle la phrase de la leçon 1 de cette unité.
  ro.a1.unit17.lesson03.teach.line05:
    title: Terminer la conversation
    gloss: Ana dit au revoir.
    note: La même formule de clôture que dans les dialogues de toutes les unités précédentes.
  ro.a1.unit17.lesson03.teach.line06:
    title: Dire au revoir
    gloss: Mihai dit au revoir.
    note: La même formule de clôture que dans les dialogues de toutes les unités précédentes.
