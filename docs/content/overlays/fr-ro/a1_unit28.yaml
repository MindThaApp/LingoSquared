teaching:
  ro.a1.unit28.lesson01.teach.a_suna:
    title: Appeler
    gloss: appeler
    note: L’infinitif du verbe qui signifie passer un appel téléphonique.
    example_gloss: Je dois t’appeler.
  ro.a1.unit28.lesson01.teach.te_sun:
    title: Dire que tu appelleras
    gloss: Je t’appellerai.
    note: '*Sun* est la forme de *eu* du verbe *a suna* (appeler) ; *te* (« te ») se place avant le verbe, et le roumain emploie ici le présent là où le français peut dire « je vais t’appeler ».'
  ro.a1.unit28.lesson01.teach.alo_sunt_ana:
    title: Répondre au téléphone
    gloss: Allô, c’est Ana.
    note: '*Alo* sert à répondre au téléphone ; *sunt* + prénom dit qui tu es, comme « c’est » en français.'
  ro.a1.unit28.lesson01.teach.alo_sunt_mihai:
    title: Mihai répond de la même façon
    gloss: Allô, c’est Mihai.
    note: Même structure *Alo, sunt* + prénom que dans *Alo, sunt Ana*.
  ro.a1.unit28.lesson02.teach.cu_cine_vorbesc:
    title: Demander qui appelle
    gloss: À qui ai-je l’honneur ?
    note: '*Cu cine vorbesc?* (littéralement « avec qui je parle ? ») est la façon habituelle de demander qui est un interlocuteur inconnu.'
  ro.a1.unit28.lesson02.teach.vorbiti_cu_ana:
    title: Se présenter de manière formelle
    gloss: Vous parlez avec Ana.
    note: '*Vorbiți cu* + prénom est la réponse de politesse : *vorbiți* est la forme de *dumneavoastră* du verbe *a vorbi* (parler).'
  ro.a1.unit28.lesson03.teach.poti_sa_repeti:
    title: Demander de répéter
    gloss: Peux-tu répéter cela ?
    note: '*Poți să* ... (Peux-tu ... ?) + *repeți* (tu répètes) + *asta* (cela).'
  ro.a1.unit28.lesson03.teach.nu_vorbi_atat:
    title: Demander à quelqu’un de parler moins vite
    gloss: Ne parle pas si vite, s’il te plaît.
    note: '*Nu vorbi* (« ne parle pas ») est *nu* + la forme de *tu* ; *atât de repede* signifie « si vite ».'
  ro.a1.unit28.lesson03.teach.nu_te_aud:
    title: Dire que tu entends mal
    gloss: Je ne t’entends pas bien.
    note: '*Nu te aud bine* : *aud* signifie « j’entends », *te* (« te ») se place avant le verbe, et *bine* signifie « bien ».'
  ro.a1.unit28.lesson04.teach.mesajul:
    title: SMS
    gloss: le SMS
    note: '*Mesaj* est masculin au singulier et féminin au pluriel (*un mesaj*, *două mesaje*) ; l’article défini se place à la fin du mot : *mesajul*.'
    example_gloss: Le SMS est d’Ana.
  ro.a1.unit28.lesson04.teach.iti_trimit_un:
    title: Dire que tu enverras un SMS
    gloss: Je t’enverrai un message.
    note: '*Îți* (« à toi ») est un pronom datif placé avant le verbe : *Îți trimit un mesaj*.'
  ro.a1.unit28.lesson04.teach.te_sun_inapoi:
    title: Dire que tu rappelleras
    gloss: Je te rappellerai plus tard.
    note: '*Înapoi* (« en retour ») se place après le verbe : *te sun înapoi* signifie « je te rappelle », et *mai târziu* signifie « plus tard ».'
  ro.a1.unit28.lesson05.teach.mihai_salut_ana:
    title: Lis un échange de SMS
    gloss: 'Mihai : Salut Ana, tu peux m’appeler ? Je dois te dire quelque chose. Ana : Oui, bien sûr, je te rappelle dans cinq minutes.'
    note: Repère ce que Mihai demande, pourquoi, et quand Ana dit qu’elle rappellera.
    glosses:
      Salut: salut
      poți: pouvoir
      suna: appeler
      Trebuie: devoir
      ceva: quelque chose
      spun: dire
      sigur: bien sûr
      sun: appeler
      cinci: cinq
      minute: minutes
      înapoi: rappeler
  ro.a1.unit28.lesson06.teach.mihai_alo_sunt:
    title: Mihai répond à l’appel
    gloss: 'Mihai : Allô, c’est Mihai.'
    note: 'La même structure *Alo, sunt* + prénom de la leçon 1, utilisée ici dans un vrai appel : la personne qui décroche parle la première et donne son nom.'
  ro.a1.unit28.lesson06.teach.ana_salut_mihai:
    title: Ana se présente
    gloss: 'Ana : Salut Mihai, c’est Ana. Mihai : Quelle bonne surprise que tu appelles !'
    note: '*Ce bine că* ... (« comme c’est bien que ... ») exprime une réaction positive à un événement ; *suni* est la forme de *tu* du verbe *a suna*.'
  ro.a1.unit28.lesson06.teach.ana_cum_a:
    title: Ana demande comment s’est passé le service
    gloss: 'Ana : Comment s’est passé ton premier service ?'
    note: '*A fost* signifie « a été / était » (passé de *a fi*). C’est un perfect compus, construit comme *am mâncat* ; voir la note après la réplique suivante.'
  ro.a1.unit28.lesson06.teach.mihai_a_mers:
    title: Mihai annonce une bonne nouvelle
    gloss: 'Mihai : Ça s’est très bien passé, mieux que je ne le pensais.'
    note: '*A mers* est le passé de *a merge* (aller, ici « se passer ») ; *credeam* signifie « je pensais » (une forme du passé de *a crede*).'
  ro.a1.unit28.lesson06.teach.a_fost_a:
    title: 'Formes du passé : a fost, a mers, credeam'
    gloss: a été → être, est allé → aller, pensais → croire
    note: '*A fost* et *a mers* sont des formes de perfect compus (*a* + participe) et *credeam* est un imparfait. Pour l’instant, retiens-les simplement comme des expressions figées dans les contextes de cette leçon ; les règles complètes du passé viendront à un niveau ultérieur.'
  ro.a1.unit28.lesson06.teach.ana_ma_bucur:
    title: Ana est fière
    gloss: 'Ana : Je suis heureuse d’entendre ça ! Je suis fière de toi.'
    note: '*Mândră de* (« fière de ») est une combinaison figée ; *de* est obligatoire. Un homme dit *mândru*.'
  ro.a1.unit28.lesson06.teach.mihai_iti_multumesc:
    title: Mihai est touché
    gloss: 'Mihai : Merci, ça compte beaucoup pour moi.'
    note: '*Înseamnă* est la forme de il/elle du verbe *a însemna* (signifier) ; *pentru mine* (« pour moi ») indique pour qui cela compte.'
  ro.a1.unit28.lesson06.teach.prima_lui_tura:
    title: Son
    gloss: Son premier service s’est très bien passé.
    note: '*Lui* après le nom signifie « son » (à lui) : *prima lui tură*. (Pour « à elle », on dit *ei*.)'
