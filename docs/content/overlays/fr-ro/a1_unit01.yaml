answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Roumain A1
  description: 'Apprends les salutations courantes en roumain et les présentations lors d’une première rencontre. Le cours insiste sur ce qui compte le plus à ce niveau : le tu informel face au dumneavoastră de politesse, et les deux façons usuelles de dire son nom en roumain (mă numesc... / mă cheamă...).'
units:
  ro.a1.unit01.greetings:
    title: Salutations et premières rencontres
lessons:
  ro.a1.unit01.lesson01.tu_dumneavoastra_greetings:
    title: 'Salutations : tu et dumneavoastră'
  ro.a1.unit01.lesson02.names_introductions:
    title: Comment tu t’appelles ?
  ro.a1.unit01.lesson03.street_meeting:
    title: Une rencontre dans la rue
teaching:
  ro.a1.unit01.lesson01.teach.buna:
    title: Salutation de tous les jours
    gloss: salut ; bonjour
    note: Bună est la salutation courante, légèrement familière. Tu peux l’employer sans risque avec des amis, des personnes de ton âge et dans la plupart des rencontres décontractées en journée.
    example_gloss: Salut, Mihai !
  ro.a1.unit01.lesson01.teach.salut:
    title: Salutation familière
    gloss: bonjour (familier) ; ciao
    note: Salut est familier ; on l’emploie entre amis et entre personnes du même âge. Comme en français, il peut ouvrir ou clore un échange, mais ce n’est pas le meilleur choix avec un adulte que l’on ne connaît pas.
    example_gloss: Salut, Ana !
  ro.a1.unit01.lesson01.teach.buna_ziua:
    title: Salutation formelle
    gloss: bonjour (formel)
    note: Bună ziua est la salutation polie et sûre pour un adulte inconnu, un commerçant ou toute personne à qui tu dirais dumneavoastră. Littéralement « bon jour », mais elle sert de bonjour poli général, pas seulement à midi.
    example_gloss: Bonjour, Ana !
  ro.a1.unit01.lesson01.teach.la_revedere:
    title: Formule d’adieu neutre
    gloss: au revoir
    note: La revedere convient aussi bien dans les situations polies que familières, tout comme au revoir en français.
    example_gloss: Bonjour ! Au revoir !
  ro.a1.unit01.lesson01.teach.tu:
    title: Le « tu » familier (singulier)
    gloss: tu, informel singulier
    note: Comme le tu français, le tu roumain s’adresse à un ami, à un enfant ou à une personne avec qui la relation est explicitement familière, et il a ses propres formes verbales (faci, et non faceți).
  ro.a1.unit01.lesson01.teach.dumneavoastra:
    title: « Vous » de politesse ou pluriel
    gloss: vous (politesse, singulier ou pluriel)
    note: 'Dumneavoastră est le choix le plus sûr pour un adulte inconnu, et il sert aussi pour un groupe que l’on salue poliment : c’est à peu près le rôle de vous en français. Il vient de domnia voastră (« votre seigneurie ») et prend les formes verbales du pluriel (faceți, numiți), exactement comme vous, même quand il désigne une seule personne.'
  ro.a1.unit01.lesson01.teach.ce_mai_faceti:
    title: Demander poliment comment va quelqu’un
    gloss: Comment allez-vous ?
    note: Faceți est la forme de dumneavoastră du verbe a face (faire). C’est une question de politesse conventionnelle, pas une vraie demande sur ce que la personne est en train de faire.
  ro.a1.unit01.lesson01.teach.ce_mai_faci:
    title: Demander familièrement comment va quelqu’un
    gloss: Comment allez-vous ?
    note: Faci est la forme de tu du verbe a face. Entre la version polie et la version familière de cette question, seule la terminaison du verbe change ; ce mai reste identique dans les deux cas.
  ro.a1.unit01.lesson01.teach.bine_multumesc:
    title: Réponse positive habituelle
    gloss: Bien, merci.
    note: 'Bine, mulțumesc répond à ce mai faci/faceți quel que soit le registre : la réponse ne change pas.'
    example_gloss: Comment ça va ? Bien, merci.
  ro.a1.unit01.lesson01.teach.register_choice:
    title: Associer salutation et relation
    gloss: Bună ziua avec dumneavoastră ; Salut avec tu
    note: Ce sont des repères utiles, pas des lois absolues. Bună ziua peut aussi ouvrir un échange formel qui se poursuit ensuite avec dumneavoastră ; en revanche, associer Salut à dumneavoastră envoie en général des signaux sociaux contradictoires.
  ro.a1.unit01.lesson02.teach.ma_numesc:
    title: Dire son nom (forme standard)
    gloss: Je m’appelle Ana.
    note: 'Mă numesc signifie littéralement « je me nomme » : c’est la façon neutre, valable partout, de dire son nom, d’un registre proche de je m’appelle.'
    example_gloss: Salut ! Je m’appelle Ana.
  ro.a1.unit01.lesson02.teach.cum_va_numiti:
    title: Demander un nom poliment
    gloss: Comment vous appelez-vous ?
    note: Numiți est la forme de dumneavoastră du verbe a se numi (s’appeler). Vă est le pronom réfléchi qui correspond à dumneavoastră ; il est obligatoire ici, tout comme vous dans Comment vous appelez-vous ?
  ro.a1.unit01.lesson02.teach.ma_cheama:
    title: Dire son nom (langue parlée)
    gloss: Je m’appelle Mihai.
    note: Mă cheamă est la façon la plus parlée de dire son nom, littéralement « ça m’appelle ». Mă numesc et mă cheamă sont tous deux corrects et courants ; mă cheamă est un peu plus familier.
    example_gloss: Salut ! Je m’appelle Mihai.
  ro.a1.unit01.lesson02.teach.cum_te_cheama:
    title: Demander familièrement le nom de quelqu’un
    gloss: Comment tu t’appelles ?
    note: Te est le pronom réfléchi qui correspond à tu. C’est la façon habituelle dont des amis ou des personnes du même âge se demandent leur nom.
  ro.a1.unit01.lesson02.teach.imi_pare_bine:
    title: Faire connaissance
    gloss: Enchanté(e) !
    note: 'Îmi pare bine signifie littéralement « ça me semble bien » : c’est une expression idiomatique figée, à ne pas décomposer mot à mot. Contrairement à enchanté(e) en français, elle ne change pas de forme selon le genre de la personne qui parle.'
    example_gloss: Je m’appelle Mihai. Enchanté !
  ro.a1.unit01.lesson02.teach.si_mie_imi_pare_bine:
    title: Répondre de même
    gloss: Enchanté(e) aussi !
    note: Și mie ajoute le sens de « aussi / de même » devant la même expression figée que celle qui a servi à ouvrir l’échange.
  ro.a1.unit01.lesson02.teach.si_dumneavoastra:
    title: Renvoyer une question poliment
    gloss: Et vous ?
    note: Emploie dumneavoastră pour garder le registre poli ou pour t’adresser à un groupe.
  ro.a1.unit01.lesson02.teach.si_tu:
    title: Renvoyer une question de façon familière
    gloss: Et vous ?
    note: Emploie tu après și quand tu parles familièrement à un seul ami ou à une personne de ton âge.
  ro.a1.unit01.lesson03.teach.line01:
    title: Ouvrir la rencontre
    gloss: Ana salue Mihai de façon formelle et donne son nom.
    note: Ana commence par le poli bună ziua, qui convient pour rencontrer quelqu’un qu’elle ne connaît pas.
  ro.a1.unit01.lesson03.teach.line02:
    title: Ouvrir la rencontre, la réponse
    gloss: Mihai répond à son sentiment, donne son nom et lui demande comment elle va.
    note: 'Mihai garde le même registre poli que celui d’Ana : il demande ce mai faceți, et non ce mai faci.'
  ro.a1.unit01.lesson03.teach.line03:
    title: Répondre et renvoyer la question
    gloss: Ana dit qu’elle va bien et pose poliment la même question à Mihai.
    note: Și dumneavoastră garde l’échange formel, comme au début.
  ro.a1.unit01.lesson03.teach.line04:
    title: Répondre et conclure
    gloss: Mihai dit qu’il va bien aussi et dit au revoir.
    note: La revedere est la formule d’adieu neutre, qui convient que l’échange ait été formel ou familier.
  ro.a1.unit01.lesson03.teach.line05:
    title: Conclure la rencontre
    gloss: Ana répète la même formule d’adieu.
    note: Répéter la revedere est la façon naturelle de confirmer une fin d’échange amicale.
exercises:
  ro.a1.unit01.lesson01.exercise01.listen_buna:
    instruction: Écoute et sélectionne l’expression que tu entends.
    correct_option: Bună!
    distractors:
    - Salut!
    - La revedere!
    accepted_answers:
    - Bună!
    - Bună
  ro.a1.unit01.lesson01.exercise02.choose_informal_pronoun:
    instruction: Quel pronom correspond à cette salutation familière ?
    correct_option: tu
    distractors:
    - dumneavoastră
    accepted_answers:
    - tu
    feedback: Salut et tu forment une combinaison familière cohérente.
  ro.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: Remets dans l’ordre la question polie pour demander des nouvelles.
    correct_response:
    - Ce
    - mai
    - faceți
  ro.a1.unit01.lesson01.exercise06.match_register:
    instruction: Associe chaque salutation au registre qui lui correspond habituellement à ce niveau débutant.
    correct_response:
      Bună ziua: dumneavoastră
      Salut: tu
    pairs:
    - left: Bună ziua
      right: dumneavoastră
    - left: Salut
      right: tu
  ro.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: Complète la salutation adressée à un adulte inconnu.
    accepted_answers:
    - dumneavoastră
    feedback: Dumneavoastră est le choix sûr et respectueux avec un adulte inconnu.
  ro.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: Écris la question informelle que tu entends.
    accepted_answers:
    - Ce mai faci?
    - Ce mai faci
  ro.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: Complète la formule d’au revoir neutre.
    accepted_answers:
    - revedere
  ro.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: Salue poliment, demande à la personne comment elle va, puis conclus l’échange.
    accepted_answers:
    - Bună ziua. Ce mai faceți? La revedere.
    - Bună ziua, ce mai faceți? La revedere.
  ro.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: Écoute et sélectionne la question polie pour demander un nom.
    correct_option: Cum vă numiți?
    distractors:
    - Cum te cheamă?
    - Ce mai faceți?
    accepted_answers:
    - Cum vă numiți?
    - Cum va numiti?
  ro.a1.unit01.lesson02.exercise05.choose_reply_meaning:
    instruction: Que signifie la réponse de Mihai ?
    correct_option: Enchanté(e) !
    distractors:
    - Au revoir !
    - Comment allez-vous ?
    accepted_answers:
    - Enchanté(e) !
  ro.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: Construis la présentation d’Ana.
    correct_response:
    - Mă
    - numesc
    - Ana
  ro.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: Associe chaque question sur le nom à la réponse qui lui correspond.
    correct_response:
      Cum vă numiți?: Mă numesc Ana.
      Cum te cheamă?: Mă cheamă Mihai.
    pairs:
    - left: Cum vă numiți?
      right: Mă numesc Ana.
    - left: Cum te cheamă?
      right: Mă cheamă Mihai.
  ro.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: Après la salutation familière, demande son nom à l’autre personne.
    accepted_answers:
    - Cum te cheamă?
    - Cum te cheama?
  ro.a1.unit01.lesson02.exercise04.complete_ma_cheama:
    instruction: Complète la phrase qui donne le nom de Mihai.
    accepted_answers:
    - Mă
  ro.a1.unit01.lesson02.exercise06.return_polite_question:
    instruction: Renvoie la question sans quitter le registre poli.
    accepted_answers:
    - Și dumneavoastră?
    - Si dumneavoastra?
  ro.a1.unit01.lesson02.exercise08.write_introduction:
    instruction: 'Tu es Ana. Écris : salue avec Bună, donne ton nom avec mă numesc, puis dis que tu es enchantée de faire connaissance.'
    accepted_answers:
    - Bună. Mă numesc Ana. Îmi pare bine.
    - Buna. Ma numesc Ana. Imi pare bine.
  ro.a1.unit01.lesson03.exercise01.role_selection:
    instruction: Dans le dialogue, quel locuteur donne son nom avec cette expression ?
    correct_option: Ana
    distractors:
    - Mihai
    - Aucun des deux
    accepted_answers:
    - Ana
  ro.a1.unit01.lesson03.exercise02.comprehend_register:
    instruction: Quel pronom Ana et Mihai emploient-ils l’un avec l’autre ?
    correct_option: dumneavoastră
    distractors:
    - tu
    - te
    accepted_answers:
    - dumneavoastră
  ro.a1.unit01.lesson03.exercise03.comprehend_names:
    instruction: Quel locuteur emploie mă numesc, et lequel emploie mă cheamă ?
    correct_option: Ana uses mă numesc; Mihai uses mă cheamă.
    distractors:
    - Mihai uses mă numesc; Ana uses mă cheamă.
    - Les deux locuteurs emploient mă numesc.
    accepted_answers:
    - Ana uses mă numesc; Mihai uses mă cheamă.
    - Ana; Mihai
  ro.a1.unit01.lesson03.exercise05.order_closing:
    instruction: Construis la réponse finale et la formule d’adieu.
    correct_response:
    - Bine,
    - mulțumesc.
    - La
    - revedere!
  ro.a1.unit01.lesson03.exercise04.role_response:
    instruction: Prends le rôle d’Ana. Réponds poliment et renvoie la question.
    accepted_answers:
    - Bine, mulțumesc. Și dumneavoastră?
    - Bine, multumesc. Si dumneavoastra?
  ro.a1.unit01.lesson03.exercise06.speak_role:
    instruction: Prends le rôle d’Ana. Salue Mihai de façon formelle, donne ton nom, réponds à sa phrase et conclus la rencontre.
    accepted_answers:
    - Bună ziua. Mă numesc Ana. Îmi pare bine! La revedere!
    - Buna ziua. Ma numesc Ana. Imi pare bine! La revedere!
    - Bună ziua. Mă numesc Ana. Și mie îmi pare bine! La revedere!
  ro.a1.unit01.lesson01.exercise09.dictation_buna:
    instruction: Écris ce que tu entends.
    correct_option: Bună
    accepted_answers:
    - value: Bună
      status: correct
    orthography_strict: true
