teaching:
  ro.a1.unit08.lesson01.teach.reminder_unde_este:
    title: 'Rappel : unde, este'
    gloss: où · est
    note: 'Les deux sont déjà apparus : *unde* dans *Unde pot să cumpăr ...?* de l’unité 7, *este* depuis les unités 3 et 4. Ici, ils se combinent dans la question de base pour situer un lieu.'
  ro.a1.unit08.lesson01.teach.unde_este_phrase:
    title: Où est… ?
    gloss: Où est… ?
    note: 'La façon courante de demander où se trouve quelque chose : ajoute le nom du lieu après *este*, ou emploie la formule seule quand le lieu est clair d’après le contexte.'
  ro.a1.unit08.lesson01.teach.gara_magazin_banca:
    title: Gare, magasin, banque
    gloss: gare · magasin · banque
    note: 'Trois lieux courants : tous prennent l’article défini quand on parle d’un lieu précis et connu : *gara*, *magazinul*, *banca*.'
    example_gloss:
    - Où est la gare ?
    - Le magasin est près d’ici.
    - La banque est loin.
  ro.a1.unit08.lesson01.teach.aproape_departe:
    title: Près, loin
    gloss: proche / près · loin
    note: Une façon simple d’indiquer la proximité ou l’éloignement d’un lieu, sans donner d’itinéraire précis.
    example_gloss:
    - Le magasin est près d’ici.
    - La banque est loin.
  ro.a1.unit08.lesson01.teach.magazinul_aproape:
    title: Le magasin est près
    gloss: Le magasin est près d’ici.
    note: 'Une phrase courte et complète : inutile de nommer un lieu après *aproape* quand on voit bien duquel il s’agit.'
  ro.a1.unit08.lesson01.teach.banca_departe:
    title: La banque est loin
    gloss: La banque est loin.
    note: 'Le contraire de *aproape* : même construction simple.'
  ro.a1.unit08.lesson01.teach.unde_este_gara:
    title: Où est la gare ?
    gloss: Où est la gare ?
    note: Associe *Unde este...?* et *gara* pour former une question complète.
  ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie:
    title: Hôpital, poste, bibliothèque, arrêt de bus
    gloss: spital (hôpital) · poștă (poste) · bibliotecă (bibliothèque) · stație de autobuz (arrêt de bus)
    note: 'Quatre autres lieux courants : comme gară/magazin/bancă, ils prennent l’article défini pour désigner un lieu précis : *spitalul*, *poșta*, *biblioteca*, *stația de autobuz*.'
    example_gloss:
    - L’hôpital est en face du magasin.
    - La poste est entre le magasin et l’hôpital.
    - La bibliothèque est près de la gare.
    - L’arrêt de bus est à côté de la bibliothèque.
  ro.a1.unit08.lesson02.teach.langa_vizavi_intre:
    title: À côté, en face, entre
    gloss: lângă (à côté de) · vizavi de (en face de) · între (entre)
    note: Trois façons de situer un lieu par rapport à un autre. *Vizavi de* contient *de* devant le second lieu, *între* relie deux lieux avec *și*, et *lângă* se construit directement.
    example_gloss:
    - Le magasin est à côté de la gare.
    - L’hôpital est en face du magasin.
    - La poste est entre le magasin et l’hôpital.
  ro.a1.unit08.lesson02.teach.magazinul_langa_gara:
    title: Le magasin est à côté de la gare
    gloss: Magazinul este lângă gară. (Le magasin est à côté de la gare.)
    note: '*Lângă* se place directement devant le nom du lieu, sans mot supplémentaire.'
  ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin:
    title: L’hôpital est en face du magasin
    gloss: Spitalul este vizavi de magazin. (L’hôpital est en face du magasin.)
    note: '*Vizavi de* demande *de* devant le second lieu.'
  ro.a1.unit08.lesson02.teach.posta_intre:
    title: La poste est entre le magasin et l’hôpital
    gloss: Poșta este între magazin și spital. (La poste est entre le magasin et l’hôpital.)
    note: '*Între* introduit deux lieux reliés par *și* (et).'
  ro.a1.unit08.lesson02.teach.statia_langa_biblioteca:
    title: L’arrêt de bus est à côté de la bibliothèque
    gloss: Stația de autobuz este lângă bibliotecă. (L’arrêt de bus est à côté de la bibliothèque.)
    note: Même construction avec *lângă* que pour le magasin et la gare, mais ici avec l’arrêt de bus et la bibliothèque.
  ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'Rappel : bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (salut) · mulțumesc (merci) · la revedere (au revoir) · da (oui) · Ana, Mihai (prénoms)
    note: 'Tout cela a déjà été vu dans les unités précédentes : ici, Ana et Mihai se retrouvent, cette fois dans le quartier.'
  ro.a1.unit08.lesson03.teach.line01:
    title: Saluer et demander où est la poste
    gloss: Ana salue Mihai et lui demande où est la poste.
    note: Associe le *Unde este* de cette unité et la salutation de l’unité 1.
  ro.a1.unit08.lesson03.teach.line02:
    title: Indiquer l’emplacement
    gloss: Mihai dit que la poste est entre le magasin et l’hôpital.
    note: Reprend la construction *poșta* / *între ... și* de cette unité.
  ro.a1.unit08.lesson03.teach.line03:
    title: Poser une question sur la bibliothèque
    gloss: Ana demande si la bibliothèque est proche.
    note: Une courte question de relance qui reprend *este* et *aproape*.
  ro.a1.unit08.lesson03.teach.line04:
    title: Confirmer et ajouter une précision
    gloss: Mihai confirme que la bibliothèque est près de la gare et ajoute que l’arrêt de bus est à côté de la bibliothèque.
    note: Réunit *aproape de* et *lângă*, deux prépositions de cette unité, dans une même réplique.
  ro.a1.unit08.lesson03.teach.line05:
    title: Remercier et conclure
    gloss: Ana remercie Mihai et lui dit au revoir.
    note: Ici, *Mulțumesc* est un simple remerciement de fin de conversation, le même mot que dans *Bine, mulțumesc.* de l’unité 1.
  ro.a1.unit08.lesson03.teach.line06:
    title: Terminer la rencontre
    gloss: Mihai dit au revoir à son tour, en employant le prénom d’Ana.
    note: La même formule de clôture amicale qui terminait les dialogues des unités 1, 5, 6 et 7.
