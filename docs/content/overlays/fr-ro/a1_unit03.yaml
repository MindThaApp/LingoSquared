answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly, matching units 01/02''s policy.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark. Day and month names are correctly lowercase in standard Romanian writing (except sentence-initially); accept a learner's answer regardless of the case they happen to type it in -- this unit teaches the lowercase convention as a fact to recognize, not a hard-graded spelling rule.
  register: No new register-sensitive forms in this unit -- este (is) is invariant regardless of tu/dumneavoastră, and Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Roumain A1
  description: Les jours de la semaine, les mois de l’année et la façon dont le roumain exprime une date (un nombre cardinal simple suivi du mois, sauf pour le 1er, qui utilise le mot spécial întâi) ; Ana et Mihai continuent de fixer leur prochaine rencontre.
units:
  ro.a1.unit03.dates:
    title: Jours et dates
lessons:
  ro.a1.unit03.lesson01.zilele_saptamanii:
    title: Les jours de la semaine
  ro.a1.unit03.lesson02.lunile_si_datele:
    title: Les mois de l’année et comment dire la date
  ro.a1.unit03.lesson03.cand_ne_intalnim:
    title: Quand se revoit-on ?
teaching:
  ro.a1.unit03.lesson01.teach.este:
    title: 'Rappel : este'
    gloss: est / c’est
    note: '*Este* est déjà apparu dans l’unité 2 (*Care este numărul...?*). Il est invariable : c’est le même mot que le sujet soit un jour, une date ou autre chose, et il ne change pas entre tu et dumneavoastră.'
  ro.a1.unit03.lesson01.teach.astazi_maine:
    title: Aujourd’hui, demain
    gloss: astăzi (aujourd’hui) / mâine (demain)
    note: Ce sont deux mots de temps invariables, placés en début de phrase pour dire quel jour ou quelle date on est.
    example_gloss:
    - Aujourd'hui, c'est lundi.
    - Demain, c’est mardi.
  ro.a1.unit03.lesson01.teach.luni_marti:
    title: Lundi, mardi
    gloss: luni (lundi) / marți (mardi)
    note: Pour dire le jour (Astăzi este luni), utilise la forme simple donnée ici. Les noms des jours ont bien des formes avec article – lunea, marțea – qui signifient « le lundi », « le mardi » (habituellement) ; tu les rencontreras plus tard.
    example_gloss:
    - Aujourd’hui, c’est lundi.
    - Demain, c’est mardi.
  ro.a1.unit03.lesson01.teach.miercuri_joi:
    title: Mercredi, jeudi
    gloss: mercredi / jeudi
    note: Comme luni et marți, miercuri et joi gardent la même forme au singulier et au pluriel.
    example_gloss:
    - Aujourd'hui, c'est mercredi.
    - Demain, c’est jeudi.
  ro.a1.unit03.lesson01.teach.vineri_sambata:
    title: Vendredi, samedi
    gloss: vendredi / samedi
    note: Sâmbătă garde son â au milieu du mot dans l’orthographe moderne, contrairement à l’ancienne graphie sîmbătă.
    example_gloss:
    - Aujourd’hui, c’est vendredi.
    - Demain, c’est samedi.
  ro.a1.unit03.lesson01.teach.duminica:
    title: Dimanche
    gloss: Dimanche
    note: Duminică complète la semaine. Pour dire quel jour on est, utilise cette forme simple ; la forme avec article duminica signifie « le dimanche » (habituellement).
    example_gloss: Aujourd'hui, c'est dimanche.
  ro.a1.unit03.lesson01.teach.ce_zi_e_azi:
    title: Demander quel jour on est
    gloss: Quel jour sommes-nous aujourd’hui ?
    note: 'La façon courante de demander quel jour de la semaine on est : zi (jour) est le mot nouveau ici, avec ce, este et astăzi que tu connais déjà.'
  ro.a1.unit03.lesson01.teach.saptamana_ieri:
    title: Semaine, hier, semaine dernière/prochaine
    gloss: semaine / hier / la semaine dernière / la semaine prochaine
    note: 'Un lot de vocabulaire complémentaire, issu des mêmes sources que les noms des jours : utile pour situer les dates dans le temps, mais moins travaillé dans les exercices de cette unité que les jours de la semaine.'
  ro.a1.unit03.lesson01.teach.lowercase_zile:
    title: Les jours s’écrivent en minuscule
    gloss: 'Les jours ne s’écrivent pas avec une majuscule : lundi, vendredi.'
    note: 'Comme en français, les noms des jours roumains s’écrivent en minuscule au milieu d’une phrase : *luni*, et non *Luni*, sauf si le mot ouvre la phrase.'
  ro.a1.unit03.lesson02.teach.ian_feb_mar:
    title: Janvier, février, mars
    gloss: janvier / février / mars
    note: Contrairement aux noms des jours, plusieurs noms de mois sont des mots apparentés faciles à reconnaître en français.
    example_gloss:
    - Nous sommes en janvier.
    - Nous sommes en février.
    - Nous sommes en mars.
  ro.a1.unit03.lesson02.teach.apr_mai_iun:
    title: Avril, mai, juin
    gloss: avril / mai / juin
    note: 'Mai (le mois) est court mais à distinguer de mai, l’adverbe (plus) utilisé ailleurs dans ce cours (ce mai faci) : le contexte lève toujours l’ambiguïté.'
    example_gloss:
    - Nous sommes en avril.
    - Nous sommes en mai.
    - Nous sommes en juin.
  ro.a1.unit03.lesson02.teach.iul_aug_sep:
    title: Juillet, août, septembre
    gloss: juillet / août / septembre
    note: 'Iulie, august et septembrie ressemblent beaucoup aux mots français : august est l’un des mots les plus transparents de cette série.'
    example_gloss:
    - Nous sommes en juillet.
    - Nous sommes en août.
    - Nous sommes en septembre.
  ro.a1.unit03.lesson02.teach.oct_noi_dec:
    title: Octobre, novembre, décembre
    gloss: octobre / novembre / décembre
    note: Les trois derniers mois complètent la série des douze ; ce sont tous des noms invariables.
    example_gloss:
    - Nous sommes en octobre.
    - Nous sommes en novembre.
    - Nous sommes en décembre.
  ro.a1.unit03.lesson02.teach.intai:
    title: Le premier (du mois)
    gloss: le premier
    note: 'Une vraie particularité du roumain, comme en français : dans l’usage standard, le premier jour du mois ne se dit pas *unu* (le simple « un »), mais avec un mot à part, *întâi*. (Tu pourras entendre *unu* à l’oral familier, mais *întâi* est la forme à retenir.) Toutes les autres dates, à partir du deux, utilisent le nombre cardinal ordinaire.'
    example_gloss: Aujourd’hui, c’est le premier août.
  ro.a1.unit03.lesson02.teach.date_rule:
    title: Comment le roumain donne une date
    gloss: 'le 1er : întâi · à partir du 2 : le nombre ordinaire (doi, trei, patru...)'
    note: Après le 1er, la date roumaine se compose simplement du nombre cardinal (vu plus tôt) suivi du mois – sans forme ordinale ni mot supplémentaire, par ex. *trei aprilie* (le trois avril, littéralement « trois avril »).
  ro.a1.unit03.lesson02.teach.ce_data:
    title: Demander la date
    gloss: Quelle est la date aujourd'hui ?
    note: Dată (date) est un mot nouveau ici ; le reste de la question reprend ce, este et astăzi, exactement comme dans la question sur le jour de la leçon 1.
  ro.a1.unit03.lesson02.teach.raspuns_data:
    title: Indiquer une date
    gloss: Aujourd’hui, nous sommes le trois avril.
    note: Trei (trois) est un nombre cardinal de l’unité 2 ; on n’ajoute ni terminaison ordinale ni mot supplémentaire avant aprilie.
  ro.a1.unit03.lesson02.teach.la_multi_ani:
    title: Souhaiter ses vœux lors d’un jour spécial
    gloss: Joyeux anniversaire ! / Bonne année !
    note: 'Littéralement « (pour) de nombreuses années » : c’est le vœu roumain le plus courant pour un anniversaire, une fête ou le Nouvel An ; il reprend *ani* (ans) de l’unité 2 sur l’âge.'
  ro.a1.unit03.lesson02.teach.lowercase_luni:
    title: Les mois s’écrivent aussi en minuscule
    gloss: 'Les mois ne s’écrivent pas avec une majuscule : janvier, mai.'
    note: 'C’est la même règle que pour les jours de la semaine dans la leçon 1 : les noms de mois roumains restent en minuscule au milieu d’une phrase.'
  ro.a1.unit03.lesson03.teach.cand:
    title: Quand ?
    gloss: quand ?
    note: Când ouvre une question sur le moment, comme « quand » en français.
    example_gloss: Quand a lieu la réunion ?
  ro.a1.unit03.lesson03.teach.intalnirea:
    title: La réunion
    gloss: la réunion
    note: Întâlnirea est la forme définie (la réunion) ; le nom sans article serait întâlnire.
    example_gloss: La réunion a lieu lundi.
  ro.a1.unit03.lesson03.teach.cand_e_intalnirea:
    title: Demander quand a lieu quelque chose
    gloss: Quand a lieu la réunion ?
    note: Associe când au mot este, déjà connu, et au nouveau mot de cette leçon, întâlnirea.
  ro.a1.unit03.lesson03.teach.raspuns_intalnire:
    title: Indiquer la date d’un événement
    gloss: La réunion a lieu vendredi 1er août.
    note: On peut donner ensemble le jour de la semaine et la date, séparés par une virgule, comme en français.
  ro.a1.unit03.lesson03.teach.fara_de:
    title: Pas de de pour les jours et les dates
    gloss: 'Les jours et les dates n’ont pas besoin de « de » : vendredi 1er août.'
    note: 'À ne pas confondre avec la règle de l’unité 2 : à partir de 20, les nombres demandent *de* devant un nom (*treizeci de ani*), mais un jour de la semaine ou une date se construit directement, sans *de*.'
  ro.a1.unit03.lesson03.teach.line01:
    title: Demander quand a lieu la réunion
    gloss: Ana demande à Mihai quand a lieu leur réunion.
    note: 'Une question simple et neutre : este ne change pas selon qu’on dit tu ou dumneavoastră.'
  ro.a1.unit03.lesson03.teach.line02:
    title: Indiquer la date
    gloss: Mihai dit que la réunion a lieu vendredi 1er août.
    note: 'Mihai reprend exactement le modèle de date de la leçon 2 : jour de la semaine, puis întâi + mois, sans de.'
  ro.a1.unit03.lesson03.teach.line03:
    title: Remercier et conclure
    gloss: Ana le remercie et lui dit au revoir.
    note: La revedere, vu dans l’unité 1, conclut l’échange comme toujours.
  ro.a1.unit03.lesson03.teach.line04:
    title: Conclure l’échange
    gloss: Mihai lui dit au revoir à son tour, en utilisant le prénom d’Ana.
    note: Reprendre la revedere avec le prénom de l’autre personne est une manière naturelle et chaleureuse de conclure.
