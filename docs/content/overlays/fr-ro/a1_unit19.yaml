answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (vreme, soare, cald, plouă, vânt, frig) is used only in person-invariant impersonal constructions ("Este soare," "Plouă," "Este vânt," "Este frig," "Cum este vremea?") with no register distinction of any kind. No new tu/ dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting/closing lines.
course:
  title: Roumain A1
  description: 'Décrire le temps qu’il fait en roumain : Vreme (le temps), Soare (soleil), Cald (chaud), Plouă (il pleut), Vânt (vent) et Frig (froid), pendant qu’Ana et Mihai consultent la météo de demain et décident quand aller au parc.'
units:
  ro.a1.unit19.weather:
    title: Le temps
lessons:
  ro.a1.unit19.lesson01.vremea_de_azi:
    title: Le temps aujourd’hui
  ro.a1.unit19.lesson02.vremea_de_maine:
    title: Le temps de demain
  ro.a1.unit19.lesson03.planul_de_sambata:
    title: Le programme de samedi
teaching:
  ro.a1.unit19.lesson01.teach.reminder_ana_este:
    title: 'Rappel : Ana, Este, Și'
    gloss: Ana (prénom) · Este (est) · Și (et)
    note: Ana est le prénom du personnage, présent depuis l’unité 1 ; *este* vient du contenu sur les lieux de l’unité 8 ; *și* vient de l’unité 5. Cette unité réutilise les trois pour décrire le temps d’aujourd’hui.
  ro.a1.unit19.lesson01.teach.reminder_astazi:
    title: 'Rappel : Astăzi'
    gloss: Astăzi (aujourd’hui)
    note: Vient du vocabulaire des dates de l’unité 3 ; on le réutilise ici pour parler du temps d’aujourd’hui.
  ro.a1.unit19.lesson01.teach.vreme_vocab:
    title: Le temps
    gloss: Vreme (temps qu’il fait)
    note: '*Vremea* est la forme définie de *vreme* : « le temps ». Un nom féminin en -e ajoute -a, comme *baie* → *baia* (la salle de bains) à l’unité 18.'
    example_gloss:
    - Quel temps fait-il ?
  ro.a1.unit19.lesson01.teach.cum_este_vremea_phrase:
    title: Quel temps fait-il ?
    gloss: Cum este vremea ? (Quel temps fait-il ?)
    note: La façon courante de demander le temps qu’il fait ; *cum* vient des unités 1, 9 et 12.
  ro.a1.unit19.lesson01.teach.soare_vocab:
    title: Soleil / ensoleillé
    gloss: Soare (soleil / ensoleillé)
    note: 'Se emploie avec *este* pour décrire un temps ensoleillé : *Este soare* signifie littéralement « il est soleil », c’est-à-dire « il y a du soleil ».'
    example_gloss:
    - Aujourd’hui, il y a du soleil.
  ro.a1.unit19.lesson01.teach.cald_vocab:
    title: Chaud
    gloss: Cald (chaud)
    note: 'Un mot de météo invariable : *Este cald* garde toujours cette même forme, sans accord.'
    example_gloss:
    - Aujourd’hui, il fait chaud.
  ro.a1.unit19.lesson01.teach.astazi_soare_cald_phrase:
    title: Aujourd’hui, il y a du soleil. Il fait chaud.
    gloss: Astăzi este soare. Este cald.
    note: Tous les mots ici ont déjà été vus ou viennent d’être introduits ; ils sont combinés en deux nouvelles phrases décrivant le temps d’aujourd’hui.
  ro.a1.unit19.lesson02.teach.reminder_mihai_maine:
    title: 'Rappel : Mihai, Mâine'
    gloss: Mihai (prénom) · Mâine (demain)
    note: Mihai est le prénom du personnage, présent depuis l’unité 1 ; *mâine* vient des unités 3 et 12. Cette unité réutilise les deux pour décrire la météo de demain.
  ro.a1.unit19.lesson02.teach.reminder_nu_mergem_la_parc:
    title: 'Rappel : Nu, Mergem, La parc'
    gloss: Nu (non / ne… pas) · Mergem (nous allons) · La parc (au parc)
    note: Tout vient du vocabulaire de l’unité 11 sur les projets à décider ensemble ; on le réutilise ici pour décider si le temps permet d’aller au parc.
  ro.a1.unit19.lesson02.teach.ploua_vocab:
    title: Il pleut
    gloss: Plouă (il pleut)
    note: 'Une forme verbale impersonnelle : aucun sujet n’est nécessaire, tout comme *Este cald* n’en a pas besoin. C’est comme en français avec « il pleut ».'
    example_gloss:
    - Demain, il pleut.
  ro.a1.unit19.lesson02.teach.vant_vocab:
    title: Vent
    gloss: Vânt (vent)
    note: 'Se emploie avec *este* comme *soare* : *Este vânt*, « il y a du vent ».'
    example_gloss:
    - Demain, il y a du vent.
  ro.a1.unit19.lesson02.teach.frig_vocab:
    title: Froid
    gloss: Frig (froid)
    note: 'Se emploie avec *este* : *Este frig*, « il fait froid ».'
    example_gloss:
    - Demain, il fait froid.
  ro.a1.unit19.lesson02.teach.maine_ploua_phrase:
    title: Demain, il pleut. Il y a du vent et il fait froid.
    gloss: Mâine plouă. Este vânt și este frig.
    note: Tous les mots ici ont déjà été vus ou viennent d’être introduits ; ils sont combinés en une prévision complète pour demain.
  ro.a1.unit19.lesson02.teach.nu_mergem_phrase:
    title: Nous n’allons pas au parc demain.
    gloss: Nu mergem la parc mâine. (Nous n’allons pas au parc demain.)
    note: 'Le projet fondé sur la météo vers lequel mène cette leçon : il réutilise *mergem* et *la parc* de l’unité 11, avec *nu* devant.'
  ro.a1.unit19.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Rappel : Bună, Ce mai faceți ?, Bine, mulțumesc'
    gloss: Bună (salut) · Ce mai faceți? (comment allez-vous ?) · Bine, mulțumesc (bien, merci)
    note: Tout vient de la salutation d’ouverture de l’unité 1, réutilisée ici pour commencer le dialogue de cette unité.
  ro.a1.unit19.lesson03.teach.reminder_sambata_la_revedere:
    title: 'Rappel : Sâmbătă, La revedere'
    gloss: Sâmbătă (samedi) · La revedere (au revoir)
    note: '*Sâmbătă* vient des unités 3, 11 et 12 ; *la revedere* vient de l’unité 1. Les deux sont réutilisés pour le dialogue sur le programme du week-end.'
  ro.a1.unit19.lesson03.teach.line01:
    title: Saluer Mihai et lui demander comment il va
    gloss: Ana salue Mihai et lui demande comment il va.
    note: Réutilise la salutation *Ce mai faceți?* de l’unité 1.
  ro.a1.unit19.lesson03.teach.line02:
    title: Répondre et demander le temps qu’il fera demain
    gloss: Mihai répond, puis demande à Ana quel temps il fera demain.
    note: Combine *Bine, mulțumesc* de l’unité 1 avec l’expression *Cum este vremea?* de la leçon 1 de cette unité, en ajoutant *mâine*.
  ro.a1.unit19.lesson03.teach.line03:
    title: Décrire la météo de demain
    gloss: Ana lui dit qu’il pleuvra, et qu’il y aura du vent et qu’il fera froid.
    note: Reprend exactement l’expression de la leçon 2 de cette unité.
  ro.a1.unit19.lesson03.teach.line04:
    title: Proposer de renoncer au parc et d’y aller samedi
    gloss: Mihai dit qu’ils n’iront pas au parc demain, et propose samedi à la place.
    note: Combine l’expression de la leçon 2 de cette unité avec *mergem* de l’unité 11 et *sâmbătă* de cette unité.
  ro.a1.unit19.lesson03.teach.line05:
    title: Accepter en notant qu’il y aura du soleil samedi
    gloss: Ana dit que samedi il y aura du soleil, et accepte le projet.
    note: Combine *soare* avec l’expression d’accord *Da, bine!* de l’unité 11.
  ro.a1.unit19.lesson03.teach.line06:
    title: Dire au revoir
    gloss: Mihai dit au revoir.
    note: La même formule de clôture qui termine le dialogue de chaque unité précédente.
  ro.a1.unit19.lesson03.teach.line07:
    title: Dire au revoir
    gloss: Ana dit au revoir.
    note: La même formule de clôture qui termine le dialogue de chaque unité précédente.
