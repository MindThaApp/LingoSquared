answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (casă, apartament, cameră, dormitor, bucătărie, baie, fereastră) is used only in person-invariant third-person statements ("Ana are...", "Mihai are...", "Unde este baia?", "Casa mea este mare"). No new tu/dumneavoastră form is introduced this unit; Ana and Mihai keep their existing formal register with each other in the dialogue's greeting lines.
course:
  title: Roumain A1
  description: 'Décrire un logement simple en roumain : Casă (maison), Apartament (appartement), Cameră (pièce), Dormitor (chambre), Bucătărie (cuisine), Baie (salle de bain) et Fereastră (fenêtre). Mihai rend visite à Ana chez elle et ils parlent de l’endroit où chacun habite.'
units:
  ro.a1.unit18.housing:
    title: Le logement
lessons:
  ro.a1.unit18.lesson01.casa_anei:
    title: La maison d’Ana
  ro.a1.unit18.lesson02.apartamentul_lui_mihai:
    title: L’appartement de Mihai
  ro.a1.unit18.lesson03.vizita_la_ana:
    title: La visite chez Ana
teaching:
  ro.a1.unit18.lesson01.teach.reminder_ana_mare:
    title: 'Rappel : Ana, mare'
    gloss: Ana (prénom) · mare (grand, grande)
    note: Ana est le prénom du personnage, présent depuis l’unité 1 ; *mare* vient des unités 5 et 14. Cette unité réutilise les deux pour décrire sa maison.
  ro.a1.unit18.lesson01.teach.reminder_articole_trei:
    title: 'Rappel : un, o, și, trei'
    gloss: un/o (un, une) · și (et) · trei (trois)
    note: '*Un*, *o* et *și* viennent de l’unité 5 ; *trei* vient du comptage de l’unité 2. Cette unité réutilise ces quatre mots pour compter et décrire les pièces.'
  ro.a1.unit18.lesson01.teach.are_vocab:
    title: A (verbe avoir)
    gloss: Are (il/elle a)
    note: 'Une nouvelle forme de *a avea* (avoir) : tu connais déjà *am* (j’ai, unités 2 et 5) et *aveți* (vous avez). *Are* est la forme de la troisième personne du même verbe ; elle sert à dire ce que quelqu’un ou quelque chose a.'
  ro.a1.unit18.lesson01.teach.casa_vocab:
    title: Maison
    gloss: Casă (maison)
    note: Le lieu où quelqu’un habite.
    example_gloss:
    - Ana a une grande maison.
  ro.a1.unit18.lesson01.teach.camera_vocab:
    title: Pièce
    gloss: Cameră (pièce)
    note: Mot général pour désigner une pièce d’un logement.
    example_gloss:
    - Ana a une grande pièce.
  ro.a1.unit18.lesson01.teach.camere_plural:
    title: Cameră → camere
    gloss: cameră (pièce) · camere (pièces)
    note: Le pluriel de *cameră* est *camere* ; on l’emploie quand il y a plus d’une pièce.
  ro.a1.unit18.lesson01.teach.dormitor_vocab:
    title: Chambre
    gloss: Dormitor (chambre)
    note: La pièce où l’on dort.
    example_gloss:
    - Ana a une chambre.
  ro.a1.unit18.lesson01.teach.bucatarie_vocab:
    title: Cuisine
    gloss: Bucătărie (cuisine)
    note: La pièce où l’on cuisine.
    example_gloss:
    - Ana a une cuisine.
  ro.a1.unit18.lesson01.teach.baie_vocab:
    title: Salle de bain
    gloss: Baie (salle de bain)
    note: La pièce avec la baignoire ou la douche et les toilettes.
    example_gloss:
    - Ana a une salle de bain.
  ro.a1.unit18.lesson01.teach.casa_mare_phrase:
    title: 'Ana a une grande maison. Elle a trois pièces : une chambre, une cuisine et une salle de bain.'
    gloss: 'Ana are o casă mare. Casa are trei camere: un dormitor, o bucătărie și o baie.'
    note: 'Tous les mots ont déjà été vus ou viennent d’être introduits, et forment deux nouvelles phrases sur la maison d’Ana. *Casa* est la forme définie de *casă* (« la maison ») : un nom féminin en -ă remplace ce -ă par -a, comme *banca* (la banque) dans l’unité 8.'
  ro.a1.unit18.lesson02.teach.reminder_mihai_mic:
    title: 'Rappel : Mihai, mic'
    gloss: Mihai (prénom) · mic (petit)
    note: Mihai est le prénom du personnage, présent depuis l’unité 1 ; *mic* vient de l’unité 14. Cette unité réutilise les deux pour décrire son appartement.
  ro.a1.unit18.lesson02.teach.reminder_unde_este_doua:
    title: 'Rappel : unde, este, două'
    gloss: unde (où) · este (est) · două (deux, féminin)
    note: '*Unde* et *este* viennent des unités 8 et 9 ; *două* est la forme féminine de « deux » vue à l’unité 2. Cette unité réutilise les trois mots pour demander où sont les pièces et les compter.'
  ro.a1.unit18.lesson02.teach.apartament_vocab:
    title: Appartement
    gloss: Apartament (appartement)
    note: Le logement de Mihai, plus petit que la maison d’Ana.
    example_gloss:
    - Mihai a un petit appartement.
  ro.a1.unit18.lesson02.teach.fereastra_vocab:
    title: Fenêtre
    gloss: Fereastră (fenêtre)
    note: '*Apartamentul* est la forme définie de *apartament* (« l’appartement ») : un nom neutre terminé par une consonne prend -ul, comme *magazinul* (le magasin) dans l’unité 8 (le féminin *casă*, lui, devient *casa*).'
    example_gloss:
    - L’appartement a une grande fenêtre.
  ro.a1.unit18.lesson02.teach.apartament_mic_phrase:
    title: 'Mihai a un petit appartement. Il a deux pièces : une chambre et une cuisine.'
    gloss: 'Mihai are un apartament mic. Apartamentul are două camere: un dormitor și o bucătărie.'
    note: Tous les mots ont déjà été vus ou viennent d’être introduits, et forment deux nouvelles phrases sur l’appartement de Mihai.
  ro.a1.unit18.lesson02.teach.unde_este_baia_phrase:
    title: Où est la salle de bain ?
    gloss: Unde este baia? (Où est la salle de bain ?)
    note: '*Baia* est la forme définie de *baie* (« la salle de bain »). Une question bien utile quand on est invité chez quelqu’un.'
  ro.a1.unit18.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'Rappel : Bună, Ce mai faceți ?, Bine, mulțumesc'
    gloss: Bună (bonjour) · Ce mai faceți? (comment allez-vous ?) · Bine, mulțumesc (bien, merci)
    note: Tout vient de la salutation d’ouverture de l’unité 1, reprise ici pour commencer le dialogue de cette unité.
  ro.a1.unit18.lesson03.teach.reminder_la_revedere_mea_aproape_am:
    title: 'Rappel : La revedere, Mea, Aproape, Am'
    gloss: La revedere (au revoir) · Mea (ma, féminin) · Aproape (près, tout près) · Am (j’ai)
    note: '*La revedere* vient de l’unité 1 ; *mea* de *Mama mea* (unité 5) ; *aproape* des réponses à *Unde este...?* des unités 8 et 9 ; *am* des unités 2 et 5. Tout est réutilisé ici dans le dialogue de la visite.'
  ro.a1.unit18.lesson03.teach.line01:
    title: Saluer Ana et demander de ses nouvelles
    gloss: Mihai salue Ana et lui demande comment elle va.
    note: Reprend la salutation *Ce mai faceți?* de l’unité 1.
  ro.a1.unit18.lesson03.teach.line02:
    title: Répondre et décrire sa maison
    gloss: Ana répond, puis dit à Mihai que sa maison est grande et a trois pièces.
    note: Associe *Bine, mulțumesc* de l’unité 1 et la phrase de la première leçon de cette unité.
  ro.a1.unit18.lesson03.teach.line03:
    title: Demander où est la salle de bain
    gloss: Mihai demande à Ana où est la salle de bain.
    note: Reprend presque telle quelle la phrase de la deuxième leçon de cette unité.
  ro.a1.unit18.lesson03.teach.line04:
    title: Répondre où est la salle de bain
    gloss: Ana lui dit qu’elle est tout près.
    note: Associe *baia* et *aproape*, le même schéma de réponse à « où est... ? » déjà vu aux unités 8 et 9.
  ro.a1.unit18.lesson03.teach.line05:
    title: Décrire son propre appartement et dire au revoir
    gloss: Mihai dit qu’il a un petit appartement de deux pièces, puis dit au revoir.
    note: Associe la phrase de la deuxième leçon de cette unité et la formule de clôture de l’unité 1.
  ro.a1.unit18.lesson03.teach.line06:
    title: Dire au revoir
    gloss: Ana dit au revoir.
    note: La même formule de clôture qui termine le dialogue de chaque unité précédente.
