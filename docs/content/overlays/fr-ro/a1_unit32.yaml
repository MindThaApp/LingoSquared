answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț, with comma-below ș/ț). Typed answers are checked with their diacritics: a spelling without them, or with the older cedilla letters ş/ţ, is accepted only where an exercise lists it explicitly.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the exclamation mark on greetings/farewells. Spoken answers are assessed for intelligibility and appropriate register, not written punctuation.
  register: tu and dumneavoastră are never interchangeable answers for each other's exercises -- a dumneavoastră-register prompt must not accept a tu-conjugated reply and vice versa, the same discipline applied to French tu/vous and Spanish tú/usted elsewhere in this app.
course:
  title: Roumain A1
  description: 'Roumain pour débutants : parler des animaux de compagnie et des animaux courants. Les nommer, les soins de base (promener, nourrir, jouer), dire quels animaux tu aimes même sans en avoir, et le pluriel régulier en roumain.'
units:
  ro.a1.unit32.animale:
    title: Les animaux et les animaux de compagnie
lessons:
  ro.a1.unit32.lesson01.caine_pisica_peste_si:
    title: Le chien, le chat, le poisson et l’oiseau
  ro.a1.unit32.lesson02.ingrijirea_unui_animal_de:
    title: S’occuper d’un animal de compagnie
  ro.a1.unit32.lesson03.a_iubi_animalele:
    title: Adorer les animaux
  ro.a1.unit32.lesson04.mihai_o_intreaba_pe:
    title: Mihai interroge Ana sur son chien
  ro.a1.unit32.lesson05.mihai_elena_si_andrei:
    title: Mihai, Elena et Andrei parlent des animaux
  ro.a1.unit32.lesson06.nina_si_pasarea_ei:
    title: L’oiseau de Nina
teaching:
  ro.a1.unit32.lesson01.teach.animalul_un_animal:
    title: Un animal, un animal de compagnie
    gloss: l’animal / un animal de compagnie
    note: '*Animal* est le mot général ; *animal de companie* (« animal de compagnie ») désigne précisément un animal domestique. Le pluriel est *animale* (*un animal*, *două animale*).'
    example_gloss:
    - Un chien est un animal.
    - Un chien est aussi un animal de compagnie.
  ro.a1.unit32.lesson01.teach.cainele_pisica:
    title: Le chien et le chat
    gloss: le chien / le chat
    example_gloss:
    - Ana a un chien.
    - Andrei a un chat.
  ro.a1.unit32.lesson01.teach.pestele_pasarea:
    title: Le poisson et l’oiseau
    gloss: le poisson / l’oiseau
    example_gloss:
    - Grand-père a un poisson.
    - Nina a un oiseau.
  ro.a1.unit32.lesson01.teach.ai_un_animal:
    title: As-tu un animal de compagnie ?
    gloss: As-tu un animal de compagnie ?
    note: 'C’est la même structure de question *Ai ...?* que tu connais déjà : *a avea* (avoir) + un nom.'
  ro.a1.unit32.lesson01.teach.da_am_un:
    title: Oui, j’ai un chien
    gloss: Oui, j’ai un chien.
    note: Une réponse affirmative simple qui utilise le nouveau vocabulaire de cette unité.
  ro.a1.unit32.lesson01.teach.nu_nu_am:
    title: Non, je n’ai pas d’animal de compagnie
    gloss: Non, je n’ai pas d’animal de compagnie.
    note: Après *nu am*, *niciun* (« pas un seul ») renforce la négation du nom ; voir la note de grammaire.
  ro.a1.unit32.lesson01.teach.la_negatie_nu:
    title: 'Nu am : pas d’article'
    gloss: 'Après nu am, on n’emploie ni un ni o : Nu am timp, nu am niciun animal de companie.'
    note: 'C’est exactement le schéma déjà vu avec *Nu am timp* : pas de nouvelle règle, seulement un nouveau nom.'
  ro.a1.unit32.lesson02.teach.a_scoate_la:
    title: Promener un animal
    gloss: promener un animal
    note: '*A scoate la plimbare* est une expression figée ; voir la note de grammaire.'
    example_gloss: Je promène le chien tous les jours.
  ro.a1.unit32.lesson02.teach.verbul_se_schimba:
    title: Le verbe change selon la personne
    gloss: 'Le verbe change selon la personne : eu scot, tu scoți, el scoate (je promène, tu promènes, il promène) le chien.'
    note: 'Les verbes roumains changent de terminaison à chaque personne ; *a scoate la plimbare* se conjugue donc comme un seul verbe : *scot*, *scoți*, *scoate*.'
  ro.a1.unit32.lesson02.teach.a_da_de:
    title: Donner à manger
    gloss: donner à manger
    example_gloss: Je donne à manger au chat tous les jours.
  ro.a1.unit32.lesson02.teach.a_se_juca:
    title: Jouer avec
    gloss: jouer avec
    example_gloss: Andrei joue avec son chat.
  ro.a1.unit32.lesson02.teach.scot_cainele_la:
    title: Je promène le chien tous les jours
    gloss: Je promène le chien tous les jours.
    note: Associe *a scoate la plimbare* à *în fiecare zi* (tous les jours), déjà vu dans une unité précédente.
  ro.a1.unit32.lesson02.teach.dau_de_mancare:
    title: Je donne à manger au chat tous les jours
    gloss: Je donne à manger au chat tous les jours.
    note: 'Associe *a da de mâncare* à *în fiecare zi* ; l’animal se met au datif : *pisicii*.'
  ro.a1.unit32.lesson03.teach.plural_caine_caini:
    title: 'Plural: câine → câini'
    gloss: 'Pluriel : câine → câini, animal → animale, pisică → pisici.'
    note: Le schéma régulier du pluriel roumain, présenté ici pour la première fois avec des noms d’animaux comme exemples.
  ro.a1.unit32.lesson03.teach.caini_pisici:
    title: Les chiens et les chats
    gloss: chiens / chats
    example_gloss:
    - Mihai aime les chiens.
    - Elena aime les chats.
  ro.a1.unit32.lesson03.teach.pesti_pasari:
    title: Les poissons et les oiseaux
    gloss: poissons / oiseaux
    example_gloss:
    - J’adore les poissons.
    - Grand-père adore les oiseaux.
  ro.a1.unit32.lesson03.teach.iubesc_animalele:
    title: J’adore les animaux
    gloss: J’adore les animaux.
    note: '*A iubi* (« aimer ») prend son complément sans préposition : *Iubesc animalele* ; l’article *-le* indique qu’on parle des animaux en général.'
  ro.a1.unit32.lesson03.teach.elena_iubeste_pisicile:
    title: Elena aime les chats, mais n’a pas d’animal de compagnie
    gloss: Elena aime les chats, mais elle n’a pas d’animal de compagnie.
    note: Cette phrase souligne la différence entre adorer un animal et en avoir un.
  ro.a1.unit32.lesson04.teach.mihai_ai_un:
    title: Mihai pose une question sur les animaux de compagnie
    gloss: 'Mihai : Tu as un animal de compagnie, Ana ?'
  ro.a1.unit32.lesson04.teach.ana_da_am:
    title: Ana a un chien
    gloss: 'Ana : Oui, j’ai un chien.'
  ro.a1.unit32.lesson04.teach.mihai_cum_arata:
    title: Mihai demande à quoi il ressemble
    gloss: 'Mihai : Il est comment ?'
    note: Reprend la question *Cum arată ...?* de l’unité sur l’apparence, posée ici à propos d’un animal.
  ro.a1.unit32.lesson04.teach.ana_are_blana:
    title: Ana décrit son chien
    gloss: 'Ana : Il a le poil brun et il est petit.'
    note: On réutilise le vocabulaire de la couleur des cheveux et de la taille, étudié pour décrire l’apparence, mais cette fois pour parler du pelage d’un animal.
  ro.a1.unit32.lesson04.teach.pentru_un_animal:
    title: El et ea pour les animaux
    gloss: 'Pour un animal, on emploie el ou ea selon son genre : câinele est el, pisica est ea.'
    note: Jusqu’ici, *el* et *ea* désignaient des personnes dans ce cours ; ici ils s’appliquent aux animaux, selon le genre du nom.
  ro.a1.unit32.lesson04.teach.mihai_il_scoti:
    title: Mihai demande s’il le promène
    gloss: 'Mihai : Tu le promènes tous les jours ?'
  ro.a1.unit32.lesson04.teach.ana_da_il:
    title: Ana décrit sa routine
    gloss: 'Ana : Oui, je le promène tous les jours et je lui donne à manger.'
  ro.a1.unit32.lesson05.teach.mihai_si_elena:
    title: Mihai, Elena et Andrei parlent des animaux
    gloss: 'Mihai et Elena aiment tous les deux les animaux, mais aucun des deux n’a d’animal de compagnie. Mihai aime les chiens et Elena aime les chats. Andrei, lui, a un animal de compagnie : un chat. Il joue souvent avec son chat et lui donne à manger tous les jours. Et toi, as-tu un animal de compagnie ?'
    note: Ce texte met en contraste le fait d’adorer un animal et celui d’en avoir réellement un.
    glosses:
      iubesc: adorer
      amândoi: tous les deux
      animalele: animaux
      doi: tous les deux
      companie: animal de compagnie
      câinii: chiens
      pisicile: chats
      pisică: chat
      joacă: joue
      dă: donne
      fiecare: tous les
      mâncare: nourriture
  ro.a1.unit32.lesson05.teach.andrei_se_joaca:
    title: Andrei joue souvent avec son chat
    gloss: Andrei joue souvent avec son chat.
    note: '*Des* (souvent) reprend le mot de fréquence de l’unité sur les loisirs ; *a se juca cu* (« jouer avec ») est un verbe pronominal.'
  ro.a1.unit32.lesson05.teach.iubesc_cainii_nu:
    title: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    gloss: J’adore les chiens. Je n’ai pas d’animal de compagnie.
    note: Un modèle de réponse en deux phrases, prêt à être réutilisé pour l’exercice d’expression écrite de cette unité.
  ro.a1.unit32.lesson06.teach.ana_nina_ai:
    title: Ana interroge Nina
    gloss: 'Ana : Nina, toi aussi, tu as un animal de compagnie ?'
  ro.a1.unit32.lesson06.teach.nina_da_am:
    title: Nina a un oiseau qui s’appelle Pico
    gloss: 'Nina : Oui, j’ai un oiseau. Il s’appelle Pico.'
    note: '*O cheamă* (« s’appelle ») reprend le verbe *a chema* pour les noms ; un oiseau est ici féminin, donc le pronom est *o*.'
  ro.a1.unit32.lesson06.teach.mihai_ce_frumos:
    title: Mihai réagit
    gloss: 'Mihai : Comme c’est bien ! Qu’est-ce que tu fais avec lui tous les jours ?'
  ro.a1.unit32.lesson06.teach.nina_ii_dau:
    title: Nina le nourrit tous les jours
    gloss: 'Nina : Je le nourris tous les jours.'
  ro.a1.unit32.lesson06.teach.mihai_iubesc_si:
    title: Mihai aime aussi les oiseaux
    gloss: 'Mihai : Moi aussi, j’aime les oiseaux.'
  ro.a1.unit32.lesson06.teach.ana_ce_frumos:
    title: Ana conclut la conversation
    gloss: 'Ana : Comme c’est bien que nous trois, nous aimions les animaux !'
    note: Cette phrase réunit ce que les trois personnages ont dit sur les animaux dans cette unité.
