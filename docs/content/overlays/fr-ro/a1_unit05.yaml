answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the question mark/exclamation mark.
  register: This unit's new "Ai frați?"/"Aveți frați?" and "Câți copii ai?"/"Câți copii aveți?" pairs are register-sensitive (tu vs. dumneavoastră, parallel to unit02's ai/aveți age questions) -- accept either register unless an exercise explicitly names one. Ana and Mihai's closing dialogue keeps the dumneavoastră register unit01 already established between them.
course:
  title: Roumain A1
  description: 'Parler de la famille en roumain : parents, frères et sœurs, enfants et situation familiale, avec le couple de possessifs meu/mea et la même opposition de questions tu/dumneavoastră que dans les questions sur l’âge de l’unité 2. Ana et Mihai continuent de faire connaissance avec leurs familles.'
units:
  ro.a1.unit05.family:
    title: La famille
lessons:
  ro.a1.unit05.lesson01.familia_mea:
    title: Ma famille
  ro.a1.unit05.lesson02.frati_si_copii:
    title: Frères, sœurs et enfants
  ro.a1.unit05.lesson03.o_discutie_despre_familie:
    title: Une conversation sur la famille
teaching:
  ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare:
    title: 'Rappel : am, un, o, și, mare'
    gloss: am (j’ai) · un/o (un, une) · și (et) · mare (grand)
    note: Ces cinq mots sont déjà apparus dans les unités précédentes (*și* dans l’unité 1, *am* et *o* dans l’unité 2, *mare* dans la note sur la majuscule de l’unité 3, *un* dans l’unité 4) ; ils reviennent ici pour parler de la famille.
  ro.a1.unit05.lesson01.teach.familie:
    title: La famille
    gloss: familie (famille)
    note: 'Nom féminin : il se combine avec *o* et un adjectif comme *mare* pour dire « une grande famille ».'
    example_gloss: J’ai une grande famille.
  ro.a1.unit05.lesson01.teach.mama:
    title: Mère
    gloss: mamă (mère)
    note: Le mot de base pour « mère » ; plus loin dans les cartes, tu verras comment dire « ma mère ».
    example_gloss: Mihai a une mère et un père.
  ro.a1.unit05.lesson01.teach.tata:
    title: Père
    gloss: tată (père)
    note: Le mot de base pour « père ».
    example_gloss: Mon père est professeur.
  ro.a1.unit05.lesson01.teach.parintii:
    title: Parents
    gloss: părinți (parents)
    note: Désigne les deux parents ensemble, comme le mot français « parents ».
    example_gloss: Mes parents habitent en Roumanie.
  ro.a1.unit05.lesson01.teach.meu_mea:
    title: 'Mon, ma : meu ou mea'
    gloss: meu (mon, masculin) / mea (ma, féminin)
    note: 'Comme en français, le possessif roumain s’accorde avec le genre de la chose possédée, et non avec celui du possesseur : *meu* avec un nom masculin comme *tată*, *mea* avec un nom féminin comme *mamă*.'
  ro.a1.unit05.lesson01.teach.mama_mea:
    title: Ma mère
    gloss: ma mère
    note: Mamă devient mama (elle reçoit l’article défini) avant que mea s’y ajoute ; c’est cette forme combinée qui sert à dire « ma mère », et non une traduction mot à mot.
  ro.a1.unit05.lesson01.teach.tatal_meu:
    title: Mon père
    gloss: mon père
    note: Tată devient tatăl (il reçoit l’article défini, de façon irrégulière avec -l, car tată se termine déjà par -ă) avant que meu s’y ajoute.
  ro.a1.unit05.lesson01.teach.mama_si_tatal:
    title: Ma mère et mon père
    gloss: Ma mère et mon père.
    note: Réunit les deux possessifs dans une même phrase, chacun avec son propre accord en genre.
  ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu:
    title: 'Rappel : câți, ai, aveți, doi, nu'
    gloss: câți (combien) · ai/aveți (tu as / vous avez) · doi (deux) · nu (non / ne… pas)
    note: '*Câți*, *ai* et *aveți* sont apparus pour la première fois dans l’unité 2 pour demander l’âge (« Câți ani ai? ») ; ici, ils servent à poser des questions sur les frères, sœurs et enfants. *Doi* vient des nombres de l’unité 2, *nu* de l’unité 3.'
  ro.a1.unit05.lesson02.teach.da:
    title: Oui
    gloss: da (oui)
    note: Le mot courant pour « oui », qui s’oppose à *nu* (« non ») de l’unité 3.
    example_gloss: Oui, j’ai un frère.
  ro.a1.unit05.lesson02.teach.frate_sora:
    title: Frère, sœur
    gloss: frate (frère) / soră (sœur)
    note: Noms masculin et féminin pour les frères et sœurs ; ils se combinent avec un/o comme n’importe quel autre nom.
    example_gloss:
    - J’ai un frère.
    - J’ai une sœur.
  ro.a1.unit05.lesson02.teach.frati_surori:
    title: Frères, sœurs
    gloss: frați (frères) / surori (sœurs)
    note: 'Formes du pluriel, utilisées pour DEMANDER en général s’il y a des frères et sœurs : on demande couramment « Ai frați? » (« Tu as des frères ? ») pour dire « Tu as des frères et sœurs ? », souvent suivi de « Surori? » pour vérifier spécifiquement s’il y a des sœurs, comme dans la question en deux temps du texte d’origine.'
    example_gloss: Tu as des frères ou des sœurs ?
  ro.a1.unit05.lesson02.teach.ai_frati:
    title: Tu as des frères et sœurs ? (informel)
    gloss: Tu as des frères ?
    note: La façon courante et familière de demander ; elle va avec le registre *tu* de l’unité 1.
  ro.a1.unit05.lesson02.teach.aveti_frati:
    title: Vous avez des frères et sœurs ? (formel)
    gloss: Tu as des frères ?
    note: La version polie, avec le même *aveți* que dans la question sur l’âge de l’unité 2.
  ro.a1.unit05.lesson02.teach.copil_copii:
    title: Enfant, enfants
    gloss: copil (enfant) / copii (enfants)
    note: 'Copil a l’un des pluriels les plus délicats du roumain : copii, et non une terminaison régulière en -i ou -e ; mieux vaut le retenir comme une forme à part.'
    example_gloss: J’ai deux enfants.
  ro.a1.unit05.lesson02.teach.fiu_fiica:
    title: Fils, fille
    gloss: fiu (fils) / fiică (fille)
    note: Les mots précis pour « fils » et « fille », distincts du mot général copil/copii.
    example_gloss:
    - J’ai un fils.
    - J’ai une fille.
  ro.a1.unit05.lesson02.teach.cati_copii_ai:
    title: Combien d’enfants as-tu ?
    gloss: Combien d’enfants as-tu ?
    note: 'Câți (combien) + copii (enfants) + ai (tu as) : ces trois mots te sont déjà familiers.'
  ro.a1.unit05.lesson02.teach.casatorit:
    title: Marié
    gloss: căsătorit (marié)
    note: Une question personnelle courante dans les conversations de tous les jours, comme demander l’âge de quelqu’un.
    example_gloss: Tu es marié ?
  ro.a1.unit05.lesson03.teach.reminder_bine_la_revedere:
    title: 'Rappel : bine, la revedere, Ana, Mihai'
    gloss: bine (bien) · la revedere (au revoir) · Ana, Mihai (prénoms)
    note: Récapitule du vocabulaire déjà vu dans les unités précédentes et réutilisé dans le dialogue de cette leçon.
  ro.a1.unit05.lesson03.teach.line01:
    title: Poser une question sur les frères et sœurs
    gloss: Ana demande à Mihai s’il a des frères et sœurs.
    note: Utilise le *aveți* de politesse, conformément au registre qu’ils ont établi entre eux.
  ro.a1.unit05.lesson03.teach.line02:
    title: Réponse et question en retour
    gloss: Mihai dit qu’il a un frère et une sœur, et demande à Ana si elle a des enfants.
    note: Réutilise dans un seul échange le vocabulaire frate/soră et copii de cette unité.
  ro.a1.unit05.lesson03.teach.line03:
    title: Réponse et question renvoyée
    gloss: Ana dit qu’elle a une fille et pose la même question à Mihai.
    note: '*Și dumneavoastră?* (« Et vous ? ») reprend exactement le modèle de question en retour des présentations de l’unité 1.'
  ro.a1.unit05.lesson03.teach.line04:
    title: Réponse
    gloss: Mihai dit qu’il a un fils.
    note: Une réponse courte et directe, avec le mot fiu de cette unité.
  ro.a1.unit05.lesson03.teach.line05:
    title: Réagir et conclure
    gloss: Ana réagit positivement et dit au revoir.
    note: '*Bine!* est ici une courte réaction positive, le même mot que dans *Bine, mulțumesc.* de l’unité 1.'
  ro.a1.unit05.lesson03.teach.line06:
    title: Conclure la rencontre
    gloss: Mihai dit au revoir à son tour, en employant le prénom d’Ana.
    note: La même formule d’adieu amicale que celle qui concluait les dialogues des unités 1 et 4.
