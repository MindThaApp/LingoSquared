answer_policy:
  diacritics: 'Teach and display standard Romanian diacritics (ă, â, î, ș, ț), with comma-below ș/ț. Free-typed answers are graded against these standard spellings: the grader does not fold away omitted diacritics or convert legacy cedilla ş/ţ to ș/ț, so learners should type the full standard spelling.'
  capitalization_and_punctuation: Accept ordinary capitalization differences and omission of the comma/exclamation mark/question mark.
  register: This unit's own new vocabulary (mic/mică, mai, decât) is entirely person-invariant and carries no register distinction of its own. Ana and Mihai's dialogue keeps their existing polite register with each other, matching every earlier unit; no new second-person form is introduced here (unlike unit13's Vă place...?).
course:
  title: Roumain A1
  description: 'Comparer des choses familières en roumain : Mare (grand), Mic/Mică (petit) et la construction comparative Mai ... decât (plus ... que), pendant qu’Ana et Mihai comparent la taille de leur café, de leur thé et de leur pain.'
units:
  ro.a1.unit14.comparisons:
    title: Comparaisons
lessons:
  ro.a1.unit14.lesson01.mare_mic:
    title: Grand, petit
  ro.a1.unit14.lesson02.mai_mare_mai_mica:
    title: Plus grand, plus petit
  ro.a1.unit14.lesson03.cafeaua_mai_mare:
    title: Lequel est le plus grand ?
teaching:
  ro.a1.unit14.lesson01.teach.reminder_mare:
    title: 'Rappel : mare'
    gloss: mare (grand)
    note: Déjà vu dans l’unité 3 (« literă mare », majuscule) et l’unité 5 (« o familie mare », une grande famille) ; ici, il a enfin un partenaire de comparaison, *mic/mică*.
  ro.a1.unit14.lesson01.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Rappel : cafeaua, ceaiul, pâinea, cafea, ceai'
    gloss: cafeaua (le café) · ceaiul (le thé) · pâinea (le pain) · cafea (café) · ceai (thé)
    note: Tous ces mots viennent des unités 6 et 13 ; cette unité utilise les formes définies comme les choses dont on compare la taille, et réutilise les formes indéfinies dans l’exercice d’association de cette leçon.
  ro.a1.unit14.lesson01.teach.mic_mica_vocab:
    title: Petit
    gloss: Mic (petit, masc./neutre) · Mică (petite, fém.)
    note: 'En roumain, les adjectifs s’accordent avec le nom qu’ils décrivent : *ceai* (thé) prend la forme masculin/neutre *mic*, tandis que *cafea* (café) et *pâine* (pain) sont féminins et prennent *mică*. *Mare* (grand) a la même forme au masculin et au féminin singulier, c’est pourquoi il n’avait pas besoin de cette distinction.'
    example_gloss:
    - Le thé est petit.
    - Le café est petit.
  ro.a1.unit14.lesson01.teach.ceaiul_e_mic_phrase:
    title: Le thé est petit
    gloss: Ceaiul e mic. (Le thé est petit.)
    note: '*Ceaiul* est neutre, il prend donc la forme masculin/neutre *mic*.'
  ro.a1.unit14.lesson01.teach.cafeaua_e_mica_phrase:
    title: Le café est petit
    gloss: Cafeaua e mică. (Le café est petit.)
    note: '*Cafeaua* est féminin, il prend donc la forme féminine *mică*.'
  ro.a1.unit14.lesson01.teach.painea_e_mica_phrase:
    title: Le pain est petit
    gloss: Pâinea e mică. (Le pain est petit.)
    note: '*Pâinea* est aussi féminin, il prend donc *mică*, comme *cafeaua*.'
  ro.a1.unit14.lesson02.teach.reminder_mare_mic_mica:
    title: 'Rappel : Mare, Mic, Mică'
    gloss: Mare (grand) · Mic (petit, masc./neutre) · Mică (petite, fém.)
    note: Tous ces mots viennent de la leçon 1 de cette unité ; ici, ils reçoivent une forme comparative.
  ro.a1.unit14.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Rappel : cafeaua, ceaiul, pâinea'
    gloss: cafeaua (le café) · ceaiul (le thé) · pâinea (le pain)
    note: Tous ces mots viennent de l’unité 13 et sont réutilisés ici comme les choses que l’on compare.
  ro.a1.unit14.lesson02.teach.mai_vocab:
    title: Plus / -er
    gloss: Mai (plus / -er, comparatif)
    note: 'Ce n’est pas le mois *mai* (mai, unité 3). C’est le même petit mot que dans « Ce mai faceți? » (unité 1), mais ici il joue un autre rôle, celui de particule comparative : placé devant un adjectif, *mai* signifie « plus ___ », c’est la manière habituelle de former un comparatif en roumain.'
    example_gloss:
    - Le café est plus grand.
  ro.a1.unit14.lesson02.teach.mai_mare_phrase:
    title: Le café est plus grand
    gloss: Cafeaua e mai mare. (Le café est plus grand.)
    note: '*Mai* + l’adjectif : aucun autre changement n’est nécessaire.'
  ro.a1.unit14.lesson02.teach.decat_vocab:
    title: Que
    gloss: Decât (que)
    note: 'Complète la comparaison : *mai* + adjectif + *decât* + la deuxième chose comparée.'
    example_gloss:
    - Le café est plus grand que le thé.
  ro.a1.unit14.lesson02.teach.mai_mare_decat_phrase:
    title: Le café est plus grand que le thé
    gloss: Cafeaua e mai mare decât ceaiul. (Le café est plus grand que le thé.)
    note: 'Le schéma complet du comparatif : [chose] + e + mai + [adjectif] + decât + [deuxième chose].'
  ro.a1.unit14.lesson02.teach.mai_mica_decat_phrase:
    title: Le pain est plus petit que le café
    gloss: Pâinea e mai mică decât cafeaua. (Le pain est plus petit que le café.)
    note: Le même schéma avec *mică*, la forme féminine de « petit » vue dans la leçon 1 de cette unité.
  ro.a1.unit14.lesson03.teach.reminder_mai_decat_mare_mic_mica:
    title: 'Rappel : Mai, Decât, Mare, Mic, Mică'
    gloss: Mai (plus) · Decât (que) · Mare (grand) · Mic (petit, masc./neutre) · Mică (petite, fém.)
    note: 'Tous ces mots viennent des leçons 1 et 2 de cette unité : ici, Ana et Mihai les emploient ensemble.'
  ro.a1.unit14.lesson03.teach.reminder_cafeaua_ceaiul_painea:
    title: 'Rappel : cafeaua, ceaiul, pâinea'
    gloss: cafeaua (le café) · ceaiul (le thé) · pâinea (le pain)
    note: 'Tous ces mots viennent de l’unité 13 : ce sont les trois choses qu’Ana et Mihai comparent.'
  ro.a1.unit14.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'Rappel : bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (salut) · mulțumesc (merci) · la revedere (au revoir) · Ana, Mihai (prénoms)
    note: 'Tout cela a déjà été vu dans les unités précédentes : c’est la même façon amicale de commencer et de finir que dans tous les dialogues du cours.'
  ro.a1.unit14.lesson03.teach.line01:
    title: Saluer et poser une question sur la taille
    gloss: Mihai salue Ana et lui demande si le café est grand ou petit.
    note: Utilise *mare sau mică* (grand ou petit) pour ouvrir une question sur la taille, sur le même modèle « X sau Y ? » pour proposer un choix que *cafea sau ceai?* de l’unité 13.
  ro.a1.unit14.lesson03.teach.line02:
    title: Décrire la taille des deux boissons
    gloss: Ana dit que le café est grand et que le thé est petit.
    note: 'Elle énonce un simple fait sur la taille, pas une préférence : ce dialogue ne dit jamais qui aime ou commande quelle boisson, seulement la taille de chacune.'
  ro.a1.unit14.lesson03.teach.line03:
    title: Demander confirmation de la comparaison
    gloss: Mihai demande si le café est plus grand que le thé.
    note: Il transforme les deux faits d’Ana (réplique 2) en une comparaison directe avec *mai mare decât*, la construction centrale de cette unité.
  ro.a1.unit14.lesson03.teach.line04:
    title: Confirmer et ajouter le pain
    gloss: Ana confirme, puis dit que le pain est plus petit que le café.
    note: 'Réemploie *mai ... decât* avec le troisième élément, *pâinea*, cette fois avec le comparatif de « petit » : *mai mică*.'
  ro.a1.unit14.lesson03.teach.line05:
    title: Confirmer, remercier et dire au revoir
    gloss: Mihai confirme que le pain est petit, remercie Ana et lui dit au revoir.
    note: C’est la même façon de conclure que dans les dialogues de toutes les unités précédentes.
  ro.a1.unit14.lesson03.teach.line06:
    title: Terminer la conversation
    gloss: Ana dit au revoir à son tour, en utilisant le prénom de Mihai.
    note: C’est la même formule de conclusion amicale que dans les dialogues de toutes les unités précédentes.
