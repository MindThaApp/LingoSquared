    gloss: Ana va au travail en train tous les jours. Mihai y va d’habitude à vélo, mais quand il pleut, il prend aussi le train. Andrei préfère conduire sa voiture. Elena habite près du travail et y va à pied. Et toi, comment vas-tu au travail ?
