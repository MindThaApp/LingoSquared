  ro.a1.unit30.lesson06.planuim_impreuna_un_weekend:
    title: Organiser un week-end ensemble
teaching:
  ro.a1.unit30.lesson01.teach.a_citi_a:
    title: Lire, faire du sport, cuisiner
    gloss: lire, faire de l’exercice / du sport, cuisiner
    note: 'Trois verbes de loisirs courants : *a citi* (lire), *a face sport* (faire du sport) et *a găti* (cuisiner). Les verbes roumains au dictionnaire commencent par *a*.'
    example_gloss:
    - J’aime lire un livre.
    - Je fais du sport le samedi.
    - J’aime cuisiner pour des amis.
  ro.a1.unit30.lesson01.teach.timpul_liber:
    title: Le temps libre
    gloss: temps libre
    note: '*Timpul liber* (le temps libre) est formé du nom masculin *timp* avec l’article collé à la fin. C’est l’expression clé pour parler des loisirs.'
    example_gloss: Pendant mon temps libre, j’aime lire.
  ro.a1.unit30.lesson01.teach.in_timpul_liber:
    title: Dire ce que tu fais pendant ton temps libre
    gloss: Pendant mon temps libre, j’aime lire.
    note: '*Citesc* est la forme *eu* de *a citi* (lire) ; après *îmi place să*, le verbe garde la même forme.'
  ro.a1.unit30.lesson02.teach.a_asculta_muzica:
    title: Musique, dessin, jeux vidéo
    gloss: écouter de la musique, dessiner, jouer aux jeux vidéo
    note: 'Trois autres expressions de loisirs : *a asculta muzică* (écouter de la musique), *a desena* (dessiner) et *a juca jocuri video* (jouer aux jeux vidéo).'
    example_gloss:
    - J’aime écouter de la musique.
    - Je dessine souvent.
    - J’aime jouer aux jeux vidéo avec des amis.
  ro.a1.unit30.lesson02.teach.imi_place_sa:
    title: Dire que tu aimes écouter de la musique
    gloss: J’aime écouter de la musique.
    note: '*Îmi place să ascult muzică* : *îmi place* (« cela me plaît ») + *să* + un verbe est la façon habituelle de dire que l’on aime faire quelque chose.'
  ro.a1.unit30.lesson02.teach.imi_place_sa_2:
    title: Dire que tu aimes jouer aux jeux vidéo avec des amis
    gloss: J’aime jouer aux jeux vidéo avec des amis.
    note: '*Cu prietenii* signifie « avec les amis » : *cu* (« avec ») est la préposition, et *prietenii* est le pluriel défini.'
  ro.a1.unit30.lesson03.teach.mereu_des_uneori:
    title: Toujours, souvent, parfois, jamais
    gloss: toujours, souvent, parfois, jamais
    note: 'Les quatre adverbes de fréquence essentiels : *mereu*, *des*, *uneori* et *niciodată*. Ils suivent généralement le verbe : *Citesc des*.'
    example_gloss:
    - Je fais toujours du sport le samedi.
    - Je lis souvent un livre.
    - Je dessine parfois.
    - Je ne joue jamais aux jeux vidéo.
  ro.a1.unit30.lesson03.teach.in_fiecare_saptamana:
    title: Chaque semaine, chaque week-end
    gloss: chaque semaine, chaque week-end
    note: '*În fiecare săptămână* et *în fiecare weekend* signifient tous deux « chaque » ; *fiecare* ne change jamais, voir la fiche suivante.'
    example_gloss:
    - Je cuisine pour des amis chaque semaine.
    - Je fais du sport chaque week-end.
  ro.a1.unit30.lesson03.teach.cuvantul_fiecare_nu:
    title: Fiecare ne change jamais
    gloss: 'Le mot fiecare ne change pas : în fiecare săptămână (chaque semaine), în fiecare weekend (chaque week-end).'
    note: '*Fiecare* reste identique devant *săptămână* et *weekend*, quel que soit le nom : il n’y a donc rien à choisir.'
  ro.a1.unit30.lesson03.teach.ce_faci_in:
    title: Poser une question sur le temps libre
    gloss: Que fais-tu pendant ton temps libre ?
    note: 'C’est la question centrale de cette unité : réutilise-la pour interroger quelqu’un sur ses loisirs.'
  ro.a1.unit30.lesson04.teach.ana_ne_plimbam:
    title: Ana aborde les loisirs
    gloss: 'Ana : Nous nous promenons souvent ensemble. Mais toi, que fais-tu d’autre pendant ton temps libre, Mihai ?'
    note: '*Ne plimbăm* (« nous nous promenons ») est la forme *noi* du verbe réfléchi *a se plimba* ; elle renvoie aux promenades que les deux amis apprécient.'
  ro.a1.unit30.lesson04.teach.mihai_imi_place:
    title: Les loisirs de Mihai
    gloss: 'Mihai : J’aime cuisiner, aussi à la maison. Et je fais souvent du sport.'
    note: '*Și acasă* (aussi à la maison) précise que Mihai cuisine pour le plaisir, pas seulement dans son travail au restaurant.'
  ro.a1.unit30.lesson04.teach.ana_gatesti_si:
    title: Ana est surprise
    gloss: 'Ana : Tu cuisines aussi à la maison ? Tu cuisines déjà toute la journée au travail !'
    note: '*Toată ziua* (toute la journée) souligne combien Mihai cuisine déjà au travail ; *deja* signifie « déjà ».'
  ro.a1.unit30.lesson04.teach.mihai_da_dar:
    title: Mihai s’explique
    gloss: 'Mihai : Oui, mais je trouve que cuisiner est relaxant. Et toi, qu’est-ce que tu aimes faire ?'
    note: '*Gătitul mi se pare relaxant* signifie littéralement « cuisiner me semble relaxant » : *mi se pare* est une façon courante de donner son avis.'
  ro.a1.unit30.lesson04.teach.ana_imi_place:
    title: Les loisirs d’Ana
    gloss: 'Ana : J’aime lire et j’écoute souvent de la musique.'
    note: Cette phrase réunit deux verbes de loisirs des leçons 1 et 2, reliés par *și* (et).
  ro.a1.unit30.lesson04.teach.mihai_joci_si:
    title: Mihai interroge Ana sur les jeux vidéo
    gloss: 'Mihai : Et toi, tu joues aussi aux jeux vidéo ?'
    note: Une courte question fermée avec *jocuri video* de la leçon 2 ; *joci* est la forme *tu* de *a juca*.
  ro.a1.unit30.lesson04.teach.ana_nu_nu:
    title: Ana répond
    gloss: 'Ana : Non, je ne joue jamais aux jeux vidéo. Mais je dessine parfois !'
    note: '*Niciodată* (jamais) et *uneori* (parfois) de la leçon 3, opposés dans une même réponse ; *nu ... niciodată* est une double négation.'
  ro.a1.unit30.lesson05.teach.mihai_si_cu:
    title: Comparer des loisirs
    gloss: Mihai et moi, nous nous promenons souvent ensemble. Mais nous avons aussi d’autres passions. Mihai aime cuisiner, aussi à la maison, et il fait souvent du sport. Moi, j’aime lire et j’écoute souvent de la musique. Je dessine parfois, mais je ne joue jamais aux jeux vidéo. Et toi, qu’aimes-tu faire pendant ton temps libre ?
    note: Le message d’Ana reprend les informations de la leçon 4 et se termine par la question centrale de l’unité, posée au lecteur.
    glosses:
      plimbăm: se promener
      des: souvent
      împreună: ensemble
      alte: autre
      gătească: cuisine
      place: aime
      acasă: à la maison
      sport: fait du sport
      citesc: lire
      ascult: écouter
      muzică: musique
      desenez: dessiner
      uneori: parfois
      joc: jouer aux jeux vidéo
      niciodată: jamais
      liber: libre
      timpul: temps
  ro.a1.unit30.lesson06.teach.mihai_ce_faci:
    title: Mihai interroge Ana sur le week-end
    gloss: 'Mihai : Qu’est-ce que tu fais ce week-end ?'
    note: '*În acest weekend* (ce week-end) utilise *acest* pour « ce ».'
  ro.a1.unit30.lesson06.teach.ana_inca_nu:
    title: Ana est indécise
    gloss: 'Ana : Je ne sais pas encore. J’aime lire, mais je veux aussi sortir dehors.'
    note: '*Să ies afară* (sortir dehors) est une façon courante de dire que l’on veut quitter la maison ; *vreau să* + un verbe signifie « je veux ... ».'
  ro.a1.unit30.lesson06.teach.mihai_hai_sa:
    title: Mihai propose un programme
    gloss: 'Mihai : Et si on se promenait ensemble ? Ensuite, je cuisinerai pour nous.'
    note: '*După aceea* (ensuite) est une expression qui marque la suite des actions ; *Hai să* + un verbe propose de faire quelque chose ensemble.'
  ro.a1.unit30.lesson06.teach.ana_buna_idee:
    title: Ana est d’accord
    gloss: 'Ana : Bonne idée ! J’aime autant me promener que cuisiner.'
    note: '*Și ..., și ...* (« aussi bien ... que ... ») montre qu’Ana aime les deux activités de la même façon, sans préférer l’une à l’autre.'
  ro.a1.unit30.lesson06.teach.mihai_perfect_atunci:
    title: Mihai confirme
    gloss: 'Mihai : Parfait. Alors on se voit samedi !'
    note: Une phrase amicale pour conclure et confirmer le projet de *sâmbătă* (samedi) ; *ne vedem* signifie « on se voit ».
