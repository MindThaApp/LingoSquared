teaching:
  prs.a1.unit45.lesson01.teach.review_this_is_in:
    title: '복습: 이것, ~이다, ~에'
    gloss: 이것 / ~이다 / ~에
    note: این, است, در는 이 과정 내내 쓰이는 단어로, 호텔과 객실을 이야기할 때 복습하는 단어예요.
    target_text: این (이것) / است (~이다) / در (~에)
  prs.a1.unit45.lesson01.teach.hotel_word:
    title: 호텔
    gloss: 호텔
    note: هوتل은 호텔을 뜻하는 아프가니스탄 다리어 단어로, 와우(و)를 넣어 쓰며 이란 페르시아어의 هتل과 달라요.
    example_gloss: 여기는 호텔이에요.
  prs.a1.unit45.lesson01.teach.room_word:
    title: 방
    gloss: 방
    note: اتاق는 방을 뜻하는 일상적인 다리어 단어예요.
    example_gloss: 방은 호텔 안에 있어요.
  prs.a1.unit45.lesson01.teach.room_in_hotel_phrase:
    title: 방은 호텔 안에 있어요
    gloss: 방은 호텔 안에 있어요.
    note: اتاق در هوتل است는 이번 과에서 앞서 배운 단어들을 합친 문장이에요.
  prs.a1.unit45.lesson01.teach.key_word:
    title: 열쇠
    gloss: 열쇠
    note: کلید는 열쇠를 뜻하는 표준 다리어 단어예요.
    example_gloss: 이것은 열쇠예요.
  prs.a1.unit45.lesson01.teach.room_key_phrase:
    title: 방 열쇠
    gloss: 방 열쇠
    note: کلید اتاق는 کلید(열쇠)와 اتاق(방)를 합친 말이에요.
  prs.a1.unit45.lesson01.teach.this_is_room_key_phrase:
    title: 이것은 방 열쇠예요
    gloss: 이것은 방 열쇠예요.
    note: این کلید اتاق است는 이번 과에서 앞서 배운 단어들을 합친 문장이에요.
  prs.a1.unit45.lesson02.teach.review_have:
    title: '복습: 저는 가지고 있어요, 그것은 있어요'
    gloss: 가지고 있어요 / 있어요
    note: دارم과 دارد는 객실 시설을 물을 때 쓰는 복습 단어예요.
    target_text: دارم (저는 가지고 있어요) / دارد (그것은 있어요)
  prs.a1.unit45.lesson02.teach.bathroom_word:
    title: 화장실
    gloss: 욕실
    note: تشناب는 화장실을 뜻하는 일상적인 다리어 단어예요.
    example_gloss: 방에 화장실이 있어요.
  prs.a1.unit45.lesson02.teach.room_has_bathroom_question_phrase:
    title: 방에 화장실이 있나요?
    gloss: 방에 화장실이 있나요?
    note: اتاق تشناب دارد؟는 별도의 의문사 없이 끝을 올려 말해서 만드는 예/아니요 질문이에요.
  prs.a1.unit45.lesson02.teach.yes_has_bathroom_phrase:
    title: 네, 화장실이 있어요
    gloss: 네, 화장실이 있어요.
    note: بلی는 '네'를 뜻하는 복습 단어예요.
  prs.a1.unit45.lesson02.teach.reservation_word:
    title: 예약
    gloss: 예약
    note: رزرو는 예약을 뜻하는 널리 쓰이는 외래어예요.
    example_gloss: 예약했어요.
  prs.a1.unit45.lesson02.teach.have_reservation_phrase:
    title: 예약했어요
    gloss: 예약했어요.
    note: رزرو دارم은 رزرو(예약)와 دارم(저는 가지고 있어요)을 합친 말이에요.
  prs.a1.unit45.lesson03.teach.review_which_number_for:
    title: '복습: 몇/몇 번, ~을 위해, 저는 원해요'
    gloss: 몇 / 몇 번 / ~을 위해 / 저는 원해요
    note: چند, برای, می‌خواهم은 객실에 대해 물을 때 쓰는 복습 단어예요.
    target_text: چند (몇 / 몇 번) / برای (~을 위해) / می‌خواهم (저는 원해요)
  prs.a1.unit45.lesson03.teach.number_word:
    title: 숫자
    gloss: 번호
    note: نمبر는 번호를 뜻하는 아프가니스탄 다리어의 일상적인 외래어로, 객실 번호나 전화번호 등에 써요.
    example_gloss: 객실 번호
  prs.a1.unit45.lesson03.teach.what_is_room_number_phrase:
    title: 방 번호가 몇 번이에요?
    gloss: 방 번호가 몇 번이에요?
    note: نمبر اتاق چند است؟는 چند를 써서 방 번호를 묻는 문장이에요.
  prs.a1.unit45.lesson03.teach.review_night_numbers:
    title: '복습: 밤, 둘, 셋'
    gloss: 밤 / 둘 / 셋
    note: شب, دو, سه는 숙박 기간을 말할 때 쓰는 복습 단어예요.
    target_text: شب (밤) / دو (둘) / سه (셋)
  prs.a1.unit45.lesson03.teach.stay_word:
    title: 저는 머물러요
    gloss: 저는 머물러요
    note: می‌مانم은 '머물다, 남다'를 뜻하는 ماندن에서 온 말이에요.
    example_gloss: 이틀 묵을 거예요.
  prs.a1.unit45.lesson03.teach.stay_two_nights_phrase:
    title: 이틀 묵을 거예요
    gloss: 이틀 묵을 거예요.
    note: دو شب می‌مانم은 دو شب(이틀 밤)과 می‌مانم(저는 머물러요)을 합친 말이에요.
  prs.a1.unit45.lesson03.teach.for_two_nights_phrase:
    title: 이틀 밤으로 원해요
    gloss: 이틀 밤으로 원해요.
    note: برای دو شب می‌خواهم은 برای(~을 위해)를 복습 단어 می‌خواهم과 함께 쓴 문장이에요.
  prs.a1.unit45.lesson03.teach.review_stay_formal:
    title: '복습: 머물러요 (존칭)'
    gloss: 머물러요 (존칭)
    note: می‌مانین은 می‌مانم의 존칭 복수형으로, 이 과정의 می‌خواهین/کنین처럼 같은 -ین 계열이에요.
    target_text: می‌مانین (머물러요, 존칭)
  prs.a1.unit45.lesson03.teach.how_many_nights_formal_phrase:
    title: 몇 박 머무세요?
    gloss: 며칠 밤 묵으세요?
    note: چند شب می‌مانین؟는 호텔 직원이 묻는 격식 있는 표현이에요.
  prs.a1.unit45.lesson04.teach.review_welcome_name_am:
    title: '복습: 환영해요, 이름이 뭐예요?, 저는 ~예요'
    gloss: 환영해요 / 이름이 뭐예요? / 저는 ~예요
    note: خوش آمدین, نام‌تان چیست؟, استم은 체크인할 때 쓰는 복습 표현이에요.
    target_text: خوش آمدین (어서 오세요) / نام‌تان چیست؟ (성함이 어떻게 되세요?) / استم (저는 ~예요)
  prs.a1.unit45.lesson04.teach.review_also_how_about_please_thanks:
    title: '복습: ~도, ~는요?, 여기 있어요, 정말 감사해요'
    gloss: ~도 / ~는요? / 여기 있어요 / 정말 감사해요
    note: هم, چطور, بفرمایین, تشکر زیاد는 앞 단원에서 배운 표현으로, 대화를 마무리할 때 쓰는 복습 표현이에요.
    target_text: هم (~도) / چطور (~는 어때요) / بفرمایین (여기 있어요) / تشکر زیاد (정말 감사해요)
  prs.a1.unit45.lesson04.teach.breakfast_phrase:
    title: 아침 식사
    gloss: 아침 식사
    note: چای صبح는 글자 그대로 '아침 차'라는 뜻이며, 아프가니스탄 다리어에서 아침 식사를 가리키는 일상적인 표현이에요. چای(차, 8단원)와 صبح(아침, 16단원)로 이루어져 있어요.
  prs.a1.unit45.lesson04.teach.included_word:
    title: 포함된
    gloss: 포함된
    note: شامل은 '포함된'이라는 뜻으로, 객실에 어떤 서비스가 포함되어 있다고 말할 때 써요.
    example_gloss: 아침 식사가 포함되어 있어요.
  prs.a1.unit45.lesson04.teach.wifi_word:
    title: 와이파이
    gloss: 와이파이
    note: وای‌فای는 와이파이를 뜻하는 표준 외래어예요.
    example_gloss: 와이파이도 있어요.
  prs.a1.unit45.lesson04.teach.dialogue_line1:
    title: '호마윤: 안녕하세요. 예약했어요. 이틀 묵을 거예요.'
    gloss: 안녕하세요. 예약했어요. 이틀 묵을 거예요.
  prs.a1.unit45.lesson04.teach.dialogue_line2:
    title: '호텔 직원: 환영합니다. 성함이 어떻게 되세요?'
    gloss: 환영합니다. 성함이 어떻게 되세요?
  prs.a1.unit45.lesson04.teach.dialogue_line3:
    title: '호마윤: 저는 호마윤이에요.'
    gloss: 저는 호마윤이에요.
  prs.a1.unit45.lesson04.teach.dialogue_line4:
    title: '호텔 직원: 좋아요. 객실에 화장실이 있고 아침 식사가 포함되어 있어요.'
    gloss: 좋아요. 객실에 화장실이 있고 아침 식사가 포함되어 있어요.
  prs.a1.unit45.lesson04.teach.dialogue_line5:
    title: '호마윤: 와이파이는요?'
    gloss: 와이파이는요?
  prs.a1.unit45.lesson04.teach.dialogue_line6:
    title: '호텔 직원: 네, 와이파이도 있어요. 열쇠 여기 있어요.'
    gloss: 네, 와이파이도 있어요. 열쇠 여기 있어요.
  prs.a1.unit45.lesson05.teach.review_reading_words:
    title: '복습: 예약, 번호, 오(5), 월요일, 화요일, 그리고'
    gloss: 예약 / 번호 / 오(5) / 월요일 / 화요일 / 그리고
    note: رزرو, نمبر(이번 단원), پنج, دوشنبه, سه‌شنبه, و는 읽기 지문에 나오는 복습 단어예요.
    target_text: رزرو (예약) / نمبر (번호) / پنج (다섯) / دوشنبه (월요일) / سه‌شنبه (화요일) / و (그리고)
  prs.a1.unit45.lesson05.teach.review_stays_third_person:
    title: '복습: 그/그녀가 머물러요'
    gloss: 그/그녀가 머물러요
    note: می‌ماند는 이번 단원에서 배운 می‌مانم/می‌مانین 계열의 3인칭 형태예요.
    target_text: می‌ماند (그/그녀는 머물러요)
  prs.a1.unit45.lesson05.teach.reading_passage:
    title: 호마윤의 예약에 관한 읽기
    gloss: 이것은 호마윤의 예약이에요. 객실은 5번이에요. 호마윤은 월요일과 화요일, 이틀 밤을 묵어요. 객실에 화장실이 있고 아침 식사가 포함되어 있어요.
  prs.a1.unit45.lesson06.teach.review_but_formal_you_hour_time_numbers:
    title: '복습: 하지만, 당신(존칭), 시간(시각), 시간(때), 칠(7), 십이(12)'
    gloss: 하지만 / 당신(존칭) / 시(시각) / 시간(때) / 칠(7) / 십이(12)
    note: اما, شما, ساعت, وقت(앞 단원), 그리고 هفت/دوازده는 일정을 말할 때 쓰는 복습 단어예요.
    target_text: اما (하지만) / شما (당신, 존칭) / ساعت (시) / وقت (시간) / هفت (일곱) / دوازده (열둘)
  prs.a1.unit45.lesson06.teach.checkout_word:
    title: 체크아웃 / 나가기
    gloss: 체크아웃 / 나가기
    note: خروج는 وقت خروج처럼 체크아웃 시간을 말할 때 써요.
    example_gloss: 체크아웃 시간
  prs.a1.unit45.lesson06.teach.checkout_time_phrase:
    title: 체크아웃 시간은 12시예요
    gloss: 체크아웃 시간은 12시예요.
    note: وقت خروج ساعت دوازده است는 체크아웃 시간을 말하는 문장이에요.
  prs.a1.unit45.lesson06.teach.contrast_breakfast_checkout_phrase:
    title: 아침 식사는 7시이지만 체크아웃은 12시예요
    gloss: 아침 식사는 7시이지만 체크아웃 시간은 12시예요.
    note: اما는 아침 식사 시간과 체크아웃 시간을 대비시켜요.
  prs.a1.unit45.lesson06.teach.checkout_time_question_phrase:
    title: 체크아웃 시간이 언제예요?
    gloss: 체크아웃 시간이 언제예요?
    note: 체크아웃 시간을 묻는 격식 있는 표현으로, شما가 들어가요.
  prs.a1.unit45.lesson04.teach.review_very_good_tea_morning_and:
    target_text: بسیار خوب (아주 좋아요) / چای (차) / صبح (아침) / و (그리고)
