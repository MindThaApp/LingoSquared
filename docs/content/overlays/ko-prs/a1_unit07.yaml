course:
  title: 한국어로 배우는 다리어 A1
  description: '아프가니스탄 다리어 초급: 전화 받기, 통화에서 자신을 밝히기, 다시 말해 달라고 하거나 천천히 말해 달라고 하기, 메시지 남기기, 기본 문자 메시지.'
units:
