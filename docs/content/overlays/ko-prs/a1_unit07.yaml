  prs.a1.unit07.lesson01.answering_the_phone:
    title: 전화 받기
  prs.a1.unit07.lesson02.identifying_yourself:
    title: 통화에서 자신을 밝히기
  prs.a1.unit07.lesson03.asking_to_repeat_or_slow_down:
    title: 다시 말해 달라고 하거나 천천히 말해 달라고 하기
  prs.a1.unit07.lesson04.leaving_a_message:
    title: 메시지 남기기
  prs.a1.unit07.lesson05.text_messages:
    title: 짧은 문자 메시지 읽고 쓰기
  prs.a1.unit07.lesson06.phone_call_dialogue:
    title: 전체 통화 해 보기
teaching:
  prs.a1.unit07.lesson01.teach.alo:
    title: 여보세요 (전화)
    gloss: 여보세요 (전화에서)
    note: الو는 전화를 받거나 통화를 시작할 때만 쓰는 말이에요. 직접 만나서 하는 인사인 سلام과는 달라요.
    example_gloss: 여보세요, 저는 카림이에요.
  prs.a1.unit07.lesson01.teach.goosh_astam:
    title: 전화한 사람에게 계속 말하도록 권하기
    gloss: 네, 그러세요.
    note: بلی، بفرمایین은 전화를 받은 뒤에 하는 자연스러운 대답이에요. 이 과정에서 이미 나온 공손한 표현 بفرمایین('하세요', '말씀하세요')을 쓰며, '듣고 있어요'를 직역한 말이 아니에요.
  prs.a1.unit07.lesson01.teach.telephone_review:
    title: 전화 (복습)
    gloss: 전화
    note: تلفن은 숫자 단원에서 나왔어요. 여기서는 이 단원 전체의 배경으로 쓰여요.
    example_gloss: 제 전화가 고장 났어요.
  prs.a1.unit07.lesson02.teach.who_speaking:
    title: 누구인지 물어보기
    gloss: 실례지만, 누구세요?
    note: ببخشین، کی صحبت می‌کند؟는 전화한 사람이 누구인지 공손하게 묻는 말이에요.
  prs.a1.unit07.lesson02.teach.this_is_speaking:
    title: 자신을 밝히기
    gloss: 저는 파리드예요.
    note: من فرید استم은 전화한 사람이 누구인지 바로 말해 줘요. 앞 단원에서 나온 استم 형태를 그대로 써요.
  prs.a1.unit07.lesson02.teach.colleague_context:
    title: 전화를 건 상대와의 관계 설명하기
    gloss: 저는 호마윤의 동료예요.
    note: همکار همایون استم은 전화를 건 이유를 알려 줘요. 전화를 받은 사람이 나를 모를 때 유용해요.
  prs.a1.unit07.lesson03.teach.speak_slowly:
    title: 천천히 말해 달라고 부탁하기
    gloss: 천천히 말해 주세요.
    note: لطفاً آهسته صحبت کنین은 통화 상태가 좋지 않을 때나 다리어를 배우는 중일 때 쓰기 좋은 공손한 부탁이에요.
  prs.a1.unit07.lesson03.teach.repeat_review:
    title: 다시 말해 달라고 부탁하기 (복습)
    gloss: 다시 말씀해 주시겠어요?
    note: می‌توانین دوباره بگویین؟는 자기소개 단원에서 나왔어요. 통화에서도 똑같이 자연스럽게 쓸 수 있어요.
  prs.a1.unit07.lesson03.teach.combined_request:
    title: 두 가지 부탁을 함께 말하기
    gloss: 천천히, 다시 말씀해 주세요.
    note: و는 두 가지 부탁을 하나의 자연스러운 문장으로 이어 줘요.
  prs.a1.unit07.lesson04.teach.payam_word:
    title: 메시지
    gloss: 메시지
    note: پیام은 말로 전하든 글로 쓰든 '메시지'를 뜻하는 일반적인 단어예요.
    example_gloss: 당신께 전할 메시지가 있어요.
  prs.a1.unit07.lesson04.teach.want_to_leave_message:
    title: 메시지를 남기고 싶다고 말하기
    gloss: 메시지를 남기고 싶어요.
    note: می‌خواهم یک پیام بگذارم은 전화를 받을 사람이 없을 때 하는 말이에요.
  prs.a1.unit07.lesson04.teach.will_call_later:
    title: 나중에 다시 전화하겠다고 말하기
    gloss: 나중에 다시 전화할게요.
    note: بعد زنگ می‌زنم은 메시지를 남기는 대신 쓸 수 있는 간단한 표현이에요.
  prs.a1.unit07.lesson05.teach.short_message:
    title: 문자 메시지
    gloss: 문자 메시지
    note: پیام کوتاه는 글자 그대로 '짧은 메시지'라는 뜻이고, 문자 메시지를 가리키는 일상적인 말이에요.
  prs.a1.unit07.lesson05.teach.meeting_tomorrow:
    title: 메시지 예시
    gloss: 내일 회의는 9시예요.
    note: فردا جلسه ساعت نه است는 메시지로 전할 만한 자연스럽고 완결된 정보예요.
  prs.a1.unit07.lesson05.teach.will_deliver:
    title: 메시지를 전달하겠다고 확인하기
    gloss: 전달할게요.
    note: می‌رسانم은 메시지가 받을 사람에게 전해질 것임을 확인해 주는 말이에요.
  prs.a1.unit07.lesson06.teach.turn01:
    title: 리마가 전화를 받아요
    gloss: 리마가 전화 인사로 받아요.
    note: الو؟는 걸려 온 전화를 받을 때 쓰는 기본 표현이에요.
  prs.a1.unit07.lesson06.teach.turn02:
    title: 파리드가 인사하고 상대가 누구인지 확인해요
    gloss: 파리드가 인사하고 리마 씨인지 물어요.
    note: الو، سلام은 전화 인사와 일상 인사를 합친 말이에요.
  prs.a1.unit07.lesson06.teach.turn03:
    title: 리마가 계속 말하도록 권하고 누구인지 물어요
    gloss: 리마가 계속 말하라고 권하고 누구인지 물어요.
    note: بلی، بفرمایین과 کی صحبت می‌کند؟는 둘 다 앞 과(lesson01/lesson02)에서 나왔어요.
  prs.a1.unit07.lesson06.teach.turn04:
    title: 파리드가 자신을 밝혀요
    gloss: 파리드가 호마윤 씨의 동료라고 말해요.
    note: lesson02의 '동료' 관계 표현을 다시 써요. 리마가 전화를 믿을 만한 이유가 되어 줘요.
  prs.a1.unit07.lesson06.teach.turn05:
    title: 리마가 천천히 말해 달라고 부탁해요
    gloss: 리마가 인사하고 천천히 말해 달라고 부탁해요.
    note: آهسته صحبت کنین، لطفاً는 lesson03의 부탁 표현을 다시 쓴 거예요.
  prs.a1.unit07.lesson06.teach.turn06:
    title: 파리드가 알겠다고 하고 메시지를 남기고 싶다고 해요
    gloss: 파리드가 알겠다고 하고 호마윤 씨에게 메시지를 남기고 싶다고 말해요.
    note: lesson04의 پیام 표현을 확장해서 받는 사람(برای همایون, '호마윤 씨에게')을 구체적으로 말해요.
  prs.a1.unit07.lesson06.teach.turn07:
    title: 리마가 받아 적겠다고 해요
    gloss: 리마가 말씀하시라고 하고 받아 적겠다고 해요.
    note: 여기서 بفرمایین은 파리드에게 계속 말하라고 권하는 말이에요.
  prs.a1.unit07.lesson06.teach.turn08:
    title: 파리드가 메시지 내용을 말해요
    gloss: 파리드가 내일 회의가 9시라고 전해 달라고 부탁해요.
    note: lesson05의 메시지 예시 내용을 그대로 다시 써요.
  prs.a1.unit07.lesson06.teach.turn09:
    title: 리마가 확인하고 전달하겠다고 약속해요
    gloss: 리마가 내용을 확인하고 전달하겠다고 말해요.
    note: می‌رسانم은 lesson05에서 배운 대로 메시지를 받는 부분을 마무리하는 말이에요.
  prs.a1.unit07.lesson06.teach.turn10:
    title: 파리드가 감사 인사를 하고 작별 인사를 해요
    gloss: 파리드가 매우 감사하다고 하고 작별 인사를 해요.
    note: تشکر زیاد와 خدا حافظ는 둘 다 앞 단원의 어휘를 다시 쓴 거예요.
  prs.a1.unit07.lesson06.teach.turn11:
    title: 리마가 작별 인사를 해요
    gloss: 리마가 작별 인사를 해요.
    note: خدا حافظ는 통화를 마무리하는 말이에요.
  prs.a1.unit07.lesson06.teach.past_tense_left:
    title: 누군가 메시지를 남겼다고 말하기 (과거형)
    gloss: 파리드가 메시지를 남겼어요.
    note: گذاشت는 lesson04의 می‌خواهم یک پیام بگذارم에 쓰인 동사의 단순 과거형('남겼다')이에요. 거기서 بگذارم은 '남기다'라는 뜻이에요. 통화 후에 일어난 일을 요약할 때 써요.
    target_text: فرید پیام گذاشت (파리드가 메시지를 남겼어요)
exercises:
  prs.a1.unit07.lesson01.exercise01.recognize_alo:
    instruction: 전화를 받을 때 쓰는 단어는 무엇일까요?
    correct_option: الو
    distractors:
    - سلام
    - تشکر
    - خدا حافظ
    accepted_answers:
    - value: الو
      status: correct
    feedback: الو는 سلام과 달리 전화에서만 쓰는 말이에요.
  prs.a1.unit07.lesson01.exercise02.recognize_goosh_astam:
    instruction: 전화한 사람에게 계속 말하라고 공손하게 권하는 표현은 어느 것일까요?
    correct_option: بلی، بفرمایین
    distractors:
    - الو؟
    - کی صحبت می‌کند؟
    - خدا حافظ
    accepted_answers:
    - value: بلی، بفرمایین
      status: correct
    feedback: بلی، بفرمایین은 전화한 사람에게 계속 말하라고 공손하게 권하는 말이에요.
  prs.a1.unit07.lesson01.exercise03.recognize_alo_reading:
    instruction: 이 말은 무슨 뜻일까요?
    correct_option: 여보세요? (전화를 받을 때)
    distractors:
    - 안녕하세요 (평화가 있기를)
    - 고맙습니다
    - 안녕히 가세요
    accepted_answers:
    - value: 여보세요? (전화를 받을 때)
      status: correct
    feedback: الو는 전화를 받을 때 하는 말이에요.
  prs.a1.unit07.lesson01.exercise04.match_phone_opening:
    instruction: 각 단어나 표현을 알맞은 뜻과 연결하세요.
    accepted_answers:
    - value:
        الو: 여보세요 (전화에서)
        بلی، بفرمایین: 네, 그러세요.
        تلفن: 전화
      status: correct
    feedback: 이 표현들은 일반적인 통화를 시작할 때 쓰는 말이에요.
    pairs:
    - left: الو
      right: 여보세요 (전화에서)
    - left: بلی، بفرمایین
      right: 네, 그러세요.
    - left: تلفن
      right: 전화
  prs.a1.unit07.lesson01.exercise05.order_goosh_astam:
    instruction: 단어를 배열해서 '네, 말씀하세요.'라는 뜻의 문장을 만들어 보세요.
    accepted_answers:
    - value:
      - بلی
      - بفرمایین
      status: correct
    feedback: بلی، بفرمایین은 전화한 사람에게 계속 말하라고 권하는 말이에요.
  prs.a1.unit07.lesson01.exercise06.translate_goosh_astam:
    instruction: '다리어로 번역해 보세요: 네, 말씀하세요.'
    accepted_answers:
    - value: بلی، بفرمایین
      status: correct
    - value: بلی بفرمایین
      status: correct
    feedback: بلی، بفرمایین은 '네, 말씀하세요'라는 뜻이에요.
  prs.a1.unit07.lesson01.exercise07.speak_answer_phone:
    instruction: 전화가 울려요. 전화를 받고 상대에게 계속 말하라고 권해 보세요.
    accepted_answers:
    - value: الو؟ بلی، بفرمایین.
      status: correct
    - value: الو، بلی بفرمایین
      status: correct
    feedback: الو로 전화를 받고, بلی، بفرمایین으로 상대에게 계속 말하라고 권해요.
  prs.a1.unit07.lesson02.exercise01.recognize_who_speaking:
    instruction: 전화한 사람이 누구인지 묻는 표현은 어느 것일까요?
    correct_option: ببخشین، کی صحبت می‌کند؟
    distractors:
    - من فرید استم
    - همکار همایون استم
    - الو؟
    accepted_answers:
    - value: ببخشین، کی صحبت می‌کند؟
      status: correct
    feedback: کی صحبت می‌کند؟는 글자 그대로 '누가 말하고 있나요?'라는 뜻이에요.
  prs.a1.unit07.lesson02.exercise02.recognize_this_is:
    instruction: 말하는 사람이 파리드라고 밝히는 표현은 어느 것일까요?
    correct_option: من فرید استم
    distractors:
    - ببخشین، کی صحبت می‌کند؟
    - همکار همایون استم
    - بلی، بفرمایین
    accepted_answers:
    - value: من فرید استم
      status: correct
    feedback: من فرید استم은 말하는 사람의 이름을 바로 말해 줘요.
  prs.a1.unit07.lesson02.exercise03.recognize_who_speaking_reading:
    instruction: 이 질문은 무엇을 묻고 있나요?
    correct_option: 실례지만, 누구세요?
    distractors:
    - 저는 파리드예요.
    - 네, 그러세요.
    - 여보세요? (전화를 받을 때)
    accepted_answers:
    - value: 실례지만, 누구세요?
      status: correct
    feedback: ببخشین، کی صحبت می‌کند؟ 는 정중하게 누구인지 묻는 표현이에요.
  prs.a1.unit07.lesson02.exercise04.match_identity_phrases:
    instruction: 각 표현에 알맞은 뜻을 연결하세요.
    accepted_answers:
    - value:
        ببخشین، کی صحبت می‌کند؟: 실례지만, 누구세요?
        من فرید استم: 저는 파리드예요.
        همکار همایون استم: 저는 호마윤의 동료예요.
        الو: 여보세요 (전화에서)
        بلی، بفرمایین: 네, 그러세요.
        تلفن: 전화
      status: correct
    feedback: 이 표현들은 통화에서 신원을 묻고 밝히는 말이에요. 1과의 전화 시작 표현도 함께 복습해요.
    pairs:
    - left: ببخشین، کی صحبت می‌کند؟
      right: 실례지만, 누구세요?
    - left: من فرید استم
      right: 저는 파리드예요.
    - left: همکار همایون استم
      right: 저는 호마윤의 동료예요.
    - left: الو
      right: 여보세요 (전화에서)
    - left: بلی، بفرمایین
      right: 네, 그러세요.
    - left: تلفن
      right: 전화
  prs.a1.unit07.lesson02.exercise05.order_who_speaking:
    instruction: 단어를 배열해 전화한 사람이 누구인지 정중하게 묻는 문장을 만드세요.
    accepted_answers:
    - value:
      - ببخشین
      - کی
      - صحبت
      - می‌کند
      status: correct
    feedback: ببخشین، کی صحبت می‌کند؟는 전화한 사람이 누구인지 공손하게 묻는 말이에요.
  prs.a1.unit07.lesson02.exercise06.translate_this_is:
    instruction: '다리어로 번역하세요: 저는 파리드예요.'
    accepted_answers:
    - value: من فرید استم
      status: correct
    - value: فرید استم
      status: correct
    - value: من فرید هستم
      status: correct
    - value: فرید هستم
      status: correct
    feedback: من فرید استم 은(는) 말하는 사람의 신원을 밝히는 표현이에요.
  prs.a1.unit07.lesson02.exercise07.speak_identify_self:
    instruction: ببخشین، کی صحبت می‌کند؟ 이름이 파리드라고 생각하고 대답해 보세요.
    accepted_answers:
