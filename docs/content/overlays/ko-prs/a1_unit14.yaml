course:
  title: 한국어로 배우는 다리어 A1
  description: '카불 다리어 입문: 좋아하는 것과 싫어하는 것 말하기, 선호 묻기, 선택지 중에서 고르기, 간단한 이유 말하기, 두 사람의 취향에 관한 짧은 읽기/대화.'
units:
