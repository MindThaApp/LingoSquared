teaching:
  prs.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: 좋아해요
    gloss: 좋아해요
    note: دوست دارم은 문자 그대로 '(그것과) 우정이 있다'는 뜻으로, '좋아해요'를 말할 때 쓰는 기본 표현이에요.
  prs.a1.unit14.lesson01.teach.qahwa_word:
    title: 커피
    gloss: 커피
    note: قهوه는 "커피"라는 뜻이에요.
    example_gloss: 저는 커피를 좋아해요.
  prs.a1.unit14.lesson01.teach.chai_word:
    title: 차
    gloss: 차
    note: چای는 "차"라는 뜻이에요.
    example_gloss: 저는 차를 좋아하지 않아요.
  prs.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: 좋아하지 않아요
    gloss: 좋아하지 않아요
    note: دوست ندارم은 دوست دارم의 부정형이에요.
  prs.a1.unit14.lesson01.teach.man_word:
    title: 나
    gloss: 나
    note: من은(는) 단독으로 쓰는 1인칭 대명사 '나'예요.
    example_gloss: 저는 커피를 좋아해요.
  prs.a1.unit14.lesson01.teach.ra_word:
    title: (object marker)
    gloss: (동사의 대상을 나타냄)
    note: را는 특정한 직접 목적어를 나타내요. 다리어에서는 글에서뿐 아니라 일상 대화에서도 쓰이며, 이란식 رو는 쓰지 않아요.
    target_text: را (목적어 표지)
  prs.a1.unit14.lesson02.teach.kodam_word:
    title: 어느 것
    gloss: 어느 것
    note: کدام은(는) '어느 (것)'이라는 뜻이에요.
    example_gloss: 어떤 걸 좋아해요?
  prs.a1.unit14.lesson02.teach.moosiqi_word:
    title: 음악
    gloss: 음악
    note: موسیقی는 "음악"이라는 뜻이에요.
    example_gloss: 저는 음악을 좋아해요.
  prs.a1.unit14.lesson02.teach.darid_grammar:
    title: You have/like (polite)
    gloss: 가지고 계세요 / 좋아하세요
    note: دارین은(는) داشتن(가지다)의 높임/복수 2인칭 형태예요. 이 과정에서 높임 표현을 먼저 쓰는 استم/استین 방식과 같은 흐름이에요.
    target_text: دارین (가지고 계세요/좋아하세요, 높임)
  prs.a1.unit14.lesson02.teach.kodam_ra_question:
    title: 어떤 걸 좋아해요?
    gloss: 어떤 걸 좋아해요?
    note: کدام را دوست دارین؟ -- را는 목적어를 나타내며, 여기서는 고르는 대상을 가리켜요.
  prs.a1.unit14.lesson03.teach.bishtar_word:
    title: 더
    gloss: 더
    note: بیشتر는 "더, 더 많이"라는 뜻이에요.
    example_gloss: 커피를 더 좋아해요.
  prs.a1.unit14.lesson03.teach.ya_word:
    title: Or
    gloss: 또는
    note: یا는 "또는"이라는 뜻으로, 두 가지 중 하나를 고르게 할 때 써요.
    target_text: یا (또는)
  prs.a1.unit14.lesson03.teach.qahwa_ya_chai_question:
    title: 커피? 아니면 차?
    gloss: 커피, 아니면 차?
    note: قهوه یا چای؟는 1과에서 배운 두 음료 중 하나를 고르게 하는 질문이에요.
  prs.a1.unit14.lesson04.teach.choon_word:
    title: Because
    gloss: 왜냐하면 / ~해서
    note: چون은 이유를 이끄는 말이에요.
    target_text: چون (왜냐하면)
  prs.a1.unit14.lesson04.teach.khoshmaza_ast_word:
    title: 맛있어요
    gloss: 맛있어요
    note: خوش‌مزه است은(는) 줄이지 않은 완전한 형태('맛있어요')예요. 이 과정에서는 است를 줄이지 않고 따로 써요.
    example_gloss: 저는 커피를 좋아해요. 맛있거든요.
  prs.a1.unit14.lesson04.teach.jaleb_ast_word:
    title: 흥미로워요
    gloss: 흥미로워요
    note: جالب است은(는) 줄이지 않은 완전한 형태('흥미로워요')예요.
    example_gloss: 저는 음악을 좋아해요. 흥미롭거든요.
  prs.a1.unit14.lesson04.teach.va_word:
    title: And
    gloss: 그리고
    note: و는 두 절이나 항목을 이어 주는 '그리고, ~와/과'라는 뜻이에요.
    target_text: و (그리고)
  prs.a1.unit14.lesson05.teach.negar_name:
    title: 네가르
    gloss: 네가르
    note: 아프가니스탄에서 흔한 여자 이름이에요.
    example_gloss: 네가르는 차를 좋아해요.
  prs.a1.unit14.lesson05.teach.darad_grammar:
    title: He/she likes
    gloss: 좋아해요
    note: دارد은(는) داشتن(가지다)의 완전한 3인칭 형태예요. دوست دارد은(는) '그/그녀가 좋아해요'라는 뜻으로, 1인칭 دوست دارم과 같은 형태예요.
    target_text: دوست دارد (그/그녀가 좋아해요, 3인칭 완전한 형태)
  prs.a1.unit14.lesson05.teach.nadarad_grammar:
    title: He/she doesn't like
    gloss: 좋아하지 않아요
    note: ندارد은(는) 완전한 3인칭 부정형이에요. دوست ندارد은(는) '그/그녀가 좋아하지 않아요'라는 뜻이에요.
    target_text: دوست ندارد (그/그녀가 좋아하지 않아요, 3인칭 완전한 형태)
  prs.a1.unit14.lesson05.teach.garm_ast_word:
    title: 따뜻해요
    gloss: 따뜻해요
    note: گرم است은(는) 줄이지 않은 완전한 형태('따뜻해요')예요.
    example_gloss: 네가르는 차를 좋아해요. 따뜻하거든요.
  prs.a1.unit14.lesson05.teach.reading_text:
    title: 취향에 관한 예문
    gloss: 네가르는 차를 좋아해요. 따뜻하거든요. 네가르는 음악을 좋아하지 않아요.
    note: 이번 단원의 취향 어휘를 모아 3인칭으로 쓴 짧은 글이에요.
  prs.a1.unit14.lesson06.teach.names:
    title: 카림과 네가르
    gloss: 카림, 네가르
    note: 이 과정 전체에서 쓰이는 아프가니스탄의 흔한 이름이에요.
    example_gloss:
    - 저는 카림이에요.
    - 저는 네가르예요.
  prs.a1.unit14.lesson06.teach.shoma_chetor_phrase:
    title: 당신은요?
    gloss: 당신은요?
    note: شما چطور؟은(는) 상대방에게 같은 질문을 정중하게 되묻는 표현이에요. 높임 표현 استین 계열과 같은 흐름이에요.
  prs.a1.unit14.lesson06.teach.aali_ast_word:
    title: 아주 좋아요
    gloss: 아주 좋아요
    note: عالی است은(는) 줄이지 않은 완전한 형태('훌륭해요')예요.
    example_gloss: 커피가 훌륭해요.
  prs.a1.unit14.lesson06.teach.dialogue_line1:
    title: 카림이 물어봐요
    gloss: 차랑 커피 중에 어느 걸 더 좋아해?
  prs.a1.unit14.lesson06.teach.dialogue_line2:
    title: 네가르의 대답
    gloss: 나는 커피를 더 좋아해. 맛있거든. 너는 어때?
  prs.a1.unit14.lesson06.teach.dialogue_line3:
    title: 카림이 대답해요
    gloss: 나는 차를 좋아해. 따뜻하거든.
  prs.a1.unit14.lesson06.teach.dialogue_line4:
    title: 네가르의 반응
    gloss: 아주 좋네!
