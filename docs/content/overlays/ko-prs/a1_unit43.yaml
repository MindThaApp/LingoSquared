  prs.a1.unit43.lesson02.asking_return_date:
    title: 반납일 묻기
  prs.a1.unit43.lesson03.borrowing_and_returning:
    title: 책 빌리기와 반납하기
  prs.a1.unit43.lesson04.library_dialogue:
    title: 도서관 대화
  prs.a1.unit43.lesson05.reading:
    title: 빌린 책에 관한 읽기
  prs.a1.unit43.lesson06.wrap_up:
    title: 마무리
teaching:
  prs.a1.unit43.lesson01.teach.review_book_have_is_in:
    title: '복습: 책, 있어요, 이에요, ~에'
    gloss: 책 / 나는 가지고 있어요 / ~이에요 / ~에
    note: کتاب, دارم, است, در는 책에 관해 말할 때 쓰는 복습 단어예요.
    target_text: کتاب (책) / دارم (저는 가지고 있어요) / است (~이에요/있어요) / در (~에)
  prs.a1.unit43.lesson01.teach.review_want_one:
    title: '복습: 원해요, 한 ~'
    gloss: 나는 원해요 / 한 / 하나
    note: می‌خواهم과 یک을 합쳐서 원하는 것을 말해요.
    target_text: می‌خواهم (저는 원해요) / یک (하나의 / 한)
  prs.a1.unit43.lesson01.teach.library_word:
    title: 도서관
    gloss: 도서관
    note: کتابخانه는 도서관을 뜻하는 표준 다리어 단어로, کتاب(책)과 خانه(집)으로 이루어져 있어요.
    example_gloss: 책은 도서관에 있어요.
  prs.a1.unit43.lesson01.teach.librarian_word:
    title: 사서
    gloss: 사서
    note: کتابدار는 글자 그대로 "책을 맡은 사람"(책을 관리하는 사람)이라는 뜻으로, دوکاندار("가게 주인", 8과)와 같은 방식으로 만들어졌어요.
    example_gloss: 사서는 도서관에 있어요.
  prs.a1.unit43.lesson01.teach.want_book_phrase:
    title: 책을 원해요
    gloss: 책을 한 권 원해요.
    note: یک کتاب می‌خواهم은 یک(한 ~), کتاب(책), می‌خواهم(원해요)을 합친 말이에요.
  prs.a1.unit43.lesson01.teach.review_from_object_marker:
    title: '복습: ~에서, 목적어 표지'
    gloss: ~에게서 / (목적어 표지)
    note: از(~에게서)와 را(문장의 목적어를 나타냄, 14과·26과에서 배움)는 복습 단어예요.
    target_text: از (~에게서/~로부터) / را (목적어 표지)
  prs.a1.unit43.lesson01.teach.want_book_from_librarian_phrase:
    title: 사서에게 그 책을 원해요
    gloss: 사서에게 그 책을 빌리고 싶어요.
    note: کتاب را می‌خواهم에 از کتابدار(사서에게)가 더해졌어요.
  prs.a1.unit43.lesson01.teach.want_one_book_from_librarian_phrase:
    title: 사서에게 책을 한 권 원해요
    gloss: 사서에게 책을 빌리고 싶어요.
    note: یک(한 ~)과 کتاب را از کتابدار می‌خواهم을 합친 문장이에요.
  prs.a1.unit43.lesson02.teach.review_date_day_monday:
    title: '복습: 날짜, 날, 월요일'
    gloss: 날짜 / 날 / 월요일
    note: تاریخ, روز, دوشنبه(모두 9과)는 반납일을 물을 때 쓰는 복습 단어예요.
    target_text: تاریخ (날짜) / روز (날/요일) / دوشنبه (월요일)
  prs.a1.unit43.lesson02.teach.review_which_is:
    title: '복습: 어느, ~이에요'
    gloss: 어느 / ~이에요
    note: کدام과 است는 질문할 때 쓰는 복습 단어예요.
    target_text: کدام (어느) / است (~이에요)
  prs.a1.unit43.lesson02.teach.return_giving_back_word:
    title: 반납 / 돌려주기
    gloss: 반납 / 돌려주기
    note: پس دادن은 글자 그대로 "돌려주다"라는 뜻으로, پس(뒤로)와 دادن(주다)이 합쳐진 말이에요.
    example_gloss: 반납일은 월요일이에요.
  prs.a1.unit43.lesson02.teach.ask_return_date_phrase:
    title: 반납일은 무슨 요일이에요?
    gloss: 책 반납일은 무슨 요일이에요?
    note: تاریخ پس دادن کتاب کدام روز است؟는 빌린 책을 언제 돌려줘야 하는지 묻는 말이에요.
  prs.a1.unit43.lesson02.teach.return_date_answer_phrase:
    title: 반납일은 월요일이에요
    gloss: 반납일은 월요일이에요.
    note: تاریخ پس دادن دوشنبه است는 특정 요일로 질문에 답하는 말이에요.
  prs.a1.unit43.lesson03.teach.review_want_book_one_this:
    title: '복습: 원해요, 책, 한 ~, 이'
    gloss: 나는 원해요 / 책 / 한 / 하나 / 이
    note: می‌خواهم, کتاب, یک, این은 특정한 책을 요청할 때 쓰는 복습 단어예요.
    target_text: می‌خواهم (저는 원해요) / کتاب (책) / یک (하나의 / 한) / این (이)
  prs.a1.unit43.lesson03.teach.get_word:
    title: 받다 / 가지다
    gloss: 받다 / 가지다
    note: بگیرم은 접속법 형태("내가 받도록/가지도록")로, 42과에서 می‌خواهم과 함께 "받고 싶어요"라고 말할 때 쓴 것과 같은 형태예요.
    example_gloss: 책을 한 권 받고 싶어요.
  prs.a1.unit43.lesson03.teach.loan_word:
    title: 대출
    gloss: 대출
    note: قرض는 빌림 또는 대출을 뜻해요. قرض گرفتن("빌려서 받다")은 "빌리다"를 나타내는 일상적인 다리어 표현이에요.
    example_gloss: 이 책은 빌린 책이에요.
  prs.a1.unit43.lesson03.teach.want_borrow_book_phrase:
    title: 책을 빌리고 싶어요
    gloss: 책을 빌리고 싶어요.
    note: می‌خواهم کتاب را قرض بگیرم은 می‌خواهم, کتاب را, قرض, 접속법 بگیرم을 합친 문장이에요.
  prs.a1.unit43.lesson03.teach.give_back_word:
    title: 주다 (돌려주다)
    gloss: 주다 / 돌려주다
    note: بدهم은 دادن(주다)의 접속법 형태이고, پس(뒤로)와 함께 쓰면 "돌려주다 / 반납하다"라는 뜻이 돼요.
    example_gloss: 돌려주고 싶어요.
  prs.a1.unit43.lesson03.teach.want_return_book_phrase:
    title: 책을 반납하고 싶어요
    gloss: 책을 반납하고 싶어요.
    note: می‌خواهم کتاب را پس بدهم은 می‌خواهم, کتاب را, پس, 접속법 بدهم을 합친 문장이에요.
  prs.a1.unit43.lesson03.teach.review_very_good:
    title: '복습: 아주, 좋아요'
    gloss: 아주 / 좋은
    note: بسیار와 خوب는 무언가를 확인할 때 쓰는 복습 단어예요.
    target_text: بسیار (아주) / خوب (좋은)
  prs.a1.unit43.lesson03.teach.good_answer_phrase:
    title: 좋아요
    gloss: 좋아요.
    note: خوب است는 무언가가 괜찮다고 확인해 주는 말이에요.
  prs.a1.unit43.lesson04.teach.review_hello_want:
