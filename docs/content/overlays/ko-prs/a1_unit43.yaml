    note: سلام과 می‌خواهم은 대화에서 쓰는 복습 단어예요.
    target_text: سلام (안녕하세요) / می‌خواهم (저는 원해요)
  prs.a1.unit43.lesson04.teach.review_very_thanks_welcome:
    title: '복습: 아주, 정말 감사합니다, 천만에요'
    gloss: 아주 / 정말 감사합니다 / 천만에요
    note: بسیار, تشکر زیاد, خواهش می‌کنم은 대화에서 쓰는 복습 단어예요.
    target_text: بسیار (아주) / تشکر زیاد (정말 감사합니다) / خواهش می‌کنم (천만에요)
  prs.a1.unit43.lesson04.teach.dialogue_line1:
    title: '후마윤: 안녕하세요. 책을 한 권 빌리고 싶어요.'
    gloss: 안녕하세요. 책을 한 권 빌리고 싶어요.
  prs.a1.unit43.lesson04.teach.dialogue_line2:
    title: '사서: 안녕하세요. 어떤 책을 원하세요?'
    gloss: 안녕하세요. 어떤 책을 원하세요?
    note: می‌خواهین은 "원하세요"의 높임 복수형이에요.
  prs.a1.unit43.lesson04.teach.dialogue_line3:
    title: '후마윤: 이 책을 원해요.'
    gloss: 이 책을 원해요.
  prs.a1.unit43.lesson04.teach.dialogue_line4:
    title: '사서: 좋아요. 반납일은 월요일이에요.'
    gloss: 좋아요. 반납일은 월요일이에요.
  prs.a1.unit43.lesson04.teach.dialogue_line5:
    title: '후마윤: 아주 좋아요. 정말 감사합니다.'
    gloss: 아주 좋아요. 정말 감사합니다.
  prs.a1.unit43.lesson04.teach.dialogue_line6:
    title: '사서: 천만에요.'
    gloss: 천만에요.
  prs.a1.unit43.lesson05.teach.review_he_she_has:
    title: '복습: 후마윤, 그/그녀, 그/그녀는 가지고 있어요'
    gloss: 후마윤 / 그/그녀 / 그/그녀는 가지고 있어요
    note: همایون, او, دارد는 읽기 글에서 쓰는 복습 단어예요.
    target_text: همایون (후마윤) / او (그/그녀) / دارد (그/그녀는 가지고 있어요)
  prs.a1.unit43.lesson05.teach.reading_passage:
    title: 빌린 책에 관한 읽기
    gloss: 호마윤에게 책이 한 권 있어요. 그의 책은 도서관에서 빌린 거예요. 그 책의 반납일은 월요일이에요. 호마윤은 기뻐요.
  prs.a1.unit43.lesson06.teach.review_wrap_up_words:
