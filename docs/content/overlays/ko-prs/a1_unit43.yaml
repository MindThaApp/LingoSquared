    gloss: ~이 없어요 / 하지만 / 당신(존칭)
    note: ندارم, اما, شما는 두 날을 대조할 때 쓰는 복습 단어예요.
    target_text: ندارم (저는 없어요) / اما (하지만) / شما (당신, 격식체)
  prs.a1.unit43.lesson06.teach.review_tuesday:
    title: '복습: 화요일'
    gloss: 화요일
    note: سه‌شنبه는 복습 단어예요.
    target_text: سه‌شنبه (화요일)
  prs.a1.unit43.lesson06.teach.contrast_phrase:
    title: 월요일엔 책이 있지만 화요일엔 없어요
    gloss: 월요일에는 책이 있지만 화요일에는 없어요.
    note: اما는 월요일에 책이 있는 것과 화요일에 없는 것을 대조해요.
  prs.a1.unit43.lesson06.teach.formal_question_phrase:
    title: 어떤 책을 원하세요?
    gloss: 어떤 책을 원하세요?
    note: 상대방이 어느 책을 원하는지 존칭으로 물을 때 شما를 붙인 표현이에요.
