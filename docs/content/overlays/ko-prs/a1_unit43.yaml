course:
  title: 한국어로 배우는 다리어 A1
  description: '초급 카불 다리어: 간단한 도서관 자료를 빌리고 반납하는 법, 반납일을 묻는 법, 빌린 책에 관한 짧은 글 읽기를 배워요. 상대가 어떤 책을 원하는지 묻고, 반납일을 알려 주고 확인하고, 기본적인 도서관 대화를 이해해요.'
units:
  prs.a1.unit43.library:
    title: 도서관
    description: 책을 요청하고, 빌리고 반납하고, 반납일을 묻고 확인하고, 빌린 책에 관한 짧은 글을 읽어요.
