teaching:
  prs.a1.unit18.lesson01.teach.teacher_word:
    title: 선생님
    gloss: 선생님
    note: معلم은 '교사'라는 뜻이에요.
    example_gloss: 저는 선생님이에요.
  prs.a1.unit18.lesson01.teach.engineer_word:
    title: 엔지니어
    gloss: 엔지니어
    note: مهندس는 '엔지니어'라는 뜻이에요.
    example_gloss: 저는 엔지니어예요.
  prs.a1.unit18.lesson01.teach.doctor_word:
    title: 의사
    gloss: 의사
    note: داکتر는 '의사'를 뜻하는 아프가니스탄 다리어의 표준 철자와 발음이에요.
    example_gloss: 저는 의사예요.
  prs.a1.unit18.lesson01.teach.shopkeeper_word:
    title: 가게 주인
    gloss: 가게 주인
    note: دوکاندار는 '가게 주인'을 뜻하는 아프가니스탄 다리어의 표준 표현으로, 이 과정의 쇼핑 단원에서 이미 나왔어요.
    example_gloss: 저는 가게 주인이에요.
  prs.a1.unit18.lesson01.teach.work_word:
    title: 일 / 직업
    gloss: 일 / 직업
    note: کار는 '일' 또는 '직업'이라는 뜻이에요.
    example_gloss: 저는 할 일이 있어요.
  prs.a1.unit18.lesson01.teach.am_word:
    title: 저는 ~이에요
    gloss: 나는 ~이다
    note: استم은 '저는 ~이에요'를 뜻하는 1인칭 공손한 이다 동사로, 이 과정의 استم/استین 형태와 같은 격식이에요.
    target_text: استم (저는 ~이에요)
  prs.a1.unit18.lesson02.teach.office_word:
    title: 사무실
    gloss: 사무실
    note: دفتر는 '사무실'이라는 뜻이에요.
    example_gloss: 저는 사무실에서 일해요.
  prs.a1.unit18.lesson02.teach.shop_word:
    title: 가게
    gloss: 가게
    note: دوکان은 '가게'라는 뜻이에요.
    example_gloss: 저는 가게에서 일해요.
  prs.a1.unit18.lesson02.teach.hospital_word:
    title: 병원
    gloss: 병원
    note: شفاخانه는 '병원'을 뜻하는 아프가니스탄 다리어 고유의 표현으로, 이 과정의 장소 단원에서 이미 나왔어요.
    example_gloss: 저는 병원에서 일해요.
  prs.a1.unit18.lesson02.teach.school_word:
    title: 학교
    gloss: 학교
    note: مکتب는 '학교'를 뜻하는 아프가니스탄 다리어 고유의 표현으로, 이 과정의 장소 단원에서 이미 나왔어요.
    example_gloss: 저는 학교에서 일해요.
  prs.a1.unit18.lesson02.teach.in_word:
    title: ~에서
    gloss: ~에서
    note: در는 어떤 일이 일어나는 장소를 나타내요. در مکتب은 '학교에서'라는 뜻이에요.
    target_text: در (~에 / ~에서)
  prs.a1.unit18.lesson02.teach.i_work_word:
    title: 저는 일해요
    gloss: 저는 해요 / 저는 일해요
    note: می‌کنم은 کردن(하다)의 1인칭 현재형이에요. کار می‌کنم은 직역하면 '일을 해요', 즉 '일해요'라는 뜻이에요.
    target_text: کار می‌کنم (저는 일해요)
  prs.a1.unit18.lesson03.teach.where_word:
    title: 어디
    gloss: 어디
    note: کجا는 '어디'라는 뜻이에요.
    target_text: کجا (어디)
  prs.a1.unit18.lesson03.teach.you_work_word:
    title: 일하세요 (공손한 표현)
    gloss: 당신은 일해요
    note: کار می‌کنین은 '일하세요'라는 뜻이에요(공손한 표현).
    target_text: کار می‌کنین (일하세요 -- 존댓말)
  prs.a1.unit18.lesson03.teach.and_word:
    title: 그리고
    gloss: 그리고, ~와/과
    note: و는 두 절이나 항목을 이어 주는 '그리고, ~와/과'라는 뜻이에요.
    target_text: و (그리고)
  prs.a1.unit18.lesson04.teach.is_word:
    title: ~이에요 (3인칭)
    gloss: ~이에요
    note: است는 3인칭 이다 동사예요. معلم است은 '(그/그녀는) 교사예요'라는 뜻이에요.
    target_text: است (~이에요 -- 3인칭)
  prs.a1.unit18.lesson04.teach.he_she_works_word:
    title: (그/그녀가) 일해요
    gloss: 그/그녀는 일해요
    note: می‌کند는 کردن(하다)의 3인칭 현재형이에요. کار می‌کند는 '그/그녀는 일해요'라는 뜻이에요.
    target_text: کار می‌کند (그/그녀는 일해요)
  prs.a1.unit18.lesson04.teach.laila_word:
    title: 라일라
    gloss: 라일라
    note: 이 과정에 계속 나오는 인물 이름으로, 소개 단원에서 처음 나왔어요.
    example_gloss: 라일라는 교사예요.
  prs.a1.unit18.lesson04.teach.profile_text:
    title: 짧은 직업 소개
    gloss: 라일라는 교사예요. 학교에서 일해요.
    note: 직업과 직장을 말하는 짧은 3인칭 소개글이에요.
  prs.a1.unit18.lesson05.teach.every_word:
    title: 매~
    gloss: 매 / 모든
    note: هر는 '매~', '모든'이라는 뜻이에요.
    example_gloss: 저는 매일 일해요.
  prs.a1.unit18.lesson05.teach.day_word:
    title: 날
    gloss: 날, 하루
    note: روز는 '날'이라는 뜻이에요. هر روز는 '매일'이라는 뜻이에요.
    example_gloss: 그녀는 매일 가르쳐요.
  prs.a1.unit18.lesson05.teach.lesson_word:
    title: 수업
    gloss: 수업
    note: درس는 '수업'이라는 뜻이에요.
    example_gloss: 라일라는 가르쳐요.
  prs.a1.unit18.lesson05.teach.gives_word:
    title: (그/그녀가) 줘요
    gloss: 그/그녀가 줘요
    note: می‌دهد는 دادن(주다)의 3인칭 현재형이에요. درس می‌دهد는 직역하면 '수업을 해요', 즉 '가르쳐요'라는 뜻이에요.
    target_text: می‌دهد (그/그녀가 줘요 -- درس می‌دهد는 '가르쳐요'라는 뜻)
  prs.a1.unit18.lesson05.teach.longer_profile_text:
    title: 더 긴 직업 소개
    gloss: 라일라는 교사예요. 학교에서 일해요. 매일 가르쳐요.
    note: 앞의 짧은 소개글에 날마다 하는 일을 더한 같은 소개글이에요.
  prs.a1.unit18.lesson06.teach.names:
    title: 바시르와 네가르
    gloss: 바시르, 네가르
    note: 이 과정에 계속 나오는 인물들이에요.
    example_gloss:
    - 저는 바시르예요.
    - 저는 네가르예요.
  prs.a1.unit18.lesson06.teach.you_word:
    title: 당신 (공손한 표현)
    gloss: 너
    note: شما는 공손한 2인칭 대명사예요.
    target_text: شما (당신 -- 존댓말)
  prs.a1.unit18.lesson06.teach.what_is_word:
    title: ~은 무엇이에요
    gloss: 무엇이에요
    note: چیست은 '무엇이에요'라는 뜻이에요. کار شما چیست؟는 '직업이 무엇이에요?'라는 뜻이에요.
    target_text: چیست (무엇이에요)
  prs.a1.unit18.lesson06.teach.yes_word:
    title: 네
    gloss: 네
    note: بلی는 '네'를 뜻하는 공손하고 격식 있는 말로, 이 과정의 격식에 맞아요.
    example_gloss: 네, 매일 일해요.
  prs.a1.unit18.lesson06.teach.dialogue_line1:
    title: 바시르가 물어요
    gloss: 직업이 뭐예요?
  prs.a1.unit18.lesson06.teach.dialogue_line2:
    title: 네가르가 대답해요
    gloss: 저는 의사예요. 병원에서 일해요.
  prs.a1.unit18.lesson06.teach.dialogue_line3:
    title: 바시르가 물어요
    gloss: 매일 일하세요?
  prs.a1.unit18.lesson06.teach.dialogue_line4:
    title: 네가르가 대답해요
    gloss: 네, 매일 일해요.
