  prs.a1.unit30.lesson04.teach.dialogue_line4:
    title: '자르미나: 네, 사무실에서 컴퓨터를 사용해요.'
    gloss: 네, 저는 사무실에서 컴퓨터를 사용해요.
  prs.a1.unit30.lesson04.teach.dialogue_line5:
    title: '후마윤: 저는 매일 인터넷을 사용해요.'
    gloss: 저는 매일 인터넷을 사용해요.
  prs.a1.unit30.lesson04.teach.dialogue_line6:
    title: '자르미나: 훌륭해요!'
    gloss: 멋져요!
  prs.a1.unit30.lesson05.teach.reading_passage:
    title: 기술에 관한 읽기
    gloss: 자르미나는 매일 휴대폰을 사용해요. 그녀는 사진을 찍고 메시지를 보내요. 그녀는 사무실에서 컴퓨터를 사용해요. 후마윤은 매일 인터넷을 사용해요.
