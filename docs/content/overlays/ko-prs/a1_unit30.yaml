teaching:
  prs.a1.unit30.lesson01.teach.tech_word:
    title: 기술
    gloss: 기술
    note: تکنالوژی은(는) 기술이라는 뜻이에요. 아프가니스탄에서 쓰는 표준 철자이며, 이란식 철자 تکنولوژی와는 달라요.
    example_gloss: 기술은 좋아요.
  prs.a1.unit30.lesson01.teach.mobile_word:
    title: 휴대전화
    gloss: 휴대전화
    note: موبایل은(는) 휴대전화라는 뜻으로, 더 일반적인 تلفن(전화, 7단원에서 복습)과는 구별돼요.
    example_gloss: 저는 휴대전화가 있어요.
  prs.a1.unit30.lesson01.teach.computer_word:
    title: 컴퓨터
    gloss: 컴퓨터
    note: کمپیوتر은(는) 컴퓨터라는 뜻이에요. 페르시아어와 다리어가 함께 쓰는 표준 외래어예요.
    example_gloss: 컴퓨터는 사무실에 있어요.
  prs.a1.unit30.lesson01.teach.internet_word:
    title: 인터넷
    gloss: 인터넷
    note: انترنت은(는) 인터넷이라는 뜻이에요. 페르시아어와 다리어가 함께 쓰는 표준 외래어예요.
    example_gloss: 인터넷이 느려요.
  prs.a1.unit30.lesson01.teach.app_word:
    title: 앱
    gloss: 앱
    note: اپلیکیشن은 '앱(애플리케이션)'이라는 뜻이며, 페르시아어와 다리어에서 공통으로 쓰는 외래어입니다.
    example_gloss: 이 앱은 좋아요.
  prs.a1.unit30.lesson01.teach.photo_word:
    title: 사진
    gloss: 사진
    note: عکس는 '사진'이라는 뜻입니다.
    example_gloss: 이 사진은 좋아요.
  prs.a1.unit30.lesson01.teach.review_estefade_kardan:
    title: 사용하다
    gloss: 사용 + 하다 → 저는 사용해요
    note: استفاده(사용)는 کردن(하다, 복습)과 결합하여 استفاده می‌کنم(저는 사용해요)이 됩니다. 이 과정에서 이미 여러 번 나온 '명사 + 하다' 형태와 같은 방식이며, 예를 들어 بازی می‌کنم(29과)과 ورزش می‌کنم(29과)이 있습니다.
    target_text: استفاده (사용) + کردن (하다) = استفاده می‌کنم (저는 사용해요)
  prs.a1.unit30.lesson01.teach.combined_sentence:
    title: 저는 인터넷을 사용해요
    gloss: 저는 인터넷을 사용해요.
    note: من(저, 복습), از(~을/를 이용하여, 복습), انترنت, استفاده می‌کنم이 합쳐진 문장입니다.
  prs.a1.unit30.lesson02.teach.review_peyam:
    title: 메시지
    gloss: 메시지
    note: پیام은 '메시지'라는 뜻입니다.
    target_text: پیام (메시지)
  prs.a1.unit30.lesson02.teach.mifrestam_phrase:
    title: 메시지를 보내요
    gloss: 메시지를 보내요
    note: می‌فرستم은 '저는 보내요'라는 뜻입니다. 7과에서 나온 메시지 동사 بگذارم(메시지를 남기다)과는 다른 새 동사입니다.
  prs.a1.unit30.lesson02.teach.review_zang_mizanam:
    title: 저는 전화해요
    gloss: 전화해요
    note: زنگ می‌زنم은 '저는 전화해요'라는 뜻입니다.
    target_text: زنگ می‌زنم (저는 전화해요)
  prs.a1.unit30.lesson02.teach.akas_migiram_phrase:
    title: 사진을 찍어요
    gloss: 사진을 찍어요
    note: عکس می‌گیرم은 می‌گیرم(저는 잡아요/받아요, 23과 복습)을 عکس와 함께 쓴 표현입니다.
  prs.a1.unit30.lesson02.teach.download_word:
    title: 다운로드
    gloss: 다운로드
    note: دانلود는 '다운로드'를 뜻하는 다리어의 표준 외래어이며, کردن(하다, 복습)과 결합하여 دانلود می‌کنم(저는 다운로드해요)처럼 씁니다.
    example_gloss: 저는 앱을 다운로드해요.
  prs.a1.unit30.lesson02.teach.want_download_app_phrase:
    title: 앱을 하나 다운로드하고 싶어요
    gloss: 앱을 하나 다운로드하고 싶어요
    note: 7과의 می‌خواهم یک پیام بگذارم(메시지를 남기고 싶어요)과 같이 می‌خواهم 뒤에 접속법이 오는 구조입니다.
  prs.a1.unit30.lesson03.teach.review_chand_bar:
    title: 몇 번 / 번
    gloss: 몇 / 번(횟수)
    note: چند بار는 여기서 빈도를 물을 때 쓰입니다.
    target_text: چند (몇) / بار (번, 횟수)
  prs.a1.unit30.lesson03.teach.review_ruz:
    title: 날 / 하루
    gloss: 하루, 날
    note: روز는 '날, 하루'라는 뜻입니다.
    target_text: روز (하루, 날)
  prs.a1.unit30.lesson03.teach.review_mikonin:
    title: 사용하세요 (격식)
    gloss: 사용하세요 (높임)
    note: استفاده می‌کنین은 존칭의 '사용하세요'이며, 29과의 ورزش می‌کنین 형태와 같습니다.
    target_text: استفاده می‌کنین (사용하세요, 높임)
  prs.a1.unit30.lesson03.teach.question_frequency:
    title: 하루에 휴대전화를 몇 번 사용하세요?
    gloss: 하루에 휴대전화를 몇 번 사용하세요?
    note: چند بار(몇 번), در روز(하루에), از موبایل(휴대폰을), استفاده می‌کنین(사용하세요)이 합쳐진 문장입니다.
  prs.a1.unit30.lesson03.teach.answer_har_ruz:
    title: 저는 매일 인터넷을 사용해요
    gloss: 저는 매일 인터넷을 사용해요.
    note: هر روز(매일)가 از انترنت استفاده می‌کنم과 함께 쓰였습니다.
  prs.a1.unit30.lesson04.teach.review_mikonad:
    title: (그/그녀가) 사용해요
    gloss: 그/그녀가 사용해요
    note: استفاده می‌کند는 3인칭 형태로, 29과에서 복습한 می‌کند 형태와 같습니다.
    target_text: استفاده می‌کند (그/그녀가 사용해요, 3인칭)
  prs.a1.unit30.lesson04.teach.review_to_miokni:
    title: 너 (친근한 표현) / 너는 사용해 (친근한 표현)
    gloss: 너(친근한 표현) / 너는 사용해(친근한 표현)
