    gloss: 자르미나, 너는 하루에 휴대전화를 몇 번 사용해?
  prs.a1.unit30.lesson04.teach.dialogue_line2:
    title: '자르미나: 저는 휴대폰을 많이 사용해요. 사진을 찍고 메시지를 보내요.'
    gloss: 저는 휴대전화를 많이 사용해요. 사진을 찍고 메시지를 보내요.
  prs.a1.unit30.lesson04.teach.dialogue_line3:
    title: '후마윤: 너는 컴퓨터를 사용해?'
