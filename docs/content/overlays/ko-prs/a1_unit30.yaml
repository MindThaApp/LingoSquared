    title: 저는 좋아해요 / 시간 / 저는 없어요
    gloss: 좋아해요 / 시간 / 없어요
    note: دوست دارم(좋아해요), وقت(시간), ندارم(없어요)은 모두 11과, 14과, 26과, 29과에서 배운 복습 표현입니다.
    target_text: دوست دارم (좋아해요) / وقت (시간) / ندارم (없어요)
  prs.a1.unit30.lesson06.teach.wrap_summary:
