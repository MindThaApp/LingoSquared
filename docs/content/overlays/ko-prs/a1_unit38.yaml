    note: اما는 한 색은 좋아하고 다른 색은 좋아하지 않는다는 것을 대조해요. دوست دارم과 دوست ندارم을 함께 써요.
  prs.a1.unit38.lesson06.teach.formal_question_phrase:
    title: 어떤 색을 좋아하세요?
    gloss: 어떤 색을 좋아하세요?
    note: 3과, 4과의 같은 질문에 شما(당신, 존칭)를 더해 학습자에게 직접 묻는 표현이에요.
