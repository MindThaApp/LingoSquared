course:
  title: 한국어로 배우는 다리어 A1
  description: '카불 다리어 초급: 돈과 결제 어휘, 결제 방법 묻기, صرافی(환전소)에서 환전하기, 그리고 زرمینه(자르미나)와 후마윤이 달러를 아프가니로 바꾸는 대화.'
units:
  prs.a1.unit23.money:
    title: 돈
    description: 환전, 결제, 결제 방법 묻기 같은 기본적인 돈 관련 상황을 해결해 보세요.
