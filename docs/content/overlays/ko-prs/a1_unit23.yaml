  prs.a1.unit23.lesson03.currency_exchange:
    title: 환전
  prs.a1.unit23.lesson04.exchange_dialogue:
    title: 환전소에서
  prs.a1.unit23.lesson05.reading_receipt:
    title: 영수증 읽기
  prs.a1.unit23.lesson06.wrap_up:
    title: 마무리
teaching:
  prs.a1.unit23.lesson01.teach.pul:
    title: 돈
    gloss: 돈
    note: پول은(는) '돈'이라는 뜻이에요.
    example_gloss: 돈이 있어요.
  prs.a1.unit23.lesson01.teach.naqd:
    title: 현금
    gloss: 현금
    note: نقد은(는) '현금'이라는 뜻이에요.
    example_gloss: 현금으로 결제해요.
  prs.a1.unit23.lesson01.teach.kart:
    title: 카드
    gloss: 카드
    note: کارت은(는) '카드'(결제 카드)라는 뜻이에요.
    example_gloss: 저는 카드가 있어요.
  prs.a1.unit23.lesson01.teach.dollar:
    title: 달러
    gloss: 달러
    note: دالر은(는) '달러'(USD)라는 뜻이에요. 아프가니에서 일상적인 환전 때 아프가니와 함께 널리 쓰이고 시세가 제시돼요.
    example_gloss: 저는 100달러가 있어요.
  prs.a1.unit23.lesson01.teach.review_dorom:
    title: 저는 ~이/가 있어요
    gloss: 저는 ~이/가 있어요
    note: دارم은(는) '저는 가지고 있어요'라는 뜻이에요 (10과 쇼핑에서 이미 나왔어요).
    example_gloss: 돈이 있어요.
  prs.a1.unit23.lesson01.teach.review_sad:
    title: 백
    gloss: 백
    note: صد은(는) '백'이라는 뜻이에요. 4과 숫자에서 나왔고 10과 쇼핑에서도 다시 쓰였어요.
    example_gloss: 저는 100달러가 있어요.
  prs.a1.unit23.lesson02.teach.mipardazam:
    title: 저는 결제해요
    gloss: 저는 결제해요
    note: می‌پردازم은(는) '저는 지불해요'라는 뜻이에요.
    example_gloss: 현금으로 결제해요.
  prs.a1.unit23.lesson02.teach.ya:
    title: 또는
    gloss: 또는
    note: یا은(는) '또는, 아니면'이라는 뜻이에요.
    example_gloss: 저는 현금이나 카드로 내요.
  prs.a1.unit23.lesson02.teach.naqdi_ya_karti:
    title: 현금이에요, 카드예요?
    gloss: 현금으로 내시겠어요, 카드로 내시겠어요?
    note: 가게나 환전소 창구에서 흔히 하는 질문이에요.
  prs.a1.unit23.lesson02.teach.review_mitanom:
    title: 저는 ~할 수 있어요
    gloss: 저는 ~할 수 있어요
    note: می‌توانم은(는) '저는 ~할 수 있어요'라는 뜻이에요 (앞에서 이미 나왔어요).
    example_gloss: 저는 현금으로 낼 수 있어요.
  prs.a1.unit23.lesson02.teach.bepardazam:
    title: 지불하다
    gloss: 지불하다
    note: بپردازم은(는) '지불하다'의 접속법 형태로, می‌توانم(~할 수 있어요) 뒤에 써요. می‌توانم نقد بپردازم은(는) 직역하면 '저는 현금으로 낼 수 있어요'예요.
    example_gloss: 저는 현금으로 낼 수 있어요.
  prs.a1.unit23.lesson03.teach.sarafi:
    title: 환전소
    gloss: 환전소
    note: صرافی은(는) 아프가니스탄에서 환전할 때 흔히 이용하는 실제 기관이에요. 공식 은행인 بانک과는 달라요.
    example_gloss: 저는 환전소에 가요.
  prs.a1.unit23.lesson03.teach.tabdil_kardan:
    title: 환전하다
    gloss: 환전하다
    note: تبدیل کردن은(는) (돈을) '환전하다'라는 뜻이에요.
    example_gloss: 저는 달러를 아프가니로 환전해요.
  prs.a1.unit23.lesson03.teach.narkh:
    title: 환율
    gloss: 환율
    note: نرخ은(는) '시세, 환율'이라는 뜻이에요.
    example_gloss: 오늘 달러 환율이 얼마예요?
  prs.a1.unit23.lesson03.teach.narkh_chand_ast:
    title: 오늘 환율이 얼마예요?
    gloss: 오늘 달러 환율이 얼마예요?
    note: 환율을 물을 때 쓰는 표준적인 표현이에요.
  prs.a1.unit23.lesson03.teach.review_afghani:
    title: 아프가니
    gloss: 아프가니
    note: افغانی은(는) 아프가니스탄의 화폐예요 (10과 쇼핑에서 "صد افغانی"처럼 이미 나왔어요).
    example_gloss: 저는 100아프가니가 있어요.
  prs.a1.unit23.lesson03.teach.review_ast_emroz_chand:
    title: '복습: ~이에요, 오늘, 얼마'
    gloss: ~이에요 / 오늘 / 얼마
    note: است, امروز, چند은(는) 앞에서 이미 배운 복습 단어로, 이번 과의 환율 질문에서 함께 쓰여요.
    example_gloss: 오늘 달러 환율이 얼마예요?
  prs.a1.unit23.lesson03.teach.review_ba_ra_mikonam:
    title: '복습: ~로, 목적어 표지, 저는 해요, 하다, 저는 원해요'
    gloss: ~로 / 목적어 표지 / 저는 해요 / 하다 / 저는 원해요
    note: به, را, می‌کنم, کنم, می‌خواهم은(는) 앞에서 이미 배운 복습 단어로, 이번 과의 환전 문장에서 함께 쓰여요.
    example_gloss: 저는 달러를 아프가니로 환전하고 싶어요.
  prs.a1.unit23.lesson04.teach.review_mikhaham:
    title: 원해요
    gloss: 저는 원해요
    note: می‌خواهم은(는) '저는 원해요'라는 뜻이에요 (앞 단원에서 이미 나왔어요).
    example_gloss: 저는 달러를 환전하고 싶어요.
  prs.a1.unit23.lesson04.teach.chand_darin:
    title: 몇 달러 있으세요?
    gloss: 달러를 얼마나 갖고 계세요?
    note: دارین은(는) '가지고 있다'의 공손한 형태(복수형)로, 손님에게 말할 때 써요.
  prs.a1.unit23.lesson04.teach.bufarmayin:
    title: 여기 있어요
    gloss: 여기 있어요
    note: بفرمایین은(는) 무언가를 건네줄 때 쓰는 공손한 표현이에요.
    example_gloss: 여기 있어요, 7천 아프가니예요.
  prs.a1.unit23.lesson04.teach.hazar:
    title: 천
    gloss: 천
    note: هزار은(는) '천'이라는 뜻이에요.
    example_gloss: 7천 아프가니예요.
  prs.a1.unit23.lesson04.teach.review_zarmina:
    title: 자르미나
    gloss: 자르미나
    note: 자르미나(زرمینه)는 계속 등장하는 고정 인물이에요.
    example_gloss: 자르미나가 환전소에 가요.
  prs.a1.unit23.lesson04.teach.review_besyar_khub:
    title: 아주 좋아요
    gloss: 아주 좋아요
    note: بسیار خوب은 이미 배운 표현으로, 여기서는 제안을 받아들일 때 써요.
    example_gloss: 아주 좋아요, 감사합니다.
  prs.a1.unit23.lesson04.teach.review_haftad_tashakor_kard:
    title: '복습: 칠십, 감사, 했다/만들었다'
    gloss: 칠십 / 감사합니다 / 했다, 만들었다 (그/그녀)
    note: هفتاد와 تشکر는 복습 단어예요. کرد는 کردن(하다/만들다)의 3인칭 과거형으로, 20단元 과거 시제 수업에서 이미 나왔어요. 여기서는 대화 내용을 정리하기 위해 함께 묶었어요.
    example_gloss: 자르미나는 100달러를 아프가니로 환전했어요.
  prs.a1.unit23.lesson04.teach.turn01:
    title: '자르미나: 안녕하세요, 달러를 아프가니로 환전하고 싶어요.'
    gloss: 안녕하세요, 달러를 아프가니로 환전하고 싶어요.
  prs.a1.unit23.lesson04.teach.turn02:
    title: '환전상: 달러를 얼마나 가지고 계세요?'
    gloss: 달러를 얼마나 갖고 계세요?
  prs.a1.unit23.lesson04.teach.turn03:
    title: '자르미나: 100달러 있어요. 오늘 환율이 얼마예요?'
    gloss: 100달러 있어요. 오늘 환율이 얼마예요?
  prs.a1.unit23.lesson04.teach.turn04:
    title: '환전상: 오늘 1달러는 70아프가니예요.'
    gloss: 오늘 1달러는 70아프가니예요.
  prs.a1.unit23.lesson04.teach.turn05:
    title: '자르미나: 아주 좋아요, 환전해 주세요.'
    gloss: 아주 좋아요, 환전해 주세요.
    note: تبدیل کنین은 "(부디) 환전해 주세요"라는 정중한 명령형이에요.
  prs.a1.unit23.lesson04.teach.turn06:
    title: '환전상: 여기 있습니다, 7,000아프가니예요.'
    gloss: 여기 있습니다, 7,000아프가니예요.
  prs.a1.unit23.lesson04.teach.turn07:
    title: '자르미나: 감사합니다.'
    gloss: 감사합니다.
  prs.a1.unit23.lesson05.teach.rasid:
    title: 영수증
    gloss: 영수증
    note: رسید는 영수증을 뜻해요.
    example_gloss: 영수증을 받아요.
  prs.a1.unit23.lesson05.teach.migiram:
    title: 저는 받아요 / 가져요
    gloss: 받아요 / 가져요
    note: می‌گیرم은 "저는 받아요/가져요"라는 뜻이에요.
    example_gloss: 저는 돈을 받아요.
  prs.a1.unit23.lesson05.teach.reading_text:
    title: 읽기 지문
    gloss: 자르미나는 환전소에 갔어요. 그녀는 100달러가 있었고 달러를 아프가니로 환전하고 싶었어요. 오늘 환율은 70아프가니였어요. 자르미나는 7,000아프가니를 받았고 영수증도 받았어요.
  prs.a1.unit23.lesson05.teach.review_raft:
    title: 갔어요
    gloss: 갔다
    note: رفت는 "갔어요"라는 뜻의 과거형이에요(그/그녀).
    example_gloss: 자르미나는 환전소에 갔어요.
  prs.a1.unit23.lesson05.teach.review_haft_gereft:
    title: '복습: 칠, 받았다(그/그녀), 내가 받았다'
    gloss: 칠 / 받았어요 (그/그녀) / 저는 받았어요
    note: هفت는 복습 숫자예요. گرفت와 گرفتم은 گرفتن(받다/가지다)의 3인칭과 1인칭 과거형으로, 여기서는 자르미나가 받은 금액을 말할 때 썼어요.
    example_gloss: 자르미나는 7,000아프가니를 받았어요.
  prs.a1.unit23.lesson06.teach.review_summary:
    title: 마무리 요약
    gloss: 저는 돈이 있어요. 현금과 카드요. 환전소에서 달러를 아프가니로 환전할 수 있어요. 오늘 환율은 1달러에 70아프가니예요.
  prs.a1.unit23.lesson06.teach.review_bara:
    title: ~를 위한
    gloss: ~를 위한
    note: برای는 "~에 대해, ~당, ~을 위해"라는 뜻이에요.
    example_gloss: 1달러에 70아프가니예요.
  prs.a1.unit23.lesson06.teach.review_va:
    title: 그리고
    gloss: 그리고
    note: و는 "~와/과, 그리고"라는 뜻이에요. 앞선 단원에서 이미 익숙해진 단어예요.
    example_gloss: 저는 돈이 있어요. 현금과 카드요.
exercises:
  prs.a1.unit23.lesson01.exercise01.recognize_pul:
    instruction: 올바른 번역을 고르세요.
    correct_option: 돈
    distractors:
    - 현금
    - 카드
    - 달러
    feedback: پول은 '돈'이라는 뜻이에요.
    accepted_answers:
    - value: 돈
      status: correct
  prs.a1.unit23.lesson01.exercise02.recognize_naqd:
    instruction: 올바른 번역을 고르세요.
    correct_option: 현금
    distractors:
    - 카드
    - 돈
    - 달러
    feedback: نقد는 현금을 뜻해요.
    accepted_answers:
    - value: 현금
      status: correct
  prs.a1.unit23.lesson01.exercise03.recognize_dollar_reading:
    instruction: 올바른 번역을 고르세요.
    correct_option: 달러
    distractors:
    - 아프가니
    - 현금
    - 카드
    feedback: دالر는 달러를 뜻해요.
    accepted_answers:
    - value: 달러
      status: correct
  prs.a1.unit23.lesson01.exercise04.match_money_words:
    instruction: 각 단어를 뜻과 짝지어 보세요.
    accepted_answers:
    - value:
        پول: 돈
        نقد: 현금
        کارت: 카드
        دالر: 달러
        قیمت: 가격
        افغانی: 아프가니
        گران: 비싼
        ارزان: 싼
    pairs:
    - left: پول
      right: 돈
    - left: نقد
      right: 현금
    - left: کارت
      right: 카드
    - left: دالر
      right: 달러
    - left: قیمت
      right: 가격
    - left: افغانی
      right: 아프가니
    - left: گران
      right: 비싼
    - left: ارزان
      right: 싼
  prs.a1.unit23.lesson01.exercise05.order_have_dollars:
    instruction: 단어를 올바른 순서로 배열하세요.
    accepted_answers:
    - صد دالر دارم
    feedback: 올바른 순서는 صد دالر دارم(100달러 있어요)이에요.
  prs.a1.unit23.lesson01.exercise06.translate_cash:
    instruction: '다리어로 번역하세요: 현금.'
    accepted_answers:
    - نقد
    feedback: نقد는 현금을 뜻해요.
  prs.a1.unit23.lesson01.exercise07.write_money_sentence:
    instruction: پول(돈)을 사용해서 문장을 써 보세요.
    accepted_answers:
    - پول
    - پول دارم
    feedback: پول을 사용한 올바른 문장이면 모두 정답이에요.
  prs.a1.unit23.lesson02.exercise01.recognize_payment_question:
    instruction: 올바른 번역을 고르세요.
    correct_option: 현금으로 내시겠어요, 카드로 내시겠어요?
    distractors:
    - 얼마예요?
    - 잔돈 있으세요?
    - 은행이 어디예요?
    feedback: نقدی می‌پردازین یا کارتی؟는 "현금으로 내시겠어요, 카드로 내시겠어요?"라는 뜻이에요.
    accepted_answers:
    - value: 현금으로 내시겠어요, 카드로 내시겠어요?
      status: correct
  prs.a1.unit23.lesson02.exercise02.recognize_mipardazam_reading:
    instruction: 올바른 번역을 고르세요.
    correct_option: 저는 지불해요
    distractors:
    - 나는 가지고 있어요
    - 저는 원해요
    - 저는 할 수 있어요
    feedback: می‌پردازم은 "저는 지불해요"라는 뜻이에요.
    accepted_answers:
    - value: 저는 지불해요
      status: correct
  prs.a1.unit23.lesson02.exercise03.match_payment_phrases:
    instruction: 각 표현을 알맞은 뜻과 연결하세요.
    accepted_answers:
    - value:
        می‌پردازم: 저는 결제해요
        نقدی می‌پردازین یا کارتی؟: 현금으로 내시겠어요, 카드로 내시겠어요?
        می‌توانم: 나는 할 수 있어요
        پول: 돈
        کارت: 카드
        یا: 또는
    pairs:
    - left: می‌پردازم
      right: 저는 결제해요
    - left: نقدی می‌پردازین یا کارتی؟
      right: 현금으로 내시겠어요, 카드로 내시겠어요?
    - left: می‌توانم
      right: 나는 할 수 있어요
    - left: پول
      right: 돈
    - left: کارت
      right: 카드
