course:
  title: 한국어로 배우는 다리어 A1
  description: '초급 아프가니스탄 다리어: 이름 주고받기, 출신지와 직업 말하기, 제3자 소개하기, 첫 만남에서 공손한 호칭과 말투를 알맞게 사용하기.'
units:
