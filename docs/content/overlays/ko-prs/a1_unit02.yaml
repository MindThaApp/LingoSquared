teaching:
  prs.a1.unit02.lesson01.teach.name_question_polite:
    title: 공손하게 이름 묻기
    gloss: 성함이 어떻게 되세요?
    note: نام‌تان چیست؟는 새로 알게 된 어른에게 쓰는 존중의 표현으로, 1과의 شما/استین 말투를 이어 갑니다.
  prs.a1.unit02.lesson01.teach.name_answer:
    title: است로 이름 말하기
    gloss: 제 이름은 파리둔입니다.
    note: نام من ... است는 이름을 말하는 글말 표현입니다. 대화에서는 보통 نامم ... است라고 합니다(نامم = نام + -م, 제 이름). 둘 다 맞는 표현입니다.
  prs.a1.unit02.lesson01.teach.i_am_name:
    title: استم으로 이름 말하기
    gloss: 저는 파리둔입니다.
    note: استم은 이름 바로 뒤에 붙으며, 1과에서 배운 1인칭 다리어 서술어와 같습니다.
  prs.a1.unit02.lesson01.teach.name_question_informal:
    title: 친한 친구에게 이름 묻기
    gloss: 이름이 뭐예요?
    note: نامت چیست؟는 친근한 소유 접미사 -ت를 씁니다. 1과의 تو/استی처럼 또래나 친한 친구에게만 쓰세요.
  prs.a1.unit02.lesson01.teach.what_is_your_name_word:
    title: ‘이름’이라는 단어
    gloss: 이름
    note: نام은 위의 공손한 질문과 친근한 질문에 모두 쓰이는 독립된 명사입니다.
    example_gloss: 네 이름이 뭐예요?
  prs.a1.unit02.lesson01.teach.register_note:
    title: 존댓말 소유형 vs. 친한 친구용 소유형
    gloss: -تان은 정중하게 대해야 하는 사람에게, -ت는 친한 친구에게 씁니다.
    note: 1단원의 شما/تو 구분은 نام에 붙는 소유 어미에도 똑같이 적용돼요.
  prs.a1.unit02.lesson02.teach.where_from_polite:
    title: 어디 출신인지 묻기
    gloss: 어디에서 오셨어요?
    note: شما از کجا استین؟ 문장은 존중을 나타내는 شما와 استین을 짝지어 씁니다.
  prs.a1.unit02.lesson02.teach.from_kabul:
    title: 카불 출신이라고 말하기
    gloss: 저는 카불 출신이에요.
    note: من از کابل استم은 어느 도시에나 쓸 수 있는 «من از [장소] استم» 형태를 따릅니다.
  prs.a1.unit02.lesson02.teach.from_herat:
    title: 헤라트 출신이라고 말하기
    gloss: 저는 헤라트 출신이에요.
    note: هرات은 아프가니스탄 서부의 주요 도시예요.
  prs.a1.unit02.lesson02.teach.from_mazar:
    title: 마자르이샤리프 출신이라고 말하기
    gloss: 저는 마자르이샤리프 출신이에요.
    note: مزار شریف는 두 단어로 띄어 쓰며, 아프가니스탄 북부의 주요 도시예요.
  prs.a1.unit02.lesson02.teach.country:
    title: 아프가니스탄
    gloss: 아프가니스탄
    note: افغانستان은 도시 이름처럼 از 뒤에 쓰입니다.
    example_gloss: 저는 아프가니스탄 출신이에요.
  prs.a1.unit02.lesson02.teach.city_word:
    title: ‘도시’라는 단어
    gloss: 도시
    note: شهر는 특정 도시의 이름이 아니라 도시 일반을 가리킵니다.
    example_gloss: 카불은 큰 도시예요.
  prs.a1.unit02.lesson03.teach.occupation_question:
    title: 직업 물어보기
    gloss: 직업이 무엇이에요?
    note: کار شما چیست؟는 글자 그대로 ‘당신의 일은 무엇입니까’라는 뜻으로, 직업을 묻는 일반적인 표현이에요.
  prs.a1.unit02.lesson03.teach.doctor:
    title: 의사
    gloss: 의사
    note: داکتر는 다리어에서 흔히 쓰는 직업 용어로, 의사를 가리키며 비공식적으로는 박사 학위가 있는 사람에게도 쓰입니다.
    example_gloss: 그는/그녀는 의사예요.
  prs.a1.unit02.lesson03.teach.teacher:
    title: 선생님
    gloss: 선생님
    note: معلم은 학교 급에 관계없이 쓰는 ‘교사’의 일반적인 말이에요.
    example_gloss: 그는/그녀는 교사예요.
  prs.a1.unit02.lesson03.teach.engineer:
    title: 엔지니어
    gloss: 엔지니어
    note: مهندس는 특정 공학 분야가 아니라 엔지니어 전반을 가리켜요.
    example_gloss: 그는/그녀는 엔지니어예요.
  prs.a1.unit02.lesson03.teach.shopkeeper:
    title: 가게 주인
    gloss: 가게 주인
    note: دوکاندار(دوکان ‘가게’에서 온 말)는 카불에서 일상적으로 쓰는 말이에요. 이 과정에서는 이란 페르시아어의 مغازه 대신 다리어 철자인 دوکان을 씁니다.
    example_gloss: 그는/그녀는 가게 주인이에요.
  prs.a1.unit02.lesson03.teach.i_am_teacher:
    title: 직업 말하기
    gloss: 저는 선생님이에요.
    note: من [직업] استم은 이 과에서 배운 모든 직업에 쓸 수 있는 형태예요.
  prs.a1.unit02.lesson04.teach.introduce_formal:
    title: 격식 있게 사람 소개하기
    gloss: 제 동료를 소개하겠습니다.
    note: اجازه بدهین همکارم را معرفی کنم은 제3자를 대화에 정중하게 끌어들이는 표현이에요.
  prs.a1.unit02.lesson04.teach.this_is:
    title: 소개하는 사람의 이름 말하기
    gloss: 이쪽은 제 동료 아르주예요.
    note: این [사람] است은 소개하는 사람이 누구인지 바로 알려 줍니다.
  prs.a1.unit02.lesson04.teach.pleased_after_intro:
    title: 만나서 반갑다고 말하기
    gloss: 만나서 반가워요.
    note: از آشنایی با شما خوش شدم은 1단원의 첫 만남 표현과 같으며, 제3자를 소개받은 뒤에도 다시 쓰입니다.
  prs.a1.unit02.lesson04.teach.pleased_reply:
    title: 저도 반갑다고 답하기
    gloss: 저도 반가워요.
    note: من هم خوش شدم은 자연스러운 짧은 대답이에요.
  prs.a1.unit02.lesson04.teach.friend_word:
    title: 친구
    gloss: 친구
    note: دوست는 친밀한 정도를 따로 나타내지 않는 ‘친구’의 일반적인 말이에요.
    example_gloss: 그는/그녀는 제 친구예요.
  prs.a1.unit02.lesson04.teach.colleague_word:
    title: 동료
    gloss: 동료
    note: همکار는 함께 일하는 사람을 뜻하며, 1단원의 직장 대화에서 이미 나왔어요.
    example_gloss: 그는/그녀는 제 동료예요.
  prs.a1.unit02.lesson05.teach.title_jenab:
    title: ~ 씨 / 선생님
    gloss: ~ 씨 / 선생님
    note: جناب는 남성의 이름이나 직함 앞에 붙이는 존칭으로, 아프가니스탄 도시에서 일상적으로 쓰입니다.
    example_gloss: 선생님, 먼저 하세요.
  prs.a1.unit02.lesson05.teach.title_khanom:
    title: ~ 씨 / ~ 여사
    gloss: ~ 씨 / ~ 여사
    note: خانم은 여성의 이름 앞에 붙이며, 결혼 여부와 관계없이 씁니다.
    example_gloss: 부인, 먼저 하세요.
  prs.a1.unit02.lesson05.teach.title_with_name:
    title: 남성을 정중하게 부르기
    gloss: 파리둔 씨
    note: جناب 뒤에 이름만 붙여도 정중한 호칭이 되며, 성이 꼭 필요하지는 않아요.
  prs.a1.unit02.lesson05.teach.title_with_name_female:
    title: 여성을 정중하게 부르기
    gloss: 아르주 씨
    note: خانم 뒤에 이름을 붙이는 방식은 남성에게 쓰는 جناب와 같아요.
  prs.a1.unit02.lesson05.teach.register_reminder:
    title: 각각 언제 쓰는지
    gloss: 방금 만난 사람에게는 شما와 استین을, 친한 친구에게만 تو와 استی를 쓰세요.
    note: 1단원의 높임 규칙을 소개 상황에 맞게 다시 정리한 내용이에요.
  prs.a1.unit02.lesson05.teach.polite_could_you:
    title: 이름을 다시 말해 달라고 정중하게 부탁하기
    gloss: 성함을 다시 말씀해 주시겠어요?
    note: می‌توانین نام‌تان را دوباره بگویین؟는 어색함 없이 정중하게 다시 말해 달라고 부탁하는 자연스러운 표현이에요.
  prs.a1.unit02.lesson06.teach.gathering_word:
    title: 모임 / 파티
    gloss: 모임
    note: مهمانی는 격식 없는 사교 모임을 뜻하며, 이 과의 대화 배경이에요.
    example_gloss: 모임이 좋아요.
  prs.a1.unit02.lesson06.teach.turn01:
    title: 레일라가 인사하며 소개를 시작해요
    gloss: 레일라가 파리둔에게 인사하고, 존칭 جناب로 부르며 이름을 묻습니다.
    note: 레일라와 파리둔은 처음 만났기 때문에, 처음부터 높임 표현을 써요.
  prs.a1.unit02.lesson06.teach.turn02:
    title: 파리둔이 이름을 말해요
    gloss: 파리둔이 인사에 답하고 자기 이름을 말합니다.
    note: سلام علیکم은 1단원에서 배운 더 격식 있는 인사로, 첫 만남에 알맞아요. 대화에서 파리둔은 일상 구어 형태인 نامم فریدون است(نامم = نام من, 제 이름)라고 말합니다.
  prs.a1.unit02.lesson06.teach.turn03:
    title: 레일라가 어디 출신인지 물어요
    gloss: 레일라가 만나서 반갑다고 말하고, 어디 출신인지 묻습니다.
    note: 같은 표현 از آشنایی با شما خوش شدم이 1단원의 직장 대화에서 그대로 이어져요.
  prs.a1.unit02.lesson06.teach.turn04:
    title: 파리둔이 대답하고 같은 질문을 되물어요
    gloss: 파리둔이 헤라트 출신이라고 말하고, 레일라에게 같은 질문을 합니다.
    note: و شما؟는 1단원에서 본 것처럼 질문을 간단히 되묻는 표현이에요.
  prs.a1.unit02.lesson06.teach.turn05:
    title: 레일라가 대답하고 직업을 물어요
    gloss: 레일라가 카불 출신이라고 말하고, 파리둔의 직업을 묻습니다.
    note: 대화는 자연스럽게 출신지에서 직업으로 넘어가요.
  prs.a1.unit02.lesson06.teach.turn06:
    title: 파리둔이 대답하고 되물어요
    gloss: 파리둔이 엔지니어라고 말하고, 레일라에게 같은 질문을 합니다.
    note: شما چطور؟는 문맥으로 이미 알 수 있는 질문을 짧게 되묻는 표현이에요.
  prs.a1.unit02.lesson06.teach.turn07:
    title: 레일라가 직업을 말해요
    gloss: 레일라가 교사라고 말합니다.
    note: 이 단원 앞부분에서 배운 형태로 직업 주고받기를 마무리해요.
  prs.a1.unit02.lesson06.teach.turn08:
    title: 파리둔이 제3자를 소개해요
    gloss: 파리둔이 동료 아르주를 소개합니다.
    note: lesson04에서 배운 격식 있는 소개 표현으로 세 번째 사람이 대화에 합류해요.
  prs.a1.unit02.lesson06.teach.turn09:
    title: 레일라가 아르주를 환영해요
    gloss: 레일라가 아르주를 존칭 خانم으로 부르며 환영합니다.
    note: خوش آمدین은 1단원에서 배운 환영 표현으로, 여기서는 새로 소개받은 사람에게 쓰였어요.
  prs.a1.unit02.lesson06.teach.turn10:
    title: 아르주가 답해요
    gloss: 아르주가 레일라에게 감사하고, 만나서 기쁘다고 말합니다.
    note: از دیدن شما خوشحال شدم은 آشنایی 대신 دیدن(‘봄’)을 쓴, 만나서 반갑다는 표현의 자연스러운 변형이에요.
exercises:
  prs.a1.unit02.lesson01.exercise01.recognize_name_question:
    instruction: 상대의 이름을 정중하게 묻는 표현은 어느 것일까요?
    correct_option: 성함이 어떻게 되세요? (정중하게)
    distractors:
    - 이름이 뭐야? (친근하게)
    - 직업이 무엇이에요?
    - 어디 출신이에요?
    accepted_answers:
    - value: 성함이 어떻게 되세요? (정중하게)
      status: correct
    feedback: نام‌تان چیست؟는 새로 알게 된 사람에게 쓰는 정중한 표현이에요.
  prs.a1.unit02.lesson01.exercise02.recognize_polite_vs_informal:
    instruction: نامت چیست؟는 다음 중 누구에게 묻기에 알맞을까요?
    correct_option: 친한 친구
    distractors:
    - 방금 만난 낯선 사람
    - 공식 행사에서 만난 어르신
    - 가게에 온 손님
    accepted_answers:
    - value: 친한 친구
      status: correct
    feedback: نامت의 -ت 소유형은 친한 친구나 동년배에게만 어울려요. 1단원의 تو/استی와 같은 규칙이에요.
  prs.a1.unit02.lesson01.exercise03.recognize_name_question_reading:
    instruction: 이 질문은 무엇을 묻고 있나요?
    correct_option: 이름이 뭐예요?
    distractors:
    - 직업이 무엇이에요?
    - 어디 출신이에요?
    - 당신은요?
    accepted_answers:
    - value: 이름이 뭐예요?
      status: correct
    feedback: نام‌تان چیست؟는 이름을 묻는 말이에요.
  prs.a1.unit02.lesson01.exercise04.match_name_forms:
    instruction: 각 표현에 알맞은 뜻을 연결하세요.
    accepted_answers:
    - value:
        نام‌تان چیست؟: 성함이 어떻게 되세요? (공손한 표현)
        نامت چیست؟: 이름이 뭐야? (친근한 표현)
        نام: 이름
      status: correct
    feedback: نام‌تان과 نامت는 뜻이 아니라 높임 정도만 달라요.
    pairs:
    - left: نام‌تان چیست؟
      right: 성함이 어떻게 되세요? (공손한 표현)
    - left: نامت چیست؟
      right: 이름이 뭐야? (친근한 표현)
    - left: نام
      right: 이름
  prs.a1.unit02.lesson01.exercise05.order_name_answer:
    instruction: 단어를 배열해서 «제 이름은 파리둔이에요.»라고 말해 보세요.
    accepted_answers:
    - value:
      - نام
      - من
      - فریدون
      - است
      status: correct
    feedback: نام من فریدون است는 명사 뒤에 است가 오는 구조입니다.
  prs.a1.unit02.lesson01.exercise06.translate_name_answer:
