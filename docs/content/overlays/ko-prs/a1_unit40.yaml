course:
  title: 한국어로 배우는 다리어 A1
  description: '초급 카불 다리어: 기본적인 응급 상황을 알아차리고, 도움을 요청하고, 경찰·구급차·소방서 중 무엇이 필요한지 말하고, 부상을 설명하고, 응급 상황에 관한 짧은 글을 읽어 봅니다.'
units:
  prs.a1.unit40.emergencies:
    title: 응급 상황
    description: 기본적인 응급 상황을 알아차리고, 도움을 요청하고, 어떤 도움(경찰, 구급차, 소방서)이 필요한지 말해 봅니다.
lessons:
  prs.a1.unit40.lesson01.emergency_types:
    title: 응급 도움
  prs.a1.unit40.lesson02.asking_for_help:
    title: 도움 요청하기
  prs.a1.unit40.lesson03.describing_the_emergency:
    title: 다침과 출혈
  prs.a1.unit40.lesson04.emergency_dialogue:
    title: 응급 상황 대화
  prs.a1.unit40.lesson05.emergency_reading:
    title: 응급 도움에 관한 읽기
  prs.a1.unit40.lesson06.wrap_up:
    title: 마무리
teaching:
  prs.a1.unit40.lesson01.teach.review_help_want:
    title: '복습: 도움, 원해요'
    gloss: 도움 / 저는 원해요
    note: کمک과 می‌خواهم은 이 단원 내내 어떤 도움이 필요한지 말할 때 쓰는 복습 단어예요.
    target_text: کمک (도움) / می‌خواهم (원해요)
  prs.a1.unit40.lesson01.teach.review_this_is:
    title: '복습: 이것, ~이다'
    gloss: 이것 / ~이다
    note: این과 است는 어떤 상황인지 말할 때 쓰는 초반에 배운 복습 단어예요.
    target_text: این (이것) / است (이에요)
  prs.a1.unit40.lesson01.teach.emergency_word:
    title: 응급 상황
    gloss: 응급 상황
    note: اضطراری는 '응급' 또는 '긴급'이라는 뜻이에요.
    example_gloss: 응급 상황이에요.
  prs.a1.unit40.lesson01.teach.police_word:
    title: 경찰
    gloss: 경찰
    note: پولیس는 아프가니스탄 다리어에서 '경찰'을 뜻하는 표준 단어예요. 영어 단어를 빌려 온 말이라 한국어의 외래어처럼 소리가 비슷해요.
    example_gloss: 경찰이 필요해요.
  prs.a1.unit40.lesson01.teach.ambulance_word:
    title: 구급차
    gloss: 구급차
    note: امبولانس는 '구급차'라는 뜻이에요.
    example_gloss: 구급차가 필요해요.
  prs.a1.unit40.lesson01.teach.fire_word:
    title: 불
    gloss: 불
    note: آتش는 '불'이라는 뜻이에요.
    example_gloss: 불이 났어요.
  prs.a1.unit40.lesson01.teach.fire_brigade_word:
    title: 소방서
    gloss: 소방서
    note: اطفائیه는 카불에서 소방서를 가리킬 때 일상적으로 쓰는 말이에요.
    example_gloss: 소방서가 필요해요.
  prs.a1.unit40.lesson01.teach.emergency_help_phrase:
    title: 응급 상황이에요! 경찰이 필요해요!
    gloss: 응급 상황이에요! 경찰이 필요해요!
    note: این اضطراری است는 این(이것), اضطراری(응급), است(~이다)를 합친 문장이에요.
  prs.a1.unit40.lesson02.teach.review_can_you_do:
    title: '복습: 할 수 있어요?, 해 주세요(정중한 명령), ~에게/~을 위해, 빨리'
    gloss: 할 수 있어요? / 해 주세요 / ~에게·~을 위해 / 빨리
    note: 앞 단원에서 배운 می‌توانین, کنین, به, زود는 다른 단어와 결합해 정중한 요청과 부탁을 만들어요.
    target_text: می‌توانین (할 수 있으세요) / کنین (해 주세요 -- 정중한 명령형) / به (~에게/~을 위해) / زود (빨리)
  prs.a1.unit40.lesson02.teach.mera_word:
    title: 나를
    gloss: 나를
    note: مه ره는 목적어로 쓰는 '나를'을 뜻하는 카불 다리어 구어체로, 문어체 مرا와 같아요. مه는 من의 구어형이고 ره는 목적격 표지 را의 구어형이에요. 글에서는 보통 مرا를 쓰며, 이것도 정답으로 인정돼요.
    example_gloss: 저를 도와줄 수 있어요?
  prs.a1.unit40.lesson02.teach.can_you_help_me_phrase:
    title: 저를 도와줄 수 있어요?
    gloss: 저를 도와줄 수 있어요?
    note: 도움을 직접 요청할 때 실제로 흔히 쓰는 다리어 표현이에요.
  prs.a1.unit40.lesson02.teach.call_word:
    title: 전화하세요! (명령형)
    gloss: 전화하세요
    note: زنگ بزنین은 زنگ زدن(전화하다)의 정중한 명령형으로, 이미 배운 زنگ می‌زنم(제가 전화해요)을 바탕으로 한 형태예요.
    example_gloss: 경찰에 전화하세요!
  prs.a1.unit40.lesson02.teach.come_word:
    title: 오세요! (명령형)
    gloss: 오세요
    note: بیایین은 آمدن(오다)의 정중한 명령형이에요.
    example_gloss: 빨리 오세요!
  prs.a1.unit40.lesson02.teach.call_ambulance_phrase:
    title: 구급차를 불러 주세요!
    gloss: 구급차를 불러 주세요!
    note: به(~에게)에 امبولانس(구급차)와 명령형 زنگ بزنین이 이어진 문장이에요.
  prs.a1.unit40.lesson03.teach.review_he_she_has:
    title: '복습: 그/그녀, 그/그녀는 가지고 있어요'
    gloss: 그/그녀 / 그/그녀는 가지고 있어요
    note: او와 دارد는 응급 상황에서 다른 사람의 상태를 설명할 때 쓰는 복습 표현이에요.
    target_text: او (그/그녀) / دارد (그/그녀가 가지고 있어요)
  prs.a1.unit40.lesson03.teach.injured_word:
    title: 다친
    gloss: 다친
    note: زخمی는 '다친', '부상당한'이라는 뜻이에요.
    example_gloss: 그 사람은 다쳤어요.
  prs.a1.unit40.lesson03.teach.bleeding_word:
    title: 출혈
    gloss: 출혈
    note: خون‌ریزی는 '출혈'이라는 뜻이에요.
    example_gloss: 그 사람은 피를 흘리고 있어요.
  prs.a1.unit40.lesson03.teach.injured_ambulance_phrase:
    title: 그 사람이 다쳤어요! 구급차가 필요해요!
    gloss: 그 사람이 다쳤어요! 구급차가 필요해요!
    note: زخمی에 이미 배운 امبولانس می‌خواهم을 결합한 문장이에요.
  prs.a1.unit40.lesson03.teach.bleeding_come_quickly_phrase:
    title: 그 사람이 피를 흘리고 있어요! 빨리 오세요!
    gloss: 그 사람이 피를 흘리고 있어요! 빨리 오세요!
    note: خون‌ریزی에 이미 배운 زود بیایین을 결합한 문장이에요.
  prs.a1.unit40.lesson04.teach.review_dialogue_words:
    title: '복습: 무엇, 그/그녀가 와요, 제가 전화해요, 정말 감사합니다'
    gloss: 무엇 / 그/그녀가 와요 / 제가 전화해요 / 정말 감사합니다
    note: چه, می‌آید, زنگ می‌زنم, تشکر زیاد는 응급 상황 대화에 쓰인 복습 단어예요.
    target_text: چه (무엇) / می‌آید (그/그녀가 와요) / زنگ می‌زنم (전화해요) / تشکر زیاد (정말 감사합니다)
  prs.a1.unit40.lesson04.teach.dialogue_line1:
    title: '후마윤: 자르미나, 도와줘요! 도와줘요!'
    gloss: 자르미나, 도와줘요! 도와줘요!
  prs.a1.unit40.lesson04.teach.dialogue_line2:
    title: '자르미나: 뭐예요?'
    gloss: 뭐예요?
  prs.a1.unit40.lesson04.teach.dialogue_line3:
    title: '후마윤: 그 사람이 다쳤어요! 피를 흘리고 있어요!'
    gloss: 그 사람이 다쳤어요! 피를 흘리고 있어요!
  prs.a1.unit40.lesson04.teach.dialogue_line4:
    title: '자르미나: 구급차가 필요해요. 제가 전화할게요!'
    gloss: 구급차가 필요해요. 제가 전화할게요!
  prs.a1.unit40.lesson04.teach.dialogue_line5:
    title: '후마윤: 정말 감사합니다!'
    gloss: 정말 고마워요!
  prs.a1.unit40.lesson04.teach.dialogue_line6:
    title: '자르미나: 구급차가 금방 와요.'
    gloss: 구급차가 금방 와요.
  prs.a1.unit40.lesson05.teach.review_reading_words:
    title: '복습: 하나, 사람, 도시, 그/그녀가 해요, ~에서'
    gloss: 하나 / 사람 / 도시 / 그/그녀가 해요 / ~에서
    note: یک, نفر, شهر, می‌کند, در는 이 읽기 글에 쓰인 복습 단어예요.
    target_text: یک (하나) / نفر (사람) / شهر (도시) / می‌کند (그/그녀가 해요) / در (~에서)
  prs.a1.unit40.lesson05.teach.reading_passage:
    title: 응급 상황에 관한 읽기
    gloss: 도시에서 한 사람이 다쳤어요. 그 사람은 피를 흘리고 있어요. 후마윤이 도와줘요. 구급차가 와요.
  prs.a1.unit40.lesson06.teach.review_wrap_up_words:
    title: '복습: 전화기, 저는 없어요, 하지만, 당신(존칭)'
    gloss: 전화기 / 저는 없어요 / 하지만 / 당신(존칭)
    note: تلفن, ندارم, اما, شما는 필요와 제약을 대비해 말하거나 정중하게 질문할 때 쓰는 복습 단어예요.
    target_text: تلفن (전화기) / ندارم (없어요) / اما (하지만) / شما (당신, 존칭)
  prs.a1.unit40.lesson06.teach.contrast_phrase:
    title: 도움이 필요하지만 전화기가 없어요
    gloss: 도움이 필요하지만 전화기가 없어요.
    note: اما는 도움이 필요하다는 것과 전화기가 없다는 것을 대비시켜요.
  prs.a1.unit40.lesson06.teach.formal_question_phrase:
    title: 도와줄 수 있어요?
    gloss: 도와주실 수 있어요?
    note: شما를 붙여서 도움을 정중하게 직접 요청하는 표현이에요.
