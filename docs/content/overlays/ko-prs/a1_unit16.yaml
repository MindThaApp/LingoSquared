teaching:
  prs.a1.unit16.lesson01.teach.belit_word:
    title: 표
    gloss: 승차권
    note: تکت은 '티켓'이라는 뜻이에요. 아프가니스탄 다리어에서 일상적으로 쓰는 단어예요. بلیط(بلیت로도 씀, 이란식 단어)도 이해되고 인정되지만, 보통 듣게 되는 말은 تکت이에요.
    example_gloss: 저는 표가 있어요.
  prs.a1.unit16.lesson01.teach.qatar_word:
    title: 기차
    gloss: 기차
    note: قطار는 '기차'라는 뜻이에요.
    example_gloss: 기차가 좋아요.
  prs.a1.unit16.lesson01.teach.bas_word:
    title: 버스
    gloss: 버스
    note: بس는 '버스'라는 뜻으로, 아프가니스탄 다리어에서 흔히 쓰는 말이에요.
    example_gloss: 버스가 좋아요.
  prs.a1.unit16.lesson01.teach.maidan_hawayi_word:
    title: 공항
    gloss: 공항
    note: میدان هوایی는 '공항'이라는 뜻이에요. 이 과정에서 쓰는 아프가니스탄 다리어 표현이고(이란식 فرودگاه이 아니에요), 5단원과 같아요.
    example_gloss: 공항이 좋아요.
  prs.a1.unit16.lesson01.teach.yak_word:
    title: A/one
    gloss: 한 / 하나
    note: یک는 '하나'라는 뜻이고, 여기서는 '한'처럼 쓰여요(표 한 장).
    target_text: یک (하나/한)
  prs.a1.unit16.lesson01.teach.az_word:
    title: From
    gloss: ~에서
    note: از는 출발점을 나타내는 '~에서'라는 뜻이에요. 비교에서 '~보다'로 쓰이는 از와는 쓰임이 달라요.
    target_text: از (~에서)
  prs.a1.unit16.lesson01.teach.doo_word:
    title: 이
    gloss: 이
    note: دو는 '둘, 2'라는 뜻이에요.
    example_gloss: 저는 티켓이 두 장 있어요.
  prs.a1.unit16.lesson01.teach.sekooye_word:
    title: Platform two
    gloss: 2번 승강장
    note: سکوی دو는 سکو(승강장)에 에자페 연결 -ی와 دو(둘)를 합친 표현이에요.
    target_text: سکوی دو (2번 승강장)
  prs.a1.unit16.lesson02.teach.herat_word:
    title: 헤라트
    gloss: 헤라트
    note: 아프가니스탄 서부의 주요 도시예요.
    example_gloss: 저는 헤라트에 가요.
  prs.a1.unit16.lesson02.teach.mikhaham_word:
    title: I want
    gloss: 저는 원해요
    note: می‌خواهم은 '원해요'의 줄이지 않은 완전한 형태로, 이 과정의 말투와 잘 맞아요.
    target_text: می‌خواهم (원해요)
  prs.a1.unit16.lesson02.teach.be_word:
    title: To
    gloss: ~에, ~(으)로
    note: به는 목적지를 나타내요. به هرات은 '헤라트로/헤라트에'라는 뜻이에요.
    target_text: به (~로/~에)
  prs.a1.unit16.lesson02.teach.belit_be_herat_phrase:
    title: 헤라트행 티켓 한 장 주세요
    gloss: 헤라트행 티켓 한 장 주세요
    note: یک تکت به هرات می‌خواهم은 이 과의 어휘를 합쳐 티켓을 요청하는 표준적인 표현이에요.
  prs.a1.unit16.lesson03.teach.sekoo_word:
    title: 승강장
    gloss: 승강장
    note: سکو는 '승강장'(기차역의)이라는 뜻이에요.
    example_gloss: 기차는 2번 승강장에서 출발해요.
  prs.a1.unit16.lesson03.teach.harekat_mikonad_phrase:
    title: It departs
    gloss: 출발해요
    note: حرکت می‌کند는 '출발해요/움직여요'의 줄이지 않은 완전한 형태예요.
    target_text: حرکت می‌کند (출발해요)
  prs.a1.unit16.lesson03.teach.kay_word:
    title: When
    gloss: 언제
    note: کی는 '언제'라는 뜻으로, 시간을 물을 때 써요.
    target_text: کی (언제)
  prs.a1.unit16.lesson04.teach.sobh_word:
    title: 아침
    gloss: 아침
    note: صبح는 '아침'이라는 뜻이에요.
    example_gloss: 기차는 아침 여덟 시에 출발해요.
  prs.a1.unit16.lesson04.teach.schedule_text:
    title: 시간표 예문
    gloss: 헤라트행 기차는 아침 8시에 2번 승강장에서 출발해요.
    note: 이 단원의 여행 어휘를 묶은 짧은 안내문이에요. 음성이 없으므로 이 글이 역 안내 방송을 대신해요.
  prs.a1.unit16.lesson05.teach.farda_word:
    title: 내일
    gloss: 내일
    note: فردا는 '내일'이라는 뜻이에요.
    example_gloss: 내일 아침에 가요.
  prs.a1.unit16.lesson05.teach.besyar_khoob_word:
    title: 아주 좋아요 / 알겠어요
    gloss: 아주 좋아요 / 알겠어요
    note: بسیار خوب은 '알겠어요, 아주 좋아요'를 뜻하는 격식을 갖춘 표현으로, 이 코스의 말투에 맞아요. 구어체 باشه와는 달라요.
    example_gloss: 기차가 아주 좋아요.
  prs.a1.unit16.lesson05.teach.dialogue_line1:
    title: 여행객이 말해요
    gloss: 헤라트행 표를 한 장 원해요.
  prs.a1.unit16.lesson05.teach.dialogue_line2:
    title: 판매원이 물어요
    gloss: 언제 가고 싶으세요?
  prs.a1.unit16.lesson05.teach.dialogue_line3:
    title: 여행객이 대답해요
    gloss: 내일 아침이요.
  prs.a1.unit16.lesson05.teach.dialogue_line4:
    title: 판매원이 확인해 줘요
    gloss: 좋아요, 기차는 아침 8시에 2번 승강장에서 출발해요.
  prs.a1.unit16.lesson06.teach.tashakor_ziyad_word:
    title: 정말 고마워요
    gloss: 정말 고마워요
    note: تشکر زیاد는 '정말 고맙습니다'라고 할 때 흔히 쓰는 공손한 표현이에요. 5단원과 6단원에서 이미 배웠어요.
  prs.a1.unit16.lesson06.teach.qabeli_nadara_phrase:
    title: 천만에요
    gloss: 천만에요
    note: قابلی نداره는 감사 인사에 대한 기본적인 공손한 대답('천만에요')이에요. 5단원과 6단원에서 이미 배웠어요.
  prs.a1.unit16.lesson06.teach.safar_khosh_phrase:
    title: 즐거운 여행 되세요
    gloss: 즐거운 여행 되세요
    note: سفر خوش는 여행을 떠나는 사람에게 건네는 흔한 작별 인사예요. 6단원에서 이미 배웠어요.
  prs.a1.unit16.lesson06.teach.va_word:
    title: And
    gloss: 그리고
    note: و는 두 절이나 항목을 이어 주는 '그리고, ~와/과'라는 뜻이에요.
    target_text: و (그리고)
