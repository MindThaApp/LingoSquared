    example_gloss: 왼쪽으로 도세요.
  prs.a1.unit06.lesson01.teach.right:
    title: 오른쪽
    gloss: 오른쪽
    note: راست는 오른쪽 방향이에요.
    example_gloss: 오른쪽으로 도세요.
  prs.a1.unit06.lesson01.teach.turn_verb:
    title: 돌다 (공손한 명령형)
    gloss: 돌다
    note: بپیچین은 "돌다"라는 동사의 공손한 명령형으로, 누군가에게 길을 안내할 때 써요.
    example_gloss: 오른쪽으로 도세요.
  prs.a1.unit06.lesson01.teach.to_word:
    title: ~로 / ~를 향해
    gloss: ~로 / ~쪽으로
    note: به는 به چپ(왼쪽으로)처럼 방향을 나타내는 말과 함께 써요.
    target_text: به (~로/~쪽으로)
  prs.a1.unit06.lesson02.teach.go_straight:
    title: 직진하라고 말하기
    gloss: 곧장 가세요.
    note: مستقیم بروین은 기본적인 길 안내 표현으로, 공손한 명령형이에요.
  prs.a1.unit06.lesson02.teach.turn_left:
    title: 왼쪽으로 돌라고 말하기
    gloss: 왼쪽으로 도세요.
    note: به چپ بپیچین은 글자 그대로 "왼쪽으로 도세요"라는 뜻이에요.
  prs.a1.unit06.lesson02.teach.turn_right:
    title: 오른쪽으로 돌라고 말하기
    gloss: 오른쪽으로 도세요.
    note: به راست بپیچین은 چپ 대신 راست를 쓸 뿐 같은 형태예요.
  prs.a1.unit06.lesson03.teach.first_word:
    title: 먼저
    gloss: 먼저
    note: اول은 길 안내에서 첫 번째 단계를 나타내요.
    example_gloss: 먼저 직진하세요.
  prs.a1.unit06.lesson03.teach.then_word:
    title: 그다음에
    gloss: 그다음에
    note: بعد는 첫 번째 다음 단계를 나타내요.
    example_gloss: 그다음에 왼쪽으로 도세요.
  prs.a1.unit06.lesson03.teach.sequenced_example:
    title: 두 단계 길 안내를 연결하기
    gloss: 먼저 직진한 다음, 오른쪽으로 도세요.
    note: اول과 بعد를 쓰면 한 번에 여러 단계의 길 안내를 순서대로 말할 수 있어요.
  prs.a1.unit06.lesson04.teach.polite_ask:
    title: 공손하게 가는 방법 묻기
    gloss: 시장에 어떻게 가는지 알려 주실 수 있나요?
    note: می‌توانین بگویین...؟은 "~를 알려 주실 수 있나요?"라고 공손하게 묻는 표현으로, 모르는 사람에게 길을 물을 때 알맞아요. بروم은 "제가 가다"라는 뜻이라, 문장 전체는 그곳에 어떻게 갈 수 있는지 묻는 말이에요.
  prs.a1.unit06.lesson04.teach.bebakhshid_review:
    title: 장소가 어디인지 묻기 (복습)
    gloss: 실례합니다, 약국이 어디예요?
    note: ببخشین، [장소] کجاست؟는 장소 단원에서 배웠어요. 길을 묻기 전에 꺼내기 좋은 자연스러운 첫마디예요.
  prs.a1.unit06.lesson04.teach.fahmidam:
    title: 이해했다고 확인하기
    gloss: 대단히 감사합니다, 알겠어요.
    note: تشکر زیاد، فهمیدم은 대화를 공손하게 마무리하면서 길 안내를 잘 이해했음을 알리는 표현이에요.
  prs.a1.unit06.lesson04.teach.daftar_review:
    title: 사무실 (복습)
    gloss: 사무실
    note: دفتر는 앞선 단원에서 이미 배웠어요. 여기서는 공손하게 길을 묻는 표현을 연습하는 목적지로 쓰여요.
    example_gloss: 사무실은 가까워요.
  prs.a1.unit06.lesson05.teach.after_word:
    title: ~ 다음에
    gloss: ~ 후에
    note: بعد از는 목적지보다 앞에 나오는 랜드마크를 나타내요.
    example_gloss: 모스크를 지나면 은행이 있어요.
  prs.a1.unit06.lesson05.teach.opposite_review:
    title: 맞은편에
    gloss: 맞은편에
    note: روبه‌رو는 장소 단원에서 배운 مقابل(맞은편)과 뜻이 같은 새 단어예요. 일상 다리어에서 둘 다 "맞은편"의 뜻으로 쓰여요.
    example_gloss: 은행은 모스크 맞은편에 있어요.
  prs.a1.unit06.lesson05.teach.landmark_example:
    title: 랜드마크로 길 안내하기
    gloss: 모스크를 지나면 은행이 맞은편에 있어요.
    note: بعد از مسجد، بانک روبه‌روی شماست는 랜드마크(بعد از مسجد)와 상대적인 위치(روبه‌روی شماست)를 함께 쓴 문장이에요.
  prs.a1.unit06.lesson05.teach.maktab_review:
    title: 학교 (복습)
    gloss: 학교
    note: مکتب은 장소 단원에서 배웠어요. 여기서는 연습 문장에서 랜드마크로 쓰여요.
    example_gloss: 학교는 가까워요.
  prs.a1.unit06.lesson06.teach.turn01:
    title: 소하일라가 길을 묻다
    gloss: 소하일라가 가게 주인에게 약국에 어떻게 가는지 공손하게 물어봐요.
    note: ببخشین은 정중하게 질문을 시작하는 말이고, می‌توانین بگویین؟은 4과에서 배운 공손하게 길을 묻는 표현이에요.
  prs.a1.unit06.lesson06.teach.turn02:
    title: 가게 주인이 첫 단계를 알려 주다
    gloss: 가게 주인이 그렇다고 답하고 먼저 직진하라고 말해요.
    note: اول مستقیم بروین으로 길 안내의 순서가 시작돼요.
  prs.a1.unit06.lesson06.teach.turn03:
    title: 소하일라가 확인하고 다음 단계를 묻다
    gloss: 소하일라는 "직진"이라고 따라 말해 확인한 뒤, 그다음에는 어떻게 하는지 물어봐요.
    note: بعد چطور؟는 다음 단계를 간단하고 자연스럽게 묻는 말이에요.
  prs.a1.unit06.lesson06.teach.turn04:
    title: 가게 주인이 두 번째 단계와 랜드마크를 알려 주다
    gloss: 가게 주인은 왼쪽으로 돌라고 말한 뒤, 모스크와 은행을 랜드마크로 삼아 약국의 위치를 알려 줘요.
    note: 2과의 회전 안내 표현과 5과의 랜드마크 표현을 합친 문장이에요.
  prs.a1.unit06.lesson06.teach.turn05:
    title: 소하일라가 감사 인사를 하고 이해했다고 말하다
    gloss: 소하일라는 대단히 감사하다고 하고 이해했다고 말해요.
    note: تشکر زیاد، فهمیدم은 4과에서 배운 대로 대화를 마무리하는 표현이에요.
  prs.a1.unit06.lesson06.teach.turn06:
    title: 가게 주인의 겸손한 대답과 작별 인사
    gloss: 가게 주인은 감사 인사에 겸손하게 답하고 잘 다녀오라고 인사해요.
    note: قابلی نداره는 장소 단원에서 배웠어요. سفر خوش(잘 다녀오세요 / 안전한 여행 되세요)는 어딘가로 걸어서 떠나는 사람에게 건네기 자연스러운 작별 인사예요.
