course:
  title: 한국어로 배우는 다리어 A1
  description: '초급 아프가니스탄 다리어: 기본 방향 표현, 길 안내하기, 여러 단계의 길 안내 순서대로 말하기, 공손하게 길 묻기, 랜드마크를 이용한 길 안내.'
