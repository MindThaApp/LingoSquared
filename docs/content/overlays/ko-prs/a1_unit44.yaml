course:
  title: 한국어로 배우는 다리어 A1
  description: '카불 다리어 초급: 가정 쓰레기를 알맞은 쓰레기통에 분리하고, 물건이 어느 쓰레기통에 들어가는지 묻고, 두 가지로 된 짧은 수거일 일정을 읽어 보세요. 쓰레기, 종이, 플라스틱, 유리에 대해 말하고 친구와 초록/파란 쓰레기통 분리를 확인해 봅니다.'
units:
  prs.a1.unit44.waste_disposal:
    title: 쓰레기 분리하기
    description: 가정 쓰레기를 알맞은 쓰레기통에 분리하고, 물건이 어느 쓰레기통에 들어가는지 묻고, 간단한 쓰레기 수거 일정을 이해해 봅니다.
lessons:
  prs.a1.unit44.lesson01.waste_bin_vocabulary:
    title: 쓰레기, 쓰레기통, 플라스틱 어휘
  prs.a1.unit44.lesson02.paper_and_glass:
    title: 종이, 유리, 파란 쓰레기통
  prs.a1.unit44.lesson03.throwing_away_waste:
    title: 쓰레기 버리기
  prs.a1.unit44.lesson04.waste_sorting_dialogue:
    title: 쓰레기 분리 대화
  prs.a1.unit44.lesson05.reading:
    title: 와히드와 쓰레기에 대한 글 읽기
  prs.a1.unit44.lesson06.wrap_up:
    title: 마무리
teaching:
  prs.a1.unit44.lesson01.teach.review_is_in:
    title: '복습: ~이다, ~에'
    gloss: ~이다 / ~에
    note: است와 در는 이 과정 내내 쓰인 복습 단어로, 무언가가 어디에 있는지 말할 때 사용해요.
    target_text: است (이에요/있어요) / در (~에)
  prs.a1.unit44.lesson01.teach.review_colors:
    title: '복습: 색, 초록, 파랑'
    gloss: 색 / 초록 / 파랑
    note: رنگ, سبز, آبی는 두 가지 쓰레기통의 이름을 말할 때 쓰는 복습 단어예요.
    target_text: رنگ (색) / سبز (초록색) / آبی (파란색)
  prs.a1.unit44.lesson01.teach.bin_word:
    title: 통
    gloss: 쓰레기통
    note: سطل은 쓰레기통이나 양동이를 가리키는 일상적인 다리어 단어예요.
    example_gloss: 쓰레기통이 초록색이에요.
  prs.a1.unit44.lesson01.teach.waste_word:
    title: 쓰레기
    gloss: 쓰레기
    note: زباله는 가정에서 나오는 쓰레기를 뜻해요.
    example_gloss: 쓰레기가 쓰레기통에 있어요.
  prs.a1.unit44.lesson01.teach.green_bin_phrase:
    title: 초록 쓰레기통
    gloss: 초록 쓰레기통
    note: سطل سبز는 سطل(쓰레기통)과 سبز(초록)가 합쳐진 표현이에요.
  prs.a1.unit44.lesson01.teach.plastic_word:
    title: 플라스틱
    gloss: 플라스틱
    note: پلاستیک은 다리어를 포함한 여러 페르시아어권에서 두루 쓰이는 외래어예요.
    example_gloss: 플라스틱이 파란 쓰레기통에 있어요.
  prs.a1.unit44.lesson01.teach.waste_in_green_bin_phrase:
    title: 쓰레기가 초록 쓰레기통에 있어요
    gloss: 쓰레기가 초록 쓰레기통에 있어요.
    note: زباله در سطل سبز است는 이 과에서 앞서 배운 단어들을 합친 문장이에요.
  prs.a1.unit44.lesson02.teach.review_which_in_is:
    title: '복습: 어느, ~에, ~이다'
    gloss: 어느 / ~에 / ~이다
    note: کدام, در, است는 물건이 어느 쓰레기통에 들어가는지 물을 때 쓰는 복습 단어예요.
    target_text: کدام (어느) / در (~에) / است (이에요/있어요)
  prs.a1.unit44.lesson02.teach.paper_word:
    title: 종이
    gloss: 종이
    note: کاغذ는 종이를 뜻하는 일상적인 다리어 단어예요.
    example_gloss: 종이가 쓰레기통에 있어요.
  prs.a1.unit44.lesson02.teach.glass_word:
    title: 유리
    gloss: 유리
    note: شیشه는 유리를 뜻하는 일상적인 다리어 단어예요.
    example_gloss: 유리가 쓰레기통에 있어요.
  prs.a1.unit44.lesson02.teach.blue_bin_phrase:
    title: 파란 쓰레기통
    gloss: 파란 쓰레기통
    note: سطل آبی는 سطل(쓰레기통)과 آبی(파랑)가 합쳐진 표현으로, 종이, 플라스틱, 유리 같은 재활용품에 써요.
  prs.a1.unit44.lesson02.teach.ask_which_bin_paper_phrase:
    title: 종이는 어느 쓰레기통에 있어요?
    gloss: 종이는 어느 쓰레기통에 있어요?
    note: کاغذ در کدام سطل است؟는 물건이 어느 쓰레기통에 들어가는지 묻는 문장이에요.
  prs.a1.unit44.lesson02.teach.paper_blue_bin_phrase:
    title: 종이는 파란 쓰레기통에 있어요
    gloss: 종이는 파란 쓰레기통에 있어요.
    note: کاغذ در سطل آبی است는 알맞은 쓰레기통을 말하며 질문에 답하는 문장이에요.
  prs.a1.unit44.lesson02.teach.glass_blue_bin_phrase:
    title: 유리는 파란 쓰레기통에 있어요
    gloss: 유리는 파란 쓰레기통에 있어요.
    note: شیشه در سطل آبی است는 종이 문장과 같은 구조예요.
  prs.a1.unit44.lesson03.teach.review_object_marker_put:
    title: '복습: 목적격 조사, 나는 넣어요/버려요'
    gloss: (목적격 조사) / 나는 넣어요 / 버려요
    note: را와 می‌اندازم(36과에서는 '소금을 넣어요'라는 뜻으로 쓰였어요)은 복습 단어예요. انداختن은 '넣다'와 '버리다'를 모두 나타내요.
    target_text: را (목적격 조사) / می‌اندازم (나는 넣어요 / 버려요)
  prs.a1.unit44.lesson03.teach.away_word:
    title: 멀리 / 버려서
    gloss: 멀리 / 버려서
    note: دور(멀리)는 می‌اندازم과 결합해 '버리다'를 뜻하는 표준 표현 دور انداختن을 이뤄요.
    example_gloss: (그것을) 버려요.
  prs.a1.unit44.lesson03.teach.throw_away_waste_phrase:
    title: 나는 쓰레기를 버려요
    gloss: 나는 쓰레기를 버려요.
    note: زباله را دور می‌اندازم은 زباله را, دور, می‌اندازم이 합쳐진 문장이에요.
  prs.a1.unit44.lesson03.teach.put_plastic_green_bin_phrase:
    title: 나는 플라스틱을 파란 쓰레기통에 넣어요
    gloss: 나는 플라스틱을 파란 쓰레기통에 넣어요.
    note: پلاستیک را در سطل آبی می‌اندازم에서 می‌اندازم은 '넣다'의 뜻으로 쓰였어요.
  prs.a1.unit44.lesson03.teach.put_paper_blue_bin_phrase:
    title: 나는 종이를 파란 쓰레기통에 넣어요
    gloss: 나는 종이를 파란 쓰레기통에 넣어요.
    note: کاغذ را در سطل آبی می‌اندازم은 파란 쓰레기통에 대해 같은 구조를 따라요.
  prs.a1.unit44.lesson03.teach.review_negative_put:
    title: '복습: 나는 넣지 않아요/버리지 않아요'
    gloss: 나는 넣지 않아요 / 버리지 않아요
    note: نمی‌اندازم은 می‌اندازم에 규칙적인 부정 접두사 نمی-를 붙인 형태예요.
    target_text: نمی‌اندازم (나는 넣지 않아요 / 버리지 않아요)
  prs.a1.unit44.lesson03.teach.not_glass_green_bin_phrase:
    title: 나는 유리를 초록 쓰레기통에 넣지 않아요
    gloss: 나는 유리를 초록 쓰레기통에 넣지 않아요.
    note: شیشه را در سطل سبز نمی‌اندازم은 부정형으로 분리 규칙을 말하는 문장이에요.
  prs.a1.unit44.lesson03.teach.glass_blue_bin_action_phrase:
    title: 나는 유리를 파란 쓰레기통에 넣어요
    gloss: 나는 유리를 파란 쓰레기통에 넣어요.
    note: شیشه را در سطل آبی می‌اندازم은 유리에 맞는 올바른 행동을 말해요.
  prs.a1.unit44.lesson04.teach.review_this:
    title: '복습: 이'
    gloss: 이것
    note: این은 대화에서 쓰이는 복습 단어예요.
    target_text: این (이)
  prs.a1.unit44.lesson04.teach.review_very_good_thanks_welcome:
    title: '복습: 매우, 좋은, 정말 감사합니다, 천만에요'
    gloss: 매우 / 좋은 / 정말 감사합니다 / 천만에요
    note: بسیار, خوب, تشکر زیاد, خواهش می‌کنم은 대화를 마무리할 때 쓰는 복습 단어예요.
    target_text: بسیار (매우) / خوب (좋은) / تشکر زیاد (정말 감사합니다) / خواهش می‌کنم (천만에요)
  prs.a1.unit44.lesson04.teach.dialogue_line1:
    title: '와히드: 슈크리아, 이 유리는 어느 쓰레기통에 넣어요?'
    gloss: 슈크리아, 이 유리는 어느 쓰레기통에 넣어요?
  prs.a1.unit44.lesson04.teach.dialogue_line2:
    title: '슈크리아: 유리는 파란 쓰레기통에 있어요.'
    gloss: 유리는 파란 쓰레기통에 있어요.
  prs.a1.unit44.lesson04.teach.dialogue_line3:
    title: '와히드: 이 쓰레기는 어느 쓰레기통에 버려요?'
    gloss: 이 쓰레기는 어느 쓰레기통에 버려요?
  prs.a1.unit44.lesson04.teach.dialogue_line4:
    title: '슈크리아: 쓰레기는 초록 쓰레기통에 있어요.'
    gloss: 쓰레기는 초록색 쓰레기통에 있어요.
  prs.a1.unit44.lesson04.teach.dialogue_line5:
    title: '와히드: 아주 좋아요. 정말 고맙습니다.'
    gloss: 아주 좋아요. 정말 고맙습니다.
  prs.a1.unit44.lesson04.teach.dialogue_line6:
    title: '슈크리아: 천만에요.'
    gloss: 천만에요.
  prs.a1.unit44.lesson05.teach.review_wahid_he_she_every_day:
    title: '복습: 와히드, 그/그녀, 매일, ~도, 기쁘다'
    gloss: 와히드 / 그/그녀 / 매일 / ~도 / 기쁜
    note: وحید, او, هر روز, هم, خوشحال은 읽기 지문에 나오는 복습 단어예요.
    target_text: وحید (와히드) / او (그 사람) / هر روز (매일) / هم (~도) / خوشحال (기쁜)
  prs.a1.unit44.lesson05.teach.review_throws_third_person:
    title: '복습: 그/그녀가 버려요'
    gloss: 그/그녀가 버려요 / 넣어요
    note: می‌اندازد는 이 단원에서 앞서 배운 می‌اندازم/نمی‌اندازم 계열의 3인칭 형태예요.
    target_text: می‌اندازد (그 사람은 넣어요 / 버려요)
  prs.a1.unit44.lesson05.teach.reading_passage:
    title: 와히드와 쓰레기에 대한 읽기
    gloss: 와히드는 매일 쓰레기를 버려요. 종이는 파란색 쓰레기통에 있어요. 플라스틱도 파란색 쓰레기통에 있어요. 쓰레기는 초록색 쓰레기통에 있어요. 와히드는 기뻐해요.
  prs.a1.unit44.lesson06.teach.review_days_but_formal_you:
    title: '복습: 월요일, 화요일, 하지만, 당신(존칭)'
    gloss: 월요일 / 화요일 / 하지만 / 당신(존칭)
    note: دوشنبه, سه‌شنبه, اما, شما는 두 가지 일정을 말할 때 쓰는 복습 단어예요.
    target_text: دوشنبه (월요일) / سه‌شنبه (화요일) / اما (하지만) / شما (당신, 공손한 표현)
  prs.a1.unit44.lesson06.teach.collection_word:
    title: 수거
    gloss: 수거
    note: جمع‌آوری는 '수거' 또는 '모으기'라는 뜻으로, 쓰레기 수거일을 말할 때 한국어의 '수거'처럼 쓰여요.
    example_gloss: 수거일은 월요일이에요.
  prs.a1.unit44.lesson06.teach.paper_collection_day_phrase:
    title: 종이 수거일은 월요일이에요
    gloss: 종이 수거일은 월요일이에요.
    note: روز جمع‌آوری کاغذ دوشنبه است는 품목과 그 수거 요일을 함께 말하는 문장이에요.
  prs.a1.unit44.lesson06.teach.waste_collection_day_phrase:
    title: 쓰레기 수거일은 화요일이에요
    gloss: 쓰레기 수거일은 화요일이에요.
    note: روز جمع‌آوری زباله سه‌شنبه است는 쓰레기에 대해 같은 패턴을 따라요.
  prs.a1.unit44.lesson06.teach.contrast_schedule_phrase:
    title: 종이는 월요일, 하지만 쓰레기는 화요일
    gloss: 종이 수거일은 월요일이지만, 쓰레기 수거일은 화요일이에요.
    note: اما는 두 수거일을 대조해요.
  prs.a1.unit44.lesson06.teach.review_throw_formal:
    title: '복습: 당신이 버려요/넣어요(존칭)'
    gloss: 당신이 버려요 / 넣어요(존칭)
    note: می‌اندازین은 존칭 복수형으로, می‌خواهین/کنین과 같은 -ین 계열을 확장한 형태예요.
    target_text: می‌اندازین (당신은 넣어요 / 버려요, 공손한 표현)
  prs.a1.unit44.lesson06.teach.formal_question_phrase:
    title: 무슨 요일에 쓰레기를 버리세요?
    gloss: 무슨 요일에 쓰레기를 버리세요?
    note: 상대방이 무슨 요일에 쓰레기를 버리는지 묻는, شما가 붙은 존칭 표현이에요.
