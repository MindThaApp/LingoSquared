teaching:
  prs.a1.unit10.lesson01.teach.dokan:
    title: 가게
    gloss: 가게
    note: دوکان은 작은 동네 가게를 뜻하는 진짜 아프가니스탄 다리어 단어예요. 이란 페르시아어의 مغازه와는 다른 말이에요.
    example_gloss: 이 가게는 커요.
  prs.a1.unit10.lesson01.teach.qeymat:
    title: 가격
    gloss: 가격
    note: قیمت은 '가격'이라는 뜻이에요.
    example_gloss: 이것의 가격이 얼마예요?
  prs.a1.unit10.lesson01.teach.arzan:
    title: 저렴한
    gloss: 싼
    note: ارزان은 '싸다', '저렴하다'라는 뜻이에요.
    example_gloss: 이거 싸요.
  prs.a1.unit10.lesson01.teach.gran:
    title: 비싼
    gloss: 비싼
    note: گران은 ارزان의 반대말이에요.
    example_gloss: 이거 비싸요.
  prs.a1.unit10.lesson01.teach.takhfif:
    title: 할인
    gloss: 할인
    note: تخفیف는 '가격 할인'이라는 뜻이에요.
    example_gloss: 할인 되나요?
  prs.a1.unit10.lesson01.teach.va_word:
    title: 그리고
    gloss: 그리고, ~와/과
    note: و는 짧은 두 문장이나 요청을 이어 줄 때 쓰는 일반적인 연결어로, '그리고', '~와/과'에 해당해요.
    example_gloss: 사과와 빵을 살 거예요.
  prs.a1.unit10.lesson02.teach.qeymatesh_chand:
    title: 얼마예요?(가격이 얼마인가요?)
    gloss: 얼마예요?(가격이 얼마인가요?)
    note: قیمتش چند است؟는 직역하면 '그것의 가격이 얼마예요?'라는 뜻이에요.
  prs.a1.unit10.lesson02.teach.sad_afghani:
    title: 100아프가니예요.
    gloss: 100아프가니예요.
    note: صد افغانی است는 아프가니스탄의 화폐인 افغانی(아프가니)로 가격을 말하는 표현이에요.
  prs.a1.unit10.lesson03.teach.sib:
    title: 사과
    gloss: 사과
    note: سیب는 '사과'라는 뜻이에요. 여기서는 팔고 있는 사과 여러 개를 통틀어 가리키는 말로 쓰였어요.
    example_gloss: 사과 1킬로 주세요.
  prs.a1.unit10.lesson03.teach.kilo:
    title: 킬로
    gloss: 킬로
    note: کیلو는 농산물을 무게로 팔 때 쓰는 기본 단위예요.
    example_gloss: 사과 1킬로 주세요.
  prs.a1.unit10.lesson03.teach.label_text:
    title: '사과: 1킬로 100 아프가니'
    gloss: '사과: 1킬로 100 아프가니'
    note: 'سیب: یک کیلو صد افغانی는 시장에서 흔히 볼 수 있는 가격표예요.'
  prs.a1.unit10.lesson04.teach.yak_kilo_sib:
    title: 사과 1킬로 주세요.
    gloss: 사과 1킬로 주세요.
    note: یک کیلو سیب می‌خواهم은 8단원에서 음식을 주문할 때 배운 'یک [물건] می‌خواهم' 형태와 같아요.
  prs.a1.unit10.lesson04.teach.do_kilo:
    title: 2킬로 주세요.
    gloss: 2킬로 주세요.
    note: دو کیلو می‌خواهم은 دو(둘)를 넣어서 더 많은 양을 말하는 표현이에요.
  prs.a1.unit10.lesson05.teach.takhfif_mitanin:
    title: 할인해 주실 수 있어요?
    gloss: 할인해 주실 수 있어요?
    note: تخفیف می‌توانین بدهین؟는 می‌توانین('~할 수 있으세요')을 써서 공손하게 가격을 깎아 달라고 부탁하는 표현이에요.
  prs.a1.unit10.lesson05.teach.baraye_shoma:
    title: 손님께는 180아프가니예요.
    gloss: 손님께는 180아프가니예요.
    note: برای شما صد و هشتاد افغانی می‌شه는 할인된 총액을 알려 주는 말이에요. 킬로당 100 아프가니로 2킬로면 200 아프가니인데, 거기서 20 아프가니를 깎아 준 거예요.
  prs.a1.unit10.lesson06.teach.befarmayin:
    title: 자, 그렇게 하세요
    gloss: 어서 오세요, 자 여기요
    note: بفرمایین은 손님이 가게에 들어올 때 주인이 건네는 따뜻하고 공손한 인사이자 권유의 말이에요.
    example_gloss: 자, 여기요. 이게 가격이에요.
  prs.a1.unit10.lesson06.teach.turn01:
    title: 안녕하세요, 어서 오세요.
    gloss: 안녕하세요, 어서 오세요.
    note: 가게 주인이 손님을 따뜻하게 맞이해요.
  prs.a1.unit10.lesson06.teach.turn02:
    title: 안녕하세요. 사과는 얼마예요?
    gloss: 안녕하세요. 사과는 얼마예요?
    note: 손님이 사과 가격을 물어봐요.
  prs.a1.unit10.lesson06.teach.turn03:
    title: 1킬로에 100 아프가니예요.
    gloss: 1킬로에 100 아프가니예요.
    note: 가게 주인이 킬로당 가격을 말해요.
  prs.a1.unit10.lesson06.teach.turn04:
    title: 2킬로 주세요. 할인해 주실 수 있어요?
    gloss: 2킬로 주세요. 할인해 주실 수 있어요?
    note: 손님이 수량을 말하고 할인을 부탁해요.
  prs.a1.unit10.lesson06.teach.turn05:
    title: 네, 손님께는 2킬로에 180 아프가니에 드릴게요.
    gloss: 네, 손님께는 2킬로에 180 아프가니에 드릴게요.
    note: 주인이 승낙하고 할인된 총액을 말해요. 앞에서 말한 킬로당 100 아프가니(200에서 20 아프가니 할인)와 맞아떨어져요.
  prs.a1.unit10.lesson06.teach.turn06:
    title: 좋아요, 감사합니다.
    gloss: 좋아요, 감사합니다.
    note: 손님이 가격을 받아들이고 주인에게 감사 인사를 해요.
