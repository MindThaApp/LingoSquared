course:
  title: 한국어로 배우는 다리어 A1
  description: '초급 아프가니스탄 다리어: 1부터 100까지 세기, 나이 묻고 말하기, 전화번호 주고받기.'
units:
  prs.a1.unit04.numbers:
    title: 숫자 세기
lessons:
  prs.a1.unit04.lesson01.numbers_one_to_ten:
    title: 1부터 10까지 세기
  prs.a1.unit04.lesson02.numbers_eleven_to_twenty:
    title: 11부터 20까지 세기
  prs.a1.unit04.lesson03.tens:
    title: 100까지의 십 단위 수
  prs.a1.unit04.lesson04.asking_age:
    title: 나이 묻고 말하기
  prs.a1.unit04.lesson05.phone_numbers:
    title: 전화번호 주고받기
  prs.a1.unit04.lesson06.numbers_exchange_dialogue:
    title: 두 친구가 나이와 전화번호를 이야기해요
teaching:
  prs.a1.unit04.lesson01.teach.one_to_three:
    title: 하나, 둘, 셋
    gloss: 1, 2, 3
    note: یک، دو، سه는 다리어와 페르시아어(파르시어)가 함께 쓰는 기본 숫자예요.
    example_gloss:
    - 저는 남자 형제가 한 명 있어요.
    - 저는 책이 두 권 있어요.
    - 저는 여동생(또는 누나·언니)이 세 명 있어요.
  prs.a1.unit04.lesson01.teach.four_to_six:
    title: 넷, 다섯, 여섯
    gloss: 4, 5, 6
    note: چهار가 표준 표기예요. 일상 대화에서는 چار로 줄여 말하는 사람도 있지만, 이 과정에서는 표준 철자를 써요.
    example_gloss:
    - 저는 책이 네 권 있어요.
    - 5분 기다리세요.
    - 그는 책이 여섯 권 있어요.
  prs.a1.unit04.lesson01.teach.seven_eight:
    title: 일곱, 여덟
    gloss: 7, 8
    note: هفت، هشت는 숫자의 순서를 이어 가요.
    example_gloss:
    - 일주일은 7일이에요.
    - 여덟 시에 갈게요.
  prs.a1.unit04.lesson01.teach.nine_ten:
    title: 아홉, 열
    gloss: 9, 10
    note: نه، ده로 1부터 10까지의 숫자가 끝나요.
    example_gloss:
    - 반에 아홉 명이 있어요.
    - 저는 손가락이 열 개 있어요.
  prs.a1.unit04.lesson02.teach.eleven_thirteen:
    title: 열하나, 열둘, 열셋
    gloss: 11, 12, 13
    note: یازده، دوازده، سیزده는 일의 자리 숫자를 단순히 합친 말이 아니라 각각 독립된 단어예요.
    example_gloss:
    - 11시에 수업이 있어요.
    - 1년은 12개월이에요.
    - 그는/그녀는 열세 살이에요.
  prs.a1.unit04.lesson02.teach.fourteen_sixteen:
    title: 열넷, 열다섯, 열여섯
    gloss: 14, 15, 16
    note: چهارده، پانزده، شانزده는 10대 숫자를 이어 가요.
    example_gloss:
    - 14일 뒤에 올게요.
    - 그는/그녀는 책이 열다섯 권 있어요.
    - 그는/그녀는 열여섯 살이에요.
  prs.a1.unit04.lesson02.teach.seventeen_nineteen:
    title: 열일곱, 열여덟, 열아홉
    gloss: 17, 18, 19
    note: هفده، هجده، نوزده로 10대 숫자가 끝나요.
    example_gloss:
    - 그는 책이 열일곱 권 있어요.
    - 그는/그녀는 열여덟 살이에요.
    - 19일 남았어요.
  prs.a1.unit04.lesson02.teach.twenty:
    title: 이십
    gloss: '20'
    note: بیست는 십 단위 수의 시작이며, 다음 수업에서 자세히 배워요.
    example_gloss: 저는 책이 스무 권 있어요.
  prs.a1.unit04.lesson03.teach.twenty_thirty_forty:
    title: 스물, 서른, 마흔
    gloss: 20, 30, 40
    note: بیست، سی، چهل는 십 단위 수를 나타내는 말이며, 예측할 수 있는 규칙 없이 각각 다른 형태예요.
    example_gloss:
    - 저는 스무 살이에요.
    - 이번 달은 30일까지 있어요.
    - 그는/그녀는 마흔 살이에요.
  prs.a1.unit04.lesson03.teach.fifty_sixty:
    title: 쉰, 예순
    gloss: 50, 60
    note: پنجاه، شصت는 십 단위 수를 이어 가요.
    example_gloss:
    - 그는 책이 쉰 권 있어요.
    - 60분은 1시간이에요.
  prs.a1.unit04.lesson03.teach.seventy_eighty:
    title: 일흔, 여든
    gloss: 70, 80
    note: هفتاد، هشتاد는 십 단위 수를 이어 가요.
    example_gloss:
    - 이 책은 70쪽이에요.
    - 그는/그녀는 책이 여든 권 있어요.
  prs.a1.unit04.lesson03.teach.ninety_hundred:
    title: 아흔, 백
    gloss: 90, 100
    note: نود، صد로 100까지의 수가 완성돼요.
    example_gloss:
    - 그는/그녀는 아흔 살이에요.
    - 그는 책이 백 권 있어요.
  prs.a1.unit04.lesson03.teach.combining_tens:
    title: 십 단위와 일 단위 합치기
    gloss: 25는 말 그대로 '스물 그리고 다섯'이에요.
    note: 십 단위 수와 일 단위 수는 و(그리고)로 연결해요. 이 과정의 다른 곳에서도 쓰는 연결어로, 예를 들면 بیست و پنج(25)예요.
  prs.a1.unit04.lesson04.teach.chand:
    title: 몇 / 얼마
    gloss: 몇 / 얼마
    note: چند는 나이를 포함해 수량을 묻는 질문을 이끌어요.
    example_gloss: 나이가 어떻게 되세요?
  prs.a1.unit04.lesson04.teach.sal_word:
    title: 해, 연도
    gloss: 해, 년, 살
    note: سال은 나이를 말할 때 쓰며, 말 그대로 '해, 년'이라는 뜻이에요.
    example_gloss: 저는 스무 살이에요.
  prs.a1.unit04.lesson04.teach.age_question_polite:
    title: 공손하게 나이 묻기
    gloss: 몇 살이에요?
    note: چند ساله استین؟은 말 그대로 '몇 살이세요?'라는 뜻이며, 잘 모르는 사람에게 쓰는 존댓말 형태 استین을 사용해요.
  prs.a1.unit04.lesson04.teach.age_question_informal:
    title: 가까운 친구에게 나이 묻기
    gloss: 몇 살이에요?
    note: چند ساله استی؟는 친근한 형태 استی를 쓰므로 가까운 친구나 또래에게만 쓰세요. 이 과정에서 이미 배운 말투 규칙과 같아요.
  prs.a1.unit04.lesson04.teach.age_answer:
    title: 나이 말하기
    gloss: 저는 25살이에요.
    note: بیست و پنج ساله استم은 숫자, ساله(~살), استم(~이에요)을 합친 표현이에요.
  prs.a1.unit04.lesson05.teach.number_word:
    title: 숫자
    gloss: 번호
    note: نمبر는 아프가니스탄에서 일상적으로 널리 쓰는 말(페르시아어/영어에서 온 말)로, 특히 전화번호처럼 '번호'를 뜻해요.
    example_gloss: 이것은 제 전화번호예요.
  prs.a1.unit04.lesson05.teach.telephone_word:
    title: 전화
    gloss: 전화
    note: تلفن은 '전화'를 뜻하는 표준 단어예요.
    example_gloss: 제 전화기가 고장 났어요.
  prs.a1.unit04.lesson05.teach.phone_question:
    title: 전화번호 묻기
    gloss: 전화번호가 어떻게 되세요?
    note: نمبر تلفن‌تان چند است؟는 나이를 물을 때 쓴 چند 패턴을 전화번호에 그대로 적용한 질문이에요.
  prs.a1.unit04.lesson05.teach.zero_word:
    title: 영
    gloss: 영
    note: صفر는 아프가니스탄 전화번호 대부분을 읽을 때 필요해요.
    example_gloss: 영은 숫자예요.
  prs.a1.unit04.lesson05.teach.phone_answer:
    title: 전화번호 알려 주기
    gloss: 제 전화번호는 079-345-678이에요.
    note: 아프가니스탄 전화번호는 보통 한 자리씩 읽지 않고, 여기에 나온 것처럼 짧게 끊어서 읽어요.
  prs.a1.unit04.lesson06.teach.turn01:
    title: 후마윤이 바시르에게 인사해요
    gloss: 후마윤이 가까운 친구에게 쓰는 친근한 말투로 바시르에게 잘 지내는지 물어요.
    note: جور استی؟는 두 사람이 이미 가까운 친구라는 것을 보여 주므로, 이 대화 내내 친근한 말투를 써요.
  prs.a1.unit04.lesson06.teach.turn02:
    title: 바시르가 대답하고 후마윤의 나이를 물어요
    gloss: 바시르는 잘 지낸다고 말하고 후마윤이 몇 살인지 물어요.
    note: چند ساله استی؟는 두 사람의 우정에 맞게 친근한 말투를 써요.
  prs.a1.unit04.lesson06.teach.turn03:
    title: 후마윤이 대답하고 같은 질문을 되물어요
    gloss: 후마윤은 28살이라고 말하고 바시르에게 같은 질문을 해요.
    note: 4과에서 배운 나이 대답 패턴을 그대로 다시 써요.
  prs.a1.unit04.lesson06.teach.turn04:
    title: 바시르가 대답해요
    gloss: 바시르는 26살이라고 말해요.
    note: 나이 주고받기가 마무리돼요.
  prs.a1.unit04.lesson06.teach.turn05:
    title: 후마윤이 바시르의 전화번호를 물어요
    gloss: 후마윤이 바시르의 전화번호를 물어요.
    note: تلفنت은 친근한 소유 어미를 써서, 이 대화의 나머지 부분과 말투가 같아요.
  prs.a1.unit04.lesson06.teach.turn06:
    title: 바시르가 전화번호를 알려 줘요
    gloss: 바시르가 전화번호를 끊어서 읽어 줘요.
    note: 5과의 예문처럼 전화번호를 자연스럽게 끊어서 읽어요.
  prs.a1.unit04.lesson06.teach.turn07:
    title: 후마윤이 저장했다고 말해요
    gloss: 후마윤은 고맙다고 하면서 지금 바로 저장하겠다고 말해요.
    note: سیف می‌کنم('저장하다'를 뜻하는 영어 'save'에서 온 말)은 아프가니스탄에서 흔히 쓰는 기술 관련 외래어로, 친구끼리의 편한 대화에 알맞아요.
