course:
  title: 한국어로 배우는 다리어 A1
  description: '아프가니스탄 다리어 초급: 도시의 흔한 장소 이름 말하기, 어디에 있는지 묻기, 간단히 위치 답하기, 장소까지 가는 기본 길 안내 따라가기.'
units:
  prs.a1.unit05.places:
    title: 도시의 중요한 장소
lessons:
  prs.a1.unit05.lesson01.everyday_places:
    title: 도시의 일상 장소
  prs.a1.unit05.lesson02.civic_and_travel_places:
    title: 공공시설과 여행 장소
  prs.a1.unit05.lesson03.asking_where:
    title: 어디에 있는지 묻기
  prs.a1.unit05.lesson04.simple_location_answers:
    title: 가깝다, 멀다, 여기, 저기
  prs.a1.unit05.lesson05.prepositions_of_place:
    title: 장소를 나타내는 전치사
  prs.a1.unit05.lesson06.finding_pharmacy_dialogue:
    title: 동네에서 약국 찾기
teaching:
  prs.a1.unit05.lesson01.teach.bazaar:
    title: 시장
    gloss: 시장 / 바자르
    note: بازار는 시장 지역을 가리키는 일상적인 말로, 가게들이 늘어선 거리나 지구 전체를 뜻하기도 해요.
    example_gloss: 바자르는 가까워요.
  prs.a1.unit05.lesson01.teach.bank:
    title: 은행
    gloss: 은행
    note: بانک은 외래어를 그대로 받아들인 말로, 한국어의 '뱅크/은행'처럼 외국어에서 온 말이에요. 발음은 한국어 '뱅크'와 비슷해요.
    example_gloss: 은행이 어디에 있어요?
  prs.a1.unit05.lesson01.teach.mosque:
    title: 모스크
    gloss: 모스크
    note: مسجد는 모스크를 뜻하는 표준 단어예요.
    example_gloss: 모스크가 커요.
  prs.a1.unit05.lesson01.teach.hospital:
    title: 병원
    gloss: 병원
    note: شفاخانه는 아프가니스탄 다리어에서 병원을 뜻하는 일상적인 말이에요. 이란 페르시아어의 بیمارستان과는 달라요. 다리어 화자도 알아듣기는 하지만 보통 스스로는 쓰지 않아요.
    example_gloss: 병원은 멀어요.
  prs.a1.unit05.lesson01.teach.school:
    title: 학교
    gloss: 학교
    note: مکتب는 아프가니스탄 다리어에서 학교를 뜻하는 일상적인 말이에요. 이란 페르시아어의 مدرسه와는 달라요. 다리어에서 مدرسه는 보통 종교 학교를 가리켜요.
    example_gloss: 학교는 집 근처에 있어요.
  prs.a1.unit05.lesson01.teach.pharmacy:
    title: 약국
    gloss: 약국
    note: دواخانه는 아프가니스탄 다리어에서 약국을 뜻하는 일상적인 말이에요(دوا, 즉 '약'에서 온 말). 이란 페르시아어의 داروخانه와는 달라요.
    example_gloss: 약국은 어디예요?
  prs.a1.unit05.lesson01.teach.va_word:
    title: And
    gloss: 그리고
    note: و는 장소를 여러 개 나열할 때 쓰는 흔한 연결어예요.
    target_text: و (그리고)
  prs.a1.unit05.lesson02.teach.post_office:
    title: 우체국
    gloss: 우체국
    note: پوسته خانه는 پوسته(우편)와 خانه(집/건물)가 합쳐진 말이에요.
    example_gloss: 우체국은 문을 닫았어요.
  prs.a1.unit05.lesson02.teach.embassy:
    title: 대사관
    gloss: 대사관
    note: سفارت는 대사관을 뜻하는 표준 단어예요.
    example_gloss: 대사관은 카불에 있어요.
  prs.a1.unit05.lesson02.teach.airport:
    title: 공항
    gloss: 공항
    note: میدان هوایی는 아프가니스탄 다리어에서 공항을 뜻하는 일상적인 말이에요(문자 그대로 '공중의 광장'). 이란 페르시아어의 فرودگاه와는 달라요.
    example_gloss: 공항은 멀어요.
  prs.a1.unit05.lesson02.teach.office_review:
    title: 사무실 (복습)
    gloss: 사무실
    note: دفتر는 앞선 단원에서 이미 나왔어요. 다른 공공 장소들과 함께 여기에도 넣었어요.
    example_gloss: 제 사무실은 가까워요.
  prs.a1.unit05.lesson03.teach.kojast_bazaar:
    title: 시장이 어디인지 묻기
    gloss: 시장은 어디예요?
    note: بازار کجاست؟은 어떤 장소든 어디에 있는지 물을 때 쓰는 기본 패턴이에요.
  prs.a1.unit05.lesson03.teach.kojast_hospital:
    title: 병원이 어디인지 묻기
    gloss: 병원은 어디예요?
    note: 어떤 장소 명사에도 같은 کجاست 패턴을 쓸 수 있어요.
  prs.a1.unit05.lesson03.teach.bebakhshid:
    title: 정중하게 말을 걸기
    gloss: 실례합니다, 약국은 어디에 있나요?
    note: ببخشین은 낯선 사람에게 질문을 공손하게 시작할 때 쓰는 말로, 한국어의 '실례합니다'와 같은 기능이에요.
  prs.a1.unit05.lesson03.teach.kojast_grammar:
    title: کجاست의 구성
    gloss: کجاست은 کجا(어디)와 است(~이다/있다)가 합쳐진 줄임 형태예요.
    note: 이 구성을 알아 두면 کجاست을 통째로 외우지 않고 패턴으로 이해할 수 있어요.
  prs.a1.unit05.lesson04.teach.near:
    title: 가까이
    gloss: 근처에
    note: نزدیک은 가까이 있는 것을 나타내요.
    example_gloss: 은행이 가까워요.
  prs.a1.unit05.lesson04.teach.far:
    title: 멀리
    gloss: 멀리
    note: دور는 멀리 떨어져 있는 것을 나타내요.
    example_gloss: 병원이 멀어요.
  prs.a1.unit05.lesson04.teach.here:
    title: 여기
    gloss: 여기
    note: این‌جا는 말하는 사람이 지금 있는 곳을 가리켜요.
    example_gloss: 은행은 여기에 있어요.
  prs.a1.unit05.lesson04.teach.there:
    title: 저기
    gloss: 거기
    note: آن‌جا는 말하는 사람에게서 떨어진 곳을 가리켜요.
    example_gloss: 약국이 저기에 있어요.
  prs.a1.unit05.lesson04.teach.bazaar_near:
    title: 시장이 가깝다고 말하기
    gloss: 시장이 가까워요.
    note: بازار نزدیک است에는 이 과정 내내 나온 است가 똑같이 쓰여요.
  prs.a1.unit05.lesson04.teach.airport_far:
    title: 공항이 멀다고 말하기
    gloss: 공항이 멀어요.
    note: میدان هوایی دور است는 نزدیک 대신 دور를 쓴 같은 패턴이에요.
  prs.a1.unit05.lesson05.teach.next_to:
    title: ~ 옆에
    gloss: 옆에
    note: در کنار는 글자 그대로 '~의 옆에'라는 뜻이에요.
  prs.a1.unit05.lesson05.teach.behind:
    title: 뒤
    gloss: 뒤에
    note: پشت은 어떤 장소의 뒤쪽에 있음을 나타내요.
    example_gloss: 약국은 학교 뒤에 있어요.
  prs.a1.unit05.lesson05.teach.opposite:
    title: 맞은편
    gloss: 맞은편에
    note: مقابل은 어떤 장소의 바로 맞은편에 있음을 나타내요.
    example_gloss: 은행은 모스크 맞은편에 있어요.
  prs.a1.unit05.lesson05.teach.hospital_next_to_mosque:
    title: 모스크를 기준으로 병원 위치 말하기
    gloss: 병원은 모스크 옆에 있어요.
    note: شفاخانه در کنار مسجد است는 장소, 위치 표현 در کنار, 그리고 است로 이루어져 있어요.
  prs.a1.unit05.lesson06.teach.tashakor_ziad:
    title: 정말 감사합니다
    gloss: 정말 감사합니다.
    note: تشکر زیاد는 이미 배운 일상적인 تشکر를 더 강조한 표현이에요.
  prs.a1.unit05.lesson06.teach.turn01:
    title: 자르미나가 약국을 물어봐요
    gloss: 자르미나가 지나가는 사람에게 약국이 어디인지 공손하게 물어봐요.
    note: ببخشین은 낯선 사람에게 예의 바르게 질문을 시작하는 말이에요.
  prs.a1.unit05.lesson06.teach.turn02:
    title: 지나가는 사람이 길을 알려 줘요
    gloss: 지나가는 사람이 약국은 멀지 않으니 직진하라고 하고, 학교 옆에 있다고 말해요.
    note: 이 문장에는 이번 단원의 여러 패턴이 함께 나와요. دور نیست(دور의 부정), مستقیم بروین, 그리고 در کنار예요.
  prs.a1.unit05.lesson06.teach.turn03:
    title: 자르미나가 지나가는 사람에게 감사해요
    gloss: 자르미나가 그에게 정말 감사하다고 말해요.
    note: تشکر زیاد는 대화를 공손하게 마무리해 줘요.
  prs.a1.unit05.lesson06.teach.turn04:
    title: 지나가는 사람의 겸손한 대답
    gloss: 별말씀을요. / 아무것도 아니에요.
    note: قابلی نداره는 아프가니스탄 다리어 일상 대화에서 감사 인사에 겸손하게 답하는 흔한 표현으로, خواهش می‌کنم과 비슷하지만 더 편한 말이에요. نداره는 ندارد의 구어체예요. 말할 때는 نداره를 듣게 되고, 격식 있는 글에서는 ندارد를 써요.
