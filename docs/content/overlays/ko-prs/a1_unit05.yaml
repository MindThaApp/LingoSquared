    correct_option: 시장이 어디예요?
    distractors:
    - 병원이 어디예요?
    - 시장이 가까워요.
    - 전화번호가 뭐예요?
    accepted_answers:
    - value: 시장이 어디예요?
      status: correct
    feedback: بازار کجاست؟는 시장이 어디냐고 묻는 말이에요.
  prs.a1.unit05.lesson03.exercise02.recognize_polite_opener:
    instruction: 낯선 사람에게 질문을 공손하게 시작할 때 쓰는 말은 무엇인가요?
    correct_option: ببخشین
    distractors:
    - تشکر
    - بازار
    - کجاست
    accepted_answers:
    - value: ببخشین
      status: correct
    feedback: ببخشین은 '실례합니다'라는 뜻으로, 질문을 공손하게 시작해요.
