teaching:
  prs.a1.unit46.lesson01.teach.review_this_is_in:
    title: '복습: 이것, 이다, ~에'
    gloss: 이것 / 이다 / ~에
    note: این, است, در(이 과정 내내 쓰였어요)는 약국에 대해 말할 때 쓰는 복습 단어예요.
    target_text: این (이것) / است (이다) / در (~에)
  prs.a1.unit46.lesson01.teach.pharmacy_word:
    title: 약국
    gloss: 약국
    note: دواخانه는 글자 그대로 "약의 집"이라는 뜻이에요. کتابخانه("책의 집", 도서관, 43단원)과 같은 방식으로 만들어진 단어예요.
    example_gloss: 여기는 약국이에요.
  prs.a1.unit46.lesson01.teach.this_is_pharmacy_phrase:
    title: 여기는 약국이에요
    gloss: 여기는 약국이에요.
    note: این دواخانه است는 이번 과에서 배운 단어들을 합친 문장이에요.
  prs.a1.unit46.lesson01.teach.pharmacist_word:
    title: 약사
    gloss: 약사
    note: دواساز는 글자 그대로 "약을 만드는 사람"이라는 뜻이에요.
    example_gloss: 약사는 약국에 있어요.
  prs.a1.unit46.lesson01.teach.pharmacist_in_pharmacy_phrase:
    title: 약사는 약국에 있어요
    gloss: 약사는 약국에 있어요.
    note: دواساز در دواخانه است는 دواساز(약사)와 دواخانه(약국)를 합친 문장이에요.
  prs.a1.unit46.lesson01.teach.review_medicine_want:
    title: '복습: 약, 원해요'
    gloss: 약 / 원해요
    note: دوا와 می‌خواهم은 약을 요청할 때 쓰는 복습 단어예요.
    target_text: دوا (약) / می‌خواهم (원해요)
  prs.a1.unit46.lesson01.teach.want_medicine_phrase:
    title: 약을 원해요
    gloss: 약을 원해요.
    note: دوا می‌خواهم은 دوا(약)와 می‌خواهم(원해요)을 합친 문장이에요.
  prs.a1.unit46.lesson02.teach.review_headache_stomachache_have:
    title: '복습: 두통, 복통, 있어요(저), 있으세요'
    gloss: 두통 / 복통 / 있어요(저) / 있으세요(높임)
    note: سردرد, دل‌درد, دارم, دارین은 증상을 말할 때 쓰는 복습 단어예요.
    target_text: سردرد (두통) / دل‌درد (복통) / دارم (있어요, 저) / دارین (있으세요, 높임)
  prs.a1.unit46.lesson02.teach.review_very_yes_no:
    title: '복습: 매우, 네, 아니요'
    gloss: 매우 / 네 / 아니요
    note: بسیار, بلی, نخیر(앞 단원에서 배움)는 증상 질문에 대답할 때 쓰는 복습 단어예요.
    target_text: بسیار (매우) / بلی (네) / نخیر (아니요)
  prs.a1.unit46.lesson02.teach.toothache_word:
    title: 치통
    gloss: 치통
    note: دندان‌درد는 دندان(이, 42단원)에 سردرد와 دل‌درد에서 이미 쓰인 -درد("통증") 형태를 붙인 단어예요.
    example_gloss: 치통이 있어요.
  prs.a1.unit46.lesson02.teach.severe_toothache_phrase:
    title: 치통이 심해요
    gloss: 치통이 심해요.
    note: بسیار دندان‌درد دارم은 بسیار(매우)를 써서 증상을 강조해요.
  prs.a1.unit46.lesson02.teach.do_you_have_headache_phrase:
    title: 두통이 있으세요?
    gloss: 두통이 있으세요?
    note: سردرد دارین؟는 별도의 의문사 없이 끝을 올려 말해서 만드는 예/아니요 질문이에요.
  prs.a1.unit46.lesson02.teach.no_toothache_phrase:
    title: 아니요, 치통이 있어요
    gloss: 아니요, 치통이 있어요.
    note: نخیر는 앞의 질문에 대한 대답이고, 이어서 실제 증상을 말해요.
  prs.a1.unit46.lesson03.teach.review_want_one:
    title: '복습: 원해요, 하나의/한'
    gloss: 원해요 / 하나의 / 한
    note: می‌خواهم과 یک은 앞 단원에서 배운 복습 단어로, 약의 형태를 요청할 때 써요.
    target_text: می‌خواهم (원해요) / یک (하나, 한)
  prs.a1.unit46.lesson03.teach.tablet_word:
    title: 알약
    gloss: 알약
    note: قرص는 알약을 뜻하는 일상적인 다리어 단어예요.
    example_gloss: 알약 하나 주세요.
  prs.a1.unit46.lesson03.teach.want_tablet_phrase:
    title: 알약 한 알 주세요
    gloss: 알약 하나 주세요.
    note: یک قرص می‌خواهم은 یک(한)과 قرص(알약)를 합친 표현이에요.
  prs.a1.unit46.lesson03.teach.syrup_word:
    title: 시럽
    gloss: 시럽
    note: شربت는 물약이나 시럽을 뜻하는 일상적인 다리어 단어예요.
    example_gloss: 시럽을 원해요.
  prs.a1.unit46.lesson03.teach.want_syrup_phrase:
    title: 시럽 주세요
    gloss: 시럽을 원해요.
    note: شربت می‌خواهم은 شربت(시럽)와 می‌خواهم(원해요)을 합친 표현이에요.
  prs.a1.unit46.lesson03.teach.review_which_medicine_want_polite:
    title: '복습: 어느, 약, 원하세요(공손)'
    gloss: 어느 / 약 / 원하세요(공손)
    note: کدام, دوا, می‌خواهین은 복습 단어로, 손님에게 무엇을 원하는지 물을 때 써요.
    target_text: کدام (어느) / دوا (약) / می‌خواهین (원하세요, 높임)
  prs.a1.unit46.lesson03.teach.which_medicine_phrase:
    title: 어떤 약을 원하세요?
    gloss: 어떤 약을 원하세요?
    note: کدام دوا می‌خواهین؟는 약사가 공손하게 묻는 질문이에요.
  prs.a1.unit46.lesson04.teach.review_hello_stomachache_have:
    title: '복습: 안녕하세요, 배탈, 있어요'
    gloss: 안녕하세요 / 배탈 / 있어요
    note: سلام, دل‌درد, دارم은 앞 단원에서 배운 복습 단어로, 대화를 시작할 때 써요.
    target_text: سلام (안녕하세요) / دل‌درد (복통) / دارم (있어요, 저)
  prs.a1.unit46.lesson04.teach.review_medicine_want_polite_yes:
    title: '복습: 약, 원하세요(공손), 네'
    gloss: 약 / 원하세요(공손) / 네
    note: دوا, می‌خواهین, بلی는 앞 단원에서 배운 복습 단어로, 약사의 질문에서 써요.
    target_text: دوا (약) / می‌خواهین (원하세요, 높임) / بلی (네)
  prs.a1.unit46.lesson04.teach.review_this_tablet_good_is:
    title: '복습: 이, 알약, 좋은, 이에요'
    gloss: 이 / 알약 / 좋은 / 이에요
    note: این, قرص, خوب, است는 앞 단원과 이번 단원에서 배운 복습 단어로, 약을 설명할 때 써요.
    target_text: این (이것) / قرص (알약) / خوب (좋은) / است (이다)
  prs.a1.unit46.lesson04.teach.piece_word:
    title: 알
    gloss: 개 / 복용량
    note: دانه는 낱개나 한 번 복용량을 세는 단위로, 알약을 셀 때 써요.
    example_gloss: 세 알이에요.
  prs.a1.unit46.lesson04.teach.take_word:
    title: 드세요
    gloss: 드세요 (높임)
    note: بگیرین은 "받으세요, 드세요"에 해당하는 공손한 명령형으로, 이 과정의 کنین/بنوشین과 같은 -ین 계열이에요.
    example_gloss: 하루에 세 알 드세요.
  prs.a1.unit46.lesson04.teach.review_day_three_thanks_welcome:
    title: '복습: 하루, 셋, 대단히 감사합니다, 천만에요'
    gloss: 하루 / 셋 / 대단히 감사합니다 / 천만에요
    note: روز, سه, تشکر زیاد, خواهش می‌کنم은 앞 단원에서 배운 복습 단어로, 대화를 마무리할 때 써요.
    target_text: روز (하루) / سه (셋) / تشکر زیاد (정말 감사합니다) / خواهش می‌کنم (천만에요)
  prs.a1.unit46.lesson04.teach.dialogue_line1:
    title: '후마윤: 안녕하세요. 배가 아파요.'
    gloss: 안녕하세요. 배가 아파요.
  prs.a1.unit46.lesson04.teach.dialogue_line2:
    title: '약사: 안녕하세요. 약을 원하세요?'
    gloss: 안녕하세요. 약을 원하세요?
  prs.a1.unit46.lesson04.teach.dialogue_line3:
    title: '후마윤: 네, 알약 한 알 주세요.'
    gloss: 네, 알약 하나 주세요.
  prs.a1.unit46.lesson04.teach.dialogue_line4:
    title: '약사: 이 알약이 좋아요. 하루에 세 알 드세요.'
    gloss: 이 알약이 좋아요. 하루에 세 알 드세요.
  prs.a1.unit46.lesson04.teach.dialogue_line5:
    title: '후마윤: 대단히 감사합니다.'
    gloss: 정말 감사합니다.
  prs.a1.unit46.lesson04.teach.dialogue_line6:
    title: '약사: 천만에요.'
    gloss: 천만에요.
  prs.a1.unit46.lesson05.teach.review_this_is_from:
    title: '복습: 이, 이에요, 후마윤, ~의/~에게서'
    gloss: 이 / 이에요 / 후마윤 / ~의, ~에게서
    note: این, است, همایون은 읽기 지문에 쓰인 복습 단어예요. 앞 단원에서 배운 از는 보통 "~에서, ~로부터"를 뜻하지만, 여기서는 است와 함께 소유를 나타내요. این نسخه از همایون است는 직역하면 "이 처방전은 후마윤으로부터예요"이지만, 실제 뜻은 "이것은 후마윤의 처방전이에요"이고, این کتاب از من است("이 책은 제 거예요")와 같은 구조예요.
    target_text: این (이것) / است (이다) / همایون / از (~의, ~에게서)
  prs.a1.unit46.lesson05.teach.review_one_tablet_day_three_piece_take:
    title: '복습: 하나, 알약, 하루, 셋, 알, 드세요'
    gloss: 하나 / 알약 / 하루 / 셋 / 알 / 드세요
    note: یک, قرص, روز, سه, دانه, بگیرین은 이번 단원에서 배운 복습 단어로, 읽기 지문에 쓰였어요.
    target_text: یک (하나) / قرص (알약) / روز (하루) / سه (셋) / دانه (개) / بگیرین (드세요)
  prs.a1.unit46.lesson05.teach.prescription_word:
    title: 처방전
    gloss: 처방전
    note: نسخه는 처방전이나 약 설명서를 뜻하는 일상적인 다리어 단어예요.
    example_gloss: 이것은 처방전이에요.
  prs.a1.unit46.lesson05.teach.reading_passage:
    title: 처방전 읽기
    gloss: 이것은 후마윤의 처방전이에요. 알약 한 알이에요. 하루에 세 알 드세요.
  prs.a1.unit46.lesson06.teach.review_but_formal_you_how_many:
    title: '복습: 하지만, 당신(격식), 몇'
    gloss: 하지만 / 당신(격식) / 몇
    note: اما, شما, چند는 앞 단원에서 배운 복습 단어로, 복용 일정을 말할 때 써요.
    target_text: اما (하지만) / شما (당신, 높임) / چند (몇)
  prs.a1.unit46.lesson06.teach.review_morning_night_two_three_piece_is_prescription:
    title: '복습: 아침, 밤, 둘, 셋, 알, 이에요, 당신의 처방전'
    gloss: 아침 / 밤 / 둘 / 셋 / 알 / 이에요 / 당신의 처방전
    note: صبح, شب, دو, سه, دانه, است(앞 단원과 이번 단원), 그리고 نسخه‌تان("당신의 처방전", 이 과정의 نام‌تان/تلفن‌تان과 같은 -تان 접미사)은 단원을 마무리할 때 쓰는 복습 단어예요.
    target_text: صبح (아침) / شب (밤) / دو (둘) / سه (셋) / دانه (개) / است (이다) / نسخه‌تان (처방전)
  prs.a1.unit46.lesson06.teach.morning_night_contrast_phrase:
    title: 아침에는 두 알이지만, 밤에는 세 알이에요
    gloss: 아침에는 두 알이지만, 밤에는 세 알이에요.
    note: اما는 아침 복용량과 밤 복용량을 대비시켜요.
  prs.a1.unit46.lesson06.teach.your_prescription_question_phrase:
    title: 처방전에 몇 알이라고 되어 있어요?
    gloss: 처방전에 몇 알이라고 되어 있어요?
    note: شما와 -تان 접미사를 써서 처방전의 복용량을 격식 있게 묻는 표현이에요.
