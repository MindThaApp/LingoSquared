  prs.a1.unit49.lesson04.teach.dialogue_line1:
    title: '호마윤: 안녕하세요. 옷을 빨고 싶어요.'
    gloss: 안녕하세요. 옷을 빨고 싶어요.
  prs.a1.unit49.lesson04.teach.dialogue_line2:
    title: '가게 주인: 안녕하세요, 어서 오세요. 세탁과 다림질을 원하세요?'
    gloss: 안녕하세요, 어서 오세요. 빨래와 다림질을 원하세요?
