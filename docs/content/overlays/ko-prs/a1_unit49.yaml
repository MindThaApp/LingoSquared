  prs.a1.unit49.lesson02.teach.review_price_per_kilo_price:
    title: '복습: 그 가격, ~당, 킬로, 얼마, 아프가니, 삼십'
    gloss: 그 가격 / ~당 / 킬로 / 얼마 / 아프가니 / 삼십
    note: 킬로당 가격을 물을 때 쓰는 복습 단어예요(4과, 10과 등 앞선 과에서 나왔어요).
    target_text: قیمتش (그 가격) / به (~당) / کیلو (킬로) / چند (얼마) / افغانی (아프가니) / سی (삼십)
  prs.a1.unit49.lesson02.teach.ask_price_per_kilo_phrase:
    title: 킬로당 가격이 얼마예요?
    gloss: 킬로당 가격이 얼마예요?
    note: 이 수업에서 앞서 배운 단어들을 합친 문장이에요.
  prs.a1.unit49.lesson02.teach.price_per_kilo_answer_phrase:
    title: 킬로당 30아프가니예요
    gloss: 킬로당 30아프가니예요.
    note: 이미 배운 숫자와 화폐 단위로 가격을 말하는 문장이에요.
  prs.a1.unit49.lesson03.teach.iron_word:
    title: 다리미 / 다림질
    gloss: 다리미 / 다림질
    note: 옷을 다리는 일을 가리키는 일상적인 다리어 단어로, 여기서는 세탁소의 빨래와 다림질 서비스에 쓰여요.
    example_gloss: 옷을 다려요.
  prs.a1.unit49.lesson03.teach.review_wash_and:
    title: '복습: 빨래, 그리고'
    gloss: 빨래 / 그리고
    note: 두 가지 서비스를 말할 때 쓰는 복습 단어예요.
    target_text: شستن (빨래) / و (그리고)
  prs.a1.unit49.lesson03.teach.want_wash_and_iron_phrase:
    title: 빨래와 다림질을 원해요
    gloss: 빨래와 다림질을 원해요.
    note: 이 문장은 빨래, 그리고, 다림질을 합친 거예요.
  prs.a1.unit49.lesson03.teach.ready_word:
    title: 다 된
    gloss: 끝난, 다 된
    note: 준비됐다는 뜻의 일상적인 다리어 단어로, 여기서는 찾는 시간을 묻거나 말할 때 써요.
    example_gloss: 내일 준비돼요.
  prs.a1.unit49.lesson03.teach.review_when_hour_five:
    title: '복습: 언제, 내일, ~시, 다섯'
    gloss: 언제 / 내일 / ~시 / 다섯
    note: 찾는 시간을 묻고 말할 때 쓰는 복습 단어예요(9과, 16과, 48과 등 앞선 과에서 나왔어요).
    target_text: کی (언제) / فردا (내일) / ساعت (시) / پنج (다섯)
  prs.a1.unit49.lesson03.teach.ask_when_ready_phrase:
    title: 언제 준비돼요?
    gloss: 언제 준비돼요?
    note: 이 문장은 언제와 준비된을 합친 거예요.
  prs.a1.unit49.lesson03.teach.ready_tomorrow_five_phrase:
    title: 내일 5시에 준비돼요
    gloss: 내일 5시에 준비돼요.
    note: 이미 배운 내일, ~시, 다섯으로 찾는 시간을 말하는 문장이에요.
  prs.a1.unit49.lesson04.teach.review_hello_want_wash:
    title: '복습: 안녕하세요, 원해요, 제가 빨도록'
    gloss: 안녕하세요 / 원해요 / 제가 빨도록
    note: 대화를 시작할 때 쓰는 복습 단어예요.
    target_text: سلام (안녕하세요) / می‌خواهم (원해요) / بشویم (제가 빨도록)
  prs.a1.unit49.lesson04.teach.review_welcome_wash_and_iron:
    title: '복습: 여기 있어요, 빨래, 다림질, 원하세요(존댓말)'
    gloss: 여기 있어요 / 빨래 / 다림질 / 원하세요(존댓말)
    note: 서비스 종류를 물을 때 쓰는 복습 단어예요.
    target_text: بفرمایین (여기 있어요 / 어서 오세요) / شستن (빨래) / اتو (다림질) / می‌خواهین (원하세요, 존댓말)
  prs.a1.unit49.lesson04.teach.review_yes_price_per_kilo:
    title: '복습: 네, ~당, 킬로, 얼마, 아프가니, ~이다'
    gloss: 네 / ~당 / 킬로 / 얼마 / 아프가니 / ~이다
    note: 가격을 물을 때 쓰는 복습 단어예요.
    target_text: بلی (네) / به (~당) / کیلو (킬로) / چند (얼마) / افغانی (아프가니) / است (~이다)
  prs.a1.unit49.lesson04.teach.review_fifty_ready_tomorrow_five:
    title: '복습: 오십, 준비된, 내일, ~시, 다섯'
