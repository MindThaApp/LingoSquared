  prs.a1.unit49.lesson02.teach.review_want_object_wash:
    title: '복습: 원해요, 목적어 표지, 제가 빨도록'
    gloss: 원해요 / (목적어 표지) / 제가 빨도록
    note: '"제가 빨도록"은 이미 배운 동사 "빨다"의 접속법 형태예요. 이 과정에서 다른 접속법(제가 빌리도록, 제가 받도록)을 만든 방식과 같아요.'
    target_text: می‌خواهم (원해요) / را (목적어 표지) / بشویم (제가 빨도록 — شستن의 접속법)
  prs.a1.unit49.lesson02.teach.review_clothes_plural:
    title: '복습: 옷들'
    gloss: 옷들
    note: '"옷"의 복수형이에요. 이 과정에서 사과의 복수형을 만든 방식과 같아요.'
    target_text: لباس‌ها (옷들 — لباس의 복수형)
  prs.a1.unit49.lesson02.teach.want_to_wash_phrase:
    title: 옷을 빨고 싶어요
    gloss: 옷을 빨고 싶어요.
