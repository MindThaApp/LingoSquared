teaching:
  prs.a1.unit49.lesson01.teach.review_this_is_in:
    title: '복습: 이것, ~이다, ~에'
    gloss: 이것 / ~이다 / ~에
    note: 세탁소에 대해 말할 때 쓰는 복습 단어예요(이 과정 내내 쓰였어요).
    target_text: این (이것) / است (~이다) / در (~에)
  prs.a1.unit49.lesson01.teach.review_clothes_shop_shopkeeper:
    title: '복습: 옷, 가게, 가게 주인'
    gloss: 옷 / 가게 / 가게 주인
    note: 옷은 21과의 복습 단어이고, 가게와 가게 주인은 10과의 복습 단어예요.
    target_text: لباس (옷) / دوکان (가게) / دوکاندار (가게 주인)
  prs.a1.unit49.lesson01.teach.laundry_word:
    title: 세탁소
    gloss: 세탁소
    note: 이 과정에서 배운 옷이라는 단어에 빨래를 뜻하는 동사 어근을 붙여, 세탁소나 세탁 서비스를 가리키는 일상적인 다리어 단어가 돼요.
    example_gloss: 여기는 세탁소예요.
  prs.a1.unit49.lesson01.teach.this_is_laundry_shop_phrase:
    title: 여기는 세탁소예요
    gloss: 여기는 세탁소예요.
    note: 이 문장은 이 과정에서 이미 해 온 것처럼 연결하는 말 없이 명사 두 개를 이어서, 이것·가게·세탁소를 합친 거예요.
  prs.a1.unit49.lesson01.teach.shopkeeper_at_shop_phrase:
    title: 가게 주인은 가게에 있어요
    gloss: 가게 주인은 가게에 있어요.
