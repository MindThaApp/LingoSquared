    title: '호마윤: 네. 1킬로에 얼마예요?'
    gloss: 네. 킬로당 얼마예요?
  prs.a1.unit49.lesson04.teach.dialogue_line4:
    title: '가게 주인: 1킬로에 50아프가니예요. 내일 5시에 준비돼요.'
    gloss: 킬로당 50아프가니예요. 내일 5시에 준비돼요.
  prs.a1.unit49.lesson04.teach.dialogue_line5:
    title: '호마윤: 아주 좋아요. 정말 감사해요.'
    gloss: 아주 좋아요. 정말 감사해요.
  prs.a1.unit49.lesson04.teach.dialogue_line6:
    title: '가게 주인: 천만에요.'
    gloss: 천만에요.
  prs.a1.unit49.lesson05.teach.review_this_is_shopkeeper_in:
    title: '복습: 이것, ~이다, 가게 주인, ~에'
