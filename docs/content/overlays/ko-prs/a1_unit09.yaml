teaching:
  prs.a1.unit09.lesson01.teach.shanbe_yakshanbe:
    title: 토요일과 일요일
    gloss: 토요일, 일요일
    note: شنبه(토요일)는 아프가니스탄에서 한 주의 첫날이고, 그다음이 یکشنبه(일요일)예요.
    example_gloss:
    - 오늘은 토요일이에요.
    - 내일은 일요일이에요.
  prs.a1.unit09.lesson01.teach.doshanbe_seshanbe:
    title: 월요일과 화요일
    gloss: 월요일, 화요일
    note: دوشنبه와 سه‌شنبه는 شنبه 다음의 '둘째 날', '셋째 날'이라는 뜻이에요.
    example_gloss:
    - 월요일에 수업이 있어요.
    - 화요일에 약속이 있어요.
  prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe:
    title: 수요일과 목요일
    gloss: 수요일, 목요일
    note: چهارشنبه와 پنجشنبه도 같은 방식으로 '넷째 날', '다섯째 날'을 뜻해요.
    example_gloss:
    - 수요일에 일해요.
    - 목요일에 봐요.
  prs.a1.unit09.lesson01.teach.jomeh:
    title: 금요일
    gloss: 금요일
    note: جمعه는 아프가니스탄의 주간 휴일로, 우리의 주말처럼 쉬는 날이에요.
    example_gloss: 금요일은 휴일이에요.
  prs.a1.unit09.lesson01.teach.tarikh_word:
    title: 날짜
    gloss: 날짜
    note: تاریخ는 달력의 날짜를 뜻하는 일반적인 단어예요.
    example_gloss: 오늘 날짜가 어떻게 돼요?
  prs.a1.unit09.lesson01.teach.va_word:
    title: And
    gloss: 그리고
    note: و는 이 단원 내내 쓰이는 대표적인 연결어예요.
    target_text: و (그리고)
  prs.a1.unit09.lesson01.teach.weekend_note:
    title: 주간 휴일
    gloss: 금요일은 매주 쉬는 날이에요.
    note: 토·일요일에 쉬는 주말과 달리, 아프가니스탄의 주된 주간 휴일은 *جمعه*(금요일)이에요. 목요일은 보통 반나절만 일해요.
  prs.a1.unit09.lesson02.teach.hamal:
    title: 하말 (1월)
    gloss: 하말, 히즈리 샴시력의 첫 번째 달 (3월 말~4월경)
    note: حمل은 아프가니스탄 태양력 새해의 시작이며 노루즈(새해)와 같은 때예요.
    example_gloss: 하말은 한 해의 첫 번째 달이에요.
  prs.a1.unit09.lesson02.teach.sawr:
    title: 사우르 (2월)
    gloss: 사우르, 두 번째 달 (4월~5월경)
    note: ثور는 حمل 다음 달이에요.
    example_gloss: 사우르에는 날씨가 좋아요.
  prs.a1.unit09.lesson02.teach.jawza:
    title: 자우자 (3월)
    gloss: 자우자, 세 번째 달 (5월~6월경)
    note: جوزا는 ثور 다음 달이에요.
    example_gloss: 저는 자우자에 태어났어요.
  prs.a1.unit09.lesson02.teach.calendar_note:
    title: 아프가니스탄의 달력
    gloss: 아프가니스탄은 히즈리 샴시력(태양 히즈리력)을 사용해요.
    note: 이란에서 쓰는 것과 같은 태양력으로, 양력(그레고리력)이나 음력 히즈리력과는 달라요.
  prs.a1.unit09.lesson03.teach.what_day_today:
    title: 오늘이 무슨 요일인지 묻기
    gloss: 오늘은 무슨 요일이에요?
    note: امروز چند شنبه است؟는 직역하면 '오늘은 몇 번째 -shanbe예요?'라는 뜻으로, 요일을 묻는 자연스러운 표현이에요.
  prs.a1.unit09.lesson03.teach.today_word:
    title: 오늘
    gloss: 오늘
    note: امروز는 오늘을 나타내요.
    example_gloss: 오늘 며칠이에요?
  prs.a1.unit09.lesson04.teach.give_full_date:
    title: 전체 날짜 말하기
    gloss: 오늘은 목요일, 하말 15일이에요.
    note: امروز پنجشنبه، پانزدهم حمل است는 요일, 서수로 된 날짜, 달 이름을 함께 말해요.
  prs.a1.unit09.lesson05.teach.which_day_meeting:
    title: 행사가 무슨 요일인지 묻기
    gloss: 회의가 무슨 요일이에요?
    note: جلسه کدام روز است؟는 کدام(어느)을 써서 행사 요일을 물어요.
  prs.a1.unit09.lesson05.teach.which_date:
    title: 구체적인 날짜 묻기
    gloss: 월요일은 하말 며칠이에요?
    note: دوشنبه چندم حمل است؟는 월요일이 그달의 며칠인지 물어요.
  prs.a1.unit09.lesson06.teach.nozdahom:
    title: 19번째
    gloss: 19번째
    note: '*نوزدهم*은 19의 서수형으로, *پانزدهم*(15번째)과 같은 방식으로 만들어요.'
    example_gloss: 오늘은 19일이에요.
  prs.a1.unit09.lesson06.teach.turn01:
    title: 후마윤이 회의 요일을 물어요
    gloss: 후마윤이 바시르에게 회의가 무슨 요일인지 물어요.
    note: جلسه کدام روز است؟는 앞 과에서 배웠어요.
  prs.a1.unit09.lesson06.teach.turn02:
    title: 바시르가 대답해요
    gloss: 바시르는 월요일일 거라고 말해요.
    note: فکر می‌کنم(제 생각에는)은 확실하지 않을 때 대답을 부드럽게 만들어 줘요.
  prs.a1.unit09.lesson06.teach.turn03:
    title: 후마윤이 정확한 날짜를 물어요
    gloss: 후마윤이 월요일이 하말 며칠인지 물어요.
    note: دوشنبه چندم حمل است؟는 앞 과에서 배웠어요.
  prs.a1.unit09.lesson06.teach.turn04:
    title: 바시르가 정확한 날짜를 알려 줘요
    gloss: 바시르는 월요일이 하말 19일이라고 말해요.
    note: '*دوشنبه نوزدهم حمل است*는 앞 과에서 배운 형식대로 요일, 서수 날짜, 달 이름을 함께 말해요.'
  prs.a1.unit09.lesson06.teach.turn05:
    title: 후마윤이 금요일은 어떤지 물어요
    gloss: 후마윤이 동의하고, 바시르에게 금요일에 시간이 되는지 물어요.
    note: وقت داری؟(시간 있어요?)는 상대방의 일정을 묻는 자연스러운 표현이에요.
  prs.a1.unit09.lesson06.teach.turn06:
    title: 바시르가 바쁘다고 말해요
    gloss: 바시르는 금요일에는 바빠서 안 된다고 말해요.
    note: مصروف استم (바빠요)는 금요일이 안 되는 이유를 설명해요.
  prs.a1.unit09.lesson06.teach.turn07:
    title: 후마윤이 월요일로 확정해요
    gloss: 후마윤은 괜찮다며 월요일에 바시르를 만나겠다고 말해요.
    note: مشکل نیست (문제없어요)는 일정이 맞지 않는 상황을 부드럽게 넘기고, 처음 정한 월요일 약속을 확정해요.
