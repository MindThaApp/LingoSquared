    feedback: چند شنبه는 글자 그대로 '몇 번째 -شنبه'를 묻는 말, 즉 한 주의 무슨 요일인지 묻는 표현이에요. هفته/روز/رخصتی는 1과의 주말 설명을 복습하고, تاریخ는 1과의 날짜 단어를 복습해요.
    pairs:
    - left: امروز چند شنبه است؟
      right: 오늘은 무슨 요일이에요?
    - left: امروز
      right: 오늘
    - left: هفته
      right: 주, 일주일
    - left: روز
      right: 날, 하루
    - left: رخصتی
      right: 휴일
