    - left: یکشنبه
      right: 일요일
    - left: دوشنبه
      right: 월요일
    - left: سه‌شنبه
      right: 화요일
    - left: چهارشنبه
      right: 수요일
    - left: پنجشنبه
      right: 목요일
    - left: جمعه
      right: 금요일
  prs.a1.unit09.lesson01.exercise05.order_days_sequence:
    instruction: '요일을 순서대로 배열하세요: 토요일, 일요일, 월요일.'
    accepted_answers:
    - value:
      - شنبه
      - یکشنبه
      - دوشنبه
      status: correct
    feedback: شنبه، یکشنبه، دوشنبه는 한 주의 자연스러운 순서예요.
  prs.a1.unit09.lesson01.exercise06.translate_friday:
    instruction: '다리어로 번역하세요: 금요일.'
    accepted_answers:
    - value: جمعه
      status: correct
    feedback: جمعه는 금요일이에요.
  prs.a1.unit09.lesson01.exercise07.write_wednesday:
    instruction: 수요일을 뜻하는 다리어 단어를 쓰세요.
    accepted_answers:
    - value: چهارشنبه
      status: correct
    feedback: چهارشنبه는 수요일이에요.
  prs.a1.unit09.lesson02.exercise01.recognize_hamal:
    instruction: 헤즈라 샴시 달력의 첫 번째 달을 뜻하는 단어는 무엇일까요?
    correct_option: حمل
    distractors:
    - ثور
    - جوزا
    - جمعه
    accepted_answers:
    - value: حمل
      status: correct
    feedback: حمل은 첫 번째 달이고, 노루즈 새해와 같은 시기예요.
    prompt_blocks:
    - 첫 번째 달
  prs.a1.unit09.lesson02.exercise02.recognize_jawza:
    instruction: 세 번째 달을 뜻하는 단어는 무엇일까요?
    correct_option: جوزا
    distractors:
    - حمل
    - ثور
    - شنبه
    accepted_answers:
    - value: جوزا
      status: correct
    feedback: جوزا는 세 번째 달이고, ثور 다음에 와요.
    prompt_blocks:
    - 세 번째 달
  prs.a1.unit09.lesson02.exercise03.recognize_sawr_reading:
    instruction: ثور는 어느 달을 뜻할까요?
    correct_option: 사우르
    distractors:
    - 하말
    - 자우자
    - 금요일
    accepted_answers:
    - value: 사우르
      status: correct
    feedback: ثور는 헤즈라 샴시 달력의 두 번째 달인 사우르를 뜻해요.
  prs.a1.unit09.lesson02.exercise04.match_months:
    instruction: 각 달에 대략 해당하는 양력 달을 연결하세요.
    accepted_answers:
    - value:
        حمل: 히즈리 샴시력 1월 (3월 말~4월경)
        ثور: 히즈리 샴시력 2월 (4월~5월경)
        جوزا: 히즈리 샴시력 3월 (5월~6월경)
      status: correct
    feedback: 이 세 달은 아프가니스탄 태양력의 한 해를 시작하는 달이에요.
    pairs:
    - left: حمل
      right: 히즈리 샴시력 1월 (3월 말~4월경)
    - left: ثور
      right: 히즈리 샴시력 2월 (4월~5월경)
    - left: جوزا
      right: 히즈리 샴시력 3월 (5월~6월경)
  prs.a1.unit09.lesson02.exercise05.order_months_sequence:
    instruction: '달을 순서대로 배열하세요: 하말, 사우르, 자우자.'
    accepted_answers:
    - value:
      - حمل
      - ثور
      - جوزا
      status: correct
    feedback: حمل، ثور، جوزا는 한 해의 자연스러운 순서예요.
  prs.a1.unit09.lesson02.exercise06.calendar_check:
    instruction: 아프가니스탄은 일상적인 날짜에 어떤 달력을 사용할까요?
    options:
    - 헤즈라 샴시(태양 헤즈라력)
    - 양력만
    - 태음 헤즈라력만
    accepted_answers:
    - value: 헤즈라 샴시(태양 헤즈라력)
      status: correct
    feedback: افغانستان از تقویم هجری شمسی استفاده می‌کند -- 아프가니스탄은 헤즈라 샴시 달력을 사용해요.
  prs.a1.unit09.lesson02.exercise07.write_hamal:
    instruction: 헤즈라 샴시 달력의 첫 번째 달 이름을 쓰세요.
    accepted_answers:
    - value: حمل
      status: correct
    feedback: حمل은 첫 번째 달이에요.
  prs.a1.unit09.lesson03.exercise01.recognize_what_day:
    instruction: 오늘이 무슨 요일인지 묻는 표현은 무엇일까요?
    correct_option: امروز چند شنبه است؟
    distractors:
    - امروز
    - جلسه کدام روز است؟
    - دوشنبه چندم حمل است؟
    accepted_answers:
    - value: امروز چند شنبه است؟
      status: correct
    feedback: امروز چند شنبه است؟는 요일을 묻는 말이에요.
    prompt_blocks:
    - 오늘은 무슨 요일이에요?
  prs.a1.unit09.lesson03.exercise02.recognize_today_word:
    instruction: 이 말은 무슨 뜻일까요?
    correct_option: 오늘
    distractors:
    - 내일
    - 무슨 요일
    - 달, 월
    accepted_answers:
    - value: 오늘
      status: correct
    feedback: امروز는 '오늘'이라는 뜻이에요.
  prs.a1.unit09.lesson03.exercise03.recognize_what_day_reading:
    instruction: 이 질문은 무엇을 묻고 있나요?
    correct_option: 오늘은 무슨 요일이에요?
    distractors:
    - 회의가 무슨 요일이에요?
    - 월요일은 하말 며칠이에요?
    - 시간 있어요?
    accepted_answers:
    - value: 오늘은 무슨 요일이에요?
      status: correct
    feedback: امروز چند شنبه است؟는 오늘이 무슨 요일인지 묻는 말이에요.
  prs.a1.unit09.lesson03.exercise04.match_today_phrases:
