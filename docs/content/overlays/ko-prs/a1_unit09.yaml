  prs.a1.unit09.lesson01.exercise02.recognize_jomeh:
    instruction: 이 말은 무슨 뜻일까요?
    correct_option: 금요일
    distractors:
    - 토요일
    - 목요일
    - 수요일
    accepted_answers:
    - value: 금요일
      status: correct
    feedback: جمعه는 금요일이고, 매주 쉬는 날이에요.
  prs.a1.unit09.lesson01.exercise03.recognize_doshanbe:
    instruction: دوشنبه은 무슨 요일일까요?
    correct_option: 월요일
    distractors:
    - 토요일
    - 금요일
    - 일요일
    accepted_answers:
    - value: 월요일
      status: correct
    feedback: دوشنبه는 월요일이에요.
  prs.a1.unit09.lesson01.exercise04.match_days:
    instruction: 각 요일에 알맞은 한국어 이름을 연결하세요.
    accepted_answers:
    - value:
        شنبه: 토요일
        یکشنبه: 일요일
        دوشنبه: 월요일
        سه‌شنبه: 화요일
        چهارشنبه: 수요일
        پنجشنبه: 목요일
        جمعه: 금요일
