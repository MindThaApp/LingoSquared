    title: 더 커요
    gloss: 더 커요
    note: بزرگ‌تر است는 붙여 쓰지 않은 완전한 형태('더 커요')예요. *بزرگ‌تر*는 *بزرگ*(큰)의 비교급이고, *است*는 따로 떨어진 단어로 남아요.
    example_gloss: 이것이 저것보다 더 커요.
