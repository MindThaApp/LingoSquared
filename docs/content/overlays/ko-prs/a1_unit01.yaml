course:
  title: 한국어로 배우는 다리어 A1
  description: 페르시아·아랍 문자 읽기, 일상적인 아프가니스탄 말 이해하기, 긴 인사 나누기, 카불의 직장에서 공손하게 첫 만남 갖기를 중심으로 배우는 초급 아프가니스탄 다리어입니다.
units:
  prs.a1.unit01.greetings:
    title: 인사와 첫 만남
lessons:
  prs.a1.unit01.lesson01.script_ramp:
    title: 이 단원에서 쓰는 글자 읽기
  prs.a1.unit01.lesson02.everyday_greetings:
    title: 일상 인사 나누기
  prs.a1.unit01.lesson03.time_and_farewells:
    title: 때에 따라 인사하고 작별하기
  prs.a1.unit01.lesson04.formal_informal_small_talk:
    title: 공손한 말투와 편한 말투로 가벼운 대화하기
  prs.a1.unit01.lesson05.afghan_hospitality:
    title: 가족 안부를 묻고 손님을 존중하기
  prs.a1.unit01.lesson06.first_meeting_dialogue:
    title: 카불 직장에서 첫날 시작하기
teaching:
  prs.a1.unit01.lesson01.teach.alef_be_te_dal:
    title: 글자 ا، ب، ت، د
    gloss: a/ā, b, t, d
    note: 다리어는 오른쪽에서 왼쪽으로 씁니다. د는 왼쪽 글자와 이어지지 않습니다.
  prs.a1.unit01.lesson01.teach.re_ze:
    title: 글자 ر، ز
    gloss: r, z
    note: 두 글자 모두 뒤에 오는 글자와 이어지지 않습니다.
  prs.a1.unit01.lesson01.teach.sin_shin_sad:
    title: 글자 س، ش، ص
    gloss: s, sh, s
    note: 일반적인 다리어에서 س와 ص는 둘 다 s 소리이고, ش는 sh 소리입니다.
  prs.a1.unit01.lesson01.teach.jim_che_he_khe:
    title: 글자 ج، چ، ح، خ
    gloss: j, ch, h, kh
    note: چ는 ch 소리입니다. خ는 흔히 kh로 표기하는 소리입니다.
  prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf:
    title: 글자 ع، غ، ف، ق
    gloss: ʿ, gh, f, q
    note: غ와 ق의 정확한 발음은 다리어 화자마다 조금씩 다릅니다. 그래도 철자는 서로 구별해서 쓰세요.
  prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim:
    title: 글자 ک، گ، ل، م
    gloss: k, g, l, m
    note: ک는 페르시아어 카프이며, 다리어에서 k를 나타낼 때 쓰는 형태입니다. ل과 م은 양쪽 글자와 모두 이어집니다.
  prs.a1.unit01.lesson01.teach.nun_vav_he_ye:
    title: 글자 ن، و، ه، ی
    gloss: n, w/v/o/u, h, y/긴 i
    note: ی는 페르시아어 예로, y 소리와 긴 모음 ee를 나타냅니다. و는 자음(w/v)일 수도 있고 긴 모음(o/oo)일 수도 있습니다.
  prs.a1.unit01.lesson01.teach.connected_salam:
    title: 이어진 단어 읽기
    gloss: 안녕하세요
    note: 글자들이 이어져 سلام이 됩니다. 짧은 모음은 보통 쓰지 않습니다.
    example_gloss: 안녕하세요! 저는 카림이에요.
  prs.a1.unit01.lesson02.teach.salam_alaikum:
    title: 공손한 일상 인사
    gloss: 당신에게 평화가 있기를 / 안녕하세요
    note: سلام علیکم은 아프가니스탄에서 널리 쓰이며, 친한 사이에서도 존중을 표할 자리에서도 어울립니다.
  prs.a1.unit01.lesson02.teach.wa_alaikum_salam:
    title: 인사에 답하기
    gloss: 당신에게도 평화가 있기를
    note: وعلیکم سلام은 관례적으로 سلام علیکم에 대한 답입니다. السلام이 들어간 형태도 정답으로 인정됩니다.
  prs.a1.unit01.lesson02.teach.salam:
    title: 짧은 인사
    gloss: 안녕하세요
    note: سلام은 두루 쓸 수 있는 짧은 인사입니다.
    example_gloss: 안녕하세요, 잘 지내세요?
  prs.a1.unit01.lesson02.teach.khosh_amadeed:
    title: 환영해요
    gloss: 환영해요
    note: خوش آمدین은 공손한 구어체 환영 인사로, 한 사람에게도 여러 사람에게도 쓸 수 있습니다.
  prs.a1.unit01.lesson02.teach.tashakor:
    title: 고맙습니다
    gloss: 고맙습니다
    note: تشکر는 이 과정에서 기본으로 쓰는 아프가니스탄 다리어 표현입니다. ممنون과 ممنونم은 이해하면 되는 부차적인 변형입니다.
    example_gloss: 정말 고맙습니다.
  prs.a1.unit01.lesson02.teach.khahesh:
    title: 감사 인사에 대한 격식 있는 대답
    gloss: 천만에요
    note: خواهش می‌کنم은 여러 지역에서 두루 쓰는 공손한 페르시아어 대답입니다. 아프가니스탄만의 구어체 표현으로 소개하는 것은 아닙니다.
  prs.a1.unit01.lesson02.teach.khoda_hafez:
    title: 작별 인사
    gloss: 안녕히 가세요
    note: خدا حافظ는 아프가니스탄 다리어의 전형적인 작별 인사이며, 흔히 두 단어로 띄어 씁니다.
  prs.a1.unit01.lesson03.teach.sobh_bekheyr:
    title: 아침 인사
    gloss: 좋은 아침이에요
    note: صبح بخیر는 아침에 씁니다.
  prs.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: 낮 인사
    gloss: 좋은 하루 되세요
    note: روز بخیر는 낮에 하는 공손한 인사입니다.
  prs.a1.unit01.lesson03.teach.asr_bekheyr:
    title: 늦은 오후 인사
    gloss: 안녕하세요 (오후/저녁 인사)
    note: عصر بخیر는 하루 중 늦은 시간대에 어울립니다.
  prs.a1.unit01.lesson03.teach.shab_bekheyr:
    title: 밤 인사
    gloss: 잘 자요
    note: شب بخیر는 보통 저녁을 마무리할 때 쓰며, 평범한 낮의 만남을 시작할 때는 쓰지 않습니다.
  prs.a1.unit01.lesson03.teach.rooz_khosh:
    title: 낮에 하는 공손한 작별 인사
    gloss: 좋은 하루 보내세요
    note: روز خوش는 여러 지역에서 두루 쓰는 공손하고 다소 격식 있는 작별 인사이며, 아프가니스탄 특유의 구어체 표현은 아닙니다.
  prs.a1.unit01.lesson03.teach.be_omide_didar:
    title: 다음에 만날 때까지
    gloss: 다시 만나길 바라요
    note: به امید دیدار는 따뜻하면서도 공손한 작별 인사입니다.
  prs.a1.unit01.lesson04.teach.polite_question:
    title: 상대의 안부를 공손하게 묻기
    gloss: 안녕하세요?
    note: استین은 شما와 함께 쓰는, 아프가니스탄 다리어에서 흔한 공손한 구어체 형태입니다.
  prs.a1.unit01.lesson04.teach.informal_question:
    title: 또래나 친한 친구에게 안부 묻기
    gloss: 안녕하세요?
    note: تو와 استی는 친근한 단수 표현입니다. 어른이나 새로 알게 된 사람에게 이 조합을 무심코 쓰지 마세요.
  prs.a1.unit01.lesson04.teach.good_answer:
    title: 잘 지낸다고 말하기
    gloss: 잘 지내요, 감사합니다.
    note: استم은 '저는 ~이에요'라는 뜻입니다. 이 과정 전체에서 쓰는 아프가니스탄 다리어 구어체 형태입니다.
  prs.a1.unit01.lesson04.teach.jor_answer:
    title: 건강하다, 괜찮다고 말하기
    gloss: 잘 지내요.
    note: جور에는 건강하고 잘 지낸다는 뜻이 있으며, 아프가니스탄의 인사에 자주 나옵니다.
  prs.a1.unit01.lesson04.teach.not_bad:
    title: 절제된 대답
    gloss: 나쁘지 않아요.
    note: بد نیستم은 중립적인 대답입니다.
  prs.a1.unit01.lesson04.teach.and_you:
    title: 질문을 되돌려 묻기
    gloss: 당신은요?
    note: و شما؟는 대화를 공손하고 간결하게 이어 줍니다.
  prs.a1.unit01.lesson04.teach.everyone_well:
    title: 인사를 이어 가기
    gloss: 모두 잘 지내세요?
    note: 아프가니스탄의 인사는 본론에 들어가기 전에 집안 식구들의 안부를 묻는 것으로 이어지기도 합니다.
  prs.a1.unit01.lesson05.teach.family_well:
    title: 상대의 가족 안부 묻기
    gloss: 가족분들은 잘 지내세요?
    note: 가족의 안부를 묻는 것은 아프가니스탄의 긴 인사에서 흔한 부분입니다. 이 과정에서는 소유형을 فامیل‌تان으로 씁니다.
  prs.a1.unit01.lesson05.teach.household_well:
    title: 집안 식구들의 안부 묻기
    gloss: 집에 계신 분들은 모두 잘 지내세요?
    note: اهل خانه는 한 집안 식구들을 통틀어 가리킵니다.
  prs.a1.unit01.lesson05.teach.everyone_well:
    title: 가족 안부에 답하기
    gloss: 하느님 덕분에 모두 잘 지내요.
    note: 여기서 شکر는 감사를 뜻하는 줄임 표현이며, 음식인 설탕을 뜻하는 것이 아닙니다.
  prs.a1.unit01.lesson05.teach.zenda_bashin:
    title: 따뜻하고 공손하게 답하기
    gloss: 오래 사세요 / 감사합니다.
    note: زنده باشین은 아프가니스탄에서 흔히 쓰는 예의 표현으로, 감사나 따뜻한 말에 대한 답으로 자주 씁니다. باشین은 상대를 높이는 구어체 형태입니다.
  prs.a1.unit01.lesson05.teach.own_home:
    title: 손님을 따뜻하게 맞이하기
    gloss: 자기 집처럼 편히 계세요.
    note: خانهٔ خودتان است는 손님에게 환영받고 있다는 마음을 전해 줍니다.
  prs.a1.unit01.lesson05.teach.seat_of_honor:
    title: 상석을 권하기
    gloss: 상석에 앉으세요.
    note: 손님방에서 بالا بفرمایین은 손님을 입구에서 먼 더 높은 자리로 안내하는 말입니다. 꼭 위층을 뜻하는 것은 아닙니다.
  prs.a1.unit01.lesson05.teach.elders_first:
    title: 어른께 먼저 인사하기
    gloss: 우리는 어른께 먼저 인사해요.
    note: 어른께 먼저 인사하는 것은 존중의 표현입니다. 신체 접촉을 동반한 인사는 관계, 성별, 상대의 태도에 따라 달라지므로 악수가 적절하다고 단정하지 마세요.
  prs.a1.unit01.lesson06.teach.daftar:
    title: 사무실
    gloss: 사무실
    note: دفتر는 사무실이나 일하는 곳을 가리킵니다.
    example_gloss: 제 사무실은 카불에 있어요.
  prs.a1.unit01.lesson06.teach.kabul:
    title: 카불
    gloss: 카불
    note: کابل은 아프가니스탄의 수도이며, 이 대화의 배경입니다.
    example_gloss: 저는 카불에 살아요.
  prs.a1.unit01.lesson06.teach.line01:
    title: 하메드가 새 동료라고 자기소개하기
    gloss: 하메드가 자신이 새 동료라고 말해요.
    note: 두 사람은 카불의 사무실에서 만난 성인 남성 동료입니다.
  prs.a1.unit01.lesson06.teach.line02:
    title: 나지브가 환영하며 이름을 묻기
    gloss: 나지브가 환영하며 이름을 물어요.
    note: خوش آمدین은 한 사람에게도 여러 사람에게도 쓸 수 있는, 존중을 담은 다리어 구어 환영 인사예요.
  prs.a1.unit01.lesson06.teach.line03:
    title: 하메드가 자기 이름을 말해요
    gloss: 하메드가 자기 이름을 말해요.
    note: نامم حامد است(제 이름은 하메드예요)는 일상 구어 형태예요. نامم은 نام + -م(제)으로 이루어져 있어요. 글에서는 نام من حامد است도 볼 수 있어요. 둘 다 맞아요.
  prs.a1.unit01.lesson06.teach.line04:
    title: 나지브가 자기소개를 하며 만나서 반갑다고 말해요
    gloss: 나지브가 자기소개를 하며 만나서 반갑다고 말해요.
    note: از آشنایی با شما خوش شدم은 서로 알게 되었다는 뜻이 분명히 담겨 있어서 첫 만남에 어울려요.
  prs.a1.unit01.lesson06.teach.line05:
    title: 하메드가 같은 인사를 건네고 나지브의 안부를 물어요
    gloss: 하메드가 같은 인사를 건네고 나지브의 안부를 물어요.
    note: 새 동료 사이라서 존중을 나타내는 شما와 استین을 계속 써요.
  prs.a1.unit01.lesson06.teach.line06:
    title: 나지브가 대답해요
    gloss: 나지브가 잘 지낸다며 감사하다고 말해요.
    note: جور استم، تشکر는 이 단원 앞에서 배운 대로 안부 질문에 대한 대답이에요.
  prs.a1.unit01.lesson06.teach.line07:
    title: 나지브가 하메드의 가족 안부를 물어요
    gloss: 나지브가 하메드의 가족 안부를 물어요.
    note: 가족 안부를 묻는 것은 일 이야기로 넘어가기 전에 인사를 이어 가는 거예요.
  prs.a1.unit01.lesson06.teach.line08:
    title: 하메드가 모두 잘 지낸다고 말해요
    gloss: 하메드가 모두 잘 지낸다고 말해요.
    note: شکر، همه جور استند는 이 단원 앞에서 배운 대로 가족 안부 질문에 대한 대답이에요.
  prs.a1.unit01.lesson06.teach.line09:
    title: 나지브가 다른 동료들을 소개해 주겠다고 해요
    gloss: 나지브가 다른 동료들을 소개해 주겠다고 해요.
    note: 여기서 بفرمایین은 앉거나 무언가를 받으라는 뜻이 아니라, 하메드에게 따라오라고 권하는 말이에요.
  prs.a1.unit01.lesson06.teach.line10:
    title: 하메드가 감사하며 좋다고 답해요
    gloss: 하메드가 감사하며 좋다고 답해요.
    note: بسیار خوب은 분명한 긍정의 대답으로 여기서 처음 나와요.
  prs.a1.unit01.lesson06.teach.line11:
    title: 나지브가 따뜻하게 답하며 하메드의 책상을 알려 줘요
    gloss: 나지브가 따뜻하게 답하며 하메드의 책상을 알려 줘요.
    note: 대화는 집을 방문했을 때의 작별 인사를 반복하지 않고 업무를 시작하며 끝나요.
  prs.a1.unit01.lesson06.teach.line12:
    title: 하메드가 고맙다고 말해요
    gloss: 하메드가 고맙다고 말해요.
    note: تشکر로 간단하게 대화를 마무리해요.
exercises:
  prs.a1.unit01.lesson01.exercise01.recognize_sin:
    instruction: سلام은 어떤 글자로 시작할까요?
    correct_option: س
    distractors:
    - ش
    - ص
    - چ
    accepted_answers:
    - value: س
      status: correct
    feedback: سلام은 س로 시작해요. 이 문제는 배운 단어의 철자를 묻는 것이지, s 소리를 나타낼 수 있는 글자를 묻는 것이 아니에요.
  prs.a1.unit01.lesson01.exercise02.recognize_che:
    instruction: ch 소리를 나타내는 글자는 무엇일까요?
    correct_option: چ
    distractors:
    - ج
    - خ
    - ش
    accepted_answers:
    - value: چ
      status: correct
    feedback: چ는 ch 소리를 나타내요.
    prompt_blocks:
    - ch
  prs.a1.unit01.lesson01.exercise03.match_ke_gaf:
    instruction: 각 글자와 그 소리를 짝지으세요.
    accepted_answers:
    - value:
        ا: 한
