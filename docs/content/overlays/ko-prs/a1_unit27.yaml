  prs.a1.unit27.lesson04.teach.dialogue_line2:
    title: '자르미나: 키가 크고 머리카락이 검어.'
    gloss: '자르미나: 키가 크고 머리카락이 검어.'
    note: و(그리고)로 두 가지 특징을 연결합니다.
  prs.a1.unit27.lesson04.teach.dialogue_line3:
    title: '호마윤: 수염이 있어?'
    gloss: '호마윤: 수염이 있어?'
