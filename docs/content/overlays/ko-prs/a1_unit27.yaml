    gloss: 카림은 키가 커요. 머리카락은 검고 눈은 갈색이에요. 수염은 없지만 안경을 썼어요.
    note: 이 단원의 외모 단어를 정리한 짧은 읽기 글입니다. 비교 단원에 나왔던 인물 کریم(카림)이 등장하며, دارد의 3인칭 부정형 ندارد(없다)가 나옵니다.
