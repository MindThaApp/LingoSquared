  prs.a1.unit27.lesson04.teach.dialogue_line4:
    title: '자르미나: 응, 수염이 있고 안경도 썼어.'
    gloss: '자르미나: 응, 수염이 있고 안경도 썼어.'
    note: 두 번째 특징에 هم(~도)을 쓴 문장입니다.
  prs.a1.unit27.lesson04.teach.dialogue_line5:
    title: '호마윤: 좋아, 고마워.'
    gloss: '호마윤: 좋아, 고마워.'
