    target_text: اما (하지만)
  prs.a1.unit27.lesson06.teach.review_astam:
    title: 저는 ~이에요 / 저는 가지고 있어요
    gloss: 저는 ~예요 / 저는 가지고 있어요
    note: استم(저는 ~이다)과 دارم(저는 가지고 있다)은 앞에서 배운 복습 표현으로, 여기서는 1인칭으로 자신의 외모를 묘사할 때 쓰입니다.
