teaching:
  prs.a1.unit27.lesson01.teach.tall_phrase:
    title: 키가 큰
    gloss: 키가 큰
    note: قد بلند는 직역하면 "긴 키"라는 뜻입니다. قد(키) + بلند(길다/크다)로 이루어져 있습니다.
    example_gloss: 그(녀)는 키가 커요.
  prs.a1.unit27.lesson01.teach.short_phrase:
    title: 키가 작은
    gloss: 키가 작은
    note: قد کوتاه는 직역하면 "짧은 키"라는 뜻입니다. قد(키, 복습) + کوتاه(짧다)로 이루어져 있습니다.
    example_gloss: 그는 키가 작아요.
  prs.a1.unit27.lesson01.teach.hair_word:
    title: 머리카락
    gloss: 머리카락
    note: 'مو는 머리카락이라는 뜻입니다. موی는 같은 단어의 연결형으로, 다른 단어 앞에서 쓰입니다(예: موی سیاه, "검은 머리카락").'
    example_gloss: 그의 머리카락은 검은색이에요.
  prs.a1.unit27.lesson01.teach.eye_word:
    title: 눈
    gloss: 눈
    note: چشم은 눈이라는 뜻입니다. 눈 색깔을 말할 때는 단수형을 쓰는 것이 일상적으로 자연스럽습니다.
    example_gloss: 그의 눈은 검은색이에요.
  prs.a1.unit27.lesson01.teach.beard_word:
    title: 수염
    gloss: 수염
    note: ریش는 수염이라는 뜻입니다.
    example_gloss: 그(녀)는 수염이 있어요.
  prs.a1.unit27.lesson01.teach.glasses_word:
    title: 안경
    gloss: 안경
    note: عینک는 안경이라는 뜻입니다.
    example_gloss: 그는 안경을 썼어요.
  prs.a1.unit27.lesson01.teach.review_ast_dast:
    title: ~이에요 / 가지고 있어요 (3인칭)
    gloss: ~이다 / 가지고 있다(3인칭)
    note: است(~이다)와 دارد(가지고 있다, 3인칭)는 앞에서 배운 표현으로, 이 단원 내내 사람의 외모를 묘사할 때 쓰입니다.
    target_text: است (이다) / دارد (가지고 있다, 3인칭)
  prs.a1.unit27.lesson02.teach.qiyafa_word:
    title: 외모 / 생김새
    gloss: 외모 / 생김새
    note: 'قیافه는 사람의 생김새나 외모를 뜻합니다(예: خوش قیافه, "잘생긴").'
    example_gloss: 그의 외모는 좋아요.
  prs.a1.unit27.lesson02.teach.review_chetor:
    title: 어떻게
    gloss: 어떻게
    note: چطور는 "어떻게"라는 뜻입니다(앞에서 چطور استین؟ 같은 인사말에서 이미 나왔습니다).
    target_text: چطور (어떻게)
  prs.a1.unit27.lesson02.teach.qiyafash_word:
    title: 그의 외모
    gloss: 그(녀)의 외모
    note: قیافه‌اش는 قیافه(외모)에 소유 접미사 ‌اش("그의")가 붙은 형태입니다.
  prs.a1.unit27.lesson02.teach.question_appearance:
    title: 그(녀)는 어떻게 생겼어요?
    gloss: 그(녀)는 어떻게 생겼어요?
    note: قیافه‌اش چطور است؟는 어떻게 생겼는지 묻는 자연스러운 표현입니다. چطور است؟만 쓰면 "그는 어떻게 지내요?"라는 안부 질문처럼 들리므로 일부러 쓰지 않았습니다.
  prs.a1.unit27.lesson02.teach.answer_tall:
    title: 그는 키가 커요
    gloss: 그(녀)는 키가 커요.
    note: او(그/그녀, 복습)와 이 단원의 قد بلند است를 합친 문장입니다.
  prs.a1.unit27.lesson02.teach.answer_black_hair:
    title: 그는 검은 머리예요
    gloss: 그(녀)는 검은 머리예요.
    note: موی(머리카락), سیاه(검정), دارد(가지고 있다)를 합친 문장입니다.
  prs.a1.unit27.lesson02.teach.answer_beard:
    title: 그는 수염이 있어요
    gloss: 그(녀)는 수염이 있어요.
    note: 위의 검은 머리 문장과 같은 "가지고 있다" 패턴인 ریش دارد를 씁니다.
  prs.a1.unit27.lesson03.teach.review_rang:
    title: 색깔
    gloss: 색
    note: رنگ는 색깔이라는 뜻입니다(앞서 21단원 옷 주제에서 이미 나왔습니다).
    target_text: رنگ (색)
  prs.a1.unit27.lesson03.teach.blue_word:
    title: 파란색
    gloss: 파란색
    note: آبی는 파란색이라는 뜻입니다.
    example_gloss: 그(녀)의 눈은 파란색이에요.
  prs.a1.unit27.lesson03.teach.brown_word:
    title: 갈색
    gloss: 갈색의
    note: قهوه‌ای는 갈색이라는 뜻입니다(머리카락이나 눈 색깔에 쓰입니다).
    example_gloss: 그(녀)의 머리는 갈색이에요.
  prs.a1.unit27.lesson03.teach.eye_color_phrase:
    title: 눈 색깔
