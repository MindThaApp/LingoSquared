    gloss: 하지만
    note: اما는 '하지만'이라는 뜻이에요. 앞에서 이미 배웠어요.
    target_text: اما (하지만)
  prs.a1.unit26.lesson06.teach.review_hobby_word:
    title: 취미 (복습)
    gloss: 취미
    note: سرگرمی는 '취미'라는 뜻이에요. (1과에서 복습)
