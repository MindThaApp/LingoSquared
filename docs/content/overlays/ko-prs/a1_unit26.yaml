course:
  title: 한국어로 배우는 다리어 A1
  description: '카불 다리어 초급: 취미와 여가 시간 어휘(독서, 음악 듣기, 영화 보기, 걷기, 요리), دوست دارین으로 여가 시간에 무엇을 좋아하는지 묻기, هر هفته/آخر هفته으로 빈도 말하기, 그리고 자르미나와 호마윤이 여가 시간을 어떻게 보내는지 비교하는 대화를 배워요.'
units:
