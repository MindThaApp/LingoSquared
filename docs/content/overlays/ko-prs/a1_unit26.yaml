teaching:
  prs.a1.unit26.lesson01.teach.hobby_word:
    title: 취미
    gloss: 취미
    note: سرگرمی는 '취미'라는 뜻이에요.
    example_gloss: 걷기는 제 취미예요.
  prs.a1.unit26.lesson01.teach.reading_word:
    title: 독서(책 읽기)
    gloss: 독서(책 읽기)
    note: کتاب خواندن은 직역하면 "책 읽기"예요. کتاب(책) + خواندن(읽기)로 이루어져 있어요.
    example_gloss: 독서는 제 취미예요.
  prs.a1.unit26.lesson01.teach.music_word:
    title: 음악 듣기
    gloss: 음악 듣기
    note: موسیقی گوش کردن은 직역하면 "음악 귀 하기"예요. موسیقی(음악, 앞에서 이미 배웠어요) + گوش(귀) + کردن(하다)로 이루어져 있어요.
    example_gloss: 음악 듣기는 제 취미예요.
  prs.a1.unit26.lesson01.teach.movie_word:
    title: 영화 보기
    gloss: 영화 보기
    note: فلم دیدن은 직역하면 "영화 보기"예요. فلم(영화) + دیدن(보기)로 이루어져 있어요.
    example_gloss: 영화 보기는 제 취미예요.
  prs.a1.unit26.lesson01.teach.walking_word:
    title: 걷기
    gloss: 걷기(산책)
    note: پیاده‌روی는 (활동이나 운동으로서의) 걷기, 즉 산책이라는 뜻이에요.
    example_gloss: 걷기는 제 취미예요.
  prs.a1.unit26.lesson01.teach.cooking_word:
    title: 요리
    gloss: 요리
    note: آشپزی는 '요리'라는 뜻이에요.
    example_gloss: 요리는 제 취미예요.
  prs.a1.unit26.lesson02.teach.free_word:
    title: 한가한
    gloss: 한가한
    note: آزاد는 '바쁘지 않아서 한가하다'는 뜻이에요. '무료'라는 뜻이 아니에요.
    example_gloss: 오늘은 한가해요.
  prs.a1.unit26.lesson02.teach.review_waqt:
    title: 시간
    gloss: 시간
    note: وقت는 '시간'이라는 뜻이에요. 앞에서 이미 배웠어요.
    target_text: وقت (시간)
  prs.a1.unit26.lesson02.teach.free_time_phrase:
    title: 여가 시간
    gloss: 시간
    note: وقت آزاد는 직역하면 "한가한 시간"이에요. وقت(시간) + آزاد(한가한)로 이루어져 있어요.
  prs.a1.unit26.lesson02.teach.chi_word:
    title: 무엇
    gloss: 무엇
    note: چی는 일상 구어에서 "무엇"을 뜻하는 말이에요.
    target_text: چی (무엇)
  prs.a1.unit26.lesson02.teach.review_dar:
    title: ~에
    gloss: ~에
    note: در는 "~에" 또는 "~에서"라는 뜻이에요. 앞에서 이미 배웠어요.
    target_text: در (~에, ~에서)
  prs.a1.unit26.lesson02.teach.review_like_reading:
    title: 저는 독서를 좋아해요
    gloss: 저는 독서를 좋아해요.
    note: را와 함께 쓰는 دوست دارم(좋아해요)을 복습하며, 이번 단원의 کتاب خواندن에 적용해요.
  prs.a1.unit26.lesson02.teach.question_free_time:
    title: 여가 시간에 무엇을 하는 걸 좋아하세요?
    gloss: 여가 시간에 무엇을 하는 걸 좋아하세요?
    note: 상대방의 취미를 물을 때 흔히 쓰는 표현이에요. 앞에서 배운 높임형 دارین을 사용해요.
  prs.a1.unit26.lesson03.teach.review_har_ruz:
    title: 매일
    gloss: 매일
    note: هر روز는 '매일'이라는 뜻이에요. 앞에서 이미 배웠어요.
    target_text: هر روز (매일)
  prs.a1.unit26.lesson03.teach.review_hafta:
    title: 주
    gloss: 주, 일주일
    note: هفته는 '주(일주일)'라는 뜻이에요. 앞에서 이미 배웠어요.
    example_gloss: 금요일은 한 주의 쉬는 날이에요.
  prs.a1.unit26.lesson03.teach.har_hafta:
    title: 매주
    gloss: 매주
    note: هر هفته는 직역하면 "매주"예요. هر(매~) + هفته(주)로 이루어져 있어요.
  prs.a1.unit26.lesson03.teach.akher_word:
    title: 끝
    gloss: 끝
    note: آخر는 '끝'이라는 뜻이에요.
    example_gloss: 주말에는 한가해요.
  prs.a1.unit26.lesson03.teach.akher_hafta:
    title: 주말
    gloss: 주말
    note: آخر هفته는 직역하면 "주의 끝"이에요. آخر(끝) + هفته(주)로 이루어져 있어요.
  prs.a1.unit26.lesson03.teach.review_mikonam:
    title: 저는 해요
    gloss: 해요
    note: می‌کنم은 "저는 해요"라는 뜻이에요. پیاده‌روی나 آشپزی와 함께 써서 "저는 걸어요", "저는 요리해요"라고 말해요.
    target_text: می‌کنم (저는 해요)
  prs.a1.unit26.lesson03.teach.walk_every_week:
    title: 저는 매주 걸어요
    gloss: 저는 매주 걸어요.
    note: هر هفته와 پیاده‌روی می‌کنم을 합친 문장이에요.
  prs.a1.unit26.lesson04.teach.review_pronouns_verb:
    title: 저 / 당신 / 당신은 해요?
    gloss: 나 / 너(비격식) / 너는 하니?(비격식)
    note: من(나)과 تو(너, 비격식)는 복습이에요. می‌کنی는 비격식의 "너는 해"를 나타내는 형태로, 앞에서 본 رفتی/کردی의 -ی 형태와 같아요.
    target_text: من (나) / تو (너) / می‌کنی (너는 하니?, 비격식)
  prs.a1.unit26.lesson04.teach.review_connectors:
    title: ~도 / 가끔 / 그리고
    gloss: ~도 / 가끔 / 그리고
    note: هم(~도), گاهی(가끔), و(그리고)는 모두 앞에서 배운 내용의 복습이에요.
    target_text: هم (~도) / گاهی (가끔) / و (그리고, ~와)
  prs.a1.unit26.lesson04.teach.dialogue_line1:
    title: '호마윤: 자르미나, 여가 시간에 뭐 해?'
    gloss: '호마윤: 자르미나, 여가 시간에 뭐 해?'
    note: 친구 사이에 쓰는 편한 질문이에요. تو와 -ی를 사용해요.
  prs.a1.unit26.lesson04.teach.dialogue_line2:
    title: '자르미나: 나는 독서를 좋아하고, 가끔 음악도 들어'
    gloss: '자르미나: 나는 독서를 좋아하고, 가끔 음악도 들어.'
    note: و(그리고)로 두 가지 활동을 연결해요.
  prs.a1.unit26.lesson04.teach.dialogue_line3:
    title: '호마윤: 나는 매주 걸어'
    gloss: '호마윤: 나는 매주 걸어.'
    note: 3과의 문장 *من هر هفته پیاده‌روی می‌کنم*(저는 매주 걸어요)을 다시 사용해요.
  prs.a1.unit26.lesson04.teach.dialogue_line4:
    title: '자르미나: 좋네! 나도 영화 보는 걸 좋아해'
    gloss: '자르미나: 좋네! 나도 영화 보는 걸 좋아해.'
    note: هم(~도)을 새로운 활동에 적용해요.
  prs.a1.unit26.lesson04.teach.dialogue_line5:
    title: '호마윤: 나도 가끔 요리해'
    gloss: '호마윤: 나도 가끔 요리해.'
    note: گاهی(가끔)와 می‌کنم을 آشپزی에 적용해요.
  prs.a1.unit26.lesson05.teach.reading_passage:
    title: 취미에 대한 읽기
    gloss: 자르미나는 독서를 좋아해요. 호마윤은 여가 시간에 걸어요. 그는 가끔 요리도 해요.
    note: 이번 단원의 취미 어휘를 정리하는 짧은 읽기 글이에요. او(그/그녀)를 복습하고, 널리 쓰이는 3인칭 형태 می‌کند(해요)와 دارد(가지고 있어요/좋아해요)를 새로 배워요.
  prs.a1.unit26.lesson06.teach.review_ama:
