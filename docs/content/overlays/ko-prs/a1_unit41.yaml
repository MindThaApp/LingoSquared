course:
  title: 한국어로 배우는 다리어 A1
  description: '카불 다리어 초급: 개인 물건을 잃어버렸다고 알리기, 찾았는지 묻기, 색과 크기로 물건 설명하기, 분실물에 관한 짧은 글 읽기.'
units:
  prs.a1.unit41.lost_items:
    title: 분실물
    description: 개인 물건을 잃어버렸다고 알리고, 찾았는지 묻고, 물건을 설명하고, 되찾았을 때 확인하는 법을 배워요.
