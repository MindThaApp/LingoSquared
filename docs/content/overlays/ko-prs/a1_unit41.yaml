teaching:
  prs.a1.unit41.lesson01.teach.review_this_is:
    title: '복습: 이것, ~이다'
    gloss: 이것 / ~이에요
    note: این과 است는 어떤 것이 무엇인지 말할 때 쓰는 기초 단어로, 복습해요.
    target_text: این (이것) / است (이다)
  prs.a1.unit41.lesson01.teach.review_have:
    title: '복습: 저는 ~이 있어요'
    gloss: 저는 ~이/가 있어요
    note: دارم은 자신이 가지고 있거나 들고 있는 물건을 말할 때 쓰는 복습 단어예요.
    target_text: دارم (저는 가지고 있어요)
  prs.a1.unit41.lesson01.teach.bag_word:
    title: 가방
    gloss: 가방
    note: خریطه는 '가방'을 뜻하는 표준 다리어 단어예요.
    example_gloss: 가방이 있어요.
  prs.a1.unit41.lesson01.teach.wallet_word:
    title: 지갑
    gloss: 지갑
    note: کیف پول은 '지갑'이라는 뜻이며, کیف(가방, 케이스)와 پول(돈)이 합쳐진 말이에요.
    example_gloss: 저는 지갑이 있어요.
  prs.a1.unit41.lesson01.teach.key_word:
    title: 열쇠
    gloss: 열쇠
    note: کلید는 '열쇠'라는 뜻이에요.
    example_gloss: 저는 열쇠가 있어요.
  prs.a1.unit41.lesson01.teach.glasses_word:
    title: 안경
    gloss: 안경
    note: عینک은 '안경'이라는 뜻이에요.
    example_gloss: 저는 안경이 있어요.
  prs.a1.unit41.lesson01.teach.lost_word:
    title: 없어졌어요
    gloss: 없어졌어요
    note: گم شده는 گم(잃어버린)과 شده(되었다)가 합쳐진 말로, 물건이 없어졌다고 할 때 쓰는 표준 표현이에요. 40과의 زخمی است(다쳤어요)와 같은 구조예요.
    example_gloss: 제 가방이 없어졌어요.
  prs.a1.unit41.lesson01.teach.wallet_lost_phrase:
    title: 제 지갑이 없어졌어요!
    gloss: 제 지갑이 없어졌어요!
    note: کیف پولم은 کیف پول에 소유를 나타내는 접미사 -م(제)이 붙은 말이에요. 앞에서 배운 خانه‌ام(제 집)과 같은 구조예요.
  prs.a1.unit41.lesson02.teach.review_can_help:
    title: '복습: ~하실 수 있어요, 저를, 도움, 해 주세요(공손한 명령)'
    gloss: ~하실 수 있어요 / 저를 / 도움 / 해 주세요
    note: می‌توانین, مه ره, کمک, کنین을 합쳐서 도움을 청할 수 있어요.
    target_text: می‌توانین (할 수 있으세요?) / مه ره (저를) / کمک (도움) / کنین (해 주세요 -- 공손한 명령형)
  prs.a1.unit41.lesson02.teach.review_ra:
    title: '복습: (목적어 표지)'
    gloss: (목적어 표지)
    note: را는 동작의 대상이 되는 것을 나타내요. 여기서는 본 대상을 가리켜요.
    target_text: را (목적격 조사)
  prs.a1.unit41.lesson02.teach.did_you_see_word:
    title: 보셨어요?
    gloss: 보셨어요?
    note: دیدین은 دیدن(보다)의 공손한 2인칭 복수 과거형이에요. 2과의 از دیدن شما خوشحال شدم에서도 이미 나왔어요.
    example_gloss: 제 가방 보셨어요?
  prs.a1.unit41.lesson02.teach.did_you_see_my_bag_phrase:
    title: 제 가방 보셨어요?
    gloss: 제 가방 보셨어요?
    note: خریطه‌ام(제 가방)에 را와 دیدین을 합쳐서, 상대가 가방을 봤는지 물어요.
  prs.a1.unit41.lesson02.teach.is_found_word:
    title: 찾았어요 / 발견됐어요
    gloss: 찾았어요 / 발견됐어요
    note: پیدا شده는 پیدا(발견된)와 شده(되었다)가 합쳐진 말로, 물건이 나왔는지 물을 때 쓰는 표준 표현이에요.
    example_gloss: 제 열쇠를 찾았어요.
  prs.a1.unit41.lesson02.teach.has_key_been_found_phrase:
    title: 제 열쇠를 찾았나요?
    gloss: 제 열쇠를 찾았나요?
    note: کلیدم은 کلید에 소유 접미사 -م(제)이 붙은 말이에요(제 열쇠).
  prs.a1.unit41.lesson03.teach.review_color_black_white:
    title: '복습: 색, 검은색, 흰색, 그리고'
    gloss: 색 / 검은색 / 흰색 / 그리고
    note: رنگ, سیاه, سفید, و는 물건의 색을 설명할 때 써요.
    target_text: رنگ (색) / سیاه (검은색) / سفید (흰색) / و (그리고)
  prs.a1.unit41.lesson03.teach.review_size:
    title: '복습: 큰, 작은'
    gloss: 큰 / 작은
    note: بزرگ과 کوچک은 물건의 크기를 설명할 때 써요.
    target_text: بزرگ (큰) / کوچک (작은)
  prs.a1.unit41.lesson03.teach.here_word:
    title: 여기
    gloss: 여기
    note: اینجا는 '여기'라는 뜻이에요.
    example_gloss: 열쇠가 여기 있어요.
  prs.a1.unit41.lesson03.teach.bag_black_phrase:
    title: 제 가방은 검은색이에요
    gloss: 제 가방은 검은색이에요.
    note: خریطه‌ام(제 가방)에 سیاه(검은색)를 더해 물건을 알아볼 수 있게 설명해요.
  prs.a1.unit41.lesson03.teach.wallet_small_black_phrase:
    title: 제 지갑은 작고 검은색이에요
    gloss: 제 지갑은 작고 검은색이에요.
    note: و(그리고)는 کوچک(작은)과 سیاه(검은색) 두 설명어를 이어 줘요.
  prs.a1.unit41.lesson04.teach.review_what_thanks:
    title: '복습: 무엇, 정말 감사합니다'
    gloss: 무엇 / 정말 감사합니다
    note: چه와 تشکر زیاد는 대화에서 쓰이는 복습 표현이에요.
    target_text: چه (무엇) / تشکر زیاد (정말 감사합니다)
  prs.a1.unit41.lesson04.teach.review_yes_welcome:
    title: '복습: 네, 천만에요'
    gloss: 네 / 천만에요
    note: بلی와 خواهش می‌کنم은 대화에서 쓰이는 복습 표현이에요.
    target_text: بلی (네) / خواهش می‌کنم (천만에요)
  prs.a1.unit41.lesson04.teach.dialogue_line1:
    title: '호마윤: 자르미나, 제 가방이 없어졌어요!'
    gloss: 자르미나, 제 가방이 없어졌어요!
  prs.a1.unit41.lesson04.teach.dialogue_line2:
    title: '자르미나: 무슨 색이에요?'
    gloss: 무슨 색이에요?
  prs.a1.unit41.lesson04.teach.dialogue_line3:
    title: '호마윤: 검은색이에요.'
    gloss: 검은색이에요.
  prs.a1.unit41.lesson04.teach.dialogue_line4:
    title: '자르미나: 네, 봤어요! 여기 있어요.'
    gloss: 네, 봤어요! 여기 있어요.
  prs.a1.unit41.lesson04.teach.dialogue_line5:
    title: '호마윤: 정말 감사합니다!'
    gloss: 정말 감사합니다!
  prs.a1.unit41.lesson04.teach.dialogue_line6:
    title: '자르미나: 천만에요.'
    gloss: 천만에요.
  prs.a1.unit41.lesson05.teach.review_one_have:
    title: '복습: 하나, 그/그녀가 가지고 있어요'
    gloss: 하나 / 그/그녀가 가지고 있어요
    note: یک와 دارد는 읽기 글에 쓰이는 복습 단어예요.
    target_text: یک (하나) / دارد (그 사람은 가지고 있어요)
  prs.a1.unit41.lesson05.teach.reading_passage:
    title: 잃어버린 가방 읽기
    gloss: 호마윤은 가방이 하나 있어요. 그의 가방은 검은색이에요. 그의 가방이 없어졌어요. 자르미나는 가방을 봐요. 가방이 여기 있어요!
  prs.a1.unit41.lesson06.teach.review_wrap_up_words:
    title: '복습: 없어요, 하지만, 당신(높임)'
    gloss: 없어요 / 하지만 / 당신 (높임)
    note: ندارم, اما, شما는 가진 것과 없는 것을 대조하고 높임으로 질문할 때 쓰는 복습 단어예요.
    target_text: ندارم (저는 없어요) / اما (하지만) / شما (당신, 존칭)
  prs.a1.unit41.lesson06.teach.contrast_phrase:
    title: 열쇠는 있는데 가방은 없어요
    gloss: 열쇠는 있는데 가방은 없어요.
    note: اما는 열쇠가 있는 것과 가방이 없는 것을 대조해요.
  prs.a1.unit41.lesson06.teach.formal_question_phrase:
    title: 제 가방 보셨어요?
    gloss: 제 가방 보셨어요?
    note: شما를 앞에 붙인 높임 표현으로, 물건을 봤는지 정중하게 직접 물을 때 써요.
