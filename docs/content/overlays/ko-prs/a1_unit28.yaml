course:
  title: 한국어로 배우는 다리어 A1
  description: '카불 다리어 초급: 동물과 반려동물 어휘(개, 고양이, 새, 물고기), حیوان خانگی دارین؟로 반려동물이 있는지 묻고 답하기, 반려동물의 크기와 색깔 말하기, 고양이를 키우고 밥을 주는 것에 대한 자르미나와 후마윤의 대화.'
units:
  prs.a1.unit28.animals:
    title: 동물
    description: 반려동물이 있는지, 기본적인 돌봄은 어떻게 하는지 등 반려동물과 흔한 동물에 대해 이야기해 보세요.
lessons:
  prs.a1.unit28.lesson01.animal_vocabulary:
    title: 동물 단어
  prs.a1.unit28.lesson02.have_a_pet:
    title: 반려동물이 있어요?
  prs.a1.unit28.lesson03.describe_pet:
    title: 내 반려동물 묘사하기
  prs.a1.unit28.lesson04.pet_dialogue:
    title: 반려동물 대화
  prs.a1.unit28.lesson05.reading_animals:
    title: 동물에 대한 글 읽기
  prs.a1.unit28.lesson06.wrap_up:
    title: 마무리
teaching:
  prs.a1.unit28.lesson01.teach.animal_word:
    title: 동물
    gloss: 동물
    note: حیوان은 동물이라는 뜻으로, 반려동물과 다른 생물을 모두 아우르는 일반적인 단어예요.
    example_gloss: 개는 동물이에요.
  prs.a1.unit28.lesson01.teach.dog_word:
    title: 개
    gloss: 개
    note: سگ은 개라는 뜻이에요.
    example_gloss: 저는 개가 있어요.
  prs.a1.unit28.lesson01.teach.cat_word:
    title: 고양이
    gloss: 고양이
    note: پشک은 고양이라는 뜻이에요. 아프가니스탄 다리어에서 일상적으로 쓰는 말이고, 이란 페르시아어의 گربه와는 달라요.
    example_gloss: 저는 고양이가 있어요.
  prs.a1.unit28.lesson01.teach.bird_word:
    title: 새
    gloss: 새
    note: پرنده은 새라는 뜻이에요.
    example_gloss: 저는 새가 있어요.
  prs.a1.unit28.lesson01.teach.fish_word:
    title: 생선
    gloss: 생선
    note: ماهی는 물고기라는 뜻이에요.
    example_gloss: 저는 물고기가 있어요.
  prs.a1.unit28.lesson01.teach.pet_phrase:
    title: 반려동물
    gloss: 반려동물
    note: حیوان خانگی는 글자 그대로 "집 동물"이라는 뜻이에요. حیوان(동물, 복습)과 خانگی(집에서 기르는/가정의)가 합쳐진 말이에요.
    example_gloss: 개는 제 반려동물이에요.
  prs.a1.unit28.lesson01.teach.review_daram_dast:
    title: I have / you have (formal) / is
    gloss: 저는 있어요 / 당신은 있어요(높임) / 이에요
    note: دارم(저는 있어요), دارین(당신은 있어요, 높임), است(이에요)는 모두 앞에서 배운 표현으로, 이 단원에서 반려동물 이야기를 할 때 계속 나와요.
    target_text: دارم (저는 있어요) / دارین (당신은 있어요, 높임) / است (이에요)
  prs.a1.unit28.lesson02.teach.pet_question:
    title: 반려동물이 있어요?
    gloss: 반려동물이 있어요?
    note: حیوان خانگی دارین؟은 상대방에게 반려동물이 있는지 정중하게 묻는 표현이에요.
  prs.a1.unit28.lesson02.teach.yes_answer:
    title: 네, 개가 있어요
    gloss: 네, 저는 개가 있어요.
    note: بلی(네, 3단원에서 복습)와 이 단원의 سگ دارم을 합친 표현이에요.
  prs.a1.unit28.lesson02.teach.no_answer:
    title: 아니요, 반려동물이 없어요
    gloss: 아니요, 저는 반려동물이 없어요.
    note: نخیر(정중한 아니요, 3단원에서 복습)와 حیوان خانگی ندارم(저는 반려동물이 없어요)을 합친 표현이에요.
  prs.a1.unit28.lesson02.teach.review_bali_nakhair:
    title: Yes / no / I don't have
    gloss: 네 / 아니요 / 저는 없어요
    note: بلی, نخیر, ندارم은 모두 3단원의 가족 대화에서 배운 표현으로, 여기서는 반려동물이 있는지 말할 때 다시 써요.
    target_text: بلی (네) / نخیر (아니요) / ندارم (저는 없어요)
  prs.a1.unit28.lesson03.teach.review_rang:
    title: Color
    gloss: 색
    note: رنگ은 색깔이라는 뜻이에요(21단원 옷에서 복습).
    target_text: رنگ (색깔)
  prs.a1.unit28.lesson03.teach.black_word:
    title: 검은색
    gloss: 검은색
    note: سیاه는 '검은색'이라는 뜻이에요.
    example_gloss: 제 개는 검어요.
  prs.a1.unit28.lesson03.teach.white_word:
    title: 흰색
    gloss: 흰색
    note: سفید는 '흰색'이라는 뜻이에요.
    example_gloss: 제 고양이는 하얘요.
  prs.a1.unit28.lesson03.teach.small_word:
    title: 작은
    gloss: 작은
    note: کوچک은 작다는 뜻이에요(15단원 비교 표현에서 복습).
    example_gloss: 제 고양이는 작아요.
  prs.a1.unit28.lesson03.teach.big_word:
    title: 큰
    gloss: 큰
    note: بزرگ은 크다는 뜻이에요(15단원 비교 표현에서 복습).
    example_gloss: 제 강아지는 커요.
  prs.a1.unit28.lesson03.teach.combined_sentence:
    title: 제 개는 검고 커요
    gloss: 제 개는 검고 커요.
    note: و(~고, ~와, 복습)로 두 가지 특징을 연결해요.
  prs.a1.unit28.lesson04.teach.review_to_dari:
    title: You (informal) / you have (informal)
    gloss: 너 (친근한 표현) / 너는 있어 (친근한 표현)
    note: تو(너, 친근한 표현)와 داری(너는 있어, 친근한 표현)는 모두 복습 내용으로, 이번 수업의 친한 친구 사이 대화에서 써요.
    target_text: تو (너, 친근한 표현) / داری (너는 있어, 친근한 표현)
  prs.a1.unit28.lesson04.teach.review_che_har_roz:
    title: What / every day
    gloss: 무슨 / 어떤 / 매일
    note: چه(무슨/어떤, 21단원의 "무슨 색"에서 복습)와 هر روز(매일, 24단원에서 복습)는 반려동물을 돌보는 것에 대해 물을 때 함께 쓰여요.
    target_text: چه (무슨/어떤) / هر روز (매일)
  prs.a1.unit28.lesson04.teach.dialogue_line1:
    title: '후마윤: 자르미나, 너 반려동물 있어?'
    gloss: '후마윤: 자르미나, 너 반려동물 있어?'
    note: 친구 사이의 친근한 질문으로, 친근한 형태 داری를 써요.
  prs.a1.unit28.lesson04.teach.dialogue_line2:
    title: '자르미나: 응, 고양이가 한 마리 있어'
    gloss: '자르미나: 응, 고양이가 한 마리 있어.'
    note: بلی와 یک پشک دارم으로 대답해요.
  prs.a1.unit28.lesson04.teach.dialogue_line3:
    title: '후마윤: 고양이는 무슨 색이에요?'
    gloss: '후마윤: 고양이는 무슨 색이에요?'
    note: چه رنگ(무슨 색)을 쓰며, 21단원의 쇼핑 질문과 같은 패턴이에요.
  prs.a1.unit28.lesson04.teach.dialogue_line4:
    title: '자르미나: 하얀색이에요'
    gloss: '자르미나: 하얀색이에요.'
    note: 짧은 대답이에요. 색깔 + است만 말해요. 질문에서 이미 고양이가 분명하므로 پشک은 반복하지 않아요.
  prs.a1.unit28.lesson04.teach.dialogue_line5:
    title: '후마윤: 매일 먹이를 줘요?'
    gloss: '후마윤: 매일 먹이를 줘요?'
    note: غذا می‌دهی(먹이를 줘요, 친근한 표현)를 처음 배워요. غذا(음식) + می‌دهی로 이루어지며, 18단원의 می‌دهد에 해당하는 친근한 형태예요.
  prs.a1.unit28.lesson04.teach.dialogue_line6:
    title: '자르미나: 네, 매일 먹이를 줘요'
    gloss: '자르미나: 네, 매일 먹이를 줘요.'
    note: هر روز(매일)를 می‌دهم(제가 먹이를 줘요, 1인칭)에 붙여 써요.
  prs.a1.unit28.lesson05.teach.reading_passage:
    title: 반려동물에 대한 읽기
    gloss: 자르미나는 고양이가 한 마리 있어요. 그녀의 고양이는 하얗고 작아요. 자르미나는 매일 고양이에게 먹이를 줘요.
    note: 이 단원의 반려동물 어휘를 정리하는 짧은 읽기 글이에요. دارد(가지고 있다, 3인칭, 26·27단원 복습)와 می‌دهد(주다/먹이를 주다, 3인칭, 18단원 복습)가 나와요.
  prs.a1.unit28.lesson06.teach.review_ama:
    title: But
    gloss: 하지만
    note: اما는 '하지만'이라는 뜻이에요(앞 단원에서 복습한 표현).
    target_text: اما (하지만)
  prs.a1.unit28.lesson06.teach.review_astam:
    title: I am
    gloss: 저는 ~이에요
    note: استم(저는 ~이에요)은 앞 단원에서 이미 배운 복습 표현이에요.
    target_text: استم (저는 ~이에요)
  prs.a1.unit28.lesson06.teach.wrap_summary:
    title: 저는 개가 있지만 고양이는 없어요
    gloss: 저는 개가 있지만 고양이는 없어요.
    note: اما를 사용해 반려동물에 관한 두 가지 사실을 연결한 문장이에요.
