  prs.a1.unit47.lesson06.teach.your_appointment_question_phrase:
    title: 예약이 무슨 요일이세요?
    gloss: 예약이 무슨 요일이세요?
    note: 예약에 대해 물을 때 쓰는, 접미사 -تان이 붙은 공손한 표현이에요.
