course:
  title: 한국어로 배우는 다리어 A1
  description: '카불 다리어 초급: 기본적인 성격 표현을 익히고, 어떤 사람인지 묻고, ''왜냐하면''으로 간단한 이유를 말하고, 짧은 글로 사람의 성격을 묘사해요.'
units:
  prs.a1.unit37.personality:
    title: 성격
    description: 사람의 기본 성격을 묘사하고 어떤 사람인지 물어봐요.
lessons:
  prs.a1.unit37.lesson01.personality_words:
    title: 성격 단어
  prs.a1.unit37.lesson02.more_traits:
    title: 더 많은 성격 표현
  prs.a1.unit37.lesson03.asking_about_personality:
    title: 성격 물어보기
  prs.a1.unit37.lesson04.personality_dialogue:
    title: 성격 대화
  prs.a1.unit37.lesson05.personality_reading:
    title: 성격에 대한 글 읽기
  prs.a1.unit37.lesson06.wrap_up:
    title: 마무리
teaching:
  prs.a1.unit37.lesson01.teach.mehraban_word:
    title: 친절한
    gloss: 친절한
    note: مهربان은 친절하거나 마음이 따뜻한 사람을 나타내는 표준 다리어 단어예요.
    example_gloss: 그/그녀는 친절해요.
  prs.a1.unit37.lesson01.teach.zahmatkash_word:
    title: 부지런한
    gloss: 부지런한
    note: زحمتکش은 직역하면 수고와 노력을 들이는 사람, 즉 부지런한 사람이라는 뜻이에요.
    example_gloss: 그/그녀는 부지런해요.
  prs.a1.unit37.lesson01.teach.bahosh_word:
    title: 똑똑한
    gloss: 똑똑한 / 지적인
    note: باهوش은 با(~와 함께)와 هوش(지능)가 합쳐진 말로, 똑똑하고 영리한 사람을 뜻해요.
    example_gloss: 그/그녀는 똑똑해요.
  prs.a1.unit37.lesson01.teach.tambal_word:
    title: 게으른
    gloss: 게으른
    note: تنبل은 게으르다는 뜻이에요.
    example_gloss: 그/그녀는 게을러요.
  prs.a1.unit37.lesson01.teach.review_basics:
    title: '복습: 그/그녀, ~이다, 그리고, 하지만'
    gloss: 그/그녀 / ~이다 / 그리고 / 하지만
    note: او, است, و, اما는 이 단원의 성격 문장 전반에서 쓰이는 복습 표현이에요.
    target_text: او (그/그녀) / است (~이다) / و (그리고) / اما (하지만)
  prs.a1.unit37.lesson01.teach.kind_and_hardworking_phrase:
    title: 그/그녀는 친절하고 부지런해요
    gloss: 그/그녀는 친절하고 부지런해요.
    note: و는 두 가지 성격을 한 문장으로 이어 줘요.
  prs.a1.unit37.lesson01.teach.smart_but_lazy_phrase:
    title: 그/그녀는 똑똑하지만 게을러요
    gloss: 그/그녀는 똑똑하지만 게을러요.
    note: اما는 한 문장 안에서 두 가지 성격을 대조해요.
  prs.a1.unit37.lesson02.teach.shokh_word:
    title: 재미있는
    gloss: 재미있는 / 장난기 많은
    note: شوخ는 농담을 잘하거나 장난기 많은 사람을 나타내요.
    example_gloss: 그/그녀는 재미있어요.
  prs.a1.unit37.lesson02.teach.kamharf_word:
    title: 말수가 적은
    gloss: 말수가 적은 / 조용한
    note: کم‌حرف는 직역하면 말이 적다는 뜻으로, 조용하고 과묵한 사람을 나타내요.
    example_gloss: 그/그녀는 말수가 적어요.
  prs.a1.unit37.lesson02.teach.rastgoo_word:
    title: 정직한
    gloss: 정직한
    note: راستگو는 راست(참, 곧은)와 گو(말하는 사람)가 합쳐진 말로, 진실하고 정직한 사람을 뜻해요.
    example_gloss: 그/그녀는 정직해요.
  prs.a1.unit37.lesson02.teach.review_and_but:
    title: '복습: 그리고, 하지만'
    gloss: 그리고 / 하지만
    note: و와 اما는 성격을 연결하거나 대조할 때 쓰는 복습 단어예요.
    target_text: و (그리고) / اما (하지만)
  prs.a1.unit37.lesson02.teach.funny_and_honest_phrase:
    title: 그/그녀는 재미있고 정직해요
    gloss: 그/그녀는 재미있고 정직해요.
    note: و로 두 가지 좋은 성격을 연결해요.
  prs.a1.unit37.lesson02.teach.quiet_but_kind_phrase:
    title: 그/그녀는 말수가 적지만 친절해요
    gloss: 그/그녀는 말수가 적지만 친절해요.
    note: اما는 과묵한 성격과 따뜻한 성격을 대조해요.
  prs.a1.unit37.lesson03.teach.person_word:
    title: 사람
    gloss: 사람
    note: آدم은 사람이나 인간을 가리키는 흔한 말로, 성별 구분이 없어요.
    example_gloss: 그/그녀는 좋은 사람이에요.
  prs.a1.unit37.lesson03.teach.review_how_because:
    title: '복습: 어떻게/어떤, 왜냐하면, 도움'
    gloss: 어떻게, 어떤 / 왜냐하면 / 도움
    note: چطور, چون, کمک는 성격을 묻고 설명할 때 쓰는 복습 표현이에요.
    target_text: چطور (어떻게, 어떤) / چون (왜냐하면) / کمک (도움)
  prs.a1.unit37.lesson03.teach.what_kind_person_question:
    title: 그/그녀는 어떤 사람이에요?
    gloss: 그/그녀는 어떤 사람이에요?
    note: او چطور آدم است؟는 직역하면 '그/그녀는 어떤 사람이에요?'라는 뜻으로, 어떤 사람인지 물을 때 쓰는 자연스러운 표현이에요.
  prs.a1.unit37.lesson03.teach.kind_because_helps_phrase:
    title: 그/그녀는 도와주기 때문에 친절해요
    gloss: 그/그녀는 도와주기 때문에 친절해요.
    note: چون은 이유를 이끌어요. کمک می‌کند는 직역하면 '도움을 한다'는 뜻이에요.
  prs.a1.unit37.lesson03.teach.hardworking_because_works_phrase:
    title: 그/그녀는 일을 많이 하기 때문에 부지런해요
    gloss: 그/그녀는 일을 많이 하기 때문에 부지런해요.
    note: زیاد کار می‌کند는 직역하면 '많은 일을 한다'는 뜻이에요.
  prs.a1.unit37.lesson04.teach.review_dialogue_words:
    title: 네 / 조금 / 항상
    gloss: 네 / 조금 / 항상
    note: بلی, کمی, همیشه는 성격 대화에서 쓰는 복습 단어예요.
    target_text: بلی (네) / کمی (조금) / همیشه (항상)
  prs.a1.unit37.lesson04.teach.dialogue_line1:
    title: '호마윤: 자르미나, 카림은 어떤 사람이에요?'
    gloss: 자르미나, 카림은 어떤 사람이에요?
  prs.a1.unit37.lesson04.teach.dialogue_line2:
    title: '자르미나: 카림은 친절하고 부지런해요.'
    gloss: 카림은 친절하고 부지런해요.
  prs.a1.unit37.lesson04.teach.dialogue_line3:
    title: '호마윤: 똑똑해요?'
    gloss: 똑똑해요?
  prs.a1.unit37.lesson04.teach.dialogue_line4:
    title: '자르미나: 네, 똑똑해요. 그런데 좀 말수가 적어요.'
    gloss: 네, 똑똑해요. 그런데 좀 말수가 적어요.
  prs.a1.unit37.lesson04.teach.dialogue_line5:
    title: '호마윤: 정직한가요?'
    gloss: 정직한가요?
  prs.a1.unit37.lesson04.teach.dialogue_line6:
    title: '자르미나: 네, 항상 정직해요.'
    gloss: 네, 항상 정직해요.
  prs.a1.unit37.lesson05.teach.review_reading_words:
    title: 가끔, 모두, 목적격 표지, 그들이 좋아해요
    gloss: 가끔 / 모두 / 목적어 표지 / 그들은 좋아해요
    note: گاهی(가끔)와 همه(모두)는 읽기 글에 나옵니다. را는 특정한 직접 목적어를 나타내는 표지이고, دوست دارند는 دوست دارم(저는 좋아해요)의 3인칭 복수형입니다.
    target_text: گاهی (가끔) / همه (모두) / را (목적어 표지) / دوست دارند (좋아해요)
  prs.a1.unit37.lesson05.teach.reading_passage:
    title: 호마윤의 성격에 대한 글
    gloss: 호마윤은 친절하고 부지런해요. 그는 똑똑하지만 가끔 말수가 적어요. 그는 항상 정직해요. 모두가 그를 좋아해요.
  prs.a1.unit37.lesson06.teach.review_i_am_you_are:
    title: '복습: 저는 ~이에요, 당신은 ~이에요(존칭)'
    gloss: 저는 ~이에요 / 당신은 ~이에요(존칭)
    note: استم과 استین은 각각 '저는 ~이에요'와 '당신은 ~이에요(존칭)'를 나타내는 연결 동사 형태로, 이 마무리 단원의 문장들에서 계속 쓰입니다.
    target_text: استم (저는 ~이에요) / استین (당신은 ~이에요, 존칭)
  prs.a1.unit37.lesson06.teach.self_description_phrase:
    title: 저는 친절하지만 가끔 게을러요
    gloss: 저는 친절하지만 가끔 게을러요.
    note: من(저)과 استم(저는 ~이에요)으로 자신의 성격을 직접 말할 수 있습니다. 이 단원 전체에서 쓰인 او/است 패턴과 같은 구조입니다.
  prs.a1.unit37.lesson06.teach.formal_question_phrase:
    title: 당신은 어떤 사람이에요?
    gloss: 당신은 어떤 사람이에요?
    note: lesson03의 같은 질문 형태에 شما(당신, 존칭)와 استین(당신은 ~이에요, 존칭)을 더해, 이제 학습자에게 직접 묻는 표현입니다.
