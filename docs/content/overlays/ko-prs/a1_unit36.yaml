    gloss: 그/그녀 / ~에서 / 그/그녀가 해요 / 그/그녀가 요리해요 / 매우 / 행복한 / 이다
    note: او는 '그' 또는 '그녀'를 뜻하는 다리어 대명사예요. می‌کند와 می‌پزد는 이 단원에서 배운 동사의 3인칭 형태예요.
    target_text: او (그/그녀) / در (~에서) / می‌کند (해요) / می‌پزد (요리해요) / بسیار (아주) / خوشحال (행복한) / است (~이에요)
  prs.a1.unit36.lesson05.teach.reading_passage:
    title: 요리하는 나디아에 대한 읽기
    gloss: 나디아는 주방에 있어요. 나디아는 양파를 다져요. 그다음에 고기를 익혀요. 음식이 아주 맛있어요. 나디아는 행복해요.
  prs.a1.unit36.lesson06.teach.review_like_but_time:
    title: "좋아해요 / 하지만 시간이 없어요"
    gloss: "좋아해요 / 목적어 표지 / 하지만 / 시간이 없어요"
    note: "دوست دارم, را, اما, وقت, ندارم은 마무리 메시지를 위한 복습 표현이에요."
    target_text: دوست دارم (좋아해요) / را (목적어 표지) / اما (하지만) / وقت ندارم (시간이 없어요)
  prs.a1.unit36.lesson06.teach.wrap_summary:
    title: "요리를 좋아하지만 시간이 없어요"
