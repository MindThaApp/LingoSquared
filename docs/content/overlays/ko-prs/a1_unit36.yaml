    example_gloss: 양파가 신선해요.
  prs.a1.unit36.lesson01.teach.meat_word:
    title: 고기
    gloss: 고기
    note: گوشت은 고기를 뜻해요.
    example_gloss: 고기가 신선해요.
  prs.a1.unit36.lesson01.teach.review_basics:
    title: '복습: 하나, 원하다, ~에, ~이다'
    gloss: 하나/한 / 원해요 / ~에 / 저는 ~이에요(있어요)
    note: یک, می‌خواهم, در, استم은 이 단원의 요리 문장에서 쓰이는 복습 표현이에요.
    target_text: یک (하나/한) / می‌خواهم (원해요) / در (~에) / استم (저는 ~이에요/있어요)
  prs.a1.unit36.lesson01.teach.cook_food_phrase:
    title: 저는 음식을 요리해요
    gloss: 저는 음식을 요리해요.
    note: می‌پزم은 '요리하다'를 뜻하는 پختن의 1인칭 현재형이에요.
  prs.a1.unit36.lesson01.teach.in_kitchen_phrase:
    title: 저는 부엌에 있어요
    gloss: 저는 부엌에 있어요.
    note: استم은 계사의 1인칭 형태로, 여기서는 در와 함께 장소를 나타내요.
  prs.a1.unit36.lesson02.teach.salt_word:
    title: 소금
    gloss: 소금
    note: نمک은 소금을 뜻해요.
    example_gloss: 소금이 필요해요.
  prs.a1.unit36.lesson02.teach.rice_grain_word:
    title: 쌀밥
    gloss: 쌀밥
    note: برنج은 익히지 않은 쌀(곡물)이에요. 음식 단원에서 배우는 익힌 쌀 요리 پلو와는 달라요.
    example_gloss: 저는 쌀을 요리해요.
  prs.a1.unit36.lesson02.teach.review_do_cut:
    title: '복습: 해요, 잘게 썬'
    gloss: 해요 / 잘게 썬
    note: می‌کنم은 복습 표현이고, خرد는 새 단어예요. کردن 형태와 결합해 '썰다, 자르다'를 뜻해요.
    target_text: می‌کنم (해요) / خرد (잘게 썬)
  prs.a1.unit36.lesson02.teach.chop_onion_phrase:
    title: 양파를 잘게 썰어요
    gloss: 저는 양파를 썰어요.
    note: خرد می‌کنم은 문자 그대로 '잘게 썬 상태로 만든다'는 뜻으로, 대표적인 복합동사 형태예요.
  prs.a1.unit36.lesson02.teach.add_salt_phrase:
    title: 소금을 넣어요
    gloss: 소금을 넣어요.
    note: می‌اندازم(던지다/넣다를 뜻하는 انداختن에서 온 말)은 재료를 넣을 때 쓰는 자연스러운 다리어 동사예요.
  prs.a1.unit36.lesson02.teach.cook_meat_phrase:
    title: 저는 고기를 요리해요
    gloss: 저는 고기를 요리해요.
    note: گوشت 대신 برنج을 넣으면 다른 음식을 요리한다는 말이 돼요.
  prs.a1.unit36.lesson03.teach.review_first_then:
    title: '복습: 먼저, 그다음에'
    gloss: 먼저 / 그다음에
    note: اول과 بعد는 요리 순서를 나타낼 때 쓰는 복습 단어예요.
    target_text: اول (먼저) / بعد (그다음에)
  prs.a1.unit36.lesson03.teach.review_water_hot:
    title: '복습: 물, 뜨거운'
    gloss: 물 / 뜨거운
    note: آب와 گرم은 앞 단원에서 배운 복습 단어예요.
    target_text: آب (물) / گرم (뜨거운)
  prs.a1.unit36.lesson03.teach.pour_word:
