    note: سلام, بلی, لطفاً, چشم, تشکر, قورمه, خوش‌مزه, است는 주방 대화에 나오는 복습 단어예요.
    target_text: سلام (안녕하세요) / بلی (네) / لطفاً (부탁합니다) / چشم (네, 알겠어요) / تشکر (감사합니다) / قورمه (스튜) / خوش‌مزه (맛있는) / است (~이에요)
  prs.a1.unit36.lesson04.teach.dialogue_line1:
