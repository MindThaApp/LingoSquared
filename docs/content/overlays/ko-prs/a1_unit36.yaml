    gloss: 부어요
    note: می‌ریزم(ریختن '붓다'에서 나온 말)은 액체를 넣을 때 쓰는 자연스러운 동사로, 고체 재료에 쓰는 می‌اندازم과 구별돼요.
    example_gloss: 저는 물을 부어요.
  prs.a1.unit36.lesson03.teach.first_chop_phrase:
    title: 먼저 양파를 잘게 썰어요
    gloss: 먼저 양파를 썰어요.
    note: اول은 순서에서 첫 번째 단계를 나타내요.
