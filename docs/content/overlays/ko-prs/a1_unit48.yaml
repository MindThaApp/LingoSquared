    note: '''하지만''은 하루 요금과 이틀 요금이라는 별도의 요금을 대비시켜요.'
  prs.a1.unit48.lesson06.teach.your_rental_question_phrase:
    title: 며칠 동안 빌리세요?
    gloss: 며칠 동안 빌리세요?
