    title: '후마윤: 여기 있어요. 내일 반납할게요.'
    gloss: 여기 있어요. 내일 반납할게요.
  prs.a1.unit48.lesson04.teach.dialogue_line6:
    title: '가게 주인: 정말 감사합니다. 좋은 하루 보내세요!'
    gloss: 정말 감사합니다. 좋은 하루 보내세요!
  prs.a1.unit48.lesson05.teach.review_this_is_shopkeeper_in:
