teaching:
  prs.a1.unit08.lesson01.teach.naan:
    title: 빵
    gloss: 빵
    note: نان 은(는) 아프가니스탄 식사에서 빠지지 않는 주식이에요.
    example_gloss: 빵이 신선해요.
  prs.a1.unit08.lesson01.teach.palaw:
    title: 필라프
    gloss: 필라프
    note: پلو 은(는) 아프가니스탄식 쌀 요리로, 독특하게 양념하고 고기, 당근, 건포도 등을 넣어 만들기도 해요. 단순한 흰밥이 아니에요.
    example_gloss: 필라프가 맛있어요.
  prs.a1.unit08.lesson01.teach.qorma:
    title: 고기와 채소 스튜
    gloss: 고기와 채소 스튜
    note: قورمه 은(는) 고기와 채소를 익혀 만든 스튜 요리를 두루 가리키는 말로, 보통 پلو 위에 곁들여 내요.
    example_gloss: 저는 스튜를 필라프와 함께 먹어요.
  prs.a1.unit08.lesson01.teach.chai_review:
    title: 차 (복습)
    gloss: 차
    note: چای 은(는) 아프가니스탄 어디서나 기본으로 내는 음료예요.
    example_gloss: 차 한 잔 주세요.
  prs.a1.unit08.lesson01.teach.ab_water:
    title: 물
    gloss: 물
    note: آب은 물을 뜻하는 일반적인 단어예요.
    example_gloss: 물 하나 주세요.
  prs.a1.unit08.lesson01.teach.va_word:
    title: 그리고
    gloss: 그리고
    note: و 은(는) 음식 목록을 이어 줄 때 쓰는 일반적인 연결어예요.
    target_text: و (그리고)
  prs.a1.unit08.lesson02.teach.mikham_chai:
    title: 공손하게 차 주문하기
    gloss: 차 한 잔 주세요.
    note: یک چای می‌خواهم 은(는) 중립적이면서 공손한 주문 방식이에요. 더 돌려 말하는 구문 대신 می‌خواهم(원해요)을 바로 써요.
  prs.a1.unit08.lesson02.teach.lotfan:
    title: 부탁드려요
    gloss: 부탁해요
    note: لطفاً는 거의 모든 부탁을 부드럽게 만들어 줘요.
    example_gloss: 도와주세요.
  prs.a1.unit08.lesson02.teach.mikham_naan:
    title: 공손하게 빵 주문하기
    gloss: 빵 하나 주세요.
    note: 음식이나 음료 명사라면 무엇이든 같은 یک [item] می‌خواهم 패턴을 쓸 수 있어요.
  prs.a1.unit08.lesson03.teach.what_do_you_have:
    title: 무엇이 있는지 묻기
    gloss: 뭐가 있어요?
    note: چی دارین؟는 가게 주인이나 종업원에게 어떤 음식이 있는지 물을 때 쓰는 자연스러운 표현이에요.
  prs.a1.unit08.lesson03.teach.we_have_both:
    title: 있는 음식으로 대답하기
    gloss: 필라프와 스튜가 있어요.
    note: پلو و قورمه داریم에는 دارم(나는 있다)의 '우리' 형태인 داریم(우리는 있다)이 쓰였어요. 가게 주인은 가게 전체를 대표해서 '우리'라고 말해요.
  prs.a1.unit08.lesson03.teach.fresh_word:
    title: 신선한
    gloss: 신선한
    note: تازه는 갓 만든 음식을 말할 때 써요.
    example_gloss: 이 빵은 신선해요.
  prs.a1.unit08.lesson04.teach.yek_boshghab:
    title: 필라프 한 접시
    gloss: 필라프 한 접시
    note: بشقاب(접시)은 접시에 담긴 음식을 셀 때 쓰는 단위어예요.
  prs.a1.unit08.lesson04.teach.do_ta_naan:
    title: 빵 두 개
    gloss: 빵 두 개
    note: تا는 대부분의 셀 수 있는 것에 쓰는 일반적인 단위 단어로, 숫자 뒤에 놓아요. 여기서는 빵 두 개를 뜻해요.
  prs.a1.unit08.lesson04.teach.combined_order:
    title: 한 번에 전체 주문하기
    gloss: 필라프 한 접시와 빵 두 개 주세요.
    note: 여러 수량 표현을 و(그리고)로 이어서 한 번에 주문할 수 있어요.
  prs.a1.unit08.lesson05.teach.bill_word:
    title: 계산서
    gloss: 계산서
    note: بل은 영어 'bill'에서 온 말로, 아프가니스탄에서 식당 계산서를 가리키는 일상적인 말이에요.
    example_gloss: 계산서 부탁드려요.
  prs.a1.unit08.lesson05.teach.bill_request:
    title: 계산서가 얼마인지 묻기
    gloss: 계산이 얼마예요?
    note: بل چند می‌شه؟는 직역하면 '계산서가 얼마가 되나요'라는 뜻으로, 총액을 묻는 자연스러운 일상 표현이에요. می‌شه는 می‌شود의 구어체로 가게에서 흔히 듣게 되고, 글에서는 می‌شود를 써요.
  prs.a1.unit08.lesson05.teach.khoshmaze:
    title: 음식이 맛있었다고 말하기
    gloss: 아주 맛있었어요.
    note: خیلی خوش‌مزه بود는 식사 후에 하기 좋은 자연스러운 칭찬이에요.
  prs.a1.unit08.lesson05.teach.chaikhana:
    title: 찻집
    gloss: 찻집 / 간단한 식당
    note: چایخانه는 아프가니스탄, 특히 카불에서 흔히 볼 수 있는 간단한 식당으로, 차와 간단한 식사를 팔아요.
  prs.a1.unit08.lesson06.teach.welcome_review:
    title: 환영합니다 (복습)
    gloss: 환영해요
    note: خوش آمدین은 인사 단원에서 배웠어요. 여기서는 가게 주인의 인사말로 쓰였어요.
  prs.a1.unit08.lesson06.teach.turn01:
    title: 가게 주인이 손님에게 인사하기
    gloss: 가게 주인이 손님을 맞이하며 무엇을 원하는지 물어요.
    note: چی میل دارین؟는 정중한 첫 질문으로, 기능은 چی دارین؟와 비슷하지만 손님이 원하는 것을 중심으로 묻는 표현이에요.
  prs.a1.unit08.lesson06.teach.turn02:
    title: 손님이 무엇이 있는지 묻기
    gloss: 손님이 가게 주인에게 인사하고 무엇이 있는지 물어요.
    note: چی دارین؟는 3과에서 배운 대로 주문을 시작하는 말이에요.
  prs.a1.unit08.lesson06.teach.turn03:
    title: 가게 주인이 있는 음식을 말하기
    gloss: 가게 주인이 필라프와 스튜가 있고 둘 다 신선하다고 말해요.
    note: هردو(둘 다)는 언급한 두 음식 모두 신선하다는 것을 확인해 줘요.
  prs.a1.unit08.lesson06.teach.turn04:
    title: 손님이 전체 주문을 할 때
    gloss: 손님이 좋다고 하며 필라프와 스튜 한 접시, 그리고 차 한 잔을 주문해요.
    note: 4과의 수량 표현 패턴과 1과의 음식 어휘를 합친 문장이에요.
  prs.a1.unit08.lesson06.teach.turn05:
    title: 가게 주인이 주문을 받아들이기
    gloss: 가게 주인이 바로 가져다주겠다고 말해요.
    note: چشم은 직역하면 '내 눈 위에'라는 뜻으로, '물론이죠'를 정중하게 말하는 표현이에요. می‌آرم은 می‌آورم(가져오다)의 구어체이고, همین حالا는 '지금 바로'라는 뜻이에요.
  prs.a1.unit08.lesson06.teach.turn06:
    title: 손님이 음식을 칭찬하고 계산서를 부탁해요
    gloss: 손님이 아주 맛있었다고 말하고 계산서를 부탁해요.
    note: 두 표현 모두 lesson05의 어휘를 그대로 다시 써요.
  prs.a1.unit08.lesson06.teach.turn07:
    title: 가게 주인이 총액을 말하기
    gloss: 가게 주인이 감사 인사를 하고 200 아프가니라고 말해요.
    note: افغانی는 아프가니스탄의 화폐예요. دوصد(200)에 화폐 이름을 붙여서 가격을 말해요.
