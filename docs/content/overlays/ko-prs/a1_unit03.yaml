teaching:
  prs.a1.unit03.lesson01.teach.mother:
    title: 어머니
    gloss: 어머니
    note: مادر는 어머니를 뜻하는 일반적인 다리어 단어예요.
    example_gloss: 우리 어머니는 친절하세요.
  prs.a1.unit03.lesson01.teach.father:
    title: 아버지
    gloss: 아버지
    note: پدر는 아버지를 뜻하는 일반적인 다리어 단어예요.
    example_gloss: 제 아버지는 의사예요.
  prs.a1.unit03.lesson01.teach.brother:
    title: 형, 오빠, 남동생
    gloss: 남자 형제
    note: برادر는 형제(오빠, 형, 남동생)를 뜻해요.
    example_gloss: 저는 남자 형제가 한 명 있어요.
  prs.a1.unit03.lesson01.teach.sister:
    title: 누나, 언니, 여동생
    gloss: 여자 형제
    note: خواهر는 자매(언니, 누나, 여동생)를 뜻해요.
    example_gloss: 제 누나(언니)는 선생님이에요.
  prs.a1.unit03.lesson01.teach.parents:
    title: 부모님
    gloss: 아버지와 어머니; 부모님
    note: 다리어에서는 부모님을 말할 때 흔히 پدر و مادر라고 해요.
    example_gloss: 저희 부모님은 카불에 살아요.
  prs.a1.unit03.lesson01.teach.my_mother:
    title: 어머니를 소개하기
    gloss: 이분은 제 어머니예요.
    note: مادرم의 어미 ـم은 '나의'를 뜻해요.
  prs.a1.unit03.lesson02.teach.grandfather:
    title: 할아버지
    gloss: 할아버지
    note: پدرکلان은 아프가니스탄 다리어에서 흔히 쓰는 말로, 글자 그대로는 '큰아버지', 즉 윗세대 아버지라는 뜻이에요.
    example_gloss: 제 할아버지는 연세가 많으세요.
  prs.a1.unit03.lesson02.teach.grandmother:
    title: 할머니
    gloss: 할머니
    note: مادرکلان은 아프가니스탄 다리어에서 흔히 쓰는 말로, 글자 그대로는 '큰어머니', 즉 윗세대 어머니라는 뜻이에요.
    example_gloss: 제 할머니는 친절하세요.
  prs.a1.unit03.lesson02.teach.paternal_uncle:
    title: 아버지의 형제
    gloss: 큰아버지·작은아버지(친삼촌)
    note: کاکا는 아버지의 형제만을 가리켜요.
    example_gloss: 제 삼촌은 헤라트에 살아요.
  prs.a1.unit03.lesson02.teach.paternal_aunt:
    title: 아버지의 누이
    gloss: 고모
    note: عمه는 아버지의 누이만을 가리켜요.
    example_gloss: 제 고모는 선생님이에요.
  prs.a1.unit03.lesson02.teach.maternal_uncle:
    title: 어머니의 형제
    gloss: 외삼촌
    note: 다리어에서 ماما는 어머니의 형제만을 가리켜요.
    example_gloss: 제 외삼촌은 엔지니어예요.
  prs.a1.unit03.lesson02.teach.maternal_aunt:
    title: 어머니의 자매
    gloss: 이모
    note: خاله는 어머니의 자매만을 가리켜요.
    example_gloss: 제 이모는 카불에 살아요.
  prs.a1.unit03.lesson02.teach.side_distinction:
    title: 두 쪽을 구분하세요
    gloss: کاکا와 عمه는 아버지 쪽이고, ماما와 خاله는 어머니 쪽이에요.
    note: 한국어에서도 고모·이모, 큰아버지·외삼촌처럼 친가와 외가를 나누어 부르듯이, 다리어도 이 네 단어로 아버지 쪽과 어머니 쪽을 구분해요.
  prs.a1.unit03.lesson03.teach.family:
    title: 가족
    gloss: 가족
    note: فامیل은 가족을 뜻하는 아프가니스탄 다리어의 일반적인 단어예요.
    example_gloss: 저희 가족은 대가족이에요.
  prs.a1.unit03.lesson03.teach.how_many_people:
    title: 가족 수를 공손하게 묻기
    gloss: 가족이 몇 명이세요?
    note: ـتان은 공손한 '당신의'를 나타내고, نفر는 사람을 세는 단위예요.
  prs.a1.unit03.lesson03.teach.five_people:
    title: 가족 수를 말하기
    gloss: 저희 가족은 다섯 명이에요.
    note: 다리어에서는 가족을 'نفر است' 앞에 사람 수를 붙여 말해요.
  prs.a1.unit03.lesson03.teach.have_siblings:
    title: 형제자매 수를 말하기
    gloss: 저는 형제가 한 명, 자매가 두 명 있어요.
    note: دارم은 '나는 가지고 있다'예요. 숫자 뒤에서도 명사는 단수형 그대로 써요.
  prs.a1.unit03.lesson03.teach.only_child:
    title: 외동
    gloss: 저는 외동이에요.
    note: استم은 이 과정에서 배우는 카불 다리어의 1인칭 형태예요.
  prs.a1.unit03.lesson03.teach.possession:
    title: '''가지다''의 형태'
    gloss: 저는 있어요; 우리는 있어요; 당신은 있어요
    note: دارین은 교양 있는 카불 구어체에서 존댓말 또는 복수의 '당신은 가지고 있다'예요.
  prs.a1.unit03.lesson04.teach.have_siblings_question:
    title: 형제자매에 대해 묻기
    gloss: 형제자매가 있으세요?
    note: دارین은 존댓말이거나 복수를 나타내요.
  prs.a1.unit03.lesson04.teach.how_many_siblings:
    title: 형제자매가 몇 명인지 묻기
    gloss: 형제자매가 몇 명이세요?
    note: چند는 '몇'을 묻는 말이에요.
  prs.a1.unit03.lesson04.teach.parents_well:
    title: 상대방의 부모님 안부 묻기
    gloss: 부모님은 안녕하세요?
    note: جور استند는 '잘 지내세요'를 뜻하는 아프가니스탄의 친근한 표현이에요.
  prs.a1.unit03.lesson04.teach.yes_answer:
    title: 긍정 대답
    gloss: 네, 형제가 한 명 있어요.
    note: بلی는 아프가니스탄에서 쓰는 공손한 표준 긍정 대답이에요.
  prs.a1.unit03.lesson04.teach.no_answer:
    title: 부정 대답
    gloss: 아니요, 자매는 없어요.
    note: نخیر는 공손한 부정 대답이고, ندارم은 '나는 없다'는 뜻이에요.
  prs.a1.unit03.lesson04.teach.polite_your:
    title: 공손한 '당신의'
    gloss: 당신의 가족; 당신의 어머니; 당신의 아버지
    note: 소유 어미 ـتان은 존댓말 또는 복수를 나타내요. 이 과정에서는 ZWNJ(제로 폭 비접합자)로 연결해 써요.
  prs.a1.unit03.lesson05.teach.married:
    title: 결혼한
    gloss: 결혼한, 기혼의
    note: متأهل은 결혼 여부를 나타내는 중립적인 말이에요.
    example_gloss: 그는(그녀는) 결혼했어요.
  prs.a1.unit03.lesson05.teach.single:
    title: 미혼
    gloss: 미혼; 결혼하지 않은
    note: 여기서 مجرد는 '결혼하지 않은'이라는 뜻이에요.
    example_gloss: 저는 미혼이에요.
  prs.a1.unit03.lesson05.teach.husband:
    title: 남편
    gloss: 남편
    note: شوهر는 남편을 뜻하는 일반적인 단어예요.
    example_gloss: 제 남편은 엔지니어예요.
  prs.a1.unit03.lesson05.teach.wife:
    title: 아내
    gloss: 아내
    note: خانم은 아내 또는 공손하게 부르는 여성을 뜻할 수 있어요. 문맥으로 구분해요.
    example_gloss: 제 아내는 선생님이에요.
  prs.a1.unit03.lesson05.teach.marriage_question:
    title: 결혼 여부를 공손하게 묻기
    gloss: 결혼하셨어요?
    note: 글자 그대로는 '결혼했습니까?'라고 묻는 말이에요. 어미 ـین은 카불 다리어의 공손한 형태예요.
  prs.a1.unit03.lesson05.teach.married_answer:
    title: 결혼했다고 말하기
    gloss: 네, 기혼이에요.
    note: استم은 여기서 쓰인 아프가니스탄 다리어의 1인칭 '이다'예요.
  prs.a1.unit03.lesson05.teach.children:
    title: 자녀에 대해 묻기
    gloss: 자녀가 있어요?
    note: اولاد는 자녀 한 명 또는 여러 명을 아우르는 흔한 말이에요.
  prs.a1.unit03.lesson06.teach.turn01:
    title: 마리암이 가족 수를 묻기
    gloss: 가족이 몇 명이세요?
    note: 마리암은 공손한 ـتان을 써요.
  prs.a1.unit03.lesson06.teach.turn02:
    title: 페레슈테가 형제자매를 설명하기
    gloss: 다섯 명이에요. 형제가 한 명, 자매가 한 명 있어요.
    note: 가족 구성원은 نفر로 세요.
  prs.a1.unit03.lesson06.teach.turn03:
    title: 마리암이 결혼 여부를 묻기
    gloss: 결혼하셨어요?
    note: 이 질문은 형태상 공손하고 중립적이에요.
  prs.a1.unit03.lesson06.teach.turn04:
    title: 페레슈테가 남편을 설명하기
    gloss: 네, 기혼이에요. 남편은 대학생이에요.
    note: 여기서는 이란식 دانشجو가 아니라, 아프가니스탄 다리어에서 굳어진 학생을 뜻하는 말 محصل을 써요.
  prs.a1.unit03.lesson06.teach.turn05:
    title: 마리암이 자녀에 대해 묻기
    gloss: 자녀가 있어요?
    note: دارین은 공손한 호칭을 유지해요.
  prs.a1.unit03.lesson06.teach.turn06:
    title: 페레슈테의 대답
    gloss: 아니요, 아직 아이가 없어요.
    note: نخیر는 공손한 '아니요'이고, نداریم은 '우리는 없다'는 뜻이에요.
exercises:
  prs.a1.unit03.lesson01.exercise01.recognize_mother:
    instruction: مادر의 뜻을 고르세요.
    correct_option: 어머니
    distractors:
    - 아버지
    - 형제
    - 여동생/누나/언니
    accepted_answers:
    - value: 어머니
      status: correct
    feedback: مادر는 '어머니'라는 뜻이에요.
  prs.a1.unit03.lesson01.exercise02.recognize_siblings:
    instruction: 형제와 자매를 뜻하는 짝은 무엇인가요?
    correct_option: برادر و خواهر
    distractors:
    - پدر و مادر
    - کاکا و عمه
    - ماما و خاله
    accepted_answers:
    - value: برادر و خواهر
      status: correct
    feedback: برادر는 형제, خواهر는 자매를 뜻해요.
  prs.a1.unit03.lesson01.exercise03.match_immediate:
    instruction: 가까운 가족을 뜻하는 단어를 알맞은 뜻과 연결하세요.
    accepted_answers:
    - value:
        مادر: 어머니
        پدر: 아버지
        برادر: 남자 형제
        خواهر: 여자 형제
      status: correct
    feedback: 여기서 배운 직계 가족 용어 네 가지예요.
    pairs:
    - left: مادر
      right: 어머니
    - left: پدر
      right: 아버지
    - left: برادر
      right: 남자 형제
    - left: خواهر
      right: 여자 형제
  prs.a1.unit03.lesson01.exercise04.order_parents:
    instruction: 부모님을 뜻하는 다리어 표현을 순서대로 배열하세요.
    accepted_answers:
    - value:
      - پدر
      - و
      - مادر
      status: correct
    feedback: پدر و مادر는 글자 그대로 '아버지와 어머니'라는 뜻이에요.
  prs.a1.unit03.lesson01.exercise05.translate_this_is_mother:
    instruction: '다리어로 번역하세요: 이분은 우리 어머니예요.'
    accepted_answers:
    - value: این مادرم است
      status: correct
    - value: این مادر من است
      status: correct
    feedback: این مادرم است는 '이분은 제 어머니예요'라는 뜻이에요.
    prompt_blocks:
    - 이분은 제 어머니예요.
  prs.a1.unit03.lesson01.exercise06.translate_sister:
    instruction: '다리어로 번역하세요: 이 사람은 제 누나(여동생)예요.'
    accepted_answers:
    - value: این خواهرم است
      status: correct
    - value: این خواهر من است
      status: correct
    feedback: خواهرم 끝의 م은 '제 ~'라는 뜻이에요.
  prs.a1.unit03.lesson01.exercise07.speak_family_member:
    instruction: 사진 속 형제나 자매 중 한 명을 가리키며 누구인지 다리어로 말해 보세요.
    accepted_answers:
    - value: این برادرم است
      status: correct
    - value: این خواهرم است
      status: correct
    - value: این برادر من است
      status: correct
    - value: این خواهر من است
      status: correct
    feedback: این, '제 ~'가 붙은 가족 관계 단어, 그리고 است를 사용하세요.
  prs.a1.unit03.lesson02.exercise01.recognize_grandparents:
    instruction: پدرکلان의 뜻을 고르세요.
    correct_option: 할아버지
    distractors:
    - 할머니
    - 아버지
    - 아버지의 남자 형제(큰아버지·작은아버지)
    accepted_answers:
    - value: 할아버지
      status: correct
    feedback: پدرکلان은 아프가니스탄 다리어로 '할아버지'를 뜻해요.
  prs.a1.unit03.lesson02.exercise02.recognize_maternal_uncle:
    instruction: ماما는 어떤 관계를 가리킬까요?
    correct_option: 어머니의 남자 형제(외삼촌)
    distractors:
    - 아버지의 남자 형제(큰아버지·작은아버지)
    - 어머니의 여자 형제(이모)
    - 아버지의 여자 형제(고모)
    accepted_answers:
    - value: 어머니의 남자 형제(외삼촌)
      status: correct
    feedback: ماما는 어머니 쪽 삼촌, 즉 외삼촌만을 가리켜요.
  prs.a1.unit03.lesson02.exercise03.match_sides:
    instruction: 각 단어를 알맞은 뜻과 연결하세요.
    accepted_answers:
    - value:
        کاکا: 아버지의 형제(큰아버지·작은아버지·삼촌)
        عمه: 아버지의 누이(고모)
        ماما: 어머니의 형제(외삼촌)
        خاله: 어머니의 자매(이모)
        مادر: 어머니
        پدر: 아버지
        برادر: 남자 형제
        خواهر: 여자 형제
      status: correct
    feedback: 다리어는 고모·이모·삼촌이 아버지 쪽인지 어머니 쪽인지 구별해요. 마지막 네 단어는 앞에서 배운 직계 가족을 복습하는 거예요.
    pairs:
    - left: کاکا
      right: 아버지의 형제(큰아버지·작은아버지·삼촌)
    - left: عمه
      right: 아버지의 누이(고모)
    - left: ماما
      right: 어머니의 형제(외삼촌)
    - left: خاله
      right: 어머니의 자매(이모)
    - left: مادر
      right: 어머니
    - left: پدر
      right: 아버지
    - left: برادر
      right: 남자 형제
    - left: خواهر
      right: 여자 형제
  prs.a1.unit03.lesson02.exercise04.order_grandmother:
    instruction: '순서대로 배열하세요: 이분은 제 할머니예요.'
    accepted_answers:
