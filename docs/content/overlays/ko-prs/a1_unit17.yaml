    gloss: 복통
    note: دل‌درد는 دل(구어로 배, 속)과 درد(통증)가 합쳐진 복합어예요.
    example_gloss: 배가 아파요.
  prs.a1.unit17.lesson01.teach.have_word:
    title: 저는 가지고 있어요
    gloss: 저는 가지고 있어요
    note: دارم은(는) داشتن(가지다)의 1인칭 현재형이에요.
    target_text: دارم (저는 가지고 있어요)
  prs.a1.unit17.lesson02.teach.sick_word:
    title: 아픈
    gloss: 아픈
    note: مریض은(는) '아픈'이라는 뜻이에요.
    example_gloss: 저는 아파요.
  prs.a1.unit17.lesson02.teach.am_word:
    title: 저는 ~이에요
    gloss: 나는 ~이다
    note: استم은(는) 공손한 1인칭 연결 동사로, 이 코스의 استم/استین 말투에 맞아요.
    target_text: استم (저는 ~이에요)
  prs.a1.unit17.lesson02.teach.my_condition_word:
    title: 제 컨디션
    gloss: 제 몸 상태 / 제 컨디션
    note: حالم(حال + م)은 글자 그대로 '내 상태'라는 뜻이에요. حالم خوب نیست은(는) '몸이 안 좋아요'라는 뜻이에요.
    target_text: حالم (제 몸 상태 / 제 컨디션)
  prs.a1.unit17.lesson02.teach.good_word:
