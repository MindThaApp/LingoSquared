    note: استراحت은(는) '휴식'이라는 명사예요. کنین과 합치면 '쉬세요!'라는 명령형이 돼요.
    example_gloss: 쉬세요.
  prs.a1.unit17.lesson04.teach.do_word:
    title: 하세요 (공손한 표현)
    gloss: 하세요 (공손한 명령형)
    note: کنین은(는) کردن(하다)의 공손한 명령형이에요. استراحت کنین은(는) 글자 그대로 '휴식을 하세요', 즉 '쉬세요'라는 뜻이에요.
    target_text: کنین (하세요 -- 공손한 명령형)
