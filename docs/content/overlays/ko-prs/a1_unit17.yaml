    note: خوب은(는) '좋은, 괜찮은'이라는 뜻이에요.
    example_gloss: 몸이 안 좋아요.
  prs.a1.unit17.lesson02.teach.not_word:
    title: ~이 아니에요
    gloss: 아니에요
    note: نیست은(는) 부정 연결 동사예요. خوب نیست은(는) '좋지 않아요'라는 뜻이에요.
    target_text: نیست (~이 아니에요)
  prs.a1.unit17.lesson03.teach.doctor_word:
