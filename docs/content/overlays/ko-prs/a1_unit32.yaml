course:
  title: 한국어로 배우는 다리어 A1
  description: '카불 다리어 초급: 축하와 생일 관련 어휘(생일, 파티, 케이크, 선물, 축하), 생일이 어느 달인지 묻고 말하기, 공손한 초대 표현, 그리고 생일 파티에 관한 바시르와 마리암의 대화를 배워요.'
units:
  prs.a1.unit32.celebrations:
    title: 축하 행사
    description: 생일과 축하에 대해 이야기해 봐요. 생일이 언제인지 말하고, 누군가를 초대하고, 축하해 보세요.
