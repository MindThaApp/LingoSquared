  prs.a1.unit32.lesson05.reading_celebration:
    title: 축하에 관한 글 읽기
  prs.a1.unit32.lesson06.wrap_up:
    title: 마무리
teaching:
  prs.a1.unit32.lesson01.teach.birthday_word:
    title: 생일
    gloss: 생일
    note: تولد은 '생일'이라는 뜻으로, 이 단원의 핵심 단어예요.
    example_gloss: 제 생일은 하말이에요.
  prs.a1.unit32.lesson01.teach.celebration_word:
    title: 축하 행사
    gloss: 축하 / 파티
    note: جشن은 축하 행사나 파티를 뜻해요.
    example_gloss: 우리 파티는 커요.
  prs.a1.unit32.lesson01.teach.cake_word:
    title: 케이크
    gloss: 케이크
    note: کیک은 '케이크'라는 뜻이에요. 페르시아어와 다리어에서 함께 쓰는 외래어예요.
    example_gloss: 케이크가 맛있어요.
  prs.a1.unit32.lesson01.teach.gift_word:
    title: 선물
    gloss: 선물
    note: هدیه은 '선물'이라는 뜻으로, 다리어와 페르시아어에서 일상적으로 쓰는 단어예요. تحفه도 쓰여요.
    example_gloss: 이 선물은 당신을 위한 거예요.
  prs.a1.unit32.lesson01.teach.congratulations_word:
    title: 축하해요
    gloss: 축하
    note: تبریک은 '축하'라는 뜻이에요. 일상 표현 تبریک می‌گویم(축하해요)처럼 می‌گویم(말해요)과 함께 써요.
    example_gloss: 축하해요!
  prs.a1.unit32.lesson01.teach.review_mubarak:
    title: 생일 축하해요 (만드는 방법)
    gloss: 네 생일 (친근한 표현) + 복된 → 생일 축하해요
    note: تولدت은 تولد(생일)에 친근한 '너의'를 뜻하는 접미사 -ت가 붙은 말이에요. مبارک은 '복된, 즐거운'이라는 뜻이에요. 합쳐서 تولدت مبارک은 다리어와 페르시아어의 대표적인 생일 인사예요.
    target_text: تولدت (네 생일, 친근한 표현) + مبارک (축복받은) = تولدت مبارک (생일 축하해)
  prs.a1.unit32.lesson01.teach.happy_birthday_phrase:
    title: 생일 축하해요!
    gloss: 생일 축하해요!
    note: 다리어와 페르시아어에서 널리 쓰는 진짜 생일 인사예요. (تولدتان مبارک은 공손한 형태인데, 이 단원의 연습에는 나오지 않아요.)
  prs.a1.unit32.lesson02.teach.review_shoma_dar_ast:
    title: 당신 / ~에 / ~이다
    gloss: 당신 (공손한 표현) / ~에 / ~이다
    note: شما(당신, 공손한 표현), در(~에), است(~이다)는 모두 앞 단원에서 배운 내용이에요.
    target_text: شما (당신, 공손한 표현) / در (~에) / است (~이다, ~이에요)
  prs.a1.unit32.lesson02.teach.review_man_kodam:
    title: I / which
    gloss: 나 / 어느
    note: من(나)과 کدام(어느)은 모두 앞 단원에서 배운 내용이에요.
    target_text: من (나, 저) / کدام (어느)
  prs.a1.unit32.lesson02.teach.month_word:
    title: 달
    gloss: 달, 월
    note: ماه는 '달, 월'이라는 뜻으로, 이 과정에서 처음 나오는 새 단어예요.
    example_gloss: 이번 달은 따뜻해요.
  prs.a1.unit32.lesson02.teach.review_hamal:
    title: Hamal
    gloss: 하말 (첫 번째 달)
    note: حمل은 아프가니스탄에서 쓰는 태양 헤즈라력의 첫 번째 달이에요.
    target_text: حمل (하말, 첫 번째 달)
  prs.a1.unit32.lesson02.teach.question_which_month:
    title: 생일이 어느 달이에요?
    gloss: 생일이 어느 달이에요?
    note: تولد(생일, 복습), شما(당신, 공손한 표현, 복습), در(~에, 복습), کدام(어느, 복습), ماه(달)가 합쳐진 문장이에요.
  prs.a1.unit32.lesson02.teach.answer_hamal:
    title: 제 생일은 하말이에요
    gloss: 제 생일은 하말이에요.
    note: تولد من در ... است(제 생일은 ...에 있어요, 복습한 문형)에 حمل(하말)을 넣은 문장이에요.
  prs.a1.unit32.lesson03.teach.review_dawat_mehmani:
    title: Invitation / party
    gloss: 초대 / 파티
    note: دعوت와 مهمانی는 이 과정의 어휘 규칙에 따라 여기서 다시 나와요.
    target_text: دعوت (초대) / مهمانی (파티)
  prs.a1.unit32.lesson03.teach.review_ra_ba:
    title: Object marker / to
    gloss: 목적어 표지 / ~에게, ~으로
    note: را(목적어 표지)와 به(~에게, ~으로)는 복습하는 기능어예요.
    target_text: را (목적어 표지) / به (~에게, ~으로)
  prs.a1.unit32.lesson03.teach.review_mikonam:
    title: I do
    gloss: 저는 해요 → 저는 초대해요
    note: می‌کنم(저는 해요, 복습)이 دعوت와 결합해 '초대해요'라는 뜻의 دعوت می‌کنم이 돼요.
    target_text: می‌کنم (저는 해요) — دعوت می‌کنم (저는 초대해요)
  prs.a1.unit32.lesson03.teach.invite_sentence:
    title: 생일 파티에 초대해요
    gloss: 생일 파티에 초대해요.
    note: من ... را به ... دعوت می‌کنم(...를 ...에 초대해요, 복습한 문형)에 جشن تولد(생일 파티)를 넣은 문장이에요.
  prs.a1.unit32.lesson03.teach.review_miyayin:
    title: Will you come? (formal)
    gloss: 오시겠어요? (공손한 표현)
    note: می‌آیین은 앞서 배운 공손한 동사 어미 -ین 형태를 따라요. (استین/می‌خوانین/می‌کنین과 같아요.)
    target_text: می‌آیین؟ (오시겠어요? 공손한 표현)
  prs.a1.unit32.lesson03.teach.will_you_come_question:
    title: 오시겠어요?
    gloss: 오시겠어요?
    note: شما(당신, 공손한 표현, 복습)와 می‌آیین이 합쳐진 문장이에요.
  prs.a1.unit32.lesson04.teach.review_time_words:
    title: Friday / o'clock / how many / seven
    gloss: 금요일 / ~시, 시간 / 몇, 무슨 / 일곱
    note: جمعه, ساعت, چند, هفت는 모두 앞 단원(날짜와 시간)에서 배운 내용이에요.
    target_text: جمعه (금요일) / ساعت (~시 / 시간) / چند (몇 / 무슨) / هفت (일곱)
  prs.a1.unit32.lesson04.teach.review_informal_come:
    title: You (informal) / you come / I come / yes / very good / thanks a lot
    gloss: 너 (친근한 표현) / 너는 와 (친근한 표현) / 나는 와요 / 네 / 아주 좋아요 / 정말 고마워요
    note: تو, می‌آیی, می‌آیم, بلی, بسیار خوب, تشکر زیاد는 모두 복습 내용으로, 친근한 말투의 대화를 위해 여기에 모았어요.
    target_text: تو (너, 친근한 표현) / می‌آیی (너는 와, 친근한 표현) / می‌آیم (나는 와요) / بلی (네) / بسیار خوب (아주 좋아요) / تشکر زیاد (정말 고마워요)
  prs.a1.unit32.lesson04.teach.dialogue_line1:
    title: '바시르: 마리암, 금요일이 내 생일 파티야. 올래?'
    gloss: 마리암, 금요일이 내 생일 파티야. 올래?
  prs.a1.unit32.lesson04.teach.dialogue_line2:
    title: '마리암: 네, 갈게요! 금요일 몇 시예요?'
    gloss: 네, 갈게요! 금요일 몇 시예요?
  prs.a1.unit32.lesson04.teach.dialogue_line3:
    title: '바시르: 7시예요.'
    gloss: 7시예요.
  prs.a1.unit32.lesson04.teach.dialogue_line4:
    title: '마리암: 좋아요. 생일 축하해요, 바시르!'
    gloss: 좋아요. 생일 축하해요, 바시르!
  prs.a1.unit32.lesson04.teach.dialogue_line5:
    title: '바시르: 정말 고마워요!'
    gloss: 정말 고마워요!
  prs.a1.unit32.lesson05.teach.happy_word:
    title: 기쁜
    gloss: 행복한
    note: خوشحال은 '기쁜'이라는 뜻이에요.
    example_gloss: 그는 기뻐해요.
  prs.a1.unit32.lesson05.teach.review_u_yak:
    title: He/she / a, one
    gloss: 그/그녀 / 하나의, 하나
    note: او(그/그녀, 31단원에서 복습)와 یک(하나의, 4단원에서 복습)은 여기서 다시 나와요.
    target_text: او (그 / 그녀) / یک (하나의 / 하나)
  prs.a1.unit32.lesson05.teach.review_miyayad_miyawarad:
    title: He/she comes / he/she brings
    gloss: 그/그녀가 와요 / 그/그녀가 가져와요
    note: 'می‌آید와 می‌آورد는 3인칭 형태로, 앞서 배운 3인칭 -د 동사 형태(예: 31단원의 می‌خواند)와 같아요.'
    target_text: می‌آید (그/그녀가 와요) / می‌آورد (그/그녀가 가져와요)
  prs.a1.unit32.lesson05.teach.reading_passage:
    title: 축하에 관한 글 읽기
    gloss: 바시르의 생일 파티는 금요일이에요. 7시예요. 마리암이 파티에 와요. 그녀는 선물을 가져와요. 바시르는 기뻐해요.
  prs.a1.unit32.lesson06.teach.review_like_have_time:
    title: I like / time / I don't have / but
    gloss: 좋아해요 / 시간 / 없어요 / 하지만
    note: دوست دارم(좋아해요), وقت(시간), ندارم(없어요), اما(하지만)는 모두 앞 단원에서 배운 내용으로, 31단원의 마무리 문형을 이어서 써요.
    target_text: دوست دارم (좋아해요) / وقت (시간) / ندارم (없어요) / اما (하지만)
  prs.a1.unit32.lesson06.teach.wrap_summary:
    title: 파티는 좋아하지만 시간이 없어요
    gloss: 저는 기념 행사를 좋아하지만 시간이 없어요.
    note: جشن را دوست دارم(저는 기념 행사를 좋아해요, 복습한 구문)과 اما وقت ندارم(하지만 시간이 없어요)을 합친 문장이에요.
