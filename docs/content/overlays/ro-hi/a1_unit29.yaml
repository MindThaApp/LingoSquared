teaching:
  hi.a1.unit29.lesson01.teach.kul_kitna_hua:
    title: Cum afli prețul total
    gloss: Cât costă în total?
    note: '*कुल* înseamnă „total”, iar *कितना हुआ?* („cât a ieșit?”) este modul obișnuit de a întreba totalul.'
  hi.a1.unit29.lesson01.teach.kul_pachchees_rupye:
    title: Cum spui prețul total
    gloss: În total costă două sute cincizeci de rupii.
    note: '*हुए* se acordă cu pluralul *रुपये*: *कुल दो सौ पचास रुपये हुए* înseamnă literal „în total au ieșit două sute cincizeci de rupii”.'
  hi.a1.unit29.lesson02.teach.kard_se_pement:
    title: Plata cu cardul sau în numerar
    gloss: a plăti cu cardul, a plăti în numerar
    note: În hindi se spune *कार्ड से पेमेंट करना* („a face plata cu cardul”) și *नकद पेमेंट करना*; *से* marchează mijlocul de plată.
    example_gloss:
    - Pot plăti cu cardul aici?
    - Plătesc în numerar.
  hi.a1.unit29.lesson02.teach.kya_main_yahan:
    title: Cum întrebi dacă se poate plăti cu cardul
    gloss: Pot plăti cu cardul aici?
    note: '*यहाँ* („aici”) indică locul, iar *सकता हूँ* („pot”) vine după expresia principală; o femeie spune *सकती हूँ*.'
  hi.a1.unit29.lesson02.teach.ap_nakad_pement:
    title: Cum întrebi cum preferă cineva să plătească
    gloss: Doriți să plătiți în numerar sau cu cardul?
    note: '*आप ... करेंगे* este întrebarea politicoasă la viitor pe care o folosește un casier, iar *आप* cere verbul la plural *करेंगे*.'
  hi.a1.unit29.lesson03.teach.bil:
    title: Nota de plată
    gloss: nota de plată
    note: '*बिल* este un substantiv masculin: *एक बिल*, *बिल का*.'
    example_gloss: Împărțim nota de plată?
  hi.a1.unit29.lesson03.teach.bil_bant_len:
    title: Cum propui să împărțiți nota de plată
    gloss: Împărțim nota de plată?
    note: '*बाँट लें?* („împărțim?”) sugerează un plan comun fără a spune *हम*; *लें* este forma de îndemn („să...”) a verbului *लेना*.'
  hi.a1.unit29.lesson03.teach.kya_main_alag:
    title: Cum ceri să plătești separat
    gloss: Pot plăti separat?
    note: '*अलग से* înseamnă „separat” și stă înaintea lui *पेमेंट कर सकता हूँ*.'
  hi.a1.unit29.lesson04.teach.bakee_paise:
    title: Restul
    gloss: restul
    note: '*बाकी पैसे* („banii rămași”) este la plural și înseamnă restul pe care îl primești înapoi.'
    example_gloss: Poftiți restul.
  hi.a1.unit29.lesson04.teach.ye_rahe_apke:
    title: Cum dai restul
    gloss: Poftiți restul.
    note: '*आपके* este „al dumneavoastră” politicos (*आप* + *के*), acordat cu pluralul *पैसे*.'
  hi.a1.unit29.lesson04.teach.mujhe_bakee_paise:
    title: Cum refuzi restul
    gloss: Nu am nevoie de rest.
    note: '*मुझे ... नहीं चाहिए* („mie ... nu-mi trebuie”) este modul în care hindi spune „nu am nevoie”; *नहीं* stă înaintea lui *चाहिए*.'
  hi.a1.unit29.lesson05.teach.paintees:
    title: Trei sute cincizeci
    gloss: trei sute cincizeci
    note: '*तीन सौ पचास* este 350: se spun întâi sutele, apoi zecile.'
    example_gloss: Costă trei sute cincizeci de rupii.
  hi.a1.unit29.lesson05.teach.bil_do_thalee:
    title: Citește o notă de plată de la restaurant
    gloss: 'Nota: două thali și două ceaiuri. Total: trei sute cincizeci de rupii. Plata: cu cardul.'
    note: Urmărește ce s-a comandat, totalul și cum s-a plătit.
    glosses:
      बिल: nota de plată
      दो: două
      थाली: thali
      चाय: ceaiuri
      कुल: totalul
      तीन: trei
      सौ: o sută
      पचास: cincizeci
      रुपये: rupii
      पेमेंट: plată
      कार्ड: card
  hi.a1.unit29.lesson06.teach.priya_bil_mang:
    title: Priya cere nota
    gloss: 'Priya: Cerem nota?'
    note: '*माँग लें?* („s-o cerem?”) folosește din nou forma de îndemn a lui *लेना*, iar *माँगना* înseamnă „a cere”.'
  hi.a1.unit29.lesson06.teach.arjun_han_achchha:
    title: Arjun întreabă totalul
    gloss: 'Arjun: Da, bună idee. Cât face în total?'
    note: '*कुल कितना हुआ?* este întrebarea despre total de mai înainte, acum pusă la masă.'
  hi.a1.unit29.lesson06.teach.priya_paintees_rupye:
    title: Priya spune totalul
    gloss: 'Priya: Fac trei sute cincizeci de rupii. Împărțim?'
    note: '*तीन सौ पचास रुपये हुए* spune totalul, iar *बाँट लें?* întreabă „împărțim?”.'
  hi.a1.unit29.lesson06.teach.arjun_naheen_aj:
    title: Arjun insistă să plătească
    gloss: 'Arjun: Nu, lasă-mă să plătesc eu azi. M-ai ajutat foarte mult.'
    note: '*मुझे पेमेंट करने दो* înseamnă „lasă-mă să plătesc”, iar *तुमने मेरी बहुत मदद की है* folosește *ने* pentru că verbul este la trecut.'
  hi.a1.unit29.lesson06.teach.priya_tum_kitne:
    title: Priya este mișcată
    gloss: 'Priya: Ce drăguț din partea ta! Mulțumesc.'
    note: '*तुम कितने अच्छे हो!* („ce bun ești!”) este un compliment călduros, iar *शुक्रिया* înseamnă „mulțumesc”.'
  hi.a1.unit29.lesson06.teach.arjun_kya_main:
    title: Arjun întreabă dacă poate plăti cu cardul
    gloss: 'Arjun: Pot plăti aici cu cardul?'
    note: Întrebarea *क्या मैं यहाँ कार्ड से पेमेंट कर सकता हूँ?* apare din nou, acum într-un restaurant real.
  hi.a1.unit29.lesson06.teach.arjun_bil_deta:
    title: 'देता है: el plătește'
    gloss: Arjun plătește nota.
    note: '*देता है* este forma pentru *वह* a verbului *देना* („a da”); hindi spune literal „dă nota” pentru „plătește nota”.'
