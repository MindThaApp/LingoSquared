teaching:
  hi.a1.unit17.lesson01.teach.tum_tumhara_kya_review:
    title: 'Recapitulare: tu, al tău, ce'
    gloss: tu (informal), al tău (informal), ce
    note: O scurtă recapitulare a cuvintelor necesare pentru a întreba un prieten despre meseria lui.
    example_gloss: Cum te cheamă?
  hi.a1.unit17.lesson01.teach.arjun_priya_review:
    title: 'Recapitulare: Arjun, Priya'
    gloss: Arjun, Priya
    note: O reamintire a numelor celor două personaje, înainte ca lecția să le folosească drept reper pentru întrebările cu gen gramatical.
    example_gloss:
    - Mă numesc Arjun.
    - Mă numesc Priya.
  hi.a1.unit17.lesson01.teach.copula_review:
    title: 'Recapitulare: eu, sunt, este, ești'
    gloss: eu, sunt, este, ești (tu, informal)
    note: Setul complet de forme ale verbului „a fi” necesare pentru propozițiile de identitate din această unitate.
    example_gloss:
    - Ești bine?
    - Sunt bine.
  hi.a1.unit17.lesson01.teach.kaam_review:
    title: 'Recapitulare: muncă'
    gloss: muncă
    note: Învățat în unitatea 10/11 -- reluat aici ca cuvânt-temă al întregii unități.
    example_gloss: Am de lucru.
  hi.a1.unit17.lesson01.teach.karte_karti_karta_verb:
    title: Faci (tu, bărbat / tu, femeie / eu, bărbat)
    gloss: faci (tu, bărbat, informal), faci (tu, femeie, informal), fac (eu, bărbat)
    note: Extinde regula acordului -ta/-ti/-te, deja învățată în unitatea 10 (văzută și în *kya tum yog karti ho?* din unitatea 1), la verbul *karna* (a face).
    example_gloss:
    - Cu ce te ocupi?
    - Eu iau micul dejun.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karte_ho_phrase:
    title: Ce lucrezi? (către un bărbat)
    gloss: Ce lucrezi?
    note: Întrebarea de început a lecției, adresată unui prieten.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karti_ho_phrase:
    title: Ce lucrezi? (către o femeie)
    gloss: Ce lucrezi?
    note: Aceeași întrebare, adresată unei prietene -- se schimbă doar terminația verbului.
  hi.a1.unit17.lesson01.teach.shikshak_shikshika:
    title: Profesor (bărbat / femeie)
    gloss: profesor (bărbat), profesoară (femeie)
    note: O nouă pereche de substantive pentru meserii. Spre deosebire de majoritatea substantivelor învățate până acum, acesta se schimbă după genul VORBITORULUI -- vezi nota de gramatică a acestei lecții.
    example_gloss:
    - Sunt profesor.
    - Sunt profesoară.
  hi.a1.unit17.lesson01.teach.grammar_occupation_gender:
    title: Mein + profesie + hoon
    gloss: '''Mein + profesie + hoon'' indică o meserie, același tipar ''mein...hoon'' din unitatea 1. Unele meserii se schimbă după genul vorbitorului -- ''shikshak'' (bărbat), ''shikshika'' (femeie), la fel cum se schimba terminația verbului -ta/-ti în unitatea 10. ''Doctor'' și ''engineer'' nu se schimbă -- același cuvânt pentru ambele genuri.'
    note: Explică de la început cele două categorii (substantive care se acordă în gen și împrumuturi invariabile), înainte ca vreun exercițiu să se bazeze pe ele.
  hi.a1.unit17.lesson01.teach.doctor_review:
    title: 'Recapitulare: medic'
    gloss: medic
    note: Învățat în unitatea 16 -- reluat aici ca meserie invariabilă ca gen.
    example_gloss: Este medic.
  hi.a1.unit17.lesson01.teach.mein_doctor_hoon_phrase:
    title: Sunt medic.
    gloss: Sunt medic.
    note: Tiparul de identitate aplicat unui cuvânt recapitulat.
  hi.a1.unit17.lesson01.teach.engineer:
    title: Inginer
    gloss: inginer
    note: Un nou substantiv pentru o meserie, invariabil ca gen, la fel ca *doctor*.
    example_gloss: Este inginer.
  hi.a1.unit17.lesson01.teach.mein_engineer_hoon_phrase:
    title: Sunt inginer.
    gloss: Sunt inginer.
    note: Structura de identificare, aplicată celei de-a doua ocupații noi din această lecție.
  hi.a1.unit17.lesson02.teach.kahan_review:
    title: 'Recapitulare: unde'
    gloss: unde
    note: Învățat prima dată în unitatea 1 – refolosit aici pentru a întreba despre un loc de muncă.
    example_gloss: Unde este spitalul?
  hi.a1.unit17.lesson02.teach.mein_review:
    title: 'Recapitulare: în / la'
    gloss: în / la
    note: Învățat prima dată în unitatea 1 – refolosit aici pentru a numi un loc de muncă.
    example_gloss: Locuiesc la Londra.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karte_ho_phrase:
    title: Unde lucrezi? (către un bărbat)
    gloss: Unde lucrezi?
    note: Întrebarea de deschidere a lecției, adresată unui prieten.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karti_ho_phrase:
    title: Unde lucrezi? (către o femeie)
    gloss: Unde lucrezi?
    note: Aceeași întrebare, adresată unei prietene.
  hi.a1.unit17.lesson02.teach.school_review:
    title: 'Recapitulare: școală'
    gloss: școală
    note: Învățat prima dată în unitatea 8 – primul loc de muncă din această lecție.
    example_gloss: Lucrez la școală (vorbitoare).
  hi.a1.unit17.lesson02.teach.mein_school_mein_kaam_karti_hoon_phrase:
    title: Lucrez la școală.
    gloss: Lucrez la școală.
    note: Structura locului de muncă aplicată la școală, forma de feminin.
  hi.a1.unit17.lesson02.teach.hospital_review:
    title: 'Recapitulare: spital'
    gloss: spital
    note: Învățat prima dată în unitatea 8 – al doilea loc de muncă din această lecție, asociat cu ocupația de medic.
    example_gloss: Medicul lucrează la spital.
  hi.a1.unit17.lesson02.teach.daftar:
    title: Biroul
    gloss: birou
    note: Un substantiv nou, al treilea loc de muncă din această lecție, asociat cu ocupația de inginer.
    example_gloss: Lucrez la birou (vorbitor).
  hi.a1.unit17.lesson02.teach.mein_daftar_mein_kaam_karta_hoon_phrase:
    title: Lucrez la birou.
    gloss: Lucrez la birou.
    note: Structura locului de muncă aplicată la birou, forma de masculin.
  hi.a1.unit17.lesson02.teach.grammar_workplace:
    title: Loc + mein + kaam karta/karti hoon
    gloss: '„[Loc] + mein + kaam karta/karti hoon” combină trei elemente deja cunoscute: „mein” (unitatea 1, „London mein rehta hoon”), „kaam” (unitatea 10/11) și forma în -ta/-ti/-te a verbului „karna” (din unitatea 10, „nashta karta hoon”, și din unitatea 1, „kya tum yog karti ho?”). Nu este gramatică nouă – cele trei elemente sunt reunite pentru prima dată într-o singură propoziție.'
    note: Numește fiecare element deja învățat prin numărul unității, înainte de a le combina, ca în toate notele de gramatică anterioare.
  hi.a1.unit17.lesson03.teach.roz_review:
    title: 'Recapitulare: în fiecare zi'
    gloss: în fiecare zi
    note: Învățat prima dată în unitatea 10 – refolosit aici pentru a descrie programul zilnic de lucru.
    example_gloss: Lucrez în fiecare zi.
  hi.a1.unit17.lesson03.teach.jaana_forms_review:
    title: 'Recapitulare: a merge (tu, feminin / tu, masculin / eu, masculin)'
    gloss: mergi (tu, feminin, informal), mergi (tu, masculin, informal), merg (eu, masculin)
    note: Formele în -ta/-ti/-te ale verbului *jana* (a merge), deja învățate în unitatea 10, refolosite aici pentru drumul zilnic spre serviciu.
    example_gloss:
    - Merg la școală în fiecare zi (vorbitoare).
    - Mergi la birou în fiecare zi? (către un bărbat)
  hi.a1.unit17.lesson03.teach.bhi_haan_review:
    title: 'Recapitulare: și, da'
    gloss: și, da
    note: Ambele sunt deja învățate (unitatea 1 și unitatea 1/6/13) – refolosite în dialogul din această lecție.
    example_gloss: Da, și mie mi-a plăcut.
  hi.a1.unit17.lesson03.teach.dialogue.line01:
    title: Arjun o întreabă pe Priya despre meseria ei
    gloss: Priya, cu ce te ocupi?
  hi.a1.unit17.lesson03.teach.dialogue.line02:
    title: Priya spune că este profesoară la o școală
    gloss: Sunt profesoară. Lucrez la o școală.
  hi.a1.unit17.lesson03.teach.dialogue.line03:
    title: Arjun o întreabă dacă merge la școală în fiecare zi
    gloss: Frumos! Mergi la școală în fiecare zi?
  hi.a1.unit17.lesson03.teach.dialogue.line04:
    title: Priya confirmă și îi pune lui Arjun aceeași întrebare
    gloss: Da, merg la școală în fiecare zi. Tu cu ce te ocupi?
  hi.a1.unit17.lesson03.teach.dialogue.line05:
    title: Arjun spune că este inginer la un birou
    gloss: Sunt inginer. Lucrez la un birou.
  hi.a1.unit17.lesson03.teach.dialogue.line06:
    title: Priya îl întreabă dacă și el merge la birou în fiecare zi
    gloss: Foarte bine! Și tu mergi la birou în fiecare zi?
  hi.a1.unit17.lesson03.teach.dialogue.line07:
    title: Arjun confirmă
    gloss: Da, merg la birou în fiecare zi.
  hi.a1.unit17.lesson03.teach.dialogue.line08:
    title: Priya îi mulțumește
    gloss: Bine, mulțumesc.
  hi.a1.unit17.lesson03.teach.grammar_summary:
    title: Trei reguli principale
    gloss: 'Cele trei reguli principale ale unității: (1) „mein + ocupație + hoon” indică o meserie (de ex. „mein shikshika hoon”), iar unele ocupații se schimbă după genul vorbitorului; (2) „[loc] + mein + kaam karta/karti hoon” indică locul de muncă (de ex. „mein daftar mein kaam karta hoon”); (3) „roz [loc] jata/jati hoon” indică un obicei zilnic, aceeași regulă -ta/-ti din unitatea 10.'
    note: Un rezumat final care leagă gramatica întregii unități, ca nota de gramatică a unităților 15/16 care reunea paradigma.
  hi.a1.unit17.lesson03.teach.work_profile_reading:
    title: Citirea unui scurt profil
    gloss: Priya este profesoară. Ea lucrează la o școală. Arjun este inginer. El lucrează la un birou.
    note: Un profil scurt și direct, care reia exact faptele din dialog, fără informații noi – se potrivește obiectivului „citește un scurt profil profesional”.
    glosses:
      शिक्षिका: profesoară
      स्कूल: școală
      काम: serviciu
      करती: face / lucrează (feminin, de la करना)
      इंजीनियर: inginer
      दफ़्तर: birou
      करता: face / lucrează (masculin, de la करना)
