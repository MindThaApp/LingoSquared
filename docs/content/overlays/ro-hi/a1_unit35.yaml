    title: Se schimbă doar करना
    gloss: 'În *चेक करना*, cuvântul *चेक* rămâne neschimbat, iar doar *करना* se modifică după persoană: *मैं चेक करता हूँ*, *तुम चेक करते हो*. *इस्तेमाल करना* funcționează la fel.'
    note: 'Multe verbe hindi sunt formate dintr-un substantiv sau un împrumut plus *करना*: înveți primul cuvânt o singură dată și schimbi doar *करना*.'
