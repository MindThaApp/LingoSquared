    title: Verbul se acordă cu persoana
    gloss: 'Un *मैसेज* poate fi trimis sau citit, iar terminația verbului se acordă cu persoana: *मैं भेजता हूँ*, *तुम पढ़ते हो*, *वह पढ़ता है*.'
