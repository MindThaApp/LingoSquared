    gloss: Priya îl sună pe Arjun în fiecare zi. Ea folosește telefonul, nu o aplicație. Arjun nu are computer acasă, dar folosește internetul pe telefon. Vikram verifică prognoza meteo în fiecare dimineață. Apoi merge la alergat. Neha îi trimite des mesaje Priyei. Folosești și tu telefonul în fiecare zi?
    note: Compară obiceiurile celor patru personaje legate de dispozitive, la fel ca textul comparativ din unitatea despre sport.
