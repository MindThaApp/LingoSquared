  hi.a1.unit35.lesson04.teach.phir_milenge_yah:
    title: फिर मिलेंगे vs zi + को
    gloss: 'Știi deja *फिर मिलेंगे!* („ne vedem din nou”). Ca să numești o zi, pui *को* după ea: *शनिवार को मिलते हैं!*, *सोमवार को मिलते हैं!*'
    note: Extinde formula de rămas-bun din unitatea despre saluturi la o zi anume.
