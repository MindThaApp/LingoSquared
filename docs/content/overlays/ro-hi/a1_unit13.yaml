teaching:
  hi.a1.unit13.lesson01.teach.chai_coffee_review:
    title: 'Recapitulare: ceai, cafea'
    gloss: ceai, cafea
    note: O scurtă recapitulare a vocabularului din unitatea 6, necesar pentru a vorbi despre ce îți place și ce nu îți place în această unitate.
    example_gloss:
    - Vreau ceai.
    - Vreau cafea.
  hi.a1.unit13.lesson01.teach.mujhe_review:
    title: 'Recapitulare: mie'
    gloss: mie
    note: Pronumele în dativ, studiat mai devreme și folosit în unitățile 6/7/11 -- în această unitate primește un nou predicat cu care se asociază.
    example_gloss: Vreau ceai.
  hi.a1.unit13.lesson01.teach.pasand:
    title: Plăcere / plăcut
    gloss: plăcere / plăcut
    note: Un substantiv cu sensul „plăcere, gust” (nu „preferat”) -- împreună cu un subiect în dativ (mujhe/tumhein) și cu copula hai/hain, formează expresia pentru „îmi place...”.
    example_gloss: Îmi place ceaiul.
  hi.a1.unit13.lesson01.teach.pasand_hai_grammar:
    title: Pasand hai = îmi place
    gloss: „Pasand hai” înseamnă „X îmi este plăcut”, adică „îmi place X”. Începe cu mujhe/tumhein, exact ca „mujhe...chahiye” (unitatea 6), dar, spre deosebire de „chahiye” (după care nu urmează „hai”), după „pasand” urmează întotdeauna „hai” sau „hain”.
    note: Arată explicit diferența de structură dintre chahiye (a vrea/a avea nevoie) și pasand hai (a-i plăcea), ca să nu se confunde cele două construcții.
  hi.a1.unit13.lesson01.teach.sangeet:
    title: Muzică
    gloss: muzică
    note: Un substantiv nou, folosit pentru a exersa construcția pasand hai cu un subiect singular, nenumărabil.
    example_gloss: Îmi place muzica.
  hi.a1.unit13.lesson01.teach.haan_nahi_review:
    title: 'Recapitulare: da, nu'
    gloss: da, nu
    note: O scurtă recapitulare a două cuvinte de la început, necesare pentru a răspunde la întrebări despre preferințe și pentru a nega în această unitate.
    example_gloss:
    - Da, îmi place muzica.
    - Nu, nu-mi place cafeaua.
  hi.a1.unit13.lesson01.teach.pasand_nahi_hai_phrase:
    title: Nu-mi place cafeaua.
    gloss: Nu-mi place cafeaua.
    note: Negația funcționează exact ca în celelalte propoziții cu hai învățate deja (de ex. „yoga class nahin hai” din unitatea 3) -- nahin stă direct înaintea lui hai.
  hi.a1.unit13.lesson01.teach.kitab_kitaben:
    title: Carte / cărți
    gloss: carte / cărți
    note: O pereche nouă de substantive, singular și plural, folosită pentru a arăta că „hai”/„hain” de după pasand se acordă cu numărul lucrului care place.
    example_gloss:
    - Îmi place cartea.
    - Îmi plac cărțile.
  hi.a1.unit13.lesson01.teach.number_agreement_grammar:
    title: Hai sau hain după pasand
    gloss: '„Hai” sau „hain” după „pasand” se acordă cu NUMĂRUL lucrului care place -- exact ca în „mere paas...hai/hain” (unitatea 2): chai/sangeet pasand hai (singular), kitaaben pasand hain (plural).'
    note: Extinde direct regula de acord în număr hai/hain din unitatea 2, deja învățată, la un context nou, fără a introduce un concept gramatical nou.
  hi.a1.unit13.lesson02.teach.tumhein_review:
    title: 'Recapitulare: ție (informal)'
    gloss: ție (informal)
    note: Studiat prima dată în unitatea 6 cu chahiye („tumhein...chahiye?”) -- în această unitate același pronume în dativ se folosește cu pasand hai.
    example_gloss: Îți place muzica?
  hi.a1.unit13.lesson02.teach.kya_tumhein_pasand_hai_grammar:
    title: Kya tumhein...pasand hai?
    gloss: „Kya” la începutul unei întrebări este marca întrebărilor cu răspuns da/nu (unitatea 1); „tumhein” reia același tipar cu subiect în dativ folosit deja în „tumhein...chahiye?” (unitatea 6) -- aici „pasand hai” înlocuiește „chahiye”.
    note: Confirmă că este vorba de reutilizarea unui tipar de întrebare deja cunoscut, nu de un punct gramatical nou.
  hi.a1.unit13.lesson02.teach.khel:
    title: Sport / joc
    gloss: sport / joc
    note: Un substantiv nou. În exemple apare cu „yah” (acesta), ca acordul în număr să fie clar, deoarece „khel” nu își schimbă forma între singular și plural.
    example_gloss: Îmi place acest sport.
  hi.a1.unit13.lesson02.teach.yah_review:
    title: 'Recapitulare: acesta'
    gloss: acesta
    note: Studiat prima dată în unitatea 7 („mujhe yah chahiye”) -- reluat aici pentru ca trimiterea la „khel” la singular să fie clară.
    example_gloss: Această carte este bună.
  hi.a1.unit13.lesson02.teach.ya_review:
    title: 'Recapitulare: sau'
    gloss: sau
    note: Studiat prima dată în unitățile 6/7 pentru a comanda mâncare și a cumpăra lucruri -- reluat aici pentru a pune o întrebare de alegere despre preferințe.
    example_gloss: Ceai sau cafea?
  hi.a1.unit13.lesson02.teach.chai_ya_coffee_phrase:
    title: Îți place ceaiul sau cafeaua?
    gloss: Îți place ceaiul sau cafeaua?
    note: Combină tiparul de întrebare cu tumhein din această lecție cu ya (sau), deja învățat, pentru a cere cuiva să aleagă.
  hi.a1.unit13.lesson02.teach.zyada:
    title: Mai mult
    gloss: mai mult
    note: Un cuvânt nou, plasat direct înaintea lui „pasand hai” pentru a exprima o preferință între două lucruri deja numite.
    example_gloss: Îmi place mai mult ceaiul.
  hi.a1.unit13.lesson02.teach.zyada_pasand_grammar:
    title: Zyada pasand hai = a prefera
    gloss: „X zyada pasand hai” înseamnă a prefera unul dintre două lucruri -- „mujhe chai zyada pasand hai” înseamnă „îmi place mai mult ceaiul” / „prefer ceaiul”.
    note: O extindere lexicală, nu o regulă nouă -- „zyada” doar determină expresia „pasand hai”, deja învățată.
    target_text: '''X ज़्यादा पसंद है'' का मतलब है दो चीज़ों में से एक को तरजीह देना (prefer) -- ''मुझे चाय ज़्यादा पसंद है'' का मतलब है ''Îmi place mai mult ceaiul'' / ''Prefer ceaiul''।'
  hi.a1.unit13.lesson03.teach.review_words:
    title: 'Recapitulare: muzică, sport, cărți'
    gloss: muzică, sport/joc, cărți
    note: O scurtă recapitulare a substantivelor-cheie ale unității, necesare pentru dialog și pentru nota de citit.
    example_gloss:
    - Îmi place muzica.
    - Nu-mi place acest sport.
    - Îmi plac cărțile.
  hi.a1.unit13.lesson03.teach.dialogue.line01:
    title: Arjun întreabă despre muzică
    gloss: Priya, îți place muzica?
  hi.a1.unit13.lesson03.teach.dialogue.line02:
    title: Priya spune că îi place foarte mult
    gloss: Da, îmi place foarte mult muzica. Și ție?
  hi.a1.unit13.lesson03.teach.dialogue.line03:
    title: Arjun este de acord și adaugă sportul
    gloss: Și mie! Și îmi place și sportul.
  hi.a1.unit13.lesson03.teach.dialogue.line04:
    title: Priya preferă cărțile acestui joc
    gloss: Bine! Nu-mi place acest joc. Îmi plac cărțile.
  hi.a1.unit13.lesson03.teach.dialogue.line05:
    title: 'Arjun întreabă: ceai sau cafea'
    gloss: Bine. Îți place ceaiul sau cafeaua?
  hi.a1.unit13.lesson03.teach.dialogue.line06:
    title: Priya preferă ceaiul
    gloss: Îmi place mai mult ceaiul.
  hi.a1.unit13.lesson03.teach.dialogue.line07:
    title: Arjun este de acord
    gloss: Foarte bine! Și mie îmi place ceaiul.
  hi.a1.unit13.lesson03.teach.dialogue.line08:
    title: Priya încheie conversația
    gloss: Bine! Ne mai vedem mâine?
  hi.a1.unit13.lesson03.teach.chahiye_pasand_zyada_grammar:
    title: Trei tipare înrudite
    gloss: 'Cele trei tipare ale unității: după „chahiye” (a vrea/a avea nevoie, unitatea 6) nu urmează „hai”; „pasand hai/hain” (această unitate) se schimbă în funcție de numărul lucrului; „zyada pasand hai” înseamnă a prefera unul dintre două lucruri.'
    note: Un rezumat final care leagă gramatica întregii unități, în oglindă cu nota de gramatică din unitatea 12 care leagă paradigma.
    target_text: 'इस यूनिट के तीन तरीके: ''चाहिए'' (चाहना/ज़रूरत, यूनिट 6) के बाद ''है'' नहीं आता; ''पसंद है/हैं'' (यह यूनिट) चीज़ की संख्या से बदलता है; ''ज़्यादा पसंद है'' का मतलब है दो में से एक को तरजीह देना (prefer)।'
  hi.a1.unit13.lesson03.teach.priya_note:
    title: Biletul Priyei
    gloss: Arjun, îmi place foarte mult muzica. Îmi plac și cărțile. Nu-mi place acest joc. Îmi place mai mult ceaiul. - Priya
    note: Un bilet scurt care reia exact faptele stabilite deja în dialog, fără informații noi.
    glosses:
      संगीत: muzică
      बहुत: foarte mult
      पसंद: plăcut / apreciat
      किताबें: cărți
      खेल: joc
      नहीं: nu
      चाय: ceai
      ज़्यादा: mai mult / de preferat
