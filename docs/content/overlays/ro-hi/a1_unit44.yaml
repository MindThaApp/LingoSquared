    gloss: 'Acum este primăvară. Florile sunt frumoase. Nina întreabă: Ce anotimp ți se pare frumos? Arjun spune: Îmi place vara. Vara înotăm. Priya spune: Îmi place iarna. Iarna patinăm.'
