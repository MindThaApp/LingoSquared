      सुंदर: frumos
      पूछती: întreabă
      मौसम: anotimp
      लगता: a i se părea / a i se simți (mie)
      कहता: spune
      गर्मी: vara
      अच्छी: plăcută (fem.)
      तैरते: înotăm
