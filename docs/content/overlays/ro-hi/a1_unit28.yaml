teaching:
  hi.a1.unit28.lesson01.teach.fon_karna:
    title: A suna
    gloss: a suna
    note: Infinitivul verbului folosit pentru a da un telefon.
    example_gloss: Trebuie să te sun.
  hi.a1.unit28.lesson01.teach.main_tumhen_fon:
    title: Spui că suni
    gloss: Te sun.
    note: '*करूँगा* este viitorul lui *करना* și se folosește în hindi acolo unde în română spunem „te voi suna” sau „te sun”. Persoana sunată primește *तुम्हें* („ție”).'
  hi.a1.unit28.lesson01.teach.hailo_main_priya:
    title: Răspunsul la telefon
    gloss: Alo, sunt Priya.
    note: La telefon se spune *मैं ... बोल रही हूँ* („eu vorbesc”); *रही* este feminin, pentru că Priya este femeie.
  hi.a1.unit28.lesson01.teach.hailo_main_arjun:
    title: Arjun răspunde în același fel
    gloss: Alo, sunt Arjun.
    note: 'Același tipar, cu masculinul *रहा*: *मैं अर्जुन बोल रहा हूँ*, pentru că Arjun este bărbat.'
  hi.a1.unit28.lesson02.teach.main_kisse_bat:
    title: Întrebi cine sună
    gloss: Cu cine vorbesc?
    note: '*किससे* („cu cine”) este *कौन* („cine”) plus *से*, iar *से* marchează persoana cu care vorbești.'
  hi.a1.unit28.lesson02.teach.ap_priya_se:
    title: Te prezinți formal
    gloss: Vorbiți cu Priya.
    note: '*आप* este „dumneavoastră”, forma politicoasă pentru o persoană necunoscută. În *प्रिया से बात कर रहे हैं*, *से* stă după nume, iar *हैं* însoțește pe *आप*.'
  hi.a1.unit28.lesson03.teach.kya_tum_yah:
    title: Ceri să repete
    gloss: Poți repeta asta?
    note: '*सकते हो* înseamnă „poți” și stă după verbul principal: *कह सकते हो*. *क्या* la început face propoziția interogativă.'
  hi.a1.unit28.lesson03.teach.itna_tez_mat:
    title: Ceri cuiva să vorbească mai rar
    gloss: Nu vorbi atât de repede, te rog.
    note: '*मत बोलो* este „nu vorbi” spus prietenește, cu *तुम*, iar *इतना तेज़* înseamnă „atât de repede”.'
  hi.a1.unit28.lesson03.teach.mujhe_tumharee_avaz:
    title: Spui că nu auzi bine
    gloss: Nu te aud bine.
    note: 'Hindi spune „vocea ta nu vine”: *मुझे तुम्हारी आवाज़ नहीं आ रही है*. Cel care ascultă primește *मुझे*, iar vocea este subiectul.'
  hi.a1.unit28.lesson04.teach.maisej:
    title: Mesajul text
    gloss: mesajul text
    note: '*मैसेज* este un împrumut des folosit și este de genul masculin: *एक मैसेज*, *यह मैसेज ... का है*.'
    example_gloss: Mesajul este de la Priya.
  hi.a1.unit28.lesson04.teach.main_tumhen_ek:
    title: Cum spui că trimiți un mesaj
    gloss: Îți trimit un mesaj.
    note: 'Ordinea este: persoana, apoi lucrul, apoi verbul: *तुम्हें एक मैसेज भेजूँगा*. *भेजना* înseamnă „a trimite”.'
  hi.a1.unit28.lesson04.teach.main_tumhen_bad:
    title: Cum spui că suni înapoi
    gloss: Te sun mai târziu.
    note: '*वापस फ़ोन करना* înseamnă „a suna înapoi”, cu *वापस* înaintea lui *फ़ोन करना*; *बाद में* înseamnă „mai târziu”.'
  hi.a1.unit28.lesson05.teach.arjun_hay_priya:
    title: Citește o conversație prin mesaje
    gloss: 'Arjun: Bună, Priya, mă poți suna? Trebuie să-ți spun ceva. Priya: Da, sigur, te sun înapoi în cinci minute.'
    note: Urmărește ce cere Arjun, de ce și când spune Priya că va suna înapoi.
    glosses:
      हाय: salut
      सकती: a putea
      फ़ोन: a suna
      ज़रूरी: 'important (ca în: ceva important de spus)'
      कुछ: în timpul
      बतानी: a povesti / a spune
      ज़रूर: sigur / desigur
      करूँगी: voi suna
      पाँच: cinci
      मिनट: minute
      वापस: înapoi
  hi.a1.unit28.lesson06.teach.arjun_hailo_main:
    title: Arjun răspunde la telefon
    gloss: 'Arjun: Alo, sunt Arjun.'
    note: Cel care răspunde își spune mai întâi numele cu *मैं ... बोल रहा हूँ*, aici cu masculinul *रहा*.
  hi.a1.unit28.lesson06.teach.priya_hay_arjun:
    title: Priya se prezintă
    gloss: 'Priya: Bună, Arjun, sunt Priya. Arjun: Bine că ai sunat!'
    note: '*अच्छा हुआ तुमने फ़ोन किया* înseamnă „bine că ai sunat”; *तुमने ... किया* este trecutul cu *ने*.'
  hi.a1.unit28.lesson06.teach.priya_tumharee_pahlee:
    title: Priya întreabă despre tură
    gloss: 'Priya: Cum a fost prima ta tură?'
    note: '*कैसी रही* înseamnă „cum a fost”; *कैसी* este feminin, pentru că *शिफ़्ट* este feminin.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_achchhee:
    title: Arjun dă vestea bună
    gloss: 'Arjun: A mers foarte bine, mai bine decât am crezut.'
    note: '*अच्छी रही* („a mers bine”) se acordă cu femininul *शिफ़्ट*, iar *जितना मैंने सोचा था उससे भी बेहतर* înseamnă „chiar mai bine decât am crezut”.'
  hi.a1.unit28.lesson06.teach.vah_narvas_tha:
    title: 'था și थी: „a fost”'
    gloss: El era emoționat, ea era fericită.
    note: '*था* este „era/a fost” pentru un subiect masculin, iar *थी* pentru unul feminin; terminația se acordă cu cel sau ceea ce este descris.'
  hi.a1.unit28.lesson06.teach.priya_yah_sunkar:
    title: Priya este mândră
    gloss: 'Priya: Ce bine să aud! Sunt mândră de tine.'
    note: '*तुम पर गर्व है* („mândria e pe tine”) folosește *पर*, iar cel care este mândru primește *मुझे*.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_shukriya:
    title: Arjun este emoționat
    gloss: 'Arjun: Mulțumesc mult, înseamnă foarte mult pentru mine.'
    note: '*मेरे लिए* înseamnă „pentru mine”, iar *इसका बहुत मतलब है* este „înseamnă foarte mult”.'
  hi.a1.unit28.lesson06.teach.uskee_pahlee_shift:
    title: Posesivul „său”
    gloss: Prima lui tură a mers foarte bine.
    note: '*उसकी* înseamnă „al lui” sau „al ei” (același cuvânt pentru amândouă) și se acordă cu femininul *शिफ़्ट*.'
