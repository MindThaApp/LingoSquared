teaching:
  hi.a1.unit09.lesson01.teach.review_places:
    title: 'Recapitulare: locuri'
    gloss: bancă, școală, spital, parc, gară, poștă
    note: O scurtă recapitulare a cuvintelor pentru locuri din unitatea anterioară; această unitate le folosește des.
    example_gloss:
    - Banca este aici.
    - Poșta este lângă bancă.
  hi.a1.unit09.lesson01.teach.review_function_words:
    title: 'Recapitulare: este, unde, aici, acolo, de la, al/a, bine'
    gloss: este, unde, aici, acolo, de la, al/a (genitiv), bine
    note: O scurtă recapitulare a unor cuvinte mici din unitățile anterioare, pe care exercițiile din această unitate le reiau.
    example_gloss:
    - Unde este banca?
    - Parcul este acolo.
  hi.a1.unit09.lesson01.teach.seedhe_baaen_daaen:
    title: Drept, stânga, dreapta
    gloss: drept înainte, stânga, dreapta
    note: Cele trei cuvinte de bază pentru direcții din această unitate.
    example_gloss:
    - Mergeți drept înainte.
    - Virați la stânga.
  hi.a1.unit09.lesson01.teach.jao_muro:
    title: Mergi!, întoarce-te!
    gloss: mergi!, virează! (poruncă informală)
    note: Imperative la forma tum, registrul firesc pentru doi prieteni care își dau indicații.
    example_gloss:
    - Mergeți drept înainte.
    - Virează la dreapta.
  hi.a1.unit09.lesson01.teach.yahan_se_seedhe_jao:
    title: Mergi drept de aici
    gloss: De aici mergi drept înainte.
    note: Combină cuvintele noi din această lecție cu „yahaan se” („de aici”).
  hi.a1.unit09.lesson01.teach.baaen_muro_phrase:
    title: Virează la stânga
    gloss: Virați la stânga.
    note: O poruncă de sine stătătoare, gata de folosit așa cum este.
  hi.a1.unit09.lesson01.teach.daaen_muro_phrase:
    title: Virează la dreapta
    gloss: Virați la dreapta.
    note: Porunca-pereche a lui „baaen muro”.
  hi.a1.unit09.lesson01.teach.imperative_note:
    title: Terminația -o a imperativului
    gloss: '„Jaao” și „muro” sunt imperative la forma tum, ca „bataao” și „gino”: toate se termină în „-o”.'
    note: Indică modelul comun al imperativului informal, față de două cuvinte deja învățate în unități anterioare (bataao în unitatea 7, gino în unitatea 2).
  hi.a1.unit09.lesson02.teach.bank_kaise_jaun:
    title: Cum ajung la bancă?
    gloss: Cum ajung la bancă?
    note: Întrebarea de bază pentru a cere indicații, cu forma de persoana întâi „să merg”.
  hi.a1.unit09.lesson02.teach.tak:
    title: Până la
    gloss: până la
    note: Văzut deja în unitatea 2 la numărat („zero se das tak”); aici este reluat în sensul spațial, la fel de real.
    example_gloss: Mergi drept până la bancă.
  hi.a1.unit09.lesson02.teach.bank_tak_seedhe_jao:
    title: Mergi drept până la bancă
    gloss: Mergi drept până la bancă.
    note: O propoziție-model în care „tak” are sens spațial.
  hi.a1.unit09.lesson02.teach.pahle_phir:
    title: Mai întâi, apoi
    gloss: mai întâi, apoi
    note: O pereche de cuvinte folosite pentru a ordona doi pași dintr-o indicație.
    example_gloss:
    - Mai întâi mergi drept înainte.
    - Apoi virează la stânga.
  hi.a1.unit09.lesson02.teach.pahle_seedhe_phir_baaen:
    title: Mai întâi drept, apoi la stânga
    gloss: Mai întâi mergi drept înainte, apoi virează la stânga.
    note: Combină „pahle” și „phir” într-o indicație în doi pași.
  hi.a1.unit09.lesson02.teach.pahle_phir_note:
    title: Pahle și phir
    gloss: '„Pahle” și „phir” leagă doi pași: prima acțiune merge cu „pahle”, a doua cu „phir”, ca în „pahle seedhe jaao, phir baaen muro.”'
    note: Un punct de gramatică real și util despre cum se înlănțuie indicațiile în mai mulți pași.
  hi.a1.unit09.lesson03.teach.nukkad:
    title: Colț de stradă
    gloss: colț de stradă
    note: Un cuvânt nou pentru locuri, necesar în dialogul final; se folosește cu „par” („la/pe”).
    example_gloss:
    - Banca este la colț.
    - Parcul este în spatele școlii.
  hi.a1.unit09.lesson03.teach.bas:
    title: Doar / numai
    gloss: doar / numai
    note: Este și un împrumut frecvent pentru „autobuz”, dar acest sens nu se predă în curs, deci nu apare nicio ambiguitate.
    example_gloss: Mai mergi doar puțin.
  hi.a1.unit09.lesson03.teach.samajh_gaya:
    title: Am înțeles
    gloss: am înțeles / am priceput
    note: 'O expresie frecventă din două cuvinte: „samajh” (tema verbului „samajhna”, „a înțelege”) plus „gaya” („a plecat”), care arată că acțiunea e încheiată. Aceasta este forma masculină; Priya ar spune „samajh gayi”.'
    example_gloss: Am înțeles. / Am priceput.
  hi.a1.unit09.lesson03.teach.accha_bahut_shukriya:
    title: Bine! Mulțumesc mult!
    gloss: Bine! Mulțumesc mult!
    note: Reia „accha”, „bahut” și „shukriya” din unități anterioare.
  hi.a1.unit09.lesson03.teach.koi_baat_nahin_phir_milenge:
    title: Nicio problemă! Ne vedem.
    gloss: Nicio problemă! Ne vedem.
    note: Formula de încheiere obișnuită a acestui curs, reluată identic din Unitatea 8.
  hi.a1.unit09.lesson03.teach.dialogue.line01:
    title: Arjun întreabă despre poștă
    gloss: Arjun o întreabă pe Priya cum ajunge la poștă.
    note: Reia modelul întrebării de deschidere din lecția 2.
  hi.a1.unit09.lesson03.teach.dialogue.line02:
    title: Priya începe indicațiile
    gloss: 'Priya spune: de aici mergi mai întâi drept înainte.'
    note: Reia „yahaan se” și „pahle” din această unitate.
  hi.a1.unit09.lesson03.teach.dialogue.line03:
    title: Arjun întreabă ce urmează
    gloss: Arjun spune „bine” și întreabă ce urmează.
  hi.a1.unit09.lesson03.teach.dialogue.line04:
    title: Priya continuă
    gloss: 'Priya spune: apoi, la colțul băncii, virează la stânga.'
    note: Introduce „nukkad” („colț de stradă”) în context.
  hi.a1.unit09.lesson03.teach.dialogue.line05:
    title: Arjun confirmă și întreabă din nou
    gloss: Arjun repetă „stânga”, confirmă cu „bine” și întreabă ce urmează.
  hi.a1.unit09.lesson03.teach.dialogue.line06:
    title: Priya încheie primul traseu
    gloss: 'Priya spune: mai mergi doar puțin; poșta este acolo, lângă bancă.'
    note: 'Introduce „bas” („doar/numai”) și rămâne în acord cu faptul stabilit în Unitatea 8: poșta este lângă bancă.'
  hi.a1.unit09.lesson03.teach.dialogue.line07:
    title: Arjun a înțeles și întreabă despre parc
    gloss: Arjun spune că a înțeles și întreabă cum ajunge la parc.
    note: Introduce expresia „samajh gaya”.
  hi.a1.unit09.lesson03.teach.dialogue.line08:
    title: Priya dă al doilea traseu
    gloss: 'Priya spune: parcul? Mai întâi mergi drept înainte, apoi virează la dreapta; parcul este în spatele școlii.'
    note: 'Rămâne în acord cu faptul stabilit în Unitatea 8: parcul este în spatele școlii.'
  hi.a1.unit09.lesson03.teach.dialogue.line09:
    title: Arjun îi mulțumește Priyei
    gloss: Arjun spune că a înțeles și îi mulțumește mult Priyei.
  hi.a1.unit09.lesson03.teach.dialogue.line10:
    title: Priya încheie
    gloss: Priya spune că nu e nicio problemă și că se vor vedea.
    note: Aceeași replică de încheiere ca în dialogul din Unitatea 8, reluată identic.
