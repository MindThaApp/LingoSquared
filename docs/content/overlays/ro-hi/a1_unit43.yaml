    gloss: Nina și Priya merg sâmbătă la piața de flori. Ce culoare vrea Priya? Priya ar vrea roșu. Ce culoare vrea Nina? Nina ar vrea galben. Ele cumpără cinci flori. Costă o sută de rupii. Florile sunt foarte frumoase!
