    title: वह pentru animale
    gloss: Acesta este câinele meu. Îmi place foarte mult.
    note: '*वह* și *उसे* se folosesc atât pentru animale, cât și pentru oameni; hindi nu are aici un cuvânt separat pentru „el/ea” neutru.'
  hi.a1.unit32.lesson04.teach.arjun_kya_tum:
    title: Arjun întreabă despre plimbări
    gloss: 'Arjun: Îl plimbi în fiecare zi?'
  hi.a1.unit32.lesson04.teach.priya_han_main:
    title: Priya își descrie rutina
    gloss: 'Priya: Da, îl plimb în fiecare zi și îi dau de mâncare.'
  hi.a1.unit32.lesson05.teach.arjun_aur_neha:
    title: Arjun, Neha și Vikram despre animale
    gloss: 'Lui Arjun și Nehei le plac animalele, dar niciunul dintre ei nu are un animal de companie. Lui Arjun îi plac câinii, iar Nehei îi plac pisicile. Vikram are un animal de companie: o pisică. Se joacă des cu pisica lui și îi dă de mâncare în fiecare zi. Tu ai un animal de companie?'
    note: Contrastează a iubi un animal cu a avea cu adevărat unul -- chiar scopul comunicativ al unității.
    glosses:
      पसंद: iubesc
      दोनों: amândoi
      जानवर: animale
      किसी: oricare dintre ei
      पालतू: animal de companie
      कुत्ते: câini
      बिल्लियाँ: pisici
      बिल्ली: pisică
      खेलता: se joacă
      देता: dă
      रोज़: fiecare
      खाना: mâncare
  hi.a1.unit32.lesson05.teach.vikram_aksar_apnee:
    title: Vikram se joacă des cu pisica lui
    gloss: Vikram se joacă des cu pisica lui.
    note: '*अक्सर* („des”) stă înaintea verbului, iar *अपनी* se acordă cu substantivul feminin *बिल्ली*.'
