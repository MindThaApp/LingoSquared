  hi.a1.unit32.lesson06.teach.arjun_vah_kitna:
    title: Reacția lui Arjun
    gloss: 'Arjun: Ce frumos! Ce faci cu el în fiecare zi?'
  hi.a1.unit32.lesson06.teach.neena_main_use:
    title: Nina îi dă de mâncare în fiecare zi
    gloss: 'Nina: Îi dau de mâncare în fiecare zi.'
  hi.a1.unit32.lesson06.teach.arjun_mujhe_bhee:
    title: Și lui Arjun îi plac păsările
    gloss: 'Arjun: Și mie îmi plac foarte mult păsările.'
  hi.a1.unit32.lesson06.teach.priya_kitna_achchha:
    title: Priya încheie conversația
    gloss: 'Priya: Ce frumos că nouă, celor trei, ne plac animalele!'
    note: Închide cercul faptelor despre animale ale celor trei personaje din această unitate.
