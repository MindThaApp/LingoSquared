teaching:
  hi.a1.unit32.lesson01.teach.janvar_paltoo_janvar:
    title: Animal, un animal de companie
    gloss: animalul / un animal de companie
    note: '*जानवर* este cuvântul general pentru „animal”, iar *पालतू जानवर* („animal domesticit”) înseamnă animal de companie.'
    example_gloss:
    - Câinele este un animal.
    - Câinele este și un animal de companie.
  hi.a1.unit32.lesson01.teach.kutta_billee:
    title: Câinele și pisica
    gloss: câinele / pisica
    example_gloss:
    - Priya are un câine.
    - Vikram are o pisică.
  hi.a1.unit32.lesson01.teach.machhlee_chiriya:
    title: Peștele și pasărea
    gloss: peștele / pasărea
    example_gloss:
    - Bunicul are un pește.
    - Nina are o pasăre.
  hi.a1.unit32.lesson01.teach.kya_tumhare_pas:
    title: Ai un animal de companie?
    gloss: Ai un animal de companie?
    note: '*तुम्हारे पास ... है?* („la tine ... este?”) înseamnă „ai ...?”, iar *कोई* („vreun”) lasă întrebarea deschisă.'
  hi.a1.unit32.lesson01.teach.han_mere_pas:
    title: Da, am un câine
    gloss: Da, am un câine.
    note: Un răspuns afirmativ simplu, cu vocabularul nou al acestei unități.
  hi.a1.unit32.lesson01.teach.naheen_mere_pas:
    title: Nu, nu am niciun animal de companie
    gloss: Nu, nu am niciun animal de companie.
    note: '*कोई ... नहीं है* („nu există niciun ...”) spune că nu ai deloc.'
  hi.a1.unit32.lesson01.teach.mere_pas_koee:
    title: कोई ... नहीं
    gloss: Nu am niciun animal de companie.
    note: '*कोई* („vreun”) împreună cu *नहीं है* neagă faptul de a avea ceva: *मेरे पास कोई पालतू जानवर नहीं है*.'
  hi.a1.unit32.lesson02.teach.ghumane_le_jana:
    title: A scoate la plimbare (un animal)
    gloss: a scoate la plimbare (un animal)
    note: '*घुमाने ले जाना* („a duce la plimbare”) este modul în care hindi spune „a plimba un animal”; după *घुमाने* urmează *ले जाना*.'
    example_gloss: Scot câinele la plimbare în fiecare zi.
  hi.a1.unit32.lesson02.teach.vah_kutte_ko:
    title: घुमाने ले जाना
    gloss: Ea își plimbă câinele.
    note: Animalul primește *को* (*कुत्ते को*), iar *घुमाने ले जाती है* vine la sfârșit; *ले जाना* („a duce cu sine”) rămâne mereu împreună, în două cuvinte.
  hi.a1.unit32.lesson02.teach.khana_dena:
    title: A da de mâncare
    gloss: a da de mâncare
    example_gloss: Dau de mâncare pisicii în fiecare zi.
  hi.a1.unit32.lesson02.teach.ke_sath_khelna:
    title: A se juca cu
    gloss: a se juca cu
    example_gloss: Vikram se joacă cu pisica lui.
  hi.a1.unit32.lesson02.teach.main_roz_kutte:
    title: Scot câinele la plimbare în fiecare zi
    gloss: Scot câinele la plimbare în fiecare zi.
    note: '*रोज़* („în fiecare zi”) stă înaintea complementului: *रोज़ कुत्ते को घुमाने ले जाता हूँ*.'
  hi.a1.unit32.lesson02.teach.main_roz_billee:
    title: Dau de mâncare pisicii în fiecare zi
    gloss: Dau de mâncare pisicii în fiecare zi.
    note: '*खाना देना* („a da de mâncare”) marchează cine primește mâncarea cu *को*: *बिल्ली को खाना देता हूँ*.'
  hi.a1.unit32.lesson03.teach.ek_kutta_do:
    title: Formele de plural
    gloss: Un câine, doi câini; o pisică, două pisici. Un substantiv masculin terminat în *-आ* face pluralul în *-ए* (*कुत्ता* → *कुत्ते*), iar un substantiv feminin terminat în *-ई* adaugă *-याँ* (*बिल्ली* → *बिल्लियाँ*).
    note: Modelul regulat al pluralului în hindi, prezentat aici pentru prima dată cu substantive care denumesc animale.
  hi.a1.unit32.lesson03.teach.kutte_billiyan:
    title: Câini și pisici
    gloss: câini / pisici
    example_gloss:
    - Lui Arjun îi plac câinii.
    - Nehei îi plac pisicile.
  hi.a1.unit32.lesson03.teach.machhliyan_chiriyan:
    title: Pești și păsări (plural)
    gloss: pești / păsări
    example_gloss:
    - Iubesc peștii.
    - Bunicul iubește păsările.
  hi.a1.unit32.lesson03.teach.mujhe_janvar_bahut:
    title: Iubesc animalele
    gloss: Iubesc animalele.
    note: '*मुझे जानवर बहुत पसंद हैं* („mie animalele îmi sunt foarte plăcute”) înseamnă „ador animalele”; *हैं* este la plural pentru că *जानवर* este la plural.'
