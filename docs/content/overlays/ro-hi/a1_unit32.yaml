    title: Arjun întreabă cum arată
    gloss: 'Arjun: Cum arată?'
    note: '*वह कैसा दिखता है?* se folosește și pentru animale, iar *कैसा* este masculin pentru că câinele este mascul.'
  hi.a1.unit32.lesson04.teach.priya_uske_bal:
