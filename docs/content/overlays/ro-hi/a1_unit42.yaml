    title: Nina află despre toți
    gloss: Nina este nouă la cafeneaua de limbi. Îl întreabă pe Arjun cum sunt ceilalți. Arjun îi povestește. Priya este bună la suflet și răbdătoare; lucrează ca asistentă medicală. Vikram este amuzant și urmează un curs de spaniolă. Neha este curioasă; îi place să învețe lucruri noi. Arjun însuși este calm.
