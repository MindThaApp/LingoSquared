teaching:
  hi.a1.unit30.lesson01.teach.parhna_kasrat_karna:
    title: Citit, sport, gătit
    gloss: a citi, a face sport, a găti
    note: 'În hindi, hobby-urile se exprimă printr-un verb terminat în *-ना*: *पढ़ना*, *कसरत करना* și *खाना बनाना* („a citi”, „a face sport”, „a găti”).'
    example_gloss:
    - Îmi place să citesc o carte.
    - Fac sport sâmbăta.
    - Îmi place să gătesc pentru prieteni.
  hi.a1.unit30.lesson01.teach.khalee_samay:
    title: Timpul liber
    gloss: timpul liber
    note: '*खाली समय* („timp gol”) este expresia-cheie pentru a vorbi despre hobby-uri, iar *में* înseamnă „în”: *खाली समय में*.'
    example_gloss: În timpul liber, îmi place să citesc.
  hi.a1.unit30.lesson01.teach.mujhe_khalee_samay:
    title: Spui ce faci în timpul liber
    gloss: În timpul liber, îmi place să citesc.
    note: '*मुझे ... पढ़ना पसंद है* („mie îmi este plăcut cititul”) este felul în care hindi spune „Îmi place să citesc”; *मुझे* arată cui îi place.'
  hi.a1.unit30.lesson02.teach.sangeet_sunna_chitr:
    title: Muzică, desen, jocuri video
    gloss: a asculta muzică, a desena, a juca jocuri video
    note: 'Încă trei hobby-uri: *संगीत सुनना*, *चित्र बनाना* și *गेम खेलना*; *गेम* este un cuvânt împrumutat din engleză.'
    example_gloss:
    - Îmi place să ascult muzică.
    - Desenez des.
    - Îmi place să joc jocuri video cu prietenii.
  hi.a1.unit30.lesson02.teach.mujhe_sangeet_sunna:
    title: Spui că îți place să asculți muzică
    gloss: Îmi place să ascult muzică.
    note: '*संगीत सुनना* („a asculta muzică”) nu cere niciun cuvânt în plus: complementul stă direct înaintea verbului.'
  hi.a1.unit30.lesson02.teach.mujhe_doston_ke:
    title: Spui că îți place să joci jocuri video cu prietenii
    gloss: Îmi place să joc jocuri video cu prietenii.
    note: În *दोस्तों के साथ* („cu prietenii”), *दोस्त* este la plural oblic (*दोस्तों*), pentru că stă înaintea lui *के साथ*.
  hi.a1.unit30.lesson03.teach.hamesha_aksar_kabheekbhee:
    title: Mereu, des, uneori, niciodată
    gloss: mereu, des, uneori, niciodată
    note: Cuvintele de frecvență precum *हमेशा*, *अक्सर*, *कभी-कभी* și *कभी नहीं* stau de obicei înaintea verbului, iar *कभी नहीं* înseamnă „niciodată”.
    example_gloss:
    - Fac mereu sport sâmbăta.
    - Citesc des o carte.
    - Desenez uneori.
    - Nu joc niciodată jocuri video.
  hi.a1.unit30.lesson03.teach.har_hafte_har:
    title: În fiecare săptămână, în fiecare weekend
    gloss: în fiecare săptămână, în fiecare weekend
    note: '*हर* („fiecare”) nu se schimbă niciodată, iar cuvântul de timp de după el rămâne la forma simplă: *हर हफ़्ते*, *हर वीकेंड*.'
    example_gloss:
    - Gătesc pentru prieteni în fiecare săptămână.
    - Fac sport în fiecare weekend.
  hi.a1.unit30.lesson03.teach.har_hafte_har_2:
    title: हर rămâne neschimbat
    gloss: În fiecare săptămână, în fiecare weekend.
    note: '*हर* rămâne neschimbat, indiferent de substantivul care îl urmează, deci nu trebuie să alegi nicio formă: *हर हफ़्ते*, *हर वीकेंड*.'
  hi.a1.unit30.lesson03.teach.tum_khalee_samay:
    title: Întrebi despre timpul liber
    gloss: Ce faci în timpul liber?
    note: Aceasta este întrebarea de bază a unității -- folosește-o ca să întrebi pe oricine despre hobby-uri.
  hi.a1.unit30.lesson04.teach.priya_ham_aksar:
    title: Priya aduce vorba despre hobby-uri
    gloss: 'Priya: Ne plimbăm des împreună. Dar tu, Arjun, ce altceva faci în timpul liber?'
    note: '*टहलते हैं* este la plural pentru că subiectul este *हम* („noi”), iar *अक्सर* stă înaintea verbului.'
  hi.a1.unit30.lesson04.teach.arjun_mujhe_khana:
    title: Hobby-urile lui Arjun
    gloss: 'Arjun: Îmi place să gătesc, și acasă. Și fac sport des.'
    note: '*घर पर भी* („și acasă”) arată că Arjun gătește și de plăcere, nu doar la serviciu.'
  hi.a1.unit30.lesson04.teach.priya_tum_ghar:
    title: Priya este surprinsă
    gloss: 'Priya: Gătești și acasă? Doar gătești toată ziua la serviciu!'
    note: '*पूरा दिन* („toată ziua”) subliniază cât gătește el deja la serviciu, iar *तो* adaugă emfază.'
  hi.a1.unit30.lesson04.teach.arjun_han_lekin:
    title: Arjun explică
    gloss: 'Arjun: Da, dar pe mine gătitul mă relaxează. Și tu, ce îți place să faci?'
    note: '*खाना बनाने से सुकून मिलता है* înseamnă „gătitul mă relaxează” (literal „din gătit se primește liniște”); *बनाना* devine *बनाने* înaintea lui *से*.'
  hi.a1.unit30.lesson04.teach.priya_mujhe_parhna:
    title: Hobby-urile Priyei
    gloss: 'Priya: Îmi place să citesc și ascult des muzică.'
    note: '*और* („și”) leagă două hobby-uri, iar *सुनती हूँ* este la feminin pentru că vorbește Priya.'
  hi.a1.unit30.lesson04.teach.arjun_kya_tum:
    title: Arjun întreabă despre jocurile video
    gloss: 'Arjun: Joci și tu jocuri video?'
    note: 'O întrebare scurtă cu da/nu: începe cu *क्या*, iar *खेलती हो* este la feminin pentru că Arjun o întreabă pe Priya.'
  hi.a1.unit30.lesson04.teach.priya_naheen_main:
    title: Priya răspunde
    gloss: 'Priya: Nu, nu joc niciodată jocuri video. Dar uneori desenez!'
    note: '*कभी ... नहीं* („niciodată”) și *कभी-कभी* („uneori”) sunt puse în contrast într-un singur răspuns.'
  hi.a1.unit30.lesson05.teach.arjun_aur_main:
    title: Comparăm hobby-urile
    gloss: Arjun și cu mine ne plimbăm des împreună. Dar avem și alte hobby-uri. Lui Arjun îi place să gătească, și acasă, și face des sport. Mie îmi place să citesc și ascult des muzică. Uneori desenez, dar nu joc niciodată jocuri video. Tu ce îți place să faci în timpul liber?
    note: Mesajul Priyei reia ce ai învățat în lecțiile anterioare și se încheie cu întrebarea centrală a unității.
    glosses:
      टहलते: a se plimba
      अक्सर: des
      साथ: împreună
      और: alte
      बनाना: a face (a găti)
      पसंद: cu plăcere
      घर: acasă
      कसरत: face sport
      पढ़ना: citesc
      सुनती: ascult
      संगीत: muzică
      चित्र: imagine (desen)
      कभी-कभी: uneori
      गेम: joc jocuri video
      कभी: niciodată (cu नहीं)
      खाली: liber
      समय: timp
  hi.a1.unit30.lesson06.teach.arjun_tum_is:
    title: Arjun întreabă despre weekend
    gloss: 'Arjun: Ce faci în weekendul acesta?'
    note: În *इस वीकेंड* („în weekendul acesta”), *इस* stă înaintea substantivului, iar *कर रही हो* este forma durativă „faci”, la feminin pentru că i te adresezi Priyei.
  hi.a1.unit30.lesson06.teach.priya_abhee_pata:
    title: Priya nu s-a hotărât
    gloss: 'Priya: Încă nu știu. Îmi place să citesc, dar vreau să ies și afară.'
    note: '*बाहर जाना चाहती हूँ* înseamnă „vreau să ies afară”; *चाहती* este la feminin și stă după *जाना*.'
  hi.a1.unit30.lesson06.teach.arjun_chalo_sath:
    title: Arjun propune un plan
    gloss: 'Arjun: Ne plimbăm împreună? După aceea gătesc eu pentru noi.'
    note: '*उसके बाद* („după aceea”) pune cele două planuri în ordine, iar *चलो ... टहलें* îl propune pe primul.'
  hi.a1.unit30.lesson06.teach.priya_achchha_aidiya:
    title: Priya e de acord
    gloss: 'Priya: Idee bună! Îmi place și să mă plimb, și să gătesc.'
    note: '*दोनों पसंद हैं* arată că Priyei îi plac amândouă în egală măsură, iar verbul este la plural, *हैं*.'
  hi.a1.unit30.lesson06.teach.arjun_barhiya_to:
    title: Arjun confirmă
    gloss: 'Arjun: Perfect. Atunci ne vedem sâmbătă!'
    note: '*शनिवार को मिलते हैं* („ne întâlnim sâmbătă”) folosește prezentul pentru un plan stabilit, iar *को* marchează ziua.'
