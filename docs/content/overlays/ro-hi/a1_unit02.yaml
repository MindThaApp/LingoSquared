    title: Numerele
lessons:
  hi.a1.unit02.lesson01.numbers_zero_to_ten:
    title: Numerele de la zero la zece
  hi.a1.unit02.lesson02.numbers_and_prices:
    title: Numerele de la unsprezece la o sută și prețurile
  hi.a1.unit02.lesson03.phone_and_age:
    title: Numărul de telefon și vârsta
teaching:
  hi.a1.unit02.lesson01.teach.shoonya:
    title: Zero
    gloss: zero
    note: Punctul de plecare pentru toate numerele din această unitate.
    example_gloss: Astăzi temperatura este zero.
  hi.a1.unit02.lesson01.teach.ek:
    title: Unu
    gloss: unu
    note: În hindi, numerele de la 11 la 99 sunt cuvinte aparte, nu se formează după tiparul „zece + unu” ca în română (unsprezece, douăzeci); vei vedea asta în lecția 2, unde बीस (20) și तीस (30) nu au nicio parte vizibilă în comun cu एक (1) sau दो (2).
    example_gloss: Am o carte.
  hi.a1.unit02.lesson01.teach.do:
    title: Doi
    gloss: doi
    note: Un număr simplu și foarte frecvent; este și imperativul informal al lui „a da” („dă”), dar contextul lămurește mereu sensul.
    example_gloss: Am doi frați.
  hi.a1.unit02.lesson01.teach.teen:
    title: Trei
    gloss: trei
    note: '*Chahiye* („este necesar”) este o construcție impersonală frecventă: *mujhe teen seb chahiye* înseamnă literal „mie trei mere [este] necesar” – un mod foarte natural de a spune „am nevoie”.'
    example_gloss: Am nevoie de trei mere.
  hi.a1.unit02.lesson01.teach.chaar:
    title: Patru
    gloss: patru
    note: Nicio neregularitate aici – chaar se comportă ca orice alt număr mic.
    example_gloss: Am patru prieteni.
  hi.a1.unit02.lesson01.teach.paanch:
    title: Cinci
    gloss: cinci
    note: Se scrie cu chandrabindu (पाँच), nu cu anusvara – semnul vocalic aa (ा) nu se ridică deasupra literei, de aceea se folosește chandrabindu în loc de un simplu punct, același tipar ca în हाँ/कहाँ din unitatea 1.
    example_gloss: Am cinci rupii.
  hi.a1.unit02.lesson01.teach.chhah:
    title: Șase
    gloss: șase
    note: În texte mai vechi se scrie uneori și छः; छह este ortografia modernă standard.
    example_gloss: Am șase cărți.
  hi.a1.unit02.lesson01.teach.saat:
    title: Șapte
    gloss: șapte
    note: Un număr util pentru a vorbi despre zilele săptămânii.
    example_gloss: O săptămână are șapte zile.
  hi.a1.unit02.lesson01.teach.aath:
    title: Opt
    gloss: opt
    note: Nicio neregularitate – aath se comportă ca orice alt număr mic.
    example_gloss: În camera aceasta sunt opt scaune.
  hi.a1.unit02.lesson01.teach.nau:
    title: Nouă
    gloss: nouă
    note: Aici nu e nevoie de semn de nazalizare, spre deosebire de unele numere vecine.
    example_gloss: Cursul de yoga începe la ora nouă dimineața.
  hi.a1.unit02.lesson01.teach.das:
    title: Zece
    gloss: zece
    note: Ultimul număr din primul set – lecția 2 continuă cu numerele de după zece și cu zecile, care de aici încolo nu se mai pot deduce.
    example_gloss: Am zece degete la mâini.
  hi.a1.unit02.lesson02.teach.gyaarah:
    title: Unsprezece
    gloss: unsprezece
    note: De aici încolo, numerele hindi sunt cuvinte aparte, neregulate – gyaarah nu conține vizibil das (10) sau ek (1), spre deosebire de românescul „unsprezece”, în care se recunosc „unu” și „zece”. Nu există scurtături; fiecare număr trebuie învățat separat.
    example_gloss: În clasa aceasta sunt unsprezece elevi.
  hi.a1.unit02.lesson02.teach.baarah:
    title: Doisprezece
    gloss: doisprezece
    note: Încă un număr de memorat – niciun tipar previzibil nu îl leagă de do (2).
    example_gloss: Un an are douăsprezece luni.
  hi.a1.unit02.lesson02.teach.pandrah:
    title: Cincisprezece
    gloss: cincisprezece
    note: Des folosit pentru intervale scurte de timp, de exemplu o pauză de cincisprezece minute.
    example_gloss: Am nevoie de cincisprezece minute.
  hi.a1.unit02.lesson02.teach.bees:
    title: Douăzeci
    gloss: douăzeci
    note: Un cuvânt cu adevărat nou, nu o combinație de das (10) și do (2) – acesta este tiparul care continuă la toate zecile de aici încolo.
    example_gloss: Sora mea are douăzeci de ani.
  hi.a1.unit02.lesson02.teach.tees:
    title: Treizeci
    gloss: treizeci
    note: Din nou un cuvânt aparte – seamănă puțin cu teen (3), dar nu poate fi format din teen plus das, așa că învață-l separat.
    example_gloss: Biletul costă treizeci de rupii.
  hi.a1.unit02.lesson02.teach.pachaas:
    title: Cincizeci
    gloss: cincizeci
    note: Un număr rotund foarte folosit, mai ales la prețuri.
    example_gloss: Am cincizeci de rupii.
  hi.a1.unit02.lesson02.teach.sau:
    title: O sută
    gloss: o sută
    note: Un număr rotund simplu, extrem de frecvent în prețurile de zi cu zi.
    example_gloss: Cartea aceasta costă o sută de rupii.
  hi.a1.unit02.lesson02.teach.keemat:
    title: Prețul
    gloss: preț; cost
    note: '*Keemat* este un substantiv feminin – posesivul lui ia mereu forma feminină (*iski keemat*, „prețul lui/ei”), indiferent de obiectul al cărui preț se cere.'
    example_gloss: Care este prețul acestui bilet?
  hi.a1.unit02.lesson02.teach.rupaye:
    title: Rupii
    gloss: rupii
    note: '*Rupaya* este forma de singular (folosită pentru exact o rupie); *rupaye* se folosește pentru orice sumă mai mare.'
    example_gloss: Acesta costă cincizeci de rupii.
  hi.a1.unit02.lesson02.teach.iski_keemat_kya_hai:
    title: Întrebarea despre preț
    gloss: Care este prețul lui?
    note: '*Iski* („al lui/al ei”) se acordă cu substantivul feminin *keemat* („preț”), nu cu obiectul al cărui preț se cere – același tip de acord al posesivului introdus în unitatea 1 cu *mera naam*.'
  hi.a1.unit02.lesson02.teach.iski_keemat_pachaas_rupaye_hai:
    title: Spui un preț
    gloss: Prețul lui este cincizeci de rupii.
    note: Răspunsul complet, natural, la Iski keemat kya hai?
  hi.a1.unit02.lesson03.teach.aapka_phone_number_kya_hai:
    title: Cere formal un număr de telefon
    gloss: Care este numărul dumneavoastră de telefon? (formal)
    note: '*Number* (नंबर) este un împrumut din limba engleză, folosit constant în hindi-ul de zi cu zi. *Aapka* se acordă cu substantivul masculin *number*.'
  hi.a1.unit02.lesson03.teach.tumhara_phone_number_kya_hai:
    title: Întrebi numărul de telefon, informal
    gloss: Care este numărul tău de telefon? (informal)
    note: Tumhara înlocuiește aapka când vorbești cu un prieten sau cu un egal, ca în unitatea 1.
  hi.a1.unit02.lesson03.teach.mera_number:
    title: Cum anunți un număr
    gloss: Numărul meu este...
    note: Un mod natural de a introduce numărul înainte de a citi cifrele pe rând.
  hi.a1.unit02.lesson03.teach.sample_number:
    title: Un exemplu de număr de telefon
    gloss: Șase, doi, opt, trei, cinci.
    note: Numerele de telefon în hindi se citesc cifră cu cifră – toate cifrele de aici au fost deja învățate în lecția 1.
  hi.a1.unit02.lesson03.teach.aapki_umra_kya_hai:
    title: Întrebi vârsta cuiva, formal
    gloss: Care este vârsta dumneavoastră? (formal)
    note: '*Umra* („vârstă”) este un substantiv feminin, deci *aapki* ia aici forma feminină – același tipar de acord ca la *iski keemat*, acum aplicat vârstei unei persoane, nu unui preț.'
  hi.a1.unit02.lesson03.teach.tumhari_umra_kya_hai:
    title: Întrebi vârsta cuiva, informal
    gloss: Care este vârsta ta? (informal)
    note: Tumhari înlocuiește aapki când vorbești cu un prieten sau cu un egal.
  hi.a1.unit02.lesson03.teach.meri_umra_tees_saal_hai:
    title: Spui câți ani ai
    gloss: Vârsta mea este de treizeci de ani.
    note: '*Meri* se acordă cu *umra* (feminin), niciodată cu genul vorbitorului – spre deosebire de formele verbale *chahta/chahti* din unitatea 1, acest posesiv nu se schimbă, indiferent cine vorbește.'
  hi.a1.unit02.lesson03.teach.dialogue.line01:
    title: Arjun îi cere numărul Priyei
    gloss: Arjun o roagă informal pe Priya să-i dea numărul ei de telefon.
    note: Reia exact întrebarea informală despre numărul de telefon din această lecție.
  hi.a1.unit02.lesson03.teach.dialogue.line02:
    title: Priya își spune numărul și întreabă la rândul ei
    gloss: Priya își citește numărul de telefon, cifră cu cifră, apoi îl întreabă pe al lui Arjun.
    note: Toate cifrele de aici au fost deja învățate în lecția 1 din această unitate.
  hi.a1.unit02.lesson03.teach.dialogue.line03:
    title: Arjun își spune numărul
    gloss: Arjun își citește propriul număr de telefon.
    note: Din nou, toate cifrele reiau vocabularul din lecția 1.
  hi.a1.unit02.lesson03.teach.dialogue.line04:
    title: Priya îl întreabă câți ani are Arjun
    gloss: Priya îi mulțumește și îl întreabă informal ce vârstă are.
    note: Shukriya („mulțumesc”) nu se schimbă după nivelul de politețe, la fel ca cardul shukriya din unitatea 1.
  hi.a1.unit02.lesson03.teach.dialogue.line05:
    title: Arjun își spune vârsta și întreabă la rândul lui
    gloss: Arjun spune că are douăzeci de ani, apoi o întreabă pe Priya ce vârstă are.
    note: Tumhari? spus singur este un mod scurt și natural de a întoarce întrebarea.
  hi.a1.unit02.lesson03.teach.dialogue.line06:
    title: Priya își spune vârsta
    gloss: Priya spune că are treizeci de ani.
    note: Meri umra tees saal hai reia exact tiparul de propoziție învățat mai devreme în această lecție.
  hi.a1.unit02.lesson03.teach.dialogue.line07:
    title: Arjun încheie conversația
    gloss: Arjun reacționează pozitiv și spune că se vor revedea.
    note: Accha și phir milenge reiau vocabularul de rămas-bun din unitatea 1.
  hi.a1.unit02.lesson03.teach.dialogue.line08:
    title: Priya încheie conversația
    gloss: Priya este de acord și spune un „pe curând” informal.
    note: Theek hai și phir milte hain reiau vocabularul de rămas-bun din unitatea 1.
