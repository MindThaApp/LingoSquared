lessons:
  hi.a1.unit14.lesson01.se_tulna:
    title: Priya este mai mare decât Arjun
  hi.a1.unit14.lesson02.vastu_tulna:
    title: Pălăria este mai ieftină decât geanta
  hi.a1.unit14.lesson03.arjun_priya_tulna:
    title: 'Arjun și Priya: comparații'
teaching:
  hi.a1.unit14.lesson01.teach.arjun_priya_review:
    title: 'Recapitulare: Arjun, Priya, este'
    gloss: Arjun, Priya, este
    note: O scurtă recapitulare a numelor celor două personaje și a verbului „hai” („este”), necesare pentru a construi propoziții comparative în această unitate.
    example_gloss:
    - Arjun este bine.
    - Priya este bine.
  hi.a1.unit14.lesson01.teach.bada_badi_review:
    title: 'Recapitulare: mare / mai în vârstă'
    gloss: mare / mai în vârstă (masculin / feminin)
    note: Predat prima dată în unitatea 5 pentru vârsta fraților -- această unitate îl extinde la compararea directă a oricăror două persoane sau lucruri.
    example_gloss:
    - Fratele meu mai mare locuiește în Delhi.
    - Sora mea mai mare locuiește în Delhi.
  hi.a1.unit14.lesson01.teach.chota_choti_review:
    title: 'Recapitulare: mic / mai tânăr'
    gloss: mic / mai tânăr (masculin / feminin)
    note: Predat prima dată în unitatea 5 pentru vârsta fraților -- folosit aici în același fel ca bada/badi.
    example_gloss:
    - Fratele meu mai mic este acum student.
    - Sora mea mai mică este acum studentă.
  hi.a1.unit14.lesson01.teach.se_comparative_grammar:
    title: Se = decât
    gloss: '„Se” a fost învățat deja cu sensul „din / de la” (unitatea 9, „yahan se seedhe jao”) și „cu” (unitatea 12, „Priya se mila”). Acum exprimă și comparația: „X, Y se ADJ hai” înseamnă „X este mai ADJ decât Y” -- ca în „Priya Arjun se badi hai”.'
    note: Prezintă al treilea sens al unui cuvânt deja învățat, amintind ambele sensuri anterioare cu numărul unității, înainte de cel nou.
    target_text: '''से'' पहले ''यहाँ से सीधे जाओ'' (यूनिट 9, matlab ''from'') और ''प्रिया से मिला'' (यूनिट 12, matlab ''with'') में सीखा था; अब यह तुलना के लिए भी आता है: ''X, Y से ADJ है'' का मतलब है ''X is more ADJ than Y'' -- जैसे ''प्रिया अर्जुन से बड़ी है''।'
  hi.a1.unit14.lesson01.teach.arjun_bada_phrase:
    title: Priya este mai mare decât Arjun.
    gloss: Priya este mai mare decât Arjun.
    note: Primul exemplu complet al structurii comparative cu se.
  hi.a1.unit14.lesson01.teach.lamba_lambi:
    title: Înalt / lung
    gloss: înalt / lung (masculin / feminin)
    note: O nouă pereche de adjective, care urmează modelul de acord deja cunoscut -a/-i pentru masculin/feminin (bada/badi, chota/choti).
    example_gloss:
    - Fratele meu este înalt.
    - Sora mea este înaltă.
  hi.a1.unit14.lesson01.teach.agreement_grammar:
    title: Adjectivul se acordă cu subiectul
    gloss: Într-o propoziție de comparație, adjectivul (precum bada/badi, chota/choti) se acordă întotdeauna în gen cu SUBIECTUL, nu cu cuvântul de după „se”. De exemplu, în „Arjun Priya se chota hai”, „chota” se acordă cu Arjun (subiectul masculin), nu cu Priya.
    note: O extindere directă și explicită a modelului de acord al adjectivelor în -a/-i, aplicată aici propozițiilor de comparație.
    target_text: तुलना के वाक्य में विशेषण (जैसे बड़ा/बड़ी, छोटा/छोटी) हमेशा विषय (subject) के लिंग से मेल खाता है, 'से' के बाद वाले शब्द के नहीं -- जैसे 'अर्जुन प्रिया से छोटा है' में 'छोटा' अर्जुन (पुल्लिंग विषय) से मेल खाता है, प्रिया से नहीं।
  hi.a1.unit14.lesson01.teach.priya_chota_phrase:
    title: Arjun este mai tânăr decât Priya.
    gloss: Arjun este mai tânăr decât Priya.
    note: Aceeași informație, privită din partea opusă; arată acordul adjectivului cu un subiect masculin.
  hi.a1.unit14.lesson01.teach.kaun_ya_review:
    title: 'Recapitulare: cine, sau'
    gloss: cine, sau
    note: Ambele cuvinte au fost învățate deja (unitatea 5 și unitățile 6/13); aici sunt reluate pentru o întrebare de comparație.
    example_gloss: Cine este mai în vârstă, Arjun sau Priya?
  hi.a1.unit14.lesson02.teach.topi_bag_review:
    title: 'Recapitulare: pălărie, geantă'
    gloss: pălărie, geantă
    note: Ambele substantive au fost învățate în unitatea 7, cea despre cumpărături; aici sunt cele două lucruri comparate.
    example_gloss:
    - Această pălărie este frumoasă.
    - Această geantă este frumoasă.
  hi.a1.unit14.lesson02.teach.sasta_mehnga_review:
    title: 'Recapitulare: ieftin, scump'
    gloss: ieftin, scump
    note: Învățate în unitatea 7; aici sunt reluate pentru a compara obiecte.
    example_gloss:
    - Geanta este ieftină.
    - Geanta este scumpă.
  hi.a1.unit14.lesson02.teach.sasti_mehngi_note:
    title: 'Forme de feminin: sasti, mehngi'
    gloss: „Sasta” și „mehnga” devin „sasti” și „mehngi” pe lângă cuvintele feminine, de exemplu „topi sasti hai” (pălăria este ieftină).
    note: O scurtă reamintire a regulii de acord în gen din unitatea 7, necesară deoarece „topi” (pălărie) este feminin.
  hi.a1.unit14.lesson02.teach.se_object_phrase:
    title: Pălăria este mai ieftină decât geanta.
    gloss: Pălăria este mai ieftină decât geanta.
    note: Structura comparativă cu „se”, aplicată la două obiecte, nu la două persoane.
  hi.a1.unit14.lesson02.teach.zyada_review:
    title: 'Recapitulare: mai mult'
    gloss: mai mult
    note: Învățat în unitatea 13 doar cu „pasand hai” (pentru a exprima o preferință); această lecție îi extinde utilizarea.
    example_gloss: Îmi place mai mult ceaiul.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_grammar:
    title: Zyada în orice comparație
    gloss: '„Zyada” a fost învățat până acum doar cu „pasand hai” (unitatea 13). Acum poate sta și înaintea ORICĂRUI adjectiv dintr-o comparație: „bag topi se zyada mehnga hai” înseamnă „geanta este mai scumpă decât pălăria”, exact ca „bag topi se mehnga hai”. „Zyada” este opțional; doar spune explicit „mai”.'
    note: O generalizare explicită a regulii de așezare a unui cuvânt deja învățat, nu un punct nou de gramatică.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_phrase:
    title: Geanta este mai scumpă decât pălăria.
    gloss: Geanta este mai scumpă decât pălăria.
    note: Aceeași structură comparativă cu „se”, cu „zyada” (mai) exprimat explicit.
  hi.a1.unit14.lesson02.teach.naya_nai:
    title: Nou
    gloss: nou / nouă (masculin / feminin)
    note: O pereche nouă de adjective, care urmează același model de acord în -a/-i ca toate celelalte adjective din această unitate.
    example_gloss:
    - Geanta este nouă.
    - Pălăria este nouă.
  hi.a1.unit14.lesson02.teach.topi_nai_phrase:
    title: Pălăria este mai nouă decât geanta.
    gloss: Pălăria este mai nouă decât geanta.
    note: O a doua însușire comparată (vechimea) între aceleași două obiecte, în continuarea comparației de preț.
  hi.a1.unit14.lesson03.teach.review_words:
    title: 'Recapitulare: mare, mic, înalt, nou'
    gloss: mare/mai în vârstă, mic/mai tânăr, înalt/lung, nou
    note: O scurtă recapitulare a adjectivelor principale ale unității, necesare pentru dialog și pentru textul de citit.
    example_gloss:
    - Priya este mai în vârstă.
    - Arjun este mai tânăr.
    - Arjun este înalt.
    - Geanta este nouă.
  hi.a1.unit14.lesson03.teach.main_hun_review:
    title: 'Recapitulare: eu, sunt'
    gloss: eu, sunt
    note: Învățat în unitatea 1 („main theek hun”); necesar pentru ca Arjun să vorbească despre sine în dialog.
    example_gloss: Sunt bine.
  hi.a1.unit14.lesson03.teach.aur_bhi_review:
    title: 'Recapitulare: și, de asemenea'
    gloss: și, de asemenea
    note: Ambele cuvinte au apărut în dialoguri anterioare, dar aici sunt introduse pentru prima dată oficial ca vocabular de testat.
    example_gloss:
    - Îmi plac ceaiul și cafeaua.
    - Și mie îmi place.
  hi.a1.unit14.lesson03.teach.ka_review:
    title: 'Recapitulare: marca posesivă'
    gloss: marca posesivă (al/a/ai/ale lui)
    note: Marca posesivă folosită deja pe parcursul cursului (de exemplu în unitățile 5-11); aici este reluată pentru a spune a cui este geanta comparată.
    example_gloss: Geanta lui Arjun este nouă.
  hi.a1.unit14.lesson03.teach.dialogue.line01:
    title: Arjun își arată geanta nouă
    gloss: Priya, aceasta este geanta mea nouă.
  hi.a1.unit14.lesson03.teach.dialogue.line02:
    title: Priya spune că pălăria este mai ieftină
    gloss: Geantă frumoasă! Dar pălăria este mai ieftină decât geanta.
  hi.a1.unit14.lesson03.teach.dialogue.line03:
    title: Arjun recunoaște că geanta lui este scumpă
    gloss: 'Da. Geanta mea este scumpă: este mai scumpă decât o pălărie.'
  hi.a1.unit14.lesson03.teach.dialogue.line04:
    title: Priya întreabă cine este mai în vârstă
    gloss: Bine, bine! Arjun, cine este mai în vârstă, tu sau eu?
  hi.a1.unit14.lesson03.teach.dialogue.line05:
    title: Răspunsul lui Arjun
    gloss: Tu ești mai în vârstă, dar eu sunt înalt!
  hi.a1.unit14.lesson03.teach.dialogue.line06:
    title: Priya spune că pălăria este și mai nouă
    gloss: Bine, bine! Dar pălăria este și mai nouă decât geanta.
  hi.a1.unit14.lesson03.teach.dialogue.line07:
    title: Arjun este de acord și încheie
    gloss: Da, e adevărat. Ne vedem și mâine?
  hi.a1.unit14.lesson03.teach.dialogue.line08:
    title: Priya încheie
    gloss: Bine! Ne vedem mâine.
  hi.a1.unit14.lesson03.teach.grammar_summary:
    title: Trei reguli principale
    gloss: 'Cele trei reguli principale ale unității: (1) „X, Y se ADJ hai” înseamnă „X este mai ADJ decât Y”; (2) ADJ se acordă întotdeauna în gen cu subiectul (X), nu cu Y; (3) înaintea lui ADJ se poate adăuga și „zyada”, de exemplu „X, Y se zyada ADJ hai”; sensul rămâne același („mai ADJ decât”).'
    note: Un rezumat final care leagă gramatica întregii unități, la fel ca nota de gramatică din unitatea 13, care reunea paradigma.
    target_text: 'इस यूनिट के तीन मुख्य नियम: (1) ''X, Y से ADJ है'' का मतलब है ''X is more ADJ than Y''; (2) ADJ हमेशा विषय (X) के लिंग से मेल खाता है, Y से नहीं; (3) ADJ से पहले ''ज़्यादा'' भी जोड़ सकते हैं, जैसे ''X, Y से ज़्यादा ADJ है'' -- मतलब वही रहता है (''more ADJ than'')।'
  hi.a1.unit14.lesson03.teach.priya_note:
    title: Biletul Priyei
    gloss: 'Sunt mai în vârstă decât Arjun, dar Arjun este înalt. Iar pălăria mea este frumoasă: pălăria este mai ieftină decât geanta și, în plus, este mai nouă decât geanta. - Priya'
    note: Un bilet scurt care reia exact faptele stabilite deja în dialog, fără afirmații noi.
    glosses:
      बड़ी: mai în vârstă (feminin)
      लंबा: înalt
      टोपी: pălărie
      अच्छी: frumoasă / bună (feminin)
      बैग: geantă
      सस्ती: mai ieftină / ieftină (feminin)
      नई: mai nouă / nouă (feminin)
