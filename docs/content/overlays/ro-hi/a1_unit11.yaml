units:
  hi.a1.unit11.plans:
    title: Facem planuri
lessons:
  hi.a1.unit11.lesson01.prastaav_aur_sweekriti:
    title: Ne uităm la un film, bem ceai
  hi.a1.unit11.lesson02.hum_kab_milte_hain:
    title: Când ne întâlnim?
  hi.a1.unit11.lesson03.priya_arjun_yojana:
    title: 'Priya și Arjun: un plan'
teaching:
  hi.a1.unit11.lesson01.teach.review_chai_kaafi:
    title: 'Recapitulare: ceai, cafea'
    gloss: ceai, cafea
    note: O scurtă recapitulare a cuvintelor pentru băuturi din unitatea 6 -- în această unitate le refolosim ca să propunem planuri.
    example_gloss:
    - Vreau ceai.
    - Vreau cafea.
  hi.a1.unit11.lesson01.teach.filma:
    title: Film
    gloss: film
    note: 'Un substantiv nou pentru tema acestei unități: a face planuri.'
    example_gloss: Filmul acesta este bun.
  hi.a1.unit11.lesson01.teach.dekhna:
    title: Ne uităm / să ne uităm
    gloss: (noi) ne uităm / să ne uităm
    note: Forma de plural pentru acțiuni obișnuite a verbului „dekhna” (a se uita, a privi), folosită aici pentru a propune o activitate în comun.
    example_gloss: Ne uităm la un film.
  hi.a1.unit11.lesson01.teach.chalo_film_phrase:
    title: Hai să ne uităm la un film!
    gloss: Hai să ne uităm la un film!
    note: „Chalo” + un verb la forma de plural obișnuit este modul uzual de a propune să faceți ceva împreună -- l-ai întâlnit deja, fără să fie explicat, în unitățile 1, 6 și 7 („chalo shuru karte hain”, „chalo, kuch khaate hain”, „chalo, kuch khareedte hain”); această unitate formalizează și extinde tiparul.
  hi.a1.unit11.lesson01.teach.saath:
    title: Împreună
    gloss: împreună
    note: Se folosește pentru a propune o activitate făcută împreună.
    example_gloss: Hai să ne uităm împreună la un film!
  hi.a1.unit11.lesson01.teach.peena:
    title: Bem / să bem
    gloss: (noi) bem / să bem
    note: Forma de plural pentru acțiuni obișnuite a verbului „peena” (a bea), același tipar ca la „dekhte hain”.
    example_gloss: Bem ceai.
  hi.a1.unit11.lesson01.teach.chalo_chai_phrase:
    title: Hai să bem ceai împreună!
    gloss: Hai să bem ceai împreună!
    note: Combină „saath” și „peete hain” din această lecție într-o a doua propunere, cu același tipar „chalo” ca la propunerea cu filmul.
  hi.a1.unit11.lesson01.teach.chalo_grammar_note:
    title: Chalo + verb-te + hain = Hai să ___
    gloss: 'Ca să propui să faceți ceva împreună, spune „chalo” + verb-te + hain: Hai să ne uităm la un film! Hai să bem ceai împreună!'
    note: Enunță tiparul complet, formalizând ceea ce a apărut deja întâmplător de trei ori în unitățile anterioare.
  hi.a1.unit11.lesson01.teach.achha_vichar:
    title: Bună idee!
    gloss: Bună idee!
    note: Un mod gata de folosit de a accepta cu entuziasm o propunere.
  hi.a1.unit11.lesson02.teach.vyast:
    title: Ocupat
    gloss: ocupat
    note: Un adjectiv nou, folosit cu copula deja cunoscută (hoon/ho/hai) pentru a spune că nu ești disponibil.
    example_gloss: Azi sunt ocupat.
  hi.a1.unit11.lesson02.teach.maaf_karna:
    title: Îmi pare rău / scuze
    gloss: îmi pare rău / scuze
    note: O expresie politicoasă fixă, folosită pentru a îndulci un refuz.
    example_gloss: Îmi pare rău, sunt ocupat.
  hi.a1.unit11.lesson02.teach.maaf_vyast_phrase:
    title: Îmi pare rău, sunt ocupat.
    gloss: Îmi pare rău, sunt ocupat.
    note: Propoziția de bază pentru refuz, care combină cele două expresii noi din această lecție.
  hi.a1.unit11.lesson02.teach.mujhe_kaam_hai:
    title: Am de lucru.
    gloss: Am de lucru.
    note: Reia tiparul „mujhe...hai” („am...”), asemănător cu „mujhe...chahiye” („vreau/am nevoie de”) învățat mai înainte; aici oferă un motiv pentru refuz.
  hi.a1.unit11.lesson02.teach.decline_grammar_note:
    title: Cum refuzi politicos
    gloss: Ca să refuzi politicos un plan, spune „maaf karna” (îmi pare rău), apoi situația ta (de ex. „sunt ocupat”) sau un motiv (de ex. „am de lucru”).
    note: Refolosește intenționat gramatica deja învățată (copula și tiparul posesiei cu dativ), în loc să introducă o construcție nouă pentru „a putea”.
  hi.a1.unit11.lesson02.teach.hum_pronoun:
    title: Noi
    gloss: noi
    note: 'Primul pronume formal de persoana I plural din curs. Forma verbului pentru acțiuni obișnuite (-te + hain) este aceeași ca la ve (ei/ele) -- nu apare o conjugare nouă, doar un pronume nou. (Și tum cere -te, dar cu „ho”: tum milte ho.)'
    example_gloss: Ne întâlnim în fiecare zi.
  hi.a1.unit11.lesson02.teach.kab_milte_phrase:
    title: Când ne întâlnim?
    gloss: Când ne întâlnim?
    note: Combină „hum” cu „kab” (unitatea 10) și „milte hain” (folosit încă din formulele de încheiere din unitatea 1, unde subiectul era de obicei omis).
  hi.a1.unit11.lesson02.teach.din_review:
    title: 'Recapitulare: sâmbătă, duminică'
    gloss: Sâmbătă, duminică
    note: O scurtă recapitulare a două nume de zile ale săptămânii din unitatea 3, necesare pentru a stabili un plan.
    example_gloss:
    - Astăzi este sâmbătă.
    - Mâine este duminică.
  hi.a1.unit11.lesson02.teach.samay_review:
    title: 'Recapitulare: ora 4, cât este ceasul'
    gloss: ora 4, ce oră
    note: O scurtă recapitulare a expresiilor pentru oră din unitatea 4, necesare pentru a stabili un plan.
    example_gloss:
    - Acum este ora 4.
    - Cât este ceasul acum?
  hi.a1.unit11.lesson02.teach.kya_ravivar_thik_phrase:
    title: Duminica e bine?
    gloss: Duminica e bine?
    note: Reia „क्या” ca marcă a întrebărilor cu răspuns da/nu, introdusă încă din unitatea 1 („kya yeh tumhari pahli baar hai?”, „kya tum yoga karti ho?”), în loc de un nou interogativ pentru „ce zi”.
  hi.a1.unit11.lesson03.teach.sandesh:
    title: Mesaj
    gloss: mesaj
    note: Substantiv nou, folosit în partea lecției despre invitația scrisă.
    example_gloss: Acesta este mesajul lui Arjun.
  hi.a1.unit11.lesson03.teach.dialogue.line01:
    title: Arjun propune un film sâmbătă
    gloss: Priya, hai să vedem un film sâmbătă?
  hi.a1.unit11.lesson03.teach.dialogue.line02:
    title: Priya refuză și își explică motivul
    gloss: Îmi pare rău, sâmbătă sunt ocupată. Am de lucru.
  hi.a1.unit11.lesson03.teach.dialogue.line03:
    title: Arjun întreabă când se pot întâlni
    gloss: Bine. Când ne întâlnim?
  hi.a1.unit11.lesson03.teach.dialogue.line04:
    title: Priya propune în schimb duminica
    gloss: Duminica e bine? Hai să bem un ceai împreună!
  hi.a1.unit11.lesson03.teach.dialogue.line05:
    title: Arjun acceptă și întreabă ora
    gloss: Bună idee! La ce oră duminică?
  hi.a1.unit11.lesson03.teach.dialogue.line06:
    title: Priya sugerează o oră
    gloss: La ora 4 e bine?
  hi.a1.unit11.lesson03.teach.dialogue.line07:
    title: Arjun confirmă
    gloss: Da, la ora 4 e bine. Ne vedem atunci!
  hi.a1.unit11.lesson03.teach.dialogue.line08:
    title: Priya încheie discuția
    gloss: Bine, ne vedem duminică!
  hi.a1.unit11.lesson03.teach.invitation_message:
    title: Mesajul Priyei
    gloss: Salut, Arjun, hai să ne întâlnim duminică la 4 și să bem un ceai. Bine? - Priya
    note: O scurtă invitație scrisă, care reia planul tocmai confirmat în dialog.
    glosses:
      चलो: hai să
      रविवार: duminică
      मिलते: a se întâlni (de la मिलना)
      चाय: ceai
      पीते: a bea (de la पीना)
      ठीक: bine / în regulă
