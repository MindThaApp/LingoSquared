    - मैं ठीक हूं, शुक्रिया।
    - मैं ठीक हूँ, शुक्रिया। और आप?
    - मैं ठीक हूँ, शुक्रिया, और आप?
    - मैं ठीक हूं, शुक्रिया। और आप?
    - मैं ठीक हूं, शुक्रिया, और आप?
  hi.a1.unit01.lesson01.exercise10.speak_informally:
