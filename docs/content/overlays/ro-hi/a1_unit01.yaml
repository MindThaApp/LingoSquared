  hi.a1.unit01.lesson01.exercise08.correct_informal_agreement:
    instruction: 'Corectează întrebarea informală: amestecă tum cu o terminație verbală greșită.'
    accepted_answers:
    - तुम कैसे हो?
    - तुम कैसे हो
    feedback: Tum are terminația ho, nu hain; hain se folosește doar cu aap.
  hi.a1.unit01.lesson01.exercise09.reply_formally:
