answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (हूँ, हाँ, कहाँ vs. मैं, हैं, में, मिलेंगे). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (हूं for हूँ, हां for हाँ) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
  description: Învață să saluți oamenii, să întrebi ce mai face cineva, să te prezinți și să schimbi informații personale de bază în hindi. Cursul explică sistemul de politețe aap/tum (o distincție gramaticală reală, asemănătoare cu tu/dumneavoastră din română) și acordul adjectivelor și al formelor verbale cu genul, ceea ce în română se întâlnește în mare parte la adjective, dar în hindi apare și la verbe.
units:
  hi.a1.unit01.greetings:
    title: Namaste și primele întâlniri
lessons:
  hi.a1.unit01.lesson01.aap_and_tum:
    title: 'Aap și tum: cum întrebi ce mai face cineva'
  hi.a1.unit01.lesson02.greetings_and_farewells:
    title: Saluturi și formule de rămas-bun
  hi.a1.unit01.lesson03.names_origin_and_dialogue:
    title: Nume, origine și o primă întâlnire la cursul de yoga
teaching:
  hi.a1.unit01.lesson01.teach.aap:
    title: Tu/dumneavoastră de politețe
    gloss: dumneavoastră (formal, respectuos)
    note: 'Ca și româna (tu / dumneavoastră), hindi face o alegere socială: *aap* se folosește cu o persoană mai în vârstă, necunoscută sau într-o relație profesională respectuoasă. Gramatical, este tratat ca plural chiar și pentru o singură persoană: verbele care se acordă cu *aap* au aceleași terminații de tip -en/hain ca la „ei”.'
  hi.a1.unit01.lesson01.teach.tum:
    title: Forma informală
    gloss: tu (informal, familiar)
    note: '*Tum* se folosește cu un prieten, un coleg de vârstă, o persoană mai tânără sau un membru al familiei: o relație cu adevărat informală, dar totuși respectuoasă (nu la fel de intimă ca *tu*, pe care acest curs nu îl predă). *Tum* are propriile terminații verbale, diferite și de cele ale lui *aap*, și de cele ale lui *tu*.'
  hi.a1.unit01.lesson01.teach.aap_kaise_hain:
    title: Întrebare formală despre starea cuiva, către un bărbat
    gloss: Ce mai faceți? (formal, unui bărbat)
    note: '*Kaise* se acordă cu GENUL PERSOANEI ÎNTREBATE, nu cu al vorbitorului; această formă se folosește când te adresezi unui bărbat. În română, „ce mai faceți” nu se schimbă niciodată în funcție de gen.'
  hi.a1.unit01.lesson01.teach.aap_kaisi_hain:
    title: Ce mai faceți? (către o femeie, formal)
    gloss: Ce mai faceți? (formal, unei femei)
    note: 'Aceeași întrebare, același registru *aap*: se schimbă doar *kaisi* față de *kaise*, acordat cu o interlocutoare. Verbul *hain* în sine nu se schimbă niciodată; doar forma adjectivului se schimbă.'
  hi.a1.unit01.lesson01.teach.tum_kaise_ho:
    title: Întrebare informală despre starea cuiva
    gloss: Ce mai faci? (informal)
    note: 'La *tum*, verbul este *ho*, nu *hain*: compară formalul *Aap kaise/kaisi hain?* cu informalul *Tum kaise ho?*. Este cea mai clară pereche minimală pentru a auzi diferența aap–tum chiar în verb.'
  hi.a1.unit01.lesson01.teach.main_theek_hoon:
    title: Un răspuns standard
    gloss: Sunt bine, mulțumesc.
    note: '*Theek* („bine”) nu se schimbă după gen sau registru: spre deosebire de *kaise/kaisi*, rămâne la fel indiferent cine vorbește sau cui i te adresezi.'
  hi.a1.unit01.lesson01.teach.aur_aap:
    title: Întoarce întrebarea formală
    gloss: Dar dumneavoastră? (formal)
    note: O modalitate scurtă de a returna întrebarea în registrul respectuos aap.
  hi.a1.unit01.lesson01.teach.aur_tum:
    title: Întoarce întrebarea informală
    gloss: Dar tu? (informal)
    note: Folosește tum pentru a returna întrebarea unui prieten sau coleg.
  hi.a1.unit01.lesson02.teach.namaste:
    title: Salut universal
    gloss: bună; salut (se folosește și la despărțire)
    note: '*Namaste* se potrivește la orice oră din zi, în situații formale și informale, atât la începutul, cât și la sfârșitul unei conversații: cu adevărat universal, spre deosebire de română, unde salutul și formula de rămas-bun sunt cuvinte diferite.'
    example_gloss: Bună! Ce mai faci?
  hi.a1.unit01.lesson02.teach.namaskar:
    title: Salut respectuos
    gloss: bună ziua (mai formal/respectuos decât namaste)
    note: '*Namaskar* înseamnă în esență același lucru ca *namaste*, dar are un ton mai formal și mai respectuos: se potrivește față de o persoană în vârstă, un public numeros sau într-un cadru profesional.'
    example_gloss: Namaskar! Și dumneavoastră?
  hi.a1.unit01.lesson02.teach.phir_milenge:
    title: Pe curând (viitor)
    gloss: pe curând; ne vedem mai târziu
    note: 'Literal „ne vom mai întâlni”: o formulă standard, neutră, de rămas-bun când te aștepți să revezi persoana.'
  hi.a1.unit01.lesson02.teach.alvida:
    title: Rămas-bun formal
    gloss: la revedere; rămas-bun
    note: '*Alvida* este un cuvânt hindi real și corect pentru „la revedere”, dar în uz cotidian are un ton mai definitiv, mai formal și chiar puțin dramatic decât *namaste* sau *phir milenge*: mai aproape de „rămas-bun” decât de un „pa” obișnuit.'
    example_gloss: La revedere! Pe curând.
  hi.a1.unit01.lesson02.teach.phir_milte_hain:
    title: Ne vedem (informal/obișnuit)
    gloss: ne vedem; pe aproape
    note: 'Literal „ne întâlnim din nou”, cu forma verbală de prezent/obișnuit în loc de viitor: un echivalent cotidian, puțin mai informal, al lui *phir milenge*.'
  hi.a1.unit01.lesson02.teach.shubh_ratri:
    title: Noapte bună
    gloss: noapte bună
    note: 'Se spune când cineva pleacă pentru noapte sau se duce la culcare: ca și în română, „noapte bună” este o formulă de rămas-bun, niciodată un salut de început, spre deosebire de *namaste*.'
  hi.a1.unit01.lesson02.teach.shubh_din:
    title: Urare politicoasă de încheiere
    gloss: O zi bună!
    note: 'Literal „să rămână ziua ta bună”: o urare politicoasă de încheiere, potrivită la despărțirea de cineva cu respect, fie că relația este formală sau informală.'
  hi.a1.unit01.lesson03.teach.aapka_naam_kya_hai:
    title: Întrebi numele, formal
    gloss: Cum vă numiți? (formal)
    note: '*Aapka* („al dumneavoastră”) se acordă cu substantivul masculin *naam* („nume”): posesivele din hindi își schimbă forma după lucrul posedat, nu după posesor. În română, posesivele se acordă și ele cu obiectul posedat (numele meu, numele tău, casa mea), dar în hindi acordul se vede în terminație.'
  hi.a1.unit01.lesson03.teach.tumhara_naam_kya_hai:
    title: Cum întrebi un nume, informal
    gloss: Cum te cheamă? (informal)
    note: Același tipar, cu *tumhara* („al tău”, informal) în locul lui *aapka*. Compară formalul *Aapka naam kya hai?* cu informalul *Tumhara naam kya hai?*.
  hi.a1.unit01.lesson03.teach.mera_naam_priya_hai:
    title: Spune-ți numele
    gloss: Mă numesc Priya.
    note: 'Și *mera* („al meu”) se acordă cu *naam*, care este masculin: observă că are aceeași terminație masculină ca *aapka*/*tumhara* de mai sus, deoarece toate trei determină același substantiv.'
  hi.a1.unit01.lesson03.teach.aapse_milkar_khushi_hui:
    title: Bucuria de a cunoaște pe cineva, formal
    gloss: Încântat de cunoștință. (formal)
    note: 'Literal „întâlnindu-vă, a venit bucuria”: o expresie fixă, foarte răspândită, pentru o primă întâlnire respectuoasă.'
  hi.a1.unit01.lesson03.teach.mujhe_bhi:
    title: Întoarce urarea
    gloss: Și eu.
    note: Un răspuns scurt și firesc la Aapse milkar khushi hui sau Tumse milkar accha laga.
  hi.a1.unit01.lesson03.teach.aap_kahan_se_hain:
    title: Cum întrebi de unde este cineva, formal
    gloss: De unde veniți? (formal)
    note: Kahan înseamnă „unde”; se înseamnă „de la / din”.
  hi.a1.unit01.lesson03.teach.main_bharat_se_hoon:
    title: Spune de unde ești
    gloss: Sunt din India.
    note: Bharat este numele hindi al Indiei, folosit constant în vorbirea de zi cu zi.
  hi.a1.unit01.lesson03.teach.tum_kahan_se_ho:
    title: Întrebi de unde e cineva, informal
    gloss: De unde vii? (informal)
    note: 'Aceeași întrebare, cu *tum* și *ho* în locul lui *aap* și *hain*: același tipar de terminații formale/informale văzut în toată această unitate.'
  hi.a1.unit01.lesson03.teach.dialogue.line01:
    title: Începutul întâlnirii
    gloss: Priya îl salută pe Arjun și îl întreabă dacă e prima dată când vine aici.
    note: Ambii vorbitori folosesc de la început registrul informal *tum*, firesc pentru doi colegi care se întâlnesc la un curs din comunitate. *Tumhari* („a ta”) se acordă cu substantivul feminin *baar* („dată”, ca în „ocazie”), nu cu genul vreunuia dintre vorbitori.
  hi.a1.unit01.lesson03.teach.dialogue.line02:
    title: Începutul întâlnirii, răspuns
    gloss: Arjun spune că da, e prima dată și că vrea să învețe yoga.
    note: '*Chahta hoon* („vreau”) are aici forma masculină pentru că Arjun, vorbitorul, este bărbat: acest verb se acordă cu genul VORBITORULUI, spre deosebire de *kaisi*/*kaise* de mai devreme, care se acordau cu persoana ÎNTREBATĂ.'
  hi.a1.unit01.lesson03.teach.dialogue.line03:
    title: Schimb de nume
    gloss: Priya spune „și eu!”, își spune numele și îl întreabă pe al lui Arjun.
    note: '*Main bhi!* („și eu!”) răspunde la *main ... chahta hoon* al lui Arjun: când propoziția celuilalt are ca subiect *main*, „și eu” este *main bhi*. *Mujhe bhi* este răspunsul la o propoziție de tip *mujhe*, precum *Tumse milkar accha laga*. *Mera naam...hai* este modul simplu și firesc de a-ți spune numele.'
  hi.a1.unit01.lesson03.teach.dialogue.line04:
    title: Schimb de nume, răspuns
    gloss: Arjun își spune numele și spune, informal, că îi pare bine să o cunoască.
    note: '*Tumse milkar accha laga* este corespondentul informal al formalului *Aapse milkar khushi hui* din această lecție: ambele înseamnă aproximativ „încântat de cunoștință”, potrivite registrului.'
  hi.a1.unit01.lesson03.teach.dialogue.line05:
    title: Întrebare despre origine
    gloss: Priya răspunde la fel și întreabă de unde este Arjun.
    note: Tum kahan se ho întreabă despre origine în registrul informal deja învățat.
  hi.a1.unit01.lesson03.teach.dialogue.line06:
    title: Întrebare despre origine, răspuns
    gloss: Arjun este din India, dar locuiește acum la Londra, apoi pune aceeași întrebare înapoi.
    note: '*Rahta hoon* („locuiesc”) este masculin, acordat cu Arjun ca vorbitor: același tipar de acord cu subiectul ca *chahta hoon* din replica a doua. *Lekin* („dar”) leagă contrastul dintre origine și locuința actuală.'
  hi.a1.unit01.lesson03.teach.dialogue.line07:
    title: Vorbim despre origine și despre un interes
    gloss: Priya spune că e din America și că vrea și ea să învețe yoga.
    note: '*Chahti hoon* este forma feminină a aceluiași verb folosit de Arjun în replica a doua (*chahta hoon*): observă că ambele se acordă cu genul propriului vorbitor, ceea ce oferă o pereche minimală directă de comparat.'
  hi.a1.unit01.lesson03.teach.dialogue.line08:
    title: Întrebare despre activitatea comună
    gloss: Arjun reacționează pozitiv și o întreabă pe Priya dacă face yoga.
    note: '*Karti ho* („faci”) este feminin, acordat cu Priya ca persoană întrebată: ca și *kaisi* mai devreme, această formă verbală urmează genul interlocutorului, nu al vorbitorului.'
  hi.a1.unit01.lesson03.teach.dialogue.line09:
    title: Întrebare despre activitatea comună, răspuns
    gloss: Priya spune că nu, e prima dată și că încă învață.
    note: '*Seekh rahi hoon* („învăț”, acum) folosește forma feminină continuă, acordată cu Priya ca vorbitoare: corespondentul de prezent continuu al lui *chahti hoon*.'
  hi.a1.unit01.lesson03.teach.dialogue.line10:
    title: Încheierea conversației
    gloss: Arjun e de acord să înceapă, apoi spune „ne vedem”.
    note: '*Chalo shuru karte hain* („hai să începem”) este o formulă fixă și firească pentru a propune să începeți ceva împreună. *Phir milte hain* încheie schimbul cu formula informală de rămas-bun din lecția 2.'
