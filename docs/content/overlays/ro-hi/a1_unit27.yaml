teaching:
  hi.a1.unit27.lesson01.teach.khush_udas_naraz:
    title: Fericit, trist și furios
    gloss: fericit, trist, furios
    note: '*खुश*, *उदास* și *नाराज़* sunt cuvinte de bază pentru sentimente, care se folosesc cu *हूँ* sau *है* („sunt”, „este”); nu se schimbă după gen.'
    example_gloss:
    - Sunt fericit.
    - Sunt trist.
    - Sunt furios.
  hi.a1.unit27.lesson01.teach.main_khush_hoon:
    title: Spui că ești fericit
    gloss: Sunt fericit.
    note: '*मैं खुश हूँ* urmează tiparul *मैं* + sentiment + *हूँ*, ca în „sunt ...”.'
  hi.a1.unit27.lesson01.teach.main_naraz_naheen:
    title: Sentimente în contrast
    gloss: Nu sunt furios, sunt trist.
    note: '*नहीं* stă chiar înaintea lui *हूँ*: *नाराज़ नहीं हूँ*. A doua parte numește apoi sentimentul real.'
  hi.a1.unit27.lesson02.teach.tum_khush_kyon:
    title: Întrebarea „de ce”
    gloss: De ce ești fericit?
    note: '*क्यों* („de ce”) stă înaintea cuvântului principal: *तुम खुश क्यों हो?*. *तुम* este „tu” informal.'
  hi.a1.unit27.lesson02.teach.main_khush_hoon:
    title: Spui motivul
    gloss: Sunt fericit pentru că am un apartament nou.
    note: '*क्योंकि* introduce motivul. *मेरे पास ... है* înseamnă „am”, iar verbul *है* stă la sfârșit.'
  hi.a1.unit27.lesson02.teach.main_udas_hoon:
    title: Un motiv negativ
    gloss: Sunt trist pentru că plouă.
    note: '*बारिश हो रही है* înseamnă „plouă” (literal „ploaia se întâmplă”).'
  hi.a1.unit27.lesson03.teach.narvas:
    title: Nervos
    gloss: nervos
    note: Cuvântul obișnuit pentru nervozitate.
    example_gloss: Sunt nervos înainte de prima mea tură.
  hi.a1.unit27.lesson03.teach.main_apnee_pahlee:
    title: Spui de ce ești nervos
    gloss: Sunt nervos înainte de prima mea tură.
    note: '*को लेकर* înseamnă „în legătură cu” și stă după substantiv: *शिफ़्ट को लेकर*. *अपनी* („propria”) se acordă cu substantivul feminin *शिफ़्ट*.'
  hi.a1.unit27.lesson03.teach.chinta_mat_karo:
    title: Liniștești pe cineva
    gloss: Nu-ți face griji.
    note: '*चिंता मत करो* este prietenosul „nu-ți face griji”: *मत* + *करो* este imperativul pentru *तुम* cu negație.'
  hi.a1.unit27.lesson04.teach.arjun_kaisa_mahsoos:
    title: Întrebi cum se simte cineva
    gloss: Cum se simte Arjun?
    note: '*कैसा महसूस कर रहा है* întreabă „cum se simte”. *कैसा* se acordă cu persoana, deci pentru o femeie se spune *कैसी*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_mahsoos:
    title: Descrii cum se simte cineva
    gloss: El se simte nervos.
    note: 'În hindi nu apare aici un cuvânt separat pentru „se” reflexiv: *वह नर्वस महसूस कर रहा है* folosește pur și simplu *वह* și *रहा है*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_kyon:
    title: Întrebi de ce se simte cineva într-un anumit fel
    gloss: De ce se simte nervos?
    note: '*क्यों* stă chiar înaintea grupului verbal: *वह नर्वस क्यों महसूस कर रहा है?*'
  hi.a1.unit27.lesson05.teach.hay_priya_main:
    title: Citește un mesaj despre sentimente
    gloss: Salut, Priya, sunt puțin emoționat din cauza primei mele ture singur. Dar sunt și fericit, pentru că am un job nou și un apartament nou. Cred că totul va fi bine.
    note: Urmărește de ce este nervos autorul, ce îl face fericit și cum vede el lucrurile în ansamblu.
    glosses:
      थोड़ा: puțin
      नर्वस: nervos
      पहली: primul
      शिफ़्ट: tură
      अकेले: singur
      खुश: se bucură
      क्योंकि: pentru că
      नई: noi
      नौकरी: slujbă
      नया: noi
      फ़्लैट: apartament
      लगता: a crede
      होगा: va merge (bine)
  hi.a1.unit27.lesson06.teach.priya_hay_arjun:
    title: Priya îl întreabă pe Arjun cum se simte
    gloss: 'Priya: Salut, Arjun, cum te simți în legătură cu prima ta tură?'
    note: '*को लेकर* apare din nou: *अपनी पहली शिफ़्ट को लेकर* („în legătură cu prima ta tură”). *तुम* este informal.'
  hi.a1.unit27.lesson06.teach.arjun_sach_kahoon:
    title: Arjun recunoaște că e emoționat
    gloss: 'Arjun: Să fiu sincer, sunt puțin emoționat.'
    note: '*सच कहूँ तो* („dacă spun adevărul”) îndulcește o mărturisire.'
  hi.a1.unit27.lesson06.teach.priya_chinta_mat:
    title: Priya îl liniștește
    gloss: 'Priya: Nu-ți face griji, te descurci bine!'
    note: '*तुम यह अच्छे से कर सकते हो* înseamnă „poți face asta bine”, iar *अच्छे से* este „bine”.'
  hi.a1.unit27.lesson06.teach.arjun_shukriya_isse:
    title: Arjun îi mulțumește
    gloss: 'Arjun: Mulțumesc, chiar mă ajută.'
    note: '*इससे मदद मिलती है* este literal „din asta se primește ajutor”: cel care ajută este marcat cu *से*.'
  hi.a1.unit27.lesson06.teach.priya_aur_bad:
    title: Priya prezice rezultatul
    gloss: 'Priya: Iar după aceea vei fi sigur foarte fericit și mândru.'
    note: '*ज़रूर* („sigur”) face prezicerea încrezătoare, iar *तुम्हें गर्व होगा* înseamnă „vei simți mândrie”.'
  hi.a1.unit27.lesson06.teach.arjun_han_mujhe:
    title: Arjun este de acord
    gloss: 'Arjun: Da, cred și eu asta.'
    note: '*मुझे भी ऐसा ही लगता है* („și mie așa mi se pare”) este modul firesc de a fi de acord, iar *मुझे* arată cine simte.'
  hi.a1.unit27.lesson06.teach.arjun_narvas_hai:
    title: 'Pronume: उसकी'
    gloss: Arjun este emoționat. Priya îl ajută.
    note: '*उसकी* înseamnă „al lui” sau „al ei” și se acordă cu substantivul feminin *मदद*, deci *उसकी मदद करना* este „a-l ajuta”; *है* și *करती है* sunt verbele pentru persoana a treia.'
