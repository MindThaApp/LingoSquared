answer_policy:
  nasalization_marks: 'Display and teach the correct chandrabindu/anusvara distinction. This unit''s own new vocabulary needs one new, explicitly disclosed spelling decision: महंगा/महंगी ("expensive") uses अनुस्वार (ं), not चंद्रबिंदु -- this is a class-nasal-before-a-stop-consonant case (the same pattern as गंगा/मंगल), not an application of the existing word-final vowel-height convention that governs हूँ/हाँ/मैं/हैं/में. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
units:
  hi.a1.unit07.shopping:
    title: Cumpărături
lessons:
  hi.a1.unit07.lesson01.dukaan_mein:
    title: La magazin
  hi.a1.unit07.lesson02.keemat_aur_matra:
    title: Preț și cantitate
  hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari:
    title: Priya și Arjun merg la cumpărături
teaching:
  hi.a1.unit07.lesson01.teach.dukaan_bazaar:
    title: Magazin, piață
    gloss: magazin, piață
    note: Două locuri obișnuite în care cumperi lucruri, folosite pe tot parcursul acestei unități.
    example_gloss:
    - Acesta este un magazin.
    - Aceasta este o piață.
  hi.a1.unit07.lesson01.teach.dukaandaar:
    title: Vânzătorul
    gloss: vânzător
    note: 'Un personaj nou în această unitate: persoana care ține un magazin. I te adresezi cu aap, fiindcă este o persoană necunoscută.'
    example_gloss: Acesta este vânzătorul.
  hi.a1.unit07.lesson01.teach.kameez_bag_topi:
    title: Cămașă, geantă, pălărie
    gloss: cămașă, geantă, pălărie
    note: Trei obiecte obișnuite la cumpărături, folosite în această unitate pentru a exersa structura *mujhe ... chahiye* din unitatea despre mâncare.
    example_gloss:
    - Aș dori o cămașă.
    - Aș dori o geantă.
    - Aș dori o pălărie.
  hi.a1.unit07.lesson01.teach.mujhe_yah_chahiye:
    title: Aș dori asta
    gloss: Aș dori asta.
    note: O expresie generală pentru a cere un obiect, care reia *mujhe ... chahiye* din unitatea despre mâncare, cu *yah* („acesta”).
  hi.a1.unit07.lesson01.teach.ji:
    title: Ji (titlu politicos)
    gloss: o particulă politicoasă, de respect, ca atunci când adaugi „domnule” sau „doamnă”
    note: Se adaugă după un nume sau un titlu pentru a suna mai politicos; este frecventă când te adresezi unui necunoscut, cum e un vânzător.
    example_gloss: Bună ziua, domnule vânzător.
  hi.a1.unit07.lesson01.teach.sirf:
    title: Doar
    gloss: doar, numai
    note: Se folosește pentru a spune că vrei un singur lucru, nu mai multe.
    example_gloss: Aș dori doar o cămașă.
  hi.a1.unit07.lesson01.teach.aapko_aur_kuch_chahiye:
    title: Doriți și altceva? (formal)
    gloss: Doriți și altceva?
    note: Întrebarea formală firească pe care o pune vânzătorul după ce a preluat o parte din comandă; reia *aapko* și *chahiye*.
  hi.a1.unit07.lesson01.teach.ji_nahin_sirf_yah:
    title: Nu, doar asta
    gloss: Nu, doar asta.
    note: O cale firească și politicoasă de a refuza alte produse; reia *ji* și *sirf* din această lecție.
  hi.a1.unit07.lesson01.teach.tumhein_kya_chahiye_bataao:
    title: Spune-mi ce ți-ar plăcea
    gloss: Spune-mi ce ți-ar plăcea.
    note: Expresia informală de exercițiu pe care o folosește acest curs pentru a cere un răspuns vorbit, ca în unitatea despre mâncare.
  hi.a1.unit07.lesson02.teach.keemat:
    title: Preț
    gloss: preț
    note: Reluat din conținutul despre numere și prețuri din unitatea 2, predat din nou aici în contextul cumpărăturilor.
    example_gloss: Cât costă?
  hi.a1.unit07.lesson02.teach.rupaye:
    title: Rupii
    gloss: rupii
    note: Cuvântul pentru monedă, reluat din unitatea 2, exersat acum cu două prețuri diferite.
    example_gloss:
    - Costă două sute de rupii.
    - Costă cinci sute de rupii.
  hi.a1.unit07.lesson02.teach.iski_keemat_kya_hai:
    title: Cât costă?
    gloss: Cât costă?
    note: Modul standard de a întreba un preț, reluat direct din unitatea 2.
  hi.a1.unit07.lesson02.teach.iski_keemat_bees_rupaye_hai:
    title: Costă două sute de rupii
    gloss: Costă două sute de rupii.
    note: Un exemplu de răspuns la întrebarea despre preț de mai sus.
  hi.a1.unit07.lesson02.teach.kitne_ka_ki_note:
    title: Kitne ka / kitne ki
    gloss: „Yah kitne ka hai?” se folosește pentru lucruri de genul masculin, iar „Yah kitne ki hai?” pentru lucruri de genul feminin -- *kitne* nu se schimbă niciodată -- se schimbă doar *ka/ki*, la fel ca alternanța -a/-i pe care o cunoști deja din *mera/meri* și *tumhara/tumhari*.
    note: A doua modalitate, foarte frecventă, de a întreba un preț, construită pe același model de acord în gen deja învățat la posesive -- se schimbă doar particula ka/ki, nu kitne.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ka_hai:
    title: Cât costă asta? (masculin)
    gloss: Cât costă asta?
    note: Se folosește pentru un obiect de genul masculin, de exemplu o geantă.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ki_hai:
    title: Cât costă asta? (feminin)
    gloss: Cât costă asta?
    note: Se folosește pentru un obiect de genul feminin, de exemplu o pălărie.
  hi.a1.unit07.lesson02.teach.sasta_mehenga:
    title: Ieftin, scump
    gloss: ieftin, scump
    note: O pereche frecventă de adjective pentru a reacționa la un preț; aici sunt arătate formele masculine.
    example_gloss:
    - Geanta aceasta este ieftină.
    - Geanta aceasta este scumpă.
  hi.a1.unit07.lesson02.teach.sasti_mehengi_note:
    title: Sasti și mehengi
    gloss: „Sasta” și „mehenga” se schimbă și ele după genul masculin sau feminin, ca „mera/meri” -- cu cuvintele de genul feminin spunem „sasti” și „mehengi”, de exemplu „yah topi sasti hai” (această pălărie este ieftină) sau „yah kameez mehengi hai” (această cămașă este scumpă).
    note: Încă un exemplu real al aceluiași model de acord în gen, pe care acest curs îl semnalează explicit.
  hi.a1.unit07.lesson03.teach.khareedna:
    title: A cumpăra
    gloss: a cumpăra
    note: Reia construcția „verb + na chahta/chahti hun” („vreau să...”) predată în unitatea 1 pentru yoga, aplicată acum la cumpărat.
    example_gloss:
    - Vreau să cumpăr această cămașă.
    - Vreau să cumpăr această pălărie.
  hi.a1.unit07.lesson03.teach.chalo_kuch_khareedte_hain:
    title: Hai să cumpărăm ceva!
    gloss: Hai să cumpărăm ceva!
    note: O formulă prietenoasă și fixă de a propune cumpărături împreună, care deschide dialogul final al unității, după modelul „chalo, kuch khate hain!” din unitatea despre mâncare.
  hi.a1.unit07.lesson03.teach.dialogue.line01:
    title: Arjun propune să facă cumpărături
    gloss: 'Arjun spune: hai să cumpărăm ceva.'
    note: Reia expresia de deschidere a acestei unități.
  hi.a1.unit07.lesson03.teach.dialogue.line02:
    title: Priya este de acord
    gloss: 'Priya este de acord și se întreabă: o cămașă sau o pălărie?'
    note: Introduce *ya* („sau”) pentru a oferi o alegere între două obiecte.
  hi.a1.unit07.lesson03.teach.dialogue.line03:
    title: Vânzătorul îi întâmpină
    gloss: Vânzătorul îi salută și îi întreabă ce doresc.
    note: Salutul formal, cu aap, care reia *aapko kya chahiye* din lecția 1.
  hi.a1.unit07.lesson03.teach.dialogue.line04:
    title: Priya întreabă despre o cămașă
    gloss: Priya îl salută politicos pe vânzător și cere o cămașă, apoi îi întreabă prețul.
    note: Combină *ji*, *mujhe ... chahiye* și *iski keemat kya hai*.
  hi.a1.unit07.lesson03.teach.dialogue.line05:
    title: Vânzătorul spune prețul
    gloss: Vânzătorul spune că ea costă trei sute de rupii.
    note: Reia structura *iski keemat ... rupaye hai* cu un număr nou.
  hi.a1.unit07.lesson03.teach.dialogue.line06:
    title: Priya reacționează și se hotărăște
    gloss: 'Priya spune: trei sute de rupii? E ieftină! Aș dori această cămașă.'
    note: Reia *sasti* din nota de gramatică a lecției 2.
  hi.a1.unit07.lesson03.teach.dialogue.line07:
    title: Arjun întreabă despre o pălărie
    gloss: Arjun spune că ar dori o pălărie și întreabă cât costă.
    note: Reia forma feminină *kitne ki hai* din lecția 2.
  hi.a1.unit07.lesson03.teach.dialogue.line08:
    title: Vânzătorul răspunde
    gloss: Vânzătorul spune că pălăria costă cinci sute de rupii.
    note: Reia *paanch sau* („cinci sute”) din lecția 2.
  hi.a1.unit07.lesson03.teach.dialogue.line09:
    title: Arjun reacționează și o ia oricum
    gloss: 'Arjun spune: cinci sute de rupii? E scumpă! Bine, aș dori această pălărie.'
    note: Reia *mehengi* din nota de gramatică a lecției 2, apoi hotărăște să o cumpere oricum.
  hi.a1.unit07.lesson03.teach.dialogue.line10:
    title: Vânzătorul întreabă dacă asta e tot
    gloss: 'Vânzătorul spune: bine, doriți și altceva?'
    note: Reia *aapko aur kuch chahiye* din lecția 1.
  hi.a1.unit07.lesson03.teach.dialogue.line11:
    title: Priya încheie comanda
    gloss: 'Priya spune: nu, doar asta, mulțumesc!'
    note: Reia *ji nahin, sirf yah* din lecția 1 și *shukriya*.
  hi.a1.unit07.lesson03.teach.dialogue.line12:
    title: Vânzătorul își ia rămas-bun
    gloss: 'Vânzătorul mulțumește și spune: pe curând.'
    note: Reia formula de încheiere standard a acestui curs.
