    gloss: Unde este oficiul poștal?
    note: Deschide dialogul final al unității.
  hi.a1.unit08.lesson03.teach.dialogue.line01:
    title: Arjun întreabă despre oficiul poștal
    gloss: Arjun o întreabă pe Priya unde este oficiul poștal.
    note: Reia fraza de la începutul acestei lecții.
  hi.a1.unit08.lesson03.teach.dialogue.line02:
    title: Priya răspunde
    gloss: Priya spune că este lângă bancă.
    note: Reia *ke paas* din lecția 2.
  hi.a1.unit08.lesson03.teach.dialogue.line03:
    title: Arjun întreabă despre spital
    gloss: Arjun spune „bine” și întreabă unde este spitalul.
    note: Reia *achchha* (bine / am înțeles) din unitățile anterioare.
  hi.a1.unit08.lesson03.teach.dialogue.line04:
    title: Priya răspunde
    gloss: Priya spune că spitalul este în fața gării.
    note: Reia *ke samne* din lecția 2.
  hi.a1.unit08.lesson03.teach.dialogue.line05:
    title: Arjun întreabă dacă este departe
    gloss: 'Arjun întreabă: gara este departe?'
    note: Reia *door* din lecția 2.
  hi.a1.unit08.lesson03.teach.dialogue.line06:
    title: Priya confirmă și face un contrast
    gloss: Priya spune da, e puțin departe -- banca este aproape.
    note: 'Introduce *thoda* (puțin) și rămâne coerent: gara este departe, iar banca rămâne aproape.'
  hi.a1.unit08.lesson03.teach.dialogue.line07:
    title: Arjun întreabă despre parc
    gloss: Arjun spune „în regulă” și întreabă unde este parcul.
  hi.a1.unit08.lesson03.teach.dialogue.line08:
    title: Priya răspunde
    gloss: Priya spune că parcul este în spatele școlii.
    note: Reia *ke peeche* din lecția 2.
  hi.a1.unit08.lesson03.teach.dialogue.line09:
    title: Arjun trage concluzia
    gloss: 'Arjun spune: deci școala este în fața parcului!'
    note: Introduce *to* (deci / atunci) și leagă faptul de nota de gramatică despre *samne*/*peeche* din lecția 2.
  hi.a1.unit08.lesson03.teach.dialogue.line10:
    title: Priya confirmă
    gloss: Priya spune da, așa este!
    note: Introduce *sahi* (corect).
  hi.a1.unit08.lesson03.teach.dialogue.line11:
    title: Arjun îi mulțumește Priyei
    gloss: 'Arjun spune: mulțumesc mult, Priya!'
    note: Reia *bahut* (foarte / mult) și *shukriya* din unitățile anterioare.
  hi.a1.unit08.lesson03.teach.dialogue.line12:
    title: Priya încheie
    gloss: 'Priya spune: nicio problemă! Ne vedem din nou.'
    note: Reia formulele de încheiere obișnuite ale cursului, din unitățile anterioare.
