    example_gloss:
    - Acesta este un parc.
    - Aceasta este o gară.
  hi.a1.unit08.lesson01.teach.yahan_wahan:
    title: Aici, acolo
    gloss: aici, acolo
    note: O pereche de bază pentru a arăta unde se află ceva.
    example_gloss:
    - Școala este aici.
    - Banca este acolo.
  hi.a1.unit08.lesson01.teach.school_kahan_hai:
    title: Unde este școala?
    gloss: Unde este școala?
    note: Reia *kahaan* (unde), predat încă din unitatea 1, acum pentru a întreba despre un loc, nu despre originea unei persoane.
  hi.a1.unit08.lesson01.teach.school_yahan_hai:
    title: Școala este aici
    gloss: Școala este aici.
    note: Un exemplu de răspuns cu *yahaan*.
  hi.a1.unit08.lesson01.teach.bank_kahan_hai:
    title: Unde este banca?
    gloss: Unde este banca?
    note: Același tipar de întrebare, cu alt loc.
  hi.a1.unit08.lesson01.teach.bank_wahan_hai:
    title: Banca este acolo
    gloss: Banca este acolo.
    note: Un exemplu de răspuns cu *wahaan*.
  hi.a1.unit08.lesson02.teach.paas:
    title: Aproape
    gloss: aproape
    note: Introdus oficial aici pentru prima dată -- apăruse doar în exemplele din unitatea 2 (*mere paas*, „eu am”, literal „lângă mine”), fără să fi fost predat până acum ca un cuvânt de sine stătător.
    example_gloss: Banca este aproape.
  hi.a1.unit08.lesson02.teach.door:
    title: Departe
    gloss: departe
    note: Opusul lui *paas*.
    example_gloss: Gara este departe.
  hi.a1.unit08.lesson02.teach.ke_paas_note:
    title: Ke paas
    gloss: „Ke paas” înseamnă lângă un loc, ca în „school bank ke paas hai” (școala este lângă bancă). Este același „paas” întâlnit mai devreme în „mere paas” (eu am), dar acolo însemna „în posesia mea”, iar aici înseamnă „aproape” -- un singur cuvânt, două întrebuințări diferite.
    note: O postpoziție nouă, construită pe un cuvânt deja cunoscut; sensul de mai devreme este indicat explicit, ca să nu se confunde cele două întrebuințări.
    target_text: '''के पास'' का मतलब है किसी जगह के नज़दीक -- जैसे ''बैंक स्कूल के पास है''। यह वही ''पास'' है जो पहले ''मेरे पास'' (मेरे पास एक किताब है) में आया था, पर वहाँ इसका मतलब था ''मेरे स्वामित्व में'' (eu am), और यहाँ इसका मतलब है ''नज़दीक'' (aproape) -- एक ही शब्द, दो अलग इस्तेमाल।'
  hi.a1.unit08.lesson02.teach.school_bank_ke_paas_hai:
    title: Școala este lângă bancă
    gloss: Școala este lângă bancă.
    note: O propoziție-model cu *ke paas*.
  hi.a1.unit08.lesson02.teach.samne_peeche:
    title: În fața, în spatele
    gloss: în fața, în spatele
    note: O a doua pereche de cuvinte pentru locație, folosite tot cu *ke*.
    example_gloss:
    - Spitalul este în fața gării.
    - Parcul este în spatele școlii.
  hi.a1.unit08.lesson02.teach.samne_peeche_note:
    title: Samne și peeche
    gloss: '„Samne” și „peeche” se construiesc cu „ke”, la fel ca „paas”, și sunt opuse una celeilalte: „paark school ke peeche hai” și „school paark ke samne hai” descriu exact aceeași situație reală, doar din două puncte de vedere diferite.'
    note: Același fapt, spus în două feluri -- un punct de gramatică real și util despre legătura dintre cele două cuvinte.
  hi.a1.unit08.lesson02.teach.school_park_ke_samne_hai:
    title: Școala este în fața parcului
    gloss: Școala este în fața parcului.
    note: Cealaltă față a aceluiași fapt ca în *paark school ke peeche hai* de mai sus.
  hi.a1.unit08.lesson03.teach.dakghar:
    title: Oficiu poștal
    gloss: oficiu poștal
    note: Un loc nou și frecvent, pentru dialogul final al unității.
    example_gloss: Oficiul poștal este lângă bancă.
  hi.a1.unit08.lesson03.teach.dakghar_kahan_hai:
