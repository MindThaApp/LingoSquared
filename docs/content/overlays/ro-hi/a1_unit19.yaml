  notes: 'Derived from en-hi by scripts/derive_cross.py: structure, exercise keys and English answer sets are shared with the sibling; every Romanian string was translated and adapted. Needs native Romanian review (contrastive notes, register, distractor plausibility). NATIVE FLAGS: pending.'
answer_policy:
  weather_existential: '"Aaj/kal + [weather word] + hai" states the current or a stated day''s weather -- *dhoop hai* ("it''s sunny"), *baarish hai* ("it''s raining"), *hawa hai* ("it''s windy") are each stated as a bare existential sentence, not a progressive verb form. A typed answer using the correct weather noun with *hai* is accepted; using *hain* where the sentence''s own subject is singular (or vice versa) is judged as a real grammar error, the exact contrast this unit''s own grammar_check exercises target -- not tolerated as a minor typo.'
  garm_invariant_thanda_agrees: '*Garm* ("hot") never changes for gender or number -- "mausam garm hai" always uses *garm*. *Thanda*/*thandi* ("cold") DOES change with the noun''s gender, the same "-a"/"-i" pattern already taught for *bada*/*badi* (unit 14) -- masculine *mausam* takes *thanda*, a feminine noun would take *thandi*. Every exercise in this unit pairs *thanda*/*thandi* with *mausam* only, so only *thanda* is ever actually required as a typed answer here; a typed answer using the wrong gender form where one IS tested is marked incorrect as a real grammar error, not tolerated as a typo.'
  kal_context_ambiguity: '*Kal* means both "yesterday" (as taught in units 4/12) and "tomorrow" (as used throughout this unit) -- genuinely ambiguous in real Hindi, disambiguated only by the sentence''s own tense/context. This unit''s own sentences are all future/plan-making in context, so *kal* consistently means "tomorrow" here; don''t mark a learner''s own free sentence wrong merely for using *kal* to mean "yesterday" in a DIFFERENT context than this unit''s own scenario, since both meanings are equally correct Hindi.'
  suggestion_pattern: '"Chalo" + a habitual-plural verb form (e.g. *jaate hain*, *chalte hain*) makes a "Let''s ___" suggestion, the same pattern already used for "chalo, kuch khaate hain!" (unit 6) and "chalo, kuch kharidte hain!" (unit 7). *Jaate hain* here is the same "-te hain" habitual form applied to *jaana* ("to go," unit 15''s infinitive), not a new verb.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation. For any exercise asking the learner to describe today's or tomorrow's weather, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Hindi A1
units:
  hi.a1.unit19.weather:
    title: Vremea
lessons:
  hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa:
    title: Vremea, soarele, ploaia și vântul
  hi.a1.unit19.lesson02.garam_thanda_baadal:
    title: Cald, frig și nori
  hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam:
    title: 'Priya și Arjun: cum va fi vremea mâine?'
teaching:
  hi.a1.unit19.lesson01.teach.aaj_review:
    title: 'Recapitulare: astăzi'
    gloss: astăzi
    note: Învățat prima dată în unitatea 3 -- cuvântul de timp care revine în toată această unitate, alături de *kal* (mâine) în lecția 3.
    example_gloss: Astăzi este data de trei.
  hi.a1.unit19.lesson01.teach.mausam:
    title: Vremea
    gloss: vremea
    note: Un substantiv nou, cuvântul-temă al acestei unități. Este masculin -- vezi notele despre acordul de gen din această unitate.
    example_gloss: Cum e vremea astăzi?
  hi.a1.unit19.lesson01.teach.kaisa_review:
    title: 'Recapitulare: cum / cum este'
    gloss: cum / cum este
    note: Învățat prima dată în unitatea 12 -- refolosit aici pentru a întreba despre vreme.
    example_gloss: Cum este casa ta?
  hi.a1.unit19.lesson01.teach.hai_hain_review:
    title: 'Recapitulare: este, sunt'
    gloss: este (singular), sunt (plural)
    note: Perechea de singular/plural a verbului „a fi”, de care depinde tot tiparul existențial al vremii din această unitate.
    example_gloss:
    - Astăzi vremea este frumoasă.
    - În casă sunt trei camere.
  hi.a1.unit19.lesson01.teach.dhoop:
    title: Soare / strălucirea soarelui
    gloss: soare / strălucirea soarelui
    note: 'Un substantiv nou. Folosit într-o propoziție existențială simplă: *aaj dhoop hai* = „astăzi e soare” (literal „astăzi este soare”).'
    example_gloss: Astăzi este soare.
  hi.a1.unit19.lesson01.teach.baarish:
    title: Ploaie
    gloss: ploaie
    note: 'Un substantiv nou. Folosit într-o propoziție existențială simplă: *aaj baarish hai* = „astăzi plouă”.'
    example_gloss: Astăzi plouă.
  hi.a1.unit19.lesson01.teach.hawa:
    title: Vânt
    gloss: vânt
    note: 'Un substantiv nou. Folosit într-o propoziție existențială simplă: *aaj hawa hai* = „astăzi e vânt”.'
    example_gloss: Astăzi bate vântul.
  hi.a1.unit19.lesson01.teach.grammar_mausam_existential:
    title: Tiparul existențial pentru vreme
    gloss: Pentru a descrie vremea, spui „aaj/kal + [cuvânt despre vreme] + hai” -- de exemplu „aaj dhoop hai”, „aaj baarish hai”, „aaj hawa hai”. Este același tipar cu hai/hain învățat pentru casă (unitatea 18), dar aici fără număr, direct ca subiect.
    note: Prima notă de gramatică a acestei unități, care leagă vocabularul nou de un tipar de propoziție deja cunoscut.
  hi.a1.unit19.lesson02.teach.mausam_review:
    title: 'Recapitulare: vremea'
    gloss: vremea
    note: Refolosit din lecția 1 a acestei unități.
    example_gloss: Cum e vremea astăzi?
  hi.a1.unit19.lesson02.teach.garam:
    title: Cald
    gloss: cald
    note: Un adjectiv nou. Nu se schimbă după gen -- vezi nota de gramatică a acestei lecții.
    example_gloss: Astăzi vremea este caldă.
  hi.a1.unit19.lesson02.teach.thanda_thandi:
    title: Rece (masc. / fem.)
    gloss: rece (masculin), rece (feminin)
    note: Un adjectiv nou. SE schimbă după gen, spre deosebire de *garm* -- masculinul *mausam* cere *thanda*, substantivele feminine (ca *rasoi*, unitatea 18) cer *thandi* -- vezi nota de gramatică a acestei lecții.
    example_gloss:
    - Astăzi vremea este rece.
    - Astăzi în bucătărie este frig.
  hi.a1.unit19.lesson02.teach.grammar_garam_thanda:
    title: Adjective invariabile și adjective care se acordă în gen
    gloss: „Garm” este un adjectiv terminat în consoană și nu se schimbă după gen -- în „mausam garm hai” rămâne mereu „garm”. În schimb „thanda”/„thandi” este un adjectiv terminat în „-a” care SE schimbă după gen, exact ca „bada”/„badi” (unitatea 14) -- masculinul „mausam” cere „thanda”, un substantiv feminin cere „thandi”.
    note: Contrastul gramatical central al acestei unități, care leagă o pereche nouă de adjective de regula din unitatea 14, deja învățată.
  hi.a1.unit19.lesson02.teach.baadal:
    title: Nor / nori
    gloss: nor / nori
    note: 'Un substantiv nou, folosit în această unitate doar la pluralul existențial: *aaj baadal hain* = „astăzi sunt nori” / „astăzi e înnorat”.'
    example_gloss: Astăzi sunt nori.
  hi.a1.unit19.lesson02.teach.accha_review:
    title: 'Recapitulare: bun'
    gloss: bun
    note: Învățat prima dată în unitatea 9 -- refolosit aici pentru a descrie vremea.
    example_gloss: Astăzi vremea este frumoasă.
  hi.a1.unit19.lesson02.teach.bura:
    title: Rău
    gloss: rău
    note: Un adjectiv nou, opus lui *accha* (bun), deja învățat. În această unitate apare doar la masculin, acordat cu *mausam*.
    example_gloss: Astăzi vremea este urâtă.
  hi.a1.unit19.lesson02.teach.bahut_review:
    title: 'Recapitulare: foarte'
    gloss: foarte
    note: Învățat prima dată în unitatea 6 -- refolosit aici pentru a întări o descriere a vremii.
    example_gloss: Astăzi vremea este foarte rece.
  hi.a1.unit19.lesson03.teach.kal_review:
    title: 'Recapitulare: mâine (și: ieri)'
    gloss: mâine (înseamnă și „ieri”, în funcție de context)
    note: Învățat prima dată în unitatea 4, apoi folosit pentru „ieri” în unitatea 12 -- în hindi real este cu adevărat ambiguu și se deosebește doar din context. Toate propozițiile din această unitate vorbesc despre viitor și planuri, deci aici 'kal' înseamnă „mâine”.
    example_gloss: Mâine va ploua.
  hi.a1.unit19.lesson03.teach.ghar_review:
    title: 'Recapitulare: casă / acasă'
    gloss: casă / acasă
    note: Învățat prima dată în unitatea 8 -- refolosit aici pentru planul care rezultă (rămânem acasă).
    example_gloss: Aceasta este o casă.
  hi.a1.unit19.lesson03.teach.mein_review:
    title: 'Recapitulare: în / la'
    gloss: în / la
    note: Învățat prima dată în unitatea 1 -- refolosit aici în „ghar mein” (acasă).
    example_gloss: În casă sunt trei camere.
  hi.a1.unit19.lesson03.teach.hum_review:
    title: 'Recapitulare: noi'
    gloss: noi
    note: Învățat prima dată în unitatea 11 -- refolosit aici ca subiect al planului din această lecție.
    example_gloss: Noi ne uităm la un film.
  hi.a1.unit19.lesson03.teach.rehte_hain_review:
    title: 'Recapitulare: [ei/noi] locuiesc / rămân'
    gloss: '[ei/noi] locuiesc / rămân'
    note: Învățat prima dată în unitatea 5 (cu un bunic la singular, prin acordul de respect la masculin plural) -- această unitate este prima care îl folosește cu un subiect cu adevărat plural, „hum” (noi), aceeași formă verbală aplicată mai simplu.
    example_gloss: Bunicul meu locuiește în Delhi.
  hi.a1.unit19.lesson03.teach.chalo_review:
    title: 'Recapitulare: hai să / haide'
    gloss: hai / haide
    note: Predat prima dată în unitatea 1 și reluat în unitățile 6/7/11 cu un verb la plural habitual pentru a spune „Hai să ___”. Aici este folosit la fel.
    example_gloss: Hai să mâncăm ceva!
  hi.a1.unit19.lesson03.teach.jaana_review:
    title: 'Recapitulare: a merge'
    gloss: a merge
    note: Predat prima dată în unitatea 15 ca infinitiv simplu. Această lecție îl extinde la forma de plural habitual „jaate hain” (mergem), aceeași derivare pe care unitatea 11 a folosit-o deja pentru „dekhte hain”/„peete hain”.
    example_gloss: Trebuie să merg la gară.
  hi.a1.unit19.lesson03.teach.aur_review:
    title: 'Recapitulare: și'
    gloss: și
    note: Predat prima dată în unitatea 1. Aici este reluat pentru a lega vremea de mâine de temperatură.
    example_gloss: Mâine va ploua și vremea va fi rece.
  hi.a1.unit19.lesson03.teach.bahar:
    title: Afară
    gloss: afară
    note: Un cuvânt nou, vocabularul propriu al acestei lecții pentru planul care rezultă.
    example_gloss: Hai să mergem afară!
  hi.a1.unit19.lesson03.teach.jaate_hain_phrase:
    title: Hai să mergem afară!
    gloss: Hai să mergem afară!
    note: '„Chalo” + pluralul habitual „jaate hain” (de la „jaana”, a merge): același tipar „Hai să ___” stabilit deja în unitățile 1/6/7/11.'
  hi.a1.unit19.lesson03.teach.dialogue.line01:
    title: Arjun o întreabă pe Priya cum e vremea azi
    gloss: Priya, cum e vremea azi?
  hi.a1.unit19.lesson03.teach.dialogue.line02:
    title: Priya descrie vremea de azi
    gloss: Azi e soare și vremea e caldă.
  hi.a1.unit19.lesson03.teach.dialogue.line03:
    title: Arjun propune să iasă afară
    gloss: Foarte bine! Hai să mergem afară.
  hi.a1.unit19.lesson03.teach.dialogue.line04:
    title: Priya întreabă despre vremea de mâine
    gloss: Bine! Și cum va fi vremea mâine?
  hi.a1.unit19.lesson03.teach.dialogue.line05:
    title: Arjun descrie vremea de mâine
    gloss: Mâine va ploua și vremea va fi rece.
  hi.a1.unit19.lesson03.teach.dialogue.line06:
    title: Priya propune să rămână acasă
    gloss: Deci mâine rămânem acasă?
  hi.a1.unit19.lesson03.teach.dialogue.line07:
    title: Arjun este de acord
    gloss: Da, mâine rămânem acasă.
  hi.a1.unit19.lesson03.teach.dialogue.line08:
    title: Priya este de acord
    gloss: Bine!
  hi.a1.unit19.lesson03.teach.grammar_summary:
    title: Trei reguli principale
    gloss: 'Cele trei reguli principale ale acestei unități: (1) „aaj/kal + [cuvânt despre vreme] + hai/hain” descrie vremea; (2) „garm” nu se schimbă după gen, dar „thanda”/„thandi” se schimbă, la fel ca „bada”/„badi”; (3) „chalo” + un verb la plural habitual (precum „jaate hain”) exprimă o propunere: „chalo, bahar jaate hain!”.'
    note: Un rezumat final care leagă gramatica întregii unități, ca notele de gramatică din unitățile 15-18 care reunesc paradigma.
  hi.a1.unit19.lesson03.teach.weather_reading:
    title: Citim despre azi și mâine
    gloss: Azi vremea e caldă și e soare. Hai să mergem afară! Mâine va ploua și vremea va fi rece. Mâine rămânem acasă.
    note: Un profil scurt și direct, fără cadru narativ nou, care reia exact faptele din dialog, fără informații noi. Servește direct obiectivul „citesc o scurtă prognoză meteo”.
    glosses:
      आज: azi
      मौसम: vreme
      गर्म: cald
      धूप: soare
      चलो: hai
      बाहर: afară
      जाते: merge (de la जाना)
      कल: mâine
      बारिश: ploaie
      ठंडा: rece
      रहते: rămâne / locui (de la रहना)
