teaching:
  hi.a1.unit26.lesson01.teach.jaiket_svetar:
    title: Palton, pulover
    gloss: paltonul, puloverul
    note: '*जैकेट* este feminin, iar *स्वेटर* este masculin, lucru care se vede din cuvintele care le însoțesc: *मेरी जैकेट*, *मेरा स्वेटर*.'
    example_gloss:
    - Caut un palton.
    - Am un pulover.
  hi.a1.unit26.lesson01.teach.paint_joote:
    title: Pantaloni, pantofi
    gloss: pantalonii, pantofii
    note: '*पैंट* este un singur cuvânt pentru o pereche de pantaloni (*मेरी पैंट*), iar *जूते* este pluralul lui *जूता*: un substantiv masculin terminat în *-आ* trece la *-ए* la plural.'
    example_gloss:
    - Caut pantaloni.
    - Caut pantofi.
  hi.a1.unit26.lesson01.teach.main_ek_jaiket:
    title: Spui ce cauți
    gloss: Caut un palton.
    note: 'Verbul vine la sfârșit: *मैं एक जैकेट ढूँढ़ रहा हूँ*. *रहा हूँ* dă sensul de acțiune în desfășurare („caut acum”), iar *रहा* este forma masculină (o femeie spune *रही*).'
  hi.a1.unit26.lesson02.teach.saiz:
    title: Mărimea
    gloss: mărimea
    note: '*साइज़* este un substantiv masculin, deci și cuvintele care îl însoțesc sunt masculine: *मेरा साइज़*.'
    example_gloss: Ce mărime porți?
  hi.a1.unit26.lesson02.teach.apka_saiz_kya:
    title: Întrebi despre mărime
    gloss: Ce mărime porți?
    note: '*कौन सा* („care”) întreabă despre o alegere dintr-o mulțime, iar *सा* se acordă cu substantivul: *कौन सा साइज़*, dar *कौन सी जैकेट*. *आप* este „dumneavoastră”, forma politicoasă pentru un vânzător.'
  hi.a1.unit26.lesson02.teach.mera_saiz_em:
    title: Spui ce mărime porți
    gloss: Port mărimea M.
    note: 'Hindi nu folosește aici un verb pentru „a avea”: *मेरा साइज़ एम है* înseamnă literal „mărimea mea este M”, iar *मेरा* se acordă cu masculinul *साइज़*.'
  hi.a1.unit26.lesson03.teach.kala_neela:
    title: Negru, albastru
    gloss: negru, albastru
    note: Cele două adjective de culoare de bază din această lecție.
    example_gloss:
    - Vreau paltonul în negru.
    - Aveți și acesta în albastru?
  hi.a1.unit26.lesson03.teach.mujhe_vah_jaiket:
    title: Ceri o culoare
    gloss: Vreau paltonul în negru.
    note: '*मुझे ... चाहिए* este modul în care hindi spune „vreau”: dorința se petrece „la mine” (*मुझे*), iar lucrul dorit stă chiar înaintea lui *चाहिए*.'
  hi.a1.unit26.lesson03.teach.kya_apke_pas:
    title: Întrebi despre altă culoare
    gloss: Aveți și acesta în albastru?
    note: '*आपके पास ... है?* („la dumneavoastră ... este?”) este modul politicos de a întreba „aveți ...?”, iar *भी* („și, de asemenea”) stă după cuvântul la care se adaugă.'
  hi.a1.unit26.lesson04.teach.kya_yah_jaiket:
    title: Întrebi dacă se potrivește
    gloss: Îți vine bine acest palton?
    note: 'Hindi spune că hainele „vin bine”: *ठीक आती है*. Verbul se acordă cu obiectul, deci un *जैकेट* feminin cere *आती*, iar un *स्वेटर* masculin ar cere *आता*.'
  hi.a1.unit26.lesson04.teach.yah_ekdam_theek:
    title: Confirmi că îți vine bine
    gloss: Îmi vine bine.
    note: '*एकदम* („întru totul”) dă sensul „se potrivește perfect”; *आती है* se acordă cu femininul *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_chhotee:
    title: Prea mic
    gloss: Este prea mic.
    note: '*बहुत* stă înaintea adjectivului și aici dă sensul de „prea”: *बहुत छोटी*. Adjectivul se acordă cu femininul *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_baree:
    title: Prea mare
    gloss: Este prea mare.
    note: 'Același tipar cu *बड़ी*: *बड़ा* devine *बड़ी* pentru un substantiv feminin, deci *बहुत बड़ी*.'
  hi.a1.unit26.lesson05.teach.nabbe:
    title: Nouă sute
    gloss: nouă sute
    note: '*नौ सौ* este numărul 900, folosit în prețul gecii.'
    example_gloss: Geaca costă nouă sute de rupii.
  hi.a1.unit26.lesson05.teach.jaiket_kee_keemat:
    title: Spui un preț
    gloss: Geaca costă nouă sute de rupii.
    note: 'Hindi spune „prețul gecii este ...”: *जैकेट की कीमत नौ सौ रुपये है*. *की* se acordă cu femininul *कीमत*, nu cu *जैकेट*.'
  hi.a1.unit26.lesson05.teach.sardee_kee_jaiket:
    title: Citește un bon de casă
    gloss: 'Geacă de iarnă: mărimea M, culoarea neagră. Preț: nouă sute de rupii. Această geacă se potrivește perfect și este călduroasă.'
    note: Urmărește mărimea, culoarea, prețul și cele două calități menționate despre palton.
    glosses:
      सर्दी: de iarnă (geacă)
      साइज़: mărime
      रंग: culoare
      काला: negru
      कीमत: preț
      नौ: nouă
      सौ: o sută
      रुपये: rupii
      जैकेट: palton
      आती: se potrivește
      गर्म: cald
  hi.a1.unit26.lesson06.teach.priya_yah_jaiket:
    title: Priya observă geaca
    gloss: 'Priya: Geaca asta e frumoasă! Ce mărime ești?'
    note: '*अच्छी* se acordă cu femininul *जैकेट*. *तुम्हारा* este „al tău”, forma informală folosită între prieteni.'
  hi.a1.unit26.lesson06.teach.arjun_mera_saiz:
    title: Arjun cere să o probeze
    gloss: 'Arjun: Port mărimea M. Pot s-o probez?'
    note: '*पहनकर देखना* („a îmbrăca și a vedea”) este modul în care hindi spune „a proba”. *सकता हूँ* înseamnă „pot” sau „am voie”, iar o femeie spune *सकती हूँ*.'
  hi.a1.unit26.lesson06.teach.priya_zaroor_kya:
    title: Priya întreabă despre potrivire
    gloss: 'Priya: Sigur. Ți se potrivește?'
    note: '*यह* înseamnă „ea” sau „aceasta”, iar *आती* se acordă cu femininul *जैकेट*.'
  hi.a1.unit26.lesson06.teach.arjun_han_yah:
    title: Arjun confirmă
    gloss: 'Arjun: Da, mi se potrivește perfect și e călduroasă.'
    note: 'Corespunde întocmai cu bonul citit mai devreme: este același palton.'
  hi.a1.unit26.lesson06.teach.priya_barhiya_tum:
    title: Priya întreabă despre culoare
    gloss: 'Priya: Grozav! O iei neagră sau albastră?'
    note: '*या* („sau”) oferă o alegere. Al doilea *रंग* poate fi omis: *काले रंग में ... या नीले में*. *तुम* este forma informală.'
  hi.a1.unit26.lesson06.teach.arjun_main_ise:
    title: Arjun se hotărăște
    gloss: 'Arjun: O iau neagră.'
    note: '*लूँगा* este viitorul verbului *लेना* („a lua”), verbul obișnuit pentru a te hotărî la o cumpărătură. O femeie spune *लूँगी*.'
  hi.a1.unit26.lesson06.teach.main_leta_hoon:
    title: लेता हूँ și लेता है
    gloss: Eu iau, el ia.
    note: '*-ता* este terminația acțiunii obișnuite și se acordă cu subiectul, iar *हूँ* însoțește pe *मैं*, în timp ce *है* însoțește pe *वह*.'
