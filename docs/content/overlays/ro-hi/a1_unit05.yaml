teaching:
  hi.a1.unit05.lesson01.teach.parivar:
    title: Familia
    gloss: familie
    note: Cuvântul general pentru „familie”, folosit în toată unitatea.
    example_gloss: Familia mea este în India.
  hi.a1.unit05.lesson01.teach.pita_maa:
    title: Tată, mamă
    gloss: tată, mamă
    note: Când îi prezinți, ambii cer forma de plural de respect *hain* în loc de *hai*, iar *pita* cere *mere* în loc de *mera* -- vezi nota despre formele de respect de mai târziu în această lecție.
    example_gloss:
    - Acesta este tatăl meu.
    - Aceasta este mama mea.
  hi.a1.unit05.lesson01.teach.bhai_behan:
    title: Frate, soră
    gloss: frate, soră
    note: 'Perechea de bază a unității pentru contrastul de acord mera/meri: *mera bhai*, *meri behan*.'
    example_gloss:
    - Am un frate.
    - Am o soră.
  hi.a1.unit05.lesson01.teach.ek_as_article:
    title: Ek ca „un/o”
    gloss: '*Ek* înseamnă „unu” la numărat și funcționează și ca „un/o”: *mera ek bhai hai*.'
    note: Este același cuvânt învățat deja ca număr 1 -- hindi nu are un articol nehotărât separat.
  hi.a1.unit05.lesson01.teach.mata_pita:
    title: Părinții
    gloss: părinți
    note: Un compus din *mata* (mamă, formal) și *pita* (tată) -- cuvântul standard pentru „părinți”.
    example_gloss: Părinții mei locuiesc în Delhi.
  hi.a1.unit05.lesson01.teach.mera_meri_note:
    title: Mera vs. meri
    gloss: '*Mera* se folosește cu cuvinte masculine, *meri* cu cuvinte feminine: *mera bhai*, *meri behan*.'
    note: Punctul gramatical central al unității -- posesivul se acordă cu persoana sau lucrul posedat, nu cu vorbitorul.
  hi.a1.unit05.lesson01.teach.mere_honorific_note:
    title: Mere pentru persoanele mai în vârstă respectate
    gloss: 'Din respect pentru persoanele în vârstă, *mera* devine *mere* și *hai* devine *hain*, chiar și pentru o singură persoană: *yeh mere pita hain* (Acesta este tatăl meu).'
    note: Este o convenție reală, nu o greșeală -- membrii respectați ai familiei, la singular (tatăl, bunicul), cer această formă care pare de plural. Mama și bunica păstrează *meri*, dar verbul merge totuși la plural (*hain*), din același motiv.
  hi.a1.unit05.lesson01.teach.yah_mera_bhai_hai:
    title: Acesta este fratele meu
    gloss: Acesta este fratele meu.
    note: Forma masculină simplă -- pentru un frate nu e nevoie de forma de respect.
  hi.a1.unit05.lesson01.teach.yah_meri_behan_hai:
    title: Aceasta este sora mea
    gloss: Aceasta este sora mea.
    note: Forma feminină simplă, acordată cu *behan*.
  hi.a1.unit05.lesson01.teach.yah_kaun_hai:
    title: Cine este acesta?
    gloss: Cine este acesta? / Cine este aceasta?
    note: O întrebare simplă și utilă pentru a prezenta membrii familiei.
  hi.a1.unit05.lesson02.teach.dada_dadi:
    title: Bunic, bunică pe linie paternă
    gloss: bunic pe linie paternă, bunică pe linie paternă
    note: Părinții tatălui tău, în mod special -- vezi nota de mai târziu din această lecție, care îi compară cu părinții mamei tale.
    example_gloss:
    - Bunicul meu locuiește în Delhi.
    - Bunica mea locuiește în Delhi.
  hi.a1.unit05.lesson02.teach.nana_nani:
    title: Bunic, bunică pe linie maternă
    gloss: bunic pe linie maternă, bunică pe linie maternă
    note: Părinții mamei tale -- hindi folosește o pereche de cuvinte complet diferită față de cea pentru părinții tatălui.
    example_gloss:
    - Bunicul meu (din partea mamei) locuiește în Mumbai.
    - Bunica mea (din partea mamei) locuiește în Mumbai.
  hi.a1.unit05.lesson02.teach.dilli_mumbai:
    title: Delhi, Mumbai
    gloss: Delhi, Mumbai
    note: Două orașe mari din India, folosite în exemplele acestei lecții pentru locul unde locuiesc membrii familiei.
    example_gloss:
    - Familia mea locuiește în Delhi.
    - Fratele meu locuiește în Mumbai.
  hi.a1.unit05.lesson02.teach.dada_nana_note:
    title: Două perechi de bunici
    gloss: 'Părinții tatălui: *dada-dadi*. Părinții mamei: *nana-nani*.'
    note: În română, „bunic/bunică” este o singură pereche de cuvinte pentru ambele părți ale familiei, iar partea se precizează separat; în hindi există cuvinte complet diferite, în funcție de partea familiei.
  hi.a1.unit05.lesson02.teach.rehna_verb:
    title: Locuiește (rehna)
    gloss: locuiește (masculin / feminin / plural de respect)
    note: 'Verbul pentru „a locui”: *rehta hai* pentru un bărbat, *rehti hai* pentru o femeie, *rehte hain* pentru mai multe persoane sau pentru o persoană în vârstă respectată.'
    example_gloss:
    - Fratele meu locuiește în Delhi.
    - Sora mea locuiește în Mumbai.
    - Bunicii mei locuiesc în Delhi.
  hi.a1.unit05.lesson02.teach.tumhara_tumhari:
    title: Al tău (informal)
    gloss: al tău, a ta (informal, masculin / feminin)
    note: Posesivul informal, de registru *tum*, care se acordă cu substantivul posedat exact ca *mera/meri*.
    example_gloss:
    - Unde locuiește fratele tău?
    - Unde locuiește sora ta?
  hi.a1.unit05.lesson02.teach.mera_tumhara_note:
    title: Mera și tumhara împreună
    gloss: '*Mera* și *tumhara* se folosesc amândouă cu cuvinte masculine; *meri* și *tumhari* se folosesc amândouă cu cuvinte feminine: *mera bhai*/*tumhara bhai*, *meri behan*/*tumhari behan*.'
    note: Același model de acord din prima lecție, care se aplică acum și lui *tumhara*.
  hi.a1.unit05.lesson03.teach.bada_badi:
    title: Mai mare / mare
    gloss: mai mare, mare (masculin / feminin)
    note: Ca în română („fratele mai mare”), hindi marchează un frate sau o soră mai în vârstă printr-un adjectiv care se acordă, nu printr-un cuvânt separat.
    example_gloss:
    - Fratele meu mai mare locuiește în Delhi.
    - Sora mea mai mare locuiește în Mumbai.
  hi.a1.unit05.lesson03.teach.chota_choti:
    title: Mai mic / mic
    gloss: mai mic, mic (masculin / feminin)
    note: Perechea lui *bada/badi*, pentru un frate sau o soră mai mică.
    example_gloss:
    - Fratele meu mai mic este acum student.
    - Sora mea mai mică este acum studentă.
  hi.a1.unit05.lesson03.teach.bada_chota_note:
    title: Acordul bada/chota
    gloss: '*Bada* și *chota* se folosesc cu cuvinte masculine, *badi* și *choti* cu cuvinte feminine: *bada bhai*, *badi behan*.'
    note: Același acord masculin/feminin văzut deja la *mera/meri*, aplicat acum cuvintelor care descriu vârsta.
  hi.a1.unit05.lesson03.teach.aur_lekin_bhi:
    title: Și, dar, de asemenea
    gloss: și, dar, de asemenea
    note: Trei cuvinte de legătură de bază, reluate în dialogul final al lecției.
    example_gloss:
    - Fratele meu și sora mea locuiesc în Delhi.
    - Fratele meu locuiește în Delhi, dar sora mea locuiește în Mumbai.
    - Am și eu o soră.
  hi.a1.unit05.lesson03.teach.accha_phir_milenge:
    title: Bine, ne vedem mai târziu
    gloss: Bine! Ne vedem mai târziu.
    note: O încheiere prietenoasă, reluată din vocabularul de despărțire din unitatea 2.
  hi.a1.unit05.lesson03.teach.theek_hai_phir_milte_hain:
    title: În regulă, pe curând
    gloss: În regulă, pe curând!
    note: Răspunsul informal la încheierea de mai sus, ca în schimburile de încheiere din unitățile anterioare.
  hi.a1.unit05.lesson03.teach.dialogue.line01:
    title: Arjun întreabă despre familia Priyei
    gloss: Arjun întreabă unde locuiește familia Priyei.
    note: Reia modelul *parivar kahan rehta hai* din această unitate.
  hi.a1.unit05.lesson03.teach.dialogue.line02:
    title: Priya vorbește despre părinții și fratele ei
    gloss: Priya spune că părinții ei locuiesc în Delhi și că are și un frate mai mare.
    note: Combină *mata-pita*, *rehte hain* și *bada bhai bhi hai*.
  hi.a1.unit05.lesson03.teach.dialogue.line03:
    title: Arjun întreabă despre bunicii ei
    gloss: 'Arjun spune „Aha!” și întreabă: și bunicii tăi?'
    note: '*Tumhare* este forma de respect a lui *tumhara*, folosită pentru persoanele în vârstă, exact ca *mere* pentru *mera* (nota despre forma de respect din lecția 1).'
  hi.a1.unit05.lesson03.teach.dialogue.line04:
    title: Priya vorbește despre ambele perechi de bunici
    gloss: Priya spune că bunicii ei din partea tatălui locuiesc în Delhi, dar bunicii din partea mamei locuiesc în Mumbai.
    note: Folosește *lekin* pentru a contrasta orașele celor două perechi de bunici, întărind distincția dada-dadi/nana-nani din lecția 2.
  hi.a1.unit05.lesson03.teach.dialogue.line05:
    title: Arjun amintește de propria soră
    gloss: Arjun spune că are și el o soră mai mică.
    note: Reia *bhi* și *choti behan*.
  hi.a1.unit05.lesson03.teach.dialogue.line06:
    title: Priya încheie conversația
    gloss: 'Priya spune: bine, ne vedem mai târziu.'
    note: Reia fraza de încheiere a acestei lecții.
  hi.a1.unit05.lesson03.teach.dialogue.line07:
    title: Arjun răspunde
    gloss: 'Arjun este de acord și spune: pe curând.'
    note: Reia fraza de răspuns a acestei lecții.
